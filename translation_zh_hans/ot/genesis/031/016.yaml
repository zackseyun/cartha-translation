base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: zh_hans
  text: 因为上帝从我们父亲那里取走[a]的一切财富，都属于我们和我们的儿女。现在，上帝对你所说的一切，你都照着做吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “取走”或译“救出、解救”。原文动词常有拯救、解救的意思；这里指上帝使财富脱离拉班的控制，归给雅各一家。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明拉结和利亚赞同雅各的理由；现代汉语用“因为”自然清楚。
- source_word: כָל הָעֹשֶׁר
  choice: 一切财富
  rationale: עֹשֶׁר指财富、财物；“财富”既自然，也足以涵盖叙事中的牲畜和其他产业。
- source_word: הִצִּיל
  choice: 夺回
  rationale: 该动词常有“救出、解救”之义；本处宾语是财富，语境指上帝使财富脱离拉班而归给雅各一家。“夺回”保留了从他人控制下取出的意味，并呼应姐妹认为这些原应归她们及儿女所有的判断。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本叙事中指独一的真神；“上帝”是现代标准普通话中庄重而通行的译法。
- source_word: מֵאָבִינוּ
  choice: 从我们父亲那里
  rationale: 介词מן表示来源；这样翻译既贴近原文，也符合现代汉语表达。
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: 都属于我们和我们的儿女
  rationale: 原文以介词结构表达归属或权益；“属于”把汉语中隐含的所有关系清楚表达出来。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 标示从理由转到劝勉；汉语无需额外加入强因果连接词。
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: 上帝对你所说的一切
  rationale: 保留כֹּל אֲשֶׁר的全称范围，同时符合自然、庄重的汉语语序。
- source_word: עֲשֵׂה
  choice: 你都照着做吧
  rationale: 祈使语气由前句内容补足宾语；“照着做”明确指遵行上帝所说的一切，“吧”使亲属间的劝勉语气自然，而不削弱其明确性。
theological_decisions:
- issue: 上帝对拉班财富所采取的行动
  choice: 译作“夺回”
  alternative: “取走”或“救出”
  rationale: 原词常用于拯救或解救，但这里被作用的对象是财富。结合上下文，姐妹认为父亲已经耗尽她们所得的身价，而这些财富如今理当归她们及儿女所有。“夺回”既保留原词从控制中解脱出来的力度，也避免把经文简化成中性的财产转移；脚注列出较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们父亲”保留姐妹共同说话的视角；末句保持直接劝勉。脚注标记紧跟存在词义张力的动词。
