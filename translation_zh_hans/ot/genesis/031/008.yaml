base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: zh_hans
  text: 如果他这样说：‘有斑点的就作你的工钱’，羊群所生的小羊就全都有斑点；如果他这样说：‘有条纹的就作你的工钱’，羊群所生的小羊就全都有条纹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: 有斑点的
  rationale: 指带斑点的牲畜；采用自然、明确的现代汉语表达，并在前后两处保持一致。
- source_word: עֲקֻדִּים
  choice: 有条纹的
  rationale: 此词在上下文中指有条纹或条斑的牲畜；译作“有条纹的”可与“有斑点的”清楚区分。
- source_word: שְׂכָרֶךָ
  choice: 你的工钱
  rationale: שָׂכָר在这里指雅各劳作所得的报酬；“工钱”符合牧工语境，也通俗自然。
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: 羊群所生的就全都……
  rationale: 希伯来文直述“全羊群便生下”；汉语补出隐含的幼畜对象，使语意自然，同时避免误解为母羊本身变成相应花色。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“如果他这样说”保留两次כֹּה所表达的指示意味；平行句式尽量对应原文。引语中的“有斑点的／有条纹的”按群体类别理解。
