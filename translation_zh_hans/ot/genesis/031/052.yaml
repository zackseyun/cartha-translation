base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: zh_hans
  text: 这石堆是见证[a]，这石柱也是见证：我不会越过这石堆到你那里；你也不会越过这石堆和这石柱到我这里，为要加害[c][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“这石堆作见证，这石柱也作见证”。希伯来文以平行说法表明两个界标都为双方的约定作证。
    reason: lexical_alternative
  - marker: b
    text: “越过”也可译作“跨过”；这里指跨越作为边界标志的石堆和石柱。
    reason: lexical_alternative
  - marker: c
    text: “为要加害”指怀着伤害或敌对的意图，并不是说任何越过界标的行动本身都被禁止。原文把这个短语放在全句末尾；它与前面双方的平行约束之间的具体句法范围不必在译文中过度限定。
    reason: cultural_note
lexical_decisions:
- source_word: עֵד / וְעֵדָה
  choice: 可以作证
  rationale: 两处在句中平行，说明石堆和柱子具有见证双方约定的作用。译作“可以作证”符合现代汉语表达，同时保留物件被拟人化为见证的意象。
- source_word: גַּל
  choice: 石堆
  rationale: 上下文所指是堆起作为界标的石块；“石堆”比单说“堆”更明确，也保留具体形象。
- source_word: מַצֵּבָה
  choice: 柱子
  rationale: 指竖立起来的石制标志物。“柱子”自然易懂；“立石”虽更具体，却不如前者适合普通读者。
- source_word: אִם
  choice: 不会（引出誓约条款）
  rationale: אִם 在誓言或立约语境中并非普通的假设条件，而是引出受见证的约束内容。汉语用“不会”清楚传达双方承诺而不生硬照译为“如果”。
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: 越过
  rationale: 这里指越过作为边界标志的石堆和柱子。“越过”兼顾空间动作与界线含义。
- source_word: אֵלֶיךָ / אֵלַי
  choice: 到你那里 / 到我这里
  rationale: 保留介词所表达的朝向，不自行把方向词译成“攻击你／我”；敌对目的由末尾 לְרָעָה 表达。
- source_word: לְרָעָה
  choice: 存心加害
  rationale: 该短语表示带着恶意或以伤害对方为目的，并非绝对禁止任何跨越界标的行动。“存心加害”是自然、明确的现代汉语。
theological_decisions: []
