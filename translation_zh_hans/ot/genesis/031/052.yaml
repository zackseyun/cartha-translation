  register: 采用庄重而自然的现代标准汉语。“石堆”“柱子”保留具体界标意象；两个“不会”呈现誓约中的平行约束。末尾保留“存心加害”的位置，使其可统摄双方的行动，同时以脚注说明其语用范围。
