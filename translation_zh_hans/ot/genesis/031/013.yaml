source:
  edition: WLC
  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: zh_hans
  text: “我是伯特利的神[a]；你在那里膏抹了石柱，也在那里向我许了愿。现在，起来离开这地，回到你的故乡去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯特利”意为“神的家”，这里是地名。
    reason: cultural_note
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: 伯特利的神
  rationale: 定冠词与地点名构成说话者的自我辨识；“伯特利”按通行中文地名音译，不译作“神的家”。
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: 你在那里膏立了石柱
  rationale: מָשַׁח 表示以油膏抹，מַצֵּבָה 指竖立的石柱；“膏立石柱”既保留具体仪式动作，又自然简洁，并与创世记28:18的事件相连。
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: 也在那里向我许了愿
  rationale: 希伯来文以同根动词和名词加强表达；现代汉语用“许了愿”自然传达其意义，“向我”保留受事关系。
- source_word: עַתָּה קוּם צֵא
  choice: 现在，起来离开
  rationale: 保留由回顾转入命令的“现在”；קוּם 是促使行动的命令，צֵא 在离开一片地域的语境中自然译为“离开”。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: אֶרֶץ 在此指雅各当时居住的地域，而非全世界；“这地”符合中文圣经叙事的庄重语体。
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: 回到你的故乡去
  rationale: מוֹלֶדֶת 可指出生地、原乡或亲族背景；与 אֶרֶץ 连用时，“故乡”自然保留原籍之地的广度，不局限为亲属。
theological_decisions:
- issue: 说话者自称“伯特利的神”
  choice: 我是伯特利的神
  alternative: 我是曾在伯特利向你显现的神／我是在伯特利的神
  rationale: 原文直接以“伯特利的神”辨明说话者，并联系雅各此前在伯特利的经历；不扩写“显现”，也不把神理解为仅受地域限制的神明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“膏立石柱”保留古代具体行动；“许了愿”避免生硬直译“许愿许了一个愿”。英文咨询层的脚注标记与内容显然错位：其[a]正文落在“Bethel”后，却解释同根词结构；[b]落在“this land”后，却解释“Bethel”。本稿依希伯来原文及脚注实际内容校正，只在“伯特利”后设置文化说明[a]。
