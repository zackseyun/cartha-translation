  source_fidelity: “我是伯特利的神”准确反映了带定冠词的自我辨识及地名。命令链“现在，起来离开这地，回到你的故乡去”也忠实传达原文。惟“膏立石柱”在现代汉语中通常指膏抹并立某人为职，容易将对石柱施油的动作误解为任立或设立石柱；宜改为“膏抹了石柱”。
