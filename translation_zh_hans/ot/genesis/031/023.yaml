base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: zh_hans
  text: 拉班带着他的亲族[a]追赶雅各，走了七天的路程，在基列山区[b]追上了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的弟兄”；希伯来语这个词既可专指兄弟，也可泛指亲属或同族的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“在基列山”；希伯来语既可指一座山，也可指基列一带的山区。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: 他的亲族
  rationale: אָח既可狭义指兄弟，也可广义指同族亲属；本处拉班召集的应是家族成员，因此译为“亲族”，同时以脚注保留“弟兄”的可能。
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: 追赶雅各
  rationale: רָדַף加אַחַר表示在后面追赶。现代汉语用“追赶”即可自然表达；将代词所指的雅各明说，可避免连续多个“他”造成歧义。
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: 走了七天的路程
  rationale: דֶּרֶךְ在这里表示行程或路程的长度；此译既保留“路程”的语义，也符合现代汉语表达。
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: 追上了他
  rationale: דבק在追赶语境中表示赶上或追及，并非通常所说的“紧贴”；“追上”简洁自然，也与前面的追赶相呼应。
- source_word: בְּהַר הַגִּלְעָד
  choice: 在基列山区
  rationale: הַר既可指一座山，也可指山地或山区；语境很可能指基列的山地范围，因此正文采用区域性译法，并在脚注保留特定山岳的理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。为避免希伯来语连续代词直译成汉语后所产生的指代混乱，正文明确写出“拉班”和“雅各”；“走了七天的路程”保留原文דֶּרֶךְ的行程含义。
