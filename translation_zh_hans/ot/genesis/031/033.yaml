base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: zh_hans
  text: 拉班进了雅各的帐棚，又进了利亚的帐棚，也进了两个女仆的帐棚，却没有找到[a]。随后，他从利亚的帐棚出来，进了拉结的帐棚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文没有说明“找到”的宾语；从上下文看，所指的是拉班正在寻找的家神。
    reason: 说明原文省略的宾语及其上下文所指。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 进了
  rationale: בוא与介词בְּ连用，表示进入某处；“进了”自然、简洁，也保留了叙事中的移动方向。
- source_word: אֹהֶל
  choice: 帐棚
  rationale: 原词通常指帐棚；在族长时代的生活背景中保留这一具体住所形式，比泛化为“住处”更贴切。
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: 两个婢女
  rationale: אָמָה指处于从属身份的女性仆役；“婢女”在现代中文中简明而庄重，并保留其性别和身份含义。
- source_word: וְלֹא מָצָא
  choice: 却没有找到[a]
  rationale: 希伯来文没有明说“找到”的宾语，因此正文不补入“神像”等具体对象，以保留原文的省略；“却”体现逐处搜查而未有所获的转折。
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: 随后，他从利亚的帐棚出来
  rationale: יצא表示从里面出来；“随后”自然表达叙事中连续发生的动作。
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: 又进了拉结的帐棚
  rationale: 与本节前面的同一动词保持一致，清楚呈现拉班逐个帐棚搜查的过程。
theological_decisions:
- issue: “没有找到”的隐含宾语
  choice: 正文保留宾语未明说的表达，并以脚注交代上下文所指
  alternative: 正文直接译作“却没有找到那些神像”或“却没有找到它们”
  rationale: 原文在本节没有宾语。上下文表明拉班寻找的是家神，但把这一对象直接写入正文会消除原文的省略，因此采用正文保留、脚注说明的方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“进了……又进了……”保留原文逐处搜查的节奏；使用“帐棚”而非较泛的“住处”，使用“婢女”表达女性仆役身份。
