base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: zh_hans
  text: “现在，来吧，我们两人立约[a]，让它在你我之间作见证。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“切约”；这是希伯来语中表示缔结或确立盟约的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出下一步提议；现代汉语中“现在”已能自然表达这一转折推进。
- source_word: לְכָה
  choice: 来吧
  rationale: 该词虽源于“走、去”，此处用作邀请或催促；“来吧”符合语境和现代汉语习惯。
- source_word: נִכְרְתָה בְרִית
  choice: 我们立约／你我立约
  rationale: 希伯来语直译为“切约”，是表示缔结盟约的固定表达；汉语以“立约”最自然，并保留盟约的正式关系含义。
- source_word: אֲנִי וָאָתָּה
  choice: 你我
  rationale: 明确保留立约的双方，同时采用自然、简洁的现代汉语次序。
- source_word: וְהָיָה לְעֵד
  choice: 让它……作见证
  rationale: 承接前面的共同提议，表达意愿或目的；“作见证”准确传达 לְעֵד 所表示的功能。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 在你我之间
  rationale: 保留双方之间这一明确关系，又符合现代汉语表达习惯。
theological_decisions:
- issue: וְהָיָה 中省略主语的指向
  choice: 正文用“它”保留所指的开放性，并加注说明
  alternative: 明确译为“让这约”或“让这证物”
  rationale: 原文未明说主语，而且阳性形式与阴性名词 בְרִית（约）并不一致；上下文也将提到作为证据的石堆，因此不宜在正文中替原文排除可能解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“来吧”保留对话中的邀请语气；“立约”沿用普通读者熟悉的圣经核心词汇。“它”有意保留原文的指代含混，脚注说明而不在正文中强行消解。
