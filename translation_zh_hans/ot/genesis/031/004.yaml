  yaml_path: translation/ot/genesis/031/004.yaml
  text: So Jacob sent and called Rachel and Leah to the field[a], to his flock[b],
translation:
  language: zh_hans
  text: 雅各就派人去叫拉结和利亚到田野里他羊群所在的地方。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“到田野，到他的羊群那里。”末尾的短语很可能进一步说明会面的地点。
    reason: 原文连续使用两个表示方向或地点的短语，二者的句法关系略有含混；正文按后一短语具体说明前一地点来翻译。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去
  rationale: שׁלח本义为“派遣、打发”。本句没有明说所派的是谁；译作“派人去”符合汉语叙事习惯，也说明雅各不是亲自去叫，但不增添具体使者身份。
- source_word: וַיִּקְרָא
  choice: 叫
  rationale: קרא与介词לְ及人物连用，在这里表示叫人前来。“叫”简洁自然，符合本段平实的叙事语体；“召来”略显正式。
- source_word: לְרָחֵל וּלְלֵאָה
  choice: 拉结和利亚
  rationale: 采用现代中文圣经语境中通行且易于辨认的人名译法。
- source_word: הַשָּׂדֶה
  choice: 到田野里
  rationale: שׂדה可指田地或野外开阔地；此处是羊群所在的户外地点，译作“田野”自然，并保留方向含义。
- source_word: אֶל־צֹאנוֹ
  choice: 他羊群所在的地方
  rationale: אֶל通常表示“到、向”，צֹאן指羊群或小型牲畜群。这里末尾短语很可能进一步说明田野中的具体地点；如此表达能避免中文中连续两个“到”造成误解，同时保留其地点限定作用。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语叙事语体。“派人去叫”准确传达两个连续动词的动作关系；“田野里他羊群所在的地方”使原文略显紧凑的地点结构在中文中清楚可读，同时以脚注保留较直译的可能。
