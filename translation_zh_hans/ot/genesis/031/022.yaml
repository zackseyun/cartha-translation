  yaml_path: translation/ot/genesis/031/022.yaml
  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: zh_hans
  text: 第三天，拉班得知雅各已经逃走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 得知
  rationale: 该词为 נגד 的使役被动式，表示消息被传达给拉班。现代汉语用“拉班得知”自然地表达这一被动传讯事件，同时不增添未说明的报信者。
- source_word: לְלָבָן
  choice: 拉班
  rationale: 介词 לְ 标明消息的接收者；汉语按自然语序表达为“拉班得知”。人名采用通行译名。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 原文直指“第三天”，并未明说“此后”，故不添加额外的时间说明。
- source_word: כִּי
  choice: （由宾语小句表达）
  rationale: 此处 כִּי 引出所传消息的内容。汉语“得知雅各……”无需另译连接词，宾语小句已清楚表达间接引语。
- source_word: בָרַח
  choice: 已经逃走了
  rationale: ברח 表示逃离、逃走；“已经……了”表明雅各的逃走先于拉班获知消息，符合叙事时序，又避免把词义强化为“逃脱”。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions: []
