base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: zh_hans
  text: 这二十年来，我一直在你家：我为你的两个女儿服侍你十四年，又为你的羊群服侍你六年；你却十次更改我的工钱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: 我在你家这二十年
  rationale: 将希伯来语无动词的时间性开头自然融入汉语句式；“这二十年”保留 זֶה 的指示意味，第一人称关系由“我在”表达。
- source_word: בְּבֵיתֶךָ
  choice: 在你家
  rationale: בַּיִת 可指房屋或家室；“在你家”既贴近字面，也符合此处长期居住并服役的语境。
- source_word: עֲבַדְתִּיךָ
  choice: 服侍你
  rationale: עבד 在这里指为拉班效力、劳作；“服侍”兼顾劳动与从属关系，比单纯“为你工作”更贴近原词。
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: 服侍你十四年，为了你的两个女儿
  rationale: 介词 בְּ 表示服役所为的对象或代价；“为了”以自然现代汉语表达婚姻劳役安排，又不额外解释。
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: 又服侍你六年，为了你的羊群
  rationale: 补出原文承前省略的“服侍你”，使汉语清楚；צֹאן 是绵羊、山羊等小型牲畜的集合称谓，“羊群”较准确。
- source_word: וַתַּחֲלֵף
  choice: 你却……更改
  rationale: Hiphil 形式表示改变或替换；“却”显明雅各陈述中的转折和控诉语气，“十次”已体现反复，无须另加“不断”。
- source_word: מַשְׂכֻּרְתִּי
  choice: 我的工钱
  rationale: 该词指受雇所得的报酬；“工钱”在现代汉语中自然、明确，适合劳动关系语境。
- source_word: עֲשֶׂרֶת מֹנִים
  choice: 十次
  rationale: 这是表示反复次数的习语；直译为“十个计数”会晦涩，“十次”准确传达惯用含义。
theological_decisions: []
