source:
  edition: WLC
  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: zh_hans
  text: “愿亚伯拉罕的上帝和拿鹤的神，就是他们父亲的神，在你我之间判断。[a]”雅各就指着他父亲以撒的“敬畏”起誓。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作：“愿亚伯拉罕的上帝和拿鹤的上帝，就是他们父亲的上帝，在你我之间判断。”希伯来文既可能把这些称谓都指向同一位神，也可能保留彼此有别的意味；而“判断”在原文中是复数形式。
    reason: 保留神明身份及语法数的一语多义。
  - marker: b
    text: “敬畏”原文直译为“惧怕”或“敬畏”，在这里作为对神的罕见称谓；“以撒的‘敬畏’”不是指以撒的情绪。
    reason: 说明特殊神圣称谓的字面意义及其在中文中的非常规用法。
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: 亚伯拉罕的上帝
  rationale: אֱלֹהֵי虽采用复数形态，在这里指亚伯拉罕所信的单一神明；“上帝”自然表达这一指称。
- source_word: וֵאלֹהֵי נָחוֹר
  choice: 和拿鹤的神
  rationale: 采用“神”而不重复“上帝”，以保留拉班的混合式祖先信仰表述，不先行断定拿鹤的神与亚伯拉罕的上帝完全相同。
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: 就是他们父亲的神
  rationale: 将该短语理解为对前面称谓的同位说明；“就是”使中文关系清楚，但其究竟把前述神明视为同一位还是共同的祖先神，仍由脚注说明其歧义。
- source_word: יִשְׁפְּטוּ
  choice: 愿……判断
  rationale: 未完成式在祈愿式誓约语境中表达愿望；希伯来语动词为复数，也与前面并列而含混的主语相呼应。
- source_word: בֵינֵינוּ
  choice: 在你我之间
  rationale: 按此处双方立约的语境自然表达“在我们之间”。
- source_word: וַיִּשָּׁבַע
  choice: 就……起誓
  rationale: 用简洁的叙事衔接表达连续发生的动作。
- source_word: בְּפַחַד אָבִיו יִצְחָק
  choice: 指着他父亲以撒所畏惧的那一位
  rationale: פַחַד本义为“惧怕、畏惧”，在此作为指向神的特殊称谓。中文用“所畏惧的那一位”既保留其异常用法，又比生硬的“以撒的畏惧”更容易理解。
theological_decisions:
- issue: 拉班所提亚伯拉罕的上帝、拿鹤的神和他们父亲的神是否都是同一位
  choice: 正文以“上帝”与“神”的措辞差异保留张力，并将“他们父亲的神”作为同位说明。
  alternative: 统一译为“亚伯拉罕的上帝、拿鹤的上帝，就是他们父亲的上帝”。
  rationale: 原文重复使用אֱלֹהֵי，却搭配复数动词；拉班的祖先式祈求与雅各随后独特的起誓对象也形成对照，因此不宜在译文中完全消除歧义。
- issue: 如何处理雅各誓言中的פַחַד
  choice: 译作“他父亲以撒所畏惧的那一位”。
  alternative: “他父亲以撒的畏惧”或“他父亲以撒所敬畏的上帝”。
  rationale: 前者最贴近字面却不够自然，后者则把特殊的神圣称谓解释得过于明确；所选译法兼顾可懂度与原文的独特神学表达。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“愿……判断”保持誓约祈愿语气；“所畏惧的那一位”有意保留原文称谓的陌生感，但避免难懂的机械直译。
