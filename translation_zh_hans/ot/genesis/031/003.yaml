base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: zh_hans
  text: 雅威对雅各说：“你要回到你祖先的土地，回到你的亲族[a]那里去；我必与你同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲族”或译“出生地”“原乡”。希伯来语这个词可指亲族，也可指人的出生地或原乡；此处语境可有这两方面的关联。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对……说
  rationale: 前缀 וַ 推进叙事；现代汉语无需机械译出“然后”，上下文已自然表达事件承接。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见学术拟音译作专名“雅威”，不以“主”这一称号替代，也不采用源自后期混合读法的“耶和华”。
- source_word: שׁוּב
  choice: 回到
  rationale: 该命令式表示返回原先所属之地；“回到”自然、明确，并保留方向意义。
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: 回到你祖先之地
  rationale: אֲבוֹת 字面为“父辈”，在此泛指历代先祖；“祖先之地”既准确又符合现代汉语表达。
- source_word: וּלְמוֹלַדְתֶּךָ
  choice: 到你的本族那里去
  rationale: מוֹלֶדֶת 可指亲族，也可指出生地或故土；正文采用此处较合语境的亲族义，并用脚注保留地理义的可能。
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: 我必与你同在
  rationale: 直陈雅威将与雅各同在的应许；“必”在庄重而自然的现代汉语中表达确定的未来承诺。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。正文以拟音“雅威”保留其专名性质，避免用称号“主”取代；“耶和华”则反映另一种传统形式。
- issue: “我必与你同在”的性质
  choice: 保留为直接的同在应许
  alternative: 扩译为保护、赐福或帮助
  rationale: 原文只明说神将与雅各同在；不把这句话收窄或扩展为某一种具体结果，以保留其开放而丰富的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要……；我必……”保留神谕中命令与应许的对应关系。脚注标记置于正文“本族”之后。
