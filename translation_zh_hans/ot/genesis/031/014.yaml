  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: zh_hans
  text: 拉结和利亚回答他，说：“我们在父亲家中还有什么份额和产业吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父亲家中”不仅可指父亲的家庭或住所，也可包括家业和可承继的家产。
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן
  choice: 回答
  rationale: 该叙事形式推进情节并引出对前文的回应；现代汉语以“回答”自然表达，句序本身已体现承接，无须机械加“然后”。
- source_word: רָחֵל וְלֵאָה
  choice: 拉结和利亚
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: וַתֹּאמַרְנָה לוֹ
  choice: 他说
  rationale: 保留原文复数说话动词及间接宾语“对他”；与前面的“回答”合成自然汉语“回答他说”。
- source_word: הַעוֹד לָנוּ
  choice: 我们……难道还有……吗
  rationale: “还有”保留继续存在的时间意味；“难道……吗”体现此处带有预期否定答案的反问语气。
- source_word: חֵלֶק
  choice: 份
  rationale: 在家产与继承语境中，“份”简洁自然，指可分得的一份；与“产业”并列时也避免语义过度重叠。
- source_word: וְנַחֲלָה
  choice: 或产业
  rationale: נַחֲלָה指承继所得的土地、财产或产业；译作“产业”比单指继承行为的“遗产”更能保留其持有物含义。连接词在此可自然理解为列举近义概念，中文用“或”表达“任何份额或产业”的问句范围。
- source_word: בְּבֵית אָבִינוּ
  choice: 在父家里
  rationale: 形式上贴近原文，同时“父家”在中文可涵盖父亲的家庭、家业及宗族财产领域，不限于实体房屋。
