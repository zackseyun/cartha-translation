  yaml_path: translation/ot/genesis/031/047.yaml
  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: zh_hans
  text: 拉班称那石堆为“伊迦尔·撒哈杜他”[a]，雅各却称它为“迦累得”[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊迦尔·撒哈杜他”是亚兰语，意思是“作证的石堆”或“见证之堆”。
    reason: 解释亚兰语名称的含义，并保留“见证/作证”之间的词义幅度。
  - marker: b
    text: “迦累得”是希伯来语，意思是“作证的石堆”或“见证之堆”。
    reason: 解释希伯来语名称的含义，并显明它与前一个亚兰语名称意思相应。
lexical_decisions:
- source_word: וַיִּקְרָא ... לָבָן
  choice: 拉班称
  rationale: קרא 在命名语境中意为“称作、起名”；“称……为”既贴近原文，也符合现代汉语叙事表达。
- source_word: לּוֹ
  choice: 那石堆 / 它
  rationale: 形式上是阳性单数代词，但语境所指是前文堆起的石堆；首次明说“那石堆”可使指代清楚，后一次用“它”避免重复。
- source_word: יְגַר שָׂהֲדוּתָא
  choice: 伊迦尔·撒哈杜他
  rationale: 这是拉班所用的亚兰语名称，正文采用音译以保留两种语言分别命名的叙事作用，并在脚注解释词义。
- source_word: וְיַעֲקֹב
  choice: 雅各却
  rationale: וְ 字面可译“而/和”，此处对照拉班与雅各用不同语言给同一石堆命名，译作“却”自然呈现对比，但不增加更强的敌对意味。
- source_word: גַּלְעֵד
  choice: 迦累得
  rationale: 这是与亚兰语名称意义相应的希伯来语名称；正文音译，以保留命名行为和语言对照，词义置于脚注。
