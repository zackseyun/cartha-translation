  register: 采用现代、庄重而易懂的普通话。“外人”准确呈现女儿们所说自己被父亲排除在家庭权益之外的处境；“吃尽”刻意保留原文鲜明的经济性比喻，脚注说明其强调结构及“银子”的字面可能。
