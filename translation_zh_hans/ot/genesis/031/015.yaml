  text: הֲ/ל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖/וֹ כִּ֣י מְכָרָ֑/נוּ וַ/יֹּ֥אכַל גַּם אָכ֖וֹל אֶת כַּסְפֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: zh_hans
  text: 难道他不是把我们看作外人吗？因为他卖了我们，还把我们的钱全都吃尽了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把我们的银子彻底吃光了。”希伯来语在这里使用“吃”的说法，并用强调结构表示完全耗尽。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: 难道……不是……吗
  rationale: 引出预期肯定回答的反问；这一现代汉语句式自然保留了希伯来语的反问语气。
- source_word: נָכְרִיּוֹת
  choice: 外人
  rationale: 这里指被当作不属于家庭的人；“外人”比“外国女子”更符合父女关系的语境，也较自然。
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: 他……把我们看作
  rationale: 希伯来语为被动的“在他看来被算作”；汉语用主动式表达更自然，同时保留“被他视为”的含义。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面反问所依据的理由。
- source_word: מְכָרָנוּ
  choice: 他卖了我们
  rationale: 直接保留“卖”的强烈措辞，表达女儿们对父亲以她们换取聘礼或劳役的控诉。
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: 还……全都吃尽了
  rationale: 保留希伯来语“吃”的比喻，并以“全都……尽”体现有限动词、גַּם与强调性不定式绝对式所表达的彻底耗尽。
- source_word: אֶת כַּסְפֵּנוּ
  choice: 我们的钱
  rationale: כֶּסֶף可指银子或钱；在此经济语境中，“钱”清楚自然，同时不额外断定其具体法律性质。
theological_decisions: []
