  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: zh_hans
  text: 拉班追上了雅各[a]。那时，雅各已经在山地支搭了帐篷；拉班和他的亲族[b]也在基列山地[c]支搭帐篷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赶上了雅各”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他的弟兄”；这里可能指他的亲属或族人。
    reason: lexical_alternative
  - marker: c
    text: “基列山地”或译：“基列山上”或“基列山区”。前一句的“山地”也可译为“山上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: 追上了
  rationale: נשׂג在追赶的叙事语境中表示赶上、追及；“追上了”自然地保留追赶意味，又不暗示已经抓获。
- source_word: תָּקַע אֶת אָהֳלוֹ
  choice: 已经……支搭了帐篷
  rationale: תקע与אהל连用，是“支搭帐篷”的惯用表达；“已经”表明拉班追上时雅各已扎营，符合叙事次序。
- source_word: בָּהָר
  choice: 在山地
  rationale: הַר既可指一座山，也可指山区或山地；此处按区域性地貌译为“山地”，同时以脚注保留单数“山上”的可能。
- source_word: תָּקַע אֶת אֶחָיו
  choice: 和他的亲族也……支搭帐篷
  rationale: 原文直译近于“支搭他的弟兄”，是承接前句“支搭帐篷”的省略表达；中文补出“帐篷”，并以“和”表达拉班与同行者一同扎营。
- source_word: אֶחָיו
  choice: 他的亲族
  rationale: אָח的字面义是“兄弟”，但也可广指同族或亲属；本段所指更可能是与拉班同行的家族成员，因此正文译作“亲族”，脚注保留字面义。
- source_word: בְּהַר הַגִּלְעָד
  choice: 在基列山地
  rationale: 该结构可理解为“在基列山上”，也可指基列的山地或山区；正文采用适合区域语境的“基列山地”，脚注列出其他可能。
