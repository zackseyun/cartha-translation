- from: 我有能力加害你们；但你父亲的上帝昨夜对我说：‘你要当心，不可对雅各说好说歹。[a]’
  to: 我有能力加害你们；但你们父亲的上帝昨夜对我说：‘你要当心，不可对雅各说好话或坏话。[a]’
  rationale: 修正“你父亲”为“你们父亲”，使译文遵从希伯来原文的第二人称复数形式，并与本节“加害你们”一致。将“说好说歹”调整为“说好话或坏话”，以较透明的现代汉语保留“从好到坏”的两极表达；脚注相应简化为对该习语范围的说明。
