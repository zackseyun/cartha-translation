  source_fidelity: 需修订人称数：希伯来文 אֲבִיכֶם 为“你们的父亲”（单数名词带第二人称复数后缀），与本节开头“你们”一致。英文审校轨迹将其解释为单数受话者，不能优先于原文。其余主要意思准确：拉班声称有能力伤害对方，却因神昨夜的警告而受约束。
  naturalness: “我有能力加害你们”与“昨夜对我说”自然、庄重。“不可对雅各说好说歹”可理解，但“不可对雅各说好话或坏话”更明晰地呈现原文的正反两极，且不失现代汉语的自然度。
  terminology: “上帝”适合此处 אֱלֹהִים 对雅各家之神的指称；“加害”准确表达 רָע 在此的伤害性。将“你父亲的上帝”改为“你们父亲的上帝”，以忠实反映原文复数受话者，而不对“父亲”作不必要的复数化。
