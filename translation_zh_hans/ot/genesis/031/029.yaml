  text: יֶשׁ לְ/אֵ֣ל יָדִ֔/י לַ/עֲשׂ֥וֹת עִמָּ/כֶ֖ם רָ֑ע וֵֽ/אלֹהֵ֨י אֲבִי/כֶ֜ם אֶ֣מֶשׁ אָמַ֧ר אֵלַ֣/י לֵ/אמֹ֗ר הִשָּׁ֧מֶר לְ/ךָ֛ מִ/דַּבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: zh_hans
  text: 我有能力加害你们；但你们父亲的上帝昨夜对我说：‘你要当心，不可对雅各说好话或坏话。[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从好到坏”，是涵盖两端的说法，意为无论好坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: 我有能力
  rationale: 这是表示手中有权能、能够做某事的习语；译作“我有能力”符合现代汉语，也准确传达拉班自称有能力采取行动。
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: 加害你们
  rationale: רָע 在此指对听者造成伤害，而非仅指抽象的道德之恶；“加害”简洁、自然，并保留蓄意伤害的语气。
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: 但你父亲的上帝
  rationale: וְ 在语境中引出转折：拉班虽自称有能力，却受到上帝约束。“你父亲”按直接受话者雅各的单数意义处理。
- source_word: אֶמֶשׁ
  choice: 昨夜
  rationale: 此词在语境中指前一夜；“昨夜”庄重简洁，符合叙事文体。
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要当心
  rationale: 该警告式命令要求拉班谨慎自守；“你要当心”保留命令和警戒的力度。
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: 不可对雅各说
  rationale: הִשָּׁמֶר 加 מִן 构成禁止性表达；译为“不可……说”在汉语中清楚自然。
- source_word: מִטּוֹב עַד רָע
  choice: 说好说歹
  rationale: 原文直译为“从好到坏”，是覆盖两端的表达。“说好说歹”保留正反两极及言语语境，同时正文脚注说明其可能指任何话。
theological_decisions:
- issue: אֱלֹהִים 指称向拉班说话的神
  choice: 你父亲的上帝
  alternative: 你祖先的上帝
  rationale: אֲבִיכֶם 形式虽可引发数的讨论，但叙事中的直接受话者是雅各，所指为他父亲的上帝。译文保留这一个人及家族关系，不额外引入后来的神学表述。
- issue: “说好说歹”的禁令范围
  choice: 正文保留正反两极的原文措辞，并以脚注说明可涵盖任何言语
  alternative: 正文直接译为“什么也不可对雅各说”
  rationale: 原文的两极表达可能具有“无论好坏、任何话”的习语功能，但字面张力仍值得保留；正文与脚注结合可避免把解释直接替代原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“加害”体现威胁语气；“昨夜”和“你要当心”保持圣经叙事的凝练感。“说好说歹”较自然地再现希伯来文两极表达，并以脚注保留其习语范围。
