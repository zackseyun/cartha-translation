base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: zh_hans
  text: 雅各就发怒，同拉班争辩。雅各回答拉班说：“我有什么过犯？我有什么罪，你竟紧追我[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“穷追我”。这里译作“紧追”的希伯来语动词也可表示急切、猛烈地追赶，其词根含有“燃烧”的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: 雅各就发怒
  rationale: 希伯来语惯用语表示怒气被激起；“就发怒”既顺应叙事推进，也符合现代汉语表达。
- source_word: וַיָּרֶב בְּלָבָן
  choice: 同拉班争辩
  rationale: ריב在此指与人争论、相争；“争辩”保留对抗意味，又不额外规定为斥责或争吵。
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答拉班说
  rationale: 以自然汉语保留“回答”与“说”两个叙事成分，避免机械译作“回答并说”。
- source_word: מַה פִּשְׁעִי
  choice: 我有什么过犯
  rationale: פשע带有违犯、过犯的道德及法律色彩；“过犯”可与下句“罪”形成原文的平行表达。
- source_word: מַה חַטָּאתִי
  choice: 我有什么罪
  rationale: חטאת可指罪或所犯的错；直译为“罪”，保留雅各自辩中的道德语气及与“过犯”的区分。
- source_word: כִּי
  choice: 以致
  rationale: 这里连接前面的反问与拉班的追赶行动；“以致”自然表达“究竟犯了什么，竟招致你追赶”的关系，而不强行限定为单纯原因或结果。
- source_word: דָלַקְתָּ אַחֲרָי
  choice: 你这样紧追我
  rationale: דלק在此是追赶、追逐，词义带有急切或猛烈追赶的色彩；“紧追”自然传达其力度，“这样”承接前面的反问。
