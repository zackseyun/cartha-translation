base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: zh_hans
  text: 这地方又名“米斯巴”[a]，因为拉班说：“当我们彼此不在对方眼前时，愿雅威在你我之间守望。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米斯巴”是希伯来语地名，与意为“守望处”或“瞭望台”的词有关，并与下文“愿雅威……守望”彼此呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: 又称为“米斯巴”
  rationale: “米斯巴”在这里用作地名，并与下文“察看”形成希伯来语文字呼应。原文承接上节的命名语境，中文补出“称为”以构成自然完整的句子。
- source_word: אֲשֶׁר אָמַר
  choice: 因为拉班说
  rationale: 关系词在此引出命名缘由，可自然译作“因为……说”。结合上文明确说话者为拉班，中文补明主语以免含混。
- source_word: יִצֶף
  choice: 愿……察看
  rationale: 该动词源于צפה，意为观看、守望；此处形式表达愿望。“愿……察看”既传达祈愿语气，也保留与“米斯巴”的词义联系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行汉语音译处理，保留其专名性质，不以称号替代。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 在你我之间
  rationale: 中文习惯说“你我之间”；虽调整原文“我和你”的次序，但意义不变且表达自然。
- source_word: כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: 我们彼此看不见的时候
  rationale: כִּי在此引入时间或情境；נִסָּתֵר字面为“被隐藏”，配合 reciprocal phrase 表示双方离开彼此视线。译文传达语境含义，并以脚注保留较贴近字面的可能表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的四字神名；“雅威”较直接反映其通常重构的发音，并保留专名性质。
- issue: “察看”在盟约语境中的含义
  choice: 不补译“作见证”或“监督”
  alternative: 愿雅威在你我之间监督／作见证
  rationale: 上下文可能带有上帝监督双方守约的意味，但本节动词本身是“观看、守望”。正文保留其开放性，不将隐含的司法或盟约功能明说出来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引号标示地名及直接引语；“又称为”承接上节的命名句式。“察看”兼顾צפה的基本意义和米斯巴的文字呼应，同时避免过度解释为“监督”。
