  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: zh_hans
  text: 这样，上帝把你们父亲的牲畜取走，给了我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “取走”也可译作“夺走”或“解救出来”。原文动词可表达从一方手中取走，转给另一方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: 夺过来
  rationale: 使役形在本语境中表示从一方手中取走并转给另一方。“夺过来”既保留强烈的转移意味，也不把该词限定为脱离危险的“救出”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 这里指为雅各施行作为的独一上帝；“上帝”是现代标准普通话中自然、庄重的译法。
- source_word: מִקְנֵה
  choice: 牲畜
  rationale: 该词可泛指所得的财产，但在雅各与拉班放牧的上下文中特指家畜；“牲畜”准确且通俗。
- source_word: אֲבִיכֶם
  choice: 你们父亲的
  rationale: 名词“父亲”为单数，第二人称复数后缀表明雅各同时对拉结和利亚说话，所指是她们共同的父亲拉班。
- source_word: וַיִּתֶּן לִי
  choice: 给了我
  rationale: 直译为“给我”；宾语由前面的“牲畜”承接，汉语无需补出代词，也能自然表达所有权的转移。
theological_decisions:
- issue: 雅各兴盛中的神圣行动者
  choice: 明确说上帝把拉班的牲畜夺过来给了雅各
  alternative: 弱化为上帝只是赐福雅各，并不明说牲畜从拉班转给雅各
  rationale: 希伯来文用两个主动动词直接把取走与给予都归于上帝，因此译文保留这种强烈的神圣能动性，不将其淡化为笼统的赐福。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“这样”承接雅各此前所述的情况；“夺过来”保留原文可能具有的强力度，并以脚注说明较温和或偏重解救含义的译法。
