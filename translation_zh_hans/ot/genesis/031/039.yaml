base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: zh_hans
  text: 被野兽撕咬的牲畜，我没有带到你面前；我自己赔补了[a]。白天被偷的，夜里被偷的，你都向我追讨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我自己承担了损失。”这里的希伯来语动词表示承担责任、赔补损失。
    reason: lexical_alternative
  - marker: b
    text: 直译：“你从我手中追讨它。”这里“从我手中”表示要我本人负责；原文并列提及白天和夜里被偷的牲畜。
    reason: literal_rendering
lexical_decisions:
- source_word: טְרֵפָה
  choice: 被野兽撕碎的牲畜
  rationale: 该词在牧养语境中指被猛兽撕咬致死的牲畜。译文明确补出“牲畜”，使现代读者自然理解，同时保留具体图景。
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: 我没有带到你面前
  rationale: 忠实表达“带到某人那里”的结构；宾语由前面的“被野兽撕碎的牲畜”提供。
- source_word: אָנֹכִי אֲחַטֶּנָּה
  choice: 损失由我自己承担
  rationale: 独立代词 אָנֹכִי 带有强调意味；חטא 的此处特殊用法表示承担责任或赔补损失，而非通常的“犯罪”。
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: 你都向我追讨
  rationale: בקש 与 מִיָּדִי 连用表示向某人追究、索取赔偿。“追讨”自然传达责任归属；“都”涵盖随后并列的昼夜失窃情形。
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: 无论是白天被偷的，还是夜里被偷的
  rationale: 两个平行短语列出昼夜发生的失窃。“无论……还是……”在汉语中自然表达两类情况均由雅各负责，并不表示只有一种情形实际发生。
theological_decisions:
- issue: 被撕牲畜与失窃牲畜之间的句法关系
  choice: 将后半句理解为涵盖白天和夜间失窃的损失，并与前面的猛兽撕杀损失相区别
  alternative: 把“白天被偷、夜里被偷”都看作前述同一被撕牲畜的附加说明
  rationale: “白天被偷的”和“夜里被偷的”语义上是另一类牲畜损失；译文避免造成被猛兽撕碎的牲畜同时又被偷的误解，同时保留 תְּבַקְשֶׁנָּה 所表达的追责。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“牲畜”依据牧养语境补明；“承担损失”“向我追讨”避免生硬照搬希伯来习语，同时保留雅各为自己尽责所作辩护的力度。
