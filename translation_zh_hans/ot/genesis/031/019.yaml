review_pass:
  verdict: revise
  source_fidelity: “去剪羊毛的时候”基本传达了叙事背景，但将צֹאן缩窄为仅指羊，并把“去”与“剪毛”的持续时间关系说得较为含混。原文说明拉班已外出，为自己的羊群（可包括绵羊和山羊）剪毛；拉结随即偷走特拉非。
  naturalness: 原译流畅，但“拉班去剪羊毛的时候”略像在说他正剪羊毛的期间。改作“已经出去给自己的羊群剪毛了”更自然地表达背景性的既成行动，也更贴近原文时态功能。
  terminology: “家神”可作简明译法，并以脚注保留“特拉非”及其作为家庭祭祀神像／偶像的文化语义。脚注应避免把原词的具体形制断定得过死，并应以规范中文说明音译。
  issues:
  - severity: medium
    issue: “剪羊毛”缩窄了צֹאן的范围，且“去……的时候”未充分呈现拉班已外出的背景。
    rationale: צֹאן是“羊群／小牲畜”的集合称谓，可包括绵羊和山羊；הָלַךְ的完成式在此为拉结行动提供已发生的背景。采用“已经出去给自己的羊群剪毛了”可较稳妥地保留这两点。
  - severity: low
    issue: 脚注“希伯来文作‘特拉非’”的表述不够准确。
    rationale: “特拉非”是对teraphim的中文音译，而非希伯来文字形本身；改为“希伯来语音译为”更准确。
  revised_text: 拉班已经出去给自己的羊群剪毛了，拉结就偷走了她父亲的家神[a]。
  revised_footnotes:
