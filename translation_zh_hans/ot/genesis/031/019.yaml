  rationale: 修订将拉班外出剪毛处理为拉结行动的既成背景，避免把צֹאן限为仅“羊毛”；保留“偷走”所表达的明确偷窃意义。“家神”仍作为正文中简洁自然的对应语，脚注以准确措辞保留特拉非的音译和词义弹性。
