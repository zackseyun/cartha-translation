base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: zh_hans
  text: 拉班已经出去给自己的羊群剪毛了，拉结就偷走了她父亲的家神[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语音译为“特拉非”；指家庭祭祀所用的神像或偶像，也可译为“家中的神祇”。
    reason: 说明专门文化词תְּרָפִים，保留音译及“家庭神祇／偶像”这一不完全确定的词义范围。
lexical_decisions:
- source_word: הָלַךְ
  choice: 去……的时候
  rationale: 该完成式在叙事中提供拉结行动发生时的背景；汉语用“……的时候”自然表达拉班当时外出剪羊毛，而不必机械使用过去完成时。
- source_word: לִגְזֹז אֶת צֹאנוֹ
  choice: 剪羊毛
  rationale: גזז指剪取牲畜的毛；צֹאן可泛指羊群等小型牲畜，但此处现代汉语习惯简洁说“剪羊毛”。
- source_word: וַתִּגְנֹב
  choice: 偷走了
  rationale: גנב明确表示偷窃；“偷走”保留其行为的道德和法律含义，不弱化为“暗中拿走”。
- source_word: הַתְּרָפִים
  choice: 家神
  rationale: תְּרָפִים指家庭祭祀所用的神像或偶像。“家神”是简洁、自然且为普通中文读者可理解的对应词，但其具体形制和功能并不完全确定，故脚注补充说明。
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: 她父亲的
  rationale: לְ在此表示归属；汉语领属结构直接、自然地表达这些家神属于她父亲。
theological_decisions:
- issue: 涉及家庭祭祀物的תְּרָפִים如何译出
  choice: 家神
  alternative: 家中偶像；特拉非
  rationale: “家神”既呈现其家庭宗教背景，又避免用音译遮蔽含义。原词所指可能是神像、偶像或具有家庭祭祀功能的物件，脚注保留这种词义范围，不进一步断定其具体用途。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“去剪羊毛的时候”自然呈现背景关系；“偷走了”保留原文明确的偷窃含义。脚注标记紧随“家神”，对应实际受注词。
