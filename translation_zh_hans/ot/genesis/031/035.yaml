  rationale: 修订仅改善现代汉语的自然度和术语清晰度：以“我正值月事”自然保留原文的委婉表达；以“家中的偶像”清楚表达特拉非为家庭宗教物件，同时用脚注保留音译及语义范围。其余句法、敬称、人物指称和叙事关系均维持原意。
