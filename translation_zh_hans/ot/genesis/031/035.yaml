  text: וַ/תֹּ֣אמֶר אֶל אָבִ֗י/הָ אַל יִ֨חַר֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י כִּ֣י ל֤וֹא אוּכַל֙ לָ/ק֣וּם מִ/פָּנֶ֔י/ךָ כִּי דֶ֥רֶךְ נָשִׁ֖ים לִ֑/י וַ/יְחַפֵּ֕שׂ וְ/לֹ֥א מָצָ֖א אֶת הַ/תְּרָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: zh_hans
  text: 她对父亲说：“我主不要生我的气；我不能在你面前起来，因为我正值月事。”拉班搜查了一遍，却没有找到那些家中的偶像[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“特拉非”，指家中所用的祭祀或崇拜神像。
    reason: 说明原文专门名词的音译及语义范围。
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־אָבִיהָ
  choice: 她对父亲说
  rationale: 按希伯来叙事句法自然推进，并准确表达女性主语和所属关系。
- source_word: אַל־יִחַר בְּעֵינֵי אֲדֹנִי
  choice: 我主不要生我的气
  rationale: 这是表示恭敬请求的惯用语；“我主”保留女儿对父亲的尊称，并非神圣称号。“不要生我的气”以自然现代汉语传达 חרה 的发怒之意，避免生硬直译“在我主眼中发怒”。
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: 我不能在你面前起来
  rationale: 保留 קום 的身体动作以及 מִפָּנֶיךָ 所含“在你面前”的在场与礼敬意味。
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: 女人的月事正临到我
  rationale: 该短语是指月经的委婉说法；译文沿用庄重而易懂的委婉表达，不改成过于临床化的措辞。
- source_word: וַיְחַפֵּשׂ
  choice: 拉班搜查了一遍
  rationale: 上下文明确主语是拉班，汉语中补出姓名可避免与前句女性主语混淆；“搜查了一遍”自然表达其查找行动。
- source_word: וְלֹא מָצָא
  choice: 却没有找到
  rationale: “却”清楚表现搜查未果的转折结果。
- source_word: הַתְּרָפִים
  choice: 那些家神像
  rationale: תְּרָפִים 指家庭祭祀或崇拜所用的神像；“家神像”兼顾家庭场景、宗教性质和现代汉语可懂度，定冠词按语境译作“那些”。
theological_decisions:
- issue: תְּרָפִים 的译法
  choice: 家神像
  alternative: 特拉非；家神；家庭偶像
  rationale: 原词所指是家庭宗教活动中的神像或祭祀物。采用“家神像”既不把它们表述为真实的神明，也不过度预设其具体大小、用途或形制；音译和语义范围在脚注中说明。
- issue: דֶרֶךְ נָשִׁים 的委婉性质
  choice: 女人的月事正临到我
  alternative: 我正在来月经；女人的常例临到我
  rationale: 保留原文谈论月经时的委婉语气，同时让普通现代读者能够理解，不对拉结所说的话是否属实作神学或叙事判断。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我主”体现拉结对父亲的恭敬称呼；“月事”保留原文委婉语域。补出“拉班”以消除汉语叙事中主语转换可能造成的歧义。
