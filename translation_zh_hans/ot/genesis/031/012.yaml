base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: zh_hans
  text: 他说：“请抬眼观看：所有正在与羊群交配的[a]公山羊，都是有条纹、有斑点、有杂斑的[b]；因为我已经看见了拉班正在对你所做的一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处直译可作“正在上到羊群身上”，是在牲畜繁殖语境中指交配的委婉说法。
    reason: lexical_alternative
  - marker: b
    text: “有条纹”所译的希伯来语也可指有带纹或环纹；“有杂斑”也可译作“毛色斑驳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ וּרְאֵה
  choice: 请抬起眼来看看
  rationale: 保留“抬眼”这一希伯来语意象，并用现代汉语自然表达；“请”对应礼貌语气词 נָא。
- source_word: הָעַתֻּדִים
  choice: 公山羊
  rationale: עַתּוּד 在这里通常指雄性山羊；“公山羊”比“公羊”更明确，避免被理解为雄性绵羊。
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: 与羊群交配的
  rationale: 该表达在牲畜繁殖语境中是交配用语；译出实际含义，比逐字译为“上到羊群身上”更自然。
- source_word: עֲקֻדִּים נְקֻדִּים וּבְרֻדִּים
  choice: 有条纹、有斑点、有杂斑的
  rationale: 用三个可理解而彼此有所区别的现代词语表达三类毛色标记；其中 עֲקֻדִּים 也可理解为带状或环纹。
- source_word: כִּי רָאִיתִי
  choice: 因为……我都看见了
  rationale: 保留 כִּי 的因果关系，并以“看见了”体现完成体及其当前意义。
- source_word: כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: 拉班向你所做的一切
  rationale: 分词 עֹשֶׂה 可表达持续行为；“向你所做”保留原文对雅各所受待遇的概括，不额外限定为某一次行动。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“羊群”保留 צֹאן 可涵盖绵羊和山羊的集合含义；对繁殖动作使用清楚但不过度直露的“交配”。
