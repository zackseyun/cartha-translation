  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: zh_hans
  text: 你若苦待我的女儿，或在我的女儿以外另娶妻子，即使没有别人在场[a]，看哪，上帝在你我之间作见证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“没有人与我们同在”；意思是没有人类见证人在场。
    reason: 说明 אֵין אִישׁ עִמָּנוּ 的字面形式及其语境含义。
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: 苦待
  rationale: 此处为 ענה 的 Piel 形式，指在婚姻关系中使拉班的女儿受苦、受到恶劣对待。“苦待”既保留“使受苦”的力度，也符合现代汉语表达。
- source_word: בְּנֹתַי
  choice: 我的女儿
  rationale: 忠实表达第一人称复数所属关系，并按原文两次保留这一称呼，以维持强调。
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: 在我的女儿以外另娶妻子
  rationale: 介词 עַל 在此表示在已有妻子之外再增添妻子，并非以别的妻子取代她们；此译清楚表达另娶之意。
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: 即使没有别人在场
  rationale: 该句在语境中强调没有人类见证人在场。“别人在场”是自然汉语，也避免将原句误解为连正在交谈的双方都不在场；“即使”表达其让步作用。
- source_word: רְאֵה
  choice: 看哪
  rationale: 保留命令式引人注意的郑重语气，适合盟约警告的语境。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 在此盟约语境中指被呼求作见证的独一神，使用单数称谓“上帝”。
- source_word: עֵד
  choice: 见证
  rationale: 保留原文名词性断言“上帝是……见证”的盟约措辞，而不改写成较具解释性的动词结构。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 你我之间
  rationale: 自然、简洁地表达双方之间的盟约责任关系。
theological_decisions:
- issue: אִישׁ 在此是否专指男性
  choice: 没有别人在场
  alternative: 没有男人与我们同在
  rationale: 语境重点是没有任何人类见证人，而非见证人的性别；汉语用“别人”可准确传达泛指人的功能，又不会暗示女性可能在场。脚注保留较贴近字面的表达。
- issue: 上帝作为盟约见证者的句法表达
  choice: 上帝是你我之间的见证
  alternative: 上帝在你我之间作证
  rationale: 原文以名词 עֵד 直接断言上帝为双方之间的见证者；保留名词结构可维持其郑重性，并不扩展为对作证行动的额外描述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“苦待”“另娶妻子”清楚呈现婚姻语境；“看哪”保留盟约宣告的郑重语气。
