base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: zh_hans
  text: 拉班回答雅各说：“女儿是我的女儿，儿子是我的儿子，羊群是我的羊群；你所看见的一切也都是我的。可是，今天我能为我这些女儿，或她们所生的孩子[a]做什么呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她们所生的儿子”。这里的 בְּנֵיהֶן 既可较广泛地指“孩子”，也可较狭义地指男性后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答……说
  rationale: 保留希伯来叙事中“回答”与“说”的并列表达，同时符合现代汉语的庄重叙事语体。
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: 女儿是我的女儿
  rationale: 保留原文名词与所属后缀形成的强调性重复，呈现拉班强烈的亲属权利主张。
- source_word: וְהַבָּנִים בָּנַי
  choice: 儿子是我的儿子
  rationale: 按阳性复数 בָּנִים 的直接意义译作“儿子”，并保留与前句平行的重复结构。
- source_word: וְהַצֹּאן צֹאנִי
  choice: 羊群是我的羊群
  rationale: צֹאן 是绵羊、山羊等小型牲畜的集合称谓；“羊群”自然地保留其集合意义。
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: 你所看见的一切也都是我的
  rationale: 简洁呈现 לִי הוּא 的所属断言；“也”衔接前面的连续主张。
- source_word: מָה אֶעֱשֶׂה ... לְ
  choice: 我能对……做什么呢
  rationale: 以反问表达未完成式在语境中的实际可能性，并用“对……做什么”保留介词 לְ 在此处可涉及施加行动、而不必限定为施惠的张力。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 这是现代汉语中自然、准确的时间表达。
- source_word: לִבְנֵיהֶן אֲשֶׁר יָלָדוּ
  choice: 她们所生的孩子
  rationale: בְּנֵיהֶן 在此可泛指女儿们的后代；“孩子”符合语境，同时用脚注保留较窄的“儿子”义。
