  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ן רֹאֶ֤ה אָנֹכִי֙ אֶת פְּנֵ֣י אֲבִי/כֶ֔ן כִּֽי אֵינֶ֥/נּוּ אֵלַ֖/י כִּ/תְמֹ֣ל שִׁלְשֹׁ֑ם וֵֽ/אלֹהֵ֣י אָבִ֔/י הָיָ֖ה עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: zh_hans
  text: 他对她们说：“我看你们父亲对我的脸色不像从前那样了[a]，但我父亲的上帝一直与我同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“（他的脸色）对我不像昨天和前天那样”；这是希伯来语习语，意思是“不像从前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: 他对她们说
  rationale: 叙事性 wayyiqtol 自然译作“他……说”；“她们”保留希伯来语阴性复数所指的拉结和利亚。
- source_word: רֹאֶה אָנֹכִי
  choice: 我看
  rationale: 分词与独立代词表达雅各当前的观察；现代汉语用“我看”自然简洁。
- source_word: אֶת פְּנֵי אֲבִיכֶן
  choice: 你们父亲的脸色
  rationale: פָּנִים 本义为“脸”，在此体现人的态度或神情；“脸色”既保留具体意象，也符合现代汉语表达。
- source_word: כִּי אֵינֶנּוּ אֵלַי
  choice: 不像从前那样对我了
  rationale: אֵלַי 表示朝向雅各，结合“脸色”指拉班对他的态度已经改变；汉语以“对我”自然传达这一关系取向。
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: 像从前那样
  rationale: 这是表示过去一贯情形的希伯来语习语；正文采用自然汉语，字面形式在脚注中保留。
- source_word: וֵאלֹהֵי אָבִי
  choice: 但我父亲的上帝
  rationale: 连接词在语境中有转折作用，对比拉班态度的改变与上帝持续的同在；“我父亲的上帝”忠实保留所属关系。
- source_word: הָיָה עִמָּדִי
  choice: 一直与我同在
  rationale: 完成式概括上帝直到当前持续的同在和扶助；“一直……同在”准确表达延续意义。
theological_decisions:
- issue: אֱלֹהֵי אָבִי 的神圣称谓
  choice: 我父亲的上帝
  alternative: 我父亲所信的上帝
  rationale: 所选译法直接反映希伯来语构造及家族性的圣约语境；替代译法加入了原文未明说的“所信”，因此不采用。
- issue: 连接词 וְ 的语篇关系
  choice: 但
  alternative: 而且／和
  rationale: 这里将拉班不再友善的态度与上帝持续同在形成对照；译作“但”明确呈现语境中的转折，而不增添教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“脸色”保留原文“脸”的具体意象，同时自然表达态度变化；“一直与我同在”保持经文用语的庄重感。
