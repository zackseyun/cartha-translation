    rationale: 该动词在此不是单纯允许或命令家人骑乘，而是指雅各将他们举起、扶或安置到骆驼上。
  - severity: low
    issue: “儿子们和妻子们”复数词缀重复，语感稍显机械。
    rationale: 现代汉语通常以无标记名词表达此类复数；上下文和所属结构已足够明确。
  revised_text: 于是雅各起来，扶他的儿子和妻子上骆驼。
