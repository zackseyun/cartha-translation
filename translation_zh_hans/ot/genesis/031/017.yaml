  yaml_path: translation/ot/genesis/031/017.yaml
  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: zh_hans
  text: 于是雅各起来，扶他的儿子和妻子上骆驼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 就起来
  rationale: קום的叙事性连续式推进情节，表示雅各起身采取行动；“就起来”自然保留动作次序。
- source_word: וַיִּשָּׂא
  choice: 让……骑上
  rationale: נשׂא本义涉及抬起、承载；与“骆驼”及介词עַל连用时，语境是使家人登上骆驼。“让……骑上”比直译“抬到……上”更符合现代汉语，也清楚表达使役动作。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: בנים为阳性复数，本文明确译为“儿子们”，不泛化为“孩子们”。
- source_word: נָשָׁיו
  choice: 妻子们
  rationale: אשה的复数带第三人称阳性单数所属后缀，在此明确指雅各的多位妻子。
- source_word: עַל הַגְּמַלִּים
  choice: 骑上骆驼
  rationale: עַל在这一移动语境中表达登到骆驼上；“骑上”自然传达方向与乘骑关系，无须另加脚注讨论汉语中并不存在的“在/到……上”对应歧义。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“就”承接前文并推进叙事；保留“儿子们”和“妻子们”的复数信息。原英文脚注所述介词译法差异属于英语表达问题，中文“骑上”已自然涵盖移动方向，因此不设脚注。
