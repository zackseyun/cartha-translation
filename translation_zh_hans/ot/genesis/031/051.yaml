base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: zh_hans
  text: 拉班就对雅各说：“你看这石堆[a]，再看这石柱[b]；这是我在你我之间立的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “石堆”也可译作“石丘”；希伯来语在这里指堆起作为见证的石头。
    reason: lexical_alternative
  - marker: b
    text: “石柱”也可译作“立石”或“竖立的石头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 未完成式连续结构推进叙事；“又……说”在现代汉语中自然承接上文。
- source_word: הִנֵּה הַגַּל הַזֶּה
  choice: 你看这石堆
  rationale: הִנֵּה在此用于指示并引起注意；גַּל结合上下文指堆起的石头，因此译作“石堆”。
- source_word: וְהִנֵּה הַמַצֵּבָה
  choice: 再看这石柱
  rationale: 保留重复的הִנֵּה所形成的强调和平行结构；מַצֵּבָה指竖立的石头，译作“石柱”简明自然。
- source_word: יָרִיתִי
  choice: 我……立的
  rationale: 该动词基本意象可涉及抛掷或堆置，但与מַצֵּבָה搭配并处于立约标记的语境中，表达设立、竖立之意；“立”既自然又不作过度解释。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 在你我之间
  rationale: 准确表达双方之间的位置和关系，也符合现代汉语习惯。
theological_decisions:
- issue: 拉班自称是立石柱者
  choice: 保留第一人称“我……立的”
  alternative: 依照上文行动者改为“立在你我之间的”或暗示雅各所立
  rationale: 马所拉文本明确使用第一人称单数יָרִיתִי。即使与上文关于谁立石柱或堆石的叙述存在张力，也不应在译文中擅自协调。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你看……再看……”保留原文两次הִנֵּה的指示与强调；“你我之间”简洁自然。所有词汇脚注均紧随对应词语。
