base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: zh_hans
  text: 你为什么藏起来逃走，又瞒着我偷偷离开[a]，也不告诉我？我本可以欢欢喜喜地为你送行，有歌声[b]、手鼓[c]和里拉琴[d]相伴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“你偷了我”，这是指瞒着某人偷偷离开。
    reason: lexical_alternative
  - marker: b
    text: 或译“歌唱”。
    reason: lexical_alternative
  - marker: c
    text: 传统译作“鼓”；原词指一种手持的鼓类乐器。
    reason: lexical_alternative
  - marker: d
    text: 或译“竖琴”；原词更具体地指里拉琴类乐器。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 这是询问原因的常用表达；“为什么”自然、直接，也保留了拉班质问的语气。
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: 藏起来逃走
  rationale: 保留חבא的反身含义“把自己藏起来”和ברח“逃走”的动作，没有把两者合并为单纯的“偷偷离开”。
- source_word: וַתִּגְנֹב אֹתִי
  choice: 又瞒着我偷偷离开
  rationale: 希伯来语直译近似“偷了我”，在这里是指避开某人、偷偷溜走；中文以自然表达传达其隐秘和使对方不知情的含义。
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: 也不告诉我
  rationale: 准确传达Hifil词形在此“告知”的意思，并符合现代汉语口吻。
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: 我本可以……为你送行
  rationale: 语境表示一个未能实现的结果：若雅各事先告知，拉班声称自己本可欢送他；“本可以”自然体现这一反事实意味。
- source_word: בְּשִׂמְחָה
  choice: 欢欢喜喜地
  rationale: 传达“喜乐、欢庆”的送别气氛，现代汉语自然且生动。
- source_word: וּבְשִׁרִים
  choice: 有歌声
  rationale: שִׁירִים可指歌曲，也可指歌唱；“歌声”在欢送场景中自然，并保留两者之间的语义空间。
- source_word: בְּתֹף
  choice: 手鼓
  rationale: תֹף是手持敲击的鼓类乐器；“手鼓”比传统的“铃鼓”更不易让人误以为原文明确表示带铃片的现代乐器。
- source_word: וּבְכִנּוֹר
  choice: 里拉琴
  rationale: כִּנּוֹר指里拉琴类弦乐器；此译比笼统的“竖琴”更具体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的质问句式。“藏起来逃走”保留原文两个相邻动作；后半句用“本可以……为你送行”清楚表达拉班所说但并未实现的欢送场景。乐器名称兼顾历史准确性与现代可读性。
