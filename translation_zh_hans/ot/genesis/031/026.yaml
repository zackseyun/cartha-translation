base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: zh_hans
  text: 拉班对雅各说：“你做了什么事，竟欺骗了我[a]，把我的女儿们赶走，像被刀剑掳走的女俘一样[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“偷了我的心”；这里是指欺骗我或瞒过我。
    reason: lexical_alternative
  - marker: b
    text: 原文为“像刀剑的女俘”，即像在战争中被掳走的女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: 你做的是什么事？
  rationale: 这是带有责问意味的疑问句；此译法在现代汉语中自然地表达拉班的指责。
- source_word: וַתִּגְנֹב אֶת־לְבָבִי
  choice: 竟瞒着我
  rationale: 希伯来语字面为“偷了我的心”，在本处表示暗中行事，使对方不知情。汉语“偷了我的心”通常带有爱情意味，容易误导，因此正文按语境译为“瞒着我”，并在脚注保留原文意象。
- source_word: וַתְּנַהֵג
  choice: 把……赶走
  rationale: נהג 可指驱赶或带领；下文以战争俘虏作比，采用“赶走”保留拉班所指控的强迫意味。
- source_word: בְּנֹתַי
  choice: 我的女儿们
  rationale: 忠实保留复数及拉班在话语中强调的亲属关系。
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: 像被刀剑掳走的女俘一样
  rationale: שְׁבֻיוֹת 是阴性复数，指被俘的女子；“刀剑”是战争的转喻。此译法既保留刀剑意象，也使现代读者清楚这是战争掳掠的比喻。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“竟”传达质问中的惊怒；保留“刀剑”的战争意象，同时用“女俘”明确希伯来语阴性复数的所指。
