base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: zh_hans
  text: 雅各在山上献了祭，又叫他的弟兄们来吃饭[a]。他们吃了饭，就在山上过夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”在这里也可指“男性亲族”或“同伴”。
    reason: 说明希伯来词 אָח 在此语境中可能具有比亲兄弟更广的含义。
lexical_decisions:
- source_word: וַיִּזְבַּח יַעֲקֹב זֶבַח
  choice: 雅各……献了祭
  rationale: 希伯来文以同根动词和名词组成强调式表达，直译类似“宰献了一个祭”。现代汉语用“献了祭”自然、庄重，并保留其祭祀含义，避免生硬重复。
- source_word: בָּהָר
  choice: 在山上
  rationale: הַר 可指山或山区；本节两次带定冠词并指同一地点，“在山上”最直接地保留原文地点表达及重复。
- source_word: וַיִּקְרָא
  choice: 叫……来
  rationale: קרא 基本义为“呼叫、召来”；此处语境具有邀请共同进食的功能。“叫……来”既保留呼召动作，也符合现代汉语。
- source_word: לְאֶחָיו
  choice: 他的弟兄们
  rationale: אָח 可指亲兄弟，也可在语境中泛指男性亲族或同伴。正文保留亲属称谓“弟兄们”，不把可能的广义用法直接解释进正文。
- source_word: לֶאֱכָל לָחֶם
  choice: 来吃饭
  rationale: 字面为“吃饼/吃食物”，是表示进餐的常用说法。汉语“吃饭”同样是自然的进餐惯用语，并不限定实际食物为米饭。
- source_word: וַיֹּאכְלוּ לֶחֶם
  choice: 他们吃了饭
  rationale: 与前句相呼应，保留原文“吃……／他们吃了……”的重复，同时以自然汉语表达共同进餐。
- source_word: וַיָּלִינוּ
  choice: 过夜
  rationale: לון 表示留宿或住宿一夜；“过夜”简洁准确，适合现代叙事语体。
theological_decisions:
- issue: 盟约场景中“他的弟兄们”的所指范围
  choice: 正文译作“他的弟兄们”，并用脚注说明可能是更广义的男性亲属或同伴。
  alternative: 他的亲族；他的亲属；他的同伴
  rationale: 原词保留了家族性称谓，但在本语境未必仅指雅各的亲兄弟。正文不替原文消除这一张力，脚注则帮助读者了解其语义范围。
- issue: 献祭之后进食与祭餐的关系
  choice: 译作“献了祭……吃饭”，不明确增译为“吃祭餐”。
  alternative: 献上祭物，并一同享用祭餐
  rationale: 上下文可能暗示祭牲所构成的共同筵席，但原文只明确说献祭和吃食物；正文不加入超出明说内容的礼仪解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“献了祭”保留祭祀语义；“吃饭”自然对应希伯来语“吃饼／食物”的进餐惯用语；两次“在山上”和两次进餐表达尽量保留原文的重复结构。
