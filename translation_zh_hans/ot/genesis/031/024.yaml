base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: zh_hans
  text: 但夜里，上帝在梦中来到亚兰人拉班那里，对他说：“你要小心，不可对雅各说好话或坏话。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“从好到坏”，意思可能是：无论好话坏话，什么都不要说。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到……那里
  rationale: בוא在叙事体中基本义为“来、到”；这里保留其动作表达，不译作带有解释性的“显现”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 动词为单数，叙事语境明确指独一的上帝。
- source_word: לָבָן הָאֲרַמִּי
  choice: 亚兰人拉班
  rationale: אֲרַמִּי是族称“亚兰人”；不采用传统但时代错置较明显的“叙利亚人”。
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: 夜里……在梦中
  rationale: 自然表达梦发生在夜间，同时保留“在梦中”这一启示媒介；汉语调整语序以避免生硬。
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要小心
  rationale: 这是警告公式，现代汉语“你要小心”既自然，也保留命令和警戒的语气。
- source_word: פֶּן תְּדַבֵּר
  choice: 不可……说
  rationale: פֶּן在警告中禁止某种行为；“不可”清楚传达禁止意味，而“说”符合后接言语内容的汉语习惯。
- source_word: עִם יַעֲקֹב
  choice: 对雅各
  rationale: דבר与עִם连用可指向某人说话；汉语以“对雅各说”最自然。
- source_word: מִטּוֹב עַד רָע
  choice: 说好说歹
  rationale: 原文直译为“从好到坏”，是涵盖两端的表达。汉语“说好说歹”保留好坏两极及言语语境，但正文可能被理解为只禁某类评价，因此脚注说明其较宽含义。
theological_decisions:
- issue: אֱלֹהִים的身份
  choice: 上帝
  alternative: 神明／诸神
  rationale: 单数动词和上下文均表明这里指叙事中的独一上帝；这属于语法和语境判断，不作额外教义扩展。
- issue: “从好到坏”所禁止言语的范围
  choice: 正文保留两极式表达“说好说歹”，脚注说明可指任何话
  alternative: 正文直接译作“什么都不可对雅各说”
  rationale: 原文习语可能涵盖一切言语，但仍以“好—坏”两端来表达。正文保留其形式和张力，脚注交代习语含义，避免默默消除原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亚兰人”准确反映希伯来族称；“说好说歹”自然凝练，脚注补足原文习语可能涵盖“任何话”的范围。
