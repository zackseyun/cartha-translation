  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זֶה֩ עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ עִמָּ֔/ךְ רְחֵלֶ֥י/ךָ וְ/עִזֶּ֖י/ךָ לֹ֣א שִׁכֵּ֑לוּ וְ/אֵילֵ֥י צֹאנְ/ךָ֖ לֹ֥א אָכָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: zh_hans
  text: 我跟你在一起的这二十年里，你的母绵羊和母山羊没有流产过[a]，你羊群中的公羊，我也没有吃过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有失去过幼崽”。希伯来语动词可指失去后代；在这里的牧养语境中，是指流产或幼崽夭折。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: 这二十年里
  rationale: 希伯来语直译近似“这二十年”，在现代汉语中用“这二十年里”自然表达截至说话时持续的一段时期，并保留指示意味。
- source_word: אָנֹכִי עִמָּךְ
  choice: 我跟你在一起
  rationale: 原文是无显式系词的名词句；结合二十年的时间范围，译为“我跟你在一起”，简明表达雅各长期留在拉班身边的意思。
- source_word: רְחֵלֶיךָ וְעִזֶּיךָ
  choice: 你的母绵羊和母山羊
  rationale: 两个名词在此分别特指雌性绵羊和雌性山羊；明确译出性别，也与怀胎和失去幼崽的语境相符。
- source_word: לֹא שִׁכֵּלוּ
  choice: 没有流产过
  rationale: 该动词基本义涉及丧失后代；用于牲畜繁育语境时，“流产”简洁而准确。脚注保留“没有失去幼崽”的较宽泛可能。
- source_word: וְאֵילֵי צֹאנְךָ
  choice: 你羊群中的公羊
  rationale: אֵילֵי 特指公绵羊；“你羊群中的公羊”既保留动物类别，也清楚表达所属关系。
- source_word: לֹא אָכָלְתִּי
  choice: 我也没有吃过
  rationale: 完成式在雅各回顾二十年行为的申辩中表示整个时期内从未如此；“没有吃过”自然体现这种经历性否定，“也”则连接前一个否定陈述。
theological_decisions: []
