  naturalness: “带着一切所有的”不符合现代汉语的自然搭配，宜改为“带着所有属于他的一切”或“带着他所有的一切”。其余叙事表达自然、庄重。
  terminology: “基列山区”可理解，但“基列山地”更贴近此处地理区域意义，也更合乎中文圣经叙事语体。“那条河”既自然，又能对应希伯来文的定指表达。
