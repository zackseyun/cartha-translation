base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: zh_hans
  text: 于是，雅各带着所有属于他的一切逃走了。他起身，渡过那条河[a]，朝着基列山地而去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“那河”，很可能指幼发拉底河。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: 逃走了
  rationale: 该动词意为“逃跑、逃走”；“逃走”自然简洁，也保留了在压力下离开的叙事意味。
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: 带着一切所有的
  rationale: 原文范围宽泛，可包括家属、仆人和财物；此译不把所指限缩为单纯的财产。
- source_word: וַיָּקָם
  choice: 他起身
  rationale: 保留קום在连续叙事中标示下一行动的表达，不将其解释性地并入“出发”。
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: 渡过大河
  rationale: עבר表示渡过；带定冠词的“河”在此很可能是幼发拉底河。“大河”符合现代中文圣经地理称谓，同时脚注说明原文形式。
- source_word: הַנָּהָר
  choice: 大河
  rationale: 原文直译为“那河/这河”，在相关语境中通常特指幼发拉底河；正文保留称号式表达，避免直接以专名消除原文的含蓄。
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: 面向……而去
  rationale: 该习语字面为“把脸朝向”，表示有意确定方向；此译自然地保留方向感和行动意图。
- source_word: הַר הַגִּלְעָד
  choice: 基列山区
  rationale: הַר既可指山，也可指山地；此处按地理语境理解为基列的山地区域，而非一座单独山峰。
theological_decisions: []
