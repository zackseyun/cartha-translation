- from: 于是，雅各带着一切所有的逃走了。他起身渡过大河[a]，面向基列山区而去。
  to: 于是，雅各带着所有属于他的一切逃走了。他起身，渡过那条河[a]，朝着基列山地而去。
  rationale: 修订“带着一切所有的”为自然的汉语所属表达，保留其涵盖家属、仆人和财物的宽泛范围；将“大河”改为“那条河”，以更直接对应原文的定指表达，并由脚注保留可能的幼发拉底河指认；以“基列山地”表达区域性山地。
