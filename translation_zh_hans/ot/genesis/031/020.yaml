  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: zh_hans
  text: 雅各瞒过了亚兰人拉班，没有告诉他自己正在逃走。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“雅各偷了亚兰人拉班的心。”这是希伯来语习语，意思是瞒着他行事，使他不知情或措手不及。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב יַעֲקֹב אֶת־לֵב לָבָן
  choice: 雅各瞒着……拉班
  rationale: 希伯来语直译为“雅各偷了拉班的心”，在此是指暗中行事，使对方不知情或措手不及。结合下文“没有告诉他”，用“瞒着”既自然，又准确表达该习语在本节中的含义。
- source_word: הָאֲרַמִּי
  choice: 亚兰人
  rationale: 直接对应希伯来语的族群或地域称谓，比传统的“叙利亚人”更准确。
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: 没有告诉他
  rationale: 该结构说明雅各如何瞒着拉班；现代汉语以“没有告诉他”表达自然清楚。
- source_word: כִּי בֹרֵחַ הוּא
  choice: 自己要逃走
  rationale: 分词 בֹרֵחַ 表示正在发生或即将付诸行动的逃离；在本句叙事语境中，“要逃走”比“正在逃走”更符合他未预先告知拉班这一含义，同时保留行动的紧迫性。
