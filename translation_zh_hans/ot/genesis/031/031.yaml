  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: zh_hans
  text: 雅各回答拉班说：“我害怕，因为我心想：‘恐怕你会把你的女儿从我身边强行夺走。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答……说
  rationale: 保留希伯来叙事中“回答”与“说”并用的表达，同时符合现代汉语的庄重叙事语体。
- source_word: כִּי יָרֵאתִי
  choice: 我是因为害怕
  rationale: 首个 כִּי 表原因；这一译法自然地说明雅各秘密离开的缘由。
- source_word: כִּי אָמַרְתִּי
  choice: 心想
  rationale: אָמַרְתִּי 字面为“我说”，但此处是雅各内心的自语；“心想”准确表达语境功能，避免让读者误以为他曾对别人说出这话。
- source_word: פֶּן
  choice: 恐怕
  rationale: 表达因担忧而设想的可能结果，在现代汉语中自然，也保留原文的忧惧意味。
- source_word: תִּגְזֹל
  choice: 强行夺走
  rationale: גזל 不只是一般的“带走”，还含有以强力、不正当地夺取之意；“强行夺走”在亲属语境中清楚保留这一力度。
- source_word: בְּנוֹתֶיךָ מֵעִמִּי
  choice: 把你的女儿从我身边……夺走
  rationale: 直译亲属称谓，并将 מֵעִמִּי 所表达的从雅各同在之处被分离自然译为“从我身边”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“强行夺走”体现原文动词的强烈语义，无须另设脚注；“心想”按语境呈现内心言语。
