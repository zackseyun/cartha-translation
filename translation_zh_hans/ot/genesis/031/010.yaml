base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: zh_hans
  text: 羊群发情的时候，我举目观看，在梦中看见：看哪，正爬跨羊群中母畜的公山羊，都是有条纹[a]、有斑点和有杂斑[b]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有环纹”或“有带状纹”。希伯来语所指的是环带状的纹路。
    reason: lexical_alternative
  - marker: b
    text: 或译“斑驳的”或“杂色的”。原文列出的三个词很可能指三种不同的毛色纹样。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: ……的时候
  rationale: 该结构引出事情发生的时间背景；汉语用“……的时候”自然承接叙事，无须机械译出“事情发生了”。
- source_word: יַחֵם הַצֹּאן
  choice: 羊群发情
  rationale: יחם在牲畜繁殖语境中指进入发情状态；此译比单说“交配”更贴近词义，也与下文公山羊爬跨羊群的景象相符。
- source_word: וָאֶשָּׂא עֵינַי
  choice: 我举目一看
  rationale: 保留希伯来语“举起眼睛”的惯用意象，同时符合现代汉语表达。
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: 在梦中看见
  rationale: 明确梦是观看异象的情境或媒介，不额外断定特指某一个先前提到的梦。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה所带出的突然呈现感和鲜明的视觉效果。
- source_word: הָעַתֻּדִים
  choice: 公山羊
  rationale: 该词具体指雄性山羊；“公山羊”是清楚、通行的现代汉语称谓。
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: 爬在羊群身上
  rationale: עלה על在这里描写公羊爬跨交配的动作；译文保留原文的具体画面，而不只概括为“与羊群交配”。
- source_word: עֲקֻדִּים
  choice: 有条纹
  rationale: 该词表示带状或环状斑纹；“有条纹”简明易懂，词义的其他可能表达在脚注中说明。
- source_word: נְקֻדִּים
  choice: 有斑点
  rationale: 该词指点状斑纹；此译与前后的条纹和杂斑形成清楚区别。
- source_word: וּבְרֻדִּים
  choice: 有杂斑
  rationale: 该词可能指杂色、斑驳的毛色；“有杂斑”既自然，也尽量与“有斑点”区分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“发情”准确表达牲畜繁殖语境；“爬在羊群身上”保留原文具体但含蓄的交配描写。标点用冒号引出梦中所见，并以“看哪”再现原文的现场感。
