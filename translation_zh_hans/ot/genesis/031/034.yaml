  rationale: 修订仅澄清两个与原文密切相关的指代与词义问题：以“家中的神像”作为正文的明确表达，并保留术语及替代译法；以“坐在它们上面”直接对应原文复数代词。其余叙事时序、触觉搜寻的细节及未找到对象的表达均予保留。
