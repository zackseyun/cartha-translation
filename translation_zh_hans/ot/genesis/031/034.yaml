  source_fidelity: “家神”可作תְּרָפִים的简略表达，但在现代汉语中较容易被理解为真实的家庭守护神，而原文所指的具体性质及形制并不完全确定。译作“家中的神像”，并在脚注保留“家神”及音译，更准确地传达其作为家庭崇拜物的性质，也不排除术语的歧义。原文“坐在它们上面”应在中文中明确指向这些物件，而不只是鞍垫。
  naturalness: 原译总体通顺、叙事庄重。“自己坐在上面”的“自己”并非原文所需，且“上面”的先行词可被读作鞍垫。改为“然后坐在它们上面”更清楚，也自然保留动作次序。“骆驼的鞍垫里”比复合名词“骆驼鞍垫里”稍更顺畅。
