base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: zh_hans
  text: 拉结已经拿了家中的神像[a]，把它们放在骆驼的鞍垫里[b]，然后坐在它们上面。拉班用手摸遍了整个帐篷，却没有找到它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家神”，也可音译为“特拉非”。希伯来语这个词指家庭祭祀所用的宗教物件或神像。
    reason: lexical_alternative
  - marker: b
    text: 或译“骆驼鞍里”。这里很可能指骆驼骑乘装备中带软垫的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: 那些家神
  rationale: 该词指家庭祭祀所用的神像或宗教物件。“家神”在现代汉语中简明自然，也保留其作为家庭崇拜对象的含义；脚注说明也可理解为“家中的神像”。
- source_word: בְּכַר הַגָּמָל
  choice: 在骆驼鞍垫里
  rationale: כַּר通常指垫子或有衬垫的物件；在骆驼语境中，很可能是骆驼鞍具的软垫部分。“骆驼鞍垫”既具体又易懂。
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: 自己坐在上面
  rationale: 按叙事顺序直译其动作；“自己”使主语转换在汉语中更清楚，“上面”自然表达她坐在藏有家神的鞍垫之上。
- source_word: וַיְמַשֵּׁשׁ
  choice: 用手摸遍
  rationale: מששׁ突出以触摸方式搜寻，而不是泛指查看或搜查。“用手摸遍”保留了触觉搜索的具体意味。
- source_word: כָּל הָאֹהֶל
  choice: 整个帐篷
  rationale: 自然对应“全帐篷”，符合现代汉语表达。
- source_word: וְלֹא מָצָא
  choice: 却没有找到它们
  rationale: 原文宾语省略，但所指显然是家神；汉语补出“它们”更清楚。“却”表达搜遍而未找到的转折。
- source_word: וְרָחֵל לָקְחָה
  choice: 拉结已经拿了
  rationale: 此处完成式为随后拉班搜查提供背景，译为“已经拿了”自然表达先于搜查发生的动作；句首连接词不机械译成“现在”。
theological_decisions:
- issue: תְּרָפִים所指对象的性质
  choice: 家神
  alternative: 家中的神像／特拉非
  rationale: 原词可指家庭崇拜中的神像或祭祀物件。“家神”保留其宗教属性而不把其具体形制说得过死；脚注呈现其他可能表达。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“用手摸遍”保留原文触觉搜寻的画面；“已经”体现首个完成式对后续搜查的背景作用。脚注标记均置于相关词语之后。
