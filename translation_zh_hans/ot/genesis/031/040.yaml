  yaml_path: translation/ot/genesis/031/040.yaml
  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: zh_hans
  text: 我当时的情形是这样[a]：白天，酷热吞噬我；夜间，寒霜也如此；我眼中的睡意逃去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文开头直译为“我曾是（这样）”，用以引出下文所述的处境。也可不另译出，直接作：“白天，酷热吞噬我；夜间，寒霜也如此；我眼中的睡意逃去了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי
  choice: 我就是这样
  rationale: 该词直译为“我是／我曾处于”，在这里引出雅各所经历的处境。译为“我就是这样”既保留其明示的引介作用，也符合现代汉语叙述习惯。
- source_word: בַיּוֹם
  choice: 白天
  rationale: 表示白昼期间，并与后面的“夜里”形成鲜明对照。
- source_word: אֲכָלַנִי
  choice: 吞噬我
  rationale: אכל本义为“吃”，此处以强烈的比喻描写严酷天气对人的折磨；“吞噬我”保留原文意象。
- source_word: חֹרֶב
  choice: 酷热
  rationale: 该词可指干旱、干热或灼热；在与夜间寒霜对举的语境中，“酷热”最能表达白天暴晒的处境。
- source_word: וְקֶרַח
  choice: 寒霜
  rationale: קֶרַח可指冰或霜；此处描述夜间严寒，“寒霜”既准确又自然，并与“酷热”形成对照。
- source_word: בַּלָּיְלָה
  choice: 夜里
  rationale: 表示夜间，与“白天”构成平衡的时间对句。
- source_word: וַתִּדַּד
  choice: 逃走
  rationale: 这个较少见的动词表达离去、逃离；以睡眠为主语时，“逃走”保留了原文的拟人意味。
- source_word: שְׁנָתִי
  choice: 睡眠
  rationale: 指睡眠状态；“睡眠”是清楚、庄重的现代汉语表达。
- source_word: מֵעֵינָי
  choice: 从我眼中
  rationale: 保留希伯来语描写失眠的具体意象，也能为现代汉语读者自然理解。
