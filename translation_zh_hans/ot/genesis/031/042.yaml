reference: Genesis 31:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: zh_hans
  text: 若不是我父亲的上帝——亚伯拉罕的上帝和以撒的敬畏[a]——与我同在，你如今早已叫我空手离去了。上帝看见了我的困苦和我双手的劳苦，昨夜便作出了裁断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以撒的敬畏”，这是对上帝的一个独特称号；也可理解为“以撒所敬畏的那一位”。
    reason: 说明特殊神圣称号的字面形式及可能理解。
lexical_decisions:
- source_word: לוּלֵי
  choice: 要不是
  rationale: 引出与事实相反的条件，现代汉语用“要不是”自然、准确。
- source_word: אֱלֹהֵי אָבִי
  choice: 我父亲的上帝
  rationale: 直接保留希伯来语属格结构及祖辈信仰身份。
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: 亚伯拉罕的上帝
  rationale: 按原文结构直译。
- source_word: וּפַחַד יִצְחָק
  choice: 以撒所敬畏的那一位
  rationale: פַחַד字面为“惧怕、畏惧”，在此用作上帝的特殊称号；正文以自然汉语表明所指，同时脚注保留字面表达。
- source_word: הָיָה לִי
  choice: 与我同在
  rationale: 此处表达上帝对雅各的临在和支持，比字面的“属于我／为我”更符合现代汉语习惯。
- source_word: כִּי עַתָּה
  choice: 如今早已
  rationale: 传达反事实条件下结果本来已经发生的时间和强调意味。
- source_word: רֵיקָם
  choice: 空手
  rationale: 汉语惯用表达，指没有所得或财物。
- source_word: שִׁלַּחְתָּנִי
  choice: 叫我……离去
  rationale: 在反事实条件中与“早已”配合，表达本会被打发走。
- source_word: עָנְיִי
  choice: 我的困苦
  rationale: 涵盖雅各所受的苦楚与苛待，不局限于贫穷。
- source_word: יְגִיעַ כַּפַּי
  choice: 我双手的劳苦
  rationale: 保留身体意象，并清楚表达亲手辛勤劳作。
- source_word: רָאָה אֱלֹהִים
  choice: 上帝看见了
  rationale: 按叙事时序译为完成的过去行动。
- source_word: וַיּוֹכַח
  choice: 便作出了裁断
  rationale: יכח在争议语境中可指判明、裁断或责备；原文没有明说宾语，故保留司法性含义及一定歧义，不补入“你”。
- source_word: אֶמֶשׁ
  choice: 昨夜
  rationale: 与本章上帝夜间向拉班显现并警告他的叙事背景相合。
theological_decisions:
- issue: 神圣称号 וּפַחַד יִצְחָק 的表达
  choice: 以撒所敬畏的那一位
  alternative: 以撒的敬畏／以撒所惧怕的那一位
  rationale: 原文是独特而压缩的称号。正文明确其指向上帝，以免汉语读者将“敬畏”误当作抽象事物；脚注注明字面形式，保留原文的特殊神学表达。
- issue: וַיּוֹכַח 的语义及宾语
  choice: 便作出了裁断
  alternative: 便责备了／便判明了是非／便警告了你
  rationale: 该动词兼有裁断、判明、责备等含义；本章语境指向上帝昨夜对拉班的干预，但希伯来文未明说宾语。因此不补“你”，也不把司法与责备之间的张力完全消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“要不是……早已……”清楚表达反事实条件；“裁断”保留争议语境中的司法意味，同时避免给原文无宾语的动词擅自补入对象。
