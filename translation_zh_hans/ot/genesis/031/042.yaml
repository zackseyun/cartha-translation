  to: 若不是我父亲的上帝——亚伯拉罕的上帝和以撒的敬畏[a]——与我同在，你如今早已叫我空手离去了。上帝看见了我的困苦和我双手的劳苦，昨夜便作出了裁断。
  rationale: 修正首句并列称号的句法，使反事实条件的主语明确而自然；同时在正文保留“以撒的敬畏”这一特殊称号，借脚注提供解释性替代。其余措辞忠实且自然，尤其“作出了裁断”在不补出宾语的前提下保留了 וַיּוֹכַח 的争议裁断／责备语境。
