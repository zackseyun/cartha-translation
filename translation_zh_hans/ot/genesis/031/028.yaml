  yaml_path: translation/ot/genesis/031/028.yaml
  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: zh_hans
  text: 你没有让我亲吻我的儿子和女儿[a]。如今你这样做，实在愚蠢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“你没有留下我去亲吻我的儿子和女儿。”
    reason: 词义替代：נטשׁ通常意为“离开、撇下”；此处与“亲吻”连用，可按希伯来语形式译为“留下我去……”。
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: 不让我
  rationale: נטשׁ本义常为“离开、撇下”，但在此与不定式“亲吻”连用，表达不给某人做某事的机会。“不让我”符合现代汉语习惯，也保留拉班责怪的语气。
- source_word: לְנַשֵּׁק
  choice: 亲吻
  rationale: 原文仅说“亲吻”。上下文虽暗含告别之吻，但不在正文增添“告别”，以免明说原文仅暗示的信息。
- source_word: לְבָנַי וְלִבְנֹתַי
  choice: 我的儿子和女儿
  rationale: 原文分别列出“儿子”和“女儿”，因此不笼统译作“孩子们”。其中“儿子”在叙事关系上可指外孙，但正文保留拉班的亲属称谓。
- source_word: עַתָּה
  choice: 如今
  rationale: 作为时间兼话语标记，引出拉班对雅各行为的评价；“如今”自然且庄重。
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: 你这样做，实在愚蠢
  rationale: 该结构意为“行事愚蠢”。此译法在现代汉语中自然，并保留原文对行为的直接评断。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“竟”传达拉班责怪和惊讶的语气；不添加原文未明说的“告别”。脚注标记已在正文对应位置列出。
