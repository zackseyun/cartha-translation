  rationale: 将“带上”改为“带着”，避免不必要的临时携带意味；将所属和取得关系改为“他所有的／他所获得的”，使表达更自然。以破折号保留希伯来文对所获牲畜的重复性补充说明，同时维持“前往迦南地，到他父亲以撒那里”的目的地与人物目标。
