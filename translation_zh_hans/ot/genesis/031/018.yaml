base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: zh_hans
  text: 他赶着他所有的牲畜，带着他所获得的一切财物——就是他在巴旦·亚兰所获得的牲畜——前往迦南地，到他父亲以撒那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: 赶着
  rationale: נהג在牧养语境中指驱赶牲畜前行；“赶着”既准确又符合现代汉语习惯。
- source_word: מִקְנֵהוּ
  choice: 自己所有的牲畜
  rationale: מִקְנֶה泛指成群饲养的牲畜，不限于牛；“牲畜”范围合适。后缀所表达的所属关系译为“自己所有的”。
- source_word: רְכֻשׁוֹ
  choice: 自己所得的一切财物
  rationale: רְכוּשׁ指财产、资财，尤其可携带的产业；“财物”在此清楚自然，并与后面的“所得”相连。
- source_word: רָכָשׁ
  choice: 所得
  rationale: רכש表示取得、置办财产。“所得”简洁地保留经济与所有权含义，也保留原文在本节中的重复。
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: 所得的牲畜
  rationale: 该短语强调这些牲畜是雅各取得并归他所有的产业。汉语用“所得的牲畜”自然表达这一点，并避免生硬的同义叠加。
- source_word: בְּפַדַּן אֲרָם
  choice: 在巴旦·亚兰
  rationale: 按地名音译；中点使复合地名的结构清楚。
- source_word: לָבוֹא אֶל יִצְחָק אָבִיו
  choice: 到他父亲以撒那里
  rationale: 不定式表达行程的目的；“到……那里”准确呈现朝向以撒而去。
- source_word: אַרְצָה כְּנָעַן
  choice: 往迦南地去
  rationale: אַרְצָה带方向性，表示朝迦南地而去；“往……去”在现代汉语中明确保留这一方向含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句中保留“所得”的重复，以反映希伯来文对雅各所取得财产与牲畜的强调；同时用“就是”标明后半短语对前述财物的补充说明。目的地与探亲目的分别译作“往迦南地去，到他父亲以撒那里”，避免把原文的方向形式误解为静态位置。
