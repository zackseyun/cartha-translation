revisions:
- from: 雅各对他的弟兄们[a]说：“你们捡些石头来。”他们就拿来石头，堆成一堆，然后在那里靠着石堆吃饭。[b]
  to: 雅各对他的弟兄们[a]说：“你们收集石头。”他们就拿了石头，堆成一堆石头；他们在那里，在石堆旁吃饭。[b]
  rationale: 本次仅作安全的源语贴近性修订：以“收集石头”取代含有额外数量及方向色彩的“捡些石头来”，以“拿了石头”对应“取了石头”，并明确石堆为“一堆石头”。保留正文对介词的自然语境性处理，脚注则保留“在石堆上”的字面替代读法及“弟兄们”的广义范围。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:39Z'
