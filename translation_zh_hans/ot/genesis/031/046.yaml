base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: zh_hans
  text: 雅各对他的弟兄们[a]说：“你们收集石头。”他们就拿了石头，堆成一堆石头；他们在那里，在石堆旁吃饭。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”在这里也可能泛指雅各的男性亲属或同伴，不一定只是亲兄弟。
    reason: cultural_note
  - marker: b
    text: 或译：“他们在那里，在石堆上吃饭。”希伯来语介词较字面的意思是“在……上”，也可按语境理解为“在……旁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: 对他的弟兄们
  rationale: אָח的基本义是“兄弟”，也可泛指男性亲属或同伴。正文采用贴近原文且性别明确的“弟兄们”，以脚注说明其范围可能更广。
- source_word: לִקְטוּ אֲבָנִים
  choice: 捡些石头来
  rationale: לקט表示拾取、收集；在此处命人收集石头的语境中，“捡些石头来”自然清楚，并体现命令语气。
- source_word: וַיַּעֲשׂוּ גָל
  choice: 堆成一堆
  rationale: גַּל指堆积物，此处由石头堆成。“堆成一堆”通俗自然，也保留原文的动作表达。
- source_word: עַל הַגָּל
  choice: 靠着石堆
  rationale: עַל通常可译为“在……上”，也可按语境表示“在……旁、靠着”。正文采用符合用餐场景的“靠着”，同时以脚注保留较字面的“在石堆上”。
theological_decisions: []
