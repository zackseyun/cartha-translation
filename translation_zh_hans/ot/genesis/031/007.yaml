id: GEN.31.7
reference: Genesis 31:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: zh_hans
  text: 可是你们的父亲欺骗我，十次更改我的工钱[a]；但神没有容许他加害于我。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十次”也可理解为“屡次”或“再三”，可能是表示反复发生的惯用说法，并不一定是精确计数。
    reason: cultural_note
  - marker: b
    text: 原文直译近于“神没有给他加害于我”，意思是神没有容许他伤害我。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: 欺骗
  rationale: 该词的使役式可指以欺诈或戏弄的方式对待人；在拉班反复更改工钱的语境中，“欺骗”最自然，并保留其不诚实对待雅各的含义。
- source_word: וְהֶחֱלִיף
  choice: 更改
  rationale: 这里指拉班改变原先约定的报酬条件；“更改”适合劳务与工钱的语境。
- source_word: מַשְׂכֻּרְתִּי
  choice: 我的工钱
  rationale: 该名词指劳动所得的工资或报酬；“工钱”在现代汉语中清楚自然，也符合叙事背景。
- source_word: עֲשֶׂרֶת מֹנִים
  choice: 十次
  rationale: 直译为“十次”，也可能是表示屡次、再三的惯用说法，不必然强调精确次数；正文保留原文数字，并以脚注说明。
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: 但神没有容许他
  rationale: 原文近于“神没有把它给他”，在此是没有给他机会或许可的意思；译为“没有容许他”既通顺，也保留神主动拦阻的表达。
- source_word: לְהָרַע עִמָּדִי
  choice: 加害于我
  rationale: 该结构表示恶待某人或伤害某人；“加害于我”简洁庄重，并准确表达敌意行为。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处在雅各的话中指独一的神，译作“神”。
theological_decisions:
- issue: “神没有给他加害于我”这一希伯来语表达中的神圣拦阻
  choice: 神没有容许拉班加害雅各
  alternative: 神没有让拉班成功伤害雅各；神没有把雅各交在拉班手中
  rationale: 原文强调神没有给拉班作恶的机会或许可。“没有容许”保留神主动限制拉班的意思，同时不进一步断定拉班是否已经采取行动或仅有意图。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“欺骗”承接下文反复更改工钱的具体行为；“加害于我”比“伤害我”略庄重，适合经文语体。脚注标记均置于所解释内容之后。
