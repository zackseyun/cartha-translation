  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: zh_hans
  text: 你们自己知道，我曾竭尽全力服事你们的父亲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为你们的父亲做工。”希伯来语动词既可表示“服事”，也可表示“做工”；两种意思都符合雅各多年在拉班手下劳作的情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: 你们自己
  rationale: 独立的第二人称阴性复数代词带有强调意味；译作“你们自己”，保留雅各对拉结和利亚的着重称呼。句首连接词וְ在中文中可依语流不明译，以免表达生硬。
- source_word: יְדַעְתֶּן
  choice: 知道
  rationale: 该完成式可表示已经形成并持续到现在的认知状态，现代汉语用“知道”自然准确。
- source_word: כִּי
  choice: （宾语从句，不另译）
  rationale: 此词引出“知道”的内容；汉语可直接承接后面的分句，无须机械译作“就是”或“即”。
- source_word: בְּכָל־כֹּחִי
  choice: 尽我一切力量
  rationale: כֹּחַ表示力量、能力；这里强调雅各为拉班劳作时全力以赴。“尽我一切力量”既自然，也保留总体用力的含义。
- source_word: עָבַדְתִּי
  choice: 服事
  rationale: עבד兼有“服事”和“做工”的含义。以人为宾语时，“服事”保留其关系性，同时仍涵盖雅各长期劳作的语境；脚注列出“为……做工”这一同样可行的译法。
- source_word: אֶת־אֲבִיכֶן
  choice: 你们父亲
  rationale: אֶת是直接宾语标记，无须单独翻译；“服事你们父亲”在汉语中可直接表达原文关系。
