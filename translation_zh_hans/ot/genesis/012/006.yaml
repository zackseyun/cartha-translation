base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: zh_hans
  text: 亚伯兰经过那地，来到示剑的地方，到了摩利橡树那里。[a] 当时，迦南人住在那地。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “橡树”所译的希伯来词指一种大树；确切树种不明，也可译作“笃耨香树”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文用单数形式的族名“迦南人”，但可作为集合称谓，指迦南人这个族群。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 走遍
  rationale: 该动词在连续叙事形式中描述亚伯兰穿行此地；“走遍”自然表达经过、穿越之意，又不额外限定路线或方式。
- source_word: בָּאָרֶץ
  choice: 那地
  rationale: 带冠词，指上下文中的迦南地；“那地”符合现代汉语叙事习惯。
- source_word: עַד מְקוֹם שְׁכֶם
  choice: 直到示剑地方
  rationale: 保留מְקוֹם“地方、地点”，避免直接把它等同于后来发展成熟的城市；עַד译作“直到”，表达行程所达之处。
- source_word: אֵלוֹן מוֹרֶה
  choice: 摩利橡树
  rationale: אֵלוֹן指一种大树，常译为橡树或笃耨香树，但确切树种不明；正文采用简明且有传统基础的“橡树”，并用脚注说明。מוֹרֶה按地名音译为“摩利”。
- source_word: וְהַכְּנַעֲנִי
  choice: 迦南人
  rationale: 希伯来文为带冠词的单数族名，可作集合称谓；汉语“迦南人”本身不强制标明单复数，既贴近原文，也自然指该族群。
- source_word: אָז בָּאָרֶץ
  choice: 那时……还住在那地
  rationale: אָז译为“那时”；原文只说“在那地”，汉语补出状态动词“住”，并以“还”自然表达当时仍在当地的背景情形。
theological_decisions:
- issue: וְהַכְּנַעֲנִי的单数族名是否按集合意义处理
  choice: 正文用数目中性的“迦南人”
  alternative: “迦南族当时在那地”或明确复数意义为“迦南人当时住在那地”
  rationale: 希伯来文形式为单数，但族名可集合性地指整个群体。现代汉语“迦南人”可兼容个体形式与集合意义，因此不必强行消解原文的数目张力；脚注予以说明。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“示剑地方”保留原文“地方”一词；“到了……那里”避免汉语中连续两个“直到”的生硬感。“还住在”使无系词的希伯来语处所句在现代汉语中自然成立。
