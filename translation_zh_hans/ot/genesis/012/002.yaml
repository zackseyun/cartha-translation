base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: zh_hans
  text: 我要使你成为大国，赐福给你，使你的名声显赫；你要成为祝福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你要成为祝福”也可理解为“你必成为祝福”。希伯来语用的是命令式“要成为”，但在这一连串应许中，也有人认为它表达前述应许所带来的结果。
    reason: 保留命令式与结果性理解之间的真实歧义。
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: 我要使你成为大国
  rationale: עָשָׂה加宾语后接לְ表语，在这里表示把亚伯兰立为或使其成为某种群体；גּוֹי גָּדוֹל自然译为“大国”，指庞大的民族共同体。
- source_word: וַאֲבָרֶכְךָ
  choice: 赐福给你
  rationale: בָּרַךְ的使役强化词干在此直接表示“赐福”；明确保留第二人称宾语，以呈现应许的个人指向。
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: 使你声名显赫
  rationale: 直译为“使你的名为大”。现代汉语以“声名显赫”自然表达שֵׁם在此所含的名望之意，同时保留“名”这一核心意象。
- source_word: וֶהְיֵה בְּרָכָה
  choice: 你要成为福分
  rationale: וֶהְיֵה是היה的第二人称阳性单数命令式，因此用“你要”保留劝令语气；בְּרָכָה是单数名词，译作“福分”，表达亚伯兰要成为他人蒙福的媒介或体现。
theological_decisions:
- issue: וֶהְיֵה בְּרָכָה的语气
  choice: 按命令式译为“你要成为福分”
  alternative: 按结果或预告译为“你必成为福分”
  rationale: 希伯来语形态明确是命令式，正文应保留从上帝的应许转向亚伯兰使命的语气变化；但因本句处于一连串应许之中，也可能具有结果性或预告性的含义，故在脚注中保留这一理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“声名显赫”避免生硬直译“使你的名为大”；分号凸显前三个应许与末尾命令之间的修辞转折，同时不把它拆成与原文连接关系无关的独立句。
