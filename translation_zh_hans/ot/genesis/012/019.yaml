    rationale: אֲחֹתִי意为“我的姐妹／姊妹”，本身不区分姐姐或妹妹。译作“妹妹”将撒莱限定为亚伯兰的较年轻女性同胞，超出本节语义。
  - severity: low
    issue: 末句的“吧”略微缓和了命令。
    rationale: קַח וָלֵךְ是两个直接的阳性单数命令。“把她带走！”在中文中自然保留命令力度，同时表达“拿取她并离去”的连续动作。
