base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: zh_hans
  text: “你为什么说：‘她是我的姊妹’，以致我娶她为妻呢？现在，你的妻子在这里；把她带走！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  choice: 你为什么说
  rationale: 直接保留质问语气；现代汉语用“为什么说”自然准确。
- source_word: אֲחֹתִי הִוא
  choice: 她是我的妹妹
  rationale: 按引语中的无动词句译为现在时；“妹妹”符合撒莱相对亚伯兰的性别关系，也自然表达亲属称谓。
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: 以致我把她娶来作妻子
  rationale: וַ־在语境中承接亚伯兰的陈述所造成的结果；“以致”避免误作目的。“娶来作妻子”自然表达“为自己取她为妻”。
- source_word: וְעַתָּה הִנֵּה אִשְׁתְּךָ
  choice: 现在，你的妻子在这里
  rationale: “现在”标示由责问转入处置；“在这里”传达הִנֵּה的指示、引人注意功能，又避免古雅的“看哪”。
- source_word: קַח וָלֵךְ
  choice: 把她带走吧
  rationale: 两个相连的命令在汉语中合并为自然的处置命令；宾语由上下文补出。“吧”使口吻符合现代汉语命令句，不削弱其驱逐意味。
theological_decisions:
- issue: 法老是否已实际与撒莱成婚
  choice: 娶来作妻子
  alternative: 把她带来，要她作我的妻子
  rationale: 希伯来文明确使用“取……为妻”的婚姻表达，但本节并不交代婚姻是否完成或同房与否；译文保留这一叙事张力，不额外断定。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事对白。“以致”明确前句导致后果，而不将其误解为目的；末句用“把她带走吧”简洁传达连续命令。
