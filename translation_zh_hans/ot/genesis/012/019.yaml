review_pass:
  verdict: revise
  source_fidelity: “妹妹”在现代汉语中特指较年轻的女性同胞，而希伯来语 אֲחוֹת 不标明长幼；本节不能据此断定撒莱是亚伯兰的妹妹。宜改为不标示年龄的“姊妹”。其余句意基本忠实地传达了法老的质问、后果及命令。
  naturalness: “她是我的姊妹”带有适度庄重的经文对白语体，在现代标准汉语中仍清楚自然，并避免“妹妹”的年龄限定。“把她带走！”简洁自然地合并了“拿取”和“去”两个连续命令；去除“吧”可保留原文直接的命令语气。
  terminology: “姊妹”在此为亲属称谓，不应理解为现代教会语境中的信徒称呼；在单数、上下文明确的直接引语中意思清楚。“娶她为妻”准确对应“取她归自己为妻”的婚姻习语，未对婚姻是否实际完成或是否同房作额外断言。
  issues:
