base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: zh_hans
  text: 他快要进入埃及的时候，就对妻子撒莱说：“你看，我知道你是个容貌美丽的女人。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你是个看起来很美的女人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……的时候，就……
  rationale: 这是希伯来叙事中引出随后事件的常见结构。中文用“……的时候，就……”自然表达时间背景和事件推进；若直译为“事情发生了，当……”则显得生硬。
- source_word: הִקְרִיב לָבוֹא
  choice: 快要进入
  rationale: קרב 的使役式与 בוא 不定式连用，表示已经临近并即将进入；“快要进入”兼顾空间上的接近和动作的迫近。
- source_word: מִצְרָיְמָה
  choice: 埃及
  rationale: 地名所带的方向词尾表示朝埃及而去；在“进入”之后，现代汉语无需另译方向成分。
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: 妻子撒莱
  rationale: 自然表达撒莱与他的婚姻关系，同时保留专名。
- source_word: הִנֵּה נָא
  choice: 你看
  rationale: הִנֵּה 是引起注意的标记，נָא 增添柔和、恳切或强调的语气；对妻子说话时译作“你看”自然且不古奥。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 完成式在这里表达已经形成并持续存在的认知状态，现代汉语以“我知道”最为自然。
- source_word: אִשָּׁה יְפַת מַרְאֶה אָתְּ
  choice: 你是个容貌美丽的女人
  rationale: 保留 אִשָּׁה“女人”和 יְפַת מַרְאֶה“容貌美丽”的明说，并用自然的现代汉语语序表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“他快要进入埃及的时候，就……”既保留原文的时间关系和叙事推进，也避免机械复制希伯来语的“事情发生了”公式。代词“他”承接上文的亚伯兰；本节原文没有再次出现其名字。
