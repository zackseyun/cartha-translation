base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: zh_hans
  text: 雅威向亚伯兰显现，说：“我要把这地赐给你的后裔[a]。”亚伯兰就在那里为那向他显现的雅威筑了一座坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“种子”。希伯来语这个词在形式上是单数，也可用作集合名词，指后代这一整体。
    reason: 说明 זֶרַע 可直译为“种子”，并保留其单数形式和集合性意义。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名四字母词的现代汉语音译，保留其作为专名的性质，不以“主”这一称号替代。
- source_word: וַיֵּרָא
  choice: 显现
  rationale: ראה 的尼法勒式在这里指雅威以可感知的方式向亚伯兰显现；“显现”自然、庄重，也不额外说明显现的具体形式。
- source_word: לְזַרְעֲךָ
  choice: 给你的后裔
  rationale: זֶרַע 在形式上是单数，在语义上可作集合名词。“后裔”符合现代汉语习惯，同时不限定为某一个人或多个个体；脚注保留“种子/后代”这一原文张力。
- source_word: אֶתֵּן
  choice: 我要……赐给
  rationale: 未完成式在应许语境中表达将来的承诺；“我要……赐给”传达应许和赠予的语气。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: אֶרֶץ 在此指亚伯兰所在并蒙应许之地；“这地”简洁自然，避免现代政治意义较强的“这个国家”。
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: 亚伯兰就在那里……筑了一座坛
  rationale: 连续叙事形式推进事件；补出主语“亚伯兰”使现代汉语指代清楚，“就”也自然呈现他对显现与应许的回应。
- source_word: לַיהוָה
  choice: 为……雅威
  rationale: 介词 לְ 表明祭坛的归属或奉献对象；汉语“为……筑坛”最为自然。
- source_word: הַנִּרְאֶה אֵלָיו
  choice: 向他显现的
  rationale: 带冠词的分词短语修饰雅威，明确祭坛是为那位向亚伯兰显现的雅威所筑，不把分词的细微时态含义过度具体化。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”保留专名功能，并与以称号“主”替换的传统做法区别开来。
- issue: זֶרַע 在应许中的单数形式与集合意义
  choice: 后裔，并加脚注说明原文直译
  alternative: 种子；子孙
  rationale: “后裔”是自然的现代汉语，也能作集合概念；脚注则保留希伯来词形式为单数以及可能指整体后代的张力，不预先将其限定为单一个体或纯粹复数群体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“筑了一座坛”延续常见圣经用语，但句法保持现代汉语自然顺畅。神名统一音译为“雅威”。
