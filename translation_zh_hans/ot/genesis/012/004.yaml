base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: zh_hans
  text: 亚伯兰就照耶和华对他说的话去了，罗得也和他同去。亚伯兰离开哈兰时七十五岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 去了
  rationale: הלך的连续式在叙事中表示过去的行动；“去了”简洁自然，不额外强调启程动作。
- source_word: כַּאֲשֶׁר
  choice: 照……所说的
  rationale: 表达亚伯兰的行动与耶和华先前话语相符；中文用“照……所说的”自然体现遵从关系。
- source_word: דִּבֶּר אֵלָיו
  choice: 对他所说的
  rationale: 保留דבר“说、讲话”的意义；汉语结构已自然表明这话先于亚伯兰动身，无须使用形式上的过去完成时。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译“耶和华”，将其作为专名而非以“主”这一称号代替。
- source_word: אִתּוֹ
  choice: 和他同去
  rationale: 准确表达“与他一起”，并在中文中补出“去”，使并列动作清楚自然。
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: 七十五岁
  rationale: 将希伯来语年龄习语按现代汉语惯用方式表达。
- source_word: בְּצֵאתוֹ
  choice: 离开……时
  rationale: ב加不定式结构标明时间；“离开……时”自然准确，并保留יצא离去、出来的语义。
- source_word: מֵחָרָן
  choice: 哈兰
  rationale: 按现代中文圣经中该地名的通行译法音译；来源介词מֵ由“离开”体现。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应译作专名而不以“主”替代。“耶和华”是普通中文读者最熟悉且通行的神名形式；“雅威”更接近学界常见的拟音，但在现代标准汉语普及文本中熟悉度较低。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文两次“去”的叙事推进，同时将年龄句调整为汉语常用的“离开哈兰时七十五岁”。本节无须脚注。
