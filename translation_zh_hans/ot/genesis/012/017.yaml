  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: zh_hans
  text: 但耶和华因亚伯兰的妻子撒莱的缘故，使法老和他的全家遭受严重的灾祸[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……遭受严重的灾祸”也可译作“用重大的灾祸击打”。原文的动词和名词出自同一词根，可表示“击打、使受害”以及“灾祸、击打或病患”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: 使……遭受
  rationale: 这是 נגע 的使役形式，与后面的同根名词 נְגָעִים 连用，表示使人遭受打击或灾害；这样译成现代汉语自然，也保留其致害含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中对四字神名的通行音译，以区别于作为称号的“主”。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代汉语中对埃及君王称号的标准译法。
- source_word: נְגָעִים גְּדֹלִים
  choice: 严重的灾病
  rationale: נְגָעִים 可指打击、灾害或病患，גְּדֹלִים 在此强调程度；“严重的灾病”既符合语境，又不把灾害的具体性质说得过死。
- source_word: וְאֶת בֵּיתוֹ
  choice: 和他全家
  rationale: בֵּיתוֹ 在此主要指法老家中的成员，而非建筑物；“全家”是自然、清楚的现代汉语表达。
- source_word: עַל דְּבַר
  choice: 因……的缘故
  rationale: 该短语在本节说明灾病临到的缘由；此译法保留因果关系，同时不额外断定撒莱本人有罪。
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: 亚伯兰的妻子撒莱
  rationale: 忠实表达同位说明，并以自然汉语明确撒莱与亚伯兰的婚姻关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文读者最熟悉的专名形式，能保留原文使用神之专名而非普通称号的特点；“雅威”是较贴近学术重构读音的可行替代。
- issue: עַל דְּבַר שָׂרַי 所表达的因果责任
  choice: 因亚伯兰的妻子撒莱的缘故
  alternative: 为了亚伯兰的妻子撒莱
  rationale: 原短语指出事件因撒莱而起，但并未明确将道德罪责归给她；译文保留这种张力，不增添“因她犯罪”等解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“但是”承接上文并突出转折；“全家”比直译“房屋”更符合此处 בַּיִת 的群体含义。脚注标记置于完整句末，覆盖动词与同根名词的翻译选择。
