  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: zh_hans
  text: 到时候，埃及人一看见你，就会说：‘这是他的妻子。’他们会杀了我，却让你活着[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却会保全你的性命。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 到时候
  rationale: 这是希伯来语中引出预期情形的表达；译为“到时候”既保留将来指向，也符合现代汉语习惯，避免生硬直译为“事情将是，当……”。
- source_word: יִרְאוּ אֹתָךְ
  choice: 一看见你
  rationale: ראה在此为普通的“看见”；“一……就……”自然呈现本句所预期的紧接反应。
- source_word: הַמִּצְרִים
  choice: 埃及人
  rationale: 准确表达带定冠词的民族称谓；汉语无需另加定指词。
- source_word: אִשְׁתּוֹ זֹאת
  choice: 这是他的妻子
  rationale: 保留指示词זֹאת的辨认语气，并用自然的汉语名词性判断句表达。
- source_word: וְהָרְגוּ אֹתִי
  choice: 他们会杀了我
  rationale: הרג的基本义是“杀”；“杀了我”在此直接、自然，不强化为带法律或道德判断的“谋杀”。
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: 却让你活着
  rationale: חיה的使役式在此意为“使存活、让活着”；“却”明确表达与“杀了我”之间在希伯来语语境中自然形成的转折对比。
