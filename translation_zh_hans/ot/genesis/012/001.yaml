base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: zh_hans
  text: 雅威对亚伯兰说：“你要离开你的本地、亲族和父家，前往我要指示给你的那片土地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文专名直接音译，区别于作为称号的“主”。
- source_word: לֶךְ־לְךָ
  choice: 你要离开……去
  rationale: 该结构以命令式表达出发；反身代词在这里加强命令语气，现代汉语不宜机械译作“为自己去”。结合后面的 מִן 短语译为“离开”。
- source_word: מֵאַרְצְךָ
  choice: 你的本地
  rationale: אֶרֶץ 可指土地、地域或国家；此处与亲族、父家并列，译作“本地”自然且不把概念限定为现代民族国家。
- source_word: מִמּוֹלַדְתְּךָ
  choice: 亲族
  rationale: מוֹלֶדֶת 在此可涉及出生地、宗族或亲属群体；与“本地”和“父家”并列时，“亲族”较好呈现其社会亲缘含义。
- source_word: מִבֵּית אָבִיךָ
  choice: 父家
  rationale: 保留古代亲族社会中的父系家族单位表达，不扩写为单纯的父亲住宅。
- source_word: אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ
  choice: 往我要指示你的地方去
  rationale: 目的地在命令发出时尚未点明；“指示”保留 אַרְאֶךָּ“使你看见／给你看”的意义。此处 אֶרֶץ 依汉语语境译作“地方”，避免生硬重复“地”。
theological_decisions:
- issue: 神名四字母词 יְהוָה 的呈现
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文明确使用神的专名；采用“雅威”以保留专名性质，不以称号替代，也不导入特定宗派用语。
- issue: 亚伯兰受命离开的范围
  choice: 并列保留“本地、亲族和父家”
  alternative: 概括为“故乡和家人”
  rationale: 逐项保留原文三个层面，使土地、广义亲族与父系家族单位之间的张力和递进不被抹平。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你要……去”清楚表达命令；“本地、亲族和父家”简洁保留古代社会语境。未加入原文没有的“现在”等时间副词。
