base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: zh_hans
  text: 亚伯兰带着妻子撒莱、他兄弟的儿子罗得、他们积聚的一切财物，以及他们在哈兰所得的人[a]，出发前往迦南地；他们就到了迦南地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们所招聚的人”；更直译为“他们所造的人”。这里的希伯来语可能指他们在哈兰所得、招聚或归入家户的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 带着
  rationale: 此处表示亚伯兰启程时将家人、财物和家中人口一同带走；“带着”比孤立的“拿”更符合现代汉语叙事。
- source_word: אִשְׁתּוֹ
  choice: 妻子
  rationale: 婚姻语境明确，现代汉语自然译为“妻子”。
- source_word: בֶּן־אָחִיו
  choice: 他兄弟的儿子
  rationale: 保留希伯来语具体的亲属关系表达，不笼统改写为“侄儿”。
- source_word: כָּל־רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: 他们积聚的一切财物
  rationale: רכוש指财物或产业，רכש指取得、积聚；译文既保留词义关联，也避免汉语中“获得的财物”过于生硬。
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: 他们所得的人口
  rationale: נפש在此指人，עשה在这一难解搭配中不是通常意义上的“制造”，而可能指取得、招聚并纳入家户；“所得的人口”保留取得之意，又不擅自限定为奴仆。
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: 出发前往
  rationale: 该组合表达带着目的地启程；“出发前往”自然地传达两个动词共同构成的动作。
- source_word: אַרְצָה כְּנַעַן
  choice: 前往迦南地
  rationale: 保留方向意义及“迦南地”这一地理表达。
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: 他们就到了迦南地
  rationale: 保留原文对目的地的重复，以突出启程目标最终实现。
theological_decisions:
- issue: “他们所得的人口”所指人员的身份
  choice: 不具体称为“奴仆”或“仆人”
  alternative: 他们所得的奴仆／他们招聚的人
  rationale: 原文只用“人（נפש）”及含义宽泛的עשה，并未明说这些人的法律或社会身份；译文不应替原文消除这种不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“他兄弟的儿子”和两次“迦南地”，以体现原文亲属措辞及目的地—抵达的重复结构；对难解的“所造的人”以正文顺畅表达、脚注保存字面形式与歧义。
