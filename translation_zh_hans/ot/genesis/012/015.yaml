base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: zh_hans
  text: 法老的官员看见她，就向法老称赞她[a]；于是，那女人被带进法老的家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向法老推许她”或“向法老说她的好话”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“家”；这里也可能指法老的王室家室，不只是某一座建筑物。
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: 法老的官员
  rationale: שָׂרִים可指首领、臣宰或官员；在宫廷语境中译为“官员”自然清楚，也不暗示他们是王室子弟。
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: 看见她
  rationale: ראה在此是普通的“看见”，无需扩展为注视或端详。
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: 向法老称赞她
  rationale: הלל的Piel词形在此表示称赞或推许；“向法老称赞她”既贴近原文，也符合官员向法老举荐她的叙事语境。
- source_word: וַתֻּקַּח
  choice: 被带进
  rationale: 原文使用被动形式且未说明施事者；“被带进”保留了那女人在事件中的被动地位。
- source_word: הָאִשָּׁה
  choice: 那女人
  rationale: 原文直称“那女人”，没有使用“妻子”一词；直译可避免补入原文此处未明说的身份。
- source_word: בֵּית פַּרְעֹה
  choice: 法老的家
  rationale: בַּיִת既可指房屋，也可指家室或王室内廷；正文保留“家”这一较宽泛的表达，并用脚注说明其可能含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”体现连续叙事的推进；保留“那女人”和被动句式，以避免加入原文没有明说的身份或施事者。
