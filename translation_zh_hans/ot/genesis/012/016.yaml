base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male slaves and female slaves and female donkeys and camels.
translation:
  language: zh_hans
  text: 法老因她而厚待亚伯兰[a]，于是亚伯兰有了羊群、牛群、公驴、男奴隶、女奴隶、母驴和骆驼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了她的缘故”。希伯来语这一表达两种译法都可以。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: 厚待
  rationale: 该动词的使役形式在这里表示善待、优待某人；“厚待”简洁自然，也符合叙事语境。
- source_word: בַּעֲבוּרָהּ
  choice: 因她
  rationale: 该介词短语可表示原因或缘故；“因她”保留这种因果关系，同时不额外断定法老是在为她谋利益。
- source_word: וַיְהִי לוֹ
  choice: 于是亚伯兰有了
  rationale: 希伯来语直译为“于是归他所有”，在此表示因前述厚待而形成的拥有状态；“于是……有了”自然地传达结果和取得之意。
- source_word: צֹאן
  choice: 羊群
  rationale: 这是小型牲畜的集合名词，可涵盖绵羊和山羊；“羊群”在现代汉语中自然，并保留其集合意义而不过度限定种类。
- source_word: בָקָר
  choice: 牛群
  rationale: 该词是牛类牲畜的集合名词；“牛群”与“羊群”平行，并准确表达群体性。
- source_word: חֲמֹרִים
  choice: 公驴
  rationale: 阳性复数在本清单中与后面的母驴明确相对，因此保留性别区别。
- source_word: עֲבָדִים
  choice: 男奴隶
  rationale: 该词可指奴隶或仆役，但在财产清单中从属和被占有的身份突出；译为“男奴隶”既保留历史社会现实，也与后面的阴性名词相对应。
- source_word: שְׁפָחֹת
  choice: 女奴隶
  rationale: 阴性复数指处于奴役或服役地位的女性；在本财产清单中译为“女奴隶”最为明确，并与“男奴隶”形成对应。
- source_word: אֲתֹנֹת
  choice: 母驴
  rationale: 该名词专指雌驴；“母驴”是自然、准确的现代汉语表达。
- source_word: גְמַלִּים
  choice: 骆驼
  rationale: 该复数名词的常规对应词为“骆驼”；汉语名词通常无需另加复数标记。
theological_decisions: []
