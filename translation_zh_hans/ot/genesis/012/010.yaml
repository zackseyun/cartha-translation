id: GEN.12.10
reference: Genesis 12:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨רֶד אַבְרָ֤ם מִצְרַ֨יְמָ/ה֙ לָ/ג֣וּר שָׁ֔ם כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: zh_hans
  text: 那地发生了饥荒，亚伯兰就下到埃及，寄居在那里[a]，因为那地的饥荒十分严重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”指以外来者的身份暂时住在那里。
    reason: 说明 לָגוּר 所含的临时居住及外来者意味。
lexical_decisions:
- source_word: וַיְהִי
  choice: 发生了
  rationale: 该叙事形式引入新的情节发展；结合“饥荒”，“发生了”是自然、明确的现代汉语表达，不额外加入原文没有的“当时”或“如今”。
- source_word: רָעָב
  choice: 饥荒
  rationale: 此词指区域性的粮食严重匮乏，不只是个人饥饿；“饥荒”准确而通行。
- source_word: בָּאָרֶץ
  choice: 那地
  rationale: 这里指亚伯兰所在的当地地域，并非全地球；“那地”保留《创世记》中“地”的叙事关联，并自然承接上文。
- source_word: וַיֵּרֶד
  choice: 下到
  rationale: 保留 ירד“下去”的方向意味，也符合圣经叙事中前往埃及的地理表达。
- source_word: מִצְרַיְמָה
  choice: 到埃及
  rationale: 方向词尾表示朝埃及而去，汉语自然译作“到埃及”。
- source_word: לָגוּר
  choice: 寄居
  rationale: 该词表示以外来者身份暂时居住；“寄居”简洁保留了临时居留及非本地人的含义。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达地点副词的含义。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出亚伯兰下埃及的原因，“因为”在现代汉语中清楚自然。
- source_word: כָבֵד
  choice: 十分严重
  rationale: 原义为“沉重”，在这里形容饥荒程度；“十分严重”自然传达其强烈程度。
- source_word: הָרָעָב
  choice: 饥荒
  rationale: 指回本节开头已经提到的饥荒；汉语无需冠词即可清楚回指。
- source_word: בָּאָרֶץ
  choice: 那地
  rationale: 保留希伯来文对“那地”的重复，以维持强调和叙事连贯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“下到埃及”保留原文方向表达；“寄居”兼顾简洁和原词语义。脚注标记置于“寄居在那里”之后，使说明对象清楚。
