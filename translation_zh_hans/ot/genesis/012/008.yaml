base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: zh_hans
  text: 他从那里往伯特利以东的山地迁移，搭起帐篷；伯特利在西边，艾城在东边。他在那里为雅威筑了一座祭坛，并求告雅威的名[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣告雅威的名。”这个希伯来语表达既可指在敬拜中求告雅威，也可指公开宣告他的名。
    reason: alternative_reading
  - marker: b
    text: “雅威”对应希伯来文神名 YHWH；传统上也译作“耶和华”或“上主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: 迁到
  rationale: 该动词表示从一处移往另一处；“迁到”简洁自然，也保留游牧迁移的叙事含义。
- source_word: הָהָרָה מִקֶּדֶם לְבֵית אֵל
  choice: 到伯特利东边的山区
  rationale: 方向词尾表示朝某处移动；הַר 在此地理语境中指山地或丘陵地带，“山区”比单指一座“山”更符合上下文。
- source_word: וַיֵּט אָהֳלֹה
  choice: 支搭帐篷
  rationale: 这是搭设帐篷的常用表达；“支搭帐篷”准确、自然，并符合庄重的叙事语体。
- source_word: מִיָּם
  choice: 在西边
  rationale: יָם 本义为“海”，在地理方位表达中常指西方；此处描述伯特利相对于亚伯兰营地的位置。
- source_word: וְהָעַי מִקֶּדֶם
  choice: 艾城在东边
  rationale: 与前面的西方位置形成平行结构，清楚表明营地位于伯特利和艾城之间。
- source_word: מִזְבֵּחַ
  choice: 一座坛
  rationale: 指献祭或敬拜所用的坛；“坛”是准确而通行的圣经用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对四字神名 YHWH 的音译，以保留原文所用的专有圣名。
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: 求告雅威的名
  rationale: 该短语在此敬拜语境中首先表达呼求、敬拜；同时其“宣告”之义保留在脚注中，不将原文的语义张力消除。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译为“雅威”可体现其专名性质；传统译法作为相关背景在脚注中说明。
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה 的含义
  choice: 求告雅威的名
  alternative: 宣告雅威的名
  rationale: 在筑坛敬拜的上下文中，“求告”是较直接的理解；不过该希伯来语表达也可含公开宣告之意，因此以脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“山区”体现伯特利附近的丘陵地貌；“支搭帐篷”“筑了一座坛”“求告……的名”保留原文动作链和敬拜语境。脚注标记置于相关短语之后，并保留原文中“求告／宣告”的真实歧义。
