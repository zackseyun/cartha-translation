  register: 采用现代、庄重而易懂的叙事汉语。“处理亚伯兰的事”避免生硬的“为他吩咐人”，同时不把命令具体化为护送或驱逐；“送走”保留原文可能兼有遣离与护送的语义张力。所有脚注标记均置于其所解释的正文成分之后。
