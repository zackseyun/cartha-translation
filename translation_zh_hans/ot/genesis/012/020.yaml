base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: zh_hans
  text: 于是，法老就吩咐人就亚伯兰的事作出安排[a][b]；他们便把他、他的妻子和他所有的一切[c]都送走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“法老就为他吩咐了人。”
    reason: 保留原文“吩咐……人，关于他”的简练结构；其具体命令内容没有说明。
  - marker: b
    text: 原文作“人”，可能指法老的臣仆或办事人员，但没有说明他们的具体身份。
    reason: 说明אֲנָשִׁים为未特指的复数，不加入数量限定。
  - marker: c
    text: 直译：“凡属于他的。”
    reason: 说明כָּל אֲשֶׁר לוֹ的字面结构，并保留其所指范围的宽泛性。
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה表示命令、下令；“吩咐”在现代汉语中自然庄重，并保留法老发令的权威意味。
- source_word: עָלָיו
  choice: 处理亚伯兰的事
  rationale: על与צוה连用，表示命令所涉及的对象。此处译成“处理亚伯兰的事”，自然表达法老针对亚伯兰所作的安排，又不具体断定命令内容。
- source_word: אֲנָשִׁים
  choice: 一些人
  rationale: 原文只称“人”，未明确说是臣仆、侍从或卫兵；译文保留这种非特指性。
- source_word: וַיְשַׁלְּחוּ
  choice: 送走
  rationale: שלח在此表示使其离开或打发离去；“送走”既可含护送，也可含遣离，保留语境中的一定含混。
- source_word: אֹתוֹ
  choice: 他
  rationale: 直接宾语代词，指亚伯兰。
- source_word: אִשְׁתּוֹ
  choice: 他的妻子
  rationale: 婚姻语境中אשה加所属后缀的通常含义。
- source_word: כָּל אֲשֶׁר לוֹ
  choice: 他所有的一切
  rationale: 直译为“凡属于他的”，概括亚伯兰所拥有的人与物；“他所有的一切”自然且不把范围缩限为财物。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 现代中文圣经及一般汉语对埃及君王称号的标准译法。
