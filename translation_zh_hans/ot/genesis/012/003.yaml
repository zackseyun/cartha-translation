  text: וַ/אֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔י/ךָ וּ/מְקַלֶּלְ/ךָ֖ אָאֹ֑ר וְ/נִבְרְכ֣וּ בְ/ךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָ/אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: zh_hans
  text: 我要赐福给祝福你的人；至于轻看你的人，我必咒诅他；地上所有的家族都必在你里面蒙福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你里面蒙福”也可译作“借着你蒙福”。这里的希伯来语形式也可能理解为：“地上所有的家族都要以你为福，彼此祝福”，或“以你为福而为自己求福”。
    reason: 保留וְנִבְרְכוּ可能的被动、反身／中动态含义，以及בְךָ可能的工具性理解；避免加入“榜样”等原文未明说的解释。
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: 我要赐福
  rationale: 忠实表达ברך第一人称单数未完成式在神圣应许中的将来与承诺语气；“赐福”自然且庄重。
- source_word: מְבָרְכֶיךָ
  choice: 那些为你祝福的人
  rationale: 保留分词复数的群体含义，并与后面的单数“那……的人”形成原文中的数的对比。
- source_word: וּמְקַלֶּלְךָ
  choice: 那轻看你的人
  rationale: קלל可指轻视、藐视、侮辱或咒骂；“轻看”保留它与下文较强的ארר“咒诅”之间的词义力度差别，同时保留单数。
- source_word: אָאֹר
  choice: 我要咒诅他
  rationale: ארר是明确而较强的咒诅用语；补出“他”使现代汉语自然，并清楚指回前面的单数对象。
- source_word: וְנִבְרְכוּ
  choice: 都要……得福
  rationale: 按尼法勒式的直接被动义翻译，同时在脚注保留反身或中动态的可能。
- source_word: בְךָ
  choice: 因你
  rationale: 介词ב在此可表达关联或媒介；“因你得福”是自然的现代汉语，也保留亚伯兰作为万族蒙福所由的含义。其他可能理解见脚注。
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: 地上的万族
  rationale: מִשְׁפָּחוֹת指家族或宗族群体；“万族”简洁自然，并传达כֹּל的普世范围。הָאֲדָמָה在此译为“地上”，符合全地各族的语境。
theological_decisions:
- issue: 亚伯拉罕应许中וְנִבְרְכוּ בְךָ的语态和介词含义
  choice: 地上的万族都要因你得福
  alternative: 地上的万族都要以你为得福的榜样而为自己求福；或：地上的万族都要借着你蒙福
  rationale: 正文采用尼法勒式最直接的被动理解，并以自然汉语表达בְךָ的媒介或缘由含义；脚注保留反身／中动态以及介词工具性理解，避免消除原文真实存在的释义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“轻看”与“咒诅”刻意形成力度差别，并保留前者单数、前文“那些……的人”复数的对照。分号呈现三个彼此关联的应许分句。
