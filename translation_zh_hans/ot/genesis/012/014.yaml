  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: zh_hans
  text: 亚伯兰进入埃及的时候，埃及人看见那女人[a]十分美丽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那妻子”。希伯来语 אִשָּׁה 既可指“女人”，也可指“妻子”；本句正文保留较宽泛的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: ……的时候
  rationale: 叙事结构 וַיְהִי 加 כְּ 与不定式构造表示随后发生之事的时间背景；现代汉语用“……的时候”自然表达，不必生硬译出“事情发生了”。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用现代中文圣经读者熟悉的专名译法，与此处人物尚未改名为亚伯拉罕的叙事阶段相符。
- source_word: מִצְרָיְמָה
  choice: 进入埃及
  rationale: 词尾方向标记表示朝向埃及的运动；汉语将方向意义自然融入“进入埃及”。
- source_word: וַיִּרְאוּ
  choice: 看见
  rationale: ראה 在此指直接看见；“看见”贴近原文，也避免用“注意到”等词增加解释色彩。
- source_word: הַמִּצְרִים
  choice: 埃及人
  rationale: 定冠词加复数族称，汉语通常自然译为“埃及人”。
- source_word: הָאִשָּׁה
  choice: 那女人
  rationale: אִשָּׁה 可指“女人”或“妻子”；本句采用较宽泛的“那女人”，保留原文措辞，并以“那”体现定指。
- source_word: כִּי
  choice: （看见）……
  rationale: 此处引出所感知的内容。现代汉语在“看见”之后无需另译连接词，直接接主谓短语更自然。
- source_word: יָפָה הִוא מְאֹד
  choice: 十分美丽
  rationale: יָפָה 表示美貌，מְאֹד 加强程度；汉语以“十分美丽”准确而庄重地表达。独立代词 הִוא 的主语功能已由“那女人”承担，无须重复译作“她”。
