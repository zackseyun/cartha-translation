base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: zh_hans
  text: 请你说：“你是我的姐妹”，好让我因你得好处，我的性命也因你得以保全。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “姐妹”原文指女性手足，并未说明是姐姐还是妹妹。原文较直译为“我的性命（或：我自己）也因你而存活”。这里的“性命”译自נֶפֶשׁ，指亚伯兰本人或他的生命。原文两次使用意思相近的“因你”，强调他预期自己会借着撒莱所声称的关系得到善待并保住性命。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: 请你说
  rationale: 阴性单数祈使式加语气词 נָא，表达带恳求意味的请求；“请你说”自然保留了这一语气。
- source_word: אֲחֹתִי אָתְּ
  choice: 你是我的姐妹
  rationale: 直译为“你是我的女性手足”。希伯来语本身不说明年长或年幼，因此用“姐妹”避免擅自限定为姐姐或妹妹。
- source_word: לְמַעַן
  choice: 好使
  rationale: 引出亚伯兰所期望的目的或结果；“好使”兼具目的意味和庄重自然的语体。
- source_word: יִיטַב לִי
  choice: 我……得好处
  rationale: 该习语基本义为“对我有好处／使我的境况变好”；这里不把它过度限定为某一种具体待遇。
- source_word: בַעֲבוּרֵךְ
  choice: 因你
  rationale: 表示原因或所凭借的缘由，即亚伯兰预期自己会因撒莱所声称的身份而获益。
- source_word: וְחָיְתָה נַפְשִׁי
  choice: 我的性命也……得以保全
  rationale: 字面为“我的 נפש 得以存活”。此处 נפש 指人的性命或自身，而非特指与身体相对的灵魂；“性命得以保全”准确表达上下文中的免死含义。
- source_word: בִּגְלָלֵךְ
  choice: 因你
  rationale: 这是与 בַעֲבוּרֵךְ 相近的第二个原因表达。重复“因你”保留原文反复强调撒莱将成为亚伯兰获益和存活之缘由的效果。
theological_decisions:
- issue: 亚伯兰请求撒莱自称是他的姐妹
  choice: 按原文直接保留这一请求，不在正文中评断其真伪或道德性质
  alternative: 将其解释为谎言、半真半假，或预先替亚伯兰辩护
  rationale: 本节本身只记述亚伯兰的请求与目的，并未在此明说其伦理评价；译文不应替叙事者消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“姐妹”略不如“妹妹”口语化，却能避免给原文没有表达的长幼关系作出限定；句中两次保留“因你”，以呈现希伯来文的强调和修辞重复。
