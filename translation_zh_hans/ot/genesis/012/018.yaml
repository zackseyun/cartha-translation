  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: zh_hans
  text: 于是，法老把亚伯兰叫来，说：“你为什么这样对我？为什么不告诉我她是你的妻子？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה לְאַבְרָם
  choice: 于是，法老把亚伯兰叫来
  rationale: קרא 加 לְ 指叫某人前来，也可译作“召来”。“把……叫来”既体现动作对象和前来之意，又符合现代汉语叙事习惯；וַ 用“于是”承接并推进情节。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר 是常见叙事动词。虽然后接问句，译作“说”比改译为“问”更贴近原文。
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: 你对我做的这是什么事
  rationale: 保留 מַה זֹּאת 的指示和质问语气，并以自然汉语表达 לִי 所体现的“对我”。
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: 为什么不告诉我
  rationale: נגד 的使役式在此意为告知、说明；“告诉我”简明自然，并保留 לִי。
- source_word: כִּי אִשְׁתְּךָ הִוא
  choice: 她是你的妻子
  rationale: כִּי 引出未告知的内容；名词句 אִשְׁתְּךָ הִוא 表明她的身份，现代汉语自然表达为“她是你的妻子”。
- source_word: פַרְעֹה
  choice: 法老
  rationale: 采用现代中文圣经与一般文化语境中通行的埃及王室称号译名。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用该人物在改名为亚伯拉罕之前的中文通行音译。
