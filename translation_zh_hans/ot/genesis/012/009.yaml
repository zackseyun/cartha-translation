lexical_decisions:
- source_word: וַיִּסַּע
  choice: 继续前行
  rationale: נסע在此为叙事性未完成式，指拔营后继续上路；“继续前行”自然表达行程向前推进，又不必明说拔营的动作。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: 继续前行
  rationale: 这一不定词绝对式组合以持续、渐进的方式修饰主句动词。中文将其与前面的נסע合并译为“继续前行”，避免生硬重复，同时保留不断行进的意味；不译作“分段前行”，以免加入原文未明确表达的行程阶段。
- source_word: הַנֶּגְבָּה
  choice: 往南地去
  rationale: נֶגֶב既可指“南方”，也可指名为南地（Negev）的南部地区；定冠词及表示方向的词尾使地域义在本处较为可能。“往南地去”保留方向性和可能的地名含义。
