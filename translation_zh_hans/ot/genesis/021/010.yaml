  rationale: 作两处轻微语言修订：“她儿子”改为“她的儿子”，并将“必不能”改为“不得”。其余措辞保留：命令的强制性、女奴身份的重复及继承权遭排除的内容均忠实于希伯来文，也与英文审校轨迹一致。脚注锚点继续紧随“赶走”，准确对应גרשׁ。
