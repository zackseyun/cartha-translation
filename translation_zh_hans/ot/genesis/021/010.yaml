base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this slave woman and her son, for the son of this slave woman will not inherit with my son Isaac.”
translation:
  language: zh_hans
  text: 于是她对亚伯拉罕说：“把这个女奴和她的儿子赶走[a]！因为这个女奴的儿子不得与我的儿子以撒一同继承产业。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逐出这个女奴和她的儿子！”
    reason: גָּרֵשׁ可译为“赶走”或“逐出”；后者更书面，也突出强制排除的意味。
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: 赶走
  rationale: 该命令式表示强行驱逐；“赶走”既保留动作的强制意味，也符合现代汉语表达。
- source_word: הָאָמָה
  choice: 女奴
  rationale: אָמָה指社会和法律地位低下、受奴役的女子；本节中特意重复这一身份称谓，因此不弱化为“使女”或“女仆”。
- source_word: בְּנָהּ
  choice: 她儿子
  rationale: 忠实表达第三人称阴性单数所有关系，汉语中无需增译。
- source_word: כִּי לֹא יִירַשׁ
  choice: 因为……必不能……继承产业
  rationale: כִּי引出撒拉提出要求的理由，ירשׁ在这里涉及共同继承产业或取得继承权；“必不能”保留原句明确断言的语气。
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: 这个女奴的儿子
  rationale: 保留重复的身份称谓和指示词，体现撒拉刻意疏远并带有轻蔑色彩的说法。
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: 和我的儿子以撒一同
  rationale: 希伯来文在“以撒”前重复介词，具有强调和同位说明作用；汉语将“以撒”紧接“我的儿子”，自然表达二者同指一人，同时不误导为两个对象。
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: 于是她对亚伯拉罕说
  rationale: 叙事连接词在上下文中表示事件推进；“于是”比逐字译作“并且”更符合现代汉语叙事。
theological_decisions:
- issue: 以撒与女奴之子是否共同继承
  choice: 保留为撒拉所作的明确断言：“必不能……一同继承产业”
  alternative: 译成规范性命令：“不可……一同继承产业”
  rationale: 原文形式是未完成体动词的否定陈述，并非直接使用禁止式；译文不把撒拉的话预先提升为神所颁布的禁令，也不削弱其坚决语气。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“女奴”明确呈现人物的受奴役身份；保留“这个女奴”的重复，以传达原话尖锐、疏离的语气。感叹号反映命令的强烈力度，但不额外加入情绪描写。
