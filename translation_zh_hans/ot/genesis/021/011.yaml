  text: וַ/יֵּ֧רַע הַ/דָּבָ֛ר מְאֹ֖ד בְּ/עֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/011.yaml
  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: zh_hans
  text: 亚伯拉罕因他儿子的缘故，觉得这事很不好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这事在亚伯拉罕眼中极其不好，是因他儿子的缘故。”
    reason: 保留בְּעֵינֵי的原文意象，并呈现מְאֹד的较直译表达。
lexical_decisions:
- source_word: וַיֵּרַע
  choice: 觉得……很不好
  rationale: רעע的Qal叙事形式与בְּעֵינֵי连用，表示某事在某人看来不好、令人不悦或难以接受。“觉得……很不好”既保留评价意味，也不把语义局限为愤怒或悲伤。
- source_word: הַדָּבָר
  choice: 这事
  rationale: דָּבָר在此指上一节撒拉所提出的要求。“这事”自然简洁，并按上下文明确其所指，而不额外解释内容。
- source_word: מְאֹד
  choice: 很
  rationale: מְאֹד是强意副词；与“很不好”搭配符合现代汉语习惯，表达强烈程度。
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: 亚伯拉罕……觉得
  rationale: 希伯来语直译为“在亚伯拉罕眼中”。正文以现代汉语的感知评价句式表达同一意义；脚注保留原文意象。
- source_word: עַל אֹדוֹת
  choice: 因……的缘故
  rationale: 该短语在这里说明亚伯拉罕如此看待此事的原因或关涉对象。“因……的缘故”保留因由意味，也避免加入原文未明说的具体心理。
- source_word: בְּנוֹ
  choice: 他的儿子
  rationale: בֵּן明确指“儿子”；保留原文的性别和亲属关系，不在正文中擅自以专名“以实玛利”替代。
theological_decisions:
- issue: 亚伯拉罕反应的性质
  choice: 觉得这事很不好
  alternative: 为这事十分难过／对这事十分不悦
  rationale: 原文的רעע与“在……眼中”构成评价性表达，可包含不悦、痛苦或认为不妥等色彩。正文不把它单一定性为悲伤或愤怒，以保存原文的语义张力。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“这事很不好”口语可懂但不轻佻；句序将原因前置，使中文流畅，同时脚注交代希伯来语较直译的结构。
