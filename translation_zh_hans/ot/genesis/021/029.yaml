  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: zh_hans
  text: 亚比米勒问亚伯拉罕：“你单独放在一边的[a]这七只母羊羔，是怎么回事？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你单独放置的”。这里的希伯来语动词可以指“安放”或“使站立”；上下文表明，这七只母羊羔被另行分出来。
    reason: 词义备选
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 问……说（在译文中自然表达为“问”）
  rationale: 该叙事动词直译为“说”，但后接疑问句；现代汉语用“问”可准确、自然地表达言语行为，同时不改变内容。
- source_word: מָה הֵנָּה
  choice: 是做什么用的
  rationale: 字面为“这些是什么”，此处是在询问这七只母羊羔的意义或用途。译为“是做什么用的”符合现代汉语，也保留对其用意的询问。
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: 这七只母羊羔
  rationale: כְּבָשֹׂת 是阴性复数，具体指母羊羔；译文保留其性别和幼羊含义。
- source_word: הִצַּבְתָּ
  choice: 你……放在一边
  rationale: 使役式动词可指使某物站立、安置或放置；结合语境，指亚伯拉罕将这些羊羔另行放置。
- source_word: לְבַדָּנָה
  choice: 单独
  rationale: 表示这些母羊羔与其余牲畜分开、独自成组；“单独”简明自然。
