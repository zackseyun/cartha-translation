  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: zh_hans
  text: 他住在巴兰旷野；他的母亲从埃及地为他娶了一位妻子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב可指居住、停留或定居。这里是叙事性概述，用“住在”自然准确，又不额外强调永久定居。
- source_word: בְּמִדְבַּר פָּארָן
  choice: 在巴兰旷野
  rationale: מִדְבָּר可指旷野或荒漠；“旷野”范围较广，也符合现代中文圣经叙事语体。פָּארָן按地名音译为“巴兰”。
- source_word: וַתִּקַּח לֹו אִמֹּו אִשָּׁה
  choice: 他母亲为他娶了一个妻子
  rationale: לקח本义宽泛，可指拿、取或带来；结合“为他”和אִשָּׁה，此处明确描述母亲替儿子安排婚配。现代中文以“为他娶了一个妻子”自然表达这一关系，并保留母亲主动办理婚事的含义。
- source_word: אִשָּׁה
  choice: 妻子
  rationale: אִשָּׁה既可指女人，也可指妻子；婚配语境表明这里指妻子。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 原文明确包含אֶרֶץ（地、国土），译作“埃及地”既保留完整表达，也符合庄重而自然的中文。
theological_decisions: []
