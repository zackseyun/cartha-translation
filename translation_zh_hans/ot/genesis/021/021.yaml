  register: 采用现代、清楚而庄重的叙事中文。“住在”避免“定居”可能带来的永久性暗示；“为他娶了一个妻子”按中文习惯表达母亲替儿子安排婚姻。原文在本节没有需要以脚注保留的实质性神学或文本歧义。
