  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: zh_hans
  text: 起来，扶起这孩子，用手紧紧扶住他[a]，因为我要使他成为一个大国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用手牢牢抓住他。”希伯来语表达强调有力地抓住并扶持他。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמִי
  choice: 起来
  rationale: 阴性单数命令式，直接对夏甲发出命令；“起来”自然、明确，也保留命令语气。
- source_word: שְׂאִי
  choice: 扶起
  rationale: נשׂא基本义为举起、抬起；结合孩子倒卧无力的语境，“扶起”既保留向上抬起的动作，也自然体现夏甲给予帮助，但不额外断定她要一直抱着或背着他。
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: נַעַר可指男孩或少年；此处承接上下文所指的以实玛利，用“这孩子”符合现代汉语叙事，也不武断限定更具体的年龄。
- source_word: וְהַחֲזִיקִי אֶת־יָדֵךְ בּוֹ
  choice: 用手紧紧扶住他
  rationale: 该表达字面涉及“使你的手在他身上有力”，强调有力地抓住、支撑；“紧紧扶住”兼顾牢固与扶持之意，并避免误解为只是牵他的手。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前述命令的理由，现代汉语用“因为”清楚自然。
- source_word: לְגוֹי גָּדוֹל אֲשִׂימֶנּוּ
  choice: 我要使他成为一个大国
  rationale: לְ与שׂים的组合表达结果；这里以男孩代表将由他而出的民族，“使他成为一个大国”保留原文直接而凝练的说法，不增添“后裔”等解释性词语。
theological_decisions:
- issue: 上帝关于以实玛利未来的应许
  choice: 直译为“我要使他成为一个大国”
  alternative: 我要使他的后裔成为一个大国
  rationale: 原文以阳性单数代词直接指向这孩子，并说要“使他成为大国”。正文保留这种以个人代表其后裔和民族的表达，不对这应许的性质作超出本节的神学界定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“扶起”与“紧紧扶住”形成连贯动作；保留“大国”这一圣经常用表达，并用脚注说明希伯来语中抓牢与扶持并存的语义。
