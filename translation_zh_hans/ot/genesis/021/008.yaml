base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/008.yaml
  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: zh_hans
  text: 孩子渐渐长大，断了奶。以撒断奶的那一天，亚伯拉罕摆设了盛大的宴席。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: 渐渐长大
  rationale: גדל在儿童成长的语境中指身体发育、逐渐长大；“渐渐长大”符合现代汉语叙事习惯。
- source_word: הַיֶּלֶד
  choice: 孩子
  rationale: יֶלֶד可指男孩或孩子；上下文已明确这是以撒，因此用自然且不重复强调性别的“孩子”。
- source_word: וַיִּגָּמַל
  choice: 断了奶
  rationale: גמל在此为被动意义，指停止哺乳；汉语通常说孩子“断了奶”，已自然包含这一过程落在孩子身上的意思。
- source_word: וַיַּעַשׂ
  choice: 摆设了
  rationale: עשה本义宽泛，为“做、置办”；与宴席搭配时，“摆设了”既自然，又保留亚伯拉罕筹办宴席的主动意义。
- source_word: מִשְׁתֶּה גָדוֹל
  choice: 盛大的宴席
  rationale: מִשְׁתֶּה指庆宴或筵席，גָדוֹל在此表示规模隆重；“盛大的宴席”准确、庄重且易懂。
- source_word: בְּיוֹם הִגָּמֵל אֶת יִצְחָק
  choice: 以撒断奶的那一天
  rationale: 按希伯来语的时间结构译出具体日期，并用汉语自然的主动形式表达原文所指的被动事件，不改变以撒是断奶者这一语义。
