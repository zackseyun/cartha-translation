  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: zh_hans
  text: 亚伯拉罕在非利士地寄居了许久。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּגָר
  choice: 寄居
  rationale: גור表示以外来者身份居住或暂居。“寄居”在现代中文圣经语境中自然、庄重，也保留了亚伯拉罕并非当地原住民的含义。
- source_word: בְּאֶרֶץ
  choice: 在……的地
  rationale: אֶרֶץ在此指一个族群所居的地域；译作“地”简洁，并与族名所有结构自然衔接。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族名在现代中文中的通行译法；“非利士人的地”对应希伯来文的地域表达。
- source_word: יָמִים רַבִּים
  choice: 许久
  rationale: 原文直译为“许多日子”，在此是表示较长时段的习语。“许久”符合现代中文叙事表达，同时保留时长未明确的特点。
- source_word: וַ
  choice: 承接叙事，不另译“于是”
  rationale: 前缀וַ承接叙事次序；中文可借语序自然衔接，若译作“于是”可能加入过强的因果或即时意味。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事文体。“寄居”准确呈现外来居民的语义；“许久”比“许多日子”更符合现代汉语习惯。
