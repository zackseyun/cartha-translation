  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: zh_hans
  text: 亚比米勒说：“我不知道是谁做了这件事。你也没有告诉我，而且我自己直到今天才听说这事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性 waw 推进情节；现代汉语通常无需机械译出“于是/并且”，直接用“说”自然清楚。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: לֹא יָדַעְתִּי
  choice: 我不知道
  rationale: qatal 表示亚比米勒此前并不知情；汉语“我不知道”在对话中自然涵盖这一过去至当下的认知状态。
- source_word: מִי עָשָׂה
  choice: 是谁做了
  rationale: 准确保留对行为人身份的询问，并以“了”标明事情已经发生。
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: 这件事
  rationale: דבר 在此指争议中的事件；“这件事”既自然，又保留“事情/事件”的语义宽度。
- source_word: וְגַם אַתָּה
  choice: 你也
  rationale: 保留 גַם 的附加和强调作用，指出对方同样未曾告知。
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: 没有告诉我
  rationale: הגיד 在此是告知、报告之意；“告诉我”符合现代口语对话，又不失庄重。
- source_word: וְגַם אָנֹכִי
  choice: 我自己也是
  rationale: “自己”体现 אָנֹכִי 较完整代词形式可能具有的强调，“也”对应 גַם；虽略显强调，但忠实保留原文结构。
- source_word: לֹא שָׁמַעְתִּי
  choice: 才听说
  rationale: שמע 在语境中指听到有关此事的消息；“听说”补足汉语所需的语用意义。
- source_word: בִּלְתִּי הַיּוֹם
  choice: 直到今天才
  rationale: 该结构表示在今天以前一直没有听闻；“直到今天才”是清楚自然的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准普通话。保留两处 גַם 的递进/附加强调以及 אָנֹכִי 的自我强调，不对亚比米勒是否完全诚实作解释性判断。
