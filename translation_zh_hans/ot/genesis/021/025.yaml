  text: Then Abraham reproved Abimelech about the well of water that Abimelech’s servants had seized.
translation:
  language: zh_hans
  text: 亚伯拉罕因亚比米勒的仆人抢占了那口水井，就责备亚比米勒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: 责备
  rationale: 使役式在此表示当面指责、提出责难；“责备”自然准确，并保留交涉中的严肃语气。
- source_word: עַל אֹדוֹת
  choice: 因
  rationale: 表示责备所针对的缘由；汉语用“因……责备”简洁自然。
- source_word: בְּאֵר הַמַּיִם
  choice: 那口水井
  rationale: “井”在汉语中已明确是取水设施，加“水”构成自然的“水井”；定冠词结合上下文译作“那口”。
- source_word: גָּזְלוּ
  choice: 抢去了
  rationale: 该词指强行夺取、侵占；“抢去”保留其暴力或不正当占有的力度，强于中性的“拿走”。
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: 亚比米勒的仆人
  rationale: 按字面保留隶属关系；此处可指其家臣或属下，但“仆人”最直接，也不额外限定身份。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希伯来语关系结构拆为“因……责备……，因为……”以避免中文中多重修饰造成歧义，同时清楚表明责备对象是亚比米勒，缘由是其仆人强占水井。
