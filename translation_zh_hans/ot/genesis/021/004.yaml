  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: zh_hans
  text: 亚伯拉罕在他儿子以撒八天大的时候，给他行了割礼，正如上帝所吩咐他的一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָל
  choice: 行了割礼
  rationale: 该动词专指割礼；“行割礼”是现代汉语中准确、自然且庄重的表达。
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: 给他儿子以撒
  rationale: 保留“他儿子”这一亲属说明，并以“给……行割礼”的汉语结构自然表达直接宾语关系。
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: 出生才八天
  rationale: 希伯来语直译为“八日之子”，是表示年龄的习语；“出生才八天”自然传达其年龄，并保留年幼意味。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达亚伯拉罕的行动与上帝命令完全相符。
- source_word: צִוָּה אֹתוֹ
  choice: 所吩咐他的
  rationale: “所……的”结构自然表明该命令先于此次行动，无须在汉语中另加显式过去完成时标记。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的上帝；“上帝”是现代标准汉语中清楚、庄重的对应词。
theological_decisions:
- issue: 上帝命令与亚伯拉罕行动的时间关系
  choice: 用“正如上帝所吩咐他的”表明命令在先
  alternative: 正如上帝吩咐他
  rationale: 希伯来语语境表明命令先于行动；汉语“所吩咐的”既自然地体现既有命令，也不添加额外神学解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“行了割礼”准确表达礼仪行为；分号使年龄说明清楚，同时保持单节经文的紧凑性。
