  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּפְקַ֤ח אֱלֹהִים֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא בְּאֵ֣ר מָ֑יִם וַ/תֵּ֜לֶךְ וַ/תְּמַלֵּ֤א אֶת הַ/חֵ֨מֶת֙ מַ֔יִם וַ/תַּ֖שְׁקְ אֶת הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: zh_hans
  text: 于是，神开了她的眼睛，她就看见一口水井。她走过去，把皮袋[a]装满了水，又给那孩子喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮袋”指用兽皮制成、可盛装和携带液体的容器，也可译作“水袋”。
    reason: 说明古代器物，并提供词义明确的译法。
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: 开了
  rationale: פקח常用于“睁开、开启”眼睛；保留希伯来语的具体表达，不额外说明她如何得以看见。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本处动词为单数，叙事明确指独一的神。
- source_word: עֵינֶיהָ
  choice: 她的眼睛
  rationale: 直译原文复数表达，在现代汉语中自然，也保留其具象说法。
- source_word: וַתֵּרֶא
  choice: 她就看见
  rationale: ראה在此表示“看见”；“就”自然呈现神开她眼睛之后的叙事结果。
- source_word: בְּאֵר מָיִם
  choice: 一口水井
  rationale: 该结构直指有水的井；汉语以量词“口”搭配“井”最自然，无须重复说“一口水的井”。
- source_word: וַתֵּלֶךְ
  choice: 她走过去
  rationale: 表达她前往所看见之井的连续动作；“过去”是符合语境的自然汉语。
- source_word: וַתְּמַלֵּא
  choice: 装满了
  rationale: 准确表达מלא“使充满”的动作，并与容器和水自然搭配。
- source_word: הַחֵמֶת
  choice: 皮袋
  rationale: חֵמֶת指用兽皮制成、用来盛装液体的容器；“皮袋”既简明又保留材质信息。
- source_word: מַיִם
  choice: 水
  rationale: 作为“装满”的内容，按现代汉语语序直接置于动词之后。
- source_word: וַתַּשְׁקְ
  choice: 给……喝
  rationale: שׁקה的使役式意为“给某人喝、使某人饮用”；此译简洁自然。
- source_word: הַנָּעַר
  choice: 那孩子
  rationale: נַעַר可指男孩或年轻人；“那孩子”承接上文，同时避免用现代汉语过度限定其精确年龄。
theological_decisions:
- issue: “神开了她的眼睛”是保留神直接行动的原文表述，还是解释为她注意到原已存在的井
  choice: 保留“神开了她的眼睛”
  alternative: 神使她注意到那口井／神使她能够看见
  rationale: 希伯来文明确以神为行动主体，并使用“开眼睛”的惯用表达。译文不解释井此前是否可见，也不说明神行动的机制，以保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”“她就”“又”清楚呈现连续动作；脚注标记置于其实际说明的“皮袋”之后。
