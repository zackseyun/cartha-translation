  text: וַ/יִּקְרָ֨א אַבְרָהָ֜ם אֶֽת שֶׁם בְּנ֧/וֹ הַ/נּֽוֹלַד ל֛/וֹ אֲשֶׁר יָלְדָה לּ֥/וֹ שָׂרָ֖ה יִצְחָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/003.yaml
  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: zh_hans
  text: 亚伯拉罕给他的儿子——就是那为他而生、撒拉为他生下的——取名叫以撒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שֵׁם
  choice: 取名叫
  rationale: קרא与שֵׁם连用表示“给……取名／称名”。“取名叫”既准确传达命名动作，也符合现代汉语习惯；若逐字译成“叫……的名字”，则不够自然。
- source_word: בְּנוֹ
  choice: 他的儿子
  rationale: 保留名词所带的第三人称单数阳性后缀，明确这是亚伯拉罕的儿子。
- source_word: הַנּוֹלַד לוֹ
  choice: 他的儿子
  rationale: 原文直译为“为他出生的”，再次表明这个儿子是生给亚伯拉罕的。现代汉语若与“他的儿子”及后面的“撒拉为他生下”全部逐项重复，会显得生硬，因此正文合并表达，并在脚注说明原文的重复结构。
- source_word: אֲשֶׁר יָלְדָה־לּוֹ שָׂרָה
  choice: 就是撒拉为他生下的那个儿子
  rationale: 明确保留撒拉是母亲，也保留关系与格לוֹ所表达的“为他”。“就是……那个儿子”自然承接前面的“他的儿子”，并反映关系从句的限定说明作用。
- source_word: יִצְחָק
  choice: 以撒
  rationale: 采用该希伯来人名在现代简体中文圣经传统中的通行译名。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“取名叫”比逐字对应的“叫……的名字”更通顺；插入说明“就是撒拉为他生下的那个儿子”保留了原文对儿子身份与母亲的强调。
