  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: zh_hans
  text: 现在，你要在这里指着上帝向我起誓，绝不欺骗我，也不欺骗我的儿女和后代。我曾以恩慈待你，你也要照样待我和这片你所寄居的土地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 源文明确含有时间兼话语推进表达，中文用“现在”自然承接上下文。
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים הֵנָּה
  choice: 请你在这里指着上帝向我起誓
  rationale: 保留“在这里”、以神为誓约见证者及“向我起誓”的关系；加“请”符合命令在此语境中的自然汉语表达。
- source_word: אִם תִּשְׁקֹר לִי
  choice: 绝不欺骗我
  rationale: 誓言中的 אִם 是省略咒诅后果的否定誓言格式，不宜机械译作条件句“如果”；“绝不”传达其郑重否定力。
- source_word: לְנִינִי וּלְנֶכְדִּי
  choice: 我的儿女和后代
  rationale: 两个亲属词构成由近及远的世代序列；采用普通读者易懂的表达，同时不作过度精细且有争议的谱系限定。
- source_word: כַּחֶסֶד
  choice: 怎样以恩慈
  rationale: חֶסֶד 在此指亚比米勒已经给予的善意、忠厚相待；“恩慈”兼顾善意与关系性的忠诚，避免加入特定神学术语。
- source_word: גַּרְתָּה בָּהּ
  choice: 你寄居的
  rationale: גּוּר 指作为外来者暂居，译作“寄居”准确保留其非本地定居者身份。
theological_decisions:
- issue: 指神起誓的表达
  choice: 指着上帝向我起誓
  alternative: 靠着上帝向我发誓
  rationale: “指着上帝起誓”是现代汉语中清楚而庄重的圣经语体，并未把经文扩展为对起誓行为的一般教义判断。
- issue: חֶסֶד 的关系含义
  choice: 恩慈
  alternative: 慈爱／厚待
  rationale: 说话者是人，语境强调此前善意相待及对应义务；“恩慈”可保留关系忠厚的色彩，又不把该词限定为专指上帝的圣约之爱。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这片土地”自然表达说话者所指的当地疆土；句式保留誓约要求中的郑重感，并避免生硬照搬希伯来语否定誓言格式。
