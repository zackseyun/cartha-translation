  to: 现在，你要在这里指着上帝向我起誓，绝不欺骗我，也不欺骗我的儿女和后代。我曾以恩慈待你，你也要照样待我和这片你所寄居的土地。
  rationale: 作低风险措辞修订：以“曾”呈现说话者已经施予的恩慈，以“照样”对应כַּ（“照着、按着”），并以“所寄居的”明确土地是受话者曾以外来者身分居住之处。其余措辞保留原译。
