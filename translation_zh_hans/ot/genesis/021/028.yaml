  text: And Abraham set seven ewe lambs of the flock by themselves[a].
translation:
  language: zh_hans
  text: 亚伯拉罕把羊群中的七只母羊羔单独放在一边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把羊群中的七只母羊羔分别出来。”希伯来语动词可表示把它们安置在一个有区别的位置；在立约作证的上下文中，这一动作具有特别意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: 放在
  rationale: 该动词是נצב的使役叙事形式，表示使某物立于或处于某个位置。“放在”自然地表达具体动作，又不在正文中过度解释其立约用途。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，中文以语序表达即可。
- source_word: שֶׁבַע
  choice: 七只
  rationale: 准确表达基数词，并使用适合羊的中文量词。
- source_word: כִּבְשֹׂת
  choice: 母羊羔
  rationale: 该词特指雌性的幼羊；“母羊羔”同时保留性别和幼龄含义。
- source_word: הַצֹּאן
  choice: 羊群中的
  rationale: צֹאן是指羊类小牲畜的集合名词；在此译作“羊群”自然，也避免把范围不必要地限定得更窄。
- source_word: לְבַדְּהֶן
  choice: 单独……在一边
  rationale: 表示这七只母羊羔与其余羊只分开；这一表达清楚、自然，并与前面的动作动词连贯。
theological_decisions:
- issue: 七只母羊羔被分开放置的立约意义
  choice: 正文只陈述将它们单独放在一边
  alternative: 正文译作“分别出来”，直接突出其作为立约凭据的用途
  rationale: 希伯来文明确表达位置上的分开，但其作为立约见证的意义主要由后文说明；正文不宜提前消除这种叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“单独放在一边”符合普通话习惯，并保留原文具体安置与语境中分别用途之间的含义空间。
