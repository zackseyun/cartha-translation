  text: וַ/יֹּ֕אמֶר כִּ֚י אֶת שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִ/יָּדִ֑/י בַּ/עֲבוּר֙ תִּֽהְיֶה לִּ֣/י לְ/עֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת הַ/בְּאֵ֥ר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: zh_hans
  text: 他说[a]：“你要从我手里收下这七只母羊羔，使这件事为我作证，证明这口井是我挖的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使它们为我作证。”希伯来语动词是单数，而眼前的所指是七只母羊羔；单数可能把这些羊羔视为一个整体，也可能指收下羊羔这件事或这一安排。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 以现代汉语自然承接叙事；上下文已明确说话者，无须机械译出连接词。
- source_word: כִּי אֶת שֶׁבַע כְּבָשֹׂת תִּקַּח מִיָּדִי
  choice: 你要从我手里收下这七只母羊羔
  rationale: 首个כִּי在此引出亚伯拉罕的说明或要求；תִּקַּח带有要求对方接受的语气。“从我手里收下”保留正式交付的具体意象，כְּבָשֹׂת明确为母羊羔。
- source_word: בַּעֲבוּר תִּהְיֶה לִּי לְעֵדָה
  choice: 使这件事为我作证
  rationale: בַּעֲבוּר表达目的。תִּהְיֶה是阴性单数，但紧邻的“七只母羊羔”为复数；译作“这件事”保留单数形式，并让所指涵盖收下羊羔这一整体安排，同时不把潜在所指锁死，另以脚注说明。
- source_word: כִּי חָפַרְתִּי אֶת הַבְּאֵר הַזֹּאת
  choice: 证明这口井是我挖的
  rationale: 第二个כִּי引出见证的内容。“是我挖的”以自然汉语表达亚伯拉罕对掘井事实的确认。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“母羊羔”保留性别信息；“从我手里收下”保留交易和正式交付的场景感。主文用“这件事”对应希伯来语单数谓语，并以脚注保留复数理解的可能。
