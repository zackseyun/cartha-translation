  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: zh_hans
  text: 撒拉看见埃及人夏甲给亚伯拉罕所生的儿子在发笑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在嘲笑”或“在嬉戏”。希伯来语这个分词可指发笑、嬉戏，也可指带有轻蔑意味的行为；这里的语境可能含有敌意。
    reason: 保留מְצַחֵק在“发笑／嬉戏／嘲笑”之间的词义与语境歧义。
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 撒拉看见
  rationale: 未完成式连续体推进叙事；汉语无须机械加译“于是”或“但”，用“看见”自然承接上下文。
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: 埃及人夏甲……所生的儿子
  rationale: 保留儿子借母亲身份被指称的结构，并以现代汉语自然表达הַמִּצְרִית所标明的埃及人身份。
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: 夏甲给亚伯拉罕所生的
  rationale: 关系从句回指夏甲先前为亚伯拉罕生子；“给亚伯拉罕所生的”准确而自然地表达לְ的关系。
- source_word: מְצַחֵק
  choice: 正在嬉笑
  rationale: צחק的Piel分词可指笑、嬉戏，也可能在语境中带嘲弄意味，但本节没有明说对象或行为性质；“正在嬉笑”保留持续动作及基本词义，并将负面解读列入脚注。
theological_decisions:
- issue: 以实玛利在מְצַחֵק一词中所做之事的性质
  choice: 正文采用较中性的“正在嬉笑”
  alternative: 正在嘲笑／正在戏弄
  rationale: 希伯来语分词本身没有明示受事，也未明确规定敌意。上下文及后来的经文诠释可支持负面理解，但不宜在正文中消除原文真实存在的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“嬉笑”比“玩耍”更贴近צחק的“笑”义，又不像“嘲笑”那样预先判定敌意；脚注标记紧随对应词语。
