  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your slave woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: zh_hans
  text: 但神对亚伯拉罕说：“不要因这孩子和你的女奴而难过。凡撒拉对你说的，你都要听从她的话[a]，因为从以撒而生的，才要称为你的后裔[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“听她的声音”，意思是听取并照她所说的去做。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“因为你的后裔要从以撒得名。”这里指亚伯拉罕的后裔谱系经由以撒而被认定。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: 但神……说
  rationale: 承接上文亚伯拉罕的苦恼，וַ 在此具有语篇上的转折意味；“但”自然呈现这一对照。
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: 不要……而难过
  rationale: 这是“在某人眼中为恶／不好”的希伯来语习语，在本语境中指感到痛苦、苦恼；译为“难过”既自然，也不把意思强化为道德判断。
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: נַעַר 可指男孩或少年；此处指以实玛利。“这孩子”符合现代汉语叙事，并由上文明确所指。
- source_word: אֲמָתֶךָ
  choice: 你的女奴
  rationale: אָמָה 表示处于奴役或从属身份的女性。“女奴”保留其社会身份，避免用“婢女”弱化原文所呈现的受辖制地位。
- source_word: שְׁמַע בְּקֹלָהּ
  choice: 听从她的话
  rationale: 字面为“听她的声音”，是听取、照办其所说之话的习语。“听从她的话”在现代汉语中自然，又没有把语气过度强化。
- source_word: בְיִצְחָק
  choice: 从以撒而出的
  rationale: 介词 בְּ 在此指后裔谱系借着或经由以撒得以确立。用“从以撒而出的”清楚表达谱系关系，同时避免生硬的“在以撒里”。
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: 才会称为你的后裔
  rationale: קרא 的被动式与 לְךָ 表示被称为、被认定为属于亚伯拉罕的后裔。“称为你的后裔”保留“称”的语言，也表达谱系身份的指定；“才”体现本句对以撒这一谱系的限定。
- source_word: זָרַע
  choice: 后裔
  rationale: זֶרַע 是集合名词；“后裔”在现代汉语中可作集合概念，既自然，也适合此处的谱系语境。
theological_decisions:
- issue: 夏甲的身份称谓
  choice: 你的女奴
  alternative: 你的婢女／你的使女
  rationale: 原文明确使用表示受辖制身份的 אָמָה。译文保留这一不平等的社会现实，不美化，也不加入对该制度的额外评价。
- issue: 应许中后裔谱系的含义
  choice: 因为从以撒而出的，才会称为你的后裔
  alternative: 因为你的后裔要从以撒得名／因为在以撒里，你的后裔将被称呼
  rationale: 本句把被认定为亚伯拉罕应许谱系的后裔与以撒联系起来，但并未否认以实玛利与亚伯拉罕的生物血缘。译文保留“称为”的指定语言，不将其扩展成更窄的教义释义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“难过”“这孩子”“听从她的话”便于普通读者理解；“女奴”准确保留原文的社会身份；应许句保留“称为”所含的指定意味及原文的神学张力。
