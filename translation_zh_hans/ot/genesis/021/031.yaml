  text: עַל כֵּ֗ן קָרָ֛א לַ/מָּק֥וֹם הַ/ה֖וּא בְּאֵ֣ר שָׁ֑בַע כִּ֛י שָׁ֥ם נִשְׁבְּע֖וּ שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/031.yaml
  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
translation:
  language: zh_hans
  text: 因此，他给那地方起名叫别是巴[a]，因为他们二人曾在那里起誓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别是巴”的希伯来语发音既使人联想到“七口井”，也使人联想到“誓言之井”；这里的解释尤其把这个名称与双方在那里所起的誓联系起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 这是因果承接表达，引出地名由来的结论；“因此”简洁、自然，并保留原文的逻辑关系。
- source_word: קָרָא לַמָּקוֹם הַהוּא
  choice: 他给那地方起名叫
  rationale: קרא 在此语境中表示命名；“给那地方起名叫”在现代汉语中明确自然，同时保留“那地方”的指示意味。
- source_word: בְּאֵר שָׁבַע
  choice: 别是巴
  rationale: 采用中文圣经传统中通行的地名音译。希伯来语名称与“七”和“誓言”均有语音及词源联系，主文不强行译义，交由脚注说明。
- source_word: כִּי
  choice: 因为
  rationale: 引出命名的原因，现代汉语用“因为”清楚直接。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达原文的地点副词，并与前文“那地方”自然照应。
- source_word: נִשְׁבְּעוּ
  choice: 起誓
  rationale: 该动词在此指郑重立誓；“起誓”简明庄重，也有助于呈现地名解释中的誓言关联。
- source_word: שְׁנֵיהֶם
  choice: 他们二人
  rationale: 明确保留原文对双方的强调，比单说“他们”更准确。
