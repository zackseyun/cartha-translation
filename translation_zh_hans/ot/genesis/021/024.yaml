  text: And Abraham said[a], “I swear it.”
translation:
  language: zh_hans
  text: 亚伯拉罕说[a]：“我必起誓。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要起誓”或“我起誓。”
    reason: 原文动词在此可理解为承诺将要起誓，或直接作出誓言。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式推动情节向前；现代汉语通常无需把连接词机械译作“并且”，直接用“说”自然地承接上文。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立人称代词使主语明确，并可带轻微强调；中文用“我”已能自然表达，无需加译“我本人”。
- source_word: אִשָּׁבֵעַ
  choice: 愿意起誓
  rationale: שבע 的尼法勒式意为“起誓、宣誓”；此处未完成式是在回应亚比米勒要求他起誓的话，具有意愿或承诺色彩。“愿意起誓”既符合语境，也避免把时态过度限定为单纯将来。
