  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: zh_hans
  text: 她说：“谁能想到会有人对亚伯拉罕说：‘撒拉会给孩子们[a]喂奶’呢？因为我竟在他年老时给他生了一个儿子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“儿子们”。此处复数用语带有概括性；下半句明确说撒拉所生的是“一个儿子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她说
  rationale: 以自然的汉语叙事承接上文；主语由语境明确为撒拉。
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: 谁能想到会有人对亚伯拉罕说
  rationale: 保留反问所表达的惊讶和事情出人意料的意味，同时不把未完成的情态含义压缩成单纯的过去叙述。
- source_word: הֵינִיקָה
  choice: 要乳养
  rationale: 使役词形表示给婴儿吃奶、哺乳；“乳养”简洁庄重，也适合与宾语“儿女”搭配。
- source_word: בָנִים
  choice: 儿女
  rationale: 原文形式上是阳性复数“儿子们”，但“乳养儿女”在此是概括性的表达；下一句再明确实际所生的是“一个儿子”。
- source_word: כִּי
  choice: 因为
  rationale: 按其解释前一句惊叹的功能处理，而不译成表示转折的连接词。
- source_word: יָלַדְתִּי בֵן
  choice: 我竟……给他生了一个儿子
  rationale: “生了一个儿子”准确表达完成的生产事件；“竟”自然传达上下文中的惊喜，但不改变命题内容。
- source_word: לִזְקֻנָיו
  choice: 在他年老时
  rationale: 自然表达亚伯拉罕已至老年的时间处境，并保留代词所指向的亚伯拉罕。
