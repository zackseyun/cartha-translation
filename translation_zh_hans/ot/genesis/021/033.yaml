base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: zh_hans
  text: 他在别是巴栽了一棵柽柳[a]，又在那里求告雅威的名[b]；雅威是永恒的上帝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柽柳”所对应的希伯来词也曾被译作“树”或“树丛”，但通常认为是柽柳。
    reason: lexical_alternative
  - marker: b
    text: “求告雅威的名”也可译作“宣告雅威的名”或“呼唤雅威的名”；这个希伯来表达在敬拜语境中可兼有呼求和宣告的意味。
    reason: lexical_ambiguity
  - marker: c
    text: “永恒的上帝”也可译作“永远的上帝”或“永恒之神”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: 栽了
  rationale: 希伯来语 נטע 的基本义是栽种植物；现代汉语叙述树木时，“栽”比“种植”更自然简洁。
- source_word: אֶשֶׁל
  choice: 柽柳
  rationale: 该词通常指柽柳，而非泛指树木；保留植物种类的具体性，同时以脚注说明辨识并非绝对确定。
- source_word: בִּבְאֵר שָׁבַע
  choice: 在别是巴
  rationale: 介词 בְּ 表示地点；“别是巴”采用现代中文圣经地名的通行译法。
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: 又在那里求告……的名
  rationale: 固定表达 קרא בשם 在敬拜语境中可指呼求、祈求，也可能包含宣告其名之意；正文采用自然且常见的“求告……的名”，脚注保留其他可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译为“雅威”，不以称号代替，保留原文对上帝名字的直接使用。
- source_word: אֵל עוֹלָם
  choice: 永恒的上帝
  rationale: אֵל 意为“上帝”，עוֹלָם 在此表明无尽、恒久；“永恒的上帝”在现代汉语中庄重自然，并保留称号性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此以“雅威”音译，既将其视为专名，也避免用“主”这一称号遮盖原文的名字。
- issue: 敬拜用语 קרא בשם יהוה 的含义
  choice: 求告雅威的名
  alternative: 宣告雅威的名；呼唤雅威的名
  rationale: 这一表达既可侧重向上帝呼求，也可包含公开宣扬其名的意味。正文选择适合本段敬拜语境的“求告”，但用脚注保留其语义张力。
- issue: אֵל עוֹלָם 与雅威的关系
  choice: 以同位称号“永恒的上帝”说明雅威
  alternative: 译作“永恒之神”或“永远的上帝”
  rationale: 原文在 יְהוָה 后直接接 אֵל עוֹלָם，最自然地理解为同位称号；破折号在中文中清楚保留这种紧密关系，而不增添“他是”等原文没有的判断句。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“栽了一棵柽柳”符合日常汉语搭配；以破折号标示“永恒的上帝”是对“雅威”的同位称号，并使整句仍可自然读作“求告雅威的名”。所有脚注标记均置于其所解释的词语之后。
