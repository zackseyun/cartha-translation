base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: zh_hans
  text: 她就走开，在孩子对面坐下，与他相距约一箭之远，因为她说：“不要让我看见孩子死去。”她仍坐在孩子对面，放声大哭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: 在孩子对面／在对面
  rationale: 该词表示处在某人对面或与其相隔一段距离。首次出现时，结合下文的距离说明，译作“在孩子对面”；第二次保留重复为“在对面”，既自然又反映原文结构。
- source_word: הַרְחֵק
  choice: 离他……远
  rationale: 此副词性形式强调距离；与“一箭之远”合译，符合现代汉语表达。
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: 约有一箭之远
  rationale: 保留弓箭射程这一距离意象；“约有”表达כִּ的近似含义，措辞简洁庄重。
- source_word: הַיָּלֶד
  choice: 孩子
  rationale: יֶלֶד可指儿童或少年；“孩子”在本段母子关系和情感语境中自然，也不对年龄作过度限定。
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: 我不忍看着孩子死去
  rationale: 原文是第一人称否定意愿，字面涉及“看见孩子之死”。“不忍看着孩子死去”在现代汉语中自然地传达她拒绝目睹死亡的悲痛，而不改变事件内容。
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ
  choice: 放声
  rationale: 这是表示提高声音哭喊的希伯来语惯用语；与后面的“哭”合为“放声大哭”，避免生硬直译，同时保留可听见的哀哭。
- source_word: וַתֵּבְךְּ
  choice: 大哭
  rationale: 该动词表示哭泣；与前面的“放声”合译为现代汉语惯用表达“放声大哭”。
- source_word: לָהּ
  choice: 不单独明译
  rationale: 此处与“坐下”连用，可有为自己、独自坐下的语用色彩，但核心空间关系已由מִנֶּגֶד明确表达；若另加“独自”，容易使句子累赘或削弱“在孩子对面”的关系。
theological_decisions: []
