  register: 采用现代、庄重而易懂的叙事语言。“一箭之远”保留原文具象意象；“放声大哭”自然呈现希伯来语连续表达。原文死亡表述在汉语中以“不忍看着孩子死去”呈现，保留母亲拒绝目睹孩子死亡的强烈情感。
