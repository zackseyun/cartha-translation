  to: 她就走开，在孩子对面坐下，与他相距约一箭之远，因为她说：“不要让我看见孩子死去。”她仍坐在孩子对面，放声大哭。
  rationale: 修订以“不要让我看见孩子死去”对应原文第一人称否定愿望，避免加入“不忍”的解释性心理判断；补足第二次“在孩子对面”，保留原文重复的空间关系；并调整距离短语，使现代汉语更流畅。未发现需要脚注说明的安全且必要的歧义。
