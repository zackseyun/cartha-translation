  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: zh_hans
  text: 他的儿子以撒出生时，亚伯拉罕一百岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: 亚伯拉罕
  rationale: וְ承接上文；本节在中文中采用时间从句结构，若另译“亚伯拉罕又……”会显得累赘，因此不单独译出连词，但叙事联系仍由句式保留。
- source_word: בֶּן מְאַת שָׁנָה
  choice: 一百岁
  rationale: “一百岁的儿子”是希伯来语表示年龄的惯用语，现代汉语自然译为“一百岁”。
- source_word: בְּ/הִוָּלֶד
  choice: 所生的时候
  rationale: 介词בְ加尼法勒不定词构形表示时间情境；“所生”保留被动意义，“……的时候”自然表达时间关系。
- source_word: ל֔/וֹ
  choice: 为亚伯拉罕
  rationale: 代词指亚伯拉罕，表示以撒是为他、归于他而出生；在中文中明确重述姓名，可避免“为他所生”指代含混。
- source_word: אֵת יִצְחָק
  choice: 以撒
  rationale: אֵת是宾语标记，不另行翻译；יִצְחָק按通行中文圣经人名译作“以撒”。
- source_word: בְּנֽ/וֹ
  choice: （由“为亚伯拉罕所生”体现父子关系）
  rationale: 原文“他的儿子”与“以撒”同位。中文的“以撒为亚伯拉罕所生”已经清楚表达以撒是其子；若再加“他的儿子以撒”，会使本句倒装结构略显重复。
