source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: zh_hans
  text: 亚伯拉罕清早起来，拿了饼和一皮袋水，交给夏甲，把这些放在她肩上，又把孩子交给她[a]，就打发她走了。她就走了，在别是巴的旷野徘徊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“把（这些）放在她肩上，又有孩子。”原句句法紧缩；“孩子”紧接在“放在她肩上”之后。也可按上下文理解为：“把这些放在她肩上，又把孩子交给她。”
    reason: 保留原文中“孩子”与“放在她肩上”的压缩句法及不同理解，同时避免正文暗示孩子被实际放在夏甲肩上。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: 清早起来
  rationale: 希伯来语惯用表达，既保留早起的时间重点，又符合现代汉语叙事习惯。
- source_word: לֶחֶם
  choice: 饼
  rationale: 该词本义为饼或面饼；此处不必泛化为“食物”。
- source_word: חֵמַת מַיִם
  choice: 一皮袋水
  rationale: חֵמֶת指用兽皮制成、盛装液体的容器；“一皮袋水”简洁自然，也避免现代“水瓶”的材质联想。
- source_word: וַיִּתֵּן אֶל הָגָר
  choice: 交给夏甲
  rationale: 承接前述饼和水，现代汉语可自然省略重复宾语；“交给”也适合后文托付孩子的语境。
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: 把这些放在她肩上
  rationale: 将“这些”理解为前述饼和皮袋水，使所指清楚，同时保留“放在肩上”的具体动作。
- source_word: וְאֶת הַיֶּלֶד
  choice: 又把孩子交给她
  rationale: 原文句法压缩，仅列出“和孩子”；汉语补出与语境相符的动作，以免误解为孩子也被放在肩上，同时用脚注保留原文形式及歧义。
- source_word: וַיְשַׁלְּחֶהָ
  choice: 就打发她走了
  rationale: 准确表达שלח在此处使其离开的含义；“打发……走”自然且带有叙事中的决绝意味，但不过度强化。
- source_word: וַתֵּלֶךְ וַתֵּתַע
  choice: 她离开后……迷了路
  rationale: וַתֵּלֶךְ为“她去了/走了”，וַתֵּתַע可指游荡、走迷或迷路；结合地点语境译作“迷了路”，表达自然，但不添加原因。
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: 在别是巴的旷野
  rationale: מִדְבָּר译作“旷野”，避免将其限定为沙漠；“别是巴”采用中文圣经传统且通行的地名译法。
theological_decisions:
- issue: “孩子”与“放在她肩上”的句法关系
  choice: 把饼和皮袋水放在夏甲肩上，并把孩子交给她，然后让她离开。
  alternative: 按压缩句法直译为“放在她肩上，还有孩子”，可能理解成孩子也被放在肩上；或译为“又将孩子交给她”。
  rationale: 原文在“放在她肩上”之后直接接“和孩子”，句法关系确有压缩和歧义。上下文中的以实玛利并非婴儿，若正文暗示亚伯拉罕将他放在夏甲肩上，容易造成误导。因此正文采用自然且符合语境的理解，脚注则明示原文措辞与另一种贴近句面的处理。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“清早起来”“一皮袋水”“旷野”等表达保留经文质感，但避免生硬古语。正文适度补足汉语所需的宾语和动作关系；对原文真实存在的句法歧义以脚注呈现。
