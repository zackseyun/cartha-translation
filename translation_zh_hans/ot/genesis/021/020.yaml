base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: zh_hans
  text: 上帝与那孩子同在；他长大，住在旷野，成了弓箭手。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“成了用弓射箭的人”。
    reason: 说明希伯来语短语的字面结构及译作“弓箭手”的依据。
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: 上帝与那孩子同在
  rationale: “היה את”是表示同在并含有扶持意味的惯用语；译作“与……同在”既自然，也不把经文进一步解释成单纯的“帮助”或“支持”。“那孩子”承接上下文所指的以实玛利。
- source_word: וַיִּגְדָּל
  choice: 他渐渐长大
  rationale: 此处描述孩子成长、成熟的过程；“渐渐长大”符合现代汉语表达，并保留动作发展的意味。
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: 住在旷野
  rationale: ישׁב在此表示居住；מִדְבָּר指人烟稀少的荒野地带，“旷野”比仅指干旱地貌的“沙漠”范围更贴近原词。
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: 成了弓箭手
  rationale: 该短语描写以弓射箭的人；“弓箭手”是清楚、自然的现代汉语对应，避免生硬直译。
theological_decisions:
- issue: 上帝与以实玛利同在的表述
  choice: 上帝与那孩子同在
  alternative: 上帝帮助那孩子／上帝支持那孩子
  rationale: 原文明确陈述上帝的同在，并可蕴含眷顾和扶持，但没有展开其神学含义；译文保留这一肯定而不作额外限定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“旷野”和“同在”保留经文语体但不显古奥；分号呈现上帝同在与孩子成长之间的紧密联系。
