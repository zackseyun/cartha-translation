  naturalness: “撒拉就怀孕了，在亚伯拉罕年老的时候给他生了一个儿子”自然通顺。“指定时间”略偏行政语体；“指定时候”较适合庄重而自然的叙事语体。调整末句后，整句的时间关系更清晰。
