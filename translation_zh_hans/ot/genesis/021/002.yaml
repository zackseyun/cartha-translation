base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: zh_hans
  text: 撒拉就怀孕了，在亚伯拉罕年老的时候给他生了一个儿子；那时正是上帝曾向他提到的指定时候[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到了上帝曾向他提到的指定时候。”
    reason: 原文的关系从句与“指定时候”相连；此译法明确上帝先前所说的是这个时候，而不具体限定他说话的内容。
lexical_decisions:
- source_word: וַתַּהַר
  choice: 就怀孕了
  rationale: הרה表示怀孕、受孕；“怀孕了”是现代汉语中自然、清楚的叙事表达，“就”承接上文应许实现的语境。
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: ילד在此指生产；“生了一个儿子”符合现代汉语习惯，并保留叙事次序。
- source_word: לְאַבְרָהָם בֵּן
  choice: 给他生了一个儿子
  rationale: 介词לְ标明亚伯拉罕是孩子的父亲；结合前文已出现的“亚伯拉罕”，用“给他”避免生硬重复。
- source_word: לִזְקֻנָיו
  choice: 在亚伯拉罕年老的时候
  rationale: 该短语表示亚伯拉罕处于老年这一时间和处境，并非目的；明确姓名可避免汉语代词指向撒拉的歧义。
- source_word: לַמּוֹעֵד
  choice: 在……指定时间
  rationale: מוֹעֵד在此指预先确定的时刻；“指定时间”保留其确定性以及与先前应许的联系。
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: 上帝曾对他说的
  rationale: דבר את可表示与某人说话，关系从句则联系前面的“指定时间”；此译法自然，并保留原文略为压缩的表达。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处是对以色列之上帝的普通称谓，译作现代汉语通行的“上帝”。
theological_decisions:
- issue: 如何表达上帝先前所说之话与指定时间的关系
  choice: 正是在上帝曾对他说的指定时间
  alternative: 到了上帝曾与他谈到的指定时间
  rationale: 正文突出孩子按上帝预先所说的时间出生，从而保留应许应验的意味；同时不增添“预言”“保证”等原文没有明说的神学解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“怀孕了……生了”保留原文的叙事推进；为消除汉语中“他”可能误指撒拉的问题，在“年老的时候”前重提亚伯拉罕。
