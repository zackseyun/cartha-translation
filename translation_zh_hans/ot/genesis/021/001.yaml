  text: וַֽ/יהוָ֛ה פָּקַ֥ד אֶת שָׂרָ֖ה כַּ/אֲשֶׁ֣ר אָמָ֑ר וַ/יַּ֧עַשׂ יְהוָ֛ה לְ/שָׂרָ֖ה כַּ/אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: zh_hans
  text: 雅威照着他所说的眷顾了撒拉[a]；雅威也照着他所讲的，为撒拉成全了他所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”也可译作“探访”。这里的希伯来语动词可指神把注意力转向某人，并为那人采取行动。
    reason: 说明 פקד 的词义范围，并表明本语境不是指一般的探望。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质。
- source_word: פָּקַד
  choice: 眷顾
  rationale: 此处指神转向撒拉、留意她，并采取使应许实现的行动；“眷顾”既自然，也能表达带来实际结果的恩慈关注，同时以脚注保留该词的语义幅度。
- source_word: כַּאֲשֶׁר אָמָר
  choice: 照着他所说的
  rationale: 指向此前神说过的话，表达本节事件与先前话语相符，而不在正文中额外加入原文未明说的“应许”。
- source_word: וַיַּעַשׂ יְהוָה לְשָׂרָה
  choice: 雅威也……为撒拉行了事
  rationale: 保留 עשה 的宽泛含义及 לְ 的受益关系，不提前把下一节所说明的具体结果完全写入本节。
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: 照着他所讲的
  rationale: 与前半句“所说的”形成平行，同时略作措辞区分，以反映 אָמַר 与 דִּבֵּר 的词汇变化。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用现代学界较常见、接近其推定读音的汉语音译“雅威”，不以称号替代专名。
- issue: 是否把神对撒拉所做的事明确译为使她怀孕
  choice: 保留“为撒拉行了事”的概括表达
  alternative: 为撒拉成就了应许／使撒拉怀孕
  rationale: 下一节才明确说明怀孕和生子；本节的 עשה 本身宽泛，因此不在本节消除叙事留下的概括性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两次保留“雅威”，以再现希伯来文的平行和强调；“为撒拉行了事”有意保持原文动词的概括性，虽略带希伯来式表达，但在上下文中清楚可懂。
