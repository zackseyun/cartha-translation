  text: וַ/יִּקַּ֤ח אַבְרָהָם֙ צֹ֣אן וּ/בָקָ֔ר וַ/יִּתֵּ֖ן לַ/אֲבִימֶ֑לֶךְ וַ/יִּכְרְת֥וּ שְׁנֵי/הֶ֖ם בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: zh_hans
  text: 于是，亚伯拉罕取了羊和牛，给了亚比米勒；二人就立约。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“切约”，这是希伯来语中表示正式立约的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 牵来
  rationale: 此处是叙事中的连续动作。结合宾语为牲畜，“牵来”比孤立的“拿”更符合现代汉语表达，同时不增添来源或方式。
- source_word: צֹאן
  choice: 羊群
  rationale: 该词泛指小型牲畜，尤其绵羊和山羊；与后面的בָּקָר相对时，“羊群”是自然、清楚的概括，并避免武断限定为某一种羊。
- source_word: וּבָקָר
  choice: 牛群
  rationale: 该词指大型群畜，尤指牛；“牛群”与“羊群”对应自然，也保留集合意义。
- source_word: וַיִּתֵּן
  choice: 送给
  rationale: נתן基本义为“给”。在以牲畜作为盟约交往之物的语境中，“送给”是自然的现代汉语，且未额外说明其法律性质。
- source_word: לַאֲבִימֶלֶךְ
  choice: 给亚比米勒
  rationale: 介词ל表示接受者；人名按中文圣经通行形式译作“亚比米勒”。
- source_word: וַיִּכְרְתוּ
  choice: 立了
  rationale: כרת ברית直译为“切约”，是希伯来语订立盟约的固定表达。现代汉语以“立约”准确而自然地传达其惯用意义。
- source_word: שְׁנֵיהֶם
  choice: 二人
  rationale: 明确保留希伯来文所说的双方，简洁符合汉语叙事节奏。
- source_word: בְּרִית
  choice: 约
  rationale: בְּרִית是关键圣经用语；“约”在“立约”这一固定搭配中既自然，又保留盟约含义，不将其缩窄为一般协议或条约。
theological_decisions:
- issue: 盟约惯用语כרת ברית的译法
  choice: 立了约
  alternative: 切了约
  rationale: 原文按字面是“切约”，但这是订立盟约的标准希伯来语惯用语。正文采用自然且具有圣经语体的“立约”，脚注保留字面表达，使盟约背景透明可查，同时不对盟约的性质作超出本节的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“羊群和牛群”保留两类牲畜的集合意义；分号使赠送牲畜与双方立约两个连续动作层次清楚。脚注标记置于所解释的“立了约”之后。
