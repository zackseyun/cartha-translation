base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: zh_hans
  text: 上帝听见了那孩子的声音[a]，上帝的使者从天上呼唤夏甲，对她说：“夏甲，你怎么了？不要害怕，因为上帝已经听见那孩子在他所在之处发出的声音。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“哭声”；希伯来语“קוֹל”在这里可以指困苦中发出的哭喊。本节下半句同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: 上帝听见了
  rationale: שׁמע在此通常表示“听见”；不译作“应允”，以免加入原文未明说的回应含义。
- source_word: אֶת קוֹל הַנַּעַר / אֶל קוֹל הַנַּעַר
  choice: 那孩子的声音
  rationale: קוֹל本义为“声音”，语境中也可指困苦中的哭声；正文保留两处重复及较宽泛的词义。
- source_word: הַנַּעַר
  choice: 那孩子
  rationale: נַעַר在此指以实玛利；“孩子”符合现代汉语，也不对他的确切年龄作过度限定。
- source_word: מַלְאַךְ אֱלֹהִים
  choice: 上帝的使者
  rationale: 按希伯来语属格结构直译，保留其作为上帝使者的身份，而不进一步界定其本体。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: שׁמים虽为形态复数，在这一方位表达中用现代汉语惯常译法“天上”。
- source_word: מַה לָּךְ
  choice: 你怎么了
  rationale: 这是询问对方发生何事或为何忧苦的惯用语；此译自然、直接，又避免带有责难意味。
- source_word: אַל תִּירְאִי
  choice: 不要害怕
  rationale: 准确表达否定命令，且比“不要惧怕”更贴近日常现代汉语。
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: 因为上帝已经听见
  rationale: כִּי说明安慰的理由；完成式在此表达已发生并具有当前结果的行动。
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: 那孩子在那里
  rationale: 保留短语的地点意味；置于“声音”之前，使中文自然，同时不把它解释为抽象的“处境”。
theological_decisions:
- issue: מַלְאַךְ אֱלֹהִים所指使者与上帝之间的关系
  choice: 上帝的使者
  alternative: 上帝的一位天使
  rationale: “上帝的使者”直接保留原文表达，不把不定性或特定的基督论身份强加给经文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你怎么了”传达关切而非责备；两次保留“那孩子的声音”，以呈现希伯来原文的关键词重复。
