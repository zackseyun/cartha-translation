  yaml_path: translation/ot/genesis/021/015.yaml
  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: zh_hans
  text: 皮袋里的水用尽了，她就把孩子抛在一棵灌木下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抛”或译“扔”。原文所用动词的力度强于单纯的“放下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ הַמַּיִם
  choice: 水用尽了
  rationale: כלה在此表示耗尽、告罄；“水用尽了”既贴近原文，也符合现代汉语表达。
- source_word: מִן הַחֵמֶת
  choice: 皮袋里的
  rationale: חֵמֶת指用兽皮制成、可盛水的袋；结合מן所表达的来源关系，汉语自然译为“皮袋里的水”。
- source_word: וַתַּשְׁלֵךְ
  choice: 撇
  rationale: שלך通常有投、扔、抛下之意，力度强于单纯的“放”；此处“撇在”保留动作的突然与困境中的无奈，又避免让现代读者误解为把孩子猛烈投掷出去。
- source_word: אֶת הַיֶּלֶד
  choice: 孩子
  rationale: יֶלֶד可指男孩或孩子；上下文已明确其身份，译作“孩子”自然，并保留词义范围。
- source_word: תַּחַת אַחַד הַשִּׂיחִם
  choice: 在一丛灌木下面
  rationale: 该短语直译为“在灌木中的一棵/一丛下面”；“一丛灌木下面”符合汉语对荒野矮木的自然表述。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“皮袋”在上下文中可自然理解为盛水的兽皮袋；不另加注，以免脚注过密。主句保留原文动作的力度，同时用“撇在”避免不必要的暴力联想。
