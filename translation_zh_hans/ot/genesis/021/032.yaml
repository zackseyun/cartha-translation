  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: zh_hans
  text: 他们在别是巴立了约[a]。于是亚比米勒和他军队的统帅非各就起身，返回非利士人之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“割约”，这是表示立约的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: 他们……立了约
  rationale: 希伯来语直译为“割约”，是表示订立盟约的惯用语。现代汉语以“立约”自然、简洁，也保留了盟约用语的庄重色彩。
- source_word: בִּבְאֵר שָׁבַע
  choice: 在别是巴
  rationale: 介词 ב 在此表示事件发生的地点，译作“在”；地名采用现代中文圣经中通行的音译“别是巴”。
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום 表示起来、起身；此处引出人物离开当地的行动，“起身”符合现代汉语叙事习惯。
- source_word: שַׂר צְבָאוֹ
  choice: 他的军队统帅
  rationale: שַׂר 指首领或统帅，צְבָאוֹ 指“他的军队”；“军队统帅”清楚表达其军事职务，并保留所属关系。
- source_word: וַיָּשֻׁבוּ
  choice: 回……去了
  rationale: שׁוב 在此指返回原处；“回……去了”是自然的现代汉语叙事表达，也与复数主语相符。
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: 回非利士人之地
  rationale: 按原文保留“非利士人之地”的族群—地域表达；“之地”使措辞凝练庄重，而不改写为较解释性的“非利士境内”。
- source_word: וּפִיכֹל
  choice: 和……非各
  rationale: 连词 וּ 表示并列；中文直接用“和”连接亚比米勒与非各，并由后续行动表明二人一同离开。
