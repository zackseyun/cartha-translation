  text: וַ/תֹּ֣אמֶר שָׂרָ֔ה צְחֹ֕ק עָ֥שָׂה לִ֖/י אֱלֹהִ֑ים כָּל הַ/שֹּׁמֵ֖עַ יִֽצְחַק לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: zh_hans
  text: 撒拉说：“神使我有了欢笑；凡听见这事的，都要和我一同欢笑。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要笑我”，或“都要为我欢笑”。希伯来语在这里可有几种含义；按上下文，最可能是众人与撒拉一同喜乐。
    reason: 保留 יִצְחַק לִי 的词义和语境歧义。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 未单独译出叙事连接词 וַ；现代汉语连续叙事中直接用“说”更自然，语序仍体现叙事推进。
- source_word: שָׂרָה
  choice: 撒拉
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: צְחֹק
  choice: 欢笑
  rationale: 保留名词所表达的“笑”，并以“欢”体现本节喜庆语境；同时与后半句“欢笑”形成原文同根词的呼应。
- source_word: עָשָׂה לִי
  choice: 使我有了
  rationale: 原文直译为“为我造了”，汉语较生硬；“使我有了欢笑”自然表达神为撒拉成就此事的含义，同时不过度扩展为具体情绪描写。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处指为撒拉施行此事的独一神，译作单数意义的“神”。
- source_word: כָּל הַשֹּׁמֵעַ
  choice: 凡听见这事的
  rationale: 原文形式为单数而含周遍、分配意义；“凡……的”符合现代汉语。“这事”补足汉语中“听见”的自然宾语，所指由上下文限定。
- source_word: יִצְחַק
  choice: 要……欢笑
  rationale: 保留“笑”的基本词义及其与 צְחֹק、以撒之名之间的文字呼应；“要”表达未完成式在此处的预期或将来意义。
- source_word: לִי
  choice: 和我一同
  rationale: 介词短语字面可有“向我、为我”等含义；结合以撒出生的喜乐语境，正文采用共同分享欢笑的理解，并在脚注保留其他可能。
theological_decisions:
- issue: 末句 יִצְחַק לִי 的含义
  choice: 共同喜乐：“和我一同欢笑”
  alternative: “笑我”或“为我欢笑”
  rationale: 以撒出生和前句“神使我有了欢笑”的语境较支持众人与撒拉共享喜乐，但希伯来语 לִי 本身并不排除嘲笑或为她而笑的理解，因此正文采用较可能的读法，脚注保留真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“欢笑”在前后两句重复，刻意保留希伯来文的同根词呼应；脚注标记紧随存在歧义的末句。
