  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the slave woman into a nation[a], because he is your offspring.
translation:
  language: zh_hans
  text: 那女奴的儿子[a]，我也要使他成为一国，因为他是你的后裔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女奴”也可译作“婢女”或“女仆”。
    reason: 词义备选：אָמָה可按语体译作“女奴”“婢女”或“女仆”，但“女奴”最明确地体现其受奴役的身份。
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: וְ与גַם共同表达承接和添加之意；汉语把“也”放在谓语前，既自然又保留其强调作用。
- source_word: אֶת בֶּן הָאָמָה
  choice: 那女奴的儿子
  rationale: בֶּן意为“儿子”，אָמָה指处于从属身份的女性奴仆。“女奴”明确呈现其受奴役的社会身份；定冠词译为“那”，也符合上下文所指。
- source_word: לְגוֹי
  choice: 成为一国
  rationale: 介词לְ与שׂים连用表示结果，即使他发展、构成为一个国族；“成为一国”是自然且准确的现代汉语。
- source_word: אֲשִׂימֶנּוּ
  choice: 我……要使他成为
  rationale: שׂים在此不是单指放置，而是使某对象成为某种状态；后缀־נּוּ指“他”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出上帝作出这一应许的原因，译作“因为”清楚保留因果关系。
- source_word: זַרְעֲךָ
  choice: 你的后裔
  rationale: זֶרַע可指种子、子孙或后裔；这里指亚伯拉罕所生的人。“后裔”在现代汉语中自然，并保留亲属与血脉含义。
- source_word: הוּא
  choice: 他是
  rationale: 原文使用明确的第三人称代词，略带强调；汉语译出“他是”即可，无须额外加入“他本人”而过度强化。
theological_decisions:
- issue: אָמָה所表达的社会身份
  choice: 女奴
  alternative: 婢女／女仆
  rationale: 该词指身份低下、受人支配的女性奴仆，而夏甲的从属身份在叙事中具有实际意义。“女奴”避免不必要地淡化这一社会现实，同时脚注列出较传统或较缓和的译法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“使他成为一国”保留原文关于结果的表达；“后裔”避免古雅的“种”，也不把所指扩大为复数“子孙”。
