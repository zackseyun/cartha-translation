base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: zh_hans
  text: 那时，亚比米勒和他的军队统帅非各对亚伯拉罕说：“你无论做什么，神[a]都与你同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神”或可译作“一位神”，但按上下文，这里的希伯来语最自然是指赐福亚伯拉罕的神。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: 那时
  rationale: 这是希伯来叙事中转换场景并标明时间的常用表达；现代汉语用“那时”即可自然、准确地传达其功能。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וּפִיכֹל
  choice: 和……非各
  rationale: וּ־连接并列人物；פִיכֹל按现代中文圣经传统音译为“非各”。
- source_word: שַׂר צְבָאוֹ
  choice: 他的军队统帅
  rationale: שַׂר在军事语境中指首领或统帅，צְבָאוֹ指“他的军队”；“军队统帅”清楚且符合现代汉语。
- source_word: וַיֹּאמֶר ... אֶל־אַבְרָהָם לֵאמֹר
  choice: 对亚伯拉罕说
  rationale: 希伯来语用单数叙事动词接后置复合主语，并以לֵאמֹר引出直接引语。汉语自然地按并列主语理解，并省去重复的“说”。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 该词形态上为复数形式，但在本语境中最自然地指那位赐福并与亚伯拉罕同在的神。
- source_word: עִמְּךָ
  choice: 与你同在
  rationale: 准确表达陪伴、临在及支持的含义，也是自然庄重的现代汉语。
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: 你无论做什么
  rationale: 综合范围词“凡、一切”与关系从句的意义；“无论做什么”自然表达全面范围，且不改变原意。
theological_decisions:
- issue: 亚比米勒话中אֱלֹהִים的所指
  choice: 神
  alternative: 一位神；诸神
  rationale: 尽管אֱלֹהִים在某些语境可作复数或泛指神明，但本段叙事聚焦于亚伯拉罕所得的神圣眷顾，因此“神”最符合上下文；脚注保留较不可能的另一理解。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“那时”简洁承接叙事；“军队统帅”避免古雅的“军长”；直接引语保持清晰有力。脚注标记[a]置于“非各”之后，但脚注内容说明本节“神”的较不可能替代读法。
