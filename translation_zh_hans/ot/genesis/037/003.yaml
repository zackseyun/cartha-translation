  to: 以色列爱约瑟，胜过爱他所有其他的儿子，因为约瑟是他老年所得的儿子；他又为约瑟做了一件华美的长袍[a]。
  rationale: 修订避免把“老年的儿子”这一习语过度限定为出生时点，并使连接语与脚注中文更自然准确；其余措辞保留原稿对原文、英文审校轨迹及词义不确定性的审慎处理。
