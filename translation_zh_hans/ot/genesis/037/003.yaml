  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: zh_hans
  text: 以色列爱约瑟，胜过爱他所有其他的儿子，因为约瑟是他老年所得的儿子；他又为约瑟做了一件华美的长袍[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“一件彩衣”。希伯来语“כְּתֹנֶת פַּסִּים”的确切含义不明，也可能指衣袖长至手腕、下摆长至脚踝的长袍，不一定特指衣服的颜色。
    reason: 说明原文词组的词义不确定，并保留传统译法及另一种主要解释。
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: 以色列
  rationale: 保留希伯来文本在此使用的人名“以色列”，不替换为“雅各”；句首连接词 וְ 在中文叙事中不必机械译出。
- source_word: אָהַב
  choice: 爱
  rationale: 原词是普通的“爱”，虽然上下文显示偏爱，正文仍保留其直接词义。
- source_word: מִכָּל בָּנָיו
  choice: 胜过爱其他所有的儿子
  rationale: מִן 在这里表达比较；补出第二个“爱”使中文关系清楚，“其他”避免把约瑟排除于“他的儿子”这一集合之外。
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: 约瑟是他年老时所生的
  rationale: 自然表达“他在年老时所得的儿子”这一希伯来习语，并明确主语，避免中文代词含混。
- source_word: וְעָשָׂה לוֹ
  choice: 他还为约瑟做了
  rationale: 保留“为他”的受益关系；用“还”自然承接前句，不把连接词过度解释为因果。
- source_word: כְּתֹנֶת פַּסִּים
  choice: 一件华美的长袍
  rationale: כְּתֹנֶת 指袍服或长衣；פַּסִּים 的确切含义不明。“华美”提供可读的正文表达，同时以脚注保留“彩衣”及衣长及腕踝的可能解释。
theological_decisions: []
