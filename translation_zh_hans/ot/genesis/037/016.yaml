  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: zh_hans
  text: 他说：“我在找我的哥哥们。请告诉我，他们在哪里放牧[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在哪里牧羊？”“放牧”在这里指照管牲畜吃草。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 叙事中的 wayyiqtol 形式，现代汉语通常不必机械译出连接词“于是/然后”；“他说”自然承接上文。
- source_word: אֶת אַחַי
  choice: 我的哥哥们
  rationale: אֶת 是定指直接宾语标记；אַחַי 指“我的兄弟”。按上下文，说话者是约瑟，所指均为他的哥哥，因此译为“哥哥们”更符合汉语亲属称谓。
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: 我在找
  rationale: 独立人称代词加分词表达正在进行的行动；“我在找”是自然、准确的现代汉语。
- source_word: הַגִּידָה נָּא לִי
  choice: 请告诉我
  rationale: נגד 的使役命令式与 נָא 构成礼貌请求；“请告诉我”兼顾命令语气和礼貌色彩。
- source_word: אֵיפֹה הֵם רֹעִים
  choice: 他们在哪里放牧
  rationale: אֵיפֹה 询问地点，הֵם 是显明的主语；רֹעִים 为 רעה 的主动分词，在此牧羊语境中指照管牲畜吃草。“放牧”无需补出原文未明说的宾语。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事用语。“哥哥们”按创世记37章的上下文具体表达约瑟与这些男性手足的长幼关系；正文保留简洁的口语请求。脚注标记置于整句之后，说明“放牧”的词义范围。
