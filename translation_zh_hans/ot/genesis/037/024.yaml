  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: zh_hans
  text: 他们把约瑟带走，扔进坑里[a]。那坑是空的，里面没有水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”也可译作“蓄水池”。希伯来语בּוֹר可指用来储水的坑或蓄水池；下文说明其中没有水，与此相符。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: 他们抓住约瑟
  rationale: לקח基本义为“拿、取”，在此处涉及对人的强制行动，译作“抓住”符合语境；补出“约瑟”使现代汉语指代清楚，并未增加新信息。
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: 把他扔进
  rationale: השליך意为“扔、抛”；“扔进”自然、明确地表现动作及方向，又不采用“猛摔”等过度强化的措辞。
- source_word: הַבֹּרָה
  choice: 坑里
  rationale: בּוֹר可指坑、蓄水池或井状深坑。“坑”保留原词的广义，不因下文提到水而过度限定；更具体的“蓄水池”收入脚注。
- source_word: וְהַבּוֹר רֵק
  choice: 那坑是空的
  rationale: 此分句补充交代坑内状况。汉语无需机械翻出连接词；“那坑”衔接前文自然，רֵק直译为“空的”。
- source_word: אֵין בּוֹ מָיִם
  choice: 里面没有水
  rationale: 准确保留希伯来文对“水”的明确说明，并以自然现代汉语表达存在否定。
