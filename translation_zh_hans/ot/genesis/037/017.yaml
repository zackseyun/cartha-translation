  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: zh_hans
  text: 那人说：“他们已经离开这里了，因为我听见他们说[a]：‘我们到多坍去吧[b]。’”于是，约瑟便动身去找他的哥哥们，在多坍找到了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我听见他们在说”。
    reason: lexical_alternative
  - marker: b
    text: “多坍”原文带有表示方向的词尾，直译为“朝多坍”。
    reason: cultural_note
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: 已经离开这里了
  rationale: נסע在此表示离开现地、继续前行；译为“已经离开这里了”自然清楚，又不额外断定具体的拔营动作。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出那人判断他们已经离开的依据，按因果关系译为“因为”。
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: 我听见他们说
  rationale: 分词אֹמְרִים可表达正在说，也可自然地引出所听到的话；上下文清楚表明隐含的说话者是约瑟的哥哥们。
- source_word: נֵלְכָה
  choice: 我们……去吧
  rationale: 保留第一人称复数祈愿式所表达的共同提议语气。
- source_word: דֹּתָיְנָה
  choice: 到多坍去
  rationale: 地名后的方向词尾表示朝多坍而去；现代汉语用“到……去”自然表达这一方向意义。
- source_word: אַחַר אֶחָיו
  choice: 沿着哥哥们的去向追去
  rationale: אַחַר表示跟在他们之后；此译在汉语中避免“追随”可能带出的效忠含义，也不把动作强化为敌意追赶。
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: 在多坍找到了他们
  rationale: 忠实表达מצא“找到”和ב地点用法，并保持希伯来叙事的顺接。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“哥哥们”符合约瑟与众兄长的关系；句式保留原文从那人的说明到约瑟行动的叙事推进。脚注按正文出现顺序重新编排，以确保标记与所注释内容准确对应。
