  yaml_path: translation/ot/genesis/037/030.yaml
  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: zh_hans
  text: 他回到弟兄们那里，说[a]：“那孩子不见了！我——我能到哪里去呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那孩子不见了……我能到哪里去呢？”更直译可作：“那孩子不在那里；至于我，我往哪里来呢？”这里的希伯来语惯用表达可理解为“我能到哪里去呢？”或“我该怎么办呢？”
    reason: 说明原文字面形式及其可能表达的去向或困境之意，同时保留其语义张力。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 他回到
  rationale: שׁוב 的 wayyiqtol 形式表示返回；“回到”自然地承接叙事，并与后面的目的地相配。
- source_word: אֶל אֶחָיו
  choice: 弟兄们那里
  rationale: אֶל 表示方向，אֶחָיו 指“他的兄弟们”；结合“回到”，译作“弟兄们那里”符合现代汉语表达。
- source_word: הַיֶּלֶד
  choice: 那孩子
  rationale: יֶלֶד 可指男孩或孩子；此处双方都知道所指是约瑟，“那孩子”自然、庄重，也保留原文对其年少身份的强调。
- source_word: אֵינֶנּוּ
  choice: 不见了
  rationale: 该形式字面表示“他不在那里／没有他”，在此表达约瑟失踪。“不见了”准确传达缺席，却不擅自断定他已经死亡。
- source_word: וַאֲנִי
  choice: 我——我
  rationale: 连词加独立代词形成突出的自我转折；用破折号和代词复现，可保留流便惊慌、语句顿挫的效果。
- source_word: אָנָה אֲנִי בָא
  choice: 我能到哪里去呢
  rationale: 字面近于“我往哪里来”，但在该语境中是询问去向或出路的惯用表达。“能到哪里去”既自然，也保留问题本身，未进一步释义成“我该怎么办”。
