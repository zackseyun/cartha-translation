base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: zh_hans
  text: 后来，他又做了一个梦，就讲给他的哥哥们听，说：“看哪，我又做了一个梦：太阳、月亮和十一颗星都向我下拜[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俯伏在我面前”。希伯来语动词可表示深深俯伏；这里指臣服、致敬，并非对神的敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: 后来，他又做了一个梦
  rationale: 叙事性连续式推动情节；“后来”自然表达承接，“又……一个梦”体现 עוֹד 与 אַחֵר 所强调的重复。
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: 就讲给他的哥哥们听
  rationale: סִפֵּר 表示讲述、诉说；依上下文，这些兄弟是约瑟的哥哥，因此译作“哥哥们”比泛称“兄弟们”更准确。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意的语用作用；“看哪”庄重而仍为现代读者所理解。
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: 我又做了一个梦
  rationale: 汉语惯用“做梦”，并以“又”保留原文重复之意；不机械复制希伯来语同源宾语结构。
- source_word: וְהִנֵּה
  choice: ：
  rationale: 第二个 הִנֵּה 引出梦中景象；汉语用冒号自然呈现其引介功能，避免连续重复“看哪”造成生硬。
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: 太阳、月亮和十一颗星
  rationale: 直接、自然地对应三类天体及数目。
- source_word: מִשְׁתַּחֲוִים לִי
  choice: 都向我下拜
  rationale: 该分词描绘梦中持续呈现的俯伏致敬；“下拜”表达臣服和敬礼，又不误导为专指对神的敬拜。“都”自然统摄所列各天体。
theological_decisions:
- issue: מִשְׁתַּחֲוִים 在约瑟梦中的含义
  choice: 向我下拜
  alternative: 敬拜我；俯伏在我面前
  rationale: 上下文指家族成员对约瑟的臣服与尊崇，并在后文以俯伏致敬应验，而非宗教礼拜。“下拜”保留动作和社会性敬意，不加入原文没有明说的神学判断。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。“后来……就……”呈现事件推进；直接引语中的“看哪”保留原文的强调语气。脚注标记已置于相关词语之后。
