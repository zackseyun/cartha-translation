  yaml_path: translation/ot/genesis/037/019.yaml
  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: zh_hans
  text: 他们彼此说：“看，那个做梦的[a]来了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“这位梦的主人”。这里是哥哥们对约瑟带讥讽意味的称呼，指他是个“做梦的人”。
    reason: 说明“梦的主人”这一希伯来语表达的字面含义及其在上下文中的讥讽语气。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们……说
  rationale: 该叙事性动词承接前文，引出下一动作；汉语不必机械译出连接词，按自然叙事语序表达。
- source_word: אִישׁ אֶל־אָחִיו
  choice: 彼此
  rationale: 字面为“各人对他的兄弟”，在这里是相互用语；“彼此”简洁准确，也符合多人交谈的语境。
- source_word: הִנֵּה
  choice: 看
  rationale: 这是引人注意的指示语；“看”是现代汉语中自然有力的对应表达。
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: 做梦大王
  rationale: בַּעַל在此可指以某事物为显著特征的人。结合哥哥们嘲讽约瑟之梦的语境，“做梦大王”既保留“主人/大王”的意象，也自然传达讥讽口吻。
- source_word: הַלָּזֶה
  choice: 那个
  rationale: 该指示词指向正在走近的约瑟，并带有疏离、轻蔑的语气；汉语“那个”比“这个”更自然地体现这种语感。
- source_word: בָּא
  choice: 来了
  rationale: בוא的分词表示约瑟正在走近；汉语“来了”在现场话语中自然表达正在临近，并带有说话者刚注意到他的意味。
