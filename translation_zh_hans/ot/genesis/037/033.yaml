  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: zh_hans
  text: 他认出那件衣服，就说：“这是我儿子的袍子！一定是猛兽把他吃了。约瑟确实被撕碎了！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确实被撕碎了”：希伯来文以同根词重复加强语气，直译为“被撕，确实被撕了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: 他认出那件衣服
  rationale: נכר 的使役词干在此表示“认出、辨认出”；阴性单数宾语后缀指前文的袍子。汉语明说“那件衣服”比单说“它”更自然清楚。
- source_word: כְּתֹנֶת בְּנִי
  choice: 我儿子的袍子
  rationale: כְּתֹנֶת 指贴身或长身衣袍；“袍子”既保留古代服饰意味，也符合现代汉语叙事表达。
- source_word: חַיָּה רָעָה
  choice: 猛兽
  rationale: חַיָּה 在语境中指野生动物，רָעָה 表示凶恶、有害；“猛兽”自然凝练地传达具有攻击性的野兽，而不赋予动物道德意义。
- source_word: אֲכָלָתְהוּ
  choice: 把他吃了
  rationale: 动词 אָכַל 基本义为“吃”；在猛兽袭击的语境中，“把他吃了”自然有吞食、吞噬之意，同时避免不必要地强化原文。
- source_word: טָרֹף טֹרַף
  choice: 准是被撕碎了
  rationale: 不定式绝对式与同根被动限定动词连用，表达强烈确定或强调。“准是”传达强调，“被撕碎了”保留被动和猛兽撕裂猎物的图景。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代简体中文圣经及一般中文语境中通行、易懂的希伯来人名译法。
