base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: zh_hans
  text: 于是，他们把那件长袖袍[a]送去，带给他们的父亲，说：“这是我们找到的。请认一认[b]，这是不是你儿子的袍子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“华美的袍子”“装饰华丽的长衣”；传统译作“彩衣”。希伯来语这一说法的确切含义不能确定。
    reason: lexical_alternative
  - marker: b
    text: “认一认”也可译作“辨认一下”。“认出、辨认”这一措辞在后续叙事中反复出现，具有重要意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: 他们……送去
  rationale: 使役加强式在此自然表示“送去”；“于是”承接希伯来叙事中的连续结构。
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: 长袖袍
  rationale: כְּתֹנֶת 指袍服或长衣；פַּסִּים 含义不确定，可能指衣服长及手掌、脚掌，因而可能是长袖或长身袍服。“长袖袍”采用较可能的理解，同时以脚注保留不确定性。
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: 带到父亲那里
  rationale: 忠实保留“他们的父亲”这一关系称谓，不在正文中补入“雅各”；宾语由上文的袍子自然承接。
- source_word: זֹאת מָצָאנוּ
  choice: 这是我们找到的
  rationale: 保留兄弟们简短而具有欺骗性的陈述，也符合现代汉语表达。
- source_word: הַכֶּר נָא
  choice: 请认一认
  rationale: נכר 的使役式表示辨认、认出；“认一认”自然、简洁，并保留“认出”这一词义及其在后续叙事中的呼应。
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: 这是不是你儿子的袍子
  rationale: 准确表达“是否……不是”的间接辨认要求；“你儿子”保留兄弟们刻意疏离约瑟的说法。
