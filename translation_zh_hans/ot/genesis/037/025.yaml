  text: וַ/יֵּשְׁבוּ֮ לֶֽ/אֱכָל לֶחֶם֒ וַ/יִּשְׂא֤וּ עֵֽינֵי/הֶם֙ וַ/יִּרְא֔וּ וְ/הִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִ/גִּלְעָ֑ד וּ/גְמַלֵּי/הֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּ/צְרִ֣י וָ/לֹ֔ט הוֹלְכִ֖ים לְ/הוֹרִ֥יד מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: zh_hans
  text: 他们坐下来吃饭，抬眼观看，只见一支由以实玛利人组成的商队正从基列而来；他们的骆驼驮着树胶、香膏和岩蔷薇脂[a]，要把这些货物运到埃及去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “岩蔷薇脂”指一种芳香树脂。原文所列三种古代商品的具体植物来源和现代对应物并非全无争议；此处的词通常被认为指岩蔷薇脂一类树脂。
    reason: 说明לֹט的通常辨识及三种商品名称的词义不确定性，避免将其与“没药”混同。
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: 吃饭
  rationale: 字面为“吃饼”，但在希伯来语中可泛指进食；“吃饭”自然准确，也符合现代汉语习惯。
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: 一队以实玛利人的商队
  rationale: אֹרְחָה 指结队旅行的队伍，此处由上下文可知是运输货物的商队；保留其族群身份。
- source_word: נְכֹאת
  choice: 树胶
  rationale: 该词所指的具体芳香物质并不确定；“树胶”能反映一种作为商品运输的芳香树脂类物质，避免过度具体化。
- source_word: צְרִי
  choice: 香膏
  rationale: 通常指用于药用或芳香用途的膏状树脂，“香膏”兼顾传统表达与现代可理解性。
- source_word: לֹט
  choice: 没药
  rationale: 沿用经文传统及审校层所采用的“myrrh”，但原词也可能指岩蔷薇脂等芳香树脂，因此加注说明词义不确定。
- source_word: לְהוֹרִיד מִצְרָיְמָה
  choice: 运往埃及
  rationale: 字面含“带下到埃及”；汉语以“运往”自然表达货物由商队带去埃及的动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬眼一看，只见”自然传达原文连续的“举目、看、看哪”，不刻意保留生硬重复。
