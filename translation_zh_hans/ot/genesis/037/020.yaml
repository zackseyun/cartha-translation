    rationale: בְּאַחַד הַבֹּרוֹת 意为“在那些坑中的一个里”。“其中一个坑里”在不改变自然度的前提下更完整。
  revised_text: “现在，来吧，我们杀掉他，把他扔进其中一个坑里[a]，再说：‘一只猛兽[b]把他吃了。’然后我们就要看看，他的梦会怎样！”
