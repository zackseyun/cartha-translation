  text: וְ/עַתָּ֣ה לְכ֣וּ וְ/נַֽהַרְגֵ֗/הוּ וְ/נַשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הַ/בֹּר֔וֹת וְ/אָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ וְ/נִרְאֶ֕ה מַה יִּהְי֖וּ חֲלֹמֹתָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: zh_hans
  text: “现在，来吧，我们杀掉他，把他扔进其中一个坑里[a]，再说：‘一只猛兽[b]把他吃了。’然后我们就要看看，他的梦会怎样！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”或译“蓄水池”。希伯来语 בּוֹר 可指坑、蓄水池或井状的储水处，须按语境判断。
    reason: lexical_alternative
  - marker: b
    text: “猛兽”也可译作“凶恶的野兽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 兼顾承接上文和推动眼前行动的语用功能；汉语中“现在”已能自然表达紧迫感。
- source_word: לְכוּ
  choice: 来吧
  rationale: 此处是复数祈使式，用作共同采取行动的劝促语，并非字面叫人离开。
- source_word: וְנַהַרְגֵהוּ
  choice: 我们杀了他
  rationale: 保留第一人称复数鼓动共同实施行动的意愿色彩；“杀了他”符合现代汉语直接引语。
- source_word: וְנַשְׁלִכֵהוּ
  choice: 把他扔进
  rationale: 准确表达“投、掷”的动作，并以自然的现代汉语处置式呈现。
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: 一个坑里
  rationale: בּוֹר 可指坑或蓄水池；本处正文采用较宽泛且符合叙事语境的“坑”，脚注保留另一可能。
- source_word: וְאָמַרְנוּ
  choice: 然后就说
  rationale: 呈现谋划中随后将采取的说辞；“就”传达其预定、顺势的语气。
- source_word: חַיָּה רָעָה
  choice: 猛兽
  rationale: 该短语指危险、凶恶的野生动物；“猛兽”简洁、自然，并同时体现野性与威胁性。
- source_word: אֲכָלָתְהוּ
  choice: 把他吃了
  rationale: 按动词基本义译为“吃”，不强化为“吞噬”；在伪造的报告中语气自然。
- source_word: וְנִרְאֶה
  choice: 到时我们倒要看看
  rationale: 保留第一人称复数形式可含直陈或意愿语气的张力，并以“倒要”传达上下文中的讥讽挑战。
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: 他的梦会怎么样
  rationale: 自然表达这些梦将有何结果，不擅自说明梦是否会应验，从而保留原句的讥讽与开放性。
theological_decisions:
- issue: 约瑟之梦的结果是否被明确否定
  choice: 译作“他的梦会怎么样”
  alternative: “他的梦还能不能实现”
  rationale: 原文只问这些梦将会如何，并未直接说梦不能实现；所选译法保留叙事中的神学张力和兄弟们的讥讽。
translation_notes:
  register: 采用现代、庄重而口语自然的直接引语。“来吧”“倒要看看”呈现兄弟们合谋时的催促和讥讽；避免文言化的“击杀、投于、吞噬”，也不弱化其暴力意图。
