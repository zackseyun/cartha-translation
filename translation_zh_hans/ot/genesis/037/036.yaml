base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: zh_hans
  text: 这时，米但人[a]把他卖到埃及，卖给法老的官员[b]、护卫长[c]波提乏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“米但人”；结合上下文和一些古代译本，传统上也有理解为“米甸人”的。
    reason: alternative_reading
  - marker: b
    text: 也可译作“法老的宦官”或“法老的宫廷官员”。这个希伯来词既可指宦官，也可指王室官员。
    reason: lexical_alternative
  - marker: c
    text: 字面意思是“宰杀者之长”，在王室语境中可能指护卫队长或侍卫长，并可能兼管行刑。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: 这时，米但人
  rationale: וְ按叙事转换译为“这时”；马所拉文本的族名为מְדָנִים，直译“米但人”，不在正文中改作“米甸人”，并以脚注说明上下文与古译本所支持的另一理解。
- source_word: מָכְרוּ אֹתוֹ אֶל־מִצְרָיִם
  choice: 把他卖到埃及
  rationale: מָכְרוּ为叙事中的完成式，译作过去事件“卖”；אֶל保留方向意义，故译“到埃及”。
- source_word: לְפוֹטִיפַר
  choice: 卖给……波提乏
  rationale: לְ标明买主；为使现代汉语清楚自然，重复“卖给”，并按通行形式音译人名。
- source_word: סְרִיס פַּרְעֹה
  choice: 法老的官员
  rationale: סָרִיס既可指宦官，也可泛指王室官员；正文采用不武断限定生理身份的“官员”，脚注保留词义张力。
- source_word: שַׂר הַטַּבָּחִים
  choice: 护卫长
  rationale: 字面为“宰杀者／行刑者之长”；在王室语境中指负责护卫或行刑的高级官员，“护卫长”简洁且符合上下文。
theological_decisions: []
