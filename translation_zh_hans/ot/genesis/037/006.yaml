base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/006.yaml
  text: And he said to them[a], “Please listen to this dream that I dreamed.”
translation:
  language: zh_hans
  text: 他对他们说：“请听听我做的这个梦[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这里重复使用同根的名词和动词，直译为“我梦见的这个梦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他……说
  rationale: 叙事性的连续式推动情节；现代汉语无需机械译出连接词，省去“于是/又”可保持自然流畅而不额外解释其逻辑关系。
- source_word: אֲלֵיהֶם
  choice: 对他们
  rationale: 直接表达介词及第三人称复数后缀，表明约瑟是在对众弟兄讲话。
- source_word: שִׁמְעוּ נָא
  choice: 请听听
  rationale: 复数命令式 שִׁמְעוּ 要求听者留心，语气词 נָא 使请求较为和缓；“请听听”在现代汉语中自然地兼顾劝请与命令语气。
- source_word: הַחֲלוֹם הַזֶּה
  choice: 这个梦
  rationale: 自然对应带定冠词的名词及指示词，指约瑟接下来要讲的特定梦境。
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: 我做的
  rationale: “做梦”是现代汉语表达“梦见、经历梦境”的常用说法；置于“这个梦”之前，清楚保留关系从句的修饰作用。希伯来文名词与动词的同根重复另以脚注说明。
