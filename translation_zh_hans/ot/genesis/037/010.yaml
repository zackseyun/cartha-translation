base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: zh_hans
  text: 他把这梦告诉了父亲和弟兄们。父亲就责备他，对他说：“你做的这是什么梦？难道我、你母亲和你弟兄们真要来，在你面前俯伏在地吗[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向你俯伏”。这里的希伯来语动词可指深深躬身或俯伏，以表示臣服，不一定指宗教性的敬拜。
    reason: 说明该动词在此非礼仪语境中的词义范围，避免将臣服性的俯伏误解为宗教敬拜。
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 他把这梦告诉了
  rationale: ספר的加强词干在这里表示“讲述、告诉”；宾语由上下文补出为“这梦”，符合现代汉语表达。
- source_word: וַיִּגְעַר בּוֹ
  choice: 责备他
  rationale: גער表示有力度的口头斥责；“责备”自然、庄重，也没有“训斥”可能带来的额外强烈色彩。
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: 你做的这是什么梦？
  rationale: 保留原文反问语气及“梦—做梦”的词根呼应，同时采用自然的现代汉语句式。
- source_word: הֲבוֹא נָבוֹא
  choice: 难道……真要来
  rationale: “难道”体现疑问所含的惊讶和否定倾向，“真要”传达不定式绝对形与限定动词连用所加强的语气。
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: 我、你母亲和你哥哥们
  rationale: 按原文次序列出三方；本叙事中的אחים指约瑟的男性手足，用“哥哥们”符合上下文。
- source_word: לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה
  choice: 向你俯伏于地
  rationale: השתחוה在此表示臣服性的躬身或俯伏，并非必然指敬拜；אָרְצָה表明动作朝向地面。“俯伏于地”兼顾动作力度与庄重语体。
theological_decisions:
- issue: 非礼仪语境中השתחוה的含义
  choice: 向你俯伏于地
  alternative: 敬拜你；向你下拜
  rationale: 此处是家人因约瑟之梦而谈及的服从性礼节动作。译作“敬拜”会不必要地引入宗教崇拜含义；“俯伏于地”既保留身体动作，也不消除其臣服意味。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“你做的这是什么梦”保留父亲责问的语气；“俯伏于地”略带书面色彩，但清楚易懂，并贴合原文动作描写。
