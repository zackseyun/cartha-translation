base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: zh_hans
  text: 流便回到那坑；看哪，约瑟不在坑里，他就撕裂了自己的衣服[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”也可译作“蓄水池”（希伯来文：בּוֹר，bor）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: 该词源自שׁוב，在此表示吕便返回先前所在的地点。“回到”符合现代汉语叙事习惯，也保留了返回的方向含义。
- source_word: הַבּוֹר / בַּבּוֹר
  choice: 坑边 / 坑里
  rationale: בּוֹר可指坑或蓄水池；本段所指是约瑟被扔进去的地方。“坑”简明自然，“坑边”则贴合汉语中“回到某处查看”的表达；“蓄水池”作为可成立的词义另列脚注。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה是引人注意的叙事标记，突显吕便突然发现约瑟不在坑里的震惊。“看哪”保留了原文的突发感和叙事力度。
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: 约瑟不在坑里
  rationale: אֵין在这里表达不存在或缺席。“约瑟不在坑里”是自然、准确的汉语，没有加入“已经逃走”或“被带走”等原文未明说的信息。
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: 吕便就撕裂了自己的衣服
  rationale: 撕裂衣服是表达悲痛、震惊或极度忧愁的惯常举动。汉语补出主语“吕便”，避免连续分句中代词指向含混；“自己的衣服”清楚保留了בְּגָדָיו的所属关系。
