  text: וַ/יְקַנְאוּ ב֖/וֹ אֶחָ֑י/ו וְ/אָבִ֖י/ו שָׁמַ֥ר אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: zh_hans
  text: 他的哥哥们都嫉妒他；他父亲却把这事记在心里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他父亲却把这话存记着。”原文既可指约瑟所说的话，也可指整件事；意思是他一直记着并加以思量。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ בּוֹ
  choice: 嫉妒他
  rationale: קנא 与介词 ב 连用，在本语境中表示因约瑟的地位和梦而对他产生嫉妒；“嫉妒他”是自然、准确的现代汉语表达。
- source_word: אֶחָיו
  choice: 他的哥哥们
  rationale: 原文为阳性复数，叙事中指约瑟的兄长们；结合上下文译作“哥哥们”比泛称“兄弟们”更明确。
- source_word: וְאָבִיו
  choice: 他父亲却
  rationale: וְ 字面为“和/而”，这里前后两种反应构成对照，汉语用“却”自然呈现这一语篇关系。
- source_word: שָׁמַר
  choice: 记在心里
  rationale: שׁמר 基本义为“守住、保存”，此处指留心保存并继续思量；“记在心里”符合现代汉语习惯，同时保留持续关注的意味。
- source_word: אֶת־הַדָּבָר
  choice: 这事
  rationale: דבר 可指“话、事情、事项”；此处涵盖约瑟所讲之梦及其意义，“这事”自然且保持原词的语义宽度。
theological_decisions:
- issue: 父亲对约瑟之梦的态度
  choice: 仅表达他把这事记在心里
  alternative: 解释为父亲相信、赞同或认定梦必会实现
  rationale: 原文只说明雅各保存并留意这事，没有明确断定他已经相信或认可梦的含义，因此不作神学上的进一步推断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“嫉妒他”直陈兄长们的反应；分号和“却”突出兄长与父亲态度的对照。“记在心里”通俗易懂，并传达 שׁמר 在此处保存、留意的含义。
