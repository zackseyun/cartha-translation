  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: zh_hans
  text: 约瑟来到他哥哥们那里时，他们就剥下约瑟的长衣，就是他身上那件特别的长衣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “特别的长衣”也可译作“长袖长衣”或“华美的长衣”。希伯来语 כְּתֹנֶת הַפַּסִּים 的确切含义不能确定；传统译法“彩衣”也有可能，但可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……时
  rationale: 这是推进叙事的时间结构；现代汉语用“……时”自然表达，不生硬直译“事情发生了”。
- source_word: בָּא
  choice: 来到
  rationale: 准确表达约瑟走到哥哥们所在之处。
- source_word: אֶל אֶחָיו
  choice: 来到哥哥们那里
  rationale: 上下文所指的是约瑟的男性年长手足；中文按亲属关系自然译作“哥哥们”。
- source_word: וַיַּפְשִׁיטוּ
  choice: 剥下
  rationale: 该动词表示从某人身上脱去衣物；“剥下”体现动作是强行施加于约瑟的。
- source_word: כֻּתָּנְתּוֹ
  choice: 他的长衣
  rationale: כֻּתֹּנֶת 指贴身或袍式衣服；“长衣”比笼统的“衣服”更具体，也比音译服装名称更易懂。
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: 那件特别的长衣
  rationale: פַּסִּים 的确切含义不明，可能涉及衣服的长度、袖子或华美装饰；正文用“特别的”保留其与众不同的意义，同时避免把有争议的细节定死。
- source_word: אֲשֶׁר עָלָיו
  choice: 他身上那件
  rationale: 自然表达该衣服当时正穿在约瑟身上，并保留原文的限定作用。
