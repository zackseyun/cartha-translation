  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: zh_hans
  text: 有一个人发现了他；只见他正在田野里徘徊。那人问他说：“你在找什么？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: 遇见他
  rationale: מצא在此可指“找到、遇见”。汉语叙事中“遇见他”自然地表达那人发现约瑟在田野里的情景，又不暗示那人先前特意寻找他。
- source_word: אִישׁ
  choice: 有一个人／那人
  rationale: אִישׁ在此指一名男子。首次出现译作“有一个人”，再次提及时译作“那人”，符合现代汉语的指称习惯。
- source_word: וְהִנֵּה
  choice: 看见
  rationale: הִנֵּה具有引导注意、呈现眼前情景的作用。译作“看见”把这一叙事功能自然融入句中，比直译“看哪”更符合现代汉语叙事。
- source_word: תֹעֶה
  choice: 正在……迷路
  rationale: תעה表示走迷、徘徊或迷失方向。上下文中约瑟不知道该往哪里去；“迷路”简洁自然，同时保留其行动失去方向的含义。
- source_word: בַּשָּׂדֶה
  choice: 在田野里
  rationale: שָׂדֶה可指田地或野外；“田野”既贴近常用词义，也适合本段寻找放羊者的场景。
- source_word: וַיִּשְׁאָלֵהוּ
  choice: 问他
  rationale: שאל在此是普通的询问，“问他”准确、自然。
- source_word: לֵאמֹר
  choice: （不单独译出）
  rationale: 该词是引出直接引语的常见公式。现代汉语以冒号和引号即可自然表达其功能，无须生硬译作“说”。
- source_word: מַה תְּבַקֵּשׁ
  choice: 你在找什么？
  rationale: בקש在此表示寻找某人或某物。“你在找什么”是现代汉语最自然的表达，并保留未说明所找对象的开放性。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“有一个人……那人”维持希伯来文中人物由首次引入到再次指称的结构；直接引语简洁口语化，但不随意。未设置脚注，因为正文已自然涵盖主要词义，且所给英文脚注的内容实际对应末句措辞，并不构成中文译文必须标出的实质异读。
