base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: zh_hans
  text: 犹大对他的兄弟们说：“我们若杀死自己的兄弟，又掩盖他所流的血[a]，能得什么好处呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“掩盖他的血”。这是一种习语，可指隐瞒流血杀人之事或相关罪责。
    reason: 说明希伯来语习语，同时保留“血”的意象及其语义范围。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语不必机械译出“于是”，上下文已能体现事件推进。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל אֶחָיו
  choice: 对他的兄弟们
  rationale: 原文为阳性复数，在此明确指约瑟在场的男性兄弟。
- source_word: מַה בֶּצַע
  choice: 能得什么好处呢
  rationale: בֶּצַע 指收益、利益或好处，常带自利和物质收益意味；此译自然地保留犹大的功利盘算及反问语气。
- source_word: כִּי
  choice: 若
  rationale: 在反问中引出假设情形，译作“若”符合现代庄重汉语。
- source_word: נַהֲרֹג אֶת־אָחִינוּ
  choice: 杀死自己的兄弟
  rationale: 准确表达第一人称复数动作和亲属关系；“自己的”在汉语中凸显其道德张力。
- source_word: וְכִסִּינוּ אֶת־דָּמוֹ
  choice: 又掩盖他流血的事
  rationale: 原文直译为“掩盖他的血”，是指隐瞒流血杀人之事或相关罪责的形象化说法。正文以自然汉语传达习语含义，脚注保留原文字面意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“能得什么好处呢”自然表达反问；“流血的事”避免误解为单纯遮盖血迹，并由脚注呈现原文意象。
