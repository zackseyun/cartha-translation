base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: zh_hans
  text: “来吧，我们把他卖给以实玛利人，不要下手害他[a]，因为他是我们的弟兄，是我们的骨肉[b]。”他的弟兄们听了他的建议[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不要让我们的手在他身上”，意思是不要亲自下手加害他。
    reason: lexical_alternative
  - marker: b
    text: “骨肉”原文为“肉”，在这里指血亲或至亲。
    reason: lexical_alternative
  - marker: c
    text: “听了他的建议”也可理解为“听从了他”或“接受了他的意见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: 来吧
  rationale: 复数命令式在这里是推动众人采取行动的惯用说法；“来吧”自然地表达劝议语气。
- source_word: וְנִמְכְּרֶנּוּ
  choice: 我们把他卖给
  rationale: 第一人称复数意愿式表达提议；中文用“我们把他卖给”承接“来吧”，清楚传达“让我们卖掉他”的劝议力量。
- source_word: לַיִּשְׁמְעֵאלִים
  choice: 给以实玛利人
  rationale: 按专有族名直译，并符合现代中文圣经语体。
- source_word: וְיָדֵנוּ אַל־תְּהִי־בוֹ
  choice: 不要下手害他
  rationale: 原文直译为“不要让我们的手在他身上”，是不要亲自加害的惯用表达；“不要下手害他”既保留“手”的意象，也自然明确。
- source_word: כִּי אָחִינוּ בְשָׂרֵנוּ הוּא
  choice: 因为他是我们的弟兄，是我们的骨肉
  rationale: 保留“弟兄”与“肉身/骨肉”并列的强调，突出亲属关系而不删减原文的具体意象。
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: 他的弟兄们听从了他
  rationale: שׁמע 可表示听见、听从或接受意见；上下文表明众弟兄采纳了犹大的提议，“听从了他”自然传达此意，同时保留“听”的词义联系。
theological_decisions: []
