revisions:
- from: 他的兄弟们看见父亲爱他胜过爱他们所有人，就恨他，不能和和气气地跟他说话。[a]
  to: 他的兄弟们看见他们的父亲爱他比爱他的所有兄弟更多，就恨他，不能友善地跟他说话。[a]
  rationale: 修订比较结构以更清楚地反映“超过所有兄弟”的逐一比较，并将较口语的“和和气气地”改为语体更稳妥的“友善地”。其余叙事关系、代词指向及原文的“爱”与“恨”均予保留。
