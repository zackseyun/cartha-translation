  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: zh_hans
  text: 他的兄弟们看见他们的父亲爱他比爱他的所有兄弟更多，就恨他，不能友善地跟他说话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不能平和地跟他说话。”原文较直译为“不能向他说平安的话”，意思是他们无法以友善、和平的态度跟他说话。
    reason: 保留 לְשָׁלֹם 在“平和地／友善地”与含“平安”的较字面表达之间的词义和习语张力。
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 看见
  rationale: 叙事中的连续式推进情节；与后面的 כִּי 连用，表示他们看见并意识到一个事实。
- source_word: אֶחָיו
  choice: 他的兄弟们
  rationale: 指约瑟的兄弟；“兄弟们”既忠于原文，也避免把所有人都明确限定为哥哥。
- source_word: כִּי
  choice: （看见）……
  rationale: 在这里引出“看见”的内容，汉语无需另译连接词，用宾语从句自然表达。
- source_word: אָהַב
  choice: 爱
  rationale: 保留希伯来语常用动词“爱”的直接含义；偏爱的意味由比较结构表达，不改译为“偏爱”。
- source_word: אֲבִיהֶם
  choice: 父亲
  rationale: 原文是“他们的父亲”；在当前主语明确的汉语语境中省略“他们的”更自然，所指仍清楚。
- source_word: מִכָּל אֶחָיו
  choice: 胜过爱他们所有人
  rationale: 表达比较义“胜过他的所有兄弟”；补出第二个“爱”使汉语清楚，“他们所有人”避免生硬重复“他的兄弟们”。
- source_word: וַיִּשְׂנְאוּ
  choice: 就恨他
  rationale: שׂנא 直译为“恨”；“就”自然呈现所见事实与随后反应之间的叙事关联。
- source_word: וְלֹא יָכְלוּ
  choice: 不能
  rationale: 直接保留原文所表达的不能或无法。
- source_word: דַּבְּרוֹ
  choice: 跟他说话
  rationale: 该结构表示向约瑟说话或与他说话；“跟他说话”是现代汉语的自然表达。
- source_word: לְשָׁלֹם
  choice: 和和气气地
  rationale: 此处 שָׁלוֹם 指和平、友善的关系或态度；“和和气气地”自然表达友善交谈的语用含义，同时以脚注保留较字面的译法。
