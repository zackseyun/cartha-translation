  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: zh_hans
  text: 吕便听见了，就把约瑟从他们手中救出来，说：“我们不要害他的性命。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们不要杀他。”希伯来语近直译为“我们不要击打他，以致丧命”，意思是不要给他致命一击。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见了
  rationale: שׁמע的基本义是“听见”。上文已明确是兄弟们的谋划，中文不必补出宾语，也能自然衔接叙事。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: וַיַּצִּלֵהוּ
  choice: 把约瑟……救出来
  rationale: נצל的使役式在此表示“救出、解救”。明确补出“约瑟”，可避免连续代词在中文里造成指代含混。
- source_word: מִיָּדָם
  choice: 从他们手中
  rationale: 保留希伯来语“从他们手中”的权势与控制意象，同时也是自然的现代汉语表达。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 自然呈现希伯来叙事中引入直接引语的常用形式。
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: 我们不要害他的性命
  rationale: 该短语字面涉及“击打”与“性命”，在语境中是不要给予致命一击、不要杀害他的惯用表达。“害他的性命”既自然庄重，也保留“性命”这一成分。
