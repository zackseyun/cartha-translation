  text: His brothers went to pasture their father's flock at Shechem[a].
translation:
  language: zh_hans
  text: 约瑟的众兄弟到示剑[a]去牧放他们父亲的羊群。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在示剑牧放。”希伯来语介词既可指在城内，也可指在该地或其附近。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 去
  rationale: 该叙事性动词承接前文，表示接下来发生的行动；现代汉语用“去”自然明了，无须添加原文没有的“那时”或“后来”。
- source_word: אֶחָיו
  choice: 约瑟的哥哥们
  rationale: 字面为“他的兄弟们”。上下文所指是约瑟的男性手足，且汉语在此用“哥哥们”能清楚指明人物关系；补出“约瑟”以避免孤立经节中代词指向不明。
- source_word: לִרְעוֹת
  choice: 牧放
  rationale: רעה在此指照管并放牧牲畜；“牧放”兼顾看管与吃草之意，也适合以“羊群”为宾语。
- source_word: אֶת
  choice: 不译（直接宾语标记）
  rationale: אֵת只标示确定的直接宾语，在汉语中没有独立对应词。
- source_word: צֹאן
  choice: 羊群
  rationale: צֹאן是集合名词，泛指绵羊、山羊等小型牲畜。“羊群”是自然的汉语统称，同时不必武断限定为单一品种。
- source_word: אֲבִיהֶם
  choice: 他们父亲的
  rationale: 原文为带第三人称复数后缀的所有关系；“他们父亲的”准确保留其指代和领属关系。
- source_word: בִּשְׁכֶם
  choice: 到示剑
  rationale: 介词בְּ可表示在某地之内、某地或其附近。主文结合“去”的移动表达译作“到示剑”，按汉语习惯指在示剑一带从事牧放；脚注保留“在示剑”的可能译法。
