base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: zh_hans
  text: 吕便对他们说：“不要流血。把他扔进旷野里的这个坑[a]中，却不可下手害他。”——他这样说，是要把他从他们手中救出来[b]，送回他父亲那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”也可译作“蓄水池”。希伯来语בּוֹר可指挖出的坑或储水池。
    reason: lexical_alternative
  - marker: b
    text: 也可不补“他这样说”，译作：“……不可下手害他”——为要把他从他们手中救出来，送回他父亲那里。
    reason: structural_alternative
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: 不要流他的血
  rationale: 保留希伯来语“流血”的表达及其杀害、招致血债的含义；按上下文补出“他的”，使现代汉语清楚自然，又不简化为单纯的“不要杀他”。
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: 把他扔进
  rationale: 准确表达使役式命令所指的实际动作，现代汉语自然，不采用较古雅的“投掷”。
- source_word: הַבּוֹר
  choice: 坑
  rationale: בּוֹר可指坑或蓄水池；正文采用涵盖面较广且符合叙事场景的“坑”，另以脚注保留“蓄水池”的可能。
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: 旷野里的
  rationale: 明确表达关系从句“在旷野中的”；“旷野”比“沙漠”更能涵盖מִדְבָּר所指的荒野或干旱牧地。
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: 却不可下手害他
  rationale: 用自然汉语保留“下手”这一身体意象，并表达禁止亲手加害他的语用含义；“却”显出前后安排的转折。
- source_word: לְמַעַן הַצִּיל אֹתוֹ מִיָּדָם
  choice: 他这样说，是要把他从他们手中救出来
  rationale: לְמַעַן引出吕便隐藏的目的。补出“他这样说”可自然标示叙述者从直接引语转入动机说明；“从他们手中”保留希伯来语表示权势或控制的惯用说法。
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: 送回他父亲那里
  rationale: 准确表达使他返回父亲身边的使役含义，也比生硬的“使他返回”更符合现代汉语。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代简体中文圣经人名的通行译名。
theological_decisions:
- issue: 吕便的目的与直接引语之间的关系
  choice: 在引语结束后用破折号及“他这样说”标明这是叙述者对吕便动机的说明
  alternative: 把“为要把他从他们手中救出来”直接接在引语后，不补说明语
  rationale: 希伯来语לְמַעַן目的句说明吕便如此提议的隐秘用意，并非他向兄弟们公开说出的内容；正文既保留目的关系，也避免把动机误纳入引语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引语中的命令简洁有力；叙述部分用破折号区分吕便公开的话与叙述者揭示的真实目的。
