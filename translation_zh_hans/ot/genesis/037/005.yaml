base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/005.yaml
  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: zh_hans
  text: 约瑟做了一个梦[a]，把梦告诉了他的兄弟们；他们就越发恨他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“约瑟梦了一个梦。”
    reason: 保留原文同源动词和名词相配的表达形式。
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: 约瑟做了一个梦
  rationale: 原文采用同源动词与名词相配的结构，直译近似“约瑟梦了一个梦”。现代汉语以“做了一个梦”自然表达相同事件，并用脚注保留原文形式。
- source_word: וַיַּגֵּד
  choice: 告诉了
  rationale: נגד 的使役词干在这里表示把事情告知、讲给人听；“告诉了”符合叙事语境，宾语由上文的“梦”明确表达。
- source_word: לְאֶחָיו
  choice: 他的兄弟们
  rationale: 忠实保留 אָח 的男性亲属复数含义，不把原文具体的亲属关系中性化，也不擅自限定为“哥哥们”。
- source_word: וַיּוֹסִפוּ עוֹד
  choice: 就越发
  rationale: 该组合表示程度进一步增加；“越发”简洁自然地传达“更加、愈加”的递增意味，“就”承接前一事件而不增添原文没有的时间词。
- source_word: שְׂנֹא אֹתוֹ
  choice: 恨他
  rationale: 不定式与“增添、继续”类动词结合，整体表示他们对约瑟的恨进一步加深；汉语用限定动词“恨他”表达自然。
theological_decisions: []
