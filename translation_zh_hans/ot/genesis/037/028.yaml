  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: zh_hans
  text: 这时，有些米甸商人经过。他们拉起约瑟，把他带出坑来，又以二十银子[a]把约瑟卖给以实玛利人[b]。他们随后把约瑟带到埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“二十银”，没有明说计量单位。
    reason: lexical_alternative
  - marker: b
    text: 原文提到米甸商人和以实玛利人后，接连使用“他们拉”“他们带上来”“他们卖”“他们带”等复数动词；因此，各处“他们”具体指哪一群人，存在一定歧义。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: 经过
  rationale: עבר在此表示从该处经过；“经过”自然、简洁，不额外解释为抵达。
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: 有些米甸商人
  rationale: 原文直译近于“米甸人，商人”。现代汉语用“米甸商人”即可清楚保留其族属与职业；“有些”自然体现复数人物的引入。
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: 把约瑟拉上来，抬出坑外
  rationale: 分别呈现“拉”和使之上来的两个动词，同时以自然汉语表达从坑中出来的连续动作。
- source_word: מִן הַבּוֹר
  choice: 出坑外
  rationale: בור可指坑或蓄水池；本段沿用自然且通行的“坑”，不将用途说死。
- source_word: וַיִּמְכְּרוּ
  choice: 卖
  rationale: 直接对应原文“卖”，无需扩充。
- source_word: לַיִּשְׁמְעֵאלִים
  choice: 给以实玛利人
  rationale: 保留原文明说的交易对象，并与米甸商人这一称呼相区别。
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: 以二十银子
  rationale: 原文仅作“二十银”，没有明说计量单位；正文不擅自补作“舍客勒”，并用脚注说明。
- source_word: וַיָּבִיאוּ
  choice: 带到
  rationale: 在人物作宾语、地点作终点的叙事语境中，“带到”是自然的现代汉语表达。
- source_word: מִצְרָיְמָה
  choice: 到埃及
  rationale: 方向词尾表示朝向埃及，“到埃及”准确而自然。
theological_decisions:
- issue: 提到米甸商人和以实玛利人后，各复数动词的主语所指
  choice: 正文一律保留为未明说身份的“他们”
  alternative: 把拉出、出售和带往埃及的动作全部明确归给米甸商人，或把后续动作归给以实玛利人
  rationale: 希伯来文在提及两个群体后继续使用第三人称复数动词，没有逐一重新标明主语。译文不以解释性增词消除这一叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“这时”承接情节；用“拉上来，抬出坑外”保留原文双动词；不补出原文未注明的银钱单位，也不擅自明确后续复数主语。所有脚注标记均已置于正文相应位置。
