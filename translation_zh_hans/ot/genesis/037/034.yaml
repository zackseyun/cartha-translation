base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: zh_hans
  text: 雅各撕裂衣服，腰间围上麻布[a]，为儿子哀悼了许多日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语指腰部，也可指腰胯一带。
    reason: 说明原文身体部位词的语义范围，避免将“腰间”理解得过于狭窄。
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: 撕裂
  rationale: קרע在哀悼语境中指撕破衣物以表示悲痛；“撕裂”既保留具体动作，也符合庄重叙事语体。
- source_word: שִׂמְלֹתָיו
  choice: 衣服
  rationale: שִׂמְלָה泛指衣物；“衣服”自然、清楚，不像“袍子”那样过度具体。
- source_word: שַׂק
  choice: 麻布
  rationale: שַׂק指哀悼时所用的粗布；“麻布”是现代中文圣经语境中清楚而自然的对应词。
- source_word: בְּמָתְנָיו
  choice: 围在腰间
  rationale: מָתְנַיִם指腰或腰胯部位；结合וַיָּשֶׂם，译作“围在腰间”自然地表达将麻布置于该身体部位。
- source_word: וַיִּתְאַבֵּל
  choice: 哀悼
  rationale: אבל的Hitpael形式表示进入或持续处于正式哀悼状态；“哀悼”比单纯“悲伤”更能体现丧亲及相关举动。
- source_word: עַל־בְּנוֹ
  choice: 为儿子
  rationale: 介词עַל与哀悼动词连用，可表示“为……哀悼”；中文如此表达最自然，也不增添原文没有的信息。
- source_word: יָמִים רַבִּים
  choice: 许多日子
  rationale: 直译为“许多日子”，在句中表达哀悼持续了很长一段时日，同时保留原文朴素的时间表述。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就”承接上文事件；保留撕衣、围麻布和长期哀悼这三个依次展开的动作。
