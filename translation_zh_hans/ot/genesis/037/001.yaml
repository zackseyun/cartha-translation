  text: וַ/יֵּ֣שֶׁב יַעֲקֹ֔ב בְּ/אֶ֖רֶץ מְגוּרֵ֣י אָבִ֑י/ו בְּ/אֶ֖רֶץ כְּנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: zh_hans
  text: 雅各住在他父亲寄居之地[a]，就是迦南地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“雅各定居在他父亲寄居之地，在迦南地。”
    reason: 原文的וַיֵּשֶׁב可译为“住”或“定居”，并重复使用“在……地”；正文采用较自然的汉语表达，脚注保留更形式对应的译法。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 雅各住在
  rationale: ישׁב在这里表示居住、安居；采用“住在”符合现代汉语习惯，也不把长期或永久定居的含义说得过满。句首וַ־承接并推进叙事，汉语无需另加“现在”或“后来”。
- source_word: בְּאֶרֶץ
  choice: 在……之地
  rationale: אֶרֶץ在此指地域或土地；“之地”既保留地理含义，也能自然连接后面的修饰语。
- source_word: מְגוּרֵי אָבִיו
  choice: 他父亲寄居之地
  rationale: מְגוּרֵי源于表示寄居的词根，含有以外来者身份居住的意味。“寄居之地”在简洁的现代汉语中保留这一重要语义；“他父亲”指以撒。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 就是迦南地
  rationale: 原文再次使用“在……地”，以同位语说明前述地点就是迦南地。汉语用“就是”明确其同位说明关系，同时保留“迦南地”这一传统而自然的地名表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“寄居”保留族长在应许之地作为外来居住者的语义，但不额外引申神学结论；“就是”使原文的同位说明在汉语中清楚自然。
