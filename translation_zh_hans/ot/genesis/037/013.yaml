base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: zh_hans
  text: 以色列对约瑟说：“你哥哥们不是正在示剑放羊[a]吗？来吧，我要差你到他们那里去。”约瑟对他说：“我在这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放羊”也可译作“牧放”或“照料羊群”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文在此使用“以色列”这一名字，而不是“雅各”，故按原文保留。
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 该词引出预期肯定回答的反问；“不是……吗”既保留疑问形式，也符合现代汉语表达。
- source_word: אַחֶיךָ
  choice: 你哥哥们
  rationale: 原词意为“你的兄弟们”；按叙事背景，这些人都是约瑟的哥哥，中文用“哥哥们”指称更准确自然。
- source_word: רֹעִים
  choice: 放羊
  rationale: 该分词表示牧放、照料牲畜；结合上下文所牧放的是羊群，“放羊”简明自然，并保留动作含义。
- source_word: בִּשְׁכֶם
  choice: 在示剑
  rationale: 介词表示地点；“在示剑”是现代汉语中自然的地点表达，地名按惯用译名处理。
- source_word: לְכָה
  choice: 来吧
  rationale: 该命令式在这里用作召唤并引出差遣；“来吧”自然传达邀请、吩咐的语气，不把它过度解释成“去”。
- source_word: וְאֶשְׁלָחֲךָ
  choice: 我要差你
  rationale: 保留“召来继而差遣”的语义次序；“差你”符合庄重的圣经叙事语体。
- source_word: אֲלֵיהֶם
  choice: 到他们那里去
  rationale: 代词回指约瑟的哥哥们；此译法自然表达朝向他们所在之处的移动。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: 这是希伯来叙事中表示自己在场并愿意听命的固定回应；直译可保留其文学呼应，而不额外加入“听候差遣”等解释。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“不是……吗”保留原文反问；“我在这里”保留希伯来语固定回应的简洁与含蓄，不将顺服或受命之意明说出来。
