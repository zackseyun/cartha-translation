revisions:
- from: 看哪，我们正在田间捆禾捆；看哪，我的禾捆起来了，而且直立着；看哪，你们的禾捆围拢过来，向我的禾捆下拜。[a]
  to: 看哪，我们正在田地中捆禾捆；看哪，我的禾捆站了起来，并且直立着；看哪，你们的禾捆围拢过来，向我的禾捆下拜。[a]
  rationale: 仅将有歧义的“我的禾捆起来了”改为“我的禾捆站了起来”，以明确呈现原文“起立”这一动作；保留随后“并且直立着”所表达的持续站立状态。其余措辞、三重提示语、分号节奏及脚注均维持原意。
