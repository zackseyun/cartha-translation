base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: zh_hans
  text: 看哪，我们正在田地中捆禾捆；看哪，我的禾捆站了起来，并且直立着；看哪，你们的禾捆围拢过来，向我的禾捆下拜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下拜”也可译作“俯伏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪……看哪……看哪
  rationale: 保留梦境叙述中三次重复的提示语及其鲜明、即时的效果；“看哪”庄重而仍为现代读者所理解。
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: 捆禾捆
  rationale: 动词与同根名词构成“把谷物捆成捆”的表达；“捆禾捆”保留农业图景和原文的同根呼应。
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: 在田间
  rationale: 自然表达身处田地之中的空间含义，避免把 בְּתוֹךְ 过度限定为几何意义上的正中央。
- source_word: קָמָה
  choice: 起来了
  rationale: 呈现禾捆由倒伏到起立的动作，并与随后表示持续姿态的 נִצָּבָה 区分。
- source_word: וְגַם נִצָּבָה
  choice: 而且直立着
  rationale: 保留 וְגַם 的递进强调，也表达禾捆起来后保持直立的状态。
- source_word: תְסֻבֶּינָה
  choice: 围拢过来
  rationale: 该动词表示转向、环绕；此译既呈现环绕动作，也符合多个禾捆向中心聚拢的梦境画面。
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: 下拜
  rationale: 简洁表达俯身敬拜或表示臣服的动作，不预先限定其礼仪、政治或宗教性质。
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: 我的禾捆／你们的禾捆
  rationale: 统一译出 אֲלֻמָּה，保持农业背景及梦中象征之间清楚的对应。
theological_decisions:
- issue: 禾捆下拜所表达的关系
  choice: 译为“向……下拜”，保留动作本身
  alternative: 译为“向……俯伏称臣”或“敬拜”
  rationale: 原词可表示俯身、下拜，具体是礼敬、臣服还是敬拜须由上下文判断；本节不宜在译文中提前锁定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以分号区分梦境的三个连续画面，同时保留“看哪”的三重重复和原文并列推进的节奏。
