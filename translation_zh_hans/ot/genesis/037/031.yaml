base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/031.yaml
  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: zh_hans
  text: 于是，他们拿了约瑟的袍子[a]，宰了一只公山羊，把袍子蘸在血中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“长衣”或“外袍”；希伯来语指一种类似内袍的衣物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 于是，他们拿起
  rationale: 连续式叙事动词推动情节发展；“于是”符合现代汉语叙事习惯，“拿起”自然表达取来并使用该衣物。
- source_word: כְּתֹנֶת יוֹסֵף
  choice: 约瑟的长衣
  rationale: כְּתֹנֶת指贴身或袍式衣物。“长衣”既通俗自然，又避免让人联想到现代西式外套；所有格结构译作“约瑟的”。
- source_word: וַיִּשְׁחֲטוּ
  choice: 宰了
  rationale: 该动词特指宰杀动物；“宰了”准确、自然，也不额外赋予献祭含义。
- source_word: שְׂעִיר עִזִּים
  choice: 一只公山羊
  rationale: 该词组明确指雄性的山羊；“公山羊”保留性别信息，并符合现代汉语表达。
- source_word: וַיִּטְבְּלוּ
  choice: 蘸
  rationale: 该动词可指蘸入或浸入；在衣物放进血里的语境中，“蘸”简洁自然，同时不强行规定浸没程度。
- source_word: הַכֻּתֹּנֶת
  choice: 长衣
  rationale: 与本节前半句保持词汇一致。
- source_word: בַּדָּם
  choice: 在血里
  rationale: 介词及冠词指向刚宰杀的公山羊之血；“在血里”自然保留定指语境。
