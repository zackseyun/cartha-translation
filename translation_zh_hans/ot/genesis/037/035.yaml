language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: zh_hans
  text: 他的儿子和女儿全都起来安慰他，他却不肯接受安慰，说：“我要带着哀痛下到阴间[a]，到我儿子那里去[b]。”他父亲就为他哭泣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”希伯来文作“示奥勒”；也可译作“坟墓”。
    reason: 说明שְׁאוֹל的原文用词及主要词汇替代译法，而不将其范围作超出本节所需的界定。
  - marker: b
    text: 直译：“我要到我儿子那里去，哀痛着下到阴间。”
    reason: 展示原文中“到我儿子那里”“哀痛着”与“下到阴间”的紧凑词序，并保留其修饰关系的张力。
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 起来
  rationale: קום的叙事性动词形式表示起身采取行动；“起来”自然保留了这一动作。
- source_word: כָל־בָּנָיו וְכָל־בְּנֹתָיו
  choice: 他的儿子和女儿全都
  rationale: 原文明确分别提到“儿子”和“女儿”，因此不笼统译作“儿女”或“孩子们”；“全都”涵盖两组人。
- source_word: לְנַחֲמוֹ
  choice: 安慰他
  rationale: נחם的Piel形式在丧亲语境中指给予安慰；“安慰”是现代汉语最自然的对应表达。
- source_word: וַיְמָאֵן לְהִתְנַחֵם
  choice: 他却不肯接受安慰
  rationale: מאן表示拒绝；התנחם在此可带被动或反身意味。“不肯接受安慰”既自然，又表现他主动拒绝别人劝慰。
- source_word: כִּי
  choice: 省略明译
  rationale: 此处כִּי引出雅各拒绝受安慰的理由或所说的内容。汉语直接引述已能自然表达这层关系，若硬译“因为”反而显得句意未完。
- source_word: אֵרֵד
  choice: 我要……下到
  rationale: 保留ירד“下去”的空间意象，并用“要”表达第一人称未完成式在此所表明的决意。
- source_word: אֶל־בְּנִי
  choice: 到我儿子那里去
  rationale: אֶל通常表示“到、向”；该译法保留雅各所说要到儿子那里的表达，不额外界定其死后状态。
- source_word: אָבֵל
  choice: 带着哀痛
  rationale: אָבֵל表示处于哀悼之中。“带着哀痛”在现代汉语中能自然修饰“下到”，也保留其持续哀悼的意思。
- source_word: שְׁאֹלָה
  choice: 下到阴间
  rationale: שְׁאוֹל指死者所在之处，不宜简单等同于坟墓，也不应引入后期关于来世的完整教义。“阴间”是庄重且较为通行的汉语对应词。
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: 他父亲就为他哭泣
  rationale: 依原文保留“他父亲”作主语、“为他”作对象；“就”自然承接前文，而不强化原文没有明确表达的因果关系。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；死者的居所；示奥勒
  rationale: “阴间”保留其作为死者所在领域的含义，同时避免把它缩减为单一墓穴，或把后期有关天堂、地狱的观念预先带入本节。
- issue: “到我儿子那里”与“下到阴间”的关系
  choice: 我要带着哀痛下到阴间，到我儿子那里去
  alternative: 我要哀痛着到我儿子那里去，下到阴间
  rationale: 原文语序紧凑，אֶל־בְּנִי、אָבֵל和שְׁאֹלָה之间的修饰关系可有不同理解。正文采用自然汉语语序，但脚注保留更贴近原文次序的另一种表达，不进一步断定死后相聚的性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不肯接受安慰”比直译“不肯被安慰”更符合现代汉语；“带着哀痛”避免古雅的“悲哀地下去”。正文保留“儿子和女儿”的明确区分，以及末句原文简洁的代词表达。
