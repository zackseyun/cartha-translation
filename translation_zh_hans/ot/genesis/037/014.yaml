source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: zh_hans
  text: 他对约瑟说：“你去看看你的哥哥们是否平安[a]，羊群是否安好，再回来告诉我。”于是，他从希伯仑谷打发约瑟去，约瑟就到了示剑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”和下文的“安好”原文使用同一个词，意为平安、安康或状况良好。
    reason: 说明原文两次重复שָׁלוֹם，而汉语为行文自然采用了不同措辞。
lexical_decisions:
- source_word: לֶךְ נָא
  choice: 你去
  rationale: לֶךְ是“去”的命令式，נָא使语气较为柔和；现代汉语的“你去”在父亲吩咐儿子的叙事语境中自然表达这一语气。
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: 看看……是否平安／是否安好
  rationale: ראה本义为“看”，在这里指察看、了解情况；שׁלום在两处均指平安、安好或福祉。译文保留“看看”，并用自然的汉语说明所要察看的状况。
- source_word: אַחֶיךָ
  choice: 你的哥哥们
  rationale: 此处指约瑟那些正在放羊的年长兄弟；“哥哥们”比笼统的“兄弟们”更明确地符合本段人物关系。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צאן泛指成群的小型牲畜，主要包括绵羊和山羊；“羊群”是本语境中自然且不过度细分的译法。
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: 再回来告诉我
  rationale: 这一表达直指把所得消息带回并报告；“再回来告诉我”既体现使役形式所含的返回意味，也符合现代汉语习惯。
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: 从希伯仑谷
  rationale: עֵמֶק意为“山谷、谷地”，构词关系表明这是希伯仑一带的谷地；译为“希伯仑谷”简洁清楚。
- source_word: שְׁכֶמָה
  choice: 到了示剑
  rationale: 地名后的方向词尾表示朝示剑而去；汉语以“到示剑”自然表达这一方向。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免连续多个“他”造成指代混乱，按上下文将宾语明确为“约瑟”；原文两次出现的“他”均指约瑟。
