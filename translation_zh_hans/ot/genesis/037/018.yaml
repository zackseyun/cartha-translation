  text: וַ/יִּרְא֥וּ אֹת֖/וֹ מֵ/רָחֹ֑ק וּ/בְ/טֶ֨רֶם֙ יִקְרַ֣ב אֲלֵי/הֶ֔ם וַ/יִּֽתְנַכְּל֥וּ אֹת֖/וֹ לַ/הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: zh_hans
  text: 他们远远地看见了他；他还没有走近他们，他们就密谋[a]要杀死他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “密谋”也可译作“设诡计害他”。希伯来语动词可指谋划或以诡诈行事；这里下文明确说明，他们的目的是杀死他。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: 他们远远地看见了他
  rationale: 按叙事时态译出“他们看见他”，并以现代汉语常用的“远远地”表达 מֵרָחֹק 的空间距离。
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: 他还没有走近他们
  rationale: בְּטֶרֶם 表示某事尚未发生；“还没有”自然保留“在……以前／尚未”的时间关系。קרב 在此指空间上的接近，译作“走近”。
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: 他们就密谋[a]
  rationale: נכל 的 Hitpael 形在本语境中表示怀着敌意施计、策划；“密谋”既符合多人共同策划的情境，也与下文明确的杀人目的衔接。
- source_word: לַהֲמִיתוֹ
  choice: 要杀死他
  rationale: מות 的 Hiphil 不定词连同第三人称阳性单数后缀表达使他死亡的目的；“要杀死他”清楚而自然。
theological_decisions: []
translation_notes:
