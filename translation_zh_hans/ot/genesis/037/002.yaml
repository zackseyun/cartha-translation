source:
  edition: WLC
  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: zh_hans
  text: 雅各的后代[a]如下：约瑟十七岁时，和他的哥哥们一同牧放羊群。他还是个少年，和他父亲的妻子辟拉、悉帕的儿子们在一起。约瑟把有关他们的坏消息带给了他们的父亲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代”也可译作“记事”或“家族史”。希伯来文这个词常用来引出《创世记》的一个新段落，可以指从某人延续而来的后代和历史，并非只列出生物学意义上的子孙。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文是“他们的父亲”，明确使用复数所属形式，指雅各是约瑟和众兄弟共同的父亲。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: 后代
  rationale: 这是《创世记》中划分段落的结构性用语，既可指一人的后代，也可引出由他而来的家族史；正文采用传统而简洁的“后代”，脚注保留“记事/家族史”的可能。
- source_word: הָיָה רֹעֶה
  choice: 放羊
  rationale: 分词结构表示持续进行的牧养活动；现代汉语“放羊”自然明确，也切合 צֹאן 在本节语境中的羊群含义。
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: 和他的哥哥们一起放羊
  rationale: 按语境理解为约瑟与众兄弟一同照管羊群，而不是牧养他的兄弟；“哥哥们”符合约瑟在这些兄弟中的年龄关系。
- source_word: נַעַר
  choice: 少年
  rationale: 约瑟已明确为十七岁，“少年”既符合年龄，也避免“男孩”显得过于年幼；本处没有必要引入“仆人”的词义。
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: 常跟……辟拉和悉帕所生的儿子们在一起
  rationale: 希伯来句法较难，最稳妥的是理解为约瑟与这两组同父异母兄弟相处；“在一起”保留关联而不过度界定他的具体职分，“常”体现背景性、持续性的叙述。
- source_word: נְשֵׁי אָבִיו
  choice: 他父亲的妻子
  rationale: 直译该所有格短语，并让它自然修饰辟拉和悉帕二人。
- source_word: דִּבָּתָם רָעָה
  choice: 他们的恶行报告
  rationale: 该短语可指关于他们的坏消息、不利报告，也可能涉及恶劣行为；此译使现代汉语顺畅，但避免添加“诬告”等原文未明确的道德判断。
- source_word: אֶל אֲבִיהֶם
  choice: 给了他们的父亲
  rationale: 保留希伯来文复数后缀“他们的”，表明雅各是约瑟和这些兄弟共同的父亲，而不顺译为“他的父亲”。
theological_decisions:
- issue: 约瑟所报内容及其真实性
  choice: 译为“把他们的恶行报告给了……”
  alternative: “把关于他们的坏消息带给了……”或“打了他们的小报告”
  rationale: 原文说明报告是不利或坏的，却没有明确判定约瑟是在忠实揭露恶行还是恶意告状；避免采用带有“搬弄是非、告密”色彩的表达，以免预先裁定约瑟的动机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留“雅各的后代”这一《创世记》结构公式，并以脚注说明其较宽的篇章功能。正文拆分长句以符合现代汉语节奏；专名采用通行译名“约瑟、辟拉、悉帕”。
