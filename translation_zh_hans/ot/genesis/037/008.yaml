  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: zh_hans
  text: 他的哥哥们对他说：“难道你真要作王统治我们吗？难道你真要管辖我们吗？”他们因他的梦和他的话，就更加恨他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: 难道你真要作王统治我们吗
  rationale: 以“作王统治”表达מלך的君王语义，并用“真要”体现不定式绝对式与限定动词连用所产生的强调；“难道”传达兄长们带有反驳和轻蔑意味的疑问。
- source_word: מָשׁוֹל תִּמְשֹׁל
  choice: 难道你真要管辖我们吗
  rationale: 用“管辖”区别于前句的“作王统治”，保留原文近义平行而不将两句完全合并；“真要”再次体现强调结构。
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: 就更加恨他
  rationale: 自然表达“又加增恨恶”的希伯来语结构，准确传达仇恨程度进一步加深。
- source_word: עַל חֲלֹמֹתָיו וְעַל דְּבָרָיו
  choice: 因他的梦和他的话
  rationale: 保留两个并列原因及“话”的宽泛含义，不擅自限定为解梦、夸口或具体言论。
theological_decisions:
- issue: 约瑟将来权柄的性质
  choice: 保留“作王统治”与“管辖”的双重表述
  alternative: 将两句统一译为“统治”或解释为约瑟必然成为君王
  rationale: 本节呈现哥哥们对梦的敌意解读，并未在此直接说明约瑟将以何种制度性身份掌权；译文不把他们的质问转化为明确的神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“哥哥们”符合约瑟与众兄长的关系；两个反问保持口语力度和原文平行结构。
