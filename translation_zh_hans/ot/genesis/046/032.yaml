  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: zh_hans
  text: 这些人是牧羊人[a]，因为他们是以饲养牲畜为业的；他们把羊群、牛群和自己所有的一切都带来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些人是牧羊人，因为他们以饲养牲畜为业；他们把羊群、牛群和自己所有的一切都带来了。”希伯来语的完成式在这里既可着重既往事实，也可表示延续到当前处境的状态。
    reason: 保留希伯来语完成式在本语境中的时体弹性，避免将其延续性理解为唯一可能。
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: 这些人
  rationale: 定冠词复数名词在本段指约瑟的兄弟；现代汉语用“这些人”明确承接上文，比生硬保留句首“和”更自然。
- source_word: רֹעֵי צֹאן
  choice: 牧羊人
  rationale: 该构造短语直指牧放羊群的人；“牧羊人”是准确、通行的现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他们被称为牧羊人的原因或说明，“因为”清楚表达解释关系。
- source_word: אַנְשֵׁי מִקְנֶה
  choice: 以饲养牲畜为业
  rationale: 该短语表示从事畜牧的人；此译保留职业含义，并避免把 מִקְנֶה 狭义化为牛。
- source_word: הָיוּ
  choice: 一向……为业
  rationale: 完成式描述他们已经确立、延续到当前场景的职业背景；“一向”自然传达这种持续性，同时以脚注保留时体上的另一种理解。
- source_word: וְצֹאנָם
  choice: 羊群
  rationale: צֹאן 集体指小型牲畜，尤指绵羊和山羊；“羊群”在汉语中自然保留其集合意义。
- source_word: וּבְקָרָם
  choice: 牛群
  rationale: בָּקָר 指牛类牲畜；“牛群”准确，并与“羊群”形成自然对应。
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: 自己所有的一切
  rationale: 贴近“凡属于他们的”，概括他们全部财物，语义完整且符合现代汉语。
- source_word: הֵבִיאוּ
  choice: 都带来了
  rationale: 完成式表示已经完成且与眼前到达有关的行动；“带来了”准确呈现其当前关联。
