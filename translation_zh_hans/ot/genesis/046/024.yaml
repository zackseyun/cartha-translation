  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: zh_hans
  text: 拿弗他利的儿子：雅薛、沽尼、耶色和示冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי נַפְתָּלִי
  choice: 拿弗他利的儿子
  rationale: בְּנֵי是“儿子”的复数构造形式；וּ承接上下文的族谱名单。现代汉语中以标点自然体现名单的延续，无须生硬译出“和”。专名采用中文圣经传统中通行且易于辨认的译名“拿弗他利”。
- source_word: יַחְצְאֵל
  choice: 雅薛
  rationale: 按中文圣经传统音译此人名，同时与其他经文中的同名人物保持一致。
- source_word: וְגוּנִי
  choice: 沽尼
  rationale: 专名采用中文圣经传统音译；词首连接词在汉语列举结构中由顿号体现。
- source_word: וְיֵצֶר
  choice: 耶色
  rationale: 专名采用中文圣经传统音译，保留其作为人名的功能，不尝试意译。
- source_word: וְשִׁלֵּם
  choice: 示冷
  rationale: 专名采用中文圣经传统音译；末项前的连接词译作“和”，使名单结构符合现代汉语习惯。
