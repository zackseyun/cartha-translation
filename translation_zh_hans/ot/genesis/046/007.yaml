base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: zh_hans
  text: 他的儿子和孙子[a]、女儿和孙女[b]，以及他所有的后裔[c]，他都带到了埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他儿子的儿子”。
    reason: lexical_alternative
  - marker: b
    text: 直译“他儿子的女儿”。
    reason: lexical_alternative
  - marker: c
    text: 或译“所有子孙”；直译“所有种子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 此处与后面的“女儿”相对，明确指男性子女，因此译作“儿子”，不泛译为“孩子”。
- source_word: וּבְנֵי בָנָיו
  choice: 和孙子[a]
  rationale: 原文直译为“他儿子的儿子”；现代汉语以“孙子”自然表达这一父系第二代关系，并用脚注保留原文的具体说法。
- source_word: אִתּוֹ
  choice: 带着一同
  rationale: 表示陪同、同行。结合使役动词“带到”，译为“带着一同”既自然，又保留“与他一起”的含义。
- source_word: בְּנֹתָיו
  choice: 女儿
  rationale: 直接表达女性子女，与本节的“儿子”对应。
- source_word: וּבְנוֹת בָּנָיו
  choice: 和孙女[b]
  rationale: 原文直译为“他儿子的女儿”；现代汉语用“孙女”表达自然，并以脚注说明原文限定为儿子所生。
- source_word: וְכָל זַרְעוֹ
  choice: 以及他所有的后裔[c]
  rationale: זֶרַע字面为“种子”，用于家族时是集合名词，指所生的后代；“所有的后裔”符合本节家族迁移的语境。
- source_word: הֵבִיא
  choice: 带……到了
  rationale: בוא的使役式表示使人来到、带来；在进入埃及的叙事语境中，“带……到了”准确且符合现代汉语。
- source_word: מִצְרָיְמָה
  choice: 到了埃及
  rationale: 词尾־ה表示朝向某地的运动；结合上下文实际抵达埃及，汉语译为“到了埃及”自然清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文先列举家属、后以“他都带着”收束的句式；“孙子”“孙女”使中文自然，脚注则保留希伯来文对“儿子的儿女”的具体限定。
