  text: 到时候，法老召见你们，问：‘你们是做什么的？’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 到时候
  rationale: 这是引出将来情形的希伯来语惯用结构；译为“到时候”既自然，也保留时间含义。
- source_word: יִקְרָא לָכֶם
  choice: 召见你们
  rationale: קרא 与 ל 连用可表示呼唤或召来；在法老宫廷的语境中，“召见”准确而自然。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代中文圣经及一般汉语中通行的埃及君王称号。
- source_word: וְאָמַר
  choice: 问
  rationale: 原词形式上是“说”，但其后直接引出疑问句；现代汉语用“问”能自然表达这里言说行为的功能，而不改变内容。
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: 你们是做什么的
  rationale: מַעֲשֵׂיכֶם 字面涉及“你们的工作/所做之事”，此处是在询问职业；“你们是做什么的”是现代普通话最自然的问法。
