base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: zh_hans
  text: 这些是悉帕的儿子；悉帕是拉班给他女儿利亚的。悉帕给雅各所生的这些人，共十六人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”直译可作“生命”或“魂”；希伯来语 נֶפֶשׁ（nephesh）在这里是计算人数的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: 这些是悉帕的子孙
  rationale: בְּנֵי 字面为“儿子们”，但本节总结的名单也包括后代；现代汉语用“子孙”既自然，也准确涵盖整组人物。
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: 悉帕是拉班给他女儿利亚的
  rationale: 关系从句修饰悉帕。汉语拆成独立分句，可清楚保留拉班、利亚与悉帕之间的关系，避免冗长生硬。
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: 她为雅各生了这些人
  rationale: יַלד 在族谱语境中指生育；介词 לְ 标示父亲，译作“为雅各生了”符合现代汉语表达。“这些人”回指前列整组成员。
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: 共十六人
  rationale: נֶפֶשׁ 在人口或族谱统计中是按个体计数的习语，译作“人”最清楚自然；“共”明确这是前述名单的总数。
