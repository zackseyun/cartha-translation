base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: zh_hans
  text: 约瑟在埃及地得了两个儿子，就是玛拿西和以法莲；他们是安城[a]祭司波提非拉的女儿亚西纳给他生的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安”是埃及的一座城，后来希腊人称它为赫利奥波利斯。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: 约瑟……得了两个儿子
  rationale: 原文是被动式“为约瑟而生”，动词虽为单数形式，后接玛拿西和以法莲二人。现代汉语若说“约瑟生了”容易误解为约瑟亲自生产，因此用“得了两个儿子”自然表达儿子为他而生，并由后半句明确母亲的生育行动。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 明确保留 אֶרֶץ“地、国土”，同时符合庄重而自然的现代汉语。
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: 他们是……亚西纳给他生的
  rationale: 保留关系从句所指的两个儿子，也保留亚西纳作为母亲的生育行动以及 לּוֹ“给他”的关系。
- source_word: אָסְנַת
  choice: 亚西纳
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: בַּת פּוֹטִי פֶרַע
  choice: 波提非拉的女儿
  rationale: 按原文附属结构表达亚西纳与父亲波提非拉的关系。
- source_word: כֹּהֵן אֹן
  choice: 安城祭司
  rationale: כֹּהֵן 译为“祭司”；地名 אֹן 采用中文通行音译“安”，加“城”帮助普通读者辨明这是地名。
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: 玛拿西和以法莲
  rationale: 不译直接宾语标记，采用两个人名的通行中文音译。
theological_decisions: []
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“得了两个儿子”避免现代读者把“约瑟生了”误解为约瑟本人生产；分号保留原文前后两层陈述的紧密关系。英文咨询层的脚注标记与脚注内容次序不一致，故按原文所需只在“安城”处设置文化说明。
