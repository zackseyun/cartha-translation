  text: 'And the sons of Issachar: Tola[a], Puvah, Job[b], and Shimron.'
translation:
  language: zh_hans
  text: 以萨迦的儿子是陀拉、普瓦[a]、约伯[b]和伸仑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本作“普阿”。
    reason: lexical_alternative
  - marker: b
    text: 《历代志上》7:1作“雅述”，而不是“约伯”。
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 的儿子是
  rationale: בְּנֵי是“儿子”的复数属格结构；结合中文家谱名单的表达习惯，译作“的儿子是”。句首连接词וּ所承接的名单关系由上下文和句式自然体现，不生硬另译“并且”。
- source_word: יִשָׂשכָר
  choice: 以萨迦
  rationale: 人名采用现代中文圣经读者熟悉的通行音译。
- source_word: תּוֹלָע
  choice: 陀拉
  rationale: 家谱中的人名，采用通行音译，不按普通名词含义意译。
- source_word: וּ/פֻוָּה
  choice: 普瓦
  rationale: 按本节马所拉文本פֻוָּה音译为“普瓦”；另一种音译“普阿”列入脚注。
- source_word: וְ/י֥וֹב
  choice: 约伯
  rationale: 本节马所拉文本作יוֹב，采用通行人名“约伯”；《历代志上》7:1的异名“雅述”保留在脚注中。
- source_word: וְ/שִׁמְרֽוֹן
  choice: 和伸仑
  rationale: 人名采用通行音译“伸仑”，并将前置连接词וְ自然译为名单末项前的“和”。
theological_decisions: []
