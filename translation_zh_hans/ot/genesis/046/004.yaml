base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: zh_hans
  text: 我必亲自和你一同下到埃及去，也必亲自把你带上来；约瑟必把手放在你的眼睛上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按其惯用含义译作“约瑟必亲手为你合眼”，指约瑟会在雅各临终时陪伴在他身边。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: 我必亲自
  rationale: 独立人称代词在本节重复出现，带有强调意味；用“亲自”自然地保留这一强调。
- source_word: אֵרֵד עִמְּךָ מִצְרַיְמָה
  choice: 和你一同下到埃及去
  rationale: 保留“下到埃及”的方向性表达，同时以现代汉语自然呈现同行之意。
- source_word: וְאָנֹכִי אַעַלְךָ גַם עָלֹה
  choice: 也必亲自把你带上来
  rationale: “把你带上来”体现עלה使役式的含义；“必”传达不定式绝对形所加强的确定语气，“也”保留גם的附加意味。
- source_word: וְיוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: 必把手放在你的眼睛上
  rationale: 保留希伯来文具体而含蓄的意象，不在正文中直接改写为“为你合眼”；其死亡语境中的惯用含义由脚注说明。
theological_decisions:
- issue: “把你带上来”所指的应验方式
  choice: 保留宽泛表述，不限定为雅各本人活着返回、遗体归葬，或其后裔出埃及。
  alternative: 明确译作雅各遗体被带回迦南，或明确解释为其后裔将来出埃及。
  rationale: 希伯来文措辞简洁，可容纳不止一层应验；译文不应替原文消除这一张力。
- issue: 约瑟把手放在雅各眼睛上的含义
  choice: 正文保留字面意象，脚注说明通常指约瑟在雅各临终时亲自为他合眼。
  alternative: 正文直接译为“约瑟必亲手为你合眼”。
  rationale: 保留原文的具体表达，同时帮助现代读者理解其死亡语境中的惯用含义。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“我必亲自”保留重复独立代词的强调；“下到埃及”和“带上来”保留原文的空间方向意象。脚注标记置于整句相关意象之后。
