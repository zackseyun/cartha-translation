base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: zh_hans
  text: 以下是来到埃及的以色列家族成员的名字：雅各和他的儿子们。[a]雅各的长子是吕便。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以下是来到埃及的以色列家族成员的名字——雅各和他的儿子们。”
    reason: 原文“雅各和他的儿子们”紧接在迁往埃及者的说明之后；可用破折号而非冒号表达其紧缩的同位说明关系。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: וְ在此承接上下文并引出名单；现代汉语以“以下是”自然表达篇章推进和列名功能，不机械译出句首“和”。
- source_word: שְׁמוֹת
  choice: 名字
  rationale: 准确表达复数构造形式，并自然引出后续家谱名单。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 此处“以色列”是雅各的名字，语境随即列举其男性后裔；“众子”保留性别与家谱色彩。
- source_word: הַבָּאִים מִצְרַיְמָה
  choice: 来到埃及的
  rationale: 带冠词的分词作描述性成分；方向词尾表示朝向埃及，译为“来到埃及”符合现代汉语。
- source_word: יַעֲקֹב וּבָנָיו
  choice: 就是雅各和他的儿子们
  rationale: 将其理解为同位说明，用“就是”明确它对前语的解释关系，同时保留原文在“以色列众子”与“雅各和他的儿子们”之间略显紧缩的表达。
- source_word: בְּכֹר יַעֲקֹב
  choice: 雅各的长子
  rationale: 构造短语表示雅各的头生儿子；“长子”是自然且庄重的现代汉语表达。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用中文圣经传统中通行的人名译法，便于读者识别。
theological_decisions:
- issue: “以色列众子”与“雅各和他的儿子们”的关系
  choice: 以“就是”表达同位解释
  alternative: 将“雅各和他的儿子们”直接作为冒号后的名单开头
  rationale: 原文语法紧缩，יַעֲקֹב וּבָנָיו可视为对迁往埃及者的同位说明。译文不把它改写成新的神学命题，只使汉语关系清楚。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体。“以下是”自然引出名单；“众子”“长子”保留经文的家族与谱系色彩。脚注标记置于相关同位说明之后。
