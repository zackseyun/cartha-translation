revisions:
- from: 以下是来到埃及的以色列众子的名字，就是雅各和他的儿子们：[a]雅各的长子是吕便。
  to: 以下是来到埃及的以色列家族成员的名字：雅各和他的儿子们。[a]雅各的长子是吕便。
  rationale: 修订以“以色列家族成员”表达此处名单公式所涵盖的雅各及其儿子，避免将雅各误作“以色列的儿子”。冒号保留原文列举式引言；脚注提供不改变含义的同位说明式标点替代。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:27:26Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以“以色列的儿子们”引出迁埃名单，随后“雅各和他的儿子们”以紧缩的家族/名单说明方式出现。草稿将其译为“以色列众子，就是雅各和他的儿子们”，会使“雅各”被不自然地归入“以色列的众子”之内，造成指称矛盾。以“以色列家族成员”在汉语中可自然涵盖雅各及其儿子，并保留这是一份家族迁埃名单的含义。
  naturalness: “以色列众子”不合现代标准汉语的通常表达；“以下是……的名字”与“就是”连用也使同位关系生硬。改为“以色列家族成员……雅各和他的儿子们”更清楚、庄重且适合家谱叙述。
  terminology: “吕便”是通行的中文圣经人名译法，应保留；“长子”准确自然。为避免“以色列众子”与雅各同位时的逻辑问题，采用非性别标记的“以色列家族成员”仅限于这一紧缩的名单引言，不改变后续家谱中男性“儿子”的表述。
  issues:
  - severity: medium
    issue: “以色列众子，就是雅各和他的儿子们”产生指称冲突。
    rationale: “以色列”在此即雅各；若“以色列众子”严格指雅各的儿子，“就是雅各和他的儿子们”便把雅各列为自己的儿子。原文的紧缩名单公式需要在中文中以家族性表达消除此歧义。
  - severity: low
    issue: 脚注所述冒号替代方案没有消除正文的指称问题。
    rationale: 仅把“就是”改为冒号，仍会使“以色列众子”之后列出雅各本人；应同步调整正文及脚注的引导词。
  revised_text: 以下是来到埃及的以色列家族成员的名字：雅各和他的儿子们。[a]雅各的长子是吕便。
