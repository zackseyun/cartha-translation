  text: כָּל הַ֠/נֶּפֶשׁ הַ/בָּאָ֨ה לְ/יַעֲקֹ֤ב מִצְרַ֨יְמָ/ה֙ יֹצְאֵ֣י יְרֵכ֔/וֹ מִ/לְּ/בַ֖ד נְשֵׁ֣י בְנֵי יַעֲקֹ֑ב כָּל נֶ֖פֶשׁ שִׁשִּׁ֥ים וָ/שֵֽׁשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: zh_hans
  text: 凡属雅各、到埃及去的人，都是从他而出的后裔[a]；雅各众子的妻子不在其内，共六十六人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从他大腿出来的”，是指血缘后裔的习语。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文此处用“生命”（נֶפֶשׁ）计算人数；这里是指“人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: 凡……的人
  rationale: נֶפֶשׁ在家谱和计数语境中指一个个的人，而非专指与身体相对的“灵魂”；译为“人”符合现代汉语习惯。
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: 属雅各家、来到埃及
  rationale: לְיַעֲקֹב在这里表示与雅各的归属关系；“属雅各家”既保留这种关系，也避免把经文限定为仅指与他同时随行的人。מִצְרַיְמָה明确表示朝向埃及。
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: 他的后裔
  rationale: 原文直译为“从他大腿出来的”，是指亲生血缘后代的希伯来语习语；正文采用自然清楚的“后裔”，直译信息置于脚注。
- source_word: מִלְּבַד
  choice: 不包括
  rationale: 该词在此将雅各众子的妻子排除在六十六人的总数之外；“不包括”比“此外”更明确。
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: 雅各儿子的妻子
  rationale: 直接保留原文的属格关系，现代汉语表达清楚自然。
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: 共有六十六人
  rationale: 自然呈现原文的总数，并再次按计数语境将נֶפֶשׁ译为“人”。
