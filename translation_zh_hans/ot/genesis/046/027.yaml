base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: zh_hans
  text: 约瑟在埃及所生的儿子共有两人[a]。来到埃及的雅各全家共有七十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处用“נֶפֶשׁ”，字面可指“性命”或“人”；在家族人数统计中指个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: 约瑟……的儿子
  rationale: בְּנֵי 是复数构造形式；上下文明确指约瑟的两个儿子，因此译作“儿子”比泛称“儿女”更准确。句首连接词在中文中不必机械译出。
- source_word: אֲשֶׁר יֻלַּד לוֹ בְמִצְרַיִם
  choice: 在埃及所生的
  rationale: 保留 ילד 被动式“为他所生”的基本关系；现代汉语以“约瑟……所生的儿子”自然表达归属与出生关系，无须生硬补出“给他”。
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: 共两人
  rationale: נֶפֶשׁ 在家族统计语境中指个体的人，而非专指与身体相对的“灵魂”；“共两人”既体现计数，也符合现代汉语。
- source_word: כָּל הַנֶּפֶשׁ לְבֵית יַעֲקֹב
  choice: 雅各全家
  rationale: לְבֵית יַעֲקֹב 表示属于雅各家的人；结合 כָּל הַנֶּפֶשׁ，译作“雅各全家”自然保留家族整体的意义。
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: 来到埃及的
  rationale: 冠词加分词具有集合性修饰作用；מִצְרַיְמָה 的方向词尾表示“往埃及”，中文用“来到埃及”自然表达。
- source_word: שִׁבְעִים
  choice: 共七十人
  rationale: 原文为无动词的总数陈述；中文补出量词“人”并用“共”标明合计，清楚而不增加实质含义。
theological_decisions:
- issue: 家族人口统计中 נֶפֶשׁ 的译法
  choice: 人
  alternative: 灵魂／性命
  rationale: 本节是在统计雅各家的人数，并非陈述人由何种部分构成。译作“人”保留该词在此处的计数习语，也避免引入不属于本节的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。两个分句都用“共……人”呈现人口合计，并以脚注说明 נֶפֶשׁ 的字面范围及其在本节中的统计用法。
