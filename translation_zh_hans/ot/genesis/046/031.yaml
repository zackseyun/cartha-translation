base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: zh_hans
  text: 约瑟对他的弟兄们和他父亲的家人[a]说：“我要上去禀报法老，并对他说：‘我的弟兄们和我父亲的家人，就是原在迦南地的，已经来到我这里。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他父亲的家”；希伯来语“他父亲的家”在这里指父亲所属的家庭群体，并非仅指住所。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出连接词 וַ，以自然的现代汉语叙事承接上下文；动词准确表达约瑟开口说话。
- source_word: אֶל אֶחָיו
  choice: 对他的弟兄们
  rationale: אַחַים 在本语境中指约瑟的男性兄弟；“弟兄们”准确且符合庄重的经文语体。
- source_word: וְאֶל בֵּית אָבִיו
  choice: 和他父亲全家
  rationale: בֵּית אָבִיו 在这里指父亲所属的家庭群体，而非实体房屋；“全家”自然传达这一集合意义。
- source_word: אֶעֱלֶה
  choice: 我要上去
  rationale: 保留 עלה 的方向性“上去”；第一人称意愿形式在汉语中自然译为“我要”。
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: 禀报法老
  rationale: נגד 的使役词干表示告知、报告；面对君王时，“禀报”既体现宫廷语境，也保持现代读者可懂。
- source_word: וְאֹמְרָה אֵלָיו
  choice: 对他说
  rationale: 明确保留向法老陈说的动作；汉语无需重复“我要”也能延续前面的意向。
- source_word: אַחַי וּבֵית אָבִי
  choice: 我的弟兄们和我父亲全家
  rationale: 分别保留“我的”与“我父亲”的所属关系，并与本节前半句的家庭用语一致。
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: 从迦南地
  rationale: 希伯来文关系从句没有明说系词，字面可理解为“在迦南地的”；结合后面的移动动词，现代汉语以“从迦南地到我这里”自然表达先前所在地及来向，同时不增添实质信息。
- source_word: בָּאוּ אֵלַי
  choice: 到我这里来了
  rationale: 完成式表示已经发生且与当前有关的到来；“来了”自然表达这一完成及现时相关性。
