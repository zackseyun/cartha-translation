  text: אֵ֚לֶּה בְּנֵ֣י רָחֵ֔ל אֲשֶׁ֥ר יֻלַּ֖ד לְ/יַעֲקֹ֑ב כָּל נֶ֖פֶשׁ אַרְבָּעָ֥ה עָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/022.yaml
  text: 'These were the sons of Rachel who were born to Jacob: fourteen persons in all[a].'
translation:
  language: zh_hans
  text: 这些是拉结给雅各所生的儿子，共十四人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“所有的人，共十四”；这里是表示总人数的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 作为家谱名单后的总结语；希伯来语为指示代词，汉语用“这些是”自然承接上文。
- source_word: בְּנֵי רָחֵל
  choice: 拉结……的儿子
  rationale: בְּנֵי直译为“儿子”；保留原文的性别表达和家谱用语，不扩展为“儿女”或“后裔”。
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: 给雅各所生的
  rationale: יֻלַּד是ילד的被动式，לְיַעֲקֹב表示亲子归属关系；现代汉语“给雅各所生的”既自然，也保留被动关系。
- source_word: כָּל נֶפֶשׁ
  choice: 共……人
  rationale: נֶפֶשׁ在家谱计数语境中指人；“共……人”准确表达总数，避免把它误解为专指非物质的“灵魂”。
- source_word: אַרְבָּעָה עָשָׂר
  choice: 十四
  rationale: 按原文基数词直接翻译。
