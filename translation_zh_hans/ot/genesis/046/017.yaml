base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: zh_hans
  text: 亚设的儿子是音拿[a]、亦施瓦、亦施韦和比利亚，以及他们的姐妹西拉[b]。比利亚的儿子是希别和玛结。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “音拿”也可按希伯来语音译为“伊姆拿”。
    reason: lexical_alternative
  - marker: b
    text: “西拉”也可按希伯来语音译为“塞拉赫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: 亚设的儿子是
  rationale: בְנֵי是“儿子”的复数构造形式；在家谱中直译为“……的儿子”。句首的连接词不必机械译出，以符合现代汉语列举方式。
- source_word: יִמְנָה
  choice: 音拿
  rationale: 采用现代中文圣经读者较熟悉的专名译法；原文是男性人名Yimnah。
- source_word: וְיִשְׁוָה
  choice: 亦施瓦
  rationale: 按希伯来语专名音译，并以汉语列举结构表达前置连接词。
- source_word: וְיִשְׁוִי
  choice: 亦施韦
  rationale: 按希伯来语专名音译，同时与前一人名亦施瓦保持区分。
- source_word: וּבְרִיעָה
  choice: 和比利亚
  rationale: 专名按惯用形式音译；连接词译作“和”，标示名单最后一项。
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: 以及他们的姐妹西拉
  rationale: אֲחֹתָם直指“他们的姐妹”。用“姐妹”而不用“妹妹”，避免原文未说明的长幼关系；保留其作为名单附加说明的结构。
- source_word: וּבְנֵי בְרִיעָה
  choice: 比利亚的儿子是
  rationale: 开启下一层家谱名单；汉语另起一句即可自然承接，无须机械译出句首连接词。
- source_word: חֶבֶר
  choice: 希别
  rationale: 采用该希伯来专名的惯用中文音译。
- source_word: וּמַלְכִּיאֵל
  choice: 和玛结
  rationale: 采用惯用中文音译，并译出连接词以连接两个人名。
theological_decisions: []
