base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: zh_hans
  text: 以色列对约瑟说：“现在我可以死了，因为我已经见到你的面了，知道你还活着。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式对应地可译：“现在我可以死了；在我见到你的面之后，因为你仍然活着。”希伯来文措辞紧凑：其中“在……之后”带有时间关系，而“因为”说明使这句话成立的事实；主文以自然的汉语表达亲眼相见所确认的事实。
    reason: 保留אַחֲרֵי的时间关系及כִּי的事实说明／因果功能，并说明主文的自然表达。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语按上下文自然承接，无须机械译出“于是”。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文明确使用“以色列”，因此不改作“雅各”。
- source_word: אָמֻתָה / אָמוּתָה
  choice: 我可以死了
  rationale: 第一人称祈愿式在此表达说话者如今已能安然面对死亡的心愿或释然，并非向约瑟请求准许他死；“可以死了”自然传达这一语用含义，同时避免过度增译为“死而无憾”。
- source_word: הַפָּעַם
  choice: 现在
  rationale: 字面可作“这一次”，此处指长久哀痛之后的当前时刻；“现在”符合现代汉语表达。
- source_word: אַחֲרֵי רְאוֹתִי
  choice: 因为我已经见到
  rationale: 结构字面为“在我见到……之后”；在语境中兼有时间和理由的作用，主文以“因为……已经”自然呈现其因果—时间关系。
- source_word: אֶת־פָּנֶיךָ
  choice: 你的面
  rationale: 保留原文“你的脸/面”的具体意象；“见到你的面”语体庄重，也比单译“见到你”更贴近希伯来文。
- source_word: כִּי
  choice: 知道
  rationale: 原词可引出原因或所确认的事实。主文用“知道”明确表达见面所证实的事实，但脚注保留更形式对应的读法。
- source_word: עוֹדְךָ חָי
  choice: 你还活着
  rationale: עוֹד与代词后缀及“活着”共同表达生命状态仍在持续；“还活着”是自然准确的现代汉语。
theological_decisions:
- issue: 雅各面对死亡之话的语气
  choice: 译作“我可以死了”，表达释然和已准备好面对死亡
  alternative: “让我死吧”或“我要死了”
  rationale: 祈愿式带有意愿色彩，但上下文不是求死、预言立即死亡或请求许可；所选译法保留情感力度而不引入额外神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“见到你的面”略带经文语体，以保留原文意象；其余措辞避免古奥。
