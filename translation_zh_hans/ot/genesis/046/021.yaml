base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: zh_hans
  text: 便雅悯的儿子是比拉、比结[a]、亚实别、基拉、乃幔、以希[b]、罗实、母平[c]、户平和亚勒[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比结”所对应的希伯来名字是 בֶּכֶר，也可按读音译作“贝凯尔”。
    reason: lexical_alternative
  - marker: b
    text: 民数记26:38的便雅悯支派平行家谱在相应位置记作“亚希兰”；本节的希伯来文本作“以希”。
    reason: cross_reference
  - marker: c
    text: 一些平行家谱传统在相应位置有“书平”等异名；本译文在此依照马所拉文本作“母平”。
    reason: textual_variant
  - marker: d
    text: 历代志上8:3的便雅悯家谱有相关名字形式“亚大”；本节的希伯来文本作“亚勒”。
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: 便雅悯的儿子是
  rationale: וּבְנֵי 是“儿子们”一词的复数构造形式，前有连接词；中文家谱列名以“……的儿子是”自然承接上下文，无须机械译出句首连接词。
- source_word: בֶּלַע
  choice: 比拉
  rationale: 专名；采用现代中文圣经读者熟悉的传统音译。
- source_word: בֶּכֶר
  choice: 比结
  rationale: 专名；采用通行中文音译，并在脚注说明更贴近希伯来语读音的另一种音译方式。
- source_word: אַשְׁבֵּל
  choice: 亚实别
  rationale: 专名；采用通行中文音译。
- source_word: גֵּרָא
  choice: 基拉
  rationale: 专名；采用通行中文音译。
- source_word: נַעֲמָן
  choice: 乃幔
  rationale: 专名；采用通行中文音译。
- source_word: אֵחִי
  choice: 以希
  rationale: 按本节马所拉文本的专名音译，不以平行家谱中的“亚希兰”替换。
- source_word: רֹאשׁ
  choice: 罗实
  rationale: 此处位于人名列表中，应作专名音译，不译为普通名词“头”或“首领”。
- source_word: מֻפִּים
  choice: 母平
  rationale: 按本节马所拉文本的专名形式音译；平行家谱中的异名保留在脚注。
- source_word: חֻפִּים
  choice: 户平
  rationale: 专名；采用通行中文音译。
- source_word: אָרְדְּ
  choice: 亚勒
  rationale: 按本节马所拉文本的专名音译，不以平行家谱中的相关名字形式替换。
