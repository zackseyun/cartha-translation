  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: zh_hans
  text: 以色列带着他所有的一切出发，来到别是巴，并向他父亲以撒的上帝献祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 启程
  rationale: נסע在叙事中常指拔营出发；“启程”自然简洁，保留开始行程的含义。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文使用“以色列”而非“雅各”，因此保留叙事中的称名选择。
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: 带着一切所有的
  rationale: 该短语范围宽泛，可包括家属、仆从与财物；此译法不把所指局限为物质财产。
- source_word: וַיָּבֹא בְּאֵרָה שָּׁבַע
  choice: 来到别是巴
  rationale: בוא结合表示方向的形式，宜自然译为“来到别是巴”。
- source_word: וַיִּזְבַּח זְבָחִים
  choice: 献祭
  rationale: 希伯来语同根动词与宾语的结构用现代汉语“献祭”即可自然表达，无须生硬重复。
- source_word: לֵאלֹהֵי אָבִיו יִצְחָק
  choice: 向他父亲以撒的上帝
  rationale: ל表示献祭的对象；原文明确只提以撒，故不扩展为“列祖的上帝”。
theological_decisions:
- issue: 原文称上帝为“他父亲以撒的上帝”
  choice: 保留这一特指称谓
  alternative: 他列祖的上帝
  rationale: 希伯来文明确点名以撒，可能呼应以撒与别是巴的关联；翻译不应将单数泛化为列祖。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“以色列”这一原文称名，并以宽泛措辞涵盖同行家属与所有物。
