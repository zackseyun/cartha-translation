base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: zh_hans
  text: 约瑟套好车，往歌珊去迎接他父亲以色列。他出现在父亲面前[a]，就扑到父亲颈项上，伏在那里哭了许久[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他让父亲看见自己”或“他向父亲现身”。原文动词着重于约瑟出现在父亲眼前。
    reason: lexical_alternative
  - marker: b
    text: “许久”所译的希伯来词也可译作“仍旧”或“继续”；在这里表示约瑟持续哭泣。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר ... מֶרְכַּבְתּוֹ
  choice: 套好车
  rationale: אָסַר本义为“捆绑、系住”；以“车”为宾语时，指把牲畜套上、将车备妥。“套好车”既保留原文的具体动作，也符合现代汉语习惯。
- source_word: וַיַּעַל ... גֹּשְׁנָה
  choice: 往歌珊去
  rationale: עלה常指“上去”，而גֹּשְׁנָה带方向词尾，表示朝歌珊而去。汉语若译“上歌珊去”容易产生不必要的地势含义，因此按叙事语境自然表达为“往歌珊去”。
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו
  choice: 迎接他父亲以色列
  rationale: לִקְרַאת表示前去相会或迎接；原文使用“以色列”这一名字，并以“他父亲”说明身份，译文两者均予保留。
- source_word: וַיֵּרָא אֵלָיו
  choice: 他出现在父亲面前
  rationale: ראה的尼法勒式在这里表示让对方看见、出现在对方面前。“出现”贴近原文，同时避免“显现”在现代中文中可能带来的超自然意味；将代词明确为“父亲”，可免汉语歧义。
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: 扑到父亲颈项上
  rationale: 直译为“落在他的颈项上”，是形容激动相拥的希伯来语表达。“扑到……颈项上”保留动作的力度与画面感，又不把原文完全释义成“拥抱”。
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  choice: 伏在那里哭了许久
  rationale: 原文重复“在他的颈项上”，并以עוֹד延展哭泣的持续时间。汉语用“伏在那里”承接前句，既避免生硬重复，也保留约瑟仍伏在父亲颈项上哭泣的画面。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“颈项”比“脖子”略显典雅，适合经文语体；通过重复“父亲”澄清希伯来语代词所指，同时保留重逢场面的动作和情感强度。
