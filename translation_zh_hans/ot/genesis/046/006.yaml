  to: 他们带着自己的牲畜和在迦南地所得的财物，来到埃及；雅各和他所有的后裔[a]都与他一同前来。
  rationale: 仅将“在迦南地置办的财物”改为“在迦南地所得的财物”，以避免将原文宽泛的“取得”限缩为购置或筹办；同时作轻微标点和措辞调整，使中文叙事更自然。其余译法忠实且合乎现代标准汉语。
