  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: zh_hans
  text: 他们带着自己的牲畜和在迦南地所得的财物，来到埃及；雅各和他所有的后裔[a]都与他一同前来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“子孙”或“后代”。希伯来语原词本义为“种子”，也可指一个人的儿女、后代或后裔。
    reason: 说明זֶרַע的词义范围，并保留可译作“子孙”或“后代”的可能性。
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 他们带着
  rationale: 该词是לקח的叙事性未完成式，基本义为“拿、带”。本节描写迁往埃及时随身带走牲畜和财物，译作“带着”符合现代汉语表达，并保留行动的伴随关系。
- source_word: מִקְנֵיהֶם
  choice: 牲畜
  rationale: מִקְנֶה泛指人所拥有的家畜，不限于牛群；“牲畜”范围适当，也符合迁徙语境。
- source_word: רְכוּשָׁם
  choice: 财物
  rationale: רְכוּשׁ指所得的产业、物品或可携带的家产；“财物”自然简洁，并与前面的“牲畜”有所区分。
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: 在……置办的
  rationale: רכש表示取得、积聚财物；“置办”在此指他们先前在迦南地取得并积累的财产，既体现先于迁徙的行动，又符合现代汉语。
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: 在迦南地
  rationale: 保留אֶרֶץ“地”的明确地理表述，译为传统且清楚的“迦南地”。
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: 来到埃及
  rationale: בוא配合מִצְרַיְמָה的方向词尾，表示向埃及移动；“来到埃及”不额外限定为越过边境。
- source_word: יַעֲקֹב וְכָל־זַרְעוֹ אִתּוֹ
  choice: 雅各和他所有的后裔都与他同来
  rationale: זֶרַע在此指雅各的家族后代。“后裔”涵盖随行的儿女及后代；“与他同来”保留אִתּוֹ所表达的陪同关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。破折号表明后半句“雅各和他所有的后裔”是对前面“他们”的具体说明，避免误读为另一批人；不在中文中机械保留希伯来语连续叙事连接词。
