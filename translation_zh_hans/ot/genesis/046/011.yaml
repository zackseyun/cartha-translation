  yaml_path: translation/ot/genesis/046/011.yaml
  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: zh_hans
  text: 利未的儿子是革顺、哥辖和米拉利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 的儿子是
  rationale: בְנֵי是复数构造式，意为“……的儿子”；在中文家谱名单中以“的儿子是”自然引出后列人名。句首ו承接上文名单，中文无需机械译作“和”，以免表达生硬。
- source_word: לֵוִי
  choice: 利未
  rationale: 采用现代中文圣经中通行且易识别的人名音译。
- source_word: גֵּרְשׁוֹן
  choice: 革顺
  rationale: 此处希伯来文为גֵּרְשׁוֹן，采用通行音译“革顺”，并与相近但不同的名字“革舜”相区别。
- source_word: קְהָת
  choice: 哥辖
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וּ/מְרָרִי
  choice: 和米拉利
  rationale: 将前缀ו译为列举末项前自然的连词“和”；מְרָרִי采用通行音译“米拉利”。
