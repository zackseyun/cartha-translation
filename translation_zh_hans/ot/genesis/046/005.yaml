revisions:
- from: 雅各从别是巴出发[a]。以色列的儿子们让父亲雅各和他们的孩子、妻子坐上法老派来接他的车。
  to: 雅各从别是巴动身[a]。以色列的儿子们用法老派来载他的车，载着他们的父亲雅各、他们幼小的孩子和妻子。
  rationale: 修订恢复了“儿子们载运”的明确动作，并将法老所差车辆的目的准确译为“载他”，同时保留“他”对雅各的自然指向。车辆译为“车”可行；“用……车，载着……”清楚表达众人乘车迁行，而不引入现代交通工具含义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:27:26Z'
review_pass:
  verdict: revise
  source_fidelity: 原文第二分句的动词 וַיִּשְׂאוּ 是“载、运送”，并明确说明三类人是在法老所差的车辆中被运载。草稿的“让……坐上……车”弱化了儿子们实际载运的动作；“来接他的”则把 לָשֵׂאת אֹתוֹ（“为载他”）改成了“接他”，不够准确。
  naturalness: 草稿整体通顺，但“让父亲雅各和他们的孩子、妻子坐上……车”虽自然，未充分表达叙事动作。改为“用……车，载着……”既是自然现代汉语，也更贴近原文句法和语义。
  terminology: “别是巴”“雅各”“以色列”“法老”均合适。“以色列的儿子们”准确保留此处对雅各男性子嗣的指称。“幼小的孩子”较“孩子”更能体现 טַף 的幼小家属／小孩子语义。
  issues:
  - severity: medium
    issue: “让……坐上法老派来接他的车”没有明确译出“载运”，并把“为载他”译作“来接他”。
    rationale: וַיִּשְׂאוּ 意为“载、运送”；לָשֵׂאת אֹתוֹ 是目的不定式“为要载他”，其中单数“他”最自然指雅各。“接”可指迎接而未必载送，且使役“让……坐上”弱化了原文动作。
  - severity: low
    issue: “他们的孩子”未体现 טַפָּם 所含的幼小者意味。
    rationale: “孩子”并非错误，但“幼小的孩子”能更清楚保留该词通常指小孩子、幼小家属的语义，同时保持自然。
  revised_text: 雅各从别是巴动身[a]。以色列的儿子们用法老派来载他的车，载着他们的父亲雅各、他们幼小的孩子和妻子。
  revised_footnotes:
  - marker: a
    text: “动身”直译为“起来”；在旅行的语境中，这个词表示动身离开。
    reason: lexical_alternative
  revision_rationale: 修订恢复了“儿子们载运”的明确动作，并将法老所差车辆的目的准确译为“载他”，同时保留“他”对雅各的自然指向。车辆译为“车”可行；“用……车，载着……”清楚表达众人乘车迁行，而不引入现代交通工具含义。
