base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: zh_hans
  text: 雅各从别是巴动身[a]。以色列的儿子们用法老派来载他的车，载着他们的父亲雅各、他们幼小的孩子和妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “动身”直译为“起来”；在旅行的语境中，这个词表示动身离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 出发
  rationale: 该动词本义为“起来”，但与“从别是巴”连用并处于迁行叙事中，惯用义是动身、启程；“出发”自然准确。
- source_word: מִבְּאֵר שָׁבַע
  choice: 从别是巴
  rationale: 保留介词“从”，地名采用现代中文圣经中通行的译名“别是巴”。
- source_word: וַיִּשְׂאוּ
  choice: 让……坐上……车
  rationale: נשׂא 本义是抬、载、运送；因后文明确提到车辆，中文用使役结构可自然表达儿子们用车载人的情景，同时避免误解为亲手抱抬。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列的儿子们
  rationale: 此处“以色列”指雅各，短语具体指他的男性子嗣；直译为“儿子们”保留原文所指，避免泛化成全体以色列人。
- source_word: אֶת יַעֲקֹב אֲבִיהֶם
  choice: 父亲雅各
  rationale: 以自然中文重组“雅各，他们的父亲”，明确雅各与这些儿子的父子关系。
- source_word: טַפָּם
  choice: 他们的孩子
  rationale: טַף 常指幼小的孩子，也可涵盖随行的幼年家属；“孩子”在现代中文中自然且不过度限定年龄。
- source_word: נְשֵׁיהֶם
  choice: 他们的妻子
  rationale: 家庭迁徙语境中明确指儿子们的妻子。
- source_word: בָּעֲגָלוֹת
  choice: 坐上……车
  rationale: עֲגָלוֹת 指用于载运的车或车辆；“车”在古代叙事语境中简洁自然，并不暗示现代机动车。
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: 法老派来的
  rationale: 关系从句修饰车辆；“派来的”在中文中自然表达法老预先送来这些车。
- source_word: לָשֵׂאת אֹתוֹ
  choice: 来接他的
  rationale: 原文直义为“为要载他”，单数代词最自然地指雅各；在差遣车辆的语境中，“接他”既表达目的，也保留车辆载送之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以色列的儿子们”有意保留原文中“以色列”作为雅各之名以及“儿子”的具体性。将车辆表述为“车”，符合现代汉语古代叙事习惯；“接他”自然呈现车辆被派来载雅各的目的。
