  text: אֵ֣לֶּה בְּנֵ֣י לֵאָ֗ה אֲשֶׁ֨ר יָֽלְדָ֤ה לְ/יַעֲקֹב֙ בְּ/פַדַּ֣ן אֲרָ֔ם וְ/אֵ֖ת דִּינָ֣ה בִתּ֑/וֹ כָּל נֶ֧פֶשׁ בָּנָ֛י/ו וּ/בְנוֹתָ֖י/ו שְׁלֹשִׁ֥ים וְ/שָׁלֹֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: zh_hans
  text: 这些是利亚在巴旦亚兰为雅各所生的儿子，以及雅各的女儿底拿。雅各的儿女共三十三人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: 利亚……所生的儿子
  rationale: בְּנֵי明确为“儿子”，是家谱式标题；虽然后文另提底拿，仍不宜泛化为“儿女”或“后代”。
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: 利亚……给雅各所生的
  rationale: 女性主语下的יָלַד表示“生育”；此译保留母亲生育以及לְ所表达的关系，同时符合现代汉语。
- source_word: בְּפַדַּן אֲרָם
  choice: 在巴旦亚兰
  rationale: 这是地名，采用通行音译，不按字面释为某种地貌。
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: 还有他的女儿底拿
  rationale: “还有”自然表达וְאֵת在家谱列举中的补充作用；“他的”依原文指雅各，不把底拿混入前面的“儿子”这一标题。
- source_word: כָּל נֶפֶשׁ
  choice: 共……人
  rationale: נֶפֶשׁ在人口统计语境中指人或人数，不是神学意义上的“灵魂”；“共……人”简洁传达总数。
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: 雅各的儿女
  rationale: 原文分别说“他的儿子和他的女儿”；汉语“儿女”自然涵盖两者。为避免代词指向含混，将“他的”明示为“雅各的”。
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: 三十三人
  rationale: 按原文直译基数，并用量词“人”配合人口总数的语境。
theological_decisions:
- issue: נֶפֶשׁ是否译作“灵魂”
  choice: 按人口统计习语译为“人”
  alternative: 灵魂
  rationale: 本节是在统计家族成员总数；译作“灵魂”会不必要地引入灵魂论含义，而原文在此并无此意。
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“巴旦亚兰”沿用简体中文圣经地名惯例；末句以“雅各的儿女共三十三人”表达希伯来语统计习语，并避免生硬照搬“所有的人数”。
