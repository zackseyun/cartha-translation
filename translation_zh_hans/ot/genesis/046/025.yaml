  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: zh_hans
  text: 这些是辟拉的儿子；拉班把辟拉给了他的女儿拉结。辟拉为雅各生了这些儿子，共七人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“所有的生命（或：人），七个”，是表示总共有七人的说法。
    reason: 说明נֶפֶשׁ在本节人口统计语境中的习语用法，并保留其较直译的表达。
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: 这些是辟拉的儿子
  rationale: 按希伯来文的指示代词与系属结构直译，并依据本段家谱所列男性后代采用“儿子”。
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: 辟拉是拉班给他女儿拉结的
  rationale: 关系从句指向辟拉；改用自然的现代汉语独立句，清楚保留拉班、女儿拉结和“给”的关系。
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: 她为雅各生了这些人
  rationale: “她”承接辟拉；לְיַעֲקֹב在生育公式中表达父亲关系，译作“为雅各生了”自然且不增添解释。
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: 共七人
  rationale: נֶפֶשׁ在人口统计语境中指人；“共七人”准确传达希伯来语总数表达，避免将其机械译为“灵魂”。
