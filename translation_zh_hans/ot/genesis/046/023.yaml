  text: 但的儿子们：户伸[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文十分简略，直译为“但的儿子们：户伸”。“儿子们”虽为复数，“户伸”却是一个人名；在这份家谱中，他也是但唯一列出的后代。
    reason: 说明原文复数形式与单一专名并列的特殊表达。
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: ……的儿子
  rationale: בְנֵי是“儿子”的复数附属形；在家谱语境中译作“……的儿子”最为贴切。连接词וּ在中文连续列举中无需机械译作“和”，以免行文生硬。
- source_word: דָן
  choice: 但
  rationale: 人名按现代中文圣经通行译名处理。
- source_word: חֻשִׁים
  choice: 户伸
  rationale: 此处作人名；尽管其词形看似复数，句法和家谱语境均将其作为一个专名。采用现代中文圣经中较通行的音译“户伸”，并保留原文简短、无动词的表达。
theological_decisions:
- issue: 复数“儿子”与单一人名“户伸”之间的不协调
  choice: 正文保留“儿子”的复数形式及单一人名，不补写解释性动词或改为单数
  alternative: 译作“但的儿子是户伸”或“但有一个儿子，名叫户伸”
  rationale: 希伯来原文确用复数בְנֵי，却只列出חֻשִׁים；保留这种张力可避免把文本中未明说的信息写入正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留家谱条目的省略式结构。连接词不机械直译，以符合中文列举习惯；脚注解释原文的词形张力。
