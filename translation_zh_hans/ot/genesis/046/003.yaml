base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: zh_hans
  text: 他说：“我是神，是你父亲的神。不要怕下到埃及去，因为我必在那里使你成为大国。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: 神
  rationale: 原文带定冠词，在自我宣告中强调说话者的身份；汉语“我是神”自然、庄重，无须生硬译作“那位神”。
- source_word: אֱלֹהֵי אָבִיךָ
  choice: 你父亲的神
  rationale: 直接保留单数“父亲”和原文的属格关系，体现神以雅各之父的神这一身份向他显现。
- source_word: אַל תִּירָא מֵרְדָה
  choice: 不要怕下……去
  rationale: 原文是“惧怕”加带介词的动词不定式；此译法既保留“怕”的表达，也自然传达“不要因下去而害怕”。
- source_word: מִצְרַיְמָה
  choice: 埃及
  rationale: 词尾表示趋向；与“下……去”组合为“下埃及去”，清楚表达目的地。
- source_word: לְגוֹי גָּדוֹל אֲשִׂימְךָ
  choice: 使你成为大国
  rationale: שׂים 与 לְ 构成结果性表达，意为使雅各成为一个大民族；“大国”承接《创世记》应许语境，且简洁庄重。
- source_word: שָׁם
  choice: 在那里
  rationale: 明确指向埃及，保留神将在该地实现应许的地点重点。
theological_decisions:
- issue: 神自我表明为“你父亲的神”
  choice: 保留单数“你父亲”
  alternative: 译作“你祖先的神”或“你列祖的神”
  rationale: 希伯来文 אָבִיךָ 为单数；不将其扩展为复数，可保留神在此对雅各所作的直接家族与圣约身份确认。
- issue: “使你成为大国”中的“你”
  choice: 保留单数“你”，不显性改写为“你的后裔”
  alternative: 使你的后裔成为大国
  rationale: 原文受词是雅各本人，虽在语境中包含其后裔形成民族的含义，正文仍应保留原文以个人代表群体的表达及其张力。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“下埃及去”保留希伯来叙事中的地理方向表达；句式简明，适合公开诵读。
