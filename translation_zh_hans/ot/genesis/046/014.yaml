lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 的儿子是
  rationale: בְנֵי是“儿子”的复数构造形式；本节承接家谱名单，现代汉语以“的儿子是”自然表达所属关系及列举结构。句首וּ所表示的承接关系由上下文和名单体裁体现，不机械译作“和”。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 人名按现代中文圣经中通行的译名音译。
- source_word: סֶרֶד
  choice: 西烈
  rationale: 人名音译；采用现代中文圣经中较通行的形式。
- source_word: וְ/אֵלוֹן
  choice: 以伦
  rationale: 此处是人名，不按同形普通名词“橡树”翻译；前缀וְ作为名单中的连接关系处理。
- source_word: וְ/יַחְלְאֵל
  choice: 雅利
  rationale: 人名音译；末项前的וְ译作“和”。希伯来语形式也可用更贴近字母对应的方式音译。
