  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: zh_hans
  text: 你们就要说：‘你的仆人从年轻时起直到如今，一直以牲畜为业；我们和我们的父辈都是如此。’这样，你们就可以住在歌珊地，因为埃及人都厌恶[a]凡牧放羊群的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厌恶”也可译作“视为可憎”。
    reason: 保留 תוֹעֵבָה 较强烈且可能涉及礼俗或宗教禁忌的语义幅度。
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: 你们就要说
  rationale: 承接约瑟前面的吩咐，既表达顺序，也保留指示语气。
- source_word: אַנְשֵׁי מִקְנֶה
  choice: 以牲畜为业
  rationale: 自然表达从事畜牧、照管牲畜之意，同时不把范围缩窄为某一种牲畜。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 这是臣民在法老面前谦称自己的宫廷用语，并非着重说明奴隶身份。
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: 从幼年直到如今
  rationale: 准确保留从早年延续到现在的时间跨度。
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: 我们如此，我们的祖先也如此
  rationale: 保留重复 גַּם 所强调的两代共同情形；“祖先”在现代汉语中比直译“父辈”更适合此处的世代延续含义。
- source_word: בַּעֲבוּר תֵּשְׁבוּ
  choice: 这样，你们就可以住
  rationale: בַּעֲבוּר 在这里引出约瑟安排这番回答的目的或预期结果；“住”自然表达定居含义。
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: 在歌珊地
  rationale: 保留 אֶרֶץ，并采用现代中文圣经地名的通行表达。
- source_word: כִּי תוֹעֲבַת מִצְרַיִם
  choice: 因为……埃及人都厌恶
  rationale: 将希伯来语名词性结构自然转为汉语谓语，同时保留强烈的排斥意味；“埃及”按语境指埃及人。
- source_word: כָּל רֹעֵה צֹאן
  choice: 凡牧放羊群的
  rationale: 明确保留 צֹאן 所指的羊群或小牲畜群，也避免把 רֹעֵה 机械处理成不够自然的名词结构。
theological_decisions:
- issue: תוֹעֵבָה 的强度与宗教色彩
  choice: 正文译作“厌恶”
  alternative: “视为可憎”或“是可憎之物”
  rationale: 此处描述埃及人对牧羊者的社会性排斥，正文采用自然而强烈的现代汉语；脚注保留更贴近名词结构、也可能带有礼俗或宗教色彩的译法，避免将含义单一定死。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。对法老的谦称译为“你的仆人”；引语保持口头陈述的自然节奏。正文仅设置一个确有文本依据的词义脚注，标记已在正文相应位置出现。
