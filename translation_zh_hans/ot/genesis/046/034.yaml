  terminology: “你的仆人”恰当地保留了向法老自称的谦卑宫廷语体；“歌珊地”符合通行地名；“牲畜为业”未不当地限缩原文的 livestock 范围。“厌恶”可表达原文强烈排斥，脚注所列“视为可憎”可保留其名词性及较强语气。
