base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: zh_hans
  text: 犹大的儿子是珥、俄南、示拉、法勒斯和谢拉。珥和俄南死在迦南地。法勒斯的儿子是希斯仑和哈母勒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: 犹大的儿子是
  rationale: בְנֵי 是“儿子”的复数构造形式，前缀 וְ 承接上文。中文用“犹大的儿子是”自然引出名单；不另译句首连接词，仍保留家谱的连续性。
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: 珥、俄南、示拉、法勒斯和谢拉
  rationale: 按现代中文圣经中较通行的人名形式音译，并以中文列举方式处理希伯来语重复的连接词；“示拉”和“谢拉”分别对应 שֵׁלָה 与 זָרַח，避免混同。
- source_word: וַיָּמָת עֵר וְאוֹנָן
  choice: 珥和俄南死了
  rationale: 希伯来语动词虽为单数形式，却置于并列主语“珥和俄南”之前，这是常见句法；中文动词不标单复数，直接译出两人死亡即可。正文依中文叙事习惯采用“珥和俄南死在迦南地”。
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: 在迦南地
  rationale: 保留原文 אֶרֶץ（地、土地），译作中文惯用地名“迦南地”。
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: 法勒斯的儿子是
  rationale: 在家谱语境中，היה 用于引出并确认儿子名单；译为“是”比“成为”准确自然。
- source_word: חֶצְרוֹן וְחָמוּל
  choice: 希斯仑和哈母勒
  rationale: 采用现代中文圣经中较通行的人名音译。
theological_decisions:
- issue: 第二句连接关系
  choice: 不显式译作“但”
  alternative: 但珥和俄南死在迦南地
  rationale: 原文仅有叙事连接词 וַ，不必然标示转折。中文另起一句即可自然表达名单之后补述两人死亡，也避免添加原文未明确限定的逻辑关系。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留家谱式列举结构。人名使用中文读者较熟悉的传统圣经译名；原文动词单数与并列主语的现象在中文中不会造成数的一致问题，因此无需脚注。
