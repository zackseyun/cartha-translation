base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: zh_hans
  text: 上帝在夜间的异象中向以色列说[a]：“雅各，雅各！”他说：“我在这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在夜间的异象中。”原文“异象”为复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 讲话，说／回答
  rationale: אָמַר的基本义是“说”。前两个连续形式合起来引出上帝的话，译为“讲话，说”既保留原文两个动词，又符合现代汉语表达；最后一个按对话关系译为“回答”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的上帝，语境中的动词也是单数用法。
- source_word: לְיִשְׂרָאֵל
  choice: 对以色列
  rationale: 叙述明确使用“以色列”，随后呼唤时却使用“雅各”；译文保留这一名称转换，不作统一。
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: 在夜间的异象中
  rationale: מַרְאוֹת是“异象”的复数形式，הַלַּיְלָה限定其夜间背景。现代汉语名词通常不标示单复数，因此这样译自然，也不排除多个异象。
- source_word: יַעֲקֹב יַעֲקֹב
  choice: 雅各！雅各！
  rationale: 完整保留名字的重复，用感叹号自然表达直接而郑重的呼唤。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: 这是表示在场、留心并愿意回应的惯用答语；“我在这里”在现代汉语中自然且贴切。
theological_decisions:
- issue: “以色列”与“雅各”两个名称的交替
  choice: 叙述中保留“以色列”，上帝呼唤时保留“雅各”
  alternative: 全文统一使用“雅各”或“以色列”
  rationale: 名称转换直接见于希伯来文本，可能具有文学和神学意味；译文不将其协调一致，也不在正文中替它作解释。
- issue: 夜间异象的单复数
  choice: 译作“夜间的异象”，不在汉语中强加数量词
  alternative: 译作“夜间的众异象”或“一个夜间异象”
  rationale: 希伯来文使用复数，但现代汉语“异象”本身可作数量未明的集合性表达；加入“众”显得生硬，译成“一个”则会抹去原文复数。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“讲话，说”避免生硬的“说……又说”，同时尽量体现原文连续两个וַיֹּאמֶר；“回答”清楚呈现雅各的回应。专名采用简体中文圣经语境中通行的“上帝、以色列、雅各”。
