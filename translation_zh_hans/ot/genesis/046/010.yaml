  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: zh_hans
  text: 西缅的儿子是耶母利、雅悯、阿辖、雅斤、琐辖和扫罗；扫罗是那迦南女子的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: 西缅的儿子是
  rationale: 以自然的现代汉语引出家谱名单；“是”为汉语列举所需，希伯来文中无须明示系词。
- source_word: יְמוּאֵל
  choice: 耶母利
  rationale: 采用现代中文圣经中较通行、且与希伯来语音相称的人名形式。
- source_word: וְיָמִין
  choice: 雅悯
  rationale: 按中文圣经惯用形式音译该人名，并保留名单中的并列关系。
- source_word: וְאֹהַד
  choice: 阿辖
  rationale: 采用中文圣经中通行的人名音译。
- source_word: וְיָכִין
  choice: 雅斤
  rationale: 采用中文圣经中通行的人名音译。
- source_word: וְצֹחַר
  choice: 琐辖
  rationale: 采用中文圣经中通行的人名音译，以便读者辨认。
- source_word: וְשָׁאוּל
  choice: 和扫罗
  rationale: שָׁאוּל采用中文圣经中通行的“扫罗”，无须像英语那样在Shaul与Saul之间作拼写说明。
- source_word: בֶּן הַכְּנַעֲנִית
  choice: 扫罗是那迦南女子所生的
  rationale: 希伯来语直译为“那迦南女子的儿子”；在汉语家谱语境中，“是……所生的”自然清楚，也明确保留阴性族称所指的是一名女子。
