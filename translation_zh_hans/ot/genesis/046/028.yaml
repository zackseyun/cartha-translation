base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: zh_hans
  text: 雅各派犹大先到约瑟那里，好为他引路前往歌珊[a]。随后，他们来到歌珊地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来语结构简略，也可理解为犹大到约瑟那里取得前往歌珊的指示，或先去为雅各安排前往歌珊的事。
    reason: 保留לְהוֹרֹת לְפָנָיו גֹּשְׁנָה在施事者和具体行动上的词义与句法歧义。
lexical_decisions:
- source_word: שָׁלַח
  choice: 派
  rationale: 该动词在这里表示差派某人执行任务；“派”符合现代汉语叙事习惯。
- source_word: לְפָנָיו
  choice: 先
  rationale: 与“派”连用时表示犹大在雅各之前出发；译作“先”自然地传达空间和时间上的在前。
- source_word: אֶל יוֹסֵף
  choice: 到约瑟那里
  rationale: 保留移动的目标，也比生硬的“往约瑟”更符合现代汉语。
- source_word: לְהוֹרֹת לְפָנָיו גֹּשְׁנָה
  choice: 好为他引路前往歌珊
  rationale: לְהוֹרֹת可表示指示、引导；在迁往歌珊的语境中，“引路”传达实际的方向指引。原文结构简略，因此另以脚注保留其他理解。
- source_word: וַיָּבֹאוּ
  choice: 随后，他们来到
  rationale: 叙事形式表示下一步行动；“随后”使现代汉语衔接流畅，但不增添因果关系。
- source_word: אַרְצָה גֹּשֶׁן
  choice: 来到歌珊地
  rationale: 方向词尾表示进入或到达该地区；“歌珊地”保留אֶרֶץ的地域含义。
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: 犹大／约瑟／歌珊
  rationale: 采用现代中文圣经传统中通行的人名、地名译法。
theological_decisions:
- issue: לְהוֹרֹת לְפָנָיו的施事者及具体含义
  choice: 正文理解为犹大先行，为雅各引路
  alternative: 犹大到约瑟那里取得指示，或先去作安排
  rationale: 希伯来语从“到约瑟那里”直接转入不定式短语，结构压缩，未明说谁实施“指引”。正文采用最贴近句法表面且适合行程语境的译法，同时用脚注保留真实歧义，不把某一解释绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅各”在本节希伯来文中由代词体现；汉语若直接以“他”开句容易指代不明，因此明示主语。正文简洁叙事，脚注说明原文压缩结构的多种可能理解。
