base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: zh_hans
  text: 迦得的儿子是洗非芸[a]、哈基、书尼、以斯本、以利、亚罗底和亚列利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文צִפְיוֹן在这里译作“洗非芸”；不少译本作“洗分”，反映了《民数记》26:15也出现的另一传统形式。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: 迦得的儿子是
  rationale: בְנֵי是“儿子”的复数构造式；在家谱名单中直译为“……的儿子”自然清楚。句首的וּ承接上文的名单结构，中文不必机械译出“和”，以“是”引出名单。
- source_word: צִפְיוֹן
  choice: 洗非芸
  rationale: 按本节马所拉文本צִפְיוֹן的读音音译，并与常见中文圣经人名形式保持适度连续性；民数记26:15所见形式有所不同，另以脚注说明。
- source_word: וְחַגִּי
  choice: 哈基
  rationale: 专有名词חַגִּי按希伯来语读音音译；前缀连词由中文名单标点体现。
- source_word: שׁוּנִי
  choice: 书尼
  rationale: 按希伯来语读音音译，并采用中文读者熟悉的人名形式。
- source_word: וְאֶצְבֹּן
  choice: 以斯本
  rationale: 按马所拉文本אֶצְבֹּן音译；前缀连词由中文列举结构体现。
- source_word: עֵרִי
  choice: 以利
  rationale: 按希伯来语人名עֵרִי音译，采用通行中文形式。
- source_word: וַאֲרוֹדִי
  choice: 亚罗底
  rationale: 按希伯来语אֲרוֹדִי音译；连词在中文中不逐项重复。
- source_word: וְאַרְאֵלִי
  choice: 亚列利
  rationale: 按希伯来语אַרְאֵלִי音译；作为名单末项，用“和”连接，符合现代汉语习惯。
