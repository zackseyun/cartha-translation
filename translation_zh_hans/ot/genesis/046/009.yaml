lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: 吕便的儿子是
  rationale: בְנֵי是“儿子”的复数构造式；本节承接家谱名单。中文以“吕便的儿子是”自然引出名录，无须机械译出句首连接词וּ。吕便采用现代中文圣经中通行且易识别的译名。
- source_word: חֲנוֹךְ
  choice: 哈诺
  rationale: 按希伯来语חֲנוֹךְ的读音音译为“哈诺”，并以脚注说明传统中文译名“以诺”，既贴近原文形式，也便于读者辨识。
- source_word: וּ/פַלּוּא
  choice: 法路
  rationale: 采用现代中文圣经中较通行的姓名译法；前缀连接词וּ由中文列举标点体现。
- source_word: וְ/חֶצְרוֹן
  choice: 希斯仑
  rationale: 采用现代中文圣经中通行且可辨识的音译；连接词由中文并列结构体现。
- source_word: וְ/כַרְמִי
  choice: 迦米
  rationale: 采用现代中文圣经中通行的音译；末项前的וְ译作“和”。
