  to: 你们要把我在埃及的一切尊荣[a]，以及你们所看见的一切，都告诉我父亲。你们要赶快把我父亲接到这里来[b]。
  rationale: 删除“所得”，避免将约瑟的尊荣误表述为原文明确强调的取得行为；其余正文保留。将原合并脚注拆分为分别锚定“尊荣”与“到这里来”的两则脚注，使词义替代与“下去”的方向信息各有明确对应。
