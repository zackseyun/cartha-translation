  text: וְ/הִגַּדְתֶּ֣ם לְ/אָבִ֗/י אֶת כָּל כְּבוֹדִ/י֙ בְּ/מִצְרַ֔יִם וְ/אֵ֖ת כָּל אֲשֶׁ֣ר רְאִיתֶ֑ם וּ/מִֽהַרְתֶּ֛ם וְ/הוֹרַדְתֶּ֥ם אֶת אָבִ֖/י הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: zh_hans
  text: 你们要把我在埃及的一切尊荣[a]，以及你们所看见的一切，都告诉我父亲。你们要赶快把我父亲接到这里来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣”也可译作“荣耀”；原文所用的词可指尊荣、荣耀或显赫地位。
    reason: 保留 כבוד 的词义幅度。
  - marker: b
    text: 原文直译为“把我父亲带下来，到这里”；前往埃及在原文中以“下去”表述。
    reason: 说明 הוֹרַדְתֶּם 的方向意象，同时保留正文自然的现代汉语表达。
lexical_decisions:
- source_word: הִגַּדְתֶּם
  choice: 告诉
  rationale: 该词为 נגד 的使役式，在这里表示把事情告知父亲；“告诉”自然、准确，符合约瑟对兄弟们直接说话的语境。
- source_word: כָּל כְּבוֹדִי
  choice: 我……所得的一切尊荣
  rationale: כבוד 在这里指约瑟在埃及获得的显赫地位、威望和尊贵身份。“尊荣”保留“尊贵、荣耀”的语义范围，同时避免让现代读者误以为这里专指神学意义上的荣耀。
- source_word: בְּמִצְרַיִם
  choice: 在埃及
  rationale: 直接表达地点；与“所得”连用，也自然传达约瑟的尊荣是在埃及获得并享有的。
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: 你们所看见的一切
  rationale: 贴近原文的概括性表达，涵盖兄弟们亲眼见到的约瑟地位及相关情形。
- source_word: מִהַרְתֶּם
  choice: 要赶快
  rationale: 上下文赋予该完成式命令或催促的效力；“要赶快”清楚传达紧迫感。
- source_word: הוֹרַדְתֶּם אֶת אָבִי
  choice: 把我父亲接……来
  rationale: 使役式原义为“使……下去”。现代汉语通常说“接来”而不按地理方向说“带下来”；译文以自然表达为主，方向意象见脚注。
- source_word: הֵנָּה
  choice: 到这里来
  rationale: 表示朝说话者所在之处移动；“到这里来”准确传达目的地和指向说话者的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要……都告诉”保留两个并列宾语同受一个动词支配的结构；“接到这里来”比“带下来”更符合现代汉语习惯，同时用脚注保存原文方向信息。
