  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: zh_hans
  text: 我要在那里供养你，因为还有五年饥荒，免得你、你的家和你所有的一切都陷入穷困。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: 我要……供养
  rationale: 该词在此指持续供应生活所需；“供养”自然体现约瑟将负责父亲一家生计的意思。
- source_word: כִּי
  choice: 因为
  rationale: 保留因果关系：尚有五年饥荒，是约瑟要供养父亲的原因。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达为避免某种不良后果而采取行动的目的或防范意味。
- source_word: תִּוָּרֵשׁ
  choice: 陷入穷困
  rationale: 此处词形的具体语源分析有争议，但上下文明确指因饥荒而变得贫困、匮乏；此译法既自然，也不过度限定为彻底破产。
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: 你一切所有的
  rationale: 保留概括性，可包括财物、牲畜及其他属于雅各的一切，不擅自缩窄范围。
