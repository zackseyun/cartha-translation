base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: zh_hans
  text: 约瑟对兄弟们说：“我就是约瑟！我的父亲还活着吗？”他的兄弟们却无法回答他，因为他们在他面前惊惶失措。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אֶחָיו
  choice: 约瑟对兄弟们说
  rationale: 叙事性未完成式承接前文；现代汉语无需机械译出句首连接词。“对……说”自然表达 אֶל 所引出的说话对象。
- source_word: אֲנִי יוֹסֵף
  choice: 我就是约瑟
  rationale: אֲנִי 是明确的自我指认；“就是”符合汉语揭示身份的语境，并未添加新的命题内容。
- source_word: הַעוֹד אָבִי חָי
  choice: 我的父亲还活着吗
  rationale: הַעוֹד 询问生命状态是否仍在持续；保留 אָבִי 明确的第一人称领属形式。
- source_word: וְלֹא יָכְלוּ אֶחָיו לַעֲנוֹת אֹתוֹ
  choice: 他的兄弟们却无法回答他
  rationale: יכל 表示能力上的不能；“无法”贴近原文。“却”自然呈现 וְ 在此处的转折关系。
- source_word: נִבְהֲלוּ
  choice: 惊惶失措
  rationale: בהל 的尼法勒式表示突然受惊、慌乱或恐惧；“惊惶失措”既保留强烈反应，也契合他们无法作答的语境。
- source_word: מִפָּנָיו
  choice: 在他面前
  rationale: 按希伯来语“从他面前／因面对他”的表达作较形式对应的翻译；此处可兼含身处其面前和因其显现而惊惶的意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我就是约瑟”传达身份揭晓时的强调；末句保留原文 מִפָּנָיו 的空间与因果张力，不将其单一定解为“看见他”或“因为他”。”
