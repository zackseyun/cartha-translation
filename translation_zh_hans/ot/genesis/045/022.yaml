  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: zh_hans
  text: 他给他们每人一套替换用的衣服；但他给便雅悯三百银子[a]和五套替换用的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“三百银”，没有注明具体的货币或重量单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: 给他们每人
  rationale: 两个成分共同表达周全而逐一的分配；汉语用“他们每人”自然保留这种分配意义，避免逐字翻译造成重复。
- source_word: נָתַן
  choice: 给
  rationale: 叙事中赠予物品的普通用词，简洁自然。
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: 替换的衣服
  rationale: 该词组指可供更换的衣服；“替换的衣服”既保留原文含义，也避免把它具体化为礼服或节庆服装。首处按逐人分配译作“一套”，末处保留“五套”。
- source_word: וּלְבִנְיָמִן
  choice: 但给便雅悯的
  rationale: 原文连接词在这里形成对比；译作“但”清楚显示便雅悯所得格外丰厚。
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: 三百银子
  rationale: 原文只说“三百银”，没有明言舍客勒或其他计量单位；“三百银子”保留单位未明的特点，不作过度具体化。
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: 和五套替换的衣服
  rationale: 与前半句的衣服用语保持一致，并准确保留数量。
