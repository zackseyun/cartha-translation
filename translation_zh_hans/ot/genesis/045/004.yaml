base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: zh_hans
  text: 于是约瑟对他的兄弟们说：“请到我跟前来。”他们就走近了。约瑟说：“我是约瑟，你们的兄弟，就是你们卖到埃及去的那个人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אֶחָיו
  choice: 约瑟对他的哥哥们说
  rationale: 叙事体的 וַיֹּאמֶר 推进情节，现代汉语不必机械重复“然后”。אֶחָיו 泛指约瑟的兄弟，但按上下文他们都是他的兄长，译作“哥哥们”自然且准确。
- source_word: גְּשׁוּ־נָא אֵלַי
  choice: 请靠近我
  rationale: נגשׁ 表示走近、靠近；נָא 带有请求语气，用“请”表达。
- source_word: וַיִּגָּשׁוּ
  choice: 他们就靠近了
  rationale: 重复“靠近”，保留原文命令与回应使用同一词根的呼应；“就”自然表达紧接着发生的动作。
- source_word: אֲנִי יוֹסֵף אֲחִיכֶם
  choice: 我是你们的弟弟约瑟
  rationale: 原文直译为“我是约瑟，你们的兄弟”。结合亲属关系，现代汉语须在“哥哥/弟弟”间作出选择；约瑟是他们的弟弟，合并为“你们的弟弟约瑟”清楚自然。
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: 就是你们卖……的那个人
  rationale: 保留关系从句直接指认和责问的力度；汉语用“就是……的那个人”衔接前面的身份揭示较自然。
- source_word: מִצְרָיְמָה
  choice: 到埃及去
  rationale: 词尾方向标记表示朝向埃及；“卖到埃及去”符合现代汉语习惯，并明确目的地。
