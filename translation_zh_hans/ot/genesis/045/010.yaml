base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: zh_hans
  text: 你要住在歌珊地，靠近我；你和你的儿子、孙子，以及你的羊群、牛群和你所有的一切，都要在我附近。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: 你要住
  rationale: ישׁב在此表示定居、居住；“住”是现代汉语中自然简明的表达，也符合约瑟安排雅各居于特定地区的语境。
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: 在歌珊地
  rationale: אֶרֶץ在这里指地域；“歌珊地”既保留地理名称和希伯来语结构的要点，也符合中文圣经地名的通行表达。
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: 离我很近
  rationale: היה加קָרוֹב表示处于邻近状态；“离我很近”自然地传达空间上的接近，也保留约瑟希望父亲在自己附近的个人意味。
- source_word: אַתָּה
  choice: 你
  rationale: 独立代词带有强调作用；以破折号引出“你和……”的并列名单，可在自然中文中体现这一强调。
- source_word: וּבָנֶיךָ
  choice: 你的儿子
  rationale: בָּנִים此处是阳性复数，并与下一项“你儿子的儿子”相连；译作“儿子”准确保留男性所指。
- source_word: וּבְנֵי בָנֶיךָ
  choice: 孙子
  rationale: 原文直译为“你儿子的儿子”；“孙子”是现代中文自然、准确且保留男性所指的对应表达。
- source_word: וְצֹאנְךָ
  choice: 你的羊群
  rationale: צֹאן是绵羊、山羊等小型牲畜的集合称谓；中文“羊群”简洁自然，并与“牛群”形成对应。
- source_word: וּבְקָרְךָ
  choice: 你的牛群
  rationale: בָּקָר指牛类或大型牲畜；“牛群”在此准确清楚，并保留与צֹאן的区别。
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: 你所有的一切
  rationale: 该短语概括属于雅各的一切；“你所有的一切”在中文中范围宽广，并与前面的家人和牲畜清单自然衔接。
theological_decisions:
- issue: “离我很近”与后续名单的句法关系
  choice: 将“你和你的儿子、孙子……”理解为与雅各一同住在歌珊、靠近约瑟的人与所有物，并在末尾补出“都要住在那里”以形成自然中文。
  alternative: 把整份名单直接接在“离我很近”之后，不补出谓语。
  rationale: 希伯来文以“你”起首列举全家、牲畜和所有财物，语义上承接居住和邻近两个陈述。中文若完全照搬会显得悬垂；补出“都要住在那里”不增添新的实质信息，并保持全体迁居歌珊、靠近约瑟的意思。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“歌珊地”为通行专名；以破折号保留独立代词אַתָּה的强调和名单转换。为避免中文并列成分悬空，句末补出“都要住在那里”，属于显化原文已经蕴含的居住关系。
