revisions:
- from: 约瑟在所有侍立在他身旁的人面前，再也抑制不住自己，就喊道：“叫所有人都离开我！”约瑟向兄弟们表明自己的身份时，没有一个人留在他身边。
  to: 约瑟在所有站在他身旁的人面前，已无法再抑制自己，便喊道：“叫所有人都出去！”约瑟向兄弟们表明自己的身份时，没有一个人留在他身边。
  rationale: 仅作安全且必要的措辞调整：“出去”明确对应命令众人离开约瑟面前；“站在他身旁的人”避免把在场者预先限定为侍从。其余内容保留原译的语义、叙事次序和庄重语体。
