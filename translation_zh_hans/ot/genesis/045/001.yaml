review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了约瑟无法再克制自己、命人遣散在场者，以及他向兄弟表明身份时无人留在场的叙事。惟“离开我”在现代汉语中常带有离弃某人的意味，未能清楚表达命令众人从他面前出去的空间及使役含义。
  naturalness: 整体庄重通顺；将命令改为“叫所有人都出去”更符合现代汉语叙事语境，也避免歧义。
  terminology: “抑制自己”“表明自己的身份”“兄弟们”均恰当。“站在他身旁的人”较“侍立”少一层未明言的宫廷职分解释，同时仍保留原文所指在场者。
  issues:
  - severity: medium
    issue: “叫所有人都离开我”含义可能歧义。
    rationale: “离开我”可理解为停止跟随或离弃我；希伯来语命令意为使每个人从约瑟面前/身边出去。译为“叫所有人都出去”更准确自然。
  - severity: low
    issue: “侍立”略带解释性。
    rationale: נִצָּבִים指站立、在场的人；虽在宫廷语境可指侍从，原文并未明确其职分。采用“站在他身旁的人”保留较宽的原文指称。
  revised_text: 约瑟在所有站在他身旁的人面前，已无法再抑制自己，便喊道：“叫所有人都出去！”约瑟向兄弟们表明自己的身份时，没有一个人留在他身边。
