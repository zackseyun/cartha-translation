base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: zh_hans
  text: 约瑟在所有站在他身旁的人面前，已无法再抑制自己，便喊道：“叫所有人都出去！”约瑟向兄弟们表明自己的身份时，没有一个人留在他身边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָכֹל לְהִתְאַפֵּק
  choice: 抑制不住自己
  rationale: 否定的能力动词与反身形式连用，表达无法再自我克制；此译自然并保留反身含义，不擅自限定具体情绪。
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: 在所有侍立在他身旁的人面前
  rationale: נצב表示站立或侍立，עָלָיו在此指在他身旁；结合约瑟的官长身份用“侍立”，同时保留“人面前”的临场关系。
- source_word: וַיִּקְרָא
  choice: 就喊道
  rationale: 该动词表示出声呼喊；“喊道”符合场景的紧迫感，又不过度渲染。
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: 叫所有人都离开我
  rationale: 复数使役命令意为让每个人出去；“叫……离开”在现代汉语中自然地表达使役含义，“所有人”准确传达כָל אִישׁ的周遍意义。
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: 没有一个人留在他身边
  rationale: עמד字面为“站立”，在此语境中表示继续在场；译作“留在他身边”清楚自然，并保留איש所加强的“没有一个人”。
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: 约瑟向兄弟们表明自己的身份时
  rationale: ידע的Hitpael在此表示使自己为人所知，即揭明身份；“表明自己的身份”比直译“使自己被认识”更符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留叙事的情绪张力，但不明确添加“哭泣”等原文未说出的情绪表现；“兄弟们”按具体男性手足语境直译。
