base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: zh_hans
  text: 神差我先来到这里，为要给你们在这地留下余民[a]，又使你们存活，得以大大脱险[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “余民”也可译作“幸存者”或“后裔”。希伯来语 שְׁאֵרִית 指余剩下来的人，也可指存留下来的后代。
    reason: lexical_alternative
  - marker: b
    text: “得以大大脱险”也可译作“得到重大的拯救”或“成为许多幸存者”。希伯来语 לִפְלֵיטָה גְּדֹלָה 既可侧重逃脱或拯救，也可侧重由此存留下来的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: 差我
  rationale: 叙事体的 wayyiqtol 表达过去发生的行动；中文语境已清楚，译作“差我”自然准确。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处指独一的神，是约瑟对事件的神学解释，故用单数称谓“神”。
- source_word: לִפְנֵיכֶם
  choice: 在你们以先
  rationale: 既保留“在你们前面”的基本意象，也自然表达约瑟比众兄弟更早来到埃及的时间先后。
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: 为要使你们……存留余民
  rationale: שׂום 本义为“放置、设立”，与 שְׁאֵרִית 连用时表示使余剩者得以存留；此译兼顾原文结构和中文可读性。
- source_word: שְׁאֵרִית
  choice: 余民
  rationale: 该词可指余剩的人、幸存者或后裔。“余民”保留希伯来圣经中这一关键词的呼应，同时脚注交代语境中的其他可能含义。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: אֶרֶץ 可指“大地”或“地方、土地”；此处上下文指埃及这片土地，中文加“这”使所指自然明确。
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: 又使你们存活
  rationale: חיה 的使役形表示使人活着、保全性命；“使你们存活”准确且庄重。
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: 得着大大的解救
  rationale: לִפְלֵיטָה 可表达目的或结果，פְּלֵיטָה 又可指逃脱、解救或幸存者群体。“得着大大的解救”保留结果意味，并避免把 ל 明确解释为工具关系。
theological_decisions:
- issue: שְׁאֵרִית 应译为具有经文呼应的“余民”，还是语境更直白的“幸存者／后裔”
  choice: 余民
  alternative: 幸存者；后裔
  rationale: “余民”忠实呈现该词“余剩之人”的核心意义及其在希伯来圣经中的词汇呼应，但不借此引入后期教义；脚注保留语境可能性。
- issue: לִפְלֵיטָה גְּדֹלָה 指大规模的解救，还是许多幸存者
  choice: 得着大大的解救
  alternative: 使许多人幸存；得以大大逃脱
  rationale: 该短语与“使你们存活”平行，可描述神保全他们所达成的重大拯救结果；但原词也可指幸存者，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“在你们以先”略带经文语体，但仍为现代读者所能理解；“大大的解救”体现 גְּדֹלָה 的强调，同时避免过度术语化。脚注标记均置于相应主文词组之后。
