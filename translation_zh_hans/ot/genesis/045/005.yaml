  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: zh_hans
  text: 现在，不要因你们把我卖到这里而忧伤，也不要为此恼恨自己[a]，因为上帝差我先到你们前面来，为要保全生命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“不要在你们眼中发怒（或燃烧）”，是表示恼怒或不悦的习语；这里指不要因这事恼恨自己。
    reason: lexical_alternative
  - marker: b
    text: “为要保全生命”也可译作“为了使人存活”。原文没有明说所保全的是谁的生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换标记，引出约瑟此刻对兄弟们的劝慰；现代汉语用“现在”自然，连接作用可由上下文体现。
- source_word: אַל תֵּעָצְבוּ
  choice: 不要……忧伤
  rationale: עצב在此表达内心的痛苦、悲伤；“忧伤”庄重自然，也符合约瑟安慰兄弟们的语境。
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: 也不要自责
  rationale: 原文直译近于“也不要让这事在你们眼中发怒／燃烧”，是表示恼怒或不悦的习语。结合兄弟们因自己所做之事而痛苦的语境，“自责”较自然地传达其指向自身的懊恼；脚注保留字面意象和“恼怒”的可能。
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: 因你们把我卖到这里
  rationale: 保留כִּי的因果作用，以及兄弟们“卖”约瑟这一明确的人类行为；“到这里”准确表达方向性的הֵנָּה。
- source_word: לְמִחְיָה
  choice: 为要保全生命
  rationale: מִחְיָה指生命的保存或存活；“保全生命”既表达目的，又不限定究竟是谁的生命，从而保留原文的概括性。
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: 上帝差我
  rationale: 直陈上帝主动差遣约瑟，保留原文对神圣护理的归因，不弱化为单纯许可。
- source_word: לִפְנֵיכֶם
  choice: 先到你们前面来
  rationale: 兼顾“在你们之前”和“到你们前面”的时间与位置含义，符合此处约瑟先抵达埃及的语境。
theological_decisions:
- issue: 上帝的护理与人的责任
  choice: 同时保留“你们把我卖到这里”和“上帝差我”两项陈述。
  alternative: 将兄弟们的行为弱化为“让我来到这里”，或将上帝的行动改写为仅仅许可。
  rationale: 希伯来文有意并置兄弟们的有责行为与上帝保全生命的旨意；译文不替原文消解这一神学张力。
- issue: “保全生命”的对象范围
  choice: 不增补“你们的”“许多人的”或“众人的”。
  alternative: 根据后文明确译为“保全你们的生命”或“使许多人存活”。
  rationale: 本节לְמִחְיָה本身未明说对象；保持概括表达可避免将后文解释提前写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“忧伤”保留情感力度；“自责”使希伯来习语在中文中自然可解，并以脚注保存字面形象及其他可能。“上帝差我”与“你们把我卖到这里”并列，以维持原文的人类责任与神圣护理之间的张力。
