  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: zh_hans
  text: 他亲吻了所有的弟兄，伏在他们身上哭。此后，他的弟兄们和他说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: 亲吻
  rationale: נשׁק 的皮埃勒形式在此表示出于亲情与和好的亲吻；“亲吻”自然庄重，又不额外强化为反复亲吻。
- source_word: לְכָל אֶחָיו
  choice: 所有的弟兄
  rationale: כָּל 与复数“弟兄”连用，表示约瑟的弟兄全体；此译保留亲属称谓和整体范围。
- source_word: וַיֵּבְךְּ עֲלֵיהֶם
  choice: 伏在他们身上哭
  rationale: בכה 表示哭泣；עַל 在这一亲密接触的场景中可描写身体伏靠其上。“伏在他们身上哭”比单纯“为他们哭”更能保留原文的空间意象。
- source_word: וְאַחֲרֵי כֵן
  choice: 之后
  rationale: 该短语明确标示先后次序；“之后”简洁自然。
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: 他的弟兄们才和他说话
  rationale: דבר 与 אֵת 连用可表达“与某人说话”，在和好语境中带有交谈意味；“和他说话”保留这一方向与互动感。“才”自然体现“之后”所暗示的此前沉默终于被打破。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“弟兄”与创世记家族叙事的传统用语协调；“伏在他们身上哭”保留希伯来文具体的身体姿态，避免把 עֲלֵיהֶם 抽象化为“为他们”。
