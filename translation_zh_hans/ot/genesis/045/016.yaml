  text: וְ/הַ/קֹּ֣ל נִשְׁמַ֗ע בֵּ֤ית פַּרְעֹה֙ לֵ/אמֹ֔ר בָּ֖אוּ אֲחֵ֣י יוֹסֵ֑ף וַ/יִּיטַב֙ בְּ/עֵינֵ֣י פַרְעֹ֔ה וּ/בְ/עֵינֵ֖י עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: zh_hans
  text: 这消息传到法老宫中[a]，说：“约瑟的兄弟们来了。”法老和他的臣仆都觉得这事很好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法老宫中”原文直译为“法老家中”，在这里也可理解为法老的宫廷。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקֹּל
  choice: 这消息
  rationale: קול本义可指“声音、话声”，但下文明确给出消息内容，因此此处按语境译为“消息”；“这”承接前文事件，使现代汉语自然。
- source_word: נִשְׁמַע
  choice: 传到
  rationale: 该词为שׁמע的尼斐勒式，字面是“被听见”。与“消息”搭配时译作“传到”，既保留被传播、被听闻之意，也符合现代汉语习惯。
- source_word: בֵּית פַּרְעֹה
  choice: 法老宫中
  rationale: 字面是“法老的家／房屋”，在王室语境中可指王宫或宫廷。“法老宫中”自然简洁，同时以脚注保留范围上的歧义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出所传内容的表达，以冒号和直接引语自然呈现。
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: 约瑟的兄弟们来了
  rationale: 完成式בָּאוּ表示他们已经来到，且结果与当前情形相关；汉语“来了”可自然表达这一点。
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: 都觉得这事很好
  rationale: 直译为“在……眼中为好”。此处用现代汉语表达法老及其臣仆对此事的正面评价与喜悦，不把语义缩窄为单纯的情绪反应。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עֶבֶד可指仆人、臣属或官员；王宫语境下“臣仆”既保留服侍关系，也不武断限定其具体官职。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“觉得这事很好”自然传达“在……眼中为好”的希伯来语习语，同时避免生硬照译；“臣仆”适合王室场景，又保留原词涵盖仆役与臣属的宽度。
