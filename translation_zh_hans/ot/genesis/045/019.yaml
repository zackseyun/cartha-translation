base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: zh_hans
  text: 你也受命：“你们要这样做：从埃及地取些车[a]，供你们幼小的孩子和妻子乘坐；带着你们的父亲一同来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “车”也可译作“大车”，指从埃及调来运送人和物的车辆。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: 奉命说
  rationale: 该词是צוה的第二人称阳性单数被动式，表明约瑟领受命令；“说”是按随后转为复数的直接命令所作的最少量补足，使现代汉语自然清楚。
- source_word: זֹאת עֲשׂוּ
  choice: 你们要这样做
  rationale: 保留复数祈使语气，并以现代汉语常用的命令句式表达。
- source_word: קְחוּ לָכֶם
  choice: 取些
  rationale: קחו表达“取、拿”，לכם含为自己使用的意味；车辆用途在下文已明说，汉语无需重复“为自己”。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 明确译出אֶרֶץ，同时保持简洁自然。
- source_word: עֲגָלוֹת
  choice: 车
  rationale: 指用来运送家属的有轮运输工具；“车”符合现代普通话且不武断限定具体构造，脚注说明也可译作“大车”。
- source_word: לְטַפְּכֶם
  choice: 给你们幼小的孩子
  rationale: טף主要指幼小的孩子；“幼小的孩子”比宽泛的“儿女”更准确。
- source_word: וְלִנְשֵׁיכֶם
  choice: 和妻子乘坐
  rationale: 家庭迁移语境中נשים明确指妻子；补出“乘坐”自然表达车辆的用途。
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: 把你们的父亲接来
  rationale: נשא本义可指抬、载或带；此处指用车运送父亲前来，“接来”在现代汉语中自然涵盖这一动作。
- source_word: וּבָאתֶם
  choice: 来
  rationale: 保留בוא的基本方向意义；语境表明是来到埃及，但正文不擅自加上原文未明说的“回来”。
theological_decisions:
- issue: 命令的发出者与受命者
  choice: 译作“你也奉命说”，使单数的约瑟领命并向复数的弟兄传达命令
  alternative: 译作“你也受命：‘你们要这样做……’”
  rationale: 原文先用第二人称单数被动式，随后改用复数祈使式；正文保留人称转换，不把法老、约瑟和弟兄的角色混为一谈。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“奉命说”交代原文单数被动式与随后复数命令之间的关系；“幼小的孩子”保留טף的具体含义；标点将取车、用途和接父亲的行动层次清楚分开。
