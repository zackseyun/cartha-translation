  yaml_path: translation/ot/genesis/045/025.yaml
  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: zh_hans
  text: 于是，他们从埃及上去，来到迦南地，到了他们的父亲雅各那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上去
  rationale: עלה的基本义是“上去、上升”；在从埃及前往迦南的地理行程中，“上去”保留了希伯来语的方向感和惯用表达。
- source_word: מִמִּצְרָיִם
  choice: 从埃及
  rationale: 介词מִן表示出发点或来源，故译为“从”；מִצְרַיִם按现代汉语通行名称译为“埃及”。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא可指“来、到达、进入”；此处“来到”自然承接旅程，也不额外强调跨越边界的“进入”。
- source_word: אֶרֶץ כְּנַעַן
  choice: 迦南地
  rationale: 原文明确含有אֶרֶץ“地、土地”，译作“迦南地”既完整保留构词关系，也符合中文圣经地名表达。
- source_word: אֶל
  choice: 到了……那里
  rationale: אֶל表示朝向某人；结合中文句法译为“到了他们的父亲雅各那里”，清楚表达他们最终前往雅各所在之处。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֲבִיהֶם
  choice: 他们的父亲
  rationale: אָב在本段语境中指兄弟们的亲生父亲雅各，直译为“他们的父亲”最准确。
