base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: zh_hans
  text: 你们要带着你们的父亲和家眷到我这里来；我要把埃及地最好的东西赐给你们，你们也要享用这地的肥美。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这地最丰饶的部分。”希伯来语“这地的肥美”是指当地最上好、最丰富的资源。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: 带着
  rationale: 这是לקח的复数命令式；结合“到我这里来”的方向语境，“带着”自然表达把父亲和家人一同带来的意思，同时不增添原文没有明说的“回来”。
- source_word: אֲבִיכֶם
  choice: 你们的父亲
  rationale: 准确表达单数名词及第二人称复数领属后缀，所指是雅各。
- source_word: בָּתֵּיכֶם
  choice: 家眷
  rationale: בַּיִת在此并非指房屋建筑，而是指各人的家庭成员及随属人员；“家眷”简洁、自然，并保留其群体含义。
- source_word: וּבֹאוּ אֵלַי
  choice: 到我这里来
  rationale: 直接表达בוא与介词אֶל的方向意义，不添加“回来”的含义。
- source_word: וְאֶתְּנָה לָכֶם
  choice: 我要……赐给你们
  rationale: 该形式接在命令之后，在语境中表达法老的承诺；“我要”能自然传达这一保证。
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: 埃及地最好的
  rationale: טוּב可指美物、丰盛或上好的部分；这里指埃及最优厚的资源，“最好的”既简明又保留其范围上的概括性。
- source_word: וְאִכְלוּ
  choice: 你们也要享用
  rationale: 字面为“吃”，但与“这地的肥美”搭配时是享受、食用丰饶出产的意思；“享用”在现代汉语中自然，并保留命令兼应许结果的语气。
- source_word: חֵלֶב הָאָרֶץ
  choice: 这地的肥美
  rationale: חֵלֶב本义为“脂肪”，在此是指土地最丰美、最上好的出产；“肥美”保留原文意象，同时在汉语中可理解为土地的丰饶。
theological_decisions: []
