source:
  edition: WLC
  text: וְ/עֵ֣ינְ/כֶ֔ם אַל תָּחֹ֖ס עַל כְּלֵי/כֶ֑ם כִּי ט֛וּב כָּל אֶ֥רֶץ מִצְרַ֖יִם לָ/כֶ֥ם הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: zh_hans
  text: 你们不要舍不得自己的物品[a]，因为埃及全地最好的东西都归你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“不要让你们的眼顾惜你们的物品。”意思是不要因那些物品而惋惜或挂心。
    reason: 保留原文以“眼”作主语的希伯来语表达，并说明其语境含义。
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס
  choice: 你们不要舍不得
  rationale: 原文直译近于“不要让你们的眼顾惜”，表示不要因留下财物而惋惜或顾念。现代汉语“舍不得”自然传达这一语境义，同时以脚注保留希伯来语意象。句首的 וְ 在连续话语中不必机械译作“并且”。
- source_word: עַל־כְּלֵיכֶם
  choice: 自己的物品
  rationale: כְּלִי 可指器具、物件或财物；此处是迁居时可能留下的家中物品。“物品”范围适当，“自己的”自然对应第二人称复数所属关系。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述命令的理由，现代汉语用“因为”清楚自然。
- source_word: טוּב כָּל־אֶרֶץ מִצְרַיִם
  choice: 埃及全地最好的东西
  rationale: טוּב 在此指土地所能提供的佳美之物或上好资源，而非抽象的“良善”；译为“最好的东西”通俗清楚，并保留“埃及全地”的范围。
- source_word: לָכֶם הוּא
  choice: 都归你们
  rationale: 介词 לְ 加代词并配合 הוּא 表达归属和强调；“都归你们”自然体现这一保证。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“舍不得”虽属日常用语，但准确表达迁居时对财物的留恋；脚注保存原文意象和可能的语义张力。
