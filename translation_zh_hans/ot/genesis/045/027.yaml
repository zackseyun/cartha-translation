base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: zh_hans
  text: 他们把约瑟对他们所说的一切话都告诉了他。他又看见约瑟派来载他的车辆[a]，他们的父亲雅各心神就复苏了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大车”。希伯来语所用的词指运输用的车辆。
    reason: lexical_alternative
  - marker: b
    text: 也可直译为“他们父亲雅各的灵苏醒了”；这是表示重新恢复活力或振作起来的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: 他们……告诉了他
  rationale: 这里是众子向雅各转述约瑟的话；“告诉”自然表达 דּבר אֶל 在本语境中的传达行为，同时保留叙事顺序。
- source_word: אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: 约瑟对他们所说的一切话
  rationale: 保留 דִּבְרֵי 与 דִּבֶּר 之间“话／说”的词义呼应，现代汉语也通顺。
- source_word: הָעֲגָלוֹת
  choice: 车
  rationale: 该词指运送人或物的车辆；“车”简洁自然，脚注补明也可理解为“大车”。
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: 约瑟派来载他的
  rationale: “载”直接体现 נׂשא 在此处用车辆运送人的意思，比“接他”少一层目的性解释。
- source_word: וַתְּחִי רוּחַ
  choice: 心神就复苏了
  rationale: 既保留 חיה 的恢复生命力意象，也以自然汉语表达 רוּחַ 在此处所指的精神、活力与振奋。
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: 他们的父亲雅各
  rationale: 依照现代汉语习惯排列亲属身份与人名，并采用该族长在中文圣经传统中通行的名字“雅各”。
theological_decisions:
- issue: רוּחַ 在本节是指人的灵、心神，还是生命活力
  choice: 心神
  alternative: 灵
  rationale: 语境描写雅各听见消息并看见车辆后重新振作；“心神”保留人的内在生命含义，又不把该词限定为某种系统神学意义上的独立实体。脚注保留较直译的可能。
- issue: יַעֲקֹב 的中文人名形式
  choice: 雅各
  alternative: 音译作“雅科夫”
  rationale: “雅各”是现代中文读者熟悉且稳定的圣经专名形式；采用通行专名并不改变原文所指人物。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以两个句子承接希伯来叙事链，避免汉语长句过度拖沓；“又”和“就”清楚呈现事件的先后与结果，但不增添原文没有的因果解释。
