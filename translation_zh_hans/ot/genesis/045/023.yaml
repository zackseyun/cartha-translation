  text: וּ/לְ/אָבִ֞י/ו שָׁלַ֤ח כְּ/זֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִ/טּ֣וּב מִצְרָ֑יִם וְ/עֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹת בָּ֣ר וָ/לֶ֧חֶם וּ/מָז֛וֹן לְ/אָבִ֖י/ו לַ/דָּֽרֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: zh_hans
  text: 他给父亲送去如下物品：十头驴，驮着埃及上好的物产[a]；十头母驴，驮着给父亲路上用的粮食、饼和给养。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“埃及上好物产中的一些”，或“埃及的丰美出产”。
    reason: 原文 מִטּוּב מִצְרָיִם 可强调从埃及佳美之物中取出一部分，也可概括指埃及优质、丰美的物产。
lexical_decisions:
- source_word: כְּזֹאת
  choice: 这些东西
  rationale: 这是引出随后所列礼物的概括性表达；结合中文语序译作“这些东西”自然清楚。
- source_word: חֲמֹרִים
  choice: 驴
  rationale: 采用现代汉语通用名称；原词在此为一般或雄性未明的“驴”。
- source_word: נֹשְׂאִים
  choice: 驮着
  rationale: 在牲畜运输货物的语境中，“驮着”比泛称“带着”更具体自然，同时不额外推断装载方式。
- source_word: מִטּוּב מִצְרָיִם
  choice: 埃及上好的物产
  rationale: טוּב在此可指佳美之物、优质出产或丰饶；“物产”符合礼物及运输语境，但以脚注保留介词מִן可能表达“从……中取出一些”的含义。
- source_word: אֲתֹנֹת
  choice: 母驴
  rationale: 保留希伯来文对雌性驴的明确区分。
- source_word: בָּר
  choice: 粮食
  rationale: 该词泛指谷粮，不宜限定为小麦或现代汉语中可能有歧义的“玉米”。
- source_word: לֶחֶם
  choice: 饼
  rationale: 指可食用的烤制粮食；在古代近东语境中译作“饼”比现代形态联想较强的“面包”更合适。
- source_word: מָזוֹן
  choice: 食物
  rationale: 泛指旅途所需的给养；“食物”与前面的具体项目相区分，并保持普通读者易懂。
- source_word: לַדָּרֶךְ
  choice: 供父亲路上用的
  rationale: 表达这些食物是为父亲旅途预备的，符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“匹”作驴的量词，保留“母驴”的性别区别；分号帮助读者辨明两组各十匹驴及其所驮物品。
