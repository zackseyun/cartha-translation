revisions:
- from: 他又送给父亲这些东西：十匹驴，驮着埃及上好的物产[a]；十匹母驴，驮着粮食、饼和供父亲路上用的食物。
  to: 他给父亲送去如下物品：十头驴，驮着埃及上好的物产[a]；十头母驴，驮着给父亲路上用的粮食、饼和给养。
  rationale: 修订将旅途用途明确前置为整个第二组所驮物品的共同限定，避免中文句法造成范围缩窄；并以更自然的“如下物品”引出列举。其余信息、性别区分及脚注所保留的词义歧义均维持不变。
