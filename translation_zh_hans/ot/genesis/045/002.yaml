  yaml_path: translation/ot/genesis/045/002.yaml
  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: zh_hans
  text: 他放声大哭[a]，埃及人听见了[b]，法老家中也听见了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“在哭泣中发出他的声音”，这是指他大声哭泣的希伯来语表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“埃及听见了”。这里的复数动词支持把“埃及”理解为集合性地指“埃及人”。
    reason: lexical_alternative
  - marker: c
    text: “法老家中”也可译为“法老的家”或按引申义译为“法老的宫廷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: 放声大哭
  rationale: 该希伯来语表达直译为“在哭泣中发出他的声音”，是指可被人听见的高声哭泣；“放声大哭”既自然，又准确传达其强烈而有声的哭泣。
- source_word: וַיִּשְׁמְעוּ / וַיִּשְׁמַע
  choice: 听见了
  rationale: 此处 שׁמע 表示听觉上的感知，而不是留心听从；两处均译为“听见了”，保留原文的重复和平行。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 该词可指“埃及”，但与复数动词连用，较可能是对埃及人的集合性称呼；译作“埃及人”符合现代汉语表达。
- source_word: בֵּית פַּרְעֹה
  choice: 法老家里的人
  rationale: “法老的家”可指法老的家属、宫廷人员或整个王室机构。译作“法老家里的人”保持人的所指，并保留其范围上的一定弹性，避免把它限定为建筑物“宫殿”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“放声大哭”自然传达原文惯用语；“都”体现声音传至埃及人那里的广泛性，但不把范围绝对化为全埃及。“法老家里的人”避免误解为建筑，同时保留“王室/宫廷”之义的开放性。
