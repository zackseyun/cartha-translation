  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: zh_hans
  text: 于是，约瑟伏在他弟弟便雅悯的颈项上哭了[a]；便雅悯在约瑟的颈项上哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“伏在他弟弟便雅悯的颈项（复数形式）上……便雅悯在他的颈项上哭”。“颈项”的复数形式在这里是希伯来语描述环颈拥抱的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: 于是……伏在
  rationale: 叙事性连词推进情节；“伏在……颈项上”既保留 נפל“倒下、伏下”的具体意象，也自然表达拥抱动作。
- source_word: עַל
  choice: 在……上
  rationale: 直接对应介词“在、于……之上”，并符合汉语“伏在颈项上”的表达。
- source_word: צַוְּארֵי / צַוָּארָיו
  choice: 颈项上
  rationale: 希伯来语前一形式在形态上为复数式，但此处是环颈拥抱的惯用表达；汉语采用单数概念“颈项”，避免误解为多个脖子。
- source_word: בִנְיָמִן
  choice: 便雅悯
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: אָחִיו
  choice: 他弟弟
  rationale: 原文直译为“他的兄弟”；结合创世记叙事中便雅悯与约瑟的长幼关系，汉语“弟弟”自然且准确地保留亲属强调。
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: 哭了 / 哭
  rationale: בכה 表示哭泣；“哭”是现代汉语自然、庄重而不过度文学化的对应词。两处均保持相同词根的对应。
- source_word: וּבִנְיָמִן
  choice: 便雅悯也
  rationale: 连接第二个对称动作；汉语加“也”自然呈现双方相互拥抱哭泣的关系，没有改变命题内容。
- source_word: צַוָּארָיו（第二处代词）
  choice: 约瑟的颈项
  rationale: 原文为“他的颈项”，但汉语连续出现两位男性时代词可能指代不清；明确为“约瑟”可无损消除歧义。
