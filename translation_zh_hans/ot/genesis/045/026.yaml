base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: zh_hans
  text: 他们告诉他：“约瑟还活着，他统管埃及全地。”但他的心麻木了[a]，因为他不相信他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的心发僵了”或“他的心衰弱了”。这个希伯来语表达描写雅各听到消息时内心震惊、无力的反应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: 他们告诉他说
  rationale: 保留希伯来语叙事中的传话与引语引入结构；“告诉他说”庄重清楚，也自然引出直接引语。
- source_word: עוֹד יוֹסֵף חַי
  choice: 约瑟还活着
  rationale: עוֹד在此表示状态仍在持续；“还活着”准确传达约瑟依然存活。
- source_word: וְכִי הוּא מֹשֵׁל
  choice: 并且统管
  rationale: מֹשֵׁל是表示持续施行统治的分词；“统管”体现实际治理权，又不将其限定为某一具体埃及官职。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 埃及全地
  rationale: 介词短语界定约瑟统治的范围；与“统管”连用，现代汉语无需另译介词即可清楚表达。
- source_word: וַיָּפָג לִבּוֹ
  choice: 雅各却惊得心都麻木了
  rationale: פוג可指衰弱、发僵或麻木；此处描写听到难以置信的消息后内心受震动的状态。“心都麻木了”保留身体化隐喻，“惊得”补明语境所含的猝然震惊。为避免汉语代词连续造成指代含混，明确写出“雅各”。
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: 因为他不相信他们
  rationale: כִּי在此说明前述反应的原因；直译为“因为”清楚保留因果关系。
