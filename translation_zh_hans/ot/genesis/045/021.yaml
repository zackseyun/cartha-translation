  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: zh_hans
  text: 以色列的儿子们就照着做了。约瑟遵照法老的吩咐[a]，给了他们车，又给了他们路上所需的给养。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“照法老的口”，这是表示“遵照法老吩咐”的习语。
    reason: 说明原文习语的字面形式及实际含义。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 就照着做了
  rationale: 自然表达他们按前文所说的安排行事，同时保留原文简洁的回指。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的儿子们
  rationale: 此处具体指雅各（以色列）的男性后代，因此采用性别明确、贴近原文的译法。
- source_word: עֲגָלוֹת
  choice: 车辆
  rationale: 指用来载人和货物的有轮运输工具；“车辆”在现代汉语中清楚自然，又不加入原文未说明的具体车制。
- source_word: עַל פִּי פַרְעֹה
  choice: 遵照法老的吩咐
  rationale: 这是希伯来语习语，字面为“照法老的口”，实际表示依照法老所下的命令。
- source_word: צֵדָה לַדָּרֶךְ
  choice: 旅途所需的粮食
  rationale: צֵדָה表示旅行携带的食物或给养；结合此处语境，“旅途所需的粮食”比笼统的“物资”更明确，也保持自然庄重。
