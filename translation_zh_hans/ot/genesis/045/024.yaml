  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: zh_hans
  text: 于是，约瑟打发他的兄弟们离去；他们便上路了。约瑟对他们说：“你们在路上不要争吵。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们在路上不要烦躁”“不要生气”或“不要害怕。”希伯来语动词可指多种情绪上的不安；结合约瑟表明身份后兄弟们一同返乡的语境，正文译作“争吵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 打发……走了
  rationale: 此处 שׁלח 的加强词干表示使他们离开自己所在之处；“打发……走了”既表达差遣，也自然衔接他们启程的叙事。
- source_word: אֶת־אֶחָיו
  choice: 他的兄弟们
  rationale: 忠实保留亲属称谓，并符合约瑟与众兄弟的叙事背景。
- source_word: וַיֵּלֵכוּ
  choice: 他们便启程
  rationale: הלך 基本义为“去、行走”；在被打发离开之后，“启程”自然表达他们开始返乡的行程。
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 约瑟对他们说
  rationale: 用现代汉语自然呈现希伯来语常见的发言公式；补出“约瑟”可避免连续代词造成指代不清。
- source_word: אַל
  choice: 不要
  rationale: 准确表达 אַל 加未完成式所构成的禁止语气。
- source_word: תִּרְגְּזוּ
  choice: 争吵
  rationale: רגז 可指激动、发怒、恐惧或颤抖等情绪扰动；结合兄弟们同行返乡，以及约瑟刚揭示身份的语境，“争吵”很可能指他们不要彼此责怪争执，但其他可能义保留在脚注中。
- source_word: בַּדָּרֶךְ
  choice: 路上
  rationale: 简洁、自然地表达他们返回迦南途中的道路或行程。
