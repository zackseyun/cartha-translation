  language: zh_hans
  text: 以色列说：“够了！我的儿子约瑟还活着。我要去见他，在我死以前。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 承接前文的叙事推进；现代汉语通常不必机械译出句首连接词。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文明确使用“以色列”，不改作“雅各”。
- source_word: רַב
  choice: 够了！
  rationale: 此处是表示满足、足够的感叹语，语气简短而有情感力度。
- source_word: עוֹד ... חָי
  choice: 还活着
  rationale: 自然表达约瑟的生命仍在延续。
- source_word: בְּנִי
  choice: 我的儿子
  rationale: 保留原文的所属关系和父子情感。
- source_word: אֵלְכָה
  choice: 我要去
  rationale: 该鼓励式形态表达说话者坚定的意愿；“我要去”自然且不过度增添义务色彩。
- source_word: וְאֶרְאֶנּוּ
  choice: 见他一面
  rationale: 准确表达“去见他”；“一面”符合现代汉语在临终前探见亲人的自然说法，并未改变动作的对象。
- source_word: בְּטֶרֶם אָמוּת
  choice: 在我死以前
  rationale: 直接保留时间关系，语言庄重清楚。
