  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: zh_hans
  text: 所以，如今，不是你们把我送到这里来的，而是神；他使我作法老的父[a]，作法老全家的主，并统管埃及全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“对法老如同父亲”；意思可能是法老主要的庇护者、谋士或施恩者。
    reason: 说明“父”在此是职能性比喻，并保留介词结构也可理解为“如同父亲”的可能性。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 既保留连接词的承接、推论作用，也表达 עַתָּה 的时间和话语推进功能，自然引出约瑟对前文的总结。
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה
  choice: 不是你们把我送到这里来的
  rationale: 用“不是你们……的”再现原文前置 אַתֶּם 所形成的强调；“这里”保留 הֵנָּה 对埃及的现场指向。
- source_word: כִּי הָאֱלֹהִים
  choice: 而是神
  rationale: 否定句后的 כִּי 在此构成强烈对照，汉语“不……而是……”准确而自然。
- source_word: וַיְשִׂימֵנִי
  choice: 他使我作
  rationale: שׂים 在这里表示使某人处于或担任某种身份；“使我作”既保留神主动安排的意味，也顺畅引出后面的三个角色。
- source_word: לְאָב לְפַרְעֹה
  choice: 作法老的父
  rationale: 保留 אָב“父”的原有比喻，不把其宽广含义收窄为单一的“顾问”；脚注说明这里指庇护者、谋士或施恩者一类的角色。
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: 作他全家的主
  rationale: אָדוֹן 表示拥有权柄的主人；“全家”在此可涵盖法老的家室、宫廷与产业，保持原文 בֵּיתוֹ 的宽泛性。
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: 并统管埃及全地
  rationale: מֹשֵׁל 指实际施行统治的人；“统管”自然表达其治理权，又避免用“总督”等过于具体的行政头衔。
theological_decisions:
- issue: 神的主权与兄长们的人类行动
  choice: 保留“不是你们……而是神”的强烈修辞对照
  alternative: 弱化为“真正使我来的主要是神”，或补入一套关于神意与人类责任的系统解释
  rationale: 原文强调神在事件中的决定性旨意，却没有否认兄长们确实把约瑟卖到埃及的行为。译文保留这种张力，不以释义替经文解决其神学关系。
- issue: “作法老的父”的比喻性质
  choice: 正文直译“父”，以脚注说明可能的职能含义
  alternative: 直接译为“法老的顾问”或“法老的恩主”
  rationale: 原文的父亲意象可能同时包含庇护、劝导和施惠等含义；直译可保存其丰富性，避免锁定某一种官职或关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作……的父／主”略带经文语体，以保存原文平行结构和父亲比喻；末句用“统管”避免连续重复“作”，使汉语更自然。脚注标记紧随其所解释的“父”。
