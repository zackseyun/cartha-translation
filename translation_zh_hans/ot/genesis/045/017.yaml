    issue: “把牲口装上货”存在装载对象关系不够明确的问题。
    rationale: 希伯来文命令的对象是“你们的牲口”，即把牲口作为承载货物的牲畜加以装载。汉语“把牲口装上货”可能被误读为将牲口装到货物上，或至少表达不够顺畅。
