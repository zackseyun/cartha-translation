review_pass:
  verdict: revise
  source_fidelity: 译文准确传达法老命令约瑟转告兄弟、装载牲口并返回迦南地的基本意思。“回……去”恰当地以自然汉语综合了“去、来（到达）”两个连续命令所指向的返程。惟“把牲口装上货”句法上略有歧义，可能被理解为把牲口装到货物上；改为明确货物装在牲口上更忠实。
  naturalness: 整体为庄重、通顺的现代标准汉语。将“你要对你的兄弟们说”调为“你要对你兄弟们说”更合乎现代汉语搭配，且不损失原文的第二人称所属关系。
  terminology: “法老”“约瑟”“迦南地”均为通行且合适的圣经译名。“牲口”在此可指负重的家畜，符合语境；以“给……牲口装上货”避免对装载关系的误解。
  issues:
