  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: zh_hans
  text: 法老对约瑟说：“你要对你兄弟们说：‘你们要这样做：给你们的牲口装上货，动身回迦南地去。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进事件；现代汉语通常无需另加“然后”，上下文已能表达顺序。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 这是现代汉语圣经与历史语境中通行的埃及君王称号。
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: 你要对你的兄弟们说
  rationale: 保留“说”的形式和约瑟作为传话者的结构，也自然表达命令。
- source_word: זֹאת עֲשׂוּ
  choice: 你们要这样做
  rationale: 直接对应指示词与复数命令式，简明自然。
- source_word: טַעֲנוּ אֶת־בְּעִירְכֶם
  choice: 把牲口装上货
  rationale: בְּעִיר在此指用于运输的家畜；结合טַעֲנוּ，译成“把牲口装上货”比泛称“动物”更明确，也符合旅行场景。
- source_word: וּלְכוּ בֹאוּ
  choice: 动身回……去
  rationale: 原文连续使用“去”和“来/到达”两个命令式，合起来描述从埃及启程并抵达迦南的行程；汉语以“动身回……去”自然保留启程及返回目的地两层意思。
- source_word: אַרְצָה כְּנָעַן
  choice: 迦南地
  rationale: 保留原文“地”及方向含义；汉语中的“回迦南地去”清楚表达趋向。
