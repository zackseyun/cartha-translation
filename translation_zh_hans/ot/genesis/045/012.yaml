  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: zh_hans
  text: 看哪，你们亲眼看见，我的兄弟便雅悯也亲眼看见：是我亲口在对你们说话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为直译：“看哪，你们的眼睛和我兄弟便雅悯的眼睛都看见，是我的口在对你们说话。”
    reason: 保留原文“眼睛”和“我的口”的具体表达及其句法形式。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 用于强调并唤起听者注意；“看哪”庄重而仍为现代读者所理解，比单说“看”更能保留原文的提示语气。
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: 你们亲眼看见了
  rationale: “亲眼”保留“眼睛”的具象强调，同时比“你们的眼睛看见”更符合现代汉语；“看见了”表达眼前已经得到的直接确认。
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: 我弟弟便雅悯也亲眼看见了
  rationale: 保留便雅悯作为约瑟兄弟的身份说明，并以“也亲眼看见了”自然再现与前句的平行关系。
- source_word: כִּי
  choice: ：
  rationale: 此处引出他们目睹并确认的内容；汉语用冒号自然承接，比机械译作“就是”或“因为”更清楚。
- source_word: פִי
  choice: 我亲口
  rationale: 原文直译为“我的口”，强调约瑟本人正在说话而非借助传译；现代汉语“亲口”既保留这一身体意象和强调，又避免生硬。
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: 在对你们说话
  rationale: 反映带冠词分词所表达的当前持续动作；“现在……在……”使现场性在现代汉语中清楚自然。
theological_decisions: []
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“看哪”保留叙事中的强调语气；正文用“亲眼、亲口”传达希伯来文身体部位表达的强调，脚注给出更形式对应的译法。
