base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: zh_hans
  text: 你们赶快上去，到我父亲那里，对他说：‘你儿子约瑟这样说：上帝立我作全埃及的主。下到我这里来，不要耽搁[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要逗留”；直译“不要站着不动”。
    reason: 说明אַל־תַּעֲמֹד在此催促语境中的惯用语义，并保留其较字面的译法。
lexical_decisions:
- source_word: מַהֲרוּ
  choice: 赶快
  rationale: 复数命令式表达紧迫催促；“赶快”是自然、直接的现代汉语。
- source_word: וַעֲלוּ
  choice: 上到
  rationale: 保留עלה“上去”的地理方向；从埃及前往迦南在《创世记》中通常称为“上去”。
- source_word: אֶל אָבִי
  choice: 我父亲那里
  rationale: 按原文表达目的地，不添加“家”等原文没有的信息。
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: 对他说
  rationale: 承接前面的命令，采用自然的汉语指令句式。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 保留正式的传话公式，同时避免文言化的“如此说”。
- source_word: בִּנְךָ יוֹסֵף
  choice: 你儿子约瑟
  rationale: 贴近希伯来语词序，突出约瑟与父亲的亲属关系。
- source_word: שָׂמַנִי אֱלֹהִים
  choice: 上帝立我
  rationale: שׂים在此指使人处于某种职位或身份；“立我”简洁地传达任立之意。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 动词及上下文均表明所指为独一的上帝；“上帝”是清楚自然的现代汉语称谓。
- source_word: לְאָדוֹן
  choice: 作……的主
  rationale: אָדוֹן指拥有权柄者；“主”保留原词的身份称号，不擅自具体化为某种政治官职。
- source_word: לְכָל מִצְרָיִם
  choice: 全埃及的
  rationale: 与“主”连用，表达其权柄范围遍及整个埃及。
- source_word: רְדָה אֵלַי
  choice: 下到我这里来
  rationale: 保留ירד“下去”的地理方向，也以“来”自然体现约瑟是目的地。
- source_word: אַל תַּעֲמֹד
  choice: 不要耽搁
  rationale: עמד字面为“站立”，在此禁令及催促语境中表示不要停留、迟延；“不要耽搁”最自然地传达其语用含义。
theological_decisions:
- issue: 约瑟宣告中的אֱלֹהִים如何译出
  choice: 上帝
  alternative: 神明／一个神
  rationale: 原文以单数语义使用该词，且约瑟在上下文中把这一安排归于他所敬拜的上帝；此译法依照语法和叙事语境，并非额外添加教义。
- issue: אָדוֹן作为约瑟身份称号的译法
  choice: 主
  alternative: 统治者／主人
  rationale: “主”保留原文较宽泛的权柄称号及其张力，不把约瑟的实际职分过度限定为某一具体官衔，也不将此处理解为神圣称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上到”和“下到”保留原文的地理方向表达；传话公式译为“这样说”，既正式又不显古奥。脚注标记置于其实际说明的“不要耽搁”之后。
