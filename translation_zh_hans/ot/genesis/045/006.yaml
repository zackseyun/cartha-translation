  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: zh_hans
  text: 因为这两年来，这片土地一直遭受饥荒；未来还有五年，既无耕种，也无收割。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明约瑟为何说上帝差他先来；现代汉语用“因为”自然体现因果关系。
- source_word: זֶה שְׁנָתַיִם
  choice: 已经两年了
  rationale: 该表达指截至说话时已经过去的两年；译为“已经两年了”符合现代汉语时态表达。
- source_word: הָרָעָב
  choice: 遭遇饥荒
  rationale: 所指是叙事中已经明确的那场饥荒；与地点短语结合译作“这地遭遇饥荒”自然清楚。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: 这地
  rationale: בְּקֶרֶב 字面有“在……当中”之意，但此处表示饥荒发生在该地；汉语简译为“这地”既自然，也保留地域范围。
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: 还要有五年
  rationale: 表达从当前时点算起仍剩五年，具有明确的未来指向。
- source_word: אֲשֶׁר אֵין
  choice: 不能……也不能……
  rationale: 关系从句描述未来五年不存在正常农耕与收获的情形；“不能”在上下文中自然表达饥荒造成的客观不可能。
- source_word: חָרִישׁ
  choice: 耕种
  rationale: 指翻土、耕作等农事；“耕种”比“犁地”涵盖面略广，在现代普通话中也更自然。
- source_word: קָצִיר
  choice: 收割
  rationale: 与耕种相对，指庄稼的收割或收获；“收割”准确保留具体的农业动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“这地遭遇饥荒已经两年了”清楚表达截至当时的持续状况；后半句以“还要有五年”呈现未来剩余时段。未添加原文没有明说的神学解释。
