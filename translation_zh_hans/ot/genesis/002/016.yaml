  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: zh_hans
  text: 雅威上帝吩咐那人说：“园中每棵树上的果子，你都可以吃[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你都可以吃”也可译作“你尽可吃”或“你可以随意吃”。希伯来文以同一词根的不定式绝对形和限定动词连用，强化“吃”的语气；此处是在表达充分的许可。
    reason: 说明原文的强调结构，以及在本语境中表示许可的译法。
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה表示带有权威的命令或嘱咐；“吩咐”在现代汉语叙事中自然庄重，也保留上对下发令的语气。
- source_word: יְהוָה אֱלֹהִים
  choice: 雅威神
  rationale: 将四字神名יְהוָה音译为“雅威”，并将אֱלֹהִים译为“神”，保留原文中的专名与称号组合。
- source_word: הָאָדָם
  choice: 那人
  rationale: 定冠词所指的是上文刚被造并安置在园中的那个男人，而非泛指全人类；“那人”既明确回指，也符合自然汉语。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常规希伯来语引语公式，汉语用“说”最自然。
- source_word: מִכֹּל עֵץ הַגָּן
  choice: 园中各样树上的果子
  rationale: 原文直译近于“从园中每一棵树”，但“吃树”在汉语中会产生误解；按希伯来语表达的实际所指补出“果子”，自然表达可从园中各样树取食之意。
- source_word: אָכֹל תֹּאכֵל
  choice: 你尽可吃
  rationale: 不定式绝对形与限定动词连用，加强“吃”的语气；在本语境中表示充分许可，“尽可吃”兼顾许可和强调。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名，而不是“主”这一称号；“雅威”较直接地按通常重构的读音音译，同时不把专名替换为头衔。
- issue: הָאָדָם的所指
  choice: 那人
  alternative: 人类
  rationale: 叙事语境指向此前被造并被安置在园中的单个男性人物；译作“人类”会把个体所指泛化。
- issue: אָכֹל תֹּאכֵל是命令还是许可
  choice: 充分许可（“尽可吃”）
  alternative: 强调命令（“一定要吃”）
  rationale: 虽然语法结构强化动词，但与下一节的禁令相对照时，本句是在划定获准食用的范围，不宜译成必须吃遍园中树木的命令。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吩咐……说”保留希伯来叙事公式；“尽可吃”避免生硬的“必定可以吃”，并使本节的许可与下一节的禁令形成清楚对照。
