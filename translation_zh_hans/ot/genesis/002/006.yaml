base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: zh_hans
  text: 却有雾气[a]从地上升起，滋润整个地面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“水流”或“泉流”。这个希伯来词很少见，可能指从地下涌出的水，而不是空中的雾气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: 不过，有雾气
  rationale: אֵד 是罕见词，词义存在争议；“雾气”与“上升”自然衔接。וְ 在此承接上文尚未降雨的情形，用“不过”表达转折。
- source_word: יַעֲלֶה
  choice: 上升
  rationale: עלה 的 Qal 未完成式在过去的描述语境中可表示惯常或持续发生的动作；汉语不必另加时态标记。
- source_word: מִן הָ/אָרֶץ
  choice: 从地上
  rationale: אֶרֶץ 在创造叙事中可指大地；“从地上”既自然，也准确表达水汽或水流由地而起。
- source_word: וְ/הִשְׁקָה
  choice: 滋润
  rationale: שקה 的 Hiphil 表示使之得水、浇灌；“滋润”适合此处自然供水的图景，也避免“灌溉”所带的人工技术色彩。
- source_word: אֶת כָּל פְּנֵי
  choice: 整个……面
  rationale: 该短语指全部表面或可见范围；合译为“整个地面”符合现代汉语。
- source_word: הָ/אֲדָמָה
  choice: 地面
  rationale: אֲדָמָה 指土地、土壤或地面；译作“地面”，并与前面的 אֶרֶץ“地上”保持适度区别。
theological_decisions:
- issue: אֵד 的解释
  choice: 雾气
  alternative: 水流、泉流
  rationale: “雾气”最容易与动词“上升”相配，但原词罕见，也可能指从地下涌出、浇灌土地的水流；正文不把不确定性绝对化，并在脚注保留其他合理解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“不过”连接上一节未降雨的背景；句子保持简洁，并借脚注保存罕见词 אֵד 的真实歧义。
