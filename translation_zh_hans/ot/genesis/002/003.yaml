  text: וַ/יְבָ֤רֶךְ אֱלֹהִים֙ אֶת י֣וֹם הַ/שְּׁבִיעִ֔י וַ/יְקַדֵּ֖שׁ אֹת֑/וֹ כִּ֣י ב֤/וֹ שָׁבַת֙ מִ/כָּל מְלַאכְתּ֔/וֹ אֲשֶׁר בָּרָ֥א אֱלֹהִ֖ים לַ/עֲשֽׂוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: zh_hans
  text: 上帝赐福给第七日，使这日成为圣日[a]，因为在这一天，他歇了自己所做的一切工，就是上帝所创造而做成的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把这日分别为圣”或“使这日成圣”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近似“就是上帝创造来做的”。末尾短语较难理解，也有人译作“就是上帝所创造、所做成的”，或理解为“就是上帝借着做工所创造的”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 赐福给
  rationale: ברך 的加强词干在这里表示上帝把福赐给第七日；“赐福给”既自然，也保留了施予福分的含义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此词与单数动词连用，在本段指独一的上帝；“上帝”是现代汉语中清楚、庄重的对应词。
- source_word: יּוֹם הַשְּׁבִיעִי
  choice: 第七日
  rationale: 直接对应带定冠词的序数词短语，并与创造叙事的逐日结构相呼应。
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: 使这日成为圣日
  rationale: קדש 的加强词干表示使之为圣或分别为圣；此译法在现代汉语中自然，并保留“圣”的核心概念。
- source_word: כִּי
  choice: 因为
  rationale: 引出上帝赐福并使第七日为圣的原因。
- source_word: בּוֹ
  choice: 在这一天
  rationale: 代词所指的是第七日；在汉语中明说“这一天”比直译“在它里面”自然清楚。
- source_word: שָׁבַת
  choice: 歇了
  rationale: 该动词基本义为停止、止息；“歇了”既能表达停止工作，也保留与安息主题的联系，同时不必暗示上帝因疲倦而休息。
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: 自己一切的工
  rationale: מלאכה 指工作、工程或所做之事；“工”简洁庄重，适合创造语境。
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: 就是上帝所创造而做成的
  rationale: 原文末尾的不定式结构较难确定。“创造而做成”在汉语中可读，并保留 ברא 与 עשה 两个不同动词；脚注说明更贴近形式的译法及其他可能理解。
theological_decisions:
- issue: שָׁבַת 与安息主题的关系
  choice: 歇了
  alternative: 停止了／止息了
  rationale: “歇了”保留经文与第七日安息主题的联系，但不明确断言上帝因疲劳而需要休息；脚注保留“停止”的词义。
- issue: וַיְקַדֵּשׁ אֹתוֹ 的圣洁含义
  choice: 使这日成为圣日
  alternative: 把这日分别为圣／使它成圣
  rationale: 主文使用普通读者容易理解的表达，同时保留第七日被赋予圣洁地位的神学分量，不把“圣”淡化为仅仅“特别”。
- issue: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת 的难解结构
  choice: 就是上帝所创造而做成的
  alternative: 就是上帝创造来做的／就是上帝所创造的一切作为
  rationale: 原文“创造……去做”在句法和语义上存在真实困难。主文采用较自然但不过度扩展的译法，脚注明示直译及其他理解，避免把一种解释伪装成唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“圣日”“歇了”“一切的工”保留创世叙事的凝练语气；对原文末句的句法困难不在主文中加入额外教义解释，而以脚注保存其歧义。
