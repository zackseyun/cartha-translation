  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: zh_hans
  text: 有一条河从伊甸流出，灌溉那园子；从那里分开，成为四个主要分流[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“四个头”；这里指这条河分开后形成的四个主要分流。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: 有一条河
  rationale: נָהָר意为“河”；句首וְ承接上下文，现代汉语无需机械译成“并且”。用“有一条河”自然引出本句所述的河。
- source_word: יֹצֵא מֵעֵדֶן
  choice: 从伊甸流出
  rationale: יצא分词表示河持续流出，מִן表示来源；“从伊甸流出”准确而自然。
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: 灌溉那园子
  rationale: 不定式表示目的；שׁקה在此指使园子得到水。“灌溉”贴合河水供应园子的语境，“那园子”承接前文已经提到的园子。
- source_word: וּמִשָּׁם יִפָּרֵד
  choice: 从那里，这河分开
  rationale: מִשָּׁם表示“从那里”；פרד的Nifal形式可表达“分开”或“被分开”。这里保留不及物表达，不额外指定施动者。
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: 成为四条河道
  rationale: היה配合לְ表示形成的结果；רָאשִׁים字面是“头”，在此指河分开后形成的主要水道。“河道”比“四个头”更便于现代读者理解，同时脚注保留原文字面意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；用分号呈现河流先灌溉园子、继而分流的两个阶段。未把句首连接词机械译出，也未将רָאשִׁים过度具体化为现代水文学意义上的“源头”或“支流”。
