  source_fidelity: 正文把“בְעֵדֶן מִקֶּדֶם”译为“在伊甸的东边”，在现代汉语中通常会理解为“在伊甸之外、其东侧”，未能清楚表达希伯来文所指花园位于伊甸之内而处于东方／东部。应改为“在伊甸东部”，并保留脚注中的方向性译法。其余内容忠实反映原文：耶和华上帝栽种园子，并将他所形成的那人置于那里。
