  terminology: “耶和华上帝”适当地呈现复合神名；“伊甸”为通行地名；“园子”“那人”“安置”均与本节语境相称。“造”虽较“形成”略宽泛，仍可接受；为贴近 יצר，修订为“塑造”更能保留其形成、塑制的意象，而不引入额外神学含义。
