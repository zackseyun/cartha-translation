- from: 耶和华上帝在伊甸的东边[a]栽种了一个园子，把他所造的那人安置在那里。
  to: 耶和华上帝在伊甸东部[a]栽种了一个园子，把他所塑造的那人安置在那里。
  rationale: 修订将地点明确为花园位于伊甸之内的东部，同时以脚注保留 מִקֶּדֶם 可表示方向的歧义。将“所造的”改为“所塑造的”，更贴近 יצר 的词义；其余措辞维持原稿的准确性、自然度与庄重语体。
