  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: zh_hans
  text: 耶和华上帝在伊甸东部[a]栽种了一个园子，把他所塑造的那人安置在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在伊甸向东的地方”。希伯来语这一短语可表示东方的地点，也可表示朝向或方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: 栽种
  rationale: נטע在此指栽种植物；“栽种”自然、准确，也保留园子的具体意象。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 将四字神名音译为“耶和华”，并以现代普通话常用的“上帝”表达 אֱלֹהִים，保留复合称谓。
- source_word: גַּן
  choice: 园子
  rationale: גן指经过栽植或围护的园地；“园子”符合本段叙事语体，并与“栽种”搭配自然。
- source_word: בְעֵדֶן
  choice: 在伊甸
  rationale: עֵדֶן在此为地名，按通行中文译名音译作“伊甸”。
- source_word: מִקֶּדֶם
  choice: 在东边
  rationale: 该短语在此可理解为地点方位；“在东边”用语自然，同时以脚注保留“向东”的可能解释。
- source_word: וַיָּשֶׂם
  choice: 安置
  rationale: שׂים意为放置、安放；对人使用“安置”比“放”更自然庄重，又不额外说明其职责。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达地点副词“那里”，并清楚回指园子。
- source_word: הָאָדָם
  choice: 那人
  rationale: 带定冠词的单数名词在此指前文由上帝所造的特定之人；“那人”既保留具体指称，也避免把普通名词过早处理为专名。
- source_word: אֲשֶׁר יָצָר
  choice: 他所造的
  rationale: יצר本义为塑造、形成；中文“所造的”简洁自然，并由上下文清楚表达先形成、后安置的次序。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用中文圣经传统中最广为人知的音译“耶和华”，明确呈现专有神名，而不以“主”替代。
- issue: הָאָדָם 的指称
  choice: 那人
  alternative: 那个人／人类
  rationale: 本节所指是上文已经形成的单个具体人物，不是泛指全人类；“那人”也保留其在此仍为普通名词的性质。
- issue: מִקֶּדֶם 的方位含义
  choice: 在东边
  alternative: 向东
  rationale: 地点解释在本句中通顺且常见，但希伯来语也可表达朝向或方向，因此不在正文中排除另一读法，而以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“栽种了一个园子”贴近现代汉语表达；“安置”避免口语化的“放”，同时没有增添原文未明说的目的或职分。
