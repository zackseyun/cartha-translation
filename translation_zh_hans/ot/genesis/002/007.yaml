id: GEN.2.7
reference: Genesis 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: zh_hans
  text: 耶和华上帝用地上的尘土造了那人[a]，把生命之气吹进他的鼻孔里，那人就成了有生命的活物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”（אָדָם，adam）与“地”（אֲדָמָה，adamah）在希伯来语中音义相关，中文难以保留这一文字呼应。
    reason: wordplay
  - marker: b
    text: 或译“有生命的存在”；传统译法作“有灵的活人”。这里的“活物”指完整的、活着的受造者，并非专指与身体分离的灵魂。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 将专名与神的通称并列译出，既保留圣约之名，也符合现代汉语表达。
- source_word: וַיִּיצֶר
  choice: 造了
  rationale: 原词有塑造、形成之意；“造了”自然简洁，并在上下文中保留亲手塑造的具体意象。
- source_word: הָאָדָם
  choice: 那人
  rationale: 此处指叙事中正在被造的那个具体的人，而非抽象的全人类；“那人”也避免过早把普通名词直接专名化为“亚当”。
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: 用地上的尘土
  rationale: 准确表达材料来自土地；“地”与“人”的希伯来语文字关联无法在中文中直接重现，故以脚注说明。
- source_word: בְּאַפָּיו
  choice: 进他的鼻孔里
  rationale: 保留动作的身体性和原文具体形象，现代汉语也自然。
- source_word: נִשְׁמַת חַיִּים
  choice: 生命之气
  rationale: 这是表示赋予生命的气息的希伯来语结构；“生命之气”庄重、简明，不把它预先解释为独立的灵魂实体。
- source_word: וַיְהִי
  choice: 就成了
  rationale: 准确表达进入某种状态的转变，并体现叙事结果。
- source_word: לְנֶפֶשׁ חַיָּה
  choice: 有生命的活物
  rationale: נֶפֶשׁ在这里指完整的、有生命的受造者，并非特指与身体分离的非物质灵魂；该短语也用于动物。“活物”保留其较宽的词义范围。
theological_decisions:
- issue: הָאָדָם是译作具体的“那人”，还是泛指“人类”
  choice: 那人
  alternative: 人；人类；亚当
  rationale: 语法和叙事语境首先指一个具体的人。“那人”保留普通名词性质，同时不否认他在后文可能具有代表全人类的作用。
- issue: לְנֶפֶשׁ חַיָּה是否译为“有生命的灵魂”
  choice: 有生命的活物
  alternative: 有生命的人；有生命的存在；有生命的灵魂
  rationale: 原文描述那人成为一个完整的活着的受造者，并未明确提出身体与灵魂二分。“活物”也与该表达在创世记中用于其他动物的范围相呼应。
- issue: 神的专名是否明译
  choice: 耶和华上帝
  alternative: 主上帝
  rationale: 原文明确使用四字神名יהוה，故在正文中以中文传统音译“耶和华”保留专名，不以称号取代。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“耶和华上帝”保留神名；“那人”保持此处普通名词的叙事功能；脚注分别说明希伯来语文字呼应及נֶפֶשׁ חַיָּה的译法张力。
