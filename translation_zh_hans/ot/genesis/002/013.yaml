  text: וְ/שֵֽׁם הַ/נָּהָ֥ר הַ/שֵּׁנִ֖י גִּיח֑וֹן ה֣וּא הַ/סּוֹבֵ֔ב אֵ֖ת כָּל אֶ֥רֶץ כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: zh_hans
  text: 第二条河名叫基训[a]；这条河环绕古实全地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基训”是这条河的希伯来语名称。
    reason: name_note
  - marker: b
    text: “古实”是古代地名，传统上与埃及以南的地区有关；这里保留希伯来原文中的古名。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם הַ/נָּהָר הַ/שֵּׁנִי
  choice: 第二条河名叫
  rationale: וְ承接上文，汉语按自然叙述可不另译“和”；“第二条河名叫”准确表达河流的次序与名称，简洁自然。
- source_word: גִּיחוֹן
  choice: 基训
  rationale: 专名按希伯来语音译，并采用现代中文圣经读者较熟悉的译名。
- source_word: הוּא
  choice: 这条河
  rationale: 该代词回指基训河；汉语重复“这条河”比直译“它”更清楚，也保留辨识、说明的作用。
- source_word: הַ/סּוֹבֵב
  choice: 环绕
  rationale: סבב的分词可表示“绕行、环绕、围绕”；“环绕”简洁地保留其空间关系，同时不强行判定具体地形。
- source_word: אֵת כָּל אֶרֶץ
  choice: 全地
  rationale: אֵת为宾语标记，不单独翻译；כָּל אֶרֶץ在此自然译为“全地”，表示古实全部的土地或地域。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 保留古代地名本身，不以“埃塞俄比亚”等后世地理名称替代，避免时代错置。
