  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: zh_hans
  text: 第一条河名叫比逊；它环绕[a]哈腓拉全地，那里有金子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“绕行哈腓拉全地。”希伯来语分词可表示绕行、环绕或围绕。
    reason: 保留הַסֹּבֵב在河流语境中既可强调绕行、也可强调环绕的词义幅度。
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: 第一条河名叫
  rationale: 结合上文四条河的次序，הָאֶחָד在这里具有序数含义；补出“河”使现代汉语指代清楚。“名叫”自然表达שֵׁם所引出的名称。
- source_word: פִּישׁוֹן
  choice: 比逊
  rationale: 按现代中文圣经人名地名音译惯例处理河名。
- source_word: הוּא הַסֹּבֵב
  choice: 它环绕
  rationale: הוּא回指比逊河；סבב分词表达持续绕行或环绕的地理关系。“环绕”贴近原文，也不额外加入“流”这一原文未明说的动作。
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: 哈腓拉全地
  rationale: כָּל修饰整个名为哈腓拉的地域；“全地”简洁保留其范围含义，哈腓拉按惯例音译。
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: 那里有金子
  rationale: אֲשֶׁר שָׁם是地点关系表达，“那里有”符合现代汉语；הַזָּהָב在此指当地存在的金，译作“金子”自然清楚。
