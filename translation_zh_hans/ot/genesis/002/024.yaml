source:
  edition: WLC
  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: zh_hans
  text: 因此，男人要离开父亲和母亲，与自己的妻子紧紧相连[a]，他们就成为一体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“紧紧依附于”或“与……联合”。希伯来语动词含有牢固依附或黏合的意思。
    reason: lexical_alternative
  - marker: b
    text: “一体”原文直译为“一个肉身”，既包括身体的结合，也包括形成新的亲属联结。
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 表示由前文叙事得出的结论；“因此”自然、庄重，并保留推论关系。
- source_word: יַעֲזָב
  choice: 要离开
  rationale: 此处未完成式表达普遍而带规范性的原则。“要离开”保留这种意味，又不把原文强化为直接命令；“离弃”在现代汉语中语气过重。
- source_word: אִישׁ
  choice: 男人
  rationale: 原文使用阳性单数，代表婚姻中的男性一方；“男人”准确保留其性别指向。
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: 父亲和母亲
  rationale: 原文分别明说父亲与母亲，故不合并简化为“父母”。
- source_word: וְדָבַק
  choice: 与……紧紧相连
  rationale: דבק表达牢固的依附、黏合或联结。“紧紧相连”在现代汉语中自然，并保留其强烈而持久的联结意味。
- source_word: בְּאִשְׁתּוֹ
  choice: 与妻子
  rationale: אִשָּׁה在所有格及婚姻语境中明确指“妻子”。介词ב与דבק连用，整体自然译作“与妻子紧紧相连”。
- source_word: וְהָיוּ
  choice: 他们就成为
  rationale: 复数动词所指为男人和他的妻子；“就成为”自然表达前述联结所产生的结果。
- source_word: לְבָשָׂר אֶחָד
  choice: 一体
  rationale: 直译为“一个肉身”。正文用现代汉语惯用的“一体”，兼顾身体结合与新亲属共同体的含义，并以脚注保留原文意象。
theological_decisions:
- issue: 婚姻表述中的性别明确性
  choice: 男人
  alternative: 人；一个人
  rationale: 原文明确使用阳性单数אִישׁ。译为“男人”不以中性语言消解原文的性别指向。
- issue: 句子的规范性质
  choice: 用“要……就成为”表达普遍而带规范性的原则
  alternative: 译成直接命令；译成仅描述古代习俗的陈述
  rationale: 希伯来语动词形式在这里陈述一个以创造叙事为根据的普遍原则，并非显式祈使句，也不只是过去习俗。
- issue: “一体”的含义范围
  choice: 保留身体结合与新亲属联结两方面的张力
  alternative: 只解释为性结合；只解释为社会或盟约关系
  rationale: בָשָׂר אֶחָד的意象包含身体层面，也指向由婚姻形成的新亲属共同体；正文和脚注不将其缩减为单一层面。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“父亲和母亲”保留原文逐一列举；“紧紧相连”避免古奥表达，同时传达דבק的力度；“一体”符合现代汉语习惯，原文的“肉身”意象由脚注说明。
