base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: zh_hans
  text: 第三条河名叫希底结[a]；它流经亚述以东[b]。第四条河是幼发拉底河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希底结”传统上被认定为底格里斯河。
    reason: alternative_reading
  - marker: b
    text: “亚述”也可指亚述地区；本短语可理解为“在亚述地区以东”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: 名叫
  rationale: 在“某河的名字”这一命名句式中，现代汉语用“名叫”更自然，同时完整保留命名含义。
- source_word: נָּהָר
  choice: 河
  rationale: 该词通常指河流；此处按上下文直译为“河”。
- source_word: שְּׁלִישִׁי
  choice: 第三条
  rationale: 直译序数，并用量词“条”配合“河”，符合现代汉语习惯。
- source_word: חִדֶּקֶל
  choice: 希底结
  rationale: 按希伯来名称音译，保留原文地名形式；传统上与底格里斯河对应，置于脚注说明。
- source_word: הוּא הַהֹלֵךְ
  choice: 流
  rationale: 原文直义为“它是那行走的”；描述河流时译作“流”自然清楚，也保留其延展方向的含义。
- source_word: קִדְמַת
  choice: 东边
  rationale: 在地理语境中取“在……以东”的意义，不采用较含混的“前面”。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 保留专名“亚述”；它既可能指同名地域，也可能带有专名本身的开放性，因此脚注提示“亚述地”这一理解。
- source_word: רְבִיעִי
  choice: 第四条
  rationale: 直译序数，并采用与前句一致的汉语量词。
- source_word: פְרָת
  choice: 幼发拉底河
  rationale: 采用现代汉语中对该河约定俗成、辨识度最高的名称。
