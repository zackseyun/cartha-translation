  terminology: “耶和华神”适当地对应יהוה אלהים；“那人”忠实保留带定冠词的普通名词用法，并以脚注保留“亚当”的传统专名理解。“活物”在本处适合对应נפש חיה，未不当地附加“灵魂”的神学含义。脚注标记均有对应位置，内容与正文和原文歧义一致。
