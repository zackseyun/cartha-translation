id: GEN.2.19
reference: Genesis 2:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: zh_hans
  text: '耶和华神从地里塑造了野地的各种走兽和天空的各种飞鸟[a]，把它们带到那人[b]面前，要看看他会给它们叫什么。那人给每一个活物叫什么，那就是它的名字。


    [a] “塑造了”也可按上下文理解为“先前已经塑造了”。希伯来语动词本身通常按一般过去的叙事动作理解，并未明确标示先后时间。

    [b] 或译“亚当”。希伯来语是“那人”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塑造了”也可按上下文理解为“先前已经塑造了”。希伯来语动词本身通常按一般过去的叙事动作理解，并未明确标示先后时间。
    reason: 保留叙事时态及动作先后关系上的真实歧义。
  - marker: b
    text: 或译“亚当”。希伯来语是“那人”。
    reason: 说明普通名词与专名两种可能理解。
lexical_decisions:
- source_word: וַיִּצֶר
  choice: 塑造了
  rationale: 动词表示塑造、形成；采用一般过去的叙事表达，贴近 wayyiqtol 的通常功能，同时以脚注保留按语境理解为更早动作的可能。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华神
  rationale: 直译复合称谓，使用现代中文圣经语体中清楚而庄重的表达。
- source_word: מִן הָאֲדָמָה
  choice: 从地里
  rationale: 保留“地、土壤”的含义，也维持本段中人与地之间的词义联系。
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: 野地的各种走兽
  rationale: חַיַּת הַשָּׂדֶה 指野地或田野中的陆生动物；“各种”自然表达 כָּל 在类别集合中的范围。
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: 天空的各种飞鸟
  rationale: 按此处最可能的所指译为飞鸟，并保留“天空”的空间表达。
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: 把它们带到那人面前
  rationale: 中文补出由前文集合名词所指的复数宾语；הָאָדָם 保留为带定指的普通名词“那人”。
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: 要看看他会给它们叫什么
  rationale: 保留目的结构以及 קרא 的“叫、称呼”含义，中文表达自然。
- source_word: נֶפֶשׁ חַיָּה
  choice: 活物
  rationale: 这里指有生命的动物；“活物”简洁准确，不引入“灵魂”等后期神学联想。
- source_word: הוּא שְׁמוֹ
  choice: 那就是它的名字
  rationale: 自然呈现希伯来语无系词判断句，并保留命名结果的确定性。
theological_decisions:
- issue: וַיִּצֶר 与创世记第一章创造次序的叙事时态关系
  choice: 正文译为一般叙事动作“塑造了”
  alternative: 先前已经塑造了
  rationale: 希伯来语形式本身没有明确标示过去完成时。正文避免为协调时间次序而把一种解释写入经文，同时脚注说明按上下文作先行动作理解的可能。
- issue: הָאָדָם 是普通名词还是专名
  choice: 那人
  alternative: 亚当
  rationale: 原文带定冠词，最直接是“那人”，且上下文仍利用 אָדָם 与 אֲדָמָה 的关联；传统专名理解以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“塑造”“野地”“活物”保持创世叙事的文学质感，但避免古奥句法；重复“叫什么”以保留原文命名动词的呼应。
