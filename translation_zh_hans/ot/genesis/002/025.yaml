base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: zh_hans
  text: 那人和他的妻子二人都赤身露体[a]，并不觉得羞耻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他们二人都赤身露体”，强调二人都没有穿衣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 都……（是）
  rationale: 此处是叙事中的过去时状态表达；现代汉语不必明译系词，用“都赤身露体”自然呈现。
- source_word: שְׁנֵיהֶם
  choice: 二人都
  rationale: 既保留“他们两个”的强调，又符合现代汉语表达。
- source_word: עֲרוּמִּים
  choice: 赤身露体
  rationale: 准确表达没有穿衣的状态，庄重而清楚；希伯来语与下一节“狡猾”一词的近音关系难以在汉语中自然重现。
- source_word: הָאָדָם
  choice: 那人
  rationale: 上下文指与妻子相对的那个男人；“那人”也延续创世记本段对特定人物的指称。
- source_word: וְאִשְׁתּוֹ
  choice: 和他的妻子
  rationale: 忠实表达名词及第三人称阳性单数所属后缀，保留婚姻关系。
- source_word: וְלֹא
  choice: 却并不
  rationale: “不”表达否定；“却”自然呈现赤身状态与不觉羞耻之间的语意反差。
- source_word: יִתְבֹּשָׁשׁוּ
  choice: 觉得羞耻
  rationale: 该形式表示经历或感受到羞耻；此译比“尴尬”更准确，也符合现代汉语习惯。
theological_decisions:
- issue: הָאָדָם 在本节中的所指
  choice: 那人
  alternative: 那个人／人
  rationale: 本节把他与“他的妻子”并列，所指是叙事中的男性个体，而非泛指全人类；此译不额外引入更广泛的人论结论。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“赤身露体”比口语化的“光着身子”更符合经文语体；“觉得羞耻”明确表达内在的羞耻感。
