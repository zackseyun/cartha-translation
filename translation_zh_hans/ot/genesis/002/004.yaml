base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: zh_hans
  text: 这是天地的来历[a]：在它们被创造时，就是耶和华上帝造地和天的时候[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来历”原文也可译作“后代”“起源”或“记述”；这个希伯来词常用作《创世记》各段落的标题。
    reason: lexical_alternative
  - marker: b
    text: “……的时候”直译为“在……的日子”，在这里是表示“当……时”的希伯来语习惯说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: 这是……的来历
  rationale: 该短语是《创世记》的分段公式。希伯来语虽用复数指示词，但现代汉语以“这是……的来历”更自然；“来历”保留 תוֹלְדוֹת 可指起源、后续发展或记述的语义宽度。
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: 天地
  rationale: “天地”是现代汉语中自然、庄重的整体性表达，准确传达该希伯来语并列词组所指的受造秩序；汉语不以复数形态对应 שָׁמַיִם。
- source_word: בְּהִבָּרְאָם
  choice: 被创造时
  rationale: 以时间结构表达介词 בְּ 加不定式的作用，并保留 ברא 的尼法勒式被动意义。
- source_word: בְּיוֹם עֲשׂוֹת
  choice: 造……的时候
  rationale: בְּיוֹם 在这里是时间习语，不必限定为一个自然日；译作“……的时候”符合现代汉语并避免增加原文没有的时间结论。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 将四字神名 יְהוָה 音译为汉语中通行的“耶和华”，并将 אֱלֹהִים 译为“上帝”；不以“主”替代原文专名。
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: 地和天
  rationale: 保留本句末尾相对于前文“天地”的倒置次序，以呈现原文的文学结构；补出汉语连接词“和”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用现代简体中文圣经传统中辨识度较高的“耶和华”；“雅威”是依据学界常见拟音的可行替代，但原始发音并非完全确定。
- issue: בְּיוֹם 是否指一个自然日
  choice: 译作“……的时候”
  alternative: “在……的日子”
  rationale: 该结构在希伯来语中可作时间习语，表示“当……时”。正文不把它解释性地限定为二十四小时，也不排除上下文可能涉及“日”的概念。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“这是……的来历”作为标题式起句，避免生硬的“这些是……的世代”；末句刻意保留“地和天”的逆序。所有脚注标记均已置于正文相应位置。
