  rationale: 仅作汉语句法与衔接的轻微调整：“把……建造成了……”明确了原文的宾语关系；以“并”连接后续动作，使叙事更流畅。保留神名、普通名词“那人”、传统的“肋骨”译法以及“建造”的词汇意象。
