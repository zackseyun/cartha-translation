  text: וַ/יִּבֶן֩ יְהוָ֨ה אֱלֹהִ֧ים אֶֽת הַ/צֵּלָ֛ע אֲשֶׁר לָקַ֥ח מִן הָֽ/אָדָ֖ם לְ/אִשָּׁ֑ה וַ/יְבִאֶ֖/הָ אֶל הָֽ/אָדָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: zh_hans
  text: 耶和华上帝就把从那人身上取下的肋骨建造成了一个女人，并把她带到那人面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 建造成
  rationale: 保留希伯来语“建造”的具体意象，而不弱化为泛指的“做成”；“建造成一个女人”在现代汉语中虽略带文学色彩，却清楚、庄重。
- source_word: הַצֵּלָע
  choice: 肋骨
  rationale: 该词也可指“侧边、旁边”，但在这里传统且合乎语境的理解是从人体取出的“肋骨”；上下文没有足够理由改译为“身体的一侧”。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 以“耶和华”呈现神名，以“上帝”表达 אֱלֹהִים，符合现代简体中文圣经语体，并保留两个称谓的组合。
- source_word: הָאָדָם
  choice: 那人
  rationale: 此处带定冠词，仍是普通名词“那人”，不提前将其专名化为“亚当”。
- source_word: וַיְבִאֶהָ אֶל־הָאָדָם
  choice: 把她带到那人面前
  rationale: 自然表达动作对象与方向；“面前”在汉语中恰当地传达“带到那人那里”，并未增加新的神学含义。
theological_decisions:
- issue: “建造”女人的措辞
  choice: 保留“建造成”
  alternative: 做成／造成
  rationale: 原文刻意使用建筑动词 בנה；保留其意象可避免抹平叙事措辞，但不进一步解释其象征意义。
- issue: הַצֵּלָע 的解剖含义
  choice: 译作“肋骨”
  alternative: 身体的一侧／侧边
  rationale: 原词存在较宽的词义范围；本节传统语境支持“肋骨”，但不据此引申关于男女本质或等级的教义。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。句式紧凑，保留原文“取下—建造—带来”的叙事推进；不添加原文没有的解释性内容。
