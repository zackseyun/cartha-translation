base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: zh_hans
  text: 天地及其中的一切都完成了[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都齐备了”。
    reason: lexical_alternative
  - marker: b
    text: “其中的一切”所译的希伯来语也可指“军队”或成列的群体；这里指充满天与地的一切。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: 完成了
  rationale: 该词是כלה的被动式连续叙事形态，表达天地及其全部内容达到完成、齐备的状态。“完成了”自然保留其被动结果义，不改写为主动的“造完了”或“上帝完成了”。
- source_word: הַשָּׁמַיִם
  choice: 天
  rationale: 在创世语境中，שָׁמַיִם指受造的天界；汉语固定搭配“天地”自然、庄重，也不局限于可见的天空。
- source_word: וְהָאָרֶץ
  choice: 和地
  rationale: 此处אֶרֶץ指与天相对的整个地上领域，而非某一片地方或土地；与“天”合译为“天地”。
- source_word: וְכָל
  choice: 其中的……全体（由“万”体现）
  rationale: כָּל具有总括义。“万象”中的“万”在现代汉语中表示包罗全部，并由“其中的”清楚表明这些属于天地。
- source_word: צְבָאָם
  choice: 其中的万象
  rationale: צָבָא可指军队、成列的众多事物或整体阵列；带第三人称复数后缀时意为“它们的众军／万有”。“万象”在汉语中自然概括天地间一切受造之物，同时脚注保留原词“成列群体”的意象。
theological_decisions:
- issue: “其中的万象”（צְבָאָם）的范围
  choice: 概括天与地中全部的内容和所属之物
  alternative: 主要指天体，或着重描绘如军队般排列的群体
  rationale: 本句总结整个创造秩序的完成；“天地”这一总体框架支持全面理解。不过原词也可用于军队和天上众星，因此正文采用不狭化范围的“万象”，并在脚注说明其成列群体的词义背景。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“天地”符合汉语宇宙整体的惯常表达；“万象”比生硬的“众军”更易懂，脚注则保留希伯来语的集合与排列意象。将“就这样”置于谓语前，作为对创世记第一章创造叙事的总结。
