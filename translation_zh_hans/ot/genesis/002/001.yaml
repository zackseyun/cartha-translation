  naturalness: “天地及其中的一切都完成了”是自然、庄重的现代书面语，也保留原文完成状态的表述，未擅自补出执行完成动作的主语。
  terminology: “天地”恰当地对应创世语境中的“诸天和地”。“其中的一切”对应“它们的一切军旅／全体”，并借脚注说明צָבָא所含的“军队、队列、群体”词义背景，避免正文采用容易误解为字面军队的措辞。
