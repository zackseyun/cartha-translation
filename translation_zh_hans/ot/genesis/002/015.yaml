id: GEN.2.15
reference: Genesis 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: zh_hans
  text: 于是，耶和华上帝把那人安置在伊甸园里，让他耕作并看守园子[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耕作并看守”也可译作“料理并守护”或“服事并守护”。这两个希伯来语动词的含义包括工作、耕种、服事，以及看守、守护、照管。
    reason: lexical_alternative
  - marker: b
    text: “安置”也可译作“使他安歇”或“使他定居”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 保留神的专名与通用称号；“耶和华上帝”在现代中文圣经语体中自然、庄重。
- source_word: הָאָדָם
  choice: 那人
  rationale: 上下文指先前受造的特定男子，而非泛指全人类；“那人”也保留定冠词的指称作用。
- source_word: וַיִּקַּח
  choice: 把……
  rationale: 希伯来文直义为“取、带”；与后面的“安置”合译成自然的中文处置式，避免生硬地译作“拿起那人”。
- source_word: וַיַּנִּחֵהוּ
  choice: 安置
  rationale: 该词的使役形可表示“使安歇、使定居、安放”；“安置”适合迁入园中的叙事语境，同时保留安顿、定居的意味。
- source_word: בְּגַן עֵדֶן
  choice: 在伊甸园里
  rationale: 准确表达地点，并采用现代中文通行的专名“伊甸园”。
- source_word: לְעָבְדָהּ
  choice: 耕作园子
  rationale: עבד可指工作、服事或耕种；以园子为宾语时，“耕作”是自然的语境义，但脚注保留较宽的“料理、服事”可能。
- source_word: וּלְשָׁמְרָהּ
  choice: 看守园子
  rationale: שמר涵盖看守、守护、照管；“看守”既可表达照料，也不排除保护之义。
theological_decisions:
- issue: 人在伊甸园中任务的性质
  choice: 按通常语境译为耕作并看守园子，不在正文中指定为祭司职分或纯粹农业劳动。
  alternative: 将两个动词专门译作“事奉、守护”，以突出圣所或祭司意象。
  rationale: עבד与שמר既有日常劳动和看护的意义，也可能在其他经文中用于礼仪性服事与守卫；本节本身不足以排他性地确定一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。正文以“耕作并看守”清楚表达园中职责，脚注保留动词较宽的词义及潜在神学张力。
