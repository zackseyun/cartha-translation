  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: zh_hans
  text: 耶和华上帝说：“那人独自一人不好。我要为他造一个与他相配的帮助者[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他相配的帮助者”也可译作“与他对应的帮助者”或“适合他的帮助者”。希伯来语表示一位与他相对、相应的人，并不只是地位较低的助手。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 保留神的专名与通用称号的组合；“耶和华”是现代中文圣经语境中对四字神名的通行音译，“上帝”自然表达 אֱלֹהִים。
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: 那人独自一人不好
  rationale: 按希伯来语的评价结构直译，同时以自然中文表达该男子处于孤单状态并非美善；“那人”指前文所造的具体之人。
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: 我要为他造
  rationale: 未完成式在此表达上帝的意向；לּוֹ 译作“为他”，保留受益关系。
- source_word: עֵזֶר
  choice: 帮助者
  rationale: 该名词指提供帮助的一位；“帮助者”比抽象的“帮助”更符合这里将被造之对象的个体性，本词本身不表示地位较低。
- source_word: כְּנֶגְדּוֹ
  choice: 与他相配的
  rationale: 表达面对他、与他对应或匹配之意；“与他相配”自然且保留关系上的对应性，不额外断定高下。
theological_decisions:
- issue: הָאָדָם 在本节所指
  choice: 那人
  alternative: 人；人类
  rationale: 上下文所指是园中先前被造的那个具体男子，而非仅仅抽象的人类；“那人”也保留定冠词的回指作用。
- issue: עֵזֶר כְּנֶגְדּוֹ 是否含有等级意味
  choice: 与他相配的帮助者
  alternative: 适合他的助手；与他对应的帮助者
  rationale: 原文兼有帮助与对应的含义，却未说明帮助者低于或高于那人；译文不引入这种等级结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“独自一人不好”简洁保留原文判断；脚注说明 כְּנֶגְדּוֹ 的词义范围及其不必然包含的等级意味。
