id: GEN.2.20
reference: Genesis 2:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: zh_hans
  text: 那人给所有的牲畜、天空的飞鸟和一切田野的走兽都起了名字；可是，那人没有找到与他相配的帮助者。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那人”也可译作“亚当”。
    reason: alternative_reading
  - marker: b
    text: “与他相配的”也可译作“与他对应的”或“适合他的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: 那人
  rationale: 首处带定冠词，指叙事中那一位具体的人，而非抽象的全人类；译作“那人”保留普通名词色彩，也自然回指上文。末处虽不带冠词，仍指同一人。
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: 起了名字
  rationale: 这是“赋予名称、命名”的习语；“起了名字”既贴近复数“名字”，又符合现代汉语表达。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 此处指与田野走兽相对的家养动物类别；“牲畜”简明、自然。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: 保留“天空”的原文意象，并以“飞鸟”自然表达 עוֹף 在本语境中的所指。
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: 一切田野的走兽
  rationale: 保留“田野”的具体意象，并与“牲畜”和“飞鸟”区分；“走兽”在庄重现代汉语中可自然指陆地野生动物。
- source_word: עֵזֶר
  choice: 帮助者
  rationale: 这里所指的是一位提供帮助、与那人相配的对象。“帮助者”不含低人一等之意，也不预先限定其角色。
- source_word: כְּנֶגְדּוֹ
  choice: 与他相配的
  rationale: 该词包含面对、对应和相称的关系意涵；“与他相配”在现代汉语中自然，同时避免把这种关系过度解释为单纯适用或从属。
- source_word: לֹא מָצָא
  choice: 没有找到
  rationale: 希伯来文是主动式第三人称阳性单数，直译为“他没有找到”。中文采用主动表达自然，并保留原文语法视角；主语按上下文明确为“那人”。
theological_decisions:
- issue: אָדָם 在创世记2:20中的译法
  choice: 那人
  alternative: 亚当
  rationale: 本节讲的是园中那一位具体的人，首处又带定冠词，因此普通名词意义仍然明显。“那人”保留叙事发展的层次；同时，“亚当”作为逐渐专名化的理解也有可能，故列入脚注。
- issue: עֵזֶר כְּנֶגְדּוֹ 的关系含义
  choice: 与他相配的帮助者
  alternative: 适合他的帮助者；与他对应的帮助者
  rationale: 原文同时表达帮助与面对、对应、相称的关系；本译法不把“帮助者”解释为从属地位，也不把 כְּנֶגְדּוֹ 的张力缩减为单纯“合用”。
- issue: לֹא מָצָא 的主语
  choice: 那人没有找到
  alternative: 没有为那人找到
  rationale: 马所拉文本的动词是主动式“他没有找到”，其主语自然承接“那人”。结果式或非人称译法在目标语中也可成立，但主动译法更直接保留原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“牲畜—飞鸟—走兽”形成清楚并列；分号显出命名行动与未找到相配帮助者之间的转折。脚注标记均置于相关句末。
