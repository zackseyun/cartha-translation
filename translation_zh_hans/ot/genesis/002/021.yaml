  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: zh_hans
  text: 于是，耶和华上帝使那人沉睡；他睡着后，耶和华上帝取下他的一根肋骨[a]，又在原处把肉合上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他身体的一侧”或“侧部”。希伯来语这个词可指“肋骨”，也可指“侧面”或“侧部”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל ... תַּרְדֵּמָה
  choice: 使……沉沉睡去
  rationale: 使役形态表达“使……进入沉睡”；中文用“沉沉睡去”自然传达深度睡眠及动作结果。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 以“耶和华”音译神的专名，以“上帝”表达 אֱלֹהִים；组合称谓清楚、庄重。
- source_word: הָאָדָם
  choice: 那人
  rationale: 本段指叙事中的特定男性个体；“那人”既保留定指，也符合现代汉语叙事。
- source_word: וַיִּישָׁן
  choice: 他睡着后
  rationale: 原文直陈“他睡了”，中文在连续叙事中用“睡着后”自然衔接随后取肋骨的动作，并未增加新的事件。
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: 他的一根肋骨
  rationale: צֵלָע 可指“肋骨”或“侧面、身体的一侧”；本处取下后以肉合上的身体意象支持“肋骨”，同时以脚注保留另一可能。
- source_word: וַיִּסְגֹּר בָּשָׂר תַּחְתֶּנָּה
  choice: 又用肉把原处合上
  rationale: סגר 表示关闭、合上；תחתנה 字面有“在它下面”之意，但本语境自然指被取之物所在的位置，因此译作“原处”。
theological_decisions:
- issue: אָדָם 在本节中的所指
  choice: 那人
  alternative: 人／人类
  rationale: 下文叙述从此特定个体身上取出身体部分，因此个体男性的理解在本节最合语境；不将其泛化为全人类。
- issue: צֵלָע 的身体部位含义
  choice: 肋骨
  alternative: 身体的一侧／侧面
  rationale: “取下”以及随后“用肉把原处合上”的意象使“肋骨”成为自然的正文选择；但原词在别处常指侧面，故以脚注保存真实的词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“沉沉睡去”比直译“使沉睡落在那人身上”更符合现代汉语；“原处合上”简洁保留类似创口闭合的画面。脚注标记已在正文“肋骨”后标出。
