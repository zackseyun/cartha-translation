  to: 于是，耶和华上帝使那人沉睡；他睡着后，耶和华上帝取下他的一根肋骨[a]，又在原处把肉合上。
  rationale: 修订仅使“闭合肉”的句法关系更贴近希伯来原文，并收窄脚注中对 צֵלָע 替代义的表述；保留“肋骨”为正文译法及其脚注所保留的歧义。
