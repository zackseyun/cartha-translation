    text: 或译“他身体的一侧”或“侧部”。希伯来语这个词可指“肋骨”，也可指“侧面”或“侧部”。
    reason: lexical_alternative
  revision_rationale: 修订仅使“闭合肉”的句法关系更贴近希伯来原文，并收窄脚注中对 צֵלָע 替代义的表述；保留“肋骨”为正文译法及其脚注所保留的歧义。
