id: GEN.2.5
reference: Genesis 2:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: zh_hans
  text: 田野的灌木还没有出现在地上[a]，田野的草本植物也还没有长出来，因为耶和华上帝[b]还没有使雨降在地上，也没有人[c]耕种土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灌木”也可译作“矮树丛”。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”是神名יְהוָה的传统中文音译；也有译作“雅威”的。
    reason: alternative_reading
  - marker: c
    text: “人”也可译作“人类”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: 田野的灌木
  rationale: שִׂיחַ指灌木或矮树丛；译作“灌木”既自然，也与下句的עֵשֶׂב（草本植物）保持区别。“田野的”保留原文的属格结构。
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: 还没有出现在地上
  rationale: טֶרֶם表示“尚未”，יִהְיֶה表达存在或出现；“地上”适合本章创造叙事的广阔语境。
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: 田野的草本植物
  rationale: עֵשֶׂב泛指草本植被。“草本植物”避免把它过窄地理解为青草或可食用的香草，并与“灌木”形成清楚区别。
- source_word: טֶרֶם יִצְמָח
  choice: 还没有长出来
  rationale: צמח表示萌发、长出；“长出来”是现代汉语中自然且不过度限定生长阶段的表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述植物尚未出现的原因，明确译出因果关系。
- source_word: הִמְטִיר
  choice: 使雨降在
  rationale: 该动词为使役形，表达使雨降下；“使雨降在地上”保留其使役意味。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 以“耶和华”音译四字神名，并以“上帝”对应אֱלֹהִים；保留复合称谓。
- source_word: וְאָדָם אַיִן
  choice: 也没有人
  rationale: אָדָם在这里指缺少一个能够耕种土地的人，汉语“人”既可作代表性单数，也不必在此预先限定为男性或全体人类。
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: 耕种土地
  rationale: עבד在农业语境中意为劳作、耕作；אֲדָמָה指可供耕作的地土。“耕种土地”自然准确。
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: 地上 / 土地
  rationale: 分别翻译两个相关却不同的名词：אֶרֶץ指较广义的地或大地，אֲדָמָה指供人耕作的地土。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者较熟悉的“耶和华”，脚注说明另一种常见音译，不以“主”取代原文专名。
- issue: אָדָם在本节中的所指
  choice: 人
  alternative: 人类
  rationale: 原文为代表性单数，重点是尚无人耕种土地。“人”保留单复数范围上的弹性；“人类”则更明确地作集合性理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留原文两项“尚未”与两项原因的并列关系，不增添原文没有的篇章标记。以“草本植物”与“灌木”保持词义区别，以“地上”与“土地”反映אֶרֶץ和אֲדָמָה的区别。
