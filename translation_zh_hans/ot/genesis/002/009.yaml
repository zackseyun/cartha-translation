source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: zh_hans
  text: 耶和华上帝使各样的树从地里长出来；这些树赏心悦目，也可作食物。园子中央有生命树；又有分别善恶的知识树。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别善恶的知识”也可理解为辨别善恶的能力；另有解释认为它指成熟、全面的知识，或辨明有益与有害。原文没有明确限定。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: 使……长出来
  rationale: 该词是צמח的使役词干，明确表达上帝使树木生长，而非仅说树木自行长出。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 以现代汉语中通行的专名“耶和华”表达四字神名，并以“上帝”对应אֱלֹהִים。
- source_word: מִן הָאֲדָמָה
  choice: 从地里
  rationale: 这里的אֲדָמָה指植物生长所出的土地、土壤；“从地里”自然且符合上下文。
- source_word: כָּל עֵץ
  choice: 各样的树
  rationale: 单数集合名词与כָּל连用，在汉语中译作“各样的树”能自然表达遍举之意，而不暗示仅有一棵树。
- source_word: נֶחְמָד לְמַרְאֶה
  choice: 赏心悦目
  rationale: 表达这些树在视觉上可喜、悦人，语言自然而庄重。
- source_word: וְטוֹב לְמַאֲכָל
  choice: 也适合作食物
  rationale: 保留“适于食用、作为食物是好的”这一功能性含义，避免仅译成口语化的“好吃”。
- source_word: וְעֵץ הַחַיִּים
  choice: 生命树
  rationale: 这是该结构简洁、透明且已有广泛认知的汉语表达。
- source_word: בְּתוֹךְ הַגָּן
  choice: 园子中央
  rationale: בְּתוֹךְ在此表示园中或园子中央；结合句法位置，译作“园子中央”保留其中心位置的含义。
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: 分别善恶的知识树
  rationale: 保留“知识树”这一中心结构，并以“分别善恶”表达טוֹב וָרָע所限定的知识范围；不在正文中进一步界定这种知识的性质。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 源文直接使用四字神名。采用现代中文读者较熟悉的专名“耶和华”，不以“主”替代专名。
- issue: “善恶的知识”的含义
  choice: 保留为“分别善恶的知识”，不作解释性扩展
  alternative: 道德辨别力、成熟、包罗万象的知识或辨明利害的知识
  rationale: 该短语含义存在解释争议；正文保留其神学张力，脚注说明主要可能性而不裁定。
- issue: 两棵树与“园子中央”的句法关系
  choice: 正文自然表述生命树位于园子中央，不明确断定该位置短语同时修饰知识树
  alternative: 理解为两棵树都位于园子中央
  rationale: 希伯来语明确把“园子中央”紧接在生命树之后，而知识树随后另行并列；不应以译文消除其潜在句法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“赏心悦目”传达视觉上的可喜；“适合作食物”保留原文功能性判断。以分号和“此外”理顺较长的希伯来语并列句，同时保留各部分关系。
