  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: zh_hans
  text: 那人说：“这才是我骨中的骨、肉中的肉；这一位要称为‘女人’[a]，因为她是从男人身上取出来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“女人”（ishah）与“男人”（ish）读音相近，在这里构成文字上的呼应。
    reason: 说明原文中无法由汉语完全重现的文字游戏。
lexical_decisions:
- source_word: הָאָדָם
  choice: 那人
  rationale: 本节中所指的是先前受造、如今与女人相对的那个人；“那人”既承接上下文，也避免在此处把 אָדָם 泛化为全人类。
- source_word: זֹאת הַפַּעַם
  choice: 这才是
  rationale: 该短语直指“这一次”，在语境中带有终于见到相称者的强调意味；“这才是”比生硬的“这一次，这一位”更符合现代汉语，同时保留发现和确认的语气。
- source_word: עֶצֶם מֵעֲצָמַי וּבָשָׂר מִבְּשָׂרִי
  choice: 我骨中的骨、肉中的肉
  rationale: 采用自然、庄重的汉语对应希伯来语的平行结构；“中的”表达同源和出自的关系，而不把 מִן 机械译成不自然的“从”。
- source_word: לְזֹאת
  choice: 这一位
  rationale: 保留指示代词的强调作用，并用“位”自然地指称人物。
- source_word: יִקָּרֵא
  choice: 要称为
  rationale: 准确表达被动命名公式，并符合现代汉语习惯。
- source_word: אִשָּׁה ... אִישׁ
  choice: 女人……男人
  rationale: 这是两词在本语境中的基本含义；汉语的共同成分“人”可部分传达两者的对应，脚注则说明希伯来语的语音呼应。
- source_word: לֻקֳחָה זֹאת
  choice: 她是……取出来的
  rationale: 以“她”承接前面的“这一位”，自然表达阴性单数被动形式；“取出来”保留动作及来源意味。
theological_decisions:
- issue: 本节中 אָדָם 的所指
  choice: 那人
  alternative: 那人类／人类
  rationale: 此处叙述焦点已落在这个男性个体身上，并随即以 אִישׁ 与 אִשָּׁה 相对；译作“那人”最符合局部语境，又不据此扩展出经文本身未明说的人论结论。
- issue: אִישׁ／אִשָּׁה 的关系
  choice: 女人……男人
  alternative: 妻子……丈夫
  rationale: “妻子／丈夫”会提前把词义限定为婚姻身份，并削弱原文两词的词汇与声音呼应；“女人／男人”保留原文在本句中的基本对举。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这才是”传达原文在此语境中的强调和欣喜感；“我骨中的骨、肉中的肉”保留诗性平行结构。
