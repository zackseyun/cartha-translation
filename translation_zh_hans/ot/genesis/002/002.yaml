  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: zh_hans
  text: 到第七日，上帝已经完成了他所做的工[a]；第七日，他停止了他所做的一切工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在第七日，上帝完成了他所做的工。”正文的“到第七日……已经完成了”表达这里在上下文中很可能具有的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: 已经完成了
  rationale: כלה表示“完成、做完”。结合下句同在第七日停止工作，用“已经完成了”自然表达在第七日到来之际工作已告完成，同时保留希伯来叙事动词的完成意义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为形态上的复数形式，却与单数动词搭配，在创世记1—2章指独一的上帝；“上帝”是现代标准普通话中自然、庄重的对应词。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 到第七日
  rationale: 字面是“在第七日”。主句译作“到第七日”，配合“已经完成了”，表达上下文所示的完成时点，避免使普通读者误以为上帝在第七日仍继续创造；字面译法收入脚注。
- source_word: מְלַאכְתּוֹ
  choice: 他所做的工
  rationale: מְלָאכָה指工作、劳作或任务。“工”在创造叙事中简洁庄重；加“所做的”对应随后关系从句，并使中文自然。
- source_word: אֲשֶׁר עָשָׂה
  choice: 他所做的
  rationale: עשה含义宽泛，可指“做、造”。译为“所做的”不把含义过度限定为物质制造，也贴近原文重复。
- source_word: וַיִּשְׁבֹּת
  choice: 他停下了
  rationale: שבת的基本义是“停止、止息”。“停下了……工”清楚表明停止工作，而非因疲劳需要恢复体力；这也保留了词语与后续安息主题之间的张力。
- source_word: מִכָּל
  choice: 他所做的一切工
  rationale: מן与כָּל合用，表示从全部工作中止息。中文以“停下了……一切工”自然表达停止全部工作的范围。
theological_decisions:
- issue: 经文是否表示上帝在第七日仍然工作
  choice: 正文译为“到第七日……已经完成了”，表明第七日到来时工作已经完成。
  alternative: 按希伯来语形式直译为“在第七日，上帝完成了他所做的工”。
  rationale: 原文介词短语通常可直译为“在第七日”，但紧接着又说上帝在第七日停止一切工作。正文采用符合语境的时间表达，却在脚注保留形式上更直接的译法，以免掩盖原文措辞及其解释张力。
- issue: שבת是否意味着上帝因疲倦而休息
  choice: 译为“停下了”，突出停止创造之工。
  alternative: 译为“安息了”或“休息了”。
  rationale: 该动词核心意义是停止、止息；本节没有说上帝疲倦。“停下了”避免添加恢复体力的含义，同时为第七日的安息主题保留语义基础。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“上帝”与本项目预期圣经语体相称；保留原文“他所做的工”的重复。正文以意合方式处理首个时间短语，脚注则公开其字面形式。
