base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: zh_hans
  text: 只是那棵知善恶树上的果子，你不可吃[a]；因为在你吃它的那一天[b]，你必定死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的语序较直译为：“但那棵知善恶树，你不可从它吃。”原文先提出这棵树，随后以代词再次指向它。
    reason: source_structure
  - marker: b
    text: 希伯来文直译为“在你吃它的日子”；这一表达也可作“当你吃它时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: 但……树上的果子
  rationale: וּ 在上下文中表示与上一节广泛许可相对的转折，因此译作“但”；מִן־עֵץ 字面为“从树”，现代汉语谈论吃树所结之物时自然表达为“树上的果子”。“果子”虽为语境补足，却没有改变所指。
- source_word: הַדַּעַת טוֹב וָרָע
  choice: 知善恶
  rationale: דַּעַת 表示“知识、认识”，טוֹב וָרָע 为“善与恶”。“知善恶树”简洁地保留了原文的构词关系，也避免预先断定这里专指道德辨别、经验认识或其他特定解释。
- source_word: לֹא תֹאכַל
  choice: 你不可吃
  rationale: 否定词加未完成式在此构成禁令。“不可吃”在现代汉语中清楚、庄重，既表达禁止，也不过度采用古奥法律措辞。
- source_word: בְּיוֹם אֲכָלְךָ
  choice: 你吃……的那一天
  rationale: 贴近希伯来语“在你吃的日子”，保留“日”这一时间表达；脚注说明该习语也可泛指“当……时”，不在正文中消解其时间张力。
- source_word: מוֹת תָּמוּת
  choice: 你必定死
  rationale: 不定式绝对形与同根限定动词连用，加强死亡的确定性。“必定死”自然地传达这一强调，而不是机械直译为“死，你必死”。
theological_decisions:
- issue: “你吃的那一天”与死亡应验时间之间的关系
  choice: 正文保留“那一天”，不界定死亡是当天肉身死亡、死亡状态或必死判决的开始。
  alternative: 译作“你一吃就必死”或直接解释为“你就成为必死的人”。
  rationale: 原文明确使用 בְּיוֹם，却没有在本句内说明死亡如何或何时实现。译文应保存叙事所留下的张力，而不把某一种神学解释写入正文。
- issue: “知善恶”的具体含义
  choice: 采用概括而贴近原文的“知善恶”。
  alternative: 译作“分辨善恶”“获得道德自主”或“经历善恶”。
  rationale: 这些替代说法各自突出了可能的解释，但原文 דַּעַת 的语义较宽。正文不应预先裁定其究竟指辨别、经验或自主决定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“知善恶树”保留原文的语义开放性；“树上的果子”是为符合汉语表达而作的语境补足。分号呈现禁令与其理由之间的紧密关系。
