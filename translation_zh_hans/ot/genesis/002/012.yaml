  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: zh_hans
  text: 那地的金子很好；那里有贝多拉[a]和缟玛瑙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贝多拉”：希伯来词所指的确切物质不能确定；或可指一种芳香树脂。
    reason: lexical_alternative
  - marker: b
    text: “缟玛瑙”：或指绿柱石等另一种宝石；希伯来词所指的确切矿物不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב הָאָרֶץ הַהִוא
  choice: 那地的金子
  rationale: וּ承接上文；הָאָרֶץ הַהִוא回指上一节的哈腓拉。“那地的金子”在现代汉语中自然，并保留原文的指代关系。
- source_word: טוֹב
  choice: 质地上好
  rationale: 此处טוֹב评价金子的品质。“质地上好”比单说“是好的”更符合现代汉语习惯，同时不过度细化其优良之处。
- source_word: שָׁם
  choice: 那里有
  rationale: 准确表达地点副词“在那里”，并自然引出后面的两种物产。
- source_word: הַבְּדֹלַח
  choice: 芳香树脂
  rationale: 该词所指物质无法确定，常被理解为一种芳香胶质树脂。正文采用普通读者可理解的名称，并以脚注明确其不确定性。
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: 和缟玛瑙
  rationale: אֶבֶן表示石头，שֹׁהַם指某种宝石，传统上常鉴定为缟玛瑙。汉语“缟玛瑙”本身已明确是宝石，无须重复“石”；脚注保留矿物鉴定的不确定性。
