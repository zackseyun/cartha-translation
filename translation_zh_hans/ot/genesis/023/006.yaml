base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: zh_hans
  text: “我主，请听我们的话！你在我们中间是一位极尊贵的首领[a]。请在我们最好的坟墓中安葬你的死者。我们中间没有一个人会拒绝让你使用自己的坟墓，以致你不能安葬你的死者。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“一位上帝的首领。”希伯来语这一短语可作强化性称誉，表示“极尊贵的首领”；也可能指一位与上帝有特殊关联的首领。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: 请听我们的话
  rationale: 该形式是带第一人称复数后缀的祈使语。“请听我们的话”既传达直接请求，也符合现代汉语礼貌而庄重的语境。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是对亚伯拉罕的尊称；“我主”保留原文的社会敬意，比“先生”更贴近原文形式。
- source_word: נְשִׂיא אֱלֹהִים
  choice: 一位上帝的首领
  rationale: 直译保留“上帝”这一属格表达，不预先判定它是表示与上帝有关，还是惯用的最高级说法；较自然的惯用理解置于脚注。
- source_word: בְּתוֹכֵנוּ
  choice: 在我们中间
  rationale: 自然表达其身处该群体之中的地位。
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: 在我们最好的坟地里
  rationale: מִבְחָר表示精选、上好的；“最好的”自然传达最高质量。קֶבֶר在本段涉及可供安葬的墓穴或墓地，“坟地”可自然涵盖这一语境。
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: 埋葬你的死者
  rationale: 保留祈使句和“你的死者”的委婉、庄重表达。
- source_word: אִישׁ מִמֶּנּוּ
  choice: 我们中没有一人
  rationale: 在否定分配结构中意为“我们当中没有任何人”，汉语如此表达清晰自然。
- source_word: אֶת־קִבְרוֹ
  choice: 他的坟地
  rationale: 单数所有格按每个群体成员分别理解，并与前文“坟地”保持一致。
- source_word: לֹא יִכְלֶה מִמְּךָ
  choice: 不会不让你用
  rationale: 此处动词表达扣留或拒绝给予使用权；结合宾语“他的坟地”，译为“不让你用”更符合现代汉语，又保留拒绝之意。
- source_word: מִקְּבֹר מֵתֶךָ
  choice: 埋葬你的死者
  rationale: 介词מִן加不定式与前面的拒绝、阻止含义相连。汉语以逗号衔接，保留原文略显压缩的句法，而不额外明确为目的或结果。
theological_decisions:
- issue: נְשִׂיא אֱלֹהִים中 אֱלֹהִים 的功能
  choice: 正文保留“一位上帝的首领”
  alternative: “一位极尊贵的首领”或“一位大有威望的首领”
  rationale: 该短语可直指与上帝相关的身份，也可能以“上帝的……”构成强化或最高级表达。正文保留形式和张力，脚注说明惯用可能，不把歧义静默消解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“我主”以体现赫人对亚伯拉罕的敬重；正文只设一处脚注，标记[a]已在相应短语后出现。
