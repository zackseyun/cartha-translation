  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: zh_hans
  text: 于是，亚伯拉罕在当地人面前俯身下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“俯伏在当地人面前。”
    reason: 原文动词可指俯身，也可指更彻底的俯伏；正文采用自然且不过度限定动作幅度的表达，脚注保留较强的可能译法。
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: 俯身下拜
  rationale: 该动词在此表示出于敬意或礼让而俯身行礼。上下文是亚伯拉罕与当地人商议购置坟地，并非敬拜神；“俯身下拜”既传达身体动作和恭敬意味，也不引入宗教敬拜的含义。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 准确表达“在……面前、当着……的面”的空间及社会关系含义，符合现代汉语习惯。
- source_word: עַם הָאָרֶץ
  choice: 当地人
  rationale: 该短语在本段指那片土地上的居民，即在场参与并见证交易的当地群体。“当地人”比逐字译作“那地的人民”更自然，也保留地域归属之意。
- source_word: וַ
  choice: 于是
  rationale: 该连接成分配合叙事时态推动事件发展；“于是”自然呈现前后相承的动作。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 采用现代简体中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 下拜动作是否表示宗教敬拜
  choice: 按社交礼仪译为“俯身下拜”
  alternative: 敬拜
  rationale: 语境中的对象是当地居民，动作表达尊敬和礼让，而非对神明的崇拜；因此避免使用会明确暗示宗教行为的“敬拜”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“当地人”符合当代汉语，又准确指向本地居民群体；“俯身下拜”保留古代礼仪动作的分量，但不误导为宗教敬拜。
