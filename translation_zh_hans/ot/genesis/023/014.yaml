  language: zh_hans
  text: 以弗仑回答亚伯拉罕说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה的叙事性连续式在对话中表示作出回应；“回答”直接、自然，并保留话语承接关系。
- source_word: עֶפְרוֹן
  choice: 以弗仑
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: אֶת אַבְרָהָם
  choice: 亚伯拉罕
  rationale: אֶת是直接宾语标记，不另行译出；“亚伯拉罕”采用现代中文圣经的通行音译。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出直接引语；“说”在中文叙事中简洁自然，也保留原文的引语引介功能。
- source_word: לוֹ
  choice: 不单独译出
  rationale: 该代词指亚伯拉罕；中文“回答亚伯拉罕说”已自然表达回应对象，若再译作“对他说”会显得重复。
