base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: zh_hans
  text: 于是，那块田和田中的洞穴就从赫的子孙[a]手中转归亚伯拉罕所有[b]，作为安葬用的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赫的子孙”也可译作“赫人”。
    reason: lexical_alternative
  - marker: b
    text: “转归亚伯拉罕所有”也可较为字面地译作“为亚伯拉罕得以确立”。在这里的买卖法律语境中，指该产业的所有权依法归于亚伯拉罕。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 转归……所有
  rationale: 在土地买卖的法律语境中，此动词表示产权得到确立并转移；“转归……所有”既体现交易结果，也符合现代汉语表达。
- source_word: הַשָּׂדֶה
  choice: 那块田
  rationale: 指本章交易中已明确提到的那块田；量词“块”使汉语自然。
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: 和其中的洞
  rationale: 保留洞位于田地之中的关系，同时避免生硬地逐字译作“和在它里面的洞”。
- source_word: לְאַבְרָהָם
  choice: 归亚伯拉罕所有
  rationale: 与前面的“转归”合译，清楚表达亚伯拉罕成为合法所有者。
- source_word: לַאֲחֻזַּת קָבֶר
  choice: 作为坟地产业
  rationale: “产业”保留 אֲחֻזָּה 所含的持有、所有权意味，“坟地”表达其安葬用途。
- source_word: מֵאֵת
  choice: 由
  rationale: 在产权转移语境中自然标明转让方，比直译“从……手中”简洁。
- source_word: בְּנֵי חֵת
  choice: 赫的子孙
  rationale: 较直接保留希伯来文“赫之子”的族群称呼；通行的语境化译法“赫人”列入脚注。
theological_decisions: []
