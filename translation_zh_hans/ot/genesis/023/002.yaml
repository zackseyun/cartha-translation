  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: zh_hans
  text: 撒拉死在迦南地的基列·亚巴，就是希伯仑[a]。亚伯拉罕前来为撒拉哀悼，并为她哭泣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基列·亚巴”在这里被说明为希伯仑。
    reason: cross_reference
  - marker: b
    text: “为撒拉哀悼，并为她哭泣”也可译作“为撒拉哀哭，又为她流泪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: 死
  rationale: מות直接表示死亡；“死”忠实保留希伯来文直陈的语气，不以委婉说法弱化。
- source_word: בְּקִרְיַת אַרְבַּע
  choice: 在基列·亚巴
  rationale: 地名采用音译；间隔号使复合地名在现代中文中清楚易读。
- source_word: הִוא חֶבְרוֹן
  choice: 就是希伯仑
  rationale: 原文以同位结构说明基列·亚巴即希伯仑；“就是”自然表达这一辨认关系。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 保留原文明确出现的 אֶרֶץ（地），而不简化为“在迦南”。
- source_word: וַיָּבֹא
  choice: 前来
  rationale: בוא可依叙事视角译作“来”或“去”；“前来”符合此处叙述视角，同时不增添具体出发地点。
- source_word: לִסְפֹּד לְשָׂרָה
  choice: 为撒拉哀悼
  rationale: ספד指丧葬处境中的哀悼或哀哭；“哀悼”庄重自然，并保留较宽的语义范围。
- source_word: וְלִבְכֹּתָהּ
  choice: 并为她哭泣
  rationale: בכה表示哭泣；“为她”明确呈现第三人称阴性宾语后缀，保持亚伯拉罕哀伤所指的个人性。
