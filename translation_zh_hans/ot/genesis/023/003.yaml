base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/003.yaml
  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: zh_hans
  text: 亚伯拉罕就从亡妻面前起身，对赫的子孙[a]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赫人”；希伯来文直译“赫的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 就……起身
  rationale: 叙事性连续式推动事件发展；“就”自然表达承接关系，“起身”保留קום的动作含义。
- source_word: מֵעַל פְּנֵי
  choice: 从……面前
  rationale: 较贴近原文“从……面前／跟前”的空间表达，指亚伯拉罕离开遗体所在之处。
- source_word: מֵתוֹ
  choice: 亡妻
  rationale: 原文直译为“他的死者”，在上下文中所指明确是撒拉；“亡妻”在现代汉语中自然、庄重，也保留其与亚伯拉罕的关系。
- source_word: וַיְדַבֵּר אֶל
  choice: 对……说
  rationale: 自然表达“向某人讲话”；汉语若译成“讲话说”会显得重复，因此与引语导入语合并处理。
- source_word: בְּנֵי חֵת
  choice: 赫的子孙
  rationale: 保留原文“赫之子”的谱系式称谓，同时用“子孙”清楚表达群体后裔，而不直接以族名消解原文形式。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下一节的直接话语；冒号符合现代汉语书面表达习惯。
