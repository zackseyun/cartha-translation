base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: zh_hans
  text: “我主，请听我说：一块地，值四百舍客勒银子，这在你我之间算什么呢？请安葬你的亡者吧。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较贴近原文作：“我主，请听我说：地——四百舍客勒银子——这在你我之间算什么呢？请安葬你的亡者吧。”希伯来文表达简略，以反问方式在商谈中淡化这笔价款。
    reason: 保留原文省略结构的另一种译法，并说明其修辞作用。
lexical_decisions:
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是以尊称向单数对象以弗仑说话，并非对上帝的称呼；“我主”保留古代交易场合中的敬意。
- source_word: שְׁמָעֵנִי
  choice: 请听我说
  rationale: 原文是“听”的祈使式；加“请”符合此处礼貌而直接的商谈语气。
- source_word: אֶרֶץ
  choice: 一块地
  rationale: 在买地安葬的语境中指具体的一块地产，而非抽象的土地。
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: 值四百舍客勒银子
  rationale: 希伯来文省略地表达土地与金额的关系；补出“值”使现代汉语自然，同时不增加实质内容。“舍客勒”保留古代重量兼货币单位。
- source_word: בֵּינִי וּבֵינְךָ מַה הִוא
  choice: 这在你我之间算什么呢
  rationale: 保留第一、第二人称单数及反问语气，表达谈判中对这笔金额的刻意淡化。
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: 请安葬你的亡者吧
  rationale: “亡者”对应单数的 מֵתְךָ，指亚伯拉罕去世的亲属；“请……吧”自然传达交易语境中的祈使语气，句首连接词未硬译，以免汉语生硬。
