  to: 亚伯拉罕听了以弗仑的话，就把以弗仑当着赫人[a]所说的银子称给他：四百舍客勒银子，合乎商人通用的标准[b]。
  rationale: 修订避免将“听”过度译为“服从”，并使末尾商业术语在现代标准汉语中完整自然。正文以“合乎商人通用的标准”表达其商业规范的核心含义；脚注保留原文对具体是重量、品质还是交易可接受性的未定性。其余内容忠实保留原文的公开见证、称量支付和金额信息。
