base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: zh_hans
  text: 亚伯拉罕听了以弗仑的话，就把以弗仑当着赫人[a]所说的银子称给他：四百舍客勒银子，合乎商人通用的标准[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“赫的子孙”；也可译作“赫族人”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“商人认可的”或“按商用标准的重量”。这句话可能是指银子的重量、品质或可用于交易的标准。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: 亚伯拉罕听从了以弗仑的话
  rationale: “שׁמע אל”在此表示听取并接受对方所说的话；“听从了……的话”既保留听的意象，也自然体现交易语境中的接受，但不把它过度明确为正式同意。
- source_word: וַיִּשְׁקֹל
  choice: 称给
  rationale: 动词指按重量称量；当时银子尚以重量计价。“把银子称给他”保留具体的古代交易方式，比泛译为“付给”更贴近原文。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף本义为银，此处是用作支付手段的银；“银子”兼顾材质和货币用途。
- source_word: אֲשֶׁר דִּבֶּר בְּאָזְנֵי בְנֵי חֵת
  choice: 照以弗仑当着赫人所说的数目
  rationale: 原文直陈以弗仑“在赫人的耳中所说”的银子。中文以“当着……所说”保留公开、有见证人的意味，并借“数目”明确所说的是银子的数量。
- source_word: בְנֵי חֵת
  choice: 赫人
  rationale: 这是现代中文中自然、通行的族群称谓；原文直译“赫的子孙”收入脚注，以保存其家族性表达。
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: 四百舍客勒银子
  rationale: “舍客勒”在这里是重量单位，并非铸币名称；此译保留古代度量和银的材质。
- source_word: עֹבֵר לַסֹּחֵר
  choice: 是商人通用的
  rationale: 该短语可能指商人认可、流通使用或符合商业标准的银子。“商人通用的”保留商业语境且不强行限定为成色或重量标准，其他可能含义列入脚注。
