  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: zh_hans
  text: “不，我主，请听我说：这块田我给你，其中的洞穴也给你；我当着我族人的面把它给你。请安葬你的亡者。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: 不
  rationale: 在交涉语境中是对亚伯拉罕提议的礼貌否定或纠正；简洁的“不”自然保留了原文语气。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是对亚伯拉罕的尊称；“我主”保留社会礼敬意味，又不将其误解为神圣称号。
- source_word: שְׁמָעֵנִי
  choice: 请听我说
  rationale: 原文为命令式；加入“请”符合现代汉语中礼貌交涉的语气，而“听我说”自然传达其劝请力度。
- source_word: הַשָּׂדֶה
  choice: 这块田
  rationale: שׂדה在此指所议定的田地；量词“块”使中文自然，“这”由明确语境补出。
- source_word: נָתַתִּי לָךְ
  choice: 我给你
  rationale: 完成式在这里具有当场转让的施行功能，用现在时表达最贴近交易宣告。
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: 其中的洞穴
  rationale: 简明保留洞穴位于田内的空间关系。
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: 当着我族人的面
  rationale: 原意直译为“在我人民众子眼前”，是公开且有本族人在场见证的惯用表达；此译自然准确。
- source_word: קְבֹר מֵתֶךָ
  choice: 请安葬你的亡者
  rationale: 保留直接命令的内容；“亡者”可自然指向撒拉，同时不超出原文将其明说为妻子。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留以法仑三次“给”的公开转让语气，并以“我主”体现礼貌与社会尊敬；未添加原文没有的买卖条件或神学解释。
