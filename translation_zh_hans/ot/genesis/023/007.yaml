  text: וַ/יָּ֧קָם אַבְרָהָ֛ם וַ/יִּשְׁתַּ֥חוּ לְ/עַם הָ/אָ֖רֶץ לִ/בְנֵי חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/007.yaml
  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: zh_hans
  text: 于是，亚伯拉罕起身，向当地的人，就是赫人[a]，下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“赫的子孙”。
    reason: 说明正文族称“赫人”所对应的希伯来文谱系式表达。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 于是，亚伯拉罕起身
  rationale: קום的Qal叙事形式表示起身或站起来；“于是……起身”自然表达连续叙事中的动作。
- source_word: וַיִּשְׁתַּחוּ
  choice: 下拜
  rationale: שׁחה的该词形表示俯身、下拜；“下拜”既保留身体动作，也符合此处表示敬意的语境，而不限定为完全俯伏。
- source_word: לְעַם הָאָרֶץ
  choice: 向当地的人
  rationale: 介词ל标示下拜所朝向的对象；עַם הָאָרֶץ在此指当地居民。“当地的人”比直译“那地的民”更符合现代汉语，同时保留其地域含义。
- source_word: לִבְנֵי חֵת
  choice: 就是赫人
  rationale: 字面为“赫的子孙”。此短语与“当地的人”构成同位说明；正文用现代汉语常用族称“赫人”，脚注保留字面形式。
- source_word: חֵת
  choice: 赫
  rationale: 专名按现代中文圣经人名惯例音译为“赫”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文叙事；将“赫人”处理为“当地的人”的同位说明，避免重复两个“向”，也准确反映希伯来文所指的同一群体。
