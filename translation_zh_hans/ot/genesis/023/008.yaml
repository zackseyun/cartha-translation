  text: וַ/יְדַבֵּ֥ר אִתָּ֖/ם לֵ/אמֹ֑ר אִם יֵ֣שׁ אֶֽת נַפְשְׁ/כֶ֗ם לִ/קְבֹּ֤ר אֶת מֵתִ/י֙ מִ/לְּ/פָנַ֔/י שְׁמָע֕וּ/נִי וּ/פִגְעוּ לִ֖/י בְּ/עֶפְר֥וֹן בֶּן צֹֽחַר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: zh_hans
  text: 他对他们说：“你们若愿意让我埋葬我的亡者，使亡者不再留在我眼前，就请听我说，替我向琐辖的儿子以弗仑说情[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说情”也可译作“请求”；原文动词在这里含有替人向某人提出请求的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: 他对他们说
  rationale: 以自然的现代汉语表达“与他们讲话，说”，保留叙事中引出直接引语的功能。
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: 你们若愿意
  rationale: 这是表达意愿的希伯来语习语；直译为“若在你们心里/性命里”在现代汉语中生硬，“若愿意”准确传达其意。
- source_word: לִקְבֹּר אֶת־מֵתִי מִלְּפָנַי
  choice: 让我埋葬我的亡者，使亡者不再留在我眼前
  rationale: “我的亡者”保留单数所属关系，不在正文中增补“妻子”；后半句传达 מִלְּפָנַי 在丧葬语境中“从我面前/眼前移去”的含义。
- source_word: שְׁמָעוּנִי
  choice: 请听我说
  rationale: 清楚传达祈使语气，并以“请”符合亚伯拉罕在协商中的礼貌口吻。
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: 替我向……说情
  rationale: פגע 与 ב 连用在此可指向某人提出请求或代人恳求；“替我向……说情”自然表达其居间请求的语境，同时脚注保留较宽的词义可能。
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: 琐辖的儿子以弗仑
  rationale: 采用常见中文圣经人名译法，并清楚表达父子关系。
