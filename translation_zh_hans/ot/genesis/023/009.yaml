  to: 请他把那座属于他的、在他田地尽头的麦比拉洞给我[a]。请他在你们中间收足价银子，把那洞给我，作坟地产业，归我所有[b][c]。
  rationale: 修订“在你们中间”以保留原文的群体／公共语境，而不把它限定为直接在场见证；修订交易短语以使现代汉语自然清楚；并以“坟地产业，归我所有”直接表达该地作为亚伯拉罕合法持有的安葬产业。脚注锚点仍分别紧随田地位置、足价银子和法律性产业等相应内容。
