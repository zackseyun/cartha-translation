  text: וְ/יִתֶּן לִ֗/י אֶת מְעָרַ֤ת הַ/מַּכְפֵּלָה֙ אֲשֶׁר ל֔/וֹ אֲשֶׁ֖ר בִּ/קְצֵ֣ה שָׂדֵ֑/הוּ בְּ/כֶ֨סֶף מָלֵ֜א יִתְּנֶ֥/נָּה לִ֛/י בְּ/תוֹכְ/כֶ֖ם לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: zh_hans
  text: 请他把那座属于他的、在他田地尽头的麦比拉洞给我[a]。请他在你们中间收足价银子，把那洞给我，作坟地产业，归我所有[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “田地尽头”也可译作“田地边缘”。希伯来语可指田地的尽头、边缘或极处。
    reason: lexical_alternative
  - marker: b
    text: “收足价银子”，希伯来语直译为“以足额银子”，意思是付足全部价款。
    reason: lexical_alternative
  - marker: c
    text: “作坟地产业，归我所有”也可译作“作为坟地产业”。原文强调对这块坟地的合法持有，而不只是获准在那里埋葬。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: 请他……给我
  rationale: 未完成式在亚伯拉罕提出请求的语境中带祈使意味；用“请他”自然表达礼貌而正式的请求。
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: 麦比拉洞
  rationale: 将专名音译为“麦比拉”，并以现代汉语自然的专名定中结构表达该洞穴。
- source_word: אֲשֶׁר לוֹ
  choice: 属于他的
  rationale: 清楚表达所有权，保留本段土地交易的法律语境。
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: 在他田地尽头的
  rationale: קָצֶה 可指尽头、边缘或极处；正文取“尽头”，并以脚注保留“边缘”这一真实可能。
- source_word: בְּכֶסֶף מָלֵא
  choice: 按足价银子
  rationale: 希伯来语直译为“以足额银子”，在交易语境中指足额付款；该译法兼顾银子这一付款形式和全价之意。
- source_word: יִתְּנֶנָּה
  choice: 把洞给我
  rationale: 保留 נָתַן“给”的措辞，不擅自改成“卖”；“按足价银子”已经明确这不是无偿赠送。
- source_word: בְּתוֹכְכֶם
  choice: 当着你们的面
  rationale: 在本段公开议定土地交易的语境中，此语既指在群体之中，也含由众人见证的意味；中文用“当着你们的面”较自然。
- source_word: לַאֲחֻזַּת קָבֶר
  choice: 作为我拥有的坟地
  rationale: אֲחֻזָּה 强调可持有的产业或所有权，不只是临时埋葬之用；补出“我”使中文清楚，其所指由 לִי 确定。
theological_decisions:
- issue: 坟地的法律性质
  choice: 作为我拥有的坟地
  alternative: 作为埋葬之处
  rationale: 原文 אֲחֻזָּה 强调持有和所有权。译为单纯的“埋葬之处”会削弱亚伯拉罕要求取得合法地产的意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两次“给我”保留原文重复和请求语气；以两句呈现，使公开议价和取得坟地所有权的重点清晰。所有脚注标记均置于相关正文之后。
