  to: 归亚伯拉罕作产业，在赫的子孙[a]眼前，并在所有进那城门的人面前。
  rationale: 修订仅改善中文句法和“城门”短语的自然性。“进那城门的人”对应“所有进入他城门的人”，不擅自判定“他的城”具体指谁；两个“在……面前”分别对应原文两组公开见证短语。
