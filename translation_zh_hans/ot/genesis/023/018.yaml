  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: zh_hans
  text: 归亚伯拉罕作产业，在赫的子孙[a]眼前，并在所有进那城门的人面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赫人”。
    reason: 词汇替代译法；“赫的子孙”是原文的字面表达，“赫人”则是该族群称谓的自然译法。
lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: 归亚伯拉罕
  rationale: 介词 לְ 在这项公开交易中标明产业转归的对象；“归亚伯拉罕”符合现代汉语的法律转让语境。
- source_word: לְמִקְנָה
  choice: 作产业
  rationale: מִקְנָה 指购得并持有的财产；“作产业”既表达交易的结果，也与土地所有权的语境相称。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 保留希伯来语“在眼前”的形象，同时传达交易在众人见证下公开成立的含义。
- source_word: בְנֵי חֵת
  choice: 赫的子孙
  rationale: 直译其亲族兼族群称谓；“赫人”是合适的语境化译法，列入脚注。
- source_word: בְּכֹל בָּאֵי
  choice: 也在所有进……的人眼前
  rationale: 把 בְּכֹל 与分词短语合译为见证者群体，并承接前面的“眼前”，使中文清楚自然。
- source_word: שַׁעַר עִירוֹ
  choice: 他那城城门
  rationale: 保留第三人称所属关系及城门这一公共、司法活动场所；“那城”使连续两个“城”在现代汉语中较易理解，同时不擅自明确代词所指。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，并保留本节承接上一节的句法性质。“在……眼前”保留公开见证的希伯来语意象；不额外补入“办成”等原文没有的谓语。
