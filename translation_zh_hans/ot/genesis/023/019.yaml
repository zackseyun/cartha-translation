source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: zh_hans
  text: 此后，亚伯拉罕把妻子撒拉安葬在麦比拉田地的洞里；那地方在幔利对面[a]（幔利就是希伯仑），位于迦南地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在幔利前面”。希伯来语表达的是位于幔利前方或相对之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 这是常见的叙事时间转换语，表示“在这以后”。“此后”简洁自然，也保留了事件的先后关系。
- source_word: קָבַר
  choice: 安葬
  rationale: 该动词在此明确指埋葬死者。“安葬”符合现代汉语的庄重叙事语体。
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: 把妻子撒拉
  rationale: 采用现代汉语自然的处置式句法，并将身份词“妻子”置于人名前，清楚表达撒拉与亚伯拉罕的关系。
- source_word: אֶל מְעָרַת
  choice: 在……洞里
  rationale: 介词字面可表示“到、进入”，但与“安葬”和地点搭配时，汉语自然表达为“安葬在……里”。
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: 麦比拉田地的洞
  rationale: 保留原文“洞—田地—麦比拉”的领属关系，同时采用自然、清楚的现代汉语表达。
- source_word: עַל פְּנֵי מַמְרֵא
  choice: 在幔利对面
  rationale: 该表达表示处于幔利前方或相对的位置。“在幔利对面”自然地保留其空间关系，不加入“东边”等原文未明确给出的方位。
- source_word: הִוא חֶבְרוֹן
  choice: 幔利就是希伯仑
  rationale: 原文用代词加地名作同位说明，指出幔利与希伯仑的对应关系；“就是”是现代汉语中自然的辨识表达。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 位于迦南地
  rationale: 保留原文明确出现的“地”，并用“位于”顺畅承接前面的地理说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“安葬”适合死亡与墓地叙事；分号和括注帮助读者辨明墓洞的位置及幔利与希伯仑的对应关系。脚注标记置于其实际说明的空间短语之后。
