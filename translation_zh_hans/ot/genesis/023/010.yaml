base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: zh_hans
  text: 以弗仑正坐在赫人中间[a]。以弗仑这赫人在赫人和所有进入他所在城的城门的人面前回答亚伯拉罕，说[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两处直译为“赫的众子”，这里指赫人；以弗仑的称谓也译为“赫人”，但原文用的是族属称谓。
    reason: lexical_alternative
  - marker: b
    text: 古代城门是公众聚集，并在见证人面前办理法律和商业事务的地方。
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: 正坐在
  rationale: 分词描写当时场景中持续的状态；“正坐在”比简单的“坐”更清楚地传达现场性。
- source_word: בְּתוֹךְ בְּנֵי חֵת
  choice: 在赫人中间
  rationale: בְּתוֹךְ在此表示身处聚集的人群之中；בְּנֵי חֵת直译为“赫的众子”，但现代汉语以“赫人”自然表达该族群，并在脚注保留原文形式。
- source_word: וַיַּעַן
  choice: 回答
  rationale: 这是对话语境中ענה的常规含义，措辞直接、自然。
- source_word: הַחִתִּי
  choice: 赫人
  rationale: 作以弗仑的族属称谓；汉语无需以冠词区分定指，译作“赫人”即可。
- source_word: בְּאָזְנֵי
  choice: 在……面前
  rationale: 希伯来语字面为“在……耳中”，意为让在场者听见、公开作答；结合后面的见证人范围，汉语用“在……面前”自然传达公开性。
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: 所有进他城门的人
  rationale: 保留“进入城门”的表达及“他的城”这一代词关系；此语境指城门处在场的公众见证人。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 标准的直接引语引介形式；冒号自然衔接下一节的话。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“正坐在”再现场景状态；“就在……面前”体现公开答复及见证人的法律社会背景。为避免汉语中“赫的众子”造成不必要的生硬感，正文统一译作“赫人”，脚注说明字面形式。
