base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: zh_hans
  text: 于是，以弗仑在麦比拉、幔利对面的那块田地——那块田、其中的洞，以及田地四围边界以内所有的树木——便得以确立[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“便得以立定”或“便转归”。这里的希伯来语动词在买卖语境中可能具有法律含义，指该产业的归属得到确认。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 便确立归属
  rationale: קום在这宗买卖的法律语境中并非指物理上的“起来”，而是表示产业的归属得到确立。此译法既传达法律效力，也保留本节句子延续到下一节的结构。
- source_word: שְׂדֵה עֶפְרוֹן
  choice: 以弗仑那块……田地
  rationale: 按希伯来语构造表达原属以弗仑的田地；加入“那块”使中文长句中的所指更清楚。
- source_word: בַּמַּכְפֵּלָה
  choice: 在麦比拉
  rationale: 将地名מכפלה音译为传统且通行的“麦比拉”，介词按地点义译作“在”。
- source_word: לִפְנֵי מַמְרֵא
  choice: 幔利对面
  rationale: לִפְנֵי的空间意义是“在……面前／对面”；译作“对面”保留方位关系，不擅自明确为东方或仅仅邻近。
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: 就是那块田、田里的洞
  rationale: 保留原文近似同位说明的产业清单形式，并用“就是”自然引出所包含的项目。
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: 以及……所有的树木
  rationale: עֵץ虽为单数形式，在כָל之后具有集合或周遍意义，中文自然表达为“所有的树木”。
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: 田界以内四周
  rationale: 表达树木位于该田全部周边界线所圈定的范围内；“四周”对应סביב，并保留地产界限描述的全面性。
