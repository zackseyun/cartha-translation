  naturalness: “当着当地众人的面对以弗仑说”语序略显拥挤；调整为“当着当地众人的面，对以弗仑说”更自然。以“我的亡者”保留原文的归属性与庄重语体，并以脚注说明上下文所指。
  terminology: “价银”“收下”适合交易语境。“当地众人”可自然表达本段中עַם הָאָרֶץ所指的当地共同体；不必赋予后世专门社会称谓。“亡者”比“死去的亲人”更忠实于מֵתִי。
