  to: 他当着当地众人的面，对以弗仑说：“只是，请你听我说：田地的价银我给你[a]，请从我这里收下，好让我把我的亡者[b]葬在那里。”
  rationale: 删除无明确依据的“不”，以“只是，请你听我说”在不强加完整条件句的情况下保留原文略带转折、恳请的语气。将“死去的亲人”改为“我的亡者”，避免在正文增添原文未明说的亲属关系，同时保留上下文身份说明于脚注。其余交易用语及目的语气均可保留。
