  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: zh_hans
  text: 他当着当地众人的面，对以弗仑说：“只是，请你听我说：田地的价银我给你[a]，请从我这里收下，好让我把我的亡者[b]葬在那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “田地的价银我给你”原文采用完成式，直译可作“我已经给了田地的银子”；在这场交易中，这完成式很可能表示当场正式提出或确认给付。也可理解为“我愿付田地的价银”。
    reason: alternative_reading
  - marker: b
    text: “我的亡者”原文直译为“我的死者”；上下文所指的是撒拉。
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: דבר在此引出较正式的公开交涉；现代汉语用“说”最自然，语境本身保留了正式色彩。
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: 当着当地众人的面
  rationale: בְּאָזְנֵי字面与“耳朵”有关，实际表示“在……听得见的情况下”；עַם הָאָרֶץ在本段指当地共同体。此译既体现公开听证的场合，也避免生硬的“在……耳中”。
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: 不，你若肯，就请听我说
  rationale: 原文短语带有省略和恳请语气。אַךְ在交涉中表示转折或婉拒，לוּ加强愿望、请求意味；译文保留其略显顿挫的结构，不把它过度解释为完整条件句。
- source_word: נָתַתִּי
  choice: 我……给你
  rationale: 原文完成式在交易言语中很可能具有当场提出并确认给付的施为作用；汉语现在时表达可自然传达这一正式报价，同时用脚注保留形态及时间解释上的张力。
- source_word: כֶּסֶף הַשָּׂדֶה
  choice: 田地的价银
  rationale: כֶּסֶף本义为“银”，也用作货币；“价银”既保留银的具体意象，也清楚表达这是购买田地的款项。
- source_word: קַח מִמֶּנִּי
  choice: 请你从我这里收下
  rationale: 动词字面为“拿、取”，在交易语境中“收下”更符合现代汉语；宾语由上文“价银”自然补足。
- source_word: וְאֶקְבְּרָה
  choice: 好让我……葬
  rationale: 该形式带有第一人称意愿，连词在此可表达目的或预期结果；“好让我”自然传达这一语气。
- source_word: מֵתִי
  choice: 我死去的亲人
  rationale: 原文直译为“我的死者”，指属于亚伯拉罕家庭、由他负责安葬的死者；上下文明确为撒拉。“亲人”在现代汉语中自然庄重，但以脚注注明原文较简约的表达。
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 直接对应地点副词，指前述田地或其中的洞穴。
