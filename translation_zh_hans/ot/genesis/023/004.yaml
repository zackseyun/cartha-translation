base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: zh_hans
  text: 我在你们中间是外乡人，也是寄居者。请在你们中间给我一处坟地作产业[a]，好让我安葬我的死者，使其离开我的眼前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一处坟地作产业”也可译作“一处坟地”。希伯来语在这里含有持有土地、以之为产业的意思，不只是挖坟埋葬的地点。
    reason: lexical_alternative
  - marker: b
    text: 直译：“从我面前。”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: 外乡人
  rationale: 该词指离开本族本土、住在异地而没有完整土地权利的人。“外乡人”是现代汉语中自然的表达，也保留亚伯拉罕作为外来者的身份。
- source_word: וְתוֹשָׁב
  choice: 寄居者
  rationale: 该词强调住在当地却不是本地有产业者的社会身份。与“外乡人”并列，保留原文两个近义身份词的法律和社会色彩。
- source_word: עִמָּכֶם
  choice: 在你们中间／在你们这里
  rationale: 两处均有“与你们同在”的基本含义；第一处用“在你们中间”表达群体中的寄居身份，第二处用“在你们这里”自然表达取得当地坟地的请求。
- source_word: תְּנוּ לִי
  choice: 请……给我
  rationale: נתן的命令式本义是“给”。加“请”符合亚伯拉罕向当地人提出正式请求时的现代汉语语气，不改变命令式所表达的请求。
- source_word: אֲחֻזַּת קֶבֶר
  choice: 一块作产业的坟地
  rationale: אֲחֻזָּה不只表示埋葬地点，也可指依法持有的土地产业；译文保留本章重要的土地所有权意味。
- source_word: וְאֶקְבְּרָה
  choice: 好让我安葬
  rationale: 请求之后的愿望式在此表达目的；“好让我”自然传达这一目的关系。
- source_word: מֵתִי
  choice: 我死去的亲人
  rationale: 原文直译为“我的死者”，在语境中指亚伯拉罕家中死去的人。现代汉语用“我死去的亲人”较自然，同时不在正文中直接补出撒拉的名字。
- source_word: מִלְּפָנַי
  choice: 使死者离开我的眼前
  rationale: 尽量保留“从我面前”的空间意象，同时以现代汉语清楚表达安葬死者的结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“外乡人／寄居者”的并列和坟地作为土地产业的法律意味；对于现代汉语生硬的“我的死者”，按语境译为“我死去的亲人”，但不直接补出撒拉之名。
