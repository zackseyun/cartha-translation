base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/005.yaml
  text: The sons of Heth answered Abraham[a], saying to him,
translation:
  language: zh_hans
  text: 赫的子孙回答亚伯拉罕[a]，对他说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赫人”。希伯来文直译为“赫的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 回答
  rationale: ענה的Qal连续式在叙事对话中表示作出回应；“回答”自然且准确。
- source_word: בְנֵי חֵת
  choice: 赫的子孙
  rationale: 字面为“赫的众子”，是按祖先称呼族群的希伯来表达。“赫的子孙”既保留血缘称谓和人名，也比现代汉语中的“众子”更自然。
- source_word: אֶת אַבְרָהָם
  choice: 亚伯拉罕
  rationale: אֶת是确定直接宾语标记，汉语不另行译出。
- source_word: לֵאמֹר
  choice: 说
  rationale: אמר的不定式结构用于引出直接引语；结合前面的间接宾语，译作“对他说”符合现代汉语叙事习惯。
- source_word: לוֹ
  choice: 对他
  rationale: ל加第三人称阳性单数后缀明确指向亚伯拉罕，译为“对他”保留受话者。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“赫的子孙”保留原文的族系表达，脚注提供常见族名译法。“回答……对他说”略带希伯来叙事风格，但在现代汉语中仍清楚自然。
