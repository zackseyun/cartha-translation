base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: zh_hans
  text: 但是，挪亚在雅威眼中蒙了恩惠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“挪亚在雅威眼中蒙了恩典。”
    reason: 保留 וְ 可不译出显性转折连接词的可能性，并保留 חֵן 可译为“恩典”的词汇选择。
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: 可是，挪亚
  rationale: וְ 基本义为“和、而”，但此处与上文人类败坏及将受审判形成鲜明对比，因此译为“可是”既符合语篇关系，也保持现代汉语自然庄重的表达；נֹחַ 按通行中文译名译作“挪亚”。
- source_word: מָצָא
  choice: 蒙了
  rationale: מָצָא 字面为“找到”，但“找到恩惠”在现代汉语中不自然；希伯来语固定表达“在某人眼中找到恩惠”意为得到其恩待，故用“蒙了”作符合汉语习惯的对等表达。
- source_word: חֵן
  choice: 恩惠
  rationale: חֵן 可指恩惠、恩宠或好感。“恩惠”既表达雅威对挪亚的眷顾，又不把该词过度限定为后期系统神学中的专门术语。
- source_word: בְּ/עֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来语的“眼中”意象，同时在现代汉语中也是自然用法，表示在某人看来或获得某人的认可。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名 יְהוָה，不以“主”这一称号替代其专名；“雅威”是现代汉语中清晰、常见的对应形式。
theological_decisions:
- issue: חֵן 所表达的雅威对挪亚的态度
  choice: 恩惠
  alternative: 恩典
  rationale: “恩惠”保留该词在具体关系语境中所指的眷顾与优待，同时避免把经文未明确展开的后期教义内涵直接置入译文。“恩典”仍是合理的词义选择，列入脚注。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，故正文采用较贴近当前学界重构读音的“雅威”，保留其专名性质；“耶和华”是中文传统形式，但不是此处正文的首选。
translation_notes:
  register: 采用现代标准普通话、简体中文。句式简洁庄重；“在雅威眼中蒙了恩惠”既保留原文意象，又避免生硬直译“找到恩惠”。段落结束标记不进入正文。
