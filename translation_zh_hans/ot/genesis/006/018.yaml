  terminology: 保留“约”和“方舟”这两个规范且一致的经文术语。“确立我的约”保留原文“我的”的明示信息，并避免把“立约”这一汉语惯用搭配所可能弱化的属格完全省去。脚注保留“坚立／确认”的词义可能，不裁定该约是初次设立还是确认既有承诺。
