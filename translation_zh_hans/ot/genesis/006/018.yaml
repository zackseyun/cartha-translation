base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: zh_hans
  text: 但我要与你确立我的约[a]。你要进入方舟；你的儿子、你的妻子和你儿子的妻子也要同你一同进入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要与你坚立（或确认）我的约。”希伯来语动词在“约”的语境中可含“设立”或“坚立、确认”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: 但我要……立
  rationale: 希伯来语使役式动词在约的语境中可表示“设立”或“坚立、确认”。正文采用现代汉语中最自然的搭配“立约”；句首“但”体现本节与前文毁灭宣告之间的转折。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: “约”是现代中文圣经语境中对应 בְּרִית 的标准用语，既简洁，也保留其贯穿经文的神学意义。保留“我的”，不把“与你立我的约”简化为“与你立约”。
- source_word: אִתָּךְ
  choice: 与你／和你一起
  rationale: 第一次表示立约关系，译作“与你”；末尾同形介词表示同行，按汉语语境译作“和你一起”。
- source_word: וּבָאתָ אֶל הַתֵּבָה
  choice: 你要进入方舟
  rationale: בוא 可表示来、去或进入；目的地是方舟时，“进入”最清楚自然。תֵּבָה 在挪亚叙事中译作“方舟”，符合固定且准确的中文用语。
- source_word: אַתָּה
  choice: 就是你
  rationale: 独立人称代词带有强调作用；以“就是你”引出随后的人员清单，既体现强调，也符合现代汉语表达。
- source_word: וּבָנֶיךָ
  choice: 你的儿子们
  rationale: 原文明确为复数“儿子”，不泛化为“孩子”；加“们”清楚表达复数。
- source_word: וְאִשְׁתְּךָ
  choice: 你的妻子
  rationale: 按家庭关系直接译出，在现代标准汉语中自然明确。
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: 你儿子们的妻子
  rationale: 贴近原文的所属结构“你众儿子的妻子”，比“儿媳妇”少一层关系转换，同时保持自然。
theological_decisions:
- issue: 约的表达究竟指设立还是确认
  choice: 我要与你立我的约
  alternative: 我要向你坚立（或确认）我的约
  rationale: הקים ברית 在约的语境中既可能指设立约，也可能指坚立、确认已有的约。正文采用标准且自然的“立约”，脚注保留另一种词义可能，不据此断定这里是首次设立还是确认先前的承诺。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“方舟”和“约”保留规范经文术语；用两个句子避免过长，并以“就是你”体现原文独立代词的强调。末尾补出“进去”，使“和你一起”在汉语中所修饰的动作明确，同时不增加新的参与者或神学判断。
