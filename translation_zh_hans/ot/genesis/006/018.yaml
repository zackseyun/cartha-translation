  to: 但我要与你确立我的约[a]。你要进入方舟；你的儿子、你的妻子和你儿子的妻子也要同你一同进入。
  rationale: 修订主要处理汉语句法和指称关系：先单独陈述挪亚进入方舟，再说明其家人同他进入，既反映原文以独立代词强调“你”，也使末尾“与你”在中文中有明确、自然的所指。将“立我的约”调整为“确立我的约”，以较完整地表达使役动词与“我的”这一属格；脚注继续保留“坚立／确认”的可行替代，不作超出经文本身的神学判断。
