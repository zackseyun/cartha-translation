  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: zh_hans
  text: 神看见大地；看哪，大地已经败坏了[a]，因为凡有血肉的[b]都在地上败坏了自己的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “败坏”所译的希伯来词既可指道德上的腐败，也可指受损、毁坏；本节后半句的“败坏”也出自同一词根。
    reason: 说明关键词的语义范围及原文的词根呼应。
  - marker: b
    text: “凡有血肉的”直译为“所有肉体”，可泛指有血肉的众生；本段语境尤其着重于人类的行为。
    reason: 保留原文所指范围的宽泛性，避免把它无根据地限缩为单一类别。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 察看
  rationale: 这里是叙事中的“看见、观看”；译作“察看”符合现代汉语表达，也不额外加入审判或鉴察内心的含义。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本处指独一的神；“神”是简体中文圣经语体中自然、庄重的称呼。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 洪水叙事的语境广及全地；“大地”比“土地”更能表达这种范围，同时保持自然汉语。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注目、使所见情景鲜明呈现的语篇作用和庄重语气。
- source_word: נִשְׁחָתָה / הִשְׁחִית
  choice: 败坏了／败坏了
  rationale: 两处来自同一词根 שׁחת，分别为受动状态和使役性用法。“败坏”在汉语中可兼有道德腐化和受损毁坏的意味，并能保留原文的词根呼应。
- source_word: כָּל בָּשָׂר
  choice: 凡有血肉的
  rationale: 保留希伯来语“所有肉体”的宽泛意象，不把所指范围预先限定为全人类或所有生物；“凡有血肉的”在现代汉语中可懂而又庄重。
- source_word: דַּרְכּוֹ
  choice: 自己的道路
  rationale: 保留 דֶּרֶךְ 的“道路”隐喻；在这里指生活方式或行为。单数后缀随集合性主语按分配意义译作“自己的”。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: 准确表达行为发生于地上，与前面的“大地”形成自然呼应。
theological_decisions:
- issue: שׁחת 在两处的语义范围
  choice: 两处均译作“败坏”，并以脚注说明可兼指导德腐败和受损毁坏
  alternative: 译作“毁坏”或“腐化”
  rationale: 单译“腐化”容易把含义局限于道德层面，单译“毁坏”又容易只指物质破坏。“败坏”较能保留两者之间的张力，也显明众生的败坏与大地败坏之间的因果及词语联系。
- issue: כָּל בָּשָׂר 的范围
  choice: 译作“凡有血肉的”
  alternative: 译作“全人类”或“所有生物”
  rationale: 原文措辞宽泛，在语境中尤其涉及人类，却不宜在翻译中直接排除更广的所指；保留其意象可避免过早解决这种范围问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留原文突显所见情景的语篇标记；“自己的道路”保留原文隐喻，但整句仍符合当代普通话习惯。
