  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֑ים וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: zh_hans
  text: 大地在上帝面前败坏了[a]，大地充满了暴力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地在上帝眼中败坏了。”
    reason: 保留 הָאָרֶץ 可译为“地”，以及 לִפְנֵי 可按评价视角译为“在上帝眼中”的词义选择。
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: 败坏了
  rationale: שׁחת 的尼法勒式在这里表示陷入败坏、遭到败坏的状态；结合下文的“暴力”，主要指道德与社会秩序的败坏。“败坏了”既保留结果状态，也符合现代汉语叙事。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指“大地”或“地、土地”。洪水叙事的语境支持较广范围的“大地”；正文保留原文两次重复，以维持强调和句式对应。
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: 在上帝面前
  rationale: לִפְנֵי 的基本含义是“在……面前、在……临在中”。此译法贴近原文，同时可表达一切都处于上帝的察看和判断之下。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处 אֱלֹהִים 按上下文和句法明确指独一的上帝，故用单数称谓“上帝”。
- source_word: וַתִּמָּלֵא
  choice: 充满了
  rationale: מלא 的尼法勒式表示变得充满或被充满。“充满了”自然地表达其结果状态和叙事推进。
- source_word: חָמָס
  choice: 暴力
  rationale: חָמָס 可指暴力、残暴行为及伴随暴力的不义。“暴力”是直接、通行且不过度扩展的现代汉语表达。
- source_word: וַ
  choice: 句间承接，不另译连接词
  rationale: 句首 waw 承接希伯来语叙事；现代汉语无需机械译作“于是”或“现在”，上下文已足以表达推进。第二个 waw 以逗号连接两个并列分句。
theological_decisions:
- issue: “败坏”的性质
  choice: 正文以道德和社会性的败坏为主要语境，同时不在词面上添加“人类社会”等限定
  alternative: 将其理解为大地本身受到物质性的毁坏
  rationale: 紧接着的“暴力”以及前后文的人类邪恶，使道德败坏成为主要指向；但原文以“大地”为主语，译文保留这一表达，不把含义缩窄为明说的教义判断。
- issue: “大地”的范围
  choice: 采用范围较广的“大地”
  alternative: 译作“地”或“那地”，理解为特定地域
  rationale: 洪水叙事支持广泛范围，但 אֶרֶץ 本身有“大地／土地”的词义弹性，因此用脚注保留较窄译法的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“败坏”在此语境中仍属自然的道德用语；“暴力”比传统的“强暴”更符合当代读者习惯。正文保留“大地”的重复，以再现希伯来语的强调。
