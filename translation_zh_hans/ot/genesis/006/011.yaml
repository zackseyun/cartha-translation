  naturalness: “大地在上帝面前败坏了，大地充满了暴力”在现代标准汉语中庄重、清楚且适合叙事语体。“败坏”和“暴力”的搭配能表达该处道德与社会失序的语境，而不使用当代较可能引起歧义的“强暴”。
