language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: zh_hans
  text: 那些日子——后来也一样——当上帝的众子[b]与人的女儿们[c]同房，她们给他们生儿女的时候，地上有尼非林[a]。他们就是古时的勇士，是有名的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尼非林”是罕见的希伯来语词，确切含义未定；传统上也译作“巨人”。
    reason: alternative_reading
  - marker: b
    text: “上帝的众子”也可理解为“神圣的存在”；有些解释认为他们是人间统治者，或塞特的敬虔后裔。
    reason: alternative_reading
  - marker: c
    text: “人的女儿们”中的“人”是集合用法，指人类；即人类的女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: 尼非林人
  rationale: 该词在希伯来文中罕见，确切含义有争议；采用音译并加“人”，既便于中文理解，又避免以“巨人”或“堕落者”预先裁定词义。
- source_word: בָאָרֶץ
  choice: 在地上
  rationale: 在太古史语境中取较广的“地上”之义，比“在那地”自然。
- source_word: וְגַם אַחֲרֵי כֵן
  choice: 后来也有
  rationale: 保留“也”的附加语气和“后来”的时间意义，并让中文句子简洁自然。
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: 与……同房
  rationale: 该结构在此是委婉的性关系表达；中文用“同房”准确而庄重。希伯来文未明确限定为一次还是反复发生，因此不另加“每逢”。
- source_word: בְּנֵי הָאֱלֹהִים
  choice: 上帝的众子
  rationale: 形式上贴近原文，并保留其可能指超自然存在、统治者或敬虔人群等解释空间。
- source_word: בְּנוֹת הָאָדָם
  choice: 人类的女子
  rationale: אָדָם在这里是集合意义，指人类；“人类的女子”在现代中文中比“人的女儿们”更自然，也不误解为某一个人的女儿。
- source_word: וְיָלְדוּ לָהֶם
  choice: 她们就给他们生了儿女
  rationale: 补出希伯来文中语义蕴含的宾语“儿女”，使现代中文完整清楚，同时保留“给他们”的关系。
- source_word: הַגִּבֹּרִים
  choice: 勇士
  rationale: גִּבּוֹר可指有力量、有威势的人或战士；“勇士”保留人物的雄强色彩，但不美化为“英雄”。
- source_word: מֵעוֹלָם
  choice: 古时的
  rationale: 自然表达其久远年代之义。
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: 声名显赫的人
  rationale: 按希伯来习语表达享有名声的人，并保留较庄重的语体。
theological_decisions:
- issue: “上帝的众子”的身份
  choice: 正文保留“上帝的众子”，不作身份解释。
  alternative: 神圣存在、天使、王族统治者或塞特的敬虔后裔。
  rationale: 原文在此没有明确界定所指，译文不应消除这一真实的神学张力。
- issue: הַנְּפִלִים的含义
  choice: 正文音译为“尼非林人”。
  alternative: 巨人、堕落者。
  rationale: 该词罕见且词源和所指均有争议；音译可避免把传统解释写入正文。
- issue: הֵמָּה所指对象
  choice: 译作“这些人”，让它概括前句所述人物而不进一步限定。
  alternative: 明确指尼非林人，或明确指所生的儿女。
  rationale: 希伯来文代词与前文群体的对应存在句法解释空间，正文不宜断定“勇士”究竟只等同于尼非林人还是所生后代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“同房”保留原文的委婉性；“声名显赫的人”传达古雅庄重的结语。所有脚注标记均置于正文相关位置。
