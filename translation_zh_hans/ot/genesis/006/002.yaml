base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: zh_hans
  text: 上帝的众子[a]看见人类的女子容貌美丽[b]，便从她们中间任意挑选，娶来作自己的妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的众子”也可理解为“神圣的存在”。他们的身份历来有争议，主要解释包括天上的存在、人间的统治者或贵族，以及塞特的后裔。
    reason: alternative_reading
  - marker: b
    text: 或译：“长得好看”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: 上帝的众子
  rationale: 紧贴希伯来语的结构，保留这一称谓本身的歧义，不在正文中断定他们是天上 beings、人间统治者或塞特的后裔。
- source_word: בְּנוֹת הָאָדָם
  choice: 人类的女子
  rationale: אָדָם在这里作集合意义，指人类；译作“人类的女子”既自然，也保留其与“上帝的众子”的文学对照。
- source_word: כִּי טֹבֹת הֵנָּה
  choice: 容貌美丽
  rationale: טוֹב在此描述引发择偶行为的外貌吸引力；“容貌美丽”符合上下文，也避免误解为道德上的良善。
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: 娶来作自己的妻子
  rationale: נָשִׁים在此搭配中宜理解为“妻子”；“自己的”体现לָהֶם的反身受益含义。
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: 从中任意选择
  rationale: 表达מִכֹּל所体现的不受限制的选择范围，同时保持现代汉语自然流畅。
theological_decisions:
- issue: “上帝的众子”的身份
  choice: 正文保留“上帝的众子”，不具体判定其身份。
  alternative: 可理解为天上的 beings、人间的统治者或贵族，或塞特的后裔。
  rationale: 原文没有在本节内明确所指，且历来存在重要分歧；保留称谓可避免把某一种神学解释写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“众子”略带经文语体，用来保留希伯来语固定称谓；句子其余部分使用自然现代汉语。
