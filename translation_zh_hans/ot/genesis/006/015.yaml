  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: zh_hans
  text: 你要这样建造方舟：方舟长三百肘[a]，宽五十肘，高三十肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肘”是古代的长度单位，大致相当于从肘部到指尖的距离。
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: 你要这样建造方舟
  rationale: 该结构引出具体的建造方式；“这样建造”自然表达指示语气，并依据上下文将阴性宾语所指的“方舟”明说出来。
- source_word: הַתֵּבָה
  choice: 方舟
  rationale: תֵּבָה在挪亚叙事中指所建造的舟形容器；“方舟”是现代汉语圣经语境中清楚且通行的对应词。
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה אֹרֶךְ
  choice: 长三百肘
  rationale: 保留原文古代长度单位，不换算成现代单位；汉语尺寸说明以“长＋数值”表达最自然。
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: 宽五十肘
  rationale: רָחְבָּהּ表示“它的宽度”；简洁译为“宽五十肘”，符合现代汉语尺寸表述。
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: 高三十肘
  rationale: קוֹמָה在建筑尺寸语境中指高度，译作“高”准确而自然。
