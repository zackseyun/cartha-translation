id: GEN.6.13
reference: Genesis 6:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: zh_hans
  text: 上帝对挪亚说：“凡有血肉之物的结局已经来到我面前[a]，因为大地[b]因他们而充满了暴行。看哪，我要把他们连同大地一起毁灭[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡有血肉之物的结局已经来到我面前”也可译作“凡有血肉之物的末日已经临到我面前”，或“一切血肉之物的终局已经摆在我面前”。
    reason: 保留 קֵץ 及 בָּא לְפָנַי 的表达差异和司法意象。
  - marker: b
    text: “大地”也可译作“土地”或“全地”。
    reason: הָאָרֶץ 可按语境指大地、土地或全地。
  - marker: c
    text: 希伯来文直译近于“我要毁灭他们与大地”。原句也可理解为“我要毁灭他们和大地”；有些译法作“我要把他们与大地一同毁灭”。
    reason: אֶת־הָאָרֶץ 在已有代词宾语之后出现，句法关系存在真实歧义。
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: 凡有血肉之物的结局
  rationale: קֵץ表示终结、尽头；כָּל־בָּשָׂר直译为“所有血肉”，在洪水叙事中范围不限于人类。“凡有血肉之物”既保留原文意象，也自然表达所有血肉生命的广泛范围。
- source_word: בָּא לְפָנַי
  choice: 已经来到我面前
  rationale: 保留希伯来语“来到我面前”的形象及其可能含有的审判语气，不将其过度解释为单纯的时间临近。
- source_word: חָמָס
  choice: 暴行
  rationale: חָמָס可指暴力、残暴或严重不义；“暴行”在此兼顾暴力行为和道德恶行，符合洪水前败坏的语境。
- source_word: מִפְּנֵיהֶם
  choice: 因他们而
  rationale: 此处介词短语最自然地表达原因，即大地充满暴行是由他们造成的。
- source_word: וְהִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留 הִנֵּה 的强调和指示作用；与后面的分词连用时，“我要”自然传达即将采取行动之意。
- source_word: מַשְׁחִיתָם
  choice: 毁灭他们
  rationale: שׁחת 的使役形式在审判语境中表示毁坏或毁灭；此译法也呼应本章中受造界已经“败坏”的词根联系。
- source_word: אֶת־הָאָרֶץ
  choice: 连同大地一起
  rationale: 原文在“他们”之后又以直接宾语标记引出“大地”，句法较特殊。“连同大地一起”避免现代汉语将“大地”误解为毁灭的工具，同时保留他们与大地一同遭受毁灭的理解。
theological_decisions:
- issue: “凡有血肉之物”的范围
  choice: 保留广义表达，涵盖处在审判之下的血肉生命，不限于人类
  alternative: 专指全人类
  rationale: 洪水叙事中的 כָּל־בָּשָׂר 通常具有比人类更广的范围；译文不预先缩窄其所指。
- issue: הָאָרֶץ 的范围
  choice: 大地
  alternative: 土地
  rationale: “大地”符合洪水叙事的广阔范围，也保留该词可指地面、土地或全地的语义空间；脚注说明另一可能。
- issue: אֶת־הָאָרֶץ 与“毁灭”的句法关系
  choice: 理解为随同关系：“连同大地一起”
  alternative: 把“大地”视为第二个直接宾语：“毁灭他们和大地”；或较形式化地译为“与大地一起毁灭他们”
  rationale: 原文结构确有难度。正文采用自然且不致产生工具性误解的汉语，同时在脚注中保留其他句法分析。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“凡有血肉之物”保留原文的具体意象和叙事呼应；“暴行”比抽象的“不义”更贴近 חָמָס 的暴力色彩；“看哪”保留神谕式宣告的强调语气。
