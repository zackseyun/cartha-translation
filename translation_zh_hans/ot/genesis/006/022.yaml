  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֥ה אֹת֛/וֹ אֱלֹהִ֖ים כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/022.yaml
  text: Thus Noah did[a]; according to all that God commanded him[b], so he did.
translation:
  language: zh_hans
  text: 挪亚就这样做了[a]；凡上帝所吩咐他的，他都照样做了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文重复“做”这个动词以示强调，直译为：“挪亚做了……他照样做了。”
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“挪亚做了这事；凡上帝所吩咐他的，他都照样做了。”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 就这样做了
  rationale: עשה是宽泛的“做、制造”。这里概括挪亚对前述指示的执行；“就这样做了”在现代汉语中自然，并体现叙事承接。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统通行的人名译法。
- source_word: כְּכֹל אֲשֶׁר
  choice: 凡……都照样
  rationale: 该结构表达完全依照全部命令而行；“凡……都”体现范围的周全，“照样”保留כ的符合、依照之意。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צוה表示有权威的命令。“吩咐”既保留权威性，也符合现代中文叙事语体。
- source_word: אֹתוֹ
  choice: 他
  rationale: 带第三人称阳性单数后缀的直接宾语标记，所指为挪亚。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为形态复数，却与单数动词搭配，明确指独一的上帝；采用现代普通话中通行且庄重的译名。
- source_word: כֵּן
  choice: 照样
  rationale: כֵּן回指前面的命令，强调行动与命令相符；“照样”简洁自然。
- source_word: עָשָׂה
  choice: 做了
  rationale: 保留עשה在句末的重复，以呈现原文对挪亚切实、完全遵行的强调。
theological_decisions:
- issue: 如何处理两次重复的עשה，以免释去原文的强调
  choice: 保留前后两个“做了”：‘挪亚就这样做了……他都照样做了’
  alternative: 挪亚遵照上帝的一切吩咐做了
  rationale: 原文有意重复同一动词。保留重复可忠实传达对挪亚顺服行动的强调，同时不额外加入“完全顺服”等解释性神学措辞。
- issue: 首句无明示宾语所形成的语义关系
  choice: 译作“就这样做了”，将其理解为对前文造方舟指示的概括
  alternative: 挪亚做了这事
  rationale: 希伯来语首个עשה没有明示宾语，可概括前文行动，也可由后半句加以说明。“这样”保持回指作用，且比“这事”更符合现代汉语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“凡……都……”体现命令范围的完整性；刻意保留原文重复，未将其润饰为单句。
