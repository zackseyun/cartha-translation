  text: וְ/אַתָּ֣ה קַח לְ/ךָ֗ מִ/כָּל מַֽאֲכָל֙ אֲשֶׁ֣ר יֵֽאָכֵ֔ל וְ/אָסַפְתָּ֖ אֵלֶ֑י/ךָ וְ/הָיָ֥ה לְ/ךָ֛ וְ/לָ/הֶ֖ם לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: zh_hans
  text: 你要为自己从一切可吃的食物[a]中取一些，把这些收集起来；这些要供你和它们食用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“供食用的”。希伯来语也可较直译为“被吃的”。
    reason: 保留אֲשֶׁר יֵאָכֵל在实际被食用与适宜供食用之间的语义幅度。
lexical_decisions:
- source_word: קַח־לְךָ
  choice: 为自己……取一些
  rationale: קַח是“拿取”的命令式；לְךָ在这里带有为自己预备的受益或反身意味。“取一些”也配合后面的部分性介词מִן，避免误解为要取走全部食物。
- source_word: מִכָּל מַאֲכָל
  choice: 从一切……食物中
  rationale: 保留מִן的部分性和כָּל的全面范围，表达从所有可供食用的类别中选取所需食物。
- source_word: אֲשֶׁר יֵאָכֵל
  choice: 可吃的
  rationale: אכל的Nifal未完成式在关系从句中可表示“被吃”或适宜供食用；“可吃的”在现代汉语中自然，并保留其适用性含义。
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: 收集到你那里
  rationale: אָסַף意为收集、聚拢，אֵלֶיךָ表示朝向挪亚所在之处；此译法保留两者，同时不额外加入“储藏”等原文未明说的概念。
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: 这些要作你和它们的食物
  rationale: 用“这些”自然回指前述作为集合概念的食物；重复体现לְךָ与לָהֶם所区分的挪亚和动物，לְאָכְלָה按汉语习惯译为“食物”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“你要”表达直接命令，用“它们”回指前文的动物；避免文言化的“作食物给你和它们”，也不加入原文没有明说的储存方式。
