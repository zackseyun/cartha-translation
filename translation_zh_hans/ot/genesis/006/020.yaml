base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: zh_hans
  text: 飞鸟各从其类，牲畜各从其类，地上一切爬行的动物也各从其类；各有两个要到你这里来，为要保全它们的生命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעוֹף
  choice: 飞鸟
  rationale: 该词可泛指有翼、会飞的生物；在本节动物分类的语境中，“飞鸟”自然清楚，也保留了与地上动物的对比。
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: 各从其类
  rationale: מִין表示类别或种类，并不等同于现代生物学的物种概念。“各从其类”简洁庄重，保留原文反复出现的分类意味。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 该词在这里指与飞鸟和爬行动物并列的陆生牲畜类；“牲畜”比“牛”范围更合适，也比泛称“走兽”更贴近此处的类别。
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: 地上一切爬行动物
  rationale: רֶמֶשׂ指贴近地面活动、爬行的小动物，הָאֲדָמָה指土地或地面；此译自然呈现二者，并与飞鸟形成空间上的对照。
- source_word: שְׁנַיִם מִכֹּל
  choice: 每一类各有两个
  rationale: 原文表达从前述每一类别中各有两个，采用分配式中文，清楚保留数量和范围。
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: 到你这里来
  rationale: 忠实表达朝向挪亚而来的动作，不把原文未明说的“进入方舟”加入本句。
- source_word: לְהַחֲיוֹת
  choice: 为要保全它们的生命
  rationale: חיה的使役形式表示使之存活或保全生命；此译保留不定式的目的意义，且符合现代中文表达。
theological_decisions: []
