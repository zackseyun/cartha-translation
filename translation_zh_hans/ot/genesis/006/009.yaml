  text: אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּ/דֹֽרֹתָ֑י/ו אֶת הָֽ/אֱלֹהִ֖ים הִֽתְהַלֶּךְ נֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: zh_hans
  text: 这是挪亚的后代记。挪亚是个义人，在他的世代中无可指责[a]。挪亚与神同行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在同时代的人中无可指责”；或：“在他那个时代无可指责”。
    reason: 保留 בְּדֹרֹתָיו 可能指同时代的人或挪亚所处时代的歧义。
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: 这是……的后代记
  rationale: “后代记”保留《创世记》中 תּוֹלְדֹת 反复出现的结构性关键词，也可涵盖家系及相关记述；汉语以单数判断句“这是”表达，比机械译成“这些是”自然。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אִישׁ צַדִּיק
  choice: 是个义人
  rationale: 准确表达阳性单数所指的挪亚，并以“义人”保留 צַדִּיק 的伦理和神学分量。
- source_word: תָּמִים
  choice: 无可指责
  rationale: 在品格描述中表示完整、正直、无可非议，并不必然声称绝对无罪；此译法自然且避免引入经文未明说的绝对完美。
- source_word: בְּדֹרֹתָיו
  choice: 在他的世代中
  rationale: 较贴近原文复数形式，保留“在其历经的世代中”与“在同时代的人中”之间的解释空间；较自然的理解列入脚注。
- source_word: אֶת־הָאֱלֹהִים הִתְהַלֶּךְ
  choice: 与神同行
  rationale: 保留希伯来文“行走”的生活隐喻及其经文互文，同时自然表达挪亚与神相交、按神旨意生活的含义。
theological_decisions:
- issue: תָּמִים 对挪亚品格的描述
  choice: 译作“无可指责”，表达正直纯全而不明言绝对无罪
  alternative: “完全”或“毫无瑕疵”
  rationale: 上下文将挪亚与败坏的世代相对照，但该词本身不要求读成无罪的完美；译文应保留称许而不额外建立教义结论。
- issue: בְּדֹרֹתָיו 的范围
  choice: 正文保留“在他的世代中”
  alternative: “在同时代的人中”或“在他那个时代”
  rationale: 原文复数短语可涉及挪亚所处的世代，也可着重指他的同时代人；正文保留其形式和张力，脚注提供通顺的解释性译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“后代记”和“与神同行”保留《创世记》的关键结构用语与核心隐喻；“在他的世代中”略带经文式语感，用以保存原文的复数形式及解释开放性。
