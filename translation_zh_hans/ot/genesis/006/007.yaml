id: GEN.6.7
reference: Genesis 6:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: zh_hans
  text: 耶和华说：“我要把我所创造的人[a]从地面上抹去——从人到牲畜，到爬行的生物，直到天空的飞鸟[c]——因为我后悔造了他们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”在这里是集合用法，指人类。希伯来语אָדָם既可指个别的人，也可统称人类；本节后面再次使用同一个词。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我为造了他们而忧伤”。希伯来语נחם的Niphal形式可表达对先前行动的后悔或忧伤；这个词本身并没有说上帝感到意外、事先不知，或犯了道德错误。
    reason: alternative_reading
  - marker: c
    text: 直译“天上的飞鸟”，即“天空的飞鸟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来对应四字神名，避免以“主”取代原文专名。
- source_word: אֶמְחֶה
  choice: 抹去
  rationale: 保留 מחה 擦除、抹除的具体意象，并与“从地面上”自然搭配。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处 אָדָם 是集合用法，指人类；“人”既简洁自然，也保留它与后文同一词语重复出现的联系。
- source_word: אֲשֶׁר בָּרָאתִי
  choice: 我所创造的
  rationale: 以中文“所”字结构准确表达关系从句及已经完成的创造行动。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 以自然中文传达希伯来语“从土地表面”的空间意象；אֲדָמָה 在这里具体指地面、土地。
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמַיִם
  choice: 无论是人、牲畜、爬行动物，还是天空的飞鸟，都要抹去
  rationale: 保留原文逐项扩展的列举范围；补出“都要抹去”，使中文句法清楚，并明确各类生物都在动词作用范围内。
- source_word: נִחַמְתִּי
  choice: 我后悔
  rationale: 该 Niphal 完成式在说明先前行动的 כִּי 从句前，直接表达对既往行动的追悔或懊悔；“后悔”保留原文的神学张力，不将其弱化为一般悲伤。
- source_word: כִּי עֲשִׂיתִם
  choice: 因为我后悔造了他们
  rationale: 复数宾语后缀回指前面列举的受造生物；中文以“他们”统摄这些有生命者，并自然表达造成后的追溯性情绪。
theological_decisions:
- issue: נִחַמְתִּי 所表达的神之追悔
  choice: 因为我后悔造了他们
  alternative: 因为我为造了他们而忧伤
  rationale: 原文既可涉及追悔，也包含忧伤色彩；在此由后接从句明确指出先前行动，故“后悔”更直接。译文不消解这一张力；脚注同时说明，该词本身并未断言上帝事先不知、感到意外或犯了道德错误。
- issue: הָאָדָם 的集合意义
  choice: 人
  alternative: 人类
  rationale: “人”在现代中文中可作集合名词，并能保留同一希伯来词在主句和列举中的重复；脚注注明其集合义，以防被误解为单一个体。
- issue: 复数后缀 ם 的指代范围
  choice: 他们
  alternative: 这一切活物
  rationale: 语法上的阳性复数后缀回指前面所列受造者。“他们”较贴近代词形式；其范围由上下文清楚限定，并不只指人。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“抹去”保留原文的具体意象；“无论是……还是……”使希伯来语连续使用 עַד 的范围列举在中文中清楚流畅。脚注标记均置于对应词句之后。
