  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: zh_hans
  text: 你要用歌斐木[a]为自己造一只方舟；要在方舟里做一个个舱室[b]，并用沥青[c]把方舟里面和外面都涂上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“柏木”。“歌斐”一词在希伯来圣经中只出现于此，确切指哪一种木材不能确定。
    reason: lexical_alternative
  - marker: b
    text: 或译“隔舱”；原文直译为“巢”。
    reason: lexical_alternative
  - marker: c
    text: “涂上”也可译为“涂覆”或“密封”；“沥青”也可译为“焦油”。原文表示“涂”的动词与表示涂料的名词彼此相关。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: 你要为自己造
  rationale: 祈使式 עֲשֵׂה 表示“造、制作”，לְךָ 表示“为自己”。“造”符合大型器物的语境，又没有把一般性的动词过度限定为某种具体施工方式。
- source_word: תֵּבַת
  choice: 方舟
  rationale: תֵּבָה 指箱柜状的容器或舟体，并不是普通“船”的常用希伯来词。“方舟”是现代中文中清楚而庄重的惯用译法，也维持《创世记》6—9章与《出埃及记》2章之间的用词联系。
- source_word: עֲצֵי גֹפֶר
  choice: 歌斐木
  rationale: גֹפֶר 在希伯来圣经中只见于此，所指木种无法确定。采用音译“歌斐木”比武断指定为柏木或其他树种更能保留原文的不确定性。
- source_word: קִנִּים
  choice: 一个个舱室
  rationale: 该词字面义与“巢”有关，在这里指方舟内部划分出的空间。“舱室”适合舟体语境，“一个个”传达复数及分隔成格的意思。
- source_word: וְכָפַרְתָּ אֹתָהּ
  choice: 把方舟……都涂上
  rationale: 此处 כפר 是非祭祀语境中的“涂抹、覆盖”。“涂上”自然表达将材料覆于表面的动作，而不把功能直接解释成“密封”。
- source_word: בַּכֹּפֶר
  choice: 用沥青
  rationale: כֹּפֶר 在此指用于覆盖、防水的黏性材料。“沥青”是清楚且符合古代材料语境的中文对应；具体物质仍有一定词义范围，故加注说明。
- source_word: מִבַּיִת וּמִחוּץ
  choice: 内外
  rationale: 这对短语表示里面和外面两面都要涂覆。“内外”简洁、自然，并完整传达范围。
theological_decisions: []
