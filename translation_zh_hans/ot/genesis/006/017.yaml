  - severity: low
    issue: ‘洪水，就是大水’不够自然，且略带解释性。
    rationale: הַמַּבּוּל מַיִם确实同时出现洪水的专名与‘水’，但汉语‘洪水’本身已表达水的灾变；使用同位语会造成不必要的同义重复。
