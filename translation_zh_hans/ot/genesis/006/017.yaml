- from: 至于我，看哪，我正要使洪水，就是大水，临到地上，为要毁灭天下一切有血肉、里面有生命之气[a]的。凡地上的都必气绝。
  to: 至于我，看哪，我要使洪水临到地上，为要毁灭在天之下一切有血肉、里面有生命气息[a]的；凡在地上的都必气绝。
  rationale: 修订避免把分词不必要地收窄为‘正要’，删去中文中不自然的‘就是大水’，并以‘在天之下’和‘凡在地上的’更完整、顺畅地对应原文的范围表达。正文仍保留‘生命气息’，脚注继续呈现‘生命之灵’的词汇替代可能。
