  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: zh_hans
  text: 至于我，看哪，我要使洪水临到地上，为要毁灭在天之下一切有血肉、里面有生命气息[a]的；凡在地上的都必气绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“生命之灵”。希伯来语רוּחַ可指“气息”、“风”或“灵”。
    reason: 保留原词真实存在的词义歧义，避免正文作出过度的神学限定。
lexical_decisions:
- source_word: וַאֲנִי
  choice: 至于我
  rationale: 独立代词带有强调和对比作用；“至于我”在现代汉语中自然保留这一话语力量。
- source_word: הִנְנִי מֵבִיא
  choice: 看哪，我正要使……临到
  rationale: “看哪”保留郑重、引人注意的语气；分词表达迫近的行动，“正要”比单纯将来式更能体现其临近性。
- source_word: הַמַּבּוּל מַיִם
  choice: 洪水，就是大水
  rationale: 保留“洪水”这一特指大洪水的词，也显明原文随后出现的“水”；用解释性同位语避免生硬的“水的洪水”。
- source_word: עַל הָאָרֶץ
  choice: 临到地上
  rationale: 这里指洪水来到大地之上；“地上”符合本段广泛的审判范围。
- source_word: לְשַׁחֵת
  choice: 为要毁灭
  rationale: 明确表达不定式的目的含义，并保留原文所宣告的彻底毁坏。
- source_word: כָּל בָּשָׂר
  choice: 一切有血肉的
  rationale: 保留圣经中“血肉”这一整体性表达，同时用“有血肉的”使现代读者容易理解其所指的活物。
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: 里面有生命之气的
  rationale: “生命之气”最贴合洪水语境中使活物存活的气息，也不排除原词所含“灵”的可能，因此另加脚注说明。
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: 天下
  rationale: “天下”自然表达“诸天之下”的空间范围，并保留其全面性。
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: 凡地上的
  rationale: 简洁保留原文总结性的全称范围。
- source_word: יִגְוָע
  choice: 都必气绝
  rationale: 该动词常指断气而死；“气绝”既准确又与前面的“生命之气”形成语义呼应。
theological_decisions:
- issue: רוּחַ在רוּחַ חַיִּים中的含义
  choice: 生命之气
  alternative: 生命之灵
  rationale: 在洪水叙事中，这个短语最自然地指活物赖以存活的气息，并与创世记的生命气息主题呼应；但原词也可指“灵”，故不在正文中强行消除歧义，而以脚注保留另一译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留神谕宣告的郑重语气；“洪水，就是大水”较贴近原文的双重表达；整体句式适合普通现代读者，也保留创世记叙事的肃穆感。
