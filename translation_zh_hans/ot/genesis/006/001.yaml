base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: zh_hans
  text: 后来，当人开始在地面上增多、女儿为他们而生的时候，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: 后来，……
  rationale: 这是叙事推进结构，结合后面的时间从句，引出新的发展。汉语用“后来”比逐字译作“事情发生了，当……”更自然，也保留了承接叙事的功能。
- source_word: הֵחֵל
  choice: 开始
  rationale: 该动词在此结构中表示某一过程的开端，直译为“开始”。
- source_word: הָאָדָם
  choice: 人
  rationale: 虽为语法单数，此处具有集合意义，指总体人类，而不是个体亚当；现代汉语的“人”可自然表达这种泛指和集合用法。
- source_word: לָרֹב
  choice: 增多
  rationale: 表示人口数量增加；“增多”准确而自然，并避免把含义误解为繁殖命令。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 在地面上
  rationale: 保留“在……表面上”的空间意象，同时将 אֲדָמָה 与较宽泛的“地/大地”区分开来。
- source_word: וּבָנוֹת
  choice: 女儿也
  rationale: בָּנוֹת 直指“女儿”；连接词在汉语中译作“也”，自然承接人口增多这一背景。
- source_word: יֻלְּדוּ לָהֶם
  choice: 为他们生下来
  rationale: 保留被动语态及 לָהֶם 所表达的关系，即女儿出生归于这些人；“生下来”符合现代汉语表达。
theological_decisions:
- issue: הָאָדָם 在泛指人类语境中的译法
  choice: 人
  alternative: 人类
  rationale: 原文形式为单数但具有集合意义。“人”既贴近原文形式，又在现代汉语中可泛指人类整体；本节并非专指男性或亚当，因此不译作“男人”或“亚当”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。避免生硬照搬希伯来语的“事情发生了，当……”，以“后来”自然推进叙事；整句保留原文尚未完结、继续引向下一节的结构感。
