source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: zh_hans
  text: 耶和华看见，人在地上的罪恶甚大[a]；人心中一切思想意念的倾向，终日尽都是恶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”在这里是集合用法，指人类。
    reason: lexical_alternative
  - marker: b
    text: 或译：“始终只是恶。”原文直译为“终日只是恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见
  rationale: 该叙事性动词承接上文、推进情节；现代汉语无须机械添加“于是”或“并且”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中辨识度最高的神名译法，表明原文使用的是专名，而非普通称号。
- source_word: רַבָּה רָעַת הָאָדָם
  choice: 人的罪恶很大
  rationale: רָעָה在此指道德上的邪恶，רַבָּה强调其程度和规模；“罪恶很大”既贴近原文，也自然庄重。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处אָדָם为集合、泛指用法，指全人类；中文“人”可自然保留这种代表性与集体性。
- source_word: בָּאָרֶץ
  choice: 在地上
  rationale: 创世记远古史语境指全地，而非某一特定地域；“在地上”符合中文表达。
- source_word: יֵצֶר
  choice: 所构想的
  rationale: 该词可指被塑成的意向、倾向或构思；与“念头”结合译为“所构想的”，保留其形成、构成之意，避免仅译作固定性格倾向。
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: 人心里……一切念头
  rationale: “心”在希伯来语中涵盖思想、意志和欲望；保留“心”而不缩减为单纯的头脑活动。
- source_word: רַק רַע כָּל־הַיּוֹם
  choice: 终日尽都是恶
  rationale: “尽都是”表达רַק的排他性，“终日”直译时间短语，同时也容许其表达持续不断的语义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文明确使用以色列上帝的专名。中文采用通行且易识别的“耶和华”，不以称号“主”取代专名；“雅威”更接近常见学术重构读音，但在普通中文读者中辨识度较低。
- issue: אָדָם的集合性所指
  choice: 人
  alternative: 人类；世人
  rationale: 这里不是仅指男性个体，而是泛指、集合地指全人类。中文“人”可同时保持原文简洁和普遍范围，脚注明示其集合意义。
- issue: יֵצֶר מַחְשְׁבֹת לִבּוֹ的理解
  choice: 人心里所构想的一切念头
  alternative: 人心中一切思想的倾向；人心所计划的一切
  rationale: 原短语结构紧密但语义浓缩，可指内心思想的构想、倾向或意图。正文保留“心”和构想活动，不把它系统化为某种固定的人性教义。
- issue: רַק רַע כָּל־הַיּוֹם的绝对与持续含义
  choice: 终日尽都是恶
  alternative: 不断地作恶；始终只是恶
  rationale: 正文同时保留רַק的排他性和כָּל־הַיּוֹם的时间表达，不将其仅化约为行为频率。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。句式保留原文从外在罪恶转向内心思想的递进，并用逗号呈现两个并列的观察内容。
