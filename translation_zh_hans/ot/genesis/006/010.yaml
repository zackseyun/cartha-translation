  language: zh_hans
  text: 挪亚生了[a]三个儿子：闪、含和雅弗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“成为了三个儿子的父亲”。
    reason: 说明וַיּוֹלֶד在男性主语下所表达的父系生育含义，避免把汉语“生了”误解为挪亚亲自分娩。
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 这是ילד的使役形叙事形式，以男性为主语时表示“生育、成为……的父亲”。“生了”在现代汉语家谱叙述中自然简洁，也保留了父子关系；“有了”虽更口语化，却弱化了原词的生育含义。
- source_word: שְׁלֹשָׁה בָנִים
  choice: 三个儿子
  rationale: בָנִים在此明确指男性后代，且下文列出三位男性名字，因此译作“儿子”，不泛化为“孩子”。
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: 闪、含和雅弗
  rationale: 三个אֶת分别标明同位列举的直接宾语。汉语用冒号引出姓名，并按通行圣经译名音译。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用该希伯来人名在现代汉语圣经传统中的通行译名。
