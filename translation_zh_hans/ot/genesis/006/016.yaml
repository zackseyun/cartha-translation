base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: zh_hans
  text: 你要给方舟造一个顶盖[a]，方舟顶部要做到一肘[b]。要把方舟的门安在一侧。要把方舟造为三层：下层、第二层和第三层[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“窗”或“天窗”。希伯来语这个词很少见，也可能指让光进入的开口，而不是完整的顶盖。
    reason: lexical_alternative
  - marker: b
    text: “方舟顶部要做到一肘”所译的原文含义不明确，可能是说方舟顶部逐渐收窄，最后达到一肘；也可能是说顶盖在上方留出一肘的开口。
    reason: textual_difficulty
  - marker: c
    text: “层”也可理解为船舱内的各层或各层甲板。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: 顶盖
  rationale: 此词罕见，确切所指有争议。结合后句关于方舟顶部完工的说明，“顶盖”最符合建筑语境；“窗”或“天窗”仍属可能，故列入脚注。
- source_word: וְאֶל־אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: 顶端要把它收至一肘
  rationale: תְּכַלֶנָּה 表示“完成、做完”，而整句句法和具体结构不明。“收至一肘”以自然中文表达顶部最终达到一肘这一常见理解，同时用脚注保留原文难解之处，不进一步规定这一肘究竟是宽度、高度还是开口尺寸。
- source_word: פֶּתַח
  choice: 门
  rationale: 本义为“开口、入口”；在建造方舟并供出入的语境中，“门”最自然。
- source_word: בְּצִדָּהּ
  choice: 在方舟的一侧
  rationale: 表示门的位置在方舟侧面；“一侧”符合现代汉语建筑表达。
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: 下层、第二层和第三层
  rationale: 按希伯来文依次保留“下、第二、第三”的表达，不擅自改成“下、中、上”，也避免用带较强船舶联想的“甲板”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的命令句式。“你要……要……”贴近希伯来语连续指令的语气。对罕见词 צֹהַר 和难解的顶部尺寸说明不作过度确定的建筑学解释，并以脚注保留主要可能性。
