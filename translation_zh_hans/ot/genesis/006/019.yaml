base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: zh_hans
  text: 你还要把凡有血肉的[b]活物[a]，每样两个带进方舟，好让它们与你一同存活；它们要有公有母。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活物”也可译作“生物”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“一切血肉”，是指有血肉的生物。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי מִכָּל בָּשָׂר
  choice: 凡有血肉的活物
  rationale: “活物”表达 הַחַי 所指的有生命者；“有血肉的”保留 מִכָּל בָּשָׂר 的希伯来表达，同时整体采用自然的现代汉语语序。
- source_word: שְׁנַיִם מִכֹּל
  choice: 每样两个
  rationale: 清楚表达从所指的每一类中取两个的分配意义，避免直译成“从全部中两个”所造成的歧义。
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: 带进方舟
  rationale: Hiphil 动词表达“带来、带入”，介词在此表示进入方舟；“带进方舟”简洁自然。
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: 使它们和你一同存活
  rationale: 保留使役不定式“使……活着、保全生命”的意义，也准确表达 אִתָּךְ 的伴随关系。
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: 它们要一公一母
  rationale: 在动物语境中，“公、母”比泛称的“男、女”自然，并保留每一对由雄性和雌性组成的要求。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“你还要”承接上文并体现句首连接词；正文保留“有血肉的”这一希伯来意象，脚注说明其惯用含义。
