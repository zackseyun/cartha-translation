  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: zh_hans
  text: 于是，雅威说：“我的灵不会永远与人相争[a]，因为他[b]是肉体[c]；他的年日必是一百二十年[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的灵不会永远住在人里面（或停留在人里面）。”原文动词含义有争议。
    reason: alternative_reading
  - marker: b
    text: “他”译自希伯来语אָדָם；这里用单数泛指全人类。
    reason: lexical_alternative
  - marker: c
    text: 或译：“因为他也是肉体。”原文罕见的连接形式可能带有“也”的意味。
    reason: alternative_reading
  - marker: d
    text: “一百二十年”可能指人的寿命，也可能指洪水来到以前所余的期限；原文没有明确说明。
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现上帝的专名，而不以“主”这一称号替代。
- source_word: יָדוֹן
  choice: 相争
  rationale: 该动词词义有争议；“相争”保留上帝与败坏人类抗衡、约束或责备的可能含义，同时以脚注注明“住在／停留”的重要异读。
- source_word: רוּחִי
  choice: 我的灵
  rationale: 说话者是上帝，第一人称所有格在本处较自然地指上帝的灵；不把它具体限定为后期教义表述。
- source_word: בָאָדָם
  choice: 与人
  rationale: 与所选的“相争”搭配时，介词自然译作“与”；אָדָם在这里是泛指人类的单数名词。
- source_word: לְעֹלָם
  choice: 永远
  rationale: 符合本处语境，也是在现代汉语中自然、庄重的表达。
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: 因为人是血肉之躯
  rationale: 将罕见形式בְּשַׁגַּם按因果关系处理；“血肉之躯”保留בָשָׂר的具身、脆弱含义，又比单说“肉体”更符合现代汉语。原文可能含“也”的意味，列入脚注。
- source_word: וְהָיוּ יָמָיו
  choice: 他的年日将是
  rationale: 保留原文泛指单数和“年日”的措辞，不在正文中明确判定这是寿命上限还是洪水前的期限。
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: 一百二十年
  rationale: 直译数字与时间单位，表达清楚自然。
theological_decisions:
- issue: 上帝的“灵”与人的关系
  choice: 译作“我的灵”，并在正文采用“与人相争”
  alternative: “我的气息不会永远留在人里面”
  rationale: רוּחַ可指灵、气息或风，יָדוֹן的词义也不确定。正文采用较能体现审判语境的读法，但用脚注保存“住在／停留”的真实可能性。
- issue: אָדָם的范围
  choice: 译作泛指的“人”
  alternative: “人类”或“世人”
  rationale: 原文是单数泛指；汉语“人”既能保留简洁形式，也能自然涵盖全人类。
- issue: 一百二十年的所指
  choice: 按原文直译为“他的年日将是一百二十年”
  alternative: 明确解释为人的寿命上限，或洪水前剩余的宽限期
  rationale: 原句本身没有明确排除这两种理解，因此正文不替读者解决这一解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威”保留神名；“血肉之躯”自然传达人的肉身性与脆弱性。正文尽量维持原文的简洁和解释空间，争议词义及“一百二十年”的所指均以脚注说明。
