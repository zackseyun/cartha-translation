base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: zh_hans
  text: 耶和华后悔[b]造了地上的人[a]，心里感到伤痛[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”在这里是集合用法，指人类。
    reason: lexical_alternative
  - marker: b
    text: “后悔”也可译作“因造了……而痛惜”。希伯来语此词表达对先前行动的后悔或悲痛；这个词本身并没有说神感到意外、缺乏预知或犯了道德错误。
    reason: lexical_alternative
  - marker: c
    text: “心里”直译为“向着他的心”，表达深入内心的痛楚。
    reason: source_form
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: 后悔
  rationale: 该词在此为尼法勒词干，后接说明先前行动的כִּי从句，表达对既成之事的追悔或痛惜。“后悔”保留了这种回顾性的评价力度；经文本身并未说明耶和华因此感到意外、缺乏预知或犯了道德错误。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确对应四字神名YHWH，而不以“主”替代。
- source_word: כִּי
  choice: 因……而
  rationale: 此处引出耶和华后悔所关涉的内容及缘由；中文“因造了……而后悔”自然地兼顾这两层关系。
- source_word: עָשָׂה
  choice: 造了
  rationale: 语境指耶和华先前创造人类的行动；“造”比泛泛的“做”更符合创世记语境，完成体“了”表明行动在先。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处אָדָם是集合用法，指人类，而不是单指亚当。“人”在现代汉语中可自然表达这一泛指、集合意义。
- source_word: בָּאָרֶץ
  choice: 地上的
  rationale: 这里指地面或全地，不是某一特定地域；“地上的人”简洁自然，并保留空间关系。
- source_word: וַיִּתְעַצֵּב
  choice: 忧伤
  rationale: 该词表达内在的痛楚或受伤；“忧伤”在现代庄重中文中自然，并与前面的“后悔”保持两个不同动作或状态。
- source_word: אֶל־לִבּוֹ
  choice: 心里
  rationale: 介词אֶל字面可作“向、到”，但本短语表达痛楚深入内心；“心里”是自然中文，也保留内在感受的意象。
theological_decisions:
- issue: 关于神的拟人情感表述（“后悔”“忧伤”）
  choice: 直接保留耶和华因造人而“后悔”、并且“心里忧伤”的表述。
  alternative: 译作“感到遗憾”“转意”或用弱化措辞避免神会后悔的含义。
  rationale: 原文以两个不同动词陈述回顾性的后悔与内心的痛楚，并未解释这与神的预知如何协调。译文不应在正文中消除这一神学张力，也不应额外加入意外、无知或道德过失等原文未说的含义。
- issue: הָאָדָם的集合意义
  choice: 译作“人”，按集合意义理解为人类。
  alternative: 译作“亚当”或明确译作“人类”。
  rationale: 上下文所论的是全体人类的败坏。“人”既贴近原词，又能在现代汉语中自然承担泛指人类的功能；脚注明确其集合意义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式保留原文“后悔—忧伤”的两重推进，避免把两个希伯来动词合并为同一情感词。神名译作“耶和华”；脚注只说明必要的词义范围和原文形态，不替正文解决神学张力。
