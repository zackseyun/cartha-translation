  to: 耶和华与约瑟同在，约瑟成为一个亨通的人[a]；他在他那位埃及主人的家中。
  rationale: 修订以“亨通的人”对应 מַצְלִיחַ，避免“凡事”所加的绝对化范围；以“在……家中”直译并保留原文地点／状态，删去“住在”所增添的居住动作。保留神名“耶和华”、人名“约瑟”、主人身份及其埃及属性。
