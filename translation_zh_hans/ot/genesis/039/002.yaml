  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַ/יְהִ֕י בְּ/בֵ֥ית אֲדֹנָ֖י/ו הַ/מִּצְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: zh_hans
  text: 耶和华与约瑟同在，约瑟成为一个亨通的人[a]；他在他那位埃及主人的家中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个成功的人”。希伯来语分词可表示亨通或成功。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: אֶת יוֹסֵף
  choice: 与约瑟同在
  rationale: 准确传达希伯来语表示上帝临在与眷顾的惯用结构，并采用通行中文人名“约瑟”。
- source_word: אִישׁ מַצְלִיחַ
  choice: 一个凡事顺利的人
  rationale: מַצְלִיחַ表示行事亨通、取得成效；“凡事顺利”在叙事中自然，也避免把意思缩窄为财富上的富裕。
- source_word: בְּבֵית אֲדֹנָיו
  choice: 住在他的主人家里
  rationale: בְּבֵית直指在主人的房屋或家中；根据中文句法补出“住”，清楚表达约瑟所在之处。
- source_word: הַמִּצְרִי
  choice: 埃及主人
  rationale: 将族属形容词自然地置于“主人”之前，保留原文对主人身份的说明。
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: 同在……就成为……住在
  rationale: 保留三个分句的推进关系；第二分句用“就成为”体现叙事发展，第三分句按中文自然表达为“住在”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非称号；“耶和华”是现代中文圣经传统中最广为人知的专名形式，可保持专名功能。
- issue: 约瑟顺利与神同在的关系
  choice: 以“就”保留上下文所显出的关联
  alternative: 仅并列为“约瑟是一个顺利的人”
  rationale: 原文连续叙述“耶和华与约瑟同在”以及他成为 מַצְלִיחַ 的人；“就”自然传达叙事关联，但不额外界定因果机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡事顺利”比“成功”更能涵盖希伯来语在具体事务上亨通的含义，又不局限于经济富足；“主人”准确反映约瑟受辖制的处境。
