base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: zh_hans
  text: 于是，波提乏把自己所有的一切都交在约瑟手中；除了自己所吃的食物以外，他什么都不过问[a]。约瑟身材俊美，容貌英俊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“他同他什么也不知道”；这是按语境理解的希伯来语表达，意指波提乏不再过问交由约瑟管理的事务，惟自己的饮食除外。
    reason: 说明原文中较难逐字对应的惯用表达及正文的语境化译法。
lexical_decisions:
- source_word: וַיַּעֲזֹב כָּל אֲשֶׁר לוֹ בְּיַד יוֹסֵף
  choice: 把自己所有的一切都交在约瑟手中
  rationale: עָזַב本义为“留下”，在此管理语境中表示把产业留给约瑟掌管；“交在……手中”既保留希伯来文“手”的意象，也能自然表达托付管理之意。
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: 有约瑟在，他什么事都不过问
  rationale: 原文直译近似“同他在一起，他什么也不知道”，在上下文中表示波提乏因约瑟负责管理而不再过问事务。正文采用自然的现代汉语，脚注保留原文较直译的表达。
- source_word: כִּי אִם הַלֶּחֶם אֲשֶׁר הוּא אוֹכֵל
  choice: 只管自己所吃的食物
  rationale: כִּי אִם表示例外；לֶחֶם字面为“饼”，也常泛指食物。这里表达波提乏除了自己的饮食外，其他事务都不经管。
- source_word: יְפֵה תֹאַר וִיפֵה מַרְאֶה
  choice: 身材俊美，容貌英俊
  rationale: 分别呈现תֹאַר所指的形体、身材与מַרְאֶה所指的外貌，保留原文两个并列短语及其细微区别。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“交在约瑟手中”保留原文意象；“什么事都不过问”避免生硬直译，并以脚注交代原文形式；末句用“身材俊美，容貌英俊”保持希伯来文的平行结构。
