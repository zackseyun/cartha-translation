  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: zh_hans
  text: 然而，雅威与约瑟同在，向他施慈爱[a]，使他在监狱长[b]眼中蒙恩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”所译的希伯来词也可译作“坚定的爱”“忠诚的爱”或“恩慈”。
    reason: lexical_alternative
  - marker: b
    text: “监狱长”直译可作“监牢的主管”。
    reason: literal_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 的通行拟音译出其专名性质，不以“主”这一称号替代。
- source_word: וַיְהִי ... אֶת
  choice: 与……同在
  rationale: 这是表达陪伴、临在的希伯来语惯用结构；“与约瑟同在”自然且与约瑟叙事中的反复用语一致。
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: 以忠贞的慈爱待他
  rationale: נָטָה 在此与 חֶסֶד 构成惯用表达，意为向某人施予或显出慈爱；中文不机械保留“伸展”的字面意象，以自然表达传达整体意义。
- source_word: חָסֶד
  choice: 忠贞的慈爱
  rationale: 该词在此指坚定、忠诚而仁慈的眷顾。“忠贞的慈爱”保留其忠诚与慈爱两方面的语义，同时不把本节没有明说的正式圣约关系写入正文。
- source_word: חִנּוֹ בְּעֵינֵי
  choice: 使他在……眼中蒙恩
  rationale: 既保留“在……眼中”的源语意象，也用现代中文常见的“蒙恩”表达获得好感与优待。
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: 监狱长
  rationale: 该结构直指管理监牢的主管；“监狱长”比逐词译作“监狱的首领”更符合现代中文职衔习惯。
theological_decisions:
- issue: חָסֶד 所表达的神圣眷顾
  choice: 忠贞的慈爱
  alternative: 守约的信实／慈爱／恩慈
  rationale: “忠贞的慈爱”体现该词厚重的忠诚与仁爱内涵，却不把上下文未明确提及的“约”解释性地加入正文；其他可能译法列入脚注。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 正文保留神名的专名性质，并采用较贴近 YHWH 常见学术重构读音的现代汉语音译；不以称号取代专名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“然而”承接上文约瑟被囚的逆境并表达转折；句式简洁，适合普通读者朗读。
