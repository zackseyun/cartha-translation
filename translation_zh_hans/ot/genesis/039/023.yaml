  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: zh_hans
  text: 监狱长对约瑟手中所管的一切毫不过问[a]，因为雅威与约瑟同在；约瑟所做的一切，雅威都使其顺利[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“监狱长对交在约瑟手中的事，什么也不察看。”原文直译为“不看任何在他手中的事”；“在他手中”指由约瑟掌管。
    reason: lexical_alternative
  - marker: b
    text: 或译：“无论约瑟做什么，雅威都使之成功。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: 监狱长
  rationale: שַׂר 指主管、官长；结合 בֵּית הַסֹּהַר，译为“监狱长”简洁自然，并保留其管理职分。
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: 对……一切都不过问
  rationale: 字面为“不看任何事”，在本处表示监狱长不再察看或操心交托约瑟管理的事务；“不过问”符合现代汉语语境。
- source_word: בְּיָדוֹ
  choice: 手中所管的
  rationale: “在他手中”是指交由约瑟掌管；译文保留“手中”的具体意象，同时以“所管”说明其惯用含义。
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: 因为雅威与约瑟同在
  rationale: בַּאֲשֶׁר 在语境中表达原因。明说“约瑟”可避免连续代词在中文里指代含混。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的中文音译呈现四字神名，而不以称号替代。
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: 约瑟无论做什么
  rationale: 关系结构表示涵盖约瑟所做的一切；补出姓名使中文指代清楚。
- source_word: מַצְלִיחַ
  choice: 使他成功
  rationale: 该词为使役形，表示雅威使约瑟所做之事成功；此译法自然并保留使役意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并保留专名性质。
- issue: 成功的施事者
  choice: 雅威都使他成功
  alternative: 他所做的，雅威都使之顺利
  rationale: 保留 מַצְלִיחַ 的使役意义，明确成功来自雅威；同时不把“成功”扩展为超出本节工作语境的普遍应许。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“不过问”传达管理者无需察看、操心的语境；两次补出“约瑟”，消除原文连续阳性代词在中文翻译中可能造成的指代歧义。
