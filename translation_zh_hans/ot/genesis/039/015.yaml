    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: 他一听见
  rationale: וַיְהִי与כְּ加不定式在这里构成时间从句；“一听见”自然表达动作紧接发生，不必生硬译出“事情发生了”。
- source_word: כִּי
  choice: （不单独译出）
  rationale: כִּי引出他所听见的内容。现代汉语中“听见我……”已经自然表达这一关系，无须另加“就是”。
- source_word: הֲרִימֹתִי קוֹלִי וָאֶקְרָא
  choice: 我提高嗓门呼喊
  rationale: 保留“提高声音”和“呼喊”两个成分，同时采用自然的现代汉语表达；不擅自补入“求救”等原文未明说的内容。
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: 把衣裳留在
  rationale: “衣裳”对应单数בֶּגֶד；“留在”准确表达עָזַב在本场景中留下衣物的意思，而不额外强调故意遗弃。
- source_word: אֶצְלִי
  choice: 我身边
  rationale: 表达אֵצֶל的空间邻近含义，同时以脚注保留“在我这里／由我拿着”的可能理解。
- source_word: וַיָּנָס וַיֵּצֵא הַחוּצָה
  choice: 逃到外面去了
  rationale: 用自然的汉语合并表达“逃跑”与“出去到外面”两个连续动作，保留其方向和急迫性。
theological_decisions: []
