  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: zh_hans
  text: 当她看见他把衣服[a]留在她手里，逃到外面去的时候，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衣服”也可译作“衣裳”；希伯来语在这里是泛称，并未具体说明是“外袍”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 一……
  rationale: 这里的叙事连接语与后面的时间结构相连；现代汉语用“一……（就……）”自然引出随即发生的情节，并保持叙事推进。
- source_word: כִּרְאוֹתָהּ
  choice: 她一看见
  rationale: כְּ加不定式附属形及第三人称阴性单数后缀构成时间从句；“她一看见”既准确表达“当她看见时”，也自然衔接下一节的主句。
- source_word: כִּי
  choice: （看见）他……
  rationale: כִּי在此引出“看见”的内容。汉语可直接把该内容接在“看见”之后，无须另译“ that ”一类连接词。
- source_word: עָזַב
  choice: 留在
  rationale: 该动词在本语境中指留下某物；与地点短语“在她手里”合译为“留在她手里”自然且准确。
- source_word: בִּגְדוֹ
  choice: 他的衣裳
  rationale: בֶּגֶד泛指衣物，并未限定为外袍。“衣裳”保持其概括性；汉语句中“他把衣裳”已自然表明衣物属于他，不必重复所有格。
- source_word: בְּיָדָהּ
  choice: 在她手里
  rationale: 直译保留原文具体而鲜明的形象，也符合现代汉语习惯。
- source_word: וַיָּנָס
  choice: 逃……去了
  rationale: נוּס表示逃离。“逃……去了”传达动作的急迫性和已经完成的结果，并与前面的“留在”共同构成她所看见的情形。
- source_word: הַחוּצָה
  choice: 到外面
  rationale: 该词带方向性词尾，表示向外移动；“到外面”明确保留这一方向含义。
