revisions:
- from: 约瑟被带下埃及。法老的臣仆、护卫长、埃及人波提乏，从把约瑟带到那里的以实玛利人手中买下了他。[a]
  to: 约瑟被带到埃及后，埃及人波提乏——法老的一名官员[a]、护卫长——从把约瑟带到那里的以实玛利人手中买下了他。
  rationale: 改用“法老的一名官员”对应סָרִיס，保留其在上下文中最稳妥的宫廷职衔含义，并以紧邻锚点的脚注保存“阉人”这一真实词义可能。“带到埃及”是现代汉语中对该被动使役动作的自然表达，避免“下埃及”的区域歧义。重组同位语后仍完整保留波提乏的身份与购买来源。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:22:00Z'
