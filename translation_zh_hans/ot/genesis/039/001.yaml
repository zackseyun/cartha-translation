  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: zh_hans
  text: 约瑟被带到埃及后，埃及人波提乏——法老的一名官员[a]、护卫长——从把约瑟带到那里的以实玛利人手中买下了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“官员”的希伯来词也可指“阉人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: 被带下
  rationale: 这是ירד的使役被动式，表示约瑟被人带往地势与叙事方位上的“下方”；“带下”也与本节末尾同根动词的重复相呼应。
- source_word: מִצְרָיְמָה
  choice: 下埃及
  rationale: 方向词尾表示朝埃及而去；现代汉语中“下埃及”既自然，也保留希伯来文的方向表达。
- source_word: וַיִּקְנֵהוּ
  choice: 买下了他
  rationale: 在奴隶交易语境中，קנה明确表示购买；“买下”保留交易意味，并符合现代汉语。
- source_word: סְרִיס פַּרְעֹה
  choice: 法老的臣仆
  rationale: סְרִיס既可指宫廷官员，也可指阉人；正文采用不限定生理状态、且适合宫廷身份的“臣仆”，另以脚注保留词义歧义。
- source_word: שַׂר הַטַּבָּחִים
  choice: 护卫长
  rationale: 该称号可能涉及王室护卫或行刑人员的统领；“护卫长”是清楚、庄重且不过度限定具体职责的传统表达。
- source_word: אִישׁ מִצְרִי
  choice: 埃及人
  rationale: אִישׁ与族属词合用，在中文中自然译为“埃及人”；不机械添加“男子”，以免同位语累赘。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来文“从……手中”的惯用表达；在买卖语境中，现代汉语同样自然。
- source_word: הַיִּשְׁמְעֵאלִים
  choice: 以实玛利人
  rationale: 直接保留族名，不在正文增添原文没有明说的“商人”。
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: 把约瑟带到那里的人
  rationale: 关系从句指向以实玛利人；“那里”回指埃及。中文为避免同句两次生硬使用“带下”，此处自然译作“带到那里”，动作和目的地仍然清楚。
theological_decisions:
- issue: סְרִיס在波提乏身份称谓中的含义
  choice: 正文译为“法老的臣仆”
  alternative: “法老的阉人”或“法老的宫廷官员”
  rationale: 该词既可表示阉人，也可泛指王室官员。叙事没有明确要求生理意义，因此正文采用较宽泛的宫廷身份称谓，同时用脚注保存真实的词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将姓名“波提乏”置于一连串身份说明之后，使中文句法顺畅；保留“下埃及”的空间意象和“从……手中”的原文习语。脚注标记置于涉及歧义的“臣仆”之后。
