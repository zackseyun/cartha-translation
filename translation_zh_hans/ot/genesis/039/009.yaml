source:
  edition: WLC
  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: zh_hans
  text: 在这家里，没有人比我地位更高[a]；他没有向我保留任何东西，只有你，因为你是他的妻子。我怎能做这大恶[b]，得罪上帝呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这家里，没有人比我大。”希伯来文直译为否定这家里有任何比约瑟“更大”的人；“大”在此可指地位、尊荣或权柄。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这大恶事”或“这极大的不义”。希伯来文רָעָה可指恶、恶事、不义或坏事。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: 没有谁比我更有权柄
  rationale: אֵין与形容词构成的表达在此最自然地理解为不存在一个比约瑟“更大”的人；结合管家职权的语境，以“更有权柄”表达地位和权限，同时在脚注保留较贴近字面的译法。
- source_word: בַּבַּיִת הַזֶּה
  choice: 在这家里
  rationale: בַּיִת既可指房屋，也可指家庭或家业；“这家里”保留原文意象，并能涵盖波提乏的整个家务管理范围。
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: 没有留下一样不给我
  rationale: חָשַׂךְ表示扣留、留下不给；此译法准确传达否定结构，也符合现代汉语表达。
- source_word: כִּי אִם אוֹתָךְ
  choice: 除了你
  rationale: כִּי אִם在否定句后引出唯一的例外；“除了你”简洁明确。
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: 因为你是他的妻子
  rationale: 该结构在这里说明为何她是例外；“因为”自然传达其因果关系。
- source_word: וְאֵיךְ אֶעֱשֶׂה
  choice: 我怎能做
  rationale: וְאֵיךְ引出基于前文的反问和道德结论；汉语反问已自然体现承接和推论，不必机械译出连接词。
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: 这大恶
  rationale: רָעָה可指恶、恶事或不义；“这大恶”保留原文的强烈道德评价、程度和指示结构。
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: 得罪上帝
  rationale: חטא与ל连用在此表示向上帝犯罪、冒犯上帝；“得罪上帝”是自然且庄重的现代汉语圣经用语。
theological_decisions:
- issue: 约瑟话语中אֱלֹהִים的所指
  choice: 上帝
  alternative: 一位神／神明
  rationale: 创世记叙事中的约瑟所指是他所敬拜的上帝，且这里将此事定性为对上帝的犯罪，而不只是对主人的亏负；因此采用专指称谓“上帝”。
- issue: 约瑟拒绝的道德依据
  choice: 同时保留对主人婚姻关系的侵犯与对上帝的犯罪
  alternative: 仅表述为对主人的不忠或社会伦理上的错误
  rationale: 原文先指出“你是他的妻子”，继而称此举为“大恶”并说会“得罪上帝”；译文不削弱这两层彼此关联的理由。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“更有权柄”清楚表达家中管理地位；“留下一样不给我”保留原文“扣留”的措辞；“大恶”和“得罪上帝”维持约瑟话语的强烈道德分量。脚注标记均置于所说明的正文词语之后。
