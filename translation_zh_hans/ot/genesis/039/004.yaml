base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: zh_hans
  text: 约瑟在他眼中蒙恩，服侍他。他便派约瑟管理自己的家[b]，把自己所有的一切都交在约瑟手中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“放在他手中”，意思是交由约瑟掌管或照料。
    reason: cultural_note
  - marker: b
    text: 这里的“家”也可指整个家业或家庭事务。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא יוֹסֵף חֵן בְּעֵינָיו
  choice: 约瑟在他眼中蒙恩
  rationale: 保留希伯来语“在某人眼中蒙恩”的惯用表达及其形象；现代汉语读者也能理解为得到对方的喜爱与认可。
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: 服侍他
  rationale: שרת在这里指约瑟为主人提供近身或职务上的服务；“服侍”简洁、庄重，并不过度限定具体职责。
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: 他便派约瑟管理自己的家
  rationale: פקד在此为使役性的任命、委派管理。明说“约瑟”并用“自己的家”，可化解汉语连续代词造成的指代混乱，同时不增添原文之外的人物。
- source_word: בֵּיתוֹ
  choice: 自己的家
  rationale: 保留“家”的基本意象；此词在上下文中可包括家宅、家产、仆役及整个家庭事务，故以脚注说明其范围。
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: 自己所有的一切
  rationale: 概括主人拥有的全部财物与事务，保持原文表述的全面性。
- source_word: נָתַן בְּיָדוֹ
  choice: 交在约瑟手中
  rationale: 保留原文“交在手中”的形象，也自然表达托付管理权。点明“约瑟”可避免末尾代词误指主人。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。主体在希伯来语语境中明确，但若逐字使用多个“他”，现代汉语会产生不必要的指代歧义，因此在受事位置重提“约瑟”，并以“自己的”标明主人的家与所有物；同时借脚注保留“手”和“家”的希伯来语意象及语义范围。
