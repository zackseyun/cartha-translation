  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: zh_hans
  text: 有一天[a]，他进屋去做自己的工作[b]；家中的男人没有一个在那里，在屋里。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“到了像这样的日子”或“在这一天”；这是指某一次具体场合的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“办理自己的事务。”
    reason: lexical_alternative
  - marker: c
    text: 原文重复地点，较直译为：“没有一个家中的男人在那里，在屋里。”
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי
  choice: 有一天
  rationale: 本词是希伯来叙事中推进事件的常用句式；与后面的时间表达合并译出，可避免生硬重复，同时保持叙事自然。
- source_word: כְּהַיּוֹם הַזֶּה
  choice: 有一天
  rationale: 字面近于“像这一天／在这一天”，在本语境中是指某一次具体场合。现代汉语用“有一天”最自然；脚注保留较直译形式及其语义余地。
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: 他进屋
  rationale: בוא 加方向词尾明确表示进入屋内；“进屋”简洁准确，也符合中文叙事习惯。
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: 办自己的事
  rationale: מְלָאכָה 可指工作、任务或事务。“办自己的事”保留所指事务未被具体说明这一点；脚注列出较明确的常见译法。
- source_word: מֵאַנְשֵׁי הַבַּיִת
  choice: 家中的男人
  rationale: 原文明确使用阳性复数“男人”，而非泛指全体家人或仆役，因此不将性别信息泛化。
- source_word: שָׁם בַּבָּיִת
  choice: 在那里，都不在屋里
  rationale: 原文同时出现“在那里”和“在屋里”，带有重复性的地点强调。中文以补述形式保留两层表达，虽略显复沓，却传达原文强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“办自己的事”保留 מְלָאכָה 在“工作／事务”之间的宽度；“家中的男人”保留原文的性别限定；末句用中文可理解的补述保留希伯来文地点表达的重复强调。
