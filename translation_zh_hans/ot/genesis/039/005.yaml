  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: zh_hans
  text: 自从他委派约瑟管理自己的家和一切财物以来，雅威因约瑟的缘故赐福那埃及人的家；雅威的赐福临到他所有的一切，无论在家里还是在田间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאָז
  choice: 从……那时起
  rationale: 表示某一时间点成为后续持续状态的起点；这一表达在现代汉语中自然地保留了“自从”的时间关系。
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ
  choice: 委派约瑟管理自己的家和一切所有的
  rationale: 使役形态在此表示指派监管职责；“委派……管理”既传达正式授权，也清楚表达其管辖范围。原文代词在汉语中可能指代不清，因此明说“约瑟”。
- source_word: וַיְבָרֶךְ
  choice: 赐福
  rationale: 保留 ברך 的基本神学用语，不仅将其结果释为物质上的兴旺。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，不以称号代替。
- source_word: בֵּית הַמִּצְרִי
  choice: 这个埃及人的家
  rationale: 指上文的埃及主人及其家业；加“这个”自然承接已知人物，而“家”保留原文兼有家庭、家业范围的表达。
- source_word: בִּגְלַל יוֹסֵף
  choice: 因约瑟的缘故
  rationale: 直接表达 בגלל 所标示的原因，保留约瑟是这赐福临到其主人的缘由。
- source_word: בִּרְכַּת יְהוָה
  choice: 雅威的赐福
  rationale: 按原文名词结构翻译，并明确赐福的来源。
- source_word: בְּכָל אֲשֶׁר יֶשׁ־לוֹ
  choice: 临到他一切所有的
  rationale: 介词表示赐福所及的范围；补出“临到”使汉语通顺，同时保留“他一切所有的”与前半节的呼应。
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: 无论家里还是田间
  rationale: 将两个具体领域自然表达为涵盖全部家内与田间产业的并举，而不消解原文意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”较直接反映学界通常重构的读音，同时保留其专名性质，不替换为“主”。
- issue: ברך 是否解释为“使兴旺”
  choice: 赐福
  alternative: 使……兴旺
  rationale: 上下文虽包含家业兴盛的结果，原文却明确使用“赐福”，故不把神学含义缩减为经济效果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“委派……管理”体现约瑟所得的正式管家职权；分号呈现原文从雅威赐福其家到赐福遍及全部产业的递进。所有脚注标记均已置于正文对应位置。
