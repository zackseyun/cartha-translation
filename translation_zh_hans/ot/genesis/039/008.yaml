  text: וַ/יְמָאֵ֓ן וַ/יֹּ֨אמֶר֙ אֶל אֵ֣שֶׁת אֲדֹנָ֔י/ו הֵ֣ן אֲדֹנִ֔/י לֹא יָדַ֥ע אִתִּ֖/י מַה בַּ/בָּ֑יִת וְ/כֹ֥ל אֲשֶׁר יֶשׁ ל֖/וֹ נָתַ֥ן בְּ/יָדִֽ/י׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: zh_hans
  text: 但约瑟不肯，对主人的妻子说：“你看，家里有什么事，我的主人都不过问；他所有的一切，都交在我手里了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: 但约瑟不肯
  rationale: 该动词表示拒绝；结合上一节妻子的要求，用“但”体现转折，并补出汉语中自然且明确的主语“约瑟”。
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: 对主人的妻子说
  rationale: 自然表达领属关系，并准确保留约瑟与波提乏的主仆关系。
- source_word: הֵן
  choice: 你看
  rationale: 该话语标记用于提醒听者注意下文；“你看”符合现代汉语口语而不失庄重。
- source_word: אֲדֹנִי
  choice: 我的主人
  rationale: 此处指约瑟在家中的主人，译作“主人”比“主”更能避免神学含义上的误解。
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: 家里有什么事，我的主人都不过问
  rationale: 希伯来语直译近于“与我同在时，不知道家里有什么”，在本语境中表示主人把家务交由约瑟管理，自己不再过问；此译保留语义而符合现代汉语习惯。
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: 他所有的一切
  rationale: 表达主人全部所有物和事务的总体范围。
- source_word: נָתַן בְּיָדִי
  choice: 都交在我手里了
  rationale: 保留“交在手里”的具体意象，同时自然传达托付管理权的含义。
theological_decisions: []
