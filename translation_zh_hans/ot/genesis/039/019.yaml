base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your slave did to me,” his anger burned.
translation:
  language: zh_hans
  text: 他的主人听见他妻子对他说的话，说：“你的奴隶[b]这样[a]对待我。”他便怒火中烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这样”原文也可较直译为“像这些事”或“照这些话所说的”。这句话可以概括她所指控的行为，也可以指其所述的方式。
    reason: lexical_alternative
  - marker: b
    text: “奴隶”也可译作“仆人”；这里的希伯来词可以表达两种意思，但约瑟在这个家庭场景中受奴役的身份明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: 听见……便……
  rationale: 希伯来语以叙事连接形式配合时间性不定式，引出紧接发生的事件。现代汉语无需机械译出“事情发生了”，用“听见……便……”自然表达时间与叙事推进。
- source_word: אֲדֹנָיו
  choice: 他的主人
  rationale: 此处指拥有并管理约瑟的波提乏；“主人”既符合家庭场景，也体现约瑟受奴役的身份。
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: 妻子对他说的话
  rationale: 保留“话”及“对他说”的关系，不把它泛化为“指控”，从而避免预先判定话语真伪。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: 就是这样
  rationale: 该短语可指“像这些事”“照这些话所说的那样”，汉语“就是这样”自然地保留其对前述指控内容或方式的指示作用；脚注说明其字面可能性。
- source_word: עָשָׂה לִי
  choice: 对我的
  rationale: 在“就是这样对我的”中，“做”的含义由汉语惯用表达承载，同时保留 לִי 的“对我”关系，不强化为“害我”或“侵犯我”。
- source_word: עַבְדֶּךָ
  choice: 你的奴隶
  rationale: עבד 可指仆人或奴隶；约瑟在波提乏家中是被买来的受奴役者，因此正文采用“奴隶”，并在脚注保留“仆人”这一词义可能。
- source_word: וַיִּחַר אַפּוֹ
  choice: 他的怒火便燃烧起来
  rationale: 保留希伯来语“怒气燃烧”的形象，同时以现代汉语可懂的表达呈现，而不简化为“他生气了”。
theological_decisions:
- issue: 怒气的原因与指向
  choice: 只陈述主人听后怒火燃烧，不说明他是否相信妻子，也不说明他具体向谁发怒
  alternative: 译成“他信了妻子的话，便向约瑟大发烈怒”
  rationale: 原文仅叙述听见话后怒气燃烧，未明说相信与否，也未明说怒气对象；不应把叙事留白解释进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他的怒火便燃烧起来”保留原文意象；引语用自然汉语表达，但借脚注保存 כַּדְּבָרִים הָאֵלֶּה 的真实语义幅度。所有脚注标记均置于对应正文词语之后。
