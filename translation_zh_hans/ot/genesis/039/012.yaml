  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: zh_hans
  text: 她抓住他的衣服[a]，说：“跟我睡觉吧！[b]”他把衣服留在她手里，逃到外面去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衣服”也可译作“外衣”或“袍子”；希伯来语此词泛指衣物。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“跟我躺下吧”，在这里是性邀约。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: 她抓住他
  rationale: תפשׂ表示牢牢抓住；“抓住”自然、鲜明，符合此处突发的肢体动作。
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: 他的衣服 / 衣服
  rationale: בגד泛指衣物，不宜过度限定为外袍或长袍；首处介词בְ表示她抓住的是他的衣服。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出直接引语；现代汉语用“说”比直译为“说道”更自然简洁。
- source_word: שִׁכְבָה עִמִּי
  choice: 跟我睡觉吧
  rationale: שׁכב与עִם连用在此构成性邀约。“跟我睡觉”是现代汉语中自然明确的对应表达，同时脚注保留其字面意象。
- source_word: וַיַּעֲזֹב
  choice: 他却把……留在
  rationale: עזב在此指将衣服留在对方手里；“却”自然表现情节转折，并未增添实质内容。
- source_word: בְּיָדָהּ
  choice: 在她手里
  rationale: 忠实保留יד“手”的具体意象，也自然表达衣服仍被她抓着。
- source_word: וַיָּנָס
  choice: 逃
  rationale: נוס表示急切逃离；“逃”简洁地保留动作力度。
- source_word: וַיֵּצֵא הַחוּצָה
  choice: 到外面去了
  rationale: יצא加החוצה表示从室内出去；与前面的“逃”连用，译作“逃到外面去了”符合现代汉语叙事习惯。
