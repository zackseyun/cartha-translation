id: GEN.39.3
reference: Genesis 39:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֣רְא אֲדֹנָ֔י/ו כִּ֥י יְהוָ֖ה אִתּ֑/וֹ וְ/כֹל֙ אֲשֶׁר ה֣וּא עֹשֶׂ֔ה יְהוָ֖ה מַצְלִ֥יחַ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: zh_hans
  text: 他的主人看出雅威与他同在，也看出雅威使他手中所做的一切都顺利[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“经他的手”，或“在他管理之下”；希伯来文直译为“在他手中”。
    reason: 说明 בְּיָדוֹ 可表达工具、经手或管理范围；正文以“他手中所做的”保留“手”的意象，未在正文中限定其具体语义。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看出
  rationale: 这里不仅指视觉上的“看见”，也指主人从约瑟工作的结果察觉到事实；“看出”既自然，又没有增添原文未明说的推断过程。
- source_word: אֲדֹנָיו
  choice: 他的主人
  rationale: 在约瑟身为家仆的语境中，指波提乏作为他的主人；现代汉语用“主人”比“主”更清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名处理四字神名，以现代汉语音译“雅威”表达，不以“主”这一称号代替，也不采用通常对应 Jehovah 的“耶和华”。
- source_word: אִתּוֹ
  choice: 与他同在
  rationale: 准确表达神与约瑟同在；保留原文代词衔接。
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: 凡他所做的
  rationale: 表达原文涵盖约瑟一切工作的总括意义，同时保持自然、简洁的叙事语体。
- source_word: מַצְלִיחַ
  choice: 使之……顺利成就
  rationale: 使役形式明确以雅威为使事情成功的主体；“顺利成就”在现代汉语中自然，并保留“使……成功、亨通”的含义。
- source_word: בְּיָדוֹ
  choice: 在他手中
  rationale: 保留希伯来文具体的“手”这一意象，不在正文中排他性地判定为工具、经手或管理范围。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名。译作“雅威”保留其专名性质，避免用称号“主”替换，也避免采用源于 Jehovah 形式的传统音译。
- issue: בְּיָדוֹ 所表达的关系
  choice: 正文保留“在他手中”，并用脚注说明
  alternative: 经他的手；由他办理；在他管理之下
  rationale: 该短语可表示工作经约瑟之手而成，也可侧重他所掌管的范围。保留原文意象，可以避免在正文中消除这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“看出”符合上下文中的察觉含义；“顺利成就”避免单用较古雅的“亨通”，同时保留神使约瑟所做之事成功的因果关系。脚注标记紧接“在他手中”，使注释对象明确。
