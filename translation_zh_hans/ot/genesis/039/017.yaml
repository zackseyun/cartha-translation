  text: Then she spoke to him with words like these[a], saying, “The Hebrew slave whom you brought to us came to me to mock me.”
translation:
  language: zh_hans
  text: 她就对他这样说：“你带给我们的那个希伯来奴隶，到我这里来戏弄我[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拿我取乐”；这里也可能含有性方面的侮辱或侵犯的意味。
    reason: 保留צחק在本语境中的词义张力，避免正文或脚注过度明确其具体行为。
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו כַּדְּבָרִים הָאֵלֶּה לֵאמֹר
  choice: 她就对他这样说
  rationale: 以自然的现代汉语表达叙事推进、间接宾语和引出直接引语的固定结构，同时保留“他”这一代词，不以人物姓名代替。
- source_word: בָּא אֵלַי
  choice: 到我这里来
  rationale: 忠实表达向说话者而来的动作，不擅自把该短语处理成性行为的委婉语；相关指控的含义由后面的目的短语体现。
- source_word: הָעֶבֶד הָעִבְרִי
  choice: 那个希伯来奴隶
  rationale: “奴隶”准确反映约瑟在该家庭中的受辖制身份；“希伯来”保留原文的族群称谓。
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: 你带给我们的
  rationale: 保留妻子针对丈夫的责怪口吻以及第一人称复数“我们”，不将其缩减为“我”。
- source_word: לְצַחֶק בִּי
  choice: 来戏弄我
  rationale: “戏弄”既可表达拿人取乐、侮弄，也能在此语境中容纳性侵犯或凌辱的暗示，而不把原文含义限定得过窄。
