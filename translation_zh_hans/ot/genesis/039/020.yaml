base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: zh_hans
  text: 于是，约瑟的主人带走他，把他关进监牢[a]，就是王的囚犯被囚禁的地方[b]。他就在那里，在监牢里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“琐辖之屋”；“琐辖”可能是一个源自埃及语、指监牢或拘留处的词。
    reason: cultural_note
  - marker: b
    text: 希伯来文在这里重复使用“捆绑／囚禁”这一词根，字面意思是“王的被囚者被囚禁的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: 约瑟的主人
  rationale: 此处אָדוֹן指约瑟在人间的主人，而非神圣称号；“主人”符合叙事中的家奴背景，也自然易懂。
- source_word: וַיִּקַּח
  choice: 拿住
  rationale: לָקַח基本义为“拿、带走”；在主人将约瑟押去监禁的语境中，“拿住”既体现对人的控制，也不强化为原文未明确表达的“抓捕”。
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: 把他关进
  rationale: 该结构在此表示把约瑟置于某处；结合监牢语境译作“关进”，比机械的“放进”自然，同时准确表达监禁结果。
- source_word: בֵּית הַסֹּהַר
  choice: 监牢
  rationale: 该短语字面为“琐辖之屋”，其中סֹהַר可能是埃及语借词；上下文清楚指拘禁犯人的处所。“监牢”庄重、通俗，并适合古代叙事。
- source_word: מְקוֹם אֲשֶׁר
  choice: 就是……的地方
  rationale: 保留原文对监牢所作的同位解释，而不将其省略或压缩。
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: 王的囚犯被囚禁
  rationale: 原文连续使用同一词根אָסַר，先指“被捆绑者／囚犯”，再说他们“被囚禁”。正文保留这一有意重复，脚注说明其字面特点。
- source_word: וַיְהִי שָׁם בְּבֵית הַסֹּהַר
  choice: 约瑟就在那里，关在监牢里
  rationale: 明确补出汉语所需的主语“约瑟”，并保留原文再次提到监牢的重复；“就在那里”不额外加入“长期留住”等时长含义。
