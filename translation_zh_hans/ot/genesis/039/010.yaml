  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: zh_hans
  text: 她天天对约瑟说，约瑟却不听她，不肯躺在她身边[a]，也不肯和她在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与她同寝。”原文在这里可以含有性关系的意思；译作“躺在她身边”，既保留原文的空间措辞，也使下句“和她在一起”保持自身的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבְּרָהּ
  choice: 她……对……说
  rationale: וַיְהִי与כ־结构共同交代持续发生的背景；现代汉语无需逐字译出“事情发生了”，由整句的时间背景自然体现叙事推进。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经与汉语读者熟悉的希伯来人名标准译法。
- source_word: יוֹם יוֹם
  choice: 天天
  rationale: 名词重叠表示反复持续；“天天”自然、准确地传达她日复一日施压的意味。
- source_word: וְלֹא שָׁמַע אֵלֶיהָ
  choice: 约瑟却不听她
  rationale: שׁמע אֶל表示听从、理会；“不听她”保留其较宽的语义，而“却”清楚呈现他的拒绝。
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: 不肯躺在她身边
  rationale: שׁכב可指躺卧，在语境中也可含性关系之意；אצל强调在旁边。“躺在她身边”保留空间措辞及性含义的可能性。
- source_word: לִהְיוֹת עִמָּהּ
  choice: 也不肯和她在一起
  rationale: היה עם直译为“与……在一起”，其范围可超出性行为本身，指拒绝与她处于亲近或有风险的相处状态。
theological_decisions:
- issue: 约瑟所拒绝之事的范围
  choice: 分别保留“不肯躺在她身边”和“也不肯和她在一起”两个短语
  alternative: 合并译为“不肯与她同寝”
  rationale: 原文以两个不定式短语并列；分别翻译可保留性诱惑与避免亲近相处之间的张力，不把后一句完全吸收到性行为之中。
translation_notes:
  register: 采用现代、自然而庄重的叙事汉语。“天天”体现反复持续，“不肯……也不肯……”使两个拒绝对象在中文中关系清楚；不使用古雅的“于是”“事有发生”等生硬表达。
