  text: וַ/יִּתֵּ֞ן שַׂ֤ר בֵּית הַ/סֹּ֨הַר֙ בְּ/יַד יוֹסֵ֔ף אֵ֚ת כָּל הָ֣/אֲסִירִ֔ם אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/סֹּ֑הַר וְ/אֵ֨ת כָּל אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם ה֖וּא הָיָ֥ה עֹשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: zh_hans
  text: 监狱长把狱中所有囚犯都交给约瑟管理[a]；凡在那里所做的事，都是由他经办的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“交在约瑟手中”，意思是把这些囚犯交给他管辖。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“凡他们在那里所做的，都是约瑟在做”。原文强调约瑟持续经办并负责监狱里的事务。
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: 监狱长
  rationale: שַׂר 指主管或长官；在监狱语境中，“监狱长”准确、自然，也比直译“监狱之家的长官”更符合现代汉语。
- source_word: בְּיַד יוֹסֵף
  choice: 交在约瑟手下
  rationale: 希伯来语“交在某人手中”表示托付其管理或置于其权下；“交在约瑟手下”既保留“手”的意象，也清楚表达管理关系。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经读者熟悉且稳定的人名形式；对应希伯来名 יוֹסֵף。
- source_word: כָּל הָאֲסִירִם
  choice: 所有的囚犯
  rationale: אֲסִירִים 在此明确指被关押的人，“囚犯”是现代汉语中最清楚自然的表达。
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: 凡那里所办的事
  rationale: עֹשִׂים 是未明说主语的复数主动分词；用汉语无施事表达“所办的事”，避免擅自指定是谁在做，同时涵盖监狱中的各项事务。
- source_word: הוּא הָיָה עֹשֶׂה
  choice: 都是约瑟在办理
  rationale: הוּא 带强调作用，הָיָה 加分词表达持续或惯常的行动；“都是约瑟在办理”兼顾强调与持续负责的含义。
theological_decisions: []
