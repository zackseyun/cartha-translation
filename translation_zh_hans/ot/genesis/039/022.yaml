  rationale: 修正“手下”在现代汉语中可能引起的角色关系误解，并润饰后半句，使其更自然地表达希伯来语强调约瑟持续负责、经办监狱事务的意思。脚注保留“手中”的字面意象及后半句可按较直接方式理解的余地。
