  yaml_path: translation/ot/genesis/039/007.yaml
  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
translation:
  language: zh_hans
  text: 这些事以后，他主人的妻子把目光投向约瑟[a]，对他说：“跟我同寝吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“向约瑟举目”；在这里，这一说法表达她把带有欲念的注意力集中在约瑟身上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: 这些事以后
  rationale: 保留希伯来语叙事中承接前文、引出后续发展的表达，同时符合现代汉语语序。
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: 把目光投向
  rationale: 原文直译为“举目向着”，在此表示有意而专注地注视；“把目光投向”既保留形象，也不在正文中过度明说她的欲念。
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: 他主人的妻子
  rationale: 自然呈现原文的所属关系，其中“他”指约瑟。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
- source_word: שִׁכְבָה עִמִּי
  choice: 跟我同寝吧
  rationale: 这是直接的性邀约；“同寝”保留“躺卧”的基本意象和语境中的性含义，语体庄重而清楚。
