  text: וַ/תִּקְרָ֞א לְ/אַנְשֵׁ֣י בֵיתָ֗/הּ וַ/תֹּ֤אמֶר לָ/הֶם֙ לֵ/אמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛/נוּ אִ֥ישׁ עִבְרִ֖י לְ/צַ֣חֶק בָּ֑/נוּ בָּ֤א אֵלַ/י֙ לִ/שְׁכַּ֣ב עִמִּ֔/י וָ/אֶקְרָ֖א בְּ/ק֥וֹל גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: zh_hans
  text: 她就把家中的男人们叫来，对他们说：“你们看，他给我们带来了一个希伯来男人[a]，要戏弄我们[b]。那人到我这里来，要与我同寝，我就大声喊叫。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“他把一个希伯来男人带进我们这里来”。
    reason: 保留הביא（“使进来、带来”）在此可能带有“带进来”的空间意味。
  - marker: b
    text: “戏弄”也可译为“嘲弄”或“拿我们取乐”。这里的希伯来语可指嘲弄或带侮辱性的戏耍；在本段指控中也含有性羞辱的意味。
    reason: 说明צחק的语义范围，避免把原文只限定为普通的玩笑或单纯的嘲笑。
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: 她就把家中的男人们叫来
  rationale: “就”自然承接叙事；אַנְשֵׁי明确为男性复数，“家中的男人们”既保留性别信息，也不擅自限定为男仆。
- source_word: וַתֹּאמֶר לָהֶם לֵאמֹר
  choice: 对他们说
  rationale: 希伯来语引语公式中的“说……说”在现代汉语中不必重复，直接引出话语即可。
- source_word: רְאוּ
  choice: 你们看
  rationale: 保留复数命令语气，并符合现代汉语中招呼众人注意的自然表达。
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: 他给我们带来了一个希伯来男人
  rationale: 保留使役动词“带来”、לָנוּ的共同体指向“给我们”，以及אִישׁ的男性信息和עִבְרִי的族群称谓。
- source_word: לְצַחֶק בָּנוּ
  choice: 要戏弄我们
  rationale: צחק在此可指嘲弄、拿人取乐或带侮辱性的戏耍；“戏弄”保留其宽泛性，也容纳上下文中的性羞辱意味，而不把含义缩窄为单纯嘲笑。
- source_word: בָּא אֵלַי לִשְׁכַּב עִמִּי
  choice: 那人到我这里来，要与我同寝
  rationale: “到我这里来”保留בוא אל的方向；“与我同寝”对应希伯来语表示性关系的惯用语，庄重而清楚。
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: 我就大声喊叫
  rationale: 以自然汉语表达“大声呼喊”，并用“就”呈现她所叙述的紧接反应，不额外加入原文没有明说的转折。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“希伯来男人”保留原文对族群与性别的双重强调；“同寝”略具书面色彩，但在此比口语化的“睡觉”更庄重，并能清楚传达性含义。脚注按正文中的实际落点重新编排，使每个标记与所说明的词语对应。
