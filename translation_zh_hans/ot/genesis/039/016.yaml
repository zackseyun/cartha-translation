  yaml_path: translation/ot/genesis/039/016.yaml
  text: So she kept his garment beside her until his master came home.
translation:
  language: zh_hans
  text: 于是，她把约瑟的衣裳放在身边，直到他的主人回家。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: 放在
  rationale: 该动词在此表示让衣裳留在某处；“放在”自然准确，并与后面的地点短语衔接。
- source_word: בִּגְדוֹ
  choice: 约瑟的衣裳
  rationale: 原文直译为“他的衣裳”，但本节连续出现两个男性指称；补明“约瑟”可避免现代汉语中的代词歧义，不改变所指。
- source_word: אֶצְלָהּ
  choice: 在身边
  rationale: 保留“在她那里／她身旁”的空间意味，也自然表达她把衣裳留作物证的叙事动作。
- source_word: עַד בּוֹא אֲדֹנָיו אֶל־בֵּיתוֹ
  choice: 直到他的主人回家
  rationale: “回家”自然传达主人来到自己家中的意思；“他的主人”仍以约瑟为所指。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“于是”承接前文；为避免两个“他的”造成指称混乱，将第一个所有格显明为“约瑟的”，其余保持原文关系。
