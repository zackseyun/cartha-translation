  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: zh_hans
  text: 当我扬声呼喊时，他把衣服[a]留在我身边，逃到外面去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外衣”。希伯来语 בֶּגֶד 泛指衣物，并未说明具体是哪一种衣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: 我一扬声
  rationale: וַיְהִי在这里引出随后的时间情形；כַהֲרִימִי由介词כ与רום的使役式构成，表示“当我扬起……时”。汉语“一……就……”自然体现紧接发生的叙事关系，“扬声”也准确传达“提高声音”的惯用含义。
- source_word: קוֹלִי וָאֶקְרָא
  choice: 呼喊
  rationale: קוֹלִי意为“我的声音”，已融入汉语惯用表达“扬声”；קרא在此表示出声呼叫。“呼喊”保留情境中的急切感，却不把音量或喊话内容说得过于具体。
- source_word: וַיַּעֲזֹב
  choice: 留在
  rationale: עזב在此指把衣物留下。译作“留在”既符合上下文，也避免“丢下”可能暗示的具体动作方式。
- source_word: בִּגְדוֹ
  choice: 衣服
  rationale: בגד是衣物的通称，原文没有明确指出具体是哪一种衣物；“衣服”是自然、宽泛的现代汉语对应词。
- source_word: אֶצְלִי
  choice: 在我身边
  rationale: אצל表示靠近或在旁边；“在我身边”保留空间上的邻近含义，不将其改释为单纯由她持有。
- source_word: וַיָּנָס הַחוּצָה
  choice: 逃到外面去了
  rationale: נוס表示逃跑，הַחוּצָה带方向意义，表示向外而去；此译自然呈现动作的急迫和向外的方向。
