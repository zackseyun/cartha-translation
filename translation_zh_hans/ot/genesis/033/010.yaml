  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: zh_hans
  text: 雅各说：“不，请你收下吧。若我在你眼中蒙恩，请从我手中收下这份礼物[a]；因为我见到你的面，就像见到上帝的面[c]，你也接纳了我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”也可译作“赠礼”。希伯来语 מִנְחָה 可指礼物、贡物或供物；这里指雅各为与以扫和好而送上的礼物。
    reason: lexical_alternative
  - marker: b
    text: “接纳了我”也可译作“悦纳了我”或“喜悦我”。原文动词表示带着好意的接受。
    reason: lexical_alternative
  - marker: c
    text: “上帝”也可能译作“一位神明”；但鉴于雅各不久前在毗努伊勒的经历（创32:30），这里以上帝为所指更符合上下文。
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: 蒙恩
  rationale: “在某人眼中蒙恩”自然保留希伯来语的人际性惯用表达，指获得好感与善意，不在此处额外引入系统神学含义。
- source_word: בְּעֵינֶיךָ
  choice: 在你眼中
  rationale: 保留原文“眼”的意象，同时是现代汉语可理解的表达。
- source_word: מִנְחָתִי
  choice: 我的礼物
  rationale: 此处指雅各为求和而送给以扫的礼物；译作“祭物”容易误导读者以为这是礼仪性献祭。
- source_word: מִיָּדִי
  choice: 从我手里
  rationale: 保留具体的“手”这一画面，符合亲手呈送礼物的场景。
- source_word: כִּי עַל־כֵּן
  choice: 因为
  rationale: 在本句中引出雅各恳请以扫收礼的理由；用“因为”传达其话语功能，避免生硬直译。
- source_word: רָאִיתִי פָנֶיךָ כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: 我见到你的面，就像见到上帝的面
  rationale: 保留两次“见……的面”的平行结构及其强烈比较，也与前文毗努伊勒的叙事形成呼应。
- source_word: וַתִּרְצֵנִי
  choice: 你也欣然接纳了我
  rationale: 该动词表达带着好意的悦纳；“欣然接纳”兼顾接待与喜悦认可的意味。
- source_word: אַל נָא אִם נָא
  choice: 不，请收下！我若
  rationale: 先表达恳切拒绝以扫退还礼物的意思，再引出条件式请求；为使汉语对象明确，补出语境中隐含的“收下”。
theological_decisions:
- issue: 比较句中 אֱלֹהִים 的所指
  choice: 上帝
  alternative: 一位神明
  rationale: אֱלֹהִים 在形式上容许较宽的语义范围，但紧邻雅各在毗努伊勒见上帝之面的叙事（创32:30），此处以独一的“上帝”为所指最符合上下文；脚注仍保留另一种语法上可能的读法。
- issue: 雅各把见以扫之面比作见上帝之面
  choice: 直接保留这一比较
  alternative: 弱化为“仿佛蒙上帝恩待”
  rationale: 原文作出鲜明而带有神学张力的比较，译文不替作者解释或缓和。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在你眼中蒙恩”“从我手里”“见到……的面”等表达保留原文意象；标点使雅各恳切而坚持的语气清楚可闻。
