  yaml_path: translation/ot/genesis/033/016.yaml
  text: So Esau returned that day on his way to Seir[a].
translation:
  language: zh_hans
  text: 当天，以扫就上路回西珥去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回……去了
  rationale: שׁוב在叙事性过去时中表示返回；结合目的地西珥，用“回……去了”既保留返回之意，也符合现代汉语行程叙述。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 原文直译为“在那一天”；“当天”在现代汉语中简洁自然，并完整保留时间指示。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: לְדַרְכּוֹ
  choice: 上路
  rationale: 字面为“往他的路/行程”；在此表示重新踏上行程。“上路”自然传达这一动作，又避免生硬的“往他的路”。
- source_word: שֵׂעִירָה
  choice: 西珥
  rationale: 地名后的方向词尾表示朝西珥而去；汉语借助“回……去”的结构表达趋向，无须另加“往”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“当天”承接时间线，“就”体现叙事推进；“上路回西珥去了”保留返回与继续行程两层信息。
