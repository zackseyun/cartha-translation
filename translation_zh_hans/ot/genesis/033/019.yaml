base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: zh_hans
  text: 他用一百可西他[a]，从示剑的父亲哈抹的众子手中买下了那块田地，就是他支搭帐篷的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可西他”是古代的一种支付单位或物件，确切价值不详；传统上也有译作“块银子”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: 买下了
  rationale: קנה在土地交易及随后价款表达的语境中意为“购买”；“买下了”自然表达交易已经完成。
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: 那块田地
  rationale: חֶלְקָה指划定的一块或一片土地；“那块田地”符合现代汉语习惯，也不对面积作过度限定。
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: 就是他支搭帐篷的地方
  rationale: נטה与“帐篷”连用是“支搭帐篷”的惯用表达；以同位说明句自然连接所购买的田地与该地点。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语“从某人手中”的交易性表达，在现代汉语中也自然可懂，体现土地原在卖方掌控之下。
- source_word: בְּנֵי חֲמוֹר
  choice: 哈抹的众子
  rationale: 直译该结构，并用“众子”表明复数；此处指哈抹的儿子们。
- source_word: אֲבִי שְׁכֶם
  choice: 示剑的父亲
  rationale: 按叙事语境将哈抹说明为示剑之父，并保留原文的同位识别功能。
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: 用一百可西他
  rationale: קְשִׂיטָה是确切价值不明的古代支付单位或物件；采用音译以避免误作已知币值，“用”自然引出购买价款。
