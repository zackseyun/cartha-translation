base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: zh_hans
  text: 雅各抬眼望去，只见以扫正走来，和他同行的有四百人。雅各就把孩子们分给利亚、拉结和两个婢女[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”也可译作“女仆”；原文指女性家仆。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב עֵינָיו וַיַּרְא
  choice: 雅各抬眼一看
  rationale: “举目”与“看见”连用，表示抬起目光观看；译作“抬眼一看”既保留动作次序，也符合现代汉语叙事习惯。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 该词是引人注意的生动叙事标记；“只见”能自然地把读者视线引向以扫正在逼近的场景。
- source_word: עֵשָׂו בָּא
  choice: 以扫正迎面而来
  rationale: 分词 בָּא 描写正在发生的接近动作。“正……而来”保留进行意味；“迎面”依场景自然表达其朝雅各而来，但不增添敌意。
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: 跟随他的有四百人
  rationale: 自然呈现以扫有四百人同行的意思，同时保留人数所带来的叙事张力。
- source_word: וַיַּחַץ אֶת הַיְלָדִים
  choice: 就把孩子们分别交给
  rationale: 动词表示分开、分配；结合后接各位母亲，汉语用“分别交给”清楚表达雅各把孩子按母亲分组安置。
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: 给利亚、拉结和两个婢女
  rationale: 重复的 עַל 在此表示将孩子分别归在这些妇人身边。“婢女”简洁地传达 שְׁפָחוֹת 的女性家仆身份；其社会法律含义不宜在正文中过度具体化。
