  yaml_path: translation/ot/genesis/033/009.yaml
  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: zh_hans
  text: 以扫却说[a]：“我已经有很多了，弟弟；你的还是归你吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以扫说：‘我已经有够多的了，弟弟；属于你的，你自己留着吧。’”
    reason: 词义与语篇表达的可选译法：רָב可按语境理解为“够多”；末句可较明确地表达以扫婉拒雅各所赠之物的意思。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却说
  rationale: וַ־推动叙事；结合以扫婉拒雅各礼物的语境，用“却”自然表达轻微转折，אמר译为“说”。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: יֶשׁ לִי רָב
  choice: 我的已经很多了
  rationale: יֵשׁ לִי表示拥有，רָב主要表示“多、丰足”；此译既自然表达以扫已有许多，也不把含义限缩为仅仅“够了”。
- source_word: אָחִי
  choice: 我弟弟
  rationale: 这是带第一人称单数后缀的呼语。中文按以扫与雅各的兄弟次序称“我弟弟”，比直译“我的兄弟”更自然，并保留亲切语气。
- source_word: יְהִי לְךָ
  choice: 还是归你吧
  rationale: היה的祈使语气形式在此为许可、婉拒用途；“归你吧”表达让雅各保有其财物，“还是”由语境体现继续归属，但不强化为命令。
- source_word: אֲשֶׁר לָךְ
  choice: 你的
  rationale: 关系短语指属于雅各的东西；中文以名词化的“你的”简洁自然地表达“属于你的东西”。
