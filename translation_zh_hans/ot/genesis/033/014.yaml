base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: zh_hans
  text: 请我主先行，走在仆人前面；我要照着在我前面的牲畜的步调，也照着孩子们的步调，慢慢前行，直到我来到西珥，到我主那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: 请……走在……前面
  rationale: עבר的祈愿式与语气词נָא构成礼貌请求；结合לִפְנֵי，译出向前先行的方向含义。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是雅各对以扫的恭敬称呼；“我主”保留重复称谓与尊卑语气，并不表示神性。
- source_word: לִפְנֵי עַבְדּוֹ
  choice: 在仆人前面
  rationale: 保留希伯来文第三人称的自谦说法；汉语中简洁自然，也表达走在前头。
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: 慢慢前行
  rationale: התפעל形式可指谨慎、从容地行进，不必明确译成带领；לְאִטִּי说明缓慢而不急迫。
- source_word: לְרֶגֶל
  choice: 照着……的步调
  rationale: 字面为“按着……的脚”，是按对方行进速度而行的习语；“步调”在两次平行结构中自然清楚。
- source_word: הַמְּלָאכָה
  choice: 牲畜
  rationale: 该词通常可指工作、财物或产业，但本节游牧迁行的语境表明是指前方被赶行的牲畜。
- source_word: אֲשֶׁר לְפָנַי
  choice: 前面
  rationale: 在“前面牲畜”中凝练保留空间含义，不额外加入“由我照管”等解释。
- source_word: הַיְלָדִים
  choice: 孩子们
  rationale: 直接指同行的孩子；现代汉语自然明白，不额外限定其年龄。
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: 直到我到西珥我主那里
  rationale: 保留“到我主那里”与目的地“西珥”之间可能略显紧缩的原文结构，同时用现代汉语表达抵达之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主／仆人”保留雅各对以扫的正式自谦口吻；全节不补入雅各是否确实前往西珥等叙事判断。
