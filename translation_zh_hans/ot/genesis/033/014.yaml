  to: 请我主先行，走在仆人前面；我要照着在我前面的牲畜的步调，也照着孩子们的步调，慢慢前行，直到我来到西珥，到我主那里。
  rationale: 修订仅调整中文的句法和指称清晰度。“先行，走在仆人前面”自然保留礼貌请求和第三人称自谦；“在我前面的牲畜”对应原文第一人称空间限定；末句以“来到西珥，到我主那里”保留原文所并列的目的地表达，而不把两者之间的具体语法关系过度诠释为“我主所在的西珥”或“去见我主”。
