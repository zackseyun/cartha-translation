base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: zh_hans
  text: 雅各对他说：“我主知道，孩子们还幼小，羊群和牛群中还有正在哺乳的母畜，都要由我照料。[a]如果把它们赶得太急，哪怕只有一天，整个羊群都会死掉。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句也可译作：“羊群和牛群都带着吃奶的幼崽，照料它们的责任在我身上。”原文是简约的习语，兼有母畜正在哺乳和雅各负有照料责任这两层意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是雅各对以扫表示敬意的称呼，指人而非上帝；“我主”保留了原文的礼貌和社会关系。
- source_word: הַיְלָדִים רַכִּים
  choice: 孩子们还幼小
  rationale: רַכִּים 表示柔弱、稚嫩和不宜承受长途急行；“还幼小”在现代汉语中自然地传达年龄与脆弱性，又不过度强调病弱。
- source_word: הַצֹּאן וְהַבָּקָר
  choice: 羊群和牛群
  rationale: 分别表达小型牲畜的集合名词与牛类牲畜，符合现代汉语的自然搭配。
- source_word: עָלוֹת עָלָי
  choice: 中还有正在哺乳的母畜，都要由我照料
  rationale: 这一简约而有歧义的习语兼含母畜哺乳幼崽和照料责任落在雅各身上的意思；正文表达两层含义，并用脚注说明原文结构。
- source_word: וּדְפָקוּם
  choice: 如果把它们赶得太急
  rationale: דפק 在此指过度或严厉地驱赶牲畜；汉语用无明确施事者的“把”字句自然表达原文未明说的主语。
- source_word: יוֹם אֶחָד
  choice: 哪怕只有一天
  rationale: 表达这种过度驱赶即使只持续一天也会造成严重后果，符合上下文中的条件意味。
- source_word: וָמֵתוּ כָּל הַצֹּאן
  choice: 整个羊群都会死掉
  rationale: 保留 הַצֹּאן 的集合单数表达；在前文同时提到羊群和牛群后，这个词也可能概括牲畜，相关范围在脚注中注明。
