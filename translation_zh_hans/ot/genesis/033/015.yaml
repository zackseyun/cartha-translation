base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: zh_hans
  text: 以扫说：“请让我把与我同行的人留一些在你这里。”雅各说：“何必这样呢？只要让我在我主眼前蒙恩就好了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: 请让我……留一些
  rationale: 希伯来语动词在此指留下、安置一部分人；用“请让我”表达语气词 נָא 的礼貌请求。
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: 跟随我的人……一些
  rationale: מִן 表部分关系，表示从与以扫同行的人中留下若干；“跟随我的人”比直译“与我同在的民”更符合现代汉语语境。
- source_word: לָמָּה זֶּה
  choice: 何必这样呢
  rationale: 字面近于“为什么这样”，在对话中是婉拒以扫安排的反问；此译保持问句形式并自然传达语用含义。
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: 只要让我在我主眼前蒙恩就好了
  rationale: 保留“在……眼前蒙恩”这一希伯来语惯用表达；“只要……就好了”体现雅各以对方善意已足而婉拒护送人员的语境。
theological_decisions:
- issue: “我主”的指称
  choice: 我主
  alternative: 主人／大人
  rationale: 此处是雅各对以扫的尊称，并非神名；保留“我主”既贴近原文，也与本章雅各谦恭的称呼一致。
- issue: 末句是否补出明确宾语或解释
  choice: 不补出“你的厚意已经足够”等解释
  alternative: 译为“我能蒙我主恩待，就已经足够了”
  rationale: 原文措辞简略，可能既表达求得好感，也承担礼貌婉拒功能；正文避免把语用解释完全写死。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。明确说话人为“雅各”，避免连续代词在中文中造成歧义；不加脚注。
