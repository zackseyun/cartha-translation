  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: zh_hans
  text: 请收下送给你的这份礼物[a]，因为上帝恩待了我，我什么都有了。雅各再三恳求他，他就收下了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”原文作“祝福”；这里指雅各送给以扫的财物。
    reason: 既让正文符合现代汉语语境，又保留原词“祝福”及其可能具有的叙事回响。
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: 我给你……的这份礼物
  rationale: 字面为“我的祝福”，但在此指作为善意与祝福表示而送出的财物；现代汉语若直译“祝福”易被理解为口头祝愿，故正文按语境译为“礼物”，并以脚注保留原词义。
- source_word: חַנַּנִי
  choice: 恩待了我
  rationale: 准确表达动词“施恩、厚待”的含义，并保留雅各将所得归于上帝恩典的神学意味。
- source_word: יֶשׁ לִי כֹל
  choice: 我一切都有了
  rationale: 较贴近希伯来语“我有一切”，同时在现代汉语中自然表达丰足知足，而非哲学意义上的绝对拥有。
- source_word: וַיִּפְצַר בּוֹ
  choice: 雅各再三恳求他
  rationale: 该动词表示不断催促、坚持请求；补出雅各为主语以避免汉语代词含混。
- source_word: וַיִּקָּח
  choice: 他才收下
  rationale: “他”指以扫；“才”自然呈现其在雅各坚持劝请后接受的叙事关系，但不添加新的因果内容。
theological_decisions:
- issue: בִּרְכָתִי 是译作“祝福”还是“礼物”
  choice: 正文译“礼物”，脚注注明原文作“祝福”
  alternative: 直译“我的祝福”
  rationale: 上下文明确涉及送到以扫面前的财物；“祝福”同时可能回响兄弟二人关于长子祝福的旧事，因此用脚注保留这一有意义的词汇张力。
- issue: “我有一切”的范围
  choice: 译作“我一切都有了”
  alternative: 译作“我什么都有”或“我已经足够富有”
  rationale: 保留原文强烈而概括的说法，不将其收窄为单纯财富，也不把它解释为绝对全有。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。引语后补出“雅各”以清楚标明主语；末句以“他”指以扫。仅设置一处必要脚注，且标记已在正文出现。
