base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/006.yaml
  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: zh_hans
  text: 于是，婢女们和她们的孩子上前来，俯伏下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俯伏下拜”也可译作“躬身下拜”。原文所指的是俯身或伏地表示敬意的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: 上前来
  rationale: 该词是 נגשׁ 的叙事性连续式第三人称阴性复数，表示朝以扫所在之处靠近；“上前来”自然地表达动作方向及叙事推进。
- source_word: הַשְּׁפָחוֹת
  choice: 婢女们
  rationale: שִׁפְחָה 指女性仆役，也可能含有奴婢身份；结合本段人物关系，“婢女”简洁、性别明确且符合现代叙事语体，但不刻意强化本节未着重说明的法律身份。
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: 和她们的孩子
  rationale: 独立代词 הֵנָּה 与后面的“她们的孩子”构成强调或同位结构，即婢女本人连同孩子。中文将共同主语自然表达为“婢女们和她们的孩子”，不机械重复“她们”。
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: 俯伏下拜
  rationale: 该词表示以俯身、伏地的动作致敬。“俯伏下拜”比单说“鞠躬”更能保留动作幅度及恭敬意味，同时仍是自然、庄重的现代中文。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“于是”承接前文并体现连续叙事；主语按中文习惯重组，以避免照搬希伯来语同位结构造成生硬。
