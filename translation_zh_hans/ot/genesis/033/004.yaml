base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: zh_hans
  text: 以扫跑来迎接他，抱住他，伏在他的颈项上，亲吻他[a]，两个人都哭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本在译作“亲吻他”的希伯来词上方加了不寻常的点号。有些解释者认为这表示疑问或强调，但这里希伯来文的通常意思仍是“亲吻他”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: 跑来
  rationale: רוץ表示奔跑；“跑来”自然地呈现以扫迅速朝雅各而来的动作。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: לִקְרָאתוֹ
  choice: 迎接他
  rationale: לקראת在此指朝某人而去、与他相迎；“迎接他”符合现代汉语叙事，也保留关系性的动作。
- source_word: וַיְחַבְּקֵהוּ
  choice: 抱住他
  rationale: חבק意为拥抱；“抱住他”清楚自然，并与随后伏在颈项上的动作衔接。
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: 伏在他的颈项上
  rationale: 较贴近希伯来语“落在他的颈项上”的生动画面，同时“伏在”比直译“倒在”更符合中文表达；“颈项”保持庄重叙事语体。
- source_word: וַיִּשָּׁקֵהוּ
  choice: 亲吻他
  rationale: 此动词在本句中的通常意义是“亲吻”；马所拉文本的异常点号以脚注说明，不改变正文的明白语义。
- source_word: וַיִּבְכּוּ
  choice: 两个人都哭了
  rationale: 复数动词表明双方都哭了；显明主语范围，避免中文“他们”可能产生的指代含混。
theological_decisions:
- issue: 如何呈现以扫对雅各的举动
  choice: 按叙事表层意义译为一连串亲近、和好的动作，不添加怀疑色彩。
  alternative: 根据后期解释传统，把亲吻理解为可疑、虚假或带讽刺意味。
  rationale: 希伯来文连续使用奔跑、拥抱、伏颈、亲吻和哭泣等动作。译文应保留这种叙事张力与表层意义，不把后来的解释写入正文。
translation_notes:
  register: 采用现代、自然而庄重的叙事中文。“颈项”略带书面色彩，但普通读者容易理解；全句保持希伯来文连续动作的节奏。
