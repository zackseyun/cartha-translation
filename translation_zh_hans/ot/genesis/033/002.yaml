base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: zh_hans
  text: 他把婢女[a]和她们的孩子排在最前面，把利亚和她的孩子排在后面，又把拉结和约瑟排在最后。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女仆”或“女奴”；希伯来语这个词指身份较低的女性家仆，在某些语境中也可指处于奴属身份的女子。
    reason: 保留שִׁפְחָה在家仆与女奴身份之间的词义范围，避免正文过度限定。
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 排在
  rationale: שׂוּם意为“放置、安置”；本节描述队伍次序，用“排在”自然地表达按位置安排，又不增添原文没有的动作细节。
- source_word: הַשְּׁפָחוֹת
  choice: 婢女
  rationale: שִׁפְחָה指身份较低的女性家仆，也可能带有奴属身份。“婢女”简洁、庄重，并以脚注保留“女奴”这一社会身份更强的译法。
- source_word: יַלְדֵיהֶן
  choice: 她们的孩子
  rationale: יֶלֶד在此泛指孩子，不宜缩窄为“儿子”。
- source_word: רִאשֹׁנָה
  choice: 最前面
  rationale: 此处阴性单数形式作副词，表示排列中的第一位置；“最前面”清楚体现空间次序。
- source_word: לֵאָה
  choice: 利亚
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: וִילָדֶיהָ
  choice: 和她的孩子
  rationale: 保留连接结构，并以“孩子”表达原词较宽泛的含义。
- source_word: אַחֲרֹנִים (first occurrence)
  choice: 后面
  rationale: 第一次出现时指第二组在第一组之后，而不是整个队伍的最后；译作“后面”准确保留相对位置。
- source_word: רָחֵל
  choice: 拉结
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: אַחֲרֹנִים (second occurrence)
  choice: 最后
  rationale: 第二次出现指第三组处于全队末位，译作“最后”直接而自然。
theological_decisions: []
