source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א אֶת עֵינָ֗י/ו וַ/יַּ֤רְא אֶת הַ/נָּשִׁים֙ וְ/אֶת הַ/יְלָדִ֔ים וַ/יֹּ֖אמֶר מִי אֵ֣לֶּה לָּ֑/ךְ וַ/יֹּאמַ֕ר הַ/יְלָדִ֕ים אֲשֶׁר חָנַ֥ן אֱלֹהִ֖ים אֶת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: zh_hans
  text: 他抬眼看见那些妇女和孩子，就问：“这些是你的什么人？[a]”雅各回答：“是上帝施恩赐给你仆人的孩子。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些跟你在一起的人是谁？”希伯来语原句直译近于“这些人对你是谁”，是在询问他们与雅各的关系或身份。
    reason: lexical_alternative
  - marker: b
    text: 或译：“是上帝赐给你仆人的孩子。”原文动词也含有施恩、厚待的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת־עֵינָיו
  choice: 他抬眼
  rationale: 这是表示抬起目光观看的希伯来语惯用语。“抬眼”在现代汉语中简洁自然，也保留了原文的叙事色彩。
- source_word: הַנָּשִׁים
  choice: 那些妇女
  rationale: 原词泛指“妇女”，并未在本节明确说“妻子”；因此不根据上下文把亲属关系具体化。
- source_word: הַיְלָדִים
  choice: 孩子
  rationale: 在本语境中自然表达年幼的儿女；两处采用同一译法以保持原文呼应。
- source_word: מִי אֵלֶּה לָּךְ
  choice: 这些是你的什么人？
  rationale: 介词短语字面为“对你而言”，在此询问这些人与雅各的关系。汉语“是你的什么人”既自然，又较好地保留这种关系性表达。
- source_word: חָנַן
  choice: 施恩赐给
  rationale: 该动词不只表示给予，还含有施恩、厚待之意；此译法保留神恩待雅各的语义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处是单数所指，采用现代汉语中庄重而通行的称呼。
- source_word: עַבְדֶּךָ
  choice: 你仆人
  rationale: 这里是雅各对以扫的谦称，并非着重说明奴隶身份；“你仆人”保留其恭敬和自谦语气。
theological_decisions:
- issue: 雅各所说的儿女与上帝恩惠之间的关系
  choice: 译作“上帝施恩赐给”，明确保留 חנן 所含的恩待意味。
  alternative: 译作“上帝赐给”，只表达给予。
  rationale: 原动词本身含有施恩、厚待的语义；译出这一层意思并非加入额外教义，而是保存原文对上帝恩惠的表述。
- issue: 对话双方的辨识
  choice: 第一句用“问”，第二句明说“雅各回答”。
  alternative: 两处都按字面译作“他说”。
  rationale: 希伯来语连续两次使用“他说”，但上下文明确定出先说话的是以扫、回答的是雅各。汉语若都写“他说”容易造成误解，明确第二位说话者属于叙事层面的自然转换，并未消除实质性的原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬眼”保留原文惯用语的质感；“那些妇女”不擅自具体化为妻子；对话措辞自然，并以“雅各回答”避免汉语代词造成的说话者混淆。
