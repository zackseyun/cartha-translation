base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: zh_hans
  text: 以扫说：“我遇见的这一大队是什么意思？”雅各说：“是为了在我主眼前蒙恩。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי לְךָ
  choice: 是什么意思
  rationale: 该结构在此不是询问身份，而是询问雅各安排这支队伍的用意；“是什么意思”既自然，也保留原文较含蓄的问法。
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: 这一大队
  rationale: מַחֲנֶה 可指营地、队伍或成群同行者；上下文所指是雅各先行送出的牲畜及仆人组成的队列。“这一大队”比“营地”更符合此处场景，也保留集合意义。
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: 我遇见的
  rationale: 准确表达 פָּגַשׁ 的“遇见、碰见”之义，并自然地修饰前面的“大队”。
- source_word: לִמְצֹא חֵן
  choice: 是为了……蒙恩
  rationale: 不定式表目的；“蒙恩”是现代中文仍可理解的庄重表达，表示得到对方的善意和接纳。
- source_word: בְּעֵינֵי
  choice: 在……眼前
  rationale: 保留希伯来语“在某人眼中”的表达质感，同时中文自然可懂。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是雅各对以扫的谦恭称呼，并非神的称号；“我主”保留当时社会关系中的敬称与自谦语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免连续两个“他说”造成指代含混，按上下文明确说话者为“以扫”和“雅各”；不增加原文未表达的神学解释。
