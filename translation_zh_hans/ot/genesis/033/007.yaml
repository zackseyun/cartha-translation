  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: zh_hans
  text: 利亚和她的孩子们也上前来[a]，下拜[b]。随后，约瑟和拉结上前来[a]，也下拜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“走近”。
    reason: lexical_alternative
  - marker: b
    text: 或译“俯伏下拜”；原文动词指以屈身表达敬意，未明确身体俯伏的具体程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: 上前来
  rationale: נגשׁ表示接近、走近；结合众人依次来到以扫面前的场景，“上前来”自然地体现向前接近的动作，同时不额外限定方式。
- source_word: גַּם
  choice: 也
  rationale: גַּם表示递加，承接前面各组依次上前的叙事。
- source_word: וִילָדֶיהָ
  choice: 和她的孩子们
  rationale: יְלָדִים可泛指孩子，并不限定为男性；“孩子们”准确且符合现代汉语。
- source_word: וַיִּשְׁתַּחֲוּ
  choice: 俯伏下拜
  rationale: 此处שׁחה的词形表示恭敬下拜。“俯伏下拜”既传达身体俯下的敬礼动作，也保持原文对具体姿势程度的弹性。
- source_word: וְאַחַר
  choice: 随后
  rationale: 该词标明队列中后续发生的动作；“随后”简洁自然地保持时间次序。
- source_word: יוֹסֵף וְרָחֵל
  choice: 约瑟和拉结
  rationale: 依照希伯来文次序，保留约瑟在拉结之前。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上前来”体现依次进到以扫面前的动作；第二句加入“也”使汉语承接自然，并对应两组同样的下拜行为。所有脚注标记均置于正文相关词语之后。
