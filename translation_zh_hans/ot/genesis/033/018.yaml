base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: zh_hans
  text: 雅各从巴旦·亚兰来时，平安到达迦南地的示剑城[a]，在城前安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅各来到沙冷，即示剑的一座城。”希伯来语“沙冷”（שָׁלֵם）既可理解为“平安、安然”，也可理解为地名“沙冷”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 到达
  rationale: 叙事体中表示抵达；现代汉语用“到达”可清楚表达动作终点。
- source_word: שָׁלֵם
  choice: 平安
  rationale: 在此最自然地作状态状语，表示雅各安然无恙地抵达；同时保留其可能为地名“沙冷”的歧义于脚注。
- source_word: עִיר שְׁכֶם
  choice: 示剑城
  rationale: 这是“城”与专名“示剑”构成的组合，译作“示剑城”简洁自然。
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: 迦南地的
  rationale: 关系从句说明示剑城的位置；汉语以前置定语表达更流畅。
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: 从巴旦·亚兰回来时
  rationale: 介词加不定式结构表达时间背景。“回来”结合雅各返回迦南的语境，避免重复“到达”，又不改变其从巴旦·亚兰而来的意思。
- source_word: פַּדַּן אֲרָם
  choice: 巴旦·亚兰
  rationale: 采用现代中文圣经读者较熟悉的音译，并以间隔号标明复合地名。
- source_word: וַיִּחַן
  choice: 安营
  rationale: 准确表达扎营、驻营之意，庄重而为现代读者易懂。
- source_word: אֶת־פְּנֵי הָעִיר
  choice: 在城前
  rationale: 希伯来语字面为“城的面前”，指城前方或城对面的区域；“在城前”简明保留空间关系。
