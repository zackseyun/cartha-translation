  yaml_path: translation/ot/genesis/033/020.yaml
  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: zh_hans
  text: 他在那里立了一座祭坛，给它起名叫“伊勒·以罗黑·以色列”[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在那里立了一座祭坛，求告说：‘上帝，以色列的上帝。’”也可译：“他宣告：‘上帝是以色列的上帝。’”希伯来语既可理解为给祭坛命名，也可理解为求告上帝或作出有关上帝的宣告。
    reason: alternative_reading
  - marker: b
    text: “伊勒·以罗黑·以色列”意为“上帝，以色列的上帝”，也可理解为“伊勒，以色列的上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: 立了
  rationale: 希伯来语动词 נצב 的使役式在此表示设立、竖立；“立了一座祭坛”是现代汉语中自然、庄重的表达。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达原文的地点副词，并承接上文所述地点。
- source_word: מִזְבֵּחַ
  choice: 祭坛
  rationale: 准确表达用于献祭的结构，也是现代汉语圣经语境中的标准用词。
- source_word: וַיִּקְרָא לוֹ
  choice: 给它起名叫
  rationale: קרא + ל 可表示给某物命名；紧接在立祭坛之后，此解读最顺畅。代词“它”指祭坛，但原文也容许求告或宣告的理解，故在脚注保留。
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: 伊勒·以罗伊·以色列
  rationale: 主文将整句视为祭坛名称，因此采用音译，既保留专名功能，也避免在正文中提前消解其句法歧义；其词义另在脚注说明。
theological_decisions:
- issue: 末尾短语是祭坛的名称，还是对上帝的求告或有关上帝的宣告
  choice: 正文理解为雅各给祭坛所起的名称
  alternative: 也可理解为他求告“上帝，以色列的上帝”，或在祭坛上宣告“上帝是以色列的上帝”
  rationale: 立祭坛后接 קרא לו 的句法自然支持命名，且与《创世记》中类似的命名格式相符；不过原文表达简洁，仍容许求告或宣告的解释，因此不在正文中强行排除，而以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“立了一座祭坛”简洁自然；祭坛名称使用音译，并通过两个脚注交代原文意义及真实存在的句法和神学张力。
