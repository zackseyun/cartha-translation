base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: zh_hans
  text: 他亲自走到他们前面，俯伏在地七次[a]，直到他走近哥哥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俯伏下拜”；希伯来语动词可指俯伏，或表示敬意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 他亲自
  rationale: 独立人称代词使主语带有强调意味；“他亲自”突出雅各本人走到前面。
- source_word: עָבַר לִפְנֵיהֶם
  choice: 走在众人前面
  rationale: 结合雅各迎见以扫的语境，此短语表示他越过家人、走到他们前面带头前行；此译自然且保留空间关系。
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: 俯伏在地
  rationale: 动词可指躬身、俯伏或表示敬意，אַרְצָה明确动作朝向地面；“俯伏在地”保留具体姿态，又不把动作限定为敬拜。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 忠实直译明确的次数。
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: 直到走近他哥哥
  rationale: 介词עַד与不定式结构说明反复俯伏持续到接近哥哥之时；“走近”自然表达逐步接近的动作。
theological_decisions:
- issue: 俯伏动作的性质
  choice: 译为“俯伏在地”，不明说是敬拜或臣服
  alternative: 向他下拜／向他行臣服礼
  rationale: 原文描写深度俯伏并可含致敬意味，但本节没有把对象或神学性质明说到足以限定为敬拜；译文保留其礼仪性与叙事张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“众人”承接上文雅各的家人群体；“哥哥”比“兄长”更符合普通现代读者的自然表达。
