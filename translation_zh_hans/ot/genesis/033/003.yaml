  naturalness: 修订后的句子保持现代汉语庄重、顺畅的叙事语体。“直到他走近哥哥”补出主语，避免“直到走近他哥哥”在脱离上下文时略显省略。
  terminology: “俯伏在地”适切传达该动词及方向性词语所描写的深度下拜，且不擅自定为敬拜。“哥哥”在现代叙事汉语中自然，并符合以扫为雅各兄长的上下文。脚注改以“俯伏下拜”为词汇替代，并保留该词可指俯伏或表示敬意的语义范围。
