  yaml_path: translation/ot/genesis/033/012.yaml
  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: zh_hans
  text: 以扫说：“我们动身走吧，我会走在你前面[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与你并行。”
    reason: לְנֶגְדֶּךָ可表示在某人面前或与其相对而行；此处究竟强调领行还是陪同行进，存在词义上的开放性。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 以扫说
  rationale: 连续式叙事动词推进情节；中文直接用“说”自然简洁。根据上文明确说话者为以扫，补出姓名可避免中文代词含混。
- source_word: נִסְעָה וְנֵלֵכָה
  choice: 我们动身走吧
  rationale: 两个第一人称复数意愿式动词共同表达出发前行的提议；“动身走吧”既保留劝同行的语气，也避免生硬重复。
- source_word: וְאֵלְכָה
  choice: 我要走
  rationale: 第一人称单数未完成式在提议之后表示以扫愿意采取的行动；“我要走”自然保留其主动意愿。
- source_word: לְנֶגְדֶּךָ
  choice: 在你前面
  rationale: נגד带有在面前、对面或相对位置之意；在行旅语境中，“在你前面”最直接，同时用脚注保留“与你并行”的语境性可能。
theological_decisions: []
