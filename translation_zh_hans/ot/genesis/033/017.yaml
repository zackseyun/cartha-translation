  text: וְ/יַעֲקֹב֙ נָסַ֣ע סֻכֹּ֔תָ/ה וַ/יִּ֥בֶן ל֖/וֹ בָּ֑יִת וּ/לְ/מִקְנֵ֨/הוּ֙ עָשָׂ֣ה סֻכֹּ֔ת עַל כֵּ֛ן קָרָ֥א שֵׁם הַ/מָּק֖וֹם סֻכּֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: zh_hans
  text: 雅各前往疏割[a]，在那里为自己盖了一所房子，又为他的牲畜搭了棚子。因此，他给那地方起名叫疏割。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “疏割”是希伯来语音译；这个名称与本节译作“棚子”的词是同一个词。
    reason: 说明原文中地名与普通名词之间的文字联系；中文音译本身无法呈现这一命名双关。
lexical_decisions:
- source_word: נָסַע
  choice: 前往
  rationale: 该动词表示拔营启程、从一处迁往另一处；“前往”在现代汉语叙事中自然简洁，并与表示方向的地名形式相配。
- source_word: סֻכֹּתָה
  choice: 疏割
  rationale: 词尾的方向性־ָה表示朝该地而去；“疏割”采用中文圣经传统中通行的地名音译，具体方向由“前往”表达。
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: 在那里为自己盖了一所房子
  rationale: “为自己”明确保留希伯来语的受益者表达；“盖了一所房子”是自然的现代汉语。“在那里”由上下文所含的到达并居留之意补出，使叙事衔接清楚。
- source_word: מִקְנֵהוּ
  choice: 他的牲畜
  rationale: 该词在此指雅各所拥有的群畜；“牲畜”比仅指牛的说法范围更准确。
- source_word: עָשָׂה סֻכֹּת
  choice: 搭了棚子
  rationale: סֻכּוֹת指供遮蔽用的棚舍或临时住棚；用于牲畜时，“搭了棚子”自然准确，也保留了与地名“疏割”的命名联系。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 该固定表达引出前述行为与地名来源之间的因果关系；“因此”简洁而庄重。
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: 他给那地方起名叫
  rationale: 按现代汉语习惯表达希伯来语“称那地方的名”这一命名公式，意义完整而不生硬。
- source_word: סֻכּוֹת
  choice: 疏割
  rationale: 作为地名采用音译，不直接译作“棚子”；原文以同一个希伯来词兼作普通名词和地名，双关关系在脚注中说明。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“盖房子”“搭棚子”符合当代普通读者的表达习惯；保留“因此”以凸显经文解释地名来源的结构。
