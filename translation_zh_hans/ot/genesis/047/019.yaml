revisions:
- from: 我们和我们的田地为什么要死在你眼前呢[a]？求你用粮食买下我们和我们的田地，我们和我们的田地就归法老作奴仆[b]。请给我们种子，使我们存活，不至死亡，田地也不至荒废[c]。
  to: 我们和我们的田地为什么要在你眼前灭亡呢[a]？求你用粮食买下我们和我们的田地；我们和田地都归法老所有，我们作他的奴仆[b]。请给我们种子，使我们存活，不至死亡，田地也不至荒废[c]。
  rationale: 修订仅为消除中文中“田地作奴仆”的句法歧义，并使人和田地共同面临的灾毁表达更自然。保留原文的反问、恳求、以粮食交换、归属法老、播种用种子及土地免于荒废等全部要点；未引入任何特定制度或教义判断。
