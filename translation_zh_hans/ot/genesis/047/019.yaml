  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be slaves to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: zh_hans
  text: 我们和我们的田地为什么要在你眼前灭亡呢[a]？求你用粮食买下我们和我们的田地；我们和田地都归法老所有，我们作他的奴仆[b]。请给我们种子，使我们存活，不至死亡，田地也不至荒废[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你面前”。
    reason: lexical_alternative
  - marker: b
    text: “奴仆”也可译作“奴隶”。这里指因被买下而归法老役使的人。
    reason: lexical_alternative
  - marker: c
    text: “荒废”也可译作“荒凉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: 为什么要死……呢
  rationale: 保留反问和恳求的语气；“要死”在现代汉语中自然表达此处未完成式的情态意味。
- source_word: לְעֵינֶיךָ
  choice: 在你眼前
  rationale: 保留希伯来语鲜明的身体意象，意为在约瑟亲眼看着的情况下。
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: 我们和我们的田地
  rationale: 以自然汉语并列两项，同时保留百姓与土地都面临毁灭的意思。
- source_word: אַדְמָתֵנוּ
  choice: 我们的田地
  rationale: 上下文涉及耕种、种子和饥荒，“田地”比宽泛的“土地”更准确地体现农耕用地。
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: 买下我们和我们的田地
  rationale: קנה在这里指以粮食换取人身及田地的所有权；“买下”直接而清楚。
- source_word: בַּלָּחֶם
  choice: 用粮食
  rationale: לֶחֶם字面可指“饼、食物”，在饥荒交易语境中“粮食”自然地传达作为价款或交换手段的意义。
- source_word: וְנִהְיֶה ... עֲבָדִים לְפַרְעֹה
  choice: 就归法老作奴仆
  rationale: 表达购买所导致的隶属关系；“归法老”体现לְ所标示的归属，“作奴仆”兼顾受役使与失去自由的经济法律处境。
- source_word: וְתֶן זֶרַע
  choice: 请给我们种子
  rationale: “我们”虽为原文隐含成分，却由说话者和语境明确；补出后更符合现代汉语。“种子”在农耕语境中明确指播种用的籽种。
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: 田地也不至荒废
  rationale: תֵשָׁם表示荒凉、荒废；“荒废”适合因无人耕种而土地废弃的语境。
theological_decisions:
- issue: עֲבָדִים所表示的身份
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: 原词涵盖不同程度的服役与隶属。本节涉及用粮食购买人身并归法老所有，不能淡化为一般雇佣仆役；但“奴仆”较能保留其语义范围，避免额外指定某种后世奴隶制度。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“求你”“请”体现百姓迫切的恳求；保留“在你眼前”的希伯来语意象，并以“田地”“粮食”“种子”维持本节鲜明的农耕经济语境。
