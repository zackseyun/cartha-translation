  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: zh_hans
  text: 法老问约瑟的弟兄们：“你们是做什么工作的？”他们回答法老：“你的仆人以牧放羊群为业；我们和我们的父亲都是这样。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: 你们是做什么工作的？
  rationale: מַעֲשֶׂה可指工作、活动或所做之事；在法老接见他们的语境中，所问的是职业。此译自然、明确，又没有过度具体化。
- source_word: רֹעֵה צֹאן
  choice: 牧放羊群的
  rationale: רֹעֵה是“牧放、照管”的分词，צֹאן指羊群等小型牲畜，通常包括绵羊和山羊。“牧放羊群的”兼顾两个词，也符合现代汉语表达。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: עֶבֶד虽可泛指奴仆，但此处是臣民对法老自称的恭敬用语，不宜译得像是在明确陈述奴隶身份。
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: 我们和我们的祖辈都是如此
  rationale: 重复的גַּם强调他们与先辈皆以牧羊为业。“都是如此”自然表达这种世代延续，同时保留双方并列的强调。
- source_word: אֶל אֶחָיו
  choice: 问他的弟兄们
  rationale: 代词所指在上下文中是约瑟；正文依照希伯来文保留“他的弟兄们”，不擅自补入约瑟的名字。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“弟兄们”保留家族关系及圣经叙事语感；法老的问话用日常而不失正式的“做什么工作”。“祖辈”比“父亲们”更自然地表达历代先祖。
