  text: וַ/יָּבִ֣יאוּ אֶת מִקְנֵי/הֶם֮ אֶל יוֹסֵף֒ וַ/יִּתֵּ֣ן לָ/הֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּ/סּוּסִ֗ים וּ/בְ/מִקְנֵ֥ה הַ/צֹּ֛אן וּ/בְ/מִקְנֵ֥ה הַ/בָּקָ֖ר וּ/בַ/חֲמֹרִ֑ים וַ/יְנַהֲלֵ֤/ם בַּ/לֶּ֨חֶם֙ בְּ/כָל מִקְנֵ/הֶ֔ם בַּ/שָּׁנָ֖ה הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: zh_hans
  text: 于是，他们把牲畜带到约瑟那里。约瑟就用粮食换取他们的马、羊群、牛群和驴；那一年，约瑟用粮食供养他们，换取了他们所有的牲畜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供养他们”直译可作“带领他们”。这里的希伯来语动词可表示“带领、引导、料理”；在本节语境中，很可能是指约瑟用粮食维持他们的生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: 牲畜／所有的牲畜
  rationale: 该词泛指人所拥有的家畜，并不限于牛；“牲畜”在现代汉语中准确而自然。
- source_word: לֶחֶם
  choice: 粮食
  rationale: 该词本义常为“饼、食物”，在饥荒和国家储粮的语境中指维持生计的粮食；译作“粮食”比字面的“饼”更符合现代汉语，同时保留其具体物质含义。
- source_word: בַּסּוּסִים
  choice: 换取他们的马
  rationale: 介词 ב 在此表示交换的代价；明确译出“换取”，可避免理解为工具或地点。
- source_word: מִקְנֵה הַצֹּאן
  choice: 羊群
  rationale: צֹאן 是绵羊和山羊等小型群畜的集合称谓；“羊群”简明自然，又不武断限定为绵羊。
- source_word: מִקְנֵה הַבָּקָר
  choice: 牛群
  rationale: 该短语指牛类的大型群畜；“牛群”准确保留集合意义，并与“羊群”对应。
- source_word: חֲמֹרִים
  choice: 驴
  rationale: 现代汉语的直接常用对应词。
- source_word: וַיְנַהֲלֵם
  choice: 约瑟用粮食供养他们
  rationale: נהל 基本义可指带领、引导或料理；与“用粮食”连用时，语境义是使百姓得到供应、维持生计。“供养”保留照料供应的意味，但将较字面的可能性收入脚注。
- source_word: בְּכָל מִקְנֵהֶם
  choice: 换取了他们所有的牲畜
  rationale: 本句总结全年以牲畜换粮的交易；明确“换取”可避免误解为粮食是给牲畜吃的。
- source_word: בַּשָּׁנָה הַהִוא
  choice: 那一年
  rationale: 自然简洁地表达该交易发生并持续的时期。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“粮食”符合饥荒及以牲畜换取生计物资的上下文；重复译出“换取”，使交易关系清楚。脚注保留 וַיְנַהֲלֵם 的字面义及其词义张力。
