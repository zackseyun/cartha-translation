base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: zh_hans
  text: 遍地都没有食物[a]，因为饥荒极其严重；埃及地和迦南地都因饥荒而衰弱不堪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“饼”，这里很可能泛指食物。
    reason: lexical_alternative
  - marker: b
    text: 或译“疲乏”或“困乏”。原文以拟人手法描述埃及地和迦南地因饥荒而疲弱困顿。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: 食物
  rationale: 本义为“饼、粮食”，但在饥荒语境中可借代维持生命的食物；译作“食物”避免把含义不当地限于饼。
- source_word: אֵין
  choice: 没有
  rationale: 按过去时叙事语境，以现代汉语自然表达存在否定。
- source_word: בְּכָל הָאָרֶץ
  choice: 遍地
  rationale: 指上下文中受灾的整个地域，并非全世界；“遍地”简洁保留范围上的全面性。
- source_word: כָבֵד ... מְאֹד
  choice: 极其严重
  rationale: כָבֵד本义为“沉重”，修饰饥荒时表示程度严重；מְאֹד加强语气。
- source_word: הָרָעָב
  choice: 饥荒
  rationale: 符合本段叙事中粮食断绝的灾荒语境。
- source_word: וַתֵּלַהּ
  choice: 衰弱不堪
  rationale: 该罕见动词描写因饥荒而疲弱、衰颓；原文将土地拟人化，“衰弱不堪”既保留这一形象，也表达灾荒造成的耗损。
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: 埃及地和迦南地
  rationale: 保留两处אֶרֶץ的地域表述，同时符合现代汉语圣经地名习惯。
- source_word: מִפְּנֵי הָרָעָב
  choice: 因饥荒
  rationale: 自然表达该介词短语的原因意义。
