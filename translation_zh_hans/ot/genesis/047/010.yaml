  text: 雅各为法老祝福，随后从法老面前退了出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祝福”也可理解为“向法老致意”或“向法老辞别”；希伯来语这个动词通常意为“祝福”，但在觐见君王的场合，也可兼有正式问候或辞别的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 又为……祝福
  rationale: ברך通常意为“祝福”。本节与第7节首尾呼应，因此保留其基本词义；“又”自然体现叙事中的再次发生。宫廷觐见语境中也可能兼有问候或辞别的礼仪意味，故在脚注中说明。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶת
  choice: 不单独译出
  rationale: 希伯来语直接宾语标记，现代汉语无须对应表达。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代中文对埃及君王称号的通行译法。
- source_word: וַיֵּצֵא
  choice: 退了出去
  rationale: יצא的基本义是“出去”。在君王面前结束觐见的语境中，“退了出去”既保留实际离开的动作，也符合现代汉语的宫廷会见语感。
- source_word: מִלִּפְנֵי
  choice: 从法老面前
  rationale: 较直接地保留“从……面前”的希伯来语空间与觐见意象，同时在现代汉语中自然可懂。
