base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: zh_hans
  text: 只有祭司的土地，约瑟没有买下，因为祭司从法老那里得到定额供给[a]，他们就以法老给他们的那份供给为食。因此，他们没有卖自己的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“固定口粮”、“份额”或“配给”。这里的希伯来语 חֹק／חֻקָּם 指按规定分配的生活供给，重点不是法律条例。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只有
  rationale: 标明这是对上文概括的一个例外，保留原文的限制语气。
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: 祭司的土地
  rationale: 自然表达该结构所指祭司拥有的地产。
- source_word: קָנָה
  choice: 买下
  rationale: 本段叙述约瑟在饥荒中购取埃及人的土地；“买下”既通顺，也凸显交易完成。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出约瑟没有购买祭司土地的原因。
- source_word: חֹק / חֻקָּם
  choice: 定额供给／那份供给
  rationale: 此处指法老按规定分给祭司的生活物资，并非主要指抽象的律例；前后措辞既保持词义一致，又避免中文生硬重复。
- source_word: מֵאֵת פַּרְעֹה
  choice: 从法老那里
  rationale: 准确表达供给的来源，符合现代汉语习惯。
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: 他们就以……那份供给为食
  rationale: 保留原文“吃”的具体意象，同时自然表达祭司依靠所得供给维生。
- source_word: אֲשֶׁר נָתַן לָהֶם פַּרְעֹה
  choice: 法老给他们的
  rationale: 以简明定语结构交代供给者，不添加原文没有的时间层次。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 清楚标示前述供给与祭司不卖土地之间的因果结果。
- source_word: מָכְרוּ
  choice: 卖
  rationale: 直接对应商业交易语境中的出售行为。
- source_word: אַדְמָתָם
  choice: 自己的土地
  rationale: “自己的”自然表达第三人称复数所有关系，并清楚回指祭司。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“定额供给”保留官方分配和固定份额的含义；“以……为食”兼顾希伯来语具体的“吃”与自然汉语表达。脚注标记置于其实际说明的词语之后。
