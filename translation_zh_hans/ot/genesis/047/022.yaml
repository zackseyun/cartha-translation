revisions:
- from: 只有祭司的土地，约瑟没有买下，因为祭司从法老那里有定额供给[a]，他们就以法老给他们的那份供给为食。因此，他们没有卖自己的土地。
  to: 只有祭司的土地，约瑟没有买下，因为祭司从法老那里得到定额供给[a]，他们就以法老给他们的那份供给为食。因此，他们没有卖自己的土地。
  rationale: 仅作安全的措辞调整，以改善现代标准汉语的自然度。“得到”明确祭司是法老供应的接受者，同时保留原文所表达的供给来源和因果关系。脚注锚点仍紧随“定额供给”，准确对应所说明的希伯来语词。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:11Z'
