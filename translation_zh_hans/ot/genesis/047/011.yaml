  to: 约瑟安置父亲和兄弟们住下，并在埃及地最好的地方[a]，在兰塞地，给他们一处产业，正如法老所吩咐的。
  rationale: 修订仅调整语序和地点表达，以更紧密反映希伯来文的句法与信息顺序：先安置，再赐予土地产业，随后以埃及地、最好的地方、兰塞地逐层定位，最后说明这符合此前法老的命令。“一处产业”保留土地持有物的具体含义。
