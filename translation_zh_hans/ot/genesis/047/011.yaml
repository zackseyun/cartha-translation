base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: zh_hans
  text: 约瑟安置父亲和兄弟们住下，并在埃及地最好的地方[a]，在兰塞地，给他们一处产业，正如法老所吩咐的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最好的地方”也可译作“最肥美的地方”。
    reason: מֵיטַב既可泛指最佳部分，也可在土地语境中突出土地肥美、上佳。正文保留较宽泛的表达，脚注提示语境化译法。
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: 安置……住下
  rationale: 该词是ישׁב的使役式，表示约瑟使父亲和兄弟定居；“安置……住下”既保留使役含义，也符合现代汉语叙事表达。
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: 父亲和兄弟们
  rationale: 按希伯来文明确保留两类亲属，不泛化为“家人”。
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: 给他们一份产业
  rationale: אֲחֻזָּה指可占有的土地或地产。“一份产业”表达土地占有权，又避免译作“基业”可能带入本节未明说的盟约或继承含义。
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: 在埃及地最好的地方
  rationale: מֵיטַב表示一地中最好、上佳的部分；此译自然清楚，并保留其评价意味。
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: 就是兰塞境内
  rationale: 后一个地点短语具体说明“埃及地最好的地方”所在区域；“境内”自然表达此处אֶרֶץ所指的地区。地名采用中文圣经传统中易辨认的“兰塞”。
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: 照法老所吩咐的
  rationale: 表示约瑟的安排符合此前法老的命令；“所吩咐的”保留先行命令与当前执行之间的关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“安置……住下”避免生硬直译使役结构；将地点短语前置，使“在埃及地最好的地方，就是兰塞境内”清楚修饰“给他们一份产业”，同时保留原文中地点由宽到窄的层次。
