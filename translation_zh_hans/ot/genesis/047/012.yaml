base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: zh_hans
  text: 约瑟供给他的父亲、兄弟和他父亲全家食物，按孩子们的数目分配。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按孩子们的数目分配”直译为“按小孩子的口”；即按家中小孩子的人数（口数）分配。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: 供养
  rationale: כלכל 的 Piel 词形在此表示以物资维持、供应；“供养”自然地涵盖约瑟在饥荒期间持续供应家人的意思。
- source_word: לֶחֶם
  choice: 食物
  rationale: לֶחֶם 的本义常为“饼、粮食”，但在饥荒和家庭供应的语境中泛指食物；译作“食物”可避免把所供之物不当地限于饼。
- source_word: כָּל בֵּית אָבִיו
  choice: 父亲全家
  rationale: בַּיִת 在这里指家庭或家族成员，而非房屋；“父亲全家”简洁、自然地表达这个社会家庭单位。
- source_word: לְפִי הַטָּף
  choice: 按孩子们的需要
  rationale: לְפִי 字面与“口”有关，在此表达按一定尺度或分量供应；结合 הַטָּף，既可能着眼于孩子的数目，也可能着眼于其所需口粮。“按孩子们的需要”符合供应语境，同时以脚注保留另一种理解。
- source_word: הַטָּף
  choice: 孩子们
  rationale: טַף 指家中的幼小孩童或小孩子；现代汉语“孩子们”通顺明确，不必以略显生硬的“小孩子们”表达。
- source_word: אָבִיו ... אֶחָיו
  choice: 他的父亲、兄弟
  rationale: 按上下文直译亲属称谓；“兄弟”准确指约瑟的男性手足。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“供养”表达持续供应家用所需；“父亲全家”避免将“家”误解为建筑物。将希伯来习语 לְפִי הַטָּף 译为“按孩子们的需要”，并用脚注保留“按数目”的真实歧义。
