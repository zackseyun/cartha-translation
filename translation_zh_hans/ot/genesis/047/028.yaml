base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: zh_hans
  text: 雅各在埃及地住了十七年；雅各一生的年日[a]共一百四十七年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“雅各的日子，他一生的年数。”这是表示其一生寿数的希伯来语表达。
    reason: 说明原文以“日子”与“他一生的年数”构成的同位式，并保留其寿数习语的色彩。
lexical_decisions:
- source_word: וַיְחִי
  choice: 生活了
  rationale: 此处חיה表示雅各在埃及延续生活了这段时间；“生活了”符合现代汉语叙事表达，也不额外引入“居住”或“幸存”的含义。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留原文אֶרֶץ“地”，同时采用自然、庄重的现代汉语表达。
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: 十七年
  rationale: 准确传达原文的年数。
- source_word: יְמֵי יַעֲקֹב שְׁנֵי חַיָּיו
  choice: 雅各一生的年日
  rationale: 原文以“雅各的日子”和“他一生的年数”同位说明其寿数；“一生的年日”保留希伯来语的表达色彩，又让现代读者容易理解。
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: 一百四十七年
  rationale: 按现代汉语数词顺序表达原文总数，数值不变。
- source_word: וַיְהִי
  choice: 共是
  rationale: 在总结寿数的句子中，用“共是”自然表达总计之意。
