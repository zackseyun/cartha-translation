base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: zh_hans
  text: 埃及地就在你面前[a]。你要把你父亲和兄弟安置在这地最好的地方，让他们住在歌珊地。你若知道他们中间有能干的人[b]，就任命他们作主管，管理我的牲畜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你面前”是希伯来语表达，在这里含有任你选择、可供你安排的意思。
    reason: cultural_note
  - marker: b
    text: 或译“有能力的人”“胜任的人”；直译近于“有力量或才干的人”，这里不一定指英勇善战。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: 埃及地就在你面前
  rationale: 保留“在你面前”这一希伯来语意象；结合上下文，它表示法老准许约瑟在埃及境内选择安置家人的地方。
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: 在这地最好的地方
  rationale: מֵיטַב 指最好、最上等的部分；此译法既准确，又符合现代汉语表达。
- source_word: הוֹשֵׁב
  choice: 安置
  rationale: 该使役命令式表示使人定居；“安置”自然地体现约瑟要为父亲和兄弟安排居所。
- source_word: יֵשְׁבוּ בְּאֶרֶץ גֹּשֶׁן
  choice: 让他们住在歌珊地
  rationale: 保留原文“住”和“歌珊地”的明确表述，也再现前后句的重复。
- source_word: וְאִם יָדַעְתָּ
  choice: 你若知道
  rationale: 按原文保留以约瑟所知为条件的句式，不擅自改成断言。
- source_word: אַנְשֵׁי חַיִל
  choice: 能干的人
  rationale: חַיִל 在这里侧重能力、才干和胜任程度；上下文是畜牧管理，并不必然含有军事勇武之意。
- source_word: וְשַׂמְתָּם שָׂרֵי מִקְנֶה
  choice: 就任命他们作主管，管理……牲畜
  rationale: שׂים 在职务语境中可译为“任命”，שָׂרֵי 表示负责人或主管；此译清楚传达管理职能。
- source_word: עַל אֲשֶׁר לִי
  choice: 管理我的牲畜
  rationale: “我所有的”在本句中承接前面的“牲畜”；汉语直接说“我的牲畜”简洁明确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文“在你面前”的意象，并以脚注说明其语用含义；用“能干的人”贴合畜牧管理语境，同时不抹去该词组较宽的语义范围。
