  text: וַ/יֹּאמְר֖וּ הֶחֱיִתָ֑/נוּ נִמְצָא חֵן֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י וְ/הָיִ֥ינוּ עֲבָדִ֖ים לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be slaves to Pharaoh.”
translation:
  language: zh_hans
  text: 他们说：“你使我们活下来。愿我们在我主眼前蒙恩；我们就作法老的奴隶。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 未逐字译出叙事连接词 וַ，以符合现代汉语叙事习惯；动词复数主语由“他们”明确表达。
- source_word: הֶחֱיִתָנוּ
  choice: 你救活了我们
  rationale: 使役形表达“使我们活下来、保全我们的性命”；“救活”保留使役意义，又不引入属灵救赎或军事拯救的含义。
- source_word: נִמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: 愿我们在我主眼前蒙恩
  rationale: 将未完成式理解为带祈愿意味的请求；保留“在……眼前蒙恩”这一希伯来语惯用表达及对约瑟的敬称“我主”。
- source_word: וְהָיִינוּ
  choice: 我们也愿作
  rationale: 在此理解为因蒙保全而作出的结果性承诺；“愿”比单纯未来时更自然地体现他们表示顺服的语气，同时不将其改成命令。
- source_word: עֲבָדִים לְפַרְעֹה
  choice: 法老的奴仆
  rationale: 此处处于以土地和生计换取隶属的经济背景，“奴仆”既表达受辖制、归属法老的身份，也符合庄重的现代汉语用语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我主”保留古代尊称的单数形式；“蒙恩”是现代读者仍可理解的正式表达。未设脚注，因为正文能够自然保留原文的祈愿语气和惯用说法。
