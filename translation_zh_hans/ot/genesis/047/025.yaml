revisions:
- from: 他们说：“你救活了我们。愿我们在我主眼前蒙恩，我们也愿作法老的奴仆。”
  to: 他们说：“你使我们活下来。愿我们在我主眼前蒙恩；我们就作法老的奴隶。”
  rationale: 修订使役动词和末句承诺的语气，并以更明确的身份用语反映经济奴役语境；保留原文对“我主”的敬称、祈愿式请求以及“在……眼前蒙恩”的意象。无需脚注，因为译文没有未能在正文中表达的必要歧义。
