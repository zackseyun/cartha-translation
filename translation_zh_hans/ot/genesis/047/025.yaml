review_pass:
  verdict: revise
  source_fidelity: “救活了我们”能够表达希伯来语使役动词“使……活着”，但“使我们活下来”在现代汉语中更自然、也更准确地体现保全性命。末句的“我们也愿作”把原文结果性的承诺弱化并改成额外的意愿；此处宜表达为随之作出的未来承诺。“奴仆”可理解，但在此以生计换取人身隶属的语境中，“奴隶”更清楚地传达 עֲבָדִים 的受束缚身份。
  naturalness: 修订后语序和搭配符合现代庄重普通话；“我主眼前蒙恩”保留原文敬称及惯用语，同时仍可理解。
  terminology: 保留“我主”以对应带第一人称后缀的敬称 אֲדֹנִי；以“奴隶”对应此经济依附语境中的 עֲבָדִים，不以较宽泛的“仆人”淡化其身份含义。
  issues:
  - severity: medium
    issue: “我们也愿作法老的奴仆”将结果性承诺译为额外的意愿。
    rationale: וְהָיִינוּ 在上下文中说明他们因获保全而承诺将成为法老的奴隶；“也愿”没有原文依据，且削弱“我们就会成为”的承诺性。
  - severity: low
    issue: “救活了我们”略显口语且不如“使我们活下来”贴合此处的保全生命。
    rationale: הֶחֱיִתָנוּ 是“使我们活着／保全我们性命”；“使我们活下来”是更自然准确的现代汉语表达。
  - severity: low
    issue: “奴仆”对受束缚身份的表达不够明确。
    rationale: 本段涉及以土地、牲畜和自身换取粮食，奴役性质突出；“奴隶”更直接对应此处 עֲבָדִים。
  revised_text: 他们说：“你使我们活下来。愿我们在我主眼前蒙恩；我们就作法老的奴隶。”
