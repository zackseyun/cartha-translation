base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: zh_hans
  text: 到收成的时候，你们要把五分之一交给法老；其余的五分之四[a]归你们，用作田里的种子，也供你们和你们家里的人食用，并供你们的孩子食用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“四只手”；这是表示份额的习语，指其余四份，也就是五分之四。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: 到收成的时候
  rationale: תְּבוּאָה可指土地的出产、收成；介词בְּ在此行政安排的语境中自然表达收成交纳之时。
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: 你们要把五分之一交给法老
  rationale: חֲמִישִׁית明确指五分之一；“交给”自然表达把规定份额付给法老。
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: 其余四份
  rationale: 字面为“四只手”，在此是份额习语；承接前述五分之一，所指是余下五份中的四份。正文按意义翻译，脚注保留原文形象。
- source_word: יִהְיֶה לָכֶם
  choice: 归你们
  rationale: 简洁表达这些出产被分配给百姓、由他们保有。
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: 用作田里的种子
  rationale: 介词לְ表达用途，指留下种粮供田地下一轮播种，而非强调种子的来源。
- source_word: וּלְאָכְלְכֶם
  choice: 供你们……食用
  rationale: 将源自动词אכל的形式按其用途自然译出，表示供他们自己吃。
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: 你们家里的人
  rationale: 关系短语在列举食用者的语境中指家中人员，不是房屋中的物品。
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: 并养活你们的孩子
  rationale: טַף通常指幼小的孩子，也可涵盖随属的幼小家眷；此处采用现代汉语自然且保留家庭意味的“孩子”。“养活”传达给他们食物吃的意思。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“其余四份”既与前面的“五分之一”连贯，也避免把希伯来语习语生硬直译为“四只手”；原文措辞则由脚注说明。后半句适度整合重复的食用表达，使中文自然，同时保留种粮、自用、家人和孩子这几项用途。
