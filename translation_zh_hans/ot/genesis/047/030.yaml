base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: zh_hans
  text: “我与祖先同眠后[a]，你要把我带出埃及，安葬在他们的墓地。”约瑟说：“我必照你的话去做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我与祖先同卧以后。”这是与死亡和安葬有关的希伯来惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: 我……同睡时
  rationale: שׁכב本义为“躺卧”，在此用于死亡与安葬的惯用表达。译作“同睡”保留希伯来语的意象；连接词按语境取时间意义，以“时”自然表达。
- source_word: עִם אֲבֹתַי
  choice: 与祖先
  rationale: אָבוֹת带第一人称后缀，在这里指先辈、祖先。现代汉语用“祖先”比直译“父辈”更自然，也符合族长安葬语境。
- source_word: וּנְשָׂאתַנִי
  choice: 你要把我带出
  rationale: נשא在此指搬运遗体；结合מִמִּצְרַיִם，译为“把我带出埃及”既清楚又不必额外明说遗体。
- source_word: וּקְבַרְתַּנִי
  choice: 葬
  rationale: קבר直接表示安葬；简洁译为“葬”符合中文表达。
- source_word: בִּקְבֻרָתָם
  choice: 在他们的墓地
  rationale: קְבֻרָה在此可指坟墓或安葬之处。“墓地”保留地点含义，不武断限定墓穴的具体形制。
- source_word: וַיֹּאמַר
  choice: 约瑟说
  rationale: 希伯来语只写“他说”，但中文为避免指代含混，按上下文明确主语为约瑟，未增加新的信息。
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: 我必……去做
  rationale: 独立代词אָנֹכִי带有一定强调。用“必”体现郑重承诺，并以“去做”使现代汉语自然。
- source_word: כִדְבָרֶךָ
  choice: 照你的话
  rationale: 字面为“按照你的话”。此译简明自然，也保留约瑟承诺依言办理的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“与祖先同睡”保留原文关于死亡的委婉意象；“墓地”避免将原文过度具体化为某一种墓葬形制。引号开头承接上一节中雅各的话。
