  text: וַ/יָּבֵ֤א יוֹסֵף֙ אֶת יַֽעֲקֹ֣ב אָבִ֔י/ו וַ/יַּֽעֲמִדֵ֖/הוּ לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: zh_hans
  text: 约瑟领他父亲雅各进去，让他站在法老面前[a]；雅各就为法老祝福[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使他站在法老面前”。
    reason: lexical_alternative
  - marker: b
    text: “祝福”可能包括正式说出的祝祷，并非仅指礼貌问安。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 领……进去
  rationale: 该词是בוא的使役形，表示约瑟使雅各进入法老所在之处；“领……进去”自然地保留了使役意味和觐见场景。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 第三人称阳性单数后缀指约瑟，直译为“他父亲”，现代汉语自然清楚。
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: 让他站在……面前
  rationale: עמד的使役形直指“使他站立”；此处采用“让他站在……面前”，既保留原文动作，也符合汉语表达。
- source_word: וַיְבָרֶךְ
  choice: 为……祝福
  rationale: ברך通常意为“祝福”。保留这一基本词义，不将雅各对法老的行动弱化为一般问候。
- source_word: פַרְעֹה
  choice: 法老
  rationale: 采用现代中文圣经及一般汉语中通行的埃及君王称号译法。
- source_word: וַ
  choice: ；……就
  rationale: 希伯来语叙事中的连续连接词推进动作；汉语以分号和“就”自然呈现顺承关系，避免机械重复“然后”。
theological_decisions:
- issue: 雅各对法老所作之事的含义
  choice: 雅各为法老祝福
  alternative: 雅各只是礼貌地向法老问安
  rationale: 动词ברך的通常含义是“祝福”。即使这里可能兼具正式致意的社交功能，也不应抹去族长向君王祝福所形成的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“领他父亲雅各进去”体现宫廷觐见的场景；正文保留“让他站在”这一具体动作，并用脚注说明其直译性质。“为法老祝福”在汉语中比“祝福法老”更清楚地表达雅各施行祝福的动作。
