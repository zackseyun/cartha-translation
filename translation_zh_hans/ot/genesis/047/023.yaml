review_pass:
  verdict: revise
  source_fidelity: “耕种”涵盖犁地、栽培等较宽泛的农业活动，未准确对应希伯来语 וּזְרַעְתֶּם（撒种、播种）。应在正文中直接译出“播种”，而不将核心词义留待脚注补足。其余部分忠实反映约瑟代表法老购得百姓及其土地、提供种子并作出后续指示的内容。
  naturalness: “看，今天我为法老买下了你们和你们的土地”自然清楚。“播种这片土地”在庄重的叙事语体中可通；以分号分隔供应种子与指示播种，也使汉语节奏更顺畅。
  terminology: “百姓”“法老”“土地”“种子”均符合现代标准汉语圣经叙事及本节行政、农业语境。“买下”恰当保留 קָנִיתִי 的购买／取得所有权含义，且不额外界定其法律性质。
  issues:
