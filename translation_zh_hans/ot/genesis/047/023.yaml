base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: zh_hans
  text: 约瑟对百姓说：“看，今天我为法老买下了你们和你们的土地。这里有种子给你们；你们要播种这片土地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性连续式推进情节；现代汉语通常无需另加“然后”，上下文已能表达先后关系。
- source_word: הָעָם
  choice: 百姓
  rationale: 这里指约瑟集体面对的埃及民众；“百姓”自然、庄重，也适合行政语境。
- source_word: הֵן
  choice: 看
  rationale: 保留该提示语气词引出郑重宣告的指示和强调作用，同时避免古雅的“看哪”。
- source_word: קָנִיתִי
  choice: 买下了
  rationale: קנה在此经济交易语境中直接表示购买、取得所有权；“买下”清楚保留交易性质。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 直接指百姓自身；不增译为“你们的人身”，以免加入原文没有明说的法律分类。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 直接表达该交易在当日完成。
- source_word: אַדְמַתְכֶם
  choice: 你们的土地
  rationale: 此处指百姓原有的农用土地；“土地”兼顾所有权和农业语境。
- source_word: לְפַרְעֹה
  choice: 为法老
  rationale: 介词לְ表示约瑟代表法老进行收购，即土地和百姓归法老所有。
- source_word: הֵא
  choice: 这里有
  rationale: 自然表达约瑟当场把种子交给百姓的指示意义。
- source_word: זֶרַע
  choice: 种子
  rationale: 指供播种之用的种粮；下文动词已明确其用途，无须扩译。
- source_word: וּזְרַעְתֶּם
  choice: 你们要耕种
  rationale: 该形式在这里承接所给种子，表达指示或命令；“要”保留其意志色彩，但“耕种”较宽，具体的“播种”另列脚注。
- source_word: הָאֲדָמָה
  choice: 这片土地
  rationale: 指刚才提到的土地；加“这片”使汉语指代自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保持约瑟宣告交易完成、随即提供种子并下达耕作指示的推进关系；不把“买下你们”弱化为一般性的“取得”，以保留原文在饥荒经济安排中的尖锐法律与社会含义。
