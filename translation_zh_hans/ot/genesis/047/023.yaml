    issue: 正文将 וּזְרַעְתֶּם 译为“耕种”，脚注才说明其具体指“撒种、播种”。
    rationale: 该动词的基本农业动作是播种，而“耕种”范围更广，可能包括翻耕、管理或栽培。最佳对等译文应在正文中保留“播种”，不以脚注替代正文的词义。
  - severity: low
    issue: 现有脚注以“或译‘在这片土地上播种’”呈现，而该表述实为对正文“耕种”的更准确释义，并非与原文同等的可选译法。
    rationale: 改正正文后，此脚注不再有必要；删除可避免制造并不存在的词义歧义，也消除悬置的脚注锚点。
  revised_text: 约瑟对百姓说：“看，今天我为法老买下了你们和你们的土地。这里有种子给你们；你们要播种这片土地。”
