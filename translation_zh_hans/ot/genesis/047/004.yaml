base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: zh_hans
  text: 他们对法老说：“我们来这地寄居[a]，因为您仆人的羊群没有草场，因为迦南地的饥荒十分严重。现在求您准许您的仆人住在歌珊地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”也可译作“以外来者的身份暂住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָגוּר
  choice: 寄居
  rationale: 该词表示以外来者或临时居民的身份居住，并不强调永久定居；“寄居”简洁保留了这一含义。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 此处指他们所在并向法老请求居住的埃及国土；“这地”符合当前对话语境，也自然承接“到……来”。
- source_word: מִרְעֶה
  choice: 草场
  rationale: 该名词指牲畜放牧之处；“草场”准确而自然。
- source_word: לַצֹּאן
  choice: 羊群
  rationale: צֹאן是小型家畜的集合称呼，主要包括绵羊和山羊；“羊群”是现代汉语中自然的概括表达。
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: 您仆人的
  rationale: 该短语表达所属关系，同时保留他们在法老面前自称“仆人”的谦恭语气。
- source_word: כָבֵד הָרָעָב
  choice: 饥荒十分严重
  rationale: כָבֵד字面为“沉重”，与“饥荒”搭配时表示程度严重；此译符合现代汉语习惯。
- source_word: יֵשְׁבוּ נָא
  choice: 现在求您准许……住
  rationale: 未完成式在此与נָא共同表达礼貌请求；“求您准许”自然传达请求语气，“住”不额外断定永久定居。
- source_word: עֲבָדֶיךָ
  choice: 您的仆人
  rationale: עבד可指奴隶或仆人，但此处是臣民在君王面前的谦称，“仆人”更符合宫廷对话语境。
- source_word: אֶרֶץ גֹּשֶׁן
  choice: 歌珊地
  rationale: 保留地名及其地域含义，是简明自然的汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“您”配合“您的仆人”，自然呈现他们面对法老时的恭敬口吻；脚注标在其所解释的“寄居”之后。
