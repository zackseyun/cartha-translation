revisions:
- from: 他们对法老说：“我们到这地来是要寄居[a]，因为迦南地的饥荒十分严重，您仆人的羊群没有草场。现在求您准许您的仆人住在歌珊地。”
  to: 他们对法老说：“我们来这地寄居[a]，因为您仆人的羊群没有草场，因为迦南地的饥荒十分严重。现在求您准许您的仆人住在歌珊地。”
  rationale: 恢复原文两个以“因为”引出的分句次序：羊群无草场是直接缘由，迦南地饥荒严重是其原因。同时将“到这地来是要寄居”简化为“来这地寄居”，更贴合לָגוּר所表达的来此作为寄居者居住，而不额外突出目的意味。脚注锚点及内容保留，准确说明该词的外来者、暂住含义。
