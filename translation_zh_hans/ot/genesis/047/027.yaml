base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: zh_hans
  text: '以色列定居在埃及地的歌珊地。他们在那里取得了产业[a]，生养繁衍，人数大大增多。


    [a] 或译“在那里站稳了脚跟”。原文动词可指取得地业或在当地牢固定居。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在那里站稳了脚跟”。原文动词可指取得地业或在当地牢固定居。
    reason: 保留וַיֵּאָחֲזוּ בָהּ在取得产业与在当地稳固立足之间的词义可能；锚定于“产业”，使脚注对应其所解释的动词。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 定居
  rationale: ישׁב在此不只是暂时居住，也含安顿下来的意思；“定居”自然地表达了稳定居留。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文用单数名称“以色列”，随后转用复数动词指其家属或后裔；保留这一称呼和数的转换，不改成“雅各”或“以色列人”。
- source_word: בְּאֶרֶץ מִצְרַיִם בְּאֶרֶץ גֹּשֶׁן
  choice: 在埃及地的歌珊地
  rationale: 将歌珊地自然地表达为埃及境内的特定地区，同时保留两处“地”的地域意味。
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: 他们在那里取得了产业
  rationale: אחז的Niphal形态在此可表达取得地业或牢固立足；正文采用符合上下文的产业含义，并以脚注保留“立稳了根”的另一可能。
- source_word: וַיִּפְרוּ
  choice: 生养繁衍
  rationale: 保留创世记中反复出现的生育、结果实主题，并采用现代汉语中清楚自然的表达。
- source_word: וַיִּרְבּוּ מְאֹד
  choice: 人数大大增多
  rationale: 明确表达人口显著增长，也传达מְאֹד的强烈程度。
theological_decisions:
- issue: “以色列”的代表性含义与单复数转换
  choice: 正文保留“以色列”，随后按原文用“他们”指其家属或后裔。
  alternative: 译作“以色列人”或“雅各”，使全句的数一致。
  rationale: 原文先以单数的“以色列”为主语，继而使用复数动词。保留这种转换，能呈现族长代表其约民家族的叙事张力，而不替原文消除歧义。
- issue: וַיֵּאָחֲזוּ בָהּ的产业与定居含义
  choice: 正文译为“取得了产业”，脚注保留“立稳了根”。
  alternative: 正文译为“在那里牢固定居”或近似字面的“在那里被持住”。
  rationale: 上下文既涉及居住，也涉及家族兴旺；产业解释很合适，但希伯来动词仍可能侧重牢固定居，因此以脚注保留其词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定居”“取得了产业”“人数大大增多”清楚自然；保留“以色列”到“他们”的转换，并用脚注呈现关键动词的真实歧义。
