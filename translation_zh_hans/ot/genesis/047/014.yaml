base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: zh_hans
  text: 约瑟收集了埃及地和迦南地所有的银子[a]，就是他们买粮所付的银子；约瑟把银子带进法老的府中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“钱财”。希伯来文直译为“银子”，因为当时银子用作支付媒介。
    reason: lexical_alternative
  - marker: b
    text: “法老的府中”既可指法老的宫室，也可广指法老的王室或国库。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: 收集了
  rationale: לָקַט表示聚集、收集；这里指约瑟从多次粮食交易中汇集所得款项。“收集”自然地保留了逐步积聚的含义。
- source_word: כָּל הַכֶּסֶף
  choice: 所有……银子
  rationale: כֶּסֶף本义为“银子”，也可指以银为支付媒介的钱财。正文保留具体的“银子”，脚注说明其货币功能。
- source_word: הַנִּמְצָא
  choice: 现有的
  rationale: 该分词可指“被找到的”或“存在、可得的”。在本段经济语境中，“现有的”比直译“被找到的”更自然，也保留两地可供支付的钱财这一含义。
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: 在埃及地和迦南地
  rationale: 保留原文重复的“地”，突出两个地区，并符合《创世记》的地理叙事语体。
- source_word: בַּשֶּׁבֶר אֲשֶׁר הֵם שֹׁבְרִים
  choice: 就是众人买粮所付的银子
  rationale: שֶׁבֶר在约瑟叙事中指售卖的粮食，שׁבר在此则是“买粮”。此译明确交易关系，并以“众人”自然表达复数代词הֵם。
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: 把这些银子带进法老的府中
  rationale: 方向词尾־ָה表示进入。“府中”比“家中”更符合君王语境，同时不直接限定为私人住所、王宫建筑或国库；脚注保留其范围上的可能性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“银子”保留原文的具体意象，“现有的”避免生硬的被动表达；分号呈现原文两个连续动作之间的紧密关系。
