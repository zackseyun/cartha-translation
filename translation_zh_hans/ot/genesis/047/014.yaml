revisions:
- from: 约瑟收集了埃及地和迦南地所有现有的银子[a]，就是众人买粮所付的银子；约瑟把这些银子带进法老的府中[b]。
  to: 约瑟收集了埃及地和迦南地所有的银子[a]，就是他们买粮所付的银子；约瑟把银子带进法老的府中[b]。
  rationale: 修订删除“现有的”，避免对“被找到／存在的”作过度经济性限定；将“众人”改为原文对应的“他们”，并保留“买粮所付的银子”这一在中文中清楚自然的交易表达。第二分句将“这些银子”简化为“银子”，更贴近原文重复名词的叙述方式，且不改变指称。
