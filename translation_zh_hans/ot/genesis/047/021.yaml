base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: zh_hans
  text: 至于百姓，他把他们迁到城邑[a]，从埃及疆域的一端直到另一端。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把他们转移到城邑”。有些译本根据不同的文本理解，将这里译为约瑟使百姓成为奴仆；但此处的希伯来文本更直接地说到迁移百姓。
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: 百姓
  rationale: 这里是集合名词，指受约瑟政策影响的埃及居民；“百姓”自然、庄重，也保留原文的整体指称。
- source_word: הֶעֱבִיר אֹתוֹ
  choice: 把他们迁到
  rationale: עבר的使役式在此表示使人迁移或转移。原文用集合单数代词指代“百姓”，现代汉语按实际所指译作复数“他们”。“迁到”清楚表达人口迁移，又不额外引入奴役之意。
- source_word: לֶעָרִים
  choice: 各城
  rationale: 介词ל在此表方向或目的地；“迁到各城”符合现代汉语习惯，并保留人口被安置到城市中的基本意思。
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: 从埃及疆域的一端直到另一端
  rationale: גְבוּל在此宜理解为领土、疆域，而不只是边界线；“从……一端直到另一端”保留原文表示遍及全境的首尾并举说法。
theological_decisions:
- issue: 约瑟对埃及百姓所采取的行动
  choice: 他把他们迁到各城
  alternative: 他使他们成为奴仆
  rationale: 马所拉文本的动词最直接表示使人经过、迁移或转移，并未明说使人服役。另一译法反映不同的文本理解或古代文本传统；正文依照所给WLC文本保留迁移之意，不把奴役的含义加入正文。
- issue: לֶעָרִים所表示的迁移方式
  choice: 迁到各城
  alternative: 使他们逐城迁移
  rationale: 介词短语可引发对迁移安排细节的不同理解，但原文没有明确说明是“从一城到另一城”。正文采用最直接的目的地理解，同时不补充迁移的具体行政方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“至于百姓”承接上下文的对比结构；“疆域”准确表达领土范围，避免把גְבוּל误解为单纯的边界线。
