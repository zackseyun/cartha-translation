base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: zh_hans
  text: 法老问雅各：“你一生的年日有多少？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“你生命之年的日子有多少？”即以正式的希伯来语表达询问雅各的年龄。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 问
  rationale: 该动词本义为“说”，但后接直接问句，现代汉语用“问”更自然，也准确表达此处言语行为；句首叙事连接词不必机械译出。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代中文圣经传统中通行的埃及君王称号。
- source_word: אֶל יַעֲקֹב
  choice: 雅各
  rationale: 介词标明说话对象；汉语“问雅各”已自然包含“对……说”的关系。人名采用通行译名“雅各”。
- source_word: כַּמָּה
  choice: 有多少
  rationale: 表示数量疑问，与后面的“年日”搭配，既准确又符合现代汉语表达。
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: 你一生的年日
  rationale: 保留原文以“日”和“年”层叠表达寿数的正式希伯来语习惯，同时调整为自然、庄重的汉语词序；“一生”对应此处 חַיֶּיךָ 的生命时日含义。
