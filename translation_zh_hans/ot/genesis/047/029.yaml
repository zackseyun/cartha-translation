  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: zh_hans
  text: 以色列的死期近了，他就把儿子约瑟叫来，对他说：“我若在你眼中蒙恩，请把手放在我大腿底下[a]，以慈爱和信实待我[b]。请不要把我葬在埃及。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把手放在我大腿底下”是族长叙事中郑重起誓时所用的动作；参见《创世记》24:2。
    reason: cultural_note
  - marker: b
    text: “慈爱和信实”也可译为“忠诚而可靠的厚待”；这组希伯来词强调坚定的爱、忠诚与可靠。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: 以色列临终的日子近了
  rationale: 保留原文“日子临近”的意象，同时用现代汉语清楚表达死亡将近；“以色列”按原文保留，不改作“雅各”。
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: 儿子约瑟
  rationale: 采用现代中文圣经与普通读者熟悉的标准译名“约瑟”。
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 我若在你眼中蒙恩
  rationale: 保留希伯来语惯用表达及其恳求语气；“蒙恩”在庄重现代汉语中自然且准确。
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: 请把手放在我大腿底下
  rationale: 直译这一族长叙事中的起誓动作，不在正文中将具体形象改写为抽象的“向我起誓”；脚注补充文化背景。
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: 以慈爱和信实待我
  rationale: “待我”自然表达原文“向我行”；“慈爱和信实”保留 חֶסֶד וֶאֱמֶת 的并列结构及忠诚、可靠的关系性内涵，而不额外加入原文没有明说的“盟约”。
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: 请不要把我葬在埃及
  rationale: 准确传达带 נָא 的恳求式否定命令，地名采用标准中文形式。
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת 在家族誓约语境中的表达
  choice: 慈爱和信实
  alternative: 忠诚可靠地待我；以坚定的爱和信实待我
  rationale: 该词组包含忠贞之爱与可信可靠的行动。正文保留两个词的张力，不将 חֶסֶד 限定为某一套特定的“盟约”术语，也不把二词合并成单一抽象概念。
- issue: “把手放在大腿底下”的起誓动作
  choice: 正文按具体动作翻译，并用脚注说明
  alternative: 向我起誓
  rationale: 直译保存叙事的文化与身体意象；注释帮助现代读者理解，而不在正文中消解原文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“临终的日子近了”略带原文气息，但在上下文中清楚自然；两处“请”保留以色列恳切请求的语气。
