base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: zh_hans
  text: 雅各对法老说：“我寄居[a]的年日是一百三十年。我一生的年日又少又苦，也没有达到我祖先寄居时一生的年日。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”也可译作“旅居”。这里指作为外来者或临时居民生活。原文在本节反复使用“日子／年岁”的表达；末句直译可作：“没有达到我祖先在他们寄居的日子中生命之年的日子。”
    reason: 说明מְגוּרַי／מְגוּרֵיהֶם的语义，并以可读的方式交代原文末句重复的“日子／年岁”结构。
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: 我寄居 / 我祖先寄居在世
  rationale: 该词指作为外来者或临时居民寄居，而非一般居住。“寄居”保留族长作为异乡居民的历史处境；末句补出“在世”，使现代汉语自然，同时仍以“寄居”为核心。
- source_word: יְמֵי שְׁנֵי
  choice: 年日
  rationale: 希伯来语叠用“日子”和“年岁”，是庄重地指一生年岁的表达。“年日”在中文圣经语体中既简洁又能保留这种重复质感。
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 一百三十年
  rationale: 按现代标准汉语表达数字，准确传达原文。
- source_word: מְעַט וְרָעִים
  choice: 又少又苦
  rationale: מְעַט 指年岁相对少；רָעִים 在此描述人生境遇艰苦多难，并非日子具有道德上的邪恶。“又少又苦”自然、凝练，也保留并列强调。
- source_word: חַיַּי / חַיֵּי אֲבֹתַי
  choice: 我一生 / 我祖先……的年日
  rationale: 这些结构表示生命或寿数。“一生”和“年日”符合现代汉语；אֲבֹתַי 在此指亚伯拉罕、以撒等先祖，译作“祖先”比“父亲们”清楚自然。
- source_word: הִשִּׂיגוּ
  choice: 还没有达到
  rationale: 该动词可指达到、赶上。这里比较雅各与祖先的寿数，“达到”既贴近原义，也不把比较强化为完全相等。
theological_decisions:
- issue: 族长自称寄居者
  choice: 寄居
  alternative: 旅居；作客；人生旅程
  rationale: 原文首先描述族长作为外来居民的现实身份，并未明说属灵的朝圣旅程；“寄居”保留其历史与神学张力，避免过度灵意化。
- issue: רָעִים 对雅各人生的评价
  choice: 苦
  alternative: 恶；艰难
  rationale: 这里评价的是雅各经历的困苦，而非宣称其日子在道德上邪恶。“苦”准确传达逆境，也保留他对一生的沉重判断。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“年日”保留原文反复出现的“日子—年岁”语感，但避免逐字堆叠造成难懂；句末脚注标记与整节相关，置于引号内末尾。
