  text: וַ/יִּ֨קֶן יוֹסֵ֜ף אֶת כָּל אַדְמַ֤ת מִצְרַ֨יִם֙ לְ/פַרְעֹ֔ה כִּֽי מָכְר֤וּ מִצְרַ֨יִם֙ אִ֣ישׁ שָׂדֵ֔/הוּ כִּֽי חָזַ֥ק עֲלֵ/הֶ֖ם הָ/רָעָ֑ב וַ/תְּהִ֥י הָ/אָ֖רֶץ לְ/פַרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: zh_hans
  text: 于是，约瑟为法老买下了埃及所有的土地[a]，因为饥荒重压着埃及人[b]，他们各自都卖了自己的田地；土地就归了法老。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约瑟为法老取得了埃及所有的土地。”
    reason: “买下”所译的希伯来语可较宽泛地表示“取得、购得”，但本节出售田地的语境明确带有交易含义。
  - marker: b
    text: 直译：“因为饥荒在他们身上强盛。”
    reason: 原文以“强盛”描述饥荒压在人们身上的严重程度；正文保留其压力意象，脚注注明字面表达。
lexical_decisions:
- source_word: וַיִּקֶן
  choice: 买下了
  rationale: קנה在此处与下文“卖了”相呼应，明确指商业购买；“买下”自然表达交易及所有权转移的结果。
- source_word: כָּל אַדְמַת מִצְרַיִם
  choice: 埃及所有的土地
  rationale: אַדְמָה在此指可作为产业出售的土地，而非单指泥土；“所有的”保留כָּל的完整范围。
- source_word: לְפַרְעֹה
  choice: 为法老
  rationale: 介词לְ在这里表示购买行为的受益者和最终取得土地者，表明约瑟代表法老进行收购。
- source_word: מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: 埃及人……各自都卖了自己的田地
  rationale: 原文以集合名词“埃及人”配合分配用语אִישׁ及单数“他的田地”；“各自”保留逐一出售的含义。
- source_word: שָׂדֵהוּ
  choice: 自己的田地
  rationale: שָׂדֶה指田地或耕作地块；在分配结构中译作“自己的田地”符合现代汉语。
- source_word: כִּי חָזַק עֲלֵהֶם הָרָעָב
  choice: 因为饥荒重压着埃及人
  rationale: חזק字面表示“强盛、强烈”，与עַל连用描述饥荒对人的强大压力；“重压着”保留原文意象，同时符合现代汉语。
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: 土地就归了法老
  rationale: 该分句陈述交易造成的所有权结果；“归了法老”简洁自然，并保留状态转变。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“买下”“田地”“归了法老”均为普通读者易懂的产权用语；以“重压着”传达希伯来语的具体意象，避免把原文仅平化为“非常严重”。
