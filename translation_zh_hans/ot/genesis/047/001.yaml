base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: zh_hans
  text: 约瑟进去禀告法老说：“我父亲和我的兄弟，连同他们的羊群、牛群和一切所有的，都已经从迦南地来了。看哪[a]，他们如今就在歌珊地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“他们现在就在歌珊地”或“他们就在这里，在歌珊地”。
    reason: 原文הִנָּם兼有引人注意和指示当前所在的作用；不同中文表达分别侧重其提示语气或方位意味。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 进去
  rationale: בוא可表示“来、去、进入”；在朝见法老的宫廷语境中，“进去”自然表达约瑟进入法老面前。
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: 禀告法老说
  rationale: 保留“报告”与引出直接引语的双重作用；“禀告”符合臣下面见君王的语境，又不显得过分古奥。
- source_word: אָבִי וְאַחַי
  choice: 我父亲和我的兄弟
  rationale: 直接表达两个带第一人称单数后缀的亲属称谓，并准确指出男性兄弟。
- source_word: וְצֹאנָם וּבְקָרָם
  choice: 连同他们的羊群、牛群
  rationale: צאן泛指羊群等小型牲畜，בקר指牛群等大型牲畜；中文“羊群、牛群”自然保留两类牲畜的区别。“连同”表明这些也随家人到来。
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: 和一切所有的
  rationale: 贴近希伯来语“一切属于他们的”，同时避免在原文未限定时擅自缩窄为财物。
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: 都已经从迦南地来了
  rationale: 完成体在此强调到达已经发生且结果延续到当前；“已经……来了”自然呈现这一现时相关性。“都”统摄前列的人与牲畜财物。
- source_word: וְהִנָּם
  choice: 看哪，他们如今就在
  rationale: הנה带后缀用于引人注意其当前所在；“看哪”保留提示语气，“如今就在”表达当前状态和指示意味。
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: 歌珊地
  rationale: 保留原文אֶרֶץ的地域表达；“歌珊地”是自然且通行的中文地名形式。
theological_decisions: []
