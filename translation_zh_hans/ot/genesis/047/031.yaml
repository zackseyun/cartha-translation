  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: zh_hans
  text: 他说：“你要向我起誓。”约瑟就向他起了誓。于是以色列在床头俯身。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列在杖头俯身。”希伯来文的辅音也可这样读；七十士译本以及《希伯来书》11:21反映了这一读法。
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: 你要向我起誓
  rationale: 以自然、直接的现代汉语表达誓言公式，同时保留命令语气和“向我”的关系指向。
- source_word: וַיִּשָּׁבַע לוֹ
  choice: 约瑟就向他起了誓
  rationale: 沿用“起誓”以保持词汇呼应；根据紧接的上文明确主语为约瑟，使汉语叙述自然，而“向他”保留原文的间接宾语。
- source_word: וַיִּשְׁתַּחוּ
  choice: 俯身下拜
  rationale: 该动词可表示俯伏、下拜或敬拜；这里未明说下拜的对象，因此用描述身体动作的“俯身下拜”，不在正文中擅自断定为向神敬拜。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留希伯来文本在此使用的名字，不改作“雅各”。
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: 在床头
  rationale: 马所拉读音将 הַמִּטָּה 读作“床”；“在床头”是自然的现代汉语空间表达，也符合本段年老体弱的语境。
theological_decisions:
- issue: 马所拉读本的“床”与七十士译本及《希伯来书》11:21所反映的“杖”之间存在文本读取差异。
  choice: 正文采用“床头”
  alternative: “杖头”
  rationale: 《创世记》正文以现存马所拉希伯来文本的标音“床”为准；但同一辅音形式可读作“杖”，且这一读法见于七十士译本并在《希伯来书》11:21中具有正典意义，因此在脚注中保留，不消除这项张力。
- issue: וַיִּשְׁתַּחוּ 在此是一般下拜还是明确的敬拜。
  choice: 俯身下拜
  alternative: 敬拜
  rationale: 原文没有明说动作所指向的对象；采用身体动作的表述，既不排除敬拜含义，也不把该含义强加进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“你要向我起誓”保留直接要求；“俯身下拜”兼顾动作性与语义开放性。脚注标记置于相关分句之后，以清楚表明异读涉及“床头”。
