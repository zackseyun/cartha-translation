  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: zh_hans
  text: 约瑟从他的兄弟中选了五个人，带他们到法老面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他兄弟中最边上的人中”；也有译作“从他兄弟中最出众的人中”。希伯来语字面含有“从……的末端／边缘”的意思；这里很可能表示约瑟从众兄弟中选出五人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה אֶחָיו
  choice: 从他的兄弟中
  rationale: מִקְצֵה 字面涉及“从末端/边缘”，但与“他的兄弟”连用时，在本语境中最自然地表达从整体中取出一部分。译作“从他的兄弟中”清楚传达这一部分义，同时以脚注保留其他可能理解。
- source_word: לָקַח
  choice: 选了
  rationale: לָקַח 基本义为“拿、取”；这里是从众兄弟中取五人，现代汉语用“选了”更自然，并准确体现语境中的选取动作。
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: 五个人
  rationale: 直译为“五个男人/五人”。所指已由“他的兄弟”限定，译作“五个人”符合现代汉语叙事习惯。
- source_word: וַיַּצִּגֵם
  choice: 带他们到……面前
  rationale: 该使役形可表示使人站在、置于或呈到某人面前。此处为觐见法老的宫廷场景，“带他们到……面前”自然表达将他们引见并安置在法老面前的动作。
- source_word: לִפְנֵי פַרְעֹה
  choice: 法老面前
  rationale: לִפְנֵי 表示“在……面前/在……面前出现”，此处译为“法老面前”简洁准确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“选了”结合上下文表达 לָקַח 的实际作用；“带他们到法老面前”自然呈现正式引见的场景。脚注保留 מִקְצֵה 的字面意象及传统上的另一种理解，避免在正文中把词义歧义完全消解。
