  text: Then Pharaoh said to Joseph[a], “Your father and your brothers have come to you.”
translation:
  language: zh_hans
  text: 于是，法老对约瑟说[a]：“你父亲和你的兄弟们已经来到你这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在“说”后另有“说/说道”（לֵאמֹר）以引出下文；较直译可作：“于是，法老对约瑟说，说：‘你父亲和你的兄弟们已经来到你这里。’”现代汉语通常省略这一重复的引语引介语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 叙事性连续式推动情节发展；“于是”在现代汉语中自然表达前后相承的作用。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 现代中文圣经及一般汉语对埃及君王称号的通行译法。
- source_word: אֶל יוֹסֵף
  choice: 对约瑟
  rationale: 介词标明说话对象；汉语用“对……说”最自然。
- source_word: לֵאמֹר
  choice: 不在正文中另译
  rationale: 该词在希伯来语中用于引出直接引语；现代汉语在“对……说”后再译“说道”显得重复，其形式对应保留于脚注。
- source_word: אָבִיךָ
  choice: 你父亲
  rationale: 准确保留对约瑟使用的第二人称单数领属关系。
- source_word: וְאַחֶיךָ
  choice: 和你的兄弟们
  rationale: אָח 在此指约瑟的男性同胞；不泛化为“家人”。
- source_word: בָּאוּ
  choice: 都到……来了
  rationale: 完成式陈述已经发生且与当前场景相关的到来；“来了”自然体现当前相关性，“都”也符合复数主语在汉语中的表达。
- source_word: אֵלֶיךָ
  choice: 到你这里
  rationale: 表达朝向约瑟的移动；“这里”在汉语对话中自然呈现以听者所在处为终点，但不额外指定具体地点。
