  source_fidelity: 译文准确传达了交出牲畜、以牲畜交换供给以及钱财耗尽的情境。不过，希伯来文的 אִם 基本义为条件词“如果”；虽可按上下文带有“既然”的原因意味，正文采用“既然”会收窄原文仍保有的条件表达。另，“食物”是由紧邻上下文补足，并非本节明说，宜以脚注标示。
  naturalness: “交出来”“牲畜”“银钱用尽”均属自然、庄重的现代汉语。调整为条件分句前置后，交易关系清晰，语序也更符合现代汉语。
  terminology: “牲畜”准确对应 מִקְנֶה；“银钱”恰当地保留 כסף 在古代货币语境的含义。“粮食”合乎上文求粮的语境，但须注明为上下文补足。
