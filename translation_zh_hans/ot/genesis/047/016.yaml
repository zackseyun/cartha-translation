base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: zh_hans
  text: 约瑟说：“把你们的牲畜交出来；如果银钱用尽了，我就给你们粮食[a]，换取你们的牲畜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文未明说“粮食”；此处按紧邻上下文补足。
    reason: 原文省略受词；为使中文句子完整而作的上下文补足。
lexical_decisions:
- source_word: הָבוּ
  choice: 交出来
  rationale: 该复数祈使式在此要求百姓交付财产；“交出来”比单纯的“带来”更能自然表达交易中的移交，同时不超出原文语义。
- source_word: מִקְנֵיכֶם
  choice: 你们的牲畜
  rationale: מִקְנֶה泛指作为财产饲养的牲畜，并不限于牛；“牲畜”是准确而自然的现代汉语统称。
- source_word: וְאֶתְּנָה לָכֶם
  choice: 我就用食物换取
  rationale: 原文直译为“我就给你们”，受词省略；紧接前文灾民求粮的语境，所给的是食物。中文若完全省略受词会显得残缺，因此在正文补出“食物”。
- source_word: בְּמִקְנֵיכֶם
  choice: 换取你们的牲畜
  rationale: 介词בְּ在这里表达交换的凭借或代价；“换取”清楚呈现约瑟以粮食交换牲畜的交易关系。
- source_word: אִם
  choice: 既然
  rationale: אִם通常可译“如果”，但此处银钱耗尽是已经陈明的事实，也是改用牲畜交易的理由，故采用说明原因的“既然”。
- source_word: אָפֵס כָּסֶף
  choice: 银钱已经用尽
  rationale: אָפֵס表示耗尽、不复存在；“已经用尽”准确表达钱财枯竭，且与古代交易语境中的“银钱”搭配自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“银钱”保留古代以银作为支付手段的时代色彩；句式略作整合，使省略受词和交换关系在中文中清楚自然。
