base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: zh_hans
  text: 埃及地和迦南地的钱都用完了[a]。埃及众人[b]都来见约瑟，说：“请给我们粮食[c]！我们为什么要死在你面前呢？因为钱已经没有了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “钱”也可译作“银子”。希伯来语כֶּסֶף可指银子，也可指作为支付手段的钱。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“全埃及都来见约瑟。”这里以“埃及”代指埃及人。
    reason: lexical_alternative
  - marker: c
    text: “粮食”原文为“饼”，在这里可泛指饥荒期间维生的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם
  choice: 都用完了
  rationale: תמם在此表示耗尽、告罄；“用完了”自然地传达钱财因持续购粮而耗尽。
- source_word: הַכֶּסֶף
  choice: 钱
  rationale: כֶּסֶף既可指“银子”，也可指“钱”；饥荒期间买卖粮食的语境以“钱”最贴切，同时用脚注保留字面可能。
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: 埃及地和迦南地的钱
  rationale: 希伯来语介词מִן与“地”连用，描写钱财从两地耗尽；汉语以所属结构表达更自然。
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: 埃及众人都来
  rationale: 原文直译为“全埃及都来”，是以地域代指居民；正文明确为当地众人，并以脚注保留原文表达。
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: 请给我们粮食
  rationale: הָבָה在此构成急切请求；לֶחֶם本义为“饼、食物”，饥荒语境中泛指维生的粮食。“粮食”比“饼”更符合现代汉语语境。
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: 我们为什么要死在你面前呢
  rationale: 保留反问的急迫语气；נֶגְדֶּךָ直指在约瑟面前、当着他的面，并不增补“眼看着”等解释。
- source_word: כִּי אָפֵס כָּסֶף
  choice: 钱已经没有了
  rationale: אָפֵס表示不复存在、已经耗尽；“已经没有了”清楚说明众人求粮的原因。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“请给我们粮食”体现恳求的急迫感；后两句依照汉语因果与话语节奏排列，将“钱已经没有了”置于反问之前，语义关系清楚，但不改变原文主张。所有脚注标记均置于相应正文词语之后。
