base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: zh_hans
  text: 约瑟就把这定为一条关于埃及土地的条例，一直沿用至今：五分之一归法老。[a]唯独祭司的土地没有归法老所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “五分之一”即百分之二十。
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ לְחֹק
  choice: 把这定为……条例
  rationale: שׂוּם与לְחֹק连用，表示把先前所述的安排确立为固定条例；“这”自然承接上一节的五分之一制度。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 沿用至今
  rationale: 这一惯用语表明条例持续有效直到叙述者所处的时代；“沿用至今”在现代汉语中自然地表达其延续性。
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: 埃及土地的
  rationale: 此处עַל界定条例所适用的范围。“埃及土地的条例”简洁表达该条例关乎并适用于埃及的土地。
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: 五分之一归法老
  rationale: 这一简短结构说明条例的内容：收成的五分之一交归法老；译文保留法老作为该份额接受者的关系。
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: 唯独祭司的土地
  rationale: רַק与לְבַדָּם共同加强排除和例外的语气；“唯独”可自然承载这一强调，避免汉语中重复使用“只有……单独”。
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: 没有归法老所有
  rationale: היה + ל在此描述所有权的结果；结合前文土地转归法老的叙事，“没有归法老所有”既准确又自然。
theological_decisions: []
