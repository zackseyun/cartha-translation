base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: zh_hans
  text: 那一年结束后，第二年他们来见他，对他说：“我们不向我主隐瞒：钱[a]已经用尽，牲畜也已经归我主了。在我主面前，除了我们的身体[b]和田地，什么也没有剩下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “钱”原文作“银子”；希伯来文常用“银子”表示钱财。
    reason: lexical_alternative
  - marker: b
    text: 或译“我们本人”。原文直译为“我们的身体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: 那一年结束后
  rationale: תמם表示完结、结束；译文保留“那一年”的指示意义，并用自然的汉语时间从句衔接下文。
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: 第二年
  rationale: 按原文保留“第二年”，不直接改写为“次年”，以免消除希伯来文的明确序数表达。
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: 我们不向我主隐瞒
  rationale: כחד的加强词干在此意为隐藏、隐瞒；“我主”保留原文单数第一人称后缀和恭敬称呼。
- source_word: תַּם הַכֶּסֶף
  choice: 钱已经用尽
  rationale: תַּם在此指耗尽；כֶּסֶף字面为“银子”，但在语境中用作支付手段，译为“钱”更符合现代汉语。
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: 牲畜也已经归我主了
  rationale: מִקְנֵה הַבְּהֵמָה指作为财产的牲畜；אֶל אֲדֹנִי在上下文中表示牲畜已转归约瑟掌有。
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: 在我主面前……什么也没有剩下
  rationale: 保留לִפְנֵי“在……面前”的意象，同时用汉语否定结构自然表达“没有剩下”。
- source_word: בִּלְתִּי אִם גְּוִיָּתֵנוּ וְאַדְמָתֵנוּ
  choice: 除了我们的身体和田地
  rationale: בִּלְתִּי אִם构成例外表达；גְּוִיָּה在此指活人的身体或本人，译作“身体”保留原文具体性；אַדְמָה在经济语境中译作“田地”。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“第二年”“我主”“在我主面前”等原文表达，同时避免生硬直译；两处脚注标记均放在其实际说明的词语之后。
