  text: אֵ֚לֶּה תּוֹלְדֹ֣ת שֵׁ֔ם שֵׁ֚ם בֶּן מְאַ֣ת שָׁנָ֔ה וַ/יּ֖וֹלֶד אֶת אַרְפַּכְשָׁ֑ד שְׁנָתַ֖יִם אַחַ֥ר הַ/מַּבּֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: zh_hans
  text: 以下是闪的后代。闪一百岁时，生了亚珥帕革沙得[a]；那是在洪水过后两年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚珥帕革沙得”按希伯来语名字音译；传统中文译本多译作“亚法撒”，后者承袭了较传统的名称形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת שֵׁם
  choice: 以下是闪的后代
  rationale: 这是《创世记》中反复出现的谱系结构用语。译作“以下是……的后代”，既保留 תּוֹלְדֹת 所指的后代、世系含义，也自然地发挥篇章标题的作用。
- source_word: שֵׁם
  choice: 闪
  rationale: 采用现代中文圣经读者熟悉的希伯来人名译法。
- source_word: בֶּן מְאַת שָׁנָה
  choice: 一百岁时
  rationale: 希伯来语直译为“一百岁之子”，是表达年龄的惯用语；中文用“一百岁时”既自然，又清楚说明生子时的年龄。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 使役形 ילד 在父系家谱中表示男子生育、成为某人的父亲。中文家谱语境中“生了”简洁自然，并未额外断定经文未说明的世代间隔问题。
- source_word: אַרְפַּכְשָׁד
  choice: 亚珥帕革沙得
  rationale: 按希伯来语 Arpakhshad 较直接地音译，避免以希腊语形式为主要依据；传统中文名称另以脚注保留。
- source_word: שְׁנָתַיִם אַחַר הַמַּבּוּל
  choice: 那是在洪水过后两年
  rationale: 准确表达双数“两年”及时间关系；以“那是在”明确该时间说明修饰亚珥帕革沙得的出生。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以下是……的后代”保留《创世记》家谱标题的固定功能；句中用分号分开年龄陈述与洪水后的时间定位。
