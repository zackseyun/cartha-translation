  text: Peleg lived thirty years and fathered Reu.
translation:
  language: zh_hans
  text: 法勒活到三十岁，生了拉吴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在家谱公式中，חיה 后接年数并衔接生子事件，表示当事人活到该年龄；现代汉语用“活到”自然清楚。
- source_word: פֶלֶג
  choice: 法勒
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: 三十岁
  rationale: 希伯来文直译为“三十年”，在此作年龄表达；现代汉语以“三十岁”最自然，并未改变其含义。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 在男性家谱语境中，ילד 的使役形式表示生育、成为某人的父亲；“生了”简洁自然，并由主语明确父系关系。
- source_word: אֶת
  choice: 不译
  rationale: 这是希伯来语确定直接宾语标记，现代汉语无须对应词。
- source_word: רְעוּ
  choice: 拉吴
  rationale: 采用中文圣经传统中通行的人名译法。
