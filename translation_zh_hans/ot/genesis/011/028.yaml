  text: וַ/יָּ֣מָת הָרָ֔ן עַל פְּנֵ֖י תֶּ֣רַח אָבִ֑י/ו בְּ/אֶ֥רֶץ מוֹלַדְתּ֖/וֹ בְּ/א֥וּר כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: zh_hans
  text: 哈兰死在他父亲他拉面前，在他的出生之地——迦勒底人的吾珥。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死
  rationale: 该叙事性动词形式直接陈述过去发生的事件；现代汉语用“死”简洁自然。
- source_word: עַל־פְּנֵי
  choice: 在……面前
  rationale: 保留希伯来语具体表达及其可能的现场含义，不在正文中把它单一解释为时间上的“先于”；相关时间含义收入脚注。
- source_word: תֶּרַח אָבִיו
  choice: 他父亲他拉
  rationale: 明确他拉是哈兰的父亲，并采用自然的现代汉语亲属称谓次序。
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: 在他的出生地
  rationale: מוֹלֶדֶת在这里指本乡、出生之地；“出生地”清楚简练，适合现代汉语。
- source_word: בְּאוּר כַּשְׂדִּים
  choice: 迦勒底人的吾珥
  rationale: 按地名和族名处理，表达吾珥与迦勒底人的关联，同时沿用通行的中文圣经专名。
theological_decisions:
- issue: עַל־פְּנֵי所表达的是空间上的在场，还是时间上的先于
  choice: 正文译作“在他父亲他拉面前”，脚注说明也可理解为“先于他父亲他拉去世”，即父亲尚在世时
  alternative: 直接译作“在他父亲他拉还在世时”
  rationale: 原文习语容许现场/当面与时间先后之间的语义张力；正文保留具体说法，脚注交代自然的时间性理解，避免过早消除歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“死”忠实直接；“就是”自然连接出生地与具体地名。正文中的[a]与脚注对应。
