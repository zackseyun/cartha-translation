revisions:
- from: 哈兰死在他父亲他拉面前[a]，是在他的出生地，就是迦勒底人的吾珥。
  to: 哈兰死在他父亲他拉面前，在他的出生之地——迦勒底人的吾珥。
  rationale: 修订仅改善现代汉语的句法和地点同位关系的呈现；保留“在……面前”以维持原文习语所带的空间与时间语义张力，并以脚注交代时间性替代理解。
  reviewer_model: gpt-5.6-terra
