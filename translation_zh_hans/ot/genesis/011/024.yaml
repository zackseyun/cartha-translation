  text: וַ/יְחִ֣י נָח֔וֹר תֵּ֥שַׁע וְ/עֶשְׂרִ֖ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת תָּֽרַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/024.yaml
  text: Nahor lived twenty-nine years and fathered Terah.
translation:
  language: zh_hans
  text: 拿鹤活到二十九岁，生了他拉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在家谱公式中，חיה的连续叙事形式表示在下一事件发生前活了若干年；“活到二十九岁”符合现代汉语表达。
- source_word: נָחוֹר
  choice: 拿鹤
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: 二十九岁
  rationale: 希伯来语字面次序为“九和二十年”；现代汉语按自然数词次序译为“二十九岁”。与“活到”搭配时用“岁”最自然。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד的使役形在男性家谱中表示生育、成为某人的父亲；中文家谱语境用“生了”简洁自然，且不额外断定经文未明说的细节。
- source_word: אֶת
  choice: 不单独译出
  rationale: 宾语标记在汉语中没有对应的独立词，由正常语序体现。
- source_word: תָּרַח
  choice: 他拉
  rationale: 按现代中文圣经人名的通行音译处理。
theological_decisions:
- issue: וַיּוֹלֶד是否译为明确的父子关系
  choice: 生了
  alternative: 作了他拉的父亲
  rationale: 主语拿鹤为男性，家谱关系自然指父子关系；但“生了”保留希伯来家谱公式的简洁性，也避免加入原文没有展开的生育机制或世代间隔说明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留创世记家谱句式的节奏；本节无需脚注。
