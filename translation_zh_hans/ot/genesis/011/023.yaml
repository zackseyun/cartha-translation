base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 西鹿生拿鹤以后，又活了二百年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱公式中表示继续活着；结合后面的时间短语，译作“又活了”自然地表达“此后继续活了”。
- source_word: שְׂרוּג
  choice: 西鹿
  rationale: 采用现代中文圣经中较通行的人名译法。
- source_word: אַחֲרֵי
  choice: 以后
  rationale: 准确表达后续时间关系，并符合现代汉语叙事习惯。
- source_word: הוֹלִידוֹ
  choice: 生
  rationale: 使役形态的 ילד 在父系家谱中指成为某人的父亲；中文家谱语境用“生”简洁自然，主语已明确为男性。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语的直接宾语标记，现代汉语无须对应词。
- source_word: נָחוֹר
  choice: 拿鹤
  rationale: 采用现代中文圣经中较通行的人名译法。
- source_word: מָאתַיִם שָׁנָה
  choice: 二百年
  rationale: 准确表达持续时间，符合现代汉语数量结构。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 延续本节家谱用语；“生了”在中文中可用于父亲生育后代，且比“有了”更贴近原文动词。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 保留原文明确列出的两类后代，不概括为“儿女”或“孩子”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“并且”保留末句的并列推进；不添加原文未明说的年龄、其他后代范围或神学解释。
