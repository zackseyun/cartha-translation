  text: 全地的人都说同一种语言，使用同样的话语[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使用同一套词语”，或“使用同样的言语”。希伯来文直译为“以及同一的（或：相同的）话语”。
