lexical_decisions:
- source_word: וַיְהִי
  choice: 都使用……说……
  rationale: 此处的叙事形式引出当时的整体状况。现代汉语无需机械译成“事情发生了”或另加“那时”；以状态句自然承接上下文。
- source_word: כָל הָאָרֶץ
  choice: 全地
  rationale: אָרֶץ可指“地”或“土地”；巴别塔语境涉及普遍的人群，以“全地”既保留原文表达，也避免擅自缩窄为某一地区。
- source_word: שָׂפָה אֶחָת
  choice: 使用同一种语言
  rationale: שָׂפָה字面为“嘴唇”，在此为“语言、言语”的惯用义；“同一种语言”自然表达אֶחָת所强调的统一。
- source_word: וּדְבָרִים אֲחָדִים
  choice: 说同样的话
  rationale: דְּבָרִים可指“话、词语、事情”；与“一种语言”并列时，“说同样的话”保留其独立含义及אֲחָדִים所表达的一致性，同时符合现代汉语习惯。
