  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: zh_hans
  text: 于是，雅威使他们从那里分散到全地各处[a]，他们就停止建造那座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“遍布全地”；希伯来文直译为“在全地的表面上”。
    reason: 保留希伯来习语的字面意象，并说明自然汉语的另一种表达。
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: 使他们……分散
  rationale: פוץ在使役语境中表示使人群散开；译作“使……分散”既保留使役意义，也符合本段审判语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见现代汉语音译处理，保留其专名性质，不以称号替代。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接表达地点起点，并自然回指巴别。
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: 到全地各处
  rationale: 该希伯来习语字面为“在全地的表面上”，实际表示遍布全地；正文采用自然现代汉语，脚注保留字面意象及可选译法。
- source_word: וַיַּחְדְּלוּ
  choice: 停止
  rationale: חדל表示停止、作罢；“停止”清楚自然。
- source_word: לִבְנֹת
  choice: 建造
  rationale: 与“停止”搭配，准确表达不再继续施工。
- source_word: הָעִיר
  choice: 那座城
  rationale: 定冠词所指的是上下文中正在建造的特定城市；“那座城”在汉语中回指明确。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”保留专名，并较贴近学界通常重构的读音，不以“主”等称号替换。
- issue: 分散行为的施事者
  choice: 明确译为“雅威使他们……分散”
  alternative: “他们分散了”
  rationale: 原文以雅威为及物动词的主语、以“他们”为宾语，明确将分散归于雅威的行动，不宜弱化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是……就……”体现连续叙事及结果关系；避免生硬照搬“地面之上”，但以脚注保存原文意象。
