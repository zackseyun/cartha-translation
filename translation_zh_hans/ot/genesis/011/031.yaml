source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: zh_hans
  text: 他拉带着他的儿子亚伯兰、哈兰的儿子罗得，就是他的孙子[a]，以及他的儿媳撒莱，就是他儿子亚伯兰的妻子；他们一同[b]离开迦勒底的吾珥，要往迦南地去。他们来到哈兰，就住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“罗得，哈兰的儿子、他儿子的儿子”；意思是罗得是他拉的孙子。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们同他们出去”。这里“他们”与“同他们”的具体指涉关系不够明确；正文按共同启程的意思译为“他们一同离开”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 带着
  rationale: 基本义为“拿、带”。在带领家人迁行的语境中，“带着”比生硬的“带走”更自然，同时保留他拉作为句首行动者。
- source_word: לוֹט בֶּן־הָרָן בֶּן־בְּנוֹ
  choice: 孙子罗得（罗得是哈兰的儿子）
  rationale: 原文逐层说明罗得是哈兰的儿子，又是他拉之子的儿子。正文用现代汉语明确亲属关系，并以脚注保存原文结构。
- source_word: כַּלָּתוֹ
  choice: 儿媳撒莱
  rationale: כַּלָּה 在这里指他拉的儿媳；“儿媳”是准确、自然的现代汉语。
- source_word: אֵשֶׁת אַבְרָם בְּנוֹ
  choice: 就是他儿子亚伯兰的妻子
  rationale: 保留原文同位说明，明确撒莱与亚伯兰的婚姻关系。
- source_word: וַיֵּצְאוּ אִתָּם
  choice: 他们一同离开
  rationale: 马所拉文本直译为“他们同他们出去”，主语与伴随对象的关系在上下文中显得突兀。“一同离开”自然表达共同启程之意，同时用脚注保留原文的形式和歧义。
- source_word: מֵאוּר כַּשְׂדִּים
  choice: 离开迦勒底的吾珥
  rationale: 采用现代中文圣经地名的通行形式；介词 מִן 表示出发地点。
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: 要往迦南地去
  rationale: 不定式与方向词尾共同表达行程目的地；“要往……去”自然且保留目的含义。
- source_word: וַיָּבֹאוּ עַד־חָרָן
  choice: 他们来到哈兰
  rationale: עַד 在此可表示到达的界限或终点。中文“来到哈兰”表达实际抵达，避免不自然的“来到哈兰为止”。
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: 就住在那里
  rationale: יָשַׁב 在迁徙语境中表示居住、定居；“住在那里”不强行判定停留是暂时还是永久。
theological_decisions:
- issue: 行程是否带有与原文未明说的转折意味
  choice: 按顺承关系译为“他们来到哈兰，就住在那里”
  alternative: “可是，他们到了哈兰，便定居在那里”
  rationale: 原文以连续的叙事 וַ־ 连接动作，并未明示“可是”。不把尚未到达迦南解释为刻意中止或神学上的失败。
- issue: 在哈兰居住的持续性质
  choice: “住在那里”
  alternative: “定居在那里”
  rationale: יָשַׁב 可指居住或定居；正文采用范围较宽的表达，避免超出本节而确定其永久性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。亲属称谓用“儿子、孙子、儿媳、妻子”，地名采用简体中文通行译名。正文不加入原文未明示的转折；对 וַיֵּצְאוּ אִתָּם 的突兀表达则以自然正文配合脚注保存歧义。
