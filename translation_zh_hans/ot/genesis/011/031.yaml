  to: 他拉带着他的儿子亚伯兰、哈兰的儿子罗得，就是他的孙子[a]，以及他的儿媳撒莱，就是他儿子亚伯兰的妻子；他们一同[b]离开迦勒底的吾珥，要往迦南地去。他们来到哈兰，就住在那里。
