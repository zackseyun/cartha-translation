  text: The days of Terah were two hundred and five years, and Terah died in Haran.
translation:
  language: zh_hans
  text: 他拉一生的年日共二百零五年；他拉死在哈兰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: 他拉一生的年日是
  rationale: “某人的日子”是希伯来语表示寿命的惯用说法；译作“一生的年日”既保留原文意象，也使现代汉语读者清楚理解这是寿命总结。
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 二百零五岁
  rationale: 按现代汉语的标准数字顺序表达原文的“五年又二百年”，并用“岁”自然表示人的年龄。
- source_word: וַיָּמָת
  choice: 死
  rationale: מות在此直接表示死亡；采用“死”忠实、简明，不加入原文没有的委婉色彩。
- source_word: תֶּרַח
  choice: 他拉
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: בְּחָרָן
  choice: 在哈兰
  rationale: 介词בְּ在此表示死亡发生的地点，译作“在”；地名采用通行音译“哈兰”。
