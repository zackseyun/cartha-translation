  text: וַ/יֵּ֣רֶד יְהוָ֔ה לִ/רְאֹ֥ת אֶת הָ/עִ֖יר וְ/אֶת הַ/מִּגְדָּ֑ל אֲשֶׁ֥ר בָּנ֖וּ בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: zh_hans
  text: 耶和华下来，要看世人所建造的那座城和那座塔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”所译的希伯来语短语，字面为“人之子（们）”，这里泛指人类。
    reason: 说明希伯来习语的字面形式与集合性含义。
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 下来
  rationale: 保留希伯来语“下去、下降”的具体动作和拟人化叙述；汉语从叙事视角说“下来”自然，也不把它弱化为“察看”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不以称号“主”替代。
- source_word: לִרְאֹת
  choice: 要看看
  rationale: 对应“去看”的目的含义；“看看”自然地保留原文朴素表达及其叙事反讽，避免用“视察”作过度解释。
- source_word: הָעִיר וְאֶת הַמִּגְדָּל
  choice: 那城和塔
  rationale: 分别直接译出“城”和“塔”；定指冠词结合上文用“那”自然表达，第二个名词前不重复量词，使中文简洁。
- source_word: אֲשֶׁר בָּנוּ
  choice: 就是……所建造的
  rationale: 以中文关系结构连接“城和塔”与建造者，表达已经发生的建造行为，同时不强行判定工程是否全部完工。
- source_word: בְּנֵי הָאָדָם
  choice: 世人
  rationale: 该希伯来习语字面为“那人/亚当之子”，实际集合性地指人类。中文“世人”自然、庄重，并保留与耶和华相对的人类整体意义；字面形式列入脚注。
theological_decisions:
- issue: 耶和华“下来”的拟人化描写
  choice: 保留具体措辞“下来”
  alternative: 从天上察看；留意
  rationale: 原文有意采用具体、拟人化的叙事语言；直译可保留其文学效果和神学张力，不将其抽象化。
- issue: בְּנֵי הָאָדָם 的集体意义
  choice: 正文译作“世人”
  alternative: 人的众子；人类
  rationale: 原短语形式为阳性亲属表达，但在此泛指参与建造的人类。现代汉语若直译“人的众子”生硬且容易误解为仅指男性；“世人”准确传达集合性所指，脚注保留字面信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“下来”和“看看”保留原文简明而具体的表达；“就是……所建造的”使关系从句符合自然汉语。
