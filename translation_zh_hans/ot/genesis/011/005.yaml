- from: 耶和华下来，要看看那城和塔，就是世人所建造的。[a]
  to: 耶和华下来，要看世人所建造的那座城和那座塔。[a]
  rationale: 修订仅改善汉语句法和脚注的语文学准确性：保留神名、拟人化的“下来”、目的性“要看”、城与塔及人类集体建造者；不增添工程完成、神学解释或对“亚当”的特指。
