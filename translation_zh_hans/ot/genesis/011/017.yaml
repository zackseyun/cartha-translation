  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 希伯生了法勒以后，又活了四百三十年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱公式中，חיה表示“活了”；结合“生了法勒以后”，用“又活了”自然地表达此后的寿数。
- source_word: עֵבֶר
  choice: 希伯
  rationale: 采用现代中文圣经中这一人名的通行译法。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: 生了法勒以后
  rationale: הוליד在家谱语境中指男性生育后代；中文以“生了”表达简洁自然，并保留父系家谱含义。
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百三十年
  rationale: 按现代汉语数词次序表达总年数，不机械保留希伯来语“三十年和四百年”的排列。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 与本节前半的家谱用语保持一致；“生了”比“生养了”更直接对应使役形所表达的父系生育。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 原文分别列出男性和女性后代，因此不概括为“儿女”或“孩子”。
