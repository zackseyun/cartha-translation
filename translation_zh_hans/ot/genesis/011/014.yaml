  text: וְ/שֶׁ֥לַח חַ֖י שְׁלֹשִׁ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת עֵֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/014.yaml
  text: Shelah lived thirty years and fathered Eber[a][b].
translation:
  language: zh_hans
  text: 示拉[a]活到三十岁，生了埃伯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“沙拉”；希伯来文此处作“示拉”（Shelah）。
    reason: lexical_alternative
  - marker: b
    text: 或译“希伯”；“埃伯”更直接反映希伯来文名字的读音。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: 示拉
  rationale: 按希伯来文 שֶׁלַח（Shelah）的读音音译，并用“示拉”与同名人物的常见现代中文译法保持一致；句首的连接词在连续家谱体例中不必机械译出。
- source_word: חַי שְׁלֹשִׁים שָׁנָה
  choice: 活到三十岁
  rationale: 希伯来文直陈“活了三十年”，在家谱公式中表示他到三十岁时发生下一事件；“活到三十岁”是自然、准确的现代汉语表达，且不暗示他只活了三十年。
- source_word: וַ/יּוֹלֶד
  choice: 生了
  rationale: 使役式 ילד 在父系家谱中指“生育、作父亲生下”。中文家谱叙述以男性为主语时，“生了”简洁自然，也保留原文的亲子关系；无需增添原文没有明说的“儿子”。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在中文中由语序表达，无须另译。
- source_word: עֵבֶר
  choice: 埃伯
  rationale: 按希伯来文 עֵבֶר（ʿEber）的读音较直接地音译；“希伯”是受传统译名影响的另一常见形式。
theological_decisions: []
translation_notes:
  register: 采用简洁庄重的现代汉语家谱句式。“活到三十岁”明确这是生子时的年龄，避免把“活了三十年”误解为总寿数。专名优先依希伯来文音译，并用脚注保留传统中文译名。
