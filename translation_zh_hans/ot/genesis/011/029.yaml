  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: zh_hans
  text: 亚伯兰和拿鹤各自娶了妻子[a]。亚伯兰的妻子名叫撒莱；拿鹤的妻子名叫密迦，是哈兰的女儿。哈兰是密迦和亦迦的父亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“为自己娶了妻子”。
    reason: 保留לקח与לָהֶם构成的源语表达，并说明正文采用了较自然的现代汉语婚姻用语。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לקח本义为“拿、取”，但以“妻子”为宾语时构成婚姻用语；现代汉语用“娶了”自然准确，同时脚注保留希伯来语较直译的表达。
- source_word: לָהֶם
  choice: 各自
  rationale: 介词加代词在此表示为自身而行；复合主语中的亚伯兰和拿鹤分别娶妻，用“各自”清楚传达这一分配性含义。
- source_word: נָשִׁים
  choice: 妻子
  rationale: 该词可指“女人”或“妻子”，在婚姻语境中明确指妻子。
- source_word: שֵׁם אֵשֶׁת
  choice: 妻子名叫
  rationale: 希伯来语直译为“妻子的名字是”；汉语用“妻子名叫”既保留点名句式，又更自然。
- source_word: שָׂרָי
  choice: 撒莱
  rationale: 采用现代中文圣经中通行的人名译法，并与后来改名为“撒拉”相区别。
- source_word: מִלְכָּה
  choice: 密迦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בַּת
  choice: 女儿
  rationale: 按其通常而直接的亲属含义翻译。
- source_word: הָרָן
  choice: 哈兰
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֲבִי
  choice: 父亲
  rationale: 此处说明哈兰与密迦、亦迦的直接亲属关系，“父亲”最符合上下文。
- source_word: יִסְכָּה
  choice: 亦迦
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“各自娶了妻子”避免生硬照搬“为自己取妻”，同时通过脚注呈现原文措辞。后半节拆成两句，以免“哈兰的女儿、密迦和亦迦的父亲”在中文中产生修饰关系不清的问题；亲属信息完整保留。
