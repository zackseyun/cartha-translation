  text: Serug lived thirty years and fathered Nahor.
translation:
  language: zh_hans
  text: 西鹿活到三十岁，生了拿鹤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在族谱年龄公式中，חיה 的叙事形式引出某人生子时的年龄；“活到三十岁”既自然，也准确表达希伯来语在此处的年龄含义。
- source_word: שְׂרוּג
  choice: 西鹿
  rationale: 人名按现代中文圣经中通行的译名处理。
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: 三十岁
  rationale: 希伯来语直陈“三十年”，在这里是年龄表达；现代汉语自然译作“三十岁”。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד 的使役形在男性族谱中表示生育或成为父亲；“生了”简洁、自然，并保留族谱陈述的直接性。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，其语法功能已由汉语语序体现。
- source_word: נָחוֹר
  choice: 拿鹤
  rationale: 人名按现代中文圣经中通行的译名处理。
