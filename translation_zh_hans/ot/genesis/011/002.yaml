base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: zh_hans
  text: 他们从东方迁徙时[a]，在示拿地发现了一片平原，就在那里定居下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向东迁徙时。”希伯来语מִקֶּדֶם既可理解为指出来源（“从东方”），也可理解为指出方向（“向东”）。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: 他们……迁徙时
  rationale: וַיְהִי在此引出随后事件发生的背景，适合自然地融入时间从句；נסע常指拔营启程、继续行进，在本段全体人口移动的语境中译为“迁徙”贴切而自然。
- source_word: מִקֶּדֶם
  choice: 从东方
  rationale: 介词מִן通常表示来源，因此正文采用“从东方”；但קֶדֶם与该介词组合在此也可能表达“向东”，故以脚注保留这一真实歧义。
- source_word: וַיִּמְצְאוּ
  choice: 发现了
  rationale: מצא的基本义是“找到、发现”；这里指他们在行程中遇见适合定居的地形，“发现了”符合现代汉语叙事。
- source_word: בִקְעָה
  choice: 一片平原
  rationale: בִקְעָה可指宽阔的谷地或平原；结合示拿的地理语境，译作“一片平原”清楚自然。
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: 在示拿地
  rationale: 保留אֶרֶץ的地域含义，并按传统中文圣经地名音译שִׁנְעָר为“示拿”。
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: 就在那里定居下来
  rationale: ישב可指居住或定居；迁徙语境强调停止行进并住下，“定居下来”最能传达这一层意思。“就”自然衔接前面的发现与随后行动。
