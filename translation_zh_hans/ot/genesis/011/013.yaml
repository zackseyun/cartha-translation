base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 亚法撒生沙拉以后，又活了四百零三年；他还生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱套语中表示此后继续存活；“又活了”自然呈现从生下所列之子以后延续的寿命。
- source_word: אַרְפַּכְשַׁד
  choice: 亚法撒
  rationale: 采用现代中文圣经中通行、易于辨认的希伯来人名译法。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־שֶׁלַח
  choice: 生了沙拉之后
  rationale: 准确表达时间关系，并保留使役形态 ילד 在男性家谱主体下“生育、成为父亲”的含义；中文用“生了”简洁自然。
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百零三年
  rationale: 按现代汉语数词次序表达希伯来文“三年和四百年”，数值不变。
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: 并且生了儿女
  rationale: “儿女”明确涵盖原文的“儿子和女儿”，比泛称“孩子”更贴近原文，同时符合现代汉语家谱叙述。
