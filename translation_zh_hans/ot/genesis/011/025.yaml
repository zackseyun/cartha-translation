base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 拿鹤生他拉以后，又活了一百一十九年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱公式中，חיה表示所述人物在生下指定儿子之后继续存活；“又活了”自然地表达延续的寿命。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־תֶּרַח
  choice: 生他拉以后
  rationale: 该结构标明拿鹤生下他拉之后的时期。中文用“生……以后”简洁自然，也保留主动生育之意。
- source_word: נָחוֹר
  choice: 拿鹤
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: תֶּרַח
  choice: 他拉
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: 一百一十九年
  rationale: 希伯来文按十九加一百的次序表达；译文依现代汉语习惯调整为“一百一十九年”。
- source_word: וַיּוֹלֶד
  choice: 并且生了
  rationale: 延续 ילד 的生育含义；“生了”在中文家谱叙述中自然清楚，“并且”连接随后发生的家族繁衍。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 原文明确并列男性和女性后代，故不概括译作“儿女”或“孩子”。
