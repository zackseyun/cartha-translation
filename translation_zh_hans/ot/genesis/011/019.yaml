  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 法勒生拉吴之后，又活了二百零九年，生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱公式中，חיה表示在所述生育事件之后继续存活的年数；“又活了”自然体现这一延续关系。
- source_word: פֶלֶג
  choice: 法勒
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ
  choice: 生了拉吴以后
  rationale: הוליד是使役形，在父系家谱中指生育、成为父亲；中文用“生了”简洁自然，同时保留明确的先后关系。רְעוּ音译为“拉吴”。
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 二百零九年
  rationale: 按现代汉语数字顺序表达希伯来文“九年又二百年”的总数。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 与前面的הוליד同属ילד词根，在家谱语境中表示父亲生育后代；译为“生了”符合现代汉语习惯。
- source_word: בָּנִים וּבָנוֹת
  choice: 其他儿女
  rationale: 原文明确说“儿子和女儿”；现代汉语“儿女”兼指两者。补出“其他”说明这些儿女是在已具名的拉吴之外，属于语境所含信息，并避免误读为包括拉吴的一般性重述。
