  text: וַֽ/יְחִי שֵׁ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אַרְפַּכְשָׁ֔ד חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 闪生亚法撒之后，又活了五百年，并且生了儿子和女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱叙事中，חיה 的连续式表示某人在生子之后继续存活一段时间；“又活了”自然表达这种延续，并与上下文衔接。
- source_word: שֵׁם
  choice: 闪
  rationale: 采用现代中文圣经读者熟悉的传统译名。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת אַרְפַּכְשָׁד
  choice: 生亚法撒之后
  rationale: הוליד 是 ילד 的使役形，在家谱中指男性生育、成为父亲；中文“生”简洁自然，且“之后”准确表达 אַחֲרֵי 的时间关系。亚法撒采用通行传统译名。
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: 五百年
  rationale: 按原文直接表达持续年数。
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: 并且生了儿女
  rationale: וַיּוֹלֶד 延续家谱中的生育叙述；בנים ובנות 明指儿子和女儿，现代汉语以“儿女”自然、完整地涵盖两者。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“又活了”保留生亚法撒后继续生活五百年的时间结构；“儿女”避免冗长，同时忠实涵盖原文的“儿子和女儿”。
