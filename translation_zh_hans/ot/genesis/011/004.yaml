base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: zh_hans
  text: 他们说：“来吧，我们来为自己建一座城和一座塔，塔顶在天空中[a]；我们也为自己扬名，免得我们分散在全地上[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“塔顶在天空中”；也可译作“塔顶高达天空”。
    reason: lexical_alternative
  - marker: b
    text: “分散”也可译作“散布”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: 来吧
  rationale: 这是号召众人共同行动的感叹语；“来吧”自然保留了劝勉和倡议的语气。
- source_word: נִבְנֶה לָּנוּ
  choice: 我们要为自己建
  rationale: 第一人称复数意愿式表达共同倡议或决心；现代汉语用“我们要”比逐字译作“让我们”更自然，לָּנוּ则明确译为“为自己”。
- source_word: עִיר וּמִגְדָּל
  choice: 一座城和一座塔
  rationale: 分别采用基本词义“城”和“塔”，不额外赋予军事或建筑功能。
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: 塔顶直入天空
  rationale: 原文直陈“它的顶部在天空中”。正文以自然且形象的汉语表达其高度，同时脚注保留更贴近字面的译法。
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: 我们要为自己扬名
  rationale: “扬名”是自然的现代汉语习语，准确表达取得名声之意，并保留“名”的文学意象。
- source_word: פֶּן נָפוּץ
  choice: 免得我们分散
  rationale: פֶּן表示所要避免或惧怕的结果，“免得”简洁准确；נָפוּץ在语境中指散布各处，“分散”自然且不强行补出施事者。
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: 在全地上
  rationale: עַל־פְּנֵי表示遍及某一表面；在太古史语境中הָאָרֶץ指整个大地，故译“全地”，既简洁又保留圣经叙事用语。
theological_decisions:
- issue: 巴别叙事中הָאָרֶץ的范围
  choice: 全地
  alternative: 全境／全世界
  rationale: 创世记太古史的语境涉及人类遍布大地，而非仅指某一地方；“全地”保留“地”的原文意象，也不将现代地理概念强加于文本。
- issue: “塔顶在天空中”的表达性质
  choice: 作为夸张而形象的高度描述，不注明其神学或宇宙论机制
  alternative: 塔顶达到天上／进入诸天
  rationale: 原文只说塔顶“在天空中”，并未解释这是字面可达的目标还是修辞性的宏愿；译文与脚注保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来吧”“我们要”呈现连续的共同倡议；“扬名”“全地”保留原文的文学凝练感。所有脚注标记均已置于正文相应位置。
