  text: 拉吴活到三十二岁，生了西鹿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在家谱公式中，חיה 与所述年龄连用，表示某人活到该年龄；“活到”符合现代汉语表达。
- source_word: רְעוּ
  choice: 拉吴
  rationale: 采用现代中文圣经人名的通行音译，清楚自然。
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: 三十二岁
  rationale: 按现代汉语数词顺序准确表达希伯来文的“三十二年”，并与“活到”自然搭配。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 希伯来文 ילד 的使役形在男性家谱中表示生育、成为父亲；“生了”简洁自然，并保留家谱公式的表达。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来文直接宾语标记，现代汉语无须用独立词语对应。
- source_word: שְׂרוּג
  choice: 西鹿
  rationale: 采用现代中文圣经人名的通行音译。
