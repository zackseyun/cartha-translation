base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 沙拉生希伯以后，又活了四百零三年，并且生了儿女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱公式中，חיה表示继续活着；结合“生希伯以后”的时间短语，译为“又活了”自然地表达其后续寿数。
- source_word: שֶׁלַח
  choice: 沙拉
  rationale: 采用现代中文圣经中较通行、且与希伯来人名相对应的音译。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: 生希伯以后
  rationale: הוליד在男性家谱语境中表示生育、成为父亲；中文“生”简洁自然，并保留家谱关系。עֵבֶר音译为“希伯”。
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百零三年
  rationale: 希伯来语字面次序为“三年和四百年”，实际数值是四百零三年；按现代汉语数字习惯表达。
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: 并且生了儿女
  rationale: 保留原文明确提到男性和女性后代的表达；“儿女”比笼统的“孩子”更贴近“儿子和女儿”，也比逐字译法更符合现代汉语。
