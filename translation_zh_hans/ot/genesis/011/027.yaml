  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: zh_hans
  text: 以下是他拉的后代：他拉是亚伯兰、拿鹤和哈兰的父亲；哈兰是罗得的父亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 这里的连接词与指示词共同引出族谱的新段落。“以下是”符合现代汉语的篇章表达，也不额外加入时间意义。
- source_word: תּוֹלְדֹת
  choice: 后代
  rationale: 该词是《创世记》中反复出现的结构性用语，可涵盖由某人而出的家系及相关记述。此处紧接儿子名单，译作“后代”自然清楚，同时保留族谱含义。
- source_word: תֶּרַח
  choice: 他拉
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הוֹלִיד
  choice: 生了
  rationale: 该动词在族谱语境中表示生育、成为父亲。中文“生了”简洁自然；主语均为男性，父系关系由上下文明确。两处采用同一译法以保持原文重复。
- source_word: אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: 亚伯兰、拿鹤和哈兰
  rationale: 直接宾语标记不另译，人名采用通行中文译名，并按现代汉语列举方式连接。
- source_word: לוֹט
  choice: 罗得
  rationale: 采用现代中文圣经中通行的人名译法。
