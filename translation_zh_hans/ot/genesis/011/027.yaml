    issue: 两处“生了”的男性主语表述可能造成语义歧义。
    rationale: 希伯来文הוֹלִיד在此为族谱中的“作父亲／生育（子女）”。现代汉语口语“某男性生了某人”通常不够自然，且可能被理解为母亲的分娩行为。改用“是……的父亲”可准确、清楚地表达原文关系。
