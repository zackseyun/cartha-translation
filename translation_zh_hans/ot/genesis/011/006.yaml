  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: zh_hans
  text: 耶和华说：“看哪，他们是同一群人，人人都说同一种语言；这事他们已经开始做了。如今，他们所谋划要做的一切，都不会受到阻拦[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如今，他们所谋划要做的一切，对他们都不会是不可能的。”
    reason: בצר的尼法尔式在这里可理解为“受到阻拦／被扣留”，也可理解为“难以做到、不可能”。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，明确保留原文专名，而不以普通称号“主”代替。
- source_word: הֵן
  choice: 看哪
  rationale: 保留引出郑重观察的指示语气；措辞庄重，也为现代中文读者所能理解。
- source_word: עַם אֶחָד
  choice: 一个民族
  rationale: עַם在此指共同体或族群，并非特指政治国家；“一个民族”简洁呈现其群体合一性。
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: 人人都说同一种语言
  rationale: שָׂפָה字面为“嘴唇”，此处惯用义为语言；用动词句自然表达לְכֻלָּם所强调的全体性。
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: 这事他们已经开始做了
  rationale: 忠实表达חלל使役式在此“开始”的意义，不把原文没有明说的“只是开端”或未来行动范围写入正文。
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: 都不会受阻了
  rationale: בצר的被动式可表示被拦阻、被阻止，或成为不可能；正文采用简洁且保留被动意味的“受阻”，并以脚注交代能力层面的另一译法。
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: 他们谋划要做的任何事
  rationale: יזם表示筹划、谋算或定意；“谋划”既符合语境，也不额外断定计划的道德性质。
theological_decisions:
- issue: 合一的人类是否因此具有无限能力
  choice: 把陈述限定在叙事语境中的共同谋划与行动，译作“任何事……都不会受阻”，不扩展为绝对全能。
  alternative: 译作“对他们来说，没有什么是不可能的”，强调其能力层面的含义。
  rationale: 希伯来文有强烈陈述，却没有宣称人类在一切领域全能；译文保留其张力，也不暗示上帝认可他们的工程。
- issue: לֹא יִבָּצֵר מֵהֶם所表达的是外在拦阻还是事情不可能
  choice: 正文采用“不会受阻”，脚注列出“不再有做不到的事”。
  alternative: 正文直接译为“对他们来说，没有什么是不可能的”。
  rationale: 该结构兼有“被拦阻/被扣留”和“难以做到/不可能”的语义可能；正文与脚注共同保存原文歧义，不以神学推断替代翻译。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留经文叙事的郑重感；其余句式尽量口语可懂，避免古奥结构。
