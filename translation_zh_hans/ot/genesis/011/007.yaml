  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: zh_hans
  text: 来吧，我们下到那里，扰乱他们的语言，以致一个人听不懂同伴的语言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: 来吧
  rationale: 这是表示共同商议或催促行动的感叹语；译作“来吧”自然地保留了原文的劝请语气。
- source_word: נֵרְדָה
  choice: 我们下到那里
  rationale: 第一人称复数劝愿式，直译为“让我们下去”；结合紧随的שָׁם，以“我们下到那里”表达。
- source_word: נָבְלָה
  choice: 扰乱
  rationale: 此处指使语言混乱、无法互通；“扰乱”保留主动造成混乱的含义，又不把结果过度解释为创造多种语言。
- source_word: שְׂפָתָם
  choice: 他们的语言
  rationale: שָׂפָה本义为“嘴唇”，在此转喻为语言；现代汉语以“语言”最清楚自然。
- source_word: לֹא יִשְׁמְעוּ אִישׁ שְׂפַת רֵעֵהוּ
  choice: 使他们彼此听不懂对方的话
  rationale: שמע在语言语境中兼有“听见”和“理解”之意；“听不懂”准确呈现交流失效。原文以单数分配结构“一人……同伴”表达相互关系，汉语用“彼此……对方”更自然。
theological_decisions:
- issue: “我们”所指的复数身份
  choice: 保留“我们”，不作解释
  alternative: 在正文或脚注中说明为三一上帝、天上议会或尊贵复数
  rationale: 原文本节没有明确界定复数的所指；译文应保留其神学张力，不导入特定解释。
- issue: 语言受扰乱的具体机制
  choice: 译为“扰乱他们的语言”
  alternative: 译为“使他们说不同的语言”
  rationale: 原文强调语言被混乱以及由此无法互相理解，并未具体说明机制；不宜把一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此听不懂对方的话”避免生硬照搬“一人听不懂邻舍的语言”，同时保留原文所表达的人际交流断裂。
