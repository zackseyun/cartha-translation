  yaml_path: translation/ot/genesis/011/012.yaml
  text: And Arpachshad lived thirty-five years and fathered Shelah[a][b][c].
translation:
  language: zh_hans
  text: 亚法撒活到三十五岁，生了沙拉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生了”也可译为“作了沙拉的父亲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: 亚法撒
  rationale: 承接词 וְ 表示家谱叙述的连续；现代汉语逐节表达中无需机械译作“又”。人名采用中文圣经中通行且易辨识的音译“亚法撒”。
- source_word: חַי חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: 活到三十五岁
  rationale: 希伯来文直译为“活了五又三十年”；在家谱年龄句式中，以现代汉语正常数序译作“活到三十五岁”，准确自然。
- source_word: וַ/יּוֹלֶד
  choice: 生了
  rationale: 该动词在使役形和家谱语境中指男性生育后代，即“作了……的父亲”。中文家谱惯用“生了”，简洁而不失父系含义。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，其语法作用由汉语语序体现。
- source_word: שָׁלַח
  choice: 沙拉
  rationale: 采用现代中文圣经中较通行的人名形式“沙拉”；此处马所拉文本的读音为 Šālaḥ，中文音译无法完全呈现末尾的咽音。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语，并保持创世记家谱的简洁句式。省略句首连接词的显式翻译，以避免现代汉语中生硬的“并且”；用“活到……岁，生了……”清楚表达年龄与生育事件。
