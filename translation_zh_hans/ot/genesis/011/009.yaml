base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: zh_hans
  text: 因此，那城名叫巴别[a]，因为耶和华在那里变乱了全地的语言，又从那里把他们分散在全地各处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴别”与希伯来语意为“混乱”或“搀杂”的动词 balal 构成文字游戏；本节借此说明这城的名字。
    reason: 说明原文中专名 בָּבֶל 与动词 בָּלַל 之间在中文正文无法完整再现的文字游戏。
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 保留原文承接前事并引出命名缘由的推论关系，简洁而自然。
- source_word: קָרָא שְׁמָהּ
  choice: 那城名叫
  rationale: 原文直译为“称它的名”，未明说施事者；汉语用“名叫”自然地保留这种不明确性，并依据上下文补出“那城”以明确指代。
- source_word: בָּבֶל
  choice: 巴别
  rationale: 采用现代中文圣经语境中通行的专名音译；其与 בָּלַל 的希伯来语双关由脚注说明。
- source_word: כִּי שָׁם
  choice: 因为耶和华在那里
  rationale: “因为”清楚表达命名的原因，“在那里”保留地点指向。
- source_word: בָּלַל
  choice: 混乱了
  rationale: 此处指耶和华使人类语言陷入混杂、不再彼此相通；“混乱”既贴近词义，也与上下文相符。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文中对四字神名的传统专名译法，而非以“主”这一称号替代。
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: 全地的语言
  rationale: שָׂפָה 字面为“嘴唇”，此处是“语言、言语”的转喻；译作“语言”最清楚自然，并保留“全地”的范围。
- source_word: וּמִשָּׁם
  choice: 又从那里
  rationale: “又”承接同一地点发生的第二个行动，“从那里”忠实保留原文的空间起点。
- source_word: הֱפִיצָם
  choice: 把众人分散
  rationale: 原文代词为“他们”；中文根据上下文译作“众人”可明确所指，同时保留使役性的分散行动。
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: 到全地各处
  rationale: 自然表达希伯来语“在全地表面”的空间分布意义；避免生硬的“全地的面上”，并保留遍及全地的范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次使用四字神名。中文正文采用广为人知且具有专名功能的“耶和华”，不以“主”替代；“雅威”是较接近学界重构读音的另一可行音译。
- issue: “全地的语言”的范围
  choice: 保留“全地”的原文表述
  alternative: 译作“所有人的语言”
  rationale: 原文 שְׂפַת כָּל הָאָרֶץ 可按字面理解为“全地的语言”，也可语用性地指全地居民的语言。正文保留原有整体性和叙事张力，不将其解释性改写为“所有人”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“那城名叫”符合中文命名表达；“全地”保留创世记上下文反复出现的整体性措辞；结句以“到全地各处”自然传达希伯来语空间习语。
