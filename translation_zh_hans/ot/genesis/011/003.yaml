  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ הָ֚בָ/ה נִלְבְּנָ֣ה לְבֵנִ֔ים וְ/נִשְׂרְפָ֖ה לִ/שְׂרֵפָ֑ה וַ/תְּהִ֨י לָ/הֶ֤ם הַ/לְּבֵנָה֙ לְ/אָ֔בֶן וְ/הַ֣/חֵמָ֔ר הָיָ֥ה לָ/הֶ֖ם לַ/חֹֽמֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: zh_hans
  text: 他们彼此说：“来吧！我们来制砖，把砖烧透。”砖就给他们当石头用，沥青就给他们当灰泥用。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灰泥”指砌墙时黏合砖块的材料，也可译作“砂浆”。这里的“沥青”是天然沥青或类似焦油的建筑材料。
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: 彼此说
  rationale: 这是希伯来语的分配式习语，意为“一个对另一个说”。现代汉语用“彼此说”自然简洁，也不必机械保留阳性单数形式。
- source_word: הָבָה
  choice: 来吧
  rationale: 该词引出共同采取行动的劝勉；“来吧”既符合现代汉语，也保留了号召语气。
- source_word: נִלְבְּנָה לְבֵנִים
  choice: 我们来制砖
  rationale: 动词是由“砖”构成的派生动词，意思是制造砖；“制砖”准确且符合建筑语境。
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: 把砖烧透
  rationale: 同源动词与名词连用加强动作程度。“烧透”传达充分烧制之意，并自然体现制砖语境。
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: 砖就给他们当石头用
  rationale: היה + ל 在这里表达材料的功能替代，即用砖代替石头；此译法比“变成石头”更能避免实体变化的误解。
- source_word: הַחֵמָר
  choice: 沥青
  rationale: 此词指可用于建筑的天然沥青或类似焦油的物质；“沥青”在现代汉语中准确易懂。
- source_word: לַחֹמֶר
  choice: 当灰泥用
  rationale: חֹמֶר 在此表示砌筑时黏合砖石的材料。“灰泥”清楚表达其建筑功能；脚注说明也可理解为砌筑砂浆。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“制砖”“烧透”贴合古代制砖过程；两个“当……用”保留原文以砖替石、以沥青替灰泥的平行结构。
