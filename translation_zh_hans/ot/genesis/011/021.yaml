base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 拉吴生西鹿以后，又活了二百零七年，并且生了儿女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 在家谱公式中表示某人生育所列之子后继续存活的年数；“又活了”既自然，也清楚承接上文。
- source_word: רְעוּ
  choice: 拉吴
  rationale: 采用现代中文圣经读者熟悉的传统人名译法。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: 生西鹿以后
  rationale: 准确表达时间关系及男性作父亲的生育含义；中文无需译出直接宾语标记 אֶת。
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 二百零七年
  rationale: 按现代汉语数词顺序自然表达希伯来文“七年和二百年”。
- source_word: וַיּוֹלֶד
  choice: 并且生了
  rationale: 家谱语境中指作父亲生育后代；“生了”符合现代汉语家谱叙述习惯，“并且”连接后续生育情况。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿女
  rationale: “儿女”自然、简洁，并完整涵盖原文明确提到的儿子和女儿。
