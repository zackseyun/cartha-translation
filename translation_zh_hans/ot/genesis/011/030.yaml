base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: zh_hans
  text: 撒莱不能生育[a]，没有孩子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“撒莱不能生育，没有后代。”
    reason: “וָלָד”既可译为具体的“孩子”，也可较概括地译为“后代”。
lexical_decisions:
- source_word: וַתְּהִי
  choice: （不另译连接词）
  rationale: 此处וַ与היה构成叙事中的状态说明；现代汉语可直接以“撒莱不能生育”自然承接上下文，无须机械译作“于是”或“现在”。
- source_word: שָׂרַי
  choice: 撒莱
  rationale: 采用现代中文圣经中通行的人名音译，并与其后来改名为“撒拉”相区别。
- source_word: עֲקָרָה
  choice: 不能生育
  rationale: 该阴性形容词指不能生育；“不能生育”比“ infertile ”式医学术语自然，也避免只译“没有孩子”而与下句语义重叠。
- source_word: אֵין לָהּ
  choice: 没有
  rationale: 希伯来语否定存在结构加介词与阴性代词后缀，在汉语中自然表达为所属关系“没有”。
- source_word: וָלָד
  choice: 孩子
  rationale: 该词指所生的孩子或后代；本处用单数集合性表达“孩子”简洁自然，并保留具体的人子含义。
theological_decisions: []
