base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: zh_hans
  text: 他拉活到七十岁，生了亚伯兰[a]、拿鹤和哈兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“成为……的父亲”。希伯来文的家谱用语并不表示这些儿子必定按所列次序出生，也不表示他们同年出生。
    reason: 说明家谱动词的含义，并保留出生次序与年代关系上的开放性。
lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在家谱叙述中，חיה 的该形式表示活到或达到所述年龄；“活到七十岁”是自然、清楚的现代汉语。
- source_word: שִׁבְעִים שָׁנָה
  choice: 七十岁
  rationale: 希伯来文直译为“七十年”，此处指年龄；汉语以“七十岁”表达最自然。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד 在家谱语境中指成为某人的父亲。汉语家谱通常用“生了”，简洁自然，但不强调父亲亲自生产。脚注说明其较直译的含义及次序上的开放性。
- source_word: אֶת ... אֶת ... וְאֶת
  choice: 亚伯兰、拿鹤和哈兰
  rationale: 重复的宾语标记分别引出三个人名；现代汉语自然地用顿号和“和”列举。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: נָחוֹר
  choice: 拿鹤
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: הָרָן
  choice: 哈兰
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法；此处词形中的冠词成分属于该名字的书写形式，不另行翻译。
theological_decisions:
- issue: 家谱中的出生次序及年龄含义
  choice: 按家谱记述译为他拉活到七十岁时生了亚伯兰、拿鹤和哈兰，但不把列名次序解释为严格的出生顺序。
  alternative: 可理解为他拉七十岁开始生子，所列三人是主要后裔，并不表示三人同年出生或紧接着依次出生。
  rationale: 希伯来文陈述他拉达到七十岁并成为这三人的父亲，却没有解决后文引出的全部年代问题。正文保留原文的概括表达，脚注避免读者误以为名单必然标明严格出生次序或三胞胎。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“活到七十岁，生了……”符合中文家谱叙述习惯；保留传统人名译法以便识别。
