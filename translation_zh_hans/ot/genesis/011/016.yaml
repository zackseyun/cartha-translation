lexical_decisions:
- source_word: וַיְחִי
  choice: 活到
  rationale: 在家谱公式中，חיה的连续叙事形式表示某人在生下所记后代之前活了多少年；“活到三十四岁”符合现代汉语表达。
- source_word: עֵבֶר
  choice: 希伯
  rationale: 采用现代中文圣经中较通行的希伯来人名译法。
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: 三十四岁
  rationale: 希伯来语按“四又三十年”的次序表达；现代汉语自然表述为“三十四岁”，数值不变。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 在男性为主语的家谱语境中，ילד表示生育、成为某人的父亲；“生了”简洁自然，并保留家谱公式的庄重感。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，其语法功能由汉语语序体现。
- source_word: פָּלֶג
  choice: 法勒
  rationale: 采用现代中文圣经中较通行的希伯来人名译法。
