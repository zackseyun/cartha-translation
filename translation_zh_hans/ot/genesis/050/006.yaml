  text: 法老说：“你上去，照你父亲叫你起的誓去埋葬他吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词；现代汉语叙事中直接用“说”自然推进情节，也不额外限定为时间或因果关系。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代中文对埃及君王称号的标准译法。
- source_word: עֲלֵה
  choice: 上去
  rationale: 保留עלה的方向含义；这里指从埃及前往迦南，中文“上去”既贴近原文，也符合圣经地理叙述习惯。
- source_word: וּקְבֹר
  choice: 埋葬
  rationale: 准确表达קבר，庄重而通俗；与后面的宾语“你父亲”自然衔接。
- source_word: אֶת אָבִיךָ
  choice: 你父亲
  rationale: 直接表达名词及第二人称阳性单数后缀；汉语无需翻译宾格标记אֶת。
- source_word: כַּאֲשֶׁר
  choice: 照……去做
  rationale: 在此表达依照先前誓言行事；补出“去做”使整句现代汉语自然，同时没有增加新的行为内容。
- source_word: הִשְׁבִּיעֶךָ
  choice: 他叫你起的誓
  rationale: 保留שׁבע使役式的含义，即父亲使约瑟起誓，而不是约瑟自行起誓；“叫你起誓”较“使你起誓”更自然通俗。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“吧”表达法老对请求的准许和命令语气，不将语气强化为严厉命令。原文在此没有需要另设脚注的实质歧义；英文脚注所列内容实为对同一句希伯来语使役结构的另一种英语表达，并非וַיֹּאמֶר的词义变体，因此不移植为中文脚注。
