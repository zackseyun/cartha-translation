  rationale: 修订仅调整句法和指代：以“你父亲”消除“他”的短暂歧义，以“去埋葬他”明确誓言所要求的行动。保留原文的方向性“上去”、命令/许可语气及“使你起誓”的因果式含义。英文审校轨迹中的替代措辞不构成中文必须设置脚注的文本歧义。
