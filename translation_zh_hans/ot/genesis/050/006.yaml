review_pass:
  verdict: revise
  source_fidelity: “照他叫你起的誓去做”大体表达了希伯来文使役式“使你起誓”，但“去做”使所指行动显得笼统，也稍弱化了该誓言与埋葬父亲这一行动的直接关联。修订后明确保留“上去”和“埋葬”，并将誓言自然地连于该行动。
  naturalness: 原句可理解，但“照他叫你起的誓去做”在现代汉语中略显生硬，且“他”在引语中需短暂回指父亲。改为“照你父亲叫你起的誓去埋葬他吧”更顺畅、庄重，也更符合上下文。
  terminology: “法老”“上去”“埋葬”“起誓”均为恰当且通行的现代汉语圣经叙事用语。“叫你起誓”准确反映הִשְׁבִּיעֶךָ的使役意义，未将其淡化为约瑟自行起誓。
  issues:
