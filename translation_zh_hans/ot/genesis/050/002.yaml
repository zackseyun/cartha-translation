base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: zh_hans
  text: 于是，约瑟吩咐他的仆人[a]，就是那些医生，为他父亲的遗体施行防腐处理；医生们就为以色列[b]的遗体施行了防腐处理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴仆”；希伯来语这个词可依语境指仆人或奴隶。
    reason: lexical_alternative
  - marker: b
    text: “以色列”即雅各。
    reason: name_clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: 该动词表示带有权威的指示；“吩咐”既保留其权威意味，也符合现代汉语叙事语体。
- source_word: עֲבָדָיו
  choice: 他的仆人
  rationale: עבד可依语境指仆人或奴隶。本节着重其作为约瑟属下、且具体担任医生的职能，并未凸显其受奴役身份，因此正文译作“仆人”，脚注保留“奴仆”的可能。
- source_word: הָרֹפְאִים
  choice: 医生
  rationale: 该词是רפא的分词名词化形式，指从事医治的人；“医生”是自然、清楚的现代汉语对应词。
- source_word: לַחֲנֹט
  choice: 为……防腐
  rationale: חנט在埃及丧葬语境中指对遗体作防腐处理。“防腐”准确表达行为，又避免“制成木乃伊”可能带来的过度具体化。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 直接保留第三人称领属关系，指约瑟的父亲。
- source_word: וַיַּחַנְטוּ
  choice: 做了防腐处理
  rationale: 与前面的חנט保持词义一致，同时采用自然的现代汉语表达，清楚推进叙事。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文明确使用“以色列”而非“雅各”，应保留这一称名选择，不在正文中加以调和。
theological_decisions:
- issue: 非神学焦点的家内人员语境中עבד的译法
  choice: 仆人
  alternative: 奴仆
  rationale: 本节关注约瑟向其属下医生发出指示，而不是突出奴役制度或其法律身份；“仆人”更贴合当前语境，同时以脚注保留原词可能具有的“奴仆”含义。
- issue: 父亲称名的转换
  choice: 正文保留“以色列”
  alternative: 译作“雅各”或在正文解释为雅各
  rationale: 希伯来文先用“他父亲”，后明确称“以色列”。保留这一转换可忠实呈现叙事措辞；脚注说明其所指即可。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是……就……”体现希伯来叙事的先后推进；保留“他父亲”与“以色列”的称名变化。脚注标记均置于相关正文处。
