base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: zh_hans
  text: 于是，约瑟上去[a]安葬他的父亲；法老的众臣仆、法老家中的长老，以及埃及地所有的长老，都与他一同上去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“上去”；这是从埃及前往迦南时惯用的说法。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去
  rationale: עָלָה本义为“上去、登上”；这里指从埃及前往迦南。译作“上去”既保留希伯来的地理表达，也符合中文圣经叙事语体。
- source_word: לִקְבֹּר
  choice: 安葬
  rationale: קָבַר意为“埋葬”。“安葬”在现代中文中自然、庄重，适合为父亲举行葬礼的语境。
- source_word: אָבִיו
  choice: 他的父亲
  rationale: 如实表达第三人称单数所有格，不增添原文没有的强调。
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: 都和他一同上去了
  rationale: 保留原文对עָלָה“上去”的重复，以呈现叙事节奏和从埃及往迦南的地理观念；同时按现代汉语调整语序。
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: 法老所有的臣仆
  rationale: עֶבֶד可指仆人、奴仆或臣属；在王室随行人员的语境中，“臣仆”既保留服事法老的关系，又不武断限定具体官阶。
- source_word: זִקְנֵי בֵיתוֹ
  choice: 法老家中的长老
  rationale: זָקֵן在此指具有资历或权威的长老；בֵּיתוֹ按最近的先行对象指法老的家室或王室机构。“家中的长老”保留原文意象，未具体化为“宫廷高官”。
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: 以及埃及地所有的长老
  rationale: 保留“长老”和“地”两个要素，表明范围由法老家中扩展到埃及全地。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“于是”承接上下文；重复“上去”以保存希伯来原文的地理表达和叙事节奏。“臣仆”与“长老”避免将宫廷身份解释得过于具体。
