base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: zh_hans
  text: 我父亲曾叫我起誓，说：‘看哪，我快要死了。你要把我安葬在我为自己在迦南地挖掘的坟墓里。’现在，求你准我上去安葬我的父亲，之后我必回来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: 叫我起誓
  rationale: 该使役形式表示“使我发誓、叫我起誓”；此译准确而符合现代汉语表达。
- source_word: הִנֵּה אָנֹכִי מֵת
  choice: 看哪，我快要死了
  rationale: 保留 הִנֵּה 的提示语气；分词 מֵת 在此指死亡临近，译为“快要死了”自然且符合语境。
- source_word: כָּרִיתִי
  choice: 开凿
  rationale: 字面义为“挖、凿”；用于坟墓时“开凿”既保留具体动作，也适合庄重叙事。
- source_word: אֶעֱלֶה נָּא
  choice: 求你准我上去
  rationale: “上去”保留从埃及前往迦南的地理表达；נָּא 在向法老转述的请求中以“求你准我”表达恳请意味。
- source_word: וְאָשׁוּבָה
  choice: 之后我必回来
  rationale: 保留约瑟明确承诺返回埃及的意思；“必”传达意愿式形式在此语境中的郑重保证。
