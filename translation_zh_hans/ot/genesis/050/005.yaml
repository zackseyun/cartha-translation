revisions:
- from: 我父亲曾叫我起誓说：‘看哪，我快要死了。你要把我安葬在迦南地，就是我为自己开凿的坟墓里。’现在求你准我上去安葬我的父亲，之后我必回来。
  to: 我父亲曾叫我起誓，说：‘看哪，我快要死了。你要把我安葬在我为自己在迦南地挖掘的坟墓里。’现在，求你准我上去安葬我的父亲，之后我必回来。
  rationale: 仅重排并微调“坟墓”从句，使“在迦南地”明确修饰“挖掘”，忠实呈现原文的关系结构；其余措辞保留原译的准确性、庄重语体与地理方向表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:06Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了父亲使约瑟起誓、临终遗命、葬于迦南以及约瑟承诺返回的内容。“上去”恰当保留了从埃及前往迦南的地理措辞。惟原译引语中“在迦南地，就是我为自己开凿的坟墓里”将修饰关系处理得不够清楚，容易把“坟墓”误作对“迦南地”的同位说明；原文是“我在迦南地为自己挖掘的坟墓”。
  naturalness: 整体庄重、通顺。“看哪”虽较书面，置于父亲遗命的直接引语中可接受。调整坟墓相关语序后，现代汉语表达会更自然明晰。
  terminology: “起誓”“安葬”“迦南地”均恰当。“开凿”可以用于墓穴，但“挖掘”更中性，并与希伯来语“挖掘”的基本义贴合；不涉及需调整的神学术语。
  issues:
  - severity: medium
    issue: “在迦南地，就是我为自己开凿的坟墓里”修饰与同位关系不清。
    rationale: אֲשֶׁר כָּרִיתִי לִי בְּאֶרֶץ כְּנַעַן 修饰“我的坟墓”，意为“我在迦南地为自己挖掘的坟墓”，而非把坟墓作为“迦南地”的同位成分。应重排语序以明确坟墓位于迦南地。
  revised_text: 我父亲曾叫我起誓，说：‘看哪，我快要死了。你要把我安葬在我为自己在迦南地挖掘的坟墓里。’现在，求你准我上去安葬我的父亲，之后我必回来。
