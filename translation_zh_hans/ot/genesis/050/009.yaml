  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: zh_hans
  text: 战车[a]和骑兵也随他上去[b]；队伍极其庞大[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战车”原文为单数形式，在这里作集合名词，指战车队。
    reason: lexical_alternative
  - marker: b
    text: 按原文的重复强调，也可译作：“战车也随他上去，还有骑兵。”
    reason: previous_rendering
  - marker: c
    text: “极其庞大”原文直译为“非常沉重”；此处形容队伍声势浩大、规模庞大。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去
  rationale: 保留עלה常见的方向性含义；在本段叙事中指随约瑟启程前往迦南。
- source_word: עִמּוֹ
  choice: 跟他一同
  rationale: 自然表达同行之意；“他”按上下文指约瑟。
- source_word: גַּם ... גַּם
  choice: 又有……和……
  rationale: 把战车与骑兵连为并列的随行力量，同时表达重复גַּם所带出的增列、强调意味。
- source_word: רֶכֶב
  choice: 战车
  rationale: 原文虽用单数形式，却可作集合名词，指一支战车队；汉语“战车”无需强制标示单复数。
- source_word: פָּרָשִׁים
  choice: 骑兵
  rationale: 指骑马的人员；“骑兵”在现代汉语中简洁、清楚，也符合此处护送队伍的语境。
- source_word: הַמַּחֲנֶה
  choice: 整支队伍
  rationale: 该词常指“营”或“营队”，此处则是正在行进的送葬人群及护送力量；“队伍”避免使人误解为驻扎地点。
- source_word: כָּבֵד מְאֹד
  choice: 十分庞大
  rationale: 字面为“非常沉重”，用于群体时可表示规模大、阵容厚重；“十分庞大”在现代汉语中自然传达此意。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“跟他一同上去”保留原文行程方向；“整支队伍”适合送葬行列的动态语境；分号清楚连接随行力量与全队规模。
