  language: zh_hans
  text: 约瑟俯身伏在父亲脸上，为他哀哭，亲吻他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约瑟扑倒在父亲脸上。”希伯来文直译为“落在他父亲的脸上”，保留鲜明而具体的身体动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: 伏在
  rationale: נפל在此描写约瑟俯身伏到亡父身上的动作。“伏在”既保留具体的身体动作，也比单说“倒下”更符合现代汉语语境。
- source_word: עַל פְּנֵי אָבִיו
  choice: 在父亲的脸上
  rationale: 希伯来文直指“他父亲的脸”，画面具体。正文保留“脸”，不将其泛化为“遗体”或只译作“身上”。
- source_word: וַיֵּבְךְּ עָלָיו
  choice: 为他哀哭
  rationale: בכה意为哭泣；עַל在丧亲语境中表达为死者悲哭。“哀哭”体现庄重的悼亡语境，“为他”是自然的现代汉语表达。
- source_word: וַיִּשַּׁק לוֹ
  choice: 亲吻他
  rationale: נשק在Qal词干中通常意为“亲吻”；לֹו在此按希伯来语习惯标示对象，汉语直接译作“亲吻他”。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
