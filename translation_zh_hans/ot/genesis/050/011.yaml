base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: zh_hans
  text: 那地的居民，就是迦南人，看见亚达的禾场上的哀悼情景，就说：“这是埃及人一场极其沉痛的哀悼。”因此，那地方名叫亚伯·麦西[a]；它在约旦河对岸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚伯·麦西”听起来像“埃及的哀悼”，与迦南人对这件事的描述相呼应。
    reason: 说明原文地名所含的文字关联，译音本身无法呈现这一点。
  - marker: b
    text: 也可译作“约旦河那边”；这一说法所指的方位取决于观察者身处哪一边。
    reason: 保留原文地理表达的视角依赖性。
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: 那地的居民，就是迦南人
  rationale: 单数分词在此具有集合意义，指当地居民；“迦南人”与之构成同位说明。译文既保留这一结构，也符合现代汉语表达。
- source_word: הָאֵבֶל
  choice: 哀悼
  rationale: אֵבֶל在本段指为死者举行的哀悼及相关礼仪；“哀悼”准确而自然，并可与地名的文字关联在脚注中说明。
- source_word: בְּגֹרֶן הָאָטָד
  choice: 在亚达的禾场上
  rationale: גֹּרֶן指打谷、晒谷的场地，传统而通行的汉语圣经用语“禾场”简洁明确；בְּ在此表示地点。
- source_word: אֵבֶל כָּבֵד
  choice: 一场极其沉痛的哀悼
  rationale: כָּבֵד本义为“沉重”，在此表示哀悼程度深。“极其沉痛”在现代汉语中自然地传达其强度，同时保留“沉重”的语义色彩。
- source_word: לְמִצְרָיִם
  choice: 埃及人
  rationale: 原文形式为地名“埃及”，但语境所指是埃及送葬队伍；译作“埃及人”符合汉语习惯，不改变其关联意义。
- source_word: עַל כֵּן קָרָא שְׁמָהּ
  choice: 因此，那地方名叫
  rationale: 这是希伯来语常见的命名公式。汉语采用自然的无施事表达，并用“那地方”明确阴性代词所指的地点。
- source_word: אָבֵל מִצְרַיִם
  choice: 亚伯·麦西
  rationale: 作为地名予以音译；其与אֵבֶל“哀悼”和מִצְרַיִם“埃及”的文字关联在脚注中交代。间隔号帮助现代读者辨认复合地名。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河对岸
  rationale: 该短语表示约旦河另一边，其具体方位取决于叙述者的观察位置。“对岸”自然且保留这种视角依赖性。
