  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your slaves.”
translation:
  language: zh_hans
  text: 随后，他的兄弟们也来了，俯伏在他面前，说[a]：“我们在这里，是你的奴仆。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“仆人”或“奴隶”。希伯来语 עֲבָדִים 可指受人差遣的仆役，也可指归主人支配的奴隶；这里的话强烈表达了兄弟们的降服。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 来到
  rationale: הלך字面可指“去、行走”；此处叙事聚焦于约瑟，兄弟们朝他而来，现代汉语用“来到”自然清楚。
- source_word: גַּם אֶחָיו
  choice: 他的兄弟们也
  rationale: גַּם表示递进或附加：他们不只先托人传话，如今也亲自前来。
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: 来到他面前，俯伏在地
  rationale: נפל与לְפָנָיו连用，描写在某人面前伏地，兼具身体动作与降服意味；“俯伏在地”比单说“倒下”更准确。
- source_word: הִנֶּנּוּ
  choice: 看，我们是
  rationale: הִנֵּה加第一人称复数后缀构成郑重的自我呈现；“看”保留其引人注意和强调语气，同时符合现代汉语。
- source_word: לְךָ לַעֲבָדִים
  choice: 你的奴仆
  rationale: 该结构字面为“给你作עֲבָדִים”，表达归于约瑟支配之下的身份。“你的奴仆”自然传达强烈的自我降服，并保留该词可兼指奴隶或仆役的历史语义范围。
theological_decisions:
- issue: עֲבָדִים在兄弟们自我降服语境中的译法
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 原词既可指仆役，也可指受主人支配的奴隶。此处兄弟们以俯伏动作表达彻底降服；“奴仆”比“仆人”更有力度，又不像现代汉语“奴隶”那样过度限定其法律身份。脚注保留词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“随后”承接前文他们先托人传话的情节；“俯伏在地”清楚呈现动作和顺服姿态。引语中的“看”保留הִנֶּנּוּ的强调功能，不使用古雅的“看哪”。
