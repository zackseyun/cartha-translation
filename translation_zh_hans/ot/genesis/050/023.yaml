base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: zh_hans
  text: 约瑟见到了以法莲的子孙，直到第三代[a]。玛拿西的儿子玛吉的孩子，也生在约瑟的膝上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“约瑟活着见到了以法莲的子孙，直到第三代”。希伯来文直译为“约瑟看见了”。
    reason: lexical_alternative
  - marker: b
    text: “生在约瑟的膝上”是希伯来语的文化表达，可能表示这些孩子得到约瑟的家族承认、接纳或特别疼爱。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: 见到了
  rationale: 保留希伯来文“看见”的基本意义；在寿数和家谱语境中，也自然表示约瑟活着见到这些后代。
- source_word: לְאֶפְרַיִם בְּנֵי שִׁלֵּשִׁים
  choice: 以法莲第三代的子孙
  rationale: לְ在后裔表达中表示归属；בְּנֵי שִׁלֵּשִׁים指延续到第三代的后裔。“子孙”在现代汉语中比逐字译作“儿子”更准确自然，同时不强行细定亲属称谓。
- source_word: גַּם
  choice: 也
  rationale: 连接与前句并列的补充信息，简洁自然。
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: 玛拿西的儿子玛吉所生的孩子
  rationale: 明确“玛拿西的儿子”修饰玛吉，并以“孩子”表达בְּנֵי在此家族后代语境中的宽泛含义。
- source_word: יֻלְּדוּ
  choice: 出生
  rationale: 准确表达ילד的被动式“被生下、出生”。
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: 在约瑟膝上
  rationale: 保留原文具体而可能具有文化含义的形象，不在正文中把它解释成收养、承认或接纳。
theological_decisions:
- issue: “在约瑟膝上”是否明确表示收养
  choice: 正文保留原文形象，仅在脚注说明可能的含义
  alternative: 直接译为“被约瑟认作自己的后代”或“蒙约瑟接纳”
  rationale: 原文没有明确界定这一动作的法律或礼仪性质；直译能保留其在亲族承认、接纳或特别疼爱之间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“见到了”既贴近原文又符合寿数语境；“子孙”避免把后裔限定为男性。“在约瑟膝上”刻意保留原文含混的文化意象，并用脚注解释。
