  text: וַ/יָּ֨שָׁב יוֹסֵ֤ף מִצְרַ֨יְמָ/ה֙ ה֣וּא וְ/אֶחָ֔י/ו וְ/כָל הָ/עֹלִ֥ים אִתּ֖/וֹ לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו אַחֲרֵ֖י קָבְר֥/וֹ אֶת אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: zh_hans
  text: 约瑟安葬了父亲以后，就和他的兄弟，以及所有同他上去[a]安葬他父亲的人，一同返回埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上去”是圣经常用的行程说法；这里指从埃及前往迦南。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 返回
  rationale: שׁוב在叙事中表示回到先前离开的地方；结合目的地埃及，译作“返回”自然且准确。
- source_word: מִצְרַיְמָה
  choice: 埃及
  rationale: 词尾的方向后缀表示朝向埃及；现代汉语在“返回”之后直接说“埃及”，无需另译“向”。
- source_word: הוּא וְאֶחָיו
  choice: 和他的兄弟
  rationale: 原文代词הוּא强调并补充主语约瑟；汉语以“约瑟……和他的兄弟”自然表达这一并列关系。
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: 以及所有同他上去的人
  rationale: 保留עֹלִים“上去”的地理叙事用语，同时用“同他”表达随行关系。
- source_word: לִקְבֹּר אֶת־אָבִיו
  choice: 安葬他父亲
  rationale: 带ל的动词不定式表示此行目的；“安葬”比“埋葬”更符合为父亲举行葬礼的庄重语境。
- source_word: אַחֲרֵי קָבְרוֹ אֶת־אָבִיו
  choice: 约瑟安葬了父亲以后
  rationale: אַחֲרֵי表示时间先后；带第三人称单数后缀的不定式在语境中以约瑟为行动者。将时间成分前置，符合现代汉语叙事习惯，也清楚交代返程发生在安葬之后。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为避免原文两次“他父亲”在汉语中显得累赘，时间从句中省去物主代词，但仍明确是约瑟安葬自己的父亲；“上去”则保留原文的地理叙事色彩，并以脚注说明。
