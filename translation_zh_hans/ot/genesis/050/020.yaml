    rationale: 原文的לְטֹבָה标示神筹划此事的善的目的／趋向；中文“把这事筹划为善”可能听成神把事件界定或变成善事。改作“为着善筹划这事”更直接保留目的关系，也不把神的作为简化为事后转变。
  - severity: low
