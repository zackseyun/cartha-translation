base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: zh_hans
  text: 至于你们，你们曾图谋恶事害我；但神却为着善筹划这事，为要成就今天这样的局面[a]，使许多人得以存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地说：“照今日所见的情形成就。”这个希伯来语表达指向如今已经显明、看得见的结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: 图谋 / 筹划
  rationale: 两处均保留חשב所表达的有意谋划，并以近义词适应汉语搭配：人图谋恶事，神筹划为善。两者的平行关系仍然清楚，也不把神的作为弱化成事后的扭转。
- source_word: עָלַי רָעָה
  choice: 图谋恶事害我
  rationale: על在敌对语境中有“针对、加害”的意思；“恶事”保留רָעָה的道德分量，“害我”自然表达其敌对指向。
- source_word: לְטֹבָה
  choice: 为善
  rationale: 与“恶事”形成鲜明对照，并保留希伯来文简洁而宽广的“为着善、朝向好的结果”之意。
- source_word: לְמַעַן עֲשֹׂה
  choice: 为要成就
  rationale: למען明确引出目的；עשה在此指使历史中的结果成为现实，译作“成就”比直译“做”更自然。
- source_word: כַּיּוֹם הַזֶּה
  choice: 今天这样的局面
  rationale: 该表达指向当下可见的现实结果；“局面”在现代汉语中自然承接“成就”，同时以脚注保留较形式对应的译法。
- source_word: לְהַחֲיֹת עַם רָב
  choice: 使许多人得以存活
  rationale: 使役形לְהַחֲיֹת表示保全生命；עַם רָב在此重在人数众多，译作“许多人”避免不必要地限定为单一民族。
theological_decisions:
- issue: 人的恶意与神的善意在חשב两次用法中的平行
  choice: 两处都译出主动、有目的的谋划：你们“图谋”，神“筹划”
  alternative: 将神的一处译为“转变成”或“利用”
  rationale: 原文刻意重复同一动词，既确认兄弟们真实的恶意，也确认神朝向善的旨意。汉语采用搭配自然的近义词，同时避免把神的作为解释成仅仅事后补救。
- issue: רָעָה的道德含义
  choice: 恶事
  alternative: 伤害、祸患
  rationale: 上下文涉及兄弟们应负责任的行为；“恶事”保留道德判断，又不额外说明神与恶之间原文未明说的因果方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于你们”承接对比焦点；分号和“但”凸显人的恶谋与神的善意之间的张力。脚注标记已置于正文相应位置。
