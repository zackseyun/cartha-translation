  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: zh_hans
  text: 他的儿子们就照他所吩咐的那样为他做了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 办了
  rationale: עשה含义宽泛，可指“做、办理”。本节承接雅各的安葬嘱咐，用“办了”自然表达其众子照办相关事宜，同时不把原文未明说的具体行动添入正文。
- source_word: בָנָיו
  choice: 他的儿子们
  rationale: בָּנָיו明确指雅各的众子；“他的儿子们”准确保留性别和复数信息。
- source_word: לוֹ
  choice: 为他
  rationale: 介词ל在此表示行动是为雅各而做，译作“为他”符合上下文和现代汉语习惯。
- source_word: כֵּן
  choice: 就……办了
  rationale: כֵּן表示照前述方式而行。汉语以“就”配合后面的“照……”，自然体现照样执行之意。
- source_word: כַּאֲשֶׁר
  choice: 照……所……的
  rationale: 该比较成分表示他们的行动符合雅各的吩咐；“照他所吩咐的”简洁、自然。
- source_word: צִוָּם
  choice: 他所吩咐的
  rationale: צוה意为命令、吩咐。亲属临终嘱托的语境中，“吩咐”庄重而自然；宾语“他们”在汉语关系结构中可省略而不损失意义。
