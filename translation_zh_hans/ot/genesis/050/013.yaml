base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: zh_hans
  text: 他的儿子们把他抬到迦南地，葬在麦比拉田的洞里；这块田是亚伯拉罕从赫人以弗仑那里买来作坟地产业的，位于幔利对面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“面向幔利”。
    reason: 希伯来语עַל־פְּנֵי表示相对于幔利的方位，可理解为“在……对面”或“面向……”。
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ בָנָיו
  choice: 他的儿子们把他运到
  rationale: נשׂא在此指搬运雅各的遗体；“运到”在现代汉语中自然明确。“儿子们”准确保留בָנָיו的阳性复数含义。
- source_word: אַרְצָה כְּנַעַן
  choice: 迦南地
  rationale: 方向词尾表示“到……去”，句中以“运到”体现；“迦南地”完整传达אֶרֶץ כְּנַעַן。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 安葬
  rationale: קבר指埋葬；“安葬”符合庄重叙事语体，也清楚表达丧葬行为。
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: 在麦比拉田里的洞中
  rationale: 保留“洞—田—麦比拉”的领属关系，同时采用自然的现代汉语语序。
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: 亚伯拉罕曾……买下那块田
  rationale: 希伯来文以关系词开头，随后用明确的直接宾语“那块田”复指；汉语拆句可避免误以为购买对象只是洞，并准确指出所买的是田。
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: 作为坟地产业
  rationale: אֲחֻזָּה不只是使用地点，也含归属、持有的产业之意；“坟地产业”兼顾安葬用途与永久持有的含义。
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: 从赫人以弗仑手中
  rationale: 自然表达交易来源，并按现代中文圣经常用形式翻译族称和人名。
- source_word: עַל פְּנֵי מַמְרֵא
  choice: 在幔利对面
  rationale: 该空间短语可指位于某地前方或相对的一面；“对面”简洁保留其相对方位。
theological_decisions: []
