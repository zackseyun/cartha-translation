revisions:
- from: 他的儿子们把他运到迦南地，安葬在麦比拉田里的洞中。亚伯拉罕曾从赫人以弗仑手中买下那块田，作为坟地产业；那地方在幔利对面[a]。
  to: 他的儿子们把他抬到迦南地，葬在麦比拉田的洞里；这块田是亚伯拉罕从赫人以弗仑那里买来作坟地产业的，位于幔利对面[a]。
  rationale: 修订明确了亚伯拉罕所购买的是“这块田”，避免拆句后“那地方”可能造成的指代模糊；同时以“买来作坟地产业”改善汉语行文。其余地名、族名、方位表达及脚注锚点均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:16Z'
