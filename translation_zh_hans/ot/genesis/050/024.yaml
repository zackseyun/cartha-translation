base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: zh_hans
  text: 约瑟对弟兄们说：“我就要死了，但上帝必定眷顾你们[a]，把你们从这地带上去，到他向亚伯拉罕、向以撒和向雅各起誓所应许的那地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必定探访你们”。这里的希伯来语惯用表达可指上帝决定性地关注他的子民，并为他们采取行动。
    reason: 说明 פָּקֹד יִפְקֹד 的较字面译法及其在本处较宽的语义范围。
lexical_decisions:
- source_word: אֶחָיו
  choice: 他的弟兄们
  rationale: 该词为阳性复数并带第三人称阳性单数后缀；在本段语境中具体指约瑟的兄弟们。“弟兄们”准确、庄重，也符合创世记的家族叙事语体。
- source_word: אָנֹכִי מֵת
  choice: 我就要死了
  rationale: 分词结构表达死亡临近，而非已经死亡；“就要死了”是现代汉语中自然、清楚的表达。
- source_word: פָּקֹד יִפְקֹד
  choice: 必定眷顾
  rationale: 同源不定式绝对形与未完成式连用，强化动作的确定性，故译作“必定”。“眷顾”既包含留意，也可包含为其子民采取行动，适合此处盟约性的语境，同时不把具体行动方式说得过窄。
- source_word: וֵאלֹהִים
  choice: 但上帝
  rationale: 连接词在语篇中构成转折：约瑟将死，但上帝仍会行动；现代汉语用“但”能自然呈现这一对比。
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: 带你们……上去
  rationale: 使役词形表示“使上去、带上去”。译文保留“上去”的方向意象，而不简化为仅仅“带出去”。
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: 从这地
  rationale: 直接对应介词、名词和指示词；“这地”在约瑟所处的语境中指埃及。
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: 到他……起誓所应许的那地
  rationale: 原文直述上帝所起的誓，赐地的内容由上下文补足。汉语若只说“起誓的地”语义不完整，因此用“起誓所应许”自然表达原文隐含的誓言内容，却不额外详述其方式。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: 向亚伯拉罕、向以撒和向雅各
  rationale: 重复“向”反映希伯来文介词的重复，并保留族长名单庄严、郑重的节奏。
theological_decisions:
- issue: פָּקֹד יִפְקֹד 所表达的上帝行动性质
  choice: 译为“上帝必定眷顾你们”，表达上帝确定会关注并为他们采取行动
  alternative: “上帝必定临到你们”或“上帝必定看顾你们”
  rationale: 该结构首先强调行动的确定性；动词在此不只是一般探访，也包含上帝对其子民的决定性关注与介入。“眷顾”保留这种较宽的盟约语义，不把经文限定为某一种具体行动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我就要死了”自然表达临终语境；“必定眷顾”兼顾原文的强调形式和盟约语境；重复“向”并保留“上去”，使族长公式和方向意象不被削弱。
