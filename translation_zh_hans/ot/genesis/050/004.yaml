  text: וַ/יַּֽעַבְרוּ֙ יְמֵ֣י בְכִית֔/וֹ וַ/יְדַבֵּ֣ר יוֹסֵ֔ף אֶל בֵּ֥ית פַּרְעֹ֖ה לֵ/אמֹ֑ר אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵ֣ינֵי/כֶ֔ם דַּבְּרוּ נָ֕א בְּ/אָזְנֵ֥י פַרְעֹ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: zh_hans
  text: 为他哀哭的日子过去以后[a]，约瑟对法老家里的人说：“我若在你们眼中蒙恩，请你们禀告法老[b]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“他的哀哭的日子过去以后”。
    reason: “他的哀哭”在此丧葬语境中可理解为“为他哀哭”；正文依上下文明确被哀悼者为雅各。
  - marker: b
    text: 原文直译为“在法老耳中说”。
    reason: 这是表示让法老听见、把话传达给法老的希伯来语惯用说法。
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: 过去以后
  rationale: 这里的 עבר 表示一段时间流逝、结束；“过去以后”清楚交代先结束哀哭期，随后约瑟开口请求。
- source_word: יְמֵי בְכִיתוֹ
  choice: 为他哀哭的日子
  rationale: בכי 本义是“哭泣、哀哭”；在丧葬语境中译作“为他哀哭”既自然，也比笼统的“服丧”更贴近原文。后缀所指为被哀悼的雅各。
- source_word: וַיְדַבֵּר יוֹסֵף
  choice: 约瑟……说
  rationale: דבר 是普通的“说、讲话”；现代汉语在引出直接引语时用“说”最自然。
- source_word: אֶל־בֵּית פַּרְעֹה
  choice: 对法老家里的人
  rationale: בית 在此指法老王室或宫廷中的人员，而非单指建筑物；“法老家里的人”保留“家”的意象，也明确说话对象是人。
- source_word: אִם־נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: 我若在你们眼中蒙恩
  rationale: 保留“在……眼中蒙恩”这一希伯来语惯用表达。נָא 的恳请语气由后面的“请”在汉语中自然体现。
- source_word: דַּבְּרוּ־נָא
  choice: 请你们禀告
  rationale: 复数命令式说明约瑟请求多人代为传话；“请”体现 נָא 的礼貌恳求，“禀告”符合臣下向法老传达请求的宫廷语境。
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: 禀告法老
  rationale: 原文直译为“在法老耳中”，意思是使法老亲耳听见，即把话传达给他；正文采用自然现代汉语，直译意象收入脚注。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出所传信息的引语标记；本节内容延续至下一节，因此以“说：”收尾。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“法老家里的人”避免把 בית 误解为建筑物；“禀告”体现宫廷上下关系，但不增添特定官职。引语在本节末不闭合，因为约瑟托人转达的话延续到下一节。
