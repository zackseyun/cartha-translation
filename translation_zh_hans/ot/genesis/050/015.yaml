base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: zh_hans
  text: 约瑟的哥哥们见父亲死了，就说：“万一约瑟怀恨我们，把我们从前加给他的一切恶事全都报复在我们身上呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万一”也可译作“恐怕”或“要是”。“全都报复”所译的原文用同一词根重复，以加强“必会偿还”的意思。
    reason: 说明לוּ所引出的忧惧性假设，并交代希伯来文不定式绝对式与限定动词同根重复的强调；不将其解释为神圣或公义的“报应”。
lexical_decisions:
- source_word: לוּ יִשְׂטְמֵנוּ
  choice: 恐怕约瑟会恨我们
  rationale: לוּ在此引出忧惧中的假设，结合后句可自然译为“恐怕”；שׂטם表示怀恨、敌视，“恨我们”简明贴切。
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: 把……全都报应在我们身上
  rationale: 同一词根的不定式绝对式加限定动词具有强调作用；“报应在我们身上”保留以恶相还、使后果临到他们的意味。
- source_word: כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: 我们从前加给他的一切恶
  rationale: גמל在此指施加或报以某种行为；“加给他”比单纯“对他做”更贴近其施予意味，同时保持自然庄重。
theological_decisions:
- issue: 兄长们的话究竟是断言还是忧惧性的设想
  choice: 译作“恐怕……会……”
  alternative: “要是约瑟恨我们……”
  rationale: לוּ在此语境表达他们父亲死后的担忧，而非确定宣告；“恐怕”自然保留其不安与不确定性。
- issue: 报复程度的强调
  choice: 以“全都”体现 וְהָשֵׁב יָשִׁיב 的强调
  alternative: “一定报复我们”
  rationale: 原文既有重复结构的强调，又紧接“一切恶”；“全都报应”避免把语气硬化为绝对预言，同时传达彻底偿还的忧惧。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“哥哥们”符合上下文中的亲属关系；引语以“恐怕”呈现人物内心的忧惧。
