base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/022.yaml
  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: zh_hans
  text: 约瑟和他父亲的全家仍住在埃及。约瑟活了一百一十岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 仍住
  rationale: ישׁב可指居住、停留。这里承接雅各去世后的叙事，以“仍住”自然表达约瑟继续居留埃及，也避免与后半句表示寿数的“活了”混淆。
- source_word: בְּמִצְרַיִם
  choice: 在埃及
  rationale: 按其处所义直接译出。
- source_word: הוּא וּבֵית אָבִיו
  choice: 约瑟和他父亲的全家
  rationale: 原文直译近于“他和他父亲的家”；בֵית在此指以家庭为核心的家属群体。“全家”符合现代汉语叙事，也保留整体家属之意。为避免汉语代词指向含混，用“约瑟”复现主语。
- source_word: וַיְחִי
  choice: 活了
  rationale: 此处引出约瑟一生的寿数，“活了”是现代汉语年龄陈述的自然表达。
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 一百一十岁
  rationale: 准确保留原文数值；汉语在陈述享年时用“岁”比“一百一十年”更自然。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
