  text: וַ/יַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִתֶ֥ם אֶת עַצְמֹתַ֖/י מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: zh_hans
  text: 约瑟叫以色列的子孙起誓，说：“上帝必定眷顾你们；那时，你们要把我的骸骨从这里带上去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע ... אֶת
  choice: 叫……起誓
  rationale: 该使役结构表示约瑟使以色列的子孙立誓；“叫……起誓”自然且准确。
- source_word: פָּקֹד יִפְקֹד
  choice: 必定眷顾
  rationale: 同一词根的不定式绝对式加限定动词表达强烈肯定；“必定”保留强调，“眷顾”在此体现上帝介入并照看其子民，而不局限于普通意义的探访。
- source_word: וְהַעֲלִתֶם
  choice: 那时，你们要……带上去
  rationale: 动词本义为“使上去、带上去”；结合前句所指上帝未来的眷顾，补出“那时”使时间关联在汉语中清楚，同时“要”保留誓言所带来的义务。
- source_word: עַצְמֹתַי
  choice: 我的骸骨
  rationale: “骸骨”准确表达死者遗骨，语体庄重而符合叙事场景。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留群体称谓的家族性表达，并与创世记语境相符。
theological_decisions:
- issue: פָּקֹד יִפְקֹד 所表达的上帝行动
  choice: 上帝必定眷顾你们
  alternative: 上帝必定看顾你们／上帝必定临到你们
  rationale: “眷顾”既能表达上帝记念和关注，也容纳随之而来的拯救行动，不把词义过窄地限定为探访或单纯照料。
- issue: וְהַעֲלִתֶם 的语气
  choice: 你们要把……带上去
  alternative: 你们必把……带上去／你们必须把……带上去
  rationale: 这是起誓内容所产生的约束性要求。“要”保留义务语气，又避免将希伯来语连接式完成体过度解释为纯预言或格外强硬的命令。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语言。“必定”再现希伯来语加强结构；分号和“那时”清楚呈现上帝眷顾与迁移骸骨之间的时间和逻辑联系。
