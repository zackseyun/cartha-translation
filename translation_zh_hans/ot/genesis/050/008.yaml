base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: zh_hans
  text: 还有约瑟的全家[a]、他的兄弟们和他父亲的全家；他们只把年幼的孩子[b]、羊群[c]和牛群留在歌珊地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全家”原文直译为“家”，这里指家庭或家眷，并非房屋。
    reason: lexical_alternative
  - marker: b
    text: “年幼的孩子”指小孩子。
    reason: lexical_clarification
  - marker: c
    text: “羊群”所对应的原文是集合名词，通常包括绵羊和山羊。
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכֹל בֵּית יוֹסֵף
  choice: 还有约瑟全家
  rationale: וְ承接上文继续列举随行者，译作“还有”符合现代汉语；בֵּית在此指以约瑟为中心的家庭或家眷，而非房屋，故译“全家”。
- source_word: וְאֶחָיו
  choice: 他的兄弟们
  rationale: אָח的复数在此指约瑟的男性兄弟；用“兄弟们”准确保留所指。
- source_word: וּבֵית אָבִיו
  choice: 和他父亲全家
  rationale: בֵּית אָבִיו指他父亲所属的家庭群体，不是建筑物；“他父亲全家”自然且保留家族范围。
- source_word: רַק
  choice: 只
  rationale: רַק标示限制或例外；将“只”置于“把”之后，既保留限制焦点，又符合自然汉语语序。
- source_word: טַפָּם
  choice: 年幼的孩子
  rationale: טַף通常指小孩子或幼童；“年幼的孩子”比笼统的“孩子”更明确，也比“小家伙”庄重。
- source_word: וְצֹאנָם
  choice: 羊群
  rationale: צֹאן是小型牲畜的集合称谓，主要包括绵羊和山羊；“羊群”是简洁自然的对应表达。
- source_word: וּבְקָרָם
  choice: 牛群
  rationale: בָּקָר指牛类或大型牲畜的集合；“牛群”与“羊群”相配并保留集合意义。
- source_word: עָזְבוּ
  choice: 留在
  rationale: 此处表示有意让孩子和牲畜留守，并非遗弃；结合地点补语译作“留在”最自然。
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: 在歌珊地
  rationale: 保留אֶרֶץ的地域含义；“歌珊地”是简明、传统且易懂的地名表达。
theological_decisions: []
