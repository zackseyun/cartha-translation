  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: zh_hans
  text: 他们来到约旦河对岸的亚达禾场[a][b]，就在那里举行了极其盛大而沉痛的哀悼[c]。约瑟为父亲守丧七天[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚达”可能与希伯来语“荆棘”或“刺丛”有关，但在这里是地名的一部分。
    reason: lexical_alternative
  - marker: b
    text: “约旦河对岸”也可译作“约旦河另一边”；原文没有在此明确说明是东岸还是西岸。
    reason: alternative_reading
  - marker: c
    text: 原文直译近似“大而极其沉重的哀悼”；“沉重”是形容哀痛强烈的说法。
    reason: cultural_note
  - marker: d
    text: 原文在这里从复数“他们哀悼”转为单数“他守丧”，很可能特指约瑟；有些译法按上下文处理为“他们守丧”。
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן הָאָטָד
  choice: 亚达禾场
  rationale: גֹּרֶן指打谷用的场地，译作“禾场”简洁自然；הָאָטָד在此构成地名，按专名音译为“亚达”，其普通名词意义另见脚注。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 约旦河对岸
  rationale: 保留עֵבֶר所表达的“另一边、对岸”，同时避免擅自判定东西方位。
- source_word: וַיִּסְפְּדוּ
  choice: 哀号
  rationale: ספד在丧葬语境中指公开举哀、哀悼；“哀号”能体现外在而强烈的丧礼哀哭。
- source_word: מִסְפֵּד גָּדוֹל וְכָבֵד מְאֹד
  choice: 大大哀号，哀痛极其深重
  rationale: 兼顾同源动词与名词的强调结构，并以“深重”自然传达כָבֵד的重量意象和悲痛程度。
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: 守丧
  rationale: 这是现代汉语表达举行并遵守一段丧期的自然说法，比逐字译作“作哀”清楚。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 直接保留原文所明示的守丧时长。
theological_decisions:
- issue: 复数叙事之后，וַיַּעַשׂ突然转为单数的主语
  choice: 正文明确作“约瑟”
  alternative: 译作“他”，或按同行众人顺译为“他们”
  rationale: 马所拉文本的动词为阳性单数；从上文叙事看，最自然的指代对象是约瑟。汉语若单写“他”容易指代不明，故明确姓名，同时用脚注说明原文形式及另一种处理。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“禾场”“守丧”保留古代生活与丧礼背景，又不显生硬；用句号呈现原文由众人举哀转到约瑟个人守丧的焦点变化。
