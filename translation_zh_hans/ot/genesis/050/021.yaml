  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: zh_hans
  text: 所以，现在不要害怕。我必亲自供养你们和你们幼小的孩子。”于是，约瑟安慰他们，对他们说安慰的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向他们的心说话”；这是表示安抚、劝慰的习语，也可译作“亲切地对他们说话”或“说话使他们安心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 兼顾连接词与时间副词的作用，承接前文，并引出约瑟最后的保证。
- source_word: אַל תִּירָאוּ
  choice: 不要害怕
  rationale: 自然、直接地表达希伯来语否定命令的安慰语气。
- source_word: אָנֹכִי
  choice: 我必亲自
  rationale: 独立人称代词带有强调作用；“亲自”突出约瑟本人承担供养责任。
- source_word: אֲכַלְכֵּל
  choice: 供养
  rationale: 本词表示持续供应生活所需，尤其是食物；“供养”简洁地贴合家庭处境。
- source_word: טַפְּכֶם
  choice: 你们的孩子
  rationale: 此词主要指幼小的孩子；现代汉语中“孩子”比“小孩子”更自然庄重，同时保留家庭性的含义。
- source_word: וַיְנַחֵם אֹתָם
  choice: 于是，约瑟安慰他们
  rationale: 按叙事承接关系译出；补出主语“约瑟”，避免现代汉语中指代不清。
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: 向他们说了宽心的话
  rationale: 这是字面为“向他们的心说话”的希伯来语习语，在此表示温柔、安抚、使人放心地说话。正文采用自然汉语，脚注保留原文意象。
