  text: וַ/יֹּ֧אמֶר אֲלֵ/הֶ֛ם יוֹסֵ֖ף אַל תִּירָ֑אוּ כִּ֛י הֲ/תַ֥חַת אֱלֹהִ֖ים אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: zh_hans
  text: 约瑟对他们说：“不要害怕，因为我岂是在上帝的位置上吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我是在上帝之下吗？”这里的希伯来语表达可作不同理解；按上下文，更可能是“我岂是在上帝的位置上吗？”。
    reason: 保留 תַּחַת אֱלֹהִים 的词义与惯用表达歧义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来叙事中 אמר 的连续式是引出直接话语的常规表达，现代汉语自然译作“说”。
- source_word: אֲלֵהֶם
  choice: 对他们
  rationale: 介词 אֶל 加第三人称复数后缀标明说话对象，译为“对他们”。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经语境中通行且易辨认的人名译法。
- source_word: אַל תִּירָאוּ
  choice: 不要害怕
  rationale: אַל 加未完成式在此表达禁止或劝止；“不要害怕”准确、自然，也符合约瑟安慰兄弟们的语境。
- source_word: כִּי
  choice: 省略为汉语意合衔接
  rationale: כִּי 引出约瑟劝他们不要害怕的理由；汉语中紧接的反问已经自然表达这一解释关系，若硬译“因为”反而显得生硬。
- source_word: הֲתַחַת אֱלֹהִים אָֽנִי
  choice: 我岂能代替上帝吗？
  rationale: 疑问词 הֲ 构成反问；תַּחַת אֱלֹהִים 在本语境中最自然地指取代上帝的位置或职分。“岂能”传达反问所隐含的否定，而“代替上帝”简洁表达该惯用义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处虽为复数形态，却按希伯来语常见用法指独一的上帝；采用中文通行称谓“上帝”。
theological_decisions:
- issue: 约瑟关于上帝位置之反问的含义
  choice: 约瑟否认自己能够取代上帝，擅自掌握最终审判或报复的权柄。
  alternative: 约瑟是在问自己是否处于上帝之下。
  rationale: תַּחַת 可表示“在……之下”，也可表示“代替、处于……的位置”。结合兄弟们害怕约瑟报复的上下文，后者更合适；脚注保留较直译的另一种理解，不把原文可能性完全抹去。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“不要害怕”清楚易懂；“我岂能……吗”保留原文反问语气，又不过度文言化。脚注标记置于对应句末。
