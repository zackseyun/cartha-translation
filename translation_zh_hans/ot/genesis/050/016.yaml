  yaml_path: translation/ot/genesis/050/016.yaml
  text: So they sent word to Joseph[a], saying, “Your father commanded before his death, saying,”
translation:
  language: zh_hans
  text: 于是，他们托人对约瑟说[a]：“你父亲临死以前曾吩咐说：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“于是，他们吩咐约瑟说。”希伯来语动词通常意为“吩咐、命令”，但这里很可能是指托人向约瑟传话。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוּוּ אֶל־יוֹסֵף
  choice: 他们托人对约瑟说
  rationale: צוה通常意为“吩咐、命令”，但与介词אֶל及随后转述的话连用时，此处更可能表示让人向约瑟传话。“托人对……说”符合上下文，也不把兄弟描写成命令约瑟。
- source_word: לֵאמֹר
  choice: 说
  rationale: 引出所传达的话；现代汉语用“说”自然地保留引语结构。
- source_word: אָבִיךָ
  choice: 你父亲
  rationale: 保留第二人称单数所属形式，直接指约瑟的父亲。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 这里保留צוה的通常语义，表明父亲留下了随后将要引用的嘱咐。
- source_word: לִפְנֵי מוֹתוֹ
  choice: 临死以前
  rationale: לִפְנֵי在此为时间意义；“临死以前”既表达死前，也符合父亲留下遗言的语境。
- source_word: לֵאמֹר
  choice: 说
  rationale: 第二次出现，用来引出下一节所载父亲吩咐的具体内容；保留它可呈现希伯来文层叠引语结构。
