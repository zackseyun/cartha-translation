  text: וַ/יָּ֣מָת יוֹסֵ֔ף בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִ֑ים וַ/יַּחַנְט֣וּ אֹת֔/וֹ וַ/יִּ֥ישֶׂם בָּ/אָר֖וֹן בְּ/מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: zh_hans
  text: 于是[a]，约瑟死了，享年一百一十岁。人们为他作了防腐处理[b]，把他安放在埃及的一口棺木[c]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约瑟死了……”句首连接词也可译作“又”或“然后”；“于是”体现全书结尾处承接前文的叙事语气。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“人们把他制成木乃伊”。这里的希伯来语动词指为遗体作防腐处理，在埃及背景中尤其如此。
    reason: cultural_note
  - marker: c
    text: 这里的希伯来语名词在别处也可指箱子或约柜；在本节的殡葬语境中，意思是“棺木”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות直接表示死亡；“死了”准确自然，不采用委婉说法。
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 享年一百一十岁
  rationale: 希伯来语以“……岁之子”表达年龄；中文以“享年”自然传达死时年龄，并保留完整数字。
- source_word: וַיַּחַנְטוּ
  choice: 人们为他作了防腐处理
  rationale: חנט指对遗体进行防腐处理，在埃及背景中与制作木乃伊有关；正文采用较少解释性的“作了防腐处理”。
- source_word: וַיִּישֶׂם
  choice: 把他安放
  rationale: שׂים意为放置、安放；“安放”符合殡葬语境和本段庄重语体。
- source_word: בָּאָרוֹן
  choice: 在……一口棺木里
  rationale: אָרוֹן可指箱、柜、约柜或棺木；防腐与安葬语境明确支持“棺木”。中文首次提及该容器时用“一口”自然。
- source_word: בְּמִצְרָיִם
  choice: 在埃及
  rationale: 准确传达地点；按希伯来语句法，说明棺木安放所在之处。
- source_word: וַ
  choice: 于是
  rationale: 句首叙事连接词既承接前文，也构成《创世记》的收束；“于是”在现代中文中自然体现这一推进和总结意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“享年”简洁表达死亡时年龄；“作了防腐处理”避免在正文中过度限定具体的埃及制作木乃伊程序，同时以脚注说明文化背景。
