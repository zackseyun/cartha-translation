  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: zh_hans
  text: 为他所定的四十天期满了，因为防腐处理所需的日子本来就是四十天。埃及人为他哀哭了七十天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: 为他所需的四十天满了
  rationale: מלא表示一段规定时间期满；保留“为他”的关系，同时用现代汉语自然表达时间已经届满。
- source_word: כִּי כֵן
  choice: 因为……本来就是这样
  rationale: 表达原文对四十天期限的解释，既保留因果关系，也体现惯常程序。
- source_word: יְמֵי הַחֲנֻטִים
  choice: 防腐所需的日子
  rationale: 结合上节语境，חנט指处理遗体以防腐；此译避免把该形式生硬理解为“防腐者”或“被防腐者”。
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: 为他哀哭
  rationale: 保留בכה“哭泣、哀哭”的具体情感动作，不扩大为泛指全部丧葬礼仪的“哀悼”。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 地名“埃及”在此集合性地指埃及百姓；中文直接译作“埃及人”更自然，并避免误解为国土本身哭泣。
- source_word: שִׁבְעִים יוֹם
  choice: 七十天
  rationale: 直接对应原文数词与时间名词。
