  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: zh_hans
  text: “你们要对约瑟这样说：‘求你饶恕你兄弟们的过犯和罪，因为他们恶待了你。如今，求你饶恕你父亲的上帝的仆人的过犯。’他们对约瑟说这些话时，约瑟哭了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: 求你饶恕
  rationale: שׂא（“承担、除去”）与“过犯、罪”连用时构成请求宽恕的惯用表达；“求你”体现 נָא 的恳求语气。
- source_word: פֶּשַׁע / חַטָּאת
  choice: 过犯和罪
  rationale: 保留两个相关而不完全相同的罪责用语：פֶּשַׁע 强调越界或悖逆，חַטָּאת 泛指罪。
- source_word: רָעָה גְמָלוּךָ
  choice: 他们恶待了你
  rationale: 原文直义近于“他们以恶待你”；此译自然表达其伤害行为，又不额外限定具体方式。
- source_word: אֱלֹהֵי אָבִיךָ
  choice: 你父亲之上帝
  rationale: 忠实保留“你父亲的上帝”这一关系表述；用“之”避免连续多个“的”造成歧义。
- source_word: בְּדַבְּרָם אֵלָיו
  choice: 他们对约瑟说这些话时
  rationale: 明确分词性时间关系和代词所指，同时保持原文“他们向他说话时”的含义。
theological_decisions:
- issue: 罪责用语是否合并
  choice: 分别译作“过犯和罪”
  alternative: 合并为“罪过”
  rationale: 原文并列 פֶּשַׁע 与 חַטָּאת，应保留其修辞和语义张力，不将两者压缩为单一概念。
- issue: אֱלֹהִים 的中文称谓
  choice: 上帝
  alternative: 神
  rationale: 二者在现代汉语圣经语境中均可成立；此处采用通行且庄重的“上帝”，不借此引入宗派性解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。引语层次清楚；“如今”承接恳求的推进，“哭了”保留原文简洁而有力的情感表达。
