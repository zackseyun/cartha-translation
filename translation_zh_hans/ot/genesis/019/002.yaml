  to: 他说：“诸位大人[a]，请到仆人的家里来，住一夜，洗脚。你们可以清早起来，继续赶路。”他们说：“不，我们要在广场[b]上过夜。”
  rationale: 修订在正文中依直接语境将称呼译为复数的“诸位大人”，同时以脚注保存单数敬称的可讨论性，避免把语法和叙事语境制造的张力错误地转成单数受话人。另将两项脚注分别锚定于所说明的词，并略微调整措辞，使之符合现代标准汉语的庄重自然叙事体。
