  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: zh_hans
  text: 他说：“诸位大人[a]，请到仆人的家里来，住一夜，洗脚。你们可以清早起来，继续赶路。”他们说：“不，我们要在广场[b]上过夜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诸位大人”也可按原文词形理解为单数敬称，译作“我主”。但本节后面的动词和代词均为复数，且罗得是在对两位来客说话。
    reason: alternative_reading
  - marker: b
    text: “广场”指城中宽阔、开放的公共场所，也可译作“公共空地”或“街市广场”。
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: 请
  rationale: 这一组合在此用于礼貌而恳切地引起对方注意；现代汉语用“请”表达最自然。
- source_word: אֲדֹנַי
  choice: 我主
  rationale: 这是罗得对来客的尊称。希伯来语书写形式容许单数敬称与复数称呼两种理解；“我主”保留原文形式上的歧义，后文复数代词则清楚表明他是在对两位来客说话。
- source_word: סוּרוּ נָא אֶל־בֵּית עַבְדְּכֶם
  choice: 请到仆人家里来
  rationale: סור在此指离开原来的路线、转往某处；现代汉语邀请来客时，“到……来”比直译“转过去”自然，并保留目的地。
- source_word: בֵּית עַבְדְּכֶם
  choice: 仆人家里
  rationale: 罗得以“你们的仆人”自称，表达谦恭；汉语无需重复所有格也能自然传达这一自谦说法。
- source_word: וְלִינוּ
  choice: 住一夜
  rationale: לין指留宿过夜；“住一夜”清楚、自然，符合款待场景。
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: 洗洗脚
  rationale: 保留古代待客习俗；动词重叠使邀请语气在现代汉语中自然柔和。
- source_word: וְהִשְׁכַּמְתֶּם
  choice: 清早起来
  rationale: 该动词表示一早起身；此处处于邀请安排中，不宜译成强制命令。
- source_word: וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: 继续赶路
  rationale: 这是现代汉语对沿原定路程离去的自然表达，也符合旅途语境。
- source_word: לֹא כִּי
  choice: 不
  rationale: 此处表达对邀请的拒绝并转述自己的安排；汉语单用“不”即可自然承载这一对比，机械加入“但是”反而生硬。
- source_word: בָרְחוֹב
  choice: 在广场上
  rationale: רְחוֹב在古代城市语境中通常指宽阔的公共空间，而不只是道路；“广场”较准确。
- source_word: נָלִין
  choice: 过夜
  rationale: 与前面的לין同根，均指夜间留宿；按汉语搭配，在“广场上”之后用“过夜”最自然。
theological_decisions:
- issue: אֲדֹנַי在这里是神圣称号，还是对来客的尊称
  choice: 按对来客的尊称处理，正文译“我主”
  alternative: 译作复数的“诸位先生”或“各位大人”；也可将形式理解为单数敬称
  rationale: 叙事中罗得面对两位来客，随后动词和代词均为复数，因此不是在正文中直接称呼上帝。与此同时，אֲדֹנַי的形式可被理解为单数敬称或复数称呼；“我主”不把这种形式上的张力完全消除。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。邀请部分保持罗得谦恭殷勤的语气；答复简短坚定。脚注同时说明称呼的真实歧义与“广场”的文化含义。
