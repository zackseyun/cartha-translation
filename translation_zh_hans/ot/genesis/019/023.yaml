  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: zh_hans
  text: 太阳已经升到那地上空[a]，罗得也已经到了琐珥。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那地”也可译作“大地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“太阳升到那地上空，罗得到了琐珥。”希伯来文的两个完成式动词也可按叙事中的一般过去动作来理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: 太阳
  rationale: 带定冠词的普通名词，现代汉语自然译作“太阳”。
- source_word: יָצָא
  choice: 已经升起
  rationale: יצא的基本义是“出去、出来”；以太阳为主语时，按语境自然表达为“升起”。“已经”体现完成体在叙事中的先成意味，但不把这种时序理解视为唯一可能。
- source_word: עַל הָאָרֶץ
  choice: 照耀那地
  rationale: עַל表示“在……之上、到……之上”，אֶרֶץ可指“地、土地、大地”。结合太阳升起的语境，用“照耀那地”自然传达太阳在该地之上的景象；“大地”作为词义上的另一可能保留在脚注中。
- source_word: וְלוֹט
  choice: 罗得也
  rationale: וְ连接两个并列情景；在现代汉语中用“也”自然衔接。לוֹט按通行译名译作“罗得”。
- source_word: בָּא
  choice: 已经到了
  rationale: בוא的Qal完成式表示“来、进入、到达”。此处“到了”最符合抵达琐珥的语境；“已经”表达在随后灾变发生前动作已经完成的叙事关系。
- source_word: צֹעֲרָה
  choice: 到了琐珥
  rationale: 专名צֹעַר带方向词尾־ָה，表示朝向该地；汉语以“到琐珥”自然表达。专名采用通行译名“琐珥”。
