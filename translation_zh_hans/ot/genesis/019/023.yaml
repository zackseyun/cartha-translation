translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“照耀那地”避免生硬直译“升到地上”，同时表达太阳升起在地面之上的希伯来语意象。以“已经”呈现两项动作在下一事件发生前均已完成，并用脚注保留一般过去式的可能。
