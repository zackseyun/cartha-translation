  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: zh_hans
  text: 这样，罗得的两个女儿都怀了她们父亲的孩子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从她们的父亲”，表明她们所怀的孩子出自她们的父亲。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: 怀了孕
  rationale: 希伯来语动词 הרה 的连续式未完成时第三人称阴性复数表示两个女儿怀孕了。“怀了孕”是自然、清楚的现代汉语，也准确表达进入怀孕状态。
- source_word: שְׁתֵּי בְנוֹת לוֹט
  choice: 罗得的两个女儿都
  rationale: שְׁתֵּי 是阴性数词“两个”，与“罗得的女儿”构成短语；加“都”自然传达两人无一例外，同时保留明确的“两个人”。
- source_word: מֵאֲבִיהֶן
  choice: 从她们的父亲
  rationale: 介词 מִן 表示来源，此处指身孕来自她们的父亲。直译为“从她们的父亲”保留原文的来源表达及其直白、令人不安的张力。
