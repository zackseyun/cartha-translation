  yaml_path: translation/ot/genesis/019/007.yaml
  text: And he said, “Please, my brothers, do not do evil.”
translation:
  language: zh_hans
  text: 他说：“弟兄们，请不要作恶。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: 弟兄们
  rationale: 这是带有恳求意味的直接称呼；“弟兄们”既保留字面亲属称谓，也可自然表达对同族或同群体男子的亲近称呼。
- source_word: תָּרֵעוּ
  choice: 作恶
  rationale: 该词在此为第二人称复数，意为行恶、做坏事；“作恶”简洁保留其宽泛的道德含义，不把具体恶行提前限定出来。
- source_word: אַל־נָא
  choice: 请不要
  rationale: אַל表达禁止，נָא增添恳求语气；合译为“请不要”自然而准确。
theological_decisions:
- issue: 是否具体说明所禁止的恶行
  choice: 保留概括性的“作恶”
  alternative: 译为“不要做这种恶事”或明确指出上下文中的具体行为
  rationale: 原文此节仅用宽泛动词תָּרֵעוּ，没有在句内具体说明恶行；保留概括表达可避免把上下文解释直接写入正文。
translation_notes:
  register: 采用简洁、庄重而现代的叙事语言。“弟兄们”保留原文亲近而恳切的称呼；全句语序自然，适合公开诵读。
