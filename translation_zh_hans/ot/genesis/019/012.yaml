base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: zh_hans
  text: 那些人对罗得说：“你这里还有谁？女婿、你的儿子和女儿，以及城里凡属你的人，都把他们带出这地方。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文使用普通名词“人”，并未在本节直接称他们为天使；译文保留这一叙事称谓。“那些人”也自然承接上文已出现的人物。
- source_word: עֹד מִי לְךָ פֹה
  choice: 你这里还有什么人？
  rationale: 这是询问还有哪些与罗得有关的人在此；现代汉语用“还有什么人”自然表达关系和范围，并不把 לְךָ 生硬译成所有权。
- source_word: חָתָן
  choice: 女婿
  rationale: 该词可指新郎或女婿；本段语境涉及罗得女儿的婚配对象，因此“女婿”最合适。汉语名词本身不强制表达单复数，也避免无根据地限定人数。
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: 你的儿子和女儿
  rationale: 直接保留第二人称所属关系和两个复数亲属类别；汉语无需另加复数标记。
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: 以及城里凡属你的人
  rationale: 字面范围可广至“凡属于你的”，但上下文要求把人带离城，因此正文采用指人的自然表达，同时以脚注保留较宽的字面可能。
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: 都要带出这地方
  rationale: 阳性单数命令式是对罗得发出的命令，宾语由前列诸人补足。“带出”准确表达使人离开该地；“这地方”在汉语中自然指向当前所处之地。
theological_decisions:
- issue: 是否在正文中把 הָאֲנָשִׁים 明说为天使
  choice: 译作“那些人”
  alternative: “那些天使”或“那些使者”
  rationale: 上下文表明他们具有天使身份，但本节原文仍用普通的“人”。正文不提前替叙事作神学身份说明，以保留原文措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“罗得”沿用通行圣经人名译法；问句和命令句保持叙事的紧迫感，同时不补入原文未明说的“天使”身份。
