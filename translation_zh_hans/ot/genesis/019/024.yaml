base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: zh_hans
  text: 于是，耶和华将硫磺[a]和火从耶和华那里、从天上[b]如雨般降在所多玛和蛾摩拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “硫磺”所译的希伯来词指硫。
    reason: 说明原词的具体物质含义。
  - marker: b
    text: 希伯来文直译为“从耶和华那里，从天上”。原文第二次出现“耶和华”，这里照原文保留，没有将它简化或改写。
    reason: 提示原文不寻常的神名重复及其被忠实保留。
lexical_decisions:
- source_word: וַיהוָה
  choice: 于是，耶和华
  rationale: 叙事性的 וַ 推进事件，译作“于是”符合现代汉语叙事习惯；יהוה 采用中文圣经传统且通行的“耶和华”作为专名译法。
- source_word: הִמְטִיר
  choice: 使……如雨降在
  rationale: 该使役词形表达“使之下雨、如雨降下”。此译法保留从上方密集降落的雨降意象，也清楚表达耶和华是行动主体。
- source_word: עַל סְדֹם וְעַל עֲמֹרָה
  choice: 降在所多玛和蛾摩拉
  rationale: עַל 表示降落所及的对象；两处地名采用现代中文圣经中的通行译名。希伯来文在两个地名前重复介词，汉语合并为一个“在”，不改变两城同为受灾对象的意义。
- source_word: גָּפְרִית
  choice: 硫磺
  rationale: 该词指硫；“硫磺”是普通现代汉语中自然、准确且容易理解的名称。
- source_word: וָאֵשׁ
  choice: 和火
  rationale: אֵשׁ 的直接对应词为“火”；连接词按现代汉语自然译作“和”。
- source_word: מֵאֵת יְהוָה
  choice: 从耶和华那里
  rationale: 明确保留来源表达及第二次出现的神名，不将其省略，也不解释为“从自己那里”。
- source_word: מִן הַשָּׁמָיִם
  choice: 从天上
  rationale: שָׁמַיִם 在希伯来语中为复数形式，但汉语通常用“天上”自然表达其空间来源；若机械译作“诸天”，在本句中容易产生并非原文重点的宇宙层级意味。
theological_decisions:
- issue: “耶和华……从耶和华那里”的神名重复
  choice: 在正文中照原文保留两次“耶和华”
  alternative: 简化为“耶和华使硫磺和火从天上如雨降下”，或改写为“从自己那里”
  rationale: 希伯来文本明确重复 יהוה。保留这一不寻常的表述，可避免替读者预先判定其代理关系或神学含义，并保存原文的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“使……如雨降在”保留 הִמְטִיר 的雨降意象；“从耶和华那里、从天上”刻意保留原文重复神名所形成的张力。逗号用于帮助读者辨认两个并列的来源短语。
