base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: zh_hans
  text: 小女儿也生了一个儿子，给他起名叫便·亚米[a]。他就是亚扪人[b]的祖先，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “便·亚米”可能意为“我族之子”或“我亲族之子”。
    reason: lexical_alternative
  - marker: b
    text: “亚扪人”原文直译为“亚扪的子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: 小女儿
  rationale: 带定冠词的形容词在此作名词用，结合上下文指罗得的小女儿；译出“女儿”可使现代汉语指代清楚。
- source_word: גַם הִוא
  choice: 也
  rationale: 表示小女儿和大女儿一样生了儿子；“也”简洁自然地传达附加强调。
- source_word: יָלְדָה בֵּן
  choice: 生了一个儿子
  rationale: 准确而自然地表达希伯来语叙事中“生子”的惯用说法。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: 给他起名叫
  rationale: 以现代汉语自然表达希伯来语“称他的名为”的命名公式。
- source_word: בֶּן עַמִּי
  choice: 便·亚米
  rationale: 保留专名的音译，并在脚注说明名称可能具有的词义。
- source_word: הוּא אֲבִי
  choice: 他就是……的祖先
  rationale: 此无动词句把便·亚米认定为一个族群的先祖；“祖先”比字面的“父亲”更符合现代汉语的族源语境，“就是”保留认定语气。
- source_word: בְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 这是现代汉语对该族群自然清楚的称呼；字面的谱系表达“亚扪的子孙”收入脚注。
- source_word: עַד הַיּוֹם
  choice: 直到今日
  rationale: 保留希伯来叙事中表示该族群身份延续到叙述者时代的惯用时间表达。
