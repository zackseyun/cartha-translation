  text: וַ/תַּשְׁקֶ֧יןָ אֶת אֲבִי/הֶ֛ן יַ֖יִן בַּ/לַּ֣יְלָה ה֑וּא וַ/תָּבֹ֤א הַ/בְּכִירָה֙ וַ/תִּשְׁכַּ֣ב אֶת אָבִ֔י/הָ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קׄוּמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: zh_hans
  text: 那一夜，她们让父亲喝了酒；大女儿进去与父亲同寝。她躺下、起来，他都不知道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她躺下时和起来时，他都没有察觉。”原文也可较直译为：“在她躺下和她起来的时候，他不知道。”
    reason: 原文两个介词短语既可按时间关系译出，也可保留较形式对应的表达；“知道”在此亦可理解为“察觉”。
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: 她们让父亲喝了酒
  rationale: 这是 שׁקה 的使役形，表示使人喝或给人喝；“让父亲喝了酒”自然地保留了使役含义。
- source_word: יַיִן
  choice: 酒
  rationale: 在本语境中指葡萄酒；现代汉语叙事用“酒”自然简洁，也没有必要另加原文未明说的限定。
- source_word: בַּלַּיְלָה הוּא
  choice: 那一夜
  rationale: 保留特指的时间表达，并符合庄重、自然的叙事语体。
- source_word: הַבְּכִירָה
  choice: 大女儿
  rationale: 该阴性形式直指头生的女儿；结合上下文，“大女儿”比“长子女”或“头生的”更自然清楚，同时保留姐妹间的长幼次序。
- source_word: וַתָּבֹא
  choice: 进去
  rationale: 该动词在此表示她进入父亲所在之处；“进去”符合汉语叙事视角，且不额外强化性含义。
- source_word: וַתִּשְׁכַּב אֶת אָבִיהָ
  choice: 与父亲同寝
  rationale: שׁכב אֶת 在这里是性关系的委婉表达；“同寝”保持原文的含蓄和庄重，不采用较口语化的“睡”。
- source_word: וְלֹא יָדַע
  choice: 他都不知道
  rationale: ידע 在这里表示察觉或知情；保留“不知道”，并由后面的两个动作明确其所不知道的事。
- source_word: בְּשִׁכְבָהּ וּבְקוּמָהּ
  choice: 她躺下、起来
  rationale: 两个带介词的动词不定式结构可表示动作发生之时；主文用简洁的并列结构保留原文对称性，并避免补入原文此处未重述的“与他”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同寝”承接原文的性委婉语；“大女儿”依据上下文自然表达阴性“头生者”。脚注标记置于所说明的末句之后。
