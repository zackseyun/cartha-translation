base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: zh_hans
  text: 但他仍在拖延，那些人[a]就抓住他的手、他妻子的手和他两个女儿的手，因为耶和华怜悯他；他们把他带出去，安置在城外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“那些人”；从上下文看，他们是天使。
    reason: 保留本节的原文称谓，同时说明上下文中的身份。
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: 仍然迟延
  rationale: 该动词表示耽搁、拖延；“仍然迟延”既保留叙事中的紧迫感，也不把动作缩窄为单纯的内心犹豫。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 本节原文使用普通名词“人（复数）”，没有直接称他们为天使；正文保留这一叙事称谓。
- source_word: וַיַּחֲזִקוּ
  choice: 抓住
  rationale: 此处表示用力把住，带有紧急施救的力度；“抓住”自然明确。
- source_word: בְּיָדוֹ וּבְיַד אִשְׁתּוֹ וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: 他的手、他妻子的手和他两个女儿的手
  rationale: 尽量保留原文三次以“手”为中心的并列结构，同时采用自然的现代汉语表达。
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: 因为耶和华怜悯他
  rationale: 介词在此表达行动的原因；חמלה表示怜悯、怜惜。“因为耶和华怜悯他”清楚呈现施救的神圣动因。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的专名形式，明确对应希伯来文神名。
- source_word: וַיֹּצִאֻהוּ
  choice: 他们把他带出去
  rationale: 使役形表示使他出去；“带出去”符合救援场景和现代汉语习惯。
- source_word: וַיַּנִּחֻהוּ מִחוּץ לָעִיר
  choice: 安置在城外
  rationale: 该使役动词在此表示把人放置于某处；“安置”比“留下”更少带有弃置意味，并准确表达结果位置。
theological_decisions:
- issue: 施救者的叙事身份
  choice: 那些人
  alternative: 那些天使
  rationale: 虽然上下文表明他们是天使，但本节希伯来文仍称其为“那些人”。正文不以解释取代原文称谓，并用脚注交代上下文身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号连接施救的两个连续阶段，保留原文的叙事推进；避免使用较古雅的“耽延”“拉住”等表达。
