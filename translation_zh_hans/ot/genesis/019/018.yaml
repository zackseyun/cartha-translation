  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: zh_hans
  text: 罗得却对他们说：“不，求你们了，诸位大人！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却……说
  rationale: 该形式推进叙事；结合上文罗得对两位使者所提安排的反对，用“却”自然表达转折回应。
- source_word: לוֹט
  choice: 罗得
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: אֲלֵהֶם
  choice: 对他们
  rationale: 忠实保留介词与第三人称阳性复数后缀，不在正文中将所指对象扩写为“两位使者”。
- source_word: אַל
  choice: 不
  rationale: 此处没有明说动词，是对前述安排的强烈否定；中文以“不”简洁自然地表达拒绝。
- source_word: נָא
  choice: 求你们了
  rationale: 该恳求语气词在此表达迫切请求；结合复数受话者译作“求你们了”，比单独的“请”更能体现恳求语气。
- source_word: אֲדֹנָי
  choice: 我主们
  rationale: 上下文中的“他们”指两位来客，故正文按复数敬称处理；“我主们”保留 אֲדוֹן 的词义及其复数指向，虽略带古雅色彩，却比“先生们”更贴近原文。
theological_decisions:
- issue: אֲדֹנָי 应理解为对两位来客的复数敬称，还是对神的单数称呼
  choice: 正文作对两位来客的复数敬称“我主们”
  alternative: “我主”或“主啊”，理解为单数、可能指向神的称呼
  rationale: אֲלֵהֶם“对他们”明确使用复数，紧邻上下文也以两位来客为受话者，因此正文以复数敬称最合乎句法语境；但 אֲדֹנָי 的形式容许单数尊称或神圣称号的传统理解，故以脚注保留，不将张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主们”有意保留原文复数敬称及其社会语用色彩；脚注明示单数读法。
