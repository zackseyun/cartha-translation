  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: zh_hans
  text: 他对他说：“你看，我也应允你这件事[a]；我不倾覆你所说的那座城。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “应允你这件事”直译为“我抬起了你的脸”；这是希伯来语惯用语，意思是向人施恩、表示眷顾，因而答应其请求。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 保留引起对方注意并郑重回应的语篇功能；现代汉语中简洁自然。
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: 给你情面
  rationale: 希伯来语直译为“抬起你的脸”，在此表示顾念对方、接受其请求。“给你情面”既自然，也保留该表达所含的人际恩待意味。
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: 在这件事上也
  rationale: דָּבָר 指罗得刚才提出的事，גַּם 的附加意味以“也”表达，避免把它误作表示恩惠本身的词。
- source_word: לְבִלְתִּי הָפְכִּי
  choice: 不倾覆
  rationale: 保留 הפך“翻转、倾覆”的具体意象，并在汉语中表达说话者将不使该城遭受覆灭。
- source_word: הָעִיר אֲשֶׁר דִּבַּרְתָּ
  choice: 你所说的这座城
  rationale: 忠实表达定指的“城”和关系从句；补出量词“座”符合现代汉语习惯。
theological_decisions: []
