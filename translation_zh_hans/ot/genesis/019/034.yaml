  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/תֹּ֤אמֶר הַ/בְּכִירָה֙ אֶל הַ/צְּעִירָ֔ה הֵן שָׁכַ֥בְתִּי אֶ֖מֶשׁ אֶת אָבִ֑/י נַשְׁקֶ֨/נּוּ יַ֜יִן גַּם הַ/לַּ֗יְלָה וּ/בֹ֨אִי֙ שִׁכְבִ֣י עִמּ֔/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: zh_hans
  text: 到了第二天，长女对小女儿说：“你看，昨夜我与父亲同寝了。今夜我们再让他喝酒；然后你来与他同寝，好让我们藉着父亲存留后代[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“让我们从（或：藉着）父亲存留种子”；“种子”在这里指后代。
    reason: 说明希伯来语生育习语，以及“从父亲”所表达的来源关系。
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: 到了第二天
  rationale: 以自然的现代汉语承接叙事，同时保留事件推进到次日的意味。
- source_word: הַבְּכִירָה
  choice: 长女
  rationale: 该阴性名词指家中年长、居首生地位的女儿；“长女”简洁地保留出生次序。
- source_word: הַצְּעִירָה
  choice: 小女儿
  rationale: 该阴性形容词在此作名词使用，与“长女”形成清楚对应；结合上下文补出“女儿”更符合现代汉语。
- source_word: הֵן
  choice: 你看
  rationale: 保留引起对方注意的语用功能，又避免使用古雅的“看哪”。
- source_word: שָׁכַבְתִּי אֶמֶשׁ אֶת־אָבִי
  choice: 昨夜我与父亲同寝了
  rationale: “同寝”保留 שׁכב 在此处含蓄表达性关系的委婉语气，不将原文改写得过分直白。
- source_word: נַשְׁקֶנּוּ יַיִן גַּם הַלַּיְלָה
  choice: 今夜我们再让他喝酒
  rationale: “让他喝酒”体现使役形式，“再”传达 גַּם 所表示的重复、追加之意。
- source_word: וּבֹאִי שִׁכְבִי עִמּוֹ
  choice: 然后你进去与他同寝
  rationale: “进去”表达 בואי 在场景中的趋入动作，“与他同寝”延续原文委婉而沉重的措辞。
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: 好使我们从父亲留下后代
  rationale: 将“使……存活”和“种子”的生育习语合译为现代汉语可理解的“留下后代”，同时保留 מִן 所表达的来源关系“从父亲”。
