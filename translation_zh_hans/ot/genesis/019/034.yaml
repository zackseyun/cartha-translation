revisions:
- from: 到了第二天，长女对小女儿说：“你看，昨夜我与父亲同寝了。今夜我们再让他喝酒，然后你进去与他同寝，好使我们从父亲留下后代[a]。”
  to: 到了第二天，长女对小女儿说：“你看，昨夜我与父亲同寝了。今夜我们再让他喝酒；然后你来与他同寝，好让我们藉着父亲存留后代[a]。”
  rationale: 修订末句以自然现代汉语准确表达“存留后代”及其“从／藉着父亲而来”的来源关系；将“进去”改为“来”，避免在命令式动词中增添未明说的方向信息。其余措辞保持原译的准确性、庄重性和委婉表达。
