  text: וַ/תֵּ֤לֶד הַ/בְּכִירָה֙ בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ מוֹאָ֑ב ה֥וּא אֲבִֽי מוֹאָ֖ב עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: zh_hans
  text: 大女儿生了一个儿子，给他起名叫摩押；他就是直到今日摩押人的始祖。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: 希伯来语 ילד 的 Qal 形式在此表示“生、生下”；现代汉语叙事中“生了一个儿子”自然简洁。
- source_word: הַבְּכִירָה
  choice: 大女儿
  rationale: 阴性单数实词化形式指“年长的／头生的女子”；结合上下文，所指是罗得的大女儿。译作“大女儿”比“长女”更口语自然，也清楚呈现关系。
- source_word: בֵּן
  choice: 一个儿子
  rationale: 直译为“儿子”；加量词“一个”符合现代汉语表达。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: 给他起名叫
  rationale: 原文惯用语直为“叫他的名”；“给他起名叫”既忠实表达命名行为，也符合现代汉语习惯。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: הוּא
  choice: 他就是
  rationale: 独立代词回指刚出生并得名的儿子；“他就是”保留原文的强调和说明语气。
- source_word: אֲבִי מוֹאָב
  choice: 摩押人的始祖
  rationale: 字面为“摩押之父”，语境中“摩押”以祖先之名代指由他而出的族群；“始祖”准确传达族群祖先之义，避免中文把“摩押”误解为单一人物或地区。
- source_word: עַד הַיּוֹם
  choice: 直到今日
  rationale: 这是表示延续到叙述者当代的固定表达；“直到今日”自然、庄重，并保留原文时间视角。
theological_decisions:
- issue: “摩押之父”所指为何
  choice: 摩押人的始祖
  alternative: 摩押之父
  rationale: 此处涉及族源叙事，而非神学教义判断。中文若机械译为“摩押之父”容易含混；译出“摩押人”体现希伯来语以祖名代族名的用法，并保留其祖先含义。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“大女儿”承接上下文所指；“始祖”表达族群祖先关系。句式简洁，保留原文两个连续叙事动作及结尾“直到今日”的历史视角。
