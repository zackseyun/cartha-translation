id: GEN.19.22
reference: Genesis 19:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: zh_hans
  text: “快逃到那里去，因为在你到达那里以前，我什么也不能做。”因此，那城名叫琐珥[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琐珥”这个名字在希伯来语中与“小”或“微小”一词相近；参见创世记19:20。
    reason: cross_reference
  - marker: b
    text: 原文更直译为：“他称那城的名为琐珥。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: 快
  rationale: 该词是表达紧迫性的祈使形式；“快”与后面的命令连用，符合现代汉语习惯，也保留催促语气。
- source_word: הִמָּלֵט
  choice: 逃到……去
  rationale: 该词为מלט的尼法勒祈使式，意为“逃脱、逃命”；结合方向副词שָׁמָּה，译作“逃到那里去”自然且准确。
- source_word: שָׁמָּה
  choice: 那里
  rationale: 这是带方向意味的副词，可表示“到那里”；在汉语中借助“到……去”和“到达”体现方向。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述命令的原因；“因为”在现代汉语中清楚自然。
- source_word: לֹא אוּכַל
  choice: 我……不能
  rationale: 直陈说话者的不能，保留原文所呈现的限制，不改写为“不愿”或“不可以”。
- source_word: לַעֲשׂוֹת דָּבָר
  choice: 什么也不能做
  rationale: 原文近于“不能做一件事”；否定句中译为“什么也不能做”既自然，又保留范围未受限定的表达。
- source_word: עַד בֹּאֲךָ
  choice: 在你到达……以前
  rationale: 原文为“直到你来到”；汉语用“在……以前”与主句否定形式搭配，准确表达截止条件。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 这是引出地名由来的推论公式；“因此”简洁而庄重。
- source_word: קָרָא שֵׁם הָעִיר
  choice: 那城名叫
  rationale: 原文形式上是第三人称阳性单数“他称那城的名”；正文采用自然的汉语命名表达，同时用脚注保留较直译形式及其主语含混性。
- source_word: צֹעַר
  choice: 琐珥
  rationale: 按现代中文圣经地名的通行音译处理，并在脚注说明其与“小、微小”相关的希伯来语文字联系。
theological_decisions:
- issue: 审判语境中“我不能”的陈述
  choice: 我什么也不能做
  alternative: 我不可以做任何事／我必不做这事
  rationale: לֹא אוּכַל直接表达“我不能”。译文不把这种不能解释为许可、意愿或特指某一行动，从而保留叙事中的神学张力。
- issue: 给城命名者的身份
  choice: 正文采用“那城名叫”，不明确补出命名者
  alternative: 他给那城起名叫琐珥
  rationale: 希伯来文动词为第三人称阳性单数，但此处命名者的具体所指并不完全明说；自然的无主语汉语表达避免擅自确定其身份，较直译形式列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“快逃到那里去”保留连续命令的紧迫感；“在你到达那里以前”清楚呈现时间限制；正文用“那城名叫”避免生硬直译，脚注则保存原文的命名句式。
