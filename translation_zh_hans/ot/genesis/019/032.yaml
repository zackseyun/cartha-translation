base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: zh_hans
  text: 来，我们让父亲喝酒，再与他同房，好让我们从父亲那里保留后代。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代”原文直译为“种子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: 来
  rationale: 此处是由“行走”动词形成的劝行动语，用来催促对方共同采取行动；“来”在现代汉语中自然地保留了这一语气。
- source_word: נַשְׁקֶה אֶת־אָבִינוּ יַיִן
  choice: 我们让父亲喝酒
  rationale: שקה 的使役式表示使某人饮用或给某人喝；“让父亲喝酒”简洁自然，并保留使役含义。
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: 再与他同寝
  rationale: שכב 与 עִם 连用在此是性关系的委婉说法；“同寝”保留原文的委婉与庄重，同时语义清楚。
- source_word: וּנְחַיֶּה
  choice: 好……留下
  rationale: 此处的强意式表达目的，חיה 的使役/加强词干有使存活、保存之意；结合后面的“后代”，“留下”自然表达延续血脉。
- source_word: מֵאָבִינוּ
  choice: 从父亲
  rationale: 介词 מִן 表示来源；“从父亲”直接保留后代来源于父亲这一含义。
- source_word: זָרַע
  choice: 后代
  rationale: זֶרַע 本义为“种子”，也常指子嗣或后裔；本节语境明确指繁衍所得的后代。
theological_decisions:
- issue: “留下后代”的目的与来源表达
  choice: 好从父亲留下后代
  alternative: 好借父亲延续后代
  rationale: 选择“从父亲”以保留 מִן 的来源含义，不将其仅解释为手段；“留下后代”传达使后裔存续的目的，但不额外美化人物行为。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“同寝”保留希伯来文的性行为委婉语，避免过度直白或过分古奥；句中两个劝勉式动作用“让……再……”自然衔接。
