base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: zh_hans
  text: 后来，罗得从琐珥上去，住在山中；他的两个女儿和他在一起。因为他害怕住在琐珥，他和他的两个女儿就住在一个洞里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文为“在那个洞里”，其中“洞”带定冠词；这定冠词可能只是指他所住的那个特定洞穴。汉语首次提到这样的住处时，通常说“一个洞里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל לֹוט מִצּוֹעַר
  choice: 罗得从琐珥上去
  rationale: עלה明确包含向上移动的地势含义；“上去”在现代汉语中自然保留这一点，不弱化为单纯的“离开”或“迁出”。
- source_word: וַיֵּשֶׁב בָּהָר
  choice: 住在山中
  rationale: ישב在这里表示居住；单数הַר可指山区或山地。“山中”既贴近原文单数形式，也能自然表达所处地带，避免生硬的“住在山里某座山中”。
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: 他的两个女儿也和他在一起
  rationale: 原文是无动词并列结构；补出“在”符合现代汉语习惯，“也”体现女儿随他同住的附加关系。
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: 因为他不敢住在琐珥
  rationale: יָרֵא字面为“害怕”；与居住不定式连用时，“不敢住”简洁自然地表达因惧怕而不愿居住，并保留因果关系。
- source_word: וַיֵּשֶׁב בַּמְּעָרָה
  choice: 就住进了一个洞里
  rationale: 原文名词带定冠词，形式上是“那个洞”；但该洞在叙事中首次出现，现代汉语通常用“一个洞”引入。动趋式“住进”顺接他从琐珥迁往山中的动作。
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: 他和他的两个女儿都住在那里
  rationale: 原文以同位结构重申洞中居住者。译文补出谓语并用“都”保持收束性的强调，避免汉语中残缺生硬的句尾。
