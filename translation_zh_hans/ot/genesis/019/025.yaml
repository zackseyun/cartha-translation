  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: zh_hans
  text: 他倾覆[a]了那些城，也毁灭了整个平原[b]、城中所有的居民和地上的一切植物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“翻覆”。希伯来语动词可突出灾难性翻转、倾覆的意象。
    reason: lexical_alternative
  - marker: b
    text: 这里的“平原”指约旦河平原一带。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: 倾覆
  rationale: 希伯来语 הפך 在此表示灾难性的翻覆或倾覆。“倾覆”既保留具体意象，也比笼统的“毁灭”更贴近原文。
- source_word: הֶעָרִים הָאֵל
  choice: 那些城
  rationale: 指示词 אֵל 回指上文已经提到的城；“那些城”符合现代汉语叙事表达。
- source_word: כָּל הַכִּכָּר
  choice: 整个平原
  rationale: כִּכָּר 在《创世记》的这一语境中指约旦河平原一带；“整个平原”自然且准确，避免按字面译作难以理解的“整个圆圈”。
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: 城中所有的居民
  rationale: ישב 的分词形式指住在城里的人；这一译法简洁自然，并保留“所有”的范围。
- source_word: צֶמַח הָאֲדָמָה
  choice: 地上生长的一切
  rationale: צֶמַח 指从土壤萌发、生长的植物，אֲדָמָה 指土地或地面；此译法以自然汉语表达其集合意义，同时保留与土地生长的联系。
theological_decisions:
- issue: 单数动词的隐含主语
  choice: 译作“他”，不在本节明说主语身份
  alternative: 明确译作“上帝”或“耶和华”
  rationale: 本节希伯来文使用单数动词，却未在该分句中明说主语；上文语境表明行动者是耶和华。译作“他”既保持上下文连贯，也不把本节省略的信息直接补入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“倾覆”保留原文的具体灾变意象；并列结构紧凑，清楚呈现审判所涉及的城、地域、居民和地上植物。
