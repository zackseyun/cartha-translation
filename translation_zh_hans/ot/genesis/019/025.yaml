- from: 他倾覆了那些城[a]、整个平原[b]、城中所有的居民，以及地上生长的一切。
  to: 他倾覆[a]了那些城，也毁灭了整个平原[b]、城中所有的居民和地上的一切植物。
  rationale: 修订将动词词汇说明的脚注锚定于“倾覆”，并以自然的汉语句法表达原文中同一灾难性行动所及的城、平原、居民与地上植物。“也毁灭了”并非增添另一行动者或事件，而是为避免“倾覆居民”的不自然搭配，对原文灾难性动词在不同受事上的结果作必要的汉语展开。
