  text: וַ/יַּשְׁקֵ֗ף עַל פְּנֵ֤י סְדֹם֙ וַ/עֲמֹרָ֔ה וְ/עַֽל כָּל פְּנֵ֖י אֶ֣רֶץ הַ/כִּכָּ֑ר וַ/יַּ֗רְא וְ/הִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָ/אָ֔רֶץ כְּ/קִיטֹ֖ר הַ/כִּבְשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: zh_hans
  text: 他向所多玛、蛾摩拉和整个平原地区眺望。他看见，看哪，那地的烟正往上升，好像炉子[a]冒出的烟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“窑”。
    reason: כִּבְשָׁן 可指炉子，也可特指烧制材料的窑；上下文无法要求只取其中一义。
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: 眺望
  rationale: 该动词在此表示从较高处向外或向下察看；“眺望”自然地传达远望一片地域的画面，又不把垂直方向说得过死。
- source_word: עַל פְּנֵי
  choice: 向……和……整个……地区
  rationale: 这个空间习语本义涉及“在……表面之上”，结合“眺望”译为“向”并用“整个地区”表达视线所及范围，避免生硬直译。
- source_word: סְדֹם וַעֲמֹרָה
  choice: 所多玛、蛾摩拉
  rationale: 采用现代中文圣经传统中通行且易识别的地名译法。
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: 整个平原地区
  rationale: כִּכָּר 在本段指约旦河平原一带；“整个平原地区”兼顾地理含义和自然中文，不额外限定其精确边界。
- source_word: וַיַּרְא
  choice: 他看见
  rationale: 直接保留 ראה 的基本意义和叙事动作顺序。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示突然、鲜明所见的语篇功能；虽略带庄重色彩，在圣经叙事中仍清楚易懂。
- source_word: עָלָה
  choice: 正往上升
  rationale: 表达亚伯拉罕眼前所见烟气持续上腾的动态景象。
- source_word: קִיטֹר
  choice: 烟
  rationale: 采用该词在本语境中的基本义，不擅自添加“浓密”或“滚滚”等原文未明说的修饰。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 上下文指正在被眺望、遭毁灭的当地地域，而不是全球意义的“地球”；“那地”也符合中文叙事指代。
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: 好像炉子冒出的烟
  rationale: כִּבְשָׁן 可指炉或窑；正文用普通读者熟悉的“炉子”，并以脚注保留“窑”这一真实词义可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留“他看见，看哪”的原文重复与突显效果，没有将其压缩成单纯的“只见”；脚注标记紧接存在词义差异的“炉子”。
