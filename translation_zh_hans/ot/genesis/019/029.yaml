base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: zh_hans
  text: 当上帝毁灭平原各城时，上帝记念亚伯拉罕[a]，把罗得从倾覆之中送了出去；当时，上帝倾覆了罗得所住的各城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝记念亚伯拉罕”是希伯来语的惯用表达，指上帝顾念亚伯拉罕并采取行动，并不是说上帝先前忘记了他。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בְּשַׁחֵת
  choice: 这样，当……毁灭……的时候
  rationale: וַיְהִי引续叙事并领起时间背景；用“这样，当……的时候”既承接上文，也避免生硬的“事情发生了”。
- source_word: עָרֵי הַכִּכָּר
  choice: 平原各城
  rationale: הַכִּכָּר在本段指约旦河平原地区；“平原各城”自然且符合上下文。
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: 上帝记念亚伯拉罕
  rationale: 保留זכר的圣经惯用表达及其关系性含义；“记念”在现代中文宗教叙事中庄重而可懂。
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: 把罗得……送了出去
  rationale: 忠实表达שׁלח“送出”的使动方向，不在正文中扩大为“拯救”。
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: 从倾覆之中
  rationale: “之中”体现תּוֹךְ；“倾覆”保留הֲפֵכָה与下文הפך的词根呼应，而不只笼统译作“毁灭”。
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  choice: 当时，上帝倾覆了……那些城
  rationale: 明确补出语境中的主语“上帝”，并以“倾覆”维持名词הֲפֵכָה与动词הפך之间的呼应。
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: 罗得住过的那些城
  rationale: ישׁב表示居住；“住过”自然表达该居住状态相对于叙事时点已经成为过去。
theological_decisions:
- issue: “上帝记念亚伯拉罕”的含义
  choice: 正文保留“记念”，脚注说明它不表示上帝先前忘记了亚伯拉罕。
  alternative: 译作“上帝顾念亚伯拉罕”或“上帝因亚伯拉罕而采取行动”。
  rationale: 原文保留了“记念”的叙事和神学张力；直接改为因果性解释会比原文说得更多。
- issue: 罗得获送出的原因
  choice: 按句法把“记念亚伯拉罕”与“把罗得送出去”并列相接，不额外加入“因为”。
  alternative: “上帝因为亚伯拉罕而救出罗得”。
  rationale: 上下文暗示二者关系，但希伯来正文没有明说因果连词，也没有在此使用“拯救”一词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“毁灭”自然表达שׁחת；“倾覆之中／倾覆了”有意保留הֲפֵכָה与הפך的词根呼应。正文仅设一个确有解释价值的脚注，标记已置于相应短语之后。
