base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: zh_hans
  text: 他们向罗得呼喊，对他说：“今晚到你这里来的那些男人在哪里？把他们带出来，带到我们这里来，好让我们认识他们。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按这里的语境，也可更明确地译作“与他们发生性关系”。希伯来文直译是“认识他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: 他们向罗得喊话
  rationale: קרא אל在此表示向某人呼喊或喊话；“喊话”既符合隔门呼叫的场景，也不额外加入原文未明说的激烈程度。
- source_word: אַיֵּה הָאֲנָשִׁים
  choice: 那些男人在哪里
  rationale: אַיֵּה询问所在之处；הָאֲנָשִׁים在此具体指来到罗得家的男性访客，因此译为“男人”，而非泛称“人”。
- source_word: אֲשֶׁר בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: 今晚到你这里来的
  rationale: 按希伯来语定语从句处理；הַלָּיְלָה在叙事语境中自然译作“今晚”。
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: 把他们带出来，到我们这里来
  rationale: יצא的使役形表示使其出来，即“带出来”；אֵלֵינוּ明确保留方向“到我们这里来”，避免用“交给”增添支配或移交的含义。
- source_word: וְנֵדְעָה אֹתָם
  choice: 好让我们认识他们
  rationale: ידע的基本义是“认识、知道”；此处语境强烈暗示性意图，但正文保留原文措辞及其文学张力，并用脚注说明语境中的含义。
theological_decisions:
- issue: 是否在正文中明说 וְנֵדְעָה אֹתָם 所含的性意图
  choice: 正文保留“认识他们”，脚注说明语境中的性含义。
  alternative: 正文译作“与他们发生性关系”或“凌辱他们”。
  rationale: 原文使用普通动词ידע（“认识”），但上下文使其性意味十分明显。保留直译可避免把解释直接写入正文，同时脚注帮助现代读者准确把握这一威胁的性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“向罗得喊话”符合场景；“到我们这里来”保留原文方向成分。脚注标记置于相关短语之后。
