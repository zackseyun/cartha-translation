source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: zh_hans
  text: “请看，我有两个女儿，还不曾与男人同房[a]。请让我把她们带出来交给你们；你们看怎么好，就怎样待她们。只是不要对这些人做任何事[c]，因为他们已经来到我屋顶的荫影下[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“还不曾认识男人”，是指未曾与男人发生性关系；传统上常译为“还是处女”。
    reason: 说明希伯来语委婉说法及常见译法。
  - marker: b
    text: 原文为“在我屋顶的荫影下”，是以房屋的遮蔽比喻主人对进入家中的客人所负的保护责任。
    reason: 解释古代待客文化和原文意象。
  - marker: c
    text: 也可译作：“唯独不要对这些人做什么事。”
    reason: 保留רַק与后置宾语所形成的强调语序。
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 请看
  rationale: הִנֵּה引人注意，נָא在此带有恳求语气；“请看”简洁地保留两者的作用，也符合罗得急切哀求的语境。
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: 还不曾与男人同房
  rationale: יָדַע在这里是指性关系的希伯来语委婉说法。汉语若直译为“不认识男人”容易被误解，因此正文明确译出实际含义，并在脚注保留原文表达。
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: 请让我把她们带出来交给你们
  rationale: 祈愿式动词与נָא共同表达提议和恳求；“请让我”自然传达这种意愿语气。“交给你们”在汉语中清楚表达带到众人面前任其处置的含义。
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: 你们看怎么好，就怎样待她们
  rationale: 保留“在你们眼中为好”的判断结构，同时采用现代汉语可自然理解的表达；没有淡化这项提议令人震惊的内容。
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: 只是不要对这些人做任何事
  rationale: “只是”体现רַק所标出的强烈限制和转折；“任何事”传达禁令的全面性。
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: 因为他们已经来到
  rationale: 在此保留因果关系，说明罗得提出禁令的理由，不把短语过度解释为访客来访的主观目的。
- source_word: בְּצֵל קֹרָתִי
  choice: 我屋檐的荫庇之下
  rationale: “荫庇”既保留צֵל“荫影”的意象，又能传达客人进入主人家后受到保护的文化含义；“屋檐”自然呈现房屋遮蔽的画面。
theological_decisions:
- issue: 是否为提高道德可接受度而弱化罗得令人震惊的提议
  choice: 如实保留他把女儿交出、任众人处置的直白含义
  alternative: 采用较含蓄或缓和的措辞，降低提议的冲击力
  rationale: 原文并未在本节中明说赞同或辩护罗得的行为。翻译既不应加入道德认可，也不应掩盖叙述本身令人不安的张力。
- issue: כִּי עַל כֵּן所表达的因果关系
  choice: 译为“因为他们已经来到”，把进入罗得家中受庇护作为禁令的理由
  alternative: 译为“他们正是为此而来”，强调来访目的
  rationale: 原短语可带“因此、为此”的意味，但上下文重点是主人因接待客人而承担保护责任。所选译文保留因果作用，同时避免断言访客的主观来意。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留原文的恳求语气、强烈对比和“荫庇”的形象，也不以委婉措辞减轻罗得提议的冲击力。
