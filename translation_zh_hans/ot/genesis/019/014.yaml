  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: zh_hans
  text: 罗得就出去，对那些正要娶他女儿的人[a]说：“起来，离开这个地方！因为雅威快要毁灭这座城了。”可是，在那些人看来，他像是在开玩笑。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的女婿，就是已经娶了他女儿的人”。希伯来语可指已经与罗得女儿成婚的人，也可指正要娶她们的人。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译：“他在女婿们眼中好像是在开玩笑。”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו לֹקְחֵי בְנֹתָיו
  choice: 那些将要娶他女儿的人／他的女婿们
  rationale: חָתָן可指女婿或新郎，分词短语לֹקְחֵי בְנֹתָיו说明这些人是娶罗得女儿的人。正文采用符合上下文的将来或订婚含义，同时以脚注保留他们也可能已经成婚的歧义。
- source_word: קוּמוּ צְּאוּ
  choice: 起来，离开
  rationale: 两个连续的命令语气急迫；“起来，离开”在现代汉语中自然，也保留原文的简短有力。
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: 这个地方
  rationale: 与“离开”连用，准确表达从眼前所在地出去的意思。
- source_word: מַשְׁחִית
  choice: 快要毁灭
  rationale: 使役词干分词在此描述迫近、尚未发生的毁灭；“快要”体现其紧迫性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，而不以称号替代。
- source_word: כִמְצַחֵק בְּעֵינֵי חֲתָנָיו
  choice: 在他的女婿们看来，他像是在开玩笑
  rationale: 既保留“在……眼中”的评价角度，也保留כִמְצַחֵק中“像是”的比较意味，不把他们的判断强化为罗得确实在戏弄人。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用四字神名；音译为“雅威”可明确保留其专名性质，不用称号代替。
- issue: 罗得女婿的婚姻状态
  choice: 正文译为将要娶他女儿的人，并以脚注保留歧义
  alternative: 已经娶了他女儿的女婿
  rationale: 希伯来语分词本身不能完全确定婚姻是否已经完成；上下文支持即将成婚的理解，但不宜排除已婚解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起来，离开”保留警告的急迫感；末句略保留希伯来语“在……眼中、像是……”的结构，以呈现女婿们的主观判断。
