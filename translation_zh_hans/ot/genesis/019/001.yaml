source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: zh_hans
  text: 傍晚，那两个天使来到所多玛。罗得正坐在所多玛的城门口[a]。罗得看见他们，就起身迎接，俯伏，脸朝地面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城门口”指古代城门及其周边区域，那里常是公众聚集和处理城中事务的地方。
    reason: cultural_note
  - marker: b
    text: 或译：“面伏于地。”希伯来文描写的是俯身极低、脸朝地面的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: 那两个天使
  rationale: מַלְאָךְ可指“使者”或“天使”；结合前文，这两位是来自天上的访客，因此译作“天使”。定冠词承接创世记18章已经出现的两人，故用“那两个”。
- source_word: סְדֹמָה בָּעֶרֶב
  choice: 傍晚……来到所多玛
  rationale: 方向词尾表示朝向或到达所多玛；上下文明确他们抵达当地。“傍晚”自然表达בָּעֶרֶב的时间背景。
- source_word: יֹשֵׁב בְּשַׁעַר סְדֹם
  choice: 正坐在所多玛的城门口
  rationale: 分词יֹשֵׁב描写当时持续的背景状态，译作“正坐”。“城门口”在现代汉语中自然，也可涵盖古城门及其周边公共区域。
- source_word: וַיָּקָם לִקְרָאתָם
  choice: 就起身迎接
  rationale: 保留起身并迎向来客的连续动作，同时符合现代汉语叙事表达。
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: 俯伏在地，脸贴地面
  rationale: 整句描写深度俯身、面向地面的动作。“俯伏”比单纯“鞠躬”更充分表达动作幅度，而“脸贴地面”具体呈现אַפַּיִם אָרְצָה。
theological_decisions:
- issue: וַיִּשְׁתַּחוּ是否应译成敬拜行为
  choice: 译为表示尊敬的“俯伏”
  alternative: 译为“敬拜”
  rationale: שׁחה既可用于敬拜，也可指向人或尊贵来客俯伏致敬。本节没有明确断定罗得正在施行敬拜，因此采用动作性译法，避免加入经文本身未明确表达的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那两个天使”承接前文；“正坐”保留分词的场景背景功能；避免用“敬拜”过度限定俯伏动作的神学性质。
