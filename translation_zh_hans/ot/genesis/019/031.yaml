base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: zh_hans
  text: 大女儿对小女儿说：“我们的父亲老了，这地没有男人按世人的常规来与我们同房。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按世人的常规”指全地人通常的方式或惯例；在这里尤其涉及男女结合和延续后代。原文用“进到我们这里”这一委婉说法表达“与我们同房”。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: 大女儿
  rationale: 该词指年长者或头生者；在父女叙事中译作“大女儿”自然清楚，并保留姐妹间的长幼次序。
- source_word: הַצְּעִירָה
  choice: 小女儿
  rationale: 该词意为较年轻或较小的一位；与“大女儿”成对，符合现代汉语习惯。
- source_word: אָבִינוּ זָקֵן
  choice: 我们的父亲老了
  rationale: 直接表达希伯来文无系词句的状态，也可自然包含年事已高的语意。
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: 这地又没有男人
  rationale: 保留 אִישׁ 的男性指称及 בָאָרֶץ 的地域表达；“这地”在上下文中比“地上”更不易被误解为全球性的断言。
- source_word: לָבוֹא עָלֵינוּ
  choice: 与我们同房
  rationale: 原文直译为“进到我们这里”，在此是性交的委婉语。现代汉语若照搬“进到我们这里”容易只被理解为空间移动，因此采用庄重而明确的对应表达。
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: 按世上众人的常情
  rationale: דֶּרֶךְ 在此指通常的方式或惯例；该译法传达普遍的人类生活常规，同时不把短语过度限定为婚姻制度。
theological_decisions:
- issue: “这地没有男人”的范围
  choice: 保留为“这地”，让范围由叙事语境判断
  alternative: 译作“世上没有男人”或明确解释为附近无人
  rationale: בָאָרֶץ 本身可指地、地区或大地；经文可能反映女儿们对当地处境的判断，不宜在正文中把它绝对化为全球性命题，也不宜替叙述明确限定范围。
- issue: “世上众人的常情”的具体所指
  choice: 正文保留概括表达，并以脚注说明在本语境中特别涉及男女结合与延续后代
  alternative: 直接译成“按世人的惯例结婚生子”
  rationale: 原文只说“全地的道路/常例”，具有概括性；结合上下文可知性结合和后代延续是重点，但直接加入“结婚生子”会超出明说内容。
translation_notes:
  register: 采用现代、庄重且易懂的叙事汉语。“大女儿／小女儿”比“长女／幼女”更口语自然，又比“大姐／妹妹”更贴近叙述视角；“同房”明确传达原文委婉语的性含义而不显粗俗。脚注标记已置于相关句末。
