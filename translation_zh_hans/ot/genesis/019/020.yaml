  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: zh_hans
  text: “请看，这座城很近，可以逃到那里去，而且城很小。求你容我逃到那里去吧——它不是很小吗？好让我活命。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好让我活命”也可译作“这样我就能活下去”。原文直译为“我的性命就活着”，在这里是指“我得以存活”。
    reason: 说明原文נֶפֶשׁ的习语用法，并保留末句可表示目的或结果的可能性。
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 请看
  rationale: הִנֵּה引人注意，נָא在恳求语境中加强请求语气；合译为“请看”，既自然又保留罗得急切恳求的口吻。
- source_word: הָעִיר הַזֹּאת
  choice: 这座城
  rationale: 按指示词和名词直接翻译；“城”符合叙事语境，也与后文保持一致。
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: 很近，可以逃到那里去
  rationale: 将地点副词שָׁמָּה明确译为“到那里去”，并以“可以”自然表达距离近而适于逃往该城的含义。
- source_word: מִצְעָר
  choice: 很小
  rationale: 保留本节两次出现的“小”，呈现罗得以该城规模小为求情理由的重复说法，不擅自改作“微不足道”。
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: 求你容我逃到那里去吧
  rationale: 第一人称鼓励式在这里表达恳求；“求你容我……吧”自然传达请求和急切语气。
- source_word: וּתְחִי נַפְשִׁי
  choice: 好让我活命
  rationale: נֶפֶשׁ在此指说话者本人或其性命；译为“活命”符合现代汉语习惯。连接词承接前面的恳求，可表达目的或结果，“好让我”在正文中自然呈现这一关系。
theological_decisions:
- issue: וּתְחִי נַפְשִׁי中נֶפֶשׁ的含义
  choice: 好让我活命
  alternative: 我的性命就可以存活
  rationale: 这里不必把נֶפֶשׁ实体化为与人分离的“灵魂”；它可作为对本人或性命的指称。“活命”忠实传达语义，也避免生硬的“生命活着”。
- issue: 末句连接词וְ的逻辑关系
  choice: 译作目的：“好让我……”
  alternative: 译作结果：“这样我就能……”
  rationale: 该分句紧接请求式“容我逃到那里”，可理解为所求行动的目的或结果。正文采用汉语中自然的目的表达，脚注注明也可理解为结果，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对白。“请看”“求你容我……吧”保留罗得恳求的语气；两次“很小”刻意重复，以对应原文的修辞。
