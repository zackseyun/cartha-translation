base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: zh_hans
  text: 他们把他们带到城外时，有一位说：“赶快逃命！不可回头看[a]，也不可在平原的任何地方停留。逃到山地去[b]，免得你灭亡[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可看你身后。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“到山上去”或“到山区去”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“免得你被毁灭”或“免得你被卷走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: 到城外
  rationale: 该词是带方向词尾的方位表达，意为“向外、到外面”。上下文是离开所多玛，因此译作“到城外”自然清楚；“城”由语境补出，并未改变空间指向。
- source_word: הִמָּלֵט עַל נַפְשֶׁךָ
  choice: 快逃命吧
  rationale: הִמָּלֵט是表示紧急逃脱的命令式，עַל נַפְשֶׁךָ在此关乎保全性命。现代汉语“逃命”简洁传达两者合成的意思；“快”体现命令的紧迫感。
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: 不可回头看
  rationale: 原文直指“不要看你身后”。“不可回头看”是自然且准确的汉语表达，同时保留身体转向后方观看的含义。
- source_word: וְאַל תַּעֲמֹד
  choice: 也不可……停留
  rationale: עמד在逃亡警告中不是单指保持站姿，而是停下或逗留。“停留”符合语境，也保持禁令的持续性。
- source_word: בְּכָל הַכִּכָּר
  choice: 在平原的任何地方
  rationale: כִּכָּר在本段指约旦河谷的平原地带；בְּכָל在否定命令中具有“任何一处”的分布意义。
- source_word: הָהָרָה
  choice: 到山地去
  rationale: 该形式带方向词尾，可指“往山、往山区”。“山地”既能与平原形成地貌对照，也避免无根据地断定是一座特定的山。
- source_word: פֶּן תִּסָּפֶה
  choice: 免得你也一同灭亡
  rationale: נספה的被动形在审判语境中可表示与别人一同被除灭、灭亡。汉语“一同”体现被卷入共同灾难的语义色彩，而不限定具体毁灭方式。
theological_decisions:
- issue: 说话者的身份
  choice: 译作“那一位说”，保留希伯来文单数动词
  alternative: 按整体意义译作“他们说”，或明确译作“天使说”
  rationale: 前半句的行动者是复数，随后“说”的动词却是阳性单数。原文没有在本句明确指明是哪一位，因此既保留单数，也不擅自指定身份。
- issue: פֶּן תִּסָּפֶה所表达的灾难性质
  choice: 译作“免得你也一同灭亡”
  alternative: “免得你被卷走”或“免得你被毁灭”
  rationale: 该动词可泛指在灾祸或审判中被除灭。正文不把它限定为洪水般的“卷走”，也不额外说明审判机制。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“快逃命吧”传达紧迫感但不过度口语化；“那一位”用于自然地保留说话动词的单数与人物身份未明的张力。所有脚注标记均置于相应正文词句之后。
