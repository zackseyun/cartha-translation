  rationale: 修订以“他们把他们带到城外”保留原文复数代词而不泛化其所指；以“有一位说”自然地对应单数说话动词，且不指定说话者身份；删去“也一同”，避免加入原文未明示的共同毁灭含义。其余译法保持原有的空间、命令和灾祸警告。
