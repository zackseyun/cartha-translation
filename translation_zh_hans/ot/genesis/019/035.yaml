base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: zh_hans
  text: 那一夜，她们也让父亲喝了酒。小女儿起来，与父亲同寝；她何时躺下、何时起来，他都不知道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他不知道她躺下和起来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: 她们也让父亲喝了酒
  rationale: 该词是שׁקה的使役式，表示“给……喝”或“使……喝”；“让父亲喝了酒”保留使役含义，又不把“灌醉”这一较强解释直接写入动词。
- source_word: גַּם בַּלַּיְלָה הַהוּא
  choice: 那一夜……也
  rationale: גַּם承接前一夜发生的事，译作“也”；בַּלַּיְלָה הַהוּא自然译作“那一夜”。
- source_word: הַצְּעִירָה
  choice: 小女儿
  rationale: 原文指两位女性中较年轻的那一位；结合上下文，译作“小女儿”比单说“较小的”更自然清楚。
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: 与父亲同寝
  rationale: שׁכב עם在此是发生性关系的委婉表达；“同寝”保持庄重和含蓄，也能传达该惯用义。用“父亲”代替代词可避免现代汉语中的指代含混。
- source_word: וְלֹא יָדַע
  choice: 父亲都不知道
  rationale: ידע在这里表示察觉或知晓。“不知道”贴近原文字面，并保留他不知情的具体状态所具有的叙事张力。
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: 她躺下、起来
  rationale: 两个带בְּ的动名词结构可作时间性理解，即“当她躺下、当她起来时”；正文用简洁并列结构表达，脚注补出更形式对应的译法。
theological_decisions:
- issue: 罗得不知情的程度与原因
  choice: 仅陈述“父亲都不知道”
  alternative: 明确译为“他醉得不省人事”或说明不知情的原因
  rationale: 原文只陈述他对女儿躺下和起来毫不知情，并未在本节直接说明其生理状态或原因；译文不额外作神学或心理推断。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语体。“同寝”保留原文的委婉表达；“小女儿”和重复“父亲”使人物关系及指代清楚。脚注标记已置于正文对应句末。
