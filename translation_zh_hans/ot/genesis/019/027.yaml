  text: וַ/יַּשְׁכֵּ֥ם אַבְרָהָ֖ם בַּ/בֹּ֑קֶר אֶל הַ֨/מָּק֔וֹם אֲשֶׁר עָ֥מַד שָׁ֖ם אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: zh_hans
  text: 亚伯拉罕清早起来，前往他先前站在雅威面前[a]的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“站在雅威的面前”；这是表示站在雅威面前、处于他面前的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: 清早起来
  rationale: שׁכם 的使役词干在此表示早起；“清早起来”自然保留了动作及时间上的强调。
- source_word: בַּבֹּקֶר
  choice: 清早
  rationale: בֹּקֶר 指早晨；与“早起”动词合用时强调清晨时分，汉语用“清早”可避免生硬重复。
- source_word: אֶל הַמָּקוֹם
  choice: 前往……地方
  rationale: אֶל 表示朝向，מָקוֹם 是普通的“地方”；“前往”使汉语句法完整，同时没有把动作强化为已经抵达。
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: 他先前站在……的
  rationale: 关系从句回指此前发生的事；“先前”明确其回顾性质，而 שָׁם 在汉语中由“……的地方”自然承载，无须重复译作“在那里”。
- source_word: אֶת־פְּנֵי
  choice: 在……面前
  rationale: עָמַד אֶת־פְּנֵי 是站在某位面前的表达，指处于其面前或同在之中；“在……面前”既贴近原文又符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用四字神名 יהוה；“雅威”以现代汉语通行音译保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 此处原文直接使用四字神名。采用“雅威”保留专名，并避免用“上主”等称号取代；“耶和华”是传统形式，但较不符合该神名通常所重构的读音。
- issue: “站在雅威面前”的含义
  choice: 保留空间性与敬拜语境均可成立的表达
  alternative: 明确译为“侍立在雅威面前”或“在雅威面前祷告”
  rationale: 原文只说“站在……面前”，可表示身处雅威面前，也可能在上下文中带有祈求或等候意味；译文不补入“侍立”或“祷告”，以保留原文张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“清早起来，前往……”避免逐词直译造成的拗口；“先前”交代关系从句所回指的过去事件。
