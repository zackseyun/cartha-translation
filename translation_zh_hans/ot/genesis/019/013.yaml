  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: zh_hans
  text: 我们就要毁灭这地方[a]，因为他们的呼声在雅威面前已经极大；雅威差遣我们来毁灭它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在雅威面前，控告他们的呼声已经极大。”希伯来语形式直译为“他们的呼声”，但按上下文，许多人理解为针对这地方居民而发的呼声。
    reason: 保留 צַעֲקָתָם 在形式与语境之间的两种可能理解。
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: 就要毁灭
  rationale: 希斐勒分词复数在此宣告迫近的行动；“就要毁灭”自然表达即将发生之意，同时保留行动主体为说话者复数。
- source_word: הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: 直接、自然地对应“这个地方”，并保留指示意味。
- source_word: גָדְלָה
  choice: 已经很大
  rationale: Qal完成式表达呼声达到很大的程度；此译保留结果状态，且符合现代汉语表达。
- source_word: צַעֲקָתָם
  choice: 他们的呼声
  rationale: 保留第三人称阳性复数后缀最直接的形式。“呼声”可涵盖因苦难而发出的喊声或控诉，不在正文中断定是居民所发还是针对居民而发。
- source_word: אֶת־פְּנֵי יְהוָה
  choice: 在雅威面前
  rationale: 这是该希伯来语惯用结构自然而庄重的汉语表达，也保留其审判与临在语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: וַיְשַׁלְּחֵנוּ
  choice: 差遣我们
  rationale: “差遣”准确表达带着使命派出；在“所以”所引出的汉语句式中，无须另加“已经”也可清楚指向先前完成、现仍有效的委派。
- source_word: לְשַׁחֲתָהּ
  choice: 来毁灭它
  rationale: 目的不定式译为“来毁灭”，阴性单数后缀按汉语对地方或城的通常指代译作“它”，并与前面的同根动词保持一致。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地按主流重构读音音译，保留专名性质。
- issue: צַעֲקָתָם 所指的呼声
  choice: 他们的呼声
  alternative: 控告他们的呼声
  rationale: 正文依照词形保留“他们的”这一所有格表达，不静默裁定呼声由谁发出；上下文中“针对他们的呼声”这一重要理解以脚注注明。
- issue: 毁灭行动的时态体意义
  choice: 就要毁灭
  alternative: 正在毁灭
  rationale: 分词形式本可有进行或迫近之意；在天使宣布即将施行审判的语境中，迫近意义最合适，但不把它改写成单纯的一般将来。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就要”传达迫近的审判；“呼声”保留原词可指苦难喊声或控诉的宽度。正文脚注标记[a]与脚注完全对应。
