  text: טֶרֶם֮ יִשְׁכָּבוּ֒ וְ/אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל הַ/בַּ֔יִת מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן כָּל הָ/עָ֖ם מִ/קָּצֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: zh_hans
  text: 他们还没有躺下，城里的男人，就是所多玛的男人——从少年到老人[b]，全城各处的人[c]——就都围住了那座房子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “围住”也可译作“环绕”或“聚集在……周围”。这个希伯来语动词可表示围绕，也可表示聚集到周围；这里的语境显出人群包围房子的情形。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从少年到老人”，是以年龄的两端表示各年龄层都包括在内。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“从尽头”；这里按习语理解为“从各处”或“从城的各个区域”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: 他们还没有躺下
  rationale: טֶרֶם引出尚未发生的动作；יִשְׁכָּבוּ在此指为夜间休息而躺下。“还没有躺下”自然表达先后关系，又保留具体动作，未扩写为“上床睡觉”。
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: 城里的男人，就是所多玛的男人
  rationale: 保留两组同位语及אַנְשֵׁי明确的男性指称；“就是”使希伯来语的并置关系在现代汉语中清楚自然。
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: 围住了那座房子
  rationale: נסב与עַל连用可表示环绕或聚集在周围；上下文中的人群形成包围之势，故正文采用“围住”，并以脚注保留“聚集在……周围”的可能。
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: 从少年到老人
  rationale: 按原文保留年龄两端的表达；这是以两端涵盖整体的说法，表示各年龄层都包括在内。
- source_word: כָּל הָעָם מִקָּצֶה
  choice: 全城各处的人
  rationale: כָּל הָעָם指全体民众；מִקָּצֶה字面与“尽头、边端”有关，在此按语境表达从城中各处而来。
theological_decisions:
- issue: 人群的性别指称
  choice: 正文先译作“城里的男人，就是所多玛的男人”，随后将כָּל הָעָם译作“人”。
  alternative: 把所有相关词语一概译成不标明性别的“城里的人”。
  rationale: 原文开头两次使用אַנְשֵׁי，明确指男人，随后使用较宽泛的集合名词עָם。分别反映这两种措辞，可避免抹平原文的变化；破折号结构也表明后面的“人”仍在说明前述人群。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“躺下”保持叙事的具体性；破折号承载原文对人群范围的补充说明，避免另加一个原文没有的谓语。所有脚注标记均置于正文对应词语之后。
