base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: zh_hans
  text: 他们击打房门口的那些人，无论大小，使他们眼目昏花[a]，以致他们找门口找得精疲力竭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“失明”“眩惑”或“视觉混乱”；这里的希伯来语词很少见，所指可能不只是一般的失明。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: 使……眼目昏迷
  rationale: 希伯来语使役形通常有“击打、击伤”之意；与其后表示视觉障碍的名词合用时，中文采用“使……眼目昏迷”，自然表达施加这一异常状态的含义。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 本词在上下文中指聚集在罗得房外的男子；中文承接上文用“那些人”即可准确指代，避免不自然的重复。
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: 房门口的人
  rationale: 原文按地点限定这群人；“房门口的人”简洁自然，并保留“入口、门口”的空间含义。
- source_word: בַּסַּנְוֵרִים
  choice: 眼目昏迷
  rationale: סַנְוֵרִים 是罕见词，指受外力造成的视觉失常，可能是失明、眩目或视觉混乱。“眼目昏迷”保留其异常视觉状态，又不把词义限定为普通的完全失明。
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: 无论大小
  rationale: 这是涵盖全体的两极表达；“无论大小”保留原文形式，也可自然表示所有人，不擅自限定为年龄或社会地位。
- source_word: וַיִּלְאוּ
  choice: 找得筋疲力尽
  rationale: לָאָה 表示疲乏、耗尽力气；结合寻找门口的动作译为“找得筋疲力尽”，清楚表现徒劳寻找所导致的疲惫。
- source_word: לִמְצֹא הַפָּתַח
  choice: 找门口
  rationale: 不定式说明他们疲惫所缘于的行动；“找门口”保留原文直白而带反讽意味的叙述。
theological_decisions:
- issue: סַנְוֵרִים 所指灾患的性质
  choice: 正文译为“眼目昏迷”
  alternative: “失明”“眩目”“视觉错乱”
  rationale: 该词仅见于少数经文，确切病状难以确定；叙事明确表明这是一种使人无法正确看见并找到入口的超常视觉障碍。正文不将其收窄为普通失明，脚注保留主要可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他们又使”承接前文两位来客的行动；“无论大小”保留原文的概括性两极表达；脚注说明罕见词的词义范围。
