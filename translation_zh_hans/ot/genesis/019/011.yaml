revisions:
- from: 他们又使房门口的人，无论大小，都眼目昏迷[a]，以致那些人找门口找得筋疲力尽。
  to: 他们击打房门口的那些人，无论大小，使他们眼目昏花[a]，以致他们找门口找得精疲力竭。
  rationale: 修订以“击打……使……”对应原文动词及其后所带的视觉灾患，删除原文未明示的“又”。“眼目昏花”是自然的现代汉语表达，指向视力受扰而不预断其为完全失明；脚注保留该罕见词的其他合理理解。“无论大小”保留原文涵盖全体的两极表达，“找门口找得精疲力竭”表达其徒劳寻找至疲惫的结果。
