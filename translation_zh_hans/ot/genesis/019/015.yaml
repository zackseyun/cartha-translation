base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: zh_hans
  text: 天快亮的时候，天使催促罗得说：“起来，带上你的妻子和你那两个在这里的女儿，免得你在这城所受的刑罚[a]中一同灭亡。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刑罚”或译“罪孽”或“罪责”。希伯来语原词可指罪孽、罪责，或因罪责而来的惩罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: 天快亮的时候
  rationale: כְמוֹ在此构成时间表达；“天快亮的时候”是自然的现代汉语，也保留黎明正在到来的过程感。
- source_word: וַיָּאִיצוּ
  choice: 催促
  rationale: 该动词表示强力促使某人赶快行动；“催促”准确体现迫切性。
- source_word: הַמַּלְאָכִים
  choice: 天使
  rationale: 名词本义可指“使者”，但本章语境明确指属天的使者，译作“天使”最清楚。
- source_word: קוּם קַח
  choice: 起来，带上
  rationale: 分别保留两个祈使动作；“带上”比单纯“拿”更适合携家人离开的语境。
- source_word: הַנִּמְצָאֹת
  choice: 在这里的
  rationale: 分词意为“被找到的、在场的”；这里指当时与罗得同在的两个女儿。“在这里的”自然且不添加其婚姻状况。
- source_word: פֶּן תִּסָּפֶה
  choice: 免得你……一同灭亡
  rationale: ספה的被动式在此指与受审判者一并被除灭；“一同灭亡”保留被卷入全城结局的含义。
- source_word: בַּעֲוֺן הָעִיר
  choice: 因这城的罪孽
  rationale: עָוֹן可指罪孽、罪责，也可转指罪所招致的惩罚。正文采用其较直接的“罪孽”，并以“因”表达这里的因果关系；其他可能含义在脚注中保留。
theological_decisions:
- issue: 审判语境中עָוֹן的含义
  choice: 因这城的罪孽
  alternative: 在这城所受的惩罚中；因这城的罪责
  rationale: 原词兼有罪孽、罪责及罪责后果等语义。正文不把含义完全限定为“惩罚”，以保留希伯来文中行为、罪责与后果之间的张力；脚注列明其他合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“催促”“带上”“一同灭亡”传达迫在眉睫的危险；正文中的脚注标记[a]与脚注对应。
