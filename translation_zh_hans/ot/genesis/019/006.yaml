  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: zh_hans
  text: 罗得就出去，到门口见他们[a]，把身后的门关上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门口”也可译作“入口处”。原文在这里所用的词指入口或开口，与下文表示可开关之门的词不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 就出去
  rationale: 该词是יצא的叙事性连续式，推动情节向前，表示罗得从屋内出去；“就出去”符合现代汉语叙事习惯。
- source_word: אֲלֵהֶם
  choice: 见他们
  rationale: 介词אֶל及第三人称阳性复数后缀表示朝向门外众人而去。汉语用“出去……见他们”自然表达这一趋向，未额外加入交谈等原文没有的内容。
- source_word: לוֹט
  choice: 罗得
  rationale: 采用现代中文圣经传统中通行且易于辨识的人名译法。
- source_word: הַפֶּתְחָה
  choice: 到门口
  rationale: פֶּתַח指入口或开口，词尾方向成分表示朝那里移动。“到门口”既体现趋向，也与下文表示门本身的דֶּלֶת保持区别。
- source_word: וְהַדֶּלֶת
  choice: 门
  rationale: דֶּלֶת指可开关的门或门扇；译作“门”，与前面的“门口”形成原文所有的词义区别。
- source_word: סָגַר
  choice: 关上
  rationale: סגר表示关闭；“把……关上”是现代汉语中简洁自然的叙事表达。
- source_word: אַחֲרָיו
  choice: 身后的
  rationale: 此处אַחַר带人称后缀表达空间位置，说明罗得出去后门在他身后；“身后的”可避免被误解为时间上的“在他之后”。
