  text: וַ/יֹּאמְר֣וּ גֶּשׁ הָ֗לְאָה וַ/יֹּֽאמְרוּ֙ הָ/אֶחָ֤ד בָּֽא לָ/גוּר֙ וַ/יִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְ/ךָ֖ מֵ/הֶ֑ם וַ/יִּפְצְר֨וּ בָ/אִ֤ישׁ בְּ/לוֹט֙ מְאֹ֔ד וַֽ/יִּגְּשׁ֖וּ לִ/שְׁבֹּ֥ר הַ/דָּֽלֶת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: zh_hans
  text: 他们说：“退后！”[a]又说：“这个人不过是来寄居的，竟还要充当审判官！现在我们要害你，比害他们更狠。”[b]他们猛烈地挤向那人，就是罗得，又上前要撞破门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让开！”
    reason: גֶּשׁ הָלְאָה在这里可理解为命令罗得退后或移开。
  - marker: b
    text: 直译：“现在我们要向你行恶，比向他们更甚。”
    reason: 脚注保留希伯来语“行恶”的形式，并说明正文所表达的比较性威胁。
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: 退后！
  rationale: 这是带敌意的命令，要求罗得从门口退开；“退后”自然有力，也保留了动作方向。
- source_word: הָאֶחָד בָּא לָגוּר
  choice: 这个人不过是来这里寄居的
  rationale: “这个人”保留轻蔑语气；“寄居”表达作为非本地人的居住身份。“不过”是由上下文体现的蔑视语气。
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: 竟还一再当起审判官来了
  rationale: 同词根的限定动词与绝对不定式构成强调；译文保留对罗得越权评判他们的敌意指控，同时不把它平化为普通的“判断”。
- source_word: נָרַע לְךָ מֵהֶם
  choice: 我们要害你，比害他们更狠
  rationale: 使役形式表达加害，比较结构表明对罗得的伤害将超过对访客的伤害；译法自然且保留威胁力度。
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: 他们使劲冲撞那人，就是罗得
  rationale: 在随即破门的具体语境中，动词指强力挤压或冲撞；“使劲”体现מְאֹד的加强作用。“那人，就是罗得”保留重复介词所突出的同位说明，又符合现代汉语。
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: 并上前要撞破房门
  rationale: 表达他们逼近并意图以暴力破门；“撞破”符合前文冲撞的场景，也自然传达שׁבר。
