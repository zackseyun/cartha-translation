  source_fidelity: 译文总体准确传达了暴徒命令罗得退开、鄙视其外来寄居者身份、威胁加重伤害，并强行逼近、意图破门的叙事。然“冲撞”将וַיִּפְצְרוּ具体化为身体碰撞，超过该词在此“强力逼迫／挤向”的稳妥含义；“一再”则把强调式误定为反复动作。
  naturalness: 整体为自然的现代汉语。“当起审判官来了”略显口语且易让人理解为担任正式职务；改为“竟还要充当审判官”更贴近敌意指控，也更庄重。将“房门”简化为“门”，避免在本节未明说的名词上作不必要限定。
  terminology: “寄居”恰当表达לָגוּר所指的外来居住者身份；“罗得”为通行译名。用“充当审判官”保留שׁפט的审判意象，但不暗示罗得确有正式官职。
