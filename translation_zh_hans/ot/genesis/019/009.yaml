  to: 他们说：“退后！”[a]又说：“这个人不过是来寄居的，竟还要充当审判官！现在我们要害你，比害他们更狠。”[b]他们猛烈地挤向那人，就是罗得，又上前要撞破门。
  rationale: 修订仅处理两处超出原文确定性的表达：“一再”改为不带重复含义的“竟还要”，“冲撞”改为较宽泛且符合紧接破门情境的“猛烈地挤向”。同时将“房门”还原为“门”。其余措辞和脚注保留原有的现代、庄重风格及原文的威胁语气。
