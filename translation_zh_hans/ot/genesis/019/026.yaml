base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: zh_hans
  text: 可是，他妻子在他身后回头望去[a][b]，就变成了一根盐柱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他身后”在希伯来文中更直译为“从他身后”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他妻子从他身后回头看。”原文短语可说明她相对他的所在位置，也可与“回头看”相连，表达向后观看。
    reason: previous_rendering
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: 回头望去
  rationale: נבט 的基本义是“看、注视”。结合后面的 מֵאַחֲרָיו，译作“回头望去”符合本段方向语境，又不增添她观看的动机或持续时间。
- source_word: אִשְׁתּוֹ
  choice: 他妻子
  rationale: 名词带第三人称阳性单数后缀，直指上下文中的罗得之妻。
- source_word: מֵאַחֲרָיו
  choice: 在他身后
  rationale: 该短语字面可作“从他后面”，既可能说明妻子相对罗得的位置，也可能与动词共同表达向后看的方向；正文采用自然汉语“在他身后”，并以脚注保留另一理解。
- source_word: וַתְּהִי
  choice: 就变成了
  rationale: היה 在连续叙事中表达所产生的新状态，“变成”比单纯的“是”更准确；“就”自然承接前一动作及其结果。
- source_word: נְצִיב
  choice: 一根……柱
  rationale: נְצִיב 指立着或竖立之物；此处“柱”是准确且通行的表达。量词“根”符合现代汉语对柱状物的通常用法。
- source_word: מֶלַח
  choice: 盐
  rationale: 与 נְצִיב 构成属质关系，译为“盐柱”，即由盐构成的柱。
theological_decisions:
- issue: 罗得妻子变化的性质
  choice: 按叙事直陈译为“变成了一根盐柱”
  alternative: 变得像一根盐柱；成了如盐柱一般的人
  rationale: 希伯来文使用 היה 加名词谓语，未出现任何表示比喻的标记。译文因此保留实际变成盐柱的叙事陈述，不将其弱化为明喻，也不另加关于过程或机制的解释。
- issue: מֵאַחֲרָיו 所修饰或表达的关系
  choice: 正文理解为她位于“他身后”，同时以“回头”表达观看方向
  alternative: 将短语完全理解为“向他后面看”
  rationale: 原文可同时让人注意她相对罗得的位置和观看的方向。正文避免僵硬重复，脚注则保留希伯来语结构及可能的另一理解。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“回头望去”比“向后看”更自然；“在他身后”保留人物相对位置。句首“可是”承接上文禁令与本节的转折，“就”简洁表达随后发生的结果。
