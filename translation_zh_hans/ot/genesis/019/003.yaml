base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: zh_hans
  text: 罗得极力恳请他们[a]，他们于是转到他那里，进了他的家。罗得为他们预备筵席，又烤了无酵饼[b]，他们就吃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“竭力催促他们”或“再三坚持邀请他们”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为复数，也可译作“没有发酵的饼”；指不用酵发制成的饼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: 极力挽留他们
  rationale: פצר表示强烈催促、坚持请求；מְאֹד加强语气。结合留宿的上下文，“极力挽留”自然表达罗得一再恳请他们留下，同时保留动作的强度。
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: 他们才转到他那里
  rationale: סור的基本意象是“转向、转去”；“转到他那里”保留该意象。加入“才”自然体现前句极力劝说后对方改变行动的叙事关系，但不增加新的实质信息。
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: 进了他的家
  rationale: 直译其进入罗得住所的动作；现代汉语中“进了他的家”简洁自然。
- source_word: מִשְׁתֶּה
  choice: 筵席
  rationale: 该词指宴饮或宴席；“筵席”庄重而易懂，并不刻意凸显饮酒。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 复数名词指未发酵的饼；“无酵饼”是清楚且通行的中文表达，未强行说明具体形状或制作细节。
- source_word: אָפָה
  choice: 烤了
  rationale: 准确表达烘烤动作；与“无酵饼”搭配符合现代汉语习惯。
- source_word: וַיֹּאכֵלוּ
  choice: 他们就吃了
  rationale: 保留简短的叙事结语；“就”承接食物预备妥当后的动作，使中文流畅。
