base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: zh_hans
  text: 但那些人[b]伸出手[a]，把罗得带进屋内，带到他们身边，并关上门[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把手伸出去”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“那些人”；上下文表明他们是天使使者。
    reason: alternative_reading
  - marker: c
    text: 也可译：“他们关上了门。”
    reason: previous_rendering
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文直译为“那些人”，本节没有直接称他们为天使；“那些人”既承接上文，也保留原文用词。
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: 伸出手
  rationale: 这是表示实际伸手动作的希伯来语惯用表达；现代汉语中“伸出手”自然、准确。
- source_word: וַיָּבִיאוּ
  choice: 带进
  rationale: בוא的使役形表示“使来到、带来”；结合进入房屋的方向，以“带进”表达，不额外加入“猛拉”等原文未明说的力度。
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: 带进屋里，和他们在一起
  rationale: 保留了朝屋内移动以及罗得来到他们所在之处这两层意思，同时符合现代汉语语序。
- source_word: הַדֶּלֶת
  choice: 门
  rationale: דֶּלֶת是普通的“门”，无需扩写为“入口的门”。
- source_word: סָגָרוּ
  choice: 关上
  rationale: “关上”准确表达完成性的关门动作，也符合紧凑的叙事语境。
- source_word: וַ
  choice: 但
  rationale: 句首连接词在此承接上一节暴民的行动并形成转折；“但”自然体现这一对照。
theological_decisions:
- issue: 是否在正文中把הָאֲנָשִׁים明确译为“天使”
  choice: 正文保留“那些人”
  alternative: “天使”或“那两位来客”
  rationale: 上下文表明他们是天使使者，但本节原文使用普通名词“人”。正文不把上下文身份解释直接替换原文措辞，以保留叙事表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以连续谓语保持原文动作迅速推进的节奏；不在正文中提前解释人物的天使身份。
