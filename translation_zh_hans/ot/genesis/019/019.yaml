source:
  edition: WLC
  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: zh_hans
  text: 请看，你的仆人已经在你眼前蒙恩；你向我大施慈爱[a]，保全了我的性命。可是我不能逃到山上去，恐怕灾祸[b]追上我，我就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“恩慈”或“怜悯”。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”原文直译为“恶”；这里指将临到罗得的灾难。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 请看
  rationale: הִנֵּה用于引起注意，נָא使语气带有恳求意味；“请看”在现代汉语中简洁自然地保留了两者的语用作用。
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: 在你眼前蒙恩
  rationale: 保留希伯来语“在……眼中”的意象，同时用汉语常见的圣经表达传达受到恩待和悦纳之意。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 此处是面对尊长的谦称，重点不在奴隶身份，因此译作“仆人”。
- source_word: וַתַּגְדֵּל חַסְדְּךָ
  choice: 你向我大施慈爱
  rationale: “大施”自然表达使之为大、丰厚施予的使役意味；“慈爱”兼顾חסד所含恩慈、怜悯与忠贞厚爱的语义。
- source_word: עָשִׂיתָ עִמָּדִי
  choice: 向我……施
  rationale: 原文直译近于“与我行”，在此与חסד搭配，汉语以“向我施”表达实际给予的恩待。
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: 保全了我的性命
  rationale: 表达使其生命得以延续的结果，避免使用可能带入额外神学含义的术语。
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: 但我不能
  rationale: 上下文形成转折；“我”保留אָנֹכִי所强调的第一人称。
- source_word: לְהִמָּלֵט הָהָרָה
  choice: 逃到山上去
  rationale: 方向词尾表示朝山而去；译文保留原文单数形式，同时符合现代汉语表达。
- source_word: פֶּן תִּדְבָּקַנִי
  choice: 恐怕……追上我
  rationale: פֶּן引出所惧怕的后果；דבק基本义为紧贴，此处语境中指灾祸赶上、临到罗得。
- source_word: הָרָעָה
  choice: 这灾祸
  rationale: 此处不是抽象的道德之恶，而是即将临到的毁灭性灾难；加“这”使所指在汉语中清楚。
theological_decisions:
- issue: חֶסֶד在罗得向奉上帝权柄行事的使者恳求时的译法
  choice: 慈爱
  alternative: 恩慈、怜悯、忠贞之爱
  rationale: “慈爱”能够较为宽广地涵盖恩惠、仁慈和忠贞厚待，不把本处过度限定为专门的盟约术语，也不削弱其神学分量。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“请看”保留恳求语气而避免古奥；“大施慈爱”兼顾原文形式与汉语习惯。脚注标记分别置于其实际解释的“慈爱”和“灾祸”之后。
