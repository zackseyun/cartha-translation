id: GEN.8.8
reference: Genesis 8:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח אֶת הַ/יּוֹנָ֖ה מֵ/אִתּ֑/וֹ לִ/רְאוֹת֙ הֲ/קַ֣לּוּ הַ/מַּ֔יִם מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/008.yaml
  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: zh_hans
  text: 随后，他把鸽子从自己身边放出去，要看看水是否已经从地面上退去了[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是否已经消退。”原文动词在这里表示洪水减少、退落。
    reason: lexical_alternative
  - marker: b
    text: 直译：“从地的表面之上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 随后……放出去
  rationale: 该叙事性连续形式推进事件次序；“随后”自然体现承接关系，“放出去”比笼统的“差遣”更符合挪亚放飞鸟的语境。
- source_word: הַיּוֹנָה
  choice: 鸽子
  rationale: יוֹנָה可指鸽类；“鸽子”是现代汉语中自然、明确且符合洪水叙事传统语境的译法。
- source_word: מֵאִתּוֹ
  choice: 从自己身边
  rationale: 保留原文表示离开挪亚本人或其所在之处的介词结构，不擅自改译为“从方舟里”。
- source_word: לִרְאוֹת
  choice: 要看看
  rationale: 不定式表示目的；“要看看”既直接对应“看”，又符合现代汉语叙事表达。
- source_word: הֲקַלּוּ
  choice: 是否已经……退去
  rationale: 此处קלל表示洪水减退、消退；“退去”适合水势，并保留疑问语气。
- source_word: הַמַּיִם
  choice: 水
  rationale: 希伯来语虽为形式上的复数，现代汉语以集合名词“水”表达更自然，意义无损。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 从地面上
  rationale: 清楚表达“从土地表面之上”的空间关系；אֲדָמָה在此指地面或土地，并非作为星球的“地球”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“随后”承接上文，“从自己身边”保留原文较不寻常但有意义的表达；正文中的[a][b]与脚注标记完全对应。
