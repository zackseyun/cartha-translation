base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: zh_hans
  text: 到了傍晚，鸽子来到他那里[a]。看哪，它嘴里衔着一片刚折下的橄榄叶[b]。挪亚就知道地上的水已经退了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“回到他那里”。希伯来语动词本身是“来”的意思，但上下文表明这是鸽子返回挪亚那里。
    reason: lexical_alternative
  - marker: b
    text: “刚折下的”所译的希伯来语词表示被扯下、折下或摘下，说明这片叶子是刚从活着的橄榄树上取下来的。
    reason: lexical_alternative
  - marker: c
    text: “已经退了”也可译作“已经消减了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: 来到他那里
  rationale: בוא 的通常含义是“来、进入”；上下文虽表明鸽子是回来，但动词本身并未明确表达“返回”，因此正文保留其基本意义，并以脚注说明语境含义。
- source_word: לְעֵת עֶרֶב
  choice: 到了傍晚
  rationale: 自然表达事件发生在傍晚时分，同时保留希伯来语的时间推进感。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 提请注意、带出眼前新发现的鲜明叙事作用。
- source_word: עֲלֵה זַיִת
  choice: 一片橄榄叶
  rationale: 直译为“橄榄（树）的叶子”；现代汉语以“一片橄榄叶”最自然清楚。
- source_word: טָרָף
  choice: 刚折下的
  rationale: 该词表示被扯下、折下或摘下；“刚折下的”既保留叶子从树上脱离的具体含义，也传达其新鲜状态，而不武断说明是谁或以何种动作折下。
- source_word: בְּפִיהָ
  choice: 它嘴里衔着
  rationale: 希伯来语直表“在它口中”；汉语描写鸟含物时用“衔着”自然准确。阴性后缀与“鸽子”的语法性一致，无须在汉语中以性别代词体现。
- source_word: וַיֵּדַע נֹחַ
  choice: 挪亚就知道
  rationale: “就”自然表达这片叶子使挪亚得出随后判断的叙事和推论关系。
- source_word: קַלּוּ הַמַּיִם
  choice: 水已经退了
  rationale: קלל 在此指水势减轻、消退；“水已经退了”是现代汉语描述洪水消退的自然说法。
- source_word: מֵעַל הָאָרֶץ
  choice: 地上的
  rationale: 与“水已经退了”组合，准确传达水从地面之上消退的空间关系，避免生硬直译。
