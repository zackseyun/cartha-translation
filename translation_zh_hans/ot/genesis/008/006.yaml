base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/006.yaml
  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: zh_hans
  text: 过了四十天[a]，挪亚打开了他所造的方舟的窗户。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“四十天期满时”。希伯来语 מִקֵּץ 在这里既可理解为一段时间结束之时，也可自然地译为“过了”。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“四十天期满时，事情是这样：挪亚打开了他所造的方舟的窗户。”这种译法较明确地保留希伯来语的叙事起首格式。
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这里的叙事公式承接下一个事件；现代汉语以句首时间短语直接推进叙事更自然，其顺承功能仍由语序表达。
- source_word: מִקֵּץ אַרְבָּעִים יוֹם
  choice: 过了四十天
  rationale: מִקֵּץ 表示一段时间达到终点；“过了四十天”是自然、准确的现代汉语，也保留“在四十天结束时”的可能理解。
- source_word: וַיִּפְתַּח
  choice: 打开了
  rationale: פתח 在此表示开启；“打开”符合窗户这一宾语，并由“了”自然标示叙事中的完成事件。
- source_word: חַלּוֹן
  choice: 窗户
  rationale: 该词通常指窗或窗状开口；在方舟语境中译作“窗户”清楚而符合惯用表达。
- source_word: הַתֵּבָה
  choice: 方舟
  rationale: תֵּבָה 在创世记洪水叙事中特指挪亚的方舟；“方舟”是准确且通行的中文称呼。
- source_word: אֲשֶׁר עָשָׂה
  choice: 他所造的
  rationale: 关系从句修饰“方舟”；“所造的”简洁表达建造先于开窗，无须额外加入原文没有明说的时态形式。
