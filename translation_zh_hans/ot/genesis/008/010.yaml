  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: zh_hans
  text: 他又等了七天[a]，再次把鸽子从方舟里放出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他又开始了七天的等候。”希伯来语动词更直译可作“开始”，但在这里按惯用法表示“等候”。
    reason: 词义异译
lexical_decisions:
- source_word: וַיָּחֶל
  choice: 等了
  rationale: 该动词更直译可理解为“开始”，但与“又……七天”这一时段表达连用时，语境中的惯用含义是等候；译作“等了”自然清楚。
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: 又等了七天
  rationale: עוֹד与אֲחֵרִים共同表明这是此前时段之外再增加的七天；现代汉语用“又等了七天”简洁表达这一层意思。
- source_word: וַיֹּסֶף שַׁלַּח
  choice: 再次……放出去
  rationale: וַיֹּסֶף在这里表示重复先前的行动，译作“再次”；שַׁלַּח指把鸽子送出方舟，汉语“放出去”符合这一具体情景。
- source_word: הַיּוֹנָה
  choice: 鸽子
  rationale: 定冠词表明这是上文已经提到的那只鸽子；汉语通常无需另加指示词也能保持所指明确。
- source_word: מִן הַתֵּבָה
  choice: 从方舟里
  rationale: מִן表示离开或出自，תֵּבָה在挪亚叙事中指方舟；“从方舟里”自然呈现由内向外的空间关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“又等了七天”避免生硬直译，同时以脚注保留原文动词“开始”的词义可能；“再次”清楚标示这是重复先前放出鸽子的行动。
