  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: zh_hans
  text: 到了第二个月二十七日，大地[a]已经干了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“陆地”或“地面”。希伯来语אֶרֶץ可指“大地”、“陆地”、“地面”或“土地”；这里译作“大地”，是因为洪水叙事以广阔的整体视角描述水退地干。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשֵּׁנִי
  choice: 到了第二个月
  rationale: וּ承接叙事，בַחֹדֶשׁ引出时间；中文用“到了”自然表现时间推进，又不把连接词生硬译为“并且”。
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: 二十七日
  rationale: 这是希伯来语的标准日期表达；现代汉语在月份已经明确时直接说“二十七日”，无需重复“这个月的”。
- source_word: יָבְשָׁה
  choice: 已经干了
  rationale: 该词是完成式，在这里描述洪水退去后达到的干燥状态；“已经干了”既体现结果，也符合现代汉语叙事。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ可指“大地、陆地、地面”或特定地域。洪水叙事在此采用广阔尺度，“大地”较能保留这种范围，同时脚注保留其他可能。
theological_decisions:
- issue: 洪水叙事中הָאָרֶץ的范围
  choice: 大地
  alternative: 陆地；地面；那地
  rationale: 原词本身具有范围上的弹性。正文采用与叙事宏观视角相称的“大地”，但不借译文断定其地理范围，脚注明确保留词义歧义。
translation_notes:
  register: 采用现代、庄重而自然的叙事语体。“到了……日”清楚表达时间推进；“已经干了”通俗准确。脚注标记置于实际存在词义分歧的“大地”之后。
