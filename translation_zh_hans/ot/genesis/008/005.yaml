base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: zh_hans
  text: 水不断退去，直到十月。十月初一，山顶都显露出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可以看见了”或“出现了”。希伯来语动词既可较形式地译作“被看见”，也可表示山顶随着水退而进入视野。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: 水
  rationale: 希伯来语 מַיִם 虽为复数形式，但现代汉语通常以“水”作集合性物质名词；此处无需勉强译成复数。
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: 不断退去
  rationale: היה 配合不定式绝对形表达持续、渐进的动作；“不断退去”既保留延续意义，也符合洪水逐渐消退的语境。
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: 直到十月
  rationale: חֹדֶשׁ 在叙事纪年中通常指“月”；“十月”在上下文中指第十个月，而非现代公历十月。
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: 十月初一
  rationale: 原文直述“在第十月，在该月第一日”；“十月初一”是自然、简洁且准确的现代汉语日期表达。
- source_word: נִרְאוּ
  choice: 显露出来
  rationale: ראה 的尼法勒形在此可表达被看见或进入可见状态；“显露出来”贴合水位下降后山顶进入视野的动态，又不指定观察者。
- source_word: רָאשֵׁי הֶהָרִים
  choice: 山顶
  rationale: רֹאשׁ 本义为“头”，用于地形时自然指山的顶部；“山顶”保留原有意象，也不把所有山顶限定为尖锐的“山峰”。
