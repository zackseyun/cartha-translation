base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: zh_hans
  text: 水从地面上不断退去[a]；一百五十天结束时，水减少了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不断”所译的希伯来语短语直译为“走着又返回”；在这里表达水持续、渐渐退去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 退去
  rationale: שׁוב本义是“返回、退回”；以洪水为主语并与“从地面上”连用时，译作“退去”自然地表达水从所覆盖之地撤退。
- source_word: מֵעַל הָאָרֶץ
  choice: 从地面上
  rationale: מֵעַל保留“从……上面”的空间图景，表明水原先覆盖地面；“从地面上”是现代汉语中准确而自然的表达。
- source_word: הָלוֹךְ וָשׁוֹב
  choice: 不断
  rationale: 这一不定式绝对式组合修饰主句动词，表达持续、渐进的退水过程。直译“走着又返回”在汉语中容易被误解为水来回往复，因此正文用“不停”式的持续义，并以脚注说明原文形式。
- source_word: וַיַּחְסְרוּ
  choice: 减少了
  rationale: חסר表示数量或程度变少；“减少了”清楚自然，并与前面的“退去”区分，保留原文使用两个不同动词的特点。
- source_word: מִקְצֵה
  choice: 到……结束时
  rationale: 该时间表达在此指一段时期届满；“到……结束时”保留时间终点的含义，也符合现代汉语习惯。
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: 一百五十天
  rationale: 按希伯来文数词准确直译。
