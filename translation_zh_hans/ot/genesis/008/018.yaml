    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 于是，挪亚就出来了
  rationale: 未完成式动词配叙事性连接词推进情节，并在此承接上一节上帝的命令。中文用“于是……就……”自然表达随即发生的行动；“出来”准确体现 יָצָא 在方舟场景中的方向。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וּבָנָיו
  choice: 他的儿子
  rationale: בָּנִים 此处明确指挪亚的几个儿子，而不是泛指子女；中文“儿子”保留原文的性别信息，单复数由语境自然表达。
- source_word: וְאִשְׁתּוֹ
  choice: 妻子
  rationale: 原文为单数名词加第三人称阳性单数后缀，即“他的妻子”。在与“他的儿子”并列的中文结构中省略重复的“他的”，归属仍然清楚。
- source_word: וּנְשֵׁי בָנָיו
  choice: 儿媳
  rationale: 原文直译为“他儿子的妻子们”。“儿媳”是现代中文中自然、准确的亲属称谓，也避免“儿子的妻子”可能产生的单数误读。
- source_word: אִתּוֹ
  choice: 同他一起
  rationale: 介词 אֵת 加第三人称阳性单数后缀表示“和他一同”。“同他一起”自然收束整个人物列表。
