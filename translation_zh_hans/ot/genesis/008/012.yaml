  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: zh_hans
  text: 他又等了七天，然后放出那只鸽子；它没有再回到他那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它不再回到他那里。”希伯来语中，否定词与“继续/增加”和“回来”连用，既可理解为“没有再次回来”，也可理解为“不再回来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: 他……等了
  rationale: 此处 יחל 表示“等候、等待”；叙事性的 וַ־ 结合上下文译入“又”，自然承接前一轮等候。
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: 又等了七天
  rationale: עוֹד 与 אֲחֵרִים 共同表明这是另一个七天的时段。现代汉语用“又……七天”即可自然表达重复和追加，避免“又等了另外七天”的累赘。
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: 便放出鸽子
  rationale: שׁלח 的基本义为“差遣、送出”；在从方舟放飞鸟的场景中，“放出”自然准确，又不必强化为永久“释放”。“便”承接叙事次序。
- source_word: וְלֹא יָסְפָה שׁוּב אֵלָיו עוֹד
  choice: 鸽子再没有回到他那里
  rationale: 否定的 יסף 与 שׁוּב、末尾 עוֹד 连用，可表达“没有再次回来”或“不再回来”。主句采用自然的“再没有回到”，同时借脚注保留另一种理解。希伯来语阴性动词与“鸽子”一致，汉语为清楚起见重复名词。
