language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: zh_hans
  text: 你身边的一切活物，就是各类有血肉的生物——飞鸟、牲畜和一切在地上爬行的动物——你都要把它们和你一起带出来，好叫它们在地上滋生[a]，在地上生养众多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “滋生”或译“大量繁衍”。希伯来语动词含有成群涌生、繁衍兴旺的意思。
    reason: 说明שׁרץ所含的旺盛增殖意味及可接受的译法。
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: 一切……活物
  rationale: חַיָּה在这里泛指活的受造物；下文列举飞鸟、牲畜和爬行动物，因此不宜窄化为“野兽”。
- source_word: אֲשֶׁר אִתְּךָ
  choice: 与你同在的
  rationale: 直接保留修饰“活物”的关系从句，表达自然清楚。
- source_word: מִכָּל בָּשָׂר
  choice: 各类有血肉的活物
  rationale: בָּשָׂר字面为“肉”，在洪水叙事中集合性地指有血肉的生物；补出“活物”使现代汉语明白，同时保留该希伯来表达的意象。
- source_word: בָּעוֹף
  choice: 飞鸟
  rationale: עוֹף可泛指会飞的生物；在本节三类动物的列举中，“飞鸟”自然且准确。
- source_word: וּבַבְּהֵמָה
  choice: 牲畜
  rationale: בְּהֵמָה常指较大型的陆生动物，尤其家畜；此处译作“牲畜”符合列举语境。
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: 和一切在地上爬行的动物
  rationale: רֶמֶשׂ及同根分词רֹמֵשׂ描述贴近地面活动的小动物。汉语避免使用容易被理解为现代生物分类的“爬行动物”作为固定类别，而用描述性短语表达。
- source_word: הוֹצֵא אִתָּךְ
  choice: 都要和你一起带出来
  rationale: יצא的使役命令式要求挪亚使这些动物出去；“带出来”保留使役意义，“和你一起”对应אִתָּךְ。
- source_word: וְשָׁרְצוּ
  choice: 使它们……滋生
  rationale: שׁרץ含有大量涌生、繁衍的意味；“滋生”简洁保留其旺盛增殖的色彩，并以“使”体现此处命令所指向的结果。
- source_word: וּפָרוּ וְרָבוּ
  choice: 生养众多
  rationale: 这一措辞呼应《创世记》第一章的创造赐福用语，在中文中以熟悉而庄重的表达保留其文学联系。
- source_word: בָאָרֶץ / עַל הָאָרֶץ
  choice: 在地上
  rationale: 本节处于洪水后的普世语境，אָרֶץ指大地；“在地上”适合动物活动和繁衍的语义。
theological_decisions:
- issue: 洪水之后对创造赐福用语的呼应
  choice: 保留“滋生，生养众多”的递进表达
  alternative: 概括译为“大量繁殖”或“不断增加”
  rationale: וְשָׁרְצוּ וּפָרוּ וְרָבוּ有意重现创造叙事中关于旺盛繁衍的词汇。“生养众多”保留《创世记》内部的文学—神学呼应，而不额外解释其意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。破折号标示列举性的同位说明，使长句层次清楚；避免古奥的“昆虫”或可能造成现代分类误解的固定术语“爬行动物”。
