  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: zh_hans
  text: 你和你的妻子、儿子以及儿媳[a]，要一同从方舟里出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“你儿子们的妻子”。
    reason: 说明正文亲属称谓“儿媳”所对应的原文表达。
lexical_decisions:
- source_word: צֵא
  choice: 出来
  rationale: 这是 יצא 的阳性单数祈使式，直接命令挪亚离开方舟；汉语用“出来”自然表达从封闭空间向外移动。
- source_word: מִן הַתֵּבָה
  choice: 从方舟里
  rationale: 介词 מִן 表示从内部向外移动；“方舟”是 תֵּבָה 在挪亚叙事中的通行且准确译法，加“里”使汉语空间关系清楚自然。
- source_word: אַתָּה
  choice: 你
  rationale: 独立人称代词明确并略加强受命者；译文以“你要”保留其明确性。
- source_word: וְאִשְׁתְּךָ
  choice: 你的妻子
  rationale: אִשָּׁה 在所属关系和当前语境中明确指妻子。
- source_word: וּבָנֶיךָ
  choice: 儿子
  rationale: בָּנִים 此处特指儿子，并与随后所说他们的妻子相呼应，不泛化为“孩子”。
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: 儿媳
  rationale: 原文是“你儿子们的妻子”；正文采用现代汉语简洁自然的亲属称谓“儿媳”，并用脚注保留原文结构。
- source_word: אִתָּךְ
  choice: 同你一起
  rationale: 表示陪同、伴随；“同你一起”清楚传达全家与挪亚一同出方舟。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。分号区分对挪亚本人的命令与同行家人的列举；后半句补出“出来”，使汉语完整顺畅，同时保留“同你一起”的陪同关系。
