  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: zh_hans
  text: 他放出乌鸦，乌鸦出去后，持续往返[a]，直到地上的水都干了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“它出去，出去又返回。”希伯来语以重复的“出去”和“返回”描写持续、反复的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 他放出
  rationale: 叙事连续式推进情节；“放出”自然表达把鸟从方舟中放出去，又不额外说明其飞行方式。
- source_word: הָעֹרֵב
  choice: 乌鸦
  rationale: 带定冠词的普通鸟名；“乌鸦”是现代汉语中准确、通行的对应词。
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: 乌鸦出去后，就来来回回[a]
  rationale: 有限动词与两个不定式绝对形共同描写乌鸦持续、反复地出去又返回。“来来回回”在现代汉语中自然地传达这种反复运动；脚注保留较形式对应的表达。
- source_word: עַד יְבֹשֶׁת
  choice: 直到……都干了
  rationale: עַד引出反复行动的终点；“都干了”自然表达洪水完全退干的状态。
- source_word: הַמַּיִם
  choice: 水
  rationale: מַיִם在希伯来语中采用复数形，但现代汉语通常用不可数的“水”，无需机械复制数的形式。
- source_word: מֵעַל הָאָרֶץ
  choice: 地上的
  rationale: 简洁传达水原在地面之上、后来从地上干去的空间关系，符合现代汉语习惯。
