source:
  edition: WLC
  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: zh_hans
  text: 到了七月，在本月十七日，方舟停在亚拉腊的群山上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“亚拉腊的群山”，指亚拉腊地区的山地，并不特指某一座称为“亚拉腊山”的山峰。
    reason: 说明原文的复数地理表达，防止读者按传统说法误解为单一山峰。
lexical_decisions:
- source_word: וַתָּנַח
  choice: 停在
  rationale: 动词 נוח 的连续式在此描述方舟到达并处于安定停驻的状态；“停在”简明自然，也保留了方舟停止漂流、落定于某处的事件含义。
- source_word: הַתֵּבָה
  choice: 方舟
  rationale: 这是现代汉语中挪亚叙事里 תֵּבָה 的通行译法；既符合上下文，也避免采用容易使读者误解为普通箱柜的字眼。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: 到了七月
  rationale: 介词 בְּ 引出时间；“到了七月”符合现代汉语叙事习惯，并自然承接洪水故事的时间进程。
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: 在本月十七日
  rationale: 这是希伯来语的日期表达。“本月十七日”准确指向前述第七个月，语言简洁清楚。
- source_word: עַל
  choice: 在……上
  rationale: 此处是表示位置的介词，译为“在……上”直接而自然。
- source_word: הָרֵי אֲרָרָט
  choice: 亚拉腊的群山
  rationale: הָרֵי 是复数附属形式，直指亚拉腊地区的多座山或山地；“群山”既保留复数，也避免误译为某一座名为“亚拉腊山”的特定山峰。
theological_decisions:
- issue: הָרֵי אֲרָרָט 的地理范围
  choice: 亚拉腊的群山
  alternative: 亚拉腊山
  rationale: 原文使用复数“群山”，并未指定单独一座山峰。保留复数可避免把后来的特定地理认定带入经文；这主要是词汇和地理层面的决定，而非教义判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“到了七月”推进叙事时间，“在本月十七日”清楚表达日期；脚注标记紧随其实际说明的“亚拉腊的群山”，而不置于“七月”之后。
