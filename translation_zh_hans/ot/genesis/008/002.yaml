  text: וַ/יִּסָּֽכְרוּ֙ מַעְיְנֹ֣ת תְּה֔וֹם וַֽ/אֲרֻבֹּ֖ת הַ/שָּׁמָ֑יִם וַ/יִּכָּלֵ֥א הַ/גֶּ֖שֶׁם מִן הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: zh_hans
  text: 深渊的泉源和天上的窗户都关闭了[a]，从天上降下的雨也被止住了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的闸门”。希伯来文直指天上的开口或窗户。
    reason: lexical_alternative
  - marker: b
    text: 或译“从天上降下的雨也停了”。希伯来动词可以强调雨被拦住，结果不再降下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: 都关闭了
  rationale: 该词是סכר的尼法勒式，表示“被关闭、被堵住”；“关闭”既保留被动含义，也能自然地同时搭配“泉源”和“窗户”。
- source_word: מַעְיְנֹת
  choice: 泉源
  rationale: 指涌出水的源头；“泉源”在现代汉语中自然，也适合洪水叙事的语境。
- source_word: תְּהוֹם
  choice: 深渊
  rationale: 指创世叙事中的广大深水或原初之深；“深渊”保留其宇宙性意象，并与创世记1:2的用语相协调。
- source_word: אֲרֻבֹּת
  choice: 窗户
  rationale: 本义为“窗户、开口”；主文保留天上开口的具体意象，不以解释性更强的“闸门”取代。
- source_word: הַשָּׁמַיִם
  choice: 天上
  rationale: 在汉语中，“天上”自然承载此处天空或诸天的宇宙性意象，也保留原文前后两次出现该词的呼应。
- source_word: וַיִּכָּלֵא
  choice: 被止住了
  rationale: 该动词表示被拦住、被抑制；“被止住了”保留受制止的语义，而不只陈述雨停止这一结果。
- source_word: הַגֶּשֶׁם
  choice: 雨
  rationale: 这是该词在此叙事语境中直接、自然的对应表达。
- source_word: מִן הַשָּׁמָיִם
  choice: 从天而降
  rationale: 自然表达雨来自天上，同时保留原文再次提到“天”的重复。
