  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: zh_hans
  text: 然而，上帝记念挪亚[a]和方舟里与他同在的一切野兽和一切牲畜。上帝使风吹过大地[b]，水就消退了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记念”也可译作“顾念”。希伯来语的“记念”常包含信实地采取行动之意，并非只是回想起来。
    reason: lexical_alternative
  - marker: b
    text: “风”所对应的希伯来语也可指“气息”或“灵”。这里按上下文译作“风”，但也可能令人联想到创世记1:2中运行在水面上的灵或风。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: 记念
  rationale: 保留希伯来语的拟人化表达及其叙事和神学意味；此处不只是想起，也含有顾念并采取行动之意。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 上下文中动词为单数，指独一的上帝；“上帝”是现代汉语中自然、庄重的通行译法。
- source_word: כָּל הַחַיָּה
  choice: 一切野兽
  rationale: חַיָּה与后面的בְּהֵמָה并列时，宜指野生动物；这样可保留原文两类动物的区别。
- source_word: כָּל הַבְּהֵמָה
  choice: 一切牲畜
  rationale: 此词在与חַיָּה对举时主要指家养陆生动物；“牲畜”简明自然。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 与他同在的
  rationale: 直接表达原文关系从句，同时在现代汉语中流畅自然。
- source_word: בַּתֵּבָה
  choice: 方舟里
  rationale: “方舟”是挪亚叙事中תֵּבָה的固定而明确的汉语译法。
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: 使风吹过
  rationale: רוח虽可指风、气息或灵，但此处直接造成洪水消退，气象意义最符合语境；“使……吹过”也体现עבר使役式。
- source_word: עַל הָאָרֶץ
  choice: 大地
  rationale: אֶרֶץ可指地或大地；洪水叙事在此具有广阔范围，“大地”兼顾自然汉语和原文含义。
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: 水就渐渐退去
  rationale: 动词表示平息、消退；“渐渐退去”符合洪水语境和后续水势持续下降的叙述。
- source_word: וַ
  choice: 然而
  rationale: 句首连接词既承接前文，也标示叙事从审判转向拯救的显著转折；“然而”不改变事件内容。
theological_decisions:
- issue: “上帝记念挪亚”的拟人化语言
  choice: 在正文保留“上帝记念挪亚”
  alternative: 上帝顾念挪亚；上帝把注意力转向挪亚
  rationale: 保留原文措辞及其文学张力，不把它解释成上帝先前遗忘；上下文表明这记念体现为信实的行动。
- issue: 洪水叙事中רוּחַ的含义
  choice: 正文译为“风”
  alternative: 灵
  rationale: 该词虽可指“灵”，但这里的直接功能是使水消退，故“风”最合语境；与创世记1:2可能形成的呼应则在脚注中说明，不在正文中排除其文学余韵。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“记念”略带经文语体，用来保留原文惯用表达；其含义由脚注解释。动物类别分别译为“野兽”和“牲畜”，避免合并原文的对举。句式保持叙事节奏，同时不以解释性措辞消除原文中“记念”和רוּחַ的张力。
