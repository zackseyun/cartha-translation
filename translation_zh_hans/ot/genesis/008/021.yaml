  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: zh_hans
  text: 耶和华闻到那馨香之气，就心里说：“我不再因人的缘故咒诅土地，因为[a]人心里的意念自幼就是恶的；我也不再像我所做过的那样，击杀一切活物。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来语连词通常译作“因为”；按上下文也可理解为“虽然”。
    reason: 保留“不再咒诅”与“人心意念为恶”之间真实存在的语义和神学张力。
lexical_decisions:
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: 馨香之气
  rationale: 表达蒙悦纳、令人愉悦的祭物香气；用现代而庄重的汉语呈现，不把词义扩展为原文未明说的祭祀结论。
- source_word: אֶל־לִבּוֹ
  choice: 心里说
  rationale: 忠实保留希伯来语“对自己的心说”的内在言说意象，同时符合现代汉语习惯。
- source_word: יֵצֶר לֵב הָאָדָם
  choice: 人心里的意念
  rationale: יֵצֶר可指内在构想、倾向或意图；“意念”既自然，也避免把含义过度限定为抽象的道德本性。
- source_word: מִנְּעֻרָיו
  choice: 自幼
  rationale: 简洁对应“从他的幼年／年少时起”，保留从人生早期即如此的时间含义。
- source_word: לְהַכּוֹת אֶת־כָּל־חַי
  choice: 击杀一切活物
  rationale: 保留动词“击打”的致死语境，并以“一切活物”对应原文的广泛范围。
theological_decisions:
- issue: כִּי所连接的逻辑关系
  choice: 正文译作“因为”，并加注说明可能的让步理解
  alternative: “虽然人心里的意念自幼就是恶的”
  rationale: כִּי通常表达原因，但此处恶的意念与不再咒诅之间的逻辑关系形成张力；正文保留最直接的因果读法，脚注承认语境中可能的让步理解，不替读者消除张力。
- issue: “人心里的意念”是否应译成固定的教义术语
  choice: 采用普通语言“意念”
  alternative: “本性”“罪性”或“倾向”
  rationale: 原文描述人内心构想或倾向为恶，却没有使用后世系统神学术语；因此避免导入特定宗派框架。
translation_notes:
  register: 采用现代标准普通话和庄重叙事语体。“耶和华”沿用中文圣经中广为人知的神名表达；句式清楚自然，同时保留“心里说”、土地受咒诅以及击杀一切活物等原文意象。
