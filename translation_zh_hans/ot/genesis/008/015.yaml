lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说
  rationale: 连续式叙事动词推动情节向前；“于是”自然表达先后承接关系。“说”符合现代汉语引出直接引语的习惯，同时准确传达此处的言说动作。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指独一的上帝；“上帝”是现代标准汉语中自然、庄重且通行的译法。
- source_word: אֶל
  choice: 对
  rationale: 该介词标明言说的对象；汉语通常用“对……说”表达。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后话语的内容。现代汉语以“说：”自然承接直接引语，无须机械重复译为“说着”。
