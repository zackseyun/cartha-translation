  to: 可是，鸽子找不到落脚的地方[a]，就回到他那里，回到方舟，因为水在全地的表面上。于是他伸手接住鸽子，把它带到自己身边，带进方舟。
  rationale: 删除并非原文明确表达的“仍”，将水的所在译为“在全地的表面上”，保留原文的表面意象而不强化为“覆盖”。末句改用“带进方舟”，明确挪亚是带领鸽子进入方舟的施事，同时保留“到自己身边”和“进方舟”两个原文成分。
