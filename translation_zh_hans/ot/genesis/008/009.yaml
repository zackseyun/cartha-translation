base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: zh_hans
  text: 可是，鸽子找不到落脚的地方[a]，就回到他那里，回到方舟，因为水在全地的表面上。于是他伸手接住鸽子，把它带到自己身边，带进方舟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“供它脚掌歇息之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: 落脚的地方
  rationale: 该短语直指鸽子脚掌可以停歇、着落之处；“落脚的地方”在现代汉语中自然，也保留具体场景。
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: 就回到他那里，回到方舟
  rationale: 分别保留“到他那里”和“到方舟”两个方向成分，避免将前者省略。
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: 水仍遍布全地表面
  rationale: “全地表面”保留 פְּנֵי 的表面意象；“遍布”自然表达水处于整个地面之上的状态。“仍”由叙事语境隐含，用以流畅表达持续状态。
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: 他伸手
  rationale: 这是现代汉语表达伸出手去的自然说法，准确传达该希伯来语惯用结构。
- source_word: וַיִּקָּחֶהָ
  choice: 接住鸽子
  rationale: לקח 基本义为“拿、取”；在鸽子飞回而挪亚伸手的语境中，“接住”最符合动作场景，同时明确代词所指。
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: 把它带到自己身边，进了方舟
  rationale: 保留“到自己身边”与“进方舟”两个要素，并依照汉语习惯组织语序。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“鸽子”在汉语中通常不标语法性别，故用“它”。句中明确“接住鸽子”，减少连续代词造成的歧义。
