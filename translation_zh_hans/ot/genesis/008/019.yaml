- from: 所有走兽、所有爬行动物和所有飞鸟，就是一切在地上活动的，都按各自的族群[a]出了方舟。
  to: 所有走兽、所有爬行的动物和所有飞鸟——即一切在地上活动的生物——都按各自的家族[a]出了方舟。
  rationale: 修订仅处理两处可能造成语义偏移的词语，并润饰总括结构：以“爬行的动物”保留 רֶמֶשׂ 的宽泛古代分类含义；以“家族”对应 מִשְׁפָּחָה，并在脚注中保留动物语境下的群组含义。其余内容维持原有意思、叙事语气和脚注锚点。
