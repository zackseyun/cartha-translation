base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: zh_hans
  text: 所有走兽、所有爬行的动物和所有飞鸟——即一切在地上活动的生物——都按各自的家族[a]出了方舟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按各自的群体”或“一族一族地”。希伯来语原文直译为“按他们的家族”；用于动物时，可指按各自的家族式群组或分支。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: 所有走兽
  rationale: 这里的 חַיָּה 与爬行动物和飞鸟并列，指陆地上的兽类；“走兽”保留这一类别含义，又不限定为野生或家养。כָּל 译为“所有”。
- source_word: כָּל הָרֶמֶשׂ
  choice: 所有爬行动物
  rationale: רֶמֶשׂ 指贴近地面移动的小动物；“爬行动物”在现代汉语中通顺，并符合《创世记》此处的动物分类语境，但不应狭义理解为现代生物分类学中的爬行纲。
- source_word: וְכָל הָעוֹף
  choice: 和所有飞鸟
  rationale: עוֹף 可泛指会飞的生物，但在这里与其他动物类别并列，译作“飞鸟”最自然，也保留其飞行特征。
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: 就是一切在地上活动的
  rationale: רוֹמֵשׂ 与 רֶמֶשׂ 属同一语义范围。译作“活动”可避免“爬行动物……爬行”在汉语中的生硬重复，同时保留其在地面移动的宽泛含义。
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: 按各自的族群
  rationale: מִשְׁפָּחָה 通常指家族或宗族；用于动物时表示按血缘群体或分组。“族群”在现代汉语中较自然，同时不把它直接等同于“种类”。
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: 出了方舟
  rationale: יָצְאוּ 是“出去、出来”的普通动词；“出了方舟”简洁自然。תֵּבָה 在挪亚叙事中采用约定俗成的“方舟”。
