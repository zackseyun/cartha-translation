base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: zh_hans
  text: 挪亚为雅威筑了一座坛，又分别从各类洁净的牲畜和各类洁净的飞鸟中取了一些，在坛上献作燔祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 筑了
  rationale: בנה意为“建造”；与“坛”搭配时，现代汉语圣经语体中“筑坛”自然、庄重。
- source_word: מִזְבֵּחַ
  choice: 坛
  rationale: מזבח指献祭之坛；“坛”在上下文中明确且比“祭坛”更简洁，后文“在坛上”也自然。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל在“筑坛”结构中表示对象或归属，可自然译为“为”；יהוה按其专名音译为“雅威”。
- source_word: מִכֹּל הַבְּהֵמָה הַטְּהוֹרָה
  choice: 从各类洁净的走兽中取了一些
  rationale: מִן表达从中选取的部分关系，כֹּל在这里涵盖各类别；“一些”明示合乎语境的部分义，避免误解为把每只洁净动物都献上。בְּהֵמָה在此与飞鸟并列，译“走兽”可清楚区分两类生物，又不局限于家畜。
- source_word: וּמִכֹּל הָעוֹף הַטָּהֹר
  choice: 和各类洁净的飞鸟中取了一些
  rationale: עוֹף本可泛指有翼飞行生物；献祭语境中“飞鸟”自然准确。汉语将共同的“从……中取了一些”结构前后贯通。
- source_word: וַיַּעַל עֹלֹת
  choice: 献作燔祭
  rationale: עלה的使役式在祭祀语境中意为献上；עֹלֹת是复数的全烧祭物。“献作燔祭”以自然汉语表达动作及祭类，复数信息由所取的多只祭牲及集合语境体现。
- source_word: בַּמִּזְבֵּחַ
  choice: 在坛上
  rationale: ב介词在此表示献祭所在的位置，“在坛上”是自然的现代汉语表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。音译“雅威”保留其专名性质，不以称号替代，也不采用较晚形成的混合读音。
- issue: מִכֹּל的部分义
  choice: 从各类……中取了一些
  alternative: 从所有……中取了；取了各样……
  rationale: 原文形式上是“从每一/所有……中取”，语境表明这是从各类洁净生物中选取祭牲，并非将所有洁净生物全部献掉。译出“一些”使部分关系清楚，但以“各类”保留כֹּל的范围。
- issue: “洁净”的性质
  choice: 洁净
  alternative: 礼仪上洁净；可作祭牲
  rationale: טָהוֹר在此具有祭祀分类含义，但原文只说“洁净”，正文不加解释，以免把后来的制度细节过度写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“筑坛”“燔祭”保留必要的圣经祭祀术语；句法顺畅，避免古奥虚词。原文没有必须另列脚注才能保存的实质歧义，因此正文不设脚注。
