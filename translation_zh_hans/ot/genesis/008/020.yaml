    issue: “走兽”不够精确对应 בְּהֵמָה。
    rationale: בְּהֵמָה 通常指牲畜/畜类；“走兽”可泛指陆地野兽，扩大了原词范围。
  - severity: low
    issue: “一些”的分配关系可更明确。
    rationale: 希伯来文分别说从所有洁净牲畜中、并从所有洁净飞鸟中取；加“分别”可避免将其读作只从合并的两组中总共取一些。
