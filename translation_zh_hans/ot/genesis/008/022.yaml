source:
  edition: WLC
  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: zh_hans
  text: 大地尚存之日[a]，播种和收割、寒冷和炎热、夏季和冬季、白昼和黑夜，都不会止息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“大地所有的日子。”
    reason: 说明原文时间短语的字面形式，以及正文“大地尚存之日”的意译依据。
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: 大地尚存之日
  rationale: 这一时间短语直译近似“大地所有的日子”；“大地尚存之日”用自然、凝练的现代汉语表达其持续范围，同时保留应许限于大地存续期间的含义。
- source_word: זֶרַע וְקָצִיר
  choice: 播种和收割
  rationale: זֶרַע在与“收割”配对时指播种这一农事活动，而非作为物体的“种子”；两项并列表达农业周期。
- source_word: קֹר וָחֹם
  choice: 寒冷和炎热
  rationale: 保留原文气候两极的对举；“寒冷”和“炎热”是清楚、自然的现代汉语对应词。
- source_word: קַיִץ וָחֹרֶף
  choice: 夏季和冬季
  rationale: 两词通常分别指夏季和冬季；虽可关联当地的旱季和雨季，但正文采用读者最易理解且忠于常用词义的译法。
- source_word: יוֹם וָלַיְלָה
  choice: 白昼和黑夜
  rationale: 保留原文表示昼夜循环的固定对偶，并使各组名词在汉语中节奏协调。
- source_word: לֹא יִשְׁבֹּתוּ
  choice: 都不会止息
  rationale: שׁבת在此意为停止、止息；复数动词统摄前述各组周期。“止息”既准确又庄重，且“不会”不超出原文所限定的时间范围。
theological_decisions:
- issue: 创造秩序中各循环持续的范围
  choice: 译为这些循环在“大地尚存之日”不会止息
  alternative: 将其译成不加限制、直到永远都不会停止
  rationale: כָּל יְמֵי הָאָרֶץ明确给出时间范围，因此译文保留这一限定，不把经文扩大为关于绝对永恒的断言。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。四组并列成分保持原文的对偶与节奏；以“都”明确末尾谓语统摄全部项目。
