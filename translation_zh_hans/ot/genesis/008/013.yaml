  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: zh_hans
  text: 第六百零一年[a]，一月初一，地上的水已经干了。挪亚揭去方舟的遮盖物[b]，一看，只见地面已经干了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 上下文表明，这很可能是指挪亚年岁的第六百零一年；本节原文只说“第六百零一年”。
    reason: 说明时间计算基准在本节中是隐含的。
  - marker: b
    text: 或译“方舟的顶盖”。原词泛指覆盖之物，并未明确说明具体构造。
    reason: 保留建筑意义上的可能译法，同时避免正文过度具体化。
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入时间句，不另译）
  rationale: 这里的叙事连接词引出时间说明；现代汉语直接以日期起句更自然，也保留了叙事推进。
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: 第六百零一年
  rationale: 原文以希伯来语数词习惯表达“六百零一年”；上下文暗示这是按挪亚的年岁计算，但本节本身没有明说，因此正文不加“挪亚活到”。
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: 正月初一
  rationale: 意为第一月的第一日；“正月初一”是自然清楚的现代汉语日期表达，不赋予后世历法名称。
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: 地上的水都干了
  rationale: חרב表示干涸、干掉；“地上的水都干了”自然表达水从地面退去并干涸的结果。
- source_word: וַיָּסַר
  choice: 揭去
  rationale: 使役形式表示移开、除去；与可揭除的遮盖物搭配时，“揭去”比泛泛的“移走”更自然。
- source_word: מִכְסֵה הַתֵּבָה
  choice: 方舟的遮盖物
  rationale: מִכְסֵה的基本意思是覆盖之物，不必具体解释为固定的屋顶；“遮盖物”保留其范围。
- source_word: וַיַּרְא וְהִנֵּה
  choice: 向外一看，只见
  rationale: “一看，只见”兼顾观看动作和הִנֵּה引人注意、呈现眼前景象的功能，比直译“看哪”更符合现代汉语叙事。
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: 地面已经干了
  rationale: פְּנֵי在此指表面，הָאֲדָמָה指土地、地面；译作“地面”简洁自然。“已经”体现挪亚观看时所见的完成状态。
theological_decisions:
- issue: “第六百零一年”的计算基准
  choice: 正文保留原文未明说计算基准的形式，仅译“第六百零一年”
  alternative: 译作“挪亚六百零一岁那一年”
  rationale: 创世记7:11的上下文使其很可能指挪亚年岁的第六百零一年，但本节希伯来文本没有出现“挪亚”或“生平/岁数”，不宜在正文中把上下文推断写成明说。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正月初一”“一看，只见”便于普通读者理解；避免古雅的“于是便有”“看哪”等表达。正文中的[a]、[b]均与脚注对应。
