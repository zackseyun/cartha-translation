  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: zh_hans
  text: 我要在我、你和你以后的后裔之间坚立我的约，使这约世世代代成为永远的约；我要作你和你以后后裔的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: 我要……坚立
  rationale: הקים与“约”连用，可指设立、确立或坚立。这里用“坚立”既保留上帝主动确立并使约稳固的含义，也符合庄重而自然的现代汉语。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: 直接保留第一人称所属关系；“约”是现代中文圣经语境中准确、简洁且易懂的对应词。
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: 在我与你，以及……之间
  rationale: 保留重复介词所标明的立约双方，同时用“以及”使中文句法清楚自然。
- source_word: זַרְעֲךָ
  choice: 你的子孙
  rationale: זֶרַע是集合单数，可表示后裔整体。中文“子孙”自然地表达群体与世代延续，但不像“后裔”那样偏书面，也不强行限定为某一个人。
- source_word: אַחֲרֶיךָ
  choice: 你后世的
  rationale: 在族谱和世代延续的语境中，“你后世的子孙”比逐字译作“你以后的子孙”更自然，并清楚表达在亚伯拉罕之后而来的后代。
- source_word: לְדֹרֹתָם
  choice: 世世代代
  rationale: 准确表达约持续贯穿他们各代的含义，且是自然、庄重、易懂的现代汉语。
- source_word: לִבְרִית עוֹלָם
  choice: 作永远的约
  rationale: 保留ל的表语作用；עוֹלָם在此强调持久、恒常，用“永远”承接经文的强度而不另加期限解释。
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: 我要作你的上帝
  rationale: 希伯来文直译近于“对你作上帝”。现代汉语以“作你的上帝”最自然，也完整保留立约关系公式。
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: 和你后世子孙的
  rationale: 与前面的זַרְעֲךָ保持一致，并用所有格结构自然表达“作他们的上帝”。
theological_decisions:
- issue: 亚伯拉罕“后裔/种子”的集合单数
  choice: 子孙
  alternative: 后裔；种子
  rationale: 希伯来语זֶרַע在形式上是单数，在此可集合性地指延续多代的后代。“子孙”保留群体含义，又不把经文解释成严格的语法复数或某个单独人物；脚注说明原文形式，以保存其词义张力。
- issue: 立约公式 לִהְיוֹת לְךָ לֵאלֹהִים
  choice: 作你的上帝
  alternative: 对你作上帝
  rationale: “作你的上帝”是自然中文，准确表达上帝与亚伯拉罕及其子孙之间的立约关系；没有额外加入归属、救恩范围或教派性的解释。
- issue: עוֹלָם所表达的持续性
  choice: 永远的约
  alternative: 永久的约；长存的约
  rationale: “永远”最直接呈现原文在立约语境中的持久性，同时不在正文中另行界定其哲学或时间含义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“坚立我的约”“世世代代”“作……的上帝”保留立约宣告的庄严节奏；避免生硬照译，同时以脚注保存זֶרַע的集合单数特征。
