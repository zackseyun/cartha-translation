- from: 神说：“不！你妻子撒拉必给你生一个儿子，你要给他起名叫以撒[a]。我要与他坚立我的约，作他和他后裔永远的约。”
  to: 神说：“不！你妻子撒拉必给你生一个儿子，你要给他起名叫以撒[a]。我要与他坚立我的约；这约要成为永远的约，延及他以后的后裔。”
  rationale: 仅修改末句，以消除汉语句法歧义，并更清楚保留希伯来文的次序：神与以撒坚立其约；此约是永远的约，并延及以撒以后的后裔。未扩大或限定该约的神学范围。
