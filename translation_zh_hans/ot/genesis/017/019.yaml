    issue: 末句“作他和他后裔永远的约”句法和关系指向不清。
    rationale: 原文将立约对象首先明确为以撒（“与他”），继而说明此约是永远的约，并指向其以后的后裔。现译将“他和他后裔”紧连，易模糊这一结构，且汉语不够自然。
