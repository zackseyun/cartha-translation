base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: zh_hans
  text: 神说：“不！你妻子撒拉必给你生一个儿子，你要给他起名叫以撒[a]。我要与他坚立我的约；这约要成为永远的约，延及他以后的后裔。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以撒”这个名字听起来像希伯来语中表示“他笑”或“他将要笑”的动词形式。
    reason: 保留名字 יִצְחָק 与希伯来语动词“笑”之间的语音和词义关联。
lexical_decisions:
- source_word: אֲבָל
  choice: 不！
  rationale: 在上下文中，这是对亚伯拉罕先前为以实玛利所求之事的直接纠正；用“不”表达其纠正语气，同时不添加原文以外的解释。
- source_word: יֹלֶדֶת
  choice: 必给你生
  rationale: 该词形态上是分词，但在应许和预告的语境中指将来的事；“必”也传达神话语中的确定性。
- source_word: וְקָרָאתָ אֶת־שְׁמוֹ
  choice: 你要给他起名叫
  rationale: 采用现代汉语自然的命名表达，同时保留希伯来文命名公式的命令意味。
- source_word: יִצְחָק
  choice: 以撒
  rationale: 采用现代中文圣经传统中通行的人名译法，并以脚注保留其希伯来语文字关联。
- source_word: וַהֲקִמֹתִי אֶת־בְּרִיתִי
  choice: 我要……坚立我的约
  rationale: “坚立”反映使约确立并持续有效的含义，也保留立约语境的庄重感。
- source_word: אִתּוֹ
  choice: 与他
  rationale: 明确表达约与以撒本人建立的关系，而不只表示约使他受益。
- source_word: לִבְרִית עוֹלָם
  choice: 作……永远的约
  rationale: 自然表达该约的性质和持续性；“永远”避免额外引入哲学化的时间概念。
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: 他和他后裔
  rationale: “后裔”自然表达 זרע 的集合性意义；结合“与他”译作“他和他后裔”，清楚呈现该约从以撒延及他以后的后裔。
theological_decisions:
- issue: 圣约应许的范围与延续
  choice: 直译为神与以撒坚立圣约，并使这约延及他的后裔。
  alternative: 把本节限定为纯粹的民族性应许，或直接套入后来的基督教圣约体系。
  rationale: 本节本身只明确宣告约与以撒坚立，并延续到他的后裔；译文不缩小或扩大其神学范围。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不！”体现 אֲבָל 在语境中的纠正力度；“必给你生”“坚立我的约”兼顾自然表达与立约文体。脚注标记紧随“以撒”，便于读者准确识别说明对象。
