  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: zh_hans
  text: 凡未受割礼的男子，若其包皮肉未受割礼，那人必从本族人中被剪除[a][b]；他违背了我的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那性命必从本族人中被剪除。”希伯来文用“性命／人”（נפש）指这个人，并采用“剪除”这一盟约刑罚惯用语。
    reason: lexical_alternative
  - marker: b
    text: “剪除”可指严厉的盟约审判，包括被排除在共同体之外或死亡；本节本身没有进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: 未受割礼的男子
  rationale: עָרֵל指未受割礼者，与זָכָר连用明确指男性；此译保留盟约记号，也符合现代汉语表达。
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: 没有受割礼的
  rationale: מול的Niphal形式在此具有被动或反身意味；按本节法规性语境，用“没有受割礼”自然地表达其状态。
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: 包皮的肉
  rationale: 原文具体指向包皮的肉体部位，不宜笼统省略；“包皮的肉”虽较具体生硬，却保留了希伯来文的身体性措辞。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: 那人必被剪除
  rationale: נפש在此指承担盟约刑罚的个人，而非特指与身体分离的灵魂；“被剪除”保留כרת这一未完全说明具体执行方式的盟约刑罚惯用语。
- source_word: מֵעַמֶּיהָ
  choice: 从自己的族人中
  rationale: עם可指一个人的人民、族群或盟约共同体；“族人”在此兼顾亲族与共同体含义，且不把范围过度限定为制度性的会众。
- source_word: אֶת בְּרִיתִי
  choice: 我的约
  rationale: ברית是本章核心的盟约用语；现代汉语经文语体中“约”简洁、庄重，并保留其神学分量。
- source_word: הֵפַר
  choice: 违背了
  rationale: הפר可表示破坏、违反或废掉盟约；“违背了”清楚表达此人违反盟约，也避免让“破约”被误解为盟约本身已完全失效。
theological_decisions:
- issue: 盟约刑罚כרת（“剪除”）的具体含义
  choice: 保留“必从自己的族人中被剪除”这一惯用表达，不明确指定执行方式
  alternative: 逐出盟约共同体；处死；由上帝使其死亡或断绝后嗣
  rationale: 本节宣告严厉的盟约审判，却未进一步说明是群体排斥、死亡还是其他刑罚；译文保留原文的张力，不替经文作出超出本节证据的裁定。
- issue: נפש的译法
  choice: 那人
  alternative: 那性命；那灵魂；那个人
  rationale: 此处נפש指受盟约刑罚的个人整体。“那人”符合现代汉语法律性陈述，也避免把原文解释成特定的灵魂—身体二分观。
- issue: הֵפַר与盟约效力的关系
  choice: 译作“违背了我的约”
  alternative: 废掉了我的约；破坏了我的约
  rationale: 这里强调当事人违反盟约义务；“违背”不暗示人的行为能够使上帝所立的约整体失效。
translation_notes:
  register: 采用现代、庄重而易懂的法规性语体。“至于……就是……”呈现希伯来文先提出对象、再加关系从句说明的结构；保留“包皮的肉”和“被剪除”的具体、沉重措辞，并以脚注交代其词义及未决之处。
