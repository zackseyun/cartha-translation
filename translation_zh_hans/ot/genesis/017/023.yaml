source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: zh_hans
  text: 于是，亚伯拉罕带着他的儿子以实玛利，以及所有生在他家里的人和所有用银子买来的人，就是亚伯拉罕家中所有的男子；就在那一天[a]，他照着上帝对他所说的，给他们施行割礼，割去他们包皮的肉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“就在这一天本身”或“正是这一天”；这是强调性的说法，表示亚伯拉罕当天立即照办。
    reason: 说明希伯来语强调性习语及其即时含义。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 召集起来
  rationale: לקח的基本义是“取、带”，此处后接全家所有应受割礼者，并随即描述施行割礼；汉语译为“召集起来”自然地表达亚伯拉罕将他们带到一起行动，又不改变叙事功能。
- source_word: יְלִידֵי בֵיתוֹ
  choice: 生在他家里的人
  rationale: 保留“在家中出生”的源语意象，不在正文中过度明定其奴仆身份。
- source_word: מִקְנַת כַּסְפּוֹ
  choice: 用银子买来的人
  rationale: מִקְנַת表示购得之物或人，כֶּסֶף本义为“银子”，此译既体现购买关系，也保留古代交易用银的具体表达。
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: 亚伯拉罕家中所有的男子
  rationale: “所有的男子”准确保留זָכָר的男性限定；将בְּאַנְשֵׁי בֵית压缩为自然的汉语“家中”，避免“众人中的每个男性”式冗赘。
- source_word: וַיָּמָל אֶת בְּשַׂר עָרְלָתָם
  choice: 给他们行了割礼，割去他们包皮的肉
  rationale: “行割礼”提供现代读者熟悉的术语，“割去他们包皮的肉”则保留希伯来文具体的身体表述。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在那一天
  rationale: 该强调性习语指当前叙事中的同一天，既有确切性，也突显亚伯拉罕立即遵行。
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: 照着上帝对他所说的
  rationale: דבר אִתּוֹ可表达“对他说”或“与他说话”；此处重点是亚伯拉罕按上帝所吩咐的内容行动，译文保持自然，同时不扩展为正文未明说的专门术语。
theological_decisions:
- issue: אֱלֹהִים的称谓
  choice: 上帝
  alternative: 神
  rationale: 上下文明确指与亚伯拉罕立约的独一上帝；“上帝”是现代普通话中庄重、通行且不限定宗派的译法。
- issue: 家中受割礼者的性别范围
  choice: 所有的男子
  alternative: 所有男性成员
  rationale: זָכָר明确限定男性，译文予以保留；“男子”在此家族成员清单中自然清楚。
- issue: דִּבֶּר אִתּוֹ所表达的说话关系
  choice: 上帝对他所说的
  alternative: 上帝与他所谈的
  rationale: 介词可容许“与他/对他”的理解；本句着重命令内容及顺服，采用自然的“对他所说”，但不将其强化为特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“银子”“包皮的肉”等源语具体意象；用“行了割礼”帮助普通读者理解。脚注标记[a]已置于其所解释的时间短语之后。
