  text: וּ/בֶן שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָ/כֶ֛ם כָּל זָכָ֖ר לְ/דֹרֹתֵי/כֶ֑ם יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֨סֶף֙ מִ/כֹּ֣ל בֶּן נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽ/זַּרְעֲ/ךָ֖ הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: zh_hans
  text: 你们世世代代中所有的男丁，生后第八天都要受割礼[a]；无论是在家中出生的，还是用银子[b]从任何不属你后裔的外族人那里买来的，都要如此[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生后第八天”直译为“八日之子”。
    reason: lexical_alternative
  - marker: b
    text: “银子”也可译作“钱”。
    reason: lexical_alternative
  - marker: c
    text: 直译为：“从每一个外族人之子，就是那不属你后裔的。”这里“外族人之子”是指外族人；关系从句在原文中紧随这一表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: 满八天时
  rationale: 希伯来语直译为“八日之子”，是表示年龄的惯用语；“满八天时”自然明确，并保留施行割礼的时间要求。
- source_word: יִמּוֹל
  choice: 要受割礼
  rationale: 该动词为未完成式尼法勒形态，在此具有命令性；用“要受割礼”既表达被动意义，也符合现代中文的法规式语气。
- source_word: לָכֶם כָּל זָכָר
  choice: 所有男丁
  rationale: כָּל זָכָר意为“所有男性”；结合לָכֶם及上下文，以“你们……中，所有男丁”表达受命群体中的每一名男性。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代中
  rationale: 该短语表明命令持续适用于接续的各代；“世世代代”是自然、庄重且常用的中文表达。
- source_word: יְלִיד בָּיִת
  choice: 在家中出生的
  rationale: 直译并自然表达在家户之内出生的人，不额外限定其具体身份。
- source_word: וּמִקְנַת כֶּסֶף
  choice: 用银子买来的
  rationale: 保留כֶּסֶף的具体字面意象“银子”，同时以现代中文清楚表达购得之意。
- source_word: מִכֹּל בֶּן נֵכָר
  choice: 从任何外族人那里
  rationale: בֶּן נֵכָר字面为“外族人之子”，在此是指外族人；采用自然中文表达，并在脚注保留字面形式。
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: 那人并不是你的后裔
  rationale: זֶרַע字面为“种子”，用于血缘时指后裔；“后裔”准确表达其谱系含义。中文保留关系代词所指对象存在的句法张力，不把它改写成额外的神学判断。
theological_decisions:
- issue: 割礼命令在亚伯拉罕家户中的范围
  choice: 命令涵盖家中出生和用银子从外族人那里买来的男丁，并不限于亲生后裔。
  alternative: 将命令主要或仅限于亚伯拉罕的血缘后裔。
  rationale: 原文明确列出家中出生者和购得者，并提到“不属于你的后裔”；译文保留这一广度，但不引申后来的圣约或教会论结论。
- issue: 关系从句“不是你的后裔”的所指
  choice: 以“那人”保留原文关系从句可能回指邻近名词的句法形式。
  alternative: 明确改写为购得的男丁不是亚伯拉罕的后裔。
  rationale: 原文אֲשֶׁר的语法所指与整句语义之间存在一定张力；译文不擅自完全消解这种张力，脚注给出更贴近字面的结构。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“男丁”“受割礼”“世世代代”保持经文语体；破折号用于清楚标示原文关系从句，同时不把其所指完全解释化。
