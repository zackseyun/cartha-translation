  yaml_path: translation/ot/genesis/017/002.yaml
  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: zh_hans
  text: 我要在我和你之间确立我的约[a]，并使你极其繁多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按原文，也可较直译为“把我的约赐下（或安置）在我和你之间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: 我要……立
  rationale: נתן的基本义是“给、放置”，但与“约”搭配时，“立约”是现代汉语中自然且庄重的表达；脚注保留其较直译的可能。
- source_word: בְרִיתִי
  choice: 我的约
  rationale: “约”保留בְּרִית的正式及神学分量，第一人称单数后缀译为“我的”。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 在我与你之间
  rationale: 直接保留双方关系结构，符合现代汉语表达。
- source_word: וְאַרְבֶּה
  choice: 使……繁多
  rationale: רבה的使役形表示使数量增多；结合上下文，用“使……繁多”自然表达其使役意义。
- source_word: אֹתְךָ
  choice: 你的后代
  rationale: 原文直译为第二人称单数“你”，但此处“使你繁多”是以亚伯兰代表其后裔的表达；正文采用现代汉语更易理解的隐含意义，并以脚注标明原文形式。
- source_word: בִּמְאֹד מְאֹד
  choice: 极其
  rationale: 重复的מְאֹד形成强烈强调；“极其”自然传达“非常、非常”的程度。
theological_decisions:
- issue: נתן与בְּרִית构成的立约用语
  choice: 立我的约
  alternative: 赐下／设立我的约
  rationale: “立约”既符合汉语固定搭配，也表达上帝主动确立盟约；脚注提示原动词较字面的语义，避免掩盖其措辞。
- issue: “使你繁多”中单数受词的所指
  choice: 正文明确为“你的后代”
  alternative: 使你极其繁多
  rationale: 希伯来文直接称亚伯兰为“你”，其语义涉及由他而出的众多后裔。正文为自然清晰而显明此意，同时用脚注保留原文的单数直称，避免将解释冒充无歧义的字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“立约”为通行汉语表达；“极其繁多”保留原文双重加强语气。正文中的每个脚注标记均已对应列出。
