  naturalness: “我要使你极其繁衍；我要使许多民族由你而出，君王也必从你而出”是自然、庄重且易懂的现代标准汉语。“极其繁衍”虽带书面语色彩，但与经文应许及整体语体相称；后两句的平行也流畅。
