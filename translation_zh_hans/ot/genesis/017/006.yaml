  text: וְ/הִפְרֵתִ֤י אֹֽתְ/ךָ֙ בִּ/מְאֹ֣ד מְאֹ֔ד וּ/נְתַתִּ֖י/ךָ לְ/גוֹיִ֑ם וּ/מְלָכִ֖ים מִמְּ/ךָ֥ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: zh_hans
  text: 我要使你极其繁衍；我要使许多民族由你而出，君王也必从你而出。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: 我要使你……繁衍
  rationale: פרה 的使役式表达“使之多产、繁衍”。“使你繁衍”既保留使役意义，也自然适合关于后裔的语境。
- source_word: בִּמְאֹד מְאֹד
  choice: 极其
  rationale: 两个 מְאֹד 连用形成强烈强调；“极其”以自然、庄重的现代汉语传达这一强化语气。
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: 我要使许多民族由你而出
  rationale: נתן 加 ל 在这里指向所造成的结果。结合上下文的后裔应许，这一译法清楚表达亚伯拉罕将成为多个民族的先祖，同时避免生硬的“使你成为民族”。
- source_word: לְגוֹיִם
  choice: 许多民族
  rationale: גּוֹיִם 是复数，指多个民族或国族；“许多民族”在汉语中自然体现复数，不限定为“外邦人”。
- source_word: וּמְלָכִים
  choice: 君王
  rationale: מְלָכִים 明确指诸王；汉语集合性名词“君王”自然、准确且语体庄重。
- source_word: מִמְּךָ יֵצֵאוּ
  choice: 必从你而出
  rationale: 保留 יצא“出来”的源语意象，也按谱系语境表达“出自你、成为你的后裔”；“必”体现未完成式在神圣应许中的确定将来意义。
theological_decisions:
- issue: 亚伯拉罕所得应许之后裔范围
  choice: 本节应许多个民族和君王将由亚伯拉罕而出，表明他将成为他们的先祖。
  alternative: 也可将相关短语较抽象地理解为亚伯拉罕在列国中获得某种地位。
  rationale: 紧邻的立约语境集中于后裔与谱系，“由你而出”和“从你而出”最能反映本节的平行结构及生育、繁衍的主题，同时不引入后来的神学体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“极其繁衍”传达强烈强调；后两分句以“由你而出／从你而出”形成平行，并保留希伯来文关于来源与后裔的表达。
