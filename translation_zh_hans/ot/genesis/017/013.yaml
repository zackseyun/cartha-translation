base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: zh_hans
  text: 凡在你家中出生的，和用你的银子买来的，都一定要受割礼[a][b][c]；我的约必在你们的肉身上，作永远的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必定受割礼。”希伯来文用不定式绝对形与限定动词连用，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “在家中出生的”和“用银子买来的”都指亚伯拉罕家中的成员，包括生在家中的人和购入的人。
    reason: cultural_note
  - marker: c
    text: 也可较直译为：“在你家中出生的那一个，和用你的银子买来的那一个。”
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: 一定要受割礼
  rationale: 希伯来文以同一词根的不定式绝对形配合限定动词，强化受割礼这一要求。“一定要”既表达上下文中的义务，也保留原文的强调语气。
- source_word: יְלִיד בֵּיתְךָ
  choice: 在你家中出生的
  rationale: 原文直指“家中所生者”。此译保留其作为亚伯拉罕家中成员的含义，同时不在正文中加入该短语本身没有明说的身份称谓。
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: 用你的银子买来的
  rationale: 原文指以银钱购得的人。“银子”保留古代交易语境，“买来的”则以自然现代汉语明确其所指为人。
- source_word: בְרִיתִי
  choice: 我的约
  rationale: 准确保留第一人称所属关系及本段核心的立约用语。
- source_word: בִּבְשַׂרְכֶם
  choice: 在你们的肉身上
  rationale: 以自然汉语表达约与身体上割礼记号的直接关联；不进一步解释该记号与约在神学上的关系。
- source_word: לִבְרִית עוֹלָם
  choice: 成为永远的约
  rationale: 这里的介词ל可表达结果或作用。“成为”使中文通顺，并保留“永远的约”这一重要表述。
theological_decisions:
- issue: 身体上的记号与约本身的关系
  choice: 直译约在受割礼者的肉身上，并成为永远的约，不进一步界定记号与约的关系。
  alternative: 将割礼仅解释为象征约的外在标志，或反过来明确断言记号本身构成圣约成员身份。
  rationale: 原文直接说“我的约必在你们的肉身上，成为永远的约”。译文保留身体、割礼与约之间的紧密联系及其神学张力，不把后来的体系性解释加入经文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“凡……和……都……”自然表达两个单数类别的普遍适用范围；“肉身”保留经文的身体性与圣约语域，同时避免过度古雅。
