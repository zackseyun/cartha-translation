  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּ/ךָ֔ לֹא תִקְרָ֥א אֶת שְׁמָ֖/הּ שָׂרָ֑י כִּ֥י שָׂרָ֖ה שְׁמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: zh_hans
  text: 神又对亚伯拉罕说：“至于你妻子撒莱，你不可称她为撒莱，因为她名叫撒拉。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不可再叫她撒莱；她的名字要叫撒拉。”
    reason: 词义与句式的另一种自然表达；“再”和“要”明确呈现改名语境，但并非希伯来文中明写的副词或助动词。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 连续叙事形式推动情节发展；“又……说”在现代汉语中自然地承接上文，也保留了叙事的连续性。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本处指独一的神；“神”是现代中文圣经语体中准确、通行的译法。
- source_word: שָׂרַי
  choice: 撒莱
  rationale: 按人名音译，并与新名“撒拉”清楚区分，以保留本节改名的重点。
- source_word: אִשְׁתְּךָ
  choice: 你妻子
  rationale: 直接表达所属关系，指明撒莱与亚伯拉罕的关系。
- source_word: לֹא תִקְרָא אֶת־שְׁמָהּ שָׂרָי
  choice: 你不可称她为撒莱
  rationale: 该未完成式在神的直接话语中具有禁止、命令的作用。“不可”保留庄重语气；“称她为”自然表达希伯来语的命名句式，又不必机械重复“名字”。
- source_word: כִּי
  choice: 因为
  rationale: 引出改名宣告的理由；此处采用解释性的“因为”，同时保留与“因为／而是”等理解相关的语义张力。
- source_word: שָׂרָה שְׁמָהּ
  choice: 她名叫撒拉
  rationale: 希伯来文是无系词句，直陈新名。“她名叫撒拉”在现代汉语中自然，并且不额外加入原文未明说的将来时态。
theological_decisions:
- issue: 改名公式的表达
  choice: “你不可称她为撒莱，因为她名叫撒拉”
  alternative: “你不可再叫她撒莱；她的名字要叫撒拉”
  rationale: 正文保留禁止与直接命名宣告，不在正文中加入原文没有明写的“再”或将来意味；脚注列出更符合汉语改名语境的意译，以呈现另一种合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于”对应话题前置结构；正文避免过度直译“称她的名字为”，也避免加入教派性解释。脚注标记置于相关改名宣告之后。
