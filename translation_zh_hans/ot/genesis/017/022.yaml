  yaml_path: translation/ot/genesis/017/022.yaml
  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: zh_hans
  text: 神与亚伯拉罕说完话后，就从亚伯拉罕那里升上去了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上升离开了亚伯拉罕”。希伯来原文使用“上去／上升”这个动词，以空间性的表达描写神显现的结束。
    reason: 词义备选及原文空间意象说明
lexical_decisions:
- source_word: וַיְכַל לְדַבֵּר
  choice: 说完话后
  rationale: כלה与דבר的不定式连用，构成“说完”的表达；用“……后”自然呈现前一动作完成、后一动作随即发生的时序。
- source_word: אִתּוֹ
  choice: 与亚伯拉罕
  rationale: 介词אֵת表示交谈的互动对象，宜译为“与”；代词所指根据上下文明确为亚伯拉罕，中文直称其名可避免代词混淆。
- source_word: וַיַּעַל
  choice: 升上去了
  rationale: עלה的基本意义是“上去、上升”。保留具体的向上空间意象，不将其弱化为抽象的“离开”。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 虽然该词形式上为复数形态，但这里搭配单数动词，且上下文指独一的神，故译作单数“神”。
- source_word: מֵעַל אַבְרָהָם
  choice: 从亚伯拉罕那里
  rationale: מֵעַל字面含“从……上面、从……之上”之意；在神显现结束的语境中，“从亚伯拉罕那里”既符合现代汉语，也保留离开其所在之处的关系。
theological_decisions:
- issue: 以拟人化和空间性语言描写神的离去
  choice: 保留“升上去了”的空间性表达
  alternative: 神离开了亚伯拉罕／神从亚伯拉罕那里退去了
  rationale: 原文明确使用“上去、上升”的动词。保留这一叙事意象，呈现神显现结束时的具体描写，而不把它解释成关于神受空间限制的教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“说完话后”交代动作次序，“升上去了”保留原文具体意象；为避免两个男性代词造成歧义，将אִתּוֹ的所指明译为“亚伯拉罕”。
