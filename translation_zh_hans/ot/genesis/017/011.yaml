source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: zh_hans
  text: 你们要割去包皮；这要作我与你们之间的约的记号[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记号”也可译作“标志”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: 你们要割去
  rationale: 该动词在立约指令中带有命令意味；采用主动表达，既符合希伯来语形式，也清楚呈现受命者应当施行的行动。
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: 包皮
  rationale: 原文直译为“你们包皮的肉”。现代汉语用“割去包皮”已自然、准确地表达具体的身体动作；若逐字加入“肉”，反而生硬且不增加实质信息。第二人称复数由“你们”表达。
- source_word: וְהָיָה
  choice: 这要作为
  rationale: “这”回指刚才吩咐的割礼；“要作为”自然表达原文将来、结果性的系词结构。
- source_word: לְאוֹת
  choice: 记号
  rationale: אוֹת 在立约语境中指可辨识的记号或标志；“记号”保留其约的意义，又不额外加入特定教义解释。
- source_word: בְּרִית
  choice: 这约
  rationale: 希伯来语虽无冠词，但上下文明确指神正在与亚伯拉罕设立的特定之约；“这约”在现代汉语中自然地表达其特指性。
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: 我与你们之间
  rationale: 直接保留第一人称单数与第二人称复数双方的关系表述，不把上下文中的后裔含义提前加入本节。
theological_decisions:
- issue: 割礼作为约的记号所具有的性质
  choice: 译作“这约的记号”
  alternative: 这约的标志
  rationale: 原文只明确割礼是神与受约者之间的约之记号，并未在本节进一步界定其功效；译文因此保留其立约分量，不将其解释为纯粹象征，也不加入特定圣礼观。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“割去包皮”比逐字的“割去包皮的肉”更符合现代汉语习惯；分号清楚连接命令与其立约意义。英文咨询层的脚注标记似乎误置于“foreskin”之后；按其脚注内容及希伯来词 אוֹת，将标记置于“记号”之后。
