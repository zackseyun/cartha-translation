  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: zh_hans
  text: 但我要与以撒立定我的约[a]；撒拉必在明年这个时候给你生以撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而我要与以撒立定我的约。”希伯来语的连接词也可简单译作“而”，但上下文更倾向于表达与上一节关于以实玛利之应许的对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: 但
  rationale: וְ本义通常为“和／而”，但此处承接上一节关于以实玛利的应许，并转而限定立约对象为以撒，语篇上具有转折作用；正文译作“但”，脚注保留“而”的可能。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: בְּרִית在本段指上帝所立的约；“我的约”准确表达第一人称单数后缀，也符合《创世记》的立约语境。
- source_word: אָקִים אֶת־יִצְחָק
  choice: 我要与以撒立……约
  rationale: אָקִים是קום的使役式，表示使约确立、坚立；现代汉语“与某人立约”自然明确，并将以撒表达为立约所关联的一方。
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: 撒拉要为你生下他
  rationale: 关系代词אֲשֶׁר所指为以撒；“生下他”明确回指以撒，“为你”保留לְךָ所表达的与亚伯拉罕的关系。
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: 明年这个时候
  rationale: מוֹעֵד指确定、指定的时刻，结合“来年”在汉语中自然译作“明年这个时候”，既保留时间的明确性，又避免生硬的“这个指定日期”。
theological_decisions:
- issue: 立约对象是以撒而非以实玛利
  choice: 明确译为“与以撒立我的约”
  alternative: 将本句弱化为一般性的赐福或应许
  rationale: 原文明确把上帝所说的“我的约”与以撒相连；译文保留这一限定，但不引申本节未明说的后续神学结论。
- issue: 句首连接词与上文的关系
  choice: 正文采用转折性的“但”
  alternative: 译作中性的“而”或“并且”
  rationale: 希伯来语וְ本身可作一般连接词，但在上节有关以实玛利的应许之后，本句形成明显对照。脚注保留较中性的译法，以免掩盖原词的多义性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与……立我的约”保留圣经立约用语；分号使立约宣告与以撒出生时间的说明层次清楚。
