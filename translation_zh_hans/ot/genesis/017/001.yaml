source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: zh_hans
  text: 亚伯兰九十九岁时，雅威向亚伯兰显现，对他说：“我是全能的上帝[a]。你要行在我面前，做无可指责的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“埃勒·沙代”（El Shaddai）；传统上常译为“全能的上帝”，但“沙代”的确切含义仍有争议。
    reason: 保留重要的希伯来称号，并说明其语义不确定性。
lexical_decisions:
- source_word: וַיְהִי אַבְרָם בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: 亚伯兰九十九岁时
  rationale: 希伯来语以叙事句式引出年龄这一时间背景；现代汉语用“……岁时”自然、准确，也避免照搬“是九十岁又九岁之子”的形式。
- source_word: וַיֵּרָא
  choice: 显现
  rationale: 该动词在此为尼法勒式，以雅威为主语、亚伯兰为对象，表示神向人显现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留其专名性质，不以一般称号代替。
- source_word: אֵל שַׁדַּי
  choice: 全能的上帝
  rationale: “上帝”传达 אֵל，“全能的”采用 שַׁדַּי 的传统理解；由于后者确切含义仍有争议，脚注同时保留希伯来语音译。
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: 行在我面前
  rationale: 保留希伯来语“行走”的生活行为隐喻和“在我面前”的关系性表达，同时符合庄重的现代汉语。
- source_word: וֶהְיֵה תָמִים
  choice: 作纯全的人
  rationale: תָמִים 可表达完整、正直、无可指责；“纯全”保留其整体性和伦理要求，又不把它窄化为绝对无罪的形而上完美。
theological_decisions:
- issue: 如何译写神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列之神的专名；音译“雅威”较贴近学界通常重构的读音，也避免以称号“主”取代专名。
- issue: 如何处理 אֵל שַׁדַּי
  choice: 正文译作“全能的上帝”，脚注保留“埃勒·沙代”
  alternative: 正文直接音译为“埃勒·沙代”
  rationale: 传统译法能让普通读者立即理解这是神的称号，但 שַׁדַּי 的词源和确切语义有争议，因此不把“全能”说成毫无疑问的唯一含义。
- issue: 如何表达 תָמִים 的要求
  choice: 作纯全的人
  alternative: 作完全人；无可指责
  rationale: “纯全”兼顾完整、正直与无可指责等语义，保留盟约语境中的伦理力度，同时避免暗示人必须达到绝对无罪。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“行在我面前”有意保留原文的行走隐喻；“纯全”虽略带经文语体色彩，但简洁地承载完整、正直和无可指责的含义。
