  text: 他的儿子以实玛利受割礼时，年十三岁；割礼施行在他包皮的肉上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל בְּנ֔/וֹ
  choice: 他儿子以实玛利
  rationale: ו承接叙事，在中文中无需机械译作“并且”；בנו直接表明以实玛利是亚伯拉罕的儿子。
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: 年十三岁
  rationale: 这是希伯来语常见的年龄表达；译作简洁庄重的现代汉语“年十三岁”。
- source_word: בְּ/הִמֹּל/וֹ
  choice: 接受割礼……时
  rationale: 介词ב加不定式构词及第三人称阳性单数后缀表达时间背景，即“他受割礼时”；采用“接受割礼”保持以实玛利为受事者。
- source_word: אֵת בְּשַׂר עָרְלָת/וֹ
  choice: 包皮的肉被割去
  rationale: 保留原文具体的身体用语“包皮的肉”，并用被动表达清楚说明割礼所涉及的部位，避免只译作笼统的“受割礼”。
