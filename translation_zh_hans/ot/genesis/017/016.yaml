  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: zh_hans
  text: 我必赐福给她；并且，我必赐给你一个从她而生的儿子。我必赐福给她；她必成为多国之母[a]，列族的君王必从她而出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“她必成为多国”；“之母”是为使汉语表达通顺而补出的。
    reason: 说明主文为符合现代汉语而补出“之母”，并保存原文凝缩而突出的表达。
lexical_decisions:
- source_word: וּבֵרַכְתִּי / וּבֵרַכְתִּיהָ
  choice: 我必赐福给她 / 我必赐福给她
  rationale: 保留“赐福”的圣约意味，也保留原文的重复，以传达强调。
- source_word: וְגַם
  choice: 也
  rationale: 此处表示递进和增添；现代汉语用“也必”自然地体现其加强语气。
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: 必使你从她得一个儿子
  rationale: 完成式在应许语境中指向将来；“从她得”保留儿子由撒拉所生以及赐予亚伯拉罕的双重关系。
- source_word: וְהָיְתָה לְגוֹיִם
  choice: 她必成为多国之母
  rationale: 希伯来语直译近于“她必成为多国”，汉语如此表达会明显生硬；补出语义隐含的“之母”，使普通读者清楚理解多国将由她而出，同时以脚注保存原文更凝缩的措辞。
- source_word: גוֹיִם
  choice: 多国
  rationale: “国”准确表达 גוֹיִם 在族长应许中的群体和国家含义；“多”在中文中自然呈现复数。
- source_word: מַלְכֵי עַמִּים
  choice: 多族的君王
  rationale: 用“族”对应 עַמִּים，与前面的“国”区分，并保留原文“诸民之王”的构造和广泛范围。
- source_word: מִמֶּנָּה יִהְיוּ
  choice: 必从她而出
  rationale: 自然表达血统和来源，也贴近原文“必从她而有”的含义。
theological_decisions:
- issue: 如何表达撒拉与多国及君王的关系
  choice: 她必成为多国之母；多族的君王必从她而出
  alternative: 她必成为多国；众民的君王必从她而有
  rationale: 主文用自然汉语说明多国源自撒拉，不把应许缩减为单一后裔或纯粹政治结果；脚注同时保留希伯来语没有明说“母”的特点，避免把解释冒充字面措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我必……也必……我必……”保留神圣应许的郑重和原文重复；避免文言化过重，同时以“而出”维持经文体的尊严。
