  text: וְ/כָל אַנְשֵׁ֤י בֵית/וֹ֙ יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֖סֶף מֵ/אֵ֣ת בֶּן נֵכָ֑ר נִמֹּ֖לוּ אִתּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: zh_hans
  text: 他家里所有的男子，无论是在家里出生的，还是用银钱从外族人手中买来的，都和他一同受了割礼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל אַנְשֵׁי בֵיתוֹ
  choice: 他家里所有的男子
  rationale: וְכָל 表达承接与全体范围；אַנְשֵׁי בֵיתוֹ 指其家中的男性成员。中文以“他家里所有的男子”自然呈现全称和家庭群体含义；句首承接关系可由上下文体现，不必机械译出“并且”。
- source_word: יְלִיד בָּיִת
  choice: 在家里出生的
  rationale: 该短语指生于这个家族或家户中的人。“在家里出生的”简明自然，并保留其家户身份含义。
- source_word: וּמִקְנַת כֶּסֶף
  choice: 还是用银钱……买来的
  rationale: 该结构指以银钱购得的人。译作“用银钱买来的”保留明确的交易含义；与前项配成“无论……还是……”，符合现代汉语列举方式。
- source_word: מֵאֵת בֶּן נֵכָר
  choice: 从外族人手中
  rationale: בֶּן נֵכָר 是指外族人或外来者的惯用表达，不宜逐字译为“外族之子”；מֵאֵת 在购买语境中自然译作“从……手中”。
- source_word: נִמֹּלוּ
  choice: 受了割礼
  rationale: Niphal 形式在此为被动意义。“受了割礼”是现代中文圣经语体中自然且准确的表达，不暗示他们自行施行割礼。
- source_word: אִתּוֹ
  choice: 和他一同
  rationale: 表示与亚伯拉罕一同或同时经历割礼。“和他一同”既保留伴随关系，也符合中文叙事表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“银钱”较“钱”更贴近古代交易背景，又不显生硬；“外族人”保留 נֵכָר 所含的群体边界意味。原文无需要另加脚注才能保留的重要歧义。
