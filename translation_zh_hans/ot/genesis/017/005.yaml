  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: zh_hans
  text: 你的名字不再叫亚伯兰，而要叫亚伯拉罕，因为我已经立你作[a]多国之父。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立你作”原文较直译为“我已赐你为多国之父”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקָּרֵא
  choice: 叫
  rationale: 该词为קרא的尼斐尔式，在命名语境中表示“被称为”；现代汉语以“名字……叫”自然表达其被动含义。
- source_word: עוֹד
  choice: 不再
  rationale: 与否定词לֹא连用，表示从此停止沿用旧名；“不再”准确而自然。
- source_word: אַבְרָם
  choice: 亚伯兰
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וְהָיָה
  choice: 而要叫
  rationale: 原文形式上为“而你的名字将是”；在更名公式中，“而要叫”既体现与旧名的对照，也符合自然汉语。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: כִּי
  choice: 因为
  rationale: 引出改名的理由，清楚保留原文的解释关系。
- source_word: אַב
  choice: 父
  rationale: 保留普通义“父”，与本节的命名解释和圣约语境相合；不缩窄或改释为“祖先”。
- source_word: הֲמוֹן
  choice: 多
  rationale: 在“多国”中简洁表达众多、繁盛之义；虽未保留名词形式，却比“众多国家的父”更符合现代汉语经文语体。
- source_word: גּוֹיִם
  choice: 国
  rationale: 此处泛指多个民族或国家群体；“国”是简洁且语境适切的表达，避免时代错置地译作“外邦人”。
- source_word: נְתַתִּיךָ
  choice: 我已经立你作
  rationale: 原义近于“我已经给定你作……”。汉语“立你作”自然表达委任、设立之意，“已经”保留完成式所呈现的宣告已成事实的力量。
theological_decisions:
- issue: 如何表达神以完成式宣告亚伯拉罕成为多国之父
  choice: 因为我已经立你作多国之父
  alternative: 因为我将使你成为多国之父
  rationale: 希伯来文נְתַתִּיךָ是完成式。译作“已经立”保留神把尚待历史实现的应许宣告为已确立事实的张力，不将其平顺化为单纯将来时。
- issue: נְתַתִּיךָ在此是“给予”还是“设立”
  choice: 立你作
  alternative: 给定你作
  rationale: 直译“给定你作”能显出נתן的基本词义，但现代汉语生硬；“立你作”保留任命、置于某身份的语义，同时不额外引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你的名字不再叫……而要叫……”符合汉语更名表达；“多国之父”保留凝练的圣约语言。脚注说明נתן的较直译形式，正文则以自然汉语表达。
