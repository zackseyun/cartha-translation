  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: zh_hans
  text: 于是，亚伯兰俯伏在地；上帝对他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָם עַל־פָּנָיו
  choice: 亚伯兰俯伏在地
  rationale: 原文直译为“亚伯兰仆倒在自己的脸上”，是表示敬畏、降服的希伯来语姿态用语。“俯伏在地”以自然现代汉语传达动作及其意象，同时保留主动俯身的含义。
- source_word: וַיְדַבֵּר אִתּוֹ
  choice: 对他说
  rationale: אִתּוֹ 字面可作“与他”，但现代汉语在引出单向直接话语时通常说“对他说”；这样既忠实表达交流对象，也避免生硬的“与他说话”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本处动词为单数，语境所指也是与亚伯兰立约的独一神，因此采用单数称谓“上帝”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出随后直接引语的公式。汉语用“说：”及冒号自然衔接下一节，不必机械译为“说着”。
- source_word: וַ
  choice: 于是
  rationale: 句首连续式叙事连接词表示事件承接；“于是”自然体现亚伯兰对前述神显现与话语的即时回应。
theological_decisions:
- issue: אֱלֹהִים 的数与所指
  choice: 单数“上帝”
  alternative: 按词形表面译作复数“众神”
  rationale: 尽管该名词词形为复数，本句及语境将其作为单数使用；译成复数既不合句法，也会引入原文没有表达的神学主张。
- issue: 亚伯兰动作的性质
  choice: “俯伏在地”
  alternative: “脸伏于地”或“仆倒在地”
  rationale: 该表达在此语境中呈现敬畏、谦卑的身体姿态。“俯伏”准确而不额外断言其内在动机；“仆倒”在现代汉语中可能被误解为意外跌倒。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亚伯兰”保留此时尚未改名的叙事信息；分号区分动作与神的发言，冒号明确引出下一节的直接话语。
