source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: zh_hans
  text: 我要把你寄居之地[a]，就是迦南全地，赐给你和你之后的后裔，作永远的产业[b]；我也要作他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你以外来者身份居住的地方”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“作为永远的产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要……赐给
  rationale: 在立约应许的语境中，连词加完成式表达将来必成就的应许；译作“我要……赐给”自然地保留其应许语气。
- source_word: לְךָ
  choice: 给你
  rationale: 忠实表达亚伯拉罕本人是领受者。
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: 和你之后的后裔
  rationale: “后裔”可作为集合名词，表达 זֶרַע 的群体含义；保留“你之后”以体现世代承继。
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: 你寄居之地
  rationale: מְגוּרִים 指以外来者身份暂居的地方；“寄居之地”简洁、庄重，并保留尚未定居和异乡居留的意味。
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: 就是迦南全地
  rationale: 原文以同位语进一步说明“寄居之地”；“就是”清楚呈现这一关系，“全地”保留 כָּל 的完整范围。
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: 作永远的产业
  rationale: אֲחֻזָּה 指持有的产业，尤其是土地；עוֹלָם 在此具有长久、恒久的立约分量。“永远的产业”自然且保留原文力度。
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: 我也要作他们的上帝
  rationale: 这是典型的立约关系用语；该译法自然表达“我要成为他们的上帝”，而不暗示上帝本体发生变化。
theological_decisions:
- issue: 如何翻译立约公式而不加入后来的教义阐释
  choice: 我也要作他们的上帝
  alternative: 我也要成为他们的上帝
  rationale: 原文强调上帝与他们建立并维持立约关系，而非上帝的本体发生改变；“作他们的上帝”既保留圣经公式的庄重感，也不额外展开其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寄居之地”保留族长以外来者身份居留的含义；“后裔”保持集合名词的开放性；整体按汉语习惯调整语序，同时清楚呈现“迦南全地”对“寄居之地”的同位说明。
