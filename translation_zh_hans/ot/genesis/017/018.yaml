base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: zh_hans
  text: 亚伯拉罕对神说：“但愿以实玛利活在你面前[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你面前活着”；也可理解为在你的眷顾之下活着。
    reason: 说明לְפָנֶיךָ的基本义为“在你面前”，并保留其可含神眷顾之意的解释空间，而不把该解释纳入正文。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式承接并推进情节；现代汉语通常无需另译连接词，直接用“说”自然清楚。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 此处指上下文中特定的神；“神”是现代中文叙事中简洁而恰当的称呼。
- source_word: לוּ
  choice: 但愿
  rationale: 此词在这里引出愿望而非条件；“但愿”既表达强烈期盼，也保持庄重自然。
- source_word: יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: 采用该人名在现代中文圣经传统中通行的音译。
- source_word: יִחְיֶה
  choice: 能活
  rationale: 未完成式受愿望语气词支配，表达亚伯拉罕所盼望的存活；“能活”在中文中自然呈现这一愿望语气。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 直译为“在你面前”，既可指在神面前存活，也可能含有蒙神眷顾的意味，不在正文中将其限定为单一解释。
theological_decisions:
- issue: 亚伯拉罕盼望以实玛利在神面前存活所包含的地位与恩惠
  choice: 在你面前
  alternative: 在你的同在中；蒙你恩待
  rationale: 原文措辞简洁，可含神的临在与眷顾，却没有在本节明确说明其完整的约或祝福内涵。正文保留原有张力，避免增译为“承受你的约”或“蒙你赐福”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但愿”保留亚伯拉罕恳切的愿望语气；“活在你面前”保持原文简洁，并保留关系性与神学含义上的开放性。
