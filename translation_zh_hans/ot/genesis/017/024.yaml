  yaml_path: translation/ot/genesis/017/024.yaml
  text: And Abraham was ninety-nine years old when the flesh of his foreskin was circumcised.
translation:
  language: zh_hans
  text: 亚伯拉罕的包皮被割除时，他九十九岁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 连词 ו 承接上文；本节在现代汉语中不必机械译作“并且”，省略后叙事衔接仍然清楚。人名采用通行译法“亚伯拉罕”。
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: 年九十九岁
  rationale: 希伯来语直译为“九十九岁之子”，是表达年龄的惯用语；译为“年九十九岁”既自然庄重，也准确保留年龄信息。
- source_word: בְּ/הִמֹּלוֹ
  choice: 割……时
  rationale: 介词 בְּ 加带代词后缀的不定式结构表示时间背景，即“当他受割礼时”。结合后面的具体宾语，汉语以“割包皮时”简洁自然。
- source_word: בְּשַׂר עָרְלָתוֹ
  choice: 包皮
  rationale: 该词组字面为“他包皮的肉”。现代汉语若译作“他包皮的肉被割除”较为生硬；“割包皮”明确传达实际动作，同时不把它抽象化为仅仅举行某种礼仪。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“割包皮”比“他受割礼”更贴近原文具体的身体表述，也比“他包皮的肉被割除”自然。
