  yaml_path: translation/ot/genesis/017/026.yaml
  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: zh_hans
  text: 就在那一天，亚伯拉罕和他的儿子以实玛利都受了割礼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在那一天
  rationale: 该固定时间表达强调事情正是在所指的那一天发生；“就在那一天”以自然现代汉语保留其强调意味。
- source_word: נִמּוֹל
  choice: 都受了割礼
  rationale: 该词为被动形式，意为“受割礼”。希伯来语动词虽为单数形式，却置于“亚伯拉罕和他的儿子以实玛利”这一并列主语之前；汉语用“都”自然表明两人同受割礼。
- source_word: אַבְרָהָם
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְיִשְׁמָעֵאל
  choice: 和……以实玛利
  rationale: 连接词译为“和”，人名采用现代中文圣经传统中通行的译法“以实玛利”。
- source_word: בְּנוֹ
  choice: 他的儿子
  rationale: 名词“儿子”带第三人称阳性单数后缀，指以实玛利是亚伯拉罕的儿子；译为“他的儿子”清楚而自然。
theological_decisions: []
