- from: 神又对亚伯拉罕说：“至于你，你要遵守我的约；你和你后世的子孙，世世代代都要遵守。”
  to: 神又对亚伯拉罕说：“至于你，你要遵守我的约；你和你以后的后裔，要世世代代遵守我的约。”
  rationale: 保留叙事承接的“又”、话题强调的“至于你”、以及“约”和“遵守”等关键术语。将后半句改为完整的中文谓语结构，明确“世世代代”限定后裔持续承担遵守神之约的责任；“以后的后裔”自然表达集合性 זַרְעֲךָ 与“在你之后”之意。重复“我的约”是汉语为避免歧义所作的自然显明，不增加原文命题。
