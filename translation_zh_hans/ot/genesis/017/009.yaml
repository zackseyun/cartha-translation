  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם וְ/אַתָּ֖ה אֶת בְּרִיתִ֣/י תִשְׁמֹ֑ר אַתָּ֛ה וְ/זַרְעֲ/ךָ֥ אַֽחֲרֶ֖י/ךָ לְ/דֹרֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: zh_hans
  text: 神又对亚伯拉罕说：“至于你，你要遵守我的约；你和你以后的后裔，要世世代代遵守我的约。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 承接上文并推进叙事；现代汉语以“又”自然表达此处连续发言的关系。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 直接对应此处与亚伯拉罕立约并说话的神。
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 保留前置独立代词所带出的强调和话题转换，转向亚伯拉罕一方的责任。
- source_word: אֶת־בְּרִיתִי
  choice: 我的约
  rationale: 直接保留核心的立约用语及第一人称所属关系。
- source_word: תִשְׁמֹר
  choice: 要遵守
  rationale: שׁמר在立约语境中指守住、履行或遵行；“遵守”在现代汉语中清楚表达约的义务，同时不额外加入法律或礼仪含义。
- source_word: אַתָּה וְזַרְעֲךָ אַחֲרֶיךָ
  choice: 你和你后世的子孙
  rationale: זֶרַע是单数形式的集合名词，指由亚伯拉罕而出的后代；“后世的子孙”自然表达אַחֲרֶיךָ的世代承继关系。
- source_word: לְדֹרֹתָם
  choice: 世世代代
  rationale: 汉语惯用表达，准确传达义务延续于接续各代的含义。
theological_decisions:
- issue: 如何表达亚伯拉罕及其后代对约的义务
  choice: 你要遵守我的约；你和你后世的子孙，世世代代都要遵守
  alternative: 你和你后世的子孙，世世代代都要谨守我的约
  rationale: “遵守”保持שׁמר在立约语境中的义务性，又不引入额外的法律、圣礼或宗派解释。后半句补出“都要遵守”，是为使汉语句法清楚地表明命令同时涉及亚伯拉罕和后代，并未增加新的命题。
- issue: זֶרַע的集合性表达
  choice: 子孙
  alternative: 后裔；种子
  rationale: 此处显然指人的延续后代。“子孙”在现代汉语中可作集合称呼，既自然又保留跨世代含义；直译“种子”会造成误解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于你”保留原文强调；以分号和重复“遵守”化解希伯来语结构在汉语中的悬接感，同时保持原句的 covenant obligation 与世代延续。
