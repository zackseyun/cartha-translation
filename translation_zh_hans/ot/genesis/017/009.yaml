review_pass:
  verdict: revise
  source_fidelity: 原文后半句“你和你的后裔在他们的世代中”修饰同一项“遵守我的约”的要求。草稿以分号另起“都要遵守”，虽意在澄清，却省略了宾语“我的约”，并使“世世代代”在句法上略显悬置。改为将全句整合，能更直接对应希伯来文结构与意义。
  naturalness: “你和你后世的子孙”不够自然，且“后世”与“子孙”语义有所重叠。现代标准汉语宜用“你和你以后的后裔”或“你和你以后的子孙”。整合后的句子庄重、清晰且符合经文语体。
  terminology: “神”“亚伯拉罕”“约”“遵守”均恰当，并忠实保留立约语境中的核心术语。以“后裔”表达集合性的 זֶרַע 较为准确；不采用可能引起误解的“种子”，也不附加宗派性解释。
  issues:
  - severity: low
    issue: “后世的子孙”表达重复且稍欠自然。
    rationale: “后世”已经表示时间上的后续，“子孙”本身亦指后代；“以后的后裔”更简洁，并保留 אַחֲרֶיךָ 所表明的在亚伯拉罕之后的承继关系。
  - severity: medium
    issue: 后半句重复“都要遵守”但未重述“我的约”。
    rationale: 原文只有一个动词，支配“我的约”，其后说明承担责任者及其世代。中文重述动词可以，但省去宾语会使指代依赖前句，并使句法对应较弱；整合为一个完整命令更忠实清楚。
  revised_text: 神又对亚伯拉罕说：“至于你，你要遵守我的约；你和你以后的后裔，要世世代代遵守我的约。”
  revised_footnotes: []
