revisions:
- from: 至于我[a]，看哪，我的约与你同在；你必成为万国之父[b]。
  to: 至于我[a]，看哪，我的约是与你所立的；你必成为许多民族之父[b]。
  rationale: 以“我的约是与你所立的”在汉语中明确表达原文“我的约与你”的关系；“所立的”是“约”这一关系在汉语中的必要表达，并未把本句扩展为“我现在要与你立约”。将“万国”改为“许多民族”，更贴近“众多民族”的数量含义，并相应更新脚注b。
