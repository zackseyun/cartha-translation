  text: אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖/י אִתָּ֑/ךְ וְ/הָיִ֕יתָ לְ/אַ֖ב הֲמ֥וֹן גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: zh_hans
  text: 至于我[a]，看哪，我的约是与你所立的；你必成为许多民族之父[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我——看哪，我的约是与你所立的。”希伯来文句首的代词和“看哪”都带有强调意味。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“众多民族之父。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: 至于我
  rationale: 独立人称代词置于句首，带有强调和话题转换作用；“至于我”在现代汉语中自然地保留这一语篇重点。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 该指示语气词用于唤起注意并加强宣告的庄重感；“看哪”比“确实”更能保留其直接而郑重的语气。
- source_word: בְרִיתִי
  choice: 我的约
  rationale: “约”是《创世记》中 בְּרִית 的标准译法，也保留了亚伯拉罕叙事中的核心用语及其神学分量。
- source_word: אִתָּךְ
  choice: 与你同在
  rationale: 该介词结构直指“与你”；在“我的约”之后译作“与你同在”，既贴近原文，也不扩写为原文未明说的“立约”。
- source_word: וְהָיִיתָ
  choice: 你必成为
  rationale: 在此立约宣告中具有将来和结果意味；“必成为”兼顾应许的确定性与身份转变。
- source_word: לְאָב
  choice: ……之父
  rationale: 介词 לְ 与“父”连用，表示成为某种身份；“万国之父”庄重、自然，并保留“父”的明确意象，而不改释为“祖先”。
- source_word: הֲמוֹן
  choice: 万
  rationale: 这里表示数量众多。与“国”结合译为“万国”，是自然庄重的现代汉语表达；“万”表众多，并非精确数字。
- source_word: גּוֹיִם
  choice: 国
  rationale: 此处泛指多个民族或国家群体，并非后世技术意义上的“外邦人”；“万国”最符合上下文。
theological_decisions:
- issue: 约的表述与亚伯拉罕的角色
  choice: 保留静态而直接的宣告：“我的约与你同在；你必成为万国之父。”
  alternative: 解释性地译为“我要与你立约，你将成为许多民族的祖先。”
  rationale: 原文宣告约与亚伯兰的关系及其应许结果，却没有在本句明说“现在立约”；同时保留“父”而不改为“祖先”，避免消解原文意象或加入后来的神学阐释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“至于我……看哪”保留希伯来文开头的双重强调；分号呈现约的宣告与应许结果之间的紧密关系。所有脚注标记均已置于正文。
