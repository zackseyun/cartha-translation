base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: zh_hans
  text: 亚伯拉罕就俯伏在地，笑了，心里说：“一百岁的人[a]还能有孩子出生吗？撒拉已经九十岁了，还能生孩子吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个一百岁的人还能有儿子出生吗？”希伯来文此处用“儿子”一词。
    reason: 说明“孩子”的词义替代，并准确反映原文的“儿子”用词。
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו
  choice: 亚伯拉罕就俯伏在地
  rationale: 原文直陈亚伯拉罕“伏在自己脸上”；“俯伏在地”是现代汉语中自然、庄重的对应表达，也保留了俯伏的身体姿态。
- source_word: וַיִּצְחָק
  choice: 笑了
  rationale: צחק的基本义为“笑”。不加“喜笑”“嗤笑”等限定，以免预先判定这笑的性质，并保留与以撒之名的词根联系。
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: 心里说
  rationale: 贴近希伯来文“在他心里说”的表达，清楚表明这些话并未说出口。
- source_word: הַלְּבֶן מֵאָה שָׁנָה יִוָּלֵד
  choice: 一百岁的人还能有孩子出生吗
  rationale: 原文以“百岁之子”这一年龄惯用语指百岁的人，并用ילד的被动式表达“有孩子出生”。“还能”自然传达反问中对可能性的惊异，但不把反问解释成明确的不信。
- source_word: וְאִם שָׂרָה הֲבַת־תִּשְׁעִים שָׁנָה תֵּלֵד
  choice: 撒拉已经九十岁了，还能生孩子吗
  rationale: “九十岁之女”是希伯来语年龄表达法；译为“已经九十岁了”符合现代汉语。תלד由女性作主语，译为“生孩子”自然清楚。
theological_decisions:
- issue: 亚伯拉罕发笑的性质
  choice: 仅译为“笑了”，不说明动机或道德性质
  alternative: 译为“因不信而笑”或“欢喜地笑”
  rationale: 本节只叙述发笑和内心的反问，并未明确判定这是出于不信、惊讶还是喜乐；译文应保留这种叙事张力。
- issue: 两个反问的语气
  choice: 用“还能……吗”表达惊异而不直接断定不可能
  alternative: 译为“怎么可能……”或“难道……不成”
  rationale: “怎么可能”容易把亚伯拉罕的心态定性为彻底否认；“还能……吗”既自然地呈现高龄背景下的反问，也保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俯伏在地”“心里说”保留原文形象；两处“还能”使反问在汉语中自然，同时不替文本裁定亚伯拉罕发笑的神学性质。
