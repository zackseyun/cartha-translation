review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了以实玛利蒙福、繁衍、产生十二位首领并成为大国的应许。但“极其昌盛”把“极其增多”的人口／后裔增殖语义泛化为整体繁荣；且原文先以完成式说“我已经赐福给他”，随后转入将来应许，宜在汉语中保留这一层次。
  naturalness: 语体庄重、清楚，适合现代标准汉语经文。“看哪”和“首领”均自然。将“繁衍增多，极其昌盛”调整为并列的“使他繁衍，使他极其增多”，既自然也更贴近原文重复强化。
  terminology: “以实玛利”“赐福”“首领”“大国”均合宜。נְשִׂיאִם 译为“首领”避免了“王子”的亲属义误解。
  issues:
