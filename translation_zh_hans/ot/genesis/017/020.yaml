base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: zh_hans
  text: 至于以实玛利，我已经听见你所求的。看哪，我已经赐福给他；我要使他繁衍，使他极其增多。他必生十二个首领；我要使他成为一个大国。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל שְׁמַעְתִּיךָ
  choice: 至于以实玛利，我已经听见你所求的
  rationale: 介词短语译作话题转换“至于以实玛利”；שְׁמַעְתִּיךָ 字面为“我听见了你”，语境中指神听允亚伯拉罕为以实玛利所作的请求，补出“所求的”使现代汉语自然，同时不把含义扩大为无条件应允一切。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和强调下文应许的功能，并维持庄重的经文语体。
- source_word: בֵּרַכְתִּי אֹתוֹ
  choice: 我要赐福给他
  rationale: 希伯来语完成式在应许语境中表达确定将实现之事；汉语以“要”自然呈现其将来指向和确定性。
- source_word: וְהִפְרֵיתִי אֹתוֹ וְהִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד
  choice: 使他繁衍增多，极其昌盛
  rationale: 分别体现“使结果实/繁衍”和“使增多”，并以“极其”传达 מְאֹד מְאֹד 的强烈程度；“昌盛”在此概括人口大增的结果。
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם יוֹלִיד
  choice: 他将生十二个首领
  rationale: יוֹלִיד 为使役形，指成为十二人的父亲；汉语“生十二个”简洁自然。נְשִׂיאִם 指族群或部族首领，不采用可能暗示王室制度的“王子”。
- source_word: וּנְתַתִּיו לְגוֹי גָּדוֹל
  choice: 我要使他成为一个大国
  rationale: נָתַן 加 לְ 在此表达使之成为；גּוֹי 可指民族或国家群体，“大国”承接创世记的应许用语。
theological_decisions:
- issue: “我已经听见你”是否表示以实玛利承受与以撒相同的约
  choice: 译为“我已经听见你所求的”，仅表明神回应亚伯拉罕关于以实玛利的祈求
  alternative: “关于以实玛利，我听从了你”
  rationale: 本节明确赐给以实玛利繁衍和成国的福，却没有说他承受下一节所确认的约；译文不将福分与立约混同，也不削弱神真实的应允。
- issue: 完成式应许的时态表达
  choice: 按汉语语境译作将来应许“我要……”“将……”
  alternative: 逐字译作“我已经赐福……已经使……”
  rationale: 先知性或确定性完成式将未来行动呈现为已确定；现代汉语直译为过去时容易误导事件时间，因此以将来式传达语用价值。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“看哪”以体现 הִנֵּה 的强调作用；以“首领”避免“王子”的现代亲属义歧义。未设置脚注，因为正文可直接清楚表达原文。
