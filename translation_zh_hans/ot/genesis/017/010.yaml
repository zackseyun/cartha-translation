base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: zh_hans
  text: “这是我的约，是你们所要遵守的：在我与你们，以及你以后的后裔之间，你们中所有的男子都要受割礼。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: 这是我的约
  rationale: 希伯来语以阴性单数指示词引出“我的约”；汉语补出判断词“是”，自然且准确。“约”延续《创世记》中 בְּרִית 的核心用语。
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: 是你们要遵守的
  rationale: 未完成式在盟约语境中表达应尽的义务；“要遵守”兼顾约束力和现代汉语的自然表达。
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: 我与你们，以及你以后的后裔之间
  rationale: 保留原文由复数“你们”转为单数“你”的变化，后者直接指亚伯拉罕；זֶרַע 是集合用语，此处译为“后裔”。
- source_word: הִמּוֹל לָכֶם כָּל זָכָר
  choice: 你们中所有的男子都要受割礼
  rationale: הִמּוֹל 的被动形式表达“受割礼”的要求；לָכֶם 在这里界定所属群体，译作“你们中”；כָּל זָכָר 明确保留男性范围。
theological_decisions:
- issue: 割礼命令的性别范围
  choice: 你们中所有的男子都要受割礼
  alternative: 你们所有人都要受割礼
  rationale: 原文明确使用 כָּל זָכָר（所有男性），不可泛化为所有人。
- issue: “约”与割礼要求之间的关系
  choice: 保留“这是我的约……所有的男子都要受割礼”的直接表述
  alternative: 解释为“这是立约的记号”
  rationale: 本节原文直接把所要遵守的约引向割礼要求；“约的记号”虽见于下一节，但不应提前加入本节而消解原文的表达张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“约”“遵守”“受割礼”符合圣经语境且普通读者易懂；保留原文从“你们”到“你”的数变化。
