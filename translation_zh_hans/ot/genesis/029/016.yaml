  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: zh_hans
  text: 拉班有两个女儿：大女儿名叫利亚，小女儿名叫拉结。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְלָבָן
  choice: 拉班有
  rationale: 希伯来语字面为“而/给拉班”，是用介词表达领属的结构，意为“拉班有”。句首的 וּ־ 在此承接叙事，现代汉语无需另加“现在”。
- source_word: שְׁתֵּי בָנוֹת
  choice: 两个女儿
  rationale: 准确而自然地表达数词加名词的结构。
- source_word: שֵׁם הַגְּדֹלָה לֵאָה
  choice: 大女儿名叫利亚
  rationale: 原文直译为“大女儿的名字是利亚”。在两个姐妹的语境中，הַגְּדֹלָה 指年长者；“大女儿名叫”既保留命名公式，也符合现代汉语习惯。
- source_word: וְשֵׁם הַקְּטַנָּה רָחֵל
  choice: 小女儿名叫拉结
  rationale: 在姐妹对举中，הַקְּטַנָּה 指年幼者。“小女儿”与“大女儿”形成自然、清楚的汉语平行结构。
- source_word: לֵאָה
  choice: 利亚
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: רָחֵל
  choice: 拉结
  rationale: 采用中文圣经传统中通行的人名译法。
theological_decisions: []
