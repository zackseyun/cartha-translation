base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: zh_hans
  text: 他一看，只见田野里有一口井；又见三群羊卧在井旁[a]，因为人们从那口井给羊群饮水[b]。井口上有一块大石头[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “井旁”直译可作“在它上面”或“靠着它”。
    reason: 说明希伯来语介词的字面范围与此处采用的自然空间表达。
  - marker: b
    text: “从那口井给羊群饮水”也可译作“从那口井打水给羊群喝”。原文动词指使羊群喝水；此处可指惯常做法。
    reason: 说明使役动词的译法及未完成式在语境中可表达的习惯性含义。
  - marker: c
    text: “井口”直译为“井的口”，指井的开口处。
    reason: 保留原文具体而形象的身体部位隐喻。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 他一看
  rationale: ראה在此推进叙事并引出眼前景象。“他一看”比单说“他看见”更自然地承接上下文，也保留动作的生动感。
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: 只见……又见
  rationale: הִנֵּה两次唤起读者注意。“只见……又见”既体现重复和现场感，又符合现代汉语叙事习惯。
- source_word: בְאֵר בַּשָּׂדֶה
  choice: 田野里有一口井
  rationale: 直接表达井位于田野或郊野中的场景，不增添水源性质等原文未说明的信息。
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: 三群羊
  rationale: עֵדֶר是牲畜群，צֹאן指绵羊、山羊一类的小型家畜；“三群羊”在汉语中简洁自然，并与后文“羊群”呼应。
- source_word: רֹבְצִים עָלֶיהָ
  choice: 卧在井旁
  rationale: רבץ描写牲畜伏卧或躺卧；עָלֶיהָ字面有“在它上面/靠着它”之意，此处按空间关系自然译为“在井旁”。
- source_word: יַשְׁקוּ הָעֲדָרִים
  choice: 人们一向……打水给羊群喝
  rationale: שׁקה的使役式意为使喝水、饮牲畜；未明说的复数主语在汉语中以泛指“人们”表达，未完成式在解释当地惯常做法的语境中用“一向”呈现。
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: 井口上压着一块大石头
  rationale: “井口”准确传达“井的口”；“压着”自然描写大石头位于开口之上的状态，并保留石头很大的信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“只见……又见”对应原文两次הִנֵּה，保留场景展开的生动感；句式不过度仿古。“羊”按汉语常用统称处理，不武断限定为只有绵羊。
