  to: 他一看，只见田野里有一口井；又见三群羊卧在井旁[a]，因为人们从那口井给羊群饮水[b]。井口上有一块大石头[c]。
  rationale: 修订仅收紧两处可能超出原文的表达：“有一块大石头”忠实保留原文的静态位置描述，不预设石头正在“压住”井口；删去“一向”以免过度强化时间持续性。其余措辞、重复提示和脚注锚点均可保留。
