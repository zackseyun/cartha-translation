  yaml_path: translation/ot/genesis/029/030.yaml
  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: zh_hans
  text: 雅各也与拉结同房[a]。他爱拉结胜过利亚，又在拉班那里服事了七年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与拉结同房”原文直译为“也进去到拉结那里”，在这里是婚姻圆房的委婉说法。下句的“胜过利亚”按原文介词最自然地译为比较；也可理解为“爱拉结而非利亚”，但不必表示他完全不爱利亚。
    reason: 说明希伯来语婚姻委婉语，并保留比较介词的替代理解，同时避免把该理解扩展为原文未明确断言的意思。
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: 雅各也与拉结同房
  rationale: בוא אֶל 在婚姻语境中委婉表示进入女子的住处并圆房。现代汉语用“同房”既保留委婉语气，也清楚传达婚姻圆房之意；“也”对应 גַּם，承接先前与利亚的婚姻关系。
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: 他爱拉结
  rationale: אָהַב 是普通的“爱”，原文动词本身没有额外的程度强化，因此不添加“深爱”等词。此处第二个 גַּם 在汉语中若机械译出会显得累赘，其承接和强调作用由上下文自然体现。
- source_word: מִלֵּאָה
  choice: 胜过利亚
  rationale: 介词 מִן 接在表示爱慕的动词之后，最自然地表达比较，故译作“胜过利亚”；同时以脚注保留“选择拉结而不选择利亚”的可能理解。
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: 在拉班那里服事
  rationale: עבד 表示服事或劳作；עִמּוֹ 字面为“与他一起／在他那里”。根据上下文，所指为雅各继续在拉班那里服役，译出拉班之名可避免汉语代词指向含混。
- source_word: עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת
  choice: 又……七年
  rationale: עוֹד 与 אֲחֵרוֹת 共同表达额外增加的一段时期；现代汉语“又……七年”自然、准确。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“同房”保留原文的委婉表达；“服事”体现契约性劳作语境，又不刻意古奥。主语首处明说“雅各”，并以“拉班”替代容易含混的第三人称代词。
