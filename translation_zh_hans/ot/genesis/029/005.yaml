base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/005.yaml
  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: zh_hans
  text: 他对他们说：“你们认识拿鹤的儿子拉班吗？”[b]他们说：“我们认识他。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“我们认识”，宾语“他”由上下文暗示。
    reason: 说明正文为符合现代汉语表达而补出了隐含宾语。
  - marker: b
    text: “儿子”所译的希伯来语也可泛指男性后代；《创世记》24:29、47节称拉班为彼土利的儿子。
    reason: 保留并说明亲属称谓在本节中的词义与家谱张力。
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: 他对他们说
  rationale: 保留叙事中的说话动作和间接宾语；希伯来语连接词在连续叙事中不必机械译作“于是”或“又”。
- source_word: הֲיְדַעְתֶּם
  choice: 你们认识……吗
  rationale: יָדַע在这里指认识、熟悉某个人；现代汉语用“认识”比“知道”更自然准确。
- source_word: לָבָן
  choice: 拉班
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בֶּן נָחוֹר
  choice: 拿鹤的儿子
  rationale: 按בֶּן的直接含义译为“儿子”，不在正文中将其解释性改写为“后代”；其可能的广义用法另见脚注。
- source_word: וַיֹּאמְרוּ יָדָעְנוּ
  choice: 他们说：‘我们认识他。’
  rationale: 重复使用“认识”，对应原文两次使用יָדַע；补出宾语“他”，使现代汉语回答完整自然。
theological_decisions:
- issue: בֶּן נָחוֹר所表达的亲属关系
  choice: 正文保留“拿鹤的儿子”
  alternative: 拿鹤的后代
  rationale: בֶּן的基本义是“儿子”，但也可用于较广的男性后裔关系。正文保留原文表层措辞及其与《创世记》其他家谱资料之间的张力，不擅自消解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留“说”的叙事形式，不改写为更具解释性的“问”和“回答”；引语简洁，符合口语对答。
