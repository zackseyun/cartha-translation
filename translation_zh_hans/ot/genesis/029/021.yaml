  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: zh_hans
  text: 于是雅各对拉班说：“把我的妻子交给我吧，因为我服事的日子已经满了，我好与她同房[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“进去她那里”，是指圆房的惯用委婉说法。
    reason: 说明希伯来语的委婉表达及其字面形式。
lexical_decisions:
- source_word: הָבָה
  choice: 交给我吧
  rationale: 这是向拉班提出的命令式请求；“交给我吧”自然表达婚约履行后将新娘交给雅各之意，并以“吧”保留请求语气。
- source_word: אֶת אִשְׁתִּי
  choice: 我的妻子
  rationale: אִשָּׁה 可指“女人”或“妻子”；此处拉结是按约要与雅各成婚的人，因此译作“我的妻子”最符合语境。
- source_word: כִּי מָלְאוּ יָמָי
  choice: 因为我服事的日子已经满了
  rationale: 原文直译为“因为我的日子已经满了”，所指是雅各约定服事拉班的期限；补出“服事”使现代读者清楚理解，同时保留“日子已经满了”的原文意象。
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: 我好与她同房
  rationale: 原文字面为“我好到她那里去／进去”，是希伯来语表示圆房的委婉说法；“与她同房”是自然、庄重且同样委婉的现代汉语表达，并体现此处的目的语气。
