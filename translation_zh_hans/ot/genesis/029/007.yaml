base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: zh_hans
  text: 他说：“看哪，天还早[a]，还不到把牲畜聚拢的时候。你们给羊群[b]喝水，然后再去放牧吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“白昼还大（或还长）”，意思是白昼尚余很多，也可译作“现在还是大白天”。
    reason: lexical_alternative
  - marker: b
    text: “牲畜”所译的原词泛指家养的群畜；“羊群”所译的另一个词较具体，指绵羊、山羊等小型牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引起听者注意的指示性叹词；“看哪”庄重而清楚，也保留了原文的话语功能。
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: 天还早
  rationale: 原文直译近于“日子还大／还长”，意指白昼尚余很多；“天还早”是现代汉语中自然、准确的表达。
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: 还不到把牲畜聚拢的时候
  rationale: 保留“时候”所表达的适当时机，并将被动式转为汉语更自然的处置结构；“牲畜”体现 מִקְנֶה 所指的广义家畜集合。
- source_word: הַשְׁקוּ
  choice: 给……喝水
  rationale: 该使役命令式意为使牲畜喝水；此译法自然，并保留命令语气。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צֹאן 指小型牲畜的集合，常包括绵羊和山羊；场景中译作“羊群”最自然，但以脚注说明其范围。
- source_word: וּלְכוּ
  choice: 然后再去
  rationale: 连接词与命令式在这里表示先饮水、后放牧的行动次序。
- source_word: רְעוּ
  choice: 放牧
  rationale: רעה 在此指带牲畜吃草、照管牲畜；“放牧”切合水井边的具体语境。
