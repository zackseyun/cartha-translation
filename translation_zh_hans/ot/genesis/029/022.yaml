  text: וַ/יֶּאֱסֹ֥ף לָבָ֛ן אֶת כָּל אַנְשֵׁ֥י הַ/מָּק֖וֹם וַ/יַּ֥עַשׂ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: zh_hans
  text: 于是，拉班召集了当地所有的男人，摆设宴席[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“当地所有的人”。希伯来文直译为“当地所有的男人”；这里很可能指受邀参加婚宴的当地男子，因此正文保留阳性表达。
    reason: lexical_alternative
  - marker: b
    text: “宴席”所译的希伯来词常指庆祝性的筵宴，也可含有饮酒之意。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 召集
  rationale: אסף在此叙事语境中指把人聚集起来。“召集”自然准确，也体现拉班主动招聚当地人的动作。
- source_word: לָבָן
  choice: 拉班
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: 当地所有的男人
  rationale: אַנְשֵׁי是אִישׁ的阳性复数构造形式，直译为“……的男人”。上下文很可能指受邀参加婚宴的当地男子，因此正文保留阳性所指；הַמָּקוֹם自然译为“当地”。
- source_word: וַיַּעַשׂ
  choice: 摆设
  rationale: עשה本义宽泛，可译为“做、举行”。与“宴席”搭配时，中文“摆设宴席”既贴近原文，又符合庄重自然的叙事表达。
- source_word: מִשְׁתֶּה
  choice: 宴席
  rationale: 该词指庆祝性的筵宴，往往包括饮酒。婚礼语境中译作“宴席”简洁自然，又不把饮酒含义过度明说。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“于是”承接前文连续动作；“摆设宴席”符合中文习惯，并保留原文עשה与מִשְׁתֶּה的搭配意义。所有脚注标记均置于正文相应位置。
