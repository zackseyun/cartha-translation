base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: zh_hans
  text: “你先把这位女子婚礼的一周过完[a]，我们也会把另一个给你[b]，作为你再为我做工[c]七年的报偿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“完成这位（女子）的一周”；这里指当时婚礼庆祝的一周。
    reason: cultural_note
  - marker: b
    text: 或译：“另一个也会被给你。”希伯来语的动词形式上是阴性单数；上下文表达的是拉班承诺把另一个女儿也给雅各。
    reason: lexical_alternative
  - marker: c
    text: “做工”也可译为“服事”；这里指雅各为拉班劳动。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: 过完
  rationale: 该命令式表示完成一个规定的时段。与“婚礼周”搭配时，“把……过完”是自然的现代汉语，同时保留命令语气。
- source_word: שְׁבֻעַ זֹאת
  choice: 这个女子的婚礼周
  rationale: 字面是“这个的七日周期”。阴性指示词在上下文中指利亚；这里的“七日周期”是婚礼庆祝的一周。译文明确所指，并以脚注保留字面结构和文化背景。
- source_word: וְנִתְּנָה לְךָ
  choice: 我们也会把……给你
  rationale: 希伯来语形式上是阴性单数，可理解为“她也会被给你”；在拉班许诺把另一个女儿给雅各的语境中，汉语用主动式更自然。脚注保留被动式这一可能译法。
- source_word: גַּם אֶת זֹאת
  choice: 也会把另一个给你
  rationale: 第二个阴性指示词指拉结。若直译“也把这个给你”，现代汉语中容易与前面的利亚混淆，因此按上下文译作“另一个”，同时不补入姓名。
- source_word: בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי
  choice: 作为你再为我做工……的报偿
  rationale: 介词短语说明给出拉结所对应的劳务条件或代价。“为我做工”自然表达雅各在拉班手下劳动的关系；“报偿”清楚呈现交易性联系。
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: 再……七年
  rationale: “再……七年”简洁保留 עוֹד 的增添意义，并表明这是此前七年之外的另一段七年。
