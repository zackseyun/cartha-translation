base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: zh_hans
  text: 拉班对雅各说[a]：“难道因为你是我的亲属，就该白白为我做工吗？告诉我，你的工钱该是多少。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲属”原文直译为“我的弟兄”；这里泛指有亲属关系的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: 虽……难道就
  rationale: 将反问的依据与主句自然连结，表达“虽因亲属关系，也不应无偿做工”的语气，同时不把希伯来语结构误作单纯的信息问句。
- source_word: אָחִי
  choice: 我的亲属
  rationale: אָחִי字面为“我的弟兄”，但此处指外甥雅各这一较广义的亲属关系；译作“亲属”清楚准确。
- source_word: וַעֲבַדְתַּנִי
  choice: 为我做工
  rationale: עבד在工资协商语境中指为拉班劳动；“做工”比“服侍”更符合现代汉语中的雇佣语境。
- source_word: חִנָּם
  choice: 白白
  rationale: 表达没有报酬、无偿劳动，并保留原文简洁而带反问意味的说法。
- source_word: הַגִּידָה לִּי
  choice: 告诉我
  rationale: 直接对应命令式及其间接宾语，现代汉语自然明白。
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: 你要什么报酬
  rationale: מַשְׂכֻּרְתֶּךָ指雅各所得的工资或报酬；结合商定待遇的语境，译为“你要什么报酬”自然表达让雅各提出条件的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“虽……难道就……”保留反问张力；“白白为我做工”和“报酬”清楚呈现劳动与工资的语境。
