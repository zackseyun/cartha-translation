  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: zh_hans
  text: 拉班把自己的婢女[a]悉帕给了他的女儿利亚，作她的婢女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”也可译作“女仆”；希伯来语所指的是处于依附地位、很可能是受奴役的女性仆役。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 给了
  rationale: נתן在此表示将某人交给另一人；“给了”直接、自然，并保留叙事中的安排与归属意味，不额外强化为“转交”或“指派”。
- source_word: זִלְפָּה
  choice: 悉帕
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: שִׁפְחָתוֹ
  choice: 自己的婢女
  rationale: שִׁפְחָה指处于从属、很可能属于奴役身份的女性仆役。“婢女”简洁保留其性别和低下身份；“自己的”自然表达第三人称男性单数后缀，并避免误解为利亚原有的婢女。
- source_word: לְלֵאָה בִתּוֹ
  choice: 给了女儿利亚
  rationale: 介词לְ标明接受者，בִתּוֹ说明利亚是拉班的女儿。中文按自然语序合并为“给了女儿利亚”。
- source_word: שִׁפְחָה
  choice: 作她的婢女
  rationale: 末尾名词说明悉帕被给予时所承担的身份或角色。中文需补出关系代词“她的”才自然清楚，其所指由紧邻的“女儿利亚”明确限定。
