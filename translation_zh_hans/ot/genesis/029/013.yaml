base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: zh_hans
  text: 拉班听见有关他姊妹的儿子雅各的消息，就跑去迎接他，抱住他，亲吻他，把他领到自己家里。雅各把这一切都告诉了拉班。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִשְׁמֹעַ לָבָן
  choice: 拉班听见……就
  rationale: 介词 כְּ 与不定词构成时间从句；“听见……就”自然表达叙事中的先后关系，又不刻意强化为“刚一听见”。
- source_word: שֵׁמַע יַעֲקֹב
  choice: 有关……雅各的消息
  rationale: שֵׁמַע 在这里指关于雅各的消息或传闻，而非单指听见这一动作。
- source_word: בֶּן אֲחֹתוֹ
  choice: 他姊妹的儿子
  rationale: 希伯来文直陈亲属关系。采用“姊妹”避免把原文未说明的长幼关系具体化为“姐姐”或“妹妹”，也比“外甥”更贴近原文。
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: 就跑去迎接他
  rationale: לִקְרַאת 表示前去与人相遇；在亲属相见的语境中，“迎接”自然准确。
- source_word: וַיְחַבֶּק לוֹ
  choice: 抱住他
  rationale: חבק 意为拥抱；“抱住他”是自然、庄重而易懂的现代汉语。
- source_word: וַיְנַשֶּׁק לוֹ
  choice: 亲吻他
  rationale: נשׁק 在此为亲吻，属于亲属见面时的问候，不额外加入其他含义。
- source_word: וַיְבִיאֵהוּ אֶל־בֵּיתוֹ
  choice: 把他领到自己家里
  rationale: 使役形态表达把人带到某处；“领到自己家里”符合汉语叙事习惯，并清楚表明 בֵּיתוֹ 所指是拉班的家。
- source_word: וַיְסַפֵּר לְלָבָן
  choice: 雅各……告诉了拉班
  rationale: 动词未明说主语，但上下文最自然地指雅各。明确写出姓名，可避免前面连续以拉班为主语所造成的误读。
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: 这一切
  rationale: דְּבָרִים 可指话语、事情或情况；此处概括雅各所讲述的经历，用“这一切”自然且保留范围的概括性。
theological_decisions: []
