base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: zh_hans
  text: 他们说：“我们现在还不能；必须等到所有羊群都聚齐，并且有人把石头从井口滚开，然后我们才能给羊群饮水。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群”所译的希伯来词可泛指成群饲养的小型牲畜，尤其包括绵羊和山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נוּכַל
  choice: 我们还不能这样做
  rationale: יכל表示能力或可能性；原文省略了具体动作，需由上下文补足。“这样做”保留这种省略，同时使现代汉语自然。“还”体现后文“要等到……”所表达的暂时限制。
- source_word: יֵאָסְפוּ כָּל הָעֲדָרִים
  choice: 所有羊群都聚齐
  rationale: אסף的尼法勒形在此表示各群牲畜聚集到一起；“聚齐”准确表达全部到齐。עדר在牧养语境中指畜群，此处译作“羊群”与上下文协调。
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: 大家把石头……滚开
  rationale: גלל意为“滚动”；上下文表明是将盖井的石头移开。“大家”自然表达希伯来文未明确指称的复数主语，不限定为某几个特定人物。
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: 从井口
  rationale: 希伯来文直译为“从井的口上”；现代汉语“井口”保留意象与空间关系，也更自然简洁。
- source_word: וְהִשְׁקִינוּ הַצֹּאן
  choice: 然后我们才给羊群饮水
  rationale: שקה的使役形表示“给……水喝”。“然后……才”清楚呈现必须先聚齐羊群并移开石头，之后才能饮水的次序。צאן是集合名词，故译为“羊群”。
