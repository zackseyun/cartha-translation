- from: 所有羊群都聚集到那里后，牧人们就把石头从井口滚开，给羊群饮水，然后把石头放回井口原处。
  to: 所有羊群都聚集到那里后，牧人们就把石头从井口滚开，让羊群喝水，然后把石头放回井口上原来的位置。
  rationale: 仅作汉语措辞调整：明确石头复位在井口之上的原位置，并以更自然的使役表达译出“使羊群喝水”。不增添任何神学或历史解释。
