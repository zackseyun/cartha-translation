base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: zh_hans
  text: 所有羊群都聚集到那里后，牧人们就把石头从井口滚开，让羊群喝水，然后把石头放回井口上原来的位置。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: 都聚集到……后
  rationale: 尼法勒未完成式在此与后续动作共同描述惯常发生的过程；“聚集到……后”自然表达羊群聚齐之后才移石饮水的次序。
- source_word: כָל הָעֲדָרִים
  choice: 所有羊群
  rationale: עדרים在此指成群的小型牲畜；结合上下文，译作“羊群”准确而自然。
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: 牧人们就把石头……滚开
  rationale: גלל保留“滚动”的具体动作。“牧人们”根据上文明确的行动者补出，避免中文将能动者误解为羊群。
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: 从井口
  rationale: “井口”是现代汉语对希伯来语字面“井的口”的自然对应，也包含מֵעַל所表达的从井口上方移开的意思。
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  choice: 给羊群饮水
  rationale: שׁקה的使役形表示使牲畜喝水；“给羊群饮水”简洁、庄重，并保留צאן的集合意义。
- source_word: וְהֵשִׁיבוּ אֶת הָאֶבֶן
  choice: 然后把石头放回
  rationale: שוב的使役形表示使物体返回原处；“放回”符合现代汉语表达。
- source_word: עַל פִּי הַבְּאֵר לִמְקֹמָהּ
  choice: 井口原处
  rationale: 紧凑表达石头被放回其原来位于井口之上的位置，不重复堆叠方位短语。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。经文无需要注释才能保留的实质歧义，因此不设脚注；以“牧人们”承接上文所指的牧羊人，避免中文出现羊群滚动石头的歧义。
