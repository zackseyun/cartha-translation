base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: zh_hans
  text: 到了早晨，看哪，竟是利亚！雅各就对拉班说：“你对我做的是什么事？我在你那里做工，不是为了拉结吗？那么，你为什么欺骗我？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事中表示突然发现和惊愕的提示语；与“竟是”结合，使现代汉语读者自然感受到反转。
- source_word: עָבַדְתִּי עִמָּךְ
  choice: 我在你那里做工
  rationale: עבד在此指为拉班服劳役；“在你那里做工”比直译“与你做工”更符合现代汉语，同时不额外限定雇佣关系。
- source_word: רִמִּיתָנִי
  choice: 欺骗我
  rationale: 准确表达利用诡计使人受骗的含义，并与上下文拉班调换新娘的行为相符。
- source_word: וְלָמָּה
  choice: 那么，你为什么
  rationale: 保留וְ在前一反问基础上引出质问的承接意味，对应语境中的“既然如此，为什么”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留“看哪”这一圣经叙事提示语及原文突如其来的揭示效果；在直接引语中明确“雅各”为说话者，以避免现代汉语中的代词指向含混。
