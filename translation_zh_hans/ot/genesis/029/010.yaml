  text: וַ/יְהִ֡י כַּ/אֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת רָחֵ֗ל בַּת לָבָן֙ אֲחִ֣י אִמּ֔/וֹ וְ/אֶת צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑/וֹ וַ/יִּגַּ֣שׁ יַעֲקֹ֗ב וַ/יָּ֤גֶל אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וַ/יַּ֕שְׁקְ אֶת צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: zh_hans
  text: 雅各一看见拉结[a]，就是他母亲的兄弟拉班的女儿，又看见他母亲的兄弟拉班的羊群，就上前把石头从井口滚开，给他母亲的兄弟拉班的羊群饮水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在本节三次重复“他母亲的兄弟”，强调雅各与拉班的亲属关系。
    reason: 说明原文刻意保留的重复及其修辞作用。
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 一……就……
  rationale: 这一希伯来叙事结构引出紧接发生的事件；汉语用“一……就……”既保留时间关系，也自然呈现动作的迅速推进。
- source_word: רָאָה
  choice: 看见
  rationale: 此处指直接的视觉感知，“看见”准确而自然。
- source_word: בַּת
  choice: 女儿
  rationale: 准确表达拉结与拉班的亲属关系，并以同位说明融入汉语句式。
- source_word: אֲחִי אִמּוֹ
  choice: 他母亲的兄弟
  rationale: 原文在本节三次重复这一明确的亲属称谓；不用较简略的“母舅”，以保留重复及其强调作用。
- source_word: צֹאן
  choice: 羊群
  rationale: צֹאן是集合名词，可泛指绵羊和山羊等小型牲畜；“羊群”在现代汉语中自然，并避免硬性限定具体种类。
- source_word: וַיִּגַּשׁ
  choice: 上前
  rationale: 表达雅各走近井口采取行动，符合上下文和自然汉语叙事。
- source_word: וַיָּגֶל
  choice: 滚开
  rationale: 保留גלל所表达的滚动动作，以及将盖井石移离井口的结果。
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: 从井口
  rationale: פִּי字面为“口”，在这里指井的开口；汉语“井口”既保留这一意象，也完全自然。
- source_word: וַיַּשְׁקְ
  choice: 给……饮水
  rationale: 使役形表达给牲畜水喝；“给羊群饮水”准确、简洁且符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。特意三次保留“他母亲的兄弟拉班”，虽比“母舅拉班”略显展开，却忠实呈现原文重复；用“一看见……就……”使长句在汉语中连贯自然。
