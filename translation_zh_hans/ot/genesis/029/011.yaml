  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: zh_hans
  text: 雅各亲吻拉结[a]，便放声哭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅各以亲吻问候拉结。”希伯来语动词通常意为“亲吻”，但在此语境中，也可能带有亲族相见时以吻问候的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: 亲吻
  rationale: 希伯来语动词נשק在Qal词干中通常意为“亲吻”。这里首先描写实际的亲吻动作，同时在亲族相见的语境中也可具有以吻问候之意。
- source_word: לְרָחֵל
  choice: 拉结
  rationale: 介词ל在此标示“亲吻”的对象；现代汉语自然表达为“亲吻拉结”，不必另译介词。
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: 放声
  rationale: 原文直译为“扬起他的声音”，是表示高声发出声音的希伯来语习语。与后面的“哭”结合，现代汉语以“放声大哭”自然、准确地表达其强烈且出声的哭泣。
- source_word: וַיֵּבְךְּ
  choice: 大哭
  rationale: בכה意为“哭、哭泣”；与前面的“扬声”习语合译为“放声大哭”，既传达动作，也保留声音强度。
- source_word: וַ
  choice: 就
  rationale: 连续式叙事连接词推动事件发展；“就”自然表现本节动作承接上文的次序。
theological_decisions: []
