base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: zh_hans
  text: 拉班说：“我把她给你，总比把她给别的男人好。你就留在我这里吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是叙事中引出直接引语的常用表达；现代汉语自然译作“说”。
- source_word: טוֹב תִּתִּי אֹתָהּ לָךְ מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: 我把她给你，总比把她给别的男人好
  rationale: טוֹב 与介词 מִן 引出的比较项构成“与其……不如……”或“……总比……好”的比较结构。此译法既保留原文的评价语气，也符合自然现代汉语。
- source_word: אִישׁ אַחֵר
  choice: 别的男人
  rationale: 直译为“另一个男人”；婚姻语境虽可理解为别的婚配对象，但译作“男人”避免加入原文未明说的“丈夫”。
- source_word: שְׁבָה עִמָּדִי
  choice: 你就留在我这里吧
  rationale: שְׁבָה 是 ישׁב 的祈使式，在此指继续住下或留下；“留在我这里”比字面的“与我同住”更自然，并保留拉班要求雅各留下的意思。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“总比……好”清楚呈现希伯来语的比较结构；句末用“吧”传达祈使语气而不显生硬。
