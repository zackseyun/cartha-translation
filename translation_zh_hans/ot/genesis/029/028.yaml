  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: zh_hans
  text: 雅各就照着做了，过完这一周[a]，拉班便把女儿拉结嫁给雅各为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“完成这婚宴的一周”。希伯来文此词本指“七”的一段时期；在这里很可能指婚宴持续的一周。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: 雅各就照着做了
  rationale: עשה与כֵּן合用，回指上一节拉班的要求；“照着做了”自然保留这种回指关系，又不把具体行动说得过细。
- source_word: וַיְמַלֵּא
  choice: 满了
  rationale: 此处为完成一段规定时间之意；“满了这一周”是现代汉语中自然且简洁的时间表达。
- source_word: שְׁבֻעַ זֹאת
  choice: 这一周
  rationale: שְׁבֻעַ本义为一个“七”的周期，在婚姻语境中很可能指婚宴的一周；正文保留较直译且自然的“这一周”，文化含义置于脚注。
- source_word: וַיִּתֶּן לוֹ
  choice: 拉班便把……给雅各
  rationale: 希伯来文的主语与间接宾语均以代词表达，但上下文明确分别指拉班和雅各；在中文中明说姓名可避免连续多个“他”造成歧义。“便”体现叙事先后。
- source_word: אֶת רָחֵל בִּתּוֹ
  choice: 女儿拉结
  rationale: 按自然中文语序表达“他的女儿拉结”，关系清楚而简洁。
- source_word: לוֹ לְאִשָּׁה
  choice: 给雅各作妻子
  rationale: 该结构表示将女子嫁给某人为妻；此译符合现代庄重叙事语体，并保留婚姻含义。
