  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: zh_hans
  text: 耶和华见利亚遭人厌恶，就使她能生育；拉结却不能生育。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: 被厌恶
  rationale: 保留希伯来文“被恨、被厌恶”的强烈措辞，不弱化为“失宠”或“不受宠爱”；同时用现代汉语较自然的被动表达。
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: 就使她能怀孕
  rationale: 原文直译为“打开她的子宫”；此处是使其具有受孕生育能力的惯用表达，译成自然且庄重的现代汉语。
- source_word: עֲקָרָה
  choice: 不能生育
  rationale: 准确表达当时不能生育的状态，避免“石女”等陈旧且带贬抑色彩的说法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的专名形式，指明以色列上帝的圣名。
theological_decisions:
- issue: 利亚所受待遇的强度
  choice: 被厌恶
  alternative: 不受宠爱
  rationale: 上下文涉及雅各对拉结与利亚的差别之爱，但本节原文使用 שׂנא 的强烈词语；不以较弱解释替代原文，从而保留叙事中的张力。
- issue: 上帝使利亚生育的表达
  choice: 使她能怀孕
  alternative: 打开她的子宫
  rationale: 保留上帝主动赐予生育能力的含义，同时避免在现代汉语中生硬或可能引起误解的身体意象。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准普通话。分号呈现利亚能怀孕与拉结不能生育之间的鲜明对照；不添加原文没有的解释。
