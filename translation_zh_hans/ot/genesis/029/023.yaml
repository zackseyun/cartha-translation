  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: zh_hans
  text: 到了晚上，拉班把女儿利亚带到雅各那里[a]；雅各就与她同房。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把她带到他那里”；“他”指雅各。
    reason: 说明原文的代词指向，并保留“带到”这一动作的字面语义。
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: 到了晚上
  rationale: 以自然的现代汉语交代叙事时间，并保留事件随之发生的推进感。
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: 拉班把女儿利亚带来
  rationale: לקח在此指拉班将利亚带去婚房安排；汉语补出上一节已明确的主语“拉班”，并按自然语序表达“女儿利亚”。
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: 交给雅各
  rationale: 字面为“把她带到他那里”；结合婚夜场景译作“交给雅各”，自然地表达带到雅各面前的动作。为避免现代汉语代词指向含混，补明“雅各”。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: 雅各就与她同房
  rationale: בוא אל在这里是表示发生性关系的惯用委婉语。“与她同房”是现代汉语中庄重而清楚的对应表达，同时保留委婉语气。
