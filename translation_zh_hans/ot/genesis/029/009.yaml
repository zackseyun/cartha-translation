base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: zh_hans
  text: 他还在同他们说话时，拉结带着她父亲的羊群来了，因为她是牧羊女[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她是牧羊人。”希伯来语使用阴性形式，表明拉结是负责牧放羊群的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: 他还在同他们说话时
  rationale: “עוֹדֶנּוּ”与分词连用，表示当时仍在持续的动作；此译自然表达说话与拉结到来在时间上的重叠。
- source_word: וְרָחֵל
  choice: 拉结
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: בָּאָה עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: 拉结带着她父亲的羊群来了
  rationale: 保留“来”的叙事动作，并将希伯来语表达所属关系的定语从句自然译为“她父亲的”。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出拉结为何带羊群而来的解释。
- source_word: רֹעָה הִוא
  choice: 她是牧羊女
  rationale: “רֹעָה”是阴性形式，在这里表明拉结以牧放羊群为职责；“牧羊女”简洁保留了原文明确的女性身份。
