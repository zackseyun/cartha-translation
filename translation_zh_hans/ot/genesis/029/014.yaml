  text: וַ/יֹּ֤אמֶר ל/וֹ֙ לָבָ֔ן אַ֛ךְ עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה וַ/יֵּ֥שֶׁב עִמּ֖/וֹ חֹ֥דֶשׁ יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: zh_hans
  text: 拉班对他说：“你实在是我的骨、我的肉[a]。”雅各就和他同住了整整一个月[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“我的骨、我的肉”，是亲属用语，意思是有血缘关系的至亲。
    reason: cultural_note
  - marker: b
    text: 希伯来语直译为“一个月的日子”，意思是“一个整月”或“一个月”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对他说
  rationale: 未机械译出叙事连接词 וַ；现代汉语可借语序自然推进叙事。根据上下文明确主语为拉班。
- source_word: אַךְ
  choice: 实在
  rationale: 此处作强调肯定语，确认双方的亲属关系；“实在”自然传达其语气，而不误解为限制义“只是”。
- source_word: עַצְמִי וּבְשָׂרִי
  choice: 我的骨、我的肉
  rationale: 保留希伯来语亲属表达的具体意象及经文间呼应，不在正文中直接意译为“我的亲人”。
- source_word: וַיֵּשֶׁב עִמּוֹ
  choice: 雅各就和他同住了
  rationale: יָשַׁב 在此表示一段时期内住在拉班那里。“同住”符合现代汉语；为避免连续代词造成指代含混，按上下文补明主语“雅各”。
- source_word: חֹדֶשׁ יָמִים
  choice: 整整一个月
  rationale: 这是表示一个月时段的希伯来语习语；“整整一个月”自然，并适度体现 יָמִים 所带出的完整时段意味。
theological_decisions: []
