  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: zh_hans
  text: 他问他们[a]：“他好吗？”他们回答：“他很好。看，他女儿拉结正带着羊群过来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他平安吗？”希伯来文“平安”在这里表示安康、顺遂。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: 他平安吗？
  rationale: שָׁלוֹם在这里询问拉班是否安好；“平安吗”既保留原词的表达，又是自然的现代汉语问候。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 原文以同一词简短作答；汉语用“平安”能够保留问答之间的呼应，无须补出完整句式。
- source_word: וְהִנֵּה
  choice: 看
  rationale: הִנֵּה用于把听者的注意力引向眼前出现的人物；“看”简洁自然，并保留现场指示感。
- source_word: רָחֵל
  choice: 拉结
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: בִּתּוֹ
  choice: 他女儿
  rationale: 第三人称后缀指向前文所问的拉班；直译为“他女儿”可明确亲属关系。
- source_word: בָּאָה
  choice: 正……过来
  rationale: 阴性单数分词描绘拉结正在接近的可见场景；“正……过来”自然呈现其进行状态和趋近方向。
- source_word: עִם הַצֹּאן
  choice: 带着羊群
  rationale: צֹאן是绵羊、山羊等小型牲畜的集合称谓；“羊群”在本语境中自然且保留集合意义。“带着”比机械的“和……一起”更符合牧放场景。
