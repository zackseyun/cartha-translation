  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: zh_hans
  text: 拉班说：“在我们这里，没有先把小女儿嫁出去、再把长女儿嫁出去的规矩。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的叙事性wayyiqtol在此是普通引语动词，译为“说”自然直接。
- source_word: לָבָן
  choice: 拉班
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: 没有……的规矩
  rationale: 此处被动式表达当地不实行或不认可的惯例；这样译能自然传达非人称的社会习俗含义，而不是单纯表示不能做。
- source_word: בִּמְקוֹמֵנוּ
  choice: 在我们这里
  rationale: מָקוֹם字面为“地方”，在语境中指拉班所属地区或群体的当地习俗；“在我们这里”兼顾字面意象和现代汉语习惯。
- source_word: לָתֵת
  choice: 嫁出去
  rationale: נתן字面为“给”，但本节语境明确指父亲把女儿给人作妻子；现代汉语若直译“给”会生硬且可能含混，“嫁出去”准确补出原文隐含的婚嫁意义。
- source_word: הַצְּעִירָה
  choice: 小女儿
  rationale: 阴性形容词在此名词化，指两个女儿中较小的一个；“小女儿”自然明确，并保留比较关系。
- source_word: לִפְנֵי
  choice: 先……后……
  rationale: 此处表示次序上的在先；汉语用“先……后……”清楚呈现婚嫁顺序。
- source_word: הַבְּכִירָה
  choice: 长女儿
  rationale: בכירה指头生或年长的女儿，与“小女儿”相对；“长女儿”在现代汉语中自然，并保留女性身份及出生次序。
