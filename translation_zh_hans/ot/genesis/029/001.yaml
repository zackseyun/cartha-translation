  rationale: 原文直译为“雅各抬起他的脚”，是表示继续上路的习语；译作“又启程”既自然，也承接上一章雅各此前的旅程。
- source_word: אַרְצָה בְנֵי קֶדֶם
  choice: 往东方人的地方
  rationale: בְּנֵי־קֶדֶם 字面为“东方之子”，在此是对东方居民的惯用称呼；“东方人的地方”保留其群体和地域含义，不把范围具体化为原文未明说的国家。
