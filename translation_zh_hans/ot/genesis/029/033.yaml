base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: zh_hans
  text: 她又怀孕，生了一个儿子，说：“雅威既听见我被恨[a]，就也把这个孩子赐给我了。”于是她给他取名叫西缅[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我不被爱”“我较少被爱”或“我被厌弃”。希伯来语直译是“我被恨”，但在本段语境中也可能表示遭冷落或相对较少被爱。
    reason: lexical_alternative
  - marker: b
    text: “西缅”的希伯来语读音与“听见”相近。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: 她又怀孕
  rationale: “又”准确表达 עוֹד 的重复含义；中文叙事无需机械译出句首连接词，也能自然推进情节。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: 贴合 ילד + בן 的常用含义，也是现代汉语中自然、清楚的出生叙述。
- source_word: כִּי שָׁמַע יְהוָה
  choice: 雅威既听见
  rationale: כִּי 在这里引出利亚的解释；“既……就……”自然呈现因由及其结果。שָׁמַע 保留为“听见”，以维系与“西缅”的命名双关。神名 יְהוָה 音译为“雅威”。
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: 我被恨
  rationale: 保留 שְׂנוּאָה 的直接、强烈词义，不在正文中将其弱化为“不受宠爱”或“较少被爱”；较宽的语境含义列入脚注。
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: 就也把这一个赐给我了
  rationale: “也”对应 גַּם，“这一个”对应 אֶת זֶה，并由上文明确指向刚出生的儿子；“赐给”适合上帝作为施予者的语境。
- source_word: וַתִּקְרָא שְׁמוֹ שִׁמְעוֹן
  choice: 于是她给他取名叫西缅
  rationale: 以自然现代汉语表达希伯来语命名公式；“西缅”采用通行中文圣经人名形式，命名中的语音关联通过脚注说明。
theological_decisions:
- issue: 利亚怎样描述自己与雅各关系中的处境
  choice: 我被恨
  alternative: 我不被爱／我较少被爱／我被厌弃
  rationale: 希伯来语 שְׂנוּאָה 本义强烈，正文保留其字面张力；上下文可能表达相对失宠，但不应在正文中悄然替原文作出弱化解释。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，采用“雅威”音译，以保留其作为专名的性质。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。正文保留“我被恨”的强烈表达和命名双关，不用解释性译文消除原文的叙事张力；两处脚注标记均置于正文相应词语之后。
