  yaml_path: translation/ot/genesis/029/029.yaml
  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: zh_hans
  text: 拉班把自己的婢女辟拉[a]给了女儿拉结，作她的婢女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婢女”或译“女奴”；本节两处相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 给了
  rationale: 叙事性未完成式带连续词，表示接续发生的过去动作；“给了”简明自然。
- source_word: לָבָן
  choice: 拉班
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: לְרָחֵל
  choice: 给了……拉结
  rationale: 介词 לְ 在此标示接受者；中文以“把……给了……”自然表达。
- source_word: בִּתּוֹ
  choice: 女儿
  rationale: 原文为“他的女儿”；中文句中主语已经是拉班，省去重复的“他的”更自然，所属关系仍然清楚。
- source_word: בִּלְהָה
  choice: 辟拉
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: שִׁפְחָתוֹ
  choice: 自己的婢女
  rationale: שִׁפְחָה 指女性仆役，也可含女奴身份；“婢女”既保留性别和从属身份，又符合庄重的叙事语体。“自己的”明确第三人称阳性单数后缀指拉班。
- source_word: לָהּ לְשִׁפְחָה
  choice: 作她的婢女
  rationale: 直译意义为“给她作婢女”；此译符合现代中文表达，并保留原文第二次出现的 שִׁפְחָה。
