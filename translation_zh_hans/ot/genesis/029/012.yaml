  text: וַ/יַּגֵּ֨ד יַעֲקֹ֜ב לְ/רָחֵ֗ל כִּ֣י אֲחִ֤י אָבִ֨י/הָ֙ ה֔וּא וְ/כִ֥י בֶן רִבְקָ֖ה ה֑וּא וַ/תָּ֖רָץ וַ/תַּגֵּ֥ד לְ/אָבִֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: zh_hans
  text: 雅各告诉拉结，自己是她父亲的亲属，是利百加的儿子[a]。拉结就跑去告诉她父亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她父亲的亲属”原文直译为“她父亲的兄弟”。这里“兄弟”是亲族称谓；具体说，雅各是拉班的外甥。
    reason: 说明希伯来文亲族词语的字面形式及其在本节中的实际关系。
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 告诉
  rationale: נגד的使役词干在这里表示“告知、使人知道”；“告诉”符合现代汉语叙事表达。
- source_word: כִּי
  choice: （引出所告知的内容）
  rationale: 两个כִּי分句均承接“告诉”，在汉语中无需逐一译出连接词，以“自己是……，是……”自然呈现间接引语。
- source_word: אֲחִי אָבִיהָ
  choice: 她父亲的亲属
  rationale: אָח字面为“兄弟”，也可泛指男性亲属。按上下文，雅各是拉班的外甥，并非其亲兄弟；译作“亲属”传达此处亲族称谓的实际含义，同时以脚注保留希伯来文的字面表达。
- source_word: בֶן רִבְקָה
  choice: 利百加的儿子
  rationale: 直接、自然地表达母子关系。
- source_word: וַתָּרָץ
  choice: 跑去
  rationale: רץ表示“跑”；“跑去”既保留动作的鲜明性，也自然衔接其目的。
- source_word: וַתַּגֵּד לְאָבִיהָ
  choice: 告诉她父亲
  rationale: 再次将נגד译作“告诉”，保持叙事用词一致；לְאָבִיהָ自然译为“她父亲”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“自己”明确间接引语中的主语所指；省略汉语中不必要的两个“说……是”，使句子流畅。脚注保留原文“兄弟”的字面信息，正文则避免让读者误以为雅各是拉班的亲兄弟。
