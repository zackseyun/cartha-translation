source:
  edition: WLC
  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: zh_hans
  text: 她又怀孕，生了一个儿子。她说：“这一次，我要赞美雅威。”因此，她给他起名叫犹大[a]。此后，她不再生育了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大”的希伯来语读音与“赞美”或“感谢”一词相关。
    reason: 说明原文中 יְהוּדָה 与 אוֹדֶה（源自 ידה）之间的命名文字关联；这一关联在中文译名中无法直接听出。
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: 她又怀孕
  rationale: הרה表示怀孕、受孕；עוֹד在连续生育的叙事中表示再次发生。现代汉语用“又怀孕”自然简洁。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: 准确表达 ילד 与 בן 构成的常见生育用语，也符合现代汉语叙事习惯。
- source_word: הַפַּעַם
  choice: 这一次
  rationale: 保留其相对于前几次生育而指向当前这一次的意味，不额外加入“终于”等情绪。
- source_word: אוֹדֶה
  choice: 我要赞美
  rationale: ידה 的 Hiphil 形式可表示赞美或感谢；此处与“犹大”的命名构成文字关联。“赞美”既符合语境，也不排除感谢的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以专名呈现，而不以称号替代。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 清楚保留宣告与命名之间的因果关系。
- source_word: קָרְאָה שְׁמוֹ יְהוּדָה
  choice: 她给他起名叫犹大
  rationale: 将希伯来语“她称他的名为”自然地转为现代汉语命名表达；“犹大”采用通行译名。
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: 此后，她不再生育了
  rationale: עמד 加介词 מן 和不定式表示停止某项活动。“不再生育”准确而自然；“此后”标明这是叙事当时阶段的状态，不强行解释为终身不能再生。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留其专名性质；不以“主”这一称号替代，也不采用较传统但与较可能古音距离更大的“耶和华”。
- issue: אוֹדֶה 的语义范围
  choice: 赞美
  alternative: 感谢
  rationale: 该动词在此可涵盖赞美与感谢，两者并非截然分开。正文采用能与“犹大”命名说明更直接呼应的“赞美”，脚注同时保留“感谢”这一可能语义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式简明，适合普通读者；保留连续叙事的节奏，并用脚注呈现中文无法复制的希伯来语文字关联。
