  text: וַ/יַּעֲבֹ֧ד יַעֲקֹ֛ב בְּ/רָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַ/יִּהְי֤וּ בְ/עֵינָי/ו֙ כְּ/יָמִ֣ים אֲחָדִ֔ים בְּ/אַהֲבָת֖/וֹ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: zh_hans
  text: 雅各为拉结服事了七年；因为他爱她，这七年在他眼中就像几天一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这七年在他眼中如同几天。”
    reason: 保留原文关于主观感受的形象表达，并说明译文与希伯来语句式的关系。
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: 服事
  rationale: עבד既可指“工作”，也可指为某人效力、服役；此处是雅各按约定以劳作换取迎娶拉结，“服事”较能保留这种关系和契约意味。
- source_word: בְּרָחֵל
  choice: 为拉结
  rationale: 介词ב在本语境中表示雅各为了娶拉结而付出劳作；“为拉结”简洁自然，又不把交易意味表达得过重。
- source_word: שֶׁבַע שָׁנִים
  choice: 七年
  rationale: 直接对应原文的数词和时间单位。
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: 这七年在他眼中就像
  rationale: 保留希伯来语“在他眼中”的形象说法，同时明确复数主语所指的是前述七年，使现代汉语读者易于理解。
- source_word: כְּיָמִים אֲחָדִים
  choice: 几天一样
  rationale: יָמִים אֲחָדִים在这里意为少数几天；译作“几天”自然地表达七年在雅各主观感受中十分短暂，且不额外加入原文没有明说的“仅仅”。
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: 因为他爱她
  rationale: 前置ב在这里适合按原因理解；把名词性表达自然转为汉语动词句，准确传达“由于他对她的爱”。
