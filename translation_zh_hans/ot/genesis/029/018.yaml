  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: zh_hans
  text: 雅各爱拉结，就说：“我会为你服事七年，以娶你的小女儿拉结。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: 爱
  rationale: אָהַב直接表示爱；译作“爱”既贴近原文，也不额外加入“爱上了”等起始体含义。
- source_word: וַיֹּאמֶר
  choice: 就说
  rationale: אמר是普通的“说”；“就”自然承接叙事，但不赋予额外的说话方式。
- source_word: אֶעֱבָדְךָ
  choice: 我愿为你服事
  rationale: עבד在此指雅各为拉班付出劳作；“服事”兼顾劳作及对人的从属关系，比单纯“工作”更贴近原词。
- source_word: שֶׁבַע שָׁנִים
  choice: 七年
  rationale: 直接对应数词与年份名词，语义明确。
- source_word: בְּרָחֵל
  choice: 来娶……拉结
  rationale: 此处介词ב表示雅各七年服事所针对的婚姻安排。现代汉语若仅说“为拉结服事”容易被理解为服事拉结本人，因此结合语境译为“来娶……拉结”。
- source_word: בִּתְּךָ
  choice: 你的小女儿
  rationale: 忠实表达“你的女儿”，并与后置形容词合并成自然的汉语名词短语。
- source_word: הַקְּטַנָּה
  choice: 小女儿
  rationale: 该词本义为“小的”，在利亚与拉结姐妹的比较中指年幼者；“小女儿”在现代汉语中自然表达较年幼的女儿。
- source_word: וַ
  choice: 就
  rationale: 叙事连接词推进事件；汉语“就”自然连接雅各爱拉结与随后的提议，无须机械译作“并且”。
