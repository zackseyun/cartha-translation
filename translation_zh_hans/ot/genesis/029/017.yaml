  yaml_path: translation/ot/genesis/029/017.yaml
  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: zh_hans
  text: 利亚的眼睛柔和[a]，拉结却体态优美，容貌美丽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“柔嫩”“温柔”或“软弱”。希伯来语这个形容词可表示柔软或柔嫩；这里确切的含义不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: 眼睛
  rationale: 该词是“眼睛”的复数附属形，明确指利亚的眼睛，而不是她整体的神情或外貌。
- source_word: רַכּוֹת
  choice: 柔弱
  rationale: 该形容词可表示柔软、柔嫩或软弱；“柔弱”保留其柔和与可能欠佳的双重意味，同时用脚注说明原文确切语气不明。
- source_word: יְפַת תֹּאַר
  choice: 身材秀美
  rationale: תֹּאַר在此指形体、身形；译作“身材秀美”自然地表达身体形态之美，并与后面的容貌相区别。
- source_word: וִיפַת מַרְאֶה
  choice: 容貌俊美
  rationale: מַרְאֶה指可见的外貌；“容貌俊美”保留原文对外在观感的第二重描写，没有与身材合并。
- source_word: וְ
  choice: 却
  rationale: 连接词字面为“和”，但上下文将利亚与拉结并列对照；“却”自然传达这种对比关系。
