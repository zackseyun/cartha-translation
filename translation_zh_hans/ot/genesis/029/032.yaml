source:
  edition: WLC
  text: וַ/תַּ֤הַר לֵאָה֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי רָאָ֤ה יְהוָה֙ בְּ/עָנְיִ֔/י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥/נִי אִישִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: zh_hans
  text: 利亚怀孕，生了一个儿子[a]，就给他起名叫流便，因为她说：“因为雅威看见了我的苦楚，如今我丈夫必会爱我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流便”这个名字在希伯来语中让人联想到“看，一个儿子”；利亚以“雅威看见了我的苦楚”解释这个名字。
    reason: 说明原文中无法在中文人名音译里直接保留的文字关联。
lexical_decisions:
- source_word: וַתַּהַר
  choice: 怀孕
  rationale: 希伯来语 הרה 指受孕或怀孕；现代汉语叙事中“怀孕”自然清楚。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: 准确表达 ילד 与 בֵּן 构成的生育叙事惯用语，并保持简洁。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: 给他起名叫
  rationale: 保留希伯来语命名公式，同时符合现代汉语习惯，并引出名字与后文的文字关联。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用中文圣经传统中广为人知的人名译法；名字本身的希伯来语文字关联由脚注说明。
- source_word: כִּי אָמְרָה
  choice: 因为她说
  rationale: 此处 כִּי 引出起名的理由；译作“因为”明确呈现叙事逻辑。
- source_word: כִּי רָאָה יְהוָה
  choice: 耶和华看见了
  rationale: 将完成式 רָאָה 自然译为“看见了”，表达利亚认为上帝已经注意到她的处境；话语开头的 כִּי 在汉语中可由上下文和分号后的推论自然承载，避免重复“因为”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的神名音译，明确将四字神名作为专名呈现，而非以称号“主”代替。
- source_word: בְּעָנְיִי
  choice: 我的苦楚
  rationale: עֳנִי 表示困苦、苦难或受压的处境；“苦楚”自然、庄重，并贴合利亚在婚姻中不被爱的痛苦。
- source_word: כִּי עַתָּה
  choice: 如今
  rationale: עַתָּה 标示因儿子出生而出现的新情势；“如今”自然呈现她的期待。
- source_word: יֶאֱהָבַנִי אִישִׁי
  choice: 我丈夫会爱我了
  rationale: אִישִׁי 在婚姻语境中是“我丈夫”；“会爱我了”保留未完成式所表达的未来期待，并以句末“了”凸显她所盼望的处境转变。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用通行且读者熟悉的“耶和华”，不以“主”这一称号替代；“雅威”是较贴近学界拟音的可行方案。
- issue: 利亚话语中两个 כִּי 的关系
  choice: 前一处以陈述呈现上帝已经看见，后一处的推论由分号和“如今”衔接
  alternative: “因为耶和华看见了我的苦楚，所以如今我丈夫会爱我了”
  rationale: 两个 כִּי 的具体语用可有解释空间。正文不机械重复连接词，而保留从上帝看见她的苦楚到她期待丈夫爱她的推论，也不把她的期待写成上帝明确作出的保证。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“生了一个儿子”“给他起名叫”符合普通读者的表达习惯；直引语保留利亚的痛苦与盼望，不把她的主观期待提升为神学断言。脚注标记[a]已置于对应正文之后。
