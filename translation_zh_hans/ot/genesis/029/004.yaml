base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: zh_hans
  text: 雅各对他们说：“弟兄们[a]，你们是从哪里来的[b]？”他们说：“我们是从哈兰来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”是这里亲切、礼貌的称呼，不一定表示他们是亲兄弟或实际亲属。
    reason: cultural_note
  - marker: b
    text: 直译：“你们从哪里来？”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם יַעֲקֹב
  choice: 雅各对他们说
  rationale: 按希伯来语语序所表达的关系自然转为现代汉语；אמר采用常规的“说”，不因后接问句而增译为“问”。
- source_word: אַחַי
  choice: 弟兄们
  rationale: 字面为“我的弟兄们”，此处是对素不相识的男性牧人的亲切、礼貌称呼；汉语以“弟兄们”较自然，具体语用含义由脚注说明。
- source_word: מֵאַיִן אַתֶּם
  choice: 你们是从哪里来的
  rationale: מֵאַיִן询问来源，第二人称阳性复数由“你们”体现；采用自然的现代汉语问法。
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 保留אמר的常规意义“说”；虽可按语境译作“回答”，原文并未改用专指回答的动词。
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: 我们是从哈兰来的
  rationale: מִן表示来源，אֲנָחְנוּ为独立代词“我们”；汉语补足判断结构，使回答自然完整。
- source_word: חָרָן
  choice: 哈兰
  rationale: 采用该地名在现代中文圣经语境中的通行音译。
