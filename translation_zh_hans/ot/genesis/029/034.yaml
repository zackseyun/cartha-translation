base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: zh_hans
  text: 她又怀孕，生了一个儿子，说：“这一次，我丈夫会与我联结[a]，因为我给他生了三个儿子。”因此，他名叫利未。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “联结”也可译作“相连”或“结合”。这里的希伯来语动词与“利未”一名有语音上的关联。
    reason: 说明该动词的可译范围，并保留中文正文无法直接重现的希伯来语命名文字游戏。
lexical_decisions:
- source_word: וַתַּהַר עוֹד וַתֵּלֶד בֵּן
  choice: 她又怀孕，生了一个儿子
  rationale: “又”体现 עוֹד；“怀孕，生了一个儿子”自然、准确地表达连续的受孕和生产叙事。
- source_word: עַתָּה הַפַּעַם
  choice: 这一次
  rationale: 汉语“这一次”已能自然表达此处强调；若直译为“现在这一次”则显得生硬。
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: 我丈夫会与我相连
  rationale: “丈夫”准确表达婚姻语境中的 אִישִׁי；“与我相连”保留 לוה 所表达的联合、依附之意，也便于说明它与“利未”的文字游戏。
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: 因为我给他生了三个儿子
  rationale: 保留 כִּי 的原因关系、לוֹ 的受益对象以及“三个儿子”的明确数量；表达符合现代汉语习惯。
- source_word: עַל כֵּן קָרָא שְׁמוֹ לֵוִי
  choice: 因此，他名叫利未
  rationale: “因此”体现命名缘由。原文动词为第三人称阳性单数，却未明说命名者；汉语用结果式表达避免擅自认定是利亚或其他人命名。“利未”采用通行译名。
theological_decisions:
- issue: יִלָּוֶה 与 לֵוִי 之间的命名文字游戏
  choice: 正文译作“与我相连”，并用脚注说明发音联系
  alternative: 与我联合；依附我；亲近我
  rationale: “相连”既较自然，又保留联合和依附的基本意象；中文无法直接重现希伯来语的谐音，故以脚注说明，不把单一关系含义过度神学化。
- issue: קָרָא 的未明示主语
  choice: 译作“他名叫利未”
  alternative: 她给他起名叫利未；人给他起名叫利未
  rationale: 原文没有明说命名者。结果式表达保留这一不确定性，避免补入女性主语或笼统的人称主语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这一次”比“现在这一次”更符合现代汉语；“与我相连”略带庄重色彩，并服务于原文命名解释。
