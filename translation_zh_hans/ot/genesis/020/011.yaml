base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: zh_hans
  text: 亚伯拉罕说：“因为我说：‘这地方根本没有人敬畏上帝[a]，他们必因我妻子的缘故杀我。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“惧怕上帝”。
    reason: “敬畏”表达该词所含的尊崇、畏惧及道德责任；“惧怕”提示其另一可译的侧重。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出亚伯拉罕先前采取欺瞒做法的原因，采用自然明确的因果表达。
- source_word: אָמַרְתִּי
  choice: 我曾想
  rationale: 该词字面为“我说”，但此处所引内容是亚伯拉罕当时的内心判断；“我曾想”在现代汉语中自然表达“对自己说”的语用含义。
- source_word: רַק
  choice: 根本
  rationale: 此处具有强调意味，突出亚伯拉罕断定当地全然缺乏对上帝的敬畏；“根本”符合现代汉语表达。
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: 没有人敬畏上帝
  rationale: 将希伯来语名词结构自然转化为汉语主谓表达，同时保留“敬畏上帝”这一兼有畏惧、尊崇与道德责任意味的圣经用语。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: 简洁、自然地对应原文方位短语，不扩大为地区或区域。
- source_word: וַהֲרָגוּנִי
  choice: 他们必……杀我
  rationale: 表达亚伯拉罕当时所预期的结果；“必”也承接其笃定的判断。
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: 因我妻子的缘故
  rationale: 准确表达“因为／由于我妻子”，并保持庄重流畅的叙事语体。
theological_decisions:
- issue: יִרְאַת אֱלֹהִים 的表达
  choice: 敬畏上帝
  alternative: 惧怕上帝
  rationale: “敬畏”保留该短语所包含的畏惧、尊崇以及在上帝面前承担道德责任的复合含义；脚注提示更偏重恐惧层面的译法，避免抹平词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我曾想”按语境表达内心言说；“根本”传达 רַק 的强调语气。
