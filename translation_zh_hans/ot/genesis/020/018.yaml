  text: כִּֽי עָצֹ֤ר עָצַר֙ יְהוָ֔ה בְּעַ֥ד כָּל רֶ֖חֶם לְ/בֵ֣ית אֲבִימֶ֑לֶךְ עַל דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: zh_hans
  text: 因为耶和华因亚伯拉罕的妻子撒拉，已经使亚比米勒家中所有的子宫都完全闭合了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“已经把亚比米勒家中每一个子宫完全关闭了”。“完全闭合”所译的动词在希伯来文中以不定式绝对形与限定动词连用，表示强调；也可译作“确实关闭了”或“彻底关闭了”。此处指生育受到阻断。
    reason: 保留原文具体的身体意象、强调句法及可行的译法，同时说明该表达在上下文中的生育含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接并说明上一节亚比米勒家中妇女生育得恢复的缘由，汉语以“因为”自然引出解释。
- source_word: עָצֹר עָצַר
  choice: 已经使……不能生育了
  rationale: 结合“子宫”和上下文生育恢复的语境，传达使人生育受阻的结果；“已经……了”体现先于上一节医治的状态，脚注补明希伯来文的强调结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名的通行音译，以专名呈现而不改作头衔。
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: 亚比米勒家中所有妇女
  rationale: 原文直指“亚比米勒家中的每一个子宫”；正文按自然现代汉语表达其所指对象，同时在脚注保留具体身体意象。
- source_word: עַל דְּבַר
  choice: 因
  rationale: 此处说明审判临到亚比米勒家的原因，简洁的“因”准确表达因果关系。
- source_word: אֵשֶׁת אַבְרָהָם
  choice: 亚伯拉罕的妻子
  rationale: 自然呈现原文属格关系，并强调撒拉作为亚伯拉罕妻子的身份。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；译文保留为专有名词。现代简体中文圣经读者最熟悉“耶和华”，而“雅威”更接近学界常见的拟音，两者均非以“主”这一头衔替代神名。
- issue: 不能生育的直接施事者
  choice: 明确由耶和华使亚比米勒家中妇女不能生育
  alternative: 用被动表达而弱化施事者
  rationale: 原文以耶和华为 עָצַר 的明确主语，因此保留神直接施行这一审判的表述。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“家中”指亚比米勒的整个家族或家眷，并非仅指建筑物。正文用“所有妇女都不能生育”自然传达语境意义，脚注则保留原文“每一个子宫”的具体表达及 עָצֹר עָצַר 的强调力度。
