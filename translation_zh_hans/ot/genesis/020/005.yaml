base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: zh_hans
  text: 他不是亲自对我说：‘她是我的姊妹’吗？她自己也说：‘他是我的兄弟。’我做这事，是出于内心的纯正和双手的清白。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我以纯正的心和清白的手做这事。”希伯来语用“心”和“手”的道德—法律习语，表达真诚和无辜。
    reason: 说明“心”与“手”的习语性表达，并提供较贴近原文形式的译法。
lexical_decisions:
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 这是预期肯定回答的反问；“不是……吗”自然保留了希伯来语的反问语气。
- source_word: הוּא אָמַר לִי
  choice: 他不是亲口对我说
  rationale: 独立代词 הוּא 带有强调意味；“亲口”在现代汉语中自然表达“是他本人说的”，同时保留 לִי“对我”的受事关系。
- source_word: אֲחֹתִי הִוא
  choice: 她是我的妹妹
  rationale: 按本章人物关系采用现代汉语通常的亲属称谓“妹妹”，直接表达亚伯拉罕的说法。
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: 她自己也说
  rationale: “自己”体现独立代词的强调，“也”对应 גַם，保留撒拉本人同样作证的累加强调。
- source_word: אָחִי הוּא
  choice: 他是我的哥哥
  rationale: 按人物关系采用自然明确的“哥哥”，直接表达撒拉所说的亲属关系。
- source_word: בְּתָם לְבָבִי
  choice: 存心纯正
  rationale: תָּם 在这里表示内心正直、诚实无欺；“存心纯正”既保留道德含义，也避免暗示绝对无罪。
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: 双手清白
  rationale: 保留希伯来语以“手”指行为与责任的道德—法律性意象；“清白”清楚表达无辜而非字面的洁净。
- source_word: עָשִׂיתִי זֹאת
  choice: 我做这事
  rationale: 以简明过去事件陈述表达完成体，并让“这事”明确指亚比米勒所采取的行动。
theological_decisions:
- issue: 亚比米勒自辩中的道德—法律习语
  choice: 译作“存心纯正，双手清白”，将其保留为针对这件事的诚实与无辜声明。
  alternative: 可较直译为“在我内心的纯全和我双手的洁净中”。
  rationale: 经文是亚比米勒对本次行为的自辩，并非宣告自己在一切事上绝对无罪；本译法保留其无辜主张的力度，也不扩大其范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亲口”“存心纯正”“双手清白”既自然，也保留原文的强调及心、手并列的修辞意象。
