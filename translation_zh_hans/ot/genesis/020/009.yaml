base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: zh_hans
  text: 亚比米勒召来亚伯拉罕，对他说：“你对我们做了什么？我犯了什么罪，以致你使大罪临到我和我的国？你竟对我做出不该做的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... לְאַבְרָהָם
  choice: 召来亚伯拉罕
  rationale: קרא与לְ加人物连用可表示叫来、召来；“召来”既符合君王传唤的场景，也不过分强化正式司法意味。
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: 你对我们做了什么
  rationale: 直接保留质问形式；“对我们”自然表达行为对群体造成的影响。
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: 我犯了什么罪得罪了你
  rationale: 同时体现חטא的“犯罪”意味及לָךְ所表达的针对关系；“什么”贴近原文מֶה，也适合现代汉语。
- source_word: כִּי
  choice: 竟
  rationale: 此处承接反问并引出亚伯拉罕行为造成的严重后果；“竟”自然传达责问和震惊语气，而不把逻辑关系僵化为单纯原因。
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: 使我和我的国陷入
  rationale: 使役式הֵבֵאתָ字面为“使……临到”；结合“大罪”，汉语用“使……陷入”可自然表达令罪责或罪的后果临到君王及其国度。
- source_word: חֲטָאָה גְדֹלָה
  choice: 大罪
  rationale: 保留原文明确而强烈的道德与宗教用语，不弱化为一般的错误或过失。
- source_word: מַמְלַכְתִּי
  choice: 我的国
  rationale: 在君王发言中，“我的国”比“我的王国”更简洁自然，并保留其统治领域的含义。
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ עָשִׂיתָ עִמָּדִי
  choice: 你向我做了不该做的事
  rationale: 将前置宾语结构转为自然汉语，并以“不该做”表达被动未完成式在此具有的规范性含义。
theological_decisions:
- issue: “大罪”是已经临到的罪责，还是险些发生的严重罪行
  choice: 使我和我的国陷入大罪之中
  alternative: 使大罪临到我和我的国
  rationale: 原文说亚伯拉罕“使大罪临到”亚比米勒及其国，却未在本节具体界定这是既成罪责、共同后果还是迫近的罪；译文保留整体指控，不补入“险些”等解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的责问语气。原文各处在汉语正文中均可清楚表达，因此不增设脚注；也未沿用英文咨询稿中位置与内容不对应的脚注标记。
