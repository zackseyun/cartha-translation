  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: zh_hans
  text: 亚比米勒还没有亲近她[a]。他说：“主啊，难道你连一个无辜的[b]民族也要杀吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲近她”是希伯来语的委婉说法，在这里指与撒拉发生性关系。
    reason: cultural_note
  - marker: b
    text: 或译“公义的”。希伯来语 צַדִּיק 在这里可指在此事上无罪、无辜，也可译作“公义的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: 亲近她
  rationale: 保留希伯来语“靠近她”的委婉表达；在本语境中指亚比米勒尚未与撒拉发生性关系。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是亚比米勒在梦中对上帝的直接称呼；“主啊”自然、庄重，也不增添原文没有的“上帝”。
- source_word: גּוֹי
  choice: 民族
  rationale: 该词是指民族或群体的集合名词；“民族”保留亚比米勒申诉所涉及的整体范围，不将其缩小为他个人或仅指其家室。
- source_word: גַּם
  choice: 连……也
  rationale: 在反问句中表达强调，比单用“也”更准确地传达原文语气。
- source_word: צַדִּיק
  choice: 无辜的
  rationale: 该词通常可指公义、正直，也可在受审判的语境中表示无罪或无辜。这里亚比米勒申诉自己及其群体在此事上没有罪，“无辜的”最符合上下文；脚注保留“公义的”这一较形式对应的译法。
- source_word: תַּהֲרֹג
  choice: 要杀
  rationale: 以现代汉语直接表达未完成式在反问中的将来或意向色彩；“杀”比文言色彩较重的“杀戮”更自然。
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: 亚比米勒……就说
  rationale: “就”自然呈现叙事顺承及前后关联，不另加原文没有的显式时间副词。
theological_decisions:
- issue: 亚比米勒申诉中“民族”的整体范围
  choice: 译作“民族”，保留群体性的申诉
  alternative: 译作“百姓”或限缩为“家室”
  rationale: 原文使用集合名词 גּוֹי，周围语境所呈现的危险也不只涉及亚比米勒个人。译作“民族”既保留整体维度，也不武断限定其政治或家族规模。
- issue: צַדִּיק 在此处表示“公义”还是“无辜”
  choice: 正文译作“无辜的”，脚注注明“公义的”
  alternative: 正文译作“公义的”
  rationale: 此处的争点是亚比米勒及其群体是否应为这件事承担罪责，因此“无辜”更贴合司法性的语境；但原词与圣经中“公义”用语的联系不应被抹去，故在脚注中保留该译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“难道……连……也……”准确呈现反问和强调。“亲近她”保留原文委婉措辞，并以脚注说明实际含义。
