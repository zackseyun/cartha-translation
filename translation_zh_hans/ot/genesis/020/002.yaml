base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: zh_hans
  text: 亚伯拉罕论到他的妻子撒拉，说：“她是我的姊妹。”于是，基拉耳王亚比米勒派人把撒拉带走了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“派遣，并取了撒拉”。按语境，这表示亚比米勒派人把撒拉带到他那里；本节没有明说他娶了她。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אַבְרָהָם אֶל שָׂרָה אִשְׁתּוֹ
  choice: 亚伯拉罕谈到妻子撒拉时，说
  rationale: 介词 אֶל 通常可表示“向、对”，但结合所引的第三人称话“她是我的妹妹”，此处更自然地指亚伯拉罕谈论撒拉，而非直接对她说话。译文保留“说”，并用“谈到……时”清楚表达语境。
- source_word: אֲחֹתִי הִוא
  choice: 她是我的妹妹
  rationale: 直译这个无系词名词句；“妹妹”在现代汉语中自然表达说话者的女性手足，但希伯来语本身不标明长幼。
- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: 原文为“派遣”，受派者省略。现代汉语若单说“派”不完整，因此译作“派人”，只补出语法上隐含的执行者。
- source_word: מֶלֶךְ גְּרָר
  choice: 基拉耳王
  rationale: 简洁、自然地表达希伯来语构造链“基拉耳的王”。
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: 把撒拉带走了
  rationale: לקח 的基本义是“取、带走”。此处是亚比米勒派人将撒拉带到自己那里；“带走”比“娶了”更忠于本节的克制表述，也比单独的“取了”更符合现代汉语。
theological_decisions:
- issue: 亚比米勒带走撒拉的目的是否应在正文中明说
  choice: 把撒拉带走了
  alternative: 娶撒拉为妻／把撒拉纳入宫中
  rationale: 上下文可让读者理解其婚娶意图，但本节原文只说“派遣”并“取了撒拉”。译文不将上下文推断写成明说，以保留原文的叙事张力。
- issue: “妹妹”是否暗示撒拉比亚伯拉罕年幼
  choice: 她是我的妹妹
  alternative: 她是我的姐妹
  rationale: 希伯来语 אָחוֹת 不标明长幼；现代汉语“姐妹”用于单数谓语不够自然，而“妹妹”是此类亲属称谓的惯常表达。年龄信息不应据此作神学或历史推论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“谈到妻子撒拉时”避免误解为亚伯拉罕直接对撒拉说“她是我的妹妹”；“派人把……带走”则以自然汉语表达原文省略执行者的连续动作。正文仅设一个脚注，且标记已在正文出现。
