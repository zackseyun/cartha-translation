  terminology: 人名和地名“亚伯拉罕、撒拉、亚比米勒、基拉耳”一致且恰当。“姊妹”应替换“妹妹”，以忠实保留原文的亲属称谓范围。脚注不应把“带到他那里”当作字面意义，而应明确这是按语境作出的说明。
