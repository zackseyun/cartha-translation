  text: 亚比米勒说：“看哪，我的地在你面前；你认为哪里好，就住在哪里吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 作为引起注意的表达，现代汉语用“看”自然有力，也保留原文的指示语气。
- source_word: אַרְצִי לְפָנֶיךָ
  choice: 我的地都在你面前
  rationale: 保留“在你面前”的原文意象；“都”传达整片土地向亚伯拉罕开放、任其选择的语用含义。
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: 你看哪里好
  rationale: 自然传达希伯来语“在你眼中为好”的判断表达，同时保留“看”的视觉意象。
- source_word: שֵׁב
  choice: 就住在哪里吧
  rationale: 该动词在此指居住、定居；结合地点选择结构译为“住在哪里”，祈使句末用“吧”体现准许而非生硬命令。
