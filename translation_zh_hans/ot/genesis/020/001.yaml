  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: zh_hans
  text: 亚伯拉罕从那里启程，往南地去，住在加低斯和书珥之间；又在基拉耳寄居。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 启程
  rationale: 该词在叙事中表示从一处起行、迁往另一处；“启程”自然地传达行动的开始。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接回指亚伯拉罕先前所在之处，符合现代汉语表达。
- source_word: אַרְצָה הַנֶּגֶב
  choice: 往南地去
  rationale: אַרְצָה带方向义，הַנֶּגֶב在此很可能指称名为“南地”的地理区域；译文保留地名意义。
- source_word: וַיֵּשֶׁב
  choice: 住下
  rationale: ישׁב在此表示居住或定居；“住下”既自然，也不把居留的永久程度说得过满。
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: 在加低斯和书珥之间
  rationale: 按原文保留两个地名之间的地理定位，并采用现代中文圣经语境中通行的音译。
- source_word: וַיָּגָר
  choice: 寄居
  rationale: גור指以外来者或非永久居民的身份居住；“寄居”准确保留这一社会身份与暂居意味。
- source_word: בִּגְרָר
  choice: 在基拉耳
  rationale: 介词表示地点，地名采用现代中文圣经语境中通行的音译。
