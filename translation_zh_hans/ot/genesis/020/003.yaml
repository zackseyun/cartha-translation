base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: zh_hans
  text: 可是，夜里神在梦中来到亚比米勒那里，对他说：“看哪，你必死[a]！因为你带走的那个女人已经有丈夫了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“你是个死人”。原文表达确定而迫近的死亡，也可理解为“你将要死”。
    reason: 保留הִנְּךָ מֵת在现在状态与迫近结果之间的表达张力。
  - marker: b
    text: 原文直译近似“她是属于丈夫的女人”，意思是她已经有丈夫，处于婚姻关系中。
    reason: 说明בְּעֻלַת בָּעַל的字面形式及其惯用含义。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到……那里
  rationale: בוא在叙事中表示“来、到”；这里是梦中的临现，并非进入某个实体场所，因此译作“来到亚比米勒那里”自然且不过度具体化。
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: 夜里……在梦中
  rationale: 按现代汉语习惯调整语序，清楚表达这场梦中启示发生在夜间，同时保留原文的两个要素。
- source_word: הִנְּךָ מֵת
  choice: 看哪，你必死
  rationale: הִנְּךָ带出郑重而突如其来的宣告；מֵת在此表达确定、迫近的死亡。正文用“必死”传达其警告力度，脚注保留原文近似现在式的表达张力。
- source_word: לָקַחְתָּ
  choice: 你带来的
  rationale: לקח基本义为“拿、取、带走”。上下文指亚比米勒把撒拉带入自己那里；“带来的”在现代汉语中自然，又不擅自认定他已正式娶她或以暴力掳走她。
- source_word: בְּעֻלַת בָּעַל
  choice: 已经有丈夫了
  rationale: 该短语指女人已有丈夫、处于婚姻关系中。“已经有丈夫了”是自然清楚的现代汉语，也凸显这段既存婚姻关系。
theological_decisions:
- issue: 神对亚比米勒所宣告之死的时态与确定性
  choice: 你必死
  alternative: 你是个死人／你将要死
  rationale: 希伯来语形式可直译为“你是死的”，但语境是确定而迫近的死亡判决。“必死”保留确定性而不把他描述成已经实际死亡；脚注说明原文形式，以保存其张力。
- issue: בְּעֻלַת בָּעַל所表达的婚姻关系
  choice: 她已经有丈夫了
  alternative: 她是有夫之妇／她属于一个丈夫
  rationale: 译文明确撒拉已有丈夫这一事实，却不把古代关系用语扩展为关于所有权或婚姻制度的额外神学主张。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留郑重警示的语气；其余措辞避免过度古雅。“可是”承接上文亚比米勒把撒拉带走的情节，并表现神随即介入所形成的转折。
