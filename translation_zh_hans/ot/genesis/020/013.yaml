base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: zh_hans
  text: 当上帝使我离开父家、四处漂泊时[a]，我对她说：‘你要这样恩待我[b]：每到一个地方，你都要说：“他是我的兄弟。”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “四处漂泊”所译的希伯来语动词是使役形式，也可译作“使我流离”或“使我走迷”。这里着重离开父家后居无定所，并不必然表示在道德上误入歧途。
    reason: lexical_alternative
  - marker: b
    text: “恩待”所译的希伯来语词也可表示“慈爱”“忠诚的爱”或“信实的厚意”，具体含义取决于上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: 使我离开父家、四处漂泊
  rationale: 保留使役含义及漂泊不定的语意；结合“离开父家”表达启程和迁徙，避免用“使我迷失”而无端引入道德或方向上的错误。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 尽管词形为复数，语境及其所支配的动词表明所指是亚伯拉罕所信的独一上帝。
- source_word: מִבֵּית אָבִי
  choice: 离开父家
  rationale: “父家”简洁保留家庭、家族和原居之所的含义，符合现代汉语的庄重叙事语体。
- source_word: חַסְדֵּךְ
  choice: 这样恩待我
  rationale: 此处 חֶסֶד 指在人际关系中所施的慈爱、厚意或忠诚；“恩待”与后面的具体请求衔接自然，同时保留关系性的善意。
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: 你要这样恩待我
  rationale: 按汉语习惯把字面的“向我行你的慈爱”整合为“这样恩待我”，并保留请求中带有要求的语气。
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: 每到一个地方
  rationale: 表达原文逐地分配的意思，即他们所到的每一处，而非仅泛指旅行。
- source_word: אִמְרִי לִי
  choice: 提到我说
  rationale: 介词短语按语境指关于亚伯拉罕对别人说；“提到我说”自然表达这一关系。
- source_word: אָחִי הוּא
  choice: 他是我的哥哥
  rationale: 保留亲兄弟称谓而不泛化为“亲属”；按人物关系用“哥哥”比不分长幼的“兄弟”更自然明确。
theological_decisions:
- issue: 谁使亚伯拉罕漂泊
  choice: 上帝使我离开父家、四处漂泊
  alternative: 上帝容许我漂泊；众神使我漂泊
  rationale: 希伯来文以上帝为使役动词的主语，应保留直接的神圣主动性，不软化为单纯许可；同时以“漂泊”避免暗示上帝使亚伯拉罕在道德上误入歧途。上下文支持 אֱלֹהִים 指独一的上帝，而非“众神”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“父家”“恩待”保留经文语体，但避免生硬直译；直接引语层级用中文单双引号清楚标示。
