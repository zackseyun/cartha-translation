source:
  edition: WLC
  text: וְ/גַם אָמְנָ֗ה אֲחֹתִ֤/י בַת אָבִ/י֙ הִ֔וא אַ֖ךְ לֹ֣א בַת אִמִּ֑/י וַ/תְּהִי לִ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: zh_hans
  text: 况且[a]，她确实是我的姊妹，是我父亲的女儿，却不是我母亲的女儿；她成了我的妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“姊妹”不区分姐姐或妹妹。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 况且
  rationale: 连接词与附加语气词在这里引出亚伯拉罕进一步的辩解；“况且”自然体现递进补充的语篇功能。
- source_word: אָמְנָה
  choice: 确实
  rationale: 该副词强调所述情况真实；“确实”既准确又符合庄重、自然的现代汉语表达。
- source_word: אֲחֹתִי
  choice: 我的妹妹
  rationale: 该词本身可泛指姐妹；结合撒拉与亚伯拉罕的年龄及中文亲属称谓习惯，译作“妹妹”自然，但原文没有明确区分长幼，因此加注说明。
- source_word: בַת אָבִי
  choice: 我父亲的女儿
  rationale: 保留原文的同位解释，说明她在何种意义上是亚伯拉罕的姐妹，并与下句形成平行。
- source_word: הִוא
  choice: 她……是
  rationale: 独立代词构成无动词判断句；现代汉语以“是”自然表达其现在仍成立的亲属关系。
- source_word: אַךְ לֹא
  choice: 却不是
  rationale: 此处表示限制和转折；“却不是”清楚保留对前一陈述的限定。
- source_word: בַת אִמִּי
  choice: 我母亲的女儿
  rationale: 与“我父亲的女儿”保持形式和意义上的平行。
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: 后来她成了我的妻子
  rationale: היה 与介词结构表达进入婚姻关系。“成了我的妻子”保留事件性；“后来”使希伯来叙事动词所体现的后续发展在汉语中清楚自然。
theological_decisions:
- issue: 亚伯拉罕与撒拉亲属关系的具体性质
  choice: 按经文直译为同父异母的兄妹关系
  alternative: 将“妹妹”解释为较广义的女性亲属
  rationale: 本节明确使用“我父亲的女儿，却不是我母亲的女儿”，译文应保留这一直接陈述，不借助后来的解释来消解其张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“况且”承接亚伯拉罕的辩解，“确实”传达强调语气；句式尽量保留原文父系与母系说明的平行结构。
