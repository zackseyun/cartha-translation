  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: zh_hans
  text: 亚比米勒又对亚伯拉罕说：“你看到了什么，才做这件事？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你心里是怎么想的，才做这件事？”希伯来文直译为“你看到了什么……？”，“看”在这里也可指所察觉、所考虑或心中所设想的事。
    reason: 说明“看见”的习语含义，并保留较自然的中文替代译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 又……说
  rationale: 承接上一节亚比米勒的发言；“又”自然表达叙事推进和继续追问，而不把连接词处理得过重。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶל־אַבְרָהָם
  choice: 对亚伯拉罕
  rationale: 自然表达说话的对象，并采用通行的人名音译。
- source_word: מָה רָאִיתָ
  choice: 你看到了什么
  rationale: 保留原文“看见”的意象及其可能的习语含义；这里可指亚伯拉罕所察觉、所考虑或心中所设想的事，不直接改译为“为什么”。
- source_word: כִּי עָשִׂיתָ
  choice: 竟做出
  rationale: כִּי把前面的疑问与随后行为连接起来；“竟”在现代汉语中自然呈现质问语气，同时未明确限定为原因或目的。
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: 这件事
  rationale: דָּבָר在此指所做之事；“这件事”贴近原文，也避免“恶事”等带入额外的道德定性。
