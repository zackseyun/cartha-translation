revisions:
- from: 现在，你要把那人的妻子还给他，因为他是先知，他会为你祷告，使你存活。你若不把她还回去，就要知道：你和一切属你的[a]都必死。
  to: 如今，你要把那人的妻子还给他，因为他是先知；他会为你祷告，你就会活。你若不把她还回去，要知道：你和凡属你的人[a]都必死。
  rationale: 修订以“如今”表达话语转折；将“使你存活”改为“你就会活”，避免增添使动施事；将末句改为“凡属你的人”，使死亡警告在汉语中语义通顺，并在脚注中完整交代原文“所有属你的一切”的宽泛范围和另一种可能理解。
