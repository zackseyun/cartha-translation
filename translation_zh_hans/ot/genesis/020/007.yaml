review_pass:
  verdict: revise
  source_fidelity: 正文基本准确传达了归还妻子、亚伯拉罕作为先知代祷，以及拒绝归还将招致死亡的警告。“使你存活”却把 וֶחְיֵה 表述为亚伯拉罕祷告直接‘使’亚比米勒存活，较原文的结果性“你就会活”多了一层明确的使动关系。末句“一切属你的都必死”若按通常汉语理解会把无生命的财物也纳入“死”的谓语，未能恰当处理原文在对象范围上的宽泛性。
  naturalness: “一切属你的都必死”在现代汉语中搭配不自然；改为“凡属你的人都必死”清楚、庄重且符合死亡警告的语境。以脚注保留“所有属你的一切”的较宽泛字面可能。其余行文流畅。
  terminology: “先知”“为你祷告”“必死”均合适，且保持庄重的现代叙事语体。“如今”比单独的“现在”更能自然承载 וְעַתָּה 的话语转折和紧迫性。
