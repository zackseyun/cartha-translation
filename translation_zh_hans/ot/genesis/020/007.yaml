  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: zh_hans
  text: 如今，你要把那人的妻子还给他，因为他是先知；他会为你祷告，你就会活。你若不把她还回去，要知道：你和凡属你的人[a]都必死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡属你的人”原文直译可作“所有属你的一切”，措辞范围宽泛；在此死亡警告及上下文中，可指亚比米勒家中或归属他的人，也不排除泛指他所有的一切。
    reason: 保留 אַתָּה וְכָל אֲשֶׁר לָךְ 的宽泛表述及其在语境中的人员指向，同时避免汉语将“死”直接用于财物所造成的不自然。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换标记，引出紧迫的命令；现代汉语用“现在”简洁自然，也保留当下行动的要求。
- source_word: הָשֵׁב אֵשֶׁת הָאִישׁ
  choice: 把那人的妻子还给他
  rationale: 使役式命令 הָשֵׁב 表示归还、恢复原属关系；补出“给他”使汉语搭配自然，但没有改变明确的所指。
- source_word: כִּי נָבִיא הוּא
  choice: 因为他是先知
  rationale: כִּי 在此说明命令的理由；“先知”直接对应 נָבִיא，并保留亚伯拉罕在此首次被这样称呼的意义。
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: 他会为你祷告
  rationale: 未完成式在此自然表达归还之后将发生的行动；בַּעַדְךָ 表示代求的对象，用普通读者易懂的“为你祷告”。
- source_word: וֶחְיֵה
  choice: 使你存活
  rationale: 该形式字面可有命令或结果意味；结合前句，译作祷告所带来的结果，汉语以“使你存活”清楚表达目的/结果关联。
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: 你若不把她还回去
  rationale: 否定词加分词表示不采取或拒绝采取归还行动；宾语在希伯来文中省略，汉语按上下文补出“她”。
- source_word: דַּע כִּי מוֹת תָּמוּת
  choice: 就要知道：……都必死
  rationale: דַּע 是郑重警告的命令；不定式绝对形与限定动词连用加强必然性，以“必死”凝练传达。
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: 你和一切属你的
  rationale: 保留 אֲשֶׁר לָךְ 的宽泛范围，不在正文中限定为家人、属下或财物；脚注说明其可能范围。
theological_decisions:
- issue: 死亡警告中“你和一切属你的”的范围
  choice: 正文译为宽泛的“你和一切属你的”
  alternative: 你和所有属于你的人／你和你所有的一切
  rationale: 希伯来语表达本身宽泛，可能涵盖亚比米勒家中的人及其所有之物。正文不依据上下文只限定为人，以免消解原文的含混；脚注交代可能范围。
- issue: וֶחְיֵה 与亚伯拉罕祷告之间的关系
  choice: 译为结果/目的性的“使你存活”
  alternative: 你就可以活／你要活下去
  rationale: 该形式形态上可作命令式理解，但语境将存活与先知的代祷相连；“使你存活”保留这种关联，同时不对神如何回应祷告作额外说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“还给他”“为你祷告”“都必死”自然直接；避免古奥的“归还其妻”“代求”“必要死”等表达。
