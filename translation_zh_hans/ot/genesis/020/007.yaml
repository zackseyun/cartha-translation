    rationale: 原文此处以命令式/结果性表达将存活作为归还并接受代祷的后果；“你就会活”保留这一关联，而不把“使之存活”的直接施事明确归于亚伯拉罕。
  - severity: medium
    issue: “你和一切属你的都必死”使“死”在汉语中不自然地施用于可能包括财物的“一切”。
    rationale: אַתָּה וְכָל אֲשֶׁר לָךְ 形式上范围宽泛，但紧邻死亡威胁且叙事语境涉及王的家室。正文宜译作“凡属你的人”，并用脚注说明原文也可作较广义的“所有属你的一切”，从而既保证自然性也不掩盖原文范围问题。
