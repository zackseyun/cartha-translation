base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: zh_hans
  text: 他又对撒拉说：“看哪，我已经给了你兄弟一千银子。看哪，这银子是给你作遮眼之物的[a]，在所有跟你在一起的人面前；在众人面前，你得以澄清[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遮眼之物”也可较直译为“眼目的遮盖”。这可能指一项公开的赔偿，用来遮盖这次冒犯，恢复撒拉的名誉。
    reason: lexical_alternative
  - marker: b
    text: 或译“你得以洗清”；也可能理解为“事情在众人面前就此了结”，甚至“你受了责备”。希伯来语最后一句的句法和含义都不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: 一千银子
  rationale: 原文直译为“一千银”，没有明说货币或重量单位。“一千银子”在现代中文中自然，也避免擅自补入“舍客勒”或“银币”。
- source_word: לְאָחִיךְ
  choice: 给了你哥哥
  rationale: 保留原文“你的兄弟”这一称呼及其与前文所述身份的叙事关联；根据亚伯拉罕与撒拉的年龄关系，用“哥哥”表达自然。
- source_word: כְּסוּת עֵינַיִם
  choice: 遮眼之物
  rationale: 这是含义不确定的希伯来语比喻。正文保留“遮眼”的意象，不直接将其定解为“赔偿”或“恢复名誉”，并在脚注说明可能含义。
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: 在所有跟你在一起的人面前
  rationale: 介词字面可表示“给/对”，但此处很可能强调这项举动的公开性质。译文用“在……面前”使中文通顺，并保留群体见证的语境。
- source_word: וְאֵת כֹּל
  choice: 在众人面前
  rationale: 原文结构压缩且困难；此译法把范围从与撒拉同在的人扩展至众人，同时与下句自然衔接。
- source_word: וְנֹכָחַת
  choice: 你也得以澄清
  rationale: 该词来自יכח的Niphal形式，可理解为被证明清白、得到申明，也可能指受责备。正文采用符合上下文的“得以澄清”，脚注保留其他读法。
