base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: zh_hans
  text: 亚比米勒清早起来，召来他所有的仆人，把这一切事都说给他们听；那些男子就非常害怕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: 清早起来
  rationale: 希伯来语使役词形在此构成“早起”的常用表达，与“在早晨”合译为自然简洁的现代汉语“清早起来”。
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: 召来他所有的臣仆
  rationale: קרא ל־在此有召集之意；עבד指王身边的下属或侍从，译作“臣仆”既保留其从属身份，也避免在上下文没有强调奴隶身份时过度限定。
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 把这一切事说给他们听
  rationale: 该结构表示讲述这些事情；此译符合现代汉语叙事习惯，同时保留内容的完整范围。
- source_word: בְּאָזְנֵיהֶם
  choice: 给他们听
  rationale: 字面为“在他们耳中”，是指让他们亲耳听见的习语；用“说给他们听”自然传达其含义。
- source_word: וַיִּירְאוּ ... מְאֹד
  choice: 都非常害怕
  rationale: ירא在此语境表示因所听之事而惧怕，מאד加强程度，故译为“非常害怕”。
- source_word: הָאֲנָשִׁים
  choice: 众人
  rationale: 字面为“那些男人”，在此回指亚比米勒召来的男性臣仆。汉语“众人”在指称已经明确的群体时自然，不改变所指范围。
