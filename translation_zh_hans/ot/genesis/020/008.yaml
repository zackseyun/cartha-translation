  source_fidelity: 原文明确称恐惧者为“那些男子”（הָאֲנָשִׁים）；草案的“众人”虽汉语自然，却未保留这一明确的男性指称。其余叙事次序及“清早起来、召来、说给他们听、非常害怕”均忠实传达原文。
  naturalness: “清早起来”及后半句的叙事推进自然。“臣仆”稍显文言且可能使现代读者理解为兼具官员与仆役的固定称谓；“仆人”更符合现代汉语，同时足以表达此处王室属下的概称。“那些男子”略具正式叙事色彩，但能自然地保留原文所标出的男性群体。
  terminology: 将 עֲבָדָיו 译为“仆人”不预设其具体法律身份，符合上下文的王室属下语境。保留“男子”以对应 הָאֲנָשִׁים，避免无依据地中性化。
