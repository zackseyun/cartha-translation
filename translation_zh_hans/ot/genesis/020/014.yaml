  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male slaves and female slaves, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: zh_hans
  text: 亚比米勒就取了羊群[a]、牛群、男奴和女奴[b]，送给亚伯拉罕；又把亚伯拉罕的妻子撒拉归还给他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群”所译的希伯来词可泛指绵羊和山羊等小牲畜。
    reason: lexical_alternative
  - marker: b
    text: 原文分别指男性奴仆和女性奴仆。有些译本译作“男仆和女仆”，但本处他们与牲畜一同被转交，译作“男奴和女奴”更能体现当时的社会身份。
    reason: lexical_alternative
  - marker: c
    text: “归还”也可译作“使……回到他那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取了
  rationale: 保留 לקח 的基本含义和连续叙事动作，不增添“带来”等原文未明说的意味。
- source_word: צֹאן
  choice: 羊群
  rationale: צֹאן 是集合名词，可包括绵羊和山羊；“羊群”在现代汉语中自然，也保留其集合意义。
- source_word: בָקָר
  choice: 牛群
  rationale: בָקָר 泛指牛类牲畜；“牛群”与“羊群”并列自然，并体现集合意义。
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: 男奴和女奴
  rationale: 两个词分别指男性与女性的奴仆；本处这些人同牲畜一起被转交，译作“奴”较能如实呈现其受支配的社会身份，并保留性别区分。
- source_word: וַיִּתֵּן
  choice: 送给
  rationale: נתן 基本义为“给”；这里是亚比米勒将所列财物和人口交给亚伯拉罕，“送给”符合现代汉语叙事习惯。
- source_word: וַיָּשֶׁב
  choice: 归还
  rationale: 这是 שוב 的使役形，意为使其返回、交还；“归还”简洁表达撒拉被送回亚伯拉罕身边。
- source_word: אֵת שָׂרָה אִשְׁתּוֹ
  choice: 亚伯拉罕的妻子撒拉
  rationale: 原文“撒拉，他的妻子”中的代词指亚伯拉罕；按现代汉语语序调整后，关系清楚而意义不变。
- source_word: לוֹ
  choice: 给他
  rationale: 代词所指为亚伯拉罕；保留代词可贴近原文，且在本句中指代明确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“男奴和女奴”如实呈现原文用词及本节中的转交情境，不以较委婉的“仆人”淡化其身份；同时以脚注保留词义范围。
