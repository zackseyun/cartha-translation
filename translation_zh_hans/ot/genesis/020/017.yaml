base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: zh_hans
  text: 亚伯拉罕就向上帝祷告；上帝医治了亚比米勒、他的妻子和女仆们[a]，她们就生了孩子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女仆们”所译的希伯来词也可指女奴。
    reason: lexical_alternative
  - marker: b
    text: 直译：她们就生育了。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: 祷告
  rationale: התפלל通常表示“祷告”。上下文虽有代求之意，但动词本身不必明确译成“代求”。
- source_word: אֶל הָאֱלֹהִים / אֱלֹהִים
  choice: 向上帝 / 上帝
  rationale: 此处明确指独一的上帝；现代汉语中“向上帝祷告”自然、准确。
- source_word: וַיִּרְפָּא
  choice: 医治
  rationale: רפא的直接含义是“医治”。这样译保留原文措辞，不具体限定疾病或受损状况。
- source_word: אֶת אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用该人名在现代中文圣经语境中的通行音译。
- source_word: אִשְׁתּוֹ
  choice: 他的妻子
  rationale: 忠实表达单数名词及第三人称男性单数所属关系。
- source_word: אַמְהֹתָיו
  choice: 婢女
  rationale: אָמָה指处于服役或奴役身份的女性。“婢女”简洁保留性别及社会身份色彩，同时以脚注说明其语义范围。
- source_word: וַיֵּלֵדוּ
  choice: 她们就生育了
  rationale: ילד在此为阴性复数，意为“生育、生产”。“她们”明确对应妻子和婢女；“就”自然承接前述医治，却不把希伯来语连接词强行解释为明确的目的关系。
theological_decisions:
- issue: 末句与医治之间的关系
  choice: 译作“她们就生育了”
  alternative: “使她们能够生育”或“所以她们生了孩子”
  rationale: 希伯来语叙事连接词在上下文中表明生育是医治后的结果，但原句仍采用顺接形式。用“就”既呈现叙事结果，又避免把含义收窄为明确的使役、目的或能力恢复表述。
- issue: אָמָה所表达的社会身份
  choice: 正文用“婢女”，脚注说明也可理解为“女奴”
  alternative: “女仆”或“女奴”
  rationale: 该词可指女仆或女奴。正文不淡化其从属身份，脚注则保留更强的奴役含义，避免在语义有弹性时作过度判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亚伯拉罕就向上帝祷告”自然承接上文；分号清楚呈现人的祷告与上帝的医治。“她们”依据希伯来语阴性复数明确指出生育者为妻子和婢女，而不误把亚比米勒包括在内。
