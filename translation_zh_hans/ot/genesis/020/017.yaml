  to: 亚伯拉罕就向上帝祷告；上帝医治了亚比米勒、他的妻子和女仆们[a]，她们就生了孩子[b]。
  rationale: 修订仅改善现代汉语的并列结构、复数明晰度和末句自然度，不改变原文的事件次序或其关于医治与生育的关系。脚注a保留אָמה可指女奴的语义范围；脚注b保留末动词“生育”的较直译表达。
