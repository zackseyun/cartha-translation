id: GEN.20.6
reference: Genesis 20:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: zh_hans
  text: 上帝在那梦中[a]对他说：“我也知道，你做这事时心里纯正；我也拦阻了你，免得你得罪我。因此，我没有容你碰她[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在一个梦中”。希伯来文在此带定冠词，按上下文更可能是指这个特定的梦。
    reason: lexical_alternative
  - marker: b
    text: “碰她”在这里是含蓄的说法，指与她发生性接触。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: 在那梦中
  rationale: 名词前的定冠词指向上文已经展开的那个梦境；译作“那梦”保留其特指性，同时在脚注注明不定读法。
- source_word: גַּם אָנֹכִי
  choice: 我也
  rationale: 两次出现都带有强调意味；以“我也”重复呈现，既自然，又保留原文的呼应。
- source_word: יָדַעְתִּי
  choice: 知道
  rationale: 在直接引语中用现代汉语现在时表达上帝对亚比米勒动机的确认。
- source_word: בְתָם לְבָבְךָ
  choice: 心里纯正
  rationale: תֹּם表示完整、正直或纯正；此译保留道德上的正直之意，却不把它强化为绝对无罪。
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: 我也拦阻了你
  rationale: חָשַׂךְ在此表示抑制、阻止某人去做某事；“拦阻”清楚传达上帝主动制止的含义。
- source_word: מֵחֲטוֹא לִי
  choice: 免得你得罪我
  rationale: 介词מִן与不定式表示阻止某行为发生，לִי在这里表达犯罪所针对的对象，故译为“得罪我”。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 标明后一分句是前述拦阻行动所带来的结果。
- source_word: לֹא נְתַתִּיךָ
  choice: 我没有容你
  rationale: נָתַן接不定式在此表示准许；“没有容你”简洁、庄重，也符合现代汉语表达。
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: 碰她
  rationale: 直译保留原文含蓄克制的措辞；上下文中指性接触，另以脚注说明。
theological_decisions:
- issue: “得罪我”所表达的犯罪对象
  choice: 明确保留这是对上帝的罪
  alternative: 泛化为“犯错”或只理解为伤害撒拉、亚伯拉罕
  rationale: 希伯来文לִי明确让上帝成为这项罪行所针对的对象；译文不淡化这一神学含义，也不在经文之外扩展其教义解释。
- issue: 亚比米勒“心里纯正”的范围
  choice: 保留对其行事动机的肯定
  alternative: 译成绝对的“无罪”或“完全清白”
  rationale: תֹּם在此肯定其内心的正直，但经文本身同时说仍需上帝拦阻他犯罪；译文保留这两者之间的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“上帝”与本项目常用神名风格一致；“拦阻”“没有容你”保持叙事的庄重感。“碰她”刻意保留希伯来文的含蓄表达，并借脚注澄清语境含义。
