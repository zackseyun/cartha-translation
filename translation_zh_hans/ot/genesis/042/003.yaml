  yaml_path: translation/ot/genesis/042/003.yaml
  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: zh_hans
  text: 于是，约瑟的十个哥哥下到埃及去，从那里买粮食[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到埃及去买粮食。”希伯来语直译为“从埃及买粮食”，着重指出粮食的来源。
    reason: 词义与句法上的另一种译法
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 下到埃及去
  rationale: 保留希伯来语“下去”的地理表达；在现代汉语中补出目的地“埃及”，使句子自然清楚。
- source_word: אֲחֵי יוֹסֵף
  choice: 约瑟的哥哥
  rationale: 此处所指十人都是约瑟的兄长；用“哥哥”比泛称“兄弟”更准确，也符合上下文。
- source_word: עֲשָׂרָה
  choice: 十个
  rationale: 直接表达前往埃及的兄长人数。
- source_word: לִשְׁבֹּר
  choice: 买
  rationale: 此动词在饥荒叙事中指购取粮食；现代汉语用“买”简明自然。
- source_word: בָּר
  choice: 粮食
  rationale: 这里指可供食用、交易的谷物；“粮食”是现代普通读者最易理解的对应词。
- source_word: מִמִּצְרָיִם
  choice: 从那里
  rationale: 希伯来语介词表达来源，即从埃及购得粮食；前文已出现“埃及”，以“从那里”保留来源义并避免汉语重复生硬。
theological_decisions: []
