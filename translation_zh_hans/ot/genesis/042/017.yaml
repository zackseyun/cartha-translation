  text: And he put them in custody for three days[a].
translation:
  language: zh_hans
  text: 于是约瑟把他们关押了三天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他们拘禁了三天”。希伯来语动词本义是“聚集、收拢”，但在这里与“看守、拘禁”相关的表达连用，按语境表示把他们置于看守之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 关押
  rationale: אָסַף本义为“聚集、收拢”，但与אֶל־מִשְׁמָר连用时，按语境表示把人集中起来看管，即予以拘禁；“关押”符合现代汉语习惯。
- source_word: אֹתָם
  choice: 他们
  rationale: 阳性复数直接宾语代词，指约瑟的兄弟们。
- source_word: אֶל מִשְׁמָר
  choice: 关押
  rationale: מִשְׁמָר可指看守、拘禁状态或拘禁处；这里译作动词性的“关押”，自然表达进入受看管状态，同时不具体断定是正式监狱。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三天
  rationale: 该短语表示持续时间；汉语以“关押了三天”自然表达这一时段。
