  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: zh_hans
  text: 他们到了迦南地父亲雅各那里[a]，把他们所遭遇的一切都告诉他，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文按字面次序为“到他们父亲雅各那里，向迦南地”。“迦南地”带表示方向的词尾；本译文按汉语习惯将其与“父亲雅各那里”合并表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们来到……到了
  rationale: 未完成式连续体推动叙事向前。汉语用“来到……到了”自然表达行程的终点，并承接“迦南地”和“父亲雅各那里”这两个紧密相关的地点成分。
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: 父亲雅各那里
  rationale: אֶל 表示趋向某人；“到父亲雅各那里”是现代汉语表达前往某人所在之处的自然说法。
- source_word: אַרְצָה כְּנָעַן
  choice: 来到迦南地
  rationale: אֶרֶץ 带方向词尾，表示朝向或进入迦南地。译文保留移动方向，而不是仅把迦南地处理为静态位置。
- source_word: וַיַּגִּידוּ לוֹ
  choice: 都告诉他
  rationale: נגד 的使役形在此指讲述、报告；“告诉他”符合家人叙事的自然语体。“都”与后面的“一切”配合，表达完整报告。
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: 把自己所遭遇的一切
  rationale: קרה 在这里表示临到他们、发生在他们身上的事。“所遭遇的一切”既保留事件临到人的意味，也比逐字译作“所有发生他们的事”自然；“自己”回指前面的众兄弟。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该词引出下一节的直接引语；现代中文以“说：”自然标示引语即将开始。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而流畅的叙事语言。为同时保留原文中“到父亲雅各那里”和“向迦南地去”的双重趋向表达，译作“来到迦南地，到了父亲雅各那里”，避免把方向性的 אַרְצָה 静态化，也避免生硬的逐词排列。
