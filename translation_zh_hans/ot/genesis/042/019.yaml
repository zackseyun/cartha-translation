  text: אִם כֵּנִ֣ים אַתֶּ֔ם אֲחִי/כֶ֣ם אֶחָ֔ד יֵאָסֵ֖ר בְּ/בֵ֣ית מִשְׁמַרְ/כֶ֑ם וְ/אַתֶּם֙ לְכ֣וּ הָבִ֔יאוּ שֶׁ֖בֶר רַעֲב֥וֹן בָּתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: zh_hans
  text: 如果你们是诚实人[a]，你们弟兄中有一人要留在你们被拘禁的地方[b]；你们去，把粮食带回去，供各家度过饥荒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如果你们是说实话的人”。希伯来语这个形容词可指真实、诚实。
    reason: lexical_alternative
  - marker: b
    text: 直译“在你们的拘禁之所”。此处指你们被拘禁的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: 诚实人
  rationale: 此处所考验的是众人所说的是否属实；“诚实人”既自然，也保留了品格与言语真实两方面的含义。
- source_word: אֲחִיכֶם אֶחָד
  choice: 你们兄弟中的一个
  rationale: 明确表达希伯来语从众兄弟中取一人的部分关系。
- source_word: יֵאָסֵר
  choice: 要被关
  rationale: 结合拘禁场景表达被扣押、监禁之意，又不限定为用绳索捆绑。
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: 在拘禁你们的地方
  rationale: 按语境理解后缀所指的是他们目前被拘禁之处；避免把古代设施过度具体化为现代监狱。
- source_word: וְאַתֶּם לְכוּ
  choice: 你们呢，去
  rationale: 用话题结构体现独立代词带出的强调，并与留下的一个兄弟形成对照；连词仍以分号所表达的并列承接关系呈现。
- source_word: שֶׁבֶר
  choice: 粮食
  rationale: 在约瑟叙事的饥荒背景中，此词具体指为赈饥而取得的谷粮。
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: 各家度荒所需的
  rationale: 自然表达各家因饥荒而需要粮食的关系，同时保留“各家”的家庭共同体范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你们呢”保留原文对复数代词的强调；“各家度荒所需的粮食”避免生硬照译“你们各家的饥荒之粮”，同时不把“家”缩窄为仅指直系亲属。
