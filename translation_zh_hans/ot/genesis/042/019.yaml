revisions:
- from: 如果你们是诚实人[a]，你们兄弟中的一个就要被关在拘禁你们的地方[b]；你们呢，去把各家度荒所需的粮食带回去。
  to: 如果你们是诚实人[a]，你们弟兄中有一人要留在你们被拘禁的地方[b]；你们去，把粮食带回去，供各家度过饥荒。
  rationale: 修订仅改善汉语句法和脚注表达。“留在你们被拘禁的地方”在上下文中表达一人被留下受拘禁，未将אָסר限定为身体捆绑；“供各家度过饥荒”自然呈现粮食与各家饥荒需要之间的关系，未增添神学或历史性解释。
