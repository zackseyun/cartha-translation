    rationale: 该短语在汉语中容易先被读作“一个拘禁你们的地方”，而原文此处是在指他们所受拘禁的处所。改为“你们被拘禁的地方”更清楚。
  - severity: low
    issue: 脚注b“在拘禁你们的房子里”不够自然。
