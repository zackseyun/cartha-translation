base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: zh_hans
  text: 吕便对父亲说：“我若不把他带回到你这里，你可以杀死我的两个儿子。把他交在我手里[a]，我一定把他带回到你这里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他托付给我。”原文直译为“把他放在我手上”。
    reason: 说明希伯来语具体意象及其惯用含义，并提供较意译的自然表达。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词；现代汉语叙事中，上下文已足以表达事件推进，直接用“说”自然简洁。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: אֶל אָבִיו
  choice: 对父亲
  rationale: 按关系短语直译；汉语中无需重复所有格“他的”。
- source_word: לֵאמֹר
  choice: 不另译
  rationale: 希伯来语引语公式在汉语直接引语前通常无需重复译作“说道”。
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: 你可以处死我的两个儿子
  rationale: מות的使役式表达“使之死亡、处死”；“可以”在此体现吕便以儿子性命作担保的允准语气，而不把话误读为对父亲的命令。
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: 我若不把他带回到你这里
  rationale: 保留否定条件结构；בוא使役式本义为“带来”，结合便雅悯须平安返回的语境译为“带回”。
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: 把他交在我手里
  rationale: 保留“手”的具体意象，同时“交在……手里”在现代汉语中自然表达托付和负责之意。
- source_word: וַאֲנִי
  choice: 我一定
  rationale: 独立人称代词带有强调意味；以“一定”自然体现吕便亲自承担责任和郑重保证的语气。
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: 把他带回到你这里
  rationale: שוב使役式表示“使返回”，译作“带回”既准确又符合现代汉语习惯。
theological_decisions:
- issue: 吕便话语的法律或誓约力度
  choice: 译作“你可以处死”，呈现他以两个儿子的性命作担保并授权父亲惩处的意思
  alternative: “你要处死”或“处死我的两个儿子”
  rationale: 希伯来语未完成式在条件句前可表达许可、承诺所附后果等语用功能；采用“可以”避免把吕便的话过度确定为直接命令，同时不削弱其极端担保的力度。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。保留希伯来语“手”的意象并以脚注说明其“托付”含义；引语简洁有力，体现吕便郑重而极端的担保。
