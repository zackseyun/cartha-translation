base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: zh_hans
  text: 他们中有一个人在住宿处打开自己的袋子，要拿饲料喂他的驴。他看见自己的银子[a]，不料，银子正在他行囊的开口处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银子”在这里指他先前付出的银钱。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: 打开
  rationale: 采用פתח在叙事中的基本含义，简洁自然。
- source_word: הָאֶחָד
  choice: 他们中有一个人
  rationale: 字面为“那一个”；结合上下文补出“他们中”，明确指兄弟中的一人。
- source_word: שַׂקּוֹ
  choice: 自己的麻袋
  rationale: שַׂק指装载货物的袋子；译作“麻袋”可体现较大的运输用袋，并与后文אַמְתַּחַת有所区别。
- source_word: לָתֵת מִסְפּוֹא לַחֲמֹרוֹ
  choice: 要拿饲料喂驴
  rationale: מִסְפּוֹא是牲畜饲料；按现代汉语习惯将“给驴饲料”自然表达为“拿饲料喂驴”。
- source_word: בַּמָּלוֹן
  choice: 到了住宿处
  rationale: מָלוֹן指旅途中住宿或过夜的地点，不一定是经营性的客店；“住宿处”避免过度具体化。
- source_word: כַּסְפּוֹ
  choice: 自己的银子
  rationale: כֶּסֶף本义为“银”，在此指他先前用来付款的银钱；正文保留具体的“银子”。
- source_word: וְהִנֵּה
  choice: 不料
  rationale: הִנֵּה在此突出突然发现和意外；“不料”比直译“看哪”更符合现代汉语叙事，同时保留惊讶语气。
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: 就在他的行囊口
  rationale: פֶּה字面为“口”，用于容器时指开口；“行囊口”既保留希伯来语意象，也清楚表明位置。אַמְתַּחַת译为“行囊”，与前面的שַׂק“麻袋”保持词语区别。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“麻袋”和“行囊”体现原文两个不同的容器词；不沿用英文咨询层脚注a所列的错位替代说法，因为该说法并非בַּמָּלוֹן的词义。
