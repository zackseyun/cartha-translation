  rationale: 修订仅消除无原文根据的材质限定，并改善地点短语和容器开口的汉语表达；保留原文的叙事次序、意外发现语气，以及两个容器词的区别。英文审计记录中关于“开口”的替代说明与其标注位置不一致，因此未将该错位说明引入中文脚注。
