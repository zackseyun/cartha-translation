base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: zh_hans
  text: 那人，就是那地的主，对我们说：‘我要由此知道你们是诚实的：把你们的一个兄弟留在我这里，带上粮食去应付你们各家的饥荒[a]，然后走吧。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译近于“带走你们各家的饥荒”。这里的表达有省略，结合上下文，意思是带走粮食或口粮，以应付各家的饥荒。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: 那人，就是那地的主
  rationale: 保留“那人”及其后的同位说明“那地的主”，自然表达其在当地的最高权势；“主”在此是身份称谓，并非神圣称号。
- source_word: בְּזֹאת אֵדַע
  choice: 我要由此知道
  rationale: בְּזֹאת表示判断所依据的办法或凭据，未完成式אֵדַע在条件性语境中指将来的结果。
- source_word: כֵנִים
  choice: 诚实人
  rationale: 本叙事中该词与“奸细”相对，指为人真实可靠、所言不虚；“诚实人”符合现代汉语习惯。
- source_word: אֲחִיכֶם הָאֶחָד
  choice: 你们的一个兄弟
  rationale: 表达从众兄弟中选留一人，避免生硬直译为“你们那一个兄弟”。
- source_word: הַנִּיחוּ אִתִּי
  choice: 留在我这里
  rationale: הניח的使役式在此指让某人留下；配合前面的宾语译为“把……留在我这里”。
- source_word: וְאֶת רַעֲבוֹן בָּתֵּיכֶם קְחוּ
  choice: 带上粮食，解你们各家的饥荒
  rationale: 原文直译近于“带走你们各家的饥荒”，属于语义省略；结合购买粮食的上下文，补明“粮食”，同时以脚注保留原文特殊表达。
- source_word: וָלֵכוּ
  choice: 然后走吧
  rationale: 保留命令语气及动作次序；句末“吧”使直接引语在现代汉语中自然而不失庄重。
