base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/014.yaml
  text: Joseph said to them[a], “It is as I said to you, saying[b], ‘You are spies.’”
translation:
  language: zh_hans
  text: 约瑟对他们说：“我先前对你们说的正是这话：‘你们是探子。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的 wayyiqtol 形式；现代汉语自然地用“说”，不必机械译出连接词。
- source_word: אֲלֵהֶם
  choice: 对他们
  rationale: 直接表达介词与第三人称复数后缀，指出约瑟说话的对象。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הוּא אֲשֶׁר
  choice: 正是这话
  rationale: 保留代词加关系词所形成的强调语气，突出约瑟正在重申先前所说的话。
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: 我先前对你们说的
  rationale: דבר 在此指向带有具体内容的发言；“先前”由上下文和完成式所指的既往言语自然体现。
- source_word: לֵאמֹר
  choice: 冒号引出直接引语
  rationale: 该不定式用于引出所说内容；中文以冒号表达其功能，比“说着”或“说道”更自然，也避免重复。
- source_word: מְרַגְּלִים אַתֶּם
  choice: 你们是探子
  rationale: 分词在此作名词性谓语，独立代词带有明确指认作用；“探子”准确表达侦察他国情报之人。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“正是这话”保留原文 הוּא אֲשֶׁר 的强调；以冒号承载 לֵאמֹר 引出引语的功能，避免生硬的“说……说”。
