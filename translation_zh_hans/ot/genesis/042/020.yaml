  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: zh_hans
  text: 把你们最小的兄弟带到我这里来，使你们的话得到证实[a]；这样你们就不至于死。”他们就这样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得到确认”或“被相信”。希伯来语动词可指某事被确立为真实，也可指某人或某事被视为可信；此处语境较倾向于“得到证实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: 你们的小弟
  rationale: הַקָּטֹן本义为“年幼的、小的”；在兄弟关系和便雅悯的叙事语境中，“小弟”自然表达最年幼的兄弟。
- source_word: תָּבִיאוּ אֵלַי
  choice: 带到我这里来
  rationale: 使役词形表达“带来”，אֵלַי明确指向说话者；中文用“到我这里来”自然保留方向。
- source_word: וְיֵאָמְנוּ דִבְרֵיכֶם
  choice: 使你们的话得到证实
  rationale: אמן的被动词形在此表示被确立为真实、得到证实；主语是“你们的话”。调查和试验的语境支持“得到证实”，而不只是主观上“被相信”。
- source_word: וְלֹא תָמֻתוּ
  choice: 你们也不至于死
  rationale: 保留与前句相连的结果或后果关系，并自然传达遵命便可免死的含义。
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 他们就照样做了
  rationale: 自然对应希伯来叙事惯用语，表达他们按所吩咐的去做。
