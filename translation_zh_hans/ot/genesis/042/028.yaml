source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: zh_hans
  text: 他对弟兄们说：“我的银子退回来了；看，竟然就在我的袋子里！”他们顿时失去了勇气[a]，战战兢兢地彼此说[b]：“上帝这是对我们做了什么事？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的心都慌了。”原文直译为“他们的心出去了”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“各人对自己的兄弟说”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: 退回来了
  rationale: 这是שׁוב的使役被动式，表示银子被退还；“退回来了”既保留被动结果，也自然表达人物刚发现的状态。
- source_word: כַּסְפִּי
  choice: 我的银子
  rationale: כֶּסֶף既可指银，也可泛指钱；此处保留具体的“银子”，符合古代交易背景。
- source_word: אַמְתַּחְתִּי
  choice: 我的袋子里
  rationale: 指装粮食或行路用品的袋子；“袋子”在现代汉语中自然清楚，又不添加原文未明说的用途。
- source_word: וְגַם הִנֵּה
  choice: 看，竟然就在
  rationale: “看”传达הִנֵּה的指示作用，“竟然”表现גַם在此处所加强的惊讶语气。
- source_word: וַיֵּצֵא לִבָּם
  choice: 他们的心顿时沉了下去
  rationale: 原文直译是“他们的心出去了”，表示勇气消失、内心惊惧；“心沉了下去”保留心的意象，并符合现代汉语表达。
- source_word: וַיֶּחֶרְדוּ
  choice: 都战兢起来
  rationale: חרד兼有因恐惧而发抖和惊慌之意；“战兢”保留身体与心理两方面的力度。
- source_word: אִישׁ אֶל־אָחִיו
  choice: 彼此
  rationale: 原文逐字为“各人对他的兄弟”，在全是男性兄弟的语境中，“彼此”自然表达其分配和相互含义；直译形式收入脚注。
- source_word: מַה־זֹּאת
  choice: 这是什么事
  rationale: 保留原文直接而惊愕的“什么”问句，不改写成解释性的“为什么”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 尽管词形为复数形式，本句语法及叙事语境都指独一的神；“上帝”是现代标准汉语中庄重、清楚的表达。
theological_decisions:
- issue: 兄弟们惊惧问话中אֱלֹהִים的所指
  choice: 上帝
  alternative: 神；诸神
  rationale: 句法和叙事语境支持单数所指。“上帝”保留他们承认神圣作为的意思，却不补充经文没有说明的神学解释。
- issue: אִישׁ אֶל־אָחִיו的男性亲属措辞
  choice: 正文译为“彼此”，脚注注明“各人对自己的兄弟”
  alternative: 各人对自己的兄弟
  rationale: 上下文已经明确说话者都是弟兄，因此“彼此”并未中和人物性别；正文更自然，脚注则保存原文的男性单数和亲属表达。
- issue: “上帝对我们做的这是什么事”所表达的神圣施事
  choice: 保留上帝为施事者的直接问句
  alternative: 我们为什么会遇到这种事
  rationale: 原文明说是上帝“做”了此事。译文保留人物在恐惧中的判断，不把它弱化为无明确施事者的遭遇，也不解释上帝这样做的原因。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“银子”“战兢”保留古代背景和经文语体，但句法保持自然；惊叹与问句保留人物突然发现银子后所感到的震惊和神学张力。
