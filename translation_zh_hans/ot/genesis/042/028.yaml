  to: 他对弟兄们说：“我的银子退回来了；看，竟然就在我的袋子里！”他们顿时失去了勇气[a]，战战兢兢地彼此说[b]：“上帝这是对我们做了什么事？”
  rationale: 修订以“失去了勇气”直接传达“心出去了”在本语境中的习语义，并保留脚注中的字面表达及可行的汉语替代译法。“战战兢兢地彼此说”保留恐惧战栗和相互说话两个动作。末句仅作语序调整，仍将上帝明示为行动者，并保留“什么事”的开放式惊问，不解释其原因。
