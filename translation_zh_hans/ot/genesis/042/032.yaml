base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: zh_hans
  text: 我们兄弟十二人，都是我们父亲的儿子。一个不在了[a]，最小的今天和我们的父亲一起在迦南地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“一个不在”；这个希伯来惯用语可以表示那人失踪、离去，或被认为已经死了。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: 我们兄弟十二人
  rationale: 按希伯来语无系词句理解为“我们是十二个兄弟”；中文采用简洁自然的数量表达，同时保留“兄弟”的亲生手足语境。
- source_word: בְּנֵי אָבִינוּ
  choice: 都是我们父亲的儿子
  rationale: 保留原文同位说明及“我们父亲”的措辞；加“都是”使现代汉语衔接自然，并未改变所指范围。
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: 一个不在了
  rationale: 尽量保留希伯来惯用语的含混性，既可表达不在、失踪或离去，也不明确断言已经死亡。
- source_word: וְהַקָּטֹן
  choice: 最小的
  rationale: 在兄弟排行的语境中，קָטֹן 指最年幼者；“最小的”自然且避免重复补出“弟弟”。
- source_word: הַיּוֹם
  choice: 如今
  rationale: 原义为“今天”，此处也可表示当前状况；“如今”在中文叙述中自然，并保留现时意义。
- source_word: אֶת אָבִינוּ
  choice: 同我们的父亲
  rationale: 此处 אֶת 表伴随，译作“同……在”准确而庄重。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 明确保留 אֶרֶץ“地、土地”，采用中文圣经地名的通行形式“迦南地”。
theological_decisions:
- issue: אֵינֶנּוּ 是否明确表示死亡
  choice: 译为“一个不在了”，不明确断言死亡
  alternative: “一个已经死了”或“一个没有了”
  rationale: 兄长们以为约瑟已死，但希伯来原文本身使用可指缺席、失踪或不复存在的惯用语；译文应保存这一叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们兄弟十二人”简洁自然；“一个不在了”刻意保留原文含混；“如今同我们的父亲在迦南地”保留现时性及“迦南地”的完整地理表达。
