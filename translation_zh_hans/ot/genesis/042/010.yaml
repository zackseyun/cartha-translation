  text: וַ/יֹּאמְר֥וּ אֵלָ֖י/ו לֹ֣א אֲדֹנִ֑/י וַ/עֲבָדֶ֥י/ךָ בָּ֖אוּ לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: zh_hans
  text: 他们却对他说：“不，我主，你的仆人是来买食物[a]的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“粮食”。希伯来文作“食物”，但在饥荒的语境中，这里所指的很可能是粮食。
    reason: 说明原词的宽泛词义及其在当前语境中较具体的可能所指。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们却对他说
  rationale: 叙事连接词在此承接前文，同时引出对约瑟指控的反驳；用“却”自然表达语境中的转折。“对他说”准确体现 אֵלָיו 的受话对象。
- source_word: לֹא
  choice: 不
  rationale: 在直接引语中构成明确而简洁的否认，符合现代汉语表达。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 保留对高位官员的恭敬称呼和双方社会地位的差别；比“先生”更能体现原文的臣服语气，又不把它误解为神圣称号。
- source_word: וַעֲבָדֶיךָ
  choice: 你的仆人
  rationale: 这里是对权贵说话时谦卑的自称，并非宣称自己具有奴隶身份；“你的仆人”既保留原文意象，也符合庄重语体。
- source_word: בָּאוּ
  choice: 是来……的
  rationale: 汉语“是来……的”自然说明他们此行的目的，并保留动作已经发生且与当前处境相关的意味。
- source_word: לִשְׁבָּר
  choice: 买
  rationale: 该动词在饥荒和埃及配粮的语境中指购买粮食；因原文另有宾语 אֹכֶל，正文译作“买”即可。
- source_word: אֹכֶל
  choice: 食物
  rationale: 该词本义较广，指可吃的东西；上下文虽很可能特指粮食，正文仍采用较宽泛的“食物”以保存原文措辞，并用脚注说明语境义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主”和“你的仆人”保留兄弟们面对埃及高官时恭敬、谦卑的语气；“是来……的”使直接引语符合自然的现代汉语。脚注标记紧接其所解释的“食物”。
