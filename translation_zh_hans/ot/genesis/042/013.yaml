base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: zh_hans
  text: 他们说：“我们，你的仆人，是十二兄弟，都是迦南地一个人的儿子。看哪，最小的儿子如今和我们的父亲在一起，另一个不在了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“另一个不在”；这是一种委婉说法，可以表示“已经不见了”，也可能暗示已经死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 承接希伯来叙事中的连续式动词，汉语无需机械添加“于是”也能自然推进叙事。
- source_word: עֲבָדֶיךָ
  choice: 我们这些仆人
  rationale: 这是兄弟们面对埃及掌权者时的谦称，并非陈述受奴役身份；“仆人”既保留字面意象，也符合语境中的恭敬口吻。
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: 我们……本是十二兄弟
  rationale: 保留人数和兄弟关系；“本是”自然带出他们对共同家庭身份的申明。
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: 同一个人的儿子
  rationale: 保留原文明确的男性亲属用语和“同一位父亲所生”的重点，不泛化为“孩子”。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 迦南地
  rationale: 保留 אֶרֶץ“地、地域”，并采用现代中文圣经地名的自然表达。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意、引出当前情况的呈现功能，同时维持庄重的叙事语体。
- source_word: הַקָּטֹן
  choice: 小儿子
  rationale: 语境中指十二兄弟中最年幼者；中文“小儿子”在家庭语境中自然表达最幼的儿子。
- source_word: אֶת אָבִינוּ
  choice: 和我们的父亲在一起
  rationale: 此处 אֶת 表伴随，不是直接宾语标记；译文明确表达陪伴关系。
- source_word: הַיּוֹם
  choice: 如今
  rationale: 原词直义为“今日”，此处侧重当前状况；“如今”在现代汉语叙事中更自然，且不改变时间指向。
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: 另一个已经不在了
  rationale: 保留“一个不在”的委婉说法，可指失踪、不复同在，也可暗示死亡，不把原文含混性强行解释为已经死亡。
theological_decisions:
- issue: 亲属称谓中的性别信息
  choice: 同一个人的儿子
  alternative: 同一个人的孩子
  rationale: 原文 בְּנֵי 是阳性复数，并且叙事所指确为雅各的众子，因此保留“儿子”更准确。
- issue: “一个不在了”对约瑟处境的含混表达
  choice: 另一个已经不在了
  alternative: 另一个已经死了
  rationale: 原文没有直接断言死亡，而以 אֵינֶנּוּ 委婉表达其不复在场或已失去；译文保留兄弟们话语中的叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”略带经文语体，用以对应 הִנֵּה 的提示功能；其余句法尽量自然，避免生硬仿照希伯来语序。
