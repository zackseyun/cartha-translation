  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: zh_hans
  text: 我们都是同一个父亲的儿子。我们是诚实人；你的仆人不是奸细[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不是奸细”也可译作“没有当过奸细”或“从未做过奸细”。希伯来语这一结构可侧重否认他们是奸细的身份，也可侧重否认他们从事过这种活动。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: 我们全都
  rationale: 表达说话群体无一例外，并以自然的现代汉语语序保留整体强调。
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: 同一个人的儿子
  rationale: 直译为“一个人的儿子们”；上下文是男性兄弟共同申辩，因此保留“儿子”，并用“同一个人”清楚表达他们出自同一位父亲。
- source_word: כֵּנִים
  choice: 诚实人
  rationale: 该词在这里指可靠、真诚、不是心怀诡诈的人；“诚实人”符合现代汉语中受指控者自证清白的语境。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 这里是臣下对掌权者的谦卑自称，不着重表达受奴役的法律身份，故译作“仆人”。
- source_word: מְרַגְּלִים
  choice: 奸细
  rationale: 在被指控窥探国情的敌对语境中，“奸细”比中性的“侦察员”更准确，也比“间谍”更符合这段古代宫廷对话的庄重语体。
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: 并没有当过奸细
  rationale: היה与分词的结构否认他们具有或曾从事奸细的身份与活动；“没有当过”在汉语中自然表达这一申辩，同时以脚注保留时态表达的其他可能。
