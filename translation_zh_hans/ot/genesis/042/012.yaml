base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/012.yaml
  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: zh_hans
  text: 他却对他们说：“不！你们来，是要看[b]这地的赤裸之处[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这地暴露的地方”或“这地不设防的地方”。希伯来语直译为“这地的赤裸之处”，是指可能被入侵者或探子利用的薄弱地带。
    reason: lexical_alternative
  - marker: b
    text: 或译“窥探”。希伯来语动词本义是“看”，但在上下文中，约瑟指控他们前来侦察。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 他却对他们说
  rationale: 叙事性连接词 וַ 在此承接上文，同时约瑟的话反驳众兄弟先前的否认，因此用“却”自然表达语篇中的转折；אֲלֵהֶם 译为“对他们”。
- source_word: לֹא כִּי
  choice: 不！
  rationale: לֹא 是对上文说法的断然否定，כִּי 引出随后的纠正性指控。现代汉语以独立而有力的“不！”配合后句，能自然传达“不，并非如此；而是……”的语气，而不强加单一连接词释义。
- source_word: עֶרְוַת הָאָרֶץ
  choice: 这地的赤裸之处
  rationale: עֶרְוָה 本义为“赤裸、裸露”，此处以比喻指土地暴露、薄弱而可能受攻击之处。正文保留原文鲜明且略带张力的意象，并以脚注说明语境含义。
- source_word: בָּאתֶם לִרְאוֹת
  choice: 你们来，是要看
  rationale: בָּאתֶם 表示他们已经来到这里；目的不定式 לִרְאוֹת 本义是“看”。用“来，是要看”符合现代汉语目的结构，同时保留原文没有直接使用“侦察”一词这一点。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“赤裸之处”有意保留希伯来文的具体比喻；“看”保留原词的基本意义，相关侦察含义交由上下文及脚注说明。感叹号体现 לֹא 的 abrupt、强烈反驳语气。
