- from: 流便回答他们说：“我不是对你们说过：‘不要对那孩子犯罪’吗？可是你们不听。现在，看哪，他的血也被追讨了。[a]”
  to: 流便回答他们说：“我不是曾对你们说过：‘不要对那孩子犯罪’吗？可是你们没有听。现在，看哪，他的血也正在被追讨。”
  rationale: 修订仅调整时体和汉语表达：以“曾”“没有听”对应回顾性的过去劝告与拒绝听从，并以“正在被追讨”对应原文被动分词的当前状态。保留“对那孩子犯罪”“看哪”“他的血”及无施事者被动句，不添加原文未明说的追讨者。
