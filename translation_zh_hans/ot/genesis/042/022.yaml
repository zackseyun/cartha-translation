base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: zh_hans
  text: 流便回答他们说：“我不是曾对你们说过：‘不要对那孩子犯罪’吗？可是你们没有听。现在，看哪，他的血也正在被追讨。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶחֶטְאוּ בַיֶּלֶד
  choice: 对那孩子犯罪
  rationale: 保留“犯罪/犯了罪”的道德与神学分量，也准确表达介词 ב 在此所指向的受害对象；不弱化为仅仅“伤害”或“得罪”。
- source_word: בַיֶּלֶד
  choice: 那孩子
  rationale: יֶלֶד 在本段是哥哥们对约瑟的称呼；“那孩子”自然，并保留原文带定冠词的指称。
- source_word: וְגַם
  choice: 也
  rationale: 保留递进性的“也”，把当前追讨血责与他们先前不听劝告相连。
- source_word: דָמוֹ הִנֵּה נִדְרָשׁ
  choice: 看哪，他的血也被追讨了
  rationale: “看哪”保留 הִנֵּה 的强调；“他的血”保留原文具体意象；被动式“被追讨”不擅自明说追讨者，同时传达为流血死亡追究责任的含义。
theological_decisions:
- issue: 追讨约瑟之血的施事者是否明说为上帝
  choice: 保留无施事者的被动表达“被追讨了”
  alternative: “上帝正在追讨他的血债”
  rationale: 希伯来文使用被动分词而未明说施事者。上下文可让读者理解为神圣报应，但译文不应把隐含理解直接写入正文。
- issue: “犯罪”是否弱化为一般性的伤害
  choice: 译作“对那孩子犯罪”
  alternative: “不要伤害那孩子”
  rationale: חטא 明确具有犯罪、犯错之义；保留这一用语可呈现流便对兄弟行为的道德定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”略带经文庄重色彩，用来体现原文 הִנֵּה 的强调；引语层次以中文单双引号清楚区分。
