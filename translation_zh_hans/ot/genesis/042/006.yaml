revisions:
- from: 约瑟是治理那地的人；把粮食卖给那地众民的也是他。约瑟的哥哥们来了，脸伏于地，向他下拜[a]。
  to: 约瑟是那地的统治者；他把粮食卖给那地所有的人。约瑟的哥哥们来到了，脸伏于地，向他下拜[a]。
  rationale: 修改仅为提升现代汉语的自然度和源语对应的直接性：“那地的统治者”准确表达约瑟的权柄而不虚构具体官职；“那地所有的人”自然表达当地全体民众。保留“哥哥们”，因叙事上下文明确他们为约瑟的年长兄弟；保留“脸伏于地，向他下拜”以呈现原文的姿态与敬礼动作。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:25:25Z'
