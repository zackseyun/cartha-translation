base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: zh_hans
  text: 约瑟是那地的统治者；他把粮食卖给那地所有的人。约瑟的哥哥们来到了，脸伏于地，向他下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“俯伏在他面前”。希伯来语动词可指深深躬身或俯伏，以表示敬意和臣服。
    reason: 说明“下拜”所译希伯来语动词可涵盖深度躬身或完全俯伏，并保留非宗教性敬礼的词义选择。
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: 治理那地的人
  rationale: 该词指掌握权柄、实行统治的人。译作“治理那地的人”既表达约瑟的统治地位，又不把它限定为原文没有明说的具体官衔。
- source_word: עַל הָאָרֶץ
  choice: 治理那地
  rationale: 此处 אֶרֶץ 指叙事中的埃及，而非全世界；“那地”保留上下文指向，也符合《创世记》的叙事用语。
- source_word: הַמַּשְׁבִּיר
  choice: 把粮食卖给……的
  rationale: שׁבר 的使役分词在饥荒和购粮语境中指售粮；补出语境中隐含的“粮食”，可使现代汉语清楚自然。
- source_word: לְכָל עַם הָאָרֶץ
  choice: 给那地众民
  rationale: עַם 是集合单数，译作“众民”；הָאָרֶץ 在此仍指当地，即埃及。
- source_word: אֲחֵי יוֹסֵף
  choice: 约瑟的哥哥们
  rationale: 这些人是约瑟的年长兄弟；“哥哥们”在现代汉语中准确、自然地表达人物关系。
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: 向他下拜
  rationale: שׁחה 表示俯身敬礼或俯伏。“下拜”表达对掌权者的深度敬礼，却不将此举误解为对神的敬拜。
- source_word: אַפַּיִם אָרְצָה
  choice: 脸伏于地
  rationale: 该习语描写脸朝地面的俯伏姿势；“脸伏于地”简洁而清楚地保留其强烈的身体动作。
- source_word: וְ
  choice: 句首不另译连接词
  rationale: 希伯来语叙事连接词在此承接上下文；现代汉语可直接起句，无须机械加上“于是”或“那时”。
theological_decisions:
- issue: 约瑟的哥哥们向他所行之礼的性质
  choice: 向他下拜
  alternative: 俯伏在他面前；敬拜他
  rationale: 本场景描写臣服和尊敬，也呼应约瑟先前的梦，但没有说明这是把约瑟当作神来敬拜。“下拜”保留动作及其尊卑含义，不作超出原文的神学判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“治理那地的人”避免过度指定官衔；“众民”凝练地表达集合意义；“脸伏于地，向他下拜”保留原文姿态与敬礼动作。脚注标记紧接相关短语。
