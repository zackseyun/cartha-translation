  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: zh_hans
  text: 但雅各没有让约瑟的弟弟便雅悯跟哥哥们一起去，因为他说：“免得灾祸[a]临到他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不测临到他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: 但
  rationale: וְ承接上文，同时与其他儿子已经前往形成转折；汉语用“但”自然呈现这一对比。אֶת是宾语标记，不另译。
- source_word: בִּנְיָמִין
  choice: 便雅悯
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֲחִי יוֹסֵף
  choice: 约瑟的弟弟
  rationale: 原文直义是“约瑟的兄弟”；按叙事中的年龄关系，现代汉语自然地说“弟弟”，并保留此处借约瑟来特别指明便雅悯的作用。
- source_word: לֹא שָׁלַח
  choice: 没有让……去
  rationale: שׁלח基本义为“派遣、送去”。在父亲不准儿子随兄长前往的语境中，“没有让……去”比生硬的“没有派”更符合现代汉语。
- source_word: אֶת אֶחָיו
  choice: 跟哥哥们一起去
  rationale: 原句表达便雅悯未与众兄长同行；汉语补出“跟……一起去”可清楚呈现关系。按家庭次序，此处用“哥哥们”自然准确。
- source_word: כִּי אָמַר
  choice: 因为他说
  rationale: כִּי说明雅各不让便雅悯同行的原因；אָמַר直译为“说”，不改作较具解释性的“想”。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן引出所担心的可能后果。“免得”简洁、庄重，也保留忧惧和防范的语气。
- source_word: יִקְרָאֶנּוּ אָסוֹן
  choice: 他遭遇不测
  rationale: 这是“灾祸临到他”的习语表达。“遭遇不测”在现代汉语中自然，并保留 אָסוֹן 所指严重伤害、灾祸或意外的不确定范围。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式清楚体现上文的转折和雅各因惧怕灾祸而作出的决定；不把“不测”具体限定为死亡或某一种伤害。
