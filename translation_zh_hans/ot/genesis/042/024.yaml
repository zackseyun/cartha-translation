base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: zh_hans
  text: 约瑟转身离开他们，哭了。随后，他回到他们那里，向他们说话；又从他们中间带走西缅，当着他们的面把他捆绑起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: 转身离开他们
  rationale: סבב表示转身，מֵעֲלֵיהֶם在此表示离开他们所在之处；合译既保留身体动作，也自然表达约瑟暂时避开众人。
- source_word: וַיֵּבְךְּ
  choice: 哭了起来
  rationale: בכה指哭泣；“哭了起来”符合现代汉语叙事，也传达动作的发生。
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: 回到他们那里
  rationale: שׁוב表示返回，אֲלֵהֶם指向他们；此译清楚承接约瑟先前离开的动作。
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: 对他们说话
  rationale: 按原文直译为向他们说话；经文没有交代所说的具体内容，因此不作补充。
- source_word: וַיִּקַּח מֵאִתָּם אֶת־שִׁמְעוֹן
  choice: 把西缅从他们中间带出来
  rationale: לקח在这里是把人带走，מֵאִתָּם表示从这群人当中；此译明确西缅被从兄弟中带出，又不额外推断原因。
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: 捆绑起来
  rationale: אסר的基本义是捆绑、约束；采用具体动作，不扩大解释为监禁。
- source_word: לְעֵינֵיהֶם
  choice: 当着他们的面
  rationale: 字面与“在他们眼前”相近；“当着他们的面”是自然、庄重的现代汉语，并保留此举公开可见的强调。
theological_decisions: []
translation_notes:
  register: 采用清楚、庄重的现代叙事语体。以两个句子呈现动作次序，避免机械重复连词；不补述约瑟哭泣的原因，也不解释他选择西缅的动机。
