  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: zh_hans
  text: 雅各看见埃及有粮食，就对儿子们说：“你们为什么还彼此观望呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们为什么显露自己？”这个希伯来语动词也可作此理解；但按本处语境，更可能是指兄弟们迟疑不决，彼此观望。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见……就
  rationale: 连续式叙事形式推进情节；用“看见……就”自然表达雅各得知情况后随即说话的关系。
- source_word: כִּי יֶשׁ
  choice: 有
  rationale: כִּי引出雅各所察知的内容，יֶשׁ表示存在；现代汉语以“有”简洁表达。
- source_word: שֶׁבֶר
  choice: 粮食
  rationale: 本段饥荒及赴埃及购买的语境表明，此词指可供购买的谷粮；“粮食”在现代汉语中自然，也比泛称“食物”更贴合语境。
- source_word: בְּמִצְרָיִם
  choice: 埃及
  rationale: 介词בְּ在此表示地点；汉语存在句“埃及有粮食”无需另加“在”。
- source_word: לְבָנָיו
  choice: 对儿子们
  rationale: בָּנִים在此具体指雅各的众子；保留男性亲属称谓及复数含义。
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接、自然地保留疑问语气。
- source_word: תִּתְרָאוּ
  choice: 还彼此观望
  rationale: ראה的Hitpael形式在此最可能表达众兄弟相互观看、迟疑不动；“彼此观望”兼顾相互性和语境中的犹豫，“还”则自然传达责问中持续不行动的意味。
