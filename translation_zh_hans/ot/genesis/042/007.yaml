base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: zh_hans
  text: 约瑟看见哥哥们，就认出了他们，却在他们面前装作陌生人[a]，并且严厉地对他们说话。他问他们：“你们从哪里来？”他们回答：“我们从迦南地来，要买食物[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己在他们面前显得认不出来。”希伯来语可指把自己表现成一个外人或他们不认识的人，并不一定指改变外貌或穿着来乔装。
    reason: lexical_alternative
  - marker: b
    text: 或译：“买粮食。”在这场饥荒的语境中，这个希伯来语动词常特指购买粮食，不过这里的名词含义更广，是“食物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: 约瑟看见哥哥们
  rationale: 顺应希伯来叙事时序自然起句；此处所指是约瑟年长的男性手足，按上下文译作“哥哥们”比泛称“兄弟们”更准确自然。
- source_word: וַיַּכִּרֵם
  choice: 就认出了他们
  rationale: נכר的使役词干在此表示辨认、认出；“认出”准确传达约瑟识别出他们的意思。
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: 却在他们面前装作陌生人
  rationale: נכר的Hitpael词形表达约瑟向他们把自己表现为陌生、未知之人，不必然指外貌或服装上的乔装；此译保留关系层面的含义。
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: 并且严厉地对他们说话
  rationale: קָשׁוֹת在此描述说话的严厉方式；“严厉地对他们说话”符合现代汉语，也保留原文的强硬语气。
- source_word: מֵאַיִן בָּאתֶם
  choice: 你们从哪里来？
  rationale: 直接表达对来处的询问，现代汉语自然清楚。
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: 我们从迦南地来
  rationale: 保留原文“迦南地”的正式地理称呼；补出汉语对话中自然的主语“我们”。
- source_word: לִשְׁבָּר אֹכֶל
  choice: 要买食物
  rationale: שבר在饥荒叙事中常指购买粮食，而אֹכֶל本身含义较广，为“食物”；正文采用较宽泛的“食物”，脚注说明语境中的具体可能性。
