  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: zh_hans
  text: 你们要从你们中间派一个人去，让他把你们的兄弟带来；其余的人要被拘禁，好检验你们的话，看你们是否说的是真话[a]。否则，我指着法老的性命起誓[b]，你们必是奸细！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“看真理是否与你们同在。”意思是看你们所说的是否真实。
    reason: lexical_alternative
  - marker: b
    text: “指着法老的性命起誓”是以法老的生命为凭的誓言格式。
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: 你们要从中派一个人去
  rationale: 复数祈使式加“从你们中一个人”，表示从众人中选派一人；译文自然保留命令语气。
- source_word: וְיִקַּח אֶת־אֲחִיכֶם
  choice: 让他把你们的弟弟带来
  rationale: לקח通常意为“拿、带”，此处是去接弟弟并带到约瑟面前，译作“带来”最符合语境中的方向。
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: 其余的人要被拘禁
  rationale: אסר的尼法勒祈使式表达被捆绑或被羁押；这里指留下的人受监禁。“其余的人”按上下文明确“你们”中除被派者以外的人。
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: 好检验你们的话
  rationale: בחן的尼法勒式表示受到检验；“你们的话”保留希伯来文表达，不将其过度解释为“说法”或“故事”。
- source_word: הַאֱמֶת אִתְּכֶם
  choice: 看你们是否说的是真话
  rationale: 原文直译为“真理/实情是否与你们同在”，此处是判断他们所说是否真实；中文采用自然表达，并以脚注保留原文意象。
- source_word: חֵי פַרְעֹה
  choice: 我指着法老的性命起誓
  rationale: 这是以法老生命为凭的誓言格式；此译明确其文化和语用功能。
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: 你们必是奸细
  rationale: כי在此带强调或结论意味；“必是”传达断然认定。“奸细”是现代中文叙事中对秘密刺探者的准确称呼。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留约瑟命令中的强硬口吻，并用“拘禁”“检验”“起誓”等词维持正式语域；脚注仅用于说明希伯来习语与古代誓言格式。
