  yaml_path: translation/ot/genesis/042/031.yaml
  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: zh_hans
  text: 我们对他说：“我们是诚实的人[a]，不是探子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正直的人”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“我们过去不是探子”；也可理解为“我们没有从事刺探活动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: 我们……说
  rationale: 该叙事形式承接前文，表示接下来发生的言语行动；汉语语境中无需机械译出连接词，句意仍保持顺畅推进。
- source_word: אֵלָיו
  choice: 对他说
  rationale: 介词 אֶל 加第三人称阳性单数后缀，直指说话对象；“对他说”是自然、准确的现代汉语。
- source_word: כֵּנִים
  choice: 诚实人
  rationale: 此处指为人正直、可靠，与“探子”的指控相对；“诚实人”自然易懂，同时保留“正直的人”这一可能译法于脚注。
- source_word: אֲנָחְנוּ
  choice: 我们
  rationale: 独立人称代词带有一定强调作用；汉语以明确的主语“我们”自然表达。
- source_word: לֹא הָיִינוּ
  choice: 从来不是
  rationale: 否定词与 היה 的完成式结合后接分词性名词，否认他们过去曾处于探子这一身份或从事刺探活动；“从来不是”符合自辩语境，也保留其回顾过去的意味。
- source_word: מְרַגְּלִים
  choice: 探子
  rationale: רגל 的复数分词在此指从事侦察、刺探的人；“探子”是简洁自然的现代汉语对应词。
theological_decisions: []
