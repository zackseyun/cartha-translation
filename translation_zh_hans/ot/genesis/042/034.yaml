base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: zh_hans
  text: “把你们最小的弟弟带到我这里来，好让我知道你们不是探子，而是诚实的人。那时，我会把你们的兄弟交还给你们；你们也可以在这地经商[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们也可以在这地自由往来。”希伯来语动词也可泛指在一地四处行走或往来；不过本段涉及购粮，因此译作“经商”更切合语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: 把……带到……来
  rationale: 该词是בוא的使役式命令语气；用现代汉语“把”字句自然表达叫人将某人带来的命令。
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: 你们最小的弟弟
  rationale: הַקָּטֹן在兄弟关系中指年纪最小者；“最小的弟弟”既准确又符合本段语境。
- source_word: וְאֵדְעָה
  choice: 我就知道
  rationale: 该鼓励式形式在命令之后表示预期结果；“就”清楚呈现“带来之后便可确认”的关系，同时保留说话者将要确认的语气。
- source_word: מְרַגְּלִים
  choice: 探子
  rationale: 该分词在此作名词，指暗中侦察的人；“探子”符合叙事语境且通俗庄重。
- source_word: כֵנִים
  choice: 诚实人
  rationale: 该词表示真实、可靠或正直；“诚实人”与“探子”形成自然对照，并与兄弟们先前的自称呼应。
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: 我会把你们的兄弟交还给你们
  rationale: 字面为“我会把你们的兄弟给你们”；上下文所指是被扣留的兄弟，因此“交还”自然表达恢复其自由而不增添新的事件。
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: 你们也可以在这地做买卖
  rationale: סחר通常涉及经商、贸易；饥荒期间来埃及购粮的语境支持“做买卖”，但其较宽泛的“来往”含义以脚注保留。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事用语。“最小的弟弟”比单说“小弟弟”更明确；“这样”标示命令得到履行后的结果。脚注标记置于存在词义差异的“做买卖”之后。
