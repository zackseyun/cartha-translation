  to: 他们彼此说：“我们实在得罪了我们的兄弟；因为他向我们苦苦哀求时，我们看见了他的痛苦，却不肯听。因此，这痛苦临到我们了。”
  rationale: 仅作句法和标点层面的安全调整：前置“他向我们苦苦哀求时”，明确其修饰“看见了他的痛苦”，并以“却”自然连接原文的“我们没有听”。保留“痛苦”的重复，以呈现希伯来文对约瑟昔日痛苦与兄弟当前患难的词汇呼应。
