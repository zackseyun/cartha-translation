base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: zh_hans
  text: 他们彼此说：“我们实在得罪了我们的兄弟；因为他向我们苦苦哀求时，我们看见了他的痛苦，却不肯听。因此，这痛苦临到我们了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: 他们彼此说
  rationale: אִישׁ אֶל־אָחִיו是相互性的分配表达；“彼此说”自然简洁，也保留兄弟们互相交谈的含义。
- source_word: אֲבָל
  choice: 实在
  rationale: 此处不是转折，而是加强承认罪责的语气；“实在”在现代汉语中庄重自然。
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: 我们……得罪了我们的兄弟
  rationale: אֲשֵׁמִים表示有罪、负有罪责；结合עַל־אָחִינוּ及具体语境，“得罪了我们的兄弟”自然表达他们承认对兄弟犯下罪过，而不把句子译得过于法律化。
- source_word: צָרַת נַפְשׁוֹ
  choice: 他内心的痛苦
  rationale: 该短语直译为“他生命／心灵的苦难”。“内心的痛苦”既保留נֶפֶשׁ所强调的整个人深切受苦，也符合现代汉语表达。
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: 他向我们苦苦哀求时
  rationale: חנן的Hitpael形在此表示恳切求告；“苦苦哀求”传达强烈恳求，但不擅自补出所求的具体内容。
- source_word: וְלֹא שָׁמָעְנוּ
  choice: 我们却不肯听
  rationale: שׁמע在语境中指听从、理会，不只是听见声音；“不肯听”准确传达他们拒绝理会约瑟的哀求。
- source_word: עַל־כֵּן
  choice: 因此
  rationale: 明确表达由往日罪行到当前患难的因果推断，简洁而庄重。
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: 这痛苦临到我们了
  rationale: 以“痛苦”对应前面的צָרַת，也对应此处同根词הַצָּרָה，保留原文把约瑟昔日的痛苦与兄弟们当前的痛苦联系起来的重复；“临到”贴合希伯来语惯用表达。
theological_decisions:
- issue: 兄弟们对当前苦难与昔日罪行之间关系的理解
  choice: 保留他们以“因此”作出的因果判断
  alternative: 将其改写为叙述者明确宣告的神圣报应
  rationale: 原文记录的是兄弟们自己的认罪和解释，并未在本节由叙述者直接判定其神学结论；译文不扩大说话者的判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“得罪了我们的兄弟”比“在我们兄弟的事上有罪”更符合汉语习惯；前后两次使用“痛苦”，有意保留希伯来文צָרָה的词根呼应。
