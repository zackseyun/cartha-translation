  text: וְ/הֵם֙ לֹ֣א יָֽדְע֔וּ כִּ֥י שֹׁמֵ֖עַ יוֹסֵ֑ף כִּ֥י הַ/מֵּלִ֖יץ בֵּינֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: zh_hans
  text: 他们却不知道约瑟听得懂[a]，因为有译员在他们之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约瑟正在听”；这里含有约瑟能听懂他们所说之话的意思。
    reason: 保留 שֹׁמֵעַ 可按字面理解为“正在听”，同时说明本语境中理解语言的含义。
lexical_decisions:
- source_word: וְהֵם
  choice: 他们却
  rationale: 连词与显式代词在上下文中形成叙事反差；“却”自然表达这种转折，同时保留明确主语。
- source_word: לֹא יָדְעוּ
  choice: 不知道
  rationale: 直接表达 ידע 完成式在此所指的无知状态，简洁而忠实。
- source_word: כִּי（第一次）
  choice: （引出“不知道”的内容，不另译）
  rationale: 汉语以“不知道约瑟……”直接引出认知内容，比加“即/就是”更自然。
- source_word: שֹׁמֵעַ
  choice: 听得懂
  rationale: 保留 שמע 的“听”这一词义，同时以结果补语“懂”表达语境重点：约瑟能理解他们所说的话；脚注保留较字面的“正在听”。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כִּי（第二次）
  choice: 因为
  rationale: 此处引出他们不知道约瑟能听懂的原因，“因为”清楚呈现因果关系。
- source_word: הַמֵּלִיץ
  choice: 传译的人
  rationale: 在本段语言沟通的语境中，此词指居间传达不同语言的人；“传译的人”准确、自然，也保留其居间功能。
- source_word: בֵּינֹתָם
  choice: 在他们之间
  rationale: 表达传译者处于约瑟与兄弟双方之间、居中传话的关系。
theological_decisions: []
