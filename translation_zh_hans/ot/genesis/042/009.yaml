base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: zh_hans
  text: 约瑟想起了他所做的那些与他们有关的梦，就对他们说：“你们是探子！你们到这里来，是要察看这地的裸露之处[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“这地不设防的地方”或“这地薄弱的地方”。希伯来文直译为“这地的赤裸”，是指暴露在外、容易受到攻击的区域。
    reason: 说明原文隐喻及其惯用含义，并提供较明确的意译。
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: 想起了
  rationale: 该叙事形式表示约瑟在此刻回想起往事；“想起了”自然、准确地表达这一动作。
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: 他所做的那些……梦
  rationale: 希伯来文使用“梦见梦”的同根结构；现代汉语通常说“做梦”，此译法既保留内容，又避免生硬重复。
- source_word: לָהֶם
  choice: 与他们有关的
  rationale: 这里的梦涉及约瑟的哥哥们；“与他们有关的”自然表达关系含义，同时不把它误解为“为他们所做的梦”。
- source_word: מְרַגְּלִים
  choice: 探子
  rationale: 此词在语境中指从事侦察、刺探的人；“探子”符合古代叙事语境，也易于现代读者理解。
- source_word: לִרְאוֹת
  choice: 察看
  rationale: 原词基本义为“看”；在指控侦察的语境中，“察看”比单纯的“看”更自然，同时没有过度增添“刺探”的含义。
- source_word: עֶרְוַת הָאָרֶץ
  choice: 这地的裸露之处
  rationale: 原文直译为“这地的赤裸/裸露”，用来比喻缺乏防守、容易受攻击的地方。正文保留原文意象，脚注说明其惯用含义。
- source_word: בָּאתֶם
  choice: 你们到这里来
  rationale: 该完成式指他们已经来到此地，并突出此行当前的目的；“到这里来”符合汉语直接指控的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“探子”保留古代语境色彩；“裸露之处”保留希伯来文的鲜明意象，并以脚注避免读者误解。
