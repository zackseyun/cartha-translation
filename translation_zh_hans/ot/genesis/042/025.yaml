base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: zh_hans
  text: 约瑟吩咐人把粮食装满他们的容器[a]，把各人的银子[b]放回各自的麻袋里，又给他们旅途所需的物资。事情就这样为他们办了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“器皿”。这里的希伯来词含义较广，与本节后面译作“麻袋”的词不同。
    reason: lexical_alternative
  - marker: b
    text: “银子”在这里也可理解为“钱”。
    reason: lexical_alternative
  - marker: c
    text: 或译“他就这样为他们办了”。原文动词为单数，主语可理解为约瑟；中文此处不明说执行者。
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐人
  rationale: צוה表示发出命令；后接一连串不定式，中文用“吩咐人……”自然地表达间接命令，也不擅自指明执行者。
- source_word: כְּלֵיהֶם
  choice: 他们的容器
  rationale: כְּלִי是泛指器皿、容器的词；译作“容器”可与本节后半明确表示“麻袋”的שַׂק区分。
- source_word: בָּר
  choice: 粮食
  rationale: בָּר在埃及饥荒的语境中指谷物粮食；“粮食”是自然、通俗且不过度限定具体谷类的中文表达。
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם
  choice: 把各人的银子放回
  rationale: כֶּסֶף字面为“银子”，在此也具有钱款的功能；保留具体意象，并用“放回”表达שׁוב使役式的恢复动作。
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: 各自的麻袋里
  rationale: אִישׁ在此作分配用法，意为各人；שַׂק特指麻袋，与前面的泛称כְּלִי保持词义区别。介词אֶל结合实际动作自然译为“里”。
- source_word: וְלָתֵת לָהֶם צֵדָה לַדָּרֶךְ
  choice: 又给他们预备路上的食物
  rationale: צֵדָה指旅途所需的食物或供应；本段语境以粮食为中心，译作“路上的食物”清楚自然。“预备”使中文命令结构顺畅，但不改变“给他们”的受益关系。
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: 人就照样为他们办了
  rationale: 希伯来文使用单数动词，却未明说主语。中文以泛指的“人”保留执行者不确定这一点；“照样”对应כֵּן，并承接前述命令。
