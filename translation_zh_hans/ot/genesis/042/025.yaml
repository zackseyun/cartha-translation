revisions:
- from: 约瑟吩咐人把粮食装满他们的容器[a]，把各人的银子[b]放回各自的麻袋里，又给他们预备路上的食物。人就照样为他们办了[c]。
  to: 约瑟吩咐人把粮食装满他们的容器[a]，把各人的银子[b]放回各自的麻袋里，又给他们旅途所需的物资。事情就这样为他们办了[c]。
  rationale: 修订结句以避免把单数动词译成泛指的“人”，同时不强行在中文正文中指明执行者。将“路上的食物”改为“旅途所需的物资”，保留原文“给养”的较宽含义；其余措辞保持原译对词汇区别和叙事语气的准确处理。
