  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: zh_hans
  text: 于是，他们把粮食[a]装在各自的驴背上，便从那里离开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“口粮”或“买来的粮食”。希伯来语这个词可以泛指食物供应，但在本段语境中，最自然的是指他们在埃及购得的粮食。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: 驮在
  rationale: נשׂא 的基本义是“举起、携带”；这里宾语是粮食，且后接“在驴上”，现代汉语用“驮在”自然地表达把货物装到牲畜上运载的意思。
- source_word: שִׁבְרָם
  choice: 粮食
  rationale: שֶׁבֶר 可泛指食物供应，但在约瑟叙事的饥荒背景中，通常指从埃及购得的谷粮；“粮食”既简洁，又保留了原词本身未明说“买来”的特点。
- source_word: עַל חֲמֹרֵיהֶם
  choice: 在自己的驴上
  rationale: עַל 表示货物置于驴背上；“自己的”清楚传达希伯来语附属代词“他们的”，又避免汉语连续重复“他们的”显得生硬。
- source_word: וַיֵּלְכוּ מִשָּׁם
  choice: 就从那里离开了
  rationale: הלך 是一般性的行走、前往动词，与 מִשָּׁם 连用表示从该处动身；“从那里离开了”符合现代汉语，也不额外指定目的地或行程方式。
theological_decisions: []
