  text: דִּ֠בֶּר הָ/אִ֨ישׁ אֲדֹנֵ֥י הָ/אָ֛רֶץ אִתָּ֖/נוּ קָשׁ֑וֹת וַ/יִּתֵּ֣ן אֹתָ֔/נוּ כִּֽ/מְרַגְּלִ֖ים אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/030.yaml
  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: zh_hans
  text: 那人，就是那地的主，对我们说话很严厉，把我们当作窥探那地的探子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: 那地的主
  rationale: 保留“主、统治者”的称谓及其与“那地”的属格关系；此处指掌管当地的人，并非神名。
- source_word: אִתָּנוּ קָשׁוֹת
  choice: 对我们说话很严厉
  rationale: קָשׁוֹת字面为“严厉的话/严厉地”，现代汉语用副词表达自然清楚；אִתָּנוּ在此表示言语行为所面对的对象。
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: 把我们当作……探子
  rationale: “置/认定我们如同探子”在语境中表示把他们看待、处置为探子；译文保留“当作”的比较与认定含义。
- source_word: מְרַגְּלִים אֶת־הָאָרֶץ
  choice: 窥探那地的探子
  rationale: 希伯来语结构说明探子的活动对象是“那地”；补出“窥探”可避免汉语“那地的探子”被误解为来自当地的探子。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那人，就是那地的主”保留原文先称“那人”、再以同位语说明身份的结构；不添加原文没有的专名或解释。
