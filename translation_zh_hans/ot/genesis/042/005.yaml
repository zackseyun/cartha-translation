  to: 于是，以色列的儿子们与前来买粮的人一同来买粮，因为迦南地有饥荒。
  rationale: 修订删除原文未明示的两个“也”，并将“在……中”的群体关系自然译作“与……一同”，使“来买粮”明确作为以色列众子的行动；未添加目的地或其他上下文虽可推知但本节未明说的内容。
