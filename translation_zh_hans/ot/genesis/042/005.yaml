  register: 采用庄重、简明的现代标准汉语。“以色列的儿子们”保留本节对雅各众子的具体称谓；“在前来买粮的人群中到了”尽量保存原文 בוא 在主句和分词中的重复及群体场景，同时避免过度解释。
