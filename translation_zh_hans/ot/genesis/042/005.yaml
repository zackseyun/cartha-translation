    issue: “也”被重复加入
    rationale: 希伯来原文没有对应“也”的副词。主句的“也”可能暗示他们在另一群体之外另作同类行动，原因从句的“也有饥荒”则暗示与另一地点的饥荒作显性对比；这些都不是本节明说的内容。
  - severity: medium
    issue: “在前来买粮的人群中到了”句法不自然且行动关系不清
    rationale: 原文是“来，为买粮，在来的人中间”；中文应明确他们是和前来买粮的人一同来买粮，而非笼统地“在人群中到了”。
  revised_text: 于是，以色列的儿子们与前来买粮的人一同来买粮，因为迦南地有饥荒。
