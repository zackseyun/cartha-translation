  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: zh_hans
  text: 于是，以色列的儿子们与前来买粮的人一同来买粮，因为迦南地有饥荒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 于是……到了
  rationale: 该叙事性动词承接前文，描写他们抵达埃及；“到了”比单说“来”更自然地表达抵达视角。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的儿子们
  rationale: 直译为“以色列的儿子们”，在本段明确指雅各的众子，而不是泛指以色列民族。
- source_word: לִשְׁבֹּר
  choice: 买粮
  rationale: 该动词基本义为“购买”，在饥荒和约瑟叙事的语境中专指购买粮食；汉语补出“粮”可清楚传达语境含义。
- source_word: בְּתוֹךְ הַבָּאִים
  choice: 在前来买粮的人群中
  rationale: 保留“在……中间”的群体含义，也保留分词“前来的人”；补出“买粮”使汉语所指自然明确。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出他们随众前来的原因。
- source_word: הָיָה הָרָעָב
  choice: 也有饥荒
  rationale: 用现代汉语自然表达当地存在那场已知的饥荒；“也”体现迦南同样受灾，与众人赴埃及购粮的背景相连。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 迦南地
  rationale: 保留原文具体的地理表达，并符合现代中文圣经地名习惯。
