  text: וַ/יֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם רְדוּ שָׁ֨מָּ/ה֙ וְ/שִׁבְרוּ לָ֣/נוּ מִ/שָּׁ֔ם וְ/נִחְיֶ֖ה וְ/לֹ֥א נָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: zh_hans
  text: 他说：“你们看，我听说埃及有粮食。你们下到那里去，从那里给我们买些粮食来，好让我们活下去，不至于死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 你们看
  rationale: 这是引起听者注意的话语标记；“你们看”既保留其提示作用，也比“看哪”更符合现代汉语口吻。
- source_word: שָׁמַעְתִּי
  choice: 我听说
  rationale: 希伯来语完成式表示已经得知、目前仍相关的消息；现代汉语用“我听说”表达自然。
- source_word: שֶׁבֶר
  choice: 粮食
  rationale: 在饥荒和购粮的语境中，此词指可供购买的谷粮；“粮食”准确且为普通读者熟悉。
- source_word: רְדוּ שָׁמָּה
  choice: 下到那里去
  rationale: 保留“下去”的方向含义，以及原文“那里”的指代，同时使用自然的汉语结构。
- source_word: וְשִׁבְרוּ
  choice: 买些粮食来
  rationale: 该动词在此语境中专指购买粮食；补出由上下文明确的宾语，并以“来”表达买回给家中的意思。
- source_word: לָנוּ מִשָּׁם
  choice: 从那里给我们
  rationale: 分别表达原文明确的来源“从那里”和受益者“给我们”。
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: 好让我们活下去，不至于死
  rationale: “好让”传达目的或期望结果；“活下去，不至于死”保留原文正反并列的紧迫语气。
