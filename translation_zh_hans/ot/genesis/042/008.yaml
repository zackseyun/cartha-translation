  yaml_path: translation/ot/genesis/042/008.yaml
  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: zh_hans
  text: 约瑟认出了他的哥哥们[a]，他们却没有认出他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文在前后两句使用同一个动词：“约瑟认出了他的哥哥们，他们却没有认出他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: 认出了
  rationale: 此处 נכר 的使役词干表示认出先前认识的人；“认出了”自然表达识别成功，并与后半句同一动词的否定形式相呼应。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶת־אֶחָיו
  choice: 他的哥哥们
  rationale: אָח 的阳性复数在本段具体指约瑟的兄长们；“哥哥们”比泛称“兄弟们”更准确地体现人物关系。
- source_word: וְהֵם
  choice: 他们却
  rationale: ו 字面可作“而/和”，但此处连接两个彼此对照的分句；“却”自然传达叙事中的反差。
- source_word: לֹא
  choice: 没有
  rationale: 与“认出”组成现代汉语自然的否定完成表达“没有认出”。
- source_word: הִכִּרֻהוּ
  choice: 认出他
  rationale: 与前半句的 וַיַּכֵּר 来自同一动词 נכר；重复译作“认出”保留原文的词语呼应和叙事反讽，宾语“他”指约瑟。
