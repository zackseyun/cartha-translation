  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יַעֲקֹ֣ב אֲבִי/הֶ֔ם אֹתִ֖/י שִׁכַּלְתֶּ֑ם יוֹסֵ֤ף אֵינֶ֨/נּוּ֙ וְ/שִׁמְע֣וֹן אֵינֶ֔/נּוּ וְ/אֶת בִּנְיָמִ֣ן תִּקָּ֔חוּ עָלַ֖/י הָי֥וּ כֻלָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: zh_hans
  text: 他们的父亲雅各对他们说：“你们使我丧子[a]！约瑟不在了，西缅也不在了，你们还要带走便雅悯。这一切都落到我身上了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们使我失去儿女。”
    reason: שִׁכַּלְתֶּם既可着重遭受丧亲之痛，也可表达被弄得无儿无女；正文依上下文具体译作“丧子”。
  - marker: b
    text: 或译：“这一切都与我作对。”
    reason: עָלַי可表达事情临到某人，也可带有敌对、不利于某人的意味；两种译法分别突出承受祸患和遭遇逆境。
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: 你们使我丧子
  rationale: 该动词的强化词干表示使人遭受丧子之痛或变得无子；“使我丧子”简洁保留了雅各责怪众子的语气和强烈哀痛。
- source_word: אֵינֶנּוּ
  choice: 不在了
  rationale: 这里表示人已经不在身边、失去踪影，而不只是一般的存在否定；同一表达用于约瑟和被扣留的西缅，“不在了”可保留两者具体处境的差异。
- source_word: תִּקָּחוּ
  choice: 你们还要带走
  rationale: 未完成式在语境中指众子打算采取的行动；“还要”表现雅各对这一提议的抗拒，并承接前两重损失。
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: 这一切都落到我身上了
  rationale: עָלַי有“临到我、压在我身上”的不利意味；此译自然表达接连祸患由雅各承受，同时不把该短语过度具体化。
- source_word: אֹתִי
  choice: 我
  rationale: 希伯来文将受事“我”前置以突出雅各本人所受的丧子之痛；汉语以“使我丧子”明确保留。
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: 他们的父亲雅各
  rationale: 符合现代汉语叙事习惯，并完整保留雅各与众子的父子关系。
theological_decisions: []
