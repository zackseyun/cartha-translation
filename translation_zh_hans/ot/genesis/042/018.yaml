  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: zh_hans
  text: 第三天，约瑟对他们说：“你们要这样做，就可活命；我敬畏上帝。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: 约瑟对他们说
  rationale: 按希伯来语叙事结构自然表达，保留说话者和间接宾语。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 现代汉语中简洁、自然的时间表达。
- source_word: זֹאת עֲשׂוּ
  choice: 你们这样做
  rationale: 准确传达指示代词加复数命令式；补出“你们”使中文直接引语自然清楚。
- source_word: וִחְיוּ
  choice: 就可以活命
  rationale: 该命令式承接前一命令，可表示随之而来的结果；“活命”符合拘押和死亡威胁的语境，同时脚注保留并列命令的可能。
- source_word: אֶת הָאֱלֹהִים
  choice: 上帝
  rationale: 此处带定冠词的 אֱלֹהִים 在创世记叙事语境中指独一的上帝；现代汉语无需另译定冠词。
- source_word: אֲנִי יָרֵא
  choice: 我敬畏
  rationale: 明确人称代词加分词表达约瑟持续、具有特征性的敬畏；“敬畏”兼具畏惧与尊崇之意。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经人名的通行译名。
theological_decisions:
- issue: 约瑟所说“אֶת הָאֱלֹהִים אֲנִי יָרֵא”的含义
  choice: 译为“我敬畏上帝”，保留约瑟以对上帝的敬畏作为其处置方式之依据的叙事含义。
  alternative: 译作“我惧怕神明”，理解为埃及宫廷语境中的泛指宗教敬畏。
  rationale: 《创世记》的整体叙事把约瑟描写为认识并事奉其祖先之上帝的人；不过正文不增添“独一”或“我祖先的”等解释性成分，以免超出原文。
- issue: כִּי 未明示而由话语关系体现的解释意味
  choice: 用“因为”明确表达后句对前述安排的理由。
  alternative: 不加连接词，译为“我敬畏上帝”。
  rationale: 希伯来语两句间虽无显式 כִּי，但语境显示约瑟以敬畏上帝说明自己让他们存活的安排；中文加入“因为”能自然呈现这一话语关系，同时不改变核心命题。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“活命”切合囚禁语境；“敬畏上帝”保留圣经神学用语而不作教派化扩展。
