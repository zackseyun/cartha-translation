  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: zh_hans
  text: 但他说：“我的儿子不能和你们一同下去，因为他的兄弟死了，只剩下他一个。万一他在你们所走的路上遭遇不幸，你们就会使我这满头白发在悲伤中下到阴间[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”对应希伯来语“示奥勒”，可指死者所在之境；也可译作“坟墓”。
    reason: 说明 שְׁאוֹל 的词义范围，并保留其可能译法。
lexical_decisions:
- source_word: יֵרֵד
  choice: 下去
  rationale: 保留 ירד“下去”的方向性；从迦南前往埃及在《创世记》中常被称为“下去”。
- source_word: בְּנִי
  choice: 我的儿子
  rationale: 直接对应“我的儿子”，保留父子关系及单数表达。
- source_word: אָחִיו מֵת
  choice: 他的哥哥死了
  rationale: אָח 可泛指兄弟；此处所指约瑟年长于便雅悯，因此现代汉语用“哥哥”自然明确。“死了”表达雅各认定约瑟已死的状态。
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: 只剩下他一个
  rationale: 自然表达 לְבַדּוֹ 的强调，并指便雅悯是拉结所生、在雅各看来唯一还活着的儿子。
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: 万一他……遭遇不幸
  rationale: אָסוֹן 指严重的不幸、灾祸或伤害；“万一……遭遇不幸”符合雅各担忧的条件语气，同时不把具体结果限定为死亡。
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: 在你们所走的路上
  rationale: 较贴近原文“在你们所走的那条路上”，同时是自然的现代汉语。
- source_word: וְהוֹרַדְתֶּם
  choice: 你们就会使……下到
  rationale: 保留使役形“使……下去”，并体现前述假设一旦发生所带来的后果。
- source_word: שֵׂיבָתִי
  choice: 我白发苍苍
  rationale: 原文直译为“我的白发”；汉语以“使我白发苍苍……下到”保留白发所象征的年老形象，避免仅抽象译作“晚年”。
- source_word: בְּיָגוֹן
  choice: 悲悲哀哀地
  rationale: 表达 יָגוֹן 的悲痛、哀伤，并与中文叙事语体协调。
- source_word: שְׁאֹלָה
  choice: 阴间
  rationale: שְׁאוֹל 指死者所在之境，不宜一概缩窄为实体坟墓；“阴间”是简体中文圣经语境中较透明且易懂的对应词。
theological_decisions:
- issue: שְׁאוֹל 应译为死者之境还是坟墓
  choice: 阴间
  alternative: 坟墓；死者之境
  rationale: 原词并不总等同于实体坟墓。“阴间”保留其作为死者所在之境的概念，也不进一步规定其性质。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“下去”保留叙事地理方向；“万一……遭遇不幸”传达条件意味；“白发苍苍、悲悲哀哀地下到阴间”尽量保存原文白发、哀伤和下降的连续意象。
