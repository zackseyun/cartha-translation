  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: zh_hans
  text: 你们要这样受考验：我指着法老的性命起誓[a]，除非你们最小的弟弟到这里来，你们绝不能离开这里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“法老活着！”；这是凭法老的性命所起的誓言公式。
    reason: 说明誓言公式的字面形式及其语用含义。
lexical_decisions:
- source_word: בְּזֹאת
  choice: 这样
  rationale: 介词 בְּ 与指示代词 זֹאת 表示检验的方式或标准；“这样”在现代汉语中简洁自然。
- source_word: תִּבָּחֵנוּ
  choice: 受考验
  rationale: בחן 的尼法勒形表示被检验、受查验；此处是核实众兄弟所说的话。
- source_word: חֵי פַרְעֹה
  choice: 我指着法老的性命起誓
  rationale: 这是以法老性命为凭的誓言公式。意译出“起誓”可让现代读者理解其语用功能，同时保留所凭借的对象。
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: 你们绝不能离开这里
  rationale: אִם 位于誓言之后，构成强烈否定的断言，并非普通条件句；“绝不能”传达其郑重而坚决的语气。
- source_word: כִּי אִם
  choice: 除非……否则
  rationale: 该组合引出前述强烈否定的唯一例外；汉语“除非……否则……”清楚表达这一逻辑关系。
- source_word: בְּבוֹא
  choice: 到……来
  rationale: 带 בְּ 的不定词结构表示获准离开的条件或情形，改用现代汉语有限动词表达更自然。
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: 你们的小弟弟
  rationale: קָטֹן 在兄弟排行语境中指年幼者；“小弟弟”自然且不超出原文，因为后文虽可确认是最小的兄弟，本句词形本身也可作“年幼的弟弟”。
- source_word: הֵנָּה
  choice: 到这里来
  rationale: 方向副词表示朝说话者所在之处移动；“到这里来”比单说“这里”更完整地体现方向性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我指着……起誓”明确呈现古代誓言公式的功能；“绝不能”保留誓言结构中 אִם 所表达的强烈否定。
