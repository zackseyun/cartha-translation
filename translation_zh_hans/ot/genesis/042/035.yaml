base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: zh_hans
  text: 他们正在倒空袋子时，只见各人的一包银子[a]都在自己的袋子里；他们和父亲看见这些包好的银子，就都害怕起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一包银子”所对应的希伯来语，指捆扎或包裹在一起的银子；也可译作“钱囊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: 他们正倒空……时
  rationale: וַיְהִי与分词结构共同交代事情发生时的背景。汉语用“正……时”自然表达同步动作，无须生硬直译“事情发生了”。
- source_word: שַׂקֵּיהֶם
  choice: 他们的袋子
  rationale: שַׂק指装粮食或货物的粗袋；“袋子”是现代汉语中自然、清楚且不过度限定材质的表达。
- source_word: וְהִנֵּה
  choice: 没想到……都
  rationale: 该词提示突然发现和意外。“没想到”在现代叙事中自然传达惊讶，不采用较古雅的“看哪”。
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: 各人的一包银子
  rationale: אִישׁ在此为逐一分配用法；צְרוֹר指捆扎或包裹之物；כֶּסֶף在此是作为钱财的银子。此译兼顾逐人、实体包裹和古代银钱背景。
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: 他们和父亲
  rationale: 保留希伯来语明确列出兄弟们与其父亲共同看见此事的强调。
- source_word: וַיִּירָאוּ
  choice: 就都害怕起来
  rationale: 表达他们因看见银包而产生的恐惧；“起来”体现状态的开始，“都”自然涵盖兄弟们及父亲。
