  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: zh_hans
  text: 阿何利巴玛族长[a]，以拉族长，比嫩族长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族长”或译“首领”，指以东部族或宗族的领袖。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: 族长
  rationale: 在《创世记》36章的以东谱系与首领名单中，此词指部族或宗族的领袖。译作“族长”既简洁自然，也比泛称“首领”更能体现其群体领袖身份；但原词所指群体层级未必固定，因此加注说明。
- source_word: אָהֳלִיבָמָה
  choice: 阿何利巴玛
  rationale: 按希伯来语专名音译，并采用现代中文圣经读者较易辨认的形式。
- source_word: אֵלָה
  choice: 以拉
  rationale: 此处是专名，依希伯来语音译，不按普通名词含义翻译。
- source_word: פִּינֹן
  choice: 比嫩
  rationale: 此处是专名，依希伯来语辅音与传统中文译名音译。
