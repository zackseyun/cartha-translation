lexical_decisions:
- source_word: אֵלֶּה
  choice: 是
  rationale: 原文以复数指示词引出家谱名单，且为无系词句。现代汉语不必机械译出“这些”，用“是”构成自然的名单介绍句，同时完整传达其功能。
- source_word: בְנֵי
  choice: 儿子
  rationale: 在此家谱语境中，后接两名男性人名，指底珊的男性后代，按上下文最自然地理解为儿子。
- source_word: דִישָׁן
  choice: 底珊
  rationale: 人名采用现代中文圣经中通行且易辨认的音译。
- source_word: עוּץ
  choice: 乌斯
  rationale: 人名采用现代中文圣经中通行且易辨认的音译。
- source_word: וַאֲרָן
  choice: 和亚兰
  rationale: 前缀 וְ 连接名单中的第二个人名，译作“和”；אֲרָן 音译为“亚兰”。
