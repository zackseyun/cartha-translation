  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: zh_hans
  text: 族长玛基叠[a]，族长以兰。这些是以东的族长，按他们在自己产业之地的住处。这就是以扫，以东人的祖先[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族长”也可译作“部族首领”；希伯来语这个词可指部族或宗族的领袖。
    reason: lexical_alternative
  - marker: b
    text: 直译“以东之父”，意思是以扫是以东人的始祖。
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוּף
  choice: 族长
  rationale: 该词在《创世记》36章指以东各部族或宗族的领袖；“族长”简洁自然，也保留了其群体领袖的称号性质。
- source_word: מַגְדִּיאֵל
  choice: 玛基叠
  rationale: 专名，按现代中文圣经人名惯例音译。
- source_word: עִירָם
  choice: 以兰
  rationale: 专名，按现代中文圣经人名惯例音译。
- source_word: לְמֹשְׁבֹתָם
  choice: 按着……住处列出
  rationale: 介词 לְ 在此表示分类依据；补出“列出”使中文清楚表达名单按住处分列的关系。
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: 在所得为业之地
  rationale: אֲחֻזָּה 指所持有的产业，尤其是土地；此译保留土地作为产业的含义，同时符合庄重的现代中文。
- source_word: הוּא עֵשָׂו
  choice: 这就是以扫
  rationale: 此句是对前述族谱和名单的总结性辨认；“这就是”避免让代词被误解为只指最后提到的以兰。
- source_word: אֲבִי אֱדֹם
  choice: 以东人的祖先
  rationale: אָב 在族谱语境中可指始祖或先祖；以东在此指从以扫而出的族群，译作“以东人的祖先”可让现代读者准确理解其族源意义。
theological_decisions:
- issue: 以扫被称为“以东之父”的族谱与族群含义
  choice: 以东人的祖先
  alternative: 以东之父
  rationale: 此语说明以扫是以东族群的先祖，并非只陈述直接父子关系；正文采用自然明确的中文，脚注保留希伯来文的字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的名单与族谱文体。人名沿用通行音译；以“所得为业之地”保留产业土地的语义，以“这就是”呈现末句对整段家谱的总结辨认。
