  terminology: “以扫”“雅各”“迦南地”均规范。“家中所有的人”准确表达“全家的人口”；“牲畜、所有的动物”保留了原文两个相近但不同的类别，处理妥当。“所得的一切财物”也准确传达获得的产业。
