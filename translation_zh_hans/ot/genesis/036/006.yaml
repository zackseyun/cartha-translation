  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: zh_hans
  text: 以扫带着他的妻子、儿子、女儿和家中所有的人，以及他的牲畜、所有的动物和他在迦南地所得的一切财物，因他弟弟雅各的缘故，往一地去了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“往一地”。有些抄本和古代译本支持“往西珥地”；也可按上下文理解为“往另一处地方”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 带着
  rationale: לקח 的基本义是“拿、带”；在迁徙语境中，“带着”自然表达以扫携同家人和财物离开。
- source_word: נָשָׁיו
  choice: 他的妻子
  rationale: 此处复数明确指以扫的妻子们；现代汉语用“他的妻子”即可表达集合意义。
- source_word: בָּנָיו וְאֶת בְּנֹתָיו
  choice: 儿子、女儿
  rationale: 原文分别列出儿子和女儿，译文不合并为“儿女”，以保留原文结构。
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: 家中所有的人
  rationale: נפשׁ 在这一惯用语中指家属或家中人口，并非专指神学意义上的“灵魂”。
- source_word: מִקְנֵהוּ
  choice: 他的牲畜
  rationale: מִקְנֶה 通常指作为财产饲养的牲畜；“牲畜”是清楚自然的现代汉语对应词。
- source_word: כָּל בְּהֶמְתּוֹ
  choice: 所有的动物
  rationale: בְּהֵמָה 是较广的动物用语；译作“动物”可在中文中保留它与前项“牲畜”的并列，虽两者语义有所重叠。
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: 他……所得的一切财物
  rationale: קִנְיָן 与 רכשׁ 都突出取得的产业；“所得的一切财物”自然表达原文的财产及获得之意。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 保留原文明确的地理表述“迦南地”。
- source_word: אֶל אֶרֶץ
  choice: 往一处地方
  rationale: 马所拉文本直译为“往一地”，没有明确写“另一处”或“西珥”；“一处地方”保留这种不特定性。
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: 因他弟弟雅各的缘故
  rationale: מִפְּנֵי 可有“从……面前”或“因为……”之意；结合下一节所述两家无法同住的原因，此处采用自然的因果表达，同时不进一步说明雅各有何主动行为。
theological_decisions:
- issue: 以扫离开的原因及雅各的角色
  choice: 因他弟弟雅各的缘故
  alternative: 离开他弟弟雅各／从他弟弟雅各面前
  rationale: 原文介词 מִפְּנֵי 兼有空间和因果可能；上下文支持因果关系，但并未将责任或过错归给雅各，因此译文只保留宽泛的“缘故”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文对儿子、女儿以及牲畜、动物的逐项列举；脚注标记置于其实际所解释的目的地短语之后。
