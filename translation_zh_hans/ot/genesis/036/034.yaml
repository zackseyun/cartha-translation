  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: zh_hans
  text: 约巴死了，来自提幔地[a]的户珊接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来自提幔人之地”；也可理解为“来自那位提幔人之地”。原文的形式可指与提幔相关的地区，也可指提幔人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该叙事性动词形式表示接续发生的简单过去事件；“死了”符合现代汉语的王表叙述。
- source_word: יוֹבָב
  choice: 约巴
  rationale: 按现代中文圣经中通行的人名音译处理。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在此王位承继公式中表示登上王位并执掌王权；“作王”简洁自然。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 此处表示在职位上取代前任；与“作王”连用，清楚表达王位承继。
- source_word: חֻשָׁם
  choice: 户珊
  rationale: 按现代中文圣经中通行的人名音译处理。
- source_word: מֵאֶרֶץ
  choice: 来自……之地
  rationale: 介词מִן与אֶרֶץ的组合表示地理来源；此译法保留“土地、地区”的含义。
- source_word: הַתֵּימָנִי
  choice: 提幔人
  rationale: 该形式是与提幔相关的族称；在“……之地”之后可理解为该族群，但也可能指提幔地区或某位提幔人，因此以脚注保留歧义。
