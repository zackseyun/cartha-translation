base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: zh_hans
  text: 于是，以扫定居在西珥山区[a]；以扫就是以东。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“住在西珥山地”，或“住在西珥山”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 定居
  rationale: 该词源自ישׁב，此处为叙事性的连续式，结合上下文表示以扫在该地区安顿居住；“定居”自然传达了建立居所之意。
- source_word: בְּהַר
  choice: 在……山区
  rationale: הַר既可指单独的山，也可指山地或山区。此处西珥是地域名称，译作“西珥山区”较符合地理语境，同时避免限定为一座山峰。
- source_word: שֵׂעִיר
  choice: 西珥
  rationale: 地名采用现代中文圣经中通行的音译。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 人名采用现代中文圣经中通行的音译。
- source_word: הוּא אֱדוֹם
  choice: 以扫就是以东
  rationale: 原文是无系词的同一性判断句，直接说明以扫与以东的对应关系；“就是”在现代汉语中清楚而自然。
