  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: zh_hans
  text: 以下是以扫子孙的族长[a]：以扫的长子以利法的儿子——族长提幔、族长阿抹、族长洗玻、族长基纳斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族长”也可译作“首领”；原文这一称号指宗族或部族的首领，有时也可指其所辖的宗族。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: 族长
  rationale: 在以东的谱系名单中，这一称号指宗族或部族的首领。“族长”既适合名单中的头衔用法，也比“公爵”等旧式译法更符合现代汉语。
- source_word: בְנֵי
  choice: 子孙中的 / 儿子
  rationale: 首次出现概括以扫的后裔群体，译作“子孙中的”较自然；第二次直接列举以利法的男性后代，译作“儿子”，保留原文同一词在语境中的不同指向。
- source_word: בְּכוֹר
  choice: 长子
  rationale: 准确表达出生次序，也保留这一身份可能具有的地位含义。
- source_word: אֵלֶּה
  choice: 以下是
  rationale: 适合现代汉语谱系名单的引介格式，并自然带出后面的列举。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֱלִיפַז
  choice: 以利法
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: תֵּימָן
  choice: 提幔
  rationale: 采用通行音译；在本节中与“族长”这一称号连用。
- source_word: אוֹמָר
  choice: 阿抹
  rationale: 采用通行音译。
- source_word: צְפוֹ
  choice: 洗玻
  rationale: 采用通行音译，对应马所拉文本 צְפוֹ。
- source_word: קְנַז
  choice: 基纳斯
  rationale: 采用通行音译。
