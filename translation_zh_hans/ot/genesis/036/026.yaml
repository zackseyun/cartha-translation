  text: וְ/אֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: zh_hans
  text: 底珊的儿子是欣但、伊是班、益兰和基兰。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: 是
  rationale: 希伯来文以连词和指示词引出家谱名单，整句为无动词句。中文在承接上下文时不必机械译出“这些”，用“是”自然引出名单，也保留家谱陈述的语气。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 该词为“儿子”的复数构造形式；本节列举的是底珊直接具名的男性后代，因此译作“儿子”比宽泛的“后代”更准确。
- source_word: דִישָׁן
  choice: 底珊
  rationale: 按现代中文圣经人名的通行译法音译此名，并与本章相关经文保持一致。
- source_word: חֶמְדָּן
  choice: 欣但
  rationale: 按现代中文圣经人名的通行译法音译；对应马所拉文本的 חֶמְדָּן。
- source_word: וְ/אֶשְׁבָּן
  choice: 伊是班
  rationale: 音译专名；前缀连词在中文列举结构中由顿号体现。
- source_word: וְ/יִתְרָן
  choice: 益兰
  rationale: 音译专名；前缀连词在中文列举结构中由顿号体现。
- source_word: וּ/כְרָן
  choice: 和基兰
  rationale: 音译专名，并将前缀连词译作末项之前的“和”，符合现代汉语列举习惯。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语家谱体。希伯来文句首的 וְאֵלֶּה 在连续家谱中起承接和引介作用；中文不另加“这些”，避免生硬。英文关于 Keran/Cheran 的拼写脚注只涉及英语音译差异，对中文“基兰”不适用，因此不设脚注。
