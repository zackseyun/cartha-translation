base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: zh_hans
  text: 亚革波的儿子巴力·哈南死了，哈达[a]接替他作王。他的城名叫巴乌[b]；他的妻子名叫米希他别，是玛特列的女儿；玛特列是米·萨合的女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本传统以及《历代志上》1:50作“哈达德”。
    reason: textual_variant
  - marker: b
    text: 《历代志上》1:50作“巴伊”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该动词直接表示死亡；“死了”准确自然，不采用委婉说法。
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: 亚革波的儿子巴力·哈南
  rationale: 按现代汉语亲属关系的自然语序表达，同时音译人名。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: 接替他作王
  rationale: 兼顾 מלך 的“作王”和 תחתיו 的继位含义，比逐字译为“在他之下作王”更符合现代汉语。
- source_word: הֲדַר
  choice: 哈达
  rationale: 依马所拉文本的读音音译；“哈达德”作为异文保留在脚注。
- source_word: פָּעוּ
  choice: 巴乌
  rationale: 依马所拉文本的读音音译；历代志上1:50的不同形式另见脚注。
- source_word: מְהֵיטַבְאֵל
  choice: 米希他别
  rationale: 按希伯来语人名音译，并采用现代中文圣经人名的常见音节形式。
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: 玛特列的女儿、米·萨合的女儿
  rationale: 保留希伯来文两次出现的“女儿”，不在正文中强行判定第二个短语修饰米希他别还是玛特列；可能的谱系理解见脚注。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。叙事句用“接替他作王”清楚表达王位承继；人名、地名依希伯来文本音译。正文保留末尾谱系短语的紧凑并列结构，并以脚注说明其可能的层级关系。
