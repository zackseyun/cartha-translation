  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: zh_hans
  text: 哈达死了，来自玛士利加[a]的桑拉接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属玛士利加的”。希伯来语介词既可表示来自某地，也可表示与某地有关联。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 这是מות的连续叙事形式，表示王表中接续发生的事件；“死了”是现代汉语自然、简明的表达。
- source_word: הֲדָד
  choice: 哈达
  rationale: 按通行的圣经人名音译处理，不翻译其可能包含的词义。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在王位承继的语境中指掌权为王；“作王”简洁自然，也符合本段反复出现的王表句式。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תחת加代词后缀在这里表示取代前任、承继其位；“接替他”比单纯的“在他以后”更能保留替代意义。
- source_word: שַׂמְלָה
  choice: 桑拉
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: מִמַּשְׂרֵקָה
  choice: 来自玛士利加的
  rationale: 前缀מִן通常表示来源，也可较宽泛地表示与某地的关联；正文采用自然的籍贯表达，同时以脚注保留另一种理解。
