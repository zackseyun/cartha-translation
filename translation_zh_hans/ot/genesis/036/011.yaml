  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: zh_hans
  text: 以利法的儿子是提幔、阿抹、洗玻[a]、迦坦和基纳斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些英文译本将此名转写为“Zepo”；马所拉希伯来文本在本节的标音支持“Zepho”。
    reason: 说明英文人名转写异体，并保留马所拉文本标音所支持的读法。
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 在家谱名单中，带连接词的 היה 用作系词，引出后代名单；译为“是”最自然，不取带有变化意味的“成为”。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 希伯来文为阳性复数“儿子”，且上下文是明确的男性家谱名单，故不泛化为“儿女”或“后代”。
- source_word: אֱלִיפָז
  choice: 以利法
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: תֵּימָן
  choice: 提幔
  rationale: 此处为家谱中的人名，按通行中文形式音译，不按其可能关联的地名或词义翻译。
- source_word: אוֹמָר
  choice: 阿抹
  rationale: 采用通行中文圣经人名音译。
- source_word: צְפוֹ
  choice: 洗玻
  rationale: 依据马所拉文本的读音 צְפוֹ 音译，并采用中文圣经传统中较为熟悉的写法；异读情况以脚注说明。
- source_word: גַעְתָּם
  choice: 迦坦
  rationale: 采用通行中文圣经人名音译。
- source_word: קְנַז
  choice: 基纳斯
  rationale: 采用通行中文圣经人名音译，兼顾原名读音与现代读者的辨识度。
