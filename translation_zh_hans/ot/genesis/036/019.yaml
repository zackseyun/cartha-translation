base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: zh_hans
  text: 这些是以扫的儿子；这些是他们的首领[a]。他就是以东。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“族长”。希伯来语 אַלּוּפִים 指以东各氏族或部族的首领。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 这是复数指示词，用来引出家谱总结；希伯来文为无系词句，现代汉语补出“是”更自然。
- source_word: בְנֵי עֵשָׂו
  choice: 以扫的儿子
  rationale: בְנֵי 在此家谱语境中指男性后代；译作“儿子”比“儿女”或“后裔”更准确。
- source_word: וְאֵלֶּה
  choice: 这些是
  rationale: 重复“这些是”保留原文两个并列分句的平行结构；汉语中省去句首连接词仍能自然表达并列关系。
- source_word: אַלּוּפֵיהֶם
  choice: 他们的族长
  rationale: אַלּוּף 在创世记36章指以东氏族或部族的首领；“族长”简洁地传达其宗族领导身份，同时以脚注提示可译为“首领”。
- source_word: הוּא אֱדוֹם
  choice: 他就是以东
  rationale: 保留单数代词对以扫的回指，并直接表达以扫与“以东”这一称号及族群始祖身份之间的认同关系。
theological_decisions:
- issue: “他”所指及以扫与以东的关系
  choice: 他就是以东
  alternative: 这就是以东
  rationale: 原文使用阳性单数代词 הוּא，最自然地回指以扫；直译为“他”可保留这种人称指向，而不把经文改写成纯解释性陈述。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述用语。保留原文“这些是……这些是……”的平行结构，并用“他就是以东”维持原文简洁有力的身份认定。
