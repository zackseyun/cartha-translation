lexical_decisions:
- source_word: אַלּוּף
  choice: 族长
  rationale: 在《创世记》36章的以东谱系和首领名单中，此词指部族或宗族的首领。“族长”简洁自然，也保留其群体领袖的含义；此处不采用古旧或带爵位色彩的译法。
- source_word: קְנַז
  choice: 基纳斯
  rationale: 专名按希伯来语读音音译；这里可指以该名为称号的个人或宗族，译文不强行消除这种可能性。
- source_word: תֵּימָן
  choice: 提幔
  rationale: 此处作为以东首领名单中的专名，按希伯来语读音音译，不按其可能与“南方”相关的词源意义翻译。
- source_word: מִבְצָר
  choice: 米比萨
  rationale: 此处是专名，按希伯来语音译；不按同形词可能具有的“堡垒”含义意译。
