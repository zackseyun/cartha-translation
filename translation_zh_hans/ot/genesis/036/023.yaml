  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: zh_hans
  text: 朔巴的儿子是亚勒文[a]、玛拿辖、以巴录、示玻[b]和阿南。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“亚勒文”；平行家谱《历代志上》1:40作“亚勒延”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文本作“示玻”；平行家谱《历代志上》1:40作“示非”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ……是
  rationale: 该表达引出家谱中的下一项。现代汉语用“……是”自然清楚；句首连接词不必机械译作“和”。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这里列出的是朔巴直接的男性后代，译作“儿子”比泛指的“子孙”更准确。
- source_word: שׁוֹבָל
  choice: 朔巴
  rationale: 人名按希伯来语形式音译，并采用现代中文圣经读者较熟悉的译名。
- source_word: עַלְוָן
  choice: 亚勒文
  rationale: 按本节马所拉文本的希伯来语形式音译；代上1:40平行家谱的形式不同，另加脚注说明。
- source_word: וּ/מָנַחַת
  choice: 玛拿辖
  rationale: 按希伯来语人名音译；前缀连接词由中文列举标点体现。
- source_word: וְ/עֵיבָל
  choice: 以巴录
  rationale: 按希伯来语人名音译，并与山名“以巴路”适当区分。
- source_word: שְׁפוֹ
  choice: 示玻
  rationale: 按本节马所拉文本的希伯来语形式音译；代上1:40平行家谱作不同形式，另加脚注。
- source_word: וְ/אוֹנָם
  choice: 和阿南
  rationale: 人名按希伯来语音译；连接词译为“和”，自然引出名单末项。
