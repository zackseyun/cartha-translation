  yaml_path: translation/ot/genesis/036/004.yaml
  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: zh_hans
  text: 亚大给以扫生了以利法；巴实抹生了流珥。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: 生了
  rationale: 两处动词均源自 ילד，表示“生、生育”。“生了”简洁自然，适合家谱叙事，也清楚保留母亲作主语。
- source_word: לְעֵשָׂו
  choice: 给以扫
  rationale: 介词 ל 在此标明孩子的父亲；“给以扫生了”在现代汉语中自然地表达这一亲属关系，又不增加原文没有明说的内容。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在汉语中无需对应词，其语法作用由语序体现。
- source_word: אֱלִיפָז
  choice: 以利法
  rationale: 按现代中文圣经中通行且易辨认的人名形式音译。
- source_word: בָשְׂמַת
  choice: 巴实抹
  rationale: 采用现代中文圣经传统中通行的人名译法，与希伯来文本中的该名字对应。
- source_word: רְעוּאֵל
  choice: 流珥
  rationale: 采用现代中文圣经传统中通行的人名译法，反映马所拉文本的希伯来名字。
- source_word: וּ
  choice: ；
  rationale: 原文连接两个并列的生育记载。汉语用分号连接，清楚呈现并列关系，避免重复使用“和”造成生硬。
