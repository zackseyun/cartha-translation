  yaml_path: translation/ot/genesis/036/038.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: zh_hans
  text: 扫罗死了，亚革波的儿子巴力·哈南继位作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות的Qal叙事形式，直陈死亡；“死了”自然、准确，不采用委婉语。
- source_word: שָׁאוּל
  choice: 邵乌
  rationale: 按希伯来语姓名Šāʾûl音译，并与传统译名“扫罗”所代表的同一名字形式适度区分，以符合本段以东王表的音译需要。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在王位承继公式中表示担任君王；“作王”简洁自然，也保留王表的凝练风格。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תחת加代词后缀在继位语境中表示取代前任的位置；“接替他”清楚表达王位承继。
- source_word: בַּעַל חָנָן
  choice: 巴力·哈南
  rationale: 按复合姓名Baʿal-ḥānān音译，以间隔号标示两个语素，兼顾读音与中文姓名可读性。
- source_word: בֶּן
  choice: 的儿子
  rationale: 构造形式在此表示直接父子关系；依中文语序译为“亚革波的儿子”。
- source_word: עַכְבּוֹר
  choice: 亚革波
  rationale: 采用现代中文圣经人名中较可辨识且贴近希伯来语ʿAḵbôr的音译形式。
