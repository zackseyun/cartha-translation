    issue: 地点短语的修饰对象被改为“这些后代”。
    rationale: 希伯来文仅有“在西珥山地”的地点短语，位于“以扫、以东之父”之后；结合紧邻的36:8，地点应表明以扫住在西珥，而非断言其所有后代住在那里。草稿的“这些后代住在”增加了原文未明说的主语和断言。
  - severity: low
    issue: “后代”未充分呈现תּוֹלְדוֹת作为段落标题/记录的功能。
    rationale: “后代”本身可成立，但“后代记录”既保持现代汉语自然，也较好地反映《创世记》中这一重复的谱系标题用语。
  revised_text: 以下是以扫的后代记录；以扫是以东人的始祖，住在西珥山区。[a]
  revised_footnotes:
  - marker: a
    text: “西珥山区”也可译为“西珥山上”或“西珥群山中”。
    reason: 原文 הַר 在此既可指一座山，也可泛指山地或山区。
