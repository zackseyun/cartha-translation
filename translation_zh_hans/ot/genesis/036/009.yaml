revisions:
- from: 以下记载的是以扫的后代。以扫是以东人的始祖；这些后代住在西珥山区。[a]
  to: 以下是以扫的后代记录；以扫是以东人的始祖，住在西珥山区。[a]
  rationale: 修订保留本节的谱系标题性质，并将“住在西珥山区”的地点信息明确归于以扫，避免把原文未明确归属给后代的居住断言加进译文。脚注保留地理词的合理译法范围。
