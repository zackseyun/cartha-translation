  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּ/הַ֖ר שֵׂעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: zh_hans
  text: 以下是以扫的后代记录；以扫是以东人的始祖，住在西珥山区。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西珥山区”也可译为“西珥山上”或“西珥群山中”。
    reason: 原文 הַר 在此既可指一座山，也可泛指山地或山区。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下记载的是
  rationale: 承接上文，并以现代汉语自然引出新的谱系段落；不机械译出句首连接词。
- source_word: תֹּלְדוֹת
  choice: 后代
  rationale: 本节随后列举以扫的子孙，因此译为“后代”最切合此处语境；同时保留《创世记》谱系标题的功能。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֲבִי אֱדוֹם
  choice: 以东人的始祖
  rationale: 这里的“父”表达族群祖先身份；“始祖”在现代汉语中比直译“以东之父”更清楚，也避免把“以东”误解为单一个人。
- source_word: בְּהַר שֵׂעִיר
  choice: 住在西珥山区
  rationale: 介词短语在此修饰以扫谱系所处之地；הַר可指山地或山区。补出“住在”使中文关系明确，但不把西珥限定为单一山峰。
- source_word: שֵׂעִיר
  choice: 西珥
  rationale: 采用现代中文圣经中通行的地名译法。
theological_decisions:
- issue: “以东之父”所指为何
  choice: 以东人的始祖
  alternative: 以东之父
  rationale: 上下文把以扫视为以东族的祖先；此译呈现族源关系，不额外引入神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以下记载的是”承担谱系标题功能；分为两句以避免汉语长串同位结构。脚注标记置于相关地理短语之后。
