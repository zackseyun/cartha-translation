base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: zh_hans
  text: 以下是在以东地作王的诸王；他们是在以色列人有王统治以前作王的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在有王为以色列人作王以前。”希伯来文直译为：“在一位王为／向以色列众子作王以前。”
    reason: 保留לִבְנֵי יִשְׂרָאֵל中介词ל可译为“为／向”的形式可能，并说明“以色列众子”是原文字面表达。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 用于引出接下来的名单；省去汉语中显得生硬的句首“和”，以“以下是”自然表达希伯来文的提示和承接作用。
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: 作王的诸王
  rationale: מלך在此指行使王权；“作王”既贴近原文，又是现代中文圣经叙事中自然、庄重的表达。“诸王”体现复数和定指语境。
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: 在以东地
  rationale: 保留原文明确的“以东之地”这一地域表达，同时采用简洁自然的中文。
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: 还没有王统治
  rationale: 原文直译为“在一个王作王以前”。结合前半句改用时间从句，清楚表达以东诸王早于以色列王政；不加入“任何王”等原文没有明说的限定。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: בני ישראל在这里是指以色列民族的固定族称；现代汉语用“以色列人”最自然准确。介词ל与作王动词连用，可表示王权与该民族的关系，正文以“统治”表达。
theological_decisions:
- issue: בני ישראל应按字面译为“以色列众子”，还是按族称译为“以色列人”
  choice: 以色列人
  alternative: 以色列众子／以色列子孙
  rationale: 此处该短语作为民族名称使用，并非专门强调性别或血缘中的“儿子”；“以色列人”准确涵盖所指群体，也更符合现代标准汉语。
- issue: לִבְנֵי יִשְׂרָאֵל中的ל表示“统治”还是“为……作王”
  choice: 正文译为“王统治以色列人”，脚注保留“为以色列人作王”的可能表达
  alternative: 有王为以色列人作王
  rationale: 上下文谈论王权，中文“统治以色列人”最自然地表达作王所涉及的治理关系；但希伯来文介词ל本身不是通常表示“在……之上”的עַל，因此以脚注保存较贴近形式的另一译法，避免过度消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以下是”自然引出名单；分号和“他们作王的时候”避免中文中连续重复“作王”所造成的歧义，同时保留两个事件之间明确的先后关系。
