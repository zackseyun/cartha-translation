base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: zh_hans
  text: 这些是以扫的妻子阿何利巴玛所生的儿子；阿何利巴玛是亚拿的女儿，洗便的女儿。她给以扫生了耶乌施、雅兰和可拉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ בְּנֵי
  choice: 这些是……所生的儿子
  rationale: 这是家谱名单的引介语。“这些是”自然表达指示与系词；结合后文“她给以扫生了”，补出“所生的”使现代汉语清楚顺畅，并仍明确所列都是儿子。句首连接词 ו 在本节独立呈现时不必机械译作“而”。
- source_word: אָהֳלִיבָמָה
  choice: 阿何利巴玛
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: 亚拿的女儿，洗便的女儿
  rationale: 原文两次使用“女儿”，译文照实保留，没有改写成“孙女”，从而保存原文家谱表述本身可能带来的张力。
- source_word: אֵשֶׁת עֵשָׂו
  choice: 以扫的妻子
  rationale: 自然、准确地表达希伯来语附属结构。
- source_word: וַתֵּלֶד לְעֵשָׂו
  choice: 她给以扫生了
  rationale: “给以扫生了”自然表达介词 לְ 所标示的关系，同时避免把以扫误读为动词“生”的直接宾语。
- source_word: יעיש
  choice: 耶乌施
  rationale: 采用现代中文圣经中常见的音译形式。
- source_word: יַעְלָם
  choice: 雅兰
  rationale: 采用现代中文圣经中常见的音译形式。
- source_word: קֹרַח
  choice: 可拉
  rationale: 采用现代中文圣经中通行的音译形式。
theological_decisions:
- issue: “亚拿的女儿，洗便的女儿”的亲属关系
  choice: 照原文重复译作两个“女儿”
  alternative: 译作“亚拿的女儿、洗便的孙女”
  rationale: 原文明确重复 בַת，且本任务要求保留真实的歧义和家谱张力，不应在正文中替原文消解为隔代关系。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述。以分号和另起一句梳理较长的同位结构，同时保留原文两次“女儿”的表达。无脚注标记。
