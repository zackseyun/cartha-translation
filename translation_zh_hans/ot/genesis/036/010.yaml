base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: zh_hans
  text: 以扫众子的名字如下：以利法，是以扫的妻子亚大的儿子；流珥，是以扫的妻子巴实抹的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: 名字如下
  rationale: 保留希伯来文引出名单的呈现作用，同时采用自然、庄重的现代汉语表达。
- source_word: בְּנֵי עֵשָׂו
  choice: 以扫众子
  rationale: בְּנֵי 在此指以扫的男性后代；“众子”准确而简洁，也符合家谱语体。
- source_word: אֱלִיפַז
  choice: 以利法
  rationale: 按现代中文圣经中通行的希伯来人名译法音译。
- source_word: בֶּן עָדָה
  choice: 亚大的儿子
  rationale: בֶּן 表示直接的父母子女关系；中文用“……的儿子”清楚保留这一关系。
- source_word: אֵשֶׁת עֵשָׂו
  choice: 以扫的妻子
  rationale: 直译该领属结构；原文在两位母亲之后各重复一次，本译文也保留两次，以忠实呈现家谱的重复格式。
- source_word: רְעוּאֵל
  choice: 流珥
  rationale: 依照该希伯来人名的中文通行音译。
- source_word: בֶּן בָּשְׂמַת
  choice: 巴实抹的儿子
  rationale: 与前一处 בֶּן 的译法保持一致，明确母子关系。
- source_word: בָּשְׂמַת
  choice: 巴实抹
  rationale: 依照该希伯来人名的中文通行音译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的家谱语体。为避免中文中同位关系含混，将 אֵשֶׁת עֵשָׂו 前置为“以扫的妻子”，并保留原文两次重复；人名采用中文圣经通行译名。
