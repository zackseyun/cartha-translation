  yaml_path: translation/ot/genesis/036/020.yaml
  text: 'These are the sons of Seir the Horite[a], the inhabitants of the land: Lotan, Shobal, Zibeon, and Anah.'
translation:
  language: zh_hans
  text: 以下是何利人西珥的儿子，就是当地的居民[a]：罗坍、朔巴、祭便和亚拿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“住在那地的人”。
    reason: 词语表达方式的另一种译法；希伯来语 יֹשְׁבֵי הָאָרֶץ 字面为“住在那地的人”。
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这是
  rationale: 保留希伯来家谱名单常见的指示性引介；现代汉语用“这是”自然明晰。
- source_word: בְנֵי
  choice: 儿子
  rationale: 本节列出具名男性，直译“儿子”最符合近处语境，也保留家谱措辞。
- source_word: שֵׂעִיר
  choice: 西珥
  rationale: 采用现代中文圣经中通行的专名译法。
- source_word: הַחֹרִי
  choice: 何利人
  rationale: 作为族属称谓修饰西珥；“何利人西珥”简洁自然，并保留原文身份信息。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 当地的居民
  rationale: 复数主动分词结构指居住、定居在那地的人，并与前面的“儿子”在数上呼应；“当地的居民”是自然的现代汉语。
- source_word: לוֹטָן
  choice: 罗坍
  rationale: 采用通行的中文圣经专名译法。
- source_word: שׁוֹבָל
  choice: 朔巴
  rationale: 采用通行的中文圣经专名译法。
- source_word: צִבְעוֹן
  choice: 祭便
  rationale: 采用通行的中文圣经专名译法。
- source_word: עֲנָה
  choice: 亚拿
  rationale: 采用通行的中文圣经专名译法。
