base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: zh_hans
  text: 罗坍的儿子是何利和希幔[a]；罗坍的姐妹是亭纳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“希幔”；平行家谱《历代志上》1:39作“荷幔”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 是
  rationale: 此处在家谱中充当系词，说明罗坍的儿子是谁；现代汉语用“是”自然准确。
- source_word: בְנֵי
  choice: 儿子
  rationale: 后接两名男性人名，在家谱语境中特指男性子嗣，故不译作较宽泛的“儿女”或“后裔”。
- source_word: לוֹטָן
  choice: 罗坍
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: חֹרִי
  choice: 何利
  rationale: 这是人名，采用现代中文圣经中通行的音译。
- source_word: הֵימָם
  choice: 希幔
  rationale: 本节马所拉文本的读音为 Hêmām，采用中文传统音译“希幔”；平行经文所见不同形式另以脚注说明。
- source_word: וַאֲחוֹת לוֹטָן
  choice: 罗坍的姐妹
  rationale: אֲחוֹת意为“姐妹”。汉语可从前句承接判断句式，补出“是”，使表达完整自然。
- source_word: תִּמְנָע
  choice: 亭纳
  rationale: 这是女性人名，采用现代中文圣经中通行的音译。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留家谱条目的平行结构。将 אֲחוֹת 译为中性的“姐妹”，不从原文之外断定她相对罗坍是姐姐还是妹妹。英语拼写 Timna/Timnah 的差别在中文音译中不构成有意义的异文，因此不另设脚注。
