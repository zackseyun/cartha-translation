  naturalness: “来自大河边利河伯的扫罗”中地点修饰语堆叠，现代汉语读来不够顺畅。将来源状语后置并以“继位作王”表达王位更替，较自然且保持庄重简洁。
  terminology: “桑拉”“扫罗”“利河伯”可保留；“扫罗”是中文圣经中通行的该希伯来名字译法。地理限定宜避免把未指明的河流断定为“大河”。
