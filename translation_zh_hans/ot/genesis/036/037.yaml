  text: 桑拉死了；扫罗来自河边的利河伯，接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该叙事性动词承接并推进王位更替的记述；现代汉语用“死了”自然表达简单过去事件，无须另加“然后”。
- source_word: שַׂמְלָה
  choice: 桑拉
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在君王继任公式中表示执掌王权；“作王”简洁自然，也保留统治之意。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该短语在王位继承语境中指取代前王的位置；“接替他”比逐字译作“在他之下”准确，也符合现代汉语。
- source_word: שָׁאוּל
  choice: 扫罗
  rationale: 采用希伯来人名שָׁאוּל在现代中文圣经传统中的通行译名。
- source_word: מֵרְחֹבוֹת
  choice: 来自……利河伯
  rationale: 前缀מִן表示来源；“利河伯”在此是地名，不按普通名词“宽阔之地”意译。
- source_word: הַנָּהָר
  choice: 大河边
  rationale: 定冠词所限定的“河”在此用来标明利河伯的位置；“大河边”自然表达某条当地熟知的重要河流，同时避免无根据地认定具体河名。
