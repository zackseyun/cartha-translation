- from: 桑拉死了，来自大河边利河伯[a]的扫罗接替他作王。
  to: 桑拉死了；扫罗来自河边的利河伯，接替他作王。
  rationale: 修正脚注对希伯来文地名结构的误述，并调整正文语序，使“来自利河伯”的来源信息在现代汉语中更自然。以“河边的利河伯”译出地理限定，不把原文未指明的河流强化为“大河”；“接替他作王”保留王位继承公式中“代替他”的明确关系。
