  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: zh_hans
  text: 以下是以扫（就是[a]以东）的后代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以下是以扫的后代；他就是以东。”
    reason: 原文הוּא אֱדוֹם既可作括注式身份说明，也可读作较独立的陈述。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 该表达引出新的段落。“以下是”在现代汉语中自然地承担篇章开启功能；不另译为时间性的“现在”。
- source_word: תֹּלְדֹוֹת
  choice: 后代
  rationale: תּוֹלְדוֹת是《创世记》中反复出现的结构词，语义可涵盖世系、后代或相关记述。本节随即列出以扫的子孙，因此正文采用自然明确的“后代”，同时不把它扩展成原文没有明说的“家谱”。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הוּא
  choice: 就是
  rationale: 此处代词用于同位说明，表明以扫与以东的身份对应；“就是”比直译“他是”更符合现代汉语。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 采用现代中文圣经传统中通行的专名译法；此处是以扫的别名，也与其后形成的民族和地域名称相关。
theological_decisions:
- issue: תֹּלְדֹוֹת作为《创世记》的结构性标题
  choice: 后代
  alternative: 世系；记事
  rationale: 该词本身可指所生的后代，也可引出与某人相关的记述。鉴于本章内容主要是以扫的子孙名单，译作“后代”最自然；但承认“世系”或“记事”能够更明显保留全书标题公式的结构功能。
- issue: הוּא אֱדוֹם所表达的身份关系
  choice: （就是以东）
  alternative: ；他就是以东
  rationale: 正文按同位解释处理，清楚表明以扫就是以东，同时用脚注保留将其视为独立陈述的句法可能，不对两者的细微语气差异作神学化处理。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“以下是”适合作为谱系段落的开头；括号保留原文的身份说明，脚注明示另一种句法理解。
