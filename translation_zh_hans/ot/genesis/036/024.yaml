base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: zh_hans
  text: 洗便的儿子是亚雅和亚拿。这位亚拿就是在旷野为他父亲洗便放牧驴时，发现耶明[a]的那位亚拿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“耶明”的意思不能确定。有人理解为“温泉”；一些古代和后来的解释则认为是“骡子”。由于词义证据不足，正文保留音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי צִבְעוֹן
  choice: 洗便的儿子
  rationale: 在家谱语境中，בְנֵי直接指男性子嗣；采用现代中文圣经人名的常见译写。
- source_word: אַיָּה
  choice: 亚雅
  rationale: 按希伯来语人名音译，并采用现代中文易读形式。
- source_word: עֲנָה
  choice: 亚拿
  rationale: 按希伯来语人名音译，并在本节内保持一致。
- source_word: הוּא עֲנָה
  choice: 这位亚拿就是……的人
  rationale: 表达代词加人名的特指、辨认作用，同时使中文句式自然。
- source_word: מָצָא
  choice: 发现了
  rationale: 既保留“找到、发现”的基本义，也适合在旷野遇见某种此前未知事物的语境。
- source_word: הַיֵּמִם
  choice: 耶明
  rationale: 该词仅见于此处，确切含义无法确定；正文保留音译，避免把“温泉”或“骡子”等有争议的解释写成定论。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר通常指荒野、牧放之地；“旷野”比“沙漠”涵盖面更准确。
- source_word: בִּרְעֹתוֹ אֶת הַחֲמֹרִים
  choice: 放驴时
  rationale: 介词加不定式表示同时发生的动作；“放驴”简洁自然，准确表达牧放驴群。
- source_word: לְצִבְעוֹן אָבִיו
  choice: 替他父亲洗便
  rationale: לְ在此表示为某人照管牲畜；调整同位语语序以符合现代汉语表达。
theological_decisions:
- issue: הַיֵּמִם所指何物
  choice: 正文音译为“耶明”，脚注列出主要解释
  alternative: 正文译作“温泉”或“骡子”
  rationale: 词义证据不足，古代译本与后世解释也不一致；保留音译可维护原文真实的不确定性，避免赋予某一解释神学或历史上的确定地位。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这位亚拿就是……的人”清楚体现家谱中的身份辨认；“放驴”通俗准确。正文脚注标记与脚注相互对应。
