revisions:
- from: 洗便的儿子是亚雅和亚拿。这位亚拿就是在旷野替他父亲洗便放驴时，发现了耶明[a]的人。
  to: 洗便的儿子是亚雅和亚拿。这位亚拿就是在旷野为他父亲洗便放牧驴时，发现耶明[a]的那位亚拿。
  rationale: 删除无原文根据的“人”，使“耶明”继续作为词义未定的发现对象。重组后半句，保留 הוּא עֲנָה 对这位亚拿的辨认功能，并以“为他父亲洗便放牧驴时”自然表达其牧放父亲牲畜的同时性。
