  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: zh_hans
  text: 亭纳是以扫的儿子以利法的妾；她给以利法生了亚玛力。这些人都是以扫的妻子亚大的后代[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代”原文直译为“儿子们”；在家谱中，这个词也可包括孙辈或更广义的后裔。
    reason: 说明希伯来语亲属词的语义范围，以及正文依上下文采用“后代”的原因。
lexical_decisions:
- source_word: וְתִמְנַע
  choice: 亭纳
  rationale: 专名按现代中文圣经通行译名音译；句首连接词融入上下文，不机械译出。
- source_word: הָיְתָה פִילֶגֶשׁ לֶאֱלִיפַז
  choice: 是以利法的妾
  rationale: היה在此作系词；פִילֶגֶשׁ指地位次于正妻、但具有公认关系的女子，译作“妾”简洁且符合本段古代家族语境。介词ל按中文领属关系自然表达。
- source_word: בֶּן עֵשָׂו
  choice: 以扫的儿子
  rationale: 直接表达希伯来语构词链的亲子关系，语序自然。
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: 她给以利法生了亚玛力
  rationale: 保留 ילד 的生育含义，也保留介词ל所标示的父系家谱关系；中文“给……生了……”自然对应这一结构。
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: 这些人都是亚大的后代
  rationale: בָּנִים在家谱中可泛指儿孙或后裔；本句所概括的人包括亚大的孙辈，因此正文用“后代”既符合语境，也不把范围误限为亲生儿子。
- source_word: אֵשֶׁת עֵשָׂו
  choice: 以扫的妻子
  rationale: 按中文自然语序表达构词链，并作为同位说明亚大的身份。
theological_decisions:
- issue: בְּנֵי是否应限定为亚大的亲生“儿子”
  choice: 后代
  alternative: 儿子／子孙
  rationale: 原词可用于较广的家谱关系，而上下文中的以利法诸子和亚玛力是亚大的孙辈。译作“后代”保留其家谱集合意义，避免制造并非原文所要求的亲子关系矛盾；脚注同时交代字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体；人名沿用简体中文圣经常见译法。分号划分身份说明与生育叙事，末句用“这些人”清楚回指本段所列成员。
