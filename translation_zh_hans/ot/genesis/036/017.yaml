base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: zh_hans
  text: 以下是以扫的儿子流珥的儿子：族长[a]拿哈、族长谢拉、族长沙玛、族长米撒。这些是以东地流珥一系的族长。这些是以扫的妻子巴实抹的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族长”也可译作“首领”；原文这个词在此指以东部族或宗族的领袖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 承接上文并引出新的家谱名单；中文用“如下”自然体现希伯来文的列举公式。
- source_word: בְּנֵי רְעוּאֵל בֶּן עֵשָׂו
  choice: 以扫的儿子流珥的众子
  rationale: 保留两代父子关系，同时用现代汉语清楚表达修饰层级。
- source_word: אַלּוּף
  choice: 族长
  rationale: 在以东谱系语境中指部族或宗族的领袖；“族长”比古雅或带封建爵位色彩的译法更贴合原文。
- source_word: נַחַת
  choice: 拿哈
  rationale: 按现代中文圣经人名惯例音译。
- source_word: זֶרַח
  choice: 谢拉
  rationale: 按现代中文圣经人名惯例音译。
- source_word: שַׁמָּה
  choice: 沙玛
  rationale: 按希伯来语读音及现代中文圣经人名惯例音译。
- source_word: מִזָּה
  choice: 米撒
  rationale: 按希伯来语读音及现代中文圣经人名惯例音译。
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: 这些是……流珥一系的族长
  rationale: “流珥一系”自然表达属流珥谱系或宗族的领袖，避免误解为由流珥管辖的官员。
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: 在以东地
  rationale: 保留原文明确出现的“地”，而不简化为“在以东”。
- source_word: אֵלֶּה בְּנֵי בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: 他们都是以扫的妻子巴实抹的子孙
  rationale: 此处 בְּנֵי 在谱系中涵盖后代；名单所列是巴实抹经流珥而出的后裔，因此“子孙”既符合语境，也保留亲属谱系含义。
theological_decisions:
- issue: בְּנֵי 在末句所指的亲属层级
  choice: 子孙
  alternative: 儿子
  rationale: 上下文表明所列人物是巴实抹之子流珥的儿子，即她的孙辈；希伯来语“众子”可宽泛指后代，译作“子孙”避免制造与谱系不符的直系关系，不涉及额外神学推断。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。保留家谱段落的重复结构和“以东地”等原文特征；人名沿用通行中文圣经译名。
