base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: zh_hans
  text: 因为他们的财物太多，不能同住；他们寄居之地[a]也因他们的牲畜而容纳不下他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们暂居的地方”。原文保留了他们以寄居者身份临时居住的含义。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“不能承受他们”或“不能负载他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明以扫迁离雅各的原因；现代汉语用“因为”自然保留解释关系。
- source_word: רְכוּשָׁם
  choice: 他们的财物
  rationale: 指他们所拥有的动产和产业；“财物”含义宽泛，也符合本节涉及牲畜等财产的语境。
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: 太多，不能住在一起
  rationale: רָב 与 מן 加不定式结构表示数量多到无法共同居住；此译法清楚表达由过多财物造成的实际限制。
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: 他们寄居之地
  rationale: 保留 מְגוּרִים 所表达的临时居住、以外来者身份居留之意，也延续创世记的寄居主题。
- source_word: לָשֵׂאת אֹתָם
  choice: 承载不了他们
  rationale: נשא 本义为“负载、承受”；以土地为主语时，“承载不了”既保留原文意象，又能表达土地不足以容纳、供养他们的含义。
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: 因为他们的牲畜太多
  rationale: מִפְּנֵי 表原因，מִקְנֶה 泛指牲畜。汉语补出语境隐含的“太多”，使土地无法承载的因果关系清楚，但不把牲畜窄化为牛或某类畜群。
