  terminology: 人名“阿何利巴玛、耶乌施、雅兰、可拉、亚拿、以扫”一致且可接受。“首领”比“族长”更准确地覆盖 אַלּוּף 的职位性、群体性意义，脚注可保留“宗族首领”作为语境化释义。
