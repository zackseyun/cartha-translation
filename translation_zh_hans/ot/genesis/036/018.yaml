base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: zh_hans
  text: 以扫的妻子阿何利巴玛的儿子如下：首领[a]耶乌施、首领雅兰、首领可拉。以上是亚拿的女儿、以扫的妻子阿何利巴玛的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宗族首领”。希伯来语这个词在这里指以东各宗族或群体的领袖。
    reason: 说明 אַלּוּף 在以东家谱语境中的群体首领含义及可选译法。
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 原文为阳性复数“儿子”，且随后列出三名男性，不宜泛化为“后代”。
- source_word: אֵשֶׁת עֵשָׂו
  choice: 以扫的妻子
  rationale: 以自然的现代汉语领属结构表达，且两处保持一致。
- source_word: אַלּוּף
  choice: 族长
  rationale: 在《创世记》36章的以东语境中，此词指宗族或部族的首领；“族长”简洁庄重，也避免使用古旧爵位称呼。
- source_word: יְעוּשׁ
  choice: 耶乌施
  rationale: 按希伯来语人名音译，并沿用中文圣经中通行的译名。
- source_word: יַעְלָם
  choice: 雅兰
  rationale: 按希伯来语人名音译，并沿用中文圣经中通行的译名。
- source_word: קֹרַח
  choice: 可拉
  rationale: 按希伯来语人名音译，并沿用中文圣经中通行的译名。
- source_word: אֵלֶּה אַלּוּפֵי
  choice: 以上是……的族长
  rationale: 保留原文总结性的指示结构及领属表达，不在正文中明确增添“所出的”或“后裔”等原文未明说的关系。
- source_word: בַּת עֲנָה
  choice: 亚拿的女儿
  rationale: 直接、自然地表达希伯来语构造关系。
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: ……如下……以上是
  rationale: 用自然汉语再现两次指示语所形成的家谱框架，同时避免生硬重复“这些是”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的家谱体语言。人名使用简体中文圣经常见译名；重复保留三个“族长”，以对应原文每个人名前重复出现的 אַלּוּף。末句保留“阿何利巴玛的族长”这一较宽泛的领属关系，不把原文的含义收窄为明确的血缘措辞。
