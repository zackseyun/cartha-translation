base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/033.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: zh_hans
  text: 比拉死了，谢拉的儿子、来自波斯拉[a]的约巴接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“波斯拉人约巴”。这里的希伯来语介词既可表示来自该城，也可表示与该城有关联。
    reason: 保留מִן在来源与地方归属之间的词义可能。
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: וַיָּמָת是מות的叙事性连续式，表示接续发生的事件；汉语明确补出主语“比拉”。
- source_word: בָּלַע
  choice: 比拉
  rationale: 按现代汉语圣经人名惯例音译。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在王位更替的固定语境中表示登位并执掌王权；“作王”简洁自然。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תחת加第三人称后缀表示取代前任、继承其位置；“接替他”清楚传达王位承继关系。
- source_word: יוֹבָב
  choice: 约巴
  rationale: 按现代汉语圣经人名惯例音译。
- source_word: בֶּן זֶרַח
  choice: 谢拉的儿子
  rationale: 如实表达希伯来语属格结构所标明的父子关系。
- source_word: מִבָּצְרָה
  choice: 来自波斯拉
  rationale: 前缀מִן通常表示来源；此处首选“来自波斯拉”，同时以脚注保留其表示地方归属或关联的可能。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“接替他作王”既符合中文王位更替的表达，也保留原文简洁的叙事推进。脚注标记紧随其所解释的地名短语。
