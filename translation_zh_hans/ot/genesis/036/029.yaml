  yaml_path: translation/ot/genesis/036/029.yaml
  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: zh_hans
  text: 以下是何利人的族长：罗坍族长[a]、朔巴族长、祭便族长、亚拿族长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族长”也可译作“宗族首领”或“部族首领”；希伯来语此词可指一个宗族或部族的首领。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以下是
  rationale: 这是指示复数，用来引出名单；汉语以“以下是”自然补出判断关系。
- source_word: אַלּוּפֵי / אַלּוּף
  choice: 族长
  rationale: 在《创世记》36章的语境中，此词指以东或何利人宗族、部族的首领；“族长”既符合现代汉语，也保留其群体领袖的含义。原文在每个人名前重复单数形式，译文亦逐一保留。
- source_word: הַחֹרִי
  choice: 何利人
  rationale: 原文虽为带冠词的单数族称，语境中却是集合性的民族称谓；汉语自然译为“何利人”。
- source_word: לוֹטָן
  choice: 罗坍
  rationale: 按现代中文圣经常见的人名音译。
- source_word: שׁוֹבָל
  choice: 朔巴
  rationale: 按现代中文圣经常见的人名音译。
- source_word: צִבְעוֹן
  choice: 祭便
  rationale: 按现代中文圣经常见的人名音译。
- source_word: עֲנָה
  choice: 亚拿
  rationale: 按现代中文圣经常见的人名音译。
