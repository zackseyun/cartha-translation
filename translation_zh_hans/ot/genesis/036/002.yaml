  - severity: low
    issue: 脚注“校读为‘何利人’”措辞略强
    rationale: 所给WLC文本明确为“希未人”。“何利人”主要是根据本章其他家谱资料作协调性理解；脚注宜说“理解为”或“与……相协调”，避免暗示此处有已提供的直接文本异读证据。
