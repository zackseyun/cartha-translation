base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: zh_hans
  text: 以扫娶了迦南女子为妻：赫人以伦的女儿亚大，以及希未人祭便的女儿、亚拿的女儿阿何利巴玛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“希未人”。有些人根据本章相关家谱，将这里的族属理解为“何利人”。
    reason: 保留马所拉文本“希未人”，并提示其与创世记36章相关家谱称谓之间的张力，而不在正文中协调。
lexical_decisions:
- source_word: לָקַח אֶת־נָשָׁיו
  choice: 娶了……为妻
  rationale: לָקַח 字面为“取、拿”，与“妻子”连用时自然表示娶妻；中文若直译为“取了他的妻子”不够自然，因此按语境译为“娶了……为妻”。
- source_word: מִבְּנוֹת כְּנָעַן
  choice: 迦南女子
  rationale: 希伯来语直译为“迦南的女儿们”，是指迦南当地或族群中的女子；现代中文用“迦南女子”清楚自然，同时保留其群体归属。
- source_word: הַחִתִּי
  choice: 赫人
  rationale: 这是 חִתִּי 的通行中文族名。原文在以伦之后明确作“赫人”，不采用英语咨询层脚注中误称此处为“希未人”的说法。
- source_word: בַּת עֲנָה בַּת צִבְעוֹן
  choice: 祭便的孙女、亚拿的女儿
  rationale: 连续两个 בַּת 都修饰阿何利巴玛，表达她是亚拿的女儿、祭便的孙女；调整中文次序可自然呈现两层亲属关系。
- source_word: הַחִוִּי
  choice: 希未人
  rationale: 马所拉文本末句明确读作 חִוִּי，即“希未人”；正文依所给 WLC 文本翻译。
theological_decisions:
- issue: 祭便的族属与相关家谱之间的张力
  choice: 正文依马所拉文本译作“希未人”
  alternative: 依据创世记36章其他家谱材料理解或校读为“何利人”
  rationale: 所给希伯来文本明确为“希未人”，因此正文不作协调性改写；相关家谱中出现“何利人”的称谓，故以脚注保留这一文本与家谱张力。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述。“娶了……为妻”符合中文婚姻语境；人名采用常见和合本传统译名，以伦、亚大、祭便、亚拿、阿何利巴玛。脚注标记置于涉及“希未人”及整段谱系说明的句末。
