base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: zh_hans
  text: 以下是以扫各族长的名字，按他们的宗族和所在地逐名列出：族长亭纳[a]、族长亚勒瓦[b]、族长耶帖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亭纳”也可音译为“亭拿”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“亚勒瓦”；另见《历代志上》1:51的相关异形“亚利亚”。
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: 以下……名字如下
  rationale: 用现代汉语自然引出名单；既体现连接词和指示词的承接作用，也保留“名字”的明确表达。
- source_word: אַלּוּפֵי / אַלּוּף
  choice: 族长
  rationale: 此词在《创世记》36章指以东的部族或宗族首领。“族长”符合上下文，也避免使用带有欧洲封建爵位色彩的译法。名单中在每个人名后重复这一称号。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着他们的宗族
  rationale: מִשְׁפָּחָה 在此指较广的亲族或部族群体，“宗族”比现代汉语的“家庭”更贴合语境。
- source_word: לִמְקֹמֹתָם
  choice: 和所在地
  rationale: מָקוֹם 本义为“地方、所在之处”。“所在地”保留其地域含义，而不将其过度限定为“定居点”。
- source_word: בִּשְׁמֹתָם
  choice: 名字如下
  rationale: 这里表示按名字逐一列出。译为“名字如下”比直译“按着他们的名字”更符合现代汉语列举方式。
- source_word: תִּמְנָע
  choice: 亭纳
  rationale: 按希伯来语专名音译，并与现代中文圣经人名习惯相协调。
- source_word: עַלְוָה
  choice: 亚勒瓦
  rationale: 依本节马所拉文本 עַלְוָה 音译，不与《历代志上》1:51的相关异形名称强行统一。
- source_word: יְתֵת
  choice: 耶帖
  rationale: 依本节希伯来语形式音译，不因其他相似人名而改写。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的名单体表达。“族长”兼顾 אַלּוּף 的部族领导含义；“按着他们的宗族和所在地”保留原文分类结构。“名字如下”适度调整语序，使中文自然。脚注标记均置于对应人名之后。
