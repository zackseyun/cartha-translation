base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: zh_hans
  text: 可拉族长、迦坦族长、亚玛力族长；这些是在以东地的以利法族长；这些都是亚大的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: 族长
  rationale: 本节指以东宗族或部族的首领；“族长”既体现其领导身份，也比泛称“首领”更贴合族谱语境。
- source_word: גַּעְתָּם
  choice: 迦坦
  rationale: 按希伯来语人名 Gaʿtām 音译，并与中文圣经常见译名保持一致。
- source_word: בְּנֵי עָדָה
  choice: 亚大的子孙
  rationale: בֵּן 的复数在族谱中可泛指后裔；此处所列并非全是亚大的直接儿子，因此译为“子孙”更准确。
theological_decisions:
- issue: “以利法的族长”所表达的关系
  choice: 以利法一系的族长
  alternative: 以利法的族长
  rationale: 原文属格关系较简略；“一系”自然表达这些族长出自以利法的后裔群体，同时不增加宗派性解释。
translation_notes:
  register: 采用简洁、庄重的现代普通话，保留族谱名单的并列节奏；人名使用常见中文圣经音译。
