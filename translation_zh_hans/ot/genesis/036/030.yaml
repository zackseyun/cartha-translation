  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: zh_hans
  text: 底顺族长、以察族长、底珊族长——这些是在西珥地按各自宗族[a]列出的何利人族长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按各自宗族”或译“按他们各自的族长”。这里的希伯来语可指按族长分类，也可指这些族长所代表的宗族单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: 族长
  rationale: 本章语境指以东人和何利人中宗族或部族的首领；“族长”既准确又符合现代中文族谱叙述，并保留原文的重复结构。
- source_word: דִּשֹׁן / אֵצֶר / דִּישָׁן
  choice: 底顺／以察／底珊
  rationale: 按现代中文圣经常用译名音译，并清楚区分原文中的“底顺”和“底珊”。
- source_word: אַלּוּפֵי הַחֹרִי
  choice: 何利人的族长
  rationale: הַחֹרִי在此是族群名称；用“何利人”表达集合意义，中文自然清楚。
- source_word: לְאַלֻּפֵיהֶם
  choice: 按着他们各自的族系
  rationale: 介词לְ在此具有分类、归属之意；אַלּוּף的复数带物主后缀，在该总结语境中可指由族长代表的宗族单位。“族系”避免“族长……按着族长”的生硬重复，但以脚注保留直译可能。
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: 西珥地
  rationale: 准确传达地理短语“在西珥之地”，也是现代中文自然而庄重的表达。
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 原文为无系词句；中文补出“是”，适合本段名单总结的语境。
