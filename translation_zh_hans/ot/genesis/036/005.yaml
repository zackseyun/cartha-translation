review_pass:
  verdict: revise
  source_fidelity: 首句准确反映אָהֳלִיבָמָה为母亲主语及所列三子。次句的“这些是以扫的儿子”准确对应אֵלֶּה בְּנֵי עֵשָׂו，并保留“迦南地”。但“都是他在迦南地所生的”在现代汉语中通常表示以扫亲自生育，错误地将生育动作归给男性主语，未能恰当表达希伯来文被动式יֻלְּדוּ לוֹ（生给他／归他为子）。
  naturalness: 人名及家谱式句法自然庄重。将末句改为“都是在迦南地为他所生的”，既避免“他所生的”的歧义和不合常规搭配，也自然保留母亲在本分句中未明言、而由被动式呈现的特点。
  terminology: “阿何利巴玛、耶乌施、雅兰、可拉、以扫、迦南地”均可接受，并与中文圣经传统常见形式一致。“儿子”准确反映此处男性后代。
  issues:
  - severity: medium
    issue: “都是他在迦南地所生的”将生育行为归于以扫。
    rationale: 中文“某人所生的”通常以该人为生育者；而原文יֻלְּדוּ לוֹ是被动式，意思是这些儿子在迦南地“为他所生”或“生给他”，并未在该分句中把以扫说成生育者。
  revised_text: 阿何利巴玛生了耶乌施、雅兰和可拉。这些是以扫的儿子，都是在迦南地为他所生的。
