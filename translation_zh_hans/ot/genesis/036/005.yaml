  to: 阿何利巴玛生了耶乌施、雅兰和可拉。这些是以扫的儿子，都是在迦南地为他所生的。
  rationale: 仅调整末句的汉语表达，以忠实反映希伯来文的被动结构及其“归以扫为子”的含义；不补出该分句未明确说出的母亲，也保留出生地点。
