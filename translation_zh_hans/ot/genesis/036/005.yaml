lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: 阿何利巴玛
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: יָלְדָה
  choice: 生了
  rationale: 保留女性主语和家谱语体；“生了”在现代汉语中简洁自然。
- source_word: יעיש
  choice: 耶乌施
  rationale: 按希伯来语人名音译。
- source_word: יַעְלָם
  choice: 雅兰
  rationale: 按希伯来语人名音译，并采用中文圣经传统中通行的形式。
- source_word: קֹרַח
  choice: 可拉
  rationale: 按希伯来语人名音译，并采用中文圣经传统中通行的形式。
- source_word: בְּנֵי
  choice: 儿子
  rationale: 此处所列均为男性后代，故准确译为“儿子”，不泛化为“儿女”或“后代”。
- source_word: עֵשָׂו
  choice: 以扫
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: 都是他……所生的
  rationale: 保留希伯来语被动结构表达这些儿子归于以扫的含义；中文用“他所生的”自然表达父系关系，也不额外补出本分句未明说的母亲。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: 在迦南地
  rationale: 明确保留 אֶרֶץ“地、土地”，同时符合现代中文地名表达。
