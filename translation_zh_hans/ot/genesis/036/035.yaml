  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: zh_hans
  text: 户珊死了，比达的儿子哈达接替他作王；他曾在摩押的田野击打米甸[a][b]。他的城名叫亚维特。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击打米甸”也可译作“击败米甸”。希伯来语原文是分词结构，直译为“那击打米甸的”。
    reason: lexical_alternative
  - marker: b
    text: “摩押的田野”也可理解为“摩押的乡野”或“摩押境内”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת חֻשָׁם
  choice: 户珊死后
  rationale: מות直指死亡，不采用委婉说法；结合后续王位承接关系，以“死后”自然连接上下文。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: 接替他作王
  rationale: מלך表示作王、掌权，תחתיו表示取代前任；此译兼顾王位继承关系与现代汉语表达。
- source_word: הֲדַד בֶּן בְּדַד
  choice: 比达的儿子哈达
  rationale: 按希伯来语亲子结构翻译，并采用简明、通行的中文音译形式。
- source_word: הַמַּכֶּה אֶת־מִדְיָן
  choice: 曾击打米甸
  rationale: נכה的使役分词直译为“击打”，保留它可能指攻打、重创或击败的语义幅度；מִדְיָן仍译作专名“米甸”，不擅自明确为“米甸人”。
- source_word: בִּשְׂדֵה מוֹאָב
  choice: 在摩押的田野
  rationale: שׂדה基本义为“田野”，在地理语境中也可泛指乡野、地域；正文保留较具体的字面意象，脚注说明较宽泛的理解。
- source_word: וְשֵׁם עִירוֹ עֲוִית
  choice: 他的城名叫亚维特
  rationale: 采用自然的现代汉语命名句式；עֲוִית作为地名按希伯来语辅音与读音音译为“亚维特”。
