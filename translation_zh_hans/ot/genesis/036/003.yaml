  language: zh_hans
  text: 又娶了巴实抹，她是以实玛利的女儿、尼拜约的姐妹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: 又娶了
  rationale: וְ承接上文妻子名单，אֵת是直接宾语标记，不单独翻译；依据上文“以扫娶了”（36:2）补出省略的谓语，使本节在现代汉语中完整自然。
- source_word: בָּשְׂמַת
  choice: 巴实抹
  rationale: 人名按现代中文圣经通行形式音译。
- source_word: בַּת
  choice: 女儿
  rationale: 构造关系表示亲子关系；中文用“以实玛利的女儿”自然表达。
- source_word: יִשְׁמָעֵאל
  choice: 以实玛利
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֲחוֹת
  choice: 妹妹
  rationale: 原词本身只表示“姐妹”，未明说长幼；但创世记25:13及代上1:29把尼拜约列为以实玛利的长子，因此在亲属关系中译作“妹妹”符合叙事资料。
- source_word: נְבָיוֹת
  choice: 尼拜约
  rationale: 采用现代中文圣经中常见的音译形式。
