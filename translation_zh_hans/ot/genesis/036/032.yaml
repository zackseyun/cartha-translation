  yaml_path: translation/ot/genesis/036/032.yaml
  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
translation:
  language: zh_hans
  text: 比珥的儿子比拉在以东作王[a]，他的城名叫亭哈巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作以东的王。”希伯来语直译为“在以东作王”；介词本身表示地点，但这里也可按语境表达其统治范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在君王名录的语境中，מלך表示登基并执掌王权；“作王”既自然，也符合上下文的继位叙述格式。
- source_word: בֶּאֱדוֹם
  choice: 在以东
  rationale: 介词 בְּ 首先表示地点，直译为“在以东”；上下文也可理解为统治范围，即“作以东的王”。
- source_word: בֶּלַע
  choice: 比拉
  rationale: 人名按现代中文圣经常用音译处理。
- source_word: בֶּן בְּעוֹר
  choice: 比珥的儿子
  rationale: 准确表达希伯来语标准的父子关系结构。
- source_word: וְשֵׁם עִירוֹ
  choice: 他的城名叫
  rationale: 保留第三人称阳性单数后缀“他的”，并以自然现代汉语表达城市名称的引介公式。
- source_word: דִּנְהָבָה
  choice: 亭哈巴
  rationale: 地名采用现代中文圣经中较通行的音译。
