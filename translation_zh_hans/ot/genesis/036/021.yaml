  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: zh_hans
  text: 底顺、以察、底珊。这些是以东地何利人、西珥子孙的族长[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族长”也可译作“部族首领”；希伯来语指宗族或群体的社会政治领袖。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִשׁוֹן
  choice: 底顺
  rationale: 专有的人名，采用现代中文圣经读者较熟悉的音译，并与同名人物的译法保持一致。
- source_word: אֵצֶר
  choice: 以察
  rationale: 专有的人名，按通行中文圣经传统音译。
- source_word: דִישָׁן
  choice: 底珊
  rationale: 专有的人名，以音译处理，并与“底顺”清楚区分。
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 复数指示词在此引出身份说明；中文自然补出判断词“是”。
- source_word: אַלּוּפֵי
  choice: 族长
  rationale: 本章语境中指以东或何利群体的宗族首领；“族长”既体现领导身份，也保留其宗族政治背景，避免古旧或爵位化的表达。
- source_word: הַחֹרִי
  choice: 何利人
  rationale: 原文虽采用带冠词的单数形式，但在此作集体族称；中文用“何利人”自然表达该族群。
- source_word: בְּנֵי שֵׂעִיר
  choice: 西珥的子孙
  rationale: בְּנֵי 可直译为“儿子”，但此处概括前列各支系人物，现代中文以“子孙”更自然地表达谱系后裔关系。
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: 住在以东地
  rationale: 保留“以东地”的完整地理表达；依中文句法补出“住在”，明确原文介词短语所表达的所在地关系。
