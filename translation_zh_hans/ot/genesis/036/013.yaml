base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: zh_hans
  text: 流珥的儿子是拿哈、谢拉、沙玛和米撒。这些人是以扫的妻子巴实抹的后代。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה בְּנֵי רְעוּאֵל
  choice: 流珥的儿子是
  rationale: וְאֵלֶּה承接前文并引出族谱名单；现代汉语在单节中无需硬译句首连接词。בְּנֵי在此指流珥直接所生、随后逐一列名的男性后代，因此译为“儿子”。
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: 拿哈、谢拉、沙玛和米撒
  rationale: 各专名按现代中文圣经通行形式音译；以顿号及末项前的“和”自然呈现希伯来语名单。
- source_word: אֵלֶּה הָיוּ
  choice: 这些人是
  rationale: 这是族谱中的归类句式。译为“这些人是”既体现复数指代，也符合现代汉语表达。
- source_word: בְּנֵי בָשְׂמַת
  choice: 巴实抹的后代
  rationale: בְּנֵי可宽泛指后裔。按本章上下文，所列四人是巴实抹之子流珥的儿子，故中文用“后代”既忠于该词的语义范围，也避免误解为她的亲生儿子；不把原文未明说的代数限定为“孙子”。
- source_word: אֵשֶׁת עֵשָׂו
  choice: 以扫的妻子
  rationale: 依希伯来语属格关系自然译出，并置于“巴实抹”之前，符合现代汉语身份说明的语序。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留族谱的简洁重复结构；人名采用简体中文圣经中的通行译名。第二处בְּנֵי以“后代”表达原词可涵盖较广亲属层级的特点，同时依据上下文避免造成亲子关系矛盾。
