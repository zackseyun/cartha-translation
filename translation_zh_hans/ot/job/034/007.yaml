base_translation:
  language: en
  yaml_path: translation/ot/job/034/007.yaml
  text: What man is like Job[a], who drinks mockery like water?
translation:
  language: zh_hans
  text: 哪有像约伯这样的人[a]，喝讥诮如同喝水呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁像约伯，喝讥诮如同喝水呢？”
    reason: 保留מִי גֶבֶר反问结构较贴近字面的另一种表达。
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: 哪有……这样的人
  rationale: 这是带惊讶语气的反问。译作“哪有……这样的人”既传达“谁/什么人”的基本意思，也符合现代汉语的自然表达。
- source_word: כְאִיּוֹב
  choice: 像约伯
  rationale: 前缀כְ表示比较；“像约伯”直接保留原文的比较关系。
- source_word: יִשְׁתֶּה
  choice: 喝
  rationale: 未完成式在此描写约伯被指为具有的特征；汉语用无时态标记的“喝”即可自然表达。
- source_word: לַעַג
  choice: 讥诮
  rationale: 该名词表示嘲弄、讥笑或轻蔑的话。“讥诮”能保留言语嘲弄的意味，并适合本句庄重而尖锐的语气。
- source_word: כַמָּיִם
  choice: 如同喝水
  rationale: 保留原文鲜明的饮水比喻；补出第二个“喝”，使汉语比较结构清楚自然，并未增加新的语义。
theological_decisions:
- issue: “喝讥诮”所指的方向
  choice: 保留“喝讥诮”的原始比喻，不解释为“忍受别人的嘲笑”或“自己肆意嘲弄”
  alternative: 按上下文明确译成“把嘲弄人的话当水喝”或“承受讥诮如同喝水”
  rationale: 希伯来文本本身用的是紧凑比喻，具体是指吸纳、承受还是惯于发出讥诮，存在解释空间；正文不应替读者消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讥诮”比“嘲讽”稍具书面色彩，但准确承载原词的言语嘲弄意味；整句保留诗歌式反问和饮水比喻。
