  yaml_path: translation/ot/job/034/004.yaml
  text: Let us choose for ourselves what is just[a]; let us know among ourselves what is good.
translation:
  language: zh_hans
  text: 让我们为自己选择公正[a]；让我们一同辨明什么是好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让我们为自己选择正义；让我们一同辨明什么是好的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 该词可指公正、审判或裁决。这里作为共同选择和辨别的对象，译作“公正”既保留伦理与司法含义，也符合现代汉语表达。
- source_word: נִבְחֲרָה
  choice: 让我们……选择
  rationale: Qal 未完成式第一人称复数在此具有劝勉语气；“让我们……选择”自然传达共同意愿。
- source_word: לָּנוּ
  choice: 为自己
  rationale: 介词 ל 加第一人称复数代词可表示受益或关联；“为自己”突出参与者亲自作出共同判断的意味。
- source_word: נֵדְעָה
  choice: 让我们……辨明
  rationale: ידע 基本义为“知道”，但与“什么是好的”搭配时含有经过考察而识别、判明之意；“辨明”比直译“知道”更自然，并保留认知判断的语义。
- source_word: בֵינֵינוּ
  choice: 彼此
  rationale: 字面为“在我们中间”，这里表达共同商议和相互辨别；“彼此”简洁自然。
- source_word: מַה טּוֹב
  choice: 什么是好的
  rationale: טוֹב 可指好的、合宜的或有益的；“什么是好的”保留其宽广含义，也与前半句的“公正”形成平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语气；两个“让我们”保留希伯来文平行结构与共同商议的节奏。
