  text: If you have understanding[a], hear this; listen to the sound of my words.
translation:
  language: zh_hans
  text: 你若有明辨力，就听这事；要侧耳听我话语的声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要侧耳听我所说的话。”原文直译为“要侧耳听我话语的声音”。
    reason: 说明לְקוֹל מִלָּי可按汉语习惯简化，且保留原文“声音／话语”的具体结构。
lexical_decisions:
- source_word: וְאִם
  choice: 你若
  rationale: וְ与条件词אִם在此引出条件式劝告；现代汉语用“你若”自然表达，主语“你”由对听者的命令语境补出。
- source_word: בִּינָה
  choice: 有悟性
  rationale: בִּינָה指理解力、明辨力。“悟性”简洁而庄重，也适合以“若有……”表达原文省略系词的结构。
- source_word: שִׁמְעָה
  choice: 听
  rationale: 这是שׁמע的命令式，直接要求听者聆听；译作“听”可与下句较强调专注的“侧耳听”形成递进。
- source_word: זֹּאת
  choice: 这话
  rationale: 原文直译为“这个/这事”；结合发言语境补出“话”，使现代汉语清楚自然，又不扩大所指。
- source_word: הַאֲזִינָה
  choice: 侧耳听
  rationale: 该动词含专心倾听之意。“侧耳听”保留其较强的听觉意象，并与前面的“听”有所区别。
- source_word: לְקוֹל
  choice: ……的声音
  rationale: קוֹל可指“声音”或“嗓音”；保留“声音”反映原文“听……话语的声音”这一具体而略显强调的表达。
- source_word: מִלָּי
  choice: 我话语
  rationale: 该复数名词指所说的话。“我话语”直接保留第一人称所属关系和言语内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝告语气。“侧耳听”保留希伯来语的听觉意象；“我话语的声音”有意保留原文较具体的结构，并以脚注提供更自然的汉语译法。
