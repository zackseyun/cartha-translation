  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: zh_hans
  text: 因此，他认清他们的所作所为；他在夜间推翻他们[a]，他们被压碎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在夜间使他们倾覆。”原文“推翻”没有明说宾语；按上下文，所指的是受审判的恶人或掌权者。
    reason: 说明原文省略宾语，并保留“推翻／使倾覆”的词义选择。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文并表达推论或结果；“因此”简洁地保留了原文的逻辑关系。
- source_word: יַכִּיר
  choice: 认清
  rationale: 该使役词形在此表示辨认、察知或看清；“认清”既体现神洞察他们的行为，也不额外引入“审查”等含义。
- source_word: מַעְבָּדֵיהֶם
  choice: 他们的所作所为
  rationale: 指他们所做的事；此译自然通顺，并保留上下文中的道德分量。
- source_word: וְהָפַךְ
  choice: 推翻他们
  rationale: הפך可指翻转、倾覆或推翻。原文未明说宾语，但上下文指向正在受审判的人，因此正文补出“他们”，并以脚注说明。
- source_word: לַיְלָה
  choice: 在夜间
  rationale: 按时间副词用法处理，表达审判在夜间突然临到，不将其解释成动词的宾语。
- source_word: וְיִדַּכָּאוּ
  choice: 他们就被压碎
  rationale: דכא表示压碎、摧毁；被动译法符合词形及神施行审判的语境，“就”自然呈现前后结果关系。
theological_decisions:
- issue: 审判场景中未明说的主语和宾语
  choice: 各动词的主语理解为神，并将“推翻”的隐含宾语译作“他们”，指上下文中的恶人或有权势者。
  alternative: 可不补宾语，译作“他在夜间使之倾覆”；也有人可能把“夜”理解为与“推翻”关系更直接的成分，但语境较不支持。
  rationale: 约伯记34:24—26持续描述神洞察并审判有权势的恶人。补出“他们”使现代汉语意思完整，同时用脚注保留希伯来文未明说宾语这一事实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“认清”比单纯“知道”更能传达辨明、察知之意；“所作所为”自然表达行为且符合审判语境。句式保持简洁有力，以对应原文连续陈述的节奏。
