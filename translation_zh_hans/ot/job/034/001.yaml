lexical_decisions:
- source_word: וַיַּעַן
  choice: 又说
  rationale: ענה在此是引出接续发言的叙事公式。现代汉语通常不在无人提问时译作“回答”；结合后面的“说”，合译为“又说”既自然，也表明以利户继续发言。
- source_word: אֱלִיהוּא
  choice: 以利户
  rationale: 采用现代中文圣经中通行且易于辨认的人名音译。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר是普通的言说动词；译为“说”准确而自然。
- source_word: וַ
  choice: 又
  rationale: 句首叙事连接词推动话语进展；鉴于以利户此前已经发言，“又”贴切表达接续关系。
