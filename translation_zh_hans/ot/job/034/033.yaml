base_translation:
  language: en
  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: zh_hans
  text: 难道他要照你的意思作出报偿，因为你拒绝它[b]吗？该由你作选择[a]，不是我；你知道什么，就说出来吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “该由你作选择”也可理解为“你必须作出选择”。原文没有说明所选择的具体内容。
    reason: lexical_alternative
  - marker: b
    text: 本节开头按字面近于“难道他要从你那里报偿它吗？”希伯来语表达艰深；“拒绝”的对象也未明说，可能指上帝的审判、治理方式，或这里所说的报偿。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: 照你的意思
  rationale: 这个开头的希伯来语结构按字面可理解为“从你那里”或“与你同在之处”，但在本句语境中是问上帝的报应是否应由约伯的意愿来决定。“照你的意思”既自然，也保留了质问的锋芒。
- source_word: יְשַׁלְּמֶנָּה
  choice: 施行报应
  rationale: שלם 的 Piel 词形表示偿还、报偿或施行报应。这里主语依语境指上帝；阴性单数后缀所指不明，中文不强行补出具体宾语，以保留原文含混。
- source_word: כִּי מָאַסְתָּ
  choice: 只因你拒绝接受
  rationale: מאס 可指拒绝、不接受或轻视。原文未明说拒绝的对象，因此译文也不补明是上帝的审判、治理方式还是所说的报应。
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: 这要由你选择，而不是由我
  rationale: בחר 的基本义是“选择”。本句将约伯与以利户对比，要求约伯自己表明立场；“这要由你选择”传达其语用力度，同时不限定所选择的具体对象。
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: 你知道什么，就说出来吧
  rationale: 保留“所知道的”与“说”之间直接、带挑战意味的命令关系，并采用现代汉语自然句式。
theological_decisions:
- issue: “拒绝”所指的对象
  choice: 不在正文中补明对象
  alternative: 译作“你拒绝他的审判”或“你拒绝这种报应”
  rationale: 希伯来原文没有明示宾语；补明为上帝的审判、治理方式或某种报应都会过早消除经文本身的歧义。
- issue: “选择”的具体内容
  choice: 用“这要由你选择”保留开放性
  alternative: 明确译为“你必须选择如何回答”或“你来决定报应”
  rationale: 原文只说“你选择，而不是我”，并未说明选择的确切对象；正文不把它限定为裁定报应或选择答复。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“施行报应”比“偿还”更适合本段论及上帝按公义施行报偿的语境；通过不补出后缀和“拒绝”的明确对象，保留希伯来原文的语义张力。所有脚注标记均置于正文。
