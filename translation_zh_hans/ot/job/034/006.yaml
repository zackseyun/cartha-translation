base_translation:
  language: en
  yaml_path: translation/ot/job/034/006.yaml
  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: zh_hans
  text: '难道我会就自己有理一事说谎吗？[a]


    我的伤[b]无法医治，尽管我没有过犯。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可理解为陈述句：“我竟因自己的权利（或案件）被算为说谎的人。”
    reason: alternative_reading
  - marker: b
    text: “我的伤”字面为“我的箭”；“箭”很可能比喻他所受的创伤或苦难。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: 在……这件事上
  rationale: 在אכזב与מִשְׁפָּטִי的搭配中，表达“关于、就……而言”；这一译法符合现代汉语习惯，同时不把它限定为敌对性的“违背”。
- source_word: מִשְׁפָּטִי
  choice: 自己有理
  rationale: מִשְׁפָּט可指审判、公理、案件或应得的公正。此处涉及约伯对自身清白和正当申诉的坚持，“自己有理”自然地保留了法律与申辩的意味。
- source_word: אֲכַזֵּב
  choice: 我该……说谎吗
  rationale: כּזב的Piel词形可表达“说谎、显为虚假”。结合上下文，将本句处理为反问，呈现约伯不肯否认自己有理的立场；陈述式理解另见脚注。
- source_word: אָנ֖וּשׁ
  choice: 无法医治
  rationale: 该形容词表示病势危重、无可救治；用于伤痛时，“无法医治”准确而自然。
- source_word: חִצִּי
  choice: 我的伤
  rationale: 字面为“我的箭”，在此可能以箭指所造成的创伤或临到约伯的灾祸。正文译出语境中的喻义，字面意象保留在脚注。
- source_word: בְלִי
  choice: 尽管……没有
  rationale: בְּלִי表示缺少或没有；按两分句之间的语境关系，以“尽管”表达隐含的让步意味。
- source_word: פָשַׁע
  choice: 过犯
  rationale: פֶּשַׁע具有道德与法律层面的越界、悖逆含义，“过犯”比一般的“错误”更能保留其分量。
theological_decisions:
- issue: 以利户引述约伯言论时，首句应作反问还是陈述
  choice: 正文作反问：“难道我该在自己有理这件事上说谎吗？”
  alternative: 作陈述：“我的理受到否定，我反被算为说谎的人。”
  rationale: 希伯来文十分凝练，既可理解为约伯反问自己岂能否认正当申诉，也可理解为他声称自己虽有理却被视为说谎者。正文采用符合语境的反问，脚注保留另一种可能，避免消除原文张力。
- issue: חִצִּי的箭伤意象
  choice: 正文译为“我的伤”，脚注说明字面为“我的箭”
  alternative: 正文直译为“我的箭无法医治”
  rationale: “箭”在此很可能转指箭造成的创伤或所受的苦难。正文传达其实际所指，脚注保留原有意象，不进一步断定箭的施加者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自己有理这件事”避免生硬的法律术语，又保留מִשְׁפָּטִי所含的正当申诉意味；两处歧义均以脚注呈现。
