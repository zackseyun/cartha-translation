  text: יָרֹ֣עַ כַּבִּירִ֣ים לֹא חֵ֑קֶר וַ/יַּעֲמֵ֖ד אֲחֵרִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: zh_hans
  text: 他击碎权贵，无须查究[a]，又立别人取代他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无需查问”“不用搜寻”。希伯来文直译为“没有查究”，意思是他无须像人一样经过冗长调查，就能倾覆权贵。
    reason: 说明 לֹא חֵקֶר 的字面形式、词义选择及语境含义。
lexical_decisions:
- source_word: יָרֹעַ
  choice: 击碎
  rationale: 该动词在此表达强力破坏、摧毁，指上帝对权势者施行决定性的倾覆；“击碎”保留了原文的力度。
- source_word: כַּבִּירִים
  choice: 权贵
  rationale: 这里指有权势、有地位的人，语境很可能涉及统治者或社会精英；“权贵”在现代汉语中自然且简洁。
- source_word: לֹא חֵקֶר
  choice: 无须查究
  rationale: 字面结构是“没有查考／探究”。结合上下文，意思不是上帝不经公正判断便行动，而是他不需要像人一样经过冗长调查；译文保留这一简练而略带张力的表达。
- source_word: וַיַּעֲמֵד
  choice: 立
  rationale: 使役形式意为“使站立、设立、任命”；与后面的替代关系结合，“立”简洁地表达扶立他人。
- source_word: אֲחֵרִים
  choice: 别人
  rationale: 原文为不定复数，指被立来替换权贵的其他人；“别人”不额外限定其身份。
- source_word: תַּחְתָּם
  choice: 取代他们
  rationale: 该词字面可指“在他们之下”，但在替换语境中表示“代替他们、处在他们的位置”；“取代他们”清楚呈现诗句的更替关系。
theological_decisions:
- issue: 两个动词的隐含主语
  choice: 以“他”指上帝
  alternative: 按诗歌衔接理解为未明说的主语
  rationale: 以利户讲话的上下文持续论述上帝如何审判掌权者，因此补出“他”符合篇章指向，同时不增添原文以外的教义内容。
- issue: “无须查究”是否暗示未经审理
  choice: 保留原文简洁表达，并用脚注说明无需人式的冗长查考
  alternative: 译作“无法测度地”或“未经查问”
  rationale: 原短语存在语义张力。正文不把它改写成系统性解释；脚注则避免现代读者误解为任意或无知的行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“击碎权贵”保留诗歌的强烈力度；“又立别人取代他们”清楚呈现除去旧有权势者并以他人替代的平行结构。脚注标记[a]已在正文中对应出现。
