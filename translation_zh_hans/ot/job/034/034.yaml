  yaml_path: translation/ot/job/034/034.yaml
  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: zh_hans
  text: 明达的人[a]必对我说，听我说话的智慧人也必说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明达的人”原文直译为“有心的人”；在希伯来语中，“心”可指思想、理解和辨别的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: 明达的人
  rationale: 原文直译为“有心的人”；希伯来语“心”在这里指思想、理解和辨别的能力。“明达的人”自然传达该习语的含义，也适合作泛指。
- source_word: יֹאמְרוּ לִי
  choice: 必对我说
  rationale: 未完成式在语境中可表达预期将发生的言说；“必对我说”体现以利户所期待的回应。
- source_word: וְגֶבֶר חָכָם
  choice: 智慧人也
  rationale: גֶבֶר在此与“明达的人”平行，宜按一般意义译为“人”；וְ可直译为“并且”，但此处两组主语共用“说”，用“也”更符合现代汉语。
- source_word: שֹׁמֵעַ לִי
  choice: 听我话的
  rationale: 分词在此修饰“智慧人”。“听我话”既保留“听”的基本意义，也比单说“听我的”更自然，且不过度强化为“听从”。
theological_decisions:
- issue: 本节与下一节组成的引语结构
  choice: 句末使用冒号，并在第二分句补出“必说”
  alternative: 按英文咨询层以逗号结束：“明达的人必对我说，听我的智慧人，”
  rationale: 希伯来文本本节本身没有引语内容，内容在下一节出现。中文若机械保留悬垂分词结构会不完整；补出并列谓语并用冒号，明确两类听众都将说出下文，同时不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“明达”比“有心”更准确传达希伯来习语；“智慧人”保留诗歌平行。为使跨节句法在中文中完整，补出第二个“必说”并以冒号引出下一节。
