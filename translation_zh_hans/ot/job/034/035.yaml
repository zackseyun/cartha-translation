  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: zh_hans
  text: 约伯说话不是凭着知识；他所说的话也不显出明辨。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: 毫无知识
  rationale: 介词 ב 与抽象名词 דַּעַת 在否定结构中表示说话的方式或特征；“毫无知识”自然地传达其欠缺知识之意，并与下半句形成平行。
- source_word: יְדַבֵּר
  choice: 说话
  rationale: 未完成式在这里用于以利户对约伯言论的概括性评价，宜译为一般现在意义的“说话”，而非将来时。
- source_word: דְבָרָיו
  choice: 他的话
  rationale: דְּבָרִים 在此指约伯所说的话或言论；“他的话”直接、自然，也保留原文的复数集合意义。
- source_word: בְהַשְׂכֵּיל
  choice: 没有见识
  rationale: שׂכל 表示明辨、洞察或有见识地行事；“没有见识”在现代汉语中自然，并保留它与“毫无知识”的近义平行，同时不将二者完全等同。
- source_word: לֹא
  choice: 毫无／没有
  rationale: 原文两次用 לֹא 否定带 ב 的方式结构；按现代汉语习惯分别译作“毫无”和“没有”，既表达否定，也避免生硬直译为“不以……”。
