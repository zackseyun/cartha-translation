base_translation:
  language: en
  yaml_path: translation/ot/job/034/022.yaml
  text: There is no darkness[a], and no deep shadow, where workers of wickedness may hide themselves.
translation:
  language: zh_hans
  text: 没有黑暗，也没有幽暗可供作恶的人藏身。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死荫”；这个希伯来词在诗歌中也可指极深的黑暗或阴沉幽暗。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: 没有
  rationale: 这是存在性否定；现代汉语用“没有”自然、准确地引出不存在可供藏身之处。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 常用义为“黑暗”，此处与“幽暗”并列，表达无法借暗处躲避。
- source_word: צַלְמָוֶת
  choice: 幽暗
  rationale: 智慧文学中可指浓重的黑暗或阴沉幽暗，不一定直接涉及死亡；“幽暗”保留诗意和递进意味。
- source_word: לְהִסָּתֶר
  choice: 能让……藏身
  rationale: 带ל的不定式在两个否定名词之后表示用途或可能结果；译成“能让……藏身”符合现代汉语表达，并保留反身含义。
- source_word: שָׁם
  choice: 其中
  rationale: 字面为“那里”；与前面的黑暗、幽暗相接时，“其中”自然表达在那种隐蔽处藏身。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作恶的人
  rationale: 原文是“行作恶事者”；“作恶的人”简洁自然，保留行为者及其道德含义。
- source_word: אָוֶן
  choice: 恶
  rationale: 此处指在上帝鉴察下的邪恶行为；“恶”比“祸患”更符合语境。
theological_decisions:
- issue: צַלְמָוֶת在诗歌语境中的含义
  choice: 幽暗
  alternative: 死荫；深暗
  rationale: 本节重点是恶人无法躲避上帝的鉴察，而非死亡本身。“幽暗”体现浓重黑暗，且不把“死亡”的含义强加给正文；传统译法保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“黑暗—幽暗”保留原文同义递进的诗歌结构；后半句调整为自然汉语句式，同时维持“没有任何暗处可供恶人藏身”的含义。
