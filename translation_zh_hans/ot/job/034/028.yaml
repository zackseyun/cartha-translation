  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: zh_hans
  text: 为要使贫弱者[b]的呼求传到他面前[a]；他听见困苦人的呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“临到他”或“控告他”；这里的希伯来语介词可以有不同理解。
    reason: lexical_alternative
  - marker: b
    text: “贫弱者”和“困苦人”也可分别译作“穷人”和“受压迫的人”；两个希伯来语词意义相近，却不完全相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: 为要使……达到
  rationale: לְ 加使役式不定词在上文之后表达目的或结果；“为要使……达到”既保留不定词的关系，也符合现代汉语表达。
- source_word: עָלָיו
  choice: 达到他面前
  rationale: 在本句中可表示呼求被带到某人面前、进入其注意；此译文自然体现司法语境，同时以脚注保留“临到他”或“控告他”的可能。
- source_word: צַעֲקַת
  choice: 呼求
  rationale: 该词指人在困境中的呼喊、哀声；“呼求”既简洁，又能传达向掌权者求助的语境。
- source_word: דָּל
  choice: 贫弱人
  rationale: דָּל兼有贫穷、软弱和社会地位低下之意；“贫弱人”比单用“穷人”更能保留其社会脆弱性。
- source_word: עֲנִיִּים
  choice: 困苦人
  rationale: עָנִי可指贫穷、受苦或受压迫的人；“困苦人”与“贫弱人”形成对应，同时不抹平两个近义词之间的差别。
- source_word: יִשְׁמָע
  choice: 他也听见
  rationale: 未完成式在智慧诗歌中可表达持续或典型的行动；现在时意义的“听见”最贴合上下文，“也”加强两行之间的对应，但不增添新的神学内容。
theological_decisions:
- issue: עָלָיו中代词的指向以及יִשְׁמָע的主语
  choice: 呼求达到上帝面前，上帝听见困苦人的呼求
  alternative: 呼求临到或控告恶人，而听见呼求的仍是上帝；或呼求临到欺压者，由欺压者听见
  rationale: 紧邻语境描述恶人的欺压以及上帝对此的审判性察知，因此末句隐含的主语最自然是上帝。“达到他面前”也符合呼求进入审判者耳中的图景；不过希伯来语代词和介词本身存在歧义，故以脚注保留其他理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留希伯来诗歌中“呼求”的重复和平行结构。以“他”而不直接增补“上帝”，避免把原文隐含的指向写成明说；相关判断在翻译说明中交代。
