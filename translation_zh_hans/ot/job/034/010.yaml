source:
  edition: WLC
  text: לָ/כֵ֤ן אַ֥נֲשֵׁ֥י לֵבָ֗ב שִׁמְע֫וּ לִ֥/י חָלִ֖לָ/ה לָ/אֵ֥ל מֵ/רֶ֗שַׁע וְ/שַׁדַּ֥י מֵ/עָֽוֶל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: zh_hans
  text: 所以，有悟性的人哪，请听我说：神绝不可能行恶；全能者绝不可能不公。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直译为：“神断乎与邪恶无分，全能者断乎与不义无分。”这里的希伯来语强烈表示：把邪恶或不义与神联系起来，是不可想象的。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接前文并引出结论；“所以”在现代汉语中自然、清楚地表达这一推论关系。
- source_word: אַנֲשֵׁי לֵבָב
  choice: 有悟性的人
  rationale: 字面为“有心的人”；希伯来语的“心”在此指理解力和辨别力。“有悟性的人”传达习语含义，同时不把所指范围不必要地限定为男性。
- source_word: שִׁמְעוּ לִי
  choice: 请听我说
  rationale: 命令式加介词表示专心听说话者的话；加入“请”符合现代汉语劝告语气，并未削弱呼吁的力度。
- source_word: חָלִילָה לָאֵל מֵרֶשַׁע
  choice: 神绝不可能行恶
  rationale: חָלִילָה 是强烈否定，表示某事与神完全不相容；“绝不可能”自然传达这种不可想象、断然排除的语气。名词“恶”按汉语习惯补出“行”。
- source_word: וְשַׁדַּי מֵעָוֶל
  choice: 全能者绝不可能不公
  rationale: שַׁדַּי 作为神的称号译为“全能者”；עָוֶל 指不义、不公或错谬，此处“不公”与审判语境相合，也保留道德和司法层面的含义。
theological_decisions:
- issue: 神的称号 שַׁדַּי 的译法
  choice: 全能者
  alternative: 沙代
  rationale: 此处是神的称号而非普通专名；翻译其含义可让现代读者直接理解，并符合《约伯记》中的惯常译法。
- issue: אַנֲשֵׁי לֵבָב 是否明确译成男性
  choice: 有悟性的人
  alternative: 有悟性的男人
  rationale: 该短语在语法上是阳性复数，但作为智慧话语中的称呼，重点是听众具备理解和辨别力；汉语“人”无需标示语法性别，也不应额外断定听众全为男性。
- issue: חָלִילָה 结构表达神不行恶的方式
  choice: 绝不可能
  alternative: 愿神远离恶事
  rationale: 原文是强烈排斥这种观念，并非向神表达愿望。“绝不可能”保留了神与邪恶、不公完全不相容的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有悟性的人哪”保留直接呼告的语气；两个“绝不可能”形成平行结构，传达原文强烈而凝练的否定。
