  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/032.yaml
  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: zh_hans
  text: 我所看不见的，求你指教我[a]；我若行了不义，就不再行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文表达简略，也可译作“除我所看见的以外，求你指教我”。“指教”也可译作“指示”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我不再增添”，意思是“不再继续”或“不再重犯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶחֱזֶה
  choice: 我所看不见的
  rationale: 原文表达简略；בִּלְעֲדֵי 与“看见”连用时，可按语境理解为说话者未能看见或察觉之事。此译保留“看”的意象，也使中文自然。
- source_word: אַתָּה הֹרֵנִי
  choice: 求你指教我
  rationale: הֹרֵנִי 是 ירה 的使役式，可表示“教导、指示”。中文加入“求”以自然表达该话语在语境中的请求语气，而“指教”兼有指出与教导之意。
- source_word: עָוֶל
  choice: 不义
  rationale: 该词指不正、恶行或不公。“不义”庄重而宽泛，既不弱化其道德含义，也不把具体过犯限定得过窄。
- source_word: פָּעַלְתִּי
  choice: 我若行了
  rationale: פעל 是一般性的“做、行”，与“不义”搭配译为“行了不义”，符合现代中文圣经语体。
- source_word: לֹא אֹסִיף
  choice: 就不再行
  rationale: 字面为“不再增添”，在此是停止或不重复该行为的惯用表达。补出“行”承接前句，使中文明确流畅。
theological_decisions:
- issue: 本句是否应强化为正式的认罪或悔改宣告
  choice: 译为请求上帝指教，并承诺不再行不义
  alternative: 采用更强的神学术语，译成正式“认罪悔改”的表述
  rationale: 希伯来文表现的是受教的态度和停止作恶的承诺，但没有使用必须译作正式“认罪”或“悔改”的术语，因此不额外强化。
- issue: בִּלְעֲדֵי אֶחֱזֶה 的省略结构
  choice: 我所看不见的
  alternative: 除我所看见的以外
  rationale: 两种理解在语法上均有依据；正文采用语境中较顺畅的“尚未察觉之事”，脚注保留较贴近字面的另一种理解，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保持两分句的简洁平衡；“求你指教我”自然呈现对上帝说话时的请求语气，“不再行”则承接“不义”，避免生硬直译。
