  text: who says to a king[a], ‘Worthless one!’ and to nobles[b], ‘Wicked ones!’
translation:
  language: zh_hans
  text: 他对君王说：“你这卑鄙之徒！”又对权贵说：“你们这些恶人！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲמֹר
  choice: 怎可……说
  rationale: 按马所拉元音，前缀 הַ 最自然地理解为疑问词，使本句成为省略“合宜”之类成分的反问：“怎可说……？”这样也符合上下文对公正的讨论。
- source_word: לְמֶלֶךְ
  choice: 对君王
  rationale: 介词 לְ 引出说话的对象；מֶלֶךְ 无冠词，在此作泛指。汉语“君王”既庄重又自然，无须加不定冠词。
- source_word: בְּלִיָּעַל
  choice: 无赖
  rationale: 此处是辱骂人的称呼，表达卑劣、毫无价值之意；“无赖”在现代汉语中简洁有力，也避免把该词误作后期用法中的专名“彼列”。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词指邪恶或有罪的人。原文形式为单数，但与复数的“权贵”相对；汉语“恶人”本身不强制标明单复数，因而可保留这种形式张力。
- source_word: אֶל
  choice: 对
  rationale: 介词 אֶל 在这里引出言语所针对的对象，与前半句的 לְ 平行。
- source_word: נְדִיבִים
  choice: 权贵
  rationale: 该复数名词在此指身份尊贵、居于上位的人，与“君王”形成政治社会层面的平行；“权贵”比单纯的“慷慨者”更贴合语境。
