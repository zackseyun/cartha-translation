  text: כִּי עֵ֭ינָי/ו עַל דַּרְכֵי אִ֑ישׁ וְֽ/כָל צְעָדָ֥י/ו יִרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: zh_hans
  text: 因为他的眼目察看人的道路[a]；人的一切脚步，他都看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个男人的道路”，这里的阳性单数具有泛指作用，指人的道路。
    reason: 说明希伯来文אִישׁ的语法形式及其泛指功能。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前述论断说明根据；中文用“因为”自然保留解释性的连接作用。
- source_word: עֵינָיו עַל
  choice: 他的眼目察看
  rationale: 原文直译为“他的眼目在……之上”，表达留意、观察。译作“眼目察看”既保留身体意象，也符合庄重的现代汉语。
- source_word: דַּרְכֵי אִישׁ
  choice: 人的道路
  rationale: דֶּרֶךְ可指实际道路，也常比喻人的行为与人生历程；אִישׁ为阳性单数，在此具泛指作用。汉语“人”无需标示语法性别，且不缩小其普遍范围。
- source_word: וְכָל צְעָדָיו
  choice: 人的一切脚步
  rationale: 保留“脚步”的具体意象及其对行动、人生进程的比喻含义；重复“人”可消除现代汉语中代词指向上帝的潜在歧义。
- source_word: יִרְאֶה
  choice: 他都看见
  rationale: ראה的Qal未完成式在此表达持续、普遍的事实；用现在时意义的“看见”，并以“都”呼应“一切”。
theological_decisions:
- issue: אִישׁ的阳性单数泛指
  choice: 人的道路
  alternative: 一个男人的道路
  rationale: 原文形式为阳性单数，但语境所论及的是人类普遍受上帝察看。现代汉语“人”能够保留单数集合式的泛指力量，而不把经文误限于男性。
- issue: “他的眼目”中代词的所指
  choice: 正文保留“他的”，由上下文指向上帝
  alternative: 上帝的眼目
  rationale: 原文使用第三人称阳性单数后缀，没有在本节重述神名；保留代词可忠实呈现篇章衔接，不在本节内添加原文没有的名词。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“眼目”“道路”“脚步”保留希伯来诗歌的身体与行路意象；分号呈现两个平行分句。
