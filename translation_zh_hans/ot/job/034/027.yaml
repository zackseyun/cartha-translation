  text: אֲשֶׁ֣ר עַל כֵּ֭ן סָ֣רוּ מֵֽ/אַחֲרָ֑י/ו וְ/כָל דְּ֝רָכָ֗י/ו לֹ֣א הִשְׂכִּֽילוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/027.yaml
  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
translation:
  language: zh_hans
  text: 因为他们转离，不再跟从他[a]，也不留意他的一切道路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“从他后面”；这是指“不再跟从他”的希伯来语表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不明白他的任何道路。”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: 因为
  rationale: 这一组合在此承接上文，说明前述审判的缘由；译作“因为”自然地保留其因果关系。
- source_word: סָרוּ
  choice: 转离
  rationale: סור可指转开、离去；“转离”既保留动作意象，也表达背离的关系和道德意味。
- source_word: מֵאַחֲרָיו
  choice: 不再跟从他
  rationale: 原文直译为“从他后面离开”，是停止跟从某人的希伯来语表达；这样翻译清楚而自然。
- source_word: וְכָל דְּרָכָיו
  choice: 他的一切道路
  rationale: 保留原文“全部道路”的形式；“道路”在这里可兼指他的行事方式、作为和要求，不宜缩窄为单一含义。
- source_word: לֹא הִשְׂכִּילוּ
  choice: 不留意
  rationale: שׂכל的使役词形可表示明白、审慎思考或留心；“不留意”在本语境中兼顾认知与有意不加理会的意味，同时以脚注保留“明白”的可能译法。
theological_decisions:
- issue: “跟从他”和“他的道路”中第三人称单数后缀的所指
  choice: 沿用代词“他”，由上下文指向上帝
  alternative: 所指也可能被理解为地上的统治者或审判者
  rationale: 以“他”保留希伯来文代词本身，不在正文中改写为“上帝”，让上下文承担辨识所指的作用，避免消除原文可感的指代张力。
- issue: לֹא הִשְׂכִּילוּ表达认知不足还是有意忽视
  choice: 不留意
  alternative: 不明白；不思想；不以明智的态度对待
  rationale: 该动词语义范围较宽；“不留意”适合本段所描写的背离行为，但脚注保留偏重理解能力的译法，不把语义完全锁定为故意悖逆。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“转离”保留原文的方向性意象；“不再跟从”解释希伯来语习语；“不留意”自然连接人的背离与对其道路的忽视。正文中的[a]、[b]均与脚注对应。
