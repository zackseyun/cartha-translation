base_translation:
  language: en
  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: zh_hans
  text: 难道恨恶公正的人能掌权吗[a]？你又怎能定罪那公义的大能者呢[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“统治”、“管束”；直译“捆绑”。此处的希伯来语动词很可能指施行统治或约束。
    reason: lexical_alternative
  - marker: b
    text: 或译“公义的强大者”或“公义的伟大者”。按此处上下文，这个称呼最自然是指上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: 难道……吗
  rationale: 该组合引出带强调意味的反问；“难道……吗”自然传达其修辞力度，不必另加“甚至”或“诚然”。
- source_word: שׂוֹנֵא
  choice: 恨恶……的
  rationale: 分词在这里作名词性用法，指以恨恶为特征的人；此译简洁自然，并保留持续性的特征。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 上下文涉及治理与道德秩序，“公正”比单次性的“审判”更贴合此处含义。
- source_word: יַחֲבֹשׁ
  choice: 掌权
  rationale: 该动词本义为“捆绑”，在此语境中可能引申为施行管束或统治；“掌权”符合治理语境，同时以脚注保留字面及其他可能译法。
- source_word: וְאִם
  choice: 又岂能
  rationale: 连接第二个平行的反问。“又”保留连接关系，“岂能”自然延续反问语气。
- source_word: צַדִּיק
  choice: 公义的
  rationale: 该词表达道德上的正直、公正；“公义”保留其伦理与神学分量。
- source_word: כַּבִּיר
  choice: 大能者
  rationale: 形容词在此作名词用，意为强大或伟大者。上下文很可能指上帝，但正文不额外加入“上帝”，以保留原文表达方式。
- source_word: תַּרְשִׁיעַ
  choice: 定罪
  rationale: 使役词形表示宣告某人有罪或为恶；“定罪”简洁，并与司法语境相合。
theological_decisions:
- issue: “公义的大能者”的所指
  choice: 正文译作“那公义的大能者”，按上下文让读者理解为上帝
  alternative: 泛指一位公义而强大的统治者
  rationale: 以利户论证的修辞力量很可能来自“定罪上帝”这一荒谬设想；但希伯来语本身采用描述性短语而非明确神名，因此正文保留该短语，并在脚注说明其最自然的所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个反问句保持平行；“难道”与“岂能”传达原文的强调语气。“公正”用于治理秩序，“公义”用于描述大能者，以体现 מִשְׁפָּט 与 צַדִּיק 的词义区别。
