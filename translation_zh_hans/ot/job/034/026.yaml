  text: He strikes them as wicked people in full view[a].
translation:
  language: zh_hans
  text: 他在众目睽睽之下，把他们当作恶人击打[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他因他们的恶行，在众目睽睽之下击打他们。”原文开头的短语含义较难确定，既可描述他们受击打时被视为恶人，也可说明他们因何受罚。
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  choice: 当作
  rationale: 此处介词含义较难确定；结合“恶人”，主文将其理解为他们受击打时所具有的身份或地位，而非具体的空间位置。表示惩罚原因的理解保留在脚注中。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数形容词在此作名词使用，泛指作恶的人；“恶人”简洁、庄重，也不额外限定性别。
- source_word: סְפָקָם
  choice: 击打他们
  rationale: 该动词表示击打；不译为“击倒”，以免加入原文没有明说的结果。
- source_word: בִּמְקוֹם רֹאִים
  choice: 在众目睽睽之下
  rationale: “地方”与“看见的人”组合，重点在于有人观看、公开可见，而不是另行指出一个具体地点；此译法自然表达公开施行惩罚的场景。
theological_decisions:
- issue: תַּחַת רְשָׁעִים 所表达的是受罚身份还是受罚原因
  choice: 主文译作“把他们当作恶人”，表达受击打时被置于恶人之列的身份含义
  alternative: “因他们的恶行”，表达他们受罚的原因
  rationale: 原文短语高度凝练，两种句法理解皆有可能。主文采用与上下文公开审判场景相合的身份性理解，同时用脚注保留因果性理解，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在众目睽睽之下”准确传达公开可见的场景；“击打”保留动作本身，不擅自补入死亡或倒下等结果。
