  text: כִּ֥י יֹ֘סִ֤יף עַֽל חַטָּאת֣/וֹ פֶ֭שַׁע בֵּינֵ֣י/נוּ יִסְפּ֑וֹק וְ/יֶ֖רֶב אֲמָרָ֣י/ו לָ/אֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: zh_hans
  text: 因为他在自己的罪上又加添悖逆，在我们中间拍掌[a]，还不断说反对上帝的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拍掌”也可译作“击掌”；这种动作可能表示嘲笑、蔑视或挑衅。
    reason: lexical_alternative
  - marker: b
    text: “反对上帝”也可译作“向上帝”或“对上帝”。这里的希伯来介词本身可以只表示方向，但上下文更支持敌对的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为以利户先前的判断说明理由；译作“因为”符合这里的解释性语气。
- source_word: יֹסִיף עַל חַטָּאתוֹ
  choice: 在自己的罪上又加上
  rationale: 保留“在已有之事上再添加”的意象，同时采用自然的现代汉语表达。
- source_word: פֶשַׁע
  choice: 悖逆
  rationale: 该词不只是泛指过错，常含反叛、抗拒权威的意味；“悖逆”体现了本句加重指控的语气。
- source_word: בֵּינֵינוּ
  choice: 在我们中间
  rationale: 直译为“在我们之间”，此处惯用意义是在说话者及在场众人中间。
- source_word: יִסְפּוֹק
  choice: 拍掌
  rationale: 保留具体的身体动作，不在正文中把其象征意义限定为嘲笑或挑衅；可能的语用含义放入脚注。
- source_word: וְיֶרֶב אֲמָרָיו
  choice: 还说了更多……的话
  rationale: רבה 的使役形式有“增多、使之众多”之意；此译在现代汉语中自然地表达话语不断增加。
- source_word: לָאֵל
  choice: 反对上帝
  rationale: 介词 ל 本可表示话语朝向上帝，但在“罪上加悖逆”的指控语境中，具有敌对意味的“反对上帝”更符合修辞推进；脚注保留较中性的读法。
theological_decisions:
- issue: לָאֵל 应理解为言语“反对上帝”，还是仅仅“向上帝”说。
  choice: 反对上帝
  alternative: 向上帝／对上帝
  rationale: 上下文将约伯的行为描述为在罪上加上悖逆，因此正文采用带敌对意味的理解，以保持指控逐步加重的结构；但希伯来介词本身也容许较中性的方向义，故在脚注中明确保留这一歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“悖逆”保留原文较强的反叛意味；“拍掌”保留具体动作而不在正文中过度解释；两个脚注标记均放在各自所说明的词语之后。
