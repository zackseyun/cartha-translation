  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: zh_hans
  text: 他与作恶的人结伴[a]，与恶人同行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他与作恶的人交往。”这里的希伯来语可指结伴同行，也可指与人交往、为伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ/חֶבְרָה
  choice: 与……结伴同行
  rationale: אָרַח与לְחֶבְרָה连用，在此表示与人结伴、交往；“结伴同行”既保留行路意象，也表达与对方相交相伴的含义。
- source_word: עִם
  choice: 与……一同
  rationale: 这是表示伴随、联合的常用介词；两小句分别译作“与”和“与……一同”，符合现代汉语表达。
- source_word: פֹּעֲלֵי אָוֶן
  choice: 作恶的人
  rationale: 该词组直指行作恶事者。“作恶的人”自然清楚，并保留行为层面的强调；אָוֶן在此取道德意义上的恶，而非“患难”。
- source_word: וְ/לָ/לֶכֶת
  choice: 一同走路
  rationale: הלך可指实际行走，也可比喻生活道路或行为方式。译作“走路”保留原文意象，并让其潜在的道德含义保持开放。
- source_word: אַנְשֵׁי רֶשַׁע
  choice: 邪恶的男人
  rationale: אַנְשֵׁי是明确的阳性复数，רֶשַׁע指邪恶或恶行；“邪恶的男人”在现代汉语中自然，并保留原文的男性指称。
theological_decisions:
- issue: אַנְשֵׁי רֶשַׁע中的性别表达
  choice: 邪恶的男人
  alternative: 恶人／邪恶的人
  rationale: 原文明确使用阳性复数“男人”，因此正文保留男性指称，不将其无根据地中性化。
- issue: “走路”的实际与比喻含义
  choice: 保留“走路”的意象
  alternative: 与……为伍／按……的方式行事
  rationale: 上下文描述交往和同行，但הלך仍可兼具实际同行与生活方式的比喻意味；保留意象可避免过早消除这种张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“结伴同行”与“一同走路”保留希伯来文两组近义而不完全相同的行路表达；正文中的脚注标记[a]与脚注对应。
