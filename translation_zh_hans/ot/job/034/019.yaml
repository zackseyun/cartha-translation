  text: אֲשֶׁ֤ר לֹֽא נָשָׂ֨א פְּנֵ֥י שָׂרִ֗ים וְ/לֹ֣א נִכַּר שׁ֭וֹעַ לִ/פְנֵי דָ֑ל כִּֽי מַעֲשֵׂ֖ה יָדָ֣י/ו כֻּלָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/019.yaml
  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: zh_hans
  text: 他不偏待权贵，也不看重富人胜过穷人，因为他们全都是他亲手所造的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא פְּנֵי שָׂרִים
  choice: 不偏待权贵
  rationale: 该习语直译为“抬举权贵的脸”，实际表示徇情、偏袒；“权贵”自然涵盖 שָׂרִים 所指的首领或显要人物。
- source_word: נִכַּר שׁוֹעַ לִפְנֵי דָל
  choice: 看重富人胜过穷人
  rationale: נכר 在此语境表示特别认定、优待或看重；לִפְנֵי 保留富人与穷人的比较关系，而不将其弱化为一般性的偏爱。
- source_word: מַעֲשֵׂה יָדָיו
  choice: 他亲手所造的
  rationale: 保留“他手的作品”这一创造意象，同时用现代汉语自然表达；“亲手”强调众人同出于他的创造。
theological_decisions:
- issue: 本节是否把神的公正具体表述为社会经济层面的不偏待
  choice: 保留权贵、富人和穷人的明确对照
  alternative: 概括为“他不偏待任何人”
  rationale: 原文以具体社会身份说明神不徇情，并以众人同为他所造作为理由；不宜抽象化而丢失这一张力。
- issue: שׁוֹעַ 的语义范围
  choice: 译为“富人”
  alternative: 译为“尊贵的人”或“显赫者”
  rationale: 该词可指富有或显贵者；与 דָל“穷人/卑微者”对举时，“富人”最直接，也与上下半句的社会地位对照相称。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“不偏待”承接圣经语体但仍为普通读者熟悉；“看重……胜过……”准确保留比较结构；全句避免过度解释。
