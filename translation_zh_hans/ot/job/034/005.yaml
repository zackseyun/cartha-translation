  source_fidelity: 译文准确传达希伯来文的论证引介、约伯的自辩，以及神夺去其“公道／权利”的申诉。"我是有理的"恰当地保留צָדַקְתִּי在争讼语境中的“在理、得理”含义，未将其不必要地扩大为全面的道德无罪宣称。"夺去了我的公道"能表达הֵסִיר与מִשְׁפָּטִי所含的剥夺及司法公正／应得权利的意涵。
