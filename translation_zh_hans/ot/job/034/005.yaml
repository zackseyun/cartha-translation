  text: כִּֽי אָ֭מַר אִיּ֣וֹב צָדַ֑קְתִּי וְ֝/אֵ֗ל הֵסִ֥יר מִשְׁפָּטִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: zh_hans
  text: 因为约伯曾说：“我是有理的，而神夺去了我的公道[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的权利”，或“我应得的公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，引出以利户作出判断的依据；“因为”自然表达这里的论证关系。
- source_word: אָמַר
  choice: 曾说
  rationale: 完成式回指约伯先前说过、且与当前论述有关的话；“曾说”符合现代汉语叙述习惯。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代中文圣经传统通行的人名译法。
- source_word: צָדַקְתִּי
  choice: 我是有理的
  rationale: 这里具有申诉和裁断语境，表示约伯认为自己在争议中有理；避免译作“我是义人”而扩大为对整体道德状况的绝对宣称。
- source_word: וְאֵל
  choice: 而神
  rationale: אֵל译为“神”，不扩展为其他称号；“而”保留连接作用，同时自然呈现两个分句之间的语义张力。
- source_word: הֵסִיר
  choice: 夺去了
  rationale: 使役词形在此表示移走、拿走；“夺去了”清楚表达约伯所说的被剥夺感。
- source_word: מִשְׁפָּטִי
  choice: 我的公道
  rationale: מִשְׁפָּט可指公正、权利或应得的裁断。“我的公道”保留法律与道德层面的宽度，并以脚注列出其他可能译法。
theological_decisions:
- issue: 约伯自我申辩的司法语气
  choice: 译为“我是有理的”
  alternative: “我是公义的”或“我是义人”
  rationale: 本句概述约伯在与神争辩中的立场，不必理解为他宣称自己在一切道德层面都毫无罪过；此译法保留申诉语境，又不替文本消解其张力。
- issue: מִשְׁפָּטִי的法律与道德含义
  choice: 正文采用“我的公道”
  alternative: “我的权利”“我应得的公正”
  rationale: 原词兼有公正、合法权利和司法裁断等含义。“我的公道”较能保留其宽度，脚注则呈现更明确的可能理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我是有理的”符合争辩语境；“夺去了我的公道”略带司法色彩，以保留原文的法庭意象和词义张力。
