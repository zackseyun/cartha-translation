base_translation:
  language: en
  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: zh_hans
  text: 因为他说过[a]：“人以神为乐，也得不着什么益处。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当神喜悦人时，人也得不着什么益处”，或“人寻求神的喜悦，也得不着什么益处”。希伯来语短语十分简约，可以有不止一种句法理解。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，引出以利户作出指控的理由；“因为”清楚体现论证关系。
- source_word: אָמַר
  choice: 他说过
  rationale: 完成式指约伯先前表达、而在当前论辩中仍有影响的观点；“说过”符合现代汉语表达。
- source_word: לֹא יִסְכָּן
  choice: 得不着什么益处
  rationale: 该动词表示有用、获益或得到好处；此译自然传达否定的利益或优势。
- source_word: גָּבֶר
  choice: 人
  rationale: 阳性单数名词在此具有泛指作用；现代汉语的“人”可自然涵盖一般人类。
- source_word: בִּרְצֹתוֹ
  choice: 以……为乐
  rationale: רצה 的不定式结构可表达喜悦、乐意；按所选句法理解，以“人”为隐含主语，表示人以神为喜乐。
- source_word: עִם אֱלֹהִים
  choice: 以神
  rationale: עִם 基本义为“与”，此处标示喜悦所涉及的关系对象；结合汉语习惯，与“为乐”组成“以神为乐”，既简洁又保留关系含义。
theological_decisions:
- issue: 短语 בִּרְצֹתוֹ עִם אֱלֹהִים 的句法和神学含义
  choice: 理解为人以神为乐，却得不着益处
  alternative: 也可理解为神喜悦人时，人仍得不着益处；或人寻求神的喜悦，仍得不着益处
  rationale: 代词后缀最直接可指前面的“人”，使人充当“喜悦”的主体，也符合以利户对约伯立场的概括，即敬虔并无益处。不过，希伯来语结构简约，主客关系存在真实歧义，因此不在正文中武断消除，而将其他理解收入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以神为乐”简洁自然；“得不着什么益处”保留原文关于利益或好处的措辞，并避免增添宗派性解释。
