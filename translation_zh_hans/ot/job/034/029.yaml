language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/ה֤וּא יַשְׁקִ֨ט וּ/מִ֥י יַרְשִׁ֗עַ וְ/יַסְתֵּ֣ר פָּ֭נִים וּ/מִ֣י יְשׁוּרֶ֑/נּוּ וְ/עַל גּ֖וֹי וְ/עַל אָדָ֣ם יָֽחַד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: zh_hans
  text: 他若使人安宁，谁能定他有罪？他若掩面[a]，谁能看见他？无论对一国还是对一人，都是如此。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“隐藏面容”。这也可含有转脸不顾或使人无法寻见他的意味。
    reason: idiom
  - marker: b
    text: 直译“并且在一国之上，也在一人之上，一同”；意思也可能是：无论针对一国还是一人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִט
  choice: 使人安宁
  rationale: 使役形态表达“使安静、使安宁”，而不只是“自己安静”；“安宁”也避免将其限缩为正式的和平概念。
- source_word: יַרְשִׁעַ
  choice: 定他有罪
  rationale: 该使役动词常有司法含义，即宣告为恶或有罪；这里的宾语在希伯来文中未明说，按上下文自然理解为上帝。
- source_word: יַסְתֵּר פָּנִים
  choice: 掩面
  rationale: 保留希伯来文“隐藏面容”的拟人表达及其神学张力，不将其窄化解释为撤回恩宠。
- source_word: יְשׁוּרֶנּוּ
  choice: 看见他
  rationale: 该词意为观看、看见，阳性单数后缀指向上帝；现代汉语用“看见他”自然清楚。
- source_word: גּוֹי
  choice: 一国
  rationale: 这里指集体性的国家或民族实体；与后面的个体“一人”形成对照。
- source_word: אָדָם
  choice: 一人
  rationale: 此处重在与“一国”相对的个体层面；“一人”比“人类”更能保留单数对比。
- source_word: יָחַד
  choice: 都是如此
  rationale: 在此表示前述原则同样适用于国家和个人，而非强调空间上的“一起”。
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: 无论对一国还是对一人，都是如此
  rationale: עַל 的关系较宽，可表示作用或适用对象；此译自然表达该原则同时涵盖群体与个人，又不额外指定为惩罚性的“攻击”。
theological_decisions:
- issue: 上帝掩面的表达
  choice: 保留“掩面”的拟人说法
  alternative: 转脸不顾／收回恩宠
  rationale: 原文没有把这一动作明确限定为不悦或撤回恩宠；直译可保存上帝隐而不见所带来的开放性与张力。
- issue: 谁被定罪
  choice: 将“他”理解为上帝，同时以脚注说明原文未明说宾语
  alternative: 谁能判为有罪／谁能使之为恶
  rationale: 上下文的两个反问都以上帝为行动者和不可抗衡者，指向“谁能定他有罪”；但希伯来文未明示宾语，因此不应隐藏语法上的含混。
- issue: 末句的适用范围
  choice: 理解为同一原则适用于国家和个人
  alternative: 理解为上帝的行动针对国家和个人
  rationale: 原文介词 עַל 可有多种关系；概括性的汉语译法保留范围重点，避免擅自加强惩罚含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个反问保持平行结构；末句用“无论……还是……”呈现群体与个人的对照。正文中的每个脚注标记均与脚注对应。
