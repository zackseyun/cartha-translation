  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: zh_hans
  text: 诚然，上帝绝不作恶[a]；全能者绝不扭曲公正。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝不定人有罪。”这个希伯来语动词在某些语境中可指司法上“定人为有罪”；按本节与下句的平行关系，也可理解为“上帝绝不不公正地定罪”。
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: 诚然
  rationale: 这一组合加强肯定语气；“诚然”在现代汉语中庄重自然，能表达“的确、确实如此”的强调作用。
- source_word: אֵל
  choice: 上帝
  rationale: 此处用作以色列之上帝的称谓；译作“上帝”自然清楚，并与下半句“全能者”构成平行。
- source_word: יַרְשִׁיעַ
  choice: 绝不作恶
  rationale: רשע 的使役形在这里可表示行恶或作出恶事，也可能带有司法上“判为有罪”的含义。正文采用较宽泛的“作恶”，与下句“不歪曲公正”相呼应，同时用脚注保留司法义的可能。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是《约伯记》中常见的神圣称号；“全能者”是现代汉语中清楚而庄重的对应表达。
- source_word: יְעַוֵּת
  choice: 歪曲
  rationale: 该动词本义涉及弄弯、扭曲；“歪曲公正”准确传达破坏或扭曲公正判断的司法意味。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此处指公正的判断或公正这一准则；“公正”比单译“审判”更能呈现本句对上帝司法正直的断言。
theological_decisions:
- issue: יַרְשִׁיעַ 所表达的上帝之作为
  choice: 上帝绝不作恶
  alternative: 上帝绝不判人为有罪／上帝绝不冤枉定罪
  rationale: 上下句的平行结构强调上帝在道德与审判上的正直。“作恶”保留较宽的道德含义，不把经文限缩为法庭行为；脚注同时保留该动词可能具有的司法含义，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“诚然”保留开头的强调语气；分号呈现两句希伯来诗歌平行句。“作恶”与“歪曲公正”简洁有力，并避免使用过度古雅的“屈枉”等措辞。
