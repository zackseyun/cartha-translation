base_translation:
  language: en
  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: zh_hans
  text: 因为他不为人另定日期，让人到上帝面前受审[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他不再为人设定什么，使人到上帝面前进入审判。”希伯来文在“设定”之后省略了宾语，且“再／进一步”的含义与后句的关系有争议；正文将其最小限度地补为“另定日期”。这句话可能指上帝审判人前不需要另作安排、再次审理或延后裁决。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的论述说明理由；现代汉语用“因为”自然清楚。
- source_word: לֹא עַל־אִישׁ יָשִׂים עוֹד
  choice: 他不必为人另定日期
  rationale: 原文高度压缩，יָשִׂים意为“放置、设定”，עוֹד意为“再、进一步”。结合司法语境，补出隐含的“日期”，并以“不必……另定”表达无需延期或再次开庭的意思，同时在脚注中交代原文难点。
- source_word: אִישׁ
  choice: 人
  rationale: 这里是泛指个人；汉语“人”既准确又自然，无需机械保留希伯来语阳性单数的形式。
- source_word: לַהֲלֹךְ
  choice: 让人到
  rationale: 该不定式本义为“去、行走”；在此与司法场景结合，译作“到……面前”符合现代汉语表达。
- source_word: אֶל־אֵל
  choice: 到上帝面前
  rationale: 字面为“到上帝那里”；司法语境中“到上帝面前”自然表达出庭的含义，而不把אֵל误作专名。
- source_word: בַּמִּשְׁפָּט
  choice: 受审
  rationale: מִשְׁפָּט可指审判、司法裁决或诉讼程序。此处译作“受审”简洁呈现司法场景，并与“到……面前”自然衔接。
theological_decisions:
- issue: עוֹד与יָשִׂים之后省略成分的解释
  choice: 上帝不必另定日期，让人到他面前受审
  alternative: 上帝不再把什么加在人身上，使他到上帝面前参与审判；或上帝没有为人定下到他面前受审的日期
  rationale: 希伯来文简略且句法困难。结合上下文所强调的上帝洞察完全、无需进一步调查，正文采用“无需另定日期”的理解，但以脚注保留“不再／进一步”的字面色彩及其他可能性，避免把有争议的解释伪装成毫无歧义。
- issue: 人在审判场景中的角色
  choice: 到上帝面前受审
  alternative: 到上帝面前申诉／与上帝对簿公堂
  rationale: בַּמִּשְׁפָּט本身未详述人的具体诉讼角色；上下文偏向上帝审判人，因此正文用“受审”。不过不进一步引入特定教义或审判程序。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“另定日期”是为表达原文省略结构所作的最小补充；脚注明确标示其解释性质，并保留原文可能的其他读法。
