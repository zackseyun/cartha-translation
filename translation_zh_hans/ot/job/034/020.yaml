  text: רֶ֤גַע יָמֻתוּ֮ וַ/חֲצ֪וֹת לָ֥יְלָה יְגֹעֲשׁ֣וּ עָ֣ם וְ/יַעֲבֹ֑רוּ וְ/יָסִ֥ירוּ אַ֝בִּ֗יר לֹ֣א בְ/יָֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: zh_hans
  text: 他们转眼间死去；半夜，民众震动，随即消逝；强者被除去，并非借人手[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“不是借手”，很可能指并非通过人的力量或行动。
    reason: 说明希伯来语习语的字面形式及其可能含义，同时保留施事者未明的特点。
lexical_decisions:
- source_word: רֶגַע
  choice: 转眼间
  rationale: 表示极短的一刻；“转眼间”自然地传达事件发生之迅速，又不额外强调具体方式。
- source_word: יָמֻתוּ
  choice: 死去
  rationale: 直接表达常用动词“死”的含义，并与本节突显的突然死亡相称。
- source_word: וַחֲצוֹת לָיְלָה
  choice: 半夜
  rationale: 原意为“夜的一半”，现代汉语以“半夜”自然表达；连接词依汉语句法融入分句。
- source_word: יְגֹעֲשׁוּ
  choice: 震动
  rationale: 该词可指震荡、动摇或骚动；“震动”保留其形象性，也不限定究竟是身体摇撼还是社会动荡。
- source_word: עָם
  choice: 民众
  rationale: 该词是集合名词，指一群百姓或一个群体；“民众”在汉语中可自然承接复数谓语意象，又避免加入现代民族国家概念。
- source_word: וְיַעֲבֹרוּ
  choice: 随即消逝
  rationale: עבר本义为经过、过去；在死亡与被除去的语境中，“消逝”传达他们不复存在，“随即”体现上下动作的紧接关系。
- source_word: וְיָסִירוּ
  choice: 被除去
  rationale: 使役形可表示移走、除去；希伯来文未明确说明施事者，汉语用被动表达可保留这种不确定性。
- source_word: אַבִּיר
  choice: 强者
  rationale: 指强壮或有权势的人；“强者”简洁保留其涵盖力量与权势的语义。
- source_word: לֹא בְיָד
  choice: 并非借人手
  rationale: 原文直译为“不是借手”。正文采用自然汉语“并非借人手”，表达并非通过人的行动，同时以脚注交代原文字面形式，避免把隐含的施事解释说得过满。
theological_decisions:
- issue: “不是借手”所暗示的施事者
  choice: 正文译作“并非借人手”，暗示强者的被除去不依靠通常的人力，却不直接明说是上帝亲自施行。
  alternative: 直译为“不是借手”或明确译为“不是借着人的手”。
  rationale: 上下文强调强者会在超越常规人力的情况下被除去，但本句没有明说施事者。译文保留这一张力，不把暗示扩展成明说。
translation_notes:
  register: 采用现代、庄重而清楚的汉语。分号保留原句三层推进：突然死亡、民众在半夜震动消逝、强者在非人力作用下被除去。脚注标记置于其实际解释的短语之后。
