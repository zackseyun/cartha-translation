base_translation:
  language: en
  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: zh_hans
  text: 他若把心思放在自己身上[a]，把自己的灵和气息收归自己，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他若对此留心。”希伯来语“把心放向……”可指将注意力或心意转向某人或某事。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָשִׂים
  choice: 他若……放
  rationale: אִם引出假设条件；与未完成式יָשִׂים合用，译为“若……放”自然地保留或然语气。
- source_word: אֵלָיו לִבּוֹ
  choice: 只把心思放在自己身上
  rationale: 字面为“把他的心放向自己”。“心思”传达לֵב在此所指的注意、意向或心志；“自己”保留反身指向。补出“只”可自然表达专注于自身的语境含义，但不把具体动机说死。
- source_word: רוּחוֹ
  choice: 自己的灵
  rationale: רוּחַ可指灵、风或气息；这里与נְשָׁמָה并列，并指上帝可收回的生命本原，译作“灵”以保留两词的区别。
- source_word: וְנִשְׁמָתוֹ
  choice: 和气息
  rationale: נְשָׁמָה常指气息或生命之气；译作“气息”既自然，也不与רוּחַ合并为同一个词。
- source_word: אֵלָיו יֶאֱסֹף
  choice: 收回
  rationale: אָסַף的基本意象是聚集、收聚；与“向自己”连用时，现代汉语以“收回”最自然，并准确表达把所赐生命收归自己的语境含义。
theological_decisions:
- issue: 第三人称单数代词的所指
  choice: 各代词均指上帝，并将第一个אֵלָיו按反身关系译为“自己”
  alternative: 第一个אֵלָיו也可较笼统地理解为“对此”或“向这事”，即“他若对此留心”
  rationale: 上下文以“他”为上帝，并谈到他收回众生的灵与气息。主文保留反身理解，但用脚注呈现该短语所具有的指向或关注层面的歧义。
- issue: “灵”与“气息”的关系
  choice: 分别译出，不将二者合并
  alternative: 可把两词合并理解为同义并行的“生命气息”
  rationale: 原文使用רוּחַ与נְשָׁמָה两个词。分别译作“灵”和“气息”可保留诗歌并行与词义张力，而不据此断定二者是彼此独立的实体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句末逗号保留本节作为条件从句的未完结构，与下一节的结果句相接。“心思”较“心”更清楚地表达此处注意、意向的习语含义，同时脚注保留另一种可能理解。
