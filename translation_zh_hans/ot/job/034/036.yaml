  text: אָבִ֗י יִבָּחֵ֣ן אִיּ֣וֹב עַד נֶ֑צַח עַל תְּ֝שֻׁבֹ֗ת בְּ/אַנְשֵׁי אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/036.yaml
  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: zh_hans
  text: 我父啊[a]，愿约伯受考验到底[b]，因为他的回答像恶人的回答[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的父亲”；希伯来文直译为“我的父亲”，这里很可能是呼语，但也有人作其他理解。
    reason: lexical_alternative
  - marker: b
    text: 直译：“直到永远”；这里可能是强调考验要持续到底、达到极致，而不是指无穷无尽的时间。
    reason: lexical_alternative
  - marker: c
    text: 或译：“与恶人一起”或“在恶人中”；希伯来文介词既可表示关联，也可能表示比较。
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: 我父啊
  rationale: 该词字面意为“我的父亲”，在此最自然地理解为呼语；加“啊”使现代汉语中的称呼语气清楚，同时保留原文措辞。
- source_word: יִבָּחֵן
  choice: 愿……受考验
  rationale: בחן 的尼法勒未完成式表示“受检验、受考验”；结合本句愿望语气，用“愿”表达祈愿式含义。
- source_word: עַד נֶצַח
  choice: 到底
  rationale: 该短语字面可指“直到永远”，但在检验约伯的语境中，更可能强调考验达到极致或彻底进行；“到底”兼具持续和彻底的意味。
- source_word: עַל
  choice: 因为
  rationale: 此处引出希望约伯继续受考验的缘由。
- source_word: תְּשֻׁבוֹת
  choice: 回答
  rationale: 复数名词指约伯在辩论中的答话或回应；汉语集合性用法“回答”自然涵盖多次答复。
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: 像恶人的回答
  rationale: 介词 בְּ 在此句法含义不确定，可表比较或关联；正文采用较通顺的比较义，并在脚注保留“与恶人一起／在恶人中”的可能。אַנְשֵׁי אָוֶן 自然译为“恶人”。
theological_decisions:
- issue: 以利户希望约伯受考验到何种程度
  choice: 这是希望约伯受到彻底考验，而非断言他将永远受考验
  alternative: 约伯要永远受考验
  rationale: עַד נֶצַח 字面具有时间上的“直到永远”之意，但本处更可能是强调考验的极致程度。正文不把以利户的话扩展成有关永恒惩罚的神学断言，并以脚注保留字面读法。
- issue: 约伯的回答与恶人的关系
  choice: 约伯的回答像恶人的回答
  alternative: 约伯与恶人一同或在恶人中回答
  rationale: בְּאַנְשֵׁי אָוֶן 可以表示比较，也可能表示伴随或归属。正文采用语境中较自然的比较义，脚注明确保存另一种句法理解，避免消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我父啊”保留原文异常而直接的称呼；“受考验到底”自然表达祈愿和强化语气。正文脚注标记依次为[a]、[b]、[c]，均在正文中出现。
