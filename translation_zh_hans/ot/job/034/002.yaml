  yaml_path: translation/ot/job/034/002.yaml
  text: Hear my words[a], you wise men, and give ear to me, you who know.
translation:
  language: zh_hans
  text: 有智慧的人哪，听我的话；有知识的人哪，侧耳听我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侧耳听我”也可译作“留心听我”；原文动词更直接带有“耳听”的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 请听
  rationale: 该词是复数命令式；“请听”在现代汉语中自然地表达直接劝告，并与后半句构成平行。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 该阳性复数形式在此作呼语。“智慧人”既保留名词化用法，也符合《约伯记》的庄重语体。
- source_word: מִלָּי
  choice: 我的话
  rationale: 该词意为“话、言语”，带第一人称单数后缀；“我的话”准确而自然。
- source_word: וְיֹדְעִים
  choice: 有知识的人
  rationale: 该复数分词在此作名词和呼语，直指“有知识、知道的人”；此译法不把“知道”进一步解释为“明白”，从而保留原文语义。
- source_word: הַאֲזִינוּ
  choice: 请侧耳听
  rationale: 该使役命令式源自与“耳”有关的词根。“侧耳听”保留耳听意象，同时是自然、庄重的现代汉语。
- source_word: לִי
  choice: 我
  rationale: 介词加第一人称单数后缀，在“侧耳听我”中自然表达听取说话者之意。
