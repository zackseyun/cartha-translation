base_translation:
  language: en
  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: zh_hans
  text: 因为，有谁曾对上帝说：“我已经承受惩罚[a]，不再作恶”？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我已经承受；我不作恶。”原文没有说明所承受的是什么，可能指惩罚、管教或所承担的罪责。
    reason: 保留 נָשָׂאתִי 宾语省略所造成的词义开放性，并以自然的现代汉语呈现 אֶחְבֹּל 的伦理性含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为以利户接下来的论述引出理由或说明，保留原文的连接作用。
- source_word: אֶל אֵל
  choice: 对上帝
  rationale: אֶל 表示言说所指向的对象；אֵל 在此是对神的通称，译作“上帝”清楚自然。
- source_word: הֶאָמַר
  choice: 岂有人……说
  rationale: 形式上是带疑问词的第三人称单数完成式；结合语境，表达泛指的反问。译文补出“有人”，使现代汉语自然，同时保留反问语气。
- source_word: נָשָׂאתִי
  choice: 我已经承受惩罚
  rationale: נשׂא 的基本义是“承担、承受”，原文没有明说宾语；语境可能指惩罚、管教或罪责。正文补出“惩罚”以便理解，并用脚注保留原文的省略与歧义。
- source_word: לֹא אֶחְבֹּל
  choice: 不再作恶
  rationale: חבל 在此按伦理意义理解为行恶、败坏或做错事；“不再作恶”自然表达停止错误行为的承诺。“再”是由语境体现的延续性含义，并非独立对应某个希伯来词。
theological_decisions:
- issue: נָשָׂאתִי 所承受之物是否应明确为惩罚
  choice: 正文译作“承受惩罚”，脚注说明宾语未明说
  alternative: 直译为“我已经承受”
  rationale: 原文有意或惯用地省略宾语，可能涉及惩罚、管教或罪责。正文采用语境中较可能且易懂的“惩罚”，但借脚注避免把这一解释说成唯一可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“岂有人”保留反问力度；引语用普通读者容易理解的表达，脚注则交代关键的原文歧义。
