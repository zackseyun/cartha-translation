  text: all flesh would perish together[a], and man would return to dust.
translation:
  language: zh_hans
  text: 凡有血肉的，都必一同气绝；人[a]也必归回尘土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”也可译作“人类”。希伯来语 אָדָם 是单数，但在这里可集合性地泛指全人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  choice: 气绝
  rationale: גוע指断气、死亡；“气绝”凝练庄重，并承接第14节的假设条件，表达“就会气绝”的结果。
- source_word: כָּל בָּשָׂר
  choice: 凡有血肉的
  rationale: 保留希伯来语“所有血肉”的具体意象，同时用现代汉语中自然的名词化结构表达一切有血肉的受造者。
- source_word: יָחַד
  choice: 一同
  rationale: 表达同时发生及共同承受结局的范围，贴合原文副词的强调。
- source_word: אָדָם
  choice: 人
  rationale: 原文为单数集合名词，可泛指人类；汉语“人”既保留单数形式，也能自然承载集合意义。
- source_word: עַל עָפָר
  choice: 归回尘土
  rationale: עַל字面为“在……之上”，但与שוב构成死亡归尘的表达时，汉语惯用“归回尘土”，也保留人源于尘土的经文意象。
- source_word: יָשׁוּב
  choice: 必归回
  rationale: שוב意为返回；本句延续上节假设所产生的必然结果，故以“必归回”表达结果性，而非脱离上下文改作无条件预言。
theological_decisions:
- issue: אָדָם在此处的泛指范围
  choice: 人
  alternative: 人类
  rationale: “人”既对应原文单数形式，又可在现代汉语中泛指全人类，并与前句“凡有血肉的”形成简洁平行；脚注说明其集合含义，避免被误解为某一个人或仅指男性。
- issue: 本节动词的条件语气
  choice: 以“必”表达上节条件成立后的必然结果
  alternative: 直译为无标记的“气绝／归回”
  rationale: 希伯来语未在本节重复条件词，但两个未完成式承接第14节的条件结构。译文用“必”标明在该条件之下的必然结果，同时不把本节独立化为无条件陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡有血肉的”保留原文意象；“气绝”比“灭亡”更直接对应死亡动作；“归回尘土”自然呼应圣经中人出于尘土、归于尘土的表达。脚注标记置于整节末尾，所注释的是后半句“人”的集合性含义。
