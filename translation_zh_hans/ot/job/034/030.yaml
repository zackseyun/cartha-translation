base_translation:
  language: en
  yaml_path: translation/ot/job/034/030.yaml
  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: zh_hans
  text: 使不敬虔的人不得掌权[a]，免得百姓落入网罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得不敬虔的人掌权，免得百姓遭遇网罗。”希伯来原文十分简略，“掌权”与“网罗”之间的句法关系可有几种相近的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: 不得掌权
  rationale: מִן接מלך的不定式连用，在承接上文神的作为时可表示阻止或防范；译为“不得掌权”既自然，也保留“不让其统治”的意思。
- source_word: אָדָם
  choice: 人
  rationale: 这里指一个可能掌权的个体，而非泛指全人类；现代汉语用“人”即可准确表达。
- source_word: חָנֵף
  choice: 不敬虔
  rationale: 该词在智慧文学中主要指对神不敬、道德败坏，并非现代意义上单指“虚伪”；“不敬虔”保留其道德与宗教色彩。
- source_word: מִמֹּקְשֵׁי
  choice: 免得……落入网罗
  rationale: 原文为带מִן的复数名词“网罗”，句法极其压缩。结合前半句的防范意味，将其表达为“免得……落入网罗”，能自然传达保护百姓不受陷害的意义，同时以脚注保留其他可能分析。
- source_word: עָם
  choice: 百姓
  rationale: 语境涉及统治者及其治下群体，“百姓”比“人民”更贴合古代治理语境，同时仍为现代读者所熟悉。
theological_decisions:
- issue: 本节压缩句法中两个מִן短语的关系
  choice: 神阻止不敬虔的人掌权，免得百姓落入网罗
  alternative: 不可让不敬虔的人掌权，也不可使百姓遭遇网罗；或：因百姓的网罗而阻止不敬虔的人掌权
  rationale: 本节承接上一节所述神的审判作为。将两个短语理解为防止恶人掌权及其给百姓造成的危害，最符合上下文的道德逻辑；但原文没有明示连接词，故在脚注中保留其句法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的表达。“掌权”对应统治语境；“落入网罗”保留原文诗歌意象。正文避免过度补述因果关系，并用脚注说明原文的压缩与歧义。
