base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: zh_hans
  text: 因为他必按人的行为报偿人；按人的道路，使人遭遇相应的结果[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使人遭遇相应的结果”也可译作“使这事临到他”或“把这事加在他身上”；希伯来语动词在这里含有使某种结果临到人的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，为以利户先前关于上帝绝不作恶的断言提供理由；现代汉语中“因为”自然保留解释性语气。
- source_word: פֹעַל אָדָם
  choice: 人所做的
  rationale: פֹעַל指人的行为或作为；采用自然汉语表达，既涵盖“行为、作为”，又符合本节报应语境。
- source_word: יְשַׁלֶּם לוֹ
  choice: 他必偿还给他
  rationale: שלם的Piel形在此有按行为回报、报偿之意。“偿还”保留司法和报应色彩，同时不预先限定回报为奖赏或惩罚。
- source_word: וּכְאֹרַח אִישׁ
  choice: 照着人的道路
  rationale: אֹרַח本义为道路，在这里比喻人的生活方式或行径；保留“道路”意象及与前半句的平行关系。
- source_word: יַמְצִאֶנּוּ
  choice: 他使人承受相应的结果
  rationale: מצא的Hiphil形可表示“使……遇见、经历”。直译为“使他找到”在现代汉语中生硬且可能误导；此译表达使人遭遇与其道路相应之事，同时将较直译的可能性列入脚注。
theological_decisions:
- issue: 上帝按照人的行为施行报偿
  choice: 本节陈述上帝按人的行为和道路给予相应回报的一般公义原则。
  alternative: 把本节理解为每一次苦难都必然是当事人某项罪行的精确惩罚。
  rationale: 原文强调行为与所得结果之间的对应，但并未在本节解释约伯的一切苦难；译文保留这一原则，也不消除全书对义人受苦所呈现的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人”在两处均作泛指，不在中文中强加性别。“道路”保留希伯来语的人生行径隐喻；后半句适度意译，以避免“使人找到”造成不自然或错误理解。
