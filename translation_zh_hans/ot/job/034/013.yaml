  yaml_path: translation/ot/job/034/013.yaml
  text: Who appointed the earth over him[a], and who set the whole world in place?
translation:
  language: zh_hans
  text: 谁曾把大地交给他管理[a]？谁曾把整个世界托付给他？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交给他管理”也可译作“委派他管理”或“交托给他负责”。希伯来语动词פָקַד可表示委派、责成或托付责任。后一句较字面可译作：“谁安置了整个世界？”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָקַד עָלָיו
  choice: 交给他管理
  rationale: פָקַד与עַל连用，在此表示委派管理、交付责任。译作“交给他管理”自然地表达反问的重点：没有更高权威任命上帝治理大地。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 本词可指土地或全地；与下句“世界”平行，语境具有宇宙性，故译作“大地”。
- source_word: שָׂם
  choice: 托付
  rationale: 基本义为“放置、安放”；在与上句委派管理的平行关系中，译作“托付”能表达把全世界置于某人责任之下的意思，同时不改变反问方向。
- source_word: תֵּבֵל כֻּלָּהּ
  choice: 整个世界
  rationale: תֵּבֵל指有秩序、有人居住的世界，כֻּלָּהּ强调其全部；“整个世界”简明保留这种整体性。
theological_decisions:
- issue: עָלָיו中第三人称阳性单数代词的所指
  choice: 理解为指上帝，译作“他”
  alternative: 可把句子理解为“谁把大地交托给他／使大地成为他的责任”，或在某些解释传统中弱化代词的明确所指
  rationale: 约伯记34:10—15的论证表明，以利户是在问：是否有更高者把大地交给上帝治理。上下文支持“他”指上帝，但脚注保留פָקַד所允许的委任、责成或托付等表达差异。
- issue: 两个分句之间的平行关系
  choice: 两句都理解为询问谁把受造世界交给上帝负责
  alternative: 第二句也可较字面地译为“谁安置了整个世界”
  rationale: 希伯来语שָׂם的宾语是“整个世界”，而受事者可由前句的עָלָיו延续理解。译文采用“托付给他”呈现上下文隐含关系；脚注说明较字面的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个反问句保持希伯来诗歌的平行结构；用“大地／整个世界”呈现宇宙范围，并以脚注保留פָקַד及第二分句句法上的真实解释空间。
