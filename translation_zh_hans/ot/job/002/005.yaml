  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֥ע אֶל עַצְמ֖/וֹ וְ/אֶל בְּשָׂר֑/וֹ אִם לֹ֥א אֶל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/005.yaml
  text: But stretch out your hand[a], please, and touch his bone and his flesh, and he will surely curse you to your face.
translation:
  language: zh_hans
  text: 可是，请你伸手触碰他的骨头和肉体，他必定当面咒诅你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“称颂你（或：祝福你）”；这里是委婉说法，意思是“咒诅你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: 可是
  rationale: 该转折词引出撒但的反驳和进一步挑战；“可是”在现代汉语中自然、明确，又不显得过分书面。
- source_word: שְׁלַח נָא יָדְךָ
  choice: 请你伸手
  rationale: “伸手”传达希伯来语“伸出／发出你的手”这一表示采取直接行动的惯用表达；“请”保留语气词 נָא 所含的请求意味。
- source_word: וְגַע
  choice: 触碰
  rationale: נגע 的基本义是“触碰”，在本语境中含有加害、击打之意；正文保留具体动作，让伤害意味由上下文显明，不直接窄化为某一种伤害方式。
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: 他的骨头和肉体
  rationale: 保留原文单数集合用法所形成的具体身体意象；不用“骨肉”，以免现代汉语读者误解为亲属，也不笼统化为“身体”。
- source_word: אִם לֹא
  choice: 必定
  rationale: 这里不是普通条件句，而是誓言式的强烈断言；“必定”自然表达撒但确信约伯会有相应反应的语气。
- source_word: אֶל פָּנֶיךָ
  choice: 当面
  rationale: 准确传达公开、直接面对对方的敌对行动，比逐字译作“向着你的脸”更符合现代汉语表达。
- source_word: יְבָרֲכֶךָּ
  choice: 咒诅你
  rationale: ברך 通常意为“赐福／称颂”，但在此处依上下文是敬避式委婉语，实际指咒诅或弃绝上帝；正文译明语境含义，字面形式在脚注交代。
theological_decisions:
- issue: 约伯受试探叙事中 ברך 的委婉用法
  choice: 正文译作“咒诅”
  alternative: 按字面译作“称颂／祝福”，再由注释解释
  rationale: 撒但的挑战是约伯受苦后会公开背弃、咒诅上帝。若正文直译为“称颂”或“祝福”，现代读者容易得到与语境相反的理解；脚注保留希伯来语字面信息，以呈现原文委婉表达的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“骨头和肉体”保留原文具体意象；“触碰”保留动作本身的含混性，同时上下文仍清楚暗示加害。脚注标记置于“咒诅你”之后，使其准确对应所解释的词。
