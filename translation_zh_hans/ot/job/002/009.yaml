base_translation:
  language: en
  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: zh_hans
  text: 他的妻子对他说：“你还持守你的纯正吗？祝福上帝[a]，死吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“祝福上帝，死吧”。许多人认为，这里的“祝福”是出于敬畏而采用的委婉说法，实际意思是“咒诅”。
    reason: 说明希伯来词的字面意义与语境中常见的委婉反义理解。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 对他说
  rationale: 未完成式转换形式配合连接词推进叙事；汉语上下文中不必机械译出“然后”，用“对他说”自然承接前文。
- source_word: אִשְׁתּוֹ
  choice: 他的妻子
  rationale: 直接表达名词及第三人称阳性单数所属关系。
- source_word: עֹדְךָ
  choice: 你还……吗
  rationale: עֹוד加第二人称单数后缀表示持续状态；结合语境，以反问句式自然传达妻子的责问语气。
- source_word: מַחֲזִיק
  choice: 持守
  rationale: חזק的分词在此表示持续牢牢守住或坚持；“持守”兼顾持续性、力度和庄重语体。
- source_word: בְּתֻמָּתֶךָ
  choice: 你的纯正
  rationale: תֻּמָּה可指纯正、正直、无可指摘；“纯正”与《约伯记》语境中的道德完整相称，同时不把它绝对化为完全无罪。介词ב与חזק搭配，在汉语中自然并入“持守”。
- source_word: בָּרֵךְ
  choice: 祝福
  rationale: 希伯来文本字面使用“祝福”。虽然此处常被理解为表示“咒诅”的敬语性委婉说法，正文保留源文词形，另以脚注说明可能的实际语义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处是通用神称אֱלֹהִים，并非圣约名יהוה；译作现代汉语通行的“上帝”。
- source_word: וָמֻת
  choice: 然后死吧
  rationale: 第二个命令式与前一命令式相连；“然后死吧”保留动作次序和原文突兀、严厉的语气。
theological_decisions:
- issue: “祝福”用于涉及冒犯上帝的语境
  choice: 正文保留字面的“祝福上帝”，脚注注明许多人理解为“咒诅上帝”的委婉说法。
  alternative: 正文直接译为“咒诅上帝”。
  rationale: 源文明确写בָּרֵךְ（祝福），但语境强烈支持反义委婉用法。保留字面形式并加注，既尊重原文证据，也不消除真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“持守你的纯正”保留《约伯记》的伦理关键词；“祝福上帝”刻意保留原文的异常表达，并通过脚注呈现其可能的委婉含义。
