  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: zh_hans
  text: 耶和华对那控告者[a]说：“你留心察看过我的仆人约伯吗？地上没有人像他那样；他是完全又正直的人，敬畏上帝，远离恶事。他仍然持守自己的纯正；尽管你煽动我攻击他，要白白地毁灭他[b][c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那控告者”：希伯来文带定冠词，是角色称谓；传统译作“撒但”。
    reason: alternative_reading
  - marker: b
    text: “毁灭他”：希伯来文字面意思是“吞灭他”，也可译作“毁掉他”。
    reason: lexical_alternative
  - marker: c
    text: “白白地”也可译作“无缘无故地”。这与1:9中控告者所问“约伯敬畏上帝，岂是白白的吗”彼此呼应。
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语中广为人知的神名音译，不以“主”这一称号替代原文专名。
- source_word: הַשָּׂטָן
  choice: 那控告者
  rationale: 原文带定冠词，在本段更像职衔或角色；“控告者”传达其控诉、敌对的功能，同时不预先把它处理为专名“撒但”。
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: 你留心察看过……吗
  rationale: 原文字面为“把你的心放在……上”；汉语用“留心察看”自然表达专注考虑之意，脚注保留字面形象。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 此处强调约伯属于并服事上帝的关系身份，“仆人”比“奴隶”更符合语境。
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: 地上没有人像他那样
  rationale: 叙事场景具有广阔范围，“地上”比“那地”更合适，也保持原文可理解的普遍范围。
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: 完全正直
  rationale: “完全”在此指人格完整、无可指摘，并非宣称绝对无罪；“正直”直接对应 יָשָׁר。
- source_word: יְרֵא אֱלֹהִים
  choice: 敬畏上帝
  rationale: 保留原文关于对上帝怀有敬畏的动词性描述及其神学分量。
- source_word: וְסָר מֵרָע
  choice: 远离恶事
  rationale: 自然表达 סור 所含转身避开的持续品格。
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: 他仍然持守自己的纯正
  rationale: “持守”表达 מַחֲזִיק 的坚定意味；“纯正”表达 תֻמָּה 的完整、正直品格，并与前文 תָּם 相呼应。
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: 尽管你煽动我攻击他
  rationale: “煽动”体现使役和挑动意味；“尽管”明确上下文中的让步关系，却不弱化原文直接归于耶和华的行动。
- source_word: לְבַלְּעוֹ
  choice: 要……毁灭他
  rationale: 原义为“吞灭他”，在此隐喻彻底毁坏；正文用自然的“毁灭”，脚注保留生动的字面表达。
- source_word: חִנָּם
  choice: 无缘无故地
  rationale: 准确表达“没有缘由、无辜受害”的语境含义；脚注指出它也可译为“白白地”，并与1:9形成文学呼应。
theological_decisions:
- issue: 上帝在约伯受苦中的参与
  choice: 保留“你煽动我攻击他”的直接措辞
  alternative: 你促使我容许他受害
  rationale: 希伯来文直接说控告者煽动耶和华攻击约伯。译文不以“容许”等措辞缓和神圣行动，由此保留叙事中的神学张力。
- issue: הַשָּׂטָן 的身份
  choice: 译作角色称谓“那控告者”
  alternative: 撒但
  rationale: 希伯来文带定冠词，更自然地指向此场景中的职能称谓；这样既呈现其敌对和控告角色，也不以较晚的专名用法消除文本自身的开放性。
- issue: 约伯的“完全”是否指绝对无罪
  choice: 将 תָּם 理解为人格完整、无可指摘
  alternative: 绝对无罪、毫无任何罪
  rationale: 本节赞许约伯的完整和正直品格，并未要求把他理解为形而上的无罪完人；译文保留“完全”一词，但不额外扩张其含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“留心察看”避免生硬照译“把心放在……上”；“完全正直”“持守自己的纯正”保留 תָּם／תֻמָּה 的词根呼应。正文直陈上帝受煽动而攻击约伯，不用解释性措辞消解其神学张力。所有脚注标记均已置入正文。
