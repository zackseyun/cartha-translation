  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר ע֣וֹר בְּעַד ע֗וֹר וְ/כֹל֙ אֲשֶׁ֣ר לָ/אִ֔ישׁ יִתֵּ֖ן בְּעַ֥ד נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: zh_hans
  text: 那控告者[a]回答耶和华说：“以皮换皮[b]！人所有的一切，都肯拿来换自己的性命[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“撒但”或“那敌对者”。希伯来语使用带定冠词的称谓，字面指敌对或控告的一方。
    reason: alternative_reading
  - marker: b
    text: “以皮换皮”是一句含义简练而不完全确定的谚语；在这里很可能表示，人会舍弃别的东西来保全自己的生命。
    reason: cultural_note
  - marker: c
    text: “性命”所译的希伯来语也可指“自身”；在本节语境中，保全生命的意思最为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: 那控告者
  rationale: 原文带定冠词，在《约伯记》序幕的天上议事场景中更像职分或称号，而非无冠词的专名。“那控告者”既体现其法庭式角色，也避免直接把后期作为专名的用法带入本节。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的上帝圣名译法，并与中文圣经传统保持可辨识的连续性。
- source_word: עוֹר בְּעַד עוֹר
  choice: 以皮换皮
  rationale: 保留原文简短、有力而含义略有歧义的谚语形式；“换”表达 בְּעַד 在此处的交换意味，同时不在正文中把谚语过度解释。
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: 人所有的一切
  rationale: 准确表达原文“一个人所拥有的一切”的泛指意义；中文用“人”自然涵盖一般人类，不必机械保留阳性形式。
- source_word: יִתֵּן
  choice: 都肯拿来换
  rationale: 未完成式在谚语式断言中表示一般性的意愿或倾向；“都肯”比单纯“都会”更自然地表达为保命而愿意付出的意味。
- source_word: נַפְשׁוֹ
  choice: 自己的性命
  rationale: נֶפֶשׁ 在此指人的生命或存活，而不是特指与身体分离的“灵魂”；“性命”契合受害与保命的上下文。
- source_word: בְּעַד נַפְשׁוֹ
  choice: 拿来换自己的性命
  rationale: 此处介词表达交换或代价关系；该译法与前句“以皮换皮”形成呼应，并符合现代汉语表达。
theological_decisions:
- issue: 《约伯记》序幕中 הַשָּׂטָן 的身份称谓
  choice: 那控告者
  alternative: 撒但；那敌对者
  rationale: 原文带定冠词，并在天上议事的语境中呈现角色性称谓。正文保留这一文学与神学张力，不借后期经文预先把它完全固定为专名；脚注同时交代传统译法。
- issue: נֶפֶשׁ 在本节所指
  choice: 性命
  alternative: 灵魂；自身
  rationale: 上下文谈人为了保全生命而交出所有财物，因此“性命”最合语境；脚注保留该词可指“自身”的词义幅度，避免建立身心二分的额外教义。
- issue: “以皮换皮”的解释
  choice: 正文保留原谚语，不确定其唯一解释
  alternative: 直接释为“人会牺牲别人的皮来保全自己的皮”或“人会舍弃财物来保命”
  rationale: 希伯来谚语的确切指向存在争议。直译可保存其凝练与歧义，脚注只说明较可能的语境含义，不把一种解释写死在正文中。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“以皮换皮”保留原文的谚语力度；后句用“都肯拿来换”使交换关系清楚自然。标点将感叹号置于谚语之后，以表现控告者断然反驳的语气。
