  yaml_path: translation/ot/job/002/008.yaml
  text: And he took a potsherd to scrape himself with while he was sitting among the ashes[a][b].
translation:
  language: zh_hans
  text: 他拿了一块碎陶片[a]，用来刮自己[b]；他正坐在灰烬中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一块陶器碎片”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“搔自己”。这个希伯来语动词可以表示搔抓，但“刮”更符合使用碎陶片的情景。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 他拿了
  rationale: 叙事性连续式推动情节；汉语用“拿了”自然表达动作的接续，不额外强化为因果。
- source_word: לוֹ
  choice: 不单独译出
  rationale: 此处与动词连用可表达主体为自己取用；汉语若译作“给自己拿”较生硬，而后文“自己的身体”已清楚表明反身关系。
- source_word: חֶרֶשׂ
  choice: 一块碎陶片
  rationale: 指破碎的陶器片；“碎陶片”准确、自然，也比单说“瓦片”更明确保留陶器材质。
- source_word: לְהִתְגָּרֵד
  choice: 刮自己的身体
  rationale: Hitpael不定式表达动作施于自身。“刮”符合用碎陶片进行的动作及其病痛语境，同时脚注保留“搔”的可能。
- source_word: בּוֹ
  choice: 用（由“拿……刮”句式体现）
  rationale: 介词加代词表示工具。汉语将工具置于动词前，以“拿了一块碎陶片刮……”自然体现“用它”。
- source_word: וְהוּא יֹשֵׁב
  choice: 当时他正坐在
  rationale: 该分句描述与刮身体同时发生的状态；“当时……正……”自然传达伴随背景，而不误作后续动作。
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: 在炉灰中
  rationale: בְּתוֹךְ表示“在……中间”；“炉灰中”保留其空间图像。אֵפֶר可指灰烬，此处传统语境常理解为倒灰之处，正文不进一步解释为灰堆。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“碎陶片”兼顾词义精确与普通读者的可理解性；“当时他正坐在”明确伴随状态。所有脚注标记均置于正文相应词句之后。
