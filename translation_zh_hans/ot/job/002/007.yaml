  to: 于是，那敌对者离开雅威面前，用严重的疮击打约伯，使他从脚掌到头顶都长满了疮[a][b]。
  rationale: 修订以“离开”准确对应“出去”，以“用……击打”保留原文动词的直接施加性，并以“严重的疮”表达 רָע 对皮肤疮患的强化，而不把病症误说为带毒。正文继续将带定冠词的 הַשָּׂטָן 译为角色性称号，并在脚注中透明保留传统专名译法及语义替代。
