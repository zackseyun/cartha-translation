base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: zh_hans
  text: 于是，那敌对者离开雅威面前，用严重的疮击打约伯，使他从脚掌到头顶都长满了疮[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“那撒但”；传统译作“撒但”。这里有定冠词，可能用作称号，意为“那敌对者”或“那控告者”。
    reason: alternative_reading
  - marker: b
    text: “严重的疮”也可译作“痛苦的疮”或“严重的疮疖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: 那控告者
  rationale: 希伯来文带定冠词，在《约伯记》序言中更像职分或称号，而非明确固定的专名；“那控告者”保留其敌对、控告的角色含义。
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: 从雅威面前
  rationale: 该结构表示离开雅威所在之处；“从……面前退去”自然传达这一空间及临在含义，并直接音译神名 יהוה 为“雅威”。
- source_word: וַיַּךְ
  choice: 使……长满
  rationale: נכה 本义为击打；与疾病作工具补语时表示以疾病击打、使其患病。中文用“使……长满”既保留直接施加灾病的因果关系，也与全身疮患的描写自然衔接。
- source_word: בִּשְׁחִין רָע
  choice: 毒疮
  rationale: שְׁחִין 指发炎的疮疖或严重皮肤病，רָע 在此形容其恶劣、严重。“毒疮”是简洁而有尊严的传统现代汉语表达，但不把病症限定为某一种现代医学诊断。
- source_word: מִכַּף רַגְלוֹ
  choice: 从脚掌
  rationale: כַּף 与脚连用明确指脚底、脚掌；“脚掌”准确自然。
- source_word: עַד קָדְקֳדוֹ
  choice: 到头顶
  rationale: קָדְקֹד 指头的顶部；“头顶”清楚表达病患遍及全身。
theological_decisions:
- issue: 《约伯记》序言中 הַשָּׂטָן 的译法
  choice: 那控告者
  alternative: 撒但
  rationale: 原文有定冠词，较可能表示一种角色或称号。正文不直接把它固定为专名，以免把后期用法无声地带入本段；传统译法置于脚注。
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 直接以现代汉语常用学术音译“雅威”呈现四字神名，保留其作为专有名的性质。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“于是”承接前文事件；“从脚掌到头顶”保留希伯来文首尾并举、表示全身遍布的表达。脚注标记均置于相关句末。
