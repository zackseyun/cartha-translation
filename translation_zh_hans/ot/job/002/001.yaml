base_translation:
  language: en
  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: zh_hans
  text: 又有一天，神的众子[a]来侍立在雅威面前；那敌对者[b]也来到他们中间，侍立在雅威面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“神的儿子们”。这可能指天上的众生，也可能指神圣议会的成员。
    reason: lexical_alternative
  - marker: b
    text: 或译“撒但”。希伯来语带定冠词，直译近于“那敌对者”，在这里很可能是意为“敌对者”或“控告者”的称谓。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: 又有一天
  rationale: 承接并重现1:6的场景；“又”表达叙事上的再次发生，“有一天”则以自然的现代汉语传达希伯来语句式。
- source_word: בְּנֵי הָאֱלֹהִים
  choice: 神的众子
  rationale: 保留希伯来语“神的儿子们”这一原有表达及其解释空间，不直接限定为“天使”“天上众生”或“神圣议会成员”；“众子”庄重而简洁。
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: 侍立在雅威面前
  rationale: 此处 התיצב 表示来到尊长面前站立候命或呈报；“侍立”自然地体现宫廷式场景，也保留站立服侍之意。两次出现均作同样翻译，以维持平行结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名的常见学术拟音作音译，而不以“主”这一称号代替，保留其专名性质。
- source_word: הַשָּׂטָן
  choice: 那敌对者
  rationale: 原文带定冠词，在此更像职衔或角色称谓，而非已经固定化的专名；“敌对者”保留 שׂטן 的基本词义，“那”则体现其有定性。
- source_word: בְּתוֹכָם
  choice: 他们中间
  rationale: 以自然现代汉语准确表达其置身于这群来者之中的意思。
theological_decisions:
- issue: הַשָּׂטָן 在本节是专名还是带定冠词的角色称谓
  choice: 那敌对者
  alternative: 撒但；那撒但；那控告者
  rationale: 希伯来语带定冠词，较自然地指向一个角色或职衔。“那敌对者”既反映语法形式和基本词义，也不把后期固定专名的理解预先强加于本节；脚注保留其他可能译法。
- issue: בְּנֵי הָאֱלֹהִים 所指群体的身份
  choice: 神的众子
  alternative: 天上众生；神圣议会的成员
  rationale: 直译保留原文意象及其神学张力，不在正文中判定他们的确切身份。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“又有一天”照应前文同一场景；分号清楚呈现两组来者的平行关系。“侍立”带有在尊长面前候命的宫廷语感，但不过度解释。正文中的[a]、[b]均与脚注一一对应。
