  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: zh_hans
  text: 他们就同他坐在地上，七天七夜[a]，没有一个人对他说一句话，因为他们看出他的痛苦极其严重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “痛苦”也可译作“疼痛”或“悲痛”。原文所用的词含义较广，可以包括身体的疼痛和内心的苦楚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ אִתּוֹ לָאָרֶץ
  choice: 他们就同他坐在地上
  rationale: ישׁב在此保留“坐”的具体动作；לָאָרֶץ结合哀悼场景自然译为“在地上”。“同他”准确表达陪伴之意。
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: 七天七夜
  rationale: 直译完整保留原文的时间表达，现代汉语也自然。
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: 没有一个人对他说一句话
  rationale: 保留原文“说……一句话”的加强式表达，突出众人完全沉默。
- source_word: כִּי רָאוּ
  choice: 因为他们看出
  rationale: 第一个כִּי说明沉默的原因；“看出”比单纯“看见”更自然地表达由所见而认识其严重程度。
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: 他的痛苦极其深重
  rationale: כאב可涵盖身体疼痛和内心苦楚；“痛苦”保留这种较宽语义。גדל与מְאֹד共同表达程度强烈，译作“极其深重”庄重而自然。
