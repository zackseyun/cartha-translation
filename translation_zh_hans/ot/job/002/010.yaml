base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: zh_hans
  text: 他对她说：“你说话像愚妄妇人中的一个。难道我们从上帝领受福，却不领受祸患[a]吗？”在这一切事上，约伯并没有在言语上犯罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灾难”；传统译作“恶”。这里的希伯来词 רָע 与“福”相对，指有害或不利的境遇。
    reason: 保留该词的传统译法和语境性替代译法，同时避免正文被误解为指道德上的邪恶。
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: 你说话像一个愚妄的妇人
  rationale: נְבָלוֹת 表示带有道德和信仰意味的愚妄，并非单指智力不足。“愚妄”既保留这种伦理分量，也符合现代中文圣经语体。阴性复数形容词结合上下文表达为“妇人”。
- source_word: גַּם אֶת־הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: 难道我们从上帝领受福
  rationale: 未完成式 נְקַבֵּל 在这里与下句构成反问。“领受”贴合从上帝那里接受之意；“福”简洁表达带定冠词的“好处、美福”这一概括类别。
- source_word: וְאֶת־הָרָע לֹא נְקַבֵּל
  choice: 却不领受祸患
  rationale: רָע 在此与“福”相对，按受苦语境指不利、伤害性的遭遇，而非断言上帝赐下道德上的邪恶。“祸患”在现代中文中自然、庄重，也保留原文所说不利境遇的力度。
- source_word: בְּכָל־זֹאת
  choice: 在这一切事上
  rationale: 这是自然的中文总结语，承接前文全部遭遇及约伯刚才所说的话，而不过度解释其范围。
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: 约伯并没有用嘴唇犯罪
  rationale: 保留希伯来文“用他的嘴唇”这一身体意象，并限定叙述者的评价关乎约伯所说的话；“并没有”在中文中自然承接前面的考验。
theological_decisions:
- issue: הָרָע 与上帝的关系
  choice: 译作“祸患”，指人在上帝主权之下所领受的不利境遇，不将其明确说成道德上的恶。
  alternative: 可译“灾难”或依传统译作“恶”。
  rationale: 经文把 הָרָע 与“福”并列对照，语境是约伯遭受的苦难。译作“恶”可能使现代读者误以为这里明确断言上帝是道德邪恶的作者；“祸患”避免这一额外断言，同时没有消除经文关于人从上帝领受苦难的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚妄”保留原文的道德与信仰色彩；“用嘴唇犯罪”略带希伯来语意象，但中文仍可理解，并有意保留叙述者只评价约伯言语的细微限定。
