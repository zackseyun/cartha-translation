base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: zh_hans
  text: 他们从远处举目观看[a]，却认不出他来。于是他们放声大哭，各人撕裂自己的外袍，又把尘土向天[b]扬起，撒在自己头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从远方。”
    reason: lexical_alternative
  - marker: b
    text: “向天”直译为“朝着诸天”，指他们在哀悼中把尘土向上扬起。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת־עֵינֵיהֶם
  choice: 举目观看
  rationale: 保留希伯来语“举起眼睛”的意象，同时采用现代汉语中自然、庄重的表达。
- source_word: מֵרָחוֹק
  choice: 从远处
  rationale: 清楚表达他们与约伯之间的空间距离；“从远方”亦可。
- source_word: וְלֹא הִכִּירֻהוּ
  choice: 却认不出他来
  rationale: 此处指约伯的外貌已改变到朋友无法辨认，译作“认不出”比泛泛的“不认识”更准确。
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: 于是他们放声大哭
  rationale: 以自然汉语传达“扬声而哭”的哀恸动作，不削弱其强烈程度。
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: 各人撕裂自己的外袍
  rationale: אִישׁ在此具有逐一分配的含义；מְעִיל指袍子或外衣，译作“外袍”兼顾具体性与庄重语体。
- source_word: וַיִּזְרְקוּ עָפָר עַל־רָאשֵׁיהֶם
  choice: 把尘土……扬起，撒在自己头上
  rationale: 表达把尘土抛起而落在头上的哀悼举动；“自己头上”与前面的“各人”在汉语中自然呼应。
- source_word: הַשָּׁמָיְמָה
  choice: 向天
  rationale: 保留方向词尾所表达的向上运动；“向天”比“朝着诸天”更符合现代汉语，同时未把它解释成神学意义上的“天堂”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“举目观看”保留原文意象，“放声大哭”自然传达公开哀号；对撕裂外袍和扬尘于头的古代哀悼动作不作正文内的解释，以脚注补充必要信息。
