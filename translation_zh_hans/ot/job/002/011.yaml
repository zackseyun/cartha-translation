source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל הָ/רָעָ֣ה הַ/זֹּאת֮ הַ/בָּ֣אָה עָלָי/ו֒ וַ/יָּבֹ֨אוּ֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ אֱלִיפַ֤ז הַ/תֵּימָנִי֙ וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֔י וְ/צוֹפַ֖ר הַ/נַּֽעֲמָתִ֑י וַ/יִּוָּעֲד֣וּ יַחְדָּ֔ו לָ/ב֥וֹא לָ/נֽוּד ל֖/וֹ וּֽ/לְ/נַחֲמֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: zh_hans
  text: 约伯的三个朋友听说这一切临到他的灾祸[a]，就各自从本地来。他们是提幔人以利法、书亚人比勒达和拿玛人琐法。他们相约一同前来[b]，向约伯表示哀痛[c]，安慰他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”或译“不幸”“患难”。这里的希伯来语指临到约伯的灾难，不是指他所行的恶。
    reason: lexical_alternative
  - marker: b
    text: “相约一同前来”也可理解为“约定会合后前来”。原文强调他们有意协调这次行动。
    reason: lexical_alternative
  - marker: c
    text: “表示哀痛”也可译“向他表示同情”或“与他一同哀伤”。原词常指面对苦难或死亡时表达同情和哀悼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听说
  rationale: 该动词在此指朋友得知约伯所遭遇的事；“听说”比单纯“听见”更符合现代汉语叙事语境。句首不另加原文没有的“现在”。
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: 约伯的三个朋友
  rationale: 自然表达希伯来语的属格结构；רֵעַ在此取通常意义“朋友”。
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: 这一切……灾祸
  rationale: רָעָה在此指临到约伯的灾难或不幸，并非约伯所犯的道德恶行；“灾祸”准确且符合庄重叙事语体。
- source_word: הַבָּאָה עָלָיו
  choice: 临到他的
  rationale: 保留原文“来到、临到某人”的意象，并用前置修饰语形成自然汉语。
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: 就各自从本地来
  rationale: אִישׁ在此作分配性用法，意为“各自”；מִמְּקֹמוֹ指各人所在之处，译作“本地”简洁自然。
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: 提幔人／书亚人／拿玛人
  rationale: 按现代中文圣经人名、族地称谓的常见形式音译，并以“人”表明地域或族属称谓。
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: 他们相约一同
  rationale: 该动词的Nifal形态表达约定、安排或会合；“相约一同”保留有意协调的含义，又不武断限定他们是否先已会面。
- source_word: לָבוֹא
  choice: 前来
  rationale: 保留原文“来”的方向视角；“前来”在汉语中也自然承接他们为特定目的采取行动。
- source_word: לָנוּד לוֹ
  choice: 向约伯表示哀痛
  rationale: נוּד可指因他人受苦而表示同情、哀悼或慰问。“表示哀痛”保留哀伤和同情的动作意味，并与随后“安慰”区分。
- source_word: וּלְנַחֲמוֹ
  choice: 安慰他
  rationale: נחם在Piel词干中通常意为安慰或劝慰；“安慰”是清楚自然的现代汉语表达。
