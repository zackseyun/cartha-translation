base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: zh_hans
  text: 耶和华对控告者[a]说：“你从哪里来？”控告者回答耶和华说：“我是在地上四处游走、来回行走而来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：“那撒但”；这里很可能是一个称号，意思是“控告者”或“敌对者”，未必是专名。
    reason: 说明原文带定冠词，并保留专名与角色称号之间的解释空间。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字译法“耶和华”，以名字而非“主”这一称号来对应四字神名。
- source_word: הַשָּׂטָן
  choice: 那控告者
  rationale: 原文带定冠词，在《约伯记》1—2章的天上议会场景中更自然地表示职分或角色；“控告者”保留其控诉、敌对的语义，而不直接把它处理为专名。
- source_word: אֵי מִזֶּה תָּבֹא
  choice: 你从哪里来？
  rationale: 自然表达来源或来处，并保留介词מִן所体现的方向意义。
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: 回答……说
  rationale: 中文“回答……说”自然保留原文两个叙事动词的连续结构。
- source_word: מִשֻּׁט
  choice: 从……巡游而来
  rationale: שׁוּט表示四处往来、游走；“巡游”简洁而庄重，表达在地上到处活动，但不必然赋予正式巡逻的含义。
- source_word: בָּאָרֶץ
  choice: 地上
  rationale: 此处אֶרֶץ指广义的地或人所居住的世界，并与其上的移动相配。
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: 又在那里来回走动
  rationale: התהלך在此表达反复、四处行走；“来回走动”保留迭代意味，也避免加入原文未明说的任务性质。
theological_decisions:
- issue: הַשָּׂטָן应译作专名“撒但”，还是表示角色的称号
  choice: 译作“那控告者”
  alternative: “撒但”、“那敌对者”
  rationale: 原文带定冠词，并在天上议会语境中作为角色称谓使用。译作“那控告者”既反映其语法形式和功能，也避免用后期形成的专名理解消解本段自身的含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“那控告者”与脚注共同呈现原文的称号性质；“巡游……来回走动”保留两个近义动作短语及其重复往来的意象。
