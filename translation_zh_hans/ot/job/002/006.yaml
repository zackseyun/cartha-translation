  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן הִנּ֣/וֹ בְ/יָדֶ֑/ךָ אַ֖ךְ אֶת נַפְשׁ֥/וֹ שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: zh_hans
  text: 耶和华对那控告者说：“看，他在你手中；只是要保全他的性命。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名表达四字神名，与普通称谓“主”有所区别。
- source_word: הַשָּׂטָן
  choice: 那控告者
  rationale: 此处带定冠词，在《约伯记》的天上议会场景中宜保留其角色称谓含义，而不直接处理为专名“撒但”。
- source_word: הִנּוֹ
  choice: 看
  rationale: 自然传达指示词的提醒、引人注意功能。
- source_word: בְיָדֶךָ
  choice: 在你手中
  rationale: 保留原文惯用比喻，表示交在对方权力或处置范围之下。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: 在“保全”的语境中指约伯的生命，而非抽象的“灵魂”。
- source_word: שְׁמֹר
  choice: 保全
  rationale: 该动词基本义为看守、保守；在此禁令语境中表示不可夺去其生命，与“性命”搭配自然。
theological_decisions:
- issue: הַשָּׂטָן是称谓还是专名
  choice: 那控告者
  alternative: 撒但
  rationale: 定冠词支持将其理解为角色称谓；译文不预先把此角色完全等同于后期作为专名的“撒但”，从而保留叙事本身的表达。
- issue: נֶפֶשׁ的含义
  choice: 性命
  alternative: 灵魂
  rationale: 上下文划定的是不可杀死约伯的界限，因此这里指活着的生命，不支持身心二分意义上的“灵魂”。
- issue: 神许可范围的表达
  choice: 他在你手中；只是要保全他的性命
  alternative: 任你处置；但不可伤害他的灵魂
  rationale: 保留原文一方面交付、另一方面限制的张力，不扩大或削弱许可的范围。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话；保留“在你手中”这一自然且具有原文色彩的比喻。
