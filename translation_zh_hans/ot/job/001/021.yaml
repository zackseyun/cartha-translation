base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: zh_hans
  text: 他说：“我赤身出母腹，也必赤身归回那里[a]。雅威[b]赐下，雅威取去；愿雅威的名得称颂。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“那里”，并未明说所归之处；这可能以母腹为比喻，也可能泛指大地、坟墓，或死亡时一无所有的状态。
    reason: 保留原文指向不明的表达，避免把解释写入正文。
  - marker: b
    text: “雅威”音译希伯来文神名YHWH；传统中文也常译作“耶和华”，有些译本以“主”代称。
    reason: 说明神名的原文形式及常见中文译法。
lexical_decisions:
- source_word: עָרֹם
  choice: 赤身
  rationale: 既保留出生时身体赤裸的具体意象，也能表达死亡时一无所带的含义；两次同词同译，以呈现原文的首尾呼应。
- source_word: יצתי מִבֶּטֶן אִמִּי
  choice: 我赤身出母腹
  rationale: יצא在此指从母腹出生；“出母腹”简洁庄重，并保留原文具体的身体意象。
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: 也必赤身归回那里
  rationale: 保留שָׁמָה“那里”，不擅自明确为地、坟墓或母腹；“赤身”前置则维持原文对一无所有状态的强调。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名YHWH，而不以称号替代；首次出现加注说明。
- source_word: נָתַן
  choice: 赐下
  rationale: 表达“给予”的完成行动；在神作为主语的语境中，“赐下”自然、庄重，但不额外限定所赐之物。
- source_word: לָקָח
  choice: 取去
  rationale: 贴近“拿走、取走”的基本意义，并与“赐下”构成简洁有力的对照；避免用“收回”暗中加入原文未明说的所有权论断。
- source_word: יְהִי שֵׁם יְהוָה מְבֹרָךְ
  choice: 愿雅威的名受祝颂
  rationale: “愿”体现祈愿式语气；“受祝颂”保留מְבֹרָךְ的被动含义，也符合现代汉语敬虔而庄重的表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此正文保留专名，不以“主”这一称号替代；“雅威”是对较通行学术复原读音Yahweh的现代汉语音译。
- issue: “归回那里”（שָׁמָה）的指向
  choice: 保留“那里”及其隐含指向
  alternative: 归回尘土；归入坟墓；回到母腹
  rationale: 希伯来文只说“那里”，可能借母腹作比喻，也可能使人联想到大地、坟墓，或死亡时一无所有的状态。正文不将这种含混单一化。
- issue: 雅威“取去”的神学表述
  choice: 直译为“取去”
  alternative: 收回；夺去
  rationale: “取去”既呈现神是行动主体，也不加入“收回”所暗示的明确所有权解释，或“夺去”可能带出的负面道德评价。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与诗性语言。“赤身……赤身”及“赐下……取去”保留原文的对称和节奏；分号呈现末句祝颂与前两句陈述之间的转折与提升。
