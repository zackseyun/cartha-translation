  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: zh_hans
  text: 在乌斯地，有一个人，名叫约伯。那人纯全正直，敬畏神，远离恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“避开恶。”希伯来语动词可以表示转离、离开或避开。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָיָה
  choice: 有一个人
  rationale: 按希伯来语叙事开篇的存在句来译，简洁自然，不额外加入“住着”等原文未明说的信息。
- source_word: בְאֶרֶץ עוּץ
  choice: 乌斯地
  rationale: אֶרֶץ在地名结构中指地域；“乌斯”采用中文圣经传统中清楚易认的音译。
- source_word: אִיּוֹב שְׁמוֹ
  choice: 名叫约伯
  rationale: 自然表达命名句的识别作用，并采用通行的人名音译“约伯”。
- source_word: תָּם
  choice: 纯全
  rationale: 该词在智慧文学语境中强调品格完整、无可指摘，并不必然表示绝对无罪；“纯全”保留了这种强烈而不过度的道德赞许。
- source_word: יָשָׁר
  choice: 正直
  rationale: 准确表达伦理上的端正，与“纯全”搭配自然。
- source_word: וִירֵא אֱלֹהִים
  choice: 敬畏神
  rationale: 这里指对神虔敬、尊崇的态度，而非单纯恐惧；אֱלֹהִים在本句语境中指单数的神。
- source_word: וְסָר מֵרָע
  choice: 远离恶事
  rationale: סוּר מן可表示转离、离开或避开；“远离”在现代中文中自然地传达主动拒绝和避免恶的含义。
theological_decisions:
- issue: 约伯道德品格描述的含义
  choice: 将约伯描述为品格完整、正直的人，但不把原文扩展为绝对无罪
  alternative: 译成“完美无罪”，使其表示绝对的道德完美
  rationale: תָּם和יָשָׁר在智慧文学中给予约伯高度的道德肯定，却不要求读者把他理解为绝对没有任何罪。
- issue: אֱלֹהִים的所指
  choice: 神
  alternative: 诸神
  rationale: 尽管该词形式上为复数，本句惯用语和《约伯记》的叙事语境都要求单数所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“纯全正直”保留原文并列的品格评价；脚注标记放在其实际说明的“远离恶事”之后。
