base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: zh_hans
  text: 这人还在说话的时候，又有人来，说：“迦勒底人分成三队[a]，袭击骆驼，把它们掳走了；又用刀杀了那些年轻人[b][c]。只有我一个人逃脱，来向你报信。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“编成三支队伍”；原文直译为“设立三个头”。
    reason: lexical_alternative
  - marker: b
    text: “年轻人”在这里也可能指家中的仆人或侍从。
    reason: lexical_alternative
  - marker: c
    text: 原文是“用刀剑的口击杀”，这是指用刀剑杀死人的希伯来语惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: 这人还在说话的时候
  rationale: עֹוד与分词表示动作仍在持续；“这人”承接上一位报信者，“……的时候”自然表达事件重叠。
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: 又有人来，说
  rationale: 第二个זֶה在连续报信的叙事结构中指另一位使者；现代汉语用“又有人”更自然。
- source_word: כַּשְׂדִּים
  choice: 迦勒底人
  rationale: 按族名译出，指实施袭击的群体。
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: 分成三队
  rationale: 字面为“设立三个头”，在军事袭击语境中指分成三个队伍；脚注保留字面意象及其他可能表达。
- source_word: וַיִּפְשְׁטוּ עַל
  choice: 袭击
  rationale: פשט על在此表示突然出击、突袭；“袭击”简洁且符合现代汉语。
- source_word: הַגְּמַלִּים וַיִּקָּחוּם
  choice: 袭击骆驼，把它们掳走了
  rationale: 代词后缀指骆驼；“掳走”比单纯“带走”更清楚传达劫掠语境。
- source_word: הַנְּעָרִים
  choice: 那些年轻人
  rationale: נְעָרִים基本义为年轻男子，也可按处境指仆人或侍从；正文保留较宽泛的词义，脚注说明语境可能性。
- source_word: הִכּוּ לְפִי חָרֶב
  choice: 用刀杀了
  rationale: 希伯来语惯用语字面为“按着刀剑的口”，实际表示用刀剑击杀；正文采用自然清楚的汉语，脚注保留原文意象。
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: 只有我一个人逃脱
  rationale: רַק与לְבַדִּי共同强调报信者是唯一逃脱的人。
- source_word: לְהַגִּיד לָךְ
  choice: 来向你报信
  rationale: הגיד意为告诉、报告；在使者带来灾讯的固定场景中，“报信”自然准确。
