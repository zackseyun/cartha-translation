  text: וַ/יְהִ֡י כִּ֣י הִקִּיפֽוּ֩ יְמֵ֨י הַ/מִּשְׁתֶּ֜ה וַ/יִּשְׁלַ֧ח אִיּ֣וֹב וַֽ/יְקַדְּשֵׁ֗/ם וְ/הִשְׁכִּ֣ים בַּ/בֹּקֶר֮ וְ/הֶעֱלָ֣ה עֹלוֹת֮ מִסְפַּ֣ר כֻּלָּ/ם֒ כִּ֚י אָמַ֣ר אִיּ֔וֹב אוּלַי֙ חָטְא֣וּ בָנַ֔/י וּ/בֵרֲכ֥וּ אֱלֹהִ֖ים בִּ/לְבָבָ֑/ם כָּ֛כָה יַעֲשֶׂ֥ה אִיּ֖וֹב כָּל הַ/יָּמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: zh_hans
  text: 宴饮的日子轮流完毕以后，约伯就派人去叫他们来，使他们分别为圣。他清早起来，按着他们全体的人数献上燔祭；因为约伯说：“恐怕我的儿女犯了罪，心里咒诅了上帝。”约伯一向这样做。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: 宴饮的日子轮完以后
  rationale: הקיף在此描写一轮宴饮日程走完；“轮完”既保留循环、周行之意，也比单纯“结束”更贴近上下文中各家轮流设宴的情景。
- source_word: וַיְקַדְּשֵׁם
  choice: 使儿女们洁净
  rationale: קדש在礼仪语境中可指使人分别为圣或使其礼仪上洁净。此处与随后献祭相连，“使……洁净”自然易懂，同时不具体添加原文未说明的仪式。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是献祭术语，指祭牲全部焚烧献上的祭；采用现代中文圣经读者熟悉且准确的“燔祭”。
- source_word: וּבֵרֲכוּ אֱלֹהִים
  choice: 咒诅了上帝
  rationale: ברך字面通常为“祝福”，但在《约伯记》相关语境中是敬避性的反语，实际所指为咒诅或弃绝上帝；直译“祝福”会在现代中文中造成错误理解。
- source_word: כָּכָה יַעֲשֶׂה אִיּוֹב כָּל הַיָּמִים
  choice: 约伯一向都是这样做
  rationale: 未完成体配合“所有日子”表达惯常、持续行为；“一向都是这样做”比字面“所有日子”更自然，并保留反复惯例之意。
theological_decisions:
- issue: 约伯为儿女献祭的性质
  choice: 按原文叙述为预防可能发生的内心犯罪而献祭，不说明祭礼必然产生何种功效
  alternative: 解释为约伯替儿女赎罪，或断言这些祭物保证儿女得赦免
  rationale: 经文只陈述约伯因“恐怕”儿女犯罪而洁净他们并献燔祭，没有系统说明代赎范围或效果，因此不加入额外教义结论。
- issue: בֵרֲכוּ的敬避性反语
  choice: 译为“咒诅”
  alternative: 按常见词义直译为“祝福”
  rationale: 上下文把该行为称为犯罪，且《约伯记》1—2章多次以ברך委婉指咒诅上帝；译出实际语用意义才能忠实传达经文。
- issue: “心里”的含义
  choice: 保留为“心里”，指内在思想或意念
  alternative: 扩展为“暗中”或“真心地”咒诅
  rationale: בִּלְבָבָם强调内在层面，但没有明确说明是否有外在言行，也不应强化为主观真诚程度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“燔祭”这一必要的古代祭祀术语；其余表达尽量避免文言化。“儿女们”在首句承接上文所述众子众女，后引语中的“我的儿女”自然包含约伯所担忧的全部子女。
