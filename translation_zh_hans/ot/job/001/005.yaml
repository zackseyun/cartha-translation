revisions:
- from: 宴饮的日子轮完以后，约伯就派人去，使儿女们洁净。他清早起来，照着他们所有人的数目献上燔祭。因为约伯说：“恐怕我的儿女犯了罪，心里咒诅了上帝。”约伯一向都是这样做。
  to: 宴饮的日子轮流完毕以后，约伯就派人去叫他们来，使他们分别为圣。他清早起来，按着他们全体的人数献上燔祭；因为约伯说：“恐怕我的儿女犯了罪，心里咒诅了上帝。”约伯一向这样做。
  rationale: 修订只改善中文自然度，并将“使……洁净”调整为更直接对应קדש的“使……分别为圣”。“派人去叫他们来”表达“差遣”和后续使其成圣的实际对象关系，不增加祭仪细节。保留“咒诅上帝”，因为此处“祝福”是《约伯记》语境中的敬避性表达；保留“燔祭”和“心里”的关键术语与范围。
