  timestamp: '2026-07-14T06:21:28Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了宴饮周期结束、约伯使子女成圣、清晨按全体人数献燔祭，以及他担忧子女内心犯罪并咒诅上帝的意思。惟“轮完”不合现代汉语惯用表达；“洁净”虽与礼仪语境相关，却将קדש（使之成圣／分别为圣）的核心意义窄化为洁净。
  naturalness: “宴饮的日子轮完以后”和“照着他们所有人的数目”略显生硬。改为“宴饮的日子轮流完毕”“按着他们全体的人数”，较符合庄重、自然的现代标准汉语。
  terminology: “燔祭”准确保留献祭术语；“上帝”前后一致；将“使……洁净”改为“使他们分别为圣”，更贴合קדש的礼仪性用语，且不臆定具体仪式。
  issues:
  - severity: medium
    issue: “轮完”不够自然
    rationale: “宴饮的日子轮完”不是现代标准汉语中自然的说法。原文的“环绕／走完一轮”在本段轮流宴饮的语境中，可自然译为“轮流完毕”。
  - severity: medium
    issue: “使儿女们洁净”窄化了“使之成圣”
    rationale: וַיְקַדְּשֵׁם的词根为קדש，主要指使人分别为圣、成圣；礼仪洁净可相关，却不是该词本身最直接的表达。译作“使他们分别为圣”可保留原文的礼仪含义而不添加未说明的程序。
  - severity: low
    issue: 人数表达略显累赘
    rationale: “照着他们所有人的数目”虽可理解，但“按着他们全体的人数”更符合中文习惯，并忠实表达“按他们全体的数目”。
  revised_text: 宴饮的日子轮流完毕以后，约伯就派人去叫他们来，使他们分别为圣。他清早起来，按着他们全体的人数献上燔祭；因为约伯说：“恐怕我的儿女犯了罪，心里咒诅了上帝。”约伯一向这样做。
