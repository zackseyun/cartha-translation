  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: zh_hans
  text: 雅威对那控告者[a]说：“看哪，他所有的一切都在你手中；只是不可向他伸手。”于是，那控告者从雅威面前出去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那撒但”或“那敌对者”。希伯来文带定冠词，表明这很可能是称号或角色。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术读音音译，保留其作为上帝专名的性质，不以称号替代。
- source_word: הַשָּׂטָן
  choice: 那控告者
  rationale: 希伯来文带定冠词，在本段更像职分或称号；“控告者”也贴合此处提出指控和挑战的语境，同时避免直接把后期作为专名的理解带入经文。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意并加强语气的功能；表达庄重而仍为现代读者所理解。
- source_word: כָל אֲשֶׁר לוֹ
  choice: 他所有的一切
  rationale: 自然表达约伯拥有的全部事物，并保留原文概括性的范围。
- source_word: בְּיָדֶךָ
  choice: 在你手中
  rationale: 保留“手”代表权力或支配的希伯来语意象，并与下句“伸手”形成刻意的词语呼应。
- source_word: רַק
  choice: 只是
  rationale: 清楚引出所授权限的唯一限制。
- source_word: אֵלָיו אַל תִּשְׁלַח יָדֶךָ
  choice: 不可向他伸手
  rationale: 贴近原文结构，保留“伸手”的意象以及与前句“手中”的重复；在语境中表示不得亲自加害约伯，但不把隐含意义过度明说。
- source_word: וַיֵּצֵא
  choice: 出去了
  rationale: 直接呈现连续叙事中的离去动作。
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: 从雅威面前
  rationale: 自然保留“从……面前离开”的希伯来语空间表达，也呈现天上议会的场景。
theological_decisions:
- issue: 约伯记序言中 הַשָּׂטָן 的身份称谓
  choice: 那控告者
  alternative: “那撒但”或“那敌对者”
  rationale: 原文有定冠词，较自然地指向一种角色或称号，而非明确无疑的专名。“那控告者”保留本段司法性、挑战性的语境，又不提前断定其与后期经文中作为专名的“撒但”完全等同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文的强调语气；两次使用“手”以呈现原文的修辞呼应。“从雅威面前出去了”略带希伯来叙事风格，但中文清楚自然。
