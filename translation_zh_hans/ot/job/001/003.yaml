  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: zh_hans
  text: 他的牲畜有七千只羊[a]、三千匹骆驼、五百对牛、五百头母驴，还有许许多多的仆役。这个人在所有东方人中最为显赫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊”也可泛指绵羊和山羊等小型牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: 他的牲畜
  rationale: 此词可泛指所得的产业，尤其指家畜；下文逐项列举动物，因此译为“牲畜”最符合语境。
- source_word: צֹאן
  choice: 羊
  rationale: 此词可统指绵羊和山羊等小型牲畜；在数量清单中译为自然、通行的“羊”，同时以脚注保留较宽泛的词义。
- source_word: צֶמֶד בָּקָר
  choice: 对牛
  rationale: צֶמֶד 指配成一组、共同负轭的一对；“五百对牛”既保留计数单位，也符合现代汉语表达。
- source_word: אֲתוֹנוֹת
  choice: 母驴
  rationale: 希伯来语明确使用阴性复数，故保留其性别信息。
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: 许许多多的仆役
  rationale: 该短语字面涉及大量劳役或服事，在此财富与家业清单中很可能转指承担这些劳役的大批仆役；此译自然清楚，同时不扩展为含义更宽的“家业”。
- source_word: גָּדוֹל מִכָּל
  choice: 在……中最为显赫
  rationale: 比较结构表示此人超越所有东方人；“显赫”在财富、地位和声望之间保留一定语义宽度，比单说“富有”更贴近 גָּדוֹל 的宽泛含义。
- source_word: בְּנֵי קֶדֶם
  choice: 东方人
  rationale: 这是指东方地区之人的希伯来习语；直译“东方之子”在现代汉语中生硬且容易误解，故采用自然的集合称谓。
theological_decisions:
- issue: בְּנֵי קֶדֶם 是否按字面保留“众子”
  choice: 东方人
  alternative: 东方之子
  rationale: 该短语是族群或地域称谓，不是在强调亲子关系或仅限男性；译成“东方人”准确传达指称范围，也不引入额外神学判断。
- issue: גָּדוֹל 所表示的卓越范畴
  choice: 最为显赫
  alternative: 最富有／最伟大
  rationale: 上下文突出约伯的财富与家业，但原词本身也可涵盖身份和声望；“显赫”避免把经文只限定为财富比较，也避免“伟大”可能带来的道德评价。
- issue: עֲבֻדָּה 是否直接理解为仆役群体
  choice: 许许多多的仆役
  alternative: 庞大的家业／大量劳役
  rationale: 在财产清单中，转喻为大批服役人员最为顺畅；不过原词仍侧重劳作、服役，故不将其神学化或解释成特定制度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“匹”用于骆驼，“头”用于母驴，“对”保留负轭耕牛的成组计数。末句以“东方人”自然表达古代地域性称谓。
