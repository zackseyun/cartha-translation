  yaml_path: translation/ot/job/001/013.yaml
  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: zh_hans
  text: 有一天，他的儿子和女儿正在他们长兄的家里吃饭喝酒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们头生的兄长”。
    reason: 保留 הַבְּכוֹר 较贴近字面的“头生的”这一词义选择。
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: 有一天
  rationale: 这是希伯来语常见的叙事场景引入语；虽然 הַיּוֹם 形式上带定冠词，此处整体惯用意义是不定的“有一天”。
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: 他的儿女
  rationale: “儿女”在现代汉语中自然且明确地包括儿子和女儿，保留了原文同时点明两者的意义。
- source_word: אֹכְלִים וְשֹׁתִים
  choice: 正在……吃饭喝酒
  rationale: 两个分词描写当时持续进行的动作；“正在”保留其进行意味。“吃饭”较单说“吃”更符合现代汉语场景表达。
- source_word: יַיִן
  choice: 酒
  rationale: 此词明确指酒；现代汉语在“喝酒”这一固定搭配中通常无需译作较受限定的“葡萄酒”。
- source_word: בְּבֵית אֲחִיהֶם
  choice: 在他们……家里
  rationale: בְּבֵית 表示所在地点；将“房屋”自然转译为“家里”，并明确该家属于他们的兄长。
- source_word: הַבְּכוֹר
  choice: 长兄
  rationale: 该词指家中按出生次序居首者；“长兄”简洁自然，表达这里的亲属关系与排行。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“有一天”承担叙事转场功能；“正在”呈现希伯来语分词的进行状态。脚注标记紧随“长兄”，对应其词义备选。
