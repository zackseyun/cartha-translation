base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: zh_hans
  text: 示巴人前来突袭，把牲畜掳走了[a]，又用刀剑杀了那些年轻人[b][c]；只有我一人逃脱，来向你报信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“示巴前来袭击”；“示巴”是专名，这里指来自示巴的袭击者。
    reason: lexical_alternative
  - marker: b
    text: “年轻人”也可指仆役或随从；这里很可能是照看牲畜的人。
    reason: cultural_note
  - marker: c
    text: “用刀剑杀了”原文直译为“用刀口击打”，是指用刀剑杀死。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  choice: 示巴人突然袭击
  rationale: נפל在敌对侵袭的语境中表示突袭；שְׁבָא形式上是专名“示巴”，此处则借地名指来自示巴的袭击者。正文采用现代汉语自然表达，并以脚注保留原文形式。
- source_word: וַתִּקָּחֵם
  choice: 把牲畜掳走了
  rationale: 代词后缀指上一节的牛和驴。劫掠语境中的“掳走”比笼统的“带走”更准确；补出“牲畜”可消除汉语代词指向不清。
- source_word: הַנְּעָרִים
  choice: 那些年轻仆人
  rationale: נְעָרִים既可指年轻人，也可指仆役或随从；这里是看守牲畜的人。“年轻仆人”同时保留年龄色彩和职分含义。
- source_word: הִכּוּ לְפִי חָרֶב
  choice: 用刀杀了
  rationale: 希伯来习语直译为“以刀口击打”，实际表示用刀剑杀死。正文采用自然现代汉语，直译意象列于脚注。
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: 只有我一人逃脱
  rationale: רַק与לְבַדִּי共同强化唯一幸存者之意；“只有我一人”保留这种强调。
- source_word: לְהַגִּיד לָךְ
  choice: 来向你报信
  rationale: 在使者叙事公式中，נגד表示前来报告消息；“报信”较“告诉你”更符合此处语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。“突然袭击”“掳走”“报信”使叙事紧凑自然；避免生硬照搬希伯来语习语，同时用脚注保存专名转喻、נְעָרִים的语义幅度及“刀口”的原文意象。
