base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: zh_hans
  text: 耶和华对敌对者[a]说：“你从哪里来？”敌对者回答耶和华说：“我在地上往来，在地上走动。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“那撒但”。“撒但”意为“敌对者”或“控告者”；此处带定冠词，更像称谓而非专名。
    reason: 说明原文定冠词、词义范围及传统译名“撒但”，同时不把后来的专名化理解预设进正文。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，不以“主”这一称号替代原文专名。
- source_word: הַשָּׂטָן
  choice: 那敌对者
  rationale: 原文带定冠词，在本语境中更像职衔或角色称谓，而非不带冠词的专名；“那敌对者”既体现定指，也保留其广义敌对角色。
- source_word: מֵאַיִן תָּבֹא
  choice: 你从哪里来？
  rationale: 自然、准确地表达对来处的询问，符合现代汉语对话习惯。
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: 回答……说
  rationale: 保留希伯来叙事中“回答并说”的表达轮廓，同时用中文可接受的圣经叙事句式呈现。
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: 在地上往来
  rationale: שׁוט表示四处行走、往来；“在地上往来”简洁保留反复移动的意味，ב在此译作活动范围“在……上”。
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: 在其间走动
  rationale: התהלך在此表达来回或四处走动；“其间”自然回指“地上”，并避免生硬重复。
- source_word: מִן（用于两个不定式前）
  choice: 刚刚回来
  rationale: 两个מן短语回答“从哪里来”，字面为“从……而来”；中文若只说“从往来、从走动”不自然，因此在句末明示隐含的返回关系。
theological_decisions:
- issue: הַשָּׂטָן应视为专名还是带定冠词的角色称谓
  choice: 角色称谓：“那敌对者”
  alternative: 专名：“撒但”；较形式对应：“那撒但”
  rationale: 原文明确带定冠词，优先保留本段中的称谓性质，不把后来的专名化用法倒入本文；脚注交代希伯来语形式及传统译法。
- issue: 是否把地上的往来解释为巡察、诱惑或作恶
  choice: 仅译作“往来……走动”
  alternative: “巡察”“游行寻找可吞吃的人”等解释性译法
  rationale: 本节本身只陈述移动，没有说明目的；译文不替原文补足神学动机。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“回答……说”的希伯来叙事节奏；以“那敌对者”呈现定指角色称谓，并用脚注说明传统形式。
