  text: בְּ/כָל זֹ֖את לֹא חָטָ֣א אִיּ֑וֹב וְ/לֹא נָתַ֥ן תִּפְלָ֖ה לֵ/אלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: zh_hans
  text: 在这一切事上，约伯并没有犯罪，也没有把不当之事归给上帝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也没有把愚妄归给上帝”，或“也没有认为上帝行事不当”。
    reason: 词义存在可成立的不同表达；תִּפְלָה可指愚妄、不当或有失体统之事。
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: 在这一切事上
  rationale: בְּ加כָּל和指示词זֹאת构成概括前述全部遭遇的表达；“在这一切事上”自然且保留其涵盖性。
- source_word: לֹא חָטָא
  choice: 并没有犯罪
  rationale: חטא是“犯罪”的常用动词；直译可保留原文明确的宗教和道德含义。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代汉语《圣经》中通行的人名译法。
- source_word: וְלֹא נָתַן
  choice: 也没有把……归给
  rationale: נתן本义为“给”，但在此与宾语תִּפְלָה及间接宾语“上帝”连用，表达把某种性质归于上帝；这一译法既保留归属关系，也符合现代汉语。
- source_word: תִּפְלָה
  choice: 不当之事
  rationale: 此词可指愚妄、不当或有失体统之事；“不当之事”在现代汉语中能表达其负面道德和宗教含义，同时避免只理解为智力上的愚笨。
- source_word: לֵאלֹהִים
  choice: 给上帝
  rationale: 介词ל在此标示归属对象；אֱלֹהִים按上下文译为“上帝”。
theological_decisions:
- issue: 如何表达约伯没有将תִּפְלָה归于上帝
  choice: 也没有把不当之事归给上帝
  alternative: 也没有把愚妄归给上帝；也没有认为上帝行事不当
  rationale: 原文强调约伯在苦难中并未把可责之处归于上帝。“不当之事”保留道德上的负面含义，又不把词义局限为智力上的愚笨；其他可能译法收入脚注，以保存原词的语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在这一切事上”承接前文全部灾难；“把……归给”贴近希伯来语结构，并使普通读者容易理解。
