  text: וְ/אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֖ע בְּ/כָל אֲשֶׁר ל֑/וֹ אִם לֹ֥א עַל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: zh_hans
  text: 可是，请你伸手，触碰他所有的一切，他必定当面咒诅你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒诅”所译的原文词直译为“祝福”。在《约伯记》序言中，这通常被理解为避讳说法，实际意思是“咒诅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: 可是
  rationale: 表达对上一节所述原因的强烈转折，符合现代汉语自然用法。
- source_word: שְׁלַח נָא יָדְךָ
  choice: 请你伸手
  rationale: 保留希伯来文“伸手”的行动意象；“请”对应语气词 נָא，在这里也带有挑战意味。
- source_word: וְגַע
  choice: 动一动
  rationale: 原义为“触碰”，在此语境中暗含加害；“动一动”既保留触碰意象，又能自然表达对约伯产业采取行动，避免直接增译为“毁灭”。
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: 他所有的一切
  rationale: 简洁涵盖约伯拥有的财物、产业及相关所有物。
- source_word: אִם לֹא
  choice: 必定
  rationale: 此处是誓言式的省略结构，不是普通条件句；“必定”传达撒但断言事情必然发生的语气。
- source_word: עַל פָּנֶיךָ
  choice: 当面
  rationale: 自然传达直接面对上帝、公开冒犯的希伯来语习语。
- source_word: יְבָרֲכֶךָּ
  choice: 咒诅你
  rationale: 字面通常意为“祝福你”，但在《约伯记》序言的敌对语境中是敬避式委婉语，实际指“咒诅”；字面形式在脚注中保留。
theological_decisions:
- issue: 《约伯记》序言中 ברך 的委婉用法
  choice: 正文译作“咒诅你”
  alternative: 祝福你
  rationale: 撒但所断言的是约伯受损后会公开背弃并辱骂上帝；按字面译作“祝福”会遮蔽语境中的明显反义用法，但脚注保留其字面词义，以呈现原文的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“动一动”保留原文“触碰”的意象，同时让上下文中的加害意味自然显现；感叹号体现挑战和断言的强烈语气。
