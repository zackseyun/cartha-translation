  text: וְ/הִנֵּה֩ ר֨וּחַ גְּדוֹלָ֜ה בָּ֣אָה מֵ/עֵ֣בֶר הַ/מִּדְבָּ֗ר וַ/יִּגַּע֙ בְּ/אַרְבַּע֙ פִּנּ֣וֹת הַ/בַּ֔יִת וַ/יִּפֹּ֥ל עַל הַ/נְּעָרִ֖ים וַ/יָּמ֑וּתוּ וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: zh_hans
  text: 看哪，一场大风[a]从旷野那边刮来，击打房屋的四角，房屋倒塌在那些年轻人身上，他们死了[b]；只有我一人逃脱，来向你报信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大风”也可译作“强风”或“猛烈的风”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“那些年轻人”；这个词也可指青年，在某些语境中可指仆役。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、使叙述骤然临到眼前的功能，同时符合庄重的现代中文叙事语体。
- source_word: רוּחַ גְּדוֹלָה
  choice: 一阵狂风
  rationale: 此处 רוּחַ 指风；גְּדוֹלָה 表明其强大猛烈。中文“狂风”自然传达灾难语境中的强风，又不把它具体限定为某种风暴。
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: 从旷野那边刮来
  rationale: “旷野那边”保留 מֵעֵבֶר 所表达的另一边或越过之方向感；“刮来”符合中文对风的自然表达。
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: 猛烈撞击房屋的四角
  rationale: נגע 本可表示触及、碰到或击打；房屋随即倒塌的语境显示此处带有强力冲击之意。“猛烈”使中文与“狂风”及破坏结果衔接自然。
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: 房屋就倒塌在那些年轻人身上
  rationale: 希伯来文单数主语承接“房屋”，中文明确补出“房屋”可避免误解为风倒下；“倒塌”准确表达房屋落下压住人的情形。
- source_word: הַנְּעָרִים
  choice: 那些年轻人
  rationale: 保留该阳性复数词“年轻人”的基本意义，不按上下文擅自改成“儿女”或“仆人”；其可能指年轻人或仆役的词义弹性另以脚注说明。
- source_word: וַיָּמֻתוּ
  choice: 他们都死了
  rationale: 直译 מות 的非使役表达；“都”自然呈现复数群体无一幸免的语意。
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: 只有我一人逃脱
  rationale: “只有……一人”自然保留 רַק 与 לְבַדִּי 的双重排他强调。
- source_word: לְהַגִּיד לָךְ
  choice: 来向你报信
  rationale: 在灾难使者的固定叙事情境中，“报信”比一般的“告诉你”更自然，并忠实表达前来报告之意。
theological_decisions:
- issue: 倒塌房屋下遇难者的身份
  choice: 译作“那些年轻人”，并在脚注保留“仆役”的可能性
  alternative: 按上下文译作“儿女”或“仆人”
  rationale: 原文使用 הַנְּעָרִים，而非明确表示儿女或仆人的专门词语。译文不把上下文推断写进正文，以保留原文在身份指称上的张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“看哪”保留圣经叙事的现场感；其余句式避免文言化。用“房屋就倒塌”明确希伯来文代词的所指，但不增添原文没有的神学因果判断。
