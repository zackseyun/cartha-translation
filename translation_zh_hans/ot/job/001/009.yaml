base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: zh_hans
  text: 控告者回答雅威说：“约伯敬畏上帝，难道是无缘无故的吗？[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “控告者”：希伯来文为带定冠词的“撒但”，也可译作“敌对者”；该词在这里用作角色称谓。
    reason: alternative_reading
  - marker: b
    text: “无缘无故”：也可译作“白白地”或“不求回报地”。此问质疑约伯敬畏上帝是否不求回报。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在这一叙事对话公式中表示“回答、回应”；“回答”自然地保留了正式对话结构。
- source_word: הַשָּׂטָן
  choice: 那控告者
  rationale: 原文带定冠词，较像职衔或角色称谓，而非单纯专名；“控告者”也切合本段近似天庭审议的语境。“那”体现希伯来语定冠词，但不将其机械化。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为专名的性质，而不以“主”这一称号替代。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 希伯来叙事中引出直接引语的常用表达；与前面的“回答”合成自然的汉语“回答……说”。
- source_word: הֲחִנָּם
  choice: 难道是无缘无故的吗
  rationale: חִנָּם可指“无缘无故”，也可含“白白、不求回报”之意。正文采用自然的反问句，并用脚注保留其关于利益动机的另一层含义。
- source_word: יָרֵא
  choice: 敬畏
  rationale: ירא以神为宾语时通常兼有畏惧与崇敬；“敬畏”是现代汉语中准确而庄重的对应词。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指约伯所敬畏的真神；“上帝”是清楚、通行的现代汉语对应词。
theological_decisions:
- issue: 带定冠词的הַשָּׂטָן如何译出
  choice: 那控告者
  alternative: 撒但／那敌对者
  rationale: 定冠词提示此处着重其角色或职分。“那控告者”保留司法性、敌对性的语境，又避免把后期专名用法未经说明地带入本节。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 正文直接呈现四字神名。采用“雅威”以保留专名，并避免用称号“主”取代；“耶和华”作为传统汉译列入脚注。
- issue: חִנָּם所质疑的动机
  choice: 无缘无故
  alternative: 白白地／不求回报地
  rationale: 原词既可能质疑约伯的敬畏是否没有缘由，也可能质疑其是否不图利益。正文不将含义完全限定为“没有报酬”，脚注说明利益动机这一语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“回答雅威说”略带经文语体，保留希伯来语连续动词公式；反问句使用“难道……吗”以自然传达疑问词הֲ的语气。脚注标记均置于相关问句末尾。
