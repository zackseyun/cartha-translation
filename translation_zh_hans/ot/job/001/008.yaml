base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: zh_hans
  text: 耶和华对那控告者[a]说：“你留意我的仆人约伯了吗？地上没有人像他那样纯全、正直，敬畏上帝，远离恶事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“那控告者”，也可译作“那敌对者”或“撒但”。这里的希伯来词带定冠词，较像职衔或角色，而不是明确作为专名。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，不以“主”这一称号替代原文专名。
- source_word: הַשָּׂטָן
  choice: 那控告者
  rationale: 原文带定冠词，在此更像职衔或角色，而非明确作为专名；“控告者”也符合天上议会语境中的司法意味。
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: 你留意……了吗
  rationale: 原文字面为“把你的心放在……上”，意思是刻意关注或考察；正文采用自然现代汉语表达，并在脚注保留原文意象。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 此处强调约伯归属于上帝并事奉他，而不是突出社会制度意义上的奴役。
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: 地上没有人像他那样
  rationale: 表达约伯在品格上无人可比；“地上”自然传达这里较广的范围。
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: 纯全、正直
  rationale: “纯全”表达完整、诚实无伪的品格，不暗示绝对无罪；“正直”表达道德上的端正。中文无需重复译出“一个人”，便可自然修饰约伯。
- source_word: יְרֵא אֱלֹהִים
  choice: 敬畏上帝
  rationale: 保留圣经中兼具敬惧、尊崇和忠诚意味的固定表达。
- source_word: וְסָר מֵרָע
  choice: 远离恶事
  rationale: 表达持续避开和拒绝邪恶的品行，符合分词所呈现的习惯性特征。
theological_decisions:
- issue: הַשָּׂטָן在此是专名还是职衔
  choice: 译为“那控告者”
  alternative: “撒但”或“那敌对者”
  rationale: 定冠词较强地表明这里是角色称谓；如此翻译可避免把后期明确的专名用法预先带入本节，同时保留其控告、敌对的功能。
- issue: תָּם是否表示绝对无罪或完美
  choice: 译为“纯全”，指品格完整、诚实无伪
  alternative: “完全”或“无可指责”
  rationale: 智慧文学语境及其与“正直”的并列，指向道德完整，而不是宣称约伯绝对无罪；“纯全”保留这一张力而不过度解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你留意……了吗”避免生硬直译“你把心放在……上了吗”，同时准确传达刻意关注之意；“纯全、正直，敬畏上帝，远离恶事”保留原文紧凑的四重品格描写。
