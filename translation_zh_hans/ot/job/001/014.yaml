  yaml_path: translation/ot/job/001/014.yaml
  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: zh_hans
  text: 有一个报信的人来到约伯那里，说：“牛正在耕地，母驴在它们旁边吃草，”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: 有一个报信的人
  rationale: מַלְאָךְ可指人间使者或天使；这里是前来报告灾情的人，因此译为“报信的人”。句首连接词按现代汉语叙事习惯融入上下文，不生硬直译。
- source_word: בָּא אֶל־אִיּוֹב
  choice: 来到约伯那里
  rationale: בוא与אֶל共同表达来到某人那里；此译自然传达动作方向。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 该叙事形式推进事件；汉语用“说”承接前句即可，主语仍清楚。
- source_word: הַבָּקָר
  choice: 牛
  rationale: בָּקָר泛指牛类；耕作场景已表明它们是役用的牛，现代汉语不必另加“耕牛”。
- source_word: הָיוּ חֹרְשׁוֹת
  choice: 正在耕地
  rationale: 该结构描写当时持续进行的动作，“正在”准确体现进行状态。
- source_word: וְהָאֲתֹנוֹת
  choice: 母驴
  rationale: אֲתֹנוֹת明确为阴性复数，汉语“母驴”既自然又保留原文所指性别。
- source_word: רֹעוֹת
  choice: 吃草
  rationale: רעה在此指牲畜放牧、觅食；“吃草”比“放牧”更直接自然地描写母驴当时的动作。
- source_word: עַל־יְדֵיהֶם
  choice: 在它们旁边
  rationale: 该习语在这里表示空间上的邻近；“它们”按语境回指前面的牛。
