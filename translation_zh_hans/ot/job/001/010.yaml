source:
  edition: WLC
  text: הֲ/לֹֽא את שַׂ֣כְתָּ בַעֲד֧/וֹ וּ/בְעַד בֵּית֛/וֹ וּ/בְעַ֥ד כָּל אֲשֶׁר ל֖/וֹ מִ/סָּבִ֑יב מַעֲשֵׂ֤ה יָדָי/ו֙ בֵּרַ֔כְתָּ וּ/מִקְנֵ֖/הוּ פָּרַ֥ץ בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: zh_hans
  text: 你不是从四面用篱笆围护他、他的家和他所有的一切吗？[a] 你赐福他手所做的工；他的牲畜遍布那地。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用篱笆围护”也可译作“把他圈护起来”或“在他周围设下篱笆”。希伯来语采用围栏从四面保护的具体形象。
    reason: lexical_alternative
  - marker: b
    text: “遍布那地”也可译作“在那地大大增多”。希伯来语动词本有冲破界限、向外扩展之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: 围上篱笆，护住
  rationale: 该动词在这里描绘围护、圈护的具体形象；译文既保留“篱笆”的比喻，也清楚表达其保护作用。
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ
  choice: 护住他、他的家和他所有的一切
  rationale: בְּעַד 与围护动词及 מִסָּבִיב 连用，主要表达环绕并保护的空间意义；中文用“护住”自然连接三个并列对象。
- source_word: מִסָּבִיב
  choice: 从四面
  rationale: 表达完整环绕的范围，同时使中文问句简洁自然。
- source_word: מַעֲשֵׂה יָדָיו
  choice: 他手所做的
  rationale: 保留希伯来语关于人的劳作与经营成果的常用身体隐喻，在现代中文中也清楚易懂。
- source_word: בֵּרַכְתָּ
  choice: 你都赐福
  rationale: 保留 ברך 的“赐福”用语，不把神的作为缩减为单纯使人致富或成功。
- source_word: מִקְנֵהוּ
  choice: 他的牲畜
  rationale: מִקְנֶה 在此主要指所拥有的畜群；“牲畜”范围准确，也符合现代汉语。
- source_word: פָּרַץ
  choice: 遍布
  rationale: 该动词本有冲破界限、向外扩展之意；用于畜群时，“遍布”以自然中文保留其扩张画面，而不只表达数量增加。
- source_word: בָּאָרֶץ
  choice: 那地
  rationale: 定冠词表明所指之地；与“遍布”搭配可表达畜群在地域中的广泛扩展。
- source_word: הֲלֹא
  choice: 你不是……吗
  rationale: 保留撒但反问及质询的语气，没有改写为直接陈述。
theological_decisions:
- issue: 是否保留“赐福”而只译作物质上的兴旺
  choice: 他手所做的，你都赐福
  alternative: 你使他手所做的兴旺
  rationale: 原文明确使用“赐福”一词，把约伯的兴旺归于神；保留这一措辞可避免把神学陈述淡化为经济结果。
- issue: 是否保留围护的具体比喻
  choice: 从四面围上篱笆，护住
  alternative: 从四面保护
  rationale: 原文以围栏式的圈护描绘神的保护；译文保留这个形象，同时加“护住”使其功能在中文中明确。
- issue: פָּרַץ 在本句中侧重扩展还是增多
  choice: 他的牲畜遍布那地
  alternative: 他的牲畜在那地大大增多
  rationale: 该词可由冲破、扩展引申为大量增长。正文选择保留向外扩张的画面，脚注列出数量增长的合理理解，不排除原文的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你不是……吗”保留原文的反问语气；“围上篱笆，护住”兼顾具体意象与普通读者的即时理解。
