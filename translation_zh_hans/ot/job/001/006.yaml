base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: zh_hans
  text: 有一天，上帝的众子[b]来到耶和华面前侍立，那敌对者[a]也来到他们中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“撒但”。希伯来文“撒但／敌对者”一词前有定冠词；在这里可能是职衔，而不是专名。
    reason: alternative_reading
  - marker: b
    text: “上帝的众子”可能指天上议会中的属天众生。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: 有一天
  rationale: 这是引入新场景的希伯来叙事表达；“有一天”自然简洁，又不过度添加原文没有的时间副词。
- source_word: בְּנֵי הָאֱלֹהִים
  choice: 上帝的众子
  rationale: 贴近希伯来语的字面意象，保留其所指对象的含混性，不在正文中直接解释为“天上众生”或“神圣众生”。
- source_word: לְהִתְיַצֵּב
  choice: 来到……面前侍立
  rationale: 此处指到一位尊长面前站立、候命或呈身；“侍立”适合天上议会的语境，又比单纯的“站立”更自然。
- source_word: עַל יְהוָה
  choice: 在耶和华面前
  rationale: 与“侍立”连用时，介词表达来到某位尊长面前的意思。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确保留原文专名。
- source_word: הַשָּׂטָן
  choice: 那敌对者
  rationale: 原文带定冠词，此处较可能是职衔或角色称谓；“那敌对者”既表达词义，也避免直接把它固定为专名。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 自然表达该角色也在这一群体之中来到现场。
theological_decisions:
- issue: הַשָּׂטָן 是专名还是角色称谓
  choice: 那敌对者
  alternative: 撒但；那控告者
  rationale: 原文有定冠词，宜保留其作为称谓的可能性，不把后期较固定的专名用法直接带入本节；传统译法在脚注中说明。
- issue: בְּנֵי הָאֱלֹהִים 的身份
  choice: 上帝的众子
  alternative: 天上的众生；神圣众生
  rationale: 正文保留希伯来语的亲属意象及其神学张力；其可能指天上议会中的众灵，留待脚注说明，而不在翻译中确定。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“上帝的众子”保留原文意象；“侍立”体现到尊长面前呈身候命的场景；“那敌对者”刻意保留其作为职衔而非固定专名的可能性。
