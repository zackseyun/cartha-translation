  text: 他得了七个儿子和三个女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: 生了
  rationale: 该词是 ילד 的尼法勒式，表达“出生、被生下来”。现代汉语通常用“他生了……”自然表达“有儿女出生归于他”这一关系；这里的“生了”不强调约伯亲自分娩，也不刻意突出父亲的主动使役。
- source_word: לוֹ
  choice: 他
  rationale: 介词 ל 加第三人称男性单数后缀在生育套语中标明亲属归属，即这些儿女是他的。汉语用主语“他”配合“生了”最为自然。
- source_word: שִׁבְעָה בָנִים
  choice: 七个儿子
  rationale: 保留原文明确的数目和男性子女含义；量词“个”符合现代标准汉语。
- source_word: וְשָׁלֹשׁ בָּנוֹת
  choice: 和三个女儿
  rationale: 连词 וְ 译为“和”，并保留原文明确的数目和女性子女含义。
