  yaml_path: translation/ot/job/001/018.yaml
  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: zh_hans
  text: 这人还在说话的时候，又有人来，说：“你的儿女正在他们长兄家里吃饭喝酒[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正在宴饮”。希伯来文直译为“正在吃东西、喝酒”。
    reason: 说明较为意译的可能表达，同时以自然的现代汉语交代原文“吃、喝酒”的字面措辞。
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: 这人还在说话的时候
  rationale: 保留分词所表达的持续动作，并自然呈现上一位报信者尚未说完、下一位便来到的紧迫叙事节奏。
- source_word: וְזֶה בָּא
  choice: 又有人来
  rationale: 字面为“这一个来了”，在连续报信者的语境中，“又有人来”更符合现代汉语叙事习惯，同时保留接连有人来到的含义。
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: 你的儿女
  rationale: “儿女”简洁而准确地涵盖原文明确提到的儿子和女儿，避免泛化为不体现两者的表达。
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: 正在……吃饭喝酒
  rationale: “正在”体现两个分词所表示的持续动作；“吃饭喝酒”贴近原文“吃、喝酒”，又是自然的现代汉语。
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: 在他们长兄家里
  rationale: הַבְּכוֹר 在这里指兄弟中的出生次序；“长兄”既准确表达最年长或头生的兄长，也比“头生的哥哥”更自然庄重。
