base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: zh_hans
  text: 这人还在说话，又有人来报告说：“神的火从天上降下，焚烧羊群和年轻人，把他们都吞灭了；只有我一人逃脱，来向你报告。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: 神的火
  rationale: 直译这一希伯来语属格结构，保留它既可能指来自神的火，也可能是形容极其猛烈之火的语义张力；下文“从天上降下”使天降之火的理解自然可见。
- source_word: בַצֹּאן
  choice: 羊群
  rationale: צֹאן在此指约伯的羊群；用“羊群”符合现代汉语叙事，也与上下文财产受灾相符。
- source_word: בַנְּעָרִים
  choice: 仆人
  rationale: נְעָרִים字面可指年轻人，但在约伯家业的叙事场景中指照管牲畜的属下；“仆人”比“年轻人”更自然且贴合其职分。
- source_word: וַתִּבְעַר ... וַתֹּאכְלֵם
  choice: 焚烧……把他们都烧灭了
  rationale: 分别呈现“燃烧”和“吞灭”两个动词；后者用汉语惯用的“烧灭”表达火焰吞噬、彻底毁灭之意。
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: 只有我一人逃脱
  rationale: 保留רַק与לְבַדִּי叠加形成的强烈排他语气，并采用简洁自然的现代汉语。
theological_decisions:
- issue: “神的火”是否明确断定灾火由神直接施降
  choice: 保留“神的火”这一原文表达，不另加因果解释
  alternative: 译作“从神那里来的火”或“可怕的大火”
  rationale: 原文说אֵשׁ אֱלֹהִים并称其从天而降，但叙事稍后揭示撒但的行动范围；译文不应超出报信者的话，替原文解决灾祸的终极施行者与许可者之间的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“来报告说”稍显重复，故以“来报告说”引出直接引语，结尾再用“来向你报告”对应原文；整体保留连续报灾的急迫节奏。
