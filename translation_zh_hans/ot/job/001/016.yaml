  timestamp: '2026-07-14T06:21:14Z'
review_pass:
  verdict: revise
  source_fidelity: “仆人”将原文 נְעָרִים（年轻人、少年人）所保留的年龄/身份表述具体化为职分，不足以对应原文；英语审校轨迹亦明确保留“young men”。其余主要内容忠实呈现了天降的“神的火”、羊群、火的焚烧/吞灭，以及唯一逃脱者的强调。
  naturalness: 整体流畅、庄重，适合叙事语境。将“仆人”改为“年轻人”后仍自然；“焚烧……吞灭”清楚传达连续的灾害动作。
  terminology: “神的火”恰当保留 אֵשׁ אֱלֹהִים 的属格及其未解决的语义张力，不应改写成明确的神直接施行。“羊群”合宜。“年轻人”应取代“仆人”，以避免加入原文未明说的社会职分。
  issues:
