    rationale: נְעָרִים 的基本意义是年轻人/少年人；虽然叙事语境可能涉及服役者，但原文没有在此使用明确表示仆人的词。译作“仆人”消除了原文保留的年龄称谓，且与英文审校文本的“young men”不一致。
