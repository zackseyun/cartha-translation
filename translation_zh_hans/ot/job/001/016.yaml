revisions:
- from: 这人还在说话，又有人来报告说：“有神的火从天上降下，焚烧羊群和仆人，把他们都烧灭了；只有我一人逃脱，来向你报告。”
  to: 这人还在说话，又有人来报告说：“神的火从天上降下，焚烧羊群和年轻人，把他们都吞灭了；只有我一人逃脱，来向你报告。”
  rationale: 仅将“仆人”改为“年轻人”，恢复对 נְעָרִים 的直接、非解释性对应；并将“烧灭”调整为“吞灭”，更贴近 וַתֹּאכְלֵם（吞噬、吃尽）的火焰意象。其余措辞保留，以维持原有节奏、语域及“神的火”的必要歧义。
