base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: zh_hans
  text: 约伯就起来，撕裂外袍，剃了头，俯伏在地下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俯伏敬拜”。这个希伯来语动词指俯身或俯伏，常用于表达尊崇或敬拜。
    reason: 词义兼有身体动作与敬拜含义；正文译作“下拜”保留其动作和尊崇意味，未把语境所暗示的敬拜明确增添为原文的说明。
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的Qal连续式叙事形态推进事件次序；“起来”自然简洁，也不额外限定是起身还是站立。
- source_word: מְעִילוֹ
  choice: 外袍
  rationale: מְעִיל指穿在外面的袍服；“外袍”既准确，又能体现撕裂重要衣物这一哀悼举动。
- source_word: וַיִּקְרַע אֶת־מְעִילוֹ
  choice: 撕裂外袍
  rationale: קרע在哀悼语境中指撕破衣服；“撕裂”保留具体动作和庄重叙事语气。
- source_word: וַיָּגָז אֶת־רֹאשׁוֹ
  choice: 剃了头
  rationale: גזז本义为剪下、剪除毛发；在此哀悼语境中，“剃了头”是现代汉语中最自然的表达，不必额外断言剃得完全光秃。
- source_word: וַיִּפֹּל אַרְצָה
  choice: 俯伏在地
  rationale: אַרְצָה带有朝向地面的含义；结合随后下拜的动作，“俯伏在地”清楚呈现身体伏向地面的姿态。
- source_word: וַיִּשְׁתָּחוּ
  choice: 下拜
  rationale: 该动词表示俯身或俯伏，常含尊崇、敬拜意味。“下拜”保留身体动作及宗教语境，同时不像直接译作“敬拜”那样完全消除词义张力。
theological_decisions:
- issue: 约伯最后的动作应仅译为身体俯伏，还是明确译为敬拜
  choice: 下拜
  alternative: 敬拜；俯伏敬拜；俯身
  rationale: 原词首先描写俯身或俯伏的动作，也常用于敬拜。上下文显示这是面向上帝的虔敬回应，但本节没有另加“敬拜”这一宾语性说明；“下拜”既体现尊崇意味，又保留动作与宗教含义之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“撕裂外袍”“剃了头”清楚呈现古代哀悼举动；末尾用“下拜”而不直接补出“敬拜”，避免把语境含义写成原文未明说的成分。
