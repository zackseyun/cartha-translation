base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: zh_hans
  text: 他的儿子们常常在各自的日子里[a]，在各自家中设宴，并派人去邀请他们的三个姐妹来跟他们一同吃喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的日子”。这可能指每个儿子按次序作东的日子，也可能指他的生日。
    reason: 保留原文 יוֹמוֹ 的语义歧义，避免正文武断选定其中一种解释。
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: 常常
  rationale: 此处完成式在1:4—5的叙述中表达过去经常发生的行动；现代汉语用“常常”自然传达这一习惯性含义，不机械译出“去”。
- source_word: בָנָיו
  choice: 他的儿子们
  rationale: בָּנִים为明确的阳性复数，且本节另行提到姐妹，因此不泛译为“孩子们”。
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: 设宴
  rationale: 该搭配直译为“办筵席”；“设宴”简洁、自然，并保留聚餐庆宴的含义而不过度强调正式规格。
- source_word: בֵּית אִישׁ
  choice: 在各自家中
  rationale: אִישׁ在此具有逐一分配的作用，表示每个儿子在自己的家里；“各自家中”准确且符合现代汉语表达。
- source_word: יוֹמוֹ
  choice: 各按自己的日子
  rationale: 原文直译为“他的日子”。正文保留“日子”的含混性，不擅自判定是轮到他作东的日子还是生日；“各按”同时传达逐人的安排。
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: 并派人邀请
  rationale: 两个动词合起来描写差人传话并发出邀请；“派人邀请”在汉语中自然地保留两层动作。
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: 他们的三个姐妹
  rationale: 原文明确指属于这些兄弟的三位姐妹；按亲属关系译为“他们的三个姐妹”清楚直接。
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: 来……一同吃喝
  rationale: 忠实表达参加宴席的目的；“吃喝”在此为中性叙述，并不额外暗示放纵。
- source_word: עִמָּהֶם
  choice: 跟他们一同
  rationale: 表达姐妹与兄弟共同参与宴席；“跟……一同”自然传达共同进行的含义。
theological_decisions:
- issue: “自己的日子”所指为何
  choice: 正文保留“自己的日子”，脚注说明两种可能
  alternative: 直接译作“轮到他的日子”或“他的生日”
  rationale: 希伯来文יוֹמוֹ本身未明确限定所指。直接选定轮值日或生日都会消除原文真实存在的解释空间，因此不在正文中作神学或历史层面的推断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“设宴”比“举行宴会”简练，也比“摆酒”更具普适性；“各按自己的日子”略带原文色彩，用以保留关键歧义，并由脚注帮助普通读者理解。
