  yaml_path: translation/ot/job/029/008.yaml
  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: zh_hans
  text: 年轻人看见我，就退避[a]；年老的也起身站立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“藏起来”；希伯来语动词通常可指隐藏自己，这里很可能表示年轻人在约伯面前恭敬地退避。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּנִי
  choice: 看见我
  rationale: ראה在此取直接的视觉感知义；“看见我”自然、准确，无须增加解释。
- source_word: נְעָרִים
  choice: 年轻人
  rationale: נְעָרִים指年轻男性；汉语“年轻人”在此与后半句“年老的”形成自然的年龄对照，语境并未要求额外突出性别。
- source_word: וְנֶחְבָּאוּ
  choice: 就退避
  rationale: חבא的尼法勒形通常意为“藏身”，但此处描写约伯从前受人敬重的社会场景，“退避”自然表达年轻人因敬畏而避开的动作，同时以脚注保留字面可能。
- source_word: וִישִׁישִׁים
  choice: 年老的
  rationale: יְשִׁישִׁים指年长者，重点在年龄而非职分；“年老的”避免将其误译为具有正式身份的“长老”。
- source_word: קָמוּ
  choice: 起身
  rationale: קום表示由坐姿起立的动作，在尊敬他人的场景中译作“起身”准确自然。
- source_word: עָמָדוּ
  choice: 站立
  rationale: עמד接在קום之后，表明他们起身后站着；保留两个动词，呈现原文的连续动作与强调。
