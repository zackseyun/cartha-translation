base_translation:
  language: en
  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: zh_hans
  text: 我为他们选择道路，坐在首位[a]；我如君王住在军旅中[b]，又如安慰哀悼者的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我选择他们的道路，坐在众人之首。”这里的“选择”可指约伯为众人决定、指明，或认可他们当行的道路；“坐在首位”既保留就座的画面，也表示他居于领导地位。
    reason: lexical_alternative
  - marker: b
    text: “军旅”所译的希伯来词也可指“队伍”“一群人”或“军队”。
    reason: lexical_alternative
  - marker: c
    text: 末句较难理解，也可译作：“如同安慰哀悼者的那一位。”这里保留为与前句并列的比较，未确定它与“君王”形象之间的具体关系。
    reason: textual_or_syntactical_difficulty
lexical_decisions:
- source_word: אֶבֲחַר דַּרְכָּם
  choice: 我为他们选择道路
  rationale: אֶבֲחַר是第一人称单数未完成式；在约伯记29章追忆往事的语境中，宜表达过去经常或一贯的行动。דַּרְכָּם直译“他们的道路”，这里可能指约伯为众人选择、指明或认可应走的方向；加“为”使现代汉语自然，同时不过度限定具体方式。
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: 坐在首位
  rationale: 保留“坐”与“头、首位”的具体意象，也自然表达约伯居于领导地位；不直接译作“作首领”，以免丢失原文画面。
- source_word: וְאֶשְׁכּוֹן
  choice: 我住在他们中间
  rationale: שׁכן基本义为居住、安居。原文未明说“他们中间”，但后接“如君王在军旅中”，汉语补出关系可使诗句连贯；“住”比“居留”更易懂。
- source_word: כְּמֶלֶךְ בַּגְּדוּד
  choice: 如君王在军旅中
  rationale: כְּ明确表示比拟。גְּדוּד可指军队、队伍或结成的一群人；“军旅”保留军事群体的色彩及诗体庄重感，又避免把单数集合名词机械译成复数。
- source_word: כַּאֲשֶׁר אֲבֵלִים יְנַחֵם
  choice: 又如安慰哀悼者的人
  rationale: 原句结构简约且有解释难度。יְנַחֵם为阳性单数，宾语אֲבֵלִים为复数，最自然可理解为“一个安慰哀悼者的人”。译文保留这一比较，不把它与前面的君王形象强行合并。
theological_decisions:
- issue: 末句与前文的关系
  choice: 保留为另一个并列比喻：“又如安慰哀悼者的人”
  alternative: 理解为君王本身就是安慰哀悼者的那一位，或将כַאֲשֶׁר理解为时间从句“当他安慰哀悼者时”
  rationale: 希伯来语末句语法和修辞关系存在困难。并列比喻最能保留约伯既尊贵又施安慰的张力，同时不把不确定的句法关系定死。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“坐在首位”“如君王在军旅中”保留希伯来原文的领导与王者意象；末句用“哀悼者”而非较古雅的“居丧者”，便于普通读者理解。所有脚注标记均置于相关正文之后。
