  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: zh_hans
  text: 我的荣耀常新，与我同在[a]；我的弓[b]在我手中更新。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的荣耀与我同在，是新的。”希伯来语形容词本义为“新的”；在这里可按语境理解为常新、鲜活或未曾衰退。
    reason: lexical_alternative
  - marker: b
    text: “弓”可能用来比喻力量或精力；正文保留希伯来诗歌中的具体意象。
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: 我的荣耀
  rationale: כָּבוֹד可指荣耀、尊荣或威望；译作“荣耀”保留其诗意广度，不把含义限缩为社会声誉。
- source_word: חָדָשׁ
  choice: 常新不衰
  rationale: 该形容词本义为“新的”；在此作谓语，并与下半句“不断更新”平行，表达荣耀仍然鲜活、未曾衰退。“常新不衰”既自然，也保留持续焕新的语境含义。
- source_word: עִמָּדִי
  choice: 与我同在
  rationale: 直译为“与我同在”，表示约伯的荣耀仍伴随着他，没有离去。
- source_word: קַשְׁתִּי
  choice: 我的弓
  rationale: 保留具体的“弓”这一诗歌意象；它在语境中可能象征力量或精力，但不在正文中直接释义。
- source_word: בְּיָדִי
  choice: 在我手中
  rationale: 保留希伯来文的方位表达和手中持弓、蓄势可用的形象。
- source_word: תַחֲלִיף
  choice: 不断更新
  rationale: חלף的使役形在此表示更新、重新焕发；未完成体可呈现持续或反复的状态。“不断更新”与上半句形成自然的诗歌平行。
