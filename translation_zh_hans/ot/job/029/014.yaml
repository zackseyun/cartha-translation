revisions:
- from: 我披上公义[a]，公义也披戴我；我的公正如同长袍和缠头巾[b]。
  to: 我穿上公义[a]，公义也给我作衣裳；我的公正如同外袍和头巾[b]。
  rationale: 将“公义也披戴我”改为“公义也给我作衣裳”，以自然汉语表达原文中公义反过来成为约伯衣裳的诗意回转，同时不添加原文没有的神学解释。将“长袍”改为“外袍”以更贴近מְעִיל，并将“缠头巾”简化为正文中自然的“头巾”，由注释保留其缠裹式文化特征。
