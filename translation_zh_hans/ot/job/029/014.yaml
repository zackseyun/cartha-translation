  text: צֶ֣דֶק לָ֭בַשְׁתִּי וַ/יִּלְבָּשֵׁ֑/נִי כִּֽ/מְעִ֥יל וְ֝/צָנִ֗יף מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/014.yaml
  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: zh_hans
  text: 我穿上公义[a]，公义也给我作衣裳；我的公正如同外袍和头巾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”。希伯来语 צֶדֶק 可指正直的品格，也可指公正。
    reason: lexical_alternative
  - marker: b
    text: “头巾”指以布缠裹头部的覆盖物；它在这里与外袍共同构成尊荣和公共身份的意象。
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  choice: 公义
  rationale: 该词兼有合乎正道与施行公正的含义。译作“公义”，既保留道德品格层面，也与下半句的 מִשְׁפָּטִי（“我的公正”）形成有意义的对应，而不把两个词完全译成同一表达。
- source_word: לָבַשְׁתִּי
  choice: 我披上
  rationale: לָבַשׁ 在此以穿衣为喻。“披上”是自然、庄重的现代汉语，也保留了主动穿戴的动作。
- source_word: וַיִּלְבָּשֵׁנִי
  choice: 公义也披戴我
  rationale: 原文重复 לבש，并把“公义”转为动作的施行者、约伯为受事者，构成刻意的诗意回转。明确重述“公义”，比仅用“它”更符合汉语表达，也保留这一互换意象。
- source_word: כִּמְעִיל
  choice: 如同长袍
  rationale: מְעִיל 指外穿的袍服。“长袍”清楚易懂，并传达尊荣和公开身份的意象。
- source_word: וְצָנִיף
  choice: 和缠头巾
  rationale: צָנִיף 指缠裹式的头部覆盖物。“缠头巾”比笼统的“头饰”更具体，也避免现代汉语“头巾”可能仅指普通方巾的误解。
- source_word: מִשְׁפָּטִי
  choice: 我的公正
  rationale: מִשְׁפָּט 可指判断、司法裁决、公正或秉公而行。结合约伯回顾其公共行为的语境，“我的公正”既可指他的公正品格，也可指他秉公断事的实践，保留原文一定的语义张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。通过“我披上公义，公义也披戴我”的重复保留希伯来诗句的回转结构；“公义／公正”则呈现 צֶדֶק 与 מִשְׁפָּט 的相近而不完全相同的含义。
