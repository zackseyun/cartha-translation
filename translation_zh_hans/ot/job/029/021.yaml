  yaml_path: translation/ot/job/029/021.yaml
  text: They listened to me and waited[b][a], and they kept silent for my counsel.
translation:
  language: zh_hans
  text: 他们听我说话，等候着[a]；他们对我的劝告默然无声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“满怀期待地等候。”这个动词也可含有盼望、期待的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们在我的劝告面前静默不语。”原文末句表示众人与约伯的劝告相关的沉默；其具体关系可理解为听到劝告后的回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי שָׁמְעוּ
  choice: 他们听我说话
  rationale: שׁמע与介词ל及第一人称后缀连用，表示以约伯为听从或聆听的对象；译作“听我说话”比单纯的“听见我”更能体现专心聆听的语境。
- source_word: וְיִחֵלּוּ
  choice: 等候着
  rationale: יחל在此表示带着期待等候；正文采用含义较宽的“等候着”，避免把“盼望”这一细微色彩过度明确化。
- source_word: וְיִדְּמוּ
  choice: 静默不语
  rationale: דמם在此指安静、沉默；“静默不语”自然地表达众人在约伯发言或提出劝告时保持缄默。
- source_word: לְמוֹ עֲצָתִי
  choice: 期待我的劝告
  rationale: 诗体介词לְמוֹ在这里把众人的等候、静默与约伯的劝告联系起来；“期待我的劝告”顺合现代汉语，同时脚注保留它也可能表示听到劝告后的反应。
- source_word: עֲצָתִי
  choice: 我的劝告
  rationale: עֵצָה在智慧文学语境中指受尊重者所给予的建议或谋略；“劝告”通俗而庄重，也符合本节的人际语境。
