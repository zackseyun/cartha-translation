  text: when his lamp shone above my head[a], and by his light I walked through darkness.
translation:
  language: zh_hans
  text: 当他的灯在我头顶上方照耀时，我借着他的光行走在黑暗中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我借着它的光行走在黑暗中。”原文“借着他的／它的光”中的后缀，按上下文可指上帝，也可较直接地指前面的“灯”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: 那时，他的灯照
  rationale: בְּ加不定式在此引出时间背景；与后面的“他的灯”合译为自然的现代汉语，同时保留“灯”这一具体意象。
- source_word: עֲלֵי רֹאשִׁי
  choice: 在我头上
  rationale: 表达灯从头上方照耀的空间关系；措辞自然，并保留原文意象。
- source_word: לְאוֹרוֹ
  choice: 借着他的光
  rationale: לְ在此可表达凭借或伴随；阳性单数后缀按上下文主要指上帝，但与前面的“灯”关系紧密，因此另在脚注保留指灯之光的可能。
- source_word: אֵלֶךְ
  choice: 我……行过
  rationale: 未完成式在追忆语境中可描述过去的行动；“行过”既体现行走，也自然呈现穿越黑暗的意思。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 保留原文无冠词的简洁抽象意象，不擅自限定为某一具体黑暗。
theological_decisions:
- issue: “他的灯”和“他的光”中阳性单数后缀的所指
  choice: 正文将后缀理解为指上帝，译作“他的”。
  alternative: 第二处可就近理解为指前面的“灯”，译作“它的光”。
  rationale: 上下文是约伯回忆上帝昔日的看顾，故指上帝较为顺畅；但第二个后缀在语法和意象上也可就近关联“灯”，脚注保留这一真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那时”承接本章追忆往昔的语境；“灯—光—黑暗”的意象链完整保留。
