base_translation:
  language: en
  yaml_path: translation/ot/job/029/015.yaml
  text: I was eyes to the blind[a], and feet to the lame.
translation:
  language: zh_hans
  text: 我曾作盲人的眼睛，也作瘸腿人的脚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较意译为：“我像盲人的眼睛，也像瘸腿人的脚。”
    reason: 说明谓语比喻可用明喻方式表达；正文保留原文更直接的隐喻。
lexical_decisions:
- source_word: עֵינַיִם
  choice: 眼睛
  rationale: 保留原文具体而鲜明的复数意象；在汉语中“眼睛”本身可自然表示双眼，并在此比喻为盲人提供观察、辨识和引导。
- source_word: הָיִיתִי
  choice: 我曾作
  rationale: Qal完成式第一人称单数在本段回顾约伯从前的生活和角色。“曾”体现过去时段，“作”适合汉语中的身份及功能比喻。
- source_word: לַעִוֵּר
  choice: 盲人的
  rationale: 介词ל在这里表示对象或受益者；转换为汉语领属结构，可自然表达“为盲人充当眼睛”。单数形式按类别或集合意义理解，不限定为某一人。
- source_word: וְרַגְלַיִם
  choice: 也作……的脚
  rationale: 保留与“眼睛”平行的身体意象，表达约伯为行动不便者提供行动上的帮助；连词译作“也”，使汉语诗句自然对称。
- source_word: לַפִּסֵּחַ
  choice: 瘸腿人的
  rationale: 忠实保留原文所指的具体身体状况，同时采用现代读者容易理解的表达；这里同样具有类别或集合意义。
- source_word: אָֽנִי
  choice: 我
  rationale: 独立人称代词带有强调作用。汉语把“我”置于全句开头，已能自然突出约伯本人；若另加“我本人”或在句末重复“我”，会显得生硬。
theological_decisions:
- issue: 约伯的帮助是直接陈述为“作眼睛、作脚”，还是解释成一般性的引导与扶助
  choice: 保留“作……的眼睛／脚”的直接比喻
  alternative: 译为“我引导盲人，扶助瘸腿的人”
  rationale: 原文以身体部位构成强烈的诗歌比喻，既可包括引导，也可包括更广泛的实际帮助；不宜在正文中把含义缩窄为某一种善行。
translation_notes:
  register: 采用自然、庄重的现代汉语，保留希伯来诗句的平行结构和具体身体意象。“我曾作”兼顾回顾语境与角色含义；不在句末机械重复强调代词。
