  text: when my steps were washed with curds[b][a], and the rock poured out for me streams of oil.
translation:
  language: zh_hans
  text: 那时，我的脚步沐浴在凝乳中[a]，磐石在我身旁倾泻出道道油流[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奶油”或“黄油状乳品”；希伯来语 חֵמָה 可指凝乳、浓乳或类似黄油的乳制品。
    reason: lexical_alternative
  - marker: b
    text: 或译“为我”；希伯来语这一表达字面上带有“与我同在”或“在我身旁”的空间含义，在这里也可能含有供我享用之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְחֹץ
  choice: 那时……沐浴
  rationale: 介词 בְּ 加不定式可表示时间背景；רחץ意为“洗、沐浴”。译为“那时……沐浴”，既显明约伯在追忆往日，也保留诗歌意象。
- source_word: הֲלִיכַי
  choice: 我的脚步
  rationale: 该词可指行走、步履或人生行程；“我的脚步”保留具体意象，也符合现代汉语诗性表达。
- source_word: בְּחֵמָה
  choice: 在凝乳中
  rationale: חֵמָה指浓稠的乳制品，可译凝乳、奶油或黄油状乳品。“凝乳”较贴近古代乳制品，又避免让读者直接联想到现代黄油。
- source_word: וְצוּר
  choice: 磐石
  rationale: צוּר意为岩石、峭岩；“磐石”庄重凝练，适合本节诗歌语体。
- source_word: יָצוּק
  choice: 倾出
  rationale: יצק意为倾倒、浇注；“倾出”保留丰盛供应的动态意象。
- source_word: עִמָּדִי
  choice: 在我身旁
  rationale: 该介词短语字面意为“与我同在、在我身旁”。正文保留其空间含义，不将其无声解释为受益关系。
- source_word: פַּלְגֵי
  choice: 道道……溪
  rationale: פַּלְגֵי可指水道、溪流。“道道……溪”既传达复数，又保留流动、丰沛的诗意。
- source_word: שָׁמֶן
  choice: 油
  rationale: שָׁמֶן通常指油，在当地语境中往往是橄榄油；正文用概括性的“油”，不增加原文未明说的限定。
