base_translation:
  language: en
  yaml_path: translation/ot/job/029/023.yaml
  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
translation:
  language: zh_hans
  text: 他们等候我，如同等候雨水；他们张大嘴，等候春雨。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “春雨”或译“后期的雨”“晚雨”。希伯来语 מַלְקוֹשׁ 指雨季后期降下的季节性雨。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: 他们等候
  rationale: 源自动词 יחל，表示带着期待而等候；“等候”既符合盼雨的比喻，也不把情感强度说得过满。
- source_word: כַמָּטָר
  choice: 如同等候雨水
  rationale: 介词 כְּ 表示比较。汉语补出第二个“等候”，使比喻关系自然清楚，同时不改变原意。
- source_word: לִי
  choice: 我
  rationale: 希伯来文直译为“为我／等我”；上下文暗示众人是在等候约伯的话或指教，但正文保留明确的第一人称代词，不将暗示明说。
- source_word: וּפִיהֶם פָּעֲרוּ
  choice: 他们张大嘴
  rationale: פער 表示大大张开，宾语由“他们的嘴”明确给出；“张大嘴”保留原文鲜明的身体意象。
- source_word: לְמַלְקוֹשׁ
  choice: 等候春雨
  rationale: מַלְקוֹשׁ 指当地农业季节后期、通常在春季降下的雨。“春雨”便于现代读者理解，脚注保留“后期的雨”这一较贴近季节次序的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如同等候雨水”与“张大嘴”保留希伯来诗句的平行结构和生动意象；不把“等候我”解释性扩写为“等候我的话”。
