  yaml_path: translation/ot/job/029/024.yaml
  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
translation:
  language: zh_hans
  text: 我向他们微笑，他们竟不相信[a]；我脸上的光彩，他们也没有使之黯淡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “微笑”也可译作“发笑”；“他们竟不相信”也可直译为“他们不相信”，可能表示他们对约伯如此垂青感到意外。
    reason: lexical_alternative
  - marker: b
    text: “我脸上的光彩”直译为“我脸的光”，指明朗、和悦的神情；“使之黯淡”直译为“使之落下”。
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂחַק אֲלֵהֶם
  choice: 我向他们微笑
  rationale: שׂחק可指发笑或微笑；本节语境描述约伯以尊贵而亲切的态度待人，并与下半句“脸上的光彩”相呼应，因此译作“微笑”。אֶל保留动作朝向他们的意思。
- source_word: לֹא יַאֲמִינוּ
  choice: 他们竟不相信
  rationale: 希伯来文直译为“他们不相信”。“竟”自然表达他们对约伯向自己微笑所感到的意外，但不把“不相信”改写为更强的解释性措辞。
- source_word: וְאוֹר פָּנַי
  choice: 我脸上的光彩
  rationale: 保留“光”的意象，同时用现代汉语自然表达明朗、和悦的面容。
- source_word: לֹא יַפִּילוּן
  choice: 他们也没有使之黯淡
  rationale: 该使役形式字面意为“没有使……落下”。与“脸上的光”搭配时，“使之黯淡”在汉语中自然，并保留其光亮减退的比喻含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留“脸上的光彩”这一希伯来意象，同时以“使之黯淡”避免生硬直译；用脚注保留动词及惯用语的字面形式与可能含义。
