base_translation:
  language: en
  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: zh_hans
  text: 因为耳朵听见了，就称我有福；眼睛看见了，就为我作证。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就见证我。”希伯来语动词可表示“作证”或“见证”；按上下文，这是对约伯有利的见证。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明约伯从前受尊重的情形；中文用“因为”自然表达解释或原因关系。
- source_word: אֹזֶן שָׁמְעָה
  choice: 耳朵听见了
  rationale: 保留希伯来文以单数身体部位泛指听见之人的形象，也与下句“眼睛看见了”形成平行。
- source_word: וַתְּאַשְּׁרֵנִי
  choice: 就称我有福
  rationale: 该动词在这里指宣称或认定某人有福；“称我有福”既保留评价意味，也避免仅理解为现代心理意义上的快乐。
- source_word: וְעַיִן רָאֲתָה
  choice: 眼睛看见了
  rationale: 采用简洁直译，保留与“耳朵听见了”相称的平行结构。
- source_word: וַתְּעִידֵנִי
  choice: 就为我作证
  rationale: 该动词表示作证；上下文表明这是对约伯有利的见证，因此译作“为我作证”，同时在脚注中保留另一种句法理解。
