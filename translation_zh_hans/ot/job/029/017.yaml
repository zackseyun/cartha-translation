  yaml_path: translation/ot/job/029/017.yaml
  text: I broke the fangs of the unrighteous, and from his teeth I threw the prey.
translation:
  language: zh_hans
  text: 我打断了不义之人的獠牙，把猎物从他齿间抛了出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַלְּעוֹת
  choice: 獠牙
  rationale: 该词指颚部或颚中的大牙；在制服掠夺者的比喻中，“獠牙”既传达咬住猎物的意象，也符合现代汉语表达。
- source_word: עַוָּל
  choice: 不义之人
  rationale: 保留此词关于不公与邪恶行为的伦理含义，并与约伯在上下文中施行公正的角色相呼应。
- source_word: אַשְׁלִיךְ
  choice: 抛了出来
  rationale: 该动词基本义为“扔、抛”；结合表示来源的“从他齿间”，译为“抛了出来”，保留原文较强烈而具体的动作。
- source_word: טָרֶף
  choice: 猎物
  rationale: 直译为被捕获、撕取之物；此处以猛兽口中的猎物比喻受恶人掠夺的对象。
theological_decisions:
- issue: 约伯所述行动的性质
  choice: 保留为约伯亲自粉碎不义者力量并救出猎物的陈述
  alternative: 弱化为一般性的帮助或解救
  rationale: 原文使用两个第一人称主动动词，生动描写约伯对压迫者的制止；不应将其抽象化或另加神学解释。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“獠牙—猎物—齿间”的连续意象保留了希伯来诗句的力度；后半句依原文动词译作“抛了出来”，避免用“夺回”等词替原文明确行动方式。
