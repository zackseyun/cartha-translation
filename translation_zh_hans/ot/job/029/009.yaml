  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: zh_hans
  text: 首领停止说话，把手放在嘴上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרִים
  choice: 首领
  rationale: 指身居高位、有权势的人；“首领”既保留其尊贵和领导地位，也比现代汉语中的“王子”更符合本段公共议事的语境。
- source_word: עָצְרוּ בְמִלִּים
  choice: 不再说话
  rationale: עצר在此表示止住、抑制，בְמִלִּים指言语。合译为“不再说话”符合现代汉语习惯，并准确表达他们因约伯出现而停止发言。
- source_word: וְכַף
  choice: 手
  rationale: כַּף本指手掌，也可泛指手；在捂嘴这一动作中，现代汉语自然说“手”。
- source_word: יָשִׂימוּ לְפִיהֶם
  choice: 把手捂在嘴上
  rationale: 原文直译为“把手放在他们的嘴上”；“捂在嘴上”自然传达以手遮口、保持沉默的动作。
theological_decisions: []
