base_translation:
  language: en
  yaml_path: translation/ot/job/029/004.yaml
  text: as I was in the days of my prime[a], when God's intimate counsel was over my tent[b],
translation:
  language: zh_hans
  text: 正如我在年富力强的日子里那样[a]，那时上帝的密意在我的帐棚之上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在我人生的秋季”，即生命成熟、兴盛的时节。
    reason: lexical_alternative
  - marker: b
    text: 或译“那时上帝的密议在我的帐棚之上”。“密意／密议”也可指上帝与人亲密相交的隐秘关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 保留比较和追忆的语气，并与上下文中约伯盼望重回昔日景况的表达衔接。
- source_word: הָיִיתִי בִּימֵי
  choice: 我……的日子
  rationale: 以自然的汉语时间表达重现希伯来语的过去状态。
- source_word: חָרְפִּי
  choice: 年富力强
  rationale: 该词本义可指秋季或收获成熟之时，在此引申为人生兴盛、成熟而充满活力的阶段；译文传达语境含义，季节意象留在脚注。
- source_word: בְּסוֹד אֱלוֹהַּ
  choice: 上帝的亲密之情
  rationale: סוֹד可表示密议、亲密圈子或知己般的相交；此译保留关系上的亲近，同时不把它限定为正式启示或单纯友谊。
- source_word: עֲלֵי
  choice: 覆庇
  rationale: 既保留“在……之上”的空间意象，也以自然汉语表达这亲密关系临及约伯住处；其较直译形式在脚注说明。
- source_word: אָהֳלִי
  choice: 我的帐棚
  rationale: 保留希伯来文具体的帐棚意象，不直接改写为家庭或家业。
theological_decisions:
- issue: בְּסוֹד אֱלוֹהַּ所表达的约伯与上帝昔日关系
  choice: 译作“上帝的亲密之情”，表达上帝与约伯之间知己般的亲近，并让“密议”的语义可能性见于脚注。
  alternative: 上帝的密议在我的帐棚之上；上帝与我亲密相交。
  rationale: 原词兼有秘密商议、亲密团契和知己圈子的含义。主文避免把它收窄为神秘启示，也不单纯解释为一般友谊，从而保留关系性与隐密商议之间的张力。
- issue: עֲלֵי所呈现的上帝同在与眷顾
  choice: 以“覆庇”表达其在帐棚之上的临在意象。
  alternative: 在我的帐棚之上；临到我的帐棚。
  rationale: “覆庇”符合本节回忆昔日蒙眷顾的语境，但不把帐棚抽象化为家属或产业；脚注保留更直译的空间表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“年富力强”自然传达成熟兴盛的生命阶段；“亲密之情”避免生硬的“亲密议事”，脚注则保存סוֹד的“密议”义。“帐棚”保留原文具体意象。
