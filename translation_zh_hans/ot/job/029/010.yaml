base_translation:
  language: en
  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: zh_hans
  text: 首领们的声音沉寂了[a]；他们的舌头贴住上膛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“首领们的声音隐藏起来”；也可译作“首领们的声音不再听见”或“沉寂了”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们的舌头贴住他们的上膛。”这是形容无法或不愿开口说话的形象说法。
    reason: idiom_explanation
lexical_decisions:
- source_word: קוֹל
  choice: 出声
  rationale: 原义为“声音”；与动词“隐藏”搭配时，表达声音消失、停止说话。译作“不再出声”符合现代汉语，也保留语境中的沉默之意。
- source_word: נְגִידִים
  choice: 首领们
  rationale: 该词可指领袖、权贵或王公。“首领们”既体现其显要地位，又不把含义限定为君主制度中的“王子”。
- source_word: נֶחְבָּאוּ
  choice: 不再出声
  rationale: 该动词基本义是“隐藏”；以“声音”为主语时，意为声音隐去、归于沉寂。正文采用自然的功能表达，脚注补出原文意象。
- source_word: וּלְשׁוֹנָם
  choice: 舌头
  rationale: 希伯来文用单数集合名词并带复数所属后缀。汉语“舌头”在此可自然地作集合性表达。
- source_word: לְחִכָּם
  choice: 上膛
  rationale: חֵך 指口腔上部，即上膛或腭。“上膛”通俗明确，适合普通现代读者。
- source_word: דָּבֵקָה
  choice: 紧贴
  rationale: 动词意为“粘住、紧附”。“紧贴上膛”保留原文具体意象，并传达因敬畏或克制而无言的状态，但不限定其动机。
theological_decisions:
- issue: 沉默是不能说话还是不愿说话
  choice: 正文只描写停止出声和舌头贴住上膛，不说明沉默的具体动机
  alternative: 明确译成“吓得说不出话”或“闭口不言”
  rationale: 原文呈现沉默的形象，却没有交代是出于敬畏、克制还是无言以对；保留这种开放性可避免加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“首领们”体现社会地位；“不再出声”自然传达声音隐去的含义；“舌头紧贴上膛”保留希伯来诗歌的身体意象。脚注标记均置于相关正文之后。
