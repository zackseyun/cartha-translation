  yaml_path: translation/ot/job/029/012.yaml
  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
translation:
  language: zh_hans
  text: 因为我搭救了呼求帮助的穷人，也搭救了无人帮助的孤儿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“失去父亲的人”。希伯来语更具体地指没有父亲、在社会上处于弱势的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明约伯受到尊敬的缘由；“因为”自然体现解释性的因果关系。
- source_word: אֲמַלֵּט
  choice: 我搭救了
  rationale: מלט 的 Piel 形表示主动使人脱险、施行拯救；“搭救”既自然，也突出实际介入。
- source_word: עָנִי
  choice: 穷人
  rationale: 该词可指贫穷或受苦之人；本节涉及社会弱势者，“穷人”最直接贴合语境，同时不排除其困苦处境。
- source_word: מְשַׁוֵּעַ
  choice: 呼求帮助的
  rationale: 分词描写穷人正在呼求援助；译作定语从句式短语，符合现代汉语表达。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 该词特指失去父亲、因而处于弱势的人；“孤儿”是现代汉语中简洁自然的对应词，其较具体的希伯来语含义由脚注说明。
- source_word: וְלֹא עֹזֵר לוֹ
  choice: 无人帮助的
  rationale: 简洁表达此人没有援助者，并自然修饰“孤儿”；也保留了他孤立无援的处境。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“搭救”保留主动援救的力度；第二个“也搭救了”在汉语中补出，以清楚表明同一动词同时支配“穷人”和“孤儿”。
