  yaml_path: translation/ot/job/029/002.yaml
  text: Oh[a], that I were as in months gone by, as in the days when God watched over me[b],
translation:
  language: zh_hans
  text: 但愿我仍如昔日的岁月，如上帝看顾我的日子！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: 但愿我能回到
  rationale: 希伯来语字面为“谁能给我……”，在此是表达强烈愿望的惯用语。结合所比较的“从前的岁月”，译为“但愿我能回到”符合现代汉语，也保留约伯追念往昔的语气。
- source_word: כְיַרְחֵי קֶדֶם
  choice: 从前的岁月
  rationale: כְ表示比较，יֶרַח为“月”，קֶדֶם在此指过去。汉语以“从前的岁月”自然表达昔日时光，并与下句“日子”形成诗意平行。
- source_word: כִּימֵי
  choice: 回到……的日子
  rationale: 原文继续以比较结构承接上句；汉语重复“回到”可清楚呈现两个平行的时间短语。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的“上帝”之诗体单数形式；原文没有“全能者”一词，不作扩译。
- source_word: יִשְׁמְרֵנִי
  choice: 看顾我
  rationale: שׁמר可指守护、保守、看顾。此处回忆上帝昔日的保护与照料，“看顾”自然凝练，同时不把语义限定为某一种具体保护方式。
theological_decisions:
- issue: 约伯对上帝昔日作为的回忆
  choice: 上帝看顾我
  alternative: 上帝守护我／保守我
  rationale: 译文保留约伯所感受到的上帝保护性关怀，不进一步说明其机制，也不消解本章对往昔与现状之间张力的表达。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“但愿”传达希伯来语愿望句式，以两个“回到”再现平行结构；句末用感叹号体现追念和哀叹。
