  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: zh_hans
  text: 我曾是穷乏人的父亲；对于我所不熟悉的案件[a]，我也查究。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我查究素不相识之人的案件。”
    reason: לֹא יָדַעְתִּי最直接可修饰“案件”，指约伯事先不了解的案件；也可按语境理解为与案件当事人没有私交。
lexical_decisions:
- source_word: אָב
  choice: 父亲
  rationale: 保留原文“父亲”的比喻，表达约伯对穷乏人的保护、照顾和扶助，而不以“保护者”等解释性称呼取代原有意象。
- source_word: אָנֹכִי
  choice: 我是
  rationale: 独立人称代词带有强调意味；结合第29章追忆往昔的语境，汉语用“我是”自然表达过去叙事中的身份陈述。
- source_word: לָאֶבְיוֹנִים
  choice: 穷乏人
  rationale: אֶבְיוֹן指贫穷、缺乏而需要援助的人。“穷乏人”既涵盖经济贫困，也保留需要扶助的含义，语体庄重且为普通读者所能理解。
- source_word: וְרִיב
  choice: 案件
  rationale: רִיב可指争讼、纠纷或法律案件；此处与查究事实相连，“案件”最自然地呈现司法和社会申诉的语境。
- source_word: לֹא יָדַעְתִּי
  choice: 不熟悉的
  rationale: 直译为“我不知道的”。在修饰“案件”时译作“不熟悉的”，既表达约伯事先不了解案情，也避免误解为他查究后仍不知道。
- source_word: אֶחְקְרֵהוּ
  choice: 我也查究到底
  rationale: חקר表示仔细搜寻、调查或查明；“查究到底”体现持续而彻底的调查。宾语代词所指的“案件”已在前半句明示。
theological_decisions:
- issue: לֹא יָדַעְתִּי的关联对象
  choice: 正文理解为约伯事先不熟悉的“案件”
  alternative: 理解为他素不相识之人的诉讼
  rationale: 希伯来语最直接的句法是“我不知道的案件，我查究它”，但“知道”也可涉及与当事人的相识；为保留这一真实歧义，正文采用较贴近语法的理解，另一理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“父亲”保留原文鲜明的伦理意象；分号呈现两项并列的善行。“查究到底”较“调查”更符合诗体语感，同时清楚表达彻底查明之意。
