lexical_decisions:
- source_word: בְּעוֹד
  choice: 那时……仍……
  rationale: בְּ加עוֹד在回忆往昔的语境中表示过去持续的状态；“那时……仍……”既表达时间关系，也暗示这种境况后来已不复存在。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是《约伯记》中常见的神圣称号。译出其传统含义，比音译“沙代”更便于现代普通读者理解。
- source_word: עִמָּדִי
  choice: 与我同在
  rationale: עם带第一人称单数词尾，表示陪伴、临在。“与我同在”自然直接，也符合此处约伯追忆蒙眷顾之时的语境。
- source_word: סְבִיבוֹתַי
  choice: 在我周围
  rationale: 该词表示环绕说话者四周；“在我周围”准确而符合现代汉语表达。
- source_word: נְעָרָי
  choice: 我的年轻人
  rationale: נַעַר可指年轻男子，也可按处境指随从或仆人。正文采用较少限定身份的“年轻人”，保留词义空间，并以脚注列出合乎语境的另一译法。
