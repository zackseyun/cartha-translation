  text: 我的根伸展到水边，露水整夜留在我的枝条[a]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我的收成中。”此处的希伯来文词语在上下文中用法不寻常；正文译作“枝条”，因为这更符合“根”和“露水”的植物意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: 我的根
  rationale: 原文为单数名词加第一人称单数后缀；现代汉语用“我的根”既自然，也保留植物根系的整体意象。
- source_word: פָתוּחַ
  choice: 伸展
  rationale: 该被动分词本义为“敞开、展开”；与“根”搭配时译作“伸展”，自然表达根系延伸的状态。
- source_word: אֱלֵי מָיִם
  choice: 到水边
  rationale: אֱלֵי 表示朝向或关联，מָיִם 在此可作集合概念；“到水边”保留根朝水延伸的图景，同时符合现代汉语习惯。
- source_word: וְטַל
  choice: 露水也
  rationale: טַל 直译为“露水”；连接词按上下文译作“也”，使两幅繁茂、滋润的图景衔接自然。
- source_word: יָלִין
  choice: 整夜留在
  rationale: לון 表示住宿或过夜；“整夜留在”保留时间含义，并适合描写露水持续停留。
- source_word: בִּקְצִירִי
  choice: 在我的枝条上
  rationale: קָצִיר 通常指“收割、收成”，但此处语境不寻常；结合“根”和“露水”的植物意象，采用可指枝条或被剪取之生长物的理解。较直译的“在我的收成中”收入脚注，以保留词义歧义。
