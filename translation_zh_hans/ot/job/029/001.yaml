  text: And Job continued, taking up his discourse, and said:[a]
translation:
  language: zh_hans
  text: 约伯继续发表自己的言论，说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “言论”也可译作“箴言”、“比喻”或“宣告”。希伯来语“马沙尔”（mashal）的含义较广；这里用来引出约伯一段较长的诗体发言。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: 继续
  rationale: יסף本义为“增加”，与后接不定式连用时表达继续进行某事；译作“继续”既体现叙事承接，也符合现代汉语。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שְׂאֵת
  choice: 讲述
  rationale: נשׂא本义为“举起、承担”，在נשׂא משל这一表达中指开口陈述或发出一篇言论。汉语若直译为“举起”不自然，因此按语境译为“讲述”。
- source_word: מְשָׁלוֹ
  choice: 他的言论
  rationale: מָשָׁל语义范围较广，可指箴言、比喻、格言或诗体言论。这里引出约伯一段较长的诗体发言，译作“言论”较贴合文体，又不把词义限定为短小的“箴言”。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 这是引出直接引语的标准叙事形式；现代汉语用“说”自然简洁。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“继续讲述他的言论”分别体现וַיֹּסֶף的持续义和שְׂאֵת מְשָׁלוֹ的陈述习语；脚注保留מָשָׁל的宽广语义。
