base_translation:
  language: en
  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
translation:
  language: zh_hans
  text: 将要灭亡的人的祝福临到我[a]；我使寡妇的心欢唱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“濒临灭亡之人的祝福临到我。”希伯来语分词אֹבֵד可指正在灭亡、遭到毁坏或濒临死亡的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我使寡妇的心喜乐”，或“我使寡妇的心发出欢呼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת
  choice: ……的祝福
  rationale: 这是בְּרָכָה的构造形，与后面的分词构成所属关系；这样译成中文自然，并保留“那人所发出的祝福”这一含义。
- source_word: אֹבֵד
  choice: 将亡之人
  rationale: אבד的Qal主动分词可指正在灭亡、陷入绝境或濒临死亡的人。“将亡之人”保留其进行中的危难状态，又不限定具体是死亡、贫困还是毁灭。
- source_word: עָלַי תָּבֹא
  choice: 临到我
  rationale: 介词עַל配合动词בוא，表达祝福来到约伯身上；“临到我”既符合汉语表达，也保留原文意象。未完成式在约伯回顾往昔的诗歌语境中按过去情境理解。
- source_word: לֵב אַלְמָנָה
  choice: 寡妇的心
  rationale: 直译构造关系，并保留“心”作为内在情感与人格中心的常见意象。
- source_word: אַרְנִן
  choice: 我使……欢呼喜乐
  rationale: 这是רנן的Hiphil第一人称单数，具有使役意味，表示约伯使寡妇的心欢喜、欢呼；该译法兼顾使役语气和喜乐发声的色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“将亡之人”保留原文所指危难性质的含混；“欢呼喜乐”体现רנן的发声色彩和Hiphil使役语气。所有脚注标记均置于对应主文之后。
