  yaml_path: translation/ot/job/029/018.yaml
  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
translation:
  language: zh_hans
  text: '于是我说[a]：


    “我必死在我的巢中；


    我的日子必多如沙。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必像凤凰一样增多我的日子。”译作“沙”的希伯来词在这里也被一些人理解为一种鸟名。按通常词义和上下文，译作“沙”更可能；圣经也常以沙比喻数量众多。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: 那时我说
  rationale: 承接约伯对昔日安稳生活的回忆，表达叙事推进；“那时”在现代汉语中自然，也不额外强化因果关系。
- source_word: עִם קִנִּי
  choice: 在自己的巢中
  rationale: עִם 字面常作“与”，但与“我的巢”连用时表示伴随巢居而死的安稳情景；汉语译作“在……巢中”最能传达语义。保留“巢”的诗歌意象，不扁平化为“家”。
- source_word: אֶגְוָע
  choice: 我必死
  rationale: 该动词指断气、死亡；“死”简洁自然。“必”在此表达约伯当时对自己结局的确信，而非神学上的预定断言。
- source_word: וְכַחוֹל
  choice: 多如沙粒
  rationale: חוֹל 通常指“沙”；与日子众多相配，也符合希伯来圣经以沙表示数量繁多的常见意象。可能的鸟名解释保留在脚注中。
- source_word: אַרְבֶּה יָמִים
  choice: 我的日子必多
  rationale: רבה 的使役式表示增多；现代汉语以“日子必多”自然表达寿数绵长，并由第一人称语境补出“我的”。
theological_decisions:
- issue: 约伯所说长寿预期的语气
  choice: 用“必”表达约伯昔日确信
  alternative: 用“将”仅表示未来
  rationale: 上下文是约伯回顾自己曾以为会安稳终老、享有长寿；“必”反映他的主观把握，不把这句话处理为神的应许或客观预言。
- issue: חוֹל 的“沙”或“凤凰”解释
  choice: 正文译“沙粒”
  alternative: 正文译“凤凰”或某种长寿鸟
  rationale: “沙”是该词通常且语境相称的意义；鸟名说虽有古老解释传统，却不确定，故在脚注中保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分行保留希伯来诗歌的两个平行意象：“巢”表现安居终老，“沙粒”表现日子繁多。脚注标记[a]已置于正文相应位置。
