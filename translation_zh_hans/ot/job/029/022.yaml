  yaml_path: translation/ot/job/029/022.yaml
  text: After my words they did not speak again[b][a], and my word dripped upon them.
translation:
  language: zh_hans
  text: 我说完话后，他们就不再说话[a]；我的话滴落在他们身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不再回答。”这里的希伯来语动词可指不再重复说话，也可指在约伯说完后不再回应。
    reason: lexical_alternative
  - marker: b
    text: 直译为“我的话滴在他们身上”。这是诗歌性的画面，把话语描写为滴落在他们身上。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  choice: 我说话以后
  rationale: 按时间关系表达“在我的话之后”；现代汉语用“我说话以后”比直译“在我的话以后”自然，同时不额外说明话是否已经全部说完。
- source_word: לֹא יִשְׁנוּ
  choice: 他们就不再开口
  rationale: יִשְׁנוּ在此可指再次说、重复说或作答。“不再开口”符合听众在约伯发言后不继续说话的语境，并以脚注保留“回答”的可能。
- source_word: וְעָלֵימוֹ
  choice: 在他们身上
  rationale: 保留עַל加第三人称复数后缀所表达的“在他们之上／身上”，与“滴落”的诗歌意象相连。
- source_word: תִּטֹּף
  choice: 滴落
  rationale: 保留נטף表示液体滴下的具体意象，不把比喻解释成“温柔教导”或“权威训示”。
- source_word: מִלָּתִי
  choice: 我的话
  rationale: מִלָּה在诗歌中指所说的话；用单数集合意义的“话”既自然，也贴近原文形式。
theological_decisions: []
