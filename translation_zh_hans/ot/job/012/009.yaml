  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: zh_hans
  text: 这一切当中，谁不知道这是雅威[a]的手所做的呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“YHWH”（יהוה），即神的四字圣名；传统中文常译作“耶和华”。
    reason: 说明神名的原文形式，并交代传统中文译名。
lexical_decisions:
- source_word: מִי לֹא יָדַע
  choice: 谁不知道……呢
  rationale: 疑问代词、否定词和完成式动词共同构成反问；现代汉语用“谁不知道……呢”自然表达人人都知道的含义，同时保留反问语气。
- source_word: בְּ/כָל אֵלֶּה
  choice: 这一切当中
  rationale: בְּ在这里可表达范围，即“在这一切之中”。“这一切”承接上文所列的走兽、飞鸟、地和海鱼，又不过度限定具体所指。
- source_word: כִּי
  choice: （知道）……
  rationale: כִּי引出“知道”的内容；汉语无需另译“那”，直接接宾语从句最自然。
- source_word: יַד
  choice: 手
  rationale: 保留希伯来语的拟人性意象；“耶和华的手”在汉语圣经语体中清楚表达他的作为与能力。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文最通行、可辨识的形式音译四字神名，并以脚注说明原文形式。
- source_word: עָשְׂתָה זֹּאת
  choice: 这是……所做的
  rationale: עָשָׂה可指“做、造成”；阴性单数指示词זֹאת译作“这”，整体指向眼前所论的事。采用“这是……所做的”既贴近原文，也符合现代汉语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名，不宜只以称号替代。正文采用现代中文读者最熟悉的专名“耶和华”，脚注交代其希伯来文形式；“雅威”较接近学界常见的拟音，但在普通中文读者中辨识度较低。
- issue: “耶和华的手”是字面肢体还是能力与作为的意象
  choice: 保留“手”这一原文意象
  alternative: 译作“能力”或“作为”
  rationale: 原文用拟人性表达指神的施行与能力。直译“手”不会要求读者将其理解为肉身肢体，也避免抹去经文鲜明的意象。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“这一切当中”保留范围表达；“谁不知道……呢”呈现原文反问；“手”保留原文意象。脚注标记已置于正文神名之后。
