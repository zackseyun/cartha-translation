  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: zh_hans
  text: 然而，请你问问走兽，它们会教导你；再问问空中的飞鸟，它们会告诉你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: 然而
  rationale: 标明约伯话语中的转折；“然而”简洁、庄重，也符合诗体语气。
- source_word: שְׁאַל נָא
  choice: 请你问问
  rationale: שְׁאַל是命令式“问”，נָא表达请求或劝促的语气；“请你问问”自然保留这种语用力量，而不误解为单纯的时间副词“现在”。
- source_word: בְהֵמוֹת
  choice: 走兽
  rationale: 此处泛指陆地动物，并非专指牲畜；“走兽”与下句“飞鸟”形成自然、庄重的诗歌对应。
- source_word: וְתֹרֶךָּ
  choice: 它们会教导你
  rationale: 该动词是ירה的使役形，意为“教导、指教”。希伯来文用阴性单数形式与集合名词בְהֵמוֹת呼应，汉语按集合中的复数个体自然译作“它们”。
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: 空中的飞鸟
  rationale: עוֹף指飞禽或飞鸟，הַשָּׁמַיִם字面为“诸天/天空”；“空中的飞鸟”是现代汉语中自然且准确的表达。
- source_word: וְיַגֶּד לָךְ
  choice: 它们会告诉你
  rationale: נגד的使役形意为“告诉、使人知道”。汉语按“飞鸟”的集合意义用复数代词“它们”，表达自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“走兽—飞鸟”“教导—告诉”保留希伯来诗句的平行结构；补出第二个“问问”，使汉语句法清楚，但不增加新的命题内容。
