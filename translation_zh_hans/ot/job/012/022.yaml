lexical_decisions:
- source_word: מְגַלֶּה
  choice: 揭示
  rationale: 该词是 גלה 的分词，表示揭开、显露或使人知道；“揭示”在现代汉语中自然，并兼顾揭开与显明的含义。
- source_word: עֲמֻקוֹת
  choice: 深藏之事
  rationale: 阴性复数形容词在此作名词使用，可指深处、深奥或隐秘之物；“深藏之事”保留其复数集合意义，并切合从黑暗中显露的意象。
- source_word: מִנִּי חֹשֶׁךְ
  choice: 从黑暗中
  rationale: 介词表达来源，说明深藏之事从黑暗中被揭示出来；此译法简洁自然。
- source_word: וַיֹּצֵא
  choice: 带到
  rationale: יצא 的使役式表示使某物出来；与“光明中”搭配时，“带到”自然地表达使其从隐蔽处显露的动态。
- source_word: לָאוֹר
  choice: 光明中
  rationale: 该短语表示朝向光或进入光中；“到光明中”在汉语中清楚保留移动与显露的意象。
- source_word: צַלְמָוֶת
  choice: 死荫
  rationale: “死荫”保留该词传统且仍具词源可能性的诗性表达；该词也可能表示“幽暗”或“死亡般的黑暗”，故将重要的词义歧义列入脚注。
theological_decisions:
- issue: צַלְמָוֶת 的译法
  choice: 死荫
  alternative: 幽暗；死亡般的黑暗
  rationale: 这主要是词汇与诗歌意象问题，而非教义裁决。“死荫”保留死亡与黑暗交叠的传统意象；鉴于该词也可泛指极深的黑暗，脚注列出替代译法，以免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以“深藏之事”表达可兼具空间性和隐秘性的复数名词化用法，并保留“黑暗—光明”的诗性对照。脚注标记置于整句之后，明确对应“死荫”的词义选择。
