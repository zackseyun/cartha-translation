  text: יִשְׁלָ֤יוּ אֹֽהָלִ֨ים לְ/שֹׁ֥דְדִ֗ים וּֽ֭/בַטֻּחוֹת לְ/מַרְגִּ֣יזֵי אֵ֑ל לַ/אֲשֶׁ֤ר הֵבִ֖יא אֱל֣וֹהַּ בְּ/יָדֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: zh_hans
  text: 掠夺者的帐棚安逸，惹上帝发怒的人安稳——就是那些把神明带在手中的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾的希伯来文句法困难。正文按“把神明带在手中”理解，可能讽刺恶人把自己所倚仗的力量或偶像当作神。也可理解为“上帝把他们交在他手中”，或“上帝把某物交到他们手中”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: 安然无事
  rationale: 该词表示平静、安逸、不受搅扰；“安然无事”既自然，也保留恶人竟享安宁的反讽意味。
- source_word: אֹהָלִים
  choice: 帐棚
  rationale: 保留具体意象；在智慧文学中也可借指住处或家室。
- source_word: לְשֹׁדְדִים
  choice: 强盗的
  rationale: 该分词指以暴力抢掠、毁坏的人；“强盗”在现代汉语中简明自然，并保留掠夺性。
- source_word: וּבַטֻּחוֹת
  choice: 稳稳当当
  rationale: 源自表示安稳、无虞的词根，与前句“安然无事”构成诗歌平行；这里侧重实际处境安稳，不仅是主观自信。
- source_word: לְמַרְגִּיזֵי אֵל
  choice: 惹上帝发怒的人
  rationale: 使役分词在此表示激怒、触犯上帝；译法明白自然。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是通常的神圣称号，指真神。
- source_word: לַאֲשֶׁר
  choice: 他们的
  rationale: 按所选理解，引出进一步描述这些安稳恶人的关系从句；原文句法困难，其他可能译法列于脚注。
- source_word: הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: 他们的神把东西送到他们手中
  rationale: 正文依照一种可能的句法理解，以 אֱלוֹהַּ 为主语，并把“到手中”理解为获得或掌握；汉语必须补出泛指宾语“东西”才能成句。原文也可能把“上帝”理解为真神，或把它视为所带之物，故在脚注保留歧义。
theological_decisions:
- issue: 末句 אֱלוֹהַּ 的所指和句法功能
  choice: 用“他们的神”指恶人所倚仗、能使他们得利的对象，保留反讽意味
  alternative: 可理解为真神：“上帝把他们交在他手中”，或“上帝把东西送到他们手中”；也可理解为“把自己的神带在手中”
  rationale: 上下文强调掠夺者和触怒上帝者竟然安稳，末句可能进一步刻画他们错误的倚靠。不过希伯来文句法非常困难，不能确定，因此不在正文之外排除其他涉及真神护理或人手中偶像的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安然无事／稳稳当当”形成自然的平行表达，并突出约伯所指出的道德反常。脚注标记[a]置于相关难句之后。
