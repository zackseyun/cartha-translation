  rationale: 修订以“掠夺者”恢复暴力掠夺与毁坏的较宽语义，以“安逸／安稳”维持庄重的诗歌平行。末句改用较贴近字面、且符合上下文讽刺意味的“把神明带在手中”，删除原文未明示的“东西”；脚注保留涉及真神施行掌管或赐予的替代句法，避免将争议文本作教义性定论。
