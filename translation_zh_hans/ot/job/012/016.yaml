  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: zh_hans
  text: 力量和健全的智慧都在他那里[a]；走迷的人和使人走迷的人，都属于他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受骗的和骗人的，都属于他。”希伯来语的两个分词也可按上下文这样理解；正文则保留同一词根的形态对照：一个走迷，另一个使人走迷。
    reason: 词义替代译法
lexical_decisions:
- source_word: עִמּוֹ
  choice: 在他那里
  rationale: 保留希伯来语表示同在兼具所有、支配意味的表达；在本句中指能力和真智慧为神所有，并由他掌管。
- source_word: עֹז
  choice: 能力
  rationale: 该词表示力量、权能；“能力”在现代汉语中自然庄重，也能涵盖神施行作为的力量。
- source_word: תּוּשִׁיָּה
  choice: 真智慧
  rationale: 在智慧文学中常指健全、可靠且能成事的智慧；“真智慧”比单说“智慧”更能体现其充实可靠的意味，同时避免误译为“成功”。
- source_word: לוֹ
  choice: 属于他
  rationale: ל 加代词后缀在此表达归属或支配关系；“属于他”与上半句彼此呼应，又不把这种关系扩展解释为神直接造成道德上的迷误。
- source_word: שֹׁגֵג
  choice: 走迷的
  rationale: 这是 שׁגה 的 Qal 分词，指走错、迷失或偏离的人；“走迷的”保留其主动而不及物的形态意义。
- source_word: מַשְׁגֶּה
  choice: 使人走迷的
  rationale: 这是同一词根的 Hiphil 分词，指使别人走错或偏离的人；此译法与“走迷的”形成清楚的使役对照，不额外强化为蓄意欺骗。
theological_decisions:
- issue: 神与走迷者及使人走迷者的关系
  choice: 两者都属于神，即处于他的权柄之下，但不说明神是其道德迷误的直接成因。
  alternative: 译成神认识两者、神在护理中控制两者，或神直接造成迷误与欺骗。
  rationale: 原文只以 לוֹ 表明二者“归他”或“属他”。译文保留神主权范围广阔这一强烈宣告，同时不加入原文没有明说的道德因果判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“走迷的／使人走迷的”刻意保留希伯来语 Qal 与 Hiphil 的不及物—使役对照；分号呈现两诗行的平行结构。
