  text: מֵסִ֗יר לֵ֭ב רָאשֵׁ֣י עַם הָ/אָ֑רֶץ וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: zh_hans
  text: 他夺去地上百姓首领的悟性[a]，使他们在没有道路的荒野中游荡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悟性”原文直译为“心”，在这里指理解力或判断力；“首领”原文直译为“头”。“地上百姓”原文直译为“地的百姓”，其中“地”也可指“土地”或“全地”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在荒凉之地，没有道路”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: 夺去
  rationale: 该词为使役意义，表示移除、拿走；“夺去”自然地表达首领被剥夺悟性的意思，并保留上帝主动施行的力度。
- source_word: לֵב
  choice: 悟性
  rationale: 字面为“心”，但希伯来语在此指思考、判断和明辨的能力；“悟性”可避免现代读者误解为单指情感。
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: 地上百姓的首领
  rationale: רָאשֵׁי 字面为“头”，是领袖的习语；译作“首领”符合现代汉语。הָאָרֶץ 可指“地”或“全地”，此处保留“地上百姓”这一较宽泛且自然的表达。
- source_word: וַיַּתְעֵם
  choice: 使他们……漂流
  rationale: תעה 的使役形式表示使人迷失、游荡；“使……漂流”既保留使役关系，也呈现失去方向的形象。
- source_word: בְּתֹהוּ
  choice: 在……荒野中
  rationale: תֹהוּ 表示空虚、荒凉或混沌之地；结合下文“无路”，译作“荒野”最能传达具体意象。
- source_word: לֹא דָרֶךְ
  choice: 无路的
  rationale: 原文直译为“没有道路”；“无路的荒野”简洁保留了寸步难行、无从辨向的画面。
theological_decisions:
- issue: 动词所隐含的主语
  choice: 以“他”承接上下文中的上帝
  alternative: 不明说主语，采用无主句
  rationale: 本章上下文明确以神为这些行动的施行者；译出“他”符合汉语表达，同时没有加入超出原文语境的神学解释。
- issue: “地”或“全地”的范围
  choice: 译作“地上百姓”，不限定为某一国家
  alternative: 译作“一地百姓”或“世上万民”
  rationale: הָאָרֶץ 本身可指土地、国土或全地；此处维持其范围上的弹性，避免把经文过度地方化或普世化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“夺去……悟性”传达判断力被剥夺；“无路的荒野中漂流”保留原文具体而有力的迷失意象。所有代词均由上下文确定，未额外加入宗派性解释。
