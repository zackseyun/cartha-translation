base_translation:
  language: en
  yaml_path: translation/ot/job/012/012.yaml
  text: With the aged is wisdom[a], and with length of days[b], understanding.
translation:
  language: zh_hans
  text: 年长者中有智慧[a]；年日长久者有悟性[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧在年长者中间。”希伯来语介词可表示关联或所在。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“日子的长久”；可指长久的年日或长寿。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: 年长者有
  rationale: 介词 בְּ 可表示关联或所在；结合复数名词，表达智慧与年长者相伴、存在于他们中间。译为“年长者有”自然简洁，也不把所指限于男性。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是智慧文学中 חָכְמָה 的标准对应词，并与下半句的“聪明”形成平行。
- source_word: וְאֹרֶךְ יָמִים
  choice: 长寿者有
  rationale: 原文直译为“日子的长久”，在此指年日长久或长寿。正文以人物化的“长寿者”与“年长者”保持平行，脚注保留原文字面意象。
- source_word: תְּבוּנָה
  choice: 聪明
  rationale: תְּבוּנָה 指理解力、洞察力或辨别力；“聪明”在现代汉语圣经语体中自然庄重，并可与“智慧”区分而又相称。
theological_decisions:
- issue: 这句格言是在肯定年龄必然带来智慧，还是陈述通常关联
  choice: 保留简洁的格言式陈述，不加入“通常”“必然”等限定词
  alternative: 译作“年长者通常有智慧”或“年长者必有智慧”
  rationale: 希伯来文本只把智慧与年长者、聪明与长久年日并列关联，并未明说这种关系是统计性的还是绝对的；不应在译文中替作者消解张力。
translation_notes:
  register: 采用现代、庄重而易懂的格言语体；以两个简洁分句再现希伯来诗歌的平行结构。所有脚注标记均置于正文相应词语之后。
