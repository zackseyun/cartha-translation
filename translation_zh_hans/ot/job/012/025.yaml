  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: zh_hans
  text: 他们在黑暗中摸索，没有光；他使他们像醉汉一样踉跄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使他们迷失方向。”原文动词可指游荡或迷失；本节以醉汉作比喻，因此正文译作“踉跄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: 摸索
  rationale: 该词的加强词干表达在看不见时用手探触前行；“摸索”自然保留了这一具体意象。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 这是该词的常规对应，也能同时容纳此处实际与比喻性的含义。
- source_word: וְלֹא אוֹר
  choice: 毫无亮光
  rationale: 原文直译为“而没有光”；“毫无亮光”在现代汉语中自然，并保留鲜明的否定。
- source_word: וַיַּתְעֵם
  choice: 他使他们……踉跄
  rationale: תעה本义涉及游荡、迷失；此处为使役意义，结合后面的醉汉比喻，“使……踉跄”最能表达行动失控、方向错乱的图景。
- source_word: -ם（וַיַּתְעֵם中的后缀）
  choice: 他们
  rationale: 第三人称阳性复数宾语后缀回指上下文中的复数人物，汉语中明确译出。
- source_word: כַּשִּׁכּוֹר
  choice: 像醉汉一样
  rationale: 该词指喝醉的人；“醉汉”简洁、庄重，且清楚保留明喻。
theological_decisions:
- issue: וַיַּתְעֵם的隐含主语
  choice: 他使他们踉跄
  alternative: 他们踉跄
  rationale: 动词是第三人称阳性单数，并带第三人称阳性复数宾语后缀，因此语法上是“他使他们……”。上下文中的“他”指上帝；明确保留主语，既忠于形式，也不淡化本段所表达的上帝使掌权者失去方向这一神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“毫无亮光”增强原文否定的力度而不添加解释；分号保留诗句两部分的平行推进。脚注标记置于整节末尾，对“踉跄”的词义选择作说明。
