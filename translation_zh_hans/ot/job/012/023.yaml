base_translation:
  language: en
  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: zh_hans
  text: 他使列国壮大，又使它们灭亡；他使列国扩张，又将它们引走[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他扩展列国，又引导它们。”希伯来语动词可理解为他使列国扩展，继而引导它们；正文则按上下文中较可能的逆转式平行来译。
    reason: 保留שטח与נחה在后半句诗歌平行结构中的另一种理解。
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: 使……壮大
  rationale: 该词是שׂגא的使役分词，表示使之变大、增多或强盛。“使……壮大”保留使役含义，也不把意思限定为经济繁荣。
- source_word: לַגּוֹיִם
  choice: 列国
  rationale: גּוֹיִם在此泛指各政治民族或国家，并非特指与以色列相对的外邦人；“列国”符合诗体语域。
- source_word: וַיְאַבְּדֵם
  choice: 又使它们灭亡
  rationale: אבד在此表达使之消亡、毁灭的意思；采用“使……灭亡”既保留使役意味，又与前句“使……壮大”形成鲜明逆转。
- source_word: שֹׁטֵחַ
  choice: 使……扩张
  rationale: שטח的基本意象是铺开、展开；用于列国时可指疆域或势力的扩展。“扩张”在现代汉语中自然，并保留其空间意象。
- source_word: וַיַּנְחֵם
  choice: 又将它们引走
  rationale: נחה通常表示带领、引导。结合本节列国兴衰的逆转式平行，“引走”呈现移动及离去的意味，同时不具体限定为被掳、驱逐或流放。
theological_decisions:
- issue: 后半句中列国运动的含义
  choice: 理解为上帝先使列国扩张，继而将它们引走，突出他掌管列国的兴衰变迁。
  alternative: 理解为上帝扩展列国并引导它们，带有较正面的引领意味。
  rationale: נחה本身可以表示中性的“带领”或较正面的“引导”；但它与前半句“壮大—灭亡”的逆转并列时，也可能含有领离原处之意。正文采用较符合上下文逆转平行的译法，脚注保留另一种可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“列国”保持智慧诗歌的凝练语气；“壮大—灭亡、扩张—引走”的对应尽量呈现希伯来诗句的平行与逆转。
