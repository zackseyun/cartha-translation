  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ נֶ֣פֶשׁ כָּל חָ֑י וְ֝/ר֗וּחַ כָּל בְּשַׂר אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: zh_hans
  text: 一切活物的生命和全人类的气息，都在他手中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切活物的魂，以及全人类肉身的灵。”
    reason: 保留 נֶפֶשׁ 可译作“魂”、רוּחַ 可译作“灵”，以及 כָּל בְּשַׂר אִישׁ 较为字面的“全人类肉身”等词义可能。
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: 都在他手中
  rationale: אֲשֶׁר承接上文，引出关于上帝的关系从句；בְּיָדוֹ直译为“在他手中”，既保留希伯来语的“手”这一意象，也表达掌管、支配之意。中文按自然语序置于句末。
- source_word: נֶפֶשׁ
  choice: 生命
  rationale: 此处指活物赖以存活的生命，和下半句的רוּחַ构成平行；译作“生命”可避免把后期较严格的“灵魂”概念强加于经文。
- source_word: כָּל חָי
  choice: 一切活物
  rationale: 概括所有有生命的受造物；“一切活物”简洁自然，并保留范围的普遍性。
- source_word: וְרוּחַ
  choice: 和……气息
  rationale: 在生命语境及诗句平行结构中，רוּחַ可指使人存活的气息；译作“气息”保留具体的生命意味，同时以脚注注明“灵”的可能译法。
- source_word: כָּל בְּשַׂר אִישׁ
  choice: 全人类
  rationale: 字面涉及“人的一切肉身”，在此整体指所有凡人；“全人类”准确传达其集合性范围，较符合现代汉语表达，字面可能性则保留在脚注中。
theological_decisions:
- issue: נֶפֶשׁ与רוּחַ所表达的人与生命观
  choice: 正文译为“生命”和“气息”
  alternative: “魂”和“灵”
  rationale: 上下两句强调上帝掌握一切受造生命，并不要求在此建立严格的身体—灵魂二分。具体译法较贴合语境；脚注保留传统且词典上可能的“魂／灵”，不消除原文的语义张力。
- issue: כָּל בְּשַׂר אִישׁ中的人类泛指
  choice: 全人类
  alternative: 所有人的肉身
  rationale: אִישׁ在这里具有泛指和集合意义；正文采用现代汉语中清楚自然的“全人类”，脚注则呈现“肉身”这一原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“都在他手中”保留原文核心隐喻，并以符合汉语信息结构的语序呈现；正文重在自然清晰，脚注补足较直译的词义选择。
