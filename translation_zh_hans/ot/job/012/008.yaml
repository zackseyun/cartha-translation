base_translation:
  language: en
  yaml_path: translation/ot/job/012/008.yaml
  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: zh_hans
  text: 或向大地说话[a]，它就会教导你[b]；海里的鱼也会告诉你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地”；希伯来语 אֶרֶץ 既可指“大地”，也可指“土地”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“她就会教导你”，因为“大地”在希伯来语中是阴性名词。
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: 或
  rationale: 作为选择连词，承接上文“你且问……”的一连串呼吁；“或”简洁自然，并保留诗句的并列结构。
- source_word: שִׂ֣יחַ
  choice: 说话
  rationale: 此处带介词短语“向大地”，表示向其发言、与其说话，而不是内心默想；这一选择也与上下文向走兽、飞鸟求问的拟人表达相称。
- source_word: לָ/אָ֣רֶץ
  choice: 向大地
  rationale: אֶרֶץ 可指“大地”或“土地”。上下文列举走兽、飞鸟和海鱼，范围广阔，因此正文采用“大地”，同时以脚注保留“土地”的可能。
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: 它就会教导你
  rationale: ירה 的使役词干在此意为“教导”。“教导”保留拟人意味；现代汉语不以语法阴性指称“大地”，故用“它”。
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: 也会告诉你
  rationale: ספר 的加强词干可表示讲述、述说或宣告；“告诉你”清楚自然，并与前半句“教导你”形成平行。连词译为“也”，使汉语并列关系流畅。
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: 海里的鱼
  rationale: 准确传达“海之鱼”的属格结构，同时采用现代汉语自然说法，保留原文意象。
theological_decisions: []
