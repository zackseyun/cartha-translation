  naturalness: The sentence is clear and suitably sharp in modern Mandarin. Retaining “人民” is somewhat rhetorically marked, but this reflects the marked idiom in the source; the footnote supplies needed clarification without over-explaining the main text.
  terminology: “智慧” and “死去” are direct, natural equivalents for חָכְמָה and תָּמוּת. “与/随你们一同” faithfully conveys the accompaniment expressed by וְעִמָּכֶם.
