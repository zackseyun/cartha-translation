  text: אָ֭מְנָם כִּ֣י אַתֶּם עָ֑ם וְ֝/עִמָּ/כֶ֗ם תָּמ֥וּת חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/002.yaml
  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: zh_hans
  text: 你们无疑就是人民；智慧必与你们一同死去！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: 无疑
  rationale: 两个词在这里共同加强断言语气；“无疑”自然地传达约伯表面认同、实则讥讽的口吻。
- source_word: אַתֶּם
  choice: 你们
  rationale: 第二人称阳性复数代词，直接指向约伯的朋友们。
- source_word: עָם
  choice: 全体人民
  rationale: 直译为“人民”。在“你们就是人民”这一讥讽表达中，补出“全体”可使现代汉语读者明白其含义是：他们仿佛代表了所有人，或独占了人的见识；脚注保留更贴近形式的译法。
- source_word: וְעִמָּכֶם
  choice: 与你们一同
  rationale: 保留介词短语所表达的伴随关系，即他们死去时，智慧也随之消亡。
- source_word: תָּמוּת
  choice: 死去
  rationale: 该动词是מות的Qal未完成式第三人称阴性单数，与阴性名词“智慧”一致；“死去”保留原文鲜明的拟人化说法。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 该词的常规对应，指朋友们似乎自认为独占的智慧。
theological_decisions:
- issue: 本句是否应明说为讽刺
  choice: 正文保留字面断言，让上下文和标点传达反讽；脚注说明通常理解为讽刺。
  alternative: 在正文加入“你们自以为”等解释性措辞。
  rationale: 希伯来文没有明说“自以为”，加入正文会替读者消解原句的修辞张力。
translation_notes:
  register: 采用现代、庄重而有锋芒的汉语。“全体人民”使原文讥讽性的习语在中文中易懂；分号与感叹号呈现两分句的紧密关系和尖锐语气。
