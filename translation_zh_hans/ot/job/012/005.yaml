    issue: “脚步将要滑跌的人”措辞生硬，并过度具体化时态。
    rationale: לְמוֹעֲדֵי רָגֶל指与脚失足/滑倒有关的人，其精确句法虽有争议，却没有必要译出“将要”。“失脚的人”较自然且不减少原文含混性。
  - severity: low
    issue: “安逸的人心里”对“在安逸者的想法中/看来”的汉语表达不够顺畅。
    rationale: לְעַשְׁתּוּת שַׁאֲנָן可自然表达为“在安逸者看来”，既体现“思想/看法”，也避免中文中“人心里藐视”的轻微搭配不畅。
  - severity: low
    issue: 脚注中的替代解释需要标示为解释性理解。
    rationale: “灾祸”不是לַפִּיד的通常直译；它是为说明本节意象关系而提出的解释。明确这一点可维护词汇透明度。
