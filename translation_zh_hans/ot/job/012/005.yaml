  text: לַ/פִּ֣יד בּ֭וּז לְ/עַשְׁתּ֣וּת שַׁאֲנָ֑ן נָ֝כ֗וֹן לְ/מ֣וֹעֲדֵי רָֽגֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/005.yaml
  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: zh_hans
  text: 在安逸者看来，火把受人藐视；却是为失脚的人预备的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文的句法和意象关系不甚明确。“火把”通常是对原文的直译；也可作解释性理解：“安逸的人心里藐视灾祸；灾祸正等候失脚的人。”
    reason: 保留火把的字面意象，同时说明将其理解为“灾祸”的主要解释性替代读法，且避免不自然的“脚步将要滑跌的人”。
lexical_decisions:
- source_word: לַפִּיד
  choice: 火把
  rationale: 该词通常指火把；保留原文的具体意象，不改释为抽象的“灾祸”或“帮助”。
- source_word: בּוּז
  choice: 藐视
  rationale: 反映“轻看、鄙弃”的名词意义；汉语中转化为谓语，使句子自然，同时保留被轻视的语气。
- source_word: לְעַשְׁתּוּת שַׁאֲנָן
  choice: 安逸的人心里
  rationale: עשתות 在此通常理解为“思想、心念”，שאנן 指安稳无忧、安逸的人；此译法避免把安逸本身评价为罪恶。
- source_word: נָכוֹן
  choice: 预备的
  rationale: 可表示“已备妥、就绪”；“预备的”与后面的对象结构衔接自然。
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: 为脚步将要滑跌的人
  rationale: 该短语字面艰涩，涉及“脚”与“失足/滑跌”；这样处理保留临近失足的意味，也保持“火把可供其使用”的常见理解。
theological_decisions:
- issue: “火把”是帮助还是灾祸的象征
  choice: 正文保留“火把”及“预备”意象，不明确判定其象征意义
  alternative: 将其解释为安逸者轻看受苦之人，或解释为灾祸等候失足者
  rationale: 希伯来诗句压缩而含混，原文并未明说火把究竟代表援助、苦难还是受轻视者；不应在正文中消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号对应希伯来诗句两分句的并置；以“却”提示反差，但不额外说明火把的象征意义。
