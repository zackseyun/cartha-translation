revisions:
- from: 安逸的人心里藐视火把；它却是为脚步将要滑跌的人预备的。[a]
  to: 在安逸者看来，火把受人藐视；却是为失脚的人预备的。[a]
  rationale: 修订使中文更自然，并避免把“失脚”的时间意义限定为“将要”。正文仍保留火把与失脚者之间未明言的关系；“却”只体现两行诗的明显张力，不指定火把究竟象征援助或灾祸。
  reviewer_model: gpt-5.6-terra
