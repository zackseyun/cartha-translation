revisions:
- from: 他使祭司一无所有地被带走[a]，又倾覆那些根基稳固的人[b]。
  to: 他带走被掠夺一空的祭司[a]，又倾覆强者[b]。
  rationale: 修订恢复原文中“他带走”的主动句式，以“被掠夺一空”表达祭司遭剥夺的状态；将“强者”置于正文，使汉语更自然，并以脚注保存אֵתָנִים所含的长久、稳固语义。脚注标记均紧随所注译语，且不改变经文的意义或引入特定教义解释。
