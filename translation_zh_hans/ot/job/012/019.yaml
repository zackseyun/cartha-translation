  text: מוֹלִ֣יךְ כֹּהֲנִ֣ים שׁוֹלָ֑ל וְ/אֵֽתָנִ֣ים יְסַלֵּֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/019.yaml
  text: He leads priests away stripped[b][a], and he overthrows the mighty.
translation:
  language: zh_hans
  text: 他带走被掠夺一空的祭司[a]，又倾覆强者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他带走被剥夺了的祭司”，或“他带走像战利品一样的祭司”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“长久稳固的人”或“被认为牢不可动的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: 使……被带走
  rationale: 这是הלך的使役分词，承接上下文中上帝这一隐含主语，表示使人离去；在本节审判与降卑的语境中，“使……被带走”自然表达被押离原位的意味。
- source_word: כֹּהֲנִים
  choice: 祭司
  rationale: 采用该词通常而直接的含义，也保留祭司作为宗教和社会显要人物的身份。
- source_word: שׁוֹלָל
  choice: 一无所有地
  rationale: 该词与掠夺、剥夺有关，在这里描写祭司被夺去财物和尊荣后的状态。“一无所有地”在现代汉语中自然，并避免把较有争议的“赤脚”释义写入正文。
- source_word: אֵתָנִים
  choice: 那些根基稳固的人
  rationale: 该词可指强健、持久或稳固者。结合本段列举社会上看似不可动摇的人物，译为“根基稳固的人”既保留稳固、恒久的词义重点，也符合汉语表达。
- source_word: יְסַלֵּף
  choice: 倾覆
  rationale: 该动词的基本意象是扭曲、使偏离；用于上帝使稳固者败落的语境，“倾覆”自然表达其地位和局面的彻底翻转，同时不过度限定具体方式。
theological_decisions:
- issue: 本节隐含主语的延续
  choice: 以“他”指代上帝
  alternative: 为求独立成句的清楚而明说“上帝”
  rationale: 上下文已经确立上帝为一连串行动的主语。保留代词既忠于希伯来诗歌的衔接，也避免在原文未重复神名处擅自增补。
- issue: אֵתָנִים所强调的社会地位或稳固性质
  choice: 正文译作“那些根基稳固的人”
  alternative: 译作“有权势的人”或“强者”
  rationale: 原词兼有强健、长久、稳固之意。正文保留其“稳固”张力，不把它单纯归结为政治权势；其他可能含义以脚注说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一无所有地被带走”呈现祭司遭剥夺与受辱的处境；“根基稳固的人”有意保留原词在强大、恒久和稳固之间的语义张力。两个脚注标记均紧随相关译语。
