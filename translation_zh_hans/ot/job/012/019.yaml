    rationale: אֵתָנִים确可含稳固、持久之义，但也可指强者、有力者。用“强者”作正文并以脚注保留“长久稳固者”，较自然且不缩窄原词语义。
  revised_text: 他带走被掠夺一空的祭司[a]，又倾覆强者[b]。
