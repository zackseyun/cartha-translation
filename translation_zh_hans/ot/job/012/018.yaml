  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: zh_hans
  text: 他解开君王的束缚[a]，又在他们腰间系上腰带[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“君王的管教”。希伯来语这个名词可指“管教、惩戒”，也可指“捆绑、束缚”；这里与“解开”搭配，并与下半句“系上”相对应，故正文译作“束缚”。
    reason: lexical_alternative
  - marker: b
    text: 这个意象可能表示受辱或被制伏：上帝使君王失去权势，并使他们受约束；但原文也可能描绘获释后束腰以便行动，含义并不完全确定。
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: 束缚
  rationale: 该名词通常可指“管教、惩戒”，在某些语境中也可指具体的“捆绑、束缚”。这里与“解开”搭配，并同下半句的“束”形成对应，因此正文采用具体而不过度限定的“束缚”。
- source_word: פִּתֵּחַ
  choice: 解开
  rationale: 该动词基本义为“打开”，也可表示“松开、解开”；与“束缚”连用时，“解开”既自然又保留了具体意象。
- source_word: מְלָכִים
  choice: 君王
  rationale: 按其通常意义直译为“君王”，不泛化为一般的统治者。
- source_word: וַיֶּאְסֹר
  choice: 束
  rationale: 该动词意为“捆、系、束”。采用“束”可与上半句“解开”构成鲜明反转，同时自然搭配“腰带”。
- source_word: אֵזוֹר
  choice: 腰带
  rationale: 该词指束在腰间的带子或腰布。“腰带”是现代汉语中清楚、中性且不预先解释其象征意义的表达。
- source_word: בְּמָתְנֵיהֶם
  choice: 在他们腰间
  rationale: 该短语指腰部或腰胯处。“在他们腰间”符合现代汉语习惯，也避免使用较古旧的“腰胯”。
theological_decisions:
- issue: 本节反转意象的含义
  choice: 正文保留“解开”与“束”的字面反转，呈现上帝使君王处境发生逆转的主权，却不明确断定腰带必然象征羞辱、被掳或服役。
  alternative: 可理解为上帝释放受捆绑的君王，随后给他们束腰以便行动；也可理解为他解除君王的权势，继而使他们受制。
  rationale: 希伯来文简短且富有隐喻性。两个相反动作构成核心张力，但具体社会图景并不完全明确；直译意象比在正文中选定单一解释更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“解开……又……束……”保留希伯来文上下半句的动作对照；“君王”“腰带”“腰间”均为自然现代表达。脚注交代词义与意象的真实歧义，不在正文中将其神学含义固定化。
