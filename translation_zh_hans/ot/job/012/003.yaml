base_translation:
  language: en
  yaml_path: translation/ot/job/012/003.yaml
  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: zh_hans
  text: 我也有和你们一样的心智[a]；我并不比你们差。这样的事，谁不知道呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心智”原文直译为“心”；在这里，“心”指思考和理解的能力。
    reason: lexical_alternative
  - marker: b
    text: 本句原文是省略性的表达，较直译可作：“谁没有像这样的呢？”按上下文，是说这类道理并非鲜为人知。
    reason: source_ambiguity
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: 我也……有心智
  rationale: לֵבָב 字面为“心”，但在这里指思考和理解的能力；“心智”既保留内在心思的意味，也自然表达约伯所强调的理解力。גַּם 译作“也”，体现他声称自己同样具备这种能力。
- source_word: כְּמוֹכֶם
  choice: 和你们一样
  rationale: 直接表达约伯与对话者之间的比较，符合现代汉语习惯。
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: 我并不比你们低下
  rationale: נפל 与介词 מן 构成比较表达，意思是不低于、不逊于某人；此译保留“低下”的空间隐喻，也清楚传达比较意义。
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: 这样的事，谁不知道呢？
  rationale: 原文是省略性的反问句，按上下文是在说朋友们讲的道理人尽皆知；此译以自然汉语传达其反问和轻蔑其言论并不新奇的语气，同时用脚注说明较直译的形式。
theological_decisions:
- issue: 末句省略性表达的解释
  choice: 译为“这样的事，谁不知道呢？”
  alternative: 较直译为“谁没有类似这样的事呢？”
  rationale: 上下文关乎人人都能掌握的常识，而不是人人都经历或拥有某些事情；采用“知道”能自然呈现语用含义，但脚注保留原文在形式上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心智”避免把希伯来语的“心”误解为单指情感；“并不比你们低下”保留原文的比较力度。末句用简洁反问呈现约伯对朋友言论的回应。
