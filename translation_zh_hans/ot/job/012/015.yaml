  text: הֵ֤ן יַעְצֹ֣ר בַּ/מַּ֣יִם וְ/יִבָ֑שׁוּ וִֽ֝/ישַׁלְּחֵ֗/ם וְ/יַ֖הַפְכוּ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: zh_hans
  text: 看哪，他若拦住众水，水就干涸；他若放出众水，众水就翻覆大地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地”。希伯来语 אֶרֶץ 可按语境指“大地”或“土地”。
    reason: 保留原词范围上的真实歧义。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 用现代读者仍能理解的庄重感叹语，引人注意下文鲜明而有力的陈述。
- source_word: יַעְצֹר בַּמַּיִם
  choice: 拦住众水
  rationale: עצר 在这里表达阻止、约束水流；“拦住”自然清楚，“众水”则保留希伯来语 מַיִם 的诗歌性和宏阔意象。
- source_word: וְיִבָשׁוּ
  choice: 水就干涸
  rationale: 动词为复数，语法上承接前面的“众水”。汉语重复“水”可避免代词指向不明，同时保留水被截住便干涸的表层表达。
- source_word: וִישַׁלְּחֵם
  choice: 他若放出众水
  rationale: 宾语后缀回指“众水”；“放出”既可表达差遣，也能体现解除约束、任水奔流的语境。平行句式中的未完成式按条件关系处理。
- source_word: וְיַהַפְכוּ
  choice: 众水就翻覆
  rationale: הפך 描绘强烈的翻转和倾覆；“翻覆”保留原文的鲜明破坏性意象，不将其窄化为某一次特定洪水。
- source_word: אָרֶץ
  choice: 大地
  rationale: 在论述上帝掌管自然的智慧诗语境中，“大地”自然地体现宏观范围，同时脚注保留“土地”的可能含义。
theological_decisions:
- issue: אָרֶץ 在上帝掌管众水这一智慧诗陈述中的范围
  choice: 大地
  alternative: 土地
  rationale: 上下两句以众水的干涸和奔放呈现宏阔的自然图景，“大地”较符合这一范围；但原词也可指一片土地，因此不排除较局部的理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”和“众水”保留智慧诗的强调与诗意；全句用两个“若……就……”呈现希伯来语平行结构。脚注标记紧随其所说明的“大地”。
