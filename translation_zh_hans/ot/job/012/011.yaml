  yaml_path: translation/ot/job/012/011.yaml
  text: Does not the ear test words[a], as the palate tastes food?
translation:
  language: zh_hans
  text: 耳朵岂不是辨别话语[a]，上膛也照样品尝食物吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耳朵岂不是察验言语，上膛也照样品尝食物吗？”
    reason: 保留 תִּבְחָן 可译为“察验”、מִלִּין 可译为“言语”的词义选择。
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂不是……吗
  rationale: 引出预期肯定回答的反问，既保留疑问语气，也符合现代汉语表达。
- source_word: אֹזֶן
  choice: 耳朵
  rationale: 保留希伯来文以身体器官指听觉与分辨能力的具体意象。
- source_word: מִלִּין
  choice: 话语
  rationale: 此复数名词可指言词、话语；“话语”自然地涵盖所听见并受辨别的内容。
- source_word: תִּבְחָן
  choice: 辨别
  rationale: 该动词表示检验、察验；在耳朵听话的语境中，“辨别”自然，同时保留判断真伪或优劣的含义。
- source_word: חֵךְ
  choice: 上膛
  rationale: 具体指口腔上部、味觉所关联的部位；“上膛”比泛称“嘴”更忠实地保留与“耳朵”平行的身体器官意象。
- source_word: אֹכֶל
  choice: 食物
  rationale: 直接表达可食之物，清楚自然。
- source_word: יִטְעַם
  choice: 品尝
  rationale: 准确表达尝味的动作，并与前半句的辨别功能相呼应。
- source_word: לוֹ
  choice: 不单独译出
  rationale: 此处介词加代词后缀具有与主语相关的习语性用法；在汉语中硬译为“为自己”既生硬又可能造成额外强调，动词“品尝”已自然涵盖该动作由上膛自身实行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。保留“耳朵—上膛”的身体器官平行意象；“上膛”虽不如“嘴”口语化，却更准确对应原文 חֵךְ。正文中的“照样”明确两分句的类比关系。
