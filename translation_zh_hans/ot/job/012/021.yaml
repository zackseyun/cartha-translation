base_translation:
  language: en
  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
translation:
  language: zh_hans
  text: 他将蔑视倾倒在权贵身上，又使强者[b]的腰带[a]松开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使腰带松开”这一意象可能表示使人失去力量、整装待发的状态或权威。
    reason: cultural_note
  - marker: b
    text: “强者”也可译作“勇士”或“有权势的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: 倾倒
  rationale: 保留“倒出、倾倒”的具体意象，并与“蔑视”搭配，表现公开羞辱的强烈意味。
- source_word: בּוּז
  choice: 蔑视
  rationale: 该词表示轻蔑、鄙视；“蔑视”准确而庄重，也能自然承接“倾倒”的诗歌意象。
- source_word: נְדִיבִים
  choice: 权贵
  rationale: 此处与社会地位和权力的逆转有关，所指是身份尊贵、居于领导地位的人；“权贵”在现代汉语中自然，且不把范围限定为王族。
- source_word: מְזִיחַ
  choice: 腰带
  rationale: 该名词传统上指束腰的带子；译为“腰带”既清楚易懂，也保留原文关于力量、整装待发或权威被解除的具体意象。
- source_word: אֲפִיקִים
  choice: 强者
  rationale: 此处指有力量或权势的人。“强者”简洁，并与前半句的“权贵”构成平行；脚注保留“有权势的人”等可能表达。
- source_word: רִפָּה
  choice: 使……松开
  rationale: 该动词有使松弛、放松之意；“使腰带松开”忠实保留原文的动作和隐喻，而不直接解释为“解除武装”或“夺去力量”。
theological_decisions:
- issue: 上帝使人受辱并失去力量的隐喻
  choice: 在正文保留“使强者的腰带松开”的具体意象
  alternative: 解除强者的武装；夺去强者的力量
  rationale: 原文以松开腰带描写权势和能力被解除。保留隐喻可维持诗歌张力，并避免把意义限缩为军事上的解除武装。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半句保留“倾倒蔑视”的希伯来诗歌意象，后半句保留“腰带松开”的含蓄表达，不在正文中将其解释性改写。
