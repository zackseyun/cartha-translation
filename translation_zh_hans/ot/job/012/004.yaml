base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: zh_hans
  text: '我在朋友眼中成了笑柄[a]；

    我呼求上帝，他就应允我[b]；

    我这正直、无可指责的人，竟成了笑柄！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朋友”：希伯来语可直译为“他的朋友”；按上下文，也可理解为“我的朋友”。
    reason: alternative_reading
  - marker: b
    text: “应允我”：希伯来语形式为“应允他”；这里的“他”所指的是约伯本人。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: 笑柄
  rationale: 该名词指人成为受人讥笑、嘲弄的对象；“笑柄”在现代汉语中简洁自然，也保留了两次出现所形成的重复强调。
- source_word: לְרֵעֵהוּ
  choice: 朋友的
  rationale: 希伯来语字面带第三人称单数后缀，可作“他的朋友”；但本节是约伯诉说自己受同伴讥笑。正文用不明示人称归属的“朋友的”，既合乎汉语表达，也避免替原文消除指代张力。
- source_word: אֶהְיֶה
  choice: 我成了
  rationale: 该未完成式在语境中描述约伯当前所处的境况；“成了”兼具现状与落到这种境地的意味。
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: 我呼求上帝
  rationale: 分词在这里描述约伯这个呼求上帝的人；汉语用第一人称分句最自然，并与前文的“我”衔接。
- source_word: וַיַּעֲנֵהוּ
  choice: 他就应允我
  rationale: 动词的主语自然理解为上帝，宾语形式虽为“他”，其语境所指却是说话者约伯；正文按汉语直接引语习惯译为“我”，并在脚注保留形态信息。
- source_word: צַדִּיק
  choice: 公义
  rationale: 这是智慧文学中表示合乎正义、为人正直的常用道德用语；“公义”保留其庄重和神学分量。
- source_word: תָּמִים
  choice: 纯全
  rationale: 该词强调完整、正直和无可指责的品格，并非宣称绝对无罪；“纯全”也呼应《约伯记》对约伯品格的描述。
theological_decisions:
- issue: 约伯称自己为צַדִּיק תָּמִים是否意味着绝对无罪
  choice: 译作“公义、纯全”，表达正直完整的品格
  alternative: 译作“完全无罪”或“完美”
  rationale: תָּמִים在智慧文学中主要指品格完整、无可指责。正文保留约伯自称公义的张力，却不把它扩大为绝对无罪的教义断言。
- issue: 末句“公义、纯全”与“笑柄”的句法关系
  choice: 理解为对约伯的同位说明：“我这公义、纯全的人，竟成了笑柄”
  alternative: 理解为“在公义纯全的人看来是笑柄”
  rationale: 末句没有表示“对……而言”的介词，צַדִּיק תָּמִים最自然地说明成为笑柄之人的身份；结合全节第一人称语境，用同位结构清楚呈现，同时不削弱其讽刺张力。
translation_notes:
  register: 采用现代、庄重而可朗读的汉语。三行重复“笑柄”，保留原文首尾呼应；末行用“竟”传达约伯对公义纯全者反遭讥笑的强烈反差。正文所有脚注标记均已对应列出。
