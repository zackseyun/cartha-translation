  text: עִ֭מּ/וֹ חָכְמָ֣ה וּ/גְבוּרָ֑ה ל֝֗/וֹ עֵצָ֥ה וּ/תְבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: zh_hans
  text: 智慧和能力与他同在[a]；谋略和悟性也属于他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧和能力在他那里；谋略和悟性属于他。”
    reason: עִמּוֹ字面为“与他同在”，在此诗歌语境中也表达这些特质归于他、在他那里；后半句的לוֹ likewise 表示归属。
lexical_decisions:
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: עִם加第三人称单数后缀，基本义是“与他同在、在他那里”，在本诗句中兼有相伴与拥有的意味；此译保留希伯来语的表达方式，也不把含义收窄为单纯的“他有”。
- source_word: חָכְמָה
  choice: 智慧
  rationale: חָכְמָה通常指智慧、明智的洞察；“智慧”是现代汉语中准确而庄重的对应词。
- source_word: וּגְבוּרָה
  choice: 和能力
  rationale: גְבוּרָה可指力量、能力或大能。此处与“智慧”并列，“能力”自然地表达实行其旨意的力量，同时避免过度具体化为体力。
- source_word: לוֹ
  choice: 都属于他
  rationale: לְ加代词后缀在无动词句中表示归属。“属于他”明确传达所有关系；“都”使两个并列名词在汉语中衔接自然。
- source_word: עֵצָה
  choice: 谋略
  rationale: עֵצָה在此指筹划、定策的智慧。“谋略”比日常的“建议”更符合上帝施行计划的语境和诗体语域。
- source_word: וּתְבוּנָה
  choice: 和聪明
  rationale: תְבוּנָה指理解力、洞察力或明辨。“聪明”与“谋略”构成简洁的诗性并列，并采用《约伯记》智慧语汇中普通读者易懂的表达。
theological_decisions:
- issue: 两个代词后缀所指的对象
  choice: 正文保留“他”，由上下文表明所指是上帝。
  alternative: 直接译为“上帝”，明确说出指称对象。
  rationale: 上下文清楚谈论上帝的智慧和权能，但希伯来文此节使用代词。保留“他”既忠于原文的衔接方式，也避免在正文中增添原文没有明说的名词。
- issue: עִמּוֹ所表达的是相伴还是内在拥有
  choice: 译作“与他同在”，保留相伴、在其所有之中的诗性表达。
  alternative: 译作“他有”或“在他里面”。
  rationale: 原介词最直接表示“与、同”，在此语境又隐含拥有。正文不将其改写成专门的神学命题；脚注提供自然的所有式译法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留原文两个平行分句及“智慧／能力、谋略／聪明”的四项排列。分号呈现希伯来诗歌的对应关系；不直接补出“上帝”，让上下文确定代词所指。
