base_translation:
  language: en
  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: zh_hans
  text: 他带走被剥夺的谋士，使审判官变得愚昧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: 使……被掳而去
  rationale: 该词是הלך的使役分词，在诗句中以动词性用法描写上帝使人离去；结合后面的שׁוֹלָל，译为“使……被掳而去”自然表达被带走的动作与败亡处境。
- source_word: יוֹעֲצִים
  choice: 谋士
  rationale: 指提供计谋或辅佐意见的人；“谋士”简洁庄重，也符合本节所描写的政治及社会领袖语境。
- source_word: שׁוֹלָל
  choice: 被掳
  rationale: 该词与掠夺、剥夺及作为战利品带走有关；正文采用“被掳”表达受辱、失去自主而被带走，同时以脚注保留“被剥夺一切”等词义可能。
- source_word: שֹׁפְטִים
  choice: 审判官
  rationale: 该词通常指执行审判的人，也可能兼具治理职能；“审判官”较直接地保留其司法意义，并与“谋士”构成社会领袖的平行。
- source_word: יְהוֹלֵל
  choice: 使……变得愚昧
  rationale: 该词是הלל（II）的加强词干未完成式，具有使人愚妄、失去理智的使役含义；此译法清楚保留使役关系，而不把意义强化为精神失常。
theological_decisions:
- issue: 本节未明说的主语
  choice: 以“他”指上帝
  alternative: 不补出主语，或重复“上帝”
  rationale: 上下文持续以上帝为这些行动的施行者。现代汉语完整句子需要明示主语；采用“他”承接语境，不额外增加神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留希伯来诗歌的平行结构；“谋士”与“审判官”相对应。正文不把שׁוֹלָל过度具体化为“赤脚”，脚注则保留其遭剥夺、成为掠物的语义张力。
