  naturalness: “使谋士被掳而去”在现代汉语中略显生硬，且“使……被……”的双重使役被动结构不够利落。改为“带走……谋士”更自然，并保留诗歌的简洁平行。
  terminology: “谋士”“审判官”“愚昧”均合乎庄重的现代书面语，也能对应原文的社会领袖与使其愚妄的含义。
