base_translation:
  language: en
  yaml_path: translation/ot/job/012/020.yaml
  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
translation:
  language: zh_hans
  text: 他使受信赖的人失去言语[a]，又夺去长老们的判断力[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“除去受信赖之人的嘴唇”；也可译“使忠信的人失去言语”，意思是使他们不能说话或失去口才。
    reason: lexical_alternative
  - marker: b
    text: “判断力”也可译作“明辨力”或“理解力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: 使……失去
  rationale: 该词在这里是使役意义，表示使某人丧失原有之物；与后半句“夺去”构成自然的平行表达。
- source_word: שָׂפָה
  choice: 言语
  rationale: 字面义为“嘴唇”，此处借指说话的能力或有分量的言辞。“言语”既传达转喻义，也不过度限定为口才。
- source_word: לְנֶאֱמָנִים
  choice: 受信赖的人
  rationale: נֶאֱמָנִים可指忠信、可靠或受人信赖者；“受信赖的人”保留其可能带有的社会评价意味。
- source_word: טַעַם
  choice: 判断力
  rationale: 该词本义与“品尝、滋味”有关，在此比喻判断、明辨或理解的能力；“判断力”符合智慧文学语境。
- source_word: זְקֵנִים
  choice: 长老们
  rationale: 该词既可指年长者，也可指具有经验和社会地位的长老；此译法保留年龄与身份两方面的可能含义。
- source_word: יִקָּח
  choice: 夺去
  rationale: לקח通常意为“拿、取”；在与前半句平行的剥夺语境中，“夺去”准确表达其实际含义。
theological_decisions: []
