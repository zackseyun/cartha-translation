  text: הֵ֣ן יַ֭הֲרוֹס וְ/לֹ֣א יִבָּנֶ֑ה יִסְגֹּ֥ר עַל אִ֝֗ישׁ וְ/לֹ֣א יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: zh_hans
  text: 看哪[a]，他若拆毁，就不能重建；他若把人关住[b]，就不能被打开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“的确”或“注意”。
    reason: lexical_alternative
  - marker: b
    text: “把人关住”也可译作“把人禁闭起来”或“把人拘禁起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 该词用于引起注意并加强断言。“看哪”保留其提示和强调作用，也符合庄重的现代汉语表达。
- source_word: יַהֲרוֹס
  choice: 拆毁
  rationale: הרס常指拆除、毁坏建筑物；“拆毁”与下文“重建”形成清楚的建筑意象对应。
- source_word: וְלֹא יִבָּנֶה
  choice: 就不能重建
  rationale: בנה的尼法勒式表达被动意义，即“被建造、被重建”。上下文强调其行动造成无法逆转的结果，因此译为“不能重建”。
- source_word: יִסְגֹּר עַל אִישׁ
  choice: 他若把人关住
  rationale: סגר与עַל אִישׁ连用，表示把一个人关闭、拘禁或限制起来。“把人关住”保留具体的关闭意象，又不把含义过度限定为正式监禁。
- source_word: וְלֹא יִפָּתֵחַ
  choice: 就不能打开
  rationale: פתח的尼法勒式为被动，意为“被打开”。汉语省略其隐含主语较自然，也保留原文没有明确说明究竟打开什么的表达。
theological_decisions:
- issue: 神圣主语的指称
  choice: 他
  alternative: 上帝／耶和华
  rationale: 本节希伯来文只用第三人称单数动词，没有明说神的名称。译作“他”既承接上下文所指的上帝，又不在本节加入原文没有的称号。
- issue: 关闭之后无法打开的对象
  choice: 保留隐含，不明说对象
  alternative: 无人能释放他／门不能打开
  rationale: 原文使用被动式“不能被打开”，没有明确宾语或具体对象。正文采用汉语可自然接受的省略，以保留这一含混性，避免把意象限定为释放人或开门。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“拆毁／重建”和“关住／打开”保留原文两组平行意象；两个“若……就……”清楚呈现条件与结果关系。
