base_translation:
  language: en
  yaml_path: translation/ot/job/014/004.yaml
  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: zh_hans
  text: 谁能使洁净之物出于不洁之物呢？一个也没有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁能从不洁之物中产生洁净之物？没有一个。”
    reason: 词汇与句式的另一种译法，保留יִתֵּן“产生”的语义及לֹא אֶחָד较直译的形式。
lexical_decisions:
- source_word: מִי
  choice: 谁能
  rationale: 疑问代词引出反问；结合יִתֵּן及上下文，用“谁能”自然表达所暗含的能力与可能性问题。
- source_word: יִתֵּן
  choice: 使……出于
  rationale: נתן本义为“给、使”，此处表示产生或带出；“使……出于……”既贴近希伯来语结构，也符合现代汉语表达。
- source_word: טָהוֹר
  choice: 洁净之物
  rationale: 形容词作名词使用。“洁净之物”保留其实体化用法，并避免限定为礼仪、道德或其他某一种洁净。
- source_word: מִטָּמֵא
  choice: 出于不洁之物
  rationale: מִן表示来源，טָמֵא在此很可能作名词使用；译文保留“洁净／不洁”的鲜明对照及原文的概括性。
- source_word: לֹא אֶחָד
  choice: 一个也没有
  rationale: 直译接近“不是一个”，作为对反问的绝对否定；“一个也没有”在现代汉语中自然，并保留原文对“一个”的强调。
theological_decisions:
- issue: 洁净与不洁所指的范围
  choice: 保留为概括性的洁净／不洁陈述，由上下文将其应用于人的处境。
  alternative: 特指不洁父母所生的后代，或专指道德或礼仪层面的不洁。
  rationale: 本节措辞简短而近似格言，原文本身没有明确限定不洁的类别；译文不加入“罪性”“父母”等解释，以保留其真实的含混性和神学张力。
- issue: 末句所否定的对象
  choice: 译为“一个也没有”，理解为无人能够做到。
  alternative: 将לֹא אֶחָד理解为修饰前句之事物，即“没有一个洁净之物”。
  rationale: 在反问之后把它作为简短答语最合乎句法和语境，但脚注保留更贴近原文断句与措辞的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“洁净／不洁”保留经文的纯洁性术语和概括性；反问句后用简短答语，重现希伯来文的力度。
