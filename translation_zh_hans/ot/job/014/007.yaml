base_translation:
  language: en
  yaml_path: translation/ot/job/014/007.yaml
  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: zh_hans
  text: 因为树木还有指望：若被砍倒，还会再发芽[a]，它的嫩芽[b]也不会断绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“还会自我更新”。希伯来语动词可表示更新；在树木的语境中，正文具体译作“再发芽”。
    reason: lexical_alternative
  - marker: b
    text: 或译“新芽”或“幼枝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，引出约伯对人生短暂无望的解释与对比，保留原文的因果、说明语气。
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: 树木还有指望
  rationale: יֵשׁ为存在句，לָעֵץ表示“对树木而言”，תִּקְוָה意为“指望、希望”；“还有指望”既自然，也与后文重新生长的可能性相合。
- source_word: אִם יִכָּרֵת
  choice: 若被砍倒
  rationale: אִם保留条件义“若”，יִכָּרֵת为尼法勒式，表示树被砍下或砍倒；不把条件语气改成让步语气。
- source_word: וְעוֹד יַחֲלִיף
  choice: 仍会重新发芽
  rationale: עוֹד表达继续或再次发生；חלף在树木语境中指更新、再度长出，以“重新发芽”具体呈现植物复生的意象，同时用脚注保留较抽象的“更新”义。
- source_word: וְיֹנַקְתּוֹ
  choice: 它的嫩枝
  rationale: יֹנֶקֶת指新生、幼嫩的枝条或萌芽；“嫩枝”简洁自然，并保留其鲜嫩生长的诗歌形象。
- source_word: לֹא תֶחְדָּל
  choice: 也不会止息
  rationale: חדל表示停止、断绝；“不会止息”保留诗体庄重感，并表达新枝生长不会停止或消失。
theological_decisions:
- issue: 树木再生意象是否直接解释为人的复活
  choice: 只译出树木被砍后重新生长的字面意象
  alternative: 把“重新发芽”阐释为人死后的复活
  rationale: 本节原文明确谈论树木，并在上下文中与人的处境形成张力；译文不提前消解这种张力，也不加入原文未明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话诗体。“若……仍……”保留希伯来文的条件结构；“指望”“止息”略带诗意，但在现代汉语中仍清楚自然。脚注标记均紧随所说明的词语。
