base_translation:
  language: en
  yaml_path: translation/ot/job/014/016.yaml
  text: For now you count my steps[b][a]; you do not keep watch over my sin.
translation:
  language: zh_hans
  text: 因为如今你数算我的脚步[a]；你不察看我的罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “数算”或译“数点”。
    reason: lexical_alternative
  - marker: b
    text: “察看我的罪”也可译作“留意我的罪”或“伺察我的罪”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 按上下文保留解释性的连接作用；现代汉语中“因为”自然清楚，也不过度加强语气。
- source_word: עַתָּה
  choice: 如今
  rationale: 表示约伯当前的处境，并与他所盼望的另一种情形形成对照；“如今”较庄重而仍属现代用语。
- source_word: צְעָדַי
  choice: 我的脚步
  rationale: 直接保留“步伐、脚步”的具体意象，指约伯的一举一动。
- source_word: תִּסְפּוֹר
  choice: 数算
  rationale: ספר的基本义是“数、计算”；“数算”保留逐一计算的意象，也符合庄重的经文语体。
- source_word: לֹא
  choice: 不
  rationale: 直接表达希伯来文否定词的作用；与前句形成转折时以“却不”自然衔接。
- source_word: תִשְׁמוֹר עַל
  choice: 察看
  rationale: שׁמר与עַל连用可表示留意、监视或看守；“察看”保留密切关注罪的含义，同时不把语义限定为保护性的“看守”。
- source_word: חַטָּאתִי
  choice: 我的罪
  rationale: 此处指罪而非赎罪祭；保留原文单数，可理解为集合性或抽象用法。
theological_decisions:
- issue: 否定句לֹא תִשְׁמוֹר עַל חַטָּאתִי在上下文中的语气与含义
  choice: 译为当前陈述：“却不察看我的罪。”
  alternative: “你就不会察看我的罪”或“你不伺察我的罪”
  rationale: 原文是否定词加未完成式，单看本句最自然地表达当前陈述。上下文虽与邻近经文形成张力，但不宜把本句擅自改成假设语气；“察看”也避免将其唯一确定为寻找罪证的“伺察”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“数算我的脚步”保留原文具体意象；以“却”显明两分句之间出人意料的对照，但不改变否定句的直陈语气。所有脚注标记均置于相关词句之后。
