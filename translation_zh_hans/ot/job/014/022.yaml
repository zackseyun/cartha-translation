  yaml_path: translation/ot/job/014/022.yaml
  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: zh_hans
  text: 只是，他的肉身疼痛[a]；他的心灵悲哀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处直译近于“他的肉身在他身上疼痛”。“在他身上”是紧凑的希伯来语表达，也可按上下文理解为“关乎他”或“为他自己”。句首“只是”也可译为“诚然”“唯独”或“然而”。
    reason: lexical_alternative
  - marker: b
    text: “心灵”所译的希伯来词也可指“生命”“自己”或“魂”。原文同样带有“在他身上／关乎他”的表达。
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: 只是
  rationale: 该词在这里可表限制或强调；“只是”既承接上文，也保留“唯独、不过”的限制意味，不把它确定为单纯的“诚然”。
- source_word: בְּשָׂרוֹ
  choice: 他的肉身
  rationale: בָּשָׂר本义为“肉、肉身”。“肉身”保留具体的身体意象，同时比“他的肉”更符合现代汉语诗体表达。
- source_word: עָלָיו
  choice: 自己的
  rationale: 两次出现的עָלָיו结构紧凑，可理解为“在他身上”“为他自己”或“关乎他”。正文用反身性的“自己”自然表达其所指，同时以脚注保留较直译的可能。
- source_word: יִכְאָב
  choice: 疼痛
  rationale: כאב表示遭受或感到疼痛；这里以“肉身”为主语，“疼痛”简洁地保留原文拟人而具体的表达。
- source_word: נַפְשׁוֹ
  choice: 他的生命
  rationale: נֶפֶשׁ可指生命、自己、内在的人或魂。此处选“生命”，避免把诗句过早解释成特定的身心二分观，同时保留与“肉身”的张力。
- source_word: תֶּאֱבָל
  choice: 悲哀
  rationale: אבל表示哀悼、悲伤；“悲哀”与前半句“疼痛”形成简洁而庄重的诗性对应。
theological_decisions:
- issue: נֶפֶשׁ与“肉身”并列时的人论含义
  choice: 译作“生命”，并在脚注列出“心灵、自己、魂”等可能。
  alternative: 译作“魂”或“心灵”，形成更明确的身体与内在主体之对照。
  rationale: 原文的נֶפֶשׁ语义范围宽广，本节并未明说一套灵魂与身体分离的教义；“生命”较少预断，并由脚注保留其他合理理解。
- issue: 两次עָלָיו所表达的关系
  choice: 以“自己的”呈现反身、切身的关系。
  alternative: 较直译为“在他身上”，或理解为“为自己／因自己”。
  rationale: 希伯来语重复同一介词短语，却具有紧凑的诗性和一定歧义。正文采用自然汉语，但不以“在里面”等说法把它固定为空间性的内在关系。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，以“肉身疼痛／生命悲哀”保留两行诗的平行结构。正文避免生硬照搬“在他身上”，脚注则说明原文结构及其歧义。
