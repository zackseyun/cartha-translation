  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
translation:
  language: zh_hans
  text: 他如花般出现，又凋谢[a]；又如影子飞逝，不能久留。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被割下”。这里的希伯来语动词可指凋谢、枯萎，也可指被割下；花的意象容许这两种理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: 如花
  rationale: צִיץ指花朵或花蕾；“如花”自然简洁，并保留诗歌中人生脆弱短暂的比喻。
- source_word: יָצָא
  choice: 开放
  rationale: יָצָא本义为“出来”；用于花的意象时，汉语以“开放”表达花显露、出现于世的动态，也与上节所说人的出生自然衔接。
- source_word: וַיִּמָּל
  choice: 随即凋谢
  rationale: 此处动词可能表示枯萎、凋谢，也可能表示被割下。正文按花的意象译作“凋谢”，“随即”体现连续叙述所呈现的短暂感；另一词义保留于脚注。
- source_word: וַיִּבְרַח
  choice: 飞逝
  rationale: ברח通常意为“逃跑、逃离”。影子在汉语中不自然地说“逃跑”，故译为“飞逝”，保留迅速消失、无法挽留的动态。
- source_word: כַּצֵּל
  choice: 如影子
  rationale: 直译为“像影子”，保留原文关于虚幻与短暂的明喻。
- source_word: וְלֹא יַעֲמוֹד
  choice: 不能久留
  rationale: עמד本义为“站立”，此处表示持续、停留。“不能久留”用自然现代汉语传达人无法长存的意思，同时呼应影子飞逝的图像。
