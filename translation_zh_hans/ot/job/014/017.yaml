  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: zh_hans
  text: 我的过犯被封在囊中；你又把我的罪孽封盖起来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “封盖起来”所译的希伯来语动词含义不确定，也可理解为“涂抹在……上”“缝合”或“贴附在……上”。确切意象仍有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: 被封存
  rationale: 该词是 חתם 的被动分词，表达封闭并加以保管的结果状态。“被封存”既保留被动含义，也符合过犯被收存在袋中的意象。
- source_word: בִּצְרוֹר
  choice: 在袋中
  rationale: צְרוֹר 可指包裹、囊袋或小袋；“袋”是自然的现代汉语，也保留了具体的收存意象。
- source_word: פִּשְׁעִי
  choice: 我的过犯
  rationale: פֶּשַׁע 可表示过犯或悖逆。“过犯”庄重而通顺，并避免在此诗歌语境中把公开反叛的意味定得过强。
- source_word: וַתִּטְפֹּל
  choice: 你又……封盖起来
  rationale: טפל 在此处词义困难，可能指涂抹、贴附、缝合或加盖。结合前半句“封存”的意象，“封盖起来”自然地表达在罪孽之上另加覆盖或封闭，同时不把它误解为赦免。
- source_word: עַל
  choice: 把……封盖起来
  rationale: עַל 与 טפל 连用时可表达把某物加在另一物之上；汉语通过“封盖”这一及物结构自然体现其关系，不机械译出“在……上”。
- source_word: עֲוֺנִי
  choice: 我的罪孽
  rationale: עָוֹן 可指罪孽、罪责或罪的后果。“罪孽”保留其道德分量，也与前半句的“过犯”形成适度区分。
theological_decisions:
- issue: 本节意象所表达的是记罪还是赦罪
  choice: 译为上帝将约伯的过犯收存并封盖起来，意指严密保存、留待追究，而非除去或赦免。
  alternative: 把遮盖罪孽理解为隐藏或除去罪，因而暗示赦免。
  rationale: 约伯哀诉的上下文，尤其前一节，强调上帝监察并记录他的罪；因此此处更可能是负面的保存、封严意象。译文避免加入即时语境并不支持的赦罪含义。
- issue: טפל 的具体动作意象
  choice: 正文采用较宽泛的“封盖起来”，脚注保留“涂抹、缝合、贴附”等可能。
  alternative: 在正文中明确译作“涂抹”“缝合”或“贴附”。
  rationale: 希伯来动词在本处罕见且有争议；不宜把某一具体动作确定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“被封存在袋中”保留希伯来诗句的具体意象；“你又把我的罪孽封盖起来”与前半句衔接自然，同时借脚注诚实呈现原文动词的歧义。
