  text: אַף עַל זֶ֭ה פָּקַ֣חְתָּ עֵינֶ֑/ךָ וְ/אֹ֘תִ֤/י תָבִ֖יא בְ/מִשְׁפָּ֣ט עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: zh_hans
  text: 这样的人，你竟也睁眼察看；还要使我同你进入审判吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同你进入审判”也可理解为“在你面前受审”，或“与你对簿”。希伯来语直译为“与你”。
    reason: alternative_reading
lexical_decisions:
- source_word: אַף עַל זֶה
  choice: 这样的人，你竟也
  rationale: אַף在这里带有强调和出人意料的语气；עַל זֶה字面为“在这个之上”，结合上文所说短暂、衰残的人，指“这样的人”。“竟也”自然传达约伯质问中的惊讶和抗议。
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: 睁眼察看
  rationale: 保留“睁开眼睛”的具体意象，同时以“察看”表达此处把目光投向某人、加以审视的语境含义。
- source_word: וְאֹתִי תָבִיא
  choice: 还把我带来
  rationale: תָבִיא是בוא的使役式，核心意义为“带来”；前置的宾语“我”带有强调，中文用“把我”自然呈现这一焦点。
- source_word: בְמִשְׁפָּט
  choice: 受审
  rationale: מִשְׁפָּט在这里指司法审理或判决过程。“受审”符合中文法律语境，又不限定为现代法庭。
- source_word: עִמָּךְ
  choice: 与你一同
  rationale: עִם通常意为“与、同”。译作“与你一同”保留原文表面意义及其张力，不直接判定是“在你面前”受审还是“与你对簿”。
theological_decisions:
- issue: 约伯对上帝说“עִמָּךְ”所表达的审判关系
  choice: 与你一同受审
  alternative: 在你面前受审；与你对簿
  rationale: 原文介词最直接的意义是“与你同在／与你一起”。司法语境可能表示在上帝面前受审，也可能带有与上帝争讼的意味。正文保留这种张力，脚注说明可能含义，不替原文作神学定论。
- issue: 本节是否按反问表达
  choice: 以“吗”呈现反问
  alternative: 作为陈述句：“你竟也……还把我……”
  rationale: 希伯来文本没有显式疑问词，但在约伯连续抗辩的诗歌语境中，这句话自然具有反问力量；现代汉语需要句末语气词才能清楚传达这一功能，同时不改变命题内容。
translation_notes:
  register: 采用现代、庄重而可诵读的汉语。“睁眼察看”兼顾希伯来语意象与中文可懂度；“这样的人”承接上文对脆弱世人的描述；以反问句式呈现约伯抗辩的诗歌语气。脚注标记置于涉及歧义的“与你一同受审”之后。
