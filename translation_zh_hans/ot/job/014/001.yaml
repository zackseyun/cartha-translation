base_translation:
  language: en
  yaml_path: translation/ot/job/014/001.yaml
  text: Man[a], born of woman[b], is short of days and full of turmoil.
translation:
  language: zh_hans
  text: 人[a]由女人所生，年日短少，满有烦扰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”是泛指的单数，指普遍的人类处境。
    reason: lexical_alternative
  - marker: b
    text: “烦扰”也可译作“患难”“动荡”或“不安”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: 人
  rationale: 这里是泛指的单数，代表普遍的人类处境；“人”在现代汉语中自然、简洁，也保留了代表性单数。
- source_word: יְלוּד אִשָּׁה
  choice: 由妇人所生
  rationale: 保留希伯来文具体的出生表达，并在庄重而自然的汉语中突显人的有限与必死性。
- source_word: קְצַר יָמִים
  choice: 日子短少
  rationale: 贴近原文“日子少”的意象，比单纯译作“短命”更能保存诗歌措辞。
- source_word: וּשְׂבַע רֹגֶז
  choice: 饱经患难
  rationale: שְׂבַע含有“饱足、充满”之意，רֹגֶז可指困苦、骚动或不安；“饱经患难”自然表达一生充满困扰与苦难，但相关语义幅度在脚注中保留。
theological_decisions:
- issue: 泛指的 אָדָם 如何译出
  choice: 人
  alternative: 世人；人类；一个人
  rationale: 本句陈述普遍的人类处境，同时采用代表性单数。“人”既不把它抽象化为集合名词，也不额外限定性别。
- issue: רֹגֶז 的语义范围
  choice: 患难
  alternative: 烦扰；动荡不安
  rationale: 上下文侧重人生短促而困苦；不过原词也可涵盖内心不安和动荡，因此不把这种张力完全消解，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“日子短少”保存原文意象；“由妇人所生”略带经文语体，但仍符合现代读者习惯。
