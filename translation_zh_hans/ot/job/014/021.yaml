base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: zh_hans
  text: 他的儿子得了尊荣[a]，他也不知道；他们变得卑微，他也不察觉他们的景况。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的儿子尊贵起来。”
    reason: יִכְבְּדוּ 可强调获得尊荣，也可强调进入尊贵、显要的状态。
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: 得了尊荣
  rationale: כבד 的 Qal 形式以“他的儿子”为主语，在此表示变得尊贵、获得尊荣。“得了尊荣”自然表达结果意味，同时不把它误解为儿子前来尊敬父亲。
- source_word: בָנָיו
  choice: 他的儿子
  rationale: 原文是阳性复数名词，带第三人称阳性单数所属后缀，直译为“他的儿子”。
- source_word: וְלֹא יֵדָע
  choice: 他也不知道
  rationale: ידע 的基本义为“知道”；中文无须另加宾语，前述儿子得尊荣之事自然构成其内容。
- source_word: וְיִצְעֲרוּ
  choice: 他们变得卑微
  rationale: צער 在这里与前句的尊荣相对，表示变得低微、微小或不显要；“变得卑微”保留这种状态变化及鲜明对照。
- source_word: וְלֹא יָבִין
  choice: 他也不察觉
  rationale: בין 可指理解、辨明或察觉；语境强调死者无法感知儿子境况的改变，因此译作“不察觉”。
- source_word: לָמוֹ
  choice: 他们的景况
  rationale: 该代词形式回指“他的儿子”，表达“关于他们、就他们而言”。译为“他们的景况”使现代中文关系清楚，又不限定具体是哪一种遭遇。
theological_decisions:
- issue: 死者是否知道在世儿子的境况
  choice: 按本节诗歌语境直陈“他也不知道……也不察觉”
  alternative: 将其解释为关于死者意识状态的一般教义命题
  rationale: 本节处于约伯论述人生短暂和死亡隔绝的诗歌语境中；译文保留原句张力，不把它扩展成超出本节措辞的系统神学结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个分句保持原文的平行对照：“得了尊荣／变得卑微”与“不知道／不察觉”。
