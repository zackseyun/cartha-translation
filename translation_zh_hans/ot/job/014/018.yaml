  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
translation:
  language: zh_hans
  text: 然而，山崩塌，便会衰残[a]；磐石也会从原处挪移[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“枯萎”。这个动词通常用于植物的枯萎、凋残，此处比喻山的衰败。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被移出原处”或“移了位”。原文没有说明是谁使磐石移动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: 然而
  rationale: 表达强烈的转折和强调，承接上文，并引出看似恒久之物也会消逝的图景。
- source_word: הַר נוֹפֵל
  choice: 山崩塌了
  rationale: 将分词 נוֹפֵל 理解为描述山倒塌、坠落的情形；现代汉语用“崩塌”最自然，也保留鲜明意象。
- source_word: יִבּוֹל
  choice: 衰残
  rationale: 该动词通常指植物枯萎、衰败，此处比喻山体逐渐损毁；“衰残”既保留其常见语义色彩，又适合诗歌语体，未将过程过度具体化为粉碎或风化。
- source_word: וְצוּר
  choice: 磐石
  rationale: צוּר 可指岩石、峭壁或岩壁；“磐石”与“山”构成自然的诗歌对句，并突显其看似稳固。
- source_word: יֶעְתַּק
  choice: 挪离
  rationale: 表达被移走、离开原位或发生位移的意思；希伯来语未明说施事者，汉语也不补出。
- source_word: מִמְּקֹמוֹ
  choice: 原处
  rationale: 自然、简洁地表达“从它的位置”，保留固定之物离位的意象。
