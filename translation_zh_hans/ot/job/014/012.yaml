base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: zh_hans
  text: 人躺下，不再起来；直到诸天不复存在[a]，他们不会醒来，也不会从睡眠中被唤醒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到诸天不复存在”也可译作“直到诸天消逝”。这是表示极其久远、实际上难以企及之终点的诗性说法。
    reason: lexical_alternative
  - marker: b
    text: 本节以睡眠描写死亡：“醒来”和“从睡眠中被唤醒”延续了“躺下”的意象。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: 人
  rationale: אִישׁ为阳性单数“人、男人”，在此代表必死的人类。现代汉语用“人”既自然，又不抹去其代表性单数用法；句首的וְ按上下文体现为承接关系，不机械译作“和”。
- source_word: שָׁכַב
  choice: 一躺下
  rationale: שׁכב本义为“躺下”，此处委婉指死亡。保留“躺下”的意象，不在正文中直接释为“死去”；“一……就……”自然表达诗句所述的一般情形。
- source_word: וְלֹא יָקוּם
  choice: 就不再起来
  rationale: קום意为“起来、站起”。“不再起来”保持原文死亡与睡眠的隐喻，也保留可能引发的复起张力，而不将其明确解释为对复活的系统性论断。
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: 直到诸天不复存在
  rationale: 该短语近乎直译为“直到没有诸天”，表示一个实际上遥不可及的宇宙性终点。“诸天不复存在”在现代汉语中自然，并保留שָׁמַיִם的复数/集合性表达及夸张力度。
- source_word: לֹא יָקִיצוּ
  choice: 他们也不会醒来
  rationale: יקיץ意为“醒来”。希伯来文在前面的单数“人”之后转用复数动词，泛指死者；译作“他们”保留这一数的转换及睡眠隐喻。
- source_word: וְלֹא יֵעֹרוּ
  choice: 也不会……被唤醒
  rationale: עור的此形态表达被唤起、被叫醒。“被唤醒”保留被动含义，并与前面的“醒来”形成诗意复沓。
- source_word: מִשְּׁנָתָם
  choice: 从沉睡中
  rationale: שֵׁנָה意为“睡眠”，在此延续以睡眠喻死亡的意象。“沉睡”符合庄重诗体，也自然表达死亡般的长眠。
theological_decisions:
- issue: 是否把死亡隐喻明确解释为灵魂消灭或否认复活
  choice: 保留“躺下、起来、醒来、被唤醒”的原有意象
  alternative: 直译意旨为“人死后不再活过来”，或加入明确的末日复活解释
  rationale: 本节呈现约伯在苦难言说中的诗性视角。原文没有在此建立完整的末世论，因此译文不把张力化约为灵魂消灭论，也不擅自加入复活教义。
- issue: אִישׁ的性别与代表性用法
  choice: 译作“人”
  alternative: 译作“男人”或“世人”
  rationale: 此处阳性单数אִישׁ代表一般的人。“男人”在现代汉语中容易被误解为仅限男性；“世人”又会提前复数化。用“人”最准确地保留其单数代表性。
- issue: 单数主语转为复数动词
  choice: 先用“人”，随后用“他们”
  alternative: 全句统一为单数“他”，或统一为复数“人们”
  rationale: 希伯来文确有由代表性单数转向复数的变化。译文保留这一转换，不为表面整齐而消除原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“一躺下，就不再起来”流畅表达一般性陈述；分号保留前后两组意象的推进。正文保留希伯来文从单数代表性“人”转为复数“他们”的变化。
