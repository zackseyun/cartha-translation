base_translation:
  language: en
  yaml_path: translation/ot/job/014/008.yaml
  text: Though its root grows old in the earth[a], and its stump dies in the dust[b],
translation:
  language: zh_hans
  text: 即使树根在地里衰老[a]，树桩在尘土中死去[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果树根在地里衰老。”希伯来语此词可以表示条件，但在这里的树木比喻中，很可能带有让步意味。
    reason: alternative_reading
  - marker: b
    text: “树桩”也可译作“根株”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 即使
  rationale: 该词通常可表示条件“如果”，但在这里承接树木虽近乎无望、仍可能复苏的比喻，按让步义译为“即使”更符合诗句脉络，同时以脚注保留条件读法。
- source_word: יַזְקִין
  choice: 衰老
  rationale: 此处表示变老、老化；“衰老”自然凝练，也体现树根逐渐失去生机的过程。
- source_word: בָּאָרֶץ
  choice: 在地里
  rationale: אָ֫רֶץ 在植物语境中指土地、地面；“地里”符合现代汉语表达，并与下句“尘土中”形成诗意对应。
- source_word: שָׁרְשׁוֹ
  choice: 树根
  rationale: 原文为带第三人称阳性单数后缀的单数名词，在树木比喻中可自然译作集合意义的“树根”。
- source_word: וּבֶעָפָר
  choice: 在尘土中
  rationale: עָפָר 指尘土或松散的土；“尘土”既忠实于常用词义，也保留约伯记中与死亡相关的诗性回响。
- source_word: יָמוּת
  choice: 死去
  rationale: מות 是普通的“死”之动词；“死去”直接保留原文拟人化表达，不增添“枯萎”等原文没有的意象。
- source_word: גִּזְעוֹ
  choice: 树桩
  rationale: גֵּזַע 在此指树被砍后留下的桩或根株；“树桩”最清楚地配合上下文中被砍之树仍可能萌芽的图景。
