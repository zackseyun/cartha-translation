  rationale: 修订以“转变”作为较中性的正文译法，保留约伯对于死后生命及自身处境改变的开放性张力；“临到我”自然表达原文“我的转变来到”。“必等候”对应条件设问后的结果语气，并保留等候／盼望的含义。
