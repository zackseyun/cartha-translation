  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: zh_hans
  text: 人若死了，还能再活吗？我在服苦役的日子里必等候，直到转变[a]临到我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“解脱”或“更新”。希伯来语这个词可指改变、更替、解脱或更新。
    reason: 保留חֲלִיפָתִי的词义幅度，避免把约伯所等候之事限定为单一解释。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 按条件句理解，保留约伯设问的修辞力量；不改作时间性的“当……时”。
- source_word: גֶּבֶר
  choice: 人
  rationale: 此处指必死的人；现代汉语用“人”自然清楚，也不额外强化原词有时带有的强壮男子色彩。
- source_word: הֲיִחְיֶה
  choice: 还能再活吗
  rationale: 动词本身是“活”，但在“死了”之后询问是否活，汉语加“再”能自然表达语境隐含的复生之意，同时仍保留疑问而非断言。
- source_word: צְבָאִי
  choice: 我服苦役的日子
  rationale: צָבָא可指征战、服役或规定的服役期限；本段强调人生的艰苦等候，“服苦役”既传达受命服役的意象，也体现重负。
- source_word: אֲיַחֵל
  choice: 我都愿等候
  rationale: יחל可兼有等候与盼望之意；这里以“直到……”为界，等候是句法焦点。“愿”配合前面的假设语气，但不把潜在盼望说得过满。
- source_word: חֲלִיפָתִי
  choice: 我的更新
  rationale: חֲלִיפָה可指改变、更替或更新；结合本章树木重新萌发的图景，“更新”保留恢复生命的可能性，却不明确断言复活。其他主要词义置于脚注。
theological_decisions:
- issue: 本节是否明确宣告死后复活
  choice: 保留“还能再活吗”的开放式设问，并将חֲלִיפָתִי译为“更新”
  alternative: 可更中性地译为“改变”，或更明确地译为“复活／重生”
  rationale: 希伯来文本表达的是疑问、等候和盼望之间的张力，而不是完整明确的教义宣告；译文既不抹去复生的语境暗示，也不把可能性提升为定论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“服苦役”保留受派服役及艰难期限的意象；全句维持约伯既疑问又等候的张力。脚注标记紧随其实际说明的“更新”，而非置于“死了”之后。
