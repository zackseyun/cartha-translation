base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: zh_hans
  text: 但愿你把我藏在阴间[a]，把我隐藏起来，直到你的怒气转消；愿你为我定下期限[b]，并记念我！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坟墓”或“死者之境”。希伯来语为“示奥”（Sheol），指死者所在之处。
    reason: lexical_alternative
  - marker: b
    text: 或译“为我定下界限（定规）”。这里的希伯来语名词可指固定、规定或划定的事物。
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: 但愿
  rationale: 这是表达强烈愿望的惯用语，并非字面上的“谁能给”；“但愿”自然传达约伯的渴望。
- source_word: בִּשְׁאוֹל
  choice: 在阴间
  rationale: שְׁאוֹל 指死者所在之处，不宜窄化为坟墓，也不应译成带有后期刑罚观念的“地狱”；“阴间”是现代中文圣经语境中较简洁且相对中性的对应词。
- source_word: תַּצְפִּנֵנִי / תַּסְתִּירֵנִי
  choice: 把我藏……将我隐藏
  rationale: 两个近义动词构成诗歌平行与加强；中文用“藏”和“隐藏”既保留重叠，也避免机械重复。
- source_word: עַד שׁוּב אַפֶּךָ
  choice: 直到你的怒气转消
  rationale: שׁוּב 保留“转”的动态意象，而“转消”在中文中自然表达怒气退去；אַפֶּךָ 按惯用义译为“怒气”。
- source_word: תָּשִׁית לִי חֹק
  choice: 为我定下期限
  rationale: חֹק 可指固定、规定或划定之事；此处结合等待的语境，很可能是定下的时限，但原词仍有界限或定规的宽度，因此以脚注保留其他可能。
- source_word: וְתִזְכְּרֵנִי
  choice: 并记念我
  rationale: “记念”比一般的“想起”更能保留神主动顾念、采取行动的关系性意味，同时在现代中文中仍清楚庄重。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死者之境
  rationale: “阴间”保留希伯来语中死者所在领域的概念，既不把它缩减为埋葬地点，也不把后来的“地狱”刑罚教义带入经文。
- issue: חֹק 在本节中的含义
  choice: 期限
  alternative: 界限；定规；指定的时间
  rationale: 上下文涉及隐藏“直到”怒气消退，因此时间期限最合语境；但该名词本身可表示固定、规定或界限，脚注保留其词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话诗体。“但愿……愿……”保留强烈祈愿语气；平行分句尽量体现希伯来诗歌结构。
