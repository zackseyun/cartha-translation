  text: תִּתְקְפֵ֣/הוּ לָ֭/נֶצַח וַֽ/יַּהֲלֹ֑ךְ מְשַׁנֶּ֥ה פָ֝נָ֗י/ו וַֽ/תְּשַׁלְּחֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: zh_hans
  text: 你永远压倒他，他便离去[a]；你改变他的面容[b]，把他送走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他就走了”。原文动词直译为“去”，这里很可能指离开人世，或从人的生活场景中消逝。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的外貌”。原文“面容”也可泛指人的外表或神色。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: 你压倒他
  rationale: תקף的使役式在这里表示对某人占据绝对优势、胜过或压倒；“压倒”简洁保留了上帝对世人的强大制胜之意。
- source_word: לָנֶצַח
  choice: 永远
  rationale: נֶצַח表示持久、永久；在本节突出这种胜过所带来的不可逆终局。
- source_word: וַיַּהֲלֹךְ
  choice: 他便离去
  rationale: הלך字面为“去、行走”，这里处于死亡与人生终局的语境。“离去”既自然表达离开人世或人的场景，又不把动词本身过度明确为“死去”。
- source_word: מְשַׁנֶּה
  choice: 你改变
  rationale: 源于שנה“改变”；虽为分词形式，在连续的第二人称陈述中自然译为“你改变”。
- source_word: פָנָיו
  choice: 他的面容
  rationale: פנים字面是“脸”，也可指外貌、神色；“面容”既保留具体意象，也容纳较宽的外表含义。
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: 把他送走
  rationale: שלח的加强式可表示送走、遣走或逐走；“送走”保持宽泛，不额外判定是遣散还是驱逐。
theological_decisions:
- issue: “离去”是否明确指死亡
  choice: 正文译作“离去”
  alternative: 死去／离世
  rationale: 上下文强烈涉及人的死亡与终局，但הלך本身仅表示“去”；采用“离去”保留原文含蓄及其神学张力，并以脚注说明语境可能所指。
translation_notes:
  register: 采用现代、庄重而清楚的诗体散文。“压倒—离去—改变—送走”保留原文连续动作和直接对上帝说话的语气；不把“离去”过度解释为明确的死亡术语。
