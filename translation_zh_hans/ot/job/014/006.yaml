  text: שְׁעֵ֣ה מֵ/עָלָ֣י/ו וְ/יֶחְדָּ֑ל עַד יִ֝רְצֶ֗ה כְּ/שָׂכִ֥יר יוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/006.yaml
  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: zh_hans
  text: 求你转眼不看他[a]，让他得以歇息，直到他像雇工一样度完自己的一日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你转眼不看他，让他止息，直到他像雇工一样享受自己的一日。”希伯来文既可侧重停止、喘息，也可侧重对度完所定之日感到满足。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה
  choice: 转眼不看
  rationale: 这是第二人称阳性单数祈使式，在此表示把注视或关注移开。上下文中约伯是在求上帝停止紧盯世人；“转眼不看”自然地传达这一含义。
- source_word: מֵעָלָיו
  choice: 他
  rationale: 介词组合带第三人称阳性单数后缀，表示从他身上移开注视或压力；与“转眼不看”连用时，汉语无需另译“从……身上”。
- source_word: וְיֶחְדָּל
  choice: 让他得以歇息
  rationale: חדל的基本义是“停止、止息”。此处可指人从上帝的察看和苦难中获得片刻喘息；译作“得以歇息”表达语境功能，同时保留脚注说明其字面歧义。
- source_word: עַד
  choice: 直到
  rationale: 保留其引出时间界限的通常意义。
- source_word: יִרְצֶה
  choice: 度完
  rationale: רצה通常涉及喜悦、满意或悦纳；与雇工及其一日连用时，可理解为满意地完成或享受既定的一日。“度完”突出达到一天终点的语境意义，但其“享受、满意”的可能含义在脚注中保留。
- source_word: כְּשָׂכִיר
  choice: 像雇工一样
  rationale: שָׂכִיר指受雇领取工钱的劳动者。“雇工”简洁、自然，并保留原文的社会经济意象。
- source_word: יוֹמוֹ
  choice: 自己的一日
  rationale: 直译为“他的一日”。雇工的比喻已经给出劳作背景，因此不在正文中增添“工作日”，并以“一日”保持庄重而简明的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“求你”明确这是向上帝发出的请求；“一日”比“工作日”更贴近原文字面，也避免消除诗句中人生年日与雇工工日之间的张力。
