base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: zh_hans
  text: '既然他的日子已经定下[a]，

    他的月数在你那里；

    你为他划定了界限[b]，

    他不能越过这界限。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果他的日子已经定下。”希伯来语这个词可以引出条件；但按上下文，它更可能说明约伯提出恳求的依据，即“既然他的日子已经定下”。
    reason: lexical_alternative
  - marker: b
    text: “界限”也可译作“定规”或“所定的限度”。希伯来语这个词可指既定的规定或不可逾越的边界。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 既然
  rationale: 该词通常可表示“如果”，但在本段语境中更可能引出约伯恳求的依据；译作“既然”自然表达这种理由或既定前提，同时用脚注保留条件式的可能。
- source_word: חֲרוּצִים
  choice: 已经定下
  rationale: 这个被动分词表示人的日子已被决定、限定；“已经定下”既清楚自然，也保留其被动含义。
- source_word: יָמָיו
  choice: 他的日子
  rationale: 直译复数名词及第三人称阳性单数后缀；在语境中指一个人的寿日。
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: 他月数的定额
  rationale: 原文是“他月份的数目”。“月数的定额”保留名词结构，并与前句“日子已经定下”及后句“界限”相呼应，而不只表达上帝知道其数目。
- source_word: אִתָּךְ
  choice: 在你那里
  rationale: 贴近原文“与你同在／在你那里”，既可包含数目为上帝所知，也可暗示在其掌握之中，而不把其中一种含义绝对化。
- source_word: חֻקּוֹ
  choice: 他的界限
  rationale: 该名词可指规定、定例或固定边界；此处与“越过”搭配，“界限”最为自然，也保留空间隐喻。
- source_word: עָשִׂיתָ
  choice: 你为他划定了
  rationale: 该动词字面为“做、制定”；与“界限”连用时，“划定”准确表达设立固定边界的意思。
- source_word: וְלֹא יַעֲבוֹר
  choice: 他不能越过
  rationale: 动词为第三人称阳性单数，主语是人；在已划定的界限这一语境中，表达他无法越过该界限。
theological_decisions:
- issue: 上帝对人寿命的确定
  choice: 经文表明人的寿日已经定下，其月数在上帝那里，上帝也为他划定了不能越过的界限。
  alternative: 可较弱地理解为经文主要强调上帝知道人的寿命，而不强调他主动确定寿命。
  rationale: “已经定下”“在你那里”和“你为他划定了界限”合在一起，既涉及上帝的知晓，也强烈表达其主权性的限定；译文保留这一力度，却不据此扩展为超出本节的系统教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并保留希伯来诗歌的四行节奏。“在你那里”避免将原文仅解释为“为你所知”或仅解释为“归你掌管”；“界限—越过”保留原文的意象。
