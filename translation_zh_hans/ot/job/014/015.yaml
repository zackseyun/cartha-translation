  yaml_path: translation/ot/job/014/015.yaml
  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: zh_hans
  text: 你若呼唤，我必回答你；你必切慕你手所造的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你手所造的”直译为“你手的作为”。在这里按语境指上帝所造的人，即约伯自己。
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: 你呼唤
  rationale: קרא 的 Qal 未完成式第二人称阳性单数。承接本章前文约伯所盼望的情境；汉语不必加“会”也能在语境中保留愿望或设想的语气。
- source_word: וְאָנֹכִי
  choice: 我就
  rationale: 连词与强调性第一人称代词构成上帝呼唤、约伯回应的对应关系；译作“我就”自然体现先后响应。
- source_word: אֶעֱנֶךָּ
  choice: 回答你
  rationale: ענה 的 Qal 未完成式第一人称单数，带第二人称阳性单数宾语后缀，直译为“回答你”。
- source_word: לְמַעֲשֵׂה יָדֶיךָ
  choice: 你亲手所造的
  rationale: 原文直义为“你双手的作品/工作”。现代汉语用“你亲手所造的”自然保留创造者与受造物的意象，并指向作为上帝受造之物的人。
- source_word: תִכְסֹף
  choice: 你必切切思念
  rationale: כסף 的 Qal 未完成式第二人称阳性单数，表示强烈地渴想、思念。“切切思念”既传达情感强度，也保持庄重诗体；“必”在这一设想情境中表达预期，而非消除其愿望色彩。
theological_decisions:
- issue: 本节应如何表达上帝对其所造之人的态度
  choice: 你必切切思念你亲手所造的
  alternative: 你必眷顾你亲手所造的
  rationale: כסף 通常表达渴想、切望，不只是留意或眷顾。保留较强的情感用语，呈现约伯所盼望的张力：上帝不再持续审判，而重新思念自己所造的人。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以“呼唤—回答”保留对句结构；“切切思念”传达原文强烈的渴想，同时避免加入特定宗派解释。
