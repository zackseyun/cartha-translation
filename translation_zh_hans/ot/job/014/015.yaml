  naturalness: “你呼唤，我就回答你”自然，但未充分显出上下文的设想语气。“切切思念”可懂，却较“切慕”更偏向对不在场者的思念；此处的 כסף 是强烈渴望、切慕。修订后仍保持现代、庄重的诗体。
  terminology: “切慕”较准确表达 כסף 的“渴望、切望”，不弱化为“眷顾”。“你手所造的”保留创造者的拟人化意象及“手的作为”的含义；脚注谨慎说明本处在语境中指约伯这受造之人，而不把这一解释当作字面替换。
