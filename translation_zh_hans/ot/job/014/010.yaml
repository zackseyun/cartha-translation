review_pass:
  verdict: revise
  source_fidelity: “壮年人”将 גבר 不必要地限定为年龄上的“壮年”，原词虽可带力量、强健的语感，却通常不专指壮年人。“世人”则是复数/集合性称呼，与原文单数 אדם 及后面的“他”不协调。译作“男子／人”可保留原文两个人称名词的平行与单数形式。
  naturalness: “死去，就衰残了”在现代汉语中既显逻辑突兀，也使“衰残”带有长期衰败、残损的意味，超过 חלש 的“变弱、无力”。“便变得软弱”较贴近原义，也仍保留诗歌中死亡与无力的并列张力。
  terminology: “断了气”适切传达 גוע 的死亡性表达。以“男子”对应 גבר、以“人”对应 אדם，可避免把前者年龄化、把后者复数化；不应把末句解释为死后状态的断言。
  issues:
  - severity: medium
    issue: “壮年人”过度限定 גבר。
    rationale: גבר 可含强健/男性的语感，但并不表示特定年龄阶段；“壮年人”加入了原文未明示的年龄信息。
  - severity: medium
    issue: “世人”与原文单数及“他”不一致。
    rationale: אדם 在此为单数、与 גבר 平行；“世人”通常指集合性复数人群，后接“他”造成数的不协调。
  - severity: medium
    issue: “衰残”强化并改变了 חלש 的语义。
    rationale: חלש 的基本义为变弱、无力；“衰残”常暗示长期衰败或残损，且“死去，就衰残”在汉语中不够顺畅。
  revised_text: 男子死去，便变得软弱；人断了气，他又在哪里呢？
