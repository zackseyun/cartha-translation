revisions:
- from: 但壮年人死去，就衰残了；世人断了气，他又在哪里呢？
  to: 男子死去，便变得软弱；人断了气，他又在哪里呢？
  rationale: 修订除去“壮年人”的年龄限定，并将集合性的“世人”改为单数泛称“人”。“便变得软弱”直接反映 חלש 的词义，不将其扩展为“衰残”。末句保留开放式追问；“又”在中文诗体中自然承接前句，不断言死者的去处。
