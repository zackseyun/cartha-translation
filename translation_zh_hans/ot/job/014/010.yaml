  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: zh_hans
  text: 男子死去，便变得软弱；人断了气，他又在哪里呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֶּבֶר
  choice: 壮年人
  rationale: 该词指男性，并常带强健、有力量的意味；译作“壮年人”可在本诗论死亡的语境中保留这一反差，又不收窄为“勇士”。
- source_word: יָמוּת
  choice: 死去
  rationale: 未完成式在这里表达普遍事实；现代汉语用“死去”自然地传达这种恒常的人生现实。
- source_word: וַיֶּחֱלָשׁ
  choice: 就衰残了
  rationale: חלש的核心义是变得软弱、失去力量；“衰残”既保留衰弱之意，也与前面的死亡相称，而不暗示只是暂时患病。
- source_word: וַיִּגְוַע
  choice: 断了气
  rationale: גוע表示气息终止、生命消逝；“断了气”比再次译作“死去”更能保留原文平行句中的词汇变化。
- source_word: אָדָם
  choice: 世人
  rationale: 此处泛指必死的人类个体，并与גבר平行；“世人”在庄重诗体中自然，也能与前句的男性用词有所区别。
- source_word: וְאַיּוֹ
  choice: 他又在哪里呢？
  rationale: 保留原文追问死者去处的疑问形式；“又”自然承接前面的死亡陈述，但不把问题解释为“归于无有”。
theological_decisions:
- issue: 死后之人的去处
  choice: 保留“他又在哪里呢？”这一开放性的反问
  alternative: 译成“他便不在了”或明确说明其死后状态
  rationale: 原文提出问题，并未在本节中给出形而上结论；直译问句可保留约伯言辞中的张力与含混。
translation_notes:
  register: 采用现代、庄重而可懂的诗体。两分句分别用“壮年人”和“世人”体现גבר与אדם的平行变化；用“死去／衰残／断了气”保留原文递进且不完全重复的死亡意象。
