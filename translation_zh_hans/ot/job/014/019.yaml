  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: zh_hans
  text: 水磨蚀石头；洪流[a]冲走地上的尘土；照样，你使世人的盼望破灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洪流”所译的希伯来词十分罕见，含义不确定；也可能指“涌流”“冲刷之物”，或“从地里长出的东西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים
  choice: 石头
  rationale: 普通复数名词；“石头”自然保留水侵蚀岩石的诗歌意象。
- source_word: שָׁחֲקוּ מַיִם
  choice: 水磨损
  rationale: 该动词表示因摩擦而逐渐磨蚀；希伯来诗句结构凝练，汉语用“水磨损石头”清楚表达持续侵蚀。
- source_word: תִּשְׁטֹף
  choice: 冲走
  rationale: 可指冲刷、淹没或卷走；在水侵蚀土地的语境中，“冲走”最自然。
- source_word: סְפִיחֶיהָ
  choice: 洪流
  rationale: 此罕见词的含义不确定；结合冲刷尘土的上下文，“洪流”能形成连贯意象，同时以脚注保留其他可能。
- source_word: עֲפַר אָרֶץ
  choice: 地上的尘土
  rationale: 较贴近字面“地的尘土”，并保留约伯记常见的“尘土”意象；此处也可理解为表层土壤。
- source_word: תִקְוַת אֱנוֹשׁ
  choice: 世人的盼望
  rationale: אֱנוֹשׁ指脆弱、必死的人；“世人”在现代汉语中自然地表达代表性的人类，同时保留凡人意味。
- source_word: הֶאֱבַדְתָּ
  choice: 你使……破灭
  rationale: 使役式表示使之灭亡、消失；与“盼望”搭配时，“使……破灭”自然有力，并保留对上帝的直接称呼。
theological_decisions:
- issue: 末句对上帝的直接称呼
  choice: 照样，你使世人的盼望破灭
  alternative: 你也毁灭世人的盼望
  rationale: 第二人称阳性单数动词明确指向上帝。“照样”表达前面自然景象与人的盼望之间隐含的类比，不进一步解释其神学意义。
- issue: אֱנוֹשׁ的表达
  choice: 世人
  alternative: 凡人
  rationale: 原词强调人的软弱与必死性，也可作为人类的代表性单数。“世人”在此语境中庄重自然；“凡人”则更明显突出必死性。
- issue: 自然侵蚀与人的盼望之间的关系
  choice: 用“照样”标明诗句的类比
  alternative: 仅用“而”连接，保留更松散的并列
  rationale: 上下文以水磨石、冲土比拟上帝使人的盼望消逝；“照样”使现代读者易于把握诗意逻辑，同时不说明上帝为何如此行。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。前两分句以简洁的自然侵蚀图景铺陈，末句保留约伯直接向上帝发出的尖锐陈述。脚注标记置于相关疑难词之后。
