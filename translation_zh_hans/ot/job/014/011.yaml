  text: 海中的水消逝，河流干涸枯竭，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְלוּ
  choice: 消逝
  rationale: 表达水逐渐耗尽、消失，符合该动词在本句中的语境。
- source_word: מִנִּי יָם
  choice: 海中的
  rationale: 按介词短语的来源义处理，即水从海中消失；不额外限定“海”是湖泊、内海还是大海。
- source_word: נָהָר
  choice: 河流
  rationale: 采用现代汉语通行对应词，保留一般性。
- source_word: יֶחֱרַב וְיָבֵשׁ
  choice: 干涸枯竭
  rationale: 用两个相近而不完全重复的词保留希伯来文并列动词的加强效果；前者侧重无水，后者侧重彻底耗尽。
