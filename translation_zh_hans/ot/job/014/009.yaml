  text: at the scent of water it will bud and produce growth like a planted tree[a].
translation:
  language: zh_hans
  text: 一有水的气息，它就会萌芽，并像栽种的植物一样生出新芽[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生出新芽”或可译为“生出新生长物”。这里的希伯来词通常可指“收成”或“收割物”，但在本句植物复苏的语境中，具体所指并不确定。“栽种的植物”也可译为“所栽种之物”；鉴于上下文，其所指可为树。
    reason: 保留 וְעָשָׂה קָצִיר 与 נָטַע 的词义及指称范围的不确定性。
lexical_decisions:
- source_word: מֵרֵיחַ
  choice: 一闻到……的气息
  rationale: רֵיחַ指“气味、气息”，前缀מִן在这里表达树因水的气息或临近而产生反应。“一闻到……的气息”既保留诗意，也自然表现哪怕仅仅接近水便复苏的意象。
- source_word: מַיִם
  choice: 水
  rationale: 该词虽为复数形式，但通常作物质名词使用；现代汉语自然译作“水”。
- source_word: יַפְרִחַ
  choice: 萌芽
  rationale: פרח的使役形可指发芽、抽芽或开花；上下文描写被砍之树重新生长，“萌芽”准确而不把生长阶段说得过满。
- source_word: וְעָשָׂה קָצִיר
  choice: 长出枝条
  rationale: עָשָׂה意义宽泛，קָצִיר通常指“收割、收成”，但在此植物复苏的语境中很可能指长出的枝梢或新生部分。“长出枝条”符合上下文，同时以脚注保留词义上的不确定性。
- source_word: כְּמוֹ
  choice: 像……一样
  rationale: 直接表达希伯来语的比较关系，符合现代汉语习惯。
- source_word: נָטַע
  choice: 栽种的树
  rationale: 该词在此指被栽种之物或植物；上下文明确谈论树，因此译为“栽种的树”使所指清楚，又不改变整体意象。
