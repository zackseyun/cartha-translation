  text: הֲ/יַרְבֶּ֣ה אֵ֭לֶי/ךָ תַּחֲנוּנִ֑ים אִם יְדַבֵּ֖ר אֵלֶ֣י/ךָ רַכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/027.yaml
  text: Will he make many pleas to you[b][a], or will he speak soft words to you?
translation:
  language: zh_hans
  text: 它岂会再三向你恳求[a]，又岂会对你说柔和的话[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求”也可译作“哀求”，指迫切请求恩惠或怜悯。
    reason: lexical_alternative
  - marker: b
    text: “柔和的话”也可译作“温言软语”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַרְבֶּה
  choice: 岂会再三
  rationale: 疑问词 הֲ 引出反问；使役形态的 רבה 表示“使之增多、多多地做”。结合“恳求”，译为“再三”既保留数量增多之意，也符合现代汉语表达。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词 אֶל 加第二人称阳性单数后缀表示动作的指向，译作“向你”自然准确。
- source_word: תַּחֲנוּנִים
  choice: 恳求
  rationale: 该词指为求恩惠或怜悯而发出的迫切请求。“恳求”清楚、自然，并能表达其郑重迫切的语气。
- source_word: אִם
  choice: 又岂
  rationale: 这里的 אִם 位于平行反问的第二分句，不表示普通条件，而承接另一个选择性问题。汉语用“又岂”保留两个并列反问的修辞力量。
- source_word: יְדַבֵּר
  choice: 会……说
  rationale: דבר 的未完成式在此问及可能发生的言语行为；“会……说”符合汉语反问句式。
- source_word: רַכּוֹת
  choice: 柔和的话
  rationale: רך 的阴性复数在此作名词性用法，指柔软、温和的言语。“柔和的话”不额外引入奉承或欺骗的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两个“岂会”呈现原文连续反问的语气；“再三”自然表达“增多、屡次”的含义。代词“它”承接上文所说的受造物，避免在汉语中无依据地人格化。
