  text: הָ֭פֵץ עֶבְר֣וֹת אַפֶּ֑/ךָ וּ/רְאֵ֥ה כָל גֵּ֝אֶ֗ה וְ/הַשְׁפִּילֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
translation:
  language: zh_hans
  text: 发出你满溢的怒气[a]；察看每一个骄傲的人，使他降卑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“散布你怒气的烈焰。”希伯来语动词可指发出、驱散或散布；这里与怒气相连，表达其猛烈迸发。
    reason: 保留 הָפֵץ 的词汇范围及其与怒气意象结合时的不同可行译法。
  - marker: b
    text: 希伯来原文直译为“每一个骄傲的”；此处单数宾语表达逐一对待每个骄傲的人。
    reason: 说明 כָּל 加单数形容词及后接单数代词的分配性用法。
lexical_decisions:
- source_word: הָפֵץ
  choice: 倾泻
  rationale: 此处为命令式，表达使怒气猛烈发出；与后面的“满溢”搭配，既自然又保留强烈的动态意象。
- source_word: עֶבְרוֹת אַפֶּךָ
  choice: 你满溢的怒气
  rationale: עֶבְרוֹת 为复数，带有怒气奔涌、爆发之意；אַף 在此是表示愤怒的常用习语。中文以“满溢的怒气”传达其强度，而不生硬复制复数。
- source_word: וּרְאֵה
  choice: 察看
  rationale: 不仅表示看见，也带有定意注视并采取行动的语气；“察看”符合庄重诗歌语体。
- source_word: כָל גֵּאֶה
  choice: 每一个骄傲的人
  rationale: 单数形容词作名词用，配合 כָל 呈逐一分配的意义，因此译作“每一个”，并明确其指人。
- source_word: וְהַשְׁפִּילֵהוּ
  choice: 把他降为卑微
  rationale: 使役命令式直指使对方降低；单数代词“他”与前面的逐一分配意义呼应，并保留“高傲—降卑”的空间隐喻。
