  text: His bones are tubes of bronze[b][a]; his limbs are like bars of iron.
translation:
  language: zh_hans
  text: 它的骨头是铜制的管子[a]；它的骨头如同铁条[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜制的管子”或译“铜制的通道（或沟槽）”。希伯来语所描绘的可能是管道、通道或沟槽一类的结构。
    reason: lexical_alternative
  - marker: b
    text: “铁条”或译“铸成的铁件”。原文此处的“骨头”也可译“骨骼”；该金属词可指铸成或制成的金属物。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: 它的骨头
  rationale: עֶצֶם通常指“骨头”；这里采用直接的身体用语，并与下半句的גְּרָמָיו形成平行。
- source_word: אֲפִיקֵי
  choice: 铜管
  rationale: אֲפִיקִים可指河道、沟渠或管道等通道形结构；在骨骼比喻中，“管”既保留其通道意象，也自然传达粗壮坚实之感。
- source_word: נְחוּשָׁה
  choice: 铜
  rationale: 该词可指铜或青铜；汉语圣经语体中“铜”简洁自然，同时保留原词在此处金属种类上的一定宽度。
- source_word: גְּרָמָיו
  choice: 它的肢骨
  rationale: גֶּרֶם可指骨头、骨架；“肢骨”既保留骨骼含义，又避免与上句机械重复，并呈现身体结构的力量。
- source_word: כִּמְטִיל
  choice: 如同铁棍
  rationale: מָטִיל所指可能是铸件、金属条或金属棍；“棍”在汉语中形象地表现其坚硬、粗重，同时用脚注保留“铸件”的可能。
- source_word: בַּרְזֶל
  choice: 铁
  rationale: בַּרְזֶל的常规对应词，与上半句的铜构成平行的金属意象。
