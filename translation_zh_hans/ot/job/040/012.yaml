  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: zh_hans
  text: 你要察看每一个骄傲的人，使他降卑；在他们所在之处[a]践踏恶人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们本处。”
    reason: 希伯来语 תַּחְתָּם 在此可指恶人所在的地方；“在他们所在之处”表达其语境中的习语性含义。
lexical_decisions:
- source_word: רְאֵה
  choice: 察看
  rationale: 这是对约伯说的命令式，要求他把目光转向骄傲的人；“察看”既保留主动注视的意味，也符合庄重语境。
- source_word: כָל גֵּאֶה
  choice: 每一个骄傲的人
  rationale: 形容词作名词使用，כָל 在此具有逐一、涵盖全体的意味；此译也与随后第三人称单数代词“他”自然对应。
- source_word: הַכְנִיעֵהוּ
  choice: 使他降卑
  rationale: כּנע 的使役式命令语气表示使骄傲者低下；“降卑”保留骄傲与被降低之间的对照，且不把含义窄化为内在谦卑。
- source_word: וַהֲדֹךְ
  choice: 践踏
  rationale: 该动词在审判语境中表达强力压倒、击溃；“践踏”保留具体而强烈的动作意象，也与上下文中制服恶人的挑战相称。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是对道德上邪恶之人的类别称呼；“恶人”是准确、简洁且为现代读者熟悉的表达。
- source_word: תַּחְתָּם
  choice: 在他们所在之处
  rationale: תחת 加复数后缀可在此表示恶人原来所在的位置；此译自然地表达就地施行审判，同时以脚注保留较字面的理解。
theological_decisions:
- issue: 对约伯发出命令的性质
  choice: 保留直接命令的形式，将其呈现为上帝要求约伯施行降卑骄傲者、压倒恶人的审判行动。
  alternative: 把命令明说为纯粹假设，或解释为上帝实际授予约伯施行神圣审判的权柄。
  rationale: 上下文中的命令构成上帝对约伯的挑战，但本节本身没有明说约伯是否有能力或是否真正受权执行；因此译文保留命令力度，不额外解决这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“每一个……他”保留原文逐一指称及单数代词的呼应；“践踏”保留审判场景的强烈意象。
