  yaml_path: translation/ot/job/040/024.yaml
  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: zh_hans
  text: 谁能当着它的面把它捉住？谁能用网罗刺穿它的鼻子？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他能当着它的面捉住它吗？他能用网罗刺穿它的鼻子吗？”希伯来文十分简略：动词的主语没有明说，也没有明写疑问词。
    reason: alternative_reading
  - marker: b
    text: “网罗”：希伯来文通常指捕兽的网罗或陷阱；有些传统译本因刺鼻的意象而译作“钩子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: 当着它的面
  rationale: 介词 ב 与“眼睛”连用，在这里表示公开在这巨兽眼前、趁它看着时行事；“当着它的面”是自然的现代汉语表达。
- source_word: יִקָּחֶנּוּ
  choice: 谁能……把它捉住
  rationale: לקח 基本义为“拿、取”，在捕猎语境中指捉住动物；结合上下文的神圣挑战，以反问表达其不可轻易捕获。
- source_word: בְּמוֹקְשִׁים
  choice: 用网罗
  rationale: מוֹקֵשׁ 通常指捕捉猎物的网罗或陷阱，而非专指钩子；保留原文略显突兀的捕猎意象。
- source_word: יִנְקָב
  choice: 刺穿
  rationale: נקב 表示刺入、穿透或凿穿；“刺穿”既准确又符合现代汉语。
- source_word: אָף
  choice: 鼻子
  rationale: אַף 在此为具体的身体部位，不是“怒气”；“鼻子”比“鼻孔”更直接，也不把所指范围收窄。
theological_decisions:
- issue: 两个未明说主语的未完成式动词是否译为泛指反问
  choice: 译作“谁能……？”的反问句
  alternative: 直译为“它眼看着，他要捉住它；他要用网罗刺穿它的鼻子”
  rationale: 希伯来文极简，没有明示疑问词，动词主语也未指明；但上下文是上帝对人能否制伏这巨兽的挑战，泛指反问最符合语境，同时以脚注保留较直译的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“当着它的面”传达“在它眼前、它看着的时候”；“网罗”保留原词的捕猎含义，并让原文第二问略显压缩、突兀的意象继续存在。
