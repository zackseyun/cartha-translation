  text: הִנֵּה נָ֣א בְ֭הֵמוֹת אֲשֶׁר עָשִׂ֣יתִי עִמָּ֑/ךְ חָ֝צִ֗יר כַּ/בָּקָ֥ר יֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: zh_hans
  text: 你看，比希莫特[a]，我造它，和造你一样；它像牛一样吃草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比希莫特”也可译作“那兽”或“巨兽”。许多释经者认为这是某种特定巨大生物的名称或称号；也有人将它认作河马或另一种大型动物。
    reason: 保留בְהֵמוֹת作为名称／称号的可能性，并保留其所指生物身份的不确定性，避免正文预先作出动物学鉴定。
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 你看
  rationale: הִנֵּה用于引人注意，נָא在此加强当下的提示语气；“你看”自然、庄重，也符合上帝直接对约伯说话的语境。
- source_word: בְהֵמוֹת
  choice: 河马兽
  rationale: 该词与“牲畜、兽”有关，但在本段中指称一种特定的巨大生物。“河马兽”沿用中文圣经中较为人熟悉的音义兼顾名称，同时不直接断定它就是现代动物分类中的河马。
- source_word: אֲשֶׁר עָשִׂיתִי עִמָּךְ
  choice: 我造了它，也造了你
  rationale: 原文直译可作“我与你一同造的”，重点是这生物和约伯同为上帝所造。中文用并列句清楚表达这种共同的受造身份，并避免被误解为上帝与约伯一起创造它。
- source_word: חָצִיר
  choice: 草
  rationale: 该词指草或草本植物；“草”简明自然，符合此处食性的描写。
- source_word: כַבָּקָר
  choice: 像牛一样
  rationale: בָּקָר可指牛类或牛群；在比较结构中，“像牛一样”自然且保留其概括性，不把它过度限定为公牛或役牛。
- source_word: יֹאכֵל
  choice: 吃
  rationale: 未完成式在此描述该生物一贯的食性，现代汉语以一般现在意义的“吃”表达最自然。
theological_decisions:
- issue: בְהֵמוֹת所指生物的身份
  choice: 正文采用传统名称“河马兽”，脚注说明其身份并不确定
  alternative: 译作“巨兽”或直接认定为河马等特定动物
  rationale: 诗歌语境把它作为一种特定且非凡的受造物来描写，但原文并未明确给出现代动物学分类。保留专名式称呼并以脚注呈现不同理解，可避免把某一鉴定强加给经文。
- issue: עִמָּךְ表达的创造关系
  choice: 译为“我造了它，也造了你”
  alternative: 直译为“我与你一同造的”
  rationale: 原意是上帝造它如同造约伯，强调二者同属受造物，而不是说约伯参与创造。中文显明主语和宾语，可避免神学与语义上的误读。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你看”保留直接呼告；以“我造了它，也造了你”自然传达共同受造之意。代词用“它”，符合现代汉语指动物的通常表达。
