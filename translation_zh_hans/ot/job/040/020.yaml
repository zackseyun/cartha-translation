  text: כִּֽי ב֭וּל הָרִ֣ים יִשְׂאוּ ל֑/וֹ וְֽ/כָל חַיַּ֥ת הַ֝/שָּׂדֶ֗ה יְשַֽׂחֲקוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/020.yaml
  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: zh_hans
  text: 因为群山为它出产食物[a]，田野里所有的野生动物[b]都在那里嬉戏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“群山为它生出物产。”
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“田野的一切走兽。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，说明这巨兽所得的供应；“因为”自然表达解释性的语气。
- source_word: בּוּל
  choice: 食物
  rationale: 该词指土地的出产或收成；在这里，这些出产是供巨兽食用的，因此正文译作“食物”，并以脚注保留“出产”的词汇层面表达。
- source_word: הָרִים
  choice: 群山
  rationale: 准确表达复数名词，并以自然的现代汉语呈现群山作为供应食物的地域。
- source_word: יִשְׂאוּ לוֹ
  choice: 为它出产
  rationale: נשא本义有“承载、带来”，与בּוּל搭配时表达土地生出或供给出产；“为它出产”既保留意象，也符合汉语习惯。
- source_word: וְכָל חַיַּת הַשָּׂדֶה
  choice: 田野里所有的野生动物
  rationale: חַיַּת הַשָּׂדֶה是集合性表达，指野外生活的动物；此译清楚、现代，并避免“兽”可能带来的古雅或贬义色彩。
- source_word: יְשַׂחֲקוּ
  choice: 嬉戏
  rationale: 该动词在此表示玩耍、欢跃；“嬉戏”比单说“玩”更庄重，又不显古奥。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接保留地点副词，所指为前面提到的山野环境。
theological_decisions: []
