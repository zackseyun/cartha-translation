  yaml_path: translation/ot/job/040/028.yaml
  text: Will he make a covenant with you[b][a], that you would take him as a slave forever?
translation:
  language: zh_hans
  text: 它岂会与你立约[a]，使你可以把它收为永远的奴隶[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“切立盟约”；这是表示“立约”的固定说法。
    reason: lexical_alternative
  - marker: b
    text: 或译“永远的仆人”。希伯来语“עֶבֶד”既可指“仆人”，也可指“奴隶”；这里强调永久受支配的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִכְרֹת בְּרִית
  choice: 岂会……立约
  rationale: כרת与בְּרִית构成固定搭配，字面为“切约”，实际指正式立约；疑问词הֲ在语境中构成反问，用“岂会”自然传达。
- source_word: עִמָּךְ
  choice: 与你
  rationale: 直接表达介词及第二人称单数后缀；上下文是上帝对约伯说话。
- source_word: תִּקָּחֶנּוּ
  choice: 让你收它作
  rationale: לקח基本义为“取、收”；此处承接前一分句，译为“让你收它作”能自然表达可能的结果，同时保留两个分句之间略有开放性的关系。
- source_word: לְעֶבֶד
  choice: 作……奴仆
  rationale: עֶבֶד可指仆人或奴隶；本节以永久受支配的身份为重点。“奴仆”兼顾古代受役身份与现代中文经文语体，不把它弱化为一般雇佣仆人。
- source_word: עוֹלָם
  choice: 永久的
  rationale: 此处表示持续而无期限的状态；“永久的奴仆”比“永远作奴仆”更紧凑自然。
