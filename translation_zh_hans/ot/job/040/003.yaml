base_translation:
  language: en
  yaml_path: translation/ot/job/040/003.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: zh_hans
  text: 于是，约伯回答雅威说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；也常音译为“耶和华”。
    reason: 说明神名的原文形式及另一常见传统音译。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה的Qal连续式在这里引出约伯对上文的回应；“回答”自然、庄重，也保留了叙事中的应答关系。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语没有对应的独立词，其语法功能由语序体现。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用四字神名יהוה；“耶和华”是现代汉语中广为人知的传统音译，并以脚注说明其原文形式及另一常见音译。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר的Qal连续式与前面的“回答”构成希伯来语惯用的引语公式“回答……说”；保留“说”可反映原文两个动词的结构。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用普通中文读者最熟悉的神名音译“耶和华”，不以“主”这一称号替代原文的专名；脚注同时保留四字神名YHWH并注明“雅威”这一常见音译，避免把其古代确切读音表述为毫无争议。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“于是”承接前文叙事；保留“回答……说”的双动词公式，以贴近希伯来文结构。
