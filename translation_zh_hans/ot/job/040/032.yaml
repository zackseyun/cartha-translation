  text: שִׂים עָלָ֥י/ו כַּפֶּ֑/ךָ זְכֹ֥ר מִ֝לְחָמָ֗ה אַל תּוֹסַֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/032.yaml
  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: zh_hans
  text: 你把手放在它身上吧；想想这场争战，你就不会再这样做了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你就不会再这样做了”或译“不要再这样做”。希伯来文直译为“不要再加添”，这里所指的行动要由上下文补出。
    reason: 原文 אַל תּוֹסַף 在形式上是禁止语，也可在语境中理解为结果性的断言；脚注保留这项真实歧义。
lexical_decisions:
- source_word: שִׂים
  choice: 放
  rationale: 这是命令式；“把手放在……身上”自然、直接，也保留尝试触碰或制伏利维坦的动作画面。
- source_word: עָלָיו
  choice: 在它身上
  rationale: 介词 עַל 加第三人称阳性单数后缀，最直接是“在它身上”；利维坦作为动物，现代汉语用“它”。
- source_word: כַּפֶּךָ
  choice: 你的手
  rationale: כַּף 可指手掌或手；此处译“手”更符合现代汉语习惯，同时保留原有动作。
- source_word: זְכֹר
  choice: 想想
  rationale: 命令式 זכר 基本义为“记得、想起”；在警告语境中，“想想”自然表达要人顾念即将面对之争战的意味。
- source_word: מִלְחָמָה
  choice: 这场争战
  rationale: 该词指战争或战斗；此处是人与利维坦交锋的具体情境，用“这场争战”既清楚又保持庄重。
- source_word: אַל תּוֹסַף
  choice: 你就不会再这样做了
  rationale: 字面为“不要再加添”，语境中省略的是再次把手放在它身上、与它交锋的行动；译文把它呈现为警告所导致的结果，同时以脚注保留形式上的另一种理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吧”使首句带有带警示意味的挑战语气；后半句用“就”清楚呈现前后结果关系。脚注标记置于正文相关句末。
