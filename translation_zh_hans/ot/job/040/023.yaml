  text: הֵ֤ן יַעֲשֹׁ֣ק נָ֭הָר לֹ֣א יַחְפּ֑וֹז יִבְטַ֓ח כִּֽי יָגִ֖יחַ יַרְדֵּ֣ן אֶל פִּֽי/הוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/023.yaml
  text: Look, if a river rages, he is not alarmed; he is confident even if the Jordan surges against his mouth.
translation:
  language: zh_hans
  text: 看哪，即使河水汹涌，它也不惊慌；即使约旦河冲到它嘴边，它仍然安稳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留希伯来文引人注意、强调眼前景象的语气。
- source_word: יַעֲשֹׁק נָהָר
  choice: 河水汹涌
  rationale: יַעֲשֹׁק本义带有压迫、猛烈冲击之意；与“河”连用时描写河水凶猛上涨或奔腾，译为“汹涌”自然且不把具体情景限定为泛滥。
- source_word: לֹא יַחְפּוֹז
  choice: 它也不惊慌
  rationale: יַחְפּוֹז可表示仓促、慌乱；此处强调河水猛烈时河马仍不受惊。
- source_word: יִבְטַח
  choice: 它仍然安稳
  rationale: 该词通常表示信靠或有把握；用于动物面对激流的状态，译为“安稳”既符合语境，也保留其镇定自若的意味。
- source_word: יָגִיחַ יַרְדֵּן אֶל־פִּיהוּ
  choice: 约旦河冲到它嘴边
  rationale: יָגִיחַ描写水猛烈涌出或冲来；“冲到它嘴边”保留原文方向和强度，同时避免误译为河水实际灌入口中。
theological_decisions:
- issue: “约旦河”是专名还是泛指大河
  choice: 保留专名“约旦河”
  alternative: 译作泛指的“河水”或“大河”
  rationale: 马所拉文本明确使用יַרְדֵּן；保留地名最忠实，也不必推断其在诗中的象征或泛称功能。
- issue: יִבְטַח是否译作宗教性的“信靠”
  choice: 按动物在洪流中的安定状态译为“安稳”
  alternative: 它仍然信靠／满有信心
  rationale: 本节没有明说信靠的对象；使用“安稳”可避免把通常用于神学语境的含义强加于此，同时保留原词的从容与把握。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“看哪”保留诗歌性的强调；两个“即使”清楚呈现平行结构，并将希伯来文כִּי在此处按让步语气处理。
