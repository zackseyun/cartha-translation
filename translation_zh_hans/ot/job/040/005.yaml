  yaml_path: translation/ot/job/040/005.yaml
  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
translation:
  language: zh_hans
  text: 我说了一次[a]，不再回答；说了两次，不再多言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我说了一次，却不回答；说了两次，却不再继续。”希伯来语“再加”也可表示继续或重复某个行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: 一次
  rationale: 阴性数词“一”在此作副词，与“我说”连用，表示“一次”；这样既符合希伯来语用法，也符合现代汉语表达。
- source_word: דִּבַּרְתִּי
  choice: 我说了
  rationale: 第一人称单数完成式指约伯先前已经说过的话；“我说了”自然表达已完成且与当前回应相关的行动。
- source_word: וְלֹא אֶעֱנֶה
  choice: 不再回答
  rationale: ענה（Qal）通常意为“回答、回应”。结合上下文，未完成式表达约伯此后不作答的决意；“不再”使现代汉语清楚自然，同时不额外限定回答的内容。
- source_word: וּשְׁתַּיִם
  choice: 说了两次
  rationale: 数词“二”与前句“一次”平行，作副词表示“两次”。汉语补出承前省略的“说了”，使句意自然清楚。
- source_word: וְלֹא אוֹסִיף
  choice: 不再多言
  rationale: יסף（Hiphil）可表示“添加、继续、再做”。此处所省略的行动由上文“说”决定，因此译作“不再多言”，传达约伯不继续说下去之意。脚注保留较贴近“添加”的译法及“继续”的语义可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的普通话。两分句保留原文“一次……两次……”的诗性平行结构；第二分句补出“说了”，避免汉语歧义。用“不再多言”自然表达“不再添加（言语）”，并在脚注中保留连接词可作转折及 יסף 可译为“继续”的可能。
