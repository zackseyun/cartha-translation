  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: zh_hans
  text: 你能用鱼叉[a]把它的皮扎满，或用捕鱼的矛[b]把它的头扎满吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带倒钩的铁器”。这里的希伯来词很少见，可能泛指尖锐或带倒钩的狩猎器具。
    reason: lexical_alternative
  - marker: b
    text: 或译“鱼钩”。这里的希伯来表达也可能泛指捕鱼器具；“捕鱼的矛”较能体现本句上下两部分平行的攻击画面。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְמַלֵּא
  choice: 你能……扎满……吗
  rationale: 疑问词与מלא的皮勒未完成式第二人称阳性单数构成反问。按字面是“填满”，但此处指以尖锐器具密集刺入；译作“扎满”既保留“满”的意象，也符合现代汉语表达。
- source_word: בְשֻׂכּוֹת
  choice: 用鱼叉
  rationale: שֻׂכּוֹת是罕见词，可能泛指带尖或带倒钩的狩猎、捕鱼器具。结合上下文及下半句的捕鱼器具，译作“鱼叉”最能呈现攻击大型水生动物的画面，同时用脚注保留词义的不确定性。
- source_word: עוֹרוֹ
  choice: 它的皮
  rationale: 直译动物的皮肤。现代汉语用“皮”自然简洁；代词“它”符合中文指称动物的常规。
- source_word: וּבְצִלְצַל דָּגִים
  choice: 用捕鱼的矛
  rationale: 该结构字面为“鱼的צִלְצַל”，指与捕鱼有关的器具；具体形制并不确定。“捕鱼的矛”与上半句“鱼叉”形成平行，也符合刺向头部的语境；脚注保留“鱼钩”等可能。
- source_word: רֹאשׁוֹ
  choice: 它的头
  rationale: 按通常含义直译，并与上半句“它的皮”保持平行。
theological_decisions: []
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。以“你能……吗”保留原文反问的挑战语气；重复“扎满”使中文句法清楚，并保留两部分的平行结构。
