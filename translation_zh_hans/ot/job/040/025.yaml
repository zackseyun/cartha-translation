  yaml_path: translation/ot/job/040/025.yaml
  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: zh_hans
  text: 你能用鱼钩把利维坦拉上来[a]吗？你又能用绳索压住它的舌头[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你能用钩把利维坦拉出来吗？”
    reason: 希伯来语动词可表示拉出、拖出；其精确方向在此语境中未完全限定。
  - marker: b
    text: 或译：“用绳索使它的舌头沉下去”，或“用绳索按住它的舌头”。希伯来文的意象较难确定，可能是指从口部制伏这只巨兽。
    reason: תַּשְׁקִיעַ 的基本意象是“使下沉、使下去”，但此处绳索如何作用于舌头并不明确。
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: 拉上来
  rationale: 该词是 משׁך 的 Qal 未完成式第二人称阳性单数，在捕鱼语境中表示拉、拖或牵引；“拉上来”自然呈现把水中生物捕获上来的动作。
- source_word: לִוְיָתָן
  choice: 利维坦
  rationale: 这是该生物的专名或称号，采用现代中文圣经读者较熟悉的音译，以避免预先把它等同于某一种动物。
- source_word: בְּחַכָּה
  choice: 用鱼钩
  rationale: חכה 指捕鱼所用的钩；“鱼钩”在现代汉语中明确且符合此处捕捉水中巨兽的语境。
- source_word: וּבְחֶבֶל
  choice: 用绳索
  rationale: חבל 可指绳或索；“绳索”既自然，又不把它过度限定为现代意义上的钓鱼线。
- source_word: תַּשְׁקִיעַ
  choice: 压住
  rationale: שׁקע 的 Hiphil 形式本义为使下沉、使下去。与“舌头”和“绳索”连用时，具体操作方式并不清楚；“压住”表达制服或按下的意象，同时不过度解释。
- source_word: לְשֹׁנוֹ
  choice: 它的舌头
  rationale: 希伯来文明确说“舌头”，应予保留；利维坦在中文中作为动物性生物，以“它”指代自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留两个并列的反问句及希伯来文中难解的口部制伏意象；正文选用易懂的“压住”，脚注保留较直译的可能性。
