  text: הַ֭/אַף תָּפֵ֣ר מִשְׁפָּטִ֑/י תַּ֝רְשִׁיעֵ֗/נִי לְמַ֣עַן תִּצְדָּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: zh_hans
  text: 你竟要废除我的公正吗？难道你要定我有罪，好显明自己为义吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的公正”或译“我的判决”。希伯来语 מִשְׁפָּטִי 可指判决、公正或合法权利。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: 竟……吗
  rationale: 疑问词与אַף连用，加强反问和震惊语气；“竟……吗”在现代汉语中自然地传达这种强调。
- source_word: תָּפֵר
  choice: 废除
  rationale: פרר的Hiphil形式表示使之失效、废止；“废除”保留司法语境中撤销、否定效力的意味。
- source_word: מִשְׁפָּטִי
  choice: 我的公正
  rationale: מִשְׁפָּט可指审判、公正或合法权利。此处涉及上帝公正的治理与裁断；“我的公正”较能涵盖其道德和司法层面，同时以脚注保留“我的判决”这一可能译法。
- source_word: תַּרְשִׁיעֵנִי
  choice: 定我有罪
  rationale: רשע的Hiphil形式具有法庭用语色彩，指宣判某人有罪；“定我有罪”比一般性的“说我是恶的”更准确。
- source_word: לְמַעַן
  choice: 好
  rationale: 此词引出目的或结果；汉语“好……”简洁自然，并保留为了自证为义而定上帝有罪的反问锋芒。
- source_word: תִּצְדָּק
  choice: 显明自己为义
  rationale: צדק在此司法对照中指被判为正、证明有理；“显明自己为义”既保留法律与神学语域，也与前句“定我有罪”形成鲜明对照。
theological_decisions:
- issue: 司法性表达与一般道德性表达之间的选择
  choice: 采用“废除我的公正……定我有罪……显明自己为义”的司法性措辞。
  alternative: 采用“否定我的正义……说我错了，好证明你是对的”等一般道德性措辞。
  rationale: מִשְׁפָּט、רשע、צדק共同构成鲜明的法庭语域。保留这一语域，能呈现约伯与上帝公正之间未被弱化的神学张力。
- issue: מִשְׁפָּטִי的具体所指
  choice: 我的公正
  alternative: 我的判决
  rationale: 上下文不仅可能指一次判决，也涉及上帝施行审判的公正性；正文采用较宽广的“公正”，脚注保留同样成立的“判决”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个反问句保留原文的强烈质问；“定……有罪／显明……为义”维持司法对照。
