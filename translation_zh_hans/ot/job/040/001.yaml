base_translation:
  language: en
  yaml_path: translation/ot/job/040/001.yaml
  text: And Yahweh answered Job and said:[a]
translation:
  language: zh_hans
  text: 雅威回答约伯说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统上也译作“耶和华”。
    reason: 说明神名的原文形式及另一常见传统译名。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在这一叙事引语公式中表示“回答、回应”；译作“回答”既保留对话结构，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是神的专名四字神名（YHWH）。采用现代中文圣经读者熟悉的音译“耶和华”，并以脚注说明其希伯来文形式及另一常见音译。
- source_word: אֶת
  choice: 不另译
  rationale: 这是直接宾语标记，只标明“约伯”为动词的宾语，在汉语中无需对应词。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用该人名在现代中文圣经传统中的通行译名。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר的基本义为“说”。希伯来文“回答……说”在汉语中自然且庄重，并保留原文两个言说动词的结构。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文采用中文读者最熟悉的专名形式“耶和华”，脚注同时交代希伯来文YHWH及“雅威”这一常见拟音，以免把专名误作称号。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“回答约伯说”保留希伯来叙事公式，在中文中亦通顺。
