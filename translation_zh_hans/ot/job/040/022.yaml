  text: The lotus trees cover him with their shade[b][a]; the willows of the brook surround him.
translation:
  language: zh_hans
  text: 莲树[a]的树荫遮蔽它；溪边的柳树[b]环绕它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “莲树”或译“遮荫树”；צֶאֱלִים所指的具体植物不能确定，传统上译作“莲树”。
    reason: lexical_alternative
  - marker: b
    text: “溪边的柳树”或译“河谷中的杨树”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: 遮蔽它
  rationale: 源自动词סכך，表示遮盖、庇护；“遮蔽”自然承接下文的树荫意象，同时保留直接覆盖之意。
- source_word: צֶאֱלִים
  choice: 莲树
  rationale: 该词所指植物不能完全确定；“莲树”沿用传统辨识，并以脚注保留“荫树”的可能译法。
- source_word: צִלֲלוֹ
  choice: 以荫影
  rationale: צֵל可指阴影或遮荫；“荫影”在此既表达树木投下的影子，也体现其遮荫作用。
- source_word: יְסֻבּוּהוּ
  choice: 环绕它
  rationale: סבב意为围绕、环绕；此译法简洁地保留原文的空间画面。
- source_word: עַרְבֵי נָחַל
  choice: 溪边的柳树
  rationale: עַרְבֵי可指柳树或杨树一类的河岸树木，נָחַל可指溪流、河谷或季节性水道；“溪边的柳树”符合本节水边栖息地的诗意描写，并以脚注保留另一种辨识。
