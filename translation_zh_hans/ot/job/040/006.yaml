base_translation:
  language: en
  yaml_path: translation/ot/job/040/006.yaml
  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: zh_hans
  text: 于是，耶和华从风暴中回答约伯说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从旋风中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: 于是……回答
  rationale: 叙事性连接词推进情节；“于是”自然体现先后承接，ענה在这里意为“回答”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名形式呈现四字神名，不以称号替代。
- source_word: אֶת אִיּוֹב
  choice: 回答约伯
  rationale: אֵת标明约伯是动词的直接宾语；现代汉语说“回答约伯”自然简洁。
- source_word: מן סערה
  choice: 从风暴中
  rationale: סְעָרָה可指风暴、暴风或旋风；“风暴”保留较宽的语义范围及神显场景的气象意象。
- source_word: וַיֹּאמַר
  choice: 说：
  rationale: 这是引出下文直接引语的常规叙事表达；中文无需机械重复连接词，冒号提示后续话语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文圣经传统中辨识度最高的专名“耶和华”，保留其作为名字而非称号的性质。“雅威”则是另一种较贴近学界拟音的译法。
- issue: מן סערה所呈现的神显意象
  choice: 从风暴中
  alternative: 从旋风中
  rationale: 原词可泛指猛烈风暴，也可理解为旋风；正文避免将形态限定得过窄，并在脚注保留传统且可成立的另一译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文，“说：”直接引出下一节；整体尽量贴近希伯来叙事句法，同时避免生硬重复。
