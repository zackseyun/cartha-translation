lexical_decisions:
- source_word: תַּחַת
  choice: 在……之下
  rationale: 表达位于某物下方的空间关系，符合现代汉语习惯。
- source_word: צֶאֱלִים
  choice: 莲树
  rationale: 结合河泽环境，采用常见的语境性辨识；但具体树种不能确定，因此用脚注保留另一种理解。
- source_word: יִשְׁכָּב
  choice: 躺
  rationale: 该未完成式在此描写这动物惯常或鲜明的姿态；“躺”简洁自然。
- source_word: בְּסֵתֶר
  choice: 藏在……荫蔽处
  rationale: סֵתֶר兼有隐蔽、遮蔽之意；此译既呈现藏身状态，也保留植物提供遮蔽的画面。
- source_word: קָנֶה
  choice: 芦苇
  rationale: 原文虽为单数形式，却可作集合名词，指一片芦苇植被。
- source_word: וּבִצָּה
  choice: 和沼泽
  rationale: 指沼泽或湿地，与上下文的河岸生态相符，并不额外限定泥泞程度。
