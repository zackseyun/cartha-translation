  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: zh_hans
  text: 你岂能把它当作小鸟逗着玩？又岂能把它拴起来给你的女孩们？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女孩们”也可译作“少女们”或“年轻女子们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: 你岂能……逗着玩
  rationale: שׂחק在此可指玩耍或拿来取乐；结合反问和小鸟的比喻，“逗着玩”自然地表达把巨兽当作宠物或玩物的画面。
- source_word: בּוֹ
  choice: 拿它
  rationale: 希伯来语使用阳性单数代词，回指利维坦；现代汉语称动物通常用“它”，不必机械体现语法性别。
- source_word: כַּצִּפּוֹר
  choice: 当小鸟
  rationale: צִפּוֹר泛指鸟；在宠物般把玩的语境中译作“小鸟”，既自然又保留强烈的反差。
- source_word: וְתִקְשְׁרֶנּוּ
  choice: 或把它拴起来
  rationale: קשר意为捆绑、系住；“拴起来”适合约束动物的具体画面，也符合现代汉语。
- source_word: לְנַעֲרוֹתֶיךָ
  choice: 给你的女孩们
  rationale: נַעֲרוֹת指年轻女子或少女；“女孩们”通俗自然，并保留其阴性复数及年轻含义。
