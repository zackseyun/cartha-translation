  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: zh_hans
  text: 看哪，我微不足道[a]，我能回答你什么呢？我用手捂住嘴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我算不得什么”；传统译法作：“我卑贱。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引起注意并引出约伯回应的语气词；“看哪”庄重而易懂，也保留突然醒悟、郑重承认的语气。
- source_word: קַלֹּתִי
  choice: 我微不足道
  rationale: 该词源于 קלל，在此表达轻微、卑微、不足轻重，而非明确指道德败坏；“微不足道”贴合约伯在上帝面前自觉渺小的语境。
- source_word: מָה אֲשִׁיבֶךָּ
  choice: 还能回答你什么呢
  rationale: אֲשִׁיבֶךָּ 在此意为“回答你”；加“还……呢”自然传达反问以及无言可答的含义，又不把问题改写成绝对能力判断。
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: 我只好用手捂住自己的嘴
  rationale: 保留手与嘴的具体动作。“捂住……嘴”是现代汉语中自然对应的表达，显示停止发言；“只好”承接前面的反问，明示语境中的无言，但不另加认罪等含义。
theological_decisions:
- issue: 约伯的自我描述是否应译成带有强烈道德贬义的词
  choice: 我微不足道
  alternative: 我卑贱／我是污秽的
  rationale: קַלֹּתִי 更直接表示轻微、不足轻重或卑微。译作“污秽”会把经文未明确表达的道德败坏或罪污观念带入本节；正文保留约伯自觉渺小、不配作答的张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“看哪”保留诗体和郑重语气；“微不足道”避免古奥及过强的道德定性。末句以自然汉语呈现沉默的动作意象。
