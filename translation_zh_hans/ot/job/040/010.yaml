base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: zh_hans
  text: 请你以威严和崇高装扮自己[a]，披上荣光和尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“现在以骄傲和高傲装扮自己，披上荣耀和威仪。”希伯来语נָא可表示“请”或“现在、来吧”一类的强调语气；גָאוֹן与גֹבַהּ也可能带“骄傲、高傲”的色彩，而הוֹד与הָדָר可译为“荣耀、威仪”。
    reason: 保留语气词及尊荣词的词汇替代可能性，并使替代译文中“高傲”对应גֹּבַהּ。
lexical_decisions:
- source_word: עֲדֵה
  choice: 装饰自己
  rationale: 这是阳性单数祈使式，在此表示用某物装扮自己；“装饰自己”既贴近原文，也与下半句“披上”的衣着意象相呼应。
- source_word: נָא
  choice: 请
  rationale: 此语气词可表达请求、催促或强调；在上帝向约伯发出挑战的语境中，“请”保留了带有反诘意味的敦促语气。
- source_word: גָאוֹן
  choice: 威严
  rationale: 该词可指高升、威荣，也可带“骄傲”之意；本节与其他彰显王者气象的词并列，正文采用“威严”，同时在脚注保留负面含义的可能。
- source_word: גֹבַהּ
  choice: 崇高
  rationale: 本义为“高度”，也可指高傲；与 גָאוֹן 并列时，“崇高”自然表达高超尊贵的气势，又不强加负面的道德判断。
- source_word: הוֹד
  choice: 荣光
  rationale: 该词表示可见的光荣、壮丽或威仪；“荣光”保留其显赫灿烂的意味，并与相邻词有所区分。
- source_word: הָדָר
  choice: 尊荣
  rationale: 该词可表示尊贵、华美、威仪；“尊荣”在现代汉语中庄重自然，也适合这里君王般的衣饰意象。
- source_word: תִּלְבָּשׁ
  choice: 披上
  rationale: 该未完成式承接前面的命令语气，字面是“穿上”；“披上”简洁自然，并明确保留把抽象属性当作衣服穿戴的比喻。
theological_decisions:
- issue: גָאוֹן 和 גֹבַהּ 应译作负面的“骄傲、高傲”，还是正面的威荣与崇高
  choice: 正文译为“威严和崇高”，表现上帝挑战约伯披戴唯有神才具备的王者威荣。
  alternative: 可译为“骄傲和尊贵”或“骄傲和高傲”，突出这些词可能具有的负面道德色彩。
  rationale: 上下文要求约伯若能像神一样治理世界，就当先披戴相称的威荣；本节后半的“荣光和尊荣”也支持正面的王权语义。不过，相关希伯来词确可带“骄傲、高傲”之意，因此以脚注保留这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“装饰自己”与“披上”保留原文平行的衣着意象；四个名词分别译为“威严、崇高、荣光、尊荣”，尽量呈现诗句层叠铺陈的效果而不机械重复。
