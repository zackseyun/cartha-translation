  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: zh_hans
  text: 那么，连我也要称赞你，因为你的右手能救你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“能为你自己施行拯救。”希伯来文带有表示受益对象的介词，直译近于“为你／为你自己”。
    reason: 保留לְךָ所含的受益或反身意味，以及原文句法可能容许的另一种表达。
lexical_decisions:
- source_word: וְגַם
  choice: 那时，连……也
  rationale: 承接上一节的条件性挑战，并表达强调；“那时，连我也”符合现代汉语表达。
- source_word: אֲנִי
  choice: 我
  rationale: 保留原文显式代词的强调，表明说话者上帝亲自作出承认。
- source_word: אוֹדֶךָ
  choice: 称赞你
  rationale: ידה的Hiphil形式在此表示赞许、称赞；上下文是若约伯真能显明这种能力，上帝便会称赞他。
- source_word: כִּי
  choice: 因为
  rationale: 自然地引出上帝称赞约伯的理由。
- source_word: תוֹשִׁיעַ
  choice: 能救
  rationale: ישׁע的Hiphil形式意为拯救、解救；在前文假设性挑战的语境中，重点是约伯是否具备这种能力，因此译为“能救”而非单纯预告性的“将救”。
- source_word: לְךָ
  choice: 你
  rationale: 介词לְ表示受益对象，可理解为“为你／为你自己”；正文采用自然的汉语“救你”，并以脚注保留原文结构及另一种表达。
- source_word: יְמִינֶךָ
  choice: 你的右手
  rationale: 保留希伯来文以“右手”象征力量的具体意象，不直接释义为“你自己的力量”。
theological_decisions:
- issue: 以“右手”拟人化地表达能力
  choice: 你的右手能救你
  alternative: 你自己的力量能救你
  rationale: 原文使用具体的“右手”意象来表示力量。正文保留这一隐喻，避免把意象直接化约为解释。
- issue: 约伯自救能力的假设性陈述
  choice: 能救
  alternative: 将要拯救
  rationale: 这句话延续上文的挑战，表达若约伯能做到，上帝便予以称赞；译为“能”凸显所受质疑的是能力，不把它误读为必然实现的预言。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“那时，连我也”既承接前文条件，又保留强调；“右手”保留原文诗性意象。
