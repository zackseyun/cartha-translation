  text: ה֭וּא רֵאשִׁ֣ית דַּרְכֵי אֵ֑ל הָ֝/עֹשׂ/וֹ יַגֵּ֥שׁ חַרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/019.yaml
  text: He is the first of the works of God[b][a]; only his Maker can bring near his sword.
translation:
  language: zh_hans
  text: 它在上帝的作为中居首[a]；造它的那位把他的刀剑带近[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它是上帝诸道路之首。”这里的“居首”也可理解为“最先”或“首要”。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来文较难确定。也可理解为：“造它的那位持刀接近它”；或“造它的那位把刀剑赐给了它”。“他的刀剑”中的“他的”所指也不能完全确定。
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: 居首
  rationale: 该词可表示起初，也可表示首位或卓越地位；结合上下文对巨兽在受造界中地位的描述，“居首”自然地保留了先后与尊位两方面的可能性。
- source_word: דַּרְכֵי אֵל
  choice: 上帝的作为
  rationale: דֶּרֶךְ本义为“道路”，也可指行事、活动或作为；在创造语境中译作“作为”更符合现代汉语，同时用脚注保留“道路”的形式对应。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是常用的神圣称号，译作“上帝”清楚自然，不额外强化其词源所含的能力色彩。
- source_word: הָעֹשׂוֹ
  choice: 造它的那位
  rationale: 保留带定冠词分词及宾语后缀的关系结构，即“造它的那一位”，并与前句的受造物形成清楚对应。
- source_word: יַגֵּשׁ
  choice: 使……临近
  rationale: נגשׁ的使役形通常表示“使靠近、带到近前”；这一译法贴近动词形态，又不擅自确定临近的具体方式。
- source_word: חַרְבּוֹ
  choice: 他的刀剑
  rationale: 第三人称阳性单数后缀直译为“他的”；中文如此表达可保留其最自然地回指造物者的理解，而脚注说明整句尚有其他解释。
theological_decisions:
- issue: 末一分句的句法和所指
  choice: 惟有造它的那位，才能使他的刀剑临近
  alternative: 惟有造它的那位能持刀接近它；或：造它的那位把刀剑赐给了它
  rationale: 希伯来文高度凝练，动词的论元以及“他的刀剑”所指均有争议。正文尽量依照词序和使役动词的基本意义，并以“惟有……才”表达前置主语可能具有的排他重点；脚注列出主要异读，不将某一神学理解写死。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“它”指上文的巨兽；“那位”用于指造物者，既自然又避免加入经文未明说的专名。正文保留末句的凝练和歧义，具体解释置于脚注。
