  text: הִנֵּה נָ֣א כֹח֣/וֹ בְ/מָתְנָ֑י/ו וְ֝/אֹנ֗/וֹ בִּ/שְׁרִירֵ֥י בִטְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/016.yaml
  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: zh_hans
  text: 看吧，它的力量在腰间；它的劲力在腹部的肌肉[a]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肌肉”也可译为“筋腱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 看哪
  rationale: הִנֵּה用于引人注意，נָא加强当下的催请或强调语气；“看哪”简洁而庄重，保留了原文鲜明的指示意味。
- source_word: כֹחוֹ
  choice: 它的力量
  rationale: כֹחַ在此指身体的力量；“力量”准确、自然，并与下半句近义平行。
- source_word: בְמָתְנָיו
  choice: 在腰间
  rationale: מָתְנַיִם指腰、胯一带；“腰间”既保留范围感，也符合现代汉语的诗体表达。
- source_word: וְאֹנוֹ
  choice: 它的劲力
  rationale: אוֹן可指力量、精力或旺盛之力；“劲力”突出身体蕴含的强健力量，同时保留与כֹחַ近义而不完全重复的诗歌平行。
- source_word: בִּשְׁרִירֵי
  choice: 在……肌肉中
  rationale: שְׁרִירִים可指肌肉、筋腱或结实的肉体部分；正文采用现代读者最易理解的“肌肉”，并以脚注保留词义上的另一可能。
- source_word: בִטְנוֹ
  choice: 腹部
  rationale: בֶּטֶן在此为身体解剖意义，指腹部；“腹部”比“肚子”更庄重，也适合这里对受造物身体结构的描写。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；用“它”指前文所述的受造物。以“力量／劲力”呈现希伯来诗歌中כֹחַ与אוֹן的近义平行，不把两者解释成不同种类的能力。
