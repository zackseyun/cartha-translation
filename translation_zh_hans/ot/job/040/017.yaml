  yaml_path: translation/ot/job/040/017.yaml
  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
translation:
  language: zh_hans
  text: 它使尾巴挺直如香柏树；大腿的筋腱[a]紧密交织。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大腿的筋腱”或可译作“腰胯的筋”，更具体地也可能指“生殖器官的肌腱或筋肉”；希伯来语原词含义不确定，解释有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: 使……挺直
  rationale: 该动词通常有“喜爱”之意，但在此支配“尾巴”，又以香柏树为喻，显然描述身体动作或状态。“使……挺直”贴合坚挺有力的意象，同时不引入情感意义。
- source_word: זְנָבוֹ
  choice: 它的尾巴
  rationale: 按名词及第三人称阳性单数后缀直译；现代汉语以“它”指称前文所述动物。
- source_word: כְמוֹ אָרֶז
  choice: 如香柏树
  rationale: 保留直接比喻以及香柏树高大坚实的意象；“如”简洁而具有诗体庄重感。
- source_word: גִּידֵי
  choice: 筋腱
  rationale: גיד指筋、腱；“筋腱”是现代汉语中自然明确的身体用语，也保留原文具体有力的描写。
- source_word: פחדו
  choice: 大腿的
  rationale: 此词在本节含义不确定；正文采用语境上较易理解且较含蓄的“大腿”，但以脚注保留“腰胯”及生殖器官相关的可能解释。
- source_word: יְשֹׂרָגוּ
  choice: 紧密交织
  rationale: 该动词表示交缠、编织；“紧密交织”自然呈现筋腱彼此盘结、强健有力的图景。
