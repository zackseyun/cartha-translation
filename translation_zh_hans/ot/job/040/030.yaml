  yaml_path: translation/ot/job/040/030.yaml
  text: Will traders bargain over him? Will they divide him among the merchants?[a][b]
translation:
  language: zh_hans
  text: 商贩岂会为它讨价还价？岂会把它分给众商人？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“同伴岂会以它为宴？”第一小句的希伯来文含义不易确定；有些人把“商贩”所对应的词理解为非商业意义的“同伴”。
    reason: alternative_reading
  - marker: b
    text: “商人”原文直译为“迦南人”；在这里很可能是指商人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ
  choice: 讨价还价
  rationale: כרה通常意为“挖掘”，但与介词עַל及本节商业语境连用时，宜理解为围绕某物议价、谈交易；译为“讨价还价”自然地表达这一习语意义。
- source_word: עָלָיו
  choice: 为它
  rationale: 这里的עַל表示交易或议价所针对的对象；现代汉语用“为它讨价还价”较自然。
- source_word: חַבָּרִים
  choice: 商贩
  rationale: 该词通常可指同伴或结伴者，但下半句的“商人”使商业含义更可能；正文采用“商贩”，同时以脚注保留非商业解释。
- source_word: יֶחֱצוּהוּ
  choice: 把它分给
  rationale: חצה意为“分开、分配”。这里不明确说明宰割，因此不译作“把它切开”，而保留较宽泛的分配意义。
- source_word: בֵּין
  choice: 给众
  rationale: בֵּין后接复数群体，在此表达在多人之间分配；汉语用“分给众商人”最自然。
- source_word: כְּנַעֲנִים
  choice: 商人
  rationale: 字面为“迦南人”，但该称谓在希伯来语中可转指商人；本节的交易语境支持正文译作“商人”，并以脚注注明字面形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的疑问句式。“它”承接本段所说的巨兽，避免在希伯来文未明确性别之处使用“他”。两处反问保持原文平行结构；疑难词义及“迦南人”的字面形式均由脚注保留。
