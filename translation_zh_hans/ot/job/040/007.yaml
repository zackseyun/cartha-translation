    issue: “你来指教我”超出וְהוֹדִיעֵנִי的基本使役语义。
    rationale: 该词的核心是“使我知道、告诉我”。上下文的挑战和反讽可以由话语情境呈现，但“指教”含有教导、传授的附加语义。
  - severity: low
    issue: “束腰准备”加入了“准备”这一解释性成分。
    rationale: 束腰本身在原文语境中具有整装应对的含义，但“准备”并非明说。译为“束好腰带”既保留具体动作，也符合现代中文习惯。
  - severity: low
    issue: 脚注的“准备迎战”过度具体化。
    rationale: 原文要求整装面对问话，并未明说战斗；“迎战”会将挑战隐喻实体化。
