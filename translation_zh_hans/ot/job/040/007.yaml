- from: 你要像男子汉一样束腰准备[a]；我要问你，你来指教我。
  to: 你要像男子汉一样[a]束好腰带；我要问你，你要告诉我。
  rationale: 修订删除“准备”和“迎战”等解释性扩展，并将“指教我”调整为“告诉我”，使译文更紧密对应希伯来文的命令与使役结构。保留“男子汉”及脚注中的“勇士”替代译法，以呈现גבר的性别和力量色彩而不将后者定为正文。
