  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: zh_hans
  text: 你要像男子汉一样[a]束好腰带；我要问你，你要告诉我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像勇士一样束好腰带。”希伯来文直译为“像男子汉一样束起你的腰”。
    reason: 说明גבר可含刚强、勇士的意味，同时保留正文对阳性称谓及“束腰”动作意象的对应；避免加入“迎战”这一原文未明说的情节。
lexical_decisions:
- source_word: אֱזָר נָא ... חֲלָצֶיךָ
  choice: 你要……束腰准备
  rationale: אזר意为束上、系紧，与“腰”构成准备行动或迎接挑战的具体习语；译作“束腰准备”既保留身体意象，也让现代读者明白其含义。语气词נָא在这里加强催促或挑战的语气，中文由“你要”及上下文承载，不另译成容易显得客套的“请”。
- source_word: כְגֶבֶר
  choice: 像男子汉一样
  rationale: גבר指成年男子，并常带刚强、有力量的意味。“男子汉”比单纯的“男人”更自然地传达此处迎接挑战的语气，同时保留原文的男性表达；“勇士”作为可能的语境化译法列入脚注。
- source_word: אֶשְׁאָלְךָ
  choice: 我要问你
  rationale: שאל的基本义是询问。这里是上帝向约伯发出挑战性的诘问；“问你”保留基本词义，其严厉和审问色彩由语境表达。
- source_word: וְהוֹדִיעֵנִי
  choice: 你来指教我
  rationale: ידע的使役式意为“使我知道、告知我”。“你来指教我”自然表达命令式的反讽挑战，也保留让对方告知说话者的因果方向；相较“回答我”，它没有抹去使役含义。
theological_decisions:
- issue: גבר的性别与力量色彩
  choice: 像男子汉一样
  alternative: 像勇士一样；像刚强的人一样
  rationale: 原文以阳性单数称呼约伯，并用常含力量色彩的גבר。正文不将其性别含义中性化，也不把“勇士”这一较具体的语境推断直接写入正文，而在脚注中保留该译法。
- issue: וְהוֹדִיעֵנִי的挑战性语气
  choice: 你来指教我
  alternative: 你要告诉我；你要回答我
  rationale: 此话在上下文中带有反讽和挑战意味，但译文不额外加入“若能”等解释性措辞；“指教我”让这种张力自然显现，同时维持“使我知道”的原文结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“束腰准备”保留古代动作意象，却用“准备”点明习语功能；“男子汉”符合挑战语境，但借脚注呈现“勇士”的可能译法。分号保留两组命令与宣告之间的紧密推进。
