review_pass:
  verdict: revise
  source_fidelity: 原文的结构是两个命令性挑战：先命约伯“像男子一样束腰”，继而说“我要问你；你要使我知道”。草案的“束腰准备”可通，但补入了原文未明说的“准备”；“你来指教我”则把使役式“使我知道／告诉我”强化为“教导我”，超出基本语义。修订以“束好腰带”传达中文中相应的动作习语，并以“告诉我”保留使役方向。
  naturalness: “你要像男子汉一样束好腰带；我要问你，你要告诉我。”在现代标准普通话中自然、庄重，也保持神谕式挑战的简洁有力。“男子汉”比“男子”更能在中文中自然承载此处的刚强挑战语境，且未具体化为“勇士”。
  terminology: 保留“男子汉”以对应גבר的阳性及力量联想；不将其解释性改为“勇士”。将“指教我”改为“告诉我”，以准确对应וְהוֹדִיעֵנִי（使我知道），而不预设额外的讽刺性“教导”含义。
  issues:
