  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: zh_hans
  text: 难道你有像上帝的膀臂一样的膀臂，能用像他那样的声音发出雷鸣吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 难道……吗
  rationale: 承接上文的反问与挑战；用“难道”自然表达希伯来语在此的连续和质问语气。
- source_word: זְרוֹעַ
  choice: 臂膀
  rationale: 保留“手臂”的具体意象及其所蕴含的力量含义，而不直接抽象化为“能力”或“权能”。
- source_word: כָּאֵל
  choice: 像上帝一样的
  rationale: 上下文是上帝亲自向约伯发问，אֵל在此最自然地指上帝；“像上帝一样的臂膀”也自然补足了比较关系。
- source_word: לָךְ
  choice: 你有
  rationale: 字面为“属于你／对你”，在此采用现代汉语自然的领有表达。
- source_word: וּבְקוֹל כָּמֹהוּ
  choice: 能发出像他那样的雷声
  rationale: בְקוֹל表示借声音发出雷鸣；中文将“声音”的比较融入“雷声”，既顺畅又保留与上帝之声的比较。
- source_word: תַרְעֵם
  choice: 发出……雷声
  rationale: 该词表达发雷鸣或使雷声响起；保留雷霆意象，不弱化为一般的“吼叫”。
theological_decisions:
- issue: אֵל在神性比较中的所指
  choice: 上帝
  alternative: 一位神／神明
  rationale: 直接语境中说话者是以色列的上帝，并以自身独有的能力向约伯发问，因此专指“上帝”最符合上下文；脚注保留较不可能的泛指理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“臂膀”保留原文身体意象，“发出……雷声”保留风暴显现的联想；反问结构简洁有力。
