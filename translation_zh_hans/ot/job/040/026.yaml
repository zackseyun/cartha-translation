  language: zh_hans
  text: 你能把苇绳穿过它的鼻子[a]，用钩子刺透它的下颌[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苇绳”或译“芦苇”。希伯来语 אַגְמוֹן 本指芦苇或灯心草；此处很可能指用这类植物制成的绳索。
    reason: lexical_alternative
  - marker: b
