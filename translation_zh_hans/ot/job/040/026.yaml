    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: 你能……吗
  rationale: 疑问词 הֲ 与未完成式构成向约伯发出的反问；“你能……吗”自然传达挑战意味。
- source_word: אַגְמוֹן
  choice: 苇绳
  rationale: 该词本义为芦苇、灯心草；在制服巨兽的语境中，很可能指以此类植物制成的绳索。“苇绳”兼顾字面意象和实际功能。
- source_word: בְּאַפּוֹ
  choice: 穿进它的鼻子
  rationale: אַף 可指鼻子或鼻孔；结合“放置苇绳”的动作，“穿进”清楚呈现以绳索穿鼻控制动物的图景，同时不强行指定单一鼻孔。
- source_word: וּבְחוֹחַ
  choice: 用钩子
  rationale: חוֹחַ 可指刺、荆棘或钩子；此处与捕捉、制服动物的场景相符，译作“钩子”最自然。
- source_word: תִּקּוֹב
  choice: 刺透
  rationale: 动词 נקב 表示刺穿、穿孔；“刺透”简洁而具象。
- source_word: לֶחֱיוֹ
  choice: 它的腮帮
  rationale: לְחִי 可指腮颊或下颌。主文采用现代汉语中具体自然的“腮帮”，并在脚注保留“下颌”这一语境性译法。
