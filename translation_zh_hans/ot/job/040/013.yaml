  text: 将他们一同藏在尘土中[a]；在隐秘之处束住他们的脸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将他们一同埋在尘土中。”希伯来语动词既可指“隐藏”，在此语境中也可暗示埋葬。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在隐蔽中束住他们的脸。”原文末句较难确定，很可能指隐秘之处，并与句首的“藏”相呼应。
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: 把他们……藏
  rationale: טמן的基本义是“隐藏、藏匿”；结合“尘土”可暗示埋葬，但正文保留基本词义及其与句末בַּטָּמוּן的呼应。
- source_word: בֶּעָפָר
  choice: 在尘土中
  rationale: עָפָר通常指尘土、松散的土；“尘土”既符合诗体，也保留本段与死亡相关的意象。
- source_word: יָחַד
  choice: 一同
  rationale: 作副词表示集体、同时受处置；“一同”简洁自然。
- source_word: פְּנֵיהֶם
  choice: 他们的脸
  rationale: 直译为“他们的脸”；保留具体意象，不改释为“他们本人”。
- source_word: חֲבֹשׁ
  choice: 束缚
  rationale: חבשׁ的核心义为捆绑、束缚；此处虽可能带有限制或禁闭意味，仍保留其词汇核心。
- source_word: בַּטָּמוּן
  choice: 在隐秘之处
  rationale: 很可能是源于טמן的名词化或被动形式，指隐藏之处或隐蔽状态；此译既自然，也保留与句首“藏”的词根呼应。
