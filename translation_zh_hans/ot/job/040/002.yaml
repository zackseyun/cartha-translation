  yaml_path: translation/ot/job/040/002.yaml
  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: zh_hans
  text: 与全能者争辩的人，竟要纠正他吗？与上帝争辩的，就回答吧[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向全能者挑错的人，竟要训诲或责备他吗？”希伯来语兼有争讼与纠正、责备的意味。
    reason: lexical_alternative
  - marker: b
    text: “回答吧”也可译作“回答这件事”“回答这话”或“回答他”。希伯来语后缀所指含蓄，可能指刚才提出的问题或争议，而不一定直接指上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: 争辩的人
  rationale: 源自ריב，含争讼、争辩之意；在本段语境中指人向上帝提出争议或与他争论。译作“争辩的人”既自然，也保留司法辩论色彩。
- source_word: עִם
  choice: 与
  rationale: 基本义为“与、同”；在争辩语境中带有对抗意味。“与全能者争辩”可同时传达字面关系和敌对语气。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是《约伯记》中常见的上帝称号；采用通行的意译，避免不必要的音译。
- source_word: יִסּוֹר
  choice: 纠正他
  rationale: יסר可表示管教、训诲、责备或纠正。按本句语法和平行关系，人是动作主体，语意是人竟想纠正全能者；“竟要”体现反问语气，却不把它改写为单纯的能力问题。
- source_word: מוֹכִיחַ
  choice: 辩论的人
  rationale: יכח可指争辩、申辩、责备或断定是非。这里与前半句的“争辩”及后面的“回答”相呼应，“辩论的人”在现代汉语中清楚地保留了争讼意味。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是诗歌体中指上帝的单数形式，在《约伯记》中直接译作“上帝”最为自然，不额外加入原文没有的强调。
- source_word: יַעֲנֶנָּה
  choice: 回答这话
  rationale: ענה意为“回答”。其阴性单数后缀所指较为含蓄，较可能回指刚提出的话、问题或争议，因此正文译为“这话”，同时以脚注保留“回答他”等可能。
theological_decisions:
- issue: 本节是说人企图纠正上帝，还是说与上帝争辩的人应当受管教
  choice: 把争辩者理解为יִסּוֹר的主语，即人竟企图纠正全能者。
  alternative: 理解为与全能者争辩的人应当接受纠正或管教。
  rationale: 句法及两分句的平行关系更支持前一种读法：前半句问争辩者是否竟要纠正全能者，后半句随即命令与上帝辩论的人作答。这样保留了上帝责问约伯的锋芒，同时不添加宗派性解释。
- issue: יַעֲנֶנָּה的宾语所指
  choice: 正文理解为回答刚才提出的这话或问题。
  alternative: 理解为回答上帝本人，或回答这件事。
  rationale: 阴性单数后缀不自然地直接指阳性称谓אֱלוֹהַּ，较可能指隐含的话语、争议或问题；但原文指代压缩而含蓄，故以脚注保留其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“竟要……吗”传达希伯来语反问中的责问语气；“争辩／辩论”保留法律争讼色彩，同时普通读者易懂。正文中的[a][b]与脚注逐一对应。
