  text: וַ/יְחִ֤י אִיּוֹב֙ אַֽחֲרֵי זֹ֔את מֵאָ֥ה וְ/אַרְבָּעִ֖ים שָׁנָ֑ה ו/ירא אֶת בָּנָי/ו֙ וְ/אֶת בְּנֵ֣י בָנָ֔י/ו אַרְבָּעָ֖ה דֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: zh_hans
  text: 这事以后，约伯又活了一百四十年，见到了他的儿子和孙子[a]，前后四代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他的儿子和他儿子的儿子”。
    reason: 说明“孙子”所对应的希伯来文较为具体的字面结构。
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 此处叙述约伯在前述复兴之事以后继续活着；“又活了”既表达延续，也符合现代汉语叙事习惯。
- source_word: אַחֲרֵי זֹאת
  choice: 这事以后
  rationale: 该短语表示相对于前述事件的随后时间；“这事以后”简洁自然，并保留单数指示语的形式。
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: 一百四十年
  rationale: 直接、准确地呈现希伯来文的年数。
- source_word: וַיַּרְא
  choice: 见到了
  rationale: ראה的基本义为“看见”；“见到了”在汉语中自然表达约伯有生之年亲见后代，同时没有把经文改写成解释性更强的“活着看到”。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 希伯来文使用阳性复数“儿子”，故不泛化为“儿女”或“孩子”。
- source_word: בְּנֵי בָנָיו
  choice: 孙子
  rationale: 字面为“他儿子的儿子”；“孙子”是现代汉语中自然且保持男性所指的对应表达，字面形式在脚注说明。
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: 前后四代
  rationale: “四代”说明约伯所见后代延续的范围；加入“前后”使独立的数量短语在汉语中衔接自然，而不武断规定约伯本人是否计入四代。
theological_decisions:
- issue: “四代”是否包括约伯本人
  choice: 保留为“前后四代”，不明确指定计算起点
  alternative: 直到第四代；包括约伯在内共四代
  rationale: 希伯来文只说“四代”，没有明言是否将约伯本人计入；译文保留这一范围上的含混，避免作经文未明说的世代计算。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“又活了”体现前文之后生命的延续；“见到了”保持原文“看见”的直接表达。数字用汉字书写，适合中文圣经正文。
