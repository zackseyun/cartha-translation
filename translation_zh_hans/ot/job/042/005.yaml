base_translation:
  language: en
  yaml_path: translation/ot/job/042/005.yaml
  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: zh_hans
  text: 我从前只是听说过你；但现在，我亲眼看见了你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: 只是耳闻
  rationale: 希伯来语直译为“凭耳朵的听闻”，是由“听闻”和“耳朵”构成的表达。中文“耳闻”自然简洁，保留了间接得知的含义，也与下半句的“亲眼看见”形成鲜明对照；“只是”把这种对照明确表达出来。
- source_word: שְׁמַעְתִּיךָ
  choice: 我从前……耳闻你
  rationale: 原文直译可作“我听见了你”，但本节将以耳听闻与如今亲眼看见对举，语境更偏向从传闻中得知神。“从前”与“现在”相对，表达原文完成式在此所指的先前经历。
- source_word: וְעַתָּה
  choice: 但现在
  rationale: 连接词在这里带出先前间接听闻与如今直接看见之间的强烈转折，译作“但现在”符合现代汉语表达。
- source_word: עֵינִי
  choice: 我亲眼
  rationale: 原文“我的眼”是单数。现代汉语若直译“我的眼看见”较生硬；“亲眼”自然地保留视觉意象和亲身、直接的意味，并与“耳闻”相对。
- source_word: רָאָתְךָ
  choice: 看见了你
  rationale: 直译“看见你”，不改译为“认识”或“感知”，以保留原文关于“看见”神之性质的开放性。“了”表示这一经历已经发生并具有当前意义。
theological_decisions:
- issue: 约伯“看见”神的性质
  choice: 直译为“亲眼看见了你”，不加限定
  alternative: 亲自认识了你；直接经历了你
  rationale: 原文使用普通的“看见”一词，并以听闻和看见构成对照。译文不把它预先解释为纯粹比喻性的认识，也不界定为对神本体的完全目睹，从而保留经文本身的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耳闻”与“亲眼看见”形成清楚、凝练的诗性对照；避免生硬照搬“耳朵的听闻”，同时用脚注保留原文形式。
