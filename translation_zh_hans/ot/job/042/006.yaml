  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
translation:
  language: zh_hans
  text: 因此，我厌弃自己[a]，在尘土和灰烬中悔改。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因此，我收回（所说的话），并对尘土和灰烬改变心意。”希伯来文十分简练且有争议：“我厌弃／拒绝”的对象没有明说；“我悔改”也可译为“我后悔”“我改变心意”，或“我得安慰”。末句亦可理解为“关于尘土和灰烬”。
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接第5节以及上文上帝的发言，表达约伯由此得出的结论；“因此”自然保留了希伯来语的推论关系。
- source_word: אֶמְאַס
  choice: 我厌弃自己
  rationale: מאס通常表示“厌弃、拒绝”。原文没有明说宾语；正文依语境补出“自己”，表达约伯在见到上帝后的自我降卑，但用脚注保留“收回前言”等不补自我宾语的可能解释。
- source_word: וְנִחַמְתִּי
  choice: 悔改
  rationale: נחם的尼法勒式可依语境表示后悔、回心、改变心意或得安慰。这里作为约伯面对上帝后的回应，“悔改”最简明自然，同时其语义上的争议在脚注中说明。
- source_word: עַל
  choice: 在……中
  rationale: עַל本可表示“在……之上、关于”。与“尘土和炉灰”连用时，译为“在……中”能自然表达哀恸、卑微的处境；“关于”则属于另一种可行句法理解，保留于脚注。
- source_word: עָפָר וָאֵפֶר
  choice: 尘土和炉灰
  rationale: 这是表示卑微、必死和哀恸的固定搭配。“炉灰”在现代汉语中比单用“灰”更清楚地传达 אֵפֶר 所指的灰烬，并保持庄重的经文语体。
theological_decisions:
- issue: 约伯最后回应的性质：自我降卑并悔改，还是收回自己的话并对尘土炉灰改变看法
  choice: 正文译作“我厌弃自己……悔改”，呈现个人的降卑与悔改。
  alternative: 也可理解为“我收回前言，并且不再执着于尘土和炉灰”，或“我厌弃/撤回（先前所说的），并对尘土和炉灰改变心意”。
  rationale: 希伯来文极为简练：אֶמְאַס没有明说宾语，נִחַמְתִּי也可有“后悔、改变心意、得安慰”等含义，末尾עַל还可能表示“关于”。第5节的直接经历支持自我降卑的正文译法，但其他读法在语言上仍属可能，因此不在正文中武断消除，而以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“厌弃自己”保留原动词较强的语气，同时明确“自己”是按语境补出的；“在尘土和炉灰中”沿用读者容易理解的哀恸与降卑意象。脚注集中呈现原文的省略与多义，不以某一神学立场消除其张力。
