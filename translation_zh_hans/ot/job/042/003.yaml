revisions:
- from: “这无知而遮掩谋略的是谁？[a]”所以，我说了，却不明白；这些事对我太奇妙[b]，是我所不知道的。
  to: “是谁在无知中遮掩谋略？[a]”所以，我说了，却不明白；这些事太奇妙，超出我的理解[b]，是我所不知道的。
  rationale: 修订仅改善现代汉语的句法清晰度和自然度。“在无知中”对应“without knowledge”，不改变责问对象；“超出我的理解”将“太奇妙／超过我”的希伯来语习语以自然汉语表达。保留引号、逻辑连接、并列反差，以及两个脚注锚点。
