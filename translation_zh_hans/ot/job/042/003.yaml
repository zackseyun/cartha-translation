base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: zh_hans
  text: “是谁在无知中遮掩谋略？[a]”所以，我说了，却不明白；这些事太奇妙，超出我的理解[b]，是我所不知道的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是谁在无知中隐藏谋略？”传统上也常译作“是谁无知地使谋略暗昧？”本节的希伯来文用词与约伯记38:2不同。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这些事超乎我”，或“这些奇事非我所能明白”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: 这……的是谁
  rationale: 保留直接问句的责问语气，同时采用现代汉语自然的句式。
- source_word: מַעְלִים
  choice: 遮掩
  rationale: 该词是 עלם 的使役词形，基本义为隐藏、遮蔽；不按约伯记38:2的不同用词将其同化为“使……暗昧”。
- source_word: עֵצָה
  choice: 谋略
  rationale: 既可指经过筹划的智慧，也可指计划或旨意；“谋略”在本处简洁庄重，并保留一定语义宽度。
- source_word: בְּלִי דָעַת
  choice: 无知
  rationale: 紧凑表达“没有知识”，并与后文约伯承认自己不明白、不知道相呼应。
- source_word: לָכֵן
  choice: 所以
  rationale: 清楚标示约伯从所引责问转入自我承认的推论关系。
- source_word: הִגַּדְתִּי
  choice: 我说了
  rationale: 此处指约伯先前所作的陈说；“说了”自然克制，不额外加强为郑重宣告。
- source_word: וְלֹא אָבִין
  choice: 却不明白
  rationale: 保留原文并列结构，并以“却”呈现说话与不明白之间在语境中的反差，不把后句完全改写成宾语从句。
- source_word: נִפְלָאוֹת
  choice: 太奇妙的事
  rationale: 表达这些事奇妙非凡、超出约伯理解能力的含义。
- source_word: מִמֶּנִּי
  choice: 对我太……
  rationale: 与“奇妙”结合，按希伯来语比较结构自然译出“超过我的能力”之意；脚注保留其他表达。
- source_word: וְלֹא אֵדָע
  choice: 是我所不知道的
  rationale: 将末句自然连接到前面的“这些事”，保留约伯对自身无知的再次承认。
theological_decisions:
- issue: 约伯记42:3与38:2中神责问的关系
  choice: 依42:3实际用词译为“遮掩谋略”
  alternative: 使谋略暗昧
  rationale: 约伯显然在复述或化用先前的责问，但42:3的希伯来文使用 עלם，而38:2使用 חשך。译文不将两处不同措辞强行统一。
- issue: 约伯承认无知时各分句的关系
  choice: 保留“我说了，却不明白”的并列反差
  alternative: 我讲说了自己不明白的事
  rationale: 原文没有明确关系代词；并列译法保存句法上的开放性及约伯供认中的张力，而不把“不明白”只处理成“所说之事”的修饰语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引号表明约伯复述神先前的责问；分号使后半句层次清楚，并保留原文简短、郑重的认罪语气。
