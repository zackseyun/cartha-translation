base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: zh_hans
  text: 于是，提幔人以利法、书亚人比勒达和拿玛人琐法就去照着雅威对他们所说的去做；雅威悦纳了约伯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“雅威抬起了约伯的脸”，这是表示向某人施恩或接纳某人的习语。
    reason: 保留原文习语的具体意象，并说明其在本句中的有利接纳之义。
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 于是……去
  rationale: 该叙事性连续形式推进情节；“于是……去”在现代汉语中自然地承接上文，又不增添“离开”等原文未明说的信息。
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: 提幔人／书亚人／拿玛人
  rationale: 这些词是表示地域或族属的称谓；采用通行的中文专名音译并加“人”，既保留专名性质，也清楚易懂。
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם
  choice: 照雅威对他们所说的做了
  rationale: 忠实保留“照着……做”的宽泛表达，不把他们执行的具体行动过度明说；“所说的”在汉语中自然表达先前已经发出的吩咐。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，而不以“主”等称号替代；“雅威”是现代中文中可辨识且简洁的译法。
- source_word: וַיִּשָּׂא יְהוָה אֶת פְּנֵי אִיּוֹב
  choice: 雅威也悦纳了约伯
  rationale: “抬起某人的脸”在此是表示有利接纳的希伯来语习语。“悦纳”以庄重而自然的现代汉语传达其语境意义，同时由脚注保留原文意象。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用以色列上帝的专名。音译“雅威”保留其专名身份，不以称号替换，也不把后期传统读法当作唯一确定的发音。
- issue: 雅威对约伯的有利接纳
  choice: 悦纳了约伯
  alternative: 顾念约伯的情面／抬起了约伯的脸
  rationale: 上下文涉及约伯为三位朋友代求，原文习语表明雅威有利地接纳约伯。“悦纳”不额外界定这种接纳的机制或范围；直译意象则放入脚注，以保留文本的表达张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。三个人的地域称谓依次完整呈现；分号区分人的顺服行动与雅威的回应。“也”体现叙事上的后续回应，但不扩展原文的神学含义。
