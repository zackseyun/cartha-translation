base_translation:
  language: en
  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: zh_hans
  text: 耶和华使约伯的境况复原[a]；当约伯为他的朋友们代祷[b]时，耶和华又使约伯所有的一切增至双倍[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扭转了约伯的景况”。这里的希伯来语惯用语指使人的处境复原，不一定指从实际被掳中获释。
    reason: lexical_alternative
  - marker: b
    text: 直译可作：“为他的朋友祷告”。“为”含有代表他们、替他们祈求之意。
    reason: lexical_alternative
  - marker: c
    text: 或译：“赐给约伯的，是他从前所有的两倍。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语体中广为人知的专名译法，明确保留神的专名，而不以“主”替代。
- source_word: שָׁב אֶת שבית אִיּוֹב
  choice: 使约伯的境况复原
  rationale: 这是表示扭转处境、恢复景况的希伯来语惯用语；上下文并非说约伯从实际被掳中获释。
- source_word: בְּהִתְפַּלְלוֹ
  choice: 那时约伯正……代祷
  rationale: ב 加不定词结构表达时间或伴随情境；如此译出与复原同时相联的关系，而不擅自加强为因果关系。
- source_word: בְּעַד רֵעֵהוּ
  choice: 为他的朋友们代祷
  rationale: בְּעַד 表示“为了、代表”，在祷告语境中“代祷”准确而自然；רֵעֵהוּ 形式为单数集合性表达，按上下文指约伯的几位朋友。
- source_word: וַיֹּסֶף
  choice: 又使……增至
  rationale: 保留 יסף“增加、增添”的词义，并与下文“双倍”自然衔接。
- source_word: אֶת כָּל אֲשֶׁר לְאִיּוֹב
  choice: 约伯所有的一切
  rationale: 表达属于约伯的一切财物或产业的总体，不把范围不必要地具体化。
- source_word: לְמִשְׁנֶה
  choice: 双倍
  rationale: 该词表示加倍或成为两份；“增至双倍”简洁表达恢复后的总量为原先的两倍。
theological_decisions:
- issue: 约伯代祷与耶和华使其境况复原之间的关系
  choice: 用“那时……正……”表达时间和情境上的关联
  alternative: 译作“因为约伯……代祷”，明确表达因果关系
  rationale: ב 加不定词可以标示时间或伴随情境。原文将两件事紧密联系，却未必断言一种机械性的功德—奖赏因果关系，故保留这种神学张力。
- issue: שָׁב אֶת שבית 是否指实际结束被掳
  choice: 理解为恢复、扭转约伯的境况
  alternative: 译作“使约伯从被掳中归回”
  rationale: 约伯记的叙事没有说约伯曾实际被掳；此处是惯用语，指其处境得到逆转和恢复。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“境况复原”避免把惯用语误解为实际归回；“那时……正……”清楚呈现时间关联；“代祷”在普通现代读者可理解的前提下准确表达替他人祈求。标点用分号区分两个紧密相连的主句。
