  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: zh_hans
  text: 现在，你们要为自己取七头公牛和七只公绵羊，到我仆人约伯那里，为自己献上燔祭。我的仆人约伯会为你们祷告；我必接纳他[a]，免得我严厉处置你们[b]。因为你们论到我所说的，不如我仆人约伯所说的正确[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“我必抬起他的脸”，是表示接纳某人或向他施恩的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“免得我向你们做一件可耻（或荒唐）的事。”这里的希伯来词可指愚妄、可耻或令人震惊的行为。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你们向我说话，说得不正确。”希伯来文的字面意思是“向我”；按上下文也可理解为“论到我”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以，现在
  rationale: וְ兼具承接和推论作用，עַתָּה明确表示“现在”；译文保留这一时间／话语标记，并用“所以”自然衔接上文。
- source_word: קְחוּ לָכֶם
  choice: 你们要为自己取
  rationale: 命令式配合利益与格代词，既表达命令，也保留这些祭牲是为他们所取的含义。
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: 七头公牛和七只公绵羊
  rationale: פָרִים指雄牛，אֵילִים指公绵羊；原文并未要求补出“年轻”。
- source_word: עַבְדִּי אִיּוֹב
  choice: 我仆人约伯
  rationale: 此处עֶבֶד是上帝对忠心服事者的尊称，“仆人”比“奴隶”更符合语境。
- source_word: וְהַעֲלִיתֶם עוֹלָה
  choice: 献上燔祭
  rationale: 这是标准献祭用语；עוֹלָה指全烧献上的祭物，汉语传统且清楚的对应词是“燔祭”。
- source_word: בַּעַדְכֶם
  choice: 为自己
  rationale: 介词在献祭语境中表示受益或代替关系；“为自己”保留祭物为他们而献的意义。
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: 会为你们祷告
  rationale: 该形式在这里表示祷告和代求；“为你们祷告”自然明白，代求含义由上下文显出。
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: 我必看他的情面
  rationale: “抬起某人的脸”是接纳、施恩的习语。“看他的情面”在现代汉语中可理解，同时比直接译作“接纳他”更保留约伯代求蒙垂听的关系性意象。
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: 免得我按你们的愚妄处置你们
  rationale: נְבָלָה可指愚妄、可耻或令人震惊的事。这里采用司法性表达，说明他们的愚妄本会招致处置，又避免让汉语读者误解为上帝会行不义之事；脚注保留较贴字面的另一理解。
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: 你们论到我，说得……不正确
  rationale: אֵלַי字面可作“向我”，但在上下文中也可按意义理解为“论到我”。正文采用较自然的语境义，脚注保留句法上的歧义。
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: 不如我的仆人约伯正确
  rationale: 原文以比较结构对照朋友们与约伯的言论；汉语补出“说得”，使省略结构完整而不增加新含义。
theological_decisions:
- issue: 约伯的代求与上帝“看他的情面”之间的关系
  choice: 译文呈现上帝因看约伯的情面而垂听他的代求，使朋友免受应得的处置。
  alternative: 仅表示上帝个人接纳约伯，与约伯为朋友代求的功用无关。
  rationale: 命令献祭、约伯祷告、上帝看他的情面以及不处置朋友，在句法和叙事次序上彼此相连；译文保留这种中保性关系，但不引入本节未明说的后期祭司或赎罪体系。
- issue: נְבָלָה用于上帝行动时的含义
  choice: 译为“按你们的愚妄处置你们”，理解为上帝按他们应得的惩罚对待他们。
  alternative: 译为“向你们做一件可耻／荒唐的事”。
  rationale: 该名词本身含有愚妄、羞耻和恶劣行为等语义。正文避免造成上帝会做道德上可耻之事的误解，脚注则公开较贴字面的可能译法。
- issue: 朋友们的话是“向上帝”还是“论到上帝”而说
  choice: 正文采用“论到我”，强调他们关于上帝的陈述不正确。
  alternative: 按介词字面译为“向我”，指他们没有对上帝说正确的话。
  rationale: 希伯来文介词支持“向我”，而全书语境支持“论到我”。两者不能确定地互相排除，因此正文选择较符合上下文的表达，并以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“燔祭”“仆人”等词保留必要的圣经与礼仪语域；句式避免过度文言化。正文保留原文明确的“现在”，并以“所以”表达וְ在此处承接上文判语、引出行动命令的功能。所有脚注标记均置于相关正文之后。
