  text: וְ/לֹ֨א נִמְצָ֜א נָשִׁ֥ים יָפ֛וֹת כִּ/בְנ֥וֹת אִיּ֖וֹב בְּ/כָל הָ/אָ֑רֶץ וַ/יִּתֵּ֨ן לָ/הֶ֧ם אֲבִי/הֶ֛ם נַחֲלָ֖ה בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: zh_hans
  text: 全地[a]找不到像约伯的女儿那样美丽的女子。她们的父亲把产业赐给她们，使她们和兄弟一同承受。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译“全世界”。
    reason: הָאָרֶץ可指“地／土地”，也可广义指“全地／世界”；正文保留较符合叙事语境且不预断现代地理范围的表达。
lexical_decisions:
- source_word: נִמְצָא
  choice: 找不到
  rationale: 该词为被动形式，在此存在句中表达“没有被找到／不存在”的意思；汉语用“找不到”自然传达这种语义，不必机械保留被动句式。
- source_word: נָשִׁים יָפוֹת
  choice: 美丽的女子
  rationale: נָשִׁים在这里指女性，不特指妻子；יָפוֹת意为“美丽的”。“女子”比“妇女”更适合此处对约伯女儿容貌的描述。
- source_word: כִּבְנוֹת אִיּוֹב
  choice: 像约伯的女儿那样
  rationale: 前缀כְּ表示比较；与“美丽”组合为自然的现代汉语比较结构。
- source_word: בְּכָל הָאָרֶץ
  choice: 在那全地
  rationale: הָאָרֶץ可指“地、全地”或“世界”。叙事语境中译为“那全地”既保留地域范围感，也避免明确断定为整个地球；另义列入脚注。
- source_word: וַיִּתֵּן לָהֶם
  choice: 也使她们……得了
  rationale: 直译为“给她们”在中文中需要补出所给之物；结合后面的“产业”，用“使她们得了产业”自然表达父亲授予产业的动作。
- source_word: נַחֲלָה
  choice: 产业
  rationale: 该词指承受而来的产业或世袭地产。“产业”是简洁、庄重且符合经文语境的译法。
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: 在兄弟中
  rationale: בְּתוֹךְ意为“在……中间”；אֲחֵיהֶם明确是“她们的兄弟”。中文已有“她们”作主语，省去重复领属语仍不损失所指，并保留女儿与男性继承人同得产业这一显著细节。
theological_decisions:
- issue: 亲属称谓的性别所指
  choice: 在兄弟中
  alternative: 在弟兄姊妹中／在手足中
  rationale: 希伯来文明确使用阳性复数“兄弟”，不宜中性化，以保留女儿在男性继承人中获产业的叙事张力。
- issue: הָאָרֶץ的范围
  choice: 在那全地
  alternative: 在全世界
  rationale: 该词既可指一片土地，也可指全地或世界。正文采用较不武断的“那全地”，脚注保留更广范围的可能，不把古代叙事措辞解释成现代意义上的全球考察。
- issue: 女儿所得נַחֲלָה的性质
  choice: 产业
  alternative: 一份遗产
  rationale: 原文说明父亲给她们נַחֲלָה，却未交代份额、形式或法律安排；译文不补入“一份”或“同等”等原文未明说的信息。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“找不到……那样美丽的女子”保留原文的比较和最高程度意味；后句避免生硬直译，同时不补充女儿所得产业的具体份额。脚注标记[a]已置于相关范围表述所在句末。
