  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: zh_hans
  text: 耶和华对约伯说完这些话以后，就对提幔人以利法说：“我向你和你的两个朋友发怒，因为你们论到我，说得不正确，不像我的仆人约伯。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们没有像我的仆人约伯那样，对我说正确的话。”希伯来文的介词字面意思是“对我”，但按上下文也可理解为“论到我”。
    reason: 保留 אֵלַי 的词汇与句法歧义，避免正文把“对我”和“论到我”之间的张力完全消除。
lexical_decisions:
- source_word: וַיְהִי אַחַר
  choice: ……以后，就……
  rationale: 以现代汉语自然的承接结构表达希伯来文的叙事转折和时间先后，无须生硬译出“事情发生了”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中广为人知的专名形式，明确保留神的专名。
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה אֶל אִיּוֹב
  choice: 对约伯说完这些话
  rationale: “说完”贴合 אַחַר 所要求的已完成背景动作；“这些话”保留 דְּבָרִים 的具体表达。
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: 提幔人以利法
  rationale: 使用中文圣经中通行的人名、地名音译，并按自然汉语次序表达其地域身份。
- source_word: חָרָה אַפִּי בְךָ
  choice: 我向你……发怒
  rationale: 准确传达怒气指向某人的习语意义；现代汉语中“发怒”比直译“我的怒气燃烧”更自然庄重。
- source_word: וּבִשְׁנֵי רֵעֶיךָ
  choice: 和你的两个朋友
  rationale: 保留明确数目“两个”，其受怒对象关系由前面的“向”统摄。
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: 你们论到我，说得不正确
  rationale: 正文按上下文将 אֵלַי 理解为“论到我”，而“说得不正确”保留 נְכוֹנָה 所含正确、合宜之义，不把判断缩窄为单纯事实错误或动机问题。
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: 不像我的仆人约伯
  rationale: 保留神对约伯“我的仆人”的称呼，并自然表达与朋友们相反的比较。
theological_decisions:
- issue: אֵלַי 是指“对我说”还是“论到我说”
  choice: 正文译作“论到我”，脚注保留“对我说”的可能
  alternative: 你们没有像我的仆人约伯那样对我说正确的话
  rationale: 介词字面为“向我／对我”，但整段对话的语境也支持神在评价他们有关他的言论。原文确有歧义，因此正文采用较符合语境的理解，同时用脚注保存直译可能。
- issue: נְכוֹנָה 所表达的评判范围
  choice: 说得不正确
  alternative: 没有说正直的话；没有说合宜的话
  rationale: 该词可涉及正确、正当或合宜。“不正确”在现代汉语中清楚自然，同时不进一步断言神只是在评判事实准确性、道德态度或某一套教义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“耶和华”“提幔人以利法”“我的仆人约伯”延续中文圣经读者熟悉的称谓；句式避免文言化，也避免过度口语化。脚注标记已在正文中以 [a] 出现。
