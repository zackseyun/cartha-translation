  text: And Job died[a], old and full of days.
translation:
  language: zh_hans
  text: 约伯年老，享尽天年[a]，就去世了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“饱享岁月”或“日子满足”；这是希伯来语惯用语，指寿数充足、人生完整。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 就去世了
  rationale: 该叙事形式承接前文，记述随后发生的事。汉语将死亡表述置于句末，并用“就”自然连接约伯年老、享尽天年与去世这一结局；“去世”庄重而通俗。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: זָקֵן
  choice: 年老
  rationale: 准确表达“老、年迈”，措辞简洁自然，不额外增添评价。
- source_word: וּשְׂבַע יָמִים
  choice: 享尽天年
  rationale: 希伯来语字面意象是“饱足于日子”，在死亡记述中表示寿数充足、人生完整。“享尽天年”是自然庄重的现代汉语表达，同时保留“天年已足”的含义；脚注说明较贴近原文的译法。
