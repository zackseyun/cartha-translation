  text: 他给第一个女儿取名叫耶米玛，第二个叫基洗亚，第三个叫基连·哈朴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基连·哈朴”可能意为“盛放锑质眼妆颜料的角制容器”，也可能指这种眼妆颜料本身。
    reason: 说明复合人名 קֶרֶן הַפּוּךְ 的可能词义，并保留“容器”与“颜料”之间的词义不确定性。
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: 取名叫
  rationale: 希伯来语直译为“称……的名”，在现代汉语中用“取名叫”自然准确地表达命名行为；主语依上下文为约伯。
- source_word: הָאַחַת / הַשֵּׁנִית / הַשְּׁלִישִׁית
  choice: 第一个女儿／第二个／第三个
  rationale: 这里按次序列举三个女儿；首项补出“女儿”以使汉语指代清楚，后两项省略以避免累赘。
- source_word: יְמִימָה
  choice: 耶米玛
  rationale: 作为人名采用音译，并使用现代中文圣经读者较易辨认的形式。
- source_word: קְצִיעָה
  choice: 基洗亚
  rationale: 作为人名采用音译；该形式兼顾希伯来语读音与中文圣经传统。
- source_word: קֶרֶן הַפּוּךְ
  choice: 基连·哈朴
  rationale: 作为复合人名音译，以间隔号显示两个构词成分；其可辨识的字面含义另在脚注说明。
