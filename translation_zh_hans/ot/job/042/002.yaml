  text: ידעת כִּי כֹ֣ל תּוּכָ֑ל וְ/לֹא יִבָּצֵ֖ר מִמְּ/ךָ֣ מְזִמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/002.yaml
  text: I know that you can do all things[a], and no purpose of yours can be thwarted.
translation:
  language: zh_hans
  text: 我知道你凡事都能做；你的任何计划都不能受阻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “计划”也可译作“意图”；“受阻”也可译作“被阻止”或“落空”。原文的名词可指计划或意图，动词可表示被拦阻、被阻止或无法实现。
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: 我知道
  rationale: 原文为ידע的Qal完成式第二人称阳性单数；在约伯当下向上帝所作的承认中，用现代汉语状态表达“我知道”最自然，也不必强行译成过去时。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 这里引出“知道”的内容。现代汉语在“我知道”之后通常无需加“即/那”，省译连接词更自然，内容关系仍然清楚。
- source_word: כֹל תּוּכָל
  choice: 你凡事都能做
  rationale: יכל表示“能够、有能力”；כֹל使范围全面。“凡事都能做”简洁自然，表达上帝无所不能的能力，而不作超出经文的发挥。
- source_word: וְלֹא יִבָּצֵר
  choice: 都不能受阻
  rationale: בצר的Niphal形式与מן连用，可表达被拦阻、被阻止或无法实现；搭配“计划”时，“不能受阻”准确而自然，并保留其被动意味。
- source_word: מִמְּךָ
  choice: 你的
  rationale: 原文字面为“从你”；在本句结构中用所有关系“你的”表达该计划出于并属于上帝，符合现代汉语习惯。
- source_word: מְזִמָּה
  choice: 计划
  rationale: 该名词可指计划、谋划或意图；此处指上帝所定的意向。“计划”中性、清楚，避免“计谋”的负面色彩，同时保留与“旨意”相比更具体的筹划含义。
theological_decisions:
- issue: 如何表达上帝的全能及其计划不受阻挠
  choice: 我知道你凡事都能做；你的任何计划都不能受阻。
  alternative: 我知道你无所不能；你的任何旨意都不会落空。
  rationale: 所选译文紧贴“能够”和“计划”的词义，既表明上帝能力不受限制，也表明他的计划无法被阻止；不把经文扩展为一套系统神学命题。“受阻”还保留原动词关于阻拦、妨碍的语义张力。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“凡事都能做”比单纯的“无所不能”更贴近原文结构；分号清楚呈现两个彼此加强的分句。脚注标记置于整节句末，涵盖第二分句中的词汇替代方案。
