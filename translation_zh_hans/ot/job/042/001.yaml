  yaml_path: translation/ot/job/042/001.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: zh_hans
  text: 于是，约伯回答耶和华[a]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（神圣四字名）；传统中文常译作“耶和华”，也有译作“雅威”或“上主”的。
    reason: 说明神名的原文形式及主要译法。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在此处属于对话叙事套语，表示“回答、回应”；采用“回答”可保留原文的正式对话结构，即使前文未直接提出问句。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用该人名在现代汉语圣经传统中的通行译名。
- source_word: אֶת
  choice: 不另译
  rationale: 这是希伯来语确定直接宾语标记，现代汉语无需用独立词语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用神圣四字名在现代汉语中的通行音译；脚注说明其希伯来文形式及其他译法，以保留名称问题。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 这是常见的希伯来叙事引语公式；与“回答”合译为自然的现代汉语“回答……说”。
- source_word: וַ
  choice: 于是
  rationale: 句首连续式推动叙事向前；“于是”自然表达前后承接与时间次序。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。正文采用中文读者熟悉的传统音译“耶和华”，不以纯头衔取代；脚注同时交代“雅威”等译法，避免把有争议的发音问题默认为唯一答案。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“于是”承接上文，“回答……说”保留希伯来叙事公式；冒号引出下一节约伯的话。
