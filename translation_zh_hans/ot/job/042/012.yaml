base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: zh_hans
  text: 耶和华赐福给约伯，使他后来的光景胜过起初[a]。他有一万四千只羊、六千头骆驼、一千对牛[b]和一千头母驴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“耶和华赐福给约伯的后来，胜过他的起初。”
    reason: 说明“后来”与“起初”的简练对照，并表明正文以“光景”使汉语表达自然。
  - marker: b
    text: 或译“一千轭牛”，即一千对可配轭劳作的牛。
    reason: צֶמֶד 可指一对牲畜，也可强调同负一轭的劳作单位。
lexical_decisions:
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 直接译出四字神名 יְהוָה；“耶和华”是现代汉语圣经语境中广为人知且庄重的音译。
- source_word: בֵּרַךְ
  choice: 赐福
  rationale: 保留 ברך 表达神主动施福的神学含义，也符合现代汉语习惯。
- source_word: אַחֲרִית אִיּוֹב מֵרֵאשִׁתוֹ
  choice: 约伯后来的光景，胜过他起初的光景
  rationale: אַחֲרִית 与 רֵאשִׁית 形成“后来/起初”的对照；补出“光景”使汉语自然，同时避免把 אַחֲרִית 限定为临终前的日子。
- source_word: וַיְהִי לוֹ
  choice: 他有
  rationale: 希伯来语直译为“归他所有/他那里有”，汉语以“他有”最自然。
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: 一万四千只羊
  rationale: צֹאן 是小型牲畜的集合名词，可涵盖绵羊和山羊；此处依上下文及传统简洁译作“羊”。
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: 六千头骆驼
  rationale: 按原文数目和名词直接翻译，并采用汉语常用量词。
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: 一千对牛
  rationale: צֶמֶד 指成对或同负一轭的牲畜；“一千对牛”清楚保留计数单位，且不把 בָּקָר 过度限定为某一性别。
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: 一千头母驴
  rationale: אֲתוֹנוֹת 明确指雌性驴，“母驴”保留其词义上的性别信息。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名，因此不以“主”替代；“耶和华”在现代汉语读者中辨识度高，也保持其专名性质。
- issue: 神所赐的福与物质产业的关系
  choice: 先译“赐福”，随后忠实列出产业
  alternative: 将“赐福”释译为“使他昌盛”
  rationale: “赐福”保留原文对神行动的概括，不将其意义缩减为物质富足；后文则具体说明此处福分包含产业增加。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保持叙事简洁，以“后来的光景/起初的光景”传达时间阶段及处境的对照；牲畜数目采用现代汉语数字与常用量词。
