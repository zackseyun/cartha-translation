revisions:
- from: 于是，他所有的兄弟、所有的姐妹，以及从前认识他的所有人，都来到他那里，在他家里和他一同吃饭[a]。他们向他表示同情，又因耶和华降在他身上的一切灾祸安慰他。每人送给他一枚克西他[b]和一个金环[c]。
  to: 于是，他所有的兄弟、所有的姐妹，以及从前认识他的所有人，都来到他那里，在他家里和他一同吃饭[a]。他们向他表示同情，又因耶和华加在他身上的一切灾祸安慰他。每人送给他一克西他[b]和一个金环[c]。
  rationale: 仅作两处安全的措辞调整：以‘加在他身上的’清晰表达原文所述耶和华使灾祸临到约伯的主动施事关系；删去‘克西他’前的量词‘枚’，避免把性质未明的古代有价值物件界定为硬币。其余译文和全部脚注锚点均可保留。
