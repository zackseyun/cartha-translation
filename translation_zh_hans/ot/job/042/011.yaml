base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: zh_hans
  text: 于是，他所有的兄弟、所有的姐妹，以及从前认识他的所有人，都来到他那里，在他家里和他一同吃饭[a]。他们向他表示同情，又因耶和华加在他身上的一切灾祸安慰他。每人送给他一克西他[b]和一个金环[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“和他一同吃饼”，这是指共同用餐的惯用说法。
    reason: cultural_note
  - marker: b
    text: “克西他”是古代一种有价值的单位或物件，确切等值不详。
    reason: cultural_note
  - marker: c
    text: “金环”也可译作“金鼻环”或“金耳环”；原词可以指戴在鼻上或耳上的环。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: 以及从前认识他的所有人
  rationale: יֹדְעָיו指认识约伯的人，לְפָנִים表示“从前、先前”；此译保留时间含义，也比笼统译作“旧相识”更贴近原文结构。
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם
  choice: 和他一同吃饭
  rationale: 原文直译为“和他一同吃饼”，在希伯来语中是共同用餐的惯用表达；正文采用自然现代汉语，脚注保留其字面形象。
- source_word: וַיָּנֻדוּ לוֹ
  choice: 向他表示同情
  rationale: נוּד在此语境中指对受苦者表达怜悯、慰问，而不是讥诮性的摇头。
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: 安慰他
  rationale: נחם在哀伤和受苦语境中通常表示安慰、劝慰。
- source_word: עַל כָּל הָרָעָה
  choice: 因……一切灾祸
  rationale: רָעָה在此指约伯所遭遇的灾难或祸患，而非道德意义上的邪恶。
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: 耶和华降在他身上的
  rationale: הביא על明确表达使灾祸临到某人；“降在……身上”保留原文的主动施行含义。
- source_word: קְשִׂיטָה
  choice: 克西他
  rationale: 该词指古代某种有价值的单位或物件，确切形制与等值不明；音译可避免武断地将其确定为某种钱币或重量。
- source_word: נֶזֶם זָהָב
  choice: 金环
  rationale: נֶזֶם可指戴在鼻上或耳上的环；正文用不限定佩戴部位的“金环”，并在脚注说明歧义。
theological_decisions:
- issue: 约伯灾祸中的神圣施事
  choice: 耶和华降在他身上的一切灾祸
  alternative: 耶和华容许临到他身上的一切灾祸
  rationale: 希伯来文明确说耶和华“使/带来”灾祸临到约伯，并非只说容许发生。译文保留这一神学张力，不以解释性措辞加以弱化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他所有的兄弟、所有的姐妹”保留原文两次“所有”的强调；叙事连接词用“于是”，句式清楚，适合普通现代读者。
