base_translation:
  language: en
  yaml_path: translation/ot/job/042/004.yaml
  text: Hear[a], please, and I will speak; I will ask you[b], and you declare to me.
translation:
  language: zh_hans
  text: 请听[a]，我要说话；我要问你，你要使我明白[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约伯在这里几乎逐字复述耶和华先前在约伯记38:3和40:7所说的话。
    reason: cross_reference
  - marker: b
    text: 或译：“你要告诉我”；直译：“你要使我知道。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: 听
  rationale: 这是שׁמע的祈使式；“听”保留直接命令的语气，也适合本节庄重的神人对话语境。
- source_word: נָא
  choice: 请
  rationale: 该语气词在此表达请求或礼貌；现代汉语用“请”最自然，不误解为时间副词“现在”。
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: 我要说话
  rationale: 保留连接词所表达的承接关系，并以“我要”传达未完成式在此语境中的意愿或将来意味；独立代词אָנֹכִי所带的主语强调可由“我”自然体现。
- source_word: אֶשְׁאָלְךָ
  choice: 我要问你
  rationale: שאל的基本意义是“问”，第二人称单数后缀明确指出询问对象是“你”；不强化为较具质问色彩的“盘问”。
- source_word: וְהוֹדִיעֵנִי
  choice: 你要使我明白
  rationale: ידע的使役式字面表示“使我知道”。“使我明白”既保留使役含义，也符合现代汉语表达；不直接译成“回答我”，以免加入原文未明说的回应概念。
theological_decisions:
- issue: 本节与约伯记38:3及40:7的关系
  choice: 正文直接翻译约伯所复述的措辞，不补入“你曾说”等引语说明。
  alternative: 在正文加入“你曾说”或使用明确的引号，表明这是引用耶和华先前的话。
  rationale: 希伯来文几乎照录耶和华先前的挑战，却没有明写引语引介语。正文保留这种含蓄关系，并用脚注指出互文，可避免替原文消除叙事上的张力。
- issue: וְהוֹדִיעֵנִי的语义力度
  choice: 译作“你要使我明白”，保留ידע使役式的基本结构。
  alternative: 译作“你要告诉我”“你要向我说明”或“你要回答我”。
  rationale: “使我明白”较透明地表达“使我知道”，同时不预设所求的是一个正式答复，也不把这一命令解释成特定的神学姿态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请听”比“请垂听”更贴近原文且不显古奥；分号保留两组平行命令的节奏。所有脚注标记均置于相关词句之后。
