  yaml_path: translation/ot/job/010/010.yaml
  text: Did you not pour me out like milk and curdle me like cheese?[a]
translation:
  language: zh_hans
  text: 你不是把我像奶一样倒出，又使我像奶酪一样凝结吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我像凝乳一样凝固。”希伯来语名词既可具体译作“奶酪”，也可泛指凝结的乳制品。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 你不是……吗
  rationale: 引出预期肯定回答的反问；这一句式自然地保留了希伯来语的反问语气。
- source_word: כֶחָלָב
  choice: 像奶一样
  rationale: 前缀 כ 表示比较；此译保留液态乳汁的比喻，并与后半句的凝结意象相连。
- source_word: תַּתִּיכֵנִי
  choice: 把我……倒出
  rationale: נתך 的使役形在此描写倾倒液体；“倒出”切合乳汁意象，也保留受造过程的生动表达。
- source_word: וְכַגְּבִנָּה
  choice: 又……像奶酪一样
  rationale: וְ 与比较前缀 כ 引出第二个比喻；גְּבִנָּה 可指奶酪或凝乳制品，正文采用现代读者容易理解的“奶酪”。
- source_word: תַּקְפִּיאַנִי
  choice: 使我……凝结
  rationale: קפא 的使役形表示使之变稠、凝固；“凝结”准确表达乳汁凝成固态的过程，且中文自然庄重。
