base_translation:
  language: en
  yaml_path: translation/ot/job/010/016.yaml
  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: zh_hans
  text: 我若昂首[a]，你就像狮子一样猎捕我；你又向我施展奇异的作为[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文含义困难，且有所省略；开头也可理解为“它若升高”或“我若被高举”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你又向我显出奇异。”原文可指显为奇妙，也可指施行非凡、惊人的事；这里的语境带有敌对意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: 我若昂首
  rationale: גאה表示升高、被高举或昂起。希伯来文本身是第三人称阳性单数，句式省略且含义困难；结合约伯的第一人称申诉，正文采用自然的条件式“我若昂首”，并以脚注保留“它若升高”等可能。
- source_word: כַּשַּׁחַל
  choice: 像狮子一样
  rationale: שַׁחַל指狮子，常带强猛意味；“狮子”准确保留比喻，又不额外限定为雄狮、母狮或猛狮。
- source_word: תְּצוּדֵנִי
  choice: 猎捕我
  rationale: צוד表示追猎或捕捉猎物；“猎捕”与狮子的意象自然衔接，并保留约伯如猎物般被追逐的意味。
- source_word: וְתָשֹׁב
  choice: 又
  rationale: שׁוב本义为返回，此处惯用地表示动作再次发生；“又”以简洁自然的汉语传达重复意味。
- source_word: תִּתְפַּלָּא
  choice: 施展奇异的作为
  rationale: פלא的Hitpael形可表示显为奇妙或行出非凡之事。此处描述敌对处境中的惊人行动；“施展奇异的作为”保留其非凡、令人惊异的意味，避免将其误解为正面的美好作为。
- source_word: בִי
  choice: 向我
  rationale: 介词ב在此指行动所针对的对象。“向我”保留方向性和语境中的敌对意味，同时不像“攻击我”那样把原文含义说得过满。
theological_decisions:
- issue: 在神敌对约伯的申诉语境中翻译 פלא
  choice: 你又向我施展奇异的作为
  alternative: 你又显为奇妙，与我为敌
  rationale: 正文既保留神行动非凡、令人惊异的含义，也让上下文呈现其针对约伯的痛苦张力，不把“奇异”化解为纯粹正面的神迹，也不简化为一般性的攻击。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“昂首”简洁呈现升高的意象；“猎捕”延续狮子与猎物的画面；“奇异的作为”刻意保留 פלא 在苦难语境中的神学张力。所有脚注标记均已置于正文。
