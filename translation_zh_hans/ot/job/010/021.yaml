  naturalness: “趁我还没有一去不返，去到……”搭配生硬，且“趁”带有把握时机、催促行动的语感，不如原文单纯的时间界限。改为“在我一去不返、进入……之地以前”庄重自然，也保留诗歌语气。
  terminology: “幽冥”常指冥界或阴间，较“深暗/幽暗”多加入一个明确的冥界概念；原文此处以“黑暗”和צלמות的并列意象描述该地，宜译为“幽暗”以保留词汇上的开放性。传统“死荫”保留于脚注。
