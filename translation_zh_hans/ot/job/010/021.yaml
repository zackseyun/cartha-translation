base_translation:
  language: en
  yaml_path: translation/ot/job/010/021.yaml
  text: before I go—and do not return—to the land of darkness and deep shadow,[a]
translation:
  language: zh_hans
  text: 在我一去不返、进入那黑暗与幽暗之地以前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“黑暗与死荫之地。”这是传统译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 趁我还没有
  rationale: 这是表示“在……以前”的时间词。与后面的“去”结合，译为“趁我还没有……”，既符合现代汉语，也保留约伯请求在离去以前尚有片刻的语境。
- source_word: אֵלֵךְ
  choice: 去
  rationale: הלך 是普通的“去、行走”。此处语境指走向死者之境，但不直接意译为“死”，以免加入原文没有明说的解释。
- source_word: וְלֹא אָשׁוּב
  choice: 一去不返
  rationale: 字面为“并且不回来”。“一去不返”自然凝练地表达去而不回，没有额外指定死亡的性质。
- source_word: אֶל אֶרֶץ
  choice: 去到……之地
  rationale: אֶל 表方向，אֶרֶץ 在这里指一个领域或境地；“去到……之地”在汉语中清楚表达这一方向关系。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 采用该词基本而直接的含义，并与下一诗性意象并列。
- source_word: צַלְמָוֶת
  choice: 幽冥
  rationale: 该词可指极深的幽暗，也传统上被理解为“死荫”。“幽冥”在此自然表达与死亡相关的深暗境域，同时不像“死荫”那样把有争议的词源分析写死；传统译法保留在脚注。
theological_decisions:
- issue: 死亡语境中 צַלְמָוֶת 的译法
  choice: 幽冥
  alternative: 死荫；深暗
  rationale: 原词的理解在“死荫”和“极深的黑暗”之间存在词汇争议。“幽冥”既适合本节所描写的死者之境，也保留阴暗意象而不明确断定其词源构成；脚注列出传统译法。
translation_notes:
  register: 采用现代、庄重而富有诗意的汉语。“一去不返”传达原文连续的“去而不回”；“黑暗、幽冥之地”保留两个并列意象，并避免把此处直接改写成抽象的“死亡”。
