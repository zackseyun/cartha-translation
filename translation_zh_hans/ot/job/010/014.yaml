base_translation:
  language: en
  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: zh_hans
  text: 我若犯罪[a]，你就察看我[b]，不免除我的罪责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我若犯了罪”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“察看”指严密监察，并非保护性的看守。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出条件句，保留约伯是在假设犯罪，还是泛指每逢犯罪这一含混之处。
- source_word: חָטָאתִי
  choice: 犯罪
  rationale: 这是חטא的Qal完成式第一人称单数；在条件句中译作“犯罪”自然地表达一般或可能发生的情形，同时不排除“犯了罪”的完成意义。
- source_word: וּשְׁמַרְתָּנִי
  choice: 你就紧盯着我
  rationale: שׁמר可指看守、守护或留意；本节语境强调对过犯的严密监察，而非保护，因此用“紧盯着”传达持续而带审查意味的注视。
- source_word: וּמֵעֲוֺנִי
  choice: 我的罪责
  rationale: עָוֹן兼有罪孽、罪责及其后果等含义；“罪责”在此与司法性的נקה搭配自然，并保留道德过犯与归责两方面。
- source_word: לֹא תְנַקֵּנִי
  choice: 绝不免除
  rationale: נקה的Piel在司法语境中可指宣告无罪、免除罪责或不予惩罚；“绝不免除我的罪责”既自然，也保留其法庭式含义，避免误解为礼仪洁净。
theological_decisions:
- issue: נקה应理解为司法宣判还是洁净
  choice: 司法性的“绝不免除我的罪责”
  alternative: 礼仪或净化性的“绝不洁净我”；刑罚结果性的“绝不让我免受惩罚”
  rationale: 上下文呈现约伯受神监察并被追究的申诉，具有司法色彩；该译法不引入后来的教义范畴，也不把含义缩减为礼仪洁净或单纯受罚。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“紧盯着”清楚表达带审查意味的持续注视；“免除我的罪责”保留司法语感，同时比生硬的“宣判我无罪”更贴合中文句法。
