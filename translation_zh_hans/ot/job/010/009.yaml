  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: zh_hans
  text: 求你记得，你造我如同陶泥[a]，难道还要使我归于尘土吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像泥土一样”。希伯来文明确表示比较，并没有直接说“用泥土”或“从泥土”造我，尽管这里显然使人联想到创造的图景。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你还要使我归于尘土。”希伯来文形式本身既可理解为陈述，也可在上下文中理解为反问。
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר נָא
  choice: 求你记得
  rationale: זְכָר是对上帝说的第二人称阳性单数命令式；נָא表达恳求语气。合译为“求你记得”，自然、庄重，也保留约伯祈求式的呼告。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 此处引出“记得”的内容。现代汉语在“求你记得”之后可直接接宾语分句，无须机械译作“那”或“因为”。
- source_word: כַחֹמֶר
  choice: 如泥土
  rationale: 前缀כ明确表示比较，即“像/如”，并非明确表示材料来源的“用泥土”或“从泥土”。“泥土”既符合陶土意象，也能自然衔接下文“尘土”。
- source_word: עֲשִׂיתָנִי
  choice: 你造我
  rationale: עשה本义宽泛，为“做、造”。“造我”准确简洁，并保留创造语境；不以“塑造”过度强化动词本身未明确表达的陶匠动作。
- source_word: וְאֶל עָפָר
  choice: 还……归于尘土
  rationale: וְ连接后一分句；אֶל表示趋向，עָפָר在创造与死亡语境中宜译“尘土”。“还”体现汉语反问衔接，但不改变基本并列关系。
- source_word: תְּשִׁיבֵנִי
  choice: 难道还要使我归于……吗
  rationale: 这是שוב的使役式，意为“使我返回”。结合哀诉语境译作反问；“使我归于”保留使役意义和返回尘土的意象。
theological_decisions:
- issue: 末句是陈述还是反问
  choice: 译作反问：“难道还要使我归于尘土吗？”
  alternative: 译作陈述：“你还要使我归于尘土。”
  rationale: 希伯来文本没有显式疑问词，语法上可以理解为陈述；但在约伯向上帝申诉的语境中，反问更能传达话语力量。脚注保留陈述读法，避免把语境判断说成唯一语法结论。
- issue: כַחֹמֶר是否表示由泥土造成
  choice: 保留比较义：“如泥土”
  alternative: 译作“用泥土造我”或“从泥土造我”
  rationale: 该形式中的כ是比较前缀。经文确实唤起创造与陶匠意象，但不应把隐含的材料来源明说成原文的直接陈述。
translation_notes:
  register: 采用现代、庄重而易懂的哀诉语体。“求你”表达נָא的恳求意味；“难道……吗”自然呈现语境中的反问力量。主文中的[a]、[b]均与脚注对应。
