  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: zh_hans
  text: 那么，你为什么使我从母腹出来呢？我就会死去，谁也不会看见我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较按字面译为：“我会死去，没有眼目看见我。”希伯来文的两个未完成式可保留未然或将来色彩；但上下文较支持与事实相反的意思。
    reason: 保留希伯来文未完成式在形式上的语气歧义，并提示“眼目”是原文的意象。
lexical_decisions:
- source_word: וְלָמָה
  choice: 那么，你为什么
  rationale: לָמָה是“为什么”，前缀וְ承接上文的哀诉；用“那么”自然表达这种语篇联系。
- source_word: מֵרֶחֶם
  choice: 出母腹
  rationale: 保留“母腹”这一具体的出生意象，并与使役动词自然衔接。
- source_word: הֹצֵאתָנִי
  choice: 使我出
  rationale: יצא的Hifil形式表示使某人出来；“使我出母腹”既体现使役意义，也保留对上帝的直接质问。
- source_word: אֶגְוַע
  choice: 我本可死去
  rationale: 该未完成式在上下文中可理解为与现实相反的结果；“本可”表达约伯所设想的未实现结局。
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: 没有人会看见我
  rationale: 原文直译为“没有眼睛会看见我”；“眼”借代观看者，译作“没有人”更符合现代汉语，同时保留否定结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的哀诉语体。“使我出母腹”略带文学色彩，以保存原文出生意象；正文将“眼”这一借代自然译为“人”，脚注提供较形式对应的译法。
