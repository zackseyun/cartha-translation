  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: zh_hans
  text: 你的日子难道像凡人的日子[a]，你的年岁也像强壮之人的日子[b]一样吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡人”所译的希伯来语 אֱנוֹשׁ 也可译作“人”，常含人脆弱、必死的意味。
    reason: lexical_alternative
  - marker: b
    text: “强壮之人”所译的希伯来语 גָבֶר 也可译作“男子”或“人”；这里如此翻译，是为了保留它与前半句“凡人”所用不同词语的区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: 难道像……的日子
  rationale: 疑问词 הֲ 与比较介词 כְּ、复数名词“日子”的组合构成反问式比较；“难道像”既自然，也保留反问语气。
- source_word: אֱנוֹשׁ
  choice: 凡人
  rationale: אֱנוֹשׁ 指人，并常带脆弱、必死的意味；“凡人”能简洁表达人与神的差别，又不把这一含义强化为明说“必死的人”。
- source_word: יָמֶיךָ
  choice: 你的日子
  rationale: 直译带第二人称阳性单数后缀的复数名词，所指为约伯向神发问时所说神的“日子”。
- source_word: אִם
  choice: 也……吗
  rationale: 此处 אִם 连接平行的第二问，并非条件句。汉语用“也……吗”比机械译作“还是”更自然，同时保留第二分句与第一分句并列的反问关系。
- source_word: שְׁנוֹתֶיךָ
  choice: 你的年岁
  rationale: 直接表达带第二人称单数后缀的复数名词，并与前半句“你的日子”构成诗歌平行。
- source_word: כִּימֵי
  choice: 像……的年岁
  rationale: 原文实际为“像……的日子”，但汉语为配合本分句主语“你的年岁”，以“像……的年岁”表达相同的寿数比较，避免生硬的“年岁像……的日子”。
- source_word: גָבֶר
  choice: 强壮之人
  rationale: גָבֶר 可指男子或人，并可能带力量、健壮的色彩。“强壮之人”保留它与前句 אֱנוֹשׁ 的词义区别，同时避免“壮士”可能引出的武士或英雄含义。
theological_decisions:
- issue: 神的日子和年岁是否暗示神受人类寿命限制
  choice: 保留约伯反问的原貌，不补入解释
  alternative: 意译为“你岂像人一样寿命有限”
  rationale: 原文借“日子”和“年岁”提出反问，强调神并非受人类时间限制；正文不应把其诗性张力改写成抽象神学陈述。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“凡人”与“强壮之人”保留两处希伯来语人称名词的差别；第二分句用“也……吗”呈现诗歌平行，避免不自然的逐词结构。
