  yaml_path: translation/ot/job/010/019.yaml
  text: I would have been as though I had not been[b][a]; from the womb I would have been carried to the grave.
translation:
  language: zh_hans
  text: 我会像从未存在过一样；我会从母腹被送到坟墓。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 像……一样
  rationale: 这里引出与未曾存在这一非现实状态的比较；“像……一样”既保留比较意味，也符合现代汉语表达。
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: 我就会像从未存在过一样
  rationale: 两个 היה 形式在上下文中表达约伯所设想的非现实结果，而不是普通的将来事实；“就会……从未存在过”自然传达这一反事实意味。
- source_word: מִבֶּטֶן
  choice: 从母腹
  rationale: 保留原文“母腹”的具体意象，并与下文“坟墓”构成从出生起点直至埋葬终点的鲜明对照。
- source_word: לַקֶּבֶר
  choice: 到坟墓
  rationale: קֶבֶר 指坟墓或埋葬之处，并非作为亡者领域的阴间；“坟墓”准确且通俗。
- source_word: אוּבָל
  choice: 被送到
  rationale: יבל 的 Hophal 形式具有被动使役意味，可指“被带去、被运去”。“被送到”在现代汉语中自然，同时保留原文主体被动地从母腹直达坟墓的图景。
