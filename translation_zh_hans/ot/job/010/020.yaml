  yaml_path: translation/ot/job/010/020.yaml
  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
translation:
  language: zh_hans
  text: 我的日子不是所剩无几了吗？愿他罢手，转离我，让我稍得舒畅[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“让我稍得安慰”或“让我稍微缓过来”。原文动词表示短暂的舒展、振作或缓解。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 保留否定反问的语气，表明约伯期待对方认同。
- source_word: מְעַט יָמַי
  choice: 我的日子不是所剩无几了吗
  rationale: מְעַט与“我的日子”连用，指日子为数不多；结合上下文，以“所剩无几”自然表达余生短促之意。
- source_word: יחדל
  choice: 求你住手
  rationale: 该动词有“停止、住手”之意；语境中约伯向上帝恳求停止对付他。“求你”明确汉语中的祈求语气，但不改变隐含的受话者。
- source_word: ישית מִמֶּנִּי
  choice: 离开我
  rationale: 这是简缩且较难确定的表达，与前面的“停止”合起来表示转离或不再理会约伯；正文采用自然简洁的“离开我”，其他可能译法收入脚注。
- source_word: וְאַבְלִיגָה
  choice: 让我……舒畅一下
  rationale: בלג在此表示心境短暂缓和、振作或舒展；“舒畅一下”既可表达苦楚稍减，也不把含义限定为身体恢复。
- source_word: מְעָט
  choice: 稍微
  rationale: 作副词，表示程度或时间很有限，与“舒畅一下”搭配自然。
theological_decisions:
- issue: 约伯是否直接称呼上帝
  choice: 用第二人称“你”表达请求
  alternative: 按动词表面形式译作“愿他住手，转离我”
  rationale: 上下文中约伯正向上帝陈诉；原文表达虽简缩，功能上是向上帝发出的恳求。采用第二人称符合现代汉语对话习惯，又不额外加入上帝的称谓。
translation_notes:
  register: 采用现代、庄重而口语可懂的祈求语气。“所剩无几”自然传达生命日子短少；“住手，离开我”保留原文两个相邻动作，不将其合并而漏译。“舒畅一下”维持短暂缓解的开放含义。句末逗号按本节与下一节语法连续的形态保留。
