  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: zh_hans
  text: 那是一片幽暗之地，像极深的黑暗；有死亡的阴影[a]，毫无秩序；它所发出的光也像极深的黑暗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死亡的阴影”也可译作“极深的幽暗”。希伯来语词צַלְמָוֶת可指与死亡有关的阴影，也可泛指极深的黑暗。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: 地
  rationale: 本节承接上文，描写约伯将去而不返的阴间领域；“地”既保留空间意象，也符合现代汉语表达。
- source_word: עֵיפָתָה
  choice: 幽暗
  rationale: 此词在这里表示昏暗、阴郁；“幽暗”自然庄重，并与本节反复出现的黑暗意象协调。
- source_word: כְּמוֹ אֹפֶל
  choice: 如同漆黑
  rationale: אֹפֶל 指浓重、深沉的黑暗；“漆黑”比普通的“黑暗”更能体现其强度，并在两处重复，以保留原文的回环效果。
- source_word: צַלְמָוֶת
  choice: 死荫
  rationale: “死荫”保留该词可能包含的死亡联想，也延续庄重而凝练的圣经语言；其也可泛指极深的幽暗，故在脚注注明。
- source_word: וְלֹא סְדָרִים
  choice: 毫无秩序
  rationale: סְדָרִים 表示次序或安排；“毫无秩序”准确传达这片领域混乱无序的特征。
- source_word: וַתֹּפַע
  choice: 连光也
  rationale: 该动词表示发光或显出光亮。译作“连光也如同漆黑”以自然汉语表达原文刻意保留的悖论：那地即使显出亮光，其光仍如浓黑。
theological_decisions:
- issue: צַלְמָוֶת 是否特指与死亡有关的阴影
  choice: 正文译作“死荫”，保留死亡联想
  alternative: 译作“深深的幽暗”或“浓荫”
  rationale: 词义可能兼有“死亡的阴影”与“极深的黑暗”，不能仅凭本节完全定夺；正文保留传统且合乎语境的死亡意象，脚注呈现另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“幽暗—漆黑—死荫—漆黑”的递进与重复尽量保留原文压迫性的诗歌意象；末句不消解“发光却如黑暗”的张力，而以“连光也如同漆黑”自然呈现。
