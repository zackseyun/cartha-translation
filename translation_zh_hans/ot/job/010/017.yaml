base_translation:
  language: en
  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: zh_hans
  text: 你不断提出新的证人指控我[a]，加增你向我所发的怒气；变换和争战伴随着我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “证人”也可译作“证据”或“见证”；原文既可指控告约伯的证人，也可指对他不利的证据。
    reason: lexical_alternative
  - marker: b
    text: 本句直译近于“变换和军旅与我同在”。“变换”也可指轮替或接连而来；“军旅”也可指军队、争战、服役或苦役。因此本句可能描绘接连不断的争战，也可能指不断变换的苦役。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: 不断兴起新的
  rationale: 该词是חדש的Piel形式，可表示更新、重新带来；结合本节持续受控诉的语境，用“不断兴起新的”自然表达反复出现的新一轮行动。
- source_word: עֵדֶיךָ
  choice: 你的证人
  rationale: עֵד的复数通常指“证人”，与נֶגְדִּי连用时具有鲜明的法庭控诉色彩；也可能泛指证据，故在脚注保留。
- source_word: נֶגְדִּי
  choice: 指控我
  rationale: 本义为“在我面前／与我相对”，在司法性语境中可自然表达敌对的控诉关系。
- source_word: וְתֶרֶב
  choice: 越发
  rationale: רבה的使役形式表示使之增多或加重；“越发”与“发怒”搭配自然，并保留程度不断加深之意。
- source_word: כַּעַשְׂךָ
  choice: 向我发怒
  rationale: כעס可指愤怒、恼怒或激愤；第二人称后缀表明这是上帝的怒气。汉语以“向我发怒”自然整合后面的介词短语。
- source_word: חֲלִיפוֹת
  choice: 一批又一批
  rationale: 该词可表示更替、轮换或接连而来的班次；与צָבָא相连时，很可能描绘轮番进攻的军事力量。
- source_word: וְצָבָא
  choice: 军队
  rationale: צָבָא可指军队、战争，也可指服役或苦役；此处与“轮换”概念相连，军事图像较为连贯，但其他可能性在脚注说明。
- source_word: עִמִּי
  choice: 前来攻击我
  rationale: 字面是“与我同在／和我在一起”；在敌对语境中，汉语需显明其对抗意味，“前来攻击我”传达压缩诗句所呈现的轮番侵袭。
