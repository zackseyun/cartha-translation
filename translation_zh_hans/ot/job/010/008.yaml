  yaml_path: translation/ot/job/010/008.yaml
  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: zh_hans
  text: 你的双手塑造了我，造就了我，使我周身各处一同成形；你却吞没我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 或译“你却毁灭我”；原文直译为“你却吞下我”或“你却吞没我”，是表示毁灭的鲜明比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיךָ
  choice: 你的双手
  rationale: 原文为复数名词并带第二人称阳性单数后缀。保留“手”的具体形象，表达上帝亲自创造、精心制作约伯。
- source_word: עִצְּבוּנִי
  choice: 塑造了我
  rationale: עצב 的 Piel 形式在此表示制作、成形。“塑造”既保留工匠塑形的意味，也符合现代汉语表达。
- source_word: וַיַּעֲשׂוּנִי
  choice: 把我的全身都造就了
  rationale: עשה 是常见的“做、造”之意；此处与前一动词平行。译作“造就”可避免汉语中生硬重复，并与后面的 יחד סביב 合并表达完整受造之意。
- source_word: יַחַד סָבִיב
  choice: 全身都
  rationale: 该短语直译近于“一同、四围”，在这里很可能强调上帝从各面完整地造成人。正文采用自然汉语“全身都”，脚注保留原文的空间性措辞和可能的理解。
- source_word: וַתְּבַלְּעֵנִי
  choice: 你却吞灭我
  rationale: בלע 字面是“吞下、吞没”，也可比喻毁灭。“吞灭”在中文中保留了鲜明比喻，并用“却”显出上下文中创造与毁灭之间的强烈反差。
theological_decisions:
- issue: 以人的形体描写上帝的创造作为
  choice: 保留“你的双手”以及两个相互呼应的创造动词
  alternative: 你创造了我
  rationale: 约伯借上帝双手亲自塑造他的形象，诉诸创造者与受造者之间亲密而具体的关系。概括为“创造”会削弱原文的修辞力量。
- issue: 上帝塑造约伯与吞灭约伯之间的张力
  choice: 以“你却吞灭我”保留尖锐对比
  alternative: 如今你又要毁灭我
  rationale: 约伯的哀诉有意把上帝精心创造人的作为与现在似乎要毁灭他的作为并置。译文不替原文消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“把我的全身都造就了”以自然中文传达 יחד סביב 所强调的完整性；分号突出前后创造与吞灭的强烈转折。
