  naturalness: 原译整体庄重通顺；但“造就”在现代汉语里也常指培育、成就某人。与“塑造”并列时仍可理解为创造，不过补足“使我周身各处一同成形”可使其创造语境更清楚，且避免“把我的全身都造就了”的句法重心偏移。
