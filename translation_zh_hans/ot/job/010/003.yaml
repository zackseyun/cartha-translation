  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: zh_hans
  text: 你施行欺压，厌弃你双手所做的，却照耀恶人的谋划[a]，这对你有什么好处吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却眷顾恶人的谋划。”希伯来语动词字面意思是“发光、照耀”，在这里可能表示有利的看顾。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: 这对你有什么好处吗
  rationale: הֲ引出反问，טוֹב לְךָ直指“对你是好的吗”。采用句末反问，符合现代汉语语序，同时保留约伯直接质问上帝的语气。
- source_word: תַעֲשֹׁק
  choice: 你欺压人
  rationale: עָשַׁק常指欺压、压迫或勒索；“欺压”准确保留此处强烈的控诉色彩。补出泛指宾语“人”，使汉语表达完整，但不限定受欺压者的身份。
- source_word: תִמְאַס
  choice: 厌弃
  rationale: מָאַס兼有拒绝和鄙弃之意；“厌弃”既自然，又保留带轻蔑意味的排斥。
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: 自己双手所做的
  rationale: 该短语可指双手的劳作或劳作成果；此处指上帝亲手创造的人。“自己双手所做的”在现代汉语中自然，并保留创造者与受造物之间的关系。
- source_word: עֲצַת רְשָׁעִים
  choice: 恶人的计谋
  rationale: עֵצָה可指谋议、计划或主意；结合“恶人”，“计谋”简洁自然，并保留其计划与谋划的语义范围。
- source_word: הוֹפָעְתָּ
  choice: 照耀
  rationale: יָפַע的使役形基本意象是发光、显出光辉；“照耀”保留原文意象，不在正文中直接解释为赞同或恩待。
theological_decisions:
- issue: 约伯对上帝的拟人化控诉
  choice: 保留“你欺压人”“厌弃”等直接质问，不加“仿佛”或“看来”等缓和语。
  alternative: 译作“你仿佛欺压人”或“你似乎厌弃”。
  rationale: 希伯来文以尖锐的反问直接向上帝发出控诉。保留这种张力，既忠于约伯哀诉的修辞，也不由译者预先化解经文本身留下的神学难题。
- issue: הוֹפָעְתָּ在本句中的比喻意义
  choice: 正文译为“照耀”，保留光的隐喻。
  alternative: 意译为“恩待”“眷顾”或“赞同”。
  rationale: 上下文可能表达上帝对恶人计谋的有利看顾，但动词本身使用发光意象。正文保留隐喻，脚注说明可能的语用含义，以免把解释写死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。将反问置于句末，使三个并列行为自然汇入质问；“却”显明厌弃自己作品与照耀恶人计谋之间的强烈反差。
