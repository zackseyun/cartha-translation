base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: zh_hans
  text: 我若作恶，我就有祸了！即使我为义，也抬不起头来；我饱受羞辱，看着自己的苦难。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末尾的希伯来语短语句法较难确定，也可译作：“你看我的苦难！”或“看看我的苦难！”这样理解时，是约伯直接向上帝呼求。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: 我若作恶
  rationale: 完成式可指已经行恶，也可在条件句中概括作恶的情形。“作恶”保留其道德含义，又不把它缩窄为纯法律意义的“有罪”状态。
- source_word: אַלְלַי לִי
  choice: 就有祸了
  rationale: 这是强烈的哀叹语；此译自然地传达“我有祸了”的感叹力量，并与前面的条件句顺畅衔接。
- source_word: וְצָדַקְתִּי
  choice: 即使我为义
  rationale: וְ 在此处具有转折、让步意味。“即使”显明与上一分句的对照；“为义”保留 צדק 的道德与司法双重色彩。
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: 也抬不起头来
  rationale: “抬头”是带着尊严或信心面对处境的惯用表达；“抬不起”贴合约伯在羞辱中实际无力昂首的语境。
- source_word: שְׂבַע קָלוֹן
  choice: 我满受羞辱
  rationale: שְׂבַע 表示饱足、充满，קָלוֹן 指羞耻和受辱。“满受羞辱”既传达饱受其苦的程度，也符合现代汉语表达。
- source_word: וּרְאֵה עָנְיִי
  choice: 只看见自己的苦难
  rationale: 希伯来语句法艰难。正文把它理解为延续约伯的自述，即他眼前尽是自己的苦难；“只”在汉语中自然表现他被苦难充满、占据的状态，但不否认另一种祈使读法。
theological_decisions:
- issue: וּרְאֵה עָנְיִי 的句法归属
  choice: 作为约伯自述的延续：“只看见自己的苦难”
  alternative: 作为对上帝的直接呼求：“求你看看我的苦难”或“看看我的苦难”
  rationale: 马所拉文本的形式与句法容许不止一种理解。正文采用与“满受羞辱”相连的自述读法，使哀歌语流较连贯；脚注保留直接向上帝呼求的可能性，避免消除原文的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我若作恶……即使我为义”保留道德与司法之间的张力；末句用正文加脚注呈现希伯来语真实的句法歧义。
