base_translation:
  language: en
  yaml_path: translation/ot/job/010/002.yaml
  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
translation:
  language: zh_hans
  text: 我要对上帝说：“不要定我有罪[a]；请让我知道，你为什么与我争辩[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣判我有罪”；原文动词带有司法含义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“控告我”或“与我争讼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: 我要……说
  rationale: Qal未完成式第一人称单数在此引出约伯将要向上帝说的话；“我要……说”自然保留其前瞻或意愿色彩。
- source_word: אֶל אֱלוֹהַּ
  choice: 对上帝
  rationale: אֱלוֹהַּ是《约伯记》中常见的单数神称；译作“上帝”符合现代普通话表达。
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: 不要定我有罪
  rationale: רשע的Hiphil形式具有司法语义，指宣判或判定某人有罪；此译比笼统的“不要定我的罪”更准确，也不过度发挥。
- source_word: הוֹדִיעֵנִי
  choice: 请让我知道
  rationale: ידע的Hiphil命令式意为使人知道、告知；加入“请”自然表达约伯恳求的语气。
- source_word: עַל מַה
  choice: 为什么
  rationale: 该结构在此询问缘由或根据，现代汉语以“为什么”最自然。
- source_word: תְּרִיבֵנִי
  choice: 你为什么与我争辩
  rationale: ריב可指争辩、争讼或提出诉讼；“与我争辩”保留人际冲突和司法争讼两层可能，不把语义限定为正式诉讼。
theological_decisions:
- issue: 约伯向上帝申诉时的司法语气
  choice: “定我有罪”与“与我争辩”
  alternative: “宣判我有罪”与“控告我”；或“把我当作恶人”与“同我相争”
  rationale: 原文带有明显的司法和争讼色彩，但未必描写一套完全技术化的法庭程序。正文既保留约伯对上帝提出司法式申诉的张力，又不把含义收窄为正式控告。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我要对上帝说”承接约伯讲话的进程；“请让我知道”体现恳求语气。两个脚注标记均置于正文相应词语之后，并保留原文司法用语的语义幅度。
