revisions:
- from: 要查找我的罪孽，追究我的罪吗？[a]
  to: 以致你查究我的罪孽，查察我的罪吗？[a]
  rationale: 修订仅调整动词和连接方式：“查究……查察……”较准确地表达两项平行的查问／搜寻动作，避免“追究”所可能附加的追责意味；“以致”则更明晰地承接上一节的反问。罪孽与罪的对应及其未决的神学张力均予保留。
