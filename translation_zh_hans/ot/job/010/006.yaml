  text: that you seek out my iniquity and search for my sin?[a]
translation:
  language: zh_hans
  text: 以致你查究我的罪孽，查察我的罪吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你查究我的罪责，查察我的罪吗？”
    reason: כִּי也可按原因关系译为“因为”；עָוֹן也可译为“罪责”。问号承接上一节的反问。
lexical_decisions:
- source_word: כִּי
  choice: 要……吗
  rationale: 本节承接上一节的反问，表达所问行动的内容或目的；汉语用“要……吗”自然延续问句，而不把它明确处理为因果关系。
- source_word: תְבַקֵּשׁ
  choice: 查找
  rationale: בקש 的强化词干在此有主动寻找、查究之意；“查找”既保留搜寻意味，也符合约伯指控上帝审查过错的语境。
- source_word: לַעֲוֺנִי
  choice: 我的罪孽
  rationale: עָוֹן 可指罪孽、罪责或罪的惩罚；此处与“罪”平行，重点是被搜查的道德过错，译作“罪孽”可保留其伦理含义而不预断约伯确实有罪。
- source_word: וּלְחַטָּאתִי
  choice: 我的罪
  rationale: חַטָּאת 在此与 עָוֹן 构成平行，译作“罪”简洁自然，同时保留两个希伯来词之间并非完全相同的表达。
- source_word: תִדְרֹשׁ
  choice: 追究
  rationale: דרש 可指寻求、查问或调查；“追究”在现代汉语中传达深入查察过错的意味，也与前面的“查找”形成有变化的平行。
theological_decisions:
- issue: עָוֹן 与 חַטָּאת 这两个词的处理
  choice: 译作“罪孽”和“罪”，不暗示约伯事实上有罪
  alternative: 译作“罪责”和“罪”，或“过错”和“罪行”
  rationale: 本节表达约伯的申诉：上帝似乎在他身上搜查罪过。译文应保留这一感受和指控，却不替全书预先裁定约伯有罪与否。
- issue: כִּי 与上文反问的关系
  choice: 按承接上文的内容或目的关系处理，以“要……吗”延续问句
  alternative: 译作“因为”或“原来你”而构成原因说明
  rationale: 上下文更适合把本节看作前一节反问的延续；但不将其逻辑关系过度限定为单一类别。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“查找……追究……”保留希伯来诗句的平行结构；句末问号承接约伯在上文开始的反问。脚注标记已在正文中列出。
