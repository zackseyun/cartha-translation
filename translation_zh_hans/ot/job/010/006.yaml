  source_fidelity: 正文正确保留了约伯对上帝的反问语气，以及“罪孽／罪”的平行。惟“追究”通常带有追责、处分或认定责任的意味，较希伯来语דרש在此与“寻找、查问、查察”相平行的探究义略强；改为“查察”更不预设罪责已被证实或将受追责。
  naturalness: “查究……查察……”在庄重的现代汉语中自然，且能保留诗行的平行与递进。用“以致”明示其承接10:5反问的从属关系；本节若单独呈现，仍以问号保留继承而来的反问。
  terminology: “罪孽”对应עָוֹן、“罪”对应חַטָּאת，保留二者的词汇区别而不作神学定论。脚注保留“因为”和“罪责”的可行替代；“查究／查察”也避免将调查性的动词译成带惩罚意味的“追究”。
