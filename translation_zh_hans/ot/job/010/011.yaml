base_translation:
  language: en
  yaml_path: translation/ot/job/010/011.yaml
  text: You clothed me with skin and flesh[a], and wove me together with bones and sinews.
translation:
  language: zh_hans
  text: 你给我穿上皮和肉，又用骨头和筋把我编织起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又用骨头和筋把我包裹起来。”原文动词也可表示遮盖、围护。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: 皮
  rationale: 在人体形成的语境中指人的皮肤；此处用“皮”与“肉”并列，简洁地保留原文具体的身体意象。
- source_word: בָשָׂר
  choice: 肉
  rationale: 直接指身体的肉质组织，并与“皮”形成原文中的具体并列；译作“身体”会过于宽泛。
- source_word: תַּלְבִּישֵׁנִי
  choice: 你给我穿上
  rationale: 保留使役动词“给……穿上”的穿衣隐喻；虽带有诗性陌生感，却准确呈现上帝以皮和肉覆于约伯身上的图像。
- source_word: בַּעֲצָמוֹת
  choice: 用骨头
  rationale: 介词在此可表凭借或构成材料；“用骨头”在现代汉语中自然，也与后面的“筋”并列。
- source_word: גִידִים
  choice: 筋
  rationale: 该词指筋腱等连接身体的组织。“筋”通俗、凝练，适合诗体，且不采用过于临床化的术语。
- source_word: תְּסֹכְכֵנִי
  choice: 把我编织起来
  rationale: 该动词可表达遮盖、围护，也可在本语境中传达交织构成的意象。“编织起来”呼应身体形成的语境，同时以脚注保留“包裹”的词义可能。
theological_decisions:
- issue: 上帝塑造人体的诗性意象
  choice: 按上下文译为上帝以皮、肉、骨和筋构成约伯的身体，不扩展为经文未明说的系统性人论。
  alternative: 将后半句较严格地译为用骨头和筋包裹或围护约伯。
  rationale: 本节位于约伯追述自身受造的语境中；“编织起来”传达塑造身体的诗意，但脚注保留原动词“遮盖、包裹”的真实歧义，避免把一种解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“给我穿上皮和肉”有意保留希伯来文鲜明的穿衣隐喻；“骨头和筋”比专业解剖术语更适合普通读者。
