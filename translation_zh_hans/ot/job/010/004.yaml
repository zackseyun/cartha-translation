  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: zh_hans
  text: 你有肉身的眼睛吗？还是你像人那样看？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַ/עֵינֵי בָשָׂר לָךְ
  choice: 你有血肉的眼睛吗
  rationale: 希伯来语以疑问词、‘眼睛’、‘肉体’及表示领有的‘对你’构成无动词问句。中文用‘你有……吗’自然表达领有关系，并保留‘血肉的眼睛’这一具体意象。
- source_word: אִם
  choice: 还是
  rationale: 此处引出反问中的另一项，而非条件句；‘还是’能清楚表达选择、对举关系。
- source_word: כִּ/רְאוֹת
  choice: 像……一样观看
  rationale: 介词כ与ראה的不定式构成比较，意为‘像……观看那样’。中文展开为‘像……一样观看’，既自然又保留与‘眼睛’相呼应的视觉用语。
- source_word: אֱנוֹשׁ
  choice: 世人
  rationale: אֱנוֹשׁ是泛指单数的人，可带脆弱、必死之人的意味。‘世人’在现代中文中自然表达泛指的人类，同时不把‘必死、软弱’这一语义色彩过度明说。
- source_word: תִּרְאֶה
  choice: 你也……观看
  rationale: ראה在此指看见、观看或察看。采用‘观看’保留视觉意象；‘也’顺应中文比较句，凸显是否与人同样观看的反问。
theological_decisions:
- issue: 关于上帝感知方式的拟人表达
  choice: 保留‘血肉的眼睛’和‘像世人一样观看’的具体反问
  alternative: 意译为‘你也像人一样只看外表吗？’
  rationale: 原文以具象方式对比上帝与受肉身限制之人的观看，却未直接说‘只看外表’。保留原有张力，避免加入经文没有明说的判断方式。
- issue: אֱנוֹשׁ的泛指单数
  choice: 译为‘世人’
  alternative: ‘一个人’或‘必死的人’
  rationale: 中文‘世人’可自然承载代表性、泛指性，也隐约保留人与神相对的有限性；‘必死的人’会把可能的语义色彩提升为明说，‘一个人’则在中文中容易显得特指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个并列反问保持简洁；保留‘血肉的眼睛’这一略具诗性的身体意象，不以抽象神学术语解释。
