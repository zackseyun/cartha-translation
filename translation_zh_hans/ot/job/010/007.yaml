base_translation:
  language: en
  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: zh_hans
  text: 尽管你知道我不是恶人[a]，却没有谁能从你手中[b]把我救出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我并非有罪。”希伯来文直译是“我不是恶人”，重点在于约伯否认自己是恶人，并不等于声称自己绝对无罪。
    reason: lexical_alternative
  - marker: b
    text: “从你手中”是希伯来语的表达，意为从某人的权能或控制之下。
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: 尽管你知道
  rationale: 该短语在上下文中带有让步意味；这样译既自然地表达约伯的申诉，也保留他直接诉诸上帝所知之事的语气。
- source_word: כִּי
  choice: （由“知道”直接引出宾语从句）
  rationale: כִּי在此引出上帝所知道的内容。现代汉语无需另加对应词，直接说“知道我……”最自然。
- source_word: לֹא אֶרְשָׁע
  choice: 我不是恶人
  rationale: רשע是“邪恶、恶人”一类的道德用语；此处未完成式可按状态理解。该译法保留约伯否认自己属于恶人的申诉，不扩大为绝对无罪。
- source_word: וְאֵין
  choice: 却没有谁
  rationale: אֵין表示不存在；“没有谁”自然表达绝对否定。“却”承接前半句的让步关系，使汉语逻辑清楚。
- source_word: מִיָּדְךָ
  choice: 从你手中
  rationale: 保留希伯来语“手”的意象；这里指处于对方的权能或控制之下。
- source_word: מַצִּיל
  choice: 能……把我救出来
  rationale: נצל的使役分词指施行搭救者；结合“没有谁”译成“没有谁能……救出来”符合现代汉语，并明确上下文中隐含的被救者约伯。
theological_decisions:
- issue: 约伯在上帝面前宣称自己清白的范围
  choice: 译作“我不是恶人”
  alternative: “我无罪”或“我没有罪”
  rationale: 原文使用רשע，重点是约伯否认自己是恶人，并非明确宣称绝对无罪。这样既保留约伯申诉中的神学张力，也不替文本作更强的教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“尽管……却……”清楚呈现上下文中的让步关系；保留“手”的原文意象，并通过脚注说明其含义。
