  text: חַיִּ֣ים וָ֭/חֶסֶד עָשִׂ֣יתָ עִמָּדִ֑/י וּ֝/פְקֻדָּתְ/ךָ֗ שָֽׁמְרָ֥ה רוּחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: zh_hans
  text: 你赐给我生命和慈爱；你的眷顾[a]保全了我的灵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”也可译作“鉴察”或“照管”。
    reason: lexical_alternative
  - marker: b
    text: “我的灵”也可译作“我的气息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: 生命
  rationale: 该词虽为复数形式，在这里通常表达抽象而完整的“生命”；现代汉语用单数概念“生命”最自然。
- source_word: וָחֶסֶד
  choice: 慈爱
  rationale: חֶסֶד包含仁慈、忠贞和持久恩爱的意味。“慈爱”在中文圣经语境中庄重易懂，又不把含义局限为怜悯或特定盟约术语。
- source_word: עָשִׂיתָ עִמָּדִי
  choice: 你赐给我
  rationale: 原文直译近于“你向我施行”，与“生命和慈爱”连用时表达把福分赐予约伯；译为“赐给我”符合现代汉语，也保留受惠含义。
- source_word: וּפְקֻדָּתְךָ
  choice: 你的眷顾
  rationale: פְקֻדָּה可指察看、监管或照料；下文说它保全生命，因此“眷顾”恰当地表达上帝带有善意的关注，同时以脚注保留其他可能。
- source_word: שָׁמְרָה
  choice: 保全了
  rationale: 该动词意为看守、保护、保存；“保全了”贴合上帝使约伯的灵得以存留这一语境。
- source_word: רוּחִי
  choice: 我的灵
  rationale: רוּחַ可指灵、气息或生命之气。“我的灵”保留其指向内在生命或自身的宽度；“我的气息”作为真实的词义可能列入脚注。
theological_decisions:
- issue: חֶסֶד用于描述上帝时的含义
  choice: 慈爱
  alternative: 恩慈、怜悯、信实之爱
  rationale: “慈爱”保留上帝仁厚而持久的爱，不将经文收窄为单纯怜悯，也不额外断定这里专指某项盟约教义。
- issue: פְקֻדָּה的正面或中性含义
  choice: 眷顾
  alternative: 鉴察、照管
  rationale: 该词本身可表示察看或监管，但“保全了我的灵”使正面的照料之意在本句中更为合适；脚注仍呈现其词义幅度。
- issue: רוּחִי所指
  choice: 我的灵
  alternative: 我的气息
  rationale: 上下文既可理解为上帝保存约伯的内在生命，也可能侧重维系他的呼吸。正文采用较宽的“灵”，脚注保留“气息”，不消除原文歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“赐给我”自然呈现希伯来语受惠结构；分号体现两个紧密相连的诗行。正文中的脚注标记均紧随所说明的词语。
