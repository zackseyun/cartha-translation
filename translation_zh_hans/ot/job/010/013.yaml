  text: וְ֭/אֵלֶּה צָפַ֣נְתָּ בִ/לְבָבֶ֑/ךָ יָ֝דַ֗עְתִּי כִּי זֹ֥את עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/013.yaml
  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: zh_hans
  text: 然而，你把这些事藏在心里[a]；我知道，这事原在你那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “藏”也可译作“存留”或“保留”。希伯来语动词可指隐藏某物，也可指把某物储存起来、留待以后。
    reason: lexical_alternative
  - marker: b
    text: “这事原在你那里”也可理解为“这事是你心中的意念”，或“这事是你隐藏计划的一部分”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 然而，这些事
  rationale: וְ本可译作“并且”，但上下文从上节所述的恩惠转向隐藏的意图，用“然而”自然体现语境中的转折，同时保留אֵלֶּה的复数指示意义。
- source_word: צָפַנְתָּ
  choice: 你……藏
  rationale: צפן可表示“隐藏、储存、保留”。此处谈到神内心未显明的事，译作“藏”最贴合语境；脚注保留“存留”的可能。
- source_word: בִלְבָבֶךָ
  choice: 在心里
  rationale: לֵבָב可指心、思想、意志或内在自我。“在心里”保留希伯来语的身体隐喻，也符合现代汉语表达。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 该第一人称单数完成式直接表达约伯的认知；“我知道”自然简洁，不额外加入“领悟”等解释。
- source_word: כִּי
  choice: （引出“我知道”的内容）
  rationale: 此处כִּי引出约伯所知道的内容；汉语无需另译连接词，以逗号衔接更自然。
- source_word: זֹאת
  choice: 这事
  rationale: 阴性单数指示词概括回指前述隐藏之事。“这事”保留单数形式及所指对象的含混性，不具体化为某项计划。
- source_word: עִמָּךְ
  choice: 在你那里
  rationale: עִם加第二人称后缀直译为“与你同在／在你那里”。“在你那里”在汉语中较自然，并保留此事属于神、存在于神那里或在神心中的多重可能。
theological_decisions:
- issue: 约伯所说神隐藏之事的性质
  choice: 保留“这些事”和“这事”的指向含混，只呈现约伯认定神心中藏有未显明之事。
  alternative: 明确译为神暗中计划使约伯受苦，或把“这些事”专指上一节的恩惠。
  rationale: 希伯来文本没有明确界定“这事”究竟指什么。译文不把约伯的控诉扩展为更具体的神学断言，从而保留原文的张力。
- issue: “这事在你那里”的含义
  choice: 采用较贴近原文的“在你那里”，并以脚注说明可能指神心中的想法或隐藏的意图。
  alternative: 正文直接译为“这是你心中的意念”或“这是你暗藏的旨意”。
  rationale: 直接加入“意念”或“旨意”会缩窄עִמָּךְ的语义；正文保留原有惯用语的开放性更稳妥。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“藏在心里”保留希伯来语的内心隐喻；“这事在你那里”略带原文风格，但仍可理解，并有意保存原句的含混与神学张力。
