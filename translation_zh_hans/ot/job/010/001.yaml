base_translation:
  language: en
  yaml_path: translation/ot/job/010/001.yaml
  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
translation:
  language: zh_hans
  text: '我厌恶自己的生命；[a]

    我要任由我的哀诉倾泻而出；[b]

    我要在我内心的苦楚中诉说。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已厌倦自己的生命。”希伯来语动词既可表示强烈的厌倦，也可表示厌恶。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我要放开我的哀诉。”这一希伯来语习语表示约伯不再抑制自己的悲叹。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקְטָה
  choice: 厌恶
  rationale: 该动词可表达强烈的厌倦或憎恶；“厌恶”保留了原文的强烈情绪，同时在现代汉语中自然凝练。
- source_word: נַפְשִׁי
  choice: 我的心／心灵
  rationale: נֶפֶשׁ在此指约伯内在的自我或生命主体。首句译为“我的心”较符合现代汉语表达，末句译为“心灵”以避免生硬重复，同时保留内在痛苦的意象。
- source_word: בְּחַיָּי
  choice: 自己的生命
  rationale: 介词结构在此以约伯的生命为厌恶的对象；配合“我的心”，用“自己的生命”可清楚呈现同一主体的反身关系。
- source_word: אֶעֶזְבָה עָלַי
  choice: 我要任由……倾泻而出
  rationale: 这一习语不是单纯的“离开”，而是撤去约束、任其释放；此译自然表达约伯不再压抑哀诉的决意。
- source_word: שִׂיחִי
  choice: 我的哀诉
  rationale: 在约伯的哀歌语境中，该词指忧苦的诉说或抱怨。“哀诉”兼具悲叹与申诉意味，不预先判定其言语是否不当。
- source_word: אֲדַבְּרָה
  choice: 我要……诉说
  rationale: 祈愿式在此表达坚定意愿；“我要”保留其决意，“诉说”与上下文的哀诉相呼应。
- source_word: בְּמַר נַפְשִׁי
  choice: 在心灵的苦痛中
  rationale: מַר字面与“苦”有关，在此描述内在的苦楚或苦毒状态；“苦痛”较自然地表达约伯的深切痛苦，而不暗示道德上的怨毒。
theological_decisions:
- issue: 约伯对生命的强烈否定
  choice: 保留“厌恶自己的生命”的直白力度
  alternative: 弱化为“厌倦自己的生活”
  rationale: 原文容许厌倦与憎恶之间的语义幅度，但语气强烈；正文保留其尖锐性，脚注说明较弱的可能译法，不对约伯的情绪作神学评判。
- issue: נֶפֶשׁ的理解
  choice: 按内在自我译为“心／心灵”
  alternative: 逐字统一译为“灵魂”
  rationale: 此处不必读作与身体分离的实体；现代汉语“心／心灵”更自然地指整个人内在的感受，同时不排除原词更广的生命与自我含义。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“哀诉倾泻而出”传达解除约束的希伯来语习语；分为三行以呈现原句的三个平行意群。所有脚注标记均置于相应正文之后。
