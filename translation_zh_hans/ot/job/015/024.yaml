lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: 使他惊恐
  rationale: 该动词的皮埃勒形态表达使人陷入强烈恐惧；“使他惊恐”既保留使役力度，也符合现代汉语表达。
- source_word: צַר
  choice: 患难
  rationale: 此词可指困境、压迫或患难；与下文“痛苦”并列时，“患难”自然地呈现外在困厄。
- source_word: מְצוּקָה
  choice: 痛苦
  rationale: 此词有受压、困窘及苦楚之意；译作“痛苦”与“患难”形成自然的诗意并列，又避免同义重复。
- source_word: תִּתְקְפֵהוּ
  choice: 它们压倒他
  rationale: 动词为阴性单数，但诗句前有两个并列名词，可合看为一个复合概念；汉语用复数代词承接“患难和痛苦”，并以“压倒”表达强力胜过、制伏之意。
- source_word: כְּמֶלֶךְ
  choice: 如同君王
  rationale: 忠实表达比较介词和“王”，并保持比喻的庄重语气。
- source_word: עָתִיד
  choice: 整装待
  rationale: 在此表示已经准备好、蓄势以待；结合军事语境译为“整装待”简洁自然。
- source_word: לַכִּידוֹר
  choice: 战
  rationale: כידור是罕见词，语境大概指战斗、攻击或武装突袭；正文用宽泛而清楚的“战”，不把不确定的具体含义定死。
