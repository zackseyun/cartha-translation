  text: A sound of terrors is in his ears[a]; in prosperity the destroyer comes upon him.
translation:
  language: zh_hans
  text: 惊恐之声在他耳中；他正安稳时[a]，毁灭者临到他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正平安时”“正安全时”或“正兴旺时”；希伯来语שָׁלוֹם可指平安、安全、安康或兴旺。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: 声响
  rationale: 该词可指“声音”或“嗓音”；这里与“恐怖”构成短语，描写听觉上的可怕声响，并非清楚表达的言语，因此译作“声响”。
- source_word: פְּחָדִים
  choice: 恐怖
  rationale: 原文为复数，可指种种令人惊恐的事物或警讯；汉语“恐怖的声响”自然地保留其强烈、具体的威胁感，而不只表达内心的惧怕。
- source_word: בְּאָזְנָיו
  choice: 在他耳中
  rationale: 贴近原文具体意象，不增添“回荡”“不断响起”等原文未明说的持续意味。
- source_word: בַּשָּׁלוֹם
  choice: 他正安稳时
  rationale: שָׁלוֹם的语义范围包括平安、安全、安康和兴旺；“安稳”适合突然遭毁灭者侵袭的语境，同时避免把含义限缩为财富上的兴旺。
- source_word: שׁוֹדֵד
  choice: 毁灭者
  rationale: 该分词指实施掠夺、蹂躏或毁坏的人；“毁灭者”在现代汉语中清楚有力，也不把含义过度限缩为偷盗财物的人。
- source_word: יְבוֹאֶנּוּ
  choice: 就临到他
  rationale: 动词意为“来”，并带第三人称阳性单数宾语后缀；“临到他”表达带有敌意的到来。“就”自然呈现安稳与突袭之间的反差，但不把诗句严格限定为将来时。
