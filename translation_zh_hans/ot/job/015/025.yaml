  text: כִּֽי נָטָ֣ה אֶל אֵ֣ל יָד֑/וֹ וְ/אֶל שַׁ֝דַּ֗י יִתְגַּבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/025.yaml
  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: zh_hans
  text: 因为他伸手攻击上帝[a]，又向全能者逞强。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他向上帝伸出手，又向全能者显示自己的强大。”
    reason: 保留אֶל较字面的“向、朝着”，并表达יִתְגַּבָּר“使自己显得强大”的反身意味。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出恶人遭受审判的原因；“因为”清楚表达因果关系。
- source_word: נָטָה אֶל אֵל יָדוֹ
  choice: 他伸手敌挡上帝
  rationale: 保留“伸手”的具体意象，并依据敌对语境将 אֶל 所指的方向关系表达为“敌挡”；脚注保留更贴近字面的“向……伸出手”。
- source_word: אֵל
  choice: 上帝
  rationale: 作为通用神称译为“上帝”，并与下半句的 שַׁדַּי 区分，以保留诗句的平行结构。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 将神的称号译出而不音译；“全能者”是准确、简洁且通行的现代汉语表达。
- source_word: יִתְגַּבָּר
  choice: 逞强
  rationale: 该词的 Hitpael 词形表达使自己显得强大、自恃刚强；“逞强”自然地传达其反身意味，以及人在全能者面前妄自强大的讽刺色彩。
theological_decisions:
- issue: 诗歌平行句中两个神圣称号的处理
  choice: 将 אֵל 译为“上帝”，将 שַׁדַּי 译为“全能者”
  alternative: 将 שַׁדַּי 音译为“沙代”，或将 אֵל 扩译为“大能的上帝”
  rationale: 两个称号均按其意义翻译，同时采用不同措辞保留原文的诗歌平行关系，避免把两个称号合并或造成不必要的重复。
- issue: 敌对含义与字面方向义之间的张力
  choice: 正文译作“伸手敌挡上帝”
  alternative: “向上帝伸出手”
  rationale: 介词 אֶל 本义为“向、朝着”，但本节下半句及上下文表明这是敌对行动。正文使现代读者清楚理解其敌意，脚注则保留原文较为字面的方向表达和可能的语义张力。
translation_notes:
  register: 采用现代、庄重而简洁的汉语。“伸手敌挡”保留希伯来语的身体意象；“逞强”既自然，也呈现人与“全能者”抗衡所带的反讽意味。
