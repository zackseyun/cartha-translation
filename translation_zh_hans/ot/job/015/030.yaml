source:
  edition: WLC
  text: לֹֽא יָס֨וּר מִנִּי חֹ֗שֶׁךְ יֹֽ֭נַקְתּ/וֹ תְּיַבֵּ֣שׁ שַׁלְהָ֑בֶת וְ֝/יָס֗וּר בְּ/ר֣וּחַ פִּֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: zh_hans
  text: 他不能脱离黑暗；火焰必使他的嫩枝枯干[b]，他也必因自己口中的气息而消逝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己口中的气息”也可理解为上帝口中的气息；若如此，末句可译作：“他也必因上帝口中的气息而消逝。”
    reason: alternative_reading
  - marker: b
    text: “嫩枝”保留了原文的植物意象：恶人被描绘成一棵树，新长的枝条被火焰灼得枯干。
    reason: cultural_note
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: 不能脱离黑暗
  rationale: סור与מן连用，基本义为“离开、转离”；这里表示恶人无法离开黑暗或灾祸。“不能脱离”既贴近原文，也符合现代汉语表达，且没有把它进一步解释成“逃脱惩罚”。
- source_word: יֹנַקְתּוֹ
  choice: 他的嫩枝
  rationale: 该词指植物新长出的枝条或幼芽。译作“嫩枝”能清楚保留本节把恶人比作树木的意象，也比植物学色彩较强的说法更易懂。
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: 火焰必使……枯干
  rationale: יבש的加强词干表示“使干枯”，שלהבת指火焰。“使……枯干”延续植物意象，并呈现烈火灼枯嫩枝的毁灭画面。
- source_word: וְיָסוּר
  choice: 他也必……消逝
  rationale: 动词仍是סור，字面可指“离去”。此处用于恶人最终被除去，译作“消逝”在汉语中较自然，同时保留其灭亡意味。
- source_word: בְּרוּחַ פִּיו
  choice: 因自己口中的气息
  rationale: רוּחַ可指气息、风或灵；与“口”搭配时，“气息”最直接。译文保留具体意象，不将其扩充为言语、命令或神的灵。
- source_word: פִּיו
  choice: 自己口中
  rationale: 三人称阳性单数后缀按就近语法关系，主文理解为指恶人本人。用“自己”使现代汉语的回指清楚；另一种把它理解为上帝之口的读法则收入脚注。
theological_decisions:
- issue: 末句“他口中”的所指
  choice: 主文理解为恶人的口
  alternative: 理解为上帝的口，即恶人因上帝口中的气息而消逝
  rationale: 上下文持续以单数描述恶人，原文也没有明确标出主语转换，因此主文采用较近的语法先行词。不过，“他口中的气息”也可能使人联想到上帝施行审判的气息；原文未明说所指，故以脚注保留这一神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不能脱离黑暗”保留原文的灾祸意象；“嫩枝—枯干”维持整句的树木比喻。末句避免擅自明确“他口中”究竟指恶人还是上帝，主文按就近所指翻译，脚注保留另一读法。
