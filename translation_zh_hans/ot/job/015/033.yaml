  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: zh_hans
  text: 他必像葡萄树一样，摇落自己未成熟的葡萄[a]；又像橄榄树一样，抛下自己的花[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摇落”也可译作“剥去”。原文动词通常带有强行夺取或施暴的意味；这里的农业意象指未成熟的果子过早失落。
    reason: lexical_alternative
  - marker: b
    text: “花”也可译作“花朵”或“繁花”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹס
  choice: 摇落
  rationale: 该动词通常含有强行夺取、施暴或剥夺之意；在葡萄树与未熟果子的农耕意象中，“摇落”自然表达果实尚未成熟便遭脱落，同时保留外力造成损失的意味。较强的词义另见脚注。
- source_word: כַּגֶּפֶן
  choice: 像葡萄树一样
  rationale: גֶּפֶן在此指葡萄树，前缀כַּ־引出比喻；这样的译法清楚保留原文的比较结构。
- source_word: בִּסְרוֹ
  choice: 自己未熟的葡萄
  rationale: בֹּסֶר指尚未成熟的葡萄；第三人称阳性单数后缀以“自己”表达，使其与本句主语及拟人化树木的意象衔接自然。
- source_word: וְיַשְׁלֵךְ
  choice: 又……抛落
  rationale: שׁלך的使役形表达扔下、抛出；“抛落”既保留主动动作，也符合橄榄树过早失去花朵的图景。
- source_word: כַּזַּיִת
  choice: 像橄榄树一样
  rationale: זַיִת可指橄榄或橄榄树；因上下文描述花朵脱落，此处明确译作“橄榄树”。
- source_word: נִצָּתוֹ
  choice: 自己的花朵
  rationale: נִצָּה指植物的花或花朵；“花朵”是现代汉语中清楚自然的表达，并保留结果之前便夭折的意象。
