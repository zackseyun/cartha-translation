  text: It will be paid in full before his time[b][a], and his branch will not stay green.
translation:
  language: zh_hans
  text: 未到他的时候，这事就必成就[a]；他的枝条[b]必不青翠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事就必达到满盈”或“这事就必完成”。希伯来语动词的字面意思是“被充满、成为满的”，本句所指的确切含义有争议。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的棕榈枝”或“他的顶梢”。希伯来语这个词指树木或植物上呈枝状的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  choice: 未到他的时候
  rationale: 直译为“不在他的日子”，在本段论恶人过早衰亡的语境中，采用自然的时间表达“未到他的时候”，同时不具体断定是寿数、定期还是人生盛期。
- source_word: תִּמָּלֵא
  choice: 这事就必成就
  rationale: 该词是 מלא 的未完成式被动形态，基本义为“被充满、达到满盈”，语境中的确切所指未明。“成就”保留事情达到完成状态的意思，又避免直接加入原文没有明说的金钱偿付意象。
- source_word: כִפָּתוֹ
  choice: 他的枝条
  rationale: 该名词指植物的枝状部分，可能特指棕榈枝或树冠、顶梢。“枝条”在中文中自然，并保留与下文“青翠”相连的植物意象。
- source_word: לֹא רַעֲנָנָה
  choice: 必不再青翠
  rationale: רענן 描写植物鲜绿、茂盛的状态。“青翠”具体保留植物色泽和生命力的意象；“不再”依上下文表达其失去或不能保持这种状态。
theological_decisions:
- issue: 恶人所遭遇之事是否应明确译作报应或偿付
  choice: 译作“这事就必成就”，不明说“报应”或“偿付”
  alternative: “他所得的报应就必全数临到”或“他必得到全数偿付”
  rationale: 上下文支持审判或报应的理解，但本节希伯来文本没有明示“报应”“工价”或金钱偿付；较含蓄的译法保留原文的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“未到他的时候”表达过早发生之意；“青翠”维持上下两句中的植物意象。代词“这事”承接上下文，同时反映希伯来文首句主语未明的特点。
