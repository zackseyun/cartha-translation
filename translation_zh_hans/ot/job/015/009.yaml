  yaml_path: translation/ot/job/015/009.yaml
  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: zh_hans
  text: 你知道什么是我们不知道的？你明白什么是我们所没有的？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并不与我们同在。”希伯来文直译为“而它不与我们同在”。
    reason: 保留עִמָנוּ的字面空间／同在表达，以及“我们所没有的”这一所有关系译法之外的可能表达。
lexical_decisions:
- source_word: מַה יָדַעְתָ וְלֹא נֵדָע
  choice: 你知道什么是我们不知道的
  rationale: מַה引出简洁的反问；ידע的完成式在此表达当前所具备的知识，用现代汉语“知道”最自然。将וְלֹא按上下文处理为关系性对比“是我们不知道的”，保留希伯来文的平行结构和质问语气。
- source_word: תָבִין
  choice: 你明白
  rationale: בין在此指理解、领会，与上一分句的“知道”构成近义平行；“明白”自然清楚，也不把含义窄化为某种专门的辨别能力。
- source_word: וְלֹא עִמָנוּ הוּא
  choice: 是我们所没有的
  rationale: 原文直译为“而它不与我们同在”。在本句语境中，עִם可表达某物为人所拥有；正文采用自然汉语“我们所没有的”，同时以脚注保留“与我们同在”的字面表达及其意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的反问语气，维持原文两个分句的紧密平行。正文以自然汉语表达所有关系，脚注交代希伯来文的字面措辞。
