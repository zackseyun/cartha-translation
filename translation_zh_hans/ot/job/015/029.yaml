  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: zh_hans
  text: 他不会变得富足，他的财富也不能长存；他们的产业[a]也不会在地上延展[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”所译的希伯来词十分罕见，意思不能确定；也可理解为“所有物”“收益”或“丰产”。原文这里表面上是“他们的”，与本节前面的单数“他”有所转换。
    reason: lexical_alternative
  - marker: b
    text: 末句也可能描绘枝条或出产因丰盛而低垂到地上的景象；另有人较笼统地理解为他的产业不能遍布地面。
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: 不会变得富足
  rationale: עשר 的 Qal 形式表示“变得富有、取得财富”，用“变得富足”保留其动态语义。
- source_word: יָקוּם
  choice: 不能长存
  rationale: קום 字面可指“站立、立住”；以“财富”为主语时，语境义是不能维持或确立，因此译为自然的“不能长存”。
- source_word: חֵילוֹ
  choice: 他的财富
  rationale: חַיִל 可指力量、资源或财富；本节谈恶人的富足不能持久，“财富”最切合上下文。
- source_word: יִטֶּה
  choice: 向地上伸展
  rationale: נטה 可表示伸展、倾斜或弯下。“伸展”既能容纳枝条或出产向下延伸的意象，也保留产业扩展于地的可能含义，避免把不确定的图像定死。
- source_word: מִנְלָם
  choice: 他们的产业
  rationale: 这是罕见且含义不确定的词，可能指产业、所有物、收益或出产；“产业”较宽泛，也与词尾表面的复数所属形式“他们的”相配。
theological_decisions:
- issue: 末句的农业意象与产业扩展之歧义
  choice: 译作“他们的产业也不会向地上伸展”
  alternative: “他的出产也不会低垂到地上”
  rationale: 希伯来语末句的名词罕见，动词也可指伸展、倾斜或弯下。正文采用较少限定的表达，并以脚注保留枝条或丰产低垂的解释，不据此引入特定神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“变得富足”“不能长存”清楚表达前两句；末句保留原文罕见词、代词数转换及图像上的不确定性，不把它过度解释为单一的农业或地产意象。
