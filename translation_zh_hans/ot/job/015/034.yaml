base_translation:
  language: en
  yaml_path: translation/ot/job/015/034.yaml
  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: zh_hans
  text: 因为不敬虔者的群体必荒凉[a]；贿赂的帐棚必被火吞噬[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不育”“不结果实”。此词也可含孤寂或荒凉之意。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“贿赂的帐棚”。这是简练的表达，可指以贿赂或不义之财为特征、或由此得来的住处；原文未明确是行贿者还是受贿者。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词承接上文，说明前述结局的缘由；译作“因为”自然保留因果关系。
- source_word: עֲדַת
  choice: ……的群体
  rationale: 指聚集的一群人或共同体；“群体”符合现代汉语，也避免“会众”可能带来的特定宗教组织色彩。
- source_word: חָנֵף
  choice: 不敬虔者
  rationale: 该词在《约伯记》中通常指对神不虔敬、邪恶的人，不仅指言行虚伪者；希伯来文单数在此可作集合意义理解。
- source_word: גַּלְמוּד
  choice: 不能生养
  rationale: 该形容词可指不生育、无果实或荒凉；此处用“不能生养”保留其生育意象及不得延续的含义，同时不把范围限于女性。
- source_word: וְאֵשׁ
  choice: 火
  rationale: 保留具体而有力的审判意象；汉语并不需要添加不定冠词。
- source_word: אָכְלָה
  choice: 必吞噬
  rationale: 完成式在智慧文学格言中可表达确定、普遍的结果；“必吞噬”既体现其确定性，也保留生动意象。
- source_word: אָהֳלֵי
  choice: ……的帐棚
  rationale: 直译为“帐棚”，保留古代近东生活场景和原文的具体意象。
- source_word: שֹׁחַד
  choice: 受贿者
  rationale: 原文直译为“贿赂的帐棚”，属简练的归属或特征表达；正文用“受贿者的帐棚”使现代读者容易理解，但以脚注保留字面形式及其歧义。
theological_decisions:
- issue: חָנֵף 的道德—宗教含义
  choice: 不敬虔者
  alternative: 虚伪者
  rationale: 《约伯记》中的用法通常比人际层面的虚伪更广，涉及对神的不虔敬；脚注保留“虚伪者”这一可能译法。
- issue: גַּלְמוּד 所表达的结局
  choice: 不能生养
  alternative: 荒凉／不结果实
  rationale: 不将其解释成特定教义性的惩罚，而保留原词可指不育、无果或孤寂荒凉的张力。
- issue: אָכְלָה 的时间与语气
  choice: 必吞噬
  alternative: 吞噬了／吞噬着
  rationale: 结合智慧格言语境，将完成式理解为确定的一般性结局，而非限定为某次过去事件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不敬虔者的群体”保留集合表达；“不能生养”传达 גַּלְמוּד 的生育与无果意象；第二分句稍作汉语化处理，并用脚注保存“贿赂的帐棚”的字面结构和施受关系上的歧义。
