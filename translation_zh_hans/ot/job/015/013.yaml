  text: that you turn your spirit against God and bring words out of your mouth?[a]
translation:
  language: zh_hans
  text: 你竟把你的心意[a]转向上帝，从口中吐出话来？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心意”直译为“灵”；这里指人的内在精神、心态或意向。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 竟使
  rationale: 承接上一节的疑问与责问，表达以利法所指控的结果或表现；汉语用“竟”自然传达责问语气，不机械译作“因为”。
- source_word: תָשִׁיב
  choice: 转向
  rationale: 使役词形在此表示使自己的内在倾向朝向某对象；“转向”保留方向性，并与介词 אֶל 呼应。
- source_word: אֶל אֵל
  choice: 向上帝
  rationale: אֶל 的直接意义是“向、朝着”。上下文可能含敌对意味，但正文保留原文方向表达，避免把“反对”直接写入译文。
- source_word: רוּחֶךָ
  choice: 你的心
  rationale: רוּחַ 在此指人的内在精神、心态或意向，并非自然界的风或生理呼吸；现代汉语以“心”表达内在倾向较自然，脚注保留“灵”的形式对应。
- source_word: וְהֹצֵאתָ
  choice: 口中吐出
  rationale: 该使役动词本义为“使出来、带出来”；配合“从你口中”和“话”，译为“吐出”既保留具体意象，也符合责问语境。
- source_word: מִפִּיךָ
  choice: 口中
  rationale: מִן 表示来源；汉语“口中吐出”已自然表达“从你的口中出来”。
- source_word: מִלִּין
  choice: 这样的话
  rationale: 该亚兰语色彩的复数名词意为“话、言语”。补出“这样”承接上下文所责备的言论，使汉语问句完整自然而不改变指称。
theological_decisions:
- issue: אֶל אֵל 是否应显明敌对含义
  choice: 正文译作“向上帝”
  alternative: “敌对上帝”或“攻击上帝”
  rationale: 介词本身通常表示“向、朝着”；敌对意味主要来自责问语境。保留较直接的方向义，可保存原文的含混与张力，不把语境推论提升为词义本身。
translation_notes:
  register: 采用现代、庄重而口语可懂的责问句式。“竟……？”承接第12节的疑问；“口中吐出”保留原文把言语描写为从口里带出的具体意象。正文不把 אֶל 强化为“反对”，以保存原文可能只是方向、也可能由语境暗示敌意的张力。
