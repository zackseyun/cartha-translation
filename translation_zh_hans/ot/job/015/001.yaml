- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在对话叙事公式中表示对前文发言作出回应；现代汉语用“回答”自然地保留其应答性质。
- source_word: אֱלִיפַז
  choice: 以利法
  rationale: 按现代中文圣经中通行的人名音译处理。
- source_word: הַתֵּימָנִי
  choice: 提幔人
  rationale: 该族属形容词源自“提幔”，在此标明以利法的地域身份；“提幔人”简洁而自然。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר是常见的发言动词；与“回答”合成“回答说”，既保留原文两个动词，也符合现代汉语叙事习惯。
- source_word: וַ
  choice: 由语序承载承接关系
  rationale: 句首连接词推动叙事向前；中文无需机械译作“然后”或“于是”，上下文与正常语序已能自然表达承接。
