  language: zh_hans
  text: 他不指望从黑暗中归回；刀剑正等候着他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他被刀剑窥伺”“他被指定归于刀剑”或“他注定遭刀剑。”这里的希伯来语动词含义难以确定；本句大概是在说暴力死亡或审判即将临到。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: 不相信自己能
  rationale: 这里的使役式表示对未来结果没有把握或指望；结合 שׁוּב，用“不相信自己能”自然表达其绝望的预期，同时保留“相信”的基本语义。
- source_word: שׁוּב מִנִּי חֹשֶׁךְ
  choice: 从黑暗中归回
  rationale: שׁוּב 表示返回、归回，מן 表示从某种境况中出来；“黑暗”在上下文中可指灾祸、幽暗或死亡威胁，不在正文中限定其隐喻所指。
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: 他正被利剑等候
  rationale: צפו 的词形和含义较难确定，可理解为与“守望、等候”有关的被动表达。“被利剑等候”保留原文不寻常的拟人化和被动色彩，也传达暴死迫近，而不直接改写为命定论式的“注定”。
- source_word: חָרֶב
  choice: 利剑
  rationale: 这里以剑代表暴力死亡或审判；“利剑”是自然、凝练且庄重的中文表达。
theological_decisions:
- issue: 末句是否明确表达“命定”
  choice: 译为“被利剑等候”
  alternative: “注定死于刀剑”或“为刀剑所定”
  rationale: 希伯来语动词本身困难，明确译作“注定”会加强预定或必然性的解释；正文保留“等候”的意象与语义张力，脚注说明其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归回”比“回来”更符合诗体语域；末句刻意保留希伯来语较突兀的拟人化表达，并以脚注交代主要译法。
