  yaml_path: translation/ot/job/015/017.yaml
  text: I will tell you; listen to me. What I have seen[a], I will recount—
translation:
  language: zh_hans
  text: 我要告诉你[a]；你要听我。我所看见的，我要述说——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要指给你看。”
    reason: 词汇替代：אֲחַוְךָ可表示“指示、展示”，但本节语境中正文的“告诉”较自然地表达其引出陈述的作用。
lexical_decisions:
- source_word: אֲחַוְךָ
  choice: 我要告诉你
  rationale: 此处是皮勒式，作用是引出以利法接下来的陈述。“告诉你”在现代汉语中自然，也符合言说语境，避免“指给你看”让人误以为有实际的视觉展示。
- source_word: שְׁמַע לִי
  choice: 你要听我
  rationale: 祈使式加介词表达专心听从说话者的要求。“你要听我”保留了直接呼吁的力度，且符合庄重、自然的现代汉语。
- source_word: וְזֶה
  choice: 我所……的
  rationale: 原文形式上是“而这”，在句中引出后面的内容。汉语用“我所看见的”将指示成分与关系结构合并，表达自然，同时保留其引介所述内容的功能。
- source_word: חָזִיתִי
  choice: 我所看见的
  rationale: 完成式表示以利法声称自己已有的亲身观察。“看见”保留经验性，不进一步解释为抽象的“领悟”。
- source_word: וַאֲסַפֵּרָה
  choice: 我要述说
  rationale: 该形式表达说话者陈述、讲述的意愿。“述说”适合将亲见之事陈明出来的语义，也保持庄重而易懂的语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“你要听我”体现祈使语气；分号保持两个意愿陈述之间的推进关系，句末破折号表明话语在下一节继续。未加脚注，因为原文可能的直译“我指给你看”在此语境中属于词汇层面的翻译选择，而正文“告诉你”已充分传达其言说功能。
