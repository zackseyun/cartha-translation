  yaml_path: translation/ot/job/015/010.yaml
  text: Both the gray-haired and the aged are among us[a], older in days than your father.
translation:
  language: zh_hans
  text: 我们中间既有白发老人，也有高龄老人；他们的年纪都比你父亲大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“在年日上比你父亲更大／更强”；意思是“比你父亲年长”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: 也有……和……
  rationale: 重复的 גַּם 将两类年长者并列强调；现代汉语用“也有……和……”既保留承接上文的“也”，又自然呈现配对结构。
- source_word: שָׂב
  choice: 白发人
  rationale: 该词指年老者，并带有白发这一具体形象；“白发人”保留原文的年龄标志，也与后面的“年高的人”有所区别。
- source_word: יָשִׁישׁ
  choice: 年高的人
  rationale: 该词表示高龄、年迈，与 שָׂב 意义相近而形成平行；“年高的人”自然庄重，并避免把两个词译成完全相同的表达。
- source_word: בָּנוּ
  choice: 我们中间有
  rationale: 介词 ב 加第一人称复数后缀在此表示处于说话者所属群体之中；“我们中间有”符合以利法诉诸群体长者智慧的语境。
- source_word: כַּבִּיר
  choice: 还多
  rationale: כַּבִּיר 通常有“大、强、多”之义；与比较介词 מִן 及“年日”连用时，表示年日超过某人。译作“还多”保留其以日数作比较的表达。
- source_word: מֵאָבִיךָ יָמִים
  choice: 年日比你父亲还多
  rationale: 原文以“日子/年日”为比较范围，并明确与“你父亲”相比；此译既保留希伯来语意象，也以自然汉语表达“比你父亲年长”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“白发人”和“年高的人”保留原文两个近义年龄称谓的平行关系；“年日比……还多”保留希伯来语以日数表示年龄的习惯。
