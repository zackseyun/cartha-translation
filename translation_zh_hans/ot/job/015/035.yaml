  text: הָרֹ֣ה עָ֭מָל וְ/יָ֣לֹד אָ֑וֶן וּ֝/בִטְנָ֗/ם תָּכִ֥ין מִרְמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: zh_hans
  text: 他们怀的是祸患，生的是罪孽[a]；他们的腹中孕育着诡诈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们怀着祸患，生下邪恶。”
    reason: 保留 הָרֹה 较直接的“怀着／怀孕”表达，以及 אָוֶן 可译为“邪恶”的词义选择。
lexical_decisions:
- source_word: הָרֹה
  choice: 怀的是
  rationale: 该词为 הרה 的主动分词，表示怀孕；此处用于比喻，并与“生的是”构成连贯的孕育、生育意象。
- source_word: עָמָל
  choice: 祸患
  rationale: 在智慧文学中常指祸患、苦难或害人的恶事；“祸患”既保留其造成痛苦的含义，也符合这里的道德语境。
- source_word: וְיָלֹד
  choice: 生的是
  rationale: ילד 表示生育、产下；采用自然的现代汉语表达，并明确保留原文的生育比喻。
- source_word: אָוֶן
  choice: 罪孽
  rationale: 该词可指罪恶、邪恶或祸患；在与“诡诈”平行的谴责语境中，“罪孽”较好体现其伦理意味。
- source_word: וּבִטְנָם
  choice: 他们的腹中
  rationale: בטן 可指腹部或子宫。原文虽延续妊娠意象，但现代汉语用“腹中”更自然，也不抹去其孕育含义；复数领属后缀译作“他们的”。
- source_word: תָּכִין
  choice: 孕育着
  rationale: כון 的使役形可表示预备、使成形或建立；结合腹中妊娠的比喻，“孕育着”自然传达内在形成、预备产出的意思。
- source_word: מִרְמָה
  choice: 诡诈
  rationale: 该词指欺骗、诡诈或背信；“诡诈”简洁庄重，并保留其道德色彩。
theological_decisions:
- issue: 隐含主语的数与表达方式
  choice: 他们怀的是……他们的腹中……
  alternative: 他怀的是……他的腹中……；人怀的是……腹中……
  rationale: 首词形式为阳性单数分词，但“他们的腹中”带第三人称阳性复数领属后缀，且上下文是在概括恶人这一类人。因此用复数“他们”保持全句自然连贯，同时保留群体性的泛指。
- issue: עָמָל 与 אָוֶן 的语义区分
  choice: 祸患……罪孽
  alternative: 苦难……邪恶；恶事……祸患
  rationale: 两个词的语义范围有重叠。译作“祸患……罪孽”既呈现前者所含的伤害、痛苦意味，也呈现后者在本语境中的伦理罪恶意味，而不把两者合并成同一词。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“怀的是……生的是……”保持希伯来文的平行与妊娠比喻；末句以“腹中孕育着”避免生硬的“子宫预备”，同时维持意象。
