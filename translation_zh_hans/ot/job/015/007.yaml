base_translation:
  language: en
  yaml_path: translation/ot/job/015/007.yaml
  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: zh_hans
  text: 难道你是头一个出生的人吗？难道你在山岭之前就已被生出吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  choice: 头一个出生的人
  rationale: 疑问词引出反问；רִאשׁוֹן表示时间或次序上的最先，אָדָם在此自然理解为“人”。这样的表达保留“第一个人”的含义，同时符合现代汉语语序。
- source_word: תִּוָּלֵד
  choice: 出生
  rationale: ילד的尼受动式通常表示“出生”；译为“出生”直接、自然。
- source_word: וְ/לִ/פְנֵי גְבָעוֹת
  choice: 在群山之前
  rationale: לִפְנֵי表示时间上的“在……之前”；גְבָעוֹת直指丘陵、小山，汉语诗体用“群山”较自然，并保留原文的远古地貌意象。
- source_word: חוֹלָלְתָּ
  choice: 被生下来
  rationale: 该动词在此带有生产、诞生的意象。译作“被生下来”既与前句的“出生”略有区别，也保留受生的含义。
theological_decisions:
- issue: אָדָם应理解为专名“亚当”还是普通名词“人”
  choice: 正文译作普通名词“人”
  alternative: 译作“亚当”，即“难道你就是最先的人亚当？”
  rationale: 本节反问以利法是否拥有太初的年岁与智慧。希伯来语措辞是“头一个人”，可能使人联想到亚当，却没有明确要求把אָדָם当作专名；正文保留普通名词，并在脚注交代可能的暗示。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。用两个“难道”重现并列的修辞性诘问；“群山”保持诗歌意象，“就已”突出早于山岭存在的荒诞意味。
