base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: zh_hans
  text: 看哪，他连自己的圣者[a]也不信任；诸天在他眼中也不纯净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的圣徒”。希伯来文直译为“他的圣者”；这里很可能指天上的圣洁存在。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的感叹词；“看哪”在庄重诗体中自然，也保留了原文的强调作用。
- source_word: בִּקְדֹשָׁיו
  choice: 自己的圣者
  rationale: 直译为“他的圣者”。“圣者”保留原词的宽泛性，不直接限定为天使或人间圣徒；“自己的”使所属关系在现代汉语中更清楚。
- source_word: לֹא יַאֲמִין
  choice: 也不信任
  rationale: 此处使役词形表达把信赖或信任放在某对象上；“不信任”简洁自然，避免“没有信仰”可能造成的误解。
- source_word: וְשָׁמַיִם
  choice: 诸天
  rationale: 原文为复数；“诸天”保留数的形式和诗歌语域，并与前半句的天上圣者形成平行。
- source_word: לֹא זַכּוּ
  choice: 也不纯净
  rationale: 此处指洁净、纯洁；“不纯净”适合宇宙性的诗歌意象，不误解为司法意义上的“无辜”。
- source_word: בְּעֵינָיו
  choice: 在他眼中
  rationale: 保留希伯来语“在他眼中”的形象，表达从他的判断或评价来看。
theological_decisions:
- issue: “他的圣者”所指为何
  choice: 正文保留“圣者”，脚注说明很可能指天上的圣者
  alternative: 直接译作“天使”或理解为人间圣徒
  rationale: 与下句“诸天”构成的诗歌平行表明，此处很可能指天上的圣洁存在；但原文并未明确使用“天使”一词，因此正文不作过度限定，以保留其词义范围和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“看哪”保留强调语气；分号呈现两行之间紧密的平行关系。
