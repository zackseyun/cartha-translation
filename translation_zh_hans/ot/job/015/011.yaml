base_translation:
  language: en
  yaml_path: translation/ot/job/015/011.yaml
  text: Are the consolations of God too small for you[a], or a word spoken gently to you?
translation:
  language: zh_hans
  text: 上帝的安慰和温和地对你说的一句话，对你来说太少了吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的安慰对你来说太少了吗？温和地对你说的一句话也是吗？”
    reason: 希伯来语以“和”连接“上帝的安慰”和“温和地对你说的一句话”，两项可共同受“太少了吗”支配；也可将第二项所省略的反问补出。
lexical_decisions:
- source_word: הַמְעַט
  choice: 太微不足道
  rationale: 疑问词 הַ 与 מְעַט 构成反问，意为“是否太少、太微小”。此处不只是数量少，也带有约伯轻看所受安慰之意；“太微不足道”在现代汉语中自然地表达这种不足与轻视。
- source_word: מִמְּךָ
  choice: 对你来说
  rationale: 这里的 מִן 表示相对于受话者而言，并非空间上的“从你”；译作“对你来说”符合汉语习惯。
- source_word: תַּנְחֻמוֹת
  choice: 安慰
  rationale: 该复数名词指安慰人的言语或行动。汉语“安慰”通常用作集合性名词，无须机械保留复数形式。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל 在此是指以色列的上帝，不是泛指“大能者”；“上帝”清楚而庄重。
- source_word: וְדָבָר
  choice: 那……的话
  rationale: דָבָר 在当前言谈语境中指所说的话。定冠意味并不明确，但汉语用“那……的话”可自然指向以利法等人对约伯所说的温和话语。וְ 按其基本并列功能处理，并以第二个问句和“也是如此”表达。
- source_word: לָאַט
  choice: 温和地
  rationale: 此词表示柔和、温和的方式；修饰隐含的说话动作，译为“温和地对你说”既贴近原意，也符合现代汉语表达。
- source_word: עִמָּךְ
  choice: 对你
  rationale: עִם 的基本义是“与……同在、同……”，但在说话语境中，汉语自然说“对你说”；这表达言语与约伯之间的关系，而不增添额外含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的反问句。正文将希伯来语第二分句的省略成分补为“也是如此吗”，保留其修辞力度；脚注呈现把两个并列项合为一个问题的句法可能。
