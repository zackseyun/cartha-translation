  text: מָֽה אֱנ֥וֹשׁ כִּֽי יִזְכֶּ֑ה וְ/כִֽי יִ֝צְדַּ֗ק יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: zh_hans
  text: 人算什么，竟能纯洁？妇人所生的，竟能算为义吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: 人算什么
  rationale: מָה与表示脆弱、必死之人的אֱנוֹשׁ构成反问；“人算什么”自然保留其代表全人类的单数用法，也传达人的卑微有限。
- source_word: כִּי יִזְכֶּה
  choice: 竟能纯洁
  rationale: יִזְכֶּה为זכה的Qal未完成式，表示洁净、纯洁或无污；语境侧重人在道德与属灵意义上的纯洁。“竟能”体现反问语气，而不把可能性绝对化为明确的教义命题。
- source_word: וְכִי
  choice: （第二问并列）竟
  rationale: וְ连接两个平行的反问分句。汉语以第二个“竟”承接并列，较直译“和/或”更自然，同时保留诗体平行。
- source_word: יִצְדַּק
  choice: 算为义
  rationale: צדק的Qal在此可指成为义、被判定为义或显为有理。“算为义”保留其关系性和评判色彩，避免仅限定为内在品德，也不使用带有更强后期术语色彩的“称义”。
- source_word: יְלוּד אִשָּׁה
  choice: 妇人所生的
  rationale: 直译并保留希伯来语“妇人所生者”的习语，指处于有限、必死境况中的人；在现代汉语中简洁而庄重。
theological_decisions:
- issue: אֱנוֹשׁ与יְלוּד אִשָּׁה所指的人类范围
  choice: 用单数集合性的“人”和“妇人所生的”，泛指人类
  alternative: 译作“人类”或“凡妇人所生的人”
  rationale: 原文采用阳性单数但具有普遍代表性。中文“人”本身可自然泛指全人类，无须加入仅指男性的含义。
- issue: יִצְדַּק的道德与法庭性含义
  choice: 算为义
  alternative: 成为义人；称义；算为有理
  rationale: 该词既可表达正直状态，也可含在评判中站立得住的意味。“算为义”保留两者之间的张力；“称义”容易引入技术化的后期神学术语，“成为义人”则偏重内在道德状态。
- issue: 反问是否表述为绝对的人论断言
  choice: 保留以利法话语中的反问形式
  alternative: 改写为“人不可能纯洁，也不可能为义”
  rationale: 本节是人物发言，原文借反问提出主张。直陈式会强化为无条件的叙述者断言，并消除诗歌和对话语境中的张力。
translation_notes:
  register: 采用现代、庄重且易懂的诗体汉语。两个“竟能”形成平行节奏；“妇人所生的”保留约伯记惯用的人类脆弱意象。无需脚注，因正文已在不增加解释性内容的情况下保留主要词义张力。
