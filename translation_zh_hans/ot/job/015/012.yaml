  text: Why does your heart carry you away[a], and why do your eyes flash?
translation:
  language: zh_hans
  text: 你的心为何把你带走？你的眼睛又为何闪动[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“眨眼”、“使眼色”，也可能是“转动”；这个希伯来语动词很少见，确切含义不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: 为何
  rationale: 该疑问词本义为“什么”，但在这里用于追问原因或动机；译作“为何”符合现代汉语的反问语气。
- source_word: יִקָּחֲךָ
  choice: 把你带走
  rationale: 源自动词 לקח（拿、带走）；此处以“你的心”为主语，保留希伯来语中内心把人带走的拟人化意象，不额外解释为某种具体情绪。
- source_word: לִבֶּךָ
  choice: 你的心
  rationale: “心”可指人的思想、意志和情感；直译在汉语中自然，也保留原文意象。
- source_word: וּמַה
  choice: 为何
  rationale: 与前句形成平行反问；连词的承接关系由相邻句式自然表达，无须机械译出“而且”。
- source_word: יִרְזְמוּן
  choice: 闪动
  rationale: 这是罕见且含义不确定的动词，可能指眼睛闪动、眨动、使眼色或转动。正文采用较宽泛的“闪动”，并以脚注保留其他可能。
- source_word: עֵינֶיךָ
  choice: 你的眼睛
  rationale: 直译自然，并保留原文以身体表情刻画约伯状态的意象。
theological_decisions:
- issue: 是否把心“带走”具体解释为骄傲、愤怒或受迷惑
  choice: 保留“你的心把你带走”的开放意象
  alternative: 你的心为何使你狂妄／冲动／迷失
  rationale: 原文没有明说具体心理或道德状态；不将以利法的责问解释成某一特定教义判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两句平行反问保留原文节奏；“把你带走”刻意保留拟人化张力，“闪动”则避免在罕见动词的语义上作过度确定的判断。
