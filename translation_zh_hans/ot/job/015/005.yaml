base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: zh_hans
  text: '因为你的罪孽教你的口说话[a]；

    你选择狡猾人的言辞[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”或译“罪责”；希伯来语 עָוֹן 可指罪孽、罪责，或罪责所招致的惩罚。
    reason: lexical_alternative
  - marker: b
    text: 直译“狡猾人的舌头”；也可译“诡诈人的言语”或“精明人的言语”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为以利法的指控提出理由；现代汉语中“因为”最自然地体现这一论证关系。
- source_word: יְאַלֵּף
  choice: 教唆
  rationale: 该词在此有“教导、训练”之意；因主语是“罪孽”，用带负面色彩的“教唆”既保留拟人手法，也符合指控语境。
- source_word: עֲוֺנְךָ
  choice: 你的罪孽
  rationale: עָוֹן可指罪孽、罪责或罪罚；此处被拟人化为影响言语的道德恶，故译“罪孽”，同时以脚注保留“罪责”的可能。
- source_word: פִיךָ
  choice: 你的口
  rationale: 直译并保留希伯来诗歌以发声器官指代言语的意象，与下一行“舌头”形成平行。
- source_word: וְתִבְחַר
  choice: 你又选择
  rationale: 保留בחר的主动选择含义和第二人称直接指控；“又”自然连接两个并列罪状。
- source_word: לְשׁוֹן
  choice: 舌头
  rationale: 保留原文具体意象，并与“口”构成诗体平行；此处按汉语习惯表达为“诡诈之人的舌头”。
- source_word: עֲרוּמִים
  choice: 诡诈之人
  rationale: עָרוּם可表示精明、机敏，也可表示狡猾；在以利法的负面指控中，“诡诈”最能传达以巧言操弄的意味。
theological_decisions:
- issue: עָוֹן在指控中的道德与法律含义
  choice: 你的罪孽
  alternative: 你的罪责
  rationale: 上下文指以利法认定约伯内在的道德败坏支配其言语，因此正文采用“罪孽”；但原词也可能侧重罪责，故在脚注中保留。
- issue: עֲרוּמִים的褒贬张力
  choice: 诡诈之人
  alternative: 精明的人／狡猾的人
  rationale: 该词本身可有正面的“精明”或负面的“狡猾”含义；此处说话者显然在谴责约伯采用欺骗性的言辞，所以正文采用负面译法，同时注明词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“口／舌头”的诗歌平行意象；“教唆”使罪孽拟人化，并自然传达上下文的负面语气。
