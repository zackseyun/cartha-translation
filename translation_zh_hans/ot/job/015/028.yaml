  yaml_path: translation/ot/job/015/028.yaml
  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: zh_hans
  text: 他住在被毁的城邑和无人居住、将成为瓦砾堆的房屋里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他住在被毁的城邑中，住在他们不居住的房屋里；这些房屋是预备成为瓦砾堆的。”本节希伯来语十分紧凑，尤其中间一句的代词所指和句法关系可有几种意思相近的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: 他住在
  rationale: שׁכן表示“居住、定居”。希伯来语叙事形式在这里延续对恶人的描述；汉语用“住在”自然简洁，又不额外限定居住持续至今。
- source_word: עָרִים נִכְחָדוֹת
  choice: 毁坏的城邑
  rationale: נכחדות是כחד的被动分词，指遭毁灭、被除去而荒废的地方。“毁坏的城邑”既保留被动结果，也与下文无人居住和成为废墟相呼应。
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: 无人居住……的房屋
  rationale: 原文紧凑，לָמוֹ所指及句法关系不完全明确。译作“无人居住”传达房屋荒废的核心意思，同时避免在正文中强行确定代词所指。
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: 注定成为
  rationale: עתד的Hitpael形式可表示被预备、被指定或注定处于某种状态；“注定成为”自然表达其趋向某一结局的含义。
- source_word: לְגַלִּים
  choice: 废墟
  rationale: גַּלִּים字面指堆、石堆，在此语境中指建筑倒塌形成的瓦砾堆或废墟。“废墟”是现代汉语中自然且符合上下文的表达。
