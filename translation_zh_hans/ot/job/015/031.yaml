  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: zh_hans
  text: 他不可倚靠虚妄而受迷惑；因为他的报偿必是虚妄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚妄”也可译作“空虚”“虚假”或“无价值之物”。原文前后两次使用同一个词。“受迷惑”也可理解为“迷失”或“被引入歧途”；也有人理解为“自欺”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: 不要让他信靠
  rationale: אַל与未完成式在这里表达劝阻或警告；“信靠”准确传达אמן使役式中把信心寄托于某物的含义。
- source_word: בַשָּׁוְא / שָׁוְא
  choice: 虚妄
  rationale: שָׁוְא可指空虚、虚妄、虚假或无价值之物；“虚妄”兼具空洞与不实之意，并在前后两处采用同一译词，保留原文的重复和诗意反讽。
- source_word: נִתְעָה
  choice: 自欺迷失
  rationale: תעה的尼פעל式可表示迷失、受迷惑或被引入歧途。此处形式容许被动或状态性的理解；“自欺迷失”在自然中文中衔接上下文，同时保留迷惑与迷失的语义张力。
- source_word: כִּי
  choice: 因为
  rationale: 引出不可信靠虚妄的理由。
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: 他所得的回报也必是
  rationale: תְּמוּרָה本义涉及交换、替代或换回所得；“所得的回报”清楚表达他最终换得的结果，而“必是”传达这里的将来结果。
