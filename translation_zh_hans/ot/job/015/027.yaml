  text: because he has covered his face with his fat[a], and has put fatness on his loins.
translation:
  language: zh_hans
  text: 因为他脸上蒙着脂油，腰间堆起肥肉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “腰间堆起肥肉”或译：“胁腹堆起层层脂肪。”
    reason: פִּימָה含义罕见，可指肥厚或脂肪褶皱；כֶּסֶל也可指胁腹。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明恶人刚硬行径背后的情形；保留原文的因果或解释意味。
- source_word: כִסָּה פָנָיו
  choice: 他脸上蒙着
  rationale: כסה意为“遮盖、蒙住”；采用自然的现代汉语表达，同时保留具体的身体意象。
- source_word: בְּחֶלְבּוֹ
  choice: 脂油
  rationale: חֵלֶב本义为脂肪、油脂；“脂油”保留诗句中夸张而具体的肥胖意象，并可暗示安逸富足，却不把暗示直接写入正文。
- source_word: וַיַּעַשׂ פִּימָה
  choice: 也积起肥肉
  rationale: פִּימָה是罕见名词，可能指肥厚、脂肪或脂肪褶皱；结合עשה，以“积起肥肉”自然表达身体变得肥厚的结果，避免生硬直译为“制造肥厚”。
- source_word: עֲלֵי כָסֶל
  choice: 腰间
  rationale: כֶּסֶל可指腰部、胁腹或两肋；“腰间”在现代汉语中自然，并保留一定的解剖范围弹性。
