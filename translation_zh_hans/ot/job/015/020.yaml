  text: כָּל יְמֵ֣י רָ֭שָׁע ה֣וּא מִתְחוֹלֵ֑ל וּ/מִסְפַּ֥ר שָׁ֝נִ֗ים נִצְפְּנ֥וּ לֶ/עָרִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: zh_hans
  text: '恶人一生都在痛苦中挣扎[a][b]；

    为残暴之人存留着若干年岁[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战栗”或“扭动”；原文动词可表示扭动、战栗，或如生产般的痛苦。
    reason: lexical_alternative
  - marker: b
    text: “恶人”在原文中是阳性单数，在这里代表这一类人。
    reason: cultural_note
  - marker: c
    text: “存留着”也可译作“隐藏着”或“保留着”；本句没有明说这些年岁具体指什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: 一生都
  rationale: 这是表示时间总量的结构；“一生都”在现代汉语中自然、凝练，并保留“所有日子”的整体含义。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词为单数、实词化的形容词，指一个具有代表性的恶人；汉语“恶人”既可指单个典型人物，也符合智慧文学的概括性表达。
- source_word: הוּא
  choice: 不另行译出
  rationale: 独立代词在希伯来语中承接并略加强主语；汉语若直译为“他”会显得重复，因此由“恶人”直接作主语更自然。
- source_word: מִתְחוֹלֵל
  choice: 辗转不安
  rationale: 该词可表达扭动、战栗或如生产般的痛苦，且分词形式含持续意味；“辗转不安”保留身心煎熬的动态感，又不额外加入“受刑”等未明说的原因。
- source_word: וּמִסְפַּר שָׁנִים
  choice: 若干年岁
  rationale: 该短语表示有数但未具体说明的年岁；“若干年岁”避免擅自解释为明确的寿数上限。
- source_word: נִצְפְּנוּ
  choice: 存留着
  rationale: צפן的被动形可指被隐藏、储藏或保留；“存留着”保留储备或预留的意象，同时以脚注呈现“隐藏”的可能。
- source_word: לֶעָרִיץ
  choice: 为强暴者
  rationale: עָרִיץ指凶暴、残酷、压迫他人的人；“强暴者”比“暴君”更宽泛，不把语境限定为政治统治者。
theological_decisions:
- issue: 为强暴者存留的“若干年岁”究竟指寿命有限，还是苦难或刑罚被保留
  choice: 正文仅译为“为强暴者存留着若干年岁”
  alternative: “强暴者的年岁已有定数”或“多年苦难为强暴者存留”
  rationale: 原文没有明说所存留的是寿命、苦难还是刑罚。正文保留这种语义张力，不把以利法的论断扩展成更明确的神学结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“辗转不安”传达持续的痛苦动态；第二分句有意保持原文略显含混的表达，不补出“刑罚”“寿命有限”等解释。
