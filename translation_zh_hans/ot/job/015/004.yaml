  text: אַף אַ֭תָּה תָּפֵ֣ר יִרְאָ֑ה וְ/תִגְרַ֥ע שִׂ֝יחָ֗ה לִ/פְנֵי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/004.yaml
  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: zh_hans
  text: 你竟废掉对上帝的敬畏[a][b]，也削弱在上帝面前的默想[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “废掉”也可译作“破坏”或“使……失效”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“敬畏”；按上下文，很可能指对上帝的敬畏。
    reason: lexical_alternative
  - marker: c
    text: “默想”也可译作“祷告”、“虔敬的倾诉”或“申诉”；这个希伯来词可指沉思或带有祷告性质的言说。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 竟
  rationale: 这里是加强责备语气的强调小品词；“竟”在现代汉语中自然地表达以利法指控中的惊诧和责难，而不是简单的并列。
- source_word: אַתָּה
  choice: 你
  rationale: 第二人称阳性单数代词在原文中明说，具有强调作用；汉语保留“你”，并由“竟”共同传达强调。
- source_word: תָּפֵר
  choice: 废掉
  rationale: 这是פרר的使役形，含有破坏、废除、使失效之意。“废掉”保留其强烈的使役含义，也适合本节尖锐的指控语气。
- source_word: יִרְאָה
  choice: 对上帝的敬畏
  rationale: 原词本身是“惧怕、敬畏”，未明说对象；结合下半句“在上帝面前”，这里很可能指向对上帝的敬畏。正文作适度明示，同时以脚注保留原文较简略的表达。
- source_word: וְתִגְרַע
  choice: 也削弱了
  rationale: גרע的基本语义包括减少、削减、扣除。此处“削弱”能自然表达使某种宗教实践减少或失去力量，并与上半句构成平行。
- source_word: שִׂיחָה
  choice: 默想
  rationale: 该词可指沉思、低声倾诉、祷告或诉说。“默想”保留其反思性和宗教语境，同时不把含义过早限定为祷告或申诉。
- source_word: לִפְנֵי אֵל
  choice: 在上帝面前
  rationale: לִפְנֵי表示“在……面前、在……临在中”，אֵל在此是对上帝的称呼；该译法准确且符合现代汉语宗教语体。
theological_decisions:
- issue: יִרְאָה是否明确为对上帝的敬畏
  choice: 正文译作“对上帝的敬畏”
  alternative: 仅译“敬畏”或译“惧怕”
  rationale: 下半句明确提到“在上帝面前”，平行结构表明这里谈的是敬虔生活中的敬畏，而非泛指恐惧；脚注说明希伯来文只明说“敬畏”，以免掩盖其形式上的含蓄。
- issue: שִׂיחָה在上帝面前所指为何
  choice: 默想
  alternative: 祷告、虔敬、倾诉或申诉
  rationale: 原词语义宽广，可以涵盖反思性言说、祷告或倾诉。“默想”在正文中较能维持这种开放性，脚注列出其他可能，避免把约伯在上帝面前的言说单一化。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“竟”传达原句开头的强调和责备；两分句以“也”衔接，保持希伯来诗句的平行结构。正文适度明示“对上帝”，但用脚注保留原文只写“敬畏”的形式及“默想”一词的真实语义幅度。
