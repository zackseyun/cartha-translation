  yaml_path: translation/ot/job/015/006.yaml
  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: zh_hans
  text: 定你有罪的是你自己的口，不是我；你自己的嘴唇作证指控你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作证指控你”也可译作“作出不利于你的回答”。希伯来语动词更直译为“回答”或“应答”，但这里很可能带有作证、提出不利证词的司法意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: 定你有罪
  rationale: רשע 的使役式在此具有司法语义，指判定或宣告某人有罪；“定你有罪”既贴近原文，也自然承接以利法的指控。
- source_word: פִיךָ
  choice: 你自己的口
  rationale: 原文直译为“你的口”；加入“自己”突显上下文中的反身对比，即约伯被自己的话定罪，而非被以利法定罪。
- source_word: וְלֹא אָנִי
  choice: 不是我
  rationale: 保留原文简洁而有力的对比；汉语无需机械译出连词，也能清楚表达“而不是我”。
- source_word: וּשְׂפָתֶיךָ
  choice: 你自己的嘴唇
  rationale: 原文为“你的嘴唇”；“自己”与上半句形成自然平行，并强调自我指证。
- source_word: יַעֲנוּ
  choice: 作证
  rationale: ענה 基本义可为“回答”，但在此司法性语境中可表达出面回应、作证的意思；“作证”保留拟人化，并准确传达话语成为证词的意象。
- source_word: בָךְ
  choice: 指控你
  rationale: 介词 ב 与此处具有司法色彩的动词结合，语境上表示证词对当事人不利；译为“指控你”自然体现“against you”的含义。
