  text: Should a wise man answer with windy knowledge[a], and fill his belly with the east wind?
translation:
  language: zh_hans
  text: 智慧人岂该以空洞的知识作答，又使自己的肚腹充满东风吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָכָם
  choice: 智慧人
  rationale: 疑问词与“智慧人”连用，引出带有责备意味的反问；单数在此具有泛指意义。
- source_word: יַעֲנֶה
  choice: 岂该……回答
  rationale: 未完成式置于反问中，可表达是否合宜或应当；“岂该”体现责备语气。
- source_word: דַעַת רוּחַ
  choice: 虚空的知识
  rationale: 该结构可直译为“风的知识”；此处“风”比喻空洞、无实质。“虚空的知识”传达语境含义，脚注保留原有意象及结构上的可能译法。
- source_word: וִימַלֵּא
  choice: 让……装满
  rationale: 承接前面的反问，并保留“充满”的具体形象；按汉语习惯用“让肚腹装满”。
- source_word: קָדִים
  choice: 东风
  rationale: 直译为“东风”，在当地语境中常有强烈、灼热或具破坏性的联想，但正文不额外添加这些含义。
- source_word: בִּטְנוֹ
  choice: 肚腹
  rationale: 保留原文鲜明的身体意象，同时比“肚子”更符合庄重的经文语体。
