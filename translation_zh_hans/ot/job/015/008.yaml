base_translation:
  language: en
  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: zh_hans
  text: 难道你曾听过上帝的密议[a]，又把智慧据为己有吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “密议”也可译作“秘密的谋议”“议事圈子”或“秘密”。希伯来词可指机密的商议、亲密的圈子，或其中所议的秘密。
    reason: 保留סוֹד兼有议事场合、亲密圈子和秘密内容的词义幅度，并避免“议会”在现代汉语中常有的政治机构联想。
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: 在……的密议中
  rationale: סוֹד可指亲密圈子中的机密商议或议事场合。译作“密议”既保留秘密性，也传达参与上帝内部商议的语境。
- source_word: אֱלוֹהַ
  choice: 上帝
  rationale: אֱלוֹהַ在《约伯记》中常用作对独一真神的称呼；“上帝”是现代普通话中自然、庄重的对应词。
- source_word: תִּשְׁמָע
  choice: 曾……聆听
  rationale: שׁמע可表示“听见”或“听取”。这里是反问约伯是否曾获准听取上帝的密议，“聆听”体现有意听取，并保持庄重语体。
- source_word: וְ/תִגְרַע
  choice: 又……据为己有
  rationale: גרע本义涉及减少、扣留或限制；与“智慧”和“归向你自己”的结构连用时，语意是把智慧限定为自己独有。“据为己有”以自然中文表达这种排他性的占有。
- source_word: אֵלֶיךָ
  choice: 为己
  rationale: 介词אֶל加第二人称单数后缀表示朝向或归于“你”；在中文成语“据为己有”中自然体现“归给你自己”的意思。
- source_word: חָכְמָה
  choice: 智慧
  rationale: חָכְמָה通常指智慧、见识；“智慧”准确且无需技术化解释。
theological_decisions:
- issue: 约伯记语境中上帝的סוֹד所指为何
  choice: 译作“上帝的密议”，暗示上帝隐秘的商议及约伯不可能拥有的特权性接近。
  alternative: 可理解为“上帝的议会”“上帝的秘密”或“上帝的谋议”。
  rationale: 以利法用反问讥讽约伯仿佛亲自听取过上帝内部的商议。“密议”兼顾议事场景与保密、亲近的含义，又不把它确定为某一种完整的天上议会制度。
translation_notes:
  register: 采用现代、庄重而易懂的反问句。“难道……又……吗”保持两分句的连贯修辞；“据为己有”比直译“把智慧限制于自己”更符合现代汉语，同时保留以利法指责约伯独占智慧的语气。
