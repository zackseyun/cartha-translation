base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: zh_hans
  text: 他为了寻找食物[a]四处游荡：“在哪里呢？”他知道，黑暗之日已经预备好，近在他身边。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”原文直译为“饼”；“饼”也可泛指食物。
    reason: lexical_alternative
  - marker: b
    text: “近在他身边”原文直译为“在他手中”；这里可能表示黑暗之日已经临近他。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: 四处漂泊
  rationale: 该词为נדד的Qal主动分词，表示持续而无定所地游荡、漂流；“四处漂泊”既保留进行中的不安状态，也不额外解释为流亡。
- source_word: לַלֶּחֶם
  choice: 为觅食
  rationale: לֶחֶם字面是“饼、粮食”，也常转指食物。上下文强调为获得维生之物而漂泊，正文采用自然的“觅食”，脚注保留字面意象。
- source_word: אַיֵּה
  choice: 在哪里呢？
  rationale: 该疑问词意为“在哪里”。所寻找的对象由前文的食物补足；独立疑问保留希伯来文简短、急切的语气。
- source_word: יָדַע
  choice: 他知道
  rationale: ידע的完成式在此表达确定的认知；直译为“他知道”最为稳妥。
- source_word: נָכוֹן
  choice: 已经预备好
  rationale: 该词可表示被备妥、确定或设立。这里与即将临到的“黑暗之日”相连，“已经预备好”保留其被动或状态性的意味。
- source_word: בְּיָדוֹ
  choice: 就在他手边
  rationale: 字面为“在他手中／手边”。“就在他手边”在中文中可表达迫近，同时保留原文身体意象，不把它明确化为某种特定审判。
- source_word: יוֹם חֹשֶׁךְ
  choice: 黑暗之日
  rationale: 这是“日子”与“黑暗”构成的短语，指以黑暗为特征的日子。“黑暗之日”保留诗性意象，不直接改写为灾祸、毁灭或审判之日。
theological_decisions:
- issue: “黑暗之日”的隐喻所指
  choice: 保留“黑暗之日”的意象，不在正文中明说是灾祸或神的审判
  alternative: 灾祸之日／毁灭之日／审判之日
  rationale: 以利法的论述语境指向恶人将遭遇的祸患，但原文仍以“黑暗”这一诗性意象表达。保留该意象可避免把语境推论提升为原句明说的教义判断。
- issue: “在哪里呢？”是否作为直接引语
  choice: 用冒号和引号呈现为漂泊者发出的疑问
  alternative: 不作引语，译为“他四处漂泊寻找不知在何处的食物”
  rationale: 原文没有“说”这一动词，只在“为食物”后接疑问词“在哪里”。直接疑问最能保留突兀、急切的句法；正文不增添“他说”，以免过度补足。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半句保持简短急促，以体现寻食无着的窘迫；后半句保留“黑暗之日”和“手边”的希伯来诗歌意象。所有脚注标记均已置于正文对应位置。
