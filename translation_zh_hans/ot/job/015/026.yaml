  text: 他挺着颈项[a]向他冲去，带着他盾牌上厚实的隆起部位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他伸着颈项向他冲去，带着他盾牌上厚实的隆起部位。”希伯来文的画面鲜明，却十分凝练。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרוּץ
  choice: 冲去
  rationale: רוץ本义为“奔跑”；此处语境带有敌对进攻意味，“冲去”既表现迅猛向前，也不过度加入明确的军事术语。
- source_word: אֵלָיו
  choice: 向他
  rationale: 介词 אֶל 表示趋向；在敌对语境中自然含有冲着对方进攻之意。“向他”保留基本方向义，让上下文呈现其敌意。
- source_word: בְּצַוָּאר
  choice: 挺着颈项
  rationale: 希伯来文直译为“以颈项/带着颈项”，意象凝练，可能描绘伸颈直冲或傲然抗拒。“挺着颈项”在现代汉语中较自然，同时保留身体姿态及其可能的挑衅意味。
- source_word: בַּעֲבִי
  choice: 厚实的
  rationale: עֳבִי 指厚度或厚重；“厚实的”可自然修饰盾牌的凸面，并传达其坚厚感。
- source_word: גַּבֵּי
  choice: 凸面
  rationale: גַּבֵּי 字面与“背部、隆起面”有关；用于盾牌时可指其隆起部分或盾脐。“凸面”既形象又便于普通读者理解，同时避免把有争议的具体构件限定为“盾脐”。
- source_word: מָגִנָּיו
  choice: 盾牌
  rationale: 原文为复数并带第三人称阳性单数所属后缀，即“他的盾牌（复数）”。汉语名词通常不显式标复数；句中仍以“盾牌”自然表达，不强加量词。
