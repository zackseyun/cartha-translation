base_translation:
  language: en
  yaml_path: translation/ot/job/015/016.yaml
  text: how much less a man who is detestable and corrupt[b][a], who drinks injustice like water!
translation:
  language: zh_hans
  text: 更何况那可憎、污秽[a]的人，饮不义[b]如饮水！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “污秽”或译“败坏”；希伯来语此词罕见，可指受污染、污浊或腐败。
    reason: lexical_alternative
  - marker: b
    text: “不义”或译“不公”“恶行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: 更何况
  rationale: 承接上一节构成由重到轻的递进论证：连属天者尚且不纯洁，更何况人；“更何况”自然表达这一逻辑。
- source_word: נִתְעָב
  choice: 可憎
  rationale: 保留尼法勒分词所表达的令人厌恶、可憎恶之意，语气强烈而庄重。
- source_word: נֶאֱלָח
  choice: 污秽
  rationale: 此罕见词表示受污染、污浊或败坏；“污秽”兼顾其污染意象与道德含义，同时以脚注说明另一可能译法。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来语为阳性单数，语境中泛指代表性的人；现代汉语“人”自然保留单数泛称，无须添加性别。
- source_word: שֹׁתֶה
  choice: 他喝下
  rationale: 以关系分句式承接“人”，并用“喝下”表达分词所描绘的惯常行为和主动吞饮的形象。
- source_word: כַמַּיִם
  choice: 如同喝水
  rationale: 补出汉语比喻中自然需要的动词，使人像饮水一样轻易、惯常地行恶的意象清楚可感。
- source_word: עַוְלָה
  choice: 不义
  rationale: 该词涵盖不公、邪恶和不正当行为；“不义”简洁庄重，保留广泛的道德含义，脚注列出自然替代译法。
theological_decisions:
- issue: אִישׁ的代表性阳性表达
  choice: 人
  alternative: 男人；世人
  rationale: 原文虽为阳性单数，但在格言式陈述中代表一般的人。“人”在现代汉语中既保留单数泛称，也不把经文不必要地限定为成年男性。
- issue: עַוְלָה的道德含义
  choice: 不义
  alternative: 不公；恶行；罪孽
  rationale: “不义”保留原词兼具不正、不公与作恶的宽广语义，不将其缩窄为社会层面的不公，也不额外引入特定神学术语。
- issue: נֶאֱלָח的污染与败坏意象
  choice: 污秽
  alternative: 败坏
  rationale: 罕见词的具体侧重点并不完全确定；正文采用能保留污染、污浊意象的“污秽”，并在脚注承认“败坏”的道德性译法，以免消除词义张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“更何况”显明与上一节的递进关系；“他喝下不义如同喝水”保留原文强烈而具体的比喻。脚注标记按正文出现顺序排列。
