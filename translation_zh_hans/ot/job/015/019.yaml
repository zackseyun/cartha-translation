  yaml_path: translation/ot/job/015/019.yaml
  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: zh_hans
  text: 那地只赐给了他们[a]；没有外人从他们中间经过[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那地”也可译作“大地”。希伯来语 אֶרֶץ 可指“地”或“大地”；此处因涉及一个群体独得的地域，正文采用“那地”。
    reason: lexical_alternative
  - marker: b
    text: “没有外人从他们中间经过”也可译作“没有外族人穿行在他们当中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: 惟独他们
  rationale: לָהֶם与לְבַדָּם合起来强调排他性，即土地只赐给他们；“惟独他们”简洁、庄重，并在现代汉语中自然。
- source_word: נִתְּנָה
  choice: 得了
  rationale: 该词是נתן的被动式，直译为“被赐予”。汉语用“他们得了”更自然，仍保留土地是授予所得而非自行夺取的含义。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: אֶרֶץ既可指“地/土地”，也可指“全地/大地”。此处谈到某群体独得并且外人未进入的地域，译作“那地”较切合上下文，同时以脚注保留另一可能。
- source_word: זָר
  choice: 外人
  rationale: זָר指不属于该群体的人，可译为陌生人、外族人或外来者。“外人”不额外限定国籍或族裔，并能表达群体边界。
- source_word: עָבַר בְּתוֹכָם
  choice: 从他们中间经过
  rationale: עָבַר表示经过、穿过，בְּתוֹכָם意为在他们中间；合译既保留移动含义，也自然表达其群体内部未受外人介入。
