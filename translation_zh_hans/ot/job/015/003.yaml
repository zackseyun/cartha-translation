  yaml_path: translation/ot/job/015/003.yaml
  text: Should he argue with useless words[a], or with speech that does no good?
translation:
  language: zh_hans
  text: 他岂可用无益的话争辩，用不能带来益处的言语辩论吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹכֵחַ
  choice: 争辩
  rationale: יכח的使役式分词在此可指争论、论理或责备。上下文是以利法批评约伯的言论，因此“争辩”最自然，也不把法律审讯的意味强调过度。
- source_word: בְּדָבָר לֹא יִסְכּוֹן
  choice: 用无益的话
  rationale: דָבָר在这里与下半句的מִלִּים平行，指言语；סכן表达有用、有益。“无益的话”简洁保留其否定意义。
- source_word: וּמִלִּים
  choice: 用……言语
  rationale: מִלִּים意为“话、言语”。译作“言语”既保留同义平行，又避免中文机械重复。连接词按希伯来文保留为并列结构，不额外译成互斥的“或”。
- source_word: לֹא יוֹעִיל בָּם
  choice: 毫无益处
  rationale: יועיל表示带来益处、帮助；בם可理解为“借着这些话”。“毫无益处”在中文中自然表达这些言语不能产生任何有益结果。
