  text: '就是智慧人所传讲的；

    他们没有向祖先隐瞒——'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 就是……的
  rationale: 承接上一节，引出所听见并要述说的内容；汉语用“就是”自然连接上下文。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 指传承古老智慧的人；“智慧人”具体、庄重，也保留原文复数所指的群体意味。
- source_word: יַגִּידוּ
  choice: 传讲
  rationale: נגד 的使役式表示告知、宣明；“传讲”既体现公开述说，也契合智慧传统代代传递的语境。
- source_word: וְלֹא כִחֲדוּ
  choice: 没有隐瞒
  rationale: כחד 在此最自然地表示隐藏、隐瞒；译文不把宾语明说，以保留原文的简练。
- source_word: מֵאֲבוֹתָם
  choice: 从祖先那里
  rationale: מִן 可表示来源，而“父辈”在此可泛指先人；“从祖先那里”自然表达传统的来源，同时不过度限定具体世代。
theological_decisions:
- issue: מֵאֲבוֹתָם 与 כִחֲדוּ 的句法关系
  choice: 是他们从祖先那里没有隐瞒的
  alternative: 是他们的祖先没有隐瞒的；他们没有隐瞒从祖先所领受的；他们没有向祖先隐瞒的
  rationale: 希伯来文结构紧凑，介词短语既可能表示所传内容的来源，也可能与“隐瞒”构成其他关系。正文尽量贴近词序并保留这种含混，脚注列出主要理解，避免擅自消解文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“传讲”体现智慧传统的公开传递；正文保留原文句法含混，并以破折号承接下一节。
