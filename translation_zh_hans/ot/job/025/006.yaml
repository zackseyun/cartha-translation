  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
translation:
  language: zh_hans
  text: 何况人[a]不过是蛆，世人[b]不过是虫呢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”所译的希伯来语常着重人的软弱和必死性；也可译作“凡人”。
    reason: lexical_alternative
  - marker: b
    text: “世人”原文直译为“人之子”，在这里是指一个人，并非弥赛亚称号。
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: 何况
  rationale: 承接上一节由天体尚且不洁推及人类的递进论证；“何况”自然表达希伯来语在此的加强推论语气。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 此词指人，并常带有软弱、必死的意味；正文用简洁的“人”保留代表性单数，脚注说明其语义色彩。
- source_word: רִמָּה
  choice: 蛆
  rationale: 该词常指与腐败、尸体相关的蛆虫；译作“蛆”既准确，也与下句较宽泛的“虫”形成区别。
- source_word: בֶן אָדָם
  choice: 世人
  rationale: 该短语在这里与אֱנוֹשׁ平行，指人类中的人。中文正文用“世人”自然传达其非称号性的含义，脚注保留其字面形式。
- source_word: תּוֹלֵעָה
  choice: 虫
  rationale: 这是较宽泛的虫类用词；译作“虫”可与前面的“蛆”相区别，并保留诗句的平行结构。
theological_decisions:
- issue: “人之子”（בֶן אָדָם）在本节是否为弥赛亚称号
  choice: 理解为指普通人的诗歌性表达
  alternative: 理解为弥赛亚或专有称号
  rationale: 该短语与“人”（אֱנוֹשׁ）构成同义平行，语境谈论人在上帝面前的卑微，并无专有称号的语法或上下文依据。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。以“何况”保留递进推论，以“蛆／虫”保留两个希伯来名词的差异；“不过是”使省略系词的希伯来诗句在中文中清楚流畅。
