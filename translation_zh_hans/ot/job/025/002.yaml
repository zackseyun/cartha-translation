  yaml_path: translation/ot/job/025/002.yaml
  text: Dominion and dread are with him[b][a]; he makes peace in his heights.
translation:
  language: zh_hans
  text: 权柄和令人畏惧之感都在他那里[a]；他在自己的高处施行和平[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“权柄和令人畏惧之感都属于他。”
    reason: alternative_reading
  - marker: b
    text: “高处”很可能指崇高的天上领域；也可译作“他的高天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  choice: 权柄
  rationale: 此名词源于 משל，表示统治、管辖或权柄。“权柄”既保留抽象名词形式，也符合现代中文庄重而自然的表达。
- source_word: וָפַחַד
  choice: 和威严
  rationale: פחד可指惧怕、可畏或令人敬畏之感。此处与上帝的统治并列，“威严”自然传达其令人敬畏的一面，又避免“恐怖”在现代中文中过强或负面的意味。
- source_word: עִמּוֹ
  choice: 都在他那里
  rationale: 字面为“与他同在／在他那里”。希伯来文是无动词句；译文补出“都在”，保留伴随或所在的表达，并不把潜在的所属意义定死。
- source_word: עֹשֶׂה
  choice: 缔造
  rationale: עשה基本义为“做、造成”。“缔造和平”在中文中搭配自然，表达其持续或特征性的作为，又不强化为原文未明说的“维持”或“建立秩序”。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: שלום可涵盖和平、完整、安宁与福祉；在此宇宙性的语境中，“和平”最直接自然，并保留其可能的宽广含义。
- source_word: בִּמְרוֹמָיו
  choice: 在自己的高处
  rationale: מרום表示高处或崇高之地，复数带第三人称单数词尾，直译为“他的高处”。中文用“自己的高处”明确反身所属，同时不直接窄化为“诸天”。
theological_decisions:
- issue: 开头无动词句的关系
  choice: 译作“权柄和威严都在他那里”
  alternative: “权柄和威严都属于他”
  rationale: עִמּוֹ字面表达“与他同在／在他那里”，也可在语境中含有所属意味。正文保留较透明的伴随或所在表达，脚注给出所属读法，避免替原文消除歧义。
- issue: “高处”的所指
  choice: 保留诗性表达“自己的高处”
  alternative: 明确译作“他的诸天／天界”
  rationale: 该短语很可能指崇高的天上领域，但原词本身是“高处”。保留这一意象，并在脚注说明可能所指，避免正文过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“权柄和威严”保留开句的并列名词结构；“在他那里”有意保存希伯来文在伴随与所属之间的张力；“自己的高处”延续原文的诗性空间意象。所有脚注标记均置于正文相关短语之后。
