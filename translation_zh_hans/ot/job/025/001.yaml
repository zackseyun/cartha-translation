  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: הַשֻּׁחִי
  choice: 书亚人
  rationale: 该称谓表明比勒达的族属或地域来源，与“书亚”相关；“书亚人”在现代中文中清楚自然。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר在引出直接引语的叙事公式中通常译为“说”。
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: 回答说
  rationale: 中文“回答说”既反映希伯来文两个动词，也符合现代汉语引出回应性发言的习惯；句首连接词所表达的叙事推进无需机械译出。
