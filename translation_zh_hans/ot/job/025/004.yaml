base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: zh_hans
  text: 那么，人怎能在上帝面前成为义人？妇人所生的人怎能洁净？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人怎能与上帝相对而成为义人？”希伯来文直译为“与上帝”；这里可指人在上帝面前的地位。
    reason: lexical_alternative
  - marker: b
    text: “洁净”也可译作“纯洁”或“无辜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: 那么……怎能
  rationale: 连词加疑问词引出承接上文的反问；“那么……怎能”在现代汉语中自然表达其语篇衔接与反问语气。
- source_word: יִצְדַּק
  choice: 算为义
  rationale: צדק 的 Qal 形式指处于正直、正义或被判为正当的状态。“算为义”保留人在上帝面前之地位的司法色彩，同时不把后期系统神学含义全部带入。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: אֱנוֹשׁ 指人，常含脆弱、必死的人类意味；此处用普通而庄重的“人”，符合平行句的泛指用法。
- source_word: עִם אֵל
  choice: 在上帝面前
  rationale: 希伯来文直译为“与上帝同在／与上帝相比”，在这里表达人与上帝相对时的身份或处境；“在上帝面前”自然保留这种关系性及可能的司法意味。
- source_word: יִזְכֶּה
  choice: 纯洁
  rationale: זכה 的 Qal 形式可指洁净、纯洁或无辜；“纯洁”与前句“算为义”构成自然平行，又不把含义限制为法律上的无罪。
- source_word: יְלוּד אִשָּׁה
  choice: 妇人所生的
  rationale: 这是泛指人的惯用表达，强调人的受生、有限与脆弱；采用简洁的名词化表达，保留原文的诗体平行。
theological_decisions:
- issue: 泛指人类的表达
  choice: 人……妇人所生的
  alternative: 世人……女人所生的人；必死的人……妇人所生的
  rationale: 原文用单数形式泛指人类。译文保留诗歌式的代表性单数，不限定为男性，也不明说原文仅含蓄表达的“必死”意味。
- issue: 人在上帝面前的关系性与司法意味
  choice: 在上帝面前
  alternative: 与上帝相比；在上帝那里；与上帝同在
  rationale: 介词 עִם 字面为“与”，但此处询问人在上帝那里的义之地位。“在上帝面前”既符合汉语习惯，也保留关系性和司法张力，而不将其收窄为某一特定称义教义。
- issue: צדק 的状态与判定色彩
  choice: 算为义
  alternative: 成为义人；称义；算得正直
  rationale: “算为义”兼顾处于正当状态与被判定为正当的可能性；避免“称义”过强地触发特定教义术语，也避免“成为义人”只表达道德转变。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两句都以“怎能”构成平行反问；“妇人所生的”保留原文凝练的惯用表达。所有脚注标记均置于正文相关句末。
