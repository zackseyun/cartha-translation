base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: zh_hans
  text: '看哪，连月亮也不发光[a]；

    众星在他眼中不洁净[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不明亮。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“不纯净”；也可能是“在他看来不明亮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的诗歌用语；“看哪”既保留庄重感，也符合现代中文圣经诗体。
- source_word: עַד
  choice: 连……也
  rationale: 此处不是表达空间或时间的“直到”，而是加强后接名词“月亮”的语气；“连……也”自然传达这种强调。
- source_word: יָרֵחַ
  choice: 月亮
  rationale: 直接指天体“月亮”。
- source_word: לֹא יַאֲהִיל
  choice: 也不明亮
  rationale: 该形式在此可表示发光或明亮；“不明亮”简洁自然，并保留它可能描述亮度而非发光动作的余地。
- source_word: וְכוֹכָבִים
  choice: 众星
  rationale: “众星”自然、凝练，适合与“月亮”并列的诗歌意象。
- source_word: לֹא זַכּוּ
  choice: 也不洁净
  rationale: זכך可涉及洁净、纯净或明亮；在“他眼中”这一评价性表达里，“不洁净”较贴近其基本含义，同时不把它过度解释为专指道德罪污。
- source_word: בְעֵינָיו
  choice: 在他眼中
  rationale: 紧贴希伯来语的惯用比喻，表示从他的评判或观点来看，也符合自然中文表达。
theological_decisions:
- issue: “在他眼中”的第三人称阳性单数后缀所指
  choice: 保留“他”，按上下文自然理解为上帝
  alternative: 直接译作“在上帝眼中”，或理解为诗歌论证中未明确说明的观察者
  rationale: 约伯记25:2–6的上下文以掌权并赐和平的上帝为论述中心，因此该后缀最自然地回指上帝；正文仍保留原文的代词形式，避免把解释直接写入译文。
- issue: 众星“不洁净”是道德评价还是光辉比较
  choice: 正文采用“不洁净”，不限定其为纯粹的道德污秽
  alternative: 译作“不纯净”或“不明亮”
  rationale: 原词兼有洁净、纯净以及可能的明亮色彩。上下文涉及受造物在上帝面前的不足，但诗句也运用天体光辉的意象；脚注保留词义上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，并以两行呈现希伯来诗歌的平行结构。“看哪”“众星”保留诗体色彩，但避免古奥措辞。脚注标记均置于其实际说明的词句之后。
