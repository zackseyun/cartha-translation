  yaml_path: translation/ot/job/025/003.yaml
  text: Is there any number to his troops? And upon whom does his light not rise?[a][b][c]
translation:
  language: zh_hans
  text: 他的军队有数目吗？他的光不照在谁身上呢？[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”也可译作“军旅”或“队伍”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的光不升起在谁之上呢？”
    reason: lexical_alternative
  - marker: c
    text: “他的光”可能指上帝普遍的照耀、荣光或无所不及；希伯来文没有进一步限定。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: 岂能数尽
  rationale: 希伯来文直译为“有数目吗”，是反问，表达其军队不可胜数；现代汉语用“岂能数尽”自然而庄重。
- source_word: לִגְדוּדָיו
  choice: 他的军队
  rationale: גְּדוּד可指部队、军旅或成群的队伍；上下文描写上帝统御的威势，“军队”既清楚又保留军事意象。
- source_word: וְעַל־מִי לֹא יָקוּם
  choice: 有谁照不到呢
  rationale: 原文意象是光“升起在谁之上”；汉语以“照不到谁”表达光临到人的普遍范围，同时在脚注保留较直译的空间和升起意象。
- source_word: אוֹרֵהוּ
  choice: 他的光
  rationale: אוֹר意为“光”，第三人称阳性单数后缀直译为“他的”；不具体限定为日光、荣光或恩惠，以保留原文的开放性。
theological_decisions:
- issue: “他的军队”和“他的光”中代词的所指
  choice: 保留“他的”，由上下文指向上帝
  alternative: 直接译作“上帝的军队”“上帝的光”
  rationale: 第2节的主题是上帝的统治与威严，因此代词最自然地指上帝；但正文保留原文代词，不把所指明说得比希伯来文更具体。
- issue: “他的光”的含义
  choice: 保留宽泛的“光”这一意象
  alternative: 特指日光、上帝的荣光或恩惠
  rationale: 希伯来文未限定该光的具体性质，可能涉及普遍照耀、荣光或无所不及的权能；译文不替原文消除这种含义张力。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“岂能数尽”传达不可胜数；第二问为自然汉语而适度意译，并以脚注保存“升起在……之上”的原始意象和“光”的语义开放性。
