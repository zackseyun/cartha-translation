  text: וְ/אִ֣ישׁ זְ֭רוֹעַ ל֣/וֹ הָ/אָ֑רֶץ וּ/נְשׂ֥וּא פָ֝נִ֗ים יֵ֣שֶׁב בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/008.yaml
  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: zh_hans
  text: 但土地却归有权势的人所有[a]，受优待的人住在其中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有权势的人”原文直译为“有膀臂的人”，是指强有力或有权势的人。
    reason: lexical_alternative
  - marker: b
    text: “受优待的人”也可译为“受尊重的人”“蒙眷顾的人”或“被偏待的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: 但……的人
  rationale: אִישׁ意为“人”；句首וְ在上下文中带转折意味，与前后对弱者的对待形成对比，因此译作“但”。
- source_word: זְרוֹעַ
  choice: 有权势
  rationale: 字面为“膀臂”，但אִישׁ זְרוֹעַ是指有力量、权力或势力的人；“有权势的人”自然地传达这里的社会力量含义。
- source_word: לוֹ הָאָרֶץ
  choice: 土地归……所有
  rationale: 介词לְ加代词在此表达占有或支配关系，直译近于“土地是他的”；“归……所有”保留这一所有权含义。
- source_word: וּנְשׂוּא פָנִים
  choice: 受优待的人
  rationale: 字面近于“脸面被抬起的人”，可指受尊重、蒙 favor 或被偏待的人。“受优待”保留其社会特权意味，又不武断限定这种待遇必然出于不公。
- source_word: יֵשֶׁב בָּהּ
  choice: 住在其中
  rationale: יָשַׁב在此指居住、定居；阴性代词בָּהּ回指“土地”，故译为“住在其中”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但……却……”凸显本节与上下文中弱者遭遇的对照；两个分句保持希伯来诗句的平行结构。
