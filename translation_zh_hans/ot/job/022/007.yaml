base_translation:
  language: en
  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: zh_hans
  text: 你没有给疲乏的人水喝，又不把饼给饥饿的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饼”在希伯来语中也可泛指“食物”；正文保留原文所用的具体词语。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: 没有／不
  rationale: 希伯来语的否定词统摄第一项指控；汉语分别用“没有”和“不”表达两项否定，更自然清楚。
- source_word: מַיִם
  choice: 水
  rationale: 按常用义直译为“水”，在汉语中自然用作不可数名词。
- source_word: עָיֵף
  choice: 疲乏的人
  rationale: 形容词在原文中作名词用，泛指疲惫者；“疲乏的人”既保留这一用法，也符合现代汉语。
- source_word: תַּשְׁקֶה
  choice: 给……水喝
  rationale: שׁקה的使役形表示“使……喝、给……喝”；“给……水喝”自然地保留使役含义。
- source_word: וּמֵרָעֵב
  choice: 又……给饥饿的人
  rationale: מִן与“饥饿的”连用，字面涉及从饥饿者那里扣住某物；结合动词，在汉语中表达为“不把饼给饥饿的人”，保留拒绝供给的关系。单数形容词按泛指处理。
- source_word: תִּמְנַע
  choice: 不把……给
  rationale: 原词意为扣住、不予供给。汉语“不把饼给……”自然传达所需食物被扣留不给的指控。
- source_word: לָחֶם
  choice: 饼
  rationale: 原词具体指饼或面包，也可泛指食物。正文保留具体意象“饼”，并以脚注说明其较广泛的可能含义。
