base_translation:
  language: en
  yaml_path: translation/ot/job/022/010.yaml
  text: Therefore snares are all around you[a], and sudden terror terrifies you.
translation:
  language: zh_hans
  text: 所以，罗网环绕着你，突如其来的恐惧使你惊慌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: 所以
  rationale: 承接上文的指控，表明以利法所说的结果；“所以”在现代汉语中自然保留推论关系。
- source_word: סְבִיבוֹתֶיךָ
  choice: 环绕着你
  rationale: 表达四周包围之意，也与诗歌中罗网逼近的意象相配。
- source_word: פַחִים
  choice: 罗网
  rationale: פַחִים 指捕捉用的网罗或陷阱；“罗网”既准确又保留诗体色彩。
- source_word: וִיבַהֶלְךָ
  choice: 使你惊慌
  rationale: בהל 表示使人惊惶、恐慌；此译直接呈现使役效果，且避免在中文中生硬重复“恐惧使你恐惧”。
- source_word: פַּחַד
  choice: 恐惧
  rationale: 可指惧怕、惊恐；“恐惧”在此强度适当，并自然充当动词的主语。
- source_word: פִּתְאֹם
  choice: 突如其来的
  rationale: 原词表示突然发生；转为定语修饰“恐惧”，保留其猝然而至的意味并符合现代汉语表达。
theological_decisions:
- issue: 话语所陈述的因果关系
  choice: 按以利法的断言直译为“所以”
  alternative: 弱化为仅表示时间或并列关系
  rationale: עַל כֵּן 明确引出以利法根据前文指控作出的结论；译文保留这一人物话语中的因果断言，但不额外认定其指控为叙事者的判断。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“罗网环绕着你”保留希伯来诗歌的危险意象；后半句使用“恐惧使你惊慌”，忠实表达同源语义的强化效果，同时避免不自然的中文重复。
