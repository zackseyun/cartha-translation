  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: zh_hans
  text: 请从他口中领受教诲[a]，并将他的话存记在心里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教诲”也可译作“律法”或“教导”；希伯来文为“妥拉”（torah）。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: 请领受
  rationale: קַח是命令式“拿、接受”；与“教诲”搭配时，“领受”自然表达主动接受。נָא在此加强恳求或劝勉语气，译作“请”。
- source_word: מִפִּיו
  choice: 他口中的
  rationale: 保留希伯来文“从他口中”的具体意象，同时用现代汉语自然的定中结构表达教诲的来源。
- source_word: תּוֹרָה
  choice: 教诲
  rationale: 本节处于智慧言说语境，并非明确专指摩西律法；“教诲”既体现权威性的教导，也避免加入经文未限定的盟约律法含义。
- source_word: וְשִׂים
  choice: 把……存在
  rationale: 动词本义为“放、置”，与“心里”连用表示将话语存留于内心；“存在”保留这一隐喻且符合现代汉语。
- source_word: אֲמָרָיו
  choice: 他的话
  rationale: 直接、自然地表达复数“言语、话语”，并保持其在上下文中的分量。
- source_word: בִּלְבָבֶךָ
  choice: 你心里
  rationale: 保留“心”作为思想、意志和内在生命所在的希伯来语意象；现代汉语也能自然理解。
theological_decisions:
- issue: 智慧言说中תּוֹרָה的含义
  choice: 教诲
  alternative: 律法；教导
  rationale: “教诲”符合以利法劝约伯接受来自上帝之言的智慧语境，同时不把该词过早限定为摩西律法，也不削弱其权威性。
- issue: 第三人称“他”的指称
  choice: 保留“他”，不在译文中明说是上帝
  alternative: 译作“上帝”
  rationale: 希伯来文本使用第三人称代词；虽然上下文很可能指上帝，译文仍保留原文表达，避免将上下文推断直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“请领受”体现劝勉语气；“他口中的”保留原文口传意象；“存在你心里”简洁表达将话语存留于内心。
