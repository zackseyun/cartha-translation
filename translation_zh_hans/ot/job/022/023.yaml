  text: אִם תָּשׁ֣וּב עַד שַׁ֭דַּי תִּבָּנֶ֑ה תַּרְחִ֥יק עַ֝וְלָ֗ה מֵ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/023.yaml
  text: If you return to the Almighty[a], you will be restored; if you put unrighteousness far from your tent[b],
translation:
  language: zh_hans
  text: 你若归向全能者，就必得以恢复[a]；你若使不义[b]远离你的帐棚，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必被建立”或“必得以重建”。希伯来语动词的字面意思是“被建造”，这里以此比喻恢复或重新确立。
    reason: lexical_alternative
  - marker: b
    text: 或译“恶行”或“不公”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出条件句；“若”简洁庄重，也符合现代书面汉语。
- source_word: תָּשׁוּב
  choice: 归向
  rationale: שוב 的基本义是转回、返回；“归向”既保留朝向上帝而回转的动态，也不把词义收窄为专门的“悔改”。
- source_word: עַד שַׁדַּי
  choice: 向全能者
  rationale: עַד 在此表示回转所朝向的对象；שַׁדַּי 是上帝的称号，译作通行且自然的“全能者”。
- source_word: תִּבָּנֶה
  choice: 必得以恢复
  rationale: 这是 בנה“建造”的尼法勒形，字面为“被建造／被重建”；此处用作人重新被建立的比喻。“得以恢复”自然传达被动的复原、重立之意，字面意象保留于脚注。
- source_word: תַּרְחִיק
  choice: 使……远离
  rationale: רחק 的使役形表示使某物变远；“使……远离”保留其使役结构。
- source_word: עַוְלָה
  choice: 不义
  rationale: 该词可指不公、邪恶或错误行为；“不义”涵盖道德与公义层面，又不过度限定具体罪行。
- source_word: מֵאָהֳלֶךָ
  choice: 远离你的帐棚
  rationale: 原文直译为“从你的帐棚”；“远离你的帐棚”保留帐棚意象，并在汉语中与使役动词自然衔接。
theological_decisions:
- issue: 是否按字面翻译“被建造”的恢复比喻
  choice: 必得以恢复
  alternative: 必被建立／必得以重建
  rationale: 原文把人的复兴描写为被建造。正文用自然汉语表达其语境意义，同时以脚注保留字面比喻，避免把恢复理解得过于具体。
- issue: 将 שוב 译为一般性的回转，还是明确译作悔改
  choice: 归向
  alternative: 悔改／回转
  rationale: “归向”保留词根“转回、返回”的基本意义及朝向上帝的关系性含义，不把经文本身的开放性收窄为一个较专门的神学术语。
- issue: 第二个未重复 אִם 的动词如何处理
  choice: 补出“你若”，作为与前句并列的条件
  alternative: 并使不义远离你的帐棚
  rationale: 希伯来文只在句首明说一次“若”，后面的未完成式可延续条件语气。汉语补出“你若”可清楚表达句法关系，但不改变两个行动同属劝告条件的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“全能者”沿用通行的神圣称号译法；“帐棚”保留古代生活图景。句末保留逗号，以反映本节思想在下一节继续展开。
