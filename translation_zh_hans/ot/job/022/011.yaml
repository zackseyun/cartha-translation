base_translation:
  language: en
  yaml_path: translation/ot/job/022/011.yaml
  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: zh_hans
  text: 或是黑暗，使你看不见；又有大量的水遮盖你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又有洪水淹没你。”希伯来语可指丰沛、漫溢的水；正文保留“大量的水”的较宽泛表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: 或有
  rationale: אוֹ承接上文，另举一种临到约伯的灾祸；“或有”在中文诗体中简洁自然。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 该词可指实际或比喻性的黑暗；此处与“看不见”相连，直译为“黑暗”最贴切。
- source_word: לֹא תִרְאֶה
  choice: 使你看不见
  rationale: 原文直译为“你看不见”。结合前面无动词的“黑暗”，用“使”表达语境中的结果关系，同时不添加具体宾语。
- source_word: וְשִׁפְעַת מַיִם
  choice: 又有洪水
  rationale: שִׁפְעָה表示丰盛、充溢或涌流，与“水”连用时可自然理解为大量涌来的水。中文“洪水”凝练地保留这种压倒性的水势；脚注列出较形式对应的译法。
- source_word: תְּכַסֶּךָּ
  choice: 淹没你
  rationale: כסה的加强词干基本义为“遮盖”。主语是大量的水时，现代汉语以“淹没你”最自然，并保留水覆盖人的意象。
theological_decisions: []
