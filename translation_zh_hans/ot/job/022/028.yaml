  yaml_path: translation/ot/job/022/028.yaml
  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: zh_hans
  text: 你所宣定的事[a]必为你成就；光必照耀你的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“你宣定一句话，这话必得成立。”
    reason: 保留אֹמֶר“话语／一句话”的较字面含义，以及יָקָם“站立、成立”的意象。
lexical_decisions:
- source_word: תִגְזַר
  choice: 定下
  rationale: גזר在这里表示作出坚定的决定或宣定。“定下”既自然，又保留决定已确定、不可轻易更改的语气，同时避免过度暗示君王式的权威。
- source_word: אֹמֶר
  choice: 一件事
  rationale: אֹמֶר本义与言语、话语有关，但与גזר连用时可指所宣定或决定的事。“一件事”符合现代汉语习惯；较字面的“一句话”保留在脚注中。
- source_word: יָקָם
  choice: 立定
  rationale: קום的基本意象是站立；用于所决定之事时，表示得以确立、生效。“立定”保留原文意象，也没有把它扩大解释为普遍而无条件的成功保证。
- source_word: לָךְ
  choice: 为你
  rationale: ל在此表达与受益者或相关者的关系。“为你”简洁地保留原文结构和应许语气。
- source_word: דְּרָכֶיךָ
  choice: 你的道路
  rationale: דרך既可指实际道路，也常比喻人的行程、处境或生活道路。“道路”保留诗歌中的路径意象，并与光的照耀自然衔接。
- source_word: נָגַהּ אֹור
  choice: 光也必照耀
  rationale: נגה表示发光、照耀，以אֹור为主语。此译保留直接鲜明的光明意象；“必”体现未完成式在上下文中的确信语气。
theological_decisions:
- issue: 以利法话语中应许的性质
  choice: 按以利法确信的口吻译为预期必然发生的结果，但不添加无条件成功或普遍繁荣的教义性说明。
  alternative: 将本句强化为上帝对所有人的绝对应许，或弱化为仅仅可能发生。
  rationale: 本节是以利法劝告约伯时所作的确信陈述；译文应忠实呈现其语气，同时让《约伯记》整体对以利法观点的张力保持开放，不替叙事作最终裁决。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定下”“立定”形成简洁的诗性呼应；分号保留两个平行结果分句。脚注标记[a]已置于正文相应位置。
