revisions:
- from: 你定下一件事[a]，这事就必为你立定；光也必照耀你的道路。
  to: 你所宣定的事[a]必为你成就；光必照耀你的道路。
  rationale: 修订消除了“为你立定”的不自然搭配，并保留原文中宣定、确立及光照道路的平行诗句。正文以“所宣定的事”自然表达“宣定的话语／所决定之事”，脚注则保留较字面的“话语”和“成立”可能。
  reviewer_model: gpt-5.6-terra
