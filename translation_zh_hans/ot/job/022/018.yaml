base_translation:
  language: en
  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: zh_hans
  text: 然而，他使他们的家充满美好的事物[a]；恶人的计谋却离我很远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他们的家兴旺”。希伯来文直译为“使他们的家充满好”，所指很可能是各样好东西、好处或福乐。
    reason: lexical_alternative
  - marker: b
    text: 或理解为“愿恶人的计谋离我远远的”。希伯来文更直接地是陈述：“恶人的计谋离我很远。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: 然而，他
  rationale: 连词与显式代词在上下文中带出转折：恶人虽拒绝上帝，上帝却使他们富足。保留“他”，不把所指直接改写为“上帝”。
- source_word: מִלֵּא
  choice: 使……充满
  rationale: 准确表达使役性动词“装满、使充满”，并与“家”构成自然的现代汉语。
- source_word: בָתֵּיהֶם
  choice: 他们的家
  rationale: 保留希伯来文“房屋、家”的具体意象；“家”在现代汉语中也可涵盖家庭生活与家业。
- source_word: טוֹב
  choice: 美物
  rationale: 原词直译为“美善之物、好东西”，在此作名词使用。“美物”既保持原文的概括性，又比“好东西”更庄重；不直接译作“兴旺”，以免过度解释。
- source_word: וַעֲצַת
  choice: 但……计谋
  rationale: עֵצָה可指谋议、主意或筹划；“计谋”适合此处恶人的立场。连词按两分句之间的转折关系译为“但”。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 准确表达作名词用的复数形容词，即邪恶之人，并符合现代汉语圣经文体。
- source_word: רָחֲקָה מֶנִּי
  choice: 离我很远
  rationale: 该完成式在此表达当前的疏离状态，用自然现代汉语陈述说话人与恶人计谋无关；同时在脚注保留祈愿式理解的可能。
theological_decisions:
- issue: 末句是陈述还是祈愿
  choice: 译作陈述：“恶人的计谋离我很远”
  alternative: “愿恶人的计谋离我远远的”
  rationale: 希伯来文使用完成式רָחֲקָה，较直接的句法是陈述某种疏离状态，而非命令式或祈愿式。脚注保留语用上可能的祈愿理解，不把这种张力从正文中彻底排除。
- issue: 首句代词的所指
  choice: 保留“他”
  alternative: 明说“上帝”
  rationale: 上下文表明所指是上帝，但希伯来正文使用代词。保留代词既忠实于形式，也避免在正文中加入原文未明说的名词。
translation_notes:
  register: 采用自然、庄重而不古奥的现代标准汉语。“美物”保留原文具体而概括的“美善之物”，分号体现希伯来诗歌两个分句之间的对照。所有补充解释均置于脚注，正文不明说代词“他”即上帝。
