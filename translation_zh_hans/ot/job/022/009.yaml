  text: אַ֭לְמָנוֹת שִׁלַּ֣חְתָּ רֵיקָ֑ם וּ/זְרֹע֖וֹת יְתֹמִ֣ים יְדֻכָּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
translation:
  language: zh_hans
  text: 你使寡妇空手而归[a]，孤儿的膀臂[b]被压碎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空手而归”也可译作“毫无所得地离去”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“孤儿的膀臂”；“膀臂”也可象征他们的力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: 寡妇
  rationale: 该复数名词通常指丧夫的妇女；“寡妇”是现代汉语中自然、准确的对应词，也保留其在智慧文学中的弱势社会处境。
- source_word: שִׁלַּחְתָּ רֵיקָם
  choice: 使……空手而归
  rationale: שִׁלַּחְתָּ 表示打发走、送走，רֵיקָם 表示空着、空手；合译为“使……空手而归”，既符合汉语习惯，也保留不给予任何帮助或所得的指控意味。
- source_word: זְרֹעוֹת
  choice: 膀臂
  rationale: 原义为“手臂”，也可象征力量或权势。“膀臂”保留希伯来诗歌的具体意象，并能容纳力量受摧毁的比喻含义。
- source_word: יְתֹמִים
  choice: 孤儿
  rationale: 该词在古代社会语境中特别指失去父亲、缺少保障的孩子；“孤儿”是普通现代读者最自然的称呼。
- source_word: יְדֻכָּא
  choice: 被压碎
  rationale: 源自动词 דכא，含压碎、打碎之意。被动译法忠实反映原文；尽管希伯来语动词形式为单数，主语“膀臂”为复数，诗歌中可能按集合概念配合，汉语无需标示数的一致。
theological_decisions:
- issue: “膀臂”是身体部位还是力量的象征
  choice: 正文保留具体意象“膀臂”，脚注说明其可指力量
  alternative: 直接译为“力量”或“权势”
  rationale: 原文容许具体与比喻两层理解；不在正文中替读者消除这种诗意张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“空手而归”清楚表达被打发走却一无所得；“膀臂”略带文学色彩，与本节的希伯来诗歌意象相称。
