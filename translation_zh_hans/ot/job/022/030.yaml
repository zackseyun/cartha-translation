base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: zh_hans
  text: 他甚至会救出并非无辜的人[a]；那人必因你双手的清洁[b]而获救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他会救出无辜的人。”本节上半句的希伯来文艰涩，也有人对这个短语作不同理解。
    reason: alternative_reading
  - marker: b
    text: “双手的清洁”是表示行为无可指责或道德纯正的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: 会救出
  rationale: מלט 的皮埃勒式表示使人逃脱、搭救；“救出”既保留使役意味，也与下半句的被动表达相呼应。
- source_word: אִי
  choice: 甚至……并非
  rationale: 本节希伯来文句法艰涩。这里依传统理解，将 אִי 视为具有否定作用，并用“甚至”表达语境中的递进意味；其通常的名词义“岛、海岸”不合此处句法。
- source_word: נָקִי
  choice: 无辜
  rationale: נָקִי 可指清白、没有罪责；“无辜”准确传达这里的道德或司法含义。
- source_word: וְנִמְלַט
  choice: 那人必……获救
  rationale: מלט 的尼法勒式可表示“得以逃脱、获救”。补出“那人”以明确承接上半句的对象，而不改变原句关系。
- source_word: בְּבֹר
  choice: 因……清洁
  rationale: בֹּר 在这里通常理解为纯洁、洁净；介词 בְּ 表示凭借的途径或依据，译作“因”符合现代汉语。
- source_word: כַּפֶּיךָ
  choice: 你双手的
  rationale: כַּפַּיִם 字面指双掌或双手；此处保留“手”的形象，因为“手的清洁”是表示行为无可指责、道德纯正的习语。
theological_decisions:
- issue: 上半句艰涩短语 אִי נָקִי 的解释
  choice: 他甚至会救出并非无辜的人
  alternative: 他会救出无辜的人
  rationale: 这种译法承接传统上把 אִי 理解为否定成分的解释，并使下半句表达：那人因“你”手洁而获救。脚注同时保留另一种重要读法，避免把有争议的希伯来文说成毫无歧义。
- issue: 本节是否明确教导代求或替代性功德
  choice: 只陈述那人因“你双手的清洁”而获救
  alternative: 明确解释为约伯借代求或功德拯救罪人
  rationale: 原文表达一人的获救与另一人手的清洁有关，但没有说明具体机制；正文不加入超出本节的教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“救出／获救”再现原文主动与被动形式的呼应；“双手的清洁”保留希伯来文意象，并用脚注说明其习语含义。
