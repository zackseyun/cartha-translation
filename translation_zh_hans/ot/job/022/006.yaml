- from: 因为你无故拿弟兄的东西作抵押[a][b]，又剥去赤身之人的衣服。
  to: 因为你无故向弟兄索取抵押物[a][b]，又剥去赤身之人的衣服。
  rationale: 仅修正“抵押”关系在汉语中的方向性歧义。“向弟兄索取抵押物”对应从弟兄处取得担保物的指控，同时不额外断定其具体法律程序。其余措辞和两处脚注均保留原有的文本张力及社会文化说明。
