  text: כִּֽי תַחְבֹּ֣ל אַחֶ֣י/ךָ חִנָּ֑ם וּ/בִגְדֵ֖י עֲרוּמִּ֣ים תַּפְשִֽׁיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/006.yaml
  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: zh_hans
  text: 因为你无故向弟兄索取抵押物[a][b]，又剥去赤身之人的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你无故拿走弟兄的抵押物。”
    reason: lexical_alternative
  - marker: b
    text: “弟兄”也可泛指同族或同一群体中的人，不一定仅指亲生兄弟。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，以因由或说明的语气引出以利法对约伯的指控；现代汉语用“因为”自然清楚。
- source_word: תַחְבֹּל
  choice: 拿……作抵押
  rationale: חבל在此指拿取债务抵押物。“拿……作抵押”既保留法律与经济背景，也比单说“夺取”少一层解释。
- source_word: אַחֶיךָ
  choice: 弟兄
  rationale: 原文直译为“你的弟兄”，在此也可泛指同族或同一群体中的人；正文保留其社会关系色彩。
- source_word: חִנָּם
  choice: 无故
  rationale: 表达没有正当理由、无缘无故，而不只是没有报酬；“无故”简洁且带有道德指控意味。
- source_word: וּבִגְדֵי
  choice: 衣服
  rationale: בגד指衣服、衣物；现代汉语中“衣服”自然明白。
- source_word: עֲרוּמִּים
  choice: 赤身之人
  rationale: 该词可指赤身或衣不蔽体的人。此处保留与“剥去衣服”之间尖锐而反常的张力，不改译为较抽象的“穷人”。
- source_word: תַּפְשִׁיט
  choice: 剥去
  rationale: פשט的使役式在此指使人脱去衣物，即剥掉其衣服；“剥去”直接而有力度。
theological_decisions:
- issue: 以利法的指控是否是叙述者确认的事实
  choice: 按直接指控译出，不在正文中加以确认或否定
  alternative: 添加“据他说”或“竟然”等解释性措辞
  rationale: 本节是以利法讲话的一部分；译文应保留戏剧语境中的指控性质，不把说话者的判断等同于全书叙述者的裁定。
- issue: עֲרוּמִּים所呈现的张力
  choice: 译作“赤身之人”
  alternative: 译作“衣不蔽体的人”或“贫苦人”
  rationale: 原文有意形成“剥去赤身者衣服”的强烈张力；不应为了逻辑顺畅而消解这种修辞效果。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“拿……作抵押”呈现古代债务习俗，“赤身之人”则保留原文刻意形成的尖锐张力。脚注标记按正文首次涉及内容的顺序放置。
