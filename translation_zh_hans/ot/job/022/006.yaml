review_pass:
  verdict: revise
  source_fidelity: 正文“拿弟兄的东西作抵押”在汉语中通常理解为把弟兄的物品用作自己一方的抵押，而希伯来文指向弟兄索取／拿走抵押物。需改为明确的受取抵押物表达。其余部分忠实保留了因果连接、无正当理由的控诉，以及“赤身者”与其衣服被剥去的尖锐张力。
  naturalness: “无故向弟兄索取抵押物”是现代书面汉语中清楚自然的表达，也避免“拿……作抵押”的施事与受事歧义。“赤身之人”庄重、可懂，并适合本节的修辞语境。
  terminology: “弟兄”保留原文的社会关系用语，脚注说明其可扩展的群体含义；“抵押物”准确表达债务担保物；“赤身之人”不将原文泛化为“穷人”或“衣不蔽体的人”。
