  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: zh_hans
  text: 你为人公义，难道能给全能者带来喜悦[a]吗？你使自己的道路纯全，难道能给他带来收益[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喜悦”也可译作“乐趣”。
    reason: lexical_alternative
  - marker: b
    text: “收益”也可译作“利益”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: 喜悦
  rationale: חֵפֶץ可指喜悦、乐趣或意愿；此处与表示归属或受益者的לְ连用，以“给……带来喜悦”自然表达其含义，同时保留反问语气。
- source_word: לְשַׁדַּי
  choice: 给全能者
  rationale: שַׁדַּי是《约伯记》中常见的神圣称号，译作“全能者”；介词לְ在此表示喜悦所归向的对象，以“给”符合现代汉语表达。
- source_word: כִּי תִצְדָּק
  choice: 你为人公义
  rationale: צדק的Qal未完成式在此表示处于公义、正直的状态，而非“自以为义”或“证明自己有理”；“为人公义”也与下半句的生活道路相呼应。
- source_word: וְאִם
  choice: （第二个反问句）
  rationale: וְאִם在平行结构中引出第二个反问。汉语分成两个问句即可自然体现“或/又是否”的关系，无须生硬直译“而如果”。
- source_word: בֶּצַע
  choice: 收益
  rationale: בֶּצַע指所得、利益或利润。“收益”保留经济利益的比喻，也适合“给他带来”的句式。
- source_word: כִּי תַתֵּם
  choice: 你使……纯全
  rationale: תמם的Hiphil形式带有使之完整、纯全的使动含义；译文保留“使”，不把它改成单纯的状态描述。
- source_word: דְּרָכֶיךָ
  choice: 自己的道路
  rationale: דֶּרֶךְ复数在此比喻人的生活方式或行事为人；保留“道路”这一源文意象，同时用“自己的”明确第二人称所属关系。
theological_decisions:
- issue: 人的公义是否能使上帝本质上获益
  choice: 把两句都译成反问，准确呈现以利法所主张的：人的公义和纯全不能给全能者带来收益。
  alternative: 将首句弱化为仅仅强调上帝并不需要人的公义，而不涉及他是否喜悦公义。
  rationale: 源文并列使用“喜悦”和“收益”，反问力度不宜削弱；但这是以利法在论辩中的话，译文不把它扩展成整本圣经对于上帝是否喜爱公义的普遍教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个平行反问分别成句，以便普通读者理解；保留“道路”的希伯来语隐喻和“收益”的经济隐喻，也保留使动表达所体现的主动修整生活道路之意。
