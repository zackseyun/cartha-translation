base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: zh_hans
  text: 当人被降卑时，你就说：“必有高升！”[a]他必拯救眼目低垂的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文十分简略，也可译作：“人们被压低时，你就说：‘高举他们！’”或“……你就说：‘有升高！’”
    reason: alternative_reading
  - marker: b
    text: 直译为“眼目低下的”；可指谦卑、受压或沮丧的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为……时
  rationale: 这里兼有承接上文的因由和引出情境的作用；译作“因为……时”保留其因果—时间色彩。
- source_word: הִשְׁפִּילוּ
  choice: 人们被降卑
  rationale: 该复数形式描写人处于被压低、受屈辱的境况。中文补出泛指的“人们”，但不把它解释为主动自卑。
- source_word: וַתֹּאמֶר
  choice: 你就说
  rationale: 动词以第二人称阳性单数指向以利法所对话的人；“就”自然表达此处随情境而来的宣告。
- source_word: גֵּוָה
  choice: 必得高升
  rationale: 该名词性短语极为简略，基本意象是高起、升高，与前面的“被降卑”构成反转。“必得高升”在中文中可作为宣告，同时避免在正文中补入希伯来文没有明说的宾语。
- source_word: וְשַׁח עֵינַיִם
  choice: 眼目低垂的人
  rationale: 尽量保留原文“眼目低下”的具体形象；它可指谦卑、受压或沮丧的人，正文不将这些含义限定为其中一种。
- source_word: יוֹשִׁעַ
  choice: 他必拯救
  rationale: 该词来自 ישׁע，意为拯救、解救；未完成式在这一应许语境中自然译为“必拯救”。主语仍按原文只用“他”隐含表达。
theological_decisions:
- issue: יוֹשִׁעַ 的主语
  choice: 保留隐含主语，译作“他必拯救”
  alternative: 明确译作“上帝必拯救”，或理解为不定主语
  rationale: 希伯来文动词是第三人称阳性单数，上下文最自然地指上帝，但本节没有明说“上帝”；保留“他”既符合语境，也维持原文的简洁。
- issue: גֵּוָה 在省略句中的含义
  choice: 理解为由卑微转为升高的正面宣告：“必得高升！”
  alternative: 译作“高举他们！”、“有升高”，或按该词在其他语境中的用法理解为“骄傲”
  rationale: 紧邻的“被降卑”使正面的升高或抬举最符合对比关系；不过原句缺少完整谓语结构，因此用脚注保留其他译法，不把语法含混完全消除。
- issue: “眼目低垂”的所指
  choice: 保留身体意象，不直接改译为“谦卑的人”
  alternative: “谦卑的人”、“受压的人”或“沮丧的人”
  rationale: 该表达可以涵盖谦卑、受屈和沮丧；直译其意象可避免把经文限定为单一的属灵或心理状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“降卑—高升”保留原文鲜明的高低对照；“眼目低垂”保留诗性形象。正文不显式补出“上帝”，也不把困难的名词 גֵּוָה 直接定解为“骄傲”。
