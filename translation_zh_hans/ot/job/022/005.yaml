  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: zh_hans
  text: 你的罪恶岂不是极大，你的罪孽也没有尽头吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: 不是……吗／岂不是……吗
  rationale: 该结构引出预期肯定回答的反问。中文用“不是……吗”和“岂不是……吗”既保留反问语气，也显出以利法指控约伯的口吻。
- source_word: רָעָתְךָ
  choice: 你的罪恶
  rationale: רָעָה 可指道德上的恶，也可在某些语境中指灾祸；这里与“你的罪孽”平行，主要指道德上的恶。“罪恶”在现代中文中自然、庄重，也保留较宽泛的道德含义。
- source_word: רַבָּה
  choice: 很大
  rationale: 该形容词表达程度或数量之大。与集合意义的“罪恶”搭配时，“很大”比“很多”更贴近原文形式，并自然表达罪恶深重。
- source_word: וְאֵין קֵץ
  choice: 岂不是没有尽头吗
  rationale: קֵץ 可指“尽头”或“限度”。“没有尽头”是自然的中文表达；为清楚传达贯穿整句的反问语气，将第二分句也译成反问句。
- source_word: לַעֲוֺנֹתֶיךָ
  choice: 你的罪孽
  rationale: עָוֹן 可指罪孽、罪责或罪所带来的后果。此处是直接的道德指控，“罪孽”较“罪”更能体现其强烈语气，并与前句“罪恶”形成平行。
theological_decisions:
- issue: רָעָתְךָ 应理解为道德上的恶，还是约伯所受的灾祸
  choice: 道德上的罪恶
  alternative: 灾祸／不幸
  rationale: 虽然 רָעָה 在其他语境中可以表示灾祸，但此处紧接着与“你的罪孽”平行，因此道德含义明显占主导。译文保留以利法是在控告约伯犯罪这一语境，而不是把本句弱化为对约伯苦难的描述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。原文由两个并列分句构成，反问词位于句首，其语力涵盖整句；中文分作两个相连的反问句，使指控清楚自然，同时保留平行结构和递进力度。
