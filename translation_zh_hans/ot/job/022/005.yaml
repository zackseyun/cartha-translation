  to: 你的罪恶岂不是极大，你的罪孽也没有尽头吗？
  rationale: 修订将全句处理为一个反问句，使句首“岂不是”同时统摄“罪恶极大”和“罪孽没有尽头”两个并列判断，更准确反映 הֲלֹא 的句法作用。保留原有的道德含义、控诉性语气及脚注所说明的词义选择；脚注 b 改为与修订正文的单一反问结构相一致的替代译法。
