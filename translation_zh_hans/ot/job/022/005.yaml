    rationale: 希伯来文仅在句首用 הֲלֹא 标示反问，语气可涵盖两个由 וְ 连接的分句。将第二分句另译为“岂不是……吗”虽不改变核心意义，但较弱地偏离了原句的单一统摄性反问结构。
