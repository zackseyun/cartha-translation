  yaml_path: translation/ot/job/022/025.yaml
  text: then the Almighty will be your gold[a], and choice silver for you.
translation:
  language: zh_hans
  text: 那么，全能者必作你的黄金[a]，作你的上等白银。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，全能者必作你的财宝，并为你预备丰盛的银子。”原文中译作“黄金”的词以及修饰“白银”的词都较难确定，可能强调上帝所赐的财富，而不一定是以上帝自己为至宝。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: 那么……必作
  rationale: 结合上一节的劝告，将此处的连接词和完成式表达为随条件而来的结果；“那么”自然呈现承接关系，“必作”保留将来意味。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是《约伯记》中常见的神圣称号；采用通行的意译，既传达含义，也保持庄重。
- source_word: בְּצָרֶיךָ
  choice: 你的黄金
  rationale: 该词意义较难确定，可指矿石、贵重金属或财宝；因其与下句“白银”构成诗歌平行，此处译为“黄金”最为顺畅。
- source_word: וְכֶסֶף
  choice: 作你的……白银
  rationale: 承接上半句省略的谓语，并在中文中补出“作你的”，使两行的比喻关系清楚自然。
- source_word: תּוֹעָפוֹת
  choice: 上等
  rationale: 这是罕见且含义不确定的词，在此可能表示优质或丰盛；正文用“上等”表达贵重品质，同时以脚注保留“丰盛”的可能。
- source_word: לָךְ
  choice: 你的
  rationale: 用领属表达自然呈现原文“给你、归你”的受益和归属意味。
theological_decisions:
- issue: 以利法的应许是说上帝自己成为约伯的财富，还是说上帝赐给约伯物质财富
  choice: 正文将全能者比作约伯的黄金和白银，即上帝自己成为他的至宝。
  alternative: 全能者会为约伯预备财宝和丰盛的银子。
  rationale: 原文的诗歌结构容许两种理解。正文保留“全能者作你的黄金”这一较直接而有力的隐喻，脚注则注明物质供应的可能，不把经文本身的张力作教义化裁断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“黄金—白银”的平行保留原文诗意；脚注明示词义和句法上的真实歧义。
