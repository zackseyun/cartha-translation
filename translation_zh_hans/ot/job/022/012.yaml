  text: הֲֽ/לֹא אֱ֭לוֹהַּ גֹּ֣בַהּ שָׁמָ֑יִם וּ/רְאֵ֤ה רֹ֖אשׁ כּוֹכָבִ֣ים כִּי רָֽמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: zh_hans
  text: 神岂不在天之高处吗？你看那最高的星辰[a]，它们何等高远！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“星辰的头（或顶端）”；也可理解为“星辰的最高处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 用现代汉语反问句式表达期待认同的语气，既保留疑问形式，也不额外加入“诚然”等强调意味。
- source_word: אֱלוֹהַּ
  choice: 神
  rationale: 这是指神的单数称谓；“神”是简明、自然且不添加解释的对应。
- source_word: גֹּבַהּ שָׁמָיִם
  choice: 高居天上
  rationale: 原文直译近于“天的高处”。结合省略的空间关系，用“高居天上”自然表达神处于天之高处的意象，同时避免把它改写成单纯的高度比较。
- source_word: וּרְאֵה
  choice: 你看
  rationale: 保留祈使语气；汉语补出隐含的第二人称主语，使劝人观看的呼语自然清楚。句间关系以标点体现，不机械翻出连接词。
- source_word: רֹאשׁ כּוֹכָבִים
  choice: 群星之巅
  rationale: רֹאשׁ 本义为“头、顶端”，此处可指群星的最高处。“群星之巅”保留原文的顶部意象与诗体色彩；脚注说明也可理解为最高的星辰。
- source_word: כִּי
  choice: 何等
  rationale: 在此引出感叹性的观察；“何等”自然传达“多么”的感叹功能，而不误解为因果关系。
- source_word: רָמּוּ
  choice: 高远
  rationale: 该动词表示高、升高。此处描述星辰所在的物理高度，“高远”符合天象语境，也避免“崇高”可能带来的荣誉或道德含义。
theological_decisions:
- issue: 本节是在断言神的超越性，还是在以空间意象展开以利法的反问
  choice: 按以利法话语中的反问直译，保留神高居天上和群星高远的空间意象
  alternative: 扩译为神远离人世，或明确说这是对约伯的神学批评
  rationale: 希伯来文本本身只提出反问并诉诸高天与群星的景象，没有在本节明说神与人的疏远，也没有完整展开对约伯的批评，因此不应在译文中补入这些结论。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“高居天上”使原文省略的空间关系在汉语中自然显明；“群星之巅”则有意保留 רֹאשׁ 的形象性，并用脚注交代另一种顺畅理解。
