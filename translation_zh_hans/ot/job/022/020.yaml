base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: zh_hans
  text: “我们的仇敌确实已被剪除[a]，火把他们的余剩[b]吞灭了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们的仇敌”：原文此词含义困难，也有人理解为“我们的财物”或“我们的产业”。
    reason: alternative_reading
  - marker: b
    text: “余剩”也可译为“所余下的”或“遗存”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: 确实
  rationale: 这里不是实际条件句，而是加强断言的惯用表达；“确实”能以自然、庄重的现代汉语传达强调语气。
- source_word: נִכְחַד
  choice: 已被剪除
  rationale: 该词的尼法勒形式带有被动和结果意味，表示被除灭、消失；“已被剪除”既保留被动语态，也符合恶人遭清除的语境。
- source_word: קִימָנוּ
  choice: 我们的仇敌
  rationale: 此希伯来语形式含义困难。结合下句“他们所剩的”及本段语境，将其理解为起来敌对我们的人，即“我们的仇敌”，最能形成连贯指称；另义在脚注中保留。
- source_word: וְיִתְרָם
  choice: 他们所剩的
  rationale: יתר常指剩余之物，词尾代词指向前述群体；“他们所剩的”自然地保留“余剩之物”的含义。
- source_word: אָכְלָה אֵשׁ
  choice: 被火吞灭了
  rationale: 原文以“火”为主语，直译为“火吞吃”；汉语用被动式“被火吞灭”仍保留火彻底毁灭余剩之物的鲜明意象，并使两分句结构流畅。
theological_decisions:
- issue: 说话者对被毁灭者的指称
  choice: 采用“我们的仇敌”，但以脚注标明原文疑难
  alternative: 我们的财物／产业
  rationale: 上下文和平行结构较支持人的群体指称，但原词并不确定，不宜把这一解释呈现为毫无疑义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“剪除”保留经文中彻底除去的力度；“吞灭”传达火焰毁灭性的拟人意象。脚注标记均置于相关词句之后，并保留原文的词义不确定性。
