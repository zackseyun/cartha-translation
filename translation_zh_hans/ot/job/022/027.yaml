base_translation:
  language: en
  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: zh_hans
  text: 你向他祷告，他必垂听你；你必履行你所许的愿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你必偿还你所许的愿。”这里指履行向神所作的承诺。
    reason: 保留שׁלם与נדר搭配时“偿还”的较字面表达，同时说明其在此处指履行誓愿的习语含义。
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: 祷告
  rationale: עתר的使役词干在此表示向神恳切祈求；结合介词“向他”和下句“垂听”，译作“祷告”自然清楚，并保留祈求含义。
- source_word: אֵלָיו
  choice: 向他
  rationale: 原文是介词אֶל加第三人称阳性单数后缀，直译为“向他”；上文所指为神，无须在本节重复补出“神”。
- source_word: וְיִשְׁמָעֶךָּ
  choice: 他就垂听你
  rationale: שׁמע基本义为“听、听从”。祷告语境中的“垂听”是自然、庄重的现代汉语表达，又不像“应允”那样明确加入祈求必按所求实现的意思。
- source_word: וּנְדָרֶיךָ
  choice: 所许的愿
  rationale: נֶדֶר指向神所许的愿。译作“所许的愿”比单说“愿”更便于现代读者理解，也没有把它限定为某一种祭物。
- source_word: תְשַׁלֵּם
  choice: 履行
  rationale: שלם的加强词干与“愿”搭配时，字面有“偿付”之意，实际指实行对神所作的承诺；“履行”准确传达这一习语含义，避免“支付”带来的纯金钱联想。
theological_decisions:
- issue: 末句应按字面译作“偿还所许的愿”，还是按希伯来语习语译作“履行所许的愿”
  choice: 履行所许的愿
  alternative: 偿还你的愿／还愿
  rationale: 原文强调实践向神所作的承诺。“履行”在现代汉语中清楚表达此义，同时脚注保留其较字面的说法；这属于词汇和习语处理，不额外加入特定宗派解释。
- issue: וְיִשְׁמָעֶךָּ是否应译成“他就应允你”
  choice: 他就垂听你
  alternative: 他就应允你
  rationale: 原文动词是“听”，在祷告语境中含有留意、接纳的意味，但并未明说神会按照祈求者期待的方式成就一切所求，因此不译成更强的“应允”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“祷告”“垂听”符合经文语境而不显古奥；分号体现祷告蒙垂听与履行誓愿之间的并列关系。
