base_translation:
  language: en
  yaml_path: translation/ot/job/022/017.yaml
  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: zh_hans
  text: 他们曾对上帝说：“离开我们吧！”又说：“全能者能对他们做什么呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有古译本作“对我们”。
    reason: 提示古代文本传统中的人称差异，同时保留马所拉文本“对他们”的本义与歧义。
lexical_decisions:
- source_word: סוּר מִמֶּנּוּ
  choice: 离开我们吧
  rationale: 准确表达命令式“离开”和第一人称复数“我们”，语气自然而有力。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 采用《约伯记》中此神圣称号的传统而清晰的译法。
- source_word: לָמוֹ
  choice: 对他们
  rationale: 按马所拉文本的第三人称复数形式直译，保留其与前一句“我们”之间显著的人称张力。
- source_word: יִפְעַל
  choice: 能……做什么
  rationale: 未完成式在疑问句中可表达能力或可能性；此译法符合现代汉语，同时不具体限定所做之事。
theological_decisions:
- issue: 末尾代词 לָמוֹ 的指代与人称变化
  choice: 译作“对他们”
  alternative: 译作“对我们”
  rationale: WLC 明确读作第三人称复数“他们”；虽然引语内部从“我们”转为“他们”较突兀，仍不据语境擅自改成人称，而以脚注说明异文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原文引语中的人称突变，不在正文中加以协调。
