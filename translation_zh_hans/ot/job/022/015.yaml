  text: Will you keep to the ancient path that men of wickedness have trodden?[a][b]
translation:
  language: zh_hans
  text: 你要遵循恶人所踏过的古时道路吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古时的道路”也可译作“古道”或“自古以来的道路”。希伯来文指从很久以前就有人走的路，不一定指永恒的道路。
    reason: lexical_alternative
  - marker: b
    text: “恶人”也可译作“邪恶之人”“作恶的人”或“不义之人”。原文的表达字面为“邪恶／不义之人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרַח
  choice: 道
  rationale: אֹרַח可指道路，也常比喻人生的行径；“道”在现代汉语中自然，并保留原文意象。
- source_word: עוֹלָם
  choice: 古
  rationale: 此处指久远年代以前已有的，而非神学意义上的“永恒”；“古道”简洁地表达这条路由来已久。
- source_word: תִּשְׁמֹר
  choice: 要持守……吗
  rationale: שׁמר本义为守护、遵守；以“道”为宾语时，表示坚持或遵循某种行径。“持守”既保留词义，也符合反问语气。
- source_word: אֲשֶׁר
  choice: 所
  rationale: 用“所”引出修饰“古道”的关系从句，符合现代汉语表达。
- source_word: דָּרְכוּ
  choice: 走过
  rationale: דרך表示踏行、行走；“走过”保留具体的道路意象，并表达先前的人曾循此而行。
- source_word: מְתֵי אָוֶן
  choice: 恶人
  rationale: 该短语直译为“邪恶之人”；此处“恶人”自然简明，准确传达其道德含义。
