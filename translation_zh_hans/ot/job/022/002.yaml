  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: zh_hans
  text: 人岂能对上帝有益？有悟性的人，确实使自己受益[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人岂能对上帝有用？因为有洞见的人使自己受益。”
    reason: סכן 可译为“有用”或“使……得益”，כִּי 也可理解为“因为”；此译法保留另一种词汇和句间关系。
lexical_decisions:
- source_word: הַלְאֵל
  choice: 岂能对上帝……？
  rationale: 疑问词 הֲ 与介词短语 לְאֵל 构成反问，所问的是人能否给上帝带来益处；“岂能”自然传达反问语气。
- source_word: יִסְכָּן / יִסְכֹּן
  choice: 有益 / 使……受益
  rationale: סכן 在本节指有用、带来益处。中文依两个分句的句法分别译作“有益”和“使……受益”，既保持词义呼应，也避免生硬重复。
- source_word: גָּבֶר
  choice: 人
  rationale: 此处虽为阳性单数，却泛指人类个体；现代汉语用“人”最自然，也不额外强化性别。
- source_word: כִּי
  choice: 确实
  rationale: כִּי 在第二分句中可带解释或强调作用；“确实”保留强调语气，同时不把它限定为单一的因果关系。
- source_word: עָלֵימוֹ
  choice: 自己
  rationale: 介词 עַל 加诗体代词后缀在此表示益处归于那有悟性的人；结合主语，中文自然表达为“自己”。
- source_word: מַשְׂכִּיל
  choice: 有悟性的人
  rationale: שכל 的分词指有洞察力、明智行事的人；“有悟性的人”兼顾理解力与智慧，不把词义收窄为知识或聪明。
theological_decisions:
- issue: 本节是否断言人的智慧能使上帝获益
  choice: 以反问表达否定倾向，并将有悟性所产生的益处归给人自己
  alternative: 第二分句也可较弱地理解为一般陈述：“因为有悟性的人使自己受益”，不必突出与上帝的强烈对比
  rationale: 希伯来文的平行结构把“对上帝”与“归于自己”并置。译文保留这种对比和反问力量，却不扩展为超出本节范围的系统教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“岂能”适合智慧文学中的反问；“有悟性的人”清楚易懂，并保留诗句的格言色彩。主文中的脚注标记 [a] 与脚注完全对应。
