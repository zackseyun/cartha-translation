  text: וְ/שִׁית עַל עָפָ֥ר בָּ֑צֶר וּ/בְ/צ֖וּר נְחָלִ֣ים אוֹפִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/024.yaml
  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
translation:
  language: zh_hans
  text: 将金子放在尘土上[a]，将俄斐的金子[c]放在溪谷的磐石间[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金子”也可译作“金矿石”或“贵重金属”；这个希伯来词不一定只指炼成的黄金。
    reason: lexical_alternative
  - marker: b
    text: “溪谷”所译的希伯来词常指雨季有水、旱季干涸的河谷或急流河床。
    reason: cultural_note
  - marker: c
    text: “俄斐”是以出产优质黄金闻名的地方；原文直译为“俄斐”，这里按其所指译为“俄斐的金子”。
    reason: cross_reference
lexical_decisions:
- source_word: וְשִׁית
  choice: 把……丢在
  rationale: שׁית本义为“放置、安放”。结合22:24—25舍弃属世财宝的语境，译作“丢在”能自然传达将金子弃置于尘土和石间的意象，同时不把动作夸张为毁坏。
- source_word: עַל עָפָר
  choice: 在尘土中
  rationale: עָפָר指尘土、松散泥土。עַל通常为“在……上”，这里用汉语较自然的“在尘土中”，保留金子被弃置于尘土的具体诗歌画面。
- source_word: בָּצֶר
  choice: 金子
  rationale: 该词在此可指贵金属、金矿石或金块，并与“俄斐”形成平行。“金子”清楚自然，但其更具体的词义可能性保留在脚注中。原文没有独立的第二人称物主形式，因此不增译“你的”。
- source_word: וּבְצוּר נְחָלִים
  choice: 在溪谷的石头间
  rationale: צוּר意为岩石，נְחָלִים可指溪谷、季节性河道或急流河床。“溪谷的石头间”既保留地貌意象，又符合现代汉语表达。
- source_word: אוֹפִיר
  choice: 俄斐的金子
  rationale: “俄斐”是以优质黄金闻名的地名。原文以地名借指其黄金；明示“金子”可使汉语读者理解这一省略，并保持与前半句的平行。
theological_decisions:
- issue: 本节劝告的指向
  choice: 译作把金子弃置于尘土和溪谷石间，表达放下对物质财富的倚靠。
  alternative: 把金子存放在自然形成的安全地点。
  rationale: 紧接的22:25说全能者将成为受话者的贵重金属，因而本节更可能是在劝人舍弃财富。不过译文仍维持具体意象，不额外加入“弃绝财富”等解释性神学措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两次使用“把……丢在”呈现平行结构和弃置财宝的语境含义；用“溪谷”而不用音译地理术语，使普通读者易懂，具体地貌由脚注说明。脚注标记依对应词语分别置于正文中。
