  text: וְֽ֭/אָמַרְתָּ מַה יָּ֣דַֽע אֵ֑ל הַ/בְעַ֖ד עֲרָפֶ֣ל יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/013.yaml
  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: zh_hans
  text: 你却说：“上帝知道什么？他岂能隔着幽暗的密云[b]施行审判[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他会隔着幽暗的密云施行审判吗？”希伯来语未完成式既可表示一般现在或将来，也可在这个反问句中含有能力的意味。
    reason: alternative_reading
  - marker: b
    text: “幽暗的密云”也可译作“浓重的黑暗”或“阴霾”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你却说
  rationale: 连接词与第二人称阳性单数完成式在这里引出以利法对约伯言论的指控；按上下文用现在时“说”，并以“却”自然表达转折语气。
- source_word: מַה
  choice: 什么
  rationale: 作为疑问代词，引出所引话语的内容：“上帝知道什么？”
- source_word: יָדַע
  choice: 知道
  rationale: 此处表示认知、知晓；以一般现在意义表达反问最为自然。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是对神的常用称谓，不作音译；“上帝”符合现代普通话圣经语体。
- source_word: הַבְעַד
  choice: 隔着
  rationale: 该介词表达有某物居间、形成遮隔；“隔着”既保留阻隔意象，又符合汉语表达。
- source_word: עֲרָפֶל
  choice: 幽暗的密云
  rationale: 该词可指浓密云层、深沉幽暗或阴霾；“幽暗的密云”同时保留云层与昏暗的意象。
- source_word: יִשְׁפּוֹט
  choice: 岂能……施行审判
  rationale: 未完成式处于反问句中；“岂能”自然传达对上帝是否能够隔着遮蔽物审判的质疑，“施行审判”则明确保留司法含义。
theological_decisions:
- issue: 第二问应表达能力，还是一般现在／将来的行动
  choice: 他岂能隔着幽暗的密云施行审判？
  alternative: 他会隔着幽暗的密云施行审判吗？／他隔着幽暗的密云施行审判吗？
  rationale: 上下文中，以利法所转述的是一种质疑：上帝是否因密云遮隔而不能察看并审判世事。“岂能”在现代汉语中最自然地表达这种反问力度；脚注同时保留希伯来语未完成式可作一般现在或将来理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你却说”保留直接指控的语气；引语中的两个反问简洁有力。“隔着幽暗的密云”保留原文遮隔与昏暗并存的诗性意象。
