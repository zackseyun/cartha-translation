  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: zh_hans
  text: 密云把他遮住[a]，使他看不见；他在天穹上行走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“云彩把他遮住，他也看不见；他在诸天的圆穹上行走。”
    reason: 保留 עָבִים 可作一般“云彩”、וְ 可作并列连接，以及 חוּג שָׁמַיִם 可较形式化地译为“诸天的圆穹”等词汇和句法可能。
lexical_decisions:
- source_word: עָבִים
  choice: 密云
  rationale: 该复数名词指云，也常指浓厚的雨云。译作“密云”既自然，又突出本句遮蔽视线的意象。
- source_word: סֵתֶר
  choice: 遮住
  rationale: 该名词表示遮蔽、隐蔽之物。汉语用动词性表达“把他遮住”，比直译为“是他的遮蔽物”更自然，同时保留云层形成屏障的具体意象。
- source_word: לוֹ
  choice: 把他
  rationale: 介词加第三人称阳性单数后缀表示云对“他”构成遮蔽。采用“把他遮住”的结构，以合乎现代汉语习惯，并不在正文中补出“上帝”。
- source_word: וְלֹא יִרְאֶה
  choice: 使他看不见
  rationale: 连接词可表示单纯并列，也可在语境中带结果意味。此处前句的遮蔽自然引出“看不见”的结果；脚注保留并列读法。
- source_word: חוּג
  choice: 穹苍
  rationale: 该词可指圆圈、穹顶或天际；与“天”连用时描绘天空弧形的广阔穹顶。“穹苍”在中文中庄重而易懂，又不把古代宇宙图景过度技术化。
- source_word: שָׁמַיִם
  choice: 穹苍
  rationale: “天”与 חוּג 构成整体短语“天的圆穹”。合译为“穹苍”能自然表达这一组合意象。
- source_word: יִתְהַלָּךְ
  choice: 行走
  rationale: הלך 的 Hitpael 形态表示走动、来往。译作“行走”简洁庄重，保留受述者被描绘为在高天之上活动的形象。
theological_decisions:
- issue: 说话者视角及第三人称所指
  choice: 保留“他”，把本节译作以利法所指控的恶人对上帝的看法，不在正文补出“上帝”。
  alternative: 将本节理解为对上帝超越性的中性陈述，并直接补明“上帝”。
  rationale: 紧接约伯记22:13的问题“上帝知道什么”，本节继续呈现以利法声称对方所持的观点。保留第三人称既忠于希伯来文，也维持话语层次和神学张力。
- issue: 遮蔽与看不见之间的句法关系
  choice: 译为结果关系：“使他看不见”。
  alternative: 按并列关系译为“他也看不见”。
  rationale: 希伯来语连接词 וְ 可作并列，语境也容许结果意味。正文采用自然顺畅的结果表达，脚注明确保留并列可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“密云”“穹苍”“行走”保留诗歌意象；“把他遮住”则避免生硬的名词性直译。脚注标记[a]已置于正文对应位置。
