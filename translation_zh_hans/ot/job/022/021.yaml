base_translation:
  language: en
  yaml_path: translation/ot/job/022/021.yaml
  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: zh_hans
  text: 请你与他相熟[a]，和睦相处；这样[b]，福祉就会临到你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “相熟”也可译作“与他和好”或“亲近他”。
    reason: הַסְכֶּן的词义存在争议，可强调熟悉、亲近或和谐相合。
  - marker: b
    text: 原文直译为“借着这些事”或“借着它们”；这里是复数形式，所指并不明确。
    reason: בָהֶם为复数，前文没有清楚的复数先行词；脚注保留其语法形式及指代张力。
lexical_decisions:
- source_word: הַסְכֶּן
  choice: 和好
  rationale: 该词在此表示使自己与对方相合、建立和谐关系；“和好”符合语境，也保留了劝人调整与“他”之关系的意味。词义亦可能侧重熟悉或亲近，故以脚注注明。
- source_word: וּשְׁלם
  choice: 安然相处
  rationale: 该命令式表达进入平安、和睦的状态；结合前面的“与他和好”，译为“安然相处”比单说“平安”更自然，同时避免将其仅理解为内心感受。
- source_word: טוֹבָה
  choice: 福分
  rationale: 此处形容词名词化，指将临到人的好事、益处或福祉；“福分”在现代中文中庄重自然，又不把所指限定为物质利益。
theological_decisions:
- issue: עִמּוֹ中“他”的身份
  choice: 保留代词“他”
  alternative: 明说“上帝”
  rationale: 上下文所指虽是上帝，但本节希伯来文本使用代词；保留代词尊重原文衔接，不在本节内增添明说的称谓。
- issue: בָהֶם的指代与数
  choice: 正文译作“这样”并加脚注
  alternative: 直译“借着这些事”
  rationale: 希伯来文采用复数“借着它们／这些事”，其具体指代并不完全明确。中文正文用概括性的“这样”保持自然，脚注则保存原文复数及其歧义。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语气。“请你”体现נָא缓和命令的语气；分号呈现前后两组命令与结果之间的关系。
