base_translation:
  language: en
  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: zh_hans
  text: 难道他因你敬畏他[a]而责备你[b]，并与你争讼[c]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你的敬畏”；希伯来文直译为“出于／因为你的敬畏”，敬畏的对象没有明说。
    reason: lexical_alternative
  - marker: b
    text: 或译：“责斥你”或“纠正你”；这个词在司法语境中也可含“指控你”的意思。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译：“同你进入审判。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: 难道是因为你敬畏他
  rationale: 疑问词 הֲ 与介词 מִן 表明这是带反问意味的原因问句。יִרְאָה 可指“惧怕”或“敬畏”；本句谈论约伯对上帝的态度，故译作“敬畏”，并按上下文补出宾语“他”。
- source_word: יֹכִיחֶךָ
  choice: 他才责备你
  rationale: יכח 的使役式在此兼有责备和司法指控的意味。“责备”自然清楚，也可与下半句的诉讼语境相连；“才”显明原文反问中的因果关系，并非另加时间含义。
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: 与你争讼
  rationale: 原文直译为“同你进入审判”。“与你争讼”以自然汉语保留双方进入司法争议的法律意象，也避免误译成单方面“审判你”。
- source_word: מִּשְׁפָּט
  choice: 争讼
  rationale: מִשְׁפָּט 在这里指司法审理或诉讼程序；结合 בוא עִם 的结构，译为“争讼”比抽象的“审判”更能表达对讼语气。
theological_decisions:
- issue: “你的敬畏”所指向的对象
  choice: 按上下文补明为“你敬畏他”，其中“他”指上帝
  alternative: 保留省略，只译“因为你的敬畏”
  rationale: 希伯来语名词带第二人称单数后缀，字面为“你的敬畏”，并未明说敬畏的对象；但以利法正在谈上帝如何对待约伯，现代汉语若不补对象会显得生硬含混。脚注保留原文的省略形式。
- issue: 以利法问话的语气
  choice: 译成预期否定答案的反问句，以“难道……吗”表达
  alternative: 译成语气中性的疑问句
  rationale: 疑问词和上下文显示以利法在讽刺性地否认上帝会因约伯敬畏他而责罚约伯；译文保留这一语用力量，却不进一步解释或认可以利法的判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……才……吗”自然传达反问和因果关系；“争讼”保留法律意象，又比“同你进入审判”更符合现代汉语表达。所有补明与词义幅度均以脚注交代。
