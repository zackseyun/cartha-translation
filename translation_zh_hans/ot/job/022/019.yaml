  text: יִרְא֣וּ צַדִּיקִ֣ים וְ/יִשְׂמָ֑חוּ וְ֝/נָקִ֗י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: zh_hans
  text: 义人看见就欢喜；清白的人嗤笑他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“嘲笑他们”或“讥笑他们”。
    reason: 希伯来词לעג表示带轻蔑意味的嘲弄；“嗤笑”“嘲笑”“讥笑”均可传达其语义，语气侧重略有不同。
lexical_decisions:
- source_word: יִרְאוּ
  choice: 看见
  rationale: ראה的Qal未完成式第三人称阳性复数；此处指目睹或察觉所发生的事。“看见”直接自然，也不补出原文未明说的宾语。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 复数形容词作名词用，表示在道德上正直的一类人。“义人”简洁庄重，并与下句形成平行。
- source_word: וְיִשְׂמָחוּ
  choice: 就欢喜
  rationale: שׂמח的Qal未完成式第三人称阳性复数，表示因所见之事而喜悦。用“就”自然表达前后反应关系，但不额外规定其具体原因。
- source_word: וְנָקִי
  choice: 清白的人
  rationale: 单数形容词作名词用，在此可作泛指。“清白的人”保留单数泛称的表达，也与“义人”所代表的道德类别相呼应。
- source_word: יִלְעַג
  choice: 嗤笑
  rationale: לעג的Qal未完成式第三人称阳性单数，带有轻蔑、讥诮之意。“嗤笑”比普通“发笑”更准确地传达其贬抑语气。
- source_word: לָמוֹ
  choice: 他们
  rationale: 第三人称复数代词，按上下文指前文所说遭毁灭的人；正文保留代词，不把所指对象明加进去。
theological_decisions:
- issue: 复数代词“他们”的所指
  choice: 保留“他们”，由上下文理解为前文遭审判、毁灭的恶人
  alternative: 在正文中明确译作“那些恶人”
  rationale: 上下文支持其指向恶人，但希伯来文本本节只用代词。保留代词可避免把上下文解释直接写入正文，并保存原文的衔接方式。
- issue: 义人欢喜和清白者嗤笑的对象及缘由
  choice: 不在正文补出“因他们的毁灭”或类似说明
  alternative: 明确说明义人因看见恶人受审判而欢喜
  rationale: 这种理解符合紧邻上下文，但本节本身省略了“看见”的宾语和欢喜的明确缘由，因此译文也保留这种简约与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“义人”保留圣经语体中已广泛通行的道德称谓；“清白的人”较“无辜者”更口语自然，同时不削弱其道德含义。分号体现两句平行结构。
