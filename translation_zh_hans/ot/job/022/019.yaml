  terminology: “义人”是汉语圣经中稳定且恰切的术语；“清白的人”准确表达נָקִי的无罪、无辜或清白之义，且避免把它不必要地限定为特定法律或神学意义。“嗤笑”充分表达לעג所含的讥诮和蔑视。脚注列出的替代译法有效说明词义范围。
