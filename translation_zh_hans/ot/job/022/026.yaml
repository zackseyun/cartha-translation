base_translation:
  language: en
  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: zh_hans
  text: 因为到那时，你必以全能者为乐[a]，也必向上帝仰起脸来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必以全能者为喜乐。”
    reason: lexical_alternative
  - marker: b
    text: “向上帝仰起脸来”是一种形象说法，可以表示坦然亲近上帝、重新蒙他悦纳，或放胆祈求。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: 因为那时
  rationale: כִּי承接上文，带有因果或说明意味；אָז指出在前述条件实现之后的时间与结果。合译为“因为那时”，既保留衔接，也符合现代汉语。
- source_word: עַל שַׁדַּי
  choice: 以全能者
  rationale: 介词עַל与התענג连用，表示喜乐所指向的对象；“以……为乐”是自然、庄重的汉语表达。שַׁדַּי译作“全能者”，使这一神圣称号的传统含义对普通读者清楚可见。
- source_word: תִּתְעַנָּג
  choice: 你必……为乐
  rationale: 该词为ענג的Hitpael形式，表达亲自享受、以某对象为喜乐。“以……为乐”保留其主动投入和切身喜悦的意味。
- source_word: וְתִשָּׂא
  choice: 也必……仰起
  rationale: נשׂא本义为“举起、抬起”；与“脸”搭配时保留具体动作意象。“仰起”在向着上帝的语境中比直译“举起”更符合现代汉语。
- source_word: אֶל אֱלוֹהַּ
  choice: 向上帝
  rationale: אֶל表示方向；אֱלוֹהַּ是指上帝的单数称谓，不附加原文没有的限定，因此译为“向上帝”。
- source_word: פָּנֶיךָ
  choice: 脸来
  rationale: 原文直指“你的脸”。译文保留“仰起脸来”的具体形象，而不把它缩减为单一解释，如祷告、盼望或自信。
theological_decisions:
- issue: “向上帝仰起脸来”的惯用语含义
  choice: 保留“仰起脸来”的具体意象
  alternative: 仰望上帝／坦然向上帝祷告／在上帝面前抬起头来
  rationale: 这一希伯来表达可以暗示坦然亲近、重新蒙悦纳或放胆祈求，但原文本身没有只限定其中一种。保留意象可维持其诗意和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“以……为乐”保留诗歌语体；“仰起脸来”保持希伯来原文的具体意象，并用脚注说明其多重可能含义。
