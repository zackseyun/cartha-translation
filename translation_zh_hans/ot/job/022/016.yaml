  text: who were snatched away before their time[c][b][a], whose foundation was washed away by a river.
translation:
  language: zh_hans
  text: 他们未到其时便被夺去[a]，他们的根基被河水冲走[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被夺去”也可译作“被剪除”或“枯萎”。原文动词含义较难确定，可能表示被抓住、皱缩或突然除去。
    reason: lexical_alternative
  - marker: b
    text: “被河水冲走”原文较直译可作“被河水倾倒出去”；这里的意象十分凝练，也可能表示被河水淹没或卷走。
    reason: lexical_alternative
  - marker: c
    text: 本节可能特指在洪水中灭亡的那一代人，也可能泛指恶人突然败亡。
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 他们
  rationale: 承接上文所说的恶人，引出对他们的描述；中文以“他们”自然续接上下文，无须机械译出关系词。
- source_word: קֻמְּטוּ
  choice: 被夺去
  rationale: 该被动动词含义较难确定，可指被抓住、皱缩或突然除去；“被夺去”保留突然、非正常死亡的意味，又避免把具体意象定得过死。
- source_word: וְלֹא עֵת
  choice: 未到时候
  rationale: 直译接近“并非时候”，在此表示结局过早临到；“未到时候”既简洁自然，也保留原文对时间未到的表达。
- source_word: נָהָר
  choice: 河水
  rationale: 该名词通常指河流；译作“河水”更自然地充当“冲走”的施事，同时不直接解释为洪水。
- source_word: יוּצַק
  choice: 被……冲走
  rationale: 该词本义与倾倒、浇灌有关，但“河水”与“根基”的搭配形成压缩意象；“冲走”清楚传达根基遭水毁坏，同时在脚注保留较直译的可能。
- source_word: יְסוֹדָם
  choice: 他们的根基
  rationale: 保留单数集合形式及比喻，既可指赖以立足之物，也可描绘整个根基遭毁。
theological_decisions:
- issue: 水毁意象所指的审判
  choice: 保留恶人过早灭亡、根基被水冲毁的图景，不明定是特指洪水世代还是泛指突然的审判。
  alternative: 将本节明确译成对挪亚洪水世代的历史性指涉，或纯粹解释为一般性的比喻。
  rationale: 上下文谈到古时的恶人，本节又有水毁意象，可能令人联想到洪水；但希伯来文本本身未明确限定，因此正文保留两种理解的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“未到时候就被夺去”保留原文的突发性与词义不确定性；“根基被河水冲走”使压缩的希伯来意象在中文中清晰可感，但不在正文中直接释作挪亚洪水。所有脚注标记均置于相应正文表达之后。
