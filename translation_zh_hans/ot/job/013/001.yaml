  language: zh_hans
  text: 看哪，我的眼睛见过这一切；我的耳朵听过，也明白了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “也明白了”也可译作“也辨明了”或“也思量过了”。希伯来文末句直译近于“并为她／它自己领会了”；其中代词的确切指向和用法不甚明确，整体表达所听之事也已被领会。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 作为强调性的提示语，引人注意约伯接下来的断言；“看哪”既保留指示和强调作用，也符合庄重而可懂的现代汉语。
- source_word: כֹּל
  choice: 这一切
  rationale: 原文为“全部、一切”，在上下文中概括前面所谈论的事；译作“这一切”使宾语明确，又不过度增译。
- source_word: רָאֲתָה עֵינִי
  choice: 我的眼都见过
  rationale: 保留原文以单数身体部位“我的眼”为主语的生动表达，并与下句“我的耳”形成平行；“见过”表达此前累积的亲历。
- source_word: שָׁמְעָה אָזְנִי
  choice: 我的耳都听过
  rationale: 保留单数身体部位作主语及其与“我的眼”的诗体平行；“都”自然地承接“这一切”。
- source_word: וַתָּבֶן לָהּ
  choice: 也明白了
  rationale: בין表示理解、辨明；阴性单数动词最自然地承接阴性名词“耳”。לָהּ字面近于“为她自己”，在此属表达领会所听内容的习语，因此正文采用自然汉语“也明白了”，脚注保留其他可能侧重。
