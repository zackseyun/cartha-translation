base_translation:
  language: en
  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: zh_hans
  text: 你们竟要为上帝说不义的话[a]，为他说诡诈之言吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为上帝”也可译作“替上帝”或“向上帝”；后半句的“为他”同样也可译作“替他”或“向他”。希伯来语介词可有不同理解，但上下文更倾向于指替上帝辩护。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: 为上帝
  rationale: 介词 לְ 可表示对象、利益或代表关系；结合13:8的语境，这里主要指替上帝辩护，但保留“向上帝说”的可能，因此正文采用简洁的“为上帝”。
- source_word: תְּדַבְּרוּ
  choice: 竟要……说……吗
  rationale: 未完成式用于责问，表达约伯带有震惊和谴责意味的挑战；“竟要……吗”在现代汉语中自然传达这种修辞力量。
- source_word: עַוְלָה
  choice: 不义的话
  rationale: עַוְלָה 指不义、不公或错误；“不义”保留伦理与司法分量，加“的话”使“说不义”在现代汉语中自然。
- source_word: וְלוֹ
  choice: 为他
  rationale: 代词回指上帝，并与首句“为上帝”平行；לְ 在上下文中最可能表示替他或为他辩说。
- source_word: רְמִיָּה
  choice: 诡诈之言
  rationale: רְמִיָּה 表示欺骗、诡诈；译作“诡诈之言”既保留抽象含义，也与动词“说”自然搭配，并区别于前句的“不义”。
theological_decisions:
- issue: 约伯是在指责朋友替上帝辩护时说不义的话，还是向上帝说不义的话
  choice: 正文按语境译作替上帝辩护，即“为上帝……为他……”
  alternative: 理解为“向上帝……向他……”说话
  rationale: 13:4、13:8显示朋友们仿佛站在上帝一边为他申辩，因此代表或利益义更符合近距离语境；脚注仍保留希伯来介词可能表达说话对象的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竟要……吗”传达希伯来语责问的力度；两句保持紧密平行，同时第二句不重复“说”，以符合自然汉语并呼应原文的诗体简练。
