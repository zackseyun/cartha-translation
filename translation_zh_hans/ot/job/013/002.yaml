base_translation:
  language: en
  yaml_path: translation/ot/job/013/002.yaml
  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: zh_hans
  text: 你们所知道的，我也知道；我并不比你们差。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我并不逊于你们。”
    reason: 原文动词意为“落下、低于”，在比较结构中可表达“不及、逊于”。
lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: 你们所知道的
  rationale: 介词כ与“知识”及第二人称复数词尾构成比较性的表达；译为“你们所知道的”自然承接下句“我也知道”，并保留约伯将自己的知识与朋友相比的语气。
- source_word: יָדַעְתִּי
  choice: 我也知道
  rationale: 该词虽为完成式第一人称单数，但此处表达当前持有的知识，现代汉语用“知道”最自然。
- source_word: גַם אֲנִי
  choice: 我也
  rationale: “也”准确体现约伯强调自己同样具备这些知识。
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: 我并不比你们差
  rationale: 分词נֹפֵל与介词מִן构成比较，表示不低于、不逊于对方；“并不比你们差”是自然、清楚的现代汉语，也保留较宽泛的比较含义。
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立代词带有强调作用；汉语通过“我并不”自然体现这种强调，无须另加解释。
theological_decisions: []
