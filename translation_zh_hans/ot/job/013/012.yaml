  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
translation:
  language: zh_hans
  text: 你们的格言是灰烬的箴言[a]；你们的壁垒是黏土的壁垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们所记念的，是灰烬的箴言；你们的背脊是黏土的背脊。”希伯来文十分简练，末句含义不易确定；正文按语境把重复出现的名词译为“壁垒”。
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: 你们的名言
  rationale: 该词通常与“记念、留念”有关；在这里指约伯朋友所提出、要人记住并奉为权威的言论。“名言”既保留“值得记住的话”这一关联，也符合本节对智慧言论的讽刺语境。
- source_word: מִשְׁלֵי
  choice: 箴言
  rationale: מָשָׁל可指箴言、格言、比喻或俗语。译作“箴言”保留智慧文学色彩和原文紧凑的名词性隐喻。
- source_word: אֵפֶר
  choice: 灰烬
  rationale: 该词的通常含义是“灰烬”，在此表现这些言论的空虚、脆弱和毫无价值。
- source_word: לְגַבֵּי
  choice: 是
  rationale: 诗句结构极其压缩；这里按述谓关系处理，用现代汉语系词“是”连接前后两个名词短语，同时避免扩写原文。
- source_word: חֹמֶר
  choice: 泥土
  rationale: 该词可指黏土、泥土或灰泥；“泥土”自然地表现防御工事的脆弱，也不把材质限定得过窄。
- source_word: גַּבֵּיכֶם
  choice: 你们的壁垒
  rationale: גַּב本义与“背、隆起面”有关，但本句重复使用该名词，语境上很可能指防御性的高起结构。“壁垒”保留具象的防御工事意象，同时比直译“背脊”更易懂。
