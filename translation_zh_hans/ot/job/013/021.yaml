base_translation:
  language: en
  yaml_path: translation/ot/job/013/021.yaml
  text: Withdraw your hand far from me[b][a], and do not let your dread terrify me.
translation:
  language: zh_hans
  text: 求你把你的手从我身上移开[a]，也不要让你带来的恐惧[b]惊吓我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你的手远离我。”
    reason: 保留הַרְחַק“移远、移开”的另一自然表达；正文则直接呈现מֵעָלַי“从我身上”的具体空间意象。
  - marker: b
    text: 也可理解为“对你的恐惧”；或译“你的恐怖”。
    reason: אֵמָתְךָ可指上帝所带来的恐怖或可畏威势；按属格关系也可能理解为人对上帝的畏惧。正文保留其作后面动词主语的句法关系。
lexical_decisions:
- source_word: כַּפְּךָ
  choice: 你的手
  rationale: כַּף本指手掌，也可指手；这里是上帝施压或使人受苦的具体意象。译作“手”自然，并保留拟人化表达。
- source_word: מֵעָלַי הַרְחַק
  choice: 使……远离我
  rationale: הַרְחַק是רחק的使役命令式，意为“使远离、移开”；מֵעָלַי含“从我身上”的空间意象。正文用自然汉语“使……远离我”，脚注保留“从我身上移开”的具体图像。
- source_word: אֵמָתְךָ
  choice: 你带来的恐惧
  rationale: אֵימָה表示恐惧、惊恐或令人畏惧之感，第二人称后缀表明这种恐惧与上帝相关。“你带来的恐惧”在现代汉语中自然，也不把它弱化为约伯单纯的主观害怕。
- source_word: אַל תְּבַעֲתַנִּי
  choice: 不要让……惊吓我
  rationale: אַל与未完成式构成禁止或请求；בעת表示使人惊恐、惊吓。此动词为阴性单数，与אֵמָתְךָ呼应，因此采用“不要让……惊吓我”明确保留其句法关系。
theological_decisions:
- issue: 对上帝使用“你的手”的拟人化语言
  choice: 按原文保留“你的手”
  alternative: 你的能力；你的击打
  rationale: 原文以身体意象描写上帝的行动。直译既保留诗歌力度，也不预先断定这里特指能力、惩罚还是管教。
- issue: אֵמָתְךָ所表达的恐惧归属
  choice: 译作“你带来的恐惧”
  alternative: 你的恐怖；对你的恐惧
  rationale: 第二人称后缀既可指与上帝相属、由他带来的可怕威势，也可能被理解为“对你的恐惧”。正文采用较自然且符合动词主语关系的表达，脚注保留另一种理解，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语气。“求你”使希伯来语命令式在下对上的言语关系中自然呈现；保留“手”的诗性意象，并以脚注呈现介词图像及אֵמָתְךָ的语义歧义。
