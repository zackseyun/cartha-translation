  yaml_path: translation/ot/job/013/025.yaml
  text: Will you terrify a windblown leaf[b][a], and pursue dry chaff?
translation:
  language: zh_hans
  text: 难道你要惊吓[a]被风吹散的叶子，又要追赶干枯的秸秆[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊吓”也可译作“使……惧怕”或“使……胆战”；希伯来语动词表示使人恐惧，在本语境中也可能含有严厉对待的意味。
    reason: lexical_alternative
  - marker: b
    text: “秸秆”也可译作“碎秸”或“糠秕”；希伯来语指干燥、轻薄的植物残余，在这里突出其脆弱、无足轻重。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָלֶה
  choice: 叶子
  rationale: עלה在此指单片叶子；用“叶子”自然、清楚，也保留诗句中脆弱之物的形象。
- source_word: נִדָּף
  choice: 被风吹动的
  rationale: 该词表示被吹赶、被驱散；补出语境隐含的风，译作“被风吹动的”可自然呈现叶子飘摇无力的画面。
- source_word: תַּעֲרוֹץ
  choice: 惊吓
  rationale: ערץ可表示使人惧怕、胆战；“惊吓”保留使之恐惧的核心意义，同时不把语义过度限定为口头威胁。
- source_word: וְאֶת
  choice: 又要
  rationale: וְ连接两个平行问句成分，אֶת为宾语标记，不单独翻译；“又要”使汉语的诗性平行关系清楚自然。
- source_word: קַשׁ
  choice: 碎秸
  rationale: קשׁ可指禾秆、秸秆或脱粒后轻而无用的植物残余；“碎秸”既贴近农业意象，也突出其轻弱易散。
- source_word: יָבֵשׁ
  choice: 干枯的
  rationale: יָבֵשׁ意为干燥、枯干；“干枯的”比单说“干的”更符合植物残余的诗歌语境。
- source_word: תִּרְדֹּף
  choice: 追赶
  rationale: רדף通常指追逐、追赶；“追赶”是现代汉语中自然的表达，并保留针对弱小对象采取强势行动的张力。
theological_decisions:
- issue: 反问中神与受苦者之间的力量悬殊
  choice: 保留“难道……吗”的直接反问，不解释神行动的动机
  alternative: 改写为陈述句，或说明这是约伯指控神苛待他
  rationale: 原文以两个脆弱意象向神发问，重点在强烈反问及力量悬殊；译文不应替约伯消解或强化其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“难道……又要……吗”呈现原文反问和两个分句的平行结构；“被风吹动的叶子”与“干枯的碎秸”保留两幅脆弱、无力的意象。
