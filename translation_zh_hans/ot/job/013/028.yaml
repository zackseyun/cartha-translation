  text: while he wastes away like something rotten[a], like a garment eaten by moths.
translation:
  language: zh_hans
  text: 他像腐朽之物一样渐渐衰残，像被衣蛾蛀坏的衣服一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他像腐朽本身一样渐渐衰残，像被一只衣蛾蛀坏的衣服一样。”
    reason: 保留 כְּרָקָב 可理解为抽象的“像腐朽”，并反映 עָשׁ 的单数形式。
lexical_decisions:
- source_word: וְהוּא
  choice: 他却
  rationale: 独立代词承接上下文中的受苦者；וְ 在这里宜自然地表达转折性的推进。“却”保留诗句中人的处境与前文陈述之间的张力，同时不把时间关系强加给原文。
- source_word: כְּרָקָב
  choice: 像腐烂之物
  rationale: רָקָב 指腐烂、朽坏或腐朽之物。“腐烂之物”既保留比喻的具体感，也能与后面的动词自然搭配。
- source_word: יִבְלֶה
  choice: 渐渐朽坏
  rationale: בלה 表示磨损、衰残、朽坏；未完成式可呈现持续过程。“渐渐朽坏”适合此处关于人逐步败坏的意象。
- source_word: כְּבֶגֶד
  choice: 像……衣服
  rationale: בֶּגֶד 是一般性的单数“衣服、衣裳”；“衣服”是现代普通读者最自然的表达，并保留单数意象。
- source_word: אֲכָלוֹ
  choice: 被……吃坏的
  rationale: אכל 本义为“吃、吞噬”，后缀指向衣服。汉语用“被……吃坏的”既明确受事关系，也表现衣服遭毁损的结果。
- source_word: עָשׁ
  choice: 蛀虫
  rationale: עָשׁ 指蛀蚀衣物的蛾或衣蛾。现代汉语的“蛀虫”能自然传达实际蛀食衣服的虫害意象；希伯来语为单数，但此处可作类称理解。
