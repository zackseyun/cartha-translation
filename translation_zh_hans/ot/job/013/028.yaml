  to: 他像腐朽之物一样渐渐衰残，像被衣蛾蛀坏的衣服一样。[a]
  rationale: 修订删除原文未明示的逆接“却”，并以两个“……一样”清楚呈现原文的平行比较结构。“衣蛾蛀坏”较准确地传达 עָשׁ 对衣物的蛀蚀意象；脚注保留 רָקָב 的抽象理解及 עָשׁ 单数的可能表达。
