  yaml_path: translation/ot/job/013/020.yaml
  text: 'Only do not do two things to me[a]; then I will not hide myself from your face:'
translation:
  language: zh_hans
  text: 只求你不要对我做两件事；这样，我就不从你面前躲藏：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: 只要
  rationale: 此处引出约伯提出的限制性条件；结合后面的“我就”，用“只要……就……”自然表达希伯来文所隐含的条件—结果关系。
- source_word: שְׁתַּיִם
  choice: 两件事
  rationale: 原文只有阴性数词“二”，未明说所数之物；汉语补出“件事”，使意思清楚而不增加具体内容。
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: 你不向我做
  rationale: עשה与עִם连用在这里表示对某人采取行动；下文将具体说明两件应当停止的事，因此译为“向我做”简洁自然。
- source_word: אָז
  choice: 就
  rationale: 与“只要”呼应，清楚表达约伯请求获准之后的结果。
- source_word: מִפָּנֶיךָ
  choice: 你的面
  rationale: 保留פנים“面”的具体意象，同时在“躲避你的面”这一语境中可理解为不逃避神的面前或临在。
- source_word: לֹא אֶסָּתֵר
  choice: 我就不会躲避
  rationale: סתר的Nifal在此可作反身或不及物理解，指约伯不再藏身、退避；“躲避”符合现代汉语，也与“你的面”自然搭配。
theological_decisions:
- issue: 约伯所说的“不隐藏”是身体藏匿还是不从神面前退避
  choice: 不会躲避你的面
  alternative: 不会从你面前隐藏自己
  rationale: 原文允许反身或不及物理解，核心是约伯若蒙神停止两种压迫，就愿意面对神。译文保留“面”的意象，不进一步界定其神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“只要……就……”明确呈现句法关系；保留“你的面”这一希伯来语意象。下一节将列出“两件事”，因此本节以冒号结尾。
