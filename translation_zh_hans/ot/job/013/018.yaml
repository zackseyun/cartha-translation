  yaml_path: translation/ot/job/013/018.yaml
  text: See now[a], I have prepared my case; I know that I will be vindicated.
translation:
  language: zh_hans
  text: 你看，我已经陈明了我的案件；我知道自己必被判为有理。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必称义。”这里的希伯来语动词用于司法语境，可指被判定或证实为有理。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 看哪
  rationale: 两个语气词合用，强调请对方注意眼前所说之事；“看哪”庄重而清楚，也避免把 נָא 误解为单纯表示礼貌的“请”。
- source_word: עָרַכְתִּי
  choice: 我已经陈明
  rationale: ערך 本义为安排、摆列；在诉讼语境中，指把论据或案情有条理地摆出来。“陈明”自然体现这一法律语境。
- source_word: מִשְׁפָּט
  choice: 我的案件
  rationale: 此处处于法庭意象中，指约伯要提出的诉讼或案情，而非抽象的“公义”或“审判”。原文没有显式物主词，但第一人称动词与上下文自然要求译作“我的案件”。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 完成式表达约伯已经确立、现今持有的确信；现代汉语用“我知道”最为自然。
- source_word: כִּי
  choice: （省译为宾语从句）
  rationale: כִּי 引出“知道”的内容。汉语在“我知道”之后无需另译连接词，即可清楚表达从句关系。
- source_word: אֲנִי אֶצְדָּק
  choice: 自己必被判为有理
  rationale: צדק 在此为法律语境中的未完成式，表达未来结果，即被认定站在正确的一方。“被判为有理”保留法庭色彩；“自己”体现显式代词 אֲנִי 的强调作用。
theological_decisions:
- issue: 约伯所声称的法律性裁决
  choice: 必被判为有理
  alternative: 必称义；必证明为义
  rationale: 本节延续约伯与上帝辩诉的法庭意象，重点是他确信自己的案件将获有利裁决。译文保留 צדק 的司法含义，同时避免把后期神学体系中的“称义”含义直接带入本节。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留原文的强调语气；“陈明我的案件”和“被判为有理”共同维持本节鲜明的法庭意象。
