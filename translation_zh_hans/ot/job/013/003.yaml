base_translation:
  language: en
  yaml_path: translation/ot/job/013/003.yaml
  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: zh_hans
  text: 然而，我要向全能者说话；我渴望与上帝辩论[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辩论”也可译作“申辩”或“陈述理由”。这里的希伯来语动词带有诉讼意味，可指争辩、证明或提出理由。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: 然而
  rationale: 承接上文，表达约伯转而表明自己意愿的强烈对比；“然而”自然、庄重，并保留转折力度。
- source_word: אֲנִי
  choice: 我
  rationale: 希伯来文显式使用独立代词以突出说话者；中文保留“我”，体现约伯与朋友们相对的强调。
- source_word: אֶל שַׁדַּי אֲדַבֵּר
  choice: 我要向全能者说话
  rationale: 介词 אֶל 表示话语所指向的对象；未完成体在此表达意愿和决心，译作“我要”比单纯将来时更贴合语境。שַׁדַּי 作为神的称号译为“全能者”。
- source_word: וְהוֹכֵחַ
  choice: 申辩
  rationale: יכח 的使役式在《约伯记》中常有诉讼或争辩色彩，可指辩论、证明或陈明理由。“申辩”既保留司法语感，也没有擅自补入原文未明说的“我的案件”。
- source_word: אֶל אֵל
  choice: 向上帝
  rationale: 第二个 אֶל 仍表示行动所指向的对象；אֵל 在此明确指上帝。译作“向上帝申辩”符合现代汉语，也保留与前半句“全能者”不同的神圣称谓。
- source_word: אֶחְפָּץ
  choice: 我渴望
  rationale: 该动词表达强烈的意愿或愿望；“渴望”保留其力度和庄重语气。
theological_decisions:
- issue: שַׁדַּי 与 אֵל 两个神圣称谓的处理
  choice: 分别译作“全能者”和“上帝”
  alternative: 分别音译为“沙代”和译作“上帝”，或将两者统一译为同一称谓
  rationale: 原文在平行结构中有意使用两个不同称谓。分别翻译可保留其语义和文体变化，同时不附加超出经文的神学解释。
- issue: 约伯向上帝 הוֹכֵחַ 的语气
  choice: 译作“申辩”，并以脚注保留“辩论、陈明理由”等可能性
  alternative: 译作“责备上帝”或明确补作“呈上我的案件”
  rationale: 该词具有真实的争辩和司法意味，但此处宾语或所申之事并未明说。“申辩”不把约伯的行为弱化为一般交谈，也不将其强化为明确责备上帝。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现希伯来诗句两部分之间紧密的平行关系；“向……说话／向……申辩”保留原文重复介词所形成的结构呼应。
