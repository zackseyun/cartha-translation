  text: Please hear my argument[b][a], and listen to the pleadings of my lips.
translation:
  language: zh_hans
  text: 请听我的论证[a]，留心听我嘴唇所说的辩词[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “论证”或译“申辩”“责备”；希伯来语词可指纠正、斥责，也可指有理据的陈词或论证。
    reason: lexical_alternative
  - marker: b
    text: “辩词”或译“争论”“争辩”；希伯来语表达带有言语争讼或诉讼申辩的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: 请听
  rationale: 复数祈使式 שִׁמְעוּ 是直接呼吁听众聆听；语气词 נָא 表达恳请，以现代汉语“请”自然传达。
- source_word: תוֹכַחְתִּי
  choice: 我的申辩
  rationale: 该词可指责备、辩论或论证；本段带有诉讼式语境，“申辩”既体现约伯陈明理由，也不把意义限缩为对他人的训斥。
- source_word: וְרִבוֹת
  choice: 争辩
  rationale: ריבות 可表示争端、争论或诉讼中的辩词；“争辩”保留言语交锋与司法色彩，并与前句形成近义平行。
- source_word: שְׂפָתַי
  choice: 我嘴唇的
  rationale: 按原文保留“嘴唇”的身体意象，而不直接平化为“我的话”。
- source_word: הַקְשִׁיבוּ
  choice: 侧耳听
  rationale: 该复数祈使式强调专心留意；“侧耳听”比前句的“听”更强，保留诗句递进式平行。
theological_decisions: []
