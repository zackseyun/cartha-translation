  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: zh_hans
  text: 你呼唤吧[a]，我就回答；或者让我说话，你来回应我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“你呼唤，我就回答；或者我说话，请你回答我。”
    reason: 说明原文句首连接词、两个未完成式及末尾命令式可采用更贴近形式的表达；正文则按现代汉语自然呈现双方交替发言的提议。
lexical_decisions:
- source_word: וּקְרָא
  choice: 你呼唤吧
  rationale: קרא的Qal命令式第二人称阳性单数，提出双方交锋的第一种方式。用“吧”自然表达命令兼提议的语气；句首וּ不机械译作“并且”，由汉语句序体现承接。
- source_word: וְאָנֹכִי
  choice: 我
  rationale: 独立人称代词אָנֹכִי带有一定强调。汉语以明确的主语“我”配合“你……我……”的对举来体现，不另加“我本人”，以免强调过度。
- source_word: אֶעֱנֶה
  choice: 我就回答
  rationale: ענה的Qal未完成式第一人称单数，在这里表示相应行动：“你若呼唤，我就回答。”“就”使双方应答的条件与次序在现代汉语中自然清楚。
- source_word: אוֹ
  choice: 或者
  rationale: 保留原文的选择关系，引出双方调换说话与应答角色的第二种安排。
- source_word: אֲדַבֵּר
  choice: 让我说话
  rationale: דבר的Piel未完成式第一人称单数，在平行结构中具有提议意味。译作“让我说话”符合现代汉语，也保留约伯请求由自己先发言的语气。
- source_word: וַהֲשִׁיבֵנִי
  choice: 你来回应我
  rationale: שוב的Hiphil命令式第二人称阳性单数，带第一人称单数宾语后缀，在此意为“回答我”。选“回应我”既准确表达互答，也与前面的ענה“回答”略作词汇区分。
