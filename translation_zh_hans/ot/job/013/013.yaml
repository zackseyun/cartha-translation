  yaml_path: translation/ot/job/013/013.yaml
  text: Be silent before me[a], and let me speak; then let come upon me what may.
translation:
  language: zh_hans
  text: 你们不要出声[a]，让我说话；无论什么临到我，就让它临到吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“你们要从我而静默，我要说话；愿什么从我身上越过。”原文“从我而静默”的关系表达较难确定，可指不要向我出声或在我面前静默。
    reason: 保留מִמֶּנִּי（“从我”）的字面表达及其关系上的歧义，并准确呈现עבר与עָלַי（“从我身上越过”）的空间性意象。
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: 不要再……说话
  rationale: 该词是 חרשׁ 的使役式复数命令形，在这里表示静默、不再说话。结合 מִמֶּנִּי 译为“不要再对我说话”，比生硬的“向我沉默”更符合现代汉语，同时保留命令语气。
- source_word: מִמֶּנִּי
  choice: 对我
  rationale: 字面为“从我”，但与“静默”连用时表达停止针对约伯说话。译作“对我”传达其关系指向；另在脚注保留字面形式。
- source_word: וַאֲדַבְּרָה אָנִי
  choice: 让我自己说
  rationale: 动词为第一人称意愿式，独立代词 אָנִי 带有强调。“让我自己说”既表达意愿，也体现“我”的强调。
- source_word: וְיַעֲבֹר עָלַי
  choice: 临到我，就让它临到吧
  rationale: עבר 的基本义为“经过、越过”，与 עַל 连用可指某事落到或临到某人。中文以“临到”自然表达该含义，后半句的“让……吧”保留许可或听任语气。
- source_word: מָה
  choice: 无论什么
  rationale: 这里的疑问代词具有不定含义，指“无论什么事”。此译保留约伯不限定后果、任其发生的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要再对我说话”比“在我面前静默”更自然，并在脚注中保留原文较生硬的字面结构；“让我自己说”体现独立代词的强调；末句用重复结构传达约伯听任后果临到的决绝语气。
