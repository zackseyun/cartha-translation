base_translation:
  language: en
  yaml_path: translation/ot/job/013/005.yaml
  text: If only you would keep completely silent[a], and it would count as wisdom for you.
translation:
  language: zh_hans
  text: 但愿你们全然缄默；这就算是你们的智慧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但愿你们彻底沉默，那便是你们的智慧。”
    reason: 措辞替代；希伯来文的强调结构和系词表达在汉语中可有不同的自然呈现。
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: 但愿
  rationale: 这是表达强烈愿望的惯用语，并非字面上的疑问“谁能给”。“但愿”自然、庄重，也保留祈愿语气。
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: 全然缄默
  rationale: 同源不定式绝对式与限定动词连用，强化“沉默”的动作。“全然缄默”既体现强调，又符合本节尖锐而庄重的语气。
- source_word: וּתְהִי
  choice: 这就算是
  rationale: 阴性单数动词可回指前述“缄默”这一行为或情形。“这就算是”以自然汉语表达其结果与评价意味，同时避免过度确定其语法主语。
- source_word: לָכֶם
  choice: 你们的
  rationale: 介词 לָ 表示与受事者相关的归属或益处；在“算是……智慧”的结构中译作“你们的”最自然。
- source_word: לְחָכְמָה
  choice: 智慧
  rationale: 保留 חָכְמָה 的基本义“智慧”；与“算是”搭配，传达这种沉默对他们而言可被视为智慧。
theological_decisions: []
