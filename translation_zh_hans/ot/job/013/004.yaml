base_translation:
  language: en
  yaml_path: translation/ot/job/013/004.yaml
  text: But you are plasterers of lies[b][a]; all of you are worthless physicians.
translation:
  language: zh_hans
  text: 但你们是以虚谎粉饰的人[a]；你们全都是毫无价值的医者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“涂抹虚谎的人”或“捏造谎言的人”。原文动词可指涂抹、敷盖；在这里可能借此比喻以虚谎遮盖实情。
    reason: lexical_alternative
  - marker: b
    text: 或译“无用的医者”或“毫无价值的医生”。原文形容他们是无用的医者；该名词在别处也可指“偶像”，因此有人译作“偶像的医者”，但此处较不可能。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: 但
  rationale: 作为转折语，承接上文并引出约伯对朋友的尖锐反驳；“但”自然简洁。
- source_word: אַתֶּם
  choice: 你们
  rationale: 明确保留第二人称复数，指约伯的朋友们。
- source_word: טֹפְלֵי
  choice: 涂抹的人
  rationale: 保留 טפל 所含涂抹、敷盖的具体意象；在本句中比直接译作“捏造者”更能保留原文隐喻。
- source_word: שָׁקֶר
  choice: 谎言
  rationale: 可作集合意义，表示他们所涂抹、用来遮盖实情的虚假言辞。
- source_word: רֹפְאֵי
  choice: 医治者
  rationale: 保留分词名词的施行医治者意象，也适合约伯讽刺朋友无力医治其困境的语境。
- source_word: אֱלִל
  choice: 无用的
  rationale: 此处最自然表示毫无价值、毫无效用；与“医治者”搭配，突出他们不能带来医治。
- source_word: כֻּלְּכֶם
  choice: 全都是
  rationale: 保留句末对所有听者的概括和强调，并使现代汉语表达流畅。
