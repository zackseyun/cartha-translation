  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: zh_hans
  text: 你们要偏袒上帝吗？[a]要为上帝争辩吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“抬起他的脸”；这是希伯来语惯用语，意思是偏袒或徇私。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“要替上帝申辩吗？”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: 你们要偏袒他吗
  rationale: 希伯来语字面为“抬起他的脸”，是表示徇私、偏袒的惯用语。此处处于辩论语境，“偏袒他”自然传达其伦理和司法意味，并保留第三人称所指。
- source_word: אִם
  choice: 以第二个问句表达
  rationale: 这里引出与前句平行的第二个反问。现代汉语无需机械译成“或是”或“如果”，用两个连续问句更自然，也保留原文的修辞力量。
- source_word: לָאֵל
  choice: 为上帝
  rationale: אֵל在此明确指上帝；介词ל在争讼语境中可表示为某一方、代表某一方。“为上帝”简洁且不排除“替上帝申辩”的含义。
- source_word: תְּרִיבוּן
  choice: 争辩
  rationale: ריב常用于争讼或辩论，既可指争论，也带有法律争辩色彩。“争辩”避免把场景过度限定为正式法庭诉讼。
theological_decisions:
- issue: 约伯是否指责朋友带着偏见替上帝辩护
  choice: 译作两个反问：“偏袒他”与“为上帝争辩”
  alternative: 第一句可直译为“抬起他的脸”，第二句也可译为“替上帝申辩”
  rationale: 上下文显示约伯责备朋友在维护上帝时言语不实；本译文呈现这种带有偏袒意味的辩护，同时不把“争辩”窄化为特定的法律程序，也不加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“偏袒”准确传达原文惯用语；两个简洁反问保留约伯质问朋友的力度。脚注标记均置于正文相应经文之后。
