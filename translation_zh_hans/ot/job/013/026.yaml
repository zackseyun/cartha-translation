base_translation:
  language: en
  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: zh_hans
  text: 因为你写下苦涩的事来针对我[a]，又使我承受我年轻时的罪孽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你针对我写下苦涩的事。”希伯来文直译为“你写下苦涩的事攻击（或：针对）我”；“写下”也可在语境中带有颁布或记录的意味。
    reason: lexical_alternative
  - marker: b
    text: “使我承受”直译为“使我继承”。“罪孽”一词也可指罪责，或罪所带来的惩罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接前文，说明约伯为何感到自己被上帝当作仇敌；“因为”自然表达此处的理由关系。
- source_word: תִכְתֹּב עָלַי
  choice: 你写下……来指控我
  rationale: 保留כתב“写”的具体意象；עַל在此带有针对、敌对意味。“来指控我”使现代读者自然理解司法语境，同时脚注保留“写下针对我的……”这一较直译的可能。
- source_word: מְרֹרוֹת
  choice: 苦涩的事
  rationale: 原词是复数，泛指令人痛苦、严厉的事项；不限定为控罪、判决或苦难，从而保留原文的开放性。
- source_word: וְתוֹרִישֵׁנִי
  choice: 又使我承受
  rationale: 该动词使役式直译为“使我承受为产业/使我继承”。中文若说“使我继承罪孽”容易误解为从祖先承袭，因此正文用“承受”，脚注说明原有的继承意象。
- source_word: עֲוֺנוֹת
  choice: 罪孽
  rationale: עָוֹן可指罪行、罪责或罪所带来的惩罚。“罪孽”保留道德过犯这一核心，同时不完全排除罪责和后果。
- source_word: נְעוּרָי
  choice: 我年轻时的
  rationale: 自然表达“我的青年时期所犯/所有”的属格关系，指约伯年轻岁月中的罪孽。
theological_decisions:
- issue: עֲוֺנוֹת在本节中指罪行、罪责还是惩罚
  choice: 正文译作“罪孽”，让语境同时容纳年轻时的过犯及其如今被追究的罪责或后果
  alternative: “我年轻时的罪责”或“我年轻时犯罪所受的惩罚”
  rationale: 希伯来词义范围涵盖罪行、罪责及罪的后果；原文没有要求只选其中之一，因此不把约伯的陈述收窄为单纯受罚。
- issue: תוֹרִישֵׁנִי的产业/继承意象
  choice: 正文译作“使我承受”，脚注交代字面意象
  alternative: “使我继承”或“使我得着为产业”
  rationale: 保留约伯被迫承担早年罪孽的张力，同时避免现代中文把“继承罪孽”误读为祖传之罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“苦涩的事”刻意保持概括性，不擅自确定为控罪、判决或苦难；“承受”比“继承罪孽”更符合现代汉语，但以脚注保留希伯来文的产业意象。所有脚注标记均置于正文相应位置。
