  text: וְ/תָ֘שֵׂ֤ם בַּ/סַּ֨ד רַגְלַ֗/י וְ/תִשְׁמ֥וֹר כָּל אָרְחוֹתָ֑/י עַל שָׁרְשֵׁ֥י רַ֝גְלַ֗/י תִּתְחַקֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/027.yaml
  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: zh_hans
  text: 你把我的脚放在足枷中，监视我一切的路径；你在我的脚掌上作记号。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你在我脚掌周围划定界限。”原文动词可指刻写、描画或划定；“脚的根部”在这里通常理解为脚掌或脚底。
    reason: 原文末句的动词和图像有解释上的余地；正文保留“在脚掌上”的直接表达，脚注说明“划界”的另一种可行理解。
lexical_decisions:
- source_word: בַּסַּד
  choice: 锁在足枷中
  rationale: סַד指限制双脚活动的刑具。“足枷”保留具体的拘束意象；加上“锁在……中”使现代汉语自然清楚，又不把刑具过度具体化为脚镣。
- source_word: וְתָשֵׂם
  choice: 你把……锁在
  rationale: שׂים基本义为“放、置于”。结合足枷语境，译作“把……锁在”符合现代汉语表达，并准确传达把脚置于刑具中的动作。
- source_word: וְתִשְׁמוֹר
  choice: 监视
  rationale: שׁמר可指看守、留意或守护；本节语境带有严密限制和敌意审察的意味，因此“监视”比“看守”更能表达约伯所感受到的持续监察。
- source_word: כָּל אָרְחוֹתָי
  choice: 我一切的路径
  rationale: אֹרַח可指道路、行径或人生道路。“路径”保留脚与行走的具体意象，同时容纳对全部行为和生活历程的引申意义。
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: 在我的脚掌周围
  rationale: שֹׁרֶשׁ通常意为“根”，此处“脚的根部”按惯用理解指脚底或脚掌。介词עַל与下一个动词结合，可形成在脚掌上刻画或在其周围划界的图像；正文采用“周围”以配合限制行动的上下文。
- source_word: תִּתְחַקֶּה
  choice: 划下界线
  rationale: חקה的这一词形可表达刻画、描摹或划定界限。正文“划下界线”与足枷和监视的拘禁意象相连，但以脚注保留“刻下记号”的可能理解。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“足枷”保留古代拘束双脚的具体刑具意象；“监视”与“划下界线”共同呈现约伯所控诉的严密监察和行动受限。
