base_translation:
  language: en
  yaml_path: translation/ot/job/013/011.yaml
  text: Will not his majesty terrify you[b][a], and his dread fall upon you?
translation:
  language: zh_hans
  text: 他的威严岂不使你们惊惧，[a]他所带来的恐惧岂不临到你们吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “威严”也可译作“崇高”或“尊荣”；希伯来语原词可表示高举、尊贵或崇高的地位。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“对他的畏惧”。希伯来语此处的表达可指他所激起的恐惧。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂不……吗
  rationale: 引出预期肯定回答的反问；中文以“岂不”并在句末用“吗”自然保留反问语气。
- source_word: שְׂאֵתוֹ
  choice: 他的威严
  rationale: 该名词可指高举、尊贵或崇高地位；在本节与“可畏”平行，译为“威严”既贴合语境，也符合现代汉语的庄重表达。
- source_word: תְּבַעֵת
  choice: 使你们惊惧
  rationale: בעת的加强词干表示使人陷入强烈恐惧；“使……惊惧”保留使役意义和原文力度。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 第二人称阳性复数直接宾语；译为“你们”。
- source_word: וּפַחְדּוֹ
  choice: 他的可畏
  rationale: פחד可表示恐惧、畏惧或令人恐惧之感；“他的可畏”保留属格结构及其主客观歧义，即既可关联他所激起的畏惧，也不把含义限定为人的心理感受。
- source_word: יִפֹּל עֲלֵיכֶם
  choice: 临到你们
  rationale: 原文直译为“落在你们身上”，表达某种压倒性的事物突然降临；“临到”在现代庄重汉语中自然，同时保留降临于人的动态意象。
theological_decisions:
- issue: וּפַחְדּוֹ中属格的含义
  choice: 译作“他的可畏”，不明确限定为“你们对他的畏惧”或“他自己的恐惧”。
  alternative: “对他的畏惧”或“他所带来的恐惧”
  rationale: 希伯来语属格可理解为他所激起的畏惧；正文保留这种语义张力，脚注说明较明确的可能理解，避免添加原文未明说的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岂不……吗”传达反问；两分句保持平行结构。正文中的脚注标记均紧随相关词句。
