  text: 谁能与我争辩呢？若是这样[a]，我就会默不作声而死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为现在，我就会默不作声而死。”希伯来语עַתָּה通常意为“现在”；但此处许多人按约伯论证中的条件—结果关系理解为“那么”或“若是这样”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: 谁
  rationale: 疑问词加独立代词带有强调作用；现代汉语用“谁”配合反问语气即可自然传达这种强调，不必生硬译为“谁是他”。
- source_word: יָרִיב
  choice: 争辩
  rationale: ריב在此带有争讼、对质的意味；“争辩”既保留对抗性和准法律语境，又不过度限定为正式诉讼。
- source_word: עִמָּדִי
  choice: 与我
  rationale: 该介词与ריב连用表示同某人进行对抗性的争辩；“与我”直接对应原文，而敌对意味由“争辩”表达。
- source_word: כִּי עַתָּה
  choice: 若有，我就
  rationale: 原文字面常可理解为“因为现在”，但在约伯挑战对手的论证中，也可表达随前问而来的条件—结果关系。正文采用自然汉语“若有，我就”，并以脚注保留“现在”的词汇可能性。
- source_word: אַחֲרִישׁ
  choice: 默不作声
  rationale: 该词在这里表示保持沉默；“默不作声”符合现代汉语表达，也保留约伯不再申辩之意。
- source_word: וְאֶגְוָע
  choice: 死去也罢
  rationale: גוע表示断气、死亡；结合上下文，“死去也罢”自然传达约伯愿承担沉默至死后果的强烈语气，同时没有淡化“死”的直白含义。
