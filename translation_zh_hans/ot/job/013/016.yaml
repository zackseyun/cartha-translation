  text: גַּם הוּא לִ֥/י לִֽ/ישׁוּעָ֑ה כִּי לֹ֥א לְ֝/פָנָ֗י/ו חָנֵ֥ף יָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/016.yaml
  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: zh_hans
  text: 这也会成为我的救恩[a]，因为不敬虔的人[b]不能来到他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救恩”也可译作“拯救”、“解救”或“昭雪”。
    reason: lexical_alternative
  - marker: b
    text: “不敬虔的人”也可译作“亵慢的人”或“不虔诚的人”；希伯来语所指的是在上帝面前不敬畏的人，并非仅仅指言行不一的“伪君子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: 这也
  rationale: גַּם保留递进、附加的语气；הוּא在此自然地回指约伯刚才所说的情形或行动，译作“这”比直译“他”更符合现代汉语。
- source_word: לִי לִישׁוּעָה
  choice: 会成为我的救恩
  rationale: 介词结构表达“对我成为救恩”的意思；原文没有明说系词和时态，结合语境用“会成为”自然表达预期结果，同时以“救恩”保留该词兼具拯救、解救和昭雪的庄重含义。
- source_word: כִּי
  choice: 因为
  rationale: 引出前一句的根据，清楚保留原文的解释关系。
- source_word: חָנֵף
  choice: 不敬虔的人
  rationale: 该词主要指在上帝面前亵慢、邪恶或不虔敬的人，并非仅指言行不一的“伪君子”；此译较准确地保留其宗教和道德意味。
- source_word: לְפָנָיו
  choice: 来到他面前
  rationale: 这是表示进入某者面前或临到其所在之处的惯用语；“他”保留原文代词，语境自然指向上帝。
- source_word: יָבוֹא
  choice: 不能来到
  rationale: 此处表达不敬虔者不能或不得到上帝面前；“不能来到”在现代汉语中自然，也保留可能性或获准接近的语气。
theological_decisions:
- issue: לְפָנָיו中代词所指
  choice: 正文保留“他”，按语境理解为上帝
  alternative: 明确译作“上帝面前”，或泛指约伯将要面对的那一位
  rationale: 上下文谈到约伯在上帝面前陈明案件并得蒙拯救，代词最自然地指上帝；正文仍保留原文的代词形式，避免不必要的增补。
- issue: יְשׁוּעָה在约伯宣告中的含义
  choice: 救恩，涵盖解救和昭雪
  alternative: 拯救、解救、昭雪
  rationale: 该词可泛指脱离危难或获得有利结局；在约伯为自己申辩的语境中带有得到昭雪的意味，但原文并未把这一层单独明说，因此正文采用较宽广的“救恩”，并在脚注中列出可能译法。
- issue: 不敬虔者不能来到上帝面前的语气
  choice: 表达不能或不得进入其面前
  alternative: 陈述不敬虔者将不会来到他面前
  rationale: יָבוֹא本身可作一般性或将来性陈述；结合论证逻辑，译作“不能”较能体现不敬虔者无法以约伯所采取的方式来到上帝面前，却不进一步界定这是绝对能力、许可还是审判结局。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这也会成为”使原文省略系词的名词句在汉语中通顺；“救恩”保留传统而宽广的神学语感，脚注说明其在本节可能具有解救和昭雪的法庭性意味。所有脚注标记均紧随相关词语。
