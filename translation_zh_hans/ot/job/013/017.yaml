  text: Listen carefully to my word[a], and let my declaration be in your ears.
translation:
  language: zh_hans
  text: 你们要仔细听我的话，也要留心听我的申明。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “申明”或译“言说”，也可理解为“解释”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: 要仔细听
  rationale: 动词命令式与同词根绝对不定式连用，加强“听”的语气。译作“要仔细听”既传达强调，也符合现代汉语表达。
- source_word: מִלָּתִי
  choice: 我的话
  rationale: מִלָּה 可指“话、言语”。“我的话”简洁自然，并保留原文单数形式及约伯郑重申诉的语气。
- source_word: וַאֲחֲוָתִי
  choice: 我的陈述
  rationale: 此词在这里指约伯所陈明、说出的话。“陈述”保留正式而审慎的意味，又不把含义限定为“解释”。
- source_word: בְּאָזְנֵיכֶם
  choice: 进入你们耳中
  rationale: 原文直译为“在你们耳中”。“进入你们耳中”保留耳朵这一具体意象，在现代汉语中也较为自然，并表达要对方亲耳留心听取。
theological_decisions: []
