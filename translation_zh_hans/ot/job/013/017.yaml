  source_fidelity: 首句“你们要仔细听我的话”准确传达了שִׁמְעוּ שָׁמוֹעַ的强调命令和“我的话”。后半句原文为与前一命令并列、动词省略的表达，意为要听取约伯的申明；“让我的陈述进入你们耳中”虽试图保留字面意象，却将“陈述”处理成主动“进入”的事物，不合汉语，也稍模糊了再次吩咐听取的语气。
