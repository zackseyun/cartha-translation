  text: Why should I take my flesh in my teeth and put my life in my hand?[a][b]
translation:
  language: zh_hans
  text: 我为什么将自己的肉衔在牙齿间，把自己的性命置于手中呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我为什么用牙齿衔着自己的肉？”希伯来语这一表达是难解的习语，含有不顾危险、拿自身冒险的意思。
    reason: lexical_alternative
  - marker: b
    text: “性命”也可译作“灵魂”或“自己”。希伯来语“尼非施”可有这些含义；这里的语境侧重冒着失去生命的危险。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: 何必
  rationale: 这里引出询问动机或目的的反问；“何必”比生硬的“为了什么”更符合现代汉语，也保留反问语气。
- source_word: אֶשָּׂא
  choice: 叼
  rationale: נשא本义为“拿、提、带”；与“肉”和“牙齿间”连用时，“叼”能自然呈现用牙齿衔住的具体图景，但不试图消除原文习语的难解性。
- source_word: בְשָׂרִי
  choice: 自己的肉
  rationale: 保留בשר“肉”的具体意象，不改写为较抽象的“身体”。
- source_word: בְשִׁנָּי
  choice: 在牙齿间
  rationale: 介词ב可理解为“在……中”或“用”；正文采用自然的空间表达，同时以脚注保留“用牙齿”的可能译法。
- source_word: וְנַפְשִׁי
  choice: 自己的性命
  rationale: נפש可指“生命、性命、自己、灵魂”；此处与把它放在手中这一冒险意象相连，“性命”最贴合上下文。
- source_word: אָשִׂים
  choice: 放
  rationale: שׂים常指“放、安置”；“放”在现代汉语中简洁自然。
- source_word: בְכַפִּי
  choice: 在手中
  rationale: כף可指“手掌、手”；“在手中”既保留比喻，也符合汉语表达，传达让性命暴露于危险之意。
