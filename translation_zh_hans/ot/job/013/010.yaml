  yaml_path: translation/ot/job/013/010.yaml
  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: zh_hans
  text: 如果你们暗中偏袒人，他必定会责备你们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面意思是“抬起脸面”；这是希伯来语惯用语，指偏袒或徇私。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: 必严厉责备
  rationale: 不定式绝对式与同根限定动词连用，加强“责备、斥责”的语气；“必”体现确定和强调，“严厉责备”符合约伯警告朋友将受上帝申斥的语境。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 第二人称阳性复数宾语，指约伯的朋友们；汉语用“你们”明确保留复数。
- source_word: אִם
  choice: 如果
  rationale: 保留条件结构，不把朋友的行为表述为已经确定发生的事实。
- source_word: בַּסֵּתֶר
  choice: 暗中
  rationale: 表达隐藏、不公开的行为方式；“暗中”在现代汉语中自然凝练。
- source_word: פָּנִים תִּשָּׂאוּן
  choice: 你们……徇私
  rationale: 这是希伯来语惯用语，字面为“抬起脸面”，在此表示偏袒、以情面待人；“徇私”简洁保留其伦理和裁断语境中的偏私意味。
theological_decisions:
- issue: נשׂא פנים 这一惯用语的译法
  choice: 徇私
  alternative: 偏袒；看人的情面
  rationale: 上下文指约伯的朋友为了替上帝辩护而不能公正判断。“徇私”传达偏私之意，却不额外断定其具体动机；脚注保留字面意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“必严厉责备”传达原文同根词叠用的强调；句序按自然汉语调整，将条件从句置前。
