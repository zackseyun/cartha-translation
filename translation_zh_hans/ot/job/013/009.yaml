  yaml_path: translation/ot/job/013/009.yaml
  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: zh_hans
  text: 他查究你们时，对你们有益吗？难道你们会像愚弄凡人[b]那样愚弄他[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愚弄”也可译作“戏弄”或“欺骗”；这个希伯来语动词可表示嘲弄、欺骗或拿人取乐。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“人”，这里指必死的凡人，与上帝形成对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: 结果会好吗
  rationale: 疑问词与“好”构成修辞问句；结合下文上帝将要鉴察他们的语境，用“结果会好吗”自然表达前瞻性的警告，同时不明说具体后果。
- source_word: כִּי
  choice: 时
  rationale: 这里引出作出判断时的情形，按时间意义译为“……时”最符合上下文。
- source_word: יַחְקֹר
  choice: 查究
  rationale: חקר表示深入搜查、考察或审查；“查究”既体现彻底鉴察，也适合庄重的现代汉语。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 直宾标记带第二人称阳性复数后缀，译为复数“你们”。
- source_word: אִם
  choice: 难道
  rationale: 此处引出并列的第二个修辞问句；汉语用“难道”能自然表达质问语气，其中与前句的转折并列关系由句序体现。
- source_word: כְהָתֵל
  choice: 像愚弄……那样
  rationale: התל可指嘲弄、欺骗或把对方当作玩物；“愚弄”兼有欺骗和轻慢之意，适合此处将对待上帝与对待人相比较的语境。
- source_word: בֶּאֱנוֹשׁ
  choice: 凡人
  rationale: אֱנוֹשׁ指人，并常含脆弱、必死之人的意味；“凡人”简洁自然，也保留人与上帝之间的对比。
- source_word: תְּהָתֵלּוּ בוֹ
  choice: 你们能……愚弄他吗
  rationale: 动词为第二人称阳性复数，介词短语指向第三人称单数对象；“愚弄他”保留其欺骗、戏弄和轻慢的语义范围核心。“能”使汉语修辞问句自然，并表达这种企图不可能得逞。
theological_decisions:
- issue: 第三人称单数代词所指
  choice: “他”指上帝，但正文仍保留代词形式
  alternative: 指某个未明确说明的审查者或审判者
  rationale: 约伯记13:7—11的近距离语境是约伯责问朋友为上帝说不义的话，并警告他们将受上帝鉴察。保留“他”既符合原文形式，也不在本节中额外补入“上帝”一词。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他查究你们时，结果会好吗”保留原文简短修辞问句的警告意味；第二句用“难道……吗”再现强烈质问。脚注标记均置于正文相应词语之后。
