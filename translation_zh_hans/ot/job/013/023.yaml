base_translation:
  language: en
  yaml_path: translation/ot/job/013/023.yaml
  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
translation:
  language: zh_hans
  text: 我的罪孽和罪过有多少？求你让我知道我的过犯和罪。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的罪孽和罪过有多严重？”希伯来语疑问词既可询问数量，也可询问程度；正文采用较直接的数量义。
    reason: lexical_alternative
  - marker: b
    text: “过犯”所译的希伯来语也可含“悖逆”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: 我的……有多少
  rationale: 这一问法可询问数量或程度；结合后面的两个复数名词，正文采用较直接的数量义，同时保留自然的现代汉语语序。
- source_word: עֲוֺנוֹת
  choice: 罪孽
  rationale: עָוֹן带有道德罪责和邪恶行为的分量；“罪孽”既庄重又能与后面的“罪过”有所区分。
- source_word: וְחַטָּאוֹת
  choice: 罪过
  rationale: חַטָּאת在此为复数，泛指所犯的罪；译作“罪过”自然清楚，并避免与前面的“罪孽”完全重复。
- source_word: פִּשְׁעִי
  choice: 我的过犯
  rationale: פֶּשַׁע指越界、违犯，也可能含悖逆意味；“过犯”保留其较重的故意违犯色彩，却不把“悖逆”这一语义强度直接定死。
- source_word: וְחַטָּאתִי
  choice: 我的罪
  rationale: 单数חַטָּאת加第一人称单数词尾，直译为“我的罪”，并与“我的过犯”形成原文中的并列。
- source_word: הֹדִיעֵנִי
  choice: 求你让我知道
  rationale: ידע的使役式表示“使……知道、告知”；“让我知道”自然表达使役含义，加入“求你”体现语境中面向上帝的请求语气，而不改变命令式形式的功能。
theological_decisions:
- issue: 约伯的问题是否承认自己已有许多罪
  choice: 保留为向上帝提出的质问和请求，不增添认罪或无罪宣告
  alternative: 解释成约伯承认罪多，或断言自己完全无罪
  rationale: 希伯来文本只问罪孽、罪过有多少，并请求上帝指出具体过犯；其修辞张力不应被单向化解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“罪孽—罪过—过犯—罪”尽量呈现原文相关但不完全相同的罪恶词汇；问句保持简洁直接，后句保留约伯向上帝请求明确指认其罪的力度。
