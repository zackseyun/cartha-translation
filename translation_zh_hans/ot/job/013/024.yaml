base_translation:
  language: en
  yaml_path: translation/ot/job/013/024.yaml
  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: zh_hans
  text: 你为什么向我掩面，把我算作你的仇敌？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把我看作与你为敌的人？”
    reason: לְאוֹיֵב לָךְ可较展开地译为“与你为敌的人”；正文“你的仇敌”则以自然汉语保留同一关系。
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接表达询问原因，在现代汉语中自然准确。
- source_word: פָנֶיךָ תַסְתִּיר
  choice: 掩面不顾我
  rationale: 保留“面”的具体意象，并以“不顾我”传达希伯来语“隐藏你的面”所含的关系意味；这样比单说“隐藏你的脸”更符合现代汉语习惯。
- source_word: וְתַחְשְׁבֵנִי
  choice: 把我算作
  rationale: חשב在此指视为、算为；“算作”既贴近原文的认定意味，也能自然连接后面的身份补语。
- source_word: לְאוֹיֵב לָךְ
  choice: 你的仇敌
  rationale: לְאוֹיֵב是谓语性补语，לָךְ表示与“你”的关系；合译为“你的仇敌”简洁自然。
theological_decisions:
- issue: 上帝“掩面”的拟人表达
  choice: 掩面不顾我
  alternative: 向我隐藏你的面；收回你的同在；转脸不看我
  rationale: 保留原文“面”的诗性和神学意象，同时用“不顾我”使现代读者明白这是指关系上的疏离或不施眷顾，而不把含义限定为某一种系统神学解释。
- issue: 约伯被视为上帝的仇敌
  choice: 把我算作你的仇敌
  alternative: 把我看作与你为敌的人
  rationale: 原文表达约伯的质问，并不宣告他实际上是上帝的仇敌；“算作”保留这种认定与现实身份之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的质问语气。“掩面不顾我”延续圣经诗歌的具体意象，又避免生硬的“隐藏你的脸”；“算作”体现司法或认定色彩，但不显得过分文言。
