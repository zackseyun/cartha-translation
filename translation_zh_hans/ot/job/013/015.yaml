  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: zh_hans
  text: 即使他杀我[a]，我也不盼望；但我要在他面前为自己的行为申辩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译法作：“即使他杀我，我仍要仰望他。”这反映了希伯来文本的另一种读法。
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: 即使
  rationale: 此处结合后面的分句表达让步关系；“即使”在现代汉语中自然地传达约伯面对死亡仍要申辩的语气。
- source_word: יִקְטְלֵנִי
  choice: 他杀我
  rationale: קטל意为“杀死”；“杀我”准确、简洁，并保留原话沉重直接的语气。
- source_word: לֹא אֲיַחֵל
  choice: 我也不再盼望
  rationale: 按所给马所拉文本的辅音לֹא译为否定；יחל可指等候或盼望，此处采用“盼望”，同时不补出原文未明说的盼望对象。
- source_word: אַךְ
  choice: 但
  rationale: 在此标示转折，承接前句的死亡与绝望，转入约伯仍要申辩的决心。
- source_word: דְּרָכַי
  choice: 自己的行为
  rationale: 字面为“我的道路”，在此指约伯的行事和生活表现；“自己的行为”更符合现代汉语的司法性申辩语境。
- source_word: אֶל־פָּנָיו
  choice: 在他面前
  rationale: 保留“到他面前／在他面前”的直接临在含义，并符合汉语习惯。
- source_word: אוֹכִיחַ
  choice: 为……申辩
  rationale: יכח的使役形在本段争辩、诉讼语境中表示陈述或辩明案件；“申辩”能体现约伯准备当面为自己辩护。
theological_decisions:
- issue: לֹא אֲיַחֵל应按“我不盼望”还是传统的“我仍要仰望他”理解
  choice: 正文按马所拉文本所写的לֹא（不）译为“我也不再盼望”
  alternative: “即使他杀我，我仍要仰望他”
  rationale: 所给希伯来文本明确写作לֹא，表示否定；传统译法反映另一种希伯来读法。为坚持原文证据优先而不抹去重要传统，正文采用否定读法，另以脚注保存另一读法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“申辩”保留本段的诉讼语境；正文不补出“盼望”的对象，以保存希伯来文在此处的简约与张力。
