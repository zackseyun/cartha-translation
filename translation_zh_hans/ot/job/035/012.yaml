  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: zh_hans
  text: 在那里，他们呼求，却得不到回答[a]，因为恶人的骄傲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文没有明说“回答”的主语；上下文暗示回答者是神。
    reason: alternative_reading
  - marker: b
    text: 或译：“狂妄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: 在那里
  rationale: 该副词主要表示地点；这里指向上文所述的处境。“在那里”保留其空间指向，不把它仅仅处理为时间性的“那时”或“于是”。
- source_word: יִצְעֲקוּ
  choice: 他们呼求
  rationale: צעק 表示人在困苦中大声求助。“呼求”既传达迫切感，也适合本节向神求告的语境。
- source_word: וְלֹא יַעֲנֶה
  choice: 却得不到回答
  rationale: וְ 在这里构成呼求与未获回答之间的转折，译为“却”。希伯来文动词为第三人称阳性单数，却未明说主语；采用无施事者的中文表达，既清楚自然，也避免直接补出“神”。
- source_word: מִפְּנֵי
  choice: 因为
  rationale: 该介词短语在此说明未获回答的原因；“因为”是现代汉语中最直接自然的表达。
- source_word: גְּאוֹן
  choice: 骄傲
  rationale: גְּאוֹן 可指尊荣、威严，也可指骄傲或狂妄；与“恶人”连用时具有负面含义。“骄傲”简洁而自然，“狂妄”亦为可取的较强译法。
- source_word: רָעִים
  choice: 恶人
  rationale: 该阳性复数形容词在此名词化，指邪恶、作恶的人。“恶人”准确、简洁，并保留其道德评价。
theological_decisions:
- issue: “不回答”的隐含主语
  choice: 译作“却得不到回答”，不在正文中明说回答者是谁。
  alternative: “神却不回答他们”或“他却不回答”
  rationale: 上下文表明预期的回答者是神，但本节希伯来文没有明说主语。中文若用“他”会缺少明确先行词，若直接补“神”则比原文更明确；无施事者表达可保留原文的克制。
- issue: 未获回答与恶人骄傲之间的因果关系
  choice: 保留“因为”，使“恶人的骄傲”作为未获回答的原因。
  alternative: 将其弱化为处境或伴随说明
  rationale: מִפְּנֵי 在这里自然表达原因。译文保留这一神学张力，不进一步说明这些“恶人”究竟是呼求者还是压迫者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“呼求”保留困苦中求助的迫切感；“得不到回答”自然地保留希伯来文未明说主语的特点。脚注按正文出现顺序重新编号。
