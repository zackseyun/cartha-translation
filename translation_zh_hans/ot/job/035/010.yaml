base_translation:
  language: en
  yaml_path: translation/ot/job/035/010.yaml
  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: zh_hans
  text: 却没有人说[a]：“那位在夜间赐下歌声的、造我的上帝在哪里？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “造我的”原文为复数形式；但此处与单数的“上帝”同指，正文按单数译出。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: 却没有人
  rationale: 结合上文表达转折；希伯来语未明说主语，汉语补出泛指的“人”，自然传达无人如此发问的意思。
- source_word: אָמַר
  choice: 说
  rationale: 虽为完成式，此处描述一般现象，汉语“说”无需标明时态即可保留这种概括性。
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 直接表达对所在之处的询问，并与汉语判断句自然衔接。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的单数神称，译作现代汉语通行的“上帝”。
- source_word: עֹשָׂי
  choice: 那造我的
  rationale: 该词形式上是复数并带第一人称单数后缀，但所指为独一的上帝；用“那造我的”既保持单数所指，也比名词化的“我的创造者”更贴近日常而庄重的汉语。形式上的复数在脚注交代。
- source_word: נֹתֵן
  choice: 就是那使……的
  rationale: 分词描述上帝一贯的作为；用同位性的关系结构承接前句，并在汉语中清楚表达施事者。
- source_word: זְמִרוֹת
  choice: 歌唱
  rationale: 原词为复数“歌、诗歌”；这里转译为动词“歌唱”，自然表达上帝在患难黑夜中赐下歌声的意象，同时不擅自限定为礼仪性的赞美诗。
- source_word: בַּלָּיְלָה
  choice: 在黑夜里
  rationale: 保留原文的时间意象和诗意；“黑夜”在现代汉语中比单说“夜里”更能承载此处诗歌语境，但仍不额外解释其象征意义。
theological_decisions:
- issue: עֹשָׂי 指上帝时的数
  choice: 按单数所指译为“那造我的”
  alternative: 按形式直译为“那些造我的”或“我的创造者们”
  rationale: 希伯来语形式为复数，但句中的 אֱלוֹהַּ 是单数，语境所指也是上帝。正文采用单数，避免造成多位创造者的误解；同时以脚注保留原文的复数形式，供读者查考。
- issue: “歌”是否明确为赞美诗
  choice: 译为宽泛的“歌唱”
  alternative: 译为“唱赞美诗”或“赞歌”
  rationale: זְמִרוֹת 可以指歌曲，语境可能含赞美意味，却没有明说其礼仪或赞美性质；因此不把这一层解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“却没有人说”承接上下文的反差；引语中用“那……的”结构保持原文两个分词性称述的连贯。脚注标记置于“说”后，与整句翻译中需要说明的特殊复数形式相对应。
