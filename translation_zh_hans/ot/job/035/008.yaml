  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: zh_hans
  text: '你的邪恶影响与你一样的人；

    你的公义影响世人[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”原文直译为“人子”，在这里是指普通的人，并非弥赛亚称号。
    reason: 说明希伯来习语并避免将普通称谓误读为弥赛亚头衔。
lexical_decisions:
- source_word: לְאִישׁ כָּמוֹךָ
  choice: 只影响与你一样的人
  rationale: 原文是省略谓语的诗句，结合35:6–7需补出行为所及的意思。“影响”自然表达介词לְ所指向的对象；“与你一样的人”保留כָמוֹךָ的明确比较。加入“只”承接上下文中人的恶与义并不增损神、而归及同类之意。
- source_word: רִשְׁעֶךָ
  choice: 你的邪恶
  rationale: רֶשַׁע在此表示道德上的恶，与下半句“公义”构成对照；“邪恶”直接、庄重且符合现代汉语。
- source_word: וּלְבֶן אָדָם
  choice: 也只影响世人
  rationale: בֶּן־אָדָם在《约伯记》的诗歌语境中泛指必死的人类，且与上半句אִישׁ平行。译作“世人”比字面的“人子”更能避免现代读者误认作弥赛亚称号，同时保留泛指人类的含义。
- source_word: צִדְקָתֶךָ
  choice: 你的公义
  rationale: צְדָקָה在此指正直、公义的品格或行为，与“邪恶”平行；“公义”保留原文的伦理和神学语域。
theological_decisions:
- issue: בֶּן־אָדָם在本节中的含义
  choice: 按泛指人类的习语译为“世人”
  alternative: 直译为“人子”
  rationale: 本句与“与你一样的人”构成同义平行，指普通、必死的人，并非弥赛亚称号。中文“人子”极易触发专有称号联想，因此正文采用语境明确的“世人”，脚注说明字面形式。
- issue: 人的恶与义所影响的对象
  choice: 补出“只影响”，表明其后果归及其他人
  alternative: 较形式地译为“你的邪恶归于与你一样的人，你的公义归于人子”
  rationale: 希伯来文省略谓语，其含义由35:6–7的反问建立。补出“影响”使现代汉语完整；“只”表达上下文对神与人两个对象的对比，但不主张人的行为与神毫无关系，而是传达以利户此处所说神不因人的行为而增损。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，以两行保持希伯来文平行结构。两处“只影响”使省略谓语的原文在汉语中清楚，并延续上文的论证；脚注标记已置于正文相应位置。
