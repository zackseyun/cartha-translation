  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: zh_hans
  text: 他教导我们，超过他教导地上的走兽；又使我们比天上的飞鸟更有智慧[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他借地上的走兽教导我们，又借天上的飞鸟使我们有智慧。”希伯来语介词也可表示来源，而不表示比较。
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: 教导我们
  rationale: למד 的 Piel 分词带第一人称复数后缀，表示主动施教；“教导我们”自然、庄重，也与下句“使我们……更有智慧”相称。
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: 胜过地上的走兽
  rationale: 介词 מִן 在此诗歌平行句中较可能表示比较。“地上的走兽”保留 בַּהֲמוֹת אָרֶץ 的具体意象；“胜过”承接“教导”，表达所受教导使人超越走兽的含义。
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: 比天上的飞鸟
  rationale: מֵ 与前半句平行，按比较义翻译。“天上的飞鸟”贴近 עוֹף הַשָּׁמַיִם，并保留希伯来诗句较高雅的空间意象。
- source_word: יְחַכְּמֵנוּ
  choice: 使我们……更有智慧
  rationale: חכם 的 Piel 未完成式带第一人称复数后缀，具有使役含义；结合比较结构，用“使我们比……更有智慧”准确而符合现代汉语。
theological_decisions:
- issue: 两个分句中介词 מִן／מֵ 的含义
  choice: 比较义：神教导人，使人胜过地上的走兽，并比天上的飞鸟更有智慧
  alternative: 来源义：神借着／从地上的走兽教导我们，又借着／从天上的飞鸟使我们得智慧
  rationale: 诗句的平行结构及上下文较支持人与动物所得智慧的比较。不过，希伯来介词也可表示来源，因此在脚注中保留这一真实歧义，不将其作教义化处理。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“走兽”与“飞鸟”保留诗歌的成对意象；分号呈现两个平行分句。主语“他”依上下文指神，但不在本节中增译“神”，以避免超过希伯来文本的明示程度。
