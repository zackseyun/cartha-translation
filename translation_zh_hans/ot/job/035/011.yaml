  source_fidelity: 首分句“他教导我们，胜过地上的走兽”在现代汉语中容易理解为“他教导我们这件事胜过走兽”，或甚至理解为人胜过走兽，未清楚表达比较所关联的“教导”对象。希伯来语此处的比较义应明确为：神对人的教导超过他对地上走兽的教导。后半句“使我们比天上的飞鸟更有智慧”准确反映比较结构。脚注保留介词可作来源义的歧义是恰当的。
