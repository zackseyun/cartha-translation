  yaml_path: translation/ot/job/035/005.yaml
  text: Look at the heavens and see; gaze at the clouds—they are higher than you.
translation:
  language: zh_hans
  text: 你要仰望诸天，看看；注视云霄，它们比你高。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֵּט
  choice: 仰望
  rationale: 该词意为观看、注目；结合宾语“诸天”，译作“仰望”既准确又符合现代汉语表达。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 保留希伯来语复数形式及诗歌语体，指头顶的天空。
- source_word: וּרְאֵה
  choice: 观看
  rationale: 直译“并看”，与前面的“仰望”构成诗意的递进与强调。
- source_word: וְשׁוּר
  choice: 凝视
  rationale: 该词有仔细观看、注视之意；“凝视”体现比一般“看”更专注的动作。
- source_word: שְׁחָקִים
  choice: 云霄
  rationale: 该复数词可指云层或高空；“云霄”兼顾其高远意象，并与下句“比你高”自然衔接。
- source_word: גָּבְהוּ מִמֶּךָּ
  choice: 它们比你高
  rationale: 准确保留完成式所陈述的状态以及比较结构；复数代词承接“云霄”。
