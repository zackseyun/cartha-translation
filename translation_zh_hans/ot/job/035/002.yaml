base_translation:
  language: en
  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: zh_hans
  text: 你以为这算公正吗？你说：“我的义胜过上帝的义。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: 你以为这样……吗
  rationale: 疑问词、指示代词与“思想、认为”共同构成反问；此译符合现代汉语表达，也保留以利户质问的语气。
- source_word: לְמִשְׁפָּט
  choice: 算公正
  rationale: מִשְׁפָּט在此具有公正、正当之意；“算公正”自然表达“视为公正/正当”的判断。
- source_word: אָמַרְתָּ
  choice: 你说
  rationale: 虽为完成式，但这里引述约伯仍与当前争论相关的说法，用“你说”最为自然。
- source_word: צִדְקִי
  choice: 我的义
  rationale: 保留צדק的道德与司法双重含义；“义”比单纯的“清白”或“权利”更能维持原文语义范围。
- source_word: מֵאֵל
  choice: 胜过上帝的义
  rationale: 将מִן理解为比较用法，并补出汉语比较句所需的“义”，使所比较的双方明确；原文关系紧缩且有争议，其他可能译法列入脚注。
theological_decisions:
- issue: 以利户所概括的约伯主张
  choice: 比较义：“我的义胜过上帝的义”
  alternative: “我在上帝面前是义的”；或“我的理在上帝那里”
  rationale: 在以利户的责问语境中，比较义能自然表达他对约伯的指控；但希伯来文צִדְקִי מֵאֵל结构简略，介词关系存在真实歧义，因此不在正文中暗自排除其他解释，而以脚注保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“公正”体现司法和道德判断；“我的义”保留经文的神学与法庭语感。正文采用较合语境的比较义，脚注明确保存原文歧义。
