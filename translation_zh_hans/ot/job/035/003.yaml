  text: כִּֽי תֹ֭אמַר מַה יִּסְכָּן לָ֑/ךְ מָֽה אֹ֝עִ֗יל מֵֽ/חַטָּאתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: zh_hans
  text: 因为你说[a]：“这对你有什么益处？我从自己的罪中能得什么好处？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你有什么益处？我所得的好处，比从自己的罪中所得的多吗？”希伯来文十分简略，可能暗含行义与犯罪之间的比较。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接以利户上一节的指责，并引出他所概述的约伯之言；译作“因为”清楚保留论证关系。
- source_word: תֹאמַר
  choice: 你说
  rationale: Qal未完成式第二人称阳性单数，在这里指以利户所指责的约伯；现代汉语用一般现在式“你说”自然简洁。
- source_word: מַה יִּסְכָּן לָךְ
  choice: 这对你有什么益处
  rationale: סכן在此表示有用或带来益处。原文的“这”所指含蓄，且לָךְ的形式存在解释难点，因此正文不补明是“义”还是其他对象，以保留原文的简约和歧义。
- source_word: מָה אֹעִיל
  choice: 我……能得什么好处
  rationale: יעל的Hiphil形式表达获益、得利；用“能得什么好处”符合汉语反问表达，并保留第一人称。
- source_word: מֵחַטָּאתִי
  choice: 从自己的罪中
  rationale: מן可表示来源，也可带比较意味。正文按来源义直译，同时以脚注说明语境中可能隐含的比较。
theological_decisions:
- issue: 以利户引述之问的指向
  choice: 保留“这对你有什么益处”中的指代含蓄，不明确断定“你”是约伯还是把它解释为对“我的义”的拟人称呼。
  alternative: 明确译成“行义对我有什么益处”，或“你的义对上帝有什么益处”。
  rationale: 希伯来文极为简约，前后语境暗示是在比较行义与犯罪给约伯带来的实际益处，但本节本身没有把所有成分明说出来。正文避免替原文解决这一神学张力。
- issue: מִן的来源义与比较义
  choice: 正文译作“从自己的罪中”，表达来源义。
  alternative: 译作“比犯罪能多得什么好处”，明确表达比较义。
  rationale: 介词מִן既可表示来源，也可表示比较；上下文支持比较理解，但本句没有明说比较的另一端，因此将该可能性放入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“益处”与“好处”对应两组近义的希伯来表达，既体现平行关系，又避免机械重复。正文保留原文含蓄的指代和比较关系。
