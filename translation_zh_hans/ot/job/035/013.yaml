source:
  edition: WLC
  text: אַךְ שָׁ֭וְא לֹא יִשְׁמַ֥ע אֵ֑ל וְ֝/שַׁדַּ֗י לֹ֣א יְשׁוּרֶֽ/נָּה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: zh_hans
  text: 诚然，上帝不听虚妄[a]，全能者也不理会它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“空虚”“徒然”“虚假”或“无价值之事”。希伯来词可指空洞、无益或带欺骗性的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 诚然
  rationale: 这里作为强调语气词，引出以利户断然的结论；“诚然”既保留强调，也符合庄重自然的现代汉语。
- source_word: שָׁוְא
  choice: 虚妄
  rationale: 该词可指空虚、徒然、虚假或无价值之事。“虚妄”保留抽象性及其可能兼具的空洞、徒然和不实意味，不把所指过早限定为某一种祷告或呼求。
- source_word: יִשְׁמַע
  choice: 不听
  rationale: 未完成式在此表达一般性的判断。“不听”既忠实于“听”的基本义，也可自然表示不予听取，而不是否认上帝具有听见声音的能力。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל在此是常见的神称；译作“上帝”自然明确，不额外加入原句未明说的修饰。
- source_word: וְשַׁדַּי
  choice: 全能者
  rationale: שַׁדַּי是《约伯记》中重要的神圣称号；“全能者”是现代中文中清楚、庄重且通行的对应表达。
- source_word: יְשׁוּרֶנָּה
  choice: 不理会它
  rationale: שׁור意为观看、注视或顾念；在与“不听”平行的语境中，“不理会”自然传达不予关注或看顾。阴性宾语后缀回指前面的שָׁוְא，故明译为“它”。
theological_decisions:
- issue: שָׁוְא所指的范围
  choice: 保留为可涵盖空洞、徒然或虚假的“虚妄”
  alternative: 明确译成“空洞的呼求”“虚假的祷告”或“狂妄的话”
  rationale: 希伯来文本使用抽象名词，并未明确补出“呼求”或“祷告”。保留抽象表达可维持经文的语义张力，同时上下文仍容许读者理解为上帝不听取空洞、徒然或不真诚的诉求。
- issue: “不听”是否否认上帝的全知
  choice: 按惯用语理解为不予听取或回应
  alternative: 改译成“听不见”
  rationale: 本句论及上帝不认可、不受理虚妄，而非陈述其感知能力有限；“不听”在中文中同样可以表达拒绝听取，因此无需在正文中加入解释性措辞。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“诚然”承载句首强调；“不听……也不理会……”保留希伯来诗句的平行结构。正文中的“它”明确对应阴性宾语后缀，同时不擅自补入“呼求”或“祷告”。
