base_translation:
  language: en
  yaml_path: translation/ot/job/035/016.yaml
  text: So Job opens his mouth in vain[a]; without knowledge he multiplies words.
translation:
  language: zh_hans
  text: 所以，约伯徒然开口[a]，无知地说了许多话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “徒然”或译“说空洞的话”；希伯来语 הֶבֶל 可指虚空、虚妄或徒劳。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִיּוֹב
  choice: 所以，约伯
  rationale: וְ在这里承接以利户前面的论断并引出结论；译作“所以”能自然体现语境中的推论关系。
- source_word: הֶבֶל
  choice: 徒然
  rationale: הֶבֶל可表示气息、虚空、虚妄或徒劳；在此修饰“开口”，用“徒然”较符合现代汉语，同时保留其言语空洞、无益的含义。
- source_word: יִפְצֶה פִּיהוּ
  choice: 开口
  rationale: פצה פה是“张开口”的惯用语，在此指开口说话；汉语“开口”简洁自然。
- source_word: בִּבְלִי דַעַת
  choice: 无知地
  rationale: 该短语直指“缺乏知识”。译作“无知地”可自然修饰后面的言说行为，并保留以利户对约伯缺少认识的指责。
- source_word: מִלִּין יַכְבִּר
  choice: 说了许多话
  rationale: מִלִּין意为“话、言语”，יַכְבִּר表示使之增多。汉语“说了许多话”准确传达“增多言语”，比生硬的“加增话语”更自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“开口”这一源语意象；后半句按汉语习惯整合为“无知地说了许多话”，不额外判定约伯是完全没有知识，还是其言论缺少知识。
