  yaml_path: translation/ot/job/035/004.yaml
  text: I will answer you with words[a], and your friends with you.
translation:
  language: zh_hans
  text: 我要用话回答你，也回答和你在一起的朋友。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要答复你，也答复和你在一起的朋友。”希伯来语动词可表示“回答、答复”；本句可理解为以利户同时向约伯和他的朋友们作答。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: 我
  rationale: 保留第一人称单数代词；希伯来文显式使用代词，带有轻微强调作用。
- source_word: אֲשִׁיבְךָ
  choice: 我要……回答你
  rationale: 使役态的 שוב 在此语境中可表示“回答、答复”；结合后面的“话”，译作“回答”自然且准确。
- source_word: מִלִּין
  choice: 用话
  rationale: 该词意为“话、言语”；“用话”体现其在句中的工具性含义，同时不把它解释性扩展为“论据”。
- source_word: וְאֶת
  choice: 也回答
  rationale: 连词和宾语标记引出另一个受词。中文补出共享的谓语“回答”，并用“也”清楚表达并列关系。
- source_word: רֵעֶיךָ
  choice: 你的朋友
  rationale: רֵעַ 可指朋友、同伴；本段所指是约伯的几位对话者，译作“朋友”符合上下文。
- source_word: עִמָּךְ
  choice: 和你在一起的
  rationale: עִם 表示伴随；此处用定语结构修饰“朋友”，既保留“与你同在”的关系，也使中文句法顺畅。
theological_decisions: []
