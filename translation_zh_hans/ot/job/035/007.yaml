base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: zh_hans
  text: 你若是公义的，给他[a]什么呢？或者，他从你手中拿取什么呢[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“他”按上下文指上帝；以利户的意思是，人的义并不能给上帝增添什么。
    reason: cross_reference
  - marker: b
    text: “拿取”也可译作“得到”或“领受”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出条件从句；“若”简洁、庄重，在现代汉语中仍自然可懂。
- source_word: צָדַקְתָּ
  choice: 你为义
  rationale: צדק表示为义、正直或有理；“为义”保留本节的道德—神学语域，又不把它缩窄为某一种具体善行。
- source_word: מַה תִּתֶּן לוֹ
  choice: 给他什么呢
  rationale: 直接保留“给”及间接宾语“他”，以反问语气表达一般性的论点，不额外加入“能”或“会”等情态含义。
- source_word: אוֹ
  choice: 又
  rationale: 在两个平行反问之间，“又”比生硬直译为“或者”更符合现代汉语表达，同时保留递进并列关系。
- source_word: מִיָּדְךָ
  choice: 从你手中
  rationale: 保留希伯来文“从你的手”这一具体意象，也可自然理解为从人的所有或作为中取得。
- source_word: יִקָּח
  choice: 收取
  rationale: לקח可指拿取或领受；“收取”既保留主动取得的语感，也适合“从你手中”这一搭配。
theological_decisions:
- issue: לוֹ及יִקָּח所含第三人称代词的指称
  choice: 正文保留“他”，脚注说明上下文指上帝
  alternative: 在正文直接译为“上帝”
  rationale: 35:6–8的论证表明所指是上帝，但希伯来正文使用代词；保留代词可避免把上下文解释直接代入正文。
- issue: 人的义与上帝所得之间的关系
  choice: 保留两个反问，不补写“上帝不会因此得益”等解释
  alternative: 在正文明确说明人的义不能使上帝获益
  rationale: 反问本身承载以利户的论点；不在正文扩写，可保留原文的修辞力度与神学张力。
translation_notes:
  register: 采用现代、庄重而简洁的反问句式。“为义”保留《约伯记》的道德与神学语域；正文不加入原文没有明说的情态词，也不以“上帝”替换代词。
