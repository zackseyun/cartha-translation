  text: אִם חָ֭טָאתָ מַה תִּפְעָל בּ֑/וֹ וְ/רַבּ֥וּ פְ֝שָׁעֶ֗י/ךָ מַה תַּעֲשֶׂה לּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: zh_hans
  text: 你若犯罪，能对他造成什么呢？你的过犯若增多，又能把他怎样呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: 你若犯罪
  rationale: אִם引出假设条件；完成式在一般性的反问条件句中用现代汉语“若犯罪”表达自然，不特意限定为已经完成的过去行为。
- source_word: מַה תִּפְעָל בּוֹ
  choice: 能对他造成什么呢
  rationale: פעל可指做成、产生作用，בּוֹ表示以他为作用对象或对他不利。“造成什么”表达这反问所问的实际影响，同时避免直接增译为“伤害”。“能”体现反问语气，并非另立能力命题。
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: 你的过犯若增多
  rationale: רבו意为增多、变得众多；第二分句省略的条件关系在汉语中以“若”补明，以保持与前句的平行。פשע含越界、悖逆意味，译作“过犯”庄重而清楚。
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: 又能把他怎样呢
  rationale: עשה לּוֹ直译为“对他做什么”；现代汉语反问“把他怎样”简洁自然，并与前半句形成措辞有别而意义平行的结构。
theological_decisions:
- issue: 本节是否暗示人的罪与神毫无关系，还是较窄地表示罪不能损害或减损神
  choice: 保留两个开放式反问，表达人的罪不能对神造成可支配或损害性的影响
  alternative: 明确译成“能伤害他什么呢”，或完全逐字译成“你对他做什么呢”
  rationale: 希伯来文没有明说“伤害”，但上下文的反问指向神的超越与不受人操控。“造成什么”和“把他怎样”传达这种语用含义，又不把经文扩大解释为罪在道德上与神无关。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“他”依上下文指神，但本节原文只用代词，正文不直接替换为“神”，以保留原文表达。两句分别用“造成什么”和“把他怎样”，兼顾希伯来文פעל与עשה的词汇差异及诗句平行。
