lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 保留时间兼话语转折的作用；现代汉语中“如今”简洁自然，不额外限定为因果或转折。
- source_word: כִּי
  choice: 因为
  rationale: 按解释原因理解，与上下文中以利户陈述约伯处境及其反应相符，同时不排除希伯来语可作内容引介的可能。
- source_word: אַיִן פָּקַד אַפּוֹ
  choice: 他没有在怒中施行惩罚
  rationale: פָּקַד 可表示临到、察看或追讨；与 אַפּוֹ（他的怒气）连用时，惩罚性临到较合语境。将“怒”处理为施行惩罚的情境，避免不自然地把“怒气”直接当作惩罚动作的主语。
- source_word: וְלֹא יָדַע
  choice: 也没有严加察看
  rationale: יָדַע 本义为知道，在此更可能指留意、察知或重视；结合 מְאֹד，以“严加察看”自然表达加强程度，又避免暗示上帝缺乏认知。
- source_word: בַּפַּשׁ
  choice: 人的悖逆
  rationale: 该词形式罕见且含义不确定；“悖逆”能涵盖越界、反抗和狂妄的语义范围。“人的”为汉语补足对象关系，并非另立明确所指。
- source_word: מְאֹד
  choice: 严加
  rationale: 将程度副词融入“察看”之前，符合现代汉语搭配，并保留“极其、很多”的加强作用。
theological_decisions:
- issue: 本节是否断言上帝忽视罪恶
  choice: 按以利户论述中的表述，译作上帝尚未在怒中惩罚，也未严加察看悖逆。
  alternative: 也可理解为：上帝没有在怒中追讨，却十分清楚人的狂妄。
  rationale: 希伯来文尤其下半句晦涩。正文保留其表面张力，但用“察看”而非“不知道”，避免把修辞性或论辩性的说法强化为关于上帝无知的教义断言。
- issue: פָּקַד 与 אַפּוֹ 的句法关系
  choice: 把“他的怒气”理解为惩罚发生的方式或情境：在怒中施行惩罚。
  alternative: 可译为“他的怒气没有追讨”或“他没有以怒气临到”。
  rationale: 原句高度压缩且句法困难；所选译法保持惩罚性含义，同时以自然汉语呈现，并通过脚注保留其他词义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。经文是未完句，依原文及上下文保留句末逗号。脚注标记均置于相关短语之后；正文不过度消解该节罕见词和压缩句法造成的歧义。
