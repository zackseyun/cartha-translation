  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: zh_hans
  text: 何况你说：“你看不见他。”你的案件就在他面前，你要等候他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“你要在他面前辗转”。这里的希伯来语动词含义难定，许多人按本节语境理解为“满怀期待地等候他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: 何况
  rationale: 承接上文的论证，表达递进而非单纯让步；“何况”自然体现从前句推到本句的加强语气。
- source_word: תֹאמַר
  choice: 你说
  rationale: 按第二人称阳性单数直译，保留以利户直接对约伯说话的语气。
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: 你看不见他
  rationale: 将动词理解为“看见、察看、察觉”，宾语指上帝；这符合上下文中约伯无法见到上帝的申诉，同时不把句子解释成上帝没有看见案件。
- source_word: דִּין
  choice: 你的案件
  rationale: 此处具有司法语境，指呈到上帝面前、等待裁断的案情或申诉；汉语用“案件”清楚自然。原文没有明示所有格，但按对约伯的直接谈话补出“你的”可使所指明确。
- source_word: לְפָנָיו
  choice: 就在他面前
  rationale: 保留案件呈在上帝面前、由他审理的司法意象；“就在”也自然传达其仍然摆在他面前。
- source_word: וּתְחוֹלֵל לוֹ
  choice: 你要等候他
  rationale: 该形式词义困难；结合案件已在上帝面前的语境，正文采用“等候他”，表达期待上帝作出行动或裁断，但以脚注保留更具体的另一种可能。
theological_decisions:
- issue: 上帝隐藏与约伯案件之间的关系
  choice: 即使约伯说自己看不见上帝，他的案件仍在上帝面前，因此应当等候上帝。
  alternative: 将“不看见”理解为上帝没有察看这案件。
  rationale: 希伯来语动词形态和上下文更适合把“你”作为看不见的一方；这样既保留约伯对上帝隐藏的申诉，也不额外推导上帝不知情。
- issue: 末句困难动词的解释
  choice: 正文译作“你要等候他”。
  alternative: 更贴近该词具体意象地译作“你要在他面前辗转／挣扎”。
  rationale: “等候”符合司法语境及以利户劝诫性的论证，但原词解释并不确定，因此不把这一理解当作唯一可能，另以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“案件”保留司法语境；“等候”比“静候”更直接，也避免加入原文未明说的耐心或信靠程度。脚注标记置于相关末句之后。
