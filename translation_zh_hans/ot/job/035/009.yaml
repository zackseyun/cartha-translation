    rationale: 该词可指强大者、显贵者或有权势者；“强权者”在现代汉语中常特别指实行强权统治者，加入原文未明示的政治含义。
  - severity: medium
    issue: 词汇异译脚注[b]的锚点不对应其所说明的介词。
    rationale: 脚注讨论的是“因强者的膀臂”中的 מִן 可译“从／脱离”，应标在“因”或该介词短语上，而非标在动词“求救”之后。
  - severity: low
    issue: 两行主语表达不完全平行。
    rationale: 首行“人们”、次行“他们”虽可理解，却不如在两行均明示“人们”自然整齐。
