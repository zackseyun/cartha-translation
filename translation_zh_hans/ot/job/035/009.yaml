  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: zh_hans
  text: '人们因欺压重重而呼喊；

    因强者的膀臂[a][b]而求救。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “膀臂”是希伯来语中表示力量或权势的形象说法。
    reason: cultural_note
  - marker: b
    text: 或译：“人们从强者的膀臂下呼求援助。”这里的希伯来语介词也可较直译为“从”；不过在本句中也可能表示呼求的原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב עֲשׁוּקִים
  choice: 因欺压重重
  rationale: מִן在此表示原因，רֹב表示数量或程度之多；עֲשׁוּקִים在本句指多次或多种欺压。“欺压重重”以自然凝练的现代汉语传达“因众多欺压”。
- source_word: יַזְעִיקוּ
  choice: 人们呼喊
  rationale: 该动词在此表示因痛苦而发出呼声。希伯来文主语未明说，汉语补出泛指的“人们”，避免误把“欺压”当作动词主语。
- source_word: יְשַׁוְּעוּ
  choice: 他们求救
  rationale: שׁוע的强化词干表示呼求援助；译作“求救”既与前句“呼喊”有所区别，也保留平行关系。
- source_word: מִזְּרוֹעַ
  choice: 因……的膀臂
  rationale: מִן可表示原因，也可较直译为“从、脱离”；正文按语境取原因义，同时保留זְרוֹעַ“膀臂”的具体意象，并以脚注说明另一种句法理解。
- source_word: רַבִּים
  choice: 强权者
  rationale: רַבִּים字面可指“众多的人”或“强大的人”；与象征力量的“膀臂”搭配时，语境更可能指掌握权势、施行欺压的人。“强权者”同时体现其社会权势。
theological_decisions:
- issue: 呼求的对象是否为上帝
  choice: 正文只说“求救”，不补出求告上帝
  alternative: 他们向上帝求救
  rationale: 本节希伯来文没有明说呼求对象；补出“上帝”会提前消解原文留下的含混，也可能削弱后文论述的张力。
- issue: מִן在“膀臂”前表示原因还是脱离
  choice: 正文采用原因义：“因强权者的膀臂”
  alternative: 他们呼求摆脱强权者的膀臂
  rationale: 上下两行的מִן可形成原因上的平行，但第二处也容许来源或脱离义；正文采用较合上下文的因果理解，脚注保留另一种可能。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“欺压重重”保留原文复数和程度感；“膀臂”略带文学色彩，但普通读者可懂，并能保存希伯来语的身体意象。两行维持近义平行，“呼喊”与“求救”分别对应两个不同动词。
