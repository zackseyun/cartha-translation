  source_fidelity: 译文正确传达了两处 מִן 所表达的压迫缘由，以及两个平行的呼叫动词。惟“强权者”比 רַבִּים 的“强者／权势者”更具现代政治制度色彩，略为窄化；第二处介词的异译注应锚定在“因”或整个介词短语，而非“求救”。
  naturalness: “因欺压重重，人们呼喊；因强权者的膀臂，他们求救”总体通顺，但首句有明示主语、次句改用“他们”的轻微不匀称。将两句都组织为“人们因……而……”更自然，也更清楚地呈现平行。
  terminology: “膀臂”庄重自然，且保留 זְרוֹעַ 的身体意象；文化注释适切。“强者”较“强权者”更贴近 רַבִּים 在此处的宽泛社会权势含义，不预设特定政治形态。
  issues:
