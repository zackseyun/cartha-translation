revisions:
- from: '因欺压重重，人们呼喊；

    因强权者的膀臂[a]，他们求救[b]。'
  to: '人们因欺压重重而呼喊；

    因强者的膀臂[a][b]而求救。'
  rationale: 改“强权者”为“强者”，避免将原文宽泛的权势含义限定为现代政治意义；重整句式以维持汉语的平行与流畅；并把异译脚注移至其实际说明的“因强者的膀臂”短语，同时保留第二处介词在原因与“从／脱离”之间的句法歧义。
