  yaml_path: translation/ot/job/039/030.yaml
  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: zh_hans
  text: 它的雏鸟吸食血液[a]；被杀者[b]在哪里，它就在哪里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的雏鸟舔食鲜血。”原文动词形象鲜明，可表达吸吮、大口吞食或舔食。
    reason: lexical_alternative
  - marker: b
    text: 或译：“尸体在哪里，它就在哪里。”原文直译为“被杀者”，突出了暴力死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: 它的雏鸟
  rationale: 该词指前文猛禽的幼鸟。“雏鸟”是现代汉语中自然、准确的统称，不额外限定其成长阶段。
- source_word: יְעַלְעוּ
  choice: 吸食
  rationale: 此动词生动地描写吸吮或大口吞食；“吸食血液”保留画面的强烈感，也符合汉语搭配。
- source_word: דָם
  choice: 血液
  rationale: 直译其基本词义，不弱化原文的血腥画面；“血液”与“吸食”搭配自然。
- source_word: וּבַאֲשֶׁר
  choice: 在哪里
  rationale: 原文引出地点关系从句；在后半句采用“在哪里……就在哪里”的对应结构，简洁自然。
- source_word: חֲלָלִים
  choice: 被杀者
  rationale: 该词通常指遭暴力杀死或刺死的人。“被杀者”保留暴力死亡的意味，又不把所指仅仅物化为尸体。
- source_word: שָׁם הוּא
  choice: 它就在哪里
  rationale: 代词回指前文所说的猛禽；汉语用“它”自然。配合前句形成“在哪里……就在哪里”的地点对应关系。
