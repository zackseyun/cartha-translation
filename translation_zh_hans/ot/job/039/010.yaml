  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: zh_hans
  text: 你能用绳索把野牛[a]拴在犁沟中吗？还是它会跟在你后面耙平谷地[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“原牛”或“野公牛”。希伯来语רֵים指一种强壮的野生牛科动物；旧译常译为“独角兽”，但这不符合该词在此处的动物指称。
    reason: lexical_alternative
  - marker: b
    text: “耙平谷地”也可译作“耕作低地”或“犁耕谷地”。这里的希伯来语动词可能特指耙地、整平土壤一类的作业；“谷地”一词也可能泛指低洼的耕地。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: 你能……拴……吗
  rationale: קשר意为捆绑、系住；这里是反问，描写人试图制服野兽，使其从事农耕。“拴”自然、具体，并能与“绳索”搭配。
- source_word: רֵים
  choice: 野牛
  rationale: 该词指强壮的野生牛科动物，而非神话中的独角兽。“野牛”通俗易懂，也保留上下文所强调的野性与力量；更具体的物种认定留在脚注中。
- source_word: בְּתֶלֶם
  choice: 在犁沟里
  rationale: תלם指犁出的沟垄。“在犁沟里”清楚呈现让牲畜沿犁沟劳作的农耕场景。
- source_word: עֲבֹתוֹ
  choice: 用绳索
  rationale: עבות指粗绳或绳索。希伯来语的三单阳性后缀直译为“它的绳索”，但中文在此用“用绳索”更自然，且不误解为野牛自有其绳。
- source_word: אִם
  choice: （第二个问句）……吗
  rationale: 此处אִם连接并列的反问内容，而非表达真实条件。中文分作两个连续问句，无须机械译出“或者”。
- source_word: יְשַׂדֵּד
  choice: 耙平
  rationale: 农业语境中的שׂדד指进一步整治、弄平土壤，可能是耙地。“耙平”既区别于初次犁地，也传达平整土地的动作。
- source_word: עֲמָקִים
  choice: 谷地
  rationale: 该复数名词通常指山谷或低洼之地。“谷地”保留其基本地貌含义；若语境指田间沟垄或低地，则以脚注说明。
- source_word: אַחֲרֶיךָ
  choice: 跟在你后面
  rationale: 该短语描写野牛受人引导，在农夫身后劳作。“跟在你后面”是自然、形象的现代汉语。
theological_decisions: []
