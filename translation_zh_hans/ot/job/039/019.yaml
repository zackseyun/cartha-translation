base_translation:
  language: en
  yaml_path: translation/ot/job/039/019.yaml
  text: Do you give the horse its strength? Do you clothe its neck with a mane?[a]
translation:
  language: zh_hans
  text: 是你赐给马力量吗？是你给它的颈项披上鬃毛吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可译作“雷声”。这是对 רַעְמָה 的一种古老解释；本译采用“鬃毛”，因为这里的直接意象是给马的颈项披上某物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּ֣ן
  choice: 是你赐给……吗
  rationale: 疑问词与第二人称阳性单数未完成式构成向约伯发出的反问；“是你……吗”自然地保留了直接质问的语气。“赐给”也适合本段论及能力来源的庄重语境。
- source_word: לַסּ֣וּס
  choice: 马
  rationale: 希伯来文带定冠词，在这里是类指用法，泛指马这一类动物；现代汉语直接说“马”最自然。
- source_word: גְּבוּרָ֑ה
  choice: 力量
  rationale: 该词可表示力量、威力或勇力；上下文描写战马的强健，“力量”清楚而不额外限定为勇气或战功。
- source_word: הֲתַלְבִּ֖ישׁ
  choice: 是你给……披上……吗
  rationale: 使役式保留“使穿上、给……披上”的形象；“披上”与颈项和鬃毛的视觉意象搭配自然。
- source_word: צַוָּאר֣וֹ
  choice: 它的颈项
  rationale: 阳性单数后缀回指马，但这是语法性别，不必说明为雄马；“它”符合现代汉语对泛指动物的表达，“颈项”保持诗体庄重。
- source_word: רַעְמָֽה
  choice: 鬃毛
  rationale: 在给马的颈项“披上”某物这一直接意象中，“鬃毛”最切合语境。该词亦有古老解释传统理解为“雷声”，因此以脚注保留词义上的不确定性。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的反问句式；两个分句平行，以“是你……吗”突出上帝对约伯的直接质问。“颈项”较“脖子”更符合诗歌语体，但普通读者仍易理解。
