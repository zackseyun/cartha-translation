  yaml_path: translation/ot/job/039/028.yaml
  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
translation:
  language: zh_hans
  text: 它住在峭壁上，也在那里留宿[a]；住在岩石的尖峰[b]和险固之处[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也在那里过夜”。
    reason: lexical_alternative
  - marker: b
    text: 直译“岩石的牙”，是希伯来语的形象说法，指尖锐突出的岩角或岩峰。
    reason: cultural_note
  - marker: c
    text: 或译：“堡垒”或“要塞”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: 峭壁
  rationale: 此处指适合鹰栖居的陡峭岩地；“峭壁”在现代汉语中自然、具体，并保留地势险峻的意味。
- source_word: יִשְׁכֹּן
  choice: 住
  rationale: שׁכן表示居住、安居；“住”简明自然，与诗句的陈述语气相称。
- source_word: וְיִתְלֹנָן
  choice: 也在那里过夜
  rationale: 该动词表示投宿或留宿过夜；补出“在那里”承接前面的地点，使汉语顺畅而不改变所指。
- source_word: עַל
  choice: 栖身于
  rationale: 原介词表示所在位置。为避免汉语连续使用“在……上”，结合鹰的语境译作“栖身于”，清楚表达位置关系。
- source_word: שֶׁן סֶלַע
  choice: 岩石的尖牙
  rationale: 直译为“岩石之牙”，是指尖锐岩峰或突出的岩角。保留“尖牙”这一鲜明比喻，同时用“尖”帮助现代读者把握形象。
- source_word: וּמְצוּדָה
  choice: 和堡垒
  rationale: מְצוּדָה可指堡垒、要塞或险固之处；此处把难以接近的岩地描写为安全据点。“堡垒”保留了原文的防御性意象。
