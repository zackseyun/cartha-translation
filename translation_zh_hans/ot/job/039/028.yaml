revisions:
- from: 它住在峭壁上，也在那里过夜[a]，栖身于岩石的尖牙[b]和堡垒[c]。
  to: 它住在峭壁上，也在那里留宿[a]；住在岩石的尖峰[b]和险固之处[c]。
  rationale: 修订以“尖峰”替换正文中不自然的“尖牙”，但在脚注中保留原文的“牙”这一诗歌意象。以“险固之处”表达鸟在险峻岩地的安全居所，避免将其不必要地具体化为人工堡垒；调整后半句句法，使地点短语与“住”“留宿”的关系更清晰。
