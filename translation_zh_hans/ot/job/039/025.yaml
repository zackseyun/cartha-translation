  rationale: 修订删除原文未明示的“听见”，使“嗅到”继续统摄战斗及其声响，保留希伯来诗歌的强烈感官意象。脚注锚点移至所注释的词语后；并将“哈！”调整为“啊哈！”，以更自然、明确地表达原文的兴奋感叹。
