base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: zh_hans
  text: 号角声一响[a]，它便说：“啊哈！”[b]它从远处嗅到战斗、将领们雷鸣般的声音和呐喊[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“号角一响”；希伯来语这个短语表示号角吹响之时。
    reason: lexical_alternative
  - marker: b
    text: “啊哈！”是兴奋、迫不及待的感叹，描写战马已准备投入战斗。
    reason: cultural_note
  - marker: c
    text: “将领们雷鸣般的声音和呐喊”也可译作“将领们的轰鸣和呼喊”。“雷鸣”在这里比喻战场上的巨大声响；“呐喊”一词也可指信号性的号角声。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: 号角一响
  rationale: 该短语表示号角吹响之时；译为“号角一响”自然简洁，并保留时间意味。
- source_word: יֹאמַר
  choice: 它就说
  rationale: 保留普通动词“说”及诗中对战马的拟人化，不额外强化为“喊”。
- source_word: הֶאָח
  choice: 哈！
  rationale: 简短感叹词，表现战马听见号角后兴奋、跃跃欲战的反应。
- source_word: וּמֵרָחוֹק
  choice: 从远处就
  rationale: 清楚表达距离，并以“就”体现尚在远处已经察觉。
- source_word: יָרִיחַ מִלְחָמָה
  choice: 嗅到战事
  rationale: 保留“嗅到”的具体感官意象；“战事”在汉语中可自然地作其宾语，也涵盖战争或战斗。
- source_word: רַעַם שָׂרִים
  choice: 将领们雷鸣般的吼声
  rationale: רַעַם本义为“雷鸣”，此处喻指战场上的巨大声响；שָׂרִים在军事语境中译为“将领们”。
- source_word: וּתְרוּעָה
  choice: 战斗的呐喊
  rationale: 该词可指呼喊或信号声；在此与将领们的巨大声响并列，译作战斗呐喊较合语境，同时以脚注保留歧义。
