  text: יַחְלְמ֣וּ בְ֭נֵי/הֶם יִרְבּ֣וּ בַ/בָּ֑ר יָ֝צְא֗וּ וְ/לֹא שָׁ֥בוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: zh_hans
  text: 它们的幼崽渐渐健壮，在野外[a]长大；它们离去，也不回到它们那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在野地”，或“在旷野”。
    reason: בַבָּר可指野外、野地或开阔的未耕之地；这些译法均保留其野生环境的含义。
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: 渐渐健壮
  rationale: 此处חלם描述幼兽身体发育良好、变得强健；“渐渐健壮”既自然，也保留成长过程的意味。
- source_word: בְנֵיהֶם
  choice: 它们的幼崽
  rationale: 字面可指“它们的孩子”，但上下文谈的是野生动物，用“幼崽”最符合现代汉语习惯，也不限定为雄性后代。
- source_word: יִרְבּוּ
  choice: 长大
  rationale: רבה通常可表示“增多”，但在本节与幼兽健壮及离开母兽相连，更可能描写其成长发育；“长大”符合诗句的语境，同时不引入数量增加的含义。
- source_word: בַבָּר
  choice: 在野外
  rationale: בָּר在这里指未开垦的野地或开阔乡野；“野外”简洁自然，并与家养环境形成隐含对比。
- source_word: יָצְאוּ
  choice: 它们离去
  rationale: יצא基本义为出去、离开；这里描写幼兽长成后离开母兽，“离去”在中文诗体中自然且不作过度解释。
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: 不再回到母兽身边
  rationale: 直译为“不回到它们那里”。上下文中的复数所指是生产并哺育幼崽的母兽；明确为“母兽”可避免中文代词连续使用造成的指代含混。“不再”表达离去后没有返回，但不强化为绝对的“永远不”。
theological_decisions: []
