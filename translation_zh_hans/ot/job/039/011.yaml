base_translation:
  language: en
  yaml_path: translation/ot/job/039/011.yaml
  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: zh_hans
  text: 你岂能因它力大就信赖它，把你的劳作[a]交给它吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“劳碌所得的成果”。希伯来词既可指劳作本身，也可指劳作所得。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִבְטַח בּוֹ
  choice: 你岂能……信赖它
  rationale: בטח在疑问句中表示信任、倚赖；“岂能”自然传达上文连续反问的修辞语气。בּוֹ所指的是上下文中的野牛，故译作“它”。
- source_word: כִּי רַב כֹּחוֹ
  choice: 因它力大
  rationale: כִּי在此引出信赖它的理由，取因果义；רַב כֹּחוֹ直指这牲畜力气强大，简洁译为“力大”符合现代汉语和农事语境。
- source_word: וְתַעֲזֹב אֵלָיו
  choice: 把……交给它
  rationale: עזב的基本义是“留下、放下”，与אֵלָיו连用时，在此语境中表达把工作留给它承担；“交给它”既自然，也保留托付工作的含义。
- source_word: יְגִיעֶךָ
  choice: 你的劳作
  rationale: יְגִיעַ可指辛劳、劳作，也可转指辛劳所得。在本节询问能否让野牛承担农事，“劳作”最直接，同时以脚注保留“劳碌所得”的可能。
