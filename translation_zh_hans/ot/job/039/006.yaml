  text: to whom I have given the desert for his house[a], and the salt land for his dwelling place[c][b],
translation:
  language: zh_hans
  text: '我使旷野成为它的家[a]，

    使盐碱地成为它的住处[b][c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旷野”或译“荒原”或“干旱草原”（עֲרָבָה）。
    reason: lexical_alternative
  - marker: b
    text: “盐碱地”或译“盐地”或“盐荒地”（מְלֵחָה）。
    reason: lexical_alternative
  - marker: c
    text: 原文“住处”为复数；这里按诗歌中的概括性或加强性用法译作单数。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: （承接上文，不另译）
  rationale: 关系词承接上节的野驴；汉语分句无需硬译“给它的那一位”，省译更自然，同时由“它”保持指代。
- source_word: שַׂמְתִּי
  choice: 我把……赐给
  rationale: שׂוּם基本义为“放置、设定”，在这里表示上帝为野驴安排其生境；“赐给”既自然，也保留上帝主动给予住处的语义。
- source_word: עֲרָבָה
  choice: 旷野
  rationale: 指干旱、荒凉的平原或荒漠地带。“旷野”是现代中文圣经语体中自然且易懂的对应词，又不把它限定为专名“亚拉巴”。
- source_word: בֵיתוֹ
  choice: 作家
  rationale: 直译为“它的家／房屋”。用“作家”保留以野地为家的诗意比喻，并符合汉语表达。
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: 作住处
  rationale: 原文为复数“它的住处们”，诗歌中可作概括性或加强性复数。正文用单数集合概念“住处”较自然，并以脚注保留形式信息。
- source_word: מְלֵחָה
  choice: 盐碱地
  rationale: 指含盐而贫瘠的土地。“盐碱地”是现代汉语常用而具体的地貌词；“盐地、盐荒地”亦可能。
theological_decisions: []
