base_translation:
  language: en
  yaml_path: translation/ot/job/039/007.yaml
  text: He laughs at the tumult of the city[b][a]; he does not hear the shouts of the driver.
translation:
  language: zh_hans
  text: 它对城中的喧嚣发笑[a]，听不见驱赶者的喊叫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城里的嘈杂声”。
    reason: lexical_alternative
  - marker: b
    text: “驱赶者”也可译作“督工”或“监工”。这个希伯来词也可泛指驱赶牲畜或催逼人做工的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: 一笑置之
  rationale: 该词是 שׂחק 的 Qal 未完成式，直指“发笑”。这里描写野驴对城市喧闹毫不在意；“一笑置之”既保留发笑意象，也比“嘲笑”少添一层主动讥讽的意味。
- source_word: לַהֲמוֹן
  choice: 对……喧嚣
  rationale: הָמוֹן 可指喧声、轰响或骚动；“喧嚣”在现代汉语中兼有嘈杂声响与纷扰之意，适合此处城市生活的背景。
- source_word: קִרְיָה
  choice: 城中
  rationale: קִרְיָה 指城或城镇。与“喧嚣”组合译作“城中的喧嚣”，自然地表达定指构词关系，并与旷野形成对照。
- source_word: תְּשֻׁאוֹת
  choice: 吆喝
  rationale: 该复数名词指高声呼喊；在驱赶牲畜的语境中，“吆喝”比泛称的“喊声”更具体自然，同时保留声音意象。
- source_word: נֹגֵשׂ
  choice: 驱赶者
  rationale: נֹגֵשׂ 可指驱赶者、督工或催逼劳役者。此处谈野驴，以较宽泛的“驱赶者”切合动物语境，也不排除催逼、管束的含义。
- source_word: לֹא יִשְׁמָע
  choice: 听不见
  rationale: 按希伯来语直接译出“听见”，不改写为“置之不理”或“不听从”，从而保留它既可描述远离其声，也可暗示不受管束的表达张力。
