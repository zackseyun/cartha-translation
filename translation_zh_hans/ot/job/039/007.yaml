translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“一笑置之”自然呈现野驴对城市喧闹的不屑与自由；“驱赶者”避免过早限定为特定劳役制度中的督工。代词用“它”，与现代汉语动物指称习惯一致。
