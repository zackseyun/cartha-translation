  text: Who has let the wild donkey go free? Who has untied the bonds of the swift donkey?[a]
translation:
  language: zh_hans
  text: 谁让野驴自由离去？谁解开野驴的束缚？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文后一个“野驴”使用了另一个希伯来词，可能指亚洲野驴。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 疑问代词引出上帝的反问；两小句均译为“谁”，保留希伯来诗句的平行结构。
- source_word: שִׁלַּח
  choice: 放出去
  rationale: 该动词在此表达释放、放走之意；与“使它自由”连用，既自然又保留动作和结果。
- source_word: פֶּרֶא
  choice: 野驴
  rationale: 指野生驴；“野驴”是现代汉语中准确、简明的名称。
- source_word: חָפְשִׁי
  choice: 使它自由
  rationale: 该词描述野驴获释后的自由状态；采用结果性表达，使中文清楚自然。
- source_word: וּמֹסְרוֹת
  choice: 绳索
  rationale: 复数名词指用于束缚的带子或绳索；“绳索”具体易懂，并与“解开”自然搭配。
- source_word: עָרוֹד
  choice: 野驴
  rationale: 该词也指一种野驴或亚洲野驴。原文与פֶּרֶא使用近义词形成平行；中文缺少既通俗又能可靠区分二者的对应词，因此正文不凭语境添加“迅捷”等原词未明说的特征。
- source_word: פִתֵּחַ
  choice: 解开
  rationale: 与“绳索”搭配时意为松开、解除束缚；“解开”符合现代汉语习惯。
