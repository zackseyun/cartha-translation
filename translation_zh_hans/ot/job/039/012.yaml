  text: Will you trust him that he will bring back your seed and gather it to your threshing floor?[a]
translation:
  language: zh_hans
  text: 你岂能信赖它，相信它会把你的种子带回来，并将其收聚到你的禾场上吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“你的种子”；在这里的农业语境中，很可能指从田里带回的谷物或收成。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַאֲמִין בּוֹ
  choice: 你岂能信得过它
  rationale: האמין ב表示把信赖放在某对象上；本节语境是能否倚靠野牛完成农活。“信得过”自然表达实际倚赖，并保留反问语气。
- source_word: כִּי
  choice: 让它
  rationale: 此处引出所信赖它去完成的事。汉语以“信得过它，让它……”比直译为“相信它会……”更自然，也能表达托付工作的语境。
- source_word: יָשׁוּב
  choice: 运回来
  rationale: שׁוב基本义为“返回”，但这里带宾语“你的种子”，语境要求及物理解，即把田间收成带回；“运回来”也符合野牛作为役畜的场景。
- source_word: זַרְעֶךָ
  choice: 你的种子
  rationale: 保留זֶרַע的字面词义及其可能的歧义；在农业语境中，它很可能转指由所撒种子长成并收割的谷物，脚注予以说明。
- source_word: גָרְנְךָ
  choice: 你的禾场
  rationale: גֹּרֶן指打谷、簸扬谷物的场地，而非仓房；“禾场”是准确且简洁的现代中文农业用语。
- source_word: יֶאֱסֹף
  choice: 收聚到
  rationale: אסף意为收集、聚拢；“收聚到你的禾场上”保留动作及目的地关系。
