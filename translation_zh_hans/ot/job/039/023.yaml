  text: Over him the quiver rattles[b][a], the flashing spear and javelin.
translation:
  language: zh_hans
  text: 箭袋在它上方铮铮作响[a]，闪耀的枪与矛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“箭袋向着它铮然鸣响。”希伯来语的介词和动词可表达略有不同的空间关系与声音色彩。
    reason: lexical_alternative
  - marker: b
    text: 直译为“枪与矛的火焰（或锋刃）”，是描写武器闪耀光芒的诗意说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: 在它身上
  rationale: עַל加第三人称阳性单数后缀，表示声音与战马的空间关系；“在它身上”保留“在其上、临其身”的意象，也不把敌对含义说得过死。
- source_word: תִּרְנֶה
  choice: 铮铮作响
  rationale: 该诗歌性动词在此描写箭袋发出的清脆响声；“铮铮作响”自然传达战场上器具震动鸣响的听觉效果。
- source_word: אַשְׁפָּה
  choice: 箭袋
  rationale: 指盛放箭矢的袋或筒；现代汉语通常称“箭袋”。
- source_word: לַהַב
  choice: 寒光闪耀
  rationale: 本义可为“火焰”或“刃、锋”，与武器连用时描绘其闪亮的锋芒；译作“寒光闪耀”保留诗性视觉意象。
- source_word: חֲנִית
  choice: 枪
  rationale: 常用的长柄刺击武器；以“枪”作宽泛且简洁的现代汉语对应词。
- source_word: כִידוֹן
  choice: 矛
  rationale: 另一种枪矛类武器，具体形制未必能够确定；译作“矛”既与חֲנִית略作区分，又避免过度限定为投掷武器。
