  yaml_path: translation/ot/job/039/003.yaml
  text: They crouch down[a], they bring forth their young[b]; they cast off their labor pains.
translation:
  language: zh_hans
  text: 它们蹲下[a]，生下幼崽；摆脱产痛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蹲下”也可译作“屈身”或“跪下”。
    reason: lexical_alternative
  - marker: b
    text: “产痛”也可译作“生产的阵痛”或“分娩阵痛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: 它们屈身
  rationale: כרע表示身体向下弯曲或跪伏；在母兽生产的语境中，“屈身”既保留动作形象和诗意，也不把具体姿势限定得过死。
- source_word: יַלְדֵיהֶן
  choice: 幼崽
  rationale: 该形式指它们所生的后代；上下文谈的是野生动物，“幼崽”是现代汉语中自然且明确的表达。
- source_word: תְּפַלַּחְנָה
  choice: 产下
  rationale: 此处动词用于分娩语境，表达生出后代；“产下”简洁自然，并与宾语“幼崽”搭配恰当。
- source_word: חֶבְלֵיהֶם
  choice: 生产的阵痛
  rationale: חבל在这里依分娩语境指产痛，而非绳索；“生产的阵痛”清楚呈现其含义。原文此处后缀为阳性复数形式，与前后所指母兽的阴性形式不一致，但所指仍可由语境辨明。
- source_word: תְּשַׁלַּחְנָה
  choice: 它们摆脱了
  rationale: שלח的基本意象是送走、放开；这里表示母兽生产后将产痛释放、除去。“摆脱了”符合现代汉语表达，同时保留产痛离去的动态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“屈身—产下—摆脱”形成紧凑的动作推进；避免使用过于文言的“劬劳”或可能引起歧义的“绳索”。
