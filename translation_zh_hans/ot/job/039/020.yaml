  text: 你能使它像蝗虫一样跳跃吗？它喷鼻时的威势令人惊惧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你能使它像蝗虫一样轰鸣吗？”原文动词可指使之震动、震荡或猛烈活动；此处的意象可能同时涉及声响与动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: 你能使它……跳跃吗
  rationale: 该词是רעש的使役形，可表达使之震动、剧烈活动。结合战马与蝗虫的比喻，译作“跳跃”较自然地呈现猛烈跃动的画面，同时以问句保留上帝讲话的语气。
- source_word: כָּאַרְבֶּה
  choice: 像蝗虫一样
  rationale: 原文是单数形式，可作类属或集合用法；汉语用“像蝗虫一样”自然，并保留比喻中突然、有力跃动的形象。
- source_word: הוֹד
  choice: 威势
  rationale: 该词可指威严、荣美或壮丽。此处描写战马喷鼻所显出的慑人气势，“威势”既符合语境，也保持诗歌的庄重感。
- source_word: נַחְרוֹ
  choice: 它喷鼻的
  rationale: 该词与从鼻孔喷气、喷鼻有关；“喷鼻”准确呈现马匹的动作和声音，比“嘶鸣”更贴近词义。
- source_word: אֵימָה
  choice: 令人惊惧
  rationale: 该名词意为恐惧、可畏之感。译成述谓性的“令人惊惧”，符合现代汉语，同时保留原文名词句的强烈效果。
