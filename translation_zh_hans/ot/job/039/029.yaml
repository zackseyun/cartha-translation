  text: From there he spies out food[a]; his eyes look from far away.
translation:
  language: zh_hans
  text: 它从那里寻觅食物；它的眼睛从远处眺望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的眼睛从远处发现食物。”后半句也可按语境理解为鹰在远距离发现食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 保留介词与方位副词的含义，指出鹰以高处巢穴为观察和行动的起点。
- source_word: חָפַר
  choice: 寻觅
  rationale: 该动词通常有“挖掘”之意，但与“食物”搭配并用于鹰的行为时，语境所表达的是仔细搜寻；“寻觅”既自然，也保留主动搜求的意味。
- source_word: אֹכֶל
  choice: 食物
  rationale: 按该名词的宽泛本义翻译；上下文虽可具体理解为猎物，但原文并未使用专指猎物的词。
- source_word: לְמֵרָחוֹק
  choice: 远方
  rationale: לְ 可表达朝向，מֵרָחוֹק 表示遥远之处；与“眺望”搭配译作“远方”，自然地呈现视线投向远处的画面，同时不强行限定为“从远处”。
- source_word: עֵינָיו
  choice: 它的眼睛
  rationale: 明确保留复数名词及第三人称阳性单数后缀所形成的具体意象；现代汉语指动物用“它”。
- source_word: יַבִּיטוּ
  choice: 眺望
  rationale: 该动词表示有方向地观看，复数形式与“眼睛”呼应；“眺望”适合鹰从高处望向远方的语境。
