  yaml_path: translation/ot/job/039/014.yaml
  text: For she leaves her eggs to the earth and warms them on the dust,[a]
translation:
  language: zh_hans
  text: 因为它把蛋留在地上，在尘土上给蛋保暖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把蛋遗弃在地上。”希伯来语动词可表达比“留”更强的意思；但下半句描写它在尘土上给蛋保暖，显示这里不一定指完全弃置不顾。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面对鸵鸟的描述提供原因或解释；“因为”自然保留了希伯来语的因果、说明作用。
- source_word: תַעֲזֹב
  choice: 留
  rationale: עָזַב 可表示“离开、撇下、遗弃”。正文用较中性的“留”，既符合此处把蛋置于地面的情景，也不预先断定是彻底遗弃；较强的含义收入脚注。
- source_word: לָאָרֶץ
  choice: 在地上
  rationale: 希伯来语字面为“给/向地”，在汉语中以“留在地上”最自然，并保留蛋暴露于地面的具体图景。
- source_word: בֵּצֶיהָ
  choice: 它把蛋
  rationale: 指上文的雌鸵鸟。现代汉语通常以“它”指动物；“蛋”准确传达复数所指，汉语无需显式复数标记。
- source_word: וְעַל עָפָר
  choice: 在尘土中
  rationale: עַל 常为“在……上”，但结合使蛋受暖的情景，汉语“在尘土中”较自然，也保留 עָפָר 的诗性意象；不采用较口语化的“泥土”。
- source_word: תְּחַמֵּם
  choice: 使蛋温暖
  rationale: 该词是 חמם 的 Piel 形式，意为“使温暖”。译作“使蛋温暖”贴近其使役意义，并补出由上句可知的宾语；避免用技术性较强且解释较多的“孵化”。
