  language: zh_hans
  text: 鸵鸟的翅膀欢快地拍动——难道是鹳的翼羽和羽毛吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“鸵鸟的翅膀得意地拍动，但难道是鹳的翼羽和羽毛吗？”本节希伯来文的词义和句法都较难确定，历来有多种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: 翅膀
  rationale: 希伯来文为单数集合用法；现代汉语用“翅膀”即可自然指成对的翼，并保留诗句的整体意象。
- source_word: רְנָנִים
  choice: 鸵鸟
  rationale: 该词字面与鸣叫或欢呼有关，但在本段动物语境中通常指鸵鸟；随后数节所述的习性也支持这一辨认。
- source_word: נֶעֱלָסָה
  choice: 欢然拍动
  rationale: 这个动词兼有欢跃、得意和活跃动作的色彩；用于翅膀时，“欢然拍动”同时表达动作与兴奋感。
- source_word: אִם
  choice: 难道……吗
  rationale: 这里引出省略成分较多的修辞问句或对比；用“难道……吗”保留其疑问语气，不把难解的句法强行断定为陈述。
- source_word: אֶבְרָה
  choice: 飞羽
  rationale: 该词指翅上的长羽或翼羽，比泛称“羽毛”更具体；“飞羽”是现代汉语中准确而可懂的鸟类用语。
- source_word: חֲסִידָה
  choice: 鹳
  rationale: 在此动物语境中是鸟名“鹳”，而不是同形词所关联的忠诚或慈爱含义。
- source_word: וְנֹצָה
  choice: 和翎毛
  rationale: 该名词指羽毛、羽衣；“翎毛”与“飞羽”相配，既避免简单重复，又保持诗体庄重。
