  yaml_path: translation/ot/job/039/027.yaml
  text: Is it at your command that the eagle flies high and lifts up its nest?[a][b][c]
translation:
  language: zh_hans
  text: 鹰岂是听你的命令高飞，又把巢筑在高处吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听你的命令”原文直译为“在你口上”，意思是按照你的话或命令。
    reason: lexical_alternative
  - marker: b
    text: “鹰”也可泛指大型猛禽；在某些语境中可能包括秃鹫。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 岂是……吗
  rationale: 在上下文中引出反问，而非表示条件；用“岂是……吗”自然传达上帝对约伯的诘问。
- source_word: עַל־פִּיךָ
  choice: 听你的命令
  rationale: 字面为“在你口上”，是表示按某人的话或命令行事的习语；此译法符合现代汉语。
- source_word: יַגְבִּיהַּ
  choice: 高飞
  rationale: 使役词干在此描写鹰升到高处；“高飞”简洁保留高度意象，也符合鸟类动作。
- source_word: נָשֶׁר
  choice: 鹰
  rationale: 该词通常指鹰，也可能泛指包括秃鹫在内的大型猛禽；正文采用传统且符合高处筑巢语境的“鹰”。
- source_word: וְכִי
  choice: 又
  rationale: 连接同一反问中的第二个动作；“又”在汉语中自然承接前句。
- source_word: יָרִים קִנּוֹ
  choice: 把巢筑在高处
  rationale: 字面意象是“抬高它的巢”，实际指将巢安置在高处；避免让人误解为搬动整个巢，同时保留高举、高置的含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“岂是……吗”保留诗歌中的反问语气；“把巢筑在高处”传达希伯来语的空间意象，避免生硬直译为“抬高它的巢”。
