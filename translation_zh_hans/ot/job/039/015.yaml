  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
translation:
  language: zh_hans
  text: 她忘了，脚可能把蛋踩碎[a]，田野的走兽也可能把蛋践踏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“脚可能踩碎它，田野的走兽可能践踏它”。原文两处都用阴性单数代词，可能把上文的蛋看作一个整体来指称。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: 她竟忘了
  rationale: 该词是שׁכח的Qal连续式未完成体第三人称阴性单数，承接对雌鸵鸟的描写。“竟”自然传达此处令人诧异的疏忽，但不改变“忘记”的基本意义。
- source_word: כִּי
  choice: （所忘之事的内容，不另译）
  rationale: 这里的כִּי引出“忘了”的内容；汉语直接接宾语从句最自然，无须机械译作“因为”或“以为”。
- source_word: רֶגֶל
  choice: 脚
  rationale: 单数名词在此具有泛指意义，指任何经过的脚；汉语裸名词“脚”即可自然表达这种泛指。
- source_word: תְּזוּרֶהָ
  choice: 可能把蛋踩碎
  rationale: 此处动词在脚踩语境中表示踩压而造成损坏；“踩碎”清楚呈现鸵鸟蛋面临的结果。阴性单数后缀在上下文中集合性地回指所留下的蛋，故明说“蛋”。
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: 田野的走兽
  rationale: 构词直义为“田野之兽”。“田野的走兽”既保留原文意象，又是现代汉语中自然、庄重的表达，范围也不被过度限定。
- source_word: תְּדוּשֶׁהָ
  choice: 可能把蛋践踏
  rationale: דושׁ在此意为踩踏、践踏。“践踏”与前句“踩碎”形成自然平行；阴性单数后缀按上下文集合性地译为“蛋”。
