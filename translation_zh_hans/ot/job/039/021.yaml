base_translation:
  language: en
  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: zh_hans
  text: 它在谷中刨地[a]，为自己的力量欢腾；它出去迎向兵器[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在谷中挖掘”或“在谷中用蹄刨地”。希伯来语动词直译为“挖掘”，这里形容战马用蹄刨地的动作。
    reason: lexical_alternative
  - marker: b
    text: 或译“迎战”。这里的希伯来语名词可指武器或军械的总称，也可引申指武装冲突本身。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: 刨地
  rationale: חפר的基本义是“挖、掘”；在战马的语境中，指用蹄刨地。“刨地”既保留具体动作，也符合现代汉语表达。
- source_word: בָעֵמֶק
  choice: 在谷中
  rationale: עֵמֶק通常指山谷或低地；“在谷中”直接对应原文，又保持场景的空间感。
- source_word: וְיָשִׂישׂ
  choice: 欢腾
  rationale: שׂושׂ表达喜悦、雀跃或欢欣；“欢腾”能传达战马因力量而振奋的强烈情态。
- source_word: בְּכֹחַ
  choice: 为自己的力量
  rationale: 介词ב在此可表示所欢腾的缘由或所凭借的状态；“为自己的力量”在现代汉语中自然，同时不过度限定其语义。
- source_word: יֵצֵא
  choice: 它出去
  rationale: יצא的基本义为“出去、出来”；采用“出去”而不译作“冲出去”，避免添加原文未明说的速度或猛烈程度。
- source_word: לִקְרַאת
  choice: 迎向
  rationale: לקראת表示朝向并前去相遇；“迎向”在中文中兼具方向和主动面对之意。
- source_word: נָשֶׁק
  choice: 兵器
  rationale: נשק可指武器、军械，也可引申为战斗；正文采用具体的“兵器”，保留原文鲜明的军事意象。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“刨地”具体呈现战马的动作，“欢腾”传达其昂扬状态；末句保留“兵器”这一具体意象，并以脚注说明可引申为“战斗”。
