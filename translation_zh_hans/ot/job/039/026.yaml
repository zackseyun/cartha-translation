  yaml_path: translation/ot/job/039/026.yaml
  text: Is it by your understanding that the hawk soars[a], spreading its wings toward the south?
translation:
  language: zh_hans
  text: 鹰隼向南展翅翱翔，难道是靠你的悟性吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: 难道是靠你的悟性吗
  rationale: 疑问词 הֲ 与介词 מִן、名词 בִּינָה及第二人称阳性单数词尾构成反问，询问这一行动是否凭约伯的理解力而发生。“悟性”直接表达 בִּינָה 在此处的辨识、理解能力。
- source_word: יַאֲבֶר
  choice: 飞去
  rationale: אבר 的使役式在此描述鸟振翼飞行或腾飞。结合“展翅”和向南的方向，“飞去”自然表达其飞行运动，同时避免把具体飞行姿态规定得过细。
- source_word: נֵץ
  choice: 鹰隼
  rationale: נֵץ 指鹰或隼一类猛禽，具体物种不确定。“鹰隼”在现代汉语中可概括这类猛禽，并保留原词范围。
- source_word: יִפְרֹשׂ כְּנָפוֹ
  choice: 展翅
  rationale: פרשׂ 意为展开，כְּנָפוֹ 字面为“它的翅膀”，单数形式具有集合意义。汉语“展翅”简洁自然地传达展开双翼的动作。
- source_word: לְתֵימָן
  choice: 向南
  rationale: 介词 לְ 表示方向，תֵימָן 在此意为南方；“向南”准确保留其方向性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语顺畅的反问句。为使汉语焦点清楚，将“难道是靠你的悟性吗”置于句末；“鹰隼”保留原文物种指称的不确定性。
