  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: zh_hans
  text: 野牛[b]岂肯服事你？它会在你的饲槽[a]旁过夜吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的食槽”。希伯来语这个词指牲畜吃食的地方。
    reason: lexical_alternative
  - marker: b
    text: “野牛”也可译作“野公牛”或“原牛”；这个希伯来词所指的确切动物不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: 岂肯
  rationale: אבה表达意愿或同意；“岂肯”既保留意愿色彩，也自然体现反问语气。
- source_word: רֵּים
  choice: 野牛
  rationale: 该词所指的具体动物不能完全确定；“野牛”通俗易懂，也不过度限定物种。
- source_word: עָבְדֶךָ
  choice: 服事你
  rationale: עבד在这里指为主人效劳；“服事你”简洁庄重，并与驯养牲畜为人劳作的语境相符。
- source_word: אִם
  choice: 岂肯
  rationale: אִם引出与前句平行的第二个反问；汉语重复“岂肯”比直译为“或”更自然，也保留诗歌的平行结构。
- source_word: יָלִין
  choice: 过夜
  rationale: לין指留宿或停留一夜；“过夜”是自然、清楚的现代汉语。
- source_word: עַל
  choice: 在……旁
  rationale: עַל本可表示“在……上、旁、近处”；与饲槽连用时，“在……旁”符合动物留在喂食处的具体图景。
- source_word: אֲבוּסֶךָ
  choice: 你的饲槽
  rationale: אֲבוּס指牲畜吃食的地方或槽；“饲槽”具体、明白，并保留家畜环境的意象。
