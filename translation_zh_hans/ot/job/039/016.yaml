- from: 她狠心对待自己的幼雏[a]，仿佛不是自己的一样；她劳苦却不怕徒然。
  to: 她严酷地对待自己的幼雏[a]，仿佛它们不属于她；她的劳苦徒然，却毫无惧怕。
  rationale: 修订消除了所属关系与句法上的汉语歧义，保持动物语境、诗体庄重及原文末尾“无惧”的简洁张力。脚注保留词义替代的空间，但避免将原文未明示的关系解释为“对她”。
