base_translation:
  language: en
  yaml_path: translation/ot/job/039/016.yaml
  text: She treats her young harshly[a], as if they were not hers; her labor is in vain, without fear.
translation:
  language: zh_hans
  text: 她严酷地对待自己的幼雏[a]，仿佛它们不属于她；她的劳苦徒然，却毫无惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她使自己的儿女刚硬，如同不属于她。”
    reason: 保留הִקְשִׁיחַ较为直译的“使……刚硬”这一可能理解，并反映“如同不属于她”的比较语气。
lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: 狠心对待
  rationale: 该词为קשׁח的使役形，可表达“使之刚硬”或“严酷对待”。结合鸵鸟对幼雏的语境，“狠心对待”既自然，也保留其冷酷严厉之意。
- source_word: בָּנֶיהָ
  choice: 自己的幼雏
  rationale: 字面为“她的儿女”；动物语境中，“幼雏”准确、自然，并明确所指是鸟的后代。
- source_word: לְלֹא לָהּ
  choice: 仿佛不是自己的一样
  rationale: 原文简略，近于“如同不属她”；此译补足汉语表达所需成分，同时保留其比较意味。
- source_word: לְרִיק
  choice: 徒然
  rationale: 表示落空、毫无结果；“徒然”简洁庄重，适合本节诗体语境。
- source_word: יְגִיעָהּ
  choice: 她劳苦
  rationale: 名词指她的劳碌或辛劳。转为汉语主谓结构“她劳苦”，可与后面的“徒然”自然结合。
- source_word: בְּלִי פָחַד
  choice: 不怕
  rationale: 字面是“没有惧怕”。在句法上可理解为她对劳苦可能落空并不恐惧或忧虑；“不怕”保留原文的简洁与力度。
theological_decisions:
- issue: “不怕”与“徒然”的句法关系
  choice: 她劳苦却不怕徒然
  alternative: 她的劳苦徒然，她却毫不在意
  rationale: 原文“徒然—她的劳苦—没有惧怕”的关系紧凑，存在“劳苦徒然且无惧”与“并不怕劳苦徒然”等表达可能。正文采用自然汉语把“没有惧怕”与劳苦落空相连，但不把פחד弱化为单纯的“不在意”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“幼雏”符合鸟类语境；“狠心对待”传达母鸟表现出的严酷。“却不怕徒然”保留希伯来诗句的凝练和末尾“无惧”所造成的张力。
