review_pass:
  verdict: revise
  source_fidelity: 正文首句基本传达了הִקְשִׁיחַ在此语境中“严酷地对待”的意思，也正确将בָּנֶיהָ按鸟类语境译为“幼雏”。但“仿佛不是自己的一样”在汉语中缺少明确的所属对象，未充分表达לְלֹא לָהּ“仿佛不属于她”。末句“她劳苦却不怕徒然”改变了原文较直接的断言结构，容易读成她不怕“徒然”这一结果，而原文可更自然地保留为“她的劳苦徒然，却毫无惧怕”。
  naturalness: “仿佛不是自己的一样”不够自然且语义悬空；“她劳苦却不怕徒然”搭配生硬。改为“仿佛它们不属于她”和“她的劳苦徒然，却毫无惧怕”，既是现代庄重汉语，也较贴近诗句的并置结构。
  terminology: “幼雏”适合本节鸵鸟语境，“劳苦”“徒然”“惧怕”也维持了诗体的庄重。脚注应将直译性替代译法表述得更准确，不应添加“对她”这一原文未明说的关系。
  issues:
  - severity: medium
    issue: “仿佛不是自己的一样”未明确所属关系。
    rationale: לְלֹא לָהּ意为“如同不属于她／不是她的”；补出“它们不属于她”可避免中文歧义。
  - severity: medium
