  yaml_path: translation/ot/job/039/008.yaml
  text: He explores the mountains for his pasture[b][a], and he searches after every green thing.
translation:
  language: zh_hans
  text: '它在群山中四处游走觅食；

    寻觅一切青绿的植物。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְתוּר
  choice: 走遍……寻找
  rationale: תור在此表示四处察寻、巡行觅食；结合“群山”和“草场”，译作“走遍……寻找”既体现游走，也体现搜寻目的。
- source_word: הָרִים
  choice: 群山
  rationale: הָרִים带定冠词，指山地；现代汉语用“群山”自然地表达复数山岭。
- source_word: מִרְעֵהוּ
  choice: 草场
  rationale: מִרְעֶה指牧放、觅食之地；语境中的主语是野驴，汉语不必机械译出第三人称阳性单数后缀，译为“草场”更自然。
- source_word: וְאַחַר
  choice: 寻觅
  rationale: אַחַר与דרש连用表达追寻、寻找；汉语以动词“寻觅”传达这一方向和持续动作。
- source_word: כָּל
  choice: 各样
  rationale: כָּל在此具有遍指意义；“各样”比“每一个”更适合修饰集合性的草木。
- source_word: יָרוֹק
  choice: 青绿的草木
  rationale: יָרוֹק实质化使用，泛指新鲜绿色植物；“青绿的草木”在现代汉语中自然，并保留其宽泛所指。
- source_word: יִדְרֹשׁ
  choice: 寻觅
  rationale: דרשׁ在此指为觅食而积极寻找；“寻觅”兼具持续搜寻的意味。
