  text: הֲ/יָדַ֗עְתָּ עֵ֭ת לֶ֣דֶת יַעֲלֵי סָ֑לַע חֹלֵ֖ל אַיָּל֣וֹת תִּשְׁמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/001.yaml
  text: Do you know the time when the mountain goats give birth? Do you watch over the deer in labor?[a][b][c]
translation:
  language: zh_hans
  text: 岩间的野山羊[a]何时生产，你知道吗？母鹿[b]分娩时，你留心察看[c]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“岩石的野山羊”；所指是栖居山岩的野山羊，可能是羱羊。
    reason: lexical_alternative
  - marker: b
    text: 原文特指雌鹿。
    reason: lexical_clarification
  - marker: c
    text: “留心察看”也可译作“观察”或“看守”；原词兼有留意、看守之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: 你知道吗
  rationale: 疑问词 הֲ 与 ידע 的第二人称阳性单数完成式在这里构成修辞问句；现代汉语用“你知道吗”自然表达其语用力量。
- source_word: עֵת לֶדֶת
  choice: 何时生产
  rationale: עֵת 表示时间或时节，后接 ילד 的不定式结构；译为“何时生产”既符合汉语习惯，也保留对生产时间的询问。
- source_word: יַעֲלֵי סָלַע
  choice: 岩间的野山羊
  rationale: 原文直指栖居岩石地带的野山羊，可能是野山羊属的羱羊；“岩间的野山羊”保留栖息环境和野生属性，又避免落实为某一现代动物分类。
- source_word: חֹלֵל
  choice: 分娩时
  rationale: 该词在此处表示生产时的阵痛或挣扎；“分娩时”在现代汉语中简洁自然，并由脚注补明其阵痛意味。
- source_word: אַיָּלוֹת
  choice: 母鹿
  rationale: 该复数阴性名词指雌鹿；“母鹿”比单称“鹿”更准确，也比古雅称谓更易懂。
- source_word: תִּשְׁמֹר
  choice: 留心察看
  rationale: שׁמר 可表示看守、留意或观察；本句重点在是否密切注意动物分娩，故用“留心察看”，既不弱化为偶然看见，也不额外限定为保护照料。
theological_decisions:
- issue: תִּשְׁמֹר 是否暗示保护性的照管
  choice: 留心察看
  alternative: 看顾／守护
  rationale: 原词容许“看守、留意、观察”等义，但本节的修辞焦点是人是否知道并密切观察野生动物生产；译文保留关注之意，同时不把保护性的神学含义强加给动词。
translation_notes:
  register: 采用现代、庄重而易懂的问句。“岩间的野山羊”避免把古代动物名称过度落实为现代分类；“留心察看”保留 שׁמר 在观察与看守之间的语义张力。三个脚注标记均紧随相应词语出现。
