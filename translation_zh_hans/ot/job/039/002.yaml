base_translation:
  language: en
  yaml_path: translation/ot/job/039/002.yaml
  text: Do you count the months they fulfill[a], and do you know the time when they give birth?
translation:
  language: zh_hans
  text: 它们怀胎几个月才足月，你能数算吗？它们产子的时刻，你知道吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּסְפֹּר
  choice: 你能数算吗
  rationale: 这是ספר的Qal未完成式第二人称阳性单数，在上帝连续诘问的语境中表达对约伯能力与认知的反问；“能……吗”比单纯将来时更符合现代汉语。
- source_word: יְרָחִים תְּמַלֶּאנָה
  choice: 怀胎足月，要经过几个月
  rationale: 字面结构是“它们使月份满了／它们满了月份”，主语为前文所说的雌兽。汉语用“怀胎足月，要经过几个月”自然表达妊娠期达到足月的意思，同时保留数算月份这一重点。
- source_word: וְיָדַעְתָּ
  choice: 你知道吗
  rationale: Qal完成式第二人称阳性单数带连接词，在并列的修辞问句中按当前认知来表达；汉语无需机械译出连接词“并且”。
- source_word: עֵת
  choice: 何时
  rationale: עֵת指时间或时刻；与分娩动作结合时，用疑问副词“何时”简洁自然，不额外加入“指定”的解释。
- source_word: לִדְתָּנָה
  choice: 它们生产
  rationale: 这是ילד的不定词附第三人称阴性复数词尾，指雌兽分娩。译为“生产”符合现代标准汉语，也清楚保留复数所指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诘问语气。将希伯来语较生硬的“它们使月份满了”按妊娠语境译作“怀胎足月，要经过几个月”，避免误解，同时不添加原文没有的神学解释。
