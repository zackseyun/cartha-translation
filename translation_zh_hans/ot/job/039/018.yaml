  yaml_path: translation/ot/job/039/018.yaml
  text: When she lifts herself up on high[b][a], she laughs at the horse and its rider.
translation:
  language: zh_hans
  text: 当她向高处升起时[a]，她嘲笑马和骑马的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当她在高处昂然升起时”或“当她拍动翅膀升到高处时”。希伯来语动词大概表示向上升起，但具体动作仍有争议。
    reason: lexical_alternative
  - marker: b
    text: “嘲笑”也可译作“嗤笑”“讥笑”或“轻视”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת
  choice: 一旦
  rationale: 此处引出鸵鸟动作发生之时；“一旦”既自然，又能表达随即出现后续结果的时间关系。
- source_word: בַּמָּרוֹם
  choice: 向高处
  rationale: מָרוֹם表示高度或高处；结合表示上升的动词，译作“向高处”能呈现方向，又不武断断定鸵鸟真正翱翔。
- source_word: תַּמְרִיא
  choice: 振翅奔向
  rationale: 该词在此大概表示使自己升起或昂然向上，但具体动作有争议。按鸵鸟语境译作“振翅奔向”较合乎画面，同时避免把它明确说成飞翔。
- source_word: תִּשְׂחַק
  choice: 嘲笑
  rationale: שׂחק可指发笑，也可指带轻蔑意味的嘲弄；这里以马和骑手为对象，“嘲笑”自然传达其胜过追赶者的诗意。
- source_word: לַסּוּס
  choice: 马
  rationale: 带冠词的单数在这里作类指；现代汉语直接说“马”最自然。
- source_word: וּלְרֹכְבוֹ
  choice: 和骑马的人
  rationale: 后缀回指马，意为骑在它上面的人；译作“骑马的人”清楚自然，并保留马与骑手的关联。
