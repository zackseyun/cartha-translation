  text: With fierceness and rage he devours the ground[b][a], and he cannot stand still at the sound of the trumpet.
translation:
  language: zh_hans
  text: 它带着激昂和狂怒，吞吃地面[a]；一听见号角声，就按捺不住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“吞下地面”，形容战马疾驰向前，仿佛迅速吞没脚下的路程。
    reason: lexical_alternative
  - marker: b
    text: “按捺不住”所译的动词通常也可译为“相信”；本句也可较直译为“它不相信有号角声”。原文在此的确切含义有争议；许多译者按上下文理解为战马无法安定或克制自己。
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּרַעַשׁ וְרֹגֶז
  choice: 猛烈狂怒
  rationale: 两个名词都可表达震动、骚动、激昂或暴怒；在战马冲锋的语境中合译为“猛烈狂怒”，自然地传达其狂烈激昂的状态，同时不把“震动”误解为地震。
- source_word: יְגַמֶּא
  choice: 吞吃
  rationale: 该动词本义是“吞下、吞咽”；与“大地”连用，生动描绘战马疾驰，仿佛把脚下的路程吞下去。
- source_word: אָרֶץ
  choice: 大地
  rationale: 此处指战马奔驰所越过的地面；“大地”既符合希伯来语的宽泛词义，也能保留“吞吃大地”这一诗性意象。
- source_word: וְלֹא יַאֲמִין
  choice: 它就按捺不住
  rationale: אמן 的使役形通常可表示“相信”，但此处可能具有“保持稳定、克制自己”的语境义。“按捺不住”符合战马听见战斗号角便急欲冲锋的画面；脚注保留更直译的理解。
- source_word: כִּי קוֹל שׁוֹפָר
  choice: 听见号角声
  rationale: כִּי 在此按语境引出触发战马反应的情形；שׁוֹפָר 是用于发信号的角号。“听见号角声”以自然汉语表达该关系，而不额外限定号角的材质。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而有动感的诗体汉语。以“吞吃大地”保留原文大胆的拟象，以“按捺不住”清楚呈现战马听见战斗号角后的急切反应，并在脚注中保留希伯来语动词的真实歧义。
