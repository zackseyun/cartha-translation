  text: because God has deprived her of wisdom and has not given her a share in understanding[a][b].
translation:
  language: zh_hans
  text: 因为上帝使她缺少智慧，也没有把悟性分给她[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使她缺少智慧”也可译作“使她忘记智慧”。
    reason: lexical_alternative
  - marker: b
    text: “把悟性分给她”直译为“在悟性上分给她”，意思是让她在悟性上有一份。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出鸵鸟有上述行为的原因，保留原文的因果关系。
- source_word: הִשָּׁהּ
  choice: 使她缺少
  rationale: 该词为使役形式，可表达使智慧从她那里缺失；此译自然，并保留上帝直接施动的含义，同时不把有争议的词义限定为单纯的“忘记”。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 准确对应《约伯记》中这一单数神称，现代汉语中庄重而通行。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 直接表达明智判断或本能能力，与语境相符。
- source_word: וְלֹא
  choice: 也没有
  rationale: 自然连接两个否定性陈述，保留希伯来语的并列关系。
- source_word: חָלַק לָהּ
  choice: 把……分给她
  rationale: 保留 חלק“分配、分给”的基本意象，比单译“赐给”更能体现分得一份的含义。
- source_word: בַּבִּינָה
  choice: 悟性
  rationale: 表达理解和辨别的能力，并与“智慧”形成自然且不完全重叠的对应。
theological_decisions:
- issue: 上帝与鸵鸟缺少智慧之间的施动关系
  choice: 明确译出上帝使她缺少智慧，并未把悟性分给她。
  alternative: 弱化为“她没有智慧和悟性”。
  rationale: 希伯来文明确以上帝为施动者；译文保留这一直接归因及其神学张力，不加以淡化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使她缺少”兼顾使役语义和词义歧义；“把悟性分给她”保留原文分配份额的意象。
