base_translation:
  language: en
  yaml_path: translation/ot/job/039/022.yaml
  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
translation:
  language: zh_hans
  text: 它嗤笑恐惧[a]，毫不惊惶，也不在刀剑面前退缩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它面对恐惧发笑。”希伯来语动词既可表示发笑，也可含嘲弄、轻蔑之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不从刀剑面前转身退去。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: 嗤笑
  rationale: שׂחק 的 Qal 未完成式可表示发笑，也可带嘲弄意味；在战马无所畏惧的语境中，“嗤笑”既保留鲜明拟人意象，也自然传达轻蔑意味。脚注列出较中性的译法。
- source_word: לְפַחַד
  choice: 恐惧
  rationale: פחד 可指惧怕、惊恐；“恐惧”准确而不过度强化，并适合与“嗤笑”搭配。
- source_word: יֵחָת
  choice: 惊惶
  rationale: חתת 的 Niphal 形式在此表示因威胁而丧胆、惊惶；“毫不惊惶”符合战斗语境，同时避免拘泥于“被击碎”的字面形象。
- source_word: יָשׁוּב
  choice: 退缩
  rationale: שׁוב 基本义为转回、返回；在迎战刀剑的语境中，“退缩”是自然的军事语境表达，正文保留其面对威胁而不后退的含义。
- source_word: מִפְּנֵי
  choice: 在……面前
  rationale: מִפְּנֵי 字面有“从……面前”之意，在此描绘面对刀剑而不退；译作“在刀剑面前”自然呈现其空间与威胁意味。
- source_word: חָרֶב
  choice: 刀剑
  rationale: חרב 为单数“剑、刀”，也可代表战场兵器或战争威胁；“刀剑”是现代汉语中庄重自然的概括性表达。
theological_decisions: []
