  yaml_path: translation/ot/job/006/020.yaml
  text: They are ashamed because they trusted[b][a]; they came there and were disappointed.
translation:
  language: zh_hans
  text: 他们因所信赖的而蒙羞[a]；来到那里[b]，就羞惭不已[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙羞”也可译作“失望”或“受辱”。原文“信赖”在形态上是单数，但前后动词均为复数，所指仍是上文的商旅队伍；其受信赖的对象在本句中未明说。
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: 直译“来到它那里”；“它”指上文季节性断流的溪谷。
    reason: cross_reference
  - marker: c
    text: 也可译作“狼狈不堪”“蒙受羞辱”或“困窘”。原文前后使用两个意义相近、都涉及羞耻和受挫的动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: 蒙羞
  rationale: 该词为复数形式，表示陷入羞愧或遭遇羞辱、失望。“蒙羞”既保留羞耻语义，也能表达所信赖之物落空后的结果。
- source_word: כִּי
  choice: 因
  rationale: 此处最自然地引出蒙羞的原因；简洁的“因”符合诗体，也清楚表达因果关系。
- source_word: בָטָח
  choice: 信赖它
  rationale: בטח的核心意义是信靠、倚赖。原文动词在形态上是第三人称阳性单数，但上下文前后均用复数指商旅队伍；正文按集合性主语译为“他们……信赖”，并补出承接前文溪流的宾语“它”。
- source_word: בָּאוּ
  choice: 来到
  rationale: 直接表达复数主语抵达目的地，符合בוא的基本意义。
- source_word: עָדֶיהָ
  choice: 那里
  rationale: 字面为“到它那里”，阴性后缀回指上文的溪流；现代汉语用“那里”更自然，同时保留目的地含义。
- source_word: וַיֶּחְפָּרוּ
  choice: 便羞愧难当
  rationale: חפר在此表示因落空而羞惭、窘迫或狼狈。“羞愧难当”保留其羞耻语义，并与前句“蒙羞”形成原文两个近义动词的呼应。
