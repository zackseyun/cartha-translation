  text: Is my help not within me[a], and has sound wisdom been driven from me?
translation:
  language: zh_hans
  text: 我里面岂不是毫无帮助吗？健全的智慧[a]岂不是已被从我赶走了吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “健全的智慧”也可译作“实际的智慧”“应变的才干”或“有效的谋划”；希伯来词 תושיה 可指实际的智慧、能力或有效的谋划。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאִם אֵין
  choice: 岂不……吗
  rationale: 这一组合引出带否定意味的反问；译为“岂不……吗”保留反问语气，也不把隐含答案写成直陈句。
- source_word: עֶזְרָתִי בִי
  choice: 我的帮助……在我里面
  rationale: עֶזְרָתִי直译为“我的帮助”，בִי可指“在我里面”；此译保留原文对内在助力或资源的表达。
- source_word: וְתֻשִׁיָּה
  choice: 谋略
  rationale: תּוּשִׁיָּה可表示健全而有效的智慧、才干或实际谋略；“谋略”在本句中自然，并保留其付诸实践的意味。
- source_word: נִדְּחָה מִמֶּנִּי
  choice: 已从我被赶走
  rationale: נִדְּחָה为被动，表示被驱逐、赶离；“从我被赶走”保留被动及离开说话者的方向。
theological_decisions:
- issue: 两个分句的反问关系
  choice: 两句都译成否定式反问
  alternative: 将第二句译为直陈句：“谋略已从我被赶走。”
  rationale: 希伯来语疑问词虽只显见于首句，但可统摄并列的第二分句；保留两者同为反问能体现原文可能的句法联系，同时不将约伯究竟是在否认还是痛陈自身资源尽失的问题过度简化。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“岂不……吗”传达诗歌中的反问语气；“在我里面”略带原文质感，以保留“内在资源”的意象。脚注标记置于全节末尾，对“谋略”的语义范围作说明。
