  yaml_path: translation/ot/job/006/007.yaml
  text: My soul refuses to touch them[b][a]; they are like the sickness of my food.
translation:
  language: zh_hans
  text: 我的心[a]不肯触碰它们；它们如同我食物的病[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的胃口”或“我自己”。希伯来语“נפש”可指“生命”“自我”“心”，在某些语境中也可指“食欲”。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来语高度凝缩，含义较难确定；也可译：“它们对我如同可憎的食物”，或“它们如同我食物的病患／病态”。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֲנָה
  choice: 不肯
  rationale: 该词表示拒绝、不愿意；“不肯”自然保留了主动排斥的意愿。
- source_word: לִנְגּוֹעַ
  choice: 碰
  rationale: נגע的基本义是“触碰”；此处用简洁的“碰”表达因厌恶而不愿接触。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נפש可指生命、自我、心性，也可在某些语境中指食欲。“我的心”既符合现代汉语诗性表达，也避免把含义限定为“胃口”。
- source_word: הֵמָּה
  choice: 它们
  rationale: 保留希伯来语代词的回指作用，所指承接上文约伯厌恶之物。
- source_word: כִּדְוֵי
  choice: 如同……中的病秽
  rationale: 该形式与疾病、患病有关，但与后面的“食物”构成的短语高度凝缩且难解。“病秽”保留疾病与污秽、令人作呕的联想，而不将隐喻完全解释掉。
- source_word: לַחְמִי
  choice: 我的食物
  rationale: לחם本义为“饼、食物”，此处泛指食物比专指“饼”更符合语境。
