base_translation:
  language: en
  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: zh_hans
  text: 请教导我，我就默不作声；请使我明白我错在何处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请使我明白我犯了什么错。”
    reason: 原文此处可询问错误所在，也可要求说明自己犯了什么错误；脚注保留“什么”与“何处”之间的表达幅度。
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: 请教导我
  rationale: 该词是ירה的使役命令式，意为“教导、指教”。加“请”自然表达约伯向朋友提出的请求，同时保留命令式的直接语气。
- source_word: וַאֲנִי אַחֲרִישׁ
  choice: 我就默不作声
  rationale: אַחֲרִישׁ表示沉默、不作声；“默不作声”庄重而自然。“就”体现前句请求与约伯回应之间的承接关系。
- source_word: וּמַה שָּׁגִיתִי
  choice: 我错在何处
  rationale: מַה字面为“什么”，与שָׁגִיתִי“我犯错、偏离”结合，是要求对方具体指出错误所在。“错在何处”符合现代汉语习惯，也保留对错误内容或方面的开放性。
- source_word: הָבִינוּ לִי
  choice: 请使我明白
  rationale: בין的使役命令式表达“使人明白”，לִי指向说话者。“使我明白”保留使役含义和直接诉求。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“默不作声”保持诗歌语体；两个“请”使连续命令式在中文中自然，同时不削弱约伯要求朋友明确指正的力度。
