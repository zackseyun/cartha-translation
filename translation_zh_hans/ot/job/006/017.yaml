  text: When they are warmed[a], they vanish; when it is hot[c][b], they dry up from their place.
translation:
  language: zh_hans
  text: 它们一受热，便消失[a]；热起来时[b]，它们便从原处干涸消失[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消失”和下句“干涸消失”也可译作“熄灭”或“止息”；希伯来文的意象交融了消失与熄灭。
    reason: lexical_alternative
  - marker: b
    text: 直译“在它的热中”，也可译作“在炎热中”。
    reason: lexical_alternative
  - marker: c
    text: 结合上下文，“原处”可能特指溪床或水道。
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵת
  choice: 一……就
  rationale: 介词与名词构成时间表达；结合两个平行分句，用“一……就”自然呈现时间与随即发生的结果。
- source_word: יְזֹרְבוּ
  choice: 受热
  rationale: 这个罕见动词表示变暖或被加热；“受热”简洁地保留其被动意味，不额外说明热源。
- source_word: נִצְמָתוּ
  choice: 消失了
  rationale: 该词的尼法勒词形可表示被终止、灭没或消失；在季节性溪流的语境中，“消失”贴合水流不复可见的景象，同时不把词义限死为“干涸”。
- source_word: בְּחֻמּוֹ
  choice: 炎热一来
  rationale: 原文直译为“在它的热中”；“炎热一来”在现代汉语中自然，并保留环境热力来临的含义。
- source_word: נִדְעֲכוּ
  choice: 干涸
  rationale: 该词可表示熄灭或止息；用于溪流水道时，“干涸”准确传达水流因热而消退的具体图景。
- source_word: מִמְּקוֹמָם
  choice: 从原处
  rationale: 原文为“从它们的地方”；“从原处”形式贴近且自然，不在正文中把“地方”进一步限定为河床或水道。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以两个平行分句再现希伯来诗句的节奏。保留“消失”与“干涸”之间略有重叠却不完全相同的意象，并通过脚注说明原文中“熄灭”的词义可能性。
