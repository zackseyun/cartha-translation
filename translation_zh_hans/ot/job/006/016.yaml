  text: which are dark from ice[a], and on them the snow conceals itself.
translation:
  language: zh_hans
  text: 因冰而发暗[a]，雪在其上藏身。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因冰而浑浊”。希伯来语分词的基本意思是“发暗”或“变暗”，但在这里也可能指溪水因冬季冰雪而变得浑浊。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: 发暗
  rationale: 该分词的基本义是“变暗、呈暗色”；“发暗”既保留视觉意象，也不把语境中可能的浑浊之意直接写入正文。
- source_word: מִנִּי
  choice: 因
  rationale: 此处介词可表示来源或原因；译作“因”自然地表达冰使溪水呈暗色的关系。
- source_word: קָרַח
  choice: 冰
  rationale: 该词可指冰或霜；下句另有雪，冬季溪流的意象中译作“冰”较贴切。
- source_word: עָלֵימוֹ
  choice: 在其上
  rationale: 保留空间关系；“其”承接上文所说的溪流。
- source_word: יִתְעַלֶּם
  choice: 藏身
  rationale: 该反身形态表达隐藏自己；“藏身”简洁地保留了诗句将雪拟人化的效果。
- source_word: שָׁלֶג
  choice: 积雪
  rationale: “积雪”在汉语中自然表达覆盖于溪流之上的雪，并与“藏身”形成清晰意象。
