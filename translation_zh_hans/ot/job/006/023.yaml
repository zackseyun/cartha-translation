  text: or[b][a], ‘Deliver me from the hand of the adversary,’ and ‘Redeem me from the hand of the ruthless’?”
translation:
  language: zh_hans
  text: 或是说：“救我[a]脱离仇敌之手，把我从残暴之人手中赎出来[b]”吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“搭救我脱离仇敌之手。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“把我从残暴之人手中救出来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: 救我脱离
  rationale: מלט的使役式命令表达使人逃脱、搭救之意。“救我脱离”既自然，也明确呈现从危险或控制中获救的含义；句首连接词结合上文的反问结构译为“或说”。
- source_word: מִיַּד
  choice: 脱离敌手／从……手中
  rationale: 保留希伯来语“从某人的手中”这一表示脱离其权势或控制的具体意象；前半句用现代汉语凝练的“脱离敌手”，后半句用“从……手中”。
- source_word: צָר
  choice: 敌手
  rationale: צָר指敌对之人，可译为敌人、仇敌或敌手。“敌手”保留单数及宽泛的敌对含义，又不过度限定为军事敌人。
- source_word: עָרִיצִים
  choice: 强暴者
  rationale: 该复数词指强横、残暴、以暴力压迫人的人。“强暴者”保留其道德和暴力色彩，同时避免“暴君”可能带来的特定政治含义。
- source_word: תִּפְדּוּנִי
  choice: 把我……赎出来
  rationale: פדה表示付出赎价或以其他方式使人获得释放。“赎出来”保留它与前半句מלט的词义区别，也符合此处从强暴者控制下获释的具体语境。
theological_decisions:
- issue: 在非祭祀、非直接救恩论语境中如何翻译פדה
  choice: 把我从强暴者手中赎出来
  alternative: 把我从强暴者手中救出来
  rationale: 这里的פדה可指从危险、奴役或控制下获得释放，不必专指属灵救赎。采用“赎出来”保留原词的释放或赎回意味以及与מלט的平行差异，同时由具体语境限制其含义，避免额外加入教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引号中的两个请求保持平行，但分别用“救……脱离”和“赎出来”呈现两个希伯来动词的差别。“或说”和句末“吗”承接上文未完的反问结构。
