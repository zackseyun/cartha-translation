base_translation:
  language: en
  yaml_path: translation/ot/job/006/012.yaml
  text: Is my strength the strength of stones[a], or is my flesh bronze?
translation:
  language: zh_hans
  text: 难道我的力量是石头的力量？难道我的肉身是铜吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: 难道……吗
  rationale: 两处 אִם 都引出反问，并非条件句；用“难道……吗”自然表达约伯所期待的否定回答。
- source_word: כֹּחַ / כֹּחִי
  choice: 力量／我的力量
  rationale: 保留希伯来文 כֹּחַ 的重复，也维持前半句强调自身承受力的修辞效果。
- source_word: אֲבָנִים
  choice: 石头
  rationale: 直译复数名词所表达的石质意象；汉语以“石头的力量”自然概括其坚硬、耐受的特性。
- source_word: בְּשָׂרִי
  choice: 我的肉身
  rationale: “肉身”既保留 בָּשָׂר 的肉体含义，又比单说“肉”更自然地指约伯脆弱的身体。
- source_word: נָחוּשׁ
  choice: 铜
  rationale: 该词可指铜或青铜；在没有进一步限定合金的语境中用较宽泛的“铜”，并保留与石头相并列的坚硬金属意象。
theological_decisions: []
