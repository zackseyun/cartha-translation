  text: כִּ֤י חִצֵּ֪י שַׁדַּ֡י עִמָּדִ֗/י אֲשֶׁ֣ר חֲ֭מָתָ/ם שֹׁתָ֣ה רוּחִ֑/י בִּעוּתֵ֖י אֱל֣וֹהַּ יַֽעַרְכֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: zh_hans
  text: 因为全能者的箭在我身上[a]；我的心灵饮着它们的毒液[b]；上帝的惊吓列阵攻击我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在我这里”或“与我同在”。希伯来语介词字面如此；但下文提到箭的毒液，表明这里也可理解为箭已临到约伯身上。
    reason: lexical_alternative
  - marker: b
    text: 也可译“它们的毒汁”或“它们的毒”。这个词还可作较抽象的“烈怒”。
    reason: lexical_alternative
  - marker: c
    text: “列阵攻击我”直译为“排列起来对付我”，采用军队摆开阵势的意象。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明约伯的哀叹为何如此沉重；保留解释或因果意味。
- source_word: חִצֵּי שַׁדַּי
  choice: 全能者的箭
  rationale: 直译复数“箭”，保留争战意象；שַׁדַּי 译作通行且自然的神圣称号“全能者”。
- source_word: עִמָּדִי
  choice: 射入我身
  rationale: 该介词字面可指“与我同在、在我这里”，但箭及其毒汁的语境表明箭已射中并留在约伯身上；补出“射入”使现代汉语清楚，同时以脚注保留字面歧义。
- source_word: חֲמָתָם
  choice: 箭上的毒汁
  rationale: חֵמָה 可指毒液，也可指烈怒；在箭的意象中，具体的“毒汁”最贴切。补出“箭上的”明确希伯来语第三人称复数后缀所指。
- source_word: שֹׁתָה רוּחִי
  choice: 我的心灵正饮下
  rationale: 保留“饮”的鲜明拟人意象；רוּחַ 在此指人的内在生命，译为“心灵”比“气息”自然；“正”表现持续承受的状态。
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: 上帝的惊吓
  rationale: בִּעוּתִים 指令人惊恐的事物或恐怖袭击；“惊吓”既可指恐惧本身，也可指带来恐惧的威吓，保留原文张力。אֱלוֹהַּ 译为“上帝”，与前面的“全能者”区分。
- source_word: יַעַרְכוּנִי
  choice: 列阵攻击我
  rationale: 动词具有排列、摆阵的军事色彩；“列阵攻击我”在现代汉语中清楚而有力，并保留敌军压境的比喻。
theological_decisions:
- issue: 平行句中 שַׁדַּי 与 אֱלוֹהַּ 两个神圣称谓的译法
  choice: 分别译为“全能者”和“上帝”
  alternative: 将 שַׁדַּי 音译为“沙代”，或把两个称谓统一译成同一名称
  rationale: 原文使用两个不同称谓。分别翻译既表达其意义，也不抹平诗句用词的变化。
- issue: חֲמָתָם 在箭之意象中的含义
  choice: 理解为箭的“毒汁”
  alternative: 译为“烈怒”或“震怒”
  rationale: 紧邻“箭”和“饮下”的意象支持具体的毒液含义，但脚注保留抽象译法的可能，不把神学意义限定得过死。
- issue: 约伯所受惊吓与上帝的关系
  choice: 直译为“上帝的惊吓”，不改写为上帝亲自敌对约伯的教义陈述
  alternative: 译成“上帝向我发怒”或“上帝亲自攻击我”
  rationale: 原文把这些惊吓归属于上帝，并以军队列阵作比喻；译文保留约伯的陈述及其张力，不额外推断其系统神学含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式保留原诗三个递进意象：中箭、饮毒、遭敌军列阵。以“心灵”表达内在生命，以“列阵攻击”保留军事意象；脚注交代关键词的真实歧义。
