  yaml_path: translation/ot/job/006/019.yaml
  text: The caravans of Tema looked[c][b][a]; the travelers of Sheba hoped for them.
translation:
  language: zh_hans
  text: 提玛的商队张望，示巴的旅队等候着它们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候着它们”也可译作“盼望它们”。原文动词可表示等候或怀着盼望期待；“它们”指上文所说的溪流。
    reason: 保留原文动词的语义范围，并说明复数代词的先行词。
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: 翘首观望
  rationale: 该动词意为观看、注视；在旷野旅队寻找水源的语境中，“翘首观望”自然表达带着期待的察看，又不另行补出原文未明说的宾语。
- source_word: אָרְחוֹת
  choice: 商队
  rationale: 该词本义可指道路、路径，但此处与下半句平行，并处于商旅寻找水源的语境，宜按转喻理解为行走在这些路线上的商队。
- source_word: תֵּמָא
  choice: 提玛
  rationale: 地名按现代中文圣经惯用译名音译。
- source_word: הֲלִיכֹת
  choice: 旅队
  rationale: 该词与行走、行程有关，此处指踏上旅程的一队人；“旅队”既与“商队”形成诗意平行，也避免生硬直译为“行程”。
- source_word: שְׁבָא
  choice: 示巴
  rationale: 地名按现代中文圣经惯用译名音译。
- source_word: קִוּוּ
  choice: 等候
  rationale: קוה可表示怀着盼望等候。此处旅队期待季节性溪流有水，“等候”自然贴合情境，同时以脚注保留“盼望”的词义可能。
- source_word: לָמוֹ
  choice: 它们
  rationale: 保留原文复数代词；其所指应是上文的溪流，但正文不显明补足，以维持原文的衔接方式。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“翘首观望”传达诗句中的期待感；“商队／旅队”保持上下两句的平行，同时避免将 אָרְחוֹת 机械译作道路。
