  yaml_path: translation/ot/job/006/011.yaml
  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
translation:
  language: zh_hans
  text: 我有什么力量，可以继续盼望[a]？我的结局又是什么，以致我还要延长我的生命[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可以继续等候”。
    reason: יחל可表示“盼望”或“等候”；正文采用较符合此处语境的“盼望”。
  - marker: b
    text: 希伯来语直译“延长我的生命”（字面“延长我的魂”）；也可按惯用义理解为“继续忍耐”或“持守忍耐”。
    reason: 保留“延长生命”的原文措辞，同时说明该短语可能含有持续忍耐的意思。
lexical_decisions:
- source_word: מַה כֹּחִי
  choice: 我有什么力量
  rationale: מַה引出反问，כֹּחַ指力量、能力；这样既保留原文的简洁，也切合约伯自觉无力承受的语境。
- source_word: כִּי אֲיַחֵל
  choice: 还能继续盼望
  rationale: יחל可表示等候或盼望；这里用“继续盼望”传达持续期待之意，并以脚注保留“等候”这一词义可能。
- source_word: וּמַה קִצִּי
  choice: 我会有什么结局
  rationale: קֵץ可指终点、尽头或结局。译作“结局”保留约伯对自身最终归宿的追问；“又”的关系由两句并列自然体现，无须机械直译连接词。
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: 还能坚持活下去
  rationale: 原文直译为“延长我的生命（נפש）”，在此表示继续存活或忍耐下去。“坚持活下去”在现代汉语中自然地兼顾生命延续与承受苦难两层含义。
theological_decisions:
- issue: 约伯是在否定盼望，还是质疑自己继续等待的能力与理由
  choice: 保留为反问，不明确断言他已完全绝望
  alternative: 译成陈述句，如“我已经没有力量，也没有盼望”
  rationale: 希伯来文使用两个平行反问，既表达深重绝望，也没有直接作出彻底否定盼望的教义性结论。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“还能”传达约伯在困境中质疑持续盼望与存活能力的语气；两句保持原文平行结构。
