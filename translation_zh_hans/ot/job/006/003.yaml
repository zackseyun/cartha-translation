- source_word: כִּי עַתָּה
  choice: 因为如今
  rationale: כִּי承接上文，为约伯的哀诉说明缘由；עַתָּה强调眼下的实际处境。
- source_word: מֵחוֹל יַמִּים
  choice: 比海沙还重
  rationale: 这是比较结构；“海沙”在现代汉语中自然凝练，也传达希伯来语“众海之沙”的总体意象。
- source_word: יִכְבָּד
  choice: 它……还重
  rationale: כבד意为“沉重”。动词的主语在本节省略，承接上一节所说的苦恼与灾害；译文以“它”保留这种回指，而不把某一项明定为唯一主语。
- source_word: עַל־כֵּן
  choice: 所以
  rationale: 标明前后因果：苦难极其沉重，因而约伯的话语失去约束。
- source_word: דְּבָרַי
  choice: 我的话
  rationale: 直接保留复数名词的集合意义，指约伯所说的话。
- source_word: לָעוּ
  choice: 失去了控制
  rationale: 此词词义疑难，语境可能指话语鲁莽、失序或不受约束。“失去了控制”在现代汉语中自然，同时避免过度确定其具体表现。
