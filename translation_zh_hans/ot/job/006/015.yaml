  yaml_path: translation/ot/job/006/015.yaml
  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
translation:
  language: zh_hans
  text: 我的弟兄背信弃义，像一条旱溪[a]；又像溪流的河道，终必消逝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“溪流……溪流的河道”。希伯来语 נחל 可指溪流、急流经过的山谷，或季节性水道；此处译作“旱溪”，以保留干旱地区的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: 我的弟兄
  rationale: 直译为“我的弟兄”。在本语境中也可能泛指亲近的同伴，但正文保留原文的亲属称谓及其可能的延伸含义。
- source_word: בָּגְדוּ
  choice: 背信弃义
  rationale: 该动词表示以诡诈、不忠的方式待人；“背信弃义”保留其关系和道德层面的强烈意味，又不限定为某一次具体的背叛行为。
- source_word: נָחַל
  choice: 旱溪
  rationale: 此处意象是干旱地区随季节出现、后来又消失的水道。“旱溪”既能体现其间歇性，也比普通的“溪流”更贴合下文景象。
- source_word: כַאֲפִיק נְחָלִים
  choice: 像溪谷中的水道
  rationale: אפיק可指水流经过的河床、水道或沟谷；这里用“溪谷中的水道”呈现地貌意象，同时避免把它误解为常年有水的河流。
- source_word: יַעֲבֹרוּ
  choice: 转眼便消逝
  rationale: 该词基本义为“经过、过去”。结合季节性水道的比喻，此处强调水流短暂、不能长存；“消逝”保留这种语境含义，而没有提前明说下文才展开的“干涸”。
