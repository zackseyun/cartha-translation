  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
translation:
  language: zh_hans
  text: 你们甚至拿孤儿来抽签[a]，把朋友拿来讨价还价[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们甚至使签落在孤儿身上。”希伯来文直译为“使……落在孤儿身上”；这里通常理解为把孤儿作为抽签处置的对象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为朋友挖坑。”这里的希伯来动词含义难以确定；不少人认为是指拿朋友交易，或从朋友身上牟利。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 甚至
  rationale: 这里用于加强指控，表达令人震惊的递进；“甚至”自然传达这种语气。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 指失去父亲、在社会中缺乏保护的人；现代汉语用“孤儿”简洁自然。
- source_word: תַּפִּילוּ
  choice: 抽签
  rationale: 使役形态与介词 עַל 连用，通常理解为使签落在某人身上，即“为……抽签”；保留了以弱者为处置对象的意象。
- source_word: תִכְרוּ
  choice: 讨价还价
  rationale: 此处动词含义困难；结合平行句，可能指把朋友当作交易或牟利的对象。“讨价还价”在汉语中自然，也保留该语境下较可能的意义。
- source_word: רֵיעֲכֶם
  choice: 朋友
  rationale: רֵעַ 可指朋友、同伴或邻舍；此处约伯直接责备身边的同伴，“朋友”最能凸显背叛意味。
- source_word: עַל ... עַל
  choice: 为……；拿……
  rationale: 希伯来文重复同一介词，但现代汉语若机械重复会显得生硬；按两处动词的自然搭配分别译出，同时保留两类人都被当作处置对象的平行关系。
