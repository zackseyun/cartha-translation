  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: zh_hans
  text: 我何曾说过[a]：“给我”，或说：“用你们的资财替我行贿[b]”？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里是带强调意味的反问，表示约伯从未提出过这样的要求。
    reason: discourse_clarification
  - marker: b
    text: “资财”所译的希伯来词本义为“力量”，在这里可能指资财、资源或经济能力。译为“行贿”的动词与“贿赂”同根；也有人将其较宽泛地理解为替约伯付出一笔款项或给予某种诱因。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: 我何曾说过
  rationale: 疑问词在语境中构成带强调意味的反问；“何曾”自然表达约伯否认自己提出过这类要求，同时保留“说”的基本词义。
- source_word: הָבוּ לִי
  choice: 请给我一些
  rationale: 复数命令式是对几位朋友说的。“给我”紧贴原文；补出“一些”使汉语引语完整自然，却不限定所给之物。
- source_word: וּמִכֹּחֲכֶם
  choice: 请从你们的财力中拿出钱来
  rationale: כֹּחַ本义是“力量”，在要求付出或馈赠的语境中可指经济能力、资财。“财力”既保留“能力”的语义联系，也符合此处的经济语境；“拿出钱来”自然承接后面的行动。
- source_word: שִׁחֲדוּ
  choice: 送礼疏通
  rationale: 该动词与“贿赂、礼物”同根，可指以礼物或款项促成某事。“送礼疏通”保留交易和诱导意味，又避免在对象未明时过度断定为法律意义上的行贿。
- source_word: בַעֲדִי
  choice: 为我
  rationale: 简洁表达“为了我、替我、代表我”的含义，并保留具体受益方式未明的空间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。引语中的两个请求保持平行；对כֹּחַ与שִׁחֲדוּ的多义性通过正文和脚注共同呈现，不把接受礼物或款项的对象补入正文。
