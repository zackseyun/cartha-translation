base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: zh_hans
  text: 但愿我的请求能实现，愿上帝把我所盼望的赐给我！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但愿我所求的实现，愿上帝赐给我我的盼望。”原文第一处动词字面为“来到”，后半句字面为“上帝给我的盼望”。
    reason: 保留“来到”与“给”的字面观察，同时提供自然、可读的替代译法；“我的盼望”也可理解为“我所盼望的事”。
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: 但愿
  rationale: 该惯用语在这里表达强烈愿望，并非真正询问“谁会赐下”。“但愿”自然、庄重，也符合约伯哀叹中的祈愿语气。
- source_word: תָּבוֹא
  choice: 得以实现
  rationale: 字面为“来到”，但主语是“我的请求”，语境所指是请求获得实现或应允；此译法在现代汉语中自然，并保留未实现愿望的意味。
- source_word: שֶׁאֱלָתִי
  choice: 我的请求
  rationale: 该名词指请求、所求之事。“我的请求”准确、简洁，也适合本段恳求的语境。
- source_word: וְתִקְוָתִי
  choice: 我所盼望的
  rationale: תִּקְוָה可指“希望、所盼望的事”。结合后面的“赐给”，译作具体化的“我所盼望的”比抽象的“我的希望”更符合现代汉语搭配，同时不预先说明其具体内容。
- source_word: יִתֵּן
  choice: 赐给
  rationale: 该动词基本义为“给”。主语是上帝时，“赐给”既贴近原义，也保持庄重自然；宾语译作“我所盼望的”，避免将其解释成“应允请求”而消除原文措辞。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 该词是《约伯记》中常用的单数“神、上帝”，本身不含“全能者”之义。采用现代标准普通话中清楚庄重的“上帝”。
