base_translation:
  language: en
  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: zh_hans
  text: 心灰意冷的人理当从朋友那里得到慈爱[b]，即使他离弃了对全能者的敬畏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“朋友若不向心灰意冷的人施慈爱，就是离弃对全能者的敬畏。”希伯来文句法简练，可作此理解。
    reason: alternative_reading
  - marker: b
    text: “慈爱”所译的希伯来词也可表达忠贞的爱、怜悯或信实。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּס
  choice: 灰心的人
  rationale: מָס源于“融化、消解”之意，此处比喻人在苦难中内心崩溃、失去勇气；“灰心的人”在现代汉语中自然地传达这一状态。
- source_word: מֵרֵעֵהוּ
  choice: 从朋友那里
  rationale: 介词מִן表示来源，רֵעַ后的第三人称单数后缀表明是他的朋友；中文按语境简洁译作“从朋友那里”。
- source_word: חָסֶד
  choice: 慈爱
  rationale: חֶסֶד在此人际语境中兼有仁慈、忠诚之爱和怜悯的意味；“慈爱”保留了比普通“善意”更深的关系忠诚色彩。
- source_word: וְיִרְאַת שַׁדַּי
  choice: 对全能者的敬畏
  rationale: יִרְאָה指向上帝时兼具畏惧与崇敬；“敬畏”是自然且具有经文分量的现代汉语表达。
- source_word: יַעֲזֹב
  choice: 离弃
  rationale: עזב意为离开、抛弃；“离弃”准确保留了此处的道德和宗教力度。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是《约伯记》中常见的神圣称号，译为“全能者”符合现代中文圣经语体。
theological_decisions:
- issue: 末句与前半句的句法关系
  choice: 把末句理解为让步：灰心的人即使离弃了对全能者的敬畏，仍理当从朋友那里得到慈爱。
  alternative: 把主语理解为不施慈爱的朋友：不向灰心者施慈爱的人，就是离弃对全能者的敬畏。
  rationale: 希伯来文高度凝缩，没有明示若干句法关系。正文所选读法能顺畅解释前置的לַמָּס及名词חָסֶד，并保留约伯要求朋友扶持受苦之人的语境；另一种重要且合理的读法置于脚注，以免消除原文的真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“理当……得到”补出希伯来文名词句所表达的应有关系；正文保留让步读法，脚注呈现另一种主要句法分析。
