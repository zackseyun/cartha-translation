  text: Can tasteless food be eaten without salt[a], or is there any taste in the slime of mallow?
translation:
  language: zh_hans
  text: 淡而无味的食物，不加盐能吃吗？锦葵的黏液有什么滋味呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句后半的希伯来语词义不确定。“锦葵的黏液”也可理解为“锦葵的汁液”；传统上也有人译作“蛋清”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: 能吃吗
  rationale: 疑问词与被动形未完成式构成反问；“能吃吗”既保留被动含义与反问语气，也符合现代汉语表达。
- source_word: תָּפֵל
  choice: 淡而无味的食物
  rationale: 该词指淡而无味、未经调味之物；补出语境中隐含的“食物”，使中文清楚自然。
- source_word: מִ/בְּלִי מֶלַח
  choice: 不加盐
  rationale: 表达盐的缺失；在食物语境中，“不加盐”比直译“没有盐”更自然。
- source_word: אִם יֶשׁ
  choice: 有什么……呢
  rationale: 此处引出与前句平行的第二个反问；用“有什么……呢”自然呈现其修辞力度。
- source_word: טַעַם
  choice: 滋味
  rationale: 指味道、风味；“滋味”与食品语境相称，也与前句“无味”形成呼应。
- source_word: בְּ/רִיר
  choice: 黏液
  rationale: 该罕见词可能指黏稠液体、汁液或类似黏液之物；正文采用能体现贬抑语气的“黏液”，并以脚注保留不确定性。
- source_word: חַלָּמוּת
  choice: 锦葵
  rationale: 该词所指植物不确定；“锦葵”是常见学术理解之一，正文采用此译，脚注注明其他传统解释。
