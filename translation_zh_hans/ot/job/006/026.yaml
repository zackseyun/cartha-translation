base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: zh_hans
  text: 你们以为可以责备言词吗？绝望之人的话，难道是随风而去的吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们以为可以责备言词，并把绝望之人的话当作风吗？”希伯来语后半句可理解为一个判断，即绝望之人的话归于风、随风而去；也可理解为“责备”的内容，即把这样的话视作风。
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  choice: 责备
  rationale: יכח的不定式在这里带有批评、指正并驳斥的意味；“责备”保留了话语中的对抗性和评价色彩。
- source_word: מִלִּים
  choice: 言词
  rationale: 直译为“话/言词”。此处选“言词”以自然表达朋友们把注意力放在约伯措辞本身上的意思，同时不在正文中擅自加入“空话”等贬义。
- source_word: תַּחְשֹׁבוּ
  choice: 想
  rationale: חשב可表示“想、盘算、打算”。在反问句中，“想”简洁自然，也保留“认为”与“意图”之间的语义余地。
- source_word: וּ֝/לְ/ר֗וּחַ
  choice: 不过是风
  rationale: רוּחַ按其形象译为“风”，表示转瞬即逝、没有分量；ל的具体句法关系存在歧义，正文将其理解为表语关系。
- source_word: אִמְרֵי
  choice: 话
  rationale: אמר的复数构造形式指所说的话；译为现代汉语自然的“话”，并与前半句形成意义上的呼应。
- source_word: נֹאָשׁ
  choice: 绝望之人
  rationale: נואש的被动分词表示已经失去盼望、陷于绝望的人；“绝望之人”保留单数及其人格性，又避免“亡命之徒”等现代歧义。
theological_decisions:
- issue: 后半句与前半句的句法关系
  choice: 将后半句作为并列反问：“绝望之人的话不过是风吗？”
  alternative: 将后半句纳入“责备”的内容：“你们想责备言词，把绝望之人的话当作风吗？”
  rationale: 希伯来语省略成分，לְרוּחַ既可形成关于这些话的判断，也可理解为朋友们责备时对这些话的处置。正文采用汉语中较清楚的并列反问，脚注保留另一种可行分析，不据此引申特定神学判断。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句。“言词”略带正式色彩，用以区别前半句对措辞本身的挑剔；后半句用更自然的“话”。保留“风”的原文意象和句法歧义。
