  yaml_path: translation/ot/job/006/005.yaml
  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
translation:
  language: zh_hans
  text: 野驴[a]有青草吃，还会嘶叫吗？牛有饲料[b]吃，还会哞叫吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文特指野驴，也就是野生的驴类动物。
    reason: lexical_alternative
  - marker: b
    text: “饲料”所译的希伯来词，指拌合的牲畜饲料或饲料糊。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִֽנְהַק
  choice: 还会嘶叫吗
  rationale: נהק指驴一类动物的叫声。“嘶叫”比泛称的“叫喊”更具体；配合“还会”表达反问语气，但不把问题改写成陈述。
- source_word: פֶּרֶא
  choice: 野驴
  rationale: פֶּרֶא特指野驴或亚洲野驴。“野驴”是现代汉语中清楚、准确且不显生僻的名称。
- source_word: עֲלֵי דֶשֶׁא
  choice: 有青草吃
  rationale: 字面意象是“在青草之上／对着青草”，语境所指的是青草就在眼前、可供食用。译为“有青草吃”自然地传达反问的处境含义。
- source_word: אִם
  choice: （第二个并列问句）
  rationale: אִם在两个并列反问之间引出第二项；汉语无需硬译“或是”，以两个连续问句即可自然保留平行结构。
- source_word: יִגְעֶה
  choice: 哞叫
  rationale: געה表示牛的低鸣声。“哞叫”是现代汉语对牛叫声最明确、自然的表达，力度也不像“吼叫”那样过强。
- source_word: שּׁוֹר
  choice: 牛
  rationale: שׁוֹר可泛指单数牛科家畜；此处性别与是否阉割并非重点。“牛”比“公牛”或“阉牛”更稳妥。
- source_word: עַל בְּלִילֽ/וֹ
  choice: 有饲料吃
  rationale: בְּלִיל指拌合的牲畜饲料，词尾为第三人称阳性单数所属形式。汉语用“有饲料吃”与上半句平行；具体词义在脚注说明。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。两个并列反问以“有……吃，还会……吗”呈现，使约伯用动物不在食物充足时鸣叫来说明有因才发声的含义清楚可懂，同时保留原文的反问与平行结构。
