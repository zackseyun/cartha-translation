base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: zh_hans
  text: 这仍将是我的安慰[a]；我会在毫不减轻的痛苦中欢欣，因为我没有否认圣者的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作：“这仍将是我的安慰；我会在痛苦中欢欣；他毫不顾惜我。”本句中间部分的希伯来语紧缩难解。
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: 我的安慰
  rationale: 该名词表示安慰、慰藉；“我的安慰”自然明确，也保留约伯所说仍可给他慰藉之事的情感含义。
- source_word: וַאֲסַלְּדָה
  choice: 我会……欢欣
  rationale: סלד是罕见且释义困难的动词；上下文指强烈、甚至带有抗争意味的欣喜。“欢欣”既保留这种强度，又不把不确定的具体动作形象强加给原文。
- source_word: בְחִילָה
  choice: 在……痛苦中
  rationale: חילה可指翻腾、剧痛或苦楚；“痛苦”是现代汉语中自然且涵盖面适当的表达。
- source_word: לֹא יַחְמֹל
  choice: 毫不止息的
  rationale: חמל通常表示怜惜或不加伤害；此处希伯来语极为紧缩。正文将其与“痛苦”合译为“毫不止息的痛苦”，表达痛苦未蒙减免、持续不止；较形式对应的译法保留在脚注。
- source_word: כִחַדְתִּי
  choice: 我没有否认
  rationale: כחד的加强词干可表示否认、隐瞒或压下不说。与“那圣者的话”搭配时，“否认”最自然地表达约伯没有背弃或拒绝这些话，同时不排除原词的相关语义。
- source_word: אִמְרֵי
  choice: ……的话
  rationale: אמרה的复数附属形式指所说的话或言语；现代汉语用“话”简洁自然。
- source_word: קָדוֹשׁ
  choice: 那圣者
  rationale: 该形容词在此名词化，语境中指上帝。“那圣者”保留神圣称号的性质，又符合现代汉语表达。
theological_decisions:
- issue: 神圣称号 קָדוֹשׁ
  choice: 那圣者
  alternative: 圣者；那位圣洁者
  rationale: 上下文表明这是对上帝的称呼，而非泛指某个圣洁的人。“那圣者”保留称号的神学分量，不额外引入特定宗派术语。
- issue: 难解短语 בְחִילָה לֹא יַחְמֹל 的解释
  choice: 在毫不止息的痛苦中
  alternative: 在他毫不留情的痛苦中；在痛苦中，任他不顾惜
  rationale: 原文语法紧缩，主语和各词关系并不完全明确。正文采用通顺译法，表达痛苦持续而未获减免；脚注给出较形式对应的可能译法，以保存原文的歧义和张力。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“欢欣”比“高兴”更能表现罕见动词所含的强烈情绪；“毫不止息的痛苦”使正文可读，同时借脚注公开原文在句法和施事者方面的不确定性。
