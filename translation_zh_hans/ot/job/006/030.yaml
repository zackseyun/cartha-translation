translation:
  language: zh_hans
  text: 我的舌头上岂有不义？我的腭岂不能辨别祸患？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”也可译作“乖谬之事”或“毁灭性的事”。原文这个词可指带来毁灭的邪恶、灾祸，也可指道德上乖谬的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: 岂会有／岂会说
  rationale: 引出期待否定回答的反问；结合“舌头”所指的言语功能，译为“岂会说”更符合现代汉语。
- source_word: בִּלְשׁוֹנִי
  choice: 我的舌头
  rationale: 保留原文以身体器官指代言语的具体意象，而不泛化为“我的话”。
- source_word: עַוְלָה
  choice: 不义的话
  rationale: 该词表示道德上的不正、不义；补出“话”使“舌头说不义”在汉语中自然，同时保留其道德分量。
- source_word: אִם
  choice: 岂
  rationale: 在这里承接前句，引出第二个平行反问；“岂”准确表达其语用功能。
- source_word: חִכִּי
  choice: 我的腭
  rationale: 原词直指口腔中的“腭”，并以味觉分辨作为隐喻；此译保留身体意象，避免直接解释成“判断力”。
- source_word: לֹא יָבִין
  choice: 岂不能辨别
  rationale: בין 在此表示分辨、识别；“辨别”也适合与腭的品尝、分辨意象搭配。
- source_word: הַוּוֹת
  choice: 祸患
  rationale: 该复数词可指毁灭性的灾祸，也可带有邪恶、乖谬之意；正文采用与约伯苦难语境相称的“祸患”，并在脚注保留其他可能。
theological_decisions:
- issue: הַוּוֹת 指外在灾祸还是道德上的乖谬
  choice: 正文译作“祸患”
  alternative: “乖谬之事”或“毁灭性的事”
  rationale: 原词的语义范围同时涉及灾难性毁坏和道德邪恶，语境不足以彻底排除任一方向，因此正文按苦难语境选“祸患”，脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而简洁的反问句式。“腭”虽较书面，却是现代汉语中准确的身体部位名称，并能保留原文以味觉表达分辨力的意象。
