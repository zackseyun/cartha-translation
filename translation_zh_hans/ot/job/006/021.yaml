  rationale: 修订“却”为“因为”，使中文明确承接 כִּי 所引出的说明，同时仍允许本句与前文的反差存在。以“惊骇”翻译 חֲתַת，避免正文在“恐惧”与“灾祸”两种词义之间作不必要的取舍；脚注则清楚保留“灾祸”的替代理解。其余措辞保留原稿对不寻常的“成了不／虚无”之处理及相应脚注。
