base_translation:
  language: en
  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
translation:
  language: zh_hans
  text: 因为如今你们成了虚无[a]；你们看见惊骇[b]，就惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近似“你们成了不”。这句话也常被理解为“你们成了虚无”，或“你们也成了那样”，即像前几节所说靠不住的溪流一样。
    reason: textual_variant
  - marker: b
    text: 或译：“你们看见灾祸，就惧怕。”这里的名词可指恐怖、惊惶，也可指使人崩溃的灾祸。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 却
  rationale: 本句承接前文季节性溪流的比喻并转向约伯朋友当前的表现；中文用“却”自然表达期待与现实之间的反差，不强行将其处理为严格因果。
- source_word: עַתָּה
  choice: 如今
  rationale: 标明眼前的情形，与先前的期待形成对照，语体庄重而自然。
- source_word: הֱיִיתֶם
  choice: 你们……成了
  rationale: 将 היה 理解为状态发生变化，表明朋友们如今显出如前文溪流一般靠不住。
- source_word: לא
  choice: 虚无
  rationale: 马所拉文本写作“לא”（不），直译“成了不”在中文无法成立；“成了虚无”保留原文异常而含混的表达，并传达他们毫无帮助的语境意义，同时以脚注说明。
- source_word: תִּרְאוּ
  choice: 你们看见
  rationale: 保留 ראה 的基本视觉义，不额外限定朋友所看见的是约伯本人还是他的遭遇。
- source_word: חֲתַת
  choice: 可怕的灾祸
  rationale: 此词可指恐怖、惊惶或毁灭性的灾难；正文兼顾所见之灾与引发的恐惧，脚注保留其他可能。
- source_word: וַתִּירָאוּ
  choice: 就害怕了
  rationale: 表达朋友看见约伯惨况后的恐惧反应；“就”自然呈现前后动作的紧密关联。
