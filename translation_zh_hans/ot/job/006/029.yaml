  text: שֻֽׁבוּ נָ֭א אַל תְּהִ֣י עַוְלָ֑ה ו/שבי ע֝וֹד צִדְקִ/י בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: zh_hans
  text: 请重新考虑[a]，不要有不公；再想想，我在这事上仍是正直的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请回转，不要有不公；再回转，我的正直仍在其中。”末句也可译：“我在这件事上仍有理。”
    reason: “回转”较贴近שוב的字面意象；“我的正直仍在其中”保留צִדְקִי בָהּ的名词形式及代词先行词未明的特点。“仍有理”则反映其可作司法性／正当性理解。
lexical_decisions:
- source_word: שֻֽׁבוּ
  choice: 回心转意
  rationale: 这是שוב的复数祈使式；语境中约伯要求朋友改变先前的判断。“回心转意”自然表达转回、重新考虑之意，同时保留转向的意象。
- source_word: נָא
  choice: 请
  rationale: 该语气词缓和祈使语气，现代汉语用“请”最自然。
- source_word: אַל תְּהִי עַוְלָה
  choice: 不要再有不公
  rationale: 保留原文“不可有不公”的非人称表达，不把主语过度限定为朋友；“再”在汉语中结合上下文表示不要让先前的不公继续发生。
- source_word: עַוְלָה
  choice: 不公
  rationale: 在朋友评断约伯的争辩语境中，“不公”兼具不公平和错误裁断的司法意味。
- source_word: ו/שבי（马所拉旁读：וְשֻׁבוּ）
  choice: 再回心转意吧
  rationale: WLC正文在此反映书写形式与旁读信息；按马所拉旁读理解为再次出现的复数祈使式。“再”传达重复和加强的劝告，“吧”使呼吁符合自然汉语。
- source_word: עוֹד
  choice: 仍
  rationale: 此处最自然地表示约伯的正直依然成立，而不是又一次的动作。
- source_word: צִדְקִי
  choice: 我是正直的
  rationale: צדק带有道德与司法双重色彩；在本争议中指约伯在这件事上的清白、正当或正直，不表示绝对无罪。“我是正直的”比名词化的“我的义”更符合现代汉语。
- source_word: בָהּ
  choice: 在这事上
  rationale: 阴性代词的明确先行词没有明说，可能指当前争议或案件。“在这事上”自然补出隐含关系，但不进一步限定具体所指。
theological_decisions:
- issue: 约伯关于צִדְקִי的宣称
  choice: 译为“我在这事上仍是正直的”，表达他在当前争议中的正直或清白。
  alternative: 可译为“我的理仍在其中”或“我在这件事上仍有理”。
  rationale: 语境是朋友对约伯的评断。此译保留道德—司法张力，却不把约伯的话扩大为自称毫无罪性，也不预先判定最终裁决。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“回心转意”比直译“转回”更易懂；两次重复保留原文迫切的劝告。主句避免宗派化术语，并以“在这事上”限定约伯的正直宣称。
