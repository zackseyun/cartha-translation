  text: וְ/יֹאֵ֣ל אֱ֭לוֹהַּ וִֽ/ידַכְּאֵ֑/נִי יַתֵּ֥ר יָ֝ד֗/וֹ וִֽ/יבַצְּעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/009.yaml
  text: that God would be willing to crush me[c][b][a], that he would let loose his hand and cut me off.
translation:
  language: zh_hans
  text: 惟愿上帝肯压碎我[a]，愿他松开他的手[b]，把我剪除[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“惟愿上帝乐意压碎我。”原文动词表示愿意、乐意或允准。
    reason: lexical_alternative
  - marker: b
    text: 直译：“松开他的手。”这是具体形象的说法，指他不再约束自己的手而施行打击。
    reason: cultural_note
  - marker: c
    text: 或译：“把我割断”或“把我彻底了结”。原文表达决定性、最终的毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאֵל
  choice: 愿……肯
  rationale: 该动词使役形在这里表达意愿或同意；结合愿望语境，用“愿……肯”既自然，又保留约伯盼望上帝愿意采取行动的语气。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的单数神称，直译为“上帝”即可，无须音译。
- source_word: וִידַכְּאֵנִי
  choice: 压碎我
  rationale: דכא 的加强词干表示压碎、摧毁；“压碎”保留原文强烈而痛苦的意象。
- source_word: יַתֵּר
  choice: 松开
  rationale: 该词在这里有松开、放开的意思；与“他的手”连用，表现不再约束、任手施力的具体意象。
- source_word: יָדוֹ
  choice: 他的手
  rationale: 保留原文拟人化表达，不抽象改写为“能力”或“审判”。
- source_word: וִיבַצְּעֵנִי
  choice: 把我剪除
  rationale: בצע 在此可表达割断、剪除，使生命终结；“剪除”既保留切断的图像，也传达决定性的终结，同时不限定具体方式。
theological_decisions:
- issue: 上帝行动的拟人化表达
  choice: 保留“他的手”
  alternative: 他的能力；他的审判
  rationale: 希伯来文用身体意象表达上帝亲自行动及其力量。保留这一表达可维持约伯恳求的具体性和情感力度，并不要求按字面理解上帝具有肉身。
- issue: 约伯所求之事的终局性
  choice: 译为“把我剪除”
  alternative: 杀死我；了结我
  rationale: 经文明确指向决定性的毁灭与生命终结，但原词仍带有割断的图像；译文保留该图像，不把含义缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。“愿……肯”呈现愿望祈求及意愿色彩；“压碎”“松开他的手”“剪除”保留希伯来文连续而强烈的动作意象。脚注标记按相关词语依次置于正文中。
