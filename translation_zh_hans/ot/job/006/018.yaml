base_translation:
  language: en
  yaml_path: translation/ot/job/006/018.yaml
  text: The paths of their course wind away[a]; they go up into wasteland and perish.
translation:
  language: zh_hans
  text: 它们行程所经的路径蜿蜒离去[a]；它们上到荒芜之地，就消失了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“商队的路线转向；它们上到荒芜之地，就消失了。”希伯来文的意象较难确定；一些解释者认为本节所说的是商队，而非路径或水道本身。
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: 蜿蜒而去
  rationale: 该词为 לפת 的未完成时复数形式，可表达扭转、蜿蜒或偏离。结合上文溪流、河道的比喻，“蜿蜒而去”既保留动态意象，也不把解释限定为商队主动改道。
- source_word: אָרְחוֹת
  choice: 路径
  rationale: אָרְחוֹת 通常指道路、路径或辙迹；此处先按字面处理，与“行程”构成较难却可理解的希伯来表达，不在正文中直接转喻为“商队”。
- source_word: דַּרְכָּם
  choice: 它们行程的
  rationale: דֶּרֶךְ 基本义为道路、行程或路线。译作“行程”可避免与“路径”机械重复，也适合水道走向的语境；复数代词所指在意象上保留一定开放性。
- source_word: יַעֲלוּ
  choice: 进入
  rationale: עלה 本义为上去、升上；但与 בַתֹּהוּ 连用时，若直译“上到荒漠”在现代汉语中容易误解为垂直上升。“进入”表达朝荒芜之地而去的运动，同时脚注保留更形式对应的“上到”。
- source_word: בַתֹּהוּ
  choice: 荒漠
  rationale: תֹהוּ 可指虚空、荒芜、废墟般的空无。此处沙漠水道的语境支持“荒漠”，既自然又保留荒芜空无之感。
- source_word: וְיֹאבֵדוּ
  choice: 消失无踪
  rationale: אבד 在 Qal 中可指灭亡、失落或消失。就溪流进入荒地而不复可见的意象而言，“消失无踪”比“灭亡”自然，也不削弱其归于无有的结果。
