  text: How forceful are upright words! But what does reproof from you prove?[a]
translation:
  language: zh_hans
  text: 正直的话多么有力！但你们的责备能证明什么呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坦诚的话多么令人痛切！但你们的争辩能证明什么呢？”首句的希伯来语可有“有力”“有说服力”或“令人痛切”等意味；后句的相关词也可指争辩、指责或责备。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: 多么有力
  rationale: מַה在这里表示感叹的程度；נמרצו的语义可涉及强劲、有说服力或令人痛切。正文采用“多么有力”，既自然，也保留话语具有力量的核心意思。
- source_word: אִמְרֵי יֹשֶׁר
  choice: 正直的话
  rationale: אִמְרֵי意为言语、话语；יֹשֶׁר表示正直、正当或坦诚。“正直的话”保留原文的道德意味和“正直”意象。
- source_word: וּמַה
  choice: 但……什么呢
  rationale: 连接词字面可译“而/和”，但上下文呈现真实正直的话与朋友责备之间的对比，因此用“但”自然表达反诘语气。
- source_word: יוֹכִיחַ הוֹכֵחַ
  choice: 责备能证明
  rationale: 两个词同出יכח词根，可分别涉及证明、辩明、指责或责备。汉语难以自然复制原文词根复现，故译为“责备能证明”，保留行为与成效之间的反诘张力。
- source_word: מִכֶּם
  choice: 你们的
  rationale: מן加第二人称复数表示来源，即“出于你们”。在现代汉语中以“你们的责备”表达最自然，并清楚指出责备来自约伯的朋友。
