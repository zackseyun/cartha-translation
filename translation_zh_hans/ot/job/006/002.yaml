  yaml_path: translation/ot/job/006/002.yaml
  text: Oh[a], that my vexation were fully weighed[b], and my calamity lifted together in the balances.
translation:
  language: zh_hans
  text: 惟愿我的苦恼[a]被充分称量，我的灾祸也与它一同放在天平上！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦恼”也可译作“愤懑”或“悲苦”。希伯来词可指内心的痛苦、烦乱，也可指恼怒。
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: 惟愿
  rationale: 引出带有哀叹意味的愿望；“惟愿”既保留情感力度，也符合庄重的现代汉语诗体。
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: 被好好称量
  rationale: 不定式绝对形与限定动词连用，加强“称量”的语气；“好好”自然表达充分、切实称量之意，同时保留被动结构。
- source_word: כַּעְשִׂי
  choice: 我的苦恼
  rationale: 该词可指内心的愁苦、烦乱、愤懑或恼怒；本句重在约伯所承受的内在痛苦，“苦恼”较能涵盖这种语义范围，又不把意思局限为愤怒。
- source_word: וְהַוָּתִי
  choice: 我的灾祸
  rationale: 该词表示灾难、毁灭或祸患；“灾祸”清楚指向约伯遭遇的客观苦难，并与“苦恼”形成内外相应。
- source_word: בְּמֹאזְנַיִם
  choice: 在天平上
  rationale: 原文为表示称重器具的双数形式；现代汉语以“天平”表达最自然清楚。
- source_word: יִשְׂאוּ
  choice: 放在
  rationale: 字面义为“举起、抬起、承载”，主语为未指明的复数；在称量语境中，汉语自然表达为把灾祸“放在”天平上。
- source_word: יָחַד
  choice: 一同
  rationale: 表明苦恼与灾祸共同接受称量；“一同”简洁保留联合称量的意思。
