  yaml_path: translation/ot/job/006/028.yaml
  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
translation:
  language: zh_hans
  text: 但现在，请看着我[a]；我岂会当着你们的面[b]说谎[c]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“转向我”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在你们的脸面前”；意思是“在你们面前”或“当面”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“说假话”或“欺骗”。希伯来语动词可指说谎、说虚假的话，也可含欺骗之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出约伯眼前的直接请求；汉语“现在”自然表达时间推进，语境中的转折意味由上下文体现。
- source_word: הוֹאִילוּ
  choice: 请
  rationale: 该意愿动词的命令式在另一命令式之前构成恳请；译作“请”最符合现代汉语表达。
- source_word: פְנוּ בִי
  choice: 看着我
  rationale: פנה与介词ב连用，可指转向某人或把注意力投向某人；“看着我”自然传达约伯要求听者直接面对并察看他的意思，同时在脚注保留“转向我”这一较贴近动作意象的译法。
- source_word: וְעַל פְּנֵיכֶם
  choice: 当着你们的面
  rationale: 保留“面”的具体意象，又以自然汉语表达“在你们面前、直接对着你们”的意思。
- source_word: אִם אֲכַזֵּב
  choice: 我岂会……说谎呢？
  rationale: 此处אִם在语境中引出反问式挑战，并非普通条件句；כזב的使强词干可指说谎、说假话或欺骗。“岂会……呢”保留反问语气而不把含义收窄为蓄意欺骗。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的反问句式。“当着你们的面”既保留希伯来语“脸面”的具体意象，也避免生硬直译。所有词义差异均置于脚注，正文不额外判定约伯所强调的是一般虚假还是蓄意欺骗。
