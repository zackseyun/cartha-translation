  text: The eye that saw him will not see him again[a], and his place will no longer see him.
translation:
  language: zh_hans
  text: 曾看见他的眼睛必不再看见他；他原来的地方也不再望见他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“曾凝视他的眼睛必不再凝视他。”希伯来原文以单数“眼睛”作诗性表达，并在下一行把“他原来的地方”拟人化。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: 眼睛
  rationale: 保留希伯来诗歌中的单数“眼睛”，不将其意译为“人”，以维持鲜明的诗性表达。
- source_word: שְׁזָפַתּוּ
  choice: 看过他
  rationale: 该动词可指“看见”或“凝视”；此处用自然的现代汉语“看过他”，并与后半句的视觉意象呼应。
- source_word: וְלֹא תוֹסִיף
  choice: 必不再看见他
  rationale: יסף与否定词连用表示“不再”；汉语中补出由上文承接的“看见他”，使句意完整清楚。
- source_word: וְלֹא עוֹד
  choice: 也不再
  rationale: 准确表达“不再、再也不”的终止含义，并呈现两个诗行之间的平行关系。
- source_word: תְּשׁוּרֶנּוּ
  choice: 见到他
  rationale: שׁור意为“观看、看见”；译作“见到他”既自然，又以轻微措辞变化保留原诗两个近义动词的区别。
- source_word: מְקוֹמוֹ
  choice: 他的住处
  rationale: 字面为“他的地方”；上下文指他原来所在之处，译作“他的住处”能自然承载原文将地方拟人化的表达。
theological_decisions: []
translation_notes:
