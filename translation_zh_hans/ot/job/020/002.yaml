  yaml_path: translation/ot/job/020/002.yaml
  text: Therefore my thoughts answer me[b][a], because of my inward agitation.
translation:
  language: zh_hans
  text: 所以，我的思绪催我回答[a]，因为我心里焦躁不安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的思绪回答我”，也可理解为“我的思绪使我回答”。希伯来语表达简练，既可能是说思绪在他里面作出回应，也可能是说思绪促使他开口回应。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为我内心急切”。这里的希伯来词可指急速、急切；按上下文，也可能指内心的焦躁、激动或迫切。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 表示承接上文所得出的结果或回应缘由；“所以”自然、清楚地保留了推论关系。
- source_word: שְׂעִפַּי
  choice: 我的思绪
  rationale: 该复数名词可指纷杂、令人不安或分歧的念头；正文用较宽泛的“思绪”，避免加入原文未明确表达的修饰，同时上下文仍显出其不安性质。
- source_word: יְשִׁיבוּנִי
  choice: 催我回答
  rationale: 这是 שוב 的使役形，压缩的诗歌表达可理解为思绪在他里面作答，也可理解为思绪促使他回应。“催我回答”在现代汉语中自然，并与下句的急迫感相连；脚注保留另一种分析。
- source_word: וּבַעֲבוּר
  choice: 因为
  rationale: 此介词短语表达原因；前缀连接词在汉语中不必生硬译作“并且”，以“因为”即可清楚呈现因果关系。
- source_word: חוּשִׁי
  choice: 焦躁不安
  rationale: 该词与“急速、急切”有关，此处也可表示内在的激动、躁动或迫切。“焦躁不安”切合琐法被激起而急于回应的语境。
- source_word: בִי
  choice: 我里面
  rationale: 直译其内在位置，表明这种焦躁或急切是在说话者内心发生的。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文以“催我回答”顺畅表达希伯来诗句的使役结构，但借脚注保留“思绪回答我”与“使我回答”之间的真实歧义；“焦躁不安”体现内在激动，同时注明“急切”的词义可能。
