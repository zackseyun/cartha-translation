  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: zh_hans
  text: 他吞下财富[a]，却要把它吐出来；上帝要把它从他腹中[b]赶出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”或译“财物”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“腹中”，延续财富被吞下、又被强行排出的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: 财富
  rationale: 在本节恶人吞下不义所得的语境中，该词指物质财富或财物；“财富”既准确又符合现代汉语表达。
- source_word: בָּלַע
  choice: 吞下
  rationale: 保留原文具体的吞咽意象，并与下句“吐出来”和“腹中”形成连贯画面。
- source_word: וַיְקִאֶנּוּ
  choice: 却要把它吐出来
  rationale: 动词意为“呕吐”；“吐出来”自然地表达反胃排出的动作。“却”体现吞下与不能保有之间的转折，而“要”适合本段对恶人结局的诗性陈述。
- source_word: מִבִּטְנוֹ
  choice: 从他腹中
  rationale: “腹中”保留原文身体意象，同时比“胃里”更具诗体庄重感。
- source_word: יוֹרִשֶׁנּוּ
  choice: 要把它……赶出去
  rationale: 该使役形式在此表达迫使所吞财富离开其腹中的意思；“赶出去”明确传达强制排出的动作，又避免重复使用“吐”。
- source_word: אֵל
  choice: 上帝
  rationale: 原文明确以 אֵל 指上帝，并由他施行使财富被逐出的行动；“上帝”是现代标准汉语中清楚、庄重的对应词。
theological_decisions:
- issue: 恶人失去所吞财富时，审判行动的主体
  choice: 明确译出“上帝”是把财富从他腹中赶出去的主体。
  alternative: 将损失处理为非人格化的自然后果，或模糊行动主体。
  rationale: 希伯来文明确以 אֵל 作 יוֹרִשֶׁנּוּ 的主语，因此译文保留上帝直接施行审判的能动性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“吞下—吐出来—腹中—赶出去”保留原文连续而强烈的身体意象；分号呈现两句平行推进的结构。
