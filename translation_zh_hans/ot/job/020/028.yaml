  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: zh_hans
  text: 他家中的出产必被带走[a]；在他[b]发怒的日子，必如水流失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必离去”或“必流徙”。原文动词可指离开、被移走；这里指恶人家中的出产或财物失去、离散。
    reason: lexical_alternative
  - marker: b
    text: 这里的“他”很可能指上帝，但希伯来原文没有明确说出所指者。
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: 必被搬走
  rationale: גלה的Qal未完成式常有离去、流徙之意；这里以“他家中的出产”为主语，表示财物被移走或离散。“被搬走”在现代汉语中自然，也保留财产遭夺去的结果；脚注列出较贴近动词常见用法的另一译法。
- source_word: יְבוּל בֵּיתוֹ
  choice: 他家中的出产
  rationale: יְבוּל指产出、收成或所得，בֵּיתוֹ直译为“他的家”。“他家中的出产”保留原文意象，同时可涵盖家业带来的财物。
- source_word: נִגָּרוֹת
  choice: 都要流失
  rationale: נגר的Niphal形式描绘倾流、流走；“流失”既保留水流般消散的形象，又适合描述财物尽失。“都要”自然承接其复数形式所表达的分散财物。
- source_word: בְּיוֹם
  choice: 在……的日子
  rationale: 保留希伯来语庄严的时间表达，不简单改写为“当……时”。
- source_word: אַפּוֹ
  choice: 他发怒
  rationale: אַפּ表示怒气，第三人称阳性单数后缀只说“他的”，没有明说所指者。正文保留代词的含混性，不直接补出“上帝”。
theological_decisions:
- issue: “他发怒”中“他”的所指
  choice: 正文保留“他”，并用脚注说明很可能指上帝
  alternative: 直接译作“上帝发怒”或理解为恶人发怒
  rationale: 上下文中的审判使上帝成为最可能的所指，但本节希伯来文本并未明说上帝。保留代词可避免把语境推断写成明示内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出产”保留智慧文学中家业所得的意象；“搬走……流失”呈现先被移除、继而如水消散的并列画面。所有代词均不作神性大写处理，以保存原文的含混性。
