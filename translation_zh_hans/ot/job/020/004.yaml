base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: zh_hans
  text: 你岂不知道这事自古以来——自从人[a]被安置在地上以来？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人类”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲזֹאת
  choice: 这事
  rationale: 指示代词在反问中指向随后的内容；译为“这事”自然明确，又不额外限定具体所指。
- source_word: יָדַעְתָּ
  choice: 你岂不知道
  rationale: Qal完成式第二人称阳性单数用于疑问语境，表达对听者早应知晓之事的反问；“岂不知道”保留其修辞力度。
- source_word: מִנִּי עַד
  choice: 自古以来
  rationale: 该时间表达指遥远的古时；“自古以来”是现代汉语中自然、庄重的对应说法。
- source_word: מִנִּי שִׂים
  choice: 自从……被安置……以来
  rationale: מִנִּי与不定词结构标明起始时间；采用“自从……以来”清楚呈现其时间关系。
- source_word: שִׂים
  choice: 被安置
  rationale: שׂים在此表示把人置于地上；“被安置”既保留被动含义，也与地点短语自然搭配。
- source_word: אָדָם
  choice: 人
  rationale: 单数אָדָם在此作类称，代表人类；汉语“人”既保留单数形式，也可自然表达泛指，另在脚注列出“人类”。
- source_word: עֲלֵי אָרֶץ
  choice: 在地上
  rationale: 直接表达地点关系；“地上”在此自然指人所居住的大地。
theological_decisions:
- issue: אָדָם在泛指人类的陈述中如何翻译
  choice: 人
  alternative: 人类
  rationale: 原文使用单数אָדָם，既可指代表性、泛称的“人”，也可从集合意义理解为“人类”。正文保留单数形式，脚注保存较明确的集合性译法，不把经文限定为某一个男性个体。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“就是如此”补出汉语句法所需的承接关系，使本节可独立诵读；它不增加具体命题内容，而是回指“这事”。
