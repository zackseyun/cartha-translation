  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
translation:
  language: zh_hans
  text: 他如梦飞去，寻不见[a]；又如夜间异象[b]被赶走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们找不到他。”希伯来文使用主语未明确指出的复数动词，并带有指代“他”的宾语后缀。
    reason: lexical_alternative
  - marker: b
    text: 或译：“夜里的异象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: 像梦一样
  rationale: 前缀 כ 表示比较，חֲלוֹם 意为“梦”；此译自然地保留明喻。
- source_word: יָעוּף
  choice: 飞逝
  rationale: עוּף 的基本意象是“飞”；“飞逝”既保留飞行意象，也表达此处迅速消失的含义。
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: 再也寻不见
  rationale: 希伯来文直译为“他们找不到他”，其中复数主语并未具体指明。“寻不见”符合现代汉语表达，并把焦点保持在此人的消失上；脚注保留原文语法上的另一种译法。
- source_word: וְיֻדַּד
  choice: 被驱散
  rationale: 该使役被动形式表达被赶离、被驱逐；“被驱散”保留被动意义，也自然衔接梦和夜间异象转瞬消失的诗歌画面。
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: 像夜间的异象一样
  rationale: חֶזְיוֹן 意为“异象”，לָיְלָה 在此限定其为夜间所见；译文保留原文的比较结构和庄重诗意。
