  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
translation:
  language: zh_hans
  text: 他把它拔出来[a]，它便从他的躯体中出来；闪亮的尖端从他的胆中出来；惊恐临到他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：“闪亮的刀锋从他的胆中出来。”希伯来文采用鲜明的身体意象；“闪亮的尖端”也可能是描写武器被拔出时显露的闪光。
    reason: 原文省略所拔之物；“闪光”可指武器闪亮的尖端或刀锋，因此保留另一种意象理解。
lexical_decisions:
- source_word: שָׁלַף
  choice: 他把它拔出来
  rationale: 该动词指拔出或抽出，常用于武器；原文宾语省略，但上文的兵器意象表明所拔的是刺入身体之物，因此用“它”保留指代而不过度明确为某一种武器。
- source_word: וַיֵּצֵא
  choice: 它便……出来
  rationale: 该动词基本义为“出去、出来”；结合前面的“拔出来”，译为“出来”最符合汉语表达，也保留动作先后。
- source_word: מִגֵּוָה
  choice: 从他的躯体
  rationale: גֵּוָה可指身体、躯干，也可能指背部；“躯体”既保持身体意象，又避免把具体部位限定为“背”。
- source_word: וּבָרָק
  choice: 闪亮的尖锋
  rationale: בָּרָק本义为闪电或闪光，此处与刺入身体的武器平行，可能借闪光指武器闪亮的尖端；“闪亮的尖锋”兼顾形象与语境。
- source_word: מִמְּרֹרָתוֹ
  choice: 从他的胆中
  rationale: מְרֹרָה可指胆汁、胆或苦味；本节为强烈的身体受创图景，采用解剖意义的“胆”，同时避免较临床化的“胆囊”。
- source_word: יַהֲלֹךְ עָלָיו
  choice: 临到他
  rationale: הלך与על连用在这里表示某事来到、笼罩某人；“临到他”自然地表达惊恐骤然袭来。
- source_word: אֵמִים
  choice: 惊恐
  rationale: 复数名词表示可怕之事或强烈恐惧；汉语“惊恐”自然凝练，能表达其强烈程度。
