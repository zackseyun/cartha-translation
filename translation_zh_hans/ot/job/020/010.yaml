  yaml_path: translation/ot/job/020/010.yaml
  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: zh_hans
  text: 他的儿子必寻求穷人的好感[a]；他的双手必归还他的财富[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的儿子必安抚穷人”或“必求穷人开恩”。希伯来语动词可表示寻求好感，也可表示安抚受到亏待的人。
    reason: lexical_alternative
  - marker: b
    text: “财富”也可译作“资财”或“力量”。希伯来语名词可指财物、资源或力量；此处结合归还的语境译作“财富”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: בנים为阳性复数，并带第三人称阳性单数后缀；译作“他的儿子”准确保留原文的性别和数。
- source_word: יְרַצּוּ
  choice: 必求取……的好感
  rationale: רצה的Piel形在此可指寻求接纳、好感或设法安抚。此译法保留关系层面的含义，同时避免直接断定他们具体如何补偿穷人。
- source_word: דַלִּים
  choice: 穷人
  rationale: דלים可指贫穷、困苦或社会地位弱势的人；结合上下文，“穷人”最直接自然。
- source_word: יָדָיו
  choice: 他自己的双手
  rationale: 原文为“他的双手”。加入“自己的”体现希伯来语中由其本人亲自归还的强调，且保持“手”的具体意象。
- source_word: תָּשֵׁבְנָה
  choice: 必归还
  rationale: שוב的Hiphil形表示使某物返回，即“归还”或“偿还”；“归还”贴合本节追索财物的语境。
- source_word: אוֹנוֹ
  choice: 他的财富
  rationale: אוֹן可指财富、资财、能力或精力；本节谈到向穷人归还，物质性的“财富”最符合上下文，但其词义宽度以脚注保留。
theological_decisions:
- issue: 儿子与穷人的行动关系
  choice: 译作“求取穷人的好感”
  alternative: “安抚穷人”或“求穷人开恩”
  rationale: 原文动词允许寻求接纳与安抚两种理解。正文不明确加入“赔罪”“补偿”等因果内容，以免把上下文推论写入经文本身。
- issue: 归还者及所归还之物
  choice: 保留“他自己的双手必归还他的财富”这一原文结构
  alternative: 意译为“他必亲手偿还所得的财物”
  rationale: 意译会把财富明确说成不义所得，并可能消除主语及所有关系上的张力；正文因此保留原文较含混的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“求取……的好感”略带正式色彩，用来保留原文动词在“寻求接纳”与“安抚”之间的语义空间；两个脚注标记均置于相应词语之后。
