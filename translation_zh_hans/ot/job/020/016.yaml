  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
translation:
  language: zh_hans
  text: '他吸吮毒蛇[a]的毒液[b]；

    蝰蛇的舌头杀死他。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毒蛇”：希伯来文指一种毒蛇；常译作“眼镜蛇”，传统译作“虺蛇”或“蝮蛇”，具体蛇种不能确定。
    reason: lexical_alternative
  - marker: b
    text: “毒液”：希伯来文直译为“头”；在此毒蛇意象中指蛇毒。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: 毒液
  rationale: 该词通常意为“头”，但在这里与毒蛇相连，并与下句致命的蝰蛇构成平行，按诗歌语境指蛇毒。“毒液”比泛称“毒物”更准确自然。
- source_word: פְּתָנִים
  choice: 眼镜蛇
  rationale: 该词指一种剧毒蛇，确切蛇种不能确定；“眼镜蛇”是清楚易懂的现代对应，也保留了原文具体而鲜明的毒蛇意象。
- source_word: יִינָק
  choice: 吸食
  rationale: 原动词本义是“吸、吮吸”。“吸食”既保留原文强烈的动作画面，也符合现代汉语表达。
- source_word: תַּהַרְגֵהוּ
  choice: 必杀死他
  rationale: 动词以阴性单数的“舌头”为主语，受词是“他”。“必”自然表达诗句所强调的确定致命后果，同时不额外限定具体时间。
- source_word: לְשׁוֹן
  choice: 舌头
  rationale: 按原文直译为“舌头”，保留其诗性意象，不将它解释性地改成“毒牙”或“咬伤”。
- source_word: אֶפְעֶה
  choice: 蝰蛇
  rationale: 该词表示一种毒蛇，“蝰蛇”是现代汉语中自然清楚的对应；具体物种仍不完全确定。
