  text: אֵין שָׂרִ֥יד לְ/אָכְל֑/וֹ עַל כֵּ֝֗ן לֹא יָחִ֥יל טוּבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/021.yaml
  text: Nothing was left for him to devour[b][a]; therefore his prosperity will not endure.
translation:
  language: zh_hans
  text: 没有什么剩下供他吞吃[a]；因此，他的兴盛必不长久[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“没有余剩（或幸存者）供他吃。”也可理解为，没有什么从他的吞吃中剩下或逃脱。
    reason: lexical_alternative
  - marker: b
    text: “长久”所译的希伯来语动词含义较难确定，也可理解为“持续”或“兴旺”；另有解释将它与“翻腾、战抖”联系起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׂרִיד
  choice: 没有什么留下
  rationale: אֵין表示不存在，שָׂרִיד本指“幸存者、余剩之物”。结合语境，以“没有什么留下”自然表达毫无余剩之意，同时不把对象限定为人。
- source_word: לְאָכְלוֹ
  choice: 可供他吞吃
  rationale: אכל意为“吃”，ל加不定式及第三人称单数阳性后缀，直译近于“供他吃”。语境描述恶人的贪婪攫取，“吞吃”保留强烈的消费意象。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 常见的推论连接语，表明后句是前句所述行为的结果。
- source_word: יָחִיל
  choice: 必不长久
  rationale: 此动词词义有争议；在טוּבוֹ作主语的语境中，理解为“持续、长存”最为连贯。“不长久”自然表达其福乐无法维持。
- source_word: טוּבוֹ
  choice: 他的福乐
  rationale: טוּב可指美好、福分、财富或兴盛。这里采用较宽泛的“福乐”，既涵盖物质兴盛，也不把含义缩窄为财富。
theological_decisions:
- issue: יָחִיל的语义是否表示持续、兴盛或翻腾
  choice: 按“持续、长存”理解，译为“必不长久”
  alternative: “必不兴旺”或按另一词根关联译作“必不安稳／必翻腾”
  rationale: 与主语“他的福乐”搭配时，持续义最符合上下文的因果关系；但原词存在词源和释义上的困难，故以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吞吃”呼应上下文中贪婪掠夺的形象；“福乐”比“财富”范围更宽，也比抽象的“福祉”更通俗。脚注标记均置于对应词语之后。
