  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: zh_hans
  text: 他归还自己劳碌所得，不能吞下；他的欢喜不能与他交换所得的财富相称。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他归还劳碌所得，不能消受；至于他交换所得的财富，他不能欢欣。”希伯来文后半句十分简练；其中“按／与……相称”的关系可有几种彼此相近的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵשִׁיב
  choice: 归还
  rationale: 这是שוב的使役分词，表示使某物返回；“归还”既贴近词义，也符合恶人被迫交出所得的语境。
- source_word: יָגָע
  choice: 劳碌所得
  rationale: 该词可指劳碌本身，也可指劳碌所得；与“归还”搭配时，理解为劳动或经营所得更自然。
- source_word: וְלֹא יִבְלָע
  choice: 不把它吞下
  rationale: 保留בלע“吞下”的具体意象，表达他不能消受、占有所得；“它”按上下文指劳碌所得。
- source_word: כְּחֵיל
  choice: 照……财富
  rationale: חֵיל在这里较可能指财富、资财；前缀כ的关系较难确定，“照”保留其比较或相称含义。
- source_word: תְּמוּרָתוֹ
  choice: 他交易所得的
  rationale: תְּמוּרָה可指交换、代价或交换所得；“交易所得”在现代汉语中自然，并保留经济交换的核心含义。
- source_word: וְלֹא יַעֲלֹס
  choice: 他也不得欢喜
  rationale: עלס表示欢欣、喜悦；“不得欢喜”结合语境表达他不能享受这些财富，同时没有把原因说得过满。
