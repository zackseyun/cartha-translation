  yaml_path: translation/ot/job/020/001.yaml
  text: Then Zophar the Naamathite answered and said:[a]
translation:
  language: zh_hans
  text: 于是，拿玛人琐法回答说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拿玛人琐法就回答说。”
    reason: 保留句首连接词也可理解并翻译为一般承接词“就”的可能。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在对话叙事公式中表示“回答、回应”；“回答”既符合上下文，也保留希伯来文的惯用表达。
- source_word: צֹפַר
  choice: 琐法
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: הַנַּעֲמָתִי
  choice: 拿玛人
  rationale: 该带定冠词的族属词表示来自拿玛或与拿玛群体有关的人；译作“拿玛人”自然简洁，同时不进一步断定是出生地还是宗族归属。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר通常意为“说”；保留“回答说”这一双动词公式，忠实反映原文结构。
- source_word: וַ
  choice: 于是
  rationale: 句首连接词推动叙事向前；“于是”在现代汉语中自然地表达承接和次序，同时比机械地译作“并且”更符合此处语境。
