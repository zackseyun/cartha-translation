  text: his food in his belly is turned[a]; it is the venom of cobras within him.
translation:
  language: zh_hans
  text: 他的食物在腹中变了[a]，成了他体内的蛇毒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的饼在内脏中变了；在他里面成了虺蛇的苦胆。”
    reason: 保留לַחְמוֹ（“饼”）、בְּמֵעָיו（“内脏”）、מְרוֹרַת（“苦胆”）和פְּתָנִים（传统译作“虺蛇”，具体蛇种未定）的较直译表达。
lexical_decisions:
- source_word: לַחְמוֹ
  choice: 他的食物
  rationale: לֶחֶם常指“饼、食物”；这里所描写的是吞下之物在腹中的变化，因此用现代汉语较自然、范围也合适的“食物”，同时在脚注保留“饼”这一具体译法。
- source_word: בְּמֵעָיו
  choice: 在腹中
  rationale: מֵעִים指腹内的器官或内脏。结合进食和消化的意象，“在腹中”自然清楚，又没有“肠子”可能带来的过度具体化。
- source_word: נֶהְפָּךְ
  choice: 变了
  rationale: הפך的尼פעל形式在此表示状态发生转变。“变了”简洁地保留原文的转化意象，不额外说明究竟如何变化。
- source_word: מְרוֹרַת
  choice: 毒液
  rationale: 该词本义与“苦、苦胆”有关，但与毒蛇连用时表达有毒的物质；“毒液”最能让现代读者直接理解这里的致命意象，脚注保留“苦胆”这一较贴近词形的译法。
- source_word: פְּתָנִים
  choice: 眼镜蛇
  rationale: פֶּתֶן指一种剧毒蛇，传统上也译作“虺蛇”或“毒蛇”。“眼镜蛇”是清楚而具体的现代对应，脚注以“毒蛇”保留较宽泛的可能。
- source_word: בְּקִרְבּוֹ
  choice: 他体内
  rationale: 该短语表示“在他里面”。“他体内”与本节腹中毒液的身体意象吻合，现代汉语也自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述。主句保留希伯来诗句中食物在腹内转变为蛇毒的强烈身体意象；“成了”补足现代汉语所需的关系表达，但不进一步解释这种变化。
