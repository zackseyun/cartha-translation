base_translation:
  language: en
  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: zh_hans
  text: '邪恶虽在他口中甘甜[a]，

    他却把它藏在舌下；'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果邪恶在他口中是甘甜的。”希伯来语此处的词既可表示条件“如果”，也可表示让步“虽”；上下文较支持让步义。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 虽
  rationale: אִם既可表示条件“如果”，也可在语境中表示让步“虽”。此处接续琐法对恶人品尝并珍藏邪恶的描写，正文采用让步义，同时以脚注保留条件义。
- source_word: תַּמְתִּיק
  choice: 是甘甜
  rationale: מתק的使役形在此以“邪恶”为语法主语，可表达“变甜、尝来甘甜”。译作“是甘甜”自然地保留味觉意象。
- source_word: בְּפִיו
  choice: 在他口中
  rationale: פֶּה直指“口”；如此翻译也与下句“舌下”的具体口腔意象相呼应。
- source_word: רָעָה
  choice: 邪恶
  rationale: 这里指恶人所喜爱、反复品味的道德之恶；“邪恶”既宽泛又符合智慧文学语境。
- source_word: יַכְחִידֶנָּה
  choice: 他却把它藏
  rationale: כחד的使役形表示隐藏、藏起；阴性单数宾语后缀回指阴性名词רָעָה。加入“却”自然承接让步从句，不改变基本关系。
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: 在舌下
  rationale: 按空间意义直译，保留恶人把邪恶含住、珍藏并品味的鲜明比喻。
theological_decisions: []
