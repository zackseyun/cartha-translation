base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: zh_hans
  text: 因为恶人的欢呼转瞬即逝；不敬虔之人的喜乐也只持续片刻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不敬虔之人”或译“伪善者”。希伯来语 חָנֵף 可指伪善的人；但在《约伯记》中其含义通常更广，指不虔敬或不敬畏神的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前述断言说明缘由，保留其因果、解释作用。
- source_word: רִנְנַת
  choice: 欢呼
  rationale: 原词特指发声表达的喜悦；“欢呼”既保留声音意象，也符合现代汉语诗体表达。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 智慧文学中指道德上邪恶、有罪的人；“恶人”简洁自然，并与下半句形成平行。
- source_word: מִקָּרוֹב
  choice: 转瞬即逝
  rationale: 此处按时间意义理解，表示持续时间很短；采用自然汉语明确其短暂性，同时避免空间性的误读。
- source_word: וְשִׂמְחַת
  choice: 喜乐
  rationale: 对应上半句的“欢呼”，表达内在或整体的欢乐，并保留诗句的平行结构。
- source_word: חָנֵף
  choice: 不敬虔之人
  rationale: 在《约伯记》中，该词的范围较“伪善者”宽，常指不敬神、亵渎或远离神的人；此译法与“恶人”平行，又不把含义限缩为假装虔诚。
- source_word: עֲדֵי רָגַע
  choice: 只在片刻之间
  rationale: 表达喜乐延续到极短的时间界限；“只”显明限制，“片刻之间”保持诗意和简洁。
theological_decisions:
- issue: חָנֵף所指的道德与宗教含义
  choice: 不敬虔之人
  alternative: 伪善者
  rationale: 不将该词限定为外表虔诚、内里虚假的人，而保留其在《约伯记》中更广泛的不敬神含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“欢呼／喜乐”和“转瞬即逝／只在片刻之间”呈现希伯来诗歌的平行结构；脚注标记置于整节末尾，所释词语已明确出现在正文中。
