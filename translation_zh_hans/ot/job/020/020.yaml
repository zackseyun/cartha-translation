  text: כִּ֤י לֹא יָדַ֣ע שָׁלֵ֣ו בְּ/בִטְנ֑/וֹ בַּ֝/חֲמוּד֗/וֹ לֹ֣א יְמַלֵּֽט׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/020.yaml
  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: zh_hans
  text: 因为他腹中从不知满足[a]；他所贪爱的，一样也保不住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他腹中没有安宁；他不能凭自己所贪爱的逃脱。”
    reason: “安宁”与“满足”皆可表达 שָׁלֵו；末句也可理解为他不能借所贪爱之物救自己脱身。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明恶人遭受审判的原因；现代汉语中“因为”自然清楚。
- source_word: לֹא יָדַע
  choice: 从不知
  rationale: 否定词与完成式共同陈述恶人一贯的状态；“从不知”简洁地表达这一点。
- source_word: שָׁלֵו
  choice: 满足
  rationale: 该词可指安宁、安逸或满足；结合“腹中”的欲望与吞吃意象，“满足”最自然，但在脚注保留“安宁”的可能。
- source_word: בְּבִטְנוֹ
  choice: 腹中
  rationale: 保留 בטן 的具体身体意象，并符合本段有关食欲、吞吃的诗歌语境。
- source_word: בַּחֲמוּדוֹ
  choice: 他所贪爱的
  rationale: חמד 所指可为渴求、珍爱的事物；在谴责恶人欲望的语境中，“所贪爱的”既涵盖财物，也保留欲望层面。
- source_word: לֹא יְמַלֵּט
  choice: 一样也保不住
  rationale: מלט 的 Piel 可表示使逃脱、救出或保存；若以珍爱之物为宾语，“保不住”符合句法和语境，同时保留脚注中的另一种理解。
theological_decisions:
- issue: 末句的句法关系及 מלט 的含义
  choice: 理解为恶人不能保住任何自己贪爱的东西。
  alternative: 理解为恶人不能凭自己所贪爱的东西逃脱或救自己。
  rationale: 希伯来语 בַּחֲמוּדוֹ 可与 יְמַלֵּט 构成“从他所珍爱的东西中救出/保全”的表达，也可理解为手段“凭他所喜爱的”；原文具有真实歧义，因此正文采用较合上下文的“保不住”，脚注保留“不能借此逃脱”的读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“腹中”保留原文具体意象；“一样也”使末句在汉语中自然，并表达一无所留的语境含义。
