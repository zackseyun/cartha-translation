  text: זֶ֤ה חֵֽלֶק אָדָ֣ם רָ֭שָׁע מֵ/אֱלֹהִ֑ים וְ/נַחֲלַ֖ת אִמְר֣/וֹ מֵ/אֵֽל׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: zh_hans
  text: 这是恶人从上帝所得的份，是大能者命定给他的产业[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “命定给他的产业”较直译可作“他话语的产业”。原文“他的话语”所指并不十分明确；这里可能是指大能者为他所宣告或定下的份。
    reason: 保留אִמְרוֹ在“话语”与“所宣告、命定之份”之间的词义和指代歧义。
lexical_decisions:
- source_word: זֶה
  choice: 这就是
  rationale: 指示词引出琐法对前文的总结；汉语补出判断语气，使句子自然完整。
- source_word: חֵלֶק
  choice: 所得的份
  rationale: 表示分配所得的份额或结局；结合介词“从上帝”，译为“从上帝所得的份”既自然又保留分配之意。
- source_word: אָדָם רָשָׁע
  choice: 恶人
  rationale: 希伯来语为阳性单数的泛指表达；现代汉语“恶人”本身即可泛指，且保留智慧文学中的定型称谓。
- source_word: מֵאֱלֹהִים
  choice: 从上帝
  rationale: 此处指独一的上帝，并表明恶人所得之份的来源。
- source_word: וְנַחֲלַת
  choice: 产业
  rationale: 与“份”构成诗体平行，指分得或承受之物；“产业”保留其承受、分配的色彩。
- source_word: אִמְרוֹ
  choice: 命定给他的
  rationale: 该词字面涉及“话语／言说”，在本节语境中可理解为大能者藉宣告为恶人所定的份。正文用“命定给他的”表达司法性宣告的结果，同时以脚注保留字面歧义。
- source_word: מֵאֵל
  choice: 大能者
  rationale: אֵל在这里是神的称号；译作“大能者”既传达称号的力量含义，也保留与前半句“上帝”的诗体变化。
theological_decisions:
- issue: אָדָם רָשָׁע的泛指范围
  choice: 恶人
  alternative: 邪恶的人／一个恶人
  rationale: 原文虽为阳性单数，却在总结性格言中泛指此类人。汉语“恶人”无需添加性别词便能保持单数类型称谓和泛指作用。
- issue: אִמְרוֹ的解释
  choice: 命定给他的
  alternative: 他话语的／他的言语
  rationale: 字面译法在汉语中指代不明，也难与“份”和“产业”的平行关系衔接。上下文讲恶人从上帝所得的结局，因此正文采用宣告、定下之义，但以脚注明确保留原文“话语”的词义可能性。
- issue: 两个神称的诗体变化
  choice: 上帝／大能者
  alternative: 上帝／上帝
  rationale: 原文分别使用אֱלֹהִים和אֵל。采用两个相应称谓可保留诗体变化，不暗示两位不同的神。
translation_notes:
  register: 采用现代、庄重而简洁的智慧文学语体。“所得的份／产业”保留平行结构；“上帝／大能者”体现原文两个神称的诗体变化。
