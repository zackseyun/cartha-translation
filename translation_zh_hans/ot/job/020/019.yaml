  text: כִּֽי רִ֭צַּץ עָזַ֣ב דַּלִּ֑ים בַּ֥יִת גָּ֝זַ֗ל וְ/לֹ֣א יִבֶנֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: zh_hans
  text: 因为他压碎并撇弃穷人[a]；他抢夺房屋，却不把它建造起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他欺压并撇弃穷人；他抢夺房屋，却不把它建造起来。”
    reason: “欺压”是 רִצַּץ 在此社会压迫语境中较自然的引申译法；正文“压碎”则保留该词强烈、具体的字面意象。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明前述审判临到的原因；现代汉语用“因为”自然清楚。
- source_word: רִצַּץ
  choice: 欺压
  rationale: 该动词本义有“压碎、打碎”之意；用于穷人时，“欺压”既符合语境，也保留强力压迫的意味。
- source_word: עָזַב
  choice: 撇弃
  rationale: 表达在伤害穷人之后又将其弃置不顾，语气庄重而不古奥。
- source_word: דַּלִּים
  choice: 穷人
  rationale: 此处指贫穷、弱小而处境脆弱的人；“穷人”最直接自然。
- source_word: בַּיִת
  choice: 房屋
  rationale: 与“抢来”和“建造起来”相连，首先应理解为实体房产；“房屋”也能保留原文可能涉及家业的余地。
- source_word: גָּזַל
  choice: 抢来
  rationale: 该词指以暴力夺取或劫掠；“抢来”比一般的“偷”更能体现强夺。
- source_word: וְלֹא יִבֶנֵהוּ
  choice: 却不得建造起来
  rationale: 未完成式在审判语境中可表达他将不能把所夺的房屋建成或建立起来；“不得”体现结局而非单纯意愿，并保留“建造”的原文意象。
theological_decisions:
- issue: וְלֹא יִבֶנֵהוּ 是表达意愿还是受审判后的不能
  choice: 却不得建造起来
  alternative: 却不把它重建起来
  rationale: 上下文描述恶人的报应，较可能指他不能享用、建成或建立所夺之屋；译文不把它解释成道德上的拒绝，也不限定为先前房屋遭毁后的“重建”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“撇弃”保留诗歌语气；“抢来房屋”表现强夺，“不得建造起来”保留原文 בנה 的建造意象及审判语境中的结果意味。
