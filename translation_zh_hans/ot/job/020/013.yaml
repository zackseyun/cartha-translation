  yaml_path: translation/ot/job/020/013.yaml
  text: He spares it and does not let it go[a], and holds it in his mouth.
translation:
  language: zh_hans
  text: 他珍惜它，不肯放弃它；把它含在口中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在他的上腭内。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹל עָלֶיהָ
  choice: 舍不得放开它
  rationale: חמל 的基本语义包括怜惜、顾惜或不忍舍弃；结合上节把邪恶比作口中甘甜之物的意象，此处译为“舍不得放开”自然表达珍惜而不愿释手，同时不把它弱化为一般的“保留”。
- source_word: וְלֹא יַעַזְבֶנָּה
  choice: 也不肯丢下它
  rationale: עזב 可指离开、抛弃或放弃。这里与前句形成递进，表达主动拒绝舍弃；“不肯丢下”既符合现代汉语，也保留诗句中紧抓不放的意味。
- source_word: וְיִמְנָעֶנָּה
  choice: 反而把它含在
  rationale: מנע 常有扣住、保留、抑制之义；在口腔意象中指把那甘甜之物留住而不咽下。“含在”以自然汉语具体呈现这一动作，避免机械地译成“阻止它”。
- source_word: בְּתוֹךְ חִכּוֹ
  choice: 口中
  rationale: חך 字面指上腭，也可借指口腔。正文用“口中”较自然，并以脚注保留更具体的字面所指。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“舍不得”“不肯”“含在口中”清楚保留恶人把邪恶当作甘甜之物、久久不愿放弃的诗性意象；代词“它”承接上节的“邪恶”。
