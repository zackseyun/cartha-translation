  yaml_path: translation/ot/job/020/003.yaml
  text: I hear a rebuke that shames me[b][a], and the spirit of my understanding answers me.
translation:
  language: zh_hans
  text: 我听见使我蒙羞的责备；我悟性所发的灵回应我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我悟性中的灵回应我。”希伯来语也可强调这回应出于他的悟性。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: 责备
  rationale: 该词可指管教、训诲或纠正；本节中琐法把约伯的话视为针对自己的斥责，因此译作“责备”最合语境。
- source_word: כְּלִמָּתִי
  choice: 使我蒙羞的
  rationale: 这一结构表示与说话者所受羞辱有关的责备；用关系结构表达，既自然，也保留“责备令我受辱”的含义。
- source_word: אֶשְׁמָע
  choice: 我听见
  rationale: 希伯来语未完成式在此描述说话者当前听到责备，译作“我听见”简洁自然。
- source_word: רוּחַ
  choice: 灵
  rationale: 此处不是字面的风或气息，而是人里面促使回应的内在力量；保留“灵”的意象，避免直接窄化为“心思”。
- source_word: מִבִּינָתִי
  choice: 我悟性所发的
  rationale: 介词 מִן 可表示来源，即“从我的悟性而来”；“所发的”在现代汉语中自然地体现这种来源关系，同时不排除“与我的悟性相属”的理解。
- source_word: יַעֲנֵנִי
  choice: 回答我
  rationale: ענה 的 Qal 词干通常意为“回答、回应”，第一人称宾语后缀直译为“回答我”；也可能含有内在之灵促使说话者作答的意味，另以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“使我蒙羞的责备”清楚表达原文的羞辱意味；后半句适度保留希伯来语“灵—悟性—回答我”的意象和歧义。
