  text: He will flee from an iron weapon[b][a]; a bronze bow will pierce him through.
translation:
  language: zh_hans
  text: 他逃离铁制的兵器；铜弓必将他射穿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“铜弓必穿过他。”这里以弓代指弓所射出的箭；“射穿”表达该武器意象在语境中的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  choice: 他逃避
  rationale: ברח的Qal未完成式第三人称阳性单数表示逃跑、躲避；本节诗歌语境描述将临到恶人的结局，用“逃避”自然表达其企图脱身的动作，并与后半句形成转折。
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: 铁制的兵器
  rationale: נשק可泛指武器或兵器，בַּרְזֶל指铁；“铁制的兵器”既保留原文宽泛性，也符合现代汉语表达。
- source_word: תַּחְלְפֵהוּ
  choice: 却要将他射穿
  rationale: חלף的基本意象是经过、穿过；以“铜弓”为主语时，实际施动者按转喻是弓所发的箭。“射穿”在汉语中自然呈现武器语境所暗示的穿透结果，但以脚注保留较形式对应的译法。
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: 铜弓
  rationale: קשת意为弓；נחושה指铜或青铜。中文圣经语体中“铜弓”简洁自然，同时不强行确定具体合金成分。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“却”呈现前后两种兵器之间的反转：他虽躲过一种，仍被另一种击中。正文保留诗歌的简洁与力度；脚注说明“兵器”的词义范围，以及原文“穿过他”的意象和弓代箭的转喻。
