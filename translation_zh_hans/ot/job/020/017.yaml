  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: zh_hans
  text: 他必不得见水道[a]、江河，以及流淌着蜂蜜和凝乳的溪流。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他不得见河道、江河，以及流着蜂蜜和凝乳的溪谷。”原文连续使用几个可指水道、河流或旱谷的词。
    reason: 保留אַל יֵרֶא可能具有的愿望语气，并呈现原文多个水流地貌名词层叠的表达。
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: 他必不得见
  rationale: אַל与未完成式 יֵרֶא 连用，在本段诗歌语境中表达恶人无缘经历所描绘的福分；译作“必不得见”既保留“看见”的视觉意象，也自然传达将来的否定含义。语法上也可能带愿望或咒诅语气，故在脚注中保留另一译法。
- source_word: בִפְלַגּוֹת
  choice: 水道
  rationale: פְלַגּוֹת 指分流、水道或溪流。此处介词 בִ 与“见”搭配不宜机械译成“在……里面”，因此按所见对象处理。
- source_word: נַהֲרֵי נַחֲלֵי
  choice: 江河溪流
  rationale: 两个近义复数名词层叠，营造水源充沛的诗歌意象。“江河溪流”在现代汉语中自然，并保留词语的累加；נַחֲלֵי 也可具体指旱谷或季节性河道。
- source_word: דְּבַשׁ
  choice: 蜂蜜
  rationale: 这是 דְּבַשׁ 在丰饶意象中的常规对应词。
- source_word: וְחֶמְאָה
  choice: 和凝乳
  rationale: חֶמְאָה 可指凝乳、奶油或黄油一类乳制品。“凝乳”较能反映古代牧业背景，也避免让人联想到现代加工黄油。
- source_word: נַחֲלֵי דְּבַשׁ וְחֶמְאָה
  choice: 流淌着蜂蜜和凝乳的……溪流
  rationale: 希伯来语以名词连属结构描绘盛满或流着蜂蜜与凝乳的水流；汉语补出“流淌着”，使丰饶图景清楚自然。
theological_decisions:
- issue: אַל יֵרֶא 的陈述语气与愿望语气
  choice: 正文采用“他必不得见”，按上下文理解为恶人不能享有丰盛福分的陈述。
  alternative: “愿他不得见”，将其理解为愿望或咒诅式表达。
  rationale: אַל 加未完成式可表达禁止、愿望或否定性的祈愿；本段对恶人结局的描述支持未来式陈述，但原文语气并非完全没有歧义，故以脚注保留另一种可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必不得见”承接智慧诗歌的判语口吻；“江河溪流”保留原文近义词叠加造成的丰盛感。脚注兼顾语气歧义和水道术语的多义性。
