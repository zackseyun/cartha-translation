review_pass:
  verdict: revise
  source_fidelity: 首句的希伯来语（尤其 לִצְפּוּנָיו）句法和词义艰深，可能指为他的隐秘收藏/财物所保留的黑暗，也可能指为他保留的黑暗。原译“为他所积藏的财宝存留着”虽试图反映一种解释，却在汉语中易读成黑暗是替财宝保存的，关系不够清楚。修订以“为他所藏的财物积存着”较准确地保留“黑暗被保留”与“所藏之物”的关联，并在脚注说明另一种理解。末句维持“余剩者/物受害”的开放性，未把有歧义的 יֵרַע 强定为火‘吞吃’。
  naturalness: 修订后的首句更符合现代汉语搭配；“未经吹旺的火”比“不用人吹旺的火”更直接对应被动分词，也不在正文中补入“人”。全文仍保持庄重、简洁的诗体语调。
