base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: zh_hans
  text: 一切黑暗都为他所藏的财物积存着[a]；未经吹旺的火[b]必吞灭他；他帐棚中剩下的，也必遭殃[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切黑暗都为他存留着。”原文这一短语很难确定；“他所藏的财物”也可理解为“他的隐秘处/所藏之物”，并可能指为他保留的灾祸。
    reason: alternative_reading
  - marker: b
    text: “未经吹旺的火”也可译作“未被吹动的火”。这可能指无需人吹火点燃或扇旺的火，但原文没有明说火的来源。
    reason: lexical_alternative
  - marker: c
    text: 或译：“火必吞噬他帐棚中的余剩之物。”这里的词也可指“幸存者”，全句可理解为“他帐棚中的幸存者必受害”。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: 一切黑暗
  rationale: 保留“黑暗”的具体诗歌意象；在上下文中可暗指灾祸或审判，但正文不将隐喻明说。
- source_word: טָמוּן לִצְפּוּנָיו
  choice: 都为他所积藏的财宝存留着
  rationale: 原文将“隐藏、积存”与“所藏之物”并置，语义艰深。此译保留“为……存留”与“积藏之物”两层含义，并以脚注说明另一种句法理解。
- source_word: תְּאָכְלֵהוּ אֵשׁ
  choice: 火必吞灭他
  rationale: 原动词本义为“吃、吞吃”，以火为主语时译作“吞灭”自然有力，也保留毁灭性的形象。
- source_word: לֹא נֻפָּח
  choice: 不用人吹旺的
  rationale: 保留“未被吹动、扇旺”的被动意象；补出“人”使现代汉语意义清楚，同时不过度断定火的来源。
- source_word: יֵרַע
  choice: 必遭殃
  rationale: 按马所拉读音理解为“情况变坏、受害”。这比把该词直接改释为火“吞吃”更贴近现存辅音与读音，但相关分句仍有歧义。
- source_word: שָׂרִיד
  choice: 剩下的
  rationale: 该词既可指“幸存者”，也可指“余剩之物”。中性表达“剩下的”保留其可能指家人、家业或其他余物的开放性。
- source_word: בְּאָהֳלוֹ
  choice: 他帐棚中
  rationale: 直译“帐棚”，保留《约伯记》的诗歌场景；该词在语境中也可泛指住所或家室。
theological_decisions:
- issue: “不用人吹旺的火”是否明确指神所降的火
  choice: 正文不明说其来源
  alternative: 译为“神所降的火”或“非人点燃的火”
  rationale: 原文只说火“未被吹旺”，可能暗示非人为或神所施的审判，却没有直接提到神；保留这种含蓄可避免加入原文未明言的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。保留“黑暗、火、帐棚”等原文意象；对首句和末句的文本歧义不在正文中强行消解，而用脚注呈现主要可能。
