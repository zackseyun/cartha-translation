  to: 他正要填满肚腹时，上帝必向他发烈怒，又使烈怒如雨降在他身上，正在他进食的时候。[a]
  rationale: 仅调整“发向他”为更自然的现代汉语“向他发烈怒”，并微调末句标点与脚注措辞。正文仍采用时间性理解，脚注明确保留“作为他的食物”的困难替代读法；未改变上帝为隐含施行审判者的语篇指代，也未加入宗派性解释。
