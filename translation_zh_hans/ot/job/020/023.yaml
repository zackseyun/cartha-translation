  text: יְהִ֤י לְ/מַלֵּ֬א בִטְנ֗/וֹ יְֽשַׁלַּח בּ֭/וֹ חֲר֣וֹן אַפּ֑/וֹ וְ/יַמְטֵ֥ר עָ֝לֵ֗י/מוֹ בִּ/לְחוּמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: zh_hans
  text: 他正要填满肚腹时，上帝必向他发烈怒，又使烈怒如雨降在他身上，正在他进食的时候。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句的希伯来文含义和句法不明确；也可译作：“又使烈怒如雨降在他身上，作为他的食物。”
    reason: 保留 בִּלְחוּמוֹ 可表示“在他进食时”以及与“他的食物”更直接相连的可能性，而不在正文中消除原文歧义。
lexical_decisions:
- source_word: יְהִי לְמַלֵּא בִטְנוֹ
  choice: 他正要填满肚腹时
  rationale: 将未完成式与不定式结构按上下文理解为时间情境，保留“填满肚腹”的具体饮食意象，不抽象化为“满足欲望”。
- source_word: יְשַׁלַּח בּוֹ
  choice: 必把……发向他
  rationale: שלח取“发出、送出”之义；ב在此表示敌对性的指向。用“发向他”自然表达审判临到恶人。
- source_word: חֲרוֹן אַפּוֹ
  choice: 烈怒
  rationale: 该结构字面涉及怒气的灼热。“烈怒”在现代汉语中简洁、庄重，也保留怒火强烈炽热的含义。
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: 又……使烈怒如雨降在他身上
  rationale: 保留使动词的降雨意象，并把所降之物承接为前文的“烈怒”。诗体形式虽似复数，语境所指仍是单数的恶人。
- source_word: בִּלְחוּמוֹ
  choice: 在他进食时
  rationale: 该词形和句法困难，可能涉及食物、吃食或进食时刻。正文采用符合上下文的时间性理解，同时以脚注保留“作为食物”的可能解释。
theological_decisions:
- issue: 施行审判之动词的隐含主语
  choice: 在中文正文中明说“上帝”
  alternative: 保留连续的“他”，或改用无主句
  rationale: 上下文把烈怒与审判归于上帝；中文若只用“他”，容易误读为恶人把自己的怒气发向自己。明说“上帝”是澄清语篇指代，而非增添宗派性解释。
- issue: 末句与“烈怒”的关系
  choice: 把如雨降下之物理解为前文的“烈怒”
  alternative: 将末句理解为上帝把审判“作为他的食物”降下
  rationale: 希伯来文宾语需由上文补足，而末尾 בִּלְחוּמוֹ 含义不确定。正文采用连贯的饮食时刻理解，脚注保存另一种与食物更直接相连的读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肚腹”保留诗歌中的身体意象；“烈怒”“如雨降下”维持审判诗歌的力度。正文避免过度解释末句，并用脚注呈现真实的原文难点。
