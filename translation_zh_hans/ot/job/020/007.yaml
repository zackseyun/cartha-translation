  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: zh_hans
  text: 像自己的粪便一样[a]，他必永远灭亡；见过他的人会说：“他在哪里？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像自己的排泄物一样。”原文使用了一个刻意羞辱人的意象。
    reason: 说明גֶּלֶל的词义范围，并保留原文刻意贬抑的修辞力度。
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: 像自己的粪便一样
  rationale: גֶּלֶל指粪便、排泄物；附加的第三人称单数后缀表示“他的”。译作“自己的粪便”既保留原文刻意羞辱、贬抑的意象，也使现代汉语表达自然明确。
- source_word: לָנֶצַח
  choice: 永远
  rationale: נֶצַח在此表示持续而不再逆转的久远时间；“永远”简洁地保留了彻底、长久消失的力度。
- source_word: יֹאבֵד
  choice: 灭亡
  rationale: אבד在此表达毁灭、消亡；“灭亡”比“消失”更能保留原词所含的败亡力度，同时符合诗歌审判语境。
- source_word: רֹאָיו
  choice: 见过他的人
  rationale: 该分词带第三人称后缀，直译为“看见他的人”；结合人物败亡前后的对比，“见过他的人”自然表达那些先前认识或看见过他的人。
- source_word: יֹאמְרוּ
  choice: 都要说
  rationale: אמר基本义为“说”。下文自身是问句，无须把动词解释性地改译为“问”；“都”自然承接复数主语。
- source_word: אַיּוֹ
  choice: 他在哪里？
  rationale: 这是带第三人称单数后缀的方位疑问词，直接表示“他在哪里？”；不增添“如今”或“去了哪里”，以免加入原文未明说的信息。
