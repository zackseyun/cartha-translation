translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前半句保留富足达到顶点与困苦临到之间的强烈反差；后半句保留“手”的希伯来语意象，并以脚注交代 עָמֵל 与 תְּבוֹאֶנּוּ 的歧义。
