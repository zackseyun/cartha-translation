  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
translation:
  language: zh_hans
  text: 在他丰裕充足之时，他必陷入困境；一切困苦之人的手都要临到他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦之人”也可译作“劳苦者”或“悲惨的人”。“手”可指人的行动或势力；“临到他”直译为“来到他那里／临到他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות שִׂפְקוֹ
  choice: 他富足到了极点时
  rationale: בִּמְלֹאות 表达时间或处境，可译为“在……满盈时”；שִׂפְקוֹ 指他的充足、丰裕。合译既保留“达到满盈”的意象，又符合现代汉语表达。
- source_word: יֵצֶר לוֹ
  choice: 困苦必临到他
  rationale: 该表达含受挤压、陷入窘迫之意；译作“困苦必临到他”自然传达由宽裕骤转困厄的反差，而不把具体灾难说死。
- source_word: כָּל יַד
  choice: 所有……之人的手
  rationale: 保留希伯来语以“手”表示力量或行动主体的鲜明意象；“所有”传达 כָּל 的整体或分配意味。
- source_word: עָמֵל
  choice: 受苦之人
  rationale: עָמֵל 可指劳苦者、困苦者或处于悲惨境况的人。上下文中“受苦之人”较自然，也保留其所受劳苦或苦难的语义范围。
- source_word: תְּבוֹאֶנּוּ
  choice: 都要攻击他
  rationale: 字面为“来到他那里／临到他”；与“手”连用时语境带敌对意味，译为“攻击他”使汉语关系清楚。
