  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: zh_hans
  text: 他的骨头充满青春的活力[a]，但这活力必与他一同躺卧在尘土中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的骨头充满他的青春”；原文这个词既可指青春本身，也可指青春所具有的活力。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: 他的骨头
  rationale: 保留希伯来文“骨头”的具体意象；复数名词带第三人称阳性单数后缀。
- source_word: מָלְאוּ
  choice: 充满
  rationale: 该词是完成式，但希伯来诗歌中可描写现存状态；中文“充满”自然保留时态上的一定开放性，避免强行限定为过去。
- source_word: עֲלוּמָיו
  choice: 青春的活力
  rationale: 该词可指青春本身，也可指青春时期的旺盛力量；正文按语境表达后者，并以脚注保留前者。
- source_word: וְעִמּוֹ
  choice: 与他一同
  rationale: 直接表达介词“与”和第三人称阳性单数后缀所表示的伴随关系。
- source_word: עַל־עָפָר
  choice: 在尘土中
  rationale: 形式上是“在尘土之上”，但在死亡与埋葬意象中，现代汉语以“在尘土中”更自然。
- source_word: תִּשְׁכָּב
  choice: 必……躺卧
  rationale: 第三人称阴性单数未完成式，承接前句所指的青春或青春活力；“必”体现语境中的将来归宿，“躺卧”保留死亡诗歌意象。
theological_decisions:
- issue: 躺卧者的所指
  choice: 以“这活力”明示承接“青春的活力”
  alternative: 不明示主语，或理解为“青春”
  rationale: 希伯来文动词为阴性单数，最自然地回指青春或青春活力这一概念；正文用“这活力”使中文清楚，同时脚注保留词义上的另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留“骨头”“躺卧”“尘土”等具体诗歌意象。
