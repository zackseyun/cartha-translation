base_translation:
  language: en
  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: zh_hans
  text: 诸天要揭露他的罪孽[a]，大地要起来与他为敌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可译作“罪责”；希伯来语一词既可指道德上的恶行，也可指恶行所带来的罪责。
    reason: lexical_alternative
  - marker: b
    text: “大地要起来与他为敌”也可译作“大地要起来反对他”。
    reason: translation_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: 要揭露
  rationale: 该词是 גלה 的 Piel 未完成式，表示使隐藏之事显明；“揭露”既自然，又保留审判语境中罪恶被公开的意味。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 希伯来语形式为复数，在这里被拟人化为宇宙性的见证者；“诸天”保留诗体的庄重感，并与“大地”构成对仗。
- source_word: עֲוֺנוֹ
  choice: 他的罪孽
  rationale: עָוֹן 可指罪恶行为，也可指由此产生的罪责；正文采用“罪孽”以保留道德与司法分量，脚注说明另一可能。
- source_word: וְאֶרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指“地”或“土地”；这里与“诸天”平行，并有宇宙拟人色彩，因此译为“大地”。
- source_word: מִתְקוֹמָמָה
  choice: 要起来
  rationale: 该形式源自 קום，表达起身对抗；“起来”保留原文鲜明的拟人意象。
- source_word: לוֹ
  choice: 与他为敌
  rationale: 介词 ל־ 在“起来”这一敌对语境中具有反对、攻击的含义；“与他为敌”自然传达这种对抗关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“诸天—大地”保留原文的宇宙性平行结构；两句都用“要”表达未完成式在上下文中的将来指向。
