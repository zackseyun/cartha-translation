  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: zh_hans
  text: 云消散而去；下到示俄勒[a]的人也照样不上来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示俄勒”是希伯来语音译，也可译作“阴间”、“坟墓”或“死者之境”。
    reason: 说明原词的语义范围，并避免将其限定为含义较窄的“坟墓”或后期教义中的“地狱”。
lexical_decisions:
- source_word: כָּלָה
  choice: 消散
  rationale: 该动词表示终结、耗尽；以“云”为主语时，“消散”自然传达云逐渐归于无有的意象。
- source_word: עָנָן
  choice: 云
  rationale: 采用普通名词的直接含义，保留本节的比喻形象。
- source_word: וַיֵּלַךְ
  choice: 而去
  rationale: 字面为“就走了”；与“消散”连用时，“而去”既保留移动表达，也自然表示云的消失。
- source_word: כֵּן
  choice: 照样
  rationale: 明确引出云与下到示俄勒之人的类比，符合现代汉语表达。
- source_word: יוֹרֵד
  choice: 下到……的人
  rationale: 分词在此作名词使用，泛指任何下到示俄勒的人；此译保留其概括性及向下的空间意象。
- source_word: שְׁאוֹל
  choice: 示俄勒
  rationale: 以音译保留希伯来语概念，不将其局限为坟墓，也不把它解释成带有更明确教义含义的地点；脚注说明其可能含义。
- source_word: לֹא יַעֲלֶה
  choice: 不会再上来
  rationale: 保留与“下到”对应的上下意象；“不会再”在汉语中自然表达本句从人的现世观察所说的死亡不可逆转性。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 示俄勒
  alternative: 阴间、坟墓、死者之境
  rationale: 该词可指死者所在之境，也与坟墓和死亡领域相关。采用音译可保存原文的语义张力，避免把它直接等同于坟墓或具有后期教义内涵的“地狱”。本节从约伯的处境描述死亡在人看来不可逆，并非对复活作完整的教义论述。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“消散而去”保留诗歌的凝练感；“下到……上来”保存原文鲜明的垂直意象。
