base_translation:
  language: en
  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: zh_hans
  text: 观看我的人，他的眼睛必不再看见我[a]；你的眼目要看我，我却不在了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“观看我的眼睛必不再看见我。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“你的眼目在我身上，而我不在。”意思是：到你察看或寻找我时，我已经不在了。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: 必不再注视我
  rationale: שׁור表示观看、凝视；“注视”保留视觉焦点和诗歌语气。否定未完成式结合上下文按将来情境表达，“不再”体现约伯即将从人眼前消失。
- source_word: עֵין רֹאִי
  choice: 那看见我的眼睛
  rationale: 该结构直译为“看见我之人的眼睛”。中文以“那看见我的眼睛”保留希伯来诗歌以“眼睛”代指观看者的具体意象，同时不额外限定观看者身份。
- source_word: עֵינֶיךָ
  choice: 你的眼目
  rationale: 原文为复数，并在上下文中直接对上帝说话。“眼目”既保留具体的拟人表达，也符合庄重而自然的现代中文语体。
- source_word: בִּי
  choice: 落在我身上
  rationale: 介词字面义为“在我身上”。与“眼目”搭配译作“落在我身上”，自然表达目光朝向约伯，又不把原文明确改写成“寻找”。
- source_word: וְאֵינֶנִּי
  choice: 我却已不在了
  rationale: 字面为“而我不在”。这里表示约伯届时已经消失或死亡；“却已不在了”传达将来语境中的结果，并保留原句目光落下而人已不在的张力。
theological_decisions:
- issue: “你的眼目”的所指对象
  choice: 按上下文理解为约伯对上帝的直接称呼，但正文不补出“上帝”
  alternative: 理解为泛指某个观看者
  rationale: 本段前后约伯都在直接向上帝说话，因此第二人称最自然地指上帝；原文没有在本句明说上帝之名，译文也不扩写，以免消除诗句本身的含蓄。
- issue: “眼目落在我身上”与“我却已不在”的时间及意义张力
  choice: 保留并置的表达，不明确解释为上帝寻找约伯
  alternative: 译成“你寻找我时，我已经不在了”
  rationale: 希伯来文只说“你的眼目在我身上，而我不在”，可由语境理解为目光寻找时约伯已消失。正文保留这种凝缩和张力，脚注再说明其惯用含义。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“眼目”与“注视”保留希伯来诗歌的视觉意象；全句维持对称、凝缩的哀歌节奏。脚注标记[a]、[b]均已置于正文对应位置。
