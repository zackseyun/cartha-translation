  text: so that my soul chooses strangling[b][a], death rather than my bones.
translation:
  language: zh_hans
  text: 以致我的生命宁可选择窒息[a]，也宁可死亡，不愿继续带着这副骨头活着[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的生命宁愿被勒死”，或“我的生命宁愿窒息”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“死亡从我的骨头而来”。这里的关系不很寻常，通常理解为：他宁愿死，也不愿继续在这副饱受痛苦的身体中活着。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: 宁愿选择
  rationale: 动词 בחר 意为“选择”。结合本节在约伯愿望陈述中的诗歌语境，用“宁愿选择”自然表达其取舍之意；希伯来语形式本身直接陈述这一选择。
- source_word: מַחֲנָק
  choice: 窒息
  rationale: 该名词可指勒死、噎住或窒息。“窒息”在现代汉语中自然明确，同时保留原文强烈而具体的死亡意象。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נֶפֶשׁ 在这里指说话者本人或其生命。译成“我”符合现代汉语习惯，也避免“我的灵魂选择”可能引起的非原文所必需的身心二分联想；脚注注明“我的生命”这一可能表达。
- source_word: מָוֶת
  choice: 死亡
  rationale: 直接对应 מָוֶת，并保留原文在“窒息”之后并列强调死亡的表达。
- source_word: מֵעַצְמוֹתָי
  choice: 也不要这副骨头
  rationale: 原文字面为“从我的骨头”，在此通常按比较关系理解，即宁愿死亡，也不愿继续承受这副受苦的躯体。正文保留“骨头”的诗歌意象，不将其直接化约为“身体”。
