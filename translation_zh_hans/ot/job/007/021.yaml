  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: zh_hans
  text: 你为什么不赦免我的过犯，除去我的罪孽？因为如今我就要躺卧在尘土中；你必切切寻找我[a]，我却已经不在了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必清早寻找我。”原词既可带有清早寻找的意味，也可表示殷切、迫切地寻找。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: 赦免
  rationale: נשׂא本义为“举起、承担”，以过犯为宾语时是赦免、除去罪责的惯用表达；“赦免”在现代汉语中清楚而庄重。
- source_word: פִשְׁעִי
  choice: 我的过犯
  rationale: פשע常指越界、悖逆性的过犯；“过犯”保留其道德分量，并与下文“罪孽”有所区别。
- source_word: וְתַעֲבִיר
  choice: 除去
  rationale: עבר的使役形在此表示使罪孽过去、移除；“除去”自然表达罪责被移走，而不将其弱化为仅仅忽略。
- source_word: עֲוֺנִי
  choice: 我的罪孽
  rationale: עון可指罪孽、罪责或罪的后果；在与פשע平行的语境中，“罪孽”保留其道德和神学分量，也不把含义限缩为主观罪疚感。
- source_word: כִּי עַתָּה
  choice: 因为如今……就要
  rationale: 该短语引出约伯请求的理由，并表达死亡迫近；“如今……就要”兼顾因果与紧迫的时间意味。
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: 我就要躺卧在尘土中
  rationale: 直译保留尘土所承载的死亡、归土和埋葬意象，不直接释为“死去”。
- source_word: וְשִׁחֲרְתַּנִי
  choice: 你必切切寻找我
  rationale: שׁחר的强意形可有清早寻求或殷切寻求之意；“切切寻找”表达其迫切、认真意味，同时以脚注保留“清早寻找”的可能。
- source_word: וְאֵינֶנִּי
  choice: 我却已经不在了
  rationale: 原文直为“而我不在”，在未来语境中指届时已经消逝或死亡；“我却已经不在了”自然保留含蓄表达，并呈现与寻找之间的转折。
theological_decisions:
- issue: 两个罪恶用语的区分
  choice: 将פשע译为“过犯”，将עון译为“罪孽”
  alternative: 两者都译为“罪”，或译作“悖逆”和“罪责”
  rationale: 原文有意使用两个相关而不同的词；分别翻译可保留诗歌平行结构及其丰富的道德词汇，而不强行规定更狭窄的教义含义。
- issue: “躺卧在尘土中”的死亡意象
  choice: 保留具体的尘土意象
  alternative: 直接译为“我就要死了”
  rationale: 原文以归于尘土暗示死亡；保留意象比解释性改写更能呈现诗歌力量及约伯话语中的张力。
- issue: 神在约伯死后“寻找”他的表达
  choice: 直译为“你必切切寻找我”，不补充寻找的目的或原因
  alternative: 解释为神要帮助、眷顾或审判约伯
  rationale: 原文没有说明神为何寻找约伯；不加解释可保留其真实歧义和约伯对死亡迫近的悲怆张力。
translation_notes:
  register: 采用现代、庄重而自然的普通话。以“赦免／除去”和“过犯／罪孽”保留原文的平行与差异；“切切寻找”略带诗体色彩，但普通读者易懂。主文中的脚注标记[a]与脚注对应。
