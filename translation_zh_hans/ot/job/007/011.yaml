  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: zh_hans
  text: 我也不闭口[a]；我要在我灵里的苦闷中说话[b]；我要在心里的苦涩中诉苦[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我也不约束（或抑制）我的口。”这是指不再抑制自己说话。
    reason: 保留希伯来语身体意象及其惯用含义。
  - marker: b
    text: “苦闷”也可译作“困苦”或“痛苦”。
    reason: צַר 的语义包括困窘、苦闷和痛苦，具体强度有一定开放性。
  - marker: c
    text: “诉苦”也可译作“哀叹”、“倾诉”或“述说”。
    reason: שׂיח 可指沉思或述说，也可在哀歌语境中表示哀叹、抱怨。
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 保留其基本的附加意义，承接上文，但不把它强化为原文未明说的因果连接词。
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: 不闭口
  rationale: 希伯来语字面为“不约束／扣住我的口”，实际表达不再抑制自己的言语；“不闭口”在现代汉语中自然简洁，脚注保留原文意象。
- source_word: אֲדַבְּרָה
  choice: 我要……说话
  rationale: 此处未完成式表达约伯的意愿或决心；“我要说话”直接保留 דּבר 的普通语义。
- source_word: בְּצַר רוּחִי
  choice: 在灵里的苦闷中
  rationale: צַר 表示困窘、苦闷或痛苦；רוּחַ 在此指约伯内在的灵，而非圣灵。“苦闷”符合哀诉语境，又不把情绪程度限定得过死。
- source_word: אָשִׂיחָה
  choice: 我要……诉苦
  rationale: שׂיח 可表示沉思、述说、哀叹或抱怨；结合“心里的苦涩”，这里用“诉苦”体现哀诉意味，同时以脚注保留词义范围。
- source_word: בְּמַר נַפְשִׁי
  choice: 在心里的苦涩中
  rationale: מַר 表示苦或苦涩；נֶפֶשׁ 可指生命、自我或心魂。现代汉语用“心里”自然表达人的内在自我，并与前句的“灵”保持区别。
theological_decisions:
- issue: 希伯来诗歌中 רוּחַ 与 נֶפֶשׁ 的关系
  choice: 分别译为“灵”和“心”，保留两个不同词语及其平行关系
  alternative: 都译为“内心”或“心灵”
  rationale: 原文用两个不同的人论词汇作诗意平行。区别翻译可保留文本层次，但不据此建立关于人体构成的技术性教义。
- issue: 约伯言语的性质
  choice: 将 אָשִׂיחָה 译为“诉苦”
  alternative: “倾诉”、“哀叹”或“述说”
  rationale: 上下文支持带有怨苦的哀诉，但该动词本身语义较宽；正文采用符合语境的表达，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不闭口”避免生硬直译，同时借脚注保存原文“不约束我的口”的意象；“灵”与“心”在诗句中形成自然平行，既保留词汇差异，也避免赋予二者过度技术化的神学定义。
