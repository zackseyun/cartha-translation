base_translation:
  language: en
  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: zh_hans
  text: 我躺下时[a]，就说：“我什么时候才能起来？”夜晚却仿佛被拉得很长[b]；我饱受辗转不安之苦，直到晨曦[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如果我躺下”。希伯来语 אִם 通常可表示条件，但这里很可能指反复发生的情形。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“晚间被量度”。这里形容晚间仿佛不断延长，迟迟没有尽头。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语 נָשֶׁף 可指“暮光”，既可用于黄昏，也可用于黎明；这里按语境译作“晨曦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ……时
  rationale: אִם 常表示“如果”，但在这里更自然地引出反复发生的情形，即约伯每逢躺下时的经历；脚注保留条件式理解。
- source_word: שָׁכַבְתִּי וְאָמַרְתִּי
  choice: 我躺下时，便说
  rationale: 两个完成式动词在哀歌语境中描述惯常、反复的经历，用现代汉语的习惯性表达比单次过去事件更贴切。
- source_word: מָתַי אָקוּם
  choice: 我什么时候才能起来
  rationale: קום 在此指从床上起来；“才能”自然传达约伯盼望漫漫长夜结束的焦灼，但不另加原因。
- source_word: וּמִדַּד עָרֶב
  choice: 晚间却像量不完似的
  rationale: מדד 的基本意象与“量度”有关，此处表达晚间仿佛被拉长、迟迟不尽。“像量不完似的”既保留原文意象，又让现代读者明白其体验性含义。
- source_word: וְשָׂבַעְתִּי
  choice: 我饱受……之苦
  rationale: שׂבע 本义为“饱足、充满”；在负面语境中，“饱受……之苦”自然传达被痛苦经历充满、压倒的意味。
- source_word: נְדֻדִים
  choice: 辗转不安
  rationale: 该复数名词描写夜间反复翻动或躁动；“辗转不安”兼顾身体动作与无法安歇的状态。
- source_word: עֲדֵי נָשֶׁף
  choice: 直到晨曦
  rationale: נָשֶׁף 可指黄昏或黎明的微光；这里是漫长夜晚的终点，语境较支持“晨曦”，同时在脚注保留词义范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“像量不完似的”保留希伯来文的量度意象；“饱受辗转不安之苦”则以自然汉语表达原文“充满辗转”的负面饱足感。所有词义歧义均以脚注保留。
