  naturalness: 原句整体自然，但“让我独自片刻，好咽下自己的唾沫”在现代汉语中略显刻意，并且“好”容易被理解为目的，而非时间限度。改为“连让我咽下自己唾沫的工夫也不肯给”更符合汉语习惯，也保留原文的鲜明身体意象与极短暂的习语含义。
