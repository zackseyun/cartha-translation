  yaml_path: translation/ot/job/007/019.yaml
  text: How long will you not look away from me[a], nor leave me alone until I swallow my spit?
translation:
  language: zh_hans
  text: 你到几时才肯把目光从我身上移开，不再逼迫我，连让我咽下自己唾沫的工夫也不肯给呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּמָּה
  choice: 到几时
  rationale: 在哀诉语境中表示时间上的追问；“到几时”既贴近原文，也保留庄重而强烈的质问语气。
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: 把目光从我身上移开
  rationale: שׁעה在此涉及目光的转向；上下文中约伯求上帝停止紧盯审察，因此如此翻译可自然表达其意象。
- source_word: תַרְפֵּנִי
  choice: 让我独自片刻
  rationale: רפה的使役形在此有放开、停止施压之意。“让我独自片刻”与前句平行，并由下文极短暂的动作说明所求喘息之短。
- source_word: עַד
  choice: 好
  rationale: 原词标示时间界限，直译可作“直到”；在汉语反问句中用“好……”更自然地表达‘容我到完成这一动作’的意思。
- source_word: בִּלְעִי רֻקִּי
  choice: 咽下自己的唾沫
  rationale: 保留希伯来文具体而粗粝的身体意象；这是表示极短时间的说法，不宜在正文中只译成抽象的“喘一口气”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的哀诉表达。正文保留约伯话语中“咽下唾沫”的鲜明意象，同时以“独自片刻”使汉语句法顺畅；不削弱他对上帝持续注视和施压的强烈质问。
