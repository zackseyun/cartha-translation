  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
translation:
  language: zh_hans
  text: 我的肉身被蛆虫和尘土块覆盖；我的皮肤变硬，又再度破溃。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的皮肤收合，又再度化脓。”原文最后两个动词的含义难定；这句话可能描写皮肤暂时愈合或结硬，随后又破开、变坏。
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: 披满
  rationale: 保留“穿上、披着”的鲜明隐喻，同时符合现代汉语对身体被异物覆盖的自然表达。
- source_word: בְּשָׂרִי
  choice: 我的肉身
  rationale: 直接体现身体血肉，较“我的身体”更贴近原词的具体肉体含义。
- source_word: רִמָּה
  choice: 蛆虫
  rationale: 该词指与腐烂相关的虫或幼虫；在伤病语境中，“蛆虫”比泛称“虫子”更具体，但不超出其语义范围。
- source_word: גיש עפר
  choice: 尘土硬块
  rationale: גיש是罕见形式，可能指块状、结块之物；与“尘土”连用，译作“尘土硬块”既保留原有意象，也暗示黏附在皮肤上的结块。
- source_word: עוֹרִי
  choice: 我的皮肤
  rationale: 采用该词通常且自然的现代汉语对应词。
- source_word: רָגַע
  choice: 刚结痂
  rationale: 末句两动词语义困难；结合皮肤病变的上下文，此词可理解为皮肤暂时收合或凝结。“刚”表达短暂无常的过程，但不把它解释为真正痊愈。
- source_word: וַיִּמָּאֵס
  choice: 又溃烂了
  rationale: 该动词通常涉及厌弃或可憎，在此身体语境中可能描写皮肤再次变坏、破溃。译文按上下文呈现病变循环，并以脚注保留原文困难和另一理解。
