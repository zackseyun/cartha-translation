  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: zh_hans
  text: 难道我是海[a]，或是海怪[b]，你竟在我身上设下看守吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海”在此类诗歌语境中可带有强大、难以制伏的意象。
    reason: imagery_clarification
  - marker: b
    text: “海怪”所译的希伯来语也可指“龙”或“大蛇”，泛指巨大而可怕的生物；末句的“看守”也可译为“守望”或“监视”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: 难道我是海
  rationale: 疑问词 הֲ 与“海”构成反问；用“难道”自然传达约伯质问的语气，同时保留“海”的古代诗歌意象。
- source_word: אִם
  choice: 或是
  rationale: 此处在并列反问中起选择、连接作用，译作“或是”符合现代汉语。
- source_word: תַּנִּין
  choice: 海怪
  rationale: 该词可指巨大的水中怪物、龙或蛇；与“海”并列时，“海怪”既清楚又保留威胁与混沌的诗歌意象，且不把具体神话体系强加于经文。
- source_word: כִּי
  choice: 竟
  rationale: 这里引出反问所针对的情形。汉语用“竟”衔接前后，并凸显约伯惊诧、抗议的语气，而不硬译为因果连词。
- source_word: תָשִׂים
  choice: 派
  rationale: שׂים 的基本义是放置、设立；与“守卫”搭配时，汉语“派守卫”自然表达设立监守者之意。
- source_word: עָלַי
  choice: 看守我
  rationale: 介词 עַל 表示监视或管束所针对的对象；在现代汉语中融入“看守我”比直译“在我之上”更自然。
- source_word: מִשְׁמָר
  choice: 守卫
  rationale: 该词可指守卫、看守或监禁状态；“守卫”保留有人或某种力量被设置来监守约伯的图景。
theological_decisions:
- issue: תַּנִּין 的诗歌性混沌意象
  choice: 译作“海怪”，不进一步神话化
  alternative: 龙；大蛇；怪兽
  rationale: 本节把约伯与海及危险的巨大生物并列，暗示需要受约束的威胁。译文保留这种张力，却不认定某一特定神话身份。
- issue: 约伯对上帝监守的质问
  choice: 保留直接而强烈的反问语气
  alternative: 弱化为关于上帝照管的陈述
  rationale: 原文表达的是约伯因受持续监守而发出的抗议；不应把“监守”解释成温和的眷顾，以免消解本节的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“难道……竟……”传达约伯的惊诧与抗议；“派守卫看守我”在汉语中自然，并保留受监视、受约束的含义。所有脚注标记均已置于正文。
