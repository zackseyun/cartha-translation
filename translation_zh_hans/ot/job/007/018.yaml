  yaml_path: translation/ot/job/007/018.yaml
  text: that you attend to him every morning[b][a], and test him every moment?
translation:
  language: zh_hans
  text: 你每天早晨察看他[a]，每时每刻试验他[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每天早晨探访他”或“每天早晨留意他”。希伯来语动词可指“探访”“留意”或“察看”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“每时每刻察验他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: 你……察看他
  rationale: פקד 在此可指探访、留意或察看；结合与下句“试验”构成的平行，以及约伯抱怨的语境，“察看”既保留神持续关注人的含义，也不把这种关注限定为慈爱的眷顾。
- source_word: לִבְקָרִים
  choice: 每天早晨
  rationale: 复数 בקרים 配合介词 ל 表达反复发生；“每天早晨”符合现代汉语，并保留逐日重复之意。
- source_word: לִרְגָעִים
  choice: 每时每刻
  rationale: רגעים 指短暂的时刻；“每时每刻”自然地表达连续而反复的密集频率。
- source_word: תִּבְחָנֶנּוּ
  choice: 试验他
  rationale: בחן 可指试验或察验，带有审查、检验的意味；“试验”与约伯感到神不断审视他的语境相称。
- source_word: ־נּוּ（阳性单数宾语后缀）
  choice: 他
  rationale: 该后缀回指上一节的“人”，保留原文阳性单数的指代。
theological_decisions:
- issue: 神关注人的语气
  choice: 译成持续而令人感到压力的察看与试验
  alternative: 译成纯粹慈爱、安慰性的眷顾或探访
  rationale: 在约伯的反问和抱怨中，这种神圣关注带有沉重、受审视的意味；译文不应把这一张力弱化为单纯的慈爱照顾。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留原文反问句式，并以“察看—试验”的平行表达呈现约伯所感受到的持续审视；脚注标记均置于相应主文词语之后。
