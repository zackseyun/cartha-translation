  yaml_path: translation/ot/job/007/006.yaml
  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
translation:
  language: zh_hans
  text: 我的日子比织布的梭子更快[a]；它们在毫无盼望中结束。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “织布的梭子”：原文所用词可较宽泛地理解为织布器具，也有人理解为织布机；这里译作“梭子”，最能体现迅速移动的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: 我的日子
  rationale: 保留希伯来语具体的复数表达，呈现约伯逐日感受到的人生短促。
- source_word: קַלּוּ
  choice: 还快
  rationale: 该动词在这里表示迅速、飞快；与比较介词搭配，译作“比……还快”自然地保留比较意义。
- source_word: מִנִּי אָרֶג
  choice: 比织布的梭子
  rationale: אָרֶג可指织布器具；上下文强调迅疾运动，因此“织布的梭子”最能传达这一形象，但词义范围并非毫无争议，故加注说明。
- source_word: וַיִּכְלוּ
  choice: 消逝
  rationale: כלה表示完结、耗尽；“消逝”既表达日子走到尽头，也符合本节诗歌语气。
- source_word: בְּאֶפֶס תִּקְוָה
  choice: 在毫无指望中
  rationale: אפס表达缺无，תִּקְוָה表示指望或盼望；此译保留介词结构及约伯处境中的绝望语气。
theological_decisions:
- issue: “毫无指望”是约伯当下的陈述，还是关于终极救恩的教义判断
  choice: 按诗歌语境保留约伯“毫无指望”的直接表述
  alternative: 解释为约伯仅仅暂时感到灰心，或断言他否认一切终极盼望
  rationale: 原文没有在本节限定这种无望感的范围；翻译不应弱化其张力，也不应将其扩展成系统神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“比……还快”自然保留希伯来语的比较结构；“消逝”比机械的“结束”更符合汉语诗歌语感。脚注标记已置于相关词语之后。
