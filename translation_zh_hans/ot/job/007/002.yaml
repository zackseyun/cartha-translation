  text: Like a slave who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: zh_hans
  text: 像奴隶渴望阴凉[a]，又像雇工等候他的工钱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”或译“仆人”；希伯来语עֶבֶד可涵盖两者。这里与领取工钱的雇工相对，着重表现受人支配、辛苦劳作的处境。
    reason: lexical_alternative
  - marker: b
    text: “工钱”或译“报酬”；希伯来语在这里指雇工劳动所得。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/עֶבֶד
  choice: 像奴仆
  rationale: עֶבֶד可指奴隶或仆人；这里与辛苦劳作、渴望歇息的处境相连。“奴仆”既保留受制于人的身份，也比单用“奴隶”更符合庄重的现代汉语表达。
- source_word: יִשְׁאַף
  choice: 盼望
  rationale: שׁאף在此表达强烈渴求；“盼望”自然地传达殷切期待，又不把本句限定为字面的喘息。
- source_word: צֵל
  choice: 阴凉
  rationale: צֵל本义可为“影子”，但在劳作语境中指躲避炎热所得的荫蔽和凉爽；“阴凉”准确呈现其语境意义。
- source_word: וּ/כְ/שָׂכִיר
  choice: 又像雇工
  rationale: שָׂכִיר指受雇取酬的工人；“雇工”简洁保留其按劳得酬的经济身份。
- source_word: יְקַוֶּה
  choice: 等候
  rationale: קוה可表示等候或盼望；工钱是劳作后应得之物，因此“等候”最贴合此处带着期待的等待。
- source_word: פָעֳל/וֹ
  choice: 他的工钱
  rationale: פֹּעַל可指工作、成果或报酬；与“雇工”搭配时，语境最自然地指劳动所得。“工钱”是现代汉语中清楚而贴切的表达。
