  text: When I say[a], ‘My bed will comfort me[b]; my couch will bear my complaint,’
translation:
  language: zh_hans
  text: '当我说[a]：

    “我的床必安慰我，

    我的卧榻必承受我的愁诉[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “当……”或译“因为”或“若”。希伯来语 כִּי 在这里可有不同理解；结合上下文的推进，译作“当我说”较为自然。
    reason: lexical_alternative
  - marker: b
    text: “愁诉”或译“默想”“沉思”。希伯来语 שִׂיחַ 可指内心思索，也可指哀叹申诉；这里按约伯受苦的语境译为“愁诉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 此处可作因果、时间或条件解；结合下一节“你就用梦惊骇我”的承接，条件表达“我若说……你就……”在现代汉语中最自然，同时以脚注保留其他可能。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 形式上是完成式，但在条件句中可指约伯每逢如此自语；汉语用“我若说”无需明确过去时，也能自然表达当前或反复的内心言语。
- source_word: תְּנַחֲמֵנִי
  choice: 必安慰我
  rationale: נחם 的 Piel 形式在此指安慰、使得宽慰；“安慰我”直接、庄重，并保留床被拟人化的诗意。
- source_word: עַרְשִׂי
  choice: 我的床
  rationale: עֶרֶשׂ 指床或卧榻；译作“床”，并与下半句“卧榻”形成近义平行。
- source_word: יִשָּׂא
  choice: 必分担
  rationale: נשא 基本义为承担、背负；“分担”适合床榻承接愁苦言语的语境，也比生硬的“承载我的愁诉”更符合现代汉语。
- source_word: בְשִׂיחִי
  choice: 我的愁诉
  rationale: שִׂיחַ 可指沉思、低语或哀诉；约伯受苦申诉的语境支持“愁诉”，同时脚注保留较中性的含义。
- source_word: מִשְׁכָּבִי
  choice: 我的卧榻
  rationale: מִשְׁכָּב 指躺卧之处、床榻；“卧榻”既自然庄重，又与“床”保持诗歌中的近义变化。
