  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: zh_hans
  text: 如此，我被分派了虚空的月份[a]；劳苦的夜晚[b]也派定给了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空的月份”或译“徒然的月份”或“虚妄的月份”。
    reason: lexical_alternative
  - marker: b
    text: “劳苦的夜晚”或译“困苦的夜晚”“患难的夜晚”或“痛苦的夜晚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 也照样
  rationale: 承接上一节雇工和奴仆的比喻，既可表达“如此”的比较，也保留由前文引出的语气。
- source_word: הָנְחַלְתִּי לִי
  choice: 我……承受了
  rationale: Hoph'al形式表明约伯是被给予这份境遇的人。“承受”自然表达被动领受某种命运或份额的意味，同时避免误解为主动分配。
- source_word: יַרְחֵי
  choice: 岁月
  rationale: 原文直译为“月份”。中文哀歌语境中“岁月”较自然，仍表达一段以月计的漫长时日。
- source_word: שָׁוְא
  choice: 虚空
  rationale: 可指空虚、徒然、无价值。此处“虚空”保留其意义幅度，不把它仅限于主观痛苦或客观无所作为。
- source_word: וְלֵילוֹת עָמָל
  choice: 困苦的夜晚
  rationale: עָמָל可表示劳苦、患难、痛苦；结合约伯夜间受折磨的语境，“困苦”自然且不把词义缩窄为劳动。
- source_word: מִנּוּ לִי
  choice: 也分派给了我
  rationale: 被动复数动词以“夜晚”为主语，表示这些夜晚被指定或分配给约伯。“分派”保留一种不得不领受的份额感。
