  text: הֲ/לֹא צָבָ֣א לֶ/אֱנ֣וֹשׁ על אָ֑רֶץ וְ/כִ/ימֵ֖י שָׂכִ֣יר יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: zh_hans
  text: 人在地上岂不是服苦役吗[a]？他的日子岂不像雇工的日子吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人在地上岂不是争战吗？”希伯来语“צָבָא”可指军役或争战；但这里与“雇工”平行，较可能泛指一段沉重的服役或劳苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂不是……吗
  rationale: 这是期待肯定回答的反问；此译法在现代汉语中自然地保留反问语气。
- source_word: צָבָא
  choice: 服苦役
  rationale: 该词可指战争、军役或规定期限的服役；本节与“雇工的日子”平行，重点较可能是受支配而艰苦的劳役。“服苦役”保留其强制、沉重的意味。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 此词泛指脆弱、必死的人类；“人”简洁自然，并保持普遍性的指涉。
- source_word: עַל־אָרֶץ
  choice: 在地上
  rationale: 按其广义地点含义直译，指人在世上的处境，而非某一块具体土地。
- source_word: וְכִימֵי
  choice: 他的日子岂不像……的日子吗
  rationale: 原文以比较结构衔接下半句；汉语补出反问成分，使两个平行分句自然完整。
- source_word: שָׂכִיר
  choice: 雇工
  rationale: 指受雇领取工价的劳动者；“雇工”是简洁、现代且无额外贬义的表达。
- source_word: יָמָיו
  choice: 他的日子
  rationale: 保留原文以“日子”指人生时日的表达和与雇工服役期限的对应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“服苦役”呈现原文的沉重服役意象，同时以脚注保留“争战／军役”的真实词义可能。两个“岂不是／岂不像”保留希伯来文反问及诗句的平行结构。
