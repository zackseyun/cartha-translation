  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: zh_hans
  text: 我厌弃我的生命[a]；我不会永远活着。不要再管我了，因为我的日子不过是一口气[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我厌弃它”或“我拒绝它”；希伯来文没有明说“厌弃”的对象。
    reason: lexical_alternative
  - marker: b
    text: “一口气”所译的希伯来词也可指“雾气”，强调人生短暂而易逝。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: 我厌弃我的生命
  rationale: 动词表示“厌弃、拒绝、鄙弃”。希伯来文未明说宾语；结合约伯对死亡的哀叹，正文补出“我的生命”以符合现代汉语表达，同时用脚注保留原文的省略和可能的理解空间。
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: 我不会永远活着
  rationale: 直陈约伯并非永远活着，保留否定、永远和活着的基本语义，不将其改写成愿望。
- source_word: חֲדַל מִמֶּנִּי
  choice: 任凭我吧
  rationale: 命令式 חדל 与“离开／从我”合用，意思是求对方停手、不要再干预。“任凭我吧”是自然而庄重的现代汉语，保留恳求对方放手不管的语气。
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出恳求的理由。
- source_word: הֶבֶל
  choice: 一口气
  rationale: 该词可指气息、雾气，也可引申为短暂无常、虚空；“一口气”具体呈现生命的短促脆弱，又避免把它仅解释为抽象的“虚空”。
- source_word: יָמָי
  choice: 我的日子
  rationale: 保留原文的复数所有格表达，指约伯余下的生命时日。
theological_decisions:
- issue: מָאַסְתִּי 所省略的宾语
  choice: 正文按语境补作“我的生命”，并以脚注说明原文未明说宾语
  alternative: 我厌弃它／我厌弃这一切
  rationale: 上下文围绕约伯宁死及生命短促的哀叹，“我的生命”最易为现代读者理解；但省略宾语本身是真实的原文歧义，因此不把这一补充伪装成唯一可能。
- issue: לֹא לְעֹלָם אֶחְיֶה 的语气
  choice: 理解为对必死性的直陈：“我不会永远活着”
  alternative: 理解为意愿：“我不愿永远活着”
  rationale: 希伯来文未明确标出愿望语气，直陈译法更贴近表层句法，也与下句人生短促的理由相连；不额外强化求死的意愿。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“任凭我吧”避免生硬直译“从我停止”，也不过度具体化为某一种压迫方式。脚注标记均置于其所说明的词句之后；将关于 הֶבֶל 的脚注标在“一口气”处。
