base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: zh_hans
  text: 我若犯了罪[a]，又能把你怎么样呢？人类的守望者啊，你为什么把我当作你的靶子[c]，使我成了自己的重担[d]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“我犯了罪”；这里也可理解为让步性的说法：“即使我犯了罪”。
    reason: 语用歧义
  - marker: c
    text: 也可译作：“你为什么把我设为攻击的目标？”
    reason: 词义替代
  - marker: d
    text: 马所拉文本作“自己的重担”；一些古代译本所反映的读法是“你的重担”。
    reason: 异文
lexical_decisions:
- source_word: חָטָאתִי
  choice: 我若犯了罪
  rationale: 希伯来语形式上是第一人称单数完成式，直译为“我犯了罪”。结合约伯此处申辩性的反问，用“若”表达让步语气，但不把它强化为无条件认罪。
- source_word: מָה אֶפְעַל לָךְ
  choice: 又能把你怎么样呢
  rationale: 保留“对你做什么”的指向，并以现代汉语反问自然表达约伯所强调的无力：即便他犯罪，也不能伤及或影响上帝。
- source_word: נֹצֵר הָאָדָם
  choice: 守望人类的那一位
  rationale: נֹצֵר兼有看守、守护、监视之意；“守望”尽量保留保护与严密注视之间的张力。הָאָדָם在此为泛指、集合意义，译作“人类”。
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: 你为什么把我当作你的靶子
  rationale: מִפְגָּע可指遭击打之物或攻击目标；“靶子”简洁自然，并把לָךְ的关系表达为“你的”。
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: 使我成了自己的重担
  rationale: 马所拉文本的עָלַי意为“在我身上／对我自己”，故译作“自己的重担”，保留较难读法；部分古译本所反映的“你的重担”列入脚注。
theological_decisions:
- issue: חָטָאתִי是否译成直接认罪
  choice: 我若犯了罪
  alternative: 我犯了罪
  rationale: 动词本身是陈述形式，但上下文具有让步和申辩色彩；“若”保留约伯论证中的条件性，不把本句处理成毫无保留的认罪。
- issue: נֹצֵר的保护与监视双重含义
  choice: 守望人类的那一位
  alternative: 鉴察人类的那一位
  rationale: “鉴察”容易只突出审视，“守望”则较能兼顾守护和持续注视，不预先消解约伯话语中的神学张力。
- issue: 末句代词的文本差异
  choice: 自己的重担
  alternative: 你的重担
  rationale: 遵从WLC马所拉文本עָלַי；另有古代译本反映“对你”，作为异读保留在脚注中。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。称呼语“守望人类的那一位”避免添加原文没有的“主”，同时保留诗性；全句维持约伯向上帝发出的尖锐反问，不弱化其抱怨，也不把它解释成特定教派的神学结论。
