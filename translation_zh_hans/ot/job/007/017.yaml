base_translation:
  language: en
  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: zh_hans
  text: 人[a]算什么，你竟如此看重[b]他，又把他放在心上？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”所译的希伯来词 אֱנוֹשׁ，指会死而脆弱的人，也可泛指人类。参《诗篇》8:4。
    reason: 说明原词的代表性单数、语义色彩及经文呼应。
  - marker: b
    text: “看重”也可译作“使他为大”或“抬举他”。
    reason: 保留 תְגַדְּלֶנּוּ 较贴近字面的词义选择。
lexical_decisions:
- source_word: מָה
  choice: 算什么
  rationale: 在“人算什么”这一现代汉语反问句式中，自然直接地表达疑问语气，也保留约伯话语中的质问色彩。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 该词以单数指有死、脆弱的人类；“人”既保留单数代表性，也能与《诗篇》8:4的相近措辞呼应。
- source_word: כִּי
  choice: 竟
  rationale: 此处引出反问的内容；“竟”在汉语中自然表达约伯对上帝如此重视人的困惑和惊异，而不把反问改写为原因句。
- source_word: תְגַדְּלֶנּוּ
  choice: 如此看重他
  rationale: גדל的Piel词形可表示“使之为大、尊为大”。结合上下文，译作“如此看重”清楚表达上帝赋予人重大关注，同时以脚注保留更贴近字面的译法。
- source_word: וְכִי
  choice: 又
  rationale: 连接两个平行的反问分句，现代汉语用“又”简洁自然，并延续前句“竟”的语气。
- source_word: תָשִׁית
  choice: 放在
  rationale: 保留“放置、安置”的基本意象，并与“放在心上”构成自然的汉语表达。
- source_word: אֵלָיו
  choice: 他
  rationale: 指向前文作为代表性单数的“人”，保留希伯来文单数指代。
- source_word: לִבֶּךָ
  choice: 心上
  rationale: “把他放在心上”既保留“心”的拟人化意象，也自然传达关注、留意和挂念等丰富含义。
theological_decisions:
- issue: אֱנוֹשׁ的代表性单数及其性别表达
  choice: 人
  alternative: 世人；凡人；人类
  rationale: 希伯来文用阳性单数代表有死的人类。“人”在现代汉语中可泛指人类，同时保留原文的单数修辞形式，不改成复数或抽象集合名词。
- issue: 上帝“把人放在心上”的拟人化表达
  choice: 又把他放在心上
  alternative: 又关注他；又把心思放在他身上
  rationale: 保留原文“心”的意象，不将其简化为抽象的“关注”；同时采用自然汉语习语，使普通读者容易理解。
- issue: 约伯对诗篇式语言的反向运用
  choice: 保留反问和惊异语气
  alternative: 解释为赞美上帝眷顾人
  rationale: 本节与《诗篇》8:4措辞相近，但在约伯的处境中带有困惑甚至沉重的质问意味。译文不把这种张力单方面解释为赞美或控诉。
translation_notes:
  register: 采用现代、庄重而自然的反问句。“人算什么”简洁有力；“如此看重”传达语境中的重视之意；“把他放在心上”保留“心”的诗性意象，并符合当代普通话习惯。脚注标记均置于其实际说明的词语之后。
