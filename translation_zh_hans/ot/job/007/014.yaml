  text: then you terrify me with dreams and frighten me with visions[a].
translation:
  language: zh_hans
  text: 你就借着梦使我惊恐，又借着异象使我惊惶[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“你在梦中使我惊恐，又从异象中使我惊惶。”希伯来文的两个介词较形式化地可分别译为“在／借着”和“从”。
    reason: 保留介词 ב 与 מן 的词义和句法歧义。
lexical_decisions:
- source_word: וְ
  choice: 就
  rationale: 承接上节约伯所说躺卧后的经历，表达随之而来的结果或情形；比单纯译作“而”更符合现代汉语语境。
- source_word: חִתַּתַּנִי
  choice: 使我惊恐
  rationale: חתת 的加强式在此表示使人陷入强烈恐惧；“使我惊恐”既保留强度，也避免误解为身体上的“击碎”。
- source_word: בַחֲלֹמוֹת
  choice: 用梦
  rationale: 介词 ב 在此可表示手段，译作“用”符合中文习惯，同时保留梦是引发惊恐之媒介的含义。
- source_word: וּמֵחֶזְיֹנוֹת
  choice: 用异象
  rationale: מן 可表示来源或手段；诗句与“用梦”形成平行，正文采用自然的工具性表达，较形式化的来源义置于脚注。
- source_word: תְּבַעֲתַנִּי
  choice: 把我吓住
  rationale: בעת 的加强式表示使人突遭恐惧、惊惶。“把我吓住”自然传达强烈且压制人的惊吓，并与前半句避免机械重复。
theological_decisions:
- issue: 恐惧行为的施事者
  choice: 保留第二人称“你”，按上下文指向上帝
  alternative: 改为非人称表达，如“梦使我惊恐”
  rationale: 希伯来文两个动词均为第二人称阳性单数，带第一人称宾语后缀；应保留约伯直接向上帝申诉所形成的神学张力，不淡化其指控。
translation_notes:
  register: 采用现代、庄重而口语可懂的诗性表达。“惊恐”与“吓住”形成递进式平行；正文流畅，脚注保存希伯来介词的歧义。
