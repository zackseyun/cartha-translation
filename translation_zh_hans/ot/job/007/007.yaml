  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: zh_hans
  text: 求你记得，我的生命不过是一口气[a]；我的眼睛不会再看见美好[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“风”。希伯来词 רוּחַ 可指“气息”“风”或“灵”；这里表达生命短暂易逝。
    reason: lexical_alternative
  - marker: b
    text: “看见美好”也可理解为“经历幸福、安康或顺遂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: 求你记得
  rationale: 这是阳性单数祈使式，语境中约伯向上帝发出恳求；加“求你”自然表达祈求语气，而不改变命令式的直接性。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 此处引出“记得”的内容；现代汉语可直接接宾语从句，无须另译“即/因为”。
- source_word: רוּחַ
  choice: 一口气
  rationale: רוּחַ可指气息、风或灵；在哀歌语境中强调生命短促易逝。“一口气”在汉语中能自然保留这一意象。
- source_word: חַיָּי
  choice: 我的生命
  rationale: 准确表达带第一人称单数后缀的复数形式，符合现代汉语习惯。
- source_word: לֹא תָשׁוּב
  choice: 不会再
  rationale: 动词字面为“返回”；与“眼睛……看见”连用时，“不会再看见”是自然汉语，同时表达不再复返的含义。
- source_word: עֵינִי
  choice: 我的眼睛
  rationale: 希伯来文为单数集合性表达；汉语“眼睛”形式不标明单复数，既自然又不必人为改成“我的双眼”。
- source_word: לִרְאוֹת
  choice: 看见
  rationale: 保留ראה的基本视觉义，也容许其在上下文中表达“经历”。
- source_word: טוֹב
  choice: 福乐
  rationale: טוֹב在此可泛指美好、幸福或顺遂；“福乐”比单说“好处”更适合庄重诗歌语体，又不局限为物质繁荣。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“不过是一口气”传达生命的短促；后半句以自然汉语表达希伯来文“我的眼睛不会返回去看见福乐”的诗性说法。
