  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: zh_hans
  text: 他不再回到自己的家；他的地方也不再认得他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认得”也可译作“承认”。希伯来语动词可指认出，或承认、确认其身份或存在；这里把“他的地方”拟人化。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: 回到
  rationale: שׁוב表示“返回、回去”；与介词短语“自己的家”搭配时，“回到”符合现代汉语习惯。
- source_word: עוֹד（第一次）
  choice: 不再
  rationale: 在否定词לֹא之后表示时间上的终止；汉语用“不再回到”自然表达“不会再返回”。
- source_word: לְבֵיתוֹ
  choice: 自己的家
  rationale: בַּיִת本义为“房屋、家”；此处指死者原来居住的家。“自己的”清楚体现第三人称所属关系。
- source_word: יַכִּירֶנּוּ
  choice: 认得他
  rationale: נכר的使役式可表示“认出、认得、承认”。以“他的地方”为主语时，“认得他”既保留拟人手法，也比泛义的“知道他”更符合现代汉语。
- source_word: עוֹד（第二次）
  choice: 不再
  rationale: 与否定词连用，表示“再也不、从此不再”；重复“不再”保留两分句的平行结构。
- source_word: מְקֹמוֹ
  choice: 他的地方
  rationale: מָקוֹם直译为“地方”。保留这一简洁表达及原文将地方拟人化的诗意，不限定为住宅或社会位置。
theological_decisions:
- issue: 死者不再返回的表述范围
  choice: 按诗歌语境直译为“不再回到自己的家”
  alternative: 解释为关于死后状态或复活可能性的普遍教义陈述
  rationale: 本句描写死者从日常居所永久消失，不应把约伯此刻的哀叹扩展为对所有末世问题的系统性断言。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用分号呈现两个平行分句；保留“他的地方”这一诗性拟人表达，避免解释性扩写。
