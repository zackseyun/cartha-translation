  yaml_path: translation/ot/job/026/011.yaml
  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: zh_hans
  text: 天的柱子因他的斥责而颤抖[a]、惊愕[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摇动”或“震颤”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“震惊”或“骇然”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“从他的斥责”；这里也可理解为“由于他的斥责”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: 天的柱子
  rationale: עַמּוּדֵי 是 עַמּוּד（柱子、支柱）的复数附属形式；“天的柱子”直接保留希伯来诗歌的宇宙意象，不将其解释成山岳，也不把诗性图景改写为现代宇宙观。
- source_word: יְרוֹפָפוּ
  choice: 颤抖
  rationale: רפף 表示摇动、震颤；“颤抖”既传达动态，也与下句因斥责而惊愕的反应相呼应，同时不额外暗示这些柱子将要倒塌。
- source_word: וְיִתְמְהוּ
  choice: 而惊愕
  rationale: תמהּ 表示诧异、惊愕或震惊；“惊愕”保留突然而强烈的反应，又不像“骇然”或“惊骇”那样过度限定为恐惧。
- source_word: מִגַּעֲרָתוֹ
  choice: 因他的斥责
  rationale: 介词 מִן 可表示来源或原因；此处“因”在现代汉语中自然表达斥责所引发的反应。“斥责”保留 גְּעָרָה 所指带权威、威吓性的责令。
theological_decisions:
- issue: “天的柱子”的宇宙意象
  choice: 保留诗歌中的宇宙性图景，不作解释性改写。
  alternative: 译作“山岳”或“天的根基”，以具体说明该意象。
  rationale: 原文明确使用“柱子”，翻译应让这一古老诗性意象保持开放，既不将其现代化，也不把它断定为某种具体宇宙结构。
- issue: 无生命受造界对上帝斥责的反应
  choice: 保留“颤抖、惊愕”的拟人表达。
  alternative: 弱化为单纯的物理震动。
  rationale: 两个动词共同描写宇宙结构面对神斥责时的震动与震惊；保留拟人张力，比将其简化为自然现象更贴近原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“天的柱子”保留原文鲜明的诗歌意象；句式简洁，并以“因……而……”自然呈现介词可能具有的原因含义。
