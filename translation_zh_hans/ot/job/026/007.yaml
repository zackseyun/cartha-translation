base_translation:
  language: en
  yaml_path: translation/ot/job/026/007.yaml
  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: zh_hans
  text: 他把北方[a]铺展在虚空[b]之上，把大地悬在无物之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“北方的天空”。希伯来文直译为“北方”；在这里的诗歌语境中，它可能指北方的诸天。
    reason: lexical_alternative
  - marker: b
    text: 或译“空无”。这个希伯来词可表示空虚、荒芜或未成形的虚无。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: 铺展
  rationale: 该词是נטה的Qal主动分词，表示伸展、铺开；“铺展”自然地保留了诗歌中的宇宙图景。
- source_word: צָפוֹן
  choice: 北方
  rationale: 该名词通常指“北方”；在本节的宇宙语境中也可能指北方的天空，但正文保留希伯来文简洁而含混的表达。
- source_word: תֹּהוּ
  choice: 虚空
  rationale: 该词可表示空无、荒芜或未成形的空虚；“虚空”在现代汉语中简洁庄重，并保留其语义幅度。
- source_word: תֹּלֶה
  choice: 悬
  rationale: 该词是תלה的Qal主动分词，意为悬挂、悬置；“悬”直接保留原文意象。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 本节处于宇宙性的诗歌语境，所指是大地或世界，而非某一特定地域。
- source_word: בְּלִי מָה
  choice: 无物
  rationale: 这一短语意为“没有任何东西”；结合前置词עַל译作“在无物之上”，既简练，也保留原文令人惊异的空间意象。
- source_word: עַל
  choice: 在……之上
  rationale: 该前置词在两个分句中都保留空间关系；中文分别表达为“在虚空之上”和“在无物之上”。”
theological_decisions:
- issue: 宇宙图景
  choice: 按诗歌语言直译为上帝铺展北方、悬置大地的宇宙性描写，不加入现代科学解释。
  alternative: 把本节解释成关于地球悬浮于太空的精确科学陈述，或把“北方”明确扩译为神话地名。
  rationale: 本节以智慧诗歌描绘上帝对受造宇宙的权能。译文应保留希伯来文的鲜明意象，却不把它过度科学化，也不强行落实为特定的古代神话背景。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“铺展”“悬”“虚空”“无物”保留了原文凝练的平行结构和宇宙诗歌意象；脚注分别标在对应词语之后。
