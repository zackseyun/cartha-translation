  yaml_path: translation/ot/job/026/004.yaml
  text: To whom have you declared words[a], and whose breath has come out from you?
translation:
  language: zh_hans
  text: 你向谁说出话语？是谁的气息从你而出？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת מִי
  choice: 向谁
  rationale: 介词性宾语标记置于疑问代词前，在此宜按汉语习惯译为“向谁”，保留约伯反问的指向。
- source_word: הִגַּדְתָּ
  choice: 宣讲
  rationale: נגד 的使役式可指宣告、讲明；“宣讲”既体现把话说给人听，也符合诗歌中略带庄重和讽刺的语气。
- source_word: מִלִּין
  choice: 这些话
  rationale: 该词是《约伯记》中带亚兰语色彩的“话语”复数形式；汉语用“这些话”自然承接比勒达刚才的发言。原文没有明确指示词，但汉语补出“这些”使所指清楚，不改变基本意义。
- source_word: וְנִשְׁמַת מִי
  choice: 是谁的气息
  rationale: נְשָׁמָה 首先可指气息、生命之气，也可能引申为灵；正文保留具体的“气息”，脚注说明“灵”的可能性，以保存词义张力。
- source_word: יָצְאָה מִמֶּךָּ
  choice: 从你而出的
  rationale: 直译 יצא“出来、出去”的空间意象，同时用现代汉语倒装问句自然表达其修饰关系。
theological_decisions:
- issue: נְשָׁמָה 在此指普通气息、生命之气，还是启示性的灵
  choice: 正文译“气息”，不明确其来源或神学性质
  alternative: 译“灵”
  rationale: 上下文可能讽刺比勒达的话究竟受谁启发，但希伯来文本没有明确说是神的灵或别的灵。译作“气息”最贴近具体意象，脚注保留“灵”的词义可能，避免替原文消解含混。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。第二问略作倒装，保留希伯来诗句对“谁的气息”这一讽刺焦点的强调；避免把该气息直接认定为神的灵或任何特定属灵来源。
