  yaml_path: translation/ot/job/026/005.yaml
  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
translation:
  language: zh_hans
  text: '亡魂在众水之下战栗[a]，

    住在其中的也战栗。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亡魂在众水之下翻腾。”希伯来语“亡魂”也可译作“死者”；“战栗”也可译作“翻腾”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: 阴魂
  rationale: 这里的 רְפָאִים 是诗歌中对阴间死者的称呼，并非古族名“利乏音人”。“阴魂”简洁地传达死者在阴间的诗性意象，同时不把经文限定为某一古代民族。
- source_word: יְחוֹלָלוּ
  choice: 战栗
  rationale: 该动词在此可表达颤抖、痛苦翻腾等强烈震动；上下文描写上帝对阴间与宇宙领域的权能，“战栗”自然地表达敬畏或恐惧中的震颤，同时脚注保留“翻腾”的可能。
- source_word: מִתַּחַת מַיִם
  choice: 在众水之下
  rationale: 保留希伯来文的空间图像。“众水”符合诗体语域，也比单数式的“水下”更能体现 מַיִם 的宏阔意象。
- source_word: וְשֹׁכְנֵיהֶם
  choice: 住在水中的也都如此
  rationale: 将复数后缀理解为回指“众水”，并补出汉语所需的“也都如此”，使其承接前句谓语“战栗”，既保存平行结构，也避免具体界定这些居住者的身份。
theological_decisions:
- issue: רְפָאִים 的所指
  choice: 阴间中的死者（阴魂）
  alternative: 古代民族利乏音人
  rationale: 本节及其上下文描写上帝统管阴间与宇宙诸领域，因此该词宜按其诗歌用法理解为死者，而非历史族群；这是由词义和语境作出的判断，不额外引入特定教派的死后世界体系。
- issue: 水与其中居住者的具体身份
  choice: 保留诗性而不具体界定
  alternative: 明确解释为海怪、海中生物或阴间居民
  rationale: 希伯来文只说“众水”和“住在其中的”，并未明确说明居住者是谁；译文保留这种含混性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“阴魂”保留阴间死者的诗性含义；分为两行以显出希伯来诗句的节奏。脚注明示主要词义变体，正文中的脚注标记与之对应。
