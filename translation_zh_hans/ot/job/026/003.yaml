  text: How you have counseled one without wisdom[a], and made sound wisdom known abundantly!
translation:
  language: zh_hans
  text: 你给没有智慧的人出了多好的主意[a]，又充分显明了健全的智慧！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你给没有智慧的人出了什么主意？又显明了多少健全的智慧？”希伯来文开头的 מַה 可译为“什么”，也可引出“多么”的感叹；正文采用感叹式，以表达约伯的反讽。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: 多么
  rationale: 这里的 מַה 可引出感叹，结合约伯对比勒达的反讽语气，译作“多么”能自然表达带讽刺意味的惊叹；其疑问式理解保留在脚注中。
- source_word: יָּעַצְתָּ
  choice: 会……出主意
  rationale: יעץ 意为劝告、出谋划策。“会……出主意”在现代汉语中自然，并与“多么”组成感叹句式，保留原文的反讽力量。
- source_word: לְלֹא חָכְמָה
  choice: 给没有智慧的人
  rationale: 介词 לְ 加否定词与抽象名词，指向“缺乏智慧者”。译文不进一步限定此人是谁，以免消除原文的指称张力。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是智慧文学中的常规对应词，准确而自然。
- source_word: וְתוּשִׁיָּה
  choice: 真智慧
  rationale: תּוּשִׁיָּה 在智慧文学中可指健全、切实而有效的智慧或谋略。“真智慧”简洁地传达其可靠、实在的内涵，同时避免窄化为单纯的“成功”。
- source_word: לָרֹב
  choice: 充分
  rationale: 该短语表示程度或数量之多；“充分”在此自然修饰“显明”，传达丰富、大量的意味。
- source_word: הוֹדָעְתָּ
  choice: 显明了
  rationale: 这是 ידע 的使役式，基本义为“使人知道、使之为人所知”。“显明了”保持使役结果，又不擅自补出接受者。
