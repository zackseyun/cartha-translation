base_translation:
  language: en
  yaml_path: translation/ot/job/026/012.yaml
  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: zh_hans
  text: 他以能力使海平静，以智慧击碎拉哈伯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉哈伯”是诗歌中与上帝敌对的混沌势力或海怪之名；也可解释性地译作“海怪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: 他以能力
  rationale: 介词 בְּ 在此表工具或凭借，כֹּחַ 指能力、力量；译作“以能力”既贴近原文，也符合宇宙性诗歌语境。第三人称阳性单数后缀所表达的“他的”，由句首主语“他”自然承载。
- source_word: רָגַע
  choice: 使……平静
  rationale: 该词根在不同语境中可有“平静”或“搅动”等含义；与“海”搭配并结合本节两行的平行结构，此处取使海止息、归于平静之意。
- source_word: הַיָּם
  choice: 海
  rationale: 按通常词义译作“海”，既可指实际的海，也保留约伯记诗歌中海作为混沌力量的意象。
- source_word: וּבִתְבוּנָתוֹ
  choice: 以智慧
  rationale: תְּבוּנָה 表示理解力、洞察力或智慧；“智慧”在现代汉语中自然庄重，也呼应约伯记的智慧主题。连接词 וּ 由逗号连接的并列结构自然体现。
- source_word: מָחַץ
  choice: 击碎
  rationale: 该动词表示猛烈击打、压碎或粉碎；“击碎”保留了神彻底制服对手的强烈诗歌画面。
- source_word: רָהַב
  choice: 拉哈伯
  rationale: 此处最可能是神话诗歌中混沌势力或海怪的专名，而非抽象的“骄傲”，也不是耶利哥女子喇合。音译“拉哈伯”可保留原文意象，并借脚注说明其所指。
theological_decisions:
- issue: רָהַב 应译作专名，还是解释为一般名词
  choice: 采用专名“拉哈伯”，指被神制服的混沌势力或海怪
  alternative: 译作“骄傲”或解释性地译作“海怪”
  rationale: 在本节关于海和宇宙秩序的诗歌语境中，רָהַב 更像一个神话诗歌性的对手形象。保留专名可避免把多义意象限定为单一解释；脚注则帮助现代读者理解。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。两句均用“以……”构成平行结构，保留希伯来诗歌的节奏；不把宇宙性意象过度解释为某一套神学体系。
