  yaml_path: translation/ot/job/026/010.yaml
  text: He inscribed a circle on the surface of the waters[a], at the boundary of light and darkness.
translation:
  language: zh_hans
  text: 他在水面上画出一道圆周[a]，直至光明与黑暗的界限。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在水面上划定界限，直至光明与黑暗相接之处。”
    reason: 原文חֹק可指界限或定限，חָג带有画圆、环绕的意象；תַּכְלִית可指尽头、极限或界限。
lexical_decisions:
- source_word: חֹק
  choice: 界线
  rationale: 该词通常指规定、定限或边界；在此与חָג连用，具体描绘所划定的固定界限。“界线”既保留空间意象，也不把它抽象化为“命令”或“定例”。
- source_word: חָג
  choice: 画出一道圆形
  rationale: 该词根有画圆、环绕之意。“画出一道圆形界线”直接保留在众水之上勾画圆周的图景；“地平线”虽可能表达所指景象，却解释性较强。
- source_word: עַל פְּנֵי מָיִם
  choice: 在水面上
  rationale: פְּנֵי在这里是“表面”的具体空间用法；“在水面上”符合现代汉语，又保留原文意象。
- source_word: עַד
  choice: 直至
  rationale: 该介词表示延伸所达到的限度。“直至”保留方向和范围感，避免把句法关系过早固定为静态的“在”。
- source_word: תַּכְלִית
  choice: 交界
  rationale: 该词指尽头、极限或边界。结合后面的光与黑暗，“交界”自然表达两者相接并受限之处；其“尽头”的词义可能性在脚注译法中有所保留。
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: 光与黑暗
  rationale: 原文直译为“光同黑暗”；在תַּכְלִית之后，译为“光与黑暗的交界”保留两者并置、相接或分隔的诗性张力，而不作额外宇宙论说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“画出一道圆形界线”保留希伯来诗歌的具体宇宙图景；“直至光与黑暗的交界”保持简练，并避免用“地平线”等解释性较强的词。
