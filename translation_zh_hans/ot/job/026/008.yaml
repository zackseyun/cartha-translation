  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: zh_hans
  text: 他把水束在他的密云中[a]，云却没有在它们下面裂开[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “密云”也可译作“云”；希伯来语这个词可强调浓密厚重的云层。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在它们下面”；“它们”可能指水，也可能指他的密云。
    reason: referential_ambiguity
lexical_decisions:
- source_word: צֹרֵר
  choice: 包裹
  rationale: 该分词表示捆扎、包住或约束；“包裹”自然地保留水被收拢在云中的诗歌意象。
- source_word: מַיִם
  choice: 水
  rationale: 希伯来语虽为复数形式，但现代汉语通常以不可数的“水”表达，既自然又不损失宇宙诗歌意象。
- source_word: בְּעָבָיו
  choice: 在自己的密云中
  rationale: עָב 可指云，尤其是浓密厚重的云；后缀为第三人称阳性单数所属。“自己的”明确回指本句主语，“密云”保留词语可能强调云层厚密的含义。
- source_word: וְלֹא
  choice: 却不
  rationale: 连词在上下文中形成反差：水虽被包裹在云中，云却没有裂开；“却”自然呈现这种转折。
- source_word: נִבְקַע
  choice: 裂开
  rationale: בקע 的尼法勒形表示被劈开、裂开；汉语“裂开”可自然表达状态变化，也保留原文鲜明的物理图像。
- source_word: עָנָן
  choice: 云
  rationale: 原文为单数，可作集合或泛指用法；汉语“云”无需添加数目标记，能保留这种开放性。
- source_word: תַּחְתָּם
  choice: 在水下
  rationale: 原文后缀为第三人称阳性复数，语法上可能回指“水”或“密云”。正文按就近且有意义的关系理解为水，并以“水下”避免现代汉语中“它们”指代不清；脚注保留另一种可能。
theological_decisions:
- issue: תַּחְתָּם 的指代对象
  choice: 理解为水：云不在水下裂开
  alternative: 理解为密云：云不在它们下面裂开
  rationale: 阳性复数后缀可与 מַיִם“水”或 עָבָיו“他的密云”发生指代联系，原文并未完全消除歧义。正文采用较连贯的“水下”，脚注说明另一可能，不将诗句的语法张力默默抹平。
translation_notes:
  register: 采用现代、庄重而清晰的诗体汉语。保留“包裹—裂开”的具体图像，并用脚注呈现词义和代词指向上的真实歧义。
