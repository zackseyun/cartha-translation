base_translation:
  language: en
  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
translation:
  language: zh_hans
  text: 阴间在他面前赤露无遗；亚巴顿[a]也毫无遮盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚巴顿”也可译作“灭亡”或“毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: 赤露无遗
  rationale: 原词为“赤裸、裸露”。“赤露无遗”保留鲜明意象，也自然表达完全显露、无法隐藏的含义；不把形容词误解为被动动作。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 此处指死者所在的幽冥领域，不只是个别坟墓。“阴间”是现代中文圣经语境中简洁、易懂且能保留其概念范围的译法。
- source_word: נֶגְדּוֹ
  choice: 在他面前
  rationale: 直接对应“在他面前／在他眼前”；第三人称阳性单数代词在上下文中指上帝，但正文不另加解释。
- source_word: אֵין
  choice: 毫无
  rationale: 希伯来文存在否定结构直译为“没有”。配合中文“遮蔽”，译作“毫无”简洁自然，并加强两行诗句的对应。
- source_word: כְּסוּת
  choice: 遮蔽
  rationale: 原词指覆盖物或遮盖。这里与上句“赤露”呼应；“遮蔽”既保留覆盖意象，也适合描述无法在上帝面前隐藏。
- source_word: אֲבַדּוֹן
  choice: 灭亡之地
  rationale: 该词可指“毁灭、灭亡”，在这里与“阴间”平行，具有领域或所在之处的意味。“灭亡之地”比音译更便于普通读者理解，同时保留其与抽象“灭亡”之间的张力。
theological_decisions:
- issue: נֶגְדּוֹ中第三人称阳性单数后缀的所指
  choice: 译作“在他面前”，由上下文表明“他”指上帝
  alternative: 明译为“在上帝面前”
  rationale: 上下文谈论上帝对隐秘领域的洞察和权能；保留代词忠实反映原文表达，也避免在本节中加入原文没有重复出现的名词。
- issue: אֲבַדּוֹן是抽象的“灭亡”还是与阴间平行的领域名称
  choice: 正文译作“灭亡之地”
  alternative: “亚巴顿”或“灭亡”
  rationale: 诗歌平行结构支持领域性的理解，但原词仍有“灭亡、毁灭”的词义。正文采用可理解的领域性表达，脚注保留音译及抽象译法。
translation_notes:
  register: 采用现代、庄重而清晰的诗体中文。两分句以“赤露无遗／毫无遮蔽”形成平行，保存原文中裸露与覆盖的意象关联；代词“他”不作过度解释。
