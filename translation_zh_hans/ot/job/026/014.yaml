  text: הֶן אֵ֤לֶּה קְצ֬וֹת דרכ/ו וּ/מַה שֵּׁ֣מֶץ דָּ֭בָר נִשְׁמַע בּ֑/וֹ וְ/רַ֥עַם גבורת/ו מִ֣י יִתְבּוֹנָֽן־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: zh_hans
  text: 看哪，这些不过是他作为的边缘[a]；我们所听到的关于他的，只是一丝低语！至于他大能的雷声，谁能领会呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他道路的尽头／外围”。希伯来语指最外面的边界，表明这里所说的只是上帝作为的边缘，是人能察觉的一小部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 这是引人注意并加强语气的感叹词；“看哪”庄重而清楚，也保留了原文的强调作用。
- source_word: קְצוֹת
  choice: 边缘
  rationale: 该词指尽头、边界或最外沿；“边缘”表明前文列举的只是上帝作为的外围部分，并未穷尽其全貌。
- source_word: דְּרָכָיו
  choice: 他行事
  rationale: 原义是“他的道路”；此处指上帝行动的方式。“他行事”在现代汉语中自然，同时避免把含义局限为具体的“作为”。
- source_word: שֵׁמֶץ דָּבָר
  choice: 微弱的低语
  rationale: שֵׁמֶץ 是罕见词，表示极少的一点，在本语境中兼有微弱声息的意味；与后文“雷声”形成鲜明的听觉对比。דָּבָר 不另译为“话”，以免汉语生硬，但其言语意味由“低语”承载。
- source_word: נִשְׁמַע בּוֹ
  choice: 我们所听见关于他的
  rationale: 被动形式在这里可按泛指、集体意义表达；“关于他的”保留所听内容涉及上帝的理解，不武断译成直接“从他那里”听见。
- source_word: רַעַם גְּבוּרָתוֹ
  choice: 他大能的雷声
  rationale: 直译保留“雷声”意象及其与“低语”的诗性对照；“大能”自然表达 גְּבוּרָה 的力量、威力。
- source_word: יִתְבּוֹנָן
  choice: 能领会
  rationale: 该动词含仔细辨明、理解之意；“领会”适合反问句，表达人的认知无法把握上帝大能的深度。
theological_decisions:
- issue: 人对上帝作为和大能的认识范围
  choice: 将所见描述为上帝“行事的边缘”，强调人所领略的只是极少部分。
  alternative: 也可较窄地理解为只针对上下文所列举的创造界作为，而非泛指上帝的一切行动。
  rationale: 上下文确实聚焦宇宙中的作为，但本节诗句以“边缘”和“雷声”扩大了对比。译文保留这种张力，既不把它限定为创造论命题，也不扩展成超出诗歌本身的系统性论断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留诗歌的强调语气；分号和破折号式转折由汉语句法自然呈现。“低语—雷声”的听觉对照被明确保留。
