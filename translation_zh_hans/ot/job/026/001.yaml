  rationale: 希伯来语动词 ענה 的 Qal 形式在对话中常用于引出答话；“回答”自然承接前一段发言。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר 与前面的 ענה 共同构成希伯来语常见的引语公式。中文“回答说”既保留两个动词的结构，又表达自然。
- source_word: וַ
  choice: （不单独译出）
  rationale: 句首连续式 waw 推进叙事；现代中文借语序和上下文即可表达承接关系，无须机械译作“然后”或“于是”。
