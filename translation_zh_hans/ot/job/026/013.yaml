  text: בְּ֭/רוּח/וֹ שָׁמַ֣יִם שִׁפְרָ֑ה חֹֽלֲלָ֥ה יָ֝ד֗/וֹ נָחָ֥שׁ בָּרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: zh_hans
  text: 他以气息使诸天绚丽[a]；他的手刺透了那逃窜的蛇[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”或译“灵”或“风”；希伯来语此词可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “刺透了”或译“塑造了”。原文动词可有不同理解，但“刺透”更符合本句的争战意象。
    reason: alternative_reading
  - marker: c
    text: “那逃窜的蛇”很可能使人联想到宇宙性的混沌之蛇；参以赛亚书27:1。
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: 他以气息
  rationale: רוּחַ可指气息、风或灵；介词בְּ表示方式或凭借。正文采用“气息”，保留鲜明的创造性意象，又不把此处明确限定为位格性的“灵”。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 在约伯记的崇高宇宙诗歌语境中，“诸天”比“天空”更能体现复数形式和诗体语域。
- source_word: שִׁפְרָה
  choice: 使……绚丽
  rationale: 该形式源于שׁפר，可表达美丽、华美或明亮。结合“诸天”，译为“使诸天绚丽”自然地传达其荣美灿然的结果。
- source_word: חֹלֲלָה
  choice: 刺透了
  rationale: 该动词在此诗体形式中可能涉及刺穿，也可有形成、使扭动等理解；以“他的手”为主语、蛇为宾语时，“刺透”最切合争战意象，但歧义收入脚注。
- source_word: יָדוֹ
  choice: 他的手
  rationale: 直译具体意象，同时保留希伯来诗歌中“手”所象征的主动能力。
- source_word: נָחָשׁ בָּרִיחַ
  choice: 那逃窜的蛇
  rationale: בָּרִיחַ在这里可理解为逃窜、疾行或蜿蜒；“逃窜的蛇”与以赛亚书27:1的相近宇宙争战意象相呼应，同时不在正文中把它直接解释为撒但或利维坦。
theological_decisions:
- issue: רוּחַ是否应译作“灵”，从而暗示明确的位格性或三一论指涉
  choice: 正文译作“气息”
  alternative: “灵”或“风”
  rationale: 希伯来词本身容许三种含义，此处诗意着重上帝施行创造的大能，并未要求明确的位格性解读；故正文保留“气息”的具象表达，其他可能置于脚注。
- issue: 是否在正文中把נָחָשׁ בָּרִיחַ明确认定为撒但、利维坦或混沌之蛇
  choice: 保留为“那逃窜的蛇”
  alternative: “利维坦”“宇宙混沌之蛇”或“撒但”
  rationale: 经文使用宇宙争战式诗歌意象，却未在本节明说其身份；译文不越过原文作神学认定。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“诸天”“绚丽”保留宇宙诗歌的崇高感；语序简洁，两个分句维持平行结构。脚注标记均紧随相关词语，且按正文出现顺序排列。
