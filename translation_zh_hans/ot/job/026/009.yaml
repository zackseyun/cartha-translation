  text: He covers the face of his throne[b][a], spreading his cloud over it.
translation:
  language: zh_hans
  text: 他遮住[a]自己宝座的表面[b]，把自己的云铺展在其上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遮住”所对应的希伯来语动词通常可译为“抓住”或“紧握”；这里根据下半句把云铺展在宝座之上的意象，译为“遮住”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“宝座的面”；也可理解为宝座的正面。原文“宝座”一词本身没有“他的”这一所有格。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: 遮住
  rationale: 该分词通常有“抓住、握住”之义；但在本句中，它与随后“把云铺展在其上”的意象相配，语境所表达的很可能是遮蔽。译作“遮住”既自然，也保留脚注所注明的字面可能。
- source_word: פְּנֵי
  choice: 表面
  rationale: פָּנִים字面为“脸、面”，用于物体时可指其表面或正面。现代汉语说“宝座的表面”比“宝座的脸”自然，同时仍对应希伯来语的空间意象。
- source_word: כִסֵּה
  choice: 自己的宝座
  rationale: כִּסֵּא意为“宝座”。原文此处名词未带所有格后缀，但本句隐含主语为上帝，后文明确说“他的云”；译作“自己的宝座”使汉语指代清楚，同时在脚注中保留原文仅作“宝座”的形式。
- source_word: פַּרְשֵׁז
  choice: 铺展
  rationale: 这个罕见的动词形式按语境表示铺开、展开；“铺展”能自然描绘云覆盖宝座的动态。
- source_word: עָלָיו
  choice: 在其上
  rationale: 阳性单数后缀最自然地回指阳性名词“宝座”。“在其上”保持庄重诗体，并清楚表达云位于宝座之上。
- source_word: עֲנָנוֹ
  choice: 自己的云
  rationale: 原文是单数名词“云”加第三人称阳性单数后缀，即“他的云”。因汉语本句主语为“他”，用反身所有格“自己的”可避免歧义。
theological_decisions:
- issue: 隐含主语及宝座的归属
  choice: 将本节理解为上帝用自己的云遮蔽自己的宝座
  alternative: 较形式地译作“他遮住宝座的表面”，不明说宝座属于谁
  rationale: 上下文的施事者是上帝，且“他的云”明确属于同一主语。汉语补出反身所有格可使句意连贯，但因“宝座”原文本身没有所有格后缀，脚注说明这一点，以免把推定说成明示。
- issue: מְאַחֵז的动作意象
  choice: 按语境译为“遮住”
  alternative: 按常见字面义译为“抓住”或“紧握”
  rationale: 后半句描写上帝把云铺展在宝座之上，支持遮蔽的语境义；然而该词通常表示抓住或握住，因此用脚注保留其真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“表面”避免生硬的“宝座的脸”，“铺展”保留宇宙诗歌的宏阔感。脚注标记均置于正文相关表达之后，并按正文出现顺序排列。
