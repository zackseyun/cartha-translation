  text: How you have helped the powerless! How you have saved the arm without strength![a]
translation:
  language: zh_hans
  text: 你给无力的人帮了多大的忙！你救了那毫无力量的膀臂！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“你给无力的人帮了什么忙？你救了什么——毫无力量的膀臂？”希伯来文是带有尖锐讽刺意味的感叹式修辞问句。
    reason: 保留 מֶה 按疑问词理解的较直译可能，并说明正文以汉语反诘表达的讽刺语气。
lexical_decisions:
- source_word: מֶה
  choice: 真是……得好啊
  rationale: 这里的 מֶה 引出带有尖锐讽刺意味的感叹式反问。汉语用“真是……得好啊”可自然传达表面的赞叹和实际的讥讽，同时避免把它误解为普通的“什么”。
- source_word: עָזַרְתָּ
  choice: 你帮助
  rationale: עזר 的基本义为“帮助”；在直接讽刺比勒达的语境中，用现代汉语现在完成意义可由上下文体现，无须机械加入“已经”。
- source_word: לְלֹא כֹחַ
  choice: 那无力的人
  rationale: 该短语字面接近“给没有力量者”，语境中指一个无力的人。保留单数个体意味，并与下半句平行。
- source_word: הוֹשַׁעְתָּ
  choice: 你拯救
  rationale: ישׁע 在使役词干中意为“拯救、搭救”。“拯救”保留其较强的解救语义，并强化反讽。
- source_word: זְרוֹעַ
  choice: 膀臂
  rationale: 原文直译为“臂膀”，在希伯来诗歌中也象征力量。选用较庄重的“膀臂”，保留原有身体意象，不直接释为“力量”。
- source_word: לֹא עֹז
  choice: 毫无力量的
  rationale: עֹז 表示力量、能力；“毫无力量的”既准确，又与前句“无力”形成诗体平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。正文用重复的“真是……得好啊”再现希伯来文的尖锐反讽；保留“膀臂”这一力量象征，而不将隐喻扁平化。
