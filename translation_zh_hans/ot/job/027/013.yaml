  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
translation:
  language: zh_hans
  text: 这是恶人在上帝那里所得的份[a]，也是残暴之人[b]从全能者领受[c]的产业：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译含“与上帝”之意；在“份”的语境中，也可理解为“从上帝而来”，即上帝分给恶人的份。
    reason: lexical_alternative
  - marker: b
    text: “残暴之人”也可译为“强暴之人”。
    reason: lexical_alternative
  - marker: c
    text: “领受”原文直译为“拿”或“取”；这里因上下文谈到所得的份和产业而如此翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: 就是这样
  rationale: 指示词用于引出下文所列的结局；置于句末并接冒号，符合现代汉语表达，也保留其承上启下的作用。
- source_word: חֵלֶק
  choice: 份
  rationale: 表示分得的份额或命定的结局，并与下句“产业”保持词义上的关联和区别。
- source_word: אָדָם רָשָׁע
  choice: 恶人
  rationale: 自然、凝练地表达“邪恶的人”；希伯来语 אָדָם 在此为泛指，不必在汉语中另译“男人”。
- source_word: עִם אֵל
  choice: 在上帝那里所得
  rationale: עִם 字面为“与、同”，此处结合“份”的语境，表示恶人在上帝那里所有或所得的份；脚注保留其字面形式及“从上帝而来”的可能理解。
- source_word: נַחֲלַת
  choice: 产业
  rationale: 常指承受或分得的产业，在此与“份”形成平行而不完全重复。
- source_word: עָרִיצִים
  choice: 残暴之人
  rationale: 该词描述强横、压迫人或诉诸暴力者；“残暴之人”庄重自然，并以脚注保留“强暴之人”的译法。
- source_word: מִשַּׁדַּי
  choice: 从全能者
  rationale: שַׁדַּי 是神的称号，译出其传统语义为“全能者”；介词 מִן 译为“从”。
- source_word: יִקָּחוּ
  choice: 领受
  rationale: 该动词字面是“拿、取”，但在所得之份和产业的语境中，“领受”更自然地表达获得所分给之物，同时脚注注明字面译法。
theological_decisions:
- issue: 神的称号 שַׁדַּי
  choice: 全能者
  alternative: 沙代
  rationale: 此处是神的称号而非普通人名；译为“全能者”能向现代读者传达传统理解，又不加入宗派性解释。
- issue: עִם אֵל 所表达的神人关系
  choice: 在上帝那里所得
  alternative: 与上帝同在；从上帝而来
  rationale: 原介词字面为“与、同”，但与“份”连用时可指人在上帝那里所得的定分。正文采用自然汉语，脚注保留字面形式和来源义之间的真实张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。句末用冒号，因为本节引出随后对恶人结局的具体陈述；平行结构保留“份／产业”和“上帝／全能者”的对应。
