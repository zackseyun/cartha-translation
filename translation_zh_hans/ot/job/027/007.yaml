  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: zh_hans
  text: 愿我的仇敌像恶人，起来与我作对的人像不义之人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: 愿……像……一样
  rationale: היה 的 Qal 祈愿式在此表达愿望或带有咒诅意味的祈愿；“愿”自然保留其意愿语气。
- source_word: כְרָשָׁע
  choice: 像恶人一样
  rationale: 前缀 כְּ 表示比较；רָשָׁע 指道德意义上的恶人。此译既保留比较关系，也不把它误解为身份断言。
- source_word: אֹיְבִי
  choice: 我的仇敌
  rationale: 名词 אֹיֵב 加第一人称单数后缀，直指“我的敌人”；“仇敌”符合诗歌语体，庄重且清楚。
- source_word: וּמִתְקוֹמְמִי
  choice: 起来反对我的人
  rationale: קום 的 Hitpolel 分词加第一人称单数后缀，描绘某人挺身与说话者为敌；展开翻译可保留原文的动作意象。
- source_word: כְעַוָּל
  choice: 像不义之人一样
  rationale: עַוָּל 指以不公、不正为特征的人；“不义之人”保留其广泛的道德含义，并与“恶人”形成平行。
theological_decisions:
- issue: 祈愿所指的含义
  choice: 保留“愿……像……”的比较式祈愿，不补明仇敌将遭遇何种结局
  alternative: 译成“愿我的仇敌遭受恶人的下场”
  rationale: 原文只明说仇敌“像恶人”、反对者“像不义之人”，可能关联恶人的身份、处境或结局；译文不应擅自限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个平行分句分别用“恶人”和“不义之人”，保留希伯来诗歌的同义对应；第二分句保留“起来反对”的动态意象。
