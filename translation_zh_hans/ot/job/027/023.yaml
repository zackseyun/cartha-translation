  text: He claps his hands at him and hisses at him from his place[a][b].
translation:
  language: zh_hans
  text: 向他拍掌，又从自己的地方向他发出嘘声[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向他吹口哨。”希伯来语这个动词既可指吹哨，也可指发嘘声；正文采用“发出嘘声”，以体现这里的敌对语气。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文没有明说动作的施行者，只说“向他拍掌……向他发出嘘声”。有人理解为上帝、其他人，或某种非人格的力量。
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂפֹּק
  choice: 拍掌
  rationale: שׂפק 与“手掌”连用，表示击掌或拍手。“拍掌”保留具体动作，也不擅自断定这是嘲弄、得胜还是惊讶的表示。
- source_word: עָלֵימוֹ
  choice: 向他
  rationale: 介词 עַל 带代词后缀，在此与拍掌这一动作连用，译作“向他”自然，也符合上下文中的敌对意味。
- source_word: כַפֵּימוֹ
  choice: 掌
  rationale: כף 可指手掌或手；在“拍掌”这一现代汉语表达中，所指已经清楚，无须直译为“他的手掌”。
- source_word: וְיִשְׁרֹק
  choice: 发出嘘声
  rationale: שרק 可指吹哨或发嘘声；审判语境带有敌视、讥诮意味，因此正文采用“发出嘘声”，并以脚注保留“吹口哨”的词义可能。
- source_word: עָלָיו
  choice: 向他
  rationale: 与前一个 עַל 加后缀相应，“向他发出嘘声”符合现代汉语习惯，并保留动作针对他的含义。
- source_word: מִמְּקֹמוֹ
  choice: 从自己的地方
  rationale: מקום 基本义为“地方”；反身表达“自己的”自然指向施行动作的隐含主语，同时不具体解释为住处或所在之处。
theological_decisions:
- issue: 本节动作施行者的身份
  choice: 正文省略主语，照希伯来文保留其未明说的状态
  alternative: 明确译为上帝、众人、东风或某种非人格力量
  rationale: 希伯来文使用第三人称阳性单数动词，却没有明说主语；上下文容许不同理解。汉语可自然省略主语，因此不必补出“他”或“有人”，从而避免替原文消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的表达。“向他拍掌”保留原文的具体动作；全句省略主语，既符合汉语习惯，也准确保留希伯来文对施行者身份的含混。脚注标记均置于正文句末。
