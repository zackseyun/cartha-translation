  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: zh_hans
  text: 富足的人躺下，却不得被收聚[a]；他一睁开眼睛，就不在了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被收聚”可能指死后归到先人或亲族那里，也可能较笼统地指死亡和安葬；希伯来文十分简略，没有明说被收聚到哪里。
    reason: alternative_reading
  - marker: b
    text: 直译“他就不在了”，是指他已经消失或不复存在。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: 富足的人
  rationale: 该形容词在此作名词使用，指富有者；译作“富足的人”自然清楚，也不增添原文没有的身份限定。
- source_word: יִשְׁכַּב
  choice: 躺下
  rationale: 保留 שׁכב 的基本含义及诗歌中的鲜明画面；在本节语境中也可暗示临终或死亡，但正文不将这一含义明说。
- source_word: וְלֹא יֵאָסֵף
  choice: 却不得被收聚
  rationale: Nifal 形式直译为“被收聚”，可能涉及死亡、安葬或归到先人那里。正文保留原文的简约和含混，以脚注解释其可能意涵。
- source_word: עֵינָיו פָּקַח
  choice: 他一睁开眼睛
  rationale: 按希伯来语的主语和宾语关系自然表达，并以“一……就……”呈现后半句突然而紧凑的转折。
- source_word: וְאֵינֶנּוּ
  choice: 就不在了
  rationale: 字面为“他不在”，是表示消失或不复存在的惯用语；“不在了”在现代汉语中自然，并保留死亡与消逝之间的语义张力。
theological_decisions:
- issue: “被收聚”是否明确解释为死亡后归到列祖那里或被安葬
  choice: 正文仅译“不得被收聚”
  alternative: “不得归到列祖那里”或“无人收殓”
  rationale: 原文没有明说“列祖”、亲族或安葬方式；不宜在正文中将含蓄表达固定为某一具体的死后观念或葬礼情景。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“被收聚”略带陌生感，但有意保留希伯来文的凝练与含混，并由脚注帮助普通读者理解；后半句保持原诗突兀、强烈的消逝感。
