  yaml_path: translation/ot/job/027/012.yaml
  text: Look[a], all of you have seen it; why then do you become vain?
translation:
  language: zh_hans
  text: 看哪，你们全都已经看见了；那么，为什么还要如此徒然行事呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为什么还要变得虚妄呢？”原文“徒然、虚空”的名词与同根动词连用，形成强调性的文字呼应，难以在汉语中完全重现；也不必限于言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是强调性的提示语；“看哪”庄重、简明，也保留了原文唤起注意的语气。
- source_word: אַתֶּם כֻּלְּכֶם
  choice: 你们全都
  rationale: 保留独立人称代词与“全体”所形成的强调和周全语气。
- source_word: חֲזִיתֶם
  choice: 亲眼看见了
  rationale: חזה 表示看见、察知；“亲眼”自然地传达直接观察的意味，但不限定所见对象。
- source_word: וְלָמָּה
  choice: 为什么还要
  rationale: 结合上下文表达推论性的责问：既然众人都已看见，为何仍如此。
- source_word: זֶּה
  choice: 这些
  rationale: 按当前马所拉文本将 זֶה 理解为指示成分，与后面的“空话”组成自然汉语；其具体所指仍由上下文决定。
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: 说这些空话
  rationale: 名词 הֶבֶל 与同根动词形成加强语势的同源词结构，基本意象是空虚、徒然。结合约伯对朋友言论的责问，以“说空话”表达较自然，但原文也可能泛指徒然行事，故加注说明。
theological_decisions:
- issue: 责备所指是言语还是更广泛的行为状态
  choice: 正文采用“说这些空话”
  alternative: “为什么还要这样徒然行事呢？”或“为什么还要变得虚妄呢？”
  rationale: 上下文是约伯回应朋友，言语含义较切合；然而该同源结构本身可涵盖变得虚妄或徒然行事，因此不把较宽解释排除，并在脚注保留歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留经文语体；“亲眼看见”突出直接观察；正文顺应本节论辩语境译作“说空话”，脚注保留原文可泛指虚妄或徒然行事的范围。
