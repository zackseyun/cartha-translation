revisions:
- from: 不敬虔的人[a]即使得了利[b]，又有什么指望呢？上帝夺去他的性命时[c]，他还有什么指望呢？
  to: 不敬虔的人[a]即使得利[b]，当上帝夺去他的性命[c]时，还有什么指望呢？
  rationale: 将两个汉语反问合并为一个，以较贴近原文的句法关系表达：不敬虔者纵然获利，在上帝取去其生命时仍无指望。保留“得利”这一直接词义，同时以脚注呈现争议性的“剪除”理解；调整脚注c，避免将一项可行译法误称为唯一的直译。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:27:34Z'
