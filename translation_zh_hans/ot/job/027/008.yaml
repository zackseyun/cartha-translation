  text: כִּ֤י מַה תִּקְוַ֣ת חָ֭נֵף כִּ֣י יִבְצָ֑ע כִּ֤י יֵ֖שֶׁל אֱל֣וֹהַּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: zh_hans
  text: 不敬虔的人[a]即使得利[b]，当上帝夺去他的性命[c]时，还有什么指望呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“伪善的人”。希伯来语此词也可指不敬畏上帝、亵渎或虚伪的人。
    reason: lexical_alternative
  - marker: b
    text: 本分句含义不确定；也可译“当他牟利时”，或理解为“当上帝剪除他时”。
    reason: alternative_reading
  - marker: c
    text: 或译“抽出他的生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: 指望
  rationale: 该词指人所盼望或期待的事；“指望”自然地表达本节反问所涉及的最终依靠与前景。
- source_word: חָנֵף
  choice: 不敬虔的人
  rationale: 在《约伯记》中，该词通常泛指不敬畏上帝、亵慢的人，不仅指表里不一者；“不敬虔的人”保留其宗教和道德含义。
- source_word: כִּי יִבְצָע
  choice: 即使得了利
  rationale: בצע 常有获取利益、牟利之义；本处句法简约且有争议。把 כִּי 理解为让步性的“即使”，可形成自然的反问，同时不把“剪除”这一较不直接的语义强加给该动词。
- source_word: יֵשֶׁל
  choice: 夺去
  rationale: 此处指上帝取走人的性命；“夺去”既体现动作力度，也符合现代汉语表达。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的单数诗体称谓，直接指上帝。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נֶפֶשׁ 在这里指人的生命，即死亡时被上帝取走的性命，并非着重作灵魂本体论陈述。
theological_decisions:
- issue: נֶפֶשׁ 的人论含义
  choice: 译为“性命”
  alternative: 他的灵魂
  rationale: 经文着重于上帝终止人的生命，而非界定灵魂的形而上性质；“性命”避免加入原文未强调的教义限定。
- issue: כִּי יִבְצָע 的歧义
  choice: 理解为“即使得了利”
  alternative: 当上帝剪除他时／当他结束牟利时
  rationale: 原文未明说该分句的主语为上帝，而 יִבְצָע 最直接可关联“获利”。正文保留人在获利之后仍无终极指望的张力，并在注释中列出另一种理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将原文单一反问在汉语中复现为前后呼应的两问，以清楚呈现“即使获利”与“上帝夺去性命”之间的对照；所有有实质依据的词义和句法歧义均以脚注保留。
