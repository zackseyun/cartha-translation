  text: בְּ/צִדְקָתִ֣/י הֶ֭חֱזַקְתִּי וְ/לֹ֣א אַרְפֶּ֑/הָ לֹֽא יֶחֱרַ֥ף לְ֝בָבִ֗/י מִ/יָּמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: zh_hans
  text: 我持守自己的公义[a]，绝不放手；我一生中，我的心从未责备我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己的纯正”。希伯来语通常指“公义”或“正当”，但在《约伯记》的语境中也可包含个人纯正无过的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译近于：“我的心没有讥诮（或羞辱）我。”这里指内心对自己的责备。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: 自己的公义
  rationale: צִדְקָה通常表示“公义、正直或理直”，在这里是约伯坚守的对象。“公义”保留其道德和裁判层面的力度；加“自己的”自然表达第一人称所属关系。
- source_word: הֶחֱזַקְתִּי
  choice: 我持守
  rationale: חזק的使役形在此表示牢牢抓住、坚持不放；“持守”既贴近原文，也能表达约伯当前坚定的立场。
- source_word: וְלֹא אַרְפֶּהָ
  choice: 绝不放手
  rationale: רפה的使役形可指松手、放开；阴性宾语后缀回指“我的公义”。“绝不放手”以自然汉语保留抓紧不放的意象和坚决语气。
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: 我的心从未责备我
  rationale: חרף常指责骂、羞辱或讥诮；以“我的心”为主语时，语境指内在的自我责备。“我的心……责备我”保留希伯来语的身体意象，没有直接改译为较具解释性的“良心”。
- source_word: מִיָּמָי
  choice: 我一生中……从未
  rationale: מן与复数“日子”在否定句中表示约伯一生任何时候都没有发生此事。汉语以“我一生中……从未”自然呈现否定范围。
theological_decisions:
- issue: צִדְקָה在这里应译为较强的道德—裁判用语“公义”，还是较偏人格表现的“纯正”。
  choice: 公义
  alternative: 纯正
  rationale: 该词通常有公义、正当或理直之意；约伯在申辩自己无辜的语境中，“纯正”虽可成立，却可能削弱原词的道德和裁判色彩。正文采用“公义”，脚注保留相关译法。
- issue: 是否把“我的心”解释性地译作“我的良心”。
  choice: 保留“我的心”
  alternative: 我的良心不责备我
  rationale: 原文明确以“心”为主语，既可表达内在意识，也保留希伯来思想中“心”的较宽含义；不应在正文中把它缩窄为后世较专门的“良心”概念。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“持守……绝不放手”保留原文前后相承的抓牢意象；末句用“我一生中……从未”清楚表达否定涵盖一生任何时候，同时保留“我的心”这一希伯来语意象。
