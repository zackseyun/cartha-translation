base_translation:
  language: en
  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: zh_hans
  text: 我要教导你们关于上帝之手的事[a]；全能者那里所有的，我必不隐瞒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的手”可指上帝的能力、作为或处置。
    reason: lexical_alternative
  - marker: b
    text: 或译：“与全能者同在的”，也可理解为“属于全能者的”或“从全能者而来的”。希伯来语表达简练，具体所指没有明说。
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: 我要教导
  rationale: 这是ירה的使役词干未完成式第一人称单数，在此表示教导；结合约伯向听众发言的语境，译为“我要教导”自然且庄重。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 第二人称阳性复数直接宾语，普通话相应译为“你们”。
- source_word: בְּיַד אֵל
  choice: 认识上帝的手
  rationale: 介词ב在此较可能引出教导的内容；“上帝的手”保留希伯来语关于上帝能力、作为或处置的隐喻。中文用“教导你们认识……”表达教导的对象，避免误解为用上帝的手施教。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל在此是对神的称呼；“上帝”是现代中文清楚、通行而庄重的对应词。
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: 全能者所有的
  rationale: 原文简练且有所省略，直指“与全能者同在/全能者那里所有的”事物；译为“全能者所有的”保留其宽泛性，不限定为谋略、旨意或审判。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是约伯记中常见的神圣称号，译为“全能者”准确而通行。
- source_word: לֹא אֲכַחֵד
  choice: 我必不隐瞒
  rationale: כחד的加强词干在此意为隐藏、隐瞒；“必不隐瞒”符合宣告语气，也与传授知识的上下文相称。
theological_decisions:
- issue: “上帝的手”所表达的神圣作为
  choice: 保留“上帝的手”这一隐喻
  alternative: 上帝的能力；上帝的作为；上帝的处置
  rationale: 原文意象可以涵盖能力、行动和治理；保留隐喻可避免把含义缩窄为某一种神学解释。
- issue: 第二分句与全能者的关系
  choice: 译为“全能者所有的”
  alternative: 全能者的谋略；全能者的旨意；从全能者而来的事
  rationale: 希伯来语关系短语简练且省略具体名词。采用宽泛表达，不擅自指定为谋略、旨意或审判，同时以脚注保留更贴近字面的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“教导你们认识”使句法自然，并保留“上帝的手”的圣经意象；第二分句刻意保持宽泛，以反映原文的省略和歧义。
