  text: אִם עַל שַׁדַּ֥י יִתְעַנָּ֑ג יִקְרָ֖א אֱל֣וֹהַּ בְּ/כָל עֵֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/010.yaml
  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
translation:
  language: zh_hans
  text: 他岂会以全能者为乐？[a]岂会时时求告[b]上帝？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“如果他以全能者为乐”；这里的希伯来语虚词在上下文中引出反问。
    reason: lexical_alternative
  - marker: b
    text: “求告”也可译为“呼求”或“向……祷告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 岂会……？
  rationale: 此处אִם不是在提出实际条件，而是在描述不敬虔之人的一连串反问中引出疑问。译作“岂会……？”既表达反问语气，也不把隐含答案直接写进正文。
- source_word: עַל
  choice: 以……为
  rationale: עַל与התענג连用时标明喜乐所指向的对象。现代汉语“以……为乐”自然、庄重，也贴合此处结构。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是上帝的称号，不是普通专名；译出其传统含义，比音译“沙代”更便于现代读者理解。
- source_word: יִתְעַנָּג
  choice: 为乐
  rationale: 该词的Hitpael词形表示从某对象获得愉悦、以之为乐。“以……为乐”自然表达其反身意味，又适合诗体反问。
- source_word: יִקְרָא
  choice: 求告
  rationale: 以神为对象时，קרא表示向神呼求或祈求。“求告”保留宗教语境中的宽泛含义，不把它局限为某一种祷告形式。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 此处是单数神称，直译为“上帝”即可；原文没有支持增添“至高者”等限定语。
- source_word: בְּכָל עֵת
  choice: 时时
  rationale: 该短语表示在一切时候、持续不断地。“时时”简洁自然，并保留原文所强调的时间广度。
theological_decisions:
- issue: 神圣称号שַׁדַּי的译法
  choice: 全能者
  alternative: 沙代
  rationale: 这里的词是对上帝的称号。译出称号的意义可使普通读者直接理解，同时不额外引入任何宗派性解释。
- issue: 反问是否明确写出否定答案
  choice: 用“岂会”保留反问形式
  alternative: 他不会……
  rationale: 上下文强烈暗示否定答案，但原文采用反问而非直陈否定；保留反问可维持诗句的修辞力度及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两个平行分句都用“岂会”明确其连续反问关系；“以……为乐”和“时时求告”保留原文的简洁与节奏。
