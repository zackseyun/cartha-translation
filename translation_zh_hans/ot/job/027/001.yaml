  language: zh_hans
  text: 约伯再次发表他的言论[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“箴言”、“比喻”或“神谕”；希伯来语这个词可指多种庄重或带有比喻意味的话语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: 又
  rationale: יסף本义为“增添、继续”；与后面的不定式连用，在这里表示约伯再次或继续发言。“又”简洁自然，也保留了重新提起话头的意味。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: שְׂאֵת
  choice: 提起
  rationale: נשׂא本义为“举起、承担”；在שׂאת משל这一搭配中指郑重地开始或发出一段言论。“提起”既保留原文的隐喻，又符合中文表达。
- source_word: מְשָׁלוֹ
  choice: 他的言论
  rationale: מָשָׁל可指箴言、比喻、寓言、诗歌或庄重言论。此处引出约伯一段较长的诗体发言，因此译作“言论”较切合上下文，同时以脚注保留其较宽的词义范围。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר的标准叙事形式；译作“说”自然地引出下文，并避免中文中重复使用连接词。
