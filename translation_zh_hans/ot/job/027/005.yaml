  text: חָלִ֣ילָ/ה לִּ/י֮ אִם אַצְדִּ֪יק אֶ֫תְ/כֶ֥ם עַד אֶגְוָ֑ע לֹא אָסִ֖יר תֻּמָּתִ֣/י מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: zh_hans
  text: 我绝不承认你们有理[a]！直到我死，我也不会舍弃自己的纯全[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“判定你们为正”或“称你们为义”。希伯来语动词在这里带有裁断意味，指宣告某一方有理。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正直”或“无可指责”。这里的希伯来语可指人格的完整、正直无亏。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: 我绝不
  rationale: 这是表达强烈拒绝的惯用语；译为“我绝不”自然有力，也符合现代汉语争辩语境。
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: 承认你们有理
  rationale: צדק 的使役式在此具有裁断意味，即判定或宣告对方站得住脚；“承认你们有理”既通俗，也保留了约伯拒绝判朋友为正确的意思。
- source_word: עַד אֶגְוָע
  choice: 直到我死
  rationale: גוע 指死亡、断气；“直到我死”简洁庄重。
- source_word: לֹא אָסִיר
  choice: 不会舍弃
  rationale: 原义为使某物离开、除去；与“自己的纯全”搭配时，“舍弃”在现代汉语中自然，并保留主动放开的意象。
- source_word: תֻּמָּתִי
  choice: 自己的纯全
  rationale: תֻּמָּה 在《约伯记》中指人格完整、正直无亏的状态；“纯全”保留其伦理和整体性含义，又不将其强化为绝对无罪。
- source_word: מִמֶּנִּי
  choice: 自己的
  rationale: 希伯来文直译为“从我这里”；汉语用“舍弃自己的纯全”自然表达同一反身关系，避免生硬的“从自己身上除去”。
theological_decisions:
- issue: 约伯对自身道德状态的宣称
  choice: 译为“自己的纯全”
  alternative: 自己的无可指责／自己的清白
  rationale: “纯全”表达约伯坚持其人格正直和申辩立场，却不把经文解释成绝对无罪的宣称；保留了叙事中的神学张力。
- issue: 约伯是否认可朋友的判断
  choice: “承认你们有理”
  alternative: 称你们为义／判你们为正
  rationale: 原文具有裁断色彩，但在本段争辩中重点是约伯拒绝认可朋友对他的论断；此译法不额外引入保罗书信式的“称义”术语。
translation_notes:
  register: 采用现代、庄重而适合直接争辩的汉语。“我绝不”传达强烈否定；后半句以“舍弃自己的纯全”避免逐字硬译，同时保留约伯至死不放弃其自我申辩立场的力度。
