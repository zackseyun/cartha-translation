base_translation:
  language: en
  yaml_path: translation/ot/job/027/017.yaml
  text: He may prepare it[a], but the righteous will wear it[b], and the innocent will divide the silver.
translation:
  language: zh_hans
  text: 他尽管预备衣服[a]，义人却要穿上[b]；清白的人要分取银子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他预备衣服，义人却要穿上。”希伯来语未完成式可直接表达将来或持续的动作；这里的“尽管”是根据上下文中的转折关系译出。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说“衣服”这个宾语；这里依照上一节补出。
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  choice: 尽管预备
  rationale: 这是כון的使役形，基本义为“预备、备妥”。结合上节恶人积聚衣服和银子的语境，用“尽管”表达上下文所形成的让步关系，同时不把这种语气说得过强。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该形容词在此作名词使用，指行为正直的人；“义人”简洁、庄重，也保留了智慧文学中的道德对比。
- source_word: יִלְבָּשׁ
  choice: 要穿上
  rationale: לבש的基本义是“穿、穿上”。原文宾语省略，依上节可知所指为衣服。
- source_word: כֶסֶף
  choice: 银子
  rationale: כֶסֶף既可指银，也可泛指钱财；本节承接上节积聚的银子，用“银子”保留具体意象。
- source_word: נָקִי
  choice: 清白的人
  rationale: 该形容词作名词使用，指没有罪责或恶行的人。“清白的人”自然地呈现其道德含义，并与“义人”形成平行。
- source_word: יַחֲלֹק
  choice: 要分取
  rationale: חלק意为“分、分配”。“分取”既表达银子被分开，也自然传达清白的人从中取得份额，而不额外断定具体的分配方式。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的书面普通话。“尽管……却……”清楚呈现语境中的让步转折；“分取”避免“瓜分”可能带来的贬义。
