base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: zh_hans
  text: 只要我的气息仍在我里面，神的气息仍在我的鼻孔里，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 只要（与 כָל עוֹד 合译）
  rationale: 本节承接上下文的郑重宣告；汉语中不必机械译出“因为”，将其与时限短语合译，更自然地引出持续条件。
- source_word: כָל עוֹד
  choice: 只要……仍……
  rationale: 表达某种状态持续多久，完整保留 כָל 的范围和 עוֹד 的延续意味。
- source_word: נִשְׁמָתִי
  choice: 我的气息
  rationale: נשמה 在此指维持生命的呼吸，与下半句鼻孔中的 רוּחַ 构成诗意平行；“气息”自然且不引入“灵魂”的额外含义。
- source_word: בִי
  choice: 在我里面
  rationale: 保留介词 ב 所表达的内在存在。
- source_word: וְרוּחַ
  choice: 气
  rationale: רוּחַ 可指风、气息或灵；鼻孔和呼吸的语境支持“气”，同时用脚注保留“灵”的真实可能性。
- source_word: אֱלוֹהַּ
  choice: 神所赐的
  rationale: 字面结构是“神的气/灵”。结合生命气息的具体语境，“神所赐的气”在现代汉语中清楚表达其来源；脚注保留字面及另一种理解。
- source_word: בְּאַפִּי
  choice: 在我的鼻孔里
  rationale: אַף 在此取鼻子、鼻孔的具体义；“鼻孔”准确保留呼吸意象。
theological_decisions:
- issue: רוּחַ אֱלוֹהַּ 在与 נִשְׁמָתִי 平行时的含义
  choice: 神所赐的气
  alternative: 神的灵
  rationale: 上下文聚焦生命和呼吸，且 רוּחַ 位于“鼻孔里”，故正文采用具体的生命气息义；但该词确可指“灵”，因此以脚注保留神学张力，不作绝对排除。
- issue: אֱלוֹהַּ 的属格关系
  choice: 以“神所赐的”表达气息源自神
  alternative: 直译“神的气”或按另一词义译“神的灵”
  rationale: “神所赐的气”符合创世生命气息的意象，也避免现代汉语把“神的气”误读为神自身在呼吸；脚注仍给出较字面的替代译法。
translation_notes:
  register: 采用现代、庄重而口语可懂的诗体表达。“气息”与“气”既保留原文 נשמה／רוח 的词汇区别，也维持上下两行的平行关系。句末逗号反映本节语法和誓言内容延续到下一节。
