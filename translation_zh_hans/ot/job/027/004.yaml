  text: my lips will not speak injustice[a], nor will my tongue utter deceit.
translation:
  language: zh_hans
  text: 我的嘴唇决不说不义的话[a]，我的舌头也决不吐出诡诈之言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文采用带“若/如果”（אִם）的誓言式结构来表达强烈否定；直译类似“若我的嘴唇说不义的话……”，意思是“我的嘴唇决不说不义的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 决不
  rationale: 这里的 אִם 用于誓言式省略结构，表达强烈否定，而非普通条件“如果”。译作“决不”自然地体现约伯郑重的断言。
- source_word: תְּדַבֵּרְנָה
  choice: 说
  rationale: דבר 的 Piel 形式意为“说”；未完成体在此誓言语境中表达坚决的将来取向。
- source_word: שְׂפָתַי
  choice: 我的嘴唇
  rationale: 保留原文身体部位的意象，并与下半句“我的舌头”形成诗体平行。
- source_word: עַוְלָה
  choice: 不义的话
  rationale: עַוְלָה 表示不义、邪恶或不正；在言语语境中补出“的话”，使现代汉语自然，同时保留其道德含义，并避免与下句“诡诈”重叠。
- source_word: וּלְשׁוֹנִי
  choice: 我的舌头也决不
  rationale: 连接词 וּ 在前一分句强烈否定的作用域内承接平行句；汉语用“也决不”清楚传达递进并列。
- source_word: יֶהְגֶּה
  choice: 吐出
  rationale: הגה 可指低声说、发出或吐露；以“舌头”为主语、以“诡诈”为宾语时，“吐出”既自然又保留具体的言语意象。
- source_word: רְמִיָּה
  choice: 诡诈之言
  rationale: רְמִיָּה 指欺骗、诡诈或奸诈；译作“诡诈之言”符合言语语境，并与“不义的话”保持语义区别。
