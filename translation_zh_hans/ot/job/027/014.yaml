base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: zh_hans
  text: 若他的儿子增多，他们必归于刀剑；他的后代吃不饱饭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: 即使
  rationale: אִם通常可表条件，但在这里与主句构成让步意味：“即使……也……”。这样既保留条件色彩，也自然表达儿子虽多却难逃灾祸的反差。
- source_word: יִרְבּוּ בָנָיו
  choice: 他的儿子增多
  rationale: יִרְבּוּ指数量增多；בָנָיו明确为“他的儿子”，不扩展为泛指“儿女”。
- source_word: לְמוֹ חָרֶב
  choice: 也是为刀剑而生
  rationale: לְמוֹ表示归向、结局或命定；补出“而生”使现代汉语完整，同时“刀剑”保留原文具体意象，并可指战争或暴力死亡。
- source_word: וְצֶאֱצָאָיו
  choice: 他的后代
  rationale: צֶאֱצָאָיו比紧邻的“儿子”范围更广，指其所出的子孙后裔。
- source_word: לֹא יִשְׂבְּעוּ לָחֶם
  choice: 也吃不饱饭
  rationale: 字面为“不因饼得饱足”。“吃不饱饭”是自然、庄重而易懂的现代汉语，准确传达食物不足；“饭”在此泛指日常食物。
theological_decisions:
- issue: 儿子增多与刀剑之间的关系
  choice: 译为“也是为刀剑而生”，表达其结局归于刀剑
  alternative: “就必死于刀剑”
  rationale: 原文介词结构简短含蓄，表示归向或命运，并未明说“必死”；所选译法保留这种张力，避免将意象解释得过实。
- issue: אִם的逻辑关系
  choice: 即使
  alternative: 如果
  rationale: “如果”在语法上可行，但上下文描述恶人的份，使该句更像让步陈述。采用“即使”使中文连贯，同时不把增多理解为确定已经发生。
translation_notes:
  register: 采用现代标准普通话，句式凝练而庄重。“刀剑”保留诗歌性和审判意象；“吃不饱饭”比“不得以饼满足”更自然，并保持原文匮乏之意。
