  text: He builds his house like a moth[a], like a shelter that a watchman makes.
translation:
  language: zh_hans
  text: 他建造自己的房屋，如同虫蛾筑巢；又如守望者所搭的棚子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棚子”也可译为“临时棚屋”或“棚舍”。“守望者”所译的词可指看守田地或葡萄园的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָה
  choice: 建
  rationale: 这是Qal完成式第三人称阳性单数；在诗歌中描述恶人的典型行为，汉语用一般性表述“建”较自然。
- source_word: כָעָשׁ
  choice: 如同蛀虫的窝
  rationale: עָשׁ通常指蛀衣物的虫蛾。原文直译为“像蛀虫一样”，这里与“房屋”连用，译作“如同蛀虫的窝”可自然表达其脆弱、易毁的形象，同时以脚注保留词义上的不确定性。
- source_word: בֵּיתוֹ
  choice: 他的房屋
  rationale: בַּיִת也可指家室，但上下文与“建”和“棚子”对应，具体建筑物“房屋”更合适。
- source_word: וּכְסֻכָּה
  choice: 又像……棚子
  rationale: סֻכָּה指临时搭建的棚、亭或小屋；“棚子”简明自然，并体现结构简陋、短暂。
- source_word: עָשָׂה
  choice: 搭
  rationale: 原义为“做、造”；与临时棚子搭配时，现代汉语用“搭”最自然，也准确表现其临时性质。
- source_word: נֹצֵר
  choice: 守望者
  rationale: 该分词指看守、护卫的人；此处很可能是田地或葡萄园中的看守者。“守望者”既简洁，也不把具体场景限定得超过原文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两行诗意象平行：蛀虫之窝与守望者临时搭的棚子都突出恶人住所的脆弱和短暂；不把“守望者”进一步限定为田地或葡萄园看守，以免超出原文。
