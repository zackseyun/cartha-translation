  yaml_path: translation/ot/job/027/021.yaml
  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
translation:
  language: zh_hans
  text: 东风把他带走，他便离去；它又把他从原处卷走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: 把他卷走
  rationale: נשׂא 的基本义是“举起、承载、带走”；在东风施行毁灭的语境中，“卷走”自然地表达风将人强行带离，同时不与下半句完全重复。
- source_word: קָדִים
  choice: 东风
  rationale: קָדִים 在希伯来诗歌中常指来自东方、具有破坏力的风；直译为“东风”准确而简洁。
- source_word: וְיֵלַךְ
  choice: 他便消逝
  rationale: הלך 本义为“走、离去”；这里承接被风卷走的动作，表达其不复留在原处的结果。“消逝”符合诗体，但不额外断定死亡。
- source_word: וִישָׂעֲרֵהוּ
  choice: 把他刮走
  rationale: סער 表示如暴风般猛烈吹袭、卷动或驱散。“刮走”在现代汉语中自然，并保留暴风强行驱逐的意象。
- source_word: מִמְּקֹמוֹ
  choice: 从他的所在
  rationale: מָקוֹם 意为“地方、所在之处”。“他的所在”保留原文关系，又比重复使用“地方”更适合诗句。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两分句保留希伯来原文的平行结构，并用“卷走／刮走”呈现 נשׂא 与 סער 的语义区别。原文虽可按诗歌语境理解为人彻底离去，但不明说死亡，因此译文保留这一张力。
