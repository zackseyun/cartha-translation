revisions:
- from: 东风把他卷走，他便消逝；又从他的所在把他刮走。
  to: 东风把他带走，他便离去；它又把他从原处卷走。
  rationale: 以“带走”对应נשא的携带、带离，避免与下句的סער完全重复；以“离去”保留הלך的直接结果，避免“消逝”所增添的湮没意味。下句改为“它又把他从原处卷走”，使施事、处所和猛烈卷动的意象清晰自然，同时保留原文诗歌式的重复推进。
