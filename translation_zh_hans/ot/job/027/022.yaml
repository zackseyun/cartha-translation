  yaml_path: translation/ot/job/027/022.yaml
  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
translation:
  language: zh_hans
  text: 他猛烈攻击那人，毫不留情；那人竭力逃离他的手。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竭力逃离”原文直译为“逃跑，他逃跑”；同词根的不定式绝对式与限定动词连用，以加强语气，也可译作“他必定逃跑”或“他急忙逃跑”。“他的手”也可理解为“他的权势”或“他的掌握”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: 他向那人猛力袭来
  rationale: שלך 的希斐勒形通常指“投、掷”，但原文没有明说所投之物；与 עָלָיו 连用，在审判的暴烈语境中可描写猛烈攻击。译作“猛力袭来”既避免无根据地补入反身代词，也保留敌对动作及原文主语未明的特点。
- source_word: וְלֹא יַחְמֹל
  choice: 毫不留情
  rationale: חמל 可指“怜悯”或“饶恕”。此处描写严厉攻击，“毫不留情”自然凝练，并兼顾不怜悯与不宽免之意。
- source_word: מִיָדוֹ
  choice: 逃离他的手
  rationale: 保留 יָד“手”的具体意象；在希伯来语中也可隐含权势或掌控。
- source_word: בָּרוֹחַ יִבְרָח
  choice: 急忙逃离
  rationale: 同词根的不定式绝对式加限定动词具有加强作用。这里译为“急忙逃离”，表达仓皇、竭力逃跑的强调语气，而不采用生硬的“逃跑，他必逃跑”。
theological_decisions:
- issue: 本节两个第三人称阳性单数主语的所指
  choice: 前句译“他”，后句译“那人”，让中文显出施袭者与逃跑者的自然对照
  alternative: 两处都译“他”，保留形式上的指代含混
  rationale: 上下文通常将前一主语理解为施行审判者，将后一句的主语理解为恶人；现代汉语若连续使用“他”容易误读为同一人一边袭击一边逃跑。译文作最低限度的指代澄清，但不在正文中界定施袭者究竟是神、暴风或其他力量。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“猛力袭来”传达暴烈动作而不擅自补出投掷物或反身代词；“毫不留情”符合现代汉语习惯。脚注标记置于正文相关分句之后。
