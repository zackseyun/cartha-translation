base_translation:
  language: en
  yaml_path: translation/ot/job/027/020.yaml
  text: Terrors overtake him like waters[b][a]; in the night a storm steals him away.
translation:
  language: zh_hans
  text: 恐怖如众水追上他[a]；夜间，暴风把他偷走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恐怖如洪水追上他”。
    reason: lexical_alternative
  - marker: b
    text: “暴风”或译“旋风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: 追上他
  rationale: 该词为 נשׂג 的使役式，以灾祸为主语时表示赶上、追及；“追上他”自然地保留灾难追逼而至的意象。
- source_word: כַמַּיִם
  choice: 如洪水
  rationale: 希伯来文直译为“如众水”。在本诗句中，“如洪水”以自然的现代汉语表达众水汹涌、淹没般的力量；直译“如众水”收入脚注。
- source_word: בַּלָּהוֹת
  choice: 惊恐
  rationale: 该复数名词表示令人恐惧的事物或突然而来的恐怖；“惊恐”简洁庄重，并可作为追上恶人的拟人化主语。
- source_word: לַיְלָה
  choice: 夜间
  rationale: 该名词在此作状语，“夜间”准确、简洁，并保留诗句的时间背景。
- source_word: גְּנָבַתּוּ
  choice: 把他偷走
  rationale: 词根 גנב 的基本义是“偷”；以暴风为主语，描绘它像盗贼一样突然将人带走。“偷走”保留了原文刻意而鲜明的比喻。
- source_word: סוּפָה
  choice: 暴风
  rationale: 该词指猛烈的风暴，也可译为“旋风”。“暴风”在现代汉语中清楚自然，又不把气象形态限定得过窄。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；用分号保持两个平行灾难意象的节奏。“偷走”有意保留希伯来文 גנב 的突兀拟人化表达，不改写为较平淡的“卷走”。
