base_translation:
  language: en
  yaml_path: translation/ot/job/027/002.yaml
  text: As God lives[a], who has taken away my justice, and the Almighty, who has made my soul bitter[b],
translation:
  language: zh_hans
  text: 我指着永活的上帝起誓：他夺去了我的公道[a]；全能者使我的生命苦涩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公道”也可译作“权利”“裁断”或“合法诉求”。希伯来语 מִשְׁפָּט 可指公正、审判，也可指人应得的权利。
    reason: lexical_alternative
  - marker: b
    text: “使我的生命苦涩”也可译作“使我心里愁苦”或“使我受苦”。希伯来语 נֶפֶשׁ 可按语境指生命、内在自我或整个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  choice: 我指着永活的上帝起誓
  rationale: “חַי＋神的称号”是起誓公式，不只是说上帝是活着的；译文用现代汉语明确表达其誓言功能，同时以“永活”保留原文的生命意象。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是对神的通用称号，并非需要音译的专名；“上帝”自然、庄重，也适合起誓语境。
- source_word: הֵסִיר
  choice: 夺去了
  rationale: 该使役形在这里表示移除、拿走；“夺去了”贴合约伯认为自己应得的公正被撤去的强烈申诉。
- source_word: מִשְׁפָּטִי
  choice: 我的公道
  rationale: מִשְׁפָּט可指公正、裁断或合法权利。“公道”在现代汉语中自然地涵盖公平待遇与应得权利，又不把含义缩窄为正式法律诉求。
- source_word: וְשַׁדַּי
  choice: 全能者
  rationale: שַׁדַּי是神的称号；译出其传统含义而不音译，并保留原文与“上帝”之间庄严的平行结构。
- source_word: הֵמַר
  choice: 使……苦涩
  rationale: 该使役形意为“使苦、使苦涩”。译文保留“苦”的具体隐喻，没有仅改写为一般性的悲伤。
- source_word: נַפְשִׁי
  choice: 我的生命
  rationale: נֶפֶשׁ在此可指生命、内在自我或整个人。“生命”既符合约伯受苦的语境，也避免把它限定为后世身心二分意义上的“灵魂”。
theological_decisions:
- issue: 神的称号אֵל与שַׁדַּי如何处理
  choice: 上帝……全能者
  alternative: 神……沙代
  rationale: 两者在本节中都是神的称号。译出称号的意义，既使普通读者易懂，也保留原文庄严的平行关系，不引入特定宗派解释。
- issue: 如何呈现约伯把不公和苦难归于上帝的说法
  choice: 直接保留“他夺去了我的公道……他使我的生命苦涩”
  alternative: 弱化为约伯主观感到未获公正、生活痛苦
  rationale: 原文有意保留约伯对上帝尖锐而紧张的申诉。译文不替作者缓和或解释这一神学张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语。用破折号凸显两个神圣称号后面的尖锐描述，以分号保持希伯来平行结构；句末用冒号表示誓言内容在下一节继续。“永活”略带诗性，但能同时传达“活着”与起誓公式的庄严感。
