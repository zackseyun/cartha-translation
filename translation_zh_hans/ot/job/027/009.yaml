base_translation:
  language: en
  yaml_path: translation/ot/job/027/009.yaml
  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: zh_hans
  text: 患难[c]临到他时[b]，上帝会听他的呼求[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼求”也可译作“呼喊”或“求告”。
    reason: lexical_alternative
  - marker: b
    text: “临到他时”也可译作“如果临到他”，因为希伯来语连词在这里也可能表示条件；按上下文译作时间关系较为自然。
    reason: alternative_reading
  - marker: c
    text: “患难”也可译作“困苦”、“灾祸”或“苦难”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: 他的呼求
  rationale: צְעָקָה 指人在困苦中发出的呼喊，也可含向上帝求助之意。“呼求”在现代汉语中自然凝练，并保留急切求援的语气。
- source_word: יִשְׁמַע
  choice: 会听
  rationale: 此处未完成式位于反问句中，适合表达将来或情势发生时的结果；“会听”也保留“听见”与“垂听”之间的语义张力。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל 在此指上帝；“上帝”是现代标准汉语中清楚、庄重且通行的译法。
- source_word: כִּי
  choice: ……时
  rationale: כִּי 在此最自然地理解为时间关系，即患难临到之时；但该连词也可作条件义，因此另以脚注说明“如果”。
- source_word: תָבוֹא
  choice: 临到
  rationale: בוא 本义为“来”；与患难搭配时，“临到”既保留其动态意象，又符合庄重自然的现代汉语表达。
- source_word: עָלָיו
  choice: 他
  rationale: בוא על 表示某事临到某人；汉语用“临到他”即可自然表达该介词结构。
- source_word: צָרָה
  choice: 患难
  rationale: צָרָה 可指困苦、急难或灾祸。“患难”涵盖内外压力，语义宽度适当，也符合本节语境。
theological_decisions:
- issue: יִשְׁמַע 是否含“垂听、应允”之意
  choice: 译作“会听”
  alternative: 会垂听
  rationale: “听”保留原词的基本意义及语境中可能隐含的回应意味，不把“应允”明确写入正文，从而避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留希伯来文的反问力度；“会听”避免将原文直接解释成“必垂听”或“必应允”。所有脚注标记均置于正文对应句末。
