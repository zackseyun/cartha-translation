base_translation:
  language: en
  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: zh_hans
  text: 他的幸存者必在死亡中被埋葬[a]；他的寡妇不哀哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必被死亡埋葬。”希伯来语的说法十分凝缩，可表示他们在死亡中被埋葬，也可表示死亡是他们被埋葬的方式或结局。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: 他的余民
  rationale: 该词指留下来或幸存的人；虽为单数形式并带第三人称阳性单数后缀，但后接复数动词，故按集合意义译为“他的余民”，既保留“剩余者”的色彩，也符合中文表达。
- source_word: בַּמָּוֶת
  choice: 被死亡
  rationale: 介词 בְּ 与“死亡”构成高度凝缩的表达，可表示方式、处境或近似施事的手段。正文译作“被死亡埋葬”，保留原文将死亡人格化般置于埋葬过程中的突兀力度，而不把含义限定为地点。
- source_word: יִקָּבֵרוּ
  choice: 必被……埋葬
  rationale: קבר 的尼法勒未完成式在此表达被动意义“被埋葬”；“必”自然传达本节预告性的将来语气。
- source_word: וְאַלְמְנֹתָיו
  choice: 他们的寡妇
  rationale: אַלְמָנָה 意为“寡妇”，复数形式带第三人称阳性单数后缀。此处代词所指在语义上可能关联前述集合性的余民；中文用“他们的寡妇”避免生硬的“他的寡妇”，并表达这些死者所留下的寡妇。
- source_word: לֹא תִבְכֶּינָה
  choice: 不哀哭
  rationale: בכה 的基本义是哭泣、哀哭；上下文涉及死亡与丧葬，“哀哭”比单纯“哭泣”更准确，同时未扩大为涵盖全部丧礼行为的“哀悼”。
theological_decisions:
- issue: “他的寡妇”中单数后缀的所指
  choice: 译为“他们的寡妇”，按前述集合名词及复数动词理解为死者们留下的寡妇
  alternative: 直译为“他的寡妇”，将后缀持续指向恶人本人
  rationale: 希伯来语保留单数后缀，但 שָׂרִידוֹ 在句中按集合意义支配复数动词。中文若机械保留单数，容易被理解为一个人有多位妻子；采用复数代词更自然，也较符合本句死亡群体的语境，但不据此建立额外教义。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“余民”保留原文“剩余者、幸存者”的集合含义；“被死亡埋葬”刻意保留希伯来语凝缩而强烈的修辞，并用脚注呈现“在死亡中”的可能译法。
