  yaml_path: translation/ot/job/027/016.yaml
  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: zh_hans
  text: 即使[a]他堆积银子如尘土，预备衣服多如黏土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果他堆积银子如尘土，预备衣服多如黏土。”希伯来语אִם既可表示条件“如果”，也可表示让步“即使”；上下文较支持让步含义。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: 即使
  rationale: 此处可作条件词“如果”，也可按上下文理解为让步语“即使”。后文说明恶人所积之物终归他人，因此正文采用自然的让步表达，同时以脚注保留条件读法。
- source_word: יִצְבֹּר
  choice: 堆积
  rationale: צבר表示聚集、堆积；“堆积”保留与尘土相呼应的具体意象，也体现大量积聚。
- source_word: כֶּעָפָר
  choice: 如尘土
  rationale: 前缀כ表示比拟；“如尘土”简洁保留原文夸张的数量意象。
- source_word: כָּסֶף
  choice: 银子
  rationale: כֶּסֶף本义为银，也可指钱财；此处采用“银子”，保留诗句的具体物质形象。
- source_word: וְכַחֹמֶר
  choice: 如泥土
  rationale: חֹמֶר可指黏土、泥土；这里强调衣物多得像寻常泥土一样，译作“泥土”自然且与“尘土”形成诗意对应。
- source_word: יָכִין
  choice: 预备
  rationale: כון的使役词干在此表示备妥、预备；“预备”准确而庄重，并适合以衣物为宾语。
- source_word: מַלְבּוּשׁ
  choice: 衣服
  rationale: 该名词可集合性地指衣着、衣物；现代汉语“衣服”清楚自然，也可依语境包含多件衣物。
