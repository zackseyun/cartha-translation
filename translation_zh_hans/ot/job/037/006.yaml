  - severity: low
    issue: 脚注b中的“彰显他大能的豪雨”同样含有正文未明示的动词性解释。
    rationale: 宜将其改为较中性的“他大能的豪雨”，并说明“他的”通常指神及句法的其他可能。
  revised_text: 因为他对雪说：“降到地上[a]！”又吩咐雨和他大能的暴雨降下[b]。
