revisions:
- from: 因为他对雪说：“降在地上[a]！”又对雨说：“化作阵雨！”对大雨[b]说：“显出他的大能，倾盆而下！”
  to: 因为他对雪说：“降到地上[a]！”又吩咐雨和他大能的暴雨降下[b]。
  rationale: 修订删去原文没有明说的“化作”和“显出”，以“吩咐……降下”自然地表达由“他说”统摄的命令性语境。保留“他大能的暴雨”来反映末句中雨与“他的大能”的压缩属格关系，并通过脚注保留其句法和所指的开放性。
