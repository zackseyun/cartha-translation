  text: כִּ֤י לַ/שֶּׁ֨לַג יֹאמַ֗ר הֱוֵ֫א אָ֥רֶץ וְ/גֶ֥שֶׁם מָטָ֑ר וְ֝/גֶ֗שֶׁם מִטְר֥וֹת עֻזּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: zh_hans
  text: 因为他对雪说：“降到地上[a]！”又吩咐雨和他大能的暴雨降下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “降到地上”也可译作“要在地上”，意思是雪受命出现或停留在地面上。
    reason: lexical_alternative
  - marker: b
    text: 末句的希伯来文十分凝练，直译近于“雨，阵雨；他大能的雨”。“他的”通常理解为指神；全句也可译作“以及他大能的豪雨”或“以及猛烈的倾盆大雨”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明神如何掌管风云雨雪；汉语用“因为”自然表达解释或因由关系。
- source_word: לַשֶּׁלַג
  choice: 对雪
  rationale: 介词 ל־与“说”连用，标明说话对象，并保留诗中把雪人格化的表达。
- source_word: יֹאמַר
  choice: 他说
  rationale: 未完成式在诗歌描述中可表达生动、常态性的现在动作；命令意味由引语中的祈使句体现。
- source_word: הֱוֵא אָרֶץ
  choice: 降在地上
  rationale: הֱוֵא 字面为“要存在／成为”，这里命令雪出现在地上；译作“降在地上”符合雪的动态意象，同时以脚注保留较字面的可能。
- source_word: וְגֶשֶׁם מָטָר
  choice: 又对雨说：‘化作阵雨’
  rationale: 两个近义雨词形成浓缩的诗性组合；如此处理既保留“雨／阵雨”的层次，也维持对称的命令结构。
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: 对大雨说：‘显出他的大能，倾盆而下’
  rationale: 原文由“雨”、复数“众雨／阵雨”和“他的大能”构成，语法高度浓缩。译文保留神为能力所属者，并用自然汉语表达雨势猛烈的效果；其他句法分析列入脚注。
- source_word: עֻזּוֹ
  choice: 他的大能
  rationale: 阳性单数后缀在上下文中最自然地指正在向天气发令的神；不改作“它的威力”，以免悄然更换所指。
theological_decisions:
- issue: עֻזּוֹ 中代词的所指
  choice: 理解为指神，译作“他的大能”
  alternative: 理解为指雨，译作“它的威力”
  rationale: 上下文的主语是掌管天气、向雪雨发令的神，因此后缀指神最符合话语脉络；但希伯来语本身允许读者注意到诗句的压缩性。
- issue: 末句是否为延续的直接命令
  choice: 按平行结构理解为神对大雨所发的命令
  alternative: 理解为名词性短语：“以及他大能的豪雨”
  rationale: 前句“他说”可统摄连续的天气现象，按命令处理能显出平行关系；不过原文省略成分且句法浓缩，故在脚注保留名词性读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留雪雨受神发令的拟人化诗意，并以“雨—阵雨—大雨”的递进呈现原文近义词叠用和复数强化；脚注说明 הֱוֵא 的字面范围及末句开放的句法可能。
