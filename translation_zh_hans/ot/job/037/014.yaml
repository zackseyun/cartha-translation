  text: הַאֲזִ֣ינָ/ה זֹּ֣את אִיּ֑וֹב עֲ֝מֹ֗ד וְ/הִתְבּוֹנֵ֤ן נִפְלְא֬וֹת אֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: zh_hans
  text: 约伯啊，你要侧耳听这话；要站住，思想上帝的奇妙作为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: 侧耳听
  rationale: 该命令式要求专注聆听。“侧耳听”既保留原词所含的留心倾听之意，也符合庄重而自然的现代汉语。
- source_word: זֹּאת
  choice: 这话
  rationale: 阴性单数指示词可指以利户刚才或接下来所说的内容；汉语译作“这话”可自然补足所指，又不过度限定具体范围。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: עֲמֹד
  choice: 站住
  rationale: 该命令式基本义为“站立”；在此与“思想”相连，含停下来、定住心神的语境意味。“站住”保留身体姿态，也自然表达停止并专注之意。
- source_word: וְהִתְבּוֹנֵן
  choice: 思想
  rationale: 该词为 בין 的反身加强词干命令式，表示专心观察、思量或领会。“思想”在此简洁庄重，并传达深入思考之意。
- source_word: נִפְלְאוֹת
  choice: 奇妙作为
  rationale: 该复数名词可指令人惊奇的事或非凡作为。语境谈论上帝在自然界中的作为，译作“奇妙作为”比单纯“奇事”更清楚，同时保留其行动性。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל 在此是对神的通常称谓，并不要求额外译出“大能”等属性；“上帝”是现代标准汉语中自然、庄重且不附加解释的对应词。
theological_decisions:
- issue: 神圣称谓 אֵל 的译法
  choice: 上帝
  alternative: 大能的上帝
  rationale: 原文在此一般性地指上帝，并未明确要求把词源或相关的力量观念展开为修饰语。译作“上帝”避免加入原文未明说的神学强调。
- issue: נִפְלְאוֹת 是“奇妙之事”还是“奇妙作为”
  choice: 奇妙作为
  alternative: 奇妙之事
  rationale: 两者在词义上皆可成立；结合前文关于云、闪电、风与天气的描述，“作为”较能呈现这些奇妙现象是上帝所行的事，但不进一步界定其作用方式。
translation_notes:
  register: 采用现代、庄重、可朗读的简体中文。“侧耳听”略带文学色彩，却是当代读者容易理解的固定表达；分号呈现两个相连的命令。未设置脚注，因为正文能够自然承载主要词义，现有替代译法不构成必须标注的实质歧义。
