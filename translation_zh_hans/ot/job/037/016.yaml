  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: zh_hans
  text: 你知道云彩如何悬浮[a]——那知识全备者的奇妙作为吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“云彩的铺展。”这里的希伯来词很少见，确切含义不确定，可能指云彩在天空中的铺展、悬浮或平衡状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: 你知道……吗
  rationale: 疑问词与ידע未完成式第二人称阳性单数构成对约伯的反问；直译为“你知道……吗”自然地保留了挑战语气。
- source_word: עַל
  choice: 以“知道……”的直接宾语结构表达
  rationale: 此处介词引出所知的内容；现代汉语无需逐字译出“关于”，直接说“知道……”更自然。
- source_word: מִפְלְשֵׂי עָב
  choice: 云彩怎样悬在空中
  rationale: מִפְלְשֵׂי是罕见词，确切含义不明，可能指云彩的铺展或悬浮、平衡状态。正文采用易懂且符合气象语境的“悬在空中”，并以脚注保留“铺展开来”的可能解释。
- source_word: מִפְלְאוֹת
  choice: 奇妙作为
  rationale: 该复数名词指令人惊叹的作为或现象；“奇妙作为”比单用“奇事”更能与施行者的描述衔接。
- source_word: תְּמִים
  choice: 全备
  rationale: 此处形容知识毫无缺欠、完整圆满；“全备”既庄重又比道德意义较强的“无瑕疵”更切合语境。
- source_word: דֵּעִים
  choice: 知识
  rationale: 该复数形式可能强调知识的丰盛或完全；汉语采用抽象单数“知识”，由“全备”表达其完整性。
theological_decisions:
- issue: “知识全备者”的所指
  choice: 保留“那知识全备者”的间接称谓，由上下文指向上帝
  alternative: 直接译作“知识全备的上帝”或理解为一般智者、以利户自指
  rationale: 上下文论述掌管天气和受造界的那一位，最自然是指上帝；但希伯来文没有在此明说“上帝”，故不补入专名，以保留原文表达方式。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“云彩怎样悬在空中”避免生硬的“云的平衡”，同时以脚注呈现原词的不确定性；整句保留反问形式及“知识全备者”的隐含所指。
