base_translation:
  language: en
  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
translation:
  language: zh_hans
  text: 或为惩戒[a]，或为他的土地，或为慈爱[b]，他使它临到[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩戒”直译为“杖”，可指惩罚或管教。
    reason: lexical_alternative
  - marker: b
    text: “慈爱”也可译为“怜悯”或“恩慈”。
    reason: lexical_alternative
  - marker: c
    text: 这句也可译为“他使它来到”或“他使它发生”；“它”指上下文中的云雨或风暴现象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 或……或……或……
  rationale: 三个重复的 אִם 在这里列举不同的目的或情形，不是普通的条件句；汉语用三重“或”自然地保留并列选择结构。
- source_word: לְשֵׁבֶט
  choice: 为惩戒
  rationale: שֵׁבֶט 字面是“杖”，在此借指上帝借天气施行的责罚或管教。“惩戒”兼顾管教与惩罚之意，又不把语义限定得过窄。
- source_word: לְאַרְצוֹ
  choice: 为他的土地
  rationale: אֶרֶץ 可指“地、土地、国土”；第三人称阳性单数词尾表示“他的”。“他的土地”保留所属关系，也符合上帝治理大地的上下文。
- source_word: לְחֶסֶד
  choice: 为慈爱
  rationale: חֶסֶד 可表达慈爱、怜悯、恩慈或忠贞之爱。此处没有明确的盟约措辞，“慈爱”既庄重自然，也保留其宽广而深厚的善意。
- source_word: יַמְצִאֵהוּ
  choice: 他使这一切发生
  rationale: 这是 מצא 的使役形式，并带阳性单数宾语词尾；在上下文中指上帝使所谈论的云雨或风暴现象来到、出现或实现。汉语用“使这一切发生”表达其使役意义，同时避免强行指定词尾所指的单一天气现象。
theological_decisions:
- issue: 三个介词短语所表达的神圣目的
  choice: 把它们译为天气事件的三种可能目的：惩戒、眷顾他的土地、彰显慈爱。
  alternative: 把三个短语理解为事件所临到的对象或地点；或把第一项更明确地译成刑罚。
  rationale: 重复的 אִם 与 לְ 最自然地构成目的或结果的并列选项。译文保留上帝可能借同一天气现象施行审判与慈爱的张力，不把经文单向限定为刑罚或恩惠。
- issue: לְאַרְצוֹ 与 לְחֶסֶד 的关系
  choice: 依照马所拉文本，将“他的土地”与“慈爱”并列为两个独立选项。
  alternative: 把“他的土地”理解为天气临到的地点，而仅把“慈爱”视为目的。
  rationale: 希伯来文在两项前都重复 אִם，支持三项并列；但各项的语义类别并不完全对称，译文不额外补词来消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“或……或……或……”保留原文三重并列；“惩戒”“慈爱”延续圣经语体但不显陈旧。主句用“使这一切发生”使中文完整自然，脚注则说明原文单数宾语及“来到／临到”的可能译法。
