  text: you whose garments are hot when the earth is still because of the south wind?[a]
translation:
  language: zh_hans
  text: 当他使大地因南方而平静时，你的衣服为何发热？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因南方”直译也可作“从南方”。此处可能指从南方吹来的热风；“他使……平静”承接上文，隐含的施事可理解为神。
    reason: 保留 מִדָּרוֹם 的“南方／南风”词义空间，并反映 הַשְׁקִיט 的使役形式及其上下文所暗示的施事。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 你这……的人
  rationale: 此处承接上下文，构成对约伯的第二人称关系性称呼。译作“你这……的人”既保留修饰结构，也避免擅自补入“知道为何”等原文没有的内容。
- source_word: בְּגָדֶיךָ
  choice: 你的衣服
  rationale: בגד 指衣服、衣裳；“衣服”是自然、庄重而不古奥的现代汉语。
- source_word: חַמִּים
  choice: 发热
  rationale: חַמִּים 表示热、暖；结合人在炎热天气中的感受，“衣服发热”比静态的“是热的”更符合现代汉语表达，同时没有强化为“滚烫”。
- source_word: בְּהַשְׁקִט
  choice: 使……沉寂时
  rationale: 该形式可按使役意义理解为“使安静、使平静”，前置介词 בְּ 表示时间。“沉寂”适合描写炎热南风下大地寂静不动的状态。
- source_word: אֶרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指地、土地或大地；这里是气象诗歌语境，“大地”兼顾广义和诗体语感。
- source_word: מִדָּרוֹם
  choice: 南风
  rationale: 原文直译为“从南方／因南方”；在气象语境中，南方所来的热风最能说明衣服发热和大地沉寂，但脚注保留较字面的译法。
