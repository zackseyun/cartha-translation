  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: zh_hans
  text: 你能与他一同铺展那坚硬如铸成的镜子的天空吗？[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铺展”或译“锤打延展”或“伸展开”。这个希伯来动词既可表示铺展，也可让人想到把金属锤打得薄而展开。
    reason: lexical_alternative
  - marker: b
    text: “天空”或译“诸天”或“云层”。希伯来文 שׁחקים 是诗歌用语，可指天空或诸天，在某些语境中也可指云层。
    reason: lexical_alternative
  - marker: c
    text: 直译“像铸成的镜子”。古代镜子通常由打磨光亮的金属制成；这里把天空描绘成坚硬而有光泽的金属制品。
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: 铺展
  rationale: רקע 的使役式可指将某物铺开，也可让人联想到把金属锤打延展。正文用自然的“铺展”，脚注保留“锤打延展”的金属加工意象。
- source_word: עִמּוֹ
  choice: 与他一同
  rationale: 希伯来文使用第三人称代词，所指从上下文看是上帝；正文保留代词，不直接改成“与上帝一同”。
- source_word: לִשְׁחָקִים
  choice: 天空
  rationale: שׁחקים 是诗歌用语，可指天空、诸天，有时也指云层。此处与铸造金属镜子的比喻相连，“天空”最自然地呈现可见天穹的画面。
- source_word: חֲזָקִים
  choice: 坚硬
  rationale: 该形容词在这里与铸成的金属镜子相呼应，重点是天空在诗歌图像中的坚固、硬实；“坚硬”比“强壮”更贴合此比喻。
- source_word: כִּרְאִי
  choice: 如同……镜子
  rationale: רְאִי 指镜子，前缀 כ־ 表示比较；译作“如同……镜子”符合现代汉语表达。
- source_word: מוּצָק
  choice: 铸成的
  rationale: 该词表示经熔化浇注而成之物，尤其是金属制品。“铸成的”保留冶金意象，同时不把原文未注明的材质具体化为铜。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。为避免中文长句中“坚硬”修饰关系不清，将希伯来文连续问句分为问句和说明句；保留“他”的代词形式以及天空如铸造金属镜子的古代诗歌图像，不将其改写为现代气象描述。
