  text: לָ֭/כֵן יְרֵא֣וּ/הוּ אֲנָשִׁ֑ים לֹֽא יִ֝רְאֶ֗ה כָּל חַכְמֵי לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: zh_hans
  text: 所以，世人都敬畏他；他不看重任何心中有智慧的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不看任何心中有智慧的人。”这里译作“不看重”的希伯来语动词，字面意思是“看见”，也可按语境表示“关注”或“重视”。
    reason: 保留“看见／看重”的词义幅度，且避免把原文未明说的“自以为”解释加入正文。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文对上帝伟大作为的描述，表达由此得出的结论；“所以”自然保留推论关系。
- source_word: יְרֵאוּהוּ
  choice: 敬畏他
  rationale: ירא兼有惧怕、尊崇和敬畏之意；“敬畏”在现代汉语中既保留面对神威严的畏惧，也包含尊崇。
- source_word: אֲנָשִׁים
  choice: 世人
  rationale: 此处泛指人类；“世人”简洁自然，并与神形成语义上的对照。
- source_word: לֹא יִרְאֶה
  choice: 他不看重
  rationale: ראה本义为“看见”，在此可表示关注、重视或眷顾；“不看重”符合上下文，同时以脚注保留字面可能。
- source_word: כָּל
  choice: 任何
  rationale: 在否定句中以“任何”表达希伯来语的全称分配意义，即一个也不看重。
- source_word: חַכְמֵי לֵב
  choice: 心中有智慧的人
  rationale: 保留“心”与“智慧”的希伯来语表达，不将“自以为”直接并入这一词组本身。
theological_decisions:
- issue: 上帝对“心中有智慧的人”的态度
  choice: 正文译作“他不看重任何自以为心中有智慧的人”
  alternative: “他不看重任何心中有智慧的人”或“他不看任何心中有智慧的人”
  rationale: 动词的隐含主语依上下文最自然地指上帝。“自以为”体现本句对人以自身智慧自恃的警告，但原文未明说，因此应避免把它当作词汇本义；此处将其用于自然传达语境，并以脚注保留较字面的读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“敬畏”保留神学分量；“世人”泛指所有人。脚注标记[a]已置于正文相关句末。
