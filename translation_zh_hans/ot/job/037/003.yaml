  text: תַּֽחַת כָּל הַ/שָּׁמַ֥יִם יִשְׁרֵ֑/הוּ וְ֝/אוֹר֗/וֹ עַל כַּנְפ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/003.yaml
  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: zh_hans
  text: 他在诸天之下发出它[a]，使他的闪电直达大地的尽头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发出它”也可译为“引导它”或“放出它”；“它”所指为何，原文没有明确说明。
    reason: lexical_alternative
  - marker: b
    text: “大地的尽头”原文直译为“大地的翅膀”，是指大地边缘或极远之处的诗意说法。本句“他的闪电”原文作“他的光”。
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: 在诸天之下
  rationale: 按希伯来文保留“诸天”这一复数形式和空间意象；“在……之下”符合现代汉语表达，也保持诗体的庄重感。
- source_word: יִשְׁרֵהוּ
  choice: 发出它
  rationale: 该动词在此处语义较难确定，可指发出、放出或引导；直译式的“发出它”保留宾语后缀所指对象的含蓄性，不擅自判定它具体是雷声还是闪电。
- source_word: וְאוֹרוֹ
  choice: 他的闪电
  rationale: אוֹר 字面为“光”，但在雷暴语境中很可能指闪电的亮光；正文用自然明确的“闪电”，并以脚注保留“光”这一字面译法。
- source_word: עַל כַּנְפוֹת הָאָרֶץ
  choice: 直达大地的尽头
  rationale: כַּנְפוֹת 字面为“翅膀”，与“大地”连用表示边缘或极远之处；“大地的尽头”是自然的现代汉语对应。“直达”传达 עַל 在本诗句中所表达的延伸范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“诸天”保留原文复数和诗歌色彩；两个脚注分别说明动词与代词的歧义，以及“光”和“大地的翅膀”的字面表达。
