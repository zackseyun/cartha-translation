  text: Listen carefully[a] to the trembling of his voice[b], and the rumbling that comes out from his mouth.
translation:
  language: zh_hans
  text: 你们要仔细听他声音的震颤[a]，以及从他口中发出的轰鸣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要听，要听他声音的震怒（或‘骚动’）。”这里的希伯来词可指震颤、骚动或震怒。
    reason: lexical_alternative
  - marker: b
    text: “轰鸣”也可译作“低鸣”或“声响”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: 要仔细听……听
  rationale: 祈使式加同源不定式绝对形加强命令语气；用“仔细听”自然表达强调，并在并列分句中复现“听”，保留诗句的力度。
- source_word: בְּרֹגֶז
  choice: 声音的震颤
  rationale: רֹגֶז 可指震颤、骚动或震怒；风暴语境中“震颤”既传达令人战栗、震动的声响，也不把该词直接限定为愤怒。
- source_word: קֹלוֹ
  choice: 他的声音
  rationale: קוֹל 可指声音或嗓音；下文提到“他的口”，保留拟人化表达最贴近希伯来诗歌。
- source_word: וְהֶגֶה
  choice: 轰鸣
  rationale: הֶגֶה 指低沉的声音、喃喃声或呻吟；在雷暴语境中，“轰鸣”自然呈现低沉持续的雷声，同时保留其声音意象。
- source_word: מִפִּיו יֵצֵא
  choice: 从他口中发出
  rationale: יצא 意为出去、出来；“从他口中发出”在现代汉语中自然，也保留原文具体的拟人化图景。
theological_decisions:
- issue: 风暴意象中对上帝的拟人化描写
  choice: 保留“他的声音”和“他的口”
  alternative: 改作“雷声”或非人格化的“它的声音”
  rationale: 希伯来文本把风暴诗意地描绘为上帝亲自发声；保留拟人化措辞可维护原文的文学与神学张力，不把它扁平化为单纯的自然现象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“要仔细听”表达希伯来语同源结构的加强语气；第二个“听”使两个听觉对象的并列关系清楚。保留“声音”“口”的拟人化诗意，并以脚注呈现关键词的真实多义性。
