  text: הַֽ/יְסֻפַּר ל֭/וֹ כִּ֣י אֲדַבֵּ֑ר אִֽם אָ֥מַר אִ֝֗ישׁ כִּ֣י יְבֻלָּֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/020.yaml
  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
translation:
  language: zh_hans
  text: 难道要告诉他[a]，说我要开口吗？人[b]若说话[c]，必被吞灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”在上下文中指上帝。
    reason: referent_clarification
  - marker: b
    text: 原文直译为“一个人”，这里可泛指“有人”或“任何人”。
    reason: lexical_alternative
  - marker: c
    text: 本节的希伯来文句法较难。后半句也可译作：“还是一个人会说自己将被吞灭吗？”全节亦可译作：“难道要告诉他我正在说话吗？还是一个人会说自己将被吞灭吗？”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: 难道要告诉
  rationale: 该词是ספר的被动式，并带疑问词הֲ；汉语用不定施事的反问句，既保留被动含义，也自然表达其修辞语气。
- source_word: לוֹ
  choice: 他
  rationale: 上下文所指为上帝；希伯来文代词本身没有敬称或大写标记，因此正文采用现代汉语普通第三人称代词，并以脚注说明所指。
- source_word: כִּי אֲדַבֵּר
  choice: 说我要开口
  rationale: כִּי在此引出所报告的内容；אֲדַבֵּר表示设想中的发言，译为“我要开口”符合反问语境，也保持说话的具体意象。
- source_word: אִם אָמַר אִישׁ
  choice: 人若说话
  rationale: אִם保留为条件词“若”；אִישׁ在此可作泛指，译为“人”；אָמר的宾语未明说，故不增补“这样”等原文没有的内容。
- source_word: כִּי יְבֻלָּע
  choice: 必被吞灭
  rationale: בלע的被动式保留“吞”的鲜明意象；此处כִּי可理解为加强断言，汉语以“必”表达，同时脚注保留另一种句法分析。
theological_decisions:
- issue: לוֹ所指的对象
  choice: 正文译作“他”，脚注说明指上帝
  alternative: 直接译作“上帝”或使用敬称“祂”
  rationale: 原文在此使用普通阳性单数代词，所指由上下文确定；不把解释性的名词或现代敬称写入正文。
- issue: אִישׁ的泛指与性别表达
  choice: 译作“人”
  alternative: 译作“一个男人”或“有人”
  rationale: 此处אִישׁ指任何发言的人，并非强调男性身份；“人”既保留单数人的概念，也符合自然汉语。
- issue: 本节压缩而含混的句法
  choice: 正文按条件句理解为“人若说话，必被吞灭”
  alternative: 将后半句理解为另一个问句：“难道人会说自己将被吞灭吗？”
  rationale: 希伯来文后半句的אִם与כִּי关系不明确。正文采用语境连贯且贴近词序的条件式读法，但不把另一种可能读法排除，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗”呈现原文反问语气；“开口”“吞灭”保留诗歌的具体意象。正文不强行消除后半句的句法张力，重要异读置于脚注。
