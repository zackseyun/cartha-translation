source:
  edition: WLC
  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: zh_hans
  text: 全能者——我们无法测透他[a]；他大有能力，又有公正[b]和丰盛的公义；他不苦待人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们找不到他”“我们无法企及他”。
    reason: lexical_alternative
  - marker: b
    text: “公正”也可译作“审判”。
    reason: lexical_alternative
  - marker: c
    text: 末句或译：“他不使人受苦。”也有人将动词理解为“他不回答”，但这与马所拉元音及本节语境较不相合。
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是《约伯记》中 שַׁדַּי 的神圣称号；译作“全能者”既传达其通常含义，也比音译更便于现代汉语读者理解。
- source_word: לֹא מְצָאנֻהוּ
  choice: 我们无法测透他
  rationale: מצא 字面为“找到”，但在此处涉及人不能探明、企及或充分理解上帝；“无法测透”自然地表达这种超越性，同时以脚注保留其他可能译法。
- source_word: שַׂגִּיא כֹחַ
  choice: 他大有能力
  rationale: שַׂגִּיא 表示伟大、崇高，כֹחַ 表示力量或能力；“大有能力”贴近原文且符合庄重、自然的现代汉语。
- source_word: וּמִשְׁפָּט
  choice: 又有公正
  rationale: מִשְׁפָּט 可指“审判”或“公正”。这里与“公义”并列，译作道德属性“公正”更符合语境，同时在脚注中保留“审判”。
- source_word: וְרֹב צְדָקָה
  choice: 和丰盛的公义
  rationale: רֹב 表示丰富、众多或广大，צְדָקָה 表示公义；此译保留名词结构及其程度强化，不把它改写成更强的系统性教义陈述。
- source_word: לֹא יְעַנֶּה
  choice: 他不苦待人
  rationale: 此处带马所拉元音的 Piel 形式最自然地来自 ענה，意为使人受苦、欺压或苦待。汉语补出“人”使句子完整，但不限定具体对象；“苦待”较“欺压”温和，兼顾词义与上下文。
theological_decisions:
- issue: 末句 לֹא יְעַנֶּה 与上帝的公正、公义之间的关系
  choice: 理解为上帝不苦待人。
  alternative: 理解为“他不回答”，强调上帝不受人传唤，也不必向人作出解释。
  rationale: 马所拉元音所指向的 Piel 词形及上下文中“公正”和“公义”的并列，都支持“苦待／使受苦”的解释。正文采用此读法，但以脚注保留“他不回答”的少数解释，从而不消除经文中上帝既不可测透又公义的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全能者”保留神圣称号；破折号和分号呈现原文短促、赞叹式的结构。正文不加入宗派术语，并用脚注明确保留关键词语的真实歧义。
