  yaml_path: translation/ot/job/037/004.yaml
  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: zh_hans
  text: 闪电之后[a]，有声音咆哮；他以威严的声音发出雷鸣；当他的声音被听见时，他不拦阻它们[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其后，有声音咆哮。”希伯来语也可作副词理解，但上下文很可能是回指上一节的闪电。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不使它们迟延。”这里的“它们”可能指伴随雷声而来的雷电或各种风暴现象。
    reason: lexical_alternative
  - marker: c
    text: 或译：“因为他的声音被听见。”希伯来语连词既可表示时间，也可表示原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 闪电之后
  rationale: 三单阳性后缀最可能回指上一节的闪电，呈现先见闪电、后闻雷声的次序；正文明确所指，脚注保留副词性理解。
- source_word: יִשְׁאַג קוֹל
  choice: 有声音咆哮
  rationale: שׁאג常指狮子咆哮，在此生动描写雷声；不提前加入原文到后半句才出现的所属关系。
- source_word: יַרְעֵם
  choice: 他……发出雷鸣
  rationale: רעם的使役形在此表达神使雷鸣响起；此译法符合现代汉语，又保留行动主体。
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: 以威严的声音
  rationale: גָּאוֹן可表达威严、崇高或宏伟；“威严的声音”自然凝练，并保留神圣庄严感。
- source_word: וְלֹא יְעַקְּבֵם
  choice: 也不拦住它们
  rationale: עקב的加强词干可指拦阻、扣留或延迟；复数宾语所指并未明说，可能是雷电或风暴的各种效应，因此照原文保留代词。
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: 他的声音一被听见
  rationale: 保留יִשָּׁמַע的被动语态，并将כִּי按风暴进程理解为时间关系；脚注保留原因关系的可能。
theological_decisions:
- issue: 咆哮和发雷声的主体
  choice: 用“他”指向在风暴中行动的神，但不在正文中直接补出“神”
  alternative: 把主体理解为非人格化的风暴或声音
  rationale: 上下文描述神在风暴中的作为，“他威严的声音”也支持人格化的神为主体；保留代词可避免过度解释。
- issue: 复数宾语“它们”的所指
  choice: 保留未明确指称的“它们”
  alternative: 明确译作“闪电”“雷电”或“风暴的威力”
  rationale: 希伯来文本没有明说先行词；保留含混可避免将一种可能解释写入正文。
translation_notes:
  register: 采用现代、庄重而具画面感的普通话。“咆哮”“雷鸣”保留诗歌的力度；“它们”的指向和连词的时间／原因两义通过正文与脚注共同保存。
