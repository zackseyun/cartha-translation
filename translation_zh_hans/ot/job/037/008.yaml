  yaml_path: translation/ot/job/037/008.yaml
  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: zh_hans
  text: 野兽便进入藏身处[a]，在自己的洞穴中栖息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“野兽便进入潜伏之处，在自己的居所中停留。”
    reason: אָרֶב可指潜伏之处，מְעוֹנוֹת也可较宽泛地理解为居所；此译保留这些词较直译的表达。
lexical_decisions:
- source_word: וַתָּבֹא
  choice: 便进入
  rationale: 该词是בוא的Qal连续式，推进诗歌中的景象。“便进入”自然表达前文天气变化所引出的行动，同时保留生动的现在时描述感。
- source_word: חַיָּה
  choice: 野兽
  rationale: חַיָּה在此泛指野生动物，并非某一特定物种。“野兽”简洁自然，也保留其非驯养动物的含义。
- source_word: בְמוֹ אָרֶב
  choice: 进入藏身处
  rationale: אָרֶב可指潜伏、埋伏或隐藏的地方；在动物躲避恶劣天气的语境中，“藏身处”既具体又符合现代汉语表达，同时不把它限定为某一种兽穴。
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: 在自己的洞穴中
  rationale: מְעוֹנוֹת指居所、栖息之处，在动物语境中可自然译为“洞穴”。第三人称阴性单数后缀与语法上阴性的חַיָּה呼应，汉语用“自己的”表达所属关系。
- source_word: תִשְׁכֹּן
  choice: 栖息
  rationale: שכן表示居住、停留。在此描述野兽进入庇护处后留在那里，“栖息”符合动物语境，也兼顾居留和停驻之意。
