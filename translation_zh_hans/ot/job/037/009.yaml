base_translation:
  language: en
  yaml_path: translation/ot/job/037/009.yaml
  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: zh_hans
  text: 暴风从密室而来[a]，严寒从驱散之风而来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“暴风从南方而来。”希伯来文直译为“从密室”，可能以诗意方式指向南方一带，或隐秘的储藏之所。
    reason: alternative_reading
  - marker: b
    text: 或译：“严寒从北方而来”，也可译：“严寒从四散的风而来。”此处的希伯来词十分罕见，确切含义不能确定。
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: 从密室
  rationale: חֶדֶר本义为房间、内室或密室。此处可能诗意地指暴风隐秘的出处或某一方位；正文保留具体意象，不直接解释为“南方”。
- source_word: תָּבוֹא
  choice: 而来
  rationale: בוא通常表示来、进入或到达；这里以“而来”自然呈现两个诗行中气象现象的出现。
- source_word: סוּפָה
  choice: 暴风
  rationale: סוּפָה指猛烈的风暴、狂风或旋风。“暴风”既保留强烈程度，又不把意义收窄为特定形态的旋风。
- source_word: וּמִמְּזָרִים
  choice: 从驱散之风
  rationale: מְזָרִים是罕见且含义有争议的词，可能与驱散、吹散有关，也有人按语境理解为北方。正文采用较贴近这一可能词源的表达，并以脚注保留方向性译法及不确定性。
- source_word: קָרָה
  choice: 严寒
  rationale: קָרָה表示寒冷、严寒或霜冻天气。“严寒”在现代汉语中简洁自然，也与前半句的“暴风”相称，而不像“霜”那样过于具体。
theological_decisions: []
translation_notes:
  register: 采用自然、凝练而庄重的现代标准汉语，保留原文两分句的平行结构。“密室”和“驱散之风”保留希伯来诗歌的陌生意象及词义张力，方向性解释置于脚注。
