base_translation:
  language: en
  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: zh_hans
  text: 它在他的引导下不断回旋[a][b]，为要执行他在大地上、遍及人居的世界所吩咐它们的一切[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一圈又一圈地转动”或“转来转去”；原文强调反复回旋、转向。
    reason: lexical_alternative
  - marker: b
    text: “引导”也可译作“调度”“指引”或“掌舵”；原词含有巧妙引领和控制的意味。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近似“在人居的世界，朝向大地（或地上）”；末词带方向词尾，以层叠的表达强调地上的人居世界。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 它
  rationale: 阳性单数代词在上下文中回指云团或风暴现象；中文用中性的“它”可保留所指范围，不把它限定为某一种气象现象。
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: 回旋转动
  rationale: 合并表达环绕、反复转向的动态意象；既保留循环运动，也不额外暗示猛烈旋转。
- source_word: בְּתַחְבֻּלֹתוֹ
  choice: 在他的引导下
  rationale: 此词可指巧妙的引领、操控或调度；“引导”自然地表达神对气象现象的支配，又不过度技术化。
- source_word: לְפָעֳלָם
  choice: 为要……成就
  rationale: 按目的结构理解，表达这些受命的气象力量执行所吩咐之事。
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: 他吩咐它们的一切
  rationale: 保留“吩咐”的常见义及复数宾语“它们”；单数主语“它”与复数宾语之间的张力也照原文保留。
- source_word: עַל־פְּנֵי תֵבֵל אָרְצָה
  choice: 在大地上、遍及人居的世界
  rationale: “遍及”传达 עַל־פְּנֵי 的空间范围，“人居的世界”体现 תֵבֵל；“在大地上”反映带方向词尾的 אָרְצָה，同时以自然中文呈现层叠地理表达。
theological_decisions:
- issue: 单数代词及复数宾语所指的气象现象
  choice: 用“它”泛指前文中的云团或风暴现象，用“它们”保留命令对象的复数形式
  alternative: 将单数明确译为“云”，或把复数统一改成单数
  rationale: 上下文涉及云、闪电和风暴活动，原文没有把单数所指精确限定为某一种现象；同时，单复数转换是原文真实特点，不宜在译文中暗自消除。
- issue: 神对气象现象的支配方式
  choice: 译为“在他的引导下”
  alternative: “按他的谋略”或“由他操纵”
  rationale: “引导”保留智慧调度与主权掌管的含义，却不引入机械操控或特定教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回旋转动”保留诗歌的动态感；“在大地上、遍及人居的世界”有意保留希伯来语地理表达的层叠性。脚注依正文出现顺序排列。
