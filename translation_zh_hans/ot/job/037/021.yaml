base_translation:
  language: en
  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
translation:
  language: zh_hans
  text: 现在，人们看不见那光[a]；它虽在云天中明亮，但一阵风吹过，使云天澄澈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“现在，人们看不见那在云天中明亮的光。”希伯来文语序简练，不一定含有“虽”的让步意味。
    reason: alternative_reading
  - marker: b
    text: “使云天澄澈”：原文宾语代词为复数，可能指云天或云层；也可较概括地理解为“使天空澄澈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既标明当前情景，也自然承接上文；汉语无需生硬直译连接词 ו。
- source_word: לֹא רָאוּ
  choice: 人们看不见
  rationale: 第三人称复数主语未明确指出，汉语用泛指“人们”；完成式在此按当前观察或一般状态表达。
- source_word: אוֹר
  choice: 那光
  rationale: 保留“光”的宽泛含义，不把它限定为“阳光”；“那”使汉语指称自然。
- source_word: בָּהִיר הוּא
  choice: 尽管它……明亮照耀
  rationale: 将形容词 בָּהִיר 表达为自然的汉语谓语，并以让步关系呈现光虽明亮却不可见的张力；脚注保留非让步读法。
- source_word: בַּשְּׁחָקִים
  choice: 在云天之上
  rationale: שְׁחָקִים 可指高空、云层或天空；“云天”兼顾其诗意和气象语境，避免过度限定为单纯的云或诸天。
- source_word: וְרוּחַ
  choice: 但一阵风
  rationale: רוּחַ 在此为气象意义的风；“一阵”符合未特指形式，“但”体现前后景象的转折。
- source_word: עָבְרָה
  choice: 吹过
  rationale: 在风的语境中，“吹过”比机械的“经过”更自然，同时保留其掠过天空的动态。
- source_word: וַתְּטַהֲרֵם
  choice: 就使云天澄澈
  rationale: טהר 在气象语境中指使之洁净、清明；明确复指前面的“云天”，比含混的“使它们洁净”更符合现代汉语，同时在脚注说明原文复数宾语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而有诗意的普通话。“云天”“澄澈”保留诗歌色彩，但整句仍便于普通读者理解；分号呈现先不可见、后经风而清明的景象转换。
