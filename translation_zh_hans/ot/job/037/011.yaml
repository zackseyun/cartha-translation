  text: אַף בְּ֭/רִי יַטְרִ֣יחַ עָ֑ב יָ֝פִ֗יץ עֲנַ֣ן אוֹרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/011.yaml
  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
translation:
  language: zh_hans
  text: 他也使密云满载水气[a]，使他那发光的云[b]四散。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水气”所译的希伯来语词含义不确定；也可译作“雨水”或“水分”，另有人将它理解为“明亮”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“他之光的云”；在风暴的语境中，也可理解为“带着他闪电的云”或“他的闪电云”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 也
  rationale: 此处承接上下文，增添一项关于上帝掌管天气的描述；“也”自然传达其附加、略带强调的语气。
- source_word: בְּרִי
  choice: 水气
  rationale: 此词含义不确定，可能与水分、雨水有关，也有人联系到明亮、晴朗。在密云和负载的语境中，“水气”最符合气象图景，同时以脚注保留不确定性。
- source_word: יַטְרִיחַ
  choice: 使……满载
  rationale: טרח 的使役式可表示使某物承受重负；用“使……满载”既保留负重意象，也符合云中充满水分的自然表达。
- source_word: עָב
  choice: 密云
  rationale: עָב 指浓密、厚重的云；“密云”简洁而准确。
- source_word: יָפִיץ
  choice: 使……四散
  rationale: פוץ 的使役式表示驱散、散布；“使……四散”保留使役意义和动态画面。
- source_word: עֲנַן אוֹרוֹ
  choice: 他那发光的云
  rationale: 原文近似“他之光的云”，关系含混。“发光的云”在现代汉语中较自然，并较少预先断定“光”必指闪电；脚注说明直译及风暴语境下的另一理解。
theological_decisions: []
