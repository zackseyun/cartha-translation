  text: At this also my heart trembles and leaps from its place[a][b].
translation:
  language: zh_hans
  text: 这事也使我的心颤抖[a]，跳离原处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “颤抖”也可译作“震颤”；希伯来语动词可表示因恐惧、敬畏或激动而发抖。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“从原处跳起”；希伯来语生动地描绘心仿佛突然离开了原来的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  choice: 因此……也
  rationale: אַף带有加强或连接作用，לְזֹאת指向前文所述的现象；合译为“因此……也”，既承接上文，又自然表达以利户对此产生的反应。
- source_word: יֶחֱרַד
  choice: 颤抖
  rationale: חרד可指因恐惧、敬畏或激动而发抖；“颤抖”保留其宽泛的情感力度，不限定为单纯的恐惧。
- source_word: לִבִּי
  choice: 我的心
  rationale: 按希伯来文保留“心”的身体意象，同时可让读者理解为人的内在情感与意志。
- source_word: וְיִתַּר
  choice: 跳动
  rationale: 此处יתר词义较难确定，但与“从原处”连用，描绘心突然剧烈跃动；“跳动”在现代汉语中自然，并保留生动的身体意象。
- source_word: מִמְּקוֹמוֹ
  choice: 从原处
  rationale: 物主后缀回指“我的心”；“从原处”简洁地保留心仿佛被震离正常位置的图景。
