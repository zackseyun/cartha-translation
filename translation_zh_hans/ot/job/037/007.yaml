  text: בְּ/יַד כָּל אָדָ֥ם יַחְתּ֑וֹם לָ֝/דַ֗עַת כָּל אַנְשֵׁ֥י מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: zh_hans
  text: 他封住每个人的手[a][b]，使人人都知道他的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他封上每个人的手。”希伯来语这一表达很可能是说，上帝使人停止日常劳作。
    reason: lexical_alternative
  - marker: b
    text: “每个人”和“人人”所对应的希伯来语都是泛指人类，并非仅指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: 每个人的手
  rationale: 介词 בְּ 与“手”连用，依此处困难的封印意象自然译为动词“封住”的宾语；不强行补出原文未明说的劳动。
- source_word: כָּל אָדָם
  choice: 每个人
  rationale: אָדָם 是泛指单数，指所有人；现代汉语用“每个人”准确、自然，也不造成仅指男性的误解。
- source_word: יַחְתּוֹם
  choice: 封住
  rationale: חתם 的基本义是“封、盖印”。“封住”既保留原文比喻，也能传达使手停止活动的语境含义，但不把该含义直接改写为“停止劳作”。
- source_word: לָדַעַת
  choice: 使……都知道
  rationale: 带 ל 的不定式可表示目的或结果；“使……知道”保留两者之间一定程度的开放性，行文也自然。
- source_word: כָּל אַנְשֵׁי
  choice: 人人
  rationale: 该短语泛指所有人；“人人”简洁地对应前面的“每个人”，保留平行关系。
- source_word: מַעֲשֵׂהוּ
  choice: 他的作为
  rationale: מַעֲשֶׂה 可指工作、行为或所做之事；在上帝掌管天气的语境中，“作为”比“工作”更自然，同时保留单数集合意义。
theological_decisions:
- issue: “他封住”之主语及“他的作为”中代词的所指
  choice: 均指上帝
  alternative: 将天气、风暴或非人称力量视为施事者
  rationale: 以利户此段持续讲述上帝对风雪等自然现象的掌管，因此上帝是最连贯的先行所指；不过译文仍沿用代词，不额外把“他”明译为“上帝”。
- issue: 封住人的手所表达的具体效果
  choice: 正文保留“封住……手”的意象，脚注说明可能指停止日常劳作
  alternative: 正文直接译作“使每个人停下工作”
  rationale: 原文确实使用“封”与“手”的表达，其确切习语意义有难度；保留意象可避免把一种很可能的解释写成唯一含义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“封住……手”刻意保留原文不寻常的意象；两个脚注标记均置于相关短语之后，并按正文出现次序排列。
