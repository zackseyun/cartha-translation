  yaml_path: translation/ot/job/037/010.yaml
  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: zh_hans
  text: 神的气息带来冰[a]；广阔的水面凝结成坚冰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“冰出于神的气息。”希伯来语介词既可表示来源（“出于”），也可表示方式（“借着”）。
    reason: lexical_alternative
  - marker: b
    text: 或译：“水域的宽阔处凝固变硬。”希伯来语表达富有诗意，可指宽广的水面凝固成冰。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: 神的气息带来
  rationale: נִשְׁמָה意为“气息”；前缀מִן既可表示来源，也可表示凭借的方式。正文用“带来”自然涵盖冰由神的气息而来的意象，脚注保留“借着”的可能。
- source_word: אֵל
  choice: 神
  rationale: אֵל在此是常用的神圣称号，直译为“神”，无须扩展为“全能的神”。
- source_word: יִתֶּן קָרַח
  choice: 带来冰冻
  rationale: יִתֶּן字面为“赐下／产生”，קָרַח指冰。中文“带来冰冻”保留神圣施事和气象图景，又比“冰被赐下”自然。
- source_word: וְרֹחַב מַיִם
  choice: 辽阔的水面
  rationale: רֹחַב表示宽广、宽阔处；与מַיִם连用时可指广阔展开的水域或水面。“辽阔的水面”符合现代汉语诗体表达，同时避免把它仅理解为抽象的宽度。
- source_word: בְּמוּצָק
  choice: 凝结坚硬
  rationale: מוּצָק与浇铸、坚实或硬化有关；在冰冻语境中指水凝固变硬。“凝结坚硬”既说明结果，也保留原词“坚实”的形象。
