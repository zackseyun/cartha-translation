base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: zh_hans
  text: 你知道上帝怎样把这些加在它们之上[a]，又怎样使他云的光照耀吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝何时将这些置于它们之上”，或“上帝怎样安排这些事”。希伯来文表达简洁，“加上／安置”的对象没有明说；译文的“这些”用以暂代这一隐含对象，“它们”所指的事物也须按上下文理解。
    reason: alternative_reading
  - marker: b
    text: 或译：“又怎样使他云的亮光闪耀。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: 你知道吗
  rationale: ידע的Qal未完成式第二人称阳性单数在此引出对约伯的反问；置于句末符合现代汉语问句的自然语序。
- source_word: בְּשׂוּם
  choice: 怎样……作安排
  rationale: 介词בְּ加שׂוּם的不定词结构可表达“当……安置时”或“怎样安置”。原文没有明说所安置的对象，因此用“作安排”保持表达可读，同时不擅自补出闪电、命令等具体对象。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的“上帝”单数诗体称谓，语境没有理由扩译为其他神圣称号。
- source_word: עֲלֵיהֶם
  choice: 在它们之上
  rationale: 介词עַל及第三人称阳性复数后缀直译为“在它们之上”；其所指须由上下文判断，译文不将其限定为云或某种天气现象。
- source_word: וְהוֹפִיעַ
  choice: 又……使……发出亮光
  rationale: יפע的Hiphil形式表示使光辉显现或照耀；“使……发出亮光”既体现使役意义，也符合现代汉语。
- source_word: אוֹר
  choice: 亮光
  rationale: אוֹר可指“光”或“亮光”；此处与云相连，“亮光”能自然表达云中显出的光辉。
- source_word: עֲנָנוֹ
  choice: 他的云
  rationale: 原文是单数名词加第三人称阳性单数后缀，故保留单数，不解释性地译作“乌云”或复数“云彩”。
theological_decisions:
- issue: 上帝所安置的对象以及“它们”的指代均未明说
  choice: 用“在它们之上作安排”保留对象和指代的含蓄性
  alternative: 译作“把命令加在云上”“把这些事安置在它们之上”或“安排这些云”
  rationale: 希伯来文在שׂוּם之后没有明示宾语，而עֲלֵיהֶם的先行词也依赖上下文。译文避免把经文限定为某一种气象机制或特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的问句；以句末“你知道吗”自然呈现原文反问。保留“他的云”的单数形式，并用脚注说明关键句法与词义的其他可能译法。
