  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: zh_hans
  text: 金光从北方而来；在上帝那里，有可畏的威严。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直译介词与方位名词，保留来源方向。
- source_word: זָהָב
  choice: 金色的光辉
  rationale: 该词通常指“金子”，但在此与“而来”连用，语境可能指金色光辉或金辉；正文采用自然且符合异象性语境的表达，同时不具体化为某种气象现象。
- source_word: יֶאֱתֶה
  choice: 而来
  rationale: 表达动词“来到、来临”的未完成式意义。
- source_word: עַל אֱלוֹהַּ
  choice: 上帝周围
  rationale: 介词 עַל 的核心义为“在……之上/临到……”，此处描述威荣与上帝的关系；依语境译作“周围”较自然，但不把威荣说成上帝以外的独立事物。
- source_word: נוֹרָא הוֹד
  choice: 可畏的威荣
  rationale: נוֹרָא 表示令人敬畏、可畏；הוֹד 表示尊荣、威严、荣美。“威荣”兼顾威严与荣耀。
theological_decisions:
- issue: “可畏的威荣”与上帝的关系
  choice: 上帝周围有可畏的威荣
  alternative: 上帝身上有可畏的威荣／上帝有可畏的威严
  rationale: 保留介词短语的空间性意象，并避免将原文压缩为单纯的属性陈述。
- issue: זָהָב 是否指字面的金子
  choice: 金色的光辉
  alternative: 金子／黄金般的光辉
  rationale: 原文简略且具有诗意；结合上下文天象描写，采用“金色的光辉”，但不进一步认定它就是极光、晴光或某一特定自然现象。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留希伯来诗句的两分结构和意象，不添加原文未明说的气象解释。
