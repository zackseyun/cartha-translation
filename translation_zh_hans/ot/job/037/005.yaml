base_translation:
  language: en
  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: zh_hans
  text: 上帝以自己的声音奇妙地发雷声[a]；他行伟大的事，是我们所不知道的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较字面的理解译：“上帝以自己的声音发出奇事。”原文“奇事”是复数形式，也可能在这里作副词性用法，表示“奇妙地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他行超乎我们认识的伟大之事”，或“他行我们无法理解的伟大之事”。
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: 发出雷鸣
  rationale: 该词是רעם的使役式，在风暴语境中表示发雷声或打雷；“发出雷鸣”既自然，也保留上帝以声音施行这一动作的意象。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是通常的神称，指上帝，不必扩展为“全能的上帝”等更强称号。
- source_word: בְּקוֹלוֹ
  choice: 以他的声音
  rationale: 介词ב在此可表凭借或方式；“以他的声音”保留了声音作为发出雷鸣之媒介的含义。
- source_word: נִפְלָאוֹת
  choice: 奇妙地
  rationale: 该词在形式上是复数名词“奇事”，但在本句中很可能修饰“发出雷鸣”，表达方式或性质；译作“奇妙地”符合现代汉语，同时以脚注保留更直译的可能。
- source_word: עֹשֶׂה
  choice: 行
  rationale: עשה语义宽泛，可指做、行或成就；与“伟大的事”搭配时，“行”庄重而自然。
- source_word: גְדֹלוֹת
  choice: 伟大的事
  rationale: 阴性复数形容词在此作名词使用，指“伟大的事”；此译法保持原文宽泛含义，不限于神迹或某类作为。
- source_word: וְלֹא נֵדָע
  choice: 是我们所不知道的
  rationale: 原文直译为“而我们不知道”。将其作为关系分句连接“伟大的事”，在汉语中清楚自然，也没有把ידע强化为“无法理解”。
theological_decisions:
- issue: 末句所表达的人类无知范围
  choice: 是我们所不知道的
  alternative: 超乎我们的认识／是我们无法理解的
  rationale: ידע的基本意义是“知道”。上下文虽强调人在上帝大能面前的有限，正文仍不应把“不知道”强化为绝对的“无法理解”，以保留原文的开放性。
- issue: נִפְלָאוֹת与动词的句法关系
  choice: 视为副词性用法：“奇妙地发出雷鸣”
  alternative: 视为动词的内容：“发出奇事般的雷鸣”或较直译的“雷鸣出奇事”
  rationale: 复数形式字面可指“奇事”，但在此更可能表示发雷鸣的奇妙方式。正文采用自然汉语，脚注注明形式上更直译的可能，以保留句法歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“发出雷鸣”延续风暴意象；“行伟大的事”保持诗歌的概括性。脚注标记按正文出现次序排列为[a]、[b]。
