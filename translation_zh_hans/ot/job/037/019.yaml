base_translation:
  language: en
  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: zh_hans
  text: 请告诉我们该对他说什么；因着黑暗[b]，我们无法把话安排妥当[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把话安排妥当”也可译作“把话排列好”或“把申诉陈列出来”。
    reason: lexical_alternative
  - marker: b
    text: “黑暗”可能比喻人的无知或无能，也可能具有较为字面的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: 请告诉我们
  rationale: 该词是ידע的使役式祈使语气，意为“使我们知道”。“请告诉我们”在现代汉语中自然地表达请求指教之意，同时保留其使役含义。
- source_word: מַה נֹּאמַר לוֹ
  choice: 该对他说什么
  rationale: 此分句作祈使动词的宾语；“该……什么”自然表达希伯来语在此处关于应当说什么的商议意味。
- source_word: לֹא נַעֲרֹךְ
  choice: 我们无法把话陈明
  rationale: ערך的基本意思是“排列、摆列、安排”。上下文涉及人在上帝面前组织言辞，“把话陈明”兼顾排列言语与陈述论辩的可能含义，又不明确增添原文没有的“案件”。
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: 因着黑暗
  rationale: מִפְּנֵי在此最自然地表示原因，即“因为、由于”；保留“黑暗”这一凝练意象，不限定它是无知、能力不足还是实际的幽暗。
theological_decisions:
- issue: 末句“黑暗”的含义
  choice: 保留“黑暗”，不具体解释
  alternative: 译作“因我们无知”或“因为天黑”
  rationale: 原文的诗性表达可指人的无知或无能，也可能具有较为字面的含义；直译其意象可保留这种真实的歧义。
- issue: נַעֲרֹךְ是否具有法庭意味
  choice: 译为“把话陈明”
  alternative: 译为“陈明案件”或“把话排列好”
  rationale: 动词既可表示安排，也可在论辩语境中表示陈列言辞或提出申诉。“把话陈明”保留修辞及司法语境的可能性，而不把司法含义定死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请告诉我们”符合直接请求的语气；“把话陈明”略带庄重色彩，适合诗体论辩语境。脚注标记均置于相关正文之后。
