base_translation:
  language: en
  yaml_path: translation/ot/job/017/001.yaml
  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
translation:
  language: zh_hans
  text: 我的灵已破碎[a]；我的年日已熄灭[b]；坟墓在等着我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的气息已受损。”希伯来语“灵”也可指“气息”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的年日已被熄灭。”原文动词含有火焰熄灭的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: 我的灵
  rationale: רוּחַ可指“灵”或“气息”。此处“我的灵”自然表达约伯内在生命遭受摧残，同时以脚注保留“气息”这一关乎生命衰竭的可能含义。
- source_word: חֻבָּלָה
  choice: 已破碎
  rationale: 该被动形式表示受到破坏、毁坏；“已破碎”符合哀歌语气，也不把受损的具体方式解释得过细。
- source_word: יָמַי
  choice: 我的年日
  rationale: 直译其复数所有格，指约伯所余的生命岁月；“年日”在现代中文中庄重而易懂。
- source_word: נִזְעָכוּ
  choice: 已熄灭
  rationale: 保留动词所含的熄灭、止息意象，使生命如灯火熄灭的比喻仍然可感。
- source_word: קְבָרִים
  choice: 坟墓
  rationale: 保留希伯来文复数的形式与强化效果，不将其直接化为抽象或集合性的单数“死亡”。
- source_word: לִי
  choice: 正等着我
  rationale: לִי字面为“给我／属于我”；结合语境，译为“正等着我”自然表达坟墓就在前面的迫近感，但不改变其基本指向。
theological_decisions:
- issue: רוּחִי所指的是内在之灵还是生命气息
  choice: 正文译作“我的灵”
  alternative: “我的气息”
  rationale: 上下文容许心理与生理两层意义；正文采用自然表达内在生命受创的“灵”，脚注保留“气息”，不排除生命将尽的含义。
- issue: 复数קְבָרִים的理解
  choice: 保留为“坟墓”
  alternative: 集合性地译作“坟墓／阴宅”或意译为“死亡”
  rationale: 原文使用复数，可能有强化作用；保留具体意象可避免将其神学化或抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。三个分句保持原文紧凑的并列节奏；“破碎—熄灭—坟墓”逐步加强死亡迫近之感。脚注标记均已置于正文相应词句之后。
