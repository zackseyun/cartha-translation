base_translation:
  language: en
  yaml_path: translation/ot/job/017/013.yaml
  text: If I hope for Sheol as my house[a], if I spread my bed in the darkness,
translation:
  language: zh_hans
  text: 我若盼望阴间[a]成为我的家，在黑暗中铺好我的床榻，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是“示奥勒”，指死者之地，含义不只限于坟墓；也可译作“坟墓”或“死者之境”。
    reason: 说明希伯来词的语义范围，并保留可行的词汇译法。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 保留希伯来文的条件或假设语气，不把约伯对死亡的设想改成确定的时间陈述。
- source_word: אֲקַוֶּה
  choice: 盼望
  rationale: 该动词表达带着期待的等候；“盼望”保留其情感张力，即使这里所盼望的竟是阴间。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: “阴间”是现代中文中较自然且庄重的对应语，所指为死者所在之处，不仅是具体坟墓；脚注保留希伯来词及其他译法，以免把概念缩窄。
- source_word: בֵּיתִי
  choice: 作我的家
  rationale: 希伯来文是“阴间”与“我的家”的无动词并置；加入“作”可自然表达阴间成为约伯居所的关系。
- source_word: בַּחֹשֶׁךְ
  choice: 在黑暗中
  rationale: 直接保留介词短语及阴间与死亡相关的幽暗意象。
- source_word: רִפַּדְתִּי
  choice: 铺好
  rationale: 该动词指铺设或整理躺卧之处；“铺好”在现代中文中自然，并呈现预备安歇之所的具体动作。
- source_word: יְצוּעָי
  choice: 我的床榻
  rationale: 原词指供人躺卧的地方；“床榻”兼具清楚、庄重和诗歌语体，也保留死亡如安歇的意象。
theological_decisions:
- issue: 是否对 שְׁאוֹל 作狭义或教义化解释
  choice: 译作“阴间”，并用脚注说明其概念范围
  alternative: 坟墓；死者之境；音译“示奥勒”
  rationale: 本节涉及约伯把死者所在之处视作自己的家。“阴间”不把它缩减为墓穴，也不导入后期发展出的特定终末论含义；脚注说明原词，保留其语义幅度与神学张力。
- issue: 条件句的范围
  choice: 仅在句首用“若”，让其自然统摄后续平行意象
  alternative: 在“在黑暗中”前补出第二个“若”
  rationale: 希伯来文本只明确出现一次 אִם。中文句法可让句首的“若”统摄“盼望阴间作家”和“在黑暗中铺床”两个相连意象，因此无需增添原文没有的第二个条件词。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“家”与“床榻”保留原文把死亡之境描写为居所和安歇处的平行意象；句末逗号反映本节思想延续至下文。
