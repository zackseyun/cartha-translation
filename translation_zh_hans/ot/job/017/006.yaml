  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
translation:
  language: zh_hans
  text: 他使我成为万民中的笑柄[a]；我成了人当面吐唾沫羞辱的对象[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使我成为万民中的谈资。”原文所用的词可能指一个被当作俗语或譬喻来讥嘲的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于：“我成了在众人面前的吐唾沫。”意思是约伯成了人公开、当面吐唾沫羞辱的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: 他使我成为
  rationale: 使役形式表示“使我处于、成为”某种公开可见的境地；结合后面的谓语，用“使我成为”自然且准确。
- source_word: לִמְשֹׁל
  choice: 笑柄
  rationale: 此处不是中性的“箴言”，而是指约伯成了被人传说、讥嘲的对象；“笑柄”在现代汉语中能传达这种公开羞辱的意味。
- source_word: עַמִּים
  choice: 万民中
  rationale: 保留原文复数“众民、各族之民”的广泛范围；“万民中”简洁自然，并未将其压缩为单数的“人”。
- source_word: וְתֹפֶת
  choice: 唾弃的对象
  rationale: 该词很可能与吐唾沫有关，表示受人吐唾沫羞辱的人或对象；译文保留具体的羞辱意象，而不只概括为“耻辱”。
- source_word: לְפָנִים
  choice: 当面
  rationale: 原文直译近于“在面前／向着脸面”，表达公开、面对面的蔑视；“当面”符合现代汉语习惯。
- source_word: אֶהְיֶה
  choice: 我成了
  rationale: 虽为未完成式，在诗歌语境中可表示已经形成并持续至今的状态；“我成了”与前句“使我成为”相呼应。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“笑柄”清楚表达带有俗语化、公开讥嘲的含义；“当面唾弃的对象”保留吐唾沫这一具体羞辱意象。两个脚注标记均置于正文对应词语之后。
