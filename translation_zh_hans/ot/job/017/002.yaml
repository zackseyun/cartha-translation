  text: אִם לֹ֣א הֲ֭תֻלִים עִמָּדִ֑/י וּ֝/בְ/הַמְּרוֹתָ֗/ם תָּלַ֥ן עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/002.yaml
  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
translation:
  language: zh_hans
  text: 诚然，嘲弄者与我同在；我的眼目停留在他们的挑衅上。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欺骗者与我同在。”这个希伯来词可指嘲弄、讥讽者，也可能指欺骗者。
    reason: lexical_alternative
  - marker: b
    text: “他们的挑衅”所译的希伯来文含义较难确定；也可指他们的悖逆、苦毒或争竞的行为。“停留”所译的动词本义是留宿、过夜，用于“眼目”是持续凝视的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: 不……吗
  rationale: 此处不是普通条件句，而是带有强烈肯定意味的反问式断言；结合后半句并保留希伯来文句法张力，译作“不……吗”自然且有强调作用。
- source_word: הֲתֻלִים
  choice: 讥讽我的人
  rationale: 该词可指嘲弄、讥讽者，也可能带有欺骗之意；上下文涉及同伴敌意的言语，因此正文采用“讥讽我的人”。
- source_word: עִמָּדִי
  choice: 在我身边
  rationale: 表达这些人正与约伯同处、围绕着他；“在我身边”比“与我同在”更自然，也避免正面属灵意味。
- source_word: וּבְהַמְּרוֹתָם
  choice: 面对他们的挑衅
  rationale: 相关词根可表达违抗、激怒、苦毒或争竞；此处选择“挑衅”，贴合约伯所面对的敌对言行，同时不把它限定为对上帝的悖逆。
- source_word: תָּלַן
  choice: 整夜面对
  rationale: 动词本义是住宿、过夜；用于“我的眼目”时形成鲜明隐喻，表示目光持续停留。译文用“整夜”保存其过夜意象，用“面对”使现代汉语通顺。
- source_word: עֵינִי
  choice: 我的眼目
  rationale: 原文为单数。“眼目”在庄重现代汉语中能保留单数意象，并可自然表示持续注视。
theological_decisions:
- issue: וּבְהַמְּרוֹתָם 所指行为的性质
  choice: 他们的挑衅
  alternative: 他们的悖逆／他们的苦毒
  rationale: 原文表达困难，可指激怒人的行为、违抗或苦毒。正文不将其特定解释为针对上帝的悖逆，以免导入原文未明确限定的神学判断；脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以两个反问句传达 אִם לֹא 的强调语气，并保留“眼目过夜”的诗性意象；对 הֲתֻלִים 和 הַמְּרוֹתָם 的词义不确定性通过脚注说明。
