  text: וְֽ/אוּלָ֗ם כֻּלָּ֣/ם תָּ֭שֻׁבוּ וּ/בֹ֣אוּ נָ֑א וְ/לֹֽא אֶמְצָ֖א בָ/כֶ֣ם חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: zh_hans
  text: 然而，你们都回来吧，来吧！我在你们中间找不到一个智慧人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回来吧，来吧”也可译作“回转吧，来吧”。希伯来文是有力的召唤；按语境，约伯很可能是在挑战同伴再次提出他们的论点。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: 然而
  rationale: 表示强烈的转折；“然而”庄重自然，并保留与上文的对比。
- source_word: כֻּלָּם
  choice: 你们都
  rationale: 后续动词为第二人称阳性复数，表明约伯直接对所有同伴说话。
- source_word: תָּשֻׁבוּ
  choice: 回来吧
  rationale: שׁוב在此具有命令或呼召的语气；结合语境，是挑战同伴回来再作辩论。
- source_word: וּבֹאוּ נָא
  choice: 来吧
  rationale: בוא与语气词נָא构成催促性的召唤；“来吧”保留力度，又不误译为客气请求。
- source_word: וְלֹא אֶמְצָא
  choice: 我……找不到
  rationale: 未完成式在召唤之后可表达预期结果；中文现在式形式也自然涵盖“即便再来，仍找不到”的意思，而不额外加入能力含义。
- source_word: בָכֶם
  choice: 在你们中间
  rationale: 介词ב在此指群体之中，译为“在你们中间”符合现代汉语。
- source_word: חָכָם
  choice: 一个智慧人
  rationale: 阳性单数形容词在此作名词使用，所指对象是约伯的男性同伴；“智慧人”较“聪明人”更准确表达智慧文学语境中的חכם。
theological_decisions:
- issue: חָכָם的性别与单数形式
  choice: 一个智慧人
  alternative: 一个有智慧的人／任何有智慧的人
  rationale: 原文为阳性单数，直接对象也是约伯的男性同伴；保留单数与人物语境，同时中文“智慧人”不必额外强化生理性别。
- issue: 召唤语句的语用力度
  choice: 你们都回来吧，来吧！
  alternative: 你们都回转、来吧／请你们都回来
  rationale: 原文两个动词连用并有נָא加强语气，既像召唤又带挑战意味；避免译成过分礼貌的请求，也不把具体的“再来辩论”直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回来吧，来吧”保留原文两个近接命令的重复和修辞力度；用感叹号体现催促，但不在正文中明说“再辩论”，以免消除原文的语用含混。脚注标记置于整节末尾，对应召唤语句。
