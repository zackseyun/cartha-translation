base_translation:
  language: en
  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: zh_hans
  text: 求你为我作保，就由你自己作保；谁还能与我击掌作保呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂימָה נָּא
  choice: 求你
  rationale: שִׂימָה是命令式，נָּא使语气成为恳求；现代汉语用“求你”自然传达这种迫切而谦请的语气。
- source_word: עָרְבֵנִי
  choice: 为我作保
  rationale: ערב在此属于担保、保证的法律语域，后缀表示为约伯作保；“作保”简洁、自然，并保留法律比喻。
- source_word: עִמָּךְ
  choice: 亲自
  rationale: 直译为“与你自己那里/同你自己”。语境中约伯请求上帝本人提供并承接担保；“亲自”在汉语中自然凸显这一反身张力，但不进一步解释其机制。
- source_word: מִי הוּא
  choice: 不然，谁
  rationale: 原文是修辞问句“他是谁？”，意指找不到另一位担保者；“不然，谁”自然呈现前后对照，同时保留反问。
- source_word: לְיָדִי יִתָּקֵעַ
  choice: 肯与我击掌立约
  rationale: תקע与“手”连用，指以击掌确认担保或协议。“击掌立约”保留具体动作，并让现代读者明白其法律含义；“肯”表达未完成式在修辞问句中的意愿色彩。
theological_decisions:
- issue: 约伯向上帝提出法律性的担保请求
  choice: 译作“求你亲自为我作保”
  alternative: “求你为我把保证放在你那里”或“求你在你那里为我作保”
  rationale: עִמָּךְ使请求具有反常而强烈的张力：约伯似乎请求上帝亲自成为他的担保者。“亲自”保持这一张力，又不武断说明上帝如何同时处于协议的不同位置。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作保”“击掌立约”保留原文的法律意象；以“不然”连接两句，使修辞关系清楚，但不消除约伯请求上帝亲自担保所形成的神学张力。
