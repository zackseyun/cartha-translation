- from: 求你亲自为我作保[a]；不然，谁肯与我击掌立约[b]呢？
  to: 求你为我作保，就由你自己作保；谁还能与我击掌作保呢？
  rationale: 修订保留原文两层法律意象：上帝被请求为约伯提供担保，而担保又“与你自己”相关；随后问没有别人能与约伯以击掌方式作保。脚注 a 说明困难措辞，但不以特定神学体系界定其机制。
