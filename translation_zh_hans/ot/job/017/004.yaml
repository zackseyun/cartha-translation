  text: כִּֽי לִ֭בָּ/ם צָפַ֣נְתָּ מִּ/שָּׂ֑כֶל עַל כֵּ֝֗ן לֹ֣א תְרֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: zh_hans
  text: 因为你蒙蔽了他们的心[a]，使他们不能明白事理；所以你必不高举他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心”也可理解为“心思”或“内在的人”；希伯来语的“心”常指思想、判断和意志的所在，不仅指情感。
    reason: lexical_alternative
  - marker: b
    text: “高举他们”也可译作“抬举他们”或“让他们得胜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出后句结论的理由；在本节的诗歌论证中，“因为”自然明确。
- source_word: לִבָּם
  choice: 他们的心
  rationale: 保留希伯来语“心”的意象；此处主要指人的思想、判断与意志所在，并非单指情感。
- source_word: צָפַנְתָּ מִשָּׂכֶל
  choice: 你使……远离悟性
  rationale: צפן 本义为隐藏、藏起，מִן 表示隔离或远离。直译“把他们的心从悟性中隐藏起来”在现代汉语中生硬，因此译成“使……远离悟性”，既表达神的直接作为，也保留隔绝于理解力的含义。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 自然表达前因后果，符合现代汉语诗体。
- source_word: לֹא תְרֹמֵם
  choice: 你必不高举他们
  rationale: רום 的使役形式表示使之升高或受尊荣；“高举”保留原文的垂直意象，也不把语义限定为得胜。
theological_decisions:
- issue: 复数代词“他们”所指何人
  choice: 保留“他们”，不在正文中具体指明
  alternative: 明确译作约伯的对手、朋友或他们的同党
  rationale: 第二人称动词表明约伯在对神说话，第三人称复数则指另一群人；本节本身没有明确界定其身份，故不作解释性增补。
- issue: 神使他们与悟性隔绝的表述
  choice: 保留神为直接行动者
  alternative: 弱化为“他们缺乏悟性”
  rationale: 原文动词为第二人称单数完成式，明确把行动归于神；译文不应消解这一神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留“心”和“高举”的希伯来诗歌意象，并以脚注说明其语义范围；分号呈现理由与结论之间的紧密关系。
