base_translation:
  language: en
  yaml_path: translation/ot/job/017/007.yaml
  text: My eye has grown dim from grief[b][a], and all my members are like a shadow.
translation:
  language: zh_hans
  text: 我的眼睛因愁苦而昏花[a]；我的肢体全都如同影子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因恼怒”“因烦忧”或“因悲伤”。原文这个词可指多种情绪上的激荡；这里按约伯哀诉受苦的语境译作“愁苦”。
    reason: lexical_alternative
  - marker: b
    text: “肢体”或译“形体”“身体各部分”或“躯体”。原文可能泛指约伯身体的各部分或整个形体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: 而昏花
  rationale: כהה表示变暗、衰弱；“昏花”自然地描述视力衰退，同时保留诗歌中的视觉意象。
- source_word: מִכַּעַשׂ
  choice: 因愁苦
  rationale: כַּעַשׂ可指恼怒、烦恼、悲愁等强烈的情绪激荡；本节处于约伯哀诉受苦的语境，“愁苦”最为贴切，同时在脚注保留其他可能。
- source_word: עֵינִי
  choice: 我的眼睛
  rationale: 原文为单数，指约伯的眼睛，也可借指视力；中文用单数“眼睛”既自然，也贴近原文。
- source_word: וִיצֻרַי
  choice: 我的肢体
  rationale: 此处复数名词的确切所指存在争议，可能指身体各部分、形体或躯体；“肢体”能与前句的“眼睛”形成身体意象上的对应，又保留集合性的表达。
- source_word: כַּצֵּל
  choice: 如同影子
  rationale: 直译并保留原文关于虚弱、消瘦和缺乏实质感的诗性比喻，不将其具体含义解释进正文。
- source_word: כֻּלָּם
  choice: 全都
  rationale: 对应阳性复数“它们全都”，在中文中自然地总括前面的“肢体”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“昏花”保留视力衰退的具体意象；分号呈现两句诗行的并列关系。“如同影子”不额外说明是消瘦、虚弱还是短暂无实，以保留原诗的含混和张力。
