  yaml_path: translation/ot/job/017/012.yaml
  text: They make night into day; they say, ‘Light is near,’ in the face of darkness.
translation:
  language: zh_hans
  text: 他们把黑夜变作白昼；面对黑暗，说：“光明近了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: 把……当作
  rationale: 该动词基本义为“放置、设定”，此处与“黑夜/白昼”构成认定或变换关系；“把黑夜当作白昼”既贴近原文，也符合现代汉语表达。
- source_word: אוֹר
  choice: 光明
  rationale: 保留与“黑暗”的直接对照；“光明”比单用“光”更自然地表达这里带有希望意味、却未明确解释的意象。
- source_word: קָרוֹב
  choice: 近了
  rationale: 保留原文简短而含混的谓语，可指光明临近，不进一步说明其时间或性质。
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: 在黑暗面前
  rationale: 较形式地保留介词短语及其不寻常意象，不将其确定解释为“尽管黑暗仍在”或“黑暗即将过去”。
theological_decisions:
- issue: “光明近了”是否应明确标为说话内容
  choice: 用引号呈现为他们所宣称的话
  alternative: 不加引号，译作“黑暗当前，光明已近”
  rationale: 希伯来文没有显式的“说”，但上下文及平行关系容许把“光明近了”理解为前述复数主体的宣称；加引号使现代汉语清楚，同时不把这宣称认定为真实应许。
- issue: 光明与黑暗的含义
  choice: 保留意象，不释为救恩、死亡、盼望或苦难
  alternative: 按上下文明确译出某一神学含义
  rationale: 本节用语具有诗性张力，原文并未明说意象所指，不宜加入宗派性或解释性限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式简洁，维持诗歌中的反常对照和“在黑暗面前”这一有意保留的含混表达。
