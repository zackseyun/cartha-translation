  text: יָשֹׁ֣מּוּ יְשָׁרִ֣ים עַל זֹ֑את וְ֝/נָקִ֗י עַל חָנֵ֥ף יִתְעֹרָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: zh_hans
  text: 正直人因这事惊骇；无辜的人奋起反对不敬虔的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“假冒为善的人。”希伯来语 חָנֵף 可指不敬虔、亵慢的人；在某些语境和传统译法中译作“假冒为善的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: 惊骇
  rationale: 该词在此表示因所见之事而震惊、骇异；“惊骇”既保留强烈的情感力度，也符合现代汉语表达。
- source_word: יְשָׁרִים
  choice: 正直人
  rationale: 复数形容词在此作名词使用，指品行正直的一类人；“正直人”简明自然。
- source_word: עַל זֹאת
  choice: 因这事
  rationale: 介词短语在此说明引发惊骇的缘由；“因这事”比直译“在这事之上”更符合汉语习惯。
- source_word: נָקִי
  choice: 无辜的人
  rationale: 指没有罪责、清白无辜的人；单数形式可作为类别性称谓保留。
- source_word: יִתְעֹרָר
  choice: 奋起
  rationale: 该反身性词形表达使自己振作、起来采取行动；“奋起”凝练地保留主动振作并行动的意味。
- source_word: עַל חָנֵף
  choice: 反对不敬虔的人
  rationale: 这里的 עַל 随“奋起”表示敌对或反对；חָנֵף 泛指不敬神、亵慢的人，不宜仅限于言行不一者。
theological_decisions:
- issue: חָנֵף 的译法
  choice: 不敬虔的人
  alternative: 假冒为善的人
  rationale: 本节把正直、无辜之人与不敬虔者相对照。“不敬虔的人”较完整地保留该词的伦理与宗教含义，避免把词义缩窄为虚伪或表里不一。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留两组彼此呼应的平行陈述；“正直人”与“无辜的人”维持原文的道德类别对照。脚注标记置于其实际说明的“不要敬虔的人”之后。
