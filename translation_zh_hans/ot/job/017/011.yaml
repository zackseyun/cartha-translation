  language: zh_hans
  text: 我的年日已经过去了；我的谋算和我心中所珍爱的，都被截断了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我心中所珍爱的”或译“我心中的所有物”、“我心中的产业”或“我心中承受之物”。这里的希伯来语表达罕见，含义难以确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: 我的年日
  rationale: 直译为“我的日子”；“我的年日”在现代汉语中自然、庄重，也保留以日子指人生时光的希伯来语表达。
- source_word: עָבְרוּ
  choice: 已经过去
  rationale: 该词为完成式，表示年日已经流逝；“已经过去”准确而自然。
- source_word: זִמֹּתַי
  choice: 我的谋算
  rationale: זִמָּה在此指计划、意图或筹划。“谋算”可涵盖内心筹划，又不必带有“阴谋”的负面含义。
- source_word: נִתְּקוּ
  choice: 都被截断
  rationale: נתק的尼法勒完成式表达被扯断、割断或断绝。“被截断”保留其强烈的断裂意象，并适合未能实现的谋算。
- source_word: מוֹרָשֵׁי
  choice: 珍爱的一切
  rationale: 这是本节最困难的词，词形可指所有物、产业或承受之物；结合“心”理解为内心所珍藏、所看重的一切，可与“谋算”形成连贯诗意，但以脚注保留其他可能。
- source_word: לְבָבִי
  choice: 我心中
  rationale: 保留“心”作为思想、愿望和珍爱之物所在之处的希伯来语意象。
