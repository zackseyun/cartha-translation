  text: בַּדֵּ֣י שְׁאֹ֣ל תֵּרַ֑דְנָה אִם יַ֖חַד עַל עָפָ֣ר נָֽחַת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
translation:
  language: zh_hans
  text: 它们会降到阴间的门闩处吗？[a]我们会一同在尘土上安歇吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门闩”或译“部分”或“横闩”。这里的希伯来语意象可能描绘阴间如牢狱般有闩、封闭。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们会一同降到尘土上吗？”末句的希伯来语词可理解为“安歇”，也有人理解为“下降”。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  choice: 门闩
  rationale: 该词有“部分、枝条、杠、闩”等可能含义；与“阴间”连用时，“门闩”较自然地呈现死亡领域如牢狱般封闭的诗歌意象，同时以脚注保留其他可能。
- source_word: שְׁאֹל
  choice: 阴间
  rationale: “阴间”在现代中文圣经语境中可指死者所在之境，比“坟墓”更能保留 שְׁאוֹל 的广泛含义，又比音译更便于普通读者理解。
- source_word: תֵּרַדְנָה
  choice: 它们会下到……吗
  rationale: 该动词是阴性复数，可能回指上文所说的盼望等事物；译作“它们”保留复数形式和指代上的含混。上下文具有反问语气，因此采用疑问句。
- source_word: אִם
  choice: ……吗
  rationale: אִם 通常表示“若、是否”，本处可引出与前句相应的疑问；中文用句末“吗”自然表达这一疑问力量。
- source_word: יַחַד
  choice: 一同
  rationale: 准确表达共同、一起的意思，并保持诗句庄重简洁。
- source_word: עַל עָפָר
  choice: 到尘土中
  rationale: 介词字面为“在……上”，但结合下降和死亡的语境，中文“下到尘土中”更自然地表达归于尘土的方向；脚注说明另一种“在尘土中安歇”的理解。
- source_word: נָחַת
  choice: 下到
  rationale: 按“下降”理解，可与前半句的“下到”形成诗歌平行；该形式也有人理解为“安歇”，故在脚注保留。
theological_decisions:
- issue: שְׁאֹל 所指的死亡领域
  choice: 阴间
  alternative: 坟墓／死者之境
  rationale: 不将该词缩窄为个别坟墓，也不赋予后期有关终极刑罚的特定教义含义；“阴间”保留古希伯来诗歌中死者领域的概念。
- issue: 复数主语的所指
  choice: 用“它们”保留不明确的回指
  alternative: 明确译为“我的盼望”
  rationale: 希伯来文动词为阴性复数，但本节未明说主语；不应在正文中擅自确定其所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两句均保留反问形式；“阴间”承载古代死者领域的概念。“它们”刻意保留希伯来文复数主语指代不明的特点。
