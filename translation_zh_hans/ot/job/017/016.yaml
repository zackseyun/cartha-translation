revisions:
- from: 它们会下到阴间的门闩那里吗？[a]我们会一同下到尘土中吗？[b]
  to: 它们会降到阴间的门闩处吗？[a]我们会一同在尘土上安歇吗？[b]
  rationale: 修订使第二句按较可能的“安歇”理解呈现，同时以脚注完整保留“下降”的可行读法，避免将原文的语义争议消除。首句删去口语化的“那里”，使诗歌意象更凝练；脚注a则改正门闩与门户混同的问题。
