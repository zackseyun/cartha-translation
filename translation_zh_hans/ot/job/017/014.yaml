  yaml_path: translation/ot/job/017/014.yaml
  text: I call to the pit, ‘You are my father,’ and to the worm, ‘My mother and my sister.’
translation:
  language: zh_hans
  text: 我称坟墓为“我的父亲”，称蛆虫为“我的母亲、我的姐妹”。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחַת
  choice: 坟坑
  rationale: 此词可指坑穴、坟坑，也可带有朽坏之意；本节与蛆虫并列，语境明显指向死亡和坟墓。“坟坑”既保留具体意象，也自然传达这里的死亡语境。
- source_word: קָרָאתִי
  choice: 我称……为
  rationale: קרא 与身份称谓连用时可表示“称呼、叫作”。译成“称……为”能清楚呈现约伯把坟坑和蛆虫视作至亲的修辞；也保留了原文完成式在语境中的陈述力度。
- source_word: רִמָּה
  choice: 蛆虫
  rationale: 该词指腐尸中的蛆或虫；“蛆虫”比泛称“虫子”更准确地传达死亡、腐朽的意象。
- source_word: אָבִי אָתָּה
  choice: 我的父亲
  rationale: 原文直译为“你是我的父亲”。嵌入现代汉语“称……为”的句式后，保留核心亲属称谓及拟人效果。
- source_word: אִמִּי וַאֲחֹתִי
  choice: 我的母亲、我的姐妹
  rationale: 忠实保留两个并列的阴性亲属称谓，不将其中任何一个弱化或省略。
theological_decisions:
- issue: 坟坑与蛆虫的亲属称谓是否应解释为死后归宿或亲密关系
  choice: 保留约伯直接以父亲、母亲和姐妹称呼死亡与腐朽之物的诗性张力，不作解释性扩写
  alternative: 译成“坟墓将成为我的父亲，蛆虫将成为我的母亲和姐妹”
  rationale: 原文采用直接称谓，表达约伯对死亡近在咫尺、仿佛成为其家属的绝望感；加入“将成为”会引入原文没有明确标示的时间和解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“称……为”整合原文两个受词和直接引语，避免生硬的“我向坟坑呼叫”；“坟坑”“蛆虫”保留约伯记诗歌中强烈的死亡与腐朽意象。
