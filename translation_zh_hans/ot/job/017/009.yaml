  text: וְ/יֹאחֵ֣ז צַדִּ֣יק דַּרְכּ֑/וֹ וּֽ/טֳהָר יָ֝דַ֗יִם יֹסִ֥יף אֹֽמֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/009.yaml
  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: zh_hans
  text: 然而，义人仍持守自己的道路；手洁的人越发刚强。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“增添力量”，也可理解为“力量增长”，或较狭义地理解为“更有勇气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: 然而……仍持守
  rationale: וְ 可作简单承接，但在约伯此前悲凉的陈述之后带有轻微转折意味；“然而……仍”自然表达这种语势。אחז意为抓住、握住，此处指坚定持守。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该单数形容词在此作名词使用，代表义者这一类人；“义人”简洁自然，不额外增添性别限定。
- source_word: דַּרְכּוֹ
  choice: 自己的道路
  rationale: דֶּרֶךְ既可指道路，也可比喻人生的行径或道路；此译保留具体意象及比喻空间。“自己的”符合现代汉语回指主语的习惯。
- source_word: וּטֳהָר יָדַיִם
  choice: 手洁的人
  rationale: 原文直译近于“手纯洁者”，是表示无辜或品行纯正的具体意象；“手洁的人”保留希伯来语形象，也符合庄重的经文语体。
- source_word: יֹסִיף
  choice: 越发
  rationale: יסף的使役式基本义为增加、增添；与אֹמֶץ连用时表达力量不断增加。“越发”在汉语中自然传达递增之意。
- source_word: אֹמֶץ
  choice: 刚强
  rationale: 该词可指力量、勇气或坚定的毅力。“刚强”兼顾力量与坚毅，且不把语义收窄为单纯的勇气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“持守自己的道路”保留原文道路的意象；“手洁”保留希伯来语关于无辜和纯正的具体表达。分号呈现两行诗句的平行关系。
