  text: He denounces friends for a share[a], and the eyes of his children will fail.
translation:
  language: zh_hans
  text: 为要分得一份[a]而告发朋友的人，他儿女的眼睛必衰残。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一份”也可译作“一份产业”或“利益”；另有解释作“奉承话”。希伯来语这句话含义难定，但可能是指为个人所得而出卖朋友。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: 为要分得一份
  rationale: חֵלֶק的核心义是“份、分得的部分”。此处语义艰深，可能暗示为个人所得或利益而行事；正文保留“一份”这一较宽泛的表达，不擅自补入“战利品”。
- source_word: יַגִּיד
  choice: 告发
  rationale: נגד的使役式本义为“告知、宣告”。结合“朋友”和谋取一份所得的语境，“告发”能体现揭露或出卖朋友的负面意味，又不限定为正式司法控告。
- source_word: רֵעִים
  choice: 朋友
  rationale: רֵעִים通常指朋友或同伴；“朋友”直接呈现此处关系上的背叛。
- source_word: וְעֵינֵי בָנָיו
  choice: 他儿女的眼睛
  rationale: בנים可指儿子，也可泛指儿女；此处采用现代汉语中自然且不过度限定性别的“儿女”。
- source_word: תִּכְלֶנָה
  choice: 必衰残
  rationale: כלה可表示耗尽、衰败或消逝；以眼睛为主语时，“衰残”保留眼目因困苦或审判而衰败的形象，不将其狭义化为单纯失明。
theological_decisions:
- issue: 后半句与前半句的关系
  choice: 保留为告发者儿女将遭受衰残的陈述
  alternative: 将后半句理解为单纯的愿望、咒诅，或特指因饥饿而望眼欲穿
  rationale: 希伯来文动词形式本身可表达将来的结果，但未明确标示祈愿语气或具体成因；正文不额外确定其机制。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“为要分得一份”刻意保留原文的宽泛和艰深，不补出“战利品”；“告发”传达负面语境，“衰残”则保留כלה在此处既可指衰败、耗尽，也可能包含昏暗的语义空间。
