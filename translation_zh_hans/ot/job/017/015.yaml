  text: וְ֭/אַיֵּה אֵפ֣וֹ תִקְוָתִ֑/י וְ֝/תִקְוָתִ֗/י מִ֣י יְשׁוּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/015.yaml
  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: zh_hans
  text: 那么，我的希望在哪里？我的希望——谁能看见呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁会看见它呢？”希伯来语动词可译为“看见”或“注视”；这里的未完成式既可表示将来（“会”），也可表示可能或能力（“能”）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה
  choice: 在哪里
  rationale: אַיֵּה是询问地点的疑问词，意为“在哪里”。前缀连词承接约伯的哀叹；中文以“那么”连贯地表达这种承接关系。
- source_word: אֵפוֹ
  choice: 那么
  rationale: אֵפוֹ在问句中带有强调或推论意味。“那么”符合现代汉语习惯，也保留了上下文中的推论语气。
- source_word: תִקְוָתִי
  choice: 我的希望
  rationale: תִּקְוָה通常表示“希望”或“所期待的事”。本节哀叹语境中，“希望”自然且准确。
- source_word: וְתִקְוָתִי
  choice: 我的希望——
  rationale: 原文重复“我的希望”以加强诗意和语势，译文保留重复，并用破折号突出后面的追问。
- source_word: מִי
  choice: 谁
  rationale: 标准的人称疑问代词，引出第二个问句。
- source_word: יְשׁוּרֶנָּה
  choice: 能看见呢
  rationale: 源自动词שׁור，可指“看见、观看、注视”。未完成式在此可理解为将来意义“会看见”，也可理解为情态意义“能看见”；正文采用符合语境的情态表达，并在脚注保留另一可能。阴性单数宾语后缀指回“希望”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的诗体汉语。保留原文对“我的希望”的重复和两个问句的张力，不将约伯的问题解释成确定的神学结论。
