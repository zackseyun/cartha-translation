  text: וְ֭/רוּחַ עַל פָּנַ֣/י יַחֲלֹ֑ף תְּ֝סַמֵּ֗ר שַֽׂעֲרַ֥ת בְּשָׂרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/015.yaml
  text: Then a spirit passed before my face[a]; the hair of my flesh bristled.
translation:
  language: zh_hans
  text: 这时，有一个灵从我面前掠过[a]；我身上的毛发都竖了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一阵风”或“一口气息”从我面前掠过。希伯来语“רוּחַ”可指“灵”“风”或“气息”；这里的语境较支持“灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: 这时，有一个灵
  rationale: רוּחַ可指“灵、风、气息”。本节描写一种令人战栗、从面前经过的神秘存在，语境较支持“灵”；希伯来语没有定指，因此译作“一个灵”。句首וְ在叙事推进中译作“这时”。
- source_word: עַל פָּנַי
  choice: 从我面前
  rationale: 字面为“在我脸上/面前”；与表示经过的יַחֲלֹף连用时，指从说话者面前经过。“从我面前”既自然，也保留了具体的空间画面。
- source_word: יַחֲלֹף
  choice: 掠过
  rationale: חלף表示经过、越过。“掠过”简洁地传达迅速或幽微地经过之感，又不额外说明该灵的性质。
- source_word: תְּסַמֵּר
  choice: 都竖了起来
  rationale: 此动词在这里表示使毛发僵直、直立。现代汉语“毛发竖了起来”准确、自然地表达因惊惧而毛发直立的画面。
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: 我身上的毛发
  rationale: 原文直译为“我肉身的毛发”。“我身上的毛发”保留身体意象，同时比“我的体毛”更庄重自然；“都”体现毛发作为集合名词的含义。
theological_decisions:
- issue: רוּחַ所指为何
  choice: 正文译作“灵”
  alternative: “风”或“气息”
  rationale: 原词本身具有多义性；异象般的语境和随之而来的战栗较支持“灵”，但不能完全排除“风”或“气息”，故在脚注保留这些词义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从我面前掠过”保留原文的具体画面；“我身上的毛发都竖了起来”则以自然汉语再现原文的身体反应。
