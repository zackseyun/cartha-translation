base_translation:
  language: en
  yaml_path: translation/ot/job/004/017.yaml
  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: zh_hans
  text: 脆弱的世人岂能在上帝面前为义？人岂能在他的创造主面前纯洁？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种较直译的理解：“脆弱的世人岂能比上帝更公义？人岂能比他的创造主更纯洁？”
    reason: 希伯来语介词מִן在两行中也可按比较义理解。
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: 脆弱的世人
  rationale: אֱנוֹשׁ指人类个体，并常带有软弱、必死的意味。“脆弱的世人”在现代汉语中自然表达人与上帝对照之下的有限与软弱。
- source_word: מֵאֱלוֹהַ
  choice: 在上帝面前
  rationale: 介词מִן既可作比较，也可在此理解为相对于上帝的关系。“在上帝面前”与יִצְדָּק搭配自然，同时保留比较解读于脚注。
- source_word: יִצְדָּק
  choice: 算为义
  rationale: צדק在此涉及人相对于上帝是否为正、为义。“算为义”表达司法和关系层面的判定，又不把后期神学体系强加于本节。
- source_word: אִם
  choice: 岂能
  rationale: אִם引出平行的第二个疑问句；重复“岂能”可自然呈现希伯来诗歌的修辞性反问。
- source_word: מֵעֹשֵׂהוּ
  choice: 在造他的主面前
  rationale: עֹשֵׂהוּ直指“造他的那一位”。译作“造他的主”简洁庄重，并与前半句“上帝”形成诗意平行；מִן的比较义另见脚注。
- source_word: יִטְהַר
  choice: 算为纯洁
  rationale: טהר表示洁净、纯洁。加入“算为”使其与前句的关系性判断平行，并保留道德与礼仪语义可能交叠的张力。
- source_word: גָּבֶר
  choice: 人
  rationale: גָּבֶר为阳性单数，可强调男子或人的力量，但此处与אֱנוֹשׁ平行，泛指人。汉语用“人”最自然，也避免无依据地突出勇士或强者含义。
theological_decisions:
- issue: 人在上帝面前的义与纯洁
  choice: 译为人能否“在上帝面前”算为义、算为纯洁的修辞性疑问。
  alternative: 译为人能否“比上帝更公义”、能否“比造他的主更纯洁”。
  rationale: 希伯来语介词מִן可表达比较，也可在此表达相对于上帝的关系。正文采用符合上下文且汉语自然的关系性理解，不将本节扩展为后期教义公式；较形式化的比较理解保留在脚注中。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。两个平行反问均用“岂能”，保留诗歌力度；“脆弱的世人”呈现אֱנוֹשׁ所含的人类软弱意味。“造他的主”避免生硬的“制造者”，并保持对创造者的敬称。
