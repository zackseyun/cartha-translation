- from: 脆弱的世人岂能在上帝面前算为义？人岂能在造他的主面前算为纯洁？[a]
  to: 脆弱的世人岂能在上帝面前为义？人岂能在他的创造主面前纯洁？[a]
  rationale: 修订以“为义／纯洁”直接对应原文的状态性谓语，避免加入“算为”的归算含义；将“造他的主”调整为“他的创造主”，使中文更自然并明确属格关系。比较性译法继续以脚注保留，维护原文构式的解释空间。
