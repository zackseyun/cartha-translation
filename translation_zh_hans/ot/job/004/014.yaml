  yaml_path: translation/ot/job/004/014.yaml
  text: Fear came upon me[a], and trembling, and it made all my bones shake.
translation:
  language: zh_hans
  text: 恐惧临到我，战栗也临到我；它使我浑身的骨头都惊颤。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它使我众多的骨头惊惧”，或“使我的骨头颤抖”。希伯来文直译为“我骨头的众多”，是描写强烈身体反应的生动诗性表达。
    reason: 保留 רֹב עַצְמוֹתַי 的字面意象，并说明 הִפְחִיד 的使役含义可译为“使惊惧”或按上下文译为身体的“颤抖”。
lexical_decisions:
- source_word: פַּחַד
  choice: 恐惧
  rationale: 该名词表示惧怕、惊恐；“恐惧”自然庄重，也不过度强化为“恐怖”。
- source_word: קְרָאַנִי
  choice: 临到我
  rationale: 这里的 קרא 表示遇上、遭逢或临到；结合突如其来的可怕经历，“临到我”最符合语境和诗歌语气。
- source_word: וּרְעָדָה
  choice: 战栗也随之而来
  rationale: 该名词指恐惧所引起的身体颤抖；补出“随之而来”使汉语衔接自然，同时保留它与“恐惧”的并列关系。
- source_word: וְרֹב עַצְמוֹתַי
  choice: 我浑身的骨头都
  rationale: 原文直译近于“我众多的骨头”，是强调强烈全身反应的诗性说法；正文用自然汉语表达，并以脚注保留字面形式及歧义。
- source_word: הִפְחִיד
  choice: 使……惊颤
  rationale: פחד 的使役式表示使之害怕；因宾语是“骨头”，译作“使……惊颤”既保留使役含义，也呈现身体反应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“临到我”保留突然而不可抗拒的遭逢感；“战栗也随之而来”使原文的名词并列在汉语中更顺畅；脚注说明“众多的骨头”这一不宜硬译进正文的希伯来诗性表达。
