base_translation:
  language: en
  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
translation:
  language: zh_hans
  text: 看哪，你曾教导[a]许多人；你也曾使软弱的手刚强起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“管教”或“纠正”；希伯来语动词也可指借着纠正来教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意的语篇标记；“看哪”保留了诗歌言语中的强调和庄重感。
- source_word: יִסַּרְתָּ
  choice: 曾教导
  rationale: יסר 可指管教、纠正，也可指借着纠正进行教导。此处以利法回顾约伯过去扶助他人的行为，“曾教导”最符合正面的智慧语境，同时用脚注保留其他含义。
- source_word: רַבִּים
  choice: 许多人
  rationale: 自然、准确地表达数量众多的人。
- source_word: יָדַיִם רָפוֹת
  choice: 发软的手
  rationale: 保留原文的身体隐喻，指力量衰弱或灰心丧志；“发软的手”在现代汉语中清楚自然。
- source_word: תְּחַזֵּק
  choice: 使……坚强
  rationale: חזק 的加强词干意为“使强壮、坚固”。与前半句平行，此处按对约伯以往作为的回顾来表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“曾……又……”体现两分句的平行关系；保留“发软的手”这一具体隐喻，不将其解释性改写为“灰心的人”。
