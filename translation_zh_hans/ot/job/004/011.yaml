  text: 狮子因缺少猎物而丧命，狮子的幼崽也四散。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַיִשׁ
  choice: 狮子
  rationale: 该词指狮子，可能带有强壮或成熟的意味；正文用普通而自然的“狮子”，避免加入原文未明确限定的年龄或强弱。
- source_word: אֹבֵד
  choice: 灭亡
  rationale: 该分词表示走向毁灭或死亡；“灭亡”保留了诗句鲜明、格言式的语气。
- source_word: מִבְּלִי
  choice: 因无
  rationale: 这一介词结构表示缺乏或不存在，并在句中表达原因；“因无”简洁地传达这种关系。
- source_word: טָרֶף
  choice: 猎物
  rationale: 该词在猛兽意象中指捕获、撕食的猎物，不只是泛指食物。
- source_word: בְנֵי
  choice: 幼崽
  rationale: 字面为“儿子们”，用于动物时译作“幼崽”符合现代汉语习惯，并保留后代的含义。
- source_word: לָבִיא
  choice: 狮子
  rationale: 该词可指狮子，也可能指母狮；正文采用不限定性别的“狮子”，并以脚注保留“母狮”的可能。
- source_word: יִתְפָּרָדוּ
  choice: 四散了
  rationale: 该动词表示彼此分离、分散；“四散了”自然传达狮群或家庭单位解体的结果。
