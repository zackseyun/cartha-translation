base_translation:
  language: en
  yaml_path: translation/ot/job/004/007.yaml
  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: zh_hans
  text: 请回想一下：有哪个无辜[a]的人灭亡过？正直的人又在哪里被剪除过？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无辜”或译“清白”。
    reason: lexical_alternative
  - marker: b
    text: “被剪除”或译“被除灭”、“被消灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: 请回想一下
  rationale: זְכָר是“记得、回想”的命令式，נָא使语气较为恳切、舒缓；合译为“请回想一下”，既保留劝请语气，也符合现代汉语表达。
- source_word: מִי הוּא
  choice: 有哪个……的人
  rationale: 疑问词加代词带有强调作用，引出反问；汉语用“有哪个……的人”自然传达“究竟谁”的语势。
- source_word: נָקִי
  choice: 无辜
  rationale: 该词表示无罪、清白、不负罪责；“无辜”在此清楚表达以利法所说的道德无罪，同时以脚注保留“清白”这一可能译法。
- source_word: אָבָד
  choice: 灭亡
  rationale: 该动词表示毁灭、消亡或遭受败亡；“灭亡”保留原文的严重语气，并与下半句平行。
- source_word: וְאֵיפֹה
  choice: 又在哪里
  rationale: 连词与疑问副词引出平行的第二个反问；“又在哪里”在汉语中自然衔接并强化对应关系。
- source_word: יְשָׁרִים
  choice: 正直的人
  rationale: 复数形容词在此作名词使用，指品行正直者；译作“正直的人”清晰自然。
- source_word: נִכְחָדוּ
  choice: 被剪除
  rationale: כחד的Niphal完成式可表示被抹去、除掉或毁灭；“被剪除”保留被动和彻底除去的含义，也与“灭亡”形成对应。
theological_decisions:
- issue: 以利法关于无辜者和正直者命运的反问式断言
  choice: 按原文直接译出以利法的反问，不在措辞中削弱或认可他的主张。
  alternative: 在译文中加入提示，说明这一主张会受到全书后文的质疑。
  rationale: 本节呈现的是以利法本人的神学判断。译文应忠实保留其肯定性的反问语气，同时不把《约伯记》整体对这一判断的张力预先消解。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“请回想一下”表达נָא所带的恳切语气；两个反问保持整齐平行。保留“被剪除”这一较凝练的表达，并用脚注提供更日常的词汇选择。
