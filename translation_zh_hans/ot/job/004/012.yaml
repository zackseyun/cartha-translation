  text: A word was secretly brought to me[a], and my ear caught a whisper of it.
translation:
  language: zh_hans
  text: 有一句话悄悄传到我这里；我的耳朵捕捉到其中一丝低语[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的耳朵只听到一点隐约的声音。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַי
  choice: 到我这里
  rationale: 保留介词“向我、到我这里”的指向；וְ 的连接作用用分号和上下文自然体现，不增添原文没有的时间副词。
- source_word: דָּבָר
  choice: 有话
  rationale: דָּבָר 在此指传来的言语；“话”简洁自然，也保留其神秘感，不扩释为完整的“信息”。
- source_word: יְגֻנָּב
  choice: 暗暗传到
  rationale: 该词源于“偷取”，此处被动形式比喻言语以隐秘、悄然的方式传来；避免直译成“被偷来”所造成的误解。
- source_word: וַתִּקַּח
  choice: 捕捉到
  rationale: 原义为“取、拿”，主语是“我的耳朵”；“捕捉到”在现代汉语中自然保留了具体的听觉意象。
- source_word: אָזְנִי
  choice: 我的耳朵
  rationale: 保留希伯来文单数的身体意象，不抽象化为“我的听觉”。
- source_word: שֵׁמֶץ
  choice: 一丝低语
  rationale: 该词可指极少的一点、隐约的声音或些微迹象；结合听觉语境，“一丝低语”既表达声音轻微，也保留神秘氛围。
- source_word: מֶנְהוּ
  choice: 其中
  rationale: 字面可作“从它”；所指为前面的“话”，汉语用“其中”自然表达耳朵只听到这话的一小部分。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“暗暗传到”体现隐秘传递，“一丝低语”呈现 שֵׁמֶץ 的轻微听觉意味；脚注保留其也可表示少量或隐约声音的语义幅度。
