base_translation:
  language: en
  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: zh_hans
  text: 它站住了，我却辨认不出它的模样[a]；一个形体在我眼前；一片寂静[b]，我听见一个声音说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的模样”。希伯来语的词尾是阳性单数，但这里所指的是尚未辨明的异象，因此正文用“它”保留其不确定性。
    reason: lexical_alternative
  - marker: b
    text: 或译：“静谧”或“静止”。原词可表示无声的寂静，也可表示一片静止、肃静。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: 它站住了
  rationale: עמד可表示“站立”或“停住”。在异象的叙述中，“站住了”自然地表现那形影停留在说话者眼前。
- source_word: וְלֹא אַכִּיר
  choice: 我却认不出
  rationale: Hifil形式的נכר通常意为“认出、辨认”。上下文构成转折：形影虽在眼前，说话者却无法辨明其身份或样貌。
- source_word: מַרְאֵהוּ
  choice: 它的模样
  rationale: מראה指外观、样貌或可见形态。希伯来语后缀为阳性单数，但所指仍是不明的异象；用“它”避免把它过早明确为男性人物。
- source_word: תְּמוּנָה
  choice: 一个形影
  rationale: תמונה可指形状、形像或轮廓。“形影”适合此处朦胧而无法辨认的视觉印象，也保持庄重自然。
- source_word: לְנֶגֶד עֵינָי
  choice: 在我眼前
  rationale: 直译为“在我的眼睛前面”；“在我眼前”简洁自然，并保留视觉现场感。
- source_word: דְּמָמָה
  choice: 寂静无声
  rationale: דממה可指寂静、静止或低声止息后的静谧。“寂静无声”在中文中自然地传达声音出现前的肃静。
- source_word: וָקוֹל אֶשְׁמָע
  choice: 我听见有声音说
  rationale: קול可指声音或说话声；下一节随即引出话语，因此译作“声音说”最合语境，并以冒号衔接后文。
theological_decisions:
- issue: 异象所指的性别或位格
  choice: 以中性代词“它”指称
  alternative: 译作“他的模样”
  rationale: 原文后缀虽为阳性单数，但异象本身尚未被辨认；正文不把其身份或位格提前确定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“形影”保留异象的朦胧感；分号和句号呈现视觉停顿，冒号则自然引出下一节的话语。所有脚注标记均已置于正文对应位置。
