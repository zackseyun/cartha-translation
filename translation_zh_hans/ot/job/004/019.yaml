  yaml_path: translation/ot/job/004/019.yaml
  text: how much more those who dwell in houses of clay[a], whose foundation is in the dust[b], who are crushed before the moth!
translation:
  language: zh_hans
  text: 更何况那些住在泥土造的房屋中的人[a]，他们的根基在尘土中，在蛀虫面前被压碎[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更何况”也可译作“甚至”或“确实”。这里的希伯来语词承接上节，可能强调：若上节所说尚且如此，脆弱的世人就更是如此。
    reason: lexical_alternative
  - marker: b
    text: “在蛀虫面前”也可能意为“比蛀虫更快被压碎”或“比蛀虫还容易被压碎”，强调人毁灭得何等迅速、轻易。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: 更何况
  rationale: 承接上节，由较高者推及更脆弱的世人，表达递进推论；同时以脚注保留“甚至”的直译可能。
- source_word: שֹׁכְנֵי
  choice: 那些住在……里的人
  rationale: 保留分词所表达的持续居住状态，并符合现代汉语习惯。
- source_word: בָתֵּי חֹמֶר
  choice: 泥土房屋
  rationale: 直观保留由泥土制成的居所意象，也让其所暗示的人体与人生脆弱性保持为隐喻。
- source_word: בֶּעָפָר יְסוֹדָם
  choice: 他们的根基在尘土中
  rationale: 保留“根基”和“尘土”的具体诗歌意象，以及尘土与人必死性的关联。
- source_word: יְדַכְּאוּם
  choice: 被压碎
  rationale: 该动词在此表示压碎；希伯来文施事者未明，汉语被动式避免擅自补出主语。
- source_word: לִפְנֵי עָשׁ
  choice: 在蛀虫面前
  rationale: 按字面保留介词“在……面前”及其诗意歧义；脚注说明也可能表达比蛀虫更快或更容易被毁灭。
- source_word: עָשׁ
  choice: 蛀虫
  rationale: 这里指会蛀蚀衣物等物的 moth；“蛀虫”在现代汉语中比单说“飞蛾”更能传达毁坏意象。
theological_decisions:
- issue: “泥土房屋”所指
  choice: 正文保留隐喻，理解为必死之人的脆弱躯体或尘世生命
  alternative: 按字面指泥土建成的房屋，借此刻画居住者的脆弱
  rationale: 上下文将天上的仆役与凡人对照；不在正文中明说“身体”，可避免消除原诗兼具字面与隐喻的张力。
- issue: “在蛀虫面前”如何理解
  choice: 正文采用字面表达，保留其可能表示迅速、轻易被毁的歧义
  alternative: 译为“比蛀虫更快被压碎”或“比蛀虫还容易被压碎”
  rationale: 原文介词短语简练且解释有争议；正文不应将某一种比较关系定死，脚注可交代主要理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“更何况”显明与上节的论证联系，以“竟……就……”呈现人的极度脆弱；保留“泥土房屋、根基、尘土、蛀虫、压碎”等具体诗歌意象，不在正文中解释隐喻。
