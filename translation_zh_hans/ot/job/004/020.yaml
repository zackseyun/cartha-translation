base_translation:
  language: en
  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: zh_hans
  text: 从早到晚，他们被压碎；无人留意[a]，便永远灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无人放在心上”。
    reason: 原文是省略性惯用语，字面涉及“放置”，可能意为留心、关注或放在心上。
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: 从早到晚
  rationale: 保留原文由早晨至晚间的时间跨度，突出人在一日之间便可能毁灭的短暂与脆弱；现代汉语自然简洁。
- source_word: יֻכַּתּוּ
  choice: 被击碎
  rationale: 该词为被动使役形，表示遭击打而破碎；“被击碎”既保留被动语态，也不额外指定施事者或具体方式。
- source_word: מִבְּלִי מֵשִׂים
  choice: 无人留意
  rationale: 原文是含有“放置”的省略性表达，可能指放在心上、加以关注；“无人留意”自然传达其惯用含义，同时以脚注保存字面意象。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 保留该词所表达的持续性和不可逆的终局感，不在正文中将其解释为特定的末世论结局。
- source_word: יֹאבֵדוּ
  choice: 消逝
  rationale: אבד可指灭亡、失丧或消逝；此处“消逝”与人的短暂无常相称，又不将语义收窄为某种特定神学意义上的毁灭。
theological_decisions:
- issue: 以利法话语中人死亡的终局性
  choice: 保留“永远消逝”的强烈措辞，将其呈现为人在死亡中不可逆的消亡。
  alternative: 把“永远”明确解释为末世性的永恒沉沦。
  rationale: 上下文强调凡人在上帝面前的脆弱。译文保留原文的终局性与神学张力，却不扩展为一套明确的末世审判教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从早到晚”保留希伯来文的时间意象；“被击碎”呈现强烈的被动动作；末句措辞凝练，以符合诗歌体。
