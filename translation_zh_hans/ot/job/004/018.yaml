base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: zh_hans
  text: 看哪，他不信任自己的仆人，并且认定自己的使者[a]有过错[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天使”。希伯来语这个词既可指人间的使者，也可指天上的使者；这里的上下文很可能指天使。
    reason: alternative_reading
  - marker: b
    text: “过错”所译的希伯来语词十分罕见，也可理解为“谬误”“愚妄”或“缺陷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的提示词；“看哪”简洁庄重，也保留了原文的强调作用。
- source_word: בַּעֲבָדָיו
  choice: 自己的仆人
  rationale: 介词 ב 与使役态 אמן 连用时标示信任的对象；עבד 在这里强调从属和侍奉身份，因此译作“仆人”而非“奴隶”。
- source_word: לֹא יַאֲמִין
  choice: 不信任
  rationale: 使役态 אמן 在此表达信赖、倚重，而非仅指相信某项陈述；“不信任”符合现代汉语表达。
- source_word: וּבְמַלְאָכָיו
  choice: 自己的使者[a]
  rationale: מלאך 的基本含义是“使者”，也常特指天上的使者，即天使。正文保留较宽泛的词义，脚注说明上下文中很可能所指的是天使。
- source_word: יָשִׂים
  choice: 认定……有
  rationale: שׂים 与抽象名词连用，在这里表示把某种过失归于某人或判定某人具有这种过失；“认定……有”自然表达这一归责含义，同时避免使措辞显得过度法律化。
- source_word: תָּהֳלָה
  choice: 过错[b]
  rationale: 这是一个罕见名词，可能表示错误、愚妄、缺失或不完美。“过错”在中文中简洁自然，并由脚注保留其词义范围的不确定性。
theological_decisions:
- issue: מַלְאָכָיו 应具体译为“天使”，还是保留基本词义“使者”
  choice: 使者
  alternative: 天使
  rationale: 该词本义可泛指使者，而本节与“仆人”并列，上下文很可能指天上的使者。正文采用“使者”以保留原词的范围，脚注则交代“天使”这一很可能的具体所指。
- issue: תָּהֳלָה 所指的是道德过犯、错误，还是受造者的缺陷
  choice: 过错
  alternative: 谬误、愚妄或缺陷
  rationale: 此词仅见于少数难解语境，含义不能完全确定。正文不把它限定为某种特定的道德罪责，脚注保留“错误、愚妄、缺陷”等可能含义，从而维持原文关于天上受造者在上帝面前并非绝对无瑕的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留诗歌中的强调语气；整体句式简洁，并以“还”呈现两个并列分句间递进的修辞效果。所有脚注标记均置于对应词语之后。
