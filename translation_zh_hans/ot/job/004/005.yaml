base_translation:
  language: en
  yaml_path: translation/ot/job/004/005.yaml
  text: But now it comes to you[a], and you are weary; it touches you[b], and you are dismayed.
translation:
  language: zh_hans
  text: 但如今[a]，它临到你，你就疲惫；它触及你[b]，你便惊惶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为如今”。希伯来语连词 כִּי 可有多种含义；正文根据上下文的对比采用转折义。
    reason: lexical_alternative
  - marker: b
    text: 原文“临到”和“触及”均为阴性单数动词，其主语没有明说，可能暗指患难或灾祸。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 但
  rationale: 这里以利法把约伯从前扶助别人时的表现与如今患难临身后的反应相对照，因此采用转折义；同时用脚注保留“因为”等可能译法。
- source_word: עַתָּה
  choice: 如今
  rationale: 表示当前处境，并与约伯过去的表现形成对比；“如今”比“现在”更符合诗歌体的庄重语域。
- source_word: תָּבוֹא
  choice: 它临到
  rationale: 原文是阴性单数动词，主语没有明说，可能暗指患难或灾祸。译作“它”避免把隐含对象直接确定为某一种灾难。
- source_word: אֵלֶיךָ
  choice: 你
  rationale: 与“临到”搭配，直译原文表示事情来到约伯身上的介词结构。
- source_word: וַתֵּלֶא
  choice: 你就疲惫
  rationale: 动词 לאה 表示疲乏、困倦或支撑不住；“疲惫”保留体力和心志衰弱的宽泛含义，不强解为缺乏耐心。
- source_word: תִּגַּע
  choice: 它触及
  rationale: נגע 可表示触碰、达到或击打；“触及”保留原文从“临到”推进到切身接触的意象，又不强化为猛烈打击。
- source_word: עָדֶיךָ
  choice: 你
  rationale: עד 加第二人称后缀表示“直到你、达到你”；在“触及”之后译作“你”最符合现代汉语。
- source_word: וַתִּבָּהֵל
  choice: 你便惊惶
  rationale: בהל 表示受惊、慌乱或惶惑；“惊惶”传达强烈不安，同时不把语气过度强化为恐怖。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语，保留希伯来诗句两组分句的平行推进。“它”刻意保留原文未明说主语的含混性；分号呈现从患难临到、使人疲惫，到切身触及、使人惊惶的递进。
