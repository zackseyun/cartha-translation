base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: zh_hans
  text: 在夜间异象引发的烦扰思绪中[a]，当沉睡临到人们时[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在从夜间异象而来的不安思绪中。”
    reason: 保留בְּשְׂעִפִּים及介词מִן所表达的来源关系，并提供较形式对应的表达。
  - marker: b
    text: 原文作阳性复数“人”，这里泛指人类。
    reason: 说明希伯来语的语法形式及其在本句中的通用含义。
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: 在……纷乱思绪中
  rationale: שְׂעִפִּים可指分岔、扰乱人心的思绪；结合夜间惊惧的语境，译作“纷乱思绪”既保留内心不安之意，也符合现代汉语表达。
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: 夜间异象引起的
  rationale: חֶזְיֹנוֹת לָיְלָה意为“夜间的异象”；介词מִן表示来源或缘由。汉语用“引起的”自然呈现这些思绪源于夜间异象，同时脚注保留较形式对应的表达。
- source_word: בִּנְפֹל
  choice: 当……临到……时
  rationale: 介词בְּ加不定式结构引出时间从句；译为“当……时”清楚保留其时间意义。
- source_word: תַּרְדֵּמָה
  choice: 沉睡
  rationale: תַּרְדֵּמָה指深沉、昏重的睡眠；“沉睡”简洁自然，强度也高于普通的“睡眠”。
- source_word: עַל אֲנָשִׁים
  choice: 临到世人
  rationale: עַל与“沉睡”搭配表示睡眠落在人身上；אֲנָשִׁים在此泛指人类。现代汉语“世人”自然保留其泛指意义，不必机械呈现希伯来语阳性复数形式。
theological_decisions:
- issue: אֲנָשִׁים的泛指范围
  choice: 世人
  alternative: 男人
  rationale: 该阳性复数在本句中泛指人类，而非特指男性；“世人”准确传达语义范围，并避免现代汉语读者误解为只有男性。脚注说明原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事诗体。“纷乱思绪”传达内心受扰，“沉睡临到世人”保留原文意象。本节语法上承接下文，故以逗号收束。
