base_translation:
  language: en
  yaml_path: translation/ot/job/004/006.yaml
  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: zh_hans
  text: 你对上帝的敬畏，不就是你的倚靠吗？你行事纯全，不就是你的盼望吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对上帝的敬畏”原文直译为“你的敬畏”，没有明说敬畏的对象。
    reason: lexical_alternative
  - marker: b
    text: “纯全”也可译作“正直”或“无可指摘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 不就是……吗
  rationale: 引出预期肯定回答的反问，既保留希伯来语的语气，也符合现代汉语表达。
- source_word: יִרְאָתְךָ
  choice: 你对上帝的敬畏
  rationale: 原文直译为“你的敬畏”，未明说对象；智慧文学的语境通常指向上帝。正文为清晰起见补出“上帝”，并以脚注保留原文的含蓄。
- source_word: כִּסְלָתֶךָ
  choice: 你的倚靠
  rationale: 此处名词表示信赖、把握或信心，而非同根词在其他语境中可有的“愚昧”。“倚靠”能自然表达其作为内在依凭的意义。
- source_word: תִּקְוָתְךָ
  choice: 你的盼望
  rationale: 准确传达智慧文学语境中所指的期待与希望。
- source_word: וְתֹם
  choice: 纯全
  rationale: תֹּם表示完整、正直、无可指摘的品格状态；“纯全”保留其伦理分量，又不将其误解为绝对无罪。
- source_word: דְּרָכֶיךָ
  choice: 你行事
  rationale: 原文为“你的道路”，在智慧文学中常喻指行为和生活方式；译为“你行事”使现代读者自然理解，同时保存伦理意义。
theological_decisions:
- issue: “敬畏”的隐含对象
  choice: 正文译作“你对上帝的敬畏”
  alternative: “你的敬畏”或“你的敬虔”
  rationale: 原文没有明说敬畏的对象，但在智慧文学中通常指敬畏上帝。正文补明最可能的所指，脚注则如实说明原文的含蓄，避免把语境判断冒充明文。
- issue: 四个名词短语之间的句法关系
  choice: 译成两个平行的反问分句
  alternative: 将“盼望”与“道路纯全”都视为前一分句的并列成分
  rationale: 希伯来诗句最自然地形成两组平行对应：敬畏—倚靠，行事纯全—盼望。分作两个反问句可清楚呈现这种平行结构。
- issue: 以利法话语的神学地位
  choice: 忠实保留其肯定式反问，不加赞同或否定说明
  alternative: 在正文中弱化或纠正其因果暗示
  rationale: 本节是人物发言，其完整神学评价需由《约伯记》整体叙事决定；翻译不应提前替叙事裁断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以两个平行反问句再现希伯来诗歌结构；“倚靠—盼望”形成语义呼应。“你行事纯全”比生硬的“你道路的纯全”更符合普通读者的语言习惯。
