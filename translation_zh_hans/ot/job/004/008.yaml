base_translation:
  language: en
  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: zh_hans
  text: 照我所见，耕耘罪恶[a]、播种祸患[b]的人，就收割它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪恶”或译“邪恶”或“祸患”；希伯来语词既可指道德上的恶，在某些语境中也可指恶所带来的祸患。
    reason: lexical_alternative
  - marker: b
    text: “祸患”或译“苦难”或“伤害”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 照……
  rationale: 与“我所见”合成自然的汉语表达“照我所见”，保留说话者诉诸亲身观察的语气。
- source_word: רָאִיתִי
  choice: 我所见
  rationale: 希伯来语完成式第一人称单数表示以往观察所得；汉语“我所见”简洁自然，也适合此处概括经验的语境。
- source_word: חֹרְשֵׁי
  choice: 耕种……的人
  rationale: 分词作名词用；此译保留耕作的农业比喻，又符合现代汉语表达。
- source_word: אָוֶן
  choice: 罪恶
  rationale: 该词可指道德上的恶，也可指由恶带来的祸患；此处与 עָמָל 平行而又有所区别，“罪恶”清楚保留其道德含义。
- source_word: וְזֹרְעֵי
  choice: 播撒……的人
  rationale: 保留与“耕种”相应的农业意象，并在汉语中清楚表达第二个并列分词。
- source_word: עָמָל
  choice: 祸患
  rationale: 该词可表示劳苦、苦难、伤害或造成苦难的恶事；“祸患”既涵盖害人的作为，也能指其痛苦后果，保留原词的语义张力。
- source_word: יִקְצְרֻהוּ
  choice: 就收割它
  rationale: 保留收割比喻及阳性单数宾语后缀，不擅自限定“它”只回指前面的某一个名词；“就”自然表达行为与结果的对应关系，而未额外强化为绝对教义。
theological_decisions:
- issue: 以利法话语中的道德因果关系
  choice: 将这句经验性格言按其本身的力度直接表达，不加解释性限定
  alternative: 把它强化为绝对的报应教义，或弱化为仅仅可能发生的趋势
  rationale: 本节属于以利法对约伯的论述。译文应保存他的主张及其力度，但不应把说话者的观察预先等同于全书最终的神学裁决。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“耕种—播撒—收割”完整保留原文的农业比喻和平行结构；“照我所见”表明这是以利法诉诸经验的陈述。脚注标记均紧随对应词语。
