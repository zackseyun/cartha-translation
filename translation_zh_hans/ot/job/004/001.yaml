  text: 提幔人以利法回答说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在此处是对约伯先前发言作出回应的叙事用语；“回答”既符合对话语境，也保留希伯来文常用引语公式。
- source_word: אֱלִיפַז
  choice: 以利法
  rationale: 采用现代中文圣经中通行且易于辨识的人名音译。
- source_word: הַתֵּימָנִי
  choice: 提幔人
  rationale: 该族称形容词指来自提幔的人；“提幔人”简洁、自然，并保留原文的附加身份说明。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 这是希伯来文标准的引语引入公式。与前面的“回答”连用为“回答说”，既贴近原文结构，也符合庄重的现代汉语叙事习惯。
- source_word: וַ
  choice: （由语序和句式体现）
  rationale: 句首连续式连词推进叙事；中文无需机械译作“于是”或“然后”，上下文顺序已由新发言者出场及“回答说”自然体现。第二个连词则融入“回答说”的固定结构。
