  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: zh_hans
  text: 你的话使踉跄的人站立[a]，又使发软的膝盖[b]有力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……站立”也可译作“扶持”或“使……重新站稳”。
    reason: lexical_alternative
  - marker: b
    text: 直译“正在屈下的膝盖”，意指因软弱而发软、支撑不住的膝盖。
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: 跌倒的人
  rationale: 该分词指正在失足、踉跄或将要倒下的人；译作“跌倒的人”保留具体动作意象，也符合现代汉语表达。
- source_word: יְקִימוּן
  choice: 使……站起来
  rationale: קום的使役式在此表示使人站立、扶起或使其重新站稳；“使……站起来”与后半句的身体意象平行，并保留使役含义。
- source_word: מִלֶּיךָ
  choice: 你的话
  rationale: מִלָּה的复数在此指所说的话；“你的话”直接、自然。
- source_word: בִרְכַּיִם
  choice: 膝盖
  rationale: 保留原文身体部位的具体意象。
- source_word: כֹּרְעוֹת
  choice: 发软的
  rationale: כרע可指弯下、屈膝或下沉；形容膝盖时表现因软弱而弯屈、支撑不住。“发软的膝盖”以自然汉语传达这一形象。
- source_word: תְּאַמֵּץ
  choice: 使……坚强
  rationale: אמץ的加强式表示使坚固、使有力量；此译保留使役意义，并与“使……站起来”形成诗歌上的对应。
theological_decisions: []
