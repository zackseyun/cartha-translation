base_translation:
  language: en
  yaml_path: translation/ot/job/004/010.yaml
  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: zh_hans
  text: 狮子的吼声，猛狮的声音；少壮狮子的牙齿都被折断[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被折断”也可译作“被拔掉”或“被扯掉”；希伯来语强调牙齿被强行除去或毁坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת אַרְיֵה
  choice: 狮子的吼声
  rationale: שַׁאֲגַת是表示狮子吼叫的构造式名词；“吼声”在现代汉语中自然、凝练，也保留诗歌意象。
- source_word: וְקוֹל שָׁחַל
  choice: 猛狮的咆哮
  rationale: קוֹל本义为“声音”，שָׁחַל是诗歌中指狮子的词，可能含强猛之意。译作“猛狮的咆哮”既与前句形成变化的平行，也符合汉语对狮子声音的自然表达。
- source_word: שִׁנֵּי כְפִירִים
  choice: 少壮狮子的牙齿
  rationale: כְפִירִים指年轻而有捕猎能力的狮子，并非幼小无力的幼崽；“少壮狮子”较准确地传达其年轻而强健的形象。
- source_word: נִתָּעוּ
  choice: 被折断
  rationale: 该被动完成式在这里描写牙齿遭暴力毁坏或拔除；“被折断”是清楚自然的主文译法，其他可能含义列入脚注。
- source_word: נִתָּעוּ（用于前两个并列成分）
  choice: 止息了
  rationale: 希伯来诗句把吼声、声音和牙齿并列在同一动词之下，形成省略兼轭式表达。汉语若把声音直译为“被折断”会十分生硬，因此按声音在语境中的结果译为“止息了”，同时保留三项力量一同被制伏的结构。
theological_decisions:
- issue: 狮子意象是否明确指代某一类人物或属灵势力
  choice: 保留为诗歌中的狮子意象，不在正文中明确其所指
  alternative: 把狮子解释为恶人、强暴者或某种属灵势力
  rationale: 本节本身没有明说对应对象；明确指代会把上下文可能的象征意义过早定死。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以分号呈现希伯来原文的兼轭式结构：声音“止息”，牙齿“折断”，避免不自然地说吼声被折断，同时保留三个并列狮子意象及其力量被消除的推进。
