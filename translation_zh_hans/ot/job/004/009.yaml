base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: zh_hans
  text: 因上帝的气息，他们灭亡[a][c]；因他怒气所发的风[b]，他们灭尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从上帝的气息而来，他们灭亡。”希伯来语介词既可表示来源，也可表示凭借的方式；正文按原因或作用方式理解。
    reason: lexical_alternative
  - marker: b
    text: “风”所译的希伯来语也可指“气息”或“灵”；这里指与他的怒气相连、带来毁灭的吹袭。
    reason: lexical_alternative
  - marker: c
    text: “灭亡”或译“被毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: 因……的气息
  rationale: נשמה指气息、呼吸，也可指作为生命力量的气；前缀מִן在此可表示来源或作用方式。“因……的气息”在现代汉语中自然，并保留致使关系和诗歌意象。
- source_word: אֱלוֹהַ
  choice: 上帝
  rationale: 这是《约伯记》中常见的单数诗体称谓，基本含义为“上帝”；不扩译为“全能的上帝”，以免加入原文没有的内容。
- source_word: יֹאבֵדוּ
  choice: 他们灭亡
  rationale: אבד的基本义是灭亡、毁灭；“灭亡”保留不及物语态，也与下半句形成诗歌平行。
- source_word: וּמֵרוּחַ
  choice: 因……所发的风
  rationale: רוּחַ可指风、气息或灵；在这里与前句“气息”平行，又同“怒气”相连，表示具有毁灭力量的吹袭。“风”保留原词的具体意象，并避免“灵”可能造成的神学误解。
- source_word: אַפּוֹ
  choice: 他的怒气
  rationale: אַף本义为鼻、鼻孔，也引申为怒气；本搭配主要表达上帝的愤怒。“怒气”清楚传达惯用义，而“所发的风”仍间接保留呼气般的拟人意象。
- source_word: יִכְלוּ
  choice: 他们消逝
  rationale: כלה在Qal词干中可表示终结、耗尽或消灭。“消逝”表达走向尽头的结果，并与“灭亡”相呼应，而不把意象限定为物质被烧尽。
theological_decisions:
- issue: 如何表达上帝发怒的拟人化语言
  choice: 将אַפּוֹ按惯用义译为“他的怒气”，同时以“所发的风”保留呼气吹袭的形象。
  alternative: 译为“他的鼻孔”或“他的烈怒”。
  rationale: 直译“鼻孔”会使现代读者难以把握希伯来语惯用义；“烈怒”则增加了强度。所选译法兼顾清楚、诗意和拟人意象，不加入额外的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留两行平行结构以及“气息／风”的诗歌意象；避免古奥的“鼻息”及可能引起误读的“灵”。
