  yaml_path: translation/ot/job/004/021.yaml
  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: zh_hans
  text: 他们里面的绳索[a]不是被拔起了吗？他们死去，却没有智慧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的绳索不是从他们身上被扯掉了吗？”传统译法作：“他们的尊荣不是从他们里面除去了吗？”希伯来文此处很可能沿用帐棚意象；“绳索”可指帐棚绳，也可能象征维系生命之物。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“未得智慧便死”或“死得并不明智”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 保留希伯来文反问语气，并自然地表达预期肯定的回答。
- source_word: נִסַּע
  choice: 被拔起
  rationale: 此动词常用于拔营或拔起帐棚相关物件；被动表达贴近原文，也保留帐棚意象。
- source_word: יִתְרָם
  choice: 他们……的帐棚绳
  rationale: 将 יֶתֶר 理解为绳索，结合上节帐棚般的居所意象，具体译作“帐棚绳”；但词义存在争议，故以脚注保留其他解释。
- source_word: בָּם
  choice: 他们里面
  rationale: 直译介词 בְּ 加复数后缀，保留绳索仿佛位于人里面、象征生命支撑的独特意象，不改释为较明确的“从他们身上”。
- source_word: יָמוּתוּ
  choice: 他们死去
  rationale: מות 是普通的“死”之意；采用直接、庄重的现代汉语。
- source_word: וְלֹא בְחָכְמָה
  choice: 却没有智慧
  rationale: “却”自然呈现语义转折，“没有智慧”保持原文简短和含混，不在正文中断定是“未得智慧便死”还是“死得不明智”。
theological_decisions:
- issue: “不在智慧中”的含义
  choice: 却没有智慧
  alternative: 未得智慧便死；死得并不明智
  rationale: 原文短语可涉及缺乏智慧、尚未获得智慧，或死得不明智；正文不替读者排除这些可能，脚注说明主要歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“帐棚绳”承接上下文的帐棚意象；保留“他们里面”这一略显陌生但有意象力量的原文表达。脚注标记按正文出现顺序排列。
