  yaml_path: translation/ot/job/004/002.yaml
  text: If one tries a word with you[a], will you be weary? But who can hold back words?
translation:
  language: zh_hans
  text: 若有人试着向你说句话[a]，你会厌烦吗？但谁能忍住不说呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若有人试着向你提一件事”。
    reason: דָבָר既可指所说的“话”，也可指所谈的“事情”；本句容许这两种相近理解。
lexical_decisions:
- source_word: הֲנִסָּה
  choice: 如果有人试着
  rationale: 该词在此表示尝试、冒昧开口，句首疑问词使全句成为试探性的问句；用“如果有人试着”既保留非特指的主语，也符合现代汉语表达。
- source_word: דָבָר
  choice: 说句话
  rationale: דָבָר既可指“话”，也可指“事情”。上下文紧接“言语”，这里以说话义为主；“说句话”自然地传达向约伯开口的意思，同时在脚注保留“提一件事”的可能。
- source_word: אֵלֶיךָ
  choice: 对你
  rationale: 直译为“向你”，此处表示以约伯为说话对象；“对你说句话”是自然、准确的现代汉语。
- source_word: תִּלְאֶה
  choice: 你会厌倦吗
  rationale: לאה的基本含义是疲乏、厌倦。此处不是身体劳累，而是听人说话可能感到疲惫或厌烦；“厌倦”保留疲乏义，又适合语境，避免把意义收窄为“生气”或“被冒犯”。
- source_word: וַעְצֹר
  choice: 然而，谁能忍住不说呢
  rationale: עצר表示约束、抑制。汉语“忍住不说”自然表达克制言语的意思；“然而”体现前后分句之间的转折张力。
- source_word: בְּמִלִּין
  choice: 不说
  rationale: 原文是“言语”的复数，结构上意为约束言语。汉语若直译“忍住言语”不自然，因此用“不说”表达克制话语，并与前句“说句话”形成呼应。
- source_word: מִי יוּכָל
  choice: 谁能
  rationale: 保留原文表示能力的反问形式，简洁自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的表达。首句保留以假设形式谨慎开口的语气；末句保留反问，不把“谁能”明确改写成“我不能”，以免消除原文的修辞含蓄。
