  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: zh_hans
  text: '他们在年少时丧命，

    他们的生命也在男性祭祀娼妓中终结[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在献身者中”。这个希伯来词很可能指与异教崇拜有关的男性祭祀娼妓。
    reason: 保留 קְדֵשִׁים 的较字面替代读法，同时说明正文采用的较可能语境性含义。
lexical_decisions:
- source_word: תָּמֹת
  choice: 消亡
  rationale: 该词是“死”的未完成式；以“消亡”配合“性命”作主语，既忠实表达死亡，也保留诗歌语体。
- source_word: בַּנֹּעַר
  choice: 在年少时
  rationale: נֹעַר 指青春、年少时期；“在年少时”自然表达早逝之意，不额外限定具体年龄。
- source_word: נַפְשָׁם
  choice: 他们的性命
  rationale: נֶפֶשׁ 在这里指人的性命，而非专指与身体分离的“灵魂”；保留其名词形式，以呈现原文两行的平行结构。
- source_word: וְחַיָּתָם
  choice: 他们的生命也……终结
  rationale: 此处表示他们的生命或一生；第二行没有明写谓语，但承接上行的“死”，汉语补出“终结”可使句意完整，同时明确这是由平行结构所隐含的意思。
- source_word: בַּקְּדֵשִׁים
  choice: 在男性庙妓中
  rationale: קְדֵשִׁים 是阳性复数，在相关经文中通常指参与异教祭祀性活动的男性庙妓。“男性庙妓”既保留性别信息，也避免传统译词可能带入的后世道德或身份分类。
theological_decisions:
- issue: קְדֵשִׁים 的所指
  choice: 男性庙妓
  alternative: 献身者（或分别为圣者）
  rationale: 该词字面上与“献身、分别为圣”有关，但希伯来圣经中的相关用法及本节的负面语境，更可能指与异教崇拜有关的男性庙妓。正文采用较可能的历史含义，脚注保留字面解释所形成的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，并以两行排列表现希伯来诗歌的平行结构。“性命／生命”有意对应原文两个近义名词；第二行补出“终结”，使汉语句法完整，但不改变其与上行“死”的平行关系。
