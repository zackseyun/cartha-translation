  text: הֵן פָּרַ֣שׂ עָלָ֣י/ו אוֹר֑/וֹ וְ/שָׁרְשֵׁ֖י הַ/יָּ֣ם כִּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: zh_hans
  text: 看哪，他把自己的光[b]铺展在它上面[a]，又遮盖海的根部[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他上面”。希伯来语代词为阳性单数，但所指对象没有明说；按上下文，也可能指云层或风暴景象。
    reason: alternative_reading
  - marker: b
    text: “光”也可理解为“闪电”或“光辉”。
    reason: lexical_alternative
  - marker: c
    text: 直译“海的根”，可能指海最深或作为根基的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意的语篇语气词；“看哪”既保留诗歌的庄重感，也符合现代中文圣经语体。
- source_word: פָּרַשׂ
  choice: 铺展
  rationale: 原词表示展开、铺开；“铺展”简洁自然，并保留光向外延伸的画面。
- source_word: עָלָיו
  choice: 在它上面
  rationale: 后缀为阳性单数，但所指对象没有明说；上下文谈到云层和风暴景象，正文用非人称“它”，同时以脚注保留“他”的可能。
- source_word: אוֹרוֹ
  choice: 自己的光
  rationale: אוֹר通常指“光”；物主后缀指向句子的主语。风暴语境中也可能特指闪电或光辉，故在脚注注明。
- source_word: וְשָׁרְשֵׁי הַיָּם
  choice: 又……海的根部
  rationale: 直译为“海的根”；“根部”保留希伯来诗歌的具体意象，同时可让读者理解为海最深或作为根基的部分。
- source_word: כִּסָּה
  choice: 遮盖
  rationale: 原词的基本义是覆盖、遮盖；这里采用现在时态的诗性叙述，不额外解释遮盖的方式。
theological_decisions:
- issue: עָלָיו所指对象不明确
  choice: 正文译作“它”，指向上下文中的云层或风暴景象
  alternative: “他”
  rationale: 希伯来语后缀仅标明阳性单数，并未在本节明确先行词；不把它解释为某个人，同时用脚注保存形式上可能的另一读法。
- issue: “光”在风暴语境中的含义
  choice: 正文保留宽泛的“光”
  alternative: “闪电”或“光辉”
  rationale: 正文遵循אוֹר的通常词义，避免把语境上的可能含义定死；脚注提示风暴意象中可能特指闪电。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“看哪”和“铺展”保留智慧诗歌的抬高语体；“海的根部”有意保存原文大胆的诗性比喻。所有语义不确定处均以脚注呈现，没有在正文中作教派性解释。
