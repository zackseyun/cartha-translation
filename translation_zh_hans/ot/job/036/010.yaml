  yaml_path: translation/ot/job/036/010.yaml
  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: zh_hans
  text: 他开启他们的耳朵，让他们听受管教[a]；又说，他们当离弃罪恶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“教导”或“纠正”。原文保留了教育与惩戒两方面的含义。
    reason: lexical_alternative
  - marker: b
    text: “罪恶”也可译作“罪孽”或“邪恶”；这个词在某些语境中也可指“祸患”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל
  choice: 开启
  rationale: גלה在此以“耳朵”为宾语，形成揭开、开启耳朵以使人听受的表达；“开启”既保留意象，也符合现代汉语。
- source_word: אָזְנָם
  choice: 他们的耳朵
  rationale: 希伯来文为单数名词加第三人称复数后缀，具有集合意义；汉语用“他们的耳朵”自然表达，不必机械保留单数。
- source_word: לַמּוּסָר
  choice: 使他们接受管教
  rationale: מוּסָר兼有教导、纠正和管束之意；结合本章借患难使人回转的语境，“管教”保留教育性与纠正性。介词ל与“开启耳朵”的搭配在汉语中以目的表达较清楚。
- source_word: וַיֹּאמֶר
  choice: 又吩咐
  rationale: אמר本义为“说”；后接表示所要求行动的从句时，“吩咐”自然传达其内容而不额外指定受话者。
- source_word: כִּי
  choice: （引出吩咐内容）
  rationale: 此处כִּי引出所说或所吩咐的内容，汉语无需另译连接词。
- source_word: יְשֻׁבוּן
  choice: 离弃
  rationale: שוב表示转回、回转；与מִן“从……”连用时，译作“离弃”能自然表达从罪恶中回转，同时保留道德劝诫的力度。
- source_word: מֵאָוֶן
  choice: 罪恶
  rationale: אָוֶן可指罪孽、邪恶，也可在其他语境指祸患；此处与回转相连，主要是道德意义，“罪恶”清楚而通俗。
theological_decisions:
- issue: 以利户话语中מוּסָר的性质
  choice: 管教，兼含教导与纠正
  alternative: 单纯的教导；或强调惩罚性的责打
  rationale: 上下文把苦难描写为使人听受教训并离开恶行的途径；“管教”保留教育与纠正之间的张力，不把苦难简化为纯粹惩罚。
- issue: מֵאָוֶן所指的范围
  choice: 罪恶
  alternative: 罪孽；邪恶；祸患
  rationale: “回转/离弃”在这里指向人的不义行为，故采用道德意义；脚注保留该词在其他语境可指“祸患”的词义幅度。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“开启他们的耳朵”保留希伯来诗歌的身体意象，并用“使他们接受管教”说明其功能；后半句以“吩咐……离弃”自然表达原文所说内容中的劝令意味。
