base_translation:
  language: en
  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: zh_hans
  text: 他借着苦难搭救受苦的人[a]，又借着压迫开启他们的耳朵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“他在困苦中搭救穷乏人。”相关希伯来词既可强调贫穷，也可强调困苦或受压迫。
    reason: lexical_alternative
  - marker: b
    text: “开启他们的耳朵”直译近于“揭开他们的耳朵”，是使人听从或领受教导的希伯来语表达。
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: 搭救
  rationale: 此处 חלץ 的 Piel 形表示从危险或困境中救出；“搭救”既保留主动施救之意，也符合现代汉语表达。
- source_word: עָנִי
  choice: 受苦的人
  rationale: עָנִי 可指穷乏、困苦或受压迫的人；本节与“苦难”和“压迫”平行，因此正文突出受苦、受压的含义，同时在脚注保留“穷乏人”的可能。
- source_word: בְעָנְיוֹ
  choice: 借着苦难
  rationale: 介词 בְּ 在这里很可能表示手段，即苦难成为搭救或管教发生的途径；“借着”保留这种工具性，也不排除“在苦难中”的处境性理解。
- source_word: וְיִגֶל
  choice: 开启
  rationale: גלה 本义为揭开、显露；与“耳朵”连用时是使人听从或领受教导的习语。“开启”在中文中自然，并保留原文意象。
- source_word: בַּלַּחַץ
  choice: 借着压迫
  rationale: לַחַץ 可表示压迫、压力或困境；此处与前半句的 בְּ 短语平行，“借着压迫”保留原文鲜明且可能具有工具性的说法。
- source_word: אָזְנָם
  choice: 他们的耳朵
  rationale: 马所拉文本为第三人称阳性复数后缀。前面的“受苦的人”可作集合性称呼，因此正文保留复数“他们的耳朵”。
theological_decisions:
- issue: 苦难是否被表述为上帝施行搭救和开启人耳朵的途径
  choice: 以“借着苦难……借着压迫”保留原文可能的工具性含义。
  alternative: 译作“在苦难中……在压迫中”，只把苦难视为搭救和教导发生的处境。
  rationale: 两个带 בְּ 的平行短语自然容许工具性理解。本译文保留以利户话语中苦难可成为施救和教导途径的张力，但不额外推论所有苦难本身都是善的、都是惩罚，或必然产生同样结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“搭救”清楚表达主动救援；“借着”保留原文介词可能具有的工具性。正文维持“受苦的人”这一集合性单数与“他们的耳朵”这一复数之间的原文张力，并用脚注交代词义和习语。
