base_translation:
  language: en
  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: zh_hans
  text: 因为我的话确实不虚假；一位知识全备的人正与你在一起。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那位知识全备的人正与你在一起。”这句话也可能指上帝，而不是以利户自己。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: 因为……确实
  rationale: כִּי承接上文，带有解释意味；אָמְנָם加强断言。合译为“因为……确实”，既保留语篇联系，也传达强调语气。
- source_word: לֹא שֶׁקֶר
  choice: 不虚假
  rationale: 直陈所说的话并非虚假；现代汉语自然、庄重，也不额外引入“欺骗”的主观动机。
- source_word: מִלָּי
  choice: 我的话
  rationale: 准确表达带第一人称后缀的复数名词，并符合汉语表达习惯。
- source_word: תְּמִים
  choice: 完备
  rationale: 该词在此与“知识”相联，重点是完整、无缺，而非宣称道德上无罪；“完备”可避免“完美”可能带来的过度神学化理解。
- source_word: דֵּעוֹת
  choice: 知识
  rationale: 希伯来语为抽象复数，汉语用单数集合概念“知识”更自然，同时保留其认知领域的含义。
- source_word: עִמָּךְ
  choice: 与你同在
  rationale: 保留介词“与、同”的基本意义以及对约伯的直接称呼；“同在”也维持原句关于此人身份的开放性。
theological_decisions:
- issue: “知识完备者”所指是谁
  choice: 正文采用不明说主语身份的“有一位知识完备者与你同在”，语境上可首先理解为以利户自指
  alternative: 也可能指上帝，即“那位知识完备者与你同在”
  rationale: 前半句以利户为自己的话作保证，因此自指是直接语境中的自然理解；但希伯来文没有明示主语身份，且“知识完备”可用于上帝，所以正文与脚注保留这项真实歧义。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“知识完备者”略带智慧文学的凝练感；避免用“全知者”，因为那会把原文的“完备于知识”强化为明确的神学称号。
