  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: zh_hans
  text: 看哪[a]，上帝伟大，我们并不知晓他[b]；他年岁的数目无从查考[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“确实”或“请看”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我们并不知道”，没有明说宾语；“他”由上下文补出。
    reason: implicit_object
  - marker: c
    text: 或译：“他年岁的数目无法探究。”末句原文直译为“没有查究（可言）”，与前面的“他年岁的数目”相连。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 该词引出强调性的宣告，并唤起听者注意；“看哪”保留了智慧诗歌庄重而有力的语气。
- source_word: אֵל
  choice: 上帝
  rationale: 这里是诗歌中对上帝的通常称呼，并非需要音译的专名；“上帝”清楚自然。
- source_word: שַׂגִּיא
  choice: 伟大
  rationale: 该形容词表达宏大、崇高或卓越；“伟大”既自然，也不把含义限缩为能力或地位。
- source_word: וְלֹא נֵדָע
  choice: 我们并不知晓他
  rationale: 希伯来文直译为“我们不知道”，宾语未明说；上下文以“上帝”为所指，中文补出“他”可避免语意悬空，同时“知晓”保留认知与无法充分认识之间的张力。
- source_word: מִסְפַּר שָׁנָיו
  choice: 他年岁的数目
  rationale: 直译并保留以“年岁”谈论上帝存续时间的诗性和拟人表达，不改写为系统神学术语“永恒”。
- source_word: וְלֹא חֵקֶר
  choice: 无从查考
  rationale: 原文名词性表达意为“没有查究/探究”；“无从查考”以自然中文表达无法探究到底，同时保留其诗歌凝练感。
theological_decisions:
- issue: וְלֹא נֵדָע中省略的宾语
  choice: 正文补出“他”，译作“我们并不知晓他”
  alternative: 严格保留省略，译作“我们并不知道”；或解释性译作“他超越我们的知识”
  rationale: 原文没有明说宾语，但紧接“上帝”，所指清楚。补出“他”符合现代汉语表达，又不将其扩展成较强的神学解释；脚注说明原文形式。
- issue: 上帝的“年岁”
  choice: 保留“他年岁的数目”
  alternative: 解释为“他的永恒”或“他的寿数”
  rationale: 原文用年岁数目这一诗性意象说明其存续不可测度。保留该表达，既不暗示上帝有有限寿命，也不以“永恒”取代原文尚存的诗性张力。
- issue: 末句不可探究的语法关系
  choice: 译作“他年岁的数目无从查考”
  alternative: 译作“无人能数算他的年岁”
  rationale: 原文强调没有查究、无法探寻，而不只是不能数数；“无从查考”更贴近 חֵקֶר 的调查、探究语义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧诗歌语体。“看哪”保留开头的强调作用；分号呈现两句并列而递进的结构。避免用“永恒”“不可知”等抽象神学术语取代原文具体的“年岁”和较含蓄的“不知晓”。
