  text: וְֽ/חַנְפֵי לֵ֭ב יָשִׂ֣ימוּ אָ֑ף לֹ֥א יְ֝שַׁוְּע֗וּ כִּ֣י אֲסָרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: zh_hans
  text: 但心中不敬虔的人[b]积存怒气；当他捆绑他们时[a]，他们不呼救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “当他捆绑他们时”也可译作“因为他捆绑他们”。希伯来语连词在这里既可能表示时间，也可能表示原因。
    reason: alternative_reading
  - marker: b
    text: “心中不敬虔的人”也可译作“内心虚伪的人”或“心中不虔诚的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: 心里不敬虔的人
  rationale: חנף可指不敬虔、亵慢或虚伪的人；在《约伯记》中重点更偏向对神不敬虔，而非一般的人际虚伪。译作“心里不敬虔”也保留לֵב所强调的内在品性。
- source_word: יָשִׂימוּ אָף
  choice: 积存怒气
  rationale: 直译“放置怒气”在现代汉语中生硬；“积存怒气”自然地表达把怒气蓄积、存留在心的意思，并保留原文意象。这里较自然地指这些人自身的怒气。
- source_word: לֹא יְשַׁוְּעוּ
  choice: 不呼求帮助
  rationale: שׁוע的强化词干通常指在困境中呼救；“呼求帮助”明确表达其求援含义，又不作过度发挥。
- source_word: כִּי
  choice: ……时
  rationale: 此处可按时间关系理解，即他们在受捆绑时也不求助；但כִּי也可表示原因“因为”，故将另一可能保留在脚注中。
- source_word: אֲסָרָם
  choice: 他捆绑他们
  rationale: אָסַר可指捆绑、拘禁或加上锁链。“捆绑”最直接且涵盖面较广。希伯来文动词为第三人称单数，语境中的主语自然指神，但正文仍保留“他”。
theological_decisions:
- issue: “他捆绑他们”中单数主语的所指
  choice: 保留代词“他”，由上下文指向神
  alternative: 明译为“神捆绑他们”
  rationale: 原文只有第三人称单数形式，没有在本节明说“神”。保留代词既忠于句法，也避免替原文消除语境性的含蓄。
- issue: “怒气”的归属
  choice: 理解为不敬虔之人积存在心的怒气
  alternative: 理解为他们为自己积蓄神的忿怒
  rationale: יָשִׂימוּ的主语是“心里不敬虔的人”，最直接的句法理解是他们蓄积或怀藏怒气；若解释为积蓄神的审判之怒，则需补入原文未明说的关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不敬虔”保留宗教与伦理色彩；“积存怒气”兼顾希伯来语意象和汉语可读性。正文脚注标记按所注词语就近安放。
