  text: אֲשֶֽׁר יִזְּל֥וּ שְׁחָקִ֑ים יִ֝רְעֲפ֗וּ עֲלֵ֤י אָדָ֬ם רָֽב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/028.yaml
  text: which the clouds pour down[a]; they drip abundantly on man.
translation:
  language: zh_hans
  text: 云彩将它倾下，沛然滴落在世人[a]身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为单数“人”（אָדָם），在这里泛指人类。
    reason: 说明原文单数形式及其集合性含义，防止“世人”被理解为原文复数。
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 其
  rationale: 关系词承接上一节所说的水滴；汉语用“其”保持从属和回指关系，避免把本节误作完全独立的新句。
- source_word: יִזְּלוּ
  choice: 倾下
  rationale: נזל在降雨语境中表示向下流淌；“倾下”既呈现下降动态，也符合现代汉语的云雨意象。
- source_word: שְׁחָקִים
  choice: 云彩
  rationale: 该词在这里指承载并降下雨水的云层；“云彩”自然、庄重，并切合诗歌语境。
- source_word: יִרְעֲפוּ
  choice: 降
  rationale: רָעַף表示滴下或如雨降下；“降”与前句“倾下”配合，保留雨水落下的画面，同时避免汉语中“滴得丰盛”之类不自然的组合。
- source_word: עֲלֵי
  choice: 在……身上
  rationale: 表达雨水从上而下落到人身上的空间关系，是自然的现代汉语说法。
- source_word: אָדָם
  choice: 世人
  rationale: 此处单数אָדָם作集合性、泛指用法，所指是人类；“世人”准确传达其普遍范围，又不误导为某一名男子。
- source_word: רָב
  choice: 沛然
  rationale: רָב在此作副词性用法，表示降水丰沛。“沛然”简洁地传达丰富、大量之意，并适合诗体语域。
theological_decisions:
- issue: אָדָם的集合性泛指
  choice: 世人
  alternative: 人／人类
  rationale: 希伯来文形式为单数，但在此泛指全人类。中文“世人”既保留人的称谓，也明确其集合范围，不需把它限定为男性个体。
translation_notes:
  register: 采用简洁、庄重的现代诗体。“倾下—沛然降下”的雨水意象忠实于两个相近而不完全相同的动词；主句保留与上一节的回指关系。
