  yaml_path: translation/ot/job/036/024.yaml
  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: zh_hans
  text: 要记得颂扬他的作为[a]；人们曾歌颂这作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人们曾看见这作为”，又或“人们曾凝视这作为”。希伯来语 שֹׁרְרוּ 含义难定；有人认为这里不是指歌唱，而是指观看。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: 要记得
  rationale: 阳性单数祈使式，直接劝告约伯；“要记得”自然保留命令语气。
- source_word: כִּי
  choice: （以汉语句法隐含其内容引介功能）
  rationale: 此处引出应当记住的内容；现代汉语无需机械译成“就是”。
- source_word: תַשְׂגִּיא
  choice: 尊崇
  rationale: 使役式在此有使之为大、颂扬之意；“尊崇他的作为”既保留劝勉力度，也符合庄重自然的汉语。
- source_word: פָעֳלוֹ
  choice: 他的作为
  rationale: פֹּעַל 可指工作、行为或所成就之事；“作为”涵盖上帝的行动，且不过度具体化。
- source_word: אֲשֶׁר
  choice: 为此
  rationale: 关系词连接“他的作为”与后句；汉语用“为此”自然表达人们以该作为为歌唱内容。
- source_word: שֹׁרְרוּ
  choice: 曾……歌唱
  rationale: 按传统及诗歌语境理解为歌唱、颂唱；该词也可能与观看或凝视有关，因此在脚注保留异读。
- source_word: אֲנָשִׁים
  choice: 人们
  rationale: 此处泛指世人；现代汉语“人们”自然准确，无须用可能被误解为仅指男性的“男人们”。
theological_decisions:
- issue: “他的作为”中第三人称阳性单数后缀的所指
  choice: 保留“他的”，由上下文指向上帝
  alternative: 明译为“上帝的作为”
  rationale: 希伯来文使用代词，上下文已明确所指；保留代词可避免添加原文未明说的名词。
- issue: שֹׁרְרוּ 的词义
  choice: 歌唱
  alternative: 观看／凝视
  rationale: 正文采用传统且符合诗歌语境的理解，同时以脚注诚实保留词形和词义上的困难，不消除原文歧义。
- issue: אֲנָשִׁים 的泛指范围
  choice: 人们
  alternative: 男人们／世人
  rationale: 希伯来文阳性复数在此具有代表性、泛指用法；汉语“人们”不改变其人类主体的意义，也避免产生仅限男性的额外含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要记得……，人们曾……”保留劝勉与诗体色彩；脚注明示关键动词的真实词义歧义。
