base_translation:
  language: en
  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
translation:
  language: zh_hans
  text: 他不保全恶人的性命[a]，却使困苦人得到公正[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不让恶人存活。”
    reason: lexical_alternative
  - marker: b
    text: “困苦人”也可译作“贫穷人”或“受压迫的人”；希伯来语此词可指卑微、受苦、受压迫或经济贫困的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  choice: 让……存活
  rationale: 此处使役形表达使某人继续活着、保全其性命，并非复活意义上的“使活过来”。“不让……存活”自然地传达“不保全其生命”。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 原文虽为单数，却可作类称；汉语“恶人”既可泛指此类人，也保留简洁的诗体表达。
- source_word: מִשְׁפָּט
  choice: 正义
  rationale: 这里指困苦人所得的公正结果或应有权利，而不只是审判这一行为；结合“伸张”可自然表达其含义。
- source_word: עֲנִיִּים
  choice: 困苦人
  rationale: 该词可涵盖受苦、受压、卑微或贫穷的人。“困苦人”较宽泛，不把含义限于经济贫困。
- source_word: יִתֵּן
  choice: 伸张
  rationale: 原义为“给”，但汉语通常说“为某人伸张正义”；这既保留受益对象，也准确表达给予公正裁断的意思。
- source_word: וּ
  choice: 却
  rationale: 连词字面可译“并且”，但上下两句形成明显对照；“却”能自然呈现这一语篇关系。
theological_decisions:
- issue: יְחַיֶּה是否应译成带有复活或赋予生命神学含义的措辞
  choice: 译为“不让……存活”，表示今生中的保全或继续生存
  alternative: “不使……活过来”或“不赐……生命”
  rationale: 上下文谈论上帝公义的治理：他不保全恶人，却为困苦人伸张正义。复活式译法会加入本节并未要求的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伸张正义”是自然汉语搭配；以脚注保留“存活/保全性命”及“困苦/贫穷/受压迫”的词义幅度。
