  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
translation:
  language: zh_hans
  text: 但你心中充满了恶人的审判[a]；审判和公正紧紧抓住你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶人的审判”也可理解为“恶人所受的审判”，或“恶人式的判断”；希伯来原文的属格关系十分凝练，不能完全确定。
    reason: alternative_reading
  - marker: b
    text: “紧紧抓住你”也可译作“扶持你”或“托住你”；原文动词可指支撑、维持或抓住，且没有明说宾语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דִין רָשָׁע מָלֵאתָ
  choice: 但你满怀恶人的判词
  rationale: 将וְ按上下文译为转折性的“但”；מָלֵאתָ保留“充满”的比喻，以自然的“满怀”表达。דִין רָשָׁע结构高度凝练，“恶人的判词”保留其既可指恶人所受判决、也可指与恶人相关之判断的歧义。
- source_word: דִּין
  choice: 判决
  rationale: 第二分句保留司法语域，并与前句“判词”形成词根上的语义呼应；中文若机械重复同一词会较生硬。
- source_word: וּמִשְׁפָּט
  choice: 与公正
  rationale: מִשְׁפָּט可指审判、公理或司法秩序；译作“公正”既区别于דִּין，也保留平行关系。
- source_word: יִתְמֹכוּ
  choice: 紧紧抓住你
  rationale: תמך可表示扶持、托住或抓住；本句语境偏向不利于约伯，故正文采用“抓住”，但以脚注保存“扶持”的可能。希伯来文没有明说宾语，中文为成句补出语境所指的“你”。
theological_decisions:
- issue: “恶人的判词”所表达的关系
  choice: 正文保留压缩式属格表达
  alternative: “你所受的审判与恶人相同”或“你满心都是恶人的判断”
  rationale: 原文דִין רָשָׁע可能指恶人所受的审判，也可能指恶人式的判断或诉讼立场；不在正文中单一定论。
- issue: יִתְמֹכוּ是扶持还是抓住
  choice: “紧紧抓住你”
  alternative: “扶持你”或不补宾语的“牢牢维持”
  rationale: 动词本身兼有支撑和抓持义，且无明示宾语。上下文的警告语气支持负面的“抓住”，但脚注明确保留正面或中性的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“满怀”保留原文“充满”的形象；“判词／判决／公正”维持司法语域。脚注标记按正文出现顺序排列。
