base_translation:
  language: en
  yaml_path: translation/ot/job/036/023.yaml
  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
translation:
  language: zh_hans
  text: 谁曾为他指定道路？又有谁说：“你行了不义”[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义”或译“错事”“不公正的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 疑问代词引出修辞问句；“谁”直接、自然。
- source_word: פָקַד
  choice: 规定
  rationale: 此词可表示委派、指定、吩咐或监管。与“他的道路”和介词短语连用时，“规定”较自然地表达为上帝设定或指派行程、做法的意思，同时避免过度释义。
- source_word: עָלָיו
  choice: 为他
  rationale: 介词 עַל 在此与 פקד 连用，可表达针对某人作出指定或安排；汉语“为他规定”最为通顺。
- source_word: דַּרְכּוֹ
  choice: 他的道路
  rationale: דֶּרֶךְ 可指道路、路径或行事方式；“道路”保留具体与比喻两层含义。
- source_word: וּמִי
  choice: 谁
  rationale: 连接第二个并列的修辞问句。汉语无需机械译出连接词，直接以“谁”起句更自然。
- source_word: אָמַר
  choice: 曾说
  rationale: 完成式置于修辞问句中，表达“有谁曾经这样说过”；“曾说”简洁地体现这一意味。
- source_word: פָּעַלְתָּ
  choice: 你行了
  rationale: 该动词意为做、行或施行；与 עַוְלָה 搭配时，“行了”符合汉语的道德指控表达。
- source_word: עַוְלָה
  choice: 不义
  rationale: 此词指不公、错误或不正之事。“不义”既能涵盖道德上的错，也保留司法与公正层面的含义。
theological_decisions:
- issue: 阳性代词后缀及第二人称动词的所指
  choice: 按上下文理解为上帝：没有谁能为他规定道路，也没有谁能指控他行了不义。
  alternative: 泛指一位有权势的统治者或人物。
  rationale: 约伯记36:22–23的上下文正在颂述上帝的伟大与公义，因此这些代词在语境中指向上帝；正文不额外添加“上帝”，以保留原文的代词表达。
- issue: פָקַד עָלָיו דַּרְכּוֹ 的语义关系
  choice: 为他规定他的道路
  alternative: 因他的道路而指控他；监管他的道路。
  rationale: פָקַד 语义宽广。此处优先采用“规定”，与前文上帝无可比拟、无人能教导他的主题相合；另一个可能的指控义不在正文中强行排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个修辞问句保持简洁有力；保留“他的道路”的原文意象，并以“规定”传达无人能为上帝指定行事道路。正文中的脚注标记[a]与脚注相对应。
