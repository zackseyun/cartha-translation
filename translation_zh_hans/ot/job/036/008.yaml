base_translation:
  language: en
  yaml_path: translation/ot/job/036/008.yaml
  text: And if they are bound in chains[a], caught in cords of affliction[b],
translation:
  language: zh_hans
  text: 若他们被锁链捆住[a]，被患难的绳索缠住[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被锁链捆住”也可译作“被镣铐束缚”。
    reason: lexical_alternative
  - marker: b
    text: “患难”也可译作“困苦”“悲惨”或“贫穷”；希伯来语原词可随语境表达这些含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 若
  rationale: 引出条件从句；汉语“若”自然简洁。连接词 וְ 在上下文中可由语句衔接体现，不必机械译作“并且”。
- source_word: אֲסוּרִים
  choice: 被……捆住
  rationale: 保留 אסר 被动分词的动作和被动含义，不将其名词化为“囚犯”。
- source_word: בַּזִּקִּים
  choice: 被锁链
  rationale: זִקִּים 指锁链、镣铐等束缚物；“锁链”是现代汉语中清楚自然的表达，并保留具体的拘束意象。
- source_word: יִלָּכְדוּן
  choice: 被困
  rationale: 保留 לכד 的尼法勒被动含义；“被困”既能配合绳索意象，也不强行限定为字面上的被捕。
- source_word: בְּחַבְלֵי
  choice: 在……的绳索中
  rationale: חבל 可指绳、索或捆绑物；“绳索”保留具体隐喻，并与前半句的锁链形成平行。
- source_word: עֹנִי
  choice: 苦难
  rationale: עֹנִי 可指困苦、患难、悲惨或贫穷；此处“苦难”涵盖较广，不武断地缩窄为经济贫困。
theological_decisions:
- issue: 束缚意象的性质
  choice: 保留锁链与绳索的具体意象，同时容许其指向苦难或管教
  alternative: 将其解释为纯粹字面的囚禁，或完全改译成抽象的逆境
  rationale: 原文用语具体，但上下文谈论上帝对受苦之人的作为；译文不强行裁定其只可按字面或只可按隐喻理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来诗歌的平行结构；两个脚注标记均置于正文相应词语之后。
