  yaml_path: translation/ot/job/036/029.yaml
  text: Can anyone understand the spreading of the clouds[a], the thunderings of his shelter?
translation:
  language: zh_hans
  text: 谁能明白云层的铺展，以及他帐幕的轰鸣呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף אִם
  choice: 谁又能……呢
  rationale: 该组合在这里引出反问。译为“谁又能……呢”符合现代汉语，也保留了无人能够完全参透这些现象的挑战意味。
- source_word: יָבִין
  choice: 明白
  rationale: בין 表示理解、辨明；“明白”自然通顺，又不额外限定理解的方式。
- source_word: מִפְרְשֵׂי
  choice: 铺展
  rationale: 该词指铺开、展开；名词化的“铺展”保留云层展开的动态画面。
- source_word: עָב
  choice: 云彩
  rationale: 原文虽为单数形式，却可集合性地指云团或云层；“云彩”在诗歌语境中自然，也不强行规定云的形态。
- source_word: תְּשֻׁאוֹת
  choice: 轰鸣
  rationale: 该词可指巨响、喧响、轰响，并非专门表示雷的术语；“轰鸣”既适合风暴语境，也保留其较宽泛的声音含义。
- source_word: סֻכָּתוֹ
  choice: 他帐幕中
  rationale: סֻכָּה 指棚、遮蔽处或帐幕；这里以诗意形象描写神被风暴云层环绕的所在。“帐幕”保留具体隐喻，“中”则自然表达声音由此传出或在其中响起。
theological_decisions:
- issue: “他帐幕”中第三人称阳性单数后缀的所指
  choice: 理解为指神，以云层环绕之处比作他的帐幕
  alternative: 理解为较笼统地指风暴或云层自身的遮蔽处
  rationale: 上下文描述神掌管天气的奇妙作为，因此指向神最符合语篇；译文保留代词和帐幕隐喻，不进一步解释，从而避免排除其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“云彩的铺展”保留希伯来诗歌的动态意象；“帐幕中的轰鸣”保留原文隐喻及词义张力，不把声音过度明确为雷声。
