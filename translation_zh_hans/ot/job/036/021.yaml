  text: הִ֭שָּׁמֶר אַל תֵּ֣פֶן אֶל אָ֑וֶן כִּֽי עַל זֶ֝֗ה בָּחַ֥רְתָּ מֵ/עֹֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: zh_hans
  text: 你要谨慎，不可转向罪恶[a]，因为你选择了这个，而不是苦难[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪恶”所译的希伯来词也可译作“邪恶”“奸恶”，或可能译作“祸患”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“因为你选择了这个，胜过苦难”。“苦难”也可译作“困苦”或“苦楚”。本句警告约伯，不可选择作恶来取代他正在承受的苦难。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: 你要谨慎
  rationale: 该词是שׁמר的尼法勒命令式，在这里表示警告、告诫。“你要谨慎”自然地保留了命令语气。
- source_word: אַל תֵּפֶן
  choice: 不可转向
  rationale: אַל加未完成式构成禁令；פנה在此表示转向某事。“不可转向”简洁并保留原文的方向性意象。
- source_word: אֶל אָוֶן
  choice: 转向罪恶
  rationale: אָוֶן可指罪恶、邪恶、奸恶，也可指祸患；本句是道德劝诫，以“罪恶”最符合语境，同时用脚注保留词义歧义。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前述警告的理由，译作“因为”清楚自然。
- source_word: עַל זֶה
  choice: 这个
  rationale: 介词与指示词的组合回指刚提到的事，直译为“这个”可避免擅自补明所指，并保留原文略显突兀的表达。
- source_word: בָּחַרְתָּ
  choice: 你选择了
  rationale: בחר的第二人称阳性单数完成式表示已经作出的选择；“你选择了”保留其完成体意义。
- source_word: מֵעֹנִי
  choice: 而不是苦难
  rationale: עֹנִי在约伯记语境中主要指苦难、困苦；前缀מ־在这里表达比较或取舍关系，因此译作“而不是苦难”。
theological_decisions:
- issue: “这个”所指的内容
  choice: 保留“这个”，让它自然回指“罪恶”
  alternative: 明确译作“罪恶”或“这条路”
  rationale: 原文使用指示词זֶה而未重复名词。保留指示表达既让读者可按上下文理解，又不把原文未明说的内容写死。
- issue: 选择罪恶与承受苦难之间的比较
  choice: 因为你选择了这个，而不是苦难
  alternative: 因为你宁愿犯罪，也不愿受苦
  rationale: 替代译法更顺畅，却加入了“宁愿”和“不愿”等心理描写。正文保留原文较直接且带张力的责备，脚注说明比较关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要谨慎，不可……”保持以利户警告的严肃语气；后半句尽量贴近希伯来文的简洁结构，并以脚注解释其比较关系和词义范围。
