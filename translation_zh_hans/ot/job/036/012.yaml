source:
  edition: WLC
  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: zh_hans
  text: 但他们若不听从，就必死于刀下，并在无知中断气[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因缺乏知识而死。”
    reason: 原文可理解为描述他们死时“没有知识”的状态，也可理解为说明死亡的原因。
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上一节并引出相反条件；“但……若”自然表达语境中的转折。
- source_word: לֹא יִשְׁמְעוּ
  choice: 不听从
  rationale: שׁמע兼有听见、听取和顺从之意；“听从”在现代汉语中保留听取并响应指教的含义，又不把意思缩减为单纯听见。
- source_word: בְּשֶׁלַח
  choice: 死于刀下
  rationale: שׁלח在这里指致命兵器，传统和语境支持“刀剑”；“死于刀下”是自然、庄重的汉语表达。
- source_word: יַעֲבֹרוּ
  choice: 死
  rationale: עבר本义为经过、逝去，在审判语境中委婉表示死亡；汉语用“死于刀下”清楚传达其语境意义。
- source_word: וְיִגְוְעוּ
  choice: 并……断气
  rationale: גוע指气绝、死亡；“断气”既保留其具体意象，也与前句的“死”形成平行而避免机械重复。
- source_word: כִּבְלִי דָעַת
  choice: 在无知中
  rationale: 该短语可表示死亡时处于无知的状态，也可能带有因缺乏知识而死的因果意味；正文保留状态义，脚注列出因果义。
theological_decisions:
- issue: שׁמע是仅指听见，还是包含顺从回应
  choice: 不听从
  alternative: 没有听见；不顺服
  rationale: 上下文涉及人对上帝教导的回应。“听从”涵盖聆听与响应，同时不把经文限定为单纯听觉或更强的教义化“顺服”。
- issue: כִּבְלִי דָעַת表达原因还是临终状态
  choice: 在无知中
  alternative: 因缺乏知识
  rationale: 希伯来语结构自然容许状态义，但因果义也真实可取；正文不武断消除歧义，以脚注保存另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“刀下”传达兵器致死的意象；“断气”保留希伯来语 גוע 的具体表达。脚注标记已置于正文相关短语之后。
