  text: וְ/אַ֤ף הֲסִיתְ/ךָ֨ מִ/פִּי צָ֗ר רַ֭חַב לֹא מוּצָ֣ק תַּחְתֶּ֑י/הָ וְ/נַ֥חַת שֻׁ֝לְחָנְ/ךָ֗ מָ֣לֵא דָֽשֶׁן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: zh_hans
  text: 他也引你离开困境之口[a]，进入宽阔之地，那里毫无拘束[b]；你桌上所摆的，满是肥美的食物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困境之口”也可译作“苦难的口”或“狭窄之处的口”。希伯来文把困苦与狭窄的意象结合起来，与下文的“宽阔之地”相对。
    reason: lexical_alternative
  - marker: b
    text: 本短语的希伯来文含义较难确定；直译可作“其下没有逼仄之处”，也可译作“那里毫无限制”。
    reason: textual_difficulty
  - marker: c
    text: 希伯来文直译为“满了肥美”，指丰盛、肥美的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: 他也
  rationale: וְאַף兼有承接、增添和强调作用；“也”自然承接上文，不额外强化到原文未必要求的程度。
- source_word: הֲסִיתְךָ
  choice: 引你
  rationale: 该动词可表示诱导、吸引或使人转离。此处方向是从困境进入宽阔之地，“引你”既符合语境，也避免“引诱”在现代汉语中过强的负面意味。
- source_word: מִפִּי צָר
  choice: 离开困境之口
  rationale: 保留פֶּה“口”的具体诗歌意象；צַר兼有困苦、窘迫和狭窄之意，与下文“宽阔”形成对照。
- source_word: רַחַב
  choice: 宽阔之地
  rationale: 保留由狭窄转入宽广空间的核心意象，并用现代汉语中自然、庄重的表达呈现。
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: 脚下毫无拘束
  rationale: מוּצָק在此意义困难，语境指向没有逼迫、狭窄或限制；补出“脚下”自然表达תַּחְתֶּיהָ的空间关系。
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: 你桌上所摆的
  rationale: נַחַת罕见且解释不一；结合“桌”理解为摆下或陈设之物，既保持含蓄，也使汉语句意连贯。
- source_word: מָלֵא דָשֶׁן
  choice: 满是肥美佳肴
  rationale: דָּשֶׁן字面为“肥脂、肥美”，在筵席语境中表示丰盛的食物；此译保留肥美意象，同时符合现代汉语习惯。
theological_decisions:
- issue: הֲסִיתְךָ未明说的主语
  choice: 正文保留“他”，不直接补作“上帝”
  alternative: 译作“上帝引你”
  rationale: 上下文可将主语理解为上帝，但本节希伯来文仅以第三人称阳性单数动词表示主语；保留“他”让上下文辨明所指，避免把解释直接写入正文。
- issue: 困境与宽阔之地的空间隐喻
  choice: 保留“困境之口”“宽阔之地”和“脚下”的空间图像
  alternative: 意译为“使你脱离苦难，得到自由安舒”
  rationale: 原诗的张力来自狭窄、吞噬般的困境与宽广空间之间的对照；保留意象比抽象释义更忠实。
- issue: הֲסִיתְךָ的完成性及语境关系
  choice: 用无显式时体标记的“引你”
  alternative: 译作“曾引你”或“本要引你”
  rationale: 希伯来语形式可被直读为已发生的动作，但语境也可能带劝说或条件色彩；现代汉语不标明时体，可避免在这一张力上作过度裁定。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。正文保留希伯来诗歌的空间与筵席意象；对“困境之口”这种略显陌生但有意象价值的表达，以脚注辅助理解。
