  yaml_path: translation/ot/job/036/009.yaml
  text: then he declares to them their deeds and their transgressions[a], that they have acted arrogantly.
translation:
  language: zh_hans
  text: 他便把他们的行为和过犯告诉他们，说明他们如何妄自尊大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“他们自显强大”或“他们逞强”；按上下文，这里很可能指自我抬高、傲慢自大。
    reason: 保留 יִתְגַּבָּרוּ 的“显强／强大”意象及其在本语境中很可能具有的自我高举意味。
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 他便……说明
  rationale: נגד 的使役式常指“告诉、说明、使人知道”。“说明”既保留揭示之意，也符合现代汉语表达；“便”顺畅体现上下文连续关系中的 וַ־。
- source_word: לָהֶם
  choice: 向他们
  rationale: 准确表达介词 לְ 与第三人称复数后缀所标示的间接对象。
- source_word: פָּעֳלָם
  choice: 他们的行为
  rationale: פֹּעַל 可指工作、行动或所做之事；本节与“过犯”并列，具有道德语境，因此译作“行为”比“工作”自然准确。
- source_word: וּפִשְׁעֵיהֶם
  choice: 和过犯
  rationale: פשע 常指越界、悖逆权威的罪行。“过犯”保留其严肃的道德含义，又不额外限定为某种特定形式的叛逆。
- source_word: כִּי
  choice: 指出
  rationale: 此处 כִּי 最可能引出所说明的内容。汉语用“指出”连接后一分句，可自然呈现“说明……他们曾……”的内容关系；也存在将其理解为原因连接词的可能。
- source_word: יִתְגַּבָּרוּ
  choice: 他们曾妄自尊大
  rationale: גבר 的 Hitpael 形式字面涉及使自己强大或表现强势；在“过犯”的道德语境中，很可能指自我抬高、傲慢逞强。“妄自尊大”保留负面的自我高举含义，脚注同时交代较直译的可能。
theological_decisions:
- issue: יִתְגַּבָּרוּ 的道德意味
  choice: 译为“妄自尊大”
  alternative: “使自己强大”“逞强”“占了上风”
  rationale: 本节说上帝揭明人的行为和过犯，因此该动词较可能不是中性地描述力量增长，而是责备人的自我抬高。不过原文的“强大”意象仍在脚注中保留，避免把语义张力完全消除。
- issue: כִּי 与前句的关系
  choice: 视为引出所揭明的内容
  alternative: 理解为因果关系：“因为他们……”
  rationale: 在“说明/告知”类动词之后，כִּי 可自然引出内容；但因果理解在语法上并非不可能。正文采用较顺畅的内容关系，不据此引申额外神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“行为和过犯”简洁保留原文并列结构；“妄自尊大”表达责备意味，但以脚注保留原词可能具有的较字面读法。
