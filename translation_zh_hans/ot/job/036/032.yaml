  text: He covers his hands with lightning[b][a], and commands it to strike the mark.
translation:
  language: zh_hans
  text: 他以闪电遮住双手[a]，又吩咐它击中目标[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “闪电”原文直译为“光”；结合上下文的风暴景象，这里很可能指闪电。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾的希伯来文含义和句法都难以确定。也可理解为“针对它所击中的对象”，或与“攻击者”“代求者”有关。
    reason: alternative_reading
lexical_decisions:
- source_word: כַּפַּיִם
  choice: 双手
  rationale: כַּף 的双数形式可指双掌或双手；“双手”在现代汉语中自然，也保留了诗歌中的身体意象。
- source_word: כִּסָּה
  choice: 遮住
  rationale: כסה 意为遮盖、隐藏；“遮住”保留具体意象，不额外解释这一比喻。
- source_word: אוֹר
  choice: 闪电
  rationale: 该词通常意为“光”，但上下文描写风暴，在此很可能指闪电；脚注保留其字面义。
- source_word: וַיְצַו
  choice: 命令
  rationale: צוה 意为命令、吩咐；此译法保留上帝对闪电的主动支配。
- source_word: עָלֶיהָ
  choice: 它
  rationale: 阴性代词所指并不完全明确，可能回指诗歌意象中的闪电；汉语用“它”自然，同时不强行界定其语法所指。
- source_word: בְמַפְגִּיעַ
  choice: 击中目标
  rationale: 此形式源于 פגע，含义与句法均困难。在风暴语境中，将其理解为引导闪电击中目标最为连贯，但其他可能读法列入脚注。
theological_decisions:
- issue: בְמַפְגִּיעַ 是否应译作“代求者”
  choice: 正文按风暴语境译为“击中目标”
  alternative: 攻击所击之物；攻击者；代求者
  rationale: 该词可由 פגע 的不同语义引出多种理解。正文采用与闪电意象连贯的读法，但以脚注明示原文困难，避免将“代求者”这一可能带有神学联想的释义写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以双手遮住闪电”保留原文突出的诗歌意象；“击中目标”使风暴场景清楚可懂，同时以脚注保存末语的真实歧义。
