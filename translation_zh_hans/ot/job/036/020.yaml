  yaml_path: translation/ot/job/036/020.yaml
  text: Do not long for the night[a], when peoples are taken away from their place.
translation:
  language: zh_hans
  text: 不要渴望黑夜[a]，那时众民从原处被挪去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“不要渴望黑夜，众民要在他们之下上去。”希伯来文在此含义晦涩；“上去”与“在他们之下”（也可能指“代替他们”）的具体关系及“他们”的所指均不确定。正文“从原处被挪去”采用一种常见的上下文理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: אַל与未完成式连用，表达禁止；“不要”自然准确。
- source_word: תִּשְׁאַף
  choice: 渴望
  rationale: שׁאף可指喘息般切望或热切盼望；以“黑夜”为宾语时，“渴望”符合现代汉语表达。
- source_word: הַלָּיְלָה
  choice: 黑夜
  rationale: 保留定冠词名词所指的特定“夜”；“黑夜”也自然承接本节的险恶语境。
- source_word: לַעֲלוֹת
  choice: 那时……被挪去
  rationale: עלה的不定式结构在此意义困难；正文采用常见的语境理解，以时间关系和被动移除之意表达，同时在脚注保留字面歧义。
- source_word: עַמִּים
  choice: 众民
  rationale: 该复数指多个群体或民族；“众民”既保留群体复数感，也比“人民们”自然。
- source_word: תַּחְתָּם
  choice: 从原处
  rationale: תחת字面为“在……下面”，此处常被理解为从所在位置被移除；“从原处”简洁表达这一可能语境义。
theological_decisions:
- issue: 黑夜及众民被移除的具体所指
  choice: 不在正文中明确解释为死亡、审判或灾难
  alternative: 将“黑夜”直接释为死亡之夜或审判之夜
  rationale: 希伯来文本本身表达晦涩，未明确限定其神学所指；译文应保留这种张力，避免加入经文没有明说的解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“渴望黑夜”保留原文突兀意象；正文求通顺，脚注则呈现 לַעֲלוֹת עַמִּים תַּחְתָּם 的字面困难与真实歧义。
