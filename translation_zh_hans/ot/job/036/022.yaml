  yaml_path: translation/ot/job/036/022.yaml
  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: zh_hans
  text: 看哪，上帝凭自己的大能高居至上[a]；谁像他一样作教师呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝在自己的能力中高居至上。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“谁能像他那样教导呢？”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 这是引人注意的语气词；“看哪”既保留诗歌的庄重语气，也符合现代中文圣经文体。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是指称上帝的普通神圣称号，并非专名；“上帝”在现代标准普通话中自然明确。
- source_word: יַשְׂגִּיב
  choice: 显为崇高
  rationale: שׂגב 的使役词干在此表达高超、崇高或不可企及；“显为崇高”保留其动态意味，同时不把经文限定为单纯的状态描述。
- source_word: בְּכֹחוֹ
  choice: 以他的大能
  rationale: 介词 ב 可表示凭借、方式或范围；正文采用自然的工具性表达“以”，并以脚注保留描述性理解。
- source_word: מִי כָמֹהוּ
  choice: 谁能像他那样
  rationale: 保留希伯来文比较式反问的力量，表达无人可与上帝相比。
- source_word: מוֹרֶה
  choice: 教导人
  rationale: 该词可作分词“教导的”或名词“教师”；正文采用现代中文较自然的动词表达，脚注保留名词性句法。
theological_decisions:
- issue: 上帝的崇高与能力之间的关系
  choice: 译为“以他的大能显为崇高”，表达上帝的崇高借其能力彰显。
  alternative: 可理解为“在他的大能中崇高”，强调崇高状态及其能力范围。
  rationale: 希伯来文介词 ב 及动词 יַשְׂגִּיב 容许方式、凭借或状态方面的细微差别；正文不扩展为更具体的系统神学命题。
- issue: מוֹרֶה 的分词或名词理解
  choice: 正文用动词式“像他那样教导人”。
  alternative: 名词式“谁是像他一样的教师呢？”
  rationale: 两者都符合希伯来文形式；正文选择更自然的现代汉语，脚注保留其可能的名词性表达和比较结构。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“看哪”保留诗体的呼告色彩；“显为崇高”避免过度口语化，也保留原文动词的动态意味。反问句采用动词式表达以求自然，并用脚注呈现较贴近原文形式的名词式译法。
