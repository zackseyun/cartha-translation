  yaml_path: translation/ot/job/036/027.yaml
  text: For he draws up the drops of water[a]; they distill rain from his mist.
translation:
  language: zh_hans
  text: 因为他吸起水滴[a]；它们从他的雾气中凝结成雨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半句的希伯来文较难，也可译作：“它们从他的水汽中降下雨来。”“雾气”也可译作“水汽”。
    reason: 保留 יָזֹקּוּ 和 לְאֵדוֹ 在词义及句法上的其他合理理解。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，说明上帝伟大作为的缘由；“因为”自然表达解释或因果关系。
- source_word: יְגָרַע
  choice: 吸取
  rationale: 该动词通常有“减少、取走”之意；在此气象语境中，指上帝取走或吸取水滴。“吸取”既保留基本动作，也符合水汽上升的图景。
- source_word: נִטְפֵי מָיִם
  choice: 水滴
  rationale: 准确简洁地表达“水的滴点”，符合现代汉语习惯。
- source_word: יָזֹקּוּ
  choice: 凝成
  rationale: זקק可涉及滤出、提炼或流出；这里希伯来文较难。“凝成”按气象图景表达水滴形成雨，同时不采用过于技术化的措辞。
- source_word: מָטָר
  choice: 雨
  rationale: 这是该名词最直接、自然的普通话对应词。
- source_word: לְאֵדוֹ
  choice: 从他的雾气中
  rationale: אֵד可指雾气或水汽；前缀ל在此用法不明确，译作来源关系可使诗句连贯，并保留第三人称阳性单数后缀指向上帝。
theological_decisions:
- issue: לְאֵדוֹ中第三人称阳性单数后缀的所指
  choice: 译为“他的雾气”，以后缀指上帝
  alternative: 理解为非人称的“其中的雾气”，或按校勘、改读译作“它们的雾气”等
  rationale: 上下文以神及其治理受造界为主题，保留马所拉文本的单数后缀并理解为指神，最贴合当前话语，也不增加经文之外的神学断言。
- issue: 第二分句的气象过程
  choice: 译作“水滴从他的雾气中凝成雨”
  alternative: 译作“它们从他的水汽中降下雨来”或“它们为他的雾气滤出雨水”
  rationale: 原文动词及介词关系较难确定；正文采用连贯且符合诗意气象图景的理解，脚注保留“降下”和“水汽”等可能性，避免把疑难处绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吸取水滴”保留诗歌形象；“凝成雨”使第二行自然清楚。正文中的[a]与脚注对应。
