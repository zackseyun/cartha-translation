  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: zh_hans
  text: 他们若听从、事奉[a]，就必在福乐中度尽他们的日子，在欢愉中度过他们的年岁。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从”也可译作“聆听”或“听而顺服”；同一个希伯来语动词可随语境兼有聆听和顺服的意味。
    reason: lexical_alternative
  - marker: b
    text: “在福乐中度尽他们的日子，在欢愉中度过他们的年岁”也可译作“在美善中度过他们的日子，在悦人的事物中度过他们的年岁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出条件从句，保留以利户陈述中直接的条件意味。
- source_word: יִשְׁמְעוּ
  choice: 听从
  rationale: שׁמע既可指听见、听取，也可含顺服之意；“听从”自然表达回应性的聆听，同时不把它强化为完全顺服。
- source_word: וְיַעֲבֹדוּ
  choice: 事奉他
  rationale: עבד的基本义为服事；上下文所指对象是神，中文补出“他”以使表达自然。“事奉”既涵盖忠诚服事，又不局限于礼仪性的敬拜。
- source_word: יְכַלּוּ יְמֵיהֶם
  choice: 度尽一生
  rationale: כלה的皮伊勒词干在这里与“日子”连用，指度过、走完人生；“度尽一生”既保留完成之意，也符合现代中文习惯。
- source_word: בַּטּוֹב
  choice: 在福乐中
  rationale: טוב在此作名词用，表示良好、兴盛的生活境况；“福乐”较“繁荣”更宽，不把含义限于物质财富。
- source_word: וּשְׁנֵיהֶם
  choice: 岁月
  rationale: 与前面的“日子”构成诗体平行；中文采用“岁月”保持庄重而自然的表达。
- source_word: בַּנְּעִימִים
  choice: 在欢愉中
  rationale: נְעִימִים是复数形式，可指种种悦人之事或概括性的愉悦境况；“欢愉”保留其诗意和语义宽度。
theological_decisions:
- issue: 本节是否应被译成顺服必然带来今世物质繁荣的绝对教义
  choice: 按以利户话语中的条件句直接翻译，表达良好而欢愉的生活境况，但不在译文中将其普遍化。
  alternative: 将其解释为顺服总会带来物质富足，或反过来完全属灵化为内心福分。
  rationale: 希伯来文陈述的是以利户在智慧论述中的条件性主张。翻译应保留其字面力度及全书中的神学张力，不替说话者扩大或修正论断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“日子—年岁”在中文中调整为“一生—岁月”，保留希伯来诗歌的平行关系并避免生硬直译；“福乐—欢愉”对应两个介词短语，保持诗意。脚注标记均在正文中出现。
