  text: כָּל אָדָ֥ם חָֽזוּ ב֑/וֹ אֱ֝נ֗וֹשׁ יַבִּ֥יט מֵ/רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/025.yaml
  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: zh_hans
  text: 世人都看见了它[a]；凡人从远处观看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“世人都看见了他。”希伯来语代词为阳性单数，可指上帝，也可指上文所说上帝的作为；上下文较支持后一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל אָדָם
  choice: 世人都
  rationale: כָּל与集合意义的אָדָם合用，泛指全体人类。“世人都”在现代汉语中自然、庄重，也保留了概括性。
- source_word: חָזוּ
  choice: 看见了
  rationale: חזה表示看见、观看，有时含凝视意味；此处完成式陈述人类已经目睹，译作“看见了”准确自然。
- source_word: בוֹ
  choice: 它
  rationale: 该阳性单数代词在语法上也可指“他”，但上下文更可能回指上文所说上帝的作为，因此正文译作“它”，并用脚注保留另一种可能。
- source_word: אֱנוֹשׁ
  choice: 凡人
  rationale: אֱנוֹשׁ泛指人，并常带有必死、脆弱之人的意味；“凡人”既体现这一语感，又与前句“世人”形成诗歌平行。
- source_word: יַבִּיט
  choice: 观看
  rationale: נבט的使役词干在此表示注目、观看；“观看”比单纯的“看”更能传达有意识地望着之意，又不显古奥。
- source_word: מֵרָחוֹק
  choice: 从远处
  rationale: מִן加רָחוֹק表示从远方或在远处；“从远处”简洁自然，并保留空间距离的意象。
theological_decisions:
- issue: בוֹ所指的是上帝还是上帝的作为
  choice: 正文作“它”，理解为上文所述上帝的作为
  alternative: “他”，理解为上帝本人
  rationale: 希伯来语阳性单数代词本身容许两种理解；就近处语境而言，上文的“作为”更可能是所指，但不能排除指向上帝本人的读法，故以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“世人”与“凡人”对应两个不同的希伯来语人称名词；“只能”用来表达人在远处观看所隐含的受限视角，但不把该限制进一步解释为特定神学结论。
