  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: zh_hans
  text: 要提防愤怒，免得它诱使你讥讽[a]；也不要让巨额赎价[b][c]使你偏离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得它诱使你拍手”。译作“讥讽”的希伯来词含义不确定，较字面的意思可能是击掌或拍手，也可能指以这种动作表示嘲弄。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不要让赎价之巨使你偏离。”希伯来语也可将“大／多”理解为着重说明赎价的数额或分量。
    reason: alternative_reading
  - marker: c
    text: “赎价”也可理解为“赎罪的代价”或“补偿金”；在某些语境中也可指“贿赂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留其因果或说明作用，并以破折号承接后面的警告；“因为”也可理解为“原来／因为”，不把上下文关系解释得过死。
- source_word: חֵמָה
  choice: 愤怒
  rationale: 该词表示强烈、炽烈的怒气。“愤怒”自然且有力度，同时不明说这是约伯的愤怒、上帝的震怒，还是泛指怒气。
- source_word: פֶּן
  choice: 要当心，免得
  rationale: 既表达警戒语气，也保留对可能后果的否定性提醒。
- source_word: יְסִיתְךָ
  choice: 它引诱你
  rationale: 使役词形可表示煽动、诱惑或使人走偏；“引诱”适合此处对错误反应的警告。
- source_word: בְסָפֶק
  choice: 去讥讽
  rationale: 这是疑难词，可能与击掌或拍手有关，并可能指带有嘲弄意味的动作。正文采用符合语境的“讥讽”，较字面的可能性收入脚注。
- source_word: וְרָב
  choice: 巨额的
  rationale: 与后面的“赎价”合译，表达数额巨大；这是自然的现代汉语说法，同时不排除将其理解为“赎价之多／之大”。
- source_word: כֹּפֶר
  choice: 赎价
  rationale: 该词可指为免除后果而付的赎金、补偿价，也可能在某些语境中指贿赂。“赎价”覆盖面较广，避免正文过度限定。
- source_word: אַל יַטֶּךָּ
  choice: 不要让……使你偏离正道
  rationale: 保留 נטה 所含的转离、偏向之意；补出“正道”使汉语表达完整，但没有具体指定偏离的对象或方式。
theological_decisions:
- issue: “愤怒”的所指
  choice: 仅译为“愤怒”，并以代词“它”回指，不明确其主体
  alternative: “上帝的震怒”或“你的愤怒”
  rationale: 希伯来文本没有明说怒气属于谁；上下文容许不同理解，因此正文保留这种神学与语境上的张力。
- issue: “赎价”的具体性质
  choice: 采用较宽泛的“赎价”
  alternative: “赎罪价”或“贿赂”
  rationale: 原词语义范围较宽，不能仅凭本节确定其为礼仪性的赎罪代价或非法贿赂，故不在正文中作单一化解释。
translation_notes:
  register: 采用现代、庄重而可懂的书面普通话。破折号保留原句突兀而强烈的警告结构；分号区分两项劝诫。正文不擅自确定“愤怒”的主体，也不把 כֹּפֶר 限定为某一特定神学或法律概念。
