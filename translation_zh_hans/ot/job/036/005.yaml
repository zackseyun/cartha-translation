  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: zh_hans
  text: 看哪[a]，上帝大有能力，并不轻看[b]；他大有心力[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“的确”。
    reason: lexical_alternative
  - marker: b
    text: “不轻看”也可译作“不厌弃”或“不拒绝”；原文没有明说动作的对象。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“心的力量”；可指心智、悟性或坚定的意志。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 作为强调性的引介词，既保留诗歌中唤起注意的语用功能，也符合现代中文圣经体裁的庄重语气。
- source_word: אֵל
  choice: 上帝
  rationale: 此处是诗体中对神的一般称呼，不必扩展为带有额外含义的称号。
- source_word: כַּבִּיר
  choice: 大有能力／刚强有力
  rationale: 该词表达强大、伟大；中文依两个位置的句法分别译出，保留重复的“有力”语义，同时避免生硬复现。
- source_word: וְלֹא יִמְאָס
  choice: 却不藐视人
  rationale: מאס可指藐视、厌弃或拒绝；原文未明说宾语。正文补出泛指的“人”以使中文完整自然，并用脚注说明原文的省略与其他可能译法。
- source_word: כֹּחַ לֵב
  choice: 内心刚强有力
  rationale: 直译为“心的力量”。לֵב可涵盖内心、心智、悟性和意志；正文保留“心”的意象而采用自然中文表达，脚注列出可能含义。
theological_decisions:
- issue: “不藐视”所省略的宾语
  choice: 正文作“不藐视人”，并注明原文没有明说宾语
  alternative: 不藐视／不厌弃／不拒绝；或将宾语理解为特定对象
  rationale: 希伯来文不限定对象，不宜把它缩窄为某一类人；中文补出泛指的“人”只为句意顺畅，脚注保留原文的开放性。
- issue: כֹּחַ לֵב的含义
  choice: 内心刚强有力
  alternative: 心智有力／悟性深广／意志坚定
  rationale: 该短语含义凝练，既可能涉及理解力，也可能涉及坚定的意志。正文保留“心”的源语意象，不将其固定为单一神学解释。
- issue: 连接词וְ的语义关系
  choice: 译作“却”
  alternative: 和／并且
  rationale: 上下文形成让步性张力：上帝虽强大，却不因强大而藐视人。“却”自然呈现这种语义关系，但不改变两个分句的基本并列。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“看哪”保留强调性的篇章标记；分号呈现两组平衡陈述。正文避免将“心”单义化，同时以脚注交代省略宾语和短语的真实歧义。
