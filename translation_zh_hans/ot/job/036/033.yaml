base_translation:
  language: en
  yaml_path: translation/ot/job/036/033.yaml
  text: Its thunder declares concerning him[a]; the cattle also[b], concerning what is rising.
translation:
  language: zh_hans
  text: 雷声述说他的事[a]；牲畜也述说那正在升起的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文很难理解。这里译为“雷声”的词，按通常解法可直译为“他的朋友”；不少人根据上下文把它理解为风暴的响声。相关短语直译为“关于他”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“牲畜也述说那正在升起的风暴。”末语很可能指正在逼近的风暴，但希伯来文只说“那正在升起的”。
    reason: alternative_reading
lexical_decisions:
- source_word: יַגִּיד
  choice: 传报
  rationale: נגד 的使役式表示“宣告、告知、使人知道”。“传报”既符合诗体语气，也能自然地用于雷声预示某事。
- source_word: עָלָיו
  choice: 关于他的事
  rationale: 介词 עַל 加第三人称阳性单数后缀可表示“关于他”，也可能有“针对他”的意思。译文采用中性的“关于他的事”，不明确补出“来临”或其他未明说的内容。
- source_word: רֵעוֹ
  choice: 雷声
  rationale: 此词形非常难解；按通常词形可直解为“他的朋友”，但在雷暴语境中常被理解为响声或雷声。正文采用语境上较通顺的“雷声”，并在脚注保留字面可能。
- source_word: מִקְנֶה
  choice: 牲畜
  rationale: 该名词通常指牲畜或家畜，虽也可泛指财产；在风暴将至、动物有所反应的语境中，“牲畜”更合适。
- source_word: אַף
  choice: 也
  rationale: 该语气词在此扩展前句所说的传报者，用“也”自然表达并列递进。
- source_word: עַל
  choice: 关于
  rationale: 保留介词“关于”的中性关系，不把它具体解释为因果、敌对或空间关系。
- source_word: עוֹלֶה
  choice: 那正在升起的
  rationale: עלה 的主动分词意为“正在上升、升起的”；原文未明说所指为何，故采用名词化表达，保留其开放性，不在正文直接补作“风暴”。
theological_decisions:
- issue: 代词“他”所指及雷声与他的关系
  choice: 保留“关于他”的含混说法
  alternative: 译作“雷声传报他的来临”或明确说“上帝的雷声”
  rationale: 上下文很可能指上帝及其临近的风暴，但本节希伯来文本身没有明说“来临”，也没有在本句直接写出“上帝”；不宜将语境推断写成明文。
translation_notes:
  register: 采用现代、庄重而简洁的诗体。正文尽量保留这节希伯来文的省略和含混；以脚注说明“他的朋友”和“风暴”等主要解释可能。
