  text: אֶשָּׂ֣א דֵ֭עִ/י לְ/מֵ/רָח֑וֹק וּ֝/לְ/פֹעֲלִ֗/י אֶֽתֵּֽן צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/003.yaml
  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: zh_hans
  text: 我要从远方带来我的知识，把公义归给我的创造者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“公正”。
    reason: צֶדֶק可指正直、公义，也可包含公正、司法上的正当；此处保留可行的语义侧重。
lexical_decisions:
- source_word: אֶשָּׂא
  choice: 取来
  rationale: נשׂא的基本义是“举起、携带、承载”。与“我的知识”和表示远方的短语连用时，“取来”自然表达从远处带来知识，同时保留原文的携带意象。
- source_word: דֵעִי
  choice: 我的知识
  rationale: דֵּעַת表示知识、认识或理解；第一人称单数后缀明确表示“我的”。直译为“我的知识”可保留以利户原话的语气，不弱化为“意见”。
- source_word: לְמֵרָחוֹק
  choice: 从远方
  rationale: 该短语表示遥远之处；在与נשׂא构成的语境中，通常理解为知识的来源，即“从远方”。由于介词表达也可能被理解为朝向远方，另一方向性读法收入脚注。
- source_word: וּלְפֹעֲלִי
  choice: 给我的创造者
  rationale: פֹעֵל本义为“做事者、制作者”，带第一人称单数后缀，在这里指创造说话者的那一位。“我的创造者”既准确又庄重，并避免添加原文没有的称号。
- source_word: אֶתֵּן
  choice: 归给
  rationale: נתן本义为“给”。以“公义”为宾语、以创造者为间接对象时，“归给”在现代汉语中自然表达承认并宣告某种属性属于他，也保留“给予”的基本意象。
- source_word: צֶדֶק
  choice: 公义
  rationale: צֶדֶק可指公义、公正或正直。此处论及创造者的品格与作为，“公义”能保留较宽的道德和司法含义；“公正”作为可行译法列入脚注。
theological_decisions:
- issue: 如何翻译指向上帝的צֶדֶק
  choice: 公义
  alternative: 公正
  rationale: 原词既可强调道德上的正直，也可强调审判和行事上的公正。正文采用范围较宽的“公义”，不排除司法含义；脚注保留“公正”，避免消除原文的语义张力。
- issue: 如何表达פֹעֲלִי所指的上帝
  choice: 我的创造者
  alternative: 造我的那一位
  rationale: 上下文表明此词指造说话者的上帝，但原文使用的是“做成者/制造者”而非专名或“主”的称号。因此译作“我的创造者”，既清楚传达所指，又不额外加入称谓。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“取来我的知识”略带原文的具体携带意象，避免过度意译为“发表见解”；“我的创造者”清楚而不添加“主”等原文没有的称号。
