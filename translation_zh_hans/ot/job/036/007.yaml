base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: zh_hans
  text: 他不把目光从义人身上移开，却使他们与君王一同坐在宝座上，直到永远；他们便被高举。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半句的希伯来文十分凝练，也可理解为：“至于坐在宝座上的君王，他使他们永远坐着；他们便被高举。”末句也可理解为“他使他们高举”。
    reason: alternative_reading
lexical_decisions:
- source_word: יִגְרַע
  choice: 移开
  rationale: גרע本指减少、除去；以“他的双眼”为宾语时，是“不把目光移开”的具体意象。“移开”既自然，也保留原文拟人化表达。
- source_word: מִצַּדִּיק
  choice: 从义人身上
  rationale: 单数“义人”在此可作类称；中文“义人”能够自然涵盖泛指含义，不必限定为某一个男子。
- source_word: עֵינָיו
  choice: 双眼
  rationale: 保留希伯来文具体的身体意象，不抽象改写为“眷顾”或“关注”。
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: 却使他们与君王同坐宝座
  rationale: 原句高度凝练，有限动词要到下一分句才出现。这里把“与君王”和“宝座”连入“使他们坐下”，使中文通顺，同时保留义人获授王者尊荣的图景。
- source_word: וַיֹּשִׁיבֵם
  choice: 使他们……坐
  rationale: ישׁב的使役式表示“使坐下、安置就座”。译作“使……同坐”比“使登基”少一层解释，也更贴近词形。
- source_word: לָנֶצַח
  choice: 直到永远
  rationale: ל加נֶצַח表示持续不止的久远时段；“直到永远”庄重而自然。
- source_word: וַיִּגְבָּהוּ
  choice: 他们就升高了
  rationale: 按WLC元音，动词是גבה的复数形式，以“他们”为主语，表示地位升高；直译“升高”也保留诗歌意象。
theological_decisions:
- issue: 上帝注视义人的拟人化表达
  choice: 保留“不从义人身上移开双眼”
  alternative: 不停止眷顾义人
  rationale: 原文以“眼”描绘上帝持续的关注。保留具体意象可避免把诗歌语言过早解释成抽象神学术语。
- issue: 王座分句中“他们”的所指
  choice: 理解为前文泛指的“义人”
  alternative: 理解为“君王”
  rationale: “义人”虽为单数形式，却可作集合性类称，并自然承接复数代词。原文句法紧凑，另一种理解仍值得在脚注中说明。
- issue: 末句动作的主语与语态
  choice: 译为“他们就升高了”
  alternative: 他使他们升高
  rationale: WLC所标元音支持复数主语“他们”；因此正文不把上帝补作该动词的语法主语，也不改为使役语态。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“义人”“宝座”“直到永远”符合圣经诗歌语域；“移开双眼”“同坐”保持具体画面。正文只设一个脚注，标记[a]已在主文出现。
