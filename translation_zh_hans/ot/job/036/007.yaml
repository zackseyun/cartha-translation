  to: 他不把目光从义人身上移开，却使他们与君王一同坐在宝座上，直到永远；他们便被高举。[a]
  rationale: 修订使汉语表达更自然，并以“被高举”传达末句在诗歌上下文中的尊荣提升含义。脚注保留王座分句中“他们”可指君王的可能，并补充末句可按上帝为隐含主语理解的语法可能性；正文不强行消除原文的紧凑与歧义。
