  yaml_path: translation/ot/job/036/002.yaml
  text: Bear with me a little, and I will show you, for there are still words for God.
translation:
  language: zh_hans
  text: 请稍等我片刻，我就向你说明，因为我还有话要为上帝说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  choice: 请稍等我片刻
  rationale: כַּתַּר在此是请求对方等候、容许说话；לִי表达“为我／容我”，זְעֵיר意为“一点、片刻”。译文自然传达礼貌请求。
- source_word: וַאֲחַוֶּךָּ
  choice: 我就向你说明
  rationale: 该使役形动词有“告知、宣示、说明”之意；上下文是以利户继续陈述论证，译作“说明”贴合语境。
- source_word: כִּי עוֹד לֶאֱלוֹהַּ מִלִּים
  choice: 因为我还有话要为上帝说
  rationale: 字面结构为“因为还有给／为上帝的话”。לְ可表达归属、关联或代表；结合说话者继续为上帝申辩的语境，译作“为上帝说”较自然，同时不扩充具体内容。
theological_decisions:
- issue: לֶאֱלוֹהַּ所表示的关系
  choice: 为上帝说
  alternative: 论到上帝的话／上帝还有话
  rationale: 希伯来语介词לְ本身容许多种关系。此处主语未明说，但紧接36:3“将公义归给造我的主”，较支持以利户表示自己仍有话要代表上帝一方陈说；采用“为上帝说”，但不译成更强的“奉上帝之命”，以免增加启示权威的含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“请稍等我片刻”保留请求语气；“我就向你说明”顺应汉语叙述；“上帝”对应 אֱלוֹהַּ。
