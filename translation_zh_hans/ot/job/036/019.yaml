base_translation:
  language: en
  yaml_path: translation/ot/job/036/019.yaml
  text: Will your cry avail when distress comes[b][a], or all the exertions of your strength?
translation:
  language: zh_hans
  text: '患难来到时，你的呼求岂能奏效？[a][b]

    你竭尽全力又岂能奏效？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的财富岂能使你免于患难？你一切竭力的努力又如何？”
    reason: alternative_reading
  - marker: b
    text: 本节希伯来文含义艰深，尤其是这里译作“你的呼求”和“患难来到时”的词语。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: 岂能奏效
  rationale: ערך本义可指“排列、安排”，但在这句高度凝练且意义艰深的诗句中，很可能表示“有用、足以应付”。译作“岂能奏效”既保留反问语气，也自然表达所倚靠之物是否管用。
- source_word: שׁוּעֲךָ
  choice: 你的呼求
  rationale: 马所拉文本的元音支持将此词理解为“求助的呼喊、呼求”。“呼求”比“呼喊”更能体现向外求助的意思；“财富”作为另一种解释收入脚注。
- source_word: לֹא בְצָר
  choice: 在患难中
  rationale: 希伯来文直译近于“不在困境中”，但句法与含义均有争议。正文按上下文将בצר理解为困境情形，并不在中文正文中硬译否定词；另一种保留否定结构的解释见脚注。
- source_word: וְכֹל מַאֲמַצֵּי כֹחַ
  choice: 你竭尽全力
  rationale: 该短语结合“用力、努力”与“力量”两个概念。中文“竭尽全力”自然凝练，并与前半句形成第二个同样无效的凭借；重复“岂能奏效”使省略谓语的诗行关系清楚。
theological_decisions:
- issue: 人在患难中凭呼求或自身力量是否足以脱困
  choice: 以两个平行反问表达二者都不能奏效
  alternative: 将后半句理解为陈述“以及你所有强大的努力”
  rationale: 希伯来诗句以连词连接两个可能的资源。按修辞关系译成平行反问，不额外说明神学原因，也不引入经文未明说的教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奏效”准确表达是否能发挥作用；分作两个平行诗行，并重复反问谓语，以呈现希伯来诗歌的修辞力度。正文脚注标记依次排列为[a][b]。
