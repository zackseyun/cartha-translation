  text: כִּי בָ֭/ם יָדִ֣ין עַמִּ֑ים יִֽתֶּן אֹ֥כֶל לְ/מַכְבִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: zh_hans
  text: 因为他借着这些[a]审判众民，又赐下丰盛的食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”原文为复数代词，具体所指没有明说；按上下文，可能指云雨、闪电等自然现象。
    reason: 说明代词指向存在真实歧义，避免译文暗中指定唯一所指。
lexical_decisions:
- source_word: בָם
  choice: 借着这些
  rationale: 保留希伯来语复数代词及其指代上的含混；结合上文，它可能指云雨、闪电等自然现象，但本节没有明确说明。
- source_word: יָדִין
  choice: 审判
  rationale: 采用该动词常见的司法性含义，并保留神借同一自然力量施行审判与供应食物之间的张力。
- source_word: עַמִּים
  choice: 众民
  rationale: 体现原文复数，指不同的人民或族群。
- source_word: יִתֶּן אֹכֶל לְמַכְבִּיר
  choice: 又赐下丰盛的食物
  rationale: 自然表达原文“赐食物至丰盛/大量赐下食物”的意思；“赐下”也符合从天降雨而供应食物的语境。
theological_decisions:
- issue: 同一自然现象兼具审判与供应的作用
  choice: 并列保留“审判众民”与“赐下丰盛的食物”
  alternative: 将“审判”弱化为“治理”，或把两句解释为不同手段
  rationale: 原文直接并列神的审判与供养，未化解二者的张力；译文不替原文作神学调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“借着这些”忠实保留复数指代；“丰盛的食物”比“许多食物”更自然，也准确传达大量供应之意。
