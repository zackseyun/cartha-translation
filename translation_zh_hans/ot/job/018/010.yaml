  naturalness: 原译整体通顺、庄重。“圈套”在现代汉语中常优先指骗人设计，虽可用于实体捕具，却不如“陷阱”直接、明确，也更容易使读者误解为抽象诡计。
  terminology: 将 מַלְכֻּדְתּוֹ 译为“陷阱”更贴合此处具体的猎捕图像，也与英文审校轨迹的“trap”相符。“绳索”“地里”“路上”均合适。脚注可保留“绳子”和“罗网／圈套”等词汇替代，但应避免把原文的“隐藏”改写为更强的“埋伏”。
