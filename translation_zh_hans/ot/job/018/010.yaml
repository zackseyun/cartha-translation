  text: His rope is hidden in the ground[a], and his trap on the path.
translation:
  language: zh_hans
  text: 他的绳索藏在地里[a]，他的陷阱设在路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的绳子藏在地里，他的圈套设在路上。”
    reason: 保留 חַבְלוֹ 可译为“绳子”以及 מַלְכֹּדֶת 可译为“圈套／陷阱”的词义选择。
lexical_decisions:
- source_word: טָמוּן
  choice: 藏在
  rationale: 该词是טמן的被动分词，表达被隐藏、埋伏的状态；“藏在”自然简洁，并保留被遮蔽的含义。
- source_word: בָּאָרֶץ
  choice: 地里
  rationale: אֶרֶץ可指地、土地或大地；在设置捕具的语境中，“地里”最能表达绳索被藏于地面的具体景象。
- source_word: חַבְלוֹ
  choice: 他的绳索
  rationale: חבל可指绳或索，此处应是捕具所用的绳索；“绳索”清楚、庄重，也不把其功能解释得过死。
- source_word: וּמַלְכֻּדְתּוֹ
  choice: 他的圈套
  rationale: מַלְכֹּדֶת表示捕捉用的陷阱或罗网；“圈套”既保留捕具意象，又符合现代汉语诗性语境。
- source_word: עֲלֵי נָתִיב
  choice: 设在路上
  rationale: 该短语表示捕具位于人行的路径上；汉语补出“设”可自然连接“圈套”和地点，而不改变原意。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“绳索—圈套—路上”的具体意象与本段连续出现的捕捉意象相呼应；不额外说明捕具的运作方式，以免消除原诗的含蓄性。
