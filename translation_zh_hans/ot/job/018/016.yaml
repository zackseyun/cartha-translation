  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: zh_hans
  text: '他的根必在下面枯干，

    他的枝条[a]必在上面被剪除。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的嫩枝”。原词通常指“收成”或“所收割之物”；这里与“根”相对，似乎指植物在地面以上、可被剪除的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּחַת
  choice: 在下面
  rationale: 保留与下半句“在上面”的空间对举；介词中的“从”在汉语里不必硬译，以免“从下面枯干”显得生硬。
- source_word: שָׁרָשָׁיו
  choice: 他的根
  rationale: 原文是带第三人称阳性单数后缀的复数名词；现代汉语以集合意义的“根”即可自然表达复数。
- source_word: יִבָשׁוּ
  choice: 必……枯干
  rationale: 该动词表示变干、枯干；“枯干”准确保留植物意象。“必”体现本段诗歌中未完成式所表达的将临结局，但不把它处理成时间点明确的预言。
- source_word: וּמִמַּעַל
  choice: 在上面
  rationale: 与“在下面”构成鲜明而简洁的上下平行结构；连接关系由分行和逗号自然呈现。
- source_word: יִמַּל
  choice: 必……被剪除
  rationale: 此处动词表达被割下、剪除；“被剪除”既保留受事意义，也延续植物的图像，避免误译成单纯“枯萎”。
- source_word: קְצִירוֹ
  choice: 他的枝条
  rationale: 该词通常与收割、所割之物有关，但在这里与“根”平行，指植物地面以上被割下的生长部分。“枝条”在汉语中清楚自然，同时以脚注保留词义上的不确定性。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以两行保持希伯来诗歌“下面／上面”和“根／枝条”的平行。用“枯干／被剪除”区分原文两个不同动词，没有为追求整齐而都译作“枯萎”。
