  text: לֹ֘א נִ֤ין ל֣/וֹ וְ/לֹא נֶ֣כֶד בְּ/עַמּ֑/וֹ וְ/אֵ֥ין שָׂ֝רִ֗יד בִּ/מְגוּרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/019.yaml
  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: zh_hans
  text: 在他的族人中，他没有子嗣，也没有后代[a]；在他寄居过的地方，也无一人存留[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代”或作“孙辈”。“子嗣”和“后代”这对希伯来语词强调其后裔完全断绝。
    reason: lexical_alternative
  - marker: b
    text: “寄居过的地方”也可译作“住处”或“聚居地”；原文既可指寄居之处，也可泛指居住之地。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: 子嗣
  rationale: 该词指所生的后裔或子孙。“子嗣”既保留后代之意，也能与下一个词形成并列，表达家系断绝。
- source_word: נֶכֶד
  choice: 后代
  rationale: 该词可特指孙辈，也可在与 נִין 并列时泛指延续下去的后裔。“后代”使整组表达自然，并保留彻底断绝子孙的语力；具体的“孙辈”列入脚注。
- source_word: בְּעַמּוֹ
  choice: 在他的族人中
  rationale: עַם 指他所属的群体或人民；此处译作“族人”比“人民”更贴合个人在其群体中的家系语境，同时不把范围缩窄为直系亲属。
- source_word: שָׂרִיד
  choice: 无一人存留
  rationale: שָׂרִיד 指灾祸之后留下或幸存的人。采用汉语惯用的否定表达，清楚传达没有任何存留者，且避免“余民”可能带有的特定神学色彩。
- source_word: בִּמְגוּרָיו
  choice: 在他寄居过的地方
  rationale: מָגוּר 可指寄居之处，也可泛指住所或聚居地。正文采用“寄居过的地方”以呈现该词与寄居相关的基本色彩，同时用脚注保留“住处”等可能解释。
theological_decisions: []
