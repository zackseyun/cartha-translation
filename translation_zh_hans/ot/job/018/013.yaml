  yaml_path: translation/ot/job/018/013.yaml
  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: zh_hans
  text: 它吞噬他皮肤的各部分；死亡的长子[a]吞噬他的肢体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死亡的长子”也可作“死之长子”；这可能是对最致命的灾病或死亡的首要使者的诗意人格化称呼。
    reason: 说明“死亡的长子”（בכור מות）这一有争议的诗歌隐喻所容许的理解，同时不在正文中限定其所指。
lexical_decisions:
- source_word: יֹאכַל
  choice: 吞噬
  rationale: 该词是 אכל 的 Qal 未完成式第三人称阳性单数，在此比喻毁灭性的侵蚀；“吞噬”既保留强烈的诗歌画面，也可容纳首行未明说的主语。
- source_word: בַּדֵּי / בַּדָּיו
  choice: 肢体
  rationale: בדים 在身体语境中可指身体的部分或肢体。采用“肢体”体现受灾者身体被侵蚀的意象，并在两个诗行中保持同词复现。
- source_word: עוֹרוֹ
  choice: 他的皮肤
  rationale: עוֹר 通常指皮肤或皮；此处按人体受苦的语境译作自然的“他的皮肤”。
- source_word: בְּכוֹר מָוֶת
  choice: 死亡的长子
  rationale: 直译这一醒目的属格诗歌表达，保留其人格化意象与解释上的开放性，不将其限定为某种具体疾病或灾祸。
theological_decisions:
- issue: בְּכוֹר מָוֶת 的含义
  choice: 正文保留“死亡的长子”这一诗歌表达，将其呈现为实施毁灭的拟人化力量。
  alternative: 最致命的疾病；最可怕的死亡；死亡的首要使者
  rationale: 希伯来文的隐喻含义存在争议，本身并未限定所指。直译可保留神学张力，避免把一种解释写入正文。
- issue: 首行 יֹאכַל 的主语
  choice: 用“它”保留未明确指称的阳性单数主语。
  alternative: 以“死亡的长子”为前置主语统摄两行；改用被动句“他的皮肤各部分被吞噬”
  rationale: 原文首行没有明说主语，次行才出现“死亡的长子”。保留代词可反映原诗的推进，同时不武断认定两行主语必然相同。
translation_notes:
  register: 采用现代、庄重而具诗意的普通话。“吞噬”呈现毁灭力度；“肢体”有意对应原文同一词根在两行中的重复。脚注标记置于整节末尾，明确关联“死亡的长子”这一表达。
