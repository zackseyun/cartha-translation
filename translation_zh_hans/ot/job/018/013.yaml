- from: 它吞噬他皮肤的肢体；死亡的长子吞噬他的肢体。[a]
  to: 它吞噬他皮肤的各部分；死亡的长子[a]吞噬他的肢体。
  rationale: 修订仅解决汉语搭配和脚注锚定问题。首行将与“皮肤”相连的“肢体”调整为“各部分”，第二行仍保留“肢体”，以分别准确表达同一希伯来词在不同搭配中的身体意象。正文继续保留未明确的首行施事者及“死亡的长子”的隐喻。
