base_translation:
  language: en
  yaml_path: translation/ot/job/018/018.yaml
  text: They drive him from light into darkness[b][a], and banish him from the world.
translation:
  language: zh_hans
  text: 他们把他从光明赶入黑暗[a]，又把他逐出人世[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们把他从光明追赶到黑暗里。”
    reason: lexical_alternative
  - marker: b
    text: “人世”所译的希伯来词可指“世界”，也可较具体地指“有人居住的世界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: 他们把他……赶入
  rationale: 该词是Qal未完成时第三人称复数形式，带第三人称阳性单数后缀，表示若干未指明的施事者把“他”赶走或推开。“赶入”既保留主动复数主语，也自然表达强制迁移的力度。
- source_word: מֵאוֹר
  choice: 从光明
  rationale: 介词מִן表示离开或分离，אוֹר意为“光”。“从光明”简洁地保留诗句中的空间意象。
- source_word: אֶל חֹשֶׁךְ
  choice: 入黑暗
  rationale: אֶל表示朝向某处；与“从光明”相对，“入黑暗”清楚呈现从一个领域进入另一个领域的动态。
- source_word: וּמִתֵּבֵל
  choice: 又……出人世
  rationale: תֵּבֵל可指“世界”，并常侧重有人居住的世界。“人世”在中文诗体中自然凝练，也保留其与人类生活领域相关的意味。
- source_word: יְנִדֻּהוּ
  choice: 把他逐出
  rationale: 该动词表示使某人被赶离、排除在外。“逐出”体现强制驱离，并避免与前半句完全重复用词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的诗歌语言。保留原文未明确说明施事者的复数“他们”，并以“光明—黑暗”“赶入—逐出”的平行结构呈现强制驱逐的意象。
