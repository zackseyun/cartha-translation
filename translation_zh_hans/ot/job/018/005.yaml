  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: zh_hans
  text: 恶人的光必熄灭；他火中的火焰[a]必不发亮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火焰”或译“火花”。希伯来语 שְׁבִיב 可指二者。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: （不单独译出）
  rationale: 此处为加强断言语气的语气词；汉语用“必”自然体现其强调作用，若另加“确实”会显得累赘。
- source_word: אוֹר רְשָׁעִים
  choice: 恶人的光
  rationale: 保留“光”的诗歌意象，也保留复数所表达的一类人；现代汉语“恶人”可作集合性称谓。
- source_word: יִדְעָךְ
  choice: 必熄灭
  rationale: 该动词指光衰残、熄灭；“熄灭”准确而自然。“必”也传达本节格言式断言的力度。
- source_word: וְלֹא יִגַּהּ
  choice: 必不发亮
  rationale: 保留否定陈述和发光意象；“发亮”与火花搭配自然。
- source_word: שְׁבִיב
  choice: 火花
  rationale: 该词可指火花或火焰。其后紧接“他的火”，译为“火花”形成自然的“火中的火花”，同时以脚注保留“火焰”的可能。
- source_word: אִשּׁוֹ
  choice: 他的火
  rationale: 保留名词“火”和第三人称阳性单数后缀，不改译为“灯”或“炉火”，避免引入原文没有明确表达的意象。
theological_decisions:
- issue: “光”和“火”是否直接解释为生命、兴盛或家业
  choice: 保留原有光与火的比喻，不在正文中解释
  alternative: 译成“恶人的兴盛必终止”等解释性表述
  rationale: 本节的诗歌意象本身具有多重指向，可能涉及生命、兴盛、安全或延续；直译意象可避免把神学含义局限于单一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以两个平行分句呈现希伯来诗句；“必……必不……”体现比勒达断言的力度。“他”承接集合名词“恶人”，符合原文由复数转为单数领属形式的表达。
