  yaml_path: translation/ot/job/018/002.yaml
  text: How long will you keep setting traps with words? Understand[b][a], and afterward we will speak.
translation:
  language: zh_hans
  text: 你们要到什么时候还用言语设圈套呢？[a] 你们先想明白，然后我们再说。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要到什么时候还给言语划定界限呢？”希伯来语原短语含义较难确定；也有人认为这是在抱怨没完没了的谈话，而不是指用话设圈套。
    reason: lexical_alternative
  - marker: b
    text: 或译：“然后让我们说吧。”末尾的动词既可理解为对将来的陈述，也可带有邀请的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אָנָה
  choice: 要到什么时候
  rationale: 这是现代汉语表达持续性责问的自然说法，准确传达“还要多久”的语气。
- source_word: תְּשִׂימוּן
  choice: 还……设
  rationale: שׂים的基本义为“放置、设置”；“设”与后面的“圈套”自然搭配，“还”从问句语境体现比勒达对持续行为的责问，而不把它当作该动词本身的词义。
- source_word: קִנְצֵי לְמִלִּין
  choice: 用言语设圈套
  rationale: 原短语罕见且含义困难。“用言语设圈套”传达一种敌对的言语行为，也符合上下文；但“给言语划定界限／使话语终止”仍是真实可能，故收入脚注。
- source_word: תָּבִינוּ
  choice: 先想明白
  rationale: בין在此有命令意味，要求听者在继续交谈前理解或审慎思考。“想明白”是自然、直接的现代汉语，“先”明确表达与后句的先后关系。
- source_word: וְאַחַר
  choice: 然后……再
  rationale: 以自然汉语清楚表达“先理解，随后说话”的次序。
- source_word: נְדַבֵּר
  choice: 我们再说
  rationale: 第一人称复数未完成式可表示将来，也可能带有邀请意味。“我们再说”保留了一定开放性，不强行判定为单纯预告或明确劝请。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“想明白”和“我们再说”符合当代普通话，同时保留原文责问的锋芒及末句语气上的开放性。所有脚注标记均置于相应正文位置。
