  to: 因为他被自己的脚带进网罗；他行走在网罗之上。
  rationale: 修订首分句以“被……带进”对应原文被动式，同时用“自己的脚”保留脚步作为工具或原因的张力，而不将其解释为纯粹自愿或外力强迫。修订第二分句为“行走在……之上”，避免添加“走到”的趋向意义。
