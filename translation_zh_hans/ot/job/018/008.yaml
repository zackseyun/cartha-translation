  text: For he is sent into a net by his own feet, and he walks onto a mesh.
translation:
  language: zh_hans
  text: 因为他被自己的脚带进网罗；他行走在网罗之上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלַּח
  choice: 把他送进
  rationale: 这是פֻּעַל完成式，字面为“被送出/被送入”。结合工具短语“他的双脚”，汉语用使动结构“他的双脚把他送进”既保留被动含义，也自然表达其脚步导致自己陷入网中。
- source_word: בְּרֶשֶׁת
  choice: 进网罗
  rationale: רֶשֶׁת指捕捉猎物的网；介词ב在运动语境中可表达进入，译作“进”符合此处落入陷阱的意象。“网罗”庄重而为现代读者熟悉。
- source_word: בְּרַגְלָיו
  choice: 他的双脚
  rationale: 字面为“借着/由于他的脚”。保留脚作为使他进入网罗的工具或原因，不扩展为解释性的“自投罗网”。
- source_word: שְׂבָכָה
  choice: 罗网
  rationale: 该词指网状捕具、网眼结构，与前一分句的רֶשֶׁת近义。译为“罗网”保留诗句的平行意象。
- source_word: יִתְהַלָּךְ
  choice: 走到……上
  rationale: התהלך在此描写行走；与介词עַל连用，表示走在或走上网具。译作“走到……上”保留进入陷阱的动态，又不额外解释结果。
theological_decisions:
- issue: 恶人陷入网罗的能动性与受动性
  choice: 保留“他的双脚把他送进”的双重张力
  alternative: 译作“他自己走进网罗”或“他被抛进网罗”
  rationale: 原文一方面使用被动态“被送”，另一方面以“他的脚”为工具或原因。所选译法不把责任完全归于外力，也不消除其受困的被动色彩。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。两个分句保持平行，并避免用成语“自投罗网”替代原文具体而略带反常的表达。
