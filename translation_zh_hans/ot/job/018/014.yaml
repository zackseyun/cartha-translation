base_translation:
  language: en
  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: zh_hans
  text: 他必从自己赖以安稳的帐棚中被扯出来[a]，并被带往“惊恐之王”那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必从自己的帐棚——他的倚靠——被扯出来。”希伯来文既可表示他被带离帐棚这个安全之处，也可表示帐棚本身就是他所倚靠的。
    reason: lexical_alternative
  - marker: b
    text: “惊恐之王”是诗性称号，常被理解为人格化的死亡；原文没有明确说明其身份。
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: 被扯出来
  rationale: נתק的尼法勒式表示被强行拉开、扯离或拔出；“被扯出来”保留了动作的猛烈感和被动意义。
- source_word: מֵאָהֳלוֹ
  choice: 从自己的……帐棚中
  rationale: אֹהֶל本义为“帐棚”，这里也可泛指住所；保留“帐棚”可维持本节具体而富有诗意的意象。
- source_word: מִבְטַחוֹ
  choice: 赖以安稳的
  rationale: מִבְטָח可指安全、倚靠或信赖。此处与“他的帐棚”相连，既可能描述帐棚是他感到安全之处，也可能与帐棚构成同位关系；正文采用自然的中文表达，脚注保留另一种句法理解。
- source_word: וְתַצְעִדֵהוּ
  choice: 被押送
  rationale: צעד的使役式意为“使迈步、使前行”，语境带有身不由己地被带走之意。“被押送”体现其强制性，也避免在中文正文中为阴性动词形式擅自指定一个不明确的主语。
- source_word: לְמֶלֶךְ
  choice: 到……王那里
  rationale: 介词לְ表示方向，译作“到……那里”符合这里被带往某处或某位面前的意思。
- source_word: בַּלָּהוֹת
  choice: 惊恐
  rationale: בַּלָּהוֹת为复数，可指种种恐怖、惊骇之事；“惊恐之王”保留希伯来文凝练而强烈的诗性称号。
theological_decisions:
- issue: “惊恐之王”的身份
  choice: 正文保留这一诗性称号，不明确指定其所指
  alternative: 将其直接解释为人格化的死亡、阴间，或某个邪灵统治者
  rationale: 希伯来文没有明说“惊恐之王”究竟是谁。上下文常使人联想到人格化的死亡，但直接写成“死亡”会消除原文的隐喻和神学张力。
- issue: וְתַצְעִדֵהוּ的主语
  choice: 用中文被动式“被押送”表达，不补出具体施事者
  alternative: 译作“它把他押送”，或把死亡、灾祸等补作主语
  rationale: 希伯来文动词为第三人称阴性单数，但本节中其明确所指并不清楚；被动表达可保留这种不确定性，同时使中文自然。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“赖以安稳的帐棚”兼顾自然中文与原文中“帐棚—安全／倚靠”的紧密关系；“被扯出来”“被押送”保留本节强烈、不可抗拒的动作感。
