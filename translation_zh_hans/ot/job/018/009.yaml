  text: A trap seizes him by the heel[a]; a snare holds him fast.
translation:
  language: zh_hans
  text: 陷阱抓住他的脚后跟[a]；罗网牢牢制住他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“陷阱在脚后跟处捉住他；套索紧紧扣住他。”末尾的希伯来词十分罕见，可能指某种罗网、套索或其他捕具。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאחֵז
  choice: 抓住
  rationale: 该词为 אחז 的 Qal 未完成式第三人称阳性单数，表示抓住、攫住；“抓住”自然鲜明，并保留圈套主动擒获人的诗意表达。
- source_word: בְּעָקֵב
  choice: 脚后跟
  rationale: עָקֵב 意为“脚后跟”；介词 ב 在此表示圈套抓住的部位。译作“抓住他的脚后跟”符合现代汉语习惯。
- source_word: פָּח
  choice: 圈套
  rationale: פָּח 常指捕捉猎物的陷阱或罗网；选“圈套”既能表现捕捉意象，也可与下半句的罕见名词区分。
- source_word: יַחֲזֵק
  choice: 牢牢缠住
  rationale: 该词为 חזק 的 Hiphil 未完成式，在此表示有力地抓牢或制住。“牢牢”保留其加强语气，“缠住”与罗网意象搭配自然。
- source_word: עָלָיו
  choice: 他
  rationale: 介词 על 加第三人称阳性单数后缀，表示动作临到并控制此人；在汉语中以“把他”自然表达受事关系。
- source_word: צַמִּים
  choice: 罗网
  rationale: 这是罕见名词，语境中大概指某种捕具，可能是罗网、套索或陷阱。“罗网”可保留其不确定的捕捉意象，并与“圈套”形成诗歌平行而不完全同词。
