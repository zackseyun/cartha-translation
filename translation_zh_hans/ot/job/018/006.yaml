  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: zh_hans
  text: '他帐棚里的光渐渐暗淡；

    他上方[a]的灯熄灭。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他之上。”希伯来文介词可表示“在……上面”或“在……上方”；这里很可能描绘灯在这人上方的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: 光
  rationale: 采用常见的具体含义“光”，与帐棚内照明的诗歌意象相符，也与下半句的“灯”形成对应。
- source_word: חָשַׁךְ
  choice: 渐渐暗淡
  rationale: 该动词表达变暗的过程或结果；“渐渐暗淡”自然传达动态含义，又不与下半句明确的“熄灭”混同。
- source_word: בְּאָהֳלוֹ
  choice: 他帐棚里的
  rationale: אָהֶל直指“帐棚”，也可诗意地指住所或家室；保留“帐棚”可忠实呈现希伯来文的具体意象。
- source_word: וְנֵרוֹ
  choice: 他的灯
  rationale: נֵר指灯或灯火；译作“灯”保留具体形象，并与上半句的“光”构成诗歌平行。
- source_word: עָלָיו
  choice: 他上方的
  rationale: עַל可表示在……上、上方或越过；此处按空间位置译为“上方”，同时以脚注保留另一种可理解的关系。
- source_word: יִדְעָךְ
  choice: 必熄灭
  rationale: 该动词用于灯火时表示熄灭、灭掉；“必熄灭”简洁庄重，并以“必”体现未完成式在本段宣告中的将来或必然意味。
