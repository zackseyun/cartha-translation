    rationale: “摔倒”通常是不及物，计划作为主语应说“使他跌倒”；若保留及物表达，则应为“将他摔倒”。
  - severity: low
    issue: 正文“推倒”较具体地暗示了推动动作。
    rationale: 原文动词的核心是抛掷、使落败；“使他跌倒”更自然地表达结果，并避免限定为“推”。
