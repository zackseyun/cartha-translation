  naturalness: 正文总体庄重、通顺。原注b的“计划必将他摔倒”不合现代汉语的通常搭配；应改为“计划必使他跌倒”或“计划将他摔倒”。第一行以“步伐”对应复数“脚步”并与“强健”搭配更自然。
  terminology: “计谋”可对应עֵצָתוֹ的计划、谋略之义，并保留“他自己的”所产生的反讽。“强健”适切表达אוֹן在此修饰步伐的力量、活力。“受约束”准确保留צרר所含的受束缚、受限制意象。
