  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
translation:
  language: zh_hans
  text: 他强健的步伐必受约束[a]；他自己的计谋必使他跌倒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他强健的步伐必被缩短。”原文“强健”一词可指力量或精力；动词也可译作“变窄”或“受限制”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他自己的计划必使他跌倒。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצְרוּ
  choice: 必受限制
  rationale: 该动词以复数“脚步”为主语，表达脚步变窄、行动受约束；“受限制”在现代汉语中自然，也保留行动空间被压缩的意象。未完成时在本段断言性的语境中译作“必”。
- source_word: צַעֲדֵי
  choice: 脚步
  rationale: צעד的复数构造形，指脚步或步伐；“脚步”直接、自然，并适合本句的诗歌意象。
- source_word: אוֹנוֹ
  choice: 他有力的
  rationale: אוֹן可指力量、精力，也可能有财富等义；这里修饰“脚步”，译为“有力的”最符合搭配，同时保留其力量或活力的核心含义。
- source_word: וְתַשְׁלִיכֵהוּ
  choice: 必将他推倒
  rationale: שלך的使役形以阴性单数的“计谋”为主语、以“他”为宾语，表示使他被抛下或摔倒；结合毁灭语境，“推倒”自然地表达其敌对结果。
- source_word: עֲצָתוֹ
  choice: 他自己的计谋
  rationale: עֵצָה可指谋略、计划或劝告；此处是恶人自己的谋划反过来使他败倒。“计谋”符合智慧文学语境，“自己的”突显反讽。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话；上下两行保持希伯来诗歌的因果推进与反讽。“必”体现此处未完成时在比勒达断言中的确定语气，但不额外加入神学解释。
