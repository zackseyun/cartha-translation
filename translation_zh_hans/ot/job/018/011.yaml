  text: Terrors frighten him on every side[a], and scatter him at his feet.
translation:
  language: zh_hans
  text: '惊恐从四面八方使他惊惧，

    在他脚下[a]使他四散。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“紧逼在他的脚跟后”。希伯来文直译为“在他脚下”，可能描写惊恐在他每一步都驱赶着他。
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: 从四面八方
  rationale: 作方位副词，表示周围各个方向；这一表达自然地保留了被惊恐包围的意象。
- source_word: בִּעֲתֻהוּ
  choice: 吓住他
  rationale: בעת在此表示使人惊惧、恐慌；“吓住”既传达强烈惊吓，也符合现代汉语诗句的自然表达。
- source_word: בַלָּהוֹת
  choice: 惊恐
  rationale: 复数名词指令人恐惧的事物或突如其来的恐怖；汉语集合性名词“惊恐”可自然表达其环伺威胁。
- source_word: וֶהֱפִיצֻהוּ
  choice: 将他驱散
  rationale: 该使役动词的基本意象是使分散、赶散；保留“驱散”以避免过度明确为追赶或逃跑。
- source_word: לְרַגְלָיו
  choice: 在他脚下
  rationale: 直译为“向着／在他的脚”；正文保留脚的具体意象，脚注说明也可能表示在脚后紧逼或步步驱赶。
