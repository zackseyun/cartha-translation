  text: אַךְ אֵ֭לֶּה מִשְׁכְּנ֣וֹת עַוָּ֑ל וְ֝/זֶ֗ה מְק֣וֹם לֹא יָדַֽע אֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: zh_hans
  text: '不义之人的住处，确实是这样；

    这就是不认识上帝之人的地方。[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义之人”也可译作“恶人”。
    reason: lexical_alternative
  - marker: b
    text: 下半句也可译作“这就是不认识上帝者的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 确实
  rationale: 此处在比勒达发言的结尾起强调、断言作用，而非限制性的“只有”。“确实”自然地传达其总结语气。
- source_word: אֵלֶּה
  choice: 都是这样
  rationale: 复数指示词回指上文所描述的种种遭遇。汉语用“都是这样”可自然表达这一回指，并与复数“住处”协调。
- source_word: מִשְׁכְּנוֹת
  choice: 住处
  rationale: 该词泛指居住之所；“住处”简明、现代，也不将其过度具体化为“帐棚”。
- source_word: עַוָּל
  choice: 不义之人
  rationale: 该词指以不公、不义为特征的人。“不义之人”保留其道德及司法色彩；“恶人”虽可行，但含义更宽泛。
- source_word: וְזֶה
  choice: 也是如此
  rationale: 第二分句与前句构成平行总结。按汉语表达为“也是如此”，既保留指示和判断意味，又避免生硬重复“这就是”。
- source_word: מְקוֹם
  choice: 地方
  rationale: 直接对应原词，并与前句“住处”形成近义平行而不完全合并。
- source_word: לֹא יָדַע אֵל
  choice: 不认识上帝之人
  rationale: 保留“认识上帝”的原有措辞，使其关系性、道德性的含义仍可由语境承载，不将之释义为单纯不知道上帝存在，也不扩写成教义性表述。
- source_word: אֵל
  choice: 上帝
  rationale: 此处在《约伯记》的语境中指真神；“上帝”是现代普通话中自然、庄重的对应词，无须扩展为其他神圣称号。
theological_decisions:
- issue: “不认识上帝”的含义
  choice: 保留“认识上帝”的关系性及道德性张力
  alternative: 解释为仅仅不知道或不了解上帝
  rationale: 智慧文学语境中的“认识上帝”往往不只指知识层面的意识，也涉及承认并与上帝有正确关系。译文不作教义化释义，以保留原文张力。
- issue: 本节判断的说话者身份
  choice: 按比勒达话语原样译出，不将其判断直接标示为叙述者或上帝的最终裁定
  alternative: 把本句明确表述为全书认可的普遍神学结论
  rationale: 本节是比勒达发言的结语。译文应忠实呈现其断言，同时不额外替全书判定这番话的最终神学地位。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希伯来诗歌的两行平行结构；以“都是这样／也是如此”自然表达两个指示结构对上文命运描述的总结。
