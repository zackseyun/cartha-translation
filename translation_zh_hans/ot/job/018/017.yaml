  text: זִֽכְר/וֹ אָ֭בַד מִנִּי אָ֑רֶץ וְ/לֹא שֵׁ֥ם ל֝֗/וֹ עַל פְּנֵי חֽוּץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/017.yaml
  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: zh_hans
  text: '地上不再有人记念他；

    在街上再没有他的名。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的记念从地上消逝；在公共场所没有他的名。”
    reason: “地”可指全地或某地；“街上”所译原词也可指外面的公共场所。“名”可含姓名、名声或被人记念的身份。
lexical_decisions:
- source_word: זִכְרוֹ
  choice: 对他的记念
  rationale: 该名词指人们对他的记忆或记念。“对他的记念”自然地表达他从世人的记忆中消失，也保留了名词结构。
- source_word: אָבַד
  choice: 消失
  rationale: אבד可指灭亡、失落或消逝；与“记念”搭配时，“消失”符合现代汉语，同时保留诗句所表达的彻底抹除。
- source_word: מִנִּי אָרֶץ
  choice: 从地上
  rationale: אֶרֶץ既可指特定的“土地”，也可指“地上、全地”。此处描述记念被彻底除去，“从地上”保留其较广范围，也不排除“从那地”的可能。
- source_word: וְלֹא שֵׁם לוֹ
  choice: 他不再留名
  rationale: 字面意思是“他没有名字”；此处“名”兼有身份、声誉和后世记忆之意。“不再留名”以自然汉语传达无人记得、名声不存的含义。
- source_word: עַל־פְּנֵי חוּץ
  choice: 在街市上
  rationale: חוּץ可指外面、街道或公共场所；结合“留名”，这里着重于公众生活的空间。“街市”比单纯“街上”更能涵盖街道和公共广场，同时保留空间意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分为两个平行分句，保留希伯来诗歌中“记念”与“名”、“地上”与“街市”的对应关系；“不再留名”避免生硬直译“他没有名字”，同时未将其限定为单纯的名誉或身份。
