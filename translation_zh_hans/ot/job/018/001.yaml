lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在此处的对话引介公式中表示“回答、回应”；“回答”自然体现比勒达是在回应约伯。
- source_word: בִּלְדַּד
  choice: 比勒达
  rationale: 按现代中文圣经中通行的人名音译处理。
- source_word: הַשֻּׁחִי
  choice: 书亚人
  rationale: 这是表明比勒达族属或地域来源的称谓；“书亚人”采用现代中文圣经中较通行的形式。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 保留希伯来文“回答—说”的双动词引语公式，同时用简洁自然的中文表达。
- source_word: וַ
  choice: 于是
  rationale: 句首连接词在叙事中推动话语进展；“于是”比直译为“而”更符合现代汉语，同时保留承接顺序。
