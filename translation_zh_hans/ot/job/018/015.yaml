base_translation:
  language: en
  yaml_path: translation/ot/job/018/015.yaml
  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: zh_hans
  text: 不属于他的东西住在他的帐篷里[a]；硫磺被撒在他的住处上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文句法艰深。也可译作：“硫磺住在他的帐篷里；硫磺被撒在他的住处上。”原文末尾的“硫磺”可能同时是前半句阴性动词的后置主语；“不属于他的”也可能表示他已不在或不再拥有该帐篷。
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: 住着
  rationale: 源自动词 שכן，意为“居住、安居”。原文是阴性单数形式，却没有紧邻的明确主语；译文保留存在句式，不擅自指明具体居住者。
- source_word: בְּאָהֳלוֹ
  choice: 他帐篷里
  rationale: אֹהֶל 的基本义是“帐篷”。保留具体意象，也与本节后半的“住处”形成对应。
- source_word: מִבְּלִי לוֹ
  choice: 不属于他的东西
  rationale: 这一省略性短语表达与他无分、非他所有之意。用“东西”补足现代汉语句法，但不具体断定究竟是什么。
- source_word: יְזֹרֶה
  choice: 遍撒
  rationale: זרה 的 Piel 词形意为“撒开、撒布”。原文第三人称阳性单数可作无人称表达；汉语以不点明施事者的“遍撒”自然呈现。
- source_word: עַל נָוֵהוּ
  choice: 他的住处
  rationale: נָוֶה 可指居所、住所或牧场；此处与“帐篷”平行，译作“住处”最贴合上下文。
- source_word: גָפְרִית
  choice: 硫磺
  rationale: גָפְרִית 指 sulfur。现代汉语通常称“硫磺”，既通俗又保留审判与毁灭的意象。
theological_decisions:
- issue: 前半句的主语及 מִבְּלִי לוֹ 的句法关系
  choice: 译作有某种“不属于他的东西”住进他的帐篷，不具体辨明其身份
  alternative: 把后置的“硫磺”视为前半句阴性动词的主语，译作“硫磺住在那不再属于他的帐篷里”
  rationale: 希伯来文语序压缩，阴性动词没有明确的前置主语，而“硫磺”本身为阴性名词，可能是后置主语；但 מִבְּלִי לוֹ 也可理解为“不属于他的”。正文保存不明居住物的读法，脚注交代另一种有充分语法依据的理解，不将审判意象过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“帐篷—住处”保留原文平行意象；“住着不属于他的东西”略带陌生感，以反映原文真实的句法张力，并以脚注说明另一主要读法。
