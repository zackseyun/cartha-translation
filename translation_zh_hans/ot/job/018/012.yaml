  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: zh_hans
  text: '他的力量饥饿，

    灾祸正准备好在他身旁[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为他的失足。”这里的希伯来语词可指“身旁、肋旁”；有些解释则将其理解为“失足”或“跛行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: 已……
  rationale: 这里的未完成式在诗歌描述中陈述恶人的境况，并非明确的祈愿；用“已”配合上下句，表达正在呈现、临到的状态。
- source_word: רָעֵב
  choice: 因饥饿而衰竭
  rationale: 原词意为“饥饿的”。汉语不自然地说“力量饥饿”，因此保留饥饿意象，同时用“衰竭”表达力量被耗尽的状态。
- source_word: אֹנוֹ
  choice: 他的力量
  rationale: אוֹן可指力量、精力或资财；本节与临近的灾祸相配，“力量”最贴合上下文，同时不排除精力或生存资源逐渐耗尽的意味。
- source_word: וְאֵיד
  choice: 灾祸
  rationale: אֵיד指毁灭性的灾难；“灾祸”符合庄重的诗体语域。
- source_word: נָכוֹן
  choice: 准备就绪
  rationale: 此词表示已经稳固、预备妥当；“准备就绪”保留灾祸正蓄势临到的拟人化画面。
- source_word: לְצַלְעוֹ
  choice: 在他身旁
  rationale: צלע通常可指身体的一侧、肋旁；这里译作“身旁”，呈现灾祸近在咫尺、随时袭来的具体画面，并以脚注保留另一种词义理解。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代汉语诗体。首行以“因饥饿而衰竭”保存原文不寻常的饥饿意象，又避免“力量饥饿”在汉语中的生硬；次行保留灾祸仿佛已预备好、守在近旁的拟人画面。
