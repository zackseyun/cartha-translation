base_translation:
  language: en
  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: zh_hans
  text: 你这在怒气中撕裂自己的人啊[a]，难道为了你，大地会被遗弃，磐石会从原处挪开吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文开头较直译为“那在怒气中撕裂自己的人”，形式上使用第三人称，随后转为第二人称直接称呼“你”。
    reason: 说明希伯来文由第三人称分词表达转为第二人称称呼的人称变化。
lexical_decisions:
- source_word: טֹרֵף
  choice: 撕裂自己
  rationale: 该词是 טרף 的 Qal 主动分词，常描写猛兽撕裂猎物；与 נַפְשׁוֹ 连用，在此生动表达怒气带来的自我伤害。
- source_word: נַפְשׁוֹ
  choice: 自己
  rationale: נֶפֶשׁ 可指生命、本人或魂；此处译为“自己”最符合汉语习惯，也保留反身含义，避免把它过度限定为心理意义上的“灵魂”。
- source_word: בְּאַפּוֹ
  choice: 在怒气中
  rationale: אַף 字面可指“鼻子”，但常用来表示怒气。结合后文第二人称单数 לְמַעַנְךָ，正文采用直接称呼。
- source_word: הֲלְמַעַנְךָ
  choice: 难道为了你……吗
  rationale: 疑问词与 לְמַעַן 构成反问，质问世界秩序是否应当因约伯而改变；“为了你”保留原文针对个人的语气。
- source_word: תֵּעָזַב אָרֶץ
  choice: 大地就该被撇弃
  rationale: אָרֶץ 在此与磐石的稳定性形成宏观、宇宙性的平行，译作“大地”比“土地”更合适；תֵּעָזַב 是被动式，故保留“被撇弃”。
- source_word: וְיֶעְתַּק
  choice: 就该……挪开
  rationale: 该动词在此表示从原有位置移走；“挪开”自然地与“从原处”搭配，并保持反问的平行结构。
- source_word: צוּר
  choice: 磐石
  rationale: צוּר 指岩石或岩磐；此处是泛指稳定不动的磐石，并非作为上帝的称号。
- source_word: מִמְּקֹמוֹ
  choice: 从原处
  rationale: 指磐石所在的位置；“原处”简洁自然地表达“从它的位置”。
theological_decisions:
- issue: 开头的人称转换及整节的反问语气
  choice: 正文按直接称呼译为“你这……的人啊”，脚注说明原文开头形式上是第三人称
  alternative: 全节尽量保留第三人称：“那在怒气中撕裂自己的人——难道为了你……”
  rationale: 希伯来文开头的主动分词和宾语后缀形式上是第三人称单数，随后 לְמַעַנְךָ 明确转为第二人称单数。正文采用自然的直接称呼，准确传达比勒达对约伯的责问；脚注则保留原文真实的人称张力，不将其抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“撕裂自己”保留原文猛兽撕扯般的强烈意象；“大地”“磐石”“原处”保持诗歌的宏阔感和两句之间的平行。
