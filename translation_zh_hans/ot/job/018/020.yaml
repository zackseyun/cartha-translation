  yaml_path: translation/ot/job/018/020.yaml
  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
translation:
  language: zh_hans
  text: 后来的人为他的日子[a]而惊骇；从前的人被惊恐攫住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的日子”可能指他遭灾或受审判的日子。
    reason: lexical_alternative
  - marker: b
    text: “后来的人……从前的人”也可理解为“西方的人……东方的人”。“被惊恐攫住”原文直译近于“抓住颤栗”，形容人被战栗般的恐惧所控制。
    reason: alternative_reading
lexical_decisions:
- source_word: עַל יוֹמוֹ
  choice: 因他的日子
  rationale: 保留“他的日子”这一具体而含蓄的原文表达；介词 עַל 在此表示引发惊骇的缘由。上下文暗示这是他遭灾或受审判的日子，但正文不将含义限定得过死。
- source_word: נָשַׁמּוּ
  choice: 惊骇
  rationale: 该动词表达因震惊而骇然、目瞪口呆的强烈反应；“惊骇”比单纯“惊讶”更符合语境。
- source_word: אַחֲרֹנִים
  choice: 后来的人
  rationale: 采用通常的时间意义“后来者”，并与 קַדְמֹנִים 构成前后对应；可能的地理解释留在脚注。
- source_word: וְקַדְמֹנִים
  choice: 先前的人
  rationale: 采用时间意义“先前者”，自然对应“后来的人”，同时不具体限定为某一代人。
- source_word: אָחֲזוּ שָׂעַר
  choice: 被恐惧攫住
  rationale: אָחֲזוּ 本义为“抓住”，与 שָׂעַר 连用描写人被战栗般的恐惧控制；译文兼顾原有动态意象和现代汉语的自然表达。
theological_decisions:
- issue: “他的日子”是否明确译作灾祸或审判之日
  choice: 正文保留“他的日子”
  alternative: “他遭难的日子”或“他受审判的日子”
  rationale: 原文只说 יוֹמוֹ，并未明说灾难或审判；保留措辞可维持其含蓄性和神学张力，脚注说明语境中的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“攫住”保留原文“抓住”的强烈动态感；句式保持诗歌的平行结构。
