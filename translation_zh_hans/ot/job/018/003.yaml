  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
translation:
  language: zh_hans
  text: 我们为什么被看作牲畜[a]，在你们眼中被视为不洁[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“野兽”或“动物”。希伯来语בְּהֵמָה泛指动物，也常指家畜；这里含有贬抑意味。
    reason: lexical_alternative
  - marker: b
    text: “被视为不洁”所据的希伯来语词形含义不明确；也有人理解为“被看作愚钝”或“被当作可鄙”。
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接表达反问语气，自然清楚。
- source_word: נֶחְשַׁבְנוּ
  choice: 被看作
  rationale: 保留חשב被动式所表达的评价、看待之意。
- source_word: כַבְּהֵמָה
  choice: 牲畜
  rationale: בְּהֵמָה是动物、走兽或家畜的广义词；此处带贬抑意味。“牲畜”既符合其常见所指，也保留集合性用法。
- source_word: נִטְמִינוּ
  choice: 被视为不洁
  rationale: 词形和词根解释困难；按“不洁、玷污”的理解翻译，并用“被视为”与上半句的被动评价形成对应，同时以脚注保留其他可能。
- source_word: בְּעֵינֵיכֶם
  choice: 在你们眼中
  rationale: 保留希伯来语表示判断和观感的惯用比喻；复数“你们”也忠实反映词形。
theological_decisions:
- issue: נִטְמִינוּ的疑难含义
  choice: 被视为不洁
  alternative: 被看作愚钝／被当作可鄙
  rationale: 上下文是比勒达抗议约伯轻看他和同伴；“不洁”是可成立的传统理解，但原文用词罕见且解释不一，因此不将此意义说成毫无疑问，而在脚注中明确提示异译。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“牲畜”传达比喻中的轻蔑意味；两个“被”字结构保留原句两部分的对应关系。所有脚注标记均置于相关词语之后。
