  text: אִם לֹ֣א בֵרֲכ֣וּ/נִי חלצ/ו וּ/מִ/גֵּ֥ז כְּ֝בָשַׂ/י יִתְחַמָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/020.yaml
  text: if his loins have not blessed me[b][a], and if he was not warmed by the fleece of my sheep—
translation:
  language: zh_hans
  text: 若他的腰身没有为我祝福[a]，他也没有因我羊的羊毛而得温暖[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他的腰身”。这是用身体部位指那位因得到衣物而暖和的穷人；“为我祝福”也含有因受助而感激的意思。
    reason: lexical_alternative
  - marker: b
    text: “羊毛”也可译作“羊绒”或“从羊身上剪下的毛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: 若……没有
  rationale: 保留约伯起誓式自咒语境中的条件句形式，不把隐含的誓言结果补入本节。
- source_word: בֵרֲכוּנִי
  choice: 为我祝福
  rationale: 保留 ברך 的基本含义及原文拟人化表达；这里虽含受助者感激之意，却不直接弱化为“感谢我”。
- source_word: חֲלָצָיו
  choice: 他的腰身
  rationale: חלץ 字面指腰胯部位，此处以身体部位代指得到衣物、因而暖和的穷人身体；“腰身”比“腰胯”自然，同时仍保留原文意象。
- source_word: וּמִגֵּז
  choice: 因……的毛
  rationale: 介词 מִן 在此表示暖和所凭借的来源或材料；גֵּז 可指羊身上的毛或剪下的羊毛，正文用较宽泛的“毛”保留这一范围。
- source_word: כְּבָשַׂי
  choice: 我羊群
  rationale: כֶּבֶשׂ 可指绵羊或羊羔；在供毛的语境中，“羊群”符合现代汉语习惯，且不必限定为幼羊。
- source_word: יִתְחַמָּם
  choice: 暖和
  rationale: Hitpael 形式表示变暖或使自己暖和；“因……而暖和”自然表达其结果，并避免强行指定被动施事。
theological_decisions:
- issue: 第二分句的否定范围
  choice: 译作“他也没有……暖和”
  alternative: 直译为“他因……而暖和”
  rationale: לֹא 明写于第一分句，但在 אִם 引出的平行起誓条件中自然延及以 וּ־ 连接的第二分句；补出“也没有”使汉语关系清楚，同时不补写誓言的后果。
- issue: “腰身祝福”与受助者的关系
  choice: 保留身体部位作主语的拟人兼转喻表达
  alternative: 释义为“若他没有感谢我”
  rationale: 原文有意让得到衣物温暖的“腰身”发出祝福；保留该张力能显出约伯供衣使穷人全身受惠的生动意象。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“为我祝福”略带陌生感，是为保留原文中腰身拟人化的鲜明表达；脚注说明其转喻和感激含义。破折号承接下一节尚未说出的起誓后果。
