  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: zh_hans
  text: 愿荆棘代替麦子长出，臭草[a]代替大麦长出。约伯的话到此结束。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恶臭的杂草”或“有害的杂草”；希伯来语所指的确切植物不详。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: 代替
  rationale: 此处用于咒誓性的农作物对比，表示一种出产物取代另一种，并非空间意义的“在……下面”。
- source_word: חִטָּה
  choice: 麦子
  rationale: 这是该谷物在现代汉语中的常用名称，与有害植物形成对比。
- source_word: יֵצֵא
  choice: 愿长出
  rationale: 该动词本义为“出来”，用于植物时指从土中长出；结合约伯自我咒誓的语境，以“愿”表达祈愿语气。
- source_word: חוֹחַ
  choice: 荆棘
  rationale: 指带刺而有害的植物；“荆棘”自然、庄重，又避免作过于具体的植物鉴定。
- source_word: שְׂעֹרָה
  choice: 大麦
  rationale: 该词通常指大麦，是现代汉语中明确而标准的作物名称。
- source_word: בָאְשָׁה
  choice: 臭草
  rationale: 此罕见名词可能指恶臭或有害的杂草；“臭草”保留它与“发臭”词根的可能联系，具体植物不明则在脚注说明。
- source_word: תַּמּוּ
  choice: 说完了
  rationale: 这里是结束约伯发言的编排性结语；结合“话”，译作“说完了”比机械的“结束了”更符合现代汉语。
- source_word: דִּבְרֵי אִיּוֹב
  choice: 约伯的话
  rationale: 直接保留希伯来语属格结构及其简洁的收束效果。
