base_translation:
  language: en
  yaml_path: translation/ot/job/031/006.yaml
  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: zh_hans
  text: 愿他用公正的天平称量我[a]，上帝就会知道我的正直[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公正的天平”也可译作“公义的天平”或“公平的秤”。
    reason: lexical_alternative
  - marker: b
    text: “正直”也可译作“纯正”“清白”或“无可指摘”。“上帝就会知道”也可理解为“愿上帝知道（查明）”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: 愿他……衡量我
  rationale: 该词是 שקל 的 Qal 未完成式，带第一人称单数宾语后缀；在本段语境中具有祈愿意味。译作“愿他……衡量我”，保留约伯主动请求受检验的语气和称量的比喻。
- source_word: בְמֹאזְנֵי צֶדֶק
  choice: 用公正的天平
  rationale: מֹאזְנַיִם 指天平；צֶדֶק 在称量和审判意象中表示公正、正直。现代汉语“公正的天平”自然清楚，也保留原文的司法性比喻。
- source_word: וְיֵדַע
  choice: 愿……知道
  rationale: 连词加未完成式可延续前一分句的祈愿语气，因此不确定地改成单纯将来，而译为“愿……知道”。这里的“知道”含查明、确认之意，但正文保留原词的直接表达。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的诗体单数称谓，意为“上帝”；本节没有依据将其扩译为“全能者”。
- source_word: תֻמָּתִי
  choice: 我的纯正
  rationale: תֻמָּה 可指完整、纯正、无可指摘。“纯正”适合约伯申明自身操守的语境，同时不必把他的主张解释成绝对无罪。
theological_decisions:
- issue: 约伯自我申辩的力度
  choice: 我的纯正
  alternative: 我的清白／我的无可指摘
  rationale: “纯正”保留约伯要求上帝公正鉴察其品格的强烈主张，却不把经文默默解释为约伯宣称自己绝对没有罪；“清白”和“无可指摘”作为可能译法列入脚注。
- issue: 两个未完成式的语气关系
  choice: 两个分句都译作祈愿：“愿……愿……”
  alternative: “愿他衡量我，上帝就会知道……”
  rationale: 原文 וְיֵדַע 可承接祈愿语气，也可能被理解为结果。正文保留平行的祈愿力度，脚注提示结果性理解，以免消除原文的句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“衡量”兼顾实际称重与审察品格的双重意象；“公正的天平”保持诗性和司法语境。脚注标记均置于所说明的正文成分之后。
