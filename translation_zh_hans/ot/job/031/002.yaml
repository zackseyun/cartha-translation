  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: zh_hans
  text: 那么，上头的上帝所给的份是什么？高处的全能者所给的产业又是什么呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶה
  choice: 那么……是什么呢
  rationale: 连词与疑问词承接上文并引出反问；“那么”保留承接作用，“是什么呢”符合现代汉语的反问语气。
- source_word: חֵלֶק
  choice: 份
  rationale: 表示分得的份额，与下半句“产业”构成诗歌平行；“份”简洁自然，也保留分配所得之意。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的单数诗体神称；译为“上帝”直达其意义，不增添原文没有的“至高者”等含义。
- source_word: מִמָּעַל
  choice: 从上头的
  rationale: 保留介词“从”及方位意义，并让它可自然理解为修饰“上帝”；其也可能更偏副词性、强调所得之份来自上方，故加脚注说明。
- source_word: וְנַחֲלַת
  choice: 产业又是什么
  rationale: נַחֲלָה指承受或分得的产业；“产业”保留承受所得的意味。“又”体现两行之间的并列递进。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 将诗体神圣称号译出，既符合现代中文圣经语体，也避免仅作音译而使普通读者不明其义。
- source_word: מִמְּרֹמִים
  choice: 从高处的
  rationale: 复数名词意为高处、诸高处；“从高处”保留原文介词所表达的来源，并与“从上头”形成平行，不擅自明确为“天上”。
theological_decisions:
- issue: 希伯来诗歌中的两个神圣称谓
  choice: 将 אֱלוֹהַּ 译为“上帝”，将 שַׁדַּי 译为“全能者”
  alternative: “上帝……沙代”
  rationale: 原文以两个称谓平行指向同一位神。将称号译义便于现代读者理解，同时不把 שַׁדַּי 的音译当作专名，也不加入额外教义限定。
- issue: 方位短语与神称或所得之物的关系
  choice: 正文采用“从上头的上帝所得……从高处的全能者所得”
  alternative: “上帝从上头所赐的份……全能者从高处所赐的产业”
  rationale: 希伯来语短语既可与神称紧密相连，也可较副词性地强调份额和产业来自上方。正文保留前一种自然读法，脚注交代后一种可能，不把“赐予”等隐含关系写死。
translation_notes:
  register: 采用现代、庄重而易懂的诗体问句。“份／产业”、“上头／高处”、“上帝／全能者”分别形成平行。“上头”在现代普通话中仍自然，又比“天上”更少增添原文未明说的地点。
