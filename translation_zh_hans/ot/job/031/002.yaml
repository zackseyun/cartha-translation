revisions:
- from: 那么，从上头的上帝所得的份是什么[a]，从高处的全能者所得的产业又是什么呢？
  to: 那么，上头的上帝所给的份是什么？高处的全能者所给的产业又是什么呢？
  rationale: 正文改以自然的中文“所给的”表达原文中神作为份与产业之分配者的关系，并维持两个诗行的平行。脚注保留方位短语可修饰所得之物、强调其来自上方的另一种可行理解。
