  text: if the men of my tent have not said[b][a], ‘Who is there that has not been filled with his flesh?’
translation:
  language: zh_hans
  text: 若我帐棚里的人[a]没有说过：“谁没有因吃他所供的肉[b]而吃饱呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐棚里的人”也可译作“家里的人”；“帐棚”可代指一个人的家庭或家中众人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从他的肉”；这里指约伯席上所供应的肉食，也就是他供给的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: 若……没有
  rationale: 保留希伯来语誓言式的条件结构；本节在句法上承接上下文，不把它改写成独立的断言。
- source_word: מְתֵי אָהֳלִי
  choice: 我帐棚里的人
  rationale: 贴近原文“我帐棚的人”，同时用现代汉语表达其所属关系；所指也可能是约伯家中的成员或仆从。
- source_word: מִי יִתֵּן
  choice: 谁……呢
  rationale: 这里不是通常的愿望语“但愿”，而是引出反问，意为“有谁……？”
- source_word: מִבְּשָׂרוֹ
  choice: 吃他的肉
  rationale: בָּשָׂר本义为“肉、肉身”；在本节待客与供应的语境中，指约伯所供给的肉食。补出“吃”使汉语通顺，同时由脚注保留原文介词结构。
- source_word: לֹא נִשְׂבָּע
  choice: 不曾……吃饱
  rationale: שׂבע的尼法勒式表示“得饱足”；结合肉食语境译为“吃饱”，比抽象的“得到满足”更具体自然。
theological_decisions:
- issue: 誓言句式与本节残句性质
  choice: 保留“若……没有”的条件式
  alternative: 译作“我帐棚里的人确实说过”
  rationale: 约伯记31章反复使用条件式自证清白；保留其未明说后果的誓言结构，避免替原文补足或化解张力。
- issue: “他的肉”的所指与含义
  choice: 正文保留第三人称“他的肉”，脚注说明为约伯供应的肉食
  alternative: 正文直接译作“我供应的食物”
  rationale: 原文保留第三人称及具体的“肉”，但语境所表达的并非食人，而是约伯家中充足的膳食；脚注兼顾字面形式与实际语义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“若……没有”刻意保留本章誓言式的条件结构；引语中的反问表达家中众人都曾从约伯的供应得到饱足。
