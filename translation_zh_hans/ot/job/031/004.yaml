base_translation:
  language: en
  yaml_path: translation/ot/job/031/004.yaml
  text: Does he not see my ways and count all my steps?[a]
translation:
  language: zh_hans
  text: '难道他不察看我的道路，

    不数点我的每一个脚步吗？[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道他不观察我的行为，计算我的每一个脚步吗？”
    reason: 词义备选：דְרָכַי可按语境解释为“我的行为”；יִרְאֶה和יִסְפּוֹר也可分别译作“观察”和“计算”。
lexical_decisions:
- source_word: הֲלֹא
  choice: 难道……不……吗
  rationale: 引出预期肯定答案的反问；这一现代汉语句式自然保留了原文的强调语气。
- source_word: הוּא
  choice: 他
  rationale: 独立代词略带强调；汉语以“他”即可自然表达，译成“他自己”会使强调过重。
- source_word: יִרְאֶה
  choice: 察看
  rationale: 基本义为“看、看见”。这里涉及上帝对约伯行为的审视，“察看”既保留视觉意象，也符合庄重的语境。
- source_word: דְרָכָי
  choice: 我所行的路
  rationale: 保留“道路”的希伯来语隐喻及复合含义，可指人生道路和行为方式；“所行”使现代汉语表达更自然，但不将其完全抽象化为“行为”。
- source_word: וְכָל
  choice: 每一个
  rationale: כָל在这里表达全称范围；配合可数的“脚步”，译作“每一个”比直译“所有”更自然。第二分句用“不……吗”承接反问，汉语中无需另译连接词仍能保留并列累加关系。
- source_word: צְעָדַי
  choice: 我的每一个脚步
  rationale: 保留逐步行走的具体意象，同时可暗指每一项行动。
- source_word: יִסְפּוֹר
  choice: 数点
  rationale: 原义是“数、计数”。“数点”保留具体的计数图像，语体庄重而易懂，不扩展为解释性的“鉴察”或“记下”。
theological_decisions:
- issue: 以拟人化的“察看”和“数点”表达上帝的知识
  choice: 保留上帝察看道路、数点脚步的具体图像，以反问肯定他知晓约伯的一切行动。
  alternative: 译为“难道他不鉴察我的行为，记下我的一切行动吗？”
  rationale: 原文采用“看”和“数”的具体动词。正文不将其抽象改写为关于上帝全知的教义陈述，也不把“道路、脚步”完全解释成“行为、行动”。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“难道……不……吗”体现反问语气；分为两个并列分句，以重复的否定结构保持诗句力度。“我所行的路”和“脚步”保留原文的人生道路隐喻。
