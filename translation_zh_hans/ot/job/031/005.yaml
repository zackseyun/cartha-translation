  yaml_path: translation/ot/job/031/005.yaml
  text: If I have walked with falsehood[b][a], and my foot has hastened to deceit—
translation:
  language: zh_hans
  text: 我若与虚假同行[a]，我的脚急奔向诡诈[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同行”在希伯来语中也可用来描述人的行为和生活方式。
    reason: cultural_note
  - marker: b
    text: 或译：“我的脚急忙追随诡诈。”原文介词可表示朝向或追随。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出约伯自证清白誓言中的条件从句；“若”简洁庄重，不额外增添强调。
- source_word: הָלַכְתִּי
  choice: 同行
  rationale: 保留“行走”的希伯来语意象，同时与עִם“与”自然衔接；这里也可指人的行事为人。
- source_word: עִם
  choice: 与
  rationale: 表达同虚假相伴、为伍的关联意义。
- source_word: שָׁוְא
  choice: 虚假
  rationale: 该词可指虚空、虚妄或虚假；与下半句“诡诈”平行时，道德层面的“虚假”最贴切，同时不窄化为具体的谎话。
- source_word: וַתַּחַשׁ
  choice: 又急奔
  rationale: 该动词表示赶快、急速行动；“急奔”保留“脚”被拟人化并迅速趋向恶行的诗歌画面，“又”承接前一分句。
- source_word: עַל
  choice: 向
  rationale: 与运动动词连用时可表达趋向目标；译作“向”符合现代汉语，也保留其方向性。
- source_word: מִרְמָה
  choice: 诡诈
  rationale: 表示欺骗、欺诈的行为或品性；“诡诈”与“虚假”形成庄重而自然的诗体平行。
- source_word: רַגְלִי
  choice: 我的脚
  rationale: 原文为单数；直译保留拟人化意象，而不改成概括性的“我的脚步”或复数“我的双脚”。
