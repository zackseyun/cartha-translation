base_translation:
  language: en
  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: zh_hans
  text: 那位在母腹中造我的，岂不也造了他吗？岂不是同一位在母腹中塑造了我们吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: 不也……吗
  rationale: 引出预期肯定回答的反问；这一现代汉语句式自然保留了希伯来文的反问力量。
- source_word: בַבֶּטֶן
  choice: 在母腹中
  rationale: 这里指人在出生前受造之处；“母腹”比笼统的“腹中”更明确，也保持庄重。
- source_word: עֹשֵׂנִי
  choice: 那……造我的
  rationale: 保留分词作实体用法的动作性与人格性，不将其直接处理成称号“我的创造主”。
- source_word: עָשָׂהוּ
  choice: 造了他
  rationale: 第三人称单数宾语承接上文所说的仆婢；不在正文中扩大为泛指所有人。
- source_word: וַיְכֻנֶנּוּ
  choice: 塑造了我们
  rationale: 这里表达在母腹中的成形与造作；“塑造”比“建立”更切合语境，复数“我们”保留约伯与对方共同受造的重点。
- source_word: בָּרֶחֶם
  choice: 在母腹中
  rationale: רֶחֶם明确指子宫；现代汉语以“母腹”表达较自然，也避免过度医学化。
- source_word: אֶחָד
  choice: 同一位
  rationale: 将אֶחָד理解为名词性用法，指同一位创造者。这一分析符合可能的希伯来句法，并避免使读者误以为约伯和仆人出自同一位生母；另一种“同一个母腹”的读法收入脚注。
theological_decisions:
- issue: 第二个单数男性宾语所指为何
  choice: 按紧接的上下文理解为约伯所说的男仆，同时不把这一伦理原则限制于男仆
  alternative: 泛指任何与约伯同为人的人
  rationale: 31:13–14直接谈到约伯的仆婢；保留“他”忠实呈现希伯来文单数形式，也让共同受造所蕴含的普遍意义由语境自然显明。
- issue: אֶחָד与“母腹”的句法关系
  choice: 正文理解为“同一位”创造者作主语
  alternative: 理解为修饰רֶחֶם，即“在同一个母腹中”或“在一个母腹中”
  rationale: 希伯来文容许两种分析。正文所选读法清楚表达二人由同一位创造者在母腹中塑造，既保存共同受造的神学张力，又不造成同母所生的生物学误解；词组的另一读法以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“造”与“塑造”形成自然递进：前者陈述创造，后者突出母腹中成形的过程。正文不使用“奴隶”或“仆人”补明“他”，以免加入本节原文没有明说的名词；其指向由上文确定。
