revisions:
- from: 那在母腹中造我的，不也造了他吗？不也是同一位在母腹中塑造了我们吗？[a]
  to: 那位在母腹中造我的，岂不也造了他吗？岂不是同一位在母腹中塑造了我们吗？
  rationale: 修订使汉语句法更完整，并按希伯来语较自然的语序将אֶחָד理解为“塑造我们”的主语。“同一位”在上下文中指造约伯和“他”的同一位创造者；这保留原文对共同受造的强调，而不把“同一个母腹”这一不稳妥且易误解的说法加入正文或脚注。
