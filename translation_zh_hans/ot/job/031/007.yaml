  yaml_path: translation/ot/job/031/007.yaml
  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
translation:
  language: zh_hans
  text: 如果我的脚步偏离了正道，我的心随着我的眼目而行，我的手上沾有任何污点[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “污点”也可译作“斑点”或“瑕疵”；希伯来语这个词可指污点、缺陷、瑕疵，或泛指任何东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטֶּה
  choice: 偏离了
  rationale: נטה在此表示从应走的路上转开；“偏离”自然地传达道德上的背离，也符合本章条件式自我诅咒的语境。
- source_word: אַשֻּׁרִי
  choice: 我的脚步
  rationale: 该词指步伐或脚步；“脚步”既保留行路意象，也可自然指人的行为。
- source_word: מִנִּי הַדָּרֶךְ
  choice: 正道
  rationale: 原文直译为“从那道路”；这里的道路具有道德隐喻。“正道”在现代汉语中清楚自然，同时保留道路意象。
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: 我的心随从了我的眼目
  rationale: 尽量贴近原文“我的心走在我的眼目之后”，保留由眼目所见引动内心欲求的鲜明表达；“随从”比逐字译为“走在……之后”更自然。
- source_word: לִבִּי
  choice: 我的心
  rationale: “心”保留希伯来文关于思想、意愿和欲求之内在中心的整体性，不窄化为“思想”或“感情”。
- source_word: עֵינַי
  choice: 我的眼目
  rationale: 直译可保留眼目与内心之间的文学和伦理关联；“眼目”庄重而易懂。
- source_word: וּבְכַפַּי דָּבַק
  choice: 我的双手沾上了
  rationale: 原文是“黏附于我的手掌”。“沾上”在汉语中自然表达污点附着于手，并可暗示行为上的玷污。
- source_word: מֻאוּם
  choice: 任何污点
  rationale: 该词可指污点、瑕疵或缺陷。此处与双手相连，“污点”最能传达行为或道德玷污的意象，同时用脚注保留词义范围。
theological_decisions:
- issue: “道路”的道德隐喻
  choice: 译为“正道”，保留行路意象并明示语境中的道德方向。
  alternative: 译为“道路”或解释为“正当行为”。
  rationale: 单译“道路”虽更形式对应，却可能在现代汉语中显得指向不明；译作“正当行为”又会抹去原文的具体隐喻。“正道”兼顾两者。
- issue: 心与眼目的关系
  choice: 保留“心”和“眼目”及其随从关系。
  alternative: 意译为“我的欲望追逐所看见的事物”。
  rationale: 原文描写内心随着眼目而行，既包含欲望，也可能涉及意志和思想；保留身体与内在之对应，避免把含义缩窄为单一心理范畴。
- issue: 手上污点的伦理含义
  choice: 保留“污点沾手”的具体意象，不直接解释为“犯罪”或“不义之财”。
  alternative: 译为“我的行为有罪”或“我的手沾了不义之物”。
  rationale: 原文容许道德玷污的理解，却没有明确限定为某一种罪或不义所得；保留意象可避免过度释义。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。以“正道、心、眼目、双手、污点”保留原文连续的身体与行路意象。句末逗号保留本节作为后续自我诅咒条件从句的未完结构。
