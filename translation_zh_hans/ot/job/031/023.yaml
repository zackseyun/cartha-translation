base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: zh_hans
  text: 因为上帝降下的灾祸使我恐惧[a]；因他的威严，我不能承受[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为上帝的灾祸令我惧怕。”希伯来文直译为“上帝的灾祸”，很可能指从上帝而来的灾祸。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因他的崇高，我不能承受”，或“因他的威严，我无法抵挡。”原文此处可表示“崇高、被高举”或“威严”；“我不能”未明说所不能承受或抵挡的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词承接上文，说明约伯为何不敢做出先前所说的恶事；“因为”自然表达其因果、解释作用。
- source_word: פַחַד אֵלַי
  choice: 使我恐惧
  rationale: פַחַד 是表示“恐惧、惊骇”的名词，אֵלַי 表示这种恐惧临到或关乎约伯。汉语用动词结构更自然，同时保留其强烈程度。
- source_word: אֵיד אֵל
  choice: 上帝降下的灾祸
  rationale: אֵיד 指毁灭性的灾难；结构“灾祸＋上帝”可理解为源自上帝的灾祸。正文明确这一较可能的来源关系，脚注保留形式上更贴近原文的译法。
- source_word: וּמִשְּׂאֵתוֹ
  choice: 面对他的威严
  rationale: שְׂאֵת 可指升高、尊崇或威严；מִן 在此可表达原因或人在其威势之下的处境。“面对他的威严”在现代汉语中自然，也不把语义仅限于抽象的“崇高”。
- source_word: לֹא אוּכָל
  choice: 我无法承受
  rationale: יכל 基本义为“能够”；此处省略了明确的补足语，可理解为无法承受、抵挡，或无法做出前述行为。正文采用符合本句平行关系的“无法承受”，脚注说明另一种理解。
theological_decisions:
- issue: אֵל 在本节中的称谓
  choice: 上帝
  alternative: 大能者／保留为“以勒”
  rationale: 这里的 אֵל 是对神的普通称谓，并无必须按专名音译的迹象。“上帝”清楚、庄重，也没有额外加入特定宗派含义。
- issue: 约伯受约束的动机
  choice: 既惧怕上帝所降的灾祸，也敬畏他的威严
  alternative: 只因害怕惩罚，或只因抽象地敬畏上帝的崇高
  rationale: 原文并列“灾祸”与“威严／崇高”，应同时保留审判之惧与面对神圣威严时的不能承受，不将张力化约为单一动机。
- issue: לֹא אוּכָל 的省略对象
  choice: 正文译为“我无法承受”
  alternative: “我不能那样做”／“我无法抵挡他”
  rationale: 希伯来文只明说“我不能”，未明示宾语。正文依紧邻的“威严”译为无法承受，同时以脚注保留其可能回指前述恶行或表示不能抵挡上帝的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“降下的灾祸”表达 אֵיד אֵל 较可能的来源关系；“面对他的威严，我无法承受”保持诗句的凝练，并通过脚注保留末句在语法和指向上的歧义。
