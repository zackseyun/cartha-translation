base_translation:
  language: en
  yaml_path: translation/ot/job/031/011.yaml
  text: For that is a disgraceful act[a], and it is an iniquity for the judges.
translation:
  language: zh_hans
  text: 因为这是可耻的淫行，也是该由审判官审理的罪行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是该受审判的罪孽”，或“是审判官当惩治的罪孽”。
    reason: פְּלִילִים既可指审判官，也可表达司法裁断或应受司法惩处的意思。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节约伯的誓言，说明他为何甘愿承担惩罚，现代汉语用“因为”自然地表达解释和因果关系。
- source_word: הוא
  choice: 这
  rationale: 代指上下文所说的通奸行为；汉语无需表达希伯来语代词的语法性别。
- source_word: זִמָּה
  choice: 可耻的淫行
  rationale: 该词在这里指性质恶劣、尤其涉及性方面的罪行；“可耻的淫行”既保留强烈的道德谴责，也明确呼应上下文。
- source_word: ו/היא
  choice: 是
  rationale: 继续对同一行为作判断；希伯来语阴性代词与名词配合，汉语自然省去重复代词并用“是”连接。
- source_word: עָוֺן
  choice: 罪孽
  rationale: 该词可指罪责、罪孽或应受惩处的过犯；“罪孽”保留其道德与法律上的分量。
- source_word: פְּלִילִים
  choice: 该由审判官审理的
  rationale: 该复数词涉及司法审判者或司法裁断；正文采用“由审判官审理”保留其司法指向，同时不把具体刑罚说得过满。
theological_decisions:
- issue: פְּלִילִים所表达的是审判官、司法审理，还是应受司法惩罚
  choice: 正文译为“该由审判官审理的”
  alternative: “该受审判的”或“审判官当惩治的”
  rationale: 希伯来语短语简练，可侧重案件属于司法审理范围，也可含应受司法惩处之意。正文保留司法归属，脚注列出惩罚性更强的理解，避免过度确定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可耻的淫行”承接通奸语境并体现זִמָּה的强烈贬义；后半句保留原文从道德谴责转向司法责任的递进。
