  yaml_path: translation/ot/job/031/032.yaml
  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: zh_hans
  text: 寄居者从未在外面[a]过夜；我向旅人打开我的门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“寄居者没有在街上过夜；我向行路人打开我的门。”
    reason: “在外面”对应 בַּחוּץ，也可在此语境中具体理解为“在街上”；整句替译同时保留“行路人”作为“旅人”的自然替代说法。
lexical_decisions:
- source_word: בַּחוּץ
  choice: 在外面
  rationale: 该词指屋外、户外或露天之处；“在外面”自然直接，也保留了原文较宽泛的空间含义。
- source_word: יָלִין
  choice: 过夜
  rationale: לין 特指留宿或度过夜晚；“过夜”简洁清楚，准确传达时间含义。
- source_word: גֵּר
  choice: 寄居者
  rationale: גֵּר 常指居住在本地人中间、并非本地出身且处境可能较弱的人；“寄居者”比“陌生人”更能体现其社会身份。
- source_word: דְּלָתַי
  choice: 门户
  rationale: 原文是带第一人称单数后缀的复数形式。“门户”在中文中自然庄重，并可概括复数的“门”。
- source_word: לָאֹרַח
  choice: 向旅人
  rationale: אֹרַח 在此语境中指行路者、旅人，而不是道路；“旅人”现代易懂，符合款待住宿者的情境。
- source_word: אֶפְתָּח
  choice: 我总……敞开
  rationale: 未完成式在约伯的自辩中可表达过去一贯或惯常的行为；“总……敞开”比单次性的“打开了”更清楚地体现这一语用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从未”与“总”共同呈现约伯在自辩中所声称的一贯好客行为；分号保留两分句之间紧密的解释和对照关系。
