  text: and my heart was secretly enticed[a], and my hand kissed my mouth—
translation:
  language: zh_hans
  text: 我的心暗中受了诱惑，我的手向我的口送了一个吻[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“我的手亲吻我的口”。也可按当时的动作习语理解为“用手送吻”；结合上下文，这很可能是向日月等天体表示敬意或崇拜的举动。
    reason: 说明字面动作及其可能承载的习俗性含义，同时不在正文中把含蓄的表达完全解释开。
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: 受了诱惑
  rationale: פתה在此为被动或不及物意义，表示内心被引诱、吸引；“受了诱惑”既自然，又不把含义强化为已经公开背弃信仰。
- source_word: בַּסֵּתֶר
  choice: 暗暗
  rationale: סתר表示隐秘、隐藏；译作“暗暗”符合现代汉语表达，也保留行为发生于内心、未公开显露的意味。
- source_word: לִבִּי
  choice: 我的心
  rationale: לֵב在此指人的内在意志与情感；“我的心”既贴近原文，也为普通读者所熟悉。
- source_word: וַתִּשַּׁק
  choice: 亲吻
  rationale: נשק的基本义是“亲吻”。正文保留具体动作，不直接改写成解释性的“送吻”或“敬拜”。
- source_word: יָדִי
  choice: 我的手
  rationale: 直译该身体意象，并保留原文以“手”为动作主体的诗性表达。
- source_word: לְפִי
  choice: 我的口
  rationale: 字面为“向着／到我的口”。译作“亲吻我的口”保持原文动作关系；其可能指一种送吻致敬的习俗，则在脚注说明。
theological_decisions:
- issue: 本节是否直接明说对日月的偶像崇拜
  choice: 正文只保留内心受诱惑和手、口之间的具体动作
  alternative: 译成“用手向日月送吻致敬”或直接说明“敬拜日月”
  rationale: 上下文表明这很可能是向天体表示敬意或崇拜的动作，但本节本身没有再次点明对象，也没有直接使用“敬拜”一词。正文不补入这些解释，以免消除原文的含蓄；文化含义放入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“暗暗受了诱惑”表达内在且隐秘的引诱；“我的手又亲吻我的口”有意保留希伯来文具体而略带陌生感的身体意象，并以脚注帮助读者理解其可能的礼拜背景。句末破折号保留本节与下一节条件句结论之间未完的语势。
