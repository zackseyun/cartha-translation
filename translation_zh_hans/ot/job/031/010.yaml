  text: then let my wife grind for another man[a], and let other men kneel over her.
translation:
  language: zh_hans
  text: 愿我的妻子替另一个男人推磨，愿别的男人跪伏在她身上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跪伏在她身上”在这里很可能是“与她同房”的委婉说法。
    reason: 该短语直译保留原文的身体意象；脚注说明在本咒诅语境中很可能具有的性委婉义，而不将其作为正文中无歧义的直述。
lexical_decisions:
- source_word: תִּטְחַן
  choice: 推磨
  rationale: 该动词本义是磨粮；“推磨”在现代汉语中保留具体的劳役图景，也不抹去本节语境中可能含有的性暗示。
- source_word: לְאַחֵר
  choice: 替别人
  rationale: אַחֵר意为“另一个、别人”；与“推磨”搭配时，“替别人”自然地表达为他人服役。
- source_word: אִשְׁתִּי
  choice: 我的妻子
  rationale: אִשָּׁה带第一人称单数后缀，在此通常指“我的妻子”。
- source_word: וְעָלֶיהָ
  choice: 在她身上
  rationale: עַל加第三人称阴性单数后缀具有“在她上面／身上”的空间含义；此译保留身体意象。
- source_word: יִכְרְעוּן
  choice: 跪伏
  rationale: כרע通常意为“跪下、屈膝”；“跪伏”既保留其具体姿态，也容纳此处很可能存在的性委婉义。
- source_word: אֲחֵרִין
  choice: 别的男人
  rationale: 该词为阳性复数，在妻子与其他男性发生关系的语境中，译作“别的男人”比笼统的“别人”更清楚。
theological_decisions:
- issue: 是否在正文中明说性交含义
  choice: 正文保留“推磨”和“跪伏在她身上”的具体意象，并用脚注说明可能的性含义。
  alternative: 愿我的妻子归别人所有，愿别的男人与她同寝。
  rationale: 希伯来文没有直接使用表示性交的动词，而是采用在本语境中很可能具有委婉性意味的具体动作。保留意象可避免把高度可能的含义提升为毫无歧义的直述。
translation_notes:
  register: 采用现代、庄重而易懂的表达。“愿……”承接约伯自我咒诅的句式；“推磨”比单用“磨”更符合现代汉语习惯，“跪伏”则保留原文动作及其刻意含混性。
