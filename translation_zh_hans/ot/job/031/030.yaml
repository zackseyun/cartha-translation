base_translation:
  language: en
  yaml_path: translation/ot/job/031/030.yaml
  text: I have not allowed my mouth to sin by asking for his life with a curse[a].
translation:
  language: zh_hans
  text: 我未曾容许我的口犯罪，借咒诅求取他的性命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以誓言”。希伯来语这个名词既可指“诅咒、咒愿”，也可指“誓言”；这里因上下文涉及希望仇敌受害，译作“诅咒”更合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: 容许
  rationale: “给”与不定式连用，在这里表达“准许、任凭”的意思；“容许”自然传达约伯主动拒绝这样做。
- source_word: לַחֲטֹא
  choice: 犯罪
  rationale: 此处保留 חטא 通常的道德含义，指约伯不肯让自己犯下的过错。
- source_word: חִכִּי
  choice: 我的口
  rationale: 字面可指“上腭”，诗歌中可转指发言的器官；上下文谈的是说出咒诅，因此译作“我的口”。
- source_word: לִשְׁאֹל
  choice: 求取
  rationale: 该不定式说明口犯罪的具体方式，即借咒诅索求对方的性命；“求取”既保留“求”的语义，也适合本句庄重的诗体。
- source_word: בְּאָלָה
  choice: 以诅咒
  rationale: אָלָה 可指诅咒或誓言；本段语境是约伯没有因仇敌遭难而幸灾乐祸，也没有恶意求其丧命，因此正文采用“诅咒”，并在脚注保留另一可能。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נפשׁ 在这里指人的生命，而非对“灵魂”作形而上陈述；“性命”准确表达咒求对方死亡的语境。
theological_decisions:
- issue: בְּאָלָה 的语义歧义
  choice: 正文译作“以诅咒”
  alternative: “以誓言”
  rationale: 上下文关于仇敌及希望他受害，更支持“诅咒”；但原词确可表示“誓言”，故不将该可能静默排除，而列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“容许我的口犯罪”保留原文以身体器官代指言语行为的诗意表达；“以诅咒求取他的性命”较为贴近原文结构，同时清楚表达约伯否认曾咒求仇敌死亡。
