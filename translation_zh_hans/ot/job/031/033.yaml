base_translation:
  language: en
  yaml_path: translation/ot/job/031/033.yaml
  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: zh_hans
  text: 我若像世人[a]一样遮掩自己的过犯，把自己的罪孽藏在怀里——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“像亚当一样”。希伯来文“אָדָם”既可指一般的人，也可作专名“亚当”。
    reason: 保留原文中普通名词与专名之间的真实歧义。
lexical_decisions:
- source_word: אִם
  choice: 我若
  rationale: 引出约伯誓言结构中的条件从句；“若”保留未完的假设语气，并与上下文衔接自然。
- source_word: כִּסִּיתִי
  choice: 遮掩
  rationale: כסה兼有“覆盖、遮掩”之意；“遮掩”既保留覆盖的意象，也自然表达隐瞒过犯。
- source_word: כְאָדָם
  choice: 像世人一样
  rationale: אָדָם在此既可作普通名词，指人或世人，也可理解为专名“亚当”。正文采用普通名词义，并以脚注保留专名读法。
- source_word: פְּשָׁעָי
  choice: 自己的过犯
  rationale: פֶּשַׁע指越界、悖逆或过犯；“过犯”保留其道德和法理色彩。“自己的”在中文中清楚承接第一人称主语。
- source_word: לִטְמוֹן
  choice: 把……藏
  rationale: טמן意为藏匿、隐藏；结合中文把字句，清楚表达遮掩过犯的具体方式。
- source_word: בְּחֻבִּי
  choice: 在怀里
  rationale: 保留希伯来文“怀中、胸怀处”的具体意象，同时使用现代汉语自然表达。
- source_word: עֲוֺנִי
  choice: 自己的罪孽
  rationale: עָוֹן可指罪孽、罪责或罪所带来的后果；“罪孽”保留较重的道德含义，并与“过犯”有所区别。
theological_decisions:
- issue: כְאָדָם中אָדָם的理解
  choice: 普通名词：“像世人一样”
  alternative: 专名：“像亚当一样”
  rationale: 希伯来文在语法上容许两种理解。正文不把可能的亚当典故确定化，采用普通名词义；脚注保留历史悠久且具有释经意义的专名读法。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“遮掩……藏在怀里”保留原文由外在覆盖到内里藏匿的具体意象；句末破折号表明誓言的条件从句尚未结束。
