base_translation:
  language: en
  yaml_path: translation/ot/job/031/037.yaml
  text: I would declare to him the number of my steps[c][b][a]; like a prince I would approach him.
translation:
  language: zh_hans
  text: 我愿向他陈明我脚步的数目[a][b]；我愿像一位王侯[c]那样走近他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我愿向他交代我的一切脚步。”
    reason: lexical_alternative
  - marker: b
    text: 本节的“他”可能指上帝，也可能指紧邻语境中控告约伯的人。
    reason: alternative_reading
  - marker: c
    text: “王侯”或译“统治者”或“尊贵者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: 数目
  rationale: 该名词本义为“数目、总数”。与“我的脚步”连用时也暗含对一生行为作出完整交代，但正文保留希伯来文具体的计数意象。
- source_word: צְעָדַי
  choice: 我的脚步
  rationale: 该复数名词直指“脚步、步履”，在诗歌语境中也可喻指人的行止和人生道路；“我的脚步”在现代汉语中自然，并保留这种双重意味。
- source_word: אַגִּידֶנּוּ
  choice: 我愿向他陈明
  rationale: נגד 的使役词干常表示“告知、陈明、宣告”。“陈明”符合本段申辩和审理的庄重语气；将第三人称阳性单数后缀按语境表达为间接对象“向他”，同时不在正文中指明其身份。
- source_word: כְּמוֹ
  choice: 像……那样
  rationale: 忠实表达比较关系，并符合自然的现代汉语句式。
- source_word: נָגִיד
  choice: 王侯
  rationale: 该词可指领袖、统治者或尊贵者。“王侯”体现其地位与尊严，突出约伯坦然进前的姿态，又不把它狭义限定为现代政治职务。
- source_word: אֲקָרֲבֶנּוּ
  choice: 我愿走近他
  rationale: קרב 在此表示靠近、进前；“走近他”简洁地保留动作及人称宾语，也契合前半句“脚步”的形象。
theological_decisions:
- issue: 两个第三人称阳性单数后缀所指的对象
  choice: 正文只译作“他”，不明确其身份
  alternative: 明确译作“上帝”或“控告我的人”
  rationale: 紧邻语境既提到约伯的对头所写的诉状，也呈现约伯准备进前申辩的姿态。希伯来文本节没有明说“他”是谁，因此保留指代的开放性和由此产生的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的申辩语体。“陈明”体现法庭式语境；“脚步”保留诗歌隐喻；分号维持希伯来诗句两分句的平衡。
