base_translation:
  language: en
  yaml_path: translation/ot/job/031/001.yaml
  text: I have made a covenant with my eyes[a]; so how could I gaze at a virgin?
translation:
  language: zh_hans
  text: 我与我的眼睛立了约；我又怎能定睛看处女呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我为什么还要看处女呢？”
    reason: 保留וּמָה在此可作“为什么/为何”的疑问理解；正文采用其在上下文中自然的推论式反问表达。
lexical_decisions:
- source_word: בְּרִית
  choice: 约
  rationale: 该词指具有约束力的庄重承诺；“约”既保留其分量，也自然契合希伯来语“立约”的固定表达。
- source_word: כָּרַתִּי
  choice: 立了
  rationale: 原文直译为“割约”，但现代汉语以“立约”表达同一惯用意义；完成体说明约已经立定，并对当前行为仍有约束力。
- source_word: לְעֵינַי
  choice: 与自己的眼睛
  rationale: 介词短语可表示立约所针对或涉及的对象；译作“与自己的眼睛”保留原文鲜明的拟人表达，同时符合现代汉语习惯。
- source_word: וּמָה
  choice: 又怎能
  rationale: 连接词加疑问词承接前句，引出立约后的反问性后果；“又怎能”自然表达‘既已如此，怎么还会’的推论语气，同时不把反问改成平直陈述。
- source_word: אֶתְבּוֹנֵן
  choice: 定睛看
  rationale: 该动词表示专注、审视或持续观看，而非偶然一瞥；“定睛看”保留刻意注视的意味，又不额外加入原文未明说的“贪恋”等动机。
- source_word: עַל
  choice: 看
  rationale: 该介词与观看动词连用时标示观看对象；汉语无需另译介词，其关系自然包含在“看处女”中。
- source_word: בְּתוּלָה
  choice: 处女
  rationale: 该词通常指未有性经历的年轻女子；“处女”比“年轻女子”更精确，也比“少女”更少依赖年龄推断。
theological_decisions:
- issue: 反问词 וּמָה 的理解
  choice: 译为“又怎能”，侧重前后两句的推论关系
  alternative: “为什么还要”或“又何必”
  rationale: 原文疑问表达可带“为何”或“怎能”的色彩。上下文是约伯以所立之约为依据申明自己的行为，“又怎能”最自然地呈现约束与不相容性，但不将其绝对化为能力问题。
- issue: 注视对象与道德动机
  choice: 只译“定睛看处女”，不补入“动情地”“贪恋地”等词
  alternative: “贪恋地看处女”
  rationale: 上下文显然涉及性道德，但本节原文本身没有直接出现“贪恋”一词；保留这种含蓄可避免把解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立了约”保留原文法律与伦理上的郑重感；“定睛看”体现持续、专注的观看。正文保持反问形式及原文的含蓄，不额外说明观看的欲念性质。
