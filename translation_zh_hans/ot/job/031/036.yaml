  yaml_path: translation/ot/job/031/036.yaml
  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
translation:
  language: zh_hans
  text: 我必把它扛在肩上；我要把它当作冠冕佩戴在身上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冠冕”原文为复数，也可译作“如众冠冕般”。这里可能是加强语气的复数用法。
    reason: 保留希伯来文复数形式及其可能的译法。
lexical_decisions:
- source_word: אִם לֹא
  choice: 我必
  rationale: 在本段宣誓语境中，这一结构不是普通条件句，而是强烈的断言；“我必”自然传达其强调语气。
- source_word: עַל שִׁכְמִי
  choice: 在肩上
  rationale: 忠实保留希伯来文单数“肩”的具体形象，表现约伯公开承担那份诉状或指控。
- source_word: אֶשָּׂאֶנּוּ
  choice: 把它扛
  rationale: נשׂא 在此表示承载、扛起；“扛”与肩膀搭配自然，也保留鲜明的身体动作。
- source_word: אֶעֶנְדֶנּוּ
  choice: 把它……佩戴
  rationale: ענד 指把饰物系上或戴上；“佩戴”既符合饰物意象，也不把动作局限为单纯捆绑。
- source_word: עֲטָרוֹת
  choice: 如冠冕般
  rationale: 原文形态为复数，但在此可能是加强性复数或指冠冕式饰物；中文用单数类称“冠冕”更自然，同时以脚注保留复数信息。
- source_word: לִי
  choice: 在身
  rationale: 与“佩戴”结合，表达约伯把它戴在自己身上的反身含义，不额外限定为戴在头上。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代汉语。“扛在肩上”与“佩戴在身”保留原文由承担转为荣耀饰物的鲜明意象；脚注标记置于“冠冕”相关短语之后。
