  yaml_path: translation/ot/job/031/017.yaml
  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
translation:
  language: zh_hans
  text: '我若独自吃我的一份，

    而丧父的孩子没有从中吃——'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֹכַל
  choice: 我若……吃
  rationale: 本词形式上由连接词和第一人称单数未完成式构成；结合约伯记31章连串誓言式条件句的语境，用“若”明确表达条件前件。
- source_word: פִּתִּי
  choice: 我的一份
  rationale: פַּת可指一小块食物，常指一块饼。“一份”在现代汉语中自然，并保留有限食物份额的具体感，且不把所指限定为饼。
- source_word: לְבַדִּי
  choice: 独自
  rationale: 准确表达“独自、只有我一人”的意思；与“吃”搭配简洁自然。
- source_word: וְלֹא אָכַל
  choice: 没有让……也吃
  rationale: 希伯来文直译为“而……没有吃”。汉语采用兼语结构，清楚表达约伯未与弱势者分享食物这一语境含义，同时保留否定事实。
- source_word: יָתוֹם
  choice: 丧父的孩子
  rationale: 该词特指失去父亲、因而处于社会弱势的人。“丧父的孩子”比“孤儿”更精确地保留希伯来词的范围，也比名词化的“无父者”自然。
- source_word: מִמֶּנָּה
  choice: 一点
  rationale: 原文意为“从它（即我的那份食物）”。在“让……也吃一点”中，以自然汉语表达从该份食物中分食的关系，所指仍清楚。
theological_decisions:
- issue: 誓言式条件句的未完结性
  choice: 以“我若”起句，并以破折号收尾
  alternative: 译作独立陈述句“我独自吃了……”
  rationale: 本节是约伯自我咒诅誓言的一项条件前件，后果在后文出现；保留破折号可呈现原文悬而未决的句法张力。
- issue: 对弱势者的责任是共享还是使其进食
  choice: 译为“没有让丧父的孩子也吃一点”
  alternative: 直译为“丧父的孩子没有从中吃”
  rationale: 原文语法只明说孩子没有从那份食物中吃，并未明说具体安排；所选译法符合汉语表达且呈现分享责任，但不扩展为制度性施舍或特定宗教义务。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“丧父的孩子”准确呈现יָתוֹם的字面及社会处境，因此无需另加词汇脚注；分行和末尾破折号保留本节作为誓言条件前件的诗体与未完结感。
