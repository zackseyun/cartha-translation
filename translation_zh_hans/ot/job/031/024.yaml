  text: אִם שַׂ֣מְתִּי זָהָ֣ב כִּסְלִ֑/י וְ֝/לַ/כֶּ֗תֶם אָמַ֥רְתִּי מִבְטַחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/024.yaml
  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: zh_hans
  text: 我若以黄金为我的倚靠[a]，对精金[b]说：“你是我的保障[c]”，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倚靠”也可译作“指望”或“信心”（כִּסְלִי）。
    reason: lexical_alternative
  - marker: b
    text: “精金”（כֶּתֶם）指精炼或纯净的黄金。
    reason: lexical_alternative
  - marker: c
    text: “保障”也可译作“所信赖的”或“信靠”（מִבְטַחִי）。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出约伯自证清白誓言中的条件从句；本节的句意要到后文才完整，因此保留未完结的条件结构。
- source_word: שַׂמְתִּי
  choice: 以……为
  rationale: שׂים本义为“放置、设立”；在“黄金—我的倚靠”这一结构中，用“以……为”自然表达把黄金当作倚靠对象的结果义。
- source_word: זָהָב
  choice: 黄金
  rationale: 直接表达普通意义的金子，并与下半句表示优质精炼黄金的כֶּתֶם有所区别。
- source_word: כִּסְלִי
  choice: 我的倚靠
  rationale: כֶּסֶל在此可指信心、指望或所倚赖的对象；“倚靠”符合依赖财富的语境，同时不与后面的מִבְטַחִי完全合并为同一个词。
- source_word: וְלַכֶּתֶם
  choice: 对精金
  rationale: כֶּתֶם指精炼、纯净的黄金；“精金”简洁庄重，并保留其与זָהָב的词汇差别。介词ל用“对”表达“说”的间接对象。
- source_word: אָמַרְתִּי
  choice: 说
  rationale: 在“若……说……”的并列条件结构中，现代汉语无需重复时态或体标记。
- source_word: מִבְטַחִי
  choice: 我的保障
  rationale: מִבְטָח可指信赖、保障或所信赖之物；“保障”突出黄金被视为安全依托的含义，也保留其与前句“倚靠”的词汇变化。
theological_decisions:
- issue: 约伯否认倚赖财富的表达方式
  choice: 保留为誓言式自辩中的条件句：“我若以黄金为我的倚靠……”
  alternative: “我若把指望放在黄金上……”
  rationale: 原文并非一般性教训，而是约伯在连串自证清白的话中提出条件；译文保留他否认把财富当作终极依靠的伦理和神学意味，不添加后来的教义术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“若”延续本章誓言式条件句的语气；句末用逗号，表明这一条件从句在后续经文中才完成。所有脚注标记均置于所说明的词语之后。
