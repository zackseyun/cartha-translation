translation:
  language: zh_hans
  text: 愿我的肩膀从肩胛处[a]脱落，愿我的手臂从臂骨处[b]折断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从肩头脱落”；希伯来语指肩部或背部一带，此处可能描写肩膀从原位或关节处脱开。
    reason: lexical_alternative
  - marker: b
    text: 或译“从关节处折断”。这里的希伯来词较罕见，可能指手臂的骨骼或关节结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: 我的肩膀
  rationale: כָּתֵף通常指肩部；此处与下半句的“手臂”平行，译作“肩膀”自然且准确。
- source_word: מִשִּׁכְמָה
  choice: 从肩胛处
  rationale: שִׁכְמָה指肩或背部的相关部位。结合“脱落”的身体伤损语境，“从肩胛处”既保留原文的身体部位意象，也表达肩部从连接处脱离，但不把具体解剖结构定死为“关节窝”。
- source_word: תִפּוֹל
  choice: 脱落
  rationale: נפל的基本义是“落下”。在肩部从其所在处落下的语境中，“脱落”比直译“掉下”更符合现代汉语，同时保留原文具体而强烈的诅咒意象。
- source_word: וְאֶזְרֹעִי
  choice: 愿我的手臂
  rationale: זְרוֹעַ通常指“手臂”；加“愿”承接本节自我咒诅的祈愿句式。
- source_word: מִקָּנָה
  choice: 从臂骨处
  rationale: קָנֶה本义可指“芦苇、杆”，此处罕见地用于身体结构，语境很可能指手臂的骨骼或关节部位。“臂骨处”符合上下文，也保留其具体的身体意象。
- source_word: תִשָּׁבֵר
  choice: 折断
  rationale: שׁבר的Nifal形式表示“被折断”。汉语“折断”准确传达被动伤损结果，不额外强化为“粉碎”。
