  text: then let me sow and another eat[a], and let my offspring be uprooted.
translation:
  language: zh_hans
  text: 那么，愿我撒种，别人来吃；愿我的后代[a]被连根拔除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿我的出产被连根拔除。”希伯来语“所生出的”既可指后代，也可指土地的出产。
    reason: 保留צֶאֱצָא在后代与出产之间的词义歧义，避免把本节的人伦和农业意象单一化。
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: 愿我撒种
  rationale: 该词是זרע的Qal祈愿式第一人称单数；在本章自我咒诅的誓言语境中，用“愿我……”表达祈愿兼咒诅的语气。
- source_word: וְאַחֵר יֹאכֵל
  choice: 别人来吃
  rationale: אַחֵר指“另一个人、别人”，אכל直指“吃”；此译保持约伯撒种却由他人享用收成的鲜明对比和农业意象。
- source_word: וְצֶאֱצָאַי
  choice: 我的后代
  rationale: צֶאֱצָא可指所生出的后代，也可指土地所长出的出产。正文采用较可能的人伦含义“后代”，同时以脚注保留农业含义的真实歧义。
- source_word: יְשֹׁרָשׁוּ
  choice: 被连根拔除
  rationale: שׁרשׁ的Piel形式在此表示除根、拔除；“被连根拔除”既传达强烈的被动结果，也保留“根”的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么”承接上一节的条件句；两个“愿”保持自我咒诅的誓言语气。“连根拔除”自然传达希伯来语的根系意象。
