  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
translation:
  language: zh_hans
  text: 如果我吃了地里的出产而未付价钱，或使地的主人丧气[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使地的主人丧命”；也可理解为“使他们喘不过气来”。这里的希伯来语动词十分罕见，可能指以严酷压迫使人丧气或困顿，也可能指使人死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: 地里的出产
  rationale: כֹּחַ本义为“力量、能力”，在土地语境中指土地的生产力，即其出产；阴性后缀承接上下文中的土地。译为“地里的出产”自然且明确。
- source_word: אָכַלְתִּי
  choice: 我白吃了
  rationale: 动词本义为“吃”。结合בְלִי כָסֶף，“白吃了”在现代汉语中简洁表达吃用其出产却未付款，并保留第一人称完成动作的意味。
- source_word: בְלִי כָסֶף
  choice: 没有付钱
  rationale: כֶּסֶף本义为“银子”，也常转指钱财或价款；此处重在没有为土地出产支付代价。
- source_word: נֶפֶשׁ בְּעָלֶיהָ
  choice: 地的主人丧命
  rationale: נֶפֶשׁ可指生命、性命；בְּעָלֶיהָ指土地的所有者。此译保留原文较强且具体的生命含义，同时以脚注说明罕见动词造成的不确定性。
- source_word: הִפָּחְתִּי
  choice: 使……丧命
  rationale: 此罕见的Hiphil形式可理解为“使气息断绝、使丧命”，也可能表示“使喘息、使精疲力竭”。正文采用与נֶפֶשׁ搭配后较直接的生命义，脚注保留较弱的压迫、耗尽之义。
