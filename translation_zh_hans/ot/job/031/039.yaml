- from: 如果我白吃了地里的出产，没有付钱，或使地的主人丧命[a]——
  to: 如果我吃了地里的出产而未付价钱，或使地的主人丧气[a]——
  rationale: 修订避免把原文罕见动词的死亡含义作为唯一确定解释，同时保留其可能的强义于脚注。“丧气”与英语审校轨迹中的“lose heart”相符，且在中文正文中不排除该动词所含的压迫、耗竭意味。措辞亦调整为较庄重、自然的现代书面汉语。
