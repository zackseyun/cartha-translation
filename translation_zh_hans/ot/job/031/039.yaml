  terminology: “地的主人”对应 בְּעָלֶיהָ（该地的所有者）恰当；“价钱”在此比泛指的“钱”更准确体现未支付土地出产的对价。脚注应明确“丧命”只是可能译法，不应让正文单独承担这一有争议的强义。
