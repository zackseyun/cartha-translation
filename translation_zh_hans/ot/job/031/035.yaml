base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: zh_hans
  text: 但愿有人听我申诉！看，我的签名在此[a]；愿全能者回答我，愿与我争讼的人提交一份控告书[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的记号”或“我的标记”。希伯来文可能指约伯在自己的陈述上所作的确认标记。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译为“愿与我争讼的人写一份文书”。“文书”本身可泛指书面文件；按上下文，这里可指对约伯提出的书面控罪。
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן לִי שֹׁמֵעַ לִי
  choice: 但愿有人听我申诉
  rationale: מִי יִתֶּן是表达强烈愿望的惯用语；שֹׁמֵעַ לִי在本段司法语境中不只是一般聆听，也指听取约伯的陈词，因此译为“听我申诉”。
- source_word: הֶן
  choice: 看，这是
  rationale: 该词用于引人注意；“看，这是”自然地呈现约伯当场指出其具结标记的语气。
- source_word: תָּוִי
  choice: 我的签名
  rationale: תָּו本义为记号、标记；此处是约伯对前述自辩作出的确认或具结，现代汉语用“签名”最能传达其司法功能，同时在脚注保留字面可能。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是《约伯记》中常见的神圣称号；“全能者”是简明、庄重且不过度解释的对应。
- source_word: יַעֲנֵנִי
  choice: 回答我
  rationale: ענה在此指对约伯的申诉作出回应；直译“回答我”保留约伯向全能者提出挑战的力度。
- source_word: וְסֵפֶר כָּתַב
  choice: 写下诉状
  rationale: סֵפֶר是书面文件，כתב是“写”；结合争讼语境，译作“写下诉状”表达该文件作为正式控罪书的功能。
- source_word: אִישׁ רִיבִי
  choice: 指控我的人
  rationale: 字面是“与我争讼的人”；在法庭语境中指控告约伯的一方。“指控我的人”清楚自然，又不像“原告”那样加入过于特定的程序身份。
theological_decisions:
- issue: 约伯言辞中的法庭意象
  choice: 采用“申诉、签名、指控、诉状”等现代司法用语
  alternative: 较为字面的“听我、我的记号、与我争讼的人、文书”
  rationale: 上下文将约伯的话呈现为正式的自辩和要求对方提出书面控罪。明确法庭意象能传达希伯来文的语用功能，却不预断全能者与控告者是否为同一方。
- issue: “指控我的人”的身份
  choice: 保持身份开放，不把他明确等同于全能者
  alternative: 直接译成“愿全能者……写下控告我的文书”
  rationale: 原文先提“全能者”，随后使用“与我争讼的人”，两者在语境中可能有关联，但语法并未明说完全等同；译文保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但愿”表达希伯来文的愿望语气；整体保留约伯公开具结、要求回应并索取书面控罪的法庭口吻。
