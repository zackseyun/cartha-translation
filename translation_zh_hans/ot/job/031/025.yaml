  text: אִם אֶ֭שְׂמַח כִּי רַ֣ב חֵילִ֑/י וְ/כִֽי כַ֝בִּ֗יר מָצְאָ֥ה יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/025.yaml
  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: zh_hans
  text: 如果我因财富丰厚而欢喜，又因我亲手获得许多而欣喜——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 引出约伯自证清白誓言中的条件从句；“如果”自然保留其未完的誓言结构。
- source_word: אֶשְׂמַח
  choice: 欢喜／欣喜
  rationale: שׂמח表示喜悦。首处译“欢喜”，平行的第二因由共用该动词，并用“欣喜”自然补出，保持财富成为喜乐依据这一重点。
- source_word: כִּי
  choice: 因
  rationale: 两处均表原因，说明约伯所否认的是因财富丰厚及亲手有所得而喜悦。
- source_word: רַב חֵילִי
  choice: 财富丰厚
  rationale: חַיִל在此语境指物质财富或资财；רַב表示数量充裕。“财富丰厚”准确且符合现代汉语。
- source_word: כַבִּיר
  choice: 众多
  rationale: 此词表示数量或程度很大；在动词“所得”之后名词化译作“众多”，既保留量大的含义，也不擅自限定具体所得之物。
- source_word: מָצְאָה יָדִי
  choice: 我手所得的
  rationale: 原文直译为“我的手找到了”，是亲手获得之意。保留“我手”的意象，凸显个人取得财富的能动性，同时用“所得”使中文自然。
theological_decisions:
- issue: 本节是否谴责财富本身
  choice: 译文表明约伯所否认的是以丰厚财富和亲手所得为喜乐的依据。
  alternative: 可宽泛地译成仅仅拥有财富便有罪。
  rationale: 原文的重点是“欢喜”及其两个由כִּי引出的原因，而非单纯拥有财富；保留“我手”也维持了对自我成就感的潜在指向，不额外加入“倚靠”等原文未明说的概念。
- issue: 第二分句是否补出喜乐动词
  choice: 补出“欣喜”，使两个原因分句在现代汉语中关系清楚。
  alternative: 译作“又因我手所得的众多”，让动词仅由前文统摄。
  rationale: 希伯来文中第二个וְכִי分句由前面的אֶשְׂמַח统摄；中文补出同义动词并未增加命题内容，且更自然地呈现平行结构。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“财富丰厚”清楚表达物质资财；“我手所得”保留希伯来文的手之意象。句末破折号承接本章誓言式条件句的后续内容。
