  text: if I have raised my hand against the fatherless because I saw that I had support in the gate—[a][b][c]
translation:
  language: zh_hans
  text: 我若曾向失去父亲的孩子[a]举手加害，只因看见自己在城门口[b]有人相助[c]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“孤儿”。希伯来语特指失去父亲、因而在社会上缺少保护的人。
    reason: lexical_alternative
  - marker: b
    text: “城门口”是城中长老审理案件、处理公共事务的地方。
    reason: cultural_note
  - marker: c
    text: 原文直译“我的帮助”，这里指在审判或公共事务中得到的支持、后援。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出本章自我诅咒誓言中的条件从句，并与下一节承接；“若”简洁而庄重。
- source_word: הֲנִיפוֹתִי
  choice: 曾……举手攻击
  rationale: נוּף 的使役式在这里表示向人举手、挥手的敌对动作。“举手攻击”既保留手势意象，也避免现代汉语把“举手”误解为表决或发言。
- source_word: עַל
  choice: 向
  rationale: 与“举手攻击”搭配，表达动作针对某人，传达原文的敌对意味。
- source_word: יָתוֹם
  choice: 无父的孩子
  rationale: 该词特指失去父亲、因而缺少保护的儿童；此译比现代汉语通常可能兼指父母双亡者的“孤儿”更精确。
- source_word: יָדִי
  choice: 手
  rationale: 保留原文具体的身体意象，并在“举手攻击”这一表达中自然呈现第一人称所属关系。
- source_word: כִּי
  choice: 只因
  rationale: 在这里说明仗势欺压弱者的动机；“只因”自然传达因果关系，并凸显行为与所倚仗的支持之间的联系。
- source_word: אֶרְאֶה
  choice: 看见
  rationale: 保留常用的视觉动词，同时在语境中自然包含“察觉、知道”的含义。
- source_word: בַשַּׁעַר
  choice: 在城门口
  rationale: 明确这是城门这一公共司法场所；“城门口”符合现代汉语表达，相关制度背景由脚注说明。
- source_word: עֶזְרָתִי
  choice: 有人相助
  rationale: 原文直译为“我的帮助”，语境所指是在审判和公共事务中可倚靠的支持或后援；“有人相助”表达自然，又不把这种支持具体化为某种固定权势。
theological_decisions:
- issue: 本节条件句没有在本节内说出后果
  choice: 以破折号保留悬而未决的誓言结构，让句意承接下一节
  alternative: 在本节补出“愿我的肩头脱臼”等诅咒内容
  rationale: 原文第21节只是条件从句，誓言的后果见下一节；不提前补写可保留希伯来文的修辞推进和经文分节关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“无父的孩子”突出原词所指的社会弱势身份；“举手攻击”保留原文手势，又让敌对含义在现代汉语中清楚。句末破折号表示条件誓言尚未说完，并自然承接下一节。
