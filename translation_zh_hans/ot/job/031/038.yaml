base_translation:
  language: en
  yaml_path: translation/ot/job/031/038.yaml
  text: If my land cries out against me[a], and its furrows weep together,
translation:
  language: zh_hans
  text: 若我的土地呼喊着控告我，它的犁沟也一同哭泣，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 引出约伯自证清白誓言中的条件从句；用“如果”简洁自然。
- source_word: עָלַי
  choice: 向我
  rationale: 与“呼冤”搭配，表达土地因受亏待而向土地所有者提出控诉，保留原文介词在此处的指控意味。
- source_word: אַדְמָתִי
  choice: 我的土地
  rationale: 指可耕种的地土；“土地”符合农业语境，也自然表达所属关系。
- source_word: תִזְעָק
  choice: 呼冤
  rationale: זעק表示因困苦或不公而大声呼喊；此处土地被拟人化，并在约伯的清白誓言中充当控诉者，“呼冤”兼顾强烈呼喊与申诉意味。
- source_word: וְיַחַד
  choice: 也一同
  rationale: 表达联合或同时发生；“也一同”自然连接土地与犁沟的拟人化行动。
- source_word: תְּלָמֶיהָ
  choice: 它的犁沟
  rationale: תלם指犁耕形成的沟垄；“犁沟”准确而易懂。
- source_word: יִבְכָּיוּן
  choice: 哭泣
  rationale: בכה的常义是哭泣；此处延续对田地的拟人化，并与前面的强烈呼喊形成诗意平行。
theological_decisions:
- issue: 土地的呼喊是否带有控诉意味
  choice: 译作“向我呼冤”
  alternative: 译作“对我呼喊”或“因我呼喊”
  rationale: 本节位于约伯的清白誓言中，土地及犁沟被拟作因遭受不义而控诉的见证者；“呼冤”传达这一司法和道德色彩，但不进一步指明具体罪行。
translation_notes:
  register: 采用现代、庄重且易懂的诗体表达。保留土地与犁沟的拟人化及两个不同动词的平行：“呼冤”对应强烈呼喊，“哭泣”对应哀哭。经文是跨节条件句的前半部分，因此末尾保留逗号。
