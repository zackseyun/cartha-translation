base_translation:
  language: en
  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: zh_hans
  text: 难道灾祸不是临到不义的人，祸患临到作恶的人吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: 难道……不是……吗
  rationale: 保留希伯来语反问语气；此问预期肯定回答，现代汉语用“难道……不是……吗”表达自然有力。
- source_word: אֵיד
  choice: 灾祸
  rationale: 指毁灭性的灾难或败亡；“灾祸”简明庄重，也适合本节所论的道德后果。
- source_word: לְעַוָּל
  choice: 给不义之人的
  rationale: עַוָּל 指以不公不义为特征的人；“不义之人”保留其伦理性质，没有把词义缩窄为某一种具体罪行。
- source_word: וְנֵכֶר
  choice: 祸患
  rationale: 本处与 אֵיד 构成诗歌平行，语境中宜指异常而严重的不幸或灾变；“祸患”既与“灾祸”呼应，又避免机械重复。
- source_word: לְפֹעֲלֵי
  choice: 给作……之人
  rationale: 分词形式可指实行或惯常从事某事的人；汉语“作恶之人”自然，并保留行为者的强调。
- source_word: אָוֶן
  choice: 恶
  rationale: 此词可指邪恶、罪孽、祸害或虚妄；与“作”连用时，“作恶”准确表达有道德责任的恶行，且是现代汉语的自然搭配。
theological_decisions:
- issue: 智慧文学中的道德秩序
  choice: 译为灾祸和祸患是为不义者与作恶者而有，不进一步说明其发生机制。
  alternative: 明确译成上帝直接施加的惩罚，或仅仅译成行为的自然后果。
  rationale: 希伯来文本陈述不义者与作恶者同灾祸、祸患之间的对应关系，却未在本节明说这是上帝直接降罚，还是更广义的道德秩序所产生的结果；译文保留这一张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。以双重反问呈现希伯来诗歌的平行结构；“灾祸／祸患”和“不义之人／作恶之人”分别形成对应，避免生硬照搬“行作罪孽者”等不自然表达。
