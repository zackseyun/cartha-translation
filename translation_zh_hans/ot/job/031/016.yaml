  yaml_path: translation/ot/job/031/016.yaml
  text: If I have withheld the poor from their desire[a], or caused the eyes of the widow to fail[b],
translation:
  language: zh_hans
  text: 我若曾扣留穷人所盼望的[a]，或使寡妇的眼目衰残[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扣留穷人所渴望的事物”；按上下文，也可理解为“不把穷人所需要的给他们”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译：“使寡妇的眼目衰残／失效。”这是一种表达长久盼望而未得回应、以致盼望耗尽的说法。
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: 我若
  rationale: 引出约伯在本章自我咒诅誓言中的条件句；“我若”自然体现第一人称及未完待续的誓言结构。
- source_word: אֶמְנַע מֵחֵפֶץ דַּלִּים
  choice: 不让穷人得到他们所渴望的
  rationale: מנע 表示阻止、扣留或不让得到；חפץ 可指愿望或所渴望之物。此译法在现代汉语中自然，并保留“渴望”而未径直限定为“需要”。
- source_word: דַּלִּים
  choice: 穷人
  rationale: דלים 可指贫穷、弱小或卑微的人；本节社会关怀语境中译作“穷人”最贴切。
- source_word: וְ
  choice: 或
  rationale: 在连续的条件性自我控诉项目中，汉语用“或”自然连接并列罪状；不改变希伯来语连接词的并列功能。
- source_word: עֵינֵי אַלְמָנָה אֲכַלֶּה
  choice: 使寡妇望眼欲穿
  rationale: 字面为使寡妇的眼睛耗尽；“望眼欲穿”保留眼睛因长久等候而疲惫的意象，也自然表达盼望迟迟落空。
