base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: zh_hans
  text: 我若惧怕众人，宗族[a]的轻蔑使我惊惧，以致我默不作声，不出门口——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译作“家族”。这里所指的可以是大家族，也可以是范围更广的亲族群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 难道……吗
  rationale: 本节处于约伯的无罪誓言中，כִּי 所引出的情形与上下文隐含的条件结构相连。中文用反问形式自然地表达约伯否认自己曾因社会压力而缄默，同时不把它硬译成单纯的因果陈述。
- source_word: אֶעֱרוֹץ הָמוֹן רַבָּה
  choice: 我因惧怕众人
  rationale: אֶעֱרוֹץ 表示畏惧、惧怕；הָמוֹן רַבָּה 指庞大的人群。译为“惧怕众人”简洁自然，并保留来自公众的压力。
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: 因各宗族的鄙视
  rationale: בּוּז 是鄙视、轻蔑；מִשְׁפָּחוֹת 可指家族或更广的宗族群体。“各宗族”避免现代核心家庭的狭义联想，也贴合古代社会结构。
- source_word: יְחִתֵּנִי
  choice: 而惊恐
  rationale: חתת 的使役式表示使人惊惧、丧胆。中文把施事“各宗族的鄙视”与结果“惊恐”连起来，保留其强烈程度。
- source_word: וָאֶדֹּם
  choice: 就默不作声
  rationale: דמם 表示沉默、静止；承接前面的恐惧，结果性地译为“就默不作声”，符合中文表达。
- source_word: לֹא אֵצֵא פָתַח
  choice: 不敢迈出门口
  rationale: 字面是“不出去门口/入口”。“不敢迈出门口”自然呈现因恐惧而留在室内的图景；“不敢”是由上下文关系显出的含义。
theological_decisions:
- issue: 无罪誓言中本句的句法功能
  choice: 译成反问，表达约伯否认自己曾因舆论压力而沉默躲避
  alternative: 译成“因为我惧怕……所以我沉默……”，作为直陈因果句
  rationale: 希伯来文表达简略，כִּי 可与上下文隐含的条件或誓言结构相接。反问在现代汉语中较清楚地传达约伯的自辩，但脚注保留另一种句法理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众人”“宗族”“默不作声”“迈出门口”保留公共压力、亲族群体和闭门缄默的具体意象。末尾保留破折号，以衔接下一节突然插入的呼求。
