  yaml_path: translation/ot/job/031/019.yaml
  text: if I have seen anyone perishing for lack of clothing[b][a], or the needy without covering—
translation:
  language: zh_hans
  text: 我若见有人因无衣而濒临死亡，[a]或见穷乏人没有遮身之物——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因无衣”，或译“没有衣服”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 我若
  rationale: 在约伯自陈无辜的誓言结构中引出条件从句；“若”保留未完结的条件句式。
- source_word: אֶרְאֶה
  choice: 见
  rationale: 第一人称单数未完成式置于“若”之后，中文无需标明完成体；结合全章语境自然指过去经验。
- source_word: אֹבֵד
  choice: 有人……将要灭亡
  rationale: 该分词描写正在走向毁灭或死亡的人；“将要灭亡”保留过程和危急性，同时以“有人”表达不定单数。
- source_word: מִבְּלִי לְבוּשׁ
  choice: 因无衣
  rationale: 该短语表示衣物匮乏，并可带有致使意味；“因无衣”简洁地保留这一因果关系。
- source_word: וְאֵין
  choice: 或见……没有
  rationale: 字面连接词为“和”，但在同一条件句内列举两个平行的失责情形时，现代汉语用“或”更自然；补出“见”使平行结构清楚。
- source_word: כְּסוּת
  choice: 遮身之物
  rationale: 指覆盖身体的东西或衣物；此译法既符合处境，也与前半句的“衣”保持词汇区别。
- source_word: לָאֶבְיוֹן
  choice: 穷乏人
  rationale: 指物质上贫困、匮乏的人；“穷乏人”准确而庄重，不额外限定其身份。
