  text: if I looked at the light when it shone[a], or at the moon moving in splendor[b],
translation:
  language: zh_hans
  text: 我若看见光正照耀[a]，或看见月亮在荣美中运行[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光”在这里与“月亮”并列，很可能指太阳。
    reason: lexical_alternative
  - marker: b
    text: 或译“月亮在光辉中行进”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 我若
  rationale: 在约伯的无罪誓言中引出假设行为；“若”简洁庄重，并与后文条件句相衔接。
- source_word: אֶרְאֶה
  choice: 见
  rationale: 未完成式在誓言语境中指约伯否认曾有的行为；中文用“我若见”自然表达，不必另加时态标记。
- source_word: אוֹר
  choice: 太阳
  rationale: 字面是“光”，但与“月亮”平行，并涉及天体，语境中很可能指太阳；正文采用自然明确的指称，同时用脚注保留字面译法。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 此处引出伴随情状；汉语直接说“太阳照耀”即可自然表达“当它照耀时”。
- source_word: יָהֵל
  choice: 照耀
  rationale: 表达发光、明亮之意；“照耀”简洁而有尊严。
- source_word: וְיָרֵחַ
  choice: 或见月亮
  rationale: 连词在这一条件誓言的并列对象间可作选择性连接；补出“见”符合现代汉语并保持结构清楚。
- source_word: יָקָר
  choice: 皎洁地
  rationale: 该词通常有“珍贵、尊贵、华美”之意，在月亮语境中描写其明亮华美；“皎洁地”符合汉语对月光的自然表达，脚注保留“华美”这一较形式对应的可能。
- source_word: הֹלֵךְ
  choice: 运行
  rationale: 分词描写月亮持续行进的状态，即沿天空运行；“运行”比“行走”更符合现代汉语的天体表达。
theological_decisions:
- issue: 可能涉及对天体的崇拜
  choice: 正文只呈现观看太阳和月亮的天象，不在本节明说崇拜含义。
  alternative: 在译文中加入“敬拜”或“迷恋”等解释性措辞。
  rationale: 第27—28节才使敬拜天体的含义明确；本节本身仅陈述观看天体，应让上下文呈现神学指向，避免提前释义。
- issue: אוֹר是“光”还是“太阳”
  choice: 正文译为“太阳”，脚注注明字面为“光”。
  alternative: 正文译为“光”，让读者从与月亮的平行关系推断太阳。
  rationale: 这里与月亮构成天体平行，“太阳”能让普通现代读者立即明白所指；脚注则保存希伯来文本的字面措辞及其细微含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“太阳照耀”与“月亮皎洁地运行”形成平衡；以脚注保存“光”和“行走／华美”等较直译表达。
