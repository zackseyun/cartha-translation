base_translation:
  language: en
  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: zh_hans
  text: 若我因那恨我的人[b]败亡[a]而欢喜，又在祸患临到他[d]时欢欣[c]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “败亡”或译“灾难”、“灾祸”。
    reason: lexical_alternative
  - marker: b
    text: 直译“恨我的人”；传统上常译“我的仇敌”。
    reason: lexical_alternative
  - marker: c
    text: “欢欣”或译“兴奋雀跃”；按语境也可译“幸灾乐祸”，以突出因别人受害而产生的不当喜悦。
    reason: lexical_alternative
  - marker: d
    text: “祸患临到他”或译“灾祸找到他”、“不幸袭击他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 引出约伯自证清白时的条件从句；本节的誓言后果留待下文，因此保留未完句式。
- source_word: אֶשְׂמַח
  choice: 欢喜
  rationale: 准确表达 שׂמח 的喜乐之意，也保留因他人受害而喜悦的伦理分量。
- source_word: בְּפִיד
  choice: 败亡
  rationale: פִיד 指灾难、毁坏或败落；“败亡”简洁自然，并能表达仇恨约伯者遭遇毁灭性衰败。
- source_word: מְשַׂנְאִי
  choice: 恨我的人
  rationale: 保留分词“恨我者”的动词意味，不直接概括为较具解释性的“我的仇敌”。
- source_word: וְהִתְעֹרַרְתִּי
  choice: 又……欢欣
  rationale: 该反身性形式在此指情绪被激起，与前句“欢喜”平行；“欢欣”表达更强烈的喜悦，却不像“幸灾乐祸”那样把恶意明说出来。
- source_word: כִּי
  choice: 因
  rationale: 这里可表达欢欣的缘由或伴随情形；汉语用“因……而……”自然衔接，也不排除“当……时”的理解。
- source_word: מְצָאוֹ
  choice: 临到他
  rationale: מצא 在灾祸作主语时有“遇上、临到、袭及”之意；“临到他”符合现代庄重汉语。
- source_word: רָע
  choice: 祸患
  rationale: 此处 רָע 指有害的境遇或不幸，而非当事人实施的道德邪恶；“祸患”避免中文“恶”可能造成的误解。
theological_decisions:
- issue: 约伯否认因仇恨自己的人败亡而喜悦时的伦理语气
  choice: 正文用“欢喜／欢欣”，呈现因他人受祸而喜悦的事实，但不直接强化为“幸灾乐祸”。
  alternative: 如果我因仇敌遭灾而欢喜，在祸患临到他时幸灾乐祸
  rationale: 上下文确有不当快意的伦理含义，但希伯来语本身没有必须译作“幸灾乐祸”的专门词；正文保留原文措辞的张力，并在脚注列出较强的语用译法。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“恨我的人”保留希伯来语分词的具体表达；用破折号保留本节作为自证清白誓言中未完条件句的结构。脚注标记依其所注词语就近排列。
