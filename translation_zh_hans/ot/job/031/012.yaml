  text: כִּ֤י אֵ֣שׁ הִ֭יא עַד אֲבַדּ֣וֹן תֹּאכֵ֑ל וּֽ/בְ/כָל תְּב֖וּאָתִ֣/י תְשָׁרֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: zh_hans
  text: 因为这是一团吞噬至毁灭的火；它会连根拔除我一切的出产。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为约伯所说的严重后果提供理由，保留解释性连接。
- source_word: אֵשׁ הִיא
  choice: 这是……火
  rationale: 保留原文鲜明的火焰比喻；中文用“这是”自然表达希伯来语系词句。
- source_word: עַד אֲבַדּוֹן
  choice: 直烧到毁灭之地
  rationale: עַד 表示火吞噬所达到的程度或范围；אֲבַדּוֹן 既可指毁灭，也可指毁灭之境，此处用“毁灭之地”保留空间意象及其语义张力。
- source_word: תֹּאכֵל
  choice: 吞噬
  rationale: 该动词本义为吃，在火的语境中译作“吞噬”既自然又保留强烈的毁灭意象。
- source_word: וּבְכָל תְּבוּאָתִי
  choice: 也会把我一切的出产
  rationale: תְּבוּאָה 可指土地或劳作所得的产物；“出产”比“庄稼”范围更广，并保留农业语境。前缀 ב 在此不宜机械直译。
- source_word: תְשָׁרֵשׁ
  choice: 连根拔除
  rationale: Piel 形式表达除根、拔除；“连根拔除”保留农业比喻，并凸显彻底毁坏。
theological_decisions:
- issue: אֲבַדּוֹן 的含义
  choice: 正文译作“毁灭之地”
  alternative: “灭亡”；或音译专名“亚巴顿”
  rationale: 在本节智慧文学语境中，该词主要描写毁灭的终局或领域，不必将其明确人格化；译作“毁灭之地”同时保留其可能指毁灭领域的含义，脚注列出其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“直烧到”补足火的意象，使 עַד 所表达的范围自然呈现；“连根拔除”与“出产”共同维持原文的农业图像。
