base_translation:
  language: en
  yaml_path: translation/ot/job/031/014.yaml
  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: zh_hans
  text: 当神兴起时，我能怎么办呢？他察问[a]时，我又能怎样回答他呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“察看”“查验”或“追究”。希伯来语这个动词也可表示“临到”；本节语境偏重审查和问责。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה אֶעֱשֶׂה
  choice: 我该怎么办呢
  rationale: 连接词与疑问结构引出约伯的反问；“该怎么办”自然表达未完成式在设想情境中的语气，同时保留无力应对的意味。
- source_word: כִּי יָקוּם אֵל
  choice: 神若起来
  rationale: קום本义为“起来、站起”；这里保留神起来采取行动的意象，不直接增译为“施行审判”。כִּי在设想性的反问中译为“若”，可保留条件与时间之间的语义张力。
- source_word: וְכִי יִפְקֹד
  choice: 他若察问
  rationale: פקד可指察看、查验、追究或临到。“察问”既能与下文“回答”自然衔接，呈现审查问责的语境，又不把宽广词义完全限定为正式审判。
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: 我该怎样回答他呢
  rationale: 使役式שוב在此为“回答、回复”，三单阳性后缀指神；“怎样回答他”符合现代汉语，也保留修辞问句。
theological_decisions:
- issue: 神圣审判的意象
  choice: 以“起来”和“察问”呈现神采取行动、审查人的司法性意象，但不限定为末日审判。
  alternative: 译作“临到”或明确译成“追究我的罪、审判我”。
  rationale: 上下句“起来—察问—回答”共同暗示神的审查与问责，但原文没有明说末日审判；译文应保留司法意味及其未完全明说的张力。
- issue: כִּי的时间或条件关系
  choice: 译为“若”，呈现约伯设想神起来察问时的反问。
  alternative: 译为“当……的时候”，将情境表达为较确定的将来事件。
  rationale: כִּי可承担时间或条件功能；此处汉语“若”贴合反问语势，又不否定约伯所意识到的真实问责。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两次“若”与两次“我该……”保持原文平行反问；“神若起来”刻意保留希伯来语意象。“察问”较“追究”含义稍宽，并以脚注交代原词的语义范围。
