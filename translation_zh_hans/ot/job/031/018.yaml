  yaml_path: translation/ot/job/031/018.yaml
  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
translation:
  language: zh_hans
  text: 因为从我幼年起，他就在我身边长大，如同在父亲身边一样[a]；从我母腹起，我就引导她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文艰深，句法有争议。也可译为：“从我幼年起，他把我养大，如同父亲”，或“我从幼年起像父亲一样养育他”。按本文译法及后一种理解，“他”很可能指前节所说的孤儿。
    reason: alternative_reading
  - marker: b
    text: “她”很可能指上一节所说的寡妇。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上节约伯对自己可能亏负孤儿寡妇之事的否认，并说明其缘由；译作“因为”保留论证关系。
- source_word: מִנְּעוּרַי
  choice: 从我幼年起
  rationale: 表达自年幼时期开始的持续时间，现代汉语自然且保留介词的起点含义。
- source_word: גְּדֵלַנִי
  choice: 他就把我养大
  rationale: 按马所拉文本保留第三人称阳性单数主语和第一人称单数宾语的表层语法。原文措辞艰深，未在正文中擅自改成“我养育他”，另以脚注交代可能理解。
- source_word: כְאָב
  choice: 如同父亲
  rationale: 保留כְ的比较含义，也保留“父亲”究竟说明谁的角色这一难点。
- source_word: וּמִבֶּטֶן אִמִּי
  choice: 我从母腹以来
  rationale: 这是表示人生最早阶段的时间习语；汉语略作顺序调整，使后接谓语自然。
- source_word: אַנְחֶנָּה
  choice: 就引导她
  rationale: 按נחה的使役形第一人称单数及第三人称阴性单数后缀直译；“她”最可能回指上节的寡妇，但正文不明说所指。
theological_decisions:
- issue: 本节两分句中的所指转换
  choice: 第一分句保留阳性第三人称“他”和第一人称受事“我”，第二分句保留阴性“她”。
  alternative: 将第一分句意译为“我从幼年就像父亲一样养育孤儿”，并明确第二分句的“她”是寡妇。
  rationale: 希伯来文本在第一分句与第二分句之间有明显的性别和人称张力。正文保留这些语法信号，以免借翻译消除原文的疑难；脚注说明上下文所支持的其他理解。
- issue: “如同父亲”的角色归属
  choice: 保持修饰关系开放，仅译作“如同父亲”。
  alternative: 明确译作“他把我当作父亲而长大”或“我像父亲一样养育他”。
  rationale: 原文极为凝缩，比较短语可因对前一动词的不同分析而产生不同理解；不在正文中强行确定角色归属。
translation_notes:
  register: 采用庄重而现代的叙述语体。“从母腹以来”保留圣经诗歌的凝练表达；正文特意保留原文不寻常的“他把我养大”及人称转换，并借脚注帮助普通读者理解其文本难点。
