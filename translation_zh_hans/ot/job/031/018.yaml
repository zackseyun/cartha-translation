- from: 因为从我幼年起，他就把我养大，如同父亲[a]；我从母腹以来就引导她[b]。
  to: 因为从我幼年起，他就在我身边长大，如同在父亲身边一样[a]；从我母腹起，我就引导她[b]。
  rationale: 修订首分句以反映困难希伯来句在直接上下文中较可取的理解：孤儿与约伯自其幼年起相伴成长，并仿佛有父亲照料。脚注保留马所拉文本可引出的其他分析，尤其是现有英文审计轨迹所采用的“他把我养大”，因此不掩盖文本歧义。次分句仅作自然语序调整，保留其异常的“从我母腹起”及阴性“她”。
