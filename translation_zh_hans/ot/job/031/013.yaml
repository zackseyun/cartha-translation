  yaml_path: translation/ot/job/031/013.yaml
  text: If I have rejected the case of my male slave or my female slave when they brought a complaint against me[b][a],
translation:
  language: zh_hans
  text: 我的男奴或女奴[b]与我争讼时，若我拒绝他们的申诉[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “申诉”也可译作“案件”“公正”或“法律权利”。希伯来语 מִשְׁפָּט 可指公正、法律权利或案件。
    reason: lexical_alternative
  - marker: b
    text: “男奴或女奴”也可按较传统的说法译作“男仆或婢女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出约伯自陈清白之誓中的条件从句；“若”简洁庄重，也适合本句未完、下节承接的结构。
- source_word: אֶמְאַס
  choice: 拒绝受理
  rationale: מָאַס可指拒绝、厌弃。在诉讼语境中，“拒绝受理”自然表达不肯正视或处理其申诉，同时不把它弱化为单纯的内心轻视。
- source_word: מִשְׁפַּט
  choice: 案件
  rationale: מִשְׁפָּט在此可涉及案件、公断或法律权利。“案件”贴合后文争讼语境；脚注保留其语义宽度。
- source_word: עַבְדִּי וַאֲמָתִי
  choice: 我的男奴或女奴
  rationale: עֶבֶד与אָמָה分别指男性与女性奴仆。“男奴或女奴”明确呈现身份和性别对应；汉语在假设条件中用“或”自然表达两类人中的任何一方。
- source_word: בְּרִיבָם
  choice: 与我争讼时
  rationale: רִיב具有争执、诉讼、申诉等法律色彩。“争讼”保留正式的司法语境，又不预先断定争议采取何种程序。
- source_word: עִמָּדִי
  choice: 与我
  rationale: 字面为“同我、与我”；与争讼用语结合时表示以约伯为争议对方。“与我争讼”是自然且忠实的汉语表达。
theological_decisions:
- issue: 奴仆是否拥有可向主人提出的案件或权利
  choice: 保留他们能与约伯争讼、其案件应受理的表述
  alternative: 将本句泛化为约伯善待仆人
  rationale: 原文明确采用司法语言，显示奴仆的申诉具有应当被正视的分量；译文不将这种伦理和法律张力淡化为一般性的仁慈。
translation_notes:
  register: 采用现代、庄重而清楚的法律语体。“拒绝受理”“案件”“争讼”共同传达原文的司法色彩。句末保留逗号，因为本节是条件从句，语意在下一节继续。
