  yaml_path: translation/ot/job/031/009.yaml
  text: If my heart has been enticed by a woman[a], and I have lain in wait at my neighbor's door[b],
translation:
  language: zh_hans
  text: 我的心若因妇人而受诱惑[a]，我若在我邻舍[b]的门口窥伺，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心若因妇人而受迷惑”或“受引诱”。原文动词可表示受诱惑、受迷惑或被说服；这里的语境涉及性方面的诱惑。
    reason: lexical_alternative
  - marker: b
    text: “邻舍”或译“朋友”或“同伴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְתָּה
  choice: 受了……的诱惑
  rationale: 该词是 פתה 的尼法勒式，可表示受引诱、受迷惑或被说服；在性诱惑的语境中，“受了……的诱惑”自然地表达内心受到引诱，又不过度强调妇人的主动性。
- source_word: לִבִּי
  choice: 我的心
  rationale: 保留希伯来语“心”的意象；这里指人的内在欲望、意念和意志。
- source_word: עַל אִשָּׁה
  choice: 妇人的
  rationale: 介词 עַל 字面可表示“在……之上、对于、因着”；与 נִפְתָּה 连用时，这里指诱惑所关涉的对象或缘由。译作“受了妇人的诱惑”符合现代汉语，同时保留性诱惑的语境。
- source_word: פֶּתַח
  choice: 门口
  rationale: פֶּתַח 可指门、入口或门道；汉语“门口”最自然地表达在别人住所入口附近暗中等候。
- source_word: רֵעִי
  choice: 邻舍
  rationale: רֵעַ 可指邻舍、朋友或同伴；这里采用“邻舍”以体现社会伦理关系，同时用脚注保留其他可能。
- source_word: אָרָבְתִּי
  choice: 埋伏等候
  rationale: 该动词表示暗中潜伏、伺机而动，常带敌对或不正当意图。“埋伏等候”保留其隐秘和蓄意的意味，又适合此处奸淫图谋的语境。
theological_decisions:
- issue: 约伯关于奸淫之起誓的道德层次
  choice: 保留从内心受诱惑到在邻舍门口暗中伺机的推进。
  alternative: 淡化为一般的爱慕，或明确增译为企图奸淫。
  rationale: 原文同时陈述内在欲念与外在的隐秘行动，但没有明说行动最终是否发生；译文应保留其严肃性和张力，不增添原文未明说的细节。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“若……我若……”保留誓言式条件结构；句末逗号表明本节条件句在下一节继续。
