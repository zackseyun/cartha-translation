  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: zh_hans
  text: 这也算是应受审判的罪孽[a]，因为我否认了在上的上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“应由审判者惩处的罪”“司法上的罪行”，或“应交付审判的罪孽”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为我对在上的上帝不忠。”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: 这也算是
  rationale: 承接上一节所说的行为，并把它列入约伯所否认犯过的罪；“这也算是”符合本段假设性陈述的汉语表达。
- source_word: עָוֺן
  choice: 罪孽
  rationale: 兼顾该词的道德罪责和本句的司法色彩，语体庄重而易懂。
- source_word: פְּלִילִי
  choice: 应受审判的
  rationale: 该词涉及司法裁断，可能指应由审判者惩处或应交付审判；正文采用自然且不过度限定主体的表达，并以脚注保留其他理解。
- source_word: כִּי
  choice: 因为
  rationale: 引出上述行为构成罪孽的理由。
- source_word: כִחַשְׁתִּי
  choice: 我就是背弃了
  rationale: 在敬拜受造之物的语境中，该动词不只是说谎，也含否认、辜负或不忠于上帝之意；“背弃”自然地表达这种关系性的失信。
- source_word: לָאֵל מִמָּעַל
  choice: 在上的上帝
  rationale: 贴近“上方／高处的上帝”的简洁原文，并保留其与上下文天体崇拜之间的垂直对照，不擅自增添“天上”等字样。
theological_decisions:
- issue: מִמָּעַל是否应扩译为“天上的上帝”或神学称号“至高者”
  choice: 在上的上帝
  alternative: 天上的上帝；至高的上帝
  rationale: 原文只说“在上／从上方”，并未明确使用“天”或“至高者”这一称号；正文保持原文的简练和空间意象。
- issue: כִחַשְׁתִּי在本句中应侧重“否认”还是“不忠”
  choice: 背弃了
  alternative: 否认了；对……不忠
  rationale: 上下文涉及转向日月而离弃上帝，“背弃”同时容纳否认和失信的意味；脚注保留“不忠”的译法，避免把语义收窄。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“应受审判的罪孽”保留法律语境；“背弃”比单纯“否认”更能涵盖原词在偶像崇拜语境中的关系性失信，同时不引入宗派性解释。
