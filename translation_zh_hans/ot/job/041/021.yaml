  yaml_path: translation/ot/job/041/021.yaml
  text: A club is regarded as straw[b][a], and he laughs at the rattling of the javelin.
translation:
  language: zh_hans
  text: 棍棒[a]在它看来如同禾秸[b]；它嗤笑标枪的响声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“投枪”或“投射武器”。希伯来语 תוֹתָח 很少见，确切含义不能确定。
    reason: lexical_alternative
  - marker: b
    text: 或译：“禾茬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקַשׁ
  choice: 如同禾秸
  rationale: קַשׁ指脱粒后留下的禾秸、碎秆；“禾秸”保留了轻而无害的比喻，也比单说“草”更准确。
- source_word: נֶחְשְׁבוּ
  choice: 在它看来如同
  rationale: 这是חשב的被动形式，意为“被看作、被算为”。汉语用“在它看来”自然表达利维坦视武器为无物的意思，同时保留判断关系。
- source_word: תוֹתָח
  choice: 棍棒
  rationale: 此词罕见，确切所指不明；上下文显然是某种武器。“棍棒”符合与כִּידוֹן并列的武器语境，但用脚注保留“投射武器”等可能。
- source_word: וְיִשְׂחַק
  choice: 它嗤笑
  rationale: שׂחק本义为“笑”，在面对武器威胁的语境中，“嗤笑”自然传达轻蔑意味。主语是上下文中的利维坦，汉语用“它”。
- source_word: לְרַעַשׁ
  choice: 标枪的响声
  rationale: רַעַשׁ可指声响、震动或震响；“响声”不强行限定声音来自摇动、撞击还是飞行，保留原文的语义宽度。
- source_word: כִּידוֹן
  choice: 标枪
  rationale: כִּידוֹן指枪矛类武器，常可理解为投掷用的枪；“标枪”既自然，又能与一般长矛有所区别。
