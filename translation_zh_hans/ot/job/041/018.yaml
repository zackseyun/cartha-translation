  yaml_path: translation/ot/job/041/018.yaml
  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: zh_hans
  text: 刀剑即使触及它，也不能立得住[a]；长矛、投枪[b]和标枪也一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“追上它的刀剑也不能得胜。”原文直译为刀剑“不能立住”。
    reason: lexical_alternative
  - marker: b
    text: 译作“投枪”和“标枪”的两个希伯来词都很罕见，含义不确定；前者也可能指“投射物”或“杆状兵器”，后者也可能指“锁子甲”或“铠甲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: 即使触及它
  rationale: 该词来自动词 השׂיג，意为“达到、追上、触及”。这里以刀剑为主语；“触及”保留武器来到它身上的含义，又不擅自解释为已经刺伤。加入“即使”使汉语条件意味自然明晰。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: חֶרֶב泛指有刃的近战兵器；“刀剑”是现代汉语中自然且具有概括性的对应表达。
- source_word: בְּלִי תָקוּם
  choice: 不能立得住
  rationale: 原文直译为“不能站立／立住”，语境表示武器对它不能奏效。“不能立得住”保留原文具体意象，含义则由脚注说明。
- source_word: חֲנִית
  choice: 长矛
  rationale: 常用词，指刺击用的矛；“长矛”通俗、准确。
- source_word: מַסָּע
  choice: 投枪
  rationale: 这是罕见且含义不确定的兵器名称，可能指投射物或杆状武器。“投枪”符合本节列举攻击性武器的语境，但脚注明示其不确定性。
- source_word: וְשִׁרְיָה
  choice: 和标枪
  rationale: 该罕见词在此可理解为尖头投掷武器。“标枪”与上下文的兵器清单相合；“铠甲”等传统解释仍有词汇上的可能，故收入脚注。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“也一样”承接前句谓语，避免机械重复，同时表明后列三种器械同样不能奏效。保留“不能立得住”这一希伯来语意象，并以脚注交代其语用含义及其他译法。
