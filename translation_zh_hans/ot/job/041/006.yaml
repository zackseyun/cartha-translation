  text: Who has opened the doors of his face? Around his teeth is terror[a][b].
translation:
  language: zh_hans
  text: 谁曾打开它面部的门[a]？它牙齿四周满是恐怖[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁能打开它的口？”希伯来文直译是“它面部的门”，这是指口或上下颚的诗意说法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“它牙齿四周满是可畏之象。”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתֵי
  choice: 门
  rationale: 保留希伯来文“门”的复数构造意象；这里诗意地指这生物口部或双颚可开合的部分，不在正文中直接释作“颚”。汉语“门”本身可作集合性称呼，无须生硬地加“几扇”。
- source_word: פָנָיו
  choice: 它脸上
  rationale: 按通常词义保留“脸、面部”，并以“脸上的门”再现原文大胆的诗歌隐喻；具体所指的口或双颚列入脚注。
- source_word: מִי
  choice: 谁
  rationale: 直译疑问代词，并保留修辞问句的语气。
- source_word: פִתֵּחַ
  choice: 曾打开
  rationale: 该完成式直接陈述“打开”这一动作；“谁曾……”在现代汉语中自然地表达修辞性的完成语气，而不把正文解释性地改成“谁能……”。
- source_word: סְבִיבוֹת
  choice: 四周
  rationale: 准确表达环绕、周围的空间关系，并与“牙齿”自然搭配。
- source_word: שִׁנָּיו
  choice: 它牙齿
  rationale: 采用基本词义“牙齿”，不强化为原文未明确表达的“獠牙”。
- source_word: אֵימָה
  choice: 恐怖
  rationale: 保留该名词所表达的强烈恐惧和威吓感；用“恐怖环绕”将希伯来文简洁的名词句转成自然而仍具诗意的汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可理解的诗体汉语。正文保留“脸上的门”这一原文意象，并以“谁曾”维持完成式修辞问句；后半句用轻度补足的“环绕”呈现希伯来文名词句，避免汉语生硬。
