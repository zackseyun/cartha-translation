  text: אֵֽת כָּל גָּבֹ֥הַּ יִרְאֶ֑ה ה֝֗וּא מֶ֣לֶךְ עַל כָּל בְּנֵי שָֽׁחַץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/041/026.yaml
  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: zh_hans
  text: 它看见一切高的[a]；它是所有骄傲之子的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高的”也可理解为“高傲者”。“骄傲之子”按字面译；这是一种希伯来语表达，可指所有高傲者。
    reason: 保留גָּבֹהַּ“高”的字面意象及其可能的比喻义，并说明בְּנֵי שָׁחַץ的字面形式和自然含义，避免将其所指限定为某一类生物或存在者。
lexical_decisions:
- source_word: אֵת כָּל גָּבֹהַּ
  choice: 凡高傲的
  rationale: אֵת是直接宾语标记，不另译；כָּל与单数形容词גָּבֹהַּ组合，泛指一切高高在上或高傲者。中文以“凡高傲的”自然保留其概括性及“高”向“骄傲”延伸的双重意味。
- source_word: יִרְאֶה
  choice: 俯视
  rationale: ראה基本义为“看、看见”。此处主语凌驾于一切高傲者之上，“俯视”既符合中文诗性表达，也传达其无所畏惧、居高临下的意味。
- source_word: הוּא
  choice: 它
  rationale: 独立代词带有强调作用。上下文所指为利维坦一类的非人受造物，现代汉语用“它”自然；分句起首也保留一定强调。
- source_word: מֶלֶךְ עַל
  choice: 是……的王
  rationale: מֶלֶךְ意为“王”，עַל在此表达凌驾、统辖关系。保留“王”的君王比喻，不弱化为一般的“统领”。
- source_word: כָּל בְּנֵי שָׁחַץ
  choice: 所有骄傲之子
  rationale: בְּנֵי שָׁחַץ字面为“骄傲之子”，是表示具有某种特征的一类对象的希伯来语表达。正文保留诗性意象，并用脚注说明其泛指含义。
theological_decisions:
- issue: “所有骄傲之子”所指的范围
  choice: 保留为可泛指一切高傲受造物或存在者的诗性称呼
  alternative: 明确解释为猛兽，或解释为具有骄傲特征的宇宙势力
  rationale: 原文没有限定具体类别；直译其比喻可保留动物性、道德性和神话诗性之间的张力，避免加入某一特定解释。
- issue: גָּבֹהַּ的具体或比喻意义
  choice: 译为“高傲的”
  alternative: 译为“高大的”或“高高在上的”
  rationale: 该词本义与“高”有关，也可指高傲；与下句שָׁחַץ“骄傲”平行时，道德或姿态上的“高傲”更突出，但仍不限定对象类别。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。以“俯视”呈现上下两行中凌驾与为王的平行关系；保留“骄傲之子”的源语意象，并以脚注帮助普通读者理解。
