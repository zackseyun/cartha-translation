  text: His breath kindles coals[a], and a flame comes out from his mouth.
translation:
  language: zh_hans
  text: 它的气息使炭火燃烧[a]；火焰从它口中冒出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“它的魂使炭火燃烧”，或“它的生命使炭火燃烧”，或“它的喉咙使炭火燃烧”。希伯来语名词 נֶפֶשׁ 可指“魂”“生命”或“喉咙”；在本处语境中，也可引申为“气息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: 它的气息
  rationale: נֶפֶשׁ可指生命、魂、喉咙，并可依语境引申为气息。这里与“从它口中”平行，又描写喷火，译作“气息”最自然；其真实的词义歧义保留在脚注中。
- source_word: גֶּחָלִים
  choice: 炭火
  rationale: 该词指煤炭或余烬。“炭火”在现代汉语中简洁自然，也适合被点燃、烧旺的意象。
- source_word: תְּלַהֵט
  choice: 点燃
  rationale: להט的Piel形式表达使之燃烧或炽烈的使役意义；“点燃”清楚保留这一作用。
- source_word: וְלַהַב
  choice: 火焰
  rationale: לַהַב是单数名词，意为火焰或烈焰；汉语用“火焰”自然地保留单一意象。
- source_word: מִפִּיו
  choice: 从它口中
  rationale: 直接表达介词מִן与“口”的第三人称阳性单数后缀，并与上半句形成诗歌平行。
- source_word: יֵצֵא
  choice: 喷出
  rationale: יָצָא基本义为出去、出来；在火焰从口中而出的形象里，“喷出”是自然有力的语境化表达，同时没有增添原文之外的主体或结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“它”指本段所描写的受造物，避免中文“他”暗示人物身份；“喷出”使火焰由口而出的动态图景自然清楚。脚注保留 נֶפֶשׁ 的多义性，正文则按诗句平行和喷火语境译为“气息”。
