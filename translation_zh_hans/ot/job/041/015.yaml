translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留希伯来诗句中“紧贴—浇铸—不动摇”逐层加强的身体与坚固意象。分号呈现两个紧密相关的诗行分句；不对所描写受造物的身份作额外解释。
