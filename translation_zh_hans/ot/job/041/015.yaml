  text: The folds of his flesh cling together[a]; they are cast firm upon him and cannot be moved.
translation:
  language: zh_hans
  text: 它肉上的褶皱彼此紧贴，像浇铸在它身上一样牢固，绝不动摇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“牢牢固定在它身上。”希伯来文采用浇注或浇铸后凝固定型的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  choice: 褶皱
  rationale: 该词指下垂或折叠的部分；在身体语境中译作“褶皱”具体、自然，也避免较含混的“部分”或不合语境的“薄片”。
- source_word: בְשָׂרוֹ
  choice: 它肉上的
  rationale: בשר的基本义是“肉、肉体”。“它肉上的”保留原文的身体意象，又比“它的肉体的”更符合现代汉语表达。
- source_word: דָבֵקוּ
  choice: 彼此紧贴
  rationale: דבק表示紧密黏附。复数主语“褶皱”在此强调各部分贴合在一起，故译为“彼此紧贴”。
- source_word: יָצוּק
  choice: 牢牢浇铸
  rationale: 该词可指倾倒、浇铸，也可由此引申为牢固安置。译文保留浇铸后凝固定型的具体比喻，同时用“牢牢”传达稳固之意。
- source_word: עָלָיו
  choice: 在它身上
  rationale: 直译介词及第三人称阳性单数后缀；中文以“它”指前文所述的受造物。
- source_word: בַּל
  choice: 绝不
  rationale: 这是诗体否定词；“绝不”在庄重诗体中自然，并清楚表达强烈否定，但不额外加入时间含义。
- source_word: יִמּוֹט
  choice: 动摇
  rationale: מוט的尼法勒式可表示被移动、摇晃或失去稳固。“动摇”既保留稳固与摇动的对照，也适合诗歌语体。
