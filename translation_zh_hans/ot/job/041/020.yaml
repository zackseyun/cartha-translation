  yaml_path: translation/ot/job/041/020.yaml
  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
translation:
  language: zh_hans
  text: 弓箭手[a]不能使它逃跑；投石索的石头对它如同碎秸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“弓之子”，是指弓箭手或持弓者的习语。
    reason: 保留原文习语的字面形式，并说明其在本处的通常含义。
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: 不能使它逃跑
  rationale: 这是 ברח 的使役式，带第三人称阳性单数宾语，表示“使它逃跑”或“把它赶走”；此译保留使役含义。
- source_word: בֶן קָשֶׁת
  choice: 箭
  rationale: 字面为“弓之子”。在连续列举攻击利维坦的武器这一语境中，最自然地指弓所射出的箭，并与下句的机弦石平行；“弓箭手”也是对该希伯来表达的一种理解，故在脚注中保留。
- source_word: לְקַשׁ
  choice: 如同碎秸
  rationale: קַשׁ 指干燥、轻脆的秸秆或碎秸；这里比喻机弦石对它毫无分量和威力。
- source_word: נֶהְפְּכוּ לוֹ
  choice: 在它看来如同
  rationale: הפך 的尼法勒式表示“变成”；与 לוֹ 连用时，此处自然表达“对它而言成了……”，中文译作“在它看来如同”，保留关系性而不暗示实际物质变化。
- source_word: אַבְנֵי קָלַע
  choice: 机弦石
  rationale: 该组合词指用投石机弦甩出的石头；“机弦石”简洁保留古代武器意象。
theological_decisions: []
