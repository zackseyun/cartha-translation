base_translation:
  language: en
  yaml_path: translation/ot/job/041/001.yaml
  text: Behold[a], his hope proves false[b]; is one not cast down even at the sight of him?
translation:
  language: zh_hans
  text: 看哪，人所抱的指望必然落空[a]；人岂不一见它的形貌就被击倒吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这指望被证明是虚妄的”，或“所期待的必令人失望”。原文动词可强调指望最终显得虚假、靠不住或落空。
    reason: lexical_alternative
  - marker: b
    text: 或译：“人岂不单看见它就被压服吗？”“被击倒”也可理解为“被抛下”或“被压倒”；原文没有明说原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的词；“看哪”保留诗体中庄重、醒目的表达。
- source_word: תֹּחַלְתּוֹ
  choice: 所存的指望
  rationale: 原词意为“指望、期待”。这样译既自然，也避免在中文中强行明确代词“他的”究竟指谁；上下文表明是面对那巨兽时所抱的指望。
- source_word: נִכְזָבָה
  choice: 终必落空
  rationale: 该动词表达被证明虚假、靠不住或使人失望的结果。“落空”在现代汉语中自然地传达指望未能实现，同时保留结果意味。
- source_word: הֲגַם
  choice: 岂不……就
  rationale: 疑问词与加强语气的附加词共同构成强烈反问；“岂不……就”兼顾反问和“一见便如此”的强化意味。
- source_word: אֶל מַרְאָיו
  choice: 一见它
  rationale: 字面涉及“对着／在它的形貌面前”。“一见它”简洁自然，表达仅仅看到其形貌便产生反应。
- source_word: יֻטָל
  choice: 倒下
  rationale: 这是被动使役形，基本意象是被抛下、被击倒或倒伏。“倒下”保留具体动作，也容许因恐惧而瘫倒或被压服等语义空间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“所存的指望”避免因汉语代词而过度确定原文后缀的所指；“它”则自然指向上下文中的巨兽。反问句保留原文的强烈语气，并未将“倒下”仅限定为心理上的恐惧。
