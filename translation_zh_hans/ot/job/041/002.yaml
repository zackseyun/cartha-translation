  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: zh_hans
  text: 没有人凶猛到敢去唤醒它[a]。那么，谁能在我面前站立得住呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有人残暴到会去惊动它。”希伯来语动词本义为“唤醒、唤起”，这里指惊动或招惹利维坦。
    reason: 该动词可按字面译为“唤醒”，也可按利维坦的语境译为“惊动／招惹”；“残暴”是אַכְזָר的另一种可能译法。
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: 没有人凶猛到
  rationale: 将否定词与形容词合译为自然的汉语结果结构；אַכְזָר在利维坦语境中侧重凶猛、强悍，而非道德意义较强的“残忍”。
- source_word: כִּי יְעוּרֶנּוּ
  choice: 敢把它唤醒
  rationale: עור本义为“唤醒、激起”；这里指惊动或招惹利维坦。“敢”虽为语境补足，却准确传达反问所强调的胆量，并保留“唤醒”的原文意象。
- source_word: וּמִי הוּא
  choice: 那么，谁
  rationale: וּ在此推动由受造物转向说话者的推论；“那么”自然表达举重明轻的逻辑。汉语无需机械译出强调代词הוּא。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 贴近字面“在我面前／我面前”，既可表示来到神面前，也可含面对、抗衡之意，不将含义限定得过窄。
- source_word: יִתְיַצָּב
  choice: 站立得住
  rationale: 该词表示站定、立住；在反问中“站立得住”自然传达能够面对或抵挡说话者的含义。
theological_decisions:
- issue: 前半句论利维坦，后半句是否转指神
  choice: 后半句中的“我”指正在发言的神，形成从利维坦到造物主的递进反问。
  alternative: 两句都只指利维坦。
  rationale: לְפָנַי带第一人称单数后缀，明确是“在我面前”；结合神在上下文中的直接发言，最自然的理解是：人若不敢惊动利维坦，更不能在神面前站立得住。译文保留这一转折而不额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“它”用于利维坦，避免无依据地人格化；“站立得住”保留圣经语体的力度，同时符合现代汉语。
