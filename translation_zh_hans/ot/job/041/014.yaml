  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: zh_hans
  text: 力量栖居在它的颈项中[a]；惊惶在它前面跳跃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恐怖在它前面跳跃。”希伯来语名词 דְּאָבָה 很少见；在这里的诗歌语境中，其含义可能从惊惶、沮丧到恐怖不等。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: 它的颈项中
  rationale: בְּ 加“颈项”及第三人称阳性单数后缀，最自然地表达位置；“颈项中”保留力量居于其中的诗性意象。
- source_word: יָלִין
  choice: 栖居
  rationale: 该动词本义为住宿、过夜，此处拟人化地表示力量安稳长驻；“栖居”既保留生动意象，也符合庄重诗体。
- source_word: עֹז
  choice: 力量
  rationale: 直接对应强健、能力或威力；“力量”在现代汉语中自然，并适合身体意象。
- source_word: וּלְפָנָיו
  choice: 在它前面
  rationale: פָנִים 构成的习语表示在某者面前或前方；此译清楚保留空间关系。
- source_word: תָּדוּץ
  choice: 跳跃
  rationale: 罕见动词 דוץ 表示跃动、跳起，也可能有欢跃之意；“跳跃”保留诗中的拟人化动作而不赋予正面情绪。
- source_word: דְּאָבָה
  choice: 惊惶
  rationale: 这是罕见名词，语义可能涵盖沮丧、惊惧或恐怖；“惊惶”在本段威慑性的语境中自然，同时不过度限定为极端恐怖。
