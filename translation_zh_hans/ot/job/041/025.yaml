  yaml_path: translation/ot/job/041/025.yaml
  text: On earth there is none like him[b][a], one made without fear.
translation:
  language: zh_hans
  text: 地上没有能与它相比的[a]；它被造成无所畏惧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地上没有谁能与它匹敌。”这里的希伯来词既可表示相像，也可表示相等、匹敌。
    reason: lexical_alternative
  - marker: b
    text: 或译：“它被造为不知恐惧”，即它受造时就是不受惊吓的。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: 没有什么
  rationale: 这是存在否定词；与后面的比较语连用，译为“没有什么”自然地表达绝对否定。
- source_word: עַל עָפָר
  choice: 地上
  rationale: 字面可指“尘土之上”；在此泛指地上的领域，现代汉语以“地上”最自然。
- source_word: מָשְׁלוֹ
  choice: 能与它相比
  rationale: 此处表示可与之相比或匹敌者；这样翻译保留“相似”与“相等、匹敌”之间的语义幅度。
- source_word: הֶעָשׂוּ
  choice: 生来
  rationale: 该形式源自动词“造、做”，在句中描述这受造物被造成的状态；“生来”在汉语中自然表达其受造即如此，同时不必补明施事者。
- source_word: לִבְלִי
  choice: 无所
  rationale: 该结构表示缺少或没有；与“畏惧”搭配为“无所畏惧”，简洁而自然。
- source_word: חָת
  choice: 畏惧
  rationale: 该词表示恐惧、惊骇；“畏惧”既庄重又能表达不受恐吓的意思。
theological_decisions:
- issue: הֶעָשׂוּ 的受造含义与汉语表达
  choice: 生来无所畏惧
  alternative: 被造成无所畏惧
  rationale: 原文指它被造为不知恐惧的存在。“生来”使现代汉语流畅，也保留这种固有状态；脚注列出更贴近形式的译法，避免把受造含义完全隐去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“它”指上下文中的受造物；分号清楚呈现两个紧密相关的分句。“无所畏惧”是自然成语，脚注补足原文“被造”的形式信息。
