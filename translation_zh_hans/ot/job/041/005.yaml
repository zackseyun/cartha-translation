  language: zh_hans
  text: 谁能揭开它覆盖物的表面？谁能进入它笼头的双层之中？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁能进入它笼头的折叠处？”希伯来语这一表达难以确定；它可能比喻利维坦的口、双颚或两排牙齿。
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: 揭开
  rationale: 该动词意为揭露、显露或除去遮盖；“揭开”在中文中自然保留了使外层暴露的动作，又不过度断定是剥皮或强行脱除。
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: 它外衣的正面
  rationale: פְּנֵי 是“面、表面、正面”，לְבוּשׁוֹ 是“它的衣服”；此译保留衣服的具体比喻，不擅自解释为皮或鳞甲。
- source_word: בְּכֶפֶל
  choice: 进入……双重的……之内
  rationale: כֶּפֶל 可指双重、折叠之处；“双重的”保留原文难解的意象，并避免直接确定为双颚或两排牙齿。
- source_word: רִסְנוֹ
  choice: 它……的笼头
  rationale: רֶסֶן 通常指笼头、辔头或口套；“笼头”是直接且具体的对应词，在此作为利维坦口部区域的诗性比喻。
- source_word: מִי יָבוֹא
  choice: 谁能进入
  rationale: 疑问词加未完成式在语境中构成挑战，暗含无人有能力做到；“谁能”自然表达这种反问语气。
