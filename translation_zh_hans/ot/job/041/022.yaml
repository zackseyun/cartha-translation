  text: Under him are sharp shards of pottery[b][a]; he spreads himself like a threshing sledge over the mud.
translation:
  language: zh_hans
  text: 它身下有尖利的陶片[a]；它在泥上铺展开来，仿佛碾谷橇一般。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陶片”也可译作“碎陶片”。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“它使泥地如同碾谷橇。”原文的句法和比喻关系并不完全确定。
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחְתָּיו
  choice: 它腹下
  rationale: 原文直译为“它下面”；结合利维坦的身体意象，用“它腹下”在现代汉语中更具体自然，同时保留空间关系。
- source_word: חַדּוּדֵי חָרֶשׂ
  choice: 尖利的陶片
  rationale: חַדּוּדֵי 表示尖锐之物，חָרֶשׂ 指陶器或陶片；合译为“尖利的陶片”，既清楚又保留其锯齿般的触感。
- source_word: יִרְפַּד
  choice: 铺压过去
  rationale: 该动词有铺设、铺成床层之意；这里描写利维坦身体在泥上的作用。“铺压过去”以自然汉语传达其贴身铺展并留下尖锐压痕的动态，但不把语法关系解释得过死。
- source_word: חָרוּץ
  choice: 碾谷橇
  rationale: 此词在本语境中指带有尖齿的打谷农具；“碾谷橇”比“耙”更准确地呈现古代碾压脱粒的器具。
- source_word: עֲלֵי טִיט
  choice: 在泥上
  rationale: עֲלֵי 表示在……之上，טִיט 指泥、泥泞；“在泥上”简洁自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“它”与动物所指相符；以“仿佛……一般”明示原文可能隐含的比较，同时用脚注保留另一种句法理解。
