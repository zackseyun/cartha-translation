  text: מִ֭/שֵּׂת/וֹ יָג֣וּרוּ אֵלִ֑ים מִ֝/שְּׁבָרִ֗ים יִתְחַטָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/017.yaml
  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: zh_hans
  text: 它一昂起身，强者都惧怕；在破裂的轰响中，他们惊慌失措。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强者”原文也可译作“神明”；“惊慌失措”所对应的原文词义不确定，也有人理解为“洁净自己”或“退避”。
    reason: 保存 אֵלִים 与罕见形式 יִתְחַטָּאוּ 的真实词义歧义。
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: 它一起来
  rationale: 按名词 שֵׂת 在此处通常所指的“起来、昂起”理解，并保留介词所表达的触发关系；主语承接上文所描述的巨兽。
- source_word: אֵלִים
  choice: 勇士
  rationale: 该词字面可指“神明”，也可指“强者、有权能者”；在畏惧巨兽的语境中，“勇士”自然表达强者之意，同时避免把经文限定为诸神惧怕。
- source_word: מִשְּׁבָרִים
  choice: 因那破碎之声
  rationale: שְׁבָרִים 可指破碎、崩裂，也可能指由此产生的轰响；译文以“破碎之声”兼顾动作与声响，不将其具体化为未经明说的浪涛或攻击。
- source_word: יִתְחַטָּאוּ
  choice: 他们惊慌失措
  rationale: 该罕见形式在此通常按因恐惧而失常、慌乱理解，而不是常见词根意义上的“洁净自己”或“赎罪”；此译符合平行句和上下文。
theological_decisions:
- issue: אֵלִים 是“神明”还是“勇士”
  choice: 勇士
  alternative: 神明
  rationale: 两者在词汇上均有可能；但这里强调即使最强者也会害怕，译作“勇士”更符合人间战力的语境，也不额外引入诸神论意象。歧义以脚注说明。
- issue: יִתְחַטָּאוּ 的语义
  choice: 惊慌失措
  alternative: 洁净自己／自取罪责
  rationale: 本节的恐惧平行结构支持“失措、失常”的语境义；不把该形式机械译成该词根更常见的礼仪或罪责意义。
translation_notes:
  register: 采用庄重而易懂的现代普通话。“它”承接上文的巨兽；句式保留希伯来诗歌的两行平行结构，并避免将“破碎”过度具体化。
