  language: zh_hans
  text: 成排的盾牌，显出它的威严；封闭得严严实实，如同严密的封印。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּאֲוָה
  choice: 为傲
  rationale: 该词意为“骄傲、威严”。与后面的“成排的盾牌”结合，译作“以……为傲”在现代汉语中自然，同时保留原文将这些盾牌视为其荣耀所在的意味。
- source_word: אֲפִיקֵי מָגִנִּים
  choice: 成排的盾牌
  rationale: אֲפִיקִים在此描写排列成行的结构，מָגִנִּים直译为“盾牌”；不擅自改译为“鳞片”或增添“背上”。
- source_word: סָגוּר
  choice: 紧闭
  rationale: 保留“关闭、闭合”的基本意义，并以单数状态描写整组成排盾牌形成的严密整体。
- source_word: חוֹתָם צָר
  choice: 封得严严实实
  rationale: חוֹתָם涉及封印或封合，צָר在此表达紧密、严实；采用自然汉语呈现其密不透隙的状态。
