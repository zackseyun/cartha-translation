  text: From his mouth torches go out[a]; sparks of fire leap forth.
translation:
  language: zh_hans
  text: 火把从它口中冒出，火星[a]迸射出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火星”所译的希伯来语表达十分罕见；或译“燃烧的火把”或“火焰飞矢”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּיו
  choice: 从它口中
  rationale: מִן与“口”及第三人称阳性单数后缀连用，表示来源。现代汉语谈及动物通常用“它”，既自然，也不把希伯来语的语法性别误作生物性别。
- source_word: לַפִּידִים
  choice: 火把
  rationale: 该词通常指火把或燃烧的木柴；“火把”保留具体、鲜明的火焰意象。
- source_word: יַהֲלֹכוּ
  choice: 冒出
  rationale: 该动词本义为“走、行”，但与“从它口中”和火把搭配时表示向外出现；“冒出”符合现代汉语表达，并保留动态画面。
- source_word: כִּידֹדֵי אֵשׁ
  choice: 火星
  rationale: כִּידֹדֵי罕见且词义有争议，在与火把平行的诗句中可理解为迸出的火星；正文采用自然简洁的“火星”，其他可能含义列入脚注。
- source_word: יִתְמַלָּטוּ
  choice: 迸射出来
  rationale: 该词基本义涉及“逃脱、脱出”，此处描绘火从口中突然射出；“迸射出来”传达突然脱出的方向与力度。
theological_decisions: []
translation_notes:
