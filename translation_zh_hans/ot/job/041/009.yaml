base_translation:
  language: en
  yaml_path: translation/ot/job/041/009.yaml
  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: zh_hans
  text: 片片彼此紧贴[a]，互相扣合，不分开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“每一个与它的弟兄紧贴”；“弟兄”在这里比喻与它相邻的同类鳞片。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 片片
  rationale: אִישׁ在这里不是指“男人”，而是与单数同类对象搭配，表示逐一分配。结合上下文所描写的鳞片，译作“片片”既明确所指，也保留“每一片”的逐项意味。
- source_word: בְּאָחִיהוּ
  choice: 彼此
  rationale: 字面为“与它的弟兄”。在非人对象的诗歌描写中，“彼此”自然表达相邻鳞片之间同类相连的关系；字面意象另见脚注。
- source_word: יְדֻבָּקוּ
  choice: 紧贴
  rationale: דבק表示黏附、紧紧相连。“紧贴”准确呈现鳞片密合的形象，同时符合现代汉语表达。
- source_word: יִתְלַכְּדוּ
  choice: 互相扣合
  rationale: 该词可表示被抓住、联结或紧密固定。结合鳞片的形象，“扣合”传达彼此咬合、牢固相连，并与前句构成诗意平行。
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: 绝不分开
  rationale: 否定式未完成体说明这些鳞片不会分离。“绝不分开”保留强烈而直接的陈述，不额外引入外力使之分开的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的诗体。“片片”承接上下文中的鳞片，避免将אִישׁ误解为人；“紧贴—扣合—不分开”保留原文递进和平行结构。
