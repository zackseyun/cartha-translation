  text: מִ֣י הִ֭קְדִּימַ/נִי וַ/אֲשַׁלֵּ֑ם תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם לִ/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: zh_hans
  text: 谁曾先给我什么，以致我还要偿还他？天下万物都是我的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 以简洁的疑问代词引出反问，保留希伯来文直接而有力的语气，不额外添加强调。
- source_word: הִקְדִּימַנִי
  choice: 曾先给我什么
  rationale: 该动词字面可指“走在……前面”或“抢先”，但与后面的“偿还”连用时，语境指先给予某物，从而使对方负有回报义务。“先给我什么”自然呈现这一习语含义；“什么”是汉语为使受事关系清楚而补出。
- source_word: וַאֲשַׁלֵּם
  choice: 使我必须偿还他
  rationale: 这里表达前一行为可能导致的结果，而非单纯的将来承诺。加入“必须”明确反问所涉及的偿还义务，宾语“他”由语境中的“谁”自然补出。
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: 天下万物
  rationale: 希伯来文直译为“众天之下”，在此指整个受造界。现代汉语“天下万物”自然、庄重，并与后面的所有权宣告衔接清楚。
- source_word: לִי הוּא
  choice: 都是我的
  rationale: 原文将“归我”置于强调位置，表达所有权。“都是我的”既保留总括和强调，也符合现代汉语习惯。
theological_decisions:
- issue: 上帝是否可能欠受造物，以及他对万有的所有权
  choice: 把本节译为反问：没有谁能先给予上帝，从而使上帝负有偿还义务；随后明确宣告天下万物都属于他。
  alternative: 较为形式对应的译法可作“谁曾在我以先，使我偿还？”，只保留时间上“在先”的表层意思。
  rationale: “先给”与“偿还”的紧密搭配显示，重点不是单纯的时间先后，而是谁能借着先行给予使上帝成为债务人。后半句以上帝拥有万物说明这种情况不可能；译文不进一步引入本节未明说的教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天下万物”以自然的汉语表达希伯来文“众天之下”的整体范围；首句保留反问力度，并用脚注呈现动词较形式对应的译法及其真实词义幅度。
