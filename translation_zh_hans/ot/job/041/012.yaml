base_translation:
  language: en
  yaml_path: translation/ot/job/041/012.yaml
  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: zh_hans
  text: 烟从它的鼻孔冒出，像从被吹旺的锅和芦苇中冒出的烟[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锅”也可译作“釜”或“大锅”。希伯来语 דּוּד 可指炊锅，也可指较大的锅状容器。
    reason: lexical_alternative
  - marker: b
    text: “被吹旺的”对应希伯来语 נָפוּחַ，含有被吹、被鼓风而火势增强的意思；“芦苇”对应 אַגְמוֹן，也可指灯心草一类湿地植物。此处常被理解为与火和浓烟有关的意象，但原文没有明确说明芦苇正在燃烧。
    reason: cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: 从它的鼻孔里
  rationale: נְחִירַיִם指鼻孔；介词מִן和第三人称阳性单数后缀构成“从它的鼻孔里”。现代汉语以“它”指前文所述的动物，并保留具体的身体意象。
- source_word: יֵצֵא עָשָׁן
  choice: 烟……冒出
  rationale: יצא表示出来、出去；用于烟时，“冒出”是自然、形象的现代汉语表达。未完成式在这里描写其特有的动作。
- source_word: כְּדוּד
  choice: 如同……锅
  rationale: דּוּד可指炊具、锅或较大的釜。“锅”通俗清楚，较大容器的可能含义置于脚注。
- source_word: נָפוּחַ
  choice: 烧沸的
  rationale: 该被动分词本义涉及被吹、被鼓风；在锅与烟的语境中，指火被吹旺后锅中沸腾的景象。“烧沸的”传达其语境效果，但脚注保留原词的鼓风意象。
- source_word: וְאַגְמֹן
  choice: 和燃烧的灯心草
  rationale: אַגְמוֹן指沼泽中的灯心草或类似芦苇的植物。此处与浓烟的比喻并列，语境表明它被当作燃料燃烧；“燃烧的”使汉语中的图像完整，同时不把植物笼统化为普通芦苇。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式尽量贴近希伯来诗句的次序，同时以“冒出”呈现烟的动态。“锅和燃烧的灯心草”的并列略显突兀，但这是原文意象本身的张力，不将两者合并或改写为单一炉火图景。
