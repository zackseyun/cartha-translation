  yaml_path: translation/ot/job/041/016.yaml
  text: His heart is hard like a stone[a], hard like the lower millstone.
translation:
  language: zh_hans
  text: 它的心坚硬如石，坚硬如同下磨石。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坚硬”或译“坚实”。原文动词本义与“浇铸”有关，在这里表示像铸成之物一样凝固、坚实。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: 它的心
  rationale: לֵב在这里指受造物内在的心；直译为“心”既保留诗歌意象，也符合现代汉语表达。
- source_word: יָצוּק
  choice: 坚硬
  rationale: 该词源于“浇铸、倾倒”，此处描述如铸成之物般凝固、坚实；“坚硬”能自然传达语境中的结果含义。
- source_word: כְּמוֹ אָבֶן
  choice: 如石
  rationale: 保留原文直接而凝练的明喻，符合诗体语感。
- source_word: וְיָצוּק
  choice: 坚硬
  rationale: 重复同一谓语，以保留希伯来诗句的平行与加强效果。
- source_word: כְּפֶלַח תַּחְתִּית
  choice: 如下磨石
  rationale: 该搭配通常指磨具中固定在下面的磨石；“下磨石”简明并能体现其厚重坚硬。
