base_translation:
  language: en
  yaml_path: translation/ot/job/041/019.yaml
  text: He regards iron as straw[a], and bronze as rotten wood.
translation:
  language: zh_hans
  text: 它把铁看作禾秆，把铜[a]看作朽木。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׁב
  choice: 看作
  rationale: 此处表示衡量、视为；“看作”自然地表达利维坦将坚硬金属视若无物。
- source_word: לְתֶבֶן
  choice: 禾秆
  rationale: תֶּבֶן通常指脱粒后的秸秆、禾秆；介词לְ在这里表达比较。“禾秆”既保留具体意象，也符合现代汉语。
- source_word: בַּרְזֶל
  choice: 铁
  rationale: 这是该金属的常规对应词，语境没有要求采用其他译法。
- source_word: לְעֵץ רִקָּבוֹן
  choice: 朽木
  rationale: 原文直译为“腐朽之木”；“朽木”简洁自然，保留脆弱、不堪一击的意象。
- source_word: נְחוּשָׁה
  choice: 铜
  rationale: 该词可指铜或青铜。现代汉语“铜”可作较宽泛的材料名称，同时保留原词在具体金属类别上的歧义。
