base_translation:
  language: en
  yaml_path: translation/ot/job/041/010.yaml
  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
translation:
  language: zh_hans
  text: 它打喷嚏，就闪出亮光；它的眼睛好像黎明的眼睑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黎明的眼睑”是希伯来诗歌意象，描绘天光初现，仿佛黎明睁开眼睛。
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: 它打喷嚏
  rationale: 该词源自表示“打喷嚏”的词根，复数形式在此可自然译为动作性表达；比“喷鼻息”更贴近希伯来词义。
- source_word: תָּהֶל אוֹר
  choice: 就闪出亮光
  rationale: 使役形式表达“使光发出、使光照耀”；“闪出亮光”保留使役意味和诗歌画面的鲜明感。
- source_word: וְעֵינָיו
  choice: 它的眼睛
  rationale: 直接对应连词、名词及第三人称阳性单数后缀；中文以分号承接，避免重复连接词而不损害关系。
- source_word: כְּעַפְעַפֵּי שָׁחַר
  choice: 好像黎明的眼睑
  rationale: 保留“眼睑”这一具体而奇特的希伯来诗歌意象，不将其解释性改写为“曙光”或“晨光初现”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而形象的普通话。“打喷嚏”通俗准确，“闪出亮光”增强诗句动感；正文保留“黎明的眼睑”的陌生诗意，并以脚注简要说明。
