  yaml_path: translation/ot/job/041/008.yaml
  text: They press close[a], one to another, and no air can come between them.
translation:
  language: zh_hans
  text: 它们彼此紧贴，连空气也进不到它们中间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“连风也进不到它们中间。”希伯来语 רוּחַ 可指“空气”“风”或“气息”；这里指物理意义上的空气或风。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד בְּאֶחָד
  choice: 彼此
  rationale: 该结构表达一个挨着一个、相互邻接；“彼此”在现代汉语中自然简洁，并保留相互紧邻的含义。
- source_word: יִגַּשׁוּ
  choice: 紧贴
  rationale: נגשׁ本义涉及靠近；在上下文对鳞片严密排列的描写中，“紧贴”既表达靠近，也体现几乎没有缝隙。
- source_word: וְרוּחַ
  choice: 连空气也
  rationale: רוּחַ可指空气、风或气息；此处是物理性描写，“空气”最符合鳞片之间没有空隙的语境。“连……也”自然承接前句所强调的严密程度。
- source_word: לֹא יָבֹא
  choice: 进不到
  rationale: 否定式未完成体陈述空气无法进入的实际情形；“进不到”以自然汉语表达这种由紧密贴合造成的结果，同时未将其处理成抽象能力陈述。
- source_word: בֵינֵיהֶם
  choice: 它们中间
  rationale: בין加第三人称阳性复数后缀表示“在它们之间”；“它们中间”符合现代汉语空间表达。
