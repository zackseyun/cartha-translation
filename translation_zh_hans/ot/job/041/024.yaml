  yaml_path: translation/ot/job/041/024.yaml
  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: zh_hans
  text: 它身后，一道水痕发亮[a]；人会以为深海已生白发[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它过去之后，一道水痕发亮。”希伯来语既可表示时间上的“在它之后”，也可表示空间上的“在它身后”；这里描写它在水中留下的航迹，故正文采用后者。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“把深水看作白发”。这是说深水泛起白色泡沫，仿佛已生白发。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: 它身后
  rationale: 该词既可表示时间上的“在它之后”，也可表示空间上的“在它身后”。上下文描写海中巨兽游过后留下的水迹，因此正文采用空间意义，同时在脚注保留另一种读法。
- source_word: יָאִיר
  choice: 闪闪发亮
  rationale: 使役词形可表示“发光、照亮”。这里描写水迹因浪花和泡沫而显得明亮；“闪闪发亮”自然地传达其动态视觉效果。
- source_word: נָתִיב
  choice: 一道水路
  rationale: 原词意为“路径、轨迹”。此处指巨兽划过水面留下的航迹；“水路”既符合语境，也保留“路径”的诗歌意象。
- source_word: יַחְשֹׁב
  choice: 人看……仿佛
  rationale: 该动词形式上是第三人称阳性单数，但在此可作非特指的观察判断。“人看……仿佛”表达旁观者所产生的印象，不强行指定主语。
- source_word: תְּהוֹם
  choice: 深渊
  rationale: 该词指深水、深海或深渊。“深渊”保留原文凝练而宏阔的诗意，也未把所指过度限定为普通海面。
- source_word: לְשֵׂיבָה
  choice: 满头白发
  rationale: 原词可指白发、灰发或年老。语境把布满白色泡沫的深水拟人化为满头白发；此译保留这一鲜明意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而具诗意的普通话。以“水路”具体呈现巨兽留下的航迹，又用“深渊”与“满头白发”保留希伯来诗歌的宏阔感和拟人意象；两个脚注分别交代方位词的歧义与白发比喻。
