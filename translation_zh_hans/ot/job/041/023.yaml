  yaml_path: translation/ot/job/041/023.yaml
  text: He makes the deep boil like a pot[a]; he makes the sea like a pot of ointment.
translation:
  language: zh_hans
  text: 他使深海像锅一样沸腾；使海如同调制的香膏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如同调香师配制的混合物”或“如同膏油”。希伯来语此词指调配而成的混合物，常与香膏或香料制品有关。
    reason: 词义在“调制的混合物”“香膏／膏油”及香料制品之间存在真实的语义幅度。
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: 使……沸腾
  rationale: 这是רתח的使役形，表示使某物沸腾或翻滚；“使……沸腾”自然保留了使役意义。
- source_word: כַּסִּיר
  choice: 如同锅鼎
  rationale: סִיר指烹煮用的锅具；“锅鼎”既清楚又具庄重的诗歌色彩，并呈现深水如锅中液体翻腾的形象。
- source_word: מְצוּלָה
  choice: 深渊
  rationale: מְצוּלָה指海的深处或深水；“深渊”简洁地保留其深邃意象，并与下句“海洋”形成诗歌平行。
- source_word: יָם
  choice: 海洋
  rationale: יָם通常意为“海”；“海洋”在现代汉语中自然、具体，并保留与“深渊”的平行关系。
- source_word: יָשִׂים
  choice: 使……好似
  rationale: שׂים本义常为“放置、设立”，在此比较结构中表示使之呈现某种状态；译作“使……好似”兼顾语义与汉语表达。
- source_word: כַּמֶּרְקָחָה
  choice: 好似调制的香膏
  rationale: מֶרְקָחָה指经调配而成的混合物，常与膏油或香料有关；“调制的香膏”保留复合调配之意及液体被搅动的形象，同时不把具体成分说得过死。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两分句重复“他使”，以保留希伯来诗句的平行结构；用“锅鼎”增强诗歌形象，但避免古奥措辞。
