base_translation:
  language: en
  yaml_path: translation/ot/job/041/004.yaml
  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: zh_hans
  text: 我不会缄默不言，论到它的肢体、它的威力和它体态的优美。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不会对它的各部分、它的能力以及它构造的优美缄默不言。”
    reason: “肢体”也可译为“各部分”；“威力”也可译为“能力”；末语可按词根含义译作“它构造的优美”。
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: 不会闭口不谈
  rationale: 该词在这里表示不保持沉默；用双重否定式保留希伯来文“我不沉默”的语气，同时使现代汉语自然流畅。
- source_word: בַּדָּיו
  choice: 它的肢体
  rationale: בַּד可指身体的部分或肢体；上下文正在描写利维坦的身体，因此“肢体”具体而贴切。
- source_word: דְבַר
  choice: 谈
  rationale: 该词与后面的内容相连，表示要述说或谈论的对象；在汉语中以动词“谈”表达，比直译为“事情”更自然。
- source_word: גְּבוּרוֹת
  choice: 它强大的力量
  rationale: 该词可指大能、能力或英勇之举；此处描写受造物的体魄与威力，译作“强大的力量”最合语境。
- source_word: חִין
  choice: 美
  rationale: חֵן可表示优美、魅力或恩宠；在此与身体的构造相连，取审美意义的“美”。
- source_word: עֶרְכּוֹ
  choice: 它结构
  rationale: 源自表示排列、配置的词根，所指是身体各部分有秩序的构成；“结构”既保留这一含义，也符合现代汉语表达。
