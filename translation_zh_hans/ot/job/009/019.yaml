base_translation:
  language: en
  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: zh_hans
  text: 若论力量，看哪，他强大；若论审判[b]，谁能传唤我出庭呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁能为我指定开庭的日期呢？”也有译本按上下文译作：“谁能传唤他出庭呢？”希伯来文动词在这里较难确定；按马所拉文本，其宾语形式直译为“我”。
    reason: 交代动词的不同理解，并保存马所拉文本“我”与按上下文理解为“他”之间的张力。
  - marker: b
    text: “审判”也可译作“公断”或“诉讼”。
    reason: 说明מִשְׁפָּט在司法语境中的可行词义。
lexical_decisions:
- source_word: אִם לְכֹחַ
  choice: 若论力量
  rationale: לְ在这里引出所谈论的范畴，意为“就力量而言”。“若论力量”自然简洁，并保留两个条件分句的平行结构。
- source_word: אַמִּיץ
  choice: 他强大
  rationale: 该词表示强健、有力。希伯来文没有明说主语，但上下文指向上帝；中文补出“他”，使句子完整，同时不增加称号或解释。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示注意并加强语气的功能，也符合本段庄重而强烈的修辞。
- source_word: לְמִשְׁפָּט
  choice: 若论审判
  rationale: מִשְׁפָּט在这里带有司法语境，可指审判、公断或诉讼案件。“审判”既保留法律色彩，也不过早限定为某一种具体程序。
- source_word: מִי יוֹעִידֵנִי
  choice: 谁能传我出庭呢
  rationale: יוֹעִידֵנִי按马所拉文本带第一人称单数宾语后缀，直指“我”；יעד的使役式在司法语境中可表示召集、传唤。“传我出庭”以现代中文表达该法律意象，并用“能”传达反问所暗含的不可能性。
theological_decisions:
- issue: 约伯向上帝申诉时的法庭意象
  choice: 保留“审判”“传我出庭”等司法语言，也保留约伯言辞中的张力。
  alternative: 按上下文将末句理解为“谁能传他出庭”，使其明确表示无人能把上帝召到法庭。
  rationale: 原文形式明确带“我”的宾语后缀，而上下文又使一些译者认为所要传唤的是上帝。正文优先依从现存希伯来文本，脚注交代另一种上下文读法，不以神学协调取代文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“若论……若论……”保留原文平行结构；“看哪”保存其修辞力度。正文依WLC的第一人称宾语译为“我”，不跟随英文咨询层把它直接改作“他”。
