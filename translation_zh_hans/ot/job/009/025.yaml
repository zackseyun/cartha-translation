  text: וְ/יָמַ֣/י קַ֭לּוּ מִנִּי רָ֑ץ בָּֽ֝רְח֗וּ לֹא רָא֥וּ טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/025.yaml
  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: zh_hans
  text: 我的日子比奔跑的人还快；它们奔逃而去，未曾见过美好[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美好”也可译作“福乐”、“昌盛”或“安康”。
    reason: 原词טוֹבָה含义宽泛，可指美好的事、福乐、兴盛或安康；正文保留其开放性。
lexical_decisions:
- source_word: יָמַי
  choice: 我的日子
  rationale: 保留希伯来语的所有格复数表达；这里“日子”指约伯一生中的时日，现代汉语也能自然理解这一用法。
- source_word: קַלוּ
  choice: 还快
  rationale: 该词在这里表达轻快、迅速之意；与“奔跑的人”构成比较，译作“还快”自然传达比较关系。
- source_word: מִנִּי רָץ
  choice: 比奔跑的人
  rationale: מִנִּי表示比较，רָץ是单数主动分词，可泛指奔跑者；不特指传令的信使，以免缩窄原文含义。
- source_word: בָּרְחוּ
  choice: 奔逃而去
  rationale: 保留“逃走、逃离”的基本意象及复数主语所带来的拟人效果，避免改成来源不同的“飞逝”。
- source_word: לֹא רָאוּ
  choice: 未曾见过
  rationale: 按否定完成式表达这些日子过去而没有经历美好的事；“未曾见过”在汉语中自然，并保留原文“看见”的意象。
- source_word: טוֹבָה
  choice: 美好
  rationale: 采用含义宽泛的译词，不限定为物质兴盛、快乐或安康；具体可能含义以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语。保留“我的日子”及日子“奔逃”“看见”的拟人意象；不用原文没有明说的篇章连接词。脚注标记置于所解释的“美好”之后。
