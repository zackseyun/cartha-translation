  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: zh_hans
  text: 愿他把他的杖从我身上移开[a]，别让他的可畏使我惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他使他的杖离开我；别让他的恐怖使我惊惶。”
    reason: “移开”对应 יָסֵר（使离开、挪去），“从我身上”对应 מֵעָלַי（从我上面）；“可畏”也可更直白译为“恐怖”，以呈现 אֵימָה 所指的惊惧。
lexical_decisions:
- source_word: יָסֵר
  choice: 愿他……移开
  rationale: 这是סור的使役词干形式，在语境中带祈愿语气；“愿他……移开”自然保留了约伯的愿望和请求。
- source_word: מֵעָלַי
  choice: 从我身上
  rationale: 原文直译为“从我上面”，表现杖压在约伯身上的意象；“从我身上”在现代汉语中自然且保留这一空间意味。
- source_word: שִׁבְטוֹ
  choice: 他的杖
  rationale: שֵׁבֶט可指杖、棍或权杖；在受苦和击打的语境中，“杖”既保留具体意象，也不把含义限定为王权。
- source_word: וְאֵמָתוֹ
  choice: 他的威严
  rationale: אֵימָה指令人恐惧、战兢的可畏性质。“威严”在此表达神使人畏惧的临在，同时避免与后面的“惊吓”形成生硬重复；“恐怖”也是可行译法。
- source_word: אַל
  choice: 不要让
  rationale: אַל与后面的动词构成否定的祈愿或请求；“不要让”符合现代汉语表达。
- source_word: תְּבַעֲתַנִּי
  choice: 惊吓我
  rationale: בעת意为使人惊恐、惊吓或使人丧胆；“惊吓我”清楚自然，并保留强烈惧怕的含义。
theological_decisions:
- issue: 第三人称单数代词所指及叙述人称
  choice: 保留“他／他的”，让约伯以第三人称谈论神。
  alternative: 改作直接称呼：“求你把你的杖从我身上移开，也不要让你的威严惊吓我。”
  rationale: 希伯来文动词和代词后缀均为第三人称单数，与本段约伯谈论神的方式相符；不将其顺译成第二人称，以保留原文的人称和张力。
- issue: אֵימָה的神学与情感色彩
  choice: 译为“威严”，侧重神那令人畏惧的临在。
  alternative: 译为“恐怖”或“可畏”，更直接突出约伯所感受到的惊恐。
  rationale: 该词既可指恐怖、畏惧，也可指引发这种畏惧的可畏性。“威严”在神为所指者的语境中自然，但脚注保留更直接的情感译法，避免消除原文的强烈张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“愿他”保留祈愿语气；“从我身上”呈现原文的压迫意象；全句保留第三人称，不改成对神的直接称呼。
