  text: who says to the sun[b][a], ‘Do not rise,’ and seals up the stars.
translation:
  language: zh_hans
  text: '他对太阳[a]说：“不要升起！”[b]

    又把众星封住。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来词 חֶרֶס 在诗歌中很可能指“太阳”；在别处也可指陶器或陶土。
    reason: lexical_alternative
  - marker: b
    text: 或译：“太阳就不升起。”希伯来文既可表示对太阳发出的命令，也可表示上帝话语所产生的结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: 他吩咐
  rationale: 分词承接上文对上帝的描述。与后面的直接命令相配，“吩咐”比单纯的“说”更自然地表达其权柄，同时未改变句法关系。
- source_word: לַחֶרֶס
  choice: 太阳
  rationale: חֶרֶס 在本诗歌语境中与“升起”和“众星”并列，指太阳；其常见的“陶器、陶土”义在此不合语境。
- source_word: וְלֹא יִזְרָח
  choice: “不要升起！”
  rationale: 未完成式可理解为对太阳所说命令的内容，保留鲜明的拟人表达；也可能描述上帝话语产生的结果，故以脚注保留歧义。
- source_word: וּבְעַד
  choice: 又把
  rationale: בְּעַד 与“封”连用，表达封闭、遮住之意；汉语以“把”字句自然呈现宾语与动作关系，“又”承接平行分句。
- source_word: כּוֹכָבִים
  choice: 众星
  rationale: 复数名词意为星辰；“众星”简洁、庄重，也符合诗歌语体。
- source_word: יַחְתֹּם
  choice: 封住
  rationale: חתם 的核心意象是加印封闭；“封住”既保留“封”的形象，又表达使众星不能显现的效果。
theological_decisions:
- issue: 太阳不升起是命令内容还是话语结果
  choice: 正文译为对太阳的直接命令：“不要升起！”
  alternative: “太阳就不升起”
  rationale: 希伯来语可容许两种理解。正文采用与“对太阳说”最直接相连的命令读法，并在脚注中明确保留结果性读法，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吩咐”体现语境中的权柄，“众星”保留诗歌色彩。正文分为两个诗行，以呈现希伯来诗句的平行结构；所有脚注标记均置于相关表达之后。
