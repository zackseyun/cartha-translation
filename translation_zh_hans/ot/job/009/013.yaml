  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: zh_hans
  text: '上帝不收回他的怒气；

    拉哈伯[a]的帮手在他之下屈伏。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉哈伯”在这里可能是古代诗歌中象征混沌势力的海怪名称；它的“帮手”指与它同属或支持它的势力。
    reason: 现代读者容易把“拉哈伯”误认作《约书亚记》中的女子喇合；脚注澄清此处是不同的希伯来词及意象，同时保留具体所指的开放性。
lexical_decisions:
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: 不收回他的怒气
  rationale: “שׁוב”使役式在此表示使怒气转回、止息；译作“不收回”既贴近原文，也符合现代汉语表达。
- source_word: תחתו
  choice: 在他脚下
  rationale: 字面为“在他之下”；汉语用“在他脚下”自然表达受其压服的空间与权势关系。
- source_word: שָׁחֲחוּ
  choice: 屈伏
  rationale: 该词表示俯身、低伏或被压服；“屈伏”保留身体下伏与臣服的双重意味，不弱化为单纯敬拜。
- source_word: עֹזְרֵי רָהַב
  choice: 拉哈伯的帮手
  rationale: רָהַב在此很可能指被上帝制伏的神话性混沌怪物或海怪；保留专名“拉哈伯”，避免擅自落实为埃及、骄傲或普通海兽。
theological_decisions:
- issue: “拉哈伯”的所指
  choice: 正文音译为“拉哈伯”，脚注说明其可能为象征混沌势力的海怪名称
  alternative: 译为“狂傲”“埃及”或直接译作“海怪”
  rationale: 本节语境及相近诗歌传统支持专名理解，但其具体指涉仍有讨论；音译最能保存原文的诗性与歧义。
- issue: “屈伏”是否表示敬拜
  choice: 采用中性的“屈伏”
  alternative: “下拜”或“俯伏敬拜”
  rationale: 原词强调低伏、被压服，未必包含自愿敬拜；不应加入原文没有明确表达的宗教行为。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“屈伏”比“蹲伏”更能同时呈现被压低和臣服之意；分行保留希伯来诗句的两个平行分句。
