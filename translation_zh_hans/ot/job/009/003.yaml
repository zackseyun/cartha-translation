source:
  edition: WLC
  text: אִם יַ֭חְפֹּץ לָ/רִ֣יב עִמּ֑/וֹ לֹֽא יַ֝עֲנֶ֗/נּוּ אַחַ֥ת מִנִּי אָֽלֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: zh_hans
  text: 若有人想与他争辩[a]，千次之中也不能回答他一次[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争辩”也可译作“争讼”或“与他打官司”；原文用词可带法律争议的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他不能回答他，千次中的一次”，意思是即使有一千次，也连一次都无法回答。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יַחְפֹּץ
  choice: 若有人想
  rationale: אִם引出假设条件；חפץ在此表示意愿或愿望。“若有人想”符合现代汉语习惯，又不把该词强化为喜爱或乐于。
- source_word: לָרִיב
  choice: 争辩
  rationale: ריב既可泛指争执，也可带有诉讼、申辩的法律色彩。“争辩”在普通现代汉语中自然，并保留对抗及辩论案件的潜在含义。
- source_word: עִמּוֹ
  choice: 与他
  rationale: 按介词的基本意义译为“与他”；对抗意味由“争辩”体现，同时不在正文中直接补出上下文所指的“上帝”。
- source_word: לֹא יַעֲנֶנּוּ
  choice: 不能回答他
  rationale: ענה在此是“回答、回应”。结合人与上帝争辩的语境，否定表达的是无法作答，而不只是拒绝回答。
- source_word: אַחַת מִנִּי אָלֶף
  choice: 千次之中也不能……一次
  rationale: 直译结构为“从一千中一次”。采用自然的汉语比例表达，并以“也”凸显连一次都做不到的夸张语势。
theological_decisions:
- issue: 本节代词所指及争辩场景
  choice: 保留“有人”与“他”的代词表达，由上下文表明是人试图与上帝争辩。
  alternative: 在正文中明确译为“若有人想与上帝争辩”。
  rationale: 约伯记9:2-4谈论人在上帝面前如何称义，以及上帝的智慧和能力，因此“他”最自然地指上帝；但希伯来文此处只用代词，保留代词可避免加入原文未明说的名词，并保存句法上的开放性。
- issue: לֹא所表达的是不能还是不愿
  choice: 译为“不能回答他”。
  alternative: 译为“不会回答他”或“不回答他”。
  rationale: 在人与全智全能的上帝争辩这一语境中，重点是人无力作答；不过希伯来语形式本身只是将未完成式否定，脚注说明其较直译的形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“若有人想”呈现假设语气；“千次之中也不能回答他一次”保留原文的夸张比例和语序重心。正文中的[a]、[b]分别紧随其所说明的词语和表达。
