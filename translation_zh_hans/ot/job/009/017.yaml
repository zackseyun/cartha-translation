  text: who crushes me in a storm and multiplies my wounds without cause[a][b][c].
translation:
  language: zh_hans
  text: 他在暴风中压伤我[a][b]，无故使我的创伤增多[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以暴风”或“在旋风中”。希伯来语介词既可表示所处情境或方式，也可表示工具。
    reason: lexical_alternative
  - marker: b
    text: “压伤”所译的希伯来语动词也可译作“压碎”或“击伤”；在别处还可能有“扑咬”的意思，但此处可能性较小。
    reason: lexical_alternative
  - marker: c
    text: “无故”也可译作“毫无理由”或“白白地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 他
  rationale: 关系代词承接上文所指的上帝；汉语诗句中用“他”自然衔接，避免生硬地译作“那一位”。
- source_word: בִּשְׂעָרָה
  choice: 在暴风中
  rationale: שְׂעָרָה 指暴风、风暴；介词 בּ 可表示处境、方式或工具。“在暴风中”保留生动意象，也不排除“以暴风”的工具性理解。
- source_word: יְשׁוּפֵנִי
  choice: 压伤我
  rationale: 罕见动词 שׁוף 在此表达猛烈伤害，并与下句“创伤”呼应。“压伤”兼顾“压碎”与“击伤”的语义，且不将程度限定得过死。
- source_word: וְהִרְבָּה
  choice: 加多
  rationale: 使役词形表示使之增多；“加多我的创伤”简洁保留原文动作性和诗歌力度。
- source_word: פְצָעַי
  choice: 我的创伤
  rationale: פצע 指伤口或创伤；“创伤”在此庄重自然，并可涵盖外在伤害与苦难造成的伤害。
- source_word: חִנָּם
  choice: 无故
  rationale: חִנָּם 表示无缘无故、没有缘由或白白地；“无故”简洁保留约伯申诉中的司法和道德力度。
theological_decisions:
- issue: חִנָּם 是否宣称约伯在绝对意义上无罪，还是表达他认为自己受苦并无正当缘由
  choice: 直译为“无故”，不缓和约伯的申诉，也不替经文解决其神学张力。
  alternative: “毫无理由”或“并非我罪有应得”
  rationale: 本节呈现约伯对所受苦难的强烈申诉。译文应保留这种张力，不把它改写成对约伯绝对无罪的系统性断言，也不预先为上帝的公义作解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话诗体。“暴风”“压伤”“创伤”保留原文猛烈的灾难意象；语序贴近希伯来语的两个并列动作，同时使中文朗读自然。所有脚注标记均置于相关词语之后。
