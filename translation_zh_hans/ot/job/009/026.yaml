base_translation:
  language: en
  yaml_path: translation/ot/job/009/026.yaml
  text: They pass by like reed boats, like an eagle swooping on prey.
translation:
  language: zh_hans
  text: '它们如芦苇船般疾逝，

    又如鹰扑向食物。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלְפוּ
  choice: 疾逝
  rationale: 该动词表示经过、消逝；结合上下文约伯感叹日子飞快流逝，并与鹰猛扑的意象相呼应，用“疾逝”同时传达消逝与迅速。
- source_word: אֳנִיּוֹת אֵבֶה
  choice: 芦苇船
  rationale: אֵבֶה所指植物材料并不完全确定，常理解为芦苇或纸莎草；“芦苇船”自然简明，也保留轻快船只的形象。
- source_word: נֶשֶׁר
  choice: 鹰
  rationale: 该词可泛指大型猛禽；这里的重点是猛禽俯冲捕食，传统且自然的汉语对应为“鹰”。
- source_word: יָטוּשׂ עֲלֵי אֹכֶל
  choice: 扑向食物
  rationale: יָטוּשׂ描写迅猛冲扑，עֲלֵי表示朝向，אֹכֶל字面为食物；直译为“扑向食物”，不把它进一步限定为“猎物”。
theological_decisions: []
translation_notes:
  register: 采用庄重而现代的诗体汉语，分为两个平行分句。“它们”承接上文约伯的日子；不在本节补明，以保留原文衔接。
