  text: who shakes the earth from its place[a], and its pillars tremble.
translation:
  language: zh_hans
  text: '他使大地震动，离开原处；

    大地的柱子也震颤。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: 他使……震动
  rationale: רגז的使役形分词在这里描述上帝持续展现的能力；“使……震动”保留使役含义，也符合现代汉语诗体表达。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 上下文描绘宇宙尺度的震动，而非某一地域；“大地”比“土地”更符合此处意象。
- source_word: מִמְּקוֹמָהּ
  choice: 离开原处
  rationale: 直接表达介词מן、名词“地方”和阴性单数后缀的含义，保留大地被移离其所在之处的强烈意象。
- source_word: וְעַמּוּדֶיהָ
  choice: 大地的柱子
  rationale: עמוד通常指柱子；明确重复“大地”比使用可能指代不清的“它的”更自然，同时保留古代诗歌中的宇宙意象，不释作“根基”。
- source_word: יִתְפַלָּצוּן
  choice: 摇撼
  rationale: 该词表示剧烈震颤；“摇撼”传达强烈的物理震动，并与上句“震动”形成诗意呼应而不完全重复。
theological_decisions:
- issue: 大地柱子的宇宙论意象
  choice: 按诗歌意象译为“大地的柱子”
  alternative: 解释性地译为“大地的根基”
  rationale: 原文使用“柱子”的古代宇宙诗歌图景。译文应保留这一形象，不按照现代宇宙观将其改写，也不把诗歌意象转化为教义命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以两行诗句呈现平行结构。“大地”体现宇宙性语境；“离开原处”与“柱子”保留原文鲜明、具体的诗歌图景。英文脚注所列“quake/shudder”实际对应第二个动词，而其标记在英文正文中似置于第一分句之后；中文正文已用“摇撼”体现该词义，因此不另设容易造成错指的脚注。
