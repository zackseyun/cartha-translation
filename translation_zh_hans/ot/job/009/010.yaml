  text: who does great things beyond searching out[b][a], and wonders beyond number.
translation:
  language: zh_hans
  text: 他所行的大事无法测透[a]；他的奇事不可胜数[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无法查究”。希伯来语表示这些大事无法被彻底探明或理解。
    reason: lexical_alternative
  - marker: b
    text: 或译：“多得无法数算”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: 他行
  rationale: 此处阳性单数主动分词承接上文所说的神，作持续性的描述；汉语用“他行”自然表达这种关系和动作。
- source_word: גְדֹלוֹת
  choice: 大事
  rationale: 阴性复数形容词在此名词化，泛指神所行的伟大之事；“大事”简洁，并避免把含义限缩为某一类作为。
- source_word: עַד אֵין חֵקֶר
  choice: 无法测透
  rationale: 该表达表示无法彻底探究或理解。“无法测透”既保留探究之意，也自然传达人的认识不能穷尽。
- source_word: וְנִפְלָאוֹת
  choice: 行奇事
  rationale: נִפְלָאוֹת 指令人惊奇、超乎寻常的作为；依照汉语平行句式补出“行”，使表达清楚而庄重。
- source_word: עַד אֵין מִסְפָּר
  choice: 不可胜数
  rationale: 该短语直指数量无法计算。“不可胜数”是现代汉语中自然、庄重的对应表达，并与前半句形成平行。
theological_decisions:
- issue: 分词所指的主语
  choice: 以“他”承接上文的神
  alternative: 省略主语，译作“行大事……”
  rationale: 希伯来文分词本身未在本节重复神的名，但语境清楚承接上一节；补出“他”符合汉语表达，同时不增加新的神学限定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。两小句以“行大事／行奇事”和“无法测透／不可胜数”构成诗歌式平行；避免使用过于古奥的“无可寻察”等措辞。
