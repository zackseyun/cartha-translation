  text: הַ/מַּעְתִּ֣יק הָ֭רִים וְ/לֹ֣א יָדָ֑עוּ אֲשֶׁ֖ר הֲפָכָ֣/ם בְּ/אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/005.yaml
  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
translation:
  language: zh_hans
  text: 他挪移群山，群山却不知道[a]；他在怒气中把它们倾覆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以群山为“知道”的主语，形成拟人化表达。
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: 挪移
  rationale: 使役分词表示使某物离开原处。“挪移”既保留“移动、移走”的词义范围，也适合描写上帝撼动群山的大能。
- source_word: הָרִים
  choice: 群山
  rationale: 保留复数意义；“群山”在现代汉语诗体中自然庄重。
- source_word: וְלֹא יָדָעוּ
  choice: 群山却不知不觉
  rationale: 希伯来文以复数动词把群山人格化。“群山却不知不觉”在汉语中保留这种诗意，也无需补出原文没有明说的宾语。
- source_word: אֲשֶׁר
  choice: 以分号表达其引出的情境关系
  rationale: 此处关系词可理解为引出群山浑然不觉的相关情境。汉语用分号连接后句，比硬译为“当……时”更自然，同时避免过度限定句法关系。
- source_word: הֲפָכָם
  choice: 把它们倾覆
  rationale: הפך表示翻转、倾覆，且词尾明确指向复数的群山；“倾覆”体现强烈、彻底的翻转。
- source_word: בְּאַפּוֹ
  choice: 在怒气中
  rationale: אַף在此为“怒气、烈怒”的惯用义。“在怒气中”保留介词所容许的情境色彩，不把它单一定为工具意义。
theological_decisions:
- issue: 群山是否被人格化
  choice: 保留群山“不知不觉”的人格化表达
  alternative: 解释为“在无人察觉时”
  rationale: 复数动词的语法主语最自然地承接“群山”；改为无人察觉会改变原文主语，并消解诗歌张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体。“挪移群山”“在怒气中”“倾覆”保留原文的宏大意象与力度；标点呈现两组紧密相连的诗句。
