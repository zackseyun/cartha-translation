  yaml_path: translation/ot/job/009/015.yaml
  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: zh_hans
  text: 即使我有理，我也不会答辩；我要向审判我的那位恳求怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: 我有理
  rationale: 此处表示在争讼中处于正当、无可指责的一方；“有理”自然保留司法语境，又不把含义扩大为一般性的道德完美。
- source_word: לֹא אֶעֱנֶה
  choice: 我也不敢答辩
  rationale: ענה在本节司法语境中指作答或申辩。原文直译为“我也不回答”；补出“不敢”体现约伯面对审判者时不凭自身正当抗辩、转而求怜悯的语意，但未将其说成不能回答。
- source_word: לִמְשֹׁפְטִי
  choice: 向审判我的那位
  rationale: 分词加第一人称后缀可指“审判我的人/那位”或“我的审判者”。此译自然表达其关系，并避免现代汉语“我的法官”可能带来的所有关系色彩。
- source_word: אֶתְחַנָּן
  choice: 求怜悯
  rationale: 该反身词形表达恳求恩惠、怜悯；“求怜悯”准确传达约伯不以权利抗辩而以恳求相向。
theological_decisions:
- issue: 约伯所面对的审判者是否直接明说为上帝
  choice: 保留为“审判我的那位”
  alternative: 向上帝求怜悯
  rationale: 上下文所指显然是上帝，但本节希伯来文本使用“审判我的那位”，没有直接出现神名；保留原文称谓可维持其司法意象。
- issue: “有理”是否表示绝对无罪
  choice: 按争讼语境译为“有理”
  alternative: 我是公义的／我是无罪的
  rationale: צדק在此可指案件中站得住脚或被判为正当；不应把约伯的假设强化为绝对无罪或完整的系统神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的司法语汇。“即使……也……”清楚呈现让步结构；分号保留两句之间由不答辩转向恳求的对照。
