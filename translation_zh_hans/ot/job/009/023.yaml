  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: zh_hans
  text: 灾祸若突然夺去人的性命，他便嗤笑无辜者的崩溃[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无辜者所受的试炼”，也可理解为“无辜者的消沉绝望”。这里的希伯来语名词含义不确定，可指试验，也可能含有消融、瓦解或绝望之意。
    reason: 说明罕见希伯来语名词的词义歧义。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 保留条件或假设语气，不将其强化为确定发生的“当……时”。
- source_word: שׁוֹט
  choice: 灾祸
  rationale: 本义为鞭子、刑鞭，在此可比喻横扫而来的毁灭性灾害；译作“灾祸”在现代汉语中自然，也保留上下文中的致命含义。
- source_word: יָמִית
  choice: 夺去人的性命
  rationale: 该使役形意为“使死亡、杀死”；此译清楚自然，并与“灾祸”搭配顺畅。
- source_word: פִּתְאֹם
  choice: 突然
  rationale: 直接表达事情猝然发生的副词含义。
- source_word: לְמַסַּת
  choice: 崩溃
  rationale: 该罕见名词可与消融、瓦解、灰心绝望相关，也可能被理解为试验或试炼；正文采用“崩溃”，既保留瓦解的意象，也适合无辜者遭灾的语境，并以脚注呈现其他可能。
- source_word: נְקִיִּם
  choice: 无辜者
  rationale: 指没有罪责的人；“无辜者”符合约伯关于无辜受苦的论述。
- source_word: יִלְעָג
  choice: 嗤笑
  rationale: 准确传达嘲弄、讥笑的强烈意味，同时保持庄重简洁。
theological_decisions:
- issue: “嗤笑”的主语
  choice: 保留为“他”，不在正文中明说是上帝
  alternative: 将“灾祸”拟人化为嗤笑者，或明确译作“上帝嗤笑”
  rationale: 希伯来文只有阳性单数动词，主语须由上下文推断。约伯在本章语境中很可能仍以先前所说的上帝为对象，但正文不补入“上帝”，可保留原文的语法含混和尖锐的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“灾祸”自然表达 שׁוֹט 在此处由“鞭子”引申出的毁灭性灾害；“他”刻意不明说所指，以保留原文歧义。
