  text: כִּי לֹא אִ֣ישׁ כָּמֹ֣/נִי אֶֽעֱנֶ֑/נּוּ נָב֥וֹא יַ֝חְדָּ֗ו בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: zh_hans
  text: 因为他不是像我一样的人，我不能回答他，也不能同他一同上法庭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他不是像我一样的人，我怎能回答他，与他一同进入审判呢？”
    reason: 保留希伯来文两个未完成式所容许的可能性／反问式表达；“进入审判”较直译בַּמִּשְׁפָּט，但不必理解为双方共同受更高法庭审判。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为约伯所述的困境提供理由；现代汉语中“因为”自然地表达这一论证关系。
- source_word: לֹא אִישׁ כָּמֹנִי
  choice: 他不像我，只是一个人
  rationale: 保留神与作为人的约伯之间的对比。“只是”在这里限定“我”的凡人身份，而不是贬低人的价值。
- source_word: אֶעֱנֶנּוּ
  choice: 我无法答复他
  rationale: ענה在此具有诉讼语境中的回应、答辩意味。结合前面的否定条件，以“无法”自然表达约伯不能把神当作对等诉讼方来回应。
- source_word: נָבוֹא יַחְדָּו
  choice: 同他一起上
  rationale: 第一人称复数包括约伯与神；“同他一起”保留双方共同到场的含义。
- source_word: בַּמִּשְׁפָּט
  choice: 法庭
  rationale: מִשְׁפָּט可指审判、案件或司法程序；本节的争讼图景中，“上法庭”以自然现代汉语具体传达其法律含义。
theological_decisions:
- issue: 约伯与神之间的诉讼图景
  choice: 表达为约伯无法把神当作同等的人，一同上法庭争讼
  alternative: 较抽象地译为“一同进入审判”或“一同受审判”
  rationale: 希伯来文采用司法语言，但重点是约伯无法与神作为对等诉讼双方交涉，并非宣告双方都受某个更高法庭审判。
- issue: אִישׁ的人称与性别表达
  choice: 译作“一个人”，并由“我”明确指向男性说话者约伯
  alternative: 译作“男人”或“凡人”
  rationale: 现代汉语“人”能准确表达此处神与人类的对比；“男人”容易误导为男女之别，而“凡人”虽可传意，却比原词多带有限、平凡的解释色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上法庭”清楚保留法律比喻；正文将希伯来文较紧缩的句法自然展开为“无法……也无法……”，脚注则保留较形式对应的句法可能。
