base_translation:
  language: en
  yaml_path: translation/ot/job/009/030.yaml
  text: If I washed myself with snow and cleansed my hands with lye,[a]
translation:
  language: zh_hans
  text: 即使我用雪洗身，用碱洗净双手，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用肥皂”；原文所指更确切地说是一种碱性洗涤剂，如碱液。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 即使
  rationale: 这里引出约伯论证中的假设让步情形；结合下节的结果句，“即使”比单独的“如果”更自然，也保留了原文条件结构的力度。
- source_word: הִתְרָחַצְתִּי
  choice: 洗净自己
  rationale: רחץ的Hitpael形式表达反身动作；“洗净自己”既体现自洗，也与本节的洁净意象相称。
- source_word: במו שָׁלֶג
  choice: 用雪
  rationale: 原文直接以“雪”为洗涤的媒介，并未明确说“雪水”；译作“用雪”避免加入原文没有明说的解释。
- source_word: וַהֲזִכּוֹתִי
  choice: 洁净
  rationale: זכה的Hiphil形式表示使之洁净；“洁净”保留身体清洗与道德清白之间可能存在的双重意味。
- source_word: בְּבֹר
  choice: 用碱
  rationale: בֹּר指碱性的洗涤物质，并非现代意义上的肥皂；“碱”简洁、准确，也便于现代读者理解。
- source_word: כַּפָּי
  choice: 双手
  rationale: 字面为“我的手掌”，但在洗涤语境中汉语自然说“我的双手”；“双”也符合该名词的双数形式。
theological_decisions:
- issue: 清洗语言是否明确解释为道德或礼仪上的自洁
  choice: 保留具体洗涤措辞及其潜在比喻意味，不明说为道德自证或礼仪洁净
  alternative: 译成“使自己完全清白”之类的抽象表达
  rationale: 原文以雪、碱和双手构成具体意象，同时在约伯的申辩中具有更深的清白意味；译文不应替作者消除这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“即使……用……”读来流畅，并让本节与下节的结果句衔接；保留“雪”“碱”“双手”等具体意象。
