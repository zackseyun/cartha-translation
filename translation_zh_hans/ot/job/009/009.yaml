base_translation:
  language: en
  yaml_path: translation/ot/job/009/009.yaml
  text: who made the Bear[a], Orion, and the Pleiades[c][b], and the chambers of the south.
translation:
  language: zh_hans
  text: 他造了[a]大熊座[b]、猎户座和昴星团，也造了南天的密室[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他创造”。希伯来语分词既可指已经完成的行动，也可描述持续或一贯的行动。
    reason: lexical_alternative
  - marker: b
    text: “大熊座”译自一个星座名称；其确切所指并不完全确定，旧译有“大角星”等。
    reason: alternative_reading
  - marker: c
    text: “南天的密室”可能是诗意地指向南方天空隐秘的区域或其中的星群。
    reason: cultural_note
lexical_decisions:
- source_word: עֹשֶׂה
  choice: 造了
  rationale: 这是动词 עשה 的 Qal 主动分词，在此承接上文对上帝的描述。译作“造了”自然地表达其创造之工，同时以脚注保留分词也可表示持续或一贯行动的可能。
- source_word: עָשׁ
  choice: 大熊座
  rationale: 此词在本节的天文语境中是星座名称，通常理解为大熊座。采用现代通行名称，既明确又便于普通读者理解；其具体所指仍有一定不确定性，故加脚注说明。
- source_word: כְּסִיל
  choice: 猎户座
  rationale: 该词用于天文语境时通常指猎户座；采用现代标准星座名，可直接传达所指。
- source_word: כִימָה
  choice: 昴星团
  rationale: 该词通常被认定为昴星团。使用现代汉语常用天文名称，比音译更清楚。
- source_word: חַדְרֵי תֵמָן
  choice: 南天的密室
  rationale: 原文直译为“南方的内室／密室”。在列举星座的语境中，这一诗性说法可能指南方天空隐秘的区域或星群；“南天的密室”保留原文意象而不把解释写入正文。תֵמָן 在这里取方位义“南方”，而非地名“提幔”。
theological_decisions:
- issue: 上帝创造行动的时态体貌
  choice: 正文译作“造了”，脚注保留“创造／造出”的持续性理解
  alternative: 他创造／造出
  rationale: 希伯来语分词既可在语境中概述已经完成的创造，也可描写上帝持续或一贯的作为。正文采用符合创造语境的完成表达，但不排除另一种语法理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。星座使用现代通行名称；“南天的密室”保留希伯来诗歌的空间意象与含蓄性。并列结构简洁，符合本节列举上帝创造之物的节奏。
