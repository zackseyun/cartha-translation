  text: then you would plunge me into the pit[b][a], and my own clothes would abhor me.
translation:
  language: zh_hans
  text: 那么，你会把我浸在坑中[a]，甚至我的衣服也会厌恶我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”或译“沟”。希伯来语 שַׁחַת 可指“坑”“沟”，在某些语境中也可指“毁灭”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的衣服会憎恶我”。原文把衣服拟人化。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 承接上一节的假设：即使约伯洗净自己，接下来仍会发生这样的事；“那时”自然表达时间和结果上的推进。
- source_word: בַּשַּׁחַת
  choice: 浸入坑中
  rationale: שַׁחַת 可指坑、沟，也可在某些语境指毁灭。这里与洗涤、浸入的意象相连，采用具体而不过度解释的“坑”；介词随运动动词译作“入……中”。
- source_word: תִּטְבְּלֵנִי
  choice: 你必把我浸入
  rationale: טבל 意为蘸、浸入。译作“把我浸入”保留原文动作意象及第二人称所表明的直接施事者，也符合本段假设性陈述中的确定语气。
- source_word: וְתִעֲבוּנִי
  choice: 也会厌恶我
  rationale: תעב 表示厌恶、憎恶。复数动词自然以随后出现的复数名词“我的衣服”为主语；“厌恶”保留强烈的排斥意味。
- source_word: שַׂלְמוֹתָי
  choice: 连我的衣服
  rationale: 指衣服或外衣。“连”凸显夸张而反讽的拟人意象：约伯污秽到连自己的衣服也排斥他。
theological_decisions:
- issue: 第二人称动词所表明的施事者
  choice: 保留约伯对上帝的直接称呼：“你必把我浸入”。
  alternative: 弱化为无明确施事者的表达，如“我仍会落入坑中”。
  rationale: 原文是第二人称阳性单数动词，并延续上下文中约伯对上帝的直接陈诉。直译保留约伯控诉中的神学张力，不将其软化。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“浸入坑中”刻意保留原文与上一节洗涤意象的联系；“连我的衣服也会厌恶我”以自然汉语呈现衣服作主语的拟人表达。所有脚注标记均置于相关正文之后。
