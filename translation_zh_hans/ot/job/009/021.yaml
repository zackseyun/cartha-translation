base_translation:
  language: en
  yaml_path: translation/ot/job/009/021.yaml
  text: I am blameless[a]; I do not know myself; I despise my life.
translation:
  language: zh_hans
  text: 我无可指摘；我不顾惜自己[a]；我厌弃我的生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不了解自己。”希伯来文“自己”（nephesh）也可指“我的性命”或“我的生命”。
    reason: 保留לֹא אֵדַע נַפְשִׁי较直译的理解，并说明נֶפֶשׁ可指自我、性命或生命的词义范围。
lexical_decisions:
- source_word: תָּם
  choice: 纯全无过
  rationale: תָּם表示完整、纯全、正直，在《约伯记》中指无可指摘，而非宣称绝对无罪。“纯全无过”既呼应本书对约伯品格的描述，也避免“完美”可能造成的过度理解。
- source_word: אָנִי
  choice: 我
  rationale: 保留原文明确的第一人称代词及其强调作用。
- source_word: לֹא אֵדַע
  choice: 不顾惜
  rationale: יָדַע的基本义是“知道、认识”，但与נַפְשִׁי连用时，语境可表达“不把自己放在心上、不顾自己”。正文采用自然且符合上下文的“不顾惜”，同时以脚注保留原文较直译且含义更宽的表达。
- source_word: נַפְשִׁי
  choice: 自己
  rationale: נֶפֶשׁ可指生命、性命、自我或人自身。此处译作“自己”最符合汉语反身表达；脚注保留“我的性命/生命”等可能性。
- source_word: אֶמְאַס
  choice: 厌弃
  rationale: מָאַס有拒绝、弃绝、厌恶之义。“厌弃”兼具排斥与强烈厌恶的语气，适合约伯此处的哀痛。
- source_word: חַיָּי
  choice: 我的生命
  rationale: חַיִּים带第一人称后缀，此处指约伯活着的生命或生存状态；“我的生命”自然、清楚。
theological_decisions:
- issue: 约伯自称תָּם的范围
  choice: 译为“纯全无过”，表示品格完整、无可指摘
  alternative: 译为“无罪”或“完全”
  rationale: 原词并不必然宣称绝对、普遍的无罪；采用“纯全无过”保存约伯关于自身清白的强烈主张，同时不导入罪论上的额外结论。
- issue: לֹא אֵדַע נַפְשִׁי的理解
  choice: 正文译为“不顾惜自己”
  alternative: “我不了解自己”或“我不承认自己”
  rationale: 短语语义突兀，可能指对自身生命漠然、不再顾念自己，也可按字面理解为“不认识自己”。正文依语境表达其对自身存亡的漠然，脚注保留词义上的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“纯全无过”略带经文语体，以传达תָּם的品格完整与无可指摘；“不顾惜自己”使句意在汉语中自然连贯，脚注则保存希伯来语的突兀与多义。
