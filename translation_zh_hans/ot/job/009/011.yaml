base_translation:
  language: en
  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: zh_hans
  text: 看哪[a]，他从我身旁经过，我却看不见他；他掠过，我也察觉不到他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真的”或“瞧”。
    reason: lexical_alternative
  - marker: b
    text: “察觉不到他”也可译作“不能明白他”或“无法辨明他”；希伯来语兼有辨察和理解的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 用现代而庄重的感叹语引出强调性的观察，保留原文鲜明、即时的指示语气。
- source_word: יַעֲבֹר עָלַי
  choice: 从我身旁经过
  rationale: עבר与על的组合在此描写从约伯近旁经过；这样既自然，也避免把על过度具体化为从身体上方越过或践踏。
- source_word: וְלֹא אֶרְאֶה
  choice: 我却看不见他
  rationale: 直接表达ראה的否定形式；中文“看不见”自然呈现未能看见的结果，而不额外断定其原因。
- source_word: וְיַחֲלֹף
  choice: 他掠过
  rationale: חלף表示经过、移去；“掠过”与前一动词有所区分，同时保留迅速经过而难以捕捉的诗意。
- source_word: וְלֹא אָבִין לוֹ
  choice: 我也察觉不到他
  rationale: בין可指辨明、领会或察觉；在视觉与神隐秘经过的语境中，“察觉”较自然，同时以脚注保留“明白”的语义可能。
theological_decisions:
- issue: 第三人称主语及代词所指
  choice: 以“他”指上文所说的上帝，但本节不增补“上帝”这一称谓
  alternative: 理解为不定指的“某一位”
  rationale: 约伯记9:10–12的直接语境持续描述上帝难以测度的作为；使用“他”保持所指清楚，又不在本节原文没有神名之处明说神名。
- issue: אָבִין לוֹ表达感知还是理解
  choice: 正文译为“察觉不到他”
  alternative: “不能明白他”或“无法辨明他”
  rationale: 本节以“看不见”及两个移动动词构成平行，感知层面的译法更贴合语境；但בין本身也能表示理解，故以脚注明示歧义。
translation_notes:
  register: 采用现代标准普通话，保持诗歌式的对称和庄重感。“看哪”保留强调语气；“经过／掠过”体现两个近义动词的变化；“却／也”使两半句的平行关系清晰。
