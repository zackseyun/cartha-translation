base_translation:
  language: en
  yaml_path: translation/ot/job/009/004.yaml
  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
translation:
  language: zh_hans
  text: 他心里有智慧，力量强大；谁曾硬着心肠与他对抗，却能安然无恙[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亨通”或“平安脱身”。希伯来语动词可指完整、平安地度过或脱身。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: 心里有智慧
  rationale: 保留“心”作为思想、意志所在的希伯来意象，同时符合现代汉语表达。
- source_word: וְאַמִּיץ כֹּחַ
  choice: 力量强大
  rationale: 传达 אַמִּיץ 与 כֹּחַ 叠加强调的强健、大能之意，避免生硬重复。
- source_word: מִי
  choice: 谁
  rationale: 自然引出反问句。
- source_word: הִקְשָׁה
  choice: 刚硬顽抗
  rationale: 该使役词形在此具有使自己刚硬、执拗抵抗的意味；这一译法兼顾刚硬意象与敌对行动。
- source_word: אֵלָיו
  choice: 向他
  rationale: 与“刚硬顽抗”连用时表达针对他的敌对方向，现代汉语自然。
- source_word: וַיִּשְׁלָם
  choice: 还能安然无恙
  rationale: שלם 在此指完整、平安地脱身；“安然无恙”清楚表达抵抗之后仍未受损的结果，并保留反问语气。
theological_decisions:
- issue: 句首谓语的隐含主语
  choice: 补出“他”，按上下文指上帝
  alternative: 在译文中明确写“上帝”
  rationale: 希伯来文句首没有明说主语，但上下文明指上帝；补代词可使汉语完整，又不把原文隐含内容过度明说。
- issue: 抵抗上帝之后的结果
  choice: 安然无恙
  alternative: 亨通；平安脱身
  rationale: 原词可涉及完整、平安或顺遂；此处不把它收窄为物质或事业上的“亨通”，而按对抗语境表达未受损地脱身。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分号保留两个平行陈述之间的推进关系，末句译作反问。
