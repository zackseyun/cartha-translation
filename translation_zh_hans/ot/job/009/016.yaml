base_translation:
  language: en
  yaml_path: translation/ot/job/009/016.yaml
  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: zh_hans
  text: 即使我呼求，他回答我，我也不相信他会侧耳听我的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: 即使
  rationale: 本句虽以条件词引出假设情形，但语境带有让步意味；“即使”自然表达“纵然发生这种情况”的张力，而不改作时间性的“当……时”。
- source_word: קָרָאתִי
  choice: 我呼求
  rationale: קרא可指呼叫、呼求；在约伯向上帝申诉的语境中，“呼求”自然贴切，又不必强化为“哀号”。
- source_word: וַיַּעֲנֵנִי
  choice: 他也回答了我
  rationale: ענה在此意为回答、回应；“回答了我”直接保留动作及宾语。
- source_word: לֹא אַאֲמִין
  choice: 我仍不相信
  rationale: 在假设—让步结构中表达约伯即便如此仍无法相信；“仍”明确承接前面的让步情形，而不将其写成普遍的教义断言。
- source_word: כִּי
  choice: （引出“不相信”的内容）
  rationale: כִּי在此最自然地引出约伯不相信的内容，汉语无需另译成“因为”。
- source_word: יַאֲזִין
  choice: 真的侧耳听了
  rationale: אזן强调留心倾听、侧耳听；“侧耳听”保留其专注聆听的意象，“真的”传达此处受“不相信”支配的语义关系，并非给原文另加事实判断。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: קוֹלִי直译为“我的声音”，比“我的祈求”少一层解释，保留原文措辞。
theological_decisions:
- issue: 约伯如何看待上帝的回应与垂听
  choice: 译为约伯主观上仍无法相信上帝确实留心听他，即便上帝回答了他。
  alternative: 译成上帝根本不垂听，或仅表达约伯的惊讶。
  rationale: 原文陈述的是假设情境中约伯的“不相信”，并未直接建立“上帝从不听祷告”的普遍命题，也不宜淡化为单纯惊讶；译文保留其信仰与经验之间的张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“呼求”符合祷告与申诉语境；“侧耳听”保留希伯来语意象。正文中的[a]与脚注标记对应。
