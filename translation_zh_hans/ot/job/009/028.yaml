base_translation:
  language: en
  yaml_path: translation/ot/job/009/028.yaml
  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: zh_hans
  text: 我惧怕自己所受的一切痛苦[a]；我知道，你必不判我无罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我惧怕我的一切忧愁”，或“我害怕我的一切患难”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你必不以我为无辜”，或“你必不让我免受惩罚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: 我惧怕
  rationale: 该词为 גור 的 Qal 完成式第一人称单数，在此表达持续的惧怕状态；“我惧怕”既自然，又保留“畏惧、害怕”的语义。
- source_word: כָל
  choice: 一切
  rationale: 直接保留全称量词的范围。
- source_word: עַצְּבֹתָי
  choice: 自己所受的痛苦
  rationale: 该词可指痛苦、忧愁或患难。结合约伯正在承受的苦难，“所受的痛苦”较自然地传达其切身体验，又不局限为纯粹的情绪忧伤。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: ידע 的 Qal 完成式第一人称单数在此具有现在状态意义，译作“我知道”符合现代汉语。
- source_word: כִּי
  choice: （无显式对应）
  rationale: 此处引出“知道”的内容；现代汉语在“我知道”之后可直接接分句，无须机械译出“即/那”。
- source_word: לֹא
  choice: 不
  rationale: 保留原文的明确否定。
- source_word: תְנַקֵּנִי
  choice: 你必不判我无罪
  rationale: נקה 的 Piel 在此具有司法语义，可表示判定无罪、宣告清白，或不予惩罚。“判我无罪”保留约伯与上帝争辩语境中的法庭色彩。
theological_decisions:
- issue: 约伯对上帝说话时，נקה 所含的司法意味
  choice: 你必不判我无罪
  alternative: 你必不以我为无辜；你必不让我免受惩罚
  rationale: 采用司法性的表达，呈现约伯确信上帝不会裁定他无罪的张力，但不借此引入后来的教义框架。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惧怕”比“害怕”略显庄重；“判我无罪”清楚保留司法语境。脚注标记均置于正文相关词句之后。
