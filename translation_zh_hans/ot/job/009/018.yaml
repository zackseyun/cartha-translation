  text: לֹֽא יִ֭תְּנֵ/נִי הָשֵׁ֣ב רוּחִ֑/י כִּ֥י יַ֝שְׂבִּעַ֗/נִי מַמְּרֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/018.yaml
  text: He does not let me catch my breath[b][a], for he fills me with bitterness.
translation:
  language: zh_hans
  text: 他不容我喘一口气[a]，因为他使我饱尝苦楚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让我恢复气息”；直译：“让我使我的气息／灵返回。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“使我饱尝苦涩之物。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: 不容我
  rationale: נתן（“给”）后接不定式时可表达准许、容许；“不容我”自然传达这里的否定许可义。
- source_word: הָשֵׁב רוּחִי
  choice: 喘一口气
  rationale: 字面涉及“使我的气息／灵返回”，在接连受苦的语境中，指得到片刻喘息或恢复；“喘一口气”符合现代汉语习惯，同时保留身体气息的意象。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前句所述情形的原因；“因为”清楚表达因果关系。
- source_word: יַשְׂבִּיעַנִי
  choice: 使我饱尝
  rationale: שׂבע 的使役式有“使饱足、使充满”之意；与苦楚搭配时，“使我饱尝”既保留饱足意象，也自然表现苦难之多。
- source_word: מַמְּרֹרִים
  choice: 苦楚
  rationale: 该复数名词可指“苦涩之物”或种种痛苦经历；“苦楚”在本语境中自然涵盖累积的苦难经验。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“不容我喘一口气”传达约伯所受打击毫无间歇；“饱尝苦楚”保留原文“使饱足”与复数“苦涩之物”的浓烈意象。
