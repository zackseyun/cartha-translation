  text: אָ֭מְנָם יָדַ֣עְתִּי כִי כֵ֑ן וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/002.yaml
  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
translation:
  language: zh_hans
  text: 诚然，我知道确是如此；但凡人[a]怎能在上帝面前算为义[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡人”译自希伯来语 אֱנוֹשׁ，是泛指人类的单数名词，并带有脆弱、必死的意味；也可译作“人”或“人类”。
    reason: lexical_alternative
  - marker: b
    text: “算为义”也可译作“有理”或“被判为义”；原文可带司法意味，但没有在此明确说明判定的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: 诚然
  rationale: 表达约伯郑重而明确的承认，保留原词的强调语气，同时符合现代汉语的庄重文体。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 此处完成式表达已经确立的认识；汉语用现在时的“我知道”最自然。
- source_word: כִי כֵן
  choice: 确是如此
  rationale: 承接并确认上文所说之事，既保留指示和肯定意味，也使汉语表达流畅。
- source_word: וּמַה
  choice: 但……怎能
  rationale: 连接词与疑问词在此形成由承认转向追问的论证转折；“但……怎能”自然传达这种语势。
- source_word: יִצְדַּק
  choice: 为义
  rationale: צדק 的 Qal 形式可指是义的、站得住或被认定有理。“为义”保留其义理与司法两方面的张力，不预先限定为某种后期教义表述。
- source_word: אֱנוֹשׁ
  choice: 世人
  rationale: 该词以单数泛指脆弱、必死的人类。“世人”在现代汉语中能自然地作整体性泛指；脚注补明“凡人”这一更突出必死性的译法。
- source_word: עִם אֵל
  choice: 在上帝面前
  rationale: 字面为“与上帝”，在此语境中涉及人与上帝相对而立时能否为义或有理；“在上帝面前”自然呈现这种关系性和可能的司法意味。
theological_decisions:
- issue: 人在上帝面前“为义”的司法含义
  choice: 人在上帝面前怎能为义
  alternative: 人怎能与上帝争辩而有理／人怎能被上帝判为义
  rationale: 原文提出人在上帝面前能否为义或站得住的问题，却没有在本节说明其实现机制。“为义”保留道德与司法层面的张力，避免把后来的系统教义直接写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诚然……但……”保留约伯先承认、后追问的论述结构；“世人”避免把泛指全人类的 אֱנוֹשׁ 缩限为男性。
