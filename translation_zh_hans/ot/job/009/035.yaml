base_translation:
  language: en
  yaml_path: translation/ot/job/009/035.yaml
  text: Then I would speak and not fear him[a], for I am not so in myself.
translation:
  language: zh_hans
  text: 那时，我就会开口，不惧怕他[a]；因为我自己并不是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译作“因为我的情形并非如此”；更直译是“因为我与自己并非如此”。希伯来语末句有所省略，确切所指不明确。
    reason: 保留希伯来语省略结构的多种可能理解。
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: 我就会开口
  rationale: 这是דבר的第一人称单数未完成式/祈愿式，在上下文中表达假设条件实现后约伯便能说话；“就会开口”自然体现其与前文愿望的承接关系。
- source_word: וְלֹא אִירָאֶנּוּ
  choice: 不惧怕他
  rationale: ירא带第三人称阳性单数宾语后缀，直指“惧怕他”；采用简洁庄重的表达，不擅自把代词改成明确称谓。
- source_word: כִּי
  choice: 因为
  rationale: 引出前句所述情形的理由；“因为”清楚保留原文的解释关系。
- source_word: לֹא כֵן
  choice: 并不是这样
  rationale: כֵן意为“如此、这样”；末句有所省略，因此采用仍留有指涉空间的表达，不把“这样”具体化。
- source_word: אָנֹכִי עִמָּדִי
  choice: 我自己
  rationale: אָנֹכִי为强调式独立人称代词，עִמָּדִי字面为“与我”；“我自己”在现代汉语中保留自指和强调意味，同时避免过度解释这一罕见而省略的结构。
theological_decisions:
- issue: 末句省略结构的理解
  choice: 因为我自己并不是这样
  alternative: 因为我的情形并非如此；更直译为“因为我与自己并非如此”
  rationale: 希伯来语末句כִּי לֹא כֵן אָנֹכִי עִמָּדִי十分简略，可能指约伯当前的处境或内在状态。正文保留“这样”的开放指涉，不将其扩展为特定的心理、道德或神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那时……就会……”承接前文的假设语境；末句有意保持略显凝练的表达，以保存原文真实的歧义。
