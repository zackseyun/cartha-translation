  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: zh_hans
  text: 看哪[a]，他夺去时，谁能使他回转[b]？谁能对他说：“你在做什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“的确”或“瞧”。原文用这个词加强语气，并唤起听者注意。
    reason: lexical_alternative
  - marker: b
    text: “使他回转”直译为“使他返回”。原文的代词也可能指被夺去之物，因而可译作“谁能使它回来”或“谁能恢复它”。
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的感叹词；“看哪”庄重而清楚，也保留了原文鲜明的提示作用。
- source_word: יַחְתֹּף
  choice: 强行夺去
  rationale: חטף表示突然、有力地抓取或夺走；“强行夺去”兼顾动作的强制性和带走之意。
- source_word: יְשִׁיבֶנּוּ
  choice: 使他回转
  rationale: שוב的使役式表示“使……返回、回转”；这里按上下文将阳性单数后缀理解为指向上帝，表达无人能使他改变行动方向。
- source_word: מִי
  choice: 谁能
  rationale: 疑问词在两个反问句中表达无人有此能力；汉语用“谁能”自然呈现这一语用含义。
- source_word: יֹאמַר אֵלָיו
  choice: 对他说
  rationale: 直接对应原文，不额外加入“抗议”或“质问”等解释性措辞。
- source_word: מַה תַּעֲשֶׂה
  choice: 你在做什么
  rationale: 未完成体在此质问公式中自然表示正在进行或当前所作之事；该译法符合现代汉语习惯。
theological_decisions:
- issue: 两个第三人称阳性单数代词的指向
  choice: 按人称理解为指上帝：“他……使他回转……对他说”。
  alternative: 把יְשִׁיבֶנּוּ的后缀理解为上帝所夺去之物，译作“谁能使它归还”或“谁能把它恢复”。
  rationale: 上下文谈论上帝不可抗拒的行动，下一句也明确说“对他说”，因此将前一句的后缀理解为指上帝，衔接更自然；但脚注保留原文后缀可能产生的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“强行夺去”保留原文动作突然且有力的色彩；两个反问句维持简洁有力的诗体节奏。引号内用全角中文标点。
