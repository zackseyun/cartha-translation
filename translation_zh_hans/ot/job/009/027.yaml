translation:
  language: zh_hans
  text: 我若说：“我要忘掉我的哀诉[a]，我要放下愁苦的神情，振作起来[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀诉”也可译作“沉思”“心里的话”或“诉说”；这个希伯来语词可指内心的言语、思索或忧苦的诉说。在本段哀诉的语境中，译作“哀诉”较为贴切。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“我要撇下我的脸，并舒缓起来”。这是指放下愁苦的神情，试图缓解忧伤、振作起来的表达。
    reason: cultural_note
lexical_decisions:
- source_word: אִם אָמְרִי
  choice: 我若说
  rationale: אִם引出假设条件；אָמְרִי虽为第一人称完成式，在此与后续表达意愿的形式连用，宜按假设语气译为“我若说”。
- source_word: אֶשְׁכְּחָה
  choice: 我要忘掉
  rationale: 该第一人称形式表达约伯设想中的决意；“我要忘掉”自然保留其直接语气。
- source_word: שִׂיחִי
  choice: 我的怨言
  rationale: שִׂיח可指内心言语、沉思或诉说；在约伯哀诉的语境中，“怨言”最贴切，同时以脚注保留其语义范围。
- source_word: אֶעֶזְבָה פָנַי
  choice: 不再愁眉苦脸
  rationale: 直译近于“撇下我的脸/面容”，在此指放下愁苦的神情。汉语“不再愁眉苦脸”自然传达这一表情习语。
- source_word: וְאַבְלִיגָה
  choice: 振作起来
  rationale: בלג在此表示缓解愁苦、改变低沉神态；“振作起来”既自然，也避免把含义限缩为单纯面带笑容。
