  text: אִם אֶ֭צְדָּק פִּ֣/י יַרְשִׁיעֵ֑/נִי תָּֽם אָ֝֗נִי וַֽ/יַּעְקְשֵֽׁ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: zh_hans
  text: 即使我有理，我的口也会定我有罪；我虽无可指责，它也会使我显得乖谬。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我虽无可指责，他也会使我显得乖谬。”这里可把上帝理解为后半句未明说的主语。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: 即使
  rationale: 该词可引出条件或让步关系。本节两句强调即便约伯所声称的情形成立，他的言语仍会反过来对他不利，因此译作“即使”较自然，也保留整体的让步语气。
- source_word: אֶצְדָּק
  choice: 我有理
  rationale: צדק 的 Qal 在此为状态性、法庭语境的“有理、站得住”，不是“使自己称义”。“有理”是自然的现代汉语，也避免把含义扩大为绝对的道德完美。
- source_word: פִּי
  choice: 我的口
  rationale: 直译为“我的口”，在汉语中可自然地以转喻表示约伯自己的言语，并凸显其言辞反而定罪自己的讽刺意味。
- source_word: יַרְשִׁיעֵנִי
  choice: 会定我有罪
  rationale: רשע 的 Hiphil 在法庭语境中指宣告某人有罪。“定我有罪”准确保留司法色彩，不误解为使约伯在道德上变坏。
- source_word: תָּם
  choice: 我无可指责
  rationale: תָּם 在《约伯记》中通常表示品格完整、无可指责，而非绝对无罪或毫无过失；此译兼顾自然表达与语义限度。
- source_word: וַיַּעְקְשֵׁנִי
  choice: 它也会判我为乖谬
  rationale: עִקֵּשׁ 表达使之显为弯曲、乖谬。结合本节的司法语境，译作“判我为乖谬”体现被认定或显明为不正；“它”承接前句“我的口”，同时以脚注保留以上帝为隐含主语的可能。
theological_decisions:
- issue: וַיַּעְקְשֵׁנִי 的主语
  choice: 承接“我的口”，即“它也会判我为乖谬”
  alternative: 以上帝为隐含主语，即“他也会判我为乖谬”或“他也会使我显为乖谬”
  rationale: 两个分句的平行结构较支持沿用同一主语“我的口”，无需在正文中增添希伯来文未明说的“上帝”。不过，动词的阳性单数形式并不能排除以上帝为隐含主语，故在脚注中明确保留此解释，以维持原文的歧义和神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“有理”“定……有罪”“判……为……”保留法庭语境；“无可指责”避免把 תָּם 解释为绝对无罪；“乖谬”保留“弯曲、不正”的道德意味，同时比“弯曲”用于人时更自然。
