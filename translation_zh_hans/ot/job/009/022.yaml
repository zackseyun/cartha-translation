  yaml_path: translation/ot/job/009/022.yaml
  text: It is all one[a]; therefore I say[b], ‘He destroys both the blameless and the wicked.’
translation:
  language: zh_hans
  text: 这都是一样的。因此我说[a]：“他[b]把无可指责的人和恶人一并灭绝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经说过。”希伯来语的完成式在这里既可表达当前所作的断言，也可表达过去已经说过的话。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这毁灭无可指责的人和恶人。”这样译法把主语理解得较为非人称。
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  choice: 都是一样的
  rationale: 这是表达相同或无差别的习语；这里指两类人的结局并无分别。译文保留原句简短而沉重的判断，不把“一”机械地按数词翻译。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 清楚表达本句从前述判断引出的推论关系。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 该完成式在当前话语中可作现时陈述理解；“我说”自然地引出约伯接下来的结论，同时在脚注保留过去或完成意义。
- source_word: תָּם
  choice: 无可指责的人
  rationale: 指品格完整、行为正直的人，并非宣称绝对无罪；此译法既避免“完美”可能造成的误解，也与相对的“恶人”形成清楚对照。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 这是智慧文学中对道德上邪恶、应负罪责之人的常见称呼，与 תָּם 构成对比。
- source_word: הוּא מְכַלֶּה
  choice: 他把……一并灭绝
  rationale: 阳性单数代词加分词在上下文中最自然地以神为隐含所指；“灭绝”传达 כלה 在此处使之终结、毁灭的强烈含义，“一并”则自然呈现两类人都包括在内。
theological_decisions:
- issue: “他灭绝”的主语
  choice: 正文用“他”，按上下文理解为约伯所谈论的神。
  alternative: 采用非人称表达，不明确指出施行灭绝者，如“无可指责的人和恶人，都被灭绝”。
  rationale: 约伯记第9章持续谈论神的权能和治理，因此人称理解最为自然。正文不缓和约伯尖锐的申诉，也不把它改写为译者认可的教义结论；脚注保留较非人称的理解。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“都是一样的”保留原文简洁而略带突兀的语气；“无可指责的人”避免把 תָּם 误解为绝对无罪或毫无缺陷。正文保留约伯申诉中的神学张力，不加解释性缓和。
