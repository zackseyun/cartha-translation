  text: אָנֹכִ֥י אֶרְשָׁ֑ע לָ/מָּה זֶּ֝֗ה הֶ֣בֶל אִיגָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: zh_hans
  text: 我必被定罪[a]，那我为什么还要徒然劳苦呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必成为恶人。”希伯来语动词既可指在道德上“成为恶人”，也可在司法意义上指“被判有罪”。
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: 我
  rationale: 独立第一人称代词带有强调作用；汉语用明确的“我”保留这一重点。
- source_word: אֶרְשָׁע
  choice: 必被定罪
  rationale: רשע 的 Qal 形式既可表示“成为恶人”，也可在司法语境中表示“被判有罪”。结合约伯无法在上帝面前申明无辜的上下文，此处采用司法意义；“必”表达未完成式在语境中的将来或必然意味。
- source_word: לָמָה זֶּה
  choice: 那……为什么
  rationale: 该组合是带语境推论意味的问句，意为“既然如此，为什么”；译作“那……为什么”自然地传达这一作用。
- source_word: הֶבֶל
  choice: 徒然
  rationale: הבל 表示虚空、无益或徒劳；在此修饰约伯的劳苦，译作“徒然”简洁而庄重。
- source_word: אִיגָע
  choice: 还要……劳苦
  rationale: יגע 表示劳作、辛苦或使自己疲惫。反问语境中的“还要……劳苦”兼顾持续付出与其无益性。
theological_decisions:
- issue: רשע 的司法意义与道德意义
  choice: 司法意义：“必被定罪”
  alternative: 道德或描述意义：“必成为恶人”
  rationale: 上下文集中于约伯无法证明自己清白，以及即使自洁仍会被视为有罪（9:28–31）。正文采用司法意义，但以脚注保留希伯来文真实存在的道德意义歧义，不额外引入教义判断。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“那……还要……”呈现上下文中的推论与反问；“徒然劳苦”保留原文的简洁力度。
