  text: לֹ֣א יֵשׁ בֵּינֵ֣י/נוּ מוֹכִ֑יחַ יָשֵׁ֖ת יָד֣/וֹ עַל שְׁנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: zh_hans
  text: 我们之间没有仲裁者[a]，可以把手按在我们双方身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“中间人”。希伯来语这个词可指在争议双方之间作出裁断或介入的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: 没有
  rationale: 希伯来语存在句带否定，现代汉语自然译为“没有”，直接保留不存在之意。
- source_word: בֵּינֵינוּ
  choice: 我们之间
  rationale: 指争议中的双方，即约伯与上帝；“我们之间”准确而自然。
- source_word: מוֹכִיחַ
  choice: 仲裁者
  rationale: 该词源于יכח，在本节的诉讼语境中指介入双方、判明争议的人。“仲裁者”保留司法意味，也避免把后来的神学含义直接写入正文。
- source_word: יָשֵׁת
  choice: 可以……按
  rationale: 未完成式在此描写那位并不存在的仲裁者所能采取的行动；“可以”自然表达潜在、设想中的语气。
- source_word: יָדוֹ
  choice: 把手按在
  rationale: 保留“他的手”这一具体意象；汉语用“把手按在”可自然呈现其对双方施行权威或约束的画面。
- source_word: עַל שְׁנֵינוּ
  choice: 在我们双方身上
  rationale: 明确表示这只手同时临到争议的两方，并保留原文的身体意象。
theological_decisions:
- issue: 是否用带有较强基督论联想的“中保”翻译מוֹכִיחַ
  choice: 仲裁者
  alternative: 中间人；中保；裁决者
  rationale: 直接语境是约伯希望有人在他与上帝的争讼中作出裁断或介入。“仲裁者”最能保留法庭语境，又不把本节未明说的后期神学身份预先写入正文；“中间人”作为可行词义列入脚注，以保留原词兼具介入与裁断的语义空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仲裁者”体现诉讼语境；后半句保留“把手按在双方身上”的具体意象，不将其解释性改写为“施行权威”。
