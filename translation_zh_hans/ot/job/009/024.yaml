  text: אֶ֤רֶץ נִתְּנָ֬ה בְֽ/יַד רָשָׁ֗ע פְּנֵֽי שֹׁפְטֶ֥י/הָ יְכַסֶּ֑ה אִם לֹ֖א אֵפ֣וֹא מִי הֽוּא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: zh_hans
  text: '大地被交在恶人手中[a]；

    他[b]遮住其审判官的脸。

    若不然，那么是谁呢？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”或“国土”；“恶人”也可理解为“一个恶人”。希伯来语 אֶרֶץ 和单数 רָשָׁע 容许这些读法。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文没有明说“他”是谁；可能指上帝，也可能指掌权的恶人，或泛指某个未说明的行动者。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: 大地
  rationale: אֶרֶץ既可指整个“大地”，也可指某一片“土地”或“国土”。本段论及世间普遍的不公，“大地”较符合语境，同时在脚注保留另一可能。
- source_word: נִתְּנָה
  choice: 被交在
  rationale: 这是נתן的尼法勒完成式，表达被动以及行动造成的现状。“被交在”既体现被动，也与下文“手中”自然搭配。
- source_word: בְיַד
  choice: 手中
  rationale: 保留希伯来语以“手”表示掌控、权势的具体比喻；“交在……手中”也是自然的现代汉语表达。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 原文为阳性单数，可指一个恶人，也可作类称，泛指恶者。“恶人”在汉语中同样可以具有个体或概括性的含义，避免过度限定。
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: 地上审判官的脸
  rationale: 保留“审判官”和“脸”的具体意象；“地上”自然表达阴性后缀所回指的大地，避免生硬的“大地的审判官”。
- source_word: יְכַסֶּה
  choice: 他蒙住
  rationale: 皮埃勒未完成式第三人称阳性单数直译为“他蒙住”。原文没有明说“他”是谁，因此译文不补出具体身份，并以脚注说明其歧义。
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: 若不然，那么是谁呢？
  rationale: 保留反问和אֵפוֹא所带的“那么”语气；“若不然”不擅自补明前提或所指，符合原文的简洁与含混。
theological_decisions:
- issue: “蒙住”这一动作的隐含主语及末句“谁”的身份
  choice: 正文使用未明确身份的“他”，不判定其究竟是谁。
  alternative: 明确译作上帝、掌权的恶人，或改成无主语的被动句。
  rationale: 上下文可能使读者想到上帝是世事背后的终极行动者，也可能把主语理解为恶人；但本句希伯来文本只以第三人称阳性单数动词暗示主语，并未给出名词。译文应保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分为三行以呈现原句的陈述、意象和反问；保留“手中”“脸”等希伯来诗歌的具体比喻，不以解释性措辞取代。
