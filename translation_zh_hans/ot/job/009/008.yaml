base_translation:
  language: en
  yaml_path: translation/ot/job/009/008.yaml
  text: who alone stretches out the heavens and treads on the heights of the sea[a].
translation:
  language: zh_hans
  text: '他独自铺展诸天，

    又踏在海的高处[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又行走在海浪之上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: 铺展
  rationale: 该词的 Qal 分词表示伸展、展开；“铺展”自然保留了诗歌中的宇宙图景和描述性语气。
- source_word: שָׁמַיִם
  choice: 诸天
  rationale: 在宇宙诗歌语境中指天空穹苍；“诸天”既贴近希伯来语形式，也保持庄重而易懂的表达。
- source_word: לְבַדּוֹ
  choice: 独自
  rationale: 强调这一行动由他单独完成、无人协助；“独自”简洁准确。
- source_word: וְדוֹרֵךְ
  choice: 又踏在
  rationale: דרך 的 Qal 形式可指踩踏或行走；“踏在”保留鲜明的身体动作意象，又不增添“践踏、毁坏”的含义。
- source_word: עַל
  choice: 在……上
  rationale: 采用该介词在此处最直接的空间意义，并按现代汉语习惯与“踏”组合。
- source_word: בָּמֳתֵי
  choice: 高处
  rationale: במה 的基本意义是高处；正文保留“海的高处”这一不寻常而有力的原文隐喻，不直接将其解释为海浪。
- source_word: יָם
  choice: 海
  rationale: 使用单数“海”，对应原文，并适合此处宏阔的创造诗歌意象。
theological_decisions:
- issue: 上帝对受造界拥有独一主权的宇宙图景
  choice: 保留他独自铺展诸天、踏在海之高处的诗性描写
  alternative: 将后半句解释性地译为“行走在海浪之上”
  rationale: 原文以宏阔意象表现上帝独一而不受阻挡的权能。正文不把意象弱化为纯粹比喻，也不引入原文未明说的后期教义联想；较为解释性的“海浪”译法收入脚注。
translation_notes:
  register: 采用现代、庄重而清楚的诗歌语言。分作两行以呈现希伯来诗句的并列结构；“海的高处”刻意保留原文的陌生意象，并以脚注说明较自然的解释性译法。
