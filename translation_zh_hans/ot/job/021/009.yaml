  text: בָּתֵּי/הֶ֣ם שָׁל֣וֹם מִ/פָּ֑חַד וְ/לֹ֤א שֵׁ֖בֶט אֱל֣וֹהַּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/009.yaml
  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: zh_hans
  text: '他们的家宅安稳，无所惧怕[a]；

    上帝的杖也没有临到他们[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家宅”也可译作“家庭”；“安稳，无所惧怕”也可译作“平安，不受惊吓”。
    reason: lexical_alternative
  - marker: b
    text: “上帝的杖”比喻上帝的击打、管教或所降的苦难。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: 他们的家宅
  rationale: בַּיִת 的复数附属形式直指“他们的房屋”，也可涵盖家庭与家业。“家宅”既保留具体意象，又自然容纳家庭生活范围。
- source_word: שָׁלוֹם מִפָּחַד
  choice: 安稳，无所惧怕
  rationale: שָׁלוֹם 在此表示安全、安宁的状态；מִפָּחַד 表示与恐惧隔绝。“安稳，无所惧怕”符合现代汉语表达，并保留两部分的语义。
- source_word: שֵׁבֶט
  choice: 杖
  rationale: שֵׁבֶט 可指杖、棍或权杖；此处是上帝击打、管教或降灾的比喻。“杖”保留原文意象，不把含义限定为某一种神学解释。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的上帝之诗体单数称谓；译作“上帝”准确而自然，无须扩展为其他称号。
- source_word: עֲלֵיהֶם
  choice: 临到他们
  rationale: 若直译为“在他们上面”，现代汉语较生硬；结合“杖”的比喻，“临到他们”自然表达击打、管教或患难落在他们身上的意思，同时不限定具体性质。
- source_word: וְלֹא
  choice: 也没有
  rationale: 连接前后两个并列陈述，并表达否定；“也没有”在汉语中衔接自然。
theological_decisions:
- issue: “上帝的杖”所暗示的神圣行动性质
  choice: 保留“上帝的杖”这一比喻
  alternative: 上帝的惩罚／上帝的管教／上帝所降的灾祸
  rationale: 原文可涵盖击打、管教或苦难，并未明确限定其中一种。保留“杖”可维持诗歌意象与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分为两行以呈现希伯来诗歌的平行结构；“家宅”兼顾具体房屋与家庭范围，“临到”避免生硬直译，同时保留“杖”的开放性比喻。
