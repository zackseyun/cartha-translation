  text: מַה שַׁדַּ֥י כִּֽי נַֽעַבְדֶ֑/נּוּ וּ/מַה נּ֝וֹעִ֗יל כִּ֣י נִפְגַּע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/015.yaml
  text: What is the Almighty[a], that we should serve him? And what would we gain if we entreat him?
translation:
  language: zh_hans
  text: 全能者算什么，我们竟要事奉他？我们向他祈求，又能得到什么益处[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：我们向他祈求，又能有什么收获？
    reason: נּוֹעִיל可侧重“获利、得到好处”，也可较概括地表达为“有益处”。
lexical_decisions:
- source_word: מַה שַׁדַּי
  choice: 全能者算什么
  rationale: מַה在这里引出带有轻蔑意味的反问，质疑全能者对他们有何分量或价值；“算什么”比单纯的“是什么”更自然地传达上下文语气，同时保留“全能者”这一神圣称号。
- source_word: כִּי נַעַבְדֶנּוּ
  choice: 我们竟要事奉他
  rationale: עבד用于神时表示事奉、归顺，不限于礼仪性的敬拜；“竟要”自然表达前句反问所带出的质疑语气。
- source_word: וּמַה נּוֹעִיל
  choice: 又能得到什么益处
  rationale: יעל的使役词干在此表示获益、有用处；这一译法体现说话者以功利眼光衡量祈求神的价值。
- source_word: כִּי נִפְגַּע בּוֹ
  choice: 我们向他祈求
  rationale: פגע与ב连用在此语境中表示向某人恳求、求告；“向他祈求”清楚、庄重，并适合祷告语境。
theological_decisions:
- issue: 神圣称号שַׁדַּי的译法
  choice: 全能者
  alternative: 沙代
  rationale: שַׁדַּי在本节用作神的称号；译出称号的传统含义，较音译更便于现代普通读者理解，也不额外引入宗派性解释。
- issue: 是否将说话者的反问解释为否认神的存在
  choice: 保留为对事奉神之价值的轻蔑质疑
  alternative: 译成“全能者是谁”
  rationale: 上下文重点在恶人认为事奉、祈求神没有收益，并非明确讨论神是否存在；“算什么”保留原文反问的张力而不作过度神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“算什么”保留恶人言语中的轻蔑和功利语气；“事奉”延续经文中宗教性服事的常用表达。脚注标记置于对应的“益处”之后。
