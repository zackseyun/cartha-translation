  text: וְ֭/הוּא לִ/קְבָר֣וֹת יוּבָ֑ל וְֽ/עַל גָּדִ֥ישׁ יִשְׁקֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: zh_hans
  text: 然而，他被抬到墓地[c]；有人守望着坟堆[b][a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他守望着坟堆。”若把动词的主语理解为这位已埋葬的人，便可如此翻译；希伯来文没有明说主语。
    reason: alternative_reading
  - marker: b
    text: “坟堆”所译的希伯来词本指堆积起来的一堆；这里可能指坟墓上隆起的土堆。
    reason: cultural_note
  - marker: c
    text: “墓地”：希伯来文直译为“众坟墓”，可能是集合性地指安葬之地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 他终
  rationale: וְ 可按上下文带出转折或归结语气；“终”自然承接恶人一生兴盛却仍归于安葬的语境，同时保留显明的代词“他”。
- source_word: לִקְבָרוֹת
  choice: 到墓地
  rationale: קְבָרוֹת 形态为复数；汉语“墓地”可集合性地指众墓所在之处，既符合现代汉语习惯，也不必误导为同一人被抬往多个坟墓。
- source_word: יוּבָל
  choice: 被抬
  rationale: יבל 的使役被动式表示被带去或被运送；丧葬语境中“被抬”准确呈现送葬入墓的画面。
- source_word: גָּדִישׁ
  choice: 坟堆
  rationale: 该词本义为堆积之物或土堆；此处置于安葬语境，“坟堆”既保留具体意象，也点明其所指。
- source_word: יִשְׁקֹד
  choice: 还有人看守
  rationale: שׁקד 表示警醒、守望。希伯来文动词为主动形式，但主语未明；以泛指的“有人”避免指定守望者，也比汉语无主被动句自然。
theological_decisions:
- issue: יִשְׁקֹד 的隐含主语
  choice: 译作“有人看守”，不确定守望者身份
  alternative: “他守望坟堆”，以埋葬者为主语
  rationale: 希伯来文没有明说主语；正文采用泛指表达以保存不确定性，脚注列出以死者为主语的可能读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他终”简洁带出语境中的转折与归结；“墓地”以汉语集合名词反映原文复数；“还有人看守”保留动词主动性及主语未明的张力。所有脚注标记均置于相关词语之后。
