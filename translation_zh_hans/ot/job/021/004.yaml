base_translation:
  language: en
  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: zh_hans
  text: 至于我，我的怨诉岂是向人发的？若不是，我为什么不该心里焦躁呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂיחִי
  choice: 我的怨诉
  rationale: 此处指约伯所陈述的苦情或申诉；“怨诉”既保留不满与痛苦的意味，也符合向某对象申说的语境。
- source_word: לְאָדָם
  choice: 向人发的
  rationale: 介词 לְ 在此表怨诉所针对的对象；译成“向人发的”比生硬的“对人”更自然，同时保留“人”这一泛称。
- source_word: תִקְצַר רוּחִי
  choice: 心里焦躁
  rationale: 字面意象是“我的灵变短”，属表达不耐、急躁或忍耐耗尽的习语；“心里焦躁”在现代汉语中自然，并保留内在情绪受压的含义。
theological_decisions:
- issue: 约伯怨诉的对象
  choice: 以反问“岂是向人发的”保留其怨诉并非主要指向人的暗示
  alternative: 明确补出“是向上帝发的”
  rationale: 希伯来文没有明说上帝；不应把语境中的隐含对象直接补入正文，以免消除原文的含蓄与张力。
- issue: וְאִם 的逻辑关系
  choice: 译为“若不是”
  alternative: 译为“既然不是”或单纯“那么”
  rationale: 保留条件式表达及其修辞力量，不将推论关系解释得过满。
- issue: לֹא תִקְצַר רוּחִי 的反问语气
  choice: “为什么不该……呢”
  alternative: “我怎能不……”
  rationale: 前者较贴近原文“为何不”的结构，也保留约伯为自己的焦躁辩护而非声称完全无法控制的细微差别。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个连续反问保持原文论辩节奏；不增补原文未明说的神学对象。
