base_translation:
  language: en
  yaml_path: translation/ot/job/021/021.yaml
  text: For what does he care about his house after him[c][b][a], when the number of his months is cut off?
translation:
  language: zh_hans
  text: 因为，他一生的月数既已被截断[c]，他身后还会挂念自己的家[b]吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他身后，他的家对他还有什么乐趣呢？”
    reason: lexical_alternative
  - marker: b
    text: “家”也可指“家人”或“家族”。
    reason: lexical_alternative
  - marker: c
    text: “被截断”也可译为“被限定”或“被分定”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的论述提出理由；用“因为”自然体现解释关系。
- source_word: מַה
  choice: 有什么
  rationale: 保留反问形式，表达死后不再关切家中之事。
- source_word: חֶפְצוֹ
  choice: 还有什么挂念
  rationale: חֵפֶץ可指喜悦、意愿、所关切之事；“挂念”在此语境中自然传达关切之意，同时以脚注保留“乐趣”的词义可能。
- source_word: בְּבֵיתוֹ
  choice: 对自己的家
  rationale: 介词ב在此可标示关切的对象；“家”保留原文的具体意象，也可兼指家人或家族。
- source_word: אַחֲרָיו
  choice: 他身后
  rationale: 简洁保留“在他之后”的表达，并在现代汉语中自然指向他死后。
- source_word: וּמִסְפַּר חֳדָשָׁיו
  choice: 当他一生的月数
  rationale: 将连接词按语境表达为时间关系；保留原文具体的“月数”，并用“一生的”说明所指是寿命。
- source_word: חֻצָּצוּ
  choice: 被截断
  rationale: 按上下文理解为寿命终止；被动形式得以保留，同时脚注注明“限定／分定”的另一种词义分析。
theological_decisions:
- issue: 人死后与其家庭的关系
  choice: 以反问表达死后不再能挂念自己的家
  alternative: 将句子理解为他在世时对身后家业的乐趣或利益
  rationale: “他身后”保留原文אַחֲרָיו的开放性，不进一步引申任何关于死后状态的系统性教义。
translation_notes:
  register: 采用现代、庄重而易懂的反问句。“他身后”比直译“在他以后”更自然；“一生的月数”既保留希伯来文的具体说法，也避免读者误解为单纯计算月份。
