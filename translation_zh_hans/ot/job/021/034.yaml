  to: 那么，你们怎能用空话安慰我？你们的回答中，留下的只是背信！
  rationale: 将承接词改为更自然的“那么”，并重组后句以消除“所剩的”的中文歧义。保留“空话”和“背信”，分别体现空虚无实质的安慰与回答中不忠、失信的性质。增设脚注，保留“徒然”的可行译法及原句关系的歧义。
