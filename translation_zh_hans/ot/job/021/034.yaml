  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: zh_hans
  text: 那么，你们怎能用空话安慰我？你们的回答中，留下的只是背信！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵיךְ
  choice: 这样……怎能
  rationale: אֵיךְ引出反问；句首וְ承接约伯此前的论述。中文用“这样……怎能”自然表达上下文联系和质问语气。
- source_word: תְּנַחֲמוּנִי
  choice: 你们怎能……安慰我
  rationale: נחם的Piel形式带第一人称单数宾语，意为“安慰我”。“怎能”体现反问挑战，而不把情态说得过实。
- source_word: הָבֶל
  choice: 空话
  rationale: הבל可指虚空、徒然、毫无实质之物。此处针对朋友们所谓安慰的内容；“空话”既保留其名词性质，又符合现代汉语语境。
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: 你们的回答
  rationale: תשובה意为回答、回应，指朋友们此前的言论；“回答”简洁自然。
- source_word: נִשְׁאַר
  choice: 所剩的
  rationale: שׁאר的Niphal形式表示“剩下、留下”。译为“所剩的”保留结余、最终归结为何物的语义。
- source_word: מָעַל
  choice: 背信
  rationale: מעל表示不忠、背约或背信，强于一般的错误或欺骗。“背信”保留约伯指控朋友辜负信任的力度。
theological_decisions:
- issue: מָעַל所指控的性质
  choice: 背信
  alternative: 欺骗／虚假
  rationale: 原词通常涉及失信或不忠。这里不将其弱化为单纯论证错误，也不额外指定是对神还是对约伯背信，从而保留原文张力。
translation_notes:
  register: 采用现代、庄重而直接的普通话。前句以反问表达约伯的斥责，后句用“不过是”加强结论性，但不添加原文没有的具体对象或教义解释。
