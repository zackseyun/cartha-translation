  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: zh_hans
  text: 愿他亲眼看见自己的灾祸[b][a]，愿他喝全能者的烈怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必亲眼看见自己的灾祸，也必喝全能者的烈怒。”希伯来语的未完成式动词也可理解为预言性的将来陈述，而不是愿望。
    reason: alternative_reading
  - marker: b
    text: “灾祸”也可译作“灾难”或“毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ עֵינָיו
  choice: 愿他亲眼看见
  rationale: 字面为“愿他的眼睛看见”。现代汉语用“亲眼看见”自然表达本人直接目睹并承受后果的强调；未把复数形式机械译出。
- source_word: כִּידוֹ
  choice: 自己的灾祸
  rationale: כִּיד 表示灾祸、灾难或毁灭性遭遇。“灾祸”既保留范围，也避免“毁灭”可能带来的过强含义。
- source_word: וּמֵחֲמַת
  choice: 烈怒
  rationale: חֵמָה 可指烈怒、愤怒，也可在其他语境指毒液。这里与全能者的审判和“喝”这一隐喻相连，译作“烈怒”最合适；介词 מִן 在汉语“喝……的烈怒”结构中不宜硬译为“从”。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 采用《约伯记》中神圣称号 שַׁדַּי 的通行译法，不额外加入词源上有争议的神学含义。
- source_word: יִשְׁתֶּה
  choice: 愿他喝
  rationale: 保留“喝”的审判隐喻，并与前句一致，将未完成式理解为愿望式语气；预言性将来仍在脚注中保留。
theological_decisions:
- issue: 两个未完成式动词的语气
  choice: 译为愿望式：“愿……看见……愿……喝”
  alternative: 预言性将来：“他必亲眼看见……也必喝……”
  rationale: 上下文中，约伯强调恶人本人应当经历报应，而不是只让儿女承担；愿望式较能传达此处的论辩力度。不过希伯来语未完成式也可作将来陈述，因此用脚注保留这一真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“亲眼”突出恶人本人经历后果；“喝全能者的烈怒”保留原文鲜明的诗歌隐喻。脚注标记按英文审校层的对应关系置于“灾祸”之后。
