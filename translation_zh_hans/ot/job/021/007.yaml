  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: zh_hans
  text: 为什么恶人仍然活着，年岁渐长，甚至财势越发强盛[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财势越发强盛”也可译作“力量越发强大”或“权势越发强盛”。希伯来语 חָיִל 可指财富、资源、力量或权势。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 以直接疑问引出约伯的抗议，保留原文质问的力度，不增添解释性措辞。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是智慧文学中对道德邪恶之人的常用称呼，不限于法律意义上的有罪者。
- source_word: יִחְיוּ
  choice: 能长久活着
  rationale: 未完成体在这里表达生命持续；“长久活着”自然传达恶人未受预期审判、反而继续生存的反常现象。
- source_word: עָתְקוּ
  choice: 得享高寿
  rationale: 该词可有进展、长成之意；在与继续活着及势力增长并列的语境中，指年岁增长、活到老年。“得享高寿”既自然，也保留约伯所强调的兴盛意味。
- source_word: גַּם
  choice: 甚至
  rationale: 表达递进和强调：恶人不但长寿，势力还进一步增长。
- source_word: גָּבְרוּ
  choice: 日盛
  rationale: 表达不断增强、壮大的结果；与“财势”搭配，简洁地呈现其力量和资源增长。
- source_word: חָיִל
  choice: 财势
  rationale: חָיִל 可指财富、资源、力量或权势。此处论恶人的昌盛，“财势”能在正文中兼顾财富与力量，避免把多义词仅限于钱财。
theological_decisions:
- issue: 恶人昌盛与公义秩序之间的张力
  choice: 保留为未获解答的质问
  alternative: 补明这是暂时现象或预示最终审判
  rationale: 本节原文只提出恶人长寿而且强盛的尖锐问题，没有在句内给出神学解释；译文不提前消解《约伯记》有意保留的张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“得享高寿”与“财势日盛”形成递进，适合诗歌性的质问；正文保留疑问语气，并以脚注说明 חָיִל 的词义范围。
