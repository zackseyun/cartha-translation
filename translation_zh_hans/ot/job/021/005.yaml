base_translation:
  language: en
  yaml_path: translation/ot/job/021/005.yaml
  text: Turn to me and be appalled[a], and put your hand over your mouth.
translation:
  language: zh_hans
  text: 你们转向我，惊愕吧[a]；用手捂住自己的嘴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“震惊吧”。原文动词可表示惊愕、震惊或骇然，这里描写人受到强烈冲击后的反应。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: 你们转向我
  rationale: פּנה的复数祈使式与אֵלַי表示朝向说话者；译为“转向我”既保留方向性和急切语气，也符合现代汉语表达。
- source_word: וְהָשַׁמּוּ
  choice: 惊愕吧
  rationale: שׁמם的使役词干复数祈使式在此表达因震惊而愕然的反应；“惊愕”兼具震惊与骇异之意，又不把语义过度限定为恐惧或厌恶。
- source_word: וְשִׂימוּ יָד
  choice: 用手捂住
  rationale: שׂים意为放、置；结合“手在嘴上”这一固定动作，现代汉语以“用手捂住”最自然，并清楚表达动作。
- source_word: עַל־פֶּה
  choice: 自己的嘴
  rationale: 字面为“在嘴上”；在复数命令语境中，手和嘴自然指各听者自己的身体部位，因此用“自己的”避免误解，同时保留原句所描绘的噤声或震惊姿态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惊愕吧”保留祈使语气及原文动词的语义张力；分号呈现两个并列命令之间的紧密关系。
