  text: זֶ֗ה יָ֭מוּת בְּ/עֶ֣צֶם תֻּמּ֑/וֹ כֻּ֝לּ֗/וֹ שַׁלְאֲנַ֥ן וְ/שָׁלֵֽיו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/023.yaml
  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: zh_hans
  text: 有人精力正盛时死去，全然安逸、安稳。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有人在他完全健全、力量充盛时死去，整个人安逸而安稳。”
    reason: בְּעֶצֶם תֻּמּוֹ 可较直译地表达为完全健全或力量充盛的状态；כֻּלּוֹ 强调整个人全然处于安逸、安稳之中。
lexical_decisions:
- source_word: זֶה
  choice: 有人
  rationale: 指约伯对照中的一种代表性情况；现代汉语用“有人”自然表达泛指个体，不必机械译作“这一个人”。
- source_word: יָמוּת
  choice: 到死
  rationale: 未完成式在这里表达概括性、常见性的观察；“到死”既呈现死亡这一结局，也与后面的状态描述自然衔接。
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: 仍精力充沛
  rationale: עֶצֶם 本指骨头，并可引申为实质、力量；תֻּמּוֹ 表示完整、健全。二词结合在本语境中指生命状态完好、力量未衰，而非道德上的纯全。
- source_word: כֻּלּוֹ
  choice: 仍
  rationale: 该词强化全然处于随后所述状态的意思。汉语正文以整体句式表达其强调作用，脚注保留更贴近形式的“全然”。
- source_word: שַׁלְאֲנַן
  choice: 安逸
  rationale: 表达从容、安稳、不受搅扰的状态；“安逸”自然且不把含义限定为物质富裕。
- source_word: וְשָׁלֵיו
  choice: 无忧
  rationale: 与前词构成近义并列，强调平静、不受扰动；“无忧”与“安逸”搭配自然，同时保留安稳宁静的意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“精力充沛”传达身体与生命状态完好，不将 תֻּמּוֹ 误解为道德意义上的“纯全”；“安逸无忧”保留两个近义形容词的平行强化。
