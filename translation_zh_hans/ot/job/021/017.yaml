base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: zh_hans
  text: 恶人的灯究竟有多少次熄灭[a][b]？他们的灾祸究竟有多少次临到他们？他究竟有多少次在怒中把痛苦分给他们[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人的灯有多少次被熄灭……？”这里的问句是反问，质疑恶人是否经常以这种方式受审判。
    reason: lexical_alternative
  - marker: b
    text: “灯”是比喻，可指人的生命、兴盛或持续的福运。
    reason: cultural_note
  - marker: c
    text: “痛苦”也可译作“疼痛”或“阵痛”；原词可表达几种彼此相关的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: 何尝常常
  rationale: 此处询问发生频率，并带有反诘意味；约伯质疑恶人是否真如传统说法那样经常受报。“何尝常常”既表达频率，也保留反问语气。
- source_word: נֵר
  choice: 灯
  rationale: 保留希伯来的具体意象；在智慧文学中可比喻人的生命、兴盛或持续的福运。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 符合智慧文学语境中的通常用法，简洁而自然。
- source_word: יִדְעָךְ
  choice: 熄灭
  rationale: דעך用于灯火熄灭；中文“熄灭”准确保留意象，也不必额外指定使其熄灭者。
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: 他们的灾祸临到他们
  rationale: אֵיד表示灾祸、灾难或毁灭；“临到”保留灾祸降临其身的表达。
- source_word: חֲבָלִים
  choice: 痛苦
  rationale: 该词可指痛苦、阵痛等，也可能唤起绳索之义；此处与灾祸和怒气并列，“痛苦”宽广自然，并以脚注保留其他可能。
- source_word: יְחַלֵּק
  choice: 分给
  rationale: Piel词形表示分配、分派；“分给”是现代中文的自然说法，同时保留按份分配的含义。
- source_word: בְּאַפּוֹ
  choice: 在怒中
  rationale: אַף在此表示怒气。“在怒中”较贴近原文结构，并保持庄重简练。
theological_decisions:
- issue: “他在怒中分给”之第三人称单数主语所指
  choice: 保留“他”，不在正文中明说是上帝
  alternative: 直接译作“上帝在怒中把痛苦分给他们”或采用无人称表达
  rationale: 动词的主语在希伯来文中没有明说；上下文强烈暗示所指为上帝，但译文保留代词可避免增加原文未明言的信息。
- issue: 全节问句的修辞力量
  choice: 三次采用“何尝”，把问句译为质疑某事是否常常发生的反问
  alternative: 中性地译为“有多少次……？”或“多久一次……？”
  rationale: 上下文中约伯正在挑战恶人必然、经常现世受报的说法；反问语气属于该节论证的一部分，但不将其绝对化为“从不”。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“何尝常常”承载原文询问频率的反诘语气；保留“灯”的智慧文学意象，并以脚注解释。末句不明说“上帝”，以维持希伯来文主语隐含的形式。所有脚注标记均置于相关正文之后。
