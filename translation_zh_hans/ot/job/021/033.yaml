base_translation:
  language: en
  yaml_path: translation/ot/job/021/033.yaml
  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: zh_hans
  text: 谷中的土块对他是甘甜的[a]；全人类都跟随在他后面[b][c]，在他前面的数不胜数。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“溪谷（或河床）中的土块令他惬意。”希伯来语 נחל 可指山谷、沟壑、旱溪或河床。
    reason: lexical_alternative
  - marker: b
    text: “全人类”直译为“所有人”；这里的 אָדָם 泛指人类。
    reason: lexical_alternative
  - marker: c
    text: 这句话既可能使人想到送葬的行列，也可能泛指全人类都走向死亡：在他以前已有无数人离世，在他以后所有人也会跟随。
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ
  choice: 是甘甜的
  rationale: 该动词源于 מתק，可指甘甜或令人愉悦。这里保留希伯来文“甘甜”的具体比喻，不把安葬于土中的安适意味改写成抽象解释。
- source_word: לּוֹ
  choice: 对他
  rationale: 介词 ל 加第三人称单数后缀表示与他的关系或他的感受；“对他”符合现代汉语表达。
- source_word: רִגְבֵי
  choice: 土块
  rationale: רֶגֶב 指泥土形成的块状物；“土块”简明具体，也保留埋葬场景中的土地意象。
- source_word: נָחַל
  choice: 谷中
  rationale: נחל 可指山谷、沟壑、旱溪或河床。“谷中”在汉语中自然，并保留地貌上的一定宽度；其他可能含义列入脚注。
- source_word: וְאַחֲרָיו
  choice: 在他后面
  rationale: 该短语既有空间上的“在他后面”，也可表示时间或次序上的“在他之后”；此译法保留送葬行列与相继走向死亡两种理解。
- source_word: כָּל אָדָם
  choice: 全人类
  rationale: אָדָם 在此为集合性、泛指性的“人类”，并非只指男性个体；“全人类”准确表达其普遍范围。
- source_word: יִמְשׁוֹךְ
  choice: 都跟随
  rationale: משך 的基本义为拉、牵引，但与“在他后面”连用时，语境表示跟随而行。“跟随”在现代汉语中清楚，同时没有限定为送葬或死亡中的某一种解释。
- source_word: וּלְפָנָיו
  choice: 在他前面的
  rationale: 既可表示空间上走在前面，也可表示时间上先于他；名词化译法保留两方面的可能。
- source_word: אֵין מִסְפָּר
  choice: 数不胜数
  rationale: 该惯用语表示数量多到无法计算。“数不胜数”自然、庄重，并准确传达不可胜数之意。
theological_decisions:
- issue: 本节安葬与死亡意象的具体所指
  choice: 保留“土块”“在他后面”“在他前面”等具体表达，使经文既可描绘恶人得到安稳或体面的安葬，也可指无数人先后走向死亡。
  alternative: 将本节专门解释为送葬队伍，或将其完全抽象化为全人类必死的陈述。
  rationale: 希伯来文同时容许送葬行列和人类相继进入死亡这两种图景。正文不以解释性措辞排除其中任何一种，脚注则说明这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“甘甜”刻意保留原文略显突出的比喻；“跟随在他后面”和“在他前面”则维持空间与时间两层含义，不把经文限定为单纯的葬礼场面或抽象的死亡教训。
