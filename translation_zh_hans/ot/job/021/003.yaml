base_translation:
  language: en
  yaml_path: translation/ot/job/021/003.yaml
  text: Bear with me[a], and I will speak; and after I have spoken[b], you may mock.
translation:
  language: zh_hans
  text: 请容忍我，我要说话[a]；等我说完，你尽管嘲笑吧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“请承担我”或“请忍受我”。这里指请对方容忍约伯，让他发言。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“等我说完，你会嘲笑”。希伯来文可作简单的将来陈述，也可按上下文理解为许可或让步：“你尽管嘲笑吧。”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: 请容我说下去
  rationale: נשׂא本义为“抬起、承担”，此处结合发言语境，意为容忍约伯、让他把话说完。现代汉语用“请容我说下去”自然传达这一请求，并保留其人际压力。
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: 我说下去
  rationale: אָנֹכִי是带强调色彩的第一人称代词，אֲדַבֵּר意为“我要说”。汉语在祈请句中明确说“我”已能自然体现重音；“说下去”也与前面的容让请求相合。
- source_word: וְאַחַר דַּבְּרִי
  choice: 等我说完
  rationale: 字面为“在我说话之后”。“等我说完”是自然、简洁的现代汉语表达，准确保留先后次序，并未把“说话”改成话语内容。
- source_word: תַלְעִיג
  choice: 你尽管嘲笑吧
  rationale: לעג的使役式在此意为“嘲笑、讥诮”。动词形式为阳性单数；译文保留单数“你”。“尽管……吧”表达语境中较顺畅的许可或让步语气。
theological_decisions:
- issue: 末句的语气
  choice: 许可／让步：“你尽管嘲笑吧”
  alternative: 简单将来或陈述：“你会嘲笑”／“你嘲笑”
  rationale: 希伯来语未明确标出许可语气，因此形式上可作简单陈述；但上下文中约伯先要求对方听完，再让对方嘲笑，许可或让步理解更顺畅。脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请容我”略带正式色彩，适合《约伯记》的辩论语境；“说下去”与“说完”形成自然衔接。所有脚注标记均已置于正文。
