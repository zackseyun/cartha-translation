  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: zh_hans
  text: 上帝把他的罪孽[a]积存起来，留给他的儿子[b]吗？[c] 愿上帝报应他本人，好叫他知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”所译的希伯来词也可指罪孽所招致的祸患或惩罚。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“儿子”；在这里也可能泛指一个人的后代。
    reason: lexical_alternative
  - marker: c
    text: 原文也可不按反问来读，较直译为：“上帝把他的罪孽积存起来，留给他的儿子；愿上帝报应他本人，使他知道。”但上下文更支持把开头听作约伯对这种说法的质疑。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的上帝单数称谓；译作“上帝”自然准确，不额外加入原词未明说的含义。
- source_word: יִצְפֹּן
  choice: 积存起来
  rationale: צפן在这里表示保存、留存，语境所说的是把后果留待以后临到其儿子；“积存起来”保留了这一意象。
- source_word: לְבָנָיו
  choice: 留给他的儿子
  rationale: בנים字面为“儿子们”；正文保留阳性复数的明确措辞，同时用脚注说明语境中也可能泛指后代。
- source_word: אוֹנוֹ
  choice: 他的罪孽
  rationale: אָוֶן可指罪恶、不幸或罪恶所招致的祸患。正文采用较贴近词面的“罪孽”，不把它直接解释为“惩罚”，并在脚注保留语义范围。
- source_word: יְשַׁלֵּם אֵלָיו
  choice: 愿上帝报应他本人
  rationale: Piel形态的שׁלם可表示偿还、报偿；这里按祈愿式或命令式语气理解。加“本人”明确其与前句“他的儿子”的对比，却没有增加新的所指。
- source_word: וְיֵדָע
  choice: 好叫他知道
  rationale: ידע本义是“知道”；在此不仅指获得信息，也含亲身认识、经历之意。前接“好叫”自然表达此处可能的目的或结果关系。
theological_decisions:
- issue: 首句应译为约伯自己的陈述，还是他提出质疑的说法
  choice: 将首句译作反问，随后以“愿上帝……”表达约伯的纠正性愿望。
  alternative: 全节译作平直陈述：“上帝把他的罪孽积存起来，留给他的儿子；愿上帝报应他，使他知道。”
  rationale: 希伯来文本本身没有疑问词，因此陈述式在语法上成立；但21章的论辩脉络表明，约伯是在质疑让恶人的儿子承受后果的观念，并要求恶人本人承受报应。正文用反问呈现这一语篇功能，脚注保留平直读法。
- issue: אָוֶן在本节是指罪孽本身还是罪孽所招致的刑罚
  choice: 正文译作“罪孽”，保留词面的道德含义。
  alternative: 译作“惩罚”或“祸患”，突出报应语境中的后果。
  rationale: 该词的语义可涵盖罪恶及其所带来的祸患。上下文确有刑罚含义，但若正文直接译成“惩罚”，会消除原文保有的词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“积存起来”保留原文储留的意象；“报应他本人”突出恶人与其儿子的对比；反问号呈现篇章中的挑战语气，同时以脚注保留希伯来语可作陈述句的歧义。
