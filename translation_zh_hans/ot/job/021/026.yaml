  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: zh_hans
  text: 他们一同躺卧在尘土中，虫子[a]覆盖着他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蛆虫”。希伯来语 רִמָּה 在身体腐朽的语境中可指虫或蛆。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: 一同
  rationale: 这里强调上文所对比的两个人最终有共同的归宿；“一同”保留了希伯来语的简洁和强调，同时不额外断定二人死于同一时间。
- source_word: עַל עָפָר
  choice: 在尘土中
  rationale: 介词 עַל 通常可表示“在……上”，但在死亡和安葬语境中，现代汉语用“在尘土中”更自然，也传达归于尘土的图景。
- source_word: יִשְׁכָּבוּ
  choice: 躺卧
  rationale: 保留“躺下”的具体意象，不用“安息”等可能带入额外神学含义的表达。
- source_word: רִמָּה
  choice: 虫子
  rationale: 该词在尸体腐朽语境中可指虫或蛆；“虫子”保留较宽的词义范围，“蛆虫”作为脚注中的较具体译法。
- source_word: תְּכַסֶּה עֲלֵיהֶם
  choice: 覆在他们身上
  rationale: 既表达“覆盖”的动作，也明确保留 עֲלֵיהֶם“在他们身上”的空间关系；中文表达自然且没有增强原文程度。
theological_decisions:
- issue: 共同死亡结局的表述
  choice: 一同躺卧在尘土中
  alternative: 同样归于尘土
  rationale: 所选译法保留原文“躺卧”的死亡隐喻和“尘土”的具体意象，不把经文解释性地概括为“归于尘土”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“躺卧”“尘土”保留诗歌性的死亡图景；“虫子覆在他们身上”直白呈现腐朽意象，同时避免古奥措辞。
