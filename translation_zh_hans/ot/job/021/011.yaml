  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: zh_hans
  text: 他们让幼儿像羊群一样出去；他们的孩子跳跃。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“跳舞”或“蹦跳”。希伯来语动词表示活泼地跳跃、舞动。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: 放出去
  rationale: 此处为 שלח 的加强词干形式，表示“送出、放出”。结合孩子们自由嬉戏的场景，“放出去”自然地保留了主动释放其外出的含义。
- source_word: כַצֹּאן
  choice: 像一群羊
  rationale: צֹאן 是集合名词，泛指羊群或小型牲畜；这里的比喻着重于幼儿成群而出的画面，译作“像一群羊”符合现代汉语表达。
- source_word: עֲוִילֵיהֶם
  choice: 他们的幼儿
  rationale: עֲוִיל 指年纪很小的孩子。“幼儿”保留其幼小之意，又不局限于新生婴孩。
- source_word: יַלְדֵיהֶם
  choice: 他们的孩子
  rationale: יֶלֶד 的复数附属形式泛指孩子，与上半句“幼儿”构成近义平行。
- source_word: יְרַקֵּדוּן
  choice: 欢蹦跳跃
  rationale: רקד 表示跳跃、舞动等活泼动作；上下文描绘无忧而兴盛的生活，“欢蹦跳跃”既传达动作，也自然体现其欢快色彩，但不把它限定为正式舞蹈。
