base_translation:
  language: en
  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: zh_hans
  text: '因为恶人被留到灾祸之日[a]；

    他们被带往愤怒之日[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被留”也可译作“得以幸免”“被拦住”或“被保留”。希伯来语动词可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “被带往”也可译作“被带出来，到那日”。末尾的动词可理解为被领到或被带到那日。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前面的论述提供依据；“因为”保留其论证连接作用。
- source_word: לְיוֹם אֵיד
  choice: 到灾祸之日
  rationale: לְ与“日”连用，指向将来的特定时刻；אֵיד表示灾祸、患难或毁灭。“到灾祸之日”与“被留”搭配，清楚表达时间指向。
- source_word: יֵחָשֶׂךְ
  choice: 被留
  rationale: חשׂך的尼法勒式可表示“得以幸免”“被扣住”或“被保留”。正文选“被留”，既符合被动形式，也较能保留恶人暂未受报、留待将来之日的语境，同时以脚注注明其他可能。
- source_word: רָע
  choice: 恶人
  rationale: 此处形容词单数作名词使用，指邪恶的人。“恶人”在现代汉语中简洁自然，并可具有代表性。
- source_word: לְיוֹם עֲבָרוֹת
  choice: 往震怒之日
  rationale: עֲבָרוֹת为复数，可表达强烈、爆发性的愤怒；汉语用单数集合概念“震怒”更自然，也保留审判语气。介词结合移动动词译作“往”。
- source_word: יוּבָלוּ
  choice: 他们被带往
  rationale: יבל的霍法勒式意为“被带去、被领去、被运去”。译文保留原文由单数“恶人”转为复数动词的变化，以“他们”指同类恶人，但不进一步限定如何被带去。
theological_decisions:
- issue: 本节是否表明恶人暂时免于灾祸、留待将来的审判
  choice: 正文表达恶人被保留到将来的灾祸与震怒之日
  alternative: 恶人在灾祸之日得以幸免，或被拦阻而不遭遇那日的灾祸
  rationale: 两个“到……之日”的时间短语以及两处被动动词，较自然地指向恶人暂未受报而留待将来的日子；但动词本身容许“幸免、被扣住”等理解，因此不把另一种可能从译注中删除。
- issue: 单数“恶人”与复数“他们”的转换
  choice: 保留数的转换，译为“恶人……他们”
  alternative: 全节统一译作复数“恶人们”，或统一用单数“他”
  rationale: 原文确有单数名词性形容词与复数动词之间的转换；保留这一张力，避免替原文消除可能的集合性或泛指表达。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“灾祸之日”与“震怒之日”保持诗句的平行结构；“被留”“被带往”保留原文的被动语态和解释空间。
