base_translation:
  language: en
  yaml_path: translation/ot/job/021/018.yaml
  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: zh_hans
  text: 愿他们像风前的碎秸，又像被暴风卷走[a]的糠秕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卷走”所对应的希伯来语动词直译为“偷走”，也可译作“夺走”或“攫走”，诗意地描写突然被带走。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: 愿他们……
  rationale: 未完成式在约伯的反问语境中带有愿望式色彩；译作“愿他们”保留这种语气，不把它扁平化为事实陈述。
- source_word: כְּתֶבֶן
  choice: 像……碎秸
  rationale: תבן指脱粒后干燥的秸秆或碎草；“碎秸”既区别于糠秕，也自然呈现易被风吹散的意象。
- source_word: לִפְנֵי רוּחַ
  choice: 风前的
  rationale: 直译并保留希伯来诗歌中暴露在风力之下、被风驱散的画面。
- source_word: וּכְמֹץ
  choice: 又像……糠秕
  rationale: מֹץ指扬场时从谷粒中分离出来的轻薄糠屑；“糠秕”是准确而熟悉的中文对应。
- source_word: גְּנָבַתּוּ
  choice: 被……卷走
  rationale: 该动词本义为“偷走”，在以暴风为主语的诗性搭配中表示突然夺去或掠走；“卷走”在中文中清楚呈现风暴迅速带走糠秕的动态，字面意象列入脚注。
- source_word: סוּפָה
  choice: 暴风
  rationale: סוּפָה表示强烈的风暴或暴风；“暴风”自然准确，又不把词义收窄为特定形态的旋风。
theological_decisions:
- issue: 愿望语气与事实陈述之间的张力
  choice: 采用“愿他们”
  alternative: “他们像”或“让他们像”
  rationale: 本节承接约伯对恶人遭报之说的反问；希伯来语形式容许愿望式理解。译文保留愿望色彩，而不将其断定为已经发生的事实。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“碎秸”与“糠秕”分别对应两个不同的农业意象；句式保持平行。脚注标记置于相关意象之后，同时说明后半句动词的字面含义。
