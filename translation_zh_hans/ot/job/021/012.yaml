  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: zh_hans
  text: 他们伴着手鼓和琴放声歌唱，又随着管乐的声音欢喜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: 歌唱
  rationale: 该动词字面义为“举起、扬起”，此处没有明说宾语；结合乐器伴奏的语境，可自然理解为扬声歌唱。译作“歌唱”符合上下文，同时不增添具体歌词内容。
- source_word: תֹף
  choice: 手鼓
  rationale: 指一种手持击打的框鼓；“手鼓”是现代汉语中清楚而自然的对应词。
- source_word: כִנּוֹר
  choice: 琴
  rationale: 指古代弦乐器，具体构造难以确定；用较宽泛的“琴”避免误定为现代竖琴或里拉琴。
- source_word: עוּגָב
  choice: 箫
  rationale: 该词所指乐器并不完全确定，通常理解为管乐器；“箫”保留管乐意象，也符合庄重简洁的汉语表达。
- source_word: וְיִשְׂמְחוּ
  choice: 又……欢喜
  rationale: 准确表达动词“欢喜、欢乐”及并列关系。
- source_word: לְקוֹל
  choice: 因……声
  rationale: 介词 לְ 在此可表示伴随、响应或缘由；“因……声而欢喜”在汉语中自然，并保留其与音乐声响的关联。
