  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: zh_hans
  text: 难道有人能教导上帝知识吗？因为他审判居高者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尊高者”；也可能指天上的众灵。
    reason: 原文 רָמִים 可泛指尊高或居于高处的存在，其确切所指并不明确。
lexical_decisions:
- source_word: הַלְאֵל
  choice: 难道有人能……上帝吗
  rationale: 疑问词与介词短语构成反问；汉语补出不定主语“有人”，自然表达原文含义。“上帝”直接对应 אֵל。
- source_word: יְלַמֶּד
  choice: 教给
  rationale: למד 的 Piel 形表示“教导、传授”；“把知识教给”符合现代汉语搭配。
- source_word: דָּעַת
  choice: 知识
  rationale: 保留原文的抽象名词，且与“教给”搭配自然。
- source_word: וְהוּא
  choice: 他可是
  rationale: וְ 可直译为“而”，但此处兼有说明反问依据的语用作用；“可是”既保留转折推进，也凸显上帝本是施行审判者。
- source_word: רָמִים
  choice: 居高者
  rationale: 该阳性复数实体化形容词可指身居高位者，也可能指天上的尊高存在；“居高者”力求保留这种指向上的开放性。
- source_word: יִשְׁפּוֹט
  choice: 审判
  rationale: שפט 的 Qal 形基本义为“审判、施行判断”；此处直译即可。
theological_decisions:
- issue: רָמִים 所指的对象
  choice: 采用宽泛的“居高者”，不限定为地上的权贵或天上的众灵
  alternative: “高位者”“尊高者”或明确译作“天上的众灵”
  rationale: 希伯来语本身没有明确限定其所指。宽泛译法保留上帝高过一切尊高者并审判他们的含义，避免擅自确定其宇宙论或政治层面的指向。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“他可是……”自然呈现后半句作为反问依据的关系；脚注紧随“居高者”所在分句，以清楚标示词义歧义。
