  text: יבלו בַ/טּ֣וֹב יְמֵי/הֶ֑ם וּ֝/בְ/רֶ֗גַע שְׁא֣וֹל יֵחָֽתּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: zh_hans
  text: 他们在安逸中度过岁月，转眼间便下到舍奥勒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舍奥勒”是希伯来文 Sheol 的音译，指死者所在之境；也可译为“坟墓”、“死者之境”或“死亡”。
    reason: 说明 שְׁאוֹל 的词义范围，避免将其限定为特指受刑之处的“地狱”或中文宗教语境中的“阴间”。
lexical_decisions:
- source_word: יבלו
  choice: 度过
  rationale: 该词在此表示日子流逝、被度完；“度过”既自然，又保留了时间逐渐过去的含义。
- source_word: בַטּוֹב
  choice: 在福乐中
  rationale: טוֹב本义为“好”，在本节语境中指生活安好、富足而顺遂；“福乐”兼顾物质兴盛与安乐，不把含义限缩为财富。
- source_word: יְמֵיהֶם
  choice: 一生
  rationale: 原文直译为“他们的日子”。汉语用“一生”能自然表达他们全部在世岁月，并突出其与“转眼间”的对比。
- source_word: וּבְרֶגַע
  choice: 转眼间
  rationale: רֶגַע指极短的片刻；“转眼间”是自然的现代汉语，并清楚表现漫长安逸生活与突然死亡之间的反差。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל指死者所去之境。“阴间”是中文中较为简明且传统上可识别的对应词，又不将其直接解释为“地狱”；脚注保留希伯来词及其他可能译法。
- source_word: יֵחָתּוּ
  choice: 下到
  rationale: 结合שְׁאוֹל，本词在这里表达下到死者之境的意象。“下到”保留空间隐喻，也符合自然汉语。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓、死者之境、死亡
  rationale: 原文指向希伯来思想中的死者所在之境，并不要求读成后期教义意义上的“地狱”。正文采用“阴间”，脚注列出其他可能译法，以保留原文的概念开放性。
- issue: 恶人安享一生与突然下到阴间之间的张力
  choice: 保留陈述本身，不增添审判或安详死亡等解释
  alternative: 将“下到阴间”解释为受罚，或将“转眼间”解释为无痛死亡
  rationale: 本节只陈述他们一生福乐并迅速下到阴间；译文不补入原文没有明说的道德或末世论判断。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“福乐”比“繁荣”更贴近日常生命状态，“转眼间”清楚传达原文中一生与片刻的强烈对照。脚注标记紧随其实际说明的“阴间”。
