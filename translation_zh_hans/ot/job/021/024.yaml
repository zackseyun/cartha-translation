  text: 他的奶桶盛满了奶[a]；他骨头的骨髓也很滋润。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的乳房充满奶汁。”这里的希伯来词很少见，可能指乳房，也可能指盛奶的器具。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  choice: 他的奶器
  rationale: 此词罕见，可能指乳房，也可能指盛奶或产奶的器官、容器。“奶器”保留具体意象及词义上的不确定性，同时避免在正文中过早断定所指。
- source_word: מָלְאוּ
  choice: 盛满了
  rationale: 完成式在诗歌语境中描写一种充盈、兴旺的状态；“盛满了”自然地表达这一状态。
- source_word: חָלָב
  choice: 奶
  rationale: 按通常词义翻译，并保留象征丰足兴旺的具体形象。
- source_word: וּמֹחַ עַצְמוֹתָיו
  choice: 他骨中的髓
  rationale: 以自然中文表达“他骨头的骨髓”，保留身体强健的意象。
- source_word: יְשֻׁקֶּה
  choice: 滋润丰盈
  rationale: Pual形式表示被润泽或充分供应水分；“滋润”对应基本意象，“丰盈”使其在中文中清楚呈现旺盛充足的状态，而不将比喻硬译为骨髓被浇水。
