  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: zh_hans
  text: 另一个却心中苦楚而死，从未享受过福乐[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一个却在心灵的苦楚中死去，未曾享用美福。”希伯来文保留了以“吃”表示亲身经历人生美福的意象。
    reason: 保留原文的字面意象及נֶפֶשׁ מָרָה的另一种较形式对应译法。
lexical_decisions:
- source_word: וְ/זֶה
  choice: 另一个却
  rationale: 字面为“而这一个”。结合21:24与本节的对比，以“另一个却”自然表达两种人生境遇的鲜明对照。
- source_word: יָמוּת
  choice: 死
  rationale: 未完成式在这里描述一般性的对比情形，不必译成明确的将来时。
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: 心中苦楚
  rationale: נֶפֶשׁ מָרָה字面近于“苦涩的魂/性命”，这里指人临死时内在的痛苦状态；“心中苦楚”符合现代汉语表达，同时不将其限定为抽象的灵魂概念。
- source_word: וְ/לֹא אָכַל
  choice: 从未享受过
  rationale: אָכַל本义为“吃”，与“福乐/美福”连用时表示亲身有分、享受。正文采用自然汉语表达，脚注保留原文“吃”的意象。
- source_word: בַּ/טּוֹבָה
  choice: 福乐
  rationale: טוֹבָה可指美好、福分或顺遂。“福乐”既能涵盖生活中的美好与福分，又避免仅仅收窄为物质财富。
theological_decisions:
- issue: נֶפֶשׁ是否应明确译为“灵魂”
  choice: 译作“心中”，表达人的内在痛苦状态
  alternative: “带着苦涩的灵魂”或“在性命的苦楚中”
  rationale: 此处重点是这个人在痛苦中死去，并非对灵魂本体作教义性说明；采用汉语惯用表达可避免加入原文没有明确提出的人论界定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“另一个却”承接上节并凸显对照；“福乐”保持טוֹבָה较宽泛的含义。
