  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֤י תֹֽאמְר֗וּ אַיֵּ֥ה בֵית נָדִ֑יב וְ֝/אַיֵּ֗ה אֹ֤הֶל מִשְׁכְּנ֬וֹת רְשָׁעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
translation:
  language: zh_hans
  text: 因为你们说：“权贵[a]的家在哪里？恶人居住的帐篷[b]在哪里？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权贵”所译的希伯来词可指尊贵者、显要人物或首领，也可译作“贵族”或“首领”；这里并非只指慷慨的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“帐篷，恶人的住处（复数）”，表达较为压缩；也可理解为“帐篷，就是恶人的住处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节约伯所知道的对方意念，并引出他们所说的话；“因为”保留其解释、说明的作用。
- source_word: תֹאמְרוּ
  choice: 你们说
  rationale: 未完成式在这里表达对方一贯或当前所持的说法，现代汉语用“你们说”自然贴切。
- source_word: בֵית
  choice: 家
  rationale: בַּיִת 的基本义为房屋，也可连带表示住所或家业；此处译“家”既保留原有意象，也符合汉语问句。
- source_word: נָדִיב
  choice: 权贵
  rationale: 此词在这里指社会地位显赫、尊贵或具有首领身份的人，并非主要强调慷慨；“权贵”简洁地传达其身份意义。
- source_word: אֹהֶל
  choice: 帐篷
  rationale: 保留希伯来文的具体居住意象；虽然上下文可泛指住所，但无需将其抽象化。
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: 恶人居住的
  rationale: 原文以复数“住处”与单数“帐篷”紧密并置，句法较压缩；译成定语结构，使现代汉语通顺，同时由脚注保留原文形式上的歧义。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是实体化的复数形容词，泛指行恶或邪恶的人；“恶人”是庄重、清楚且符合《约伯记》语境的译法。
theological_decisions:
- issue: “帐篷”与“恶人的住处”之间的句法关系
  choice: 正文译为“恶人居住的帐篷”
  alternative: “帐篷，就是恶人的住处”或“恶人各处的帐篷”
  rationale: 希伯来文 אֹהֶל מִשְׁכְּנוֹת רְשָׁעִים 结构压缩，单数“帐篷”后接复数“住处”，可理解为修饰关系，也可近似同位说明。正文采用自然的汉语修饰结构，但在脚注中明确保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“权贵”传达社会身份，“帐篷”保留原文意象；两个平行问句保持约伯引述对方论点时的修辞力度。
