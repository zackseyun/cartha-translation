  text: When I remember, I am dismayed, and trembling seizes my flesh.
translation:
  language: zh_hans
  text: 我一想起这事，就惊惶不安，浑身战栗。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: 我一……就……
  rationale: 此处 אִם 在语境中可表达时间情形，不必机械译为假设性的“如果”；“一……就……”自然呈现回想与惊惶之间的紧密关系。
- source_word: זָכַרְתִּי
  choice: 想起这事
  rationale: 动词意为“记得、想起”；所想内容承接上下文，因此补出“这事”使现代汉语表达完整，但不额外限定具体所指。
- source_word: וְנִבְהָלְתִּי
  choice: 惊惶不安
  rationale: נבהל 表示受惊、惶恐或心神不宁；此译兼顾强烈惊恐与内在不安。
- source_word: וְאָחַז בְּשָׂרִי פַּלָּצוּת
  choice: 浑身战栗
  rationale: 原文直译为“战栗抓住我的肉身”；汉语以“浑身战栗”自然表达身体被恐惧震颤攫住的效果。
