  source_fidelity: “路人”在现代汉语通常指路上的行人或陌生人，未能充分表达 עֹבְרֵי דָרֶךְ 所指经常往来、可提供广泛见闻的旅人。改为“往来的旅人”更贴合原文，同时不增加解释。“记号”可保留 וְאֹתֹתָם 的含混性。
  naturalness: 原句“难道没有问过……，也不辨认……吗”可理解，但前一分句用“没有……过”，后一分句用“也不……”，否定与体貌不够平行。改作“也没有辨认”形成自然、庄重的并列反问。
  terminology: “往来的旅人”准确呈现“过路/行路者”，避免“路人”的现代语义偏移。“记号”比“标记”更自然地对应 אוֹת，且不预断其究竟指旅行者所述的证据、征象，还是其他可辨识的凭据。
  issues:
