base_translation:
  language: en
  yaml_path: translation/ot/job/021/029.yaml
  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: zh_hans
  text: 你们难道没有问过往来的旅人[a]，也没有辨认他们的记号[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“过路的人”或“旅人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“标记”或“凭据”；这里可能指旅人见闻中所显示的迹象或证据。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 难道没有……吗
  rationale: 引出期待肯定回答的反问，保留约伯责问的语气。
- source_word: שְׁאֶלְתֶּם
  choice: 问过
  rationale: 直接表达“询问、求问”，符合现代汉语习惯，也保留完成意味。
- source_word: עֹבְרֵי דָרֶךְ
  choice: 路人
  rationale: 原文直指“经过道路的人”，即往来旅行者；“路人”简洁自然，脚注补充较直译的可能表达。
- source_word: וְאֹתֹתָם
  choice: 他们的标记
  rationale: אוֹת可指记号、标志或凭据；“标记”保留具体词义，不把上下文含义过早解释成“见证”或“证据”。
- source_word: לֹא תְנַכֵּרוּ
  choice: 也不辨认
  rationale: נכר的强意词干在此可表示辨认或承认；“辨认”与“标记”自然搭配，同时保留原文可能带有“不予承认”的张力。
theological_decisions:
- issue: “标记”所指为何
  choice: 正文保留“他们的标记”
  alternative: 他们的见证／他们所提供的证据
  rationale: 经文本身没有明确说明这些标记究竟是旅行者的证言、所观察到的迹象，还是其熟知的凭据；不在正文中替作者消除这一含混。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“路人”在此按古代语境指往来道路、见闻较广的旅人，并非强调陌生旁观者。所有歧义均以正文直译和脚注说明保留。
