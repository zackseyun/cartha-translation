  text: הֵ֣ן יָ֭דַעְתִּי מַחְשְׁבֽוֹתֵי/כֶ֑ם וּ֝/מְזִמּ֗וֹת עָלַ֥/י תַּחְמֹֽסוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/027.yaml
  text: Look[a], I know your thoughts, and the schemes with which you would wrong me.
translation:
  language: zh_hans
  text: 看哪，我知道你们的想法，也知道你们用来加害我的计谋。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也知道你们针对我所谋划的计策”，或“也知道你们计划对我施暴”。原文动词可表示施暴、欺压或不公正地加害。
    reason: 保留希伯来语动词及句法关系所容许的不同理解，避免“谋害”所暗示的杀害意图。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是强调并唤起注意的语气词；“看哪”庄重而清楚，保留了原文的强调作用。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: Qal完成式第一人称单数在此表达已经形成并持续到现在的认知，现代汉语用“我知道”最自然。
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: 你们的想法
  rationale: 该词可指思想、打算或意图；“想法”贴近其基本义，敌意则由下半句显明。
- source_word: וּמְזִמּוֹת
  choice: 也知道……计谋
  rationale: 该名词在语境中带有蓄意筹划的含义；“计谋”自然传达敌对谋划，同时不额外加入原文没有明说的“邪恶”。重复“知道”符合汉语表达，也清楚呈现两个并列宾语。
- source_word: עָלַי
  choice: 加害我
  rationale: 介词短语在此表示行动针对约伯；其对抗意味与后面的动词合并译为“加害我”。
- source_word: תַּחְמֹסוּ
  choice: 用来加害
  rationale: חמס可表示施暴、欺压或不公正地伤害。此处不一定专指身体暴力，“加害”既保留伤害与不义的力度，也适合约伯所面对的敌对言论和谋划。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留智慧文学辩论中的强调语气；“加害”避免把原文的暴力性含义不必要地限定为身体攻击。
