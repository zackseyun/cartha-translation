  text: הֵ֤ן לֹ֣א בְ/יָדָ֣/ם טוּבָ֑/ם עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: zh_hans
  text: 看哪，他们的福乐并不掌握在自己手中[a]；恶人的谋算离我很远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作反问：“他们的福乐不是掌握在自己手中吗？”
    reason: 希伯来文形式可理解为否定陈述，也可按语境读作无显式疑问词的反问。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留引人注意、强调下文的语用功能；用现代读者易懂而仍庄重的表达。
- source_word: טוּבָם
  choice: 他们的福乐
  rationale: טוּב 在此指恶人所享有的好处、兴盛或福分；“福乐”既涵盖物质兴盛，也不把含义缩限为财富。
- source_word: בְיָדָם
  choice: 掌握在自己手中
  rationale: 保留“在他们手中”的意象，同时按现代汉语表达其支配、控制之意。
- source_word: עֲצַת רְשָׁעִים
  choice: 恶人的计谋
  rationale: עֵצָה 可指谋略、主意或筹划；“计谋”符合本节说话者与恶人立场切割的语境，又未额外指定具体内容。
- source_word: רָחֲקָה מֶנִּי
  choice: 离我很远
  rationale: 贴近希伯来文空间隐喻，表达约伯不认同、不参与恶人的谋算，而不将隐喻过度解释。
theological_decisions:
- issue: לֹא 所在分句应作否定陈述还是反问
  choice: 正文作否定陈述：“并不掌握在自己手中”
  alternative: 作反问：“他们的福乐不是掌握在自己手中吗？”
  rationale: 希伯来文没有显式疑问标记，且“看哪”自然引出陈述；上下文也可理解为约伯承认恶人的兴盛并非由其自身最终控制。由于无标点的辅音文本容许反问读法，故在脚注保留该真实歧义，避免以译文消除张力。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“看哪”保留原文提示语气；分号呈现两个彼此相关而又有转折张力的陈述。脚注明示句法歧义，正文不加入原文没有的因果或神学解释。
