base_translation:
  language: en
  yaml_path: translation/ot/job/021/008.yaml
  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: zh_hans
  text: 他们的后代在他们面前安稳，与他们同在；他们的子孙在他们眼前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安稳”也可译作“得以坚立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעָם
  choice: 他们的后代
  rationale: זֶרַע在这里是集合名词，指人的后裔；“后代”自然、宽泛，不限于年幼的儿女。
- source_word: נָכוֹן
  choice: 安然稳固
  rationale: 该词的被动分词形式可表示被确立、稳固或安稳；“安然稳固”保留状态含义，并符合本段恶人家道兴旺的语境。
- source_word: לִפְנֵיהֶם
  choice: 在他们面前
  rationale: 按字面保留“在……面前”的空间意象，也可表达他们亲眼见到后代安稳。
- source_word: עִמָּם
  choice: 与他们同在
  rationale: עִם直指“与……同在”，强调后代不但可见，而且仍陪伴在他们身边。
- source_word: וְצֶאֱצָאֵיהֶם
  choice: 他们的子孙
  rationale: צֶאֱצָאִים指后裔、子孙；译作“子孙”既符合现代汉语，也与前面的集合性“后代”形成自然平行。
- source_word: לְעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 保留希伯来语“在其眼前”的生动表达，表明他们能够亲眼看见。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“在他们面前”与“在他们眼前”保留原文平行意象；分号帮助呈现两个平行分句，同时避免把“与他们同在”误接到前一地点短语中。
