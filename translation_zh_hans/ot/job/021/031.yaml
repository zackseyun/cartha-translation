  text: מִֽי יַגִּ֣יד עַל פָּנָ֣י/ו דַּרְכּ֑/וֹ וְ/הֽוּא עָ֝שָׂ֗ה מִ֣י יְשַׁלֶּם לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: zh_hans
  text: 谁会当面[a]指出他的行径？他所做的事[b]，谁会报应他？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他面前”；原文直译为“在他脸上／面前”，是指直接当面对质的习语。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文十分简略，直译近似“而他做了；谁报应他？”正文按语境译出可能的意思，即“对于他所做的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁会
  rationale: 这是引出反问的疑问代词；希伯来文含有“无人”的言外之意，但正文保留问句形式，不直接改写成否定句。
- source_word: יַגִּיד
  choice: 指出
  rationale: נגד 的使役式可表示“告知、宣告、使人知道”；在当面质问恶人行径的语境中，“指出”自然地传达公开直言之意。
- source_word: עַל פָּנָיו
  choice: 当面
  rationale: 字面为“在他脸上／面前”，是表示直接在本人面前说话或对质的习语；“当面”简洁自然，并保留对峙意味。
- source_word: דַּרְכּוֹ
  choice: 他的行径
  rationale: דֶּרֶךְ 字面为“道路”，也常喻指人的行为和生活方式；此处“行径”既体现行为含义，也符合责问的语境。
- source_word: וְהוּא עָשָׂה
  choice: 他所做的事
  rationale: 原文极为简略，直译近似“而他做了”；这里采用名词化表达，呈现其作为报应根据的可能句法功能，同时用脚注保留原文的简约和歧义。
- source_word: יְשַׁלֶּם לוֹ
  choice: 报应他
  rationale: שלם 的加强式在这里表示按人的行为偿还或施以报应；“报应他”保留司法和报偿色彩，也适合本节反问语气。
theological_decisions:
- issue: 恶人是否无人追究
  choice: 保留两个反问句，不把言外之意直接写成“无人”。
  alternative: 直陈“没有人当面指出……也没有人报应他”。
  rationale: 原文以 מִי 两次发问，修辞上暗示无人敢对强势恶人当面追究；保留问句可避免把语用含义提升为无条件的神学断言。
- issue: 报应的施行者是否特指上帝
  choice: 不补出主语“上帝”。
  alternative: 译作“谁替上帝报应他”或“上帝何时报应他”。
  rationale: 原文只问“谁……”，没有明说施行报应者；补出上帝会消除原文保留的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“行径”比“道路”更清楚地表达此处对行为方式的指称；两个“谁会”维持原文反问结构。脚注标记均置于正文相应词语之后。
