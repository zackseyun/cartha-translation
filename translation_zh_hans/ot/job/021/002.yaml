base_translation:
  language: en
  yaml_path: translation/ot/job/021/002.yaml
  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: zh_hans
  text: 请你们仔细听我的话；这就算是你们给我的安慰吧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿这成为你们的安慰。”希伯来语“安慰”是复数形式。这里的“这”主要指你们认真聆听，也可宽泛地指约伯所说的话或他的发言。
    reason: 保留“安慰”的复数形式，并说明指示词的范围；正文依据上下文明确其为听众给予约伯的安慰。
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: 要仔细听
  rationale: 祈使式与同根绝对不定式连用，强化“听”的要求；现代汉语用“要仔细听”自然表达这种强调。
- source_word: מִלָּתִי
  choice: 我的话
  rationale: 该词为单数并带第一人称单数后缀；汉语“我的话”既自然，也无需机械标示单复数。
- source_word: וּתְהִי
  choice: 就以……作为……吧
  rationale: 该形式具有祈愿或请求语气；用“吧”表达约伯向众人的要求，同时保持语气自然。
- source_word: זֹאת
  choice: 此
  rationale: 指代前面的认真聆听，也可能概括他们听约伯陈述这件事；简洁的“此”保留原文指向上的紧凑与一定开放性。
- source_word: תַּנְחֻמוֹתֵיכֶם
  choice: 你们给我的安慰
  rationale: 原文直译为“你们的安慰/安慰之举”，形式为复数。上下文中，这很可能是说：他们若认真听，就算是给予约伯的安慰。汉语补出“给我的”以明确自然语义，但以脚注保留较直译的可能。
theological_decisions:
- issue: “这”所指及“你们的安慰”的关系
  choice: 理解为众人认真聆听可作为他们给予约伯的安慰
  alternative: “这”指约伯的话，而这些话成为众人的安慰
  rationale: 紧接的命令“仔细听我的话”使前一种理解更符合语境，但原文代词与所有格表达简练，存在一定歧义，因此脚注保留较直译形式。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“你们要仔细听”传达原文的强化命令；分号保留两分句间紧密的请求关系。“给我的”属于语境性补足，并以脚注呈现更贴近字面的译法。
