  text: His bull breeds and does not fail[a]; his cow calves and does not miscarry.
translation:
  language: zh_hans
  text: 他的公牛配种，从不落空[a]；他的母牛产犊，也不流产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“也不弃绝”或“也不使其不育”。这里的希伯来语动词含义不易确定；主文按照上下句的平行关系，译出公牛配种成功、没有落空的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: 他的公牛
  rationale: שׁוֹר泛指牛类；本节谈繁殖，所指是用于配种的雄牛，因此译为“公牛”比“牛”更准确。
- source_word: עִבַּר
  choice: 交配
  rationale: 此处处于牲畜繁殖语境，表示公牛配种；“交配”自然清楚，同时避免加入原文没有明说的受孕结果。
- source_word: וְלֹא יַגְעִל
  choice: 不会失败
  rationale: 此处יַגְעִל词义艰深。结合下半句顺利产犊的平行结构，主文表达配种并不落空；脚注保留“弃绝”或“使不育”等较贴近该词可能语义的译法。
- source_word: תְּפַלֵּט
  choice: 产犊
  rationale: פלט的Piel形式在这里指母牛产下幼畜；“产犊”准确、简洁，也符合现代汉语畜牧语境。
- source_word: פָּרָתוֹ
  choice: 他的母牛
  rationale: פָּרָה通常指母牛；原文并未要求限定为尚未产仔的青年母牛。
- source_word: וְלֹא תְשַׁכֵּל
  choice: 也不流产
  rationale: שׁכל的Piel形式可表达丧失或被夺去后代；在分娩语境中，“不流产”是自然且简洁的表达。
