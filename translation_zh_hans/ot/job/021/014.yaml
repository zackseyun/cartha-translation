base_translation:
  language: en
  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: zh_hans
  text: 然而，他们对上帝说[a]：“离开我们吧！你的道路，我们不愿认识。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离开”也可译作“转身离开”或“走开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 然而，他们……说
  rationale: 该动词形式在约伯的诗性论述中可表达恶人一贯的言态；结合上文恶人兴旺的语境，用“然而”体现上下文中的转折意味。
- source_word: לָאֵל
  choice: 对上帝
  rationale: אֵל在此是对神的普通称谓，而非必须音译的专名；“对上帝”自然清楚。
- source_word: סוּר מִמֶּנּוּ
  choice: 离开我们吧
  rationale: סוּר为直接命令，可指转开、离去；加“吧”符合现代汉语命令语气，同时保留对上帝直言驱离的冒犯性和力度。
- source_word: וְדַעַת
  choice: ……认识
  rationale: דַּעַת在此与“不愿”结合，指对上帝道路的认识。希伯来语的连接词保留为两个并列话语单位的关系，不明确改写为因果。
- source_word: דְּרָכֶיךָ
  choice: 你的道路
  rationale: דֶּרֶךְ复数在此可指上帝行事或要求人所行的方式；“你的道路”保留原文意象及其语义宽度。
- source_word: לֹא חָפָצְנוּ
  choice: 我们不愿
  rationale: חפץ表达愿望、喜爱或乐意；“不愿”突出意志上的拒绝，又不把含义收窄为单纯情感上的“不喜欢”或“不以为乐”。
theological_decisions:
- issue: 恶人对上帝的直接言语
  choice: 保留直接称呼和命令：“离开我们吧！”
  alternative: 意译为“别管我们”或“不要打扰我们”
  rationale: 原文是向上帝发出的直接命令。保留这种直率而强烈的拒绝，才能呈现经文中的神学张力，不以较温和的口语释义削弱它。
- issue: 两个分句之间的逻辑关系
  choice: 采用并列呈现，不补出“因为”
  alternative: “因为我们不愿认识你的道路”
  rationale: וְ本身是连接词，语境虽容许因果理解，却未将其明确标记为因果。中文用两个连续分句既自然，也保留并列与解释关系之间的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你的道路，我们不愿认识”以前置宾语保留诗歌的强调和力度；标点将两句强烈拒绝清楚呈现。
