base_translation:
  language: en
  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: zh_hans
  text: '他的怒气撕裂我，又恨我；

    他向我咬牙切齿；

    我的敌手向我磨利双眼。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “磨利双眼”是希伯来文的直译，形容带着敌意、目光锐利地盯着人；也可意译为“怒目盯着我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַפּוֹ
  choice: 他发怒
  rationale: אַף可指“鼻子”，并引申为怒气；此处表达敌意与愤怒。译作“他发怒”在现代汉语中自然，也不必另行确定主语身份。
- source_word: טָרַף
  choice: 撕裂
  rationale: 该动词常描写猛兽撕裂猎物；“撕裂”保留原诗强烈的捕食意象。
- source_word: וַיִּשְׂטְמֵנִי
  choice: 又仇恨我
  rationale: שׂטם表达仇恨、敌视；“仇恨我”直接传达其词义，不额外加入攻击行动。
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: 他向我咬牙切齿
  rationale: חָרַק与“牙齿”连用，描写因愤怒而咬牙；“向我咬牙切齿”是自然且有力度的汉语表达，并体现עָלַי所含的敌对指向。
- source_word: צָרִי
  choice: 我的敌手
  rationale: צַר指敌对者。“敌手”保留个人敌意，却不把意象限定为军事、司法或某个特定身份。
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: 向我磨利双眼
  rationale: לטש本义为磨利、磨尖；用于眼睛构成刻意突出的诗性隐喻。“磨利双眼”保留希伯来文不寻常的形象，לִי则译为“向我”，表达敌意凝视的方向。
theological_decisions:
- issue: 本节敌对主语的所指
  choice: 保留第三人称男性单数表达，并以“我的敌手”称呼，却不明说其身份。
  alternative: 明确译作上帝、某个人类仇敌，或将其解释为上帝以仇敌身份行事。
  rationale: 上下文容许读者把这些话与约伯对上帝的控诉联系起来，但本节没有在每个分句中明确重述所指。译文不替原文消解这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。分为三个短句以呈现希伯来诗句的推进；保留“撕裂”和“磨利双眼”的强烈意象，并避免把敌对者的身份解释得比原文更明确。
