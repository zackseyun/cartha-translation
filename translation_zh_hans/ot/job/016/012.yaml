  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: zh_hans
  text: 我本来安然无事，他却猛烈地撕扯我[a]；他抓住我的后颈，把我摔得粉碎；又把我立作他的靶子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “猛烈地撕扯我”所译的动词十分罕见，也可能理解为“猛烈摇撼我”“把我撕碎”或“使我战栗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: 安逸
  rationale: 表示安稳、平静而未受搅扰的状态；“安逸”自然简洁，并与随后突如其来的暴力形成鲜明对比。
- source_word: וַיְפַרְפְּרֵנִי
  choice: 猛烈地撕扯我
  rationale: 这是罕见且词义不确定的动词，语境明确指剧烈伤害。“猛烈地撕扯”保留动作感，也不把它与下一分句明确表示粉碎的动词混同；其他可能见脚注。
- source_word: וְאָחַז
  choice: 揪住
  rationale: 该动词意为抓住、紧握；与“后颈”搭配时，“揪住”自然地传达敌意和强力。
- source_word: בְּעָרְפִּי
  choice: 我的后颈
  rationale: עֹרֶף具体指颈项后部；译为“后颈”比笼统的“脖子”更准确地保存原文形象。
- source_word: וַיְפַצְפְּצֵנִי
  choice: 把我摔得粉碎
  rationale: 罕见的加强式动词表达猛烈击碎、打得粉碎；“摔得粉碎”与揪住后颈的动作连贯，并保留强烈的毁灭性意象。
- source_word: וַיְקִימֵנִי
  choice: 把我立起来
  rationale: קום的使役式表示使其站立或把其安置起来；此处译法既贴近形式，也顺接作为箭靶的比喻。
- source_word: לוֹ
  choice: 作为他的
  rationale: 代词指向施动者，表明箭靶属于或供他使用；“他的箭靶”在汉语中自然体现这一关系，而不额外解释其目的。
- source_word: לְמַטָּרָה
  choice: 箭靶
  rationale: מַטָּרָה指供射击的目标或靶子；“箭靶”清楚保留古代射击意象，比泛称“目标”更具体。
theological_decisions:
- issue: 本节连续第三人称阳性单数施动者的所指
  choice: 仅译为“他”，不在正文中点明身份
  alternative: 明确译作“上帝”，或理解为未指明的敌手
  rationale: 上下文中约伯所指隐含为上帝，但本节希伯来文本只使用第三人称动词形式和代词。保留“他”可维持原文的修辞方式和神学张力，避免加入本节未明说的身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号保留三个连续暴力动作的诗行推进；“后颈”“摔得粉碎”“箭靶”维持具体而强烈的身体与射击意象。
