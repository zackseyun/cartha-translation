  yaml_path: translation/ot/job/016/016.yaml
  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: zh_hans
  text: 我的脸因哭泣而发红；我的眼皮上满是浓重的幽暗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“死亡的阴影”。希伯来语这个词可指死亡般的阴影，也可指极深的黑暗；此处上下文较支持眼皮上浓重的幽暗，而非直接指死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: 我的脸
  rationale: 该复数形式带第一人称单数后缀，惯常作为集合性单数使用；译作“我的脸”自然、准确。
- source_word: חמרמרה
  choice: 发红
  rationale: 这是罕见动词，描写脸因强烈悲痛而出现的异常变化；结合“哭泣”，译作“发红”清楚自然，同时不过度限定具体生理状态。
- source_word: מִנִּי בֶכִי
  choice: 因哭泣
  rationale: 介词在此表示原因，“因哭泣”简洁地表达脸部变化源于哀哭；“哭泣”也保留诗歌语体。
- source_word: וְעַל עַפְעַפַּי
  choice: 我的眼皮上
  rationale: 原文明确指眼皮而非泛指眼睛；中文以“我的眼皮上”自然呈现介词结构。
- source_word: צַלְמָוֶת
  choice: 幽暗
  rationale: 该词可指极深的黑暗，也可带有死亡阴影的意象。此处“幽暗”适合描述眼皮上的沉重阴影，并保留阴森、深沉的诗意；另一可能译法见脚注。
theological_decisions:
- issue: צַלְמָוֶת 是否直接指死亡
  choice: 正文译作“幽暗”
  alternative: “死亡的阴影”
  rationale: 此处上下文首先描写哭泣后脸和眼皮的外观，因此正文采用深暗、阴郁之义；但原词可能含死亡阴影的共鸣，故以脚注保留，不将歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。分号对应两行平行结构；“笼罩着”使“眼皮上有幽暗”的意象在现代汉语中自然，同时不解释为单纯的生理黑眼圈。
