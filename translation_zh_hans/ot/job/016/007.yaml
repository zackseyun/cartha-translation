  text: אַךְ עַתָּ֥ה הֶלְאָ֑/נִי הֲ֝שִׁמּ֗וֹתָ כָּל עֲדָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
translation:
  language: zh_hans
  text: 但如今，他使我疲惫不堪[a]；你使我的全体同伴都荒凉了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使我精疲力竭”或“他使我困乏”。
    reason: lexical_alternative
  - marker: b
    text: “我的全体同伴”直译可作“我的整个集会”或“我的全体会众”；这里可能指约伯的同伴圈子或家中相聚的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 但
  rationale: 该词可表示强调或转折。此处约伯从一般陈述转到眼前的苦况，用“但”自然地表现话语转折，同时不加入限制性的含义。
- source_word: עַתָּה
  choice: 如今
  rationale: 表示约伯当前的处境；“如今”既保留时间上的即时性，也符合庄重而自然的哀诉语气。
- source_word: הֶלְאָנִי
  choice: 他使我疲惫不堪
  rationale: 源自动词 לאה，意为使人疲倦、困乏。原文主语是隐含的第三人称阳性单数，因此保留“他”，不直接断定为“你”或明说是上帝。
- source_word: הֲשִׁמּוֹתָ
  choice: 你使……都凋零了
  rationale: 源自 שמם 的使役义，表示使之荒凉、毁坏。对人群而言，“凋零”比“使荒凉”更自然，同时保留强烈的摧残意象；第二人称单数“你”也明确保留。
- source_word: כָּל
  choice: 所有的……都
  rationale: 用前后呼应的汉语结构表达原文涵盖全体的意义。
- source_word: עֲדָתִי
  choice: 我身边所有的人
  rationale: עֵדָה 可指集会、会众或共同聚集的一群人。此处采用自然的现代汉语，指约伯所属或围绕他的整体人群，但不具体限定为家人、宗教会众或某一种正式团体。
theological_decisions:
- issue: 两个动词之间的人称转换
  choice: 保留“他使我……；你使……”的转换
  alternative: 将两处统一译为“你”，或统一译为“他”
  rationale: 马所拉文本先用第三人称阳性单数，随后转为第二人称阳性单数。这可能反映约伯从谈论上帝转为直接向上帝说话。译文不将这种真实的语法张力悄然抹平。
- issue: עֲדָתִי 所指的群体
  choice: 译作“我身边所有的人”，不进一步限定
  alternative: 译作“我的全家”“我的会众”或“我的同伴”
  rationale: 上下文可能涉及约伯的家人、同伴或围绕他的整个群体，但词本身不足以唯一确定。正文采用涵盖性表达，脚注保留其他词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的哀诉语体。“疲惫不堪”自然表达约伯所受的耗损；“凋零”使 שמם 的荒废、毁坏意象适用于人群。正文保留原文从“他”转为“你”的突变，脚注标记均在正文对应位置出现。
