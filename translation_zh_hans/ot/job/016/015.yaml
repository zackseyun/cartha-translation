  yaml_path: translation/ot/job/016/015.yaml
  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: zh_hans
  text: 我把粗麻布缝在皮肤上，又把我的角[b]压入尘土中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把我的角抛在尘土中”或“使我的角在尘土中蒙污”。这里的希伯来语动词较难确定，确切含义不明。
    reason: lexical_alternative
  - marker: b
    text: “角”是希伯来语中的比喻，可象征力量、尊荣或高举的地位。
    reason: cultural_note
lexical_decisions:
- source_word: שַׂק
  choice: 粗麻布
  rationale: 指哀悼时所用的粗糙麻织物；译作“粗麻布”既保留材质，也适合“缝在皮肤上”的具体语境。
- source_word: תָּפַרְתִּי
  choice: 我把……缝在
  rationale: 该词是 תפר 的 Qal 完成式第一人称单数，意为“缝、缝合”；汉语用“把”字句自然呈现已经完成而造成当前状态的动作。
- source_word: עֲלֵי
  choice: 在……上
  rationale: 这里表示将麻布覆在皮肤之上；“缝在皮肤上”是现代汉语中自然且贴近原意的表达。
- source_word: גִלְדִּי
  choice: 我的皮肤
  rationale: גֶּלֶד 指皮肤或表皮；“皮肤”比“身体”精确，也避免“兽皮”一类不必要的联想。
- source_word: וְעֹלַלְתִּי
  choice: 又把……按进
  rationale: 该动词在本节中的确切含义困难，语境大致指使“角”降卑、进入尘土。“按进”保留具体动作和受辱意象，同时以脚注说明其他可能。
- source_word: בֶעָפָר
  choice: 进尘土
  rationale: 介词本可表示“在尘土中”，但与带有动作或结果意味的动词连用时，汉语译作“进尘土”较自然，也呈现由高至低的羞辱图景。
- source_word: קַרְנִי
  choice: 我的角
  rationale: 保留希伯来文的具体诗歌意象；“角”在这里象征力量、尊荣或高举，不宜在正文中只取其中一种抽象解释。
theological_decisions:
- issue: “角”的象征意象
  choice: 正文保留“我的角”
  alternative: 我的力量；我的尊荣
  rationale: 原文以具体形象表达约伯遭受的降卑。直译“角”保留诗歌张力，不把其丰富象征意义局限为单一解释；脚注帮助现代读者理解。
- issue: וְעֹלַלְתִּי 的不确定含义
  choice: 译为具体的向下动作“按进”
  alternative: 使……蒙污；把……摔倒；把……插进
  rationale: 这个动词的准确语义有争议。正文采用与“尘土”及哀悼场景相称的具体动作，但不在译文中断言它专指玷污或某种固定姿势，并用脚注保留其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“粗麻布”明确哀悼材料，用“缝在皮肤上”保留约伯痛苦的身体意象；正文保留“角”的陌生诗歌形象，并通过脚注解释其文化含义及动词的不确定性。
