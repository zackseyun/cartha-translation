  text: He breaks through me with breach upon breach[b][a]; he rushes at me like a warrior.
translation:
  language: zh_hans
  text: 他一次又一次地攻破我[a]；他像勇士[b]一样向我冲来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“他冲破我，破口又破口。”希伯来文重复“破口”，表达接连不断的冲击。
    reason: lexical_alternative
  - marker: b
    text: “勇士”也可译作“战士”或“大能者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: 把我攻破
  rationale: פרץ的Qal形式带第一人称单数宾语后缀，描绘以猛烈之势破开、攻破约伯；“把我攻破”在中文中自然，并保留攻城破口般的暴力意象。
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: 一次又一次
  rationale: 原文以同一名词重复，字面近于“破口叠着破口”，表达接连不断的攻击。正文采用自然的现代汉语表达其连续性，脚注保留更贴近希伯来意象的译法。
- source_word: יָרֻץ עָלַי
  choice: 向我冲来
  rationale: רוץ本义为“跑”，此处结合敌对行动语境，表示迅猛逼近；“冲来”准确传达速度和攻击性。
- source_word: כְגִבּוֹר
  choice: 像勇士一样
  rationale: גִּבּוֹר可指勇士、战士或大能者；此处与冲向敌人的动作相连，“勇士”既保留军事意象，也符合庄重自然的中文。
theological_decisions:
- issue: 攻击者的身份
  choice: 沿用上下文中的第三人称“他”，本节不明说身份
  alternative: 直接译作“上帝”
  rationale: 希伯来文本本节仅用第三人称动词，并未出现“上帝”一词；为避免把上下文推定写入本节正文，保留原文的指代形式。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。“一次又一次”使连续受击的含义清楚自然；脚注补足原文“破口叠着破口”的重复和攻城意象。两个脚注标记均紧随其所说明的正文措辞。
