  yaml_path: translation/ot/job/016/010.yaml
  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
translation:
  language: zh_hans
  text: 他们向我张开大口；他们带着羞辱击打我的脸颊；他们一同集结来攻击我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译为“他们一同聚拢来攻击我”，或较字面地译为“他们一同充满（敌意）来攻击我”。原文最后一个动词的用法罕见而难解；按上下文，整体似指敌对者一致集结来攻击约伯。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּעֲרוּ עָלַי בְּפִיהֶם
  choice: 他们张大嘴攻击我
  rationale: 保留“张大嘴”的鲜明意象；介词 עַל 在敌对语境中译为“攻击”，自然表达针对约伯的敌意。希伯来语“用他们的口”按现代汉语习惯译为“嘴”。
- source_word: בְּחֶרְפָּה
  choice: 羞辱地
  rationale: חֶרְפָּה 可指羞辱、辱骂或耻辱；副词化处理使汉语流畅，同时保留行为所带的侮辱性质。
- source_word: הִכּוּ לְחָיָי
  choice: 打我的脸颊
  rationale: נכה 表示击打，לְחִי 指脸颊或腮帮；“打我的脸颊”清楚保留带有公开羞辱意味的身体攻击。
- source_word: יַחַד עָלַי יִתְמַלָּאוּן
  choice: 他们一同聚集起来攻击我
  rationale: יַחַד 表示共同一致；יִתְמַלָּאוּן 是 מלא 的反身词形，在此用法罕见且含义困难。结合敌对语境，译作“聚集起来”表达众人合力逼迫约伯，同时以脚注保留其他可能。
theological_decisions:
- issue: 末句罕见动词是否描述集结、充满或势力壮大
  choice: 正文采用“聚集起来”
  alternative: “聚拢攻击我”或“满怀敌意地攻击我”
  rationale: 上下文明确描写众敌一致攻击，但该动词的具体习语含义并不确定；正文采用最符合语境且不过度解释的表达，并在脚注注明歧义，不赋予额外神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。三个分句保持希伯来诗句连续增强的攻击意象；“攻击我”适度重复，以清楚呈现两处 עָלַי。脚注标记置于相关的末句之后。
