base_translation:
  language: en
  yaml_path: translation/ot/job/016/005.yaml
  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
translation:
  language: zh_hans
  text: 我本可以用口中的话使你们振作；我嘴唇的慰藉[a]也可以减轻你们的痛苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慰藉”或译“动作、摆动”。希伯来语 נִיד 可以指嘴唇表示同情或安慰的动作，也可能泛指嘴唇的移动或所说的话。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文直译为“我嘴唇的慰藉也可以抑制”，没有明说所抑制的对象；“你们的痛苦”是按上下文补出的。
    reason: implicit_object
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  choice: 我本可以……使你们振作
  rationale: 该词是 אמץ 的加强语态，带第二人称复数宾语，意为“使你们坚强、使你们振作”。结合上一节角色互换的假设语境，用“本可以”自然表达这种反事实或假设意味。
- source_word: בְּמוֹ פִי
  choice: 用口中的话
  rationale: 直译为“用我的口”。这里“口”是说话的工具；补出“话”使现代汉语自然，同时保留“口”这一具体意象。
- source_word: נִיד שְׂפָתַי
  choice: 我嘴唇的慰藉
  rationale: נִיד 可指摆动、点动，也可在哀伤语境中指表示同情或安慰的动作或话语。与“嘴唇”连用时，“慰藉”较符合本节安慰人的语境；脚注保留“动作/摆动”的可能。
- source_word: יַחְשֹׂךְ
  choice: 可以减轻
  rationale: חשׂך 的基本义为“扣住、阻止、抑制、免去”。在痛苦语境中译作“减轻”符合自然汉语，但不把作用夸大为完全消除。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“使你们振作”比生硬的“使你们刚强”更符合安慰受苦者的语境；分号保留上下两行诗句的平行结构。所有补足和词义歧义均以脚注明示。
