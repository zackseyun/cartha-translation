  text: I have heard many such things[a]; all of you are miserable comforters.
translation:
  language: zh_hans
  text: 我听过许多这样的话；你们全都是叫人痛苦的安慰者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “叫人痛苦的安慰者”较直译可作“患难的安慰者”；也可理解为“带来患难的安慰者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: 我听过
  rationale: 这是שׁמע的Qal完成式第一人称单数；“听过”自然表达过去累积至今的经历。
- source_word: כְאֵלֶּה רַבּוֹת
  choice: 这样的话……许多
  rationale: 介词כ与指示词אֵלֶּה构成“像这些、这样的”之意，רַבּוֹת表示数量多；结合言语语境译作“这样的话，我听过许多”。
- source_word: מְנַחֲמֵי
  choice: 安慰者
  rationale: 这是נחם的分词复数构造形，作名词用；保留“安慰者”可呈现约伯针对朋友自称安慰却适得其反的讽刺。
- source_word: עָמָל
  choice: 叫人痛苦的
  rationale: עָמָל可指劳苦、患难、痛苦；在构造短语מְנַחֲמֵי עָמָל中关系略有含混，正文用自然中文表达这些安慰者带来痛苦，脚注保留较形式对应的其他理解。
- source_word: כֻּלְּכֶם
  choice: 你们全都
  rationale: 明确保留第二人称复数及整体范围，表示约伯把在场的朋友全包括在内。
