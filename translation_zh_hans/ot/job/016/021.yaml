base_translation:
  language: en
  yaml_path: translation/ot/job/016/021.yaml
  text: that he would arbitrate for a man with God[c][b][a], as a son of man does for his neighbor.
translation:
  language: zh_hans
  text: 愿他为人与上帝申辩[a]，如同人为他的朋友申辩[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他为人与上帝辩论案件。”希伯来语动词可指裁断、仲裁、申辩或辩论案件。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面作“人的儿子”，这里指一个人，并不一定是弥赛亚称号。
    reason: lexical_alternative
  - marker: c
    text: “朋友”或译“同伴”或“邻舍”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: 愿他……申辩
  rationale: יכח 的使役式在这里带有法律语境，可指裁断、仲裁或申辩。结合 לְגֶבֶר 的受益含义，译作“为……申辩”自然地表达代人陈明案件之意，同时用脚注保留“仲裁”等可能。
- source_word: לְגֶבֶר
  choice: 为人
  rationale: גֶּבֶר 可特指男子，但此处与“世人”平行，泛指作为诉讼一方的人；介词 לְ 表示行动所为的对象，故译“为人”。
- source_word: עִם אֱלוֹהַּ
  choice: 在上帝面前
  rationale: עִם 基本义是“与”，在申辩的法律语境中表示面对上帝、与上帝交涉。汉语“在上帝面前申辩”既通顺，也不把此人明确塑造成对双方保持中立的仲裁者。
- source_word: וּבֶן אָדָם
  choice: 如同世人
  rationale: בֶּן־אָדָם 字面为“人的儿子”，在此是“人、世人”的希伯来习语，并与 גֶּבֶר 构成诗歌平行。补出比较关系“如同”，使省略的希伯来句法在现代汉语中清楚自然。
- source_word: לְרֵעֵהוּ
  choice: 为同伴
  rationale: רֵעַ 可指同伴、朋友或邻舍；“同伴”在此较宽泛，并保留 לְ 与前半句“为人”的平行结构。
theological_decisions:
- issue: “人子”（בֶּן־אָדָם）是否应理解为弥赛亚称号
  choice: 按上下文译为普通人类意义的“世人”，并在脚注注明字面形式。
  alternative: 直译为“人子”，或将其视为特定弥赛亚称号。
  rationale: 此处该词组是常见的希伯来语人类称谓，与 גֶּבֶר 平行；上下文没有要求把它当作专有称号。译作“世人”可避免无根据地引入后来的称号含义。
- issue: 申辩者是中立仲裁者还是代表人向上帝陈情
  choice: 正文采用“为人在上帝面前申辩”，保留代表人的受益关系。
  alternative: 译作“在人与上帝之间仲裁”，明确塑造居中的调解者。
  rationale: לְגֶבֶר 与 לְרֵעֵהוּ 形成平行，较自然地表示为某人行事；עִם 则表示与上帝交涉。正文不将这一关系改写为对称、中立的双方仲裁。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“申辩”保留法律色彩；“世人”自然表达希伯来习语，并借脚注保留其字面形式。两处“为……申辩”刻意呈现原文的平行结构。
