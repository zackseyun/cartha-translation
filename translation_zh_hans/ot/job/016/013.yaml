  text: יָ֘סֹ֤בּוּ עָלַ֨/י רַבָּ֗י/ו יְפַלַּ֣ח כִּ֭לְיוֹתַ/י וְ/לֹ֣א יַחְמ֑וֹל יִשְׁפֹּ֥ךְ לָ֝/אָ֗רֶץ מְרֵרָֽתִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: zh_hans
  text: 他的弓箭手围住我[a]；他劈开我的肾脏[b]，毫不顾惜；他把我的胆汁倾倒在地上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的大能者”或“他的首领”。这里的希伯来语形式较难确定；“弓箭手”符合本节和上下文的攻击意象。
    reason: alternative_reading
  - marker: b
    text: 希伯来语直译“我的肾脏”。在希伯来表达中，肾脏既是人体内脏，也可引申指人的内在深处。
    reason: cultural_note
  - marker: c
    text: 或译“我的胆”；也有人按比喻义理解为“我的苦楚”，但具体的身体含义更符合本节暴烈的受创图景。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: 围住
  rationale: 该词是סבב的Qal未完成式复数，在这里描写敌对攻击；“围住”自然、清楚，并保留军事性的包围意象。
- source_word: רַבָּיו
  choice: 他的弓箭手
  rationale: 这个希伯来语形式较难确定，也可理解为“他的大能者”或“他的首领”；但“弓箭手”最切合本节及上下文中射击、穿裂身体的攻击图景。
- source_word: יְפַלַּח
  choice: 劈开
  rationale: פלח的Piel形式在此表达猛烈地剖裂身体；“劈开”既保留动作的暴烈程度，也符合现代汉语表达。
- source_word: כִּלְיוֹתַי
  choice: 我的肾脏
  rationale: 该词具体指肾脏；正文保留原文的身体器官，而不直接抽象化为“内心”或“肺腑”。
- source_word: לֹא יַחְמוֹל
  choice: 毫不顾惜
  rationale: חמל在暴力或审判语境中表示怜惜、宽容；“毫不顾惜”简洁地保留原文未明说宾语的表达。
- source_word: יִשְׁפֹּךְ
  choice: 倾倒
  rationale: שפך通常表示倒出、倾倒；这里与胆汁及地面搭配，保留鲜明的身体受创图景。
- source_word: מְרֵרָתִי
  choice: 我的胆汁
  rationale: 该词可具体指胆汁，也与“苦”相关；本节连续描写器官被剖开，具体的身体含义更符合语境。
theological_decisions:
- issue: 诗歌性苦难描写中的人体意象
  choice: 正文保留“肾脏”和“胆汁”这些具体器官用语。
  alternative: 译作“肺腑”“内心”或“苦楚”等抽象表达。
  rationale: 约伯以强烈、具体的身体受创图景描述苦难。保留解剖性意象能够传达希伯来诗歌的力度，也避免把可能兼具象征意味的语言直接解释成某一种抽象含义。
- issue: 攻击者与上帝之间的主语转换
  choice: 先译复数的“他的弓箭手”，随后保留单数“他”作为动作主体。
  alternative: 把后续动作都改写成弓箭手所为，或把“弓箭手”改译为单数攻击者。
  rationale: 原文先用复数动词描写包围，随后用单数动词描写劈开、顾惜和倾倒。译文保留这一转换，不替原文消除其诗歌性的主语张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“围住—劈开—倾倒”形成连续而有力的动作。“肾脏”“胆汁”刻意保留原文具体、强烈的人体意象；标点体现希伯来诗句的推进关系。
