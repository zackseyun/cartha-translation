base_translation:
  language: en
  yaml_path: translation/ot/job/016/011.yaml
  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: zh_hans
  text: 上帝把我交给不义之人[a]，把我抛入恶人手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“悖逆之人”或“不敬虔的人”。
    reason: lexical_alternative
  - marker: b
    text: 末句的动词含义不确定；大概是“扔、抛”的意思，也可能译作“使我落入恶人的权势之下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: 把我交给
  rationale: 这是סגר的使役式，在本句表示把某人交出去，使其落入别人的权势之下；“把我交给”在现代汉语中自然，也保留了敌意处境中的移交含义。
- source_word: אֵל
  choice: 上帝
  rationale: 此处אֵל是对上帝的称呼；上下文中约伯所控诉的是上帝亲自把他交在敌对者手中。
- source_word: אֶל
  choice: 给
  rationale: 该介词表示移交所指向的对象，其意义自然融入“把我交给”这一汉语结构。
- source_word: עֲוִיל
  choice: 不义之人
  rationale: 该词指道德上悖谬、不正的人，并非单指智力愚昧；“不义之人”保留其伦理意味，同时避免把宗教意义强化得超出词义。
- source_word: וְעַל יְדֵי
  choice: 又……到……手中
  rationale: “手中”在这里表示处于某人的权势或控制之下；这一汉语惯用表达既保留原文意象，也与前半句形成平行。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: רְשָׁעִים指以邪恶、不正为特征的人；“恶人”简洁自然，也是现代汉语圣经语境中清楚易懂的道德类别。
- source_word: יִרְטֵנִי
  choice: 把我扔到
  rationale: 这是一个含义困难的罕见动词，语境大概表达猛烈投掷或使人落入敌手。“扔到”保留动作力度，但以脚注注明不确定性。
theological_decisions:
- issue: אֵל的所指
  choice: 说话者指明是上帝把他交给不义之人
  alternative: 把אֵל理解为泛指的“大能者”
  rationale: 《约伯记》中אֵל常指上帝，本节也延续约伯直接控诉上帝使他落入敌对势力的语境；这是上下文判断，并非额外加入的教义解释。
- issue: 上帝与恶人行动的关系
  choice: 保留原文中上帝主动交付、抛扔的强烈说法
  alternative: 弱化为上帝仅仅容许约伯落入恶人手中
  rationale: 希伯来文以主动动词描述上帝的作为。译文不把它改写为单纯的许可，以保留约伯话语中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交给……手中”保留权势转移的意象；“扔到”传达末句可能具有的猛烈动作，同时由脚注诚实呈现该罕见动词的词义不确定性。
