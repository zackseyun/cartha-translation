  text: אֶ֭רֶץ אַל תְּכַסִּ֣י דָמִ֑/י וְֽ/אַל יְהִ֥י מָ֝ק֗וֹם לְ/זַעֲקָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: zh_hans
  text: 大地啊[a]，不要遮盖我的血[b][c]；不要让我的呼喊有安歇之处[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”。这里原文用直接呼告的形式。
    reason: lexical_alternative
  - marker: b
    text: “我的血”按原文直译；按语境也可理解为“我所流的血”，尤指无辜流出的血。
    reason: lexical_alternative
  - marker: c
    text: 这幅图景令人想起血从地里呼求公义；参创世记4:10。
    reason: cross_reference
  - marker: d
    text: “呼喊”也可译作“哀号”或“呼求”；这个词既可表示痛苦中的呼声，也可含求助、申冤之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: 大地啊
  rationale: 此处后接阴性单数第二人称动词，表明“大地”受到直接呼唤。“大地”比“土地”更符合这首诗广阔而庄严的呼告语气；句末“啊”自然呈现现代汉语中的呼格。
- source_word: אַל תְּכַסִּי
  choice: 不要遮盖
  rationale: אַל与未完成式动词在这里表达强烈的禁止或否定愿望。“遮盖”保留כסה的具体意象，也不明说其所隐含的掩藏罪证或阻止申冤之意。
- source_word: דָמִי
  choice: 我的血
  rationale: 原文直译为“我的血”。语境可指无辜流出的血，但正文保留具体措辞及其诗意、司法双重含义，不改写为较具解释性的“我所流的血”。
- source_word: וְאַל יְהִי
  choice: 不要让……有
  rationale: 这里是与上一分句并列的第二个否定愿望。译为“不要让……有”既自然，也保留祈使或愿望式的力度。
- source_word: מָקוֹם
  choice: 安歇之处
  rationale: מָקוֹם本义为“地方、处所”；结合呼喊不得停息、沉寂的语境，译作“安歇之处”传达其语境意义，同时仍保持诗歌意象。
- source_word: לְזַעֲקָתִי
  choice: 我的呼喊
  rationale: זְעָקָה可指痛苦中的呼喊，也常含求助或申冤意味。“呼喊”自然、凝练，并保留是哀号还是司法诉求的张力。
theological_decisions:
- issue: 无辜之血从地里呼求公义的意象
  choice: 正文保留“我的血”和“我的呼喊”两个具体意象，不把二者明释为申冤。
  alternative: 译为“我所流的血”或“我的申冤呼声”，突出司法含义。
  rationale: 本节很可能唤起创世记4:10中血从地里发声的主题，但希伯来文本仍让“血”、痛苦的呼喊和对公义的诉求彼此交叠。正文不消解这种神学与诗意张力。
- issue: מָקוֹם在本节中的语境含义
  choice: 译为“安歇之处”，表达呼喊不应停息或被平息。
  alternative: 直译为“地方”，即“不要让我的呼喊有地方”。
  rationale: 单译“地方”在现代汉语中意义不够清楚；“安歇之处”依据上下文说明其功能，却没有明确指定呼喊为何或如何被压制。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以“大地啊”保留呼告力度；两个“不要”形成平行结构。“安歇之处”比生硬的“地方”更符合汉语表达，也呈现呼声不可停息的意象。所有解释性信息均置于脚注，正文保留原文的简洁和歧义。
