base_translation:
  language: en
  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: zh_hans
  text: 因为再过不多几年[a]，我就要走上那条一去不返的路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“有数的年岁”，意思是年数不多、十分有限。
    reason: lexical_alternative
  - marker: b
    text: 也可按原文语序译作“我将走上一条不再返回的路”。这里指走向死亡、无法回头的行程。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明约伯为何急切求天上的见证者为他申辩，保留原文的因果关系。
- source_word: שְׁנוֹת מִסְפָּר
  choice: 再过不多几年
  rationale: 原文直译为“有数的年岁”，指为数不多、有限的年日；此译在现代汉语中自然表达余日短少的意思。
- source_word: יֶאֱתָיוּ
  choice: 再过……几年
  rationale: 原义是“将来到”。汉语不常说“几年将来到”，故以时间结构“再过……几年”自然传达这些年即将来临并结束的语境含义。
- source_word: וְאֹרַח
  choice: 就要走上……路
  rationale: אֹרַח 指道路、路径；此处以道路比喻走向死亡的历程。“走上……路”保留了原文的具体意象。
- source_word: לֹא אָשׁוּב
  choice: 一去不返
  rationale: 原文为“我不再返回”。“一去不返”简洁自然，并清楚表达这段行程不可逆转。
- source_word: אֶהֱלֹךְ
  choice: 我就要走上
  rationale: 该未完成式在语境中指即将发生的行动；“就要”体现迫近感，“走上”则与“路”的意象自然搭配。
theological_decisions:
- issue: “一去不返的路”所指为何
  choice: 正文保留道路隐喻，脚注说明语境中指死亡
  alternative: 直接译为“我就要死去”
  rationale: 原文没有直接使用“死亡”一词；保留隐喻可避免将语境推断替代原文措辞，同时脚注帮助普通读者理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“再过不多几年”避免生硬直译“有数的年岁将来到”；“一去不返的路”保留希伯来文的道路隐喻和诗性，同时不额外引入特定宗派的死后观。
