  text: 这些如风的空话难道没完没了吗？还是什么促使你回答呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲקֵץ
  choice: 难道没完没了吗
  rationale: קֵץ意为“尽头、终止”。疑问词הֲ在语境中构成带有不满语气的反问；译为“难道没完没了吗”自然传达约伯的厌烦。
- source_word: לְדִבְרֵי רוּחַ
  choice: 空洞如风的话
  rationale: 原文直译为“风的话”。这里比喻言语空洞、没有实质；“空洞如风”既保留“风”的意象，又让现代汉语读者易于理解。
- source_word: אוֹ
  choice: 究竟
  rationale: אוֹ本为选择连词“或”。在相连的两个反问句中，汉语用“究竟”承接第二问更自然，也不改变其转入另一问题的功能。
- source_word: מַה
  choice: 是什么
  rationale: 保留疑问代词“什么”的直接意义，询问促使对方回答的原因或动力。
- source_word: יַמְרִיצְךָ
  choice: 激使你
  rationale: מרץ的Hiphil形式在此可指激动、驱使或使人有胆量。“激使”保留其推动对方作答的含义，并以脚注列出“壮你的胆”这一可能理解。
- source_word: כִּי
  choice: 这样
  rationale: כִּי在此连接推动因素与“回答”这一结果或表现。中文以“这样回答”自然表达上下文中的责问语气，而不强行限定为单纯的因果关系。
- source_word: תַעֲנֶה
  choice: 回答
  rationale: ענה的Qal形式通常意为“回答、回应”；此处采用常用而庄重的“回答”。
