  text: although there is no violence in my hands[b][a], and my prayer is pure.
translation:
  language: zh_hans
  text: 虽然[a]我手中没有暴行，我的祷告也是纯洁的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我手中没有暴行。”希伯来语介词在这里可有不同理解；正文依上下文采用让步义。
    reason: lexical_alternative
  - marker: b
    text: “纯洁的”或译“洁净的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: 虽然
  rationale: עַל在此处的具体语义有歧义；结合约伯在苦难中申明无辜的上下文，正文采用让步义“虽然”，同时以脚注保留因由义的可能。
- source_word: לֹא חָמָס בְּכַפָּי
  choice: 我手中没有暴行
  rationale: 保留希伯来文“手中”的具体意象，表达约伯否认自己以行动犯下暴力或严重恶行；“暴行”既贴近חָמָס，也不把范围缩窄为单一次身体攻击。
- source_word: וּתְפִלָּתִי
  choice: 我的祷告也
  rationale: תְּפִלָּה通常指向神的祷告；וּ在这里连接两个并列的申明，汉语用“也”自然呈现其关系。
- source_word: זַכָּה
  choice: 纯洁的
  rationale: 该词表示洁净、纯净；“纯洁”与“祷告”搭配自然，并保留道德与敬拜层面的含义，而不扩张为绝对无罪。
theological_decisions:
- issue: 约伯对自身无辜的申明
  choice: 按本节直接范围译为“我手中没有暴行，我的祷告也是纯洁的”
  alternative: 将其理解为约伯宣称自己在一切方面完全无罪，或仅指礼仪上的洁净
  rationale: 经文针对约伯是否以暴行招致苦难，并评价其祷告的纯正；译文保留这一强烈自辩及其神学张力，不把它解释为绝对无罪，也不把它限缩为礼仪状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“手中没有暴行”保留原文的身体意象；“祷告也是纯洁的”使并列结构在汉语中清楚自然。
