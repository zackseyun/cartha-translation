  yaml_path: translation/ot/job/016/006.yaml
  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
translation:
  language: zh_hans
  text: 我若说话，我的痛苦并不减轻；我若住口，又有什么会从我身上离去呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的痛苦又有多少会离开我呢？”希伯来文十分简略，所省略的对象可能是“我的痛苦”。
    reason: 保留原文末句的省略性，并说明其可能隐含的所指。
lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: 我若说话
  rationale: אִם引出条件句；אֲדַבְּרָה在此条件结构中自然译为“说话”，不额外加入意愿或假设语气。
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: 我的痛苦并不减轻
  rationale: יֵחָשֵׂךְ是חשׂך的尼法勒式，基本意象为“被抑制、被扣住”；与“痛苦”搭配时，“不减轻”自然表达痛苦未受抑制、未获缓解的语境含义。כְּאֵבִי保留宽泛的“我的痛苦”，不限定为身体疼痛或内心悲伤。
- source_word: וְאַחְדְּלָה
  choice: 我若住口
  rationale: חדל表示停止、作罢；与前句“说话”平行，语境所指是停止说话。“住口”简洁自然，并保留原文未重复“说话”的凝练。
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: 又有什么会从我身上离去呢？
  rationale: הלך与מן连用可表示“从……离去”。原句省略所指对象，可能暗指痛苦；译文保留“有什么”的省略与反问力度，不擅自补明。
theological_decisions: []
