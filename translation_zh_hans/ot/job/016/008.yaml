  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: zh_hans
  text: 你使我皱缩，这就成了见证；我的消瘦起来反对我，当面回答我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: 你使我皱缩
  rationale: 该动词表达挤压、皱缩或使干瘪；“使我皱缩”保留身体遭摧残的鲜明意象，也不把含义过度具体化为某一种病状。
- source_word: לְעֵד הָיָה
  choice: 这就成了见证
  rationale: 按希伯来语保留单数代词所指的含混性；可回指约伯被皱缩的事实或状态。
- source_word: כַחֲשִׁי
  choice: 我的消瘦
  rationale: 此处名词在语境中最自然地指身体的瘦损、憔悴；同时承认该词与“否认、虚假”相关，文本可能含有语义张力。
- source_word: בְּפָנַי יַעֲנֶה
  choice: 当面作证
  rationale: ענה可指回答，也可在法律语境中指作证；与前文“见证”和“指控”相呼应，译作“作证”更符合本句的拟人化法庭意象。
theological_decisions:
- issue: 苦难是否被解释为约伯有罪的确证
  choice: 保留约伯身体的消瘦仿佛成为控告他的见证这一说法，不断言该控告真实有效
  alternative: 译成“证明我有罪”
  rationale: 原文描写苦难外貌如何起来作证，却没有在本节裁定约伯确实有罪；避免把控告等同于神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的汉语；以“皱缩—见证—指控—作证”保留原文强烈的身体意象和法庭意象。
