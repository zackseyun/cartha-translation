  text: גַּ֤ם אָנֹכִי֮ כָּ/כֶ֪ם אֲדַ֫בֵּ֥רָה ל֤וּ יֵ֪שׁ נַפְשְׁ/כֶ֡ם תַּ֤חַת נַפְשִׁ֗/י אַחְבִּ֣ירָה עֲלֵי/כֶ֣ם בְּ/מִלִּ֑ים וְ/אָנִ֥יעָה עֲ֝לֵי/כֶ֗ם בְּמ֣וֹ רֹאשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: zh_hans
  text: 我也能像你们一样说话；如果你们处在我的位置，我也能堆砌言辞来攻击你们，并向你们摇头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: 我也
  rationale: 保留说话者强调自己也能以同样方式回应的语气。
- source_word: כָכֶם אֲדַבֵּרָה
  choice: 能像你们一样说话
  rationale: 结合后面的假设条件，将动词表达为潜在能力；“像你们一样”保留对朋友说话方式的比较。
- source_word: לוּ
  choice: 要是
  rationale: 自然地引出与现实相反或纯属假设的条件。
- source_word: יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: 你们换到我的处境
  rationale: נֶפֶשׁ在这里指生命、自我或整个人；中文若逐字重复“性命”会生硬，因此以自然的换位表达传达两方处境对调，并用脚注保留词义范围。
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: 组织言辞攻击你们
  rationale: חבר含连接、组合之意；“组织言辞”保留将话语编连起来的意象，而“攻击你们”体现עַל在本语境中的敌对指向。
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: 对着你们摇头
  rationale: 直译头部动作，不在正文中把其含义限定为某一种情绪；其文化语用由脚注说明。
theological_decisions: []
