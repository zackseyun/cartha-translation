  yaml_path: translation/ot/job/016/020.yaml
  text: My friends are my mockers[a]; my eye pours out tears to God.
translation:
  language: zh_hans
  text: 我的朋友竟是讥笑我的人[a]；我的眼向上帝流着泪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的朋友是我的代言者／中保。”希伯来语“מְלִיצַי”也可被理解为“代言者”或“中保”；但在这里约伯申诉的语境中，理解为“讥笑我的人”较为贴切。
    reason: 保留希伯来词语可能具有的正面含义及本节的解释歧义。
lexical_decisions:
- source_word: מְלִיצַי
  choice: 讥笑我
  rationale: 该词在这里可指讥诮者。结合约伯对朋友敌意言行的控诉，译作“讥笑我”最符合语境；其可能的正面含义则保留在脚注中。
- source_word: רֵעָי
  choice: 我的朋友
  rationale: רֵעַ通常指朋友或同伴。“我的朋友”自然清楚，也保留了本应安慰约伯的人反而讥笑他的反讽意味。
- source_word: אֶל אֱלוֹהַ
  choice: 向上帝
  rationale: אֶל表示朝向，אֱלוֹהַ是《约伯记》中常见的单数神称。“向上帝”既自然，也保留眼泪朝向上帝的意象。
- source_word: דָּלְפָה
  choice: 流泪
  rationale: 该动词本义为滴下、淌下；以“我的眼”为主语时，“流泪”是现代汉语中自然且准确的表达，并保留液体流淌的画面。
- source_word: עֵינִי
  choice: 我的眼
  rationale: 原文为单数。译文保留单数，以贴近希伯来诗歌凝练而鲜明的表达。
theological_decisions:
- issue: מְלִיצַי在本节是负面的“讥诮者”，还是正面的“代言者／中保”
  choice: 正文采用负面的“讥笑我”
  alternative: “为我代言／替我申辩的人”
  rationale: 词义与句法存在真实歧义；但在当前上下文中，约伯的朋友屡次攻击他，因此负面理解更切合申诉语境。正面理解未被排除，故以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的朋友都讥笑我”把希伯来语简略的名词句自然转换为汉语陈述句；“我的眼向上帝流泪”保留单数“眼”以及眼泪朝向上帝的诗意方向感。
