base_translation:
  language: en
  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: zh_hans
  text: 就是到如今，看哪，我的见证人在天上；为我作证的那一位在高天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高天”或译“至高之处”。本节两个称谓都是“见证人、作证者”一类的近义表达；后半句也可译作：“我的见证人在高天。”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: 即使现在
  rationale: 这一组合强调约伯在当前困境中仍作此断言；“即使现在”自然保留其时间上的强调。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留指示语引人注意、郑重宣告的作用，也符合诗体的庄重语域。
- source_word: בַשָּׁמַיִם
  choice: 在天上
  rationale: 此处指属天的领域，而非单指可见天空；“在天上”是现代汉语自然表达。
- source_word: עֵדִי
  choice: 我的见证者
  rationale: 直接保留法律语境中的见证人意象；“见证者”也不预先限定其身份。
- source_word: וְשָׂהֲדִי
  choice: 为我作证的那一位
  rationale: 该亚兰语色彩的近义词仍指见证者或作证者；采用功能性表达，既体现与前句的平行，也避免将其解释为更特定的“辩护者”。
- source_word: בַּמְּרוֹמִים
  choice: 在高天
  rationale: 该复数名词表示高处，与“天上”平行；“高天”简洁、庄重，并保留上方高处的空间意象。
theological_decisions:
- issue: 约伯所说天上见证者的身份
  choice: 以“我的见证者”和“为我作证的那一位”作功能性翻译，不明确其身份
  alternative: 明确解释为上帝、天使性中保，或约伯证词的诗意人格化
  rationale: 希伯来文只陈明见证者在天上，并未明确指出其身份；译文应保留这一神学张力。
- issue: 两个见证词语之间的关系
  choice: 把二者译为相互平行但措辞不同的称谓
  alternative: 两处都译为“我的见证者”
  rationale: עֵדִי 与 שָׂהֲדִי 是近义平行；不同措辞可反映词汇变化，同时不把第二项扩大解释成“辩护者”。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“看哪”保留原文突出的指示语气；分号呈现两行同义平行。脚注标记置于整节末尾，说明“高天”的译法及第二个见证称谓的词义选择。
