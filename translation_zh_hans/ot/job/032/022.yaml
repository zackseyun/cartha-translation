  text: כִּ֤י לֹ֣א יָדַ֣עְתִּי אֲכַנֶּ֑ה כִּ֝/מְעַ֗ט יִשָּׂאֵ֥/נִי עֹשֵֽׂ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/022.yaml
  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: zh_hans
  text: 因为我不懂得奉承别人[a]；不然，造我的那位很快就会把我带走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用讨好的尊称称呼人。”这个希伯来语动词可以指用尊称奉承人，或偏私地抬举人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把我除去。”原文没有明确说“杀死我”，但可能暗含在审判中被除去。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明以利户拒绝偏袒、谄媚的原因；现代汉语用“因为”自然表达解释关系。
- source_word: לֹא יָדַעְתִּי
  choice: 我不懂得
  rationale: 这里不是单指过去未曾知道，而是表示不会、不具备这种本领或习惯；“我不懂得”能保留这种语用含义。
- source_word: אֲכַנֶּה
  choice: 奉承人
  rationale: 该动词在此语境中指用尊称讨好人、偏私地抬举人；“奉承人”简洁自然，并在脚注保留“给人奉上尊称”的词义可能。
- source_word: כִּמְעַט
  choice: 很快
  rationale: 在警告性的语境中表示后果迫近；“很快”比“几乎”更符合此处的时间意义。
- source_word: יִשָּׂאֵנִי
  choice: 把我带走
  rationale: נשא可表示举起、带走或除去；“带走”保留神施行审判性移除的力度，又不把含义限定为明确杀死。
- source_word: עֹשֵׂנִי
  choice: 造我的那位
  rationale: 按希伯来语分词结构直译为“造我的那一位”，既清楚表达创造者与受造者的关系，也避免加入原文没有明说的称号。
theological_decisions:
- issue: 所警告的神圣行动究竟是什么
  choice: 译作“造我的那位很快就会把我带走”
  alternative: “造我的那位很快就会杀死我”或“很快就会把我除去”
  rationale: 原文 נשא 的意义比“杀死”宽泛；这里可能暗含致死的审判，但没有明确说“杀”。译作“带走”保留审判的严肃性，也不消除原文的含混。
- issue: “造我的那位”的称谓
  choice: 采用描述性的“造我的那位”
  alternative: “我的创造者”或“造我的主”
  rationale: 原文是带第一人称宾语后缀的分词，字面指“造我的那一位”。此译法不额外加入“主”这一称号，同时自然表达说话者对创造者的敬畏。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉承人”直接承接上文不偏袒人的语境；分号表现理由与后果之间的紧密关系。“否则”补出汉语所需的逻辑衔接，但不把神的行动具体化为死亡。
