  text: וּ/בִ/שְׁלֹ֣שֶׁת רֵעָי/ו֮ חָרָ֪ה אַ֫פּ֥/וֹ עַ֤ל אֲשֶׁ֣ר לֹא מָצְא֣וּ מַעֲנֶ֑ה וַ֝/יַּרְשִׁ֗יעוּ אֶת אִיּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/003.yaml
  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: zh_hans
  text: 他又向约伯的三个朋友发怒，因为他们找不出回答，却定约伯有罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“判约伯为恶人。”
    reason: וַיַּרְשִׁיעוּ既可表达“定为有罪”，也可表达“判为恶、当作恶人”；脚注保留其道德定性的可能。
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: 又向约伯的三个朋友
  rationale: ב与“发怒”这一习语连用，表示怒气所针对的对象，译作“向……发怒”自然准确。根据上下文，代词所指为约伯，明译姓名可避免现代汉语中的指代含混。
- source_word: חָרָה אַפּוֹ
  choice: 发怒
  rationale: 希伯来语字面为“他的鼻子燃烧”，是表达愤怒的常见习语；现代汉语用“发怒”清楚自然。
- source_word: עַל אֲשֶׁר
  choice: 因为
  rationale: 引出以利户发怒的原因，译作“因为”简洁合宜。
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: 他们找不出回答
  rationale: 保留“找到”这一表达，同时“找不出”比“没有找到”更自然地传达辩论中无法提出有效答复的语境；מַעֲנֶה可指回答或答辩。
- source_word: וַיַּרְשִׁיעוּ
  choice: 却定约伯有罪
  rationale: רשע的使役形在此具有宣告某人有罪、判其为恶的法庭性含义；“定……有罪”保存这一语义，也不把它过度解释为正式司法判决。
- source_word: וַ
  choice: 却
  rationale: 连接词本可直译为“并且”，但上下文形成明显反差：朋友们没有回答，却仍定约伯有罪；“却”自然呈现这一话语关系。
theological_decisions:
- issue: 约伯的朋友对约伯所采取行动的性质
  choice: 定约伯有罪
  alternative: 判约伯为恶人／使约伯显为有罪
  rationale: 使役形וַיַּרְשִׁיעוּ可表达司法性的定罪，也可侧重把某人判定为恶。正文采用较宽稳的“定……有罪”，脚注保留“判为恶人”的词义可能，避免把法庭语感或道德定性绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“向……发怒”“找不出回答”“定……有罪”符合当代普通话表达。正文补明“约伯”以消除孤立经节中“他的三个朋友”可能造成的指代歧义；脚注标记[a]已在正文出现。
