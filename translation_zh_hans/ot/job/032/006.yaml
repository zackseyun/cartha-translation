base_translation:
  language: en
  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: zh_hans
  text: 布西人巴拉迦的儿子以利户回答说：“我年纪尚轻[a]，你们却已年高；所以我畏缩害怕[b]，不敢向你们陈明我所知道的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“我的年日尚少”，是指年龄相对较轻。
    reason: cultural_note
  - marker: b
    text: 或译：“所以我退缩，不敢把我所知道的告诉你们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: 回答说
  rationale: 保留希伯来叙事中引出发言的惯用双重表达；“回答”并不必然表示前面有人直接提问。
- source_word: אֱלִיהוּא בֶן־בַּרַכְאֵל הַבּוּזִי
  choice: 布西人巴拉迦的儿子以利户
  rationale: 按现代中文圣经人名惯例音译专名，并将族属称谓置于姓名之前，使句子自然清楚。
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: 我年纪尚轻
  rationale: “日子少/在日子上年轻”是表示年龄较轻的希伯来语习语；正文用自然现代汉语表达，字面意象收入脚注。
- source_word: יְשִׁישִׁים
  choice: 已年高
  rationale: 表达年事已高，语气庄重而尊敬，并与“年纪尚轻”形成鲜明对照。
- source_word: עַל־כֵּן
  choice: 所以
  rationale: 清楚标示年龄差异与以利户迟疑发言之间的因果关系。
- source_word: זָחַלְתִּי וָאִירָא
  choice: 我畏缩害怕
  rationale: 保留原文两个并列动词所表达的退缩与惧怕；中文简洁自然，又不把二者合并为单一概念。
- source_word: מֵחַוֺּת
  choice: 陈明
  rationale: 该词表示宣告、使人知道；“陈明”符合以利户正式发言的语域。
- source_word: דֵּעִי
  choice: 我所知道的
  rationale: 以自然中文传达“我的知识/认识”，避免“我的知识”在此处可能产生的生硬或自夸意味，同时不弱化为单纯的“意见”。
- source_word: אֶתְכֶם
  choice: 向你们
  rationale: 与“陈明”搭配，明确你们是其陈述的对象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以“尚轻／年高”体现以利户对长者的敬意；正文保留“畏缩”和“害怕”的双重表达，并以脚注说明可采用的较动态译法。
