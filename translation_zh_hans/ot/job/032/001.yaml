source:
  edition: WLC
  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: zh_hans
  text: 于是，这三个人不再回答约伯[a]，因为约伯自以为义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有文本传统作：“因为约伯在他们眼中是义人。”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: 不再
  rationale: 该动词在此表示“停止、止息”，并与后面的“回答”构成自然的现代汉语表达“不再回答”。
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: 这三个人
  rationale: 直接保留数词、指示成分及阳性复数所指的人物。
- source_word: מֵעֲנוֹת
  choice: 回答
  rationale: ענה 的不定式在辩论语境中意为“回答、回应”；“回答”简洁自然。
- source_word: אֶת אִיּוֹב
  choice: 约伯
  rationale: את 是直接宾语标记，汉语无需另译；专名依通行译名译作“约伯”。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出三人停止回答约伯的原因。
- source_word: צַדִּיק
  choice: 义
  rationale: צַדִּיק 带有道德和司法层面的“正直、正当”含义；置于汉语固定表达“自以为义”中，既自然又保留其核心语义。
- source_word: בְּעֵינָיו
  choice: 自以为
  rationale: 字面为“在他自己眼中”；现代汉语用“自以为义”准确表达这种自我判断，同时不宣告该判断客观成立。
theological_decisions:
- issue: 经文是在宣告约伯确实为义，还是只描述约伯对自己的看法
  choice: 译作“约伯自以为义”
  alternative: “约伯在他们眼中是义人”
  rationale: 所给马所拉文本的代词后缀为第三人称阳性单数，即“在他眼中”。译文保留叙述者对约伯自我判断的描述，不进一步裁定约伯是否客观为义；另一文本传统的复数读法收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文辩论；“不再回答”符合汉语习惯。“自以为义”虽是凝练的固定表达，但此处仅表达“在自己眼中为义”，不额外强化贬义。
