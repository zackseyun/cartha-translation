base_translation:
  language: en
  yaml_path: translation/ot/job/032/012.yaml
  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: zh_hans
  text: 我仔细听了你们的话[a]；看哪，你们中间竟没有一人能驳倒约伯[b]，回答他所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我仔细观察、思量了你们。”希伯来文动词含有专注考量或仔细察看的意思；在本段辩论语境中也可理解为仔细聆听。
    reason: lexical_alternative
  - marker: b
    text: 或译：“责备约伯”或“纠正约伯”。这里的希伯来词既可指在辩论中反驳、证明对方有错，也可指责备或纠正。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: 我仔细听了你们的话
  rationale: אֶתְבּוֹנָן表示专注地思量、察看；与指向听众的וְעָדֵיכֶם结合，并按辩论语境，译为“仔细听了你们的话”既自然，也保留专心考量之意。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来文提示注意并引出结论的修辞标记。
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: 没有一人能驳倒约伯
  rationale: מוֹכִיחַ在争辩语境中可指反驳、证明对方有错的人；“驳倒”突出了这里的论辩含义，同时以脚注保留“责备／纠正”的可能。
- source_word: עוֹנֶה אֲמָרָיו
  choice: 回答他所说的话
  rationale: 贴近“回应他的言语”的希伯来文结构，同时采用自然的现代汉语表达。
- source_word: מִכֶּם
  choice: 你们中间
  rationale: 介词מִן在此表示从这一群人当中，译作“你们中间”符合汉语否定存在句的习惯。
