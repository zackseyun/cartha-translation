translation:
  language: zh_hans
  text: 所以我说[a]：“你们要听我说；我也要陈述我的见识。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以我曾说：‘你们要听我说；我也要陈述我的见识。’”希伯来文“我说”采用完成式，可理解为一般过去时；但在此语境中，很可能具有当下发言的施行意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 作为承接上文推论的连接词，“所以”自然清楚地保留因果与论证关系。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 该词形态上是完成式，可译“我曾说”，但在此言谈语境中很可能具有当下的施行性，用“我说”更能体现以利户此刻发言的语气。
- source_word: שִׁמְעָה לִּי
  choice: 请听我说
  rationale: 祈使式要求对方留心听；汉语“请听我说”既自然，又保留命令中较合宜的郑重语气。
- source_word: אֲחַוֶּה
  choice: 要陈明
  rationale: 此动词表示使人知道、陈述或宣告；“陈明”符合正式论辩语体，又不额外加入“解释”的含义。
- source_word: דֵּעִי
  choice: 我的见识
  rationale: 指说话者所知道或所理解的内容。“见识”比“意见”更保留知识与理解的分量，也比直译“我的知识”更符合现代汉语表达。
- source_word: אַף אֲנִי
  choice: 我也
  rationale: 表达附加并带强调，即以利户也要加入发言；“我也”简洁自然。
