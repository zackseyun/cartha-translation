  yaml_path: translation/ot/job/032/013.yaml
  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
translation:
  language: zh_hans
  text: 免得你们说：“我们已经找到了智慧；上帝会赶走他，不是人。”〔a〕
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出所警戒的一种可能说法，保留希伯来语的预防、劝阻语气。
- source_word: תֹּאמְרוּ
  choice: 你们说
  rationale: 这是阳性复数第二人称未完成式；与“免得”连用时，现代汉语用“你们说”即可自然表达将然或可能之意。
- source_word: מָצָאנוּ חָכְמָה
  choice: 我们已经找到了智慧
  rationale: “已经”体现完成式所表达的既成结果，“智慧”则保留原词的常用含义。
- source_word: אֵל
  choice: 上帝
  rationale: 在与“人”对举的句式中，此词明确指上帝。
- source_word: יִדְּפֶנּוּ
  choice: 击溃他
  rationale: 该动词通常有“赶走、驱散”之意；此处针对约伯的争辩，也可泛指将他击败或驳倒。“击溃”兼顾原有的驱逐意象和语境中的彻底胜过之意，其他可能译法列于脚注。
- source_word: לֹא אִישׁ
  choice: 不是人
  rationale: 原文以一般意义上的人和上帝形成对比；“不是人”简洁保留这一对举。
theological_decisions:
- issue: אֵל יִדְּפֶנּוּ לֹא אִישׁ 的具体含义
  choice: 击溃他的必是上帝，不是人
  alternative: 上帝会回答他，不是人；上帝能制伏他，不是人
  rationale: 原动词的基本意象是赶走或驱散，但在本段辩论语境中可能延伸为击败、制伏或驳倒。正文保留较贴近词义且符合语境的“击溃”，脚注呈现尚存的解释空间。
- issue: אִישׁ 在与上帝对举时的泛指意义
  choice: 人
  alternative: 世人；凡人
  rationale: 这里不是特指某位男性，而是泛指人的能力，与上帝形成对比；“人”在现代汉语中准确且自然。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“击溃他的必是上帝，不是人”保留原文简洁有力的神—人对举；正文中的[a]与脚注完全对应。
