  yaml_path: translation/ot/job/032/019.yaml
  text: Look[a], my belly is like wine that has no vent[b]; like new wineskins it is about to burst.
translation:
  language: zh_hans
  text: 看哪，我腹中如同没有出口的酒；又如新酒囊，快要裂开。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“未被打开的酒”。这里的比喻指酒或其中的压力无处释放。
    reason: lexical_alternative
  - marker: b
    text: “酒囊”是用动物皮制成、用来盛装液体，尤其是酒的容器。
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意的语气词；“看哪”保留其指示和强调作用，也符合庄重而易懂的现代汉语。
- source_word: בִטְנִי
  choice: 我腹中
  rationale: בטן本义为腹部，也可指人的内在深处。这里既有身体受压的具体意象，也表达以利户内心言语充盈；“我腹中”保留这两层可能。
- source_word: כְּיַיִן
  choice: 如同……酒
  rationale: 直译比较结构和“酒”，不在正文中额外加入原文未明说的“发酵”。
- source_word: לֹא יִפָּתֵחַ
  choice: 没有出口
  rationale: 该被动形式直译为“未被打开”。在酒因压力而将容器胀裂的比喻中，“没有出口”自然传达无法释放的意思；脚注保留字面表达。
- source_word: כְּאֹבוֹת חֲדָשִׁים
  choice: 像新酒囊
  rationale: אֹבוֹת在此指盛装液体、尤其是酒的皮制容器，并由“新的”修饰；“新酒囊”准确呈现其文化背景和上下文意象。
- source_word: יִבָּקֵעַ
  choice: 快要裂开
  rationale: בקע表示裂开、迸裂。结合以利户描述言语积压、急需出口的语境，“快要”表达迫近之势，而“裂开”保留原动词的具体意象。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我腹中”保留希伯来文具体的身体意象及其可能指向内在感受的含义；两个连续比喻按原文次序呈现，并以脚注说明较生疏的字面表达和酒囊文化背景。
