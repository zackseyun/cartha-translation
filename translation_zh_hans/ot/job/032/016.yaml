  yaml_path: translation/ot/job/032/016.yaml
  text: And I waited[a], because they did not speak[b], because they stood still and answered no more.
translation:
  language: zh_hans
  text: 我等候着[a]，因为他们没有说话，也因为他们站住了[b]，不再回答。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我期待着”；这个动词可表示带着期待等候，但这里的上下文较支持“等候”。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们站住了”；这里可能指他们停下来，保持沉默。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  choice: 我等候着
  rationale: 该词在此处指以利户在年长者沉默时继续等待；词根也可含“期待、盼望”之意，但上下文以“等候”最自然。连接词 וְ 在中文中不必机械译出。
- source_word: כִּי לֹא יְדַבֵּרוּ
  choice: 因为他们不再说话
  rationale: כִּי 表原因；未完成式在本段叙事语境中表示当时他们没有继续发言。加入“不再”可自然表达发言已经停止的语境。
- source_word: כִּי עָמְדוּ
  choice: 因为他们停了下来
  rationale: עָמְדוּ 字面为“他们站住了”，在谈话语境中意指他们停住、不再继续；译作“停了下来”保留其停止之意，脚注说明字面表达。
- source_word: לֹא עָנוּ עוֹד
  choice: 不再回答
  rationale: עוֹד 与否定词连用，表示回答已经终止；“不再回答”简洁自然。
theological_decisions: []
