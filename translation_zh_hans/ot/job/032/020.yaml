base_translation:
  language: en
  yaml_path: translation/ot/job/032/020.yaml
  text: I will speak[a], that I may find relief; I will open my lips and answer.
translation:
  language: zh_hans
  text: 我要说话，好让我得以舒畅[a]；我要开口回答。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“说了我就会舒畅”，或“我就会得到舒缓”。原文也可表示结果，而不只是目的。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: 我要说话
  rationale: 第一人称单数鼓励式表达说话者的决意或意愿。“我要说话”在现代汉语中自然地保留这种主动、前瞻的语气，而不把它误作向别人提出许可请求。
- source_word: וְיִרְוַח לִי
  choice: 好让我得以舒畅
  rationale: רוח在此有“得到宽舒、缓解”的意思，לִי表明这种舒缓临到说话者。译作“好让我”体现上下文中可能的目的关系；“得以舒畅”则保留内心得到释放的语意。
- source_word: אֶפְתַּח שְׂפָתַי
  choice: 我要开口
  rationale: 原文直译为“我要张开我的嘴唇”，是表示开始说话的惯用表达。汉语“开口”自然、简洁，也保留了原文具体的口唇意象；若译作“张开嘴唇”则显得生硬。
- source_word: וְאֶעֱנֶה
  choice: 回答
  rationale: ענה在此争辩语境中意为“回答、回应”。“回答”简洁并符合上下文。
theological_decisions: []
