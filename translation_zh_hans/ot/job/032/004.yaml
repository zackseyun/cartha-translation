  yaml_path: translation/ot/job/032/004.yaml
  text: Elihu had waited to speak to Job[b][a], because they were older than he in days.
translation:
  language: zh_hans
  text: 以利户等着向约伯说话[a]，因为他们的年岁都比他大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似：“以利户在话语上等候约伯。”这是一个较特殊的表达；按上下文，意思是他等候向约伯说话。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为他们在日子上比他年长。”意思是他们的年龄比他大。
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: 以利户
  rationale: 人名按现代中文圣经通行形式音译；句首的 וַ/וֶ 在这里承接叙事，中文无需机械译成“而”或“现在”。
- source_word: חִכָּה
  choice: 一直等着
  rationale: 该动词意为“等候、等待”；“一直等着”自然表达以利户在别人发言期间持续等待的背景状态。
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: 向约伯发言[a]
  rationale: 原文结构较为特殊，直译近似“在话语上等着约伯”。结合上下文，这里指以利户等候向约伯说话；正文采用通顺表达，脚注保留原文措辞及其可能引起的歧义。
- source_word: כִּי
  choice: 因为
  rationale: 此处明确引出以利户等待的原因。
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ לְיָמִים
  choice: 他们年岁都比他大[b]
  rationale: זְקֵנִים 与比较结构 מִמֶּנּוּ 表示年龄较长，而非担任“长老”职分；לְיָמִים 字面涉及“日子”，中文用“年岁”既自然又保留年龄意味。
theological_decisions:
- issue: “他们”的所指
  choice: 保留第三人称复数“他们”，不在正文中点明具体人物
  alternative: 明确译为“约伯和他的三个朋友”
  rationale: 希伯来文本只用复数代词，没有在本节重新列举所指；保留代词可避免加入原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一直等着”呈现背景中的持续等待；“年岁都比他大”比逐字译作“在日子上比他年长”更符合现代汉语。脚注保留原文特殊结构及其解释空间。
