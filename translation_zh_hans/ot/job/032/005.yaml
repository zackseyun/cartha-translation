  yaml_path: translation/ot/job/032/005.yaml
  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
translation:
  language: zh_hans
  text: 以利户看见这三个人无言以答[a]，就发怒了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“这三个人口中没有回答”，意思是他们无话可答。
    reason: 保留原文具体意象并说明其习语含义。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 见
  rationale: 叙事性的连续式推动情节；与后面的“就”配合，自然表达先看见、后发怒的时序。
- source_word: אֱלִיהוּא
  choice: 以利户
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: כִּי
  choice: （由“见……都……”体现）
  rationale: 此处引出以利户所见的内容，中文无需另译连接词。
- source_word: אֵין מַעֲנֶה בְּפִי
  choice: 都无言以答
  rationale: 希伯来文直译为“口中没有回答”；正文用自然、庄重的中文表达其无话可答，同时以脚注保留原文意象。
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: 这三个人
  rationale: “这”清楚指向上文与约伯辩论的三人，符合汉语篇章衔接。
- source_word: וַיִּחַר אַפּוֹ
  choice: 怒气发作
  rationale: 保留怒气被激发、燃起的动态意味，同时比直译“鼻子发热”自然；避免加入原文没有的程度判断。
