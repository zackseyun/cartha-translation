  text: He has not directed words against me[b][a], and I will not answer him with your sayings.
translation:
  language: zh_hans
  text: 他并没有向我提出论辩[a]，我也不会以你们的话回答他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他没有向我陈列言辞”。希伯来语动词可指“排列、摆设”；与“话语”连用时，在这里可指组织并向人提出言词或论辩。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  choice: 陈列
  rationale: 该动词基本义为“排列、摆列”，与“言辞”搭配时指把话组织起来并摆到对方面前，含有陈述论辩之意；“陈列言辞”保留了原文意象及一定的歧义。
- source_word: אֵלַי
  choice: 向我
  rationale: 介词的基本方向义是“向、对着”；上下文可含针对之意，但不必明确强化为“反驳我”或“攻击我”。
- source_word: מִלִּין
  choice: 言辞
  rationale: 该词指所说的话或言语；“言辞”既自然庄重，也适合辩论语境。
- source_word: אִמְרֵיכֶם
  choice: 你们的话
  rationale: 指三位朋友所说的话。现代汉语用“话”最自然，并与前面的“言辞”作适度区分，而不把它明确解释成“论点”。
- source_word: אֲשִׁיבֶנּוּ
  choice: 回答他
  rationale: 使役词形在此具有“回答、回应”之义，第三人称阳性单数后缀指约伯。
- source_word: וּבְאִמְרֵיכֶם לֹא אֲשִׁיבֶנּוּ
  choice: 我也不会用你们的话来回答他
  rationale: 将 בְּ 按工具义译为“用”，表明以三位朋友的话作为回答的手段或内容；“也”自然连接两个并列分句。
