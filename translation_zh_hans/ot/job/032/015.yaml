  text: חַ֭תּוּ לֹא עָ֣נוּ ע֑וֹד הֶעְתִּ֖יקוּ מֵ/הֶ֣ם מִלִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/015.yaml
  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
translation:
  language: zh_hans
  text: 他们惊惶失措[a]，不再回答；话语已经离开了他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们被击垮了”或“他们困惑不已”；希伯来语动词可表示被击垮、惊惶或困窘。
    reason: lexical_alternative
  - marker: b
    text: 直译“话语从他们那里移开了”，意思是他们已经无话可说。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַתּוּ
  choice: 他们惊惶失措
  rationale: 该动词可表示被击垮、惊惶或困窘。此处描写约伯的朋友无言以对；“惊惶失措”既表达其心理震动，也体现其辩论上的挫败，同时不把意象过度具体化为身体上的“破碎”。
- source_word: לֹא עָנוּ עוֹד
  choice: 不再回答
  rationale: ענה在辩论语境中指回答或回应；לֹא与עוֹד连用，表示原有行动不再继续。现代汉语“不再回答”简洁自然。
- source_word: הֶעְתִּיקוּ מֵהֶם מִלִּים
  choice: 话语已经离开了他们
  rationale: העתיק在此有移开、离去之意，מֵהֶם表示从他们那里分离。保留“话语离开他们”的拟人化意象，比直接释义为“他们无话可说”更贴近希伯来文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半句以“惊惶失措”传达人物被震慑而无言的状态；后半句保留希伯来语“话语离开”的诗性拟人表达。
