  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: zh_hans
  text: 许多人未必有智慧，年长的人也未必明白公正[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“判断”或“何为正当”。希伯来语 mishpat 可指司法判断、公正或正当的秩序。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא רַבִּים
  choice: 人多不一定
  rationale: 希伯来文直译近于“不是众多的人有智慧”。中文用“不一定”自然表达这句格言对人数与智慧之间必然联系的否定，同时不将其误解为断言人多者全都不智慧。
- source_word: יֶחְכָּמוּ
  choice: 有智慧
  rationale: חכם 的 Qal 形式在此表示有智慧或成为智慧；格言语境侧重状态，译为“有智慧”简明自然。
- source_word: וּזְקֵנִים
  choice: 年老
  rationale: זְקֵנִים 在这里与“人多”并列，强调年龄而非正式的长老职分，因此译为“年老”，避免引入职位含义。
- source_word: יָבִינוּ
  choice: 明白
  rationale: בין 表示理解、辨明；“明白”符合现代汉语，也保留对后接 מִשְׁפָּט 的认知和辨识意味。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 该词可指审判、判断、公正或合宜之理；此处“公正”保留其道德与司法范围，其他可能义项列入脚注。
