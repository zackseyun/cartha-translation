base_translation:
  language: en
  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: zh_hans
  text: 因为我满腹话语；我里面的灵[a]催逼我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我里面的灵”直译可作“我腹中的灵”，即“我内在深处的灵”。
    reason: 保留בִּטְנִי的身体意象及其内在自我之含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明以利户为何必须开口，保留原文的因果、解释语气。
- source_word: מָלֵתִי מִלִּים
  choice: 我满腹话语
  rationale: 既表达“充满话语”的现状，也借“满腹”自然保留希伯来诗句中话语积聚于内里的意象。
- source_word: הֱצִיקַתְנִי
  choice: 催逼我
  rationale: 该动词含挤压、逼迫之意；“催逼”兼顾内在压力与迫使说话的语境。
- source_word: רוּחַ
  choice: 灵
  rationale: 在此可指人里面的灵或内在驱动力；直译为“灵”可保留原文在主体指向上的张力，不径自解释为情绪或思想。
- source_word: בִּטְנִי
  choice: 我里面的
  rationale: בטן字面指腹部，也可指人的内在深处；正文采用自然现代汉语表达，字面意象收入脚注。
theological_decisions:
- issue: רוּחַ是否特指上帝的灵
  choice: 译作“灵”，不加“上帝的”
  alternative: 译作“上帝的灵”或“内心的冲动”
  rationale: 原文没有明说该灵属于上帝；上下文虽可能容许神圣推动的理解，但也可指以利户自身里面的灵。译文保留这种歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“满腹话语”与“催逼”形成内在充盈和压力的意象；分号保留两分句的紧密因果推进。
