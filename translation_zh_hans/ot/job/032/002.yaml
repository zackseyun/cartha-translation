revisions:
- from: 于是，布西人巴拉迦的儿子以利户——兰族的人——向约伯发怒。他怒气燃烧，因为约伯称自己为义，却不称上帝为义。[a]
  to: 于是，布西人巴拉迦的儿子以利户——兰族的人——向约伯发怒；他的怒气燃烧起来，因为约伯以自己为义，不以上帝为义。[a]
  rationale: 修订仅调整末句和怒气表达。“以自己为义，不以上帝为义”忠实呈现原文中约伯自我申辩与上帝之间的比较／对照，并避免主文将有争议的较强解释定为唯一含义。脚注保留“比上帝更公义”的可行解释。
