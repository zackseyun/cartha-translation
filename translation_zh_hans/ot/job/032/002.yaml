base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: zh_hans
  text: 于是，布西人巴拉迦的儿子以利户——兰族的人——向约伯发怒；他的怒气燃烧起来，因为约伯以自己为义，不以上帝为义。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为约伯认为自己比上帝更公义。”
    reason: 原文的比较结构可作较强理解，表示约伯把自己看得比上帝更公义。
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 发怒
  rationale: 这是希伯来语表示怒气被点燃的惯用语；首处用自然的现代汉语“发怒”，避免同句两次都直译得生硬。
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל
  choice: 巴拉迦的儿子以利户
  rationale: 按希伯来语亲属结构直译，并采用现代中文圣经人名的通行音译。
- source_word: הַבּוּזִי
  choice: 布西人
  rationale: 该词是带定冠词的族属称谓；“布西人”简洁自然地表达其族群或地域身份。
- source_word: מִמִּשְׁפַּחַת רָם
  choice: 兰族的人
  rationale: מִשְׁפָּחָה可指家族或宗族；这里用“族”表达比核心家庭更广的群体，而专名רָם按中文通行形式译作“兰”。
- source_word: בְּאִיּוֹב
  choice: 向约伯
  rationale: 介词ב与发怒动词连用，标明怒气所针对的对象；中文用“向……发怒”自然清楚。
- source_word: חָרָה אַפּוֹ
  choice: 他怒气燃烧
  rationale: 第二次保留希伯来语“怒气燃烧”的形象和重复强调。
- source_word: עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים
  choice: 因为约伯称自己为义，却不称上帝为义
  rationale: צדק的使动/宣告义含义译作“称……为义”；נפש在这里作反身用法。מן表达比较或对照，主文以“却不”呈现约伯自我申辩与上帝之义之间的张力，而不直接断言他抽象地自称比上帝更公义。
theological_decisions:
- issue: עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים所指约伯过失的性质
  choice: 因为约伯称自己为义，却不称上帝为义
  alternative: 因为约伯认为自己比上帝更公义
  rationale: 原文מן可表达比较，语境也表明约伯的自我辩白以牺牲上帝的公义为代价。主文保留“称义”的司法色彩和双方之间的对照；脚注列出较强的比较性理解，以保存原文的歧义和神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“于是”承接叙事；破折号隔开补充的族属信息。首处简洁译作“发怒”，次处保留“怒气燃烧”，兼顾中文自然度与原文重复和意象。
