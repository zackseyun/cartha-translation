  yaml_path: translation/ot/job/032/021.yaml
  text: Please[a], let me not show partiality to any man[b], nor flatter any person.
translation:
  language: zh_hans
  text: 愿我不偏待任何人，也不奉承任何人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉承”或译“用尊称称呼人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: 求你使我不
  rationale: אַל与语气词נָא表达恳切而委婉的否定愿望；汉语用“求你使我不……”保留恳求和自我约束的语气。
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: 偏待任何人
  rationale: 字面为“抬起某人的脸”，是希伯来语习语，意为徇情、偏袒；“偏待”简洁自然地传达其含义。单数泛指在汉语中译作“任何人”。
- source_word: וְאֶל אָדָם
  choice: 也不……任何人
  rationale: אָדָם在此泛指人，与前半句的אִישׁ平行；重复“任何人”可保持对称并符合现代汉语。
- source_word: לֹא אֲכַנֶּה
  choice: 奉承
  rationale: כנה的Piel形式在此可能指以称号称呼人，语境中带有讨好、谄媚之意；正文采用自然的“奉承”，脚注保留“给人加尊称”的较字面可能。
