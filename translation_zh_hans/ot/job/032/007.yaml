  yaml_path: translation/ot/job/032/007.yaml
  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
translation:
  language: zh_hans
  text: 我曾想[a]：“年长者应当说话，年高者应当显明智慧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我曾说：‘日子应当说话，许多年岁应当使智慧为人所知。’”希伯来文以“日子”和“许多年岁”借指年长者或高龄。
    reason: 保留אָמַרְתִּי较直译的“我曾说”，并说明原文以时间词借指年龄；同时反映“使智慧为人所知”的使役含义。
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: 我曾想
  rationale: 该词通常意为“我说”，但在此引出以利户先前心中的判断；现代汉语用“我曾想”更自然，也与上下文相合，同时在脚注保留直译。
- source_word: יָמִים
  choice: 年长的
  rationale: 字面为“日子”，此处借指年岁较长的人。汉语若直译“日子应该发言”会造成误解，因此显明其转喻含义。
- source_word: יְדַבֵּרוּ
  choice: 应该发言
  rationale: 未完成时在此表达以利户原先认为合宜、理当如此的事；“应该”比单纯的“会”更准确地传达这种期待。
- source_word: וְרֹב שָׁנִים
  choice: 年高的
  rationale: 字面为“许多年”或“年岁的丰盛”，与前半句平行，借指年事已高的人；“年高的”自然简洁，并保留诗性平行。
- source_word: יֹדִיעוּ
  choice: 应该阐明
  rationale: 使役词形意为“使人知道、使……为人所知”；“阐明”保留主动表明智慧的含义，且比“教导”少一层解释。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 直接保留该抽象名词，符合《约伯记》的智慧主题和本句诗体。
theological_decisions: []
