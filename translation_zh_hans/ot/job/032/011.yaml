  text: הֵ֤ן הוֹחַ֨לְתִּי לְֽ/דִבְרֵי/כֶ֗ם אָ֭זִין עַד תְּב֥וּנֹֽתֵי/כֶ֑ם עַֽד תַּחְקְר֥וּ/ן מִלִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/011.yaml
  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: zh_hans
  text: 你们看，我一直等候[a]你们发言；我侧耳听你们的见解[b]，直到你们推敲言词[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候”也可译作“期待”。原文动词可表示带着期待等待。
    reason: lexical_alternative
  - marker: b
    text: “见解”也可译作“理解”或“推理”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“直到你们查究该说什么。”原文末句十分凝练，直译近于“直到你们搜寻言词”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 你们看
  rationale: 这是引起听者注意的语篇助词。译作“你们看”自然、现代，也保留了原文提示注意的作用。
- source_word: הוֹחַלְתִּי
  choice: 我一直等候
  rationale: יחל在此可指带着期待等候，也可侧重等待。上下文是以利户克制自己、等候长者说完，因此正文采用“等候”；“一直”体现这段等待的持续性。
- source_word: לְדִבְרֵיכֶם
  choice: 你们发言
  rationale: 直译为“你们的话”。结合“等候”的搭配，中文用“等候你们发言”更自然，并准确表达他等候众人把话说出来。
- source_word: אָזִין
  choice: 我侧耳听
  rationale: 该动词的使役式表示留心倾听。“侧耳听”简洁地保留专注聆听的意味，又符合庄重诗体。
- source_word: תְּבוּנוֹתֵיכֶם
  choice: 你们的见解
  rationale: 复数形式可指理解力、辨识或由此形成的思考内容。这里是以利户听取众人的论述，“见解”最符合语境，同时保留“理解、推理”的语义空间。
- source_word: תַּחְקְרוּן מִלִּין
  choice: 你们推敲言词
  rationale: חקר表示深入搜寻、探究；מִלִּין是诗歌性用语，意为“言词”。“推敲言词”保留寻找恰当措辞的意象，也不把原文过度解释为“答案”或“论据”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们看”避免“看哪”的古雅感；“侧耳听”和“言词”适度保留希伯来诗歌的修辞色彩。分号对应两个并列动作，并让末句同时自然承接前文。
