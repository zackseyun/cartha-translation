base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
translation:
  language: zh_hans
  text: 不过，人里面确有灵[a]；全能者的气息使他们有悟性。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诚然，一个人里面有灵；全能者的气息使他有悟性。”希伯来文从单数的“人”转为复数的“他们”；有些译法将两者统一为单数。
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: 不过……确有
  rationale: 该词在以利户的论述中兼有转折和强调作用；“不过”承接上文的纠正语气，“确有”保留其强调色彩。
- source_word: רוּחַ
  choice: 灵
  rationale: 这里指人里面非物质的生命或属灵要素；译作“灵”并与下半句的“气息”区分，可保留诗句的对应关系。
- source_word: הִיא
  choice: 有
  rationale: 此处代词用于名词句，汉语以存在句“有”表达最自然，不生硬直译为“它是”。
- source_word: בֶאֱנוֹשׁ
  choice: 人里面
  rationale: אֱנוֹשׁ 指必死的人或人类；“人里面”保留单数类称表达，同时符合现代汉语。
- source_word: וְנִשְׁמַת
  choice: 气息
  rationale: נְשָׁמָה 通常指气息，尤其可用于上帝赐生命的语境；这样也不会与 רוּחַ 一并译为“灵”而抹平词语差别。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是上帝的称号；译作“全能者”既清楚又符合庄重的现代汉语用法。
- source_word: תְּבִינֵם
  choice: 使他们有悟性
  rationale: 该使役形式表示使人明白、赐人理解力；“他们”保留希伯来文第三人称阳性复数后缀，与前面的单数类称“人”形成原文已有的数转换。
theological_decisions:
- issue: 人论用语与单复数转换
  choice: “人里面”用单数类称，“使他们”保留复数宾语
  alternative: “一个人里面……使他有悟性”或“人里面……使人有悟性”
  rationale: 希伯来文先用单数类称 אֱנוֹשׁ，随后以复数后缀“他们”泛指众人。正文保留这一转换，不将其统一成单数或改写成无数标记的泛称，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“悟性”比“聪明”更准确地表达理解和辨识能力；分号呈现诗句两部分紧密的平行关系。
