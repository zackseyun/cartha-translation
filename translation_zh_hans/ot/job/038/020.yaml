base_translation:
  language: en
  yaml_path: translation/ot/job/038/020.yaml
  text: that you might take it to its boundary[b][a], and that you might discern the paths to its house?
translation:
  language: zh_hans
  text: 好叫你把它带到它的边界[a]，又明白通往它的家的路径[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”及本节相应的所属表达承接上下文中的单数对象；在约伯记38:19—20成对提出的问题里，所指可能是光，也可能是黑暗。
    reason: cross_reference
  - marker: b
    text: 或译：“又明白通往它住处的道路。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 好
  rationale: 这里承接上节的问句，引出目的或结果；用“好”自然表达“以便、从而”的语气，不译成单纯表示原因的“因为”。
- source_word: תִקָּחֶנּוּ
  choice: 把它带到
  rationale: לקח可表示拿、带或领；第二人称阳性单数未完成式在反问中带可能或目的色彩，宾语后缀指上文成对提到的光或黑暗之一。
- source_word: אֶל גְּבוּלוֹ
  choice: 到它的边界
  rationale: גְּבוּל指边界、界限或疆域；“边界”保留空间意象，又不把它限定为政治疆界。
- source_word: וְכִי
  choice: 又
  rationale: 连接两个平行的目的性反问分句；“又”符合现代汉语诗体的并列结构。
- source_word: תָבִין
  choice: 辨明
  rationale: בין含理解、识别、洞察之意；“辨明”既保留认知意味，也适合与路径搭配。
- source_word: נְתִיבוֹת
  choice: 路径
  rationale: נְתִיבוֹת指小路、路径或道路；“路径”具体而自然，并保留复数的整体意象。
- source_word: בֵּיתוֹ
  choice: 它家
  rationale: בַּיִת字面为“房屋、家”；此处将光或黑暗拟人化为有自己的家，“它家”简洁地保留这一具体隐喻。
theological_decisions:
- issue: 阳性单数代词所指对象
  choice: 正文保留“它”，不明确指定为光或黑暗
  alternative: 明确译为“光”或“黑暗”
  rationale: 本节的代词承接38:19中平行提到的光与黑暗，语法形式本身未消除所指的张力；保留代词可避免替原文作出未经明说的判定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“好……又……吗”承接前文反问；“边界”“路径”“家”保留希伯来诗歌的空间意象和拟人手法。
