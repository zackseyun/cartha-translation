  yaml_path: translation/ot/job/038/037.yaml
  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
translation:
  language: zh_hans
  text: 谁能凭智慧数算云彩？又谁能倾倒天上的皮囊[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的瓶罐”。希伯来语此词可指盛液体的皮囊或罐子；这里以天上的容器描绘雨水。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁能
  rationale: 疑问代词引出反问；加“能”自然表达上下文所强调的能力。
- source_word: יְסַפֵּר
  choice: 数算
  rationale: 此处意为数点、计数；“数算”既贴近原文，也适合庄重的诗歌语体。
- source_word: שְׁחָקִים
  choice: 云彩
  rationale: 该词在诗歌中可指天空或云层；上下文谈论降雨，因此译作“云彩”。
- source_word: בְּחָכְמָה
  choice: 凭智慧
  rationale: 保留介词结构所表达的凭借或方式，不把原文较开放的关系限定为单纯的副词“明智地”。
- source_word: וְנִבְלֵי שָׁמַיִם
  choice: 天上的水囊[a]
  rationale: נֵבֶל可指盛液体的皮囊或罐子；在降雨语境中，“水囊”能保留天上容器的具体意象，同时让现代读者易于理解。脚注注明其词义范围。
- source_word: יַשְׁכִּיב
  choice: 倾倒
  rationale: 该使役形式直译为“使躺下”；以容器为宾语时，画面是将其放倒、倾斜，使其中之物倾泻出来。“倾倒”在中文中保留了这一具体动作。
theological_decisions:
- issue: 反问所强调的主体能力
  choice: 保留“谁能”的开放式反问
  alternative: 直接释义为“只有上帝能”
  rationale: 上下文显然指向上帝独有的智慧与权能，但原句并未直接给出答案，因此不在译文中补明，以保留诗歌张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两个平行问句保留原文结构；“凭智慧数算云彩”虽带诗意陌生感，但忠实保留原文意象与表达张力。
