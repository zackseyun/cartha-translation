  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: zh_hans
  text: 你能向云层[a]扬声，使丰沛的水[b]覆盖你吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“云”或“密云”。希伯来语名词为单数，也可特指浓密的雨云。
    reason: lexical_alternative
  - marker: b
    text: 或译“而丰沛的水覆盖你”。原文可强调水量丰沛、漫溢；两个分句也可能是并列关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: 你能……扬声
  rationale: 这是רוּם的使役形，在疑问句中询问约伯是否有能力把声音扬起；“你能……扬声”既保留能力挑战，也符合本章的庄严语气。
- source_word: לָעָב
  choice: 向云层
  rationale: עָב可指一片云或浓密的雨云。“云层”在现代汉语中自然，也能传达集合性的云体意象；单数及“密云”的可能性收入脚注。
- source_word: קוֹלֶךָ
  choice: 扬声
  rationale: קוֹלֶךָ直译为“你的声音”；与הֲתָרִים合译为“扬声”，简洁地表达“提高你的声音”。
- source_word: וְשִׁפְעַת מַיִם
  choice: 叫大量的水
  rationale: שִׁפְעָה表示丰盛、大量或涌流。译作“大量的水”保留数量重点，不预先限定为具有破坏性的洪水；“叫”表达两分句间自然的结果关系。
- source_word: תְּכַסֶּךָּ
  choice: 遮盖你
  rationale: כסה的加强形基本义为“遮盖、覆盖”，第二人称阳性单数后缀明确指向受话者。“遮盖你”保留原文意象，避免以“淹没”强化毁灭意味。
theological_decisions:
- issue: 两个分句之间的关系
  choice: 把第二分句译为第一分句所引发的结果：“叫大量的水……”。
  alternative: 按并列关系译为：“而大量的水遮盖你。”
  rationale: 本节以反问挑战人是否能命令天气。希伯来语连接词וְ可表示并列，也可在语境中承接结果；“叫”自然呈现隐含的使动结果，但脚注保留并列理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“扬声”保留诗歌色彩，“大量的水”则避免生僻或过度解释性的措辞。脚注标记均置于正文对应词句之后。
