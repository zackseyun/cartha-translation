lexical_decisions:
- source_word: הֲבָאתָ
  choice: 你曾到过……吗
  rationale: בוא 的 Qal 完成式第二人称阳性单数，配合疑问词 הֲ，构成直接向约伯发出的反问；“曾到过”自然表达抵达某处。
- source_word: עַד
  choice: 到
  rationale: 表示行动所达到的终点；与“到过”搭配，简洁自然。
- source_word: נִבְכֵי
  choice: 泉源
  rationale: 此罕见词在这里通常理解为海水涌出或发源之处；“泉源”既具体，又保留有关海之隐秘源头的诗意意象。另有“源头”等译法，列入脚注。
- source_word: יָם
  choice: 海
  rationale: 普通名词，指海洋；汉语无须另加定冠词。
- source_word: וּבְחֵקֶר
  choice: 在……的隐秘之处
  rationale: חֵקֶר 可指探究、穷究，也可在语境中指难以探知的深处或极处。这里与表示行走的动词搭配，译为地点性的“隐秘之处”，同时以脚注保留“极深处”的可能。连接词 וּ 按并列反问译出，不强行改为“或”。
- source_word: תְּהוֹם
  choice: 深渊
  rationale: 指海洋深处或原初深水。“深渊”保留诗歌力度与可能的宇宙论回响，又不特指刑罚之地。
- source_word: הִתְהַלָּכְתָּ
  choice: 行走
  rationale: הלך 的 Hitpael 完成式第二人称阳性单数，可指来回行走、遍行；“行走”保留在不可到达之地穿行的鲜明比喻。
