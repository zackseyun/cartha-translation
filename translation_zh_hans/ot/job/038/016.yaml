  text: 你曾到过海的泉源[a]吗？你又曾在深渊的隐秘之处[b]行走吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉源”或译“源头”。
    reason: lexical_alternative
  - marker: b
