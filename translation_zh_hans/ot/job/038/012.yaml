  text: הְֽ֭/מִ/יָּמֶי/ךָ צִוִּ֣יתָ בֹּ֑קֶר ידעתה שחר מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/012.yaml
  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: zh_hans
  text: 自你有生以来[b]，你可曾命令早晨，又使黎明知道自己的位置[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……知道”也可译作“让……认准”；原文动词采用使役形式。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从你的日子”；这里是指“自你有生以来”或“在你一生中任何时候”。
    reason: cultural_note
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: 自你有生以来
  rationale: 介词 מִן 与“你的日子”连用，在疑问句中指约伯自出生以来的整段人生；此译法既保留原文的时间意象，也符合现代汉语表达。
- source_word: צִוִּיתָ
  choice: 命令
  rationale: צוה 通常表示发出具有权威的命令；“命令”保留上帝以受造界为对象向约伯发问的力度。
- source_word: בֹּקֶר
  choice: 早晨
  rationale: בֹּקֶר 指早晨；原诗将早晨人格化，仿佛它能接受命令。
- source_word: יָדַעְתָּה
  choice: 使……知道
  rationale: 此处 ידע 为使役词形，直译为“使……知道”，既保留使役意义，也保留黎明受教示的人格化形象。
- source_word: שַׁחַר
  choice: 黎明
  rationale: שַׁחַר 指破晓或黎明；“黎明”自然庄重，并与前半句的“早晨”形成近义而不完全相同的诗歌平行。
- source_word: מְקוֹמוֹ
  choice: 自己的位置
  rationale: מָקוֹם 的基本义是“地方、位置”；反身领属表达清楚地指黎明所属的位置，同时不额外加入“指定”等解释性成分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体问句。“你可曾”体现反问语气；“又”连接两个平行分句。脚注标记移至各自所解释的短语之后，以避免歧义。
