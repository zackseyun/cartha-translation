  yaml_path: translation/ot/job/038/006.yaml
  text: On what were its bases sunk[a], or who laid its cornerstone[b],
translation:
  language: zh_hans
  text: 它的基座沉在什么上面[a]？又或是谁安放了它的房角石[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基座”也可译作“根基”或“底座”；原文指建筑物底部的承托构件。“沉”也有嵌入、固定之意。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“谁投下了它角上的石头”；这里是安放房角石的建筑用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: 在什么上面
  rationale: 保留介词与疑问词构成的承托之问，中文自然地表达为“在什么上面”。
- source_word: אֲדָנֶיהָ
  choice: 它的基座
  rationale: אֶדֶן可指底座、基座或承托构件；“基座”保留具体的建筑意象，又不把词义泛化为抽象的“根基”。
- source_word: הָטְבָּעוּ
  choice: 沉
  rationale: 该词为טבע的使役被动式，描写基座被沉入或嵌入；“沉在”既保留其鲜明意象，也符合现代汉语表达。
- source_word: אוֹ
  choice: （分作后一问）
  rationale: 希伯来语אוֹ连接两个并列的反问。中文分成两个连续问句即可自然体现其选择、递进关系，无须机械译出“或”。
- source_word: מִי
  choice: 是谁
  rationale: 直接保留疑问代词，并以“是”加强中文反问句的自然语势。
- source_word: יָרָה
  choice: 安放
  rationale: 该动词本义可为投、掷；在建筑语境中指把房角石置于其位。“安放”传达动作，同时较“投下”更符合中文建筑表达。
- source_word: אֶבֶן פִּנָּתָהּ
  choice: 它的房角石
  rationale: 直译为“它角上的石头”；“房角石”是自然且庄重的建筑用语，并保留指向大地的阴性单数后缀“它的”。
theological_decisions:
- issue: 以建筑比喻描写大地的受造
  choice: 保留“基座”和“房角石”的完整建筑意象
  alternative: 意译为“是什么支撑着大地”
  rationale: 本节是上帝向约伯发出的诗性诘问；保留具体建筑意象，既忠于希伯来诗歌，也避免加入现代宇宙论解释。
- issue: אוֹ在两个反问之间的表达
  choice: 用两个连续问句呈现，不明译“或”
  alternative: 译作“或是谁安放了……”
  rationale: 原文的אוֹ确实连接两个问题，但现代汉语在连续诘问中省去“或”更自然，逻辑关系仍清楚，也未消除原文的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗性问句。以“基座”“房角石”保留具体建筑比喻；分成两个问句，使汉语节奏清晰有力。
