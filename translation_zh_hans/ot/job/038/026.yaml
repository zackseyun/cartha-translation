  text: לְ֭/הַמְטִיר עַל אֶ֣רֶץ לֹא אִ֑ישׁ מִ֝דְבָּ֗ר לֹא אָדָ֥ם בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/026.yaml
  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: zh_hans
  text: 使雨降在无人的地上[a]，降在没有人的旷野；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有人的地上……其中没有人的旷野。”希伯来文先后使用两个相关却不同的词：אִישׁ（常指男子或个体的人）和אָדָם（人；人类）。本节两者都指无人之处。
    reason: 说明原文两个相关但不同的词，并提供贴近原文结构的译法；避免把前者误解为仅指男性，或把后者误解为整个人类物种。
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: 使雨降
  rationale: 这是מטר的使役形不定式，表达“使雨降下”。“使雨降”既保留使役意义，也符合现代汉语诗体表达；句首不定式承接上文的目的关系。
- source_word: עַל אֶרֶץ
  choice: 在……地上
  rationale: עַל表示雨降落所及之处；אֶרֶץ在此指一片地域，并非整个世界。汉语“在……地上”自然表达这一地点关系。
- source_word: לֹא אִישׁ
  choice: 没有男人
  rationale: אִישׁ是阳性单数，可指“男人”或个体的“人”。正文采用“男人”，以免与下半句较具人类统称意味的אָדָם完全合并，并用脚注说明另一种译法。
- source_word: מִדְבָּר
  choice: 旷野
  rationale: מִדְבָּר通常指无人耕作或居住的荒野、草原地带，不必特指沙漠；“旷野”范围适切，也符合《约伯记》的诗歌语体。
- source_word: לֹא אָדָם בּוֹ
  choice: 没有人类的
  rationale: אָדָם在此泛指人类，与前面的אִישׁ形成近义而不完全相同的平行；בּוֹ的“其中”之意在汉语定语结构中自然体现。
theological_decisions:
- issue: אָדָם在泛指人类语境中的译法
  choice: 人类
  alternative: 人；世人
  rationale: 此处不是指名为亚当的人，也不专指男性，而是泛指人类。译作“人类”保留其总体性，并维持它与前一分句אִישׁ之间的词义差别。
translation_notes:
  register: 采用现代、庄重的诗体汉语。保留两分句的平行结构，并以“男人／人类”显明原文אִישׁ与אָדָם的差别；脚注同时提供更自然但会淡化该差别的“无人／没有人”译法。分号表示本节在诗句与上文中的延续关系。
