- from: 使雨降在没有男人的地上[a]，降在没有人类的旷野；
  to: 使雨降在无人的地上[a]，降在没有人的旷野；
  rationale: 修订以“无人／没有人”准确表达本节所描写的无人之地，并改正“没有人类”这一不自然且可能误导的汉语。使役意义、“地／旷野”的平行及诗体句法均予保留；两个希伯来词之间的词汇差异以脚注说明，而不以中文中不合语境的“男人／人类”强行区分。
