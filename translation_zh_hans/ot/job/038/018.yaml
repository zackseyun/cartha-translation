  text: Have you comprehended the expanse of the earth? Tell me, if you know it all.
translation:
  language: zh_hans
  text: 你可曾领会大地的广阔？若你全都知道，就说吧！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: 你曾察看……吗
  rationale: 该词在此指用心观察、考察或领会；译作“察看”既保留认知意味，也自然地配合“大地的广阔”。
- source_word: רַחֲבֵי אָרֶץ
  choice: 大地的广阔
  rationale: 复数构式可指大地广阔的范围或幅员；此译保留空间意象，不把含义过度限定为“边界”或“尺寸”。
- source_word: הַגֵּד
  choice: 说吧
  rationale: 命令式在反问语境中带有挑战意味；“说吧”简洁自然，并保留原文直接语气。
- source_word: כֻלָּהּ
  choice: 全都
  rationale: 阴性后缀最自然地回指“大地”，整体意思是对大地的一切或全貌都知道；“全都”保留一定的指代开放性。
theological_decisions:
- issue: 上帝反问所强调的人类知识限度
  choice: 不补入“告诉我”或解释性措辞，仅以“你若全都知道，就说吧”呈现挑战
  alternative: 你若知道这一切，就告诉我
  rationale: 原文以反问揭示受造者知识的有限；简洁直译可保留其修辞张力，而不额外规定说话对象或知识内容。
translation_notes:
  register: 采用庄重而自然的现代普通话。两个问答式分句保留原文的反问与挑战语气；不添加脚注，因为正文足以表达主要语义，且无须消解“全都”的回指范围。
