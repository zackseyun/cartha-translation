base_translation:
  language: en
  yaml_path: translation/ot/job/038/025.yaml
  text: Who has cut a channel for the flood[a], or a path for the thunderbolt,
translation:
  language: zh_hans
  text: '谁为暴雨开出水道，[a]

    为雷电辟出路径？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴雨”也可译作“洪流”；“雷电”原文较直译为“雷声的闪电”或“众声的闪电”。
    reason: 保留 שֶׁטֶף 的语义范围，以及罕见短语 חֲזִיז קֹלוֹת 的字面构造和解释空间。
lexical_decisions:
- source_word: פִלַּג
  choice: 开出
  rationale: 该动词有分开、劈开之意；与“水道”搭配时，“开出”自然表达劈开而形成通道的图景。
- source_word: שֶּׁטֶף
  choice: 暴雨
  rationale: 此词可指奔涌的洪水、急流或倾泻而下的暴雨。这里与为水流开出的“水道”相配，“暴雨”能自然表现风暴降水；“洪流”这一可能含义收入脚注。
- source_word: תְּעָלָה
  choice: 水道
  rationale: 指供水流通过的沟渠或通道。“水道”简明自然，也保留诗句中的水流意象。
- source_word: דֶרֶךְ
  choice: 路径
  rationale: 基本义为道路、途径；在与“水道”平行的诗句中，指雷电运行的路线，译作“路径”贴切。
- source_word: חֲזִיז
  choice: 雷电
  rationale: 这是罕见词，可理解为闪电或霹雳。与表示声音、雷声的 קֹלוֹת 连用时，“雷电”在现代汉语中既自然又能保留光与声交织的风暴意象。
- source_word: קֹלוֹת
  choice: 雷电（合译）
  rationale: 该词字面意为“声音”或“众声”，在气象语境中常指雷声。与 חֲזִיז 合译为“雷电”，避免生硬的“众声的闪电”，其较直译形式在脚注中说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以“开出／辟出”和“水道／路径”呈现希伯来诗歌的平行结构；不把罕见气象用语的含义限定得过窄。
