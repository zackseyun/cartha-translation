lexical_decisions:
- source_word: כָּאֶבֶן
  choice: 像石头一样
  rationale: 前缀 כ 表示比较；译作“像石头一样”保留明喻，避免将其强化为变成石头。
- source_word: מַיִם
  choice: 水
  rationale: מַיִם 虽为复数形式，在希伯来语中通常作物质名词；现代汉语用“水”最自然。
- source_word: יִתְחַבָּאוּ
  choice: 凝结
  rationale: 该动词通常意为“藏起来”，但在“像石头一样”及下句冻结意象的平行结构中，描写水因严寒收缩凝固。“凝结”传达语境中的结果，同时以脚注保留字面歧义。
- source_word: וּפְנֵי
  choice: 表面
  rationale: “……的面”用于水域时惯指表面；“表面”符合现代汉语表达。
- source_word: תְהוֹם
  choice: 深渊
  rationale: 此词指深邃的水域或原初深水；“深渊”简洁保留其宇宙诗歌意象，不额外限定为海洋。
- source_word: יִתְלַכָּדוּ
  choice: 冻结了
  rationale: 该词本义涉及被捉住、扣合或牢牢联结；在寒冷使水凝固的语境中，“冻结了”自然地表达其含义，更字面的说法收入脚注。
