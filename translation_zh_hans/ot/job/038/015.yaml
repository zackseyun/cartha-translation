  yaml_path: translation/ot/job/038/015.yaml
  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: zh_hans
  text: 恶人的光被夺去；高举的手臂[a]也被折断[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “手臂”在这里可能象征力量或权势，尤其是暴力的力量。
    reason: lexical_alternative
  - marker: b
    text: 或译：“将被折断。”希伯来语的未完成式既可理解为将来，也可理解为生动的现在。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: 被阻绝
  rationale: מנע的尼法勒未完成式表示“被阻止、被扣留”。“被阻绝”保留被动语态，也符合黎明使恶人失去可乘之机的语境。
- source_word: מֵרְשָׁעִים
  choice: 恶人的
  rationale: 介词מִן表达光与恶人分离，即光不再供他们利用。中文以“恶人的光被阻绝”自然表达这一关系，并与后面的אוֹרָם相连。
- source_word: אוֹרָם
  choice: 光
  rationale: 该词直译为“他们的光”，其中复数代词指恶人。中文“恶人的光”已明确所属关系，无须重复“他们的”。
- source_word: וּזְרוֹעַ
  choice: 膀臂
  rationale: זְרוֹעַ本义为“手臂”，诗歌中常象征力量或权势。“膀臂”保留具体意象，并具有庄重而易懂的经文语体。
- source_word: רָמָה
  choice: 高举的
  rationale: 该词在此修饰“膀臂”，描绘举起的手臂，可暗示傲慢、威吓或准备施暴；“高举的”保留这些可能含义而不加以限定。
- source_word: תִּשָּׁבֵר
  choice: 被折断
  rationale: שׁבר的尼法勒未完成式表示“被折断”。在此可作为生动的诗意现在时，描述黎明对恶人的作用。
theological_decisions:
- issue: “高举的膀臂”的象征意义
  choice: 正文保留身体意象，脚注说明其可能象征强力，尤其是暴力
  alternative: 直接译为“强暴的势力”
  rationale: 原文以具体意象表达恶人的力量，可能兼有傲慢、威吓和暴力的意味；不在正文中将其收窄为单一解释。
- issue: תִּשָּׁבֵר的时态
  choice: 译作生动的现在描述“被折断”
  alternative: “将被折断”
  rationale: 希伯来语未完成式既可有将来意义，也可在诗歌语境中生动描述惯常或正在呈现的情景；正文顺应上下文采用现在描述，脚注保留将来译法。
translation_notes:
  register: 采用现代、庄重而简洁的诗体表达。“阻绝”比口语化的“不给”更能体现原文被动形式；“膀臂”保留身体意象及其象征张力。
