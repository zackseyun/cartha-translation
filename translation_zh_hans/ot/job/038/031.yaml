base_translation:
  language: en
  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: zh_hans
  text: 你能系紧昴星团的锁链[a][b]，或解开猎户座的绳索[c]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锁链”也可译作“束带”；希伯来语的两个平行名词都描绘天体间的束缚或联结。
    reason: lexical_alternative
  - marker: b
    text: 有些传统译本把 מַעֲדַנּוֹת 译作“美好的影响”，但这个希伯来词更可能指锁链、束带或联结物。
    reason: lexical_alternative
  - marker: c
    text: “猎户座”所译的希伯来词 כְּסִיל 在普通用法中也可意为“愚顽人”，但这里与昴星团并列，应是星座名。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְקַשֵּׁר
  choice: 你能系紧
  rationale: 疑问词与加强语干未完成式第二人称阳性单数组成反问，强调人的能力有限。“系紧”自然承接锁链意象，也与下半句“解开”形成对照。
- source_word: מַעֲדַנּוֹת
  choice: 锁链
  rationale: 这是罕见的复数名词，可能指束带、联结物或锁链；结合动词“系紧”及下半句“绳索”，采用具体而易懂的“锁链”，但以脚注保留“束带”等可能。
- source_word: כִּימָה
  choice: 昴星团
  rationale: 在此为天文名称，通常认定为昴星团；采用现代汉语通行的天文学名称。
- source_word: מֹשְׁכוֹת
  choice: 绳索
  rationale: 该词指牵引之物，可理解为绳索或束带；“绳索”具体自然，并与上半句的捆系意象平行。
- source_word: כְּסִיל
  choice: 猎户座
  rationale: 在与昴星团平行的天文语境中，通常指猎户座；普通名词义虽可为“愚顽人”，但此处星座义最符合上下文。
- source_word: תְּפַתֵּחַ
  choice: 解开
  rationale: 该加强语干动词基本义为“打开”；以绳索为宾语时，汉语惯用“解开”，既保存具体动作，也与“系紧”对应。
