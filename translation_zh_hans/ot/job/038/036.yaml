  yaml_path: translation/ot/job/038/036.yaml
  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: zh_hans
  text: 谁把智慧放在人的内心，或把悟性赐给人的心智[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可译：“谁把智慧放在隐秘之处，或把悟性赐给公鸡？”第二个词也可能指一种鸟，传统上常译为“公鸡”，有时译为“朱鹭”。
    reason: 保留两个罕见词的另一种可能解释，以及本节可能由人的内在官能转指鸟类本能的歧义。
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 疑问代词，引出上帝的反问。
- source_word: שָׁת
  choice: 放在
  rationale: 表达“放置、安放”，与后半句的“赐给”形成自然的诗意平行。
- source_word: בַּטֻּחוֹת
  choice: 在人的内心里
  rationale: 该词含义困难，可能指隐秘的内部或内在部分；译作“人的内心里”保留内在意象，又避免按字面译成可能误导现代读者的身体器官。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 该词的常规对应，也与后半句“悟性”相配。
- source_word: אוֹ
  choice: 谁
  rationale: 原文为“或”，连接两个平行问句；汉语分句重起用“谁”更自然，问号体现其递进并列关系。
- source_word: נָתַן
  choice: 赐给
  rationale: 在神为施予者的语境中，“赐给”庄重自然，并准确表达给予。
- source_word: לַשֶּׂכְוִי
  choice: 给人的心智
  rationale: 该罕见词意义有争议；诗句与“内心”及“智慧”平行，支持理解为人的内在认知官能。传统的鸟类解释保留在脚注中。
- source_word: בִינָה
  choice: 悟性
  rationale: 表达理解、洞察和辨别的能力，与“智慧”相近而不完全重合。
theological_decisions:
- issue: 神圣讲话的智慧语境中两个疑难词所指为何
  choice: 将两词理解为人的内在部分和认知官能
  alternative: 两词可能指隐秘之处及公鸡或朱鹭等鸟类，上帝赋予它们本能性的知识
  rationale: “内心—心智”与“智慧—悟性”的诗意平行支持人的内在官能这一理解；但动物解释历史悠久且在词汇上仍有可能，因此用脚注保留，不把歧义悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“内心”与“心智”形成自然平行；分成两个问句，使上帝的反问语气清楚有力。
