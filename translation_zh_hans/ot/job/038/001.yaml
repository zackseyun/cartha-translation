  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: zh_hans
  text: '于是，雅威从暴风中回答约伯，说：[a]


    [a] “暴风”也可译为“旋风”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴风”也可译为“旋风”。
    reason: 保留סְעָרָה在“猛烈风暴”与较具体的“旋风”之间的合理词义选择。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在此叙事性连续式中表示“回答、回应”；“回答”自然地承接约伯先前的发言。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，不以“主”这一称号替代。
- source_word: אֶת אִיּוֹב
  choice: 约伯
  rationale: אֶת是直接宾语标记，中文无需另译；人名按通行形式译为“约伯”。
- source_word: מִן־הַסְּעָרָה
  choice: 从暴风中
  rationale: סְעָרָה可指猛烈的风暴、暴风或旋风；“暴风”既保留其强烈意象，又不把具体形态限定为旋风。介词מִן在此表示声音或发言传出的来源，译作“从……中”。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר意为“说”；与前面的“回答”合译为中文自然的“回答……说”，同时保留两个动词的叙事功能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用的是神的专名，而非“主”的称号；采用“雅威”以直接反映该名通常重构的读音，同时不把专名替换为称号。
- issue: 神显场景中סְעָרָה的具体意象
  choice: 暴风
  alternative: 旋风
  rationale: 该词可广指猛烈风暴，也可理解为旋风。正文用较宽泛的“暴风”，脚注保留较具体且传统的“旋风”，避免过度限定原文意象。
translation_notes:
  register: 采用现代、庄重而简洁的叙事语体。“于是”承接前文；“回答约伯说”虽略具经文风格，但在现代中文中仍自然清楚，并保留原文וַיַּעַן与וַיֹּאמַר的双重表达。
