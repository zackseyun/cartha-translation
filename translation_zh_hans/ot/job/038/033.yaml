base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: zh_hans
  text: 你知道诸天的定律吗？你能在地上确立它的权柄吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它的权柄”也可译作“它的统治”或“它的管辖”。希伯来语的代词后缀为单数，可能将“诸天”视为一个整体来指称。
    reason: 说明מִשְׁטָרוֹ的词义选择，以及其单数后缀与形式为复数的“诸天”之间的语法张力。
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: 你知道……吗
  rationale: 疑问词הֲ与ידע的第二人称阳性单数完成式在此询问约伯是否具备这种知识；现代汉语用“你知道……吗”自然传达这一质问。
- source_word: חֻקּוֹת
  choice: 定律
  rationale: חֻקּוֹת可指所规定的界限、律例或固定秩序；在诸天的语境中，“定律”既体现既定规范，也避免使人误解为人间法规。
- source_word: שָׁמָיִם
  choice: 诸天
  rationale: “诸天”保留希伯来语形式与宏阔、庄重的宇宙语域，比单纯译作“天空”更贴合上下文。
- source_word: אִם
  choice: 你能……吗
  rationale: אִם在这里承接前一疑问句，引出平行的第二个反问；译成“你能……吗”符合现代汉语表达并保留挑战意味。
- source_word: תָּשִׂים
  choice: 确立
  rationale: שׂים的基本义是放置、设立；与表示管辖的מִשְׁטָר搭配时，“确立”自然表达使某种治理生效。
- source_word: מִשְׁטָרוֹ
  choice: 它的管辖
  rationale: מִשְׁטָר表示管辖、统治或权柄；后缀为第三人称阳性单数，因此正文保留“它的”，让它集体指向“诸天”，不擅自改成复数。
- source_word: בָאָרֶץ
  choice: 在地上
  rationale: 此处בָאָרֶץ指地上的领域；“在地上”简洁自然，并与诸天形成对应。
theological_decisions:
- issue: 诸天秩序的性质
  choice: 译文表达受定律约束并具有管辖作用的宇宙秩序，但不把这种秩序具体解释为占星决定论。
  alternative: 将本节明确理解为星宿或天体对地上事务具有占星式影响。
  rationale: 上下文确实涉及星辰与诸天，但本节词语本身强调固定的定律和管辖；译文保留这种宇宙治理意象，不加入原文没有明说的占星理论。
- issue: מִשְׁטָרוֹ单数后缀的所指
  choice: 正文译作“它的管辖”，保留单数形式，使“它”可把“诸天”作为一个整体来指称。
  alternative: 按汉语对复数先行词的习惯译作“它们的管辖”，或将后缀理解为另一个隐含的单数所指。
  rationale: 马所拉文本后缀明确为阳性单数，而先行的“诸天”在形式上是复数；保留“它的”可呈现原文这一张力，脚注再说明可能的集体指称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诸天”保持诗歌性的宏阔语域；“定律”和“管辖”分别传达固定秩序与治理意味。两个平行问句保留上帝向约伯发出的反问力度。
