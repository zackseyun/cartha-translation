  yaml_path: translation/ot/job/038/024.yaml
  text: By what way is light divided[b][a], or the east wind scattered over the earth?
translation:
  language: zh_hans
  text: 光[b]是沿着哪条路径分开的？东风又是沿着哪条路径吹遍大地的？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“光分开的路径在哪里？”希伯来语疑问词既可理解为询问地点，也可理解为询问方式或途径。
    reason: lexical_alternative
  - marker: b
    text: “光”或译“闪电”。希伯来语אוֹר通常指“光”，但有些解释者按本段风暴语境将其具体理解为与风暴有关的闪电。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: 经由哪条
  rationale: 该疑问短语与“路径”连用，可询问所在或途径；正文采用“经由哪条”，自然地保留借何路径的诗意发问。
- source_word: הַדֶּרֶךְ
  choice: 路径
  rationale: דֶּרֶךְ常指道路、路径；此处“路径”既符合宇宙景象，也比具体的“马路”更恰当。
- source_word: יֵחָלֶק
  choice: 分开
  rationale: חלק的Niphal形态表达被分开、分配或自行分散；“分开”简洁保留其被动或反身意味。
- source_word: אוֹר
  choice: 光
  rationale: אוֹר通常意为“光”。上下文虽使一些解释者理解为“闪电”，但正文采用未受限定的常用义，并以脚注保留另一可能。
- source_word: יָפֵץ
  choice: 散布
  rationale: פוץ的Hiphil形态有使之散开、驱散之意；中文以“散布”表达风遍及大地的图景，同时避免过度补明未明说的施事者。
- source_word: קָדִים
  choice: 东风
  rationale: קָדִים在气象语境中通常指从东方或旷野吹来的东风，而不只是方位“东方”。
- source_word: עֲלֵי אָרֶץ
  choice: 在大地上
  rationale: 介词与אֶרֶץ合用可指在地上、遍及地面；“在大地上”符合本章神讲话语的广阔尺度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以两个相连的问句呈现希伯来诗句的平行结构。“又是怎样”承接前句疑问范围，不额外指定东风被谁吹散。
