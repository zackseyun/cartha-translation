base_translation:
  language: en
  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: zh_hans
  text: 你能发出一道道闪电[a]，使它们前去，并对你说：“我们在这里！”吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为复数；经文把闪电描绘成听命的使者。
    reason: source_form_and_personification
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: 你能发出……吗
  rationale: 疑问词 הֲ 与使役词干未完成式第二人称阳性单数构成对约伯的反问；“你能”自然表达上下文中对其能力的挑战，“发出”保留使役含义。
- source_word: בְּרָקִים
  choice: 一道道闪电
  rationale: 该名词为复数，指多次闪现的闪电或一道道电光；量词重叠既在现代汉语中体现复数，也便于保留下文把闪电拟人化为听命使者的诗意。
- source_word: וְיֵלֵכוּ
  choice: 让它们出去
  rationale: 连接词与未完成式承接“发出”，可表达随之发生或预期的行动；“让……出去”在汉语中自然呈现差遣后行动的关系，同时不把目的或结果限定得过死。
- source_word: וְיֹאמְרוּ
  choice: 又对你说
  rationale: 保留闪电开口回应的拟人化形象；“又”自然衔接连续动作。
- source_word: לְךָ
  choice: 对你
  rationale: 准确表达介词 לְ 与第二人称阳性单数后缀，所指为约伯，无须增译。
- source_word: הִנֵּנוּ
  choice: 我们在这里
  rationale: 这是表示在场、听命或准备就绪的惯用回应；译文自然现代，同时保留其作为受命使者回应的语气。
theological_decisions:
- issue: 神讲话时对闪电的拟人化描写
  choice: 保留闪电“出去”并说“我们在这里”的拟人化表达。
  alternative: 改写为单纯描述自然现象受神控制，删去或弱化说话的形象。
  rationale: 希伯来文本明确赋予闪电行动与言语，以诗歌方式彰显受造界听从神的命令。保留这一张力并不要求把闪电理解为具有真实人格。
translation_notes:
  register: 采用现代、庄重而清楚的问句。“一道道”体现希伯来语复数；保留连续动作和拟人化，不用古雅的“看哪，我们在此”。
