  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: zh_hans
  text: 你能按其时令领出玛扎罗特[a]，又引导阿伊什[b]和她的众子吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛扎罗特”是一个罕见的希伯来天文术语，可能指众星座或黄道十二宫。
    reason: lexical_alternative
  - marker: b
    text: “阿伊什”是希伯来语中的星名或星座名；有些传统译作“大角星”，许多人则认为它指“大熊座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֹצִיא
  choice: 你能……领出
  rationale: יצא的使役式在此表示使天体出现或出行；“领出”既保留使役和运行的意象，也适合反问语气。
- source_word: מַזָּרוֹת
  choice: 玛扎罗特
  rationale: 这是罕见且所指不确定的希伯来天文术语。正文采用音译，以免武断地限定为星座或黄道十二宫，并在脚注说明可能含义。
- source_word: בְּעִתּוֹ
  choice: 按其时令
  rationale: 该短语指适宜或指定的时间；“按其时令”自然地表达天象依季节出现的意思，同时保留原文单数代词的含蓄性。
- source_word: וְעַיִשׁ
  choice: 阿伊什
  rationale: 这是所指不确定的星名或星座名。音译可避免把它无根据地确定为大角星或大熊座，可能的辨认留在脚注中。
- source_word: עַל בָּנֶיהָ
  choice: 和她的众子
  rationale: 原文保留女性拟人和亲属隐喻；在天文语境中，“众子”很可能指伴随的星，但正文不将这一解释明说。介词在这里表达伴随关系。
- source_word: תַנְחֵם
  choice: 引导
  rationale: נחה的使役式意为带领、引导；“引导”适合描写星群在天空中的运行。词尾为复数宾语，中文用“阿伊什和她的众子”明确承接。
