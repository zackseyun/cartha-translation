  yaml_path: translation/ot/job/038/013.yaml
  text: that it might take hold of the edges of the earth[a], and the wicked be shaken out of it[b],
translation:
  language: zh_hans
  text: 使晨光抓住大地的边缘[a]，把恶人从地上抖落[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地的角落”。希伯来文直译为“大地的翅膀”，是指大地外缘或尽头的诗歌意象。
    reason: lexical_alternative
  - marker: b
    text: 这里把大地描绘成一件可抖动的衣物：晨光抓住它，将恶人像尘土一样从上面抖落。
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: 使晨光抓住
  rationale: 不定式前的 לְ 承接上文，表达目的或结果。动词 אחז 意为“抓住、握住”；为使本节在中文中能够独立理解，补出上文的主语“晨光”。
- source_word: בְּכַנְפוֹת
  choice: 大地的边缘
  rationale: כָּנָף 本义为“翅膀”，用于大地时指其外缘、尽头。“边缘”在现代汉语中自然，也保留空间性的诗歌意象；脚注说明其字面图像及“角落”的译法。
- source_word: הָאָרֶץ
  choice: 大地
  rationale: 本段谈论创造与晨光，具有宇宙性的语境，因此译作“大地”，而非局部的“土地”。
- source_word: וְיִנָּעֲרוּ
  choice: 抖落
  rationale: נער 的尼法勒式表达被摇出、抖掉。中文用“把……抖落”的处置式主动表达，更自然地再现原文中从大地除去恶人的图像。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 该词在此作名词，指邪恶的人；“恶人”简洁、庄重，并保留原文的道德范畴。
- source_word: מִמֶּנָּה
  choice: 从地上
  rationale: 阴性单数后缀回指“大地”。中文明确复现所指对象，并与“抖落”自然搭配；“地上”侧重从大地表面被除去的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“使……，把……”承接上文的目的关系；补出“晨光”以避免单节中文主语含混，同时保留大地被抓住并抖动的强烈诗歌意象。
