  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
translation:
  language: zh_hans
  text: 当晨星一同欢唱，上帝的众子[a]全都欢呼时吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的众子”也可理解为“天上的众生”或“天使”。希伯来文直译为“上帝的众子”。
    reason: 说明正文所保留的希伯来语称谓及其可能所指，避免在正文中消除原文的解释空间。
lexical_decisions:
- source_word: בְּ/רָן
  choice: 那时……欢唱
  rationale: 介词 בְּ 加不定式在这里引出时间背景；רנן 表示喜乐高歌或发出欢快呼声。“那时……欢唱”自然承接上文的问句，也与下半句“欢呼”形成诗体平行。
- source_word: יַחַד
  choice: 一同
  rationale: יַחַד 表示共同、同时；“一同”简洁自然，并保留群体齐声的意味。
- source_word: כּוֹכְבֵי בֹקֶר
  choice: 晨星
  rationale: 该构造短语直译为“早晨的星辰”；“晨星”是自然凝练的现代汉语诗性表达，保留原文意象。
- source_word: וַ/יָּרִיעוּ
  choice: 欢呼
  rationale: ריע 的使役形表示发出呼喊，在此庆贺语境中带有喜乐意味；“欢呼”既准确又与“欢唱”协调。
- source_word: כָּל
  choice: 全都
  rationale: כָּל 强调这一群体无一例外；“全都”在汉语中清楚体现其整体性。
- source_word: בְּנֵי אֱלֹהִים
  choice: 上帝的众子
  rationale: 原文直译为“上帝的众子”。正文保留这一具有神学意义的源语表达，不直接解释成“天使”或“天上的众生”。“众子”比“儿子们”更符合庄重诗体，也表明是一个群体。
theological_decisions:
- issue: בְּנֵי אֱלֹהִים 所指的身份
  choice: 正文译作“上帝的众子”
  alternative: “天上的众生”“天使”或“神圣众生”
  rationale: 在《约伯记》的语境中，这一称呼很可能指天上议会中的成员，但原文本身使用“上帝的众子”，并未直接使用“天使”一词。保留字面表达可避免把一种解释写入正文，同时让读者看见原文的神学张力。
translation_notes:
  register: 采用现代、庄重而有诗意的标准普通话。“晨星一同欢唱”与“上帝的众子全都欢呼”保持希伯来诗歌的平行结构；问号承接上文连续的反问。脚注标记置于“欢唱”之后，与所提供的咨询层位置一致，但脚注内容实际解释“上帝的众子”。
