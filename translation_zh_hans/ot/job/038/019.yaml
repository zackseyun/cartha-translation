  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: zh_hans
  text: 通往光所居之处的路在哪里？黑暗的所在又在哪里？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译作：“哪一条路通往光所居之处？黑暗的所在又在哪里？”
    reason: 保留原文以“哪一条／哪里”与“路”紧密相连的较形式化问法；正文则采用更自然的汉语语序。
lexical_decisions:
- source_word: אֵי זֶה
  choice: 在哪里
  rationale: 此疑问短语可问地点或方向；结合“路”和“所在”，译作“在哪里”既自然，也保留空间性的追问。
- source_word: הַדֶּרֶךְ
  choice: 路
  rationale: דֶּרֶךְ 可指道路、路径或途径；“路”简洁自然，并保留通往某处的具体意象。
- source_word: יִשְׁכָּן
  choice: 居住之处
  rationale: שׁכן 意为居住、栖居。将“光居住”名词化为“光居住之处”，既保留拟人化意象，也使“……的路在哪里”符合现代汉语表达。
- source_word: אוֹר
  choice: 光
  rationale: 标准对应词；本节中与“黑暗”构成宇宙性的对照。
- source_word: וְחֹשֶׁךְ
  choice: 黑暗……又
  rationale: 用“又”呈现希伯来语连接词及两个问句之间的平行关系，使汉语衔接自然。
- source_word: מְקוֹמוֹ
  choice: 黑暗的所在
  rationale: מָקוֹם 意为“地方、所在”，第三人称单数后缀回指“黑暗”；明确译出“黑暗的所在”，避免汉语代词指向含混。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“居住之处”保留光被拟人化为有居所的诗歌意象；两句以“又”构成平衡。
