  yaml_path: translation/ot/job/038/022.yaml
  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: zh_hans
  text: 你曾进入雪的库房[a]，或见过冰雹的库房吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “库房”也可译作“宝库”；下半句同。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: 你曾进入
  rationale: 疑问词הֲ与בוא第二人称阳性单数完成式构成反问；介词אֶל表示朝向。结合“库房”这一地点意象，译为“曾进入”既自然，也保留实际进入某处的画面。
- source_word: אֹצְרוֹת
  choice: 库房
  rationale: אֹצָר可指储藏物品的库房，也可指宝库。“库房”清楚呈现雪和冰雹如同被储存起来的具体比喻，同时避免“宝库”可能偏重珍宝价值的联想。
- source_word: שָׁלֶג
  choice: 雪
  rationale: 该词是“雪”的常用气象用语。
- source_word: וְ
  choice: 或
  rationale: 原文连接两个并列的反问分句。汉语用“或”能自然表达成对追问；原文的连接关系也可理解为简单并列。
- source_word: בָּרָד
  choice: 冰雹
  rationale: 该词通常指冰雹；译为“冰雹”比单字“雹”更符合现代普通话。
- source_word: תִּרְאֶה
  choice: 见过
  rationale: 该词形为第二人称阳性单数未完成式，但在诗歌的并列反问中，与前一完成式共同追问约伯是否有过这种经验；“见过”符合现代汉语表达，并保留修辞作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雪的库房”和“冰雹的库房”保留希伯来诗歌具体而宏大的储藏意象；句式维持成对的修辞问句。
