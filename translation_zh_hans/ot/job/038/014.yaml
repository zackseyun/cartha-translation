  text: It is changed like clay under a seal[b][a], and they stand forth like a garment.
translation:
  language: zh_hans
  text: 大地翻转，如同印章下的泥土[a]；它们如同衣裳般显现出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大地改变，如同盖了印的泥土。”希伯来语动词也可理解为“自行转变”或“被翻转”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“它们站立（或呈现）出来”，没有明说复数主语；这里可能指晨光中逐渐清晰的大地形貌。
    reason: textual_ambiguity
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: 翻转
  rationale: 该词为הפך的Hitpael形式，可表达自身转变或被翻转；“翻转”保留其动态以及主动、被动之间的含混，避免过度解释为单纯的外观变化。
- source_word: כְּחֹמֶר חוֹתָם
  choice: 如同泥土在印章之下
  rationale: חֹמֶר是泥土或陶土；该省略式短语描绘泥土被印章压出纹样。“在印章之下”自然传达这一意象，同时不把原文未明说的动作写入正文。
- source_word: וְיִתְיַצְּבוּ
  choice: 显现出来
  rationale: 复数动词字面有“站立、呈现”之意；在黎明使大地轮廓清晰的语境中，“显现出来”较自然。因主语未明说，正文以“地上的形貌”作最小限度的补足，并用脚注说明。
- source_word: כְּמוֹ לְבוּשׁ
  choice: 如同衣裳
  rationale: לְבוּשׁ指衣服或衣裳；“衣裳”保留单数诗歌意象，措辞庄重而易懂。
theological_decisions: []
