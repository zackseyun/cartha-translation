  text: Does the rain have a father[a], or who has begotten the drops of dew?
translation:
  language: zh_hans
  text: 雨有父亲吗？又是谁生出滴滴露水呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: 雨有……吗
  rationale: 疑问词 הֲ 与存在词 יֵשׁ 构成是非问句；介词 לְ 在这里表示归属关系。现代汉语用“雨有……吗”自然表达“雨是否有……”。
- source_word: אָב
  choice: 父亲
  rationale: 保留“父亲”的本义，并与下半句的“生出”形成鲜明的生育意象和平行关系，不抽象化为“源头”。
- source_word: אוֹ
  choice: 又
  rationale: 原文用“或”连接两个平行问句。汉语若直译为“或”略显生硬；“又是谁”自然承接前问，同时保留第二问作为另一种发问的关系。
- source_word: מִי הוֹלִיד
  choice: 是谁生出的
  rationale: הוֹלִיד 是 ילד 的使役形，指生育、使出生。译作“是谁生出的”既保持生育隐喻，又比“谁生育了”更符合现代汉语诗性问句的表达。
- source_word: אֶגְלֵי טָל
  choice: 一滴滴露水
  rationale: אֶגְלֵי 是“滴”的复数构造形式，与“露水”相连。“一滴滴露水”保留具体的水滴意象，也符合自然汉语。
theological_decisions:
- issue: 是否在问句中明说上帝是雨露的创造者
  choice: 不补出答案，只保留反问
  alternative: 译成“不是上帝使雨降下、生出露水吗”
  rationale: 原文借上帝向约伯提出的反问暗示创造主，却没有在本节直接给出答案。保留问句可避免把隐含意义改写成明说，并保存其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的问句。“一滴滴露水”保留希伯来诗歌的具体图像；全句避免古奥的“孰”“所生”等表达。
