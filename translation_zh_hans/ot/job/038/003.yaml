  yaml_path: translation/ot/job/038/003.yaml
  text: Gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
translation:
  language: zh_hans
  text: 你要像勇士那样束好腰[a]；我要问你，你要告诉我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你要像一个男子那样束好你的腰”。原文“男子”常带强壮、勇武的意味；“束腰”是准备坚决应对的说法。或译“你要像男子汉一样束腰”。
    reason: lexical_alternative
  - marker: b
    text: 直译“你要使我知道”。也可按上下文译“你要回答我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא
  choice: 束紧
  rationale: אזר是命令式，指束腰以准备行动；נָא在这里加强催促语气。汉语命令句已能自然传达这种紧迫感，无须机械译作“现在”或“请”。
- source_word: כְגֶבֶר
  choice: 像勇士一样
  rationale: גֶּבֶר指男子，并常带刚强、有力量的意味；在这一挑战语境中译作“勇士”，既保留阳性和刚强色彩，也自然传达毅然准备应对的含义。
- source_word: חֲלָצֶיךָ
  choice: 腰带
  rationale: 原词指腰部；与אזר组成“束紧腰部”的具体古代动作。汉语用“束紧腰带”较自然，同时保留束腰备战的意象。
- source_word: וְאֶשְׁאָלְךָ
  choice: 我要问你
  rationale: שׁאל基本义为“问”；上下文虽有盘问和挑战意味，但直译“问”已足够，不额外强化为司法审讯。
- source_word: וְהוֹדִיעֵנִי
  choice: 你要告诉我
  rationale: ידע的使役式直指“使我知道、让吾知晓”。“告诉我”是自然现代汉语，并比传统的“回答我”更贴近该使役形式；脚注保留更形式对应的译法。
theological_decisions:
- issue: 神圣挑战中的阳性比喻
  choice: 像勇士一样
  alternative: 像男子汉一样；像壮士一样
  rationale: 原文גֶּבֶר是阳性单数，且含刚强意味。译作“勇士”保留其性别与力量色彩，又避免把经文扩展成关于男性优越性的教义陈述。
- issue: “使我知道”与“回答我”的关系
  choice: 你要告诉我
  alternative: 你要回答我；要使我知道
  rationale: 采用自然汉语表达希伯来语使役式的字面语义，不把它无声改成传统而较具解释性的“回答我”；同时不暗示神缺乏知识，因为这里是挑战约伯陈明所知。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文保留束腰的具体意象，但以“束紧腰带”避免生硬的“束紧腰部”；分号呈现挑战命令与随后问答之间的推进关系。
