  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
translation:
  language: zh_hans
  text: 你当然知道，因为那时你出生了，你年日的数目也很多！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: 你当然知道
  rationale: 该词是ידע的Qal完成式第二人称阳性单数。结合上文的反问和神对约伯的讽刺语气，用“当然”显明反讽修辞；字面也可只译“你知道”。
- source_word: כִּי
  choice: 因为
  rationale: 引出带有反讽意味的理由，承接上文关于光明、黑暗之路径的反问；现代汉语用“因为”自然清楚。
- source_word: אָז
  choice: 那时
  rationale: 时间副词，指向此前所说创造秩序设立之时。
- source_word: תִּוָּלֵד
  choice: 你已经出生
  rationale: ילד的Niphal未完成式第二人称阳性单数，在反讽语境中指过去：若约伯知道创世奥秘，就仿佛当时已经出生。“已经”使中文的过去反事实意味清楚，但不把句子改写成显式条件句。
- source_word: וּמִסְפַּר יָמֶיךָ
  choice: 你的年日数目也
  rationale: 保留希伯来文“你日子的数目”这一结构，以“年日数目”表达寿命所包含的日子数量；וּ译作“也”，与前一分句并列。
- source_word: רַבִּים
  choice: 很多
  rationale: 复数形容词作谓语，表示数目多。中文“数目很多”既贴近原文，也保留对约伯仿佛年寿极长的反讽。
theological_decisions:
- issue: 是否把反讽改写为明确的反事实条件
  choice: 保留直陈式反讽：“因为那时你已经出生”
  alternative: 译作“莫非那时你已经出生”或“因为你那时已经出生吗”
  rationale: 原文表面采用直陈陈述，却在语境中明显是反讽。保留陈述形式可避免替原文消解修辞张力；“当然”足以提示语气。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“你当然知道”承接上文反问并传达神圣讲话中的反讽；后半句尽量保存希伯来文的并列和“年日数目很多”的具体表达。
