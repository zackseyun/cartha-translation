  yaml_path: translation/ot/job/038/005.yaml
  text: Who set its measurements[a], if you know, or who stretched a line upon it?
translation:
  language: zh_hans
  text: 谁定了它的尺度[a]——你若知道——又是谁在它上面拉了量线？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尺度”或译“尺寸”。
    reason: 保留 מְמַדֶּיהָ 所指的大地之尺度、尺寸的表达范围。
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 疑问代词，引出上帝带有反诘意味的问题。
- source_word: שָׂם
  choice: 定了
  rationale: שׂים 的 Qal 完成式可指设定、安置或确定；在建造大地的图景中，“定了”自然地表达确定尺度。
- source_word: מְמַדֶּיהָ
  choice: 它的尺度
  rationale: 复数名词带第三人称阴性单数后缀，按上下文指大地的各项尺度；“尺度”既保留量度含义，也符合建筑意象。
- source_word: כִּי תֵדָע
  choice: 你若知道
  rationale: כִּי 在此反诘语境中可理解为条件性的“若”；译文保留其讽刺张力，而不将其明确改写为“你当然知道”。
- source_word: אוֹ
  choice: 又
  rationale: 连接两个平行的疑问句；现代汉语在连续反诘中用“又”比直译“或”更自然，同时保留并列转接关系。
- source_word: נָטָה
  choice: 拉了
  rationale: 在建筑量度语境中，נָטָה 指把线绳拉开或展开；与“准绳”搭配时译作“拉了”简洁自然。
- source_word: עָלֶיהָ
  choice: 在它上面
  rationale: 介词 עַל 带第三人称阴性单数后缀，所指仍是大地；该译法保留空间意象，不额外限定为“横跨”。
- source_word: קָּו
  choice: 准绳
  rationale: 在建筑语境中指测量或校准所用的线绳；“准绳”准确呈现其用途，并保持庄重简洁。
