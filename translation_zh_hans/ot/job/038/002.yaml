base_translation:
  language: en
  yaml_path: translation/ot/job/038/002.yaml
  text: Who is this who darkens counsel with words without knowledge?[a]
translation:
  language: zh_hans
  text: “这是谁，用无知的话使谋略变得晦暗不明？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋略”也可译“筹划”“计划”或“旨意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: 这是谁
  rationale: 疑问词与指示词连用，构成直接而有强调意味的质问；“这是谁”符合现代汉语表达，也保留责问的力度。
- source_word: מַחְשִׁיךְ
  choice: 使……暗昧不明
  rationale: 保留“使之变暗”的隐喻，同时用“不明”帮助普通读者理解这里指使某事变得模糊难明，而非仅指物理上的黑暗。
- source_word: עֵצָה
  choice: 谋略
  rationale: 该词可指商议、谋略、计划或旨意。“谋略”在庄重现代汉语中较自然，也保留智慧筹划与既定意图之间的语义幅度。
- source_word: בְמִלִּין
  choice: 用……话
  rationale: 介词在此表示手段；“用……话”自然地表达暗昧是借言语造成的。
- source_word: בְּלִי דָעַת
  choice: 无知的
  rationale: 希伯来语直译为“没有知识”。汉语置于“话”前作定语较流畅，并保留言语缺乏知识根据的责备。
theological_decisions:
- issue: 神发言时 עֵצָה 的含义
  choice: 谋略
  alternative: 计划；旨意；劝告
  rationale: 上下文既可能涉及真正的智慧谋划，也可能涉及神的计划或旨意。“谋略”不把经文限定为某一狭窄的神学解释，并由脚注保留主要词义选择。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。疑问句保留神直接质问的语气；“暗昧不明”既保存原文的黑暗隐喻，也避免现代读者误解为纯粹的视觉描写。
