  text: 当我使云彩作它的衣裳，使幽暗作它的襁褓[a]时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“裹婴布”。希伯来文带有包裹新生儿的意象，延续上下文把海比作新生儿的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: 我以……为
  rationale: ב 加不定式构造在此表达时间或伴随动作；结合汉语诗句与上下文，译作“我以……为”自然呈现上帝给海披裹之物的动作。
- source_word: עָנָן
  choice: 云彩
  rationale: עָנָן通常指云；“云彩”在现代汉语中自然且具有诗意。
- source_word: לְבֻשׁוֹ
  choice: 海的衣裳
  rationale: לְבוּשׁ指衣服、衣裳；三单阳性后缀按上下文指海。明说“海”可避免汉语中连续代词所指不清，同时保留衣着意象。
- source_word: וַעֲרָפֶל
  choice: 以幽暗
  rationale: עֲרָפֶל表示浓密的黑暗、昏暗，也可带大气景象色彩；“幽暗”简洁庄重，并与“云彩”形成诗意平行。
- source_word: חֲתֻלָּתוֹ
  choice: 它的襁褓
  rationale: 该词与包裹、裹婴孩有关；“襁褓”准确延续上下文中海如新生儿的出生意象，同时可为现代普通读者理解。
theological_decisions:
- issue: 海的拟人化与出生意象
  choice: 保留“衣裳”和“襁褓”的并列意象
  alternative: 将后一词泛化为“包裹之物”或“裹布”
  rationale: 上下文把海描绘为从母腹涌出的新生者；保留襁褓意象既忠于希伯来语，也不额外引入教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。用“以……为……”形成对称结构；“襁褓”略具文学色彩，但仍属通行词，并能准确保留原文的出生意象。
