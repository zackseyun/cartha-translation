lexical_decisions:
- source_word: כִּי
  choice: 当……时
  rationale: 在38:39—40连续的反问中引出狮子等候猎物时的情形；译作时间关系最合上下文，同时保留本节承接前句的句法。
- source_word: יָשֹׁחוּ
  choice: 蹲伏
  rationale: 该词在捕猎语境中指压低身体、伏下身来；“蹲伏”既贴近动作，也符合猛兽潜猎的自然表达。
- source_word: בַמְּעוֹנוֹת
  choice: 在洞穴里
  rationale: מְעוֹנוֹת泛指居所或兽穴；结合狮子捕猎的上下文，“洞穴”清楚自然。希伯来语为复数，汉语类指表达无需机械标出复数或增添领属词。
- source_word: יֵשְׁבוּ
  choice: 藏身
  rationale: 该动词本义可指坐下、停留或居住；与地点短语及לְמוֹ אָרֶב连用时，表示占据隐蔽位置等待伏击。“藏身”以自然汉语传达这种处境，而不生硬译作“坐”。
- source_word: בַסֻּכָּה
  choice: 在密丛中
  rationale: סֻכָּה在此指可供遮蔽、适合伏击的隐蔽处，并非住棚节所用的人工棚子。“密丛”符合野兽潜伏的自然环境；其他可能译法收入脚注。
- source_word: לְמוֹ אָרֶב
  choice: 伺机伏击
  rationale: 该短语表示目的，即为了埋伏。与יֵשְׁבוּ合译为“藏身……伺机伏击”，既保留目的关系，也符合现代汉语习惯。
