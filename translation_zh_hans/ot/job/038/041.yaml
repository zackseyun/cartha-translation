base_translation:
  language: en
  yaml_path: translation/ot/job/038/041.yaml
  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: zh_hans
  text: 谁为乌鸦预备猎物[a]，当它的雏鸟向上帝呼求[b]、因没有食物而四处游荡[c]时？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为乌鸦供应食物。”希伯来语动词可指“预备”或“供应”，“猎物”也可较宽泛地译作“食物”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为它的雏鸟向上帝呼求。”这里的连接词也可作因果解释，译为“因为”，而非时间性的“当……时”。
    reason: lexical_alternative
  - marker: c
    text: “四处游荡”也可译作“漂泊”或“走迷”。希伯来语动词可表示为寻找食物而游荡或走迷。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: 谁
  rationale: 疑问代词，在上帝的发言中引出反问。
- source_word: יָכִין
  choice: 预备
  rationale: כון的使役式在此指使某物备妥或供应；“预备”保留其具体含义，也符合庄重自然的现代汉语。
- source_word: לָעֹרֵב
  choice: 为乌鸦
  rationale: 介词表示受益者；带冠词的单数在此泛指乌鸦这一类动物。
- source_word: צֵידוֹ
  choice: 猎物
  rationale: ציד可指猎获之物或食物；“猎物”保留动物觅食的鲜明意象。词尾代词为阳性单数，可指乌鸦；汉语不必另加物主代词，避免不自然。
- source_word: כִּי
  choice: 当……时
  rationale: 在此引入乌鸦需要食物时的情境；其因果读法仍以脚注保留。
- source_word: ילדיו
  choice: 它的雏鸟
  rationale: 该名词及其后缀指乌鸦的幼鸟；“雏鸟”比泛称“后代”更具体自然。
- source_word: אֶל־אֵל
  choice: 向上帝
  rationale: אֵל在此是“上帝”的通称，并非必须音译的专名。
- source_word: יְשַׁוֵּעוּ
  choice: 呼求
  rationale: שוע的加强式表示因需要而呼喊求助；“呼求”简洁，并保留求助意味。
- source_word: יִתְעוּ
  choice: 四处游荡
  rationale: תעה可表示游荡、漂泊或迷走；在动物语境中，“四处游荡”自然表现因饥饿而不断寻觅。
- source_word: לִבְלִי אֹכֶל
  choice: 因无食可吃
  rationale: 该短语表达食物的缺乏；此译法既明确匮乏，也自然呈现游荡的原因。
