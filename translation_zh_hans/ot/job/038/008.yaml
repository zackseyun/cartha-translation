base_translation:
  language: en
  yaml_path: translation/ot/job/038/008.yaml
  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: zh_hans
  text: '是谁用门把海关住，

    当它从母腹中喷涌而出时[a][b]？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喷涌而出”也可译作“猛冲出来”；希伯来语动词强调强有力地涌出。
    reason: lexical_alternative
  - marker: b
    text: 本节把海描绘成一个从母腹中出生的孩子，延续这首诗关于创造的意象。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: 关住
  rationale: 此动词在这里表示封闭、约束；“关住”自然简洁，也与后面的“门”构成鲜明具体的意象。
- source_word: בִּדְלָתַיִם
  choice: 用门
  rationale: 保留介词的工具意义和原文的建筑意象；双数形式在此自然译作“门”，不必生硬地译为“两扇门”。
- source_word: יָם
  choice: 海
  rationale: 在宇宙创造的语境中指作为受造物的海；现代汉语无须加显式定冠词。
- source_word: בְּגִיחוֹ
  choice: 当它……喷涌而出时
  rationale: גיח描写猛烈地冲出或涌出；“喷涌而出”兼顾力量感、水的特征和现代汉语表达。
- source_word: מֵרֶחֶם
  choice: 从母腹中
  rationale: 保留海如婴孩诞生的拟人化意象；“母腹”比单说“腹中”更明确地传达出生图景。
- source_word: יֵצֵא
  choice: 而出
  rationale: 将限定动词与前面的动作名词结构合并为“喷涌而出”，避免汉语中累赘重复，同时完整表达海从母腹出来的动作。
theological_decisions:
- issue: 海诞生时的诗性创造意象
  choice: 保留海从母腹喷涌而出、又被上帝用门关住的拟人化图景。
  alternative: 抽象地译成上帝为海设立界限，或把出生意象改写为一般性的创造陈述。
  rationale: 希伯来文本有意使用出生和封闭的鲜明诗歌意象；保留这些意象既忠于原文，也不把诗性语言扩展为额外的神话或教义主张。
- issue: 疑问句的主语与语境
  choice: 译作“是谁……？”，承接上下文中上帝向约伯提出的反问。
  alternative: 补明为“又是谁……？”或直接译作陈述句“我……”。
  rationale: 原文疑问词可由上文语境补足；“是谁”保留反问力度，而不在本节中额外补入原文未明说的主语。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“用门把海关住”保留具体意象；分行强化反问和出生图景。脚注标记均置于正文相关短语之后。
