  yaml_path: translation/ot/job/038/011.yaml
  text: and I said[a], ‘You may come this far, and no farther; here your proud waves shall stop.’
translation:
  language: zh_hans
  text: 我说：“你只能到这里，不可越过；你狂傲的波浪要在这里止住[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “止住”所译的希伯来语动词通常有“放置、设立”的意思。本句结构凝练，也可理解为海浪的狂傲“在这里被限定（或被止住）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我说
  rationale: 这是אמר的第一人称单数叙事形式，承接上文上帝对海的约束；译为“我说”简洁自然。
- source_word: עַד פֹּה תָבוֹא
  choice: 你只能到这里
  rationale: עַד פֹּה标明空间界限；结合上帝向拟人化的海发令这一语境，“只能”自然表达获准抵达的限度。
- source_word: וְלֹא תֹסִיף
  choice: 不可越过
  rationale: יסף的使役形在此有“继续、再前进”之意；译为“不可越过”明确传达边界禁令，而非机械译作“不可再加添”。
- source_word: וּפֹא
  choice: 在这里
  rationale: 保留地点副词的重复，突出海浪受制止的确切界点。
- source_word: יָשִׁית
  choice: 要……止住
  rationale: 该动词通常有“放置、设立”之意，但本句用法和句法较凝练；在划定海界的语境中，“止住”自然表达海浪被限定于此，同时以脚注保留其字面和句法上的不确定性。
- source_word: בִּגְאוֹן גַּלֶּיךָ
  choice: 你狂傲的波浪
  rationale: גאון可指骄傲、威势或高涨之态；与海浪搭配时，“狂傲”保留诗歌中的拟人色彩及翻腾高涨的意象。גַּלֶּיךָ为带第二人称单数后缀的复数名词，译作“你的波浪”。
theological_decisions:
- issue: 上帝直接向海发令的拟人表达
  choice: 保留第二人称“你”以及划定界限的命令语气
  alternative: 将海完全改写为非人格化的自然现象
  rationale: 原文直接称海为“你”，以诗歌拟人手法彰显上帝对受造界的主权；保留这种表达并不意味着海是独立神祇或与上帝抗衡的力量。
- issue: גאון所表达的海浪特征
  choice: 译作“狂傲”，保留骄傲与高涨威势之间的张力
  alternative: 译作“威猛”或“汹涌”，只突出自然力量
  rationale: 该词既可表示骄傲，也可表示威严、高涨；语境是海浪受约束，译作“狂傲”既承接拟人手法，也不排除浪涛高涨的形象。
translation_notes:
  register: 采用庄重而自然的现代汉语。“你只能到这里，不可越过”清楚呈现界限和禁令；“狂傲的波浪”保留原文拟人化诗意。脚注标在相关动词后，避免把词义说明误连到句首“我说”。
