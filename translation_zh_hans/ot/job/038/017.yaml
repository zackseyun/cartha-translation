base_translation:
  language: en
  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
translation:
  language: zh_hans
  text: 死亡之门曾向你显露吗？幽暗之门[a]，你见过吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死荫之门”。希伯来语 צַלְמָוֶת 传统上译作“死荫”，也可泛指深沉的黑暗或阴森幽暗。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִגְלוּ
  choice: 曾……显露吗
  rationale: 疑问词 הֲ 与 גלה 的尼法勒完成式构成反问；“曾……显露吗”保留被动含义和对既往经验的追问。
- source_word: לְךָ
  choice: 向你
  rationale: 介词 לְ 加第二人称阳性单数后缀，表示这些门向约伯显露。
- source_word: שַׁעֲרֵי מָוֶת
  choice: 死亡之门
  rationale: 直译这一组合结构，保留死亡领域具有门户的具体诗歌意象。
- source_word: וְשַׁעֲרֵי
  choice: 幽暗之门
  rationale: 以并列的第二个反问呈现 וְ 所连接的平行分句；中文不必另加“或”，可保留希伯来诗歌简洁的并列结构。
- source_word: צַלְמָוֶת
  choice: 幽暗
  rationale: 该词可指极深的黑暗、阴森幽暗，也传统上译作“死荫”。正文采用自然凝练的“幽暗”，同时用脚注保留传统译法及其死亡意象。
- source_word: תִּרְאֶה
  choice: 你见过吗
  rationale: Qal 未完成式第二人称阳性单数在此诗歌反问中追问约伯是否有过这种经验；“见过吗”与前句“曾……显露吗”自然对应。
theological_decisions: []
