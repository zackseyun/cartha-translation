  text: וָ/אֶשְׁבֹּ֣ר עָלָ֣י/ו חֻקִּ֑/י וָֽ֝/אָשִׂ֗ים בְּרִ֣יחַ וּ/דְלָתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/010.yaml
  text: when I prescribed my boundary for it and set bars and doors,[a]
translation:
  language: zh_hans
  text: 我为它划定界限[a]，又安设门闩和门扇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我为它定下我的定规”。“划定”所对应的希伯来语通常有“打破”之意，但此处很可能指为海确立限度。
    reason: 说明原文动词的词义难点，并保留חֹק可译为“定规”的可能。
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: 划定
  rationale: שׁבר通常意为“打破”，但这一义项在此处难以与“界限”自然搭配；结合约伯记38章限制海水的语境，这里表达为海划定、确立限度。译作“划定”既自然，也保留主动施加限制的含义。
- source_word: עָלָיו
  choice: 为它
  rationale: 介词עַל连第三人称阳性单数后缀，回指上文的海；与“划定界限”搭配时，现代汉语用“为它”最自然。
- source_word: חֻקִּי
  choice: 界限
  rationale: חֹק可指律例、定规、所定份额或限度。此处上下文描写海被约束，因此采用具体的“界限”；第一人称所属关系已通过“我为它划定”自然表达，不机械译成“我的界限”。
- source_word: וָאָשִׂים
  choice: 安设
  rationale: שׂים意为放置、设置；“安设”适合门闩和门扇，也符合庄重的诗歌语体。
- source_word: בְּרִיחַ
  choice: 门闩
  rationale: בְּרִיחַ指用于闩住门户的横木或门栓。“门闩”准确保留了封闭、约束海的建筑意象。
- source_word: וּדְלָתָיִם
  choice: 门扇
  rationale: דְלָתָיִם是双数形式，指成对的门扇。“门扇”比泛称“门”更能体现原文的一对门，同时与“门闩”搭配自然。
theological_decisions:
- issue: 上帝辖制海的拟人化建筑意象
  choice: 保留“界限、门闩和门扇”的具体画面
  alternative: 抽象译为上帝掌管或约束海
  rationale: 原文借划界和关闭门户的鲜明意象表达上帝对海的主权；保留这些意象可维护诗歌张力，避免将经文过度教义化。
- issue: חֻקִּי兼有“界限”与“定规”之意
  choice: 正文采用具体语境中的“界限”
  alternative: 译作“我的定规”或“我的法令”
  rationale: 海受限制的语境支持空间性“界限”，但原词也含规定、法令的意味，因此在脚注中保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“划定界限”清楚表达海被限定；“门闩和门扇”保留原文具体而有力度的诗歌意象。
