    issue: “食物”弱化了 טָרֶף 的“猎物／被捕获的猎物”含义。
    rationale: 本节刻画狮类捕猎与供养，译为“猎物”既自然，也比泛指的“食物”更贴近原文。
  - severity: medium
    issue: “饥腹得到饱足”不自然且语义重复。
    rationale: 原文以“填满”表达少壮狮子的生命欲求、食欲或饥饿得到满足；汉语以“填饱……的肚子”可自然保留这一具体意象。
