  text: 你能为母狮猎取猎物，填饱少壮狮子的肚子吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתָצוּד
  choice: 你能……猎取
  rationale: 疑问词 הֲ 加第二人称阳性单数未完成式，在上帝对约伯的诘问中表达反问；“猎取”保留 צוד 的捕猎含义，“能”自然传达此处对约伯能力的质询。
- source_word: לְלָבִיא
  choice: 为母狮
  rationale: לָבִיא 可指狮子或母狮；下半句提到少壮狮子，语境适合公益性地译为“母狮”，但原词本身未明确限定性别。
- source_word: טָרֶף
  choice: 食物
  rationale: טֶרֶף 指猛兽捕获并撕食的猎物；与“猎取”连用时，“食物”在现代汉语中自然，同时上下文仍清楚保留捕猎场景。
- source_word: וְחַיַּת
  choice: 饥腹
  rationale: חַיַּת 字面与“生命、活力”有关，在与 מלא 连用的结构中指少壮狮子需要被填满的生命欲求，即饥饿或食欲。“饥腹”既呼应“填满”的具体意象，也符合汉语表达。
- source_word: כְּפִירִים
  choice: 少壮狮子
  rationale: כְּפִירִים 指年轻而已有捕食能力的狮子；“少壮狮子”比“幼狮”更能避免使读者只想到幼小乳兽。
- source_word: תְּמַלֵּא
  choice: 使……得到饱足
  rationale: מלא 的 Piel 形式基本义为“使充满、填满”；与“饥腹”搭配译作“使……得到饱足”，兼顾原文意象和现代汉语的自然度。
