  yaml_path: translation/ot/job/038/029.yaml
  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: zh_hans
  text: 冰从谁的腹中而出？天上的霜又是谁所生？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: 从谁的腹中
  rationale: בֶּטֶן可指腹部或母腹；此处与下半句“生”形成连续的生育意象，因此译作“腹中”，既贴近原文，又比“子宫”更适合诗体。
- source_word: יָצָא
  choice: 而出
  rationale: 该动词意为“出去、出来”。“而出”自然简洁，并保留诗歌的庄重语气与出生意象。
- source_word: הַקָּרַח
  choice: 冰
  rationale: קֶרַח在此指冰；现代汉语泛指时无需机械表达希伯来语定冠词。
- source_word: וּכְפֹר שָׁמַיִם
  choice: 天上的霜
  rationale: כְּפוֹר指霜，也可特指白霜；שָׁמַיִם在此可理解为天空。“天上的霜”准确、通顺，并保留宇宙性的诗歌图景。
- source_word: מִי יְלָדוֹ
  choice: 又是谁生的
  rationale: ילד在Qal中可指生育，其阳性单数宾语后缀指向“霜”。此译保留拟人化的生育隐喻，也以“又”自然连接两个平行问句。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体。两个问句保持希伯来诗歌的平行结构，并完整保留“腹中—生”的生育意象；不增添原文没有说明的神学解释。
