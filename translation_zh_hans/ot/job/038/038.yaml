  text: when the dust hardens into a mass[a], and the clods stick together?
translation:
  language: zh_hans
  text: 尘土凝结成块[a]，土团彼此粘合的时候？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尘土被浇铸成坚硬的一体”，或“尘土变得像铸件一样坚硬”。希伯来文借用倾倒、浇铸的意象，描写地面凝结密实。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: 凝结
  rationale: 此处与时间性介词结构共同表达“当……的时候”；词根带有倾倒、浇铸及凝固的意象。结合尘土和下句土团粘合的语境，译作“凝结”自然表达土壤因水而变得密实，同时保留脚注说明浇铸意象。
- source_word: עָפָר
  choice: 尘土
  rationale: עָפָר常指尘土或松散土壤；“尘土”简洁、常用，也与由松散变为凝结的画面相符。
- source_word: לַמּוּצָק
  choice: 成块
  rationale: 该词源于“倾倒、浇铸”的词根，可指浇铸后形成的坚实物。此处译作“成块”符合土地凝实的上下文，又不把金属材质强加进正文。
- source_word: וּרְגָבִים
  choice: 土团
  rationale: רְגָבִים指成团或成块的泥土。“土团”是现代汉语中清楚自然的表达。
- source_word: יְדֻבָּקוּ
  choice: 彼此粘合
  rationale: 该被动形式表示土团被粘接、附着在一起；“彼此粘合”既体现被结合的结果，也使中文表达顺畅。
