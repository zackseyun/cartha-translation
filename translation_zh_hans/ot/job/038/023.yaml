  text: which I have reserved for a time of distress[a], for a day of battle and war[b],
translation:
  language: zh_hans
  text: 是我为患难[a]之时、为争战和战争之日所保留[b]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“困苦”或“危难”。
    reason: lexical_alternative
  - marker: b
    text: “保留”也可译作“扣留”或“储存”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 是……的
  rationale: 引出关系从句，承接上一节所说的雪和冰雹；汉语用“是……的”结构自然表达这一承接关系。
- source_word: חָשַׂכְתִּי
  choice: 我……保留
  rationale: חשׂך在此可指扣留、留下或储备；“保留”既表达暂时留存，也体现为特定时机而预备的意味。
- source_word: לְעֶת
  choice: 为……之时
  rationale: ל在此表示目的或预定用途，עֵת指特定的时机；“为……之时”保留原文庄重而简洁的时间表达。
- source_word: צָר
  choice: 患难
  rationale: צָר在此指困苦、危难或灾患；“患难”自然、凝练，并适合本段庄重语体。
- source_word: לְיוֹם
  choice: 为……之日
  rationale: 与前面的לְעֶת构成平行，兼有为某一时日预留的目的意味。
- source_word: קְרָב
  choice: 争战
  rationale: 该词指交战或战斗；“争战”能与后面的“战争”形成原文近义并列，同时保持区别。
- source_word: וּמִלְחָמָה
  choice: 和战争
  rationale: 保留原文“争战”和“战争”的近义并列，不将两词合并为一个概念。
theological_decisions:
- issue: 上帝为患难和战争之日保留自然力量的意象
  choice: 直译为上帝将前文所说的雪和冰雹保留到患难、争战和战争之时使用。
  alternative: 将这句话仅解释为对上帝护理的纯粹比喻，淡化军事含义。
  rationale: 原文明说“争战和战争之日”，因此保留其直接意象，同时不进一步规定这些自然力量如何或在何种审判中被使用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“患难之时”与“争战和战争之日”保留希伯来文的平行结构；全句作为关系从句承接上一节，因此保留片段式句法。
