  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: zh_hans
  text: 我奠定大地根基的时候，你在哪里？你若有悟性，就说吧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיפֹה
  choice: 在哪里
  rationale: 地点疑问词；用现代汉语“在哪里”自然地保留上帝质问的力度。
- source_word: הָיִיתָ
  choice: 你在哪里
  rationale: היה 的第二人称阳性单数完成式处于过去事件的问句中，汉语以“你在哪里”表达最自然。
- source_word: בְּיָסְדִי
  choice: 我奠定……根基的时候
  rationale: 介词 בְּ 加带第一人称单数后缀的不定式构造表示时间；יסד 含奠基、建立之意。此译保留建筑意象，并符合自然汉语。
- source_word: אָרֶץ
  choice: 大地
  rationale: 上下文是宇宙创造，而非某一地区；“大地”比“土地”更准确，也具有庄重的诗歌语体。
- source_word: הַגֵּד
  choice: 就说吧
  rationale: נגד 的使役式命令语气要求对方陈说；“就说吧”在条件句后自然，并保留带挑战意味的命令语气。
- source_word: אִם
  choice: 若
  rationale: 引出条件性的反诘；“若”简洁庄重，等同现代汉语“如果”。
- source_word: יָדַעְתָּ
  choice: 明白
  rationale: 完成式在此条件反诘中表达现时具备的认知；结合宾语 בינה，汉语用“明白”可避免生硬的“知道理解”。
- source_word: בִינָה
  choice: 明白
  rationale: בינה 指理解力、洞察力。与 ידע 构成“知道理解/具有理解”的表达，汉语整合为“你若明白”，自然而不额外解释其内容。
theological_decisions:
- issue: 神在创造中的奠基意象
  choice: 译为“我奠定大地根基的时候”
  alternative: “我建立大地的时候”
  rationale: 原文 יסד 明确带有奠基、建立的建筑意象；保留该意象呈现神是大地建立者的明说，同时不扩展为更具体的宇宙构造理论。
- issue: “知道理解”的希伯来语搭配
  choice: 整合译为“你若明白”
  alternative: “你若有悟性”
  rationale: 原文 יָדַעְתָּ בִינָה 字面关系在汉语中不宜机械复制。“你若明白”保留约伯是否具备理解的反诘，不把它限定为某种特定教义性的知识。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半句保留希伯来诗句的建筑性创造意象，后半句以简洁条件反诘呈现神话语中的挑战力度。
