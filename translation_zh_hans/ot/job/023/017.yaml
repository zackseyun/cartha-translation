  yaml_path: translation/ot/job/023/017.yaml
  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: zh_hans
  text: '因为我没有因黑暗而止息，

    也没有因浓重的幽暗遮住我的脸而止息。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文句法和“止息”的含义都有争议。“止息”也可译为“被剪除”或“被毁灭”。末句也可能理解为：“浓重的幽暗从我面前被遮蔽了”，或“幽暗遮住了我面前的一切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明约伯为何惊惶；中文用“因为”自然表达解释或原因关系，同时不加强语气。
- source_word: לֹא נִצְמַתִּי
  choice: 我没有……被止息
  rationale: צמת 的尼法勒式可指“被止息、被剪除、被毁灭”。“被止息”既保留被动语态，也可涵盖声音或生命未被终止的语义张力。
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: 因黑暗
  rationale: מִפְּנֵי 在此较自然地表示原因；“黑暗”直接对应 חֹשֶׁךְ，并保留诗句意象。
- source_word: וּמִפָּנַי
  choice: 我的脸
  rationale: פָּנִים 带第一人称单数词尾，字面可理解为“我的脸”；但也可能作方位表达，意为“在我面前”，故在脚注保留异译。
- source_word: כִּסָּה
  choice: 遮住
  rationale: כסה 的基本意义是覆盖、遮蔽；“遮住”与“脸”搭配自然且具体。
- source_word: אֹפֶל
  choice: 幽暗
  rationale: אֹפֶל 比一般的 חֹשֶׁךְ 更浓重。“幽暗”既与前面的“黑暗”形成词汇区别，也保留浓暗、阴沉的诗意。
theological_decisions:
- issue: 黑暗为何没有使约伯“止息”
  choice: 不明确限定是言语、生命还是毁灭被终止
  alternative: 明确译作“沉默”或“被剪除”
  rationale: 希伯来动词本身有多种可能，语境亦容许“未被噤声”和“未被毁灭”等理解；正文采用较宽的“被止息”，避免替文本消除张力。
- issue: 第二分句与第一分句的句法关系
  choice: 补出“而止息”，使两分句共同受 לֹא נִצְמַתִּי 支配
  alternative: 译作独立陈述“幽暗遮住了我的脸”
  rationale: 希伯来诗句句法困难。将第二个 מִן 短语与前一个并列，可形成“我既没有因……也没有因……”的结构；脚注保留独立分句的可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“被止息”略带文学色彩，用以保留原文动词在噤声、终止与剪除之间的含混；第二行重复“而止息”，使中文句法清楚，同时以脚注交代其他主要分析。
