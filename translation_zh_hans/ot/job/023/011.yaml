  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: zh_hans
  text: 我的脚紧紧跟随他的脚步[a]；我谨守他的道路，并没有偏离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的脚紧紧踏在他的脚踪上。”原文的图像是脚紧贴、持定在他的脚步或脚踪中。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: 他的脚踪
  rationale: אֲשׁוּר指脚步、足迹；第三人称阳性单数后缀在上下文中指向上帝。“脚踪”保留沿着足迹跟随的具体意象。
- source_word: אָחֲזָה
  choice: 紧随
  rationale: אָחֲזָה本义为抓住、持守；以“我的脚”为主语时，“紧随”在现代汉语中自然地表达牢牢贴近脚踪而行，同时避免生硬的“抓住”。
- source_word: רַגְלִי
  choice: 我的脚
  rationale: 原文为单数，直译为“我的脚”可保留鲜明的行路意象。
- source_word: דַּרְכּוֹ
  choice: 他的道路
  rationale: דֶּרֶךְ可指道路，也可喻指行事方式；“道路”兼顾具体路径和伦理生活的双重含义。
- source_word: שָׁמַרְתִּי
  choice: 我谨守
  rationale: שׁמר有守护、遵守之意；“谨守”表达约伯小心持守、忠实遵行的语气。
- source_word: וְלֹא
  choice: 并没有
  rationale: 承接前句并引出否定，与两个完成式所表达的持续忠实相呼应。
- source_word: אָט
  choice: 偏离
  rationale: 此处表示从道路转开或偏离；“偏离”自然承接本节的道路意象，且不额外限定偏离的方向。
theological_decisions:
- issue: 两个第三人称阳性单数后缀（“他的脚踪”“他的道路”）所指为何
  choice: 按上下文理解为上帝，但正文仍保留代词“他”
  alternative: 指某条未明确说明的正直道路或其行路者
  rationale: 约伯记23:10-12的谈话对象和焦点是上帝；保留“他”既忠实反映原文后缀，也不在正文中加入原文没有的专名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“紧随他的脚踪”保留原文的具体行路图像；分号呈现两组平行陈述。
