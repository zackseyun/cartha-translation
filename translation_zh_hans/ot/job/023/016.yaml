id: JOB.23.16
reference: Job 23:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֭/אֵל הֵרַ֣ךְ לִבִּ֑/י וְ֝/שַׁדַּ֗י הִבְהִילָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: zh_hans
  text: 然而，上帝使我的心胆怯[a]；全能者使我惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我的心软弱。”原文动词直译是“使柔软”，在这里很可能指约伯的勇气消退。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: 然而，上帝
  rationale: אֵל是对神的通称。וְ本可译作“而/并且”，但结合上文约伯的畏惧，此处用“然而”自然呈现语篇中的转折张力。
- source_word: הֵרַךְ
  choice: 使……胆怯
  rationale: 该动词字面义为“使柔软、使软弱”；以“心”为宾语时，指勇气消退、内心变得怯弱。“使我的心胆怯”既保留心的意象，也传达此处的惯用含义。
- source_word: לִבִּי
  choice: 我的心
  rationale: לֵב可指人的内在自我、意志或勇气；译作“心”保留希伯来文意象，其具体语义由“胆怯”说明。
- source_word: וְשַׁדַּי
  choice: 全能者
  rationale: שַׁדַּי在此是神的称号，译为“全能者”可传达称号含义，并与前句“上帝”形成平行。
- source_word: הִבְהִילָנִי
  choice: 使我惊恐
  rationale: בהל的使役式表示使人慌乱、恐惧或惊惶；“使我惊恐”符合原文强度，并与前半句相称。
theological_decisions:
- issue: 神的称号אֵל与שַׁדַּי的译法
  choice: 上帝……全能者
  alternative: 神……沙代
  rationale: 两词在本节平行出现。אֵל按通称翻译，שַׁדַּי按神圣称号翻译，既表达意义，也不把称号误作专名；此译法不额外加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“心胆怯”表达内在勇气消退，同时正文脚注标记[a]与脚注对应；分号保留两句平行结构。
