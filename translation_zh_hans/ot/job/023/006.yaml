base_translation:
  language: en
  yaml_path: translation/ot/job/023/006.yaml
  text: Would he contend with me in the greatness of his power? No[a]; surely he would pay attention to me.
translation:
  language: zh_hans
  text: 他岂会以大能与我争辩吗？不；他必留意我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必把心意放在我身上”；也可能译：“他必把力量加给我。”
    reason: 原文 יָשִׂם בִּי 的含义不完全确定；在此可指留意、把心意放在某人身上，也可能指把力量放入某人里面。
lexical_decisions:
- source_word: הַ/בְּ/רָב כֹּחַ
  choice: 岂会仗着强大的力量
  rationale: 疑问词与介词短语引出反问，所问的是上帝是否凭压倒性的力量与约伯争讼。“仗着强大的力量”自然地保留了 רָב 所表达的强盛、丰沛之意和 כֹּחַ 的“力量”之意。
- source_word: יָרִיב עִמָּדִי
  choice: 与我争辩
  rationale: ריב 在本段具有诉讼语境，可指争辩、争讼或进行案件。“与我争辩”既保留对抗和司法色彩，又符合现代汉语表达。
- source_word: לֹא אַךְ
  choice: 不会；他必
  rationale: לֹא 否定前面的可能，אַךְ 随后加强肯定。译为“不会；他必”体现由坚决否定转向强调陈述的结构。
- source_word: יָשִׂם בִּי
  choice: 留意我
  rationale: שׂים 与 ב 连用可表达把心思或注意力放在某人身上。结合约伯要在上帝面前陈明案件的上下文，“留意我”可表示上帝会听取他的陈诉，同时不把较含混的原文扩写得过于明确。
theological_decisions:
- issue: 下半句中上帝行动的含义
  choice: 约伯相信上帝不会单凭大能压倒他，而会留意他、听取他的陈诉。
  alternative: 上帝会把力量赐给约伯；或上帝会在较宽泛的意义上关注约伯。
  rationale: 23:3—7 的直接语境是约伯希望到上帝面前陈明案件。因此，将此处理解为上帝留意约伯最符合司法语境。不过，正文采用简洁的“留意我”，脚注保留“把心放在我身上”和“把力量加给我”等词义可能，避免消除原文的歧义及其中关于上帝大能与公正相待之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仗着”清楚表达凭借强大力量行事的意味；“争辩”与本段的法庭语境相合，但避免使用过于专业的法律术语。正文保持反问、否定和强调肯定的推进。
