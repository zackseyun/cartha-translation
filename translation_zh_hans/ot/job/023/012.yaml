base_translation:
  language: en
  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: zh_hans
  text: 我没有偏离他嘴唇所发出的命令；我珍藏他口中的话，胜过分给我的份额[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一处希伯来语较难理解。按一种传统解释，也可译作：“我珍藏他口中的话，胜过我必需的食物。”
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: 命令
  rationale: 原文为单数构造形式；“命令”既保留单数含义，也符合现代汉语表达。
- source_word: שְׂפָתָיו
  choice: 他嘴唇所发的
  rationale: 保留“嘴唇”的具体意象，并以“所发的”使汉语搭配自然；第三人称阳性单数后缀依上下文指向上帝。
- source_word: לֹא אָמִישׁ
  choice: 我没有偏离
  rationale: 使役词形在此表达离开、转离之意；“没有偏离”准确传达约伯没有背离命令。
- source_word: מֵחֻקִּי
  choice: 胜过给我定的份
  rationale: 此短语文本和释义均有困难。这里将介词理解为比较义，并把带第一人称后缀的名词理解为给约伯规定或分配的份；译文保持概括，不擅自限定为食物。
- source_word: צָפַנְתִּי
  choice: 我珍藏
  rationale: 该动词本义为藏起、储存，在智慧文学语境中可指珍重地保存；“珍藏”兼顾保存与珍视。
- source_word: אִמְרֵי
  choice: 话
  rationale: 自然表达复数构造形式所指的言语，与前句“命令”构成诗意呼应。
- source_word: פִיו
  choice: 他口中的
  rationale: 保留“口”的具体意象，并与前句“嘴唇”形成平行；后缀依上下文指向上帝。
theological_decisions:
- issue: “他嘴唇”和“他口中”的第三人称所指
  choice: 理解为上帝
  alternative: 理解为未明确指明的说话者
  rationale: 约伯记第23章的上下文是约伯陈述自己在上帝面前的忠诚，因此这些后缀最自然地指向上帝；译文没有额外加上“上帝”一词，以保留原文形式。
- issue: מֵחֻקִּי 的解释
  choice: 按比较义译为“胜过给我定的份”
  alternative: “不离开我的定例”；或按传统解释译为“胜过我必需的食物”
  rationale: 马所拉文本的这一短语较难理解。正文采用与现有辅音及第一人称后缀相称、且在语境中连贯的比较义，同时不把“份”具体限定为食物；传统的“必需的食物”保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“嘴唇”与“口”保留原诗的具体意象和平行结构；“给我定的份”有意保持一定开放性，以反映原文的疑难与歧义。
