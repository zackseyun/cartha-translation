  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: zh_hans
  text: 他在左边作工时，我却察觉不到他；他在右边把自己遮蔽起来[a]，我也看不见他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把自己遮蔽起来”所译的希伯来语通常有“包裹、遮盖”的意思；本句含义较难确定，也有人理解为“转向右边”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“左边”和“右边”；这两个方位有时也分别对应“北方”和“南方”。这里保留诗句中的左右对照。
    reason: cultural_note
lexical_decisions:
- source_word: שְׂמֹאול
  choice: 在左边
  rationale: 该词本义为“左边”，也可引申指“北方”。本句与“右边”构成诗歌中的方位对照，因此保留“左边”。
- source_word: בַּעֲשֹׂתוֹ
  choice: 他……行事
  rationale: 介词 בְּ 加 עשה 的不定词附加第三人称阳性单数词尾，在这里表示他正在行动或作工；“行事”简洁保留了原文宽泛的行动含义。
- source_word: אָחַז
  choice: 察觉不到他
  rationale: 该动词通常表示“抓住、握住”，此处描述约伯无法捕捉到或感知神的所在。“察觉不到”符合上下文，同时保留无法把握其踪迹的意味。
- source_word: יַעְטֹף
  choice: 遮蔽自己
  rationale: עטף 的基本含义是“包裹、遮盖”。译作“遮蔽自己”比解释性的“转向”更贴近原文字面，也与随后“看不见”相呼应；因本句语法简约且词义有争议，脚注说明其他理解。
- source_word: יָמִין
  choice: 在右边
  rationale: 该词本义为“右边”，也可引申指“南方”。这里与“左边”平行，故保留身体方位表达。
- source_word: אֶרְאֶה
  choice: 我也看不见他
  rationale: ראה 的通常含义是“看见”。宾语“他”由上下文补出，“也”自然体现两个并列否定句之间的关系。
theological_decisions:
- issue: 第三人称动词及代词所指
  choice: 按上下文理解为神，但正文沿用“他”而不直接补出“神”
  alternative: 在正文中明确译成“神”
  rationale: 本节没有明说主语的名称，但约伯记23:8–10清楚表明约伯正在寻求神。保留代词既忠于本节形式，也不损害上下文指向。
- issue: יַעְטֹף 所表达的动作
  choice: 译为“遮蔽自己”
  alternative: 译为“转向右边”或“在右边环行”
  rationale: 原词通常涉及包裹或遮盖；采用较贴近词汇本义的译法，避免把有争议的诗句直接解释成单纯的转向动作。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留希伯来诗歌的左右平行结构，并以“察觉不到／看不见”呈现约伯寻而不得的经验；不将原文未明说的“神”直接加入正文。
