base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: zh_hans
  text: 但愿我知道在哪里可以找到他，能到他的居所[a]去！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的地方”。希伯来语这个词可指固定或确立的地点。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: 但愿
  rationale: 这是表达强烈愿望的希伯来语习语，并非真的询问“谁会赐给”。“但愿”自然保留了约伯渴望寻见上帝的语气。
- source_word: יָדַעְתִּי
  choice: 我知道到哪里
  rationale: 动词形式本为第一人称完成式，但在愿望句中表示约伯所盼望达到的认知状态。原文没有单独表示“哪里”的词；这里根据下文“找到他”和“到……去”补出地点关系，使现代汉语完整自然。
- source_word: וְאֶמְצָאֵהוּ
  choice: 能找到他
  rationale: 未完成式承接前面的愿望语气；“能”体现所盼望的可能性。第三人称阳性单数宾语后缀按上下文指上帝。
- source_word: אָבוֹא עַד
  choice: 好到……去
  rationale: “好”自然表达前一愿望所指向的目的；עַד在这里标示趋向的终点，译为“到”。
- source_word: תְּכוּנָתוֹ
  choice: 他的居所
  rationale: 该名词可指固定、确立的地方；此处是约伯盼望前往并在那里寻见上帝的地方。“居所”简洁自然，同时以脚注保留较宽泛的词义。
theological_decisions:
- issue: 两个第三人称阳性单数后缀所指对象
  choice: 按上下文理解为上帝，以“他／他的”表达
  alternative: 在正文中直接补出“上帝／上帝的”
  rationale: 上下文清楚表明约伯想在上帝面前陈明案件，但本节没有明说“上帝”。保留代词既忠于原文，也不增加不必要的明示。
- issue: תְּכוּנָתוֹ是否带有审判席或宝座的含义
  choice: 译作“他的居所”
  alternative: 译作“他的座所／宝座”
  rationale: 上下文具有约伯要到上帝面前申诉的司法色彩，但该名词本身主要表示固定或确立的地方，并不明确等同于“宝座”。因此不把司法意象写死。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“但愿……好……”传达原文连续的愿望语气；句末用感叹号体现约伯强烈的渴望。
