base_translation:
  language: en
  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: zh_hans
  text: 在那里，正直的人可以与他申辩[a]；我就会永远脱离我的审判者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与他辩论”，或“在他面前陈明案情”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我就会永远逃离审判我的那一位。”希伯来文也可理解为“从审判我的那一位那里得释放”。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: 在那里
  rationale: 这是地点副词，指向上下文中约伯设想与上帝相会、陈明案件之处；“在那里”自然清楚。
- source_word: יָשָׁר
  choice: 正直人
  rationale: 该词表达道德上的正直与无可指摘；在此按名词性用法译为“正直人”，符合司法语境。
- source_word: נוֹכָח
  choice: 可以……申辩
  rationale: 此处具有司法性的辩论、陈诉意味；“申辩”既保留法庭意象，又比单纯“讲理”更准确。结合上下文以“可以”表达设想中的可能性。
- source_word: עִמּוֹ
  choice: 与他
  rationale: 介词直译为“与”，代词在上下文中指上帝；保留“他”而不明说所指，维持原文表达方式。
- source_word: וַאֲפַלְּטָה
  choice: 我就会……摆脱
  rationale: פלט表示逃脱、获救或被解救；“摆脱”在此可表达从审判者手下脱身，又不把含义收窄为正式的“宣告无罪”。
- source_word: לָנֶצַח
  choice: 永远
  rationale: 表示持续、永久的结果；“永远”是现代汉语中自然且有力度的对应。
- source_word: מִשֹּׁפְטִי
  choice: 摆脱我的审判者
  rationale: 可直解为“离开我的审判者”，也可理解为“摆脱那审判我的”；“我的审判者”简洁地保留司法意象及角色所指的张力。
theological_decisions:
- issue: “我的审判者”的所指及司法含义
  choice: 保留“我的审判者”，不进一步说明是作为裁判者的上帝，还是约伯想要摆脱的审判者。
  alternative: 审判我的那一位；我的控告者
  rationale: 原文处于司法语境，但没有要求译文把该角色解释为“控告者”，也不宜在正文中消除约伯向上帝申诉、同时又求脱离审判者所形成的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“申辩”“审判者”维持本节的法庭意象；分号呈现两分句之间的推论关系。所有脚注标记均置于正文相应词语之后。
