  yaml_path: translation/ot/job/023/002.yaml
  text: Even today my complaint is rebellious[b][a]; my hand is heavy because of my groaning.
translation:
  language: zh_hans
  text: 今天也是，我的申诉仍是悖逆的[a]；我的手因我的叹息而沉重[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的申诉仍是苦涩的。”这个希伯来词通常指悖逆或反抗；有些解释者根据上下文将其理解为“苦涩”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“我的手在我的叹息之上沉重。”这句话的含义和介词关系不甚明确；有人将“手”按惯用语理解为受压抑或负重的表达，也有人校改文本，译作“他的手”。
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: 即使到了今天
  rationale: גַּם与“今天”连用，在这里突出约伯的处境和申诉延续至今；“即使到了今天”符合现代汉语表达，也保留强调意味。
- source_word: מְרִי
  choice: 悖逆的
  rationale: 该词通常指悖逆、反抗或违抗。这里用来描述约伯的诉说；保留较强烈的词义，不因上下文而淡化为“苦涩”。
- source_word: שִׂיחִי
  choice: 我的诉说
  rationale: 该词可指默想、谈论或倾诉；在约伯哀诉的语境中，“诉说”既自然，又能包含申诉和抱怨的意味。
- source_word: יָדִי
  choice: 我的手
  rationale: 马所拉文本明确为第一人称单数“我的手”。尽管有人按惯用表达解释，或校改为“他的手”，正文仍保留现有希伯来文本。
- source_word: כָּבְדָה
  choice: 沉重
  rationale: 该动词表示重、沉重；中文用状态性的“沉重”简洁地传达其含义。
- source_word: עַל
  choice: 因
  rationale: עַל的关系较宽，可表示在……之上、对于或由于。正文采用合乎汉语的因果表达，同时在脚注保留其较直译的空间关系。
- source_word: אַנְחָתִי
  choice: 我的叹息
  rationale: 该词指因痛苦而发出的叹息或呻吟；“叹息”在庄重的现代汉语中自然，并与约伯的哀诉相称。
theological_decisions:
- issue: 是否弱化约伯对自己诉说的描述，以免暗示他在悖逆
  choice: 正文保留较强的“悖逆”
  alternative: “我的诉说仍是苦涩的”
  rationale: 希伯来词本身通常表达悖逆或反抗。译文应保留义人在苦难中以近乎抗辩的语言发声所造成的神学张力，而不应为避免不适而自行软化。
- issue: “手”所指为何，以及它与“叹息”的关系
  choice: 保留马所拉文本的“我的手”，正文将עַל表达为因果关系
  alternative: “他的手重压着我的叹息”或“我的手重压在我的叹息之上”
  rationale: “我的手”有直接的文本依据，但整句含义不十分明确。正文不采纳校改为“他的手”的读法；脚注则说明直译及主要替代解释，避免把难句解释得过于确定。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“即使到了今天”强化持续至今的意味；“诉说”比“抱怨”稍宽，适合约伯整段申辩。“我的手因我的叹息而沉重”保持正文可读性，同时借脚注交代希伯来原句的生硬结构和文本解释上的不确定性。
