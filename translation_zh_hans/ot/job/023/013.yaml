source:
  edition: WLC
  text: וְ/ה֣וּא בְ֭/אֶחָד וּ/מִ֣י יְשִׁיבֶ֑/נּוּ וְ/נַפְשׁ֖/וֹ אִוְּתָ֣ה וַ/יָּֽעַשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: zh_hans
  text: 但他始终如一[a]，谁能使他回转呢？他心里所愿的，他就去做[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“但他是一个”或“但他在一中”，可能表示他心意专一、定意不变。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“他的魂所愿的，他就做”；“魂”在这里是表达他自己意愿的常见说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: 但他
  rationale: 连词在上文语境中带有转折意味，独立代词又突出“他”；“但他”在现代汉语中自然保留这两层作用。
- source_word: בְאֶחָד
  choice: 始终如一
  rationale: 原文较直译为“在一中／是一个”，语义较为含混；结合下句无人能使他回转，此处很可能指他的心意或定意始终一致。“始终如一”既能表达语境中的坚定不变，也避免扩展为系统性的形而上论断。
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: 谁能使他回转呢
  rationale: שׁוב的使役形在此表示使之返回、转向或改变进程；“使他回转”保留原文意象以及反问语气。
- source_word: וְנַפְשׁוֹ אִוְּתָה
  choice: 他心里所愿的
  rationale: נֶפֶשׁ字面可指“魂、生命、自己”，这里用来表达主体自身的愿望；汉语“心里所愿”自然传达此希伯来表达，并保留意愿的内在性。
- source_word: וַיָּעַשׂ
  choice: 他就去做
  rationale: עָשָׂה是普通的“做、行”；“就去做”承接前面的愿望，避免增添“必成就”等原文未明说的结果含义。
theological_decisions:
- issue: 如何表达上帝固定而无人能扭转的意旨
  choice: 但他始终如一，谁能使他回转呢？
  alternative: 但他是独一的，谁能使他回转呢？／但他心意不变，谁能使他回转呢？
  rationale: בְאֶחָד字面表达罕见且存在歧义，可理解为“是一个／在同一心意中”，语境则强调他的定意无法被扭转。“始终如一”保留“同一、一致”的回声，并表达语境意义，却不把经文直接提升为对神本体不变性的完整教义陈述。
- issue: 是否在正文保留“他的魂”这一拟人化表达
  choice: 他心里所愿的
  alternative: 他的魂所愿的／他所愿的
  rationale: 原文“他的נֶפֶשׁ”是表达自身意愿的常见说法。中文直译“他的魂所愿的”生硬且可能误导；“心里所愿”保留内在意愿及拟人色彩，同时不暗示关于上帝构成的教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“始终如一”比“是一个”更易懂，又以脚注保存原文的真实歧义；反问句及前后简洁平行的节奏得到保留。
