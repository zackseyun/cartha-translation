base_translation:
  language: en
  yaml_path: translation/ot/job/023/015.yaml
  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
translation:
  language: zh_hans
  text: 因此，我在他面前惊惶[a]；我思量时[b]，就惧怕他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他面前”也可理解为“因他”或“由于他的临在”；希伯来语字面涉及“从他的面前”。
    reason: lexical_alternative
  - marker: b
    text: “我思量时”也可译作“我仔细思量时”或“我沉思时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 承接上文，明确表达由前述情形所得出的结果。
- source_word: מִפָּנָיו
  choice: 在他面前
  rationale: 保留希伯来语“从他的面／临到他的面前”这一具体意象，同时自然表达约伯面对上帝时的反应；不把它单一解释为纯粹的原因关系。
- source_word: אֶבָּהֵל
  choice: 惊惶
  rationale: 该词的尼法勒式表达受惊、慌乱或恐惧；“惊惶”既有足够强度，也符合庄重的现代汉语。
- source_word: אֶתְבּוֹנֵן
  choice: 我越思想
  rationale: 该形式表示仔细思量、反复思想；结合后句，以“越……越……”自然呈现思想加深而恐惧随之加深的语义关系，但不改变其反思含义。
- source_word: וְאֶפְחַד
  choice: 就越惧怕
  rationale: פחד直接表示害怕、惧怕；与前面的思想过程衔接，传达持续并加深的恐惧。
- source_word: מִמֶּנּוּ
  choice: 他
  rationale: 与פחד连用，汉语自然译为“惧怕他”；保留原文代词，不擅自补入“上帝”这一称号。
theological_decisions:
- issue: 第三人称阳性代词所指
  choice: 保留“他”，由上下文指向上帝
  alternative: 在正文中明确译作“上帝”
  rationale: 原文使用代词，且上下文已足以确定所指；保留代词可维持篇章推进，也避免增添原文没有的称号。
- issue: 约伯面对上帝时恐惧的强度
  choice: 采用“惊惶……惧怕”的强烈措辞
  alternative: 弱化为“不安”或解释为“敬畏”
  rationale: 原文呈现真实而强烈的惊惧，不宜把这种张力化解为较温和的敬虔感受。
- issue: 思想与恐惧之间的关系
  choice: 译为“我越思想，就越惧怕他”
  alternative: 并列译为“我思想，就惧怕他”或“我一想到，就害怕他”
  rationale: 原文前后两动词可理解为思量之后产生恐惧；“越……越……”以自然汉语体现这一进展关系，同时脚注保留较中性的理解。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“惊惶”保留诗歌语体和恐惧强度；分号对应两组紧密相关的分句。所有脚注标记均已置于正文相应位置。
