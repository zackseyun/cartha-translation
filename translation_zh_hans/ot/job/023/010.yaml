base_translation:
  language: en
  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
translation:
  language: zh_hans
  text: 但他知道我所走的路[a]；他若试验我[b]，我必如金子般显露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他知道我的道路。”希伯来文较直译为“他知道与我同在的道路”；此处通常理解为“我所走的路”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“当他试验我时”或“他试验我以后”。希伯来文在这里可有不同的时间或条件意味。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 但
  rationale: 此处承接上文约伯寻不见上帝，与上帝却完全知道他的处境形成转折；“但”自然表达这一语篇关系。
- source_word: יָדַע
  choice: 知道
  rationale: 表达上帝对约伯及其道路的确切认识，不额外限定为过去或经验性的认识。
- source_word: דֶּרֶךְ עִמָּדִי
  choice: 与我相伴的道路
  rationale: 尽量保留希伯来文较特别的字面结构“与我同在／同我一起的道路”，同时使现代汉语可读；不直接改写成“我的道路”。
- source_word: בְּחָנַנִי
  choice: 他若试验我
  rationale: בחן意为试验、检验，与下文金子的意象相合。前置ב结构的时间或条件色彩并不完全确定，正文采用自然的条件表达，并以脚注保留时间性译法。
- source_word: כַּזָּהָב
  choice: 如金子一般
  rationale: 保留比较形式和炼金意象，不明确添加“精炼过的”等原文未直说的成分。
- source_word: אֵצֵא
  choice: 我必……出来
  rationale: 保留יצא“出来、显出”的基本图像；“必”传达未完成式在此结果陈述中的前瞻意味。
theological_decisions:
- issue: 上帝的试验与约伯所得结果的关系
  choice: 保留“试验”及“如金子出来”的比喻，不说明这是道德净化还是清白得到证实。
  alternative: 明确译成“我必被炼得纯净”或“我必证明无罪”。
  rationale: 原文的金子意象可以指经检验后显明其真质，也可能使人联想到熬炼；译文不应替原文消除这种神学张力。
- issue: בְּחָנַנִי的条件或时间含义
  choice: 正文译作“他若试验我”。
  alternative: “他试验我以后”或“当他试验我时”。
  rationale: 该结构可容纳条件或时间意味；正文选择通顺且符合约伯自信陈述的表达，脚注明确列出其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与我相伴的道路”有意保留原文不寻常的表达；“如金子一般出来”保留检验与炼金的图像，不擅自补入净化或称义等解释。
