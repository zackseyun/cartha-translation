  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: zh_hans
  text: 看哪，我往东边[a]去，他却不在那里；我往西边去，却察觉不到他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东边……西边”或译“前面……后面”。希伯来语所用的方向词可理解为东／西，也可理解为前／后。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留引人注意的感叹语气；“看哪”庄重而清楚，也比单用“看”更适合诗体。
- source_word: קֶדֶם
  choice: 东边
  rationale: 与אָחוֹר构成相对的方向词；在此寻找上帝的语境中，译作空间方位“东边”自然，同时以脚注保留“前面”的可能。
- source_word: אֶהֱלֹךְ
  choice: 我……去
  rationale: 该词是הלך的Qal未完成式第一人称单数，表示约伯朝某方向行动；“去”自然简洁，不额外限定行走方式。
- source_word: וְאֵינֶנּוּ
  choice: 他却不在那里
  rationale: 原文直译近于“而他不在”；按方向性语境补出“那里”，并以“却”表达寻找落空所形成的转折。
- source_word: אָחוֹר
  choice: 西边
  rationale: 作为קֶדֶם的对应方向，在诗句中可理解为西边；脚注同时保留较字面的“后面”。
- source_word: לֹא אָבִין לוֹ
  choice: 也察觉不到他
  rationale: בין可指理解、辨明或察觉；在寻找却无法发现上帝的语境中，“察觉不到”传达无法感知或辨认其所在，又不把含义收窄为视觉上的“看见”。
theological_decisions:
- issue: 第三人称代词的所指
  choice: 将其译为指向上帝的“他”
  alternative: 视为未明确说明的男性单数对象
  rationale: 上下文是约伯寻找上帝，因此代词指上帝最符合语境；中文保留“他”，不另加神学解释。
- issue: בין在本节中的含义
  choice: 理解为无法察觉、辨明上帝
  alternative: 译为“不能明白他”
  rationale: 全句描述约伯向不同方向寻找上帝，感知或辨认的意义更贴合空间搜索语境；同时避免暗示约伯是在讨论对上帝本性的理性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留希伯来诗歌的提示语气；分号呈现两组相对方向的平行结构。
