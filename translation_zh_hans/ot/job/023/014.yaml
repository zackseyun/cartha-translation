  text: כִּ֭י יַשְׁלִ֣ים חֻקִּ֑/י וְ/כָ/הֵ֖נָּה רַבּ֣וֹת עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: zh_hans
  text: 因为他必成就为我所定的事[a]；在他那里还有许多这样的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的定例”、“为我定的份”。希伯来语可指为约伯规定、确定或分派的事。
    reason: 词义存在多种可能，正文采用符合语境而又较为宽泛的表达。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为约伯惧怕上帝的陈述提供原因，保留原文的解释和因果作用。
- source_word: יַשְׁלִים
  choice: 必成就
  rationale: 该词在此表示使某事达到完成；“成就”既自然，也能表达上帝将所定之事贯彻到底。
- source_word: חֻקִּי
  choice: 为我所定的
  rationale: חֹק可指律例、定规或所分派的份；本处语境指为约伯规定或安排的事。“为我所定的”避免误解为约伯自己制定的法令，同时保留其内容未明的张力。
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: 还有许多这样的事
  rationale: 表达同类之事不止一件，不具体限定这些事究竟是旨意、遭遇还是安排。
- source_word: עִמּוֹ
  choice: 他那里
  rationale: 贴近“与他同在/在他那里”的宽泛表达，暗示这些事在上帝的掌握或筹划中，却不将这一含义解释得过满。
theological_decisions:
- issue: חֻקִּי应按法律术语理解，还是指上帝为约伯所定的份或安排
  choice: 为我所定的
  alternative: 我的定例／为我所定的份
  rationale: 上下文谈到上帝对约伯道路和遭遇的决定，而不是约伯自己的法规。此译体现上帝的主权，同时不把原文限定为严格的法律术语或特定命运观。
- issue: עִמּוֹ是否应明确解释为上帝心中的计划或权能中的安排
  choice: 他那里
  alternative: 在他手中／在他的筹划中
  rationale: 原文只说“与他同在”，采用较开放的措辞，以保留这些事是在上帝那里、由他掌握或筹定等多种可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必成就”保留语气的确定性；“他那里”略带经文庄重感，同时避免过度阐释。脚注标记已在正文相应位置标出。
