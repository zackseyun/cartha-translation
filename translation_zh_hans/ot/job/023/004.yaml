  yaml_path: translation/ot/job/023/004.yaml
  text: I would lay out my case before him[b][a], and fill my mouth with arguments.
translation:
  language: zh_hans
  text: 我要在他面前陈明我的案件[a]，并使我口中充满申辩之词[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要在他面前按次序陈列我的案件。”这里的“案件”原文带有司法含义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“论证”“责备”或“争辩之词”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: 陈明
  rationale: 该动词表示排列、整理或有条理地摆出；在本节的司法语境中，“陈明”自然地表达正式、有条理地呈上案情。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 直译为“在他面前／在他面前的所在”，既自然，又保留当面陈诉及司法审理的意味。
- source_word: מִשְׁפָּט
  choice: 我的案件
  rationale: 该词常指审判、公正或案件；与“陈明”及下半句相连时，司法性的“案件”最贴切。“我的”虽非希伯来文中明说，却由第一人称语境明确蕴含。
- source_word: וּפִי אֲמַלֵּא
  choice: 满口
  rationale: 原文直译为“我要使我的口充满”。“满口”保留身体意象，同时符合现代汉语表达。
- source_word: תּוֹכָחוֹת
  choice: 论据
  rationale: 此复数名词可指责备、辩驳、证明或争论；在法庭式语境中，“论据”体现约伯为自己的案件提出理由，又不把词义局限为道德责备。
theological_decisions:
- issue: 约伯向上帝说话时的司法意象
  choice: 采用“案件”和“论据”，明确保留法庭式语言及约伯大胆申诉的语气。
  alternative: 较笼统地译为“陈明我的缘由”或“诉说我的苦情”。
  rationale: ערך、משפט和תוכחות共同构成有条理地提出案件并加以辩论的司法图景。译文不削弱约伯的大胆，也不把这种张力解释为不敬。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“陈明我的案件”保留正式司法色彩；“满口提出论据”兼顾原文“使口充满”的意象与自然汉语。脚注标记按正文出现顺序排列。
