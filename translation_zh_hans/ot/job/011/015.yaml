  text: For then you will lift up your face without blemish[b][a]; you will stand firm and will not fear.
translation:
  language: zh_hans
  text: 那时，你必昂首，毫无瑕疵[a]；你必稳固[b]，不再惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必昂首，不再羞愧。”原文直译为“抬起你的脸，毫无瑕疵”，保留恢复信心、不再受羞辱的意象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你必坚立”或“你必安稳。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז
  choice: 那时
  rationale: כִּי在此引出前述条件所带来的结果，אָז标明随之而来的时刻。汉语用“那时”即可自然承接上下文，不必生硬地另译“因为”。
- source_word: תִּשָּׂא פָנֶיךָ
  choice: 你必抬起脸来
  rationale: 保留希伯来语“抬起脸”的具体意象，同时在现代汉语中自然可懂，表达恢复信心、不再蒙羞。
- source_word: מִמּוּם
  choice: 毫无瑕疵
  rationale: מוּם通常指缺陷或瑕疵；这里具有比喻意味，指不再带着污点或羞耻。“毫无瑕疵”保留原文意象，而不把含义限定为“毫无羞愧”。
- source_word: מֻצָק
  choice: 坚定安稳
  rationale: 该词在此表达坚固、稳立或安然确立的状态。“坚定安稳”兼顾稳固与安全两层可能含义。
- source_word: וְלֹא תִירָא
  choice: 毫不惧怕
  rationale: 直接表达否定的将来状态；“毫不惧怕”简洁庄重，也与诗句节奏协调。
