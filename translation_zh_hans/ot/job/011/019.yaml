  yaml_path: translation/ot/job/011/019.yaml
  text: You will lie down[a], and none will make you afraid; many will entreat your favor.
translation:
  language: zh_hans
  text: 你必躺卧，无人使你惊惧；许多人必求你的恩宠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָבַצְתָּ
  choice: 你必躺卧
  rationale: רבץ直接表示躺下、卧息，并在本节语境中带有安稳休息的意味；“躺卧”保留具体意象而不过度解释。
- source_word: מַחֲרִיד
  choice: 使你惊惧
  rationale: 该使役分词指使人战栗、害怕者；与וְאֵין连用译作“无人使你惊惧”，既贴近句法，也符合现代汉语表达。
- source_word: חִלּוּ פָנֶיךָ
  choice: 求你的恩宠
  rationale: חלה פני是求取某人善意或恩待的惯用语；“求你的恩宠”自然传达其关系性含义，同时保留恳求意味。
- source_word: רַבִּים
  choice: 许多人
  rationale: 该词在此作名词，指人数众多的人；“许多人”简明准确。
- source_word: וְאֵין
  choice: 无人
  rationale: 存在否定式在此表示没有任何使人惊惧者；“无人”简洁地保留原意。
