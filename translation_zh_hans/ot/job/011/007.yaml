base_translation:
  language: en
  yaml_path: translation/ot/job/011/007.yaml
  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: zh_hans
  text: 你能探明上帝深奥之处[a]吗？你能探到全能者的尽头[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深奥之处”或译“探究”“所探究的事”。希伯来词חֵקֶר可指搜寻、考察，也可指被探究的深处或奥秘。
    reason: lexical_alternative
  - marker: b
    text: “尽头”或译“全部范围”；该词也可指“完全”或“完满”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: 深奥
  rationale: חֵקֶר可指搜寻、探究，也可指探究所要触及的深处或奥秘。结合动词“找到”和本节的反问语气，“深奥”自然地表达上帝超越人所能彻底探明之处，同时保留原词的多义性于脚注。
- source_word: אֱלוֹהַ
  choice: 上帝
  rationale: 这是《约伯记》中常见的单数神称；译作“上帝”简明自然，并与下半句“全能者”构成平行。
- source_word: תִּמְצָא
  choice: 探明／探知
  rationale: מצא基本义为“找到”。两处分别译为“探明”和“探知”，使现代汉语搭配自然，也传达经过探究而有所发现的含义；轻微措辞变化不改变原文两处动词相同这一事实。
- source_word: אִם
  choice: 能……吗
  rationale: 此处引出与上半句平行的反问，并非表达条件；汉语用“能……吗”准确呈现其语用功能。
- source_word: עַד תַּכְלִית
  choice: 极限
  rationale: עַד与תַּכְלִית合用，指达到终点、尽头或全部范围。“极限”简洁保留边界和最大范围的意象；其他可能含义列入脚注。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 采用这一神圣称号在现代汉语圣经语体中的通行意译，既庄重又能与“上帝”自然平行。
theological_decisions:
- issue: 人能否认识上帝
  choice: 以两个反问表达世人不能彻底探明上帝的深奥，也不能达到他的全部范围
  alternative: 将本节解释为人完全不能对上帝有任何真实认识
  rationale: 原文强调人无法探究到底、无法达到尽头，却没有断言人对上帝毫无认识。译文保留这种张力，不把本节扩展为更强的不可知论命题。
- issue: “全能者的极限”是否暗示上帝实际有限
  choice: 保留原文的边界意象和反问形式
  alternative: 直接释义为“你能完全认识全能者吗”
  rationale: תַּכְלִית本有尽头、全部范围等含义。反问的预期答案是否定的，因此译文并未断言全能者确有可达到的极限；保留该意象比直接加入“完全认识”更贴近原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个“你能……吗”保持希伯来诗歌的平行反问；“探明／探知”与各自宾语搭配自然。“深奥”和“极限”保留原文的探究与边界意象，脚注说明关键希伯来词的真实语义幅度。
