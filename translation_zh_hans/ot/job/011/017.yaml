  yaml_path: translation/ot/job/011/017.yaml
  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: zh_hans
  text: 你的一生[b]必升起，明亮胜过正午[a]；即使有幽暗[c]，它也必变得如清晨般明亮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的一生必比正午更明亮；幽暗也必如同清晨。”希伯来文含有几处高度凝练的诗歌表达，尤其是后半句。
    reason: alternative_reading
  - marker: b
    text: 译作“一生”的希伯来词也可指“生命”“寿命”，或更广义的“人在世的生活”。
    reason: lexical_alternative
  - marker: c
    text: 译作“幽暗”的希伯来词十分罕见，含义不能完全确定；也可理解为“黑暗”“昏暗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: 明亮胜过正午
  rationale: 介词 מִן 在这里最自然地表示比较，即“胜过正午”。原文省略了“明亮”一类的形容词；译文依照上下文的光暗意象补出，使压缩的诗句在现代汉语中清楚可懂。
- source_word: יָקוּם
  choice: 必升起
  rationale: 保留 קום“起来、升起”的诗歌意象，不把它完全解释为“兴盛”或“转好”。
- source_word: חָלֶד
  choice: 你的一生
  rationale: חָלֶד 可指寿命、人生或人在世的年日。这里用“你的一生”，既自然，也保留其时间与尘世生活的含义。
- source_word: תָּעֻפָה
  choice: 即使有幽暗
  rationale: 这是罕见且含义不确定的词，按它与“清晨”的对照译作“幽暗”。“即使……也……”将诗句中隐含的让步关系表达出来，但不把该词过度限定为某一种黑暗。
- source_word: כַּבֹּקֶר
  choice: 如同清晨
  rationale: 保留介词 כ־ 所表达的比喻，并将 בֹּקֶר 直译为“清晨”。
- source_word: תִּהְיֶה
  choice: 必变得
  rationale: היה 基本义是“是、成为”；这里的上下文呈现幽暗转为晨光般明亮的变化，因此译作“变得”更符合汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“必升起”刻意保留原文意象；“明亮”是依据“正午—幽暗—清晨”的光暗对照补出的必要语义。“即使……也……”使原诗隐含的转折关系在汉语中自然显明，同时以脚注保留更贴近形式的另一种读法。
