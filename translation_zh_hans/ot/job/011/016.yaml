  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
translation:
  language: zh_hans
  text: 因为你必忘记苦难；你会把它记作已流逝的水。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 后半句也可译作：“你会记得它，如同已经过去的水。”希伯来文把从前的苦难比作已经流逝、不再停留的水。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的应许，引出其结果或理由；“因为”自然体现这里的解释关系。
- source_word: אַתָּה
  choice: 你
  rationale: 原文明确使用第二人称单数代词以加强语气，中文保留“你”。
- source_word: עָמָל
  choice: 苦难
  rationale: 该词可指劳苦、患难或痛苦；本节谈到将被抛在身后的受苦经历，“苦难”既贴合语境，也不过度限定其性质。
- source_word: תִּשְׁכָּח
  choice: 必忘记
  rationale: Qal未完成式第二人称阳性单数，在此表达将来的确定结果；“必”传达应许语境中的确定性。
- source_word: כְמַיִם
  choice: 如……水
  rationale: 前缀כְ表示比较；中文以“如”保留诗歌性的明喻，水的意象也予以保留。
- source_word: עָבְרוּ
  choice: 已经流逝
  rationale: עבר的完成式描述水已经过去；“流逝”既符合水流意象，也表现其不再停留。
- source_word: תִזְכֹּר
  choice: 想起
  rationale: Qal未完成式第二人称阳性单数；原文未明说宾语，但语境指前述“苦难”。中文句式以“即使想起”自然承接，同时不把隐含宾语说得过重。
