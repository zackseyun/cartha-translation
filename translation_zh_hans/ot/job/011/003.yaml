base_translation:
  language: en
  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: zh_hans
  text: 你的空谈岂能使人闭口不言[a]？你嘲笑时，难道无人使你蒙羞吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空谈”也可译作“夸口”“胡言”或“虚妄的话”；希伯来语这个词可指空洞、无益、夸张或虚假的言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: 你的空谈
  rationale: בַּדִּים在此指空洞、无益的话，也可能带有夸口、胡言或虚假言语的意味。“空谈”既保留琐屑无实的贬义，也不武断地译成“谎言”。
- source_word: מְתִים
  choice: 人
  rationale: 该复数名词指人或世人；现代汉语用“人”自然、概括，且无需加入原文在此并未着重表达的性别含义。
- source_word: יַחֲרִישׁו
  choice: 使人闭口不言
  rationale: חרש的使役形在此表达使别人沉默。“使人闭口不言”保留使役意味，也符合反问语气。
- source_word: וַתִּלְעַג
  choice: 你嘲笑时
  rationale: לעג意为嘲笑、讥诮。连词在诗歌反问中可理解为承接情境；译作“你嘲笑时”使两分句关系自然，同时不改变动作本身。
- source_word: מַכְלִם
  choice: 使你蒙羞
  rationale: כלם的使役分词表示使人羞愧或受辱。“使你蒙羞”保留其直接的人际作用，比“责备你”更贴近词义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的反问句式；以“岂能……？……难道……吗？”再现诗句的责问力度。脚注保留בַּדֶּיךָ的真实语义范围，不把它过度限定为“谎言”。
