  text: גָּבְהֵ֣י שָׁ֭מַיִם מַה תִּפְעָ֑ל עֲמֻקָּ֥ה מִ֝/שְּׁא֗וֹל מַה תֵּדָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: zh_hans
  text: '它比诸天更高——你能做什么？


    它比阴间更深——你又能知道什么？[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”所译的希伯来词是“示奥勒”，指死者的领域；也可译作“坟墓”或“死人之地”。
    reason: 说明שְׁאוֹל的词义范围及替代译法，同时避免把“阴间”表述为与原文逐字等同。
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: 高过诸天
  rationale: 原文是“天的高处”，在上下文中承接上一节所说神的奥秘和全能者的完全；译成比较结构，既符合诗歌的平行句式，也自然传达其不可企及的高度。
- source_word: מַה
  choice: 什么
  rationale: 两处均为疑问代词，引出反问；“什么”直接保留原文的质问语气。
- source_word: תִּפְעָל
  choice: 你能做什么
  rationale: פעל的Qal未完成式第二人称阳性单数，基本义为“做、成就”；此处反问强调人的能力有限，因此用“能做”。
- source_word: עֲמֻקָּה
  choice: 深过
  rationale: 该形容词意为“深”，与上句的高度构成对称比较；“深过”简洁保留诗歌结构。
- source_word: מִשְּׁאוֹל
  choice: 过阴间
  rationale: 介词מִן在此表示比较。שְׁאוֹל指死人所在之处或死者的领域；正文用现代中文圣经语境中较为通行的“阴间”，避免将其收窄为实体坟墓。
- source_word: תֵּדָע
  choice: 你能知道什么
  rationale: ידע的Qal未完成式第二人称阳性单数，意为“知道”；与“你能做什么”平行，反问人面对这深奥之事所能知道的极其有限。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 示奥勒；坟墓；死人之地
  rationale: 此处用该词作为深度的诗意比较。“阴间”能够表达死者领域，不把意义局限为埋葬之墓，也不进一步解释其性质；脚注说明原词及可选译法，以保留其语义范围。
- issue: 两句省略主语的处理
  choice: 补出“它”，承接上一节所谈的神之奥秘或全能者的完全
  alternative: 不补主语，译作“高过诸天……深过阴间……”
  rationale: 希伯来诗句依靠上下文省略所指对象。中文补“它”可使句子完整，但不明确限定它究竟是“奥秘”还是“完全”，从而保留原文承接关系中的一定含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。上下两行保持“它……过……——你能……什么？”的平行结构，以呈现希伯来诗歌的高度、深度对照和连续反问。“诸天”保留诗体色彩；“阴间”配脚注解释。
