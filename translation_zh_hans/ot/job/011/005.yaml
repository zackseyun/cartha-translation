  text: וְֽ/אוּלָ֗ם מִֽי יִתֵּ֣ן אֱל֣וֹהַּ דַּבֵּ֑ר וְ/יִפְתַּ֖ח שְׂפָתָ֣י/ו עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/005.yaml
  text: But if only God would speak and open his lips against you,[a]
translation:
  language: zh_hans
  text: 可是，惟愿上帝说话，向你张开他的双唇[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向你”直译“与你”，也可译作“同你”。按上下文，这里可能带有对抗或反驳的意味。
    reason: 保留希伯来语介词 עִם 的基本意义，并说明其在本语境中可能具有的对抗性，避免将该含义确定化为“驳斥”。
lexical_decisions:
- source_word: וְאוּלָם
  choice: 可是
  rationale: 表示强烈转折，承接琐法此前对约伯言论的责难；“可是”自然、清楚，又保持庄重。
- source_word: מִי יִתֵּן
  choice: 惟愿
  rationale: 这是表达强烈愿望的希伯来语习语，并非询问“谁会赐下”；“惟愿”简洁而庄重。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 该词是单数的神称，此处无需扩译为“全能的上帝”。
- source_word: דַּבֵּר
  choice: 说话
  rationale: 在愿望句式中表达琐法盼望上帝亲自发言；中文无需另加情态助词。
- source_word: וְיִפְתַּח שְׂפָתָיו
  choice: 张开双唇
  rationale: 保留原文以嘴唇描写发言的拟人化意象，不将其简化为第二个“说话”。“双唇”是现代中文较自然的表达。
- source_word: עִמָּךְ
  choice: 驳斥你
  rationale: 介词字面义是“与你”，但上下文中琐法盼望上帝回应并纠正约伯，因此正文采用带对抗意味的“驳斥你”；脚注保留字面及较中性的译法。
theological_decisions:
- issue: 以“张开双唇”拟人化地描写上帝
  choice: 直接保留拟人化意象
  alternative: 意译为“向你说话”
  rationale: 原文有意使用具象的身体语言来描写上帝发言；保留该表达尊重文本修辞，并不要求读者据此断定上帝具有肉身。
- issue: עִמָּךְ 在本节中的语气
  choice: 按语境译为带对抗意味的“驳斥你”
  alternative: “与你说话”或“向你说话”
  rationale: 琐法期待上帝出言回应约伯，并在下文揭示约伯的过错，因此对抗性理解符合语境；不过介词本身较宽泛，故用脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“惟愿”保留愿望句的郑重语气；“张开双唇”保留原文意象。感叹号体现强烈愿望，脚注标记紧随所说明的词语。
