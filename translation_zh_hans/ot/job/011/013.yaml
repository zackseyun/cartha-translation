  text: אִם אַ֭תָּ֗ה הֲכִינ֣וֹתָ לִבֶּ֑/ךָ וּ/פָרַשְׂתָּ֖ אֵלָ֣י/ו כַּפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/013.yaml
  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: zh_hans
  text: 你若预备好自己的心，向他伸出双手，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向他伸出你的手。”希伯来文的“手掌／手”是单数，但这个表达通常指祷告时伸出双手的姿势。
    reason: 说明原文单数形式及祷告姿势语境中的自然译法。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出条件句，保留琐法向约伯提出的条件性劝告；“若”简洁庄重，适合本节语体。
- source_word: אַתָּה
  choice: 你
  rationale: 第二人称阳性单数，直接指约伯；汉语明示“你”，可保留原文的强调。
- source_word: הֲכִינוֹתָ
  choice: 预备好
  rationale: כון的使役词形表示使之稳妥、就绪或端正；“预备好”与“心”搭配自然，又不把内在行动过度解释为悔改或专心。
- source_word: לִבֶּךָ
  choice: 自己的心
  rationale: לֵב指人的内在，包括思想、意志和倾向；保留“心”可维持希伯来语的人观表达。“自己的”使汉语领属关系自然，并略显原文独立代词的强调。
- source_word: וּפָרַשְׂתָּ
  choice: 伸出
  rationale: פרשׂ表示展开、伸展；在祷告姿态的语境中，“伸出”是自然且准确的现代汉语。
- source_word: אֵלָיו
  choice: 向他
  rationale: 介词与第三人称阳性单数后缀表示朝向某位对象；上下文所指为上帝，但译文保留代词，不添加原文没有的名词。
- source_word: כַּפֶּךָ
  choice: 双手
  rationale: 原文名词为单数“手掌/手”，但该表达通常描写祷告时伸手的姿势；正文用汉语惯常的“双手”，并以脚注交代形式上的单数及另一译法。
theological_decisions:
- issue: אֵלָיו中代词的所指
  choice: 译作“向他”，由上下文表明所指是上帝
  alternative: 明确译作“向上帝”
  rationale: 上下文清楚指向上帝，但希伯来文本本身使用代词。保留“他”既忠于形式，也避免增加原文未明说的名词。
- issue: “预备心”的内涵
  choice: 保留较宽泛的“预备好自己的心”
  alternative: 解释性地译作“使你的心归正”或“专心悔改”
  rationale: 该动词可含使坚定、准备妥当或调整方向之意；本节未将其单独限定为某一神学行动，因此不在正文中消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留条件从句，并让本节以逗号结尾，以衔接后续经文；不把琐法的劝告改写成译者认可的神学断言。
