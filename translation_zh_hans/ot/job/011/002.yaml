  yaml_path: translation/ot/job/011/002.yaml
  text: Should a multitude of words go unanswered[a], and should a man of lips be proved right?
translation:
  language: zh_hans
  text: 话多，岂能不予回答？多言的人岂能算为有理？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: 话多
  rationale: רֹב דְּבָרִים指言语繁多；译作“话多”简洁自然，并保留对过多言辞的批评意味。
- source_word: לֹא יֵעָנֶה
  choice: 岂能无人回答
  rationale: ענה的未完成式Niphal在此表达“被回答”；汉语以“无人回答”自然呈现被动意义和反问语气。
- source_word: וְאִם
  choice: 岂能
  rationale: 该结构引出与上句平行的反问；汉语无需机械译出连接词，以第二个“岂能”体现诗句的平行和语势。
- source_word: אִישׁ שְׂפָתַיִם
  choice: 多嘴的人
  rationale: 字面为“嘴唇之人”，是指以言语多为特征的人。“多嘴的人”保留贬义，并比生硬的“嘴唇之人”更符合现代汉语。
- source_word: יִצְדָּק
  choice: 算为有理
  rationale: צדק的Qal在此具有判断或法庭语境中的“被认定为正确、有理”之意；“算为有理”避免引入后世关于“称义”的专门神学含义。
theological_decisions:
- issue: יִצְדָּק是否采用神学术语“称义”
  choice: 算为有理
  alternative: 称义；显为正直
  rationale: 本节针对约伯言辞是否因此成立，语境重在被判为有理，并非系统论述称义；采用普通判断用语可保留语境意义而不附加宗派神学色彩。
translation_notes:
  register: 采用现代、凝练而庄重的诗体反问。两句以“岂能”形成平行；“话多”“多嘴的人”通俗易懂，同时保持琐法对约伯言辞的尖锐责问。
