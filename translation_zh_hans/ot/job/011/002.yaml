  naturalness: “多嘴的人”在现代汉语常指爱插嘴、说闲话或泄密的人，语义比原文“以言辞为特征的人”更窄且偏口语，不适合本节庄重的诗体。改为“多言的人”自然、凝练，并保留上下句对言辞繁多的平行。
  terminology: 不采用“称义”；此处宜按语境译为“有理”。“不予回答”以现代书面汉语自然表达原文被动意义。
