source:
  edition: WLC
  text: וְ/יַגֶּד לְ/ךָ֨ תַּֽעֲלֻמ֣וֹת חָכְמָה֮ כִּֽי כִפְלַ֪יִם לְֽ/ת֫וּשִׁיָּ֥ה וְ/דַ֡ע כִּֽי יַשֶּׁ֥ה לְ/ךָ֥ אֱ֝ל֗וֹהַ מֵ/עֲוֺנֶֽ/ךָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/006.yaml
  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: zh_hans
  text: 并把智慧的奥秘[a]告诉你，因为真智慧有两面[b]。你要知道，上帝已经没有追究你的一些罪孽[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧隐藏的事”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为真智慧是双重的。”这里可能表示智慧比表面所见更复杂，具有不止一面。
    reason: lexical_alternative
  - marker: c
    text: 本句所用的希伯来动词含义不确定。也可译：“上帝忘记了你的一些罪孽”，或“上帝向你追讨的，比你的罪所应得的少”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד לְךָ
  choice: 并……告诉你
  rationale: 承接第5节的愿望语境，表达“愿上帝开口，并告诉你”，而非单纯将来时。
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: 智慧的奥秘
  rationale: 保留“智慧”与隐藏之事的属格关系；“奥秘”自然传达被遮蔽、未显明的内容。
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: 真智慧有两面
  rationale: כִפְלַיִם字面涉及“双重”，而תּוּשִׁיָּה指健全、有效的智慧；此译保留意象，并表达智慧并非表面所见那么简单。
- source_word: וְדַע
  choice: 你要知道
  rationale: 直接体现祈使语气，并自然引出琐法对约伯的结论。
- source_word: יַשֶּׁה לְךָ אֱלוֹהַ מֵעֲוֺנֶךָ
  choice: 上帝已经少追究了你的一些罪孽
  rationale: 动词יַשֶּׁה含义困难，可能与“忘记”有关；结合מן的部分含义及上下文，此处表达上帝并未按约伯全部罪责追讨。“少追究”较自然地保留这一语境含义，同时不把它当作叙述者认可的判断。
theological_decisions:
- issue: 琐法所说上帝如何对待约伯的罪
  choice: 上帝已经少追究了约伯的一些罪孽
  alternative: 上帝忘记了约伯的一些罪孽；上帝向约伯追讨的少于其罪所应得的
  rationale: 希伯来动词难解，但语境倾向于琐法指控约伯所得惩罚尚少于其应得。正文忠实呈现琐法的主张，并不暗示叙述者或译者认可其神学判断。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“奥秘”“真智慧”“罪孽”保持诗歌智慧文学的凝练语体；“少追究”使困难动词在汉语中可理解，同时用脚注保存其他真实可能。
