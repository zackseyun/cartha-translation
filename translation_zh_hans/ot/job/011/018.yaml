  text: And you will be secure[a], because there is hope; you will look around and lie down in safety.
translation:
  language: zh_hans
  text: 你必安稳，因为有盼望；你察看四周[a]，必安然躺卧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察看四周”或译“挖掘”。该希伯来语动词本义为“挖掘”；在这里可能指躺卧前察看或预备地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: 你必安稳
  rationale: בטח在此结合“因为还有盼望”，表达由盼望而来的安稳与无惧；“安稳”既自然，也避免只译成主观的“信靠”。
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: 因为还有盼望
  rationale: תִּקְוָה通常指“盼望、期待”；存在句יֵשׁ译为“还有”，在当前困境的语境中自然传达“仍有盼望”，而כִּי保留因果关系。
- source_word: וְחָפַרְתָּ
  choice: 你察看四周
  rationale: חפר本义与“挖掘”有关，但此处置于躺卧之前，可能指查看、搜察或整备周围；正文采用符合现代汉语语境的“察看四周”，并以脚注保留字面及其他可能。
- source_word: לָבֶטַח
  choice: 安然
  rationale: 此处作副词性表达，表示安全、无惧；与“躺卧”搭配时，“安然”简洁自然。
- source_word: תִּשְׁכָּב
  choice: 你必躺卧
  rationale: שׁכב具体指“躺下、躺卧”；保留具体图景，不扩译为较抽象的“休息”。
