  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: zh_hans
  text: 他若经过，把人拘禁，又召集会众[a]，谁能使他回转呢[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “召集会众”也可译作“聚集众人”或“召开集会”，并可能带有司法审理的意味。
    reason: lexical_alternative
  - marker: b
    text: “使他回转”也可按上下文理解为“扭转这事”，即谁能改变他所做的事。希伯来文末尾的阳性单数后缀直接指“他”；“这事”的理解是对整句话的语义引申。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出假设性陈述；“若”保留条件语气，也符合庄重而自然的现代汉语表达。
- source_word: יַחֲלֹף
  choice: 经过
  rationale: חלף在此表示经过或穿过；“经过”保留动作意象，不额外加入毁灭或突袭的含义。
- source_word: וְיַסְגִּיר
  choice: 将人拘禁
  rationale: סגר的使役形可表示关住、拘禁或交付。希伯来文未明说宾语；汉语补出泛指的“人”以使句意自然，同时不指定具体对象。
- source_word: וְיַקְהִיל
  choice: 召集会众
  rationale: קהל的使役形表示使人聚集、召集或召开。“召集会众”体现使役意味，并保留可能的公开或司法场景。
- source_word: וּמִי
  choice: 谁能
  rationale: 连接词与疑问代词构成反问；汉语以“谁能”自然表达无人能够阻止的语势。
- source_word: יְשִׁיבֶנּוּ
  choice: 使他回转
  rationale: שוב的使役形意为使返回或使回转，阳性单数后缀按直接语法关系译作“他”；这一表达保留原文措辞，而没有进一步解释为“阻止”。
theological_decisions:
- issue: 阳性单数动词的主语及末尾代词的所指
  choice: 按上下文将主语理解为上帝，并将末尾阳性单数后缀译为“他”。
  alternative: 末尾后缀也可从行动结果着眼，理解为“这事”，即“谁能扭转这事”。
  rationale: 上下文谈论上帝的知识与无法抗拒的行动，个人代词最顺应直接语境；但原文末尾后缀在释义上仍可指向他所做之事，因此在脚注中保留另一理解，不消除原文的张力。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。保留连续动作与末尾反问的结构；为符合汉语习惯，在“拘禁”前补出泛指宾语“人”。脚注按正文出现次序重新编排，使词义说明紧随“召集会众”，代词歧义紧随“使他回转”。
