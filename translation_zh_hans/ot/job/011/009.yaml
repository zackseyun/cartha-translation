base_translation:
  language: en
  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: zh_hans
  text: 它的范围比大地更长，比海更宽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的尺度比大地更长，比海更宽。”
    reason: 词义选择：מִדָּהּ可指“度量、尺度”或“范围”；正文按语境采用较自然的“范围”。
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: 更长
  rationale: 阴性单数形容词，与“它的尺度”相呼应；在比较介词 מִן 后用“更长”自然准确。
- source_word: מֵאֶרֶץ
  choice: 比大地
  rationale: 前缀 מִן 在此表示比较而非分离；אֶרֶץ 与“海”平行，宇宙性的语境中译作“大地”较合适。
- source_word: מִדָּהּ
  choice: 它的尺度
  rationale: מִדָּה 可指度量、大小或范围；“尺度”保留原文具体名词及其第三人称阴性单数后缀，所指承接上文。
- source_word: וּרְחָבָה
  choice: 更宽
  rationale: 阴性单数形容词，与前半句“更长”平行；比较结构宜译为“更宽”。
- source_word: מִנִּי יָם
  choice: 比海
  rationale: מִנִּי 是 מִן 的诗体形式，在此表示比较；יָם 直译为“海”，保留原诗意象。
theological_decisions:
- issue: 第三人称阴性单数后缀“它”所指为何
  choice: 正文保留“它”，承接上文而不在本节明说所指
  alternative: 明确译成“智慧的尺度”或“神的奥秘之尺度”
  rationale: 本节希伯来文本只用代词后缀；明确补出先行词会替读者解决上文可能存在的指涉张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“大地”与“海”构成清楚的诗歌平行；“尺度”较直译，并以脚注提供“范围”这一自然替代译法。
