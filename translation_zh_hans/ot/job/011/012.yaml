revisions:
- from: 但空洞无知的人会有悟性，等到野驴驹生来成为人[a][b]。
  to: 但空洞无知的人，要等到野驴驹生而为人时，才会有悟性[a][b]。
  rationale: 修订仅补足中文条件句的必要结构，并将不自然的“生来成为人”改为“生而为人”。“要等到……才……”清楚呈现英文学术审校所采纳的荒诞条件／反讽读法；脚注同时说明原文的简练及关系解释并非毫无争议，避免把该解释伪装成无歧义的字面结构。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:33Z'
