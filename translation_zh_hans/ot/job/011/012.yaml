  text: וְ/אִ֣ישׁ נָ֭בוּב יִלָּבֵ֑ב וְ/עַ֥יִר פֶּ֝֗רֶא אָדָ֥ם יִוָּלֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/012.yaml
  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: zh_hans
  text: 但空洞无知的人，要等到野驴驹生而为人时，才会有悟性[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有悟性”直译为“得着心”。这里的“心”是希伯来语中指见识、判断力或理解力的说法。
    reason: lexical_alternative
  - marker: b
    text: 这句话很可能是反讽：无知的人变得明智，如同野驴驹生而为人一样不可能。希伯来原文十分简练，句子之间的确切关系也有不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: 但
  rationale: 此处连接词在语境中带转折和讽刺意味，用“但”自然引出这个反常命题。
- source_word: אִישׁ נָבוּב
  choice: 空洞无知的人
  rationale: נָבוּב本义为“中空、空洞”，在这里比喻缺乏见识；译文兼顾原有意象和现代汉语的可懂性。
- source_word: יִלָּבֵב
  choice: 会有悟性
  rationale: 该词字面近于“得着心”，这里“心”指判断力或见识；“有悟性”表达其习语含义，同时由脚注保留字面说法。
- source_word: עַיִר פֶּרֶא
  choice: 野驴驹
  rationale: 该结构指野驴的幼驹；“野驴驹”简洁、准确，也符合现代汉语表达。
- source_word: אָדָם יִוָּלֵד
  choice: 生来成为人
  rationale: 保留“人”与“出生”的表层措辞，不把本句潜在的讽刺逻辑直接写成“除非”或“只有……才”。
theological_decisions:
- issue: 本句箴言式表达的讽刺力度
  choice: 正文保留希伯来文的紧缩结构：“会有悟性，等到野驴驹生来成为人”
  alternative: 明确译作“空洞无知的人只有等到野驴驹生而为人时才会明白事理”
  rationale: 希伯来文措辞简短且解释上存在张力。平行意象很可能表达不可能发生的条件，但正文不宜完全消除其含混性，因此用“等到”传达明显的反常意味，并在脚注说明常见的反讽理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“空洞无知”保留נָבוּב的“空洞”意象，同时帮助普通读者理解其比喻义；正文刻意保留原句的反常比较和一定歧义，不加入宗派性解释。
