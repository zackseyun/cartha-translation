  source_fidelity: 译文准确抓住了נָבוּב（空虚、无知）与יִלָּבֵב（“得心”，即获得悟性）的比喻义，也正确译出“野驴驹”和“生而为人”的荒诞意象。不过，“会有悟性，等到……”在现代汉语中句法悬置，条件关系未完整表达。原文虽简练且关系可有讨论，但在此上下文及英文学术审校所采用的反讽理解下，宜以“要等到……才……”使汉语完整，并由脚注说明其反讽性质。
  naturalness: “空洞无知的人”自然且保留“空洞”意象；“有悟性”也通顺。“等到野驴驹生来成为人”不够自然：一是“等到”后缺少与之呼应的“才”，二是汉语通常说“生而为人”，而非“生来成为人”。
  terminology: “悟性”可恰当表达此处“心”作为理智、判断力的习语义。“野驴驹”准确。“得着心”作为脚注中的直译可以保留，但宜说明这是希伯来语习语，避免被误读为情感意义的“心”。
