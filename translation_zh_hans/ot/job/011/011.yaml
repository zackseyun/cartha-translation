  text: כִּי ה֭וּא יָדַ֣ע מְתֵי שָׁ֑וְא וַ/יַּרְא אָ֝֗וֶן וְ/לֹ֣א יִתְבּוֹנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: zh_hans
  text: 因为他知道虚妄的人；他看见罪恶，岂不留意呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却不留意。”希伯来文末句可读作平直的否定句；但按上下文，理解为反问“岂不留意呢？”更为合适。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接琐法前文的论述，引出其判断的根据；现代汉语用“因为”自然清楚。
- source_word: הוּא
  choice: 他
  rationale: 上下文所指为上帝；希伯来文并未要求用特殊形式标示神性，故采用普通代词。
- source_word: יָדַע
  choice: 知道
  rationale: Qal完成式在此表达恒常、确定的认识，汉语用现在时态含义的“知道”最自然。
- source_word: מְתֵי שָׁוְא
  choice: 虚妄的人
  rationale: 保留“……的人”这一结构；שָׁוְא可指虚假、空虚或虚妄，“虚妄”兼顾其道德与空洞意味，而不武断缩窄为“骗子”或“恶人”。
- source_word: וַיַּרְא
  choice: 他看见
  rationale: 按叙述连接词直译为并列分句；汉语无需额外补入“当……时”，也能自然衔接末尾的反问。
- source_word: אָוֶן
  choice: 恶行
  rationale: 本词在此具有罪恶、不义之意；“恶行”在现代汉语中明确而自然，并保留其行为层面的开放性。
- source_word: וְלֹא יִתְבּוֹנָן
  choice: 岂会不留意呢？
  rationale: התבונן有留心、察看、思量之意。结合上下文，将否定句理解为反问最符合琐法强调上帝洞察恶事的论证；“留意”避免把意义过度限定为理性分析。
theological_decisions:
- issue: 末句 וְלֹא יִתְבּוֹנָן 的语气
  choice: 译为反问：“岂会不留意呢？”
  alternative: 译为平直否定：“却不留意”或“并不察看”
  rationale: 希伯来文本身没有书面问号，形式上可作平直否定；但在琐法声称上帝认识虚妄之人并看见恶行的语境中，反问更合乎论证脉络。脚注保留另一种语法可能，避免消除原文歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“虚妄的人”略带经文语体，以保留 שָׁוְא 的多义性；末句用现代读者易懂的反问表达。脚注标记置于相关句末。
