base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: zh_hans
  text: 但恶人的眼目必渐渐昏花；逃脱之路必从他们那里断绝；他们所盼望的，不过是吐出最后一口气。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吐出最后一口气”所译的希伯来语短语含义较难确定，较直译可作“生命的呼出”；也可能强调临终的一息。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים תִּכְלֶינָה
  choice: 恶人的眼睛必衰残
  rationale: 保留“眼睛”的希伯来意象；“衰残”表达眼睛因徒然盼望而耗尽、失去作用，且不把隐含意义完全释出。
- source_word: מָנוֹס אָבַד מִנְהֶם
  choice: 逃路也必从他们那里消失
  rationale: מָנוֹס可指逃走的途径、逃脱或避难之处；“逃路”自然地兼顾逃脱途径与出路。אָבַד虽为完成式，在本节诗歌语境中与前后未完成式共同描写将来的结局，故译“必……消失”。
- source_word: תִקְוָתָם
  choice: 他们所盼望的
  rationale: 译出“他们的盼望/所期待之事”，并与后面的名词短语自然衔接。
- source_word: מַפַּח נָפֶשׁ
  choice: 吐出最后一口气
  rationale: 该短语罕见且含义困难，涉及呼气与生命；此译保留死亡和呼吸的意象，并表达很可能的“临终一息”之义。
theological_decisions:
- issue: 恶人的最终盼望所指为何
  choice: 保留为死亡意象：“吐出最后一口气”
  alternative: 译作“绝望”或“气馁”
  rationale: 原文使用与呼吸、生命相关的具体而困难的短语；不将其抽象化为心理状态，以免消解诗句的张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“逃路”保留诗歌凝练感；分号呈现三行并列递进。脚注标记置于整节相关难句之后。
