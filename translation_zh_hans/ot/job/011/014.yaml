  text: אִם אָ֣וֶן בְּ֭/יָדְ/ךָ הַרְחִיקֵ֑/הוּ וְ/אַל תַּשְׁכֵּ֖ן בְּ/אֹהָלֶ֣י/ךָ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: zh_hans
  text: 你手中若有罪孽[a]，就要把它远远除去；不要让不义住在你的帐棚里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “手中”可指一个人所掌控、持有或亲手实行的事；“罪孽”也可译作“邪恶”。
    reason: 词义与希伯来语惯用意象说明
  - marker: b
    text: “帐棚”在这里不只指居住的帐幕，也可泛指一个人的家居和家庭生活范围。
    reason: 古代生活背景说明
lexical_decisions:
- source_word: אִם
  choice: 若有
  rationale: 引出条件句；结合后面的“在你手中”，译作“若有”既符合希伯来语句法，也使现代汉语自然。
- source_word: אָוֶן
  choice: 罪孽
  rationale: 此词可指邪恶、祸患或害人的恶行；在本节与“עַוְלָה”平行的道德劝诫中，“罪孽”能保留其道德分量，同时不把它限定为某一种具体罪行。
- source_word: בְּיָדְךָ
  choice: 你手中
  rationale: 保留希伯来语的具体意象，可表示人所持有、掌控或亲手实行的恶事；现代汉语也能自然理解这一表达。
- source_word: הַרְחִיקֵהוּ
  choice: 把它远远除去
  rationale: 使役命令式要求采取主动行动，使罪孽远离；“远远除去”兼顾“除掉”与“使之远离”两层意思。
- source_word: וְאַל
  choice: 不要
  rationale: 自然表达希伯来语连接词加禁令否定词所引出的禁止。
- source_word: תַּשְׁכֵּן
  choice: 让……住
  rationale: 该词源于“居住、安顿”，这里在否定命令中表示不可容许不义留居；“让……住”保留原文拟人化和居住意象。
- source_word: בְּאֹהָלֶיךָ
  choice: 在你的帐棚里
  rationale: 原文为复数“你的帐棚”；汉语以集合性单数“帐棚”表达个人居所和家庭范围，更自然，同时保留古代生活场景。
- source_word: עַוְלָה
  choice: 不义
  rationale: 指不公正、邪曲或错误行为。“不义”与前面的“罪孽”意义相关而用词有别，保留诗歌平行句的词汇变化。
theological_decisions:
- issue: 诗歌平行句中的道德用语
  choice: 将 אָוֶן 译为“罪孽”，将 עַוְלָה 译为“不义”
  alternative: 两词都译作“邪恶”或“罪恶”
  rationale: 两个词在本节中彼此呼应，但不必视为严格区分的神学术语。采用相关而不同的译词，既保留希伯来诗歌的变化，也不强加原文没有明确表达的技术性区别。
- issue: “手中”和“帐棚”所涵盖的责任范围
  choice: 正文保留具体意象，并用脚注说明其可能涵盖个人行为与家庭生活
  alternative: 直接意译为“你所做的事”和“你的家中”
  rationale: 保留原文意象可避免过早消解其含义；脚注则帮助现代读者理解，这项劝诫既涉及本人掌控或实行的恶，也涉及其家庭生活中所容许的不义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“远远除去”与“住在……里”保留原文的空间和居住意象；用分号呈现两句平行劝诫。正文避免古奥术语，但以“罪孽／不义”维持诗歌的道德力度与词汇变化。
