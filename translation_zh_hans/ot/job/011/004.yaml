  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: zh_hans
  text: 你说：“我的教导[a]纯正；在你眼中，我是清白的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“训诲”“论说”。原文名词可指人所领受或提出的教导。
    reason: 保留 לֶקַח 在“教导、训诲、论说”之间的词义幅度。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 你说
  rationale: 该词是אמר的Qal连续式第二人称阳性单数。琐法在诗体辩论中概述约伯当前所持的主张，因此用现代汉语现在时“你说”最自然；原文形式也可按叙事时态理解为“你曾说”。
- source_word: זַךְ
  choice: 纯正
  rationale: 此形容词表示纯净、纯洁；修饰言论或教导的内容时，“纯正”自然庄重，并与后面的“清白”有所区分。
- source_word: לִקְחִי
  choice: 我的教导
  rationale: לֶקַח可指所领受或传授的教训、教导，也可指所陈述的论说。这里指琐法所概括的约伯立场；“教导”保留其主要语义范围，又不局限为一次发言。
- source_word: וּבַר
  choice: 是清白的
  rationale: בַּר可表示洁净、纯洁。用于人在上帝眼中的状态时，“清白”符合语境，同时避免与זַךְ同词重复。
- source_word: הָיִיתִי
  choice: 我是
  rationale: 虽为היה的完成式第一人称单数，但在引述的自我宣称中表达一种状态，现代汉语自然译作现在状态“我是”。
- source_word: בְעֵינֶיךָ
  choice: 在你眼中
  rationale: 直译并保留希伯来语以“眼中”表达评价或判断的意象；第二人称为阳性单数。
theological_decisions:
- issue: “在你眼中”中第二人称单数的指向
  choice: 正文保留“你”，按语境可理解为约伯在引语中对上帝说话
  alternative: 理解为泛指对话对象，或直接明译为“在上帝眼中”
  rationale: 琐法似乎是在概述约伯自称在上帝面前清白的话，但原文只用第二人称单数代词。译文保留“你”，既符合较可能的神学语境，也不把解释直接写入正文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语；以“纯正／清白”呈现两个近义形容词的重叠与区别。引语简洁有力，符合诗体辩论语境。
