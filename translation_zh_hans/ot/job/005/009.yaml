lexical_decisions:
- source_word: עֹשֶׂה
  choice: 他行
  rationale: 此处是动词 עשה 的 Qal 主动分词，承接上下文所指的上帝，描述他持续施行作为；译作“他行”简洁自然，并保留诗句的陈述语气。
- source_word: גְדֹלוֹת
  choice: 大事
  rationale: 复数形容词在此作名词使用，指伟大的作为。“大事”直接、庄重，也不过度限定为某一种神迹或工作。
- source_word: וְאֵין חֵקֶר
  choice: 无法测透
  rationale: 原文直译为“并且没有探究”，表达人的探究不能穷尽这些大事。“无法测透”符合现代汉语习惯，同时保留不可穷究之意；脚注列出更贴近原文结构的译法。
- source_word: נִפְלָאוֹת
  choice: 奇事
  rationale: 该词指非凡、令人惊奇的作为。“奇事”简洁庄重，与前半句“大事”构成自然的诗歌平行。
- source_word: עַד אֵין מִסְפָּר
  choice: 数不胜数
  rationale: 这是表示不可计数的惯用表达。“数不胜数”是自然的现代汉语，准确传达数量多到不能数算，并与“无法测透”形成平衡。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。两个分句以“他行……；行……”形成平行，既保留希伯来诗歌的紧凑感，也避免补入原文没有的神学解释。
