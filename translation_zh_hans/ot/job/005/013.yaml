  yaml_path: translation/ot/job/005/013.yaml
  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: zh_hans
  text: 他使智慧人陷入自己的诡计中[a]；乖僻之人的谋算仓促推进[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诡计”也可译作“狡猾”或“精明”；这个词在别处可以有正面含义，但本节用作贬义。
    reason: lexical_alternative
  - marker: b
    text: “仓促推进”按原文也可译作“被催得仓促”或“匆匆而行”。原词着重急速、仓促；谋算最终受挫的意味可由本节的平行关系和上下文推知，但原文在这里没有明说“败落”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: 使……陷入
  rationale: 这是动词性分词，承接上下文以神为主语；此译保留捕捉、落入圈套的意象，同时符合现代汉语表达。
- source_word: חֲכָמִים
  choice: 智慧人
  rationale: 原文是形容词复数作名词使用，指那些被视为有智慧的人；“智慧人”保留其反讽意味。
- source_word: בְּעָרְמָם
  choice: 在自己的诡计中
  rationale: עָרְמָה 有时可指精明或机敏，但本节与乖僻者的谋算平行，语境明显含贬义，因此译作“诡计”。介词结构保留他们反被自身计谋困住的意象。
- source_word: וַעֲצַת
  choice: 谋算
  rationale: עֵצָה 可指劝告、计策或谋划；这里所说的是乖僻者所筹划的方案，“谋算”最贴合语境。
- source_word: נִפְתָּלִים
  choice: 乖僻之人
  rationale: 该词带有扭曲、曲折而不正直的道德意象；“乖僻之人”既保留负面含义，也比直译“扭曲的人”更自然庄重。
- source_word: נִמְהָרָה
  choice: 仓促败落
  rationale: 该阴性单数被动式与“谋算”呼应，基本含义是被催促、急速而行。结合上句落入自身诡计的平行关系，“仓促败落”表达其计谋被推向匆促失败，同时保留急迫、冒进的意味。
theological_decisions:
- issue: 分词 לֹכֵד 的隐含主语
  choice: 译出“他”，按上下文指神
  alternative: 采用不定主语，如“有一位使……”或省略主语
  rationale: 本节本身没有明说主语，但约伯记5:9—16持续陈述神的作为。现代汉语需要明确主语，译作“他”是承接上下文，并未另加神学判断。
- issue: עָרְמָה 与 נִפְתָּלִים 的道德色彩
  choice: 分别译作“诡计”和“乖僻之人”
  alternative: 较中性的“精明”和“曲折之人”
  rationale: 两小句的平行结构描写其谋算受到挫败，支持负面的伦理含义；但译文不进一步界定他们所属的群体或其最终结局。
- issue: נִמְהָרָה 是否明说计谋失败
  choice: 正文译作“仓促败落”
  alternative: 较形式对应地译作“被催得仓促”或“匆匆而行”
  rationale: 单独译为“被催促”在现代汉语中语意不完整；上下文显示这种仓促是计谋受挫。不过以脚注列出较贴近字面的译法，避免遮蔽原文表达上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号呈现希伯来诗歌的平行结构；避免沿用过度古雅的措辞，也不把“智慧人”解释为真正敬虔或得救的人。
