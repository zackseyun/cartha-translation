id: JOB.5.17
reference: Job 5:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּ֤ה אַשְׁרֵ֣י אֱ֭נוֹשׁ יוֹכִחֶ֣/נּֽוּ אֱל֑וֹהַּ וּ/מוּסַ֥ר שַׁ֝דַּ֗י אַל תִּמְאָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/017.yaml
  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
translation:
  language: zh_hans
  text: 看哪，蒙上帝责备[c]的人[b]是有福的[a]；全能者[e]的管教[d]，你不可厌弃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福的”也可译作“幸福的”或“有福气的”；希伯来语的祝福句式指一种值得羡慕的蒙福处境。
    reason: lexical_alternative
  - marker: b
    text: “人”所译的希伯来语词可指“世人”或“必死的人”，这里泛指任何人。
    reason: lexical_alternative
  - marker: c
    text: “责备”也可译作“纠正”或“劝戒”。
    reason: lexical_alternative
  - marker: d
    text: “管教”也可译作“训诲”“纠正”或“惩戒”。
    reason: lexical_alternative
  - marker: e
    text: 希伯来文作“沙代”，传统上译作“全能者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意、强调下文智慧宣告的话语功能；用语庄重，也为现代读者所熟悉。
- source_word: אַשְׁרֵי
  choice: 是有福的
  rationale: 这是智慧文学中的祝福宣告，指一种值得羡慕的蒙福处境，不仅是主观的快乐。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 原词指人或必死之人，此处为泛指单数；中文“人”自然涵盖一般人，不必增添性别限定。
- source_word: יוֹכִיחֶנּוּ
  choice: 蒙上帝责备
  rationale: יכח的使役形在此表示带有纠正目的的责备；“蒙……责备”既保留被动关系，也与下句“管教”相呼应。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 按《约伯记》中这一神称的通常意义直译为“上帝”，不添加原文没有的限定。
- source_word: מוּסַר
  choice: 管教
  rationale: 该词兼有训诲、纠正和塑造之意；“管教”在本语境中能自然表达带有教育目的的纠正。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 采用这一神圣称号在现代中文圣经语体中的传统意译，同时以脚注保留其希伯来语形式。
- source_word: אַל תִּמְאָס
  choice: 不可厌弃
  rationale: מאס表示视为可鄙而拒绝；“厌弃”比单纯“轻看”更能保留拒斥和嫌恶的语气。
theological_decisions:
- issue: 上帝的责备与人的福分之间的张力
  choice: 蒙上帝责备的人是有福的
  alternative: 上帝所纠正的人是有福的
  rationale: 保留原文把令人痛苦的责备称为有福处境的反常张力，不把它弱化成一般教导，也不强化为刑罚。
- issue: 前后分句的逻辑关系
  choice: 以分号并列，不明加“所以”
  alternative: 所以，不可厌弃全能者的管教
  rationale: 希伯来文以וּ连接后句，可由语境理解为承接或推论，但并未使用明确的因果连接词；分号既呈现紧密关系，又不把潜在推论固定为唯一解释。
- issue: 泛指名词אֱנוֹשׁ的表达
  choice: 人
  alternative: 世人／必死的人
  rationale: 此处是智慧格言中的泛指单数。“人”在现代汉语中自然、包容且不遮蔽普遍适用性；“必死的人”虽可体现词义色彩，却会在本节中过度凸显死亡性。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“看哪”保留强调功能；“蒙上帝责备”避免生硬的关系从句；后半句将“全能者的管教”前置，贴近原文焦点结构。标点以分号表达两句的紧密联系，同时不擅自把连接词解释成明确因果。
