  yaml_path: translation/ot/job/005/014.yaml
  text: By day they meet darkness[a], and at noon they grope as in the night.
translation:
  language: zh_hans
  text: 他们白昼遇见黑暗，正午摸索，如同在夜间[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像在夜里”或“如同夜间”。希伯来文在“夜间”前使用表示比较的前缀，说明他们在正午摸索，如同身处夜间。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: 白昼
  rationale: 作时间副词，表示“在白天”；用“白昼”简洁庄重，并与“夜间”形成鲜明对照。
- source_word: יְפַגְּשׁוּ
  choice: 遇见
  rationale: פגשׁ表示遇到、遭遇；“遇见”直接保留他们在白昼竟碰上黑暗的反常意象。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: חשך的常用对应词；既保留具体的视觉意象，也不排除处境困惑等隐喻意味。
- source_word: וְכַלַּיְלָה
  choice: 如同在夜间
  rationale: 前缀כ־表示比较；此译明确表达他们正午摸索，仿佛身处夜间。
- source_word: יְמַשְׁשׁוּ
  choice: 摸索
  rationale: משׁשׁ指因看不见而用手探寻；“摸索”自然准确地传达在黑暗中探路的动作。
- source_word: בַצָּהֳרָיִם
  choice: 正午
  rationale: 指中午时分；“正午”突出一天光线最明亮之时，强化经文的反差。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“白昼—黑暗—正午—夜间”的词语安排保留原文强烈的明暗反差；不把“黑暗”解释为某种特定的神学或心理状态。
