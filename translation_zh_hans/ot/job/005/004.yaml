  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: zh_hans
  text: 他的儿女远离安稳[a]，在城门口[b]被压碎，无人搭救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安稳”也可译作“解救”或“拯救”。
    reason: lexical_alternative
  - marker: b
    text: 古代的城门口通常是审理案件和作公共决定的地方。
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: 远离
  rationale: רחק表示相距遥远；与介词מִן连用，在这里说明他的儿女与安稳或解救相隔甚远。“远离”简洁自然，也保留原文的状态性表达。
- source_word: בָנָיו
  choice: 他的儿女
  rationale: בנים既可专指儿子，也可泛指子女。上下文强调恶人的后代所遭遇的祸患，并未突出性别，因此译作“儿女”。
- source_word: מִיֶּשַׁע
  choice: 远离安稳
  rationale: יֶשַׁע可指拯救、解救或安全状态。此处属于现实患难的语境，“安稳”自然呈现缺乏安全保障的意思；“得救”的词义可能性列入脚注。
- source_word: וְיִדַּכְּאוּ
  choice: 被压碎
  rationale: דכא含压碎、击垮之意。被动式应保留受害者遭受重压的强烈语气，故采用“被压碎”，不弱化为一般的“受欺压”。
- source_word: בַשַּׁעַר
  choice: 在城门口
  rationale: שׁער字面为城门，而古代城门口也是审判和公共事务的场所。“在城门口”既符合现代汉语，也保留可由文化脚注说明的司法背景。
- source_word: וְאֵין מַצִּיל
  choice: 无人搭救
  rationale: אין加使役分词מַצִּיל表示没有施行解救的人。“无人搭救”凝练自然，并保留彻底缺乏救援的意味。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“被压碎”保留希伯来文的强烈意象；“城门口”兼顾字面地点与古代司法背景。脚注标记依其对应内容重新安排：词义说明置于“安稳”之后，文化说明置于“城门口”之后。
