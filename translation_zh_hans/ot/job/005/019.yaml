  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: zh_hans
  text: 在六样患难中，他必搭救你；就是在七样患难中，祸患也必不临到你。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “六……七……”是希伯来诗歌中递进的数字表达，表示一再或完全的搭救，并非把患难严格限定为七样。
    reason: cultural_note
  - marker: b
    text: “祸患”也可译作“灾祸”或“伤害”；原词也可表示“恶”。本节语境侧重临到人的祸害。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֵׁשׁ צָרוֹת
  choice: 在六次患难中
  rationale: 介词 בְּ 在这一数字格言中表示所处的境况；צָרוֹת 泛指困苦、危难或逆境。“患难”既贴近原义，也符合现代汉语庄重的诗体表达。
- source_word: יַצִּילֶךָּ
  choice: 他必搭救你
  rationale: נצל 的使役式表示从危险中解救、搭救。动词为阳性单数，语境所指是上帝，但本节未明说主语，因此保留“他”。“必”自然传达未完成式在此处的应许性将来含义。
- source_word: וּבְשֶׁבַע
  choice: 即使有七次
  rationale: “六……七……”是递进式数字平行。“即使”表现后一分句的递进力度，同时保留原文数字，没有将其直接释义为“无论多少次”。
- source_word: לֹא יִגַּע בְּךָ
  choice: 也不会临到你
  rationale: נגע 可表示触及、临到或击打。与“祸患”搭配时，“临到你”是自然现代汉语，也保留灾祸无法触及当事人的意象。
- source_word: רָע
  choice: 祸患
  rationale: רָע 可指道德上的恶，也可指有害之事、灾祸。此处与“患难”和“搭救”相连，语境侧重临到人的祸害；“祸患”保留一定广度而不局限于身体伤害。
theological_decisions:
- issue: “他必搭救你”中隐含主语的所指
  choice: 保留代词“他”
  alternative: 译作“上帝必搭救你”
  rationale: 上下文表明所指是上帝，但希伯来文本本节只有第三人称单数动词，没有明写神名。保留代词避免把上下文信息直接增补进本节。
- issue: “六……七……”数字格式的含义
  choice: 正文保留数字，并用“即使”显示递进
  alternative: 意译为“无论经历多少患难”或理解为严格限定的七次
  rationale: 该格式通常表达反复、递进乃至完满，而非把拯救严格限定为七次。正文保留诗歌形式，脚注说明其惯用含义，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧诗体。“在六次患难中……即使有七次”保留原文平行和递进；分号呈现两行诗意之间的停顿。代词“他”不额外显明主语，脚注则仅解释必要的希伯来数字惯用法和 רָע 的词义范围。
