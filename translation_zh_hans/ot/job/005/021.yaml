  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
translation:
  language: zh_hans
  text: 你必藏身，躲避舌头的鞭打[a]；毁灭[b]临到时，你也不惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“舌头的鞭打”，比喻辱骂、诽谤等伤人的言语。
    reason: lexical_alternative
  - marker: b
    text: “毁灭”也可译作“灾害”或“败亡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט לָשׁוֹן
  choice: 免受口舌的鞭打
  rationale: שׁוֹט本指鞭子或鞭打，与“舌头”连用，形象地指恶言、诽谤等言语攻击。“口舌的鞭打”保留希伯来文的鲜明比喻；“免受”结合“被藏起来”的保护语境，自然表达בְּ在此处的关系。
- source_word: תֵּחָבֵא
  choice: 你必被藏起来
  rationale: 这是חבא的尼法勒式，表示“被隐藏、被藏起”。译文保留被动形式及将来保证的语气，不进一步限定保护的方式。
- source_word: וְלֹא תִירָא
  choice: 你也不惧怕
  rationale: 直接表达否定未完成式的保证语气；“也”使两个平行分句在现代汉语中衔接自然。
- source_word: מִשֹּׁד
  choice: 毁灭
  rationale: שֹׁד可指猛烈的毁坏、灾害或败亡。“毁灭”简洁而有力度，同时不把所指限定为某一种灾祸。
- source_word: כִּי יָבֹוא
  choice: 临到时
  rationale: 此处כִּי最自然地作时间关系理解。“临到时”既简洁，也保留毁灭确实来到这一情境，并未弱化为仅仅可能发生。
