  yaml_path: translation/ot/job/005/010.yaml
  text: who gives rain on the face of the earth and sends water on the face of the fields[b][a],
translation:
  language: zh_hans
  text: 他使雨降在大地[a]上，又把水送往野外[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地”。希伯来语 אֶרֶץ 按语境可指“大地”，也可指“土地”。
    reason: lexical_alternative
  - marker: b
    text: 或译“开阔地”，也可译“街道”。希伯来语 חוּצוֹת 可指户外的开阔地方、街道或郊野；这里的语境较支持“野外”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: 他降
  rationale: 带冠词的Qal主动分词作实体性用法，承接上文对上帝的描述。汉语以“他降”自然表达持续施行之意，并避免生硬的“那赐下……者”。
- source_word: מָטָר
  choice: 雨
  rationale: 这是表示雨、降水的常用词；“降雨”在现代汉语中简洁自然。
- source_word: עַל־פְּנֵי אָרֶץ
  choice: 在大地上
  rationale: פְּנֵי在此指表面；现代汉语用“在大地上”自然传达该意象。אָרֶץ可指“大地”或“土地”，这里的概括性陈述宜译为“大地”，并以脚注保留另一可能。
- source_word: וְשֹׁלֵחַ
  choice: 又把……送到
  rationale: 该Qal主动分词与הַנֹּתֵן平行。“又把……送到”既保留动作上的平行，也符合现代汉语表达。
- source_word: מַיִם
  choice: 水
  rationale: מַיִם虽具复数形态，在此泛指水；汉语用不可数意义的“水”最自然。
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: 到野外
  rationale: חוּצוֹת可指户外的开阔地、街道或郊野。此处与降雨滋润大地平行，“野外”最符合自然环境语境；介词短语按汉语习惯译为“到野外”，不机械重复“在……表面”。
theological_decisions:
- issue: אָרֶץ的范围
  choice: 大地
  alternative: 土地
  rationale: 本节概述上帝普遍赐下雨水的作为，并未明确限定某一地域；“大地”较能传达广泛范围，同时脚注保留“土地”的词义可能。
- issue: חוּצוֹת所指的地点
  choice: 野外
  alternative: 街道或开阔地
  rationale: 该词本身容许多种地点含义；在雨水滋润地面的自然语境中，“野外”较为贴切，但不应抹去“街道”等真实词义，故列入脚注。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“降雨在大地上”保留原文的空间意象；第二分句为避免汉语生硬，译作“把水送到野外”。两个分句以“又”连接，体现希伯来诗句的平行结构。
