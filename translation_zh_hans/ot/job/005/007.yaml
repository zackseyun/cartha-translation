base_translation:
  language: en
  yaml_path: translation/ot/job/005/007.yaml
  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: zh_hans
  text: 因为人是为劳苦而生，火焰之子向上飞翔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为人是为劳苦而生，火花向上飞腾。”希伯来文直译为“火焰之子”；这通常被理解为“火花”，也可能指“雷舍夫之子”（Resheph，可能的专名读法）。
    reason: 说明“火焰之子”的常见惯用理解及可能的专名读法，同时保留正文的原文意象。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为以利法的论断提供解释；中文用“因为”自然表达这一因果或说明关系。
- source_word: אָדָם
  choice: 人
  rationale: 原文是泛指的单数名词；“人”在现代汉语中既简洁又能保留普遍性的箴言语气。
- source_word: לְעָמָל
  choice: 注定……受苦
  rationale: עָמָל可指劳苦、患难或苦楚；此处所说不限于劳动，而是人生所遭受的困苦。“注定……受苦”也表达介词לְ所含的趋向或命定意味。
- source_word: יוּלָּד
  choice: 生来
  rationale: 该被动形式用于普遍性陈述；“生来”符合现代汉语习惯，并与לְעָמָל共同构成“注定生来受苦”。
- source_word: וּבְנֵי רֶשֶׁף
  choice: 火焰之子
  rationale: 直译保留原文鲜明而有意含混的意象；רֶשֶׁף也可能涉及火花、火焰、闪电，或专名“利施弗”，不在正文中武断限定。
- source_word: יַגְבִּיהוּ עוּף
  choice: 向高处飞翔
  rationale: 两个词合起来描绘升高飞行；此译既反映“高升”与“飞”的语义，也符合汉语表达。
theological_decisions:
- issue: 本句是否断言人的苦难是神所命定
  choice: 以“注定生来受苦”表达人的普遍处境，不明确指定命定者
  alternative: 人生来就有劳苦
  rationale: 原文לְעָמָל יוּלָּד带有“为劳苦而生”的目的或命定色彩，但没有明说是谁使之如此；译文保留张力，不额外加入神学主体。
translation_notes:
  register: 采用现代、庄重而可理解的箴言式表达。“火焰之子”略带诗性，以保存希伯来文意象；脚注提供更自然的传统理解“火花”。
