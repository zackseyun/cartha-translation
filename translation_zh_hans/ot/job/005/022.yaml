  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: zh_hans
  text: 你必对毁灭和饥荒发笑；你也不会惧怕地上的野兽[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要惧怕地上的野兽。”希伯来语这一形式可表示禁止；不过在这里较可能是安全无虞的应许。
    reason: 保留 אַל 加未完成式可作禁令或保障性陈述的语法与语境歧义。
lexical_decisions:
- source_word: שֹׁד
  choice: 毁灭
  rationale: 该词指暴力造成的毁坏、灾祸或荒废；“毁灭”简洁庄重，并与“饥荒”构成并列的灾难意象。
- source_word: כָפָן
  choice: 饥荒
  rationale: 该名词可指饥荒或严重饥饿；此处与“毁灭”并列，表示大范围灾难，故译作“饥荒”。
- source_word: תִּשְׂחָק
  choice: 你必一笑置之
  rationale: 动词 שׂחק 表示发笑，有时含不屑或无所畏惧之意。“一笑置之”保留诗歌的鲜明形象，也自然表达面对灾祸而不惧的语气。
- source_word: מֵחַיַּת הָאָרֶץ
  choice: 地上的野兽
  rationale: חַיָּה 在此通常指野生动物；“地上的野兽”贴近原文结构，并保持庄重的诗歌语体。
- source_word: אַל תִּירָא
  choice: 你也不会惧怕
  rationale: אַל 加未完成式通常可表示禁令，但在本段连续应许保护与福分的语境中，也可作为保障性的应许理解。“不会惧怕”与前句“你必……”相呼应，同时以脚注保留命令式读法。
theological_decisions:
- issue: אַל תִּירָא 在本节中的语气
  choice: 保障性的应许：“你也不会惧怕”
  alternative: 禁令：“不要惧怕”
  rationale: 上下文是一连串有关蒙保守的陈述，按应许理解较符合段落走向，也与 תִּשְׂחָק 的未完成式形成平行；但希伯来语形式确实常用于禁止，因此不在正文中消除这一张力，而以脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“面对……一笑置之”使希伯来诗句在中文中自然流畅；分号保留两组平行意象。
