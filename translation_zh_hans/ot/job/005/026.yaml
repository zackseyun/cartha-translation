base_translation:
  language: en
  yaml_path: translation/ot/job/005/026.yaml
  text: You will come to the grave in full vigor[b][a], like a sheaf gathered up in its season.
translation:
  language: zh_hans
  text: 你必在生命成熟之时归入坟墓[a]，如同禾堆在适时被收聚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在高寿之年”或“精力充沛时”。希伯来语“כֶּלַח”十分罕见，可能指成熟的年岁，也可能指充沛的生命力。
    reason: lexical_alternative
  - marker: b
    text: 或译：“如同谷物堆在当季被运上来。”原文描绘谷物在合宜的时候被收聚的农业景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: 你必……归入
  rationale: בוא是第二人称阳性单数未完成式，在此表达将来；与“坟墓”搭配时，汉语用“归入”自然而庄重，也保留走到人生终点的意象。
- source_word: בְכֶלַח
  choice: 精力充盈地
  rationale: כֶּלַח罕见且词义有争议，可能指旺盛的精力、成熟的生命阶段或高寿。正文以“精力充盈”表达生命达到丰满状态，同时用脚注保留“寿数满足”的可能。
- source_word: אֱלֵי קָבֶר
  choice: 归入坟墓
  rationale: אֱלֵי表示方向，קֶבֶר通常指坟墓或葬身之处；译为“归入坟墓”符合现代汉语诗体表达。
- source_word: כַּעֲלוֹת
  choice: 如同……被收起
  rationale: כְּ引出比喻，עלה的不定式在农业语境中可指被运上、收起或收聚；采用被动表达，使收获的含义清楚而不补入过多细节。
- source_word: גָּדִישׁ
  choice: 禾堆
  rationale: גָּדִישׁ较准确地指割下后堆起的谷物或禾捆之堆；“禾堆”比“禾捆”更贴近该词，同时保留诗歌的农业图景。
- source_word: בְּעִתּוֹ
  choice: 到时
  rationale: 字面为“在它的时候”，指合宜、应当的时节；“到时”简洁自然，并与成熟后收获的比喻相合。
theological_decisions:
- issue: 死亡时生命状态的含义
  choice: 保留为“精力充盈”，侧重生命达到丰满、适宜的阶段
  alternative: 译为“寿数满足”或“年老寿高”，明确指高龄
  rationale: 希伯来词כֶּלַח语义不确定，且本句以谷物适时收聚作比；不宜把它无脚注地限定为高龄，也不应将此处诗性陈述扩展为普遍的神学保证。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“精力充盈”保留罕见词כֶּלַח在生命力与成熟年岁之间的张力；“禾堆”避免把גָּדִישׁ过窄地译作单个禾捆。所有脚注标记均置于相关正文之后。
