  text: כִּ֤י לֹא יֵצֵ֣א מֵ/עָפָ֣ר אָ֑וֶן וּ֝/מֵ/אֲדָמָ֗ה לֹא יִצְמַ֥ח עָמָֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: zh_hans
  text: 因为祸患并非从尘土中出来[a]，劳苦也不是从地里长出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”或译“罪孽”；“劳苦”也可译“苦难”。前一词可指罪恶或祸患；两词在此语境中也可指灾祸和痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，引出以利法进一步说明的理由；“因为”能自然保留原文的论证关系。
- source_word: יֵצֵא
  choice: 出来
  rationale: 保留 יצא“出来、发出”的基本意象，与“从尘土中”合用，也和下半句的生长意象相呼应。
- source_word: מֵעָפָר
  choice: 从尘土中
  rationale: עָפָר通常指尘土；加“中”使现代汉语表达自然，并突出并非由土地自身产生。
- source_word: אָוֶן
  choice: 祸患
  rationale: 此处与 עָמָל 平行，语境涉及患难和苦楚；“祸患”保留灾祸、苦难之义，同时不把它限定为道德上的罪恶。
- source_word: וּמֵאֲדָמָה
  choice: 也不是从地里
  rationale: אֲדָמָה指土地、土壤；“地里”符合植物从土中生长的农业意象，也使中文诗句自然。
- source_word: יִצְמַח
  choice: 长出来
  rationale: צמח是植物萌生、生长的动词；“长出来”准确保留原文的植物意象，且为普通读者易懂。
- source_word: עָמָל
  choice: 劳苦
  rationale: עָמָל可指劳碌、痛苦、患难；“劳苦”兼有辛劳与苦楚，避免与上句“祸患”完全同义而抹去用词差异。
theological_decisions:
- issue: אָוֶן 与 עָמָל 在以利法这句话中的语义
  choice: 译作“祸患”和“劳苦”，表达人的患难并非像作物一样自行从土地生出。
  alternative: 也可理解为“罪孽”和“苦难”，使前者带有更明显的道德含义。
  rationale: 上下文讨论苦难，而两个希伯来词都兼具道德、灾祸和苦楚等义。正文采用较宽的苦难语义，保留以利法的农业比喻，却不额外断言一切受苦必由个人犯罪导致；脚注说明另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从尘土中出来／从地里长出来”保留原文平行结构和农业意象；正文不把多义词过度限定，脚注交代其道德义与灾祸义。
