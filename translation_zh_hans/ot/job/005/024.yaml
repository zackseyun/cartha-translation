  text: וְֽ֭/יָדַעְתָּ כִּי שָׁל֣וֹם אָהֳלֶ֑/ךָ וּֽ/פָקַדְתָּ֥ נָ֝וְ/ךָ וְ/לֹ֣א תֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: zh_hans
  text: 你必知道你的帐棚平安无恙；你察看自己的居所，必不会发现任何缺失。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必不犯罪。”希伯来语动词通常可表示“犯罪”，也可表示“未中、错失”；本句语境较可能是指察看居所时没有发现任何缺失。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: 你必知道
  rationale: 连词加Qal完成式在这段应许性诗句中表达将来的确定结果；“必知道”自然传达这种确信。
- source_word: כִּי
  choice: （引出“知道”的内容）
  rationale: 此处引出所知道的内容，汉语无需另译“that”。
- source_word: שָׁלוֹם
  choice: 平安无恙
  rationale: 该词涵盖平安、安全和完好；“平安无恙”既保留“平安”的核心意象，也适合形容帐棚及家中的状况。
- source_word: אָהֳלֶךָ
  choice: 你的帐棚
  rationale: 保留“帐棚”的字面意象和古代生活背景。
- source_word: וּפָקַדְתָּ
  choice: 你察看
  rationale: פקד语义宽广，可指探访、照管、清点或察看；结合下句是否有所缺失，此处“察看”最合语境，同时不过度限定为正式盘点。
- source_word: נָוְךָ
  choice: 自己的居所
  rationale: 该词可指居所或牧场；与“帐棚”平行时，译作“居所”最为妥帖。
- source_word: וְלֹא תֶחֱטָא
  choice: 必不会发现有所缺失
  rationale: חטא通常可指犯罪，也可指未中、错失；接在“察看居所”之后，语境较支持察看时没有发现缺失，但脚注保留道德意义的可能。
theological_decisions:
- issue: וְלֹא תֶחֱטָא 的含义
  choice: 按非道德意义译为“必不会发现有所缺失”
  alternative: “必不犯罪”
  rationale: 本节围绕帐棚和居所的平安、完好展开，“察看”之后没有发现缺失与上下文衔接更自然。不过，原动词通常也表示“犯罪”，因此用脚注明示另一种真实可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“帐棚”保留古代意象；“平安无恙”表达 שָׁלוֹם 所含的平安与完好。“有所缺失”保持诗体的凝练，并以脚注保留“犯罪”的词义可能。
