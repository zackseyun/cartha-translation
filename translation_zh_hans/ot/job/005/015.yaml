  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: zh_hans
  text: 但他救穷乏人脱离他们口中的刀剑[a]，也脱离强者的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他救穷乏人脱离刀剑、他们的口和强者的手。”希伯来文的表达十分紧凑；有些人把“从他们的口”单独理解，而不把它看作“他们口中的刀剑”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: 但他救……脱离
  rationale: 该词源于ישׁע，表示拯救、搭救。上下文暗示主语是上帝；虽是带连续ו的未完成式，这里处于诗歌中的概括性陈述，故用不限定具体时态的“救……脱离”。句首“但”体现本节与前文逆转困境的语意关系。
- source_word: מֵחֶרֶב מִפִּיהֶם
  choice: 脱离他们口中的刀剑
  rationale: מֵחֶרֶב直译“脱离刀剑”，מִפִּיהֶם直译“从他们的口”。将两者理解为紧密相连的诗歌意象，即伤人的言语如同口中的刀剑；同时用脚注保留希伯来文压缩句法的另一种切分方式。
- source_word: וּמִיַּד
  choice: 也脱离……的手
  rationale: יָד本义为“手”，也可指权势或控制。保留具体的“手”，与前半句的“刀剑”共同维持诗歌意象。
- source_word: חָזָק
  choice: 强者
  rationale: 形容词在此作名词使用，指强有力或有权势的人；“强者”简洁地保留其与穷乏人的对比。
- source_word: אֶבְיוֹן
  choice: 穷乏人
  rationale: 指贫穷、缺乏而处于弱势的人。“穷乏人”兼顾物质贫困与社会脆弱处境，也符合庄重而易懂的经文语体。
theological_decisions:
- issue: “他们口中的刀剑”的隐喻力量
  choice: 保留“口中的刀剑”，表达言语具有如刀剑般的伤害力
  alternative: 译成“伤人的话”，或把“从他们的口”与“脱离刀剑”分开理解
  rationale: 原文把“刀剑”与“口”并置，形成鲜明而未加解释的诗歌意象。保留这一表达可避免把隐喻平淡化或将其具体限定为诽谤等某一种言语伤害；脚注则呈现句法上的真实歧义。
- issue: 动词的时间与陈述性质
  choice: 用“救……脱离”作概括性陈述
  alternative: 用“曾救……脱离”表达过去发生的行动
  rationale: 虽然动词形式可在叙事序列中表示过去，但以利法的话属于诗歌性的概括陈述；现代汉语动词本身不强制标明时态，因而既自然，也不必过度确定时间。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“穷乏人”“强者”形成清楚对照；保留“口中的刀剑”和“强者的手”这两组具体意象。脚注标记[a]已置于相关短语之后。
