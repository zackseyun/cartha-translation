  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: zh_hans
  text: 因为你必与田野的石头[a]有约，田野的野兽[b]也必与你和睦相处[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“田间的石头”。这句话可能让人想到妨碍耕作的石头，但正文保留了希伯来语明确的诗歌意象。
    reason: lexical_alternative
  - marker: b
    text: 或译“田野的走兽”。
    reason: lexical_alternative
  - marker: c
    text: 直译可作“已与你和好”或“与你和平相处”。希伯来语表达的是人与野兽之间的和平关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本词在这里引出对前文保证的根据或说明；“因为”能自然保留这一逻辑联系。
- source_word: עִם אַבְנֵי הַשָּׂדֶה בְרִיתֶךָ
  choice: 你必与田野的石头立约
  rationale: 希伯来语本句是省略系词的名词结构，字面近于“你与田野的石头有约”。译文补出“立约”，既符合现代汉语，也保留“约”的鲜明意象及石头作为关系对象的诗意表达。
- source_word: אַבְנֵי הַשָּׂדֶה
  choice: 田野的石头
  rationale: 采用贴近原文的表达，不把石头明确解释为耕作中的障碍，从而保留诗歌意象及其可能含义。
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: 田野的野兽
  rationale: חַיָּה在这一搭配中通常指野生动物；“野兽”简洁庄重，并保留集合性的单数意象。
- source_word: הָשְׁלְמָה לָךְ
  choice: 必与你和睦相处
  rationale: 该表达指建立或处于和平关系。“和睦相处”在现代汉语中自然地传达这种关系，并与上半句的“立约”形成诗意对应。
