  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: zh_hans
  text: '因为恼怒杀死愚妄人，

    嫉妒[a]使轻信的人丧命。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”也可译为“嫉羡”。希伯来语此词可指嫉妒或嫉羡；在这里指一种会带来毁灭的强烈情绪。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，引出以利法对此事的解释；“因为”自然体现论证关系，而不加强为断言语气。
- source_word: לֶאֱוִיל
  choice: 愚妄人
  rationale: אֱוִיל在智慧文学中指道德和行事上愚昧的人，并非单指智力不足；“愚妄人”保留这一含义。
- source_word: יַהֲרָג
  choice: 能杀死
  rationale: 该未完成式表达智慧格言中的一般规律；“能杀死”在现代汉语中自然，也保留其致命力度。
- source_word: כָּעַשׂ
  choice: 恼怒
  rationale: כַּעַשׂ可表示恼怒、烦恼、怨愤等内在激动；此处与קִנְאָה平行，指足以毁人的负面激情。“恼怒”既自然，又不把词义过度收窄。
- source_word: וּפֹתֶה
  choice: 愚蒙人
  rationale: פֹּתֶה在智慧文学中指缺乏判断、容易受诱惑的人；“愚蒙人”保留其传统智慧文学色彩，同时不暗示智力残障。
- source_word: תָּמִית
  choice: 能使……丧命
  rationale: מות的使役形表示使人死亡；“使……丧命”保留使役含义，并与上句“杀死”形成自然的平行变化。
- source_word: קִנְאָה
  choice: 嫉妒
  rationale: 此词可表示嫉妒、妒忌或热忱；在与“恼怒”平行的负面语境中，“嫉妒”最合适，但其近义可能性在脚注中保留。
