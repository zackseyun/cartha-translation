  text: אוּלָ֗ם אֲ֭נִי אֶדְרֹ֣שׁ אֶל אֵ֑ל וְ/אֶל אֱ֝לֹהִ֗ים אָשִׂ֥ים דִּבְרָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/008.yaml
  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: zh_hans
  text: 但我会寻求上帝；我要把我的事陈明在上帝面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把我的事陈明在上帝面前”或译“把我的案件交给上帝”。
    reason: דִּבְרָתִי可指一般的“事情”，也可指有申诉或诉讼意味的“案件”；אָשִׂים则可理解为摆出、呈交或交托。正文采用较宽泛的表达，脚注保留法律性较强的可能译法。
lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: 但至于我
  rationale: אוּלָם带出转折，独立人称代词אֲנִי又加强“我”的对比意味；合译为“但至于我”，既保留强调，也符合现代汉语表达。
- source_word: אֶדְרֹשׁ
  choice: 我会寻求
  rationale: דרש在这里指转向上帝寻求帮助、求问或申诉。结合以利法提出劝告的语境，“会寻求”保留第一人称未完成式所含的意愿或假设色彩，不把它说成已发生的行动。
- source_word: אֵל / אֱלֹהִים
  choice: 上帝 / 上帝
  rationale: 两个称谓在本节构成诗歌平行，所指相同；均译为“上帝”，避免无根据地暗示两个不同对象，同时保留自然庄重的现代汉语。
- source_word: אָשִׂים דִּבְרָתִי
  choice: 把我的事陈明在……面前
  rationale: שׂים本义为“放置、摆出”，与דִּבְרָה搭配时表示把自己的事情、案情或主张摆出来。“陈明”传达申诉性的语境，又不把含义过度限定为正式诉讼或抱怨。
theological_decisions:
- issue: 平行使用אֵל与אֱלֹהִים
  choice: 两者都译为“上帝”
  alternative: 分别译作“大能者”和“上帝”
  rationale: 这里的差异属于诗歌中的同义平行，并无充分证据表明作者刻意区分两位对象或两种神学身份；统一译法较忠实地保留所指的一致性。
- issue: 以利法第一人称陈述的语气
  choice: 译为“我会寻求”
  alternative: 译为“我必寻求”或补成“我若是你”
  rationale: 未完成式可表达意向或建议语气。“我会”不把话说成绝对誓言，也不补入原文没有明说的“若是你”，从而保留原句的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但至于我”保留原文显著的转折与自我强调；后半句用“陈明在……面前”呈现向上帝申诉或呈交事情的意象。脚注标记紧接其所说明的短语之后。
