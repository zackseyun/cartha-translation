base_translation:
  language: en
  yaml_path: translation/ot/job/005/003.yaml
  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: zh_hans
  text: 我曾看见愚妄人扎下根来；我随即咒诅他的住处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我随即宣告他的住处受咒诅”，又或：“我随即判定他的住处注定遭殃。”希伯来语动词可理解为直接咒诅，也可理解为对审判结局的宣告。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי רָאִיתִי
  choice: 我曾看见
  rationale: 保留显式第一人称的强调；“曾看见”自然表达说话者亲身观察所得的经验。
- source_word: אֱוִיל
  choice: 愚妄人
  rationale: 这是智慧文学中的道德与属灵范畴，并非单指智力不足；“愚妄人”庄重且为现代读者所能理解。
- source_word: מַשְׁרִישׁ
  choice: 扎下根来
  rationale: 保留使役分词所呈现的生根意象，也暗示此人看似逐渐稳固，而不把比喻直接解释为兴旺。
- source_word: וָאֶקּוֹב
  choice: 便……咒诅
  rationale: נקב在此最直接的词义是宣告咒诅；“便”承接希伯来语连接词和叙事次序，同时避免擅自加入转折。
- source_word: נָוֵהוּ
  choice: 他的住处
  rationale: נָוֶה可指居所、住所；“住处”保持范围宽泛，不限定为房屋、家室或牧场。
- source_word: פִתְאֹם
  choice: 忽然
  rationale: 直接传达动作或判断来得突然；按马所拉文本次序置于咒诅短语中。
theological_decisions:
- issue: וָאֶקּוֹב所表达的是亲自咒诅，还是判定其住处受咒诅
  choice: 正文译作说话者“咒诅”愚妄人的住处
  alternative: 也可理解为说话者宣告其住处受咒诅，或判定其注定遭殃
  rationale: 动词的直接词义支持“咒诅”，但在智慧诗歌语境中也可能是观察后的审判性宣告。正文保留较直接的表达，脚注保存解释上的张力，不暗示话语具有任何法术效力。
- issue: פִתְאֹם修饰何者
  choice: 按希伯来语语序理解为与“咒诅／宣告受咒诅”相连
  alternative: 也有人可能从整体意义上将突然性联系到愚妄人住处的败落
  rationale: 文本明说的是说话者忽然作出咒诅或判定，并未明确陈述住处突然毁灭，因此不把结果补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚妄人”保留智慧文学色彩；“扎下根来”保存原文比喻；语序尽量贴近希伯来语，同时使中文自然流畅。脚注标记置于正文相应句末。
