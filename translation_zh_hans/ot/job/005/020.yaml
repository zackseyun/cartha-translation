base_translation:
  language: en
  yaml_path: translation/ot/job/005/020.yaml
  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: zh_hans
  text: 在饥荒中，他必把你从死亡中赎回[a]；在战争中，他必使你脱离刀剑的权势[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“救出你”或“搭救你”。希伯来语动词含有使人获释、得到解救的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译“脱离刀剑的手”；这是表示“脱离刀剑权势”的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: 在饥荒中
  rationale: רָעָב在这里指一种灾难性的饥荒，而不只是个人感到饥饿；前缀בְּ表示所处的境况。
- source_word: פָּדְךָ
  choice: 把你……赎回
  rationale: פדה含有赎回、使之获释或搭救的意思；“赎回”保留了原词较强的释放意味，又不把本节扩大解释为后来的系统神学概念。
- source_word: מִמָּוֶת
  choice: 从死亡中
  rationale: 介词מִן表示脱离，מָוֶת是具体名词“死亡”；译文保留了这一名词表达。
- source_word: וּבְמִלְחָמָה
  choice: 在战争中
  rationale: מִלְחָמָה可指战争或战斗；此处与“在饥荒中”平行，用“战争”更能概括灾难处境。
- source_word: מִידֵי
  choice: 脱离……的权势
  rationale: “从……的手中”是表示摆脱其力量或控制的希伯来语习语；主文本译出其惯用含义，脚注保留字面形象。
- source_word: חָרֶב
  choice: 刀剑
  rationale: חֶרֶב通常指刀剑，此处也借刀剑代表战争中的杀戮；“刀剑”在现代中文中自然且保留原有意象。
theological_decisions:
- issue: 智慧文学语境中פדה的译法
  choice: 赎回
  alternative: 搭救；救出
  rationale: 本节主要谈上帝在今世灾祸中的拯救，并未明确陈述盟约性或终末性的救赎；“赎回”保留原词的释放力度，但不额外加入特定的救赎论含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“把你从死亡中赎回”自然呈现פדה的力度；后半句原文省略与前半句平行的动词，中文补出“使你脱离”以保持流畅，同时不改变原意。
