base_translation:
  language: en
  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: zh_hans
  text: 饥饿的人吃掉他的收成，连荆棘中的收成也夺去；干渴的人渴求他们的财富。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“网罗吞噬他们的财富。”末句的希伯来文含义不易确定；正文采用常见读法，使“饥饿的人”与“干渴的人”彼此对应。
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: 他的收成
  rationale: קָצִיר指收割所得或庄稼；“收成”自然地保留了农业语境和第三人称单数所属关系。
- source_word: רָעֵב
  choice: 饥饿的人
  rationale: 该形容词在此作名词使用；译作“饥饿的人”既通顺，也不强行限定为某一个人。
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: 连荆棘中的也夺去
  rationale: 此短语较难确定；该译法保留从荆棘之中取走收成的鲜明图景，并以“连……也”表达其不受阻挡的意味。
- source_word: צִנִּים
  choice: 荆棘
  rationale: 在农业语境中，“荆棘”是最直接的词义，也避免过度解释为特定的篱笆或防护设施。
- source_word: וְשָׁאַף
  choice: 渴求
  rationale: שָׁאַף可表示喘息、急切向往或贪求；“渴求”在现代汉语中既呼应“干渴的人”，又表达对财富的强烈欲求。
- source_word: צַמִּים
  choice: 干渴的人
  rationale: 按常见理解，此词与前句“饥饿的人”构成平行；但希伯来文存在争议，另解在脚注中保留。
- source_word: חֵילָם
  choice: 他们的财富
  rationale: חַיִל在智慧文学中可指财富、资源或家产；“财富”符合财物遭人觊觎并夺取的语境，同时保留复数所属后缀。
theological_decisions:
- issue: 末句希伯来文的歧义
  choice: 正文采用“干渴的人渴求他们的财富”
  alternative: “网罗吞噬他们的财富”
  rationale: 正文所取读法使“干渴的人”与“饥饿的人”形成诗歌平行；由于辅音文本及词义可有不同分析，脚注保留“网罗／陷阱”的传统替代解释，不将有争议的文本问题神学化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吃掉”“夺去”呈现动作的直接性；“渴求”兼顾原文喘息般的急切意象及自然汉语表达。脚注标记置于相关末句之后。
