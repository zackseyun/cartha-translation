base_translation:
  language: en
  yaml_path: translation/ot/job/005/016.yaml
  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: zh_hans
  text: 这样，贫弱的人就有了盼望；不义也闭上了嘴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义”也可译作“恶行”；原文直译为“它的口闭上了”。
    reason: 说明עַוְלָה的词义范围，并保留希伯来语拟人表达的字面形式。
lexical_decisions:
- source_word: וַתְּהִי
  choice: 就有了
  rationale: 该词承接上文，表达由此前所述情形产生的结果。“就有了”既保留叙事形式，也自然呈现结果关系。
- source_word: לַדַּל
  choice: 贫弱的人
  rationale: דַּל可指贫穷、弱小或社会地位低下的人。“贫弱的人”兼顾经济困乏与无权无势的含义，避免只限定为财富不足。
- source_word: תִּקְוָה
  choice: 盼望
  rationale: 该名词意为盼望或期待；此处与不义被噤声形成对照，“盼望”清楚自然。
- source_word: וְעֹלָתָה
  choice: 不义
  rationale: עַוְלָה指不公、不义或恶行。此处将其人格化，与贫弱者所得的盼望相对；“不义”简洁并保留较宽的道德和社会含义。
- source_word: קָפְצָה פִּיהָ
  choice: 闭上了嘴
  rationale: 原文形象地说“不义”的口闭上了，表示它被制止、无法再发声。“闭上了嘴”保留拟人和具体意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的汉语。“这样……就……”承接上文并表达结果；分号突出两个彼此对应的结果。
