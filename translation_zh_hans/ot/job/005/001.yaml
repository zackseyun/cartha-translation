  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: zh_hans
  text: 你现在呼喊吧！有谁会回答你？在众圣者中，你要转向谁呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣者”也可译作“圣徒”或“圣洁的存在”。这里很可能指天上的圣洁存在。
    reason: 说明“圣者”的可能译法及本节语境中较可能的所指，同时避免把其身份在正文或脚注中不当地具体化为“灵”。
lexical_decisions:
- source_word: קְרָא
  choice: 呼喊
  rationale: 该命令式在这里是以利法发出的挑战。“呼喊”自然地表达向某位对象求告，且不额外限定为祷告或求助。
- source_word: נָא
  choice: 只管……吧
  rationale: נָא在争辩语境中加强催促或挑战语气；译作“只管……吧”比礼貌性的“请”更符合上下文。
- source_word: הֲיֵשׁ
  choice: 有谁
  rationale: 疑问词与存在词构成反问；“有谁”在现代汉语中简洁自然，并保留“是否存在这样一位”的意思。
- source_word: עוֹנֶךָ
  choice: 会回答你
  rationale: 源自动词ענה“回答、回应”，该形式带第二人称单数后缀，在句中具有实体性含义，即“回答你的那一位”。
- source_word: וְאֶל־מִי
  choice: 哪一位
  rationale: 询问在随后所说的“圣者”群体中转向谁；“哪一位”清楚保留选择对象的意味。
- source_word: מִקְּדֹשִׁים
  choice: 众圣者中
  rationale: קדושׁ的复数实体用法，字面为“圣者”。约伯记的语境很可能指天上的圣者，但正文保留较宽泛的表达，避免直接解释为“天使”或带入后期“圣徒”的特定联想。
- source_word: תִּפְנֶה
  choice: 转向
  rationale: פנה本义为“转向”。此处可能含求助或申诉之意，但“转向”既保留原有意象，在汉语中也可自然表达寻求援助。
theological_decisions:
- issue: מִקְּדֹשִׁים所指的身份
  choice: 正文译作“众圣者”，不直接明确其身份
  alternative: 译作“圣徒”“圣洁者”或“天上的圣者”
  rationale: 上下文较可能指天上的圣洁存在，但原文只说“圣者”。正文保留这种措辞，以免引入后来有关“圣徒”的教义联想；脚注说明可能所指。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“只管呼喊吧”体现以利法带挑战意味的语气；两个问句保留原文的反问力度。脚注标记已在正文中出现。
