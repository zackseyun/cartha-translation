  text: הִנֵּה זֹ֭את חֲקַרְנ֥וּ/הָ כֶּֽן הִ֑יא שְׁ֝מָעֶ֗/נָּה וְ/אַתָּ֥ה דַֽע לָֽ/ךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/005/027.yaml
  text: Look, this is what we have searched out; it is so. Hear it, and you, know it for yourself.
translation:
  language: zh_hans
  text: 看哪，这是我们查考所得，确实如此。你要听，并且自己要知道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意并强调结论的语气，同时符合庄重的现代汉语表达。
- source_word: חֲקַרְנוּהָ
  choice: 这是我们查考所得
  rationale: חקר表示经过探究、考察；宾语后缀所指为前述内容。用“查考所得”既体现调查过程，也自然承接“这是”。
- source_word: כֶּן הִיא
  choice: 确实如此
  rationale: 保留说话人对其查考结论真实性的明确断言。
- source_word: שְׁמָעֶנָּה
  choice: 你要听这话
  rationale: 动词带阴性单数宾语后缀，指向前述内容；汉语补出“这话”以明确宾语，而不增添新的所指。
- source_word: וְאַתָּה דַע־לָךְ
  choice: 也要亲自明白
  rationale: 独立代词אַתָּה带有强调作用，לָךְ强调此事与听者本人相关；“亲自”自然传达“你自己要知道、领会”的意味。
theological_decisions:
- issue: 本句断言“确实如此”的话语层级
  choice: 按以利法本人的确定语气直译为“确实如此”
  alternative: 弱化为“我们认为是这样”
  rationale: 原文明确作出断言，并未使用表示猜测或仅属个人意见的措辞；译文应保留角色发言的力度，同时不额外把该断言标示为叙述者或上帝的认可。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留智慧文学劝诫结语的郑重感；后两句简洁有力，并通过“亲自”体现原文对“你”的强调。
