    issue: “亲自明白” is somewhat interpretive for דַע־לָךְ.
    rationale: The Hebrew verb is ‘know,’ with an emphatic ‘you’ and lamed of personal concern/advantage. “自己要知道” more closely retains the lexical and rhetorical force, while leaving the precise mode of knowing open.
