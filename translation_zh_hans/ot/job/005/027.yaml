  source_fidelity: “亲自明白” can convey personal apprehension, but דַע־לָךְ more directly calls on Job himself to know/recognize the stated conclusion. Rendering it as “自己要知道” preserves the emphatic independent pronoun and the reflexive force without narrowing it to intellectual comprehension.
  naturalness: The draft is generally fluent and suitably solemn. Repeating “要” in the final clause slightly obscures the compact imperative sequence; “你要听，并且自己要知道” is clear modern Mandarin while retaining the rhetorical emphasis.
  terminology: “看哪”“查考”“确实如此” are appropriate for Job’s elevated wisdom-dialogue register. No theological terminology or proper names occur.
  issues:
