  text: מֵ֭פֵר מַחְשְׁב֣וֹת עֲרוּמִ֑ים וְֽ/לֹא תַעֲשֶׂ֥ינָה יְ֝דֵי/הֶ֗ם תּוּשִׁיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/012.yaml
  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: zh_hans
  text: 他挫败狡猾人的计谋，使他们的手不能成事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: 挫败
  rationale: 该分词表示使计划落空、破坏其成效；“挫败”自然表达持续施行的行动。
- source_word: מַחְשְׁבוֹת
  choice: 计谋
  rationale: 此处指经过筹划的意图或方案，与“狡猾人”搭配时译作“计谋”符合语境。
- source_word: עֲרוּמִים
  choice: 狡猾人
  rationale: 该词可指精明或狡猾的人；本节所述计谋被上帝挫败，语境带负面意味。
- source_word: יְדֵיהֶם
  choice: 他们的手
  rationale: 保留希伯来语以“手”指人的行动和执行能力的具象表达。
- source_word: תּוּשִׁיָּה
  choice: 成事
  rationale: 该词语义可涉及实效、成功、健全的谋略或智慧；“不能成事”在此自然表达其行动无法取得实际成果，同时避免过度限定为某一种抽象含义。
theological_decisions:
- issue: 上帝与狡猾人计谋之间的关系
  choice: 直译为他主动“挫败”其计谋
  alternative: 弱化为计谋自行失败
  rationale: 原文使役分词明确以上帝为行动者，不应削弱其主动干预。
- issue: תּוּשִׁיָּה 的多义性
  choice: 译作“成事”
  alternative: 译作“成功”“智慧”或“健全的成果”
  rationale: 上下文重在计谋无法落实；“成事”既传达实际成效，也不过度消除该词在智慧文学中的语义张力。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。保留“他们的手”这一希伯来语具象表达；整句节奏紧凑，适合诗体智慧文学。
