  yaml_path: translation/ot/job/005/011.yaml
  text: to set the lowly on high[b][a], and those who mourn are lifted up to salvation.
translation:
  language: zh_hans
  text: 使卑微的人身居高处，使哀恸的人[a]被高举，得享拯救[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“面色黯淡的人”或“处于幽暗中的人”；希伯来语以昏暗的意象描写悲伤。
    reason: lexical_alternative
  - marker: b
    text: 或译“救恩”“解救”或“安全”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָשׂוּם
  choice: 使……身居
  rationale: שׂוּם是不定式，承接上文表达上帝作为的目的或结果。译作“使……身居”既保留安置、置于某种处境的使役含义，也符合现代汉语表达。
- source_word: שְׁפָלִים
  choice: 卑微的人
  rationale: 该词可指地位低下、处境卑微或被压低的人；“卑微的人”保留社会处境与人生境遇两方面的含义，不限定为内在谦卑的品格。
- source_word: לְמָרוֹם
  choice: 高处
  rationale: מָרוֹם指高处或高位，与“卑微”形成鲜明的垂直意象和处境逆转。
- source_word: וְקֹדְרִים
  choice: 哀恸的人
  rationale: קדר可表示昏暗、阴沉，也可描写因悲伤而面色黯淡；“哀恸的人”自然传达此处的悲苦状态，同时以脚注保留黑暗意象。
- source_word: שָׂגְבוּ
  choice: 高升
  rationale: 该动词表达升高、处于高处或得到坚固保护；“高升”与前半句“高处”形成平行，又不额外指定升高的具体方式。
- source_word: יֶשַׁע
  choice: 救恩
  rationale: יֶשַׁע涵盖拯救、解救和安全。“救恩”保留其较宽的词义与神学分量；脚注说明在本智慧文学语境中也可具体理解为获救或安全。
theological_decisions:
- issue: 智慧文学语境中יֶשַׁע的译法
  choice: 救恩
  alternative: 拯救；安全之境
  rationale: “救恩”保留原词从现实解救到广义救助的语义幅度，但不在正文中把它限定为后期系统神学意义；脚注提示本节也可侧重现实的脱险与安稳。
- issue: קֹדְרִים的黑暗意象与哀恸含义
  choice: 哀恸的人
  alternative: 面色黯淡的人；处于幽暗中的人
  rationale: 上下文强调受苦者处境的逆转，“哀恸”最自然地表达其经验意义；同时脚注保留希伯来语以昏暗描绘悲伤的多义性，避免消除原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“卑微—高处”和“哀恸—高升”保留原文的平行结构与处境逆转；正文中的两个脚注标记均紧随其所说明的词语。
