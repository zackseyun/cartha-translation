  yaml_path: translation/ot/job/005/018.yaml
  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: zh_hans
  text: 因为他使人痛苦，却又包扎伤处；他击碎，他的手却医治。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的手”按字面为单数；其后“医治”在希伯来语中是阴性复数形式。也可译作：“他压碎，他的手却医治。”
    reason: 保留马所拉文本中单数名词与阴性复数谓语之间的形式张力，并注明“击碎”的可行词义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，表达解释或因由；现代汉语用“因为”自然清楚。
- source_word: הוּא
  choice: 他
  rationale: 保留独立代词所明确指出的主语；汉语无需另加“亲自”，也能在语境中保持焦点。
- source_word: יַכְאִיב
  choice: 使人痛苦
  rationale: 使役形直接表示“使疼痛、使痛苦”；加入泛指的“人”使汉语完整，但不限定具体受事。
- source_word: וְיֶחְבָּשׁ
  choice: 却又包扎
  rationale: חבש在此指包扎伤处；“却又”显明诗句中伤害与医治之间的对照。
- source_word: יִמְחַץ
  choice: 击碎
  rationale: מחץ表示猛烈击打、压碎；“击碎”保留动作的强烈程度，并与随后的医治意象呼应。
- source_word: וְיָדוֹ
  choice: 双手却
  rationale: 希伯来语名词按字面为单数“他的手”，后接复数动词；正文以自然汉语“他的双手”体现复数谓语所传达的整体意义，并在脚注保留形式上的不一致。
- source_word: תִּרְפֶּינָה
  choice: 医治
  rationale: רפא的基本意义是医治；此处复数形式与正文的“双手”搭配。
theological_decisions:
- issue: 上帝在痛苦与医治中的直接作为
  choice: 保留上帝既使人痛苦、击碎，又包扎、医治的直接主语关系。
  alternative: 译成“容许人受苦”等较弱的间接表达。
  rationale: 希伯来原文明确以“他”为这些相反行动的施事者；译文不缓和这种神学张力，也不替原文加以解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使人痛苦”准确表达使役含义；“包扎—医治”保留医疗意象，“击碎”保留诗歌力度。脚注标记已置于正文。
