  text: וְֽ֭/יָדַעְתָּ כִּי רַ֣ב זַרְעֶ֑/ךָ וְ֝/צֶאֱצָאֶ֗י/ךָ כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/025.yaml
  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
translation:
  language: zh_hans
  text: 你必知道，你的后裔[a]众多，你的子孙如同地上的青草[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文是集合名词，也可直译为“种子”。
    reason: lexical_alternative
  - marker: b
    text: “地”也可译作“土地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: 你必知道
  rationale: 这是带连接词的第二人称阳性单数完成式；在本诗歌语境中表达将来的确定结果。“必知道”既自然，也保留保证语气。
- source_word: כִּי
  choice: （不单独译出，以宾语分句表达）
  rationale: 此处引出“知道”的内容。现代汉语可直接说“知道，你的后裔……”，无需生硬加入“即”或“就是”。
- source_word: רַב
  choice: 众多
  rationale: 修饰具有集合意义的“后裔”，表示数量繁多；“众多”简洁而庄重。
- source_word: זַרְעֶךָ
  choice: 你的后裔
  rationale: זֶרַע本义为“种子”，此处作集合名词，指一个人的后代。“后裔”准确表达家族延续的含义。
- source_word: וְצֶאֱצָאֶיךָ
  choice: 你的子孙
  rationale: 指由某人而出的后代。译作“子孙”与前句“后裔”形成自然的诗歌平行，同时避免机械重复。
- source_word: כְּעֵשֶׂב
  choice: 如同……青草
  rationale: 保留明喻及繁茂、不可胜数的意象；“青草”比“草木”更贴近עֵשֶׂב。
- source_word: הָאָרֶץ
  choice: 地上的
  rationale: אֶרֶץ可指“大地”或“土地”。“地上的青草”在汉语中自然，并保留较宽泛的空间意象。
theological_decisions: []
