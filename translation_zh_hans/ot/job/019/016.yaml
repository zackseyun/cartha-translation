  text: לְ/עַבְדִּ֣/י קָ֭רָאתִי וְ/לֹ֣א יַעֲנֶ֑ה בְּמוֹ פִ֝֗/י אֶתְחַנֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/016.yaml
  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
translation:
  language: zh_hans
  text: 我呼唤我的仆人[a]，他却不回答[b]；我亲口恳求他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴仆”。希伯来语 עֶבֶד 可按语境指仆人或奴隶。
    reason: lexical_alternative
  - marker: b
    text: 本节也可按过去发生的事来译：“我曾呼唤我的仆人，他却不回应；我曾亲口恳求他。”希伯来语动词形式在这里容许这种理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: 我的仆人
  rationale: עֶבֶד 可指仆人或奴隶；此处指约伯家中地位从属的人。正文用现代中文较自然的“仆人”，并以脚注保留“奴仆”这一可能译法。
- source_word: קָרָאתִי
  choice: 我呼唤
  rationale: קרא 的完成式在诗歌哀诉中可生动描述当前处境；“我呼唤”符合上下文，也保留“曾呼唤”的时态可能。
- source_word: וְלֹא יַעֲנֶה
  choice: 他却不回答
  rationale: ענה 意为“回答、回应”；וְ 在此表达反差，译作“却”。未完成式在这里可描述当前持续不回应的情形。
- source_word: בְּמוֹ פִי
  choice: 我亲口
  rationale: בְּמוֹ 带有强调意味；“亲口”自然地传达约伯竟须本人开口恳求家仆的屈辱。
- source_word: אֶתְחַנֶּן לוֹ
  choice: 恳求他
  rationale: חנן 的 Hitpael 形式表示求恩、哀求。“恳求他”准确而自然，不额外加入原文没有明说的“只得”或“必须”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲口恳求他”保留原文的强调和约伯所受的社会性羞辱；正文使用现在时呈现哀歌的鲜活处境，脚注保留过去时理解。
