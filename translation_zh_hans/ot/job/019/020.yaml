  text: My bone clings to my skin and to my flesh[b][a], and I have escaped with the skin of my teeth.
translation:
  language: zh_hans
  text: 我的骨头紧贴着我的皮肤和肉[a]；我带着我牙齿的皮逃脱了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我的骨头紧贴着我的皮肤和我的肉”；“骨头”是单数，可能以集合意义指全身骨骼。
    reason: lexical_alternative
  - marker: b
    text: 直译为“带着（或凭着）我牙齿的皮”。这是一个异常且含义有争议的希伯来表达；可指牙齿周围仅存的一点皮肉，也可表示极其勉强地逃脱。
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  choice: 我的皮肉
  rationale: “皮”和“肉”在希伯来文中并列，描写约伯极度消瘦的身体状况。现代汉语用“皮肉”既保留两个身体意象，又避免“皮肤和肉”不自然的表达。
- source_word: דָּבְקָה עַצְמִי
  choice: 我的骨头紧贴着
  rationale: עַצְמִי 是单数“我的骨头”，但很可能是集合用法，指骨架或全身骨头；汉语“骨头”可自然地作集合性表达。דבק 表示紧密黏附，译作“紧贴着”。
- source_word: וָאֶתְמַלְּטָה
  choice: 侥幸逃过一劫
  rationale: מלט 表示逃脱或幸免。结合后面的异常短语“牙皮”，这里强调仅仅幸免；“侥幸逃过一劫”以自然汉语表达结果和险度。
- source_word: בְּעוֹר שִׁנָּי
  choice: 只剩牙皮
  rationale: 字面为“凭着／带着我牙齿的皮”。希伯来短语含义有争议，并非汉语已有的同形习语；译作“只剩牙皮”保留其突兀身体意象和极端残存状态，不把它直接改造成英语习语“九死一生”。
theological_decisions:
- issue: בְּעוֹר שִׁנָּי 的具体所指
  choice: 正文保留“牙皮”的异常意象，并用“侥幸”表达险险存活
  alternative: “我仅以牙齿周围的皮得以逃脱”或“我死里逃生”
  rationale: 原文可能描述只剩牙龈或牙齿周围之皮，也可能是一种表示勉强逃脱的说法。正文既不将其确定为某个解剖部位，也不完全抹去原有意象。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“紧贴”“皮肉”呈现约伯消瘦至骨肉相贴的惨状；分号保留两小句间的并列和递进关系。所有脚注标记均置于正文对应位置。
