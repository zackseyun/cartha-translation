  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: zh_hans
  text: 他从四面八方摧毁我，我便消逝；他又把我的指望像树一样拔起[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我便走了”或“我便灭亡了”。希伯来文直译为“我便走了”；在这里可能表示遭摧毁后的结果：约伯已被毁灭或不复存在。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: 拆毁我
  rationale: נתץ表示拆毁、摧毁；“拆毁我”保留原文强烈的毁坏意象，也与下半句拔树的比喻相协调。
- source_word: סָבִיב
  choice: 从四面
  rationale: 表达四周、各方面，突出毁坏是全面的；现代汉语自然简洁。
- source_word: וָאֵלַךְ
  choice: 我就消逝了
  rationale: 字面为“我就走了”，在遭拆毁的语境中可指不复存在、灭亡。“消逝”表达结果，同时以脚注保留原文较直译的可能。
- source_word: וַיַּסַּע
  choice: 拔掉
  rationale: נסע在此有拔起、移除之意；与“树”连用时，“拔掉”自然传达连根拔除的图像。
- source_word: כָּעֵץ
  choice: 像拔树一样
  rationale: 原文直为“像树一样”，其比较关系可理解为指拔除的方式；汉语补出动词使比喻关系清楚，同时不改变树被拔起的核心意象。
- source_word: תִּקְוָתִי
  choice: 我的指望
  rationale: תקוה意为希望、期待；“指望”适合约伯哀诉的庄重语体，并自然表示他所寄托的盼望。
