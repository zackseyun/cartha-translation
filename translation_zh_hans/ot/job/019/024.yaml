  text: with an iron stylus and lead[b][a], may they be engraved in the rock forever!
translation:
  language: zh_hans
  text: 愿这些话用铁笔和铅[a]，永远镌刻[b]在磐石上！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的铅可能是与铁制工具配合使用的金属，也可能用来填入刻痕，使文字更清楚；但原文没有明说其用途。
    reason: cultural_note
  - marker: b
    text: 或译“凿刻”。希伯来语动词通常指“凿”或“开凿”，这里指把话语永久刻在磐石上。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵט בַּרְזֶל
  choice: 用铁笔
  rationale: עֵט可指书写或刻写的工具；这里与“铁”和“磐石”连用，所指是刻字工具。“铁笔”既简洁自然，也保留原文的书写意象及材质说明。
- source_word: וְעֹפָרֶת
  choice: 和铅
  rationale: עֹפָרֶת明确指金属铅。原文只并列提到铅，没有说明其具体用途，因此正文不作补充解释。
- source_word: לָעַד
  choice: 永远
  rationale: 表达长久不灭、永久保存之意；“永远”符合现代汉语，也契合上下文对永久记录的愿望。
- source_word: בַּצּוּר
  choice: 在磐石上
  rationale: צוּר指岩石或磐石。汉语通常说把字“刻在……上”；“磐石”保留了原词所指的坚固岩体，而没有泛化为普通的“石头”。
- source_word: יֵחָצְבוּן
  choice: 愿……镌刻
  rationale: חצב通常意为凿、劈、开凿；用于把话语永久刻入岩石时，“镌刻”自然地表达刻字含义。未完成式在承接上一节的愿望语气时具有祈愿色彩，故用“愿”。
theological_decisions: []
