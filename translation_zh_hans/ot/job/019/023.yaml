  yaml_path: translation/ot/job/019/023.yaml
  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: zh_hans
  text: 惟愿我的话现在被写下来！惟愿它们被铭刻[b]在书卷[a]上！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”也可译作“书”或“文书”；希伯来语“סֵפֶר”可指书卷、书籍或书面文献。
    reason: cultural_note
  - marker: b
    text: “铭刻”也可译作“刻下”；原文动词含有刻写、留下持久记录的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: 惟愿
  rationale: 这是表达强烈愿望的惯用语，并非询问“谁会赐下”。“惟愿”既保留祈愿语气，也符合庄重而自然的现代汉语。
- source_word: אֵפוֹ
  choice: 现在
  rationale: 此语气词在这里加强愿望的迫切感；译作“现在”可传达其即时性，又不过度解释。
- source_word: וְיִכָּתְבוּן
  choice: 写下来
  rationale: 该形式表达被写下、被记录的意思。汉语在愿望句中用主动形式“我的话写下来”更自然，同时保留原文未说明书写者的特点。
- source_word: מִלָּי
  choice: 我的话
  rationale: 直接表达约伯希望保存下来的言语；“话”比“言辞”更通俗自然，又不失庄重。
- source_word: בַּסֵּפֶר
  choice: 在书卷上
  rationale: סֵפֶר可指书、卷轴或书面文献。结合古代书写背景译作“书卷”，既自然，也比现代装订意义上的“书”更贴近可能的物质载体。
- source_word: וְיֻחָקוּ
  choice: 铭刻
  rationale: חקק有刻写、镌刻之意，强调留下持久记录。“铭刻”保留这种力度，并与前句较一般的“写下来”形成递进。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“惟愿”再现两次祈愿式呼喊；第二句以“它们”承接“我的话”，使汉语表达自然，同时不补入原文未明说的书写者。
