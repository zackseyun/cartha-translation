  source_fidelity: “我的亲属都离开了我”在本节哀歌语境中自然表达 חָדְלוּ（停止、断绝；即不再在约伯身边或不再支持他）的关系疏离。虽原文此动词未明示第一人称宾语，但中文补出“我”符合上下文，并与英文审计所采用的“have failed me”一致。“我所认识的人也忘记了我”准确对应“那些为我所知的人／相识的人忘记了我”，没有将其过度强化为朋友。
