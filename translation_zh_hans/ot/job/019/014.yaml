  yaml_path: translation/ot/job/019/014.yaml
  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: zh_hans
  text: 我的亲属都离开了我，我所认识的人也忘记了我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָדְלוּ
  choice: 都离开了我
  rationale: 该动词基本义为“停止、断绝”。这里以“我的亲属”为主语，表达他们不再来往或支持约伯；译作“离开了我”符合现代汉语习惯，同时保留关系中断之意。原文并无独立的一人称宾语，但可由语境自然补出。
- source_word: קְרוֹבָי
  choice: 我的亲属
  rationale: קָרוֹב本义为“近的人”，在此可指亲近者或亲属；“亲属”与上下文的人际关系清单相合，也比“近人”自然明确。
- source_word: וּמְיֻדָּעַי
  choice: 我所认识的人
  rationale: 该词源于ידע，指与说话者相识、为其所认识的人。“我所认识的人”保留其较宽泛的关系范围，不将其强化为“朋友”。
- source_word: שְׁכֵחוּנִי
  choice: 忘记了我
  rationale: שׁכח的直接意义是“忘记”；原文带第一人称宾语，直译既准确，也保留约伯哀诉中的强烈弃绝感。
