base_translation:
  language: en
  yaml_path: translation/ot/job/019/028.yaml
  text: If you say[a], ‘How shall we pursue him, since the root of the matter is found in me?’
translation:
  language: zh_hans
  text: '如果你们说[a]：

    “我们该怎样追逼他呢？

    事情的根由就在我里面。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文较难确定。末句也可理解为“事情的根由在他里面”，这取决于如何衡量辅音文本和古代译本；“追逼”也可作更强烈的“迫害”。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי תֹאמְרוּ
  choice: 如果你们说
  rationale: כִּי 在此与未完成式 תֹאמְרוּ 构成假设性引语，用“如果你们说”既保留条件意味，也符合现代汉语表达。
- source_word: מַה נִּרְדָּף לוֹ
  choice: 我们该怎样追逼他呢
  rationale: מַה 在动词前表示“怎样”；רדף 可指追赶、追逼乃至迫害。语境涉及约伯所受的敌对攻击，“追逼”既保留追逐意象，也表达较强的逼迫意味；第一人称复数译为“我们”。
- source_word: וְשֹׁרֶשׁ דָּבָר
  choice: 事情的根由
  rationale: שֹׁרֶשׁ 是“根”，在此作比喻，指事情的根源或症结；דָּבָר 指当前所论之事。“事情的根由”在现代汉语中自然，并保留原文的根源意象。
- source_word: נִמְצָא בִי
  choice: 就在我里面
  rationale: נִמְצָא 是尼斐勒式，表示“被发现、存在于”；בִי 按马所拉文本直译为“在我里面”。“就在”体现原句断言语气，但不消解该短语本身的文本和解释难点。
theological_decisions:
- issue: 末句所指对象及其与前句的逻辑关系
  choice: 按马所拉文本译作“事情的根由就在我里面”
  alternative: 事情的根由在他里面／问题的根源在他身上
  rationale: WLC 元音文本明确为 בִי（在我里面），因此正文保留第一人称。古代译本及辅音文本的不同衡量可支持第三人称理解，且全句逻辑困难，故在脚注说明，而不在正文中替读。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“追逼”比单纯“追赶”更符合敌对语境，同时避免把 רדף 的强度限定为明确的宗教性“迫害”。正文保留原文第一人称所造成的张力，并以脚注交代主要异读。
