  text: All my intimate friends abhor me[a], and those whom I loved have turned against me.
translation:
  language: zh_hans
  text: 我的密友[a]都憎恶我；我所爱的人都转而与我为敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“我密议（或秘密圈子）中的人”，指约伯信赖的知己或亲近伙伴。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: 厌恶我
  rationale: תעב表达强烈的反感和排斥；“厌恶”在现代汉语中自然、庄重，并保留原文力度。
- source_word: כָּל
  choice: 都
  rationale: 配合复数群体作周遍表达，“都”比逐字译作“所有”更符合汉语句法。
- source_word: מְתֵי סוֹדִי
  choice: 我的知心人[a]
  rationale: 该短语字面指属于约伯私密商议或亲密圈子的人；“知心人”简洁传达可信赖、可倾诉隐情的亲近关系，并以脚注保留其字面意象。
- source_word: וְזֶה אָהַבְתִּי
  choice: 我所爱的人也
  rationale: זֶה形式上为单数，但后接复数动词，并与前句群体平行；汉语用集合性的“人”可自然保留数目上的开放性，不强行限定为一人或多人。
- source_word: נֶהְפְּכוּ בִי
  choice: 转而与我为敌
  rationale: נֶהְפְּכוּ表示态度或立场发生逆转，בִי在此语境含敌对指向；此译清楚表达从亲爱到敌对的反转。
theological_decisions:
- issue: וְזֶה与复数动词之间的数不一致
  choice: 译作集合性的“我所爱的人”
  alternative: 译作“我所爱的那些人”或“我所爱的这人”
  rationale: 原文指示词为单数形式，动词却为复数。集合性的“人”在汉语中不明确限定单复数，既符合上下文，也避免替原文消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“知心人”体现亲密与信任；分号保留两组平行陈述。“与我为敌”呈现关系逆转的敌对含义，而不加入具体背叛行为。
