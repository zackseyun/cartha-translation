  text: 你们若真在我之上自高[a]，又拿我的耻辱来指证我[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抬高自己来压我。”希伯来语动词可表示以压低别人来抬高自己。
    reason: lexical_alternative
  - marker: b
