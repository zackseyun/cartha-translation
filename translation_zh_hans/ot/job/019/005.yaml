    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אָמְנָם
  choice: 若真
  rationale: אִם引出条件，אָמְנָם加强语气；“若真”在现代汉语中简洁地保留“如果确实”的条件和强调意味。
- source_word: עָלַי תַּגְדִּילוּ
  choice: 抬高自己来压我
  rationale: גדל的使役式在此表达抬高自己，而עָלַי带有针对、凌驾于约伯之上的敌对意味；此译既保留“抬高”的意象，也自然传达以贬压对方来自高的语气。
- source_word: וְתוֹכִיחוּ עָלַי
  choice: 又……来指证我
  rationale: יכח的使役式可指辩论、证明或确立案情；“指证”保留其司法、论证色彩，并与עָלַי所表达的针对性相合。
- source_word: חֶרְפָּתִי
  choice: 我的耻辱
  rationale: חֶרְפָּה可指羞耻、耻辱或受人辱骂的处境；“耻辱”兼顾社会性的蒙羞和被朋友用来攻击约伯的对象。
