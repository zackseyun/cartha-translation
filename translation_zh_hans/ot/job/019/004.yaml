  text: וְ/אַף אָמְנָ֥ם שָׁגִ֑יתִי אִ֝תִּ֗/י תָּלִ֥ין מְשׁוּגָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
translation:
  language: zh_hans
  text: 即使我确实走错了，我的过错仍留在我这里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文后半句直译为“我的过错与我同宿”，即“我的过错留在我这里”。
    reason: 保留תָּלִין（“住宿、过夜”）的字面意象，并说明正文所表达的持续、归属意味。
lexical_decisions:
- source_word: וְאַף אָמְנָם
  choice: 即使……真的
  rationale: וְאַף在上下文中引出让步，אָמְנָם加以强调；合译为“即使……真的”，既自然，也保留“就算确实如此”的语气。
- source_word: שָׁגִיתִי
  choice: 我……走错了
  rationale: שׁגה表示偏离、走错或犯错。“走错了”保留偏离正路的形象，又不把这里的错误直接限定为犯罪。
- source_word: מְשׁוּגָתִי
  choice: 我的过错
  rationale: 该名词与前面的שׁגה同属“偏离、错误”的语义范围。“过错”在现代汉语中自然，也避免用“罪”过度界定其道德性质。
- source_word: אִתִּי תָּלִין
  choice: 由我自己承担
  rationale: 字面意思是“与我同宿／留在我这里”，在本节语境中表示这错误仍是约伯自己的事。“由我自己承担”清楚传达其语用含义；原文意象在脚注中保留。
theological_decisions:
- issue: שׁגה与מְשׁוּגָה是否明确指宗教或道德意义上的罪
  choice: 译作“走错了／过错”
  alternative: 译作“犯了罪／我的罪”
  rationale: 原词可以涉及有罪的过失，但本句本身没有明确要求用专门表示“罪”的词；较宽泛的译法保留约伯让步陈述中的含混与张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“即使我真的走错了”呈现让步和强调；后半句避免生硬直译，同时用脚注保存希伯来文“同宿”的意象。
