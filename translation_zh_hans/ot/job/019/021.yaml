base_translation:
  language: en
  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: zh_hans
  text: 可怜我吧[a]，可怜我吧，我的朋友们！因为上帝的手击打了我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恩待我吧”或“怜悯我吧”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“触及了我”；这里的表达带有伤害性的含义，因此译作“击打了我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: 可怜我吧
  rationale: 这是复数命令式，约伯直接恳求朋友以怜悯相待。“可怜我吧”在现代汉语中自然地传达此处的人际恳求，也保留了命令式中带有哀求的语气。
- source_word: חָנֻּנִי（重复）
  choice: 可怜我吧，可怜我吧
  rationale: 保留原文的完整重复，以呈现约伯恳求时的迫切和诗歌性的加强。
- source_word: רֵעָי
  choice: 我的朋友们
  rationale: רֵעַ可指朋友或同伴；此处用“我的朋友们”既符合直接呼语，也凸显约伯正向本应同情他的人求怜悯。
- source_word: כִּי
  choice: 因为
  rationale: 在这里引出约伯请求朋友怜悯他的理由；“因为”清楚、自然。
- source_word: יַד אֱלוֹהַּ
  choice: 上帝的手
  rationale: 保留希伯来文以“手”表示行动或能力的具体比喻，不将其意译为抽象的“上帝的作为”。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的诗体单数称谓，直接译作“上帝”，不增添原文没有的“全能者”等含义。
- source_word: נָגְעָה בִּי
  choice: 击打了我
  rationale: נגע与介词ב连用时可表示触及、击打或伤害。结合约伯遭受苦难的语境，“击打了我”传达了有害的冲击，同时保持“手”这一具体意象；脚注保留较字面的译法。
theological_decisions:
- issue: 约伯苦难的施动者
  choice: 因为上帝的手击打了我
  alternative: 因为上帝的手触及了我／因为上帝的手使我受苦
  rationale: 希伯来文以“上帝的手”为主语，明确将约伯的遭遇归于上帝的行动。译文保留这种尖锐的神学张力，不加以淡化，也不解释上帝如何参与或为何如此。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可怜我吧”的重复保留原诗急切的呼求；感叹号体现直接呼语的强烈情绪，但不增添解释。“上帝的手”保留原文比喻，“击打了我”则按上下文表达其伤害性。
