base_translation:
  language: en
  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: zh_hans
  text: 他剥去了我的尊荣[a]，又摘下我头上的冠冕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣”或译“荣耀”或“尊严”。
    reason: כְּבוֹדִי语义范围包括荣耀、尊荣、尊严及地位；正文依语境采用“尊荣”，脚注保留真实的词义幅度。
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: 我的尊荣
  rationale: כָּבוֹד可指荣耀、尊荣、尊严或社会地位。这里与冠冕的意象平行，表达约伯被夺去身份与体面的处境；“尊荣”既自然庄重，也保留其地位和荣耀的双重意味。
- source_word: מֵעָלַי
  choice: 去了我的
  rationale: 原文直译近于“从我身上”，与“剥去”连用时，汉语说“剥去了我的尊荣”更自然，同时保留从约伯身上除去某物的意象。
- source_word: הִפְשִׁיט
  choice: 剥去了
  rationale: 该使役式动词有剥下衣物、使脱去之义；“剥去”保留了把尊荣当作覆在身上之物的鲜明比喻。
- source_word: וַיָּסַר
  choice: 又摘下
  rationale: סור的使役式表示除去、拿走。冠冕戴在头上，因此“摘下”比泛称“除去”更贴合具体意象；“又”体现并列推进。
- source_word: עֲטֶרֶת
  choice: 冠冕
  rationale: 该词指冠冕或花冠，是尊荣和地位的象征。“冠冕”在现代中文中庄重易懂，并能与“尊荣”形成诗性平行。
- source_word: רֹאשִׁי
  choice: 我头上的
  rationale: 按原文保留身体部位和所属关系；调整为自然汉语定语结构，使冠冕位于头上的图像清晰。
theological_decisions:
- issue: 未明说之主语的所指
  choice: 以“他”保留阳性单数第三人称，并由上下文指向上帝
  alternative: 明确译为“上帝”，或理解为未特定的敌手、处境
  rationale: 希伯来文本本节只以动词形态表达阳性单数主语，没有直接写出“上帝”。上下文中约伯把所受打击归于上帝，但译文不补出名称，以保存原文的简练及其神学张力。
translation_notes:
  register: 采用现代标准普通话的庄重诗体。两个分句以“剥去／摘下”和“尊荣／冠冕”构成平行；不补出“上帝”，也不把冠冕意象解释性改写为社会地位。
