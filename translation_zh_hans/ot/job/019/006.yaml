base_translation:
  language: en
  yaml_path: translation/ot/job/019/006.yaml
  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: zh_hans
  text: 你们要知道：上帝不公正地待我[a]，又用他的网罗[b]把我围住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“冤屈了我”或“歪曲公正来对付我”。希伯来语动词可指使正直或公正的事弯曲、歪曲。
    reason: lexical_alternative
  - marker: b
    text: “网罗”也可译作“圈套”或“捕猎的网”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ
  choice: 你们要知道
  rationale: 这是ידע的复数祈使式，直接要求约伯的听众承认他所陈述的事实；“你们要知道”在现代汉语中自然明确。
- source_word: אֵפוֹ
  choice: 所以
  rationale: 该话语助词在这里带有强调和推论作用；“所以”承接约伯的论辩，也不过度增译。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是单数神称，宜译为通常的“上帝”，不应扩充为“全能的上帝”等更具体称号。
- source_word: עִוְּתָנִי
  choice: 冤屈了我
  rationale: עות可表示使弯曲、歪曲或不公正地对待；“冤屈了我”自然地传达约伯指控自己遭受不公的司法与道德力度，同时保留经文的尖锐张力。
- source_word: מְצוּדוֹ
  choice: 他的网罗
  rationale: 该名词指捕猎所用的网或圈套；“网罗”既保留捕猎意象，也符合庄重而通顺的汉语表达。
- source_word: עָלַי הִקִּיף
  choice: 把我围住
  rationale: 该动词表示环绕、包围；配合“用他的网罗”译作“把我围住”，准确而合乎现代汉语习惯。
theological_decisions:
- issue: 约伯对上帝的指控
  choice: 保留约伯直言上帝“冤屈了我”的说法
  alternative: 译作“使我受苦”或“与我为敌”，以弱化不公之意
  rationale: 希伯来语动词具有扭曲正直、公正受到破坏的强烈意味。译文应忠实保留约伯哀诉中的神学张力，而不暗中缓和他的指控；这呈现人物当下的判断，并不等于把该判断确立为教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“冤屈”保留司法性和情感力度；“网罗”保留捕猎隐喻。主句中的两个脚注标记均紧随相关陈述出现。
