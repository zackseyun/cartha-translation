base_translation:
  language: en
  yaml_path: translation/ot/job/019/002.yaml
  text: How long will you torment me and crush me with words?[a]
translation:
  language: zh_hans
  text: 你们折磨我，用言语压碎我，要到几时呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们使我的心灵悲痛，用言语压碎我，要到几时呢？”
    reason: 词义选择：תּוֹגְיוּן 可表示“使悲痛”，נַפְשִׁי 也可较直译为“我的心灵”。
lexical_decisions:
- source_word: עַד אָנָה
  choice: 要到几时呢
  rationale: 这是希伯来语哀叹中惯用的时间问句；此译法符合现代汉语表达，也保留了反问和抗议的语气。
- source_word: תּוֹגְיוּן
  choice: 折磨
  rationale: 该使役形式表示使人忧伤、受苦或烦恼；结合约伯因朋友言语而承受的持续内在痛苦，“折磨”最能体现其强度。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נֶפֶשׁ 在这里指约伯本人，尤其侧重其内在生命；译作“我”可避免把人理解为灵魂与身体截然分离，同时保持自然简洁。
- source_word: וּתְדַכְּאוּנַנִי
  choice: 压碎我
  rationale: דכא 含有压碎、摧垮之意；直译为“压碎我”保留了原文强烈的暴力隐喻，并与言语造成的伤害相呼应。
- source_word: בְמִלִּים
  choice: 用言语
  rationale: 介词 בְּ 在此表示手段，说明他们借着所说的话摧残约伯；“用言语”是自然、准确的汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的汉语。保留第二人称复数“你们”、原文的强烈隐喻和哀诉式反问；脚注呈现“使悲痛／我的心灵”这一较直译的可能。
