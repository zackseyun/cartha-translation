  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: zh_hans
  text: 他的军队一同前来；他们筑起道路来攻击我[a]，在我的帐篷四周安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们向我筑起道路。”希伯来语动词可指修筑或垫高道路，也可使人联想到攻城坡道。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: 一同
  rationale: 表示联合或同时行动；“一同”自然地传达协同进攻的意味。
- source_word: יָבֹאוּ
  choice: 前来
  rationale: בוא的基本义是“来”；语境中指敌军逼近，“前来”符合生动的诗歌叙述。
- source_word: גְדוּדָיו
  choice: 他的军队
  rationale: גְּדוּד可指部队、军旅或袭击队；“军队”简明地保留军事意象，又不刻意限定规模。第三人称阳性单数后缀译为“他的”。
- source_word: וַיָּסֹלּוּ
  choice: 筑起
  rationale: סלל常指修筑、垫高道路，也可用于构筑攻城坡道；“筑起”保留工程性和攻城意象。
- source_word: עָלַי
  choice: 攻击我
  rationale: 字面可作“在我之上/向着我”，但在围攻语境中带敌对意味；与“筑起道路”连用，译作“攻击我”自然清楚。
- source_word: דַּרְכָּם
  choice: 道路
  rationale: דֶּרֶךְ可指道路、路径或方式；因前面的动词暗示修筑工程，“道路”最能保留具体军事图景。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה意为扎营；“安营”是现代中文中自然且庄重的军事表达。
- source_word: סָבִיב
  choice: 四周
  rationale: 表示环绕各面；“四周”清楚体现包围之势。
- source_word: לְאָהֳלִי
  choice: 我的帐篷
  rationale: אֹהֶל字面为帐篷，也可代指住所或家室；保留“帐篷”可维持原诗具体意象。
theological_decisions:
- issue: “他的军队”中第三人称阳性单数后缀的所指
  choice: 保留“他的”，由上下文指向约伯所描绘为攻击他的上帝。
  alternative: 将其理解为比喻中未明确说明的敌军统帅。
  rationale: 紧邻上下文以围城图景描述上帝对约伯的敌对行动；译文不直接增添“上帝”，从而既保存希伯来的代词形式，也保留所指在语法层面的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“军队—筑路—安营—帐篷”维持全节连续的围攻意象；分号呈现两个紧密相连的军事行动。
