  text: אֲשֶׁ֤ר אֲנִ֨י אֶֽחֱזֶה לִּ֗/י וְ/עֵינַ֣/י רָא֣וּ וְ/לֹא זָ֑ר כָּל֖וּ כִלְיֹתַ֣/י בְּ/חֵקִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/027.yaml
  text: whom I myself will see for myself[a], and my eyes will see, and not another[b]. My kidneys fail within my bosom.
translation:
  language: zh_hans
  text: 就是我亲自要得见的那一位；我的眼睛要看见他，不是别人[a]。我的肺腑在我里面都耗尽了[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不是别人”也可译作“不是陌生人”或“不是外人”。希伯来文在此强调：看见那一位的是约伯自己，而非他人。
    reason: lexical_alternative
  - marker: b
    text: “肺腑”所对应的希伯来文直译为“肾脏”；在希伯来表达中，肾脏可代表人的内在自我或最深的情感。
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 那一位
  rationale: 关系代词承接上一节所说的救赎者，所指为有位格者；汉语用“那一位”可自然衔接本节残句。
- source_word: אֲנִי
  choice: 我必亲自
  rationale: 独立人称代词在动词已有第一人称标记之外构成强调，译作“亲自”保留这一重音。
- source_word: אֶחֱזֶה
  choice: 看见
  rationale: חזה表示看见、观看，也可带较强的瞻望意味；“看见”清楚自然，又不额外限定异象或复活等解释。
- source_word: לִּי
  choice: 为我自己
  rationale: 此与格含义艰深，可能表示为自己、属于自己或在自己这一边；正文直译为“为我自己”，保留其强调及歧义。
- source_word: וְעֵינַי רָאוּ
  choice: 我的双眼必看见
  rationale: 保留具体的身体意象和诗歌平行；完成式在此与前面的未完成式并列，按预期之事译为将来。
- source_word: וְלֹא זָר
  choice: 并非别人
  rationale: זָר可指陌生人、外人，也可在对比中表示另一个人；此处译为“别人”自然表达约伯本人而非他人看见，同时脚注保留较字面的可能。
- source_word: כָּלוּ
  choice: 耗尽了
  rationale: כלה表达衰竭、消耗殆尽；与内在强烈渴望相连时，“耗尽了”保留诗句的剧烈张力。
- source_word: כִלְיֹתַי
  choice: 我的肺腑
  rationale: 字面为“我的肾脏”，在希伯来表达中指内在自我或最深的情感；中文“肺腑”既保留内脏意象，也自然传达内心深处。
- source_word: בְּחֵקִי
  choice: 在我怀中
  rationale: חֵיק本指胸怀、怀抱或衣襟内，译作“在我怀中”保留具体诗歌图像。
theological_decisions:
- issue: 约伯所期待之看见的性质
  choice: 译为约伯本人将来亲自看见上一节所说的那一位，不具体界定发生方式和时间。
  alternative: 将其明确解释为身体复活后见神、死前获得伸冤，或死后的属灵相见。
  rationale: 希伯来文强烈强调约伯本人将看见，但本节本身不足以裁定相关神学争论；译文保留这种张力。
- issue: לִי所表达的关系
  choice: 保留为“为我自己”，不把它明确解释为救赎者站在约伯一边。
  alternative: 译作“在我这一边”或省略。
  rationale: 与格确可有利益、归属或立场等理解；明确译成法庭式支持会超出本节能够确定的范围。
translation_notes:
  register: 采用现代、庄重而有诗意的普通话。“亲自”“双眼”“怀中”保留希伯来诗句反复强化本人亲见的效果；末句用感叹号呈现强烈的内在渴望而不替文本确定其神学含义。
