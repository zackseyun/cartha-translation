revisions:
- from: 就是我必亲自看见的那一位，是为我自己；我的双眼必看见，并非别人[a]。我的肺腑在我怀中耗尽了[b]！
  to: 就是我亲自要得见的那一位；我的眼睛要看见他，不是别人[a]。我的肺腑在我里面都耗尽了[b]！
  rationale: 修订以自然、庄重的现代普通话重述本节，同时保留原文的个人强调、双重视觉意象，以及末句内在耗竭的强烈诗性。用“得见”表达约伯亲身见到上一节所指那一位，不预断该异象的时间、方式或神学性质。
  reviewer_model: gpt-5.6-terra
