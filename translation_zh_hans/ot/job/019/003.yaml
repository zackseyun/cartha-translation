  text: These ten times you have humiliated me[a]; you are not ashamed to wrong me.
translation:
  language: zh_hans
  text: 你们已经十次羞辱我，竟不以恶待我为耻[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶待我”也可译作“亏负我”“苛待我”，或较直译为“把我当外人”。这里的希伯来语动词含义较难确定，可能指他们对待约伯，仿佛他是陌生人，或不再认他。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: 这十次
  rationale: 保留希伯来文的数词表达及其修辞力度；“十次”在此也可泛指一再发生。
- source_word: תַּכְלִימוּנִי
  choice: 你们……羞辱我
  rationale: כלם 的使役形表示使人蒙羞；“羞辱我”准确、自然，并保留约伯所受的人格贬损。
- source_word: לֹא תֵבֹשׁוּ
  choice: 竟不……为耻
  rationale: בוש 表示感到羞耻；加入“竟”自然传达质问和谴责语气，而不增添实质含义。
- source_word: תַּהְכְּרוּ לִי
  choice: 恶待我
  rationale: 此处 נכר 的使役形词义困难，可能指把约伯当陌生人、疏远他，进而冷酷或不公地对待他。“恶待我”在上下文中通顺，又不过度限定其具体方式。
theological_decisions:
- issue: 朋友对约伯行为的定性
  choice: 保留为约伯对朋友的直接控诉，不把“恶待”具体化为某种神学或道德罪名
  alternative: 译成“亏负我”“把我当外人”或“苛待我”
  rationale: 原文动词本身含义有争议，应保留其疏离、敌对和不当对待之间的张力，避免加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这十次”保留原文重复计数的修辞；分句简洁有力，符合约伯责问朋友的语气。
