base_translation:
  language: en
  yaml_path: translation/ot/job/019/026.yaml
  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
translation:
  language: zh_hans
  text: 在我的皮肤被毁之后[b]，我仍要从自己的肉身得见上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要在我的肉身中看见上帝”；也可译：“我要没有我的肉身而看见上帝。”这句希伯来语较难，历来有多种理解。
    reason: alternative_reading
  - marker: b
    text: “在我的皮肤被毁之后”这一分句在文本和词义上都较难；更直译可作：“在他们剥去我的皮肤之后——这。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: 以后
  rationale: 表达时间上的先后关系；前后文的连接可由整句自然承接，无须生硬译出“并且”。
- source_word: עוֹרִי
  choice: 我的皮肤
  rationale: עוֹר通常指皮肤或兽皮；在人身语境中译作“皮肤”最自然，并保留约伯受苦的身体意象。
- source_word: נִקְּפוּ זֹאת
  choice: 这样被毁
  rationale: 此处动词及זֹאת的句法均困难。“被毁”概括皮肤遭破坏的语境意义，“这样”谨慎体现指示词זֹאת，而不强行确定其具体句法功能。
- source_word: וּמִבְּשָׂרִי
  choice: 我仍要从我的肉身
  rationale: מִן最直接的意义是“从、出于”；“肉身”保留身体性，同时不把有争议的短语明确解释成“在肉身之中”或“脱离肉身”。“仍”体现上下文中的转折意味。
- source_word: אֶחֱזֶה
  choice: 看见
  rationale: חזה表示看见、观看；“看见”是清楚自然的现代汉语，并足以承载此处郑重的语气。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: אֱלוֹהַּ是《约伯记》中常见的单数神称，直译为“上帝”准确而自然。
theological_decisions:
- issue: וּמִבְּשָׂרִי是否明确教导身体复活
  choice: 正文保守译为“从我的肉身”，保留希伯来语的张力。
  alternative: “在我的肉身中”或“离开我的肉身”
  rationale: 介词מִן及整句句法存在争议。“在我的肉身中”会更明确地指向身体复活，“离开我的肉身”则指向脱离身体后的看见；原文不足以毫无疑义地排除其中一种，因此不在正文中替读者作神学裁决。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肉身”比单说“肉”更适合人体语境，又保留原文בשר的身体意象。脚注标记均在正文出现，并按相应短语就近安放。
