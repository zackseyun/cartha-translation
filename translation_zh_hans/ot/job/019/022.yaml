  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: zh_hans
  text: 你们为什么像上帝[a]一样追逼我，仍不以我的肉[b]为满足吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像神一样”；这里的希伯来语אֵל也可指“神”，较不可能指“大能者”。
    reason: alternative_reading
  - marker: b
    text: 直译“从我的肉得满足”。这形象地描绘他们无休止的敌意，仿佛吞吃约伯的血肉仍不知足。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 疑问副词，引出约伯对朋友们的抗议；“为什么”准确自然。
- source_word: תִּרְדְּפֻנִי
  choice: 追逼我
  rationale: רדף可指追赶、追逐或迫害；“追逼”兼具持续追逐和敌意压迫的意味，适合朋友们不断攻击约伯的语境。
- source_word: כְמוֹ
  choice: 像……一样
  rationale: 直接表达比较关系，符合现代汉语习惯。
- source_word: אֵל
  choice: 上帝
  rationale: 此处最可能指上帝，约伯责问朋友为何像上帝那样追逼他；同时以脚注保留“神”或“大能者”的词义可能。
- source_word: וּמִבְּשָׂרִי
  choice: 以我的肉
  rationale: מִן与“满足”连用，可表示获得满足的来源；“以我的肉为满足”保留原文具体而强烈的血肉意象。
- source_word: לֹא תִשְׂבָּעוּ
  choice: 还不……为满足呢
  rationale: שׂבע意为吃饱、满足；此译既保留“不满足”的字面意义，也自然传达反问语气和贪食般的敌意比喻。
theological_decisions:
- issue: 比较语כְמוֹ אֵל中אֵל的所指
  choice: 上帝
  alternative: 神；大能者
  rationale: 上下文中约伯指责朋友们以近乎神圣审判者的姿态追逼他，“上帝”最可能是这里的所指；脚注保留该词本身可能具有的普通名词义，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“追逼”比“追赶”更能体现敌意，又不像“迫害”那样过度限定含义；保留“我的肉”这一强烈的身体意象。脚注标记均置于正文相关句末。
