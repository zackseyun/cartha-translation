  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: zh_hans
  text: 但我知道，我的救赎者[a]活着；后来，他必在尘土[c]之上起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为我伸冤者”。希伯来语 גֹּאֵל 可指救赎者、维护权益者，或为家族成员申诉的人。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作“末后，他必站在尘土之上”；或“作为最后一位，他必立在尘土之上”。原文句法较难确定。
    reason: alternative_reading
  - marker: c
    text: “尘土”是原文的直译，可使人联想到人的必死性、坟墓或土地。
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我
  rationale: 连词与独立代词在上下文中带有强调和对比意味；“但我”用自然简洁的现代汉语表达这种转折性的个人宣告。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 完成式在这里表达约伯已经确立、如今仍然持守的确信；汉语现在时表达“我知道”最自然。
- source_word: גֹּאֲלִי
  choice: 我的救赎者
  rationale: גאל可指为亲属履行赎回、维护权益或伸冤职责的人。“救赎者”保留该词宽广的法律和神学分量，同时不把人物身份限定为某一种解释；语境上很有可能的“为我伸冤者”列入脚注。
- source_word: חָי
  choice: 活着
  rationale: 原文为表语形容词，断言这位救赎者是活着的；译为“活着”符合现代汉语习惯。
- source_word: וְאַחֲרוֹן
  choice: 后来
  rationale: 该形式可作时间性的副词理解，也可作“末后的”或“最后一位”理解。“后来”保留事件次序而不过度明确末世论含义；其他主要理解列入脚注。
- source_word: עַל
  choice: 在……之上
  rationale: עַל可表示“在……上、在……之上”。此译保留空间关系，不预先断定是站在地面上还是凌驾于尘土之上。
- source_word: עָפָר
  choice: 尘土
  rationale: 直译原词，保留其可能指向土地、死亡或坟墓的意象，避免在正文中直接解释成“地”或“坟墓”。
- source_word: יָקוּם
  choice: 起来
  rationale: קום可指起来、兴起或站立。“起来”在此与“在尘土之上”搭配，保留动态感，也不把含义局限于法庭站立或身体复活。
theological_decisions:
- issue: 约伯所说的 גֹּאֵל 是谁、发挥什么作用
  choice: 译为“我的救赎者”，不明确指定他就是上帝、天上的见证者或弥赛亚。
  alternative: “为我伸冤者”或“至亲救赎者”
  rationale: 基督教传统常按基督论理解本节，但希伯来文本本身没有明确指认这位人物。正文保留该称谓的神学分量，也不越过文本解决其身份上的张力。
- issue: וְאַחֲרוֹן ... יָקוּם 是否明确表达末世复活
  choice: 译为“后来，他必在尘土之上起来”。
  alternative: “末后，他必站在尘土之上”或“作为最后一位，他必立在尘土之上”
  rationale: 这一分句在句法和神学上都有争议。正文采用可成立的时间性理解，不把它扩展成明确的复活公式；其他主要读法在脚注中保留。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“救赎者”保留传统及神学回响；“尘土”保留原文意象。正文不明确指定救赎者的身份，也不把有争议的末句直接解释为完整的复活教义。
