  text: אַ֭חַ/י מֵ/עָלַ֣/י הִרְחִ֑יק וְ֝/יֹדְעַ֗/י אַךְ זָ֥רוּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: zh_hans
  text: 他使我的弟兄远离我[a]，认识我的人也完全与我疏远了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使我的弟兄离开我。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“认识我的人都成了我的陌生人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: 我的弟兄
  rationale: 该词是 אָח（弟兄）的阳性复数形式，带第一人称单数词尾，直译为“我的弟兄”。在语境中虽可泛指近亲，但正文保留其直接的词汇形式与亲属关系色彩。
- source_word: מֵעָלַי
  choice: 远离我
  rationale: מִן 与 עַל 及第一人称单数词尾结合，在 הִרְחִיק 的支配下表示从约伯身边或其生活范围中移开；“远离我”自然地表达了空间和关系上的距离。
- source_word: הִרְחִיק
  choice: 使……远离
  rationale: רחק 的 Hifil 完成式第三人称阳性单数，意为“使远离、移开”。“使……远离”既保留使役语态，也不额外强化为原文没有明说的暴力动作。
- source_word: וְיֹדְעַי
  choice: 认识我的人
  rationale: 源自动词 ידע 的主动分词复数构造形式并带第一人称单数词尾，字面义为“认识我的人”；此译法清楚自然，也比“熟人”更贴近原文表达。
- source_word: אַךְ
  choice: 完全
  rationale: אַךְ 在此加强后面的谓语，突出疏远的彻底程度；“完全”在现代汉语中自然地传达这一强调作用。
- source_word: זָרוּ
  choice: 疏远了
  rationale: 该动词在此表示变得陌生、像外人一样或关系疏离。“疏远了”保留关系破裂及完成后状态的含义；脚注列出更具字面色彩的译法。
- source_word: מִמֶּנִּי
  choice: 与我
  rationale: מִן 加第一人称单数词尾表示从约伯这里分离。汉语“与我疏远”是自然搭配，并准确表达关系上的隔绝。
theological_decisions:
- issue: הִרְחִיק 的隐含主语
  choice: 保留为“他”
  alternative: 明确译作“上帝使我的弟兄远离我”
  rationale: 希伯来文仅以第三人称阳性单数动词指示主语，并未在本节重提其名。上下文表明约伯所指是上帝，但正文用“他”可保留原文的简练表达，也不消解约伯向上帝归因其苦难所形成的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄”保留原文阳性复数的亲属称谓；“认识我的人”避免把范围收窄为一般“熟人”。句式简洁，符合哀歌语气。
