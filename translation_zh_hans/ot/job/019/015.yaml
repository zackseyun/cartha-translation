base_translation:
  language: en
  yaml_path: translation/ot/job/019/015.yaml
  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: zh_hans
  text: 寄居在我家的人和我的婢女都把我当作陌生人；在他们眼中，我成了外人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: 寄居在我家的人
  rationale: גָּרִים 指住在他人土地或家中的寄居者、客居者；此处保持其居留身份含义，不缩窄为短期来访的“客人”。
- source_word: אַמְהֹתַי
  choice: 我的婢女
  rationale: אָמָה 在此指家中的女性仆役；“婢女”简洁、庄重，也符合古代家户语境。
- source_word: לְזָר תַּחְשְׁבֻנִי
  choice: 都把我当作陌生人
  rationale: זָר 表示陌生、不属于本群体的人；“当作陌生人”自然传达 תַּחְשְׁבֻנִי 的认定意味。
- source_word: נָכְרִי
  choice: 外人
  rationale: 与前句 זָר 形成近义推进；采用“外人”保留“非自己人、异乡人”的色彩，并避免中文重复。
- source_word: בְעֵינֵיהֶם
  choice: 在他们眼中
  rationale: 保留希伯来语常用的观点表达，中文自然且庄重。
