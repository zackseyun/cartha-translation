  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיֹּאמַר
  choice: 说
  rationale: אמר的基本义为“说”；在中文中，“回答说”既对应希伯来文结构，也能自然引出下文。
- source_word: וַ
  choice: 承接语序，不单独译出
  rationale: 前缀וַ在此推进叙事。现代中文用“约伯回答说”已能自然表达话语承接；若机械译作“于是”或“然后”，会略显累赘。
