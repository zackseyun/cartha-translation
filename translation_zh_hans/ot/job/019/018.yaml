  text: גַּם עֲ֭וִילִים מָ֣אֲסוּ בִ֑/י אָ֝ק֗וּמָה וַ/יְדַבְּרוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: zh_hans
  text: 连小孩子[a]也厌弃我；我一站起来，他们就出言攻击我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小孩子”也可译作“愚昧人”“狂妄的人”或“少年人”。希伯来语 עֲוִילִים 通常指愚昧或在道德上缺乏判断力的人；但在这里，许多人理解为年幼或地位低微、嘲弄约伯的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 连……也
  rationale: 既承接上下文，又突出约伯所受羞辱之深：甚至社会地位低微的孩子也轻蔑他。
- source_word: עֲוִילִים
  choice: 小孩子
  rationale: 该词通常可指愚昧或缺乏判断力的人；但在本节语境中，很可能指年幼、卑微而胆敢嘲弄约伯的人。“小孩子”自然传达这种社会羞辱，同时以脚注保留词义上的不确定性。
- source_word: מָאֲסוּ בִי
  choice: 厌弃我
  rationale: מאס 表示带着轻蔑的拒绝；“厌弃”既保留拒斥意味，也符合本段哀诉的庄重语气。
- source_word: אָקוּמָה
  choice: 我一站起来
  rationale: 这里在语境中自然表达时间或反复出现的情形；“一……就……”准确呈现约伯起身随即遭到攻击的关系。
- source_word: וַיְדַבְּרוּ בִי
  choice: 他们就出言攻击我
  rationale: דבר 加介词 ב 在此语境中带有敌意。“出言攻击”保留言语行为及其针对性，又不具体限定为讥笑、诽谤或辱骂。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“连……也”强化约伯遭众人轻蔑的处境；分号保留原文两个紧密相连的分句。“出言攻击”避免把含义过度具体化为“嘲笑”。
