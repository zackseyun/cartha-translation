base_translation:
  language: en
  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: zh_hans
  text: 他筑墙封住我的路，使我不能通过[a]；又把黑暗放在我的路径上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文未明说主语；按上下文，约伯所说的是上帝，但本节本身只说“他”。
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: 我的路
  rationale: אָרַח可指道路、路径，也可引申为人生的行程；“我的路”在现代汉语中自然，并保留具体与比喻两层含义。
- source_word: גָדַר
  choice: 筑墙堵住
  rationale: 该动词有筑墙围住、拦阻之意；“筑墙堵住”既保存筑墙的具体意象，也清楚表达道路被封阻的结果。
- source_word: וְלֹא אֶעֱבוֹר
  choice: 使我无法经过
  rationale: 直译近于“而我不能经过”；结合前句，表达筑墙所造成的结果，用“使……无法”符合自然汉语。
- source_word: נְתִיבוֹתַי
  choice: 我的路径
  rationale: נְתִיבוֹת为复数，指小路、路径；汉语“路径”形式上不标单复数，却能自然涵盖多条行路，并与前面的“路”形成诗歌变化。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 直接保留原词既可指实际的昏暗，也可比喻困顿、迷失或无望，不额外限定其含义。
- source_word: יָשִׂים
  choice: 铺在
  rationale: שׂים基本义为放置、安放；结合“黑暗”与“路径”的意象，“铺在”在汉语中形象自然，同时保留黑暗仿佛被置于路上的具体画面。
theological_decisions:
- issue: 第三人称单数主语的所指
  choice: 他
  alternative: 上帝／耶和华
  rationale: 希伯来文动词只隐含阳性单数主语，本节没有明说名字；上下文表明约伯所说的是上帝，但正文保留“他”，避免把上下文所指改写成原句未出现的神名。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“筑墙堵住”保留原文强烈的实体意象；分号呈现两个平行分句。“铺在”避免抽象化为“使路径黑暗”，从而保存原文把黑暗放置在路径上的诗性表达。
