  yaml_path: translation/ot/job/019/011.yaml
  text: His anger burns against me[a], and he counts me as his enemies.
translation:
  language: zh_hans
  text: 他向我发怒，把我看作他的仇敌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחַר
  choice: 发作
  rationale: חרה与אַף构成表示怒气燃起、发作的惯用语。“发作”在现代汉语中自然地传达怒气被激起并指向人的动态；希伯来语连续式动词在本段叙述中宜译作完成性的表达。
- source_word: עָלַי
  choice: 向我
  rationale: עַל在怒气语境中表示怒气所针对的对象；“向我发作”自然表达敌对指向。
- source_word: אַפּוֹ
  choice: 他的怒气
  rationale: אַף本义为“鼻子”，在此惯用语中转指怒气；直译身体部位会妨碍理解。
- source_word: וַיַּחְשְׁבֵנִי
  choice: 把我看作
  rationale: חשב在此意为视为、算为。“把我看作”既贴合宾语结构，也比“计算我”为自然。
- source_word: לוֹ
  choice: 他的
  rationale: לוֹ表达相对于他的归属或立场，与后面的复数名词合译为“他的仇敌”，最符合现代汉语。
- source_word: כְצָרָיו
  choice: 仇敌
  rationale: צָר指敌人、对头；“仇敌”保持诗体庄重感。汉语“仇敌”本身不标示单复数，因此不人为补入“之一”，以免增添原文没有的成员关系表述。
theological_decisions:
- issue: 第三人称主语及代词所指
  choice: 按上下文指上帝，但正文仍沿用“他”
  alternative: 指某个未明确说明的敌对者
  rationale: 约伯记19:6-12持续把这些行动归于上帝。译文不淡化约伯指控上帝敌视自己的尖锐张力，同时本节不擅自加入原文未出现的“上帝”。
- issue: 把约伯视为“他的仇敌”的复数表达
  choice: 译为“把我看作他的仇敌”
  alternative: 把我看作他的仇敌之一
  rationale: 原文כְצָרָיו形式上是复数“像/作为他的敌人们”，却以单数“我”为宾语，形成不寻常但真实的张力。现代汉语“仇敌”不必显式标数，可以保留语义而避免添加“之一”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“怒气向我发作”保留原文怒气被激起并针对约伯的意象；全句维持约伯对上帝行动的直接控诉，不作神学缓和。
