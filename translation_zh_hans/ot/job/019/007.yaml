base_translation:
  language: en
  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: zh_hans
  text: 看哪，我喊叫：“暴行！”[a]却得不到回应；我呼救[b]，却没有公断。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴行”也可译作“强暴”“恶行”或“冤屈”。希伯来语词可指暴力、不法行为，也可用于受害者因遭受侵害而发出的法律控诉。
    reason: lexical_alternative
  - marker: b
    text: “呼救”指迫切呼求援助。
    reason: lexical_alternative
  - marker: c
    text: “公断”也可译作“公正”“审判”或“申冤”。原词在这里带有司法裁断和获得公正处理的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的提示词；“看哪”简洁庄重，也保留了原文突出的语势。
- source_word: אֶצְעַק
  choice: 我喊叫
  rationale: צעק表示人在危难中大声呼喊；“喊叫”同时传达声音和紧迫感。
- source_word: חָמָס
  choice: 暴行
  rationale: חמס可指暴力、恶行或受害者针对不法行为发出的控诉；此处作为喊出的控诉语，“暴行”保留了暴力与违法受害的双重意味。
- source_word: אֵעָנֶה
  choice: 得不到回应
  rationale: 这是ענה的未完成式Nifal形式，意为“被回应”；译为“得不到回应”既自然，又不擅自说明不回应者是谁。
- source_word: אֲשַׁוַּע
  choice: 我呼救
  rationale: שׁוע表示在困境中迫切求助；“呼救”准确而凝练，并与前句的“喊叫”形成诗歌平行。
- source_word: מִשְׁפָּט
  choice: 公断
  rationale: משפט在这里含有司法裁断、公正审理和正义伸张的意味；“公断”比宽泛的“公义”更能呈现法律申诉语境，同时保留公正的内涵。
theological_decisions:
- issue: 约伯对上帝的控诉力度
  choice: 直译他遭遇暴行、呼求不获回应且没有公断的哀诉，不缓和其控诉。
  alternative: 采用较间接的措辞，以避免听来像是在指控上帝不施行公正。
  rationale: 原文有意保留约伯信仰与经历之间的张力。译文不应预先替他解释或削弱他的抗议。
- issue: 未回应者的身份
  choice: 采用无施事表达“得不到回应”。
  alternative: 明确译作“上帝不回应我”或“无人回应我”。
  rationale: 本节的语境使控诉指向上帝，但该动词本身是被动式，没有明说施事者；译文保留这种语法上的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留诗体的强调语气；两个分句以“喊叫／呼救”和“得不到回应／没有公断”形成紧凑平行。
