base_translation:
  language: en
  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: zh_hans
  text: 你们自己要惧怕刀剑，因为烈怒会带来刀剑的刑罚，好让你们知道有审判[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节最后的希伯来语难以确定，也可理解为“全能者存在”“有诸般审判”或“有一位审判者”。
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ לָכֶם
  choice: 你们自己要惧怕
  rationale: 复数命令式表达严厉警告；לָכֶם带强调意味，用“你们自己”自然传达。
- source_word: מִפְּנֵי חֶרֶב
  choice: 刀剑
  rationale: מִפְּנֵי在此表示因刀剑临近而惧怕；汉语在“惧怕”后直接接宾语最自然。
- source_word: חֵמָה עֲוֺנוֹת חָרֶב
  choice: 烈怒招来刀剑的刑罚
  rationale: 原文结构极为凝练且略显生硬。חֵמָה为炽烈的愤怒；עֲוֺנוֹת可指罪孽，也可延伸指罪责所招致的刑罚。此处结合刀剑与审判语境，译作“刑罚”，并以“招来”表达各词之间隐含的关系。
- source_word: לְמַעַן תֵּדְעוּן
  choice: 好让你们知道
  rationale: 保留לְמַעַן所表达的目的关系，并用现代汉语自然表述。
- source_word: שדין
  choice: 审判确实存在
  rationale: 末尾形式疑难，可能涉及דין（审判）及存在判断。正文采用最贴合上下文警告意味的“审判确实存在”，但不把其他古老解释隐去。
theological_decisions:
- issue: 疑难末语שדין的解释
  choice: 审判确实存在
  alternative: 全能者存在；有诸般审判；有一位审判者
  rationale: 上下文是约伯警告朋友，他们也可能遭受刀剑与司法性的报应，因此以“审判”为中心最连贯。由于原文的分词、释读和句法均有争议，重要替代解释列入脚注，以保留文本本身的歧义与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“刀剑”保留古代审判与暴力意象；“烈怒”“刑罚”“审判”维持本节严肃的司法语气。脚注标记置于正文第一分句末，用于提示本节末语存在释读困难。
