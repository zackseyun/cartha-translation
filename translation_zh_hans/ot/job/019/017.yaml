  terminology: “气息”对应 רוּחִי，符合此处身体病痛和人际疏离的语境；“骨肉”作为“我腹中的儿子们”这一希伯来习语的意译是合适的。脚注须避免把男性说话者的“腹中”按汉语字面理解为妊娠，故说明其为“出自我身体”的习语。
