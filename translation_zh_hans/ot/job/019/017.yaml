base_translation:
  language: en
  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: zh_hans
  text: 我的气息令妻子厌恶；连我自己的骨肉[a]也憎恶我。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我腹中的儿子们”，即“出自我身体的儿子们”。这可能指约伯自己的儿女，也可能较宽泛地指他的近亲。
    reason: cultural_note
  - marker: b
    text: 这句希伯来文含义难定。另一种理解是：“我向自己的骨肉恳求”，或“我恳求自己的骨肉施恩”。
    reason: alternative_reading
lexical_decisions:
- source_word: רוּחִי
  choice: 我的气息
  rationale: רוּחַ可指风、气息或灵；这里描述妻子对约伯身体状况的反应，具体的“气息”最符合语境。
- source_word: זָרָה
  choice: 使……厌恶
  rationale: 该词基本含义涉及陌生、疏离，在本句的人际和身体语境中带有排斥意味；译作“使……厌恶”比生硬的“对……陌生”更符合现代汉语，同时保留疏远感。
- source_word: לְאִשְׁתִּי
  choice: 妻子
  rationale: לְ标明受到影响的人；汉语以“使妻子厌恶”自然表达这一关系。
- source_word: וְחַנֹּתִי
  choice: 也令人憎恶
  rationale: 此形式释义困难。正文依上下句的平行关系，采用表示令人厌恶的理解；与“求恩、恳求”相关的另一种理解收入脚注，避免掩盖原文的不确定性。
- source_word: לִבְנֵי בִטְנִי
  choice: 在自己的骨肉眼中
  rationale: 字面为“对我腹中的众子”。“自己的骨肉”保留血缘和身体意象，又是自然的现代汉语；所指可能是亲生儿女，也可能泛指近亲，故加注说明。
theological_decisions:
- issue: “我腹中的众子”所指何人
  choice: 正文译为较宽泛的“自己的骨肉”
  alternative: 亲生儿子／近亲
  rationale: 约伯记的叙事背景使“亲生儿女”这一指向产生张力，而希伯来习语也可能泛指血亲；正文不武断限定，脚注列明可能范围。
- issue: וְחַנֹּתִי的困难释义
  choice: 按平行结构译作“我……也令人憎恶”
  alternative: “我向自己的骨肉求情”或“我恳求自己的骨肉施恩”
  rationale: 正文所选释义与上半句的厌弃主题和平行结构相合，但原文形式也可联系חנן“施恩、求恩”，因此必须保留另一理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“自己的骨肉”是普通读者熟悉的血缘表达，既保留原文的身体意象，也避免把含义过早限定为仍在世的亲生儿子。分号呈现两行诗句的平行关系。
