  edition: WLC
  text: הַ/לַּ֥יְלָה הַ/הוּא֮ יִקָּחֵ֪/ה֫וּ אֹ֥פֶל אַל יִ֭חַדְּ בִּ/ימֵ֣י שָׁנָ֑ה בְּ/מִסְפַּ֥ר יְ֝רָחִ֗ים אַל יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: zh_hans
  text: 至于那一夜，愿幽暗将它夺去；愿它不在一年的日子中欢欣[a]，也不列入月份的数目。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿它不与一年的日子相联。”这里的希伯来语动词用法罕见；有人认为本句是说那一夜不应列入历法，而不是说它不欢欣。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: 至于那一夜
  rationale: 原文将“那一夜”置于句首作为强调的话题；“至于”在现代汉语中自然地保留这一标记。
- source_word: יִקָּחֵהוּ
  choice: 愿……将它夺去
  rationale: לקח基本义为“拿、取”；在幽暗被人格化并占据那一夜的语境中，“夺去”既保留敌对力量感，又不过度释义。
- source_word: אֹפֶל
  choice: 幽暗
  rationale: 该词可指黑暗或阴沉的昏暗；“幽暗”较“黑暗”更能传达诗歌中的浓重阴郁，同时仍属常用、庄重的表达。
- source_word: אַל יִחַדְּ
  choice: 愿它不……欢欣
  rationale: 此处动词形态罕见且意义有争议，可理解为“欢欣”，也可能与“联合、归入”有关。正文采用与哀歌式诅咒相称的“欢欣”，并在脚注保留历法归属意义的另一解。
- source_word: בִּימֵי שָׁנָה
  choice: 在一年的日子中
  rationale: 介词ב在此表达处于一个集合之中；该译法保留原文“年之日”的结构，又符合现代汉语。
- source_word: בְּמִסְפַּר יְרָחִים
  choice: 列入月份的数目
  rationale: 原文强调被计算在诸月之内；“列入……的数目”保留计数意象，且与前句可能涉及历法归属的含义呼应。
- source_word: אַל יָבֹא
  choice: 也不列入
  rationale: בוא直译为“进入、来到”；与“月份的数目”搭配时，汉语用“列入”更自然，并准确表达进入计数之列。
theological_decisions:
- issue: 对 אַל יִחַדְּ 的歧义处理
  choice: 正文译为“愿它不在一年的日子中欢欣”
  alternative: “愿它不与一年的日子相联（或归在一起）”
  rationale: 希伯来语动词在此用法罕见，可能表达欢欣，也可能表达联合或归入。两者均不涉及需要教义化解决的问题，因此正文保留诗性读法，脚注明确另一种历法性理解，不强行消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以三个“愿……不……”式诅咒分句保持原文节奏；“幽暗”“夺去”保留人格化意象。脚注标记[a]已置于相关歧义词之后。
