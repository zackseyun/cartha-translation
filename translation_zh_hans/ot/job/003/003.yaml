  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: zh_hans
  text: 愿我出生的那日灭亡；愿那宣告“怀了男胎[a]”的夜晚也灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“怀了一个男孩。”原文“男性”（גָבֶר）可泛指男性或男子；在受孕语境中，“男胎”是自然的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבַד
  choice: 愿……灭亡
  rationale: 以“愿”表达未完成式在此处的祈愿、咒诅语气，而不是简单的将来陈述。
- source_word: יוֹם אִוָּלֶד בּוֹ
  choice: 我出生的那日
  rationale: 自然表达“我在其中出生的日子”，并保留所指为约伯出生之日。
- source_word: וְהַלַּיְלָה אָמַר
  choice: 愿那宣告……的夜晚也灭亡
  rationale: 原文第二分句省略了“灭亡”，由平行结构补足；“宣告”保留夜晚被人格化、发出消息的意象。
- source_word: הֹרָה
  choice: 被怀上了
  rationale: 按语境理解为某个生命已经受孕，采用被动表达，避免把“夜晚”误解为怀孕者。
- source_word: גָבֶר
  choice: 男子
  rationale: 直接保留该词所强调的男性身份；在受孕语境中也可理解为“男孩”或“男婴”，故以脚注说明。
