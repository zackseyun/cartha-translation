base_translation:
  language: en
  yaml_path: translation/ot/job/003/012.yaml
  text: Why did knees receive me[a], and why breasts[b], that I should nurse?
translation:
  language: zh_hans
  text: 为什么有双膝[a]迎接我？为什么有乳房，让我吸奶[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “双膝”可能指新生儿出生后被接到人的膝上或怀中。
    reason: cultural_note
  - marker: b
    text: 或译“让我吮吸”或“让我吃奶”。原文动词指婴儿吸取乳汁。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 这是引出约伯哀叹的疑问副词；“为什么”直接、自然地保留了原文的质问语气。
- source_word: קִדְּמוּנִי
  choice: 接住我
  rationale: 该动词在这里有前来迎接、接纳之意；与“双膝”连用时，所描绘的是婴儿出生后被接到膝上。“接住我”既保留具体动作，也符合现代汉语表达。
- source_word: בִרְכָּיִם
  choice: 双膝
  rationale: 原文为表示身体成双部位的形式，直指“膝”；译作“双膝”保留具体意象，不直接改译为解释性的“怀中”或“膝上”。
- source_word: וּמַה
  choice: 为什么
  rationale: 字面可作“而什么”，但在与前半句平行的疑问结构中表达“为什么”；汉语重复“为什么”可清楚呈现其修辞平行。
- source_word: שָׁדַיִם
  choice: 乳房
  rationale: 采用原文明确的身体部位用语；不增添“母亲的”，以免加入原文未明说的限定。
- source_word: כִּי
  choice: 让
  rationale: 这里引出与“乳房”相关的目的或结果。汉语用“让我……”自然地表达这种关系，同时不必僵硬地直译为“以致”。
- source_word: אִינָק
  choice: 我吸奶
  rationale: 该词描述婴儿从乳房吸取乳汁。“吸奶”在现代汉语中清楚表明动作主体是婴儿，也避免把它误解为母亲哺乳。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的汉语，保留原文两次“为什么”的平行质问及“双膝”“乳房”的具体身体意象。用“接住”呈现出生时接纳婴儿的场景，用“吸奶”明确婴儿是动作主体。
