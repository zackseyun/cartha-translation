  text: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
translation:
  language: zh_hans
  text: 因为我所深深惧怕的，已经落在我身上[a]；我所恐惧的，也已经临到我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在此把“恐惧”这一名词与同根动词“我惧怕”连用，以加强语气；也可译作“因为我所惧怕的事已经临到我身上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明约伯为何不得安宁，保留其因果或解释作用。
- source_word: פַחַד פָּחַדְתִּי
  choice: 我所深深惧怕的
  rationale: 希伯来文以同根名词和动词构成强调。中文不宜生硬重复“惧怕我所惧怕的”，用“深深”自然表达加强语气，同时将名词性对象保留为“……的”。
- source_word: וַיֶּאֱתָיֵנִי
  choice: 已经临到我身上
  rationale: 表达灾祸来到并落在说话者身上，也与后半句较平实的“来到我这里”形成细微差别。
- source_word: וַאֲשֶׁר
  choice: 我所……的，也
  rationale: 用现代汉语关系结构引出第二个平行分句，“也”自然标示两句递进并列。
- source_word: יָגֹרְתִּי
  choice: 我所恐惧的
  rationale: גור在此表示害怕、恐惧；选“恐惧”与前句“惧怕”相应而不完全重复。
- source_word: יָבֹא לִי
  choice: 已经来到我这里
  rationale: 虽为未完成式，语境指已实现的灾难；“来到我这里”较贴近字面，并保留与前句“临到我身上”的变化。
