  yaml_path: translation/ot/job/003/010.yaml
  text: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
translation:
  language: zh_hans
  text: 因为那夜没有关闭孕育我的母腹的门[a]，也没有把患难[b]从我眼前隐藏起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孕育我的母腹”原文字面可译作“我的腹部”；按出生的语境，这里指孕育约伯的母腹。
    reason: lexical_alternative
  - marker: b
    text: “患难”也可译作“痛苦”、“劳苦”或“愁苦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出本节所述原因，承接约伯对那一夜的咒诅，保留明确的因果关系。
- source_word: סָגַר
  choice: 关闭
  rationale: 与“门”自然搭配，同时保留希伯来文具体的关闭意象。
- source_word: דַּלְתֵי
  choice: 门
  rationale: 直译该词，并保留把母腹入口比作门的诗性意象。
- source_word: בִטְנִי
  choice: 我母腹
  rationale: 该词可指腹部或母腹；此处谈论约伯的出生，译作“我母腹”能以自然中文表达“孕育我的母腹”，同时用脚注说明原文字面形式。
- source_word: וַיַּסְתֵּר
  choice: 也没有……遮住
  rationale: 前句的否定在语义上延续至此；“遮住”保留隐藏、使之不被看见的视觉意象。
- source_word: עָמָל
  choice: 患难
  rationale: 该词可涵盖劳苦、痛苦、祸患；“患难”在本段哀歌中宽泛而庄重，不把含义局限为劳动或内心悲伤。
- source_word: מֵעֵינָי
  choice: 从我眼前
  rationale: 自然表达“使我的眼睛看不见”，既保留原文视觉意象，也暗含不让约伯亲身经历患难之意。
theological_decisions:
- issue: 第三人称单数主语的指代
  choice: 明确译为“那夜”
  alternative: 省略主语，或译为“它”
  rationale: 动词为阳性单数，按上文最自然地回指约伯所咒诅的“那一夜”；中文若用“它”会显得生硬，明确为“那夜”使衔接清楚，并未消除实质性的神学张力。
- issue: “隐藏患难”的经验性含义
  choice: 保留视觉隐喻“把患难从我眼前遮住”
  alternative: 意译为“使我免受患难”
  rationale: 原文直接说从眼前隐藏，可能同时涉及不看见和不经历；正文不将其完全解释为免受患难，以保留诗句的含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“我母腹的门”保留原文的身体与出生意象；“从我眼前遮住”比解释性的“使我免受”更贴近原文，也保留其含义张力。
