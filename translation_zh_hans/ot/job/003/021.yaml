  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
translation:
  language: zh_hans
  text: 他们等候死亡[a]，死亡却不来；他们寻找死亡，如同挖掘隐藏的珍宝，甚至更为急切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“死亡却不在那里。”希伯来文直译为“而它不在”，意思是死亡没有出现或来到。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: 等候
  rationale: חכה的基本义是带着期待等候。上下文虽含强烈渴望，但译作“等候”更直接，也避免把欲望的意味过度明说。
- source_word: לַמָּוֶת
  choice: 死亡
  rationale: 介词ל加名词מָוֶת，表示等候的对象，即“死亡”。
- source_word: וְאֵינֶנּוּ
  choice: 死亡却不来
  rationale: 希伯来文直译为“而它不在”，阳性单数后缀回指“死亡”；按语境译作“不来”较自然，同时用脚注保留字面可能。
- source_word: וַיַּחְפְּרֻהוּ
  choice: 寻找死亡
  rationale: חפר本义为“挖掘”，此处以挖掘宝藏比喻竭力寻求死亡。正文采用自然的“寻找”，下半句的“挖掘”仍保留原文意象。
- source_word: מִמַּטְמוֹנִים
  choice: 胜过挖掘隐藏的珍宝
  rationale: מַטְמוֹן指隐藏或储藏的财宝；介词מִן在此表达比较。译文保留隐藏、挖掘与珍宝相连的生动图景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“等候死亡”保持原文克制的表达；后句以“寻找死亡，胜过挖掘隐藏的珍宝”兼顾汉语自然度和挖宝意象。
