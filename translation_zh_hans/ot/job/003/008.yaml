  text: Let those who curse days curse it, those ready to rouse Leviathan.
translation:
  language: zh_hans
  text: 愿那些咒诅日子、随时准备唤醒利维坦的人咒诅那夜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְּבֻהוּ
  choice: 愿……咒诅那夜
  rationale: 未完成式在本段咒诅愿望的语境中表达愿望；阳性单数后缀回指第6节所说的“那夜”。
- source_word: אֹרְרֵי יוֹם
  choice: 那些咒诅日子……的人
  rationale: 保留יוֹם无冠词的字面复数/类别性含义，不擅自改成特指“那日”。
- source_word: הָעֲתִידִים
  choice: 善于
  rationale: 该词表示已经准备好、能够承担某事；此处用“善于”自然表达这些人的本领，同时避免理解为单纯将来的动作。
- source_word: עֹרֵר
  choice: 唤醒
  rationale: 保留皮勒不定式“使醒来、激起”的强意，不将其弱化为一般性的“招惹”。
- source_word: לִוְיָתָן
  choice: 利维坦
  rationale: 采用音译以保留这一诗性形象的指称开放性，避免直接解释成某种具体动物或纯粹神话生物。
theological_decisions:
- issue: “利维坦”的身份
  choice: 保留专名“利维坦”
  alternative: 译作“海怪”或“鳄鱼”
  rationale: 本节本身没有明确界定其身份；音译可保留古代诗歌意象及其真实含混性，不导入特定神学或自然史解释。
- issue: 咒诅对象的回指
  choice: 译为“那夜”
  alternative: 译为“它”
  rationale: 希伯来语后缀为阳性，但语篇上最自然地回指第6节的“那夜”；中文若用“它”指夜不够自然，明示“那夜”可清楚衔接上下文而不改变所指。
translation_notes:
  register: 采用庄重而自然的现代汉语；以“愿”承接约伯诗体中的咒诅愿望。保留两组分词结构所描述的同一类人，并保留“利维坦”的诗性含混。
