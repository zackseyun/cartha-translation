  text: The small and the great are there[a], and the slave is free from his master.
translation:
  language: zh_hans
  text: 卑微的人和尊贵的人都在那里；奴隶[a]也脱离主人，得了自由。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”或译“仆人”。希伯来语עֶבֶד可指仆人或奴隶；这里因下文说他脱离主人、得了自由，正文采用“奴隶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹן
  choice: 卑微的人
  rationale: 与גָדוֹל相对，主要表示社会地位或身份低微，而非单指身材矮小或年幼。
- source_word: גָדוֹל
  choice: 尊贵的人
  rationale: 与קָטֹן形成对照，指地位高或显要的人；“尊贵的人”自然传达这种社会身份上的反差。
- source_word: שָׁם
  choice: 在那里
  rationale: 承接上文所描写的死亡之境，保留原文的指示意味，不在本节中另行明说其所指。
- source_word: הוּא
  choice: 都在那里
  rationale: 原文代词虽为单数形式，却承接前面的对举组合；汉语用“都”自然涵盖卑微者与尊贵者，但不额外加入“同样”等解释性措辞。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 该词可指仆人或奴隶；本句以脱离主人而自由为对照，凸显受主人支配的身份，因此正文采用“奴隶”。
- source_word: חָפְשִׁי
  choice: 得了自由
  rationale: 直接表达从受奴役状态中获得自由，并与“奴隶”形成鲜明对照。
- source_word: מֵאֲדֹנָיו
  choice: 脱离主人
  rationale: 介词מִן表示分离，אֲדֹן在此指奴隶的人间主人；“脱离主人”保留原文简洁的关系表述。
