base_translation:
  language: en
  yaml_path: translation/ot/job/003/011.yaml
  text: Why did I not die from the womb[b][a], and come out from the belly and expire?
translation:
  language: zh_hans
  text: 我为什么没有一出母腹就死去，没有一离开母胎就断气呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “母腹”和“母胎”对应希伯来文两个相关而不同的词；“断气”所译的动词也不同于前面的“死去”，可译作“气绝”或“咽气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 这是询问原因的常用疑问词；“为什么”自然地保留了约伯哀叹中的追问。
- source_word: מֵרֶחֶם
  choice: 一出母腹
  rationale: רֶחֶם指母腹、子宫；结合介词和死亡动词，译为“一出母腹”既保留具体出生意象，也符合现代汉语表达。
- source_word: אָמוּת
  choice: 就死去
  rationale: 未完成式第一人称单数在此表达对过去未发生之事的哀叹；“就死去”与“一出”组成自然的反事实问句。
- source_word: מִבֶּטֶן יָצָאתִי
  choice: 一离开母胎
  rationale: בֶּטֶן在此指孕育胎儿的腹中，与רֶחֶם平行而用词有别；יָצָאתִי直指“出来”，译作“离开”保留出生时从母体出来的具体图景。
- source_word: וְאֶגְוָע
  choice: 就断气
  rationale: גוע与前面的מות并非同一动词，常指气绝、咽气；“断气”既自然，又保留与“死去”的细微词义差别。
theological_decisions:
- issue: 约伯是否在表达主动求死
  choice: 保留为对出生时没有死亡的反事实哀问
  alternative: 译成现在主动寻死的愿望
  rationale: 本节语法回顾出生时本可发生却未发生的死亡，并非直接陈述当前采取自杀行动的意图；译文不额外作伦理或教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以两个平行的“没有一……就……”承接同一个“为什么”，保留希伯来诗句的并列结构、具体出生意象及两个死亡动词之间的差别；不将反事实哀问过度解释为抽象的“为何我没有夭折”。
