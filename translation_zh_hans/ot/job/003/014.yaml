  text: 同地上的君王和谋士一起——他们为自己建造废墟；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָכִים וְיֹעֲצֵי אָרֶץ
  choice: 地上的君王和谋士
  rationale: 按希伯来语直译，保留“地上”修饰君王和谋士这一自然理解。
- source_word: הַבֹּנִים חֳרָבוֹת לָמוֹ
  choice: 他们为自己建造废墟
  rationale: 保留原文“建造”与“废墟/荒场”之间刻意而含混的张力，不擅自解释为宫殿、陵墓或重建废城。
theological_decisions:
- issue: 君王和谋士所建之物的所指
  choice: 废墟
  alternative: 陵墓；荒废之地；重建的废城
  rationale: חֳרָבוֹת通常指废墟或荒废之处；本句具体意象存在争议，译文不以某种历史或神学解释替代原文。
translation_notes:
  register: 采用庄重而易懂的现代汉语。“一起”承接上文未完的句法；破折号呈现后置关系从句。以分号表示本节仍与后文并列延续。
