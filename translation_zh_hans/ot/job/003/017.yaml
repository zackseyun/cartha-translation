base_translation:
  language: en
  yaml_path: translation/ot/job/003/017.yaml
  text: There the wicked cease from turmoil[b][a], and there those weary in strength find rest.
translation:
  language: zh_hans
  text: 在那里，恶人不再骚动[a]；在那里，精疲力竭的人得享安息。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骚动”也可译作“躁动”“激愤”或“不安”。
    reason: lexical_alternative
  - marker: b
    text: “精疲力竭的人”原文直译为“力量疲乏的人”，即力气耗尽的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: 在那里
  rationale: 保留地点副词及其在上下两行中的重复，承接约伯哀歌所描述之地，并维持诗句的平行结构。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 这是现代汉语中自然、简洁的道德类别称谓，对应作名词用的形容词复数，不额外引入法律意义。
- source_word: חָדְלוּ
  choice: 不再
  rationale: 结合后面的名词 רֹגֶז 表达“停止、止息”的意思；用“不再搅扰”形成自然汉语，同时保留此处概括性的描述。
- source_word: רֹגֶז
  choice: 搅扰
  rationale: 该词可指骚动、不安、激愤或扰乱；在此与恶人连用，既可能是恶人自身的躁动，也可能是其造成的扰害。“搅扰”在汉语中自然，并避免只限定为愤怒。
- source_word: וְשָׁם
  choice: 在那里
  rationale: 重复地点表达以保留希伯来诗歌的平行与强调；分号已自然呈现连接关系，因此不必机械译出“并且”。
- source_word: יָנוּחוּ
  choice: 得享安息
  rationale: 表达“歇息、安顿下来”的含义，符合庄重的诗歌语体；“得享”只表示进入安歇，并不额外赋予救赎论含义。
- source_word: יְגִיעֵי כֹחַ
  choice: 精疲力竭的人
  rationale: 原文直译近于“力量疲乏的人”，指力气耗尽者。“精疲力竭的人”是清楚自然的现代汉语，并由脚注保留其字面结构。
theological_decisions:
- issue: 阴间中恶人“停止”的对象或状态
  choice: 译为“恶人不再搅扰”，保留既可指恶人停止造成扰害、也可关联其躁动止息的语义空间。
  alternative: “恶人止息躁动”或“恶人不再作恶扰人”
  rationale: רֹגֶז 的语义范围包括骚动、不安、激愤和扰乱；上下文描绘死亡之地的共同安歇，不宜把它明确化为悔改、刑罚终止或其他教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。两次保留“在那里”以呈现原文平行；“不再搅扰”与“得享安息”形成清晰对照。所有脚注标记均置于正文相应表达之后。
