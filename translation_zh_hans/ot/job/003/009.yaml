base_translation:
  language: en
  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: zh_hans
  text: 愿它暮色中的星辰昏暗[a]；愿它等候光明，却没有光明；愿它看不见黎明的眼睑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“愿它黄昏时的星辰昏暗”。原文这个词可指暮色，尤其是傍晚的暮色。
    reason: lexical_alternative
  - marker: b
    text: “黎明的眼睑”是希伯来诗歌的形象说法，指清晨最初显现的光。
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: 都昏暗
  rationale: 此处未完成式在咒诅语境中表达愿望；“愿……都昏暗”自然保留祈愿兼咒诅的语气。
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: 它暮色中的星辰
  rationale: 构造短语直译为“它暮色的星辰”；汉语用“暮色中的星辰”更自然，也保留所属后缀和傍晚微光的含义。
- source_word: יְקַו לְאוֹר
  choice: 愿它等候光明
  rationale: קוה 可指“等候”或“盼望”；这里采用“等候”，既体现期待，又不把拟人化心理解释得过深。
- source_word: וָאַיִן
  choice: 却等不到
  rationale: 原文简练地说“却没有”；按汉语表达补出与前句呼应的“等不到”，传达期待落空，同时不改变所等候的是光明。
- source_word: וְאַל יִרְאֶה
  choice: 愿它看不见
  rationale: אַל 加未完成式构成否定祈愿，译法保留咒诅中的愿望语气。
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: 黎明的眼睑
  rationale: 保留希伯来诗歌中“眼睑”这一鲜明隐喻，不直接释作“第一线晨光”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；以三个“愿”保留本节连续咒诅祈愿的节奏，并保留“黎明的眼睑”这一源语意象。
