    rationale: שׁקט 指安静、安宁、平静；“安静安稳”比“安静无声”更能表达不受扰动的状态，且不把词义限于没有声音。
  revised_text: 因为如今我早已躺下，安静安稳[a]；我早已睡去，便得享安息[b]。
