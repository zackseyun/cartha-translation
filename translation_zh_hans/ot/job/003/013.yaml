  text: כִּֽי עַ֭תָּה שָׁכַ֣בְתִּי וְ/אֶשְׁק֑וֹט יָ֝שַׁ֗נְתִּי אָ֤ז יָנ֬וּחַֽ לִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/013.yaml
  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: zh_hans
  text: 因为如今我早已躺下，安静安稳[a]；我早已睡去，便得享安息[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安静安稳”或译“安静无声”“平静安宁”。
    reason: lexical_alternative
  - marker: b
    text: “便得享安息”直译可作“那时我便有安息”或“那时安息就归我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文约伯宁愿未曾存活的愿望，引出原因或结果说明；现代汉语用“因为”自然保留解释性关联。
- source_word: עַתָּה
  choice: 现在早已
  rationale: “现在”指假设自己出生时便死去之后的当前处境；与“早已”配合，清楚表达希伯来语动词在语境中的反事实结果。
- source_word: שָׁכַבְתִּי
  choice: 我早已躺下
  rationale: 保留“躺下”的身体意象，不直接释为死亡；“早已”使汉语自然呈现过去反事实。
- source_word: וְאֶשְׁקֹט
  choice: 安静无声
  rationale: שׁקט表示不受搅扰的安静、平静；“安静无声”贴近基本词义，也与后文“安息”有所区别。
- source_word: יָשַׁנְתִּי
  choice: 我早已睡去
  rationale: 保留原文普通的“睡”这一死亡隐喻，不明说“死去”，以维持诗意及神学张力。
- source_word: אָז
  choice: 那时
  rationale: 标示诗句中随后的结果，与“现在早已”构成自然的反事实叙述。
- source_word: יָנוּחַ לִי
  choice: 我就得享安息
  rationale: נוּחַ与לִי字面可理解为“我便有安息”；“得享安息”是自然、庄重的汉语，同时保留休憩状态而不加入死后状态的教义解释。
theological_decisions:
- issue: 以躺下、睡去和安息描写死亡
  choice: 保留躺下、睡去和安息的字面诗歌意象，不直接改译为死亡。
  alternative: 明确译作“死去”或扩展为“在死亡中安息”。
  rationale: 本节确实在语境中描绘死亡所带来的宁静，但原文刻意使用日常的睡眠和休息用语。保留这些意象可避免对死者状态作超出经文的教义断言。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“早已”呈现上下文中的反事实语气；分号保留两组平行诗句。“安静无声”“睡去”“安息”依次呈现原文的意象推进，并避免把诗歌语言教义化。
