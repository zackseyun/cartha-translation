revisions:
- from: 因为那样，我现在早已躺下，安静无声[a]；我早已睡去，那时我就得享安息[b]。
  to: 因为如今我早已躺下，安静安稳[a]；我早已睡去，便得享安息[b]。
  rationale: 将“那样”改为“如今”，准确反映 עַתָּה 的时间意义；保留“因为”所表达的承接上文的解释关系。“早已”结合前文约伯对未曾出生／早死的愿望，表达原文动词在此的反事实结果，无须在本节补入“若我死了”等未明说的条件。以“安静安稳—睡去—安息”保留原文递进和平行的死亡意象。
