  text: הַ/יּ֥וֹם הַ/ה֗וּא יְֽהִ֫י חֹ֥שֶׁךְ אַֽל יִדְרְשֵׁ֣/הוּ אֱל֣וֹהַּ מִ/מָּ֑עַל וְ/אַל תּוֹפַ֖ע עָלָ֣י/ו נְהָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
translation:
  language: zh_hans
  text: 愿那日成为黑暗；愿神从上面不眷顾它[a]，愿亮光[b]不照在它上面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寻找它”或“查问它”；原文动词可指寻找、查问，在此语境中也可表示留意或眷顾。
    reason: lexical_alternative
  - marker: b
    text: 或译“光辉”或“明亮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַהוּא
  choice: 那日
  rationale: 指约伯出生的那一天；“那日”简洁自然，也保留诗歌语体。
- source_word: יְהִי
  choice: 愿……成为
  rationale: 未完成式在此表达祈愿或咒愿；“愿”准确传达这种意愿语气。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 按名词译出黑暗这一状态，并与后半句的光辉形成鲜明对照。
- source_word: יִדְרְשֵׁהוּ
  choice: 寻察它
  rationale: דרש可表示寻找、查问或关注；“寻察”既保留主动寻找的意象，也容纳留意、眷顾的语境含义。
- source_word: אֱלוֹהַּ
  choice: 神
  rationale: 这是《约伯记》中常见的单数诗体称谓，直接译为“神”，不增添原文没有的称号。
- source_word: מִמָּעַל
  choice: 在上的
  rationale: 保留空间方位，并自然地修饰“神”。
- source_word: תּוֹפַע
  choice: 照
  rationale: 该动词表示发光、照耀；与“光辉”搭配时，“照在其上”自然凝练。
- source_word: נְהָרָה
  choice: 光辉
  rationale: 该名词表示亮光、明辉；“光辉”保留其亮度意味和诗性，也不把含义限定为日光。
- source_word: עָלָיו
  choice: 在其上
  rationale: 代词回指“那日”；这一表达保留原文光照临到那日的空间意象。
theological_decisions:
- issue: 咒愿式哀歌中直接提到神
  choice: 保留“在上的神”
  alternative: 天上／天上的神
  rationale: 原文明说“神”，并带有“从上面、在上”的空间表达。直译保留约伯哀歌大胆而紧张的措辞，不将其弱化为非人格化的说法。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。两个“愿”维持希伯来文连续咒愿的节奏；“寻察”刻意保留原词在“寻找”与“关注、顾念”之间的语义张力。
