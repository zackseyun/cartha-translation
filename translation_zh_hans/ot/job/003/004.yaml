revisions:
- from: 愿那日成为黑暗；愿在上的神不寻察它[a]，愿光辉[b]不照在其上。
  to: 愿那日成为黑暗；愿神从上面不眷顾它[a]，愿亮光[b]不照在它上面。
  rationale: 修订以“眷顾”更自然地表达此处“神不留意、不顾念那日”的语境含义，同时在脚注保留“寻找／查问”的词汇可能性。将“在上的神”调整为“神从上面”，更准确自然地体现מִמָּעַל；将“光辉”改为“亮光”，使其与“照”搭配更顺畅，并减少“荣耀”义联想。
