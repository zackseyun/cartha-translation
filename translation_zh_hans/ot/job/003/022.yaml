  text: who rejoice exceedingly[c][b][a], who exult when they find the grave—
translation:
  language: zh_hans
  text: 他们欢喜至极[a]，找到坟墓时[b]就欢腾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欢喜到欢腾的地步。”希伯来语这个短语在此加强欢喜的程度。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为找到了坟墓。”这里的希伯来语连接词既可表示时间，也可表示原因。
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: 他们欢喜
  rationale: 带冠词的分词作名词性用法，承接上一节所说的那些人；译成“他们欢喜”符合现代汉语诗句的自然表达。
- source_word: אֱלֵי גִיל
  choice: 至极
  rationale: 原短语字面近于“达到欢腾”，在此用作程度强化语；“至极”既简洁，又保留强烈程度。
- source_word: יָשִׂישׂוּ
  choice: 欣喜雀跃
  rationale: 该动词与前面的“欢喜”语义相近，却进一步加强喜悦；“欣喜雀跃”保留诗句递进和高昂情绪。
- source_word: כִּי
  choice: ……时
  rationale: 这里可表示引发欢腾的情境或原因；正文采用时间性的“时”，同时以脚注保留因果读法。
- source_word: יִמְצְאוּ
  choice: 找到
  rationale: 直接而自然地表达 מצא，保留原文简洁有力的措辞。
- source_word: קָבֶר
  choice: 坟墓
  rationale: קָבֶר 指坟墓或墓穴；这里不强加定指或不定指，以汉语无冠词形式保留原文在具体坟墓与死亡归宿之间的开放性。
theological_decisions:
- issue: 找到坟墓是欢腾发生的时间还是原因
  choice: 正文译作“找到坟墓时”
  alternative: “因为找到坟墓”
  rationale: כִּי 在此既可按时间情境理解，也可按原因理解。正文采用较符合诗句推进的时间表达，脚注明示因果可能，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以“欢喜至极／欣喜雀跃”呈现两个近义喜乐词形成的强化；“坟墓”不加量词或指示语，以保留希伯来语在“一座坟墓”与作为死亡归宿的“坟墓”之间的含混。
