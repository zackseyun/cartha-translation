  text: הִנֵּ֤ה הַ/לַּ֣יְלָה הַ֭/הוּא יְהִ֣י גַלְמ֑וּד אַל תָּבֹ֖א רְנָנָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/007.yaml
  text: Look, may that night be barren; let no joyful cry enter it.
translation:
  language: zh_hans
  text: 看哪，愿那一夜荒寂；愿欢呼声不进入其中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、加强咒愿语气的提示词，同时采用现代汉语中庄重而易懂的表达。
- source_word: גַלְמוּד
  choice: 荒寂
  rationale: 该词可指孤单、荒凉或不生育；用于“夜”时，“荒寂”既表现空无、孤绝，也隐含没有新生命诞生的语境，不把多重意涵缩减为单一解释。
- source_word: רְנָנָה
  choice: 欢呼声
  rationale: 原词表示喜乐的呼喊或歌唱；“欢呼声”自然地涵盖喜庆呼声，并与约伯诅咒自己出生之夜的语境相合。
- source_word: תָּבוֹא ... בּוֹ
  choice: 进入其中
  rationale: 依照原文“来到/进入其中”的空间化说法，把那一夜拟作欢呼不能进入的领域。
theological_decisions:
- issue: “荒寂”是否应明确解释为“不生育”
  choice: 保留“荒寂”的复合意涵
  alternative: 译作“不生育”或“没有生育”
  rationale: 本节以诗歌拟人方式咒诅那一夜。原词兼有孤绝、荒凉及不生育的联想，正文不宜只锁定生育层面的解释。
- issue: “欢呼声”所指是否限定为婴儿出生时的庆贺
  choice: 不在正文中限定具体来源
  alternative: 译作“报喜的欢呼声”或“因生产而有的欢呼”
  rationale: 出生语境使这种理解很可能成立，但原文只说喜乐的呼声；保留其开放性更忠于诗句。
translation_notes:
  register: 采用庄重、凝练的现代标准汉语，保持希伯来诗歌的两分结构与咒愿语气；“看哪”加强情绪转折，“荒寂”与“欢呼声”形成鲜明对照。
