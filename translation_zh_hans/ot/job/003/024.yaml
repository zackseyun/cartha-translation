  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
translation:
  language: zh_hans
  text: '因为我的叹息先于我的饭食[a]而来；

    我的哀号[b]如水倾泻而出。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的饼”；希伯来语“饼”也可泛指人所吃的食物。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的吼叫”；希伯来语原词可使人联想到野兽般响亮的吼声，强化约伯痛苦的程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在上下文中引出对约伯痛苦处境的说明；“因为”自然保留其解释作用。
- source_word: לִפְנֵי
  choice: 先于……而来
  rationale: 保留“在……之前”的基本关系及诗歌意象，不将其进一步解释为叹息取代食物。
- source_word: לַחְמִי
  choice: 我的饭食
  rationale: לֶחֶם字面为“饼”，也常泛指食物；“饭食”在现代汉语中自然，并保留具体进食语境。脚注列出更贴近字面的译法。
- source_word: אַנְחָתִי
  choice: 我的叹息
  rationale: 该词表示因痛苦而发出的叹息或呻吟；“叹息”与下句更强烈的哀号形成层次。
- source_word: תָבֹא
  choice: 而来
  rationale: 忠实表达בוא“来、来到”的常用意义，并与“先于”构成自然的中文诗句。
- source_word: וַיִּתְּכוּ
  choice: 倾泻而出
  rationale: נתך在此描写液体般倾倒、流出；“倾泻而出”与“如水”搭配，呈现无法遏止的强烈意象。
- source_word: כַמַּיִם
  choice: 如水
  rationale: 直接保留原文的明喻。
- source_word: שַׁאֲגֹתָי
  choice: 我的哀号
  rationale: שׁאג可指狮兽般的吼叫或响亮呼号；“哀号”既符合人的痛苦表达，也保留强烈声音，字面色彩以脚注说明。
