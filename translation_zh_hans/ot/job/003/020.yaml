base_translation:
  language: en
  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: zh_hans
  text: 为什么光[b]要赐给困苦的人[a]，生命要赐给心中愁苦的人？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为什么他把光赐给困苦的人，把生命赐给心中愁苦的人？”希伯来文没有明说赐予者，尽管上下文很可能暗指上帝。
    reason: alternative_reading
  - marker: b
    text: “光”是继续生存的诗歌意象；第一小句的希伯来文保留了这个比喻，没有直接说“生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接表达哀歌中追问缘由的语气，简洁而有力度。
- source_word: יִתֵּן
  choice: 有……赐给
  rationale: 希伯来文动词为第三人称阳性单数，但没有明说主语。采用汉语被动意味的结构，既表达生命乃被赐予，又不把赐予者直接写成上帝。
- source_word: לְעָמֵל
  choice: 给困苦的人
  rationale: עָמֵל在此指身陷痛苦、患难的人，并非普通意义上的劳作者；“困苦的人”自然、庄重，也保留词义的宽度。
- source_word: אוֹר
  choice: 光
  rationale: 保留原文的诗歌意象；在上下文中，“光”暗指继续生存或经历人生，但不在正文中将比喻改写为解释。
- source_word: וְחַיִּים
  choice: 有生命
  rationale: חַיִּים虽为复数形式，通常表达整体意义上的“生命”；此处与“光”构成平行。
- source_word: לְמָרֵי נָפֶשׁ
  choice: 给心里愁苦的人
  rationale: 原短语直指内在生命处于苦涩、痛苦中的人。“心里愁苦”是现代汉语中自然且有尊严的表达，同时保留深切的内在痛苦。
theological_decisions:
- issue: יִתֵּן所暗含的主语
  choice: 用“有……赐给”的结构，不明说赐予者
  alternative: 译作“他为什么把光赐给……”或“上帝为什么把光赐给……”
  rationale: 上下文很可能暗指上帝，但本节希伯来文没有点明主语。不明说赐予者，可保留约伯申诉中的修辞张力，也避免使指控比原文更为明确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有光赐给”略带诗体色彩，用来保留无明确施事者的结构；两小句保持平行，并保留“光”与“生命”的原文意象关系。
