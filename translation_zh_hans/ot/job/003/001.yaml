  text: אַחֲרֵי כֵ֗ן פָּתַ֤ח אִיּוֹב֙ אֶת פִּ֔י/הוּ וַ/יְקַלֵּ֖ל אֶת יוֹמֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/003/001.yaml
  text: After this[a], Job opened his mouth and cursed his day.
translation:
  language: zh_hans
  text: 此后，约伯开口，诅咒自己的那一日[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己出生的那一日。”希伯来文直译为“他的日子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: 此后
  rationale: 这是常见的时间承接语，表示“这事以后”。“此后”简洁自然，也保留叙事顺序。
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: 开口
  rationale: 原文直译为“张开他的口”，是引出郑重发言的希伯来语表达。“开口”既保留其修辞意味，又符合现代汉语习惯。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיְקַלֵּל
  choice: 诅咒
  rationale: 此处Piel词形表达“诅咒”；不宜弱化为“抱怨”或“斥责”，因为原文刻意以强烈措辞引出约伯的哀歌。
- source_word: אֶת יוֹמוֹ
  choice: 自己的日子
  rationale: 原文简洁地说“他的日子”。汉语用“自己的日子”可清楚回指约伯，同时保留原文未在本节明说“出生”的措辞；下文会阐明所指。
theological_decisions:
- issue: 是否在正文中明确“他的日子”是约伯出生的日子
  choice: 正文保留简洁表达“自己的日子”
  alternative: 译作“自己出生的日子”或“自己的生日”
  rationale: 本节希伯来文没有明说“出生”，尽管下文清楚表明其含义。保留原文的简洁和展开次序，避免把上下文解释直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“开口”保留原文引出郑重言说的惯用表达；“诅咒”忠实呈现动词的强烈语气。
