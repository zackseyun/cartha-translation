  text: to a man whose way is hidden[b][a], and whom God has hedged in?
translation:
  language: zh_hans
  text: 给那道路被遮蔽、又被上帝围住的人呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֶבֶר
  choice: 给……的人
  rationale: לְ承接第20节“为何赐光”的反问，表示光所给的对象；גֶבֶר为阳性单数，故译作“人”，并以中文关系结构自然表达。
- source_word: אֲשֶׁר דַּרְכּוֹ
  choice: 那道路……的人
  rationale: אֲשֶׁר引出关系从句，דַּרְכּוֹ直译为“他的道路”；中文用“那道路……的人”既简洁，也保留“道路”可指人生道路或处境方向的比喻。
- source_word: נִסְתָּרָה
  choice: 隐蔽
  rationale: Nifal形式表达被隐藏或处于隐而不显的状态。“隐蔽”保留其被动状态及道路为何人所隐藏的含混性，不擅自说明是本人看不见还是一般不为人知。
- source_word: וַיָּסֶךְ
  choice: 又……围困
  rationale: 该动词表示围住、阻隔或封闭；“围困”自然传达行动造成的受限处境。“又”体现希伯来文连接词וַ。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的单数诗体神称，直接译为“上帝”，不加入原文没有的“全能者”等称号。
- source_word: בַּעֲדוֹ
  choice: 被……围困
  rationale: בְּעַד与该动词连用，表示在他周围形成阻隔；中文以被动式呈现其受围困，同时明确保留上帝为施事者。
theological_decisions:
- issue: 困境或封闭的施事者
  choice: 明确译出“被上帝围困”
  alternative: 采用不说明施事者的表达，如“陷入围困”
  rationale: 原文明说אֱלוֹהַּ为动词主语，因此应保留约伯哀诉中上帝主动围住此人的张力，不以非人格化表达弱化神的施事。
- issue: “道路隐蔽”的指向
  choice: 保留“道路隐蔽”的含混表达
  alternative: 解释为“看不见自己前路”或“人生道路被上帝隐藏”
  rationale: 原文没有明说道路向谁隐藏，也没有明确把隐藏道路与上帝直接连为施受关系；译文不替原文消解这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并保留本节承接第20节的反问语气。以“道路”保存希伯来文的核心隐喻；“围困”呈现受阻和被封闭的意象。
