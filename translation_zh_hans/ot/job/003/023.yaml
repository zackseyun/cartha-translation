  terminology: “上帝”适当地对应אֱלוֹהַּ；“道路”保留דֶּרֶךְ既可指道路、也可暗示人生进程的开放隐喻。以“围住”对应סכך及בַּעֲדוֹ，避免将其过度限定为军事性的“围困”。
