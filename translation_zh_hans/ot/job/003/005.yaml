base_translation:
  language: en
  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: zh_hans
  text: 愿黑暗和浓重的幽暗[a]将那日收回；愿云彩停驻其上；愿白昼的昏黑[b]使那日惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “浓重的幽暗”所译的词也可译作“死荫”或“幽暗”。
    reason: lexical_alternative
  - marker: b
    text: “白昼的昏黑”原文含义较难确定，也可能指“白昼的黑暗”“日食”，较不可能指“白昼的苦楚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: 将那日收回
  rationale: גאל本有亲属赎回、收回归己之意；在咒诅语境中译作“收回”，既保留反常而有力的拟人意象，也避免“救赎”的正面神学联想。以“那日”明确代词所指。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 对应通常意义的黑暗，并承接约伯要抹去自己出生之日的愿望。
- source_word: צַלְמָוֶת
  choice: 幽冥
  rationale: 此词可指“死荫”或浓重幽暗；“幽冥”在诗体中凝聚深暗及死亡阴影的意象，同时在脚注保留其他理解。
- source_word: תִּשְׁכָּן עָלָיו עֲנָנָה
  choice: 愿密云笼罩它
  rationale: שׁכן表示居住、停驻；中文“笼罩”自然呈现云停驻其上的持续景象。“密云”比单说“一朵云”更符合此处阴暗、压迫的集合意象。
- source_word: יְבַעֲתֻהוּ
  choice: 使它惊恐
  rationale: בעת的加强词干表示使之恐惧、惊骇；译文保留原诗将“日”人格化的表达。
- source_word: כִּמְרִירֵי יוֹם
  choice: 白昼的昏黑
  rationale: 这是疑难短语，语境较支持黑暗、昏暗之义。中文不生硬复制希伯来语复数，但保留其悖反意象：本应明亮的白昼被昏黑侵袭。其他可能解释列入脚注。
