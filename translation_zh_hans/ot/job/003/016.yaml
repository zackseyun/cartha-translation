  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
translation:
  language: zh_hans
  text: 或像被藏起的流产胎儿一样，我也就不会存在；又像从未见过光[b]的婴孩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “见光”是希伯来语的表达，指来到世上并经历今生。
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: 不然
  rationale: 承接约伯此前所说的另一种可能情形；“不然”在现代汉语中自然地引出替代设想。
- source_word: כְ/נֵ֣פֶל
  choice: 像……流产胎儿
  rationale: נֵפֶל可指流产之胎，也可能涵盖死产的婴儿；正文采用简明直接的“流产胎儿”，并以脚注保留词义范围。
- source_word: טָ֭מוּן
  choice: 被隐藏的
  rationale: 该词是טמן的被动分词，基本义为“被藏起、被隐藏”；译文不将其限定解释为“被埋葬的”。
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: 不复存在
  rationale: 直译为“我就不会是／存在”；“不复存在”在此清楚表达约伯设想自己未曾进入世上生命的意思。
- source_word: כְ֝/עֹלְלִ֗ים
  choice: 又像……婴孩
  rationale: עֹלְלִים指年幼的孩子或婴儿；结合未曾见光的语境，译作“婴孩”贴切而庄重。
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: 从未见过光
  rationale: 保留希伯来文“见光”的意象，同时用“从未”自然表达否定的既往经历。
