  naturalness: “被隐藏的流产胎儿”虽可直译，但“被藏起的”在现代汉语中更自然，同时不把 טָמוּן 限定为“埋葬”。调整语序后，句子仍保留诗歌式平行和“见光”的意象。
  terminology: 保留“流产胎儿”，并在脚注中保留“死产婴儿”的词义可能。“婴孩”和“见光”均恰当地对应 עֹלְלִים 与“见光”的原文意象。脚注 b 改置于“见过光”之后，使锚点与注释内容一致。
