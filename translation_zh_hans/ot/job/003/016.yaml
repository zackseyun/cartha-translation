  to: 或像被藏起的流产胎儿一样，我也就不会存在；又像从未见过光[b]的婴孩。
  rationale: 将开头的“不然”改为“或”，以准确反映原文的列举连接词；将“被隐藏的”改为较自然的“被藏起的”，但仍保留“隐藏/遮蔽”而非“埋葬”的歧义。以“我也就不会存在”明确表达原文的反事实非存在，避免“不复存在”可能带出的先存在后消失之意。脚注 b 的锚点移至“见过光”后。
