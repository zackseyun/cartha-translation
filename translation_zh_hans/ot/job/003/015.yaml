  text: or with princes who had gold[b][a], who filled their houses with silver—
translation:
  language: zh_hans
  text: '或与拥有黄金的王公[a]同在，

    他们把自己的房屋[b]装满了白银——'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王公”也可译作“贵族”或“统治者”（שָׂרִים）。
    reason: lexical_alternative
  - marker: b
    text: 原文是“房屋”；按王公的身份，也可理解为“宫殿”，但这比原文更具体。
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: 或
  rationale: 承接3:13–16一连串未能实现的设想，以简洁的并列连词保留诗歌推进。
- source_word: עִם
  choice: 与……同在
  rationale: 表示约伯设想自己在死亡中与那些显贵相伴；此译自然表达关联关系。
- source_word: שָׂרִים
  choice: 王公
  rationale: 指身居高位的领袖或显贵；“王公”符合诗体的庄重语域，同时脚注保留“贵族、统治者”等可能译法。
- source_word: זָהָב לָהֶם
  choice: 拥有黄金
  rationale: 希伯来语直译近于“有黄金归他们”，这里是表达占有财富；译作“拥有黄金”自然且不改变意象。
- source_word: הַֽמְמַלְאִ֖ים
  choice: 他们把……装满了
  rationale: 分词在此继续描述前面的王公；结合上下文，以完成性的过去情景表达这些已故显贵生前的财富。
- source_word: בָּתֵּי/הֶם
  choice: 自己的房屋
  rationale: 保留基本词义“房屋”；“自己的”清楚表达第三人称复数所属关系，而不擅自具体化为“宫殿”。
- source_word: כָּֽסֶף
  choice: 白银
  rationale: 财富意象中指贵金属银；“白银”较“钱财”更能保留具体而诗性的画面。
