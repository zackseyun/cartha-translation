  source_fidelity: “不再听见”加入了原文及英文审校轨迹未明示的时间性变化（‘不再’）。希伯来文否定完成式在此诗歌语境可自然表达持续状态，即‘听不见／不听见’，但不必断言此前曾听见、如今不再听见。其余主要对应关系恰当：יַחַד为“一同”，אֲסִירִים为“被囚的人”，שַׁאֲנָנוּ为“安然”，נֹגֵשׂ以“监工”表达具体催逼劳役者，并以脚注保留较宽释义。
