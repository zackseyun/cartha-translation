  yaml_path: translation/ot/job/003/018.yaml
  text: There the prisoners are at ease together[a]; they do not hear the voice of the taskmaster.
translation:
  language: zh_hans
  text: 在那里，被囚的人一同安然；听不见监工[a]的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “监工”或译“压迫者”或“催逼者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: 一同
  rationale: 作副词修饰被囚之人的状态，表达他们共同处于安宁、不受搅扰的境况。
- source_word: אֲסִירִים
  choice: 被囚的人
  rationale: 既准确表达受拘禁者，也比名词“囚犯”稍宽，可涵盖俘虏或遭捆绑的人。
- source_word: שַׁאֲנָנוּ
  choice: 安然
  rationale: 表达安静、安稳、不受搅扰的状态，又不把词义强化为完全的安息。
- source_word: לֹא שָׁמְעוּ
  choice: 不再听见
  rationale: 原文完成式在诗歌语境中描述死者持续所得的结果状态；“不再”自然表达他们已脱离生前催逼的处境。
- source_word: קוֹל
  choice: 声音
  rationale: 保留原词的一般意义，并指向催逼者发出的命令或吆喝。
- source_word: נֹגֵשׂ
  choice: 监工
  rationale: 该词指催逼劳役或强索款项的人；“监工”在本节受压迫的语境中具体自然，同时以脚注保留较宽的译法。
