  terminology: “被囚的人”避免将אֲסִירִים过度限定为刑事意义的“囚犯”，处理得当。“监工”可表达具体的劳役督逼者；脚注列出“压迫者”“催逼者”，恰当地保留נֹגֵשׂ可指压迫者或强索者的词义范围。
