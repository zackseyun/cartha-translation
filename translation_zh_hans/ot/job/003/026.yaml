  yaml_path: translation/ot/job/003/026.yaml
  text: I was not at ease[a], and I was not quiet; I was not at rest[b], and turmoil came.
translation:
  language: zh_hans
  text: 我没有安宁[a]，也没有平静；我没有安息，动荡来了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不得安逸……不得安静……不能安歇。”希伯来文连续使用三个意义相近的动词，加强约伯毫无舒缓的感受。
    reason: lexical_alternative
  - marker: b
    text: “动荡”也可译作“患难”“骚动”或“不安”。原词可指扰乱、不安或震荡。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: 我有安宁（与 לֹא 合为“我没有安宁”）
  rationale: 该词表示安逸、安宁或不受搅扰的状态。“安宁”自然庄重，并保留内在平安与外在安稳之间的语义空间。
- source_word: שָׁקַטְתִּי
  choice: 我有平静（与 לֹא 合为“也没有平静”）
  rationale: שׁקט 表示安静、平静或免受搅扰。“平静”与“安宁”相近而不完全重复，能体现原文近义平行的加强效果。
- source_word: נָחְתִּי
  choice: 我有安息（与 לֹא 合为“我没有安息”）
  rationale: נוח 表示休息、安歇或安顿下来。“安息”适合本节庄重的哀歌语体，也保留三重否定的递进节奏。
- source_word: רֹגֶז
  choice: 动荡
  rationale: רֹגֶז 可指骚动、不安、震颤或患难。“动荡”既可涵盖内心不安，也可指处境中的扰乱，避免把意义过早限定为愤怒或一般性的灾祸。
- source_word: וַיָּבֹא
  choice: 却来了
  rationale: 动词直指 רֹגֶז 的来到；中文用“来了”不增添原文未明说的宾语。“却”显出前三个否定状态与随后动荡来到之间的反差。
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: 我没有……也没有……；我没有……
  rationale: 重复“没有”保留希伯来文三重否定的强调和节奏，不把三个近义分句压缩为一句。
theological_decisions:
- issue: רֹגֶז 所指的是内在不安、外在患难，还是两者兼有
  choice: 译作“动荡”，不限定其范围
  alternative: 患难／骚动／不安
  rationale: 上下文容许该词同时唤起处境受扰和内心震荡；采用较宽的译词可保存原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。以三次“没有”再现原文的重复强调；“安宁—平静—安息”保持近义平行，同时避免三个分句完全同义。
