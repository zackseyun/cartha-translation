  yaml_path: translation/ot/job/028/016.yaml
  text: It cannot be valued with the gold of Ophir[b][a], with precious onyx or sapphire.
translation:
  language: zh_hans
  text: 它无法用俄斐的精金估价，也无法用珍贵的红玛瑙[a]或蓝宝石[b]估价。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红玛瑙”所译的希伯来语宝石名称无法确切考定，也可能指“绿柱石”。
    reason: lexical_alternative
  - marker: b
    text: “蓝宝石”也可能指“青金石”，因为古代的矿物分类与现代不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְסֻלֶּה
  choice: 衡量……的价值
  rationale: 该词在此处以贵重物品为语境，表达估价或衡量价值的意思。此译法既保留“衡量”的意象，又自然传达智慧无法用财富估价。
- source_word: בְּכֶתֶם אוֹפִיר
  choice: 用俄斐的精金
  rationale: כֶּתֶם指精炼的上等黄金，אוֹפִיר标明其著名产地；介词ב在估价语境中自然译为“用”。
- source_word: שֹׁהַם
  choice: 红玛瑙
  rationale: 这种宝石的确切种类无法确定；正文采用常见的传统译名，并以脚注保留另一可能。
- source_word: יָקָר
  choice: 珍贵的
  rationale: 该形容词修饰宝石，突出其贵重，符合现代汉语的宝石用语和诗体语域。
- source_word: סַפִּיר
  choice: 蓝宝石
  rationale: 采用读者熟悉的传统译名，同时以脚注说明古代所指可能是青金石。
theological_decisions: []
