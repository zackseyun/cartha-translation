  yaml_path: translation/ot/job/028/014.yaml
  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
translation:
  language: zh_hans
  text: 深渊说：“智慧不在我里面。”海洋说：“智慧不在我这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהוֹם
  choice: 深渊
  rationale: 该词指巨大的深水或深处；“深渊”简洁庄重，并与下句“海洋”构成诗意对应。
- source_word: אָמַר
  choice: 说
  rationale: 虽为完成式，诗歌语境中表达鲜活、恒常的宣告；现代汉语用“说”自然贴切。
- source_word: לֹא בִי הִיא
  choice: 智慧不在我里面
  rationale: 阴性代词הִיא回指上下文中的“智慧”。汉语代词不标语法性别，直接复现“智慧”可避免指代含混，同时保留בִי“在我里面”的空间意象。
- source_word: יָם
  choice: 海洋
  rationale: יָם是普通的“海”；此处用“海洋”自然庄重，也与“深渊”相称。
- source_word: אֵין עִמָּדִי
  choice: 智慧不在我这里
  rationale: 该短语表示不与说话者同在，也可含没有、并不拥有之意。“不在我这里”保留同在与所在的形象，又比重复“里面”更准确反映两个希伯来介词的差别。
theological_decisions:
- issue: 阴性代词הִיא的所指
  choice: 在两句中明确译为“智慧”
  alternative: 译作“它”或“她”
  rationale: 上下文（伯28:12、20）表明所寻求的是智慧。现代汉语以“它”指智慧略显生硬，以“她”则可能制造原文没有的生物性别联想；复现名词既清楚，又保留智慧被拟人化、能够被深渊和海洋谈论的诗歌语境。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。保留“深渊—海洋”的平行结构，并以“我里面—我这里”体现בִי与עִמָּדִי的差异。由于正文直接点明代词所指，无须脚注。
