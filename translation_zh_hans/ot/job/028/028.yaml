  text: וַ/יֹּ֤אמֶר לָֽ/אָדָ֗ם הֵ֤ן יִרְאַ֣ת אֲ֭דֹנָ/י הִ֣יא חָכְמָ֑ה וְ/ס֖וּר מֵ/רָ֣ע בִּינָֽה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: zh_hans
  text: 他对人[a]说：“看哪，敬畏主就是智慧；远离邪恶就是明辨。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人类”。希伯来文 אָדָם 是单数“人”，在这里代表全人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他……说
  rationale: 未完成式连续体在此引出全章结尾的宣告；中文用“说”自然承接语境，不额外限定为严格的时间先后。
- source_word: לָאָדָם
  choice: 对人
  rationale: אָדָם为单数形式，却在此代表全人类；“人”既保留原文形式，也可在现代汉语中泛指人类。脚注明示其集合性含义。
- source_word: הֵן
  choice: 看哪
  rationale: 保留该指示、唤起注意的语气词及其庄重色彩。
- source_word: יִרְאַת אֲדֹנָי
  choice: 敬畏主
  rationale: “敬畏”兼具畏惧、敬重和肃然之意，没有把 יִרְאָה 弱化为单纯的尊敬；אֲדֹנָי按神圣称号译为“主”。
- source_word: הִיא חָכְמָה
  choice: 就是智慧
  rationale: “就是”体现独立代词 הִיא 所加强的等同、断定语气。
- source_word: וְסוּר מֵרָע
  choice: 远离恶事
  rationale: “远离”表达主动转开、避开；“恶事”在中文中清楚呈现此处的道德意义，同时不将其抽象化得难以理解。
- source_word: בִּינָה
  choice: 聪明
  rationale: בִּינָה指理解力、明辨；“聪明”与“智慧”构成自然的中文智慧文学对句，并保留二者相近而不完全相同的含义。
theological_decisions:
- issue: 泛指全人类的 אָדָם 如何表达
  choice: 人
  alternative: 人类
  rationale: 原文以单数 אָדָם 代表人类整体。“人”保留这一代表性单数，在现代汉语中也能自然泛指所有人；脚注列出“人类”以消除可能的个体化误读。
- issue: יִרְאַת אֲדֹנָי 的语义力度
  choice: 敬畏主
  alternative: 尊崇主
  rationale: “敬畏”保留 יִרְאָה 所含的畏惧、肃敬与崇敬，不把智慧传统中的神学张力缩减为一般尊重。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留智慧诗歌结语的郑重提示语气；两个“就是”形成清晰、整齐的平行句式。
