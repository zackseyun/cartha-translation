base_translation:
  language: en
  yaml_path: translation/ot/job/028/007.yaml
  text: A path no bird of prey knows[a], and the eye of the falcon has not seen it.
translation:
  language: zh_hans
  text: 有一条路径，猛禽不知道；鸢[a]的眼睛也未曾看见它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“隼”。希伯来语所指的是一种猛禽，但确切种类不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: 路径
  rationale: 该词指道路、路径或踪迹；“路径”既自然，也适合本节所描写的隐秘通道。
- source_word: לֹא יְדָעוֹ
  choice: 不知道
  rationale: 动词带第三人称阳性单数宾语后缀，意为“不知道它”；中文在后半句明说“它”，前半句则按自然表达省略宾语，所指仍是“路径”。
- source_word: עָיִט
  choice: 猛禽
  rationale: 该词泛指捕食性的鸟，并不必限定为某一种；“猛禽”保留了这一概括性。
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: 也未曾看见它
  rationale: שׁזף在此表示看见、望见或瞥见；“未曾看见”清楚自然，并保留与前句“不知道”的平行关系。
- source_word: עֵין
  choice: 眼睛
  rationale: 原文直译为“鸢的眼睛”；保留“眼睛”可传达希伯来诗句的具体意象。
- source_word: אַיָּה
  choice: 鸢
  rationale: 该词指某种猛禽，常被理解为鸢一类的鸟，但确切种类无法确定；正文采用简洁的传统鸟名，并以脚注说明不确定性。
theological_decisions: []
