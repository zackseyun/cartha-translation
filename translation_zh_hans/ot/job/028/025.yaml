  text: when he gave the wind its weight and measured the waters by measure[b][a],
translation:
  language: zh_hans
  text: 他为风定下重量，又按尺度量定众水[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为风定下重量”也可译作“使风有重量”或“为风设定重量”。原文的不定式还可按上下文译为“当他为风定下重量时”。
    reason: lexical_alternative
  - marker: b
    text: “风”一词在别处也可译作“灵”或“气息”；这里它与“众水”平行，较适合指自然界的风。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: 定下
  rationale: 此不定式承接上文，描述上帝安排受造界的行动；译作“定下”既自然，也与“重量”搭配，并保留“使之具有、为之设定”的含义。
- source_word: לָרוּחַ
  choice: 风
  rationale: רוּחַ也可指“灵”或“气息”，但这里与“众水”平行，并处于受造界秩序的语境中，故指自然界的风。
- source_word: מִשְׁקָל
  choice: 重量
  rationale: 该词表示重量或称量；“为风定下重量”保留原文将风纳入精确秩序的意象。
- source_word: וּמַיִם
  choice: 众水
  rationale: מַיִם为复数形态；“众水”既保留诗歌中的复数色彩，也适合宏观的自然界语境。
- source_word: תִּכֵּן
  choice: 量定
  rationale: 该动词可表示衡量、测定或精确规定；“量定”同时传达测量与规定分量之意，并与前半句形成平行。
- source_word: בְּמִדָּה
  choice: 按尺度
  rationale: 介词短语表示依照一定的量度或标准；“按尺度”简洁地保留精确计量的图景。
theological_decisions:
- issue: 与前一节之间的主语延续
  choice: 以“他”指承接上下文的上帝
  alternative: 不明说主语，译作“为风定下重量时”
  rationale: 希伯来语不定式结构依赖上下文；中文补出“他”有助于形成完整自然的句子，并非增添新的神学主张。
- issue: 风的“重量”是赋予还是制作
  choice: 译作“为风定下重量”
  alternative: “使风有重量”或“为风制造重量”
  rationale: 原文结构可较形式地理解为“为风作重量”；“定下”保留这种开放性，同时避免把诗歌意象过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文。“定下重量／按尺度量定”保留原文两行关于称量和精确安排的平行意象；“众水”保留希伯来语复数的诗歌色彩。
