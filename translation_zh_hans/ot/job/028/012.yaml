base_translation:
  language: en
  yaml_path: translation/ot/job/028/012.yaml
  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: zh_hans
  text: 然而，智慧从何处可寻[a]？明辨之处又在哪里？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可寻”原文直译为“将被找到”或“被找到”。
    reason: 说明原文被动形式及未完成式在此反问中的译法。
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: 然而，智慧
  rationale: חָכְמָה指“智慧”。句首וְ结合上文从矿藏转向智慧的反问，译作“然而”可自然标明诗意转折；也可直译为“而”。
- source_word: מֵאַיִן
  choice: 从何处
  rationale: מֵאַיִן明确询问“从哪里”，既可涉及地点，也含来源意味；“从何处”比单说“哪里”更贴近原文。
- source_word: תִּמָּצֵא
  choice: 可寻
  rationale: 这是מצא的尼法勒未完成式，字面为“被找到”。在反问中，“可寻”自然表达“能在哪里被找到”的语气，又不把它限定为单纯将来。
- source_word: וְאֵי זֶה מְקוֹם
  choice: 之所在又在哪里
  rationale: אֵי זֶה מְקוֹם构成“其地方在哪里”的问句。“所在”保留地点意象，“又”则自然连接两个平行诗句。
- source_word: בִּינָה
  choice: 明辨
  rationale: בִּינָה指理解、洞察和辨别力。“明辨”与“智慧”相称，也避免现代汉语“聪明”可能偏向机灵或智力的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。两个问句保持希伯来诗歌的平行结构，并以“从何处”保留对智慧来源的追问。
