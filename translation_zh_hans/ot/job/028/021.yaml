base_translation:
  language: en
  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: zh_hans
  text: 智慧在一切活物眼前隐藏，对天空的飞鸟也隐蔽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: 隐藏
  rationale: 这是 עלם 的尼法勒完成式阴性单数，承接上文阴性名词“智慧”，表达被隐藏、无法察见的状态；译作“隐藏”简明自然。
- source_word: מֵעֵינֵי
  choice: 向……的眼目
  rationale: 保留希伯来语“从……眼前隐藏”的身体意象；汉语用“向……的眼目隐藏”既贴近原文，也维持诗歌语体。
- source_word: כָל חָי
  choice: 一切活物
  rationale: 该词组范围广泛，并不专指人；“一切活物”保留普遍范围和简洁表达。
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: עוֹף 指飞禽或飞行生物，הַשָּׁמַיִם 在此自然指天空；“天空的飞鸟”符合现代汉语，也保留诗意。
- source_word: נִסְתָּרָה
  choice: 也看不见它
  rationale: 这是 סתר 的尼法勒完成式阴性单数，与前半句“隐藏”构成平行。为避免汉语生硬重复，从观察者角度译为“看不见它”，清楚表达智慧对飞鸟也是隐藏的。
theological_decisions:
- issue: 两个阴性单数动词的隐含主语
  choice: 在句首明示为“智慧”，句末以“它”回指
  alternative: 两处均不补主语，译为“向……隐藏”
  rationale: 原文主语由上文第20节的“智慧”承接而来。汉语单独成节时补出“智慧”可避免指代不明，同时不增添神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文。前半句较贴近原文意象，后半句以自然汉语表达平行含义；不加入原文没有的因果或神学限定。
