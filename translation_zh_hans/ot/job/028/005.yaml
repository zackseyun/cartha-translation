  yaml_path: translation/ot/job/028/005.yaml
  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
translation:
  language: zh_hans
  text: 大地出产粮食，地底却被翻动，仿佛火烧一般。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“地底却被翻动，如同火一样。”希伯来语的比较语可理解为翻动仿佛由火造成，也可仅表示“如同火”的相似关系。
    reason: 保留 כְּמוֹ אֵשׁ 的比较关系在修辞和语义上的歧义。
lexical_decisions:
- source_word: אֶרֶץ
  choice: 大地
  rationale: 这里对照地表出产粮食与地下被开掘翻动的情景；“大地”比特定地域意义的“土地”更符合上下文。
- source_word: מִמֶּנָּה
  choice: 出产
  rationale: 原文直译为“从它出来”；汉语用“大地出产”自然地表达产物从地里出来，同时保留来源关系。
- source_word: יֵצֵא
  choice: 出产
  rationale: 该动词本义为“出来、出去”；与“粮食”搭配时译作“出产”，符合现代汉语，又不把被动意义强加给原文。
- source_word: לָחֶם
  choice: 粮食
  rationale: 该词可指“饼、食物”。此处说从地里长出的维生之物，“粮食”既保留具体的农产意象，也比字面译作“饼”更符合汉语表达。
- source_word: וְתַחְתֶּיהָ
  choice: 地底却
  rationale: 原文为“而在它下面”；“地底”简洁呈现地下区域，“却”表达地表出产与地下受翻动之间明显的对照。
- source_word: נֶהְפַּךְ
  choice: 被翻动
  rationale: הפך 的尼法勒式表示被翻转、倾覆或改变；“被翻动”符合本章采矿开掘的语境，同时避免过度限定具体方式。
- source_word: כְּמוֹ אֵשׁ
  choice: 仿佛经过火烧
  rationale: 原文直译可作“像火一样”，比较关系较含混；正文采用方式性的理解，描写地下如被火作用而翻动，并用脚注保留直接相似的另一种理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大地—地底”形成清晰对照；“粮食”避免将 לָחֶם 机械地译成已制成的“饼”。正文保持诗歌的凝练，并以脚注保存末句比较结构的真实歧义。
