translation:
  language: zh_hans
  text: 那地的石头是蓝宝石[a]的所在；它有金尘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓝宝石”也可能指“青金石”；这个希伯来词在古代确切指哪一种宝石，尚不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: 中有
  rationale: 本词通常指“地方、所在”。在采矿诗歌语境中，它与“石头”连用，表达石头是宝石所在之处；译作“石头中有”既保留空间含义，也符合现代汉语表达。
- source_word: סַפִּיר
  choice: 蓝宝石
  rationale: 传统上译作“蓝宝石”，也是现代读者最易理解的对应词；但古代所指矿石可能是青金石，因此以脚注保留不确定性。
- source_word: אֲבָנֶיהָ
  choice: 那地的石头
  rationale: 原文是“它的石头”，阴性单数后缀回指上文的地。汉语用“那地的石头”明确所指，避免孤立经节中“它”指代不清。
- source_word: וְעַפְרֹת
  choice: 尘土中也有
  rationale: עַפְרֹת是与“尘土、松散土壤”相关的复数形式。结合后面的所属结构，译为“尘土中也有”，自然表达其中含金，同时保留原文的尘土意象。
- source_word: זָהָב
  choice: 黄金
  rationale: 准确对应表示贵金属“金”的常用希伯来词；“黄金”在现代汉语中自然且庄重。
- source_word: לוֹ
  choice: 中也有
  rationale: 原文字面为“归它所有／对它而言有”，在无动词诗句中表示拥有或含有。汉语以“中也有”自然传达尘土含金的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的诗体散文。“那地”承接上文所说的地，两个“中有”呈现矿藏蕴含于石头和尘土之中的平行意象。
