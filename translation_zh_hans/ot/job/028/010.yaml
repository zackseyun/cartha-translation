  yaml_path: translation/ot/job/028/010.yaml
  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: zh_hans
  text: 他在磐石中凿开水道[a]；他的眼目看见一切珍贵之物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“河道”或“沟渠”；希伯来语可指水流经过的河道或人工水渠，在这里的采矿图景中，很可能指从岩石中凿出的通道。
    reason: lexical_alternative
  - marker: b
    text: 或译“一切贵重之物”或“一切珍贵的矿石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: 在磐石中
  rationale: צוּר指岩石、磐石；介词ב在这里按处所理解，描写人在坚硬岩层中施工。“在磐石中”自然，也不把方向性表达得过满。
- source_word: יְאֹרִים
  choice: 水道
  rationale: יְאֹרִים通常指河流、水渠或水道。矿业语境暗示凿出的通道，但原词仍保有水道含义，因此正文采用“水道”，脚注保留“河道、沟渠”等可能。
- source_word: בִּקֵּעַ
  choice: 凿开
  rationale: בקע意为劈开、裂开。在开采矿石的语境中，“凿开”既体现人为施工，又保留破开岩石的力度。
- source_word: יְקָר
  choice: 珍宝
  rationale: יְקָר指珍贵或贵重之物，并未明确限定为矿石。“珍宝”符合采矿语境，同时不把所指缩窄为某一种矿物。
- source_word: רָאֲתָה עֵינוֹ
  choice: 亲眼看见
  rationale: 希伯来文直译为“他的眼看见”。汉语用“亲眼看见”自然地保留眼睛亲见的鲜明意象；在这一描述性诗句中采用现在时。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“磐石”保留诗体质感；“凿开水道”呈现采矿动作，同时借脚注保存יְאֹרִים在水道、河道、沟渠之间的词义张力。脚注标记按正文出现顺序排列。
