source:
  edition: WLC
  text: כִּי ה֭וּא לִ/קְצוֹת הָ/אָ֣רֶץ יַבִּ֑יט תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם יִרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/024.yaml
  text: For he looks to the ends of the earth[b][a]; he sees under all the heavens.
translation:
  language: zh_hans
  text: 因为他察看大地的尽头[a]，看遍诸天之下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大地极远之处”。
    reason: lexical_alternative
  - marker: b
    text: “诸天”在希伯来文中为复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处承接上文，为神知道智慧所在提供理由；“因为”自然表达解释性的因果关系。
- source_word: הוּא
  choice: 他
  rationale: 代词在上下文中指神；译文保留代词，不把“神”直接补入正文。
- source_word: לִקְצוֹת הָאָרֶץ
  choice: 大地的尽头
  rationale: 该短语指大地最遥远的边界；此译法自然、庄重，也保留原文的空间意象。
- source_word: יַבִּיט
  choice: 察看
  rationale: נבט 的使役词干表达有方向地观看；“察看”比单纯“看”更能体现这种专注而全面的观看，同时不过度强化。
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: 诸天之下
  rationale: 保留 תַּחַת 的空间意象，并以“诸天”反映希伯来文复数形式；“看遍”在汉语中自然传达 כָּל 所体现的遍及范围。
- source_word: יִרְאֶה
  choice: 看遍
  rationale: ראה 的基本义是“看见”；结合范围短语，译作“看遍”使现代汉语完整自然，并保留神视野遍及全地的含义。
theological_decisions:
- issue: 代词 הוּא 所指的对象
  choice: 按上下文理解为神，但正文仍译作“他”
  alternative: 直接译作“神”
  rationale: 约伯记28章的上下文明确说明，知道智慧所在并察看全地的是神；保留代词则避免在正文中把上下文信息改写成明说的名词。
- issue: 神观看范围的全面性
  choice: 以“看遍诸天之下”表达空间上的无所不及
  alternative: 译作“看见诸天之下的一切”
  rationale: 原文没有明说“一切事物”作为宾语；“看遍”既能传达全面范围，也避免补入原文未明说的宾语。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“大地的尽头”保留诗歌性的空间图景；“看遍诸天之下”形成自然平行，并避免使用生僻或宗派化措辞。
