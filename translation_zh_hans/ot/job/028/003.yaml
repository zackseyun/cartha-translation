base_translation:
  language: en
  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: zh_hans
  text: 他给黑暗划定界限；他探究到一切尽头，寻找幽暗和深沉黑暗之石[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较传统的译法：“幽暗和死荫之石。”
    reason: 保留צַלְמָוֶת可译为“死荫”的传统词义，同时维持正文以“深沉黑暗”表达其在本节矿坑语境中的含义。
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: 给黑暗划定尽头
  rationale: קֵץ表示“尽头、界限”，שָׂם表示“设置、安置”；“划定尽头”既保留设立边界的具体意象，也符合现代汉语表达。
- source_word: וּלְכָל תַּכְלִית
  choice: 每一处极限
  rationale: תַּכְלִית在采矿语境中指尽头或最远边界，并非道德意义上的“完全”；“每一处极限”体现穷尽各处的探索。
- source_word: הוּא חוֹקֵר
  choice: 探查……寻找
  rationale: חקר指深入搜寻、探究。汉语用“探查……寻找”展开其动作与对象的关系，使句意自然清楚，同时保留彻底探索的力度。
- source_word: אֶבֶן
  choice: 石头
  rationale: 保留希伯来文单数名词的基本意象；在汉语中“石头”也可作集合性称呼，适合采矿语境。
- source_word: אֹפֶל
  choice: 幽暗
  rationale: אֹפֶל指浓重的昏暗；译作“幽暗”可与本节前面的חֹשֶׁךְ“黑暗”有所区别。
- source_word: צַלְמָוֶת
  choice: 深沉黑暗
  rationale: 在《约伯记》的地下采矿语境中，此词主要描写极深的黑暗；传统的“死荫”译法则收入脚注，以保留词义张力。
theological_decisions:
- issue: צַלְמָוֶת的译法
  choice: 深沉黑暗
  alternative: 死荫
  rationale: 此处描写矿工深入地下最幽暗之处，语境偏向浓重、极深的黑暗；但该词传统上也可理解为“死荫”，故不在正文中混合两义，而以脚注保存另一读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“划定尽头”和“探查每一处极限”保留希伯来文的边界及彻底搜索意象；正文适度展开חקר的支配关系，以避免生硬歧义。
