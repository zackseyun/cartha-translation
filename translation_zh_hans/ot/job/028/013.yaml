base_translation:
  language: en
  yaml_path: translation/ot/job/028/013.yaml
  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: zh_hans
  text: 世人不知道它的价值[a]，在活人之地也找不到它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“价钱”。希伯来语所用的词指估定的价值。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: 世人
  rationale: 该词以单数代表性的方式指必死、脆弱的人类；“世人”在现代汉语中自然地表达泛指人类，同时不必强行补入“必死”这一隐含色彩。
- source_word: יָדַע
  choice: 不知道
  rationale: 完成式在此陈述普遍事实，用现代汉语一般现在意义的“不知道”最自然；不译作“无法知道”，以免加入原文未明说的能力限制。
- source_word: עֶרְכָּהּ
  choice: 它的价值
  rationale: עֵרֶךְ可指估值、价值或价钱；“价值”既保留衡量价值的含义，也比“价钱”更适合本段论智慧的诗歌语境。
- source_word: תִּמָּצֵא
  choice: 找不到它
  rationale: 尼法勒未完成式表达“未被找到”；汉语主动形式“找不到它”自然传达这一被动结果，并未刻意译成“不能找到”，以避免过度强化情态。
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: 在活人之地
  rationale: 保留希伯来语“活人之地”的诗性惯用表达，指现世活人所在的领域；比解释性的“人世间”更贴近原文意象。
theological_decisions: []
