  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: zh_hans
  text: 他堵住河流的渗流[a]，使隐藏之物显露在光下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他止住河流的滴水。”这里的希伯来语词十分罕见，字面可能使人联想到“哭泣”或水滴、渗流。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: 渗水之处
  rationale: 该词罕见，字面与“哭泣、流泪”有关；结合本章采矿及控制地下水的语境，较可能指水渗出、滴流之处。“渗水之处”既符合语境，也不过度限定为明确的泉源。
- source_word: נְהָרוֹת
  choice: 河流
  rationale: 该词通常指河流或水流；此处保留较宽泛的“河流”，可涵盖地下水道的意象。
- source_word: חִבֵּשׁ
  choice: 堵住
  rationale: 原动词基本义为捆绑、约束；用于水流时，“堵住”自然表达使渗水停止的实际效果。
- source_word: תַּעֲלֻמָהּ
  choice: 隐藏之物
  rationale: 原词指被隐藏、遮蔽的东西。采用宽泛译法，不擅自限定为矿石、宝藏或其他特定物品。
- source_word: יֹצִא
  choice: 使……显露
  rationale: 使役形式表示使某物出来；与“在光中”搭配时，“使……显露”符合现代汉语，同时保留由隐藏转为可见的含义。
- source_word: אוֹר
  choice: 光中
  rationale: 保留“光”的具体意象，并与“隐藏”形成鲜明对照。
