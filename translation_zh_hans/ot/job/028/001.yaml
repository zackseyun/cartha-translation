  yaml_path: translation/ot/job/028/001.yaml
  text: Surely there is a mine for silver[b][a], and a place where they refine gold.
translation:
  language: zh_hans
  text: 白银确有出产之地[a]，金子也有冶炼之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出产之地”或译“来源、出处”。希伯来语 מוֹצָא 可指源头、出处或产出之地；本章上下文涉及采矿，因此也可理解为银的矿产之处。
    reason: lexical_alternative
  - marker: b
    text: “冶炼”也可译“熔炼”或“精炼”。原文动词可用于贵金属的熔炼或提纯；其复数形式未明指执行者。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 确有
  rationale: 这里的 כִּי 用于强调并引出诗歌论述；“确有”自然传达肯定语气，不误解为单纯的因果连词。
- source_word: יֵשׁ
  choice: 有
  rationale: 这是存在句标记；现代汉语以“有”表达最自然。
- source_word: לַכֶּסֶף מוֹצָא
  choice: 银子确有矿源
  rationale: מוֹצָא 本义为出处、来源或出产之地，并非孤立语境中的专门采矿术语；结合本章开头的采矿语境，“矿源”既具体自然，也保留“来源”的词义色彩。
- source_word: וּמָקוֹם לַזָּהָב
  choice: 金子也有……之处
  rationale: מָקוֹם 是“地方、场所”；汉语调整语序，以“金子也有……之处”表达其与金子的关系。
- source_word: יָזֹקּוּ
  choice: 冶炼
  rationale: זקק 在金属语境中可指熔炼或精炼。此处第三人称复数可作不定人称；汉语用名词化的“冶炼之处”自然涵盖该含义，又不必补出明确主语。
theological_decisions: []
