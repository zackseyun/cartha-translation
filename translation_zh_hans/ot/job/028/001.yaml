  register: 采用现代、凝练而庄重的诗体汉语。两分句保持平行；以“矿源”和“冶炼之处”呈现采矿与金属加工语境，同时用脚注保留 מוֹצָא 与 זקק 的词义幅度。所有脚注标记均置于正文相关词语之后。
