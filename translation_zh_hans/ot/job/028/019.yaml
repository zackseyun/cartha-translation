  text: The topaz of Cush cannot equal it[a]; it cannot be valued in pure gold.
translation:
  language: zh_hans
  text: 古实的黄玉无法与智慧比拟[a]；智慧也不能用纯金估价。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黄玉”所译的希伯来语宝石名称具体所指不能确定，也可能指贵橄榄石或橄榄石。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: 不能与智慧相比
  rationale: ערך在这里表示价值或等级上的比较。宾语后缀指向上下文中的“智慧”；中文明确补出“智慧”，既自然，也避免“它”所指不清。
- source_word: פִּטְדַת כּוּשׁ
  choice: 古实的黄玉
  rationale: פִּטְדָה确指一种宝石，但具体矿物无法确定；“黄玉”沿用传统译法，并以脚注保留其他可能。כּוּשׁ按通行中文圣经地名音译作“古实”。
- source_word: בְּכֶתֶם טָהוֹר
  choice: 纯金
  rationale: כֶּתֶם指贵重、精炼的黄金，טָהוֹר强调纯净；介词ב在估价语境中表示衡量价值所用的东西。
- source_word: תְסֻלֶּה
  choice: 不足以衡量它的价值
  rationale: 该被动式在此表达估价、衡量价值，而非单纯的物理称重；此译法与上半句的价值比较形成平行，也保留智慧不可估价的语意。
