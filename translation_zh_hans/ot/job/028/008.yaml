  language: zh_hans
  text: 骄傲的野兽未曾踏过这路[a]；狮子未曾从其上经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面意思是“骄傲之子”。这句话很可能指骄傲的野兽，尤其是捕食性动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: 踏上这路
  rationale: דרך的使役形在此结合道路语境，表示踏行、走过；“踏上这路”既自然，也明确承接上一节所说的隐秘路径。
- source_word: בְנֵי שָׁחַץ
  choice: 骄傲的猛兽
  rationale: 字面为“骄傲之子”，与下半句的“狮子”平行，在诗歌语境中最可能指威猛高傲的野兽，尤其是猛兽；正文采用可理解的意译，并用脚注保留字面表达及其不确定性。
- source_word: עָדָה עָלָיו
  choice: 从其上经过
  rationale: 动词עָדָה与介词עַל连用，在这里表达越过或经过其上；此译保留空间意象，并与上半句形成平行。
- source_word: שָׁחַל
  choice: 狮子
  rationale: 这是诗体中表示狮子的词，可带威猛凶悍的色彩；译作“狮子”清楚、庄重，也不额外强化原文未明确区分的性别或种类。
