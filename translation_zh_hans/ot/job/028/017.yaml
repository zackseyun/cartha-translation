  yaml_path: translation/ot/job/028/017.yaml
  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: zh_hans
  text: 黄金和玻璃[a]都不能与她相比；也不能用精金器皿换取她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玻璃”或译“水晶”。原文所用的词可能指一种透明而珍贵的材料；这里译作“玻璃”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“她的交换物不能是精金器皿。”原文直译为“她的交换物是精金器皿”，但在前句否定语气的支配下，意为精金器皿不足以作为换取她的等价物。
    reason: translation_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: 不能与她相比
  rationale: ערך在这里有衡量、比较之意；阴性单数后缀承接上下文中的“智慧”。译作“与她相比”既自然，也保留价值比较的语境。
- source_word: זָהָב
  choice: 黄金
  rationale: 指贵金属金；“黄金”符合现代汉语诗体表达。
- source_word: זְכוֹכִית
  choice: 玻璃
  rationale: 此词较可能指古代作为珍贵透明材料的玻璃；“水晶”是可保留的传统词义可能。
- source_word: תְמוּרָתָהּ
  choice: 换取她
  rationale: תמורה表示交换或替代；动词化为“换取”能自然呈现商业交换的比喻，阴性后缀仍指智慧。
- source_word: כְּלִי פָז
  choice: 精金器皿
  rationale: כְּלִי可指器皿、物件或用具，פָז指精炼的优质黄金；“精金器皿”保留该短语较具体的可能含义。
theological_decisions:
- issue: 阴性单数后缀所指对象
  choice: 用“她”承接上下文中的智慧
  alternative: 用“它”作无生命事物代词
  rationale: 希伯来语后缀为阴性单数，所指是上下文中语法性别为阴性的“智慧”；“她”有助于保留诗歌中的拟人化色彩，但不把语法性别扩展为额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两分句保持平行；以“她”承接上下文拟人化的智慧。
