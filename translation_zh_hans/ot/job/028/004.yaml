  rationale: 修订保留本节在采矿语境下的主旨与脚注中的词义歧义，同时删除“空中”这一未明说的细节，并以“被行人的脚步遗忘”更贴近希伯来文的压缩被动表达。首句不明示“人”作为施事者，以避免为原文单数动词确定不必要的具体主语。
