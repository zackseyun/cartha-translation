base_translation:
  language: en
  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: zh_hans
  text: 在远离居民之处开凿矿井[a]；他们被行人的脚步遗忘[b]，远离世人，悬吊着，来回摇晃[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从寄居者身边凿开水道（或溪谷）。”希伯来原文艰涩，尤其是“水道”和“寄居者”两词；许多人根据本章的采矿场景，将前者理解为矿道或矿井。
    reason: alternative_reading
  - marker: b
    text: 直译：“被脚遗忘。”意思可能是这里或这些矿工处在地面行人看不见或到不了的地方。
    reason: lexical_alternative
  - marker: c
    text: 或译：“被放下”或“悬垂着”。希伯来语动词可表示悬挂或放下，很可能指矿工借绳索下到矿中。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַץ
  choice: 开凿
  rationale: 此动词本义为“冲破、破开”；结合本章采矿语境，用“开凿”自然表达破土掘进的动作。
- source_word: נַחַל
  choice: 矿井
  rationale: נַחַל通常指河谷、溪流或水道，但本节处于采矿描写中，后文又提到人被悬吊、摇晃，因此采用语境义“矿井”；其通常词义保留在脚注中。
- source_word: מֵעִם גָּר
  choice: 远离居民之处
  rationale: מֵעִם表示与近处分离；גָּר可指寄居者或居住者。译文以地点性表达呈现艰涩短语，同时在脚注保留“寄居者”的可能读法。
- source_word: הַנִּשְׁכָּחִים מִנִּי רָגֶל
  choice: 行人的脚步察觉不到他们
  rationale: 原文直译近于“被脚遗忘的人”。此译保留“脚步”的鲜明意象，并用“察觉不到”说明矿工处在人迹所不见、不及之地。
- source_word: דַּלּוּ
  choice: 被吊在空中
  rationale: 该词在此可表示垂挂、悬吊或被放下；结合矿井作业，最可能描写矿工借绳索悬空或下到深处。
- source_word: מֵאֱנוֹשׁ
  choice: 远离世人
  rationale: אֱנוֹשׁ指必死的人或人类；“世人”在现代汉语中概括人群与人类社会，不限定性别。
- source_word: נָעוּ
  choice: 来回摇晃
  rationale: 该动词可指摇动、蹒跚或往复移动；与悬吊的矿工相连时，“来回摇晃”最为具体自然。
