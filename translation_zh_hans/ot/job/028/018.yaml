base_translation:
  language: en
  yaml_path: translation/ot/job/028/018.yaml
  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: zh_hans
  text: 珊瑚和水晶都不值一提；智慧的价值胜过珍珠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “珍珠”所译的希伯来词也可能指红珊瑚或其他珍贵珠宝。
    reason: 原词 פְּנִינִים 的具体所指不确定，脚注保留这一真实的词汇歧义。
lexical_decisions:
- source_word: רָאמוֹת
  choice: 珊瑚
  rationale: 该词所指宝物并不完全确定；结合古代译本和本节珍宝语境，译作“珊瑚”是常见且合宜的选择。
- source_word: גָבִישׁ
  choice: 水晶
  rationale: 此词可能指水晶、石英或类似的透明贵重矿物；“水晶”自然简明，也保留其珍宝意象。
- source_word: לֹא יִזָּכֵר
  choice: 都不值一提
  rationale: 字面为“不被提及”；在比较智慧价值的语境中，表示这些宝物与智慧相比不足挂齿。
- source_word: מֶשֶׁךְ חָכְמָה
  choice: 智慧的价值
  rationale: מֶשֶׁךְ 的确切含义存在争议，可涉及取得、交易或价格；上下文持续比较智慧与贵重物品的价值，因此正文采用自然且不偏狭的“价值”。
- source_word: פְּנִינִים
  choice: 珍珠
  rationale: 该词可能指珍珠、红珊瑚或其他珍贵珠宝；传统和上下文允许译作“珍珠”，但以脚注保留词义不确定性。
theological_decisions:
- issue: 智慧与珍宝的比较
  choice: 用“价值胜过”表达智慧远超贵重物品
  alternative: 译作“取得智慧胜过珍珠”或“智慧的价格高过珍珠”
  rationale: 原句着重价值比较，但 מֶשֶׁךְ 的语义不够确定；“价值”既符合上下文，又避免把经文限定为购买或取得智慧的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不值一提”自然传达希伯来语否定提及的比较语气；分号保留诗句两半的平行结构。
