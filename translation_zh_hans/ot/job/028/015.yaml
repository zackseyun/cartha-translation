  text: לֹא יֻתַּ֣ן סְג֣וֹר תַּחְתֶּ֑י/הָ וְ/לֹ֥א יִ֝שָּׁקֵ֗ל כֶּ֣סֶף מְחִירָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: zh_hans
  text: 精金不能拿来换取它[a]；白银也不能称出，用来付它的价钱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上文所说的智慧。
    reason: 指代说明
  - marker: b
    text: 古时银子常按重量支付；“称出”指称量白银作为支付价钱之物。
    reason: 文化背景
lexical_decisions:
- source_word: יֻתַּן
  choice: 不能拿来
  rationale: 该动词为被动式，在否定句和估价语境中表示某物不能被拿出或付出；汉语用“不能拿来”自然体现这种不可能性。
- source_word: סְגוֹר
  choice: 精金
  rationale: 该词指精炼、上等的黄金；“精金”简洁庄重，也区别于一般的“金子”。
- source_word: תַּחְתֶּיהָ
  choice: 换取它
  rationale: 介词在这里表达替代或交换，而非空间意义的“在它下面”；代词所指承接上文的智慧。
- source_word: יִשָּׁקֵל
  choice: 不能……称出
  rationale: 该被动动词指按重量称量银子作为付款；译文既保留古代银子按重量支付的意象，也与前半句的不可能性平行。
- source_word: כֶּסֶף
  choice: 白银
  rationale: 原词字面为“银”，在此虽有货币功能，保留“白银”可呈现古代交易的具体意象。
- source_word: מְחִירָהּ
  choice: 它的价钱
  rationale: 该名词表示价格或购买价值；“价钱”通俗自然，并准确延续交易比喻。
theological_decisions:
- issue: 前半句的语法主语与交换方向
  choice: 以“精金”为被拿来交换之物，以“它”指上文的智慧
  alternative: 把智慧理解为不能拿来换取精金
  rationale: 希伯来文中“精金”是被动动词的语法主语，而“换取它”是介词短语；因此原文强调精金不足以换取智慧。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“精金”保留原文对上等精炼黄金的专门称谓；“按它的价钱称出”保留白银按重量支付的古代经济图景。
