base_translation:
  language: en
  yaml_path: translation/ot/job/028/020.yaml
  text: But wisdom—from where does it come? And where is the place of understanding?[a]
translation:
  language: zh_hans
  text: 然而，智慧从哪里来？悟性所在之处又在哪里？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译作：“而智慧从何处而来？悟性所在之处在哪里？”
    reason: 句首连接词可作承接或在上下文中带出转折；正文以“然而”表达语篇转入，脚注以“而”保留较直接的连接形式。
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: 然而，智慧
  rationale: חָכְמָה译为“智慧”。句首וְ在这里承接并转折，重新提出全诗的核心问题；“然而”能自然表达这种语篇作用。
- source_word: מֵאַיִן
  choice: 从哪里
  rationale: 介词מִן与疑问词אַיִן组合，询问来源，直译为“从哪里”，保留对智慧出处的强调。
- source_word: תָּבוֹא
  choice: 来
  rationale: בוא的Qal未完成式第三人称阴性单数，以“智慧”为主语；此处是普遍性的修辞问句，用现代汉语“来”最自然，不必限定为将来。
- source_word: וְאֵי זֶה
  choice: 又在哪里
  rationale: אֵי זֶה在מְקוֹם之前询问地点。“又”既连接两个平行问句，也符合现代汉语表达。
- source_word: מְקוֹם
  choice: 之地
  rationale: מְקוֹם意为“地方、所在”。“聪明之地”保留原文具体的空间意象和诗体凝练感。
- source_word: בִּינָה
  choice: 聪明
  rationale: בִּינָה指理解力、明辨力。约伯记智慧语境中译作“聪明”，既与“智慧”形成传统且清楚的对应，也不把含义收窄为某一种判断能力。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留希伯来诗歌两个平行问句。“聪明之地”刻意保留原文的地点意象，不解释成抽象的“来源”或“获得途径”。
