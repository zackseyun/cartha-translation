base_translation:
  language: en
  yaml_path: translation/ot/job/028/009.yaml
  text: He puts his hand to the flint[b][a]; he overturns mountains from their roots.
translation:
  language: zh_hans
  text: 他向燧石伸手[a]，将山连根翻倒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向燧石伸手”也可译作“在坚石上动手”或“向坚石下手”。希伯来语可能描写人在采掘时对坚硬岩石作业。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从山的根”；这里的单数“根”可表达集合意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: 向燧石
  rationale: חַלָּמִישׁ指燧石或坚硬的岩石；前置词בְּ在此可表示动作所朝向或施加于其上的对象。“向燧石”保留了介词关系及采掘坚石的意象，又不额外加入“凿”等原文未明说的工具性动作。
- source_word: שָׁלַח יָדוֹ
  choice: 伸手
  rationale: שׁלח ידו字面为“伸出他的手”，在这里表达向某物动手、着手作业。“伸手”既贴近原文意象，也能与“向燧石”自然搭配。
- source_word: הָפַךְ
  choice: 翻倒
  rationale: הפך表示翻转、倾覆或彻底改变位置；“翻倒”传达采掘使山体从根基被掀动的强烈图景。
- source_word: מִשֹּׁרֶשׁ
  choice: 连根
  rationale: 原文为单数“从根”，与复数“山”结合时可作集合意义理解。“连根”是自然简洁的中文表达，传达从根基翻动、彻底掀起之意。
- source_word: הָרִים
  choice: 山
  rationale: הָרִים是“山”的复数；现代汉语中“山”本身可作无标记复数，适合此处概括性的诗歌陈述。
theological_decisions: []
translation_notes:
  register: 采用庄重而清晰的现代标准汉语，保留希伯来诗句中“手—燧石”与“山—根”的具体意象；不把采矿背景中可推知的“凿”“挖”等动作直接写入正文，以免消解原文措辞的含蓄性。
