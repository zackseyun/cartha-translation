  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: zh_hans
  text: 那时，他看见它，便述说它；他确立它，也查究它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 保留诗句中的时间推进关系；现代汉语自然、庄重。
- source_word: רָאָהּ
  choice: 他看见它
  rationale: 保留ראה的具体感知用语；阴性单数后缀承接上文的“智慧”，用“它”避免额外强化拟人色彩。
- source_word: וַיְסַפְּרָהּ
  choice: 便述说它
  rationale: ספר在此可指述说、陈明或数算；正文选“述说”以配合诗句语流，同时用脚注保留词义歧义。
- source_word: הֱכִינָהּ
  choice: 他使它确立
  rationale: כון的使役式表达使之稳固、确立或安置妥当；“使它确立”较直接地保留使役结构。
- source_word: וְגַם
  choice: 又
  rationale: 以简洁自然的现代汉语表达累加推进。
- source_word: חֲקָרָהּ
  choice: 将它查究
  rationale: חקר表示深入探查、考察；“查究”保留彻底探究的意味及神查究智慧所形成的诗意张力。
theological_decisions:
- issue: 各阴性单数后缀的所指
  choice: 均以“它”承接上文的“智慧”
  alternative: 将后缀解释为智慧的尺度或秩序
  rationale: 紧邻语境以智慧为神看见、述说、确立和查究的对象；代词译法既保持所指，也不擅自把抽象概念进一步人格化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体散文语序。保留四个连续动词及其共同宾语，不把神与智慧之间的关系解释为某种特定教义命题。
