  text: אֱ֭לֹהִים הֵבִ֣ין דַּרְכָּ֑/הּ וְ֝/ה֗וּא יָדַ֥ע אֶת מְקוֹמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
translation:
  language: zh_hans
  text: 神明白智慧的道路[a]，他知道智慧的所在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “智慧的道路”也可理解为“通往智慧的道路”。希伯来语中“智慧”是阴性名词，原文相应的代词后缀也为阴性。
    reason: 说明所有格关系的词义歧义，并交代原文阴性形式；现代汉语正文通过重述“智慧”避免用代词过度强化拟人化。
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 该词虽具有复数形态，但此处与单数谓语相配，明确指独一的神；“神”是现代汉语中自然、庄重的译法。
- source_word: הֵבִין
  choice: 明白
  rationale: בין 的使役词干在此表达理解、洞察；诗句陈述神恒常的认知，因此用现代汉语一般时态“明白”。
- source_word: דַּרְכָּהּ
  choice: 智慧的道路
  rationale: 阴性后缀回指上下文中的“智慧”。汉语没有相应的语法性别代词，明确重述“智慧”既避免指代含混，也保留“道路”的比喻；其含义也可能是“通往智慧的道路”。
- source_word: וְהוּא
  choice: 他
  rationale: 独立代词带有强调作用。汉语直接用“他”自然承接“神”；不采用敬称“祂”，以免加入原文不存在的书写层面区别。
- source_word: יָדַע
  choice: 知道
  rationale: 该动词表示认识、知道；这里是关于神的恒常陈述，译作“知道”简洁自然。
- source_word: אֶת מְקוֹמָהּ
  choice: 智慧的所在
  rationale: מָקוֹם 指地方、所在。重述“智慧”可清楚显示阴性后缀的所指，“所在”比“位置”更符合诗体和抽象对象。
theological_decisions:
- issue: 两个阴性后缀的所指及智慧的拟人化程度
  choice: 明确译作“智慧的道路……智慧的所在”，视后缀为回指上下文中的智慧，但不使用带性别的代词来强化人格化。
  alternative: 译作“她的道路……她的所在”，或“它的道路……它的所在”。
  rationale: 希伯来语“智慧”为阴性名词，且本章有拟人化表达；但语法阴性本身不足以要求汉语使用“她”。重述“智慧”既保存所指，又不额外判定其人格化程度。
- issue: דַּרְכָּהּ 是“智慧所行的道路”还是“通往智慧的道路”
  choice: 正文保留较贴近形式且开放的“智慧的道路”。
  alternative: “通往智慧的道路”。
  rationale: 所有格结构本身可以容纳不止一种关系；上下文容许理解为智慧的途径或通往智慧之路。正文不将这种真实歧义强行限定，脚注列出另一自然理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“明白……知道”保留原文近义平行；两次重述“智慧”在汉语中清晰自然，也避免“其”或“它”产生距离感和指代含混。
