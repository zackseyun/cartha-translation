  text: בַּ֭רְזֶל מֵ/עָפָ֣ר יֻקָּ֑ח וְ֝/אֶ֗בֶן יָצ֥וּק נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: zh_hans
  text: 铁从尘土中取出，铜[a]从石头中熔炼出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青铜”。希伯来语这个词既可指铜，也可指青铜；这里谈的是从石头中取得金属，所以正文采用“铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: 铁
  rationale: 该词在《希伯来圣经》中通常指金属“铁”，此处无需另作解释。
- source_word: מֵעָפָר
  choice: 从尘土中
  rationale: עָפָר可指尘土、松土或土地；“尘土”保留原文具体而富有诗意的意象，也能表达金属取自地下。
- source_word: יֻקָּח
  choice: 取出
  rationale: 这是לקח的被动式，基本义为“被取”；译作“取出”既贴近原文，也符合采矿语境，而不把“开采”的技术含义直接加入正文。
- source_word: וְאֶבֶן
  choice: 从石头中
  rationale: אֶבֶן意为“石头”。中文补出介词结构，使句意自然，表达含矿石料中取得金属的意思，同时保留原文的“石头”意象。
- source_word: יָצוּק
  choice: 熔炼出来
  rationale: יצק可表示倾倒、浇铸或熔炼；在矿物和金属的语境中，指通过熔炼从石头中取得金属最为合适。“出来”使中文清楚表达产出关系。
- source_word: נְחוּשָׁה
  choice: 铜
  rationale: 该词可指铜或青铜。此处谈论从石头中取得金属，因而作为天然金属的“铜”比合金“青铜”更符合采矿语境；另一可能保留在脚注中。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两分句结构平衡，保留希伯来诗句的简洁和具体意象；不将“取出”过度具体化为“开采”。脚注标记置于存在词义歧义的“铜”之后。
