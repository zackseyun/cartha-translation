  yaml_path: translation/ot/job/028/022.yaml
  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: zh_hans
  text: '亚巴顿和死亡说[a]：


    “我们亲耳听到过有关它的消息。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚巴顿”可意为“毁灭”。本句也可译作：“毁灭和死亡说：‘我们亲耳听到过有关它的消息。’”末句的“它”按上下文指智慧；原文שִׁמְעָהּ可指“消息、传闻”或“风声”。
    reason: 说明“亚巴顿”的词义替代，并准确标示本节词形及末句可保留的“消息／传闻”语义范围。
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: 亚巴顿
  rationale: 采用音译，保留其与“死亡”并列且被拟人化为说话者的诗意形象；脚注说明也可理解为“毁灭之地”。
- source_word: וָמָוֶת
  choice: 和死亡
  rationale: 直译连词与名词；在汉语中借助“说”和“亲耳听过”自然体现拟人，无须以字母大小写标示。
- source_word: אָמְרוּ
  choice: 说
  rationale: 虽为完成式，诗歌语境可表达生动的当前陈述或一般性陈述；现代汉语“说”不强制标明时态，也保留这种开放性。
- source_word: בְּאָזְנֵינוּ שָׁמַעְנוּ
  choice: 我们亲耳听过
  rationale: 用自然的现代汉语保留“用我们的耳朵听见”的强调，同时避免生硬直译。
- source_word: שִׁמְעָהּ
  choice: 关于她的传闻
  rationale: שֵׁמַע可指消息、传闻或风声；“传闻”突出仅凭听闻、并非直接认识。阴性后缀按上下文指智慧，译为“她”。
theological_decisions:
- issue: 亚巴顿与死亡的拟人化
  choice: 将二者译作会说、会听的并列主体
  alternative: 译作非人格化的“毁灭之地和死亡”
  rationale: 原文以复数动词“说”及“我们的耳朵”明确赋予二者拟人特征；译文保留诗歌形象，但不据此断定它们是独立的超自然实体。
- issue: שִׁמְעָהּ中阴性后缀的所指
  choice: 译为“关于她”，指上下文中的智慧
  alternative: 译为较含混的“关于它”或“它的消息”
  rationale: 本章所寻求的是智慧，希伯来语“智慧”为阴性名词；汉语用“她”可保留诗歌中的人格化呼应。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留希伯来诗歌的拟人手法；“亲耳听过”既传达בְּאָזְנֵינוּ的强调，也符合普通读者的表达习惯。
