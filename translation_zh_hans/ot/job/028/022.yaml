revisions:
- from: '亚巴顿和死亡说[a]：

    “我们亲耳听过关于她的传闻。”'
  to: '亚巴顿和死亡说[a]：


    “我们亲耳听到过有关它的消息。”'
  rationale: 修订不改变亚巴顿与死亡的拟人化表达，也不将其解释为特定本体。将“她”改为“它”，避免在汉语中把希伯来语的语法阴性过度落实为女性人称；同时以“消息”对应שִׁמְעָהּ的核心“听闻、报告”义，并修正脚注词形与词义表述。
