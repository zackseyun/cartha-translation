  source_fidelity: 主文准确保留了“亚巴顿”和“死亡”作为并列、拟人化发言者，以及“以我们的耳朵听见”的强调。末句的阴性后缀在语境中指智慧；不过在现代汉语中用“她”会把希伯来语的语法阴性直接转化为中文的人称性别，较原文所要求的程度更强。
  naturalness: “我们亲耳听过关于她的传闻”总体可懂，但“关于她的传闻”与“亲耳听过”搭配略显书面且“她”在中文中会自然指向女性人物。改为“我们亲耳听到过有关它的消息”更自然，也保留其仅由听闻所得的意思。
  terminology: “亚巴顿”可保留为音译；“死亡”在此诗歌拟人化语境中无需强加中文专名式标记。脚注应将相关词形准确写为“שִׁמְעָהּ”，并避免把“亚巴顿”的词义限定为“毁灭之地”；该词亦可作“毁灭”。
