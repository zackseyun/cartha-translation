  rationale: 修订补出原文时间性不定式结构，保留本节与下一节相接的未完句法；以“法则”表达上帝所定的 חֹק；并将脚注锚点移至所讨论的 חֲזִיז קֹלוֹת。正文保留“雷霆的闪电”的诗歌性属格关系，脚注提供现代汉语较顺畅的替代译法，不消除原文短语的语义张力。
