base_translation:
  language: en
  yaml_path: translation/ot/job/028/026.yaml
  text: when he made a decree for the rain[a], and a path for the thunderbolt of the storms,
translation:
  language: zh_hans
  text: 当他为雨定下法则、为雷霆的闪电[a]开辟路径时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雷电”；直译“雷声的闪电”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  choice: 他……定下
  rationale: 介词 בְּ 与带第三人称阳性单数后缀的动词不定式连用，在此表示时间或伴随情境；承接上下文，主语是上帝。汉语以“他……定下”自然表达其施行之举，而不另添原文没有的说明。
- source_word: לַמָּטָר חֹק
  choice: 为雨水定下规律
  rationale: מָטָר 指雨，带定冠词；חֹק 指所规定、设定之物，在此是上帝为自然界所设的定规或界限。“规律”兼顾固定秩序与自然语境，避免“律例”过强的法律色彩。
- source_word: וְדֶרֶךְ
  choice: 又……划定路径
  rationale: דֶּרֶךְ 本义为道路、路径；“路径”保留天空中雷电循道而行的诗歌意象。“划定”由并列结构承接前面的 עשה，不改变原句谓语关系。
- source_word: לַחֲזִיז קֹלוֹת
  choice: 为雷电
  rationale: חֲזִיז 指闪电、雷电或雷霆；קֹלוֹת 是 קוֹל 的复数，字面为“声音”，在风暴语境中通常指雷声。正文用现代汉语较自然的“雷电”概括带雷声的闪电现象，并用脚注保留较逐字的结构。
theological_decisions:
- issue: 上帝为自然现象设立秩序
  choice: 译为他为雨水定下规律、为雷电划定路径
  alternative: 扩展为上帝以护理掌管一切自然现象
  rationale: 原文以诗歌意象描写上帝为雨和雷电设定秩序。译文保留这一神学含义，但不加入原文未明说的系统神学术语。
- issue: חֲזִיז קֹלוֹת 的语义关系
  choice: 正文译作“雷电”
  alternative: 较直译为“雷声中的闪电”或“雷霆的闪电”
  rationale: 该短语可理解为伴随雷声的闪电或雷霆。正文采用自然、简洁的现代汉语，同时以脚注保存希伯来语较具体而略含歧义的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。上下两行保留希伯来诗歌的平行结构；“定下规律／划定路径”既自然，又呈现上帝为受造界设立秩序的意象。
