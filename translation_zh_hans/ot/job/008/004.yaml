base_translation:
  language: en
  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: zh_hans
  text: 你的儿子若得罪了他，他就把他们交在他们过犯的手中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在……的手中”是希伯来语惯用说法，意为处在……的权势之下；本句也可译作：“他就任凭他们落入自己过犯的权势之下。”
    reason: 说明希伯来语意象并提供较意译的表达。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 保留条件句的通常语气，不把比勒达的推论强化为既定因果事实。
- source_word: בָּנֶיךָ
  choice: 你的儿子
  rationale: בנים为阳性复数；译作“儿子”保留原文的性别指向，不泛化为“儿女”。
- source_word: חָטְאוּ לוֹ
  choice: 得罪了他
  rationale: חטא与ל连用可表示冒犯某一对象；“得罪了他”是自然的现代汉语表达，同时保留代词形式。
- source_word: וַיְשַׁלְּחֵם
  choice: 他就把他们交在
  rationale: שלח本义为“差遣、送出”，但与后面的“在……手中”结合，表达交付于某种权势或后果之下；“交在”既通顺又保留司法性意味。
- source_word: בְּיַד
  choice: 在……的手中
  rationale: 保留希伯来语以“手”表示掌控或权势的意象，并在脚注说明其含义。
- source_word: פִּשְׁעָם
  choice: 他们的过犯
  rationale: פשע常带有越界、悖逆的意味；“过犯”与前面的חטא有所区分，不将两个词都简化为“罪”。
theological_decisions:
- issue: “他”的所指
  choice: 保留代词“他”
  alternative: 明译为“上帝”
  rationale: 上下文强烈指向上帝，但希伯来文本身使用代词；保留代词可避免把上下文判断直接写入正文。
- issue: 后果分句中的施动与过犯的权势
  choice: “他就把他们交在他们过犯的手中”
  alternative: “他就任凭他们落入自己过犯的权势之下”
  rationale: 正文保留上帝的行动以及“过犯之手”这一拟人化意象，不进一步解释死亡与过犯之间的具体报应机制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“若……就……”清楚呈现条件关系；刻意保留“过犯的手中”这一不寻常但可理解的拟人化表达，以维持原文的修辞张力。
