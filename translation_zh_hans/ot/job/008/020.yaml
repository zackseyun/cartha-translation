id: JOB.8.20
reference: Job 8:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֶן אֵ֭ל לֹ֣א יִמְאַס תָּ֑ם וְ/לֹֽא יַ֝חֲזִ֗יק בְּ/יַד מְרֵעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: zh_hans
  text: 看哪，上帝不弃绝纯全的人，也不扶持作恶之人的手[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不支持作恶之人”；更直译为：“也不握住作恶之人的手。”
    reason: 说明原文短语既可按引申义理解为支持，也可按字面保留握住手的意象。
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 用醒目的诗体语气引出强调性的断言，保留原文庄重而引人注意的作用。
- source_word: אֵל
  choice: 上帝
  rationale: 这是诗歌中对上帝的常用称呼；原文此处没有“全能者”等附加称号。
- source_word: יִמְאַס
  choice: 弃绝
  rationale: 表达拒绝、厌弃之意；“弃绝”兼具关系性和审判意味，又不必限定为内心的憎恶。
- source_word: תָּם
  choice: 纯全的人
  rationale: 该词在此作名词用，指品格完整、无可指责的人；“纯全”也与《约伯记》的核心用语保持一致。
- source_word: יַחֲזִיק בְּיַד
  choice: 扶持……的手
  rationale: 原文具体意象是抓住或扶住某人的手，并可引申为支持、帮助；译文保留“手”的意象，同时传达扶助之意。
- source_word: מְרֵעִים
  choice: 作恶之人
  rationale: 该分词强调实际行恶的人，比泛称“恶人”更能保留其动态含义。
theological_decisions:
- issue: וְלֹא יַחֲזִיק בְּיַד מְרֵעִים这一短语的含义
  choice: 也不扶持作恶之人的手
  alternative: 也不支持作恶之人；也不握住作恶之人的手
  rationale: 原文既有握住某人之手的具体画面，也含支持、援助的引申义。正文兼顾二者，不把它完全抽象化，从而保留原文的形象与语义张力。
translation_notes:
  register: 采用现代、庄重的诗体表达。“看哪”保留原文的强调语气；“纯全的人”和“作恶之人”清楚易懂，并贴合《约伯记》的智慧文学语境。
