  terminology: “欢笑”适切对应 שְׂחוֹק；在此复兴语境中，“欢呼”可自然对应 תְרוּעָה，且不不当限定为礼仪或军事呼喊。脚注保留 עַד 的“直到”读法是必要的。词汇说明中将本段发言者写作“以利法”则有误：约伯记第8章说话者是比勒达，须在审校记录中更正。
