revisions:
- from: 他还要使你满口欢笑[a]，使你两唇发出欢呼。
  to: 他还要使你满口欢笑[a]，使你的双唇充满欢呼。
  rationale: 修订仅调整中文表达与脚注引文：以“你的双唇充满欢呼”恢复原文由“充满”构成的平行结构，并以“双唇”取代较不自然的“两唇”。“还要”保留上下文中的应许性理解；脚注继续保留 עַד 的时间性替代读法。相关说明资料应将“以利法”更正为“比勒达”。
