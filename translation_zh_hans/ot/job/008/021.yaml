  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: zh_hans
  text: 他还要使你满口欢笑[a]，使你的双唇充满欢呼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到他使你满口欢笑，使你的双唇充满欢呼。”
    reason: עַד 既可在此理解为“还要”，也可按其常见时间意义译作“直到”；后者形成不同的句法衔接。
lexical_decisions:
- source_word: עַד
  choice: 还要
  rationale: 这里承接上一节，以利法所说的应许，表达神仍会使这事实现。“还要”符合现代汉语习惯，同时以脚注保留“直到”的时间性读法。
- source_word: יְמַלֵּה
  choice: 他要使……充满
  rationale: 这是 מלא 的 Piel 未完成式第三人称阳性单数；依紧邻上文，主语自然指神。译作“要使……充满”传达将来及应许语气；在正文中采用自然的汉语成语“使你满口……”。
- source_word: שְׂחוֹק
  choice: 欢笑
  rationale: 该名词基本义为“笑”；本节处于复兴和喜乐的语境，因此“欢笑”既保留笑的具体形象，也避免无根据地理解为嘲笑。
- source_word: פִּיךָ
  choice: 你的口（满口）
  rationale: 保留第二人称单数及身体意象；“满口欢笑”是自然、形象的现代汉语表达。
- source_word: וּשְׂפָתֶיךָ
  choice: 使你两唇
  rationale: 直译“你的双唇”，保留与“口”相对的诗歌平行结构；补出“使”使汉语句法流畅。
- source_word: תְרוּעָה
  choice: 欢呼
  rationale: 此词可指响亮的呼喊，常带喜乐或得胜色彩。结合与“欢笑”的平行关系，“欢呼”自然贴切，但不引入礼仪或军事方面的特定含义。
theological_decisions:
- issue: 动词省略的主语
  choice: 以“他”为主语，依上文指神
  alternative: 采用无主或被动表达，如“你的口必充满欢笑”
  rationale: 第20节明确以神为行动者，第21节自然延续这一主语。保留“他”既符合希伯来语动词形式，也表明这里所许诺的恢复来自神。
- issue: עַד 的句法功能
  choice: 正文译为“还要”，表达未来仍将实现的应许
  alternative: 译为“直到”，把本节理解为时间从句或延续性的表述
  rationale: “还要”在上下文中较完整、自然，但 עַד 本身确可表达“直到”；因此不在正文中消除歧义，而在脚注中保留另一读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“满口欢笑”和“两唇发出欢呼”保留希伯来诗歌的身体意象与平行结构；避免使用古奥表达，也不把欢呼限定为礼仪或战争中的呼喊。
