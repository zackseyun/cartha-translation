base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: zh_hans
  text: 难道上帝会颠倒公正[a]吗？难道全能者会颠倒正义吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道上帝会歪曲审判吗？难道全能者会歪曲公义吗？”
    reason: מִשְׁפָּט可侧重“审判”，צֶדֶק也可译为“公义”；“歪曲”是יְעַוֵּת的另一自然译法。
lexical_decisions:
- source_word: הַאֵל
  choice: 难道上帝
  rationale: 疑问词הַ引出是非问句；אֵל在此是通用神圣称号，译为“上帝”。用“难道”自然表达反问语气，但不替经文本身明说答案。
- source_word: יְעַוֵּת
  choice: 会歪曲
  rationale: עוה的Piel形式表示使之弯曲、扭曲，在司法和道德语境中指歪曲或败坏；“歪曲”既保留强烈的负面含义，也符合现代汉语搭配。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 此处指审判和裁断所应遵循的公平原则。“公正”自然简洁，并保留其司法伦理色彩。
- source_word: וְאִם
  choice: （第二分句并列反问）
  rationale: 字面可作“而若”，但在两个平行反问句中承接第二问；汉语无需硬译连接词，并列结构已能表达希伯来语的功能。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 在《约伯记》中作神的称号；译出称号含义而不音译为“沙代”。
- source_word: צֶדֶק
  choice: 正义
  rationale: 可指正直、正义或合乎正道。译为“正义”，既与前句“公正”相关呼应，又保留两个希伯来词的词汇区别。
theological_decisions:
- issue: אֵל与שַׁדַּי两个神圣称号的处理
  choice: 上帝……全能者
  alternative: 伊勒……沙代
  rationale: 二者在本句中作为称号使用。意译使普通读者直接理解其意义，也保留诗句中称号的变化。
- issue: מִשְׁפָּט与צֶדֶק的区分
  choice: 公正……正义
  alternative: 审判……公义；公正……公正
  rationale: 两个词意义重叠，却并不相同。分别译为“公正”和“正义”，避免把平行句完全扁平化，并保留司法公平与道德正当之间的张力。
- issue: 反问语气是否明示
  choice: 以“难道……吗”表达
  alternative: 上帝岂会……？全能者岂会……？
  rationale: 原文形式上是问句，语境中具有明显反问作用。“难道……吗”是自然的现代汉语表达，同时不在正文中另加答案。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“歪曲公正／正义”保留原文司法—道德语境；两个平行分句共用末尾疑问语气，使中文流畅，并保存希伯来诗歌的对称结构。
