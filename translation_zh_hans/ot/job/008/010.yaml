base_translation:
  language: en
  yaml_path: translation/ot/job/008/010.yaml
  text: Will they not teach you and tell you[a], and bring forth words from their heart?
translation:
  language: zh_hans
  text: 他们岂不指教你、告诉你，并从心里说出话来吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂不……吗
  rationale: 引出预期肯定回答的反问；“岂不……吗”自然保留希伯来文的反问语气。
- source_word: הֵם
  choice: 他们
  rationale: 回指上文所说的历代先人；用“他们”简洁自然。
- source_word: יוֹרוּךָ
  choice: 指教你
  rationale: ירה的使役式在此意为教导、训诲；“指教”符合智慧文学的庄重语域。
- source_word: יֹאמְרוּ לָךְ
  choice: 告诉你
  rationale: 直译为“对你说”；“告诉你”与前面的“指教你”搭配自然，同时保留两个不同动作。
- source_word: וּמִלִּבָּם
  choice: 从心里
  rationale: לֵבָב可指内在的人，包括思想和领悟；“从心里”保留原文的人体意象，且现代汉语自然。
- source_word: יוֹצִיאוּ
  choice: 说出
  rationale: 原义为“使出来”；在“话”的语境中，“说出”既自然，也保留言语由内而出的方向性。
- source_word: מִלִּים
  choice: 话
  rationale: 指言语、话语；“说出话来”在现代汉语中比“发出言辞”更自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岂不……吗”保留反问力度；“从心里说出话来”保留希伯来文中言语由内心发出的意象。未加脚注，因为“心里”在现代汉语中也可自然涵盖思想和内在领悟，不致造成明显误解。
