  text: whose confidence is cut off[c][b][a], and whose trust is a spider’s house.
translation:
  language: zh_hans
  text: '他的倚靠必被割断[a][b]，

    他所信赖的，不过是蜘蛛的房屋[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倚靠”也可译作“指望”或“安全感”；这里的希伯来词在本语境中可表达信心、盼望或安全保障。
    reason: lexical_alternative
  - marker: b
    text: “被割断”所译的希伯来动词罕见，词义有争议，也可能有“被截断”的意思；另有解释作“被厌弃”，但在这里可能性较小。
    reason: lexical_alternative
  - marker: c
    text: “蜘蛛的房屋”指蜘蛛所造的居所，也就是蛛网；比喻他的倚靠极其脆弱。
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 他的
  rationale: 关系词承接上文所说忘记上帝的人；汉语不宜孤立地直译为“其……者”，故以“他的”自然衔接。
- source_word: יָקוֹט
  choice: 必被割断
  rationale: 此动词罕见且词义有争议；结合恶人的安全感崩溃以及下句蜘蛛房屋的脆弱意象，“被割断”最贴合语境，同时用脚注保留其他可能。
- source_word: כִּסְלוֹ
  choice: 他的倚靠
  rationale: 此处与 מִבְטַחוֹ 平行，宜取“信心、倚靠、安全感”义，而非“愚妄”或“腰”；“倚靠”在现代汉语中自然且能表示其赖以安心之物。
- source_word: וּבֵית
  choice: 不过是……的房屋
  rationale: 保留“房屋”的具体比喻；“不过是”自然表达平行句中对其信赖对象脆弱性的判定。
- source_word: עַכָּבִישׁ
  choice: 蜘蛛
  rationale: 该词通常指蜘蛛；与“房屋”构成蜘蛛所造居所的意象，也可使人联想到蛛网。
- source_word: מִבְטַחוֹ
  choice: 他所信赖的
  rationale: 该名词可指信赖本身或信赖的对象；此译法有意保留两者之间的语义空间，并避免与上句“倚靠”生硬重复。
theological_decisions:
- issue: 本节所说倚靠崩溃的对象
  choice: 以第三人称泛指上文忘记上帝、不敬虔的人，不增补具体宗教身份
  alternative: 明确译作“恶人的倚靠”或“不敬虔之人的指望”
  rationale: 原文通过关系词承接上下文，本节自身没有重述身份；不应在正文中加入原文未明说的神学限定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文保留“蜘蛛的房屋”这一希伯来意象，不直接改写成“蛛网”，并借脚注说明；两行以“倚靠／所信赖的”呈现希伯来诗歌的平行关系，同时避免完全同词重复。
