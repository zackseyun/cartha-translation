base_translation:
  language: en
  yaml_path: translation/ot/job/008/008.yaml
  text: For please ask the former generation[b][a], and consider the findings of their fathers.
translation:
  language: zh_hans
  text: 因为，请你问问前代的人，并留意他们父辈[b]考察所得[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们父辈的探究（考察）”。希伯来语名词既可指探究的行动，也可指探究所得的成果。
    reason: lexical_alternative
  - marker: b
    text: “他们父辈”也可广义理解为“他们的祖先”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处引出比勒达用来支持前文劝说的理由；“因为”保留了这一承接和论证关系。
- source_word: שְׁאַל נָא
  choice: 请你问一问
  rationale: שׁאל是“询问、求问”的命令式，נָא表示请求或劝请的语气；“请你问一问”自然地传达这种语气。
- source_word: לְדֹר רִישׁוֹן
  choice: 前代的人
  rationale: דּוֹר指“世代”，רִאשׁוֹן在此指从前、较早的世代，并非必然指最初的一代；补出“人”使“向一个世代求问”的希伯来表达在现代汉语中自然清楚。
- source_word: וְכוֹנֵן
  choice: 留心
  rationale: 此处כון的命令式表示使自己专注、把注意力放在某事上；“留心”简洁地保留了主动专注的含义。
- source_word: לְחֵקֶר
  choice: 考察所得
  rationale: חֵקֶר既可指探究、考察这一行动，也可指由此得出的发现或成果；正文采用结果义“考察所得”，并以脚注保留行动义。
- source_word: אֲבוֹתָם
  choice: 他们父辈
  rationale: 复数后缀自然回指“前代的人”，即他们的父辈；“父辈”保留希伯来文的父系祖先表达，同时脚注说明可作更广义的“祖先”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“前代的人”避免把רִאשׁוֹן误解为绝对意义上的“第一代”；“留心……考察所得”兼顾命令语气、平行结构及חֵקֶר的词义歧义。
