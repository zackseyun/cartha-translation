base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: zh_hans
  text: 凡忘记上帝的人，所走的道路都是如此；不敬虔之人[a]的希望必归于无有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“伪善的人”。希伯来语此词也可指不敬虔、亵渎上帝的人。
    reason: 保留传统译法，同时说明该词在此语境中较宽泛的宗教道德含义。
lexical_decisions:
- source_word: כֵּן
  choice: 都是如此
  rationale: 承接上文蒲草枯萎的比喻，并引出对这一类人的概括；“如此”保留其比较和推论作用。
- source_word: אָרְחוֹת
  choice: 道路
  rationale: 该复数名词可指路径，也可比喻人生的行径与结局；“道路”既保留原文意象，也符合中文智慧文学的表达。
- source_word: שֹׁכְחֵי אֵל
  choice: 忘记上帝的人
  rationale: 将希伯来语分词结构自然地译为关系性名词短语；“忘记”在此不只是偶然想不起，也含漠视、背弃之意，但正文保留原词的开放性。
- source_word: תִקְוַת
  choice: 希望
  rationale: 该词可指希望或期待；此处指人所倚仗、盼望实现之事，“希望”自然且贴合上下文。
- source_word: חָנֵף
  choice: 不敬虔之人
  rationale: 该词在《约伯记》中主要表示亵渎、不虔敬或邪恶的人；“不敬虔之人”比现代汉语中的“伪善者”范围更准确，并避免把含义限缩为表里不一。
- source_word: תֹּאבֵד
  choice: 必灭没
  rationale: 动词 אבד 表示毁灭、消失或丧失；“灭没”语气庄重，并能表达其希望终必归于无有。
theological_decisions:
- issue: 智慧文学审判语境中 חָנֵף 的译法
  choice: 不敬虔之人
  alternative: 伪善的人
  rationale: 原词强调对上帝不虔敬、亵慢的道德宗教状态，不一定专指假装有德或表里不一；正文采用较宽广的译法，并以脚注保留传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“凡……的人”表达 כָּל 与分词结构的概括性；分号保留两句之间的平行与递进。脚注标记紧随其实际说明的词语 חָנֵף，而非置于“上帝”之后。
