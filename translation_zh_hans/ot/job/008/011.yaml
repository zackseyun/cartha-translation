  language: zh_hans
  text: 纸莎草岂能在没有沼泽的地方生长？芦苇岂能没有水而繁茂？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纸莎草”也可译作“蒲草”或“莎草”；“芦苇”也可泛译作“沼泽草”。希伯来文在两个平行分句中用了两种湿地植物的名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִגְאֶה
  choice: 岂能……长大
  rationale: 疑问词引出反问；גאה在这里描述植物生长。“长大”既符合植物语境，也保留其向上长起的意味。
- source_word: גֹּמֶא
  choice: 蒲草
  rationale: 该词指生长于湿地的纸莎草或灯心草类植物。“蒲草”是现代汉语中自然易懂的湿地植物名称，同时避免把具体物种认定得过死。
- source_word: בְּלֹא בִצָּה
  choice: 在没有沼泽的地方
  rationale: בלא表示缺少，ביצה指沼泽或湿地；此译法保留地点意味，并使反问在汉语中自然。
- source_word: יִשְׂגֶּה
  choice: 繁茂
  rationale: שׂגה在本句表示植物旺盛生长；“繁茂”与前半句的“长大”形成恰当而不机械的平行。
- source_word: אָחוּ
  choice: 芦苇
  rationale: 该词泛指水边或沼泽中的草本植物，具体植物种类不能完全确定。“芦苇”便于现代读者理解，并与“蒲草”构成两种湿地植物的平行。
- source_word: בְלִי מָיִם
  choice: 无水
  rationale: 直接表达缺水状态，简洁地保留植物对水的依赖。
