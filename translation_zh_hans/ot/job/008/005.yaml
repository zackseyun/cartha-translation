base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: zh_hans
  text: 但你若切切寻求上帝[a]，向全能者恳求恩惠[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“清早寻求上帝”；这里的希伯来语动词既可表示清早寻求，也可表示殷切、勤勉地寻求。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语作“沙代”，传统上译为“全能者”。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: 但你若
  rationale: אִם引出条件从句；结合上文语篇关系，以“但……若”表达转折和条件。
- source_word: אַתָּה
  choice: 你
  rationale: 原文显式使用第二人称阳性单数代词；汉语保留“你”，自然且能体现直接指向。
- source_word: תְּשַׁחֵר
  choice: 切切寻求
  rationale: שׁחר的Piel形态可指清早寻求，也可引申为殷切、勤勉地寻求；本句祈求语境中，“切切寻求”自然地传达迫切和认真，同时用脚注保留时间意义的可能。
- source_word: אֶל אֵל
  choice: 寻求上帝
  rationale: 介词אֶל表示朝向；现代汉语中可自然融入“寻求上帝”，不必硬译为“向上帝寻求”。אֵל在此作神的称号，译为“上帝”。
- source_word: וְ/אֶל
  choice: 向
  rationale: 连接词连接两个并列条件动作；汉语以逗号并列即可，אֶל则在“向全能者恳求”中明确表达方向。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 将神圣称号שַׁדַּי译出，而非仅作音译；“全能者”是简体中文中自然、庄重且通行的对应表达。
- source_word: תִּתְחַנָּן
  choice: 恳求恩惠
  rationale: חנן的Hitpael形态表示求恩、求怜悯；“恳求恩惠”既保留所求为恩待的语义，也符合现代汉语表达。
theological_decisions:
- issue: 神圣称号שַׁדַּי的译法
  choice: 全能者
  alternative: 沙代
  rationale: 按称号译义的原则采用“全能者”，使普通读者能直接理解；脚注保留其希伯来语形式“沙代”，避免掩盖原文称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“切切寻求”保留诗歌语体的凝练和迫切感；“恳求恩惠”明确表达求恩的语义。本节是延续至下一节的条件从句，因此句末保留逗号。
