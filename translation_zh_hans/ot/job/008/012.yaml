  naturalness: “它还在嫩芽中”搭配生硬，像是植物处在另一株植物的嫩芽里面。“它正青翠时”简洁、庄重，并与下句的“枯干”形成自然对照。“比一切青草先”也比“比百草先”更贴近原文כָּל חָצִיר，同时在汉语中通顺。
  terminology: “枯干”恰当保留יָבֵשׁ的干枯意象。“采下”可用于上下文的水生植物，且脚注保留“摘下／割下”的词汇选择。脚注不宜把“在花苞中”作为与正文平行的直译而不加限定，因该词的具体植物学指向存在不确定性；以“正发嫩芽时”表达该替代理解较自然。
