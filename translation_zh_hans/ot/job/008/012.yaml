base_translation:
  language: en
  yaml_path: translation/ot/job/008/012.yaml
  text: While it is still in its shoot[a], not cut down[b], it dries up before any other grass.
translation:
  language: zh_hans
  text: 它正青翠时[a]，尚未被采下[b]，就比一切青草先枯干。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正发嫩芽时”或“在花苞中”。希伯来语所用的词指植物鲜嫩的新生部分。
    reason: lexical_alternative
  - marker: b
    text: 或译“尚未被摘下”或“尚未被割下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: 它还在
  rationale: 副词带第三人称阳性单数后缀，表示这植物仍处于某种状态；“它还在”自然引出时间情境。
- source_word: בְאִבּוֹ
  choice: 嫩芽中
  rationale: אֵב／אִב指植物鲜嫩的新生部分，可指嫩芽、青嫩状态或花苞；“嫩芽”保留具体的植物意象，并以脚注注明其他可能。
- source_word: לֹא יִקָּטֵף
  choice: 尚未被采下
  rationale: קטף的未完成式被动形表示尚未被摘取、采下或割取；“被采下”既保留被动语态，也适用于上下文中的水生植物。
- source_word: וְלִפְנֵי כָל חָצִיר
  choice: 就比百草先
  rationale: לִפְנֵי在此表达时间上的比较，即早于其他草枯干；“比百草先”在中文中清楚自然。“就”体现希伯来语连接词在语境中的迅速转折效果。
- source_word: יִיבָשׁ
  choice: 枯干
  rationale: יבש表示变干、干枯；“枯干”同时传达失去水分和植物凋枯的形象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“嫩芽”“采下”“枯干”延续植物比喻；“比百草先”明确表达原文的时间比较，同时没有把比喻背后的神学含义直接写入正文。
