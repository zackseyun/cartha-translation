base_translation:
  language: en
  yaml_path: translation/ot/job/008/015.yaml
  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: zh_hans
  text: 他倚靠自己的房屋[a]，房屋却站立不住；他紧抓住它，它也立不住。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倚靠”也可译作“倚在……上”。希伯来语动词既可指身体靠着某物，也可指依赖某物获得支撑。
    reason: lexical_alternative
  - marker: b
    text: 原文后半句与前半句使用两个表示“站立”的近义动词彼此呼应，描绘他所依靠的东西并不稳固。
    reason: poetic_parallelism
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: 倚靠
  rationale: שׁען 的尼פעל式既可描写身体倚在某物上，也可表示依赖某物获得支撑。“倚靠”保留了具体动作及其所含的依赖意味。
- source_word: עַל
  choice: 靠在／依靠
  rationale: עַל 在这里标示倚靠或支撑的对象；其意义已自然融入“倚靠……房屋”的汉语结构中。
- source_word: בֵּיתוֹ
  choice: 自己的房屋
  rationale: בַּיִת 通常指“房屋”。上下文中虽可能带有象征意味，但译文保留原有意象，不将其解释成“家业”“家庭”或“庇护”。
- source_word: וְלֹא יַעֲמֹד
  choice: 房屋却站立不住
  rationale: עמד 表示站立或保持直立；“站立不住”传达其无法稳固支撑的结果。“却”自然表达此处的转折。
- source_word: יַחֲזִיק
  choice: 紧抓住
  rationale: חזק 的使役式在此可指抓住、牢牢握住。“紧抓住”保留了鲜明的身体动作，没有把它弱化为单纯的心理依赖。
- source_word: בּוֹ
  choice: 房屋
  rationale: 介词 בּ 与 חזק 连用时标示所抓住的对象。汉语重复“房屋”可避免代词指向含混，并维持诗句的清晰度。
- source_word: וְלֹא יָקוּם
  choice: 房屋也立不起来
  rationale: קום 可表示起来、站起或确立。这里与前面的 עמד 平行；“立不起来”既保留两词间细微差别，也呈现整个结构无法稳立的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自己的房屋”保留希伯来语的具体意象；两个分句分别用“站立不住”和“立不起来”，既保持诗体平行，也避免完全机械的重复。所有脚注标记均置于正文相应位置。
