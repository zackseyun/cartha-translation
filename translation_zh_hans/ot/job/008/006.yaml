base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: zh_hans
  text: 你若纯洁正直，他现在必为你奋起[a]，恢复你公义的居所[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你奋起”也可译作“为你醒来”或“为你的缘故行动起来”。
    reason: lexical_alternative
  - marker: b
    text: “恢复”也可译作“使完整”或“偿还”。
    reason: lexical_alternative
  - marker: c
    text: 直译是“你公义的居所”或“你公义之居所”。“公义”与“居所”的关系未被原文进一步限定，也可能指与你的公义相关的家园。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 作为标准条件连词，引出比勒达所提出的条件；简洁而符合庄重的现代汉语。
- source_word: זַךְ
  choice: 纯洁
  rationale: 在智慧文学语境中指道德上的纯净；“纯洁”与“正直”搭配自然，也不至于过度强化为法庭意义上的“无罪”。
- source_word: יָשָׁר
  choice: 正直
  rationale: 准确表达智慧文学中常见的道德端正之意。
- source_word: כִּי עַתָּה
  choice: 现在必
  rationale: 把כִּי理解为强调语气，结合עַתָּה表达结果的确定性和即时性；汉语用“现在必”自然承接条件句。
- source_word: יָעִיר עָלֶיךָ
  choice: 为你奋起
  rationale: 保留עור使役形“唤醒、激起”的动态意象，并以“为你”表达עָלֶיךָ在此处“为你、为你的缘故”的关系。
- source_word: וְשִׁלַּם
  choice: 使……复原
  rationale: שׁלם的加强词干可指使完整、补还或恢复；以居所为宾语时，“使……复原”贴合语境，同时不完全排除使之完满的含义。
- source_word: נְוַת
  choice: 居所
  rationale: 表示住处、家园或居住之地；“居所”兼具自然性与庄重感。
- source_word: צִדְקֶךָ
  choice: 你公义的
  rationale: 原文为“你的公义”与“居所”构成属格结构；正文用形容性表达使汉语通顺，脚注保留直译及其可能关系。
theological_decisions:
- issue: 后半句动词的隐含主语
  choice: 正文用“他”，由上下文指向上帝，不直接补出“上帝”
  alternative: 明确译为“上帝必为你奋起”
  rationale: 希伯来文动词包含第三人称阳性单数主语，但本节没有明说名词“上帝”。保留“他”既忠于形式，也可由上下文理解。
- issue: 比勒达话语的神学力度
  choice: 照译为带确定语气的条件性主张，不在正文中加以赞同或纠正
  alternative: 弱化为“也许他会……”或加入叙述者的保留语
  rationale: 本节是比勒达的发言；翻译应忠实呈现其报应观主张，同时不把人物言论当作叙述者的直接背书。
- issue: “公义的居所”的关系
  choice: 保留可理解为因公义而蒙认可、与公义相称的居所
  alternative: 解释性译为“恢复你这义人的家业”
  rationale: 原文“你公义的居所／你公义之居所”关系紧密但并未完全说明“公义”修饰居所、主人还是家庭状态，不宜在正文中单一化。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“纯洁正直”保留智慧文学的道德词汇组合；“奋起”维持原文的苏醒／行动意象；“居所”比“住宅”更适合诗体，也可涵盖家庭与家业。所有脚注标记均置于正文相应词组之后。
