  yaml_path: translation/ot/job/008/002.yaml
  text: How long will you keep saying these things[a], and the words of your mouth be a mighty wind?
translation:
  language: zh_hans
  text: “你说这些话要到几时？你口中的言语是一阵强风。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד אָן
  choice: 要到几时
  rationale: 采用自然且庄重的汉语疑问表达，保留比勒达不耐烦的责问语气。原文这一问语统摄两个并列分句，因此译文在第二分句补出“到几时”，使汉语清楚流畅。
- source_word: תְּמַלֶּל
  choice: 说
  rationale: 此处指持续说出前述言论；汉语“说……要到几时”本身已表达持续意味，无须另加“不断”，以免过度强化。
- source_word: אֵלֶּה
  choice: 这些话
  rationale: 复数指向约伯先前所说的内容；译作“这些话”在汉语中自然，也与下半句的“言语”形成诗体呼应。
- source_word: וְרוּחַ כַּבִּיר
  choice: 像狂风
  rationale: רוּחַ在此形成风的比喻，כַּבִּיר表示强劲、猛烈。译作“狂风”保留话语声势猛烈的形象，同时不把比喻明确解释为空洞或狂妄。系词关系在汉语中以“像”自然呈现。
- source_word: אִמְרֵי פִיךָ
  choice: 你口中的言语
  rationale: 保留原文“你口中的话语”这一具体而强调的结构，并维持上下两行的诗意平行。
