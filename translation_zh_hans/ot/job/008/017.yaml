  text: His roots are intertwined over a stone heap[a]; he sees a house of stones.
translation:
  language: zh_hans
  text: 他的根盘结在石堆上；他看见石屋[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “石屋”对应希伯来语“石头之家”，也可理解为石砌的房屋或多石之地；后半句也可译作“他看着一所石头的房屋”。
    reason: 希伯来语短语“石头之家”在植物意象中的具体所指不确定；视觉动词可译为“看见”或“看着”，但原文并未明确表示“探入”。
lexical_decisions:
- source_word: עַל גַּל
  choice: 在石堆上
  rationale: עַל表示根与石堆的位置关系；גַּל在这里结合下句的“石头”意象，宜理解为石块堆，而非泛指土丘。
- source_word: שָׁרָשָׁיו
  choice: 他的根
  rationale: 保留第三人称所有关系和把人比作植物的诗歌隐喻。
- source_word: יְסֻבָּכוּ
  choice: 盘结
  rationale: 该动词描写根彼此缠绕、交错；“盘结”简洁自然，也符合根在石块间蔓延的形象。
- source_word: בֵּית אֲבָנִים
  choice: 石屋
  rationale: 该短语直译为“石头之家”，可指石砌的建筑，也可能指多石之地；正文用自然而贴近字面的“石屋”，并以脚注保留歧义。
- source_word: יֶחֱזֶה
  choice: 他看见
  rationale: 该动词通常意为“看见、观看”。保留阳性单数主语及拟人化表达，不把视觉动词解释性改写为根“伸入”或“抓住”。
