base_translation:
  language: en
  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: zh_hans
  text: 看哪，这就是它道路的喜乐；另一些要从尘土中萌发。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 这是引人注意并加强语气的话语标记；“看哪”既保留诗歌中的鲜明呼告感，也符合庄重的现代汉语表达。
- source_word: הוּא
  choice: 这
  rationale: 该代词形式上为阳性单数，但在这里可回指上文所描写的整幅景象或植物的结局；译作“这”能自然表达其指示和总结作用，同时在脚注保留指人的读法。
- source_word: מְשׂוֹשׂ
  choice: 喜乐
  rationale: 该名词意为“喜乐、欢喜”；“喜乐”保留原文名词形式及诗意，也没有把此处可能带有的反讽意味解释进正文。
- source_word: דַּרְכּוֹ
  choice: 它道路上
  rationale: דרך可指道路、路径或生命历程。此处延续植物意象，用“它”回指植物，以“道路”保留字面与比喻的双重意味。
- source_word: וּמֵעָפָר
  choice: 要从尘土中
  rationale: 介词מן表示来源；“从尘土中”保留עפר的文学和经文意象，比“土壤中”更贴近原文措辞。
- source_word: אַחֵר
  choice: 另一些
  rationale: 该词形式上是单数，但后接复数动词；“另一些”顺应谓语的复数形式，表达有别的个体取而代之地萌发，同时脚注保留单数译法。
- source_word: יִצְמָחוּ
  choice: 萌发
  rationale: צמח常用于植物发芽、生长；“萌发”简洁而鲜明地保留植物意象，并与复数主语“另一些”相配。
theological_decisions:
- issue: הוּא是指人，还是指上文所述景象
  choice: 正文译为指示性的“这”，并以“它”延续植物意象
  alternative: “他就是自己道路上的喜乐”
  rationale: 上下文以植物比喻不敬虔之人的短暂无根；指示性读法更自然地概括其结局，但希伯来语也容许较具人称色彩的理解，因此不在正文或注释中排除该读法。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“看哪”保留原文的强调语气；“喜乐”不消解原句可能含有的反讽；分号呈现两个并列而彼此关联的诗句。
