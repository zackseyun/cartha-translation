base_translation:
  language: en
  yaml_path: translation/ot/job/008/016.yaml
  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
translation:
  language: zh_hans
  text: 它在阳光下湿润[a]；它的嫩芽在自己的园子上方伸展。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在太阳面前”。也可理解为“在阳光之下”或“迎着日光”，未必是指“日出以前”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“它的嫩芽从自己的园子上长出来。”希伯来语中表示嫩芽的单数名词也可作集合意义理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  choice: 水分充足
  rationale: 该词表示湿润、得到充分水分；译为“水分充足”保留具体的植物意象，又不把含义收窄为“茂盛”。
- source_word: הוּא
  choice: 它
  rationale: 希伯来语虽用阳性代词，但此处直接描写植物；现代汉语用“它”自然，同时上下文中的比喻性关联仍可保留。
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: 在日光面前
  rationale: 尽量保留“在太阳面前”的空间性表达及其歧义；“日光”使汉语读者不易误解为时间上的“日出以前”。
- source_word: וְעַל
  choice: 在……上
  rationale: 保留介词 עַל 的空间含义，并按现代汉语语序组织第二分句。
- source_word: גַּנָּתוֹ
  choice: 自己的园子
  rationale: 保留第三人称阳性单数所属关系；汉语中以“自己的”清楚表示园子属于所描写的对象。
- source_word: יֹנַקְתּוֹ
  choice: 嫩枝
  rationale: 该阴性单数名词指嫩芽、幼枝，也可作集合意义；“嫩枝”符合植物图景且为现代读者易懂。
- source_word: תֵצֵא
  choice: 伸展
  rationale: 原义为“出来、发出”；在枝条越过园地的语境中，“伸展”自然表达向外生长，同时脚注保留更形式对应的译法。
