  yaml_path: translation/ot/job/008/018.yaml
  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
translation:
  language: zh_hans
  text: 若他从原处被吞没[a]，那地方便不认他[b]，说：“我没有见过你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从他的地方”或“从它的地方”。代词既可指画面中的人，也可按植物比喻理解；“被吞没”也可按上下文译作“被除灭”。
    reason: lexical_alternative
  - marker: b
    text: “不认他”也可译作“否认他”或“与他断绝关系”。原文动词可表达否认、不认，或以虚假相待。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出条件句，保留诗句的假设意味，不把它改成确定发生的时间事件。
- source_word: יְבַלְּעֶנּוּ
  choice: 他被吞灭
  rationale: בלע在此有吞没、除灭之意；译作“吞灭”既保留原词的具体意象，也能表达从所在之处被彻底除去。希伯来语形式为主动式，施事者未明；汉语用被动表达，避免擅自指定施事者。
- source_word: מִמְּקוֹמוֹ
  choice: 从原处
  rationale: 原文直译为“从他的／它的地方”。“原处”在中文中自然，并保留所指既可联系恶人、也可联系植物意象的空间含义。
- source_word: וְכִחֶשׁ בּוֹ
  choice: 那地方就会否认他
  rationale: כחש可表示否认、不认或背弃。下句以直接引语把“地方”人格化，因此“否认他”准确承接这一修辞。
- source_word: לֹא רְאִיתִיךָ
  choice: 我没有见过你
  rationale: 按字面保留“看见”的具体说法，不扩译为“我不认识你”；完成式在这一否认话语中自然译为“没有见过”。
