  text: Then Bildad the Shuhite answered and said:[a][b]
translation:
  language: zh_hans
  text: 于是，书亚人比勒达回答说：[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回答”或译“回应”。
    reason: lexical_alternative
  - marker: b
    text: “书亚人”指属于书亚族群或来自与书亚有关地区的人。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: ענה在约伯记的对话引言中表示“回答、回应”；“回答”自然地保留了对话承接关系。
- source_word: בִּלְדַּד
  choice: 比勒达
  rationale: 采用现代中文圣经中通行且易识别的人名音译。
- source_word: הַשּׁוּחִי
  choice: 书亚人
  rationale: 这是族属或地域称谓，指与书亚有关的人；译作“书亚人”既清楚又符合现代汉语表达。
- source_word: וַיֹאמַר
  choice: 说
  rationale: אמר在叙事引语公式中通常意为“说”。中文以“回答说”表达希伯来文两个动词，既保留其结构，也避免生硬。
- source_word: וַ
  choice: 于是
  rationale: 句首连接词推进叙事并承接前文；“于是”比直译为“和”更符合现代汉语篇章衔接。
