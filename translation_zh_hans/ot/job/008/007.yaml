  yaml_path: translation/ot/job/008/007.yaml
  text: Though your beginning was small[a], your latter end will increase greatly.
translation:
  language: zh_hans
  text: 你起初虽然微小[a]，后来却必极其昌盛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的起初微小，但你的将来必变得极其强盛。”
    reason: 希伯来语句首的连接词可按单纯并列或转折理解；אַחֲרִית也可译为“将来”，יִשְׂגֶּה可直译为“变得强盛”。
lexical_decisions:
- source_word: וְהָיָה
  choice: 虽然
  rationale: 该连接词与完成式在诗歌语境中可表达与下半句相对的让步背景；译作“虽然”自然呈现今昔对比，同时以脚注保留并列理解。
- source_word: רֵאשִׁיתְךָ
  choice: 你起初
  rationale: רֵאשִׁית指开端或初期；“你起初”简洁自然，表达初始景况。
- source_word: מִצְעָר
  choice: 微小
  rationale: 该词表示小、微不足道；“微小”既准确，又与下半句的强烈增长形成鲜明对照。
- source_word: אַחֲרִיתְךָ
  choice: 后来
  rationale: אַחֲרִית可指结局、后期或未来；“后来”在本句中自然涵盖日后的景况，同时避免把含义限定为生命终点。
- source_word: יִשְׂגֶּה
  choice: 昌盛
  rationale: 该动词表示增大、增长或变得强盛；结合主语所指的日后景况，“昌盛”以自然汉语传达大幅增长之意。
- source_word: מְאֹד
  choice: 极其
  rationale: מְאֹד是强烈程度副词；“极其”保留其强调力度，并与“昌盛”搭配自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“微小—极其昌盛”保留原文两行诗句的鲜明对比；正文用让步结构呈现语境中的对照，脚注保留较贴近形式的并列译法及主要词义选择。
