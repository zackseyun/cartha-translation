base_translation:
  language: en
  yaml_path: translation/ot/job/008/009.yaml
  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: zh_hans
  text: 因为我们不过是昨日才有的[a]，并无所知；因为我们在地上的日子不过如影子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们只是昨日之人。”意思是，人类出现不久，因此知识有限。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 首个כִּי承接上文，引出比勒达要求人向先辈求教的理由；“因为”自然保留其解释作用。
- source_word: תְמוֹל אֲנַחְנוּ
  choice: 我们不过是昨日才有的人
  rationale: 保留“昨日”的诗性意象，同时用“才有的人”表达人的来历甚近、经验有限；“不过”传达语境中的短暂无足。
- source_word: וְלֹא נֵדָע
  choice: 并无所知
  rationale: 对应否定词加ידע第一人称复数未完成式，不另补特定宾语；措辞简洁庄重，也保持其概括性。
- source_word: כִּי
  choice: 因为
  rationale: 第二个כִּי说明人知识有限的根据。重复“因为”保留希伯来文的论证结构，虽在汉语中略有诗性重复。
- source_word: צֵל
  choice: 影子
  rationale: 保留原文以影子表现人生短暂、转瞬即逝的比喻，不改释为抽象的“短暂”。
- source_word: יָמֵינוּ
  choice: 我们的日子
  rationale: 直接表达带第一人称复数后缀的名词，指众人在世的年日。
- source_word: עֲלֵי אָרֶץ
  choice: 在地上
  rationale: 自然表达人的年日在尘世度过，同时保留与天上领域相对的空间措辞。
