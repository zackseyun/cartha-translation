base_translation:
  language: en
  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: zh_hans
  text: 恨你的人必披戴羞耻；恶人的帐棚必不复存在。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶人的帐棚不存在。”
    reason: 希伯来文末句形式上是存在否定，可较直译为现在式；正文依上下文表达为将来的结果。
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: 恨你的人
  rationale: Qal主动分词复数带第二人称阳性单数后缀，在句中作名词用；“恨你的人”自然保留了所指对象“你”。
- source_word: יִלְבְּשׁוּ
  choice: 必披戴
  rationale: לבשׁ本义为“穿上、披戴”。与抽象名词“羞耻”连用时，“披戴羞耻”既保留希伯来文的衣着隐喻，也符合庄重的汉语诗歌表达。
- source_word: בֹשֶׁת
  choice: 羞耻
  rationale: 兼顾内在羞愧与公开受辱的含义，不额外限定为单纯情绪或社会名誉。
- source_word: וְאֹהֶל
  choice: 帐棚
  rationale: אֹהֶל字面意为“帐棚”；在智慧文学中也可转指住所或家室，但正文保留具体意象。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: 复数实体化形容词，指邪恶之人这一类；现代汉语用“恶人”可自然表达集合意义。
- source_word: אֵינֶנּוּ
  choice: 必不复存在
  rationale: 形式上是带第三人称阳性单数后缀的存在否定“它不存在”；结合上半句的未完成式及8:20–22的结果性语境，以“必不复存在”表达预期结局，同时用脚注保留较字面的时态歧义。
theological_decisions:
- issue: 末句的时间指向
  choice: 按将来／结果义译为“恶人的帐棚必不复存在”
  alternative: 按形式较直译为“恶人的帐棚不存在”
  rationale: 希伯来文末句本身是存在否定，并未明标将来时；但本节上半句及上下文陈述将出现的结局，因此正文采用将来／结果表达，脚注保留形式上较直接的读法，避免把语境判断说成唯一语法可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“披戴羞耻”保留原文诗性隐喻；“帐棚”保留智慧诗歌中的具体居所意象。分号呈现两行之间的并列与对照。脚注标记置于其实际说明的末句之后。
