  yaml_path: translation/ot/job/030/024.yaml
  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: zh_hans
  text: 诚然，人不会向废墟下手[a]；若他遭难，便会有求救的呼声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文十分晦涩。“废墟”也可译作“瓦砾堆”，前半句亦可直译为“向废墟伸手”。后半句中“若”后的句法关系不明确；其中一个难解形式可被理解为“从他们而来”“向他们”或“为他们”，但其所指不能确定。因此，后半句也可作类似译法：“若他遭难，就有从他们而来的求救声。”
    reason: 原文中“废墟”一词罕见；לָהֶן的所指及其与“求救的呼声”的关系不明，两个分句之间的关系也有争议。
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 这里承接约伯上一节所说自己遭受攻击的处境，取转折义较自然；同时不把语气过度限定为断言性的“必然”。
- source_word: בְּעִי
  choice: 向废墟
  rationale: 此词罕见，含义和构词均有困难，通常联系“废墟、瓦砾堆”。译文保留这一具体意象，并用脚注说明其他可能理解。
- source_word: יִשְׁלַח יָד
  choice: 伸手攻击
  rationale: 保留“伸手”的希伯来语意象，同时补出语境中的敌对含义，使现代汉语读者不至误解为援手。
- source_word: אִם
  choice: 岂不……吗
  rationale: 本节句法极难；此处将 אִם 理解为引出反问，与前半句形成并列的常理陈述，但不声称这是唯一可能的句法分析。
- source_word: בְּפִידוֹ
  choice: 在灾祸中
  rationale: פיד 指灾难、毁灭性的祸患；译作“灾祸”既准确又符合现代庄重汉语。
- source_word: לָהֶן
  choice: 不单独译出
  rationale: 该形式在这里的所指和句法功能不明，也可能与文本传承或读法有关；正文不强行补出含义，相关困难在脚注中交代。
- source_word: שׁוּעַ
  choice: 呼求救助
  rationale: 该词表示困境中的求救呼声；采用动词化表达，使反问句在汉语中自然清楚。
theological_decisions:
- issue: 本节是在陈述普遍常理，还是具体描述废墟中的求救声
  choice: 译为两个相连的反问句，表达受击者在灾祸中求救这一常理
  alternative: “人总不会向废墟伸手；废墟遭难时，其中却有求救声。”
  rationale: 希伯来文本高度晦涩。正文采用与约伯受苦、呼救的上下文较连贯的理解，但以脚注保留第二分句及整体结构的其他可能读法，不据此引申特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以反问保留诗歌的论辩语气；正文力求可读，但借脚注明示希伯来原文的词义和句法不确定性。
