  text: who pluck saltwort among the bushes[b][a], and the root of broom shrubs is their food.
translation:
  language: zh_hans
  text: 他们在灌木丛中采摘盐生草[a]，金雀花的根就是他们的食物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锦葵”。这个希伯来植物名所指不确定，可能是一种耐盐的野生植物。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们的饼”；“饼”在这里可泛指食物或维生之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּטְפִים
  choice: 采摘
  rationale: קטף表示从植物上摘取；“采摘”既保留具体动作，也符合这些人在荒野觅食的语境。分词在上下文中继续描写前一节所说的人，中文自然译作“他们……采摘”。
- source_word: מַלּוּחַ
  choice: 盐生草
  rationale: 该希伯来植物名所指不确定，可能是一种耐盐的野生植物。“盐生草”传达其可能特性，同时避免把它误认作现代植物分类中的某一确定物种。
- source_word: עֲלֵי שִׂיחַ
  choice: 在灌木丛中
  rationale: 这里的介词短语很可能表示在灌木附近或其间觅食的地点；“在灌木丛中”自然地保留了荒地采集的画面。
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: 金雀花的根
  rationale: רְתָמִים指荒漠中的一种金雀花属灌木；希伯来文以单数“根”配合复数植物名，中文用类称表达“金雀花的根”较自然。
- source_word: לַחְמָם
  choice: 就是他们的食物
  rationale: לֶחֶם字面可指“饼、粮”，也常泛指食物或维生之物。此处所吃的是植物根，因此译作“食物”比字面的“饼”更清楚，并以脚注保留原词形象。
