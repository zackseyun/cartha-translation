  text: בֵּין שִׂיחִ֥ים יִנְהָ֑קוּ תַּ֖חַת חָר֣וּל יְסֻפָּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/007.yaml
  text: Among the bushes they bray[b][a]; under the nettles they huddle together.
translation:
  language: zh_hans
  text: 他们在灌木丛中像驴一样嘶叫；在荨麻[b]下挤作一团[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“聚集在一起”或“蜷缩在一起”。希伯来语动词含有聚拢或紧挨在一起的意思；在本处的确切意味不能确定。
    reason: lexical_alternative
  - marker: b
    text: 或译：“刺灌木”或“荆棘丛”。这个希伯来语植物名称具体指哪一种植物，不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: 在……中
  rationale: 该介词与复数名词连用时可表示“在……之间”或“在……当中”；此处译为“在……中”更符合现代汉语表达。
- source_word: שִׂיחִים
  choice: 灌木丛
  rationale: 该词指低矮的灌木或荒野草木；“灌木丛”既自然，也符合上下文的荒凉环境。
- source_word: יִנְהָקוּ
  choice: 像驴一样嘶叫
  rationale: 动词 נהק通常指驴的鸣叫。译文明确保留这种动物化的刺耳意象，而不弱化为泛泛的“呻吟”或“呼喊”。
- source_word: תַּחַת
  choice: 在……下
  rationale: 忠实表达直接的空间关系，并采用自然的现代汉语句式。
- source_word: חָרוּל
  choice: 荨麻
  rationale: 该植物名称指一种带刺或令人不适的野生植物，但具体品种不能确定；“荨麻”是传统且易懂的对应词，同时以脚注保留其他可能。
- source_word: יְסֻפָּחוּ
  choice: 挤作一团
  rationale: 这个被动或强化形态表达聚在一起、紧贴成群的状态；“挤作一团”自然地呈现他们在野草下蜷聚的凄苦景象，同时不把原因说得过明。
