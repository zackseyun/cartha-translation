lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: 变得
  rationale: 此处尼法勒式表达状态的转变；“变得”自然保留了变化之意，又不额外限定为反身动作。
- source_word: לְאַכְזָר
  choice: 残酷
  rationale: אַכְזָר表示残酷、无情；作谓语译为“残酷”直接而自然。
- source_word: לִי
  choice: 向我
  rationale: 保留介词所表达的关系和方向；敌对意味由整句语境呈现。
- source_word: בְּעֹצֶם
  choice: 用大能
  rationale: עֹצֶם在此表示力量、威力，בְּ具有工具或凭借之意；“用大能”简洁自然。
- source_word: יָדְךָ
  choice: 你的手
  rationale: 保留原文具体的“手”这一拟人化意象，不将其抽象化为“能力”。
- source_word: תִשְׂטְמֵנִי
  choice: 敌对我
  rationale: שׂטם表示怀有敌意、敌对或攻击；“敌对我”保留其敌意和行动性，同时不额外加入持续追逼的含义。
theological_decisions:
- issue: 对上帝行动的拟人化描述和直接控诉
  choice: 保留第二人称直诉以及“你的手”的具体形象
  alternative: 弱化为“你的能力与我作对”
  rationale: 约伯的哀诉刻意以尖锐、关系性的语言向上帝发言；译文应保留这种神学张力，不替原文缓和控诉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向我变得残酷”略带原文式的张力，但语义清楚；分号保留两诗行之间的紧密并列。
