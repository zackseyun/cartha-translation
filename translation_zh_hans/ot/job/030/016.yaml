  text: And now my soul is poured out within me[a]; days of affliction seize me.
translation:
  language: zh_hans
  text: 如今，我的心倾倒在我里面[a]；困苦的日子抓住我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心倾倒在我身上。”希伯来语介词的字面意思是“在我之上／身上”，但这个说法很可能描写内在的崩溃。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 保留时间转折的语篇作用，以自然、凝练的现代汉语引出约伯当前的境况；上下文中的对比不必另加“但是”来明说。
- source_word: עָלַי
  choice: 在我里面
  rationale: 介词字面为“在我之上／身上”，但与“心魂倾倒”连用时很可能描写内在的崩溃。正文采用合乎汉语习惯的表达，并以脚注保留字面可能。
- source_word: תִּשְׁתַּפֵּךְ
  choice: 倾倒
  rationale: 保留שפך的倾倒、流泻意象，也体现该形式所描绘的自我耗尽状态；不改译为解释性更强的“消融”或“崩溃”。
- source_word: נַפְשִׁי
  choice: 我的心魂
  rationale: נפש在此可指生命、自我或内在生命。“心魂”既保留诗性与整体人格意味，也比单用“灵魂”更自然地传达内在痛苦，避免把希伯来人观窄化为后来的身魂二分。
- source_word: יֹאחֲזוּנִי
  choice: 抓住了我
  rationale: 准确传达אחז的抓住、攫住之意，并让“困苦的日子”这一拟人化主语在现代汉语中保持鲜明力度。
- source_word: יְמֵי עֹנִי
  choice: 困苦的日子
  rationale: עֹנִי可指患难、苦楚、卑微或贫困；本段涉及广泛的痛苦和受辱，因此“困苦”既不局限于贫穷，也保留其多层含义。
