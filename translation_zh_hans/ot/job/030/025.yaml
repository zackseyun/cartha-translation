  text: אִם לֹ֣א בָ֭כִיתִי לִ/קְשֵׁה י֑וֹם עָֽגְמָ֥ה נַ֝פְשִׁ֗/י לָ/אֶבְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/025.yaml
  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: zh_hans
  text: 我岂没有为遭遇苦难的人哭泣？我的心岂没有为穷乏人悲伤？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遭遇苦难的人”原文直译近于“日子艰难的人”，也可译作“身处患难的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: 岂没有……？
  rationale: 这里不是普通的条件句，而是反问式的自我申辩；“岂没有”既自然，也保留约伯强调自己确曾如此行的语气。
- source_word: בָכִיתִי
  choice: 哭泣
  rationale: 该动词指流泪、哀哭；“哭泣”保留诗句的感情色彩与庄重语体。
- source_word: לִקְשֵׁה יוֹם
  choice: 为遭遇苦难的人
  rationale: 希伯来语直译近于“为日子艰难者”，指处在艰难困苦中的人。正文采用自然汉语表达，脚注保留原文意象及其他可能译法。
- source_word: עָגְמָה
  choice: 悲伤
  rationale: 该动词表达忧愁、痛苦或悲伤，与上半句的“哭泣”平行；“悲伤”不过度限定为苦毒。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נֶפֶשׁ在此指约伯内在的自我和情感生命。现代汉语以“我的心”较自然地传达此义，同时保持诗意，不把它技术性地限定为与身体分离的“灵魂”。
- source_word: לָאֶבְיוֹן
  choice: 为穷乏人
  rationale: אֶבְיוֹן指贫穷、缺乏而需要帮助的人；“穷乏人”比单纯“穷人”更能体现其困乏和需要，且符合庄重诗体。
theological_decisions:
- issue: נַפְשִׁי的人论含义
  choice: 译作“我的心”，指约伯内在的自我与情感
  alternative: 译作“我的灵魂”或直接译作“我”
  rationale: 原文是诗性的整体人格表达，并非在界定灵魂与身体的关系。“我的心”在现代汉语中能自然传达内心悲痛，又避免引入技术性的人论结论。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两句均保留反问结构，以呈现约伯的自我申辩；“哭泣／悲伤”和“遭遇苦难的人／穷乏人”形成希伯来诗歌的平行关系。
