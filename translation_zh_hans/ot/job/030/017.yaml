  text: At night my bones are pierced in me[b][a], and my gnawing pains do not lie down.
translation:
  language: zh_hans
  text: 夜间，我的骨头在我里面被刺穿[a]；啃噬我的疼痛[b]从不安歇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文措辞艰深；“刺穿”也可译作“凿穿”，或较笼统地译作“啃噬”。相关介词短语直译近于“从我上面”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的筋脉”或“我的血脉”；此词罕见，可能本指体内的筋络或脉管；本译文按上下文把它理解为借指疼痛。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: 夜间
  rationale: 作时间状语，简洁自然地表达“在夜里”。
- source_word: עֲצָמַי
  choice: 我的骨头
  rationale: 保留原文具体的身体意象，不笼统译作“身体”或“躯体”。
- source_word: נִקַּר מֵעָלָי
  choice: 在体内仿佛被刺穿
  rationale: נקר的核心义为“凿穿、刺穿”；מֵעָלָי字面近于“从我上面”，在此难以直译。“在体内”按身体受苦的语境表达其位置；加入“仿佛”使现代汉语不至于误解为骨头实际遭器械穿刺，同时保留强烈的疼痛比喻。
- source_word: וְעֹרְקַי
  choice: 啃噬我的疼痛
  rationale: 该词罕见且含义有争议；上下文和“不安歇”的拟人表达支持将它理解为持续啃噬约伯的痛楚。脚注保留“筋脉”等身体组织的可能解释。
- source_word: לֹא יִשְׁכָּבוּן
  choice: 不得安歇
  rationale: 字面为“不躺下”。“不得安歇”既保留休息的意象，也自然表达疼痛从不停息。
