  text: מֵעַ֖/י רֻתְּח֥וּ וְ/לֹא דָ֗מּוּ קִדְּמֻ֥/נִי יְמֵי עֹֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/027.yaml
  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: zh_hans
  text: 我里面翻腾不止[a]；困苦的日子迎面而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我腹中沸腾，不能平静；苦难的日子临到我。”
    reason: 原文的身体意象及 דמם、קדם 的语义范围可分别译作“腹中沸腾”“不能平静”和“临到”。
lexical_decisions:
- source_word: מֵעַי
  choice: 我里面
  rationale: 原词字面指内脏、腹中，也可在诗歌中表示人的内在感受；“我里面”既保留身体内部的意象，又符合现代汉语表达，避免将其限定为“心”。
- source_word: רֻתְּחוּ
  choice: 翻腾
  rationale: 该词源于“沸腾、滚沸”；结合“里面”使用“翻腾”，自然地传达内在如沸腾般的剧烈不安，同时保留鲜明的身体隐喻。
- source_word: וְלֹא דָמּוּ
  choice: 不止
  rationale: דמם 可指静止、沉寂或止息；“不止”保留持续不息之意，并与“翻腾”自然搭配。
- source_word: קִדְּמֻנִי
  choice: 迎面而来
  rationale: קדם 在此有迎上、遇见之意，主语“困苦的日子”带有拟人色彩；“迎面而来”既表达这些日子来到约伯面前，也传达其逼近之感，而不过度强化为主动敌对。
- source_word: יְמֵי עֹנִי
  choice: 困苦的日子
  rationale: עֹנִי 在此指受苦、患难或悲惨处境，而非专指贫穷；“困苦”涵盖身体与人生境遇中的苦难，适合本段哀歌语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“翻腾不止”凝练呈现持续的内在痛苦；分号保留两小句并列推进的节奏。脚注明示更字面的身体意象和主要词义选择。
