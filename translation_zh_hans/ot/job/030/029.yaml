  text: I have become a brother to jackals[a], and a companion to ostriches.
translation:
  language: zh_hans
  text: 我成了豺狼的弟兄，成了鸵鸟[a]的同伴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“鸵鸟的女儿们”；这是指“鸵鸟”的一种希伯来语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: 弟兄
  rationale: 原词直指“兄弟”。诗歌中表达约伯与荒野哀鸣之兽如同亲族般相连；“弟兄”比“朋友”更直接保留隐喻，也保持庄重语体。
- source_word: הָיִיתִי
  choice: 成了
  rationale: היה 的完成式第一人称单数在此描述约伯落入并处于如今这种境况；现代汉语用“成了”简洁自然。
- source_word: לְתַנִּים
  choice: 豺狼
  rationale: תַנִּים 在荒凉景象的诗歌语境中通常指豺狼，而非旧译传统中的“龙”或笼统的荒野动物。介词 לְ 所表达的关系由“豺狼的弟兄”自然呈现。
- source_word: וְרֵעַ
  choice: 同伴
  rationale: רֵעַ 可指朋友、伙伴或同伴。这里与“弟兄”平行，“同伴”既保留亲近关联，又不过度强调情感友谊。
- source_word: לִבְנוֹת יַעֲנָה
  choice: 鸵鸟
  rationale: 字面为“鸵鸟的女儿们”，是指鸵鸟的希伯来表达。正文译作“鸵鸟”符合现代汉语习惯，字面形式放入脚注。
theological_decisions: []
