  register: 采用现代、庄重而易懂的汉语，保留“弟兄—同伴”的诗歌平行结构与亲族隐喻。第二分句补出“成了”，使汉语节奏自然清楚；不增添原文没有明确说明的哀鸣、荒凉或被弃等解释。
