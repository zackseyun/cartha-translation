base_translation:
  language: en
  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: zh_hans
  text: 我向你呼求，你却不回答我；我站着，你只是凝视我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我曾站立，你仔细察看我。”希伯来文也可理解为过去时间，并带有专注观看或仔细察看的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: 我……呼求
  rationale: שׁוע 的加强词干表达迫切呼救或恳求；“呼求”保留其强烈程度，又不额外限定所求的具体内容。
- source_word: אֵלֶיךָ
  choice: 向你
  rationale: 介词 אֶל 加第二人称阳性单数后缀，在祷告和哀歌语境中自然译为“向你”。
- source_word: וְלֹא תַעֲנֵנִי
  choice: 你却不回答我
  rationale: ענה 在此意为“回答、回应”；“却”自然呈现呼求与不获回答之间的对照。
- source_word: עָמַדְתִּי
  choice: 我站着
  rationale: 该动词形态为完成式，可译为过去时；但上下文是约伯正在陈述的持续困境，汉语“站着”能保留生动的当前感，同时不把时间关系规定得过死。
- source_word: וַתִּתְבֹּנֶן בִּי
  choice: 你只是凝视我
  rationale: התבונן 可表示仔细看、注视或察看。“凝视”体现专注观看的意味；“只是”传达与前句“不回答”形成的语境性反差，却不把它强化为“无视”或“不施救”。
theological_decisions:
- issue: 是否把上帝未回应的含义解释得比希伯来文更强
  choice: 保留约伯关于呼求未获回答、上帝只是凝视他的申诉
  alternative: 译为“你不拯救我”或“你无视我”
  rationale: 原文明确说“不回答”，并描写观看或察看，却没有直接说“不拯救”或“无视”。本译文保留哀诉的张力，不替约伯的陈述增加更强的神学判断。
- issue: 后半句的时态与观看动作的细微含义
  choice: 正文采用生动的当前表达“我站着，你只是凝视我”
  alternative: 按动词形态译为“我曾站立，你仔细察看我”
  rationale: 希伯来文的完成式和连续叙述形式容许过去时间理解，而 התבונן 也可侧重仔细观察或思量。正文依诗歌语境采用当前化表达，脚注保留另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语言。“呼求”“凝视”具有诗性但仍属现代常用书面语；分号保留两组动作之间紧密而尖锐的对照。
