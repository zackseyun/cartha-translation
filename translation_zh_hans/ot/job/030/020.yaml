  terminology: “呼求”恰当表达שׁוע所含迫切求助的力度；“回答我”忠实对应ענה；“凝视”可表达התבונן的专注观看。“只是”与英文审计轨迹一致，作为上下文中“未回答而仅观看”的对比性表达，未增添“不拯救”或“无视”等更强含义。
