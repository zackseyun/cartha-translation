  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
translation:
  language: zh_hans
  text: 我面容昏黑[a]地行走，却不是因日晒[b]；我在会众中站起来呼救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我哀伤地行走”或“我变黑地行走”；希伯来语既可让人想到悲痛，也可指外表变黑。
    reason: lexical_alternative
  - marker: b
    text: 直译“不是由太阳”。意思是他的昏黑并非日晒造成。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: 面色昏黑
  rationale: 该分词可表示变黑、阴沉，也能带出哀恸之意；“面色昏黑”自然地描述约伯外在的暗黑状态，同时不排除悲伤的意味。
- source_word: הִלַּכְתִּי
  choice: 我……
  rationale: 此处动词描述约伯在这种状态中行走、来往；汉语为避免生硬，结合“面色昏黑”表达其持续处境，具体的行走意味则未充分显出。
- source_word: בְּלֹא חַמָּה
  choice: 却不是因太阳
  rationale: 贴近原文“不是由太阳”，保留简洁而略含省略的因果对比，说明其昏黑并非日晒所致。
- source_word: קַמְתִּי
  choice: 站起来
  rationale: 准确表达קום的起身、站立动作，也符合公开在人群中发出呼求的场景。
- source_word: בַקָּהָל
  choice: 在会众中
  rationale: קהל指聚集起来的人群；“会众”庄重自然，又不限定为后来的特定宗教组织。
- source_word: אֲשַׁוֵּעַ
  choice: 呼求援助
  rationale: שוע在此表示困苦中的求助呼喊；“呼求援助”明确呈现其恳切求救的性质。
