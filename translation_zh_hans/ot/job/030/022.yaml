  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: zh_hans
  text: 你把我举到风中[a]，使我乘风而行；又使我在风暴中[b]消融。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你把我举在风上，并使我乘着它。”
    reason: lexical_alternative
  - marker: b
    text: 本节最后一个希伯来词很难确定，可能与风暴、轰鸣的动荡或毁灭有关。因此末句也可译作：“又使我消融，归于毁灭。”
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: 你把我举到
  rationale: נשׂא可表示“举起、承载、带走”。这里保留被强力举起的具体图像，同时符合现代汉语表达。
- source_word: אֶל רוּחַ
  choice: 风中
  rationale: רוּחַ可指“风、气息、灵”；本节的乘驾及破坏性意象以“风”最合语境。将介词短语自然译为“到风中”。
- source_word: תַּרְכִּיבֵנִי
  choice: 使我乘风而行
  rationale: 这是רכב的使役式，意为“使……乘驾”。“乘风而行”自然表达希伯来文未明说但由上句可知的所乘对象。
- source_word: וּתְמֹגְגֵנִי
  choice: 又使我……消融
  rationale: מוג含有“熔化、消融、使瘫软”的意思。“消融”保留约伯被彻底瓦解的强烈诗意，不把它弱化为单纯的摇荡。
- source_word: תשוה
  choice: 在风暴中
  rationale: 末词文本和词义均十分困难。正文采用与本节风的意象相连、在语境中通顺的“在风暴中”，同时以脚注保留“毁灭”等其他可能理解。
