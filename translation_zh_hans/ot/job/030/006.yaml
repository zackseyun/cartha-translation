  yaml_path: translation/ot/job/030/006.yaml
  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: zh_hans
  text: 他们住在旱溪谷的沟壑中[a]，栖身在尘土的洞穴和岩石间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们住在溪谷的峡沟里。”נְחָלִים可按语境指旱溪、急流河床或山谷。
    reason: lexical_alternative
  - marker: b
    text: 或译：“栖身在地洞和岩穴中。”原文也可理解为“尘土的洞穴和岩石间”；末尾的“岩石”可能指独立的居住地点，也可能与“洞穴”相连，指岩穴或岩缝。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: 在……的沟壑里
  rationale: עָרוּץ指水流冲刷形成的切口、沟渠或峡沟；“沟壑”在现代汉语中自然，并保留崎岖、受侵蚀的地貌意象。
- source_word: נְחָלִים
  choice: 旱溪谷
  rationale: נַחַל可指季节性有水的河道、旱溪或溪谷。“旱溪谷”体现近东季节性水道的地理特征，又比音译词更便于普通读者理解。
- source_word: לִשְׁכֹּן
  choice: 他们住在
  rationale: 该不定式在此承接地点短语，表达居住之意；汉语用限定动词“他们住在”更自然，并由上下文补出主语。
- source_word: חֹרֵי
  choice: 洞穴
  rationale: חוֹר意为洞、孔穴或凹处。“洞穴”既保留栖身处的简陋感，也符合现代汉语表达。
- source_word: עָפָר
  choice: 尘土
  rationale: עָפָר可指尘土、松土或土地；“尘土”保留本段卑微、荒凉的意象。
- source_word: וְכֵפִים
  choice: 和岩石间
  rationale: כֵפִים指岩石或峭岩。原文省略了这里的介词关系；译作“岩石间”按居住场景补明地点关系，同时以脚注保留“岩穴”的另一种句法理解。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“旱溪谷”传达近东季节性水道的背景；两个“住在”使并列结构清楚。正文保留“尘土”意象，脚注说明地貌词及末句句法的多义性。
