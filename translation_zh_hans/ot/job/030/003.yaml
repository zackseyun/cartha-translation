  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
translation:
  language: zh_hans
  text: 他们因穷乏饥饿而枯槁[a]，在夜间的荒凉废弃中啃咬干旱的土地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “枯槁”所译的希伯来词十分罕见，也可理解为“消瘦”或“孤零”。本节另有数个词语的含义难定。
    reason: lexical_alternative
  - marker: b
    text: “夜间”所译的希伯来词通常意为“昨夜”或“昨日”；这里按诗歌语境理解为“夜间”。“啃咬”也可译作“刨寻”或“逃往”；原文此处意义不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: 因穷乏饥饿
  rationale: 两个介词短语描写这些人所处的匮乏境况；“穷乏饥饿”简洁自然，也保留诗句的并列结构。
- source_word: גַּלְמוּד
  choice: 消瘦
  rationale: 此词罕见，可能表示枯槁、瘦弱或孤零；本句语境侧重穷乏饥饿造成的身体状态，故译作“消瘦”，并以脚注保留不确定性。
- source_word: הָעֹרְקִים
  choice: 啃食
  rationale: 该词在此处意义疑难；结合下节在荒野觅食的语境，可理解为在干地上刨寻或啃食食物。“啃食”传达其极端困顿，同时以脚注列出另一种可能。
- source_word: צִיָּה
  choice: 干旱之土
  rationale: צִיָּה指干旱、焦枯之地；译文保留具体而严酷的土地意象。
- source_word: אֶמֶשׁ
  choice: 夜间
  rationale: 此词通常表示“昨夜”或“昨日”，诗歌语境中也可指夜间；这里采用与暗中觅食场景相合的“夜间”，并在脚注说明通常词义。
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: 荒凉废弃之地
  rationale: 这对近义词共同强化毁坏、荒芜的景象；中文用“荒凉废弃”保留叠加强调，并使其自然修饰地点。
