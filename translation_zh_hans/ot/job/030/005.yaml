  text: They are driven out from the midst[b][a]; they shout after them as after a thief.
translation:
  language: zh_hans
  text: 他们被赶出人群[a]；人们向他们呼喊，如同向贼呼喊一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“从中间”。这里按上下文指从人们当中被赶出。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明确说明呼喊者具体是谁；也可译作“他们向这些人呼喊，如同向贼呼喊一样”。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: מִן־גֵּו
  choice: 从人群中
  rationale: מִן表示离开、分离；גֵּו在这里最自然地指群体或社会的“中间”。希伯来文省略了所属对象，结合上下文译作“人群中”，比生硬的“从中间”更清楚，同时以脚注保留地形性理解。
- source_word: יְגֹרָשׁוּ
  choice: 被……赶出去
  rationale: גרש的Piel未完成式在此表达遭受强制驱逐；被动表达保留原文对这些人所受待遇的强调。
- source_word: יָרִיעוּ
  choice: 有人……喊叫
  rationale: 该动词表示发出响亮的呼喊或呐喊。第三人称复数主语的具体所指没有明说，汉语用不定指“有人”使句子自然，又不把主语锁定为某个已明确命名的群体。
- source_word: עָלֵימוֹ
  choice: 冲着他们
  rationale: 介词עַל与呼喊类动词连用时可表示敌对言语所针对的对象；“冲着他们”自然传达这种方向和敌意。
- source_word: כַּגַּנָּב
  choice: 像对贼一样
  rationale: כְּ构成比较，“贼”是被如此呼喊、追斥的对象。汉语补出“对”可自然表达原文隐含的比较关系，而不把这些人直接断定为贼。
