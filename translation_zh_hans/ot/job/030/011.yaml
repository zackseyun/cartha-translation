base_translation:
  language: en
  yaml_path: translation/ot/job/030/011.yaml
  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: zh_hans
  text: 因为他松开了自己的绳索[a]，使我受苦；他们就在我面前抛开了约束[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他松开了自己的弓弦，使我受苦。”希伯来语这个词可能特指弓弦，而不只是一般的绳索。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们在我面前放开了辔头”，意思是他们当着我的面不再克制自己。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，为约伯遭受嘲弄和敌视说明原因，保留明确的因果关系。
- source_word: יִתְרוֹ
  choice: 自己的绳索
  rationale: 原词可泛指绳索，也可能特指弓弦；正文采用较宽泛的“绳索”，并以“自己的”自然表达第三人称单数后缀，同时在脚注保留“弓弦”这一可能。
- source_word: פִּתַּח
  choice: 松开了
  rationale: 与“绳索”搭配时，意为松开或解开，比直译为“打开”自然准确。
- source_word: וַיְעַנֵּנִי
  choice: 使我受苦
  rationale: 此处来自动词 ענה 的“使受苦、使降卑”义，而不是“回答”；上下文强调约伯的苦难和受辱。
- source_word: וְרֶסֶן
  choice: 约束
  rationale: 本义为“辔头”，句中借指对行为的控制；正文译出比喻所表达的意思，具体意象保留在脚注。
- source_word: מִפָּנַי
  choice: 在我面前
  rationale: 表示当着约伯的面，突出对方公开而无所顾忌的敌意。
- source_word: שִׁלֵּחוּ
  choice: 毫无
  rationale: 与“约束”合译为“毫无约束”，自然传达“放开、丢开辔头”的惯用含义，即不再克制。
theological_decisions:
- issue: 首句单数主语“他”的所指
  choice: 保留为“他”，不在正文明确指为上帝
  alternative: 译作“上帝”或“他（上帝）”
  rationale: 希伯来文只用隐含的第三人称单数主语；上下文可使读者理解其所指，但正文不补出原文没有明说的名称，以保留指代形式及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使我受苦”清楚表达受难含义；“毫无约束”自然传达辔头比喻的实际意思。保留单数“他”与复数“他们”的转换，不擅自消除原文的指代张力。
