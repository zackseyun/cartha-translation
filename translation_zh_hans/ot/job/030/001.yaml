  text: וְ/עַתָּ֤ה שָֽׂחֲק֣וּ עָלַ/י֮ צְעִירִ֥ים מִמֶּ֗/נִּי לְ/יָ֫מִ֥ים אֲשֶׁר מָאַ֥סְתִּי אֲבוֹתָ֑/ם לָ֝/שִׁ֗ית עִם כַּלְבֵ֥י צֹאנִֽ/י׀־־׃
base_translation:
