  yaml_path: translation/ot/job/030/001.yaml
  text: But now those younger than I laugh at me[a], whose fathers I refused to set with the dogs of my flock.
translation:
  language: zh_hans
  text: 但如今，比我年轻的人竟嘲笑我；他们的父亲，我甚至不愿把他们与我羊群的狗[a]放在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我羊群的狗”直译如此；也可译作“我的牧羊犬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 但如今
  rationale: 承接前文约伯昔日所受的尊敬，并引出强烈反差；“但如今”自然体现转折。
- source_word: שָׂחֲקוּ עָלַי
  choice: 竟嘲笑我
  rationale: 该短语表示以轻蔑的笑对待约伯；“嘲笑”准确传达语境中的讥诮，“竟”则体现身份和年龄倒置所带来的震惊。
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: 比我年轻的人
  rationale: לְיָמִים直译涉及“日子”，在此是年龄习语；译作“比我年轻的人”自然且不额外限定为男性。
- source_word: אֲשֶׁר מָאַסְתִּי
  choice: 我从前……都不肯
  rationale: מָאַסְתִּי可指拒绝、厌弃或轻视；与后接的不定式连用时，“不肯”能自然表达拒绝安排，同时由整句保留其轻蔑意味。
- source_word: לָשִׁית עִם כַּלְבֵי צֹאנִי
  choice: 连放在看守我羊群的狗中间
  rationale: 保留“放置/安排”及“我羊群的狗”这一具体意象；“看守”点明这些狗在羊群中的通常作用，而不把它们简单等同于现代品种意义的“牧羊犬”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事诗体。“竟”强化今昔地位反转；“连……都不肯”自然传达约伯对那些父亲极度轻视的修辞力度。脚注标记置于整句之后，对“羊群的狗”作词义说明。
