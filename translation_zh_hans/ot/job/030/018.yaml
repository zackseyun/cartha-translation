  yaml_path: translation/ot/job/030/018.yaml
  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
translation:
  language: zh_hans
  text: 在强力之下，我的衣服变了形[a]；它像我长衣的领口[b]一样勒住我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “变了形”所译的希伯来语动词含义不确定，也可译作“改变了”，或可能理解为“有人抓住（或粗暴地扭弄）我的衣服”。本行通常被理解为借变形、紧束的衣物意象描写约伯所受的苦难。
    reason: lexical_alternative
  - marker: b
    text: 字面意思是“我长衣的口（开口）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רָב כֹּחַ
  choice: 因强大的力量
  rationale: 介词בְּ在这里可表原因、方式或工具；此译保留力量导致下文变化的关系，同时不明确指定施力者。
- source_word: יִתְחַפֵּשׂ
  choice: 变了形
  rationale: 该词在本节含义困难，可能指改变、变形，也有解释为衣服被抓住或粗暴扭弄。结合身体苦难和衣物束缚的意象，“变了形”自然表达衣服受强力扭曲的效果，又以脚注保留歧义。
- source_word: לְבוּשִׁי
  choice: 我的衣服
  rationale: לְבוּשׁ泛指衣物；译作“衣服”保留单数整体意象，也符合现代汉语。
- source_word: כְּפִי
  choice: 像……的领口
  rationale: פִּי字面为“口、开口”；用于衣物时可指领口。正文采用自然的“领口”，脚注注明字面意义。
- source_word: כֻתָּנְתִּי
  choice: 我的内衣
  rationale: כֻּתֹּנֶת指贴身或长衫式衣物。这里用“内衣”与外层“衣服”形成可理解的衣着图像，但不采用现代狭义贴身内裤之意。
- source_word: יַאַזְרֵנִי
  choice: 勒住我
  rationale: 动词אזר本义为束上、围住；在令人窒碍的衣服意象中，“勒住”比“束腰”更自然，并传达限制和压迫感。
theological_decisions:
- issue: 施加“强大力量”的主体
  choice: 不补出主体，以“因强大的力量”表达
  alternative: 译为“他以大力”或“上帝以大力”
  rationale: 希伯来文本本节没有明说施力者；不补出“上帝”或其他主体，可保留诗句的语法和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。正文保留衣物变形和勒紧的具体意象，并用脚注呈现关键动词及“领口”的字面歧义。
