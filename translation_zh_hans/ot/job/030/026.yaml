  yaml_path: translation/ot/job/030/026.yaml
  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: zh_hans
  text: 我本盼望美好，灾祸却临到；我等候光明，幽暗却临到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 不单独译出
  rationale: 本节的 כִּי 可承接上文，带有解释或强调作用；汉语若直译为“因为”会使本节显得像缺少明确主句。结合诗歌语境，以语序和语气自然承接，同时保留句意。
- source_word: טוֹב
  choice: 福乐
  rationale: 该词在此作名词用，指有利、美好的境遇。“福乐”比单说“好事”更庄重，也不像“兴旺”那样局限于物质层面。
- source_word: קִוִּיתִי
  choice: 我盼望
  rationale: 表达带着希望的期待，与后半句的“等候”形成适度变化，同时保留两动词相近而不完全相同的意味。
- source_word: וַיָּבֹא
  choice: 却来到
  rationale: 两处采用同一译法，保留原文重复造成的鲜明逆转；“却”体现期待与结果之间的反差。
- source_word: רָע
  choice: 灾祸
  rationale: 此处主要指临到约伯的祸患、逆境，而非道德意义上的邪恶；“灾祸”符合上下文，也与“福乐”构成自然对照。
- source_word: אֲיַחֲלָה
  choice: 我等候
  rationale: 该词含盼望、等待之意；译作“等候”既保留期待色彩，又避免与前句机械重复。
- source_word: לְאוֹר
  choice: 光明
  rationale: 保留原文的光之意象及其可能兼具的实际与象征含义，不将其窄化解释为“解脱”或“好转”。
- source_word: אֹפֶל
  choice: 幽暗
  rationale: 该词表示浓重的黑暗或阴沉；“幽暗”比一般的“黑暗”更能体现其强度，又与“光明”形成清楚对照。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。保留两次“却来到”的平行重复，以及“福乐／灾祸”“光明／幽暗”的两组对照。脚注说明 טוֹב 的宽泛含义；正文将 רָע 译为“灾祸”，避免被误解为道德上的邪恶。
