source:
  edition: WLC
  text: כִּֽי יָ֭דַעְתִּי מָ֣וֶת תְּשִׁיבֵ֑/נִי וּ/בֵ֖ית מוֹעֵ֣ד לְ/כָל חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: zh_hans
  text: 因为我知道，你必使我归于死亡[a]，归于那为一切活人所定的家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我回到死亡”，也可意译为“把我带到死亡”。原词含有使人返回、归回的意思。
    reason: lexical_alternative
  - marker: b
    text: “为一切活人所定的家”可能是对坟墓或阴间的诗意说法，指人人共同的归宿。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为约伯此前的哀诉说明缘由；现代汉语用“因为”自然保留其连接和解释作用。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: Qal完成式第一人称单数在此表达确定、既定的认识，汉语现在时“我知道”最自然。
- source_word: מָוֶת
  choice: 死亡
  rationale: 原词直接指死亡；不径自译作“阴间”或“坟墓”，以免加入原文没有明说的死后世界概念。
- source_word: תְּשִׁיבֵנִי
  choice: 你必使我归于
  rationale: 保留שׁוב使役式“使返回、使归回”的语义，同时“归于死亡”在现代汉语中庄重自然，也不强行暗示约伯先前已处于死亡状态。
- source_word: וּבֵית מוֹעֵד
  choice: 归于那……所定的家
  rationale: “家”保留בֵית的诗性意象；מוֹעֵד可指所定的时间或地点，此处以“所定的”修饰“家”，既简洁又保留目的地已经指定的含义。第二个“归于”为汉语补出，与前一分句的目的地结构并列。
- source_word: לְכָל חָי
  choice: 为一切活人
  rationale: 忠实表达“为每一个活着的〔人〕”的普遍范围；“一切活人”比逐字的“每一个活着的”更符合现代汉语诗体。
theological_decisions:
- issue: 死亡意象的所指
  choice: 将死亡呈现为所有人的共同归宿，并以“所定的家”保留原文隐喻
  alternative: 明确译成坟墓或阴间，即死人聚集之处
  rationale: 希伯来文说“死亡”和“为一切活人所定的家”，没有明说“阴间”；正文不把诗性意象收窄为某一种死后世界解释。
- issue: תְּשִׁיבֵנִי中“返回”意味
  choice: 译作“使我归于死亡”
  alternative: 译作“使我回到死亡”或较弱的“把我带到死亡”
  rationale: “归于”兼顾使役式的返回意味与汉语中“归于死亡”的惯用表达，同时避免断言人曾经在死亡中。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“归于死亡”保留原文使役动词的语义张力；“所定的家”维持诗歌隐喻，不将其解释性地改写成“坟墓”或“阴间”。脚注标记依相关词语出现顺序排列。
