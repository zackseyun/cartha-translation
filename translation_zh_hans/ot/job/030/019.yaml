  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: zh_hans
  text: 他把我扔进泥里[a]，我竟成了尘土和灰烬一般[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泥里”也可译作“泥潭”或“黏土中”。希伯来词可指泥、泥浆或陶土。
    reason: lexical_alternative
  - marker: b
    text: “我竟成了……一般”也可译作“我被比作尘土和灰烬”或“我变得像尘土和灰烬”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: 他把我扔进
  rationale: 该使役形动词带第一人称单数宾语后缀，表达“他把我扔下／投进”。“扔进”保留动作的强烈感，也符合现代汉语。
- source_word: לַחֹמֶר
  choice: 泥中
  rationale: חֹמֶר 可指泥、泥浆或陶土；此处受辱、被贬入尘埃的语境适合译作“泥中”，同时在脚注保留“泥潭／黏土”的词义可能。
- source_word: וָאֶתְמַשֵּׁל
  choice: 我便如同
  rationale: 该形式可表达“被比作／变得像”。正文用“便如同”自然地呈现前一动作所造成的状态，同时不把被动或结果含义解释得过死。
- source_word: כֶּעָפָר
  choice: 如同尘土
  rationale: 保留比较词 כ 的明喻结构；עָפָר 译作“尘土”，承载卑微、必死和归于尘土的意象。
- source_word: וָאֵפֶר
  choice: 和炉灰
  rationale: אֵפֶר 指灰烬；“炉灰”是现代汉语圣经语境中清楚、具体的表达，并与“尘土”构成自然并列。
theological_decisions:
- issue: 第三人称阳性单数动词的隐含主语
  choice: 明确译为“他”，按上下文指上帝
  alternative: 使用无主句，如“我被扔进泥中”
  rationale: 希伯来文动词明确含第三人称阳性单数主语，而约伯本段话的上下文指向上帝；译作“他”忠实呈现语法和语境，但不在正文额外加上“上帝”。
- issue: וָאֶתְמַשֵּׁל 的语态与结果含义
  choice: 译作“我便如同”
  alternative: “我被看作”或“我变得像”
  rationale: 原词可有反身或被动色彩。正文保留状态性的比较，不武断限定为外界评价或实体变化；脚注说明其他可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“扔进”保持受力与受辱的强烈画面；“尘土和炉灰”保留原文成对的卑微、消亡意象。所有脚注标记均置于正文相应位置。
