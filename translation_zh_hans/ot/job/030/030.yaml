  text: My skin turns black and falls from me[b][a], and my bones burn with heat.
translation:
  language: zh_hans
  text: 我的皮肤发黑，从我身上脱落[a]；我的骨头因热而发烫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的皮肤在我身上发黑。”原文可指皮肤变黑并脱落，也可指皮肤发黑后仍附在身上。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的骨头因发烧而发烫。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: 我的皮肤
  rationale: עוֹר用于人体时通常指皮肤；“我的皮肤”是现代汉语中自然、准确的表达。
- source_word: שָׁחַר
  choice: 发黑
  rationale: 此处该动词表示变暗或变黑；“发黑”简洁地传达状态变化。
- source_word: מֵעָלָי
  choice: 从身上脱落
  rationale: 字面为“从我上面”；结合患病皮肤的语境，“从身上脱落”表达一种很可能的具体含义，同时以脚注保留原文的含混性。
- source_word: וְעַצְמִי
  choice: 我的骨头
  rationale: עֶצֶם虽为单数形式，在这里可作集合用法；汉语用“骨头”能自然表达全身骨骼的感受。
- source_word: חָרָה
  choice: 发烫
  rationale: חָרָה含有燃烧、炽热之意；描述骨头时，“发烫”既保留灼烧意象，又符合现代汉语表达。
- source_word: מִנִּי חֹרֶב
  choice: 因灼热
  rationale: מִנִּי表示来源或原因，חֹרֶב可指热与干燥；“因灼热”保留因果关系及强烈热感，不把它过早限定为发烧。
theological_decisions: []
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“发黑”“脱落”“发烫”呈现约伯身体受苦的鲜明意象；脚注保留 מֵעָלָי 与 חֹרֶב 在此处的词义范围，避免把皮肤状态和热感的医学原因解释得过于确定。
