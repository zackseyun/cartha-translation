  yaml_path: translation/ot/job/030/014.yaml
  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: zh_hans
  text: 他们如从一道宽阔的破口涌来[a]；在毁灭之中，他们翻滚而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们如同一道宽阔的破口涌来；在毁灭之下，他们翻滚。”
    reason: 原文开头的介词可保留为“如同……一般”的比拟，也常可按上下文理解为“如从……而来”；“在……之下”保留תַּחַת的基本空间义。
lexical_decisions:
- source_word: כְּ/פֶרֶץ רָחָב
  choice: 如宽阔的破口一般
  rationale: “פֶרֶץ”指墙垣等处被冲破后形成的破口；前缀“כְּ”通常表示比拟。此译保留破墙而入的具体意象，也保留其句法可能存在的歧义。
- source_word: יֶאֱתָיוּ
  choice: 涌来
  rationale: 该动词表示“来、来到”；结合破口与后半句翻滚推进的画面，“涌来”在中文中自然传达成群逼近的动态，但不额外说明来者身份。
- source_word: תַּחַת שֹׁאָה
  choice: 在崩塌之中
  rationale: “תַּחַת”基本义为“在……下面”，在这里也可能表示身处某种毁灭性情势；“שֹׁאָה”可指毁灭、崩塌或灾祸。正文以“在崩塌之中”表达现场情境，较符合中文诗句，同时在脚注保留更直译的可能。
- source_word: הִתְגַּלְגָּלוּ
  choice: 滚滚而来
  rationale: “גלל”的Hitpael形式描绘翻滚、滚动的动作；“滚滚而来”保留势不可挡的推进感，并与前句“涌来”形成连贯画面。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代汉语诗体。“破口”保留城墙遭攻破的具体意象；“涌来”“滚滚而来”传达敌对人群连续、猛烈逼近的动态。脚注保留原文介词关系及反身式动词更贴字面的译法。
