revisions:
- from: 他们如宽阔的破口一般涌来[a]；在崩塌之中，他们滚滚而来。
  to: 他们如从一道宽阔的破口涌来[a]；在毁灭之中，他们翻滚而来。
  rationale: 修订仅改善中文的句法自然度，并使“毁灭”更充分涵盖שֹׁאָה的语义。脚注明确保留前半句比拟与“从破口进入”两种可能，以及תַּחַת的基本义；未增添来者身份或任何教义性解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:27:39Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确保留了来者借破口蜂拥而至及在毁灭中翻滚推进的意象。不过，“如宽阔的破口一般涌来”在中文中容易理解为“他们本身像破口”，而原文也可（且常被）理解为“如从宽阔的破口而来”。“崩塌”略将שֹׁאָה限缩为建筑物倒塌；“毁灭”较能涵盖其灾祸、破坏或废墟的语义范围。
  naturalness: 原译庄重，但“如宽阔的破口一般涌来”搭配稍显生硬；改为“如从一道宽阔的破口涌来”更符合现代汉语，同时仍以“如”保留比较性的句法张力。后句用“翻滚而来”比“滚滚而来”更直接对应反身式的翻滚动作，避免与前句“涌来”过度重复。
  terminology: “破口”是合适的军事／毁坏意象用语。建议以“毁灭”译שֹׁאָה，不把该词固定为单一的“崩塌”。无神学术语或专名问题。
  issues:
  - severity: low
    issue: 前半句的比拟结构在中文中不够自然
    rationale: “如宽阔的破口一般涌来”容易使“他们”成为“破口”的比喻本体。加入“从”可表达常见的“如从破口进入”理解；仍以“如”及脚注说明保留原文可作直接比拟的可能。
  - severity: low
    issue: “崩塌”对שֹׁאָה的范围略窄
    rationale: שֹׁאָה可指毁灭、灾祸、破坏或荒凉，并不必然专指物体崩塌。“毁灭”在此处较宽泛且保留攻破后的灾变场景。
  revised_text: 他们如从一道宽阔的破口涌来[a]；在毁灭之中，他们翻滚而来。
  revised_footnotes:
