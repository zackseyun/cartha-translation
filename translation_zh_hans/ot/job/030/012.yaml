  text: עַל יָמִין֮ פִּרְחַ֪ח יָ֫ק֥וּמוּ רַגְלַ֥/י שִׁלֵּ֑חוּ וַ/יָּסֹ֥לּוּ עָ֝לַ֗/י אָרְח֥וֹת אֵידָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/012.yaml
  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: zh_hans
  text: 在我右边，一群无赖兴起[a]；他们使我的双脚离开原处[b]，又向我修筑他们的灾祸之路[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一群无赖”也可译作“一群狂徒”或“一伙乌合之众”。希伯来语 פִּרְחַח 是罕见词，指一群受人鄙视或放肆不羁的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“他们遣开我的脚”。意思难以确定，可能指他们逼约伯退开、使他偏离脚下的路，或使他站立不稳。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“向我堆筑他们灾祸的道路”。原文保留敌人修筑道路的比喻；“灾祸”也可译作“祸患”“败亡”或“毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: 在我右边
  rationale: 该短语表示空间方位；希伯来文虽没有第一人称后缀，但上下文明确是约伯的右侧。译作“在我右边”符合现代汉语习惯，也保留受敌环伺的画面。
- source_word: פִּרְחַח
  choice: 一群无赖
  rationale: 这是罕见的集合名词，带有对卑贱、放肆之人的鄙视意味。“一群无赖”保留其集合意义和贬义，同时避免使用过于口语化的辱骂。
- source_word: יָקוּמוּ
  choice: 起来攻击我
  rationale: קום在此不只是站立，而有敌对地起来、发难之意；补出“攻击我”使现代汉语读者明白语境中的敌意，但不具体规定攻击方式。
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: 他们把我的双脚赶开
  rationale: 原文直译近于“他们遣开我的脚”，含义难定。“赶开”保留使脚离开原位的意象，既可能指逼退约伯，也可能指破坏他的立足之处；脚注说明这种歧义。
- source_word: וַיָּסֹלּוּ
  choice: 筑起
  rationale: סלל常指堆筑或修筑道路。“筑起”保留原文的筑路意象及其针对约伯的敌对方向。
- source_word: עָלַי אָרְחוֹת אֵידָם
  choice: 向我筑起毁灭之路
  rationale: עָלַי在敌对语境中译为“向我”，אָרְחוֹת保留为“路”，אֵיד译为“毁灭”。中文正文简洁呈现这些道路朝约伯而来并带来灾祸；后缀所表达的“他们的”关系在脚注中说明。
