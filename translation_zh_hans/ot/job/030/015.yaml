  text: הָהְפַּ֥ךְ עָלַ֗/י בַּלָּ֫ה֥וֹת תִּרְדֹּ֣ף כָּ֭/רוּחַ נְדִבָתִ֑/י וּ֝/כְ/עָ֗ב עָבְרָ֥ה יְשֻׁעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/015.yaml
  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: zh_hans
  text: 惊恐转而袭向我；它们如风追逐我的尊荣[a]，我的安泰[b]也如云消逝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的高贵地位”“我的荣誉”。原文所指可包括尊贵的身份、地位或境况。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的拯救”“我的解救”或“我的福祉”。这里的词既可指蒙救援，也可指安全、安好的境况。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ עָלַי
  choice: 临到我
  rationale: הפך为使役被动形，字面有“被转到、转而攻向”之意；结合עָלַי，译作“临到我”能自然表达惊恐转而袭向约伯的结果，同时不额外指定施动者。
- source_word: בַּלָּהוֹת
  choice: 惊恐
  rationale: 该复数名词指令人恐惧的事物或突如其来的恐怖；“惊恐”简洁而有诗意，也可作为集合概念承接后面的阴性单数动词。
- source_word: תִּרְדֹּף
  choice: 它们……追逐
  rationale: רדף意为追赶、追逐。动词虽为阴性单数，但可与前面的复数集合名词搭配；中文用“它们”回指“惊恐”，使句意清楚。
- source_word: כָּרוּחַ
  choice: 如风
  rationale: רוּחַ在此最自然地指风，表现追逐的迅猛，也与下一分句的云相呼应。
- source_word: נְדִבָתִי
  choice: 我的尊荣
  rationale: 该词可指高贵、尊贵的地位或荣誉。约伯正在哀叹昔日身份和境遇的丧失，“尊荣”兼顾其地位与荣誉，且不把词义局限为内在品格。
- source_word: וּכְעָב
  choice: 也如云
  rationale: עָב指云，可能特指浓云；此处简译为“云”即可保留诗歌比喻，并与连接词וּ相应译出“也”。
- source_word: עָבְרָה
  choice: 消逝
  rationale: עבר在此表示经过而不复存在。“消逝”符合云散去的意象，也自然表达约伯安稳境况的失落。
- source_word: יְשֻׁעָתִי
  choice: 我的安稳
  rationale: יְשׁוּעָה可指拯救、解救，也可指由获救而有的安全、福祉。此处与约伯失去尊荣和安泰的语境相合，译作“安稳”自然，但在脚注保留“拯救、解救”等词义。
theological_decisions:
- issue: יְשֻׁעָתִי是否应作教义化的“救恩”理解
  choice: 我的安稳
  alternative: 我的拯救／我的解救／我的福祉
  rationale: 此处主要是约伯对个人安全、获救和良好境况消逝的哀叹，不必预设后期教义意义上的“救恩”。“安稳”贴合上下文，脚注则保留该词的拯救含义与语义张力。
- issue: תִּרְדֹּף的单数形式与בַּלָּהוֹת的复数形式如何衔接
  choice: 以“它们”回指作为集合概念的“惊恐”
  alternative: 用非人称表达“我的尊荣如被风追赶”
  rationale: 希伯来诗歌中复数名词可按集合整体配单数动词。主译明确回指“惊恐”，但不据此推导额外的神学施动者。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。两个分句保留“风”与“云”的平行意象；“如风追逐”维持原文中风修饰追逐方式或暗示被风驱散之间的诗性张力。脚注标记紧随实际需要说明的词语。
