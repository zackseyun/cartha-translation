  text: 就连他们手的力量，对我有什么用？他们的精力已经消逝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的壮年已经消逝”。这里的希伯来语名词十分罕见，可能指壮年、盛年，或全盛时期的力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 又
  rationale: 结合反问句表达递进、追加的语气，说明约伯进一步否定这些人的用处；现代汉语中“又”自然贴切。
- source_word: כֹּחַ יְדֵיהֶם
  choice: 他们双手的力气
  rationale: 保留“手”的具体意象，同时传达从事实际劳动的能力；“力气”比抽象的“力量”更符合身体劳作的语境。
- source_word: לָמָּה לִּי
  choice: 对我又有什么用？
  rationale: 该表达是带有轻蔑意味的反问，重点在于毫无益处；此译法比逐字的“于我为何”更符合现代汉语。
- source_word: עָלֵימוֹ אָבַד
  choice: 他们的……已经衰败
  rationale: 按此处习语句法，将介词加代词后缀理解为与后面的名词相关；“衰败”既表达丧失，也适合形容精力或盛年消退。
- source_word: כָּלַח
  choice: 精力
  rationale: 这是罕见且含义有争议的名词；正文采用与上下文中的劳动能力相符的“精力”，脚注保留“壮年”的可能解释。
