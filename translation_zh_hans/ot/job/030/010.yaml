  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: zh_hans
  text: 他们厌恶我，远离我；他们毫不克制地在我面前吐唾沫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“他们不从我面前收住唾沫”。这是一种公开侮辱的说法，指他们在约伯面前吐唾沫。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: 他们厌恶我
  rationale: תעב表达强烈的憎恶与嫌弃；“厌恶”在现代汉语中自然庄重，并保留原文的强烈程度。
- source_word: רָחֲקוּ מֶנִּי
  choice: 远远躲开我
  rationale: רחק表示远离或保持距离；“远远躲开我”同时传达空间上的远离和社会上的排斥。
- source_word: וּמִפָּנַי
  choice: 当着我的面
  rationale: 该短语字面涉及“我的面前／从我面前”；与“唾沫”连用时，“当着我的面”保留直接针对约伯的公开羞辱，而不强行限定唾沫一定落在脸上。
- source_word: לֹא חָשְׂכוּ
  choice: 也毫不克制
  rationale: חשׂך可指扣留、顾惜或克制；这里表示他们实施侮辱时毫不收敛。
- source_word: רֹק
  choice: 吐唾沫
  rationale: רֹק本为“唾沫”；结合“不克制”的结构，汉语用动作表达“吐唾沫”更自然清楚。
