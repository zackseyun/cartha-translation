  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
translation:
  language: zh_hans
  text: 我的琴已变成哀歌[a]；我的管乐器[b]变成了哭泣者的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴”指一种古代拨弦乐器；也可译作“竖琴”或“里拉琴”。
    reason: lexical_alternative
  - marker: b
    text: 原文指一种管吹乐器，具体形制不确定；也可译作“笛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 变为
  rationale: 表示处境转变及其形成的结果；“变为”在诗句中简洁自然，也保留希伯来语系词结构。
- source_word: לְאֵבֶל
  choice: 哀乐
  rationale: אֵבֶל指哀悼、悲恸；结合“我的琴”理解为琴声转成表达哀悼的音乐。“哀乐”既保留哀悼含义，又使汉语意象自然。
- source_word: כִּנֹּרִי
  choice: 我的琴
  rationale: כִּנּוֹר是古代拨弦乐器，可近似称竖琴或里拉琴；正文用较宽泛、普通读者易懂的“琴”，避免误指现代西洋竖琴。
- source_word: וְעֻגָבִי
  choice: 我的管乐器
  rationale: עוּגָב泛指某种管吹乐器，具体形制不确定；“管乐器”准确保留类别而不作过度限定。
- source_word: לְקוֹל
  choice: 变为……的声音
  rationale: קוֹל可指声音或嗓音；此处与לְ共同延续前半句的转变结构。补出“变为”使汉语平行关系清楚。
- source_word: בֹּכִים
  choice: 哭泣之人
  rationale: 这是复数主动分词，指正在哭泣的人；译作“哭泣之人”保留其复数集合意义和诗体庄重感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两分句以“变为”构成平行；“哀乐”不是泛指悲伤情绪，而是与哀悼相联的音乐。脚注标记均紧跟所说明的乐器名称。
