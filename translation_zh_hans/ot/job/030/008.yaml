base_translation:
  language: en
  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: zh_hans
  text: 愚顽人的子孙，实在是无名之辈[a]，被赶出了那地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无名之辈”原文直译是“没有名字的子孙”，指没有地位、声望或尊荣的人。
    reason: cultural_note
  - marker: b
    text: “被赶出”所译的希伯来语动词十分罕见，也可能指“被击打”或“被鞭打”；与“那地”连用时，语境较支持被驱逐的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: 愚顽人的子孙
  rationale: בְּנֵי 是复数构造形式；这里表示属于某一类的人。נָבָל 不仅指智力愚笨，也带有道德卑劣、受人鄙视的意味。“愚顽人”保留其伦理色彩，“子孙”则自然传达这类属关系。
- source_word: גַּם
  choice: 实在是
  rationale: 这里的 גַּם 补充并加强后面的同位描述；“实在是”在现代汉语中自然体现强调语气。
- source_word: בְּנֵי בְלִי שֵׁם
  choice: 无名之辈
  rationale: 字面为“无名者的子孙／没有名字的子孙”，是指没有社会地位、声望或尊荣的人。“无名之辈”既自然，又保留其社会贬抑意味。
- source_word: נִכְּאוּ
  choice: 被赶出
  rationale: 此罕见动词的确切语义有争议，可涉及击打、压制或驱逐。与 מִן הָאָרֶץ 连用时，语境较支持被强行逐出的结果；脚注保留另一种可能。
- source_word: מִן הָאָרֶץ
  choice: 出了那地
  rationale: מִן 表示离开；הָאָרֶץ 在此社会语境中更可能指他们所居之地，而非宇宙意义的“大地”。“那地”也体现定冠词。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愚顽人”保留原文的道德贬义；“无名之辈”避免生硬直译，并以脚注说明希伯来习语；对罕见动词不作过度确定，以脚注保存“击打”与“驱逐”之间的真实歧义。
