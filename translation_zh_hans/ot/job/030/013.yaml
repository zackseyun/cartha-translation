  text: נָתְס֗וּ נְֽתִיבָ֫תִ֥/י לְ/הַוָּתִ֥/י יֹעִ֑ילוּ לֹ֖א עֹזֵ֣ר לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: zh_hans
  text: 他们拆毁我的路径，助长我的毁灭[a]；他们没有帮手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们从中得利”。这里的希伯来语动词也可表示“使……推进”或“对……有帮助”，在本句中很可能是指推动约伯的毁灭。
    reason: lexical_alternative
  - marker: b
    text: 或译“没有人帮助他们”。原文十分简略，既可表示他们没有帮手，也可强调他们是在无人协助之下行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: 拆毁
  rationale: 该动词表示拆除、毁坏；“拆毁”保留了破坏道路的具体、强烈意象。
- source_word: נְתִיבָתִי
  choice: 我的路径
  rationale: נְתִיבָה 指小路、路径；“路径”既保留道路意象，也可自然承载人生道路的隐喻。
- source_word: לְהַוָּתִי
  choice: 我的毁灭
  rationale: הַוָּה 可指灾祸、毁坏或灭亡；在此与介词 לְ 连用，表达他们所推动的结果或目标。
- source_word: יֹעִילוּ
  choice: 助长
  rationale: יעל 的使役式可表示使某事推进、对某事有助益；这里的隐含对象最自然地承接“我的毁灭”，故译作“助长”，同时用脚注保留其他可能理解。
- source_word: לֹא עֹזֵר לָמוֹ
  choice: 他们没有帮手
  rationale: 原文是简短的名词性分句，直译为“他们没有帮助者/帮手”；此译保留了它究竟强调无人协助，还是他们独自行动的含混性。
theological_decisions: []
