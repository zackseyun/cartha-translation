  text: And now I have become their song[b][a], and I am a byword to them.
translation:
  language: zh_hans
  text: 如今，我成了他们的歌[a]，我成了他们的笑谈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们嘲弄的歌”；原文直译为“他们的歌”，在这里带有讥嘲意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“话柄”或“谈资”；原文是“话、言语”，这里指人们用来谈论并轻蔑某人的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 既标明时间转到约伯目前的处境，也自然带出他今昔境遇的对比；不额外强化连接词的转折力度。
- source_word: נְגִינָתָם
  choice: 他们的歌
  rationale: נְגִינָה本指歌曲或乐曲；在本段受嘲弄的语境中，是以约伯为取笑对象的歌。正文保留简洁的字面意象，脚注说明其讥嘲意味。
- source_word: הָיִיתִי
  choice: 我竟成了
  rationale: 完成式在这里表达已经发生且延续至今的身份变化；“成了”准确传达结果状态，“竟”自然表现约伯所感受到的强烈落差。
- source_word: וָאֱהִי
  choice: 成了
  rationale: 承接前一分句，与之构成平行，描述约伯如今的受辱状态；汉语省略重复主语和连词更自然。
- source_word: לָהֶם
  choice: 他们口中的
  rationale: 按汉语习惯表达约伯成为他们谈论和讥笑对象的关系，也与מִלָּה的言语含义呼应。
- source_word: לְמִלָּה
  choice: 笑柄
  rationale: מִלָּה字面为“话、言语”，此处指人们拿约伯来说嘴，语境明显含轻蔑。“笑柄”以自然现代汉语传达他成为讥笑对象的意思；脚注保留“谈资、俗语”等较字面的可能表达。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的哀诉语体。“如今”带出今昔反差；两个“成了”保持希伯来诗句的平行结构。“歌”保留原文意象，“口中的笑柄”则以普通读者易懂的表达传达受辱语境。所有脚注标记均置于相关词语之后。
