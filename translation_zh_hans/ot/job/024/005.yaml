  text: הֵ֤ן פְּרָאִ֨ים בַּֽ/מִּדְבָּ֗ר יָצְא֣וּ בְּ֭/פָעֳלָ/ם מְשַׁחֲרֵ֣י לַ/טָּ֑רֶף עֲרָבָ֥ה ל֥/וֹ לֶ֝֗חֶם לַ/נְּעָרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: zh_hans
  text: 看哪，他们像旷野里的野驴，出去劳作，清早[b]寻觅食物；荒原给他提供食物，供孩子们吃[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“荒原是他的饼，给年幼者的”。“他”是单数，可能是代表个体的用法；末词也可译作“年幼者”“少年人”或“孩子们”。末尾短语与“他”的关系略有歧义，也可理解为说明所得食物是为其年幼者预备的。
    reason: 保留לוֹ的单数、לֶחֶם的基本食物意象，以及לַנְּעָרִים的指称和句法关系的歧义。
  - marker: b
    text: “清早寻觅”也可理解为“殷勤寻觅”或“早起寻找”；所寻找的可译作“猎物”“食物”或“口粮”。
    reason: 说明מְשַׁחֲרֵי לַטָּרֶף在时间色彩和宾语含义上的词汇选择。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留引人注意、展开眼前景象的语气；“看哪”庄重而易懂。
- source_word: פְּרָאִים
  choice: 野驴
  rationale: 指生活在荒野、未经驯养的驴；本句把这些贫苦人比作野驴。
- source_word: בַּמִּדְבָּר
  choice: 旷野里
  rationale: 表示荒凉、未开垦之地，范围比现代汉语通常所说的“沙漠”更广。
- source_word: יָצְאוּ בְּפָעֳלָם
  choice: 出去劳作
  rationale: 既表达外出，也表达为求生而从事艰苦工作；符合本章贫困受压者的语境。
- source_word: מְשַׁחֲרֵי
  choice: 清早……寻觅
  rationale: 兼顾动词“寻求”及其可能带有的早起、从清晨开始之意；另一种理解收入脚注。
- source_word: לַטָּרֶף
  choice: 食物
  rationale: 该词本可指“猎物”，但在人类贫困求生的语境中泛指觅得的食物或口粮更自然。
- source_word: עֲרָבָה
  choice: 荒原
  rationale: 指干旱的荒野或草原地带；“荒原”比“沙漠”更能保留地貌含义的宽度。
- source_word: לוֹ לֶחֶם
  choice: 给他口粮
  rationale: 保留希伯来文第三人称单数“他”，同时以“口粮”表达“饼／食物”作为基本生计的含义。
- source_word: לַנְּעָרִים
  choice: 给孩子们口粮
  rationale: 此处指需要供养的年幼者；“孩子们”自然且不把所指不必要地限定为男性。
theological_decisions:
- issue: 本节描写的主体是实际的野驴，还是被比作野驴的贫苦人
  choice: 译作“他们像旷野里的野驴”
  alternative: 译作“看哪，旷野里的野驴出去劳作”
  rationale: 上下文持续描写贫苦受压者，且“劳作”和供养孩子更适用于人；用明喻表达可使汉语读者理解诗歌所描绘的人，同时不引入额外的身份判断。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“劳作”“口粮”“荒原”保持诗句的艰辛求生意象；分号保留原诗两半之间从行动转向生计来源的结构。脚注标记均置于相关词句之后。
