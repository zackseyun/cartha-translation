- from: 看哪，他们像旷野里的野驴，出去劳作，清早[b]寻觅食物；荒原给他口粮，也给孩子们口粮[a]。
  to: 看哪，他们像旷野里的野驴，出去劳作，清早[b]寻觅食物；荒原给他提供食物，供孩子们吃[a]。
  rationale: 仅修订末句的句法关系：以“供孩子们吃”表达末尾介词短语所示的用途／受益关系，避免将其扩展为与“给他”完全平行的第二次施与。其余译文及脚注锚点均可保留。
