  text: קַֽל ה֤וּא עַל פְּנֵי מַ֗יִם תְּקֻלַּ֣ל חֶלְקָתָ֣/ם בָּ/אָ֑רֶץ לֹֽא יִ֝פְנֶה דֶּ֣רֶךְ כְּרָמִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: zh_hans
  text: 他在水面上疾速而过[a]；他们在这土地上的份业受咒诅[b]；他不转向葡萄园的路[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在水面上轻飘而过。”希伯来原文较难；“轻”也可能强调短暂、无常，而非速度。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文较难；也有抄读传统或解释作“他在这土地上的份业受咒诅”。
    reason: textual_variant
  - marker: c
    text: 或译：“他不走向葡萄园的路。”这也可能表示他不再回到耕种之地或富庶之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: 轻快掠过
  rationale: קַל本义为“轻”，在此与水面的意象相连，可表达迅疾或转瞬即逝；译作“轻快掠过”既自然，也保留“轻”与“快”的双重意味。
- source_word: עַל־פְּנֵי מַיִם
  choice: 在水面上
  rationale: 按希伯来语意象直译为“在水的表面上”，现代汉语用“在水面上”更自然简洁。
- source_word: תְּקֻלַּל
  choice: 受了咒诅
  rationale: 该词是קלל的Pual形式，通常表示被动的“受咒诅”；这里不采用较少见的“被轻看”。
- source_word: חֶלְקָתָם
  choice: 他们的产业
  rationale: 所给马所拉文本带第三人称复数后缀，故译“他们的”；חלקה在此可指分得的地业或田产，以“产业”保留土地份额的含义。
- source_word: בָּאָרֶץ
  choice: 在地上
  rationale: 这里与“产业”搭配，指土地上的份业；“在地上”也保留“地/土地”的词义范围。
- source_word: לֹא יִפְנֶה
  choice: 他不转向
  rationale: פנה的基本义是“转向”；直译可避免擅自解释为“不再回去”。
- source_word: דֶּרֶךְ כְּרָמִים
  choice: 葡萄园的路
  rationale: 贴近原文的属格结构，既可理解为葡萄园间的路，也可理解为通往葡萄园之路，保留其歧义。
