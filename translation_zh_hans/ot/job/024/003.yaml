  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
translation:
  language: zh_hans
  text: 他们牵走孤儿的驴[a]，扣押寡妇的牛作为抵押品[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们牵走孤儿们的驴。”原文“孤儿”为复数，既可统指这一群体，也可按分配意义理解。
    reason: lexical_alternative
  - marker: b
    text: 或译：“拿寡妇的牛作担保。”原文动词特指取走财物作为债务的担保。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹר
  choice: 驴
  rationale: 指常见的家养驮畜；现代汉语用“驴”准确、自然，无须特意译出性别。
- source_word: יְתוֹמִים
  choice: 孤儿的
  rationale: 原文为复数，可统指孤儿这一群体，也可按分配意义理解为各孤儿所有；正文采用自然的类别性表达，并在脚注保留数的歧义。
- source_word: יִנְהָגוּ
  choice: 赶走
  rationale: נהג可指驱赶或带走牲畜；结合本章列举欺压行为的语境，“赶走”既符合赶牲畜的动作，也表达其被带离主人。
- source_word: יַחְבְּלוּ
  choice: 拿……作抵押
  rationale: 此处חבל特指取走财物作为债务担保，不宜笼统译作“拿走”或“偷走”；“作抵押”保留其法律和经济含义。
- source_word: שׁוֹר
  choice: 牛
  rationale: 在农耕语境中指牛类役畜；“牛”是现代汉语清楚自然的通称，而“公牛”会加入原文在此未着重表达的性别信息。
- source_word: אַלְמָנָה
  choice: 寡妇的
  rationale: 原文与“牛”构成所属关系，译作“寡妇的牛”简洁自然。
