- from: '他们使穷乏人偏离道路[a]；地上的困苦人[b]一同藏身。


    [a] 或译：“离开正道。”

    [b] “地上的”也可译为“世上的”。'
  to: '他们使穷乏人离开道路[a]；那地困苦的人一同藏身。


    [a] 或译：“他们使穷乏人偏离道路。”'
  rationale: 修订仅消除脚注[a]所附加的“正道”解释，并改善第二分句的现代汉语自然度；保留未指明的“他们”、两类贫困／困苦者的细微区分，以及“藏身”对被动／状态性形式的审慎表达。
