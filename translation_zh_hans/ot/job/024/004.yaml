  text: יַטּ֣וּ אֶבְיוֹנִ֣ים מִ/דָּ֑רֶךְ יַ֥חַד חֻ֝בְּא֗וּ עֲנִיֵּי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/004.yaml
  text: They turn the needy off the road[b][a]; together the poor of the land hide themselves.
translation:
  language: zh_hans
  text: '他们使穷乏人离开道路[a]；那地困苦的人一同藏身。


    [a] 或译：“他们使穷乏人偏离道路。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们使穷乏人偏离道路。”
    reason: יַטּוּ מִדָּרֶךְ可直译为“使……离开道路”，也可译为“使……偏离道路”；不将道路限定为“正道”，以保留原文的具体与可能引申的含义。
lexical_decisions:
- source_word: יַטּוּ
  choice: 使……偏离
  rationale: 该词是 נטה 的使役形，基本义为“使转向、使偏离”。此译保留使役意义，也不额外强化为原文未明说的暴力驱赶。
- source_word: אֶבְיוֹנִים
  choice: 穷乏人
  rationale: 指贫穷且有需要、处境脆弱的人；“穷乏人”能与后句的 עֲנִיֵּי 略作区分，同时保留二者语义重叠。
- source_word: מִדָּרֶךְ
  choice: 偏离道路
  rationale: דֶּרֶךְ 可指具体的道路，也可引申为道路、途径或正道。正文保留具体图景，脚注提示可能的引申理解。
- source_word: יַחַד
  choice: 一同
  rationale: 直接表达群体共同的行动或处境，简洁自然。
- source_word: חֻבְּאוּ
  choice: 藏身
  rationale: 该词为 חבא 的 Pual 形，可呈现被隐藏或处于隐蔽状态。汉语“藏身”自然表达这些困苦人退避隐匿的结果，又避免生硬地限定其施事者。
- source_word: עֲנִיֵּי אָרֶץ
  choice: 地上的困苦人
  rationale: עָנִי 可指贫穷、受苦或受压迫的人；选“困苦人”兼顾物质贫困与受苦处境。אֶרֶץ 在这里可译“地”或“世上”，正文用“地上的”，保留原文的空间和社会图景。
theological_decisions:
- issue: 复数动词 יַטּוּ 的主语
  choice: 译为“他们”，不在正文中补出具体身份
  alternative: 译为“恶人”或“强暴者”
  rationale: 本节希伯来文只用第三人称复数动词，主语需由上下文辨认。补作“恶人”虽符合语境，却会把上下文推定写成明示内容，因此保留“他们”。
- issue: חֻבְּאוּ 的被动与反身色彩
  choice: 译为“一同藏身”
  alternative: 译为“一同被隐藏”或“一同躲藏起来”
  rationale: 原形具有被动或状态意味，但没有明说谁隐藏他们。中文用“藏身”既通顺，也避免擅自指定外在施事者；同时保留他们因压迫而隐退的语境张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“穷乏人”与“困苦人”对应两个相近但不完全相同的希伯来词；句式尽量贴近原文两分句的平行结构，并保留主语及“道路／正道”的一定含混性。
