base_translation:
  language: en
  yaml_path: translation/ot/job/024/014.yaml
  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: zh_hans
  text: 黎明时[a]，凶手起来；他杀死贫困和穷乏的人[b]；夜里，他像盗贼一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有光时”或“随着天光来到”。希伯来文直指光来到之时，可能指黎明。
    reason: lexical_alternative
  - marker: b
    text: 或译“他杀害贫困和穷乏的人”。这里的希伯来文动词与“凶手”所对应的词并非同一个词，因此正文用“杀死”保留原文的用词区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: 天一亮
  rationale: 字面为“到／向着光”，在这里表示光来到的时候，即黎明或天亮之际。“天一亮”自然地传达其时间含义，同时保留“光来到”的意象。
- source_word: יָקוּם
  choice: 就起来
  rationale: קום的未完成式在此表示起身并开始行动；“起来”简洁自然，“就”与前面的时间表达相接。
- source_word: רוֹצֵחַ
  choice: 杀人凶手
  rationale: 该分词作名词使用，泛指实施谋杀的人。“杀人凶手”在现代汉语中清楚、自然，并体现 רצח 的蓄意非法杀人含义。
- source_word: יִקְטָל
  choice: 他杀死
  rationale: 此处使用常见的“杀死”动词 קטל，并未重复 רצח；译作“杀死”可保留原文在“杀人凶手”与其行动用词之间的词汇区别。
- source_word: עָנִי וְאֶבְיוֹן
  choice: 困苦和贫穷的人
  rationale: 这一常见并列表达指受压迫、贫困且缺乏依靠的弱势者。“困苦和贫穷的人”保留两个词的侧重点，又容易为现代读者理解。
- source_word: וּבַלַּיְלָה
  choice: 到了夜里
  rationale: 连接词与时间介词引出另一个时间场景，与天亮形成对照；“到了夜里”在汉语中自然地呈现这一转换。
- source_word: יְהִי
  choice: 他就像
  rationale: היה 与比较介词 כ 连用，在此描述其夜间所呈现的身份或行为方式；汉语以“他就像”自然表达，而不额外断定他实际变成了盗贼。
- source_word: כַגַּנָּב
  choice: 像盗贼
  rationale: 比较介词 כ 表示“像、如同”；“像盗贼”是准确而自然的现代汉语表达。
theological_decisions: []
