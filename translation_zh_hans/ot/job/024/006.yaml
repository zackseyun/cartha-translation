base_translation:
  language: en
  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: zh_hans
  text: 他们在田里收割草料[a]，又在恶人[c]的葡萄园[b]里捡拾遗下的果实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “草料”或译“拌合的牲畜饲料”。原文作“他的草料”，但代词所指不明确；这里指牲畜的饲料，不是通常供人食用的谷物。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“又捡拾恶人的葡萄园中遗下的果实”。“葡萄园”前原文没有重复“在”这个介词。
    reason: lexical_alternative
  - marker: c
    text: “恶人”可以泛指邪恶的园主，也可理解为“一个恶人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: 在田里
  rationale: 介词ב与שׂדה构成地点短语；译作“在田里”自然地表达其定指形式，而不刻意强化为某一块特定田地。
- source_word: בְּלִילוֹ
  choice: 饲料
  rationale: בְּלִיל指拌合的牲畜饲料，而非通常供人食用的谷物。原文带第三人称阳性单数后缀，直译可作“他的饲料”或“它的饲料”，但所指不明，因此正文采用自然的“饲料”，并在脚注保留这一形式特征及其他译法。
- source_word: יקצירו
  choice: 他们……收割
  rationale: קצר意为收割、收获；“收割”既符合农业语境，也与复数主语一致。
- source_word: וְכֶרֶם
  choice: 又在……的葡萄园里
  rationale: 原文以“和／又”连接第二分句，כֶרֶם前没有明示地点介词。正文依上下文和现代汉语习惯补出“在……里”，脚注说明也可把“葡萄园”直接理解为动词的宾语。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 单数形容词רָשָׁע在此作名词使用，可指一名恶人，也可能泛指邪恶的园主；“恶人”保留了这种简洁和一定程度的泛指性。
- source_word: יְלַקֵּשׁוּ
  choice: 拾取余果
  rationale: לקשׁ的Piel形式指收集晚熟之物或收割后剩余的出产；“拾取余果”在葡萄园语境中比单说“收集”更具体，并体现拾遗性质。
