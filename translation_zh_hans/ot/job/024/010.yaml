base_translation:
  language: en
  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: zh_hans
  text: 他们赤身行走，没有衣服；他们饥饿，却搬运禾捆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一捆禾”。希伯来语名词为单数，但这里也可能作集合用法。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: 赤身
  rationale: 直接表达没有衣服遮体的困苦处境，同时在现代汉语中自然、庄重。
- source_word: הִלְּכוּ
  choice: 行走
  rationale: 保留הלך的基本动作义，并与本节持续描写穷苦人的处境相符。
- source_word: בְּלִי לְבוּשׁ
  choice: 没有衣服
  rationale: 清楚保留“缺少衣着”的直陈含义，也与前面的“赤身”形成原文所有的强调。
- source_word: רְעֵבִים
  choice: 饥肠辘辘
  rationale: 以自然的现代汉语表达饥饿状态；语气鲜明，但不采用“饿死”“饥荒”等超出原词的强化说法。
- source_word: נָשְׂאוּ
  choice: 搬运
  rationale: 在收割劳动的语境中，“搬运”比泛指的“拿着”更准确地表达负重运送。
- source_word: עֹמֶר
  choice: 禾捆
  rationale: 指收割后捆扎的谷物；“禾捆”简明地保留农业语境。原文为单数，但此处可能具有集合意义，因此正文采用不强制标明单复数的汉语形式，并以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。分号保留两幅并列的受苦景象；“却”显出饥饿与搬运粮食之间原文语序所形成的反差，而不额外解释其原因。脚注标记置于其实际所说明的“禾捆”之后。
