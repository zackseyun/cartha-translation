  text: צִיָּ֤ה גַם חֹ֗ם יִגְזְל֥וּ מֵֽימֵי שֶׁ֗לֶג שְׁא֣וֹל חָטָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: zh_hans
  text: 干旱和炎热也夺去雪水[a]；阴间[b]夺去犯罪的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“雪的水”，可理解为“雪融化的水”。
    reason: lexical_alternative
  - marker: b
    text: “阴间”指死者所在之处；也可译作“坟墓”。
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: 干旱
  rationale: 该词表示干燥、旱情；与“炎热”并列并作“夺去”的主语时，“干旱”自然清楚，也保留诗歌中的自然力意象。
- source_word: גַם
  choice: 也
  rationale: 希伯来语中该词的位置与功能有一定诗性弹性。译文将“也”置于后半句，明确两种夺取之间的类比关系，同时不改变基本意义。
- source_word: חֹם
  choice: 炎热
  rationale: 与“干旱”并列，准确表达高温酷热这一自然条件。
- source_word: יִגְזְלוּ
  choice: 夺去
  rationale: גזל有强行夺取、抢走之意。“夺去”既保留力度，又适合以“干旱和炎热”为主语；同一动词在后半句依诗意补出。
- source_word: מֵימֵי שֶׁלֶג
  choice: 雪水
  rationale: 原文直译为“雪的水”。“雪水”简洁自然，并保留其可指雪所化之水的开放性，脚注说明更直白的理解。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: 指死者所在之处。“阴间”是现代中文圣经语境中较为清楚而庄重的对应，不将其窄化为单一坟墓，也不译作带有末世刑罚含义的“地狱”。
- source_word: חָטָאוּ
  choice: 犯罪的人
  rationale: 该形式字面为“他们犯了罪”，在此通常理解为“阴间”所夺去的对象。译作“犯罪的人”补明汉语所需的宾语关系，同时保留动词意义。
theological_decisions:
- issue: שְׁאוֹל的含义
  choice: 阴间，即死者所在之处
  alternative: 坟墓；死亡；音译“示奥尔”
  rationale: 本节是在诗歌类比中描述死者的归宿，并未明确指向最终刑罚。“阴间”保留死者领域的概念，避免误译为“地狱”；脚注列出“坟墓”这一可能表达。
- issue: 后半句的句法关系
  choice: 把“阴间”理解为省略动词“夺去”的主语，把“犯罪的人”理解为其对象
  alternative: 按极简字面断作“阴间——他们犯了罪”，或将“犯罪”理解为直接趋向阴间
  rationale: 原文后半句高度凝练，字面次序为“阴间，他们犯了罪”。结合前半句的夺取意象，补出平行谓语可形成自然且常见的理解；但译文不进一步限定这些人的罪行或审判性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以两个“夺去”显明原诗的类比关系；保留“雪水”的诗性浓缩，并用脚注解释。主文中的脚注标记与脚注逐一对应。
