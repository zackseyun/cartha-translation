base_translation:
  language: en
  yaml_path: translation/ot/job/024/002.yaml
  text: They move boundary markers[b][a]; they seize a flock and pasture it.
translation:
  language: zh_hans
  text: 他们挪动界石[a]，抢走羊群，又放牧它们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“挪走界石。”希伯来语动词可指移动或移除地产界标，以侵占别人的土地。
    reason: lexical_alternative
  - marker: b
    text: 或译：“偷走羊群，又牧养它们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: 界石
  rationale: 此处复数名词在地产侵占的语境中指划定田地界线的实体标志。“界石”比抽象的“边界”更具体，也符合现代汉语表达。
- source_word: יַשִּׂיגוּ
  choice: 挪动
  rationale: 该动词在此表示移动或撤去地产界标，从而侵占他人土地。“挪动”简洁自然，并保留究竟是移位还是移除的词义空间。
- source_word: עֵדֶר
  choice: 羊群
  rationale: 该单数集合名词通常指羊群；汉语无需用冠词表达其无定性。
- source_word: גָּזְלוּ
  choice: 抢走
  rationale: 该动词表示以暴力或不法手段夺取。“抢走”清楚传达强夺之意，同时不将其窄化为暗中偷窃。
- source_word: וַיִּרְעוּ
  choice: 又放牧它们
  rationale: רעה在这里表示放牧、使牲畜吃草；“放牧”自然地表现恶人抢走羊群后竟公然将其当作自己的来牧养。代词“它们”按汉语习惯指羊群中的羊。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的叙述语体。“界石”保留古代地产制度的具体意象；“抢走……又放牧”呈现恶人强夺后公然占有的意味。所有脚注标记均置于相关短语之后。
