  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
translation:
  language: zh_hans
  text: '因为清晨对他们众人如同幽暗[a][b]；

    因为他们熟悉幽暗中的种种恐怖[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作：“对他们众人，幽暗就是清晨。”希伯来文是紧凑的无系词句，可有不同的句法理解。
    reason: alternative_reading
  - marker: b
    text: “幽暗”所译的希伯来词也可译作“死荫”；这里主要指极深、令人畏惧的黑暗。
    reason: lexical_alternative
  - marker: c
    text: “他们熟悉”在希伯来文中为单数形式，直译为“他认识（或认得）”，这里可能以单数泛指这一类人。
    reason: grammatical_alternative
lexical_decisions:
- source_word: יַחְדָּו
  choice: 众人
  rationale: 本义为“一同、共同”；这里与“对他们”连用，表达这一群人无一例外，译作“他们众人”自然保留其集体意味。
- source_word: בֹּקֶר
  choice: 清晨
  rationale: 指早晨或黎明时分；“清晨”与下文“幽暗”形成鲜明对照，也符合本段关于昼夜的语境。
- source_word: לָמוֹ
  choice: 对他们
  rationale: 这是表示关系的复数代词形式；在无系词句中译为“对他们”，符合现代汉语表达。
- source_word: צַלְמָוֶת
  choice: 幽暗
  rationale: 该词可传统地理解为“死荫”，但在《约伯记》中常指极深的黑暗或阴森昏暗。此处上下文着重光暗与夜间恐怖，故译“幽暗”，同时以脚注保留“死荫”的词义可能。
- source_word: יַכִּיר
  choice: 熟悉
  rationale: 该动词表示认识、辨认，也可指由经历而熟知；此处“熟悉”传达恶人惯于幽暗及其恐怖的意味。希伯来文为第三人称阳性单数，但在语境中可泛指这类人，正文按汉语习惯用复数。
- source_word: בַּלְהוֹת
  choice: 种种恐怖
  rationale: 复数名词表示恐怖、惊骇之事；“种种恐怖”既保留复数意味，也适合与“幽暗中”搭配。
- source_word: כִּי
  choice: 因为
  rationale: 两次出现都可引出解释或原因；译作“因为”使本节与上下文及节内两分句的说明关系清楚。
theological_decisions:
- issue: 前半句无系词结构中“清晨”与“幽暗”的主谓关系
  choice: 清晨对他们众人如同幽暗
  alternative: 幽暗对他们众人却如清晨
  rationale: 希伯来语句式极为紧凑，词序可引起不同分析。按通常语境和较直接的句法理解，以“清晨”为话题、“幽暗”为表语；脚注保留反向理解，不把原文的歧义暗中消除。
- issue: יַכִּיר 的单数形式所指
  choice: 正文用“他们熟悉”，理解为泛指前文所说的一类恶人
  alternative: 他认得幽暗中的种种恐怖
  rationale: 原文动词为阳性单数，但上下文持续描述复数群体。现代汉语若突转为“他”容易误解为某一特定人物，因此正文采用复数，并以脚注明示原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“清晨—幽暗”保留原文强烈反差；“种种恐怖”体现复数。正文不过度直译紧凑的希伯来语词序，相关歧义、传统词义及单复数差异均由脚注交代。
