  yaml_path: translation/ot/job/024/021.yaml
  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: zh_hans
  text: 他侵害不生育的妇人[a]，也不善待寡妇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以不生育的妇人为食”。希伯来语动词字面意思是“牧放、喂养”；但在本节语境中，很可能带有掠食性侵害或剥削的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: 吞吃
  rationale: 该词通常指“牧放、喂养”，但在这里以受欺压的弱者为对象，语境明显带有敌意。“吞吃”既保留“以……为食”的词源意象，也自然表达恶人侵害、盘剥弱者的含义。
- source_word: עֲקָרָה
  choice: 不生育的妇人
  rationale: 明确保留阴性单数所指，也用现代汉语直接表达不能或没有生育的妇人；不额外加入希伯来文未明说的原因。
- source_word: לֹא תֵלֵד
  choice: 不生育
  rationale: 直译为“不生产、不生孩子”。“不生育”简洁自然，并避免用“不能生育”增添原文没有明示的情态。
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 这是该词所指社会弱势群体的标准现代汉语译法。
- source_word: לֹא יְיֵטִיב
  choice: 不善待
  rationale: 使役词形可表达“行善于、使得好、好好对待”。“不善待”在汉语中自然，并保留恶人没有以好处待寡妇的道德含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“吞吃”传达上下文中的掠夺意味，同时以脚注保留希伯来动词“牧放／喂养”的真实词义张力；后半句用“不善待”避免生硬的“不给……好处”。
