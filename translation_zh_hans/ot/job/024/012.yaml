  text: מֵ֘/עִ֤יר מְתִ֨ים יִנְאָ֗קוּ וְ/נֶֽפֶשׁ חֲלָלִ֥ים תְּשַׁוֵּ֑עַ וֶ֝/אֱל֗וֹהַּ לֹא יָשִׂ֥ים תִּפְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: zh_hans
  text: 城里传来垂死之人的呻吟[a]，受重伤者发出求救的呼喊；然而，上帝并不把这视为荒谬[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城里有人呻吟。”希伯来文 מְתִים 一词在这里含义较难确定，也可理解为“人们”。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来文含义较难确定；也可译作：“然而，上帝并不追究罪责”，或“然而，上帝并不理会这呼求”。“这”所指的也不完全明确。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: 城里传来
  rationale: מִן加“城”首先表示声音从城中发出；“城里传来”在现代汉语中自然地保留了来源意象，也不排除地点含义。
- source_word: מְתִים
  choice: 垂死之人
  rationale: 此词在本节含义较难确定，也可能指“人们”；但与下句“被杀之人”平行时，理解为濒临死亡者较贴合受暴力压迫的语境。
- source_word: יִנְאָקוּ
  choice: 呻吟
  rationale: 该动词表示因痛苦而发出的呻吟声；此译简洁并保留其强烈的感官色彩。
- source_word: וְנֶפֶשׁ
  choice: 性命
  rationale: נֶפֶשׁ可指生命、性命、自我或魂。这里译作“性命”既贴近受害者生命的呼喊，也避免在歧义处预设灵魂与身体的二分。
- source_word: חֲלָלִים
  choice: 被杀之人
  rationale: 该词通常指被击杀、遭杀戮的人；此译比单独的“伤者”更符合其常见意义和本章暴力语境。
- source_word: תְּשַׁוֵּעַ
  choice: 呼求援助
  rationale: Piel词形表达迫切求救；“呼求援助”清楚传达呼喊中隐含的求助意味。
- source_word: וֶאֱלוֹהַּ
  choice: 然而，上帝
  rationale: 连接词字面可作“而/和”，但此处苦难者的呼求与上帝未作判断之间形成明显转折，“然而”能自然呈现这种张力。
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: 并不把这视为荒谬
  rationale: 该短语含义困难。תִּפְלָה可指荒谬、悖谬或不当之事；译文尽量贴近词义，同时用“这”保留其指向对象不完全明确的特点。
theological_decisions:
- issue: 面对不义时上帝似乎没有回应
  choice: 然而，上帝并不把这视为荒谬
  alternative: 然而，上帝并不追究罪责／然而，上帝并不理会这呼求
  rationale: 本句陈述约伯对上帝似乎不介入的尖锐观察，而不是替这种张力作系统神学解释。译文保留控诉的力度，也不把困难短语确定为“上帝不听祷告”或司法意义上的“不定罪”。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“城里传来”使声音来源清楚；分号突出人的苦难与上帝似乎不回应之间的张力。正文所有脚注标记均已对应列出。
