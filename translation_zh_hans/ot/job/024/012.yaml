revisions:
- from: 城里传来垂死之人的呻吟[a]，被杀之人的性命呼求援助；然而，上帝并不把这视为荒谬[b]。
  to: 城里传来垂死之人的呻吟[a]，受重伤者发出求救的呼喊；然而，上帝并不把这视为荒谬[b]。
  rationale: 仅作一项必要的汉语表达与语境修订：将“被杀之人的性命呼求援助”改为“受重伤者发出求救的呼喊”。这按语境采用 נֶפֶשׁ 的“人”义，并保留 חֲלָלִים 可指遭暴力击伤者的范围，避免将正在求救者预设为已死亡。其余措辞及两个脚注所保存的文本歧义均维持不变。
