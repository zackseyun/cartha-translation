base_translation:
  language: en
  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: zh_hans
  text: 然而，他凭自己的力量把强者拖走；他站起来[a]，却不确信自己能活下去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他站起来，谁也不能确信自己能活下去。”希伯来文末句的主语所指并不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: 把……拖走
  rationale: משׁך的基本义是“拉、拖”。本句以“强者”为宾语，又有“凭自己的力量”，采用带有强制意味的“拖走”最贴合语境；“延续、保全”虽有解释传统，但在此较不自然。
- source_word: אַבִּירִים
  choice: 强者
  rationale: אַבִּירִים指强壮或有权势的人。“强者”简洁自然，并保留原词可兼指体力和势力的宽度。
- source_word: בְּכֹחוֹ
  choice: 凭自己的力量
  rationale: 介词בְּ在此表手段，כֹּחַ意为力量、能力或权势。“凭自己的力量”准确表达其工具性，也明确反身所属。
- source_word: יָקוּם
  choice: 他一站起来
  rationale: קום的基本义为“起来、站起”。“站起来”保留原文形象；加“一”自然表达后句与此动作相随，但不限定这是起身、兴起还是采取行动。
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: 却不能确信自己能活下去
  rationale: יַאֲמִין本义涉及信赖、确信，בַּחַיִּין直指生命或活着。此译让阳性单数动词的主语自然承接“他”，并以现代汉语传达对存活没有把握的意思。
theological_decisions:
- issue: 末句主语及所指的歧义
  choice: 将“他”理解为前句站起来的同一人：他不能确信自己能活下去。
  alternative: 可理解为一种泛指或结果性表达：他一站起来，谁也不能确信自己能活下去。
  rationale: 希伯来文动词为阳性单数，最直接的语法衔接是继续以“他”为主语；但诗句高度压缩，语境也容许末句描写压迫者给众人造成的生命不安。因此正文保留直接句法，脚注明示另一种可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拖走”呈现暴力感；“强者”避免过度限定其社会身份；末句以“确信自己能活下去”清楚表达原文关于生命保障的压缩说法。正文中的[a]与脚注对应。
