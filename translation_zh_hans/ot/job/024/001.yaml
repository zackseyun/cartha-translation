  text: מַדּ֗וּעַ מִ֭/שַּׁדַּי לֹא נִצְפְּנ֣וּ עִתִּ֑ים ו/ידע/ו לֹא חָ֥זוּ יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: zh_hans
  text: 为什么全能者没有把时日保留起来[a]？为什么认识他的人看不见他的日子[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“指定的时日”；“保留起来”也可译作“隐藏起来”或“存留起来”。
    reason: lexical_alternative
  - marker: b
    text: “他的日子”可能指上帝采取行动、施行干预或审判的日子。
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接表达约伯质问的语气，符合现代汉语习惯。
- source_word: מִשַּׁדַּי
  choice: 被全能者
  rationale: 结合被动式 נִצְפְּנוּ，将介词 מִן 理解为与施事者有关；“全能者”也是《约伯记》中 שַׁדַּי 的恰当称谓。
- source_word: נִצְפְּנוּ
  choice: 存留下来
  rationale: 该词可表示隐藏、储藏或保留；这里采用“存留下来”，既保留储存、留待将来的含义，也不额外强调隐秘性。
- source_word: עִתִּים
  choice: 时日
  rationale: 可指时间或指定的时期；“时日”简洁而庄重，并保留是否特指定期的开放性。
- source_word: וְיֹדְעָיו
  choice: 认识他的人
  rationale: 自然表达分词加第三人称单数后缀，保留对上帝具有关系性认识的含义。
- source_word: חָזוּ
  choice: 看不见
  rationale: חזה 表示看见、观看，有时含感知意味；此处用普通而有力的“看不见”。
- source_word: יָמָיו
  choice: 他的日子
  rationale: 按复数和所属后缀直译，不在正文中将其具体限定为审判或介入的日子。
theological_decisions:
- issue: “他的日子”所指为何
  choice: 正文保留“他的日子”这一凝练说法
  alternative: 他施行审判的日子；他采取行动的时日；他所定的审判之日
  rationale: 希伯来语本身含蓄，可能指上帝审判或介入的日子。直译可保留诗歌的张力，避免把某一解释写进正文。
- issue: “时日”是否明确指上帝指定的时期
  choice: 正文译作“时日”
  alternative: 指定的时日；定期
  rationale: עִתִּים 可以泛指时间，也可指特定、指定的时期；正文不强行消除这种词义空间。
translation_notes:
  register: 采用现代、庄重而易懂的问句；保留原文两个并列质问及“他的日子”的诗性含混。
