  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: zh_hans
  text: 他们赤身露体地过夜[a]，没有衣服，在寒冷中也没有遮蔽物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们赤身露体地住宿，没有衣裳，在寒冷中没有遮蔽物。”
    reason: 词汇与表达方式的替代译法；יָלִינוּ也可译为“住宿”，לְבוּשׁ也可译为“衣裳”。
lexical_decisions:
- source_word: עָרוֹם
  choice: 赤身露体
  rationale: 该词表示没有穿衣或衣不蔽体；“赤身露体”直接而鲜明，也符合本段描写受欺压者困苦处境的语境。
- source_word: יָלִינוּ
  choice: 过夜
  rationale: לין表示住宿、度过夜晚；“过夜”简洁自然，并保留其时间含义。
- source_word: מִבְּלִי
  choice: 没有
  rationale: 该组合表达缺乏或被剥夺；在“没有衣服”中符合现代汉语习惯。
- source_word: לְבוּשׁ
  choice: 衣服
  rationale: 该名词泛指衣物或一件衣裳；“衣服”自然易懂，并保留其一般性。
- source_word: כְּסוּת
  choice: 遮盖
  rationale: 该词指覆盖之物，常可指兼作保暖的衣物；“遮盖”不把具体物件限定为衣服或毯子。
- source_word: בַּקָּרָה
  choice: 在寒冷中
  rationale: 原文介词בְּ与“寒冷”构成较直接的处境表达；“在寒冷中”保留这一形式，避免把保护功能解释性地译入介词。
