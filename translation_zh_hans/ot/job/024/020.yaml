source:
  edition: WLC
  text: יִשְׁכָּ֘חֵ֤/הוּ רֶ֨חֶם מְתָ֘ק֤/וֹ רִמָּ֗ה ע֥וֹד לֹֽא יִזָּכֵ֑ר וַ/תִּשָּׁבֵ֖ר כָּ/עֵ֣ץ עַוְלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: zh_hans
  text: 母腹忘记他；蛆虫以他为甘甜的食物[a]。他不再被人记念；不义也像树木一样被折断[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蛆虫觉得他甘甜。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“不义的人也像树木一样被折断。”希伯来文用的是表示“不义、邪恶”的抽象名词，也可能借此指作恶的人。
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ
  choice: 忘记他
  rationale: 按שׁכח的基本义翻译；未完成式在诗歌语境中描述恶人死后的结局，汉语可用无时态标记的陈述句自然表达。
- source_word: רֶחֶם
  choice: 母腹
  rationale: 保留“子宫、母腹”的具体意象及其拟人作用，同时比单说“子宫”更符合庄重的诗体语域；不扩译为“他的母亲”。
- source_word: מְתָקוֹ רִמָּה
  choice: 蛆虫以他为甘甜的食物
  rationale: רִמָּה指食腐的虫或蛆；מְתָקוֹ表达“以他为甘甜”的意思。正文略作自然化，明示语境隐含的食物关系，同时在脚注保留较贴近字面的译法。
- source_word: עוֹד לֹא יִזָּכֵר
  choice: 他不再被人记念
  rationale: 保留זכר的被动语态及עוֹד לֹא所表达的“不再”；补出泛指施事“人”，使现代汉语通顺，不限定具体是谁记念。
- source_word: וַתִּשָּׁבֵר
  choice: 被折断
  rationale: 保留שׁבר的被动意义；“折断”与树木的比喻自然搭配，也不强化为“粉碎”。
- source_word: כָּעֵץ
  choice: 像树木一样
  rationale: 直接保留比较结构；עֵץ在此按“树木”理解，而不改译成较含混的“木头”。
- source_word: עַוְלָה
  choice: 不义
  rationale: 采用抽象名词，忠实保留希伯来语在“不义、邪恶”与借抽象指作恶者之间的张力；“不义”兼具现代可懂性与庄重语体。
theological_decisions:
- issue: עַוְלָה应按抽象概念“不义”翻译，还是具体化为“不义的人”。
  choice: 正文保留抽象表达：“不义也像树木一样被折断”。
  alternative: “不义的人也像树木一样被折断。”
  rationale: 希伯来语形式上是抽象名词，不宜在正文中无声地将其具体化；但抽象名词可能借代作恶者，因此以脚注保留具体理解。
translation_notes:
  register: 采用现代、庄重而清晰的诗体汉语。分号对应诗行中的紧密并列；“母腹”“记念”“不义”保留原文凝练而强烈的意象。脚注标记均紧随其所说明的词句。
