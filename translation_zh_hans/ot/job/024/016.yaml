  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: zh_hans
  text: 在黑暗中，他凿墙进入房屋[a]；白天，他们把自己关起来[b]；他们不认识光[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在黑暗中凿穿房屋的墙壁。”原文动词直指挖掘、凿穿；在这里很可能是说盗贼凿墙而入。
    reason: lexical_alternative
  - marker: b
    text: 或译：“白天，他们把自己封闭起来。”原文强调关闭、封住，意思可能是他们在日间藏身不出。
    reason: lexical_alternative
  - marker: c
    text: “光”首先可指日光；在这里也可能带有作恶者躲避显露的道德意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתַר
  choice: 挖穿
  rationale: 该动词本义是挖掘、凿穿；在盗窃语境中指挖穿房屋的墙壁进入。“挖穿”既保留具体动作，也让现代读者明白其破门入室的性质。
- source_word: בַּחֹשֶׁךְ
  choice: 在黑暗中
  rationale: 既可指夜间，也突出借黑暗隐藏行迹；此译保留原文意象。
- source_word: בָּתִּים
  choice: 房屋
  rationale: 直译复数名词，符合盗贼凿墙进入住宅的语境。
- source_word: יוֹמָם
  choice: 白天
  rationale: 与前句“在黑暗中”形成鲜明而简洁的诗性对照。
- source_word: חִתְּמוּ לָמוֹ
  choice: 把自己关起来
  rationale: חִתְּמוּ有封住、关闭之意；לָמוֹ在这里可表达为自己如此行，即白天闭门藏匿。此译自然表达主要语义，同时以脚注保留“封闭起来”的字面色彩。
- source_word: לֹא יָדְעוּ אוֹר
  choice: 他们不认识光
  rationale: 保留“认识”与“光”的原文措辞，使其既可指不与日光相熟，也可带有回避光明的道德意味，而不在正文中替读者作出单一解释。
theological_decisions:
- issue: “光”是否具有道德象征意义
  choice: 正文保留“光”，不解释为单纯的“日光”或“正道”
  alternative: 译为“日光”或解释性地译为“正道”
  rationale: 上下文首先描写恶人夜间作案、白天藏匿，因此日光含义明显；但智慧文学语境也容许道德意味。保留原词可维持这种张力。
- issue: 首句单数与后两句复数的数变化
  choice: 全节以复数“他们”自然表达这一类作恶者
  alternative: 首句译为“他”，其后改为“他们”
  rationale: 马所拉文本首句动词חָתַר为单数，后文חִתְּמוּ和יָדְעוּ为复数，可能由典型个体转向整类人。中文正文采用复数可避免突兀，同时不改变所指群体；不据此建立额外神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“挖穿房屋”刻意保留古代盗贼凿墙而入的具体画面；分号呈现原文三段并列及黑暗与白天、光的对照。所有脚注标记均置于相应正文词句之后。
