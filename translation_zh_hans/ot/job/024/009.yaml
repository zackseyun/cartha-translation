  text: They snatch the orphan from the breast[a], and they take a pledge from the poor.
translation:
  language: zh_hans
  text: 他们从乳房旁抢走孤儿[a]，又向穷人索取抵押物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处难解。正文将该词理解为“乳房”（或“胸怀”），意指恶人甚至从乳房旁强行夺走孤儿；也有人将其理解为“劫掠”或“毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: 抢走
  rationale: גזל表示以暴力或不公正的方式夺取；“抢走”既体现强夺，也符合本节描写恶人欺压弱者的语境。
- source_word: מִשֹּׁד
  choice: 尚在吃奶的
  rationale: 此处希伯来文疑难。按传统语境理解，其辅音可联系“乳房”，指孩子仍在吃奶；正文以自然汉语表达这一含义，并用脚注保留马索拉元音所支持的另一种理解。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: יָתוֹם通常指失去父亲或父母的孩子；“孤儿”简洁自然，并保留其作为弱势群体的社会含义。
- source_word: וְעַל
  choice: 向
  rationale: עַל本义可为“在……之上、针对”，与חבל连用时指向某人索取抵押物；汉语用“向”表达该关系最自然。
- source_word: עָנִי
  choice: 穷人
  rationale: עָנִי可指贫穷、困苦或受压迫的人；债务抵押的语境以“穷人”最贴切。
- source_word: יַחְבֹּלוּ
  choice: 索取抵押物
  rationale: חבל在此指为债务收取抵押品。“索取抵押物”清楚表达其法律经济含义，也体现对穷人的盘剥。
