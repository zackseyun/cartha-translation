  yaml_path: translation/ot/job/024/011.yaml
  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: zh_hans
  text: 他们在自己的田垄之间[a]榨油[b]；在酒榨中踩踏葡萄，却仍然口渴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “田垄”或译“墙垣”“成排的作物”或“梯田”。此希伯来词所指不确定，可能指围起或分层排列的农业作业区。
    reason: lexical_alternative
  - marker: b
    text: 此希伯来动词的词义向来难以确定，字面与“油”或“发亮”有关；按上下文，通常理解为榨取橄榄油。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין שׁוּרֹתָם
  choice: 在石墙之间
  rationale: בֵּין 表示空间位置；שׁוּרוֹתָם 的所指并不确定，可指成排之物或墙垣。农业劳作语境中的“石墙之间”具体自然，同时以脚注保留其他可能。
- source_word: יַצְהִירוּ
  choice: 榨油
  rationale: 该词形传统上较难解释，但在农业生产语境中通常理解为提取橄榄油；“榨油”简洁自然。
- source_word: יְקָבִים
  choice: 酒池
  rationale: 指踩压葡萄、收集汁液的酒榨或酒池；与后面的“踹”结合，译作“酒池”符合古代劳作场景。
- source_word: דָּרְכוּ
  choice: 踹葡萄
  rationale: 动词本义是踩踏，在酒池语境中特指用脚踩葡萄；补出宾语使现代汉语读者易懂。
- source_word: וַיִּצְמָאוּ
  choice: 却仍然口渴
  rationale: 连接词在此形成强烈反差：劳工生产饮品，却自己受渴。“却”传达这一讽刺性对照，“仍然”突出他们未能享用劳动成果。
