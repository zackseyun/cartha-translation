base_translation:
  language: en
  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: zh_hans
  text: 他赐他们安稳[a]，他们便得到扶持[b]；他的眼目察看他们所行的路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文前半句用单数：“赐他安稳……他得到扶持”；因本节末尾说“他们所行的路”，正文按群体意义译为复数。
    reason: alternative_reading
  - marker: b
    text: 或较形式对应地译作：“他赐他安稳，他便得到扶持；他的眼目察看他们所行的路。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: 赐
  rationale: נתן为Qal未完成式第三人称阳性单数；与“安稳”连用时表示给予、赐予。用“赐”既自然庄重，也符合此处未明说的施予者最可能为上帝这一语境，但不在正文中补出其名。
- source_word: לוֹ
  choice: 他们
  rationale: 词形本为单数“给他”，但末句明确使用复数“他们的路”。正文按群体或分配性的意义译为“他们”，同时用脚注保留原文的单数形式。
- source_word: לָבֶטַח
  choice: 安稳
  rationale: בֶּטַח表示安全、安稳的状态。“安稳”与“赐”搭配自然，也不把意义收窄为主观的“信心”。
- source_word: וְיִשָּׁעֵן
  choice: 他们便得到扶持
  rationale: שׁען的Nifal未完成式可表示“得到支撑、受扶持”或“倚靠”。此处接续“赐他们安稳”，被动结果义较合适；“便”体现两分句之间自然的结果联系，但不作过强的因果解释。
- source_word: וְעֵינֵיהוּ
  choice: 他的眼目
  rationale: 原文直译为“他的双眼/眼睛”。“他的眼目”保留诗体庄重感；代词所指最自然理解为上帝，但原文没有明说，故不直接补出“上帝”。
- source_word: עַל
  choice: 察看
  rationale: עַל本义为“在……之上”，与“眼目”构成关注、注视的表达。汉语以“眼目察看”传达其 attentive regard，避免生硬直译为“眼目在……上”。
- source_word: דַּרְכֵיהֶם
  choice: 他们所行的路
  rationale: דֶּרֶךְ可指实际道路，也可比喻行为、生活方式。“所行的路”保留道路意象，同时让行为层面的含义清楚可感。
theological_decisions:
- issue: 本节单复数交替及各代词的所指
  choice: 前半按群体意义译作“他们……他们”，末句保留“他的眼目……他们所行的路”
  alternative: 形式上全按单数译作：“他赐他安稳，他便得到扶持；他的眼目察看他们所行的路。”
  rationale: 希伯来文先用单数“给他”“他得到扶持”，末尾却用复数“他们的路”。正文采用群体或分配性理解，使所指连贯，同时保留“他的眼目”这一单数施事者，不把诗句强行整齐化；脚注说明原文形式，以保存其真实张力。
- issue: “他的眼目”的所指
  choice: 不在正文中点明，只保留“他的”
  alternative: 明确译为“上帝的眼目”
  rationale: 上下文最自然地指向上帝，但本节原文并未直接命名。保留代词可避免把合理推断提升为明说，并保存经文的含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安稳”“得到扶持”清楚传达诗句意义；“眼目”“所行的路”保留希伯来诗歌的意象和经文语体。正文中的[a]、[b]均与脚注对应。
