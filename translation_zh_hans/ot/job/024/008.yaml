  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: zh_hans
  text: 他们被山间的暴雨淋透[a]；没有避身之处，就紧抱岩石[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们被山中的急流浸湿”；又或：“他们被群山的倾盆大雨淋湿”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们拥抱岩石。”这表示他们紧贴岩石，以求遮蔽。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם הָרִים
  choice: 被山间的暴雨
  rationale: זֶרֶם可指猛烈的水流、倾盆雨或暴雨；与群山及露宿的语境相合。“山间的暴雨”在现代汉语中自然，也保留天气现象与强烈程度。介词מִן在此按致因表达为“被……”。
- source_word: יִרְטָבוּ
  choice: 淋透
  rationale: 该动词意为变湿、湿透；“淋透”准确呈现人在暴雨中全身湿透的处境，比单说“弄湿”更有力度。
- source_word: וּמִבְּלִי מַחְסֶה
  choice: 无处遮蔽
  rationale: מִבְּלִי表示缺少、没有，מַחְסֶה指避难处或遮蔽处。译文突出眼前没有可避雨的地方，符合具体语境。
- source_word: חִבְּקוּ
  choice: 紧抱
  rationale: 该动词直义为“拥抱、抱住”。“紧抱”保留原文鲜明意象，同时自然暗示他们贴近岩石求得些许遮蔽。
- source_word: צוּר
  choice: 岩石
  rationale: צוּר指岩石或岩壁。“岩石”通俗而庄重，并保留原文具体、崎岖的山地意象。
theological_decisions: []
