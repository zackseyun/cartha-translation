revisions:
- from: 他们暂时被高举，转眼便不复存在；他们被压低，像众人一样被收聚[a]，又像麦穗的穗头被割下[b]。
  to: 他们暂时被高举，片刻之后便不在了；他们被降卑，像众人一样被收聚[a]，又像谷穗的穗头一样被割下[b]。
  rationale: 修订仅改善与原文相符的时间表达、中文搭配及谷物用语：以“片刻之后便不在了”避免增添“转眼”的瞬时修辞；以“被降卑”恢复高举与降下的对照；以“谷穗”保留原文的泛称。罕见动词“被收聚”的不确定性及其脚注均予保留。
