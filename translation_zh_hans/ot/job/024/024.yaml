  text: ר֤וֹמּוּ מְּעַ֨ט וְֽ/אֵינֶ֗/נּוּ וְֽ/הֻמְּכ֗וּ כַּ/כֹּ֥ל יִקָּפְצ֑וּ/ן וּ/כְ/רֹ֖אשׁ שִׁבֹּ֣לֶת יִמָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: zh_hans
  text: 他们暂时被高举，片刻之后便不在了；他们被降卑，像众人一样被收聚[a]，又像谷穗的穗头一样被割下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被带走”。这里的希伯来语动词罕见，确切含义有争议。
    reason: lexical_alternative
  - marker: b
    text: 直译：“如谷穗的头。”
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ מְּעַט
  choice: 暂时被高举
  rationale: רום在此为被动或结果意义，与后文“被压低”形成鲜明逆转；מְעַט结合随后的消逝，宜作时间性的“暂时”。
- source_word: וְאֵינֶנּוּ
  choice: 转眼便不复存在
  rationale: 这一希伯来语惯用语表示不再存在或不见了；虽然后缀形式为单数，但置于复数动词之间，可按分配意义自然译为复数。
- source_word: וְהֻמְּכוּ
  choice: 他们被压低
  rationale: 保留被动语态及与“被高举”相反的高低意象，不额外断定施动者或具体方式。
- source_word: כַּכֹּל
  choice: 像众人一样
  rationale: 直译比较结构“像所有人”，表达他们与众人共有同一结局，不增加“其他”等源文未明说的成分。
- source_word: יִקָּפְצוּן
  choice: 被收聚
  rationale: 该罕见动词的具体语义有争议；“被收聚”保留可能的聚拢意象，同时以脚注提示“被带走”的译法。
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: 又像麦穗的穗头
  rationale: 较贴近原文“谷穗之头”，并以自然的现代汉语呈现收割图景。
- source_word: יִמָּלוּ
  choice: 被割下
  rationale: 在麦穗意象中理解为割下穗头，既契合收割画面，也表达他们最终被除去。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留“高举—压低”的对照和连续被动结构；不明确施动者，以保存原文的含蓄。原英文脚注a所说的“不复存在”实际对应 וְאֵינֶנּוּ，正文已直接这样表达，因此不另设重复脚注；脚注标记按中文正文中的实际位置重新编排。
