base_translation:
  language: en
  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: zh_hans
  text: 这些人是在背叛光明的人中[a]；他们不认识光明的道路[b]，也不留在光明的路径上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些人曾在背叛光明的人中。”原文动词在形式上可译为过去时“曾在”，但在这段诗歌中也可能是概括这一类人的持续特征。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“它的道路……它的路径”；两个代词后缀最自然地回指“光明”。正文为使汉语清楚自然，复述“光明”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הָיוּ בְּמֹרְדֵי אוֹר
  choice: 这些人属于背叛光明的人
  rationale: 独立代词 הֵמָּה 带强调和指示意味，译作“这些人”；הָיוּ 虽为完成式，但诗歌语境是在概括一类人的持续特征，故以现代汉语现在时表达；בְּמֹרְדֵי 表示归入某一类，译作“属于……的人”，同时保留 מרד 的主动含义“背叛”。
- source_word: אוֹר
  choice: 光明
  rationale: “光明”自然保留原文可能兼具实际光线与道德象征的含义，不将其中任何一层解释固定化。
- source_word: לֹא הִכִּירוּ
  choice: 不认识
  rationale: הכיר 可指认识、辨认或承认；“不认识”在此与“道路”搭配自然，并保留认知与认可之间的语义空间。
- source_word: דְרָכָיו
  choice: 光明的道路
  rationale: 第三人称阳性单数后缀最自然地回指语法上为阳性单数的 אוֹר。汉语不用“它的”，而复述“光明”，可清楚表达所指并避免不必要的拟人化。
- source_word: וְלֹא יָשְׁבוּ
  choice: 也不留在
  rationale: ישב 在路径意象中表示停留、居留或持守，而不是字面的“坐”；“留在”符合现代汉语并保存持续置身其中的意味。
- source_word: בִּנְתִיבֹתָיו
  choice: 光明的路径上
  rationale: נְתִיבוֹת 与“道路”平行但用词有别，译作“路径”；后缀仍回指“光明”。汉语以“在……上”表达行路意象较自然。
theological_decisions:
- issue: “道路”和“路径”所带代词后缀的指代
  choice: 视为回指“光明”，译作“光明的道路……光明的路径”。
  alternative: 视为回指一个隐含的位格对象，译作“他的道路……他的路径”。
  rationale: 最近且语法一致的先行词是阳性单数名词 אוֹר“光明”，全句意象也围绕背叛光明展开。明确复述“光明”既忠于句法，又避免把原文未明说的位格化解释加入正文。
- issue: “光明”的含义
  choice: 保留“光明”一词的实际与道德双重可能性。
  alternative: 明确解释为上帝、正义、白昼或社会秩序。
  rationale: 上下文容许实际光线与道德象征相互映照；正文不应只固定为其中一种神学或文学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“背叛光明”保存诗性与道德张力；“道路／路径”保留希伯来语平行结构中的近义变化。
