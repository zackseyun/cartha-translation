  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: zh_hans
  text: 奸夫的眼睛等候黄昏[a]，说：“没有眼睛会看见我。”他把脸遮起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “黄昏”也可译作“暮色”。希伯来词可指一天将尽时光线昏暗的时分，与暗中行事的语境相合。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“他放置脸的遮蔽”。这是压缩的希伯来表达，意思是他遮住或掩饰自己的脸，以免被人认出。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: 眼睛
  rationale: 两处均保留具体的“眼睛”意象：奸夫窥候时机，也害怕被人看见。
- source_word: נֹאֵף
  choice: 奸夫
  rationale: 该阳性单数分词指犯奸淫的男人；“奸夫”简洁自然，并保留其性别和行为含义。
- source_word: שָׁמְרָה
  choice: 等候
  rationale: 该动词基本义为看守、留意；此处是等待昏暗时刻来临，“等候”符合语境。
- source_word: נֶשֶׁף
  choice: 黄昏
  rationale: 该词可指暮色或昏暗时分；上下文是借天色昏暗隐秘行事，“黄昏”自然且不过度限定。
- source_word: לֵאמֹר
  choice: 心里说
  rationale: 原文为“说”；语境更可能表达奸夫内心的盘算，译作“心里说”使现代汉语自然，同时未改变引语内容。
- source_word: תְשׁוּרֵנִי
  choice: 会看见我
  rationale: שׁוּר意为观看、看见；此译简明，并与前面的“眼睛”呼应。
- source_word: וְסֵתֶר פָּנִים
  choice: 又把脸遮起来
  rationale: 原文是压缩表达，字面近于“设置脸的遮蔽”；此译传达遮脸以免被认出的动作，符合现代汉语。
- source_word: יָשִׂים
  choice: 把……遮起来
  rationale: 该动词意为放置、设置；与“脸的遮蔽”合译成自然的动作表达。
