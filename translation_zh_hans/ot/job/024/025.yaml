  yaml_path: translation/ot/job/024/025.yaml
  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: zh_hans
  text: 若不是这样，谁能证明我是说谎的，使我的话归于虚无呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: 若不是这样
  rationale: 承接约伯前面的论述，引出条件式挑战；补出“这样”符合现代汉语表达，同时保留原文简洁的指涉。
- source_word: אֵפוֹ
  choice: （由条件句与反问语气体现）
  rationale: 该话语助词在此加强推论和挑战意味；汉语“若……谁能……”已经自然表达“那么”的逻辑关系，避免句式累赘。
- source_word: מִי
  choice: 谁
  rationale: 直接保留疑问代词，并构成带挑战意味的反问。
- source_word: יַכְזִיבֵנִי
  choice: 能证明我是说谎的
  rationale: 使役形表达证明某人为虚假或说谎者；这一译法保留针对约伯本人可信性的司法和辩论色彩。
- source_word: וְיָשֵׂם
  choice: 使
  rationale: 原义为“放置、设定”，与后面的“归于虚无”合用时表达使之成为某种结果。
- source_word: לְאַל
  choice: 归于虚无
  rationale: 表达将某物化为无有、使其失去效力；“归于虚无”庄重自然，并保留原文强烈的归零意象。
- source_word: מִלָּתִי
  choice: 我的话
  rationale: 保留单数“话、言语、陈述”的简洁和分量，指约伯刚才所作的论述。
theological_decisions: []
