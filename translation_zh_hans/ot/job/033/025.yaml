translation:
  language: zh_hans
  text: 他的身体比年轻时更焕发[a]；他重返青春的岁月[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的身体恢复鲜润，像少年人一样”，或“他的身体比少年人的更焕发”。这个希伯来语动词十分罕见；与“年轻、少年”有关的比较结构也可有不同理解。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“他重返青春活力的岁月。”这里的希伯来语名词既可指青春时期，也可指青春所具有的活力。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻטֲפַשׁ
  choice: 变得……更鲜嫩
  rationale: 这个罕见动词表示重新变得鲜嫩、丰润；译文保留具体的肉身意象，不以较抽象的“恢复”取代它。
- source_word: בְּשָׂרוֹ
  choice: 他的肉体
  rationale: “肉体”直接传达 בשר 的身体含义，并保留本节对人身体复苏的强调。
- source_word: מִנֹּעַר
  choice: 比年轻时
  rationale: 介词 מִן 在此可按比较义理解，表示他的肉体比年轻时还要鲜嫩；原文也容许与“少年”相关的其他构句，故以脚注说明。
- source_word: יָשׁוּב
  choice: 他重返
  rationale: 阳性单数动词最自然地以那个人为主语；“重返”也简洁保留“回来、返回”的方向感。
- source_word: לִימֵי
  choice: ……的岁月
  rationale: 对应“……的日子”这一构词结构；中文用“岁月”与“青春”搭配更自然庄重。
- source_word: עֲלוּמָיו
  choice: 青春
  rationale: 该词可指青春时期，也可侧重青春活力；正文采用较少解释性的“青春”，将“活力”的可能含义留在脚注中。
