source:
  edition: WLC
  text: אִם יֵ֤שׁ עָלָ֨י/ו מַלְאָ֗ךְ מֵלִ֗יץ אֶחָ֥ד מִנִּי אָ֑לֶף לְ/הַגִּ֖יד לְ/אָדָ֣ם יָשְׁרֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/023.yaml
  text: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
translation:
  language: zh_hans
  text: 如果有一位天使[a]为他作中保，千人中仅有一位，向人说明他所当行的正道[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”或译“使者”；“中保”也可译作“解释者”或“代言者”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“向人宣告他的正直。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ
  choice: 如果……有
  rationale: 保留条件句的假设意味，并以现代汉语自然表达存在句。
- source_word: עָלָיו
  choice: 他身边
  rationale: עַל 在这里可表达与此人的关系，也可能隐含为他效力之意；“身边”自然地保留临在关系，避免把代求功能说得过实。
- source_word: מַלְאָךְ
  choice: 天使
  rationale: 该词可指使者或天使；本段语境较支持天上的使者，但脚注保留“使者”的可能。
- source_word: מֵלִיץ
  choice: 中保
  rationale: 该词可指居间传话、解释、代言或调解者；“中保”简洁体现其居间角色，同时不规定具体身份，脚注保留其他译法。
- source_word: אֶחָד מִנִּי אָלֶף
  choice: 千里挑一
  rationale: 这是表示极其罕见或难得的惯用说法；“千里挑一”是现代汉语对应的自然成语。
- source_word: לְהַגִּיד
  choice: 说明
  rationale: 表达告知、宣明或解释之意；与中保向人讲明正道的语境协调。
- source_word: לְאָדָם
  choice: 向人
  rationale: אָדָם 在这里指具体的人，也具有一般性；汉语“人”无需额外标示性别。
- source_word: יָשְׁרוֹ
  choice: 他当行的正道
  rationale: 该词源于“正直、正当”，后缀所指及短语含义存在歧义；正文采用较自然的“对他而言正确之事/道路”之义，脚注保留“他的正直”这一较形式对应的理解。
theological_decisions:
- issue: מַלְאָךְ מֵלִיץ 的身份与功能
  choice: 译作“一位天使，一位中保”，不进一步确认其身份。
  alternative: 可理解为人间的使者或解释者，也可理解为具有代求意味的天上中介者。
  rationale: 原文只用宽泛词语描述这位居间者，没有明确支持更具体的天使论或基督论认定，因此保留其神学张力。
- issue: יָשְׁרוֹ 所指为何
  choice: 正文理解为向这人说明他当行的正道。
  alternative: 也可理解为宣告这人的正直。
  rationale: 希伯来语形式允许后缀指向此人，而名词既可表示其正直，也可表示对他而言正确合宜之事；用脚注保留两种读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“千里挑一”传达原文习语的罕见性；全句以逗号收尾，以配合本节尚未完结、延续至下一节的条件结构。
