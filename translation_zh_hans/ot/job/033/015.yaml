  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: zh_hans
  text: 在梦中，在夜间的异象中；当沉睡临到人、人在床上睡着的时候，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: 在梦中
  rationale: 介词 בְּ 与“梦”连用，表示上帝说话时所处的情境；“在梦中”自然、准确，并与下句平行。
- source_word: חֶזְיוֹן לַיְלָה
  choice: 在夜间的异象里
  rationale: 原文直译为“夜的异象”。译文保留“异象”和“夜间”的意象，也与“在梦中”形成诗体平行。
- source_word: בִּנְפֹל
  choice: 当……临到
  rationale: 带介词 בְּ 的不定式结构引出时间从句；结合主语“沉睡”，译作“当……临到”符合现代汉语表达。
- source_word: תַּרְדֵּמָה
  choice: 沉睡
  rationale: 该词指深沉的睡眠，有时出现在上帝特殊作为的语境中；“沉睡”既准确易懂，又不把它过度解释为“出神”。
- source_word: עַל אֲנָשִׁים
  choice: 临到人们
  rationale: אֲנָשִׁים 在这里泛指人类个体。现代汉语“人们”自然涵盖这种通称意义，且汉语无需借助带性别标记的词来反映希伯来语阳性复数形式。
- source_word: בִּתְנוּמוֹת
  choice: 酣睡之时
  rationale: 复数形式可表现睡意或沉睡状态的延续。汉语不宜机械保留复数，译作“酣睡之时”兼顾诗意、语义和句法。
- source_word: עֲלֵי מִשְׁכָּב
  choice: 在床上
  rationale: 原文为“在床榻之上”，单数具有集合或诗体用法；“在床上”是自然准确的现代汉语。
theological_decisions:
- issue: אֲנָשִׁים 的通称与语法性别
  choice: 人们
  alternative: 男人／众人
  rationale: 该阳性复数名词在本节泛指人，并非限定成年男性。现代汉语“人们”直接表达原文的通称范围，不增添性别限定，也不改变神向人说话这一语境。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留原文由“梦／夜间异象”和“沉睡／床上酣睡”构成的诗体平行。本节句法承接上下文，因此末尾保留逗号。
