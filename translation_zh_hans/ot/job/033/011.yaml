  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: zh_hans
  text: 他把我的双脚放在足枷中；他监视[a]我一切的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “监视”或译“看守”。希伯来语动词可指监看、看守或守护；这里的语境较倾向于带敌意的严密审察，而不是保护。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: 扣在
  rationale: שׂים意为“放置、安放”；与足枷搭配时，“扣在……里”以自然汉语准确表达将双脚置于拘束器具中的动作。
- source_word: בַּסַּד
  choice: 在足枷里
  rationale: סַד指固定或拘束双脚的刑具。“足枷”保留具体的惩罚性禁锢意象，也避免把它泛化为一般的锁链。
- source_word: רַגְלָי
  choice: 我的双脚
  rationale: 该形式带第一人称单数后缀，所指自然是说话人的两只脚；“双脚”符合现代汉语表达。
- source_word: יִשְׁמֹר
  choice: 监视
  rationale: שׁמר可表示看守、守护或留意。此处是在转述约伯所抱怨的严密审察，与前半句的拘禁意象相应，因此译作“监视”，但在脚注保留“看守”这一可能。
- source_word: כָּל
  choice: 一切
  rationale: 准确表达无一遗漏的范围，并与“道路”自然搭配。
- source_word: אָרְחֹתָי
  choice: 我所走的……道路
  rationale: אֹרַח既可指实际道路，也常比喻人的行为和人生行程；此译保留道路意象，同时让现代汉语读者自然理解为人的一切行动。
theological_decisions:
- issue: 第二分句描写的是保护性的看顾，还是带敌意或司法意味的审察
  choice: 采用“监视”，表达严密而不利的审察
  alternative: 译作“看守”或“守护”，表达较中性甚至保护性的照管
  rationale: 上下文中，以利户正在复述约伯的申诉：上帝把他当作敌人，并限制、审察他的行动。因而“监视”更符合语境；不过原动词本身语义较宽，脚注保留另一种理解，以免消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“足枷”保留古代拘束双脚之刑具的具体形象；“我所走的一切道路”兼顾字面的道路隐喻及行为、人生行程的引申义。
