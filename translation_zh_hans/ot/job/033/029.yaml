  terminology: “上帝”对应 אֵל 恰当。“人”可自然承载 גָּבֶר 在此的代表性单数意义；脚注应说明其阳性单数词形，但不宜将“一个男人”说成唯一的“直译”，因为该词在语境中可作泛指个体的人。“两次、三次”应保留，以免把有限数词并列直接确定为“屡次”。
