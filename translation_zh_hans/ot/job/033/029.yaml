  text: הֶן כָּל אֵ֭לֶּה יִפְעַל אֵ֑ל פַּעֲמַ֖יִם שָׁל֣וֹשׁ עִם גָּֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/029.yaml
  text: Look[a], God does all these things two or three times with a man,
translation:
  language: zh_hans
  text: 看哪，上帝向人施行这一切作为，两次、三次。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “两次、三次”也可指反复施行。原文“人”是阳性单数名词；在这里代表个体的人。
    reason: 说明希伯来数词并列所含的重复意味，并澄清阳性单数名词的代表性用法。
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 这是引人注意的语篇助词；“看哪”保留其强调和指示作用，同时符合庄重的现代汉语经文语体。
- source_word: כָּל אֵלֶּה
  choice: 这一切的事
  rationale: 该短语回指上文所述上帝的种种作为；补出“的事”使汉语自然，并保留“这一切”的总括意义。
- source_word: יִפְעַל
  choice: 行
  rationale: פעל表示实施、做出行动；“行”能与“事”自然搭配，也保留较为庄重的语气。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל在此指上帝，并非需要音译的专名；“上帝”是清楚自然的对应表达。
- source_word: פַּעֲמַיִם שָׁלֹשׁ
  choice: 两次、三次
  rationale: 原文直译为“两次，三次”，表示上帝反复采取行动；保留数词并列，比意译为“屡次”更贴近希伯来文。
- source_word: עִם
  choice: 向
  rationale: עִם基本义为“与”，但在此描述上帝对人的作为；汉语说“向人行”较自然，又不将其进一步解释成“为人”。
- source_word: גָּבֶר
  choice: 人
  rationale: גָּבֶר词汇形式为阳性单数，可指一个男人，也可代表个体的人；现代汉语“人”本身不标示性别，能自然表达此处的代表性单数。
theological_decisions:
- issue: גָּבֶר的阳性单数与代表性用法
  choice: 人
  alternative: 男人
  rationale: 原文使用阳性单数名词，但在语境中泛指上帝所面对的个体人类。汉语“人”既不抹去其单数代表性，也避免使读者误以为仅限男性；脚注说明其字面形式。
- issue: פַּעֲמַיִם שָׁלֹשׁ所表达的重复程度
  choice: 两次、三次
  alternative: 屡次
  rationale: 保留原文并列数词造成的张力，不把它确定解释为无限次的“屡次”；脚注提示其也可理解为反复施行。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“看哪”保留原文的强调语气；“两次、三次”刻意保留希伯来文的数词排列。脚注标记置于整句末，涵盖重复习语及“人”的词义说明。
