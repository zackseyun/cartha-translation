base_translation:
  language: en
  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: zh_hans
  text: 他使这人的性命免于落入深坑[a]，使他的生命不致死于兵器[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深坑”也可译作“坟墓”或“毁灭”。
    reason: lexical_alternative
  - marker: b
    text: “兵器”原文可能更具体地指投射的武器，也可能指刀剑；本句是说免遭暴力死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: 使……免
  rationale: חשׂך在使役词形中表示拦阻、保全或使某人免于危险；“使……免”在现代汉语中自然地表达防止其进入死亡境地的含义。
- source_word: נַפְשׁוֹ
  choice: 这人的性命
  rationale: נפש在此主要指人的生命或本人，而非专指与身体相对的“灵魂”。译作“性命”既保留诗歌语体，也与死亡危险的语境相合；“这人”明确其指前文所说的人。
- source_word: מִנִּי שָׁחַת
  choice: 免下深坑
  rationale: שׁחת可指坑、坟墓或毁灭，在《约伯记》的诗歌意象中常象征死亡领域。“深坑”保留具体意象，而“下”自然表达被阻止进入其中。
- source_word: וְחַיָּתוֹ
  choice: 他的生命
  rationale: 此处חיה所构成的名词指人的生命，与上句נפש形成同义平行；译作“生命”清楚自然，又保留两行用词的变化。
- source_word: מֵעֲבֹר בַּשָּׁלַח
  choice: 不致死于兵器
  rationale: עבר的基本义是经过、越过，但“עבר בַּשֶּׁלַח”在此语境中表示因兵器而逝去，即遭受暴力死亡。直译为“经过兵器”在汉语中含义不明，因此按语境译出结果，同时不把兵器种类说得过细。
- source_word: בַּשָּׁלַח
  choice: 兵器
  rationale: שׁלח在这里指致命武器，可能更具体地指投射武器或刀剑。“兵器”保留词义范围，避免在证据不足时过度限定。
theological_decisions:
- issue: נפש与חיה是否表示两种可分离的人性成分
  choice: 按同义平行译为“性命”和“生命”
  alternative: 将נפש译作“灵魂”，将חיה译作“生命”
  rationale: 本节两行都描述人免于死亡，没有充分依据把两词解释为灵魂与肉身生命的严格区分；采用语义相近而用词有别的译法，可保留希伯来诗歌的平行结构而不引入特定人论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。上句保留“深坑”的死亡意象，下句以“不致死于”传达希伯来语组合在语境中的含义；两处“性命／生命”体现原文近义平行，不制造灵魂与身体的教义性区分。
