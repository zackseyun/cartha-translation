  naturalness: “在人前歌唱”庄重自然。“扭曲了正直”略显抽象，改为“把正直的事扭曲了”更符合现代汉语，同时不缩窄原文宾语。末句改为“我却没有受到相应的报应”，消除重复宾语和语序错误。
