base_translation:
  language: en
  yaml_path: translation/ot/job/033/027.yaml
  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: zh_hans
  text: '他在人前歌唱[a]，说：


    “我犯了罪，

    把正直的事扭曲了；

    我却没有受到相应的报应[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “歌唱”也可译作“观看”；若取后一义，本句可译为“他观看世人，说”。
    reason: יָשֹׁר的词源和句法分析存在古老歧义；脚注保留另一种可行理解，且不改变原句主语。
  - marker: b
    text: 也可理解为“这并没有使我得益处”。原文直译为“这没有与我相称／等值”。
    reason: וְלֹא שָׁוָה לִי涉及“相称、等值”或“有益”的语义范围；上下文可理解为未受相应报应，但具体所指并不完全明确。
lexical_decisions:
- source_word: יָשֹׁר
  choice: 歌唱
  rationale: 该词在本句中可理解为“歌唱”，与介词短语“在人前”自然衔接，也符合所提供审校层；但其词形也可被理解为“观看”，故以脚注保留歧义。
- source_word: וְיָשָׁר הֶעֱוֵיתִי
  choice: 扭曲了正直
  rationale: 尽量保留原文中“正直”与“使之弯曲、歪曲”的鲜明对照，不将宾语具体化为某条教义性解释。
- source_word: וְלֹא שָׁוָה לִי
  choice: 却没有照我所当得的报应我
  rationale: שׁוה的核心涉及相称、等值；此译法在上下文中表达所得结果与罪责并不相称，同时以脚注说明另一种可能理解。
theological_decisions:
- issue: 罪人所得结果与其罪责的关系
  choice: 没有照我所当得的报应我
  alternative: 犯罪并没有使我得益处
  rationale: 原短语简练且存在语义张力；正文采用“未按所当得的受报”这一上下文连贯的理解，但不把它扩展成完整的刑罚代赎论述，并在脚注保留“无益”解法。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“在人前歌唱”保持诗歌语气；引语分行呈现忏悔与结果之间的平行关系。所有歧义均通过正文与脚注保留，未加入宗派性术语。
