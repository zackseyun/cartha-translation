  text: then he opens the ears of men and seals their instruction[a].
translation:
  language: zh_hans
  text: 那时，他开启人的耳朵，并在给他们的训诫上盖印[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诫”也可译作“警告”或“管教”；希伯来语 מוּסָר 可指教导、纠正、管教或警告。直译为“封印他们的训诫”；“盖印”可表达使训诫确定或牢固的比喻。
    reason: 保留 מוּסָר 的词义范围，并说明 חתם 的“封印/盖印”意象，避免把原文未明说的“心”加入正文。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 这是承接上文梦和夜间异象的时间副词；“那时”自然地标明神借此向人说话的时机。
- source_word: יִגְלֶה אֹזֶן אֲנָשִׁים
  choice: 他开启人的耳朵
  rationale: גלה本义为揭开、显露；与“耳朵”搭配时是使人能够听取、领受的习语。保留“开启耳朵”的原文意象，并以“人”表达集合性的אֲנָשִׁים。
- source_word: וּבְמֹסָרָם
  choice: 把训诫……他们
  rationale: מוּסָר可指训诫、管教、纠正或警告；本段语境强调神劝戒人、使人离开恶行，因此正文采用涵盖教导与警戒意味的“训诫”。后缀ם按“他们”表达。
- source_word: יַחְתֹּם
  choice: 印在……心上
  rationale: חתם意为盖印、封印，在此表达把训诫牢固地加在人身上。“印在心上”以自然汉语传达深刻铭刻的比喻；“心上”属为使汉语完整而作的语境性补足。
theological_decisions:
- issue: 神的训诫如何作用于人
  choice: 保留“开启耳朵”和“印”的双重意象，不把它解释为不可抗拒的内在改变
  alternative: 译作“使人顺服，并确定对他们的管教”
  rationale: 原文描述神使人领受并牢固施加训诫，但没有明说人的最终回应；译文不应超出经文解决这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“开启人的耳朵”保留希伯来语意象；“印在他们心上”使חתם的盖印比喻在现代汉语中清楚可感。脚注标记已置于正文。
