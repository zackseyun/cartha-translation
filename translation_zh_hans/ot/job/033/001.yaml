base_translation:
  language: en
  yaml_path: translation/ot/job/033/001.yaml
  text: But now[a], Job, please hear my words, and listen to all my speech.
translation:
  language: zh_hans
  text: 不过，约伯啊，请听我的话，也要侧耳听我的一切言语。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用两个意思相近的词表示“我的话／我的言语”，又用两个表示听的动词，借此加强恳请的语气。“侧耳听”也可译作“留心听”。
    reason: 说明原文的近义平行和词义选择。
lexical_decisions:
- source_word: וְאוּלָם
  choice: 不过
  rationale: 这是一个带转折或强调作用的话语衔接语；“不过”自然地标示以利户转而直接恳请约伯听他说话，同时不把原文强行限定为时间意义。
- source_word: שְׁמַע נָא
  choice: 请听
  rationale: שְׁמַע是“听”的命令式，נָא使语气成为恳请；“请听”准确、自然，也保留了礼貌语气。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: מִלָּי
  choice: 我的话
  rationale: 直接表达带第一人称单数词尾的复数名词，并符合现代汉语习惯。
- source_word: וְכָל דְּבָרַי
  choice: 也要……我的一切言语
  rationale: 保留כָל的周全含义，也用“言语”与前句“话”构成近义平行。
- source_word: הַאֲזִינָה
  choice: 侧耳听
  rationale: 该动词表示专心倾听；“侧耳听”比单纯的“听”更能体现其加强语气，并保留两个不同听觉动词的修辞效果。
