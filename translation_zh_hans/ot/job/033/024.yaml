  text: then he is gracious to him and says[a], ‘Deliver him from going down to the pit[b]; I have found a ransom.’
translation:
  language: zh_hans
  text: 他就恩待那人，说：“救他，免得他下到坑中[b]；我已经找到了赎价[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎价”也可理解为“赎罪的代价”或“遮盖”。希伯来语“כֹּפֶר”可指使人获释的赎金或补偿，在某些语境中也含有赎罪的意味。
    reason: lexical_alternative
  - marker: b
    text: “坑”也可使人联想到坟墓、死亡或毁灭，并非仅指地上的坑洞。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: 他就恩待那人
  rationale: חנן表示施恩、恩待或怜悯。“恩待”保留恩惠与怜悯的意味；用“那人”避免现代汉语中连续两个“他”造成指代不清。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 承接前一动作并引出直接引语，现代汉语用“说”自然简洁。
- source_word: פְּדָעֵהוּ
  choice: 救他
  rationale: פדה可指救赎、赎回或搭救。此处用“救他”表达使其免于下坑，又不在动词本身过早加入支付赎价的技术含义，因为后面的כֹפֶר已明确提供赎价意象。
- source_word: מֵרֶדֶת
  choice: 免得他下入
  rationale: 这是ירד的不定词构造式，前有מִן，表示阻止其下降；“免得他下入”符合现代汉语，并清楚表达避免发生的结果。
- source_word: שָׁחַת
  choice: 深坑
  rationale: שׁחת在《约伯记》中常指坑，并可暗示坟墓、死亡或毁灭。“深坑”保留具体意象，同时不把隐含意义限定为“坟墓”。
- source_word: מָצָאתִי
  choice: 我已经找到了
  rationale: 第一人称单数完成式在这里带有当前结果：“已经找到”的事物现可作为救人的依据。
- source_word: כֹפֶר
  choice: 赎价
  rationale: כֹפֶר可指使人获释的赎金、补偿或代价。“赎价”在中文中简明地保留以代价换取释放的含义，同时脚注说明其可能具有赎罪方面的意味。
theological_decisions:
- issue: 以利户话语中כֹפֶר的含义
  choice: 赎价
  alternative: 赎罪的代价／遮盖
  rationale: 本节所述的是使人免于下入深坑的依据。“赎价”保留付出代价而使人获释的具体含义，却不把后来的系统神学范畴强加于经文。该词可能具有赎罪或遮盖的关联，故在脚注中保留。
- issue: 施恩并发言者的身份
  choice: 沿用希伯来文第三人称“他”，不在本节明说身份
  alternative: 明确译为“使者”或“神”
  rationale: 虽然上文语境可使读者将主语理解为中保性的使者，但本节希伯来文本只用第三人称形式。译文保留代词，避免替经文消除可能的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恩待”保留חנן的恩惠意味；“深坑”维持诗歌的具体图像；“赎价”为核心术语，同时借脚注保留赎罪相关的语义空间。脚注标记均紧随其所解释的词语。
