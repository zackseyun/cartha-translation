base_translation:
  language: en
  yaml_path: translation/ot/job/033/019.yaml
  text: He is also reproved with pain on his bed[a], and with continual strife in his bones,
translation:
  language: zh_hans
  text: 他也在床上因疼痛受管教；他的骨头中有不息的争战[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不息的争战”或译“猛烈的争战”。希伯来语形容词既可表示“持久、不断”，也可表示“强劲、有力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַח
  choice: 他也……受……管教
  rationale: יכח 的 Hophal 形表达被纠正、责备或管教；结合以利户所说上帝借苦难向人说话的语境，“受管教”既保留纠正意味，也不把苦难明确说成惩罚。וְ 译作“也”，承接上文。
- source_word: בְּמַכְאוֹב
  choice: 受疼痛管教
  rationale: מַכְאוֹב 指疼痛或苦楚；介词 בְּ 在这里可表手段，中文将“疼痛”嵌入“受……管教”之中，自然地表达借疼痛受到管教。
- source_word: עַל מִשְׁכָּבוֹ
  choice: 在床上
  rationale: 直接保留卧床受苦的场景，符合现代汉语表达。
- source_word: וְרִיב
  choice: 争战
  rationale: רִיב 通常指争执、争斗；与“骨头”搭配时是形象说法，描绘身体内部剧烈而持续的痛苦。“争战”保留原文隐喻，未将其平解为一般疼痛。
- source_word: עֲצָמָיו
  choice: 骨头里
  rationale: 保留“骨头”这一具体身体意象；增补方位助词“里”，使“骨头”与其中的争战关系在中文中清楚自然。
- source_word: אֵתָן
  choice: 不息
  rationale: אֵתָן 可指持久、恒常，也可指强劲有力；正文采用“不息”表达持续不止的可能含义，另一含义收入脚注。
theological_decisions:
- issue: 苦难是否被描述为上帝的行动
  choice: 将苦难表述为管教的手段，但不说明它必然是报应性的惩罚。
  alternative: 译成“惩罚”，强调纯粹的刑罚性审判；或只描述自然疾病，不体现纠正作用。
  rationale: 在以利户的论述中，苦难是上帝向人说话的一种方式；“管教”保留纠正意味，同时避免把本节扩展成严格的报应论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“受疼痛管教”紧贴希伯来语的被动纠正结构；“骨头里争战不息”保留原文鲜明的身体隐喻及 אֵתָן 的词义张力。
