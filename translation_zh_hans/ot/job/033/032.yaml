  yaml_path: translation/ot/job/033/032.yaml
  text: If you have words[a], answer me; speak, for I desire to justify you.
translation:
  language: zh_hans
  text: 你若有话，就回答我；请说吧，因为我愿意证明你有理[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣告你是对的”，或“为你申辩”。
    reason: צַדְּקֶךָ可表示表明或宣告某人有理；按语境也可理解为维护、申明其正当。
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: 你若有话
  rationale: 将存在句式按现代汉语习惯译为“有话”，同时保留条件语气和“言语”的基本含义。
- source_word: הֲשִׁיבֵנִי
  choice: 就回答我
  rationale: 该使役命令式在此表示回应、答复；“回答我”直接自然。
- source_word: דַּבֵּר
  choice: 请说吧
  rationale: 保留命令的邀请意味；加入“请”和语气词“吧”，符合以利户容许约伯发言的语境，并避免语气显得生硬。
- source_word: כִּי חָפַצְתִּי
  choice: 因为我愿意
  rationale: כִּי说明邀请发言的理由；חפץ表达意愿或乐意，“愿意”在现代汉语中自然且保留诚恳语气。
- source_word: צַדְּקֶךָ
  choice: 证明你有理
  rationale: 此处是צדק词根的动词形式，意为表明对方正确或有理；此译法避免让“称义”引发超出本段语境的专门神学联想。
theological_decisions:
- issue: צַדְּקֶךָ所表达的“使之为义／判为有理”
  choice: 证明你有理
  alternative: 宣告你是对的；为你申辩
  rationale: 以利户是在说，若约伯能够作答，他乐于承认或表明约伯有理；这里并非专门论述人在上帝面前被称义。正文采用自然而不带过强术语色彩的译法，脚注保留“宣告为对”和“申辩”的语义可能。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“你若有话”简洁保留原文条件句；“请说吧”传达邀请回应的语气。
