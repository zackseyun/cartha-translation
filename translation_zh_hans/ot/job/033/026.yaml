source:
  edition: WLC
  text: יֶעְתַּ֤ר אֶל אֱל֨וֹהַּ וַ/יִּרְצֵ֗/הוּ וַ/יַּ֣רְא פָּ֭נָי/ו בִּ/תְרוּעָ֑ה וַ/יָּ֥שֶׁב לֶ֝/אֱנ֗וֹשׁ צִדְקָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: zh_hans
  text: 他向上帝恳求[a]，上帝就悦纳他；他欢呼着得见上帝的面[b]，上帝又把他的义还给他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向上帝祈求”。原文动词可强调迫切恳求。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“他的面”，这里按上下文理解为上帝的面；从句法上也有人理解为上帝看见这人的面。
    reason: alternative_reading
  - marker: c
    text: “他的义”也可按语境理解为“他的正当地位”或“他所得的昭雪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: 恳求
  rationale: 该动词指向上帝祈求时，常含迫切求告之意。“恳求”既保留这种语气，也符合本节诗体语境。
- source_word: אֱלוֹהַּ
  choice: 上帝
  rationale: 这是《约伯记》中常见的单数诗体称谓；译作“上帝”准确自然，不增添原文没有的“全能者”等含义。
- source_word: וַיִּרְצֵהוּ
  choice: 上帝就悦纳他
  rationale: רצה在此表示上帝以恩惠接纳祈求者。补明主语“上帝”，避免现代汉语中代词连续出现造成误解。
- source_word: וַיַּרְא פָּנָיו
  choice: 他……得见上帝的面
  rationale: 原文直译为“他看见他的面”。结合上下文，最自然的理解是蒙恢复的人得见上帝的面；正文予以明示，脚注保留原文的代词形式及另一种句法可能。
- source_word: בִּתְרוּעָה
  choice: 欢呼着
  rationale: תְּרוּעָה可指喜庆或得胜时响亮的呼喊。“欢呼着”同时传达声音和喜乐，且在现代汉语中简洁自然。
- source_word: וַיָּשֶׁב
  choice: 又把……还给
  rationale: 使役式שוב在此有“使恢复、归还”之意。“还给”保留了恢复原有之物的表达。
- source_word: לֶאֱנוֹשׁ
  choice: 给他（即这人）
  rationale: אֱנוֹשׁ指必死的人、人类个体。汉语根据前文以“他”承接，比重复“人”更自然，同时不改变所指。
- source_word: צִדְקָתוֹ
  choice: 他的义
  rationale: צדקה的基本含义是“义、公义”。“他的义”保留原文所有格及神学宽度，不把它限定为称义、功德或社会层面的昭雪。
theological_decisions:
- issue: “悦纳他；他得见他的面”一连串代词的所指
  choice: 上帝悦纳祈求的人，随后这人得见上帝的面。
  alternative: 也可从纯句法上把后一分句理解为上帝看见这人的面，不过上下文和“见上帝的面”这一关系性表达更支持正文译法。
  rationale: 上下文描写人转向上帝、蒙上帝施恩并得到恢复。正文采用最自然的关系进程，同时在脚注中承认希伯来语代词本身的简约与潜在歧义。
- issue: “他的义”的含义
  choice: 保留为属于这人的“义”，由上帝恢复给他。
  alternative: 可按语境理解为这人恢复的正当地位或所得的昭雪；不应直接限定为后期体系中的归算之义。
  rationale: 阳性单数后缀最自然地回指这人。直译“他的义”既忠于词形，也避免把原文尚未限定的概念收窄为某一教义框架。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“恳求、悦纳、得见、义”等词保留诗体和神学分量，同时通过补明“上帝”的主语与所属关系，减少连续代词在汉语中的歧义；真正存在的原文歧义则收入脚注。
