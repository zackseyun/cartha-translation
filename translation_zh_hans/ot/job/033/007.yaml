  yaml_path: translation/ot/job/033/007.yaml
  text: Look[a], my terror will not frighten you, and my hand on you will not be heavy.
translation:
  language: zh_hans
  text: 看哪，我不会以威吓使你惊恐；我的手也不会沉重地压在你身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意并加强语气的指示词；“看哪”在现代中文圣经语体中庄重而清楚。
- source_word: אֵמָתִי
  choice: 我的威势
  rationale: 该词指与说话者相关、足以令人畏惧的恐怖或威慑力。直译“我的恐怖”在中文中易误解为说话者自己的恐惧；“我的威势”保留客观的震慑含义，也符合以利户安慰约伯的语境。
- source_word: תְבַעֲתֶךָ
  choice: 不会使你惊恐
  rationale: בעת 的 Piel 未完成式表示使人极度害怕或惊惶；“使你惊恐”自然且保留其较强语气。
- source_word: אַכְפִּי
  choice: 我的手
  rationale: 该词词义困难，传统上联系 כף 而译作“手”；与“重”和“在你身上”相连，形成施压的形象。正文保留这一具体而传统的意象，并以脚注说明也可按语境理解为压力。
- source_word: עָלֶיךָ
  choice: 你
  rationale: 介词 על 带第二人称阳性单数后缀；在“重压你”这一自然中文搭配中，其“在……之上”之义已由动词表达。
- source_word: יִכְבָּד
  choice: 不会重压
  rationale: כבד 的 Qal 未完成式本义为“沉重”；结合 על 与前面的困难名词，译作“重压”既保留重量意象，也清楚表达不会给约伯造成压迫。
