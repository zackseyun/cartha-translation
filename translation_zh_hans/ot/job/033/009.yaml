base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
translation:
  language: zh_hans
  text: “我是纯洁的，毫无过犯；我是清白的，我身上没有罪孽。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַךְ
  choice: 纯洁
  rationale: 该词在这里作表语，表示道德上的纯净。“纯洁”自然庄重，也与下文 חַף 的“清白”有所区分。
- source_word: בְּלִי פָשַׁע
  choice: 没有过犯
  rationale: בְּלִי 表示“没有、毫无”，פֶּשַׁע 可指过犯或悖逆；“没有过犯”保留其道德和法律意味，而不把它限定为某一种悖逆。
- source_word: חַף
  choice: 清白
  rationale: 该词可表示洁净或无罪责；“清白”在现代汉语中自然地传达免于罪责的含义，同时不把原文强化为抽象的绝对无罪论断。
- source_word: עָוֺן
  choice: 罪孽
  rationale: 该词可指罪孽、罪责或恶行。“罪孽”保留原文的道德分量，而脚注说明“罪责”这一可能含义。
- source_word: לִי
  choice: 我里面
  rationale: 字面为“归我、对我”；在此存在句中译作“我里面”符合汉语表达，表示这种罪孽不在说话者身上或里面。
theological_decisions:
- issue: 以利户引述中约伯自我申辩的程度
  choice: 直接译为“我是纯洁的……我是清白的”，保留其强烈的自我申辩。
  alternative: 弱化为“我自认为纯洁”，或强化为超出原文措辞的绝对无罪宣告。
  rationale: 希伯来文使用直接而强调的表语句。译文既不替约伯的说法辩护，也不预先判定其错误，从而保留叙事中的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“纯洁—清白”和“过犯—罪孽”保留原文近义词并列的修辞层次；标点体现两个平行分句。
