base_translation:
  language: en
  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: zh_hans
  text: 看哪，我在上帝面前作你的代言人[a]；我也同样是从泥土中捏成的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“我对上帝如同你的口”。这可能指“我在上帝面前作你的代言人”，也可能指“在上帝面前，我正合你的心愿”，或“在上帝面前，我和你一样”。
    reason: alternative_reading
  - marker: b
    text: 或译“造成的”。这里的希伯来动词带有从泥土中捏取、塑成的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是用来郑重引起注意的语气词；“看哪”简洁庄重，也保留了原文的强调作用。
- source_word: כְפִיךָ לָאֵל
  choice: 在上帝面前作你的代言人
  rationale: 原文高度凝练，直译近于“对上帝如同你的口”。结合上下文，理解为替约伯发言的“口”较为通顺；但原文也可能表示“照你所求的”或“与你一样”，因此在脚注保留歧义。
- source_word: מֵחֹמֶר
  choice: 从泥土中
  rationale: חֹמֶר可指黏土、泥或制陶材料；这里强调以利户与约伯同属受造的人，“泥土”自然地传达这种意象。
- source_word: קֹרַצְתִּי
  choice: 捏成的
  rationale: 该动词在这里带有从泥料中捏取、塑成的具体触觉意象；“捏成”比笼统的“造成”更贴近原文，同时符合现代汉语表达。
- source_word: גַם אֲנִי
  choice: 我也同样
  rationale: 保留原文附加与强调的语气，突出以利户和约伯共有的人性与受造身份。
theological_decisions:
- issue: 以利户所说自己与约伯及上帝的关系
  choice: 将以利户表述为在上帝面前替约伯发言的人，同时强调他与约伯一样由泥土而成
  alternative: “在上帝面前，我正合你的心愿”或“在上帝面前，我和你一样”
  rationale: “你的口”最自然地容许“代言人”这一理解，而下半句清楚强调双方同为受造之人。译文不把以利户提升为具有神性或独特救赎地位的中保，并用脚注保留原句真实存在的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“代言人”表达替人发言的功能，不引入制度化或宗派性的中保观念；“捏成”保留泥土塑形的具体意象。
