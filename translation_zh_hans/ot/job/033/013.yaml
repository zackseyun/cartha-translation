  yaml_path: translation/ot/job/033/013.yaml
  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: zh_hans
  text: 你为什么与他争辩，因为他不回应他所说的一切话呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本的读法有差异：经文旁注读作“他的一切话”；正文辅音可读作“我的一切话”。“他”所指也可按上下文理解为约伯，因此本句也可理解为：“因为他不回应约伯所说的一切话。”
    reason: 保留希伯来文本中实际存在的ketiv/qere差异及代词先行词的语境歧义，避免把“话”改写为“所做的一切”或将其无提示地泛化为“人的话”。
lexical_decisions:
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接表达疑问原因，符合现代汉语。
- source_word: אֵלָיו רִיבוֹתָ
  choice: 与他争辩
  rationale: ריב在此指与对方争论、争讼；保留对抗意味，但不把语境限定为正式诉讼。
- source_word: כִּי
  choice: 说
  rationale: 此处可引出争辩的内容或理由；译作“说”在中文中自然地承接约伯所持的申诉，同时不强行限定为单纯因果。
- source_word: כָל דְּבָרָיו
  choice: 人的一切话
  rationale: 辅音文本中的代词形式可理解为“他的话”，但上下文及古译本支持指人向上帝所说的话；正文作语境化表达，并以脚注保留歧义。
- source_word: לֹא יַעֲנֶה
  choice: 都不作回应
  rationale: ענה意为回答、回应；配合“人的一切话”表达上帝并不逐一作答。
theological_decisions:
- issue: “他的话”中代词所指
  choice: 理解为人向上帝所说的一切话
  alternative: 理解为上帝自己的一切话，即“他不为自己的一切话作解释”
  rationale: 希伯来语代词有指代张力。上下文是约伯抱怨上帝不回应，古代译本亦有支持“人的话”的证据；用脚注保留另一种读法，避免消除原文歧义。
- issue: כִּי的逻辑关系
  choice: 作为所争辩内容的引介，译作“说”
  alternative: 译作“因为”，表示争辩的原因
  rationale: 两者在语法和语境上均有可能；中文“说”更顺畅地呈现以利户对约伯申诉的概括，又不额外断定严格的因果关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“与他争辩”保留原文的对抗性；“作回应”比口语化的“搭理”更符合智慧文学语体。
