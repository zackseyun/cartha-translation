  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
translation:
  language: zh_hans
  text: 把他的性命[a]从深坑[b]中救回，使他蒙生命之光照耀。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或译“灵魂”或“他自己”；希伯来语נֶפֶשׁ可指性命、灵魂或人本身。
    reason: lexical_alternative
  - marker: b
    text: “深坑”或译“坟墓”或“毁灭”。
    reason: lexical_alternative
  - marker: c
    text: “蒙生命之光照耀”也可译作“得以见到光明”或“得以被带到光中”。希伯来原文凝练而富有诗意。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: 使……回转
  rationale: 这是动词 שוב 的使役式不定词，表示使之返回。译为“使……回转”保留其使役和具体的回返意象。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נפש 可指生命、性命、自己，也可译作灵魂。此处与从深坑中获救及“生命之光”相连，“性命”在现代汉语中自然，并贴合脱离死亡危险的语境。
- source_word: מִנִּי שָׁחַת
  choice: 从深坑中
  rationale: שחת 在诗歌中可指坑、坟墓或毁灭。“深坑”保留原文的空间意象，并与后面的光形成鲜明对照。
- source_word: לֵאוֹר
  choice: 得以被……照亮
  rationale: 原文结构紧凑而略有省略，לֵאוֹר 可理解为进入光明、见光或被照亮。这里采用结果或目的表达，同时保留 אור 词根的光照意象。
- source_word: בְּאוֹר הַחַיִּים
  choice: 被生命之光照亮
  rationale: 介词 ב 可表达在其中、借着或伴随。“被生命之光照亮”在汉语中自然，也保留“生命之光”这一凝练的诗意表达。
