  yaml_path: translation/ot/job/033/020.yaml
  text: so that his life loathes bread[b][a], and his soul desirable food.
translation:
  language: zh_hans
  text: 以致他的生命使他厌恶饼[a]，他的心灵也厌弃美食[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的生命使他厌恶”按原文句法直译；也可理解为“他的生命厌恶饼”。“生命”在此可指他的生命力或他本人。
    reason: 保留חַיָּתוֹ作主语及动词所带“他”宾语后缀所产生的句法歧义。
  - marker: b
    text: “心灵”原文为“他的魂／生命”（נַפְשׁוֹ）；也可按上下文理解为“他自己”或“他的食欲”。“美食”也可译作“可口的食物”或“令人喜爱的食物”。
    reason: 保留נַפְשׁוֹ的语义幅度，并说明מַאֲכַל תַּאֲוָה所指受喜爱的食物。
lexical_decisions:
- source_word: וְזִהֲמַתּוּ חַיָּתוֹ
  choice: 以致他厌恶
  rationale: 原文按形式可理解为“他的生命使他厌恶”，表达病痛使人对食物产生强烈反感。正文采用自然现代汉语，以“他厌恶”传达结果；原文特殊的拟人化句法在脚注中保留。
- source_word: לָחֶם
  choice: 饼食
  rationale: לֶחֶם基本义为“饼、面饼”，也可泛指食物。“饼食”既保留具体意象，又符合庄重的经文语体。
- source_word: וְנַפְשׁוֹ
  choice: 他的胃口
  rationale: נֶפֶשׁ可指生命、自我、欲望或食欲；在拒食的语境中，“胃口”最自然，并与下文食物紧密衔接。脚注保留“生命、自己”等可能含义。
- source_word: מַאֲכַל
  choice: 食物
  rationale: 该词泛指所吃之物，译作“食物”准确自然。
- source_word: תַּאֲוָה
  choice: 可口的
  rationale: 该名词表示欲望或所渴望之物；修饰食物时，指通常令人喜爱、想吃的食物。“可口的”在汉语中自然表达这种吸引力，同时脚注注明“珍馐美食”等可能译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“以致”承接上文所述病痛的结果；两个分句保留希伯来诗歌的平行结构，并用重复的“厌恶／厌弃”呈现逐层加强的拒食状态。
