  yaml_path: translation/ot/job/033/002.yaml
  text: Look now[a], I have opened my mouth; my tongue speaks in my palate.
translation:
  language: zh_hans
  text: 请看[a]，我已经开口；我的舌头在上膛发声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请看”也可译为“看哪”。这里的“请”体现希伯来文语气词的呼请或催促意味。末句也可译作“我的舌头在我口中说话”。希伯来文末句的意象十分鲜明，表达也较为特别。
    reason: 说明首句两个语气词合译为“请看”，并提供末句较顺畅但不够具体的可选译法。
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 看哪
  rationale: הִנֵּה用于唤起听者注意，נָא在此加强呼吁语气。“看哪”简洁庄重，也保留原文的指示与催促作用；脚注说明可译作“请看”。
- source_word: פָּתַחְתִּי פִי
  choice: 我已经开口
  rationale: 直译是“我已经张开我的口”，也是开始说话的惯用表达。“我已经开口”既保留口的意象和完成体意味，又符合现代汉语习惯。
- source_word: דִּבְּרָה
  choice: 发声
  rationale: 这个形式较不寻常，以“我的舌头”为主语，表达说话或发言。“发声”能与具体的发音器官相配，同时不把原文扩写成“开始说话”。
- source_word: לְשׁוֹנִי
  choice: 我的舌头
  rationale: 按字面保留身体器官借指言语的诗性表达，并与前半句的“口”形成对应。
- source_word: בְחִכִּי
  choice: 在上膛
  rationale: חֵךְ具体指口腔上部、上膛；בְּ在这里直译为“在”。这一表达在汉语中也略显奇特，但忠实保留了希伯来文鲜明而不寻常的身体意象。
