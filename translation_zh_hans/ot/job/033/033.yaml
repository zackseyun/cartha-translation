  yaml_path: translation/ot/job/033/033.yaml
  text: If not[a], then listen to me; be silent[b], and I will teach you wisdom.
translation:
  language: zh_hans
  text: 不然，你就听我说；安静下来，我要教你智慧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אַיִן
  choice: 不然
  rationale: 这一组合承接上一节的邀请，表示相反情形：如果约伯没有话要回答，就应当听以利户说。“不然”在现代汉语中简洁自然，也保留了条件和转折意味。
- source_word: שְׁמַע לִי
  choice: 听我说
  rationale: שׁמע 与介词 ל 连用，表示专心听某人讲话。“听我说”既自然，也保留了祈使语气。
- source_word: הַחֲרֵשׁ
  choice: 安静下来
  rationale: 该祈使式在此要求对方不再说话。“安静下来”符合现代汉语表达，同时保持直接而庄重的语气。
- source_word: וַאֲאַלֶּפְךָ
  choice: 我要教你
  rationale: אלף 的 Piel 词干表示教导；接在命令之后的未完成式适合译作随后的行动：“我要教你”。
- source_word: חָכְמָה
  choice: 智慧
  rationale: חָכְמָה 是智慧文学中的核心用语，直译为“智慧”可保留其主题词汇和开放内涵。
