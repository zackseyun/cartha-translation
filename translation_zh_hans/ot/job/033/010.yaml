  text: Look[a], he finds grounds for hostility against me; he counts me as his enemy.
translation:
  language: zh_hans
  text: 看哪，他找出反对我的理由[a]，把我看作他的仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他对我怀有敌意”“他找机会反对我”；也可能是“他找出控告我的理由”。这个希伯来语名词很少见，其含义取决于上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 用现代中文仍可理解的郑重提示语，保留原文引人注意并加强断言的作用。
- source_word: תְּנוּאוֹת
  choice: 敌对我的缘由
  rationale: 此罕见名词的具体含义依语境而定，可能指敌意、反对的由头或控诉的理由；正文兼顾“敌对”及“缘由”两层意思，并以脚注保留歧义。
- source_word: עָלַי
  choice: 敌对我
  rationale: 在此与带敌意的缘由相连，译为针对、敌对说话者，而非中性的“关于我”。
- source_word: יִמְצָא
  choice: 找出
  rationale: 保留מצא“找到、发现”的基本义；不译成“捏造”，以免将原文的指控无根据地强化。
- source_word: יַחְשְׁבֵנִי
  choice: 把我当作
  rationale: 自然表达חשב在这里“视为、算作”的评判含义。
- source_word: לְאוֹיֵב לוֹ
  choice: 他的仇敌
  rationale: 以自然中文表达原文所指的身份或地位，即“把我视为对他而言的仇敌”。
theological_decisions:
- issue: 以利户转述约伯对上帝待他的看法
  choice: 保留控诉的力度：“他找出敌对我的缘由……”，但不暗示上帝捏造罪名。
  alternative: “他捏造控告我的理由”或“他找机会攻击我”
  rationale: 本节是在转述约伯所感受到的待遇，并非译者认同这一判断。采用“找出”既忠于מצא的基本义，也保留叙述中的神学张力，避免将控诉强化成上帝蓄意捏造罪名的断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留诗歌式强调；“把我当作他的仇敌”自然清楚。脚注呈现罕见名词的真实词义范围，不在正文中强行消除歧义。
