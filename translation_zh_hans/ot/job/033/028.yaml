base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: zh_hans
  text: 他已经救赎[a]我的性命，使我不至进入坑中[b]；我的生命必看见光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救赎”也可译作“赎回”或“救出”；原文强调从危险中赎救，并未明说付了赎价。
    reason: lexical_alternative
  - marker: b
    text: “坑”是希伯来诗歌中常用来表示死亡、坟墓或毁灭的意象。
    reason: cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: 救赎
  rationale: 该动词表示从危险或奴役中赎出、救回。“救赎”兼顾赎回与解救的含义，又不擅自补出原文没有明说的赎价。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נֶפֶשׁ在这里可指人的性命、生命或自身。译作“我的性命”符合面临死亡的语境，也避免“灵魂”在现代汉语中可能带来的身心二分含义，并与下半句“我的生命”保持细微的诗体区别。
- source_word: מֵעֲבֹר
  choice: 使我不至进入
  rationale: 介词מִן与动词不定式连用，表示使其免于越过、进入某处。汉语用“使我不至进入”自然表达获救而没有进入深坑，同时保留趋向死亡之境的动态意象。
- source_word: בַּשַּׁחַת
  choice: 深坑
  rationale: שַׁחַת本义为坑，在诗歌中常象征死亡、坟墓或毁灭。“深坑”保留具体意象，让死亡含义由上下文和脚注说明。
- source_word: וְחַיָּתִי
  choice: 我的生命
  rationale: 该词指生命或活着的存在。“我的生命”保留与上半句“我的性命”的诗体平行，也与其后的阴性单数动词相合。
- source_word: בָּאוֹר
  choice: 光明
  rationale: 定冠词所指的“光”在这里与深坑相对，象征活着并重见生命之光。现代汉语以“光明”表达庄重自然。
- source_word: תִּרְאֶה
  choice: 必得见
  rationale: 未完成式在此可表示将来的结果。“必得见”既表达获救后将看见光明，也保留诗句的确信语气。
theological_decisions:
- issue: 句首完成式动词的主语
  choice: 他已经救赎
  alternative: 上帝已经救赎；他救赎了
  rationale: 原文动词为第三人称阳性单数，却未在本节明说主语；上下文指向上帝。正文只补出汉语语法所需的“他”，不直接加入“上帝”，以保留原文的含蓄。“已经”体现完成行动及其当前结果。
- issue: נֶפֶשׁ是否译为“灵魂”
  choice: 我的性命
  alternative: 我的灵魂；我
  rationale: 本节关注从死亡中获救，נֶפֶשׁ可自然指整个有生命的人或其性命。译作“性命”不把经文限定为仅有非物质灵魂获救，同时仍与下半句“生命”形成平行。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“性命／生命”和“深坑／光明”保留上下两行的诗体对应；避免用“灵魂”引入原文未必要求的特定人论。
