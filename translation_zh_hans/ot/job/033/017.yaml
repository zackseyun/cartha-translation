  source_fidelity: 上半句“为要使人离开自己的行为”准确传达 לְהָסִיר אָדָם מַעֲשֶׂה 的使役性及语境中的劝阻意义。下半句原译“把骄傲从壮士身上遮去”把 כָּסָה 的“遮盖／遮掩”与“除去”混合，中文语义不稳定；改为“使壮士不再骄傲”在此目的语境中清楚表达神抑制人的骄傲，且不把其限定为隐藏某一骄傲之事。
