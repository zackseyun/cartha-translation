  text: לְ֭/הָסִיר אָדָ֣ם מַעֲשֶׂ֑ה וְ/גֵוָ֖ה מִ/גֶּ֣בֶר יְכַסֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/017.yaml
  text: to turn a man from his deed[a], and to cover pride from a strong man,
translation:
  language: zh_hans
  text: 为要使人离开自己的作为[a]，又使壮士不再骄傲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“除去人的作为，又从壮士身上遮掩骄傲。”希伯来文十分简练：前半句也可理解为把人的作为从他身上除去；下半句的“遮掩”在语境中可指使人不再骄傲。
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  choice: 使……离开
  rationale: 这是סור的使役不定式；与“人”和“行为”连用时，译作“使人离开自己的行为”自然表达使人转离某种行动的意思，同时不完全排除“除去行为”的压缩句法。
- source_word: אָדָם
  choice: 人
  rationale: 此处是单数，现代汉语用“人”即可自然指个体，也与下半句的גֶּבֶר形成平行。
- source_word: מַעֲשֶׂה
  choice: 自己的行为
  rationale: 该词可指行为、作为或工作；上下文讲神借警告阻止人行恶，因此“行为”合适。原文未明说物主代词，但“自己的”清楚表达人与其行为之间隐含的关系。
- source_word: וְגֵוָה
  choice: 骄傲
  rationale: 该名词在此带负面意义，指自高或傲慢；“骄傲”简洁、自然，并保留其道德意味。
- source_word: מִגֶּבֶר
  choice: 从壮士身上
  rationale: גֶּבֶר可突出人的强健或力量；“壮士”保留它与前半句אָדָם在词汇上的区别，但不必限定为军人。
- source_word: יְכַסֶּה
  choice: 遮去
  rationale: 该未完成式在平行结构中承接目的意义。“遮去”保留כסה的具体意象，同时在汉语中可表达抑制或除去骄傲，避免直接把含义解释为单纯“隐藏”。
theological_decisions:
- issue: 以利户所述神说话之目的及本节压缩句法的解释
  choice: 神使人转离自己的行为，并抑制或除去他身上的骄傲。
  alternative: 神除去人的行为，并把骄傲向人隐藏起来。
  rationale: 希伯来文结构简练，可作较直译的理解；但约伯记33:14—18的语境说明神警告人，为要拦阻其行动并保全其性命。正文采用符合语境而不过度释义的表达，脚注保留较字面的可能读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“壮士”用于保留גֶּבֶר所含的强健意味及其与אָדָם的用词区别；整体维持希伯来诗歌的平行结构和原文的解释张力。
