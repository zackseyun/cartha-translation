  yaml_path: translation/ot/job/033/003.yaml
  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: zh_hans
  text: 我所说的话显明我心的正直；我的嘴唇清楚地说出知识。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的嘴唇说出纯正的知识”，或“我的嘴唇把所知道的明白说出”。译作“清楚地”的希伯来词也可含有“纯正”或“明白”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר לִבִּי
  choice: 我心正直
  rationale: יֹשֶׁר表示正直、正道；לִבִּי指人的内心，包括思想与意愿。译为“我心正直”保留道德含义，也符合现代汉语表达。
- source_word: אֲמָרָי
  choice: 所言
  rationale: 指说出的话语；“所言”简洁庄重，并与前半句形成自然的判断关系。
- source_word: וְדַעַת
  choice: 知识
  rationale: 直译该名词，保留它既可指所知内容、也可指有见识之言的空间。
- source_word: שְׂפָתַי
  choice: 我的嘴唇
  rationale: 保留希伯来诗歌以“嘴唇”代指言语的转喻，并与“心”构成内在与表达的对应。
- source_word: בָּרוּר
  choice: 清楚地
  rationale: 该词可表达清楚、纯净或明白；正文取符合现代汉语且适合修饰言说的“清楚地”，其他可能性列入脚注。
- source_word: מִלֵּלוּ
  choice: 说出
  rationale: 该动词意为说、发言；其主语是“我的嘴唇”，“说出”自然地表达所说内容。
theological_decisions:
- issue: בָּרוּר与דַעַת的句法和语义关系
  choice: 我的嘴唇清楚地说出知识
  alternative: 我的嘴唇说出纯正的知识；我的嘴唇把所知道的明白说出
  rationale: 希伯来语容许בָּרוּר表达言说方式的清楚，也可能描述知识的纯正，或强调坦率明白。正文采用最自然的方式副词理解，同时用脚注保留歧义，不把“纯正”进一步解释成特定教义上的无误或纯洁。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现两行诗意的平行关系；“所言亦然”避免生硬照搬希伯来语系词结构，同时不添加“发自”等原文未明说的因果关系。
