  yaml_path: translation/ot/job/033/031.yaml
  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: zh_hans
  text: 约伯，你要留心[a]，听我说；安静[b]，我就要说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“侧耳听”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不要作声”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: 你要留心
  rationale: 该词是קשׁב的使役词干命令式，要求专心聆听；“你要留心”既保留命令语气，也符合现代汉语表达。
- source_word: אִיּוֹב
  choice: 约伯
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שְׁמַע לִי
  choice: 听我说
  rationale: שׁמע与介词ל连用，表示把聆听指向某人；“听我说”在现代汉语中自然地传达这一含义。
- source_word: הַחֲרֵשׁ
  choice: 安静
  rationale: 此处是חרשׁ的命令式，意为不要出声；“安静”简洁、直接，并适合以利户要求约伯暂不插话的语境。
- source_word: וְאָנֹכִי
  choice: 让我
  rationale: 原文由连接词和带强调意味的第一人称代词组成；结合前面的沉默命令，汉语用“让我”自然呈现发言权转到说话者身上的语用关系，同时不把连接关系限定为严格的时间先后。
- source_word: אֲדַבֵּר
  choice: 来说
  rationale: דבר的加强词干未完成式在此表达说话者接下来要进行的动作；与“让我”搭配为“让我来说”，符合自然现代汉语。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。两个短促命令保留原文直接的劝告语气；分号呈现从要求约伯聆听、安静到说话者继续发言的结构。
