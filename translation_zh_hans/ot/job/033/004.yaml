  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: zh_hans
  text: 上帝的灵造了我[a]；全能者的气息使我有生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的气息造了我。”希伯来语“灵”也可指“气息”或“风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: 灵
  rationale: רוּחַ 可指“灵、气息、风”。此处与“全能者的气息”平行，并表达上帝赐生命的作为；正文译作“灵”，同时以脚注保留“气息”的可能。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל 在这里是对以色列上帝的称谓，与 שַׁדַּי 平行；“上帝”自然、清楚，也符合现代普通话圣经语体。
- source_word: עָשָׂתְנִי
  choice: 造了我
  rationale: עָשָׂה 的基本义是“做、造”；在生命起源的语境中，“造了我”简洁自然，又不增加“塑造”等原文未明说的细节。
- source_word: נִשְׁמַת
  choice: 气息
  rationale: נְשָׁמָה 指使人有生命的气息；“气息”既保留诗歌意象，也与下一动词所表达的赐生命作用相称。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 将神圣称号 שַׁדַּי 译为传统而易懂的“全能者”，避免不必要的音译。
- source_word: תְּחַיֵּנִי
  choice: 使我有生命
  rationale: חיה 的强化词干在此表达使役意义，即“使……活着／赋予生命”；“使我有生命”准确而自然，并与上句的创造行动平行。
theological_decisions:
- issue: רוּחַ אֵל 应译作有位格意味的“上帝的灵”，还是较非位格化的“上帝的气息”
  choice: 上帝的灵
  alternative: 上帝的气息
  rationale: 正文用“上帝的灵”可区分 רוּחַ 与下句明确的 נְשָׁמָה（“气息”），也体现上帝赐生命的施动性；但 רוּחַ 本身确有“气息”之义，因此用脚注保留另一种读法，不把此处的神学含义限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两分句保持希伯来诗歌的平行结构；“灵／气息”和“造了我／使我有生命”分别形成对应。
