base_translation:
  language: en
  yaml_path: translation/ot/job/033/014.yaml
  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: zh_hans
  text: 因为神以一种方式说话[a]，又以两种方式说话，人却没有察觉到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为神说一次，又说两次，人却没有留意。”希伯来文的数字既可表示次数，也可按习语理解为不同的方式。
    reason: 保留 בְאַחַת 与 וּבִשְׁתַּיִם 在次数义和方式义之间的真实词义歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，以解释性的因果关系引出以利户关于神如何说话的说明。
- source_word: בְאַחַת
  choice: 用一种方式
  rationale: 介词与阴性数词构成的表达可指“一次”，也可按习语理解为“一种方式”；正文采用后者，同时以脚注保留另一可能。
- source_word: יְדַבֶּר
  choice: 说话
  rationale: 未完成式在这里表达一般性、惯常性的行动，现代汉语用“说话”自然传达这一含义。
- source_word: אֵל
  choice: 神
  rationale: 准确对应常见的神称号 אֵל，不额外加入“大能”等本节未明说的含义。
- source_word: וּבִשְׁתַּיִם
  choice: 又用两种方式说话
  rationale: 保留与“一种方式”的数字平行；为使汉语句法完整而补出“方式说话”。
- source_word: לֹא יְשׁוּרֶנָּה
  choice: 人却没有察觉
  rationale: שׁור 在此表示看见、留意或觉察；“察觉”符合下文人未认出神借梦境和苦难说话的语境。阴性宾语后缀所指在汉语中可自然省略。
theological_decisions:
- issue: 末句未明说的第三人称阳性单数主语
  choice: 以泛指的“人”表达
  alternative: 译作“他”，或不明说主语
  rationale: 希伯来文主语未显明，所指是一般的人；“人”既保留泛指意义，也避免把它限定为某一个特定男性。
- issue: 数字结构表示次数还是方式
  choice: 正文译为“一种方式……两种方式”
  alternative: 译为“一次……两次”
  rationale: 两种理解在希伯来文中都成立。正文按下文神借不同途径沟通的语境采用“方式”，脚注保留次数义，不消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一种方式……两种方式”保留诗句的数字平行；末句用“人却没有察觉”简洁表达泛指的人未能认出神的沟通。
