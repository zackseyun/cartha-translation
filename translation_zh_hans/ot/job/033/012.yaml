  text: הֶן זֹ֣את לֹא צָדַ֣קְתָּ אֶעֱנֶ֑/ךָּ כִּֽי יִרְבֶּ֥ה אֱ֝ל֗וֹהַ מֵ/אֱנֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: zh_hans
  text: 看哪，在这件事上你并不对。我要回答你，因为上帝比人[a]更伟大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凡人”或“必死的人”。希伯来语“אֱנוֹשׁ”常突出人的软弱和必死性。
    reason: 词义备选及语义色彩
lexical_decisions:
- source_word: הֶן
  choice: 看哪
  rationale: 这是引起注意并加强语气的话语标记；“看哪”在现代中文中庄重而简明，保留原文的强调作用。
- source_word: זֹאת
  choice: 在这件事上
  rationale: 此处指约伯刚才所说的事，而非孤立的“这”；这样译能自然表达论辩语境。
- source_word: לֹא צָדַקְתָּ
  choice: 你并不对
  rationale: צדק在这里表示在争论中站不住脚或不占理，并非泛指道德上不义；“并不对”准确且自然。
- source_word: אֶעֱנֶךָּ
  choice: 我要回答你
  rationale: 第一人称单数未完成式带第二人称单数后缀，表示以利户接下来要作出的回答。
- source_word: כִּי
  choice: 因为
  rationale: 该连词引出以利户回答约伯的理由；“因为”明确保留原文的因果关系。
- source_word: יִרְבֶּה
  choice: 更伟大
  rationale: רבה与比较介词מן连用，表达相对于人的超越和伟大，而非数量上的增多。
- source_word: אֱלוֹהַ
  choice: 上帝
  rationale: 单数神称在此指上帝；采用现代标准普通话中庄重、通行的称呼。
- source_word: מֵאֱנוֹשׁ
  choice: 比世人
  rationale: אֱנוֹשׁ为集合性或泛指性的人类称谓，并常带有软弱、必死之人的意味；“世人”自然保留上帝与人类的对比，脚注补明其语义色彩。
theological_decisions:
- issue: אֱנוֹשׁ所指的人及其脆弱性
  choice: 世人
  alternative: 必死的人；凡人；人
  rationale: 原文以单数泛指人类，并可能突出人的软弱和必死性。“世人”避免误解为某一个男性，又保留上帝与人类整体的对照；其脆弱性在脚注中说明，不在正文中将隐含意义绝对化。
- issue: 上帝“更大”的含义
  choice: 更伟大
  alternative: 更强大；远超过
  rationale: 原文表达上帝相对于人的超越，但未具体限定为能力、地位或数量；“更伟大”保留这一宽广而未完全界定的含义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留原文呼唤注意的力度；以两个短句呈现论辩语气。“世人”比“人”更清楚地表达泛指人类，同时不把原文隐含的脆弱性过度写入正文。
