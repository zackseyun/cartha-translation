  text: וַ/תִּקְרַ֣ב לַ/שַּׁ֣חַת נַפְשׁ֑/וֹ וְ֝/חַיָּת֗/וֹ לַֽ/מְמִתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: zh_hans
  text: 他的性命临近深坑[a]，他的生命也临近使人死亡者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深坑”或译“坟墓”或“毁灭”。
    reason: lexical_alternative
  - marker: b
    text: “使人死亡者”或译“死人”或“致死者”；原文表达较难确定，可能指带来死亡的主体，也可能指死人，或死亡的领域、权势。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: 临近
  rationale: קרב表示靠近、临到。这里是诗歌中对受苦之人境况的一般描述，用现在时态的“临近”自然承接上下文。
- source_word: לַשַּׁחַת
  choice: 深坑
  rationale: שַׁחַת可指坑、坟墓或毁灭。“深坑”保留具体的诗歌意象，同时让死亡的含义由语境显明。
- source_word: נַפְשׁוֹ
  choice: 他的性命
  rationale: נֶפֶשׁ在此指人的生命、性命或自身。译作“性命”切合濒死语境，也避免把它限定为技术意义上的非物质“灵魂”。
- source_word: וְחַיָּתוֹ
  choice: 他的生命
  rationale: 这里指活着的生命或生存状态。“生命”与上一分句的“性命”形成近义平行，同时保留原文用词的区别。
- source_word: לַמְמִתִים
  choice: 使人死亡者
  rationale: 该词形较可能表示“使之死亡的（众）者”。此译保留主动、致死的含义，却不武断限定为人间的刽子手；其他可能解释收入脚注。
theological_decisions:
- issue: נַפְשׁוֹ与וְחַיָּתוֹ平行使用所涉及的人论含义
  choice: 译为“性命”和“生命”，视为诗歌中的近义平行，不据此主张严格的灵魂—身体二分。
  alternative: 把נַפְשׁוֹ译为技术意义上的“灵魂”，或将两词都笼统译为“生命”。
  rationale: 原文保留了两个相关却不完全相同的词；译文既呈现这种区别，也不将诗歌措辞发展成超出本节的教义定义。
- issue: לַמְמִתִים所指的死亡主体或领域
  choice: 正文采用较直接的主动含义“使人死亡者”，并以脚注保留“死人”以及死亡领域或权势等理解。
  alternative: 直接译作“死人”，或解释为死亡的领域、势力。
  rationale: 希伯来表达疑难，可能指致死的主体，也可能与死人或死亡权势有关；不应在正文中悄然消除这种歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“性命／生命”保持诗句的平行与词汇差异；句式简洁，保留原文第二分句省略谓语的诗歌结构。
