  yaml_path: translation/ot/job/033/008.yaml
  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: zh_hans
  text: '你确实是我亲耳听见说过的，

    我也听见了你话语的声音：'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: 确实
  rationale: 此处作强调、确认语气，而非限制性的“只”；“确实”自然引出以利户对约伯言论的复述。
- source_word: אָמַרְתָּ
  choice: 你……说过
  rationale: 完成式第二人称阳性单数回指先前已经说出的话；“说过”符合现代汉语的追述语境。
- source_word: בְאָזְנָי
  choice: 当着我的面
  rationale: 原文直译为“在我耳中”；现代汉语用“当着我的面说”自然表达说话发生在本人可亲耳听见之处，同时由脚注保留耳朵意象。
- source_word: וְקוֹל
  choice: ……的声音……也
  rationale: קוֹל 可指“声音”或“嗓音”；与“话语”连用时译作“话语的声音”，保留原文对听觉感受的强调。连接词 וְ 按汉语语序以“也”表达承接。
- source_word: מִלִּין
  choice: 你话语
  rationale: 该亚兰语色彩的复数形式意为“话语、言辞”；所属关系由上下文明确，因此补出“你”。
- source_word: אֶשְׁמָע
  choice: 我……听见了
  rationale: 形式上是未完成式，但在此与前句对先前言语的追述相连；译为“听见了”符合汉语语境，又不额外解释其时体。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。分为两个诗行，并保留末尾冒号，以承接下一节所复述的话。正文中的“当着我的面”传达希伯来语听觉习语的交际意义，脚注则保留其直译形式。
