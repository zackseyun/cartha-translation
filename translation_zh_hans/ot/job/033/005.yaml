  text: If you are able[a], answer me; set your case in order before me; take your stand.
translation:
  language: zh_hans
  text: 你若能，就回答我；在我面前把你的陈词整理好[a]，站定吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在我面前排列好”，没有说明所排列的是什么；可指约伯的话、论点或准备作出的答复。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תּוּכַל
  choice: 你若能
  rationale: אִם引出条件，תּוּכַל表达能力；“你若能”简洁自然，也保留以利户直接挑战约伯的语气。
- source_word: הֲשִׁיבֵנִי
  choice: 就回答我
  rationale: 此处使役形态按争辩语境作“回答、回应”解；“回答我”最符合现代汉语习惯。
- source_word: עֶרְכָה
  choice: 把你的陈词整理好
  rationale: ערך的核心意思是“排列、整理、摆列”。希伯来文没有明说宾语；结合辩论语境，“陈词”可自然涵盖约伯准备提出的话或论辩，同时以脚注说明原文的省略与语义范围。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 保留原文表示当面对陈、在场交锋的常用介词短语。
- source_word: הִתְיַצָּבָה
  choice: 站稳吧
  rationale: יצב的反身形在此表示使自己站定、准备应对；“站稳吧”兼顾实际站立和迎接论辩挑战的意味。
