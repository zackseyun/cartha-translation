lexical_decisions:
- source_word: יִכֶל
  choice: 消瘦
  rationale: 该词源自 כלה，在此描写病患的肉体逐渐耗损；“消瘦”自然传达身体衰败的情景，同时避免把未完成式过度限定为已经完成。
- source_word: בְּשָׂרוֹ
  choice: 他的肉体
  rationale: 保留“肉”的具体身体意象；“肉体”在现代汉语中比单说“肉”更庄重自然。
- source_word: מֵרֹאִי
  choice: 得看不见了
  rationale: מן 与 רֹאִי 的紧凑组合表达从视野中消失或不再可见；此译法与“消瘦”连用，呈现肉体耗损至几乎不见的程度。
- source_word: וְשֻׁפִי
  choice: 也凸显出来
  rationale: 此形态和词义较难确定；按上下文理解为肉消瘦后骨头变得显露、突出。“凸显出来”保留这一身体图景而不把词义说得过死。
- source_word: עַצְמוֹתָיו
  choice: 骨头
  rationale: 直接对应复数名词及第三人称阳性单数后缀；汉语以集合意义的“骨头”表达自然。
- source_word: לֹא רֻאּוּ
  choice: 从前看不见的
  rationale: 保留否定被动“未被看见”；“从前”自然表达与如今骨头显露之间的时间反差。
