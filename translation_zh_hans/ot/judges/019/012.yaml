base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: zh_hans
  text: 他的主人对他说：“我们不转进外族人的城；那里的人不属以色列人[a]。我们要继续前行，直到基比亚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“以色列人”字面为“以色列的子孙”。
    reason: 说明该民族称谓的字面形式；正文采用自然的现代汉语表达。
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: 他的主人
  rationale: 此处指仆人的人间主人和社会上位者，不是对上帝的称呼；“主人”在叙事语境中准确自然。
- source_word: נָסוּר
  choice: 转进
  rationale: סור在这里指离开行程路线，转入城中停留；“转进”既保留方向变化，也符合旅行语境。
- source_word: עִיר נָכְרִי
  choice: 外族人的城
  rationale: נָכְרִי表示外来的、非本族的；原文形式也可理解为“外族人的城”。此译比“外国城市”更适合士师时代的族群语境。
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: 就是不属于以色列人的城
  rationale: 原句以复数阴性代词作判断，语法略显特殊，所表达的是这座城及其居民不属以色列群体；中文以“城”作整体表述，清楚而不过度补出原文未明说的“居民”。
- source_word: וְעָבַרְנוּ
  choice: 我们要继续前行
  rationale: עבר在此表示越过当前可停留之处、继续赶路；“继续前行”符合上下文。
- source_word: עַד גִּבְעָה
  choice: 直到基比亚
  rationale: עַד表示行程所达到的界限；“直到基比亚”自然保留这一范围意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“外族人”避免现代民族国家色彩；“转进”和“继续前行”清楚呈现旅途中拒绝进城、选择赶路的动作对比。
