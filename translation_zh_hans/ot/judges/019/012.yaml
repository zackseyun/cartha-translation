- from: 他的主人对他说：“我们不可转进外族人的城，就是不属于以色列人[a]的城；我们要继续前行，直到基比亚。”
  to: 他的主人对他说：“我们不转进外族人的城；那里的人不属以色列人[a]。我们要继续前行，直到基比亚。”
  rationale: 修订否定语气以反映人物的决定而非禁令，并将原文中语法较特殊、指向该城居民的限定语以自然中文明确表达。其余旅行用语、地名和社会称谓均予保留。
