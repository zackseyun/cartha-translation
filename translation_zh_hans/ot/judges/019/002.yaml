  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: zh_hans
  text: 可是，他的妾对他不忠[a]，离开他，到她父亲家——在犹大的伯利恒——在那里住了四个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“向他行淫”或“对他不贞”。有些古代译释传统将这句话理解为“她向他发怒”或“她与他争吵”。
    reason: 保留זנה较直接的性不忠含义，并说明古代传统中的另一种理解。
lexical_decisions:
- source_word: וַתִּזְנֶה עָלָיו
  choice: 对他不忠
  rationale: זנה的通常含义涉及淫乱或性方面的不忠；与עָלָיו连用时，表达对伴侣的不忠。“对他不忠”在现代汉语中自然，也不把含义过度限定为商业卖淫。
- source_word: פִּילַגְשׁוֹ
  choice: 他的妾
  rationale: פילגש指具有公认伴侣身份、但地位低于正妻的女性。“妾”是简洁且惯常的中文对应。
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: 离开他
  rationale: 兼顾הלך所表达的行动和מן所表达的分离；中文叙事中“离开他”自然清楚。
- source_word: אֶל־בֵּית אָבִיהָ
  choice: 回到她父亲家
  rationale: 原文直译为“到她父亲家”；依上下文，中文用“回到”自然地表达返回父家，并未改变目的地。
- source_word: אֶל־בֵּית לֶחֶם יְהוּדָה
  choice: 就是犹大的伯利恒
  rationale: 说明该父家所在地点，并将此城与其他同名地点区分；“犹大的伯利恒”贴近原文地名结构。
- source_word: וַתְּהִי שָׁם
  choice: 在那里住了
  rationale: היה与“在那里”连用表示身处并停留；结合后面的时长，“住了”比字面的“在那里”更符合现代汉语。
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: 四个月
  rationale: 这是表示一段时间的希伯来语表达，核心时长为四个月；无需在中文中机械保留“日子”。
theological_decisions:
- issue: 对וַתִּזְנֶה这一带有道德指控色彩的动词的理解
  choice: 性方面的不忠（“对他不忠”）
  alternative: “行淫背叛他”；或按某些古代译释传统理解为“向他发怒／与他争吵”
  rationale: 马所拉文本的元音标注和זנה的通常词义支持性不忠的理解。不过，古代译释传统中存在“发怒／争吵”的不同理解，因此在脚注中保留这一张力，不在正文中将争议彻底消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“可是”承接上文的转折；“妾”保留古代社会身份用语。脚注标记[a]已在正文相应位置出现。
