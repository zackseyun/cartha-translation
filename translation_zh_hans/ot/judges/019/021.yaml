  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: zh_hans
  text: 于是老人领他进了自己的家，给驴拌了饲料[a]。他们洗了脚[b]，吃喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给驴预备了饲料。”原文动词的基本意思是“混合、搀拌”。
    reason: lexical_alternative
  - marker: b
    text: 在古代近东，为旅客洗脚或提供洗脚条件，是常见的待客之道。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ לְבֵיתוֹ
  choice: 老人领他进了自己的家
  rationale: 使役形动词表达“使之进入、带入”；结合上文明确主语为老人，译作“领他进了自己的家”自然，并保留进入屋内的动作。
- source_word: וַיָּבָול לַחֲמוֹרִים
  choice: 给驴拌了饲料
  rationale: בלל的基本义是“混合、搀拌”，此处指为牲口调拌饲料；直译既符合语境，也保留原文比笼统的“喂驴”更具体的动作。
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: 他们洗了脚
  rationale: 复数动词和代词指在场的旅客一行；“洗了脚”简洁、自然地表达古代待客场景中的行动。
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: 吃喝起来
  rationale: 保留“吃、喝”两个并列动作，同时用现代汉语的趋向补语自然表达叙事推进。
