base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: zh_hans
  text: 那人，就是房主，出去到他们那里，对他们说：“不，我的弟兄们，请不要行恶。这个人既然进了我的家，你们就不要做这种可耻的事[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这种卑劣的事”或“这种令人发指的行为”。希伯来语所用的词指可耻、在道德上令人愤慨的恶行。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: 房主
  rationale: 指掌管这家的人；“房主”简洁自然，并保留其在家中的权责身份。
- source_word: אַחַי
  choice: 我的弟兄们
  rationale: 直译为“我的弟兄们”；在语境中是对同城男子的称呼，保留原文的男性复数形式。
- source_word: תָּרֵעוּ
  choice: 不要行恶
  rationale: 该动词在此表达明确的道德谴责；“行恶”准确、凝练，符合庄重叙事语体。
- source_word: נָא
  choice: 请
  rationale: 体现恳求和急切语气，以现代汉语自然表达。
- source_word: אַחֲרֵי אֲשֶׁר בָּא הָאִישׁ הַזֶּה אֶל־בֵּיתִי
  choice: 这个人既然进了我的家
  rationale: 此处结构说明使恶行更不可接受的既成情形，并带有因由意味；“既然”自然保留“如今已进入我家”的语境关系。
- source_word: הַנְּבָלָה הַזֹּאת
  choice: 这种丑事
  rationale: נְבָלָה指可耻且在道德上令人愤慨的行为；“丑事”通俗而庄重，并保留强烈的羞耻和谴责意味。
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: 出去见他们
  rationale: 直接表达房主从屋内出去面对众人的动作；“见”在此表示走到他们那里与其交涉。
