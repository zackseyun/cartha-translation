base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: zh_hans
  text: 第四天，他们清早起来，他就起身要走。那年轻女子的父亲对女婿说：“吃一点饼，补充体力[a]，然后你们再走[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“用一点饼扶持你的心”，意思是吃些东西恢复或维持体力。
    reason: lexical_alternative
  - marker: b
    text: 这里的“走”在希伯来文中是复数，指女婿及与他同行的人；父亲当面说话的对象则是女婿。
    reason: grammatical_clarification
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: 第四天
  rationale: 这是直接的时间表达，不补入原文未明说的“住下来的”。
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: 他们清早起来
  rationale: 保留复数主语及早起之意；现代汉语自然简洁。
- source_word: וַיָּקָם לָלֶכֶת
  choice: 他就起身要走
  rationale: 单数动词把叙事焦点转回利未人；“要走”自然表达目的不定式。
- source_word: אֲבִי הַנַּעֲרָה
  choice: 那年轻女子的父亲
  rationale: נַעֲרָה在此指年轻女子；此译法既不显得年幼，也避免古雅的称谓。
- source_word: חֲתָנוֹ
  choice: 女婿
  rationale: 按上下文，此亲属称谓指这位父亲的女婿。
- source_word: סְעָד לִבְּךָ
  choice: 补充一下体力
  rationale: 该习语字面为“扶持/加强你的心”，在这里指通过进食恢复、维持体力；意译更符合现代汉语。
- source_word: פַּת לֶחֶם
  choice: 吃点饼
  rationale: 保留具体食物意象，同时以自然汉语表达“少量饼/食物”。
- source_word: וְאַחַר תֵּלֵכוּ
  choice: 然后你们再走
  rationale: 保留希伯来文复数动词，表明最终所指是整个同行队伍，而非仅女婿一人。
theological_decisions: []
