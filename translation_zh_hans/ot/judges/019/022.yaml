source:
  edition: WLC
  text: הֵמָּה֮ מֵיטִיבִ֣ים אֶת לִבָּ/ם֒ וְ/הִנֵּה֩ אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֣י בְנֵֽי בְלִיַּ֗עַל נָסַ֨בּוּ֙ אֶת הַ/בַּ֔יִת מִֽתְדַּפְּקִ֖ים עַל הַ/דָּ֑לֶת וַ/יֹּאמְר֗וּ אֶל הָ֠/אִישׁ בַּ֣עַל הַ/בַּ֤יִת הַ/זָּקֵן֙ לֵ/אמֹ֔ר הוֹצֵ֗א אֶת הָ/אִ֛ישׁ אֲשֶׁר בָּ֥א אֶל בֵּיתְ/ךָ֖ וְ/נֵדָעֶֽ/נּוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: zh_hans
  text: 他们正心里欢畅的时候，忽然，城里的人，就是一群无赖之徒[a]，围住那房子，不住地猛敲房门。他们对户主，就是那位老人，说：“把进你家来的那个人带出来，好让我们认识他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“无用之子”，是指无法无天、邪恶卑劣的人。
    reason: lexical_alternative
  - marker: b
    text: “认识他”在这里是有关性行为的委婉说法；这些人意图性侵他。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: 心里欢畅
  rationale: 这一希伯来语习语直译近于“使他们的心美好”，在此表示宴饮中的愉快畅然。“心里欢畅”保留了“心”的意象，也符合现代汉语表达。
- source_word: וְהִנֵּה
  choice: 忽然
  rationale: 此处是叙事转折标记，引出突如其来的威胁。“忽然”自然地传达场景骤变及其紧张感。
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: 城里的人，就是一群无赖之徒
  rationale: 既保留“城里的人”的所指，也将“彼列之子”这一表示卑劣、无法无天之人的习语译成自然的“无赖之徒”；较直译形式收入脚注。
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: 围住那房子
  rationale: 准确表达动词所指的环绕、包围动作，简洁自然。
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: 不住地猛敲房门
  rationale: 分词形式表现持续、反复的动作，而“猛敲”传达其强横和威吓意味。
- source_word: בַּעַל הַבַּיִת הַזָּקֵן
  choice: 户主，就是那位老人
  rationale: בַּעַל הַבַּיִת 指掌管该家的人；“户主”简明自然。הַזָּקֵן 在此描述年龄，并非正式职衔，因此译作“那位老人”。
- source_word: הוֹצֵא
  choice: 带出来
  rationale: 该命令要求主人将客人从屋内带到外面；“带出来”符合现代汉语语境。
- source_word: וְנֵדָעֶנּוּ
  choice: 好让我们认识他
  rationale: 保留 ידע“认识”的委婉说法及其与《创世记》19章的文学呼应，同时以脚注明确这里的性暴力意图。
theological_decisions:
- issue: 如何翻译 וְנֵדָעֶנּוּ 的性委婉语
  choice: 正文保留“好让我们认识他”，脚注说明其性侵意图。
  alternative: 直译其语境含义为“好让我们性侵他”或“好让我们与他交合”。
  rationale: 原文有意使用“认识”作为性行为的委婉语。正文保留这一措辞，可维持原文的文学表达及其与《创世记》19章的联系；脚注则避免现代读者误解，并明确上下文所显示的强暴意图。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“心里欢畅”保留希伯来语意象；“忽然”自然呈现突发转折；“认识他”保留原文委婉语，并借脚注澄清其暴力含义。
