base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: zh_hans
  text: 她的主人清早起来，打开那房子的门，出去上路。看哪，那女人，就是他的妾，倒[a]在房门口，双手搭在门槛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“躺卧”。原文意为“倒下”或“倒卧”，描写她倒下后的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: 她的主人
  rationale: 直译为“她的主人”，保留原文所呈现的不对等社会关系；译作“丈夫”会弱化这一点。
- source_word: דַּלְתוֹת הַבַּיִת
  choice: 那房子的门
  rationale: 原文意为房子的门；现代汉语通常用集合性的“门”，无需生硬地标示希伯来语复数。
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: 出去上路
  rationale: 简洁自然地表达“出去走自己的路程”这一目的结构，不额外说明是启程还是继续行程。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文突然引人注意、突出眼前骇人景象的叙事标记。
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: 那女人，就是他的妾
  rationale: 保留“那女人”与“他的妾”的同位结构；“妾”准确而简洁地表达 פִילֶגֶשׁ。
- source_word: נֹפֶלֶת
  choice: 正躺
  rationale: 按上下文表达倒下后所处的姿势，同时以脚注保留“倒下/倒卧”的形式和动态色彩。
- source_word: פֶּתַח הַבַּיִת
  choice: 房门口
  rationale: 自然表达房屋入口的位置，符合现代汉语叙事习惯。
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: 双手搭在门槛上
  rationale: 自然再现无动词分句所描绘的画面；“门槛”准确对应 סַף。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留原文突显现场景象的叙事力度；没有补明女子此时是否已经死亡，以保留上下文的悬念。
