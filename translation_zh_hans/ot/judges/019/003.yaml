base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: zh_hans
  text: 她的丈夫起身去找她，要好言劝说她[a]，带她回来[b]。他的年轻仆人和一对驴与他同行。她领他进了她父亲的家；那年轻女子的父亲看见他，就高兴地出来迎接他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“对她的心说话”，是指温言相劝、安慰或说服。
    reason: lexical_alternative
  - marker: b
    text: 此处希伯来语辅音文本的宾语形式为“他”，文本较难理解；按上下文，丈夫的用意是把这女子带回来。
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: 她丈夫
  rationale: 字面为“她的男人”，在这里指与她有婚姻关系的男子；译作“她丈夫”符合现代汉语，也保留叙事中的关系称谓。
- source_word: אַחֲרֶיהָ
  choice: 去追她
  rationale: 这里表示跟随她而去；汉语“去追她”自然地表达丈夫动身前往她所在之处，并不必然含有追赶之意。
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: 要好言劝慰她
  rationale: 希伯来语字面为“对她的心说话”，是表示温言相劝、安慰或说服的习语。“好言劝慰”既自然，又保留温和劝说的语气；脚注说明其字面表达。
- source_word: ל/השיב/ו
  choice: 把她带回来
  rationale: 马所拉辅音文本的宾语后缀为阳性，形式存在文本困难；但上下文清楚表明此行目的是让女子回来，因此正文按语境译为“把她带回来”，并以脚注保留文本问题。
- source_word: נַעֲרוֹ
  choice: 自己的少年仆人
  rationale: נַעַר可指少年、年轻人或随从；此人在旅途中侍候并陪伴男子，因此“少年仆人”兼顾年龄与身份。
- source_word: צֶמֶד חֲמֹרִים
  choice: 两头驴
  rationale: צֶמֶד表示一对；现代汉语以“两头驴”最为自然，也不额外断定两头驴当时套在同一副轭上。
- source_word: וַתְּבִיאֵהוּ
  choice: 她把他领进
  rationale: 动词为阴性单数，主语是女子，阳性宾语指丈夫；“领进”准确表现她带他进入父亲家中的动作。
- source_word: הַנַּעֲרָה
  choice: 女子
  rationale: 原词指年轻女子；此处用“女子”自然庄重，并避免“女孩”可能造成的未成年含义。
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: 就欢欢喜喜地迎接他
  rationale: וַיִּשְׂמַח表达喜悦，לִקְרָאתוֹ表示迎向、迎接。“欢欢喜喜地迎接他”同时传达父亲的喜悦和迎接动作。
