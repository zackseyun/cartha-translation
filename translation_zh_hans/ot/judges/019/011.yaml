base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: zh_hans
  text: 他们靠近耶布斯[a]时，天色已经很晚了[b]。那年轻人[c]对主人说：“请吧，我们转到这座耶布斯人的城去，在那里过夜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶布斯”是耶路撒冷早期的名称。
    reason: cross_reference
  - marker: b
    text: 或译：“白日已经衰落许多”，即天色渐晚。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文也可指“仆人”或“随从”；在此语境中可能指随行服侍主人的年轻人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: 他们来到耶布斯附近时
  rationale: עִם本义为“与……一起”，但与地名连用并置于行旅语境中，表示接近该地；译为“来到……附近时”符合现代汉语叙事习惯。
- source_word: יְבוּס
  choice: 耶布斯
  rationale: 保留希伯来文所用的古地名，不直接以其后来的名称“耶路撒冷”取代。
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: 天色已经很晚了
  rationale: 该短语描写白日衰落、临近夜晚；现代汉语以“天色已经很晚了”自然表达其时间含义，并在脚注保留更贴近意象的译法。
- source_word: הַנַּעַר
  choice: 那年轻人
  rationale: נַעַר可指少年、年轻人，也可按身份指仆人或随从；正文采用较不限定角色的“年轻人”，由“主人”显出其从属关系。
- source_word: אֲדֹנָיו
  choice: 主人
  rationale: 这里表示社会关系中的上级或主人，并非神圣称号；“主人”简洁且符合语境。
- source_word: לְכָה נָּא
  choice: 请来吧
  rationale: לְכָה是移动动词的命令式，נָא表达请求或劝请；“请来吧”保留其邀请同行的语气。
- source_word: וְנָסוּרָה
  choice: 我们转进
  rationale: סוּר在此指偏离原来的路线、转入城中；“转进”既表现行程改变，也保持简洁。
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: 这座耶布斯人的城
  rationale: 族称הַיְבוּסִי在这里作集合用法，指耶布斯人；译文同时保留指示词“这座”。
- source_word: וְנָלִין בָּהּ
  choice: 在那里过夜
  rationale: לוּן指留宿一夜；“在那里过夜”是清楚自然的现代汉语表达。
theological_decisions: []
