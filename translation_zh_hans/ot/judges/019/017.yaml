  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֛רְא אֶת הָ/אִ֥ישׁ הָ/אֹרֵ֖חַ בִּ/רְחֹ֣ב הָ/עִ֑יר וַ/יֹּ֨אמֶר הָ/אִ֧ישׁ הַ/זָּקֵ֛ן אָ֥נָה תֵלֵ֖ךְ וּ/מֵ/אַ֥יִן תָּבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: zh_hans
  text: 他抬头一看，看见那旅人[a]在城里的广场上[b]，老人就问：“你要到哪里去？你从哪里来？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“过路的人”，也可按接待旅客的语境理解为“客旅”。希伯来语所指的是在旅途中的人，并可引申指客人。
    reason: lexical_alternative
  - marker: b
    text: 或译“城里的大街上”。这里的希伯来语更具体地指宽阔的公共场所或广场。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: 他抬头一看
  rationale: 希伯来语直译为“他举目”，是把视线抬起的惯用表达；“抬头一看”在现代汉语叙事中自然，并与下文“看见”顺畅衔接。
- source_word: וַיַּרְא
  choice: 看见
  rationale: 采用表示基本视觉感知的直接译法，不增加“留意到”等解释性含义。
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: 那旅人
  rationale: אֹרֵחַ在此指正在旅途中的人；“旅人”简洁、自然，也符合上下文。原文虽有“人”一词，但现代汉语无需重复译作“那人，那旅人”。
- source_word: בִּרְחֹב הָעִיר
  choice: 在城里的广场上
  rationale: רְחוֹב通常指城中宽阔的公共空间或广场，而不一定是狭长的街道；“城里的广场”准确且易懂。
- source_word: הָאִישׁ הַזָּקֵן
  choice: 老人
  rationale: 直接表达原文“年老的人”，符合现代汉语叙事习惯。
- source_word: אָנָה תֵלֵךְ
  choice: 你要到哪里去
  rationale: אָנָה询问目的地，תֵלֵךְ在当前对话中表示将要前往；这一译法保留方向含义，也自然口语化。
- source_word: וּמֵאַיִן תָּבוֹא
  choice: 你从哪里来
  rationale: מֵאַיִן明确询问来处，与前句所问目的地形成对应；“从哪里来”是现代汉语最自然的表达。
theological_decisions: []
