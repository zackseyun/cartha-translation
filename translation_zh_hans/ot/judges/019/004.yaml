base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: zh_hans
  text: 年轻女子的父亲，就是他的岳父，执意挽留他[a]；他便同岳父住了三天。他们在那里吃喝，也在那里住宿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“竭力劝留他”或“强留他”。希伯来语这个习语字面是岳父“对他强硬”，此处指坚持劝他留下。
    reason: 保留该习语从殷切劝留到强留的语义幅度，同时避免将字面表达误解为身体暴力。
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: 执意挽留他
  rationale: 该习语直译近于“对他用强/强留他”，在本段语境中表示岳父坚持挽留。译作“执意挽留”既体现强烈劝留之意，又不武断地说成强行拘禁。
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: 少女的父亲，就是他的岳父
  rationale: 保留原文同位语的双重身份说明。חֹתְנוֹ 在此指因婚姻而来的岳父；הַנַּעֲרָה 指已处于婚姻关系中的年轻女子，译作“少女”简洁自然。
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: 他便和岳父住了
  rationale: ישׁב 在这里表示留下居住；中文明确重复“岳父”，避免连续代词造成所指含混。“便”自然呈现挽留与留下之间的叙事联系。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三天
  rationale: 直接保留原文的时间表达。
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: 他们在那里吃喝
  rationale: 直接翻译两个并列动词，不将其解释性压缩为“宴饮”等词。
- source_word: וַיָּלִינוּ שָׁם
  choice: 也在那里过夜
  rationale: לון 专指住宿过夜；结合“三天”可自然理解为这段期间在当地住宿，无须在中文中另加原文未明说的夜数。
theological_decisions: []
