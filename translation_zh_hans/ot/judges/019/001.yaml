revisions:
- from: 那时候[a]，以色列中没有王。有一个利未人寄居在以法莲山区的偏远地带；他从犹大的伯利恒为自己娶了一个女子作妾[b]。
  to: 那时候[a]，以色列中没有王。有一个利未人寄居在以法莲山区的偏远地带；他娶了一名来自犹大伯利恒的女子为妾[b]。
  rationale: 仅作安全的语序和搭配调整：将地理来源明确修饰“女子”，并以“娶……为妾”表达原文“取一女子为妾”的关系；同时将脚注a改为完整、自然的替代译文。没有改变原文并列结构可作独立陈述或时间背景的歧义，也未对“以色列中没有王”作神学评价。
