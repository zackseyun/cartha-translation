  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: zh_hans
  text: 那时候[a]，以色列中没有王。有一个利未人寄居在以法莲山区的偏远地带；他娶了一名来自犹大伯利恒的女子为妾[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当时以色列中没有王”。希伯来文采用并列分句，既可译为独立陈述，也可理解为时间背景。
    reason: alternative_reading
  - marker: b
    text: “妾”指在受社会承认的结合中，地位低于正妻的女子，并非仅指随意的伴侣。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: 那时候
  rationale: 这是开启新叙事段落的希伯来语惯用表达；译为简洁自然的现代汉语，同时保留时代背景的引入作用。
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: 以色列中没有王
  rationale: 保留士师记反复出现的主题句，不额外说明这是对君主制的赞同或否定。希伯来文形式上与前句并列，正文按独立陈述处理，并以脚注保存时间背景式理解。
- source_word: אִישׁ לֵוִי
  choice: 一个利未人
  rationale: 现代汉语“利未人”已经明确指人，若译作“一个利未男子”较显生硬；这里以自然表达传达身份。
- source_word: גָּר
  choice: 寄居
  rationale: גור可指以外来者或非固定居民身份居住；“寄居”比单纯“住”更能保留这一社会和居住状态的含义。
- source_word: בְּיַרְכְּתֵי הַר אֶפְרַיִם
  choice: 在以法莲山区的偏远地带
  rationale: יַרְכְּתֵי表示边远、深处或尽头；“偏远地带”清楚传达地理边缘性。הַר אֶפְרַיִם在此指以法莲山地这一地区，译作“以法莲山区”。
- source_word: וַיִּקַּח לוֹ
  choice: 为自己娶了
  rationale: 在男子取女子进入婚姻或伴侣关系的语境中，לקח לוֹ自然译作“为自己娶了”，也保留לוֹ的反身意味。
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: 一个女子作妾
  rationale: 同时体现אִשָּׁה“女子”和פִילֶגֶשׁ“妾”的成分；“作妾”表明这是受承认但地位低于正妻的结合，而非随意的性伴侣关系。
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: 从犹大的伯利恒
  rationale: 这是用所属地区辨明伯利恒的地理称谓；“犹大的伯利恒”简明自然，并区别于其他同名地点。
theological_decisions:
- issue: 士师记关于以色列没有王的反复用语
  choice: 以色列中没有王
  alternative: 当时以色列中没有王
  rationale: 正文保留为独立并列陈述，更贴近希伯来文句法；不把这句话解释成对君主制的明确拥护或反对，从而保留叙事中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。叙事句式简洁；“寄居”“妾”等词保留古代社会背景所需的精确含义，并用脚注避免现代读者误解。
