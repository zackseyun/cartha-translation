base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: zh_hans
  text: 天将破晓时[a]，那女人来到她主人[b]所在的那个人家门口，倒在那里，直到天亮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“临近早晨时”或“黎明以前”。希伯来语原文直译涉及早晨的“转向”。
    reason: lexical_alternative
  - marker: b
    text: 或译“她的主”。希伯来语用的是表示权柄的称谓，并没有明确说“她的丈夫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: 天将破晓时
  rationale: 该短语字面涉及早晨的“转向、临近”，在这里表示晨光将现、黎明临近。“天将破晓时”既保留临近清晨的动态意味，也符合现代汉语表达。
- source_word: וַתָּבֹא
  choice: 来到
  rationale: בוא 的基本含义是“来、来到”。上下文虽可能暗示她回到这所房子，但原动词本身没有明确表达“回来”，因此不增译。
- source_word: וַתִּפֹּל
  choice: 倒下了
  rationale: נפל 的基本意思是“倒下、落下”。语境中很可能是瘫倒，但译作“倒下”避免对她当时的身体状态作超出原文的解释。
- source_word: פֶּתַח בֵּית הָאִישׁ
  choice: 那个人的家门口
  rationale: פֶּתַח 指入口或门口，בֵית הָאִישׁ 是“那个人的房屋/家”。“家门口”在现代汉语中自然，也准确指向房屋入口。
- source_word: אֲדוֹנֶיהָ
  choice: 她的主人
  rationale: אדון 加第三人称阴性单数后缀，意为“她的主人/她的主”，表达权柄关系，并不直接等同于“丈夫”。“主人”保留了原文令人不安的社会权力意味。
- source_word: אֲשֶׁר אֲדוֹנֶיהָ שָׁם
  choice: 她的主人就在那里
  rationale: אֲשֶׁר 与 שָׁם 合起来说明她的主人所在之处。汉语拆为独立分句，可避免多重“的”造成的生硬，同时不改变指涉。
- source_word: עַד הָאוֹר
  choice: 直到天亮
  rationale: 该短语表示持续到出现晨光之时。“直到天亮”简洁自然，并保留持续到日光来到的时间界限。
theological_decisions:
- issue: אֲדוֹנֶיהָ 是否应按关系译为“丈夫”
  choice: 她的主人
  alternative: 她的丈夫
  rationale: 上下文中的女子是利未人的妾，但本节所用的是表示主权或权柄的 אדון，并非明确表示丈夫的词。译作“主人”保留原文的社会关系和叙事张力，不以较温和的婚姻称谓替代。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。以短分句处理希伯来语关系结构，使地点关系清楚；保留“主人”一词所体现的权力关系，不弱化本段叙事的残酷张力。
