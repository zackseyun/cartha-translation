  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: zh_hans
  text: “看，这里有我那仍是处女的女儿和他的妾。请让我把她们带出来；你们尽管凌辱她们[a]，照你们看为好的方式对待她们[b]。只是对这个人，你们不可做这种可耻的恶行[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“强暴她们”。这里的希伯来语动词在此语境中可指性侵犯和羞辱。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“照你们眼中看为好的”，意思是照你们认为好或合意的去做。
    reason: cultural_note
  - marker: c
    text: 或译“这种无耻的事”或“这种丑事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看
  rationale: 这是引人立刻注意的指示性叹词；“看”简洁自然，并保留紧迫语气。
- source_word: בִתִּי הַבְּתוּלָה
  choice: 我有个还是处女的女儿
  rationale: 保留“我的女儿”和“处女”两项信息；“还是处女的女儿”符合现代汉语表达，也不把词义缩减为仅指未婚。
- source_word: וּפִילַגְשֵׁהוּ
  choice: 还有他的妾
  rationale: “妾”是现代中文圣经语境中对 פִּילֶגֶשׁ 简洁而可辨识的对应词，表达其不同于正妻的伴侣身份。
- source_word: אוֹצִיאָה נָּא אוֹתָם
  choice: 我求你们容我把她们带出来
  rationale: 以“我求你们容我”传达意愿式和 נָא 所带的恳求、催促语气；阴性复数“她们”依照实际所指作汉语性别区分。
- source_word: וְעַנּוּ אוֹתָם
  choice: 你们尽管凌辱她们
  rationale: Piel 形式的 ענה 在此语境中指带有性意味的侵犯和羞辱。“凌辱”保留暴力、羞辱及性侵含义，而脚注列出更明确的译法。
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: 照你们眼中看为好的待她们
  rationale: 保留希伯来文“在你们眼中为好”的意象和道德张力，同时使中文句法清楚。
- source_word: וְלָאִישׁ הַזֶּה
  choice: 只是对这个人
  rationale: 前置介词短语形成鲜明对比；“只是”在中文中自然标示这种转折。
- source_word: לֹא תַעֲשׂוּ
  choice: 你们不可做
  rationale: 直接表达第二人称复数禁令，不额外强化为解释性的法律措辞。
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: 这种无耻的事
  rationale: נְבָלָה 在此不是普通的愚蠢，而是严重违背道德与群体规范的可耻恶行；“无耻的事”清楚而有分量。
theological_decisions:
- issue: 如何清楚呈现性暴力而不超出希伯来词本身的明确程度
  choice: 正文译作“凌辱她们”，脚注注明“也可译作‘强暴她们’”
  alternative: 正文直接译作“强暴她们”
  rationale: 上下文明确涉及性侵犯，但 ענה 本身也含使人受辱、受虐待的语义。“凌辱”保留这一语义幅度，脚注则不掩盖这里可指强暴的严重含义。
- issue: 是否保留“在你们眼中为好”的道德反讽与叙事张力
  choice: 译作“照你们眼中看为好的待她们”
  alternative: 意译作“任凭你们处置她们”
  rationale: 较直译的表达保留原文刻意使用“好”字所形成的骇人张力，不替叙述者消解或解释人物的话。
- issue: נְבָלָה 的道德评价力度
  choice: 译作“无耻的事”
  alternative: “丑事”或“恶事”
  rationale: 该词指严重可耻、败坏规范的行为。“无耻的事”比泛称“恶事”更贴近羞耻和公愤色彩，也避免把它弱化为普通的“不妥”。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言，不淡化经文所呈现的骇人提议。保留“眼中看为好”的希伯来表达，以维持原文的道德张力；通过脚注说明性暴力词语的语义范围。
