base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: zh_hans
  text: 但那人不愿过夜，便起身离去，来到耶布斯对面（耶布斯就是耶路撒冷）[a]。他带着一对备好鞍具的驴，他的妾也与他同行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来到耶布斯对面”也可译作“来到耶布斯附近”或“来到面对耶布斯的地方”。原文表示位于城前或与城相对之处，并未明确说他们已经进城。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: 但那人不愿
  rationale: אָבָה表示愿意、同意；否定形式译为“不愿”，保留其有意不留下的语气，又不强化为敌意性的“拒绝”。
- source_word: לָלוּן
  choice: 在那里过夜
  rationale: 该词特指留宿一夜；“过夜”是现代汉语中自然、准确的表达。“在那里”承接上一节所说的地点，使汉语指向清楚。
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: 就起来离开，来到
  rationale: 保留连续动作的叙事推进，同时按现代汉语习惯将“起来、去、来到”表达为“起来离开，来到”，避免生硬逐词对应。
- source_word: עַד נֹכַח
  choice: 来到……对面
  rationale: נֹכַח表示在某物前面或对面；这一译法不把人物说成已经进入城内，并保留空间关系。
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: 耶布斯就是耶路撒冷
  rationale: 按原文同位说明，明确旧地名耶布斯所指的是耶路撒冷。
- source_word: צֶמֶד חֲמוֹרִים
  choice: 一对……驴
  rationale: צֶמֶד用于牲畜时指成对的两头；“一对驴”简明自然。
- source_word: חֲבוּשִׁים
  choice: 备好鞍具的
  rationale: 该被动分词在旅行语境中指驴已套好、装备妥当；“备好鞍具”比单说“上了鞍”略宽，能够涵盖旅行装备的可能含义。
- source_word: פִילַגְשׁוֹ
  choice: 他的妾
  rationale: “妾”是现代汉语圣经与历史叙述中对该身份简洁而准确的称谓，不将其泛化为妻子。
- source_word: וְעִמּוֹ / עִמּוֹ
  choice: 他带着……也与他同行
  rationale: 原文两次使用“与他同在/同行”。汉语中分别译作“带着”和“与他同行”，既自然，也保留同行者与牲畜均随他的事实。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“妾”保留古代社会身份的准确性；“备好鞍具”避免把 חֲבוּשִׁים 过窄限定为仅有马鞍。脚注标记置于整项地理说明之后，以涵盖“耶布斯对面”的空间歧义。
