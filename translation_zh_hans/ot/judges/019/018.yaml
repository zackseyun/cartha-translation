  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: zh_hans
  text: 他回答说：“我们正从犹大的伯利恒前往以法莲山区最偏远的地方。我本是那里的人，曾到犹大的伯利恒去；现在正往雅威的殿[a]去，可是没有人接我进他家。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威的殿”也可理解为“回家”或“到我家去”。有些人因“雅威的殿”在这里与上下文不易衔接，认为希伯来语是惯用表达，或反映了另一种读法。
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: 我们正……经过这里
  rationale: 分词与独立代词表达正在进行的行程；结合当前所在的基比亚，译为“经过这里”自然地保留过境之意。
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: 从犹大的伯利恒
  rationale: 按现代汉语地名表达处理，既自然，又与其他名为伯利恒的地方相区别。
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: 以法莲山区的偏远之处
  rationale: יַרְכְּתֵי 表示边远、尽头或深处；“偏远之处”保留其空间含义，הַר אֶפְרַיִם 则按地理名称译作“以法莲山区”。
- source_word: מִשָּׁם אָנֹכִי
  choice: 我本是那里的人
  rationale: 直接表达说话者来自该地；“本是”在中文中自然点明籍贯而非当前所在地。
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: 曾到犹大的伯利恒去
  rationale: 保留 wayyiqtol 最自然的过去叙事意义；“曾”使压缩的行程叙述在中文中清楚而不改为现在时。
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: 现在正要到雅威的殿
  rationale: 正文依马所拉文本保留“雅威的殿”，不因上下文困难而擅改为“回家”；“正要到”传达分词所表示的当前去向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现神名 YHWH，而不以称号替代。
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: 可是没有人接我进他家
  rationale: אסף 在款待旅客的语境中意为接纳、留宿；“接我进他家”自然表达 הַבָּיְתָה 的入户方向和款待含义。中文“没有人”不标明性别，但并未排除原文单数 אִישׁ 所指的男性家主。
theological_decisions:
- issue: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ 的疑难读法
  choice: 现在正要到雅威的殿
  alternative: 现在正要回家／到我家去
  rationale: 马所拉文本明确写作“雅威的殿”。尽管此处在上下文中出人意料，正文仍遵从现存希伯来文本，并在脚注保留惯用解释或异文所产生的另一读法。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 采用神名的现代汉语音译，以保留专名性质，不以称号代替。
- issue: אִישׁ 的性别与款待语境
  choice: 没有人接我进他家
  alternative: 没有一个男人接我进他家
  rationale: 原文为阳性单数，语境很可能指男性家主；但现代汉语若直译“没有一个男人”会产生不必要的对比重音。“他家”保留男性家主的语境线索，同时使句子自然。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“山区”用于地理区域，“偏远之处”保留原文的边远意味；正文不消解“雅威的殿”这一真实的文本张力。脚注标记置于相关整句末尾。
