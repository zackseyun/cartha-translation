    issue: “与她交合”可能在现代汉语中带有双方自愿、互惠的含义。
    rationale: 本节的紧邻叙事及“整夜凌辱她”明确表明这是性暴力。正文应避免使受害者看似同意；脚注则可保留希伯来文“认识”的委婉表达。
  - severity: low
    issue: “他们才放她走”中的“才”无原文依据。
    rationale: וַיְשַׁלְּחוּהָ בַּעֲלוֹת הַשַּׁחַר 表示“在/当黎明升起时他们放她走”，并未额外强调“直到那时才”。
