  source_fidelity: 译文整体准确反映了拒绝、强行抓住、使其到外面去、整夜受辱及黎明时被放走的叙事。惟“才放她走”的“才”在希伯来文中没有对应，增添了“直到那时才”的限定。性行为动词在这一明确的暴力语境中不宜译作通常可带互惠意味的“与她交合”；宜在正文中明确其强迫性质，同时以脚注保留原文委婉语。
  naturalness: 整体为庄重、清楚的现代标准汉语。“强暴了她”比“与她交合”更自然且不会造成自愿关系的误解；删除“才”后，时间表达也更贴合原文。
  terminology: “妾”可作为 פִּילֶגֶשׁ 的简洁通行对应。“凌辱”恰当传达 וַיִּתְעַלְּלוּ בָהּ 所含羞辱性虐待。“强暴”在此处准确说明“认识她”这一委婉语在上下文中的强迫性，脚注同时交代原文字面语。
  issues:
