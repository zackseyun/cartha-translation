  text: וְ/לֹֽא אָב֤וּ הָ/אֲנָשִׁים֙ לִ/שְׁמֹ֣עַֽ ל֔/וֹ וַ/יַּחֲזֵ֤ק הָ/אִישׁ֙ בְּ/פִ֣ילַגְשׁ֔/וֹ וַ/יֹּצֵ֥א אֲלֵי/הֶ֖ם הַ/ח֑וּץ וַ/יֵּדְע֣וּ א֠וֹתָ/הּ וַ/יִּֽתְעַלְּלוּ בָ֤/הּ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וַֽ/יְשַׁלְּח֖וּ/הָ ב/עלות הַ/שָּֽׁחַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: zh_hans
  text: 可是，那些人不肯听他的话。于是，那人抓住自己的妾，把她拉出去交给他们。他们强暴了她[a]，又整夜凌辱她，直到早晨；黎明升起时，他们放她走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“认识她”，在这里是指性交的委婉说法；按上下文，这是强迫性的性侵犯。
    reason: 说明希伯来语委婉表达及其在本语境中的暴力含义。
lexical_decisions:
- source_word: אָבוּ
  choice: 不肯
  rationale: 表达不愿、拒绝的意志色彩，简洁自然，不过度推断动机。
- source_word: לִשְׁמֹעַ לוֹ
  choice: 听他的话
  rationale: 此处指接受他的劝说；“听他的话”既可表达听从，也不把语义限定为正式的服从。
- source_word: וַיַּחֲזֵק
  choice: 抓住
  rationale: 体现强行控制的动作，又与后面的“拉出去”自然衔接。
- source_word: פִּילַגְשׁוֹ
  choice: 自己的妾
  rationale: “妾”是现代汉语中对该古代社会身份最简洁、通行的对应词。
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: 把她拉出去交给他们
  rationale: 使役词形表示使她出去；结合“抓住”，译作“拉出去”凸显非自愿性。“交给他们”自然表达方向短语 אֲלֵיהֶם，而“出去”已包含 הַחוּץ。
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: 他们与她交合
  rationale: ידע 在此是性交的委婉语；上下文明确是强迫性的性暴力。正文采用较克制而明确的表达，脚注说明暴力性质，避免现代汉语“认识她”造成误解。
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: 凌辱她
  rationale: 概括羞辱、虐待和暴力对待，符合该词在此处的强烈贬义，并保留其涵盖范围。
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: 整夜……直到早晨
  rationale: 忠实保留持续时间及叙事的残酷力度。
- source_word: וַיְשַׁלְּחוּהָ
  choice: 放她走
  rationale: 在此语境中表示施暴者最终释放、任她离开。
- source_word: בעלות הַשָּׁחַר
  choice: 黎明升起时
  rationale: 保留原文“黎明升起”的动态意象，比单纯“黎明时”更贴近希伯来文。
theological_decisions:
- issue: ידע 性委婉语在强迫语境中的处理
  choice: 正文译为“与她交合”，脚注明确这是强迫性的性侵犯
  alternative: 直译为“认识她”或直接译为“强奸她”
  rationale: “认识她”在现代汉语中无法自然传达性含义；直接译作“强奸”准确揭示情境，却消除了原文委婉措辞。正文与脚注相配，兼顾源文形式和暴力事实。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。叙事不淡化男子强行抓住并推出妾的责任，也不以额外措辞渲染；对性暴力使用克制但不含糊的表达。
