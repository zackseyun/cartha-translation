base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: zh_hans
  text: 第五天早晨，他一早起来要走；年轻女子的父亲却说：“请先吃点东西，补充体力[a]；你们再耽搁到日头偏西吧。”于是两人便吃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“坚固你的心”，这是指借着吃东西恢复体力和精神的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: 一早起来
  rationale: שׁכם的使役式在这里表示早起、及早行动；“一早起来”自然地结合了动词与“早晨”的时间信息。
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: 第五天
  rationale: 直接、清楚地表达原文的序数时间。
- source_word: לָלֶכֶת
  choice: 要走
  rationale: הלך本义宽泛，指“去、走”；上下文含有动身离开的意思，“要走”既自然又不过度具体化。
- source_word: אֲבִי הַנַּעֲרָה
  choice: 年轻女子的父亲
  rationale: נַעֲרָה可指少女或年轻女子；在本段婚姻关系的语境中，“年轻女子”较合宜，也避免“女孩”可能带来的幼小意味。
- source_word: סְעָד נָא לְבָבְךָ
  choice: 请先吃点东西，恢复精神
  rationale: 原文直译为“请坚固/支撑你的心”，结合随后吃饭的叙述，是以进食恢复体力和精神的惯用表达。正文传达实际含义，脚注保留原文意象。
- source_word: וְהִתְמַהְמְהוּ
  choice: 你们再耽搁
  rationale: 该词为复数形式，表示逗留、拖延；“你们再耽搁”保留复数指向及父亲劝他们延后出发的语气。
- source_word: עַד נְטוֹת הַיּוֹם
  choice: 到日头偏西
  rationale: נטה与“日”连用，描写白日倾斜、渐近傍晚；“日头偏西”在现代汉语中自然，并保留原文的形象。
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: 于是两人吃了起来
  rationale: 保留שְׁנֵיהֶם所强调的“两人”，并用“于是”体现他们接受劝说后的叙事结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“日头偏西”保留希伯来文的时间意象；引语中按原文由单数命令转为复数动词，分别译作省略主语的“请先……”和明确的“你们再……”。
