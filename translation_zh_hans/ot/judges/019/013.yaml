  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: zh_hans
  text: 他对随从[a]说：“走吧，我们到其中一个地方去，在基比亚或拉玛过夜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从”也可译作“年轻人”或“仆人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: 对随从说
  rationale: נַעַר可指年轻人、仆人或随从；本节所指是陪同利未人出行的男子。译作“随从”既符合语境，也不刻意强调奴仆身份。
- source_word: לְךָ
  choice: 来吧
  rationale: הלך的命令式字面可译“走”，但其后紧接第一人称劝勉式“我们到……去”，这里是邀请同行者一起行动，现代汉语用“来吧”自然贴切。
- source_word: וְנִקְרְבָה
  choice: 我们到……去
  rationale: 该劝勉式表达共同前往、靠近的提议；汉语“到……去”在旅行语境中自然，并保留趋近目的地的意思。
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: 这两个地方中的一个
  rationale: “一个地方”随即由基比亚和拉玛具体说明；译文将语境中明确的二选一关系自然表达出来。
- source_word: וְלַנּוּ
  choice: 过夜
  rationale: לון意为住宿、度过夜晚；“过夜”简洁、现代，准确符合行旅语境。
- source_word: בַגִּבְעָה
  choice: 在基比亚
  rationale: 采用该地名在现代中文圣经传统中的通行音译。
- source_word: בָרָמָה
  choice: 拉玛
  rationale: 采用该地名在现代中文圣经传统中的通行音译，并与前面的介词“在”并列共用。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话以“来吧”表达共同启程的劝请；“过夜”比“住宿”更贴合לון的夜宿含义。主文本中的脚注标记置于句末，脚注说明“随从”的词义范围。
