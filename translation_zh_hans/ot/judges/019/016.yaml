base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: zh_hans
  text: 看哪，有一位老人傍晚从田间劳作归来。这人来自以法莲山区[a]，寄居在基比亚[b]；当地人却是便雅悯人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较字面地译作“以法莲山”。
    reason: lexical_alternative
  - marker: b
    text: “寄居”所译的希伯来语也可指“居住”或“侨居”，表明他住在基比亚，却不是当地出身的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事中提示读者注意新人物登场的指示语气；用语庄重而仍易懂。
- source_word: אִישׁ זָקֵן
  choice: 一位老人
  rationale: 自然、准确地表达名词加形容词的结构，不额外添加身份信息。
- source_word: בָּא מִן מַעֲשֵׂהוּ מִן הַשָּׂדֶה
  choice: 从田间做工回来
  rationale: 按现代汉语习惯整合两个以“从”引出的短语，既表达他结束田间劳作而来，也避免生硬重复。
- source_word: בָּעֶרֶב
  choice: 傍晚
  rationale: 简洁对应时间状语，并符合上下文中天色已晚的场景。
- source_word: מֵהַר אֶפְרַיִם
  choice: 来自以法莲山区
  rationale: הַר אֶפְרַיִם在此是地理区域名称；“以法莲山区”比字面的“以法莲山”更符合实际所指，也更自然。
- source_word: גָר
  choice: 寄居
  rationale: 保留גור所含并非本地人、以外来者身份居住的意味，且与后文当地人为便雅悯人的对照相呼应。
- source_word: וְאַנְשֵׁי הַמָּקוֹם בְּנֵי יְמִינִי
  choice: 当地人却是便雅悯人
  rationale: 原文以并列形式形成含蓄对照；“却”在汉语中清楚呈现老人出身与当地居民族属的反差。“便雅悯人”是现代汉语中自然的族属表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“看哪”保留原文的话语标记；“寄居”保留人物作为外来居民的关键语义。分号呈现老人身份与当地便雅悯人之间的对照。
