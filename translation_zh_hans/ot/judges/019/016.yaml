- from: 看哪，有一位老人傍晚从田间做工回来。这人来自以法莲山区，寄居在基比亚[a]；当地人却是便雅悯人。
  to: 看哪，有一位老人傍晚从田间劳作归来。这人来自以法莲山区[a]，寄居在基比亚[b]；当地人却是便雅悯人。
