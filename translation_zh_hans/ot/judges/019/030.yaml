base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: zh_hans
  text: 凡看见的人都说：“从以色列人[a]出埃及地的那一天直到今日，这样的事从未发生，也从未见过。你们要把这事放在心上，商议并发言。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”，也可译作“以色列的子孙”。
    reason: 说明希伯来族称בְּנֵי יִשְׂרָאֵל的字面形式及可行译法。
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: 凡看见的人都说
  rationale: וְהָיָה在这里引出随之形成的情形，不必生硬译作“事情是这样”；分词短语כָל הָרֹאֶה表示每一个看见此事的人，וְאָמַר则概括他们共同的反应。
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: 这样的事从未发生，也从未见过
  rationale: 保留“发生”和“见过”两个并列的被动表达，强调此事前所未有；中文用“从未”与下文的时间范围自然衔接。
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם עַד הַיּוֹם הַזֶּה
  choice: 从以色列人出埃及地的那一天直到今日
  rationale: עֲלוֹת在出埃及叙事的固定语境中指从埃及上来或出来；现代中文以“出埃及地”最自然。“直到今日”保留叙述者所标出的完整时间跨度。
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: 你们要把这事放在心上
  rationale: 该习语不是单指观看，而是要求听众认真留意、思量这件事；“放在心上”既保留意象，也符合现代汉语表达。
- source_word: עֻצוּ
  choice: 商议
  rationale: 该复数命令式要求众人共同谋议；“商议”简洁地保留群体审议的含义。
- source_word: וְדַבֵּרוּ
  choice: 并发言
  rationale: 原文没有明说发言内容，译文也保持开放，不擅自补成某一具体决定或行动。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的译法
  choice: 以色列人
  alternative: 以色列的众子／以色列的子孙
  rationale: 此处是指整个以色列民族的惯用族称，现代汉语译作“以色列人”清楚自然；脚注保留该希伯来表达的字面形式，避免掩盖其措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“放在心上，商议并发言”保留原文三个连续命令的力度和简洁性；全节避免古奥套语，也不补入原文未明说的行动方案。
