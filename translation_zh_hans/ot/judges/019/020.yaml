base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: zh_hans
  text: 老人说：“愿你平安！只是，你所需要的一切都由我来负责；只是不可在广场[a]过夜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“街上”。希伯来语此词更具体地指城内开阔的公共场所或广场。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: 老人
  rationale: 希伯来语直指“那位年老的男子”；“老人”符合现代汉语叙事习惯，且不引入身份或职分含义。
- source_word: שָׁלוֹם לָךְ
  choice: 愿你平安
  rationale: 这是表示问安或安抚的固定表达；“愿你平安”保留 שָׁלוֹם 的核心词义，也自然传达祝愿语气。
- source_word: רַק
  choice: 都；只是
  rationale: 该限制、强调小词在两处的语用功能并不完全相同：首处结合全称表达译为“都”，强调一切需要均由老人承担；末处译为“只是”，明确唯一的限制。避免机械重复，同时保留原文的强调结构。
- source_word: כָּל מַחְסוֹרְךָ
  choice: 你所需要的一切
  rationale: מַחְסוֹר 指缺乏之物或需要；此译在款待语境中清楚自然，也比“你所缺少的一切”更符合现代汉语口吻。
- source_word: עָלָי
  choice: 由我来负责
  rationale: 字面为“在我身上”，此处表示老人承担供应客人需要的责任；“由我来负责”准确表达这一惯用含义。
- source_word: בָּרְחוֹב
  choice: 在广场
  rationale: רְחוֹב 在此更可能指城内宽阔的公共空地或广场，而不只是道路；正文采用“广场”，并以脚注保留“街上”的可能译法。
- source_word: אַל תָּלַן
  choice: 不可……过夜
  rationale: לון 表示住宿或留宿一夜；“不可……过夜”简明、自然，并保留否定命令的力度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“愿你平安”保留希伯来问安语的形式；分号呈现款待承诺与禁止露宿之间的转折。脚注标记置于其实际解释的“广场”之后。
