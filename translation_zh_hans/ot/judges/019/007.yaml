  yaml_path: translation/ot/judges/019/007.yaml
  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
translation:
  language: zh_hans
  text: 那人起来要走；他岳父竭力挽留他[a]，于是他回转，在那里住了一夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“再三催促他”或“极力劝他”；希伯来语动词含有坚持催促、强烈恳求的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的Qal叙事形式表示起身采取行动；“起来”自然地保留了动身前的预备动作。
- source_word: הָאִישׁ
  choice: 那人
  rationale: אִישׁ直译为“人、男人”；上下文虽指利未人，原文此处仍采用一般叙事称谓，因此不改译为“丈夫”或“利未人”。
- source_word: לָלֶכֶת
  choice: 要走
  rationale: הלך的不定式接在“起来”之后表目的；“起来要走”符合现代汉语叙事习惯，也没有把原文扩展为更明确的“离开”。
- source_word: וַיִּפְצַר בּוֹ
  choice: 竭力挽留他
  rationale: פצר带有持续、强烈催促或恳求之意；在此情境中，岳父催他留下，因此“竭力挽留”既自然又体现其强度。
- source_word: חֹתְנוֹ
  choice: 他岳父
  rationale: 该亲属词可泛指姻亲关系中的男性，但上下文明确是女子的父亲相对于该男子，现代汉语以“岳父”最准确。
- source_word: וַיָּשָׁב
  choice: 他转身回去
  rationale: שׁוב的基本义是返回、回转；“转身回去”保留了原文所表达的行动或意向逆转，避免直接弱化为“留下”。
- source_word: וַיָּלֶן שָׁם
  choice: 在那里住了一夜
  rationale: לון表示住宿过夜；“住了一夜”是清楚自然的现代汉语表达，并保留时间含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“那人”承接上下文人物，以“岳父”明确亲属关系；分号呈现岳父挽留与男子回转过夜之间的叙事结果。脚注标在对应的“竭力挽留”之后，而非“要走”之后，以准确对应希伯来语פצר。
