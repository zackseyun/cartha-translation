base_translation:
  language: en
  yaml_path: translation/ot/judges/019/015.yaml
  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: zh_hans
  text: 他们就转到那里，要进基比亚过夜。他进去，坐在城里的广场上[a]，却没有人把他们接进家里过夜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城里的街上”。希伯来语这个词可指宽阔的公共场所或广场。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“没有一个人”；意思是没有当地居民愿意接待他们。
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: 他们就转到那里
  rationale: סור在行程语境中表示偏离原来的路线、转向某处；“转到那里”自然地保留这一动态。
- source_word: לָבוֹא לָלוּן
  choice: 进去要……过夜
  rationale: בוא表示进入，לון表示留宿一夜；合译既保留两个动作，也符合现代汉语叙事。
- source_word: בַּגִּבְעָה
  choice: 在基比亚
  rationale: 按专名音译为“基比亚”，介词表达在该城中过夜。
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: 他进了城，坐在
  rationale: 原文由复数转为单数，以领头的利未人代表同行者；“进了城”补足汉语中自然可知的宾语，并保留叙事动作顺序。
- source_word: בִּרְחוֹב הָעִיר
  choice: 城里的广场上
  rationale: רְחוֹב可指宽阔的公共空间或广场；正文采用最符合此处等候接待场景的“广场”，同时用脚注保留“街上”的可能。
- source_word: וְאֵין אִישׁ
  choice: 却没有人
  rationale: אִישׁ形式上为阳性单数，但在否定存在句中自然泛指任何居民；现代汉语用“没有人”准确传达其功能。
- source_word: מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: 接他们到家里
  rationale: אסף字面有聚集、收进之意，在此特指把旅客接入家中款待；“接他们到家里”自然且没有过度解释房屋归属。
