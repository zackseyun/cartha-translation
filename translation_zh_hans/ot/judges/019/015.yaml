  to: 他们就转到那里，要进基比亚过夜。他进去，坐在城里的广场上[a]，却没有人把他们接进家里过夜[b]。
  rationale: 修订仅改善汉语语序与搭配，并避免将“进去了”明确化为“进了城”。保留原文的叙事视角转换、基比亚的专名、公共广场的词义选择，以及无人提供住宿的含义。
