base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: zh_hans
  text: 那人和他的妾、随从起身要走时，他的岳父，就是那年轻女子的父亲，对他说：“你看，天色渐晚了；请住一夜吧。你看，这一天快要安歇了[a]。就在这里过夜，让你的心欢畅。明天你们早起赶路[b]，你就回家去吧[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一天快要安歇了”直译为“这一天正在扎营”，把一天将尽描写成安顿下来。
    reason: source_image
  - marker: b
    text: “你们早起”在原文中是复数，指整个同行队伍；后面的“你就回家去”则是单数，专对那人说。
    reason: grammar
  - marker: c
    text: “回家去”直译为“到你的帐棚去”，这里是回到住处的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: 那人
  rationale: 按普通叙事称谓翻译，不在正文中加上原文未明说的“丈夫”或“利未人”身份。
- source_word: פִילַגְשׁוֹ
  choice: 他的妾
  rationale: 保留古代社会关系类别，不弱化为一般的“妻子”。
- source_word: נַעֲרוֹ
  choice: 随从
  rationale: 此处指随行服侍他的人；译出其语境功能，而不强调年龄。
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: 他的岳父，就是那年轻女子的父亲
  rationale: “岳父”符合上下文，后面的同位语仍予保留，以反映原文的重复说明。
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: 天色渐晚，已经快到晚上了
  rationale: 自然表达日光衰退、夜晚临近的意思，同时保留向傍晚发展的动态。
- source_word: חֲנוֹת הַיּוֹם
  choice: 这一天快要安歇了
  rationale: 原文罕见地用“扎营、安顿”描写一天将尽；正文保留可理解的拟人意象，并以脚注说明。
- source_word: וְיִיטַב לְבָבֶךָ
  choice: 让你的心欢畅
  rationale: 保留“心”的希伯来语意象，也自然表达欢喜舒畅之意。
- source_word: וְהִשְׁכַּמְתֶּם מָחָר ... וְהָלַכְתָּ
  choice: 明天你们早起……你就……去吧
  rationale: 分别译出前一动词的复数和后一动词的单数，显示先对同行众人、后对那人说话。
- source_word: לְאֹהָלֶךָ
  choice: 回家去
  rationale: “到你的帐棚去”在此为回到住处的惯用说法；正文译出实际含义，脚注保留字面表达。
