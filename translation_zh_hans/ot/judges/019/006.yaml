  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: zh_hans
  text: 于是，他们二人一同坐下，吃喝。年轻女子的父亲对那人说：“请你答应留下过夜，使你的心欢畅。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: 坐下
  rationale: ישׁב在叙事链中引出用餐；译作“坐下”自然贴合语境，又不增添原文没有的细节。
- source_word: וַיֹּאכְלוּ ... וַיִּשְׁתּוּ
  choice: 吃喝起来
  rationale: 忠实表达“吃、喝”两个动作，并以现代汉语自然的叙事方式衔接；原文未说明所喝之物，译文也不补出。
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: 两人一同
  rationale: 兼顾“两人”和“一同”的强调，保持原文成对相聚的表达。
- source_word: אֲבִי הַנַּעֲרָה
  choice: 年轻女子的父亲
  rationale: נַעֲרָה在此指年轻女子；这一译法现代、庄重，也避免“女孩”可能带来的未成年含义。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 原文只称其为“那人”，虽上下文可知其身份，仍不将“丈夫”或“利未人”带入本节。
- source_word: הוֹאֶל נָא
  choice: 请你愿意
  rationale: הוֹאֶל表达愿意或同意，נָא带有礼貌恳请的语气；译文保留了邀请而非强硬命令的口吻。
- source_word: וְלִין
  choice: 留下来过夜
  rationale: לון指留宿、过夜；“留下来过夜”既交代过夜，也自然体现父亲挽留对方的语境。
- source_word: וְיִטַב לִבֶּךָ
  choice: 让你的心欢畅
  rationale: 原文字面为“使你的心好/愉快”。保留“心”的意象，以“欢畅”传达宴饮款待语境中的愉悦。
theological_decisions: []
translation_notes:
  register: 采用现代标准普通话、简体中文。行文庄重而易懂；保留原文的“那人”和“心”之措辞，不借上下文替换身份，也不对款待语作神学化解释。
