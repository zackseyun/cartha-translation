base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: zh_hans
  text: 他对她说：“起来，我们走吧！”可是无人回答[a]。于是他把她放到驴背上[b]；那人便起身，往自己的地方去了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“没有回答者”或“没有人回答”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“于是他把她放上驴背”。这里的希伯来语动词字面意思是“拿、取”，在本句中指把她抬起或安置在驴上。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“回自己的家去了”。原文直译为“到他的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: 他对她说
  rationale: 按希伯来语叙事时态自然译出说话动作；汉语无需逐字重复句首连接词。
- source_word: קוּמִי
  choice: 起来
  rationale: 这是对女性单数对象发出的命令；“起来”自然、直接，也与后文那人的“起身”保留词语呼应。
- source_word: וְנֵלֵכָה
  choice: 我们走吧
  rationale: 第一人称复数鼓励式表达提议或意愿，“我们走吧”准确传达其语气。
- source_word: וְאֵין עֹנֶה
  choice: 可是无人回答
  rationale: 原文直译近于“没有回答者/没有人回答”；“可是”在语境中自然呈现期待回应却未获回应的转折。
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: 于是他把她放到驴上
  rationale: לקח 的基本义是“拿、带、取”，但与“在驴上”连用时，语境所指是把她安置到驴背上；“放到”清楚自然，同时以脚注保留原词的字面表达。
- source_word: וַיָּקָם הָאִישׁ
  choice: 那人便起身
  rationale: 保留 קום 的独立动作，不将它与随后“去”的动作合并；“那人”承接已知人物，符合现代汉语叙事。
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: 往自己的地方去了
  rationale: מקום 本义宽泛，为“地方”；语境可能指住所或家乡，但正文不把这种可能性确定为“家”。
