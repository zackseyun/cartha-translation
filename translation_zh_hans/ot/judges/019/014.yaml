base_translation:
  language: en
  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: zh_hans
  text: 他们越过那里，继续前行；太阳在属便雅悯的基比亚[a]附近落下了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“位于便雅悯境内的。”希伯来语短语表明基比亚与便雅悯支派或其领地有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: 他们越过那里
  rationale: עבר在连续叙事中表示越过先前考虑停留的地方、继续上路；“越过那里”结合上下文表达这一推进动作。
- source_word: וַיֵּלֵכוּ
  choice: 继续前行
  rationale: הלך是“走、去”的常用动词；译作“继续前行”既保留第二个行进动词，也使现代汉语自然流畅。
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: 太阳就落了
  rationale: 字面为“太阳来到他们那里”，在此是日落临到旅人的表达；汉语用“太阳就落了”自然传达天黑赶上他们的情境。
- source_word: אֵצֶל
  choice: 附近
  rationale: 该介词表示邻近；在旅行叙事中译作“附近”最清楚自然。
- source_word: הַגִּבְעָה
  choice: 基比亚
  rationale: 此处不是普通名词“山冈”，而是由后续便雅悯归属语限定的地名，按通行中文圣经人名地名形式译为“基比亚”。
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: 属便雅悯的
  rationale: 该短语表示基比亚与便雅悯支派或其领地的归属、关联；“属便雅悯的”简洁保留这种关系，同时不把含义局限为单纯地理位置。
- source_word: בִנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经传统中已通行的支派名称。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“越过那里，继续前行”保留希伯来文连续使用两个行进动词的叙事节奏；调整语序，把地点置于日落之前，以符合自然汉语，同时不改变事件关系。
