  text: וְ/גַם תֶּ֤בֶן גַּם מִסְפּוֹא֙ יֵ֣שׁ לַ/חֲמוֹרֵ֔י/נוּ וְ֠/גַם לֶ֣חֶם וָ/יַ֤יִן יֶשׁ לִ/י֙ וְ/לַֽ/אֲמָתֶ֔/ךָ וְ/לַ/נַּ֖עַר עִם עֲבָדֶ֑י/ךָ אֵ֥ין מַחְס֖וֹר כָּל דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: zh_hans
  text: 况且，给我们的驴的秸秆和饲料都有[a]；我、你的婢女[b]和跟你众仆人在一起的那个年轻人[c]都有饼和酒；我们什么都不缺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在本句中反复使用“也”，可直译为：“并且，我们的驴既有秸秆，也有饲料；我……也有饼和酒。”
    reason: 说明原文重复词语所表达的强调。
  - marker: b
    text: “你的婢女”是说话者对同行女子的谦称，并不是在说明她真是这位老人的婢女。
    reason: 解释古代礼貌称谓，避免误解人物关系。
  - marker: c
    text: 原文作“跟你的众仆人在一起”。这里的“你的”是对老人说的；这句话的具体所指略显含混，也有人理解为年轻人与说话者一行的仆人同在。
    reason: 保留并说明马所拉文本中人称指向所造成的语意张力。
lexical_decisions:
- source_word: וְגַם ... גַם ... וְגַם
  choice: 况且……和……也……
  rationale: 希伯来文反复使用“也”，兼有补充和强调作用。中文用“况且”承接上文，再以“和”“也”体现累加关系，避免逐字重复造成生硬。
- source_word: תֶּבֶן
  choice: 干草
  rationale: 指供牲畜食用或垫卧的秸秆、草料；“干草”便于现代普通读者理解，并与下文“饲料”区分。
- source_word: מִסְפּוֹא
  choice: 饲料
  rationale: 泛指牲畜的食料；译作“饲料”准确而自然。
- source_word: לַחֲמוֹרֵינוּ
  choice: 喂驴的
  rationale: 保留用途关系；“我们有喂驴的……”在中文中自然表达原文“给我们的驴有……”。
- source_word: לֶחֶם וָיַיִן
  choice: 饼和酒
  rationale: לֶחֶם在此按具体食物译为“饼”，不泛化为“食物”；יַיִן直译为“酒”。
- source_word: אֲמָתֶךָ
  choice: 你的婢女
  rationale: 保留阴性身份和对受话者的谦称；“婢女”比“女仆”更能体现此处礼貌而自谦的称呼方式。
- source_word: לַנַּעַר
  choice: 那个年轻人
  rationale: נַעַר可指年轻男子或随从；正文采用较宽泛的“年轻人”，不强行限定其职分。
- source_word: עִם עֲבָדֶיךָ
  choice: 跟你众仆人在一起
  rationale: 按马所拉文本保留第二人称阳性单数后缀“你的”，不因语意略显突兀而擅自改作“我们的”。
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: 什么都不缺
  rationale: 自然表达希伯来语“没有任何东西缺少”的完整供应之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“况且”自然承接老人关于住宿和供应的关切；分号保留原句从牲畜所需转到旅人所需、再总结一无所缺的层次。
