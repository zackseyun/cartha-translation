  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֗אמֶר יַעַן֩ אֲשֶׁ֨ר עָבְר֜וּ הַ/גּ֣וֹי הַ/זֶּ֗ה אֶת בְּרִיתִ/י֙ אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבוֹתָ֔/ם וְ/לֹ֥א שָׁמְע֖וּ לְ/קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: zh_hans
  text: 耶和华向以色列怒火中烧，说：“因为这个民族违背了我吩咐他们祖先遵守的约[a]，不听我的话[b]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “违背”也可译作“破坏”。希伯来语动词本义是“越过”，用于“约”时表示违反或越过约的界限。
    reason: lexical_alternative
  - marker: b
    text: “不听我的话”也可译作“不服从我”。希伯来语“听我的声音”这一表达常包含听从、顺服的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 怒火中烧
  rationale: 保留希伯来语以热与燃烧描写愤怒的意象，同时符合现代汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式音译四字神名，不以“主”这一称号代替。
- source_word: בְּיִשְׂרָאֵל
  choice: 向以色列
  rationale: 在发怒的语境中，介词标明怒气所针对的对象；“向以色列”自然明确。
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 简洁准确地引出随后宣告的理由，并保留本节与下一节之间尚未完结的因果结构。
- source_word: עָבְרוּ
  choice: 违背
  rationale: 该动词本义与“越过”有关，以“约”为宾语时表示越界、违反；“违背”保留其道德和盟约含义。
- source_word: הַגּוֹי הַזֶּה
  choice: 这国
  rationale: 原文使用גּוֹי“国、民族”，而非通常表示“百姓”的词；译作“这国”保留这一有标记的措辞。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: “约”是中文圣经语境中对בְּרִית的准确而简洁的表达，保留盟约关系的含义。
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: 我吩咐他们祖先遵守的
  rationale: 原文结构紧缩，意思是这约是神吩咐其祖先的；补出“遵守”使现代汉语通顺，同时不改变命令所指向约的关系。
- source_word: וְלֹא שָׁמְעוּ לְקוֹלִי
  choice: 不听我的话
  rationale: 保留“听声音/话”的听觉意象；在汉语中“不听我的话”也自然包含不顺从之意。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。译文采用现代中文圣经读者最熟悉的专名形式“耶和华”，避免用称号“主”替代专名；“雅威”是另一种较接近学术重构读音的形式。
- issue: 保留盟约与审判用语
  choice: 违背了……约；不听我的话
  alternative: 破坏了……约；不服从我
  rationale: 原文以违反盟约和不听神声音来界定以色列的罪；此译法保留两重表达及其神学张力，不将其概括为一般性的“不顺服”。
- issue: 保留跨节未完的因果句
  choice: 以“因为”引出理由，并在本节结尾保留未完语势
  alternative: 在本节内补成完整结果句
  rationale: 希伯来文本的结果要到下一节才出现；不在本节擅自补足，可忠实呈现原有句法衔接。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“怒火中烧”保留原文愤怒发热的意象；“这国”刻意保留原文גּוֹי的用词。句末保留逗号式未完语势，因为神宣告的结果延续到下一节。
