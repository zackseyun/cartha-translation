source:
  edition: WLC
  text: לְמַ֛עַן נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל הֲ/שֹׁמְרִ֣ים הֵם֩ אֶת דֶּ֨רֶךְ יְהוָ֜ה לָ/לֶ֣כֶת בָּ֗/ם כַּ/אֲשֶׁ֛ר שָׁמְר֥וּ אֲבוֹתָ֖/ם אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: zh_hans
  text: 为要借着他们[a]试验以色列人，看他们是否谨守雅威的道路，行在其中，像他们的父辈所谨守的那样，还是不然。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着他们”或译“通过他们”。“他们”指上文所说留在当地的列国。
    reason: 说明 בָּם 的工具性用法及其上文所指，同时保留可行的中文替代译法。
lexical_decisions:
- source_word: לְמַעַן
  choice: 为要
  rationale: 保留目的意味，并符合现代中文经文语体。
- source_word: נַסּוֹת
  choice: 试验
  rationale: 表示借具体处境检验以色列是否忠于所命之道；“试验”比“试探”更避免引入诱人犯罪的含义。
- source_word: בָּם
  choice: 借着这些民族
  rationale: 代词承接上文留下的列国；在正文补明所指，使中文清楚，同时以脚注保留“用他们”的较直译表达。
- source_word: הֲשֹׁמְרִים הֵם
  choice: 看他们是否谨守
  rationale: 疑问词与分词构成试验的内容；“是否”保留开放性，“谨守”体现持续遵守的意味。
- source_word: דֶּרֶךְ יְהוָה
  choice: 耶和华的道路
  rationale: 保留圣经中“道路”表示生活方式与所命之道的隐喻，并将神名按现代中文通行形式译为“耶和华”。
- source_word: לָלֶכֶת בָּם
  choice: 行在其中
  rationale: 直译“行走于其中”；虽然希伯来语代词为复数形式，语义上指向“道路”，中文用“其中”可保留形式上的含混而不显生硬。
- source_word: כַּאֲשֶׁר שָׁמְרוּ אֲבוֹתָם
  choice: 像他们的祖先谨守那样
  rationale: 重复“谨守”以再现 שמר 的词语呼应；“祖先”在现代汉语中准确表达父辈、先祖的宗族含义。
- source_word: אִם לֹא
  choice: 还是不谨守
  rationale: 与前面的“是否”共同表达“是否……还是不……”的选择疑问，并补出动词以使中文完整。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用现代中文圣经读者最熟悉且仍作为专名使用的“耶和华”；“雅威”更接近学术界常见重构读音，但原始发音并非完全确定。
- issue: “试验”与人的顺服
  choice: 保留“是否……还是不……”的开放表述
  alternative: 解释为神为了获知未知结果，或预定某一结果
  rationale: 原文只陈述借列国试验以色列是否谨守，并未说明神知识的性质或试验结果；译文不额外解决这一神学张力。
- issue: אֲבוֹתָם 的性别与范围
  choice: 他们的祖先
  alternative: 他们的父辈
  rationale: 此处指以色列先前世代。“祖先”是自然、准确的现代中文亲缘称谓，不暗示经文排除女性先祖，也不改变其宗族承继意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“谨守—谨守”保留原文动词重复；“道路、行在其中”保留希伯来语的行路隐喻。正文避免过度古雅，也不将试验的神学目的作超出原文的阐释。
