  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: zh_hans
  text: 约书亚遣散了百姓，以色列人[a]便各自到自己的产业去，占领那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的众子”。
    reason: 保留בְנֵי יִשְׂרָאֵל的字面形式，同时在正文采用自然的现代汉语群体称谓。
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 遣散了
  rationale: שׁלח在这里指让聚集的百姓离开、各自前往所得之地；“遣散”自然保留了使其离去的含义。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文只说“百姓”，上下文虽明确指以色列民，正文不作额外扩充。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人[a]
  rationale: 这是希伯来语对以色列群体的惯用称呼；现代汉语用“以色列人”准确自然，脚注保留其字面形式。
- source_word: אִישׁ
  choice: 各自
  rationale: 此处אִישׁ具有逐一分配的用法，强调每个人或各家各支分别前往自己的产业；“各自”在汉语中最自然地表达这种分配含义。
- source_word: לְנַחֲלָתוֹ
  choice: 到自己的产业去
  rationale: נַחֲלָה指作为承受之份所得的土地。“产业”保留继承和盟约赐地的内涵，并由上下文表明这里所指的是土地。
- source_word: לָרֶשֶׁת
  choice: 占领
  rationale: ירשׁ在此表示实际取得并据有那地；“占领”体现主动取得土地的语境，也自然表达此不定式所说明的目的。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 这里特指以色列将要据有的迦南地；“那地”符合叙事上下文，也避免误解为全地或地球。
theological_decisions:
- issue: 以色列群体的性别化称谓
  choice: 正文译作“以色列人”，脚注注明字面作“以色列的众子”
  alternative: 以色列的众子
  rationale: בְנֵי יִשְׂרָאֵל是带阳性形式的群体惯用语。正文采用现代汉语中不失准确且自然的称呼，同时以脚注保留原文形式，不将其所指范围限定为成年男性。
- issue: 应许之地的承受用语
  choice: 产业
  alternative: 地业；所分得之地
  rationale: “产业”保留נַחֲלָה作为承受之份的含义及其盟约背景，同时不把它简化为一般财产。
- issue: 取得土地的动作
  choice: 占领那地
  alternative: 得那地为业；占有那地
  rationale: לָרֶשֶׁת在士师记的土地定居与征服语境中兼有取得、据有之意；“占领”保留其主动性，不预先消解取得土地与承受产业之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“便”承接叙事次序；“各自……去”清楚表达分配性结构。避免使用较古雅的“以色列众子”和现代语义可能偏向行业经营的扩展表达，同时由“占领那地”明确“产业”在此指所分得的土地。
