  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: zh_hans
  text: 于是，雅威留下了这些民族[a]，没有迅速把他们赶出去，也没有把他们交在约书亚手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让这些民族留下”；希伯来语动词可指“任其存留”或“留在原处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: 留下了
  rationale: 该词在使役用法中可表示“让……留下、任其存留”或“留下”。译作“留下了”简洁自然，同时以脚注保留其“让其继续存在”的语义可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名直接音译为“雅威”，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: 这些民族
  rationale: גּוֹיִם可指“民族”或“列国”；本节所指是仍留在迦南地的族群，“这些民族”准确且符合现代汉语。
- source_word: לְבִלְתִּי הוֹרִישָׁם
  choice: 没有……把他们赶出去
  rationale: לְבִלְתִּי引出否定的不定式结构；הוֹרִישָׁם在这里指使当地居民失去土地、将其赶走。此译清楚表达行动而不过度解释其目的或结果关系。
- source_word: מַהֵר
  choice: 迅速
  rationale: 该副词表示“很快、迅速”；“迅速”庄重而符合现代书面汉语。
- source_word: וְלֹא נְתָנָם בְּיַד יְהוֹשֻׁעַ
  choice: 也没有把他们交在约书亚手中
  rationale: “交在……手中”保留希伯来语表示交付权势或控制之下的惯用意象，在汉语圣经语境中也清楚可懂。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名，而非“主”的称号；音译“雅威”直接保留该专名，并避免以称号替换。
- issue: 上帝留下这些民族与未将其赶出的关系
  choice: 并列呈现“留下”与“没有迅速赶出”
  alternative: 明确译成“为的是不迅速赶出他们”
  rationale: לְבִלְתִּי可表达目的或结果，且上下文把这些民族继续存留归于雅威的行动。正文采用自然的并列结构，不强行限定为单一的目的或结果解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“交在约书亚手中”保留原文权柄与控制的手之意象；整体语序贴近希伯来叙事，又避免生硬直译。
