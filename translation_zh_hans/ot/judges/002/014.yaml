  to: 于是，耶和华向以色列发怒[a]，把他们交在劫掠者手中；劫掠者就劫掠他们。他又把他们卖给四周的仇敌[b][c]，使他们再也不能在仇敌面前站立。
  rationale: 修订删除“任由”以避免增加原文未明说的许可性语气；将“卖到……手中”调整为自然的“卖给……”，同时在脚注保留希伯来语“手”所表达的权势惯用语。怒气燃烧的拟人化意象和“四周”一词的空间含义均由简明脚注保留。
