base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: zh_hans
  text: 于是，耶和华向以色列发怒[a]，把他们交在劫掠者手中；劫掠者就劫掠他们。他又把他们卖给四周的仇敌[b][c]，使他们再也不能在仇敌面前站立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华向以色列的怒气燃烧。”
    reason: lexical_alternative
  - marker: b
    text: “交在……手中”和“卖在……手中”都是希伯来语惯用表达，意思是交由对方掌控。
    reason: cultural_note
  - marker: c
    text: 或译：“他们四周的仇敌”或“四面八方的仇敌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 燃起怒火
  rationale: 希伯来语以“怒气燃烧”的意象表达强烈愤怒；“燃起怒火”在现代汉语中自然，并保留原文的火焰隐喻。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的神圣名字译法，将四字神名作为专名呈现，而不以“主”这一称号取代。
- source_word: וַיִּתְּנֵם בְּיַד
  choice: 把他们交在……手中
  rationale: 保留希伯来语“交在手中”的惯用意象，语境清楚地表示交由对方掌控。
- source_word: שֹׁסִים / וַיָּשֹׁסּוּ
  choice: 劫掠者……劫掠
  rationale: 用同根的中文表达再现原文名词与动词的重复联系，也准确传达掠夺财物、蹂躏百姓之意。
- source_word: וַיִּמְכְּרֵם
  choice: 把他们卖到
  rationale: 保留“卖”这一具体而强烈的审判意象，不弱化为一般的“交付”。
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  choice: 四围仇敌
  rationale: 简洁表达仇敌来自周围各方；原短语也可理解为“在他们周围的仇敌”。
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: 再也不能在……面前站立
  rationale: 贴近原文的空间意象，同时在争战语境中自然表示无法抵挡、站稳。
theological_decisions:
- issue: 以拟人化意象描述上帝的愤怒
  choice: 耶和华对以色列燃起怒火
  alternative: 耶和华向以色列发怒
  rationale: 保留原文“怒气燃烧”的鲜明意象，不把它扩展为原文未说明的神学解释。
- issue: “卖”作为盟约审判的意象
  choice: 把他们卖到四围仇敌的手中
  alternative: 把他们交给四围的仇敌
  rationale: 原文明确使用“卖”而非一般的“交付”；直译保留审判语言的力度，但不进一步说明交易方式或代价。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“任由那些人”使连续两个分句的施事关系在中文中更清楚，同时不改变原文因果。“站立”保留原文意象，读者可从争战语境理解为无法抵挡。
