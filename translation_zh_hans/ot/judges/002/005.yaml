  text: וַֽ/יִּקְרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֹּכִ֑ים וַ/יִּזְבְּחוּ שָׁ֖ם לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: zh_hans
  text: 于是，他们给那地方起名叫波金[a]，并在那里向雅威献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “波金”在希伯来语中意为“哭泣的人”或“哭泣者”。
    reason: 说明地名 בֹּכִים 的希伯来语词义。
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: 他们给……起名叫
  rationale: 这是希伯来语常见的命名表达。中文用“给……起名叫”既准确传达“称……的名”，又比逐字译法自然。
- source_word: הַמָּקוֹם הַהוּא
  choice: 那地方
  rationale: 保留指示词 הַהוּא 的意义，并采用自然、简洁的现代汉语表达。
- source_word: בֹּכִים
  choice: 波金
  rationale: 此处用作地名，因此音译；其与“哭泣的人”相关的词义在脚注中说明。
- source_word: וַיִּזְבְּחוּ
  choice: 献祭
  rationale: זבח 在此表示向神献祭；“献祭”简洁、庄重，也无需补出原文没有明说的祭物。
- source_word: שָׁם
  choice: 在那里
  rationale: 明确回指刚刚命名的地方，符合现代汉语表达。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 לְ 在献祭语境中自然译作“向”；神名 יהוה 音译为“雅威”，保留其专名性质。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”可在中文中保留其作为以色列之神专名的性质，而不以称号替代。
- issue: 地名 בֹּכִים 应意译还是音译
  choice: 波金
  alternative: 哭泣者；哭泣的人
  rationale: 该词在句中明确充当地名，因此正文音译；其词义及与上文哭泣情景的联系由脚注保留。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“于是”承接上节叙事；“给那地方起名叫”避免生硬照搬希伯来语“称那地方的名”；正文保留地名音译，并用脚注交代其含义。
