  text: וַ/יָּ֥קֶם יְהוָ֖ה שֹֽׁפְטִ֑ים וַ/יּ֣וֹשִׁיע֔וּ/ם מִ/יַּ֖ד שֹׁסֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: zh_hans
  text: 于是，雅威兴起士师；这些士师救他们脱离[a]抢掠他们之人的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救他们脱离”也可译作“解救他们”。
    reason: 保留 ישׁע 在此处可表达为“拯救”或“解救”的词汇选择。
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 兴起
  rationale: 希伯来语使役形表达雅威使这些领袖出现并承担使命；“兴起”保留了神主动发起和历史行动的意味，也符合庄重而通顺的现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，以保留经文中的专名，而不以“主”这一称号替代。
- source_word: שֹׁפְטִים
  choice: 士师
  rationale: “士师”是该词及本卷人物的通行中文名称；虽然这些人也承担领袖和拯救者的职能，但不宜把名称窄化为其中一种功能。
- source_word: וַיּוֹשִׁיעוּם
  choice: 这些士师救他们脱离
  rationale: ישׁע在此表示从危险或辖制中施行援救。“救……脱离”清楚表达实际的解救行动，并借“这些士师”明确希伯来语动词复数主语所指。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留希伯来语以“手”表示权势、控制的比喻；这一说法在中文中仍可理解，并维持原文形象。
- source_word: שֹׁסֵיהֶם
  choice: 抢掠者
  rationale: 该词指以暴力劫掠、夺取财物的人。“抢掠者”简洁保留其掠夺意味；“压迫者”则过于宽泛。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，不用称号取代，也不把有争议的传统读音写入正文。
- issue: 士师应主要呈现为司法官还是拯救者
  choice: 正文保留名称“士师”，再以“救他们脱离”说明其行动
  alternative: 将 שֹׁפְטִים 直接译作“拯救者”或“领袖”
  rationale: 原文本身同时呈现其名称和功能：他们被称为“士师”，又实际拯救百姓。两者并存可避免把其角色缩减为单一层面。
- issue: 是否明确复数主语所指
  choice: 译作“这些士师”
  alternative: 仅用“他们”
  rationale: 希伯来语动词形态清楚显示主语为前述复数“士师”。中文若连续使用“他们”，容易与受救的百姓混淆；明确主语只消除代词歧义，并未增加新的解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“于是”承接前文；分号呈现雅威兴起士师与士师施行拯救之间紧密的行动关系。保留“手”的原文比喻，同时用“脱离”使中文自然。
