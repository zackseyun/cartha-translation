  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: zh_hans
  text: 你们不可与这地的居民立约；要拆毁他们的祭坛。但你们没有听从我的声音。你们做的这是什么事？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: 立约
  rationale: 希伯来语字面为“切约”，是订立盟约的固定说法。现代汉语“立约”自然简洁，也保留了 בְּרִית 的盟约含义。
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: 与这地的居民
  rationale: לְ 在“立约”结构中表达立约对象，宜译为“与”；“这地的居民”准确保留分词性名词和指示词。
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: 却要拆毁他们的祭坛
  rationale: נתץ 表示拆除、毁坏建筑或祭坛；“拆毁”准确而自然。连接词在两项相对命令之间译作“却”，清楚呈现禁止立约与必须拆坛的对照。
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: 但你们没有听从我的声音
  rationale: שמע בקול 不仅指听见，也含服从之意；“听从我的声音”既保留声音意象，也传达违命含义。וְ 在此具有转折作用，译为“但”。
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: 你们做的这是什么事？
  rationale: 此译保留原文“这是什么”的责问形式和震惊、谴责语气，不把问题改释为询问动机的“为什么”。
- source_word: וְאַתֶּם לֹא ... תִכְרְתוּ ... תִתֹּצוּן
  choice: 你们不可……却要……
  rationale: 未完成式在此重申先前颁布的命令。汉语用“不可……要……”能够自然表达持续有效而被违背的命令，不必为配合回顾语境改成较生硬的过去义务表达。
theological_decisions:
- issue: 以色列被禁止与迦南地居民建立的关系应如何表述
  choice: 立约
  alternative: 结盟
  rationale: בְּרִית 可包括政治盟约，但“立约”保留其较宽且具有圣经神学分量的含义，不把关系限缩为纯政治联盟。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“听从我的声音”略带经文语体，但普通读者易懂，并保留原文意象。原文的复数第二人称在汉语中明确译作“你们”。无需脚注；“切约”的字面形式是希伯来语惯用表达，在中文正文或注释中直译反而可能造成误解。
