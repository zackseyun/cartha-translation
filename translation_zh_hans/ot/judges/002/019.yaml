  to: 士师死后，以色列人又回头，比他们的先辈行事更加败坏，去随从别神，服事它们，向它们下拜。他们丝毫没有丢弃自己的所作所为，也没有离开自己顽梗的道路。[a]
  rationale: 修订以较直接的现代汉语呈现“转回”和“没有丢弃”，避免把原文的叙述性否定强化为明确的主观拒绝；同时以“行事更加败坏”清楚表达比较性的败坏行为。保留“以色列人”以便本节独立阅读时主语明确，也保留末尾脚注锚点及其所说明的希伯来文字面意象。
