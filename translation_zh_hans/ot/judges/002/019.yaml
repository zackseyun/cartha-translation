source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/מ֣וֹת הַ/שּׁוֹפֵ֗ט יָשֻׁ֨בוּ֙ וְ/הִשְׁחִ֣יתוּ מֵֽ/אֲבוֹתָ֔/ם לָ/לֶ֗כֶת אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם לֹ֤א הִפִּ֨ילוּ֙ מִ/מַּ֣עַלְלֵי/הֶ֔ם וּ/מִ/דַּרְכָּ֖/ם הַ/קָּשָֽׁה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: zh_hans
  text: 士师死后，以色列人又回头，比他们的先辈行事更加败坏，去随从别神，服事它们，向它们下拜。他们丝毫没有丢弃自己的所作所为，也没有离开自己顽梗的道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有丢弃”直译为“不使……落下”，意思是他们丝毫没有放下自己的所作所为和顽梗的道路。
    reason: 说明 לֹא הִפִּילוּ 的字面意象及其语境含义。
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: 士师一死
  rationale: 这是带时间不定式的希伯来叙事句式；译为简洁自然的时间从句，保留士师记中“士师”的专门称谓。
- source_word: יָשֻׁבוּ
  choice: 故态复萌
  rationale: 此处的 שׁוּב 表示士师死后重新陷入先前的悖逆；“故态复萌”自然传达这种反复，而非普通的空间返回。
- source_word: וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: 比他们的先辈更加败坏
  rationale: Hiphil 形式在此描述败坏的行为或状态，介词 מִן 表示比较；“先辈”比现代汉语中的“父亲们”更准确地指前代人。
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: 去随从别神
  rationale: 保留“走在……之后”所表达的效忠与追随含义；“别神”简洁地呈现与耶和华相对的其他神明。
- source_word: לְעָבְדָם
  choice: 服事它们
  rationale: עבד 对神明可指敬拜性的事奉；译作“服事”可与下一动词所表达的下拜动作保持区别。
- source_word: וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: 向它们下拜
  rationale: 该词具体指俯伏、下拜致敬；这样保留其身体动作和祭祀含义，不笼统合并为“敬拜”。
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: 不肯放弃自己的所作所为
  rationale: 字面图像是“不使……落下”，语境义为不放下、不舍弃；“不肯放弃”在现代汉语中自然，并体现顽固不改的语气。
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: 也不肯离开自己顽梗的道路
  rationale: “道路”保留 דֶּרֶךְ 的生活方式隐喻；קָשֶׁה 在此不是艰难，而是刚硬、顽梗。补出“离开”使汉语通顺，并忠实表达未从这条道路上转离。
theological_decisions:
- issue: אֱלֹהִים אֲחֵרִים 在以色列背约语境中的译法
  choice: 别神
  alternative: 外邦神明
  rationale: 原文强调这些是耶和华以外的神，并未明确突出其族群或地域属性；“别神”保留这一盟约对比，避免加入“外邦”的额外解释。
- issue: 士师死后百姓行为主体的显明
  choice: 以色列人
  alternative: 他们
  rationale: 原文以复数动词承接上文的百姓；独立成节时补出“以色列人”可清楚指明主语，不改变所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“故态复萌”凝练表达反复背道；“服事”“下拜”分别保留两个敬拜动作的语义差别。脚注标记置于全节末尾，说明最后一句的希伯来语意象。
