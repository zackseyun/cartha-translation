base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: zh_hans
  text: 所以我也说：‘我必不把他们从你们面前赶出去；他们必成为你们身边的仇敌[a]，他们的诸神必成为你们的网罗。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身边的仇敌”原文直译为“侧边”；一些古译本和相似经文将其理解为“肋下的荆棘”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אָמַרְתִּי
  choice: 所以我也说
  rationale: 承接上文的责备与结果；“所以”表达语境中的承接和因果意味，“也”保留 גַם 的附加强调。
- source_word: לֹא אֲגָרֵשׁ אוֹתָם מִפְּנֵיכֶם
  choice: 我必不把他们从你们面前赶出去
  rationale: “赶出去”准确传达 גרש 在征服语境中的驱逐含义；“从你们面前”保留希伯来语的空间性表达。
- source_word: וְהָיוּ לָכֶם לְצִדִּים
  choice: 他们必成为你们身边的仇敌[a]
  rationale: 马所拉文本字面为“边、侧边”的复数。中文用“身边”保留其空间意象，用“仇敌”表达上下文中敌对、威胁的实际含义，同时以脚注交代原文难点及古译本的另一种理解。
- source_word: וֵאלֹהֵיהֶם
  choice: 他们的神明
  rationale: 这里指迦南各族受敬拜的诸神；“神明”在现代中文中自然地表达复数异教神祇，且不赋予其真实神性的判断。
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: 必成为你们的网罗
  rationale: “网罗”保留 מוקש 的捕捉器具隐喻，也传达这些神明会引诱以色列人陷入罪中的危险。
theological_decisions:
- issue: 如何处理疑难读法 לְצִדִּים
  choice: 你们身边的仇敌
  alternative: 你们肋旁的荆棘
  rationale: 所给马所拉文本读作“边、侧边”，并没有“荆棘”一词。正文不直接采用平行经文和部分古译本所支持的“肋旁的荆棘”，而以“身边的仇敌”表达此处敌对威胁的语境含义，并在脚注中保留文本上的歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必不……必成为……”保留宣告的郑重语气；引号内维持直接引语。脚注标记紧接其所说明的疑难短语。
