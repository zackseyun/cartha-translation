id: JDG.2.11
reference: Judges 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: zh_hans
  text: 以色列人[a]行雅威眼中看为恶的事，并事奉[b]诸巴力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“敬拜”；原词可指服事，也可指在敬拜中事奉。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 行
  rationale: עשה是“做、行”的常用动词；与“恶事”搭配时，现代汉语用“行”简洁自然，也保留了行为层面的含义。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这里是对以色列群体的惯用称呼；译作“以色列人”符合现代汉语，并以脚注保留字面表达。
- source_word: אֶת הָרַע
  choice: 看为恶的事
  rationale: 希伯来语字面为“那恶”；结合“在……眼中”的评价习语，译作“看为恶的事”清楚自然。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中
  rationale: 保留“在……眼中”这一希伯来语评价性隐喻，同时使整句符合汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留原文所用的专名，而不以称号代替。
- source_word: וַיַּעַבְדוּ
  choice: 事奉
  rationale: עבד可指服事，也可在宗教语境中指敬拜性服事；“事奉”保留这种语义宽度，并契合本节的偶像崇拜语境。
- source_word: הַבְּעָלִים
  choice: 诸巴力
  rationale: 原文为复数，指不同地方所尊奉的巴力；“诸巴力”明确保留复数，且比音译为单数更忠实。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并清楚表明这是专名。
- issue: עבד在偶像崇拜语境中应译为“事奉”还是“敬拜”
  choice: 事奉
  alternative: 敬拜
  rationale: 上下文确实涉及敬拜，但原词也包含服事、效忠的意义；“事奉”避免把语义范围缩窄，同时保留以色列在不同神明之间选择效忠对象的张力。
- issue: הַבְּעָלִים的复数是否应保留
  choice: 诸巴力
  alternative: 巴力众神
  rationale: “诸巴力”直接保留原文复数，又不额外断定这些名称究竟代表彼此独立的神祇，还是巴力的地方性形态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“行……眼中看为恶的事”保留希伯来语评价习语；“诸巴力”保留原文复数；脚注只说明确有根据的词义选择。
