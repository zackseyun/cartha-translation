  text: וַ/יְהִ֗י כְּ/דַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: zh_hans
  text: 雅威的使者[a]向所有以色列子孙[b]说这些话时，百姓就放声哭泣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的天使”。希伯来语 מַלְאַךְ 可指“使者”或“天使”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“所有以色列人”；原文直译为“所有以色列之子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: ……说这些话时
  rationale: 该结构以 היה 的叙事形式配合带 כְּ 的不定式，引出时间从句；译为“……时”既自然，也不擅自限定为话已说完之后。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאַךְ 可指人间或天上的“使者”；“使者”保留词义上的真实歧义，不预先断定其性质。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文所用的专有名，而不以称号替代。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: 此处 דְּבָרִים 指前述言语内容，“这些话”准确且符合现代汉语。
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: 向所有以色列子孙
  rationale: “以色列子孙”保留 בְּנֵי יִשְׂרָאֵל 的亲缘与群体表达，同时是汉语圣经语境中易懂的称谓。
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: 百姓就放声
  rationale: 希伯来语直译为“百姓举起他们的声音”，是发声哭喊的惯用语；“放声”以自然汉语传达该习语。
- source_word: וַיִּבְכּוּ
  choice: 哭泣
  rationale: בכה 表示哭、哭泣；此译保持庄重语体，不额外添加经文未明说的强度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译为“雅威”保留其作为专有名的功能。
- issue: מַלְאַךְ 的身份表达
  choice: 使者
  alternative: 天使
  rationale: 该词本身既可表示“使者”，也可按语境理解为“天使”；正文采用较宽的“使者”，并用脚注说明另一译法，以免在翻译中消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“放声哭泣”自然传达希伯来语“举起声音而哭”的习语；时间从句不加“说完”，以保留原文在动作先后关系上的开放性。
