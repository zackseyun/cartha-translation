  text: גַּם אֲנִי֙ לֹ֣א אוֹסִ֔יף לְ/הוֹרִ֥ישׁ אִ֖ישׁ מִ/פְּנֵי/הֶ֑ם מִן הַ/גּוֹיִ֛ם אֲשֶׁר עָזַ֥ב יְהוֹשֻׁ֖עַ וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: zh_hans
  text: 我也不再把约书亚死时所留下的列国中的任何一国从他们面前赶出去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在“约书亚留下”之后接着说“而他死了”。正文译为“死时”，以自然地表达其时间关系。
    reason: 保留וַיָּמֹת的形式性并列连接，同时说明正文采用时间性表达；避免脚注加入“后来”所暗示的严格先后次序。
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: 我也
  rationale: גַּם配合独立代词突出说话者，并承接上文；“我也”自然保留了这种强调和延续关系。
- source_word: לֹא אוֹסִיף לְהוֹרִישׁ
  choice: 不再……赶出去
  rationale: 否定词加יסף的使役形及不定式，表示不再继续某项行动。现代汉语用“不再……赶出去”已自然表达行动的终止，无须叠加“继续”。
- source_word: אִישׁ מִן הַגּוֹיִם
  choice: 列国中的任何一国
  rationale: אִישׁ在否定句中带有逐一、强调的意味，与部分结构מִן הַגּוֹיִם合起来表示“其中任何一个也不”，此处所指是列国，因此按汉语习惯译作“任何一国”。
- source_word: מִפְּנֵיהֶם
  choice: 从他们面前
  rationale: 保留“从……面前”的希伯来语意象，表示从以色列人所在之处被除去；与“赶出去”搭配在现代汉语中清楚自然。
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: 约书亚……留下的
  rationale: עָזַב在此指留下、未赶尽；“留下的”简洁地界定约书亚死后仍在当地的列国。
- source_word: וַיָּמֹת
  choice: 死时
  rationale: 字面是“而后他死了”。正文以时间从句表达其与“留下”之间的自然关系，使中文顺畅；脚注保留字面连接方式，避免掩盖原文句法。
theological_decisions:
- issue: 神圣说话者是否在正文中明说
  choice: 保留第一人称“我”，不增译“耶和华”
  alternative: 为明确身份而译作“我耶和华”或“耶和华说：我……”
  rationale: 本节希伯来文本只用第一人称代词，发言者身份由上下文确定；增添神名会超出本节明说的内容。
- issue: וַיָּמֹת与前句的关系
  choice: 正文采用时间关系“约书亚死时”
  alternative: 按形式直译为“约书亚留下，而后他死了”
  rationale: 原文的וַיָּמֹת形式上是“而后他死了”，语境中可自然承担时间背景。正文采用通顺的时间表达，脚注同时保留更贴近形式的译法及其可能的语气。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不再……赶出去”避免生硬重复；“列国中的任何一国”保留否定句中“连一个也不”的强调。
