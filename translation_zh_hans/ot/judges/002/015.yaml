source:
  edition: WLC
  text: בְּ/כֹ֣ל אֲשֶׁ֣ר יָצְא֗וּ יַד יְהוָה֙ הָיְתָה בָּ֣/ם לְ/רָעָ֔ה כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וְ/כַ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶ֑ם וַ/יֵּ֥צֶר לָ/הֶ֖ם מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: zh_hans
  text: 他们无论到哪里去[a]，耶和华的手都与他们为敌，以致他们遭祸；正如耶和华所说的，也正如他向他们所起的誓。他们就极其困苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们每逢出去”。这里也可能有出战或出征的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: 他们每次出征
  rationale: 该结构涵盖他们一切外出行动；上下文涉及争战，因此译作“每次出征”自然贴切，同时以脚注保留较宽泛的“每逢出去”。
- source_word: יַד יְהוָה
  choice: 耶和华的手
  rationale: 保留希伯来语以“手”表示主动权能和介入的拟人性比喻。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的音译呈现神的专名，不用称号取代。
- source_word: הָיְתָה בָם לְרָעָה
  choice: 都攻击他们，使他们遭祸
  rationale: בָם 在语境中表达敌对指向，לְרָעָה 指所带来的灾祸或伤害；此译清楚表达神主动施行不利审判，却不把 רָעָה 误解为道德上的邪恶。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: 正如耶和华所说的
  rationale: 指向耶和华先前的警告；中文“所说的”自然表达其回顾意义。
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: 也正如耶和华向他们所起的誓
  rationale: 保留 נשבע + ל 所表达的向他们起誓，不补出本节未重述的誓言内容。
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: 他们就极其困苦
  rationale: 以自然中文表达他们所陷入的严重窘迫，并以“极其”保留 מְאֹד 的强度。
theological_decisions:
- issue: 圣约审判中神的敌对行动
  choice: 耶和华的手都攻击他们，使他们遭祸
  alternative: 耶和华的手降祸与他们／耶和华的手加害他们
  rationale: 译文保留耶和华主动施行审判的力度，也用“遭祸”表达灾难性后果，避免暗示神行道德意义上的恶，不消解原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“出征”契合士师记的军事语境，脚注则保留原短语较宽泛的可能性；保留“耶和华的手”这一重要希伯来语意象。
