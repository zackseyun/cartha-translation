  text: וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: zh_hans
  text: 约书亚，嫩的儿子、耶和华的仆人[a]，死了，享年一百一十岁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴仆”。这里是约书亚的尊称，表明他归属并事奉耶和华。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该词是מות的Qal连续式，推进叙事中的下一事件；现代汉语以“死了”自然表达完成的事件，句首连接关系可由上下文承接，无须机械译出“于是/并且”。
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: 嫩的儿子约书亚
  rationale: 按现代中文圣经人名惯例，将专名译作“约书亚”和“嫩”；בִּן נוּן是表示亲子关系的结构，译作“嫩的儿子”。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: עֶבֶד可指仆人或奴仆；此处作为约书亚与耶和华关系中的尊称，“仆人”既自然庄重，也保留其服属、事奉的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式“耶和华”表达四字神名，而不以“主”这一称号替代。
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 享年一百一十岁
  rationale: 希伯来语直译为“是一百一十岁之子”，是年龄习语；因句中叙述其死亡，现代汉语用“享年一百一十岁”准确、简洁且庄重。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。中文正文采用广为人知且具专名功能的“耶和华”，避免以一般称号“主”取代；“雅威”是另一种较贴近学术重构发音的译写。
- issue: 约书亚称号中עֶבֶד的译法
  choice: 仆人
  alternative: 奴仆；奴隶
  rationale: 该词语义涵盖受役使者、奴仆和臣仆。此处构成对约书亚的尊称，重点在于他归属并忠心事奉耶和华，而非凸显其社会法律身份；故正文译“仆人”，脚注保留“奴仆”这一可能表达。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“耶和华的仆人”置于姓名前，既贴合汉语称谓习惯，也保留原文同位称号。“享年”适用于死者年龄，避免照搬希伯来语年龄结构。
