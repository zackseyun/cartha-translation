  text: וְ/גַם֙ כָּל הַ/דּ֣וֹר הַ/ה֔וּא נֶאֶסְפ֖וּ אֶל אֲבוֹתָ֑י/ו וַ/יָּקָם֩ דּ֨וֹר אַחֵ֜ר אַחֲרֵי/הֶ֗ם אֲשֶׁ֤ר לֹא יָֽדְעוּ֙ אֶת יְהוָ֔ה וְ/גַם֙ אֶת הַֽ/מַּעֲשֶׂ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: zh_hans
  text: 那一代人也都归到他们列祖那里[a]。在他们之后，又兴起了另一代人；他们不认识耶和华[b]，也不知道他为以色列所做的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“被收聚到他们的列祖那里”，是表示死亡、归于先祖的惯用语。
    reason: cultural_note
  - marker: b
    text: 或译“不承认耶和华”。原文的“认识”不仅可指知道事实，也可包含关系上、经验上或圣约意义上的认识。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: 那一代人也都
  rationale: 保留 וְגַם 的承接和增补意味；כָּל 修饰整代人，汉语以“都”自然表达整体范围。
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: 归到他们列祖那里
  rationale: 尽量保留希伯来语关于死亡并归于先祖的固定表达，同时用现代汉语可理解的句式呈现。
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: 在他们之后，又兴起了另一代人
  rationale: “兴起”保留 קום 描写新一代出现的叙事色彩；“另一代人”表达 אַחֵר 所指的不同且后继的一代。
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: 他们不认识耶和华
  rationale: “认识”可兼含事实上的认知、经验性的认识及关系或圣约层面的承认，不把原文的宽广含义缩减为单纯“不知道”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确呈现专名而不以“主”替代。
- source_word: וְגַם אֶת הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: 也不知道他为以色列所做的事
  rationale: 在否定语境中用“也不知道”自然承接第二个宾语；מַעֲשֶׂה 译为“所做的事”，可概括上帝的作为；לְ 按上下文取受益意义“为”。
theological_decisions:
- issue: “不认识耶和华”的含义
  choice: 正文保留“认识”的宽泛含义
  alternative: 译作“不承认耶和华”或“不了解耶和华”
  rationale: ידע 在此既可能涉及对耶和华及其作为的实际认知，也可能涉及关系和圣约忠诚。正文不将其限定为纯粹知识缺失或公开背道。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 使用简体中文普通读者最熟悉的专名形式，并保留原文将神名作为专名使用的特点。
- issue: לְיִשְׂרָאֵל 的关系
  choice: 为以色列
  alternative: 向以色列；对以色列
  rationale: 上下文回顾耶和华拯救性的作为，受益义最合适；同时不把该短语误读为针对以色列的敌对行动。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“归到他们列祖那里”有意保留原文的代际意象，并以脚注说明其死亡委婉语性质；“认识”保留词义和神学张力。
