  terminology: “耶和华”“士师”“兴起”“同在”“从仇敌手中拯救”等术语一致且符合中文圣经语境。“动了怜悯之心”忠实传达 יִנָּחֵם 在此处的怜悯性回应；脚注恰当保留“回心转意”及“怜悯”的词义可能性，而不将其武断处理为道德意义上的悔罪。
