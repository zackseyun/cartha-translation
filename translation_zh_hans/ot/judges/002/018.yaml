  source_fidelity: 译文准确呈现了重复性的时间结构（“每逢”）、耶和华兴起士师、与士师同在、在士师存世期间从仇敌手中拯救以色列，以及因百姓在压迫者与逼迫者之下的哀号而产生怜悯。 “那士师在世的日子”是对 כָּל־יְמֵי הַשֹּׁפֵט 自然而忠实的表达，未不当地把其限定为正式任期。
