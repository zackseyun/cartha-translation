id: JDG.2.18
reference: Judges 2:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: zh_hans
  text: 每逢耶和华为他们兴起士师，耶和华就与那士师同在；那士师在世的日子，耶和华都从仇敌手中拯救他们。因为他们受那些欺压、逼迫他们的人折磨而哀号，耶和华便动了怜悯之心[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华回心转意”或“耶和华怜悯他们”。希伯来语动词既可表示态度有所转变，也可表示因怜悯而作出回应。
    reason: 保留 יִנָּחֵם 的词义幅度及其神学张力。
lexical_decisions:
- source_word: וְכִי
  choice: 每逢
  rationale: 本节处于概述以色列反复经历的语境中，表示每当某种情况发生，而非仅指一次事件。
- source_word: הֵקִים
  choice: 兴起
  rationale: 保留希伯来语的动词意象，并清楚表达士师出于耶和华的主动作为。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的形式音译神的专名，不用表示称号的“主”替代。
- source_word: שֹׁפְטִים
  choice: 士师
  rationale: 这是《士师记》中对此类领袖的通行中文名称；其拯救者职能由下文另行表达。
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: 耶和华就与那士师同在
  rationale: 直接表达神的临在和扶助，不额外解释这种同在的具体方式。
- source_word: וְהוֹשִׁיעָם
  choice: 拯救他们
  rationale: 使役形在此指解救；后面的“从仇敌手中”进一步说明所脱离的危险。
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: 从仇敌手中
  rationale: 保留希伯来语具体而易懂的“手中”意象，表示脱离仇敌的权势和控制。
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: 那士师在世的日子
  rationale: 自然表达该士师一生中发挥作用的时期，同时保留“日子”的叙事用语。
- source_word: יִנָּחֵם
  choice: 便动了怜悯之心
  rationale: 此处表示耶和华面对百姓的哀号而产生怜悯、作出回应；“动了”也保留希伯来语所含的回应性和态度转变色彩。
- source_word: מִנַּאֲקָתָם
  choice: 因为……哀号
  rationale: 介词在此说明耶和华怜悯他们的缘由或契机。
- source_word: לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: 那些欺压、逼迫他们的人
  rationale: 两个主动分词均指持续加害于以色列的人；并列译出，以保留原文的双重描述。
theological_decisions:
- issue: 神的专名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文保留专名，并采用现代简体中文圣经语境中最广为普通读者识别的形式。
- issue: יִנָּחֵם 所含的神人同形性语言
  choice: 耶和华便动了怜悯之心
  alternative: 耶和华回心转意；耶和华怜悯他们
  rationale: 正文保留神因百姓受苦哀号而作出情感性回应的力度，却不把该词解释成神为道德过错悔罪；脚注列出“回心转意”，以保存原词可能具有的态度转变含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“每逢……就……”呈现本段概述中的反复模式；“兴起士师”“从仇敌手中”等保留读者能够理解的经文意象。脚注标记置于所解释的“动了怜悯之心”之后。
