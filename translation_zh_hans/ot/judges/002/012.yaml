source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: zh_hans
  text: 他们离弃了雅威——他们祖先的上帝，就是那位领他们出埃及地的；他们追随别神，即周围各族的神中的一些[a]，向它们下拜，惹雅威发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“周围各族的神。”原文的介词可理解为“……中的一些”，也可较一般地指周围各族所敬奉的神。
    reason: 保留介词 מִן 在此处可按部分关系或较宽泛来源、归属关系理解的可能性。
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: 离弃
  rationale: עָזַב在这里表示背弃与雅威的关系，不只是从某处离开。“离弃”自然、庄重，也保留了盟约关系破裂的意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留经文所用的专名，而不以称号代替。
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: 他们祖先的上帝
  rationale: “祖先”以现代汉语自然表达复数אֲבוֹת，既涵盖历代先祖，也保留以色列历史与信仰传承的语境。
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: 就是那位领他们出埃及地的
  rationale: 带冠词的分词短语用于说明雅威的身份；“那位……的”保留其修饰功能，“领……出”准确呈现出埃及行动。
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: 他们追随
  rationale: 该习语表示跟从并效忠；“追随”在现代汉语中自然，并保留主动转向其他神明的含义。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别神
  rationale: 直译“其他的神”；“别神”简洁且符合中文圣经语体，不额外解释为外族神。
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: 就是周围各族的神中的一些
  rationale: 将介词מִן理解为部分关系，表明他们追随的别神出自周围各族的诸神；同时用脚注保留较宽泛的句法理解。
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: 向它们下拜
  rationale: 保留动词“俯伏、下拜”的具体动作；在此语境中敬拜偶像的意义清楚，无须直接改写为抽象的“敬拜”。
- source_word: וַיַּכְעִסוּ אֶת־יְהוָה
  choice: 惹雅威发怒
  rationale: 准确表达כעס使役形的致使意义，即他们的行为激起雅威的怒气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留专名性质，不以“主”这一称号替换。
- issue: 以色列背道的盟约含义
  choice: 以“离弃、追随、下拜、惹……发怒”保留原文的关系性与道德张力
  alternative: 在正文中直接增译为“违背盟约”
  rationale: 原文通过一连串行动呈现背道及其严重性，却没有在本节明说“违背盟约”；因此不加入解释性术语。
- issue: מִן所表达的关系
  choice: 正文按部分关系译为“神中的一些”，脚注保留较一般的理解
  alternative: 直接译为“周围各族的神”
  rationale: 部分关系符合句法和上下文，但介词短语也可较宽泛地说明这些别神属于周围各族，因此不应消除这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“雅威”保留神名，“上帝”用于以色列祖先的上帝，“神”用于异教诸神，以语境区分所指。破折号和分号帮助呈现原文较长句子的层次；脚注标记放在真正存在词义与句法分歧的短语之后。
