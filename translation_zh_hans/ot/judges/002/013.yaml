base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: zh_hans
  text: '他们离弃[a]雅威，事奉[b]巴力和众亚斯她录[c]。


    [a] “离弃”也可译作“抛弃”。

    [b] “事奉”在这里也可译作“敬拜”。

    [c] “亚斯她录”是希伯来语的复数形式，可能指亚斯她录女神的多个地方形态或神像；这位女神也称亚斯她特或阿斯塔特。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离弃”也可译作“抛弃”。
    reason: lexical_alternative
  - marker: b
    text: “事奉”在这里也可译作“敬拜”。
    reason: lexical_alternative
  - marker: c
    text: “亚斯她录”是希伯来语的复数形式，可能指亚斯她录女神的多个地方形态或神像；这位女神也称亚斯她特或阿斯塔特。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: 离弃
  rationale: עזב意为离开、舍弃或抛弃。“离弃”是自然庄重的现代汉语，也能传达以色列背弃雅威的关系性含义，而不额外加入解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以“主”这一称号代替。
- source_word: וַיַּעַבְדוּ
  choice: 事奉
  rationale: עבד既可指服事，也可在宗教语境中指敬拜。“事奉”保留较宽的语义范围；宾语是异教神祇，足以显明这里的宗教含义。
- source_word: לַבַּעַל
  choice: 巴力
  rationale: 希伯来语虽带冠词，但“巴力”在现代汉语中自然地作为神名使用；译作“那巴力”会显得生硬，并可能过度直译冠词。
- source_word: וְלָעַשְׁתָּרוֹת
  choice: 众亚斯她录
  rationale: עשתרות在形态上是复数。“众”明确保留原文复数，音译“亚斯她录”则避免把它无声地化约为单一女神名称。
theological_decisions:
- issue: עשתרות的复数如何表达
  choice: 众亚斯她录
  alternative: 亚斯她录女神／亚斯她特
  rationale: 原文明确使用复数，因此正文不把它解释成单数。这个复数可能指该女神的多个地方形态、神像，或同类神祇；脚注说明可能性而不强行裁定。
- issue: 异教语境中עבד的宗教含义
  choice: 事奉
  alternative: 敬拜
  rationale: “事奉”较贴近原词的宽广语义，同时在巴力和亚斯她录作为宾语的语境中自然包含敬拜之意，避免把原文较宽的动词缩窄。
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 正文保留神的专名性质，以音译“雅威”呈现，而不改用称号；这也使以色列离弃其神而事奉别神的对比保持鲜明。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“离弃”与“事奉”保留经文的关系性和宗教语境；“众亚斯她录”略带陌生感，但这是为准确保留希伯来语复数，相关背景由脚注补足。
