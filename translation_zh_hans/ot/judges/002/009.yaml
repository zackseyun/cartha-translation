  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: zh_hans
  text: 他们把他葬在他所承受的产业境内，就是以法莲山区、迦实山以北的亭拿·希烈[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约书亚记24:30此处作“亭拿·西拉”，而不是“亭拿·希烈”。这里保留两段平行安葬记载中的地名差异。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 他们把他葬在
  rationale: 未完成式连续体推进过去时叙事；אֹתוֹ明确指前文的约书亚。用“把”字句符合现代汉语叙事习惯。
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: 在他所承受的产业境内
  rationale: גְּבוּל在此表示疆界以内的地域，而非单指边界线；נַחֲלָה指分得并承受的土地产业。“所承受的产业”保留其土地承受之意。
- source_word: בְּתִמְנַת חֶרֶס
  choice: 亭拿·希烈
  rationale: 按专名音译，并以间隔号清楚区分复合地名的两个成分。
- source_word: בְּהַר אֶפְרָיִם
  choice: 以法莲山区
  rationale: 此处הַר אֶפְרָיִם是区域性地理名称，指以法莲的山地，而非一座名为“以法莲山”的单独山峰。
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: 在迦实山以北
  rationale: מִצְּפוֹן与后接地点共同表达相对方位；“在……以北”准确而自然。גָּעַשׁ作为山名音译为“迦实”。
