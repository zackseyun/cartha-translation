language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: zh_hans
  text: 耶和华的使者[b]从吉甲上到波金[a]，说：“我把你们从埃及领上来，带进我向你们列祖起誓的那地。我也说过：‘我永远不会违背我与你们所立的约。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “波金”可能意为“哭泣的人”，也可能指“哭泣之地”。
    reason: cultural_note
  - marker: b
    text: “使者”也可译作“天使”。本节没有明确说明这位使者的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ 可指“使者”或“天使”。本节让这位使者直接以神的第一人称说话；译作“使者”既自然，也不预先断定其本体身份。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神名音译“耶和华”，使其有别于称号“主”。
- source_word: וַיַּעַל
  choice: 上到
  rationale: 保留 עלה 的上行方向意味，同时符合中文叙事表达。
- source_word: הַגִּלְגָּל
  choice: 吉甲
  rationale: 按中文圣经惯例音译该地名。
- source_word: הַבֹּכִים
  choice: 波金
  rationale: 将其作为地名音译，并在脚注说明其可能的词义。
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: 我把你们从埃及领上来
  rationale: 虽然 אַעֲלֶה 形式上是不完成式，但下文与整体语境是在回顾已经成就的拯救行动，因此按过去意义处理；“领上来”也保留 עלה 的用词。
- source_word: וָאָבִיא אֶתְכֶם
  choice: 带进
  rationale: בוא 的使役式表达“使进入、带进”，目的地由后面的“这地”说明。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 定冠词所指的是以色列已经进入、并由神向列祖起誓应许之地；“这地”在中文语境中指向清楚。
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: 我向你们列祖起誓应许的
  rationale: “列祖”准确保留阳性复数及族长之约的历史语境；补出“应许”使“向列祖起誓”与“这地”的修饰关系在现代中文中清楚。
- source_word: וָאֹמַר
  choice: 我曾说
  rationale: 表示先前作出的宣告，顺畅衔接后面的直接引语。
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: 我永远不会违背我与你们所立的约
  rationale: הפר 在约的语境中可指破坏、废除或违背；“违背……约”是自然且准确的现代中文表达，לְעוֹלָם 译为“永远不会”。
theological_decisions:
- issue: מַלְאַךְ יְהוָה 的身份
  choice: 正文译作“耶和华的使者”，不说明他是受造天使还是耶和华的显现。
  alternative: 可译作“耶和华的天使”，并可能被理解为受造天使；也可能解释为耶和华自己的显现。
  rationale: 原文称其为耶和华的使者，却让他用神的第一人称陈述救赎和立约行动。译文保留这种神学张力，不在正文中替读者作本体论判断。
- issue: 神与以色列所立之约的持续性
  choice: 按原文直译神的宣告：“我永远不会违背我与你们所立的约。”
  alternative: 可把后续审判叙事读成对此承诺附加条件，或解释为废除该约。
  rationale: 本节的 לֹא ... לְעוֹלָם 是强烈而持续的否定；译文不借后文预先削弱或重新界定这一宣告。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“领上来—带进”保留原文两个连续动词及出埃及叙事中的方向感；用“列祖”保持盟约历史语境。脚注标记均置于正文相关位置。
