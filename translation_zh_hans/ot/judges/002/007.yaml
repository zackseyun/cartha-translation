  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: zh_hans
  text: 百姓在约书亚的一生中，以及在那些比约书亚活得更久的长老的一生中，都事奉雅威；这些长老曾看见雅威为以色列所成就的一切伟大作为[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伟大作为”：希伯来文也可译作“伟大的工作”、“大事”或“伟大的行动”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: 事奉
  rationale: עבד以雅威为宾语时，表示在盟约忠诚中服事他，涵盖敬拜但不限于礼仪性的崇拜；“事奉”保留了这一宽度。
- source_word: הָעָם
  choice: 百姓
  rationale: 这里指以色列的盟约群体；“百姓”是自然且符合圣经叙事语体的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，以常见的现代汉语音译“雅威”保留其专名性质，而不以称号替代。
- source_word: כֹּל יְמֵי
  choice: 有生之日
  rationale: 该习语表示某人一生或仍在世的全部时期；“有生之日”在现代汉语中自然、庄重。
- source_word: הַזְּקֵנִים
  choice: 长老
  rationale: 此词在以色列社会中通常指受承认的年长领袖；“长老”兼顾其词义和社会职分。
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: 在约书亚死后仍然健在
  rationale: 原文直义为“在约书亚之后延长日子”，即比约书亚活得更久；汉语补出“死后”，清楚表达时间关系而不改变含义。
- source_word: רָאוּ
  choice: 曾亲眼看见
  rationale: “曾”体现先前经历；“亲眼”自然传达这些长老作为见证者的含义，但不把“看见”弱化为仅仅听闻。
- source_word: כָּל מַעֲשֵׂה יְהוָה הַגָּדוֹל
  choice: 雅威……所成就的一切大作为
  rationale: מַעֲשֵׂה为单数集合名词，可概括雅威全部伟大行动；汉语“一切大作为”自然保留其集合意义。
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: 为以色列所成就
  rationale: 介词ל在此表示受益对象，即雅威为以色列的益处而行；“为……所成就”表达清楚。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列之神盟约名字的专名性质，不以头衔替代。
- issue: עבד 所表达的忠诚范围
  choice: 事奉
  alternative: 敬拜
  rationale: 该动词在此包括对雅威的敬拜，也包含更广泛的盟约忠诚；“事奉”避免将含义收窄为礼仪活动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“有生之日”避免生硬直译“所有日子”；分号保留原句中长老亲历雅威作为与百姓持续事奉之间的紧密联系。脚注标记已置于“大作为”之后，因为其内容实际对应 מַעֲשֵׂה הַגָּדוֹל，而非“约书亚”。
