source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: zh_hans
  text: 然而，他们连自己的士师也不听从，因为他们随从别的神行淫[a]，并向它们跪拜。他们很快偏离了他们祖先所走的道路，就是听从耶和华诫命的道路；他们没有这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从别的神行淫”也可译为“随从别的神，如妓女般行淫”。原文以性关系中的不忠比喻拜偶像和背弃盟约。
    reason: 说明希伯来语 זנה 用于随从别神时所保留的强烈性不忠隐喻及其盟约含义。
lexical_decisions:
- source_word: וְגַם אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: 然而，他们连自己的士师也不听从
  rationale: וְגַם在上下文中兼有转折和加强语气；“连……也”体现强调。שׁמע אֶל在这里指听而顺从，译作“不听从”自然准确；“士师”保留本时期特有的历史称谓。
- source_word: כִּי זָנוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: 反而追随别的神，行淫背约
  rationale: כִּי在此可解释前述悖逆的表现或原因；结合汉语行文译为“反而”。זנה是以性不忠描写拜偶像及背弃盟约；“行淫背约”保留强烈隐喻，又点明其盟约含义。“追随”对应אַחֲרֵי，保留追从其他神的意象。
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: 并向那些神跪拜
  rationale: 该动词本义是俯伏、下拜，在此具有敬拜含义；“跪拜”保留身体动作及宗教意味。明确译为“那些神”可避免汉语代词指向含混。
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: 他们很快就偏离了……道路
  rationale: 保留“转离道路”的行为隐喻，并以“很快就”表达מַהֵר的迅速意味。
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם
  choice: 他们祖先所走的道路
  rationale: 以“祖先”自然表达אבותם在群体历史语境中的先辈，同时保留“走道路”的隐喻。
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: 听从耶和华的诫命
  rationale: שׁמע与“诫命”连用表示听命、遵从；“听从”既保留听的词义联系，也表达服从。יהוה音译为“耶和华”，作为现代简体中文圣经语域中广为人知的神名形式。
- source_word: לֹא עָשׂוּ כֵן
  choice: 他们却没有这样做
  rationale: 直译结尾的对照判断，所指是没有像祖先那样听从耶和华的诫命。
theological_decisions:
- issue: זָנוּ用于偶像崇拜和盟约不忠的性隐喻
  choice: 行淫背约
  alternative: 背信弃义／不忠
  rationale: 原文刻意使用带有道德冲击力的性不忠隐喻。仅译“不忠”会削弱该意象；加“背约”则帮助现代读者理解隐喻指向，而不把偶像崇拜与盟约背叛割裂。
- issue: 神名יהוה的中文表达
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文读者最熟悉且明确作为专名的“耶和华”，不以称号替换原文神名。
- issue: לִשְׁמֹעַ מִצְוֺת יְהוָה与“道路”从句的关系
  choice: 以分号拆开并复述主语：“他们的祖先听从……，他们却……”
  alternative: “偏离了他们祖先因听从耶和华的诫命而走的道路”
  rationale: 原文可理解为祖先所走之道以听从诫命为特征。拆句可在自然汉语中保存这一修饰关系和末句对照，避免误解为祖先只是为了日后听从诫命而走这条路。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“士师”“诫命”“耶和华”保留必要的圣经历史与神学用语；句式适度拆分，使末尾祖先与当代人的对照清楚。脚注标记置于与其内容最相关的“行淫背约”之后。
