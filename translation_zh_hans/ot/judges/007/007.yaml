    issue: 末句‘回自己的地方去’加入了原文未明说的‘返回’语义。
    rationale: לִמְקֹמוֹ意为‘到他自己的地方’，可指回归，也可泛指前往；译作‘到各自的地方去’能保留原文的开放性。
  - severity: low
    issue: ‘其余所有人’表达稍显冗余。
    rationale: 在三百人留在基甸身边的语境下，‘其余的人’已足够明确地指未被选中的人，也更符合自然现代汉语。
  revised_text: 耶和华对基甸说：“我要凭着这三百个用舌头舔的人[a]拯救你们，把米甸交在你手中。其余的人都要各自到自己的地方去。”
  revised_footnotes:
