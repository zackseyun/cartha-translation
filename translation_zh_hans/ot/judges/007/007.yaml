  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן בִּ/שְׁלֹשׁ֩ מֵא֨וֹת הָ/אִ֤ישׁ הַֽ/מֲלַקְקִים֙ אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וְ/נָתַתִּ֥י אֶת מִדְיָ֖ן בְּ/יָדֶ֑/ךָ וְ/כָל הָ/עָ֔ם יֵלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: zh_hans
  text: 耶和华对基甸说：“我要凭着这三百个用舌头舔的人[a]拯救你们，把米甸交在你手中。其余的人都要各自到自己的地方去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭着这三百个用舌头舔的人”也可译作“借着这三百个用舌头舔的人”。
    reason: 介词 בְּ 表示施行拯救所凭借的手段；“凭着”和“借着”都能表达这一工具性含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的专名形式来呈现四字神名，避免以“主”替代原文中的专名。
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: 凭着这三百个……的人
  rationale: 介词 בְּ 在此表示手段；“凭着”既自然，也保留上帝借这特定群体施行拯救的含义。
- source_word: הַמֲלַקְקִים
  choice: 用舌头舔的人
  rationale: 保留原文用于辨认这群人的具体动作，不在正文补出本节未重复出现的宾语“水”；“用舌头”则使中文动作表达清楚，并与上文相衔接。
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: 拯救你们
  rationale: ישׁע 的使役形在此兼有从敌军手中解救和使人得胜之意；“拯救”保留这种军事与神学层面的宽度。代词后缀为复数，因此译作“你们”。
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: 把米甸交在你手中
  rationale: 保留希伯来语“交在某人手中”这一表示授予制胜权和控制权的惯用表达；“你”依原文为指向基甸的单数。
- source_word: וְכָל הָעָם
  choice: 其余所有人
  rationale: הָעָם 字面为“众人/人民”，在语境中指未被选入三百人的部队；补出“其余”是汉语中必要的语境明示，避免误解为连三百人也要离开。
- source_word: יֵלְכוּ אִישׁ לִמְקֹמוֹ
  choice: 都要各自回自己的地方去
  rationale: 未完成式在此具有命令或指示语气；“都要”传达这一力量。“各自……自己的”保留 אִישׁ 的逐一分配含义，而“地方”不把原文具体化为“家”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，故不用“主”取代。中文正文采用广为通行且具有专名性质的“耶和华”；“雅威”是较接近学界重构发音的另一可行音译。
- issue: אוֹשִׁיעַ 的军事与神学含义
  choice: 拯救
  alternative: 解救／使……得胜
  rationale: 本节语境是从米甸军队手中获救，但该动词本身不只表示战术上的取胜；“拯救”保留原词较宽的意义，不把它缩减为单纯“击败敌军”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“交在你手中”这一在中文中仍可理解的圣经惯用语，并以复数“你们”和单数“你”分别反映希伯来语对象的数。正文不重复补出“水”，以尊重本节措辞，同时用“用舌头舔的人”保证脱离希伯来语结构后仍可读。
