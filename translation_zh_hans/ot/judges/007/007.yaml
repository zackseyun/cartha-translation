revisions:
- from: 耶和华对基甸说：“我要凭着这三百个用舌头舔的人[a]拯救你们，把米甸交在你手中。其余所有人都要各自回自己的地方去。”
  to: 耶和华对基甸说：“我要凭着这三百个用舌头舔的人[a]拯救你们，把米甸交在你手中。其余的人都要各自到自己的地方去。”
  rationale: 仅作两项低风险修订：以‘其余的人’消除‘其余所有人’的冗余，并将‘回自己的地方去’改为‘到自己的地方去’，避免把原文未限定的移动方向具体化为返回。其余措辞、神名、代词数及脚注均可保留。
