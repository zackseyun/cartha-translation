translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“半夜更次”保留古代夜间值更的文化背景；短句呈现突袭行动的迅速节奏。脚注说明可行异译与号角的文化含义，不把“布置守卫”擅自解释为原文未明说的换岗。
