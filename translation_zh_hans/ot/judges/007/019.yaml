base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: zh_hans
  text: 基甸和同他在一起的一百人，在中更刚开始时来到营地边缘；那时，营中的人刚刚安排好守卫。他们吹响号角，砸碎手中的罐子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: 来到营地边缘
  rationale: קָצֶה表示尽头、边缘；结合表示移动的וַיָּבֹא，译作“来到营地边缘”既保留空间意义，也符合现代汉语表达。
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: 在半夜更次刚开始时
  rationale: רֹאשׁ在这里指一段时间的开头；אַשְׁמֹרֶת是夜间的值更时段，הַתִּיכוֹנָה意为“中间的”。“半夜更次”自然传达夜间中段的值更，但不把它硬性等同于某一套固定计时制度。
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: 那时，守卫刚刚布置好
  rationale: אַךְ在此突出时间上的紧接；הָקֵם与הֵקִימוּ构成不定式绝对式加限定动词，强调“设立、安排”守卫这一动作。“刚刚布置好”兼顾即时性和强调意味，同时不增添原文未明说的“换岗”。
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: 他们吹响号角
  rationale: שׁוֹפָר是用于发声和传递信号的角号，通常由兽角制成。“号角”比现代金属“喇叭”更贴近实物和古代场景。
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: 砸碎……罐子
  rationale: נפץ表达猛烈击破、打碎；כַּד是盛装用的罐或坛。“砸碎……罐子”准确传达突然且有力的动作，而不在正文中补入原文没有明说的材质。
- source_word: אֲשֶׁר בְּיָדָם
  choice: 手中的
  rationale: 这是“在他们手里”的自然汉语表达，清楚说明罐子正由众人拿着。
