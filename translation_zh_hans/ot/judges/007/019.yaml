    rationale: אֲשֶׁר אִתּוֹ 的意思是“与他同在/同他一起”，并不表达“跟随”所可能带有的追随或从属意味。
  - severity: medium
    issue: “守卫刚刚布置好”
    rationale: 原文的动词复数表示有人刚刚设立、安排守卫；被动式中文既弱化施事，也使“布置守卫”不够自然。上下文可明确为营中之人，而不改变经文意义。
  - severity: low
    issue: 脚注 c 称 shofarot 传统上常译作“号筒”
    rationale: 这不够准确；shofar 是兽角制成的信号角，常见的中文对应是“号角”或“角”。
