base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: zh_hans
  text: 他的同伴回答说：“这无非是约阿施的儿子、以色列人基甸的刀[a]！上帝已经把米甸和整个军营交在他手中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这不是别的，正是约阿施的儿子、以色列人基甸的刀。”
    reason: lexical_alternative
  - marker: b
    text: “交在他手中”是希伯来语惯用说法，意思是交在他的权力或控制之下。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: 他的同伴回答说
  rationale: 保留希伯来叙事中“回答并说”的对话公式，同时用现代汉语自然表达；רֵעֵהוּ 在军营语境中译作“他的同伴”比“他的朋友”更合适。
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: 这无非是
  rationale: 该排他性表达强调梦的含义绝不是别的；“无非是”既简洁自然，也保留断定语气。
- source_word: חֶרֶב גִּדְעוֹן
  choice: 基甸的刀
  rationale: 直译象征性意象“刀”，不把它解释性改写为基甸本人或他的军队。
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ אִישׁ יִשְׂרָאֵל
  choice: 约阿施的儿子、以色列人基甸
  rationale: 保留父称和 אִישׁ יִשְׂרָאֵל 对基甸的身份说明；汉语采用同位修饰结构，以避免冗长。
- source_word: נָתַן הָאֱלֹהִים
  choice: 上帝已经把
  rationale: 希伯来语完成式在解梦语境中表达事情已然确定；“已经”传达这一确定感，而不额外界定其时间。
- source_word: בְּיָדוֹ
  choice: 交在他手中
  rationale: 保留希伯来语“交在某人手中”的惯用意象，同时现代汉语也能自然理解为置于其权下。
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: 米甸和全营
  rationale: “米甸”在此指敌对群体；“全营”简明保留 כָּל 的整体性及 מַחֲנֶה 的营地、军营含义。
theological_decisions:
- issue: אִישׁ יִשְׂרָאֵל 的身份表达
  choice: 以色列人基甸
  alternative: 基甸这个以色列男子
  rationale: 原文阳性单数 אִישׁ 在这里明确指基甸，但现代汉语“以色列人”已自然指明其族群身份；增加“男子”会显得生硬，且上下文中的男性身份并未被抹去。
- issue: נָתַן 的完成体与确定性
  choice: 已经把……交在
  alternative: 把……交在了
  rationale: 说话者依据梦作出笃定宣告。“已经”保留行动被视为已确定、已成定局的语气，同时不将此处过度解释为特定的预言完成时神学范畴。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这无非是”保留解梦者强烈而确定的判断；正文保留“刀”和“手中”两个希伯来意象，并用脚注解释后者。标点服务于现代汉语朗读，但不消解原文中“基甸的刀”作为梦象解释所具有的张力。
