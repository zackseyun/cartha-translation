base_translation:
  language: en
  yaml_path: translation/ot/judges/007/021.yaml
  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: zh_hans
  text: 各人都站在自己的位置上，围在营地四周；全营的人都奔跑起来，喊叫[a]，并逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “喊叫”或译“发出呐喊”。这个动词既可指战斗中的呐喊，也可指惊慌时的大叫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: 站
  rationale: עמד表示站立或站定；结合战斗场景，“站在自己的位置上”自然地表达各人坚守所处位置。
- source_word: אִישׁ תַּחְתָּיו
  choice: 各人都……在自己的位置上
  rationale: 这是分配性习语，意为每个人各在原位；如此翻译既保留אִישׁ的逐人意味，也避免直译造成误解。
- source_word: סָבִיב לַמַּחֲנֶה
  choice: 围在营地四周
  rationale: סָבִיב与介词ל表示处在营地周围；“围在……四周”符合现代汉语，也清楚呈现空间关系。
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: 全营的人都奔跑起来
  rationale: רץ通常表示奔跑；“全营的人”按汉语习惯明确“营”转指营中众人，同时不把混乱奔逃的情形解释得过细。
- source_word: וַיָּרִיעוּ
  choice: 喊叫
  rationale: רוע/ריע可指高声呼喊、战斗呐喊或惊慌叫喊；采用宽泛的“喊叫”，保留语境中的真实歧义。
- source_word: ויניסו
  choice: 逃跑了
  rationale: 按马所拉文本的辅音及语境理解为נוס“逃跑”；“逃跑”是现代汉语中直接、自然的对应表达。
