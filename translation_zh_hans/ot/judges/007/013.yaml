  text: וַ/יָּבֹ֣א גִדְע֔וֹן וְ/הִ֨נֵּה אִ֔ישׁ מְסַפֵּ֥ר לְ/רֵעֵ֖/הוּ חֲל֑וֹם וַ/יֹּ֜אמֶר הִנֵּ֧ה חֲל֣וֹם חָלַ֗מְתִּי וְ/הִנֵּ֨ה צלול לֶ֤חֶם שְׂעֹרִים֙ מִתְהַפֵּךְ֙ בְּ/מַחֲנֵ֣ה מִדְיָ֔ן וַ/יָּבֹ֣א עַד הָ֠/אֹהֶל וַ/יַּכֵּ֧/הוּ וַ/יִּפֹּ֛ל וַ/יַּהַפְכֵ֥/הוּ לְ/מַ֖עְלָ/ה וְ/נָפַ֥ל הָ/אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: zh_hans
  text: 基甸来到的时候，只见有一个人正在把一个梦讲给同伴听。他说：“看哪，我做了一个梦：只见一个圆形的大麦饼[a]在米甸营中翻滚，滚到那座帐篷那里，撞击帐篷，帐篷就倒下；那饼又把帐篷翻了个底朝天，帐篷便倒下了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圆形的大麦饼”：或译“大麦面包”或“一块大麦饼”。这里译作“圆形的”的希伯来词十分罕见，可能指圆形的饼或面包。
    reason: 保留罕见词צלול在物品类别和形状上的词义不确定性。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 基甸来到的时候
  rationale: 连续式叙事动词推进情节；用“……的时候”自然交代基甸来到与他听见讲梦之间的时间关系。
- source_word: וְהִנֵּה
  choice: 只见／看哪
  rationale: 该词提示突然注意或增强画面感；叙述中译为“只见”，直接引语中译为“看哪”，符合现代汉语各自的语境。
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  choice: 正在把一个梦讲给同伴听
  rationale: 分词表示正在进行的动作；“同伴”适合军营语境，又不把关系过度限定为亲密朋友。
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: 看哪，我做了一个梦
  rationale: 保留提示注意的语气；汉语“做了一个梦”自然表达希伯来语同源宾语结构，无须生硬重复。
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: 一个圆圆的大麦饼
  rationale: צלול是罕见词，可能指圆形的饼或面包；“圆圆的大麦饼”既传达可能的形状，也适合随后翻滚的画面，词义不确定性另以脚注说明。
- source_word: מִתְהַפֵּךְ בְּמַחֲנֵה מִדְיָן
  choice: 在米甸营中翻滚
  rationale: 自反词干表达不断翻转或滚动，介词ב按通常意义译为“在……中”，不额外加入“进入”的方向含义。
- source_word: וַיָּבֹא עַד הָאֹהֶל
  choice: 滚到一座帐篷那里
  rationale: עַד表示运动达到某一点；承接前文的饼，用“滚到……那里”在汉语中清楚自然。
- source_word: וַיַּכֵּהוּ וַיִּפֹּל
  choice: 撞倒了帐篷
  rationale: 原文依次为“撞击它，它便倒下”；汉语合译为“撞倒了帐篷”，保留因果和受事，同时避免代词指代含混。
- source_word: וַיַּהַפְכֵהוּ לְמַעְלָה וְנָפַל הָאֹהֶל
  choice: 又把它掀翻，帐篷就塌了
  rationale: 第三人称阳性单数主语最自然地承接大麦饼；“掀翻”表达使帐篷翻覆，“塌了”自然呈现帐篷最终倒毁的状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“只见”和“看哪”保留原文הִנֵּה的鲜明现场感；通过重复“帐篷”消除连续阳性单数代词在中文中的歧义。
