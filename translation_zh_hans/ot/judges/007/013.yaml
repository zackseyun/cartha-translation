revisions:
- from: 基甸来到的时候，只见有一个人正在把一个梦讲给同伴听。他说：“看哪，我做了一个梦：只见一个圆圆的大麦饼[a]在米甸营中翻滚，滚到一座帐篷那里，撞倒了帐篷，又把它掀翻，帐篷就塌了。”
  to: 基甸来到的时候，只见有一个人正在把一个梦讲给同伴听。他说：“看哪，我做了一个梦：只见一个圆形的大麦饼[a]在米甸营中翻滚，滚到那座帐篷那里，撞击帐篷，帐篷就倒下；那饼又把帐篷翻了个底朝天，帐篷便倒下了。”
  rationale: 修订明确“那饼”是后续动作的主体，避免中文代词歧义；将“撞倒”改为“撞击……帐篷就倒下”，更贴近原文的撞击与倒下两个连续动词；并以“翻了个底朝天”表达使其翻覆，同时保留原文末尾再次陈述帐篷倒下的效果。
