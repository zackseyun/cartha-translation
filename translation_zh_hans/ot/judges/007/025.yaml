translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“首领”保留שַׂר的政治军事地位而不过度限定身份；“首级”准确表达此处被割下并带走的头。两个以被杀者名字命名的地点采用“俄立磐石”“西伊伯酒榨”，以保留原文刻意形成的重复与呼应。
