  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: zh_hans
  text: 他们擒住了米甸的两个首领[a]——俄立和西伊伯；他们在俄立磐石杀了俄立，在西伊伯酒榨杀了西伊伯。随后，他们追赶米甸人，并把俄立和西伊伯的首级从约旦河对岸[b]带来，交给基甸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俄立”这个名字与希伯来语“乌鸦”一词有关，“西伊伯”与“狼”一词有关；正文按人名音译。
    reason: lexical_alternative
  - marker: b
    text: 或译“从约旦河那边带来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: 擒住了
  rationale: לכד在军事语境中表示捕获、擒拿；“擒住”自然地衔接二人随后被杀的叙述。
- source_word: שְׁנֵי שָׂרֵי מִדְיָן
  choice: 米甸的两个首领
  rationale: שַׂר可指统治者、权贵或军事领袖；“首领”既体现其地位，又避免把他们过度具体化为王室“王子”。
- source_word: עֹרֵב / זְאֵב
  choice: 俄立 / 西伊伯
  rationale: 二者在这里是人名，采用中文圣经传统中易于辨认的音译；其与“乌鸦”和“狼”的词义联系在脚注说明。
- source_word: בְּצוּר עוֹרֵב
  choice: 在俄立磐石那里
  rationale: צוּר指岩石或磐石，此处构成地点名称；“在那里”自然表达地点介词בְּ，同时保留命名呼应。
- source_word: בְיֶקֶב זְאֵב
  choice: 在西伊伯酒榨那里
  rationale: יֶקֶב指压榨葡萄的酒榨或酒池；译作“酒榨”既准确又保留地点名称的结构。
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: 随后，他们继续追赶米甸人
  rationale: רדף表示追赶，אֶל在此指向追击对象或方向；按上下文把“米甸”理解为米甸人。“继续”体现这场追击仍在进行，而不把短语生硬译成“向米甸追赶”。
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: 俄立和西伊伯的首级
  rationale: רֹאשׁ虽为单数形式，但与两个人名并列，具有分配意义；现代汉语“二人的首级”可自然指两颗被割下的头。
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: 从约旦河对岸带来
  rationale: 短语表示从约旦河另一边或对岸而来；“从……对岸带来”保留原文的来源视角，脚注注明另一种可能的句法理解。
