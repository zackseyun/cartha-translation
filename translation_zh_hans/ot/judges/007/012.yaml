base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: zh_hans
  text: 米甸人、亚玛力人和所有东方人[b]遍布在谷中，多得像蝗虫一样；他们的骆驼不计其数，多得像海边的沙一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希伯来语直译为“东方之子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹפְלִים
  choice: 散布
  rationale: 该分词字面含“倒下／落下”之意，但在此军事语境中描写军队在谷中驻扎、铺展开来。“散布”既保留其空间意象，也符合现代汉语表达。
- source_word: בָּעֵמֶק
  choice: 在谷中
  rationale: עֵמֶק通常指山谷或谷地；“在谷中”简洁直接。
- source_word: בְּנֵי קֶדֶם
  choice: 东方人
  rationale: 字面为“东方之子”，在此是对来自东方群体的统称；“东方人”自然地传达其民族地理含义。
- source_word: כָּאַרְבֶּה לָרֹב
  choice: 多得像蝗虫一样
  rationale: 明确表达军队数量庞大如蝗群的比喻，同时保留לָרֹב所强调的众多。
- source_word: לִגְמַלֵּיהֶם
  choice: 他们的骆驼
  rationale: 直接表达名词及其第三人称复数所属后缀。
- source_word: אֵין מִסְפָּר
  choice: 不计其数
  rationale: 自然传达希伯来文“没有数目”的夸张表达。
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: 多得像海边的沙一样
  rationale: 保留以海边沙粒喻数量繁多的意象，并用“多得”体现末尾לָרֹב再次加强数量的作用。
- source_word: וּמִדְיָן וַעֲמָלֵק וְכָל בְּנֵי קֶדֶם
  choice: 米甸人、亚玛力人和所有东方人
  rationale: 开头的连接词承接上下文，现代汉语叙事中可由句序自然体现，无须增添原文没有的明确时间副词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“散布”保留原文动词的形象及语境中的驻军含义；两次用“多得”体现原文对庞大数量的重复强调。脚注标记按其实际所注释的词语放置。
