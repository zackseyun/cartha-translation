  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: zh_hans
  text: 三队人都吹响号角，打碎陶罐；他们左手拿着火把，右手拿着号角用来吹响，并高声呼喊：“为耶和华和基甸的刀剑！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: 三队人
  rationale: 原文直译近于“三个头领/首部”，但在本段军事部署中指基甸分成的三队；“三队人”自然明确，也与士师记7:16的语境相符。
- source_word: שׁוֹפָרוֹת
  choice: 号角
  rationale: שׁוֹפָר是用于发出信号的角制乐器；“号角”比“喇叭”更贴近古代器物及叙事语境，又不必加入原文未明说的材质。
- source_word: הַכַּדִּים
  choice: 陶罐
  rationale: כַּד指盛装用的罐或瓶；结合火把藏在容器中的场景，“陶罐”简明自然，并有助于理解其可被打碎。
- source_word: וַיַּחֲזִיקוּ
  choice: 拿着
  rationale: 此处使役词形表达持住、握住；现代汉语用“拿着”自然流畅，不额外强调抓取力度。
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: 左手……右手……
  rationale: 希伯来语单数“手”配复数后缀具有逐人分配的意义；汉语直接说每人的“左手……右手……”最自然。
- source_word: לַפִּדִים
  choice: 火把
  rationale: לַפִּיד指燃烧的火把或火炬；“火把”是清楚、常用的现代汉语。
- source_word: לִתְקֹעַ
  choice: 准备吹奏
  rationale: 不定式可表示用途或目的，即号角拿在右手供吹响；“准备吹奏”使汉语句法完整，同时不把动作误解为只吹一次。
- source_word: וַיִּקְרְאוּ
  choice: 高声喊道
  rationale: קרא在这里是战阵中的呼喊；“高声喊道”传达其音量和紧迫感。
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: 为耶和华！为基甸！刀剑出鞘！
  rationale: 原文是省略动词的简短战号，字面结构为“刀剑—归于/为了耶和华和基甸”。主文以自然有力的汉语战呼表达“为……而战”的方向，同时保留刀剑意象；较贴近形式的另一种理解列入脚注。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的圣名音译“耶和华”，将其作为专名而不是用“主”这一称号替代。
theological_decisions:
- issue: 战呼 חֶרֶב לַיהוָה וּלְגִדְעוֹן 的省略结构
  choice: 为耶和华！为基甸！刀剑出鞘！
  alternative: 耶和华和基甸的刀剑！
  rationale: 希伯来语没有明说动词，介词לְ可表示“归于、属于”或“为了”。主文保留战呼的突兀力度，并以汉语自然表达为二者而战；脚注保存传统且在语法上可成立的所属关系读法，避免消除原文歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，以短促动词再现突袭场面的节奏。战呼使用分句和感叹号呈现口号感；圣名译作“耶和华”。
