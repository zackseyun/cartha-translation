revisions:
- from: 三队人都吹响号角，打碎陶罐。他们左手拿着火把，右手拿着号角准备吹奏[a]，高声喊道：“为耶和华！为基甸！刀剑出鞘！”
  to: 三队人都吹响号角，打碎陶罐；他们左手拿着火把，右手拿着号角用来吹响，并高声呼喊：“为耶和华和基甸的刀剑！”
  rationale: 修订删除无原文根据的“出鞘”和“不断”，恢复“刀剑”与耶和华、基甸之间的省略式关系。“用来吹响”对应号角的用途而不误作持续动作。脚注仅保留战呼中合理的句法歧义。
  reviewer_model: gpt-5.6-terra
