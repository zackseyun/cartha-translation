base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: zh_hans
  text: 耶路巴力（就是基甸）和所有与他同在的人清早起来，在哈律泉[a]旁安营。米甸的营地在他的北面，在谷中的摩利冈旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“隐·哈律”。“隐”（עֵין）意为“泉”。
    reason: 说明该地点也可将עֵין作为地名成分整体音译；不将正文中表示位置的“旁”误作地名的一部分。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: 清早起来
  rationale: 使役词干在此按惯用义表示“早起”；“清早起来”自然保留了时间含义。
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: 耶路巴力，就是基甸
  rationale: 保留两个名字，并以“就是”自然表达代词 הוּא 在同位结构中的辨明作用。
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: 和所有跟随他的人
  rationale: עָם 本义宽泛，译作“人”而不缩窄为“军兵”；“跟随他”在军事语境中自然表达“与他同在”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: 准确表达 חנה 的“扎营、驻营”义，且符合现代中文叙事语体。
- source_word: עַל עֵין חֲרֹד
  choice: 在哈律泉旁
  rationale: 将 עֵין 的普通名词含义“泉”译出，同时音译专名 חֲרֹד；עַל 在此表达临近位置。
- source_word: וּמַחֲנֵה מִדְיָן
  choice: 米甸的营地
  rationale: 直接反映构造链“米甸之营”，不擅自将米甸改为族群形容词。
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: 在他的北面
  rationale: 保留 לוֹ 的阳性单数，指向作为叙事中心和代表性领袖的基甸，不按群体语境改成复数。
- source_word: מִגִּבְעַת הַמּוֹרֶה בָּעֵמֶק
  choice: 靠近谷中的摩利冈
  rationale: 将 גִּבְעָה 译为“冈”，将 בָּעֵמֶק 与该地形说明自然结合；介词 מִן 在此按位置邻近义译作“靠近”，同时避免误解为营地从山冈移动而来。
theological_decisions:
- issue: לוֹ 的单数指称
  choice: 在他的北面
  alternative: 在他们的北面
  rationale: 希伯来文本明确使用阳性单数后缀；译文保留这一形式上的指向，而不因前文包含众人便将其复数化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“清早起来”“安营”“营地”等词简洁自然；地名按常见圣经汉语形式音译，并保留原文单数方位关系。
