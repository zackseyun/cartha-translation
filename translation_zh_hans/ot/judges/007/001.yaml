  - severity: low
    issue: 脚注异译“隐·哈律旁”
    rationale: “旁”对应正文中表示位置的介词，不属于地名本身；脚注应将替代地名与正文的空间表达区分开。
  - severity: low
    issue: “靠近谷中的摩利冈”
    rationale: 可理解，但“靠近”较为解释性；以“在……旁”对应英文审计轨迹的“by”，并使地点关系更明晰。
