base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: zh_hans
  text: 他对他们说：“你们要看着我，照样去做。看哪，当我来到营地边缘时，我怎样做，你们也要怎样做。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: 你们要看着我
  rationale: ראה与מן连用，在此命令语境中表示以基甸为行动示范，留心观察他；“看着我”自然地传达持续观察并准备仿效之意。
- source_word: וְכֵן תַּעֲשׂוּ
  choice: 照样去做
  rationale: כֵן表示方式，即“这样、照样”；此译既自然，也保留命令语气和仿效含义。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该提示词引人注意接下来的行动；“看哪”保留原文鲜明、略庄重的指示语气。
- source_word: אָנֹכִי בָא
  choice: 我一到
  rationale: 分词בָא表达即将发生的行动；结合后续结构译作“一到”，自然呈现时间关系与行动的紧迫感。
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: 营地边缘
  rationale: קצה指尽头或边缘；这里是米甸军营的外围，“营地边缘”准确简洁。
- source_word: וְהָיָה כַאֲשֶׁר אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: 我怎样做，你们也要怎样做
  rationale: 保留原文“怎样……也怎样……”的对应结构；“要”传达后一个未完成式在指令语境中的命令效力。
