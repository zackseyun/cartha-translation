base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: zh_hans
  text: 当夜，雅威对他说：“起来，下到营中去，因为我已经把它交到你手中[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交到你手中”是希伯来语惯用语，意思是交在你的权势或控制之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: 当夜
  rationale: 希伯来语叙事公式 וַיְהִי 引入新场景；现代汉语以“当夜”自然承接叙事，并准确表达 בַּלַּיְלָה הַהוּא 的特定时间。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 对他说
  rationale: אמר 是普通的说话动词；“对他说”直接、自然，并保留受话对象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: קוּם רֵד
  choice: 起来，下到
  rationale: 两个连续命令均予以保留；“起来”传达立即行动，“下到”保留 ירד 的方向和地势含义。
- source_word: בַּמַּחֲנֶה
  choice: 营中
  rationale: 介词 בּ 与移动动词连用可表达进入；“下到营中去”既自然，也不额外解读为发动攻击。
- source_word: כִּי
  choice: 因为
  rationale: 引出执行命令的理由，清楚保留因果关系。
- source_word: נְתַתִּיו
  choice: 我已经把它交在
  rationale: 完成式表达上帝已确定并成就的交付；阳性单数后缀回指“营”，并借营地指其中的敌军，译文保留“它”而不明说。
- source_word: בְּיָדֶךָ
  choice: 你手中
  rationale: 保留希伯来语“在某人手中”的形象，同时以脚注说明其权势或控制含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用上帝的专名，因此正文采用中文圣经传统中通行且易识别的专名“耶和华”，不以称号“主”代替；“雅威”是另一种可能的音译。
- issue: “我已经把它交在你手中”的完成语气
  choice: 已经交在你手中
  alternative: 要交在你手中
  rationale: נְתַתִּיו 是完成式；这里把尚待基甸实际取得的胜利表述为上帝已经交付，译文保留这种神圣宣告的确定性，不改写成单纯将来时。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“起来，下到……去”保留命令的力度与地形方向；“它”维持原文以“营”代指敌军的简洁表达。
