  to: 基甸向以法莲全山地派遣使者，说：“你们下来迎击米甸人，要夺取直到伯巴拉的水域[a]和约旦河。”于是，以法莲的每一个人都被召集起来[b]；他们夺取了直到伯巴拉的水域和约旦河。
