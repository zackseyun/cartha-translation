base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: zh_hans
  text: 基甸向以法莲全山地派遣使者，说：“你们下来迎击米甸人，要夺取直到伯巴拉的水域[a]和约旦河。”于是，以法莲的每一个人都被召集起来[b]；他们夺取了直到伯巴拉的水域和约旦河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“水”。按上下文，这可能指水道、渡口或其他具有战略意义的过水地点。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“以法莲的每一个人”。这里的单数集合说法很可能指以法莲被召集的人；动词形式较难，也有人较字面地理解为“呼喊”或“被呼喊”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: 使者
  rationale: 此处指奉派传话的人，不是超自然的天使；“使者”准确而自然。
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: 走遍以法莲整个山区
  rationale: הַר在这里指以法莲的山地地区，而非一座山峰；结合“派使者”译作“走遍”可自然表达分布范围。
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: 你们下来迎击米甸人
  rationale: רְדוּ保留从山区下去的地势动作；军事语境中的לִקְרַאת表示前去迎战、截击，译作“迎击”比字面的“迎接”清楚。
- source_word: וְלִכְדוּ לָהֶם אֶת הַמַּיִם
  choice: 抢先占领水道
  rationale: לכד表示夺取、控制；“水”在此很可能指具有军事价值的水道或渡口。译作“抢先占领水道”表达拦截逃军的语境，同时不把所指限定为仅仅渡口。
- source_word: עַד בֵּית בָּרָה
  choice: 直到伯巴拉
  rationale: עַד表示范围延伸至某处；בֵּית בָּרָה作为地名音译为“伯巴拉”。
- source_word: וְאֶת הַיַּרְדֵּן
  choice: 也要占领约旦河
  rationale: 省略动词的并列宾语在中文中补出“占领”，使命令关系清楚；“约旦河”是现代中文通行地名。
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: 于是，以法莲所有的战士都被召集起来
  rationale: 该动词形式较难，语境支持“被召集/动员”；כָּל אִישׁ是集合性单数，在军事叙事中指以法莲的战士，译文避免误解为全体男性居民，并以脚注保留字面信息。
- source_word: וַיִּלְכְּדוּ
  choice: 他们抢先占领了
  rationale: 与前面的命令保持词义一致，并用“抢先”体现控制战略通道以截断米甸人的行动。
theological_decisions: []
translation_notes:
