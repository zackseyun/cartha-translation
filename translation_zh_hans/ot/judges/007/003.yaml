base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: zh_hans
  text: 现在，请向众人宣告说：“凡惧怕战兢的，可以回去，离开[a]基列山[b]。”于是，众人中有二万二千人回去了，还剩下一万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“离开”的希伯来语动词（וְיִצְפֹּר）很少见，含义也有争议；它也可能含有“及早离去”或“悄然离开”的意思。
    reason: lexical_alternative
  - marker: b
    text: “基列山”是希伯来文最直接的译法，但这里所指的地理位置不易确定；有些人将它理解为较广义的“基列山区”。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 该短语含有明确的时间或推进话语的成分，直译为“现在”既忠实于希伯来文，也自然引出接下来的命令。
- source_word: קְרָא נָא בְּאָזְנֵי הָעָם
  choice: 请当着众人的面宣布
  rationale: קרא在此指公开宣告，נָא使命令语气较为委婉；“当着众人的面”自然表达“使众人亲耳听见”的公开听觉场景。
- source_word: מִי יָרֵא וְחָרֵד
  choice: 凡惧怕战兢的
  rationale: “惧怕”表达יָרֵא，“战兢”保留חָרֵד所含因恐惧而颤抖的加强意味。
- source_word: יָשֹׁב
  choice: 可以回去
  rationale: 该祈使意向形式在公告中带有准许兼指示的意味；“可以回去”比单纯将来时更贴合语境。
- source_word: וְיִצְפֹּר
  choice: 离开
  rationale: 此动词罕见且词义有争议；正文采用不把具体细微含义定死的“离开”，其他可能含义列入脚注。
- source_word: מֵהַר הַגִּלְעָד
  choice: 基列山
  rationale: הַר为单数，最直接的地名式译法是“基列山”；本处地理指向的困难由脚注说明。
- source_word: וַיָּשָׁב מִן הָעָם עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: 于是，众人中有二万二千人回去了
  rationale: 将希伯来文以单数动词配数词的集合结构转换为自然汉语，并保留“从众人中”的关系。
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: 还剩下一万人
  rationale: 自然简洁地表达“留下、剩余”的叙事结果。
