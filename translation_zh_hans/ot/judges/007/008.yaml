  text: וַ/יִּקְח֣וּ אֶת צֵדָה֩ הָ/עָ֨ם בְּ/יָדָ֜/ם וְ/אֵ֣ת שׁוֹפְרֹֽתֵי/הֶ֗ם וְ/אֵ֨ת כָּל אִ֤ישׁ יִשְׂרָאֵל֙ שִׁלַּח֙ אִ֣ישׁ לְ/אֹֽהָלָ֔י/ו וּ/בִ/שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ הֶֽחֱזִ֑יק וּ/מַחֲנֵ֣ה מִדְיָ֔ן הָ֥יָה ל֖/וֹ מִ/תַּ֥חַת בָּ/עֵֽמֶק־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: zh_hans
  text: 他们把百姓的口粮和号角[a]拿在手中。基甸打发以色列众人各回自己的帐篷，只留下那三百人。米甸营在他下方的山谷里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“羊角号”；希伯来文指用兽角制成、用于发出信号的号角。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 他们……拿在手中
  rationale: 采用叙事性简单过去的自然汉语表达；复数主语依上下文指被选出的三百人。
- source_word: צֵדָה
  choice: 口粮
  rationale: 指行军所带的食物或给养；此处与具体拿取、携带相配，“口粮”自然且符合军事语境。
- source_word: הָעָם
  choice: 百姓
  rationale: 保留希伯来文较宽泛的“人民、百姓”，在上下文中具体指其余以色列军兵。
- source_word: בְּיָדָם
  choice: 拿在手中
  rationale: 保留原文具体的“在他们手中”意象，同时用现代汉语自然表达携带之意。
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: 号角
  rationale: שׁוֹפָר是用兽角制成、用于发出信号的吹奏器；“号角”兼顾器物形态和军事功能。
- source_word: שִׁלַּח
  choice: 打发
  rationale: 单数动词的主语是基甸；“打发……回”既保留“送走”之义，也自然表达遣散军兵。
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: 以色列众人各回自己的帐篷
  rationale: 以“众人……各”再现原文的逐一、分配性结构；语境明确所指为以色列男兵。
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: 只留下那三百人
  rationale: הֶחֱזִיק在此表示保留、留住；“只”自然呈现与遣散其余众人的对比。
- source_word: מַחֲנֵה מִדְיָן
  choice: 米甸营
  rationale: 简洁、自然地表达“米甸的营地”，并与常见圣经专名译法一致。
- source_word: מִתַּחַת
  choice: 在他下方
  rationale: 保留相对于基甸所在位置的低处关系，不将其泛化为单纯的远近描述。
- source_word: בָּעֵמֶק
  choice: 山谷里
  rationale: 结合“在他下方”的地势对照，עֵמֶק在此译作“山谷”最清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“基甸”在第二句明示，以消除汉语零主语可能造成的歧义；原文则以单数动词承接上下文。脚注标记已置于“号角”之后。
