  yaml_path: translation/ot/judges/007/006.yaml
  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: zh_hans
  text: 用手捧水到嘴边舔着喝的，有三百人[a]；其余的人都跪下喝水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用手把水送到嘴边。”希伯来语这一短语强调，他们用手把水送到嘴边，而不是跪下直接喝。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: 共有
  rationale: 以自然的现代汉语表达人数统计，准确传达“数目是”的意思，同时避免生硬的“数目为”。
- source_word: הַמֲלַקְקִים
  choice: 舔的
  rationale: 保留לקק所描绘的“舔”这一鲜明动作，并以名词化结构指称这一组人。
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: 用手捧水到嘴边
  rationale: 希伯来语直述“用他们的手到他们的口”；译文按汉语习惯补明承接动作的“捧水”，突出他们用手把水送到嘴边，而不是跪下直接饮水。
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: 三百人
  rationale: 军事语境中的אִישׁ在数字后指人；“三百人”准确、自然。
- source_word: וְכֹל יֶתֶר הָעָם
  choice: 其余的人都
  rationale: 简洁传达其余全体，并与前三百人形成清楚对比；分号已体现转折，无须把连接词强化为“但是”。
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: 跪下
  rationale: 汉语“跪下”已经自然包含屈膝着地之意，避免重复译作“跪在膝盖上”。
- source_word: לִשְׁתּוֹת מָיִם
  choice: 喝水
  rationale: 直接表达目的，并保留原文明确提到的“水”。
