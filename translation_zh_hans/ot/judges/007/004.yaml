base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: zh_hans
  text: 耶和华[a]对基甸说：“人还是太多。你带他们下到水边去；我要在那里为你试验他们。凡我对你说：‘这人要跟你去’的，他就要跟你去；凡我对你说：‘这人不跟你去’的，他就不跟你去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应原文中上帝的名字יהוה（YHWH）。
    reason: 说明译文所呈现的是专名，而非一般称号。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华[a]
  rationale: 以现代中文读者熟悉的形式译出以色列上帝的专名，并用脚注说明原文形式，避免仅以称号取代专名。
- source_word: עוֹד הָעָם רָב
  choice: 人还是太多
  rationale: רָב字面为“多”，但上下文明确表达人数仍超过上帝所要留下的规模；“还是太多”自然传达该语用含义。
- source_word: הוֹרֵד אוֹתָם אֶל־הַמַּיִם
  choice: 你带他们下到水边去
  rationale: 保留使役动词“使下去”的方向感；“水边”符合随后人在水旁饮水受察验的场景。
- source_word: וְאֶצְרְפֶנּוּ לְךָ שָׁם
  choice: 我要在那里为你试验他们
  rationale: צרף本指熔炼、精炼，延伸为检验、筛选；此处以“试验”保留检验过程，而不提前明说筛选结果。原文单数宾语后缀指向集合性的“民”，中文按实际所指译为复数“他们”。
- source_word: זֶה יֵלֵךְ אִתָּךְ
  choice: 这个人可以跟你去
  rationale: 在上帝决定谁获准同行的语境中，“可以”自然表达未完成式在直接话语中的许可或确定安排。
- source_word: זֶה לֹא יֵלֵךְ עִמָּךְ
  choice: 这个人不可跟你去
  rationale: 与前句形成对称，清楚传达否定的决定，不额外说明被拒绝的原因。
theological_decisions:
- issue: 上帝在筛选军队中的主动权
  choice: 保留“我要……试验”及“我指着谁对你说”的第一人称表达
  alternative: 弱化为基甸观察饮水方式后自行挑选
  rationale: 希伯来文明确把检验和最终指定归于耶和华；译文不把决定权转移给基甸。
- issue: צרף所表达的行动性质
  choice: 译作“试验”
  alternative: 译作“筛选”或“炼净”
  rationale: “筛选”容易只突出淘汰结果，“炼净”又可能引入道德或属灵净化之意；“试验”较能保留词义张力及叙事中的辨别功能。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。用“到时”承接希伯来文וְהָיָה所引出的后续情形；两句“这个人……跟你去”保持原文的重复和裁定语气。
