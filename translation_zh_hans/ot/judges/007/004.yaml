  to: 耶和华[a]对基甸说：“人还是太多。你带他们下到水边去；我要在那里为你试验他们。凡我对你说：‘这人要跟你去’的，他就要跟你去；凡我对你说：‘这人不跟你去’的，他就不跟你去。”
  rationale: 修订后以“凡我对你说……的”对应原文两次אֲשֶׁר结构，并以“要跟你去／不跟你去，他就要／不跟你去”保留原文对耶和华指定及其结果的重复性、确定性表述。保留“水边”“为你试验他们”及专名脚注。
