base_translation:
  language: en
  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: zh_hans
  text: 以色列人[b]从拿弗他利、亚设和玛拿西各地被召集起来[a]，追赶米甸[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被召集起来”也可译作“被动员起来”或较直译为“被呼喊”。这里的希伯来语动词较难确定；按上下文，是指以色列人被聚集起来追击敌军。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文作单数“以色列之人”，在这里是集合说法，指以色列众人。
    reason: lexical_alternative
  - marker: c
    text: “米甸”在这里代指米甸军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: 被召集起来
  rationale: 该动词为צעק的尼法勒形态；结合米甸军队正在溃逃的语境，这里指以色列人被召集、动员起来追击，而不是他们发出呼喊。“被召集起来”既保留被动意味，也自然表达军事集结。
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文形式为单数“以色列之人”，但在此作集合用法；后面的复数动词וַיִּרְדְּפוּ也表明所指为众人。现代汉语用“以色列人”最自然。
- source_word: מִנַּפְתָּלִי וּמִן אָשֵׁר וּמִן כָּל מְנַשֶּׁה
  choice: 从拿弗他利、亚设和玛拿西全境
  rationale: 介词מִן表示人员来自这些支派或地区；כָּל修饰玛拿西，强调其全部范围，因此译作“玛拿西全境”。
- source_word: וַיִּרְדְּפוּ
  choice: 追赶
  rationale: רדף在军事叙事中表示追击敌军；“追赶”清楚、自然，并与后接对象相配。
- source_word: אַחֲרֵי מִדְיָן
  choice: 米甸
  rationale: אַחֲרֵי与רדף连用时，汉语可直接说“追赶米甸”。“米甸”在这里以民族或国家之名代指米甸军队，正文保留原文的简练表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“被召集起来”保留原文尼法勒形态所可能表达的被动集结含义；“玛拿西全境”传达כָּל的范围强调。脚注保留动词解释上的真实难点及两个集合、转喻用法。
