  yaml_path: translation/ot/judges/007/010.yaml
  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: zh_hans
  text: 但如果你害怕下去，就和你的随从[a]普拉一起下到营地去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从”或译“仆人”或“年轻人”。希伯来语 נַעַר 可按语境指年轻人、仆人或侍从。
    reason: 保留原词在年龄和职分方面的词义范围。
lexical_decisions:
- source_word: וְאִם
  choice: 但如果
  rationale: 承接上一节的命令，并引出带有轻微转折意味的条件，因此译作“但如果”。
- source_word: יָרֵא אַתָּה
  choice: 你害怕
  rationale: 自然表达基甸当时所处的惧怕状态，不额外强化为“胆怯”。
- source_word: לָרֶדֶת / רֵד
  choice: 下去／下到……去
  rationale: 保留原文同一动词的重复；第二处结合目的地译为“下到营地去”，符合现代汉语习惯。
- source_word: וּפֻרָה
  choice: 和……普拉一起
  rationale: 此处连接词在语境中表示普拉陪同基甸，译作“和……一起”比直译“并且普拉”自然。
- source_word: נַעַרְךָ
  choice: 你的随从
  rationale: נַעַר可指年轻人、仆人或侍从；此处普拉是陪同基甸的属下，“随从”既贴合语境，又避免过度限定其年龄或身份。
- source_word: אֶל הַמַּחֲנֶה
  choice: 到营地去
  rationale: אֶל表示朝向或到达，译文不擅自强化为进入营地内部。
