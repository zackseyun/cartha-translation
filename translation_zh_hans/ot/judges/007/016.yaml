base_translation:
  language: en
  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: zh_hans
  text: 基甸把三百人分成三队[a]，又把号角[b]交在每个人手里，并把空罐[c]交给他们，罐里有火把。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“三个头”，这里指三组或三队。
    reason: lexical_alternative
  - marker: b
    text: “号角”也可译作“羊角号”（希伯来文 שׁוֹפָרוֹת）。
    reason: lexical_alternative
  - marker: c
    text: “罐”也可译作“水罐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: 分成
  rationale: 此处指把队伍编分为若干组；“分成”自然、准确，又不额外限定具体编制方式。
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: 三百人
  rationale: אִישׁ本义为“人、男人”；上下文已表明他们是作战人员，无须解释性地译作“士兵”。
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: 三队
  rationale: 字面为“三个头”，在这里是指三个分队；“三队”符合现代汉语军事叙事，也保留原文的分组意义。
- source_word: וַיִּתֵּן ... בְּיַד כֻּלָּם
  choice: 交在每个人手里，并给他们
  rationale: 将原文“放/给在他们众人的手中”的分配动作译成自然汉语；“每个人”明确表达集合词的逐人分配含义。
- source_word: שׁוֹפָרוֹת
  choice: 号角
  rationale: שׁוֹפָר是用于发出信号的角制吹奏器；“号角”比现代乐器意义的“喇叭”更贴近古代语境，同时不武断限定一定是羊角。
- source_word: כַדִּים רֵקִים
  choice: 空罐
  rationale: כַּד指罐、坛或水罐一类容器；“空罐”简明而符合其可能为陶制容器的语境。
- source_word: לַפִּדִים בְּתוֹךְ הַכַּדִּים
  choice: 罐里藏着火把
  rationale: 原文直指火把位于罐内；“藏着”自然呈现罐子遮住火光的情景，但不增添原文之外的行动细节。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“基甸”补出希伯来叙事中由上下文确定的主语，使单节独立阅读时清楚；句式保留连续动作及“手里”“罐里”的具体画面。所有脚注标记均置于相应词语之后。
