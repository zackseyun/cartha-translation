base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: zh_hans
  text: 基甸听见那梦的讲述和梦的解释，就俯伏敬拜。随后，他回到以色列营中，说：“起来！耶和华已经把米甸人的营地交在你们手中了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: 那梦的讲述
  rationale: מִסְפָּר在此指梦被叙述、讲说出来，而非数字或计数；译为“讲述”自然且贴合上下文。
- source_word: שִׁבְרוֹ
  choice: 梦的解释
  rationale: שֵׁבֶר在此语境指梦的破解、解释；补出“梦的”以明确所指。
- source_word: וַיִּשְׁתָּחוּ
  choice: 俯伏敬拜
  rationale: 该词可指俯伏或敬拜；此处基甸因所得印证而俯伏，兼具身体动作和敬拜含义，合译可保留两层意义。
- source_word: ק֔וּמוּ
  choice: 起来
  rationale: 复数命令式，向营中的以色列人发出行动号召；“起来”简洁有力。
- source_word: נָתַן יְהוָה בְּיֶדְכֶם
  choice: 耶和华已经把……交在你们手中了
  rationale: 希伯来语完成式表达胜利已由耶和华确定赐下；“交在你们手中”保留原文惯用意象。
- source_word: מַחֲנֵה מִדְיָן
  choice: 米甸人的营地
  rationale: 此处指米甸军队驻扎的营盘；译作“米甸人的营地”比“米甸营”更符合现代普通话。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，明确对应יהוה，不把专名泛化为称号。
- issue: וַיִּשְׁתָּחוּ的对象未明说
  choice: 不补出敬拜对象
  alternative: 译为“向耶和华俯伏敬拜”
  rationale: 上下文强烈暗示对象是耶和华，但原文没有明说；正文保留这一省略，避免把推断写成明文。
- issue: 完成式נָתַן所表达的胜利确定性
  choice: 译为“已经……交在……手中了”
  alternative: 将要把……交在……手中
  rationale: 保留先知性完成式的确定语气：战役尚未展开，但基甸宣告神已将敌营交付。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准普通话。叙事连接简洁，直接引语保留号召力；不添加原文未明说的敬拜对象。
