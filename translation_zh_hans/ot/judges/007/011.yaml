base_translation:
  language: en
  yaml_path: translation/ot/judges/007/011.yaml
  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: zh_hans
  text: “你会听见他们说什么；此后，你的双手就会刚强起来，你便可下到营中。”于是，他和他的侍从[a]普拉一同下去，到了营中武装士兵[b]的外围。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍从”所译的希伯来语也可指“年轻人”或“仆人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“列阵的士兵”；这里的希伯来语可指配备好武器、准备作战的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: 你会听见他们说什么
  rationale: 按直接引语中的时序表达将动词译为将来意义；“听见”保留שׁמע的普通含义，指听到敌营中的谈话。
- source_word: וְאַחַר
  choice: 此后
  rationale: 简洁表达先听见、后得坚固的时间顺序。
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: 你的双手就会刚强起来
  rationale: 保留希伯来文“手刚强”的身体意象；在此语境中指勇气和行动能力得到增强，而不直接以解释性译法取代原文。
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: 你便可下到营中
  rationale: 保留ירד“下去”的方向意象，并将בַּמַּחֲנֶה按语境译为进入营中；“便可”自然承接得到勇气后的行动。
- source_word: וַיֵּרֶד הוּא
  choice: 于是，他……下去
  rationale: 用“于是”推进叙事，同时保留原文代词“他”，不擅自在本节补出姓名。
- source_word: וּפֻרָה
  choice: 普拉
  rationale: 按现代普通话习惯音译专名。
- source_word: נַעֲרוֹ
  choice: 他的侍从
  rationale: נַעַר可指年轻人、仆人或随从；在军事行动语境中“侍从”自然且不过度规定正式身份，并以脚注保留词义范围。
- source_word: אֶל קְצֵה
  choice: 来到……驻守的边缘地带
  rationale: קצה表示边缘或尽头；“边缘地带”符合敌营外围的空间场景。
- source_word: הַחֲמֻשִׁים
  choice: 武装士兵
  rationale: 该词在此指配备武器、准备作战的人；“武装士兵”清楚传达其军事含义。
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: 营中……驻守的
  rationale: 将关系从句自然整合进中文，说明这些武装人员位于营中。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“手刚强起来”这一希伯来语意象，以免把原文的形象表达直接化约为“有勇气”；叙事后半保持原文的“他”，不在本节增补基甸之名。
