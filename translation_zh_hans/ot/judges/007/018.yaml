base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: zh_hans
  text: 我和所有跟我在一起的人吹响号角[a]时，你们也要在整个营地四周吹响号角，并说：“为雅威！为基甸！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“号角”指用兽角制成的号，通常是公羊角，不是金属喇叭。
    reason: cultural_note
  - marker: b
    text: 一些传统译本受士师记7:20的措辞影响，译作“雅威和基甸的刀”。但本节的希伯来文本身只说“为雅威！为基甸！”。
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: 吹响
  rationale: תקע与שופר连用时指吹号；“吹响”既具体又符合现代汉语习惯。
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: 号角
  rationale: שופר指用兽角制成的号，常为公羊角，并非金属喇叭；“号角”自然易懂，具体材质则在脚注说明。
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: 我和所有跟我在一起的人
  rationale: 明确包括基甸本人及随同他的人，忠实保留原文的并列范围。
- source_word: גַּם אַתֶּם
  choice: 你们也要
  rationale: “也”保留גַּם所表达的呼应和参与；“要”体现此处指令语气。
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: 在整个营地四周
  rationale: 同时表达סְבִיבוֹת的环绕方位和כָּל的完整范围。
- source_word: וַאֲמַרְתֶּם
  choice: 并且说
  rationale: 原文使用普通动词אמר，没有明说“喊叫”；即使战场语境暗示声音响亮，正文仍不额外加强。
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: 为雅威！为基甸！
  rationale: 两个介词ל并列，均按表示归属、拥护或效忠的“为”处理；重复“为”可保留希伯来文的平行结构。神名יהוה音译为“雅威”，而不以称号代替。
theological_decisions:
- issue: 战斗口号לַיהוָה וּלְגִדְעוֹן的译法
  choice: 为雅威！为基甸！
  alternative: 雅威和基甸的刀！
  rationale: 本节希伯来文本身只有“为雅威、为基甸”，并没有“刀”一词；“刀”的措辞见于7:20，不应从邻近经文补入本节。
- issue: 神名יהוה的呈现
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其作为专名的性质，避免改成称号而消除原文信息。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“一……，……也要……”清楚呈现基甸发出信号、众人随即响应的关系；正文不把אמר强化为“高喊”，也不从7:20补入“刀”。
