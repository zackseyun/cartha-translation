  text: וַ/יּ֥וֹרֶד אֶת הָ/עָ֖ם אֶל הַ/מָּ֑יִם וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן כֹּ֣ל אֲשֶׁר יָלֹק֩ בִּ/לְשׁוֹנ֨/וֹ מִן הַ/מַּ֜יִם כַּ/אֲשֶׁ֧ר יָלֹ֣ק הַ/כֶּ֗לֶב תַּצִּ֤יג אוֹת/וֹ֙ לְ/בָ֔ד וְ/כֹ֛ל אֲשֶׁר יִכְרַ֥ע עַל בִּרְכָּ֖י/ו לִ/שְׁתּֽוֹת־־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: zh_hans
  text: 于是，他带百姓下到水边。雅威对基甸说：“凡用舌头舔水、像狗舔水一样的，你要把他单独分列出来[a]；凡双膝跪地喝水的，也要另行分列。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他单独安置。”原文动词可指把人安置或列在特定位置；这里强调将这类人分别归列。
    reason: 说明תַּצִּיג…לְבָד可译为“分列”或“单独安置”，并对应正文中的命令。
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: 带……下到
  rationale: 这是ירד的使役形，表示基甸使百姓下去；“带……下到”既保留使役意味，也符合现代汉语表达。
- source_word: הָעָם
  choice: 百姓
  rationale: עם是泛指群体的集合名词；上下文虽是军事场景，原文并未明确使用“军队”或“士兵”，故保留较宽泛的称呼。
- source_word: אֶל הַמָּיִם
  choice: 到水边
  rationale: 原文直指“到水那里”；汉语说“下到水边”更自然，也没有把水体具体化为原文未说明的河、溪或泉。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，以专名呈现，而不以称号替代。
- source_word: כֹּל אֲשֶׁר יָלֹק בִּלְשׁוֹנוֹ מִן הַמַּיִם
  choice: 凡……用舌头舔水的
  rationale: 保留逐一分类的“凡”、单数所有关系所表达的身体动作，以及לקק“舔、舐饮”的具体形象。
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: 像狗舔水那样
  rationale: 明确保留原文的比喻；汉语以“狗”作类指，无须机械译出定冠词。
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: 把他单独列在一边
  rationale: יצג的使役形表示把某人安置或列于某处，לבד强调分开；此译文自然呈现分类与隔离的动作。
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: 凡双膝跪地喝水的，也要另列一边
  rationale: 保留כרע及“在双膝上”的具体姿势；后半句在希伯来文中省略了前面的处置动词，汉语补出“也要另列一边”，使并列分类关系清楚。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用以色列上帝的专名；采用“雅威”音译可保留其专名性质，同时避免用称号“主”取代原文。
- issue: 第二类人的处置是否补出
  choice: 译作“也要另列一边”
  alternative: 仅译“凡双膝跪地喝水的”
  rationale: 希伯来文第二分句形式上省略谓语，但承接前面的分类命令；补出隐含动作符合汉语语法，并未添加新的分类标准或神学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“舔水”保留原文生动具体的动作，“双膝跪地”呈现与前一类不同的饮水姿势；不把“百姓”窄化为“士兵”，也不推断经文未明说的警觉程度或拣选原因。
