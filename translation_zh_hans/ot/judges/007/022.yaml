language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: zh_hans
  text: 三百支号角吹响时[a]，耶和华使营中各人的刀剑彼此相向，遍及全营[b]。全军便逃跑，逃到伯·示他，朝着西利拉；又逃到亚伯·米何拉的边缘[d]，靠近他巴[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “号角”指角制的号器，通常用羊角制成。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“使各人的刀剑攻击同伴和全营的人”；原文也可能着重表示这种混乱遍及整个营地。
    reason: alternative_reading
  - marker: c
    text: 伯·示他、西利拉、亚伯·米何拉和他巴都是逃亡路线上的地名。
    reason: cultural_note
  - marker: d
    text: “边缘”也可译作“岸边”或“边界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... הַשּׁוֹפָרוֹת
  choice: 三百只号角一齐吹响时
  rationale: שׁוֹפָר是角制号器，常为羊角；译作“号角”既自然，也保留材质与军用信号的意象。希伯来语动词为复数主动式；结合上文，译文用事件性表达，避免生硬被动句。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接保留四字神名在现代汉语圣经传统中的通行音译，不以称号替代专名。
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: 使全营的人各自挥刀攻击同伴
  rationale: 保留上帝使敌军彼此刀剑相向的因果关系，并以“各自……同伴”表达אִישׁ的逐一分配意义和רֵעַ的同营伙伴含义。
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: 全营
  rationale: 将介词短语理解为事件遍及整个营地，而不是把“全营”作为另一个受攻击的宾语；这一理解符合希伯来语介词在此的空间范围用法，同时以脚注保留另一可能。
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: 全军便逃跑
  rationale: מַחֲנֶה本义可指营地，也可转指驻营的军队；会逃跑的是军队，故正文采用自然汉语“全军”。
- source_word: צְרֵרָתָה
  choice: 往西利拉方向
  rationale: 地名后的方向词尾表示朝向，故明确译出“往……方向”，而不武断表示必已抵达。
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: 亚伯·米何拉边界
  rationale: שָׂפָה字面为嘴唇、边缘，也可指岸边或疆界；此处未明言水体，正文用较宽泛的“边界”。
- source_word: עַל טַבָּת
  choice: 靠近他巴
  rationale: עַל在此地理短语中可能表示邻近或相对于某地的位置；“靠近”保留这种空间关系而不过度具体化。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名，而非“主”这一称号。正文采用现代汉语圣经读者最熟悉的专名音译“耶和华”，同时不把专名改成称号。
- issue: 上帝在敌军自相残杀中的作用
  choice: 耶和华使全营的人各自挥刀攻击同伴
  alternative: 全营的人各自挥刀攻击同伴
  rationale: 希伯来语明确以耶和华为וַיָּשֶׂם的主语，不能弱化为仅仅发生混乱；译文保留上帝主动造成这一局面的陈述及其神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。地名按汉语音译并用间隔号区分复合名称；句法适当拆分，以清楚呈现吹角、彼此攻击和逃亡三层动作。所有脚注标记均置于正文对应位置。
