  - severity: low
    issue: “各自挥刀攻击同伴”较原文具体且略显单向。
    rationale: 原文是“各人的刀剑对着其同伴”，叙述的是敌军互相以刀相向；“刀剑彼此相向”更保留该意象和互相性。
