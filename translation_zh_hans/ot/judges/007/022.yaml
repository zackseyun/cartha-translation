revisions:
- from: 三百只号角一齐吹响时[a]，耶和华使全营的人各自挥刀攻击同伴[b]。全军便逃跑，直逃到伯·示他，往西利拉方向，又逃到靠近他巴的亚伯·米何拉边界[d][c]。
  to: 三百支号角吹响时[a]，耶和华使营中各人的刀剑彼此相向，遍及全营[b]。全军便逃跑，逃到伯·示他，朝着西利拉；又逃到亚伯·米何拉的边缘[d]，靠近他巴[c]。
  rationale: 修订明确译出“遍及全营”，并以“营中各人的刀剑彼此相向”保留希伯来原文的刀剑意象、逐一分配及互相攻击的含义。逃亡地名和方向关系仍保持原文的地理语义，未作超出文本的定位判断。
