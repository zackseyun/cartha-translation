base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: zh_hans
  text: 雅威对基甸说：“跟你在一起的人太多，不宜由我把米甸交在他们手中[a]，免得以色列向我夸耀说：‘我自己的手救了我[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为单数“手”；希伯来文常以单数“手”表示权力或控制。
    reason: 说明原文单数形式及其惯用意义。
  - marker: b
    text: “救”也可译作“搭救”或“解救”。
    reason: 说明הוֹשִׁיעָה在此处可指从敌人压迫下得救或获解救。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的常见现代汉语音译，不以“耶和华”或“主”等传统译名、称号替代原文专名。
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: 跟随你的人太多
  rationale: רַב本义为“多”，结合后面的限制性说明，在此表示人数多到不适合由雅威把米甸交给他们；“跟随你的人”自然表达与基甸同在、随他出战的人。
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: 我不能把米甸交在他们手中
  rationale: מן加不定式在此表达因人数过多而不宜如此行；“交在……手中”保留“手”表示权力、控制的希伯来语意象。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达原文所引出的否定目的或所要防止的结果。
- source_word: יִתְפָּאֵר עָלַי
  choice: 向我夸耀
  rationale: התפעל词形表达自我夸耀、自高；介词עַל使这种夸耀以雅威为针对对象。“向我夸耀”既自然，也保留对抗意味。
- source_word: יָדִי הוֹשִׁיעָה לִּי
  choice: 我自己的手救了我
  rationale: 保留“我的手”作主语以及以色列作为单数集合体所说的“我”；“自己的”显明其宣称依靠自身力量得救，却不增加新的命题。
theological_decisions:
- issue: 神圣名字的译法
  choice: 雅威
  alternative: 耶和华；上主；主
  rationale: 原文使用专名יהוה，因此以音译保留其作为以色列之神个人名字的性质，不用称号替代。
- issue: 以色列作为单数集合体
  choice: “以色列……‘我自己的手救了我’”
  alternative: “以色列人……‘我们自己的手救了我们’”
  rationale: 希伯来文把“以色列”视为单数集合体，后面的“我的手”“救了我”也都是单数；保留这种表达可避免把原文的集体人格改写为复数。
- issue: 以色列夸耀的对象与对抗意味
  choice: 向我夸耀
  alternative: 在我面前自夸；夸耀自己
  rationale: 原文עָלַי不只说明夸耀发生在神面前，也可带有针对、对抗神的意味；译文保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“跟随你的人太多”比逐字式的“与你同在的百姓太多”更符合现代汉语，同时保留军事随从的语境；引语中刻意保留“我自己的手救了我”的原文意象与单数集合表达。
