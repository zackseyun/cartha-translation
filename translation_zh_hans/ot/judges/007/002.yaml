  to: 雅威对基甸说：“跟你在一起的人太多，不宜由我把米甸交在他们手中[a]，免得以色列向我夸耀说：‘我自己的手救了我[b]。’”
  rationale: 修订仅消除两处不必要的语义具体化：以“跟你在一起的人”对应“与你同在的人”，以“不宜由我”表达该句因人数过多而不应将米甸交付给他们的目的性限制；同时修正脚注a，使其准确说明原文单数“手”。其余措辞保留原译的现代庄重语体、神名音译、对雅威的对抗性夸耀，以及以色列单数集合体所说的“我”。
