source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֲזַבְתֶּ֣ם אוֹתִ֔/י וַ/תַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים לָ/כֵ֥ן לֹֽא אוֹסִ֖יף לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: zh_hans
  text: 可是你们离弃了我，去事奉别的神；所以我不再拯救你们了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“解救”或“搭救”。希伯来语动词既可指从仇敌手中解救，也可泛指拯救。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: 可是你们
  rationale: 连词加显式代词在上下文中带有强调和转折意味；“可是你们”自然体现这一对比。
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: 离弃了我
  rationale: עָזַב表示离弃、抛弃；“离弃”保留关系与盟约层面的分量，同时符合现代汉语表达。
- source_word: וַ/תַּעַבְדוּ
  choice: 去事奉
  rationale: עבד用于神明时指向敬拜、效忠和服事；“事奉”比单说“敬拜”更完整地保留其语义范围。“去”自然呈现转而服事别神的动作关系。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译为“别的神”，清楚表达这些神与耶和华相对，不额外限定为外族神。
- source_word: לָכֵן
  choice: 所以
  rationale: 明确表达前述背弃行为与随后审判宣告之间的结果关系，现代汉语自然明白。
- source_word: לֹא אוֹסִיף
  choice: 不再
  rationale: 否定式与יסף连用表示不再继续或不再重复某行动；“不再”简洁准确。
- source_word: לְ/הוֹשִׁיעַ אֶתְכֶם
  choice: 拯救你们
  rationale: ישע可指拯救、解救或搭救；本处直接涉及脱离仇敌压迫，但“拯救”也保留该词较广的圣经语义。
theological_decisions:
- issue: 士师记语境中ישע的译法
  choice: 拯救
  alternative: 解救；搭救
  rationale: 叙事中的直接含义是从压迫者手中解救，但原词语义并不限于军事或政治脱困。“拯救”既适合上下文，也保留较广的神学关联；脚注说明其他可能译法，以免读者将其仅理解为属灵意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“事奉”保留宗教效忠与服事的双重含义；分号清楚呈现背弃与审判结果之间的逻辑关系。脚注标记置于相关“拯救”陈述之后。
