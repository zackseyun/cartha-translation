  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: zh_hans
  text: 以色列人对雅威说：“我们犯了罪。你看怎样好，就怎样待我们吧；只是求你今天救我们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ בְנֵי יִשְׂרָאֵל
  choice: 以色列人对……说
  rationale: וַיֹּאמְרוּ推进叙事；בְנֵי יִשְׂרָאֵל是指以色列民族成员的常用表达。现代汉语用“以色列人”自然准确，若直译为“以色列的众子”则容易被误解为只指男性或雅各的亲生儿子。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名作为专名的性质，不以称号替代。
- source_word: חָטָאנוּ
  choice: 我们犯了罪
  rationale: 准确表达第一人称复数完成式在此处的认罪语气。
- source_word: עֲשֵׂה אַתָּה לָנוּ כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: 你看怎样好，就怎样待我们吧
  rationale: 既保留“在你眼中为好”的判断主体，也以自然汉语表达他们任凭雅威处置的意思；אַתָּה所带的强调由“你”体现。
- source_word: אַךְ
  choice: 只是
  rationale: 表达限制性的转折：他们接受神认为合宜的处置，只提出一个恳求。
- source_word: הַצִּילֵנוּ נָא
  choice: 求你救我们脱离困境
  rationale: נָא用“求你”表达恳求；נצל的使役式指从危险或敌手手中解救。补出“脱离困境”使现代汉语完整，但不限定经文未明说的具体对象。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 是该希伯来短语自然、准确的现代汉语表达，并保留眼前危机的紧迫感。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。译作“雅威”较贴近学界通常重构的读音，并避免用称号取代专名。
- issue: “你眼中看为好”的处置是否具体化
  choice: 保持开放，不说明是惩罚、赦免或其他处置
  alternative: 译成“任凭你惩罚我们”
  rationale: 原文只说照雅威眼中为好的待他们；上下文含有接受惩治的意味，但本句没有把处置明确限定为惩罚，因此不应在译文中消除这种开放性。
- issue: הַצִּילֵנוּ 的救援含义
  choice: 救我们脱离困境
  alternative: 拯救我们；搭救我们
  rationale: 此处直接语境是受外敌压迫，动词表示实际解救；避免仅用在现代读者中可能偏向属灵救恩的“拯救”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话中的“吧”和“求你”传达顺服与恳求，不使用文言化的“今日”“照你眼中所看为善的”。本节无需脚注；译文没有脚注标记。
