  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: zh_hans
  text: 于是，雅威向以色列大发烈怒[a]，把他们卖在非利士人和亚扪人的手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威向以色列的怒气燃烧起来。”
    reason: lexical_alternative
  - marker: b
    text: “卖在……手中”是《士师记》反复使用的说法，指雅威施行审判，使以色列落在敌人的权势之下。“亚扪人”原文直译为“亚扪的子孙”。
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 发怒如火燃烧
  rationale: 保留希伯来语“鼻怒燃烧/怒气点燃”的鲜明意象，同时用现代汉语可理解的表达呈现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留经文中的专名，而不以称号替代。
- source_word: בְּיִשְׂרָאֵל
  choice: 向以色列
  rationale: 在发怒这一搭配中，介词 ב 表示怒气所针对的对象；“向以色列发怒”符合现代汉语习惯。
- source_word: וַיִּמְכְּרֵם
  choice: 把他们卖在
  rationale: 保留 מכר“卖”的基本义和《士师记》中反复出现的审判意象，不弱化为较解释性的“交给”。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语以“手”表示权势和控制的具体意象；“卖在……手中”在中文圣经语体中清楚而凝练。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族名通行的现代汉语译名。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 此处是指亚扪族，采用自然、通行的族名；字面形式为“亚扪的子孙”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，也避免用称号“主”取代原文名称。
- issue: וַיִּמְכְּרֵם 所描绘的神圣审判
  choice: 把他们卖在……手中
  alternative: 把他们交在……手中
  rationale: 原文明确以“卖”描写雅威主动使以色列受外敌辖制；保留这一措辞，可呈现《士师记》反复使用的严厉审判意象，而不淡化神的行动主体性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“发怒如火燃烧”保留原文隐喻；“卖在……手中”刻意保留《士师记》的关键词及“手”所表达的辖制意象。所有脚注标记均置于相关正文之后。
