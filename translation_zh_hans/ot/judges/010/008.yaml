- from: 那一年，他们击垮、压碎了以色列人[a]；他们欺压所有住在约旦河对岸、基列境内亚摩利人之地的以色列人，共十八年[b]。
  to: 从那一年起，他们击垮、压碎了所有住在约旦河对岸、亚摩利人之地，即基列的以色列人，长达十八年[a]。
  rationale: 修订使原文的两个动词直接涵盖十八年的持续时间，不再在正文补入“欺压”。保留“从那一年起”以使中文时间关系自然，并用脚注简要说明原文紧凑句法及动词的近义强化。
