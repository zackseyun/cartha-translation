base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: zh_hans
  text: 从那一年起，他们击垮、压碎了所有住在约旦河对岸、亚摩利人之地，即基列的以色列人，长达十八年[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连用两个含义相近而语气强烈的动词，也可译作“打垮、欺压”。这里将“十八年”连于这两个动词，表达这场苦难持续十八年；原文后半句未另写出一个动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֲצוּ
  choice: 他们击垮
  rationale: 该动词有猛烈打破、摧毁之意；“击垮”既保留其强烈形象，也适合描述对一个民族的暴力压迫。
- source_word: וַיְרֹצְצוּ
  choice: 压碎了
  rationale: 与前一动词构成近义强化。“压碎”保留原文生动而沉重的措辞，不将两个动词弱化为一个抽象的“欺压”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语通常以“以色列人”自然表达这一希伯来习语；本节两处均采用同一译法，以保留重复。
- source_word: בַּשָּׁנָה הַהִיא
  choice: 那一年
  rationale: 直接、自然地保留原文的时间表达。
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: 共十八年
  rationale: “共”清楚表明十八年是持续时段，同时避免误读为人数或日期。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河对岸
  rationale: 保留原文以叙述视角表达的“约旦河那边”，不擅自改成特定方位“东岸”；地理语境虽指河东，原文本身并未使用“东”字。
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: 亚摩利人之地
  rationale: 原文“亚摩利人”为集合性单数，所指是其地域；此译法正式且清楚。
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: 基列境内
  rationale: 以自然汉语表达该关系从句，说明所指亚摩利人之地位于基列。
theological_decisions:
- issue: “那一年”与“十八年”的句法关系
  choice: 将前两个猛烈动词归于“那一年”，并在后半句补出“欺压”，使十八年的持续压迫表达完整。
  alternative: 可将整句理解为：从那一年起，他们击垮、压碎以色列人达十八年。
  rationale: 希伯来文在“十八年”前后句法高度压缩，后半没有明写新的动词。所选译法反映马所拉停顿及上下文中的持续压迫，同时用脚注保留另一种合理理解，不把句法歧义伪装成确定无疑。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“击垮、压碎”保留希伯来文两个强烈近义动词的排比；“约旦河对岸”保留原文相对方位，不在正文中过度明确为“东岸”。
