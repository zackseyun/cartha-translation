  text: וַ/יַּעַבְר֤וּ בְנֵֽי עַמּוֹן֙ אֶת הַ/יַּרְדֵּ֔ן לְ/הִלָּחֵ֛ם גַּם בִּ/יהוּדָ֥ה וּ/בְ/בִנְיָמִ֖ין וּ/בְ/בֵ֣ית אֶפְרָ֑יִם וַ/תֵּ֥צֶר לְ/יִשְׂרָאֵ֖ל מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: zh_hans
  text: 亚扪人渡过约旦河，又去攻打犹大、便雅悯和以法莲家；以色列极其困苦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列的处境极其艰难。”
    reason: 原文וַתֵּצֶר לְיִשְׂרָאֵל是非人称式结构，既可着重表达以色列人的困苦，也可着重表达以色列所处的艰难局面。
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: 渡过
  rationale: 该动词以“约旦河”为宾语，明确表示越过河流；“渡过”在现代汉语叙事中具体而自然。
- source_word: בְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 这是族群称谓；译作“亚扪人”比直译“亚扪的子孙”更符合现代汉语习惯。
- source_word: אֶת הַיַּרְדֵּן
  choice: 约旦河
  rationale: 希伯来文只写“约旦”，但现代汉语通常称“约旦河”，可清楚表达这里所渡过的地理实体。
- source_word: לְהִלָּחֵם
  choice: 去攻打
  rationale: 此处表示参与战争；结合后面的目标对象，译作“去攻打”比笼统的“争战”更清楚自然。
- source_word: גַּם
  choice: 又
  rationale: 承接上文约旦河东的战事，表示亚扪人进一步越河攻击其他地区；“又”准确体现其追加含义。
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: 犹大、便雅悯和以法莲家
  rationale: 介词בְּ在“争战”的语境中标示敌对行动所针对的对象。“以法莲家”保留בֵּית的群体性表达，不将其简化为“以法莲”。
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: 以色列极其困苦
  rationale: 原文采用非人称式表达，字面近于“以色列极其窘迫”。汉语改以“以色列”为主语，既自然，也保留严重困境的含义；“极其”对应מְאֹד的强烈程度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“渡过约旦河”“去攻打”保持动作清晰；“以法莲家”保留原文的群体称谓。脚注标在其实际对应的末句，而非置于“犹大”之后。
