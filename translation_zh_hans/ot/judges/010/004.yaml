  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: zh_hans
  text: 他有三十个儿子，骑着三十头驴驹；他们有三十座城，直到今日，人们仍称这些城为“哈倭特·睚珥”。这些城都在基列地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲיָרִים
  choice: 驴驹
  rationale: 此词在本节首次出现时是עַיִר（驴驹）的复数，指可供骑乘的幼驴；译作“驴驹”既保留原文与后一个同音词“城”的文字呼应，也符合现代汉语。
- source_word: עֲיָרִים
  choice: 城
  rationale: 第二次出现的是עִיר（城）的复数，语境明确指三十座城；采用“城”以呈现原文同形近音的双关。
- source_word: חַוֺּת יָאִיר
  choice: 睚珥村落
  rationale: 该地名由“村落/营地”与人名“睚珥”构成；以半意译方式保留专名，同时让普通读者看出其所指是一组聚落。
- source_word: יִקְרְאוּ
  choice: 人们仍称
  rationale: 希伯来语第三人称复数可作不定主语，直译为“他们称”；汉语用“人们称”更自然，并避免误解为睚珥的儿子们在命名。
- source_word: אֶרֶץ הַגִּלְעָד
  choice: 基列地
  rationale: 沿用成熟的圣经地名译法，并准确表达该地区。
