  source_fidelity: 译文准确保留了三十个儿子、三十头供骑乘的驴驹、三十座城，以及这些城在基列地并沿用至今的名称。惟חַוֺּת יָאִיר在本节作为既有地名，宜以音译保留，而不直接译成普通名词性短语“睚珥村落”。
