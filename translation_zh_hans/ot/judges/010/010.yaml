base_translation:
  language: en
  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: zh_hans
  text: 以色列人就向耶和华呼求，说：“我们得罪了你，因为我们离弃了我们的上帝，去事奉众巴力。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: 就……呼求
  rationale: 表达在困境中大声求告的含义，并以“就”承接上文叙事。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语叙事中自然地指以色列民族；不机械译作“以色列的儿子们”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的上帝专名译法，区别于一般称谓“主”。
- source_word: חָטָאנוּ לָךְ
  choice: 我们得罪了你
  rationale: 既保留“犯罪”的道德与神学含义，也自然表达其对象是上帝。
- source_word: עָזַבְנוּ
  choice: 离弃
  rationale: 准确体现主动背弃关系与忠诚的强烈含义。
- source_word: וַנַּעֲבֹד
  choice: 去事奉
  rationale: “事奉”适合宗教敬拜语境；“去”自然呈现从离弃上帝转而服事巴力的关系。
- source_word: הַבְּעָלִים
  choice: 众巴力
  rationale: 保留希伯来语复数，指各地或各种形态的巴力神祇，避免误作单一对象。
theological_decisions:
- issue: 罪与离弃上帝、事奉巴力之间的逻辑关系
  choice: 译作“因为”
  alternative: 译作“并且／就是”
  rationale: כִּי在此最自然地引出认罪的根据或具体内容；“因为”保留因果读法，同时上下文仍可理解为对罪的具体说明。
- issue: 上帝专名的呈现
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 以中文读者熟悉且明确为专名的形式呈现四字神名，不以泛称“主”替代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“向耶和华呼求”符合叙事与祷告语境；引语简洁直接。保留“我们的上帝”与“众巴力”的对照，并保留原文因果连接所具有的神学力度。
