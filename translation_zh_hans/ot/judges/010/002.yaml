  yaml_path: translation/ot/judges/010/002.yaml
  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: zh_hans
  text: 他作以色列的士师二十三年。后来他死了，葬在沙密。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: 他作以色列的士师
  rationale: שׁפט在《士师记》的语境中指士师对以色列施行治理和领导。译作“作以色列的士师”既保留全书反复出现的士师术语，也比单说“审判以色列”更准确自然。
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: 二十三年
  rationale: 按现代汉语习惯表达数目，完整保留原文所述年数。
- source_word: וַיָּמָת
  choice: 后来他死了
  rationale: 叙事性连续式推进事件次序；“后来”自然表达后续发展，又不增加因果或转折含义。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 希伯来语尼法勒式表达被动意义；汉语“葬在”可自然传达“被安葬”，且不补出执行安葬的人。
- source_word: בְּשָׁמִיר
  choice: 在沙密
  rationale: 介词בְּ表示地点；שָׁמִיר为地名，依常见中文圣经音译作“沙密”。
