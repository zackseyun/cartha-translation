  yaml_path: translation/ot/judges/010/003.yaml
  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: zh_hans
  text: 继他之后，基列人睚珥兴起，作以色列的士师二十二年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם אַחֲרָיו
  choice: 继他之后……兴起
  rationale: קום与“在他之后”构成士师叙事中的承接表达，表明下一位领袖出现；译文保留“兴起”的叙事色彩，同时清楚表达先后关系。
- source_word: יָאִיר
  choice: 睚珥
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: הַגִּלְעָדִי
  choice: 基列人
  rationale: 该地域称谓表示睚珥来自基列或归属于基列；“基列人”简洁自然，并保留原文的地域身份。
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: 作以色列的士师
  rationale: 在《士师记》中，שפט所指不只是现代意义上的司法审判，也包括士师的治理和领导职能；此译法既保持全书核心称谓，又避免“审判以色列”可能造成的狭义误解。
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: 二十二年
  rationale: 按现代汉语习惯准确表达原文所述任期。
theological_decisions:
- issue: שפט在《士师记》中的职能范围
  choice: 作以色列的士师
  alternative: 治理以色列／审判以色列
  rationale: “作……的士师”保留本书反复出现的神学与叙事称谓，同时让其领导、治理和施行判断的广义职能由上下文承载，不将其缩减为单纯司法活动。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“继他之后……兴起”略带正式叙事风格，与《士师记》的领袖承接公式相称；本节无需脚注。
