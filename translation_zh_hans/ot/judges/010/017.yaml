  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: zh_hans
  text: 那时，亚扪人发出呼喊[a]，在基列安营；以色列人聚集，在米斯巴安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚扪人被召集起来。”希伯来语动词通常表示“呼喊”；在这里的军事语境中，也可能指为作战而被召集或集结。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: 被召集起来
  rationale: צעק通常表示“呼喊”，但本节紧接着描述军队安营，语境很可能指为作战而被召集。译文采用“被召集起来”，同时用脚注保留“呼喊”的真实词义可能。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 原文直译为“亚扪的众子”，在这里是民族称谓；“亚扪人”符合现代汉语习惯并准确指明群体。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指扎营、驻营；“安营”自然、简洁，也保留军事叙事色彩。
- source_word: בַּגִּלְעָד
  choice: 在基列
  rationale: 介词ב与地区名连用，此处表示在基列境内。
- source_word: וַיֵּאָסְפוּ
  choice: 聚集起来
  rationale: אסף表示聚集、集合；此处描述以色列人为应战而会合，“聚集起来”保留叙事动作。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，这里是对以色列群体的惯常称谓；现代汉语用“以色列人”清楚自然，不额外限定为男性。
- source_word: בַּמִּצְפָּה
  choice: 在米斯巴
  rationale: 介词ב在此标明安营地点；“在米斯巴”符合现代汉语地点表达。
