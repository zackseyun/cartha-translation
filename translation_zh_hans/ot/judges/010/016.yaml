  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: zh_hans
  text: 他们就从他们中间除掉外邦神明，事奉耶和华；他再也无法忍受以色列的苦难[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他对以色列的苦难不再有耐心。”希伯来文直译为“他的心（或生命）因以色列的苦难而变短了”，这是表示不耐或再也无法忍受的习语。
    reason: 说明וַתִּקְצַר נַפְשׁוֹ这一拟人化希伯来语习语的字面形式，并保留“不耐”与“无法继续忍受”的相近解释。
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: 除掉
  rationale: 该词是סור的使役形，表示使某物离开、移除；“除掉”既具体又自然，符合他们弃绝偶像的语境。
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: 外族神明
  rationale: 该词组指非以色列民族所敬奉的神；“外族神明”比“陌生的神”更准确，也避免把重点误解为地域来源。
- source_word: מִקִּרְבָּם
  choice: 他们中间的
  rationale: 原义为“从他们中间”；与“除掉”组合为“除掉他们中间的……”，自然保留群体内部清除偶像的含义。
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: 事奉耶和华
  rationale: עבד在以神为对象时兼有敬拜、效忠和服事之意；“事奉”比单纯的“敬拜”更能保留其广泛的盟约含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名形式，明确表达原文的神圣名号，而不以“主”替代。
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: 他……焦急难耐
  rationale: 原文直译为“他的心/生命变短了”，是表示不耐、无法继续忍受的习语。“焦急难耐”在自然中文中兼顾了情感上的焦急与承受已近极限的意思，未把原文限定为单一解释。
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: 因以色列的苦难
  rationale: עָמָל可指劳苦、患难或痛苦；本段描述以色列受压迫，“苦难”最符合语境。“因”表达ב在此所指向的缘由或对象。
theological_decisions:
- issue: וַתִּקְצַר נַפְשׁוֹ以拟人化方式描述耶和华
  choice: 保留为带有强烈情感和承受限度意味的“他……焦急难耐”
  alternative: 他再也忍受不了以色列的苦难了
  rationale: 原文以鲜明的拟人习语描绘耶和华对以色列苦难的回应。“焦急难耐”不将其淡化为抽象的怜悯，也不完全锁定为“不能忍受”，从而保留原文在不耐与不忍之间的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“外族神明”清楚表达非以色列的神祇；分号连接以色列的悔改行动与耶和华的回应。代词“他”的先行词是紧邻的“耶和华”，既自然又避免无根据地重复补写神名。
