  to: 他们就从他们中间除掉外邦神明，事奉耶和华；他再也无法忍受以色列的苦难[a]。
  rationale: 修订末句以准确表达原文习语的主要语义，避免“焦急”所带来的额外心理色彩；脚注保留字面表达与替代译法，从而不把拟人化语言或其解释限定为单一神学结论。首句微调为更通行的中文圣经用语，并明确“从他们中间”这一空间/群体意义。
