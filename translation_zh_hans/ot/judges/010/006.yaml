language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: zh_hans
  text: 以色列人又行[a]耶和华眼中看为恶的事，侍奉众巴力和众亚斯她录，以及亚兰的神、西顿的神、摩押的神、亚扪人的神[b]和非利士人的神。他们离弃耶和华，不侍奉他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “又行”也可译作“继续行”。希伯来语动词既可表示重复，也可表示继续。
    reason: lexical_alternative
  - marker: b
    text: “亚扪人的神”，希伯来语直译“亚扪子孙的神”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: 又行
  rationale: יסף与不定式连用可表示重复或继续；结合《士师记》的循环叙事，“又行”自然地表达再次犯罪，同时以脚注保留“继续行”的可能。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语中“以色列人”自然、清楚，准确指以色列群体；直译“以色列的众子”在此显得生硬。
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: 行耶和华眼中看为恶的事
  rationale: 保留希伯来语“在……眼中”的评价意象，同时采用庄重而通顺的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，在正文中将四字神名作为专名呈现，而非以称号替代。
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: 侍奉／侍奉他
  rationale: 前后统一译为“侍奉”，保留同一词根形成的强烈对照，并兼顾敬拜、效忠和服事的含义。
- source_word: הַבְּעָלִים
  choice: 众巴力
  rationale: 复数形式指各地所崇奉的巴力；“众巴力”既保留专名，也体现希伯来语复数。
- source_word: הָעַשְׁתָּרוֹת
  choice: 众亚斯她录
  rationale: 以专名音译并用“众”表示复数，与“众巴力”构成平行。
- source_word: אֱלֹהֵי אֲרָם
  choice: 亚兰的神
  rationale: 保留古代地域专名“亚兰”，不以后来的“叙利亚”替换。
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: 亚扪人的神
  rationale: 按现代汉语习惯表达“亚扪子孙所敬奉的神”；该短语的字面形式在脚注中说明。
- source_word: אֱלֹהֵי פְלִשְׁתִּים
  choice: 非利士人的神
  rationale: 直接清楚地表达属民族的关系，并保留族名。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用的是神的专名。正文采用中文圣经传统中广为人知的“耶和华”，不以“主”替代，从而保留专名性质；“雅威”是较接近学术重构读音的另一种音译。
- issue: 偶像崇拜语境中עבד的译法
  choice: 侍奉
  alternative: 敬拜
  rationale: 本节前后两次使用同一动词，分别指侍奉诸神和不侍奉耶和华。“侍奉”能保留词语重复与效忠关系；“敬拜”虽符合语境，却会弱化后半句与前半句的词汇呼应。
translation_notes:
  register: 采用现代、庄重且适合公众阅读的简体中文。正文保持《士师记》叙事公式的节奏，并以重复的“侍奉”凸显以色列转向诸神、离弃耶和华的对照。所有脚注标记均置于相关正文位置。
