base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: zh_hans
  text: 西顿人、亚玛力[a]和玛云[b]欺压你们；你们向我呼求，我就从他们手中救了你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚玛力人”。希伯来文作“亚玛力”，可用来统指这个族群。
    reason: lexical_alternative
  - marker: b
    text: 或译“玛云人”。希伯来文作“玛云”，这里很可能是指与玛云有关的族群。
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: 西顿人
  rationale: 这是表示西顿居民或族群的复数称谓；“西顿人”是现代中文简洁自然的表达。
- source_word: עֲמָלֵק
  choice: 亚玛力
  rationale: 希伯来文采用专名“亚玛力”，在此可代指整个族群；正文保留专名形式，另以脚注说明“亚玛力人”这一显明族群含义的译法。
- source_word: מָעוֹן
  choice: 玛云
  rationale: 马所拉文本采用专名“玛云”；上下文表明它很可能指相关族群，但正文保留原文的专名形式，并在脚注列出“玛云人”。
- source_word: לָחֲצוּ
  choice: 欺压
  rationale: 该动词表示以敌对方式压迫、逼迫；“欺压”符合外族辖制以色列人的语境，也自然易懂。
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: 你们向我呼求
  rationale: 既保留向上帝发出求助的方向，也传达危难中迫切求救的语气。
- source_word: וָאוֹשִׁיעָה
  choice: 我就……救了你们
  rationale: ישׁע表示拯救、解救；“救”直接清楚，并保留圣经中救恩词汇的关联。
- source_word: מִיָּדָם
  choice: 从他们手中
  rationale: 原文直译为“从他们的手”，意指脱离他们的权势或控制；中文“从他们手中”既保留该意象，又自然通顺。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用分号呈现欺压、呼求与施救之间的推进关系；“从他们手中”保留希伯来语的具体意象。英文咨询层的脚注标记位置与脚注内容不相符，中文稿依原文词项将[a]置于“亚玛力”后、[b]置于“玛云”后。
