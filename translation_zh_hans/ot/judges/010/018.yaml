base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: zh_hans
  text: 基列的民众，即基列的首领[a]，彼此说[b]：“哪一个男子先开始攻打亚扪人，他就要作基列所有居民的领袖。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文把“民众”和“基列的首领”直接并列，也可理解为：“民众和基列的首领”。
    reason: 保留原文并列结构可能有的句法歧义。
  - marker: b
    text: 希伯来文直译：“各人对同伴说。”
    reason: 说明“彼此说”所表达的原文分配式、相互性说法。
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: 基列的民众，就是基列的首领
  rationale: 希伯来文将“民众”和“基列的首领”直接并列，没有连接词。正文按同位关系理解，即发言的民众具体指基列的首领，同时用脚注保留句法上的含混。
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: 彼此说
  rationale: 这是现代汉语表达相互交谈最自然的说法；原文字面形式在脚注中说明。
- source_word: מִי הָאִישׁ
  choice: 哪个男子
  rationale: 保留 אִישׁ 在此军事领袖遴选语境中的明确男性指称，不淡化为单纯的“谁”。
- source_word: יָחֵל לְהִלָּחֵם
  choice: 先去攻打
  rationale: יָחֵל 是“开始”，与“攻打”结合时译作“先去攻打”既体现率先开战的意思，也符合自然现代汉语。
- source_word: בִּבְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 原文字面为“亚扪的众子”，在这里是民族称谓；“亚扪人”是准确、自然的现代汉语对应表达。
- source_word: יִהְיֶה לְרֹאשׁ
  choice: 他就要作……的领袖
  rationale: 保留 רֹאשׁ 的领导含义，并以“就要作”表达率先出战所带来的结果。
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: 基列所有居民
  rationale: 准确表达所有住在基列之人的整体范围，以及领袖对他们的统辖关系。
theological_decisions:
- issue: 领袖遴选语境中的阳性用语
  choice: 哪个男子
  alternative: 谁；哪个人
  rationale: 原文明确使用 אִישׁ，且语境是挑选古代军事领袖；正文保留其男性指称，避免无根据地中性化。
- issue: 发言者“民众”与“基列首领”的关系
  choice: 按同位语处理：“基列的民众，就是基列的首领”
  alternative: 只译“基列的首领”；或把两者视为两个群体
  rationale: 原文无连接词地并列两个称谓。同位理解最能保留两项内容，但句法仍有含混，因此以脚注说明。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“领袖”清楚表达政治与军事上的统领身份；句式保留原文的问答式条件关系，同时避免生硬的逐词直译。
