revisions:
- from: 基列的民众，就是基列的首领[a]，彼此说[b]：“哪个男子先去攻打亚扪人，他就要作基列所有居民的领袖。”
  to: 基列的民众，即基列的首领[a]，彼此说[b]：“哪一个男子先开始攻打亚扪人，他就要作基列所有居民的领袖。”
  rationale: 修订仅作两项轻微而安全的调整：以“即”取代带较强断定色彩的“就是”，并将“先去攻打”改为“先开始攻打”，避免加入原文未明示的位移动作。保留对并列名词结构的脚注说明、明确阳性的“男子”、以及原文的条件—结果关系。
