base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: zh_hans
  text: 亚比米勒之后，以萨迦人多拉兴起，拯救以色列。他是普瓦的儿子、多多的儿子[a]，住在以法莲山区的沙密。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “多多的儿子”所据的希伯来语也可理解为“他叔父的儿子”。“多多”可读作人名；相关形式也可作“他的叔父”理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: 兴起
  rationale: 在本段叙事中指一位领袖继亚比米勒之后出现；“兴起”保留了原文的叙事意味，又不额外暗示正式任命。
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: 亚比米勒之后
  rationale: 按自然汉语表达明确呈现叙事中的时间先后关系。
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: 拯救以色列
  rationale: הושׁיע 可指救助、解救；“拯救”既符合士师记的救援语境，也不把含义限缩为纯军事行动。
- source_word: תּוֹלָע
  choice: 多拉
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בֶּן־פּוּאָה בֶּן־דּוֹדוֹ
  choice: 普瓦的儿子、多多的孙子
  rationale: 连续的父系谱系在汉语中自然表达为“某人的儿子、某人的孙子”；“多多”依马所拉读音视为专名，另在脚注保留普通名词读法。
- source_word: אִישׁ יִשָּׂשכָר
  choice: 以萨迦人
  rationale: 自然、简洁地表达其支派归属。
- source_word: וְהוּא יֹשֵׁב
  choice: 住在
  rationale: 分词结构说明其居住地点，“住在”是自然的现代汉语。
- source_word: בְּשָׁמִיר
  choice: 在……沙密
  rationale: 地名按通行形式音译。
- source_word: בְּהַר אֶפְרָיִם
  choice: 以法莲山区
  rationale: 该地理表达指以法莲的丘陵地带；“山区”在现代汉语中简明自然，避免让读者误解为单独一座山。
