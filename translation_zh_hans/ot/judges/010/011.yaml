source:
  edition: WLC
  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: zh_hans
  text: 雅威对以色列人[a]说：“我岂没有救你们脱离埃及、亚摩利人、亚扪人和非利士人吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 本节希伯来文省略了“救你们”这一动作，译文根据上下文补出。
    reason: textual_clarity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的叙事性未完成式在引出直接引语时，现代汉语通常译为“说”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现上帝的专名，而不以称号替代。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在此是指以色列民族；“以色列人”自然清楚，直译信息以脚注保留。
- source_word: הֲלֹא
  choice: 岂没有……吗
  rationale: 该否定疑问词引出带有肯定预期的反问；这一汉语句式既保留反问语气，也能容纳按上下文补出的动词。
- source_word: מִמִּצְרַיִם
  choice: 脱离埃及
  rationale: מִן表示来源或脱离；与按上下文补出的“救”结合后，“脱离埃及”准确而自然。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文为单数集合名词，在此指亚摩利族群，汉语用族名“亚摩利人”。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 该短语字面为“亚扪的众子”，在此是标准族群称谓，译作“亚扪人”最自然。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族名在现代中文圣经语境中的通行译法。
- source_word: '[按上下文隐含的动词]'
  choice: 救你们
  rationale: 本节希伯来文是省略句，动作须由上下文补足；“救”符合士师记反复出现的从压迫者手中施救之意，又不额外限定为属灵救恩。
theological_decisions:
- issue: 如何翻译神名יהוה
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地音译四字神名，保留其作为以色列之神专名的功能；不将其改为“主”等称号。
- issue: 是否直译בְּנֵי יִשְׂרָאֵל的亲属称谓
  choice: 正文译“以色列人”，脚注注明字面形式
  alternative: 以色列的众子
  rationale: 这里的短语作为民族整体的称谓；正文采用现代汉语自然说法，同时以脚注保存原文形式，避免让“众子”被误解为仅指直系男性后裔。
- issue: 是否补出省略的施救动词
  choice: 补作“救你们”并加脚注说明
  alternative: 保留残句：“岂不是从埃及、亚摩利人、亚扪人和非利士人……”
  rationale: 原文此处依赖上下文，若机械保留省略，现代汉语会成为难以理解的残句；补出“救你们”使反问完整，同时公开标明这一补足，不掩盖原文的省略现象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“岂没有……吗”保留原文反问力度；族名沿用中文圣经语境中易于辨认的传统译名。
