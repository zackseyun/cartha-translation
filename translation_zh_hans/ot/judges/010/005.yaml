lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות在此是叙事中表示死亡的普通动词；“死了”直接、自然，不采用较委婉的“去世了”。
- source_word: יָאִיר
  choice: 雅珥
  rationale: 按现代中文圣经人名的通行音译处理，保留其作为专名的功能。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: קבר的尼斐尔式表示被安葬；中文在明确主语的连续叙事中用“葬在”即可自然表达被动含义，避免生硬的“被埋葬”。
- source_word: בְּקָמוֹן
  choice: 在加们
  rationale: 介词בְּ在此表示地点；“在”最自然地引出安葬地点，地名קָמוֹן音译为“加们”。
