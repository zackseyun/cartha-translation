  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: zh_hans
  text: 去吧，向你们所选择的那些神呼求！就让他们在你们遭难时救你们吧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们会在你们遭难时救你们。”希伯来语的动词形式可以表示简单将来时，但在本节语境中是反讽性的挑战。
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: 去吧
  rationale: 这是复数命令式，在上下文中带有严厉斥退的语气。“去吧”既自然，也保留了直接命令的力度。
- source_word: וְזַעֲקוּ
  choice: 呼求
  rationale: זעק 指人在危难中大声求助；“呼求”既表达迫切求援，也适合向神明求告的语境。
- source_word: אֶל הָאֱלֹהִים
  choice: 向……那些神
  rationale: 虽然 אֱלֹהִים 的形式本身可能有数的歧义，但本节的复数代词和动词，以及上下文所指的外邦诸神，都明确要求复数理解。
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: 你们所选择的
  rationale: בחר 与介词 ב 连用表示选择某对象；现代汉语用“选择”即可自然准确地表达。
- source_word: הֵמָּה
  choice: 就让他们
  rationale: 独立代词 הֵמָּה 强调这些神本身；“就让他们”在自然汉语中保留了这一强调和反讽挑战的语气。
- source_word: יוֹשִׁיעוּ
  choice: 救你们吧
  rationale: ישׁע 的使役词干表示拯救、解救。结合语境，此处不是平直的预告，而是讽刺性的挑战；“救你们吧”能保留这一话语功能。
- source_word: בְּעֵת צָרַתְכֶם
  choice: 在你们遭难时
  rationale: 该短语直指他们陷入困境、患难的时候；“遭难时”简洁自然，并与求救和拯救的语境相合。
theological_decisions:
- issue: יוֹשִׁיעוּ 在本节中的语气
  choice: 按反讽性的命令或挑战译为“就让他们……救你们吧”
  alternative: 按简单将来时译为“他们会救你们”或“他们必救你们”
  rationale: 本节是耶和华责备以色列人离弃他、转去事奉别神。语境显示这句话是在挑战他们向自己选择的神寻求拯救，而不是肯定那些神真能施救。正文保留这种反讽力度，脚注则说明希伯来语形式也可作简单将来时理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“去吧”保留严厉斥责的口吻；“呼求”和“遭难”符合圣经叙事语域，但不显陈旧。用“他们”回指人格化的诸神，在汉语中比“它们”更自然，也与原文复数人称代词的表达相称。
