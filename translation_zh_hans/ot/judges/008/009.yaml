  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: zh_hans
  text: 他又对毗努伊勒人[a]说：“我平安归来[b]时，必拆毁这座塔[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“毗努伊勒的男人”；这里可能指城中的男性领袖或代表，并不一定指所有居民。
    reason: cultural_note
  - marker: b
    text: “平安归来”也可理解为“安全无恙地归来”或“得胜归来”；原文直译为“在平安中归来”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“塔”可能指毗努伊勒城内用于防御的坚固塔楼或堡垒。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 又
  rationale: 承接基甸先前对疏割人的话，简洁自然地表达附加关系。
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: 对毗努伊勒的男人
  rationale: אַנְשֵׁי字面指“男人”；保留其性别所指，同时脚注说明在城镇事务语境中可能特指男性领袖或代表。
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: 我平安归来时
  rationale: בְּשׁוּבִי表达“我归来时”，בְשָׁלוֹם字面为“平安地”，在战事语境中也可包含安全无恙、得胜归来的意思；正文保留原文的表达张力。
- source_word: אֶתֹּץ
  choice: 必拆毁
  rationale: נתץ表示拆除、摧毁建筑物；“拆毁”准确而有力度。“必”自然传达此处未完成式在威胁宣告中的确定语气。
- source_word: הַמִּגְדָּל הַזֶּה
  choice: 这座塔
  rationale: מִגְדָּל通常指塔；不在正文中直接解释为堡垒，以免抹去原文具体意象。
