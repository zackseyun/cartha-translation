  source_fidelity: 准确传达了希伯来文的叙事顺序与重点：“一定给”恰当地表达绝对不定式加限定动词所带来的强调，未擅自加入“乐意”等情态；“铺开那件外衣”“各人”“自己战利品中的”也分别对应原文的定冠词、分配性单数和第三人称单数后缀。“扔在那里”保留了动词较强的动作意味及שָׁמָּה（“在那里”）的指向，而不把地点过度释义为“扔在衣服上”。
