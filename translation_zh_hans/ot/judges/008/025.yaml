base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: zh_hans
  text: 他们说：“我们一定给。”于是铺开那件外衣[a]，各人把自己战利品中的一个环[b]扔在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外衣”也可译作“衣服”或“披衣”；他们把它铺开，用来收集这些环。
    reason: cultural_note
  - marker: b
    text: “环”可指耳环，也可指鼻环；结合上一节，传统上常译作“耳环”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: 我们一定给
  rationale: 希伯来文以绝对不定式配合同词根限定动词加强语气，表达明确、强调的承诺；“一定给”自然保留这种强调，不额外加入“乐意”的意思。宾语可由上一节得知，中文不必补出。
- source_word: הַשִּׂמְלָה
  choice: 那件外衣
  rationale: שִׂמְלָה 泛指衣服，常指可铺开的外衣或披衣；此处以“外衣”呈现其具体用途，而指示语气承接叙事中的这件衣物。
- source_word: וַיִּפְרְשׂוּ
  choice: 铺开
  rationale: פרשׂ 表示展开、铺开；用于衣物时，“铺开”简洁自然。
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: 扔在那里
  rationale: שלך 的动作强于普通的“放”，而 שָׁמָּה 明说“在那里”；译文保留原文表达，不将其解释性地改成“扔在衣服上”。
- source_word: אִישׁ
  choice: 各人
  rationale: אִישׁ 在此作分配用法，意为每一个人；“各人”既准确又符合现代汉语叙事。
- source_word: נֶזֶם
  choice: 环
  rationale: נֶזֶם 可指耳环或鼻环，单凭本节不能完全确定佩戴位置；正文用较宽泛的“环”保留词义歧义，并在脚注说明。
- source_word: שְׁלָלוֹ
  choice: 自己战利品中的
  rationale: שָׁלָל 指战争中夺得的战利品，三单阳性后缀配合分配性的 אִישׁ；中文用“各人把自己战利品中的”自然表达这种对应关系。
theological_decisions: []
