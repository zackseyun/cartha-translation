  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: zh_hans
  text: 于是，约阿施的儿子耶路巴力去住在自己的家里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“去了，住在自己的家里”或“去，在自己的家里定居”。希伯来文“去”本身没有明确说明方向；“住”也可表示“定居”，并非仅指坐下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 回去
  rationale: הלך本义为“去、行走”；结合前文征战叙事及后接“住在自己家里”，中文用“回去”自然表达他离开公共行动场景、归家的语境方向。原词本身未明说“返回”，因此在脚注注明较直译的可能。
- source_word: יְרֻבַּעַל
  choice: 耶路巴力
  rationale: 按本节希伯来文本实际使用的人名音译，不以更常见的别名“基甸”替代。
- source_word: בֶּן יוֹאָשׁ
  choice: 约阿施的儿子
  rationale: 直接表达标准的父子属格结构，并采用现代汉语自然语序。
- source_word: וַיֵּשֶׁב
  choice: 住
  rationale: ישב可指“坐、居住、定居”；与“在自己家里”连用时，语境所指是居住，而非单纯坐下。
- source_word: בְּבֵיתוֹ
  choice: 在自己家里
  rationale: 保留介词、名词“家/房屋”及第三人称男性单数所属后缀；“自己”在中文中清楚呈现其本人的家。
- source_word: וַ...וַ
  choice: 就回去，住在
  rationale: 以“就”和顺承分句体现两个连续叙事动词，兼顾希伯来语叙事推进和现代中文流畅度。
