  to: 他来到疏割人那里，对他们说：“看，西巴和撒慕拿就在这里！你们曾因他们讥讽我[a]，说：‘西巴和撒慕拿已经落在你手里了吗[b]，难道我们就该把饼给你那些疲惫的人吗？’”
