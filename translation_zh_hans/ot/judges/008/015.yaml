base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: zh_hans
  text: 他来到疏割人那里，对他们说：“看，西巴和撒慕拿就在这里！你们曾因他们讥讽我[a]，说：‘西巴和撒慕拿已经落在你手里了吗[b]，难道我们就该把饼给你那些疲惫的人吗？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “讥讽”也可译作“羞辱”或“嘲弄”。原文动词含有轻蔑责难的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“西巴和撒慕拿的手掌现在在你手里吗？”这是表示“他们已经被你擒获、受你控制了吗？”的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: 疏割人
  rationale: 原文直译为“疏割的男人们”，语境指当地受基甸质问的男性居民或领袖；现代汉语用“疏割人”自然涵盖这一群体，又不无根据地缩窄为官长。
- source_word: הִנֵּה
  choice: 看，……就在这里
  rationale: 该指示词要求听者注意眼前的人；这样既传达现场展示的语气，也比“看哪”更符合现代普通话。
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: 西巴和撒慕拿
  rationale: 按现代中文圣经人名的惯用音译处理。
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: 你们曾拿他们讥讽我
  rationale: חרף含轻蔑、羞辱性的责难；“讥讽我”体现敌意和嘲弄，“拿他们”则保留责难与这两人有关的关系。
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: ……已经落在你手里了吗
  rationale: 保留原文“在你手里”的形象，同时用“落在”清楚表达被擒获、受控制的惯用含义；עַתָּה在反问中译作“已经”。
- source_word: כִּי נִתֵּן
  choice: 我们就该……？
  rationale: כִּי在此承接反问所暗示的结果或理由；“就该”自然呈现疏割人拒绝供粮的嘲讽语气。
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: 给你那些疲惫的人
  rationale: יְעֵפִים指追赶后困乏疲惫；“人”对应אֲנָשִׁים，并避免添加原文没有的军队称谓。
- source_word: לָחֶם
  choice: 饼
  rationale: לֶחֶם可指饼或泛指食物；此处保留具体食物意象，中文“饼”也较贴合古代近东的主食形态。
