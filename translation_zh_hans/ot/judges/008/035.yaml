  text: וְ/לֹֽא עָשׂ֣וּ חֶ֔סֶד עִם בֵּ֥ית יְרֻבַּ֖עַל גִּדְע֑וֹן כְּ/כָל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה עִם יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: zh_hans
  text: 他们没有照着耶路巴力（就是基甸）为以色列所行的一切恩惠，恩待他的家族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: 善待
  rationale: 此处指以色列人本应以忠厚、恩义对待基甸家族；“善待”自然明白，同时保留关系伦理的含义。
- source_word: בֵּית
  choice: 家族
  rationale: 这里的“家”并非建筑物，而是基甸的家属与后裔，译作“家族”可避免误解。
- source_word: כְּכָל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: 以回报他……所做的一切善事
  rationale: 介词כְּ在此表达与基甸全部善行相称的回应；结合否定句语境，汉语用“以回报”清楚传达应有却未有的报答关系。
theological_decisions:
- issue: 耶路巴力与基甸的关系
  choice: 耶路巴力（就是基甸）
  alternative: 耶路巴力基甸／耶路巴力的家族，即基甸的家族
  rationale: 希伯来文将两个名字并置，所指为同一人；括注既反映这种同位关系，也避免读者误以为是两个人。
- issue: חֶסֶד的盟约性内涵
  choice: 善待
  alternative: 施慈爱／以忠诚相待
  rationale: 本节重点是百姓忘恩、未向基甸家族施以相称的恩义；不额外限定为正式盟约术语，以免加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“家族”明确בֵּית的群体含义；括号说明耶路巴力就是基甸。
