  text: וַ/יְהִ֗י מִשְׁקַ֞ל נִזְמֵ֤י הַ/זָּהָב֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶ֥לֶף וּ/שְׁבַע מֵא֖וֹת זָהָ֑ב לְ֠/בַד מִן הַ/שַּׂהֲרֹנִ֨ים וְ/הַ/נְּטִפ֜וֹת וּ/בִגְדֵ֣י הָ/אַרְגָּמָ֗ן שֶׁ/עַל֙ מַלְכֵ֣י מִדְיָ֔ן וּ/לְ/בַד֙ מִן הָ֣/עֲנָק֔וֹת אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: zh_hans
  text: 他所索要的金环[b]重一千七百舍客勒的金子[a]；此外，还有月牙形饰物、垂饰和米甸诸王所穿的紫色衣服，以及他们骆驼颈上的项链。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一千七百金子”；“舍客勒”是根据上下文补出的重量单位。
    reason: lexical_alternative
  - marker: b
    text: “金环”也可译作“耳环”；希伯来语这个词可指戴在耳朵或鼻子上的环。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: 重量
  rationale: 该名词指称量所得的重量，而非泛指数量；现代汉语用“重量”准确自然。
- source_word: נִזְמֵי הַזָּהָב
  choice: 金环
  rationale: נזם可指戴在耳朵或鼻子上的环；“金环”保留原文未明确佩戴部位的概括性。
- source_word: אֲשֶׁר שָׁאָל
  choice: 他所要来的
  rationale: 承接上文基甸向众人索取战利品的叙事；“要来的”比“请求的”更符合现代汉语语境，同时不过度强化强制意味。
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: 一千七百舍客勒金子
  rationale: 原文直译为“一千七百金子”，重量单位按语境省略；正文补出当时通常理解的“舍客勒”，并用脚注说明。
- source_word: לְבַד מִן
  choice: 此外，还有
  rationale: 该短语表明随后物品不计入前述重量；此译清楚表达额外项目。
- source_word: הַשַּׂהֲרֹנִים
  choice: 月牙饰物
  rationale: 该词指月牙形装饰品；“月牙饰物”比单说“月牙”更明确易懂。
- source_word: הַנְּטִפוֹת
  choice: 垂饰
  rationale: 该词很可能指下垂或水滴状饰物；“垂饰”保留其大致形态而不武断指定为耳环。
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: 紫色衣服
  rationale: 直截了当地表达以贵重紫色染料或布料制成的服装。
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: 米甸诸王佩戴的
  rationale: 介词עַל在衣饰语境中表示穿戴在身上；汉语以“佩戴的”统摄前列饰物，并与衣服自然相接。
- source_word: הָעֲנָקוֹת
  choice: 项链
  rationale: 该词表示颈部饰物；下文明确这些饰物在骆驼颈上，译作“项链”清晰自然。
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: 他们骆驼颈上的
  rationale: 忠实表达饰物所在位置，并以简洁的现代汉语呈现。
