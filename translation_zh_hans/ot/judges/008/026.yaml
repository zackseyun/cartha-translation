revisions:
- from: 他所要来的金环，重量是一千七百舍客勒金子[a]。此外，还有米甸诸王佩戴的月牙饰物、垂饰和紫色衣服，以及他们骆驼颈上的项链。[b]
  to: 他所索要的金环[b]重一千七百舍客勒的金子[a]；此外，还有月牙形饰物、垂饰和米甸诸王所穿的紫色衣服，以及他们骆驼颈上的项链。
  rationale: 改正索要动作的译法，避免将“米甸诸王所穿”错误扩展到前列饰物，并将说明金环词义的脚注移至相应词语后。其余清单术语及“舍客勒”为语境补出的重量单位均予保留。
