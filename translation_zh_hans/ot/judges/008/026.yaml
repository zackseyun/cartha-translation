  source_fidelity: 需修订。“他所要来的”不合现代汉语，也未准确表达שָׁאַל在此处“索要／要求得到”的意思。原稿将“米甸诸王佩戴的”置于月牙饰物、垂饰和紫色衣服之前，会使其修饰全部前列物品；希伯来文关系从句直接修饰“紫色衣服”。
  naturalness: 原稿整体可读，但“他所要来的”明显不自然。“一千七百舍客勒的金子”及将王所穿的衣服单独表述，更符合现代标准汉语。
  terminology: “金环”“月牙形饰物”“垂饰”“紫色衣服”“项链”均可保留。“金环”的歧义说明脚注应紧邻“金环”锚定，而非置于句末的“项链”之后。
  issues:
