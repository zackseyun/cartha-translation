base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: zh_hans
  text: 西巴和撒慕拿在加各[a]；他们的军营也随同他们，约有一万五千人，都是东方人全军中剩下的人。倒下的有十二万名拔刀的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “加各”是地名。
    reason: 专名音译可能令读者误以为普通词，简注说明其性质。
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: 在加各
  rationale: 介词 ב 表示地点；“在”自然表达其所在位置。“加各”按传统中文圣经地名音译处理。
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: 他们的军营都跟他们在一起
  rationale: מַחֲנֵיהֶם 为复数，直译为“他们的军营”；用“都”配合复数，并保留 עִמָּם“跟他们在一起”。此处也可能指随行的军队，但正文不将其含义限定为“军队”。
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: 约有一万五千人
  rationale: 数词前的 כ 表示约数，故译出“约”；上下文所数的是作战人员，补出量词“人”使中文完整。
- source_word: כֹּל הַנּוֹתָרִים
  choice: 所有剩下的人
  rationale: 保留 יתר 的被动、结果性含义，同时使用现代汉语自然表达。
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: 东方人全军中
  rationale: מן 在此具部分关系，译为“……中”；מַחֲנֶה 在军事语境中可指全体军队。בְנֵי קֶדֶם 字面为“东方之子”，中文译作“东方人”更自然且不改变其族群地域含义。
- source_word: וְהַנֹּפְלִים
  choice: 先前倒下的
  rationale: 分词指战斗中倒下者，即阵亡者；“先前”表达其相对于当前余众的回顾关系，而“倒下”保留原文形象。
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: 十二万
  rationale: 按现代汉语数字习惯表达一百二十千。
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: 能拔刀作战的人
  rationale: שֹׁלֵף חָרֶב 字面为“拔刀者”，是指武装战士的军事表达；加入“作战”使现代中文读者明白其功能，同时保留“拔刀”的生动意象。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文“军营”的复数意味和“拔刀”的军事意象；以分号和句号梳理希伯来语较长的并列结构。
