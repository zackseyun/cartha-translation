  text: וַ/יָּבֹ֥א גִדְע֖וֹן הַ/יַּרְדֵּ֑נָ/ה עֹבֵ֣ר ה֗וּא וּ/שְׁלֹשׁ מֵא֤וֹת הָ/אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ עֲיֵפִ֖ים וְ/רֹדְפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/004.yaml
  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: zh_hans
  text: 基甸来到约旦河，渡河而过；他和三百名与他同行的人虽已疲惫，仍在追赶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们疲惫，却仍在追赶。”原文的连接词也可按简单并列理解为“疲惫，并在追赶”。
    reason: 原文וְ可表示并列；在此上下文中，“虽……仍……”自然表达疲惫与持续追赶之间的对比，但脚注保留其非让步的可能。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא在此表示抵达一个目的地；“来到”自然地承接叙事进程。
- source_word: הַיַּרְדֵּנָה
  choice: 约旦河
  rationale: 方向词尾表明向约旦而去；现代汉语通常称“约旦河”，无需另行表达方向词尾。
- source_word: עֹבֵר הוּא
  choice: 就过了河
  rationale: 分词配独立代词生动描写基甸渡河；汉语用“就过了河”顺畅表达叙事动作，而下句的“他和……”保留主语的强调。
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: 他和跟随他的三百人
  rationale: 准确交代基甸及其同行的三百名男子；军事语境下“三百人”已自然表明其队伍。
- source_word: עֲיֵפִים
  choice: 疲惫
  rationale: 清楚表达体力耗尽、疲乏的状态，又不增添昏厥或无法行动之意。
- source_word: וְרֹדְפִים
  choice: 仍继续追赶
  rationale: 原文连词本身可直译为“并且”，但上下文形成让步关系；“仍继续追赶”自然呈现他们虽疲惫却没有停止追击。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。主句保持简洁，并以“虽然……仍……”明确呈现语境中的对比，同时用脚注保留希伯来语连接关系的歧义。
