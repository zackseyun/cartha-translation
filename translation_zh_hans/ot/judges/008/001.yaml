base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: zh_hans
  text: 以法莲人[a]对他说：“你对我们做的这是什么事？你去攻打米甸时，竟没有召我们？”他们就同他激烈地争辩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以法莲之人”。这里是集合说法，指以法莲支派的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“强烈地同他争执。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: 以法莲人
  rationale: אִישׁ虽为单数形式，在此与支派名连用，具有集合意义；后面的复数动词也证实所指为多人。“以法莲人”在现代汉语中自然地指该支派的人。
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: 你对我们做的这事是什么意思
  rationale: 保留דָּבָר“事”这一具体名词和质问的修辞力度，同时采用自然的现代汉语表达，不简化为单纯的“你为什么这样做”。
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: 竟没有召我们
  rationale: “召”准确表达קרא在邀请人参战这一语境中的意思；“竟”传达质问中因未获通知而产生的不满，但不额外增添敌意。
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: 你去攻打米甸时
  rationale: 将כִּי按此处的时间兼解释关系处理；“攻打米甸”自然表达להלחם ב的敌对含义。
- source_word: וַיְרִיבוּן אִתּוֹ
  choice: 他们就同他……争辩
  rationale: ריב表示争执、争辩；“争辩”保留言语冲突的性质，又不把它缩小为一般拌嘴或扩大为司法控告。
- source_word: בְּחָזְקָה
  choice: 激烈地
  rationale: 该介词短语在这里作状语，描述争辩的强烈程度；“激烈地”既自然，又能传达其强硬、猛烈的语气。
