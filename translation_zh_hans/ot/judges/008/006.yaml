base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: zh_hans
  text: 疏割的首领说：“难道西巴和撒慕拿已经落在你手里了，我们就该把饼给你的军队吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: 疏割的首领
  rationale: שָׂרִים在此指城中的领导者；译作“首领”自然且不限定具体官职。
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע
  choice: 难道西巴和撒慕拿已经落在你手里了
  rationale: 原文直译为“西巴和撒慕拿的手掌岂已在你手中”，是以身体部位代指二人已被擒获；中文用“落在你手里”保留“手”的意象并自然表达被控制或俘获。
- source_word: עַתָּה
  choice: 已经
  rationale: 在反诘中表示“现在已经”，重点是基甸尚未擒获二王；译作“已经”符合现代汉语语气。
- source_word: לִצְבָאֲךָ
  choice: 给你的军队
  rationale: צָבָא可指军队、军兵或出征队伍；上下文为基甸率领的三百人，译“军队”简洁清楚。
- source_word: לֶחֶם
  choice: 饼
  rationale: לֶחֶם在此指供军兵食用的食物，以“饼”保留具体措辞，也与古代近东饮食背景相符。
theological_decisions:
- issue: “手掌在你手中”的表达是否按字面保留
  choice: 译为“落在你手里”
  alternative: “你已经抓住西巴和撒慕拿了吗”或“西巴和撒慕拿的手已经在你手里了吗”
  rationale: 原句以“手掌”代指二王落入基甸掌控，带有讥讽性的反诘。完全直译在中文中生硬且可能误解为断手；“落在你手里”保留核心意象和反诘张力，不额外断定二人已死或仅仅被俘。
- issue: 后半句כִּי的逻辑关系
  choice: 用“叫我们……吗”表达结果或依据关系
  alternative: “所以我们该……”或“以致我们……”
  rationale: כִּי在此连接反诘与供饼要求，可理解为“以致/使得”或“凭什么要”。中文“叫我们……吗”自然呈现首领拒绝供应的讥讽理由，同时不把连接词解释得过死。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。反诘句保留疏割首领的怀疑和讥讽；“落在你手里”既承接希伯来文重复的“手”意象，又避免字面“手掌”造成歧义。地名、人名采用中文圣经通行译名。
