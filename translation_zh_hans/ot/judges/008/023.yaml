  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ גִּדְע֔וֹן לֹֽא אֶמְשֹׁ֤ל אֲנִי֙ בָּ/כֶ֔ם וְ/לֹֽא יִמְשֹׁ֥ל בְּנִ֖/י בָּ/כֶ֑ם יְהוָ֖ה יִמְשֹׁ֥ל בָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: zh_hans
  text: 可是，基甸对他们说[a]：“我不统治你们，我的儿子也不统治你们；耶和华要统治你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，基甸对他们说。”希伯来语连接词通常承接叙事；正文译作“可是”，是为了表达基甸的话与上一节百姓请求之间的转折。
    reason: 词义与语篇关系的另一种译法
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 可是……说
  rationale: וַ־承接叙事，但结合上一节百姓提出的请求，此处的话明显构成拒绝；用“可是”自然表达语境中的转折，同时以脚注保留直译为“于是／便”的可能。
- source_word: אֲלֵהֶם
  choice: 对他们
  rationale: 准确表达介词与第三人称复数后缀所指的说话对象。
- source_word: גִּדְעוֹן
  choice: 基甸
  rationale: 采用现代中文圣经读者熟悉的传统人名译法。
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: 我不统治你们
  rationale: מָשַׁל表示行使统治或治理权；“统治”直接保留此处的政治权柄含义。希伯来语显式主语אֲנִי带有一定对比意味，中文主语“我”在上下文中已能自然体现。
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: 我的儿子也不统治你们
  rationale: “也不”自然体现与前句平行的否定，并保留同一动词的重复，以突出基甸本人及其儿子都不掌权。
- source_word: בְּנִי
  choice: 我的儿子
  rationale: 保留单数和第一人称所属关系；不扩译为“后代”，以免超出原文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文中对四字神名的通行专名译法，不以“主”这一称号替代。
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: 耶和华要统治你们
  rationale: 继续用“统治”对应重复出现的מָשַׁל，保留基甸、其子与耶和华之间鲜明的修辞对照。“要”在此自然表达未完成式的将来或意向色彩。
theological_decisions:
- issue: 基甸拒绝何种权柄
  choice: 按原文表述为拒绝自己及儿子的统治，并宣告耶和华要统治百姓。
  alternative: 将其明确解释为拒绝君王头衔，却可能仍行使事实上的统治。
  rationale: 本节三次使用מָשַׁל“统治”，并未使用“作王”一词。译文保留人类统治与神统治的对照，不把经文限定为某种更具体的政体或头衔，也不解决基甸后来行为所形成的叙事张力。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。三个分句重复“统治你们”，以再现希伯来原文的关键词复现和神学对照；不用较古雅的“作你们的王”，因为原文此处并未使用“王”或“作王”一词。
