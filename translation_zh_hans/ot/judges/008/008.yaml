  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: zh_hans
  text: 他从那里上到毗努伊勒[b]去，也照样对他们说[a]；毗努伊勒人回答他，正如疏割人先前回答的一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“对他们如此说。”希伯来文回指上一节所记同一类请求或话语。
    reason: lexical_alternative
  - marker: b
    text: 此地名在别处也拼作“毗尼伊勒”（Peniel；希伯来文：פְּנִיאֵל）。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  choice: 他从那里上到
  rationale: 保留עלה所含“上去”的方向意味，并以自然的现代汉语表达从疏割前往下一地点。
- source_word: פְּנוּאֵל
  choice: 毗努伊勒
  rationale: 按本节马所拉文本פְּנוּאֵל音译，并采用现代中文圣经地名常见形式。
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: 也照样对那里的人说了
  rationale: כָזֹאת字面为“如此”，在上下文中回指上一节基甸所提出的请求；“照样”自然传达这种回指，而不补写原文省略的具体话语。
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: 回答他
  rationale: ענה带直接宾语时通常表示“回答某人”，此译简洁准确。
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: 毗努伊勒人
  rationale: אַנְשֵׁי字面指该城的男子，但汉语地名加“人”在叙事中自然地指当地代表或居民；不额外限定其身份。
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: 正如疏割人先前所回答的
  rationale: כַּאֲשֶׁר表达比较“正如”；“先前”明确疏割人的回答在叙事时间上早于此处。
- source_word: סֻכּוֹת
  choice: 疏割
  rationale: 采用现代中文圣经传统中通行的地名译法。
