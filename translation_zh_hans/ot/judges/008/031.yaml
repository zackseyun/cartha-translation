  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: zh_hans
  text: 他的妾在示剑，也给他生了一个儿子；他给儿子起名叫亚比米勒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: 他的妾
  rationale: פִילֶגֶשׁ指地位有别于正妻的妾；现代汉语“妾”简洁、准确，且不误作“情妇”。句首连接词וּ依中文叙事习惯融入上下文，不机械译作“并且”。
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: 在示剑的
  rationale: 保留地点关系，只说明她在示剑，不额外断定她长期“住在”那里。
- source_word: יָלְדָה לּוֹ גַם הִיא בֵּן
  choice: 也给他生了一个儿子
  rationale: “也”对应גַם הִיא，承接上文其他儿子的出生；“给他生了一个儿子”自然表达יָלְדָה לּוֹ בֵּן。
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: 他给儿子起名叫
  rationale: 希伯来语字面为“设立他的名字”，实际是命名惯用语；译为现代汉语自然的“起名叫”。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用现代中文圣经读者熟悉的传统人名译法，并与希伯来语人名相对应。
theological_decisions: []
