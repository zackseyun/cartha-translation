base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: zh_hans
  text: 基甸死后，以色列人又转去随从众巴力行淫[a]，并立巴力比利土[b]作自己的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可直译为“在众巴力之后行淫”。希伯来文以性方面的不忠比喻拜偶像时的背信。
    reason: lexical_alternative
  - marker: b
    text: “巴力比利土”可能意为“盟约之巴力”或“盟约之主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר מֵת גִּדְעוֹן
  choice: 基甸死后
  rationale: 该叙事句式引出时间转折。现代汉语用“……死后”自然、简洁地表达事件完成后的情形，无须生硬保留“事情是这样”。
- source_word: וַיָּשׁוּבוּ
  choice: 又转去
  rationale: שׁוב在此表示重新回到先前的背道行为；“又转去”既体现反复，也与后面的“跟随”自然衔接。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处指以色列全体民众；“以色列人”是现代汉语中准确、自然的群体称谓，不必机械译成“以色列的儿子们”。
- source_word: וַיִּזְנוּ אַחֲרֵי הַבְּעָלִים
  choice: 跟随众巴力行淫
  rationale: “行淫”保留זנה用于偶像崇拜时强烈的性与关系不忠意象；“跟随”对应אַחֲרֵי，“众巴力”表达复数形式，指各地所敬拜的巴力。
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: 立……作自己的
  rationale: שׂים与לָהֶם合用，表示为自己设立或认定；此译清楚表达以色列人主动把该神祇奉为自己的神。
- source_word: בַּעַל בְּרִית
  choice: 巴力·比利土
  rationale: 作为特定神祇的专名采用音译，并用间隔号显示名称构成；名称本义在脚注说明。
- source_word: לֵאלֹהִים
  choice: 作自己的神
  rationale: 介词ל表示身份或用途上的指定；“自己的”也自然体现前文לָהֶם所含的归属意味。
theological_decisions:
- issue: 是否保留以行淫比喻拜偶像的措辞
  choice: 跟随众巴力行淫
  alternative: 背弃上帝，去跟随众巴力
  rationale: 原文明确使用זנה，以性方面的不忠刻画以色列在敬拜上的背叛。正文保留这一尖锐比喻，避免把原文的神学张力解释或弱化掉。
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 这里是对整个民族的惯用称呼，并非特意强调男性后裔；“以色列人”在现代汉语中准确而不引入原文没有的性别限制。
- issue: בַּעַל בְּרִית作为名称还是称号
  choice: 正文音译为“巴力·比利土”
  alternative: 译作“盟约之巴力”或“盟约之主”
  rationale: 该词组在这里是特定崇拜对象的名称。音译可避免正文替读者断定其名称应如何释义，同时由脚注保留词义可能性。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“行淫”较为尖锐，但有意保留希伯来文的比喻力度；“众巴力”保留复数，指不同地方形态或崇拜对象中的巴力。脚注标记依其在中文正文中首次出现的顺序重新编排。
