base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: zh_hans
  text: 于是，以色列人对基甸说：“请你、你的儿子和你的孙子[a]都统治我们，因为你救了我们脱离米甸的手。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孙子”原文直译为“你儿子的儿子”，明确列出相继的世代。
    reason: 保留希伯来原文具体的亲属表达及其世代承继意味。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 于是……说
  rationale: 连词与未完成式的叙事结构推进情节；“于是”符合现代汉语叙事习惯，也保留前后事件的承接关系。
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: אִישׁ虽为单数形式，此处与复数动词连用，具有集合意义。“以色列人”在现代汉语中自然地表达这一群体，不额外限定原文未着重说明的性别范围。
- source_word: מְשָׁל בָּנוּ
  choice: 统治我们
  rationale: משׁל在此指政治上的管治或掌权。“统治”直接、庄重，并能体现所请求的权柄，不预先采用原文没有的“作王”等君王术语。
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: 你、你的儿子和你的孙子都
  rationale: 用“都”统摄原文反复出现的גַּם，保留基甸本人及其后两代的连续范围；“孙子”是现代汉语对“儿子的儿子”的自然表达，并以脚注保留原文的具体说法。
- source_word: כִּי
  choice: 因为
  rationale: 引出以色列人提出请求的理由，现代汉语中“因为”清楚自然。
- source_word: הוֹשַׁעְתָּנוּ
  choice: 你救了我们
  rationale: ישׁע表示拯救、解救；“救了”既适合此处军事解救的语境，也保留该词在圣经中较广的拯救语义。
- source_word: מִיַּד מִדְיָן
  choice: 脱离米甸的手
  rationale: 保留“手”这一表示权势或控制的希伯来语意象；“脱离……的手”在汉语中可以理解，也保持经文的形象性。
theological_decisions:
- issue: 基甸受邀承担的统治性质
  choice: 译作“请你、你的儿子和你的孙子都统治我们”，呈现跨代延续的政治统治请求。
  alternative: 泛化为仅请求基甸及其家人提供领导，而不突出世袭延续。
  rationale: 命令式מְשָׁל与明确列出的三代人共同表明，请求并非只关乎一次临时的军事领导，而是涉及家族世代相承的统治。不过，原文没有使用“王”或“王朝”等词，因此译文不加入这些称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”推进叙事；引语保持直接简洁。“脱离米甸的手”有意保留原文的希伯来语意象，而不完全释义为“脱离米甸的权势”。
