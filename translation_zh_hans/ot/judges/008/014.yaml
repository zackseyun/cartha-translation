base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: zh_hans
  text: 他抓住一个疏割的年轻人，盘问他；那年轻人就给他写下疏割的首领[a]和长老，共七十七人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“官长”；这个希伯来词可指官员、首领或统治者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: 抓住
  rationale: לכד表示捕获、擒住；“抓住”符合叙事场景，又不额外说明拘捕方式。
- source_word: נַעַר
  choice: 年轻人
  rationale: נַעַר可指少年、青年或仆人；此人属于疏割居民并能提供城中领导者的信息，因此译作“年轻人”最为稳妥。
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: 一个疏割的年轻人
  rationale: 介词מִן表示从疏割人中选出一人；汉语以“一个疏割的年轻人”自然表达其归属。
- source_word: וַיִּשְׁאָלֵהוּ
  choice: 盘问他
  rationale: שׁאל基本义为询问；军事追击的语境显示这是有目的地获取情报，“盘问”比普通的“问”更贴切，但不必强化为带有现代司法色彩的“审讯”。
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: 那年轻人就给他写下
  rationale: 按语义，书写名单者最自然是受问的年轻人；אֵלָיו表示写给前述的基甸。译文明确少年为主语，以免现代汉语连续代词造成误读。
- source_word: שָׂרֵי סֻכּוֹת
  choice: 疏割的首领
  rationale: שׂרים可指官员、领袖、首领或统治者；“首领”适合城邑领导层，又避免现代官僚体制或世袭王族的联想。
- source_word: זְקֵנֶיהָ
  choice: 长老
  rationale: 阴性单数后缀指疏割城；“长老”是古代城邑中公认资深领导者的自然称呼。
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: 共七十七人
  rationale: 数字结构明确为七十七；“共”自然表明前述首领与长老合计七十七人，并保留איש所表示的人数。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“盘问”体现军事语境中的有目的询问；分号标明受问后书写名单的动作转换。脚注标记置于其实际说明的“首领”之后。
