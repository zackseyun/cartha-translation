source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: zh_hans
  text: 西巴和撒慕拿说：“你亲自起来击杀我们吧[a]，因为人怎样，他的力量也怎样[b]。”于是基甸起来，杀了西巴和撒慕拿，又取下他们骆驼颈上的新月形饰物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你亲自起来杀我们吧。”这里的“击杀”在上下文中指致命的一击。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“因为人怎样，他的力量也怎样”，是一句格言，意思是人的力量与其身量或勇力相称；他们是在要求更有力量的基甸亲自动手。
    reason: cultural_note
  - marker: c
    text: 或译：“月牙饰物”或“新月形挂饰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר זֶבַח וְצַלְמֻנָּע
  choice: 西巴和撒慕拿说
  rationale: 希伯来文虽用单数动词搭配复合主语，但这是常见叙事句法；现代汉语自然地按两人共同说话来表达。
- source_word: קוּם אַתָּה
  choice: 你亲自起来
  rationale: 独立人称代词 אַתָּה 使命令带有强调意味；“亲自”传达他们要求基甸本人动手，而不是让年轻的益帖执行。
- source_word: וּפְגַע בָּנוּ
  choice: 击杀我们
  rationale: פגע 可指遇见、袭击或击打；在处决的语境中明确指致命行动。“击杀”既保留动作感，也准确传达结果。
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: 因为人怎样，他的力量也怎样
  rationale: 尽量保留希伯来文简练的格言形式及“人”与“力量”之间的对应关系，不把其具体含义过度解释进正文。
- source_word: וַיָּקָם גִּדְעוֹן
  choice: 于是基甸起来
  rationale: “起来”呼应前面的命令 קוּם；“于是”自然呈现叙事进展。
- source_word: וַיַּהֲרֹג
  choice: 杀了
  rationale: 直接、清楚地表达常用动词 הרג 的致死含义，符合现代汉语。
- source_word: הַשַּׂהֲרֹנִים
  choice: 新月形饰物
  rationale: 该词指月牙或新月形的装饰品；译作“新月形饰物”既说明形状，也避免让读者误以为是天体。
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: 他们骆驼颈上的
  rationale: 忠实表达饰物所在的位置，同时采用自然简洁的现代汉语语序。
theological_decisions:
- issue: 格言 כִּי כָאִישׁ גְּבוּרָתוֹ 中阳性用语及含义
  choice: 因为人怎样，他的力量也怎样
  alternative: 因为一个人的力量与他的气概相称
  rationale: 上下文涉及男性战士，但汉语“人”在此无需额外标明性别。保留原文“人—力量”的格言式对应，也保留它可能兼指身量、勇力或气概的张力；脚注说明其语境含义，而不在正文中锁定单一解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“起来”的前后呼应和原文格言的凝练结构；用“击杀”表现处决语境中的致命动作，用“新月形饰物”清楚说明物件性质。
