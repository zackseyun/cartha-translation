base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: zh_hans
  text: 约阿施的儿子基甸享尽天年而死，葬在他父亲约阿施的墓里[a]，就是亚比以谢族的俄弗拉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “墓”或译“坟墓”“墓穴”；希伯来语 קֶבֶר 可指坟墓或安葬之处。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“亚比以谢人的俄弗拉”，意思是属于亚比以谢宗族的俄弗拉。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: 而死
  rationale: מות在此直指死亡；用“死”保持希伯来文的直接表达，不以“去世”等委婉语弱化。
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: 约阿施的儿子基甸
  rationale: 按现代汉语自然语序表达父子关系，并采用通行圣经人名译法。
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: 享尽天年
  rationale: שֵׂיבָה指高龄、老年，טוֹבָה带正面意味；“享尽天年”自然而庄重，表达寿终于良好高龄，不额外引入具体岁数。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: קבר的尼法勒形在这里具有被动意义；汉语“葬在”自然承接前文，主语仍为基甸。
- source_word: בְּקֶבֶר
  choice: 墓里
  rationale: קֶבֶר可指坟墓、墓穴或安葬之处；正文采用含义宽泛且自然的“墓”，并以脚注保留词义范围。
- source_word: יוֹאָשׁ אָבִיו
  choice: 他父亲约阿施的
  rationale: 希伯来文以同位结构说明约阿施是基甸的父亲；调整为自然汉语领属语序。
- source_word: בְּעָפְרָה
  choice: 俄弗拉
  rationale: 采用该地名的通行中文音译。
- source_word: אֲבִי הָעֶזְרִי
  choice: 亚比以谢族的
  rationale: 该单数族称指亚比以谢宗族所属；译作“亚比以谢族的”清楚表达俄弗拉与该宗族的关联。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“享尽天年而死”保留原文对高龄的正面评价；人名、地名依通行简体中文圣经译名。脚注标记均置于正文相关词语之后。
