  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: zh_hans
  text: 基甸对他们说：“我要向你们求一件事：请你们各人把自己战利品中的一个耳环给我。”他们有金耳环，因为他们是以实玛利人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: 我有一件事求你们
  rationale: 希伯来语以同根动词和名词加强“请求”之意；中文采用自然而庄重的表达，保留这是一次明确请求。
- source_word: אִישׁ
  choice: 每人
  rationale: 在分配性语境中指各人、人人；译作“每人”比直译“一个人”更清楚。
- source_word: נֶזֶם
  choice: 耳环
  rationale: 该词可泛指环饰，但下文说明以实玛利人佩戴金环；结合传统理解与上下文译为“耳环”，不另行具体化其佩戴部位。
- source_word: שְׁלָלוֹ
  choice: 所掳来的
  rationale: 指各人在战利品中所得之物；如此表达自然承接“耳环”，同时保留战后掳获的含义。
- source_word: יִשְׁמְעֵאלִים
  choice: 以实玛利人
  rationale: 按希伯来族名作规范音译，不将其与上下文中的米甸人作解释性合并。
theological_decisions:
- issue: 米甸人与以实玛利人的称谓关系
  choice: 保留“他们是以实玛利人”的原文陈述
  alternative: 解释为米甸商旅的泛称，或将两族名称等同处理
  rationale: 经文本身在此使用“以实玛利人”，翻译不应替读者消解族名之间可能存在的历史或叙事张力。
translation_notes:
  register: 采用现代、通顺而庄重的叙事语言。“请你们每人”清楚呈现分配性要求；全节不添加原文没有的解释。
