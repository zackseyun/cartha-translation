base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: zh_hans
  text: 基甸把它制成一个以弗得[a]，安置在自己的城俄弗拉。以色列众人都在那里随从它行淫[b]；它就成了基甸和他的家的网罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以弗得”是与祭司职事有关的礼仪物件；这里的经文没有明确说明它具体的形制或用途。
    reason: cultural_note
  - marker: b
    text: “行淫”是原文的直白比喻，以性方面的不忠描绘以色列人的偶像崇拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: 做成一个以弗得
  rationale: 介词 לְ 与“做”连用，在这里最自然地表达制作的结果。保留“以弗得”这一专名，不擅自断定它具体是衣物、神像还是求问用的器物。
- source_word: וַיַּצֵּג
  choice: 立
  rationale: 该使役形式表示使某物站立或安置；“立”简洁地表现公开设立之意，又不额外加入“陈列”或“供奉”等解释。
- source_word: בְעִירוֹ בְעָפְרָה
  choice: 在自己的城俄弗拉
  rationale: 忠实保留“自己的城”和同位说明“俄弗拉”，中文简洁自然。
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: 追随它行淫
  rationale: 保留 זנה 所含强烈的性不忠意象，同时以“追随它”对应 אַחֲרָיו，明确所追随的是以弗得。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留地点强调，指出以色列人的背道行为发生在俄弗拉。
- source_word: לְמוֹקֵשׁ
  choice: 网罗
  rationale: 保留原文捕捉猎物的比喻，表达引人陷入罪与祸患的危险。
- source_word: וּלְבֵיתוֹ
  choice: 和他全家
  rationale: 这里的“家”可涵盖家庭、家族及后裔；“全家”在现代中文中自然，也未将范围限定为住宅。
theological_decisions:
- issue: 如何表达以色列对以弗得的偶像崇拜
  choice: 追随它行淫
  alternative: 对它不忠／跟随它走迷了路
  rationale: 原文 זנה 以性方面的不忠比喻宗教和盟约上的背叛。直保留“行淫”可维持其神学力度，而不淡化为一般性的偏离。
- issue: 基甸所造以弗得的具体性质
  choice: 音译为“以弗得”，不在正文中进一步界定
  alternative: 祭司礼服／偶像／圣物
  rationale: 原文只称它为 אֵפוֹד，并未充分说明这里的形制与用途；译文应保留这一真实的不确定性。
- issue: “网罗”所指的后果
  choice: 保留比喻，不明说是犯罪、败亡或审判中的哪一种
  alternative: 使基甸和全家陷入罪中／给基甸和全家招来灾祸
  rationale: 原文 מוֹקֵשׁ 本身兼有诱陷与致祸的张力；直译可避免把其后果过早限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“以弗得”“网罗”保留必要的圣经文化用语；脚注解释其含义。“追随它行淫”虽带有刻意的冲击力，却忠实传达希伯来文的偶像崇拜隐喻。
