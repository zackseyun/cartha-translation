base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: zh_hans
  text: 这样，米甸就在以色列人面前被制伏了，不再抬起头来[a]。在基甸的日子，那地太平了四十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抬起头来”可指恢复力量或重振声势。
    reason: 说明希伯来语比喻在此语境中的可能含义，同时保留正文的具体意象。
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: 被制伏了
  rationale: 该词为כנע的尼法勒式，在此表达米甸遭到压制、归于臣服；“被制伏”既保留被动含义，也符合军事语境。
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: 在以色列人面前
  rationale: 保留希伯来语“在……面前”的关系性表达；“以色列人”是现代汉语中对这一民族称谓自然且准确的译法，不必机械译作“以色列的众子”。
- source_word: וְלֹא יָסְפוּ לָשֵׂאת רֹאשָׁם
  choice: 再也不能抬起头来
  rationale: יסף加不定式表示再次或继续做某事；“抬起头来”保留原文比喻，语境中指米甸不能重振声势。汉语用“不能”自然呈现遭制伏后的结果含义。
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: 国中太平
  rationale: שקט在《士师记》的总结句中指战乱止息、享有安宁；“国中太平”是庄重而易懂的现代汉语表达。此处הָאָרֶץ不是强调土地本身，而是指当地或全境。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 按原文直接翻译数目和时间单位。
- source_word: בִּימֵי גִדְעוֹן
  choice: 在基甸的日子
  rationale: 保留希伯来语常见的时间表达，不将其进一步限定为“基甸一生之中”，从而避免过度解释。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的民族称谓
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 该短语在这里是惯用民族称谓，现代汉语“以色列人”准确涵盖这一群体，也避免“以色列的众子”可能引起的字面血缘误解。
- issue: לָשֵׂאת רֹאשָׁם比喻的保留
  choice: 抬起头来
  alternative: 恢复势力／重振声势
  rationale: 正文保留原文具体比喻，不把其可能包含的力量、胆量和自主地位等含义缩减为单一解释；脚注说明其语境意义。
- issue: הָאָרֶץ的范围与安息含义
  choice: 国中太平
  alternative: 那地得享安宁／全地平静
  rationale: 上下文是以色列摆脱米甸压迫后的和平时期。“国中太平”传达政治军事上的安宁，但不额外界定精确地理边界。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“被制伏”“抬起头来”保留原文的被动关系和文学意象；“国中太平”符合《士师记》周期总结句的语体。
