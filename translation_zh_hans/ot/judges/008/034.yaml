  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: zh_hans
  text: 以色列的子孙[a]没有记念雅威他们的上帝，就是那位曾把他们从他们四围所有仇敌手中救出来的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来文直译为“以色列的众子”。
    reason: 说明原文的字面亲属称谓形式，并提供现代汉语中更惯用的集体称谓。
lexical_decisions:
- source_word: וְלֹא
  choice: 没有
  rationale: 承接上文的叙事关系在中文中无需机械译出“并且”；“没有”自然表达否定，并保持经文推进。
- source_word: זָכְרוּ
  choice: 记念
  rationale: 这里不仅指在头脑中想起，也含有以忠诚回应上帝恩行的意味；“记念”保留了这一较宽的圣经语义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 较贴近原文“以色列的众子”，又以现代中文可理解的集体称谓表达；惯用译法“以色列人”列入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为上帝个人之名的性质，而不以头衔替代。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 所指为雅威，复数形态在此作单数尊称使用；“他们的上帝”也表达他与以色列的关系。
- source_word: הַמַּצִּיל
  choice: 他曾……救出来
  rationale: 带冠词的分词以雅威施行拯救的行动来说明他的身份；中文用关系明确的分句，并以“曾”表明这恩行先于他们不记念他的行为。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来文以“手”表示权势或控制的形象，在现代中文中也自然易懂。
- source_word: כָּל אֹיְבֵיהֶם
  choice: 一切仇敌
  rationale: 直接表达原文的全称范围。
- source_word: מִסָּבִיב
  choice: 四围
  rationale: 表示仇敌来自各方；“四围”简洁、庄重，也保留空间性的描写。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近其可能读音的“雅威”，以保留这是名字而非“主”之类的称号。
- issue: 群体称谓 בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  alternative: 以色列人
  rationale: 正文保留原文亲属称谓的形式和以色列后裔这一群体观念，同时用脚注提供更惯用的现代汉语表达。
- issue: “记念”的契约性含义
  choice: 保留“记念”，不增译为“忠于”或“感恩”
  alternative: 不再忠于
  rationale: 上下文可能使“不记念”包含未以忠诚回应的意味，但原词仍以记忆为基本意象；不在正文中把隐含意义具体化，以免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“记念”“四围”和“从……手中救出来”保留圣经叙事的意象与语域；分号使“不记念”与雅威先前的拯救形成清楚对照。
