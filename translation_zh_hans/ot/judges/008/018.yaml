base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: zh_hans
  text: 他对西巴和撒慕拿说：“你们在他泊[a]杀的那些人在哪里？”他们回答：“他们和你一样[b]，个个都有王子般的仪表。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他泊”通常指他泊山。
    reason: cultural_note
  - marker: b
    text: 或译：“你怎样，他们也怎样；个个看起来都像王的儿子。”原文的比较句式十分简略。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפֹה
  choice: 在哪里
  rationale: 这是询问地点的疑问副词。虽然下文的回答谈到容貌，与问题表面上并不完全对应，译文仍保留原文的“在哪里”，不擅自改成“是什么样的人”。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 此处指一群可辨认的男性受害者；现代汉语用“那些人”自然，并由语境明确其所指。
- source_word: הֲרַגְתֶּם
  choice: 你们……杀的
  rationale: 采用“杀”表达基本词义，直接而中性，不加入“谋杀”所带的法律或道德定性。
- source_word: בְּתָבוֹר
  choice: 在他泊
  rationale: 介词 ב 在此表示事件发生的地点；保留地名“他泊”，并以脚注说明通常指他泊山。
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: 他们和你一样
  rationale: 希伯来语是简略的对应比较，字面近似“像你，像他们”。译文补足汉语所需的关系，同时保留他们与基甸相像这一核心意思。
- source_word: אֶחָד
  choice: 个个
  rationale: 此处作分配用法，指其中每一个人；“个个”简洁自然。
- source_word: כְּתֹאַר
  choice: 有……般的仪表
  rationale: תֹּאַר 可指外形、容貌或仪表。“仪表”既涵盖外貌，也保留可能涉及气度的语义范围。
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: 王子般的
  rationale: 原文直译为“王的儿子们”，在此描述王室子弟的外貌或气度。“王子般的”在现代汉语中自然，也避免误指某位已知君王的特定儿子。
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: 他……说……他们回答
  rationale: 按希伯来叙事顺序表达；第二个“说”在问答语境中译为“回答”，符合现代汉语而不改变话语功能。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“在哪里”与下文容貌回答之间原有的叙事张力，不以解释性改写消除这一不协调；“王子般的仪表”兼顾外貌与气度两层可能含义。
