base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: zh_hans
  text: 基甸说：“既然如此，等雅威把西巴和撒慕拿交在我手里，我就要用旷野的荆棘和刺丛[a]碾打你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刺丛”：原文所指的具体有刺植物不能确定；也可泛译作“荆棘”或“有刺的灌木”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 既然如此
  rationale: 承接上一节疏割人的拒绝，表明基甸接下来的威胁是对此作出的回应，也自然引出“等……就……”的句式。
- source_word: בְּתֵת
  choice: 等……把……交在
  rationale: 介词 בְּ 加 נתן 的不定式在这里表达将来的时间关系；“等……把……”既自然，也保留事情尚未发生的意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留原文所用的上帝之名。
- source_word: בְּיָדִי
  choice: 交在我手里
  rationale: 保留希伯来语“在手中”的具体意象，同时中文读者也能自然理解为交由某人掌控。
- source_word: וְדַשְׁתִּי
  choice: 碾打
  rationale: 原动词本义是打谷、碾谷；“碾打”保留农业动作的比喻及威胁的暴烈程度，而不弱化为一般的“惩罚”。
- source_word: בְּשַׂרְכֶם
  choice: 你们的肉身
  rationale: 对应“肉”，保留威胁的具体、强烈表达；“肉身”在现代中文中比单说“肉”更自然，又不淡化为笼统的“身体”。
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: 旷野的荆棘
  rationale: 保留有刺植物和旷野环境的双重意象，表达自然清楚。
- source_word: הַבַּרְקֳנִים
  choice: 刺丛
  rationale: 该词所指的具体植物不确定；“刺丛”传达有刺、可伤人的植物，却避免武断指定某一物种。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留这一专名，不以称号替代。
- issue: 基甸的话是条件还是时间陈述
  choice: 等雅威把……交在我手里
  alternative: 如果雅威把……交在我手里
  rationale: בְּ 加不定式在此最自然地表示时间。译作“等”保留基甸预期雅威会交付敌人的语气，而不额外强化为不确定条件。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“既然如此，等……就……”顺畅连接上下文；“碾打”刻意保留打谷的农业隐喻和暴力张力。脚注标记紧随存在词义不确定性的“刺丛”。
