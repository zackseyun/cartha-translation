  naturalness: 整体庄重清楚；但‘碾打你们的肉身’搭配稍显生硬。改为‘用……碾打你们’在现代汉语中更顺畅，同时仍由‘碾打’保留 דושׁ 的打谷／碾打意象。
  terminology: ‘雅威’一致对应 יְהוָה，‘旷野’和‘荆棘’也合乎原文。הַבַּרְקֳנִים 所指植物不确定，‘刺丛’可保留；不过脚注不宜把不确定的植物具体定为‘蒺藜’，应仅说明可泛译为另一类有刺植物。
