base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: zh_hans
  text: 基甸沿着住帐棚之人所走的路上去；那路在挪巴和约比哈以东。他袭击那营；那营正安然无备[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那营正处于安全之中。”希伯来语可表示安稳、安全或自信；在这里可能指那营自以为安全，因而没有戒备。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去
  rationale: עלה通常表示“上去、登上”；这里叙述基甸沿路线行进，保留其基本移动含义，不额外解作“进军”。
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: 沿着住帐棚之人的道路
  rationale: 直译该短语，既保留“道路”的地理含义，也避免用“游牧民”限定这些人的身份。
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: 到了挪巴和约比哈以东
  rationale: 在此地理语境中，מִקֶּדֶם表示位于两地东方；加入“到了”使中文行程叙述自然，并与前面的“上去”衔接。
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: 袭击那营
  rationale: נכה本义宽泛，可指击打或攻击；军事语境下“袭击”自然准确，同时不把结果强化为“击败”。
- source_word: וְהַמַּחֲנֶה הָיָה בֶטַח
  choice: 当时营中安然无备
  rationale: בֶּטַח可表示安全、安稳或有信心；在突袭语境中，“安然无备”传达营地自以为安全而没有戒备的状态，同时由脚注保留较字面的译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文“营”的重复，以呈现其行文重心；地名按通行圣经译名译作“挪巴”和“约比哈”。脚注标记置于“安然无备”之后，与其所解释的希伯来词对应。
