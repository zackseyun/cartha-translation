base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: zh_hans
  text: 上帝把米甸的两个首领俄立和西伊伯交在你们手中。我所做的，怎能跟你们相比呢？”他说了这话，他们对他的怒气就消了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: 上帝把……交在你们手中
  rationale: “交在……手中”是现代汉语可理解的圣经叙事用语，既保留“手”的希伯来意象，也表达交由掌控、使之败于对方的含义。
- source_word: שָׂרֵי מִדְיָן
  choice: 米甸的两个首领
  rationale: שָׂרֵי 是复数，指具有统领地位的人；“首领”比“王子”更符合此处敌军领袖的身份。补出“两个”与随后列出的俄立和西伊伯相应，不增加实质信息。
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: 俄立和西伊伯
  rationale: 采用现代中文圣经中较为通行的人名译法，便于读者识别并与上下文衔接。
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: 我所做的，怎能跟你们相比呢
  rationale: 该反问在语境中表示基甸自谦，以平息以法莲人的不满；此译自然表达比较关系，同时保留反问语气。
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: 他们对他的怒气就消了
  rationale: 希伯来语字面为“他们的灵/气从他身上松弛下来”，在此是敌意或怒气平息的习语；中文直译“灵松弛”不自然，故译出语境含义。
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: 他说了这话
  rationale: 自然表达“在他说这件话时/因他说这话”的时机与关联；דָּבָר 在此指所说的话。
