  text: וַ/יֹּ֨אמֶר֙ לְ/יֶ֣תֶר בְּכוֹר֔/וֹ ק֖וּם הֲרֹ֣ג אוֹתָ֑/ם וְ/לֹא שָׁלַ֨ף הַ/נַּ֤עַר חַרְבּ/וֹ֙ כִּ֣י יָרֵ֔א כִּ֥י עוֹדֶ֖/נּוּ נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: zh_hans
  text: 他就对自己的长子益帖说：“起来，杀了他们！”但那少年[a]没有拔出刀来，因为他害怕，因为他还只是个少年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “少年”所译的希伯来语 נַעַר，也可译作“男孩”或“青年”；这个词可涵盖从男孩时期到青年时期。这里此人已经佩刀，并被要求执行杀人的命令，因此译作“少年”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就……说
  rationale: 连续式叙事动词推进情节；“就”自然表达前后顺序。
- source_word: לְיֶתֶר
  choice: 对……益帖
  rationale: 将人名 יֶתֶר 按希伯来语读音音译为现代中文常见的圣经人名形式“益帖”。
- source_word: בְּכוֹרוֹ
  choice: 自己的长子
  rationale: בְּכוֹר 指头生的儿子；在现代汉语中，“长子”自然、明确，也保留出生次序的含义。
- source_word: קוּם
  choice: 起来
  rationale: 直接表达 קוּם 的命令语气，在此既自然又简洁。
- source_word: הֲרֹג אוֹתָם
  choice: 杀了他们
  rationale: הרג 是普通而直接的“杀死”；不采用带有古雅或额外战斗色彩的措辞。
- source_word: וְלֹא שָׁלַף
  choice: 但……没有拔出……来
  rationale: 连接词在这里形成命令与未执行之间的对比，因此译作“但”；שָׁלַף 表示从鞘中拔出。
- source_word: הַנַּעַר
  choice: 那少年
  rationale: נַעַר 可指男孩、少年或青年。此人已经佩刀，也被要求行刑；“少年”既保留其年少，又不把年龄限定得过低。
- source_word: חַרְבּוֹ
  choice: 刀
  rationale: חֶרֶב 可指刀或剑；中文叙事中“拔刀”搭配自然，所属关系由主语和语境已清楚表达，无须生硬重复“他的”。
- source_word: כִּי יָרֵא
  choice: 因为他害怕
  rationale: כִּי 在此说明他没有拔刀的原因；直译为因果分句。
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: 因为他还只是个少年
  rationale: 保留第二个 כִּי 的因果关系、עוֹדֶנּוּ 的“还”以及 נַעַר 的重复；“只是”自然凸显其年少状态。
