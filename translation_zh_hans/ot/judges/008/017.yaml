  text: 他拆毁了毗努伊勒[a]的塔，又杀了城中的男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毗努伊勒”在传统英文中也拼作“Peniel”。
    reason: 保留英文审计轨迹所注明的 Penuel／Peniel 名称变体；标记紧随所说明的地名。
lexical_decisions:
- source_word: מִגְדַּל
  choice: 塔楼
  rationale: 该名词通常指塔或设防的高层建筑；“塔楼”在现代汉语中清楚自然，也保留其防御性建筑的语感。
- source_word: פְּנוּאֵל
  choice: 毗努伊勒
  rationale: 按本节马所拉文本的辅音和元音形式音译，并采用中文圣经读者较熟悉的地名写法。
- source_word: נָתָץ
  choice: 拆毁
  rationale: 该动词表示把建筑物拆下、毁坏；“拆毁”准确、自然，不额外强化为彻底夷平。
- source_word: וַיַּהֲרֹג
  choice: 杀了
  rationale: הרג 直接表示杀死；“杀了”简明、现代，并不加入原文没有明说的方式。
- source_word: אַנְשֵׁי הָעִיר
  choice: 城里的男子
  rationale: 该短语字面指“城中的男人”；在惩罚性的军事语境中译作“男子”，保留原文的阳性指称，避免泛化为全城所有居民。
