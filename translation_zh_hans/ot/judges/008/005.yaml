base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: zh_hans
  text: 他对疏割人说：“请给跟随我的人[a]一些饼，因为他们疲乏了；我正在追赶米甸的王西巴和撒慕拿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在我脚边的人”，是指随同或跟随他的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: 对疏割人
  rationale: אַנְשֵׁי 是阳性复数，语境中可能指城中的男子或男性代表；汉语“疏割人”自然，并未不必要地扩大为所有居民。
- source_word: תְּנוּ נָא
  choice: 请拿些……给
  rationale: 祈使式加 נָא 表达恳请或带有急迫感的请求；“请”在现代汉语中自然传达这一语气。
- source_word: כִּכְּרוֹת לֶחֶם
  choice: 些饼
  rationale: כִּכָּר 在此指一块或一饼面包；“饼”符合古代近东食物形态，也比直译为“圆饼”更自然。原文为复数，但中文量词表达无需机械标明形状。
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: 给跟随我的人
  rationale: 字面为“在我脚边的人”，是指随同或跟随基甸的人；正文采用自然的汉语惯用表达，并以脚注保留原文意象。
- source_word: עֲיֵפִים
  choice: 疲乏了
  rationale: 该词表示因劳顿而疲倦；“疲乏”准确且不夸大为濒临昏厥。
- source_word: רֹדֵף אַחֲרֵי
  choice: 正在追赶
  rationale: 分词形式表达持续进行的追击行动；“正在追赶”清楚保留进行意味。
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: 西巴和撒慕拿
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: מַלְכֵי מִדְיָן
  choice: 米甸王
  rationale: 希伯来文为复数“米甸的众王”，但中文“米甸王西巴和撒慕拿”可自然地由并列人名表达两位王；不添加原文没有的信息。
