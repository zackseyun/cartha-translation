base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: zh_hans
  text: 西巴和撒慕拿逃跑了；基甸就追赶他们，擒住了米甸的两个王，就是西巴和撒慕拿，并使全营陷入恐慌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使全营战栗”，或“击溃了全营”。希伯来语动词可指使人战栗或陷入恐慌；在这里的军事语境中，也可能含有使敌军溃乱的意思。
    reason: 保留הֶחֱרִיד在情绪惊恐与军事溃乱之间的词义幅度。
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: 逃跑了
  rationale: נוּס的Qal连续式表示逃走、逃亡；“逃跑了”自然清楚，也保留叙事的推进力。
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: 西巴和撒慕拿
  rationale: 按现代中文圣经人名的通行音译处理这两个专名。
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: 基甸就追赶他们
  rationale: רדף אחרי意为追赶、追击；希伯来文仅用第三人称单数代词，中文补出“基甸”以免主语含混。
- source_word: וַיִּלְכֹּד
  choice: 擒住了
  rationale: לכד在军事语境中指捕获或拿下；对象是敌方君王，因此“擒住”比泛泛的“抓住”更贴切。
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: 米甸的两个王
  rationale: 直接保留希伯来文的属格结构，也自然符合现代汉语。
- source_word: אֶת זֶבַח וְאֶת צַלְמֻנָּע
  choice: 就是西巴和撒慕拿
  rationale: 保留原文对两王身份的同位说明及重复强调；用“就是”使中文关系清楚。
- source_word: וְכָל הַמַּחֲנֶה
  choice: 全营
  rationale: מַחֲנֶה可指军营或驻营的军队；“全营”保留其集体和军事含义。
- source_word: הֶחֱרִיד
  choice: 使全营陷入恐慌
  rationale: חרד的Hiphil词形有使人战栗、惊恐之意；在战事语境中也暗含军队陷入混乱。“陷入恐慌”兼顾使役含义和军事效果。
