  text: וַ/יֹּאמַ֕ר אַחַ֥/י בְּנֵֽי אִמִּ֖/י הֵ֑ם חַי יְהוָ֗ה ל֚וּ הַחֲיִתֶ֣ם אוֹתָ֔/ם לֹ֥א הָרַ֖גְתִּי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: zh_hans
  text: 他就说：“他们是我的兄弟，是我母亲的儿子。[a]雅威永活，我起誓：若你们当时让他们活着，我现在就不会杀你们。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我母亲的儿子”说明他们与基甸同母，是他的兄弟；原文未明说同父。
    reason: cultural_note
  - marker: b
    text: 或译：“我本不会杀你们。”原文用反事实条件表达：他们若让基甸的兄弟活着，基甸便不会杀他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他就说
  rationale: 以现代汉语常用的叙事衔接表达 wayyiqtol，不额外强化先后关系。
- source_word: אַחַי בְּנֵי אִמִּי הֵם
  choice: 他们是我的亲兄弟，都是我母亲的儿子
  rationale: “兄弟”与“我母亲的儿子”构成同位说明；加“亲”自然传达这里并非泛指族人，同时保留原文对母系关系的明确表述。
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威起誓
  rationale: 这是以雅威生命为凭的标准誓言格式；该译法在现代汉语中庄重自然，并保留神名。
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: 如果你们当时让他们活着
  rationale: לוּ 引出与事实相反的条件；“当时”帮助汉语读者辨明过去反事实，הַחֲיִתֶם 则按使役义译为“让他们活着”。
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: 我现在就不会杀你们
  rationale: 希伯来语完成式用于反事实条件的结果句；上下文中西巴和撒慕拿仍活着，基甸说的是眼下本可不杀他们，故用“现在就不会杀”避免误译成过去已经没有杀。
theological_decisions:
- issue: 誓言中神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代。
- issue: 反事实结果句是否指过去未发生的杀戮
  choice: 我现在就不会杀你们
  alternative: 我就不会杀你们／我本不会杀你们
  rationale: 被讲话者此时尚未被处死，因此不能按英语表面形式译成“我就不会杀过你们”。译文保留反事实关系，同时呈现即将实施的处决。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我指着永活的雅威起誓”明确呈现誓言功能；“当时”与“现在”使希伯来语反事实条件的时间关系在汉语中清楚可辨。
