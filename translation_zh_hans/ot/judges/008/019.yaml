    issue: “亲兄弟”过度限定亲属关系。
    rationale: “我母亲的儿子”明确同母，但该措辞本身没有明说同父；现代汉语“亲兄弟”通常理解为同父同母。保留原文的重复同位语更为稳妥。
  - severity: low
    issue: “永活的雅威”将誓言公式作了形容词化处理。
    rationale: 原文是“雅威活着／雅威永活”的誓言公式。改为“雅威永活，我起誓”更直接保留其句法和庄重语气。
