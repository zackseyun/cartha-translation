  text: וּ/לְ/גִדְע֗וֹן הָיוּ֙ שִׁבְעִ֣ים בָּנִ֔ים יֹצְאֵ֖י יְרֵכ֑/וֹ כִּֽי נָשִׁ֥ים רַבּ֖וֹת הָ֥יוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/030.yaml
  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: zh_hans
  text: 基甸有七十个亲生儿子[a]，因为他有许多妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从他的大腿出来的”，是指亲生后代的习语。
    reason: 保留希伯来语身体意象及其习语含义。
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: 基甸有
  rationale: 介词 לְ 与 היה 连用构成领有表达，直译近似“归基甸有”，现代汉语自然表达为“基甸有”。句首 וּ 在此承接上下文，不必机械译成“并且”或“那时”。
- source_word: שִׁבְעִים בָּנִים
  choice: 七十个……儿子
  rationale: בָּנִים 明确指“儿子”，不是泛指“孩子”。
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: 亲生
  rationale: 原文是“从他的大腿（腰间）出来的”，属于表示本人所生、血缘后代的希伯来语习语；“亲生”以简洁自然的现代汉语传达其意义，并在脚注保留字面形象。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出基甸儿子众多的原因，译作“因为”清楚自然。
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: 他有许多妻子
  rationale: 在家庭与生育语境中，נָשִׁים 指妻子；היה 与 לְ 构成领有表达，故译为“有”。
theological_decisions:
- issue: 对多妻家庭的叙述
  choice: 按叙事原意译作“有许多妻子”，不附加道德评断
  alternative: 弱化为“有许多女人”，或增添赞同、谴责性的措辞
  rationale: 本节陈述基甸的家庭状况，却没有在本句中明确作出道德评价；译文既不应模糊婚姻关系，也不应加入原文没有表达的立场。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亲生儿子”既避免生硬直译，也保留这些儿子是基甸本人所生的强调。
