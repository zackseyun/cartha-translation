lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回来
  rationale: 该叙事性动词推进情节，表示基甸返回；现代汉语用“回来”自然简洁。
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: 约阿施的儿子基甸
  rationale: 按现代汉语自然语序表达希伯来语父子称谓，并采用通行人名译法。
- source_word: מִן הַמִּלְחָמָה
  choice: 从战场
  rationale: מִלְחָמָה 可指战争或战斗；本处指刚结束的具体军事行动，“战场”也能自然搭配“回来”。
- source_word: מִלְמַעֲלֵה
  choice: 经过……坡
  rationale: מַעֲלֶה 表示上坡、坡道或上行之处；介词组合在此可描述返回路线，用“经过……坡”既自然又保留地形含义。
- source_word: הֶחָרֶס
  choice: 希列斯
  rationale: 正文将其视为地名并音译，以配合路线语境；该词也可能意为“太阳”，保留在脚注中。
