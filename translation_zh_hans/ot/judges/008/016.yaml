  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: zh_hans
  text: 他把城中的长老带来，又取了旷野的荆棘和蒺藜，用这些教训[a]疏割人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教训”所译的希伯来语通常意为“使知道”。这里的表达较难理解；结合荆棘和蒺藜，许多人理解为基甸借此惩罚疏割人。也可译作“使疏割人知道”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: 城里的长老
  rationale: 直译“城中的长老”，保留其社会政治职称；在本段语境中，他们是疏割的领袖。
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: 旷野的荆棘
  rationale: 保留原文具体的带刺植物意象及所属关系，表达自然且庄重。
- source_word: הַבַּרְקֳנִים
  choice: 蒺藜
  rationale: 该词指某种有刺植物，确切品种难定；“蒺藜”与“荆棘”并列，既保留区别，也呈现用来施罚的尖刺意象。
- source_word: וַיֹּדַע בָּהֶם
  choice: 用这些教训了
  rationale: 使役词形通常表示“使知道”，但这里指基甸以荆棘和蒺藜对疏割人实施惩罚。“教训”在现代汉语中可同时承载使人领受教训和惩治的语气，避免把困难的希伯来表达过度具体化。
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: 疏割人
  rationale: 原文直指“疏割的男子”；上下文涉及该城的成年男性公民，以自然的地名居民称谓表达。
