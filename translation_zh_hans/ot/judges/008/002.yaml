  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: zh_hans
  text: 他却对他们说：“我现在所做的，怎能跟你们相比呢？以法莲拾取的余葡萄，不是胜过亚比以谢收获的葡萄吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: 他却对他们说
  rationale: 叙事中的连续式推进情节；结合上一节以法莲人的责问，以“却”自然表达基甸回应中的转折语气。
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: 我现在所做的，怎能跟你们相比呢？
  rationale: כָכֶם在此构成比较。用反问句传达基甸自谦、安抚对方的语气，同时保留“现在”的时间成分。
- source_word: הֲלוֹא טוֹב
  choice: 不是胜过……吗？
  rationale: הֲלוֹא引出预期肯定回答的反问；טוֹב与比较介词מִן连用，表达“比……更好／胜过”。
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: 以法莲拾取的余葡萄
  rationale: עֹלְלוֹת指葡萄正式收获后留下、供人拾取的葡萄。此译既说明具体所指，又保留葡萄园比喻。
- source_word: מִבְצִיר אֲבִיעֶזֶר
  choice: 胜过亚比以谢收获的葡萄
  rationale: בָּצִיר指葡萄的采收或收成；מִן标示比较。译为“收获的葡萄”与前半句“余葡萄”形成清楚、自然的对照。
- source_word: אֶפְרַיִם / אֲבִיעֶזֶר
  choice: 以法莲／亚比以谢
  rationale: 采用现代中文圣经人名的通行音译；亚比以谢在语境中指基甸所属的宗族。
theological_decisions: []
