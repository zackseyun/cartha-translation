  text: תְּבֹרַךְ֙ מִ/נָּשִׁ֔ים יָעֵ֕ל אֵ֖שֶׁת חֶ֣בֶר הַ/קֵּינִ֑י מִ/נָּשִׁ֥ים בָּ/אֹ֖הֶל תְּבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: zh_hans
  text: 妇女中最蒙福的是雅亿[a]，就是基尼人希百的妻子；在帐棚里的妇女中[b]，她最蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅亿比众妇女更蒙福……她比帐棚里的众妇女更蒙福。”希伯来文采用比较结构，既可表达“在……之中”，也可表达“胜过……”。
    reason: lexical_alternative
  - marker: b
    text: 直译“在帐棚里”。这可能是指与帐棚生活相关的妇女，也就是住帐棚的妇女；但希伯来文的“帐棚”是单数。
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ / תְּבֹרָךְ
  choice: 最蒙福
  rationale: 两个词形都是动词ברך的Pual未完成式第三人称阴性单数，表达“蒙福、受称颂”。结合מִן引出的比较结构，译作“最蒙福”既体现比较或最高级意味，也保留首尾重复的诗歌强调。
- source_word: מִנָּשִׁים
  choice: 妇女中
  rationale: 介词מִן在这里标示比较，可理解为“在妇女中”或“胜过妇女”。正文采用自然的汉语最高级表达“妇女中”，另以脚注保留“胜过”的可能译法。
- source_word: יָעֵל
  choice: 雅亿
  rationale: 依照现代中文圣经人名的通行译法音译。
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: 就是基尼人希百的妻子
  rationale: 忠实表达原文的同位说明及所属关系；“就是”使中文诗句中的身份补充清楚自然。
- source_word: בָּאֹהֶל
  choice: 在帐棚里的
  rationale: 原文直译为“在帐棚里”，且“帐棚”为单数。此处修饰“妇女”，正文保留单数意象，不扩写为复数“帐棚”或直接解释成“游牧妇女”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留希伯来诗歌的前后重复和比较结构。人名使用简体中文圣经传统中较通行的“雅亿、希百”；“帐棚”保留原文的单数及古代生活场景。
