  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: zh_hans
  text: 以色列的乡村生活[a]止息了；止息了，直到我——底波拉——兴起；直到我作为以色列中的母亲兴起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列的村民不复存在”，或“以色列的乡村人口不复存在”。这个希伯来词含义较难确定，可能指村落居民，也可能较广泛地指乡村生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: 止息了
  rationale: 该动词重复出现，表示某种社会生活中断或不复存在；“止息了”既保留诗歌中的重复，也比“停止了”更庄重。
- source_word: פְרָזוֹן
  choice: 乡村生活
  rationale: 这是一个含义不确定的名词，可能指无城墙村落中的居民，也可能泛指乡间正常生活；正文采用自然且涵盖面较广的“乡村生活”，并以脚注保留其他可能。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中／以色列的
  rationale: 介词短语表示以色列境内或以色列群体之中；前半句按现代汉语习惯转换为领属结构，后半句保留“在以色列中”。
- source_word: עַד
  choice: 直到
  rationale: 标明先前困境持续到突破点，即底波拉兴起之时。
- source_word: שַׁקַּמְתִּי
  choice: 我兴起
  rationale: קום在这里指起身采取行动；“兴起”符合诗歌语体，并保留原文两次第一人称重复。
- source_word: דְּבוֹרָה
  choice: 底波拉
  rationale: 采用现代中文圣经传统通行的人名译法。
- source_word: אֵם
  choice: 母亲
  rationale: 该词在此是隐喻性或尊称性的自我描述，表达底波拉在以色列中保护、扶助和带领的角色；正文不添加解释性称号。
theological_decisions:
- issue: 底波拉自称 אֵם בְּיִשְׂרָאֵל 的隐喻意义
  choice: 译为“作为以色列中的母亲兴起”
  alternative: 译为“作以色列之母兴起”或仅按字面理解为生育意义上的母亲
  rationale: 希伯来文直译是“以色列中的母亲”，不是“以色列之母”。此译法保留原有介词关系和保护、养育、领导的隐喻空间，不把它强化成正式头衔，也不将隐喻限定为生理母亲。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“止息了，止息了”和两次“兴起”刻意保留原文的平行重复；正文将不确定的 פְרָזוֹן 译为较宽泛的“乡村生活”，并在脚注中呈现人物指称的可能性。
