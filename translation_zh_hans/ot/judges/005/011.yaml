  naturalness: “从汲水处弓箭手的声音中，传出人们的述说”在现代汉语中不自然，且“从……声音中传出”容易使“述说”成为由声音发出的内容。修订后的分行和“人们在那里述说”更自然，也保持诗歌的庄重朗读感。
