source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: zh_hans
  text: '在汲水处之间，远离弓箭手的声音之处[a]，

    人们在那里述说：


    耶和华公义的作为，

    他为以色列乡民所行公义的作为[b]。


    那时，耶和华的百姓下到城门口[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句开头的希伯来文较难确定。也可译作：“在汲水处之间，听见弓箭手的声音时。”有些解释认为，这句话是在说明述说或歌唱发生的地点，而不是表示远离那声音。
    reason: alternative_reading
  - marker: b
    text: 译作“乡民”的希伯来词含义不确定，也可指“没有城墙的村落”或“乡间居民”，较少被理解为“统治者”。此短语也可理解为“他在以色列乡民中的公义作为”，或“以色列乡民的公义作为”。
    reason: lexical_alternative
  - marker: c
    text: 古代城门口是城镇公众聚集的地方，与议事、审判和安全防卫有关。
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: 从……弓箭手的声音中
  rationale: 保留 מִן 的来源意味和“声音”的诗歌意象，同时用“传出人们的述说”重组汉语句法，使全句自然可懂。开头原文含义不确定，另解收入脚注。
- source_word: בֵּין מַשְׁאַבִּים
  choice: 汲水处
  rationale: מַשְׁאַבִּים 指汲水的地点、水井或水槽；“汲水处”既简洁，又保留古代生活场景。בֵּין 所表达的处所关系在汉语中由“处”自然呈现。
- source_word: יְתַנּוּ
  choice: 述说
  rationale: 此处 Piel 形式表示反复讲述、传扬；“述说”不强行限定为歌唱，也符合胜利诗的公开宣告语境。
- source_word: צִדְקוֹת יְהוָה
  choice: 耶和华公义的作为
  rationale: צִדְקוֹת 在这里指彰显公义、带来拯救的具体行动。“公义的作为”保留词义范围，没有缩窄为“拯救”或“胜利”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”表达四字神名，而不以“主”这一称号替代。
- source_word: צִדְקֹת פִּרְזֹנוֹ בְּיִשְׂרָאֵל
  choice: 他在以色列乡民中的公义作为
  rationale: פִּרְזוֹן 是疑难词，与士师记5:7的乡村生活或乡间居民相关。“在……乡民中”既保留群体和处所意味，也避免武断判定这些作为究竟是乡民所行，还是耶和华为他们所行；其他解释列入脚注。
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: 那时……下到城门口
  rationale: “那时”对应 אָז，“下到”保留 ירד 的方向性；“城门口”比单说“门”更清楚地指向城镇的公共空间。
- source_word: עַם יְהוָה
  choice: 耶和华的百姓
  rationale: 直接保留原文的所属关系及其圣约群体意味。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用现代普通读者最熟悉、且明确作为专名使用的“耶和华”，不以“主”代替神名；“雅威”是另一种可能的音译。
- issue: 胜利诗中 צִדְקוֹת 的含义
  choice: 公义的作为
  alternative: 拯救的作为；得胜的作为
  rationale: 该词在上下文中包含耶和华施行拯救和伸张正义的具体行动，但“公义的作为”最能保留原词的广度，不把含义预先限定为军事胜利。
- issue: צִדְקֹת פִּרְזֹנוֹ 中行为主体或受益者的关系
  choice: 他在以色列乡民中的公义作为
  alternative: 他为以色列乡民所行的公义作为；以色列乡民公义的作为
  rationale: 希伯来语的属格结构及疑难名词 פִּרְזוֹן 容许不同理解。正文以处所/群体关系表达，避免无根据地断定乡民是行为主体或受益者，从而保留诗句的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌体。通过分行保留底波拉之歌的平行结构；“传出人们的述说”使原文开头的介词结构在汉语中通顺，同时不消除其疑难性。所有脚注标记均置于正文相关词句之后。
