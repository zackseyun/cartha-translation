    reason: 保留 אַבִּירָיו 可指强健马匹或勇士的解释空间；正文依紧邻的马蹄和飞奔意象采用“骏马”。
  revision_rationale: 修订以“马蹄……轰响”自然表达有力踏击的声响；以“飞奔、飞奔”保留希伯来语 דַּהֲרוֹת 的重复和诗歌节奏。正文按直接的马匹语境译“骏马”，同时将可能的“勇士”解释置于脚注，既避免不自然的混成词，也不抹去原词的语义讨论。
