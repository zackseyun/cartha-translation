revisions:
- from: 那时，马蹄猛烈踏响，因它们飞驰，因他的骏勇者[a]飞驰。
  to: 那时，马蹄因他的骏马[a]飞奔、飞奔而轰响。
  rationale: 修订以“马蹄……轰响”自然表达有力踏击的声响；以“飞奔、飞奔”保留希伯来语 דַּהֲרוֹת 的重复和诗歌节奏。正文按直接的马匹语境译“骏马”，同时将可能的“勇士”解释置于脚注，既避免不自然的混成词，也不抹去原词的语义讨论。
