  text: אָ֥ז הָלְמ֖וּ עִקְּבֵי ס֑וּס מִֽ/דַּהֲר֖וֹת דַּהֲר֥וֹת אַבִּירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/022.yaml
  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: zh_hans
  text: 那时，马蹄因他的骏马[a]飞奔、飞奔而轰响。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的勇士”。希伯来语直译可作“他的强者”；在此诗歌语境中，可指强健的马，也可能指与马匹相关的勇士。
    reason: 保留 אַבִּירָיו 可指强健马匹或勇士的解释空间；正文依紧邻的马蹄和飞奔意象采用“骏马”。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为时间副词，引出诗歌中下一个鲜明场景；“那时”自然而庄重。
- source_word: הָלְמוּ
  choice: 猛烈踏响
  rationale: 该动词表示有力的击打；结合马蹄语境，以“猛烈踏响”兼顾动作与声响。
- source_word: עִקְּבֵי סוּס
  choice: 马蹄
  rationale: עִקְּבֵי 本可指脚跟，但与集合意义的“马”连用时，汉语自然译为“马蹄”。
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: 因它们飞驰，因……飞驰
  rationale: מִן 表示原因或来源；保留 דַּהֲרוֹת 的重复，以再现诗歌的强化与节奏。首个“它们”按紧邻的马匹理解，但不改变末语的歧义。
- source_word: אַבִּירָיו
  choice: 他的骏勇者
  rationale: אַבִּירָיו 可指强健的马，也可指勇士；“骏勇者”以略带诗意的合成表达保留两种联想，并避免正文武断限定为骏马或战士。
theological_decisions:
- issue: אַבִּירָיו 中阳性单数后缀所指及该名词指马还是勇士
  choice: 译作“他的骏勇者”，保留所属对象及类别的含混
  alternative: “他的骏马”或“他的勇士”
  rationale: 上下文描写敌军奔逃及马蹄声，既可使人想到强健的战马，也可指与马相连的勇士；原诗未明确消除这种张力，因此正文不作单一判定，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而富有声响感的诗歌语言。“猛烈踏响”和重复的“飞驰”再现原文的动势；“骏勇者”不是日常散文用语，但在诗体中可理解，并服务于保存原文歧义。
