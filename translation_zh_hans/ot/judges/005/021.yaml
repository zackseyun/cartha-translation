base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: zh_hans
  text: '基顺急流把他们冲走了——


    远古的急流，基顺急流。


    我的心哪，奋勇前进！[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奋勇前进”也可译作“我的心哪，奋力踏行！”或“我的心哪，大力践踏！”希伯来语原文简练而富有诗意，所用动词既可表示踏行、前进，也可表示践踏。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: 河／河流
  rationale: 该词可指溪谷、溪流或暴涨的水流。基顺在此冲走敌军；中文以“河”配合“冲走”自然呈现洪流之势，重复处用“河流”保持诗行流畅。
- source_word: קִישׁוֹן
  choice: 基顺
  rationale: 沿用现代中文圣经传统中通行的专名音译。
- source_word: גְּרָפָם
  choice: 把他们冲走了
  rationale: 该动词意为冲走、卷走；主语为基顺河，宾语后缀指敌军。“冲走”准确保留水势猛烈的战歌意象。
- source_word: נַחַל קְדוּמִים
  choice: 那古老的河流
  rationale: קְדוּמִים与远古、往昔有关；译作“古老”保留时间意味及庄重诗意，又不额外引入神话色彩。
- source_word: תִּדְרְכִי
  choice: 奋勇向前
  rationale: דרך可指踏行、迈进或践踏。这里是诗人向自己的心发出自我激励；“奋勇向前”以自然中文表达其推进和得胜的语气，同时在脚注保留“践踏”的可能。
- source_word: נַפְשִׁי
  choice: 我的心哪
  rationale: נפש在自我呼语中指人的生命或内在自我。现代汉语诗体中“我的心哪”比直译“我的灵魂”自然，也保留直接自我呼告。
- source_word: עֹז
  choice: 奋勇
  rationale: עֹז表示力量、勇力。原句结构紧缩；将其融入“奋勇向前”，自然表达“以力量前行”的副词性含义。
