base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: zh_hans
  text: 以萨迦的首领[a]与底波拉同在；以萨迦也与巴拉一起，被派进谷中，紧随他的脚步[b]。流便的各支系中，有重大的内心决断[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以萨迦的领袖”。这里的希伯来语是诗体表达，形式上也可读作“我在以萨迦的首领”，但通常按习语理解为“以萨迦的首领”。
    reason: lexical_alternative
  - marker: b
    text: 直译“在他的脚边”，意思是紧紧跟随巴拉。
    reason: lexical_alternative
  - marker: c
    text: 或译“有重大的内心定意”或“有深切的内心思量”。这个希伯来语短语含义不易确定，既可强调郑重的决意，也可能在上下文中暗示只有内心盘算而没有行动。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי בְּיִשָּׂשכָר
  choice: 以萨迦的首领
  rationale: שָׂרַי 的形式表面上可理解为“我的首领”，但在这首古老诗歌中通常按习语理解为“以萨迦的首领”。“首领”既保留诗歌的庄重感，也比现代汉语中的“王子”更符合部族领袖的语境。
- source_word: עִם דְּבֹרָה
  choice: 与底波拉同在
  rationale: עִם 表示陪同、站在同一方；“与……同在”简洁保留原文的并肩意味。
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: 以萨迦也与巴拉一起
  rationale: 原文为诗体省略句，כֵּן 表示相应、同样；补出“一起”使现代汉语自然，同时不增加原文没有的具体行动。
- source_word: בָּעֵמֶק שֻׁלַּח
  choice: 被派入谷中
  rationale: שֻׁלַּח 是被动单数形式，以部族“以萨迦”为集合性主语；“被派入”保留被动语态，并结合军事行动语境表达进入谷地的方向。
- source_word: בְּרַגְלָיו
  choice: 紧随他的脚步
  rationale: 字面为“在他的脚边／脚下”，在此表示紧跟巴拉而行。“紧随他的脚步”在现代汉语中自然，也保留了原文的身体意象。
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: 吕便各部族中
  rationale: פְּלַגּוֹת 可指划分出来的群体、支系或派别；“各部族”适合以色列支派内部群体的语境，避免把它过度限定为军事编制或政治派系。
- source_word: גְּדֹלִים חִקְקֵי לֵב
  choice: 有重大的内心决断
  rationale: חִקְקֵי 来自与“刻定、制定”有关的词根，较可能指心中的决定、定意；“重大的内心决断”保留其庄重而含混的诗意，也不与下一节措辞不同的 חִקְרֵי לֵב（内心省察／思量）完全混同。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌体。前半节保留部族集体作单数主语和被动“被派”的结构；后半节避免直接把吕便的状态解释成犹豫不决，以保留 חִקְקֵי לֵב 在“决断”与“思量”之间的张力，并通过脚注说明上下文可能带有的反讽意味。
