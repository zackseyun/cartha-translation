revisions:
- from: 以萨迦的首领[a]与底波拉同在；以萨迦也与巴拉一起，紧随他的脚步[b]，被派入谷中。吕便各部族中，有重大的内心决断[c]。
  to: 以萨迦的首领[a]与底波拉同在；以萨迦也与巴拉一起，被派进谷中，紧随他的脚步[b]。流便的各支系中，有重大的内心决断[c]。
  rationale: 修正“流便”的专名误写，并把流便内部的פְּלַגּוֹת译为“各支系”。同时微调前半句语序，使“被派进谷中”直接对应原文的军事行动，而“紧随他的脚步”仍明确说明其跟随巴拉。末句保留原文“定意／思量”之间的诗体歧义，未将其单方面解释为犹豫。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:19Z'
