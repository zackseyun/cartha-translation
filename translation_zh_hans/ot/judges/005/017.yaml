base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: zh_hans
  text: 基列住在约旦河对岸；但为何在船只旁寄居？亚设坐在海岸边，停留在自己的港湾[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “港湾”或译“海湾”或“入口”。原词指缺口、开口，在这里可能指沿海的港湾或入口。另，“在船只旁寄居”也可译作“寄居在船上”。
    reason: 说明 מִפְרָצָיו 在海岸语境中的词义范围，并保留 יָגוּר אֳנִיּוֹת 可理解为与船只相伴或在船上寄居的句法歧义。
lexical_decisions:
- source_word: גִּלְעָד
  choice: 基列
  rationale: 保留地名；在诗歌语境中以地域代指当地支派民众，不将其解释性扩写为“基列人”。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: 在约旦河对岸
  rationale: 准确表达相对于说话者视角的河对岸，符合现代汉语地理表达。
- source_word: שָׁכֵן
  choice: 住
  rationale: 该词可指居住或停留；译作“住”保留基本义，并由战歌的责问语境显出未参战之意。
- source_word: וְדָן
  choice: 但
  rationale: “但”为支派名“但”，按中文圣经惯用译名处理；分号和后续问句避免与转折连词混淆。
- source_word: לָמָּה
  choice: 为何
  rationale: 保留直接的反问和诗体庄重感。
- source_word: יָגוּר
  choice: 寄居
  rationale: 保留 גור 所含的居留、寄居义，不把责备语气直接增译为“逗留”；具体句法也可能理解为“为何寄居船上”，故加注说明。
- source_word: אֳנִיּוֹת
  choice: 船只
  rationale: 泛指复数船舶；原文无定冠词，中文无需补出特指。
- source_word: אָשֵׁר
  choice: 亚设
  rationale: 采用通行的支派名音译。
- source_word: יָשַׁב
  choice: 坐
  rationale: 保留动词“坐下／居住”的鲜明诗歌意象，并在语境中传达静止未动。
- source_word: לְחוֹף יַמִּים
  choice: 在海岸边
  rationale: חוֹף 指岸边或海岸；יַמִּים 虽为复数，在此自然译为集合性的“海”。
- source_word: מִפְרָצָיו
  choice: 自己的港湾
  rationale: 该词本义涉及缺口、入口；沿海语境中可指港湾或海湾。“港湾”既自然又保留一定地形含义。
- source_word: יִשְׁכּוֹן
  choice: 安住
  rationale: 表达持续居住、停留之意，并与前句“坐”构成诗意上的静止画面。
theological_decisions: []
