  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: zh_hans
  text: 在亚拿之子珊迦的日子，在雅亿的日子，大道无人通行[a]，行路的人都走迂回曲折的路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大道断绝”，意思是大道上的正常往来停止了。
    reason: lexical_alternative
  - marker: b
    text: “迂回曲折的路”很可能指为求安全而走的偏僻绕行路线，并非指道德上的邪僻。
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: 在……的日子
  rationale: 保留希伯来语表示某一人物所处时期的时间惯用语，庄重且符合现代汉语圣经文体。
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: 亚拿之子珊迦
  rationale: 采用中文圣经中通行的人名音译，并按自然汉语次序表达父子关系。
- source_word: יָעֵל
  choice: 雅亿
  rationale: 采用中文圣经中通行的人名音译。
- source_word: חָדְלוּ אֳרָחוֹת
  choice: 大道无人通行
  rationale: חָדְלוּ 字面为“停止、断绝”；与“道路”连用时，意指大道上的正常往来停止。此译法自然呈现结果，同时由脚注保留较直译的可能。
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: 行路的人
  rationale: 该短语字面为“走路径的人”，在诗歌语境中泛指旅人或赶路者；译作“行路的人”不过度限定其身份。
- source_word: יֵלְכוּ
  choice: 都走
  rationale: 未完成式在诗歌回顾的过去情境中表达当时惯常发生的行动；汉语以“都走”自然表达。
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: 迂回曲折的路
  rationale: עֲקַלְקַלּוֹת 表示弯曲、曲折；此处描述为避开大道而采用的间接路线，不带道德上的“邪僻”含义。
