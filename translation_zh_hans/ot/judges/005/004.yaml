  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: zh_hans
  text: '雅威啊，你从西珥出来，


    从以东的田野[a]迈步而来时，


    大地震动[b]；


    诸天也滴下，


    云层也滴下水来。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从以东的旷野”或“从以东地”。希伯来文直译为“从以东的田野”。
    reason: lexical_alternative
  - marker: b
    text: 或译“那地震动”或“大地震颤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现上帝的专名YHWH，不用称号替代专名。
- source_word: בְּצֵאתְךָ
  choice: 你……出来时
  rationale: 介词ב加不定式构造和第二人称阳性单数词尾在此表示时间，保留诗歌中对雅威的直接称呼。
- source_word: מִשֵּׂעִיר
  choice: 从西珥
  rationale: מן表示来源，西珥为地名，按通行译名音译。
- source_word: בְּצַעְדְּךָ
  choice: 迈步而来时
  rationale: צעד指迈步、行进；此处描绘上帝威严而有目的的前行。“迈步而来”既保留动作意象，也符合汉语诗体。
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: 从以东的田野
  rationale: שׂדה可指田野或开阔地；直译“田野”保留原文意象，并以脚注说明较宽泛的理解。
- source_word: אֶרֶץ רָעָשָׁה
  choice: 大地震动
  rationale: אֶרֶץ既可指大地，也可指某地；因下文与诸天、云层并列，正文采用宇宙性的“大地”。רעש表示震动或震撼。
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: 诸天也滴下雨水
  rationale: נטף本义为滴下；中文若只说“诸天滴下”语意不完整，补出上下文已明确的“雨水”，同时维持滴落意象。
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: 云层也滴下水来
  rationale: עבים指云或密云，מים明确是水；重复“滴下”以对应原文两次נטף。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近学界通常拟音Yahweh的“雅威”，而不以“主”等称号替代；“耶和华”是汉语传统形式，但源自较晚的混合读法。
- issue: אֶרֶץ的范围
  choice: 大地
  alternative: 那地
  rationale: 与“诸天”和“云层”的平行结构支持宇宙性场景，但该词本身也可指土地或地区，因此以脚注保留另一可能。
translation_notes:
  register: 采用庄重而自然的现代汉语诗体，并按原文分行呈现平行结构。保留“出来／迈步”“诸天／云层”“滴下／滴下”等重复和递进；避免把神显场景解释成特定历史事件。
