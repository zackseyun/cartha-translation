  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וּבָרָק
  choice: 和……巴拉
  rationale: 保留连接词及通行人名译法，与底波拉构成并列主体。
- source_word: בֶּן אֲבִינֹעַם
  choice: 亚比挪庵的儿子
  rationale: 准确表达希伯来语父系称谓结构，并采用通行人名译法。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然表达特指的时间，保留叙事所指的得胜之日。
- source_word: לֵאמֹר
  choice: 道：
  rationale: 作为引语标记，引出随后诗歌；与“唱”合成自然、庄重的“唱道：”。
