  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: zh_hans
  text: '在她双脚之间，他屈身，倒下，躺卧；

    在她双脚之间，他屈身，倒下；

    他屈身之处，他就在那里倒下，遭毁灭。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遭毁灭”或译“被杀”“败亡”。原文这个词可指遭劫掠、毁坏或彻底败亡；这里用于西西拉遭致彻底覆灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: 在她脚间
  rationale: 按字面保留具体的空间意象及诗中的重复；相比“在她脚下”，此译更贴近希伯来文，同时不像“在她两腿之间”那样过度强化解剖意味。
- source_word: כָּרַע
  choice: 屈身
  rationale: 该词可指屈膝、蹲伏或身体下沉。此处“屈身”保留动作本身的多义性，又不暗示敬拜性的“下拜”或主动的“跪下”。
- source_word: נָפַל
  choice: 倒下
  rationale: 自然对应死亡场景中的跌倒，并在全节中原样重复，以保存诗歌节奏和层层强化。
- source_word: שָׁכָב
  choice: 躺卧
  rationale: 简洁呈现人物倒下后横卧的状态，并维持一连串短促动词的诗体效果。
- source_word: בַּאֲשֶׁר
  choice: 在哪里
  rationale: 此处介词与关系词合用，表示地点；“在哪里”自然简洁，也与下句“就在那里”呼应。
- source_word: שָׁם
  choice: 就在那里
  rationale: 保留希伯来文明确的地点回指，并用“就”加强末句的对应和落点。
- source_word: שָׁדוּד
  choice: 被杀
  rationale: 该被动分词可表示遭劫掠、毁灭或彻底败亡；用于已遭暴力杀死的西西拉时，“被杀”在现代汉语中最自然。脚注保留“被毁灭”的词义可能，避免掩盖其较宽的语义范围。
