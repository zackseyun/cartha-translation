  yaml_path: translation/ot/judges/005/025.yaml
  text: He asked for water[a]; she gave milk[b]. In a bowl fit for nobles she brought him curds.
translation:
  language: zh_hans
  text: 他求水，她却给他奶；她在贵人的碗中端上凝乳[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凝乳”或译“奶油”或“黄油”；原词指一种浓厚的乳制品。
    reason: lexical_alternative
  - marker: b
    text: “贵人的碗”也可理解为“配得上贵人的碗”或“华贵的碗”；原文直译为“贵人之碗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: 水
  rationale: 采用基本义“水”，与雅亿实际给他的奶形成对照。
- source_word: שָׁאַל
  choice: 求
  rationale: 该词为Qal完成式第三人称阳性单数，意为“请求、索求”；“求水”简洁自然，也符合诗歌语体。
- source_word: חָלָב
  choice: 奶
  rationale: 采用通常词义“奶”；不用“牛奶”，以免加入原文没有说明的动物种类。
- source_word: נָתָנָה
  choice: 她却给他
  rationale: 动词为Qal完成式第三人称阴性单数，主语指雅亿。原文以并列形成“求水—给奶”的反差；“却”将诗句隐含的对照自然表达出来，“给他”补明中文所需的受事关系。
- source_word: בְּסֵפֶל
  choice: 用……碗
  rationale: סֵפֶל指碗、钵或盆状器皿；“碗”是现代中文最自然的对应词。介词ב在此可表达盛装或递送所用的器皿，译作“用”。
- source_word: אַדִּירִים
  choice: 贵族的
  rationale: 该复数形式可指尊贵者、贵族或有权势的人。“贵族的碗”贴近原文“贵族之碗”的结构，同时把具体关系保留在脚注中说明。
- source_word: הִקְרִיבָה
  choice: 给他端来
  rationale: 该词是קרב的Hiphil形式，基本意思是“使靠近、拿近前来”。在款待场景中，“端来”自然表达把盛在器皿中的食物送到客人面前，不引入祭祀含义。
- source_word: חֶמְאָה
  choice: 凝乳
  rationale: 该词可指凝结或浓稠的乳制品，也可理解为奶油或黄油。“凝乳”较能反映古代乳制品的可能形态，同时在脚注保留其他词义。
