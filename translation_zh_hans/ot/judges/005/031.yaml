base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: zh_hans
  text: '“雅威啊，愿你所有的仇敌都这样灭亡！

    但愿爱他的人如太阳升起，威力尽显[a]！”


    于是，那地太平了四十年[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“像太阳带着它的威力出来。”
    reason: 保留希伯来文意象的较直译形式，说明“升起，威力尽显”的翻译依据。
  - marker: b
    text: 希伯来文直译：“那地安静了四十年。”《士师记》中这一说法通常指战乱止息、境内得享安宁。
    reason: 说明“太平”所表达的惯用叙事含义，并保留原文字面信息。
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: 愿……都这样灭亡
  rationale: כֵּן承接前文西西拉的结局，意为“这样”；未完成式在此表达愿望。“愿……灭亡”保留结歌中祈愿兼咒诅的语气。
- source_word: כָל אוֹיְבֶיךָ
  choice: 你所有的仇敌
  rationale: 准确保留第二人称单数后缀，并采用自然的现代汉语语序。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神的专名，而不以称号代替。
- source_word: וְאֹהֲבָיו
  choice: 但愿爱他的人
  rationale: “但”显出与“仇敌”的对比；“他”保留希伯来文从直接称呼“你”转为第三人称的变化，不将其抹平。动词形式在此与前句的祈愿自然并列，故译作“但愿”。
- source_word: כְּצֵאת הַשֶּׁמֶשׁ בִּגְבֻרָתוֹ
  choice: 如太阳升起，威力尽显
  rationale: יצא用于太阳时指太阳出来、升起；בִּגְבֻרָתוֹ描绘太阳以强盛威力发光。译文保留比喻，同时避免生硬的“在它的威力中”。
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: 于是，那地太平了
  rationale: שׁקט字面指安静、平静；在《士师记》的叙事公式中指战乱止息、境内得享安宁，“太平”自然传达这一语境含义。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 按原文准确表达持续时间。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，译作“雅威”保留其作为以色列之神专名的性质，不以称号替换。
- issue: וְאֹהֲבָיו中第三人称代词的所指及人称转换
  choice: “爱他的人”，其中“他”指雅威
  alternative: “爱你的人”
  rationale: 第三人称阳性单数后缀最自然地回指紧邻的神名。译文保留“你的仇敌”与“爱他的人”之间由第二人称转为第三人称的原文张力。
- issue: 后半句是否补出祈愿语气
  choice: 但愿爱他的人……
  alternative: 但爱他的人如……
  rationale: 原文后半句是省略谓语的对比性名词句，可承接前句的祈愿语气；汉语补出“但愿”使并列关系清楚，同时不把比喻解释成已经实现的事实。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。诗歌祈愿部分以感叹号体现结歌力度，并分行呈现平行结构；叙事收束另起一段。保留原文由“你”转为“他”的人称变化，不作神学性调和。
