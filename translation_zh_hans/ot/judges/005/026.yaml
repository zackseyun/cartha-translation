  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: zh_hans
  text: 她的手伸向帐棚橛子，她的右手伸向工人的锤子[a]；她击打西西拉，砸碎了他的头[b]，又击碎并刺穿了他的太阳穴[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “工人的锤子”也可译作“劳工的槌子”或“工人用的大锤”。这个希伯来语短语较少见，所指击打工具的确切样式不能完全确定。
    reason: lexical_alternative
  - marker: b
    text: “砸碎”也可译作“压碎”。原文连续使用几个表示猛烈击打的动词，加强诗歌的暴烈感。
    reason: lexical_alternative
  - marker: c
    text: “刺穿”也可译作“穿过”或“贯穿”。这里的动词很可能描写穿透头侧的结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... תִּשְׁלַחְנָה
  choice: 她伸手拿
  rationale: 原文是“伸出她的手”，这里指伸手取用工具；译为“伸手拿”既自然，也保留动作的鲜明感。
- source_word: לַיָּתֵד
  choice: 帐棚橛子
  rationale: יָתֵד 是橛子；结合雅亿支搭帐棚及本段叙事语境，明确译为“帐棚橛子”。
- source_word: וִימִינָהּ
  choice: 右手
  rationale: 直译并保留与前半句“手”的诗体平行。
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: 工匠的锤子
  rationale: 这个少见短语表示劳动者所用的击打工具；“工匠的锤子”在现代汉语中清楚自然，同时保留属格关系。
- source_word: וְהָלְמָה
  choice: 她击打
  rationale: 动词表示重击；采用“击打”以避免与随后两个力度强烈的近义动词完全重合。
- source_word: מָחֲקָה רֹאשׁוֹ
  choice: 砸碎他的头
  rationale: מחק 在此表达猛烈压碎、砸碎；“砸碎”符合诗歌中暴烈而密集的动作描写。
- source_word: וּמָחֲצָה
  choice: 打裂
  rationale: 该动词表示打碎、击破；译作“打裂”与前面的“砸碎”有所区分，从而保留原文近义动词叠加的诗体力度。
- source_word: וְחָלְפָה רַקָּתוֹ
  choice: 刺穿他的太阳穴
  rationale: חלף 的基本意象是穿过，在此语境中指利器穿透；רַקָּה 指头侧的太阳穴。
