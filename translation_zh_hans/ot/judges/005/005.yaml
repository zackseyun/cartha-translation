  text: הָרִ֥ים נָזְל֖וּ מִ/פְּנֵ֣י יְהוָ֑ה זֶ֣ה סִינַ֔י מִ/פְּנֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/005.yaml
  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
translation:
  language: zh_hans
  text: 群山在雅威[b]面前流淌[a]；这西奈山也在雅威——以色列的上帝——面前流淌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流淌”也可理解为“熔化”或“流泻而下”；原文动词通常指流动或滴流。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文所用的上帝之名；有些译本译作“耶和华”或以“主”代替。
    reason: divine_name
lexical_decisions:
- source_word: הָרִים
  choice: 群山
  rationale: 原文带定冠词，指场景中的众山；“群山”在现代汉语诗体中自然，也保留复数意味。
- source_word: נָזְלוּ
  choice: 流淌
  rationale: 该动词的基本意象是流动、滴流。这里以“流淌”保留神显诗歌中群山仿佛化为流体的鲜明图景，不直接改译为较具解释性的“震动”或“熔化”。
- source_word: מִפְּנֵי
  choice: 在……面前
  rationale: 这是表示面对某者或因其临在而发生反应的惯用语；“在……面前”既自然，又保留原文反复出现的“面/临在”意涵。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列上帝之专名的性质，不以称号代替。
- source_word: זֶה סִינַי
  choice: 这西奈山
  rationale: 保留指示词“这”的突兀诗意；汉语补出“山”，使所指清楚，并与前句“群山”自然衔接。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 自然表达原文的属格结构，并作为同位语明确说明雅威的身份。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名；音译为“雅威”可避免把专名改成称号，同时不加入宗派性解释。
- issue: 群山对神临在的反应
  choice: 流淌
  alternative: 熔化；震动
  rationale: “流淌”贴近 נזל 的词汇意象，并保留诗句究竟描绘熔解、流泻还是更广义宇宙震撼的张力；脚注列出常见理解。
- issue: זֶה סִינַי 的省略式诗句
  choice: 这西奈山……也是如此
  alternative: 西奈山也……；就是西奈山……
  rationale: 原文以“这西奈”突兀承接前句，并省略动词。译文保留“这”，以“也是如此”显明汉语所需的承接关系，而不改变所述事件。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保留原文神显诗歌的大胆意象、重复结构和“这西奈”的突兀指示感。破折号标出“以色列的上帝”是对雅威的同位说明。
