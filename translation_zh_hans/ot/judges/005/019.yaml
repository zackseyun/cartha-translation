  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: zh_hans
  text: 众王前来交战；那时，迦南诸王在他纳、米吉多水旁争战；他们没有掠得银财[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们没有取得银财之利”。希伯来语此语可泛指物质收益；在这里的战争语境中，也可理解为掠得的银子或银财。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  choice: 众王来到
  rationale: 保留无冠词复数“王”和诗歌开篇的简短有力；“来到”表达进入战场场景。
- source_word: נִלְחָמוּ
  choice: 交战
  rationale: 尼法勒词形在此表示作战；“交战”简洁自然，也符合战场语境。
- source_word: אָז נִלְחֲמוּ מַלְכֵי כְנַעַן
  choice: 那时，迦南诸王……争战
  rationale: “那时”保留 אָז 的时间推进作用；构造链直译为“迦南诸王”。
- source_word: בְּתַעְנַךְ
  choice: 在他纳
  rationale: 介词 בְּ 在此标示战事发生的地点；“他纳”为通行中文地名译法。
- source_word: עַל מֵי מְגִדּוֹ
  choice: 米吉多水旁
  rationale: עַל 在地理表达中表示邻近；“水旁”保留复数 מֵי 所指的当地水域而不擅自限定为河流或溪流。
- source_word: בֶּצַע כֶּסֶף לֹא לָקָחוּ
  choice: 他们没有掳得银子
  rationale: בֶּצַע כֶּסֶף 可指银财收益，在战事语境中很可能指银子战利品；“掳得银子”自然凝练，同时用脚注保留较宽泛的词义。
