base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: zh_hans
  text: '众星从天上交战，

    从自己的轨道上与西西拉交战。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轨道”也可译作“路径”或“行道”；希伯来语可指道路或行进路线，这里指众星在天空运行的路径。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: 从天上
  rationale: מִן表示来源，שָׁמַיִם在此自然译作“天上”，既符合现代汉语，也保留诗歌的天界图景。
- source_word: נִלְחָמוּ
  choice: 争战／交战
  rationale: לחם的Nifal形表示投入战斗。首句用“争战”、次句用“交战”，保持重复语义和诗体节奏，同时避免汉语表达僵硬。
- source_word: הַכּוֹכָבִים
  choice: 众星
  rationale: 直译为“星辰”；“众星”简洁庄重，并体现希伯来语定冠词所指的整体星群，不把它解释成天使或其他天军。
- source_word: מִמְּסִלּוֹתָם
  choice: 从它们的轨道上
  rationale: מְסִלּוֹת可指道路、大道或行进路线；用于众星时，“轨道”自然传达天体运行的路径，但不必严格理解为现代天文学概念。
- source_word: עִם סִיסְרָא
  choice: 与西西拉交战
  rationale: עִם字面为“与”，与战争动词连用时标明交战对象；汉语“与……交战”本身清楚表达敌对关系，并保留原文介词形式。
theological_decisions:
- issue: 众星如何参与战斗
  choice: 保留“众星从天上争战”的诗意陈述，不说明其具体机制
  alternative: 解释为天体直接介入、天使天军作战，或上帝借自然力量施行护理
  rationale: 底波拉之歌没有界定众星参战的方式。直保其宇宙性意象，既不把诗句扁平化，也不替原文解决其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言，分为两个平行分句。用“众星”保留拟人化意象；用“与西西拉交战”清楚表达战争语境中的敌对关系。脚注标记置于相关整句之后。
