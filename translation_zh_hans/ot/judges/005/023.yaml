  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: zh_hans
  text: “咒诅米罗斯！”雅威的使者[a]说：“咒诅，重重咒诅它的居民！因为他们没有来帮助雅威，来帮助雅威攻击勇士[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的天使”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文此处直译可作“在勇士中”；也可理解为“攻击勇士”或“与勇士一同作战”。
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: 要咒诅 / 要咒诅，重重咒诅
  rationale: ארר的命令式表达强烈的咒诅；第二处命令式后接同词根的绝对不定式，具有加强语气的作用，因此译为“重重咒诅”，既传达强化，也保留诗歌的重复。
- source_word: מֵר֗וֹז
  choice: 米罗斯
  rationale: 按专名音译；原文只点明名称，并未明说它是城镇或地区。
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: 雅威的使者
  rationale: מַלְאָךְ可指“使者”或“天使”。正文采用较能保留词义开放性的“使者”，不预先判定其身份；另一译法列入脚注。
- source_word: יֹשְׁבֶ֑י/הָ
  choice: 其中的居民
  rationale: 分词附阴性单数后缀，所指为居住在米罗斯的人；“其中的居民”自然地保留集体含义。
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: 因为他们没有前来
  rationale: כִּי在此引出受咒诅的原因，“因为”清楚表达因果关系；בוא的动态含义以“前来”体现。
- source_word: לְ/עֶזְרַ֣ת יְהוָ֔ה
  choice: 帮助雅威
  rationale: 希伯来文使用“前来援助雅威”的名词结构。汉语译作“前来帮助雅威”较自然，并在两处完整重复，以保留诗句的修辞力度。
- source_word: בַּ/גִּבּוֹרִֽים
  choice: 攻击勇士
  rationale: 介词ב在此结构中含义不易确定。结合战歌语境，正文采用“攻击勇士”，但不把这一解释当作唯一可能，其他理解在脚注中说明。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；“雅威”以现代汉语常见形式音译该立约之名，而不是以称号代替。
- issue: מַלְאַךְ יְהוָה所指身份
  choice: 雅威的使者
  alternative: 雅威的天使
  rationale: 译文不判定这位使者究竟是受造天使、人间传信者，还是雅威的特殊显现，而保留原词本身的身份张力。
- issue: בַּגִּבּוֹרִים的关系
  choice: 攻击勇士
  alternative: 在勇士中；与勇士一同
  rationale: 介词ב使末句存在真实的句法歧义。正文依上下文选择敌对关系，但脚注明示其他可行读法，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。以引号呈现使者的话，用两次“要咒诅”和两次“没有前来帮助雅威”保留原文的平行、重复与强烈语气；不补入“城”等原文未明说的信息。
