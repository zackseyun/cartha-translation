  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִׁמְע֣וּ מְלָכִ֔ים הַאֲזִ֖ינוּ רֹֽזְנִ֑ים אָֽנֹכִ֗י לַֽ/יהוָה֙ אָנֹכִ֣י אָשִׁ֔ירָה אֲזַמֵּ֕ר לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: zh_hans
  text: 君王啊，你们要听[a]！掌权者啊，你们要侧耳听！至于我，我要向雅威歌唱；我要向雅威——以色列的上帝——奏乐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“要听……要侧耳听”使用两个意义相近的命令词，借平行句式加强诗歌的呼召语气。
    reason: lexical_alternative
  - marker: b
    text: “奏乐”也可译作“吟唱赞美”。原文在这里用了两个相关而不完全相同的动词：“歌唱”和“奏乐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 这是复数命令式；“要听”简洁自然，适合诗歌中向君王发出的郑重呼召。
- source_word: מְלָכִים
  choice: 君王
  rationale: 该复数名词直接指政治上的王；“君王”兼具现代可懂性与庄重语体。
- source_word: הַאֲזִינוּ
  choice: 要侧耳听
  rationale: 该词与“听”近义而更形象；译作“侧耳听”保留希伯来诗歌的同义平行和语势递进。
- source_word: רֹזְנִים
  choice: 掌权者
  rationale: 该词指统治者或高级权贵；“掌权者”清楚表达其政治权柄，不限于某一种官衔。
- source_word: אָנֹכִי ... אָנֹכִי
  choice: 至于我，我要
  rationale: 两个独立人称代词形成强调。“至于我，我要”以自然汉语保留自我宣告和重复所产生的强调。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 与歌唱、奏乐动词连用，可表示对象或奉献方向；“向”在汉语中自然涵盖这两层意思。
- source_word: יהוה
  choice: 雅威
  rationale: 原文直接使用四字神名 יהוה；“雅威”作为现代汉语常见音译，保留这是专名而非称号。
- source_word: אָשִׁירָה
  choice: 我要……歌唱
  rationale: 该形式带意愿或决心色彩；“我要歌唱”自然表达说话者坚定的意愿。
- source_word: אֲזַמֵּר
  choice: 我要……奏乐
  rationale: זמר 可指奏乐、吟唱或以音乐赞美；“奏乐”既与前面的“歌唱”有别，也保留音乐性而不限定具体乐器。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 按原文的属格结构直译，明确雅威就是以色列的上帝。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文采用神的专名，而非普通称号；音译“雅威”较直接地保留专名性质，并避免将其化为称谓。
- issue: זמר 是否明确译成“赞美”
  choice: 奏乐
  alternative: 吟唱赞美
  rationale: 该动词在此可以含有赞美的宗教指向，但词义本身也突出音乐行为；正文用“奏乐”保留与“歌唱”的区别，不把隐含目的过度明说。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语体；用两次呼语和两个命令句保留平行结构，以“至于我，我要”传达 אָנֹכִי 的重复强调，并用破折号标明“以色列的上帝”是对雅威的同位说明。
