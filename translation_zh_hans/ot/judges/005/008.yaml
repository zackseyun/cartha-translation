base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: zh_hans
  text: 他们选择了新的神明[a]；那时，战火临到城门[b]。以色列四万人中，岂能见到盾牌或长矛？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为“他（或有人）选择了新的神明”。希伯来文动词是单数，但通常按集合意义理解为以色列民。
    reason: alternative_reading
  - marker: b
    text: 本句希伯来文含义较难确定；也可译作“那时，城门口有争战”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: 他们选择了
  rationale: 原文动词在形态上是第三人称阳性单数，但此处可理解为不定或集合性的主体；结合上下文，以“他们”指以色列民，既自然又保留脚注所说明的语法难点。
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: 新的神明
  rationale: 此处复数指以色列所转向的外邦神祇；“新的神明”在现代汉语中清楚、自然，并保留原文的讽刺意味。
- source_word: אָז
  choice: 那时
  rationale: 表达时间及前后关联，使背离与随后的危机相接。
- source_word: לָחֶם שְׁעָרִים
  choice: 战火临到城门
  rationale: 原文高度凝缩且解释困难；将 לָחֶם 理解为战争或争战，表达冲突已逼近城门，同时避免生硬地补出过多细节。
- source_word: מָגֵן
  choice: 盾牌
  rationale: 常见军事用语，直译清楚。
- source_word: אִם יֵרָאֶה
  choice: 岂能见到
  rationale: 按修辞问句处理，暗示武器全然不见；“岂能见到”符合庄重而自然的现代汉语。
- source_word: וָרֹמַח
  choice: 或长矛
  rationale: “长矛”是现代读者易懂的标准兵器名称；连词在否定性修辞问句中自然译作“或”。
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: 四万人中
  rationale: 介词表示在这一群体范围之内；该表达简洁地保留原文所强调的巨大人数。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列
  rationale: 与“四万人中”合成“以色列四万人中”，自然表达民族群体范围。
theological_decisions:
- issue: 开头动词的主体
  choice: 按集合性意义理解为以色列民：“他们选择了新的神明。”
  alternative: 按形态直译为“他／有人选择了新的神明”；或将“神”理解为主体。
  rationale: 动词虽为阳性单数，但上下文指向以色列民的背离。若把以色列的神视为主体，就会形成“神选择新神明”的不合语境说法。正文采用集合性主体，脚注保留原文单数形式的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。诗句保持紧凑，以分号连接背离与危机；修辞问句保留原文对以色列缺乏武器的强烈强调。
