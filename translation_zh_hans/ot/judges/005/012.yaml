base_translation:
  language: en
  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: zh_hans
  text: “醒来，醒来，底波拉！醒来，醒来，唱一首歌！起来，巴拉，掳掠你的俘虏[a]，亚比挪庵的儿子！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“掳掠你的俘虏”，是以同根词构成的希伯来语表达，描写战胜仇敌并把他们掳去。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: 醒来
  rationale: 阴性单数命令式，四次重复，形成强烈而急迫的诗歌呼召；“醒来”自然且保留原文意象。
- source_word: דְּבוֹרָה
  choice: 底波拉
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: דַּבְּרִי שִׁיר
  choice: 唱一首歌
  rationale: דבר 字面为“说”，但“说一首歌”在现代汉语中生硬；结合 שִׁיר 及诗歌语境，译作“唱一首歌”能自然表达发声吟唱之意。
- source_word: קוּם
  choice: 起来
  rationale: 阳性单数命令式，直接呼唤巴拉采取行动；“起来”简洁并符合诗体。
- source_word: בָּרָק
  choice: 巴拉
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וּשֲׁבֵה
  choice: 掳掠
  rationale: 该命令式表示掳取或带走俘虏；“掳掠”保留军事胜利语境，并可与后面的同根名词形成修辞呼应。
- source_word: שֶׁבְיְךָ
  choice: 你的俘虏
  rationale: שֶׁבִי 可指被掳者或被掳状态；在此与 שבה 构成同根表达，译为“你的俘虏”保留原文有意的重复及其胜利含义。
- source_word: בֶּן אֲבִינֹעַם
  choice: 亚比挪庵的儿子
  rationale: 保留原文正式的父子身份称谓，并采用通行音译。
