  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: zh_hans
  text: 从以法莲来的，是根基在亚玛力的人[a]；在你之后，便雅悯在你的众民中[b]。从玛吉有统领下来[c][d]；从西布伦有手持书记之杖的人出来[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的根基在亚玛力”，或“他们的根基在亚玛力山区”，也可能译作“他们攻打亚玛力”。希伯来文这一诗句艰涩，可能涉及地理背景。
    reason: alternative_reading
  - marker: b
    text: 本句也可译：“便雅悯在你之后，列在你的众民中。”原文“你的众民”这一说法不寻常，也可能指“你的宗族”或“你的亲族”。本句的代词所指和句法关系均有争议。
    reason: lexical_alternative
  - marker: c
    text: “玛吉”是玛拿西支派中的主要宗族；有些译本按较广的支派意义译作“玛拿西”。
    reason: cultural_note
  - marker: d
    text: “统领”或译“颁令者”“治理者”或“立法者”。原词可指制定命令或施行治理的人。
    reason: lexical_alternative
  - marker: e
    text: “手持书记之杖的人”也可译作“拉动书记之杖的人”或“手持元帅之杖的人”。原文表达罕见，可能与召集、点名军队或记录有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: 从以法莲出来的
  rationale: 介词表示来源；用“从……出来的”既保留诗歌中各支派依次出场的结构，也符合现代汉语。
- source_word: שָׁרְשָׁם
  choice: 扎根
  rationale: 原文直译涉及“根”，在此可能指以法莲人在某地的根基、定居或源出关系；译作“扎根”保留比喻，不武断解释为后裔。
- source_word: בַּעֲמָלֵק
  choice: 在亚玛力
  rationale: בְּ最自然可作地点介词；原句艰涩，正文保留“在亚玛力”的含混性，不径自改成军事意义的“攻打亚玛力”。
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: 便雅悯啊……他们跟随你
  rationale: 原文极简，可直译为“在你之后，便雅悯”；结合上下文，以呼语和补出的主语使中文可读，同时脚注保留另一种句法理解。
- source_word: בַּעֲמָמֶיךָ
  choice: 在你的众民中
  rationale: 原文是带第二人称单数后缀的“众民”，表达不寻常；正文近译为“你的众民”，不直接限定为宗族或军队。
- source_word: מִנִּי מָכִיר
  choice: 从玛吉
  rationale: 保留希伯来文直接使用的玛吉之名，不以更广义的“玛拿西”取代。
- source_word: יָרְדוּ
  choice: 下来
  rationale: 忠实表达动词“下去、下来”，也符合胜利之歌中各支派前来参战的图景。
- source_word: מְחֹקְקִים
  choice: 统领
  rationale: 该词可指颁令者、治理者；在召集支派参战的语境中，“统领”自然且体现权柄，但脚注保留“立法者”等可能。
- source_word: וּמִזְּבוּלֻן
  choice: 从西布伦出来的
  rationale: 延续支派名单中表示来源的平行结构。
- source_word: מֹשְׁכִים
  choice: 手执
  rationale: 分词本义为拉、抽、牵；与“杖”连用时，“手执”在中文中自然，并保留使用器具的形象。
- source_word: בְּשֵׁבֶט סֹפֵר
  choice: 书记之杖
  rationale: שֵׁבֶט可指杖、棍或权杖，סֹפֵר指书记、文士。此罕见短语可能与军队点名、记录或统率有关；直译“书记之杖”能保留意象和不确定性。
