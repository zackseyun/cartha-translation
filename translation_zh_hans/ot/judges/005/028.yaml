base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: zh_hans
  text: 西西拉的母亲从窗户向外张望；她隔着窗格哀号[a]说：“他的战车为什么迟迟不来？他众战车的脚步[b]为什么迟延？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀号”所译的希伯来语动词十分罕见，也可译作“高声呼喊”。
    reason: lexical_alternative
  - marker: b
    text: 直译“他众战车的脚步”。这可指战车行进的踏响；原文没有明确限定为马蹄声或车轮声。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: 从窗户
  rationale: בְּעַד与窗户连用，表示透过这一开口向外看；现代汉语用“从窗户向外张望”自然表达这一空间关系。
- source_word: נִשְׁקְפָה
  choice: 向外张望
  rationale: 该动词常指从窗户或高处向外、向下观看；“张望”也贴合母亲焦急等候的场景。
- source_word: וַתְּיַבֵּב
  choice: 哀声呼喊
  rationale: 这是罕见动词，可能指哀号或发出焦急的喊声；正文兼顾哀切与出声呼喊，脚注保留词义的不确定性。
- source_word: אֵם סִיסְרָא
  choice: 西西拉的母亲
  rationale: 按现代汉语自然表达其属格关系。
- source_word: בְּעַד הָאֶשְׁנָב
  choice: 隔着窗格
  rationale: אֶשְׁנָב指带格栅的窗洞；“窗格”简明保留建筑意象，并与前句形成诗歌复述。
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: 他的战车为什么迟迟不来
  rationale: בֹּשֵׁשׁ表示延迟、迟迟未到；汉语调整语序，使焦急的问句自然流畅。
- source_word: פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: 他的战车声
  rationale: פַּעֲמֵי字面为“脚步、步声、踏响”；修饰“战车”时具体所指并不完全明确。“战车声”保留听觉意象，同时避免擅自限定为马蹄或车轮。
