base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: zh_hans
  text: 你为什么坐在羊圈之间，听那召唤羊群的哨声？吕便各分支的人[a]，内心深深思量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在吕便的溪流旁”。这里的希伯来语词可指“分支、分区”，也可指“水道、溪流”。
    reason: 保留פְלַגּוֹת的词义歧义；脚注标记锚定正文中对应的“各分支”。
lexical_decisions:
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接保留责问原因的疑问语气，现代汉语自然明确。
- source_word: יָשַׁבְתָּ
  choice: 坐在
  rationale: 保留动词“坐”的具体画面和诗歌中的责备力度，不解释性地改作“逗留”。
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: 在羊圈之间
  rationale: 结合下文羊群的意象，采用传统且最符合语境的“羊圈”；“之间”保留介词和原文空间画面。
- source_word: לִשְׁמֹעַ שְׁרִקוֹת עֲדָרִים
  choice: 听那召唤羊群的哨声
  rationale: שְׁרִקוֹת指吹哨或尖锐的呼唤声；“召唤羊群”自然表达该声音指向羊群的牧养语境。
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: 吕便各支系中
  rationale: פְלַגּוֹת可指分支、分区或水道；正文按本段论及吕便群体迟疑的语境译作“各支系”，同时用脚注保留“溪流旁”的真实词义可能。
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: 人心深深思量
  rationale: חִקְרֵי לֵב描写内心的探究、审视或斟酌；“深深思量”保留诗意和心理张力，并以程度副词体现גְּדוֹלִים的加强作用。
theological_decisions:
- issue: 吕便的内心活动是赞许还是责备
  choice: 采用中性的“人心深深思量”
  alternative: 人心深深反省／心中大有定见
  rationale: 原文描写强烈的内心探究，却未在词组本身明确判定其为悔改或坚定决心；中性译法保留诗歌在吕便犹疑不行动这一语境中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留底波拉之歌的反问语势和简洁诗行。称呼“你”为单数，与希伯来语形式一致，并将吕便作为集体对象。
