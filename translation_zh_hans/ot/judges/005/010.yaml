base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: zh_hans
  text: 骑白色母驴的，坐在坐垫上的[a]，在路上行走的，你们要述说！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坐垫”：或译“鞍垫”或“毯子”。这里的希伯来词罕见，含义不确定。
    reason: lexical_alternative
  - marker: b
    text: “述说”：或译“说出”“谈论”或“讲述”。这里的希伯来动词也可表示默想。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: 骑着……的
  rationale: 阳性复数构造分词在诗中作呼语，与后面的两个分词结构平行；译为“骑着……的”自然保留直接呼唤的语气。
- source_word: אֲתֹנוֹת
  choice: 母驴
  rationale: 该名词明确指雌驴；现代汉语用“母驴”简明自然，也比笼统的“驴”更贴近原文。
- source_word: צְחֹרוֹת
  choice: 白色
  rationale: 该形容词最直接表示白或明亮；“白色母驴”保留原诗所描绘的醒目、尊贵形象。
- source_word: יֹשְׁבֵי
  choice: 坐在……上的
  rationale: 分词在此与前后结构平行，作呼语；介词 עַל 也支持“坐在某物之上”的理解。
- source_word: מִדִּין
  choice: 华美坐垫
  rationale: 此词罕见，含义不确定。结合骑乘者与行路者的语境，较可能指供人坐卧的铺垫、毯子或鞍垫；正文用“华美坐垫”传达贵重铺垫的可能含义，同时以脚注保留不确定性。
- source_word: וְהֹלְכֵי
  choice: 走在……上的
  rationale: 分词作为第三组呼语；“走”保留具体动作，也可自然指一般行旅。
- source_word: דֶּרֶךְ
  choice: 路
  rationale: 常用词，指道路或路径；此处处于出行场景，“路”简洁自然。
- source_word: שִׂיחוּ
  choice: 传讲
  rationale: 复数命令式在此可表示说出、述说或反复谈论。胜利之歌的语境倾向于呼吁众人述说所发生的事；“传讲”既有公开说出的意味，也不限定所述内容，其他可能译法列入脚注。
