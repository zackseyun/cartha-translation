  source_fidelity: “最有智慧的”将חַכְמוֹת理解为明确的最高级，但该词形本身可自然表示“聪慧的女子／贵妇”；原文并未以形态明确标示最高级。正文又以“这些话”替代带所有格的אֲמָרֶיהָ（她的话）。修订保留复数、身份、强调和末尾冒号，并明确“自己的话”。
