  yaml_path: translation/ot/judges/005/029.yaml
  text: 'Her wisest princesses answer her; indeed, she herself repeats her words to herself:'
translation:
  language: zh_hans
  text: 她那些聪慧的贵妇回答她；她自己也把自己的话反复说给自己听：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: 她的贵妇中最有智慧的
  rationale: חַכְמוֹת是阴性复数“有智慧的女子”，与שָׂרוֹתֶיהָ“她的女贵族、贵妇”构成限定关系；译成“贵妇中最有智慧的”自然表达这里可能具有最高级意味的结构。
- source_word: תַּעֲנֶינָּה
  choice: 回答她
  rationale: 该词是阴性复数未完成式，在诗歌叙述中表示这些贵妇作出回答；宾语后缀指向西西拉的母亲。
- source_word: אַף הִיא
  choice: 她自己也
  rationale: 保留אַף的递进、附加强调和独立代词הִיא的强调作用。
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: 把这些话反复说给自己听
  rationale: 直译近似“把她的话回应给自己”；结合语境，表达她接受贵妇的安慰并在心里向自己重复这些说法，同时以脚注保留原文可作“回答自己的话”的歧义。
