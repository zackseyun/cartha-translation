  to: “他们岂不是寻得、分配战利品吗？一个子宫、两个子宫，给每个男人；给西西拉的是彩染布料的战利品，是彩染布料、刺绣品；染色布料，两件刺绣品，给战利品的颈项[b]。”
  rationale: 为符合源文，保留“子宫”这一故意刺耳的借代、按人分配的意思、彩染与刺绣战利品的重复，以及末语“给战利品的颈项”的未决歧义。修订仅消除不自然的“正在找到”，并撤除“双方刺绣”这一无法由双数形式安全推出的解释。脚注a保留原有锚点但应置于正文“一个子宫”之后；据此正文已补上[a]。
