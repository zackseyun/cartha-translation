source:
  edition: WLC
  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: zh_hans
  text: “他们岂不是寻得、分配战利品吗？一个子宫、两个子宫，给每个男人；给西西拉的是彩染布料的战利品，是彩染布料、刺绣品；染色布料，两件刺绣品，给战利品的颈项[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“给俘虏的颈项”或“戴在被掳女子的颈上”。末句的希伯来文难解；“两件刺绣品”也可理解为“双重刺绣”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ
  choice: 他们不是正在找到战利品，正在分配吗
  rationale: 将 הֲלֹא 译作反问，并用“正在”表现歌中人物对战后行动正在发生的生动设想；两个动词依原文次序保留。
- source_word: שָׁלָל
  choice: 战利品
  rationale: 这是战争中掳获之物的常用词；“战利品”在现代汉语中清楚、庄重，也适合诗歌语境。
- source_word: רַחַם רַחֲמָתַיִם
  choice: 一个子宫，两个子宫
  rationale: 原文以“子宫”残酷地借指被掳作性战利品的女子。直译保留其物化和令人震惊的表达，不以“女人”或“女子”加以软化。
- source_word: לְרֹאשׁ גֶּבֶר
  choice: 给每个男人
  rationale: 字面为“给一个男人的头”，在这里是按人分配的习语；译出分配义，同时保留 גֶּבֶר 的男性指称。
- source_word: צְבָעִים
  choice: 染色布匹
  rationale: 指染过颜色的纺织品；“布匹”比单说“衣服”更少加入原文未明说的成衣概念。
- source_word: רִקְמָה
  choice: 刺绣布
  rationale: 该词表示刺绣品或刺绣织物；在压缩的战利品清单中译为“刺绣布”，自然且保留纺织品意象。
- source_word: צֶבַע רִקְמָתַיִם
  choice: 染色布，双面刺绣
  rationale: 原文结构高度压缩，רִקְמָתַיִם 是双数形式。译文保留“染色”与双数刺绣的并列，不把难解句法过度理顺。
- source_word: לְצַוְּארֵי שָׁלָל
  choice: 给战利品的颈项
  rationale: 采取贴近原文的译法，以显出末句本身的困难；可能所指另见脚注。
theological_decisions:
- issue: 是否软化 רַחַם רַחֲמָתַיִם 所表达的性化战争掳掠
  choice: 保留“一个子宫，两个子宫”这一直接借代
  alternative: “一个女子，两个女子”或“每个男人一个、两个女人”
  rationale: 这是西西拉母亲及其贵妇所设想的战利品，并非叙述者的赞许。保留原文的物化语言，能维持诗歌的道德张力与讽刺冲击。
- issue: 如何处理难解的末语 לְצַוְּארֵי שָׁלָל
  choice: 正文采用贴近字面的“给战利品的颈项”，脚注说明另一种理解
  alternative: “给俘虏的颈项”或“戴在被掳女子的颈项上”
  rationale: 希伯来文简缩且所指有争议；正文不武断消除歧义，脚注则帮助现代读者理解可能的语义。
- issue: רִקְמָתַיִם 的双数如何表达
  choice: 译作“双面刺绣”并加注说明
  alternative: “两件刺绣品”或“两层刺绣”
  rationale: 双数究竟指两件、两面或双重刺绣并不确定；“双面刺绣”可读性较好，但以脚注明示其他可能。
translation_notes:
  register: 采用现代、庄重而可懂的普通话，保留底波拉之歌中清单式的重复、压缩句法和残酷反讽。“子宫”刻意保持原文刺耳的物化措辞；末句不以流畅为由消除真实歧义。
