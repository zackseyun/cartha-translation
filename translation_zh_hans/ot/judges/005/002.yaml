  language: zh_hans
  text: 以色列中领袖带头时，百姓甘心自愿时，你们当称颂耶和华！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: 首领奋勇带头
  rationale: 该短语意义不确定；结合下句“百姓甘心”和士师记5章的凯歌语境，采用传统且符合平行结构的理解，表达领袖率先行动，但以脚注保留其他可能。
- source_word: בְּהִתְנַדֵּב עָם
  choice: 百姓甘心出战
  rationale: התנדב表示自愿、甘心献上自己；在战争诗歌语境中，补出“出战”使现代汉语自然，并与本章9节的志愿参战相呼应。
- source_word: בָּרֲכוּ יְהוָה
  choice: 要称颂耶和华
  rationale: ברך在此是向上帝发出赞美、颂赞；采用“称颂”保持庄重而易懂。神名四字母יהוה按现代中文圣经通行形式译为“耶和华”。
theological_decisions:
- issue: 本句是否明确把行动主体解释为政治或军事“首领”
  choice: 正文采用“首领奋勇带头”，同时加注说明原文歧义
  alternative: 以色列中有人蓄发／披散头发；或以色列中放任无序
  rationale: 希伯来语בפרע פרעות是罕见且有争议的表达。上下文和平行句支持“领袖带头”的传统理解，但原文并不足以排除与蓄发、披发或放任有关的解释，因此不应无注释地消除张力。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“奋勇带头／甘心出战”形成平行节奏；“要称颂耶和华”保留原文由叙述转向劝颂的力度。
