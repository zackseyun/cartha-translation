  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: zh_hans
  text: 我的心向着以色列的领袖[a]，就是那些在民中甘心献身的人。你们要称颂雅威！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领袖”或译“颁布法令的人”。
    reason: 原词源于“制定、颁布”，可指颁令者、治理者或领袖。
lexical_decisions:
- source_word: לִבִּי
  choice: 我的心向着
  rationale: 保留“我的心”这一希伯来语意象，并以“向着”自然表达说话者对这些人的认同与赞许；原文是无系词结构，译文不把这种关系过度具体化。
- source_word: לְחוֹקְקֵי
  choice: 领袖
  rationale: 该词源于“制定、颁布”之意，在本诗语境中指承担治理或统率责任的人。“领袖”符合上下文，也避免让现代读者误以为仅指专门立法者；词根所容许的另一译法收入脚注。
- source_word: יִשְׂרָאֵל
  choice: 以色列的
  rationale: 自然表达所属关系，指这些领袖属于以色列。
- source_word: הַמִּתְנַדְּבִים
  choice: 甘心献身的人
  rationale: Hitpael 分词表达自愿献上自己、主动挺身而出。“甘心献身”兼顾自愿性与自我投入，比单说“志愿参加”更能保留原词力度。
- source_word: בָּעָם
  choice: 在民中
  rationale: עם 的基本义是“人民、民众”。“在民中”保留其宽泛所指，不将其缩窄为军队。
- source_word: בָּרֲכוּ
  choice: 你们要称颂
  rationale: 复数命令式在中文中以“你们要”明确其呼吁对象；“称颂”既可表达向神祝颂，也符合诗歌的庄重语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”是依据较通行的学术重建音译，同时不以“主”等称号取代专名。
- issue: הַמִּתְנַדְּבִים 与“领袖”的关系
  choice: 以“就是”表达同位说明
  alternative: 译作独立的第二组人：“以及在民中甘心献身的人”
  rationale: 定冠词分词紧接“以色列的领袖”，最自然地说明这些领袖正是甘心挺身而出的人；但语法仍带诗体的凝练性，因此不进一步添加具体行动或身份。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“我的心向着”保留原文凝练的无系词表达；“在民中”略带经文诗体色彩，但仍为现代读者所能理解。
