base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: zh_hans
  text: 那时，余民下到显贵那里；雅威的百姓为我[b]下到勇士当中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本诗行的希伯来文句法较难确定。“余民”也可译作“一个幸存者”。两处介词的关系也有争议：全句可理解为余民“向／对显贵”下来、雅威的百姓“向／对勇士”下来；也可按较非敌对的关系理解，如“到显贵那里”或“在／与勇士当中”。
    reason: alternative_reading
  - marker: b
    text: “为我”原文直译如此；很可能是底波拉在诗中自称，也可理解为“到我这里”或“与我同来”。
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为时间副词，引出凯歌中的下一幕；“那时”简洁而庄重。
- source_word: יְרַד / יְרַד
  choice: 下到
  rationale: 保留同一动词两次重复及其“下降、下去”的空间意象；诗歌语境中不强行判定叙述者的视角。
- source_word: שָׂרִיד
  choice: 余民
  rationale: 该词可指幸存者或剩余的一群人；此处用集合性称呼“余民”，同时在脚注保留单数“幸存者”的可能。
- source_word: לְאַדִּירִים
  choice: 到显贵那里
  rationale: אַדִּירִים可指有权势或尊贵的人；לְ的关系在本诗句中难以确定，正文采用较少解释性的趋向表达，并由脚注说明也可能具有敌对含义。
- source_word: עָם יְהוָה
  choice: 雅威的百姓
  rationale: 自然表达百姓归属于雅威的关系，并保留神的专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号“主”替代。
- source_word: לִי
  choice: 为我
  rationale: 直译第一人称单数形式，不消除其可能是底波拉诗中自指的含义。
- source_word: בַּגִּבּוֹרִים
  choice: 到勇士中
  rationale: גִּבּוֹרִים在战争语境中自然译作“勇士”；בְּ通常可表示“在……中”，但此句也可能表达敌对或伴随关系，故在脚注保留其他读法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 主；耶和华
  rationale: 原文直接使用以色列之神的专名；采用“雅威”保留专名性质，不以称号替代。
- issue: 两分句中介词的句法作用
  choice: 正文采用非敌对的趋向／范围表达：“到显贵那里”“到勇士中”
  alternative: “攻向显贵”“攻打勇士”；或“与显贵同去”“和勇士一同下来”
  rationale: 诗行古奥，לְ与בְּ在此可能表示趋向、对象、伴随、范围，或在战斗语境中带敌对含义。正文避免把争议解释定为唯一读法，脚注明确列出主要可能。
- issue: “为我”的说话者
  choice: 保留第一人称“为我”
  alternative: 明确改写为“为底波拉”
  rationale: 原文只有第一人称代词，并未在本句明说所指；不把很可能的底波拉自指写入正文，以保留诗歌声音。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌叙事语体。刻意重复“下到”，对应希伯来文同一动词的复现；以脚注保存本节介词关系和单复数意象上的真实歧义。
