  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: zh_hans
  text: '西布伦的百姓不顾惜自己的性命，甚至不惜一死[a]；

    拿弗他利也一样，

    在田野的高处。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“轻看／不顾惜自己的性命，以至于死”；这里表达他们冒死的勇敢。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: 西布伦
  rationale: 按现代中文圣经人名的通行译法处理支派名。
- source_word: עַם
  choice: 百姓
  rationale: 保留希伯来文的集合单数表达，指西布伦支派众人。
- source_word: חֵרֵף נַפְשׁוֹ לָמוּת
  choice: 舍命至死
  rationale: חרף本有轻看、不顾之意；在战斗语境中表示不顾惜性命、冒死作战。“舍命至死”兼顾其强烈程度与中文诗歌的凝练表达。
- source_word: וְנַפְתָּלִי
  choice: 拿弗他利也是如此
  rationale: 连词使拿弗他利承接并共享前句的称许；补出“也是如此”，令省略结构在中文中清楚自然。
- source_word: עַל מְרוֹמֵי שָׂדֶה
  choice: 在田野的高处
  rationale: 按空间意义直译，保留“田野”和“高处”的地貌意象，不把שׂדה过度限定为“战场”。
- source_word: חֵרֵף … עַל מְרוֹמֵי שָׂדֶה
  choice: 舍命……在田野的高处奋战
  rationale: 末尾补出“奋战”，使中文明确该地点短语所属的战斗行动；这是由上下文得出的轻度补足，而非把“田野”直接改译为“战场”。
