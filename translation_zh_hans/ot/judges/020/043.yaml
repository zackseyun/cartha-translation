  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: zh_hans
  text: 他们包围便雅悯人，穷追不舍[a]，将他们践踏[b]，直到基比亚对面、在东边的地方[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穷追不舍”所对应的希伯来文也可理解为“从米努哈追赶他们”，若把“米努哈”视为地名。
    reason: alternative_reading
  - marker: b
    text: “践踏”也可译作“驱赶前行”；这里的希伯来动词既可有用力踩踏之意，也可能表示使对方行进。
    reason: lexical_alternative
  - marker: c
    text: “在东边的地方”直译为“从日出之处”；这是指东方或东边的方位说法，也可能说明该处位于基比亚东面。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: 包围
  rationale: 该动词表示从四周围住或困住；“包围”自然地传达军事语境。
- source_word: אֶת בִּנְיָמִן
  choice: 便雅悯人
  rationale: “便雅悯”在这里集合性地指该支派或其军队；汉语用“便雅悯人”更清楚，后文也相应使用集合复数代词。
- source_word: הִרְדִיפֻהוּ
  choice: 穷追不舍
  rationale: רדף意为追赶、追击；结合紧接其后的疑难词מְנוּחָה，将整组表达为“不让对方得喘息地追击”。
- source_word: מְנוּחָה
  choice: 穷追不舍（与前词合译）
  rationale: 该词通常意为“安歇、安歇之处”，此处句法和含义存疑；正文按副词性理解，表达追击时不让敌人歇息，同时用脚注保留地名读法。
- source_word: הִדְרִיכֻהוּ
  choice: 将他们践踏
  rationale: דרך的使役式可表达使之被踏、践踏，也可能表示驱赶前行；战斗语境支持较强烈的“践踏”，另以脚注保留“驱赶”的可能。
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: 在基比亚对面……直到
  rationale: נֹכַח表示正对、面向；按汉语语序调整后仍保留空间关系。
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: 直到日出之地
  rationale: 字面涉及“太阳升起的一方”，即东方或东边；正文略保留希伯来意象，并以脚注说明其通常方位义。
