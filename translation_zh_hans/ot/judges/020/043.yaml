  to: 他们包围便雅悯人，穷追不舍[a]，将他们践踏[b]，直到基比亚对面、在东边的地方[c]。
  rationale: 修订保留“穷追不舍”这一对疑难词的既有解释性取向，并通过脚注保留“米努哈”为地名的读法。将末尾译为“直到基比亚对面、在东边的地方”，使“直到”支配以基比亚为参照的地点，同时以自然汉语保留末语的东向方位。所有脚注均移至其实际说明的词语之后。
