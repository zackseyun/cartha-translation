base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: zh_hans
  text: 以色列全境选出的一万名精兵来到基比亚对面；战斗十分激烈，便雅悯人却不知道灾祸正逼近他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灾祸正临到他们。”希伯来文直译为“灾祸正触及他们”。
    reason: 保留נֹגַעַת“触及、达到”的字面意象及可行译法。
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: 来到基比亚前
  rationale: מִנֶּגֶד表示在某处前面或对面；此处处于交战语境。“来到基比亚前”既自然，也保留了空间位置及敌对推进的语意，而不把它过度明确为已经发动攻击。
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: 一万名精兵
  rationale: בָּחוּר在这里指挑选出来的优良战士，而不只是年轻男子；“精兵”简洁地表达军事语境中的精选人员。
- source_word: מִכָּל יִשְׂרָאֵל
  choice: 从以色列各地选出
  rationale: 该短语表示这些兵员取自以色列全体；“从以色列各地”在现代汉语中自然地传达其广泛来源。
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: 战斗十分激烈
  rationale: כָּבֵדָה在这里表示战况严重、猛烈，并非物理意义上的沉重；“十分激烈”符合现代军事叙述。
- source_word: וְהֵם לֹא יָדְעוּ
  choice: 他们却不知道
  rationale: 连接词 וְ 在语境中形成转折：战斗虽激烈，他们仍未察觉结局将至；“却”清楚而不过度地表达这一对比。
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: 灾祸正逼近他们
  rationale: נֹגַעַת本义为“触及、达到”，此处描写灾难临到；הָרָעָה在军事语境中指灾祸而非道德上的邪恶。“正逼近”保留其正在临近、即将触及的动态感。
theological_decisions: []
