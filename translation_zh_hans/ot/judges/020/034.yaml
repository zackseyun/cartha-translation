revisions:
- from: 从以色列各地选出的一万名精兵来到基比亚前，战斗十分激烈；他们却不知道灾祸正逼近他们[a]。
  to: 以色列全境选出的一万名精兵来到基比亚对面；战斗十分激烈，便雅悯人却不知道灾祸正逼近他们[a]。
  rationale: 将含混的“基比亚前”改为“基比亚对面”，以更准确呈现原文方位表达；并按上下文将代词明确为“便雅悯人”，避免现代汉语中把不知灾祸将至者误解为以色列军队。其余措辞和脚注均保留原文的军事语境、灾祸含义及“触及”的词汇意象。
