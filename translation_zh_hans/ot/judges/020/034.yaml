  source_fidelity: “来到基比亚前”在现代汉语中可被理解为时间上的“在基比亚之前”，空间义不够明确。מִנֶּגֶד לַגִּבְעָה在此宜译为“来到基比亚对面”，既保留方位义，也不把原文的空间表达强化为直接进攻。“他们”在原文语境中指便雅悯人；中文若紧接“一万名精兵”，会自然误指以色列军队，故应明确其所指。
  naturalness: 修订后句法更自然清楚。“以色列全境选出的一万名精兵”准确且通顺；以“便雅悯人”恢复叙事中明确的指代，避免中文代词歧义造成误读。
  terminology: “精兵”适切表达בָּחוּר在军事语境中的精选战士；“灾祸”准确表达הָרָעָה的灾难义，避免译作道德意义的“恶”。脚注保留נֹגַעַת的“触及／达到”字面意象。
