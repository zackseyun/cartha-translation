  yaml_path: translation/ot/judges/020/011.yaml
  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: zh_hans
  text: 于是，以色列所有的男子都聚集到那城，如同一人，彼此联合。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如同一人，彼此联合”也可译为“联合一致，仿佛一人”；原文以两个相连的表达强调他们行动完全一致。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: 都聚集
  rationale: 该词是אסף的尼法勒式，表达众人集合、聚集。中文用主动形式“聚集”自然地传达集体主语的动作。
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: 以色列所有的男子
  rationale: אִישׁ虽为单数形式，在כָּל之后具有集合、分配意义；本段是军事集结的语境，因此明确译作“男子”，不泛化为不分性别的“众人”。
- source_word: אֶל הָעִיר
  choice: 到那城
  rationale: אֶל的基本方向义是“到、向”。虽然上下文带有敌对行动，但原文此处并未明说“攻打”或“反对”，故保留较中性的方向表达。定冠词译作承接上文的“那”。
- source_word: כְּאִישׁ אֶחָד
  choice: 如同一人
  rationale: 直译并保留希伯来语以“一个人”描绘行动完全一致的惯用表达。
- source_word: חֲבֵרִים
  choice: 彼此联合
  rationale: 该词源于חבר，强调连接、联合和团结一致；“彼此联合”既保留其独立语义，也与前面的“如同一人”形成自然呼应。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接叙事进程；句末保留原文“如同一人”与“彼此联合”两层相近但不完全重复的强调，不将其合并成单一概念。
