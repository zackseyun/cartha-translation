  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: zh_hans
  text: 现在，我们要这样对付基比亚：按抽签的结果来行动[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们要抽签决定如何对付它。”希伯来原文十分简略，可能是说针对基比亚的行动要按抽签的结果来安排或分派。
    reason: 原文在“对付基比亚”之后以简略的“针对它，按抽签”表达行动；脚注保留抽签究竟决定行动、安排还是分派的歧义，也避免将省略的行动限定为“攻打”。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接前文并引出下一步行动；现代汉语用“现在”即可自然表达其时间兼转折推进作用，不必机械译出“而”。
- source_word: זֶה הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: 我们要这样对付
  rationale: 希伯来语直译近于“这就是我们所要做的事”。结合后接目标“基比亚”，译为“我们要这样对付”既符合现代汉语，也保留集体所拟定的行动计划。
- source_word: לַגִּבְעָה
  choice: 基比亚
  rationale: 介词 לְ 在这里标示行动所针对的对象；其关系已由“对付”表达，无须另行直译介词。
- source_word: עָלֶיהָ
  choice: 攻打它
  rationale: עַל 在军事语境中表示敌对行动的方向。原文此处省略谓语，中文补出“攻打”以使句意成立；“它”指城市基比亚。
- source_word: בְּגוֹרָל
  choice: 按抽签的结果
  rationale: 表示行动由所拈之签决定或分派。“按抽签的结果”比单说“抽签”更清楚，同时避免断定抽签具体决定的是部队、次序还是任务。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“对付”承载行动针对基比亚的含义，“攻打”则按军事语境补足原文省略成分；脚注说明原文的简略性，避免把抽签的具体功能解释得过死。
