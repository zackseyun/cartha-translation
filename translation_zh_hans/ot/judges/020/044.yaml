  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: zh_hans
  text: 便雅悯人中有一万八千人倒下；这些人全都是英勇的战士[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更贴近原文：有勇力的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: 倒下了
  rationale: נפל的基本义是“倒下”；在战争语境中指战死。译作“倒下了”保留希伯来语的军事委婉表达，又不必直加“被杀”或“死亡”所带来的解释。
- source_word: מִבִּנְיָמִן
  choice: 便雅悯人中
  rationale: 介词מִן在这里表示群体范围或归属，指倒下的人属于便雅悯支派。“便雅悯人中”符合现代汉语表达。
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: 一万八千人
  rationale: 原文数字后明确有אִישׁ（人），故保留“人”；不译作“士兵”，以免加入原文未明说的身份称谓。
- source_word: אֶת כָּל אֵלֶּה
  choice: 这些全都
  rationale: 该短语回指前述一万八千人，并引出同位性说明。“这些全都”在中文中简洁自然。
- source_word: אַנְשֵׁי חָיִל
  choice: 英勇的战士
  rationale: 此词组在战争语境中指有勇力、善战的人。“英勇的战士”兼顾其勇武品质和军事语境，且为现代读者清楚易懂。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“倒下了”保留原文战争语境中的委婉说法；分号呈现后半句对前述死者的概括说明。脚注标记置于其所解释的“英勇的战士”之后。
