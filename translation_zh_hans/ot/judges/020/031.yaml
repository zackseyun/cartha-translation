base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: zh_hans
  text: 便雅悯人[a]出来迎战以色列民，被引离了城[b]；他们开始像先前几次一样[c]，在大路上击杀以色列人约三十名。这些大路中，一条通往伯特利，另一条通往田野中的基比亚[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“便雅悯的子孙”。
    reason: lexical_alternative
  - marker: b
    text: 或译“与城隔开了”或“被诱离了城”。意思是他们被引出，离开了城的保护。
    reason: lexical_alternative
  - marker: c
    text: 或译“像先前那样”。希伯来文习语把这次攻击与此前的战斗相比。
    reason: lexical_alternative
  - marker: d
    text: “田野中”也可译作“野地中”或“开阔地中”。这短语也可能是描述通往基比亚的路线经过城外开阔地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 出来
  rationale: 叙事视角聚焦城外战场；“出来”自然表达他们从城中出动。
- source_word: בְנֵי בִנְיָמִן
  choice: 便雅悯人
  rationale: 现代汉语中自然清楚地指便雅悯支派的人；脚注保留希伯来文直译“便雅悯的子孙”。
- source_word: לִקְרַאת הָעָם
  choice: 迎战以色列民
  rationale: לִקְרַאת本义为“迎着、迎接”，在军事语境中译作“迎战”更准确；“以色列民”由上下文明确所指。
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: 被引离了城
  rationale: 该形式表达与城分离的被动结果；“被引离”传达战术诱敌之意，同时不把具体手段说得过满。
- source_word: וַיָּחֵלּוּ לְהַכּוֹת
  choice: 开始……击杀
  rationale: 保留חלל使役形的起始意义；נכה与חֲלָלִים连用，在本处明确涉及致死，故译“击杀”。
- source_word: כְּפַעַם בְּפַעַם
  choice: 像先前一样
  rationale: 该习语把此次交战与前几次战斗的情形相比较。
- source_word: בַּמְסִלּוֹת
  choice: 在大路上
  rationale: מְסִלָּה指修筑或抬高的主要道路；“大路”符合现代中文叙事语体。
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: 一条路通往伯特利
  rationale: עלה在地理表达中表示“上到、通往”；中文以“通往”自然表达路线。
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: 另一条通往旷野中的基比亚
  rationale: 保留בַשָּׂדֶה对路线或地点的地形限定；“旷野中”在中文里表达城外开阔地，但以脚注保留“田野”的可能。
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: 他们杀了约三十人
  rationale: 数量短语承接“击杀”；中文补出主语和动词，使长句关系清楚，所指仍是以色列人。
