  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: zh_hans
  text: 可是，以色列众人重振起来[a]，又在第一天列阵的地方列阵迎战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重振起来”也可译为“鼓起勇气”。希伯来语可指他们战败后重新坚定决心。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: 重振起来
  rationale: 该词为חזק的Hitpael形式，在战败后的语境中表示重新振作、恢复力量或决心；“重振起来”既自然，也保留其反身／不及物色彩，而不把含义限定为纯粹的勇气。
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 原文以集合名词“人民”和“以色列人／以色列男子”构成同位表达，语境所指是参战者。“以色列众人”在现代汉语中简洁自然，并避免译成原文没有明说的“军队”。
- source_word: וַיֹּסִפוּ
  choice: 又
  rationale: 该动词与后接不定式连用，表示再次或重新采取行动；“又”准确、简洁地表达重复。
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: 列阵迎战
  rationale: ערך与מלחמה搭配，指排定战阵、摆开阵势作战。“列阵迎战”保留军事部署的具体含义，也符合现代汉语表达。
- source_word: בַּמָּקוֹם אֲשֶׁר עָרְכוּ שָׁם
  choice: 在……列阵的地方
  rationale: 关系从句回指同一地点，并重复使用ערך。“在……的地方”自然传达地点关系，同时保留“列阵”的词汇呼应。
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: 第一天
  rationale: 直译该时间短语，明确指先前交战部署的那一天。
