  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: zh_hans
  text: 那一天，便雅悯人中阵亡的共有二万五千名拔刀作战的男子；这些人全是勇士。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 共有
  rationale: 此处是战况的总结；用“共有”自然承接上文，并引出阵亡总数，不生硬直译为“于是有”。
- source_word: כָל הַנֹּפְלִים
  choice: 阵亡的
  rationale: נפל 在战争语境中指倒下、战死的人；“阵亡的”准确表达战场伤亡，同时保持庄重简洁。
- source_word: מִבִּנְיָמִן
  choice: 便雅悯人中
  rationale: 介词 מן 在此表示死者出自便雅悯支派；“便雅悯人中”符合现代汉语表达。
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: 二万五千名……男子
  rationale: 直接保留人数及 איש 的男性含义，不额外添加原文此处未明说的军职称谓。
- source_word: שֹׁלֵף חֶרֶב
  choice: 能拔刀作战的
  rationale: 此语是指武装战士的军事惯用语；译文保留“拔刀”的原文意象，并以“作战”明确其语境功能。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 准确保留时间指示，并置于句首，使汉语叙事自然清楚。
- source_word: אֶת כָּל אֵלֶּה
  choice: 这些人全
  rationale: 保留原文在人数之后再次概括全体的强调作用。
- source_word: אַנְשֵׁי חָיִל
  choice: 勇士
  rationale: 该短语在此战争语境中指勇武、有作战能力的人；“勇士”简洁、庄重且不加入额外身份。
