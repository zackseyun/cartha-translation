revisions:
- from: 他们就动身上伯特利[a]去，求问神。以色列人说：“我们中间谁先上去，与便雅悯人交战？”耶和华说：“犹大先。”
  to: 他们便起来，上伯特利去，求问神。以色列人说：“谁该先为我们上去，与便雅悯人交战？”耶和华说：“犹大先。”
  rationale: 修订保留原文的连续叙事动作和“上去”的方向性；将 לָנוּ 明确译为“为我们”，以反映率先代表以色列出战的意思；保留神谕答复“犹大先”的简洁省略。删除不必要且可能误导的伯特利词源性脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:45Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实呈现了连续行动、向神求问、以色列群体的发问，以及耶和华简短的答复。不过“我们中间谁先上去”将 לָנוּ（“为我们／替我们”）略微转成了候选范围；改作“谁该先为我们上去”能更准确保留其代表群体率先出战的含义。
  naturalness: “动身上伯特利去”可以理解，但“起来，上伯特利去”更贴近两个连续动词，也保持庄重而自然的叙事节奏。修订后的问句在现代标准汉语中清楚自然。
  terminology: “伯特利”“以色列人”“便雅悯人”“耶和华”“犹大”均为恰当且通行的译名。“求问神”和“与……交战”准确反映上下文。原脚注把作为专名的伯特利按普通名词“神的殿”处理，虽有词源层面的可能，却不是此处叙事句法下需要保留的实质歧义，容易给读者造成正文地名不确定的印象，故删除。
  issues:
  - severity: medium
    issue: “我们中间谁先上去”未充分表达 לָנוּ 的“为我们／替我们”意义。
    rationale: 该问句是在询问哪一支派应代表以色列率先出战，而不仅是“我们中间”的哪一个。加入“为我们”可保留原文的受益／代表性关系，不增添“带领”等原文未明说的内容。
  - severity: low
    issue: 伯特利脚注将地名读法与普通名词读法并列为此处歧义。
    rationale: 在本节叙事中，בֵּית־אֵל 最自然且传统的理解是地名“伯特利”。“神的殿”只是构词上的直译可能，并非需要以脚注平衡的同等句法读法；保留会不必要地削弱正文的明确性。
  revised_text: 他们便起来，上伯特利去，求问神。以色列人说：“谁该先为我们上去，与便雅悯人交战？”耶和华说：“犹大先。”
  revised_footnotes: []
