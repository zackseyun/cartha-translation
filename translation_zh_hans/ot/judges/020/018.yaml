base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: zh_hans
  text: 他们便起来，上伯特利去，求问神。以色列人说：“谁该先为我们上去，与便雅悯人交战？”耶和华说：“犹大先。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיַּעֲלוּ
  choice: 他们就动身上……去
  rationale: 两个连续的叙事动词分别表示“起来”和“上去”。汉语用“动身上……去”自然表达随即启程并前往较高处或圣所的动作，同时保留“上去”的方向感。
- source_word: בֵית אֵל
  choice: 伯特利
  rationale: 按马所拉文本的理解作地名“伯特利”，采用现代中文圣经中通行的译名；这一形式本身也可按普通名词组合解释为“神的殿”，故以脚注保留歧义。
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: 求问神
  rationale: שׁאל 与介词 ב 连用，在此表示寻求神的指示；“求问神”比一般的“问神”更准确，也符合庄重而自然的现代汉语。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这里是对以色列群体的惯用称呼。“以色列人”准确、自然，避免中文“以色列众子”可能造成只指亲生儿子的误解。
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: 我们中间谁先上去
  rationale: 疑问词配单数动词，是询问哪个支派应当率先出战。“我们中间谁”自然表达 לָנוּ 在群体中的关联含义；不增添原文没有明说的“带领”。
- source_word: לַמִּלְחָמָה עִם בְּנֵי בִנְיָמִן
  choice: 与便雅悯人交战
  rationale: עִם 通常意为“与”，在战争语境中指同对方交锋。“与……交战”既保留介词的基本表达，又清楚表明敌对关系。בְּנֵי בִנְיָמִן 在此自然译作“便雅悯人”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，区别于称号“主”。
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: 犹大先
  rationale: 原文回答极其简短，省略了可由上文补出的动词。中文“犹大先”同样简洁，并保留原文的省略和力度。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用以色列神的专名而非一般称号。正文采用中文读者最熟悉、可作为专名识别的“耶和华”，不把它泛化为“主”，也不借译名加入额外的神学解释。
- issue: “犹大先”是否补足动词
  choice: 保留简短的省略句“犹大先”
  alternative: 犹大要先上去
  rationale: 原文只说“犹大，首先”，答案的动作需由前文领会。保留省略可呈现神谕式回答的简洁，不把隐含内容写成更明确的命令。
- issue: בֵית אֵל 是地名还是普通名词
  choice: 正文作地名“伯特利”
  alternative: 神的殿
  rationale: 马所拉文本和叙事的通常理解支持地名，但希伯来语形式也能直译为“神的殿”。正文采用最可能的读法，并用脚注保留另一种理解。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。叙事连接用“就”体现希伯来语连续动作；军事问句用“与……交战”避免生硬直译；神的回答保持原文短促的省略结构。
