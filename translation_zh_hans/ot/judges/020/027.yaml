  text: וַ/יִּשְׁאֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּֽ/יהוָ֑ה וְ/שָׁ֗ם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים בַּ/יָּמִ֖ים הָ/הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: zh_hans
  text: 以色列人[a]求问雅威——当时，神的约柜在那里——[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的儿子们”，这里指以色列民众这一群体。
    reason: lexical_alternative
  - marker: b
    text: “当时，神的约柜在那里”补充说明他们求问雅威时的背景。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: 求问
  rationale: שׁאל 与介词 ב 及神名连用，表示向神寻求指示，不只是一般的询问；“求问”既保留宗教语境，也符合现代汉语圣经叙事用语。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的儿子们”，在这里是对以色列群体的惯用称呼；现代汉语用“以色列人”自然准确，不暗示仅有男性。
- source_word: בַּיהוָה
  choice: 求问雅威
  rationale: 介词 ב 在 שׁאל 的这一结构中标明求问的对象；汉语直接说“求问雅威”即可清楚表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名四字母 יהוה 的常见现代汉语音译，以区别于作为称号的“主”。
- source_word: וְשָׁם
  choice: ——……就在那里——
  rationale: 此处的 וְשָׁם 引入说明当时处境的插入语；破折号自然呈现其补充说明功能，同时“就”表达 שָׁם 的指示意味，而不把连接词过度解释为明确因果。
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: 神的约柜
  rationale: 希伯来语为“神之约的柜”；“神的约柜”是自然、清楚的现代汉语表达，并保留柜与神之约的关系。
- source_word: בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 贴近希伯来语惯用表达，同时在叙事中自然可懂。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列之神的专名；“雅威”较贴近学界通常重构的读音，并保留专名性质，不以“主”这一称号代替。
- issue: וְשָׁם 分句与求问行为的逻辑关系
  choice: 用破折号作为处境说明，不明说“因为”
  alternative: 译作“因为那些日子神的约柜在那里”
  rationale: 该分句确实解释求问的场景，但希伯来语连接词本身只明确表达连接，未必要求严格的因果关系；译文保留这种适度含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“求问”保留向神寻求指示的正式含义；以破折号标示原文中的插入性说明。所有脚注标记均置于正文中。
