reference: Judges 20:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: zh_hans
  text: 于是，所有以色列人[a]都出来；全会众如同一人[c]，从但到别是巴，以及从基列地[b]，聚集在米斯巴，来到雅威面前[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，这里是对以色列各支派整体的称呼，并非只强调男性个人。
    reason: lexical_alternative
  - marker: b
    text: “从但到别是巴”概括以色列地从北到南的范围；原文又另列“基列地”，把约旦河东的地区也包括在内。
    reason: geographic_clarification
  - marker: c
    text: 希伯来文直译为“像一个人”，意思是众人意志一致、行动合一。
    reason: idiom_clarification
  - marker: d
    text: 原文也可译作“在米斯巴聚集在雅威面前”。希伯来语的表达既可突出他们归向雅威，也可突出会众在米斯巴处于雅威面前。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 都出来了
  rationale: יצא可表示“出去”或“出来”；这里紧接各支派会合的场景，用“出来了”自然地呈现众人从各地出动，又不额外限定叙事视角。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: 所有以色列人
  rationale: 希伯来文按字面是“以色列的众子”，在这里是对以色列群体的统称。现代汉语用“所有以色列人”可准确传达所指范围，字面形式则在脚注说明。
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: 全会众……聚集
  rationale: קהל与עֵדָה共同描写整个共同体集合起来；“全会众……聚集”保留其群体性，也符合庄重而自然的现代汉语。
- source_word: כְּאִישׁ אֶחָד
  choice: 如同一人
  rationale: 保留希伯来语“像一个人”的形象，表达众人意志一致、行动合一。
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע וְאֶרֶץ הַגִּלְעָד
  choice: 从但直到别是巴以及基列地的人
  rationale: “从但直到别是巴”概括约旦河西以色列地域的南北范围，随后另加基列地。汉语补出“的人”，使这些地域与“全会众”的关系清楚，但不把基列并入前一组南北范围。
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: 聚集到米斯巴，朝见雅威
  rationale: 语序同时呈现聚集地点米斯巴及其朝向雅威的宗教意义；“朝见”自然表达来到神面前，但希伯来语介词结构的另一种理解保留在脚注中。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，而不是用称号替代；“雅威”直接对应通常重构的读音 Yahweh。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”旨在保留专名性质，并对应通常重构的 Yahweh 读音；不以一般称号“上主”取代。
- issue: אֶל יְהוָה与הַמִּצְפָּה的句法关系
  choice: 聚集到米斯巴，朝见雅威
  alternative: 在米斯巴聚集在雅威面前；聚集到米斯巴的雅威那里
  rationale: 原文可理解为会众到米斯巴归向雅威，也可强调他们在米斯巴聚集于雅威面前。正文采用自然汉语表达主要关系，脚注保留句法上的张力。
- issue: 群体性阳性表达בְּנֵי יִשְׂרָאֵל与כְּאִישׁ אֶחָד
  choice: 前者按群体所指译为“所有以色列人”，后者保留“如同一人”的比喻
  alternative: 以色列众子；同心一致
  rationale: בְּנֵי יִשְׂרָאֵל在此指整个民族，若直译“众子”容易在现代汉语中被误解为仅指男性；כְּאִישׁ אֶחָד则是鲜明而易懂的统一行动比喻，适合保留。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“全会众”“朝见”保留公共集会及来到神面前的正式语气；避免生硬照搬希伯来语序，同时通过脚注保存字面措辞、地理范围和句法歧义。
