revisions:
- from: 于是，所有以色列人[a]都出来了；全会众，就是从但直到别是巴以及基列地的人[b]，如同一人[c]聚集到米斯巴，朝见雅威[d]。
  to: 于是，所有以色列人[a]都出来；全会众如同一人[c]，从但到别是巴，以及从基列地[b]，聚集在米斯巴，来到雅威面前[d]。
  rationale: 修订避免以“朝见”强化原文未明说的觐见行为，并重组地域短语，使其清楚地说明全会众的来源范围。保留雅威的专名译法、合一的习语形象，以及有关“在雅威面前／归向雅威”的可争论句法的脚注。
