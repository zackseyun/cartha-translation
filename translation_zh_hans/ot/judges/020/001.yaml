  naturalness: “全会众，就是从但直到别是巴以及基列地的人……”作为同位语略显拖沓，也容易使地域短语只修饰“会众”中的一部分人。改为直接陈述会众从这些地区聚集，句法更清楚自然。
  terminology: “雅威”“会众”“如同一人”均合宜。“以色列人”在现代汉语中自然，脚注保留“以色列的众子”的字面措辞，足以反映原文的群体性阳性表达。
