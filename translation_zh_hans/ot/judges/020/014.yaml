  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: zh_hans
  text: 便雅悯人从各城聚集到基比亚，要出去与以色列人交战[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与以色列人”原文直译为“与以色列的众子”；在交战语境中，“与”指交战的对方，也可译作“攻打以色列人”。
    reason: lexical_alternative
  - marker: b
    text: “便雅悯人”和“以色列人”原文分别为“便雅悯的众子”和“以色列的众子”，是希伯来语的支派、民族称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: 聚集
  rationale: 该词为אסף的尼法勒式，表示众人聚到一起；“聚集”自然、准确，也保留了原文集合起来的语气。
- source_word: בְנֵי בִנְיָמִן
  choice: 便雅悯人
  rationale: 希伯来文直译为“便雅悯的众子”，这里是常见的支派称谓；现代汉语用“便雅悯人”更自然清楚，避免误解为便雅悯本人的直系儿子。
- source_word: מִן הֶעָרִים
  choice: 从各城
  rationale: 介词表示来源；定冠词修饰复数“城”，在上下文中指便雅悯境内相关的各城，因此译作“从各城”。
- source_word: הַגִּבְעָתָה
  choice: 到基比亚
  rationale: 地名后的方向词尾表示朝向该地，汉语自然表达为“到基比亚”。
- source_word: לָצֵאת לַמִּלְחָמָה
  choice: 要出战
  rationale: 该短语直义为“出去作战”；“出战”简洁地传达军事语境，也保留“出去”的核心意象。
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: 与以色列人交战
  rationale: עִם通常意为“与、同”，在交战语境中指交战的对方；译作“与……交战”既保留介词形式，也清楚表达敌对关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“便雅悯人”“以色列人”符合现代汉语群体称谓；“出战”准确体现军事场景。正文用“与……交战”保存原文介词的形式和敌对语境，不把“与”误读为并肩作战。
