id: JDG.20.13
reference: Judges 20:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: zh_hans
  text: 把基比亚的那些人，就是那些无赖之徒[a]，交出来，我们好处死他们，从以色列中除掉邪恶。但便雅悯人不肯听从他们的弟兄——以色列人的话[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“无用之子”；传统译作“彼列之子”。这里指卑劣、邪恶的人。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“听他们弟兄的声音”，也可译作“听从”或“理会”。
    reason: lexical_alternative
  - marker: c
    text: “以色列人”直译“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: 交出来
  rationale: 在司法追责的语境中，此命令要求便雅悯把犯事者交给会众处置；“交出来”自然传达移交之意。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 所指为基比亚的男性犯事者；现代汉语以“那些人”表达自然，具体性别可由上下文明确。
- source_word: בְּנֵי בְלִיַּעַל
  choice: 无赖之徒
  rationale: 这是希伯来语表示卑劣、邪恶之人的惯用语；译作“无赖之徒”保留道德贬义，又避免把“彼列”误解为此处的专名。
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: 基比亚的
  rationale: 简洁自然地表达这些人在基比亚，并以地点限定其身份。
- source_word: וּנְמִיתֵם
  choice: 我们好处死他们
  rationale: 愿望式在这里表示交人之后所要实行的司法处决；“好”清楚连接目的。
- source_word: וּנְבַעֲרָה רָעָה
  choice: 从以色列中除掉邪恶
  rationale: בער在申命记式司法措辞中表示清除；“除掉邪恶”既自然，也保留群体洁净的法律—道德力度。
- source_word: וְלֹא אָבוּ
  choice: 不肯
  rationale: 准确表达主语在意愿上的拒绝。
- source_word: בִּנְיָמִן
  choice: 便雅悯人
  rationale: 原文以支派名作集合主语；汉语加“人”可自然指整个便雅悯支派。
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: 听从……的话
  rationale: 兼顾原文“听……声音”的具体表达及其“听从、遵从”的惯用含义。
- source_word: אֲחֵיהֶם
  choice: 他们的弟兄
  rationale: 保留以色列各支派之间的亲族语言。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 作为同位说明，现代汉语译为“以色列人”清楚自然；脚注注明较直译形式。
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל 的理解
  choice: 无赖之徒
  alternative: 彼列之子；毫无价值的人
  rationale: 此处是对作恶者品格的贬称，不必理解为与某个名叫“彼列”的灵界存在有关；译文避免引入后期神学联想。
- issue: 两个愿望式动词的司法含义
  choice: 我们好处死他们，从以色列中除掉邪恶
  alternative: 我们就杀死他们，把恶从以色列中清除
  rationale: 译文保留交出犯事者、执行死刑并清除群体中邪恶的目的关系，同时不额外解释其神学意义。
- issue: 便雅悯与其他支派的亲族关系
  choice: 他们的弟兄——以色列人
  alternative: 以色列同胞
  rationale: 保留“弟兄”的亲属意象及“以色列人”的同位说明，使内战叙事中的亲族张力不被抹平。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“交出来”“处死”“除掉邪恶”保留司法语气；破折号标明“以色列人”是对“他们的弟兄”的同位说明。所有脚注标记均置于对应正文处。
