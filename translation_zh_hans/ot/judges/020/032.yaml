  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: zh_hans
  text: 便雅悯人说：“他们像先前一样[a]，正在我们面前败下阵来。”以色列人却说：“我们逃跑吧，把他们[b]从城里引到大路上[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像先前一样”指本章前面几次交战的情形，也可译作“像以前一样”或“像第一次交战时一样”。
    reason: cross_reference
  - marker: b
    text: 原文这里作单数“他”，可能以集合单数指便雅悯或便雅悯的军队；正文按上下文译作“他们”。
    reason: lexical_alternative
  - marker: c
    text: “大路”也可译作“道路”或“主要道路”；原文所用词可指修筑起来的道路或大道。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: 正在……败下阵来
  rationale: 这是军事语境中的被动分词，表示在交战中遭到击败；此译法既保留正在发生的意味，也符合现代汉语战事叙述。
- source_word: לְפָנֵינוּ
  choice: 在我们面前
  rationale: 保留希伯来语的常用表达，语境中指敌军在便雅悯人面前、被他们击败。
- source_word: כְּבָרִאשֹׁנָה
  choice: 像先前一样
  rationale: 该短语回指本章此前的交战；不在正文中增添“战役”，以免过度明说。
- source_word: נָנוּסָה
  choice: 我们逃跑吧
  rationale: 以第一人称复数意愿式表达共同提议；“……吧”自然传达其劝议语气。
- source_word: וּנְתַקְּנֻהוּ
  choice: 把他们……引到
  rationale: 动词表示拉开、引离；结合以色列人的诱敌战术，汉语“引到”自然表达使对方离开城的动作，但不额外强化欺骗意味。
- source_word: הוּא suffix in וּנְתַקְּנֻהוּ
  choice: 他们
  rationale: 原文宾语后缀为阳性单数，但语境中集体指便雅悯人或其军队；汉语用复数指人更自然，并以脚注保存原文形式。
- source_word: הָעִיר
  choice: 城
  rationale: עִיר在此指基比亚这座城；“城”简洁且符合上下文。
- source_word: הַמְסִלּוֹת
  choice: 大路
  rationale: 该复数名词可指修筑的道路或主要道路；汉语“大路”既保留其较宽阔、主要道路的含义，也避免现代“高速公路”的误解。
