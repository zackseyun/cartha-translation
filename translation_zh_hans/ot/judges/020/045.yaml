translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。首句不补出主语身份；后半句为避免汉语误读，依上下文明确补出追击者“以色列人”。保留地名“临门”和“基顿”，并用脚注说明正文无法自然保留的“拾取遗穗”比喻及集合单数现象。
