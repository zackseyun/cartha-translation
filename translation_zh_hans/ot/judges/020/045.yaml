base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: zh_hans
  text: 他们转身逃往旷野，去临门磐石。以色列人在大路上击杀了他们五千人[a]，又追赶他们，直到基顿，击杀了其中二千人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击杀”所译的希伯来文直译为“拾取他（如拾取遗穗）”，在这里形容将逃亡者逐一击杀。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在“追赶他”和“从他中间”使用单数代词，把逃亡的便雅悯人作为一个整体来指称。
    reason: collective_singular
lexical_decisions:
- source_word: וַיִּפְנוּ וַיָּנֻסוּ
  choice: 他们转身……逃去
  rationale: 分别保留“转向”和“逃跑”两个连续动作；“转身”不额外断定他们是返回原路。
- source_word: הַמִּדְבָּרָה אֶל סֶלַע הָרִמּוֹן
  choice: 朝旷野的临门磐石
  rationale: 方向词尾表达朝向旷野；סֶלַע译作“磐石”，临门按通行圣经地名音译处理。
- source_word: וַיְעֹלְלֻהוּ
  choice: 追杀
  rationale: 该词本义带有“拾取遗穗”的意象，此处用于战场上逐一杀戮逃散者。“追杀”在正文中自然传达语境含义，原有意象则收入脚注。
- source_word: בַּמְסִלּוֹת
  choice: 在各条大路上
  rationale: מְסִלּוֹת为复数，指修筑或通行的大路；“各条大路”兼顾复数形式与追击场景。
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: 五千人
  rationale: 忠实保留人数，不把“人”进一步解释成“士兵”。
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: 又追赶他们
  rationale: דבק的使役式在此表示紧随追击；不加入原文没有明说的“猛烈地”等程度修饰。
- source_word: עַד גִּדְעֹם
  choice: 直到基顿
  rationale: עַד标明追赶所到的地点；גִּדְעֹם按传统汉语地名译作“基顿”。
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: 击杀了其中二千人
  rationale: “其中”传达מִמֶּנּוּ的部分关系；不增添原文未明说的“又有”或“另外”。
