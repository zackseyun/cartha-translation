revisions:
- from: 他们转身，朝旷野的临门磐石逃去。以色列人在各条大路上追杀了他们五千人[a]，又追赶他们直到基顿，击杀了其中二千人[b]。
  to: 他们转身逃往旷野，去临门磐石。以色列人在大路上击杀了他们五千人[a]，又追赶他们，直到基顿，击杀了其中二千人[b]。
  rationale: 修改仅澄清句法并校正脚注与正文用词的对应关系。“击杀”避免把“拾取遗穗”的战场意象预先解释为“追杀”，而下一分句仍明确译出实际追赶。补出的“以色列人”依赖紧邻上下文所指的追击方，帮助汉语读者避免主语转换造成的误解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:48Z'
