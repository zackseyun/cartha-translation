base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: zh_hans
  text: 以色列人在战斗中转身，本雅悯人便开始击杀以色列人，约有三十人被杀[a]。因为他们说：“以色列果真在我们面前彻底败了[b]，就像第一次交战时一样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“开始在以色列人中击杀被杀者，约三十人。”其中“被杀者”一语十分简略，带有战场惯用语色彩。
    reason: lexical_alternative
  - marker: b
    text: 原文用单数形式，可能把以色列视为一个整体；也可理解为：“他们果真在我们面前彻底败了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: 转身
  rationale: 在战事语境中表示转身或转向行动；“转身”简洁自然，也保留了叙事中的战术动作。
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: 单数形式在此具有集合意义，指以色列的参战者；现代汉语用“以色列人”自然表达这一群体。
- source_word: בַּמִּלְחָמָה
  choice: 在战斗中
  rationale: 表明转身发生在正在进行的战斗之中，并保留定指战事的语感。
- source_word: וּבִנְיָמִן
  choice: 本雅悯人
  rationale: 支派名在原文中借指该支派的战士；汉语补出“人”，可清楚表达行动主体。
- source_word: הֵחֵל לְהַכּוֹת
  choice: 便开始击杀
  rationale: “开始”保留动作起始义；战争语境中的 נכה 与死伤相连，译为“击杀”准确而自然。“便”承接前一动作，不增添因果判断。
- source_word: חֲלָלִים בְּאִישׁ יִשְׂרָאֵל כִּשְׁלֹשִׁים אִישׁ
  choice: 击杀以色列人，约有三十人被杀
  rationale: 原文表达简短且带有战场惯用语色彩。此译法保留“被杀者”的明确含义，也自然表达约三十人的伤亡数目。
- source_word: אַךְ
  choice: 果真
  rationale: 表达本雅悯人确信眼前情势印证先前战况的强调语气。
- source_word: נִגּוֹף נִגָּף הוּא
  choice: 以色列……彻底败了
  rationale: 不定式绝对形与限定动词连用具有加强作用，故译“彻底败了”；以“以色列”承接原文单数代词所指的集合整体。
- source_word: כַּמִּלְחָמָה הָרִאשֹׁנָה
  choice: 就像上一次交战时一样
  rationale: 自然表达与先前战役的比较；本章语境中“第一次”实际指此前的交战，译为“上一次”更符合现代汉语叙事。
