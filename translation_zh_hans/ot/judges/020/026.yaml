source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: zh_hans
  text: 于是，以色列众人——全体百姓——都上去，来到伯特利。他们哭泣，坐在那里，在雅威面前，并在那一天禁食到晚上。随后，他们在雅威面前献上燔祭和平安祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“相交祭”。
    reason: שלמים所指的祭兼有和好、福祉及共同分享祭物的内涵；不同译名分别突出其中不同层面。
lexical_decisions:
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ
  choice: 都上去，来到
  rationale: 保留两个连续动词所表达的上行与抵达；“上去”反映עלה的方向意味，“来到”自然表达בוא。
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: 以色列众人——全体百姓——
  rationale: בני ישראל在民族称谓中自然译为“以色列众人”，既涵盖全体以色列民，又避免现代汉语中“以色列众子”的生硬感；破折号保留“全体百姓”的重复强调，而不把它误读为另一群人。
- source_word: בֵית אֵל
  choice: 伯特利
  rationale: 按马所拉文本的地名理解，采用现代中文圣经中通行的音译；字面含义及可能的普通名词理解收入脚注。
- source_word: וַיִּבְכּוּ
  choice: 他们哭泣
  rationale: 准确传达战败后的哀恸，语体庄重而自然。
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: 坐在那里，在雅威面前
  rationale: 保留ישב的具体姿态“坐”，不将其仅抽象化为“停留”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，而不是以“主”这一称号替代；“雅威”较接近学界通常重构的读音。
- source_word: וַיָּצוּמוּ בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: 那一天，他们一直禁食到晚上
  rationale: 明确保留禁食的时间界限，符合现代汉语叙述习惯。
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: 献上燔祭
  rationale: עלה在献祭语境中表示把祭物献上；“燔祭”是准确且通行的祭祀术语。
- source_word: שְׁלָמִים
  choice: 平安祭
  rationale: 采用中文中通行的祭名，同时在脚注保留强调共享与相交层面的另一译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而非“主”这一称号；正文以音译保存专名性质，不用称号取代。
- issue: בני ישראל所指群体的性别与民族表达
  choice: 以色列众人
  alternative: 以色列众子；全体以色列人
  rationale: 此处指参与行动的整个民族共同体；“众人”在现代汉语中自然涵盖全体百姓，同时不额外限定只有成年男性。
- issue: שלמים的祭祀含义
  choice: 平安祭
  alternative: 团契祭；相交祭
  rationale: “平安祭”保留该祭名与שׁלם词族的联系；脚注列出强调共同分享祭物之功能的译法，避免把词义限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以破折号呈现“以色列众人／全体百姓”的同位强调；保留“坐在……面前”、禁食至晚及两类祭物等具体细节。
