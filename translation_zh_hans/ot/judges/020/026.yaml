revisions:
- from: 于是，以色列众人——全体百姓——都上去，来到伯特利[a]。他们哭泣，坐在那里，在雅威面前禁食；那一天，他们一直禁食到晚上。随后，他们在雅威面前献上燔祭和平安祭[b]。
  to: 于是，以色列众人——全体百姓——都上去，来到伯特利。他们哭泣，坐在那里，在雅威面前，并在那一天禁食到晚上。随后，他们在雅威面前献上燔祭和平安祭[a]。
  rationale: 删去不具文本必要性的伯特利脚注，并重组中段句法，使“禁食”只出现一次而完整带出“那一天直到晚上”的时间限制；其余译文及术语保持不变。
