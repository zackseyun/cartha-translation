base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: zh_hans
  text: 第二天，便雅悯人从基比亚出来迎战他们[a]，又杀倒以色列人一万八千人；这些人全都是拔剑的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迎战他们”也可译作“迎向他们”或“与他们相遇”；希伯来语这一表达可指迎面相遇，在这里的军事语境中指敌对交锋。
    reason: lexical_alternative
  - marker: b
    text: 直译为“拔剑的”或“拔剑者”。
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיֵּצֵא בִנְיָמִן
  choice: 便雅悯人出来
  rationale: 单数族名“便雅悯”在此作集体主语；现代汉语用“便雅悯人”自然明确。יצא按叙事语境译为“出来”。
- source_word: לִקְרָאתָם
  choice: 迎战他们
  rationale: 该表达本可泛指“迎接、相遇”，但军事语境及随后杀敌的叙述明确表明这是敌对遭遇；“迎战”在汉语中自然，同时以脚注保留较字面的可能译法。
- source_word: מִן הַגִּבְעָה
  choice: 从基比亚
  rationale: 直接表达出发地点；地名按通行圣经译名音译。
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: 第二天
  rationale: 贴合希伯来文序数表达，也符合现代汉语叙事习惯。
- source_word: וַיַּשְׁחִיתוּ
  choice: 杀倒
  rationale: שׁחת的使役形在战斗和伤亡数字语境中表示毁灭、杀死；“杀倒在地”既传达致命结果，又与后面的方向词“在地”自然衔接。
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: ב在此标示受害对象；בני ישראל字面为“以色列之子”，但现代汉语“以色列人”准确、自然，且不造成仅指家族直系儿子的误解。
- source_word: עוֹד
  choice: 又
  rationale: 承接前一天的损失，表示再次或追加发生；“又”简洁保留其累加意味。
- source_word: שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: 一万八千名战士
  rationale: 数词为一万八千；איש本义是“人、男子”，但后文明确说这些人全是拔刀者，因此在本句用“战士”可自然呈现所指而不增加范围。
- source_word: אָרְצָה
  choice: 倒在地
  rationale: 方向形式表示“向地、到地上”；与杀戮动词结合，汉语自然表达为“杀倒在地”。
- source_word: כָּל אֵלֶּה שֹׁלְפֵי חָרֶב
  choice: 这些人全都是拔刀作战的
  rationale: 保留“这些人全都”的总括结构；“拔刀”反映字面的拔剑动作，“作战的”说明该分词在此描述具备战斗能力并参战的人。
