  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: zh_hans
  text: 便雅悯人从基比亚出来，当日击杀了二万二千名以色列人，使他们倒在地上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 出来
  rationale: 该动词叙述便雅悯人从城中出战；“出来”在现代汉语中自然，也不必强行加入“来到”或“前往”的视角。
- source_word: בְנֵי בִנְיָמִן
  choice: 便雅悯人
  rationale: 希伯来语直译为“便雅悯的众子”，此处指便雅悯支派的人；译为“便雅悯人”清楚自然，同时保留支派身份。
- source_word: מִן הַגִּבְעָה
  choice: 从基比亚
  rationale: 介词表示出发地点；“从基比亚”准确、简洁。
- source_word: וַיַּשְׁחִיתוּ
  choice: 杀倒
  rationale: שׁחת 的使役形可表示毁灭、杀害；在战斗伤亡语境中，“杀倒”既表达致死结果，也与句末“倒向地面”的意象相呼应。
- source_word: בְיִשְׂרָאֵל
  choice: 以色列人
  rationale: 介词在此引出受攻击并伤亡的一方；结合后面的计数单位 אִישׁ，汉语自然表达为“以色列人”。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 准确传达“那一天”，并符合现代汉语叙事习惯。
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף אִישׁ
  choice: 二万二千名
  rationale: 按现代汉语数字和人数计量习惯表达；“名”承接后置的 אִישׁ（人）。
- source_word: אָרְצָה
  choice: 杀倒
  rationale: 该方向形式意为“向地面、倒在地上”；不另加生硬的“倒地”，而将其意象融入“杀倒”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“便雅悯人”避免直译“便雅悯的众子”在现代汉语中的生硬感；“杀倒”保留战场语境和原文的倒地意象。
