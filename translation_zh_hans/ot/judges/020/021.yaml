  naturalness: “杀倒了二万二千名以色列人”在现代标准汉语的庄重叙事中略显口语和搭配生硬。将死亡结果与倒地意象分开表达，较自然清楚。
  terminology: “便雅悯人”“基比亚”“以色列人”均合适且前后一致。“击杀”适合此处战事语境，并不额外指定受害者为士兵。
