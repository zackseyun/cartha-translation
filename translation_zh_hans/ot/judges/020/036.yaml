base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: zh_hans
  text: 便雅悯人看出自己败了。原来以色列人给便雅悯人让出阵地[a]，是因为他们信赖自己为对付基比亚而部署的伏兵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “让出阵地”也可译作“给便雅悯人让出地方”。这里的希伯来语惯用语是指以色列人故意让出空间或后退，以便诱敌。
    reason: lexical_alternative
  - marker: b
    text: “伏兵”也可译作“埋伏”。希伯来语 אֹרֵב 既可指埋伏本身，也可指埋伏等候的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 看出
  rationale: ראה的基本义是“看见”；此处结合战局，指便雅悯人从眼前形势看出、意识到自己已经败了。“看出”兼顾视觉叙事和认知含义。
- source_word: בְנֵי בִנְיָמִן
  choice: 便雅悯人
  rationale: 希伯来语直译为“便雅悯的众子”，在现代汉语战事叙述中，“便雅悯人”自然清楚，也保留其族群含义。
- source_word: כִּי נִגָּפוּ
  choice: 自己败了
  rationale: נגף的Niphal形态在战争语境中表示被击败。“败了”简洁自然；补出“自己”明确原文复数代词所指的是便雅悯人。
- source_word: וַיִּתְּנוּ ... מָקוֹם
  choice: 让出阵地
  rationale: 字面是“给出地方”，这里指以色列人在战术上主动让出空间、佯退诱敌。“让出阵地”既保留空间意象，也符合汉语军事表达。
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: אִישׁ虽为单数形式，此处具有集合意义，指参战的以色列人。汉语无需机械译作“以色列的男人们”。
- source_word: כִּי בָטְחוּ
  choice: 是因为他们信赖
  rationale: בטח表示信靠、倚赖；这里的对象是预先部署的伏兵。“信赖”直接表达他们有把握地依靠这一战术安排。
- source_word: אֶל הָאֹרֵב
  choice: 那支……伏兵
  rationale: אֹרֵב既可指埋伏行动，也可指埋伏的人。鉴于后面的שׂמוּ可表示部署人员，正文采用“伏兵”，同时以脚注保留“埋伏”这一可能。
- source_word: אֲשֶׁר שָׂמוּ
  choice: 埋伏
  rationale: שׂים基本义为“放置、部署”。与“伏兵”搭配时，现代汉语用“埋伏在”自然地表达已将伏兵部署在当地。
- source_word: אֶל הַגִּבְעָה
  choice: 在基比亚附近
  rationale: 介词אֶל在此可表达朝向、临近或针对。译作“在基比亚附近”自然呈现伏兵的位置，同时不把含义过度限定为城内或纯粹敌对方向。
theological_decisions: []
