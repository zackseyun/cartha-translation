revisions:
- from: 便雅悯人看出自己败了。原来以色列人向便雅悯人让出阵地[a]，是因为他们信赖那支埋伏在基比亚附近的伏兵[b]。
  to: 便雅悯人看出自己败了。原来以色列人给便雅悯人让出阵地[a]，是因为他们信赖自己为对付基比亚而部署的伏兵[b]。
  rationale: 修订仅纠正原文中对 אֶל הַגִּבְעָה 的“附近”处理，将其恢复为与军事上下文及英文审校轨迹相符的针对性表达；同时以“部署”对应 שָׂמוּ，并消除“埋伏……伏兵”的重复。脚注锚点和词汇歧义说明均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:37Z'
