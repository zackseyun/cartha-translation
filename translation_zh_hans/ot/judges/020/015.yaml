base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: zh_hans
  text: 那一天，便雅悯人从各城点出二万六千名拔刀的男子[a]；此外，基比亚的居民中又点出七百名精兵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “点出”也可译作“数点”或“编入军队”；原文动词在这里指为服兵役而清点人员。
    reason: lexical_alternative
  - marker: b
    text: “精兵”也可译作“精选的人”或“年轻人”；原文词语可指年轻男子，但在这里可能着重表示经过挑选的战士。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: 被点兵
  rationale: 此处 hitpael 形式的 פקד 指为军事行动而清点、编入兵员。“被点兵”兼顾清点人数和征集军兵的语境，并在两处重复使用，以保留原文呼应。
- source_word: בְנֵי בִנְיָמִן
  choice: 便雅悯人
  rationale: 希伯来语直译为“便雅悯的众子”，在此指便雅悯支派成员；现代汉语以“便雅悯人”表达更自然，同时保留支派身份。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 直接保留原文的时间指示和强调。
- source_word: מֵהֶעָרִים
  choice: 从各城
  rationale: 介词表示这些兵员来自诸城；汉语“各城”自然体现复数，但不擅自补入“他们的”。
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: 二万六千名
  rationale: 准确表达数目；后接“拔刀作战的人”，避免重复使用量词结构。
- source_word: שֹׁלֵף חָרֶב
  choice: 拔刀作战的人
  rationale: 保留“拔刀”的具体意象，同时以“作战”清楚传达这是对武装战士的惯用描述，而非仅指一个拔刀动作。
- source_word: לְבַד
  choice: 此外
  rationale: 表明基比亚的七百人是在前述二万六千人之外另行计算。
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: 基比亚的居民
  rationale: 自然表达居住在基比亚的人，并保留原文的地域性称谓。
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: 七百名精兵
  rationale: בָּחוּר 可指年轻男子，也可在军事语境中指经挑选的优秀战士；结合下一节对其战技的描述，“精兵”简洁传达后者，但以脚注保留词义可能性。
