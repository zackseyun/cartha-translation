base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: zh_hans
  text: 以色列所有的男子都从原处起来，在巴力·他玛摆开阵势；以色列的伏兵则从原处冲出——从玛阿雷·迦巴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“玛阿雷·迦巴”可理解为地名，正文据此音译；也可按描述性词语理解为“迦巴的空旷地”或“迦巴的草地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: 以色列众人
  rationale: אִישׁ虽为单数形式，与כֹל连用时具有逐一而又集合的意义；这里指参战的以色列男子。“以色列众人”在现代汉语叙事中自然，也保留了整体军队的含义。
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: 都从原处起来
  rationale: 复数动词与集合主语呼应，单数所属后缀在此具有分配性。“从原处起来”既贴近原文，也符合军队开始行动的语境。
- source_word: וַיַּעַרְכוּ
  choice: 摆开阵势
  rationale: ערך在军事语境中表示列阵备战；“摆开阵势”清楚传达这一含义，同时保持叙事简练。
- source_word: בְּבַעַל תָּמָר
  choice: 在巴力·他玛
  rationale: 该词组是地名，采用音译而不按“棕树之主”等字面意义翻译；介词בְּ在此作地点用法。
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: 以色列的伏兵
  rationale: אֹרֵב在这里指埋伏等候的人；属格结构表明这是以色列一方的伏兵，而不是针对以色列设下的埋伏。
- source_word: מֵגִיחַ
  choice: 冲出
  rationale: 该分词表达从隐蔽处突然出来或出击；“冲出”符合伏兵行动的速度感和军事语境。
- source_word: מִמְּקוֹמוֹ
  choice: 从原处
  rationale: 单数后缀与集合性的伏兵相配，具有分配或整体指称作用；汉语用“原处”简洁自然。
- source_word: מִמַּעֲרֵה גָבַע
  choice: 从玛阿雷·迦巴
  rationale: 该表达含义不确定，可能保存了一个地名。正文采用音译以免武断消除歧义，其他描述性理解列入脚注。
