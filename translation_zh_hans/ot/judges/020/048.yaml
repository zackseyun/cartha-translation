revisions:
- from: 以色列人转身攻击便雅悯人，用刀击杀他们，把各城的人、牲畜，以及所遇见的一切，全都杀尽。[a]他们又放火烧了所遇见的所有城邑。
  to: 以色列人转回去攻打便雅悯人，用刀击杀他们；城中所有的人，直到牲畜，以及一切所遇见的，都尽行毁灭。[a]凡所遇见的城邑，他们也都放火焚烧。
  rationale: 修订恢复“转回去”的叙事方向，以“尽行毁灭”覆盖原文由人、牲畜至一切所遇见之物的全面毁灭范围，并避免把可能包含非生命物的对象译成“杀尽”。对 מֵעִיר מְתֹם 采用较包容的正文措辞，并以脚注清楚保留其文本疑难。第二句删去重复表达，仍忠实保留“凡所遇见的城邑”均被焚烧的意思。
  reviewer_model: gpt-5.6-terra
