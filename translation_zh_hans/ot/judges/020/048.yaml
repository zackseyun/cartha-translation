  register: 采用现代、庄重而易懂的叙事语言。“城邑”略具经文语体色彩，但现代读者仍能自然理解。避免使用过度古雅的“刀刃杀戮”“付之一炬”等措辞；同时不弱化原文所述的全面暴力。
