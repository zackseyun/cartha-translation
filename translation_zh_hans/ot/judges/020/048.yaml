base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: zh_hans
  text: 以色列人转回去攻打便雅悯人，用刀击杀他们；城中所有的人，直到牲畜，以及一切所遇见的，都尽行毁灭。[a]凡所遇见的城邑，他们也都放火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城中所有的人”：原文此处直译近于“从城，完整／全部”，句法和确切含义难以确定。它可能是指全城的居民，或指城中所有事物；下文接着提到牲畜和一切所遇见的。
    reason: 原文 מֵעִיר מְתֹם 为疑难短语；脚注说明主要可能性，避免将一种具体句法分析当作确定含义。
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: 单数形式 אִישׁ 在复数动词前具有集合意义；上下文指参战的以色列人。中文“以色列人”自然涵盖这一集体军事主体。
- source_word: שָׁבוּ אֶל בְּנֵי בִנְיָמִן
  choice: 转身攻击便雅悯人
  rationale: שׁוב 表示行动方向的逆转；因下文是敌对行动，אֶל 在中文中宜按语境译为“攻击”。“便雅悯人”自然表达“便雅悯的子孙”。
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: 用刀击杀他们
  rationale: נכה 可指击打、击败或杀死；“刀口”这一希伯来惯用语在本段灭杀语境中表示用刀杀戮。译作“用刀击杀”既保留动作，也明确其致命结果。
- source_word: מֵעִיר מְתֹם עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: 把各城的人、牲畜，以及所遇见的一切，全都杀尽
  rationale: מֵעִיר מְתֹם 语义和句法困难，但语境大概是逐城彻底杀灭居民，并延及牲畜及一切所见之物。正文采用清楚自然的整体表达，疑难处以脚注说明。
- source_word: גַּם כָּל הֶעָרִים הַנִּמְצָאוֹת
  choice: 他们又……所遇见的所有城邑
  rationale: מצא 的分词在此较可能指以色列人找到、遇到的城邑；“所遇见”比被动的“被找到”更符合现代汉语。
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: 放火烧了
  rationale: 该短语字面为“送入火中”，是纵火焚烧的惯用表达；“放火烧了”简明、自然并保持动作性。
