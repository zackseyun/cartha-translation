base_translation:
  language: en
  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: zh_hans
  text: 这众人中有七百名被选出的男子，都是惯用左手的人[a]；他们个个都能用投石索投石，瞄准一根头发也不会失准。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“右手受限制”。希伯来文直译为“右手受限制”，在这里可能指作战时惯用左手。
    reason: 保留希伯来语习语的字面含义，并说明正文采用的语境性理解。
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: 这众人中
  rationale: 保留介词所表达的部分关系，即从前述全体人中选出这些人；“众人”不额外把 עָם 限定为“军队”。
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: 七百名精选的男子
  rationale: אִישׁ 是成年男子的计数用语，בָּחוּר 在此指经过挑选、精良的人；译文不额外加入“勇士”等解释。
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: 惯用左手的
  rationale: 希伯来语字面描述右手受到限制；在军事语境中通常表示以左手作战。“惯用左手”自然传达其语境含义，同时用脚注保留字面措辞及其可能性。
- source_word: כָּל זֶה
  choice: 他们个个都
  rationale: 体现该短语的逐一、分配性含义，强调七百人中每一个都有这项本领。
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: 能用投石索甩石
  rationale: 分词在此描述一贯具备的技能；“投石索”明确古代武器，“能……甩石”符合现代汉语表达。
- source_word: אֶל הַשַּׂעֲרָה
  choice: 瞄准一根头发
  rationale: 保留“一根头发”这一极小目标的具体意象，不扩写为“毫厘”等抽象说法。
- source_word: וְלֹא יַחֲטִא
  choice: 也不会失手
  rationale: חטא 在此是未击中目标，而非道德意义上的犯罪；“不会失手”自然表达投射不中的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“投石索”比传统但较含混的“机弦”更便于普通读者理解；分号保留原句中人物特征与射击本领之间的结构关系。
