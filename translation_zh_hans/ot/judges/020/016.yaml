  to: 这众人中有七百名被选出的男子，都是惯用左手的人[a]；他们个个都能用投石索投石，瞄准一根头发也不会失准。
  rationale: 修订仅调整两处现代汉语措辞：“投石索投石”较“投石索甩石”中性清楚；“不会失准”明确对应“不会错失目标”。同时将“精选的男子”改为“被选出的男子”，使“chosen”侧重选出而非品质优越。其余结构、人数、分配性强调和脚注锚点均予保留。
