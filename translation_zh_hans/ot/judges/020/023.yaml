  text: וַ/יַּעֲל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יִּבְכּ֣וּ לִ/פְנֵֽי יְהוָה֮ עַד הָ/עֶרֶב֒ וַ/יִּשְׁאֲל֤וּ בַֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אוֹסִ֗יף לָ/גֶ֨שֶׁת֙ לַ/מִּלְחָמָ֔ה עִם בְּנֵ֥י בִנְיָמִ֖ן אָחִ֑/י וַ/יֹּ֥אמֶר יְהוָ֖ה עֲל֥וּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: zh_hans
  text: 以色列人就上去，在雅威面前哭到晚上；他们求问雅威，说：“我还要上前与便雅悯人——我的弟兄——交战吗？”[a]雅威说：“上去攻打他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “还要”也可译为“再一次”。这里的希伯来语可指继续进攻，也可指再次进攻；在战争语境中，“与”指与便雅悯人交战。
    reason: 保留הַאוֹסִיף可表达“继续”或“再次”的歧义，并说明עִם在此处的交战用法。
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上去
  rationale: 保留עלה表示向上而行的方向感；上下文可能涉及前往圣所，但原文没有明说目的地。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语表达该群体称谓的自然方式，也保留其整体身份；直译“以色列的儿子们”在此不自然。
- source_word: וַיִּבְכּוּ לִפְנֵי יְהוָה
  choice: 在雅威面前哭
  rationale: “哭”准确传达בכה的哀恸含义，“在……面前”保留לִפְנֵי所表达的临在关系。
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: 求问雅威
  rationale: “求问”适合向神寻求指示或神谕的宗教语境，比一般的“询问”更准确。
- source_word: הַאוֹסִיף
  choice: 可以再
  rationale: Hiphil形式在这里可指继续或再次采取行动；结合前一日已经交战的叙事，“再”自然，同时不排除继续进攻的含义。
- source_word: לָגֶשֶׁת לַמִּלְחָמָה עִם
  choice: 去迎战
  rationale: נגשׁ表示接近，לַמִּלְחָמָה说明为作战而接近，עִם在战斗语境中指交战对象；“迎战”以自然汉语合并表达这些关系。
- source_word: אָחִי
  choice: 我的弟兄
  rationale: 保留第一人称单数和亲族称谓所带出的张力：以色列承认便雅悯与自己同属弟兄。
- source_word: עֲלוּ אֵלָיו
  choice: 上去攻打他
  rationale: 保留עלה的“上去”，并按军事语境明确אֵלָיו所指的敌对趋向；“他”对应原文阳性单数，集体指便雅悯。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现该专名，不以称号代替，也不引入特定宗派解释。
- issue: 群体发问中单数“我”的保留
  choice: 我可以再去
  alternative: 我们可以再去
  rationale: 尽管叙事主语“他们”是复数，希伯来引语使用第一人称单数，可能由以色列作为一个集体发言。保留“我”可保存原文数的不协调及其集体人格色彩。
- issue: 以色列与便雅悯的亲属关系
  choice: 我的弟兄便雅悯人
  alternative: 我的同族便雅悯人
  rationale: “弟兄”保留אָחִי直接而富情感的亲属语言，使内战中的神学和伦理张力不被弱化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。句法适度贴近希伯来文，但用“求问”“迎战”等自然汉语避免生硬直译；保留引语中的单数“我”和答语中的单数“他”，以呈现以色列与便雅悯作为集体人格的原文表达。
