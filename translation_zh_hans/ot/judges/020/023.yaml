revisions:
- from: 以色列人就上去，在雅威面前哭到晚上；他们求问雅威说：“我可以再去迎战我的弟兄便雅悯人吗？”雅威说：“上去攻打他。”
  to: 以色列人就上去，在雅威面前哭到晚上；他们求问雅威，说：“我还要上前与便雅悯人——我的弟兄——交战吗？”[a]雅威说：“上去攻打他。”
  rationale: 以“还要上前与……交战”替代“可以再去迎战”，更准确表达原文是否继续或重复接近交战的询问，且不预设是哪一种。用破折号标出“我的弟兄”为对便雅悯人的同位称呼，保留原文单数亲属语的修辞张力，同时使汉语句法清晰。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:40Z'
