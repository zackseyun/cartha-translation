base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: zh_hans
  text: 那利未人，就是那被杀害的女子的丈夫，回答说：“我和我的妾来到属便雅悯的基比亚[a]，要在那里过夜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“便雅悯境内的基比亚”。
    reason: 原文אֲשֶׁר לְבִנְיָמִן既可强调基比亚归属便雅悯，也可理解为它位于便雅悯支派的境内。
lexical_decisions:
- source_word: וַיַּעַן
  choice: 回答
  rationale: 这是叙事中引出回应的常用表达；虽上文未直接记载一个问题，“回答”仍保留了希伯来语的叙述方式。
- source_word: הָאִישׁ הַלֵּוִי
  choice: 那利未人
  rationale: 简洁自然地表明说话者的身份，并以“那”承接上文已知人物。
- source_word: אִישׁ הָאִשָּׁה
  choice: 那女子的丈夫
  rationale: 原文直译为“那女子的男人”，在此语境中指她的男性配偶；“丈夫”是现代汉语中自然且准确的关系称谓。
- source_word: הַנִּרְצָחָה
  choice: 被杀害
  rationale: רצח带有非法夺取性命、谋杀的严重意味；“被杀害”既保留被动含义和罪行的严重性，也比直接判定为法律意义上的“谋杀”更自然。
- source_word: הַגִּבְעָתָה
  choice: 来到……基比亚
  rationale: 词尾的方向性-ה表示朝向该地；汉语以“来到”自然表达这一移动方向。
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: 属便雅悯的
  rationale: 保留介词ל所表达的归属或关联关系，指基比亚属于便雅悯支派或其领地；另一种可行理解是“在便雅悯境内”。
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: 我和我的妾来到
  rationale: 把显式主语“我”和并列的“我的妾”自然组织为现代汉语的并列主语，同时保留叙述焦点。
- source_word: פִילֶגֶשׁ
  choice: 妾
  rationale: 这是现代汉语圣经语境中简明而较准确的对应词，指地位有别于正妻的女性伴侣；避免用较长的解释性改写。
- source_word: לָלוּן
  choice: 要在那里过夜
  rationale: 该动词指留宿一夜；“过夜”清楚、自然，“在那里”则补明目的地而不增加实质信息。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那利未人，就是……”保留原文同位说明；直接引语尽量维持原句次序，同时按汉语习惯将“我和我的妾”组成并列主语。脚注标记置于实际存在词义差异的“基比亚”之后。
