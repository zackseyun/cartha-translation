base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: zh_hans
  text: 以色列人中，除便雅悯人以外[a]，共有四十万名拔刀的人被点阅[b]；这些人全都是战士。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“撇开便雅悯”。这里的总数不包括便雅悯人。
    reason: lexical_alternative
  - marker: b
    text: 或译“被数点”。这个希伯来动词可指清点人数，也可指为服役而点阅、编组。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: אִישׁ虽为单数形式，在这里却与复数动词连用，具有集合意义，特指以色列一方的男子；上下文及后文“战士”明确其军事范围。现代汉语用“以色列人”最自然，且不必生硬译作“以色列的男人”。
- source_word: הִתְפָּקְדוּ
  choice: 被点阅
  rationale: פקד的Hitpael形式在军事语境中可指登记、数点或召集检阅。“被点阅”兼顾统计人数和编组服役的含义，也符合本节的战争语境。
- source_word: לְבַד מִ/בִּנְיָמִן
  choice: 除便雅悯人以外
  rationale: 该短语表明所报总数不包括便雅悯支派。补出“人”符合现代汉语习惯，并避免把“便雅悯”误解为仅指个人。
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: 四十万……的人
  rationale: 原文在数字后明确使用אִישׁ。译文借“拔刀的人”保留人数单位及其军事身份，不直接改写为“四十万士兵”。
- source_word: שֹׁלֵף חָרֶב
  choice: 拔刀的人
  rationale: 直译为“拔出刀剑的人”，是指武装并能参战者的希伯来军事用语。“拔刀的人”保留原文鲜明意象，脚注说明其惯用意义。
- source_word: כָּל זֶה
  choice: 这些人全都
  rationale: 字面近于“这一切”，实际回指刚才统计的全体人员。译作“这些人全都”符合现代汉语指称方式。
- source_word: אִישׁ מִלְחָמָה
  choice: 战士
  rationale: 这是常见的希伯来军事称谓，意为从事战争的人。“战士”简洁自然，并保留其军事身份。
