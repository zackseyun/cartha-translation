base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: zh_hans
  text: 于是，以色列各支派派人到便雅悯各支派中去[a]，说：“这是什么恶事，竟发生在你们中间？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“往便雅悯各支派那里”。这里的介词可表示分布于各处；原文用“支派”的复数，可能泛指便雅悯内部的各个分支。
    reason: lexical_alternative
  - marker: b
    text: “恶事”也可译作“恶行”或“坏事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: 派
  rationale: שלח在这里表示差遣人前往；“派人”是现代汉语中自然、准确的表达。
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派
  rationale: 保留复数集合主体，清楚表明采取行动的是以色列的众支派。
- source_word: אֲנָשִׁים
  choice: 人
  rationale: 原文仅称他们为“人”，并未明说是使者或代表，因此不作额外身份限定。
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: 到便雅悯各支派那里
  rationale: 保留原文“便雅悯各支派”的复数这一不寻常表述，同时把介词理解为行动所指向的对象；介词也可作分布性理解，故以脚注保留另一译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常规表达。
- source_word: מָה הָרָעָה הַזֹּאת
  choice: 这件恶事……究竟是怎么回事
  rationale: מָה在此询问这件事的性质或究竟情形；“究竟是怎么回事”比生硬的“是什么”更符合现代汉语，同时保留质问语气。
- source_word: אֲשֶׁר נִהְיְתָה
  choice: 发生的
  rationale: היה的尼法勒式在此表示事情发生、出现；“发生”简洁自然。
- source_word: בָּכֶם
  choice: 你们中间
  rationale: 表示恶事发生在便雅悯群体之中，而非发生在个人内心。
