base_translation:
  language: en
  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: zh_hans
  text: 以色列人第二天向便雅悯人逼近[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逼近”也可译作“走近”；在军事语境中，也可译作“向……推进”。
    reason: lexical_alternative
  - marker: b
    text: “以色列人”和“便雅悯人”，希伯来文直译分别为“以色列的众子”和“便雅悯的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: 逼近
  rationale: קרב 的 Qal 词干表示“靠近、走近”。本节处于交战语境，“逼近”既自然地表达向对方接近，也不把动作明确强化为已经发动攻击。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这里集体指以色列各支派的军队。现代汉语用“以色列人”表达最自然，同时保留其群体身份。
- source_word: אֶל
  choice: 向
  rationale: אֶל 通常表示朝向某一对象。译作“向”保留方向含义，不因军事背景而径直增译为“攻击”。
- source_word: בְנֵי בִנְיָמִן
  choice: 便雅悯人
  rationale: 字面为“便雅悯的众子”，这里指便雅悯支派的人或军队。“便雅悯人”是现代汉语中自然、准确的群体称谓。
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: 第二天
  rationale: 原文明确使用序数“第二”，因此译作“第二天”，而不弱化为较宽泛的“次日”。
theological_decisions: []
