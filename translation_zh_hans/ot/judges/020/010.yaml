  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: zh_hans
  text: 我们要从以色列各支派中，每一百人抽调十人，每一千人抽调一百人，每一万人抽调一千人，负责为众人筹备给养。这样，众人到了便雅悯的基比亚，就要照着在以色列中所行的一切丑事[a]行事。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丑事”也可译作“恶行”或“可耻之事”。希伯来语所用的词表示令人震惊、极其可耻的行为。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“为要在他们来到便雅悯的基比亚时，照着在以色列中所行的一切丑事去做”，句式较为紧缩。末句“所行”的施事在原文中为单数，却没有明确指出；可能指基比亚及其居民作为一个整体。
    reason: source_ambiguity
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: 我们要……抽出
  rationale: 连词加完成式在大会商议行动方案的语境中表示将要采取的行动；用“要”自然表达这一前瞻含义。
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: 每一百人抽出十人，每一千人抽出一百人，每一万人抽出一千人
  rationale: 该结构表示按固定比例抽调人员；“每……抽出……”既保留递增的数字形式，也清楚说明这些人是从各单位中选出的。
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: 从以色列各支派中
  rationale: 结合前面的比例表达，这里指从以色列全体支派中抽调人员，而不只是替各支派办事。
- source_word: לָקַחַת צֵדָה לָעָם
  choice: 为众人预备给养
  rationale: צֵדָה指旅程或军事行动所需的食物和物资。“给养”适合本节的军事背景，又不局限于某一种物品；לָעָם仍译作范围较宽的“众人”。
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: 这样，众人到了……就可以……采取行动
  rationale: 原文是不定式连用的紧缩表达，把行动与众人抵达基比亚联系起来。汉语适度展开，以清楚表达目的和时序。
- source_word: לְגֶבַע בִּנְיָמִן
  choice: 到了便雅悯的基比亚
  rationale: 介词表达朝向基比亚的移动；敌对或司法性的意味由后文“采取行动”体现，不直接加入“攻打”。
- source_word: כְּכָל הַנְּבָלָה
  choice: 照着……这一切丑事
  rationale: נְבָלָה在这里指令人震惊、可耻的恶行。“丑事”保留强烈的道德谴责，同时避免引入原文没有的专门神学术语。
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: 那里在以色列中所做的
  rationale: 希伯来语动词为阳性单数，具体主语较含混，可能把基比亚视为集体，也可能指实施恶行的一方。“那里”让基比亚及其居民承担语境中的集体责任，同时不强行指定某个个人。
theological_decisions:
- issue: 如何翻译带强烈道德评价的 נְבָלָה，而不加入后来的教义分类
  choice: 丑事
  alternative: 恶行；可耻之事；愚妄之事
  rationale: 此词在本叙事中谴责基比亚发生的严重、可耻暴行。“丑事”在现代汉语中自然且有明确的道德分量，却不添加原文没有的技术性神学概念。
- issue: 如何处理“所做”的单数主语及基比亚的集体责任
  choice: 那里在以色列中所做的
  alternative: 它在以色列中所做的；有人在以色列中所做的；在以色列中所发生的
  rationale: 原文使用主动的第三人称阳性单数，但主语没有明说。译作“那里”可维持城市与居民之间的集体指涉，也保留一定含混性，避免改成被动句或擅自指定个人。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“每……抽出……”清楚呈现按十分之一比例抽调人员；“给养”符合行军语境而不过度限缩为食物；末句适度展开希伯来语的紧缩结构，同时用脚注保留其字面形式和主语含混性。
