  to: 我们要从以色列各支派中，每一百人抽调十人，每一千人抽调一百人，每一万人抽调一千人，负责为众人筹备给养。这样，众人到了便雅悯的基比亚，就要照着在以色列中所行的一切丑事[a]行事。[b]
