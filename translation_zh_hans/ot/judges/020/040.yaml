    rationale: עַמּוּד עָשָׁן 是对升起之信号的说明，即“一道烟柱”，而非信号升起后才“形成”烟柱。
  - severity: low
    issue: “不料”强化了意外性。
    rationale: וְהִנֵּה 主要标示突然看见或注意到的情景；“只见”更贴近这一叙事功能，避免添加“出乎意料”的评价。
  - severity: low
    issue: 脚注a的“烽号”不够常用。
    rationale: 改为“烽火信号”更符合现代标准汉语，同时保留其作为可选译法而非正文释义。
