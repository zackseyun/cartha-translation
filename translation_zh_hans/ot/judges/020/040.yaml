base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: zh_hans
  text: 可是，那作为信号的一道烟柱开始从城里升起[a]。便雅悯人转身向后[b]，只见整座城都向天升腾[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作为烽火信号的一道烟柱开始从城里升起。”原文所用的词可指被举起之物；在这里很可能是事先约定的作战信号。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“便雅悯转身向后。”这里可能是指便雅悯人转过身去，也可能是指他们回头察看身后。
    reason: lexical_alternative
  - marker: c
    text: 原文直译：“整座城都升到天上去了”，意指全城在烈火和浓烟中焚烧。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: 信号
  rationale: 结合伏兵按约定焚城的战事语境，此词指升起供人辨认的信号；“信号”准确表达其传讯功能，同时不把具体形式解释得过细。
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: 开始……升起
  rationale: 保留动词所表达的动作起始及向上运动，也符合现代汉语描写烟气的习惯。
- source_word: עַמּוּד עָשָׁן
  choice: 一道烟柱
  rationale: 准确呈现烟雾垂直上升、形如柱子的画面；量词“一道”使中文自然。
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: 便雅悯人转身向后
  rationale: “便雅悯”在原文中以单数作集体称谓，中文译作“便雅悯人”；“转身向后”保留原文的动作，却不强行限定为只是回头观看或撤退。
- source_word: וְהִנֵּה
  choice: 不料
  rationale: 用现代而庄重的叙事语表达突然看见、猛然意识到的戏剧性；比“看哪”更符合此处人物视角下的自然中文。
- source_word: כְלִיל הָעִיר
  choice: 整座城
  rationale: כְלִיל 在此表达全体、整体，译作“整座城”简洁自然。
- source_word: עָלָה ... הַשָּׁמָיְמָה
  choice: 都向天升腾
  rationale: 保留原文把整座城描写为向天上升的强烈意象，不在正文中明确补入原文未直说的“火焰”或“烟”。
