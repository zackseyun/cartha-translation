base_translation:
  language: en
  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: zh_hans
  text: 以色列人与伏兵事先约定的信号[a][b]，是让一大股烟[c]从城里升起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“事先作出的安排”或“约定的记号”。希伯来语מוֹעֵד常指指定的时间，但在这里指战斗中预先约定的信号。
    reason: lexical_alternative
  - marker: b
    text: 直译为“为以色列人、与伏兵”；意思是双方所作的约定。
    reason: lexical_alternative
  - marker: c
    text: 或译“一团烟”或“一柱烟”。原文所说的是从城里明显升起、用作信号的烟。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: 事先约定的信号
  rationale: מוֹעֵד通常指指定的时间、会合或约定之事；在这里的战事语境中，它指双方预先约定、用来配合作战的信号。“事先约定的信号”既表达其预先安排的性质，也说明其在本节中的实际功能。句首的וְ不机械译为“现在”，其承接作用由上下文体现。
- source_word: לְאִישׁ יִשְׂרָאֵל עִם הָאֹרֵב
  choice: 以色列人与伏兵
  rationale: לְ与עִם合起来表明参与约定的双方。אִישׁ יִשְׂרָאֵל在军事语境中指以色列人；אֹרֵב是埋伏等候者的集合称呼，译作“伏兵”简洁自然。
- source_word: הֶרֶב
  choice: 一大股
  rationale: 该形式来自רבה，在这里加强随后升起烟气的动作或规模。中文以“一大股”自然表达烟势显著、足以作为信号。
- source_word: לְהַעֲלוֹתָם
  choice: 让……升起
  rationale: עלה的使役式表示“使上升、使升起”；中文“让……升起”保留使役意义。原文第三人称复数后缀标示执行者，正文用省略主语的中文结构，避免不必要地将其指向范围说得比原文更明确。
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: 一大股烟
  rationale: מַשְׂאַת表示被举起或升起之物；与“烟”连用时指明显升腾的烟团或烟柱。“一大股烟”是现代中文中自然且形象的表达。
- source_word: מִן הָעִיר
  choice: 从城里
  rationale: מִן表示来源或起点；“从城里”准确表达烟升起的地点来源。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“事先约定的信号”明确战事语境中的功能，同时脚注保留מוֹעֵד可指约定安排或指定事项的词义幅度。正文省略使役动作的复数主语，符合汉语习惯，也避免过度消解原文指代的含蓄性。
