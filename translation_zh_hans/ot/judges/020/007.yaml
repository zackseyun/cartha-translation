  text: הִנֵּ֥ה כֻלְּ/כֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל הָב֥וּ לָ/כֶ֛ם דָּבָ֥ר וְ/עֵצָ֖ה הֲלֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/007.yaml
  text: Look, all of you sons of Israel, give your word and counsel here.
translation:
  language: zh_hans
  text: 看哪，你们全体以色列人，请在这里提出意见和建议。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引起全体听众注意的指示语气；比单纯译作“看”更符合庄重的公开陈词语境。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处指以色列共同体的成员，并非刻意限定男性；现代汉语用“以色列人”自然且准确。
- source_word: הָבוּ לָכֶם דָּבָר
  choice: 请提出你们的意见
  rationale: 字面结构为“为你们自己给出话语”；在议事语境中，דָּבָר 指所提出的看法或主张，译为“提出你们的意见”比生硬的“给出话语”清楚。
- source_word: וְעֵצָה
  choice: 和对策
  rationale: עֵצָה 可指商议所得的谋略、方案；这里既要求表态，也要求决定如何行动，因此译作“对策”，同时不把具体行动说死。
- source_word: הֲלֹם
  choice: 现在
  rationale: 该词本义可为“这里/到这里”，在此公开集会的劝请中兼有当场、此刻之意；汉语以“现在”最自然地传达立即提出意见和方案的要求。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的议事用语。“看哪”保留希伯来叙事中的强调语气；后半句呈现公开要求全体以色列人当场表态并商定行动的语境。
