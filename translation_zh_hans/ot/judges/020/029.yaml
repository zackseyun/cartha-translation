  text: So Israel set men in ambush around Gibeah[a].
translation:
  language: zh_hans
  text: 于是，以色列人在基比亚周围布置伏兵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文可直译为“把伏击者安置在基比亚周围”。其中介词也可有“向着”的意思；这里与“周围”连用，指在基比亚四周部署伏兵。
    reason: 说明אֶל与סָבִיב组合的方向和方位含义，并表明אֹרְבִים具体指伏击者。
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 设下
  rationale: שׂוּם的基本义是“放置、设置”。在军事语境中与“伏兵”搭配，译作“设下”自然、具体，也没有增添原文未明说的行动细节。
- source_word: יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处“以色列”集合性地指参战的以色列军队；现代汉语用“以色列人”更清楚自然。
- source_word: אֹרְבִים
  choice: 伏兵
  rationale: 这是ארב的复数主动分词，具体指埋伏等候的人，而不只是抽象的“埋伏”。“伏兵”简洁保留了其人员含义。
- source_word: אֶל … סָבִיב
  choice: 在……周围
  rationale: אֶל本可表示“向、朝、靠近”，与סָבִיב连用并置于军事部署语境中，整体表示围绕基比亚布置伏兵；“在……周围”符合现代汉语表达，同时脚注保留其字面方向性。
- source_word: הַגִּבְעָה
  choice: 基比亚
  rationale: 此处是地名“基比亚”；希伯来语所带冠词不需在汉语地名中另行表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接前文；“设下伏兵”是自然的军事表达，同时用脚注保留希伯来文在“向着／周围”之间的字面张力。段末的开放段落标记不在正文中另译。
