  text: וַ/יֵּצֵא֙ אִ֣ישׁ יִשְׂרָאֵ֔ל לַ/מִּלְחָמָ֖ה עִם בִּנְיָמִ֑ן וַ/יַּעַרְכ֨וּ אִתָּ֧/ם אִֽישׁ יִשְׂרָאֵ֛ל מִלְחָמָ֖ה אֶל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: zh_hans
  text: 以色列人出去与便雅悯人交战；以色列人向基比亚摆开阵势，与他们对阵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向基比亚”也可按战场位置译作“在基比亚”。原文介词通常表示方向，在此语境中也可能标示部署地点。
    reason: 保留אֶל在方向与地点理解之间的语义空间。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: יצא在军事叙事中表示出动迎战；“出去”既贴近原文，也不额外加入“进军”等细节。
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: אִישׁ虽为单数形式，此处作集合名词，指以色列的作战人员；现代汉语用“以色列人”自然地表达这一集体。
- source_word: לַמִּלְחָמָה
  choice: 交战
  rationale: 该介词短语表示出动的目的，即投入战斗；“交战”简洁而符合现代军事叙事。
- source_word: עִם בִּנְיָמִן
  choice: 与便雅悯人交战
  rationale: עִם通常表示“与……一起/同……”，在战争语境中则可指与对方交战；补出“交战”可避免误解为结盟。便雅悯在此代表便雅悯支派的军队，因此译作“便雅悯人”。
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: 摆开阵势
  rationale: ערך与“战争”连用时表示按战斗队形部署；“摆开阵势”准确、自然，也保留军事意味。
- source_word: אִתָּם
  choice: 与他们交战
  rationale: 介词本身可译为“与他们”，但上下文明确双方敌对；加上“交战”使现代汉语意思清楚，同时以脚注说明其形式上的宽泛性。
- source_word: אֶל הַגִּבְעָה
  choice: 在基比亚
  rationale: אֶל基本义为“向、朝”，此处在布阵语境中标示部署所针对或所在的地点；正文采用自然的地点表达“在基比亚”，脚注保留方向性译法。
theological_decisions:
- issue: אִישׁ יִשְׂרָאֵל的集合性及性别表达
  choice: 以色列人
  alternative: 以色列男子／以色列的战士
  rationale: 原文以阳性单数集合用法指参战的以色列群体。汉语“以色列人”在战斗语境中自然指这些作战人员；译成“男丁”会增添年龄或征兵资格方面的含义，译成“战士”则会使原文未明说的身份更具体。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“摆开阵势”保留军事场景，又不显古奥；分号呈现原文两个连续动作。
