  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: zh_hans
  text: 伏兵迅速出击，袭向基比亚；伏兵随即向前推进[a]，用刀杀了全城的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向前推进”所译的希伯来语字面可作“拉出”或“延伸”；这里可能是说伏兵向前展开，继续攻入城中。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: 伏兵
  rationale: 该词形式上是单数，但在本节中集合性地指埋伏的军队；“伏兵”简洁自然，也保留军事语境。
- source_word: הֵחִישׁוּ
  choice: 迅速
  rationale: 该动词表示赶快、急速行动；与“出击”搭配，传达行动的紧迫和突然。
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: 出击，袭向
  rationale: פשט在军事叙事中可指展开突袭或进攻；“出击，袭向”既体现快速军事行动，也保留朝向基比亚的空间关系。
- source_word: הַגִּבְעָה
  choice: 基比亚
  rationale: 按现代中文圣经地名的通行音译处理。
- source_word: וַיִּמְשֹׁךְ
  choice: 向前推进
  rationale: 该词字面有“拉、牵、延伸”之意，此处主语为伏兵，语境很可能指伏兵继续向前展开并攻入城中；正文采用清楚的军事表达，同时以脚注保留字面含义及不确定性。
- source_word: וַיַּךְ
  choice: 杀了
  rationale: נכה可泛指击打或击杀；在“用刀”这一致命手段的限定下，译为“杀了”最符合本处语境。
- source_word: כָּל הָעִיר
  choice: 全城的人
  rationale: 字面是“全城”，但与“用刀杀”连用时，是以城市代指其中居民；中文补出“的人”可避免误解为用刀毁坏建筑。
- source_word: לְפִי חָרֶב
  choice: 用刀
  rationale: 该希伯来语惯用语字面为“按着刀剑之口”，实际表示以刀剑杀戮；“用刀”在现代中文中自然、准确。
