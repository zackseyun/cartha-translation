  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: zh_hans
  text: 那时，亚伦的孙子、以利亚撒的儿子非尼哈站在它面前[a]，问道：“我还要再出去与我的弟兄便雅悯的子孙交战，还是就此罢手呢？”耶和华说：“你们上去吧，因为明天我必把他交在你手中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上一节所说的约柜；也可理解为“他”，即耶和华。
    reason: 保留לְפָנָיו中第三人称单数代词所指的真实歧义。
  - marker: b
    text: “他”将便雅悯支派视为一个整体；也可译作“我必把他交付在你手中”。
    reason: 说明集体单数，并保留נתן ביד这一惯用语的词义选择。
lexical_decisions:
- source_word: וּפִינְחָס בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: 亚伦的孙子、以利亚撒的儿子非尼哈
  rationale: 保留两代祭司家系，同时按现代汉语习惯由远及近表达亲属关系；וּ在此不必机械译作“并且”。
- source_word: עֹמֵד לְפָנָיו
  choice: 侍立在它面前
  rationale: עֹמֵד可指站立或侍立；结合上一节的约柜，译为“侍立”体现祭司性的在场，“它”保留以约柜为先行词的理解，并用脚注说明也可指耶和华。
- source_word: בַּיָּמִים הָהֵם
  choice: 那时
  rationale: 自然凝练地传达“在那些日子”的时间背景。
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: 我还要再出去……交战
  rationale: יסף与עוד共同表达再次行动；“出去交战”保留希伯来语军事表达。
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: 与我的弟兄便雅悯的子孙交战
  rationale: 在交战语境中，עִם表示交战对象；保留“我的弟兄”这一单数亲族称谓，凸显内战中的手足关系。
- source_word: אִם אֶחְדָּל
  choice: 还是就此罢手呢
  rationale: חדל意为停止；“就此罢手”符合现代汉语中的抉择问句。
- source_word: עֲלוּ
  choice: 你们上去吧
  rationale: 复数命令式明确以色列众人为对象；“上去”保留军事进发及可能的地理意味。
- source_word: אֶתְּנֶנּוּ בְיָדֶךָ
  choice: 我必把他交在你手中
  rationale: 保留原文受词“他”和“交在手中”的胜败惯用语；单数“他”将便雅悯视为一个整体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中广为人知的神名音译，明确呈现专名。
theological_decisions:
- issue: לְפָנָיו中代词所指
  choice: 正文理解为上一节所说的约柜，译作“它面前”
  alternative: 理解为耶和华，译作“他面前”
  rationale: 上一节最近且具体的先行词是“上帝的约柜”，祭司站在约柜前也合乎语境；但经由约柜指向耶和华的理解同样可能，故以脚注保存歧义。
- issue: 便雅悯的集体单数
  choice: 保留“他”
  alternative: 译作“他们”或“便雅悯人”
  rationale: 原文以单数代词将便雅悯支派作为一个集体，保留单数可呈现原文修辞而不消解其张力。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”在现代标准汉语中辨识度高且具有庄重的经文语域；不以普通称号“主”替代原文专名。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“侍立”“交战”“罢手”兼顾祭司场景、军事语境和现代可读性；问话使用第一人称单数，照应以色列作为共同体发问，回应则保留复数命令“你们上去”。
