base_translation:
  language: en
  yaml_path: translation/ot/judges/020/008.yaml
  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: zh_hans
  text: 于是，全体民众如同一人站起来，说：“我们谁也不去自己的帐篷，也不转向自己的家。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 站起来
  rationale: 基本义为“起来、站起”；此处描述全体民众一致起身并作出宣告，用“站起来”自然且贴近原文。
- source_word: כָּל־הָעָם
  choice: 全体民众
  rationale: 概括聚集在场的全体百姓；“民众”符合现代汉语叙事语体。
- source_word: כְּאִישׁ אֶחָד
  choice: 如同一人
  rationale: 保留希伯来语的形象表达，强调众人行动和意志一致，不将其解释性改写为“同心一致”。
- source_word: לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ
  choice: 我们谁也不回自己的帐篷
  rationale: אישׁ配合否定表示“没有一个人”；“回”根据帐篷作为各人驻处的语境自然表达前往之意。
- source_word: וְלֹא נָסוּר אִישׁ לְבֵיתוֹ
  choice: 谁也不转回自己的家
  rationale: סור意为“转离、转向”；“转回”既保留转向之意，也符合返回家中的语境。
