base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: zh_hans
  text: 但有六百人转身逃往旷野[a]，到了临门磐石[b]，在那里住了四个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逃进旷野”。希伯来语的方向形式可以表示朝旷野而去，也可以表示进入旷野地区。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语作“临门的磐石”，也可译作“临门岩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: 转身
  rationale: 表示改变方向；与“逃往”连用，自然呈现他们从战场撤逃的动作。
- source_word: וַיָּנֻסוּ
  choice: 逃往
  rationale: נוּס在军事叙事中通常指逃跑；“逃往”兼顾逃亡动作与随后目的地。
- source_word: הַמִּדְבָּרָה
  choice: 往旷野
  rationale: 方向词尾表示朝向或进入旷野；正文采用自然的“往”，并以脚注保留“进入”的可能。
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: 到了临门磐石
  rationale: סֶלַע指磐石或岩石据点；“临门磐石”简洁保留希伯来语的地名结构。
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: 六百人
  rationale: 这里的אִישׁ按军事语境指成年男子；现代汉语在上下文中用“六百人”自然且准确。
- source_word: וַיֵּשְׁבוּ
  choice: 住了
  rationale: ישׁב可指居住、停留；四个月的时限表明是暂住，“住了”自然明白。
- source_word: בְּסֶלַע רִמּוֹן
  choice: 在那里
  rationale: 所指地点紧接在前，使用“在那里”避免汉语中生硬重复，同时清楚回指临门磐石。
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: 四个月
  rationale: 直接表达停留的时长。
- source_word: וַ
  choice: 但
  rationale: 叙事连接词本可译作“于是”或“而”；结合上文便雅悯军遭毁灭的背景，“但”突出这六百名幸存者的例外。
