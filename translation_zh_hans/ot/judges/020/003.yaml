  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: zh_hans
  text: 便雅悯子孙听说以色列子孙已经上到米斯巴[a]。以色列子孙说：“请告诉我们，这件恶事[b]是怎样发生的？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “便雅悯子孙”和“以色列子孙”也可译作“便雅悯人”和“以色列人”。希伯来原文在本节一再使用“……子孙”这一说法。
    reason: lexical_alternative
  - marker: b
    text: “恶事”也可译作“邪恶的事”或“恶行”。希伯来语这个词带有强烈的道德含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听说
  rationale: שׁמע在此叙事语境中指听到消息；“听说”自然地表达获悉一项消息，同时不添加原文没有的时间副词。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯子孙
  rationale: 保留“……之子”的希伯来表达及支派身份，并与本节反复出现的“以色列子孙”形成对应。
- source_word: כִּי עָלוּ
  choice: 已经上到
  rationale: עלה的基本意义是“上去”；“已经”清楚表达他们听见消息之前，以色列人已上到聚集地点。
- source_word: הַמִּצְפָּה
  choice: 米斯巴
  rationale: 按地名处理；希伯来语定冠词无需在现代汉语音译地名中另行表达。
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: 保留אמר的普通叙事用语，不将其进一步解释为“询问”或“要求”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文结构，并与“便雅悯子孙”构成形式上的平行。
- source_word: דַּבְּרוּ
  choice: 请告诉我们
  rationale: 该命令式在这里要求对方陈述事情经过；“请告诉我们”符合现代汉语口吻，并自然补出语境所含的受事者。
- source_word: אֵיכָה
  choice: 怎样
  rationale: 直接表达对事情发生方式的追问，同时不额外加强语气。
- source_word: נִהְיְתָה
  choice: 是……发生的
  rationale: היה在此具有事件发生之意；用汉语“发生”比直译为“成为”自然准确。
- source_word: הָרָעָה הַזֹּאת
  choice: 这件恶事
  rationale: רָעָה在本段语境中具有强烈的道德含义；“恶事”保留这一伦理力度，同时仍可涵盖具体罪行。
