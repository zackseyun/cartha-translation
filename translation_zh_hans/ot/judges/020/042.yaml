revisions:
- from: 于是，他们在以色列人面前转向旷野的路逃去[a]，但战事追上了他们[b]；那从各城出来的人，又在他们中间歼灭他们[c]。
  to: 于是，他们转身，从以色列人面前逃往通向旷野的路[a]；但战事追上了他们[b]。从城里出来的人在他们队伍中杀戮他们[c]。
  rationale: 修订使中文叙事更自然，并避免以“歼灭”过度限定原文的毁灭性分词。末句仍按原文保留“从城里出来的人”及集合性“他们”的指代，不在正文断定这些人究竟来自哪些城或具体是否为伏兵；相关较可能的战术理解仅置于脚注。
