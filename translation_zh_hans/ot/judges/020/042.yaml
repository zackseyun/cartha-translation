base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: zh_hans
  text: 于是，他们转身，从以色列人面前逃往通向旷野的路[a]；但战事追上了他们[b]。从城里出来的人在他们队伍中杀戮他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在以色列人面前。”这短语也可按语境理解为“从以色列人面前退去”，即逃离他们。
    reason: lexical_alternative
  - marker: b
    text: 或译：“战斗赶上了他们。”
    reason: lexical_alternative
  - marker: c
    text: 本句后半在希伯来文中十分简略，含义不易确定。它很可能指从城里或伏兵所在之处出来的以色列军队，在便雅悯人的队伍中杀戮他们。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: 转向……逃去
  rationale: פנה本义为“转向、转身”；战场语境表明这是撤退逃走。译文保留“转向”的意象，并以“逃去”自然表达语境含义。
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: 在以色列人面前
  rationale: 直译为“在以色列人面前”，也可按语境理解为“从以色列人面前退去”。正文保留原文表达，脚注说明其语用含义。
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: 向旷野的路
  rationale: דֶּרֶךְ可指“路、道路”，该结构可理解为通往或位于旷野方向的路；此译法简洁并保留原文结构。
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: 但战事追上了他们
  rationale: 原文以“战事”为主语，הדביק表示赶上、追及。用“追上”保留拟人化表达；连接词依上下文译为转折性的“但”。
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: 那从各城出来的人
  rationale: 原文是压缩的关系结构，字面为“那些从城中的”。补出“出来”使中文完整，但不在正文进一步断定其具体身份或伏兵位置。
- source_word: מַשְׁחִיתִים
  choice: 歼灭
  rationale: שׁחת的使役分词在军事语境中表示毁灭、杀灭。“歼灭”符合战斗场景，也保持庄重简洁。
- source_word: אוֹתוֹ
  choice: 他们
  rationale: 希伯来文使用阳性单数代词，所指很可能是作为集合体的便雅悯军队；现代中文自然使用复数“他们”。
- source_word: בְּתוֹכוֹ
  choice: 在他们中间
  rationale: 原文为带单数后缀的“在其中”，与集合性对象相应。译作“在他们中间”保留空间上的含混，不强行判定是阵内夹击或地理位置。
