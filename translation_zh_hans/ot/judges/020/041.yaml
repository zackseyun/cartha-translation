  text: וְ/אִ֤ישׁ יִשְׂרָאֵל֙ הָפַ֔ךְ וַ/יִּבָּהֵ֖ל אִ֣ישׁ בִּנְיָמִ֑ן כִּ֣י רָאָ֔ה כִּֽי נָגְעָ֥ה עָלָ֖י/ו הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: zh_hans
  text: 以色列人转过身来[a]，便雅悯人就惊慌失措，因为他们看见灾祸已经临到他们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“以色列的一个人”“便雅悯的一个人”“他看见”和“临到他”均为单数形式；但在这里集合性地指交战双方。正文按现代汉语习惯作群体表达。
    reason: 说明原文集合性单数与中文群体表达之间的差异。
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: אִישׁ虽为单数形式，在本段军事叙事中却集合性地指以色列的战士；译作“以色列人”既准确又符合现代汉语表达。句首连接词按叙事承接关系自然处理，不另译为“然后”。
- source_word: הָפַךְ
  choice: 转过身来
  rationale: 该动词在此表示战场上的转身迎敌。“转过身来”保留原文简洁的动作描写；不直接译作“反攻”，以免加入原文没有明说的战术解释。
- source_word: וַיִּבָּהֵל
  choice: 就惊慌失措
  rationale: בהל表示突然而强烈的惊惧、慌乱。“惊慌失措”传达其力度，也适合军队发现败局已定时的语境；“就”体现叙事上的紧接关系。
- source_word: אִישׁ בִּנְיָמִן
  choice: 便雅悯人
  rationale: 单数אִישׁ在这里集合性地指便雅悯一方的战士，因此用现代汉语集合表达“便雅悯人”。
- source_word: כִּי רָאָה כִּי
  choice: 因为他们看见
  rationale: 第一个כִּי引出原因，第二个כִּי引出所看见的内容。汉语用“因为他们看见……”即可自然兼顾两层句法关系，无须重复连接词。单数动词רָאָה按集合主语译为“他们看见”。
- source_word: נָגְעָה עָלָיו הָרָעָה
  choice: 灾祸已经临到自己
  rationale: רָעָה在此指战败所带来的灾难，并非道德意义上的“邪恶”，故译“灾祸”。נגע על在此表示灾祸已经来到、落在其身上，译为“临到”贴近原文意象；单数代词后缀按集合性所指译作“自己”。“已经”体现完成式所表示的局势已然形成。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“转过身来”保留战场动作的简洁与一定程度的含混，不擅自明确为“反攻”；“惊慌失措”和“灾祸已经临到自己”则传达原文骤然恐惧及大祸临头的力度。
