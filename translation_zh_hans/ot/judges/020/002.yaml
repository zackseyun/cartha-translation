base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: zh_hans
  text: 以色列各支派全体百姓的首领[a]都站定在上帝子民的大会中——共有四十万名拔刀的步兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”原文直译为“角”；“角”在这里是比喻，指首领或领头的人。
    reason: 保留原文比喻性用词及其可能不为现代读者直接理解的字面形象。
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: 列队站立
  rationale: 该词的反身词干表示站定、各就其位；结合军事集结的语境，“列队站立”兼顾姿态与整队就位之意。
- source_word: פִּנּוֹת
  choice: 首领
  rationale: 字面义为“角、角落”，在此作比喻，指支撑并代表群体的领袖人物；正文采用现代汉语中清楚自然的“首领”，并以脚注保留原文意象。
- source_word: כָּל הָעָם כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 全体百姓的首领，就是以色列各支派的首领
  rationale: 将“以色列各支派”理解为对“全体百姓”范围的进一步说明，并用“就是”呈现其同位关系，使汉语句法清楚，同时不削弱“全体、各”的周遍性。
- source_word: בִּקְהַל
  choice: 在……大会中
  rationale: קהל指召集起来的集会；“大会”符合此处全国性军事与司法集结的场景，也避免使用带有较强后世教会色彩的词。
- source_word: עַם הָאֱלֹהִים
  choice: 上帝子民
  rationale: 简洁、自然地表达该属格结构，并保留以色列与上帝关系的神学称谓。
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ רַגְלִי
  choice: 四十万名……步兵
  rationale: 直接保留人数，并以“步兵”自然表达“徒步之人”的军事含义。
- source_word: שֹׁלֵף חָרֶב
  choice: 拔刀的
  rationale: 保留原文单数分词在集体数词之后的分配性用法及鲜明的军事画面；汉语定语结构可自然涵盖每名士兵。
theological_decisions:
- issue: עַם הָאֱלֹהִים的译法
  choice: 上帝子民
  alternative: 上帝的百姓
  rationale: 两者均可准确表达原文；“上帝子民”庄重简洁，保留群体与上帝之间的归属关系，不额外引入宗派性解释。
- issue: “以色列各支派”与“全体百姓的首领”的句法关系
  choice: 作为同位性的范围说明：就是以色列各支派的首领
  alternative: 将“以色列各支派”直接作为“站立”的并列主语
  rationale: 希伯来语的名词串联较为紧凑；结合פִּנּוֹת的领袖含义及上下文，译作对首领所属范围的说明最为连贯，但不据此引申任何额外的治理或代表制度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列队站立”体现集结就位的军事语境；破折号引出四十万步兵，保持原文后半句的补充说明功能。正文脚注标记[a]与脚注对应。
