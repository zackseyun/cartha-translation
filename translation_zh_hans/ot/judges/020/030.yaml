  text: 第三天，以色列人上去攻击便雅悯人，向着基比亚列阵，像先前一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上去迎战
  rationale: עלה的基本义是“上去”；在此战事语境中，结合后面的敌对对象，用“上去迎战”既保留方向意味，也自然表达军事行动。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列之子”，但现代汉语通常以“以色列人”指该族群；本节双方均作族群称谓，表达清楚自然。
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: 迎战便雅悯人
  rationale: אֶל本义为“向、朝”；在军事语境中表示朝敌方进军，以“迎战”传达敌对行动而不拘泥于空间介词。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 直接而自然地表达时间。
- source_word: וַיַּעַרְכוּ
  choice: 列阵
  rationale: ערך在军事语境中指部署、摆列军队；“列阵”简洁、庄重，也易于现代读者理解。
- source_word: אֶל הַגִּבְעָה
  choice: 在基比亚对面
  rationale: 介词אֶל在列阵语境中表示面向或针对基比亚；“在……对面”保留空间关系，也与敌对部署相符。
- source_word: כְּפַעַם בְּפָעַם
  choice: 像前两次一样
  rationale: 该习语意为“像先前各次一样”。上下文明确这是第三次出战，因此“前两次”自然具体，未改变叙事所指。
