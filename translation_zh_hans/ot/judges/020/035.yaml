  text: וַ/יִּגֹּ֨ף יְהוָ֥ה אֶֽת בִּנְיָמִן֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּשְׁחִיתוּ֩ בְנֵ֨י יִשְׂרָאֵ֤ל בְּ/בִנְיָמִן֙ בַּ/יּ֣וֹם הַ/ה֔וּא עֶשְׂרִ֨ים וַ/חֲמִשָּׁ֥ה אֶ֛לֶף וּ/מֵאָ֖ה אִ֑ישׁ כָּל אֵ֖לֶּה שֹׁ֥לֵף חָֽרֶב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: zh_hans
  text: 耶和华在以色列人面前击溃了便雅悯人[a]；那一天，以色列人[b]杀灭了便雅悯人二万五千一百名，这些全都是拔刀作战的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击溃了”或译“击倒了”或“打败了”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: 击溃了
  rationale: נָגַף在军事语境中指击打并使对方败退或战败。“击溃”既保留强烈的战斗色彩，也比单纯的“打败”更贴近此处的致命战况。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”译出四字神名，不以称号替代。
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: 在以色列人面前
  rationale: 保留希伯来语“在……面前”的表达，同时在汉语中自然地指在以色列人面前、即与他们交战时。
- source_word: וַיַּשְׁחִיתוּ
  choice: 杀灭了
  rationale: שׁחת的使役形在此战报中表示毁灭并杀死。“杀灭”明确表达人员伤亡，又保留原词强烈的毁灭意味。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，此处作为民族群体名称和军队主体，现代汉语以“以色列人”最自然；脚注保留字面形式。
- source_word: בְּבִנְיָמִן
  choice: 便雅悯人
  rationale: 介词ב标示伤亡者所属的群体；汉语将其自然表达为“便雅悯人”。
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: 二万五千一百名
  rationale: 准确表达原文数目；量词“名”与所指的男性战士相称，后文已说明其战斗身份，无须重复添加“男子”。
- source_word: כָּל אֵלֶּה שֹׁלֵף חָרֶב
  choice: 这些全都是拔刀作战的人
  rationale: 保留“拔刀”的原文意象，并用“作战”清楚表达这一惯用语所指的武装战士。
theological_decisions:
- issue: 战役结果中的神圣行动与人的行动
  choice: 分别保留“耶和华……击溃”与“以色列人……杀灭”两个明确的行动分句。
  alternative: 只强调耶和华造成胜利，或只将结果描述为以色列人的军事胜利。
  rationale: 原文先后并列神与人的行动，没有把一方的能动性消解为另一方；译文保留这一神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“击溃”“杀灭”符合战报语境；“拔刀作战的人”既保留原文形象，也让普通读者易于理解。所有脚注标记均置于正文相应位置。
