  yaml_path: translation/ot/judges/020/019.yaml
  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: zh_hans
  text: 以色列人[a]早晨起来，对着基比亚安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”。
    reason: 说明原文的群体称谓，同时正文采用自然的现代汉语表达。
lexical_decisions:
- source_word: וַיָּק֥וּמוּ
  choice: 起来
  rationale: קום的叙事性连续式表示接续发生的动作；“起来”保留了原文朴素的动作含义，不额外解释为已经出发。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语直译为“以色列的众子”，在这里是对以色列群体的惯用称呼；“以色列人”是现代汉语自然、准确且不造成仅指男性之误解的表达。
- source_word: בַּבֹּקֶר
  choice: 清早
  rationale: 介词与定冠词名词合用表示时间；“清早”简洁自然，准确传达早晨这一时间点。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה指扎营、驻营；“安营”符合军事叙事语境，又保持庄重而通俗的表达。
- source_word: עַל
  choice: 对着
  rationale: 在当前军事语境中，该介词表示面向并针对基比亚部署，而非单纯位于附近；“对着”既保留敌对态势，也不过度增添“进攻”等原文未明说的动作。
- source_word: הַגִּבְעָה
  choice: 基比亚
  rationale: 此处是地名Gibeah；希伯来语所带冠词已融入专名用法，不在汉语中另行译出。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“对着基比亚安营”保留军事对峙意味，却不把行动明确化为原文未直接陈述的进攻。
