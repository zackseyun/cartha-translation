base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: zh_hans
  text: 基比亚的人起来攻击我，夜里包围了我所在的房子。他们想要杀我，又强暴了我的妾[a]，她就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强暴了”或译“凌辱了”。原文动词可指严重的羞辱、虐待或侵犯；这里的上下文表明是性侵。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: 基比亚的人
  rationale: 此处复数构造短语按习语指城中的男性居民或要人；译作“基比亚的人”自然，也不额外暗示贵族身份。
- source_word: וַיָּקֻמוּ עָלַי
  choice: 起来攻击我
  rationale: קום על 表示怀着敌意起来反对或攻击某人；此译保留“起来”的意象，并清楚表达敌对行动。
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: 包围了我所在的房子
  rationale: 原文直陈他们围住房子，同时 עָלַי 表明行动针对说话者；“我所在的房子”以自然汉语保留这一关系。
- source_word: לָיְלָה
  choice: 夜里
  rationale: 作时间状语，简洁自然地说明事情发生的时间。
- source_word: דִּמּוּ לַהֲרֹג
  choice: 想要杀我
  rationale: דמה 在此表示意图或打算；“想要”是现代汉语中自然且不过度强化预谋程度的表达。
- source_word: פִּילַגְשִׁי
  choice: 我的妾
  rationale: “妾”是 פילגש 在古代婚姻与家庭制度语境中的简明、传统而准确的对应词。
- source_word: עִנּוּ
  choice: 强暴了
  rationale: ענה 的 piel 形可表示折磨、羞辱或侵犯；本段上下文明确涉及多人实施的性暴力，因此“强暴”准确传达语境中的具体行为。
- source_word: וַתָּמֹת
  choice: 她就死了
  rationale: 以“就”自然承接叙事结果，但不采用“以致”等更明确的因果连接，从而避免超出原文单纯的连续叙述。
theological_decisions: []
