  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: zh_hans
  text: 于是，会众派了一万二千名勇士到那里去，吩咐他们说：“你们去，用刀击杀基列雅比的居民，连妇女和孩童也不可放过。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: 会众
  rationale: 指聚集并共同议事的以色列群体；“会众”既贴近词义，也符合本书语境。
- source_word: מִבְּנֵי הֶחָיִל
  choice: 勇士
  rationale: 字面为“英勇之子/有能力的人”，在军事语境中自然指能征善战的勇士；避免生硬直译“勇力之子”。
- source_word: לְפִי חֶרֶב
  choice: 用刀击杀
  rationale: 该习语字面为“按刀口”，实际表达以刀剑杀戮；译出动作含义，保持庄重而清楚。
- source_word: הַטָּף
  choice: 孩童
  rationale: 可泛指幼小、受扶养者或小孩子；本句与妇女并列时，“孩童”最自然，同时不额外限定年龄。
theological_decisions:
- issue: 叙事中的灭杀命令是否应被译成神的直接命令
  choice: 保持为会众向所派勇士发出的命令
  alternative: 用措辞暗示这是上帝直接颁布的圣战命令
  rationale: 原文主语是“会众”，本节并未说上帝直接发令；译文不应增添神学归因。
- issue: 妇女和孩童是否只是随带提及，还是明确包括在击杀对象内
  choice: 译为“连妇女和孩童也不可放过”
  alternative: 较字面地译为“以及妇女和孩童”
  rationale: 希伯来语并列结构把妇女和孩童纳入前述击杀命令的范围；此译清楚传达句法关系，但不为暴力作辩护或弱化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“于是”承接上文；保留事件的严酷直陈，不以委婉语淡化，也不加入评价性说明。
