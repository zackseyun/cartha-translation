  source_fidelity: 译文准确呈现了叙事顺序和主要语义：全会众差派人员、向在临门磐石的便雅悯支派成员说话，并向他们宣告和平。“派人去”虽比单独的“差遣”略具体，但由紧随其后的说话行动所支持，未不当地限定为使者或使臣。
