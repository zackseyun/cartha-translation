base_translation:
  language: en
  yaml_path: translation/ot/judges/021/013.yaml
  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: zh_hans
  text: 于是，全会众派人去，对在临门磐石[a]的便雅悯子孙说话，向他们宣告和平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西拉·临门”。希伯来语既可理解为描述性的“临门磐石”，也可理解为一个固定地名。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: 派人去
  rationale: 该动词本义为“差派、派遣”。下文紧接“对……说话”，语境表明会众派出人员传话；“派人去”在现代汉语中自然，同时不把未明说的人员具体化为“使者”或“使臣”。
- source_word: כָּל הָעֵדָה
  choice: 全会众
  rationale: עֵדָה指以色列共同体或其集会；“全会众”既反映כָּל“全部”，也保留群体性称谓。
- source_word: וַיְדַבְּרוּ אֶל
  choice: 对……说话
  rationale: 直接对应常见结构דבר אל，并保留原文较概括的表达，不另行补出具体话语内容。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯子孙
  rationale: 保留原文“便雅悯的众子”这一亲族—支派表达；“子孙”符合现代中文圣经叙事语体，也不将其泛化为仅仅地域性的居民。
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: 在临门磐石
  rationale: סֶלַע可指磐石、岩堡，רִמּוֹן为专名“临门”。正文采用可理解为描述性地名的“临门磐石”；固定地名“西拉·临门”的可能性收入脚注。介词ב在地点语境中自然译为“在”。
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: 向他们宣告和平
  rationale: קרא在此与间接受词及שָׁלוֹם连用，表示正式传达或宣布恢复和平关系。“宣告和平”保留公开、正式的语气，而不将其解释性扩展为具体的和平条款。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: 此处指敌对状态结束及双方恢复和平关系，而非单指个人安康；“和平”准确且简明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“于是”承接前文连续叙事；“派人去”自然表达派遣传话的语境，但不把原文未明说的对象过度具体化。正文与脚注共同保留סֶלַע רִמּוֹן在普通名词短语和固定地名之间的歧义。
