  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: zh_hans
  text: 那时，以色列中没有王；各人都做自己眼中看为正的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 那时
  rationale: 这是叙事中常见的回顾性时间表达；“那时”简洁自然，并准确保留原文的时间框架。
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: 以色列中没有王
  rationale: אֵין构成存在否定；此译法自然表达以色列当时没有君王的政治状况。
- source_word: אִישׁ
  choice: 各人
  rationale: 原文为阳性单数名词，在这里作分配性用法，意为每一个人；现代汉语“各人”既保留个体分配意味，也不产生不必要的性别限定。
- source_word: הַיָּשָׁר
  choice: 看为正的事
  rationale: 带冠词的形容词在此名词化，指“正的事”；与“眼中”合译为“眼中看为正的事”，符合现代汉语习惯。
- source_word: בְּעֵינָיו
  choice: 自己眼中
  rationale: 保留希伯来语“在他眼中”的主观判断习语；“自己”明确其反身和个人判断色彩。
- source_word: יַעֲשֶׂה
  choice: 都做
  rationale: 未完成式在这段总结性叙述中表达过去惯常的行为；汉语结合“那时”和“都做”即可自然传达这一概括性、习惯性意义。
theological_decisions:
- issue: אִישׁ的阳性单数代表性表达
  choice: 译作“各人”
  alternative: “各个男人”或“每个人”
  rationale: 这里的阳性单数是分配性用法，焦点在人人各自行事，并非专门排除女性。“各人”忠实传达语法功能，同时保持庄重自然。
- issue: 经文对当时行为的隐含评价
  choice: 保留“自己眼中看为正”的原有措辞，不增添解释性贬义词
  alternative: “任意而行”或“想做什么就做什么”
  rationale: 上下文可能使这句话带有负面评价，但原文本身没有明说“任意”或“随心所欲”；译文不应把隐含判断强化为明说。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。分号保留两分句之间的紧密解释关系；第二句呈现没有王时人人按自身判断行事的概括。
