  text: וַ/יִּתְהַלְּכ֨וּ מִ/שָּׁ֤ם בְּנֵֽי יִשְׂרָאֵל֙ בָּ/עֵ֣ת הַ/הִ֔יא אִ֥ישׁ לְ/שִׁבְט֖/וֹ וּ/לְ/מִשְׁפַּחְתּ֑/וֹ וַ/יֵּצְא֣וּ מִ/שָּׁ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: zh_hans
  text: 那时，以色列人从那里各自散去，各归本支派、本宗族[a]。他们离开那里，各归自己的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家族”；希伯来语所指的亲属群体可能比现代所说的核心家庭更广。
    reason: lexical_alternative
  - marker: b
    text: 或译“所得的份地”；这里的“产业”指各人在以色列境内世代承受的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: 各自散去
  rationale: 此处התהלך并非着重步行方式，而是指众人从聚集处分别离去；“各自散去”也与后面的分配性短语“各归”自然衔接。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语中自然、准确的族群称谓；在本叙事语境中无需按字面译作“以色列的众子”。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 简洁保留希伯来文的时间标记，符合现代汉语叙事习惯。
- source_word: אִישׁ
  choice: 各
  rationale: אִישׁ在两处均作分配性用法；汉语用“各”可准确表达“每一个人”，避免生硬重复“各人”。
- source_word: לְשִׁבְטוֹ
  choice: 各归本支派
  rationale: “支派”是以色列社会结构中שֵׁבֶט的通行准确译法；“本”自然表达其所属关系。
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: 本宗族
  rationale: מִשְׁפָּחָה在此很可能指比现代核心家庭更广的亲属群体；“宗族”较准确呈现这一社会单位。
- source_word: וַיֵּצְאוּ
  choice: 他们离开那里
  rationale: 保留第二个离去动词及重复的“从那里”意涵，但按现代汉语表达为“离开那里”，不擅自补入“返回”。
- source_word: לְנַחֲלָתוֹ
  choice: 各归自己的产业
  rationale: נַחֲלָה指承袭所得的份地或产业；正文用“产业”保留法律与承继色彩，脚注说明此处主要关乎土地。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“各归”两次出现，以呈现原文אִישׁ的分配性强调；同时保留原文两个离去动词的推进与一定程度的重复。脚注标记置于其实际解释的词语之后，而不是沿用英文咨询层中位置错置的标记。
