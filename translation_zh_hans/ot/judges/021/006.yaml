base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: zh_hans
  text: 以色列人因他们的弟兄便雅悯而悲痛[a]，说：“今天，以色列中有一个支派被砍断了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“怜悯他们的弟兄便雅悯”，或“为他们的弟兄便雅悯感到难过”。希伯来语这个动词可按语境表达哀伤、怜悯，或改变心意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: 悲痛
  rationale: 该动词在此处可表达哀伤、怜悯或懊悔；结合便雅悯几乎灭族的上下文，“悲痛”自然传达以色列人的哀伤，同时以脚注保留其他可能含义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，但现代普通话中“以色列人”更自然清楚，也保留其群体含义。
- source_word: אֶל בִּנְיָמִן אָחִיו
  choice: 因他们的弟兄便雅悯
  rationale: 介词与 נחם 连用时标明哀伤或怜悯的对象；“因……而悲痛”符合现代汉语。单数“他的弟兄”随复数集体主语表达群体亲属关系，故译为“他们的弟兄”。
- source_word: נִגְדַּע
  choice: 被砍断了
  rationale: 保留 גדע“砍下、砍断”的强烈比喻及被动语态，不把它过度解释为已经完全灭绝。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 自然、直接地传达时间副词及话语中的即时感。
- source_word: שֵׁבֶט אֶחָד
  choice: 一个支派
  rationale: 准确表达以色列整体中的一个部族单位。
- source_word: מִיִּשְׂרָאֵל
  choice: 以色列中
  rationale: 在汉语中自然表达从以色列整体中被割除的分离关系。
