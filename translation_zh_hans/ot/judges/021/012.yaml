base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: zh_hans
  text: 他们从基列雅比的居民中找到四百名年轻女子，都是处女，未曾与男人同寝。他们把她们带到迦南地示罗的营中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: 从基列雅比的居民中
  rationale: 保留介词מִן所表达的来源或范围，并采用现代汉语常用地名“基列雅比”。
- source_word: נַעֲרָה בְתוּלָה
  choice: 年轻女子，都是处女
  rationale: 分别表达נַעֲרָה的年龄与性别含义，以及בְתוּלָה的处女身份，避免将两词压缩而损失信息。
- source_word: אֲשֶׁר לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: 未曾与男人同寝
  rationale: 这是表示从未发生性关系的希伯来语委婉表达；“同寝”在现代庄重汉语中自然明确，又不作不必要的露骨扩写。
- source_word: הַמַּחֲנֶה שִׁלֹה
  choice: 示罗的营中
  rationale: 按句法将“示罗”理解为营地所在地点，以自然汉语表达；下句进一步说明示罗位于迦南地。
