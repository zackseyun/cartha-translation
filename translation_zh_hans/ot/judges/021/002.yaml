base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: zh_hans
  text: 众人来到伯特利，在上帝面前坐在那里，直到晚上；他们放声大哭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“哭了极大的哭”；希伯来语用同根词结构加强哭泣的程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 该动词在此叙述众人抵达一个地点；“来到”自然表达抵达之意，又不像“进入”那样增添原文没有明说的细节。
- source_word: הָעָם
  choice: 众人
  rationale: 此处指聚集的以色列民众整体，并非专指军队；“众人”符合本段具体场景，也比“人民”更自然。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 此处是地名 Bethel，采用现代中文圣经通行音译，不译作普通名词短语“上帝的殿”。
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: 坐在那里
  rationale: ישׁב 可表示坐、居住或停留；此处保留具体的身体姿态“坐”，同时由“直到晚上”体现持续性。
- source_word: עַד הָעֶרֶב
  choice: 直到晚上
  rationale: 直接、自然地表达时间终点。
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: 在上帝面前
  rationale: 保留原文的临在表达，并按 הָאֱלֹהִים 译为“上帝”，不改作“耶和华”。
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: 放声
  rationale: 希伯来语字面为“举起他们的声音”，在哭泣语境中，现代汉语“放声”自然表达声音高扬、公开哭号的含义。
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: 大哭
  rationale: 原文以同根名词加强“哭”的程度；“大哭”简洁自然地传达强化意义，而不擅自限定为悲苦、响亮等某一种具体情态。
theological_decisions:
- issue: 敬拜场景中 הָאֱלֹהִים 的译法
  choice: 上帝
  alternative: 耶和华
  rationale: 马所拉文本此处使用 הָאֱלֹהִים，而非神名 יהוה；即使语境涉及敬拜，也不应与别处经文协调而换成“耶和华”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“放声大哭”自然整合两个连续的希伯来语表达；脚注说明原文同根词的强化结构。正文中的分号保留抵达、静坐与哭泣之间的叙事推进。
