  text: וַ/אֲנַ֗חְנוּ לֹ֥א נוּכַ֛ל לָ/תֵת לָ/הֶ֥ם נָשִׁ֖ים מִ/בְּנוֹתֵ֑י/נוּ כִּֽי נִשְׁבְּע֤וּ בְנֵֽי יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אָר֕וּר נֹתֵ֥ן אִשָּׁ֖ה לְ/בִנְיָמִֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: zh_hans
  text: 可是，我们不能把自己的女儿嫁给他们为妻，因为以色列人曾起誓说：“凡把女子嫁给便雅悯[a]的，必受咒诅！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “便雅悯”也可更明确地译作“便雅悯支派”或“便雅悯人”；希伯来文直接使用支派名“便雅悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: 可是，我们
  rationale: 连词与独立代词共同突出说话者，并转入与前述方案形成张力的限制；“可是，我们”自然保留这种对比和强调。
- source_word: לֹא נוּכַל
  choice: 不能
  rationale: יכל直接表示能力或可能性；这里的不能源于誓言约束，但原文没有明说“依法不能”，故不增译。
- source_word: לָתֵת לָהֶם נָשִׁים
  choice: 把妻子给他们
  rationale: נתן加间接受词表示“给他们”，נָשִׁים在婚配语境中明确指妻子，而非泛指女人。
- source_word: מִבְּנוֹתֵינוּ
  choice: 从自己的女儿中
  rationale: מן表示来源；“自己的”对应第一人称复数所属关系，“中”使现代汉语表达自然。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出不能这样做的理由。
- source_word: נִשְׁבְּעוּ
  choice: 曾起誓
  rationale: שׁבע的Niphal表示起誓；“曾”说明誓言先前立下，同时上下文显示其效力仍在。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定民族称谓在现代汉语中自然译为“以色列人”；语境所指为参与集体誓言的以色列群体。
- source_word: לֵאמֹר
  choice: 说
  rationale: 标准引语标记，在汉语中用“说”自然引出誓言内容。
- source_word: אָרוּר
  choice: 必受咒诅
  rationale: 该词表示处于咒诅之下；“必受咒诅”以庄重而清楚的现代汉语表达誓言中的判定。
- source_word: נֹתֵן אִשָּׁה
  choice: 把妻子给……的
  rationale: 分词在此泛指任何这样做的人；汉语“……的”保留其概括性，且按婚配语境将אִשָּׁה译为“妻子”。
- source_word: לְבִנְיָמִן
  choice: 给便雅悯
  rationale: 原文直接使用支派名“便雅悯”；正文保留这种简洁的集合称呼，不擅自明确为支派或支派成员。
theological_decisions:
- issue: 誓言所导致的“不能”属于能力陈述还是律法判断
  choice: 译作“不能”，保留原文的直接表述
  alternative: 译作“不可”或“按誓言不能”
  rationale: 上下文表明限制来自誓言，但לֹא נוּכַל字面表达不能或无法；译文不额外判定其律法性质或正当性。
- issue: “便雅悯”的指称范围
  choice: 正文保留支派名“便雅悯”
  alternative: 明确译作“便雅悯支派”或“便雅悯人”
  rationale: 原文以专名集合性地指称便雅悯，可能着眼于支派整体，也可落实到该支派男子；正文保留这种紧凑表达，并用脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“妻子”准确体现婚配语境；引语以“必受咒诅”保留誓言的严肃司法色彩。脚注标记置于与歧义直接相关的“他们”之后，说明后文“便雅悯”的集合性用法。
