  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: zh_hans
  text: 以色列人在米斯巴曾起誓说：“我们中间谁也不可把女儿嫁给便雅悯人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“给便雅悯”，可指便雅悯支派整体，也可指该支派中的一个男子。
    reason: 保留专名作为集体称谓或个体称谓的词义范围。
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: 以色列人
  rationale: אִישׁ 虽为单数形式，在这里却具有集合意义，指以色列众人；现代汉语用“以色列人”自然传达这一群体含义。句首 וְ 是叙事衔接词，本节在中文中无需机械译作“并且”或“现在”。
- source_word: נִשְׁבַּע
  choice: 曾起誓
  rationale: 该词意为“起誓”；结合上下文，这誓言早于本节随后叙述的事件，因此以“曾”表明先前发生，同时保持叙事自然。
- source_word: בַּמִּצְפָּה
  choice: 在米斯巴
  rationale: 介词 בְּ 与地名连用，在此表示起誓的地点。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出誓言内容的常用希伯来语引语公式，中文直接译为“说”最自然。
- source_word: אִישׁ מִמֶּנּוּ
  choice: 我们中间谁也
  rationale: 原文直译近于“我们中间的任何一个男人”；在否定誓言中表示无一人例外。“谁也”自然表达逐一涵盖的否定范围，而上下文已清楚涉及把自己的女儿嫁出的人。
- source_word: לֹא יִתֵּן בִּתּוֹ
  choice: 不可把女儿嫁给
  rationale: 否定未完成式在誓言中表达有约束力的禁令或承诺；“不可”保留其严肃语气。“把女儿嫁给”准确表达婚配语境中的“给出他的女儿”。
- source_word: לְבִנְיָמִן
  choice: 给便雅悯人
  rationale: 专名“便雅悯”在此可代指整个支派，也可落实到该支派中的男子。正文用“便雅悯人”符合现代汉语婚嫁表达，脚注保留原文的范围可能性。
- source_word: לְאִשָּׁה
  choice: 嫁给
  rationale: 该结构意为使女子成为某人的妻子；现代汉语“嫁给”已自然包含“给……为妻”的含义，避免生硬直译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“曾起誓”交代誓言相对于后续事件的先时性；引语中的“不可”保留誓言的约束力。脚注标记置于“便雅悯人”之后，因为脚注解释的是 לְבִנְיָמִן，而不是地点“米斯巴”。
