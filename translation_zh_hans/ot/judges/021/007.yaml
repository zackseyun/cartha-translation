base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: zh_hans
  text: “我们该怎样为他们——那些余下的人——找妻子呢？[a] 我们已经凭雅威[b]起誓，不把我们中任何一个女儿嫁给他们为妻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“为妻子”；此处按上下文补出“找”。
    reason: lexical_alternative
  - marker: b
    text: 原文为神名“雅威”（YHWH）；“耶和华”是常见的传统译法。
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָהֶם
  choice: 我们该怎样为他们……解决……的事呢
  rationale: מַה与第一人称复数未完成式表达共同商议、寻求对策；“该怎样”保留这种斟酌语气。לָהֶם表示为他们的益处采取行动。
- source_word: לַנּוֹתָרִים
  choice: 就是为那些余下的人
  rationale: 分词指便雅悯中余下的男子；“那些余下的人”贴近词形，也保留“幸存者”这一可由上下文推知而非词面明说的含义。
- source_word: לְנָשִׁים
  choice: 解决娶妻的事
  rationale: 原文仅作“为妻子”，是省略表达；现代汉语需补出关系。“解决娶妻的事”自然表达上下文所指，同时以脚注注明原文的简略形式。
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ בַיהוָה
  choice: 我们已经指着耶和华起誓
  rationale: 完成式表示先前所起而仍具约束力的誓；ב在起誓句式中表示凭借神的名，“指着……起誓”是自然庄重的汉语。
- source_word: לְבִלְתִּי תֵּת לָהֶם מִבְּנוֹתֵינוּ לְנָשִׁים
  choice: 不把自己的女儿嫁给他们为妻
  rationale: לְבִלְתִּי תֵּת说明誓言的内容；מן具有部分含义。汉语“把自己的女儿嫁给他们为妻”准确表达从众人的女儿中不给任何一人作妻子的意思。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者最熟悉、且作为专名使用的“耶和华”；脚注提示另一种较接近学界常见拟音的译法，不以“主”替代原文神名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“他们，就是那些余下的人”的同位说明，以反映原文先用代词、后加限定语的结构；首句对省略成分作最低限度的显明，并用脚注交代。
