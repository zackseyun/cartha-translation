  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: zh_hans
  text: 他们说：“雅威，以色列的神啊，为什么以色列中竟发生了这样的事[a]，以致今天以色列少了一个支派[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发生了这样的事”直译可作“这事在以色列竟是如此（或：成了这样）”；这是表示事情发生的希伯来语说法。
    reason: 说明 הָיְתָה זֹּאת בְּיִשְׂרָאֵל 的惯用表达及较直译法。
  - marker: b
    text: “少了”也可译为“缺了”或“有一个支派不见了”；原词在这里表示从整体中缺席。
    reason: 保留 לְהִפָּקֵד 在此处“缺席、短少”的词义幅度。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 未完成式连续体承接前文叙事；汉语用“他们说”自然推进情节，无须额外加入时间副词。
- source_word: לָמָה
  choice: 为什么
  rationale: 直接表达哀叹式询问，符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 清楚表达附属结构，并在呼语中保持自然、庄重。
- source_word: הָיְתָה זֹּאת
  choice: 竟发生了这样的事
  rationale: 字面为“这事存在／成为”；语境所指是已经发生的惨剧。“发生了这样的事”传达该惯用义，“竟”体现哀叹和震惊语气。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列中
  rationale: 兼顾地点与群体含义，指这事发生在以色列共同体之中。
- source_word: לְהִפָּקֵד
  choice: 少了
  rationale: פקד的尼法勒不定式在此表示从整体中缺席、短少；“少了”在汉语中简洁自然，也符合支派将从以色列整体中缺失的语境。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 保留原文明确的时间强调。
- source_word: מִיִּשְׂרָאֵל
  choice: 以色列少了
  rationale: מן表示从以色列这一整体中分离或缺失；汉语以“以色列少了……”自然表达。
- source_word: שֵׁבֶט אֶחָד
  choice: 一个支派
  rationale: 直接指以色列的一个部族单位，措辞通俗而准确。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，而非“主”这一称号；“雅威”按通行学术重构音译，可让读者看出这是专名，同时避免以称号消解原文。
- issue: 百姓向神发问是否暗示神造成此事
  choice: 保留“为什么……竟发生”的开放问法
  alternative: 译成“你为什么使这事发生”
  rationale: 原文只询问为何此事在以色列发生，并未明说雅威是直接施事者；译文不补入原文没有的因果判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。呼语用破折号连接神名与同位语；“竟”传达集体哀叹中的震惊，但不增加神直接致使灾祸的含义。两个脚注标记均置于其所解释的正文措辞之后。
