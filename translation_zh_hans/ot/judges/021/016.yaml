  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: zh_hans
  text: 会众的长老说：“便雅悯的妇女既然已经灭绝了，我们该怎样给那些剩下的人找妻子呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“因为便雅悯的一个女子已经灭绝了”；单数“女子”在这里集合性地指便雅悯的妇女。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: 会众的长老
  rationale: “长老”为构造复数；הָעֵדָה指聚集的群体。“会众”自然保留其整体、集体含义，又不赋予现代政治组织色彩。
- source_word: מַה נַּעֲשֶׂה
  choice: 我们该怎样……呢
  rationale: 疑问词加第一人称复数未完成式表达共同商议下一步行动；此译法符合现代汉语的商议语气。
- source_word: לַנּוֹתָרִים
  choice: 为那些剩下的人
  rationale: 保留分词“剩下的”之意，指灾难后尚存的人；不直接译作“幸存者”，以避免增加原文未明说的解释色彩。
- source_word: לְנָשִׁים
  choice: 娶妻
  rationale: 上下文中的复数“女人”带有婚姻用途，意为给剩下的便雅悯人安排妻子；汉语以“为……娶妻”表达最自然。
- source_word: כִּי
  choice: 既然
  rationale: 此处引出造成难题的既成原因；“既然……该怎样……”既保留因果关系，也契合汉语商议句式。
- source_word: נִשְׁמְדָה
  choice: 已经灭绝了
  rationale: שׁמד的尼法勒式表示遭毁灭、被除灭；“灭绝”保留措辞的严重程度。
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: 便雅悯的妇女
  rationale: 原文直译近似“从便雅悯，一个女人”，其中单数אִשָּׁה在此作集合用法；正文按现代汉语译为复数集合意义，并以脚注说明形式特点。
