  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: zh_hans
  text: 他们说：“便雅悯的余民必须有产业[a]，免得以色列中有一个支派被抹去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“便雅悯必须有余民承受产业”，或“必须给便雅悯的余民留下产业”。希伯来文把“产业”“余民”和“给便雅悯”紧密并列，几个词之间的确切关系可以有不止一种理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 未完成式连续体在叙事中引出众人的话；“他们说”自然承接上文，不额外强调时间先后。
- source_word: יְרֻשַּׁת
  choice: 产业
  rationale: 该词指承受而来的土地或世袭份额；本段关乎支派土地与延续，“产业”准确且符合现代中文圣经语体。
- source_word: פְּלֵיטָה
  choice: 余民
  rationale: 指灾祸后逃脱而存留的人；这里特指几乎被灭绝后仍存留的便雅悯人。“余民”保留其集合名词色彩。
- source_word: לְבִנְיָמִן
  choice: 便雅悯的
  rationale: 介词 לְ 表明与便雅悯的归属或受益关系；结合上下文，译作“便雅悯的余民”最自然，但以脚注保留原文紧凑结构可能产生的其他理解。
- source_word: וְלֹא יִמָּחֶה
  choice: 免得……被抹去
  rationale: מחה 的尼法勒式表示被擦除、被消灭；“被抹去”保留原文意象，“免得”按语境表达前后分句的目的关系。
- source_word: שֵׁבֶט
  choice: 一个支派
  rationale: 这里指以色列各支派中的一个；原文无定冠词，译作“一个支派”恰当。
- source_word: מִיִּשְׂרָאֵל
  choice: 以色列中
  rationale: 介词 מִן 表示从某一群体中除去；中文以“以色列中……被抹去”自然表达该分离意义。
