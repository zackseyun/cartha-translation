  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: zh_hans
  text: 你们要留意：看哪，示罗的女子若出来跳舞，你们就从葡萄园里出来，各自从示罗的女子中抢一个作妻子[a]，然后往便雅悯地去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抢”也可译作“夺走”或“掳走”；希伯来语动词表示强行夺取。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: 你们要留意
  rationale: 该形式字面为“你们要看”，在这一连串指示中带有命令意味；译作“留意”自然地表达伏候观察的语境。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意的语篇标记，并维持叙述的现场感。
- source_word: אִם
  choice: 若
  rationale: 保留该词形式上的条件意味；虽然计划中的情景也可理解为“当……时”，但“若”没有把这种张力消除。
- source_word: בְנוֹת שִׁילוֹ
  choice: 示罗的女子
  rationale: “女子”在现代汉语中比直译“女儿们”更自然，同时不武断限定年龄。
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: 成群跳舞
  rationale: 动词和复数名词共同描写集体舞蹈；“成群跳舞”在中文中自然，也不额外断定是圆圈舞。
- source_word: וִיצָאתֶם מִן הַכְּרָמִים
  choice: 你们就从葡萄园里出来
  rationale: 准确表达他们从葡萄园中的藏身处出来，并以“就”连接前面的条件。
- source_word: וַחֲטַפְתֶּם
  choice: 抢
  rationale: 该动词表示迅猛而带强制性的夺取。“抢”简洁明确地保留其暴力色彩，又不在正文中加入现代法律术语。
- source_word: לָכֶם אִישׁ אִשְׁתּוֹ
  choice: 各自……抢一个作妻子
  rationale: 以自然现代汉语表达“每人给自己一个妻子”的逐一分配意味。
- source_word: מִבְּנוֹת שִׁילוֹ
  choice: 从示罗的女子中
  rationale: “从……中”明确表达从这一群体中选取的含义。
- source_word: וַהֲלַכְתֶּם אֶרֶץ בִּנְיָמִן
  choice: 然后回便雅悯地去
  rationale: “去便雅悯地”是形式上更直接的译法；结合说话对象来自便雅悯及当前身在示罗附近的语境，“回……去”是自然且语境充分支持的汉语表达。
theological_decisions:
- issue: 按男性个体逐一分配的措辞
  choice: 各自……抢一个作妻子
  alternative: 每人抢一个妻子
  rationale: 原文 אִישׁ אִשְׁתּוֹ 具有明确的逐一分配结构。“各自……一个”既保留这一点，也符合现代汉语表达。
- issue: 对强夺女子行为的道德描述
  choice: 抢一个作妻子
  alternative: 掳走一个作妻子／绑架一个作妻子
  rationale: 译文应如实呈现 חטף 的强制性，却不把现代法律分类直接写入正文。“抢”明确而不淡化暴力；脚注列出更强的可能表达，以便读者查核。
- issue: 条件还是时间关系
  choice: 若……就……
  alternative: 当……时，就……
  rationale: אִם 在形式上是条件词，而上下文所计划的事件又很可能发生。正文保留“若”，不把这种条件与预期之间的张力静默消除。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“看哪”保留经文的提示语气；其余句式尽量避免生硬欧化。“成群跳舞”传达复数舞蹈活动，但不把舞蹈形式过度具体化。
