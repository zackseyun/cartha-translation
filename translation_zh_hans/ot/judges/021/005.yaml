revisions:
- from: 以色列人[a]说：“以色列各支派中，有谁没有随会众上到雅威[b]那里呢？”因为他们曾起过大誓，凡不上米斯巴到雅威那里的人，必被处死。
  to: 以色列人[a]说：“以色列各支派中，有谁没有到雅威[b]那里参加会众集会呢？”因为曾有一项大誓：凡没有上到米斯巴、到雅威那里的人，必被处死。
  rationale: 修订首句，使“会众”明确为参加的集会，而非同行者；修订末句的语序和标点，明确誓言的内容，并使米斯巴这一聚集地点与“到雅威那里”的表达在现代汉语中可读。保留原文的提问、重大誓言、地点、神名及处死宣告，未额外加入教义性解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:53Z'
review_pass:
  verdict: revise
  source_fidelity: 首句“随会众上到”将בַקָּהָל较自然地处理为“随同会众”，但原文更直接指在会众集会中上到雅威那里；可改为“到雅威那里参加会众集会”。后句草稿“凡不上米斯巴到雅威那里的人”在汉语中地名与“到雅威那里”的关系不清，且“上”所表达的赴集会之意未得到顺畅保留。应明确米斯巴是这次到雅威那里聚集的地点。
  naturalness: “以色列人说”和“大誓”“必被处死”庄重、现代且合宜。修订后以“曾有一项大誓”承接原文的背景性完成时，并以破折号引出誓言内容，使汉语句法清晰。
  terminology: “以色列人”是בְּנֵי יִשְׂרָאֵל在现代汉语中的恰当集体称谓；脚注保留字面形式即可。“雅威”一致对应יהוה。“会众集会”避免把קהל误作后世教会，同时表达其集会意义。“必被处死”保留מוֹת יוּמָת的强化及被动司法语气。
  issues:
  - severity: medium
    issue: “随会众上到”未准确清晰表达בַקָּהָל的集会语境。
    rationale: “随”容易侧重与他人同行，而原文所问的是谁没有在会众集会中上到雅威那里。以“参加会众集会”在汉语中更清楚地传达这一功能。
  - severity: medium
    issue: “凡不上米斯巴到雅威那里的人”句法不通顺，米斯巴与雅威之间的地点关系含混。
    rationale: 原文此处是到雅威那里、地点在米斯巴；汉语需要将地点关系明确表达，避免读者误解为两个未加连接的目的地。
  revised_text: 以色列人[a]说：“以色列各支派中，有谁没有到雅威[b]那里参加会众集会呢？”因为曾有一项大誓：凡没有上到米斯巴、到雅威那里的人，必被处死。
