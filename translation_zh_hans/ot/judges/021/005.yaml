  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: zh_hans
  text: 以色列人[a]说：“以色列各支派中，有谁没有到雅威[b]那里参加会众集会呢？”因为曾有一项大誓：凡没有上到米斯巴、到雅威那里的人，必被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“以色列的众子”。
    reason: 说明希伯来语集体称谓的字面形式。
  - marker: b
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译。
    reason: 说明正文保留了神的专名，而非以称号替代。
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该群体称谓最自然、准确的表达；脚注保留其字面形式“以色列的众子”。
- source_word: מִי אֲשֶׁר
  choice: 有谁
  rationale: 自然表达带关系从句含义的身份询问，不额外限定所问对象是个人还是群体。
- source_word: לֹא עָלָה בַקָּהָל
  choice: 没有随会众上到
  rationale: “上到”保留עלה的方向意味，“随会众”自然体现בַקָּהָל所指的集会参与情境，同时避免把קהל教会化。
- source_word: אֶל יְהוָה
  choice: 到雅威那里
  rationale: 保留介词אֶל的趋向意义，不改译为解释性较强的“在雅威面前”或“朝见雅威”。
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: 大誓
  rationale: 直接保留名词和形容词的组合，也体现这誓言的重大分量，不把“重大”“严厉”或“庄严”等具体含义强加给原文。
- source_word: הָיְתָה לַאֲשֶׁר
  choice: 凡……的人
  rationale: 用自然汉语表达誓言所针对的一切违犯者；不把介词结构过度具体化。
- source_word: הַמִּצְפָּה
  choice: 米斯巴
  rationale: 按常用音译处理该地名；希伯来语定冠词不需在汉语地名中另译。
- source_word: מוֹת יוּמָת
  choice: 必被处死
  rationale: 既体现不定式绝对式所加强的确定语气，也保留被动、司法处决的语境含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名YHWH；“雅威”作为现代汉语音译，保留其专名性质。“主”会以称号代替名字，“耶和华”则反映较晚形成的混合读音。
- issue: בְּנֵי יִשְׂרָאֵל的群体性别表达
  choice: 正文作“以色列人”，脚注注明字面形式
  alternative: 以色列的众子；以色列子民
  rationale: 此处是对整个民族的惯用集体称谓。正文采用自然现代汉语，不暗示只有男性；脚注则使读者看见原文的阳性亲属称谓。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“随会众上到”兼顾希伯来语结构与汉语可读性；“大誓”刻意保留原文较宽泛的力度表达；末句简洁有力，符合誓言中的司法宣告。
