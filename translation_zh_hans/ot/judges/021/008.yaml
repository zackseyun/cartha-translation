  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: zh_hans
  text: 他们说：“以色列各支派中，哪一个没有上到米斯巴去朝见耶和华[a]？”看哪，基列雅比没有一个人来到营地，参加聚会[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有上到米斯巴，在耶和华面前？”希伯来语可理解为在米斯巴的聚会地点朝见耶和华。
    reason: alternative_reading
  - marker: b
    text: 希伯来语直译“没有一个男人”；阳性单数强调基列雅比没有任何一个人到场。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们说
  rationale: 以简洁的叙事承接语推进情节；汉语无需机械添加“于是”或“并且”。
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派中，哪一个
  rationale: 保留介词所表达的集合中选择关系，也保留 אֶחָד 对单一支派的聚焦。
- source_word: לֹא עָלָה
  choice: 没有上
  rationale: 保留 עלה 在前往聚集地点或圣所语境中的“上去”意味，同时采用现代汉语可理解的表达。
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: 上米斯巴到耶和华那里去
  rationale: 既呈现米斯巴这一目的地，也尽量直译 אֶל יְהוָה 的趋向关系，不在正文中把它完全解释为“朝见”；另一种句法理解列入脚注。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留叙事中引出意外发现、提醒读者注意的语用力量。
- source_word: לֹא בָא אִישׁ
  choice: 连一个人也没有来到
  rationale: 用自然汉语表达否定词与单数 אִישׁ 所形成的逐一排除和强调：没有任何一个人到场。
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: 基列的雅比
  rationale: 按现代中文圣经地名的常见构式表达该城名，并清楚标明其与基列地区的关系。
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: 来到营地，参加大会
  rationale: 前一短语表明到达以色列人的营地，后一短语说明参与聚集的群体；用汉语并列结构传达二者关系，避免生硬重复“到”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代简体中文读者最熟悉且能明确指向四字神名的“耶和华”；不以“主”替代专名，也不借此加入宗派性解释。
- issue: אֶל יְהוָה 的关系
  choice: 到耶和华那里去
  alternative: 在耶和华面前／朝见耶和华
  rationale: 正文保留介词 אֶל 的趋向性；脚注说明该语境也可理解为在米斯巴来到耶和华面前，不强行消除原文的句法张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”略带经文叙事色彩，用来保留 וְהִנֵּה 的提示和惊异功能；其余句式避免文言化。
