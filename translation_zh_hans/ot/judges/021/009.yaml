base_translation:
  language: en
  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: zh_hans
  text: 百姓被点名清查[a]；看哪，基列·雅比的居民中没有一人在那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓被数点”或“百姓被召集清点”。这里指对聚集的人进行点名或核查。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“那里没有一个男人”。这种阳性措辞可能反映当时按男性代表或战士点名的背景。
    reason: lexical_note
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: 接受点名清查
  rationale: 该词在这里指对聚集的百姓进行点名、核查名册；结合上下文，重点是清查后发现某城无人到场。“接受点名清查”既保留其被查点的意味，也符合军事或全体集会的语境。
- source_word: הָעָם
  choice: 百姓
  rationale: עָם通常指“百姓、人民”。此处虽有军事背景，却指聚集的以色列群体，不宜过度限定为“军队”。
- source_word: וְהִנֵּה
  choice: 看哪，竟
  rationale: הִנֵּה引导叙事中的突然发现。“看哪”保留原文鲜明的提示语气，“竟”使现代汉语自然地表达出发现时的意外感。
- source_word: אֵין שָׁם אִישׁ
  choice: 竟没有一人在那里
  rationale: 原文直译为“那里没有一个男人”。在本节点名代表或战士的语境中，男性单数可能具有具体或代表性意义；正文采用自然的“一人”，并以脚注保存原文阳性措辞。
- source_word: מִיּוֹשְׁבֵי
  choice: 居民中
  rationale: ישב的分词形式指居住在某地的人。结合介词מִן，此处译为“居民中”，自然表达无人来自该城。
- source_word: יָבֵשׁ גִּלְעָד
  choice: 基列·雅比
  rationale: 这是地名，采用现代中文圣经中清楚自然的音译形式；间隔号表明“基列·雅比”是一个复合地名。
