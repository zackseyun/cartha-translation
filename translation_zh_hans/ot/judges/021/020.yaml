  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: zh_hans
  text: 便吩咐便雅悯人[a]说：“你们去，在葡萄园中埋伏。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“便雅悯的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 他们吩咐
  rationale: צוה表示“吩咐、命令、嘱咐”；这里按所给马所拉文本的复数主语形态译为“他们”，并以自然而庄重的“吩咐”表达其权威性。
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: 便雅悯人
  rationale: 原文直译为“便雅悯的众子”，在此指便雅悯支派的人；正文采用现代汉语更自然的族群称谓，并以脚注保留希伯来语的亲属表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常用希伯来语形式；汉语用“说”自然衔接下文。
- source_word: לְכוּ
  choice: 你们去
  rationale: 复数命令式；补出“你们”可清楚传达受命者为复数。
- source_word: וַאֲרַבְתֶּם
  choice: 埋伏
  rationale: ארב意为隐藏等候、伺机行动；在前一命令式之后继续按命令语气理解，译作“埋伏”简洁准确。
- source_word: בַּכְּרָמִים
  choice: 在葡萄园里
  rationale: כְּרָמִים为“葡萄园”的复数，介词ב在本语境表示所在地点；汉语以集合性的“葡萄园里”表达自然。
