base_translation:
  language: en
  yaml_path: translation/ot/judges/021/015.yaml
  text: And the people grieved for Benjamin, because the LORD had made a breach among the tribes of Israel.
translation:
  language: zh_hans
  text: 百姓为便雅悯悲痛，因为耶和华使以色列众支派中有了一个缺口。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם לְבִנְיָמִן
  choice: 为便雅悯悲痛
  rationale: 这里的 נִחָם 表达因便雅悯支派所遭遇之事而哀痛、痛惜；译作“悲痛”既符合上下文，也不把含义限定为单纯的怜悯。
- source_word: פֶּרֶץ
  choice: 缺口
  rationale: 该词本义指破口、裂口；此处比喻以色列支派整体因便雅悯几乎灭绝而出现残缺。保留“缺口”的形象，也保留原文的力度。
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列众支派
  rationale: 准确表达复数“以色列的各支派”，并用现代汉语自然的“众支派”呈现整体范围。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，区别于一般称谓“主”。
theological_decisions:
- issue: 缺口的施动者
  choice: 直译为“耶和华使……有了一个缺口”
  alternative: “以色列众支派中出现了一个缺口”
  rationale: 原文明确以耶和华为 עָשָׂה 的主语。译文保留这一神学张力，不因前文中人的暴力行为而弱化或改写神的主权性表述。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“缺口”这一具体比喻，不展开解释为“少了一个支派”，以免消除原文意象。
