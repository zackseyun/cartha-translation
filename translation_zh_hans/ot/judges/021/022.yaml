source:
  edition: WLC
  text: וְ/הָיָ֡ה כִּֽי יָבֹ֣אוּ אֲבוֹתָ/ם֩ א֨וֹ אֲחֵי/הֶ֜ם ל/רוב אֵלֵ֗י/נוּ וְ/אָמַ֤רְנוּ אֲלֵי/הֶם֙ חָנּ֣וּ/נוּ אוֹתָ֔/ם כִּ֣י לֹ֥א לָקַ֛חְנוּ אִ֥ישׁ אִשְׁתּ֖/וֹ בַּ/מִּלְחָמָ֑ה כִּ֣י לֹ֥א אַתֶּ֛ם נְתַתֶּ֥ם לָ/הֶ֖ם כָּ/עֵ֥ת תֶּאְשָֽׁמוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: zh_hans
  text: 他们的父亲或兄弟若来同我们争辩[a]，我们就对他们说：‘求你们因着她们恩待我们[b]，因为我们在战争中没有为每个人取得妻子[c]；也不是你们把她们给了他们，不然你们此时就有罪了[d]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争辩”也可译作“抱怨”或“来向我们提出申诉”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“求你们因着她们恩待我们”。这句话的句法简略；也可理解为“求你们开恩，把她们赐给我们”。
    reason: lexical_alternative
  - marker: c
    text: 原文很简略，直译近于“我们没有在战争中取得各人的妻子”；意思可能是战争中取得的女子不够分给每个便雅悯人。
    reason: cultural_note
  - marker: d
    text: 本节末句的希伯来文含义不易确定，直译近于“因为不是你们把她们给了他们；此时你们就有罪”。按上下文，较可能是说：女子既不是家属亲手给出的，家属就不算违背誓言；“不然”表达这一隐含的反事实关系。
    reason: textual_difficulty
lexical_decisions:
- source_word: לָרִיב
  choice: 来同我们争辩
  rationale: ריב可指争辩、申诉或提出争端；“争辩”保留对抗意味，又不把场景限定为正式诉讼。
- source_word: חָנּוּנוּ אוֹתָם
  choice: 求你们看我们的情面，在这些女子的事上宽待我们
  rationale: חנן的命令式带第一人称复数后缀，直译是“恩待我们”；随后אוֹתָם把请求同这些女子联系起来。译文保留请求宽容的重点，不武断地将女子直接解释为动词的受事。
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: 我们在战争中没有为每个人取得妻子
  rationale: 原文表达紧缩；结合上文，意思很可能是战争中取得的女子不足以让每个便雅悯人都有妻子。此译尽量保留“每个人—他的妻子”的分配结构。
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: 也不是你们把这些女子给了他们
  rationale: 将两个复数代词所指明说为“这些女子”和“他们”，避免现代汉语中连续代词造成歧义，同时保留“家属并未正式将女子交给便雅悯人”的对比。
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: 否则你们现在就有罪了
  rationale: 末句希伯来文十分简略。按上下文，这句话是在说明家属并未亲自把女子交出去，因此不致因违背誓言而担罪；“否则”自然表达原文隐含的反事实关系。
theological_decisions:
- issue: 家属是否因违背誓言而担罪
  choice: 译作“否则你们现在就有罪了”，说明罪责只在家属主动把女子交给便雅悯人的反事实情形中成立。
  alternative: 直译为“现在你们就有罪”，或“免得你们现在有罪”。
  rationale: 上下文中的计策旨在让示罗女子被抢走，使其家属没有“把女儿给便雅悯人”的行为，从而不算违背21:1的誓言。译文只呈现叙事人物的推理，并不认可或替他们辩护。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看我们的情面”“在这些女子的事上宽待我们”兼顾自然汉语和原文请求施恩的语气；对末句不顺的希伯来文在正文中作最低限度的逻辑补足，并在脚注保留其难解性。
