base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: zh_hans
  text: 他们说：“看哪，在示罗有雅威的节期[b]，每年[a]举行。示罗在伯特利以北，在从伯特利向示剑延伸的上坡大路以东，又在利波拿以南。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“从日子到日子”，意思是“年年”或“每年”。
    reason: 说明希伯来语习语。
  - marker: b
    text: “节期”也可译作“节庆”。
    reason: 提供חַג的词义替代译法。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意的指示语气，同时采用现代中文中庄重而易懂的表达。
- source_word: חַג יְהוָה
  choice: 雅威的节期
  rationale: חַג指宗教节期或节庆，常带朝圣性质；“节期”在此既自然，也保留宗教语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见中文音译呈现以色列上帝的专名，不用称号替代原文专名。
- source_word: מִיָּמִים יָמִימָה
  choice: 每年
  rationale: 该希伯来语习语表示逐年定期发生；“每年”简洁自然，脚注保留其字面形式。
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה
  choice: 在……大路以东
  rationale: מִזְרְחָה הַשֶּׁמֶשׁ字面涉及日出方向，在地理描述中即“东”；מְסִלָּה指主要道路。
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: 从伯特利上示剑去的
  rationale: 保留עֹלָה的上行地形意象；שְׁכֶמָה的方向词尾表达“往示剑去”。
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: 又在利波拿以南
  rationale: 将נֶגֶב按此处地理方位义译为“南”，完成对示罗位置的说明。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文在普通叙事中使用上帝的专名；音译“雅威”保留专名性质，避免以称号代替。
- issue: חַג יְהוָה的限定程度
  choice: 雅威的节期
  alternative: 雅威的一个节期；雅威的那节期
  rationale: 希伯来语结构本身不明确标示不定或特指；中文不强加“一个”或“那个”，以保留这种开放性。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事文体。“看哪”保留原文提示语气；地名依通行圣经译名处理。将较长的希伯来语关系从句拆成独立句，以免中文产生修饰对象不清，同时明确原文是在说明示罗的位置。
