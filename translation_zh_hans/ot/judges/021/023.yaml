  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: zh_hans
  text: 便雅悯子孙就这样做了；他们从那些跳舞的女子中，按自己的人数抢来女子为妻[a]。随后，他们离去，回到自己的产业，重建各城[b]，住在其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抢来”也可译作“抢走”或“掳走”。希伯来文动词表示以强力夺取。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“建造各城”；根据上文便雅悯诸城被毁的背景，此处译作“重建”。
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 就照样做了
  rationale: 这是承接上文计划的叙事惯用语；译文简洁自然，并保留“照所说而行”的意思。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯的子孙
  rationale: 保留希伯来文以家族关系表述支派成员的方式；上下文表明这里具体指该支派的男子。
- source_word: וַיִּשְׂאוּ נָשִׁים לְמִסְפָּרָם
  choice: 按着他们的人数，抢来女子为妻
  rationale: “按着他们的人数”表明所取女子的数目与有需要的男子相应；“为妻”表达“取女子”的婚姻语境，同时不掩盖下文动词的强制意味。
- source_word: מִן הַמְּחֹלְלוֹת
  choice: 从跳舞的女子中
  rationale: 希伯来文为阴性复数分词，明确指正在跳舞的女子；此译法自然并保留性别信息。
- source_word: אֲשֶׁר גָּזָלוּ
  choice: 抢来
  rationale: גזל表示以强力夺取或劫走；“抢来”保留行为的强制性，不以中性的“带来”弱化原文。
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: 随后离开那里，回到
  rationale: 用两个连续动作表达他们离开节庆现场并返回支派领地，既保留原文动词序列，又符合现代汉语叙事习惯。
- source_word: אֶל נַחֲלָתָם
  choice: 回到自己的产业
  rationale: “产业”保留 נחלה 在支派土地分配语境中的承受之地含义，比泛称“地区”更贴近原文。
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: 重建各城
  rationale: 动词字面为“建造”，但上文记载便雅悯诸城已被焚毁，因此此处语境所指是重建；脚注保留字面译法。
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: 住在其中
  rationale: 准确表达他们在这些城中定居居住，语言简明庄重。
theological_decisions:
- issue: 是否弱化女子被带走时的强制性质
  choice: 用“抢来”明确保留 גזל 的强制意味
  alternative: 带走；娶来
  rationale: 叙事记述该行动，并不要求译者为其作道德辩护；保留原文带有暴力和夺取意味的用词，可避免把行为美化为普通婚娶。
- issue: 是否将支派土地术语一般化
  choice: 保留“便雅悯的子孙”和“产业”
  alternative: 便雅悯人；领地
  rationale: 这些表达保存了原文的家族—支派结构及承受土地的语义，同时在现代汉语中仍然清楚可懂。
- issue: “建造各城”是否应按语境译为“重建各城”
  choice: 正文译“重建各城”，脚注说明字面意义
  alternative: 建造各城
  rationale: 前文说明这些城已经遭到焚毁，所以语境自然指恢复被毁的城；脚注同时避免把上下文推断误当成动词本身的词义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留支派与承受土地的经文语汇，同时避免古奥表达；对掳取女子的行为不作美化，也不额外加入原文没有的道德评语。
