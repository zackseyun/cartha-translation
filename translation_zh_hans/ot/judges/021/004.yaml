base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: zh_hans
  text: 第二天，百姓清早起来，在那里筑了一座祭坛，献上燔祭和平安祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。希伯来语这个词指一类与和平、完满和共同团契有关的祭祀。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: 第二天
  rationale: 希伯来语含叙事公式“于是发生”，现代汉语叙事中可自然省略；“第二天”准确保留时间推进。
- source_word: וַיַּשְׁכִּימוּ
  choice: 清早起来
  rationale: 保留该动词“早起”的明确时间含义，表达自然简洁。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文使用普通集合名词“人民、百姓”，本处不明确增译为“以色列人”或“军队”。
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: 在那里筑了一座坛
  rationale: 保留原文明示的“那里”，并以现代汉语自然语序表达；“筑坛”符合祭祀语境。
- source_word: וַיַּעֲלוּ
  choice: 献上
  rationale: 该词在献祭语境中指把祭物献上；译为“献上”既传达礼仪动作，也不拘泥于字面的“使上升”。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是该以色列祭类在中文圣经传统中明确且简洁的标准术语，指祭物焚烧献上的祭。
- source_word: וּשְׁלָמִים
  choice: 平安祭
  rationale: 采用通行的祭祀术语，同时以脚注说明其和平、完满及共享团契等语义内涵。
theological_decisions:
- issue: 两类祭物术语的译法
  choice: 燔祭和平安祭
  alternative: 全燔祭和团契祭／福祉祭
  rationale: 原文只列出两类以色列祭礼，并未进一步解释其神学意义。正文采用中文读者较熟悉的标准名称，不把 שְׁלָמִים 的丰富含义单一化；其可能表达的团契与福祉意涵在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“第二天”省略希伯来语叙事公式的形式成分，但保留时间关系；祭祀术语沿用清晰通行的中文表达。脚注标记置于相关祭名之后，以说明“平安祭”的语义范围。
