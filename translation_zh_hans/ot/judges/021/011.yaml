  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: zh_hans
  text: 你们要这样做：要把所有男性，以及所有与男子同过房的女子[a]，都交付毁灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“知道男子床笫的女子”，是指曾与男子发生性关系的女子。
    reason: lexical_alternative
  - marker: b
    text: “交付毁灭”所译的希伯来语，是指把人置于禁令之下、交付毁灭，并非仅指普通的杀戮。
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: 你们要这样做
  rationale: 用自然的现代汉语表达希伯来语“这就是你们所要做的事”，保留指示和命令意味，并承接上文。
- source_word: כָּל זָכָר
  choice: 所有男性
  rationale: זָכָר指生理性别，并不限定为成年男子；“所有男性”比“所有男人”范围更准确。
- source_word: וְכָל אִשָּׁה
  choice: 以及所有……女子
  rationale: אִשָּׁה在此与“男性”相对，又受后面的性经历描述限定；译作“女子”自然且不过度限定为妻子。
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: 与男子同过房
  rationale: 这是指与男子发生过性关系的委婉说法；“同过房”在现代汉语中清楚而不粗俗，也保留原文的委婉语气。
- source_word: תַּחֲרִימוּ
  choice: 你们都要把他们尽行毁灭
  rationale: חרם的使役式在此指将人置于禁令之下予以毁灭。“尽行毁灭”既表达彻底性，又由脚注说明其超出普通杀戮的礼仪—战争术语含义。
theological_decisions:
- issue: 战争与审判语境中 חרם 的译法
  choice: 尽行毁灭
  alternative: 归于毁灭；置于禁令之下；灭绝净尽
  rationale: 该词并非仅指一般杀死，而有置于禁令之下、交付毁灭的含义。“尽行毁灭”在正文中清楚自然，同时借脚注保留其法律和礼仪层面的特殊含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“同过房”保留原文委婉表达；“所有男性”准确涵盖不分年龄的男性；重复“你们”使长句中的命令对象和动作关系清楚。
