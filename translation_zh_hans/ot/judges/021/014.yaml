base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: zh_hans
  text: 那时，便雅悯人回来了。他们把从基列雅比的妇女中保全下来的女子给了他们；但这样找来的女子还不够给他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较为省略，直译近于：“却没有这样为他们找到。”按上下文，是说用这个办法找来的女子不够给所有便雅悯人。
    reason: 说明希伯来文省略式表达及正文为使汉语通顺而补出的语意。
lexical_decisions:
- source_word: וַיָּשָׁב בִּנְיָמִן
  choice: 便雅悯人回来了
  rationale: שׁוב在叙事中表示“回来”；“便雅悯”在希伯来文中虽为单数族名，此处却集体指便雅悯支派的幸存者，因此译作“便雅悯人”。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 这是常见的时间短语；“那时”简洁自然，并保留叙事的时间衔接。
- source_word: וַיִּתְּנוּ לָהֶם
  choice: 众人……给了他们
  rationale: נתן直译为“给”。希伯来文只以动词形态暗示复数主语；按上下文是以色列会众，中文用“众人”使句子清楚，又不作过度具体化。
- source_word: הַנָּשִׁים
  choice: 女子
  rationale: 原词意为“女人、女子”，并未使用更明确的“妻子”一词；虽然后文处境表明她们将被给便雅悯人为妻，译文仍保留原文用词的宽度。
- source_word: אֲשֶׁר חִיּוּ
  choice: 那些被留下性命的
  rationale: חיה的Piel形式在此表示使人存活，即在杀戮中让这些女子活下来；“被留下性命”准确表达这一背景。
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: 基列雅比的妇女中
  rationale: 介词מִן表示从某群体中选出，译作“……中”能清楚体现这些女子来自基列雅比的妇女群体。
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: 可是用这个办法为他们找到的女子还不够
  rationale: 原文是省略式表达，字面近于“却没有这样为他们找到”；结合上下文，意思是以此方式取得的女子数量不足。正文补出“女子还不够”以便现代读者理解，同时以脚注保留原文的压缩形式。
theological_decisions:
- issue: 这些女子在叙事中的身份称谓
  choice: 按原文译作“女子”，不直接称为“妻子”
  alternative: 译作“妻子”
  rationale: 上下文涉及为便雅悯人取得妻子，但本节原文使用一般性的נָשִׁים。保留“女子”避免把上下文所暗示的角色直接写入词义，也不弱化叙事中的强制与暴力张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“便雅悯人”明确族名的集合用法；“众人”承接上下文中的以色列会众；不使用带有认可意味的措辞来淡化本节所叙事件中的暴力和强制。
