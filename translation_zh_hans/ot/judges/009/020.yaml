base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: zh_hans
  text: 不然，愿有火从亚比米勒发出，吞灭示剑的首领[a]和伯·米罗[b]；也愿有火从示剑的首领和伯·米罗发出，吞灭亚比米勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”也可译作“权贵”或“示剑的主人”。希伯来语指示剑城中掌权或有地位的人。
    reason: lexical_alternative
  - marker: b
    text: “伯·米罗”也可按字面译作“米罗之家”。其具体所指未能确定，可能是与示剑有关的一处地方、建筑或统治群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: 不然
  rationale: 承接上一节的条件句，简洁自然地表达“但若不是这样”的转折和否定条件。
- source_word: תֵּצֵא אֵשׁ
  choice: 愿火……出来
  rationale: 此处未完成式具有祈愿、咒诅语气；“愿”保留其祈使性质，不将其单纯处理为未来预言。
- source_word: מֵאֲבִימֶלֶךְ
  choice: 从亚比米勒出来
  rationale: 保留毁灭之火从亚比米勒发出的源头意象。
- source_word: וְתֹאכַל
  choice: 吞灭
  rationale: אכל用于火时有吞吃、烧尽之意；“吞灭”既保留生动意象，也明确表达毁灭结果。
- source_word: בַּעֲלֵי שְׁכֶם
  choice: 示剑的众首领
  rationale: 复数בעלים在此指城中的掌权者或显要人物；“众首领”比泛指居民更能传达其社会政治身份。
- source_word: בֵּית מִלּוֹא
  choice: 米罗之家
  rationale: 按构词保留“米罗之家”的表达，同时不在正文中断定它究竟是一处地方、建筑还是一个相关群体。
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: 也愿火从示剑的众首领和米罗之家出来
  rationale: 与前半句保持对称，清楚呈现双方彼此毁灭的咒诅结构。
- source_word: אֶת אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 作为末句直接宾语，不作增补，使经文以亚比米勒被吞灭收束，并保持互相毁灭的对称。
theological_decisions:
- issue: “火”的性质
  choice: 保留咒诅中具体的“火”意象，不在正文中说明它仅是比喻，也不明说是从神而来的超自然之火。
  alternative: 将“火”直接解释为暴力冲突，或明确译成神所施行的审判。
  rationale: 希伯来文使用具体的火焰意象，语境虽预示双方互相毁灭，却没有在本节限定这火是字面、比喻或兼具两者；译文应保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……出来，吞灭……”保留咒诅语气及前后平行结构；使用分号突出双方互相毁灭的对称关系。
