source:
  edition: WLC
  text: אֲשֶׁר נִלְחַ֥ם אָבִ֖/י עֲלֵי/כֶ֑ם וַ/יַּשְׁלֵ֤ךְ אֶת נַפְשׁ/וֹ֙ מִ/נֶּ֔גֶד וַ/יַּצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: zh_hans
  text: 因为我父亲曾为你们争战，置自己的性命于不顾[a]，救你们脱离米甸人的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“把自己的性命从面前抛开”，意思是他不顾自身安危，甘冒生命危险。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 这里承接上一节的质问，所引出的内容构成约坦责问示剑人的理由；译作“因为”比单纯的关系代词更符合汉语篇章衔接。
- source_word: נִלְחַם אָבִי עֲלֵיכֶם
  choice: 我父亲曾为你们争战
  rationale: נִלְחַם意为“争战”；עֲלֵיכֶם在此表示为对方的益处，而非与对方为敌，后文从米甸手中施救也印证这一点。
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: 置自己的性命于不顾
  rationale: 这是把性命抛开、不顾自身安危的形象说法。此译保留原文的强烈表达，同时让现代汉语读者清楚理解他甘冒致命危险。
- source_word: וַיַּצֵּל אֶתְכֶם
  choice: 救你们脱离
  rationale: נצל的使役形表示从危险或控制中救出；“救……脱离”准确而自然。
- source_word: מִיַּד מִדְיָן
  choice: 米甸人的手
  rationale: 原文直译为“米甸的手”，其中“手”指权势或控制；汉语以“米甸人的手”保留这一圣经意象，并与“脱离”自然搭配。
theological_decisions: []
