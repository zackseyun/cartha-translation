base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: zh_hans
  text: 以别的儿子迦勒出去[a]，站在城门口；亚比米勒和与他同在的人从埋伏处起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出去”也可译作“出来”；希伯来语动词只表示向外移动。
    reason: lexical_alternative
  - marker: b
    text: “从埋伏处起来”也可译作“从埋伏中起来”；这里的希伯来语名词既可指埋伏，也可指设伏的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: יצא表示向外移动；“出去”自然地保留方向含义，不具体断定叙事视角。
- source_word: גַּעַל בֶּן עֶבֶד
  choice: 迦勒·以别的儿子
  rationale: 按现代中文圣经人名惯例音译专名，并保留希伯来语父子关系结构。
- source_word: וַיַּעֲמֹד
  choice: 站
  rationale: עמד在此直接表示站立；不额外加入“驻守”或军事部署的含义。
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: 在城门口
  rationale: פתח是开口或入口，שער העיר是城门；“城门口”是简洁自然的现代汉语表达。
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום表示起身、起来；上下文中的埋伏自然传达他们开始行动，无须另加“冲出”等原文未明说的动作。
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: 和跟随他的人
  rationale: עם字面为“民众、众人”，军事语境中指与亚比米勒同在的一队人；“跟随他的人”自然且不过度限定为正规军。
- source_word: מִן הַמַּאְרָב
  choice: 从埋伏之处
  rationale: מארב可指埋伏本身，也可指设伏的位置；正文采用在中文中较自然的地点性表达，并以脚注保留词义范围。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事体。保留原文连续动作的节奏；不把“众人”具体化为原文未明确说明的正规军，也不将“起来”强化为“冲出”。
