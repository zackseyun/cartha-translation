  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: zh_hans
  text: “请你们向示剑所有的领袖说：‘是让耶路巴力的众子——七十个人——统治你们更好，还是让一个人统治你们更好？你们要记得：我是你们的骨肉[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你们的骨和你们的肉”，是表示血缘亲属或近亲关系的惯用说法。
    reason: 解释希伯来语亲族惯用语，并说明正文“骨肉”所保留的具体身体意象。
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: 请你们……说
  rationale: 复数祈使式加语气词 נָא，表达请求或劝请；用“请你们”自然传达其语气。
- source_word: בְּאָזְנֵי
  choice: 对……说
  rationale: 这是“使其听见、当面告诉”的希伯来语表达；现代汉语用“对……说”更自然，也保留直接传话的意味。
- source_word: בַּעֲלֵי שְׁכֶם
  choice: 示剑所有的居民
  rationale: בעלי 在本书相关叙事中指构成示剑城邦共同体、参与政治决定的人。译作“居民”较“领袖”少作身份上的额外限定；“所有”对应 כָל。
- source_word: מַה טּוֹב לָכֶם
  choice: 哪一样对你们更好
  rationale: 后文列出两个选择，因此这里具有隐含的比较意义；此译法符合现代汉语问句习惯。
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: 统治你们……统治你们
  rationale: משל 在政治语境中表示掌权、治理；重复译作“统治”，保留原文的修辞对应。
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: 耶路巴力的七十个儿子全都
  rationale: 原文意为七十人，即耶路巴力的众子。汉语直接说“七十个儿子”清楚自然，并保留男性所指。
- source_word: אִישׁ אֶחָד
  choice: 一个人
  rationale: 这里与七十个儿子形成单数和复数的鲜明对比；上下文已明确所指为男性，现代汉语“一个人”自然且准确。
- source_word: וּזְכַרְתֶּם
  choice: 你们要记得
  rationale: 虽形式上为带连接词的完成式，在此具有劝告或命令作用；“要记得”恰当地传达其强调语气。
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: 你们的骨肉
  rationale: “骨肉”保留骨与肉的具体意象，同时在现代汉语中自然表示血缘亲属，避免生硬直译“骨和肉”。
- source_word: אָנִי
  choice: 我就是
  rationale: 独立人称代词带强调意味；“我就是”比单纯“我是”更能体现亚比米勒以亲族身份游说的语气。
theological_decisions:
- issue: 亲族惯用语是否意译
  choice: 正文译作“我是你们的骨肉”并加注
  alternative: “我是你们的骨和肉”或“我是你们的亲属”
  rationale: “骨肉”既保留原文的身体意象，又是自然的汉语亲属用语；脚注说明其所表达的血缘关系，以免将该修辞压缩为抽象的“亲属”。
- issue: בַּעֲלֵי שְׁכֶם 的社会身份
  choice: 示剑所有的居民
  alternative: 示剑所有的领袖／示剑所有的城主
  rationale: 该词可指主人、土地拥有者或城邦成员；上下文虽显示他们有政治参与权，但原词本身未必只限正式领袖，因此采用较宽的“居民”，保留身份范围上的不确定性。
- issue: 耶路巴力众子共同统治的修辞性假设
  choice: 按原文译作“七十个儿子全都统治你们”
  alternative: 解释为“受耶路巴力全家统治”
  rationale: 亚比米勒的说法具有政治游说和夸张色彩；译文不替叙述者判断七十人是否实际都寻求统治，以保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。问句调整为符合汉语习惯的“还是……哪一样更好”，但保留原文两个选项的对照与“统治”的重复。引号显示这是亚比米勒托弟兄们转述的话。
