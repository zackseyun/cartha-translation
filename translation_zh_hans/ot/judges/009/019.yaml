  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִם בֶּ/אֱמֶ֨ת וּ/בְ/תָמִ֧ים עֲשִׂיתֶ֛ם עִם יְרֻבַּ֥עַל וְ/עִם בֵּית֖/וֹ הַ/יּ֣וֹם הַ/זֶּ֑ה שִׂמְחוּ֙ בַּ/אֲבִימֶ֔לֶךְ וְ/יִשְׂמַ֥ח גַּם ה֖וּא בָּ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: zh_hans
  text: 如果你们今日以真诚和正直待耶路巴力和他的家[a]，就因亚比米勒欢喜吧；也愿他因你们欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”在这里可指家人、家族或家系。
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接上文的条件式论述；现代汉语中“如果”已自然表达该条件关系，无须机械译出句首连接词。
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: 以真诚和正直
  rationale: אֱמֶת可指真实、可靠或忠诚，תָמִים在此指品格与行为的完整、正直；“真诚和正直”既保留两个并列概念，也符合现代汉语表达。
- source_word: עֲשִׂיתֶם עִם
  choice: 待
  rationale: 该习语意为以某种方式对待某人；“待”简洁自然，并能与前面的方式状语顺畅搭配。
- source_word: יְרֻבַּעַל
  choice: 耶路巴力
  rationale: 依照常见圣经人名音译，并与上下文保持一致。
- source_word: בֵּיתוֹ
  choice: 他的家
  rationale: 保留בַּיִת的家族性含义；这里不只可能指住所，也可涵盖家人、家族或家系，另以脚注说明。
- source_word: הַיּוֹם הַזֶּה
  choice: 今日
  rationale: 准确表达“这一天／今天”，并保持约坦讲话庄重的修辞语气。
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: 因亚比米勒欢喜吧
  rationale: שׂמח与介词ב连用，可表示因某人、以某人为欢喜；“因……欢喜”自然保留其关系含义和复数命令语气。
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: 也愿他因你们欢喜
  rationale: 此处未完成式承接命令句，具有祈愿或准命令意味；“愿”比直陈式更准确，也保留双方对应的修辞结构。
theological_decisions:
- issue: 条件句中的反讽是否明说
  choice: 不在正文中增添“果真”等明显反讽措辞
  alternative: 译作“如果你们今日果真……”
  rationale: 上下文显出约坦话语的反讽和审判意味，但本节希伯来文本仍采用表面条件句；正文保留这一张力，让语境传达反讽。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“今日”保持演说语气；“因……欢喜”在两分句中形成对称，重现原文的互惠式修辞。
