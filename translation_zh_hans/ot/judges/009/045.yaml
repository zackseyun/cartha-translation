base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: zh_hans
  text: 亚比米勒那一整天攻打那城[a]，攻取了城，杀了城里的人。随后，他拆毁那城，又在那城上撒了盐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与那城争战”。希伯来文动词字面意思是“争战”；与这里所用的介词连用，在本段语境中很可能指对那城采取军事行动。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以盐播种那城”。这是象征毁灭和咒诅的举动，表明那城已成为废墟。
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: 攻打那城
  rationale: נלחם 与介词 ב 连用，在此军事语境中表示与该城争战、敌对进攻。译作“攻打”符合现代汉语，也与下文攻取并拆毁城池的叙述衔接；脚注保留较为字面的“与那城争战”。
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: 整整那一天
  rationale: 保留行动持续于那个特定日子的时间强调，同时表达自然。
- source_word: וַיִּלְכֹּד
  choice: 攻取了
  rationale: לכד 在军事语境中指夺取或占领城池；“攻取”简洁地体现这一含义。
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: 城里的人
  rationale: 这里指当时在城中的人。“城里的人”自然清楚，并未额外限定其身份。
- source_word: הָרָג
  choice: 杀了
  rationale: 直接传达 הרג 的“杀死”之义，不添加原文没有的修辞色彩。
- source_word: וַיִּתֹּץ
  choice: 拆毁
  rationale: נתץ 表示拆下、毁坏建筑；“拆毁”适用于全城遭毁的语境。
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: 在城中撒了盐
  rationale: 希伯来文直译近于“以盐播种它”。汉语“在城中撒了盐”清楚表达实际动作；脚注说明原文的播种意象及其象征意义，避免正文产生真的耕种盐粒之误解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“攻打—攻取—杀—拆毁—撒盐”保留希伯来文连续动作的推进感；不用文言色彩较重的“屠戮”“倾覆”等词。脚注标记均置于所解释内容之后。
