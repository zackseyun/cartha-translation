base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: zh_hans
  text: 众人也各自砍下一根树枝，跟随亚比米勒，把树枝堆在那内堡[a]上；他们在那些人上面放火焚烧那内堡。这样，示剑的塔楼中所有的人也都死了，约有一千名男女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内堡”或译“密室”或“坚固的避难处”。原文所指可能是塔楼建筑中封闭、坚固的内部避难空间，而不是整座塔楼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: 砍下
  rationale: כרת在这里指从树上砍取树枝；“砍下”准确、自然，也不带入该词在其他语境中的含义。
- source_word: אִישׁ שׂוֹכֹה
  choice: 每人……一根树枝
  rationale: 原文直译近于“各人自己的树枝”，具有逐人分配的意味；“每人砍下一根树枝”在现代汉语中自然，并保留单数名词。
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: 跟着亚比米勒
  rationale: 原文意为“走在亚比米勒后面”，在此叙事中表示众人照他的带领行动；“跟着”兼顾具体动作和语境意义。
- source_word: הַצְּרִיחַ
  choice: 内堡
  rationale: 该词与本节后面的“楼”有别，所指似为塔楼建筑中供人躲避的封闭坚固部分。“内堡”简洁地表达其内部避难据点的性质，同时用脚注保留“密室”等可能理解。
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: 把树枝堆在内堡上
  rationale: עַל的基本空间意义是“在……上”；“堆”根据多人各持树枝的连续行动自然补足集合性，但不把方位明确改成“旁边”或“周围”。
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת הַצְּרִיחַ בָּאֵשׁ
  choice: 在里面那些人的头顶放火焚烧内堡
  rationale: 保留עֲלֵיהֶם“在他们上面”的空间关系，同时以“里面那些人”说明代词指向躲入其中的人；“放火焚烧”准确表达点燃建筑的动作。
- source_word: אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: 示剑楼的所有人
  rationale: אַנְשֵׁי在群体称谓中可泛指所属人员；下文明确包括男女，因此译作“所有人”可避免现代汉语中“男人”与“男女”的表面冲突。
- source_word: כְּאֶלֶף אִישׁ וְאִשָּׁה
  choice: 男女约有一千人
  rationale: 前缀כ־表示约数；“男女约有一千人”自然保留人数估计及男女均包括在内的说明。
