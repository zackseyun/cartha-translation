base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: zh_hans
  text: 他母亲的兄弟们把这一切有关亚比米勒的话，都讲给示剑所有的权贵[a]听；他们的心就转向亚比米勒，因为他们说：“他是我们的弟兄。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“示剑所有的主人”或“示剑所有有地位的人”。原文所指是城中有势力、有影响力的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: 说给他们听
  rationale: 该动词在此带“这一切话”作宾语，表示把先前的提议转述给示剑人；译法自然，并保留言说行动。
- source_word: אֲחֵי אִמּוֹ
  choice: 他母亲的兄弟们
  rationale: 原文具体指亚比米勒母亲的男性兄弟，即他的舅舅们；正文采用直译以准确呈现亲属关系。
- source_word: עָלָיו
  choice: （由语境体现为替他转述）
  rationale: 该介词可指“论到他”，也可在本语境中带有“为他、替他说话”的意味。中文句式以转述其话自然体现所指，避免加入过强的目的解释。
- source_word: בְּאָזְנֵי
  choice: 在……耳中
  rationale: 保留希伯来语“在耳中”的形象表达，意为当众说给对方听；后接“说给他们听”确保现代中文清楚自然。
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: 示剑所有的权贵
  rationale: בעלים 在城邦政治语境中指有地位、有影响力或掌权的人，并非笼统的全体居民；“权贵”既保留身份与势力色彩，也不把其正式职务规定得过死。
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דברים 可指“话”或“事情”；这里回指上一节亚比米勒所托付的提议，译作“话”最贴合言说语境。
- source_word: וַיֵּט לִבָּם
  choice: 他们的心便转向
  rationale: 保留“心倾转”的希伯来语意象，表达内在态度和支持方向发生改变；不另行补出未明说的使动主体。
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: 转向亚比米勒
  rationale: אַחֲרֵי 在此表达追随、拥护。中文“心转向”自然传达支持之意，同时保留原文隐喻。
- source_word: כִּי אָמְרוּ
  choice: 因为他们说
  rationale: כִּי 引出他们转而支持亚比米勒的理由，译作“因为”明确呈现因果关系。
- source_word: אָחִינוּ הוּא
  choice: 他是我们的弟兄
  rationale: 直译“他是我们的兄弟”，借亲族语言诉诸示剑人的群体认同；“弟兄”在庄重叙事中可涵盖同族男性关系，并保留其修辞力度。
