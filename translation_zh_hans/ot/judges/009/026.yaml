base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: zh_hans
  text: 后来，以别的儿子迦勒和他的弟兄们前来，进入示剑[a]；示剑的首领[b]便信任他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进入示剑”也可译作“经过示剑”或“越过进入示剑”；原文动词可表示越过、经过或进入，具体侧重点并不确定。
    reason: lexical_alternative
  - marker: b
    text: “首领”原文直译为“示剑的主人们”，指城中的掌权者或有势力的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 后来……来到
  rationale: 叙事性连续式推动情节发展；“后来”自然表达事件顺序，“来到”对应 בוא。
- source_word: גַּעַל בֶּן עֶבֶד
  choice: 以别的儿子迦勒
  rationale: 按现代中文圣经人名惯例音译专名，并以自然的中文领属结构表达父子关系。
- source_word: וְאֶחָיו
  choice: 和他的弟兄们
  rationale: 希伯来文直用连词“和”；中文在“来到”之后这样表达同行关系自然，也保留原文句法。
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: 进入城中
  rationale: עבר 带有经过、越入的动态含义；结合上下文，所指地点是示剑。为避免重复地名并使中文顺畅，译作“进入城中”，同时以脚注保留其他可能语义。
- source_word: וַיִּבְטְחוּ בוֹ
  choice: 便信任他
  rationale: בטח 带 בְּ 表示对某人怀有信赖或倚靠；“信任他”符合本处政治结盟语境，也不过度加入宗教色彩。
- source_word: בַּעֲלֵי שְׁכֶם
  choice: 示剑的首领
  rationale: בעלי 在城邦语境中指当地掌权者、领头人；“首领”比直译“主人”更清楚，也避免误指全体居民。
