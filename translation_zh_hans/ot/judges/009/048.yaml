  text: וַ/יַּ֨עַל אֲבִימֶ֜לֶךְ הַר צַלְמ֗וֹן הוּא֮ וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ/וֹ֒ וַ/יִּקַּח֩ אֲבִימֶ֨לֶךְ אֶת הַ/קַּרְדֻּמּ֜וֹת בְּ/יָד֗/וֹ וַ/יִּכְרֹת֙ שׂוֹכַ֣ת עֵצִ֔ים וַ/יִּ֨שָּׂאֶ֔/הָ וַ/יָּ֖שֶׂם עַל שִׁכְמ֑/וֹ וַ/יֹּ֜אמֶר אֶל הָ/עָ֣ם אֲשֶׁר עִמּ֗/וֹ מָ֤ה רְאִיתֶם֙ עָשִׂ֔יתִי מַהֲר֖וּ עֲשׂ֥וּ כָמֽוֹ/נִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: zh_hans
  text: 亚比米勒和所有和他在一起的人都登上撒们山。亚比米勒手里拿着斧子，砍下一簇树枝[a]，把它举起，放在肩上。然后，他对和他在一起的人说：“你们看见我所做的，就赶快照样做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一大把树枝”“一丛柴枝”或“一片灌木枝”。这里的希伯来词较罕见，指聚成一团的枝条或柴枝。
    reason: 说明罕见词שׂוֹכָה的词义范围，并保留它究竟指枝簇、柴枝还是灌木枝的歧义。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 登上
  rationale: עלה在叙事中表示向上行进；“登上”自然保留了上山的方向性。
- source_word: הַר צַלְמוֹן
  choice: 撒们山
  rationale: הַר加专名表示一座名为צַלְמוֹן的山；按现代中文圣经地名习惯音译为“撒们山”。
- source_word: הוּא וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: 亚比米勒和所有跟随他的人
  rationale: 保留原文对亚比米勒及全部随行者的强调；עָם本义宽泛，未明说是士兵，因此不增译为“军兵”。
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: 手里拿着斧子
  rationale: 原文名词形式为复数，但现代汉语“斧子”在此可不标数，既自然又避免武断规定具体数量；“手里拿着”传达בְּיָדוֹ。
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: 砍下一簇树枝
  rationale: 罕见词שׂוֹכָה指聚成一团的枝条、灌木或柴枝；上下文说明所砍之物可扛在肩上。“一簇树枝”保留其集合性，又不暗示已经捆扎。
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: 把它扛起来放在肩上
  rationale: נשא可指举起或负载；结合“放在肩上”，译作“扛起来”符合动作场景，同时保留随后置于肩上的次序。
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: 你们看见我怎么做
  rationale: 原文表达紧缩，意思是众人刚才所目睹的示范动作；此译自然传达其关系而不添加解释。
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: 就赶快照样做
  rationale: 保留复数命令中“赶快”的紧迫感；“照样做”准确表达כָמוֹנִי“像我一样”的语境含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。叙事动作简洁连贯；不把“跟随他的人”限定为士兵，也不把罕见的枝条集合词解释成已经扎好的柴捆。脚注标记置于相关词语“一簇树枝”之后。
