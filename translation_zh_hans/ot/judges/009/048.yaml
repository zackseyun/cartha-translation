  - severity: low
    issue: “你们看见我怎么做”未明确所见动作已经完成。
    rationale: מָה רְאִיתֶם עָשִׂיתִי指他们所看见他已经做过的事；“你们看见我所做的”既自然又避免理解为当下正在做。
  - severity: low
    issue: “跟随他的人”可能比原文“与他在一起的人”多出追随意味。
    rationale: אֲשֶׁר אִתּוֹ仅说明随同/在他身边，不必暗示政治或个人上的追随关系。
