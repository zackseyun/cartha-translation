  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: zh_hans
  text: 无花果树却对它们说：“难道我要放弃我的甘甜和美好的果实，去在众树之上摇摆[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“去统管众树”。希伯来语动词的字面意思是“摇摆”或“摇动”；在这则寓言中，它既保留树木的形象，也暗含统治之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 却对……说
  rationale: 叙事式连接词推进寓言；结合前后树木接连拒绝的语境，用“却”自然体现回应中的反意。
- source_word: הַתְּאֵנָה
  choice: 无花果树
  rationale: 该名词在寓言中指作为说话角色的无花果树，现代汉语以“无花果树”最自然明确。
- source_word: הֶחֳדַלְתִּי
  choice: 难道我要停止结出
  rationale: 完成式在修辞问句中具有商议意味，即“难道我要停止……吗”；“结出”按树木及其产物的语境补出，使汉语通顺。
- source_word: מָתְקִי
  choice: 我的甘甜
  rationale: 保留“我的甘甜”这一抽象、拟人化表达，不将其完全解释成“甜果子”。
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: 佳美的果实
  rationale: תְּנוּבָה可指产物、出产或果实；用于无花果树时译为“果实”最贴切，“佳美”传达טוֹבָה的正面品质。
- source_word: וְהָלַכְתִּי
  choice: 去
  rationale: 承接前面的修辞问句，与“停止……去……”构成自然的汉语并列结构。
- source_word: לָנוּעַ
  choice: 摇摆
  rationale: 该动词本义为移动、摇动或摇摆；这里既保留树木意象，又在寓言中暗含居于众树之上掌权的意味。
- source_word: עַל הָעֵצִים
  choice: 在众树之上
  rationale: עַל既可表达空间上的“在……之上”，在寓言语境中也暗示权柄；“众树”是自然凝练的汉语表达。
theological_decisions:
- issue: לָנוּעַ是否直接译明统治含义
  choice: 正文译“摇摆”，脚注说明也可理解为“统管众树”
  alternative: 正文直接译为“统管”或“作王治理”
  rationale: 原词保留树木摇摆的形象，同时在君王寓言中暗示统治。正文不宜消除这层双关，脚注则帮助读者把握其政治含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“甘甜”保留原文拟人化的抽象说法；“在众树之上摇摆”刻意保存原文的形象与统治暗示之间的张力。
