  yaml_path: translation/ot/judges/009/047.yaml
  text: And it was reported to Abimelech that all the leaders of the tower of Shechem had gathered together.
translation:
  language: zh_hans
  text: 有人把这事报告给亚比米勒，说示剑楼的所有首领都聚集在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 有人把这事报告给
  rationale: 这是被动式“被告知/被报告”；汉语改用不定主语主动句更自然，“这事”承接所报告的情况，不增添具体内容。
- source_word: בַּעֲלֵי
  choice: 首领
  rationale: 该词本义可指“主人、拥有者、权势人物”；在此指与示剑楼有关的权势群体，结合上下文译作“首领”最符合其社会角色，也避免生硬的“主人”。
- source_word: מִגְדַּל שְׁכֶם
  choice: 示剑楼
  rationale: 保留原文地名结构及其可能指塔楼或以塔楼命名之聚落的含混性，不擅自具体化为城堡或某一建筑内部。
- source_word: הִתְקַבְּצוּ
  choice: 聚集在一起
  rationale: 准确表达反身/相互意义的集合动作，与全体首领作主语相称。
