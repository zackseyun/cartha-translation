base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: zh_hans
  text: 以别的儿子迦勒说：“亚比米勒是谁？示剑又是谁，竟叫我们服事他？[a] 他不就是耶路巴力的儿子吗？西布勒是他的官员。[b] 你们去服事示剑之父哈抹的人吧！[c] 我们又为什么要服事他呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示剑”可能是以城名代指示剑城、城中居民或其统治群体。这里也可理解为：“亚比米勒算什么？示剑又算什么……？”
    reason: lexical_alternative
  - marker: b
    text: “他的官员”也可译作“他的副手”或“他的受命官员”。“他”指亚比米勒。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“哈抹的人”，可指哈抹的后裔或与他相关的群体。哈抹被称为“示剑之父”；参创世记34章。
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: 亚比米勒是谁？示剑又是谁
  rationale: מִי是询问身份的代词，此处带有轻蔑地质疑地位与正当性的语气。保留“示剑”这个名称，不直接改成“示剑人”或“示剑城”，以保存原文以城名代指其群体或统治阶层的表达及其含混性。
- source_word: כִּי נַעַבְדֶנּוּ
  choice: 竟叫我们服事他
  rationale: עבד在这里主要指政治上的效忠、臣服，而非一般劳作；“服事”既保留原词，也能在上下文中表达政治从属。“竟”传达反问中的不屑。
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: 亚比米勒不就是耶路巴力的儿子吗
  rationale: הֲלֹא引出预期听者赞同的反问；补出主语“亚比米勒”，使现代汉语清楚，同时不改变所指。
- source_word: וּזְבֻל פְּקִידוֹ
  choice: 西布勒不就是他委派的官员吗
  rationale: פָּקִיד指受委任、隶属上级的职务人员。“官员”不把西布勒的具体职衔说得过窄，“委派”则体现该词与任命有关的含义。
- source_word: עִבְדוּ
  choice: 你们去服事……吧
  rationale: 原文是阳性复数命令式。“你们去……吧”在现代汉语中保留直接号召的语气；结合上下文，也容许其带有讥讽或煽动意味。
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  choice: 示剑之父哈抹一族的人
  rationale: אַנְשֵׁי חֲמוֹר直译为“哈抹的人”，可指与哈抹相关或出自哈抹的群体。“一族的人”使汉语自然，但用脚注说明原文较宽泛；“示剑之父”保留原文称谓及其祖源联想。
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: 我们又为什么要服事亚比米勒呢
  rationale: וּמַדּוּעַ引出进一步的挑战；独立人称代词אֲנָחְנוּ带强调意味，汉语以句首“我们”表达。末尾把代词所指译为“亚比米勒”，避免前句多个阳性人物造成不必要的汉语歧义。
