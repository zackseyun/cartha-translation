base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: zh_hans
  text: 示剑楼[a]的所有首领听见了这事，就进了伊勒·比利土[c]神庙的内室[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示剑楼”也可视为地名，译作“米格达勒·示剑”。
    reason: alternative_reading
  - marker: b
    text: “内室”也可译为“地窖”“堡垒”或“密室”；希伯来词指一处受保护的内部空间。
    reason: lexical_alternative
  - marker: c
    text: “伊勒·比利土”可能意为“立约之神”。可比较本章其他经节中的相关名称“巴力·比利土”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: 听见了这事
  rationale: 动词本义是“听见”；原文未明说宾语，中文按上文补出“这事”，自然地指前述事件，不增加新的实质内容。
- source_word: בַּעֲלֵי
  choice: 首领
  rationale: 字面可指“主人、拥有者”，在此城邑与军事语境中指示剑楼的主要人物或领头者；“首领”比“主人”更能表达其社会角色。
- source_word: מִגְּדַל שְׁכֶם
  choice: 示剑楼
  rationale: מִגְּדַל意为“塔、楼”；正文保留可理解为“示剑的楼塔”的透明表达，同时用脚注说明也可能是地名“米格达勒·示剑”。
- source_word: וַיָּבֹאוּ אֶל
  choice: 进了
  rationale: 该结构表达朝向并进入下文所说的避难处；“进了”符合本处动作和现代汉语习惯。
- source_word: צְרִיחַ
  choice: 内室
  rationale: 此词可指受保护的内部房间、地窖式密室或堡室；“内室”保留建筑空间的基本含义，不武断确定具体构造。
- source_word: בֵּית אֵל בְּרִית
  choice: 伊勒·比利土神庙
  rationale: בֵּית字面为“房屋”，用于神祇时常指庙宇；将אֵל בְּרִית音译为“伊勒·比利土”，既保留其作为神名或称号的可能，也避免与本章别处的“巴力·比利土”强行调和。
theological_decisions:
- issue: 祭祀场所名称或称号 אֵל בְּרִית 的译法
  choice: 伊勒·比利土
  alternative: 立约之神；或依附近经文协调作“巴力·比利土”
  rationale: 原文可被视为专名或神祇称号。正文采用音译，以保存这种歧义，也不凭上下文把本节的“伊勒”改成“巴力”；词义可能性则在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“神庙”明确בֵּית在此为祭祀建筑；专名用间隔号帮助读者辨识构词。所有歧义均留在正文或脚注中，未以附近经文作无文本依据的协调。
