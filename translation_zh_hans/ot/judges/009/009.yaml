base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: zh_hans
  text: 橄榄树却对它们说：“我岂可停止出产我丰美的产物——藉此使神明和人得尊荣——而去在众树之上摇摆吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזַּיִת
  choice: 橄榄树
  rationale: 字面为“橄榄”，但寓言中指作为说话角色的树；现代汉语用“橄榄树”更明确自然。
- source_word: הֶחֳדַלְתִּי
  choice: 我岂可停止出产
  rationale: 完成式在上下文中构成反问；“岂可停止”既表达反问语气，也不把它误解为单纯过去时。补出“出产”使其与树的丰美果实自然衔接。
- source_word: דִּשְׁנִי
  choice: 我的丰美
  rationale: 原词字面指“肥美、丰腴”，在橄榄树语境中特指其丰厚产物，尤其是橄榄油；“丰美”保留原文比喻，避免直接把未明说的“油”写入正文。
- source_word: אֲשֶׁר בִּי
  choice: 藉此
  rationale: 将关系代词与介词的工具性含义自然表达出来，所指为橄榄树的“丰美”。
- source_word: יְכַבְּדוּ
  choice: 得尊荣
  rationale: 原文为主动复数“他们尊荣”，但主语未明；汉语用“得尊荣”保持焦点并避免强加未出现的施事者。
- source_word: אֱלֹהִים
  choice: 神明
  rationale: 词形为复数，并与复数动词搭配；“神明”可自然表达复数或集合意义，又比“诸神”稍少强化明确数量。另一种传统理解“上帝”保留于脚注。
- source_word: וַאֲנָשִׁים
  choice: 和人
  rationale: 与“神明”构成神界与人类的并列；现代汉语用“人”简洁自然。
- source_word: וְהָלַכְתִּי לָנוּעַ
  choice: 而去……摇摆
  rationale: 延续前面的反问。“摇摆”保留树木摆动的形象及寓言中的讽刺意味；统治含义由“在众树之上”及上下文体现。
- source_word: עַל הָעֵצִים
  choice: 在众树之上
  rationale: 介词表达居于其他树木之上的位置，也暗含被提议的王权。
theological_decisions:
- issue: אֱלֹהִים 在“神明和人都藉此得尊荣”中的所指
  choice: 神明
  alternative: 上帝
  rationale: 复数词形、复数动词以及寓言语境支持复数或集合性的“神明”；但橄榄油用于敬拜也使“上帝”的传统理解成为真实可能，因此不在正文中消除歧义，而在脚注保留另一读法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文保留“丰美”这一原文隐喻，不直接释作“油”；“摇摆”保留树木意象，同时让“在众树之上”传达作王的寓意。脚注标记[a]已置于相关分句之后。
