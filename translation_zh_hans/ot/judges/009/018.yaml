revisions:
- from: 可是你们今天起来攻击我父家，杀了他的儿子七十人，把他们杀在同一块磐石上；又因为亚比米勒是你们的弟兄，就立他作王，统治示剑的领袖。他不过是我父亲婢女的儿子[a]。
  to: 可是你们今天起来攻击我父的家，杀了他的七十个儿子，把他们杀在同一块石头上；又立我父亲的女奴的儿子亚比米勒作示剑领袖的王，因为他是你们的弟兄。
  rationale: 修订恢复原文后半的句法：亚比米勒被立为“示剑领袖的王”，而“因为他是你们的弟兄”说明他们拥立他的理由。母系身分描述紧随其姓名，避免加入“不过”等原文未明确表达的强化词。脚注标记置于“女奴”之后，以正确锚定词汇说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:23Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿前半准确传达了对父家发动敌对行动、杀害七十个儿子及在一块石头上杀害他们的内容。然而后半将“立亚比米勒为示剑领袖的王”拆开并改写为“立他作王，统治示剑的领袖”，使“示剑的领袖”从被统治者变为其统治对象；随后新增“他不过是”及将母系身分句后置，也弱化并扰乱了原文的句法与指控重点。
  naturalness: “我父的家”“起来攻击”“立……作王”庄重而自然。“统治示剑的领袖”虽可理解，但在此句中既不合原文句法，也不如“作示剑领袖的王”自然。采用“我父亲的女奴”比“我父亲婢女”更符合现代标准汉语，同时保留原文社会身分语义。
  terminology: 人名“亚比米勒”、地名“示剑”、亲属称谓“弟兄”均合宜。“女奴”可直接呈现אָמָה所指的受奴役女性；脚注应说明“妾”是根据上下文关系作出的解释性译法，而非该词的直接词义。
  issues:
  - severity: high
    issue: “统治示剑的领袖”改变了“作示剑领袖的王”的句法关系。
    rationale: 原文的“在示剑的领袖之上”为任立亚比米勒作王的对象范围；不能改作一个独立的“统治”分句。
  - severity: medium
    issue: “他不过是”并非原文所明说，且将“我父亲婢女的儿子”移至理由分句之后。
    rationale: 原文在“亚比米勒”后紧接其母系描述，并以“因为他是你们的弟兄”结束，带有讽刺性的因果关系。新增“不过”会额外强化贬抑语气。
  - severity: low
    issue: “婢女”带较强古典色彩，且“我父亲婢女”缺少结构助词，略显紧缩。
    rationale: “我父亲的女奴”更符合现代标准汉语，也更清楚表达该词的社会身分含义。
  revised_text: 可是你们今天起来攻击我父的家，杀了他的七十个儿子，把他们杀在同一块石头上；又立我父亲的女奴的儿子亚比米勒作示剑领袖的王，因为他是你们的弟兄。
  revised_footnotes:
  - marker: a
    text: “女奴”也可译作“女仆”或“婢女”。若根据她与基甸的叙事关系作解释，也有人译作“妾”；希伯来原文在这里直称她为女性奴仆。
    reason: 保留אֲמָה的社会身分含义，并注明“妾”是解释性而非直接的词汇译法。
  revision_rationale: 修订恢复原文后半的句法：亚比米勒被立为“示剑领袖的王”，而“因为他是你们的弟兄”说明他们拥立他的理由。母系身分描述紧随其姓名，避免加入“不过”等原文未明确表达的强化词。脚注标记置于“女奴”之后，以正确锚定词汇说明。
