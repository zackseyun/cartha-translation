  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: zh_hans
  text: 可是你们今天起来攻击我父的家，杀了他的七十个儿子，把他们杀在同一块石头上；又立我父亲的女奴的儿子亚比米勒作示剑领袖的王，因为他是你们的弟兄。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: 起来攻击
  rationale: 这个习语表达敌对行动。“起来攻击”既保留“起来”的意象，也自然传达其攻击、反对的语气。
- source_word: בֵּית אָבִי
  choice: 我父家
  rationale: 这里的“家”指父亲的家族或家室，并非单指房屋；“我父家”简洁保留家族性的含义。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 保留约坦指控中对当下这一日的时间强调。
- source_word: וַתַּהַרְגוּ
  choice: 杀了
  rationale: 原动词陈述杀害行为；“杀了”不额外加入原词本身未明说的法律定性。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 代词后缀最自然地回指“我父亲”，而非“父家”。
- source_word: שִׁבְעִים אִישׁ
  choice: 七十人
  rationale: 上下文已明确他们是父亲的儿子，汉语无需重复“男人”，这样更自然。
- source_word: עַל אֶבֶן אֶחָת
  choice: 在同一块磐石上
  rationale: 直译并保留集体处决场景的具体、骇人意象；“同一块”自然表达“一块”的集中性。
- source_word: וַתַּמְלִיכוּ
  choice: 立他作王
  rationale: 准确表达使役形式“使某人成为王”，也是自然庄重的现代汉语。
- source_word: בֶּן אֲמָתוֹ
  choice: 我父亲婢女的儿子
  rationale: אָמָה指女性仆役或女奴。“婢女”在庄重叙事中可读性较好，又不把身份直接解释成“妾”；其他可能表达收入脚注。
- source_word: בַּעֲלֵי שְׁכֶם
  choice: 示剑的领袖
  rationale: 在本城政治语境中，该词指示剑具有地位和权力的人；“领袖”比“主人”或“诸侯”更清楚地表达其城邦政治角色。
- source_word: כִּי אֲחִיכֶם הוּא
  choice: 因为亚比米勒是你们的弟兄
  rationale: כִּי在此说明他们拥立亚比米勒的原因；“弟兄”保留亲属关系以及约坦话中的讽刺意味。
theological_decisions:
- issue: 亚比米勒母亲的社会身份（אֲמָתוֹ）
  choice: 正文译作“婢女”，脚注说明也可译作“女奴”，并指出“妾”属于按叙事关系作出的解释性译法。
  alternative: 女奴；妾
  rationale: 希伯来词本身指女性仆役或女奴，约坦在此借此贬抑亚比米勒的母系身份。正文不直接采用制度含义更具体的“妾”，以免消除原文用词与叙事关系之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我父家”“立他作王”“弟兄”保留经文的家族与王权语感；调整末句语序，使中文清楚呈现“因他是你们的弟兄”这一拥立理由，同时突出“婢女的儿子”所带的指控意味。
