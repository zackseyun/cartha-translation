  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: zh_hans
  text: 于是迦勒在示剑的首领面前出去，与亚比米勒交战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在……面前”直译为“在……前面”；也可理解为迦勒带头、率领示剑的首领出去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出城
  rationale: 该词是יצא的Qal叙事形式，意为“出去、出来”。上下文是从示剑出战，现代汉语用“出城”自然且明确。
- source_word: גַעַל
  choice: 迦勒
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: לִפְנֵי
  choice: 率领
  rationale: 字面义为“在……前面”。在此军事语境中，指迦勒走在示剑首领前面并带领他们出战；正文采用自然的功能性表达，脚注保留较字面的另一种理解。
- source_word: בַּעֲלֵי שְׁכֶם
  choice: 示剑的首领
  rationale: 此处בעלים指城中有权势、居领导地位的人，不宜按通常意义译作“主人”；“首领”可传达其城邦政治身份。
- source_word: וַיִּלָּחֶם
  choice: 交战
  rationale: 该词是לחם的Niphal叙事形式，表示作战、争战；“交战”适合叙事语体。
- source_word: בַּאֲבִימֶלֶךְ
  choice: 与亚比米勒
  rationale: 介词ב与“争战”搭配时标明敌对对象；汉语“与……交战”已清楚表达敌对关系。
