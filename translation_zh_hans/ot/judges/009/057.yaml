base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: zh_hans
  text: 神使示剑人的一切恶行都归到他们自己头上；耶路巴力之子约坦的咒诅也临到他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: 报应
  rationale: 使役形态配合“恶行”和“在他们头上”，表达神使其所行之恶回到他们自身；“报应”自然传达司法性追讨，同时保留神主动施行审判的含义。
- source_word: רָעַת
  choice: 恶行
  rationale: 这里指示剑人所做的道德之恶，而非一般灾祸；“恶行”在现代汉语中明确指向其邪恶行为，并与后文报应相连。
- source_word: בְּרֹאשָׁם
  choice: 在他们自己头上
  rationale: 保留希伯来语“在头上”的形象，并用“自己”清楚表达后果归到作恶者本身。
- source_word: קִלֲלַת
  choice: 咒诅
  rationale: 指约坦先前宣告的咒诅；“咒诅”庄重、准确，也符合圣经叙事语体。
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: 临到他们
  rationale: 保留原文“来到”的动态意象，并自然表达咒诅实际应验在他们身上。
- source_word: אַנְשֵׁי שְׁכֶם
  choice: 示剑人
  rationale: 原文直指“示剑的男人／居民”；“示剑人”简洁自然，保留群体称谓，又不擅自缩窄为领袖。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 此处搭配单数动词，明确指以色列的神；译作“神”准确自然。
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: 耶路巴力之子约坦
  rationale: 保留父子身份关系，并采用现代中文圣经人名的通行音译；“之子”简洁庄重。
theological_decisions:
- issue: 神施行报应的主动性
  choice: 神把示剑人的恶行报应在他们自己头上
  alternative: 神任凭他们的恶行回到自己头上
  rationale: 原文以神为 הֵשִׁיב 的语法主语，呈现神主动使恶行归回作恶者；不将其弱化为单纯许可。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“报应在……头上”兼顾中文可懂度与希伯来语意象；分号呈现两个并列而紧密相关的审判结果。
