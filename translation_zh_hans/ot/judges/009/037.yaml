base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: zh_hans
  text: 迦勒又说：“看哪，有人群正从这地的中央[a]下来；有一队人正从占卜者的橡树[b]那边的路上过来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“这地的肚脐”，是指这地中央区域的形象说法。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“观兆者的笃耨香树”，或将整个短语视为地名，音译作“米恶尼宁橡树”。树种以及末一部分是否指占卜者、观兆者或地名成分，均不确定。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: 迦勒又开口说
  rationale: 该结构直译为“又加上说”，在叙事中表示再次发言；“又开口说”自然、庄重，并保留重复发言的意味。
- source_word: הִנֵּה
  choice: 看
  rationale: 这是引人注意的指示语；“看”符合现场观察和现代汉语表达。
- source_word: עָם יֹרְדִים
  choice: 有人……下来
  rationale: עָם本义为“民众、人群”，此处指眼前出现的一批人；动词复数也突出了其中众人。译作“有人”避免过早将其明确为军队。
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: 从地势中央
  rationale: טַבּוּר字面为“肚脐”，用于地理时指中央或高地中心；“地势中央”既表达方位，也符合他们正在“下来”的语境。字面意象置于脚注。
- source_word: וְרֹאשׁ אֶחָד
  choice: 还有一队人
  rationale: רֹאשׁ字面为“头”，此处指一支、一个队伍。“一队人”在中文中清楚自然，又不过度规定军事编制。
- source_word: מִדֶּרֶךְ
  choice: 从……那条路过来
  rationale: 该介词短语可表示路线或来向；结合בָּא，译文同时传达沿路而来及方向。
- source_word: אֵלוֹן
  choice: 橡树
  rationale: 该词可指橡树、笃耨香树或某种大树；“橡树”是常见且易懂的传统译法，物种不确定性在脚注说明。
- source_word: מְעוֹנְנִים
  choice: 占卜者
  rationale: 通常认为该词与观兆、占卜有关，同时整个短语可能是地名；采用有意义的译名，并在脚注保留音译及其他理解。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事体。保留迦勒现场指认两路来人的口吻，不把“人”强化为“军兵”，也不把不确定的树种或地名解释写死。所有脚注标记均置于对应主文之后。
