base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: zh_hans
  text: 城中有一座坚固的塔[a]。城中所有的男女和所有的首领[b]都逃到那里，把自己关在里面，又登上了塔的屋顶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“设防的塔”。原文由“塔”和“力量、坚固”组合而成，强调其防御作用。
    reason: lexical_alternative
  - marker: b
    text: 或译“城中所有主要人物”。原文直译为“城的主人”，在这里指城中居首位或掌权的人，并不一定泛指全体居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: 坚固的塔
  rationale: מִגְדָּל意为“塔”，עֹז表示力量、坚固或防御能力；“坚固的塔”自然明确，也保留了这座塔可作防御工事的含义。
- source_word: בְּתוֹךְ הָעִיר
  choice: 城中
  rationale: בְּתוֹךְ表示“在……之中”；“城中”简洁地保留其空间意义，不必强行限定为城市几何意义上的正中央。
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: 逃到那里
  rationale: נוּס的直接含义是“逃跑、逃离”；译文保留动作本身，不增添“避难”等虽合语境却未明说的目的。
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: 所有的男女
  rationale: 原文明确并列男人和女人；“所有的男女”以自然的现代汉语保留这一范围。
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: 和所有的首领
  rationale: בַּעֲלֵי字面可指“拥有者、主人”，在城邦语境中可指城中有地位、掌权的人；正文采用通顺的“首领”，并以脚注保留其他可能理解。
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: 把自己关在里面
  rationale: 该短语表达他们在自己身后关闭、将自己封闭在内；原文没有明说所关的是门，因此不补出具体宾语。
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: 登上了塔顶
  rationale: עָלָה表示上去，גַּג指建筑物的屋顶；汉语“登上塔顶”自然表达登上塔的顶部平台，避免生硬的“塔的屋顶”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“城中”避免把בְּתוֹךְ过度具体化为几何意义上的“正中央”；全句以短句和顺承结构呈现希伯来叙事的推进。
