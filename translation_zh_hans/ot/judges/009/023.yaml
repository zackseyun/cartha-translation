base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: zh_hans
  text: 于是，上帝差遣一个邪灵[a]到亚比米勒和示剑的首领[b]之间；示剑的首领就对亚比米勒行诡诈[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个有害的灵”。希伯来语既可强调邪恶的性质，也可强调造成伤害的作用。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“示剑的主人（或领主）”，这里很可能指城中掌权的要人或公民领袖。
    reason: lexical_alternative
  - marker: c
    text: 或译“背叛亚比米勒”或“对亚比米勒背信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 差来
  rationale: שׁלח在叙事中直指“差遣、派出”。“差来”在现代汉语中自然，也明确保留上帝的主动作用。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处指在审判中施行作为的真神；“上帝”是现代标准普通话中清楚、庄重的对应词。
- source_word: רוּחַ רָעָה
  choice: 一个邪灵
  rationale: 直译并保留רָעָה可能具有的道德邪恶意味；其也可侧重造成伤害，故在脚注中列出“有害的灵”。
- source_word: בֵּין ... וּבֵין
  choice: 使……彼此不和
  rationale: 字面为“在……与……之间”，在此语境中表示被置于双方之间而造成敌对或离间；此译法符合现代汉语，同时未具体化其作用机制。
- source_word: בַּעֲלֵי שְׁכֶם
  choice: 示剑的首领
  rationale: בַּעֲלֵי字面可指“主人、领主”，在本段城邦政治语境中更可能指示剑掌权的要人或公民领袖；“首领”清楚传达其社会政治身份。
- source_word: וַיִּבְגְּדוּ
  choice: 背叛
  rationale: בגד表示不忠、行诡诈或背信；在亚比米勒与示剑掌权者关系破裂的语境中，“背叛”简洁自然，并保留敌对的不忠行为。
- source_word: בַּאֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 介词ב与בגד连用标明背信行为所针对的对象；汉语动词“背叛”可直接带宾语，无须另译介词。
theological_decisions:
- issue: 上帝差遣邪灵的主动作用
  choice: 译作“上帝差来一个邪灵”
  alternative: “上帝容许一个邪灵”或“上帝任凭双方产生恶意”
  rationale: 希伯来文动词和句法直接把“差遣”归于上帝。译成单纯“容许”会削弱原文明确的神圣主动作用；本译文保留这一神学张力，不进一步解释次级因果或邪灵的性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“彼此不和”自然表达邪灵被差在双方“之间”所产生的离间作用；分号保持原文两个连续事件的推进关系。所有词序调整均为适应现代汉语，未削弱上帝的直接主动作用。
