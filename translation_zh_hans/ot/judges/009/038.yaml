base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: zh_hans
  text: 西布勒对他说：“你先前夸口说：‘亚比米勒算什么，我们竟要服事他？’如今你的豪言壮语[a]在哪里呢？这不就是你所藐视的那群人吗？现在出去跟他们交战吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“如今你的口在哪里？”这是嘲讽他先前大胆夸口的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: 如今你的豪言壮语在哪里呢
  rationale: 原文直译为“如今你的口在哪里”，是嘲讽迦勒先前大胆言论的习语。中文若直译为“你的口在哪里”容易令人误解，故在正文传达其所指的夸口，同时用脚注保留原文意象。
- source_word: אֲשֶׁר תֹּאמַר
  choice: 你先前夸口说
  rationale: 关系从句指向迦勒先前所说的话；结合上下文及“口”的嘲讽语气，译作“先前夸口说”自然且清楚。
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: 亚比米勒算什么，我们竟要服事他
  rationale: “算什么”体现 מִי 在挑战话语中的轻蔑口吻；“竟要”保留 כִּי 所引出反问的抗拒意味。
- source_word: הֲלֹא זֶה הָעָם
  choice: 这不就是……那群人吗
  rationale: 保留 הֲלֹא 的反问形式；“那群人”在现代中文中自然指眼前作为敌军的集体。
- source_word: מָאַסְתָּה בּוֹ
  choice: 你所藐视的
  rationale: מאס 在此含拒斥、轻蔑之意；“藐视”切合西布勒挑衅和讥讽的语气。
- source_word: צֵא נָא עַתָּה
  choice: 现在出去
  rationale: צֵא 是出城迎战的命令；נָא 在此加强催促或挑战，而非礼貌请求，因此不译作“请”。
- source_word: וְהִלָּחֶם בּוֹ
  choice: 跟他们交战
  rationale: 介词代词形式为阳性单数，但其先行词 הָעָם 是语法上的集合单数；中文按语义自然译为复数“他们”，指亚比米勒率领的那群人。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而有力度的叙事语言。直接引语保留西布勒的讥讽和挑战语气；“服事”延续圣经语境中臣服于统治者的表达，又不加入额外的神学含义。
