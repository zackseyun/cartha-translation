  naturalness: 修订后语句在现代标准汉语中顺畅。“统治自己”清楚表达反身关系；引号内以“请作王统治我们”保留请求语气及王权关系。
  terminology: “膏立”恰当保留משׁח的礼仪性、具体意象和设立君王的含义；“橄榄树”“作王”“统治”均符合本段拟人寓言及现代汉语宗教文本的庄重语域。
