  rationale: 将“出去”改为“出发去”，更贴近原文对“去”的强调，并保持寓言开头“有一次”的自然叙述感。将“治理”统一为“统治”，使君王对臣民的权柄关系更直接；其余内容及脚注锚点均予以保留。
