  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: zh_hans
  text: 有一次，树木出发去膏立一位王统治自己。它们对橄榄树说：“请作王统治我们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: 有一次……出去
  rationale: 原文以不定式绝对形配合同根限定动词，形成“去，他们去了”的强调表达。正文用自然的现代汉语引入寓言叙事，并以脚注保留原文的强调形式及其他译法。
- source_word: הָעֵצִים
  choice: 树木
  rationale: 复数名词在约坦的寓言中指拟人化的众树；“树木”自然且能涵盖多种树。
- source_word: לִמְשֹׁחַ
  choice: 膏立
  rationale: משׁח指以膏抹设立人担任职分；“膏立”既保留具体的膏抹意象，也表达立王的政治含义。
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: 一位王治理它们
  rationale: מֶלֶךְ在此为非特指的“一位王”；介词עַל表示在它们之上掌权。译作“治理它们”符合现代汉语，同时保留统治关系。
- source_word: לַזַּיִת
  choice: 对橄榄树
  rationale: זַיִת可指橄榄或橄榄树；这里是拟人化的受话者，明确译为“橄榄树”最自然。
- source_word: מְלֹכָה עָלֵינוּ
  choice: 请作王治理我们
  rationale: מְלֹכָה是“作王、掌权”的命令式，עָלֵינוּ表示在我们之上。加“请”符合汉语中对直接命令的自然表达，不削弱其请求橄榄树作王的含义。
