base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: zh_hans
  text: 亚比米勒和跟随他的首领冲上前去，站在城门入口；其余两支队伍[a]则冲向田野里所有的人，把他们击倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“两个首领”。结合上文亚比米勒把人分成三队，这里很可能是指其余两支队伍。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: 冲上前去／冲向
  rationale: 该动词在此军事语境中表示迅速展开进攻；按两个分句的对象分别译作“冲上前去”和“冲向”，自然地表达突击行动。
- source_word: הָרָאשִׁים
  choice: 首领
  rationale: 原义为“头”，此处指与亚比米勒一同领队的人；“首领”既保留人员所指，也符合军事组织语境。
- source_word: וַיַּעַמְדוּ
  choice: 站在
  rationale: 直接对应“站立”，在进军语境中自然含有据守、就位之意，无须在正文中额外解释。
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: 城门入口
  rationale: 保留“城门的开口／入口”这一具体空间含义，同时符合现代汉语表达。
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: 另外两个队伍
  rationale: 马所拉文本字面为“两个首领”，但上文刚说军队分成三队，此处很可能指其余两队。正文采用语境所指，并以脚注保留字面形式和歧义。
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: 田野里所有的人
  rationale: 后接复数宾语代词“他们”，表明对象是田野中的人；如此翻译可清楚传达隐含的人称所指。
- source_word: וַיַּכּוּם
  choice: 把他们击倒
  rationale: נכה 可指击打、击倒或杀死；“击倒”保留暴力结果，又不武断断定每个人都被杀死。
theological_decisions: []
