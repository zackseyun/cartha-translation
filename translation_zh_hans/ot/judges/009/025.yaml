base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: zh_hans
  text: 示剑的首领[a]在山顶上布置伏兵来对付亚比米勒；他们抢劫所有从那条路经过的人。这事传到了亚比米勒那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”也可译作“居民”或“权贵”。原文用词字面意思是示剑的“主人”或“掌权者”，在这里可指城中的领头人物或掌权者。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: 示剑的首领
  rationale: בַעֲלֵי 字面可指“主人、掌权者”，在这里是示剑城中具有政治和社会权力的人。“首领”自然地表达其身份，同时以脚注保留“居民、权贵”等可能理解。
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: 设下埋伏，要对付亚比米勒
  rationale: שׂים 与复数分词 מְאָרְבִים 构成设置伏兵的表达；中文用“设下埋伏”自然清楚。לוֹ 所指是亚比米勒；第二分句再次明说其名，可避免中文代词指向不清。
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: 在山顶上
  rationale: 原文直译为“在群山的头顶上”。“山顶上”既保留高处设伏的空间意义，也符合现代汉语习惯。
- source_word: וַיִּגְזְלוּ
  choice: 抢劫
  rationale: גזל 表示以强力夺取财物；此处对象是路上的行人，“抢劫”比泛指战利品掠夺的“劫掠”更贴切。
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: 所有从那条路经过的人
  rationale: כָּל 配单数动词具有逐一涵盖的意味。“所有……的人”准确表达每个经过者；“那条路”体现原文定冠词。
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: 这事也被报告给了亚比米勒
  rationale: 原文为被动形式，没有说明报告者。保留被动表达，可避免补入原文未指明的主体。
theological_decisions: []
