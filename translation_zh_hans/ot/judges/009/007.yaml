base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: zh_hans
  text: 有人把这事告诉约坦，他就去站在基利心山顶上，放声向他们呼喊说：“示剑的首领们[a]，你们要听我，好让上帝也听你们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领们”原文直译为“主人们”或“拥有者们”，这里指示剑掌权的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“愿上帝也听你们。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: 有人把这事告诉约坦
  rationale: 原文主语为未明示身份的复数“他们”；现代汉语用“有人”自然表达不定施事。“这事”为汉语叙事中根据上文补出的必要承接语，并未增添具体内容。
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד
  choice: 他就去站在
  rationale: 保留连续叙事动作，同时以“就”使现代汉语衔接自然。
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: 在基利心山顶上
  rationale: רֹאשׁ用于地形时指顶部或山顶；“基利心山”采用通行中文地名。
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא
  choice: 放声向他们呼喊
  rationale: 两个动词共同描写约坦提高音量、公开喊话；“放声……呼喊”既传达希伯来语强调，也避免生硬直译为“举起他的声音”。
- source_word: בַּעֲלֵי שְׁכֶם
  choice: 示剑的首领们
  rationale: בַּעֲלֵי字面为“主人、拥有者”；在本段语境中指示剑掌权或居领导地位的人。“首领们”在现代汉语中清楚自然，脚注保留其较直译的词义。
- source_word: שִׁמְעוּ אֵלַי
  choice: 你们要听我
  rationale: שׁמע与אֶל连用表示听从或留心听某人；此处保留命令语气。
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: 好让上帝也听你们
  rationale: 将连接词加未完成式理解为承接命令的目的或结果：“听我，好让上帝也听你们”。重复“听”以保留原文修辞对应。
theological_decisions:
- issue: 约坦末句中连接词与未完成式的语气
  choice: 译作目的或结果：“好让上帝也听你们”
  alternative: 也可译作并列的愿望：“愿上帝也听你们”
  rationale: 希伯来语וְ加未完成式既可承接前面的命令，表达目的或结果，也可能带祈愿语气。正文采用更符合整句修辞对应的目的式理解，脚注保留真实存在的另一种读法，不将其扩展为额外的教义断言。
- issue: אֱלֹהִים的所指
  choice: 上帝
  alternative: 神明
  rationale: 动词יִשְׁמַע为阳性单数，且语境支持单数所指，因此译作“上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“放声向他们呼喊”自然传达公开高声说话的场景；直接引语保留命令与回应之间“听”的修辞呼应。脚注标记均放在对应词句之后。
