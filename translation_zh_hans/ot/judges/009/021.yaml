  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: zh_hans
  text: 约坦便逃走并脱身，往比珥[a]去，住在那里，躲避他的兄弟亚比米勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作地名“比拉”。希伯来文“בְּאֵרָה”可理解为地名“比珥”加方向词尾，意为“往比珥”；也可视为完整的地名形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: 逃跑
  rationale: נוּס表示因危险而逃离；“逃跑”在现代汉语叙事中自然清楚。
- source_word: וַיִּבְרַח
  choice: 脱了身
  rationale: בָּרַח同样表示逃离。原文连续使用两个近义动词；译为“逃跑，脱了身”既保留强调性的复叠，又避免汉语生硬重复。
- source_word: בְּאֵרָה
  choice: 往比珥去
  rationale: 最自然的形态分析是地名בְּאֵר（比珥）带方向词尾־ָה，意为“往比珥”；同时以脚注保留把完整形式视为地名“比拉”的可能。
- source_word: וַיֵּשֶׁב שָׁם
  choice: 住在那里
  rationale: יָשַׁב在此处表示居住或停留；“住在那里”符合现代汉语叙事语体。
- source_word: מִפְּנֵי
  choice: 躲避
  rationale: 该介词本义涉及“离开……面前”，在此语境中说明约坦远离亚比米勒以避开其威胁；“躲避”自然表达这一空间与处境含义，又不额外明说“害怕”。
- source_word: אָחִיו
  choice: 他的兄弟
  rationale: 明确保留原文的亲属称谓及第三人称阳性单数领属关系，凸显叙事中的家庭冲突。
