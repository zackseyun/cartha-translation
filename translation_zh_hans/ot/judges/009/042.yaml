  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: zh_hans
  text: 第二天，百姓到田野里去；有人把这事报告给亚比米勒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: 第二天
  rationale: 希伯来叙事结构引出随后发生的事；现代汉语用“第二天”即可自然表达时间推进，不必机械译出“事情发生了”。
- source_word: וַיֵּצֵא הָעָם
  choice: 百姓……去
  rationale: עם是指集体的民众，并不限定为男性；יצא在这里表示从城中出去。
- source_word: הַשָּׂדֶה
  choice: 到田野里
  rationale: שדה指城外的田地或开阔地；结合“出去”，译作“到田野里去”符合现代汉语表达。
- source_word: וַיַּגִּדוּ
  choice: 有人把这事报告了
  rationale: 原文是第三人称复数“他们告诉”，主语并未指明；汉语用不定指的“有人”可自然保留这一点。“这事”指百姓出到田野之事，是汉语中报告动词所需的自然补足。
- source_word: לַאֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 按普通话圣经人名的通行译法音译 Abimelech。
