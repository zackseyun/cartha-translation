id: JDG.9.15
reference: Judges 9:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הָ/אָטָד֮ אֶל הָ/עֵצִים֒ אִ֡ם בֶּ/אֱמֶ֣ת אַתֶּם֩ מֹשְׁחִ֨ים אֹתִ֤/י לְ/מֶ֨לֶךְ֙ עֲלֵי/כֶ֔ם בֹּ֖אוּ חֲס֣וּ בְ/צִלִּ֑/י וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מִן הָ֣/אָטָ֔ד וְ/תֹאכַ֖ל אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: zh_hans
  text: 荆棘[a]对众树说：“你们若真心膏立我作王统治你们，就来，到我的荫下寻求庇护[b]；不然，愿火从荆棘中出来[c]，吞灭黎巴嫩的香柏树。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“刺灌木”。希伯来语 אָטָד 指一种多刺的灌木，具体树种不能确定。
    reason: lexical_alternative
  - marker: b
    text: “寻求庇护”也可译作“投靠”。荆棘实际能提供的树荫很少，因此这句话可能带有反讽意味。
    reason: lexical_alternative
  - marker: c
    text: 或译“火必从荆棘中出来”。这里的希伯来语动词既可理解为咒诅式的祈愿，也可理解为对结果的预告。
    reason: textual_ambiguity
lexical_decisions:
- source_word: הָאָטָד
  choice: 荆棘
  rationale: 该词指多刺的灌木。“荆棘”简明自然，并保留寓言中低矮多刺的灌木与高大名贵树木之间的鲜明反差。
- source_word: אִם בֶּאֱמֶת
  choice: 若真心
  rationale: 这里强调膏立行动是否出于真实、诚意；“若真心”在现代汉语中自然地保留了条件性的质问。
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: 膏立我作王
  rationale: 保留 משׁח 的具体膏立意象及其君王语境，不将其弱化为一般的任命或拥立。
- source_word: עֲלֵיכֶם
  choice: 统治你们
  rationale: 在君王语境中，介词 עַל 表达对臣民的管辖；译出“统治”可使现代读者清楚理解其关系。
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: 就来，到我的荫下寻求庇护
  rationale: 既保留“来”的命令，也传达 חסה 所含寻求保护、投靠的意思，并明确保留“荫下”这一带有反讽意味的具体形象。
- source_word: וְאִם אַיִן
  choice: 不然
  rationale: 简洁自然地引出条件不成立时的相反结果。
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: 愿火从荆棘中出来
  rationale: 未完成式在此可有祈愿或咒诅式语气；“愿”保留这一意志语气，同时以脚注说明也可能理解为预告。
- source_word: וְתֹאכַל
  choice: 吞灭
  rationale: 火“吞吃”是希伯来语常见拟人表达；“吞灭”既保留强烈形象，也符合现代庄重汉语。
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: 黎巴嫩的香柏树
  rationale: 这是该固定地理与树种称谓的自然汉译，也保留香柏树高大尊贵的文学联想。
theological_decisions:
- issue: 荆棘之言的反讽是否在正文中明说
  choice: 不在正文中解释，只在脚注提示
  alternative: 在正文中加入“其实无荫可蔽”等解释
  rationale: 原文通过荆棘邀请众树投靠其荫下自然形成反讽；直接解释会超出原文并削弱寓言张力。
- issue: 火出来的动词语气
  choice: 正文译作祈愿式“愿火……出来”
  alternative: 译作陈述或预告式“必有火……出来”
  rationale: 希伯来语形式在此可作咒诅式祈愿，也可理解为未来结果的宣告；正文采用祈愿式，并以脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“膏立”保留圣经君王语境中的关键动作；“荫下”“吞灭”“黎巴嫩的香柏树”维持寓言的意象与文学对比。标点按照现代简体中文规范处理。
