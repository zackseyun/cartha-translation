base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: zh_hans
  text: 他带领众人，把他们分成三队[a]，在田野里埋伏。他看见城中的人正出来，就起来攻击他们，击打他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分成三队”原文直译为“分成三个‘头’”；“头”在这里是指分队或队伍的希伯来语习语。
    reason: 说明原文习语及其字面意义。
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  choice: 他带着众人
  rationale: עָם直译为“人民、众人”；在本节军事语境中指亚比米勒率领的人。“众人”保留原文的一般称谓，不擅自明确为“士兵”或“军队”。
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: 把他们分成三队
  rationale: חצה意为“分开”，רָאשִׁים字面为“头”，此处是指分队或队伍的习语。“三队”符合现代汉语军事叙事，也保留了分为三个单位的意思。
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: 埋伏在田野
  rationale: ארב表示埋伏等候；“埋伏”自然、准确。בַּשָּׂדֶה译作“在田野”，不把地点窄化为某块特定田地。
- source_word: וַיַּרְא וְהִנֵּה
  choice: 他看见
  rationale: הִנֵּה使叙述生动，突出眼前所见；现代汉语用“看见”结合后文正在发生的动作，可自然表达其功能，避免生硬译成“看哪”。
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: 城里的人正出来
  rationale: 分词יֹצֵא表示他看见时动作正在进行，“正出来”体现这一过程；将所属地点前置为“城里的人”，使汉语清楚自然。
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: 就起来攻击他们
  rationale: קום על既可直译为“起来反对”，也可按语境理解为发动攻击；保留“起来”兼顾原文形式，以“攻击”明确此处军事行动。
- source_word: וַיַּכֵּם
  choice: 把他们击倒
  rationale: נכה可指击打、打败或杀死，本词本身未必明确每个人都被杀。“击倒”表达猛烈而有效的打击，同时避免过度译为“杀死”。
