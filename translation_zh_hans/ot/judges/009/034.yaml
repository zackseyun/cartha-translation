base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: zh_hans
  text: 亚比米勒和跟随他的众人夜间起来，分成四队[a]，在示剑一带设下埋伏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“四个头”，这里指四个队伍或分队。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的叙事形式表示起身并开始行动；“起来”既保留具体动作，也不把含义过度限定为“出发”。
- source_word: לָיְלָה
  choice: 夜间
  rationale: 这是表示时间的副词性用法；“夜间”自然简洁，不暗示行动持续了整夜。
- source_word: וַיֶּאֶרְבוּ
  choice: 埋伏
  rationale: ארב表示隐蔽等候、伺机袭击；“埋伏”准确传达此处的军事行动。
- source_word: עַל שְׁכֶם
  choice: 在示剑城外
  rationale: 介词עַל与“埋伏”连用时可兼有地点和针对目标的意味。结合上下文，“在示剑城外”自然表达伏兵针对示剑、部署在城外，同时避免误解为已经进入城内。
- source_word: אַרְבָּעָה רָאשִׁים
  choice: 分成四队
  rationale: 原文直译为“四个头”，在此指四个独立的队伍或分队；“分成四队”符合现代汉语的军事语境。
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: 跟随他的众人
  rationale: עָם本义较宽泛，为“民、众人”；上下文虽属军事行动，原文并未明确写“士兵”，所以不将其具体化为“军队”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“跟随他的众人”保留原文用词的宽泛性；脚注标记置于其实际说明的“四队”之后，以免误指“夜间”。
