  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: zh_hans
  text: 但有一个妇人把一块上磨石[a]扔到亚比米勒头上，砸碎了他的头骨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一块上磨石的碎片”；希伯来语可能着重指上磨石的一部分或碎块。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: 扔在
  rationale: שׁלך在叙事中表示主动投掷；“扔在……头上”自然、直接，也不弱化动作。
- source_word: אִשָּׁה אַחַת
  choice: 有一个妇人
  rationale: 直译为“一个妇人”；在希伯来叙事中也有不定指作用。“有一个妇人”既符合现代汉语叙事习惯，又保留对这位未具名妇人的聚焦。
- source_word: פֶּלַח רֶכֶב
  choice: 一块上磨石
  rationale: רֶכֶב特指磨的上石，פֶּלַח可指一块、一个部分。“一块上磨石”保留两词的词义信息；脚注说明也可能强调上磨石的碎块或一部分。
- source_word: עַל רֹאשׁ
  choice: 在……头上
  rationale: 准确表达空间关系，符合现代汉语习惯。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用现代中文圣经中通行且易识别的人名音译。
- source_word: וַתָּרִץ
  choice: 砸碎了
  rationale: רצץ表示压碎、击碎；结合磨石击中头部的语境，“砸碎了”既呈现结果，也自然承接前一动作。
- source_word: גֻּלְגָּלְתּוֹ
  choice: 他的头骨
  rationale: 该名词明确指头骨，而非泛指头部；译为“头骨”保留其解剖意义和叙事力度。
