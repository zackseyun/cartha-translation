base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: zh_hans
  text: 葡萄树却对它们说：“我岂能停止出产使神明和人欢喜的新酒[a]，去在众树之上摇曳呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使神明和人欢喜”，或译：“使上帝和人欢喜。”
    reason: 希伯来语אֱלֹהִים词形为复数，但也常用作对独一上帝的称呼；本句两种理解均有可能。
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: 葡萄树
  rationale: 指约坦寓言中说话的植物；“葡萄树”在现代汉语中明确、自然。
- source_word: הֶחֳדַלְתִּי
  choice: 我岂能停止出产
  rationale: 该完成式在上下文中构成反问，表达“难道我要停止……吗”；补出“出产”使其与宾语“我的新酒”的关系符合自然汉语。
- source_word: תִּירוֹשִׁי
  choice: 我的新酒
  rationale: תִּירוֹשׁ通常指新酿或新出的酒；“新酒”保留了它与一般“酒”的词义区别。
- source_word: הַמְשַׂמֵּחַ
  choice: 使……欢喜的
  rationale: 保留使役分词“使之欢喜”的含义，并自然修饰“新酒”。
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: 神明和人
  rationale: אֱלֹהִים在形态上是复数；寓言语境允许理解为诸神或神明。“神明”在中文中既表达复数类别，也避免把本句直接限定为以色列的独一上帝。传统的单数理解保留在脚注。
- source_word: וְהָלַכְתִּי
  choice: 去
  rationale: 承接反问，表达离开原有职分而前去做另一件事。
- source_word: לָנוּעַ
  choice: 摇曳
  rationale: 保留枝叶来回摆动的形象，同时借“在众树之上”暗示统治地位；不直接译成“统治”，以免抹去寓言的双关意象。
- source_word: עַל הָעֵצִים
  choice: 在众树之上
  rationale: 兼顾空间上的“在……之上”和权柄上的“居于……之上”。“众树”比单纯“树木”更适合寓言中的群体所指。
theological_decisions:
- issue: אֱלֹהִים在“使אֱלֹהִים和人欢喜”中的数与所指
  choice: 正文译作“神明”，按复数类别理解
  alternative: “上帝和人”
  rationale: 希伯来词形为复数，而寓言语境及古代惯用表达支持复数理解；但אֱלֹהִים也常可指单数的上帝，因此不排除传统单数读法，并以脚注保存这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的寓言语体。“岂能……呢”传达原文反问；“摇曳在众树之上”保留葡萄树摆动与作王掌权之间的意象张力。
