base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: zh_hans
  text: 如今，你们若是诚实正直地行事，并立亚比米勒为王；若是善待耶路巴力和他的家；若是按他双手所做的，给他相应的对待，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 作为话语转折，引出约坦接下来的条件式质问；“如今”在现代汉语中自然庄重，也保留时间与推论色彩。
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: 诚实正直地
  rationale: 两个伦理用语共同描述行为真实可靠、完整无亏；合译为“诚实正直地”简洁自然，并保留并列的道德含义。
- source_word: וַתַּמְלִיכוּ אֶת־אֲבִימֶלֶךְ
  choice: 立亚比米勒为王
  rationale: 使役词形表示使某人作王；“立……为王”是清楚、庄重的现代汉语表达。
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: 善待了
  rationale: 希伯来语直译为“向……行善”，这里指以好的方式对待某人；“善待”准确而自然。
- source_word: יְרֻבַּעַל
  choice: 耶路巴力
  rationale: 原文在此使用“耶路巴力”而非“基甸”，故保留该名字的具体形式。
- source_word: בֵּיתוֹ
  choice: 他的家
  rationale: “家”既可涵盖家人，也保留希伯来语“家”可能具有的家族范围，避免过度缩窄为同住的家庭成员。
- source_word: כִּגְמוּל יָדָיו עֲשִׂיתֶם לוֹ
  choice: 按他双手所做的报答他
  rationale: 保留“手”的具体意象，同时表达按一个人的作为给予相应回报；上下文会显出此条件句的反讽意味，但译文不替原文明确判定。
theological_decisions:
- issue: 条件句是否断定示剑人确实正直行事
  choice: 保留连续的“若是”条件表达
  alternative: 译成直接谴责或反讽断言
  rationale: 本节以多个אִם引出约坦的修辞性条件，真正结论在后文展开；不应在本节中提前把潜在反讽改写成明说的定罪。
- issue: “耶路巴力的家”的范围
  choice: 保留“家”
  alternative: 明确译为“家人”或“家族”
  rationale: 原词בַּיִת可涵盖家庭、家族或家室；“家”保存其语义宽度，也与后文基甸众子的遭遇相衔接。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号呈现三个递进的条件分句，并用句末逗号表明句意延续到下一节。人名按常用圣经译名处理；具体的“手”意象予以保留。
