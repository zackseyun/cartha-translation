base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: zh_hans
  text: 他们出去到田野，采摘自己葡萄园里的葡萄，踩踏葡萄，又举行庆典[a]。随后，他们进入自己神明的庙宇[b]，吃喝，并咒诅亚比米勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欢庆作乐”。这里的希伯来语指节庆性的欢庆，按上下文很可能与葡萄收成有关。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们众神的庙宇”。“神明”所对应的希伯来语形式可理解为复数，但这里也可能是单数含义，指这座庙宇所供奉的神。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: 他们到田野去
  rationale: 保留方向性，表达众人从城中出去、前往田野的动作；现代汉语自然简洁。
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: 采摘自己葡萄园里的葡萄
  rationale: בצר 在葡萄园语境中特指采摘葡萄；明确补出“葡萄”，避免误解为一般收割。
- source_word: וַיִּדְרְכוּ
  choice: 踩榨葡萄
  rationale: 该动词在此指用脚踩压葡萄以榨汁；“踩榨”既保留具体动作，也符合现代汉语表达。
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: 举行庆典
  rationale: הִלּוּלִים 表示欢庆活动，在本语境中很可能与葡萄收成有关；正文不把尚未完全确定的仪式性质说死。
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: 自己神明的庙宇
  rationale: “庙宇”自然表达敬拜场所；“神明”在汉语中不强制标明单复数，适合保留 אֱלֹהֵיהֶם 在形式与语境之间的张力。
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: 吃喝
  rationale: 直接保留原文并列动作，不额外加入“宴饮”等解释性成分。
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: 咒诅亚比米勒
  rationale: קלל 的加强词干在此表示咒诅，强于单纯辱骂；“咒诅”准确保留其力度。
theological_decisions:
- issue: 异教语境中 אֱלֹהֵיהֶם 的数
  choice: 自己神明的庙宇
  alternative: 他们众神的庙宇
  rationale: 该词形式上可按复数理解，但叙事场景也很可能指当地受崇拜的一位特定神祇。采用汉语中数目不显著的“神明”，并以脚注说明，可避免武断消除原文歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。叙事动词保持紧凑连贯；对葡萄踩榨作必要明示，对庆典性质及“神明”的单复数则借脚注保留原文的不确定性。
