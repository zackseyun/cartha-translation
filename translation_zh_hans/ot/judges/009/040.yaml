base_translation:
  language: en
  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: zh_hans
  text: 亚比米勒追赶他，他就从亚比米勒面前逃跑；许多被杀的人仆倒，直到城门口[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“许多被杀的人仆倒”。原文将“仆倒”与“被杀者”并置，生动描写战场上的死伤；也可意译为“许多人被击倒，直到城门口”。
    reason: 说明 חֲלָלִים 与 נפל 的战斗用语，并给出不添加“沿途”含义的自然意译。
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: 追赶他
  rationale: רדף在这里指追击敌人；“追赶”直接保留军事语境，宾语代词“他”按原文保留，所指可由上文确定。
- source_word: וַיָּנָס
  choice: 他就……逃跑
  rationale: נוס意为逃跑、逃离；单数主语承接上文的迦勒。
- source_word: מִפָּנָיו
  choice: 从亚比米勒面前
  rationale: 原义为“从他面前”；中文若连续使用两个“他”容易混淆，因此重提亚比米勒之名，同时保留“从……面前逃跑”的希伯来语意象。
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: 许多被杀的人倒下
  rationale: נפל是“倒下”，חללים指战斗中被杀或受致命伤者。译文保留“被杀的人倒下”这一鲜明而略带重复的战场表达，不改写为较抽象的“伤亡惨重”。
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: 一直到城门口
  rationale: פתח השער指城门的开口或入口；现代汉语通常自然地说“城门口”，“一直到”表达 עַד 所标示的范围终点。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前半句为避免代词指向含混，第二处代词明确译作“亚比米勒”；后半句则尽量保留原文简洁、鲜明的战场意象。
