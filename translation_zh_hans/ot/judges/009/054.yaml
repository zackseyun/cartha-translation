  text: וַ/יִּקְרָ֨א מְהֵרָ֜ה אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁלֹ֤ף חַרְבְּ/ךָ֙ וּ/מ֣וֹתְתֵ֔/נִי פֶּן יֹ֥אמְרוּ לִ֖/י אִשָּׁ֣ה הֲרָגָ֑תְ/הוּ וַ/יִּדְקְרֵ֥/הוּ נַעֲר֖/וֹ וַ/יָּמֹֽת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: zh_hans
  text: 他急忙呼叫那替他拿兵器的年轻人[a]，对他说：“拔出你的刀，杀了我，免得人说：‘一个女人杀了他。’”他的年轻人便刺穿了他，他就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “替他拿兵器的年轻人”也可按其职务译作“拿兵器的侍从”。原文后面又称他为“他的年轻人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: 他赶紧叫……来
  rationale: 叙事式动词推进情节；מְהֵרָה表示急迫迅速。“赶紧”自然传达当时的紧迫感。
- source_word: הַנַּעַר
  choice: 年轻人
  rationale: נַעַר通常指少年或年轻男子；此处虽担任侍从职务，正文保留其基本词义。
- source_word: נֹשֵׂא כֵלָיו
  choice: 为他拿兵器的
  rationale: 该短语直指替他携带器具或武器的人；结合军事语境译作“兵器”，既明确又不过度限定为铠甲。
- source_word: שְׁלֹף חַרְבְּךָ
  choice: 拔出你的刀
  rationale: שְׁלֹף表示从鞘中拔出，חֶרֶב是古代近战刃器；“拔出你的刀”是自然、准确的现代汉语表达。
- source_word: וּמוֹתְתֵנִי
  choice: 杀了我
  rationale: 此处为使其死亡的直接命令；“杀了我”简洁传达原文力度。
- source_word: פֶּן יֹאמְרוּ לִי
  choice: 免得人们谈起我说
  rationale: פֶּן引出所要避免的结果；介词短语לִי在语境中指别人论及他说什么，而非当面对他说。
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: 一个女人杀了他
  rationale: 保留原文主动句和句首的“女人”，从而维持人物所惧怕的羞辱意味，不替叙述者认可这种价值判断。
- source_word: וַיִּדְקְרֵהוּ
  choice: 就把他刺透
  rationale: דקר表示以尖锐武器刺入或刺穿；“刺透”保留动作的具体性。
- source_word: נַעֲרוֹ
  choice: 他的年轻人
  rationale: 与本节前面的נַעַר保持词汇呼应；虽略带希伯来叙事色彩，仍可理解为随侍他的年轻人。
- source_word: וַיָּמֹת
  choice: 他便死了
  rationale: 直接陈述动作结果，并以“便”自然衔接前一动作。
