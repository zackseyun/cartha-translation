base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: zh_hans
  text: 到了早晨，太阳一出来，你就要早早起身，向城发起攻击。看哪，他和跟随他的人出来迎向你时，你就照自己所能办到的去对付他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译是“照你的手所能找到的”，意思是按你当时的能力或所得的机会行事。
    reason: 说明希伯来语习语，同时保留它可能兼指能力与机会的含义。
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: 到了早晨
  rationale: וְהָיָה在这里推进作战指示的时间顺序；“到了早晨”自然表达“然后，早晨来临时”的意思。
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: 太阳一出来
  rationale: כ加不定式结构表示时间；“一……就……”中的前半句传达日出之际立即行动的紧迫感。
- source_word: תַּשְׁכִּים
  choice: 你就要早早起身
  rationale: שׁכם的使役式在此指早起、及早开始；上下文是命令性的作战部署，因此用“要”表达指令语气。
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: 向城发起攻击
  rationale: פשט在军事语境中可指展开、突袭或进攻。“发起攻击”在现代汉语中自然，也保留其军事行动含义，而不额外限定具体阵形。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示听者注意随后情形的语篇标记；“看哪”庄重且为普通读者所能理解。
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: 他和跟随他的人
  rationale: עָם在这里指与该领袖一同来的人；未具体译成“军队”，避免超过原文所明说的范围。
- source_word: יֹצְאִים אֵלֶיךָ
  choice: 出来迎向你
  rationale: אֵלֶיךָ本义为“向你、到你这里”；“迎向你”保留方向性，同时让军事语境自然显明，但不把介词本身过度解释成“攻击你”。
- source_word: וְעָשִׂיתָ לּוֹ
  choice: 你就……对付他
  rationale: 保留单数代词“他”，主要指对方领袖；“对付”比逐字的“向他做”更符合现代汉语，同时适合作战语境。
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: 照你手所能做到的
  rationale: 尽量保留希伯来语以“手”表示能力或可乘之机的习语形象，并用脚注说明其含义，避免在正文中只选定“能力”或“机会”而消除原文的涵盖面。
