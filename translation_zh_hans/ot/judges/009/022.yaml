lexical_decisions:
- source_word: וַיָּשַׂר
  choice: 统治
  rationale: 该动词源自שׂרר，表示行使统治权或支配权；“统治”自然、准确地传达这里的政治含义，同时不额外赋予亚比米勒正统君王的称号。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: עַל יִשְׂרָאֵל
  choice: 以色列
  rationale: 介词עַל与表示统治的动词连用，标明权力所及的对象；中文“统治以色列”已自然包含“在……之上掌权”的关系，无须直译介词。
- source_word: שָׁלֹשׁ שָׁנִים
  choice: 三年
  rationale: 直接表达统治持续的时长，符合现代汉语习惯。
theological_decisions:
- issue: 亚比米勒权力的性质
  choice: 译作“统治”，不称他为“王”
  alternative: 作王／治理
  rationale: 原文使用שׂרר而非通常表示“作王”的מלך；因此保留其实际掌权的含义，却不据此确认其王位的合法性或正式身份。
