  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: zh_hans
  text: 亚比米勒住在亚鲁玛；西布勒把迦勒和他的弟兄赶走，不让他们住在示剑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把迦勒和他的弟兄赶出示剑，使他们不能住在那里。”希伯来文的不定式结构表示他们被排除、不能继续在那里居住。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב可表示坐、居住或停留；此处叙事语境中的“住在”自然简洁，不强行判定是短暂停驻还是长期定居。
- source_word: בָּארוּמָה
  choice: 在亚鲁玛
  rationale: 地名按现代中文圣经常用音译原则处理；介词בְּ译为“在”。
- source_word: וַיְגָרֶשׁ
  choice: 赶走
  rationale: גרשׁ表示驱逐、赶出；“赶走”既保留动作力度，又符合现代汉语叙事表达。
- source_word: זְבֻל
  choice: 西布勒
  rationale: 人名采用清楚、稳定的中文音译。
- source_word: גַּעַל
  choice: 迦勒
  rationale: 人名按中文圣经传统音译；此名与常见的“迦勒”同形，但上下文足以辨明人物。
- source_word: אֶחָיו
  choice: 他的弟兄
  rationale: אָח的基本义是兄弟；虽然也可泛指亲族或同伙，此处没有充分理由缩窄或扩展其含义。
- source_word: מִשֶּׁבֶת בִּשְׁכֶם
  choice: 不让他们住在示剑
  rationale: 介词מִן加ישׁב的不定式结构表示阻止或排除他们在那里居住；此译法自然呈现该结构的结果含义。
- source_word: בִּשְׁכֶם
  choice: 在示剑
  rationale: 地名采用通行中文译名，“在”准确表达地点关系。
