base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: zh_hans
  text: 巴不得这百姓落在我手中[a]，我就除掉亚比米勒！他就对亚比米勒说[b]：“扩充你的军队，出来吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式化可译：“谁能把这百姓交在我手中呢？我就除掉亚比米勒。”希伯来语“谁能给……”在这里是表达愿望的惯用语。
    reason: lexical_alternative
  - marker: b
    text: “扩充你的军队，出来吧！”很可能是向亚比米勒发出的挑衅；这话可能是直接说的，也可能是隔空或修辞性地说的。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: 巴不得
  rationale: “谁能给……”是希伯来语表达愿望的惯用语；“巴不得”以自然现代汉语传达强烈愿望。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留 עָם 的集合性含义，不将其过度限定为军队。
- source_word: בְּיָדִי
  choice: 落在我手中
  rationale: 保留“手”所表达的权柄、控制之隐喻，同时符合现代汉语习惯。
- source_word: וְאָסִירָה
  choice: 我就除掉
  rationale: סור 的使役式表示移除、除去；“除掉”保留其威胁意味，却不明确限定为杀死、驱逐或废黜。
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: 他又对亚比米勒说
  rationale: 按 לְ 的通常受词用法译为“对……说”；上下文可理解为直接或修辞性的挑战。
- source_word: רַבֶּה צְבָאֲךָ
  choice: 增派你的军队
  rationale: רבה 的命令式要求使军队增多；“增派”在挑战敌军的语境中自然，并体现兵力增加。
- source_word: וָצֵאָה
  choice: 出来吧
  rationale: יצא 在向对手发出挑战时自然译为“出来”，语气词“吧”使汉语命令兼具挑衅口吻。
theological_decisions:
- issue: 对亚比米勒说话的方式
  choice: 正文译作“对亚比米勒说”，脚注说明可能是隔空或修辞性的挑战
  alternative: 译作“论到亚比米勒说”
  rationale: לַאֲבִימֶלֶךְ 通常表示言语所指向的对象，但叙事情境未必要求亚比米勒当场在场，因此保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“巴不得”自然表达强烈愿望；“除掉”有意不限定亚比米勒将被杀死、驱逐还是废黜。所有脚注标记均已置于正文相应位置。
