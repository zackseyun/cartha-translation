base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: zh_hans
  text: 示剑所有的领袖和米罗家所有的人[a]都聚集起来；他们前去，在示剑那棵立着的橡树旁[b]立亚比米勒为王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米罗家”原文直译为“米罗之家”；这里可能是地名、家族名或群体名称。
    reason: cultural_note
  - marker: b
    text: 原文此处较难确定，直译可作“立着的橡树”。“立着的”也可能指与橡树有关的柱石或立石；也可译为“在柱石旁的橡树旁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: 示剑所有的权贵
  rationale: בַּעֲלִים字面可指“主人、业主”，在此城邦政治语境中指示剑掌握权势的人；“权贵”既保留其地位意味，也不把范围扩大为全体居民。
- source_word: בֵּית מִלּוֹא
  choice: 米罗全族
  rationale: 该词组字面为“米罗之家”，在这里可能是地方、家族或群体名称。“米罗全族”以自然中文表达其集体性质，同时用脚注保留所指不确定性。
- source_word: וַיֵּאָסְפוּ
  choice: 聚集起来
  rationale: 准确表达该动词“聚集、集合”的叙事含义。
- source_word: וַיַּמְלִיכוּ אֶת־אֲבִימֶלֶךְ לְמֶלֶךְ
  choice: 立亚比米勒为王
  rationale: 使役形明确表示使亚比米勒作王；“立……为王”自然、庄重，也不额外加入加冕仪式。
- source_word: עִם
  choice: 在……旁
  rationale: 此处与地标连用，表示邻近位置；“在……旁”清楚表达拥立为王的地点。
- source_word: אֵלוֹן
  choice: 橡树
  rationale: 该词指大型树木，树种可能是橡树或笃耨香树；“橡树”是通行且易懂的译法。
- source_word: מֻצָּב
  choice: 立柱
  rationale: 该词源于“站立、设立”，在此可能指竖立之物、柱石或纪念标志。“立柱”保留其被立起的核心意象，具体关系则交由脚注说明。
