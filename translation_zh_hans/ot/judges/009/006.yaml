  rationale: 将“权贵”调整为“领袖”，以贴合此处城市政治领袖的含义；将“米罗全族”改为“米罗家所有的人”，避免在正文预断其为宗族。将“立柱橡树”改为“立着的橡树”，并以脚注明确说明该希伯来语短语的词义和句法歧义，避免把不确定的“柱石”关系强行固定为中文复合名词。
