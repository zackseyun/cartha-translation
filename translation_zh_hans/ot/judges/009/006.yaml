  source_fidelity: 译文准确传达了示剑的政治领袖聚集、与米罗相关的一群人共同前往、拥立亚比米勒为王，以及地点在示剑某一橡树／竖立物附近。惟“米罗全族”把不明的“米罗之家”较具体地定为宗族，宜改为较中性的“米罗家的人”。“立柱橡树”在现代汉语中容易被理解为形状如柱的橡树，未能清楚保留原文中橡树与竖立物之间关系不明的困难，宜以正文和脚注更审慎处理。
