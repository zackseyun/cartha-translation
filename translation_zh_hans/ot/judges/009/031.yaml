base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: zh_hans
  text: 他暗中派使者到亚比米勒那里去，说：“看哪，以别的儿子迦勒和他的弟兄们已经来到示剑；看哪，他们正在煽动这城反对你。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句所用的希伯来语动词含义不易确定。或译：“他们正在围困这城，要对付你。”也可理解为：“他们正在使这城与你为敌。”上下文更可能是说，迦勒一伙正在煽动示剑人反对亚比米勒。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: 他派使者
  rationale: 叙事性 wayyiqtol 用现代汉语的过去事件表达；מַלְאָכִים 在此指传递政治、军事消息的人，译作“使者”。
- source_word: בְּתָרְמָה
  choice: 暗中
  rationale: 该词在这里表示隐秘、带有策略性的传信方式；“暗中”自然传达秘密行动，同时避免在正文中过度强调道德判断。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、强调紧急报告的语用功能；“看哪”庄重而仍为现代读者所理解。
- source_word: גַעַל בֶּן עֶבֶד
  choice: 以别的儿子迦勒
  rationale: 采用中文圣经传统中常见的人名音译，并直接保留父子关系。
- source_word: וְאֶחָיו
  choice: 和他的弟兄们
  rationale: 原文直译为“他的弟兄”；虽可能泛指近亲或同伙，正文不将其含义窄化或改写。
- source_word: בָּאִים שְׁכֶמָה
  choice: 已经来到示剑
  rationale: 分词配合方向词尾表示他们已经来到、如今身在示剑；“已经来到”体现其当前相关性。
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: 正在煽动全城反对你
  rationale: צור 在此结构和上下文中的含义困难。鉴于后接“反对你”，政治上煽动示剑城民敌对亚比米勒较符合叙事情境；以脚注保留“围困”的较直译可能。
