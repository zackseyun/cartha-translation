  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: zh_hans
  text: 于是，所有的树都对荆棘丛[a]说：“你来作我们的王吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“刺灌木”。希伯来语 אָטָד 指一种多刺的灌木，具体品种不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 于是……说
  rationale: 连续式叙事动词推进情节；“于是”自然表达先后承接关系。
- source_word: כָל הָעֵצִים
  choice: 所有的树
  rationale: 忠实表达带定冠词的集合性主语，也符合寓言中树木拟人化的语境。
- source_word: הָאָטָד
  choice: 荆棘丛
  rationale: אָטָד指多刺的灌木，具体品种不能确定；“荆棘丛”在现代汉语中自然，并保留其低矮、多刺的形象。
- source_word: לֵךְ אַתָּה
  choice: 你来
  rationale: הלך置于另一个命令式之前，在此构成催促或召请；“来”比机械译作“去”更符合汉语对当面受召者的表达，并以“你”体现独立代词的强调。
- source_word: מְלָךְ עָלֵינוּ
  choice: 作王统治我们
  rationale: מְלָךְ表示作王、掌王权；“作王统治我们”既保留君王意象，也明确表达עָלֵינוּ所指的管辖关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你来……吧”使连续两个命令的语气在汉语中自然，同时保留对受召者“你”的强调。
