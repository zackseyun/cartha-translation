  text: וַ/יַּרְא גַּעַל֮ אֶת הָ/עָם֒ וַ/יֹּ֣אמֶר אֶל זְבֻ֔ל הִנֵּה עָ֣ם יוֹרֵ֔ד מֵ/רָאשֵׁ֖י הֶ/הָרִ֑ים וַ/יֹּ֤אמֶר אֵלָי/ו֙ זְבֻ֔ל אֵ֣ת צֵ֧ל הֶ/הָרִ֛ים אַתָּ֥ה רֹאֶ֖ה כָּ/אֲנָשִֽׁים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: zh_hans
  text: 迦勒看见那群人[a]，就对西布勒说：“看，一群人正从群山顶上下来。”西布勒对他说：“你把群山的影子看成人了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”或译“队伍”；本节所用的希伯来词可以泛指一群人，上下文中也可能指武装人员。
    reason: 保留עָם在泛指人群与语境中指队伍之间的词义幅度，避免正文把他们明确限定为士兵。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见
  rationale: ראה的Qal叙事形式在这里表示直接的视觉观察，“看见”准确而自然。
- source_word: הָעָם / עָם
  choice: 那群人 / 一群人
  rationale: עָם是集合名词，基本义为“人、民众”；上下文虽指正在逼近的武装人员，但原文没有明说“军队”，因此正文保留较宽泛的表达。定冠词的有无分别用“那群人”和“一群人”体现。
- source_word: הִנֵּה
  choice: 看
  rationale: 用现代汉语中自然的提醒语引导对方注意眼前景象，避免采用古雅的“看哪”。
- source_word: יוֹרֵד
  choice: 正……下来
  rationale: 分词表达正在发生的动作；עָם虽在希伯来语中按单数搭配，在汉语中按集合意义自然表达为“一群人正……下来”。
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: 从群山顶上
  rationale: רֹאשׁ在这里指山的顶部或峰顶；“群山顶上”简洁地保留复数含义。
- source_word: צֵל הֶהָרִים
  choice: 群山的影子
  rationale: צֵל可指影子或荫蔽处；此处涉及视觉误认，“影子”最合语境。
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: 你把……看成人了
  rationale: 该表达保留כ所表示的比较或视为关系，也自然传达西布勒所声称的误认。
- source_word: אֲנָשִׁים
  choice: 人
  rationale: 该词是阳性复数，但现代汉语“人”在此既准确又自然；上下文可让读者理解为人的身影，无须额外加入原文未明说的“士兵”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。人物对话简洁直接；“看”作为提醒语符合当代普通话。“你把……看成人了”既贴近原文结构，也清楚表达西布勒有意淡化迦勒所见之事。
