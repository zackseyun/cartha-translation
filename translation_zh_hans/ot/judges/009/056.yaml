  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֣שֶׁב אֱלֹהִ֔ים אֵ֖ת רָעַ֣ת אֲבִימֶ֑לֶךְ אֲשֶׁ֤ר עָשָׂה֙ לְ/אָבִ֔י/ו לַ/הֲרֹ֖ג אֶת שִׁבְעִ֥ים אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: zh_hans
  text: 这样，神使亚比米勒因杀害他七十个弟兄而加给他父亲的恶归到他自己身上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神报应了亚比米勒所行的恶。”希伯来语的习语是使他所行的恶回到他自己身上。
    reason: 说明“使恶归回”这一希伯来语习语，以及“报应”的司法性译法。
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: 使……归到他自己身上
  rationale: 该词是שׁוב的使役形，表达神使亚比米勒所行的恶回到他本人身上。此译保留希伯来语“使返回”的形象，也自然传达报应之意。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本句动词为单数，语境明确指施行审判的独一神。
- source_word: רָעַת
  choice: 所行的恶
  rationale: 这里既指亚比米勒在道德上的邪恶，也指具体的杀戮行为；“恶”保留其伦理分量。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֲשֶׁר עָשָׂה לְאָבִיו
  choice: 所行的恶……恶待了他的父亲
  rationale: 介词ל标明其父亲是这恶行所针对、所伤害的人；后一句用自然中文明确这种关系。
- source_word: לַהֲרֹג
  choice: 杀了
  rationale: 该不定式说明恶行的具体内容，即杀害弟兄。
- source_word: שִׁבְעִים אֶחָיו
  choice: 自己的七十个弟兄
  rationale: 直译亲属关系与数目；“自己的”清楚表明这些人也是亚比米勒的弟兄。
- source_word: וַ
  choice: 这样
  rationale: 连接词在此引出叙事总结及结果；“这样”比单纯的“于是”更能体现总结语气。
theological_decisions:
- issue: 神在审判中的主动作用
  choice: 神使亚比米勒所行的恶归到他自己身上
  alternative: 神容许亚比米勒自食其恶果
  rationale: 希伯来文以神为使役动词的明确主语，直接陈述神施行报应；译文不将这种主动作用弱化为单纯许可。
- issue: 亚比米勒之父如何受到伤害
  choice: 杀害七十个弟兄就是他恶待父亲的行为
  alternative: 亚比米勒直接杀害了父亲
  rationale: 原文说他向父亲行恶，随后以不定式说明杀害七十个弟兄；不可误译成父亲也是被杀者。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“归到他自己身上”保留原文形象；分号后的解释句理清希伯来语较紧凑的句法，同时不改变父亲、亚比米勒与七十个弟兄之间的关系。
