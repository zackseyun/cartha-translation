revisions:
- from: 这样，神使亚比米勒所行的恶归到他自己身上[a]；他杀了自己的七十个弟兄，恶待了他的父亲。
  to: 这样，神使亚比米勒因杀害他七十个弟兄而加给他父亲的恶归到他自己身上[a]。
  rationale: 修订保留“神使恶归回”的原文意象和神主动审判的陈述，并明确杀害七十个弟兄乃是亚比米勒借以恶待父亲的行为。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:21Z'
review_pass:
  verdict: revise
  source_fidelity: 原文将“杀害他七十个弟兄”作为亚比米勒“加给他父亲的恶”的具体内容。草稿用分号分成“他杀了……，恶待了他的父亲”两个并列陈述，虽大意接近，却弱化了原文中杀害弟兄正是恶待父亲的说明关系。修订将此关系明确纳入同一句。
  naturalness: “使……归到他自己身上”在庄重的现代汉语中自然，且能保留原文“使恶返回”的意象。将修饰语调整为“因杀害……而加给他父亲的恶”，句法清楚且不将父亲误作被杀者。
  terminology: “神”“亚比米勒”“恶”“七十个弟兄”均准确、通行，并保留神主动施行报应的表述。
  issues:
  - severity: medium
    issue: 原译以分号拆开了“杀害弟兄”与“加给父亲的恶”的句法关系。
    rationale: 希伯来文的 לַהֲרֹג 不定式说明“他向父亲所行的恶”的内容／方式；译文应避免使其读成两项独立的恶行。
  revised_text: 这样，神使亚比米勒因杀害他七十个弟兄而加给他父亲的恶归到他自己身上[a]。
  revised_footnotes:
