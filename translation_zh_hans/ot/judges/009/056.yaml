    reason: 说明“使恶归回”这一希伯来语习语，以及“报应”的司法性译法。
  revision_rationale: 修订保留“神使恶归回”的原文意象和神主动审判的陈述，并明确杀害七十个弟兄乃是亚比米勒借以恶待父亲的行为。
