  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: zh_hans
  text: 亚比米勒随后前往提备斯，在提备斯安营[a]，攻取了那城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在提备斯城外安营”或“对着提备斯安营”。希伯来语介词通常表示“在”；在这里的军事语境中，也可指在城附近或对城扎营。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 随后前往
  rationale: הלך在连续叙事形式中表示接续发生的行动；“随后前往”自然传达叙事推进，不额外加入原文未明说的“进军”色彩。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶל תֵּבֵץ
  choice: 前往提备斯
  rationale: אֶל首先表示朝向某地的移动；译作“前往”保留其基本方向意义，敌对含义由下文的军事行动表达。
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: 在提备斯城外安营
  rationale: חנה意为安营；在攻城语境中，בְּ接城市名表示在该城附近或对城扎营。中文“城外安营”清楚表达尚未进城而准备攻取的态势，同时用脚注说明介词本身的宽泛性。
- source_word: וַיִּלְכְּדָהּ
  choice: 攻取了那城
  rationale: לכד用于城市时通常指以军事行动夺取；阴性宾语后缀指向提备斯这座城。中文补出“那城”可明确指代，并保留军事语义。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“城外”属于语境性明示，不把敌对含义强加给前面的方向介词；脚注保留原文介词可较直译为“在”的可能。
