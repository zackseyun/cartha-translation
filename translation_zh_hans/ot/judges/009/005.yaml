base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: zh_hans
  text: 随后，他来到他父亲在俄弗拉的家，把他的弟兄，就是耶路巴力的儿子们，共七十人，杀在一块石头上。[a]只有耶路巴力最小的儿子约坦幸存下来，[b]因为他藏了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在一块石头上”可能指他们都在同一块作为行刑地点或工具的石头那里被杀，强调这七十人是在一处遭到集体杀害。
    reason: cultural_note
  - marker: b
    text: 或译：“被留下”或“留存下来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: 随后，他来到俄弗拉他父亲的家
  rationale: 叙事式连词推进情节；וַיָּבֹא按基本运动义译为“来到”。עָפְרָתָה带方向词尾，表示前往俄弗拉；整体依希伯来语次序自然调整为现代汉语。
- source_word: וַיַּהֲרֹג
  choice: 杀
  rationale: 保留动词的基本含义，不额外加入法律定性；行为的残酷与罪恶由上下文清楚显明。
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל
  choice: 他的弟兄，就是耶路巴力的儿子们
  rationale: 将“耶路巴力的儿子们”作为同位语，保留原文对这些弟兄身份的明确说明。
- source_word: שִׁבְעִים אִישׁ
  choice: 共七十人
  rationale: אִישׁ在数词之后可泛指人；此处对象是耶路巴力的众子。“共”使汉语数量关系清楚，但不改变原义。
- source_word: עַל אֶבֶן אֶחָת
  choice: 在一块石头上
  rationale: 直译原文的鲜明意象，不擅自判定石头的具体用途；可能指在同一块石头处集中行刑。
- source_word: וַיִּוָּתֵר
  choice: 幸存下来
  rationale: 该词的尼法勒形式表示被留下或剩余；在全句杀戮语境中，明确指仍然活着。译文将语境蕴含自然表达出来，同时脚注保留更贴近形式的译法。
- source_word: הַקָּטֹן
  choice: 最小的儿子
  rationale: 在家庭关系中，字面“幼小的”自然表示年纪最小者。
- source_word: כִּי נֶחְבָּא
  choice: 因为他藏了起来
  rationale: כִּי说明约坦得以幸存的原因；נחבא在此具有藏身、躲起来的语义。
