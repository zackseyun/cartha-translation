base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: zh_hans
  text: 耶路巴力的儿子亚比米勒到示剑去见他母亲的兄弟。他对他们和他母亲的父家[a]全族人说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他母亲的父亲的家”，指他母系亲属的家族或宗族。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 前往
  rationale: 该叙事动词推动情节向前；“前往”自然表达行动方向，不另加原文没有的显性时间词。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: בֶּן יְרֻבַּעַל
  choice: 耶路巴力的儿子
  rationale: 直接保留父子身份关系；“耶路巴力”按专名音译，不翻译其词义。
- source_word: שְׁכֶמָה
  choice: 前往示剑
  rationale: 地名后的方向词尾表示朝向示剑的移动，中文以“前往示剑”自然表达。
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: 到了他母亲的兄弟那里
  rationale: 保留“兄弟”的字面亲属称谓，而不直接改成“舅舅”，以避免抹去原文的表达方式；“到了……那里”使中文行文自然。
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: 他对他们……说
  rationale: דבר表示说话；结合后面的לֵאמֹר，中文合并为自然的引语导入结构。
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: 和……全族的人
  rationale: מִשְׁפָּחָה在此指较广的亲属群体，“全族的人”比现代汉语的“小家庭”更符合其社会范围。
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: 他母亲的父家
  rationale: 保留“家/家族”和母系亲属关系的源语结构，同时用脚注说明其具体所指。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接引语，中文以“说：”清楚衔接。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将较长的希伯来语并列句分为两句，以免中文结构拖沓；不添加“于是”“现在”等原文没有的显性时间标记。保留“他母亲的兄弟”和“他母亲的父家”等亲属表达，并以脚注解释古代家族用语。
