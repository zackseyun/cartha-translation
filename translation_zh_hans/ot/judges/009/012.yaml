base_translation:
  language: en
  yaml_path: translation/ot/judges/009/012.yaml
  text: Then the trees said to the vine[a], ‘Come, reign over us.’
translation:
  language: zh_hans
  text: 于是，众树对葡萄树说：“来吧，作我们的王。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“去吧，你在我们之上作王。”希伯来语字面用“去”，并明确说“你”；这里按现代汉语习惯译作“来吧，作我们的王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 于是……说
  rationale: 连续式叙事结构推进情节；“于是”符合现代汉语叙事习惯，并保留事件的先后关系。
- source_word: הָעֵצִים
  choice: 众树
  rationale: 在约坦寓言的语境中，复数 עֵץ 指多棵树，而不是木材；“众树”简洁自然，也适合拟人化叙事。
- source_word: לַגָּפֶן
  choice: 对葡萄树
  rationale: גֶּפֶן 指葡萄藤或葡萄树；此处与前文各类树木并列，汉语用“葡萄树”更自然，也能清楚表现拟人化对象。
- source_word: לְכִי
  choice: 来吧
  rationale: הלך 字面可作“去、走”，但此处与后续命令式连用，构成邀请对方采取行动的惯用表达；“来吧”在现代汉语中自然传达召请语气。
- source_word: אַתְּ
  choice: （由命令句主语省略体现）
  rationale: 该阴性单数代词与阴性名词“葡萄树”呼应。现代汉语命令句通常不必明说“你”，省略后更自然，且不损失指称。
- source_word: מְלֹכִי
  choice: 作……的王
  rationale: מלך 的阴性单数命令式表示担任君王、施行王权。现代汉语中对拟人化的葡萄树说“作我们的王”比“统治我们”更贴合本寓言反复提出立王的语境，同时保留君王意象。
- source_word: עָלֵינוּ
  choice: 我们的
  rationale: 介词 עַל 与 מלך 连用表示在某些人之上为王。汉语“作我们的王”自然表达“在我们之上作王”的关系。
