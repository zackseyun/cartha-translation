base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: zh_hans
  text: 城里的首领西布听见以别的儿子迦勒所说的话，就怒火中烧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见
  rationale: 此处表示西布获悉迦勒所说的话；叙事中的连续式在汉语里结合后句译为“听见……就……”，自然呈现事件推进。
- source_word: זְבֻל
  choice: 西布
  rationale: 按现代汉语圣经人名的通行音译处理。
- source_word: שַׂר הָעִיר
  choice: 城里的首领
  rationale: שַׂר可指首领、长官或官员；“首领”既体现其城市权柄，又不把职务过度限定为现代行政意义上的“市长”或“总督”。
- source_word: אֶת דִּבְרֵי
  choice: 所说的话
  rationale: דִּבְרֵי直译为“话语”；在现代汉语叙事中，“所说的话”清楚自然，并保留其言语内容的指向。
- source_word: גַּעַל בֶּן עָבֶד
  choice: 以别的儿子迦勒
  rationale: 保留希伯来文父子关系的表达，并采用现代汉语中相应人名的通行音译。
- source_word: וַיִּחַר אַפּוֹ
  choice: 怒火中烧
  rationale: 希伯来语习语字面涉及鼻子发热，实际表示强烈发怒；“怒火中烧”保留“燃烧”的形象，同时符合自然现代汉语。
