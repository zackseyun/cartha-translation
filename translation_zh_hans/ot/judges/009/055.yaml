  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: zh_hans
  text: 以色列人看见亚比米勒已经死了，就各自往自己的地方去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“以色列人”在形式上为单数，却与复数动词搭配，作集合用法；后面的单数“人”则有逐一分配的作用，即“各自到自己的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 看见
  rationale: ראה在叙事序列中表示看见并由此确认事实；“看见”既贴近原文，也符合现代汉语叙事表达。
- source_word: אִישׁ יִשְׂרָאֵל
  choice: 以色列众人
  rationale: אִישׁ虽为单数形式，此处却具有集合意义，且与复数动词搭配；“以色列众人”自然地表达这一群体所指。
- source_word: כִּי
  choice: （看见）……
  rationale: כִּי在此引出所看见或确认的内容；汉语用“看见亚比米勒死了”直接表达，无须另译连接词。
- source_word: מֵת
  choice: 死了
  rationale: 原文描述亚比米勒被众人看见时已经死亡的状态；“死了”在现代汉语中自然清楚，同时不额外强调死亡过程。
- source_word: אֲבִימֶלֶךְ
  choice: 亚比米勒
  rationale: 依照现代中文圣经人名的通行音译。
- source_word: וַיֵּלְכוּ
  choice: 往……去了
  rationale: הלך在此是一般性的移动用语；“往……去了”保留“去”的方向意义，不擅自译成“回去”。
- source_word: אִישׁ לִמְקֹמוֹ
  choice: 各自往自己的地方
  rationale: 后一个אִישׁ具有逐一分配的作用，译为“各自”；מָקוֹם直译为“地方”，不具体化为原文未明说的“家”。
theological_decisions: []
