source:
  edition: WLC
  text: לָ/ב֕וֹא חֲמַ֖ס שִׁבְעִ֣ים בְּנֵֽי יְרֻבָּ֑עַל וְ/דָמָ֗/ם לָ/שׂ֞וּם עַל אֲבִימֶ֤לֶךְ אֲחִי/הֶם֙ אֲשֶׁ֣ר הָרַ֣ג אוֹתָ֔/ם וְ/עַל֙ בַּעֲלֵ֣י שְׁכֶ֔ם אֲשֶׁר חִזְּק֥וּ אֶת יָדָ֖י/ו לַ/הֲרֹ֥ג אֶת אֶחָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: zh_hans
  text: 为要使加在耶路巴力七十个儿子身上的暴行受到追究[a]，使他们的血归到亚比米勒——他们的兄弟、杀害他们的人——身上，也归到示剑的权贵[b]身上；他们曾支持亚比米勒杀害自己的兄弟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“使耶路巴力七十个儿子的暴行来到”。这里指他们所受的暴行反过来受到追究。
    reason: 说明希伯来语“暴行来到”的意象，以及正文为合乎现代汉语所作的明确表达。
  - marker: b
    text: 或译“示剑的首领”。原文指示剑城中有权势、掌权的人。
    reason: 说明בַּעֲלֵי שְׁכֶם的社会政治含义及可译选择。
lexical_decisions:
- source_word: לָבוֹא חֲמַס
  choice: 使……所遭的暴行得到报应
  rationale: לָבוֹא在承接上文时表达目的或结果；חֲמַס指施加于耶路巴力众子身上的暴行或残害。直译“暴行来到”在现代汉语中不自然，因此以“得到报应”传达暴行反归施暴者的司法性结果，同时用脚注保留原文意象。
- source_word: שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: 耶路巴力七十个儿子
  rationale: 按希伯来语领属结构直接表达，并沿用人名“耶路巴力”。
- source_word: וְדָמָם לָשׂוּם עַל
  choice: 使他们的血归到……身上
  rationale: 保留“血”这一代指流血责任的司法—道德意象；“归到……身上”较自然地表达责任落在某人身上，而不直接释为“血债”。
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: 杀害他们的兄弟亚比米勒
  rationale: 保留亚比米勒与被杀者同为兄弟的反讽和控诉力量；关系从句明确他是实施杀害的人。
- source_word: בַּעֲלֵי שְׁכֶם
  choice: 示剑权贵
  rationale: בַּעֲלִים在此指城中的掌权者、显要或利益主体，并非所有居民；“权贵”比“主人”自然，也比泛称“领袖”更能体现其社会权势。
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: 支持他
  rationale: 原文直译为“使他的手强壮”，是指援助、撑腰；现代汉语直译容易显得晦涩，故正文传达其惯用义。
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: 杀害自己众兄弟
  rationale: 准确表达目的性不定式，并以“自己”清楚标明“他的”指亚比米勒；“众兄弟”符合七十人的复数语境。
theological_decisions:
- issue: 流血责任的意象
  choice: 正文保留“他们的血归到……身上”
  alternative: 将他们的血债归在……身上；为他们流的血报仇
  rationale: 原文以“血”转喻杀人所负的责任。保留“血”及责任归属的表达，既呈现司法性后果，也不把原文收窄为单一的复仇解释。
- issue: 暴行“来到”的含义
  choice: 译为“暴行得到报应”，并在脚注说明直译
  alternative: 使暴行临到；使暴行归到
  rationale: 这里是上文神使恶灵介入所产生的目的或结果，指所施暴行反过来受到追究。“得到报应”在现代汉语中清楚，但脚注保留原文较含蓄的“来到”意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“得到报应”使目的句自然清楚；“他们的血归到……身上”刻意保留希伯来文的流血责任意象；“支持他”则避免生硬照译“使他的手强壮”。
