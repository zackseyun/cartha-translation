  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: zh_hans
  text: 现在，你和跟你在一起的人要在夜间[a]起来，在田野里埋伏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“趁夜”。希伯来语表示行动发生在夜间，不一定特指“今晚”。
    reason: lexical_alternative
  - marker: b
    text: 或译“潜伏等候”或“设下埋伏”。希伯来语动词指隐藏起来伺机行动，常含伏击之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换标记，引出紧接着的命令；“现在”自然传达过渡和紧迫感，又不额外限定为“今晚”。
- source_word: קוּם
  choice: 起来
  rationale: 准确表达קום命令式的直接语气，也适合军事行动的语境。
- source_word: לַיְלָה
  choice: 在夜间
  rationale: 该词在此作时间状语，表示行动发生于夜间；避免译成“今晚”而加入原文未明确表达的限定。
- source_word: אַתָּה
  choice: 你
  rationale: 保留希伯来文显明的人称代词所带的强调，并与随行人员并列。
- source_word: וְהָעָם אֲשֶׁר אִתָּךְ
  choice: 和跟随你的人
  rationale: עָם在此指与亚比米勒同行的一群人；此译法比“军队”少一层解释，也比直译“与你同在的百姓”更符合现代汉语。
- source_word: וֶאֱרֹב
  choice: 埋伏
  rationale: ארב表示隐藏等候、伺机行动；“埋伏”在现代汉语中能自然涵盖进入伏击位置并潜伏等候的含义。
- source_word: בַּשָּׂדֶה
  choice: 到田野里
  rationale: שָׂדֶה可指田野或城外开阔地；“到田野里”既保留基本意象，也配合“起来……埋伏”的行动方向。
