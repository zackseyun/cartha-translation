  yaml_path: translation/ot/judges/009/052.yaml
  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: zh_hans
  text: 亚比米勒来到那座塔，攻打它；他又走近塔的入口，要用火烧毁它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד־הַמִּגְדָּל
  choice: 来到塔前
  rationale: עַד在这里表示抵达塔所在之处；“来到塔前”自然表达其逼近目标，不把“上来”的方向性强加给上下文。
- source_word: וַיִּלָּחֶם בּוֹ
  choice: 攻打那塔
  rationale: 字面为“与它争战”；所指为塔，现代汉语用“攻打那塔”更自然，也保留军事攻击的含义。
- source_word: וַיִּגַּשׁ עַד פֶּתַח הַמִּגְדָּל
  choice: 又逼近塔门
  rationale: וַיִּגַּשׁ表示走近、逼近；“塔门”简洁对应“塔的入口”。
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: 要放火烧塔
  rationale: 目的不定式表示亚比米勒逼近塔门的意图；“放火烧塔”自然传达“用火烧它”，并明确代词所指。
