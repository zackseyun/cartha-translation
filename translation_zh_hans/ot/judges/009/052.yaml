  source_fidelity: 译文基本准确呈现了亚比米勒到达塔、攻打塔、靠近塔入口并意图用火焚烧的行动顺序。惟“来到塔前”较“来到/来到塔那里”略加强了“前面”的空间位置；原文的 עַד 表示到达塔处，并不特指塔前。英文审计轨迹的“came up”也未必要在汉语中明示方向，但应保留抵达该塔的意思。
