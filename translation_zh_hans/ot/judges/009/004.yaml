base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: zh_hans
  text: 他们从巴力·比利土的庙[a]中取出七十银子[b]给他。亚比米勒用这些银子雇了一群无赖而轻狂的人[c]，他们就跟随他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“巴力·比利土的房屋”；在敬拜场景中，“房屋”可指庙宇或圣所。
    reason: lexical_alternative
  - marker: b
    text: 或译“七十舍客勒银子”。原文直译为“七十银”，指按重量计量的银钱。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“空虚而轻狂的人”；也可译作“无用而鲁莽的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: 七十银子
  rationale: 原文直译为“七十银”，指按重量计量的一笔银钱；正文不擅自补出原文未明说的“舍客勒”，脚注说明这一可能含义。
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: 从巴力·比利土的庙里
  rationale: בַּיִת本义是“房屋”，在敬拜场景中可指神庙或圣所。此处银钱来自该处，以“庙”最自然清楚；神名音译为“巴力·比利土”。
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: 用这些银子雇了
  rationale: 介词短语回指前述银钱，表示雇人的手段；汉语明确补出“银子”，避免代词指向含混。
- source_word: אֲנָשִׁים רֵיקִים
  choice: 无用的人
  rationale: רֵיקִים字面为“空的”，用于人时指没有价值、无所事事或品行不端的人。“无用”保留其贬义，同时避免添加原文没有明说的具体罪行。
- source_word: וּפֹחֲזִים
  choice: 轻狂
  rationale: 该词含轻率、放纵、不受约束之意；“轻狂”既自然，又保留其性情不稳、行事鲁莽的色彩。
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: 他们就跟随他
  rationale: 原文惯用语字面是“走在他后面”，此处表示这些人投到亚比米勒手下并随从他。
theological_decisions: []
