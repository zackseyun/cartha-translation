  text: 于是，众树对无花果树说：“你来作王统治我们吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 于是……说
  rationale: 叙事性连续式推动情节发展；“于是”自然表达先后推进，“说”对应 אמר 的通常含义。
- source_word: הָעֵצִים
  choice: 众树
  rationale: עֵצִים 在本寓言中指作为说话者的树木；“众树”简洁自然，并体现复数集合。
- source_word: לַתְּאֵנָה
  choice: 对无花果树
  rationale: תְּאֵנָה 在此指无花果树，而非果实；前置词 ל 标示说话的对象。
- source_word: לְכִי אַתְּ
  choice: 请你来
  rationale: לְכִי 是对阴性单数对象发出的命令，独立代词 אַתְּ 带有强调。“你”保留明确指向；“来”符合汉语招请某人就任的表达，“请”使邀请式命令自然庄重，并未改变其祈使语气。
- source_word: מָלְכִי
  choice: 作王统治
  rationale: 该词是 מלך 的阴性单数祈使式，意为行使王权。“作王统治”既保留王权意象，也表达动词性的治理含义。
- source_word: עָלֵינוּ
  choice: 我们
  rationale: על 与 מלך 连用，表示统治的对象；汉语“统治我们”自然对应“在我们之上掌权”。
