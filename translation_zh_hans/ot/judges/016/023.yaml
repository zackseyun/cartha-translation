base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: zh_hans
  text: 非利士人的首领[a]聚集起来，要向他们的神大衮献上盛大的祭物，并且欢庆。他们说：“我们的神已经把我们的仇敌参孙交在我们手里[b]了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”指非利士各城邦的统治者；或译“统治官”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“交在我们手里”，是指交在我们的权势或控制之下。
    reason: idiom_explanation
lexical_decisions:
- source_word: סַרְנֵי
  choice: 首领
  rationale: 该词特指非利士各城邦居统治地位的官长；“首领”在现代汉语中自然清楚，也保留其政治领导身份。
- source_word: נֶאֱסְפוּ
  choice: 聚集起来
  rationale: 此处是אסף的尼法勒式，表示一群人聚到一起；“聚集起来”准确而自然。
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: 献上盛大的祭物
  rationale: 原文以同根动词和名词相配，强调献祭之举；汉语避免生硬重复，以“献上盛大的祭物”表达其规模和祭献性质。
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: 向他们的神大衮
  rationale: 明确大衮是受祭的对象，也是非利士人在此所称的神；语序符合现代汉语。
- source_word: וּלְשִׂמְחָה
  choice: 并且欢庆
  rationale: שִׂמְחָה可指喜乐、庆贺或宴乐；在庆祝得胜的场景中，“欢庆”最为贴切。
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: 已经把……交在我们手里
  rationale: 保留“在手里”的希伯来语意象，同时用“把……交在”清楚表达落入权势和控制之下的含义。
- source_word: אֵת שִׁמְשׁוֹן
  choice: 参孙
  rationale: 采用该人名通行的中文译名。
- source_word: אוֹיְבֵינוּ
  choice: 我们的仇敌
  rationale: 虽然词形带复数词尾，但此处所指是单数的参孙；“我们的仇敌”准确反映上下文。
theological_decisions:
- issue: 异教语境中אֱלֹהֵיהֶם和אֱלֹהֵינוּ的单复数表达
  choice: 他们的神／我们的神
  alternative: 他们的众神／我们的众神
  rationale: 两处都具体指前文点名的大衮，因此采用单数，既符合直接句法，也不把此处焦点扩大为非利士人的众神。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“盛大的祭物”传达献祭规模，“欢庆”自然表达庆典目的；引语保留非利士人将得胜归于大衮的原文视角，不对此作额外神学评断。
