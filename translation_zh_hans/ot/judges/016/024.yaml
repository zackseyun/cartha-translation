base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: zh_hans
  text: 众人看见他，就赞美他们的神，因为他们说：“我们的神把我们的仇敌，就是那毁坏我们土地、使我们许多人丧命的人，交在我们手中。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: 赞美
  rationale: 准确表达皮勒尔形态所指的颂赞行为，且符合现代汉语宗教语境。
- source_word: נָתַן ... בְיָדֵנוּ
  choice: 交在我们手中
  rationale: 保留希伯来语“交在手中”的惯用表达，意为使其落入掌控之下。
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: 摧毁我们的土地
  rationale: 将分词理解为描述参孙的持续性/特征性行为；“摧毁”传达 חרב 词根的毁坏含义。
- source_word: הִרְבָּה אֶת חֲלָלֵינוּ
  choice: 使我们被杀的人增多
  rationale: 保留使役动词“增多”的表达，并将 חֲלָלֵינוּ 译为战争或暴力中“被杀的人”。
theological_decisions:
- issue: 非利士人对其神的称谓
  choice: 我们的神／他们的神
  alternative: 我们的神明／他们的神明
  rationale: 原文使用 אֱלֹהִים，按叙事人物自身话语直译为“神”，不以贬义措辞预先评判其信仰，同时上下文清楚表明这是非利士人的神。
- issue: 胜利归因
  choice: 保留非利士人宣称其神交付仇敌的原话
  alternative: 加注说明这是人物观点而非叙述者认可
  rationale: 经文本身以引语呈现该主张；无需添加原文没有的神学评语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。后半句按希伯来语并列结构处理，使“摧毁我们的土地”与“使我们被杀的人增多”共同说明“我们的仇敌”。
