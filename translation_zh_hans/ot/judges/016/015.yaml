  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אֵ֚יךְ תֹּאמַ֣ר אֲהַבְתִּ֔י/ךְ וְ/לִבְּ/ךָ֖ אֵ֣ין אִתִּ֑/י זֶ֣ה שָׁלֹ֤שׁ פְּעָמִים֙ הֵתַ֣לְתָּ בִּ֔/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֥ גָדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: zh_hans
  text: 她对他说：“你心里既然没有我，怎么还能说‘我爱你’呢？你已经三次戏弄我[a]，却没有告诉我，你这么大的力气究竟从哪里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“愚弄我”“欺骗我”，也可理解为“拿我当傻瓜”。这个希伯来语动词指以欺骗的方式戏耍、嘲弄某人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: 怎么还能
  rationale: 这里引出大利拉带有质问意味的反问；“怎么还能”以自然的现代汉语表达她对参孙自称爱她的质疑。
- source_word: אֲהַבְתִּיךְ
  choice: 我爱你
  rationale: 在直接引语中，此处完成式表达参孙所声称的持续感情，汉语用现在时态的“我爱你”最自然。
- source_word: לִבְּךָ אֵין אִתִּי
  choice: 你心里既然没有我
  rationale: 保留希伯来语以“心”表达内在忠诚和真情的意象，同时用“既然”清楚呈现后句反问的逻辑。
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: 已经三次
  rationale: 自然表达截至此刻反复发生三次的意思，避免生硬直译为“这是三次”。
- source_word: הֵתַלְתָּ בִּי
  choice: 戏弄我
  rationale: 该动词兼有以欺骗方式拿人取乐、愚弄人的意味；“戏弄”既保留个人受辱的语气，也符合上下文。
- source_word: הִגַּדְתָּ לִּי
  choice: 没有告诉我
  rationale: 在二人对话的语境中，这是 נגד 的自然、直接译法。
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: 你这么大的力气究竟从哪里来
  rationale: 介词短语询问参孙巨大力量所凭借的根源或原因；此译法符合现代汉语，并以“究竟”传达追问语气。
theological_decisions: []
