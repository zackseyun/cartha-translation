  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: zh_hans
  text: 非利士人的首领来到她那里，对她说：“你引诱他，查明他的力量为何如此强大，并查明我们怎样才能胜过他，好把他捆起来，使他受苦。我们每人都给你一千一百银子[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一千一百银子”。这很可能是指每位非利士首领各给一千一百份银子，可能是银块、银币，或按一千一百舍客勒计。
    reason: 原文没有说明银子的具体计数或重量单位；脚注保留“舍客勒”等可能解释，而正文不作过度确定。
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: 来到她那里
  rationale: עלה与אֶל连用表示朝某人而去；此处用自然的现代汉语表达趋近，不把希伯来语的方向成分机械译成“上去”。
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的首领
  rationale: סֶרֶן是非利士城邦统治者的专称；“首领”既体现其统治地位，也比“领主”更符合现代普通读者的语言习惯。
- source_word: פַּתִּי
  choice: 引诱
  rationale: 此处Piel命令式指用诱骗手段使参孙泄露秘密；“引诱”保留操控和欺骗意味，却不擅自限定为性诱惑。
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: 查明他的大力气究竟在于什么
  rationale: בַּמֶּה询问其力量的根据或秘密；“究竟在于什么”自然地保留这一问法，“大力气”也明确对应גָּדוֹל。
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: 我们怎样才能胜过他
  rationale: יכל ל表示胜过或制胜某人；“怎样才能”对应בַּמֶּה在此所问的手段，同时避免过度具体化为纯粹的体力压制。
- source_word: וַאֲסַרְנֻהוּ
  choice: 把他捆起来
  rationale: אָסַר在抓捕语境中指捆绑；“捆起来”是清楚自然的现代汉语。
- source_word: לְעַנֹּתוֹ
  choice: 使他受苦
  rationale: Piel形式的ענה可指使人受苦、压制或羞辱；“使他受苦”保留较宽泛的伤害含义，不窄化为折磨或制服。
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: 我们每人都给你一千一百块银子
  rationale: אִישׁ在这里具有逐一分配义，即每位首领各自给付；原文只说“一千一百银子”，用“块”使汉语通顺，并以脚注说明可能的重量单位。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。对话保持直接、带有密谋语气；避免古雅的“诱哄”“制伏”等词，也不把原文较宽泛的“使他受苦”解释成某一种特定刑罚。
