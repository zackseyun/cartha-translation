  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: zh_hans
  text: 于是，他把心里的一切都告诉了她[a]，对她说：“剃刀从未碰过我的头，因为我从母腹起就是上帝的拿细耳人[b]。若有人剃去我的头发，我的力量就会离开我；我会变得软弱，像普通人一样[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“把他全部的心告诉了她”；这里的“心”指内心、心意，表示毫无保留地吐露内情。
    reason: lexical_alternative
  - marker: b
    text: “拿细耳人”是专门归给上帝之人的称谓。参民数记6章。
    reason: cultural_note
  - marker: c
    text: 直译“像所有的人一样”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד ... אֶת כָּל לִבּוֹ
  choice: 把心里的一切都告诉了她
  rationale: 希伯来语直译为“把他的整个心告诉她”，是指毫无保留地吐露内情。中文采用自然的对应表达，同时以脚注保留原文意象。
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: 剃刀从未碰过我的头
  rationale: מוֹרָה指剃刀；“碰过我的头”自然传达希伯来语“上到我的头上”的意象和实际含义。
- source_word: נְזִיר אֱלֹהִים
  choice: 上帝的拿细耳人
  rationale: “拿细耳人”保留民数记第6章及参孙叙事中的专门称谓；“上帝的”忠实保留原文的所属或归属关系。
- source_word: מִבֶּטֶן אִמִּי
  choice: 从母腹起
  rationale: 简洁保留“从我母亲腹中起”的出生前起点，符合现代中文表达。
- source_word: אִם גֻּלַּחְתִּי
  choice: 我若被剃头
  rationale: 保留原文被动语态，表明是参孙被人剃去头发，而不是他自己剃头。
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: 我的力量就会离开我
  rationale: 贴近原文“力量从我身上离去”，并在条件句中自然表达后续结果。
- source_word: וְחָלִיתִי
  choice: 我会变得软弱
  rationale: 上下文指失去超常力量而衰弱，并非生病。
- source_word: כְּכָל הָאָדָם
  choice: 像普通人一样
  rationale: 原文把参孙与一般人相比；“普通人”在中文中清楚表达这种对照，同时脚注保留较贴近字面的译法。
theological_decisions:
- issue: 参孙自称נְזִיר אֱלֹהִים的译法
  choice: 上帝的拿细耳人
  alternative: 归上帝为圣的人
  rationale: 采用技术性称谓“拿细耳人”，以保留本节与参孙蒙召叙事及民数记第6章的经文联系；不把该词泛化为一般意义的奉献或成圣。
- issue: כְּכָל הָאָדָם所表达的比较范围
  choice: 像普通人一样
  alternative: 像任何人一样
  rationale: 此处重点是参孙失去非凡力量后成为一般人，并非要建立有关性别或全人类的神学命题；正文采用自然中文，脚注呈现另一种较贴近表面形式的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上帝的拿细耳人”保留关键宗教术语；“被剃头”保留原文被动含义。标点与脚注依中文出版习惯安排。
