base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: zh_hans
  text: 伏兵正坐在内室里等候她[a]。她对参孙说：“参孙，非利士人来对付你了！”参孙就挣断那些弦，如同麻絮捻成的线一闻到火便断了一样[b]。他的力量仍未被探明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候她”直译为“为她”；原文关系较含蓄，可指伏兵受她安排，也可理解为与她一同等候。
    reason: 保留希伯来语לָהּ（“给她／为她”）在此语境中的关系歧义，同时使正文的汉语句法自然。
  - marker: b
    text: “一闻到火”是原文的形象说法，意思是线一接近或接触火便立刻断开。
    reason: 保留希伯来语“闻到火”的生动而不寻常意象，并向现代读者说明比喻所指。
lexical_decisions:
- source_word: הָאֹרֵב
  choice: 埋伏的人
  rationale: 该词为单数形式的集合性表达，语境中指埋伏者；译作“埋伏的人”既自然，也不擅自确定人数。
- source_word: יְתָרִים
  choice: 弦
  rationale: 此词可指绳索、筋腱或弓弦；上文所述材料与用途支持“弦”，同时避免把具体材质重复加入本节。
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: 麻絮捻成的线
  rationale: פְּתִיל是线，נְעֹרֶת指加工麻料时所得的麻絮；此译比笼统的“麻线”更具体，又适合现代读者理解。
- source_word: נוֹדַע כֹּחוֹ
  choice: 他的力量仍未被探明
  rationale: 保留原文被动语态及“得知、查明”的语义，不额外加入“力量的来源”或“秘密”等原文未明说的内容。
theological_decisions:
- issue: 参孙力量未被知晓的表述
  choice: 他的力量仍未被探明
  alternative: 他的力量从哪里来仍无人知道
  rationale: 原文只说其力量未被查明，没有明确说“力量的来源”；采用较开放的译法，以保留叙事中的含蓄和张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来对付你了”自然传达“在你身上、临到你”的紧迫警告；保留“一闻到火气”的原文意象，并用脚注释义。
