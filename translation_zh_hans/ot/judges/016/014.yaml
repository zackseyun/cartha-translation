  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: zh_hans
  text: 于是她用橛子把它固定住，对他说：“参孙，非利士人来抓你了！”他从睡梦中醒来，拔起了织机的橛子和织物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתְקַע בַּיָּתֵד
  choice: 她又用橛子把它钉牢
  rationale: תקע表示钉入、插入或固定；יָתֵד可指橛子或大针。结合织机情境，以“用橛子……钉牢”保留具体动作，也不把织机结构解释得过细。
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: 非利士人来捉你了
  rationale: 这是参孙叙事中反复出现的紧急警告语。汉语若直译为“非利士人在你身上”不自然；“来捉你了”自然传达敌人逼近、要制伏他的语境。
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: 他从睡梦中醒来
  rationale: 直接表达“从睡眠中醒来”，符合现代汉语叙事表达。
- source_word: וַיִּסַּע
  choice: 拔了出来
  rationale: נסע在这里表示拔起、扯开或移除，并非“出发”。“拔了出来”与橛子相配，同时传达用力移除的动作。
- source_word: הַיְתַד הָאֶרֶג
  choice: 织机的橛子
  rationale: 该词组指与编织装置相关的橛子；“织机的橛子”既贴近原文关系，也比过于专业的器具名称更易懂。
- source_word: הַמַּסָּכֶת
  choice: 织物
  rationale: 该词在此指织机上已经织成或正在编织的材料。“织物”自然且保留其范围，不武断限定为经线或某种特定织机部件。
- source_word: וְאֶת הַמַּסָּכֶת
  choice: 连同织物一起
  rationale: 原文以וְאֶת并列橛子和织物；汉语用“连同……一起”清楚表现两者一并被拔扯离开的动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又”承接前文连续动作；不补入原文未明说的主语姓名，也不对古代织机的具体构造作推测性说明。
