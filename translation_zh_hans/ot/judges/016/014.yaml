  to: 于是她用橛子把它固定住，对他说：“参孙，非利士人来抓你了！”他从睡梦中醒来，拔起了织机的橛子和织物。
  rationale: 修订删除无明确文本根据的“又”，改善首句动作描写及代词指涉的自然度，并将末句两个并列受词直接并列。保留“橛子”和“织物”的词义范围；警报语以现代汉语自然表达其敌人来袭、欲擒拿参孙的语境，而不增添具体战术细节。
