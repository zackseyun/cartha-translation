review_pass:
  verdict: revise
  source_fidelity: “又”在本节的希伯来文本中没有明确对应，宜译为“于是”或省略。“来捉你了”可传达警报语的实际含义，但比“非利士人临到你这里了”的字面结构更具解释性；以“非利士人来抓你了”保留紧急警报的自然汉语表达。末句应明确两个并列受词都是参孙移除的对象。
  naturalness: 原译整体通顺，但“用橛子把它钉牢”中“它”的所指不够清楚，且“橛子”与“钉牢”搭配略显生硬。改作“用橛子把它固定住”更自然，也不预断器具的精确构造。
  terminology: “非利士人”“参孙”均正确。“橛子”可保留，以反映יָתֵד的“钉、橛”范围；“织物”适切对应מַסָּכֶת，未武断译作“经线”。
  issues:
  - severity: low
    issue: “又”缺少本节原文依据。
    rationale: וַ-在此为叙事推进，不能单凭本节译出重复性的“又”。
  - severity: low
    issue: “它”所指含混，且“橛子把它钉牢”搭配略生硬。
    rationale: 原文的受词在上下文中省略；中文宜以较中性的“把它固定住”表达，既保留省略所带来的指代弹性，也更符合织造场景。
  - severity: low
    issue: “连同织物一起拔了出来”使“织物”似乎只是附带物。
    rationale: 原文以两个直接受词并列：织机的橛子和织物。中文应并列呈现二者均为被移除的对象。
