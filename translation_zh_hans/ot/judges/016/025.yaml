base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: zh_hans
  text: 他们心里正欢畅时，就说：“把参孙叫来，让他给我们取乐[a]！”于是，他们把参孙从监牢[b]里叫来；他就在他们面前供他们取乐。他们使他站在柱子中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “取乐”也可译作“给我们表演”或“供我们取乐”。这里相关的希伯来语动词可指逗乐、戏弄或公开表演。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“囚犯之屋”，即监牢。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: 他们心里正欢畅时
  rationale: 这个希伯来语习语直译为“他们的心是好的”，在此表示心情欢快、兴致正高。“心里正欢畅”既保留“心”的意象，也符合现代汉语表达。
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: 把参孙叫来
  rationale: קרא 后接 ל 在此表示召来某人；“把参孙叫来”自然地传达命令语气和支配意味。
- source_word: וִישַׂחֶק לָנוּ
  choice: 让他给我们取乐
  rationale: שׂחק 在此可涉及逗乐、供人戏耍或公开表演。“给我们取乐”保留其目的，也不把场景淡化成单纯无害的娱乐。
- source_word: מִבֵּית הָאֲסִירִים
  choice: 从监牢里
  rationale: 该短语字面为“从囚犯之屋”；“监牢”是准确、自然且庄重的现代汉语，脚注补明原文结构。
- source_word: וַיְצַחֵק לִפְנֵיהֶם
  choice: 他就在他们面前供他们取乐
  rationale: צחק 在本语境中指参孙成为众人观看和取乐的对象，可能包括表演与戏弄。“在他们面前”保留公开性，“供他们取乐”保留受辱和被支配的意味，同时不武断限定具体行为。
- source_word: וַיַּעֲמִידוּ אֹתוֹ בֵּין הָעַמּוּדִים
  choice: 他们使他站在两根柱子中间
  rationale: 使役形式表达他们令参孙站定；“使他站”保留强制意味。此处柱子带定指，且后文显示是两根支撑柱，因此译为“两根柱子”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“心里正欢畅”保留希伯来语的心之意象；“供他们取乐”刻画参孙被当作取乐对象，却不超出原文去具体断定他所做的表演或所受的戏弄。
