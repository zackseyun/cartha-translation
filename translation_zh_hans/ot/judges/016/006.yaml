base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: zh_hans
  text: 底利拉对参孙说：“请告诉我，你的大力究竟在于什么；又要用什么办法才能捆住你，制伏你[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “制伏”所译的希伯来语动词也可译作“苦待”、“使受苦”或“使降卑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 未逐字译出连接词 וַ；汉语按上下文顺承即可自然推进叙事，无须机械加入“然后”。
- source_word: דְּלִילָה אֶל שִׁמְשׁוֹן
  choice: 底利拉对参孙
  rationale: 人名采用现代中文圣经传统中通行的译名；אֶל 在说话结构中译为“对”。
- source_word: הַגִּידָה נָּא לִי
  choice: 请告诉我
  rationale: הַגִּידָה 表示“告诉、说明”，נָא 表达请求语气，合译为自然而恳切的“请告诉我”。
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: 你这么大的力气究竟从哪里来
  rationale: בַּמֶּה 字面为“在什么之中/凭什么”；结合语境是在追问参孙强大力量的根源或奥秘。“从哪里来”符合现代汉语表达，“究竟”体现追问语气，但不具体断定力量来源。
- source_word: וּבַמֶּה תֵאָסֵר
  choice: 要用什么才能捆住你
  rationale: 再次出现的 בַּמֶּה 询问手段；תֵאָסֵר 是 אסר 的未完成式尼法勒形，意为“被捆绑”。“要用什么才能”自然表达所问的可能方式。
- source_word: לְעַנּוֹתֶךָ
  choice: 好制伏你
  rationale: ענה 的皮耶勒形可表示使人受苦、受压、降卑，也可在此语境中指压服或制伏。正文采用符合当前行动语境的“制伏”，并以脚注保留词义范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“这么大的力气究竟从哪里来”避免生硬直译“你的力量在什么之中为大”；“捆住你，好制伏你”保留捆绑手段与目的之间的关系。
