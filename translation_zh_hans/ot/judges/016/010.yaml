base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: zh_hans
  text: 大利拉对参孙说：“你看，你戏弄我[a]，还对我说谎。现在请告诉我，你会被什么捆住。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“愚弄我”；这个希伯来语动词可以指借着欺骗来戏弄或耍弄某人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 未机械译出叙事性连接词 וַ；现代汉语连续叙事中省略“于是”更自然，事件次序仍清楚。
- source_word: הִנֵּה
  choice: 你看
  rationale: 作为引起注意并引出指责的语气词，“你看”既保留指示和强调作用，也符合现代口语。
- source_word: הֵתַלְתָּ בִּי
  choice: 你戏弄我
  rationale: התל 在此指借欺骗来愚弄、耍弄对方；“戏弄”保留其轻慢和使人受愚弄的意味，又避免与下句“说谎”完全重叠。
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: 还对我说谎
  rationale: 希伯来语直译近于“向我说虚假之言”；现代汉语用“对我说谎”简洁自然，并保留行为所指向的对象。连接词译为“还”，体现指责的递进并列。
- source_word: עַתָּה
  choice: 现在
  rationale: 标示从指责转向再次请求。
- source_word: הַגִּידָה נָּא לִי
  choice: 请告诉我
  rationale: 祈使式加 נָא 带请求语气，“请”自然传达这一缓和语气。
- source_word: בַּמֶּה תֵּאָסֵר
  choice: 你可以用什么捆绑
  rationale: בַּמֶּה 重点在工具，即“用什么”；תֵּאָסֵר 是尼法勒未完成式，语境中表达可能性和被动意义。汉语“你可以用什么捆绑”自然表达“你能被什么捆住”，同时保留工具焦点。
