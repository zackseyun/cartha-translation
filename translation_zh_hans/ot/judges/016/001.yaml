  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: zh_hans
  text: 参孙前往迦萨，在那里看见一个妓女，便到她那里去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“便与她发生了性关系。”希伯来文直译为“便到她那里去”；在这里，这是一种表示性关系的常见委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 到了
  rationale: 在连续叙事中，הלך表示普通的移动；结合目的地“迦萨”，译为“到了”符合现代汉语叙事习惯，也不增添原文没有的旅行细节。
- source_word: שִׁמְשׁוֹן
  choice: 参孙
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: עַזָּתָה
  choice: 迦萨
  rationale: 地名后的方向词尾表示朝向该城；汉语用“到了迦萨”自然表达前往目的地的意思。
- source_word: וַיַּרְא שָׁם
  choice: 在那里看见
  rationale: שָׁם意为“在那里”；按现代汉语语序置于动词之前。
- source_word: אִשָּׁה זוֹנָה
  choice: 一个妓女
  rationale: זוֹנָה在此指妓女；这一译法准确、通俗，不采用古旧或弱化其含义的措辞。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: 就进到她那里
  rationale: 按字面保留“进入／到……那里”的委婉说法，不在正文中把原文所暗示的性行为完全明说；脚注交代其语境含义。
theological_decisions:
- issue: 是否在正文中明确说参孙与妓女发生了性关系
  choice: 保留原文的委婉表达“就进到她那里”
  alternative: 就与她发生了性关系
  rationale: 上下文强烈暗示性关系，但希伯来文采用委婉语而非明确的性行为动词。正文保留这种含蓄程度，脚注说明可能的明确译法，以免消除原文的表达张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“妓女”直接准确；“进到她那里”略带原文式表达，以刻意保留希伯来文的委婉语，并由脚注帮助普通读者理解。
