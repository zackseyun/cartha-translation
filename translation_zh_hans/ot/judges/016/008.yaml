base_translation:
  language: en
  yaml_path: translation/ot/judges/016/008.yaml
  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: zh_hans
  text: 于是，非利士人的首领给她送来七根新鲜、尚未干透的弓弦；她就用这些弓弦把参孙捆住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ לָהּ
  choice: 给她送来
  rationale: עלה在这里是使役性的“带上来、送来”；现代汉语用“给她送来”自然表达物品被带到大利拉那里，不必机械保留空间方向。
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的首领
  rationale: סֶרֶן指非利士城邦的统治官员；“首领”既清楚庄重，也避免“王侯”等可能过度具体化其官职的说法。
- source_word: שִׁבְעָה יְתָרִים
  choice: 七根弓弦
  rationale: יֶתֶר可指绳索或弓弦；结合本段反复使用的特殊材料及主要词典证据，正文采用具体而自然的“弓弦”。
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: 还没有干的鲜
  rationale: לַחִים表示湿润、新鲜，后面的关系从句明确说尚未变干；译作“还没有干的鲜弓弦”保留两层描述而不重复得生硬。
- source_word: וַתַּאַסְרֵהוּ בָּהֶם
  choice: 她就用这些弓弦把参孙捆住
  rationale: אסר意为捆绑，בָּהֶם表示工具；明确宾语为参孙可避免汉语代词指向含混，同时不增加叙事信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“于是……就……”衔接前后行动；保留“非利士人”这一通行专名。原文没有需要特别注释的神学歧义。英语咨询文本的脚注标记与脚注内容明显错配：正文把[a]放在“未干”之后，脚注却解释“非利士人的首领”；因此本稿不沿用该错误标记，也不设置脚注。
