base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: zh_hans
  text: 他对她说：“如果他们用从未用来做工的新绳子把我牢牢捆住[a]，我就会变得软弱，像普通人一样[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“用没有拿来做过任何工作的新绳子。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“像一般人中的一个”，即不再具有异乎寻常的力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: 他对她说
  rationale: 以现代汉语自然的叙事表达呈现连续叙事动词；句首连接词在本节无需机械译出。
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: 如果他们……把我牢牢捆住
  rationale: 不定式绝对形与限定动词连用，具有加强语气的作用；“牢牢捆住”既体现强调，也符合现代汉语习惯。
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: 用……新绳子
  rationale: עֲבֹתִים 指用于捆绑的绳索，可能较粗；“绳子”清楚自然，“新”准确修饰其尚未使用的状态。
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: 从未做过工的
  rationale: 保留希伯来文“没有用它们做过工”的具体说法，同时用简洁汉语表达这些绳子从未投入使用。
- source_word: וְחָלִיתִי
  choice: 我就会变得软弱
  rationale: חלה 在此语境指失去力量、变得软弱，而非生病；“变得软弱”与参孙非凡力量的对比清楚。
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: 像普通人一样
  rationale: 该短语字面近于“像世人中的一个”，语境强调参孙将不再具有异常力量；“普通人”自然传达这一对比，又不把所指限定为抽象的全人类。
theological_decisions:
- issue: כְּאַחַד הָאָדָם 中 הָאָדָם 的范围与表达
  choice: 像普通人一样
  alternative: 像世人中的一个
  rationale: 上下文的重点是参孙与一般人相比所具有的超常力量，而不是对“人类”作抽象论述。“普通人”准确呈现对比；脚注保留较贴近原文结构的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“牢牢捆住”体现原文同根词叠用的强调；“做过工”保留原文具体意象；“普通人”使力量对比清楚，脚注同时保存较直译的表达。
