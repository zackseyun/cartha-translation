base_translation:
  language: en
  yaml_path: translation/ot/judges/016/004.yaml
  text: After this[a], he loved a woman in the Valley of Sorek, and her name was Delilah.
translation:
  language: zh_hans
  text: 此后，参孙爱上了梭烈谷[a]的一个女人，名叫大利拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“梭烈溪旁”。希伯来词נַחַל可指谷地、溪床或季节性水道。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 此后
  rationale: 希伯来叙事套语直译为“这事以后，就发生了……”。“此后”自然简洁地保留了时间顺序。
- source_word: וַיֶּאֱהַב
  choice: 爱上了
  rationale: אָהַב意为“爱”。现代汉语叙事中，“爱上了一个女人”比“爱了一个女人”自然；这里不进一步说明这种爱的性质。
- source_word: אִשָּׁה
  choice: 一个女人
  rationale: 该词可指“女人”或“妻子”；上下文没有表明婚姻关系，因此采用中性的“女人”。
- source_word: בְּנַחַל שֹׂרֵק
  choice: 梭烈谷
  rationale: נַחַל可指谷地、溪谷、河床或季节性水道。“梭烈谷”简明易懂，并以脚注保留另一种地貌理解。介词短语与“一个女人”自然连用，但不额外添加“住在”等原文未明说的信息。
- source_word: וּשְׁמָהּ
  choice: 名叫
  rationale: 自然表达“她的名字是”，同时紧密承接前面的“一个女人”。
- source_word: דְּלִילָה
  choice: 大利拉
  rationale: 按现代中文圣经人名的通行译法音译。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“参孙”由上下文明确补出主语，避免汉语孤立经节中的指代不清；不补写女人“住在”梭烈谷，以免把原文较宽泛的地点关系说得过实。
