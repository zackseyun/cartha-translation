base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: zh_hans
  text: 参孙抓住支撑房屋的两根中间的柱子[a]，倚靠在柱子上[b]：一根在他右边，一根在他左边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“两根中央的柱子”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“支撑自己在柱子上”或“抵住柱子”。原文动词可指倚靠某物或靠它支撑自己。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: 抓住
  rationale: 该动词表示牢牢握住或攫住；“抓住”在现代汉语中自然，也传达了有力而明确的动作。
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: 两根中柱
  rationale: עַמּוּדֵי意为“柱子”，הַתָּוֶךְ指中间或中央位置；“中柱”简洁地表达其建筑位置，同时保留“中央的柱子”这一可能表述。
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: 支撑房屋的
  rationale: נָכוֹן在这里表示房屋立定、建立在这些柱子之上；译为“支撑房屋的”清楚表达其结构功能，且符合现代汉语习惯。
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: 身子抵在柱子上
  rationale: סמך可表示倚靠、支撑自己或抵住；“身子抵在”符合参孙为下一步动作摆好姿势的语境，同时脚注保留“倚靠”的较中性译法。
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: 右手一根，左手一根
  rationale: 原文以“一根……一根……”作分配式表达，并分别提到他的右边和左边；结合抓柱的动作，汉语用“右手一根，左手一根”简明自然。
- source_word: הַבַּיִת
  choice: 房屋
  rationale: 该词通常意为“房屋”或“殿宇”；本节着眼于建筑结构，译作“房屋”既贴近原词，也不额外限定建筑性质。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“中柱”简洁清楚；“身子抵在”呈现具体动作而不过度加入下一节才明说的推倒行为。所有代词与动作关系保持明确。
