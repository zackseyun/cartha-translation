  yaml_path: translation/ot/judges/016/022.yaml
  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: zh_hans
  text: 可是，他头上的头发被剃以后，又开始长起来了[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “又”原文没有明确说出；原文直译为“开始生长”，根据先前头发已被剃去的上下文，也可理解为重新长起来。
    reason: lexical_alternative
  - marker: b
    text: “被剃以后”也可译作“被剃时”或“他被剃头以后”。原文的时间关系及被剃者的表达容许这些不同译法。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: 开始
  rationale: 该动词在这里与后接不定式连用，表示“开始”，用现代汉语“开始”自然准确。
- source_word: שְׂעַר רֹאשׁוֹ
  choice: 他头上的头发
  rationale: 保留希伯来语“他头部的头发”这一完整表达，也突出叙事中参孙头发的重要性。
- source_word: לְצַמֵּחַ
  choice: 又……长起来
  rationale: צמח本义为“生长、长出”；“又”虽非该词明说，却根据此前头发已被剃去的上下文，自然表达重新生长之意。
- source_word: כַּאֲשֶׁר
  choice: ……以后
  rationale: 该连词可表示“当……时、照着、以后”等关系；此处按事件先后译作“以后”，符合上下文和自然汉语。
- source_word: גֻּלָּח
  choice: 被剃
  rationale: 保留גלח被动式“被剃”的语态；正文按近接名词“头发”理解其所指，同时以脚注保留“他被剃头”的可能表达。
- source_word: וַ
  choice: 可是
  rationale: 叙事连接词在这里形成转折：非利士人剜去参孙双眼并囚禁他，可他的头发开始重长；“可是”自然呈现这一语篇关系。
