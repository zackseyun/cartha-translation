    rationale: 原文为“如同一个（普通）人/常人”的比较表达；אָדָם可作泛称。译为“其他男人”既加入“其他”的对比，也不必要地限缩为男性。
  - severity: low
    issue: “还没有干的新鲜弓弦”语序略拗口。
    rationale: 原文既称弓弦为湿润/新鲜，又说明尚未干；以“湿润、尚未干透的”并列修饰更自然且不减信息。
  revised_text: 参孙对她说：“如果他们用七根湿润、尚未干透的弓弦捆绑我，我就会变得软弱，像常人一样[a]。”
