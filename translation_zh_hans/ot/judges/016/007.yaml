revisions:
- from: 参孙对她说：“如果他们用七根还没有干的新鲜弓弦捆绑我，我就会变得软弱，像其他男人一样[a]。”
  to: 参孙对她说：“如果他们用七根湿润、尚未干透的弓弦捆绑我，我就会变得软弱，像常人一样[a]。”
  rationale: 修订比较短语，使其保留希伯来语אָדָם的泛称与上下文所指的普通人之义，避免“其他男人”引入的额外对比和性别限缩；同时调整弓弦的修饰语序，使中文更自然，并完整保留“湿润/新鲜”及“未干”的原文信息。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:29Z'
review_pass:
