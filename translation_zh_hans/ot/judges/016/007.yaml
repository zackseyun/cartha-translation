  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ שִׁמְשׁ֔וֹן אִם יַאַסְרֻ֗/נִי בְּ/שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: zh_hans
  text: 参孙对她说：“如果他们用七根湿润、尚未干透的弓弦捆绑我，我就会变得软弱，像常人一样[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像普通人一样”或“像其他人一样”。
    reason: 希伯来语כְּאַחַד הָאָדָם意为如同一个普通人；אָדָם可泛指人。
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  choice: 参孙对她说
  rationale: 希伯来叙事中的连续式动词承接前文；现代汉语无需机械译出“于是”或“并且”，按自然叙事语序表达。
- source_word: אִם יַאַסְרֻנִי
  choice: 如果他们……捆绑我
  rationale: אִם直接引出条件；第三人称复数在此表示不特指的施事者，译作“他们”既自然，也不擅自指定人物。
- source_word: בְּשִׁבְעָה יְתָרִים
  choice: 用七根……弓弦
  rationale: 介词בְּ表示工具；יְתָרִים在本段语境中指弓弦，而非一般绳索。
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: 还没有干的新鲜弓弦
  rationale: לַחִים意为湿润、新鲜，后面的关系从句明确说明尚未变干；此译保留两层描述，并符合现代汉语表达。
- source_word: וְחָלִיתִי
  choice: 我就会变得软弱
  rationale: חלה在这里指力量衰弱，而非生病；“变得”体现状态发生变化，避免误解为患病。
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: 像其他男人一样
  rationale: 该比较语表达参孙将不再具有超常力量，而会与一般人相同；结合近处语境中的男性体力比较，用“男人”保留其性别色彩。较宽泛的习惯译法收入脚注。
theological_decisions:
- issue: 比较短语כְּאַחַד הָאָדָם中אָדָם的范围
  choice: 像其他男人一样
  alternative: 像普通人一样
  rationale: אָדָם可泛指人类或人，但本段具体比较参孙与其他男性的力量。正文保留这一语境中的性别色彩，脚注则呈现同样可能且更宽泛的汉语表达，不把参孙力量的性质作额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“捆绑”比“绑起来”稍正式，“新鲜弓弦”与“还没有干”共同保留原文的具体描述。脚注标记置于其实际对应的比较短语之后。
