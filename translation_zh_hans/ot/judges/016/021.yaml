base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: zh_hans
  text: 非利士人抓住他，剜去他的双眼[a]，把他带到迦萨，用铜镣锁住他。他就在监牢里推磨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“刺瞎了他的眼睛。”原文动词具体指毁坏眼睛；“剜去”更明确地表现这一暴力动作。
    reason: lexical_alternative
  - marker: b
    text: “监牢”原文直译为“囚犯之家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: 抓住他
  rationale: אחז表示抓住、拿住；“抓住他”简洁有力，符合敌对者制伏参孙的语境，又不额外引入“俘虏”等结果性含义。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及历史叙述中通行的族名译法。
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: 剜去他的双眼
  rationale: נקר在此具体指毁坏、挖除眼睛；“剜去”保留原文动作的强烈和具体性，不以笼统的“弄瞎”弱化暴力程度。עֵינָיו按自然中文译为“双眼”。
- source_word: וַיּוֹרִידוּ אוֹתוֹ עַזָּתָה
  choice: 把他带下到迦萨
  rationale: 使役形态表达“使下去、带下去”；保留“下”的方向意味。地名后的方向词尾表明朝向迦萨，译作“到迦萨”。
- source_word: וַיַּאַסְרוּהוּ בַּנְחֻשְׁתַּיִם
  choice: 用铜镣锁住他
  rationale: אסר指捆绑、拘束；נְחֻשְׁתַּיִם指铜制的成对金属拘具。“铜镣”比泛称“铜链”更准确，“锁住”是现代中文描述上镣拘束的自然说法。
- source_word: וַיְהִי טוֹחֵן
  choice: 他就在……推磨
  rationale: 该结构描述他随后持续从事磨碾劳动的状态。中文“推磨”自然表达这种劳役，且没有擅自补出原文未明说的具体被磨物。
- source_word: בְּבֵית הָאֲסִירִים
  choice: 在监牢里
  rationale: 该短语直译为“囚犯之家”；正文采用现代中文自然明确的“监牢”，字面形式在脚注中保留。
