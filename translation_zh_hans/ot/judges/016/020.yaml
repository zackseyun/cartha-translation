  source_fidelity: 译文准确传达了希伯来文的叙事次序与关键含义：非利士人的迫近威胁、参孙从睡眠中醒来、他以为仍可照先前的方式出去并挣脱，以及雅威已离开他而他并不知情。“来捉你了”是对敌对主语加 עַל 的自然汉语情境化表达，虽较“临到你/攻击你”具体，却未改变本段中非利士人意图制伏参孙的基本意思。
