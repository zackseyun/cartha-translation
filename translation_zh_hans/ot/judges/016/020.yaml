  text: וַ/תֹּ֕אמֶר פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יִּקַ֣ץ מִ/שְּׁנָת֗/וֹ וַ/יֹּ֨אמֶר֙ אֵצֵ֞א כְּ/פַ֤עַם בְּ/פַ֨עַם֙ וְ/אִנָּעֵ֔ר וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּ֥י יְהוָ֖ה סָ֥ר מֵ/עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: zh_hans
  text: 她说：“参孙，非利士人来捉你了！”他从睡梦中醒来，说：“我要像往常一样出去，挣脱开来[a]。”他却不知道，雅威已经离开了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抖抖身子。”这里很可能是指像以前那样挣脱束缚。
    reason: 保留 וְאִנָּעֵר 较为字面的动作意象，同时说明其在上下文中可能表达的结果。
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: 非利士人来捉你了
  rationale: 介词 עַל 与带敌意的主语连用，表示攻击或擒拿迫在眉睫。“来捉你了”在现代汉语中自然地传达当时非利士人要制伏参孙的具体威胁。
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: 他从睡梦中醒来
  rationale: 直接表达 יקץ 与介词短语“从他的睡眠中”的含义，庄重而自然。
- source_word: אֵצֵא
  choice: 我要……出去
  rationale: 保留 יצא 的基本义“出去”，不擅自补明他出去迎战或逃走。
- source_word: כְּפַעַם בְּפַעַם
  choice: 像往常一样
  rationale: 该习语指此前一次又一次的情形；“像往常一样”简洁自然，也传达参孙以为这次仍会与过去相同。
- source_word: וְאִנָּעֵר
  choice: 挣脱开来
  rationale: נער 的尼法勒形式可描写抖动自身，并在本处含有挣脱束缚的语境意义。“挣脱开来”传达预期结果，脚注保留较为字面的译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，而不以称号代替。
- source_word: סָר מֵעָלָיו
  choice: 已经离开了他
  rationale: סור 与 מֵעַל 连用表示从某人身上撤离或离开；此译保留神离去这一严肃陈述，不添加其方式或范围。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其作为以色列之神专名的性质。
- issue: 如何表达雅威离开参孙
  choice: 雅威已经离开了他
  alternative: 雅威赐能力的同在已经离开了他
  rationale: 原文只陈述雅威离开了他，并未在本节明确界定这是能力、恩宠或盟约关系中哪一层面的撤回，因此不作神学性补充。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“来捉你了”使敌对威胁在汉语中自然明确；“像往常一样”表现参孙的自信和对既往经验的依赖。脚注标记置于其实际对应的“挣脱开来”之后。
