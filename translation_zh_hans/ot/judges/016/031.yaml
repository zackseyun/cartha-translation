base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: zh_hans
  text: 他的弟兄和他父亲的全家都下去，抬走他的遗体，又把他抬上去，葬在琐拉和以实陶之间、他父亲玛挪亚的坟墓里。他作以色列的士师二十年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他此前作以色列的士师二十年。”希伯来文也可理解为对他生前经历的回顾性总结。
    reason: 保留希伯来语完成式在此处可作一般结语或回顾性总结的歧义。
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 都下去
  rationale: 保留 ירד 所表达的向下移动；“下去”符合现代汉语叙事视角，也不抹去地势方向。
- source_word: אֶחָיו
  choice: 他的弟兄
  rationale: אָח 在此通常指亲兄弟；上下文没有充分理由将其泛化为“亲族”。
- source_word: וְכָל בֵּית אָבִיהוּ
  choice: 和他父亲全家
  rationale: “父家”是指父系家庭或家族单位；译为“他父亲全家”自然清楚，同时保留群体含义。
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: 抬走他的遗体
  rationale: נשא 在安葬语境中指抬走尸身。“遗体”使所抬对象在中文中明确而庄重，未增加新的事件内容。
- source_word: וַיַּעֲלוּ
  choice: 再带上来
  rationale: 保留 עלה 的向上移动。希伯来文承接前句省略宾语，中文以“带”自然表达他们将遗体运上去。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 葬
  rationale: 直接、自然地表达埋葬动作，且与前文“他的遗体”顺畅衔接。
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: 在琐拉和以实陶之间
  rationale: 直接保留两个地点之间的方位关系，并采用现代中文圣经地名的通行音译。
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: 他父亲玛挪亚的坟墓里
  rationale: קֶבֶר 可指坟墓或墓穴；“坟墓”在现代中文中清楚自然，并保留玛挪亚与参孙的父子关系。
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: 他作以色列的士师
  rationale: שפט 在《士师记》中是全书反复使用的士师职分用语。译作“作……的士师”既保留书卷术语，也避免现代“审判以色列”可能造成的误解。
- source_word: עֶשְׂרִים שָׁנָה
  choice: 二十年
  rationale: 按原文数词与时间名词直接翻译。
theological_decisions:
- issue: 参孙担任士师年限的叙事总结
  choice: 他作以色列的士师二十年
  alternative: 他此前作以色列的士师二十年
  rationale: 安葬记载后的希伯来语完成式既可作为简单过去时的结语，也可理解为回顾此前经历。正文采用《士师记》中自然的总结公式，并用脚注保留回顾性读法，不把时序关系解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“弟兄”“士师”保留经文所需的亲属和书卷术语；“遗体”使安葬语境清楚且得体。地势动词分别译为“下去”和“带上来”，保留原文方向感。脚注标记置于其实际说明的末句之后。
