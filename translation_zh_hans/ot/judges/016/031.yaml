  naturalness: “他父亲全家”略显歧义，容易暂时读作‘他父亲的整个家庭’而非原文的父系家族单位；“他父亲的全家”较明确。“抬走他的遗体，再带上来”也不如以同一动词连贯表达遗体的抬运和上行自然。
  terminology: “弟兄”“士师”“以色列”“琐拉”“以实陶”“玛挪亚”均合乎庄重的现代中文圣经叙事语体，并保留《士师记》的核心术语。“遗体”在此安葬语境中得体。
