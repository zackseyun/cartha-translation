base_translation:
  language: en
  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: zh_hans
  text: 参孙对正牵着他手的少年说：“让我歇一歇，又让我摸摸支撑这房屋的柱子，好让我倚在它们上面。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנַּעַר
  choice: 少年
  rationale: 该词可指男孩、少年或年轻仆役；此处用“少年”既自然，也不额外限定其身份。
- source_word: הַמַּחֲזִיק בְּיָדוֹ
  choice: 拉着他手的
  rationale: 直译为“抓住/扶着他的手”；结合参孙失明、由人引领的语境，“拉着他手”自然表达实际动作，同时避免添加原文没有的原因说明。
- source_word: הַנִּיחָה אוֹתִי
  choice: 让我歇一歇
  rationale: נוח的使役式在此可表示让某人休息、安歇；保留英语审校层所采用的“rest”，而不改译为有文本异读背景的“让我摸一摸”。
- source_word: ו/הימש/ני
  choice: 领我到
  rationale: 马所拉文本的书写形式异常，但句法与上下文要求一个使役性引导动作；“领我到”符合参孙请少年把他带到柱子旁的情景。
- source_word: הָעַמֻּדִים אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: 支撑这座殿的柱子
  rationale: 原意是“这房屋稳立在其上的柱子”；汉语以关系倒置表达更自然。“殿”在本段指非利士人聚集献祭的建筑，不必特指圣殿。
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: 好让我靠在柱子上
  rationale: 表达目的关系，并将代词所指的“柱子”明说，使中文清楚而不改变意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“歇一歇”比“休息”更符合直接引语口吻；“支撑这座殿的柱子”避免生硬直译，同时保留建筑结构含义。未加脚注，因为正文可以清楚传达所据马所拉文本。
