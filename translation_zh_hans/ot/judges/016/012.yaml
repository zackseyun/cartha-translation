base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: zh_hans
  text: 大利拉就拿新绳索[a]捆住他，对他说：“参孙，非利士人来抓你了！”那时，埋伏的人正待在内室里[b][c]。参孙却把手臂上的绳索挣断了，像扯断一根线一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绳索”也可译作“粗绳”。
    reason: lexical_alternative
  - marker: b
    text: “埋伏的人”原文为单数，也可理解为“埋伏者”或集合性地指埋伏的一方。
    reason: lexical_alternative
  - marker: c
    text: “内室”也可译作“房间”或“内间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים
  choice: 绳索
  rationale: 指较粗、可用于捆绑的绳子；“绳索”自然庄重，也与末句“一根线”形成鲜明对比。
- source_word: חֲדָשִׁים
  choice: 新
  rationale: 直接表达这些绳索是新的，保留叙事中特意强调捆绑材料未经使用的意味。
- source_word: וַתַּאַסְרֵהוּ
  choice: 捆住他
  rationale: 准确反映 אסר 的捆绑义，现代汉语中自然且清楚。
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: 非利士人来抓你了
  rationale: 希伯来语直译近于“非利士人在你身上／临到你”；此处是紧急警告，“来抓你了”自然传达逼近并袭击参孙的语境，同时不过度具体化为已经交战。
- source_word: וְהָאֹרֵב
  choice: 埋伏的人
  rationale: 原文为阳性单数分词，可指一个埋伏者，也可能以单数集合性地指埋伏的一方；正文保留单数形式，脚注说明歧义。
- source_word: יֹשֵׁב
  choice: 正待在
  rationale: 该分词本义为坐着、居留；在埋伏语境中译作“待在”比机械译作“坐在”自然，同时没有直接增译“等候袭击”。
- source_word: בֶּחָדֶר
  choice: 在内室里
  rationale: חֶדֶר 可指房间、内室或内间；“内室”符合隐藏埋伏者的场景，并保留脚注中的一般性替代译法。
- source_word: וַיְנַתְּקֵם
  choice: 挣断了
  rationale: 动词表达用力扯断或挣脱；“挣断”兼顾参孙挣脱捆绑的动作和绳索断裂的结果。
- source_word: מֵעַל זְרֹעֹתָיו
  choice: 手臂上的绳索
  rationale: 用自然汉语表达绳索从其双臂上被扯断；“手臂”清楚反映复数 זְרֹעֹתָיו。
- source_word: כַּחוּט
  choice: 如同挣断一根线
  rationale: חוּט 指线或细绳；“一根线”保留单数意象，并突出参孙挣断粗绳如断细线般轻易。
