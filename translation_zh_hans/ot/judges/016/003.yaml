  register: 采用现代、庄重而清楚的叙事语言。“躺”避免把原文明确化为“睡”；“扛在肩上”符合普通读者的自然表达。脚注标记按其实际说明对象放置：[a]置于拔出城门构件之后，[b]置于希伯仑方位短语之后。
