  naturalness: “她使他睡在她的膝上”是自然、庄重的现代叙事汉语。“剃掉他头上的七绺头发”保留大利拉为语法施事者，中文亦不排除她借所召之人执行。
  terminology: “七绺头发”恰当保留发束含义；以脚注说明也可指“七条辫子”。“使他受苦”较“制伏”更贴合原文而不擅自具体化为某一种虐待或削弱方式。
