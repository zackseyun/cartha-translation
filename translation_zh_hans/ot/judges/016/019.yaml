revisions:
- from: 她使他枕着自己的膝睡着了[a]，就叫来一个人，把他头上的七绺头发剃掉。于是她开始制伏他[b]，他的力量就离开了他。
  to: 她使他睡在她的膝上[a]，就叫来一个人，剃掉他头上的七绺头发[b]。于是她开始使他受苦[c]，他的力量就离开了他。
  rationale: 本次修订仅改善中文表达并校正两个语义范围问题：以“睡在她的膝上”替代不自然的“枕着自己的膝睡着了”；以“使他受苦”替代较具体的“制伏他”。保留大利拉为“剃掉”的语法主语，保留“一个人”的不定性，且不将力量的来源扩写为耶和华。新增发绺／辫子脚注以保留原词的合理歧义。
