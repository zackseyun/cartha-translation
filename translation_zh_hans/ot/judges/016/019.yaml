  text: וַ/תְּיַשְּׁנֵ֨/הוּ֙ עַל בִּרְכֶּ֔י/הָ וַ/תִּקְרָ֣א לָ/אִ֔ישׁ וַ/תְּגַלַּ֕ח אֶת שֶׁ֖בַע מַחְלְפ֣וֹת רֹאשׁ֑/וֹ וַ/תָּ֨חֶל֙ לְ/עַנּוֹת֔/וֹ וַ/יָּ֥סַר כֹּח֖/וֹ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: zh_hans
  text: 她使他睡在她的膝上[a]，就叫来一个人，剃掉他头上的七绺头发[b]。于是她开始使他受苦[c]，他的力量就离开了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在她的双膝上”；也可译为“在她怀中”。
    reason: lexical_alternative
  - marker: b
    text: “七绺头发”也可译为“头上的七条辫子”。
    reason: lexical_alternative
  - marker: c
    text: 也可译为“开始苦待他”或“开始折磨他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: 她使他……睡着了
  rationale: 使役式表达大利拉使参孙入睡；译文保留使役含义，同时不添加她采用何种手段。
- source_word: עַל בִּרְכֶּיהָ
  choice: 枕着自己的膝
  rationale: 原文直指“她的双膝”；中文用“枕着”自然呈现其头靠在她膝上，脚注保留“膝上／怀中”的表达差异。
- source_word: וַתִּקְרָא לָאִישׁ
  choice: 叫来一个人
  rationale: קרא ל可表示叫来或召来；אִישׁ无冠词，译作“一个人”可避免过度确定其身份。
- source_word: וַתְּגַלַּח
  choice: 把……剃掉
  rationale: 动词为阴性单数，语法主语仍是大利拉；中文可理解为她亲自做或使所召之人执行，不必擅自改成男性主语。
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: 他头上的七绺头发
  rationale: מַחְלְפוֹת指分束的发绺，也可能指辫子；正文采用较宽泛自然的“绺”，避免断定具体发式。
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: 于是她开始制伏他
  rationale: ענה的强意形可指使受苦、压制或制伏；在力量离去的直接语境中，“制伏”自然且保留敌对压迫意味，同时以脚注列出较直译的可能。
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: 他的力量就离开了他
  rationale: 按希伯来语习语直陈力量离去，现代中文清楚自然，也不额外说明力量的来源。
theological_decisions:
- issue: 参孙失去之力量的性质与来源
  choice: 只译作“他的力量就离开了他”
  alternative: 扩译为“耶和华所赐的力量离开了他”
  rationale: 本节仅说他的力量离开，未明说耶和华；虽然后文和更广语境涉及耶和华，正文不应把该解释提前加入本节。
- issue: 大利拉与受召之人的施事关系
  choice: 保留大利拉为“剃掉”的语法主语
  alternative: 译作“那人把……剃掉”或“她叫人把……剃掉”
  rationale: 马所拉文本的וַתְּגַלַּח为阴性单数，与大利拉呼应；不因叙事常识而替换原文主语，也不排除她借他人之手行事的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“枕着自己的膝”比生硬的“在她膝上”更符合中文表达；“七绺头发”保留发束含义而不武断译成“七条辫子”。正文中的脚注标记[a]、[b]均与脚注对应。
