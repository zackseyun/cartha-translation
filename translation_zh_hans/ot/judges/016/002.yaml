base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: zh_hans
  text: 迦萨人得到了消息：“参孙到这里来了。”他们便围了上来，整夜在城门口埋伏等候他。他们整夜悄然无声，说：“等到晨光出现，我们就杀死他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: 迦萨人
  rationale: 这是指迦萨居民的复数称谓；“迦萨人”简洁自然，也保留了地域身份。
- source_word: לֵאמֹר
  choice: 有人告诉……说
  rationale: 希伯来文直译近于“对迦萨人说”，没有明说传话者；用不定主语“有人”补足现代汉语句法，同时不额外确定其身份。
- source_word: בָּא ... הֵנָּה
  choice: 到这里来了
  rationale: 完成式把参孙已经抵达作为当前消息来报告；“到这里来了”在现代汉语中自然地表达这一结果状态。
- source_word: וַיָּסֹבּוּ
  choice: 把他包围起来
  rationale: 该动词可表示环绕或包围；原文未明说宾语，语境最自然地指向参孙。译文保留这一语境补足，而不添加“那地方”等原文没有的名词。
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: 埋伏等候他
  rationale: ארב 与介词 ל 连用，表示为了袭击某人而暗中守候；“埋伏等候”兼顾动作及持续等候的含义。
- source_word: בְּשַׁעַר הָעִיר
  choice: 在城门那里
  rationale: 指城门及其周边区域；“城门那里”既自然，也避免把他们的位置过度限定为门内或门边。
- source_word: וַיִּתְחָרְשׁוּ
  choice: 悄无声息
  rationale: 此处反身词形在伏击语境中表示保持安静、不动声色；“悄无声息”自然传达隐蔽静候的意味。
- source_word: עַד אוֹר הַבֹּקֶר
  choice: 等到晨光出现
  rationale: 保留“早晨的光”这一原文意象，同时用符合现代汉语的表达呈现时间界限。
- source_word: וַהֲרְגְנֻהוּ
  choice: 我们就杀了他
  rationale: 原文为“我们要杀他”；“就”自然地表达与前一句“等到……”相接的时间顺序。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“埋伏等候”“悄无声息”清楚呈现伏击场景；对原文省略的包围对象仅按上下文补为“他”，不进一步消除可能的句法含混。所有脚注标记均置于正文相应位置。
