revisions:
- from: 有人告诉迦萨人[a]说：“参孙到这里来了。”他们就把他包围起来，整夜在城门那里埋伏等候他。他们整夜都悄无声息[b]，说：“等到晨光出现[c]，我们就杀了他。”
  to: 迦萨人得到了消息：“参孙到这里来了。”他们便围了上来，整夜在城门口埋伏等候他。他们整夜悄然无声，说：“等到晨光出现，我们就杀死他。”
  rationale: 为避免把原文未明示的וַיָּסֹבּוּ宾语定为参孙，将“把他包围起来”改为“围了上来”。同时微调城门处和静默的表达，使其更符合现代标准汉语。脚注标记应仍分别置于“迦萨人[a]”“悄然无声[b]”和“晨光出现[c]”之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:31Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本准确传达了迦萨人获悉参孙到来、在城门处整夜埋伏、保持安静并计划清晨杀他的情节。惟“把他包围起来”将וַיָּסֹבּוּ未明示的宾语明确为“参孙”，而该动词在此处的具体对象并未由希伯来文本明说；宜保留这一含混。
  naturalness: 整体为自然、现代且适合叙事文本的普通话。“城门口”较“城门那里”更凝练自然；“整夜悄然无声”也比“整夜都悄无声息”更顺畅。
  terminology: “迦萨人”“参孙”及“埋伏等候”均恰当。脚注a准确说明地域称谓；脚注b和c适当地保留词义与字面意象。
