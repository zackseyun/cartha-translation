  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: zh_hans
  text: 参孙说[a]：“让我和非利士人一同死吧！”他便使尽全力倾身，房屋[c]倒塌，压在首领[b]和里面所有的人身上。这样，他死时所杀的人，比他一生所杀的还多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“愿我的性命和非利士人一同死”。这里“我的性命”是指参孙本人。
    reason: lexical_alternative
  - marker: b
    text: “首领”指非利士人的统治者；也可译作“领主”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“建筑物”；希伯来文用的是通常表示“房屋”的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: 让我……死吧
  rationale: נַפְשִׁי在这里以“我的性命/我自己”指参孙本人；用“让我死吧”自然表达祈愿语气，又不把“灵魂”作为独立实体引入正文。
- source_word: עִם פְּלִשְׁתִּים
  choice: 和非利士人一同
  rationale: 准确表达עִם的共同关系，说明参孙愿与非利士人同时死去。
- source_word: וַיֵּט בְּכֹחַ
  choice: 用尽力气屈身一推
  rationale: נטה本义范围包括倾斜、屈身、伸展；结合前文参孙撑住柱子的动作，“屈身一推”以自然汉语呈现其身体发力，但不把动词简化为单纯的“推”。בְּכֹחַ译作“用尽力气”表达强力施为。
- source_word: הַבַּיִת
  choice: 房屋
  rationale: 保留普通名词בַּיִת的基本意义，不在正文中解释性地译成“神庙”；上下文已表明这是一座可容纳众人的建筑。
- source_word: הַסְּרָנִים
  choice: 首领
  rationale: 该词特指非利士人的统治者；“首领”是清楚、现代且不带封建色彩的表达。
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: 里面所有的人
  rationale: 保留כָּל的全称意义及בּוֹ所指的建筑内部，同时符合现代汉语语序。
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: 他死时所杀的人
  rationale: 简洁保留参孙自己的死亡与他造成他人死亡发生在同一事件中的时间关联。
- source_word: רַבִּים מֵאֲשֶׁר הֵמִית בְּחַיָּיו
  choice: 比他一生所杀的还多
  rationale: 自然表达希伯来文的比较结构，并清楚呈现“死时”与“一生”的对照。
theological_decisions:
- issue: 参孙临终话语中的נֶפֶשׁ是否应直译为“灵魂”
  choice: 正文译为“让我……死吧”
  alternative: “愿我的性命和非利士人一同死”或字面译作“愿我的灵魂……死”
  rationale: 此处נֶפֶשׁ以第一人称所有格构成指代本人死亡的习语。正文采用自然的人称表达，避免引入经文本身未主张的灵魂—身体二分；脚注保留字面形式。
- issue: הַבַּיִת是否应明确译作宗教建筑
  choice: 房屋
  alternative: 神庙／建筑物
  rationale: 虽然上下文表明场所与大衮崇拜有关，但本节使用的是普通词בַּיִת。译作“房屋”保留词汇层面的非特指性，不以解释取代原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“用尽力气屈身一推”兼顾动作场景与נטה的词义范围；三个脚注标记均紧随所说明的词句，次序按正文首次出现排列。
