base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: zh_hans
  text: 那座房子里挤满了男男女女，非利士人的首领也全都在那里。屋顶上约有三千男女，正观看参孙供人取乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “观看参孙供人取乐”也可译作“观看参孙表演”或较直译为“观看参孙嬉戏”。这里的希伯来语词根 שׂחק 可表示欢笑、玩耍、嬉戏或供人娱乐。
    reason: 保留 בִּשְׂחוֹק שִׁמְשׁוֹן 的词义和句法歧义，避免把一种解释呈现为唯一可能。
lexical_decisions:
- source_word: הַבַּיִת
  choice: 那座房子
  rationale: 原文的基本义是“房子、建筑物”。上下文虽指大衮庙宇的建筑，但本节没有明说“庙”，因此不作过度限定；“那座”自然承接叙事中的既知场所。
- source_word: מָלֵא הָאֲנָשִׁים וְהַנָּשִׁים
  choice: 里挤满了男男女女
  rationale: מָלֵא 表示“充满”；“挤满”符合大型聚集场景，并自然传达人数众多。原文明确同时提到男人和女人，“男男女女”在现代汉语中自然且准确。
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的首领也全都
  rationale: סְרָנִים 是非利士人统治者的特有称号；“首领”既保留其政治地位，又比“诸侯”更便于现代普通读者理解。
- source_word: וְעַל הַגָּג
  choice: 屋顶上
  rationale: גָּג 指房顶或屋顶；保留原文前置的地点信息。
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: 约有三千
  rationale: 前缀 כ־ 在此表示约数，“约有三千”简洁准确。
- source_word: אִישׁ וְאִשָּׁה
  choice: 男女
  rationale: 两个单数名词在此作集合性表达，实际所指为许多男人和女人；汉语用“男女”自然。
- source_word: הָרֹאִים
  choice: 正观看
  rationale: 分词表示屋顶人群持续观看的动作；“正观看”体现进行状态。
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: 参孙供人取乐
  rationale: 该短语的 שׂחק 可指嬉笑、玩耍、戏弄或娱乐；结合前文参孙被带出来供众人取乐的语境，此译自然表达其受辱、成为娱乐对象的情形，同时以脚注保留词义与句法上的其他可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“男男女女”适合描述拥挤的人群；“男女”用于第二处则较为简洁，避免重复显得累赘。未添加原文没有的时间连接词，也未将“房子”明确化为“庙宇”。
