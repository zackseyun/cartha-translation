base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: zh_hans
  text: 参孙就呼求耶和华，说：“主耶和华啊，求你顾念我；上帝啊，求你只这一次赐我力量，使我能为我的两只眼睛向非利士人报一次仇。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为我的两只眼睛”：原文直译如此，指非利士人弄瞎参孙双眼一事。
    reason: 说明希伯来文简略表达所指的上下文事件，同时保留正文中“我的两只眼睛”的字面意象。
lexical_decisions:
- source_word: וַיִּקְרָא שִׁמְשׁוֹן אֶל־יְהוָה
  choice: 参孙就呼求耶和华
  rationale: קרא אֶל用于向神求告；“呼求”比单纯“呼叫”更自然地表达祷告语境，又不额外强化情绪。יהוה以其专名“耶和华”呈现。
- source_word: אֲדֹנָי יֱהֹוִה
  choice: 主耶和华啊
  rationale: 分别保留אֲדֹנָי的称号“主”和יהוה的专名；中文无须像英语那样以全大写“GOD”避免重复。
- source_word: זָכְרֵנִי נָא
  choice: 求你顾念我
  rationale: זכר在向神祈求的语境中不只是认知上的“记得”，也含求神眷顾、介入之意；“顾念”庄重且自然，נָא由“求”表达。
- source_word: וְחַזְּקֵנִי נָא
  choice: 求你……赐我力量
  rationale: Piel形态表示使之强壮；“赐我力量”准确传达求神加力的使役意义。
- source_word: אַךְ הַפַּעַם הַזֶּה
  choice: 只在这一次
  rationale: 保留אַךְ的限制意味和“这一次”的时间指向，符合现代汉语表达。
- source_word: הָאֱלֹהִים
  choice: 上帝啊
  rationale: 按呼格处理，并与前面的专名和称号有所区分；“上帝”是现代标准汉语中自然、庄重的神称。
- source_word: וְאִנָּקְמָה נְקַם אַחַת
  choice: 使我……报……之仇，只报这一次
  rationale: 以目的结构表达祈愿式的意愿；将同根宾语和אַחַת的“一次”落实为“报仇，只报这一次”，尽量保留原文强调单次报复的表达。
- source_word: מִשְּׁתֵי עֵינַי מִפְּלִשְׁתִּים
  choice: 向非利士人报我双眼之仇
  rationale: 两个מִן短语在נקם结构中分别标示报复对象及缘由；“报我双眼之仇”保留原文简练而略带省略的说法。
theological_decisions:
- issue: 祷告中神的专名和称号
  choice: 将יְהוָה译为“耶和华”，将אֲדֹנָי יֱהֹוִה译为“主耶和华”
  alternative: 将两处都泛化为“主”或“主上帝”
  rationale: 保留原文在专名、主权称号和“上帝”称呼之间的层次，不把它们合并成一个泛称。
- issue: 参孙报仇请求的道德评价
  choice: 直接保留参孙向神求力量报仇的祷告
  alternative: 用措辞将其解释为神所认可的审判，或加以道德谴责
  rationale: 本节叙述参孙的祈求，并未在句内明确评断其动机；译文不应替原文消解这种神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“呼求”“顾念”“赐我力量”“报……之仇”适合祷告与叙事语境；避免文言化过重，也不在译文中替叙述者评断参孙的复仇愿望。
