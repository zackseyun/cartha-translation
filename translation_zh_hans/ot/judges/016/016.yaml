  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: zh_hans
  text: 后来，她天天用话逼迫他，催逼他，以致他心里烦闷得要死。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“他的心灵变得短促，以至于死”；这是形容极度苦恼、烦躁或疲惫不堪的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: 后来
  rationale: 用现代汉语自然承接叙事，同时保留希伯来语所表示的情节推进；若直译为“事情发生了，当……”会显得生硬。
- source_word: הֵצִיקָה לוֹ בִדְבָרֶיהָ
  choice: 她用话催逼他
  rationale: הֵצִיקָה 表示使人受压、苦恼；结合 בִדְבָרֶיהָ，译作“用话催逼”既具体又符合上下文中的持续言语施压。
- source_word: כָּל הַיָּמִים
  choice: 天天
  rationale: 准确传达“所有的日子”所表达的日复一日和持续不断，比字面译作“所有日子”更符合现代汉语。
- source_word: וַתְּאַלֲצֵהוּ
  choice: 紧紧迫他
  rationale: 该动词加强前面的施压之意；“紧紧迫他”保留累积和强逼的力度，并避免完全重复“催逼”。
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: 他心里烦闷
  rationale: 希伯来语字面为“他的 נפש 变短”，是表示内心极度受压、烦躁或不堪忍受的习语。“心里烦闷”在现代汉语中自然，同时不把含义过度限定为单纯的不耐烦。
- source_word: לָמוּת
  choice: 得要死
  rationale: 保留原文达到死亡程度的强烈结果表达；“烦闷得要死”是自然汉语，不额外断定他明确产生了自杀意愿。
