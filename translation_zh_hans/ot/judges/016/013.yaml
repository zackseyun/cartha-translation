base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: zh_hans
  text: 大利拉对参孙说：“到如今，你一直戏弄我，对我说谎。告诉我，用什么可以捆住你。”参孙对她说：“如果你把我头上的七绺头发编进织物里[a]……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把我头上的七条发辫与织机上的经线编在一起”，也可理解为“编进织成的布里”。这里的希伯来语是较专门的纺织用语，具体所指不十分确定。
    reason: 保留 מַחְלְפוֹת（发绺或发辫）、מַסָּכֶת（织物、织面或与织机有关之物）及 עִם 在这一纺织语境中的关系歧义。
lexical_decisions:
- source_word: הֵתַ֤לְתָּ בִּי
  choice: 你还在戏弄我
  rationale: 该表达指以欺骗的方式愚弄、耍弄某人。“戏弄我”简洁自然，也避免与下句“对我说谎”意义完全重复。
- source_word: כְּזָבִים
  choice: 谎
  rationale: 这是表示虚假言语的复数名词；汉语用“说谎”最自然，不必机械体现复数。
- source_word: הַגִּידָה לִּי
  choice: 告诉我
  rationale: 准确传达命令式“向我说明、告诉我”，符合现代汉语表达。
- source_word: בַּמֶּה תֵּאָסֵר
  choice: 究竟用什么才能捆住你
  rationale: 保留介词所表达的工具含义“用什么”，并以“才能”自然呈现未完成式在此处的可能性意味。
- source_word: תַּאַרְגִי
  choice: 编进
  rationale: 原词通常指纺织、编织；结合头发与织物的场景，“编进”既保留织造动作，也使汉语动作关系清楚。
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: 我头上的七绺头发
  rationale: מַחְלְפוֹת 可指发绺或发辫；“七绺头发”保持这一词义范围，不武断认定已经编成辫子。
- source_word: עִם הַמַּסָּכֶת
  choice: 编进织物里
  rationale: מַסָּכֶת 是较专门的纺织术语，可能指织物、经线形成的织面，或与织机相关之物。正文采用场景中较通顺的“织物”，脚注保留其他可能。
