source:
  edition: WLC
  text: וַ/תֵּ֣רֶא דְלִילָ֗ה כִּֽי הִגִּ֣יד לָ/הּ֮ אֶת כָּל לִבּ/וֹ֒ וַ/תִּשְׁלַ֡ח וַ/תִּקְרָא֩ לְ/סַרְנֵ֨י פְלִשְׁתִּ֤ים לֵ/אמֹר֙ עֲל֣וּ הַ/פַּ֔עַם כִּֽי הִגִּ֥יד ל/ה אֶת כָּל לִבּ֑/וֹ וְ/עָל֤וּ אֵלֶ֨י/הָ֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים וַ/יַּעֲל֥וּ הַ/כֶּ֖סֶף בְּ/יָדָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: zh_hans
  text: 大利拉见他把心里的一切都告诉了她，就派人去召非利士人的首领[b]，说：“这一次你们上来吧，因为他已经把心里的一切都告诉她了[a]。”于是，非利士人的首领上到她那里，手里带着银子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本作“告诉她了”。在大利拉的直接引语中，按通常表达可能会说“告诉我了”，但现存希伯来文本使用第三人称阴性单数。
    reason: textual_variant
  - marker: b
    text: 或译“非利士人的统治者”。
    reason: lexical_alternative
  - marker: c
    text: 指作为酬金的银子。
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 见
  rationale: 保留 ראה 的基本视觉、察觉含义；结合后面的内容从句，在现代汉语中自然表达为“见……”。
- source_word: כִּי
  choice: （见）……
  rationale: 这里引出大利拉所察觉的内容，不译作表示原因的“因为”；汉语以“见他……”自然承载这一从属关系。
- source_word: הִגִּיד
  choice: 告诉了
  rationale: נגד 的使役词干在此意为“告知、说出”；“告诉了”符合叙事情境，也保留动作已经完成的语气。
- source_word: אֶת־כָּל לִבּוֹ
  choice: 把心里的一切
  rationale: 希伯来语直译为“他的全心”，在本段指毫无保留地吐露内情；“心里的一切”既保留“心”的意象，又符合现代汉语表达。
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: 派人去召
  rationale: 兼顾“派遣”和“召唤”两个连续动作，避免汉语中生硬重复。
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的首领
  rationale: סרן 指非利士人的高级统治者；“首领”清楚、自然，也不引入封建语境中的“领主”意味。
- source_word: עֲלוּ הַפַּעַם
  choice: 这一次你们上来吧
  rationale: 保留 עלה 的上行、前往说话者所在地之意，并以“这一次”表达 הַפַּעַם 所强调的时机。
- source_word: כִּי הִגִּיד לָהּ אֶת־כָּל לִבּוֹ
  choice: 因为他已经把心里的一切都告诉她了
  rationale: 保留马所拉文本中的第三人称阴性单数“她”，不按直接引语的常见表达擅自改成“我”；以脚注提示其不寻常之处。
- source_word: וְעָלוּ אֵלֶיהָ
  choice: 于是……上到她那里
  rationale: 保留 עלה 的方向性，同时用“于是”顺畅推进叙事。
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: 手里带着银子
  rationale: 表达他们前来时携带银子的情形；“银子”比泛称“钱”更贴近 הַכֶּסֶף，同时在脚注说明其为酬金。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留希伯来叙事的动作次序及“上来／上到”的方向表达；将“他的全心”译为汉语可懂的“心里的一切”，并借脚注保留直接引语中第三人称“她”的文本张力。
