  text: וַ/יָּ֛שֶׁב אֶת אֶֽלֶף וּ/מֵאָ֥ה הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תֹּ֣אמֶר אִמּ֡/וֹ הַקְדֵּ֣שׁ הִקְדַּ֣שְׁתִּי אֶת הַ/כֶּסֶף֩ לַ/יהוָ֨ה מִ/יָּדִ֜/י לִ/בְנִ֗/י לַֽ/עֲשׂוֹת֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וְ/עַתָּ֖ה אֲשִׁיבֶ֥/נּוּ לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: zh_hans
  text: 于是，他把一千一百块银子还给他母亲。他母亲说：“我已郑重地把这银子从我手中[a]献给雅威，专为我儿子制作雕刻的像和铸造的像[b]。现在我把它还给你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“从我手中”，可表示银子出自她本人所有，或强调由她亲自奉献。
    reason: cultural_note
  - marker: b
    text: “铸造的像”也可译作“熔铸的像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: 还给
  rationale: 使役词形在这里表示使某物归还，即把先前拿走的银子交还；“还给”符合现代汉语叙事习惯。
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: 一千一百块银子
  rationale: 原文没有在本节明说重量单位；用量词“块”使汉语自然，同时避免过早补入“舍客勒”。
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: 我已经郑重地把这银子……分别出来，献给
  rationale: 不定式绝对式与限定动词连用，强化奉献行为；“郑重地”传达强调，“分别出来，献给”保留敬拜语境中的分别为圣含义。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 直接音译圣名 יהוה 为“雅威”，保留其作为盟约之神专名的功能。
- source_word: מִיָּדִי
  choice: 从我手中
  rationale: 保留原文具体的“手”之表达，不武断限定为所有权、来源或亲自执行；以脚注说明其语用范围。
- source_word: לִבְנִי
  choice: 为我儿子
  rationale: 介词 ל־ 在此表示对象或受益者，并与后面的制作目的相连。
- source_word: פֶּסֶל
  choice: 一尊雕像
  rationale: 表示经雕刻制成的形像；“雕像”现代、具体，也避免直接以解释性的“偶像”代替物件名称。
- source_word: וּמַסֵּכָה
  choice: 和一尊铸像
  rationale: מסכה 通常指熔化材料后铸成的形像；“铸像”简洁地保留制作方式。
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: 我把银子还给你
  rationale: 使役未完成式可依语境表达当下决定或即将发生的动作；明确重复“银子”比汉语中的单一代词更清楚。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译为“雅威”保留专名性质，不以称号替代。
- issue: 奉献用语与制造形像之间的张力
  choice: 保留“分别出来，献给雅威……制作一尊雕像和一尊铸像”
  alternative: 将其弱化为一般用途，或明说这是错误、悖逆的奉献
  rationale: 原文使用郑重的奉献语言，却把用途说成制作形像；译文不加入评价或调和，让叙事本身的神学张力保持可见。
- issue: “雕像和铸像”所指物件的关系
  choice: 按原文并列译为“一尊雕像和一尊铸像”
  alternative: 合并解释为一尊兼具雕刻与铸造工艺的像
  rationale: 原文并列两个单数名词，但没有在本句明确说明它们究竟是两个物件，还是对相关制品的组合描述；正文保留并列形式，不替读者解决这一问题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“分别出来，献给”兼顾礼仪用语的分量与普通读者的可理解性；避免古奥表达，也不把叙事中的形像预先解释为特定宗派概念。
