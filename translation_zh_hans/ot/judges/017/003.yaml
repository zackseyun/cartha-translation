  - severity: low
    issue: “雕像”在现代汉语中可泛指纪念性或艺术性塑像。
    rationale: “雕刻的像”更直接呈现 פֶּסֶל 的制作特征，并与“铸造的像”形成对应；仍不预断二者究竟指两个物件还是相关制品的并列描述。
