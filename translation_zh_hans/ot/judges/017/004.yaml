  text: וַ/יָּ֥שֶׁב אֶת הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תִּקַּ֣ח אִמּ/וֹ֩ מָאתַ֨יִם כֶּ֜סֶף וַ/תִּתְּנֵ֣/הוּ לַ/צּוֹרֵ֗ף וַֽ/יַּעֲשֵׂ֨/הוּ֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽיְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: zh_hans
  text: 于是，他把银子还给他母亲。他母亲拿出二百银子[a]，交给银匠；银匠把银子制成雕像和铸像[b]。那制成的物件[c]就在米迦家里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“二百舍客勒银子”。本节希伯来原文只说“二百银子”，没有明说计量单位。
    reason: lexical_alternative
  - marker: b
    text: “雕像和铸像”也可译作“雕刻的像和熔铸的像”。这两个说法可能指两个物件，也可能从不同方面描述同一件制成品。
    reason: lexical_alternative
  - marker: c
    text: “雕像和铸像”之后，希伯来原文使用单数动词（“它在”），可能把制成的物件或整组物件视为一个整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: 还给
  rationale: 该词是שׁוב的使役叙事形式，表示使银子回到原主手中；“还给”自然地表达归还之意。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף既可指银，也可指钱；本节涉及称量并交给银匠制作器物，因此译作具体的“银子”更贴合语境。
- source_word: לְאִמּוֹ / אִמּוֹ
  choice: 给母亲／他母亲
  rationale: 希伯来文两次明说“母亲”，译文保留这一重复，以维持叙事衔接。
- source_word: מָאתַיִם כֶּסֶף
  choice: 二百银子
  rationale: 原文只有数词加“银子”，本节没有明说计量单位；正文不擅自补入“舍客勒”，并以脚注说明可能的具体理解。
- source_word: לַצּוֹרֵף
  choice: 给银匠
  rationale: צֹרֵף可指炼金属或制作金属器物的工匠；材料在此是银，故“银匠”准确且自然。
- source_word: וַיַּעֲשֵׂהוּ
  choice: 银匠把银子制成
  rationale: 动词为阳性单数，最自然的主语是银匠；宾语后缀回指银子。“制成”清楚表达材料被加工成后述形象。
- source_word: פֶּסֶל
  choice: 雕像
  rationale: 该词指雕刻而成的形象，在本语境中具有偶像崇拜色彩，但正文采用词义直接、不过度解释的“雕像”。
- source_word: וּמַסֵּכָה
  choice: 和铸像
  rationale: מַסֵּכָה指以熔铸方式制成的形象；“铸像”是简洁、现代的对应表达。
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: 它就放在米迦家里
  rationale: 原文在两个并列名词之后使用单数动词，可能把所制成的对象或整组物件视为一个整体；用单数“它”保留这一语法张力，并由脚注说明。
- source_word: מִיכָיְהוּ
  choice: 米迦
  rationale: 采用《士师记》中这一人物通行的现代中文译名。
theological_decisions:
- issue: 是否把פֶּסֶל וּמַסֵּכָה直接译成带明确谴责色彩的“偶像”
  choice: 雕像和铸像
  alternative: 偶像和铸造的神像
  rationale: 上下文表明这些是用于错误敬拜的物件，但本节所用名词主要描述形象及其制作方式。直译可保留叙事措辞及其神学张力，不在正文中加强原文未明说的评断。
- issue: “雕像和铸像”是一个对象还是两个对象
  choice: 保留两个名词，并以单数“它”承接
  alternative: 合并译作“一尊雕铸的像”，或改用复数“它们”
  rationale: 原文既有两个并列名词，又以单数动词和此前的单数宾语后缀承接。译文不武断判定是一个复合制作物还是一组物件，而借正文与脚注共同保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“二百银子”略带经文式凝练，但能避免把原文未明说的单位写进正文；“雕像和铸像”保留制作方式与对象数量上的歧义。
