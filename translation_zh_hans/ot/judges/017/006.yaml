  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: zh_hans
  text: 那时候，以色列中没有王；各人[a]都做自己眼中看为对的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用阳性单数“人”，在这里作代表性和分配性的泛指，可译作“每个人”。
    reason: 说明希伯来语的语法形式及其泛指功能。
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 那时候
  rationale: 这是叙事中常见的时间框架语；“那时候”自然、简洁，并保留回顾性的语气。
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: 以色列中没有王
  rationale: 准确表达 אֵין 所表示的不存在状态，不额外说明君王缺位的政治或神学意义。
- source_word: אִישׁ
  choice: 各人
  rationale: 原文用阳性单数名词作分配性、代表性表达；“各人”在现代汉语中自然地传达“每一个人”，同时由脚注说明原文形式。
- source_word: הַיָּשָׁר
  choice: 看为对的事
  rationale: יָשָׁר 可指正直、正确；在此结构中，“对的事”能自然表达行为者对何为正确的判断。
- source_word: בְּעֵינָיו
  choice: 自己眼中
  rationale: 保留希伯来语“在自己眼中”的意象和主观判断色彩，而不将其改写成纯粹抽象的“自己认为”。
- source_word: יַעֲשֶׂה
  choice: 都做
  rationale: 未完成式在叙事总结中表示惯常行为；汉语借“各人都做”自然传达反复、普遍的过去情形，无须机械标出时态。
theological_decisions:
- issue: 本句是否明确主张君主制度本身是以色列乱象的必要解决办法
  choice: 按原文直述“没有王”，并借“自己眼中看为对”保留叙述者的负面评价意味
  alternative: 把本句扩展为君主制度具有绝对必要性的明确神学论断
  rationale: 士师记中的重复句式在文学上评述社会和宗教失序，但本节本身没有完整阐述君主制神学；译文应保留这种张力，不超出原文作政治或教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“自己眼中看为对”略带原文意象，既能让普通读者理解，也保留本句对主观自定是非的含蓄批评。
