base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: zh_hans
  text: 有一个年轻人，来自犹大的伯利恒，出自犹大的宗族[a]；他是利未人，寄居在那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译作“家族”。希伯来语所用的词可指家族或宗族群体。
    reason: lexical_alternative
  - marker: b
    text: “寄居”也可译作“暂住”或“居住”。这里的希伯来语动词常指作为外来者或非永久居民住在某地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 有一个
  rationale: 这是叙事中引入新人物的常用表达；用“有一个”自然地承担场景引介功能，不额外加入原文没有的明确时间词。
- source_word: נַעַר
  choice: 年轻人
  rationale: 此词可指少年、青年或仆役；上下文描述的是其来历和身份，并未表示仆役职分，因此译作“年轻人”。
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: 来自犹大的伯利恒
  rationale: “犹大”限定伯利恒所在的地区，以区别其他同名地点；这一表达在现代汉语中清楚自然。
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: 属于犹大的宗族
  rationale: מִשְׁפָּחָה可指家族或宗族群体；“宗族”比“支派”范围更准确，也保留与下文“利未人”并列所产生的张力。
- source_word: לֵוִי
  choice: 利未人
  rationale: 该名词直接表明此人的利未人身份；采用通行而简洁的译法。
- source_word: גָר שָׁם
  choice: 寄居在那里
  rationale: גור常指以外来者或非永久居民的身份住在某处；“寄居”既保留这一语义，也符合庄重而易懂的现代汉语。
theological_decisions:
- issue: 此人的犹大宗族归属与利未人身份之间表面上的张力
  choice: 在正文中同时保留“属于犹大的宗族”和“他是利未人”，不作调和。
  alternative: 把“犹大的宗族”解释性改写为纯粹的地理或社会归属，或用意译消除两者之间的张力。
  rationale: 希伯来文本将两项陈述并列，译文应保留原文的真实张力，不自行判定两者如何协调。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“有一个”自然引入人物；分号保留原文身份陈述的并列感。脚注标记分别紧随其实际说明的“宗族”和“寄居在那里”，避免标记错位。
