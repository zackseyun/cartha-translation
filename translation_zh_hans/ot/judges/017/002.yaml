base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: zh_hans
  text: 他对母亲说：“从你那里被拿走的那一千一百块银子，你曾为此发咒[a]，也曾说给我听。看，银子在我这里，是我拿的。”母亲说：“愿我的儿子蒙雅威赐福[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你曾为此起誓”。原文动词既可指起誓，也可指发咒；这里的上下文较支持“发咒”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我的儿子被祝福，归于／由雅威”；这是一句措辞紧凑的祝福语。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: 一千一百块银子
  rationale: 原文只明确数量和银子，并未明说重量单位；用“块”作自然的量词，避免擅自增添“舍客勒”。
- source_word: לֻקַּח לָךְ
  choice: 从你那里被拿走
  rationale: 保留לקח被动式的基本含义及财物离开母亲之意；上下文虽暗示偷窃，但原动词本身只说“拿走”。
- source_word: וְאַתִּי אָלִית
  choice: 你曾为此发咒
  rationale: אלה可指起誓或发咒；失银的叙事语境较支持“发咒”，同时以脚注保留另一词义。
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: 还亲口说给我听
  rationale: 将“在我耳中说”的希伯来习语译为自然现代汉语，并保留儿子亲耳听到的重点。
- source_word: הִנֵּה
  choice: 看
  rationale: 作为引人注意的话语标记，“看”简洁自然，也保留原文的指示作用。
- source_word: הַכֶּסֶף אִתִּי
  choice: 银子在我这里
  rationale: 贴近原文“银子与我同在”的结构，在现代汉语中也清楚自然。
- source_word: אֲנִי לְקַחְתִּיו
  choice: 是我拿的
  rationale: 以“是我”体现独立人称代词אֲנִי所带的强调，突出儿子的承认。
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: 愿我的儿子蒙雅威赐福
  rationale: 用自然汉语表达紧凑的希伯来祝福语；脚注说明原文介词结构的简约和多义性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通行学术重构的读音，并明确将其作为专名处理。
- issue: 母亲祝福语中לַיהוָה的关系
  choice: 愿我的儿子蒙雅威赐福
  alternative: 我的儿子归于雅威，是有福的
  rationale: 此处最自然地理解为雅威是赐福者，但ל介词构成的原文措辞十分紧凑，故在脚注中保留其可直译为“对／归于雅威”的形式张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。对话保持直接自然；不使用文言化的“看哪”，也不把银子的单位具体化为原文未明说的“舍客勒”。
