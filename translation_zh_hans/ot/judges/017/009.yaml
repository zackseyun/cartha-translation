    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  choice: 你从哪里来
  rationale: 这是询问来处的表达；译文自然，也保留了对来源地的追问。
- source_word: לֵוִי
  choice: 利未人
  rationale: 指利未支派的成员；现代汉语以“我是利未人”自然表达身份。
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: 来自犹大的伯利恒
  rationale: 表明是位于犹大境内的伯利恒，既清楚又保留地理限定。
- source_word: הֹלֵךְ
  choice: 我要去
  rationale: 分词在语境中表示正在进行或即将展开的行动；“我要去”简洁自然，不额外限定出行方式。
- source_word: לָגוּר
  choice: 寄居
  rationale: גור常指暂时居住，尤其带有外来者或依附居住者的意味；“寄居”比“居住”更能保留这一层含义。
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: 找到哪里，就在哪里
  rationale: 原文省略所找到之物，表达落脚地点尚未确定；此译法保留省略和开放性，同时符合现代汉语表达。
