base_translation:
  language: en
  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: zh_hans
  text: 于是，利未人答应与那人同住[a]；这年轻人在他那里，就像他的一个儿子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿意与那人同住。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“这年轻人在他那里，像他的一个儿子。”这表示米迦把这利未人当作自己家中的一员。
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: 答应
  rationale: יאל的使役形在这里表示愿意、同意。结合上文那人的邀请，“答应”自然地表达利未人接受了他的安排，同时保留“愿意”的词义可能，列入脚注。
- source_word: הַלֵּוִי
  choice: 利未人
  rationale: 带定冠词，指上下文已经出现的那位利未人；“利未人”是准确而通行的称呼。
- source_word: לָשֶׁבֶת אֶת הָאִישׁ
  choice: 与那人同住
  rationale: ישׁב可表示坐、居住或停留；在接受住处的语境中译作“同住”最为清楚。אֶת在此表示伴随关系，“与那人”符合现代汉语。
- source_word: הַנַּעַר
  choice: 这年轻人
  rationale: נַעַר可指少年、年轻人或侍从。此人已能独立行动并承担职分，因此“年轻人”最合适；“这”承接前文所指。
- source_word: וַיְהִי ... ל֔וֹ כְּאַחַד מִבָּנָיו
  choice: 这年轻人对他来说，就像自己的一个儿子
  rationale: 保留希伯来文的关系结构和“像”的明喻，不把这种关系直接改写为正式收养或亲生父子关系。“就”体现由此形成的状态。
theological_decisions:
- issue: 利未人与那人的父子式关系是否表示正式收养
  choice: 译为“像自己的一个儿子”
  alternative: 译为“成了他的儿子”
  rationale: 原文有比较词כְּ（“像、如同”），只说明利未人在那人那里的地位或待遇类似儿子，并未明确表示正式收养；因此保留明喻及其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“于是”承接上文邀请及利未人的回应；“同住”比“居住在那人那里”更简洁自然。正文保留“对他来说”的关系表达，并用脚注说明希伯来语形式与家庭身份的含义。
