revisions:
- from: 那人离开犹大的伯利恒城，要到能找到的地方寄居。他来到以法莲山区，走到米迦的家那里，继续赶路。[a]
  to: 那人离开犹大的伯利恒城，要在他所能找到的地方寄居。他来到以法莲山区，到了米迦的家，继续赶路。[a]
  rationale: 作两处轻微措辞调整：以“在他所能找到的地方寄居”更准确、自然地表达原文不定处所；以“到了米迦的家”替换“走到米迦的家那里”，使现代汉语更简洁，同时保留原文的行程终点。其余译法及脚注均可保留。
