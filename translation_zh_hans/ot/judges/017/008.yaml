base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: zh_hans
  text: 那人离开犹大的伯利恒城，要在他所能找到的地方寄居。他来到以法莲山区，到了米迦的家，继续赶路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “继续赶路”也可译作“走自己的路”或“在赶路途中”。希伯来语直译为“行他的路”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָאִישׁ
  choice: 那人离开
  rationale: הלך在叙事中表示出发、行走；结合其后的出发地点，用“离开”自然表达行动，同时保留“那人”对应 הָאִישׁ。
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: 离开犹大的伯利恒城
  rationale: 原文以“从那城、从犹大的伯利恒”同位说明出发地；汉语合并为“犹大的伯利恒城”，既清楚又保留 עִיר 的“城”。
- source_word: לָגוּר
  choice: 寄居
  rationale: גור常指暂住或以外来者身份居住；“寄居”简洁保留这种非永久定居的意味。
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: 到能找到的地方
  rationale: 原文未明说所找到的宾语，语境暗示可供寄居之处；“地方”是汉语中必要而克制的补足。
- source_word: הַר אֶפְרַיִם
  choice: 以法莲山区
  rationale: 此固定地理表达指以法莲的山地地区，而非一座名为“以法莲山”的单独山峰。
- source_word: עַד בֵּית מִיכָה
  choice: 走到米迦的家那里
  rationale: עַד 表示行程所达之处；“走到……那里”自然呈现其抵达米迦家的范围终点。
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: 继续赶路
  rationale: 字面为“行他的路/办理他的路程”，是表示行路、继续旅程的习语；“继续赶路”符合此处叙事情境，但原结构亦可作伴随性理解，故加注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“寄居”保留原文的暂居意味；“以法莲山区”采用清楚的现代地理称谓。脚注置于相关习语之后，以避免把原文可能表示目的或伴随情形的结构限定为唯一解释。
