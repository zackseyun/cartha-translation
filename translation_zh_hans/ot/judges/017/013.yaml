  text: וַ/יֹּ֣אמֶר מִיכָ֔ה עַתָּ֣ה יָדַ֔עְתִּי כִּֽי יֵיטִ֥יב יְהוָ֖ה לִ֑/י כִּ֧י הָיָה לִ֛/י הַ/לֵּוִ֖י לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: zh_hans
  text: 于是米迦说：“现在我知道，雅威必善待我，因为我有这个利未人[a]作祭司。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我有一个利未人作祭司。”原文“利未人”带定冠词，可指上文已经提到的那个利未人；也可着重表达米迦如今有一名利未人担任祭司。
    reason: 说明定冠词的特指含义及汉语中可采用的不定表达，保留原文在具体所指与身份强调之间的语用空间。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未完成式连续结构推进叙事；现代汉语通常无需另译连接词，语序已自然体现事件承接。
- source_word: מִיכָה
  choice: 米迦
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: עַתָּה יָדַעְתִּי
  choice: 现在我知道
  rationale: 完成式表达由当前认识所得的确定状态；“现在我知道”既贴近原文，也符合自然汉语。
- source_word: יֵיטִיב יְהוָה לִי
  choice: 雅威必善待我
  rationale: יֵיטִיב 是 יטב 的使役词干，表示施恩、善待或使境况变好；“善待我”保留宽泛含义，不将其限缩为物质上的兴旺。“必”传达此处未完成式在米迦断言中的将来与确信语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: כִּי הָיָה לִי
  choice: 因为我有
  rationale: 第二个 כִּי 引出米迦确信的理由；הָיָה לִי 是希伯来语表达拥有或具有某种关系的结构，译为“我有”自然清楚。
- source_word: הַלֵּוִי
  choice: 这个利未人
  rationale: 原文带定冠词，并指向上文已经出现的那名利未人；“这个利未人”在现代汉语中既自然，也保留其特指性。
- source_word: לְכֹהֵן
  choice: 作祭司
  rationale: 介词 לְ 标明身份或职能；“作祭司”简洁地表达其担任的角色。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，故以“雅威”音译，保留神的专名，不用“主”这一称号替代。
- issue: 米迦关于神必善待他的断言
  choice: 直接保留为米迦本人的确信
  alternative: 在正文中说明或纠正其神学判断
  rationale: 经文是在叙述米迦的想法，并不在本节中明确认可这一推论；译文应保留叙事中的张力，不替叙述者作解释，也不把人物的话改写成客观应许。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威必善待我”保留米迦强烈的主观确信；“这个利未人”承接上文，同时用脚注交代另一种自然译法。
