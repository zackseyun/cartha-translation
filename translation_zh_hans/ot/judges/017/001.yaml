  yaml_path: translation/ot/judges/017/001.yaml
  text: There was a man from the hill country of Ephraim[a], and his name was Mikayhu.
translation:
  language: zh_hans
  text: 有一个人来自以法莲山区，他名叫米迦耶胡[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“米迦”；这里的希伯来文形式是“米迦耶胡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 有一个人
  rationale: 这里的叙事形式引出新的场景；现代汉语用“有一个人”自然表达其存在和引介功能，不另加原文没有的“那时”或“现在”。
- source_word: אִישׁ
  choice: 一个人
  rationale: 直译为一个男性个体；不加“某个”，以免增添原文未明说的特指意味。
- source_word: מֵהַר אֶפְרָיִם
  choice: 来自以法莲山区
  rationale: 该短语指与以法莲相关的高地地区，并非一座名为“以法莲山”的单独山峰；“以法莲山区”准确且符合现代汉语地理表达。
- source_word: וּשְׁמוֹ
  choice: 他名叫
  rationale: 表达原文“他的名字是”的简单并列叙述；“他名叫”在现代汉语中更自然简洁。
- source_word: מִיכָיְהוּ
  choice: 米迦耶胡
  rationale: 按本节希伯来文形式音译，保留词尾 יהו 所反映的较长姓名形式，不直接以传统简称“米迦”取代。
