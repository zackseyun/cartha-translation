source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ מִיכָ֜ה שְׁבָ֣/ה עִמָּדִ֗/י וֶֽ/הְיֵה לִ/י֮ לְ/אָ֣ב וּ/לְ/כֹהֵן֒ וְ/אָנֹכִ֨י אֶֽתֶּן לְ/ךָ֜ עֲשֶׂ֤רֶת כֶּ֨סֶף֙ לַ/יָּמִ֔ים וְ/עֵ֥רֶךְ בְּגָדִ֖ים וּ/מִחְיָתֶ֑/ךָ וַ/יֵּ֖לֶךְ הַ/לֵּוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: zh_hans
  text: 米迦对他说：“你住在我这里，作我的父和祭司吧。我每年给你十份银子[a]、一套衣服[b]，并供给你生活所需。”利未人就进去了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“十银”，没有注明单位；也常译作“十舍客勒银子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“一份衣物津贴”。
    reason: lexical_alternative
  - marker: c
    text: 原文动词直译为“去了”；按上下文，也可能指他进了米迦的家。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: 你住在我这里
  rationale: ישב的祈使式在此是邀请利未人与米迦一同居住；“住在我这里”自然表达持续居留之意。
- source_word: לְאָב וּלְכֹהֵן
  choice: 作我的父和祭司
  rationale: 直译并保留“父”这一尊称及其社会—宗教隐喻，不把它解释性改写为“顾问”或其他后期称谓。
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: 十份银子
  rationale: 原文仅说“十银”，没有明说重量或货币单位；“十份银子”在中文中可读，同时避免擅自补入“舍客勒”。
- source_word: לַיָּמִים
  choice: 每年
  rationale: 此处是表示按年计算的惯用语；“每年”简洁而准确。
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: 一套衣服
  rationale: 该短语指衣物的配给、估价或一套衣物；正文采用具体易懂的“一套衣服”，脚注保留另一可能。
- source_word: וּמִחְיָתֶךָ
  choice: 并供给你生活所需
  rationale: מִחְיָה指维生之物或生活供养，范围不必仅限于食物。
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: 利未人就进去了
  rationale: 动词字面为“去”，但在接受留住邀请的叙事语境中可表示进入米迦家；正文采用自然中文，脚注说明字面表达及其歧义。
theological_decisions:
- issue: 在不合规范的私人祭祀环境中称祭司为“父”
  choice: 保留“父”的原文隐喻
  alternative: 译作“顾问”“导师”或“属灵的父”
  rationale: 原文明确使用亲属称谓作为尊称。直译既保留叙事中的社会—宗教角色，也不淡化此处祭祀环境的张力或引入后期教会术语。
- issue: 银子的单位未明说
  choice: 正文不补入“舍客勒”
  alternative: 十舍客勒银子
  rationale: 希伯来文没有注明单位；保留其不确定性，避免把传统推断写进正文。
- issue: 末句动词的方向含义
  choice: 按语境译作“进去了”，并以脚注保留字面义
  alternative: 利未人就去了
  rationale: 原文动词本身只表示“去”，而语境可能暗示进入米迦家。正文顾及现代中文叙事的自然度，脚注则避免掩盖原文的简略和歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“父”刻意保留原文的尊称性隐喻；报酬条款用自然中文表达，同时借脚注交代银子单位、衣物配给和末句动词的真实不确定性。
