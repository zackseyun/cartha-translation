  text: וַ/יְמַלֵּ֤א מִיכָה֙ אֶת יַ֣ד הַ/לֵּוִ֔י וַ/יְהִי ל֥/וֹ הַ/נַּ֖עַר לְ/כֹהֵ֑ן וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: zh_hans
  text: 于是，米迦任命那利未人作祭司[a]；这年轻人就成了他的祭司，住在米迦家里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“充满那利未人的手”，是在祭司职分语境中指派人就任的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: 行了授职礼
  rationale: 希伯来语字面为“使……的手充满”，在祭司职分的语境中是使人就职的惯用语。译作“行了授职礼”既自然传达任职含义，也不暗示这项任命获得上帝认可；字面形式保留在脚注中。
- source_word: הַלֵּוִי
  choice: 那利未人
  rationale: 此词按支派身份指称前文已经出现的男子；“那利未人”符合现代汉语叙事中的特指表达。
- source_word: הַנַּעַר
  choice: 这年轻人
  rationale: נַעַר可指少年、青年或年轻男子。此人已独立承担祭司职务，因此“年轻人”比“男孩”更合乎上下文。
- source_word: לְכֹהֵן
  choice: 作了他的祭司
  rationale: 介词לְ在这里标示身份或职分，与וַיְהִי לוֹ合起来表示这年轻人成为米迦的祭司。
- source_word: וַיְהִי לוֹ
  choice: 就作了他的
  rationale: 该结构表示人物进入为米迦担任祭司的关系和职分；“就作了他的”自然表达叙事中的结果与转变。
- source_word: בְּבֵית מִיכָה
  choice: 住在米迦家里
  rationale: 字面是“在米迦的房屋中”。结合动词היה，此处自然表示他留居在米迦家中；“住在”比单纯“在”更符合现代汉语，但不扩大为抽象的“家族/家眷”。
theological_decisions:
- issue: 如何表述私人设立的祭司而不暗示其合法性
  choice: 米迦为那利未人行了授职礼
  alternative: 米迦把那利未人分别为圣／米迦按立了那利未人
  rationale: 原文陈述米迦使这名利未人就任祭司，却没有在本句认可此举。“行了授职礼”表达职务设置这一事实，而“分别为圣”可能增添神圣认可的意味；“按立”虽可用，但在现代中文中较容易让人联想到特定教会制度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是……就……”保留连续叙事关系；“授职礼”准确传达古代就任职分的惯用语，同时避免使用可能带有特定宗派色彩的现代教会术语。
