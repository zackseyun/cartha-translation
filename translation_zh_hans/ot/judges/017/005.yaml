base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: zh_hans
  text: 米迦这人有一所神祠[a]。他做了一件以弗得和一些家神像，又任命自己的一个儿子作祭司[b]；这儿子就作了他的祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神的殿”；原文也可直译为“诸神之屋”。这里指米迦私设的祭祀场所。
    reason: 保留 אֱלֹהִים 在形式与语境上的歧义，并说明正文功能性译法。
  - marker: b
    text: 原文直译“把他的手充满”，是使人就任或承接祭司职分的惯用语。
    reason: 说明希伯来语惯用表达及正文“任命”的依据。
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: 一座神堂
  rationale: 该短语直译可作“神的殿”或“诸神之屋”，但在此指米迦设置宗教器物的私人祭祀场所。“神堂”既自然表达其功能，又不暗示这是蒙认可的耶和华圣所；脚注保留原文形式与其他译法的歧义。
- source_word: אֵפוֹד
  choice: 一件以弗得
  rationale: 这是古代祭祀用物的专名，具体形态在本处并不完全明确，因此采用音译，避免过度解释为某一种衣物或神像。
- source_word: תְרָפִים
  choice: 一些家神
  rationale: 该词指家庭祭祀使用的神像。“家神”是现代汉语中简洁清楚的对应，也保留其作为受崇拜偶像的含义。
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: 把……分别出来任祭司
  rationale: 希伯来语字面为“把……的手充满”，是使人就任或承接祭司职分的惯用语。正文以自然汉语表达其功能，脚注说明字面形式。
- source_word: אַחַד מִבָּנָיו
  choice: 自己的一个儿子
  rationale: 忠实保留原文明确的男性亲属和部分结构。
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: 这儿子就作了他的祭司
  rationale: 保留就任后的结果，并明确代词所指，避免汉语中的指代含混。
- source_word: וְהָאִישׁ מִיכָה
  choice: 米迦这个人
  rationale: 原文带冠词的“那人米迦”用于承接或重提话题；“米迦这个人”保留这一话语色彩，同时符合现代汉语表达。
theological_decisions:
- issue: בֵּית אֱלֹהִים 是否应译成可能暗示敬拜真神的“神的殿”
  choice: 正文译作“一座神堂”，脚注列出“神的殿”和“诸神之屋”
  alternative: 神的殿；诸神之屋
  rationale: אֱלֹהִים 在形式上可作复数，也常指上帝；仅凭形态不能消除歧义。上下文表明这是米迦私设且不合规范的祭祀场所，但不宜借译文断定该短语必然专指多神崇拜。因此正文采用功能性而不作神学定性的“神堂”，脚注保存原文张力。
- issue: 米迦使儿子任祭司的行为是否在译文中直接加以谴责
  choice: 只陈述其设置和任职行为
  alternative: 加入“擅自”“非法”等评价词
  rationale: 本节叙述及上下文足以显明其宗教秩序的异常；原句没有这些评价副词，故不把解释性谴责加入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神堂”在此作为私人祭祀场所的功能性称呼；“以弗得”保留古代专名；用“分别出来任祭司”表达就职礼仪而避免套用特定现代宗派术语。
