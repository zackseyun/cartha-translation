  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: zh_hans
  text: 犹大人说：“你们为什么上来对付我们？”他们回答：“我们上来是要捆绑参孙，好照他怎样对待我们，也怎样对待他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: 犹大人
  rationale: אִישׁ虽为单数形式，在此与复数动词连用，具有集合意义。“犹大人”自然表达群体，也避免将其误解为单独一人。
- source_word: לָמָה
  choice: 为什么
  rationale: 这是现代汉语中询问原因最自然、准确的表达。
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: 上来攻打我们
  rationale: עלה与עַל连用在这里表示带敌意地上来对抗。“攻打”清楚传达敌对含义，同时“上来”保留原文的方向性意象。
- source_word: לֶאֱסוֹר
  choice: 捆绑
  rationale: אָסַר意为捆绑、缚住；上下文所说的是擒拿并绑住参孙，因此“捆绑”直接而贴切。
- source_word: עָלִינוּ
  choice: 我们上来
  rationale: 保留与前一句עלה的词语呼应，以及叙事中的方向性表达。
- source_word: לַעֲשׂוֹת לוֹ
  choice: 对待他
  rationale: עשה加ל在此表示对某人采取行动；“对待他”在汉语中自然，并为下文的报复性对称结构提供清楚衔接。
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: 他怎样对待我们，我们也要怎样对待他
  rationale: 采用汉语常见的“怎样……也怎样……”结构，准确保留比较关系和以牙还牙的对称意味。
- source_word: שִׁמְשׁוֹן
  choice: 参孙
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
