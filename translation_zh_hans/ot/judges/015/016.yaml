  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: zh_hans
  text: '参孙说[a]：


    “用驴腮骨，一堆、两堆；


    用驴腮骨，我击倒了千人。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文有双关：“驴”和译作“堆”的词声音相近。“一堆、两堆”较为直译地保留了这一文字游戏。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出连接词וַ，以符合现代汉语叙事习惯；动词仍承接前文事件次序。
- source_word: שִׁמְשׁוֹן
  choice: 参孙
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בִּלְחִי הַחֲמוֹר
  choice: 用驴腮骨
  rationale: 介词ב在此表示工具，译为“用”；לְחִי指腮或颚，此处明确指作为武器的颚骨，“驴腮骨”简明自然，也能与后面的双关衔接。
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: 堆成一堆、两堆
  rationale: 原文利用“驴”与“堆”近音构成双关。译文保留“一堆、两堆”的异常而有意的诗歌表达，并以“堆成”点明战果堆积的意象；脚注说明原文语音效果。
- source_word: הִכֵּיתִי
  choice: 我击倒了
  rationale: נכה基本义为击打、击倒；语境暗示杀敌，但不直接改译为“杀死”，以避免超出动词本身的表达。
- source_word: אֶלֶף אִישׁ
  choice: 千人
  rationale: אִישׁ在此为集合性用法，指敌方男子；汉语“千人”在战斗语境中自然且足以表达数量。
