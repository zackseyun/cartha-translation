base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: zh_hans
  text: 她的父亲说：“我确实以为你恨透了她，所以就把她给了你的同伴[a]。她的妹妹不是比她更好吗？请让妹妹归你，代替她吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“朋友”。原文这个词可泛指伙伴、朋友或同伴；在本段婚礼的情境中，有人理解为陪伴参孙的婚礼同伴。
    reason: 说明原文词义范围，并避免把婚礼中的具体角色过度确定化。
lexical_decisions:
- source_word: אָמֹר אָמַרְתִּי
  choice: 我原以为
  rationale: 不定式绝对形与完成式连用，强化父亲主观认定的语气；“原以为”也自然表达其判断后来被证明有误。
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: 你实在恨透了她
  rationale: 同源不定式绝对形强化“恨”；“实在恨透了”在现代汉语中保留强烈程度。
- source_word: וָאֶתְּנֶנָּה
  choice: 所以就把她给了
  rationale: 此处叙事连接带有从父亲的认定推出行动的结果意味，“所以就”清楚呈现这一逻辑。
- source_word: לְמֵרֵעֶךָ
  choice: 给了你的同伴
  rationale: מֵרֵעַ可泛指朋友、伙伴或同伴；“同伴”既符合上下文，又不把婚礼中的具体职分说死。
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: 她妹妹
  rationale: 在姐妹关系中，הַקְּטַנָּה自然指年幼的一位；汉语“妹妹”已包含“较年幼”的信息。
- source_word: טוֹבָה מִמֶּנָּה
  choice: 比她更好
  rationale: טוֹבָה表达宽泛的优越比较，未明确限定为容貌，因此不译作“更漂亮”。
- source_word: תְּהִי נָא לְךָ
  choice: 请让妹妹归你
  rationale: 愿望式配合נָא表达恳求；“归你”保留“成为你的”这一宽泛措辞，不擅自补明婚姻程序。
- source_word: תַּחְתֶּיהָ
  choice: 代替她
  rationale: תַּחַת在此表示替代关系；“代替她”简明保留原意。
theological_decisions: []
