base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: zh_hans
  text: 他们对他说：“不，我们一定会把你捆起来，交在他们手中[a]；但绝不会杀你。”于是他们用两条新绳把他捆住，从那岩石处把他带上来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“交给他们处置”或“交在他们权下”。希伯来语直译为“交在他们手中”。
    reason: lexical_alternative
  - marker: b
    text: “岩石”也可译作“岩崖”或“岩壁”；希伯来语 סֶלַע 不一定只指一块单独的石头。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: 不！……；但……
  rationale: 这一结构先否定参孙所担心的事，随后说明他们实际要做的事。用“不！”明确否定，再以“但”引出不会杀他的保证，符合现代汉语对话习惯。
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: 我们一定把你捆起来
  rationale: 不定式绝对形与限定动词连用，强化“捆绑”的确定性；“一定”自然地传达这一强调。
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: 交在他们手中
  rationale: 保留希伯来语“交在某人手中”的意象，同时汉语也能自然表达落入对方掌控之下。
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: 但我们绝不会杀你
  rationale: 原文再次以不定式绝对形加强否定。“绝不会”传达强烈保证；“杀你”比“置你于死地”更自然直接。
- source_word: וַיַּאַסְרֻהוּ
  choice: 他们……把他捆住
  rationale: 与前文同用“捆”这一词根对应的译法，保持叙事中的词语呼应。
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: 用两条新绳
  rationale: עֲבֹתִים 指较粗的绳索；“绳”简明自然，“新”则保留参孙叙事中具有意义的细节。
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: 将他从岩石那里带上来
  rationale: 使役词形表达把他带上来；סֶלַע 可指岩石、崖岩或岩壁，正文采用范围较宽且自然的“岩石”，不强行限定具体地貌。
