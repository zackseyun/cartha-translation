  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֶ/אֱסָרְ/ךָ֣ יָרַ֔דְנוּ לְ/תִתְּ/ךָ֖ בְּ/יַד פְּלִשְׁתִּ֑ים וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן הִשָּׁבְע֣וּ לִ֔/י פֶּֽן תִּפְגְּע֥וּ/ן בִּ֖/י אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: zh_hans
  text: 他们对他说：“我们下来，是要捆绑你，把你交在非利士人手中。”参孙对他们说：“你们要向我起誓，保证你们自己不攻击我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  choice: 捆绑你
  rationale: 准确表达 אסר 在此处以绳索拘束、捆住人的意思。
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: 把你交在非利士人手中
  rationale: 保留希伯来语“交在……手中”的惯用意象，同时现代汉语仍清楚自然。
- source_word: תִּפְגְּעוּן בִּי
  choice: 攻击我
  rationale: פגע 可指袭击、加害；此处参孙要求犹大人不可亲自动手，“攻击”比字面化的“碰我”更合语境。
- source_word: אַתֶּם
  choice: 你们自己
  rationale: 独立人称代词在动词已有主语信息后具有强调作用，译出参孙所强调的行动者。
theological_decisions:
- issue: 参孙所要求的保证范围
  choice: 你们自己不攻击我
  alternative: 你们不会杀我
  rationale: 原文使用语义较宽的 פגע，并以 אַתֶּם 强调“你们”；不把保证范围收窄为只禁止杀害，也不扩展为非利士人不得加害。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“交在……手中”的希伯来语意象，并用“保证”使汉语中的起誓内容衔接自然。
