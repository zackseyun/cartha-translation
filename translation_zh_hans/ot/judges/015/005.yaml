  source_fidelity: 原译基本准确地传达了点燃火把、放走上文所述的动物，以及焚毁已收割和仍在田中的谷物与橄榄园的情节。但“火从……烧到……”将原文明确以参孙为施事、以焚烧为结果的表达改成了火势自行蔓延，宜恢复“他烧毁了”的施事结构；“火种”也不是此处לַפִּידִים的恰当词汇替代。
  naturalness: 修订后保留现代汉语叙事的顺畅性。“堆放的禾捆”比“堆积的谷物”更清楚地对应已收割并堆放的גָּדִישׁ，也更能与田中未割的谷物相区分。
  terminology: “非利士人”“火把”“田中未割的谷物”“橄榄园”均合适。脚注将火把的可行替代限定为“火炬”或“火把状的燃烧木条”，避免将“火种”误作同义词。
