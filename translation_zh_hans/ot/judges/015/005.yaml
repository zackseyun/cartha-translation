base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: zh_hans
  text: 他点燃火把[a]，放它们跑进非利士人田中未割的谷物里；他烧毁了从堆放的禾捆到田中未割的谷物，直到橄榄园[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火把”也可译作“火炬”或“燃烧的木条”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“从堆放的禾捆，直到田中未割的谷物，直到橄榄园”；这句话表达焚烧所及的范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ בַּלַּפִּידִים
  choice: 点着火把
  rationale: בער的使役式在这里指点燃；אֵשׁ在汉语中自然融入“点着”这一表达。לַפִּידִים可指火把或火炬，“火把”清楚、自然。
- source_word: וַיְשַׁלַּח
  choice: 便放它们跑进
  rationale: 该动词可指放出、放走。希伯来文本省略宾语，译文以“它们”保留这种简略，并按上文所述动物被放开的情境自然表达。
- source_word: בְּקָמוֹת פְּלִשְׁתִּים
  choice: 跑进非利士人尚未收割的谷物中
  rationale: קָמָה指仍长在田里的谷物，而非泛指田地；“尚未收割的谷物”以现代汉语明确呈现这一农业含义。
- source_word: מִגָּדִישׁ
  choice: 从堆积的谷物
  rationale: גָּדִישׁ指收割后堆放的谷物或禾捆；“堆积的谷物”既清楚，也与尚在田中的谷物形成区别。
- source_word: וְעַד קָמָה
  choice: 烧到田里未割的谷物
  rationale: 保留מִן...עַד“从……到……”的范围结构，同时用“田里未割的谷物”自然说明קָמָה。
- source_word: וְעַד כֶּרֶם זָיִת
  choice: 又一直烧到橄榄园
  rationale: כֶּרֶם是栽培园地，与זַיִת连用时指种植橄榄树的园地；“橄榄园”是自然准确的现代汉语。
