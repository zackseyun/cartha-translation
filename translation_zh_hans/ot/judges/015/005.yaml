revisions:
- from: 他点着火把[a]，便放它们跑进非利士人尚未收割的谷物中；火从堆积的谷物烧到田里未割的谷物，又一直烧到橄榄园[b]。
  to: 他点燃火把[a]，放它们跑进非利士人田中未割的谷物里；他烧毁了从堆放的禾捆到田中未割的谷物，直到橄榄园[b]。
  rationale: 修订恢复了原文中参孙“烧毁”的主动施事结构，并保留“从……直到……”的范围表达。“禾捆”清楚体现已收割、堆放的谷物，避免与仍在田中的谷物混淆。脚注a删除不相符的“火种”。
