  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: zh_hans
  text: 他非常口渴，就呼求雅威，说：“你藉着你仆人的手赐下了这伟大的拯救[a]；现在，难道我要渴死，落在未受割礼的人手中吗[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“胜利”或“解救”。
    reason: lexical_alternative
  - marker: b
    text: “未受割礼的人”在这里尤其指非利士人。这一称呼带有圣约意味，不只是族群名称。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: 他非常口渴
  rationale: צמא表示口渴或受干渴之苦；此处叙事形式可理解为进入这种状态。译文自然简洁，也保留מְאֹד“非常”的程度。
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: 呼求雅威
  rationale: קרא אל在此表示向上帝呼喊求告。“呼求”适合祷告语境，又不额外强化原文未明确表达的情绪。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见音译，保留原文所用的上帝之名，而不以称号替代。
- source_word: בְיַד עַבְדְּךָ
  choice: 藉着你仆人的手
  rationale: ביד在这里表示施行拯救的媒介或代理。“藉着……的手”保留希伯来语意象，同时在现代中文中清楚可懂。
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: 这场伟大的拯救
  rationale: תשועה兼有解救、得胜和拯救之意；“拯救”既符合眼前的军事解围，也保留其神学内涵。量词“场”使中文表达自然。
- source_word: אָמ֣וּת בַּצָּמָא
  choice: 难道我要渴死
  rationale: 原文没有显式疑问词，但语境显然形成反问。“难道”准确传达这一语用力量；בַּצָּמָא表示因干渴而死。
- source_word: וְנָפַלְתִּי בְּיַד
  choice: 落在……手中
  rationale: נפל ביד是落入某人权势或控制之下的惯用语；中文对应表达保留了原文比喻。
- source_word: הָעֲרֵלִים
  choice: 这些未受割礼的人
  rationale: 原文没有直接说“非利士人”，而采用带有圣约意味的称呼。“未受割礼的人”保留其修辞和神学色彩；“这些”符合此处特指眼前敌人的语境。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名。音译“雅威”保留专名性质，不用头衔取代，也不将较晚形成的读音传统写入正文。
- issue: הָעֲרֵלִים的圣约意味
  choice: 这些未受割礼的人
  alternative: 非利士人
  rationale: 参孙的话不只是标明族群，也以割礼这一圣约记号区分以色列与敌人。直译可保留这种张力，而脚注说明当时具体所指。
- issue: תשועה在军事与神学语境中的多义性
  choice: 拯救
  alternative: 胜利；解救
  rationale: 本节所指是上帝刚赐下的军事得胜，但词义不止于战果。“拯救”兼顾具体解围与上帝施救的神学维度，脚注保留其他可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“呼求”“藉着……的手”“落在……手中”保留祷告语气和希伯来语意象；反问句呈现参孙在刚蒙大救之后却面临渴死危险的强烈转折。
