  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: zh_hans
  text: 他找到一块新鲜的驴腮骨[a]，便伸手拿起来，用它击倒了一千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个新的驴腮骨”。希伯来语这个形容词可指新鲜的，也可指新的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: 他找到
  rationale: מצא在连续叙事中表示一个简单的过去动作；“找到”自然、直接。
- source_word: לְחִי חֲמוֹר
  choice: 一块驴腮骨
  rationale: לְחִי可指腮、颌或颌骨；本处是可拿来作武器的骨头，现代汉语传统且清楚的表达是“驴腮骨”。
- source_word: טְרִיָּה
  choice: 新鲜的
  rationale: 该形容词指新鲜、尚未干枯；“新鲜的”保留骨头可能仍有韧性、不易断裂的语义，同时不把它限定为单纯“新的”。
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: 便伸手
  rationale: 保留希伯来语“伸出他的手”的具体动作，同时用简洁自然的现代汉语表达。
- source_word: וַיִּקָּחֶהָ
  choice: 拿起来
  rationale: 阴性后缀回指腮骨；“拿起来”符合此处由发现到拾取的动作过程。
- source_word: וַיַּךְ בָּהּ
  choice: 用它击倒
  rationale: נכה表示击打，在战斗语境中带有致命结果；“击倒”传达结果，却不直接把动词收窄为“杀死”。
- source_word: אֶלֶף אִישׁ
  choice: 一千人
  rationale: אִישׁ在数词后作个体计数，语境所指为参战男子；中文“一千人”自然，且不必额外标示语法性别。
