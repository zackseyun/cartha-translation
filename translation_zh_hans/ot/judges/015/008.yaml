  text: וַ/יַּ֨ךְ אוֹתָ֥/ם שׁ֛וֹק עַל יָרֵ֖ךְ מַכָּ֣ה גְדוֹלָ֑ה וַ/יֵּ֣רֶד וַ/יֵּ֔שֶׁב בִּ/סְעִ֖יף סֶ֥לַע עֵיטָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/008.yaml
  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: zh_hans
  text: 他重重击打他们，造成极大的杀戮[a]；随后他下去，住在以坦磐石的裂缝里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在此含有直译为“腿压在大腿上”的罕见表达；它很可能是形容毁灭性或彻底性打击的习语，但确切含义不能确定。
    reason: 保留难解希伯来习语的具体身体意象、可能的习语功能及解释上的不确定性，而不把它固定为带有额外意象的汉语成语。
lexical_decisions:
- source_word: וַיַּךְ
  choice: 他把他们杀得
  rationale: נכה的基本义是“击打、击杀”。结合战斗语境和后面的מַכָּה גְדוֹלָה，此处用“杀得”表达暴力攻击及其严重后果，但不单独断言每个人都被杀死。
- source_word: שׁוֹק עַל־יָרֵךְ
  choice: 人仰马翻
  rationale: 原文直译近似“腿在大腿之上”，确切所指不明，但显然形容彻底而惨烈的击败。汉语“人仰马翻”自然表达被打得七零八落的景象；脚注保留原文身体部位的意象和解释上的不确定性。
- source_word: מַכָּה גְדוֹלָה
  choice: 使他们惨遭重创
  rationale: מַכָּה在战斗语境可指重击、杀戮或败绩。“惨遭重创”既保留גְדוֹלָה的强烈程度，也避免明确断定所有人均被杀。
- source_word: וַיֵּרֶד
  choice: 随后下到
  rationale: 保留原文明确的向下移动，并以“随后”自然衔接希伯来叙事中的连续动词。
- source_word: וַיֵּשֶׁב
  choice: 住下
  rationale: ישב可指坐、居住或停留；此处描写参孙在藏身处驻留，“住下”符合上下文，又不暗示永久定居。
- source_word: בִּסְעִיף סֶלַע
  choice: 磐石的裂缝里
  rationale: סְעִיף在此可能指岩隙、裂缝；סֶלַע指巨岩或峭岩。“磐石的裂缝”清楚呈现其岩石藏身处，同时保留原文的名词结构。
- source_word: עֵיטָם
  choice: 以坦
  rationale: 按现代普通话圣经人名地名的音译习惯处理该专名。
theological_decisions: []
