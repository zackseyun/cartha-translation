source:
  edition: WLC
  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: zh_hans
  text: 于是，神劈开了利希的一处洼地[a]，水就从那里流出来。参孙喝了水，精神恢复过来，又有了活力。[b]因此，他给那泉起名叫“隐·哈歌利”[c]；这泉至今仍在利希。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“神使颚骨中的凹处裂开。”希伯来语“利希”也有“颚骨”的意思。
    reason: alternative_reading
  - marker: b
    text: “精神”所译的希伯来词也可指“气息”或生命的活力。
    reason: lexical_alternative
  - marker: c
    text: “隐·哈歌利”可能意为“呼求者之泉”或“那呼求之人的泉”，指参孙向神呼求。
    reason: name_meaning
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: 使……裂开
  rationale: 该动词表示劈开、裂开；用使动表达神直接促成洼处裂开，既贴近希伯来语动作，也符合现代汉语。
- source_word: הַמַּכְתֵּשׁ
  choice: 洼处
  rationale: 该词通常可指臼或臼状凹处；本节语境更可能指利希的一处地形凹陷，因此译为自然且不过度具体化的“洼处”。
- source_word: בַּלֶּחִי
  choice: 在利希／利希的
  rationale: 上下文把“利希”作为地名，本节末句也说该泉在利希；汉语主句采用“利希的洼处”以求流畅。词本身也可意为“颚骨”，故将另一读法收入脚注。
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: 水就从那里涌出来
  rationale: “水”在汉语中通常作不可数名词；“涌出来”自然呈现水从裂开的凹处出来，但不额外规定流量或持续时间。
- source_word: וַתָּשָׁב רוּחוֹ
  choice: 精神恢复过来
  rationale: רוּחַ可指气息、精神或生命活力；“精神恢复过来”保留其较宽的生命状态含义，避免只理解为体力或呼吸。
- source_word: וַיֶּחִי
  choice: 又有了活力
  rationale: 此处指参孙濒临虚脱后恢复生机，并非死而复活；该译法符合语境，也避免现代汉语中“复活”可能造成的误解。
- source_word: עֵין הַקּוֹרֵא
  choice: 隐·哈歌利
  rationale: 正文音译专名，并用间隔号帮助现代读者辨认名称结构；其与参孙呼求神相关的词义放入脚注。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来语叙事中常见的时间说明，译法简洁庄重。
theological_decisions:
- issue: בַּלֶּחִי所指及水源的位置
  choice: 正文将“利希”理解为地名，水从利希的一处洼地出来。
  alternative: 神使颚骨中的凹处裂开，水从颚骨中出来。
  rationale: 本节末句“直到今日还在利希”以及上下文对利希的地名用法，更支持地理解释；但希伯来词לֶחִי本义也可指“颚骨”，另一理解会改变神迹的具体图景，因此保留在脚注中。
- issue: וַתָּשָׁב רוּחוֹ的意义范围
  choice: 译为“精神恢复过来”。
  alternative: “气息恢复”或“气力恢复”。
  rationale: 原词兼有气息、精神和生命活力等含义；正文不把它严格限定为生理呼吸或肌肉力量，并以脚注说明其语义范围。
- issue: וַיֶּחִי是否表示复活
  choice: 译为“又有了活力”，理解为从极度干渴虚脱中恢复。
  alternative: “活了”或“复活了”。
  rationale: 前文说参孙因口渴几乎要死，却未说他已经死亡；因此本句表达恢复生机，而非死而复活。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。正文以“神”为אֱלֹהִים的标准译法；为避免代词指向不清，补出上下文明确的主语“参孙”。地名采用“利希”，泉名音译为“隐·哈歌利”，并在脚注交代名称含义及“利希／颚骨”的双关可能。
