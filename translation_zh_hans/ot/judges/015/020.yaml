  text: And he judged Israel in the days of the Philistines twenty years[a].
translation:
  language: zh_hans
  text: 在非利士人的时期，他作以色列的士师二十年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带领以色列二十年。”希伯来语动词可指较广泛的治理或领导活动，不仅指作司法裁决。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: 作……的士师
  rationale: שׁפט在《士师记》中常指以士师身份施行审断和带领；译作“作……的士师”既保留全书反复出现的关键称谓，也避免现代汉语“审判”容易产生的纯法庭含义。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文以专名“以色列”为直接宾语；在“作以色列的士师”这一汉语结构中自然且贴近原文。
- source_word: בִּימֵי
  choice: 在……的日子
  rationale: 保留原文“在……的日子”的时间表达及其古雅、庄重色彩，同时仍为现代读者所理解。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及历史叙述中通行的族名译法。
- source_word: עֶשְׂרִים שָׁנָה
  choice: 二十年
  rationale: 按原文直接表达持续时间，并置于谓语结构之后，符合现代汉语习惯。
theological_decisions:
- issue: 参孙在שׁפט一词中所表达的角色
  choice: 作以色列的士师
  alternative: 带领以色列二十年；治理以色列二十年
  rationale: “作……的士师”保留《士师记》的文学和神学框架，不把参孙的职分缩窄为法庭审判，也不扩大为原文未明确说明的全面政治统治；脚注交代其较宽泛的领导含义。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“作以色列的士师”保持全书关键术语的一致性；“在非利士人的日子”有意保留希伯来语时间习语。
