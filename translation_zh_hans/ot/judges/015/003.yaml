revisions:
- from: 参孙对他们说：“这一次，我即使加害[b]非利士人，对他们也不算有罪[a]了。”
  to: 参孙对他们说：“这一次，我加害他们[b]时，对非利士人也不负罪责[a]。”
  rationale: 修订删除原文未明示的让步结构，改以“时”表达 כִּי 所引出的行动情形；并以“不负罪责”准确、自然地呈现参孙自称免于罪责的说法。脚注锚点均紧随相应译词，且保留原文“作恶”的词汇层面与语境中的“加害”含义。
