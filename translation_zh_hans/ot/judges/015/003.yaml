  - severity: low
    issue: “对他们”与“非利士人”重复，且“也”的所指不够清楚
    rationale: 可将行动对象保留为“他们”，并在责任关系中明说“对非利士人”，使中文更顺畅，同时对应原文两个复数代词／名词短语。
  - severity: low
