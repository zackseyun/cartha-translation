source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן נִקֵּ֥יתִי הַ/פַּ֖עַם מִ/פְּלִשְׁתִּ֑ים כִּֽי עֹשֶׂ֥ה אֲנִ֛י עִמָּ֖/ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: zh_hans
  text: 参孙对他们说：“这一次，我加害他们[b]时，对非利士人也不负罪责[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我对非利士人是清白的”，即“就非利士人而言，我不负罪责”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“对他们作恶”；这里指采取敌对行动伤害他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以现代汉语叙事惯用表达承接上文；不机械译出连接词，也不额外限定先后关系。
- source_word: לָהֶם
  choice: 对他们
  rationale: 直接体现介词与第三人称阳性复数后缀，所指由上下文确定。
- source_word: שִׁמְשׁוֹן
  choice: 参孙
  rationale: 采用现代中文圣经传统通行人名。
- source_word: נִקֵּיתִי
  choice: 不算有罪
  rationale: נקה在此表示免于罪责或责任；此译保留参孙自称不应被归罪的法律—道德意味，而不表示他客观上确实无罪。
- source_word: הַפַּעַם
  choice: 这一次
  rationale: 准确表达冲突进入新阶段的时间性短语。
- source_word: מִפְּלִשְׁתִּים
  choice: 对他们……有罪
  rationale: מן接נקה表示就非利士人而言免负罪责；中文以“对他们不算有罪”自然传达这种关系，其中“他们”回指非利士人。
- source_word: כִּי
  choice: 即使……也
  rationale: 该词在此连接参孙自称无罪与即将施害的情形。中文让步结构自然呈现其话语逻辑，同时不把它明确收窄为单纯因果。
- source_word: עֹשֶׂה אֲנִי
  choice: 我……加害
  rationale: 分词加独立代词可表达正在进行或即将实施的行动；上下文指参孙准备采取的报复行动，中文不另加明确时态词。
- source_word: עִמָּם רָעָה
  choice: 加害非利士人
  rationale: עשה עם רעה在此指对某人实施有害行动；“加害”比直译“行恶”更清楚地表达具体敌对伤害，同时脚注保留原文措辞。
theological_decisions:
- issue: 参孙所说的“无罪”是叙事者的裁断，还是人物自己的主张
  choice: 译作“对他们也不算有罪”，保留为参孙对自身责任的宣称
  alternative: 译作“我对非利士人是清白的”，可能更容易被理解为叙事者认可其道德清白
  rationale: 原文是参孙的直接引语；译文不应将人物自我辩护提升为经文对其报复行为的明确道德认可。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“即使……也……”使参孙的报复逻辑在中文中清楚可读；“不算有罪”保留其自我辩解的责任语义，避免使用较主观的“问心无愧”。
