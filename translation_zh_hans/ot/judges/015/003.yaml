  source_fidelity: “即使……也……”将 כִּי 处理为让步关系，超出原文较开放的因果／时间性连接，且会使参孙的话带有原文未明示的假设性。宜改为时间性“时”，保留分词所表达的正在／即将实施行动的开放性。
  naturalness: 原译整体通顺，但“加害非利士人，对他们也不算有罪”重复指称，句法略显拗口。改为“我加害他们时，对非利士人也不负罪责”更自然，也清晰保留“他们”与“非利士人”的关系。
  terminology: “参孙”“非利士人”均合乎现代中文圣经惯例。“不负罪责”准确表达 נִקֵּיתִי 所涉的免于罪责／责任，并在直接引语中维持这是参孙的自我宣称，而非叙事者的裁断。“加害”适切表达 עשה…רעה 在本语境中的敌对伤害。
