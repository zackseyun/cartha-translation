  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: zh_hans
  text: 于是，三千名犹大人下到以坦磐石的裂缝[a]，对参孙说：“你难道不知道非利士人统治着我们吗？你对我们做的这是什么事？”参孙回答他们：“他们怎样待我，我也怎样待他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “裂缝”或译“裂隙、罅隙”。
    reason: סְעִיף在岩石地貌语境中可指裂缝、裂隙或罅隙；仅凭本句不能确定其具体地形。
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 下到
  rationale: 保留 ירד 所表达的向下移动，同时采用自然的现代汉语叙事表达。
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: 犹大有三千人
  rationale: 准确表达来自或属于犹大的三千名男子；在上下文中用“人”自然简洁，不削弱原文所指的成年男性群体。
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: 到以坦岩石的裂缝那里
  rationale: סְעִיף 在此地貌语境中指岩石的裂缝、罅隙或裂隙；“裂缝”清楚易懂，并保留该处作为藏身地点的地形特征。עֵיטָם 按地名音译为“以坦”。
- source_word: הֲלֹא יָדַעְתָּ
  choice: 你难道不知道
  rationale: 以反问句再现带否定词的希伯来语疑问形式，传达说话者认为此事显而易见的语气。
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: 非利士人正统治着我们
  rationale: 分词 מֹשְׁלִים 表示持续中的管辖和支配；“正统治着”保留其正在持续的政治压迫意味。
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: 你对我们做的这是什么事
  rationale: 贴近原文“这是什么你对我们做的事”，保留犹大人认为参孙的行动殃及他们的责问，不改写成只询问动机的“为什么”。
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: 他们怎样待我，我也怎样待他们
  rationale: 保留原文“怎样……也怎样……”的对应结构；汉语“待”在此自然地概括双方所做之事，同时不额外评价参孙的行为。
theological_decisions:
- issue: 参孙回答中报复性对等原则的道德评价
  choice: 以中性陈述呈现：“他们怎样待我，我也怎样待他们。”
  alternative: 解释为正当的报仇，或明确贬称为出于私怨的报复
  rationale: 本节记录参孙为自己行动所作的解释，却未在此直接作出道德判断；译文因此保留叙事中的神学和伦理张力，不加入原文没有明说的褒贬。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接叙事进展；对话保持直接、有压力的责问语气。“以坦”“参孙”“非利士人”采用现代中文圣经语境中通行的专名形式。
