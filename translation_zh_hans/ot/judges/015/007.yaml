base_translation:
  language: en
  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: zh_hans
  text: 参孙对他们说：“如果你们这样做，我一定要向你们报仇；此后我才罢手。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: 既然你们这样做
  rationale: 这里的条件句结合下文表达因对方行为而作出的强烈回应；“既然”自然传达已发生之事所构成的理由，同时保留原句的条件式色彩。
- source_word: כִּי אִם נִקַּמְתִּי בָכֶם
  choice: 我必向你们报仇
  rationale: כִּי אִם 在此加强决意，可自然译为“必”；נִקַּמְתִּי בָכֶם 表示向对方施行报复。原文没有明确的起誓公式，因此不另加“我发誓”。
- source_word: וְאַחַר אֶחְדָּל
  choice: 然后才罢手
  rationale: 直译为“之后我才停止”；“罢手”符合报复行动的语境，“才”体现先报仇、后停止的次序和限定。
theological_decisions:
- issue: 是否把强调结构译成明确誓言
  choice: 译作“我必”，不加入“我发誓”
  alternative: “我发誓，我要……”
  rationale: 希伯来文表达强烈决意，但没有常见的起誓用语；避免把强调性陈述提升为形式上的誓言。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。“报仇”“罢手”通俗清楚，并保留参孙话语中坚决、报复性的语气。
