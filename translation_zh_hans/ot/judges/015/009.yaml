  yaml_path: translation/ot/judges/015/009.yaml
  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: zh_hans
  text: 非利士人上来，在犹大安营，并在利希展开部署。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “展开部署”也可译作“展开”或“列阵”。这里的希伯来语动词可指军队在一地散开或部署。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上来
  rationale: 保留עלה所表达的上行方向，也符合叙事中军队向该地进发的语境；不额外断定具体路线。
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及一般历史叙述中通行的族名。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: 准确表达חנה的扎营含义，简洁自然，并保持庄重的叙事语体。
- source_word: בִּיהוּדָה
  choice: 在犹大
  rationale: 介词ב在此首先表示地点；译为“在犹大”避免将原文未明说的敌对方向强化成“攻击犹大”。
- source_word: וַיִּנָּטְשׁוּ
  choice: 铺展开来
  rationale: 在军事语境中表达部队向一片区域展开或部署，同时保留该动词具体方式上的一定开放性。
- source_word: בַּלֶּחִי
  choice: 在利希
  rationale: 将לֶחִי按此处语境处理为地名；介词ב自然译作“在”，表示军队展开的位置。
