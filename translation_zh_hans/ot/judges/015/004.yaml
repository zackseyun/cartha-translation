base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: zh_hans
  text: 参孙就去捉了三百只狐狸[a]，又拿了火把，使它们尾对尾地成对排列，在每一对的两条尾巴中间放上一支火把。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胡狼”。希伯来语שׁוּעָלִים可指狐狸，也可指胡狼等相近的犬科动物。
    reason: 保留原词在动物种类上的词义不确定性。
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 就去
  rationale: 以自然的汉语叙事承接前文，并体现连续动作。
- source_word: שִׁמְשׁוֹן
  choice: 参孙
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: וַיִּלְכֹּד
  choice: 捉了
  rationale: 此处指捕获活的动物；“捉”准确、自然，不额外说明捕捉手段。
- source_word: שְׁלֹשׁ מֵאוֹת שׁוּעָלִים
  choice: 三百只狐狸[a]
  rationale: 直译数量；שׁוּעָלִים通常译作“狐狸”，但也可能指胡狼，因此以脚注保留词义可能性。
- source_word: לַפִּדִים / לַפִּיד
  choice: 火把
  rationale: 既可指火炬，也可指燃烧的木柴；“火把”是现代汉语中清楚而符合场景的表达。
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: 把狐狸一只一只尾对尾地配成对
  rationale: פנה本义为转向、使朝向；译文表达尾对尾的排列，并避免加入原文没有明说的“绑”。“配成对”由后文“两条尾巴”所指示。
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  choice: 在每一对的两条尾巴中间
  rationale: 原文直指“两条尾巴之间，在中间”；“每一对”在汉语中自然表明这一动作反复施于各组。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“尾对尾地配成对”保留原文所说的排列方式，不擅自补入“捆绑”；通过“每一对”使后半句在中文中指代清楚。
