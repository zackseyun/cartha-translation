base_translation:
  language: en
  yaml_path: translation/ot/judges/015/017.yaml
  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: zh_hans
  text: 他说完后，就把腮骨从手里扔掉，称那地方为“拉末·利希”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉末·利希”可能意为“腮骨冈”或“腮骨高地”；“利希”与本节的“腮骨”是同一个希伯来词，形成文字呼应。
    reason: 说明地名可能的含义，并保留原文 לֶחִי 所形成的双关。
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: 他说完后
  rationale: כְּ加上不定词结构表达时间关系，即“当／在……之后”；“他说完后”自然简洁，并保留动作的先后次序。
- source_word: וַיַּשְׁלֵךְ
  choice: 扔掉
  rationale: 该动词表示投掷或丢开；结合参孙已用完腮骨的语境，“扔掉”是自然、准确的现代汉语。
- source_word: הַלְּחִי
  choice: 腮骨
  rationale: 上下文明确指参孙用作武器的驴腮骨；“腮骨”既准确，也能与地名中的 לֶחִי 构成双关。
- source_word: מִיָּדוֹ
  choice: 从手里
  rationale: 直接表达“从他的手中”；汉语可省去已明确的物主代词，使句子更自然。
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: 称那地方为
  rationale: קרא 在地名命名结构中可表示“称作／命名”；“称那地方为”贴近原文且符合现代汉语。
- source_word: רָמַת לֶחִי
  choice: 拉末·利希
  rationale: 正文音译地名，以保留其专名身份；其含义及与“腮骨”的文字呼应在脚注说明。
