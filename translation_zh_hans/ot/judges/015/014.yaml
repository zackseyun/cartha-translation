id: JDG.15.14
reference: Judges 15:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: zh_hans
  text: 他来到利希[a]，非利士人就呐喊着迎上来。耶和华的灵猛然临到他身上，他臂上的粗绳就像被火烧过的亚麻一样；他手上的捆绑也熔化脱落了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利希”是地名；其希伯来语名称也与“腮骨”一词相同，而腮骨是上下文中的重要意象。
    reason: 说明地名的词义关联及其叙事双关。
lexical_decisions:
- source_word: לֶחִי
  choice: 利希
  rationale: 此处首先是地名，采用音译；其普通名词义“腮骨”与上下文的重要意象相关，故以脚注说明。
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: 呐喊着迎上来
  rationale: 既保留 הֵרִיעוּ 的高声呼喊，也表达 לִקְרָאתוֹ 所含迎面而来、与他相遇的动作；不额外限定为“战吼”。
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: 耶和华的灵猛然临到他身上
  rationale: צלח 在《士师记》的这一固定叙事表达中具有突然而有力地临到、赋能之意；“猛然临到”保留其力度和动态。
- source_word: הָעֲבֹתִים
  choice: 粗绳
  rationale: 该词指用于捆绑的绳索，并可带较粗或结实的意味；结合本章前文的捆绑场景，译作“粗绳”自然明确。
- source_word: זְרוֹעוֹתָיו
  choice: 他臂上
  rationale: זְרוֹעַ 泛指手臂；不具体化为前臂。
- source_word: כַּפִּשְׁתִּים
  choice: 像……麻一样
  rationale: פִשְׁתִּים 指亚麻；中文比喻中用“麻”较自然，且能清楚表达纤维遇火后脆弱易断的形象。
- source_word: אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: 被火烧过的
  rationale: 表达火已经作用于麻而使其失去强度的结果，符合后续绳索瓦解的图像。
- source_word: וַיִּמַּסּוּ
  choice: 熔脱了
  rationale: מסס 的基本形象是融化、消解；“熔脱”保留原文比喻力度，也表达绑索从手上脱落。
- source_word: אֱסוּרָיו
  choice: 捆绑他的绳索
  rationale: 该词泛指他的捆绑物；上下文明确使用绳索，译文作适度明示，避免“镣铐”所暗示的金属刑具。
- source_word: מֵעַל יָדָיו
  choice: 从他手上
  rationale: 贴近字面“从他的手上”，不擅自具体化为手腕。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 现代简体中文圣经语域中“耶和华”是最广为人知、可直接识别的专名表达；不以“主”替代，从而保留原文所用的神圣专名。
- issue: 参孙所得神圣赋能的描写
  choice: 耶和华的灵猛然临到他身上
  alternative: 耶和华的灵大大感动他
  rationale: “猛然临到”较直接地反映 צלח על 的动态和力度，同时只陈述叙事中的神圣赋能，不引入后期系统神学范畴。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“迎上来”“猛然临到”“熔脱”保持叙事的速度和力量；仅设置一条对理解地名及上下文意象必要的脚注。
