  to: 他来到利希[a]，非利士人就呐喊着迎上来。耶和华的灵猛然临到他身上，他臂上的粗绳就像被火烧过的亚麻一样；他手上的捆绑也熔化脱落了。
  rationale: 修订仅处理两处语言与词义精度问题：“亚麻”准确对应 פִּשְׁתִּים；“熔化脱落”自然表达 וַיִּמַּסּוּ מֵעַל יָדָיו 的融化式瓦解及从手上脱落。将末句改为“他手上的捆绑”避免把 אֱסוּרָיו重复限定为“绳索”，同时保留其泛指捆绑物的语义。
