base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: zh_hans
  text: 过了一段日子，正值割麦的时候，参孙带着一只山羊羔去看妻子。他说：“让我进我妻子的内室去[a]。”可是她父亲不许他进去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内室”也可译作“房间”。按上下文，这里指夫妻私下相处的内室。
    reason: 说明חֶדֶר的词义范围及其在本段中的语境含义，同时不在正文中过度明确化。
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: 过了一段日子
  rationale: 这个叙事习语表示一段时间已经过去；译文保留时间推进的作用，同时避免生硬直译为“事情发生在一些日子以后”。
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: 正值割麦的时候
  rationale: 准确表达小麦收割的季节背景；现代汉语通常以“割麦的时候”自然表达这一时段。
- source_word: וַיִּפְקֹד
  choice: 去看
  rationale: פקד在此语境中指探望，而不是数点、任命或惩罚；“去看妻子”简洁自然。
- source_word: אֶת אִשְׁתּוֹ
  choice: 妻子
  rationale: 希伯来文仍明确称她为参孙的妻子，即使上下文显示两人的关系已经破裂。
- source_word: בִּגְדִי עִזִּים
  choice: 带着一只山羊羔
  rationale: 明确表现参孙带来的东西；“山羊羔”在现代汉语中清楚易懂，也避免只译“羊羔”而丢失山羊这一信息。
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: 我要到妻子那里
  rationale: 第一人称意愿式在这里表达参孙要进去见妻子的意图；“我要”自然保留其主动意愿，不把含蓄语境直接解释成性行为。
- source_word: הֶחָדְרָה
  choice: 进内室去
  rationale: 这个带方向词尾的形式表示进入房间或内室；“内室”保留空间意义，也不武断地具体化为现代意义的“卧室”。
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: 可是她父亲不许他进去
  rationale: 译出父亲主动拒绝参孙进入，并以“进去”呼应参孙前一句的行动意图。
theological_decisions:
- issue: 进入妻子内室所暗示的夫妻亲密关系
  choice: 正文保留“到妻子那里，进内室去”的含蓄表达
  alternative: 直接译为“要与妻子同房”
  rationale: 原文通过“到妻子那里去”和“进入内室”的措辞表达语境含义，并未使用明确表示性交的动词；译文不应把暗示提升为直说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“正值割麦的时候”保留季节场景；“山羊羔”“内室”兼顾准确与普通读者的可理解性。脚注标记放在其实际说明的“进内室去”之后。
