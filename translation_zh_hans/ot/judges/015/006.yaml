base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: zh_hans
  text: 非利士人问：“这是谁干的？”他们说：“是亭拿人的女婿——参孙；因为那亭拿人把参孙的妻子给了参孙的同伴[a]。”于是非利士人上去，用火烧了那女子和她的父亲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同伴”也可译作“朋友”或“伙伴”。结合婚宴的背景，有人理解为“伴郎”或“陪郎”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“用火烧了她和她的父亲。”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经与历史叙事中通行的族名译法。
- source_word: מִי עָשָׂה זֹאת
  choice: 这是谁干的？
  rationale: 准确表达直接问句，在叙事语境中自然明白；“干的”比“做了这事”更符合追查纵火者的口吻。
- source_word: חֲתַן הַתִּמְנִי
  choice: 亭拿人的女婿参孙
  rationale: חָתָן可指新郎或女婿；这里从亭拿人父亲的关系来称参孙，译作“女婿”最清楚，同时不改变原句的身份说明。
- source_word: כִּי לָקַח אֶת אִשְׁתּוֹ
  choice: 因为那亭拿人把参孙的妻子
  rationale: 希伯来文省略主语，而上下文表明行动者是女子的父亲；中文补出“那亭拿人”并将代词明确为“参孙的”，避免误读。
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: 给了他的伴郎
  rationale: מֵרֵעַ基本义为伙伴、朋友；结合士师记14:20婚宴语境，此人是陪伴参孙的人，中文“伴郎”简洁自然，但以脚注保留“朋友、伙伴”的词义可能。
- source_word: וַיַּעֲלוּ
  choice: 上去
  rationale: 保留希伯来叙事中表示移动的“上去”，中文亦自然。
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: 放火烧死了那女子和她的父亲
  rationale: 将字面“用火烧”自然译为“放火烧死”；该场景明确描述以火杀害二人，中文不机械重复“用火烧”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免连续代词造成指代不清，补明“那亭拿人”和“参孙的妻子”；“那女子”则清楚回指参孙的妻子。所有脚注标记均置于相关正文之后。
