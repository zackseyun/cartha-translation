revisions:
- from: 非利士人问：“这是谁干的？”有人回答：“是亭拿人的女婿参孙，因为那亭拿人把参孙的妻子给了他的伴郎[a]。”于是非利士人上去，放火烧死了那女子和她的父亲[b]。
  to: 非利士人问：“这是谁干的？”他们说：“是亭拿人的女婿——参孙；因为那亭拿人把参孙的妻子给了参孙的同伴[a]。”于是非利士人上去，用火烧了那女子和她的父亲[b]。
  rationale: 将回答者译为“他们”，以保留原文中非利士人连续发言的叙述；将“伴郎”改为“同伴”，并将婚宴角色的具体理解置于脚注；将“放火烧死了”改为“用火烧了”，避免把推知的死亡结果写成原文直接表达。
  reviewer_model: gpt-5.6-terra
