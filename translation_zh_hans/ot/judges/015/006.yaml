  terminology: “非利士人”“亭拿人”“女婿”“参孙”均合宜。“同伴”是对מֵרֵעַ较稳妥的正文翻译；脚注保留其可在婚宴语境下被理解为伴郎或陪郎的可能，不将该解释定为正文含义。
