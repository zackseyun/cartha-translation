source:
  edition: WLC
  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: zh_hans
  text: 于是，雅威把他们卖到迦南王耶宾手中[a]；耶宾在夏琐作王，他的军队统帅是西西拉。西西拉住在哈罗设·哈歌印[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卖到……手中”是希伯来语的审判性惯用语，意思是把他们交在耶宾的权势之下。
    reason: lexical_alternative
  - marker: b
    text: “哈罗设·哈歌印”这个地名可能意为“列国的哈罗设”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: 把他们卖到……手中
  rationale: מָכַר 的本义是“卖”。这里是《士师记》中反复出现的审判性表达，指雅威把以色列交在压迫者权下；保留“卖”的比喻，可传达原文的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对四字神名的常见音译呈现其专名性质，不以“主”这一称号代替。
- source_word: בְּיַד
  choice: 到……手中
  rationale: 保留希伯来语“在某人手中”的权力意象，在汉语中也自然地表示落入某人的掌控。
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: 迦南王耶宾
  rationale: 按照现代汉语自然语序表达耶宾的身份，同时贴近原文的名词结构。
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: 耶宾在夏琐作王
  rationale: מָלַךְ 明确表示作王、统治；拆成独立分句，避免汉语关系从句指代含混。
- source_word: וְשַׂר צְבָאוֹ
  choice: 他的军队统帅
  rationale: שַׂר 与 צָבָא 连用，指军队的最高指挥者；“军队统帅”准确且符合现代正式汉语。
- source_word: סִיסְרָא
  choice: 西西拉
  rationale: 采用该人名通行的中文音译。
- source_word: וְהוּא יוֹשֵׁב
  choice: 西西拉住在
  rationale: 分词 יוֹשֵׁב 表示居住状态；重复“西西拉”以清楚呈现原文中 הוּא 最自然的所指。
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: 在哈罗设·哈歌印
  rationale: 将整个人名地名结构音译，避免在正文中把 הַגּוֹיִם 的词义直接当作已确定的地名释义。
theological_decisions:
- issue: 雅威在以色列受压迫一事中的主动作用
  choice: 雅威把他们卖到耶宾手中
  alternative: 雅威容许他们落入耶宾权下
  rationale: 原文以主动动词 וַיִּמְכְּרֵם 直接把行动归于雅威。译文保留这种审判行动的直接性，不弱化为仅仅许可。
- issue: וְהוּא 的指代对象
  choice: 指西西拉
  alternative: 指耶宾
  rationale: 就紧邻先行词和叙事信息而言，代词最自然地回指西西拉；译文明确其名以避免汉语歧义，但不据此增添原文以外的信息。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“卖到……手中”的原文比喻和权力意象；为避免连续关系从句造成指代不清，将后半节分为两个短句。专名采用简体中文圣经传统中较常见的译写，并以间隔号呈现复合地名。
