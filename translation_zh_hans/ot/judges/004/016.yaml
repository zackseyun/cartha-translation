  text: וּ/בָרָ֗ק רָדַ֞ף אַחֲרֵ֤י הָ/רֶ֨כֶב֙ וְ/אַחֲרֵ֣י הַֽ/מַּחֲנֶ֔ה עַ֖ד חֲרֹ֣שֶׁת הַגּוֹיִ֑ם וַ/יִּפֹּ֞ל כָּל מַחֲנֵ֤ה סִֽיסְרָא֙ לְ/פִי חֶ֔רֶב לֹ֥א נִשְׁאַ֖ר עַד אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: zh_hans
  text: 巴拉追赶战车[a]和军队，直到列国的夏罗设[b]。西西拉的全军都倒在刀刃之下，一个也没有留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战车部队”；原文“战车”在这里可作集合名词。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文意为“列国的夏罗设”；传统上也将整个名称音译为“夏罗设·哈歌印”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: 追赶
  rationale: 这一动词与介词的组合表示在战斗中主动追击；“追赶”自然明白，也保留军事语境。
- source_word: הָרֶכֶב
  choice: 战车
  rationale: 该单数名词在此具有集合意义，指战车整体；正文用“战车”，脚注保留“战车部队”的可能表达。
- source_word: הַמַּחֲנֶה
  choice: 军队
  rationale: 这里所指的是参与战斗的军事力量，而不只是营地；“军队”符合上下文。
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: 直到列国的夏罗设
  rationale: עַד 表示追赶所达到的地点；地名主体音译为“夏罗设”，并保留 הַגּוֹיִם“列国”的基本含义，没有把整个短语完全固化为音译。
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: 西西拉的全军都倒下
  rationale: 集合主语配单数动词，描写整支军队战败被杀；“倒下”保留希伯来文战场叙事的意象。
- source_word: לְפִי חֶרֶב
  choice: 倒在刀刃之下
  rationale: 这是表示被刀剑杀死的希伯来语惯用语；该译法既自然，又比单说“被杀”更多保留原文“刀口／刀刃”的形象。
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: 一个也没有留下
  rationale: 用现代汉语自然表达原文强调无一幸存的绝对语气。
