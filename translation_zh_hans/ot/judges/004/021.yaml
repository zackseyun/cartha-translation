revisions:
- from: 希百的妻子雅亿拿了一根帐篷橛子，手里拿着锤子，悄悄走到西西拉身边，把橛子钉进他的太阳穴，橛子又扎入地里。他当时正熟睡，疲惫不堪，就这样死了。
  to: 希百的妻子雅亿拿了一根帐篷橛子，手里拿着锤子，悄悄走到西西拉身边，把橛子钉进他的太阳穴，橛子陷入地里。他当时正熟睡，疲惫不堪，便死了。
  rationale: 作两处轻微修订：以“橛子陷入地里”对应原文中以橛子为最自然主语的阴性动词，并删除无对应的“又”；以“便死了”保留原文直接的叙事结局，避免“就这样”所增加的总结意味。其余措辞可保留。
  reviewer_model: gpt-5.6-terra
