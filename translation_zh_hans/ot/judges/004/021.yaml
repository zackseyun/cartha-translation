base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: zh_hans
  text: 希百的妻子雅亿拿了一根帐篷橛子，手里拿着锤子，悄悄走到西西拉身边，把橛子钉进他的太阳穴，橛子陷入地里。他当时正熟睡，疲惫不堪，便死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: 帐篷橛子 / 橛子
  rationale: 指固定帐篷所用的橛子；“帐篷橛子”具体、自然，后文简称“橛子”以避免累赘。
- source_word: הַמַּקֶּבֶת
  choice: 锤子
  rationale: 指敲击橛子的工具；“锤子”是现代汉语中最自然且不过度限定材质的表达。
- source_word: בְּיָדָהּ
  choice: 手里拿着
  rationale: 自然表达工具在她手中，同时保留原文对动作方式的描述。
- source_word: בַּלָּאט
  choice: 悄悄
  rationale: 表达无声、不引人注意地接近；既保留动作方式，也不额外断定其主观动机。
- source_word: וַתִּתְקַע
  choice: 钉进
  rationale: 结合锤子与橛子的语境，该动词表示用力把橛子打入；“钉进”在汉语中具体而自然。
- source_word: בְּרַקָּתוֹ
  choice: 他的太阳穴
  rationale: רַקָּה 指头部侧面的太阳穴；此译具体准确，也不擅自加入“穿透”等轨迹信息。
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: 橛子又扎入地里
  rationale: 阴性动词最自然地以阴性的“橛子”为主语；明说主语可避免汉语歧义，并保留原文连续发生的动作，而不译成目的或结果从句。
- source_word: נִרְדָּם
  choice: 正熟睡
  rationale: 分词描述当时持续的睡眠状态；“熟睡”符合叙事语境，又不显生硬。
- source_word: וַיָּעַף
  choice: 疲惫不堪
  rationale: 表示极度疲倦；该表达自然地说明西西拉当时的状态。
- source_word: וַיָּמֹת
  choice: 就这样死了
  rationale: 保留叙事的直接结局，并以自然汉语连接此前情状；不增添神学评价。
- source_word: אֵשֶׁת חֶבֶר
  choice: 希百的妻子
  rationale: 准确保留人物关系，也符合现代汉语自然语序。
