base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: zh_hans
  text: 看哪，巴拉正在追赶西西拉。雅亿出来迎接他，对他说：“来吧，我把你所寻找的那个人指给你看。”巴拉就进到她那里；看哪，西西拉倒在那里，已经死了，橛子还插在他的太阳穴里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文两次出现的提示语及其叙事聚焦作用，既表现突如其来的相遇，也引导读者看见帐篷内的景象。
- source_word: רֹדֵף
  choice: 正在追赶
  rationale: 分词表示动作正在进行，译为“正在追赶”自然且准确。
- source_word: לֵךְ
  choice: 来吧
  rationale: 此处虽字面常为“去/走”，但雅亿是在邀请巴拉随她进入帐篷；汉语按语境译作“来吧”更自然。
- source_word: וְאַרְאֶךָּ
  choice: 我把……指给你看
  rationale: 使役词形意为“我要让你看见/给你看”；“指给你看”符合现代汉语叙事。
- source_word: נֹפֵל מֵת
  choice: 倒在那里，已经死了
  rationale: נֹפֵל 描写西西拉倒卧的状态，מֵת 明说他已死；分开表达可保留两层信息，避免误作正在倒下。
- source_word: יָתֵד
  choice: 橛子
  rationale: 上下文所指为帐篷橛；本节简译“橛子”，承接前文且避免不必要重复。
- source_word: רַקָּתוֹ
  choice: 他的太阳穴
  rationale: 该词指头部太阳穴一带，“太阳穴”是准确而通行的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。两次保留“看哪”，以呈现希伯来叙事中的视角转换和现场感；人物姓名依中文圣经通行译法作“巴拉、西西拉、雅亿”。
