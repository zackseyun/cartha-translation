  text: וְ֠/הִיא יוֹשֶׁ֨בֶת תַּֽחַת תֹּ֜מֶר דְּבוֹרָ֗ה בֵּ֧ין הָ/רָמָ֛ה וּ/בֵ֥ין בֵּֽית אֵ֖ל בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יַּעֲל֥וּ אֵלֶ֛י/הָ בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: zh_hans
  text: 她常坐在底波拉的棕树下；那棵树位于以法莲山区，在拉玛和伯特利之间。以色列人[a]上到她那里，求她裁断[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，是指以色列民众的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 或译“求审判”“求公断”或“寻求司法判决”。原词可指作出司法裁决，也可指主持公道。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: 常坐在
  rationale: 分词在上下文中描述底波拉惯常办公的地点；“常坐在”自然表达过去的习惯性情形，而不是一次正在发生的动作。
- source_word: תַּחַת תֹּמֶר דְּבוֹרָה
  choice: 在底波拉的棕树下
  rationale: תַּחַת表示“在……下”；构造短语自然译为“底波拉的棕树”，既可指属于或与她相关的棕树，也保留其作为当地标志的功能。
- source_word: בֵּין הָרָמָה וּבֵין בֵּית אֵל
  choice: 在拉玛和伯特利之间
  rationale: 按通行圣经地名译法音译两处地名，并保留原文“在……之间”的地理关系。
- source_word: בְּהַר אֶפְרָיִם
  choice: 位于以法莲山区
  rationale: 此处单数 הַר 指一片山地，而非一座名为“以法莲山”的孤立山峰；“以法莲山区”符合现代汉语地理表达。
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: 都上到她那里
  rationale: 保留 עלה“上去”的方向和山地地形色彩；“到她那里”明确行动的目标。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人[a]
  rationale: 该固定表达字面为“以色列的众子”，在此指以色列全体民众，而非仅指男性；正文采用自然、准确的现代汉语，脚注交代原文字面形式。
- source_word: לַמִּשְׁפָּט
  choice: 请她裁断[b]
  rationale: מִשְׁפָּט在此司法语境中可指审判、案件裁决或主持公道；“请她裁断”清楚表达百姓前来寻求司法判定，同时以脚注保留词义范围。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别化群体称谓
  choice: 正文译作“以色列人”，脚注注明字面为“以色列的众子”
  alternative: 以色列的众子／以色列的子孙
  rationale: 原文采用阳性复数的传统群体称谓，但本句所指是立约群体整体，并没有限定只有男性前来。正文避免让现代读者误以为专指男子，脚注则使原文形式保持可见。
- issue: לַמִּשְׁפָּט的司法含义
  choice: 请她裁断
  alternative: 求审判／求公断／寻求司法判决
  rationale: 不把该词收窄为单纯惩罚性的“审判”，也不扩大成抽象的“正义”；所选措辞保留底波拉作出司法裁决或主持公道的含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“她常坐在”传达惯常行为；分号和补充句避免把多个地点修饰语堆叠在一个长句中。地名使用简体中文圣经中常见的“拉玛、伯特利、以法莲”。
