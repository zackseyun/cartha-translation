  text: וַ/תִּשְׁלַ֗ח וַ/תִּקְרָא֙ לְ/בָרָ֣ק בֶּן אֲבִינֹ֔עַם מִ/קֶּ֖דֶשׁ נַפְתָּלִ֑י וַ/תֹּ֨אמֶר אֵלָ֜י/ו הֲ/לֹ֥א צִוָּ֣ה יְהוָ֣ה אֱלֹהֵֽי יִשְׂרָאֵ֗ל לֵ֤ךְ וּ/מָֽשַׁכְתָּ֙ בְּ/הַ֣ר תָּב֔וֹר וְ/לָקַחְתָּ֣ עִמְּ/ךָ֗ עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ מִ/בְּנֵ֥י נַפְתָּלִ֖י וּ/מִ/בְּנֵ֥י זְבֻלֽוּן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: zh_hans
  text: 她派人去把亚比挪庵的儿子巴拉从拿弗他利的基低斯召来，对他说：“耶和华——以色列的神——不是已经吩咐说：‘你去，向他泊山进发，带上一万名拿弗他利人和西布伦人。’吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: 她派人去把……召来
  rationale: 两个连续动词直译为“她差遣并召来”在中文中生硬；此译自然表达底波拉派人传召巴拉，同时保留两个动作的关系。
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: 从拿弗他利的基低斯
  rationale: 将地名理解为位于拿弗他利境内的基低斯，既与上下文相符，也避免让现代读者误以为这是一个不可分的复合专名。
- source_word: הֲלֹא צִוָּה
  choice: 不是已经吩咐了吗
  rationale: 保留反问形式及其预期肯定回答的语气；“已经”体现完成式所指向的既有命令。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的专名译法，区别于一般称谓“主”。
- source_word: לֵךְ וּמָשַׁכְתָּ בְּהַר תָּבוֹר
  choice: 你去，向他泊山进发
  rationale: מָשַׁךְ 的具体含义有争议，可指“拉、牵引”，在军事语境中可能表示率军行进或部署；“向……进发”保留行动指令而不把有争议的具体方式定死。
- source_word: וְלָקַחְתָּ עִמְּךָ
  choice: 带上
  rationale: 自然表达“带着与你同去”，符合中文军事召集语境。
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: 一万名拿弗他利人和西布伦人
  rationale: “人”在此指两支派成员；用支派名加“人”比直译“众子”更符合现代汉语，同时保留人数及来源。
theological_decisions:
- issue: 底波拉的话是陈述神谕还是询问巴拉
  choice: 保留反问：“不是已经吩咐了吗？”
  alternative: 译作直接宣告：“耶和华……这样吩咐”
  rationale: 原文有疑问词 הֲלֹא，语用上虽强烈肯定神确已命令，句法上的反问仍应保留，不将其改写为单纯陈述。
- issue: 神名 יהוה 的呈现
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”在现代普通话基督教语境中最易辨识为以色列神的专名，并不把它泛化为称号。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。引语层级清楚：底波拉的话用双引号，其中所引神的命令用单引号。避免古雅的“岂不是”“率领……上”等表达，也不以过度解释性的军事术语消除 מָשַׁךְ 的词义张力。
