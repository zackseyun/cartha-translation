  source_fidelity: 译文准确保留了底波拉差遣／传召巴拉、巴拉的父名和所在地、反问式神谕、他泊山、人数及拿弗他利和西布伦两支派等核心信息。“向他泊山进发”对 מָשַׁכְתָּ 的军事语境作了不强行定论的稳妥处理。
