  terminology: “耶和华”“巴拉”“亚比挪庵”“拿弗他利”“基低斯”“他泊山”“西布伦”等译名及神学用语均可接受。将“耶和华，以色列的神”以破折号明确为同位语，既忠实原文也更符合中文表达。
