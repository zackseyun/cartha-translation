base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: zh_hans
  text: 雅亿出去迎接西西拉，对他说：“我主，请转到我这里来[a]；请转到我这里来，不要害怕。”他就转到她那里，进了帐篷；雅亿用毯子[b]把他盖住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请转到我这里来”也可译作“请进来”。希伯来语动词的字面意思是“转离原路”，描绘他离开所走的路，到她那里躲避。
    reason: lexical_alternative
  - marker: b
    text: “毯子”所译的希伯来语也可能指毡毯、地毯或其他覆盖用的织物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: 出去
  rationale: יצא表示向外移动；“出去”保留了雅亿从帐篷所在处走向西西拉的方向感。
- source_word: לִקְרַאת
  choice: 迎接
  rationale: לִקְרַאת表示有目的地向某人而去；“迎接”自然地表达她主动出去与西西拉相遇。
- source_word: סוּרָה
  choice: 请转到……来
  rationale: סור的基本意思是偏离原路、转向别处。这里保留“转”的意象及两次命令的重复，同时“请”和“来”使邀请在现代汉语中自然可懂。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是对身份较高男子的恭敬称呼；“我主”保留其敬称力度，且上下文清楚表明不是神的称号。
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 直接表达 ירא 的否定命令，是清楚自然的现代汉语。
- source_word: וַיָּסַר
  choice: 转到她那里
  rationale: 与前面的 סוּרָה 保持词汇呼应，显明西西拉接受了雅亿的邀请。
- source_word: הָאֹהֱלָה
  choice: 进了帐篷
  rationale: 方向词尾表示朝帐篷而去；语境显示他进入其中，因此译作“进了帐篷”。
- source_word: וַתְּכַסֵּהוּ
  choice: 把他盖住
  rationale: כסה的核心义是覆盖；此译法直接，不把“隐藏”这一语境含义写入正文。
- source_word: בַּשְּׂמִיכָה
  choice: 用毯子
  rationale: שׂמיכה指用于覆盖的织物，可能是毯子、毡毯或铺盖；“毯子”最符合此处动作，也最便于现代读者理解。
