base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: zh_hans
  text: 巴拉对她说：“你若和我一起去，我就去；你若不和我一起去，我就不去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: 对她说
  rationale: אמר加介词אֶל及阴性单数后缀，直接引出巴拉对底波拉所说的话；“对她说”符合现代汉语叙事习惯。
- source_word: בָּרָק
  choice: 巴拉
  rationale: 按通行中文圣经人名音译处理。
- source_word: אִם
  choice: 若
  rationale: 引出条件从句；“若”简洁、庄重，也为现代读者所理解。
- source_word: תֵּלְכִי עִמִּי
  choice: 你和我一起去
  rationale: הלך的第二人称阴性单数未完成式在条件句中表达假设，עִם表示陪同；汉语无须标明语法性别。
- source_word: וְהָלָכְתִּי
  choice: 我就去
  rationale: 条件句后的完成式表达条件成立后的结果；“就”自然体现前后条件与结果的关系。
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: 你若不和我一起去
  rationale: 保留第二个条件句与前句平行的结构；上下文中的对比在汉语中已由肯定与否定形成，不必另加“但”。
- source_word: לֹא אֵלֵךְ
  choice: 我就不去
  rationale: 否定的第一人称未完成式表达在该条件下不去；“就不去”清楚对应前面的条件。
theological_decisions: []
