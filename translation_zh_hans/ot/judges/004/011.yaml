  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: zh_hans
  text: 基尼人希百已经离开基尼族，也就是摩西岳父[a]何巴的子孙；他把帐篷搭到撒拿音的橡树[b]那里，这地方靠近基低斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“姻亲”；希伯来语这个词的含义可比“岳父”更宽泛。
    reason: alternative_reading
  - marker: b
    text: “橡树”也可译作“笃耨香树”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: 已经离开
  rationale: 该动词的尼法勒形式表示与一个群体分离。此节补叙先前形成的背景，因此用“已经离开”自然表达其背景时序，而不添加原文没有的“那时”或“如今”。
- source_word: הַקֵּינִי / מִקַּיִן
  choice: 基尼人／基尼族
  rationale: 两处在本语境中都指基尼人的族群，而非个人该隐；分别用“基尼人”和“基尼族”，既区分个人身份与群体，又保持两者的关联。
- source_word: מִבְּנֵי חֹבָב
  choice: 何巴的子孙
  rationale: בְּנֵי 字面为“众子”，在此指何巴一系的后裔或宗族；“子孙”比“儿子们”更符合族群语境。
- source_word: חֹתֵן מֹשֶׁה
  choice: 摩西岳父
  rationale: חֹתֵן 常指因婚姻形成的男性亲属，并常具体指岳父；本段传统语境支持“岳父”，但其较宽泛的可能含义在脚注中保留。
- source_word: וַיֵּט אָהֳלוֹ
  choice: 他把帐篷搭到……那里
  rationale: נטה אהל 是“支搭帐篷”的惯用语；现代汉语用“把帐篷搭到……那里”清楚表达迁居并扎营的动作。
- source_word: אֵלוֹן
  choice: 橡树
  rationale: 该词指显著的大树，常译为橡树，也可能指笃耨香树一类；正文采用清楚常见的“橡树”，并在脚注保留植物种类的不确定性。
- source_word: בצענים
  choice: 撒拿音
  rationale: 按地名处理并音译，不对词源不明的名称作推测性翻译。
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: 这地方靠近基低斯
  rationale: אֶת 在此表达毗邻、靠近的方位关系；“靠近”自然准确。
theological_decisions:
- issue: חֹתֵן 所表示的摩西与何巴之间的姻亲关系
  choice: 岳父
  alternative: 姻亲
  rationale: “岳父”是此词的常见具体含义，也是摩西相关叙事中的传统理解；但希伯来词本身可泛指男性姻亲，因此以脚注保留较宽泛的译法，避免把词义范围静默收窄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“已经”体现本节的背景补叙功能，但不添加原文没有的篇章标记。“也就是”说明“何巴的子孙”与前面的基尼族属于同位关系。所有脚注标记均紧随所注释的词语。
