source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: zh_hans
  text: 底波拉对巴拉说：“起来！因为今天就是雅威把西西拉交在你手中的日子。[a]雅威不是已经走在你前面了吗？[b]”于是巴拉从他泊山下来，一万名男子跟随他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在你手中”意为“交给你，使他落在你的权下”。
    reason: 解释希伯来语中“手”所表达的权柄和控制之意。
  - marker: b
    text: “走在你前面”或译：“在你前面出征”。
    reason: 原词可指“出去、出发”，本段军事语境容许“出征”的译法。
lexical_decisions:
- source_word: קוּם
  choice: 起来
  rationale: 以简洁有力的命令语表达立即行动的呼召，符合现代汉语叙事语体。
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: 因为今天就是……的日子
  rationale: 保留“这就是那日”的强调以及 כִּי 的劝勉理由，同时使中文自然通顺。
- source_word: נָתַן ... בְּיָדֶךָ
  choice: 把……交在你手中
  rationale: 保留希伯来语“交在手中”的权柄意象；加入语境所容许的完成意味，表达胜利已由神确定。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名四字母词的通行现代汉语音译，不以称号替代原文专名。
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 保留期待肯定回答的反问形式，不将其改写为平铺直叙的断言。
- source_word: יָצָא לְפָנֶיךָ
  choice: 已经走在你前面
  rationale: 保留神先于巴拉行动的空间意象，同时让军事性的“出发、出征”意味由上下文及脚注呈现。
- source_word: וַיֵּרֶד
  choice: 下来
  rationale: 自然表达从山上往下移动，符合连续叙事。
- source_word: מֵהַר תָּבוֹר
  choice: 从他泊山
  rationale: 采用该地名在现代中文圣经语境中的常见译法。
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: 一万名男子跟随他
  rationale: 明确保留 אִישׁ 的男性所指，并用“跟随”自然呈现军队在巴拉身后行进。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常重构的读音，同时不把专名改为“主”等称号。
- issue: 完成式 נָתַן 所表达的胜利确定性
  choice: 把西西拉交在你手中
  alternative: 将要把西西拉交在你手中
  rationale: 保留原文完成式所呈现的确定行动，不将其弱化为单纯未来；中文语境可理解为神已作出决定并保证结果。
- issue: 雅威在巴拉前面行动的表述
  choice: 雅威不是已经走在你前面了吗
  alternative: 雅威不是已经在你前面出征了吗
  rationale: 正文保留较宽泛的“走在前面”及反问张力，不把 יָצָא 的军事含义限定为唯一解释；军事性译法列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“起来”保持命令的力度；反问句照原文保留。人名、地名采用常见中文形式，神名译作“雅威”。
