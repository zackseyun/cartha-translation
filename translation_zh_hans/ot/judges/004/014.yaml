  source_fidelity: 译文忠实反映希伯来文的命令、劝勉理由、完成式所表达的胜利确定性、期待肯定回答的反问，以及巴拉从他泊山下来的叙事推进。“把西西拉交在你手中”恰当地保留了 נתן...ביד 的权柄/交付意象；“已经走在你前面”在中文中自然传达了雅威先行的意象，且没有将 יָצָא 过度限定为军事术语。
