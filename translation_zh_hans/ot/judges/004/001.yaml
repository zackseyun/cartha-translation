  to: 以色列子孙[a]又行雅威眼中看为恶的事；以笏已经死了[b]。
  rationale: 将神名改为“雅威”，以贯彻项目对 יהוה／Yahweh 的既定译法。删除原文未明示的“那时”，保留“以笏已经死了”这一背景性陈述；脚注继续提供语境中自然的时间性译法，而不在正文中过度限定连接关系。
