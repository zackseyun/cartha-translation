source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: zh_hans
  text: 以色列子孙[a]又行雅威眼中看为恶的事；以笏已经死了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列人”；希伯来文直译为“以色列的儿子们”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“以笏死后”。
    reason: temporal_ambiguity
lexical_decisions:
- source_word: וַיֹּסִפוּ ... לַעֲשׂוֹת
  choice: 又行
  rationale: יסף与不定式连用表示重复或继续；在《士师记》的循环叙事中，“又行”自然表达再次犯罪。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留“以色列的儿子／后裔”这一群体称谓的来源意象，同时“子孙”在现代汉语中可自然指整个民族共同体。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: 带冠词的形容词在此名词化，指受到道德判定的恶事；与后面的“眼中”合译，形成自然汉语。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的比喻性表达，并以“看为”使汉语句法完整自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、易懂且庄重的音译。
- source_word: וְאֵהוּד מֵת
  choice: 那时，以笏已经死了
  rationale: 主语在前的完成式分句可作为叙事背景，说明以笏当时已死；此译保留背景关系，不把连接词过度明确为因果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非普通称号；“耶和华”是现代标准汉语中最广为人知的专名形式，也不以“主”取代原文神名。
- issue: בְּנֵי יִשְׂרָאֵל 的群体与性别表达
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “子孙”保留原文男性复数亲属称谓所表达的后裔身份，又可在汉语中自然涵盖民族共同体；脚注提供更通顺的群体称呼。
- issue: 以笏之死与以色列再次行恶的时间关系
  choice: 以背景分句表达“那时……已经死了”
  alternative: 以笏死后
  rationale: 上下文支持“死后”的时间理解，但希伯来语只以连接词加完成式陈述以笏已死；正文避免把这种关系限定得比原文更明确。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又行……看为恶的事”保留《士师记》中反复出现的评判公式；分号将主要行动与以笏已死的背景并列，同时避免将二者关系解释得过强。
