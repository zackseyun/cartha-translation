    rationale: 原文为“耶和华使……溃乱/惊惶……以刀剑”，并无独立的“并使他们被击败”分句。修订应维持原文的单一叙述结构，避免不必要的语义展开。
  - severity: medium
    issue: 脚注 b 称原文直译为“交在刀剑之口下”。
    rationale: לְפִי חֶרֶב 字面是“按/以刀剑的口（刃）”，并不含“交在……下”的动词或介词结构；该脚注需改正。
  - severity: low
    issue: “所有的战车”在“陷入混乱”的搭配中容易被理解为实际车辆。
    rationale: 原文 רֶכֶב 在此可集合性指战车兵力；译为“战车部队”既保留这一军事单位，也使汉语搭配自然。
