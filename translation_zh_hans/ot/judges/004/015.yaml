base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: zh_hans
  text: 耶和华在巴拉面前用刀剑使西西拉、他所有的战车部队和全军陷入混乱[a]。西西拉便从战车上下来，徒步逃跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使……惊慌溃乱”或“使……溃败”。这个希伯来语动词可指在战斗中使人惊慌、混乱或溃败；“用刀剑”原文直译为“以刀剑之口（刃）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: 使……陷入混乱
  rationale: 希伯来语动词 המם 在战争语境中表示使人惊慌、混乱或溃败；此译保留其使役含义，又不把后文刀剑造成的军事结果提前完全纳入该动词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”翻译四字神名，而不以称号“主”替代。
- source_word: הָרֶכֶב
  choice: 他所有的战车
  rationale: רֶכֶב 可集合性地指战车或战车部队；结合西西拉统军的上下文，用“他的战车”自然清楚。
- source_word: הַמַּחֲנֶה
  choice: 他的全军
  rationale: מַחֲנֶה 本可指营地、营伍或军队，在战斗叙事中所指为整支作战部队，译作“全军”最符合现代汉语。
- source_word: לְפִי חֶרֶב
  choice: 被刀剑击败
  rationale: 原文直译为“在刀剑之口下”，是表示以刀剑击杀或击败的战争惯用语；此处用自然中文表达其军事结果。
- source_word: לִפְנֵי בָרָק
  choice: 在巴拉面前
  rationale: 保留 לִפְנֵי 所表达的空间及战场关系，即这一切发生在巴拉进军迎敌之际、在他面前。
- source_word: וַיֵּרֶד ... מֵעַל הַמֶּרְכָּבָה
  choice: 从战车上下来
  rationale: 准确表达西西拉离开战车的动作；中文无需添加原文没有明说的物主代词。
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: 徒步逃跑
  rationale: 该短语意为不用车辆、靠双脚逃走，“徒步逃跑”简洁地体现与弃车之间的对比。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。现代简体中文圣经语境中“耶和华”辨识度高，也明确保留专名而非改译为“主”；音译形式存在争议，正文不借此解决其确切古代读音。
- issue: 耶和华与战败事件的关系
  choice: 明确以耶和华为使西西拉全军混乱并败于刀剑的主语
  alternative: 弱化为西西拉军自行混乱或仅由巴拉击败
  rationale: 希伯来语语法直接以耶和华为 וַיָּהָם 的主语，不能淡化神在叙事中的主动作用；同时“在巴拉面前”保留巴拉在战场上的参与。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“陷入混乱”保留动词的使役性及语义幅度；把“刀剑之口”的希伯来惯用语在正文中自然化，并在脚注交代字面意象。句法稍作展开，以避免中文读者误把“用刀剑”理解为耶和华亲自持剑，而仍清楚表达原文所述的神圣施动与战场结果。
