  to: 耶和华在巴拉面前用刀剑使西西拉、他所有的战车部队和全军陷入混乱[a]。西西拉便从战车上下来，徒步逃跑。
  rationale: 修订将“用刀剑”保留在原句中，避免把它扩写成原文未明说的第二个使役分句；以“战车部队”表达集合性的军事名词。脚注合并说明动词的可选译法及“刀剑之口（刃）”的字面意象，并删除不准确的“交在……下”说法。
