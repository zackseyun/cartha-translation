  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: zh_hans
  text: 以色列人的势力[a]日益强大，持续压制[b]迦南王耶宾，直到他们除灭了迦南王耶宾[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列众子之手”；“手”在这里指力量或势力。
    reason: lexical_alternative
  - marker: b
    text: 原文的表达也可译作“越来越强硬地对付”。它表示以色列施加的压力持续加重。
    reason: lexical_alternative
  - marker: c
    text: “除灭”原有“剪除、断绝”的意思；这里指将耶宾决定性地除去或毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד בְּנֵי יִשְׂרָאֵל
  choice: 以色列人的势力
  rationale: 原文直译为“以色列众子之手”；“手”在这里是表示力量、权势或控制力的惯用语。译作“势力”既传达实际含义，也符合现代汉语表达。
- source_word: וַתֵּלֶךְ ... הָלוֹךְ וְקָשָׁה
  choice: 日益强大，不断压制
  rationale: 动词“行进”与不定词绝对式构成持续增强的表达，קָשָׁה 可表示变强、变得严厉或沉重。译文表达以色列对耶宾不断加大的压力，同时在脚注保留原语可能侧重“越发强硬”的含义。
- source_word: עַל
  choice: 压制
  rationale: 该介词本身可译“在……之上”或“敌对……”，结合“手”和战争语境，译作“压制”自然地体现其敌对力量施加在耶宾身上。
- source_word: הִכְרִיתוּ
  choice: 除灭
  rationale: כרת 的使役式常指“剪除、断绝”，在此表示彻底消灭或除去耶宾；“除灭”保留其决绝意味，并符合庄重叙事语体。
