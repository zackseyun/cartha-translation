base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: zh_hans
  text: 巴拉召集西布伦和拿弗他利人到基低斯；有一万人跟随他上去，底波拉也与他一同上去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: 召集
  rationale: 使役形在此军事语境中表示把人召来集合；“召集”自然且不额外暗示强制征兵。
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: 西布伦和拿弗他利人
  rationale: 这里指两个支派中受召聚集的人；加“人”符合现代汉语表达，同时保留支派所指。
- source_word: קֶדְשָׁה
  choice: 到基低斯
  rationale: 地名后的方向词尾表示朝向该地移动，因此译作“到基低斯”。
- source_word: וַיַּעַל
  choice: 上去
  rationale: 保留עלה所表达的上行，也维持本节两次使用该动词的叙事呼应。
- source_word: בְּרַגְלָיו
  choice: 跟随他
  rationale: 字面是“在他脚下／脚后”，在此指军队跟着巴拉、由他率领；正文采用自然汉语表达。
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: 一万人
  rationale: 这是表示一万名男子的常规数目表达；军事语境已清楚，无须增译“士兵”。
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: 底波拉也与他一同上去
  rationale: 直接保留底波拉同行以及重复的“上去”，维持原文节奏。
theological_decisions: []
