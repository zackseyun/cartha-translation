  to: 于是，以色列人向耶和华呼求，因为他有九百辆铁战车，又严厉地压迫以色列人二十年。
  rationale: 作轻微措辞和语序调整：以“又”自然并列呼求的两项缘由，以“严厉地”贴近原文“以强力”的含义，并保留原文代词所指的未明确性。
