  text: וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּ֠י תְּשַׁ֨ע מֵא֤וֹת רֶֽכֶב בַּרְזֶל֙ ל֔/וֹ וְ֠/הוּא לָחַ֞ץ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל בְּ/חָזְקָ֖ה עֶשְׂרִ֥ים שָׁנָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: zh_hans
  text: 于是，以色列人向耶和华呼求，因为他有九百辆铁战车，又严厉地压迫以色列人二十年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ ... אֶל־יְהוָה
  choice: 向耶和华呼求
  rationale: “呼求”准确表达צעק在受压处境中大声求助的含义；按现代中文圣经常用形式译神名为“耶和华”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的儿子们”，在民族集合意义上用现代汉语自然表达“以色列人”。
- source_word: רֶכֶב בַּרְזֶל
  choice: 铁战车
  rationale: 保留“铁”的明确修饰，同时用“战车”体现军事语境；原文未说明全车由铁制成或仅有铁制部件，故不作扩展。
- source_word: לָחַץ
  choice: 压迫
  rationale: 该动词在此指持续施加压力、欺压，译为“压迫”符合上下文。
- source_word: בְּחָזְקָה
  choice: 残酷地
  rationale: 此处表示压迫的强暴、严厉程度；“残酷地”在现代汉语中自然，并与长期受压的语境相称。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是简体中文读者广泛熟悉的专名形式，明确保留原文神名的专属性，同时不引入宗派性解释。
- issue: 代词“他”的所指
  choice: 保留“他”
  alternative: 明确译作“耶宾”或“西西拉”
  rationale: 原文仅用阳性单数代词לוֹ和וְהוּא，所指需由上文判断；不在本节中擅自明确人物，以保留原文的指代方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“于是”承接上文；语序尽量贴近希伯来文，同时避免“以色列的儿子们”等生硬直译。
