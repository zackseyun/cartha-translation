  naturalness: 原句整体庄重自然。“当时她正在治理以色列”比“那时，她治理以色列”更符合现代汉语对持续性过去动作的表达。
  terminology: “底波拉”“拉比多”“女先知”“以色列”均合宜。“妇人”在本段庄重叙事语体中可保留。脚注保留לַפִּידוֹת可作普通名词理解的可能性，措辞可略作规范。
