  text: וּ/דְבוֹרָה֙ אִשָּׁ֣ה נְבִיאָ֔ה אֵ֖שֶׁת לַפִּיד֑וֹת הִ֛יא שֹׁפְטָ֥ה אֶת יִשְׂרָאֵ֖ל בָּ/עֵ֥ת הַ/הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: zh_hans
  text: 底波拉是一位妇人，是一位女先知，也是拉比多[a]的妻子；当时她正在治理以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉比多的妻子”：原文也可按字面理解为“火炬之妇人”，但通常将“拉比多”视为人名。
    reason: 希伯来语לַפִּידוֹת既通常按男性专名“拉比多”理解，也与“火炬”的复数形式相同；脚注保留这一词汇层面的歧义。
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: 一位妇人，也是一位女先知
  rationale: 分别体现原文“妇人”和“女先知”两个成分，不因汉语“女先知”已表明性别而省略 אִשָּׁה。加入“也”使并列身份在现代汉语中自然清楚。
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: 拉比多的妻子
  rationale: אֵשֶׁת 通常是“……的妻子”，לַפִּידוֹת 传统上理解为男性专名“拉比多”；其字面解释的可能性以脚注保留。
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: 治理以色列
  rationale: 该分词表示当时持续承担审判、领导或治理职责。“治理”比单纯“审理案件”更能涵盖《士师记》中该动词的语义范围，同时没有把动词改写成头衔。
- source_word: וּדְבוֹרָה
  choice: 底波拉
  rationale: 句首 וּ־ 在这里主要承接叙事，不必机械译为“现在”或“于是”；现代汉语可直接进入人物介绍。
theological_decisions:
- issue: 底波拉身份中女性信息的表达
  choice: 同时保留“妇人”和“女先知”
  alternative: 仅译“女先知底波拉”
  rationale: 原文明确并列 אִשָּׁה 与 נְבִיאָה；保留二者忠实呈现其措辞和强调，不削弱或扩张经文对她身份与职分的陈述。
- issue: שֹׁפְטָה 所指职责
  choice: 译为“治理”，保留审判与领导的宽广含义
  alternative: 译为“作士师”或“审判”
  rationale: 原文使用动词分词而非“士师”这一名词头衔；“治理”避免将其限缩为司法行为，也避免额外强化制度化头衔。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一位妇人，也是一位女先知”略带强调，以对应原文两个并列身份成分；分号将人物身份介绍与她当时持续承担的治理职责清楚分开。
