- from: 就在那一天，上帝在以色列众子面前制伏了迦南王耶宾[a]。
  to: 那一天，上帝在以色列人面前制伏了迦南王耶宾[a]。
  rationale: 修订仅调整“以色列众子”为现代汉语中自然且在此语境准确的“以色列人”，并以脚注说明原文的字面形式。其余措辞保留原文的神圣行动者、军事—政治性的制伏、时间指示和“在……面前”的关系表达。
