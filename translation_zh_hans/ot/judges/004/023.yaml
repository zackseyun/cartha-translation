  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: zh_hans
  text: 那一天，上帝在以色列人面前制伏了迦南王耶宾[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列的子民”或“以色列的后裔”。希伯来文直译为“以色列的儿子们”。
    reason: 词汇替代译法
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: 制伏了
  rationale: 该词是כנע的使役形叙事过去式，在这里表示使敌方屈服、受制；“制伏”自然地表达军事和政治上的压服。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处明确指以色列的上帝，并且是动作的直接施行者。
- source_word: בַּיּוֹם הַהוּא
  choice: 就在那一天
  rationale: 保留原文的时间指示；“就”也自然承接前文所述事件及其结果。
- source_word: יָבִין מֶלֶךְ כְּנָעַן
  choice: 迦南王耶宾
  rationale: 按现代汉语习惯调整同位结构的语序，同时完整保留人名、王权身份及所属地域。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 直译并保留原文关系上的一定含混，可表示当着以色列众人，也可在语境中指上帝使耶宾败在他们面前。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来文“以色列的众子”这一有性别标记的盟约群体表达；脚注提供更自然的现代汉语替代译法。
theological_decisions:
- issue: 以色列得胜中的神圣施为
  choice: 以上帝为“制伏”的直接主语
  alternative: 改写为以色列人战胜耶宾，弱化或隐去上帝的直接行动
  rationale: 希伯来文明确以אֱלֹהִים为动词主语，因此译文保留上帝直接制伏耶宾的陈述。
- issue: 盟约群体称谓的性别形式
  choice: 正文译作“以色列众子”
  alternative: “以色列人”或“以色列的子孙”
  rationale: 原文使用阳性复数בְּנֵי，正文保留其字面意象和性别形式，同时以脚注说明现代汉语常用译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“制伏”比“降卑”更符合军事政治语境；“以色列众子”略带圣经语体色彩，是为保留原文措辞，现代常用表达列于脚注。
