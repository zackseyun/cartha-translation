review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了上帝作为直接行动者、耶宾作为受事、迦南王的身份以及时间标记。惟“בְּנֵי יִשְׂרָאֵל”在此是常规的群体称谓；正文译为“以色列众子”在现代汉语中不自然，也容易把全体以色列民误解为仅指男性儿子。
  naturalness: “以色列众子”不符合现代标准汉语的通常搭配。“以色列人”在叙事正文中自然、庄重，并准确传达该固定族群称谓。
  terminology: “上帝”“制伏”“迦南王耶宾”均恰当。“在以色列人面前”保留לִפְנֵי可指在其面前／相对于他们的关系，未作不必要的释义。脚注宜说明原文的字面表达，而非把不自然的“众子”置入正文。
  issues:
  - severity: medium
    issue: “以色列众子”用语生硬且可能造成范围误解。
    rationale: 希伯来文“以色列的众子”在此为指称以色列民的惯用构词，不是在限定只有男性后代。现代汉语正文采用“以色列人”最自然；可用脚注保留字面措辞及替代译法。
  revised_text: 那一天，上帝在以色列人面前制伏了迦南王耶宾[a]。
