base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: zh_hans
  text: 他对她说：“你站在帐篷入口处；若有人[a]来问你：‘这里有男人吗？’你就说：‘没有。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在“若有人来”和“这里有男人吗”两处都使用“男人”（אִישׁ）。前者在不定条件句中可自然译作“有人”；后者保留“男人”以反映原文的男性用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד
  choice: 你站在
  rationale: 这是动词עמד的阳性单数命令式，要求她站在或守在指定位置；“站在”自然、直接，也保留命令语气。
- source_word: פֶּתַח הָאֹהֶל
  choice: 帐篷入口处
  rationale: פֶּתַח指开口或入口；帐篷未必有固定门扇，因此“帐篷入口处”比“帐篷门口”略为准确，同时符合现代汉语。
- source_word: וְהָיָה אִם
  choice: 要是
  rationale: 这一结构引出假设情形；“要是”清楚传达条件关系，避免生硬照译希伯来语惯用结构。
- source_word: אִישׁ
  choice: 有人
  rationale: אִישׁ可指“男人”，在存在句和不定条件中也常泛指“人、某人”。本句是在询问是否有人藏在帐篷里，现代汉语用“有人”最自然；此处两次均作同样处理，以保留原文的词语重复。
- source_word: יָבוֹא
  choice: 来
  rationale: בוא的基本义是“来、到来”；这里指有人来到帐篷附近，“来”简洁自然。
- source_word: וּשְׁאֵלֵךְ וְאָמַר
  choice: 问你说
  rationale: 原文连续使用“问你”和“说”。“问你说”在现代汉语中仍可自然引出直接问话，并较完整地保留原文结构。
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: 这里有人吗？
  rationale: הֲיֵשׁ询问存在与否，פֹּה意为“这里”，אִישׁ在这一语境中自然译为“有人”；整句是现代汉语常用的存在问句。
- source_word: אָיִן
  choice: 没有
  rationale: אָיִן是简短的否定存在回答。“没有”既保留原文的简洁，也比单说“不”更符合汉语对“有人吗”的回答习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留直接命令和条件句的紧凑节奏；将两处אִישׁ统一译为“有人”，既反映其在本语境中的不定、存在用法，也保留原文重复，不增加性别上不必要的限定。
