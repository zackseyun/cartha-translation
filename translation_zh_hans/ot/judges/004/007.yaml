base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: zh_hans
  text: 我必把耶宾军队的统帅西西拉，连同他的战车和大队人马[b]，引到你那里，到基顺河谷[a]；我必把他交在你手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基顺河”或“基顺溪”；希伯来语这个词可指河流、溪流，也可指季节性水道及其河谷。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的军队”；原文所用的词意义较宽，直译为“他的众人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: 我必……引到
  rationale: מָשַׁךְ在此表示使西西拉前往指定地点。“引到”保留使其被带向某处的含义，又不额外加入“诱骗”的动机。
- source_word: אֵלֶיךָ
  choice: 你那里
  rationale: 介词加第二人称阳性单数后缀，表示朝向巴拉；“你那里”在汉语中自然地保留了这一人称指向。
- source_word: אֶל נַחַל קִישׁוֹן
  choice: 到基顺河谷[a]
  rationale: נַחַל可指河流、溪流，也可指季节性水道及其河谷。“基顺河谷”兼顾当地地貌和现代汉语可读性，并以脚注保留其他可能译法。
- source_word: סִיסְרָא
  choice: 西西拉
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: שַׂר צְבָא יָבִין
  choice: 耶宾的军长
  rationale: שַׂר צָבָא指军队统帅；“军长”简洁、庄重，明确其军事领导身份。
- source_word: רִכְבּוֹ
  choice: 他的战车
  rationale: רֶכֶב在这里可集合性地指战车或战车部队；“他的战车”直接保留原文表达，军事语境清楚。
- source_word: הֲמוֹנוֹ
  choice: 他的大队人马[b]
  rationale: הָמוֹן广义指众多的人、群众或大队；“大队人马”既符合军事场景，又比单译“军队”更能保留词义的宽泛性。
- source_word: וּנְתַתִּיהוּ
  choice: 我必把他交
  rationale: נָתַן与“在手中”连用，表示把某人交由另一方掌控；汉语用“交”能自然传达该惯用义。
- source_word: בְּיָדֶךָ
  choice: 在你手中
  rationale: 保留希伯来语“在某人手中”这一表示处于其权下的形象说法，现代汉语也易于理解。
theological_decisions: []
