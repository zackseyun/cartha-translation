  text: וַ/יַּזְעֵ֨ק סִֽיסְרָ֜א אֶת כָּל רִכְבּ֗/וֹ תְּשַׁ֤ע מֵאוֹת֙ רֶ֣כֶב בַּרְזֶ֔ל וְ/אֶת כָּל הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ מֵ/חֲרֹ֥שֶׁת הַגּוֹיִ֖ם אֶל נַ֥חַל קִישֽׁוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: zh_hans
  text: 西西拉就把他所有的战车，就是九百辆铁战车，以及所有跟随他的人，从夏罗设·哈歌印召集到基顺河谷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河谷”也可译为“河”“溪谷”或“季节性急流的河道”；希伯来语 נַחַל 可指河流、溪流的河床，或有季节性水流的谷地。
    reason: 保留地理名词 נַחַל 的词义范围，避免把其水文性质限定得过死。
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: 召集
  rationale: זעק本可表示“呼喊”，但此处以战车和人员为直接宾语，处于军事调动语境，因此译为“召集”，既体现调集之意，又不过度发挥。
- source_word: רִכְבּוֹ
  choice: 他所有的战车
  rationale: רכב可统指战车部队；下文以“九百辆铁战车”作同位说明，因此在中文中具体译作“战车”最清楚自然。
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: 九百辆铁战车
  rationale: 直译数量和名词结构；“铁战车”保留原文表述，不擅自判定是全铁制造、铁制部件还是配有铁兵器。
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: 所有跟随他的人
  rationale: עָם字面为“人民、众人”，在这里按军事语境指随同西西拉的人；译文保留较宽泛的“人”，不明确收窄为“士兵”或“军队”。
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: 从夏罗设·哈歌印
  rationale: 作为地名采用音译，并明确译出介词מִן“从”。
- source_word: נַחַל קִישׁוֹן
  choice: 基顺河谷
  rationale: נַחַל可指河谷、溪流、河床或季节性急流；“河谷”适合此处地理语境，同时以脚注保留其词义范围。
