base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: zh_hans
  text: 西西拉却[a]徒步逃到基尼人希百的妻子雅亿的帐篷里，因为夏琐王耶宾和基尼人希百家[b]之间有和平关系。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西西拉就徒步逃走。”希伯来语连词也可简单译作“而”或“于是”；正文的“却”体现上下文中的叙事对照。
    reason: alternative_reading
  - marker: b
    text: “希百家”指希百的家室或宗族。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: 西西拉却
  rationale: 连词 וְ 本可直译为“而、于是”，但这里叙事转向西西拉本人，并与前文军队溃败、他弃车逃跑的情景形成对照；用“却”能自然表达这一语篇作用，同时以脚注保留较中性的译法。
- source_word: נָ֣ס בְּ/רַגְלָ֔י/ו
  choice: 徒步逃
  rationale: נָס 的基本义为“逃跑、逃走”；בְּרַגְלָיו 字面为“用他的脚”，在现代汉语中自然译作“徒步”，也点明他没有乘车。
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: 逃到……雅亿的帐篷里
  rationale: אֶל 表示趋向，אֹהֶל יָעֵל 为“雅亿的帐篷”；“到……帐篷里”符合汉语叙事表达。
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: 基尼人希百的妻子
  rationale: 按原文同位说明交代雅亿的身份；“基尼人”修饰希百。
- source_word: כִּ֣י
  choice: 因为
  rationale: 此处引出西西拉逃往雅亿帐篷的原因，现代汉语用“因为”清楚自然。
- source_word: שָׁל֗וֹם
  choice: 和平相处
  rationale: שָׁלוֹם 在这里指双方不存在敌对、保持和平关系；“和平相处”保留其基本含义，又比“有和平”更符合现代汉语。
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: 基尼人希百家
  rationale: בֵּית 字面为“家、家室”，在此指希百的家庭或宗族群体；正文保留简洁的“希百家”，并用脚注说明。
