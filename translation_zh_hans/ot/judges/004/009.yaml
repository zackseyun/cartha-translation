  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: zh_hans
  text: 她说：“我一定会和你一起去。只是，你所走的这条路不会给你带来荣耀，因为雅威必将西西拉交在一个女人手中。”于是底波拉起身，同巴拉往基低斯去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: 我一定……去
  rationale: 不定式绝对式与未完成式连用，强化“去”的语气；“一定去”以自然汉语保留强调。
- source_word: אֶפֶס
  choice: 不过
  rationale: 此处引出对底波拉应允的限制和转折，现代汉语用“不过”简洁自然。
- source_word: תִּפְאַרְתְּךָ
  choice: 不会为自己赢得荣耀
  rationale: 该词在军事语境中指胜利所带来的荣耀或声誉；此译法清楚表达荣耀不归巴拉，同时不缩窄为一般性的“功劳”。
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: 这次出征
  rationale: 字面为“在你所走的道路上”。上下文明确涉及巴拉将要进行的军事行动，“这次出征”在现代汉语中自然地传达该语境意义。
- source_word: בְיַד אִשָּׁה
  choice: 交在一个女人手中
  rationale: 保留希伯来语“在……手中”的权势和控制意象，并符合汉语表达。
- source_word: יִמְכֹּר
  choice: 交在
  rationale: 该动词本义为“卖”，在本句军事语境中是把敌人交付他人权下；直译“卖”在现代汉语中容易误解为交易，故按语境译为“交在”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文常用音译呈现四字神名，而不以称号替代。
- source_word: וַתָּקָם
  choice: 起身
  rationale: 保留叙事动作及随后启程的意味，表达自然庄重。
- source_word: קֶדְשָׁה
  choice: 往基低斯去了
  rationale: 方向词尾表示朝向基低斯；地名采用中文圣经语境中通行的音译“基低斯”并明确方向。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其专名性质，不用称号替代。
- issue: 荣耀不归巴拉的具体所指
  choice: 不会为自己赢得荣耀
  alternative: 你在所走的路上必得不着荣耀
  rationale: 原文将“你的荣耀”与巴拉所走的道路相连，却未详述女人的身份；译文只按军事语境说明这次出征的荣耀不归巴拉，不提前指明后文人物，也不消除叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。对希伯来语强调结构作自然强化；军事交付惯用语避免生硬直译，但保留“手中”的原文意象。人名、地名采用“西西拉、底波拉、巴拉、基低斯”等通行中文形式。
