  language: zh_hans
  text: 有人告诉西西拉，亚比挪庵的儿子巴拉已经上了他泊山。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: 有人告诉
  rationale: 该词是נגד的使役词干连续式，意为“告诉、报告”。希伯来文使用未明确身份的复数主语；现代汉语用“有人”自然表达主体不详，同时避免误解为特定的一群人。
- source_word: לְסִיסְרָא
  choice: 告诉西西拉
  rationale: 介词לְ标示告知的对象；汉语直接置于“告诉”之后最自然。
- source_word: כִּי
  choice: （不另译，由后接宾语分句表达）
  rationale: 这里כִּי引出所报告的内容。现代汉语在“告诉”之后通常无需对应译出“that”，直接接分句即可。
- source_word: עָלָה
  choice: 已经上了
  rationale: עלה意为“上去、登上”。“上了他泊山”兼顾方向和地形；“已经”自然体现告知时该行动已发生，但不把希伯来语完成式机械处理为特定时态。
- source_word: בָּרָק
  choice: 巴拉
  rationale: 采用该人名通行的现代中文圣经音译。
- source_word: בֶּן אֲבִינֹעַם
  choice: 亚比挪庵的儿子
  rationale: 直接保留希伯来文父子称谓结构，并采用通行中文人名音译。
- source_word: הַר תָּבוֹר
  choice: 他泊山
  rationale: הַר指山；与专名תָּבוֹר连用时指特定山峰，译作通行地名“他泊山”。
