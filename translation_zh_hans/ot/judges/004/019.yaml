  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ הַשְׁקִי/נִי נָ֥א מְעַט מַ֖יִם כִּ֣י צָמֵ֑אתִי וַ/תִּפְתַּ֞ח אֶת נֹ֧אוד הֶ/חָלָ֛ב וַ/תַּשְׁקֵ֖/הוּ וַ/תְּכַסֵּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: zh_hans
  text: 他对她说：“请给我一点水喝，因为我渴了。”她就打开装奶的皮囊[a]，给他喝了，又把他盖住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮囊”指用兽皮制成的盛液体容器，并非现代的瓶子。
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי נָא
  choice: 请给我……喝
  rationale: שׁקה的使役命令式带第一人称单数后缀，意为“给我喝”；נָא使请求语气较为委婉，现代汉语用“请”自然表达。
- source_word: מְעַט מַיִם
  choice: 一点水
  rationale: מְעַט表示少量；“一点水”贴近原文，也符合现代汉语习惯。
- source_word: כִּי צָמֵאתִי
  choice: 因为我渴了
  rationale: כִּי在此说明请求的原因；“我渴了”自然表达完成式所描述的当前状态。
- source_word: נֹאוד הֶחָלָב
  choice: 装奶的皮囊
  rationale: נֹאוד指以兽皮制成的容器；该结构表明其中装的是奶。“装奶的皮囊”既交代容器材质和用途，也保留西西拉求水而雅亿给奶的叙事对照。
- source_word: וַתַּשְׁקֵהוּ
  choice: 给他喝了
  rationale: 该词同样是שׁקה的使役式。前句已说明打开的是装奶的皮囊，汉语不必重复“奶”，仍能清楚指向所给的饮品。
- source_word: וַתְּכַסֵּהוּ
  choice: 把他盖住
  rationale: כסה可指遮盖或隐藏；“盖住”保留原文未明说用何物遮盖的特点，也未过度限定其目的。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。连续动作以“就……又……”连接，保持希伯来叙事的推进感；对原文未明说的遮盖物不作补充。
