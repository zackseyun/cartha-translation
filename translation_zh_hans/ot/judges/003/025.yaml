base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: zh_hans
  text: 他们一直等到觉得难为情[a]；看哪，他还没有打开楼上房间[b]的门。于是他们拿钥匙开了门；看哪，他们的主人[c]倒在地上，已经死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直到感到羞愧”。这里的希伯来语可表示羞愧，也可表示因久等而产生的尴尬。
    reason: lexical_alternative
  - marker: b
    text: 或译“上层房间”或“上屋”。
    reason: lexical_alternative
  - marker: c
    text: 或译“他们的主上”。这里指他们在人间的主人伊矶伦。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: 他们一直等
  rationale: 此处描述仆人守在锁着的门外继续等待；“一直等”自然地表达延续状态。
- source_word: עַד בּוֹשׁ
  choice: 直到觉得难为情
  rationale: בוש可指羞愧，也可指处境造成的尴尬；结合仆人迟迟不敢打扰主人的情境，“难为情”较贴切，同时以脚注保留“羞愧”的可能。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 两次保留叙事提示语的突转和现场感，符合庄重的圣经叙事语体。
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: 他还没有打开
  rationale: 否定存在式加分词表示当时持续未发生的动作；“还没有打开”体现仆人原本期待门会打开，而不把“还”误作独立词汇。
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: 楼上房间的门
  rationale: עֲלִיָּה是位于上层的房间；汉语通常以单数集合名词“门”自然表达，脚注保留“楼房/上层房间”等语义范围。
- source_word: הַמַּפְתֵּחַ
  choice: 钥匙
  rationale: 直接对应原文，语义明确。
- source_word: וַיִּפְתָּחוּ
  choice: 开了门
  rationale: 原文宾语承接前文的门；汉语补出“门”比使用代词更清楚自然。
- source_word: אֲדֹנֵיהֶם
  choice: 他们的主人
  rationale: 此处指仆人的人间主上伊矶伦；“主人”既表达从属关系，也避免与神的称号混淆。
- source_word: נֹפֵל אַרְצָה
  choice: 倒在地上
  rationale: 分词描写开门后所见的状态；“倒在地上”直接保留אַרְצָה的方向/处所意象，不额外限定为室内地板。
- source_word: מֵת
  choice: 已经死了
  rationale: 说明被发现时的死亡状态；“已经”自然表达开门时所见的结果状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留两处“看哪”以呈现希伯来叙事的突然发现感；不用过度古雅的“ behold ”式对应。正文脚注依相关词语出现顺序排列为[a]、[b]、[c]。
