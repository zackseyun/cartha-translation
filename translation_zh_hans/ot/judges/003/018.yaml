  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: zh_hans
  text: 他呈完贡物[a]，就打发运送贡物的人离开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼物”或“供物”。这里的希伯来语按语境很可能指呈给统治者的贡物，而不是祭祀用的供物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 他……完
  rationale: 希伯来语叙事句式在此引出先后相接的事件；汉语用“……完，就……”自然表达时间关系，无须直译“事情发生在……时”。
- source_word: כִּלָּה לְהַקְרִיב
  choice: 献完
  rationale: כִּלָּה表示完成，לְהַקְרִיב表示将某物带近、呈献；“献完”简洁地保留呈交已经完成的意思，同时不必将其理解为祭祀。
- source_word: הַמִּנְחָה
  choice: 贡物
  rationale: מִנְחָה可指礼物、供物或贡物；按以笏向摩押王交纳物品的政治语境，“贡物”最贴切。原文两次使用同一词，译文也保持一致。
- source_word: וַיְשַׁלַּח
  choice: 让……先走了
  rationale: 该动词意为打发、送走。结合下文以笏随后独自返回，“让……先走了”是自然汉语，也清楚表达同行者被遣离。
- source_word: הָעָם
  choice: 人
  rationale: 原词通常指百姓或一群人；此处是运送贡物的随行人员。放在“抬贡物的人”中既不添加性别信息，也符合现代汉语。
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: 抬贡物的人
  rationale: נֹשְׂאֵי是表示承担、搬运的分词。“抬贡物的人”自然呈现这些人的角色，并与多人运载贡物的场景相称。
