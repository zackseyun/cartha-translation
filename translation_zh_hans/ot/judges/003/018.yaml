translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“献”在现代汉语中可指呈献贡物，不限定为宗教祭献；脚注保留原词的语义范围。“先走了”顺应本章行动次序，但不额外说明以笏的意图。
