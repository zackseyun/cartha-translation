  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תִּכָּנַ֤ע מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא תַּ֖חַת יַ֣ד יִשְׂרָאֵ֑ל וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ שְׁמוֹנִ֥ים שָׁנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: zh_hans
  text: 那一天，摩押被制伏，归在以色列手下[a]；那地太平了八十年[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归在以色列手下”对应希伯来语“在以色列的手下”，是指受以色列的权势支配。
    reason: cultural_note
  - marker: b
    text: “太平”也可译作“安静”或“安宁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: 被制伏
  rationale: 该词为כנע的尼法勒式，在此表达被压服、归于臣服的军事政治结果；“被制伏”自然且不过度强化为毁灭。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经及历史地名的通行译名。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 直接保留时间短语及指示词的语义，也符合现代汉语表达。
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: 在以色列手下
  rationale: 保留希伯来语“在……手下”的形象，同时中文也能自然表达受其权势支配。
- source_word: וַתִּשְׁקֹט
  choice: 太平了
  rationale: שקט表示安静、不受扰乱；在《士师记》的叙事语境中通常指战事止息、局势安定。“太平了”比单纯“安静了”更贴合此处。
- source_word: הָאָרֶץ
  choice: 国中
  rationale: 此处指以色列所在之地及其社会局势；“国中太平”是自然、庄重的现代中文表达，但不将其解释为现代民族国家。
- source_word: שְׁמוֹנִים שָׁנָה
  choice: 八十年
  rationale: 汉语以时量补语自然表达持续时段，无须另加“达”。
theological_decisions:
- issue: 摩押受以色列支配的性质
  choice: 以传统圣经意象表达军事政治上的制伏
  alternative: 仅指抽象的受辱，或指彻底消灭
  rationale: 上下文所述是摩押被置于以色列权势之下，继而境内止息战乱；译文不弱化为心理上的谦卑，也不强化为灭绝。
- issue: “地安静”的含义
  choice: 译作“国中太平”，指战事止息、局势安定
  alternative: 把它绝对化为毫无任何冲突的完全和平
  rationale: שקט在士师记的叙事公式中指一段免受主要敌患侵扰的安定时期，不应额外赋予绝对或末世性的含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“被制伏”保留军事政治语义；“在以色列手下”保留原文意象，并以脚注解释；以“国中太平”自然呈现士师记中反复出现的安定公式。
