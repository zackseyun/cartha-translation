base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: zh_hans
  text: 剑柄[a]也跟在剑刃之后进去了，脂肪合拢，包住剑刃；他没有把剑从腹中拔出来，粪便就出来了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “剑柄”也可译为“把手”或“柄部”。
    reason: lexical_alternative
  - marker: b
    text: 译作“粪便”的希伯来语词十分罕见，也可能泛指粪便或肠中内容物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: 剑柄
  rationale: 在剑刺入身体的语境中，指剑刃之后的柄部；“剑柄”自然、明确，也保留整个柄部随之进入的骇人细节。
- source_word: הַלַּהַב
  choice: 剑刃
  rationale: 该词在别处可指“火焰”，但在武器语境中明确指刃；“剑刃”与后文的“剑”衔接自然。
- source_word: וַיִּסְגֹּר הַחֵלֶב בְּעַד
  choice: 脂肪把……包住了
  rationale: 动词与介词组合表达脂肪合拢并包覆剑刃；此译法符合现代汉语，同时保留原文具体而强烈的身体意象。
- source_word: שָׁלַף
  choice: 拔出来
  rationale: 该动词常用于拔出武器；剑已刺入腹中，因此“拔出来”最合乎汉语习惯。
- source_word: מִבִּטְנוֹ
  choice: 从王的肚腹中
  rationale: 原词指肚腹；补出“王”以避免现代汉语中代词指向含混，并保留叙事所指的以矶伦。
- source_word: הַפַּרְשְׁדֹנָה
  choice: 粪便
  rationale: 这是罕见且释义有争议的词，传统上多理解为排泄物或肠内之物；正文采用简明直观的“粪便”，并在脚注保留范围较宽的可能含义。
- source_word: וַיֵּצֵא
  choice: 流了出来
  rationale: 原动词基本义为“出来”；结合粪便或肠内之物的语境，“流了出来”是自然且不过度临床化的表达。
- source_word: גַם
  choice: 也
  rationale: 强调不只是剑刃，连剑柄也进入了；置于“剑柄”之后自然传达这一递进。
