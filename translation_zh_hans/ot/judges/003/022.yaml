  to: 剑柄[a]也跟在剑刃之后进去了，脂肪合拢，包住剑刃；他没有把剑从腹中拔出来，粪便就出来了[b]。
  rationale: 修订使“剑柄”作为随剑刃进入的部分，而非刺击动作的施事；避免以“流”限定原文未说明的排出方式；并以更自然的现代汉语处理剑部件的脚注替代词。保留原文对罕见末词的歧义及其脚注锚点。
