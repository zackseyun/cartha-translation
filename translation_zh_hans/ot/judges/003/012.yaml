source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: zh_hans
  text: 以色列人又做在耶和华眼中看为恶的事；耶和华就使摩押王伊矶伦强盛，以对抗以色列，因为他们做了在耶和华眼中看为恶的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: 又做
  rationale: יסף加不定式在此表示重复发生；士师记的循环语境也支持“又”，比“继续”更明确地表达再次犯罪。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，但现代汉语以“以色列人”自然、准确地表达这一民族共同体称谓。
- source_word: לַעֲשׂוֹת הָרַע
  choice: 做……看为恶的事
  rationale: 结合后接的评价短语“在……眼中”，译为“做……看为恶的事”既符合汉语表达，也保留道德评价的内容。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留“在眼中”的希伯来语评价意象，同时采用现代汉语常用的“眼中看为恶”结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名形式，明确其为以色列上帝的名字，而非以“主”这一称号代替。
- source_word: וַיְחַזֵּק
  choice: 使……强盛
  rationale: 皮勒词干表达主动使之强大；“使……强盛”保留耶和华的直接施动性，也适合描述君王及其势力增强。
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: 摩押王伊矶伦
  rationale: 按自然汉语将身份称号置于人名前，简洁呈现同位关系。
- source_word: עַל יִשְׂרָאֵל
  choice: 来对抗以色列
  rationale: עַל在敌对语境中表示针对、攻击；“对抗”保留敌对方向，又不把原文扩展成已经取得统治或胜利。
- source_word: עַל כִּי
  choice: 因为
  rationale: 该复合连接语引出耶和华采取行动的原因，现代汉语用“因为”最清楚自然。
- source_word: עָשׂוּ אֶת הָרַע
  choice: 他们做了……看为恶的事
  rationale: 重复原文的完整道德评价，不为行文简洁而删去；“做了”自然表达作为审判缘由的既成行为。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文采用中文读者最熟悉且具专名功能的“耶和华”，不以“主”替代；“雅威”是较接近学术重构读音的另一可行形式。
- issue: 耶和华在 וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן 中的主动作用
  choice: 耶和华就使摩押王伊矶伦强盛
  alternative: 耶和华容许摩押王伊矶伦强盛起来
  rationale: 原文以耶和华为主动施事者，动词意为“使强大”。译文不弱化为单纯许可，也不进一步解释神如何使他强盛，从而保留经文的神学张力。
- issue: עַל יִשְׂרָאֵל 所指的关系
  choice: 来对抗以色列
  alternative: 辖制以色列
  rationale: 介词在此可涉及敌对行动，并可能由后文发展为统治；本节本身首先说明伊矶伦被加强以敌对以色列，因此不提前限定为已经辖制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以色列人”避免生硬直译“以色列的众子”；重复两次“耶和华眼中看为恶的事”，以保留原文的修辞和因果强调。
