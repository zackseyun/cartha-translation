  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: zh_hans
  text: 以色列人服事摩押王伊矶伦十八年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较明确地译作：“以色列人臣服于摩押王伊矶伦十八年。”
    reason: 词义上的另一译法；说明此处“服事”表示政治上的臣服，而非敬拜。
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: 服事
  rationale: עבד在这里指在外国君王统治下服役、臣服，并非敬拜。“服事”保留原文基本措辞及其政治性语境；较解释性的译法列入脚注。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该群体称谓自然、准确的表达；原文虽直译为“以色列的众子”，此处是民族整体的惯用称呼，并非特指男性后裔。
- source_word: אֶת עֶגְלוֹן
  choice: 伊矶伦
  rationale: אֶת是直接宾语标记，不另译；专名采用现代中文圣经读者较熟悉的音译“伊矶伦”。
- source_word: מֶלֶךְ מוֹאָב
  choice: 摩押王
  rationale: 该组合结构自然译为“摩押王”，作为“伊矶伦”的身份说明，简洁并符合现代汉语语序。
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: 十八年
  rationale: 原文以宾格表达持续时间；汉语直接用“十八年”即可自然表达时长，无须增添介词。
