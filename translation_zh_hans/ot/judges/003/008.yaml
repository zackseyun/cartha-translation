id: JDG.3.8
reference: Judges 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: zh_hans
  text: '于是，雅威向以色列怒火中烧，把他们卖在亚兰-拿哈拉音[a]王古珊-利萨田的手中。以色列人[b]服侍古珊-利萨田八年。


    [a] “亚兰-拿哈拉音”传统上理解为“双河的亚兰”，也可译作“美索不达米亚”。


    [b] 希伯来语直译为“以色列的众子”，这里指以色列民。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰-拿哈拉音”传统上理解为“双河的亚兰”，也可译作“美索不达米亚”。
    reason: 说明音译地名的传统释义及常见替代译法。
  - marker: b
    text: 希伯来语直译为“以色列的众子”，这里指以色列民。
    reason: 保留原文固定表达的字面形式，同时说明其群体所指。
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 怒火中烧
  rationale: 保留希伯来语中怒气“燃烧”的鲜明意象，同时采用自然、庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代专名。
- source_word: וַיִּמְכְּרֵם
  choice: 把他们卖到……手中
  rationale: 保留מכר“卖”的审判隐喻，并与“手中”这一支配权意象相连。
- source_word: בְּיַד
  choice: 手中
  rationale: 既保留希伯来语“在某人手中”的形象，也能自然表达落入其权势之下。
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: 古珊-利萨田
  rationale: 将人名音译，并用连接号表明这是一个完整称名。
- source_word: אֲרַם נַהֲרָיִם
  choice: 亚兰-拿哈拉音
  rationale: 正文音译希伯来地名，避免直接以“美索不达米亚”取代原文形式；传统释义另列脚注。
- source_word: וַיַּעַבְדוּ
  choice: 服事
  rationale: 直接反映עבד“服事、效劳”的词义；在此语境中含有臣服、受奴役的政治意味，但不在正文中将其过度解释。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语中对该固定民族称谓最自然准确的表达；原文的字面形式“以色列的众子”在脚注中保留。
- source_word: שְׁמֹנֶה שָׁנִים
  choice: 八年
  rationale: 直接、准确地表达原文时段。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名，故正文以音译“雅威”呈现，而不改用“主”等称号；“耶和华”是传统汉语形式，但较不贴近通常重建的读音。
- issue: בְנֵי יִשְׂרָאֵל的性别与群体含义
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该固定表达在此指整个以色列群体，而非仅强调男性后裔。正文采用自然且语义准确的群体称谓，并以脚注注明字面形式，以免抹去原文措辞。
- issue: “卖到……手中”的神学张力
  choice: 保留“卖”的隐喻
  alternative: 交在……手中
  rationale: 原文将雅威描写为主动把以色列“卖”给外邦君王，具有盟约审判的强烈修辞效果；不将其缓和为较中性的“交给”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“怒火中烧”保留原文燃烧意象；“卖到……手中”有意保留两层希伯来语修辞。专名采用音译，较难理解的地名另加脚注。所有脚注标记均置于正文对应位置。
