base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: zh_hans
  text: 那时，他们击杀了约一万名摩押人[a]，都是强壮的人[b]，都是勇士[c]；没有一人逃脱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“摩押”；下文随即说“约一万人”，表明这里所指的是摩押人。
    reason: lexical_alternative
  - marker: b
    text: 或译“肥壮的人”。希伯来文直译为“每一个肥壮的”，在这里可能指体格健壮、养得壮实的人。
    reason: lexical_alternative
  - marker: c
    text: 或译“有能力的人”或“英勇的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: 他们击杀了
  rationale: נכה在战争语境中指击倒、杀死或杀伤；本节末尾说无人逃脱，因此“击杀”自然表达战斗造成的致命结果。
- source_word: אֶת מוֹאָב
  choice: 摩押人
  rationale: 希伯来文直译为“摩押”，但下文以“约一万名”计数，表明这里指摩押人；中文用“摩押人”既清楚又自然。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 准确、简洁地表达该标准时间短语，并适合现代中文叙事。
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: 约一万名
  rationale: 前缀כַּ־在此表示约数；“约一万名”自然保留其近似含义。
- source_word: כָּל שָׁמֵן
  choice: 都是强壮的人
  rationale: שָׁמֵן字面可指“肥壮”，在军事语境中很可能强调体格健壮、养得壮实；“强壮的人”传达语境意义，而脚注保留具体字面意象。
- source_word: וְכָל אִישׁ חָיִל
  choice: 都是勇士
  rationale: אִישׁ חַיִל在军事语境中指有力量、有能力或英勇善战的人；“勇士”简洁而贴合上下文。
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: 没有一人逃脱
  rationale: 保留分配性单数所强调的彻底性，也是自然庄重的现代中文。
