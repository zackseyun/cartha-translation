id: JDG.3.4
reference: Judges 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יִּהְי֕וּ לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל לָ/דַ֗עַת הֲ/יִשְׁמְעוּ֙ אֶת מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁר צִוָּ֥ה אֶת אֲבוֹתָ֖/ם בְּ/יַד מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: zh_hans
  text: 这些民族留在那里，是要借着他们试验以色列人[a]，好知道以色列人是否听从雅威的诫命[b]；这些诫命是他借摩西吩咐他们祖先的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文明确说“借着他们”，指借着留在当地的这些民族来试验以色列人。
    reason: lexical_alternative
  - marker: b
    text: “听从”原文直译为“听”，在这里含有留意并遵行雅威诫命的意思。
    reason: lexical_alternative
  - marker: c
    text: “他们祖先”原文直译为“他们的父辈”，指以色列人的先祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 这些民族留在那里
  rationale: 承接上文所说留在当地的民族。希伯来语直译为“他们在那里/他们存在”，现代汉语用“留在那里”自然表达其继续存在于当地的语境含义。
- source_word: לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל
  choice: 要借着他们试验以色列人
  rationale: נסה表示以考验来察验；בם明确指出那些留下的民族是试验所借用的手段。“试验”保留原文的神学张力，又不暗示引诱人作恶。
- source_word: לָדַעַת
  choice: 好知道
  rationale: 保留ידע“知道”的基本意义，同时以“好”表达目的关系，不把原文进一步解释为特定的认识论主张。
- source_word: הֲיִשְׁמְעוּ
  choice: 是否听从
  rationale: שמע与诫命连用时兼有聆听、留意并遵行之意。“听从”既保留听觉意象，也自然传达顺服含义。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 准确表达מצוה在盟约语境中的命令或诫命，且符合现代中文圣经语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神的专名YHWH，不以“主”这一称号替代原文专名。
- source_word: אֲשֶׁר צִוָּה
  choice: 这些诫命是他……吩咐……的
  rationale: 以中文关系分句清楚连接前面的“诫命”，保留“他吩咐”的主谓关系。
- source_word: אֲבוֹתָם
  choice: 他们祖先
  rationale: אבותם指以色列人的先祖。中文“祖先”自然、准确，也不会误解为他们各自的亲生父亲。
- source_word: בְּיַד־מֹשֶׁה
  choice: 借摩西
  rationale: “借……的手”是表示媒介或代理的希伯来语习语；“借摩西”以自然中文保留摩西作为传达者的角色。
theological_decisions:
- issue: 试验的目的与方式
  choice: 留下的民族是试验以色列是否听从诫命的手段
  alternative: 仅将此事描述为一般性的历史观察，或把“试验”译成引诱犯罪
  rationale: לְנַסּוֹת与לָדַעַת均表达目的，而בם标明试验所借的手段。译文保留神借历史处境察验以色列的张力，不扩展解释试验者如何获得知识，也不把试验说成诱惑。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主；主
  rationale: 原文使用神的专名，因此正文采用音译“雅威”，避免以称号替代专名。
- issue: “听”与“顺服”的关系
  choice: 听从
  alternative: 听见；遵守
  rationale: שמע在诫命语境中不只是听见声音，也包含响应和顺服。“听从”同时保存这两层含义，没有把表达缩减为纯粹听觉或完全改写为行为术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这些民族”补明复数代词的上文指向；“留在那里”体现上下文中的持续状态。“好知道”保留原文目的表达和神学张力。所有脚注标记均置于其所解释的词句之后。
