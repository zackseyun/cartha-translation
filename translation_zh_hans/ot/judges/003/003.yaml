base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: zh_hans
  text: 就是非利士人的五个首领、所有迦南人、西顿人，以及住在黎巴嫩山区、从巴力·黑门山直到利波·哈马[a]的希未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到哈马入口。”希伯来语这一表达既可理解为地名“利波·哈马”，也可理解为描述性的说法。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: 非利士人的五个首领
  rationale: 构造链指非利士人的五位政治领袖。“首领”准确而自然，也避免“诸侯”等词可能带入的特定制度含义。
- source_word: וְכָל הַכְּנַעֲנִי
  choice: 以及所有迦南人
  rationale: “迦南人”在希伯来文中虽为单数形式，却具有集合意义；汉语用“所有迦南人”清楚表达这一点。
- source_word: וְהַצִּידֹנִי וְהַחִוִּי
  choice: 西顿人和……希未人
  rationale: 两个民族称谓均以现代汉语常用的集合名称表达。
- source_word: יֹשֵׁב הַר הַלְּבָנוֹן
  choice: 住在黎巴嫩山区的
  rationale: 分词 יֹשֵׁב 按其紧邻关系修饰“希未人”；הַר הַלְּבָנוֹן 在这里指黎巴嫩的山地范围，译作“黎巴嫩山区”比理解为单一山峰更符合地理语境。
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: 从巴力·黑门山
  rationale: 按地名音译；以间隔号标示复合专名的组成部分，并以“山”交代 הַר。
- source_word: עַד לְבוֹא חֲמָת
  choice: 延伸到利波·哈马
  rationale: 将 לְבוֹא חֲמָת 作为已知地名处理，同时用脚注保留其可按普通词义理解为“哈马入口”的可能。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“就是”承接本节在上下文中的名单结构；分号将民族名单与其地理范围分开，以提高可读性。“他们居住的地域”是为使希伯来语简略的范围表达在汉语中自然连贯，并不改变所列群体的身份。脚注标记置于实际存在歧义的“利波·哈马”之后。
