  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: zh_hans
  text: 以笏就伸出左手，从右大腿上拔出那把剑，刺进王的腹部。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 伸出
  rationale: 此处指伸出手去取兵器；“伸出”自然、准确，也保留动作顺序。
- source_word: יַד שְׂמֹאלוֹ
  choice: 左手
  rationale: 原文明确是“他的左手”，应保留叙事对左手动作的强调。
- source_word: וַיִּקַּח
  choice: 拔出
  rationale: 基本义是“拿、取”；结合剑佩在右大腿旁的情境，现代汉语用“拔出”更自然，同时没有改变动作实质。
- source_word: הַחֶרֶב
  choice: 那把剑
  rationale: חֶרֶב是“剑”的通用词；定冠词在上下文中指前文已述的那把剑。虽可能是短剑或匕首，本节不宜缩窄词义。
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: 从右大腿旁
  rationale: 原文直指兵器位于他的右大腿之上或旁侧；“右大腿旁”符合汉语佩剑位置的自然表达。
- source_word: וַיִּתְקָעֶהָ
  choice: 刺进
  rationale: 该动词表达用力刺入、扎入；“刺进”简洁而有力度。
- source_word: בְּבִטְנוֹ
  choice: 王的腹部
  rationale: בֶּטֶן指腹部、肚腹。汉语若只说“他的”会与最近的以笏产生代词歧义，因此依上下文明确为“王”，不增添身份之外的信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。用“就”承接连续动作；不加脚注，因为原文词义可在正文中直接表达。为避免汉语代词误指，将原文“他的腹部”按明确的上下文所指译作“王的腹部”。
