base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: zh_hans
  text: 他到了那里，就在以法莲山区吹响号角；以色列人同他一起从山区下来，他走在他们前面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: 他到了那里，就
  rationale: 该结构引出时间推进；结合上文，以自然汉语表达为“他到了那里，就”，既保留叙事次序，也不生硬复现“事情发生了”。
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: 吹响号角
  rationale: שׁוֹפָר指用于发出信号的角制号器；“号角”在现代汉语中自然，也清楚传达此处召集作战的信号功能，而不必限定为“羊角号”。
- source_word: בְּהַר אֶפְרָיִם
  choice: 在以法莲山区
  rationale: 地理表达中的הַר指以法莲的山地地区，而非一座孤立山峰；“以法莲山区”准确且简洁。
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: 以色列人同他一起……下来
  rationale: בְנֵי יִשְׂרָאֵל是希伯来语对以色列群体的常用称呼；现代汉语用“以色列人”最自然，并不额外断定队伍是否仅由男性构成。
- source_word: מִן הָהָר
  choice: 从山区
  rationale: 该短语回指前述以法莲山区；保留其集合性的地貌含义，同时避免误解为从单独一座山下来。
- source_word: וְהוּא לִפְנֵיהֶם
  choice: 他走在他们前面
  rationale: לִפְנֵיהֶם字面表示“在他们前面”。“走在他们前面”在移动场景中自然地保留位置关系及隐含的带领作用，而不将其明确强化为“率领”。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל的群体与性别表达
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 此固定表达在叙事中指以色列群体。汉语“以色列人”准确、自然，并保留原文未明确说明参与者性别范围的空间；译作“众子”会使现代读者过度聚焦生理性别。
- issue: וְהוּא לִפְנֵיהֶם所含的领导意味
  choice: 他走在他们前面
  alternative: 他率领他们
  rationale: 原文直接陈述的是相对位置，领导作用由语境暗示。主译不把暗示提升为明确的“率领”，从而保留原文的含蓄。
translation_notes:
  register: 采用现代、庄重而清晰的叙事汉语。“吹响号角”体现军事召集场景；两个“山区”忠实呈现原文前后照应，虽有重复，但在中文中自然且有助于保持地理连贯性。
