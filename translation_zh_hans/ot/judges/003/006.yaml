base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: zh_hans
  text: 他们娶那些人的女儿为妻，又把自己的女儿嫁给那些人的儿子，并事奉[a]那些人的神明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事奉”或译“敬拜”。
    reason: עבד用于神祇时兼有服事与敬拜之意，两种译法都有词义依据。
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת־בְּנוֹתֵיהֶם לָהֶם לְנָשִׁים
  choice: 他们娶那些人的女儿为妻
  rationale: לקח本义为“取”，在“取女子为妻”的婚姻语境中，用现代汉语“娶……为妻”自然、准确；“那些人”承接上文列出的当地各族。
- source_word: וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: 又把自己的女儿嫁给那些人的儿子
  rationale: נתן本义为“给”，此处在相互通婚的语境中指把女儿给对方的儿子为妻；汉语用“嫁给”清楚表达该关系。“自己的”与“那些人的”按上下文呈现双方互婚，同时避免连续代词造成误读。
- source_word: וַיַּעַבְדוּ
  choice: 并事奉
  rationale: עבד用于神祇时可指服事、崇拜。译作“事奉”保留宗教敬拜与效忠的较宽含义。
- source_word: אֱלֹהֵיהֶם
  choice: 那些人的神明
  rationale: 该词指周围各族所信奉的神祇；“神明”在现代汉语中自然地指异教神祇，也不把复数含义误解为以色列的神。
theological_decisions:
- issue: עבד用于异族神祇时所表达的宗教关系
  choice: 事奉那些人的神明
  alternative: 敬拜那些人的神明
  rationale: “事奉”既包含敬拜行为，也保留服从和效忠的盟约性含义，不把原词范围缩窄为礼仪行动。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“娶……为妻”和“嫁给……”自然呈现互相通婚；“事奉”沿用读者熟悉的圣经语体，但整体句式保持现代易懂。
