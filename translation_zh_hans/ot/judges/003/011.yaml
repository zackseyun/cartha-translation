  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: zh_hans
  text: 于是，那地安享太平四十年。基纳斯的儿子俄陀聂死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: 安享太平
  rationale: שׁקט表示安静、不受搅扰或得享安宁；在《士师记》的拯救叙事中，指脱离压迫后的一段太平时期。“安享太平”符合现代汉语表达，又不把含义扩展为全面繁荣。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 此处指以色列人所在的土地，而非整个世界；“那地”既保留定冠词和语境指向，也符合圣经叙事的自然汉语。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 该短语作时长宾语，说明太平延续的时间；汉语直接置于谓语之后即可清楚表达持续时长。
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该动词陈述俄陀聂死亡；叙事推进关系由后一句的次序自然体现，无须机械译出连接词。
- source_word: עָתְנִיאֵל
  choice: 俄陀聂
  rationale: 采用现代简体中文圣经中通行的人名音译，便于读者辨识。
- source_word: בֶּן קְנַז
  choice: 基纳斯的儿子
  rationale: 该组合结构以父系关系说明俄陀聂的身份；“基纳斯的儿子”是清楚自然的现代汉语表达。
