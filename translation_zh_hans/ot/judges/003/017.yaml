  yaml_path: translation/ot/judges/003/017.yaml
  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: zh_hans
  text: 他把贡物献给摩押王伊矶伦[a]。伊矶伦是个非常肥胖的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼物”或“礼品”。希伯来语“明哈”可指供物或礼物，但这里很可能是受辖制的民族向统治者缴纳的贡物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: 献给
  rationale: 该词为קרב的使役式，在此指把物品带到君王面前呈献。“献给”自然表达向上位者正式交付之意，又与宾语“贡物”搭配恰当。
- source_word: הַמִּנְחָה
  choice: 贡物
  rationale: מִנְחָה可指礼物、供物或礼品；本段处于以色列受摩押辖制、向其君王交付财物的政治背景中，因此译作“贡物”最能体现臣服关系，同时用脚注保留其他词义。
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: 给摩押王伊矶伦
  rationale: 依现代汉语习惯将王号置于人名前，准确表达同位关系；专名采用通行圣经译名“伊矶伦”。
- source_word: וְעֶגְלוֹן
  choice: 伊矶伦
  rationale: 希伯来语连接词在此引出关于伊矶伦的补充说明；汉语另起一句即可自然体现这一话语功能，不必机械译出“而”。
- source_word: אִישׁ
  choice: 人
  rationale: 这里特指男性伊矶伦，但现代汉语用“人”构成“是个……的人”最自然，并未模糊其身份。
- source_word: בָּרִיא
  choice: 肥胖
  rationale: 该形容词在此描述身体肥硕，且为后续叙事细节作铺垫。“肥胖”直接、清楚，较“壮实”更准确，较“肥硕”更符合普通现代读者的语言。
- source_word: מְאֹד
  choice: 非常
  rationale: 自然对应希伯来语的强度副词，完整传达程度。
