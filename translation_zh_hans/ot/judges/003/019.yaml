  text: וְ/ה֣וּא שָׁ֗ב מִן הַ/פְּסִילִים֙ אֲשֶׁ֣ר אֶת הַ/גִּלְגָּ֔ל וַ/יֹּ֕אמֶר דְּבַר סֵ֥תֶר לִ֛/י אֵלֶ֖י/ךָ הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר הָ֔ס וַ/יֵּֽצְאוּ֙ מֵֽ/עָלָ֔י/ו כָּל הָ/עֹמְדִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: zh_hans
  text: 他却从吉甲附近的雕像那里返回[a][b]，说：“王啊，我有一件隐秘的事要告诉你[c]。”王说：“安静！”于是，侍立在他身边的人都从他面前退了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雕像”或译“偶像”。希伯来语这个词常指用于祭祀的雕刻偶像。
    reason: lexical_alternative
  - marker: b
    text: “吉甲附近”或译“在吉甲”。原文的地点表达较为简略，可表示邻近或位于吉甲。
    reason: lexical_alternative
  - marker: c
    text: “一件隐秘的事”或译“一句秘密的话”或“一个秘密消息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: 返回
  rationale: 该动词表示回转或返回；这里指以笏在离去之后改变方向，回到王那里。
- source_word: הַפְּסִילִים
  choice: 雕像
  rationale: 该词具体指雕刻而成的像，且常有祭祀偶像的含义；正文保留具体形象，脚注说明“偶像”这一可能译法。
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: 吉甲附近的
  rationale: 原文地点表达简略，可表示在吉甲或吉甲附近；正文采用自然的地点表达，同时以脚注保留另一理解。
- source_word: דְּבַר סֵתֶר
  choice: 一件隐秘的事
  rationale: דָּבָר 可指话、信息或事情，סֵתֶר 表示隐秘；此译法不限定它究竟是一句话、消息还是私下事务。
- source_word: לִי אֵלֶיךָ
  choice: 我有……要告诉你
  rationale: 原文直译近似“我有……给你”，中文按语境自然处理为有一件事要告诉对方。
- source_word: הַמֶּלֶךְ
  choice: 王啊
  rationale: 此处是直接呼语；“王啊”保留正式而恭敬的称呼。
- source_word: הָס
  choice: 安静
  rationale: 这是简短突兀的禁声命令；“安静”既可理解为命人不要出声，也符合随后侍从退下的场景。
- source_word: כָּל־הָעֹמְדִים עָלָיו
  choice: 侍立在他身边的人
  rationale: 字面为站在他旁边的人，在宫廷语境中指在王身边侍候的人；“侍立”兼顾姿态与身份。
- source_word: מֵעָלָיו
  choice: 从他面前退了出去
  rationale: 原文表示从王身旁或面前离开；此译法自然传达侍从退出王面前的情景。
theological_decisions: []
