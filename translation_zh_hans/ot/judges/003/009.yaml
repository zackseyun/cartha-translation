  to: 以色列人向雅威呼求，雅威就为以色列人兴起一位拯救者[a]。他救了他们；这位拯救者是俄陀聂，基纳斯的儿子，迦勒的弟弟[b]。
  rationale: 修订不改变原文的叙事次序或意义：雅威兴起拯救者，俄陀聂救了以色列人。以“这位拯救者是”取代较口语的“这人就是”，并删除汉语中重复的年龄说明；通过脚注保留希伯来语亲属限定语可能修饰基纳斯的争议性分析。
