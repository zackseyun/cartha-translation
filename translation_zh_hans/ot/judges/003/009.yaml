source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: zh_hans
  text: 以色列人向雅威呼求，雅威就为以色列人兴起一位拯救者[a]。他救了他们；这位拯救者是俄陀聂，基纳斯的儿子，迦勒的弟弟[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救者”也可译作“解救者”或“救援者”。这里指雅威兴起、用来解救以色列人的人。
    reason: 说明该词在本节指雅威所兴起的人间施救者，并保留可行的词义选择。
  - marker: b
    text: 也可理解为：“俄陀聂，基纳斯的儿子；基纳斯是迦勒的弟弟，比迦勒年轻。”希伯来语中“迦勒的弟弟、比他年轻”这一限定语的归属存在句法上的歧义。
    reason: 保留亲属关系短语在句法上的真实歧义，同时明确争议所涉及的限定语归属。
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: 呼求
  rationale: 该动词在此表示人在困苦中向神急切求助；“呼求”既自然，也保留了恳切求救的意味。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”；现代汉语用“以色列人”自然涵盖这里的全体民众。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为神专名的性质，不以称号替代。
- source_word: וַיָּקֶם
  choice: 兴起
  rationale: 使役词形表示雅威使某人起来承担拯救使命；“兴起”符合士师记的叙事语境。
- source_word: מוֹשִׁיעַ
  choice: 拯救者
  rationale: 该词指施行解救的人；本节明确指神所兴起的人间拯救者。
- source_word: וַיּוֹשִׁיעֵם
  choice: 他救了他们
  rationale: 与“拯救者”保持词义呼应，并表达从压迫中得到实际解救。
- source_word: עָתְנִיאֵל בֶּן קְנַז
  choice: 基纳斯的儿子俄陀聂
  rationale: 按现代汉语亲属表达方式呈现人名与父子关系。
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: 是迦勒的弟弟，比迦勒年幼
  rationale: 主文采用最常见的句法理解，并将比较关系明确表达出来；同时以脚注保留另一种可能的结构分析。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，故以“雅威”音译，避免用一般称号取代专名。
- issue: מוֹשִׁיעַ 在本节所指的身份
  choice: 拯救者
  alternative: 救主；解救者
  rationale: 士师记的语境指雅威兴起的人间施救者；“拯救者”保留救援语义，也不把后来的神学含义强加于本节。
- issue: וַיּוֹשִׁיעֵם 的主语
  choice: 紧接“拯救者”，译作“他救了他们”
  alternative: 理解为雅威救了他们
  rationale: 希伯来语连续叙事在形式上可让读者短暂感到主语张力，但随后点名俄陀聂，最自然地将施救行动落实于雅威所兴起的拯救者；译文仍保留雅威是兴起他的那一位。
- issue: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ 的关系归属
  choice: 俄陀聂是迦勒的弟弟，比迦勒年幼
  alternative: 基纳斯是迦勒的弟弟，比迦勒年幼
  rationale: 主文采用较自然且传统的同位语连接，但希伯来语名词串在形式上容许另一种关系归属，因此不静默消除这一歧义，而在脚注中说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“呼求”“兴起”“拯救者”保留士师记反复出现的神学与叙事用语；用分号引出俄陀聂的身份，使希伯来语后置点名的结构在汉语中清楚自然。
