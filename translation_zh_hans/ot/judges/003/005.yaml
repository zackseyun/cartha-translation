  yaml_path: translation/ot/judges/003/005.yaml
  text: And the sons of Israel lived among the Canaanites[a], the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites.
translation:
  language: zh_hans
  text: 以色列人住在迦南人、赫人、亚摩利人、比利洗人、希未人和耶布斯人中间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，但在这里是指以色列全体人民；现代汉语用“以色列人”自然、准确，也不致误解为仅指男性。句首的 וּ 按上下文承接，不必机械译作“并且”。
- source_word: יָשְׁבוּ
  choice: 住
  rationale: ישׁב 在此表示持续居住；“住”是简明自然的现代汉语，比“居住”略为平易，也不像“定居”那样突出开始安顿的动作。
- source_word: בְּקֶרֶב
  choice: 在……中间
  rationale: 该短语表示身处这些族群之中并与他们杂居；“在……中间”既保留空间和群体关系，也符合现代汉语表达。
- source_word: הַכְּנַעֲנִי הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: 迦南人、赫人、亚摩利人、比利洗人、希未人和耶布斯人
  rationale: 这些希伯来语族名虽为单数形式，却作集合名词使用；汉语统一译为各族群的通行名称。原文首两项之间没有连接词，其后各项有连接词；汉语按自然列举方式处理，以顿号连接并在末项前用“和”。
