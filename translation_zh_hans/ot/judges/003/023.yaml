  yaml_path: translation/ot/judges/003/023.yaml
  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: zh_hans
  text: 以笏出来，到了门厅[a]，把楼上房间的门在身后关好，锁上了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“门廊”“前室”或“柱廊”；此处的希伯来语词很少见，指与房间相连的一处建筑空间。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出来
  rationale: יצא的Qal叙事形式表示从某处出去；结合以笏离开楼上房间的场景，“出来”自然明确。
- source_word: הַמִּסְדְּרוֹנָה
  choice: 到了门厅
  rationale: מִסְדְּרוֹן是罕见的建筑术语，且带方向词尾־ָה，表示进入或朝向与房间相连的空间。“门厅”符合现代汉语，同时不把具体结构界定得过细；其他可能含义列入脚注。
- source_word: וַיִּסְגֹּר
  choice: 关好
  rationale: סגר意为关闭；“关好”在此自然地表达以笏离开后将门关住，并与随后“锁上”衔接。
- source_word: דַּלְתוֹת
  choice: 门
  rationale: 原文为复数，可指双扇门或门板；现代汉语通常统称为“门”，不必机械译出复数。
- source_word: הָעֲלִיָּה
  choice: 楼上房间
  rationale: עֲלִיָּה指建筑上层的房间；“楼上房间”清楚、自然，也保留其空间位置。
- source_word: בַּעֲדוֹ
  choice: 在身后
  rationale: בעד与关闭门窗的动词连用时表示空间关系，即以笏出去后把门关在自己身后。
- source_word: וְנָעָל
  choice: 锁上了
  rationale: נעל在此表示把门闩住或锁住；“锁上”是现代汉语中不限定具体锁闭装置的自然说法。
