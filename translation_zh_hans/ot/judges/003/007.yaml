  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: zh_hans
  text: 以色列人[a]行了雅威眼中看为恶的事[b]；他们忘记了雅威他们的上帝，事奉众巴力和众亚舍拉[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”，即以色列人。
    reason: lexical_alternative
  - marker: b
    text: “雅威眼中看为恶”是希伯来语惯用表达，指雅威判定为恶。
    reason: lexical_alternative
  - marker: c
    text: “众亚舍拉”也可译为“亚舍拉柱”。此处希伯来语可能指与亚舍拉有关的祭祀物，也可能较广泛地指亚舍拉崇拜。
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，在这里是对以色列全体民众的惯用称呼；正文采用自然、通行的现代汉语表达，并在脚注保留原文形式。
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为恶的事
  rationale: 保留希伯来语“在……眼中”的评价性惯用语，同时用“看为恶的事”自然表达带宾语标记的 הָרַע。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以头衔替代。
- source_word: וַיִּשְׁכְּחוּ
  choice: 忘记了
  rationale: 采用 שׁכח 的基本义；上下文可使读者看出这不只是记忆上的遗忘，也包含实际上的背弃，无需在正文中替文本作进一步解释。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 该词以雅威为所指，故按单数理解；破折号标明它是对“雅威”的同位说明。
- source_word: וַיַּעַבְדוּ
  choice: 事奉
  rationale: עבד 在宗教语境中兼有服事、敬拜之意；“事奉”既适合祭祀语境，又未把含义缩限为单一礼仪动作。
- source_word: הַבְּעָלִים
  choice: 众巴力
  rationale: “众”体现希伯来语复数，可能指不同地方所崇奉的巴力形态或相关神像，避免将复数抹平。
- source_word: הָאֲשֵׁרוֹת
  choice: 众亚舍拉
  rationale: 采用音译并以“众”保留复数，不在正文中武断限定为女神、木柱或其他崇拜物；具体歧义由脚注说明。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较直接地音译通常重构的读音，并避免用“主”等头衔取代专名。
- issue: הָאֲשֵׁרוֹת 指女神形态还是祭祀物
  choice: 众亚舍拉
  alternative: 亚舍拉柱
  rationale: 希伯来语复数可涉及亚舍拉的地方性表现，也可能指与其崇拜有关的木柱、树木或其他祭祀物；正文保留这一真实歧义，脚注列出较具体的可能理解。
- issue: “忘记雅威”的盟约含义
  choice: 忘记了
  alternative: 背弃了
  rationale: 语境确有背弃和不忠的意味，但原词首先是“忘记”；保留直陈措辞，让其神学分量从叙事上下文显现。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“以色列人”代替生硬的“以色列众子”，用“事奉”保持宗教语境；以破折号清楚标示“他们的上帝”与“雅威”的同位关系。三个脚注标记均置于正文相应词语之后。
