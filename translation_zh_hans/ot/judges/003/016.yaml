base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: zh_hans
  text: 以笏为自己造了一把双刃剑[a]，长一肘[b]。他把剑佩在衣服里面的右大腿上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“一把剑，它有两个口。”这里“两个口”指两面都有刃。
    reason: lexical_alternative
  - marker: b
    text: 原文所用的长度单位“歌篾”（גֹּמֶד）十分罕见，确切长度不详，通常认为约等于一肘，即一前臂的长度。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: 为自己造了
  rationale: 介词短语“לוֹ”表明以笏造剑是供自己使用；“为自己造了”自然保留这一含义。
- source_word: חֶרֶב
  choice: 剑
  rationale: חֶרֶב是泛指剑的常用词。虽然这里的兵器较短，可能近似匕首，但译作“剑”不把上下文推断写入正文。
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: 双刃剑
  rationale: 原文直译为“它有两个口”，是指刀身两面开刃；“双刃剑”是现代汉语中准确自然的表达。
- source_word: גֹּמֶד אָרְכָּהּ
  choice: 长一肘
  rationale: גֹּמֶד是仅见于此处的罕见长度单位，通常理解为约一前臂长。正文用读者较熟悉的“一肘”，并以脚注说明其不确定性。
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: 把剑系在
  rationale: חגר表示把兵器束上或佩上；“系在”保留固定在身体上的动作，又符合现代汉语。
- source_word: מִתַּחַת לְמַדָּיו
  choice: 衣服下面
  rationale: מַד在这里指衣物或外衣；译作“衣服下面”不额外限定服装样式。
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: 贴着右大腿
  rationale: יָרֵךְ指大腿或髋部。“贴着右大腿”清楚表达剑佩放的位置，并与“系在”搭配自然。
theological_decisions: []
