revisions:
- from: 以色列人就向雅威呼求，雅威为他们兴起一位拯救者，就是便雅悯人基拉的儿子以笏；他是一个右手受限制的人。[a] 以色列人托他把贡物送给摩押王伊矶伦。
  to: 以色列人向雅威呼求，雅威就为他们兴起一位拯救者：基拉的儿子以笏，是便雅悯人，是个右手受限制的人[a]。以色列人托他把贡物送给摩押王伊矶伦。
  rationale: 调整以笏、基拉与便雅悯人之间的句法关系，使支派身份在现代汉语中明确归于以笏；同时简化脚注，保留传统“左撇子”译法而不把原文未明说的身体状况解释为确定事实。其余译法与原文及英语审计轨迹相符。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:13Z'
review_pass:
