language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: zh_hans
  text: 以色列人向雅威呼求，雅威就为他们兴起一位拯救者：基拉的儿子以笏，是便雅悯人，是个右手受限制的人[a]。以色列人托他把贡物送给摩押王伊矶伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上常译作“左撇子”。希伯来语的措辞是“右手受限制的人”，其具体所指不确定。
    reason: 保留 אִטֵּר יַד יְמִינוֹ 的字面措辞、传统理解及原文歧义。
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: 呼求
  rationale: 该词表示人在困苦中发出的迫切呼喊或求助；“呼求”既自然，也不把原文隐含而未明说的“求救”扩写出来。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语通常以“以色列人”自然、准确地表达这一希伯来语群体称谓；直译“以色列的儿子们”在此容易显得生硬并引发误解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: 为他们兴起一位拯救者
  rationale: “兴起”保留上帝设立并使用士师的叙事惯用语；“拯救者”在本节指施行历史性解救的人。
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: 基拉的儿子以笏
  rationale: 按现代中文圣经人名惯例音译，并以自然汉语次序表达父子关系。
- source_word: בֶּן הַיְמִינִי
  choice: 便雅悯人
  rationale: 该表达在语境中是支派归属称谓，译作“便雅悯人”最清楚自然。
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: 一个右手受限制的人
  rationale: 希伯来语并未直接说“左撇子”，而是以不寻常的方式描述其右手受到限制；正文保留这种措辞及其可能的含义张力。
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: 托他把……送给
  rationale: בְיָדוֹ在此表示借以笏之手办理，即由他携带和递送；“托他……送给”是自然且准确的现代汉语表达。
- source_word: מִנְחָה
  choice: 贡物
  rationale: 在摩押王统治以色列的政治语境中，该词指臣服者缴纳给统治者的贡物，而非一般礼物或祭物。
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: 给摩押王伊矶伦
  rationale: 按自然汉语语序呈现王号、地域和人名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以传统音译或称号代替。
- issue: מוֹשִׁיעַ 在此处的含义
  choice: 拯救者
  alternative: 救主；解救者
  rationale: 此词在本段首先指上帝兴起、施行历史性解救的人；“拯救者”既保留神学词汇联系，也不将以笏等同于终极意义上的“救主”。
- issue: 以笏右手状况的理解
  choice: 右手受限制
  alternative: 左撇子
  rationale: 原文的字面表达指右手受限制，但传统上常理解为惯用左手。正文保留原文歧义，脚注交代常见解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“兴起一位拯救者”保留《士师记》的叙事用语；后半句将希伯来语“藉他的手”自然化为“托他……送给”，避免僵硬直译。
