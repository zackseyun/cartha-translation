  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה֮ וַ/יִּשְׁפֹּ֣ט אֶת יִשְׂרָאֵל֒ וַ/יֵּצֵא֙ לַ/מִּלְחָמָ֔ה וַ/יִּתֵּ֤ן יְהוָה֙ בְּ/יָד֔/וֹ אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם מֶ֣לֶךְ אֲרָ֑ם וַ/תָּ֣עָז יָד֔/וֹ עַ֖ל כּוּשַׁ֥ן רִשְׁעָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: zh_hans
  text: 耶和华的灵临到他[a]，他就治理以色列。他出去争战，耶和华把亚兰王[b]古珊·利萨田交在他手中；他就胜过了古珊·利萨田。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华的灵在他身上。”希伯来语也可表达较为静态的临在，但这里的叙事语境较支持“临到他”。
    reason: lexical_alternative
  - marker: b
    text: “亚兰”是希伯来语地名；较早的译本常译为“叙利亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה
  choice: 耶和华的灵临到他
  rationale: “היה על”与“灵”连用，可表达神的灵临到或在某人身上，使其得着能力。叙事在此转入俄陀聂履行使命，因此译作“临到”较自然；静态含义则保留在脚注中。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式“耶和华”，明确保留专名，而不以“主”这一称号替代。
- source_word: וַ/יִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: 他就治理以色列
  rationale: 在《士师记》中，שׁפט所指不限于司法审判，也包括士师对以色列的领导和治理。中文“审判以色列”容易被误解为定罪，故以“治理”传达语境中的职能。
- source_word: וַ/יֵּצֵא לַ/מִּלְחָמָה
  choice: 他出去争战
  rationale: 这是常见的军事表达；“出去争战”自然、简洁，并保留行动进入战事的叙事推进。
- source_word: וַ/יִּתֵּן יְהוָה בְּ/יָד/וֹ
  choice: 耶和华把……交在他手中
  rationale: 保留希伯来文“交在手中”的形象，同时现代中文读者能够理解其意为使敌人落入他的权下。
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: 古珊·利萨田
  rationale: 按专名音译，并以间隔号标示复合名称，采用中文圣经传统中较为人熟悉的形式。
- source_word: מֶ֣לֶךְ אֲרָם
  choice: 亚兰王
  rationale: אֲרָם直接译作古代地名“亚兰”，避免以较晚的地域名称“叙利亚”替代原文。
- source_word: וַ/תָּ֣עָז יָד/וֹ עַל
  choice: 他的手胜过了
  rationale: 保留“手”所代表的力量和权势这一希伯来语意象，同时用“胜过”清楚表达占据优势并制伏敌人的结果。
theological_decisions:
- issue: 耶和华之灵临在的动态或静态表达
  choice: 耶和华的灵临到他
  alternative: 耶和华的灵在他身上
  rationale: 原文可作较静态的“在他身上”，也可在叙事语境中理解为“临到他”。正文采用符合事件起始和赋能语境的动态表达，但以脚注保存原文的另一种真实可能。
- issue: 士师职分中שׁפט的表达
  choice: 治理以色列
  alternative: 审判以色列；作以色列的士师
  rationale: 该动词保有“施行判断”的词义，但在本书语境中包含领导、治理和拯救的职能。“治理”避免让读者误以为以色列在此是受审定罪的对象，也不额外加入原文未明说的职衔。
- issue: 神在胜利中的主体作用
  choice: 耶和华把亚兰王……交在他手中
  alternative: 他战胜了亚兰王……
  rationale: 保留原文明确的神学重心：胜利首先是耶和华交付敌人的结果，而不只是俄陀聂自身军事能力的成就。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留“交在他手中”和“他的手胜过了”这两个相互呼应的希伯来语手之意象；地名用“亚兰”，不作“叙利亚”。
