  naturalness: “他的手胜过了古珊·利萨田”不符合自然现代汉语搭配。改作“他就胜过了古珊·利萨田”庄重、简洁，也与前面的“交在他手中”形成足够的语义呼应。
  terminology: “耶和华”“亚兰”“古珊·利萨田”均恰当。“治理以色列”在《士师记》的语境中能自然表达שׁפט所含的领导、施政职能，未将其狭窄化为司法定罪。补入与英文审校记录相对应的亚兰说明脚注。
