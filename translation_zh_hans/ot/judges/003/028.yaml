source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: zh_hans
  text: 他对他们说：“跟我追击！”[a]因为雅威已经把你们的仇敌，就是摩押，交在你们手中了。[b]他们就跟着他下去，夺取了约旦河通往摩押的渡口[c]，不让任何人过河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“跟随我”。
    reason: lexical_alternative
  - marker: b
    text: 原文“你们的仇敌，就是摩押”中，“摩押”与“你们的仇敌”是同位关系。
    reason: source_structure
  - marker: c
    text: 也可译作“约旦河朝向摩押的渡口”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: 跟我追赶
  rationale: רָדַף通常表示“追赶、追击”；这里是以笏召集同伴展开军事行动。“跟我追赶”既保留追击意味，也表达众人随他行动。
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: 已经把……交在你们手中了
  rationale: 这是“交在某人权下”的惯用语；译文保留“手”的希伯来意象，并以“已经”表现完成态所传达的确信。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按יהוה的通行学术拟音 Yahweh 音译为“雅威”，保留经文中的神名，而不以称号替代。
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: 你们的仇敌，就是摩押
  rationale: “摩押”与“你们的仇敌”构成同位关系；用“就是”明确这种关系，同时保留原文以国名作为集体实体的表达。
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: 他们就跟着他下去
  rationale: יָרַד意为“下去”；此处也符合从山地前往约旦河谷的地理方向，因此不简化为单纯的“跟随”。
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: 约旦河……的渡口
  rationale: מַעְבָּרוֹת指可供过河的地点；现代汉语用“渡口”自然、准确，也符合军事控制交通要道的语境。
- source_word: לְמוֹאָב
  choice: 通往摩押
  rationale: 介词לְ可表示朝向或关联；正文采用合乎地理语境的方向性译法，同时以脚注保留“针对摩押”的可能理解。
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: 不让任何人过河
  rationale: 原文直译近于“不容一人过去”；“不让任何人过河”以自然现代汉语表达全面禁止通行的意思。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”对应 Yahweh 的拟音，避免把专名改成称号，也不采用源于较晚元音组合的“耶和华”。
- issue: 摩押作为集体国名
  choice: 你们的仇敌，就是摩押
  alternative: 你们的仇敌摩押人
  rationale: 原文使用国名מוֹאָב，并未使用“摩押人”的族称；正文保留国名的集体人格化，同时用“就是”使同位结构在汉语中清楚自然。
- issue: לְמוֹאָב的关系
  choice: 通往摩押
  alternative: 针对摩押
  rationale: 介词短语既可能标示方向，也可能在军事语境中表示与摩押有关或针对摩押。正文采用方向性理解，脚注保留另一可能，不将歧义静默消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙事连接简洁有力；军事用语“追赶、占据、渡口”通俗明确。保留“交在手中”的圣经意象，并通过脚注说明原文中真实存在的词义和句法歧义。
