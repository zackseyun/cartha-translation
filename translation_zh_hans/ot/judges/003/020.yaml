revisions:
- from: 以笏来到他那里；当时，他正独自坐在自己那间凉爽的楼上房间里[a]。以笏说：“我有神的话要告诉你[b]。”他就从座位上站了起来[c]。
  to: 以笏来到他那里；当时，他正坐在那间专供他自己使用的凉爽楼上房间里[a]。以笏说：“我有神的话要告诉你[b]。”他就从座位上站了起来[c]。
  rationale: 将“独自坐在自己那间”改为“坐在那间专供他自己使用的”，使中文准确反映原文关系从句对房间私人专用性质的限定。其余译文和脚注锚点均可保留，且不需要改变经文含义。
