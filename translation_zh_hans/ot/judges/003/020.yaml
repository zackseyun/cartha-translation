    reason: lexical_alternative
  - marker: b
    text: 或译“我有神的信息要告诉你”。
    reason: lexical_alternative
  - marker: c
    text: 直译“从座位上”；这里的词也可指“椅子”或“宝座”。
    reason: lexical_alternative
