base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: zh_hans
  text: 以笏来到他那里；当时，他正坐在那间专供他自己使用的凉爽楼上房间里[a]。以笏说：“我有神的话要告诉你[b]。”他就从座位上站了起来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凉爽的屋顶房间”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我有神的信息要告诉你”。
    reason: lexical_alternative
  - marker: c
    text: 直译“从座位上”；这里的词也可指“椅子”或“宝座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: 来到
  rationale: 该动词表示以笏来到伊矶伦所在之处；“来到”自然简洁，不额外限定他进入或接近的方式。
- source_word: יֹשֵׁב
  choice: 正……坐着
  rationale: 分词在这里提供持续的背景状态；“正……坐着”符合现代汉语的叙事表达。
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: 凉爽的楼上房间
  rationale: עֲלִיָּה指楼上的房间或屋顶房间，הַמְּקֵרָה大概表明此处凉爽或通风；译文保留楼上位置和凉爽特点，同时避免把具体建筑结构说得过死。
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: 自己那间……独自
  rationale: 原文既有房间归他私人使用的意味，也强调他当时独处；用“自己那间”和“独自”一并体现。
- source_word: דְּבַר אֱלֹהִים
  choice: 神的话
  rationale: 该组合可指来自神的一句话或信息；“神的话”较贴近希伯来文，同时脚注保留“神的信息”这一自然理解。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 尽管形式上为复数，该词在此短语和语境中最自然地作单数理解。
- source_word: וַיָּקָם
  choice: 站了起来
  rationale: 准确表达从坐姿起身的动作，也比单译“起来”更清楚。
- source_word: מֵעַל הַכִּסֵּא
  choice: 从座位上
  rationale: כִּסֵּא可指座位、椅子或宝座；私人楼房的场景中，“座位”最不预设具体家具或正式王权场景。
theological_decisions:
- issue: 以笏所说 אֱלֹהִים 应译为单数“神”还是复数“诸神”
  choice: 神
  alternative: 诸神
  rationale: אֱלֹהִים虽具有复数词形，却常用于单数的神；在 דְּבַר אֱלֹהִים 这一结构和本段语境中，单数最自然。译文只如实转述以笏的话，不判断这句话的策略或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“当时，他正……”呈现希伯来文分词的背景作用；“自己那间”与“独自”保留私人空间的强调。脚注按其实际所指重新对应正文：楼上房间[a]、神的话[b]、座位[c]。
