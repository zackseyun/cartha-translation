  text: וְ/אֵה֥וּד נִמְלַ֖ט עַ֣ד הִֽתְמַהְמְהָ֑/ם וְ/הוּא֙ עָבַ֣ר אֶת הַ/פְּסִילִ֔ים וַ/יִּמָּלֵ֖ט הַ/שְּׂעִירָֽתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: zh_hans
  text: 他们还在耽搁的时候，以笏已经逃走了。他经过那些雕像[a]，逃到了西伊拉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雕像”也可译作“偶像”或“雕刻的像”。
    reason: lexical_alternative
  - marker: b
    text: “西伊拉”为地名音译，也可音译作“西伊拉特”。
    reason: alternative_transliteration
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: 逃走了／逃到了
  rationale: 两处尼法勒形态都表示成功脱险。中文保留“逃”这一词根的重复，同时按各自宾语和语境自然表达：前者为“逃走”，后者为“逃到”。
- source_word: עַד הִתְמַהְמְהָם
  choice: 他们还在耽搁的时候
  rationale: עַד 加不定式结构在这里表示以笏逃走所利用的时段；התמהמה 表示迟延、耽搁。此译法既承接仆人们此前的犹豫，也符合现代汉语叙事。
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: 经过那些雕像
  rationale: עבר 带直接宾语，在行程语境中表示经过或越过某处；“经过”自然且不额外断定具体路线。“那些”表明这是上下文已知的地标。
- source_word: הַפְּסִילִים
  choice: 那些雕像
  rationale: פסילים 指雕刻而成的像，往往具有偶像性质。“雕像”保留其具体词义，同时不把其宗教性质解释得超过原文；脚注列出“偶像”和“雕刻的像”。
- source_word: הַשְּׂעִירָתָה
  choice: 西伊拉
  rationale: 将地名 שְׂעִירָה 音译为现代汉语可读形式；词尾 ה 表示趋向此地，不属于地名本身。
- source_word: וְאֵהוּד
  choice: 以笏已经
  rationale: 连接词在上下文中带有转折效果；汉语以时间从句和“已经”自然呈现仆人仍耽搁、以笏却已脱身的对比，无须机械译为“但是”或“于是”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代叙事语体。首句通过“还在……的时候／已经……”呈现原文的时间关系和鲜明对比；末句保留同一“逃”字，反映希伯来文动词的重复。所有脚注标记均置于正文相应词语之后。
