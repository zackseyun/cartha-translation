base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: zh_hans
  text: 他出去以后，王的臣仆来了，看见楼上的房门都锁着，就说：“他一定是在凉爽的内室里解手[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“遮盖他的脚”，是希伯来语表示解手的委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: 他出去以后
  rationale: 该分句回指以笏离开，并交代臣仆来到时的背景；用“以后”自然表达希伯来叙事中的时间关系。
- source_word: עֲבָדָיו
  choice: 王的臣仆
  rationale: 原文直译为“他的仆人”；语境中的所指是王室侍从。“臣仆”既符合王宫场景，也不额外断定其法律身份；补出“王的”使现代汉语指代清楚。
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: 看见……
  rationale: וְהִנֵּה带有突然注意到的叙事效果；汉语以“看见”直接引出他们所发现的情形，简洁自然。
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: 楼上的房门
  rationale: עֲלִיָּה指上层房间或楼房；“楼上的房门”在现代汉语中自然，并保留建筑位置。
- source_word: נְעֻלוֹת
  choice: 都锁着
  rationale: 该被动分词表示门处于锁上或闩住的状态；“锁着”清楚表达持续状态，“都”对应复数房门。
- source_word: אַךְ
  choice: 一定
  rationale: 此处引出臣仆根据门锁着而作出的确信或推断；“一定”自然传达其语气。
- source_word: מֵסִיךְ הוּא אֶת רַגְלָיו
  choice: 他……在解手
  rationale: 该希伯来委婉语字面为“遮盖他的脚”，在本语境中指排便。“解手”是现代汉语中清楚而不过分直露的对应表达，并以脚注保留原文形象。
- source_word: בַחֲדַר הַמְּקֵרָה
  choice: 在凉爽的内室里
  rationale: חֲדַר表示内室或私室，הַמְּקֵרָה与凉爽相关；此译保留空间的私密性和凉爽特征，不将具体建筑结构说得过死。
