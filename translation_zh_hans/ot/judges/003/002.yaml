  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: zh_hans
  text: 这只是为了使以色列子孙的后代[b]知道战争[a]，好教导那些从前未曾知道战争的人作战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “知道战争”也可理解为“经历过战争”。
    reason: alternative_reading
  - marker: b
    text: “以色列子孙”即“以色列人”；这里是群体称谓，并非只指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 两次出现的限制性语气均予保留；句首译作“这只是为了”，后半句译作“只是那些”，不抹平原文的重复。
- source_word: לְמַעַן
  choice: 为了让
  rationale: 自然表达目的含义，并与后面的不定式“认识”衔接。
- source_word: דַּעַת
  choice: 认识
  rationale: 保留ידע“知道、认识”的基本语义，不预先限定为亲身经历或军事训练。
- source_word: דֹּרוֹת בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙的各代
  rationale: 保留“各代”及其与“以色列子孙”的属格关系；“未来”虽由上下文暗示，却未明说，故不添入正文。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 这是指以色列整体的惯用族群称谓；译文保留原文形式，同时以脚注说明较通俗的表达。
- source_word: לְלַמְּדָם מִלְחָמָה
  choice: 教他们作战
  rationale: למד为“教导”，宾语“战争”使其在此具有学习作战的含义；“教他们作战”比“教他们战争”更符合现代汉语。
- source_word: אֲשֶׁר לְפָנִים
  choice: 那些从前
  rationale: 表达先前时间，并保留原文对特定群体的限制。
- source_word: לֹא יְדָעוּם
  choice: 不曾认识战争
  rationale: 以“认识”对应ידע，并按语境明确其所指为战争；不在正文中把语义收窄为“经历过”。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”较贴近原文形式，但在这里是全体以色列人的族群称谓，并非只指男性；脚注提供自然的现代汉语替代说法。
- issue: “认识战争”的含义
  choice: 认识战争
  alternative: 经历过战争
  rationale: 原文两处使用ידע“知道、认识”。正文保留其语义张力，使“知晓”和“亲历”都仍有可能；较具解释性的“经历过”置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“认识战争……教他们作战”保留原文略显重复的表达及ידע的语义张力；破折号保留后半句补充限定的结构。
