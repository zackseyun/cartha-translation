  text: וְ/אַחֲרָ֤י/ו הָיָה֙ שַׁמְגַּ֣ר בֶּן עֲנָ֔ת וַ/יַּ֤ךְ אֶת פְּלִשְׁתִּים֙ שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ בְּ/מַלְמַ֖ד הַ/בָּקָ֑ר וַ/יֹּ֥שַׁע גַּם ה֖וּא אֶת יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: zh_hans
  text: 在他之后，有亚拿的儿子珊迦；他用赶牛棍[a]击杀了六百名非利士人，也拯救了以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶牛棍”是用来驱赶牛只的尖棍。
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: 在他之后
  rationale: 保留原文“在他之后”的回指关系，不在正文中补明以笏。
- source_word: הָיָה
  choice: 有
  rationale: 此处用于引出下一位人物；“有”符合现代汉语叙事习惯，也不增添“兴起”等原文未明说的色彩。
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: 亚拿的儿子珊迦
  rationale: 按常用中文圣经人名音译处理，并照原文保留“……的儿子”；该称谓究竟指父子关系还是别称，正文不作裁定。
- source_word: וַיַּךְ
  choice: 击杀
  rationale: נכה在此战争语境中指致命击打；“击杀”兼顾动作与结果，比单纯“击打”更符合六百名敌人的语境。
- source_word: פְּלִשְׁתִּים שֵׁשׁ מֵאוֹת אִישׁ
  choice: 六百名非利士人
  rationale: 自然表达人数与族属，准确传达原文所数的是六百人。
- source_word: בְּמַלְמַד הַבָּקָר
  choice: 用赶牛棍
  rationale: 该词组指驱赶牛只的尖棍；“赶牛棍”比现代器械意味较强的“电牛棒”等译法更符合古代农耕背景。
- source_word: וַיֹּשַׁע
  choice: 拯救
  rationale: ישׁע在《士师记》的军事处境中表示救援、解救；“拯救”保留全书反复出现的救助主题。
- source_word: גַּם הוּא
  choice: 也
  rationale: 表达珊迦同样是拯救以色列的人，保留原文的附加强调。
- source_word: אֶת־יִשְׂרָאֵל
  choice: 以色列
  rationale: 直接译出受词，指以色列民。
theological_decisions:
- issue: 珊迦施行拯救的性质
  choice: 也拯救了以色列
  alternative: 也解救了以色列
  rationale: 原文把真实的拯救归于珊迦，却没有说明其范围或持续时间。“拯救”保留《士师记》的主题用语，同时不把这里扩大解释为更广泛的救恩论陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式紧凑，保留原文的顺序推进和“也”的强调；对“亚拿的儿子”可能具有的称号性质不作解释性改写。
