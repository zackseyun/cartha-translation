source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֣ף אֵלָ֔י/ו אֶת בְּנֵ֥י עַמּ֖וֹן וַ/עֲמָלֵ֑ק וַ/יֵּ֗לֶךְ וַ/יַּךְ֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽירְשׁ֖וּ אֶת עִ֥יר הַ/תְּמָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: zh_hans
  text: 他把亚扪人和亚玛力人[a]召集到自己那里，便前去攻打以色列；他们占领了棕榈城[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“亚玛力”，以这个名称统称亚玛力人。
    reason: lexical_alternative
  - marker: b
    text: 很可能指耶利哥；参申命记34:3和历代志下28:15。
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: 他把……召集到自己那里
  rationale: אָסַף与אֵלָיו连用，表示把盟军聚集到自己一方、归在自己领导之下；此译既保留“到自己那里”的方向含义，也符合现代汉语表达。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 这是族群称谓；译作“亚扪人”比直译“亚扪之子”自然准确。
- source_word: עֲמָלֵק
  choice: 亚玛力人
  rationale: 原文以专名“亚玛力”统称该族；中文正文用族称“亚玛力人”更易懂，并在脚注说明原文形式。
- source_word: וַיֵּלֶךְ
  choice: 便前去
  rationale: הלך是普通的“去”；“便前去”保留叙事推进，不额外加入“进军”等原文未明说的军事色彩。
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: 攻打以色列
  rationale: נכה在军事语境中指击打或攻击；“攻打”在现代汉语中自然，并避免把结果过度明确为“击败”。
- source_word: וַיִּירְשׁוּ
  choice: 他们占领了
  rationale: ירשׁ在此表示夺取并据有；动词为第三人称阳性复数，所以保留复数主语“他们”，指他和联合军队。
- source_word: עִיר הַתְּמָרִים
  choice: 棕榈城
  rationale: 保留原文的描述性地名，而不在正文直接换成“耶利哥”；“棕榈城”简洁、自然，也保留原有意象。
theological_decisions:
- issue: עִיר הַתְּמָרִים所指地点
  choice: 正文译作“棕榈城”，不直接译作“耶利哥”
  alternative: 耶利哥
  rationale: 原文使用描述性名称，而非明确写出“耶利哥”。为尊重原文措辞并保留识别上的限度，正文保留该称呼，只在脚注说明它很可能指耶利哥。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“便前去”呈现希伯来语连续叙事的推进；分号使“他们”的复数主语及联合军队的行动更清楚。脚注标记已按其实际所注词语排列，纠正了咨询层中标记与脚注内容错位的问题。
