  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: zh_hans
  text: 以下是雅威留下的各国，为要借着它们考验以色列，就是所有未曾经历过迦南任何战事的人[a]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经历过”也可直译为“知道”；这里所说的是亲身经历战争。
    reason: 保留ידע既可表示“知道”、又可表示经验性认识的词义层次。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 以下是
  rationale: 承接上文并引出清单；“以下是”在现代汉语中自然体现篇章转换，不额外加入时间意义。
- source_word: הַגּוֹיִם
  choice: 各国
  rationale: 这里指留在当地的不同族群和政治实体；“各国”简洁并符合士师记的语境。
- source_word: הִנִּיחַ
  choice: 留下
  rationale: 使役形在此表示让这些民族继续留存；“留下”保留原文的简洁，不扩写为“容许继续存在”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，而不以头衔替代。
- source_word: לְנַסּוֹת
  choice: 为要……考验
  rationale: נסה在此表示检验或考验；此译不引入“诱惑”的负面含义。
- source_word: בָּם
  choice: 借着它们
  rationale: 介词短语表示这些国家是考验以色列的媒介；汉语用“借着”比“用它们”更自然。
- source_word: אֵת יִשְׂרָאֵל
  choice: 以色列
  rationale: 按专名直译；后面的限定语说明所指的是未经历迦南战事的以色列人。
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: 就是所有未曾经历过……的人
  rationale: “就是”表明后语是对“以色列”的具体说明；ידע与战争搭配时主要指亲身经历，而不只是知道相关信息。
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: 迦南任何战事
  rationale: 原文直译为“迦南所有的战争”；在否定句中，“任何战事”自然表达一场也未经历的意思，同时保留“迦南”属格关系的概括性。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；“雅威”直接音译该名，避免用称号“主”取代，也与通常称为 Jehovah 的“耶和华”作出区分。
- issue: 神借列国考验以色列
  choice: 为要借着它们考验以色列
  alternative: 为要借着它们验证以色列
  rationale: 保留原文所陈述的目的和神学张力，不解释考验的具体性质，也不弱化神在留下列国一事上的主动性。
- issue: “所有未曾经历者”所限定的对象
  choice: 以“就是”将其解释为以色列中未经历战事的人
  alternative: 将其理解为未经历战事的列国
  rationale: 句法和上下文更自然地把该短语视为对受考验之以色列、尤其新一代人的说明；译文明确必要的汉语指向，但不增添其世代身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句末冒号保留本节作为后续列举引言的功能；“各国”“战事”等用词简洁，适合普通读者。
