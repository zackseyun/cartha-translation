base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: zh_hans
  text: 城里的男子在第七天、太阳下山以前[a]对他说：“有什么比蜜更甜？有什么比狮子更强？”他对他们说：“你们若不是用我的小母牛耕田[b]，就解不开我的谜语。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“太阳进来以前”，是指日落以前。
    reason: lexical_alternative
  - marker: b
    text: “用我的小母牛耕田”是比喻说法。参孙以“小母牛”指自己的妻子，责怪这些人利用她取得谜底。
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: 城里的男子
  rationale: 保留希伯来语复数名词的男性所指，同时用现代汉语自然表达其来自该城。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 在第七天
  rationale: 按原文直译时间表达，简洁自然。
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: 太阳下山以前
  rationale: 原文逐字近于“太阳进来以前”，在语境中是日落前的惯用表达；正文译出其实际时间含义，脚注保留字面形象。
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: 有什么比蜜更甜
  rationale: 将介词 מִן 按比较意义处理，保留谜语的问句形式。
- source_word: וּמֶה עַז מֵאֲרִי
  choice: 有什么比狮子更强
  rationale: עַז 可指强壮、猛烈或勇猛；“强”既符合比较结构，也与狮子的形象及谜底相称。
- source_word: לוּלֵא
  choice: 若不是
  rationale: 自然表达与事实相反的条件，承接后句“就猜不出”。
- source_word: חֲרַשְׁתֶּם בְּעֶגְלָתִי
  choice: 用我的小母牛耕田
  rationale: 保留“耕”与“小母牛”的农业隐喻，不在正文中将其直接解释为利用参孙的妻子。
- source_word: לֹא מְצָאתֶם חִידָתִי
  choice: 就猜不出我的谜语
  rationale: מָצָא 字面为“找到”，但用于谜语时指找出答案；“猜不出”是自然汉语，并保留解谜语的语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留谜语的平行问句和参孙尖刻的农业隐喻；用脚注解释希伯来语的日落惯用语及“小母牛”的具体所指，避免在正文中消解原文形象。
