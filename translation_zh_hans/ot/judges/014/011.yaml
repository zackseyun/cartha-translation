  yaml_path: translation/ot/judges/014/011.yaml
  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: zh_hans
  text: 他们看见参孙，就选了三十个同伴陪着他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同伴”也可译作“朋友”；在这里也可能特指婚宴上的陪伴者或伴郎。
    reason: 原词可泛指朋友或同伴；婚宴语境容许更具体的礼仪角色，但原文没有明确限定。
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹתָם אֹתוֹ
  choice: 他们看见参孙，就
  rationale: 希伯来语以叙事性结构引出时间从句；现代汉语用“……就……”自然表达事件的紧接关系。宾语代词按上下文明确为参孙，避免连续代词造成含混。
- source_word: וַיִּקְחוּ
  choice: 找来
  rationale: לקח基本义为“拿、取”，此处指安排一批人来陪伴参孙；“找来”既符合语境，也不把动作过度限定为正式挑选或任命。
- source_word: שְׁלֹשִׁים מֵרֵעִים
  choice: 三十个人作他的陪伴
  rationale: מֵרֵעִים指同伴或朋友；结合婚宴语境，“作他的陪伴”保留其关系和功能，又不武断认定这些人具有正式“伴郎”身份。
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: 和他待在一起
  rationale: 贴近原文“与他同在”，并以自然现代汉语表达持续陪伴的状态，不额外推定其具体职责。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“陪伴”刻意保留原词在一般同伴与婚宴特定角色之间的语义空间；脚注标记置于对应词后。
