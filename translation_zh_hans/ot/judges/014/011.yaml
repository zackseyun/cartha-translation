  naturalness: “三十个人作他的陪伴”在现代汉语中搭配生硬，且“陪伴”通常更自然地作动词或抽象名词，而非指一组人的名词。改为“三十个同伴陪着他”自然、简洁，并保留婚宴情境下可能的陪伴功能。
  terminology: 将“陪伴”改为“同伴”，可直接对应 מֵרֵעִים，并保留“朋友”“婚宴陪伴者／伴郎”等脚注所说明的语义范围。用“选了”表达此处为参孙安排陪伴者的“取”之意，避免“找来”所增加的寻觅意味。
