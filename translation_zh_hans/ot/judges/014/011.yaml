- from: 他们看见参孙，就找来三十个人作他的陪伴[a]，和他待在一起。
  to: 他们看见参孙，就选了三十个同伴陪着他。[a]
  rationale: 修订以“选了三十个同伴”直接对应“取了三十个同伴”，并以“陪着他”自然表达“他们与他同在”。脚注锚点置于“同伴陪着他”这一完整相关短语后，保留原词的一般与婚宴语境下的较具体含义。
