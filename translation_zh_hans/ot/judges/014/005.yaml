base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: zh_hans
  text: 参孙和他的父亲、母亲一同下到亭拿。他们到了亭拿的葡萄园。看哪，一头年轻的狮子[a]正吼叫着朝他而来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“狮子中的年轻狮子”，是指年轻狮子的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“吼叫着来迎他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 下到
  rationale: 保留ירד所表达的向下行进之意，也符合从山地前往亭拿的地势背景。
- source_word: תִּמְנָתָה
  choice: 到亭拿
  rationale: 词尾的方向词素表示朝某地而去；现代汉语以“到亭拿”自然表达目的地。
- source_word: וַיָּבֹאוּ עַד
  choice: 他们来到
  rationale: בוא与עַד连用，表示行程到达某一点；汉语用“来到”即可自然表达抵达该处。
- source_word: כַּרְמֵי תִמְנָתָה
  choice: 亭拿的葡萄园
  rationale: 该属格结构直指属于亭拿或位于亭拿一带的葡萄园；正文采用简洁而贴近形式的译法。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 这是引人注意、使场景顿时鲜明的叙事标记；“看哪”保持其突显和惊异作用，同时具有庄重的经文语体。
- source_word: כְּפִיר אֲרָיוֹת
  choice: 一头少壮的狮子
  rationale: כְּפִיר指年轻而已有力量的狮子，并非现代意义上的幼小狮崽；“少壮的狮子”兼顾年龄与威猛形象。后接复数אֲרָיוֹת属于希伯来语强化性表达，不宜机械重复。
- source_word: שֹׁאֵג
  choice: 吼叫着
  rationale: 分词描绘正在持续发生的动作；“吼叫着”保留现场感。
- source_word: לִקְרָאתוֹ
  choice: 迎面向他而来
  rationale: לִקְרָאת可表示“前来相遇”或“朝向”；此处结合狮子的敌对场景，译文明确其正朝参孙逼近，同时以脚注保留较形式对应的译法。
theological_decisions: []
translation_notes:
