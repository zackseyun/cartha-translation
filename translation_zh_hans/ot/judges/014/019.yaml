revisions:
- from: 耶和华的灵猛然临到参孙，他就下到亚实基伦，击杀了那里的人中三十个，夺了他们的衣服[a]，把这些成套衣裳交给解出谜语的人。参孙怒火中烧，便上到父亲家里去了。
  to: 耶和华的灵猛然临到参孙，他就下到亚实基伦，在那里击杀了三十人，夺了他们的衣服[a]，又把成套衣裳交给那些揭开谜底的人。参孙怒火中烧，便上到父亲家里去了。
  rationale: 修订删除“这些”，不把原文所区分的“衣服”与“成套衣裳”作未经明说的等同；并以“揭开谜底的人”反映该语境中将谜底说出的含义。其余措辞及脚注可保留。
