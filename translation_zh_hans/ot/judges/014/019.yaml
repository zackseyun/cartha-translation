  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/יֵּ֨רֶד אַשְׁקְל֜וֹן וַ/יַּ֥ךְ מֵ/הֶ֣ם שְׁלֹשִׁ֣ים אִ֗ישׁ וַ/יִּקַּח֙ אֶת חֲלִ֣יצוֹתָ֔/ם וַ/יִּתֵּן֙ הַ/חֲלִיפ֔וֹת לְ/מַגִּידֵ֖י הַ/חִידָ֑ה וַ/יִּ֣חַר אַפּ֔/וֹ וַ/יַּ֖עַל בֵּ֥ית אָבִֽי/הוּ׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: zh_hans
  text: 耶和华的灵猛然临到参孙，他就下到亚实基伦，在那里击杀了三十人，夺了他们的衣服[a]，又把成套衣裳交给那些揭开谜底的人。参孙怒火中烧，便上到父亲家里去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来词也可理解为“从他们身上剥下的衣服”，即从被杀者身上取走、作为战利品的衣物。
    reason: 说明חֲלִיצוֹתָם在本语境中可能具有“剥下并作为战利品取得”的特指含义。
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: 耶和华的灵猛然临到参孙
  rationale: “猛然临到”保留 צלח 在士师记中所表达的突然而强有力的临到；补出“参孙”以避免现代汉语中连续代词造成含混，但不增添道德评价。
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: 他就下到亚实基伦
  rationale: 保留 ירד 的方向性“下到”，并采用地名的通行中文译法。
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: 击杀了那里的人中三十个
  rationale: “击杀”表达 נכה 在本语境中的致命含义；“那里的人中”保留 מֵהֶם 的部分关系，同时自然承接亚实基伦。
- source_word: חֲלִיצוֹתָם
  choice: 他们的衣服
  rationale: 正文采用自然且不过度解释的“衣服”；该词可能特指从被杀者身上剥下、作为战利品取得的衣物，此层含义留在脚注说明。
- source_word: הַחֲלִיפוֹת
  choice: 这些成套衣裳
  rationale: 结合前文赌约，该词指应付给对方的成套衣物；“这些”自然表明它们就是刚夺得并用来偿付的衣服。
- source_word: לְמַגִּידֵי הַחִידָה
  choice: 交给解出谜语的人
  rationale: נגד 在此指说出或揭示谜底；“解出谜语”符合现代汉语叙事习惯。
- source_word: וַיִּחַר אַפּוֹ
  choice: 参孙怒火中烧
  rationale: 以自然的汉语成语保留希伯来文“怒气燃烧”的意象。
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: 上到父亲家里去了
  rationale: 保留 עלה 的“上去”方向含义，不将其仅意译为“回去”。
theological_decisions:
- issue: 耶和华之灵临到参孙与随后暴力行为之间的神学张力
  choice: 直译为“耶和华的灵猛然临到参孙”，不加评断
  alternative: 译为“耶和华的灵赐给他力量”，并解释为对随后行动的认可
  rationale: 原文明确陈述神的灵强有力地临到参孙，却没有在本节中直接解释这是否意味着对他每项行为的道德认可；译文保留这种张力。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 上主
  rationale: “耶和华”是现代中文圣经传统中广为人知的专名形式，能体现原文使用的是神的名字而非普通称号。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。叙事节奏以短句推进，保留“下到”“上到”的空间方向和“怒火中烧”的原文意象；脚注标记紧随其实际说明的“衣服”，避免误附在圣灵临到的短语之后。
