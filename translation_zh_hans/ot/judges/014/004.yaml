base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: zh_hans
  text: 可是，他的父母并不知道这事出于耶和华，因为他[a]正在寻找机会对付非利士人[b]。那时，非利士人正统治着以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他正在寻找”中的“他”也可理解为耶和华；希伯来原文允许这种读法，不过上下文更可能指参孙。
    reason: alternative_reading
  - marker: b
    text: “机会”也可译作“由头”或“借口”；希伯来原文直译为“从非利士人那里寻找机会”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיְהוָה
  choice: 出于耶和华
  rationale: 直译介词短语，并以“耶和华”呈现神的立约之名；“出于”自然表达此事的神圣来源。
- source_word: הִיא
  choice: 这事
  rationale: 阴性代词回指前文所述的婚姻追求或整个情势；汉语用“这事”比保留语法性别更自然。
- source_word: תֹאֲנָה
  choice: 机会
  rationale: 该词可指采取行动的由头、时机或借口；“机会”避免像“借口”那样过度强调虚假动机，具体语义范围在脚注说明。
- source_word: מְבַקֵּשׁ
  choice: 正在寻找
  rationale: 分词表示持续或当时正在进行的行动，用“正在寻找”体现其进行性。
- source_word: מִפְּלִשְׁתִּים
  choice: 对付非利士人
  rationale: 希伯来语字面带“从非利士人那里”的形式，但在“寻找机会”的搭配和敌对语境中，所寻求的是针对非利士人采取行动的机会；“对付”自然传达这一方向。
- source_word: וּבָעֵת הַהִיא
  choice: 那时
  rationale: 简洁、自然地保留叙事中的时间背景。
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: 正统治着以色列
  rationale: 分词表达持续的统治状态；“正统治着”兼顾时态感和政治支配之意。
- source_word: וְאָבִיו וְאִמּוֹ
  choice: 他的父母
  rationale: 现代汉语中“他的父母”自然概括“他的父亲和他的母亲”，意义无损。
- source_word: לֹא יָדְעוּ
  choice: 并不知道
  rationale: 直接呈现ידע的含义，并用“并”承接前文转折。
theological_decisions:
- issue: 耶和华的参与和参孙主动寻找冲突机会之间的关系
  choice: 经文既说这事出于耶和华，也把参孙呈现为寻找机会的人。
  alternative: 可将经文解释为耶和华直接决定参孙的欲望，或仅在事后利用参孙独立作出的选择。
  rationale: 原文同时保留神的主权参与与人的行动，没有解释二者如何协调；译文不替经文消解这一张力。
- issue: “他正在寻找”的指代对象
  choice: 正文按叙事语境理解为参孙。
  alternative: “他”也可能指耶和华。
  rationale: 希伯来语的阳性单数分词容许两种理解；整体叙事较自然地指向参孙，但语法上的另一可能应在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接父母反对婚事的上下文；“这事出于耶和华”保留原文的神学陈述；脚注保留主语指代与介词表达的真实歧义。
