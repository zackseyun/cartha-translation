base_translation:
  language: en
  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: zh_hans
  text: 他对他们说：“从吃者出来的是食物；从强者[a]出来的是甘甜。”他们连续三天都未能解答这谜语[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凶猛者”。希伯来语这个词可指“强壮的”“强大的”或“凶猛的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“连续三天都未能说出这谜语（的答案）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: 他对他们说
  rationale: 按希伯来叙事体自然推进；中文无需机械补出连接词，也不额外限定时间先后。
- source_word: מֵהָאֹכֵל
  choice: 吃者
  rationale: 定冠词加主动分词作名词，直指“吃的那一位/物”；“吃者”简洁并保留谜面。
- source_word: יָצָא מַאֲכָל
  choice: 出食物
  rationale: 保留“出来、产生”的意象和谜语的凝练对仗；מַאֲכָל 指可吃之物、食物。
- source_word: וּמֵעַז
  choice: 强者
  rationale: עַז 可指强壮、强大或凶猛；正文采用范围较宽的“强者”，不提前点明狮子。
- source_word: יָצָא מָתוֹק
  choice: 出甘甜
  rationale: מָתוֹק 在此名词化，指甜美之物或甘甜；“甘甜”既保留性质名词的含混，也与“食物”形成简洁平行。
- source_word: לֹא יָכְלוּ לְהַגִּיד הַחִידָה
  choice: 不能解答这谜语
  rationale: 字面是“不能说出/讲明这谜语”；按谜语语境，“解答”自然表达他们无法给出谜底，同时以脚注保留较直译的可能。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三天都
  rationale: 表达持续三天的时间范围，不强行解释为必须在三天期限以内。
