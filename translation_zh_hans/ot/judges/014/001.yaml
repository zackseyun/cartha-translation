  yaml_path: translation/ot/judges/014/001.yaml
  text: Then Samson went down to Timnah[a], and at Timnah he saw a woman from the daughters of the Philistines.
translation:
  language: zh_hans
  text: 参孙下到亭拿，在亭拿看见了一个非利士女子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从非利士人的女儿们中。”
    reason: 保留原文“从非利士人的女儿们中”这一亲属式族群表达及其部分性含义；正文采用自然的现代汉语。
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 下到
  rationale: 保留ירד“下去、下到”的地势性叙事表达；现代汉语中简洁自然，也不把具体方向弱化为单纯的“去”。
- source_word: שִׁמְשׁוֹן
  choice: 参孙
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: תִּמְנָתָה
  choice: 到亭拿
  rationale: 词尾的方向词素־ָה表示朝向或进入该地；“到亭拿”符合现代汉语表达。
- source_word: וַיַּרְא
  choice: 看见
  rationale: 按ראה的基本义翻译，不增添“留意到”或“一见钟情”等原文未明说的含义。
- source_word: אִשָּׁה
  choice: 一个女子
  rationale: 此处尚未成婚，因此不译作“妻子”；“女子”庄重而自然，也不额外断定年龄。
- source_word: בְּתִמְנָתָה
  choice: 在那里
  rationale: 承接前句刚出现的“亭拿”，以代词避免现代汉语中不必要的地名重复，同时准确表达ב的地点含义。
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: 是非利士女子中的一个
  rationale: 自然表达所属群体，同时保留介词מִן“从……之中”的部分性含义；原文较直译的亲属式说法另见脚注。
theological_decisions: []
