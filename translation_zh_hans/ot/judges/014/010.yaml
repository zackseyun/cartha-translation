  yaml_path: translation/ot/judges/014/010.yaml
  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: zh_hans
  text: 他父亲就下到那女子那里；参孙在那里设宴[a]，因为年轻男子惯常这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“酒宴”或“筵席”。希伯来语 מִשְׁתֶּה 常指包括饮酒的庆祝性宴席。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 就下到
  rationale: 保留 ירד“下去、下到”的方向含义，并以“就”承接叙事。
- source_word: אָבִיהוּ
  choice: 他父亲
  rationale: 第三人称阳性单数后缀在上下文中指参孙，因此译作“他父亲”。
- source_word: אֶל הָאִשָּׁה
  choice: 到那女子那里
  rationale: 原文直称“那女子（女人）”，未明说“妻子”或“新娘”；“女子”在现代汉语中自然，也保留原文措辞。
- source_word: וַיַּעַשׂ שָׁם
  choice: 在那里设摆
  rationale: עשה 与“宴席”搭配表示举办、摆设；“设摆”兼顾原文宽泛的“做”和现代汉语表达。
- source_word: מִשְׁתֶּה
  choice: 宴席
  rationale: 该词指庆祝性的筵席，通常包括饮酒；正文用“宴席”避免过度限定，脚注说明饮酒意味。
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: 因为……惯常这样做
  rationale: 未完成式在此表达习惯性行为；“惯常”清楚传达当地年轻人的通行做法。
- source_word: הַבַּחוּרִים
  choice: 年轻人
  rationale: בָּחוּר 指正值壮年的年轻男子；上下文已足以表明性别，而“年轻人”是自然、庄重的现代汉语。
