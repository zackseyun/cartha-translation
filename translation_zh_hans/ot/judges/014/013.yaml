base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: zh_hans
  text: 但如果你们不能告诉我谜底，就要给我三十件细麻衣[a]和三十套衣服。”他们对他说：“把你的谜语说出来，让我们听听。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细麻衣”或译“细麻布”。原文所用的词可指细麻制品；在这里与“成套衣服”并列，较可能指可穿戴的衣物。
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: 不能
  rationale: 源自动词יכל，表示能力；在条件句中译为“不能”，自然地保留无能力之意。
- source_word: לְהַגִּיד לִי
  choice: 告诉我谜底
  rationale: נגד的使役形通常意为“告诉、宣布”。结合上一节，所要告知的是谜语的答案；汉语补出“谜底”可避免误解，同时不把它过度解释为“说明”。
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: 就要给我
  rationale: 此处连接词加完成式表达条件成立后的约定结果；“就要”以自然汉语体现赌约的约束力。
- source_word: סְדִינִים
  choice: 细麻衣
  rationale: 该词可指细麻制成的布件或衣物；本节与“衣服”并列，语境较支持可穿戴的细麻衣物，同时以脚注保留“细麻布”的可能。
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: 套衣服
  rationale: 该词组指可替换的成套衣物；“三十套衣服”符合现代汉语，也清楚表达数量单位。
- source_word: חוּדָה חִידָתְךָ
  choice: 把你的谜语说出来
  rationale: חוד在此指提出谜语，חידה意为谜语；这一译法符合对话语气，并保留命令式。
- source_word: וְנִשְׁמָעֶנָּה
  choice: 让我们听听
  rationale: 第一人称复数鼓励式并带阴性单数后缀，所指为“谜语”；“让我们听听”自然传达意愿语气。
