base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: zh_hans
  text: 他把蜜掏到手里[a]，边走边吃。随后，他来到父母那里，分给他们一些，他们也吃了。但他没有告诉他们，这蜜是从狮子的尸体里掏出来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“取出来”或“挖出来”；这个希伯来语动词在这里表示用手从尸体里面取出蜂蜜。
    reason: 保留该动词在具体动作方式上的词义选择空间。
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: 把蜜掏出来
  rationale: 此处的 רדה 指从狮子尸体内部取出蜂蜜。“掏出来”既体现由里面取出的动作，也符合用手取蜜的具体场景；宾语“蜜”承接上文，在中文中明说更自然。
- source_word: אֶל כַּפָּיו
  choice: 捧在手里
  rationale: כַּף 可指手掌。直译“到他的手掌里”不够自然；“捧在手里”保留蜂蜜在双手中的具体画面。
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: 边走边吃
  rationale: 有限动词配合不定式绝对形表达持续进行的动作；“边走边吃”简洁、自然地传达这一延续状态。
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: 随后，他来到父母那里
  rationale: הלך 在这里表示前往父母所在之处。“来到父母那里”符合现代汉语叙事习惯，“随后”体现叙事推进。
- source_word: וַיִּתֵּן לָהֶם
  choice: 分给他们一些
  rationale: 原文宾语由语境补足，所给的是一部分蜂蜜。“分给他们一些”自然表达隐含的部分意义。
- source_word: וַיֹּאכֵלוּ
  choice: 他们也吃了
  rationale: 原文未重复宾语，中文同样可由上下文理解；“也”表明父母和参孙一样吃了蜜。
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: 但他没有告诉他们
  rationale: הגיד 是“告诉、说明”。“但”自然呈现此句与父母吃蜜之间的对照。
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: 从狮子的尸体里
  rationale: גְּוִיָּה 指死尸或尸体；“狮子的尸体”保留原文具体而令人不适的意象，“里”对应蜂蜜所在的内部位置。
- source_word: רָדָה הַדְּבָשׁ
  choice: 这蜜是……掏出来的
  rationale: 再次采用“掏出来”，保持同一希伯来动词前后译法一致，并以中文“是……的”结构说明蜂蜜的来源。
theological_decisions: []
