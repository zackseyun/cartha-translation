base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: zh_hans
  text: 她在他面前哭了七天；那七天正是他们举行宴席的日子。[a]到了第七天，因为她苦苦催逼他，他就把谜语的答案告诉她；她便把这谜语告诉她本族的男子。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他面前哭”也可译作“对着他哭”。希伯来文直译为“在他身上哭”，表达她持续以哭泣向他施压。
    reason: lexical_alternative
  - marker: b
    text: “她本族的男子”原文直译为“她本族的众子”。在本段语境中，很可能特指她本族的那些男子，即非利士同伴。“这谜语”按上下文是指谜语及其答案。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: 她在他面前哭
  rationale: בכה意为“哭、哭泣”；עַל加代词后缀表示哭泣朝向他，并在语境中带有持续施压的意味。“在他面前哭”自然通顺，同时用脚注保留希伯来语习语的力度。
- source_word: שִׁבְעַת הַיָּמִים
  choice: 整整七天
  rationale: 指宴席持续的完整七日；“整整”在现代汉语中自然表达全程持续，未改变时间范围。
- source_word: אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: 就是他们摆宴席的那些日子
  rationale: מִשְׁתֶּה指宴席或酒宴；此处关系从句说明前述七天正是他们举行宴席的时期。
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: 到了第七天
  rationale: וַיְהִי在叙事中推进情节；“到了”自然保留时间转换。
- source_word: וַיַּגֶּד לָהּ
  choice: 他就把谜底告诉了她
  rationale: נגד意为告诉、宣告、使人知道。原文未明说宾语，但语境明确是谜语的答案；中文补出“谜底”使指代清楚。
- source_word: כִּי הֱצִיקַתְהוּ
  choice: 因她苦苦逼迫
  rationale: צוק的使役式在此表达强烈、持续的施压。“苦苦逼迫”兼顾强度与反复催逼。
- source_word: וַתַּגֵּד הַחִידָה
  choice: 她随即把谜底告诉了
  rationale: 字面为“她把谜语告诉了”，在上下文中所传达的是谜语的答案；现代汉语以“谜底”表达更清楚。
- source_word: לִבְנֵי עַמָּהּ
  choice: 本族的人
  rationale: 字面是“她本族的众子”，语境指她所属民族中的人，很可能特指那些非利士男子。“本族的人”保留群体归属而避免生硬直译。
