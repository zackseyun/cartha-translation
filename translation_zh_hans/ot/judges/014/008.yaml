  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: zh_hans
  text: 过了些日子，他回来迎娶那女子。他转过去查看狮子的尸体，只见狮子的尸体里有一群蜜蜂和蜂蜜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיָּמִים
  choice: 过了些日子
  rationale: 该短语表示一段未明确长短的时日过去，译文保留这种不确定性。
- source_word: לְקַחְתָּהּ
  choice: 迎娶那女子
  rationale: 字面为“带走她／娶她”；在本段婚姻语境中指前来娶亲。“迎娶”既表达动作，也使现代汉语读者容易理解。
- source_word: וַיָּסַר
  choice: 转去
  rationale: 表示离开原定路线、转到一旁去看；用简洁自然的汉语呈现。
- source_word: מַפֶּלֶת הָאַרְיֵה / גְּוִיַּת הָאַרְיֵה
  choice: 狮子的尸体／狮尸
  rationale: 前者字面涉及狮子倒毙后的遗骸，后者明确指尸体；上下文均以“尸体”表达，并用“狮尸”避免累赘。
- source_word: עֲדַת דְּבוֹרִים
  choice: 一群蜜蜂
  rationale: עֵדָה在此指聚集成群的蜂群；“一群蜜蜂”是自然准确的现代汉语。
- source_word: וּדְבָשׁ
  choice: 还有蜂蜜
  rationale: 原文为简短的并列成分“和蜜”；汉语补入“还有”以构成自然句式，不额外解释蜂蜜的形成或位置。
