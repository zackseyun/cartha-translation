  yaml_path: translation/ot/judges/014/020.yaml
  text: And Samson’s wife became the wife of his companion[a], who had been his friend.
translation:
  language: zh_hans
  text: 参孙的妻子成了他同伴的妻子；这同伴曾是他的朋友[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成了他的朋友的妻子；这人曾与他交好。”原文“同伴”和“朋友／交好”使用同属 רעה 词族、表示交往或作伴的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: 就归了
  rationale: 这里的 היה 连续式在叙事中表示关系或归属发生变化；“就归了”比静态的“是”更能体现结果，同时自然承接上下文。
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: 参孙的妻子
  rationale: 该构造链直接表达婚姻关系；现代汉语用领属结构最自然。
- source_word: לְמֵרֵעֵהוּ
  choice: 归了他的伴郎
  rationale: 介词 ל 与 היה 连用可表达转归或归属。מֵרֵעַ 指同伴、友伴；结合士师记14:11的婚宴语境，“伴郎”能准确、简洁地指出这位陪伴新郎的人。
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: 就是先前陪伴他的那个人
  rationale: רעה 在此不是“牧养”，而是与人交往、作伴。译作“陪伴他的”既保留与前一相关词的词根呼应，也避免把关系明确限定为深厚友情。
