base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: zh_hans
  text: 参孙对他们说：“请让我给你们出个谜语。你们若在宴席的七天之内把谜底告诉我，并解开这谜语[a]，我就给你们三十件麻布衣物和三十套替换用的衣服[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “解开”原文直译为“找到”；这里指找到谜底、解开谜语。
    reason: lexical_alternative
  - marker: b
    text: 这些衣物的确切式样难以确定；原文所说的是麻布衣物和成套或替换用的衣服。
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: 请让我……出个
  rationale: 第一人称意愿式配合 נָא，表达带有礼貌语气的提议；现代汉语以“请让我……出个谜语”自然传达。
- source_word: חִידָה
  choice: 谜语
  rationale: 该词指谜语或隐晦难解的话；叙事语境明确是供人猜解的谜语。
- source_word: אִם הַגֵּד תַּגִּידוּ
  choice: 你们若能……告诉我
  rationale: 不定式绝对形与限定动词连用具有加强语气；“若能……告诉我”在汉语中既表达挑战条件，也体现强调，未机械重复“告诉”。
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: 在宴席的七天之内
  rationale: מִשְׁתֶּה 指宴席或筵宴，此处为婚宴；“七天之内”清楚表达挑战的时限。
- source_word: וּמְצָאתֶם
  choice: 并且猜出来
  rationale: 字面为“找到”，在谜语语境中指找到答案；汉语“猜出来”自然贴合解谜场景。
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: 三十件细麻衣
  rationale: סְדִינִים 指麻布制成的衣物，但具体式样不确定；“细麻衣”保留材质信息而不过度限定衣物种类。
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: 三十套衣服
  rationale: 该短语指可替换的成套衣服；“三十套衣服”是自然、明确的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“出个谜语”“猜出来”符合叙事对话语境；奖品名称则保留古代服饰的材质与成套概念，并以脚注说明其不确定性。
