revisions:
- from: 参孙对他们说：“请让我给你们出个谜语。你们若能在宴席的七天之内把谜底告诉我，并且猜出来[a]，我就给你们三十件细麻衣和三十套衣服[b]。”
  to: 参孙对他们说：“请让我给你们出个谜语。你们若在宴席的七天之内把谜底告诉我，并解开这谜语[a]，我就给你们三十件麻布衣物和三十套替换用的衣服[b]。”
  rationale: 修订避免把原文的强调式条件误译为能力条件，消除中文中“告诉谜底”与“猜出来”的重复，并以较不具体的服饰用语保留原文对奖品类别的历史不确定性。脚注锚点已随相应词语设置。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:27Z'
review_pass:
  verdict: revise
  source_fidelity: “若能”将希伯来语不定式绝对形加限定动词所表达的强调转成了能力条件，宜改为不含能力意味的条件句。“把谜底告诉我，并且猜出来”也在汉语中造成语义重复；原文在谜语语境中是“告诉（答案）”并“找到／解开”谜语。
  naturalness: 原译整体通顺、对话体自然；修订后以“把谜底告诉我，并解开这谜语”更清楚地区分说出答案和解谜两个动作。“替换用的衣服”比单说“衣服”更保留חֲלִפֹת所含的替换／换装概念。
  terminology: “谜语”“宴席”“参孙”均恰当。“细麻衣”对סְדִינִים略显过于具体；改为“麻布衣物”，并保留服饰类别不确定的脚注。
