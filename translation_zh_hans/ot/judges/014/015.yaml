base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: zh_hans
  text: 到了第七天，他们对参孙的妻子说：“你去诱哄你丈夫，让他把谜语告诉我们；不然，我们就把你和你父亲的家用火烧掉[a]。你们请我们来，难道是要夺取我们的产业[b]吗？不是吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你父亲的家”原文也可指你父亲的家属、家族；该词同时可保留房屋的字面含义。
    reason: lexical_alternative
  - marker: b
    text: “夺取我们的产业”也可译作“使我们失去产业”或“占有我们的所有”。原文动词可指取得占有权，或使别人失去其产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 到了第七天
  rationale: 准确表达时间推进，也符合现代汉语叙事习惯；底本明确作“第七天”。
- source_word: פַּתִּי
  choice: 诱哄
  rationale: 该词的加强词干在这里含有操纵性的引诱、哄劝意味；“诱哄”比单纯的“劝说”更能保留其计谋和胁迫语境。
- source_word: אִישֵׁךְ
  choice: 你丈夫
  rationale: 在已婚女子的语境中，אִישׁ自然指丈夫。
- source_word: וְיַגֶּד לָנוּ אֶת הַחִידָה
  choice: 让他把谜底告诉我们
  rationale: 连词加未完成式承接命令，表达目的；上下文中他们要的不只是重述谜语，而是获知谜语的答案，因此用“谜底”自然明确。
- source_word: פֶּן נִשְׂרֹף אוֹתָךְ וְאֶת בֵּית אָבִיךְ בָּאֵשׁ
  choice: 不然，我们就放火烧死你和你父家的人
  rationale: פֶּן在威胁中自然译作“不然”；明说“烧死”保留威胁针对人的致命性质，“放火”传达בָּאֵשׁ。
- source_word: בֵּית אָבִיךְ
  choice: 你父家的人
  rationale: “父家”可指父亲的家属或家庭，也可让人联想到住所；正文按此处威胁对象主要为人的语境译出，脚注保留词义范围。
- source_word: הֲלְיָרְשֵׁנוּ
  choice: 难道是要夺走我们的财物吗
  rationale: ירשׁ在此可指占有、剥夺或使人失去产业；结合赌注语境，“夺走我们的财物”比抽象的“剥夺我们”更易懂，同时保留掠取所有物的含义。
- source_word: קְרָאתֶם לָנוּ
  choice: 你们请我们来
  rationale: קרא加介词ל在宴席语境中表示邀请；希伯来语为复数第二人称，故保留“你们”。
- source_word: הֲלֹא
  choice: 不就是这样吗
  rationale: 保留期待对方承认的反问和指控语气，不把它并入前一句而消除其独立强调。
