base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: zh_hans
  text: 他就上去告诉父母说：“我在亭拿看见一个女子，是非利士人的女儿之一。现在，请你们给我娶她为妻。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 他就上去
  rationale: 保留עלה“上去”的方向或地势含义，同时符合希伯来叙事推进的语气。
- source_word: וַיַּגֵּד לְאָבִיו וּלְאִמּוֹ
  choice: 告诉父母说
  rationale: נגד使役式表示“告诉、报告”；中文用“告诉父母说”自然引出后面的直接引语，也无需重复“他的”。
- source_word: אִשָּׁה
  choice: 一个女子
  rationale: 此处尚未成婚，指参孙所看见的一名女性；“女子”比“妻子”更符合叙事阶段，也保持庄重自然。
- source_word: בְתִמְנָתָה
  choice: 在亭拿
  rationale: 按地名所在地表达，译作“在亭拿”自然清楚。
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: 是非利士人的女儿之一
  rationale: מִן在这里有部分关系，意为非利士众女子中的一位；保留“女儿”的希伯来亲族表达，同时用“之一”使现代中文明确自然。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 标示从陈述所见转向提出要求；中文“现在”简洁地保留这一衔接。
- source_word: קְחוּ אוֹתָהּ לִּי לְאִשָּׁה
  choice: 请你们为我娶她为妻
  rationale: לקח字面为“取”，在婚姻安排语境中指为某人取得或迎娶女子；“为我娶她为妻”保留父母参与安排婚姻、对象归于参孙以及婚姻目的。加入“请”使汉语命令句自然，但不削弱其明确要求。
theological_decisions: []
