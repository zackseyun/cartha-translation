base_translation:
  language: en
  yaml_path: translation/ot/judges/014/007.yaml
  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: zh_hans
  text: 于是，他下去跟那女子说话[a]；她在参孙眼中是合意的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更口语化地译作“与那女子交谈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 于是，他下去
  rationale: ירד表示“下去、下行”。此处既保留前往亭拿的地理方向，也用“于是”自然体现叙事中的连续动作。
- source_word: וַיְדַבֵּר לָאִשָּׁה
  choice: 跟那女子说话
  rationale: דבר加ל表示向某人说话；现代汉语用“跟……说话”自然，并不额外断定谈话的具体内容或互动程度。אִשָּׁה在此指参孙尚未娶的亭拿女子，故译“女子”而非“妻子”。
- source_word: וַתִּישַׁר
  choice: 是合意的
  rationale: ישר在此表示按某人的判断看来合适、称心。“合意”保留评价意味，比单纯“喜欢”更贴近原文，也避免生硬直译为“正直”。
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: 在参孙眼中
  rationale: 保留希伯来语“在某人眼中”的意象，既可自然表达参孙的主观评价，也维持其与《士师记》中“在自己眼中看为正”这一主题可能存在的呼应。
theological_decisions:
- issue: 本句是否呼应《士师记》中“在自己眼中看为正”的主题
  choice: 正文保留“在参孙眼中”
  alternative: 译作“参孙很中意她”或“她很合参孙的心意”
  rationale: 原文的措辞可能具有文学和神学上的主题呼应，但本节并未明说。保留原有意象，既不抹去这种可能，也不把它解释成确定结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“女子”符合上下文身份；“合意”略带书面色彩，但能自然承载原文关于合适、称心的评价意味。脚注标记[a]已置于正文对应位置。
