base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: zh_hans
  text: 参孙的妻子在他面前哭着，对他说：“你只是恨我，并不爱我。你给我本族的男子[a]出了谜语，却没有把谜底告诉我。”他对她说：“你看，我连自己的父亲和母亲都没有告诉，难道还会告诉你吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我民的儿子们”。希伯来文使用阳性形式；在此语境中，很可能指她本族的男性同伴。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: 在他面前哭着
  rationale: בכה 表示“哭泣”；עַל 加人称在这里描写她当着参孙的面哭，并带有向他施加情感压力的语境。“在他面前哭着”自然且不过度解释。
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: 参孙的妻子
  rationale: 直接、自然地表达希伯来语所属结构。
- source_word: רַק שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי
  choice: 你根本就是恨我，不爱我
  rationale: רַק 在指控中有加强语气的作用；“根本就是”体现其情绪力度，同时保留“恨”与“爱”的直接对照。
- source_word: הַחִידָה חַדְתָּ
  choice: 出了谜语
  rationale: חִידָה 是“谜语”，动词 חוד 在此指提出或设下谜语；“出谜语”符合现代汉语习惯。
- source_word: לִבְנֵי עַמִּי
  choice: 给我族中的人
  rationale: 字面为“给我民的儿子们”，在婚宴语境中很可能指她本族的男性同伴；正文用自然的集合表达，避免“我民的儿子们”在中文中的生硬和误解。
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: 却没有把谜底告诉我
  rationale: נגד 的基本意思是“告诉、使知道”。中文若只说“没有告诉我”，宾语容易悬空；根据上下文补出“谜底”，明确所告知的内容而不改变意义。
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留引起对方注意并加强论证的语用功能，符合现代口语对话。
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: 我连自己的父母都没有告诉
  rationale: 同时涵盖原文明确提到的父亲和母亲；“连……都”自然体现参孙反驳中的递进力度。
- source_word: וְלָךְ אַגִּיד
  choice: 难道会告诉你吗
  rationale: 原文形式可直译为“岂会告诉你”，语境中是反问；此译保留其修辞性质和未明说的比较逻辑。
