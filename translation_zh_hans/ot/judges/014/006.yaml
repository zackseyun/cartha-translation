base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: zh_hans
  text: 雅威的灵猛然临到他[a]，他就把它撕裂，像撕开一只小山羊那样[b]，尽管他手中什么也没有。但他没有把自己所做的事告诉父亲和母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“强有力地临到他”或“大有能力地临到他”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“像撕开一只小山羊那样”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: 猛然临到他
  rationale: צלח与עַל连用，在《士师记》中表示上帝的灵以突然而强有力的方式临到并赋予能力；“猛然临到”既保留动态力度，也符合现代汉语表达。
- source_word: רוּחַ יְהוָה
  choice: 雅威的灵
  rationale: רוּחַ在这里指上帝赋予能力的灵，而非风或人的心态；יְהוָה按其专名音译为“雅威”。
- source_word: וַיְשַׁסְּעֵהוּ
  choice: 他就把它撕开
  rationale: שׁסע表示用力撕裂、扯开；宾语代词回指上文的狮子，中文用“它”自然承接，又不在本节增添原文未重复的名词。
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: 如同撕开一只山羊羔一样
  rationale: 该短语以撕开幼小山羊作比较，强调动作轻易；“山羊羔”比单说“羊羔”更准确地表达גְּדִי。
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: 尽管他手中什么也没有
  rationale: 原句强调他未持任何器物；“尽管”自然体现此分句相对于惊人行动的让步意味，但不直接增译“武器”。
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: 但他没有……告诉父亲和母亲
  rationale: 保留两位家长的明确并列；“但”传达叙事推进中与前述非凡事件形成的轻微转折。
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: 自己所做的事
  rationale: 准确保留关系结构所指的既成行动，语言庄重而自然。
theological_decisions:
- issue: 神圣名字יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近当前学界通行的拟音，并保留其作为专名的性质。
- issue: רוּחַ在本节的所指
  choice: 雅威的灵
  alternative: 雅威的风／能力
  rationale: 上下文描写参孙获得超常力量，支持将רוּחַ理解为上帝临到并赋能的灵；译文不进一步界定其后期系统神学含义。
translation_notes:
  register: 采用现代、庄重且易懂的叙事汉语。“猛然临到”保留原文的突发性和力度；“手中什么也没有”不把原文隐含的“未持武器”明说出来。所有脚注标记均置于对应词句之后。
