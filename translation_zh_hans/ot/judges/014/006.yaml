  to: 雅威的灵猛然临到他[a]，他就把它撕裂，像撕开一只小山羊那样[b]，尽管他手中什么也没有。但他没有把自己所做的事告诉父亲和母亲。
  rationale: 修订仅提升动作动词和比较语的汉语自然度与精确性。“撕裂”更充分表达原文的猛烈撕开；“小山羊”准确且通顺。保留“它”以承接上文的狮子，保留“尽管”以自然表达手中无物与行动之间的对照，也保留神名“雅威”及全部脚注锚点。
