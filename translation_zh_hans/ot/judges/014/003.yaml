base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: zh_hans
  text: 他的父母对他说：“难道在你弟兄的女儿中[a]，或在我所有同胞中，找不到女子吗？你竟要到未受割礼的非利士人中娶妻？”参孙对父亲说：“你替我把她娶来吧，因为她在我眼中是对的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你弟兄的女儿”很可能泛指参孙亲族或同族中的女子，并不一定只指他亲兄弟的女儿。
    reason: cultural_note
  - marker: b
    text: 也可译作“她正合我意”或“我看她正合适”。希伯来语这一说法可表示个人的认可、中意或觉得合适；正文保留原有措辞，以呼应《士师记》中反复出现的“在自己眼中看为正”的主题。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: 难道……找不到……吗
  rationale: 用现代汉语的反问句自然表达带否定词的希伯来语疑问结构。
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: 在你弟兄的女儿中
  rationale: 保留原文的亲属称谓，不直接概括为“本族女子”；脚注说明“弟兄”在此可能具有较宽泛的亲族含义。
- source_word: וּבְכָל עַמִּי
  choice: 或在我全族中
  rationale: 保留第一人称单数“我”，并以“全族”自然表达 עַם 在此处所指的本族群体。
- source_word: הוֹלֵךְ לָקַחַת אִשָּׁה
  choice: 竟要……娶妻
  rationale: “娶妻”准确表达婚姻语境；“竟要”传达父母反问中的惊讶和不赞同，而不额外添加动机。
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: 未受割礼的非利士人
  rationale: 保留具有以色列圣约文化色彩的称谓“未受割礼”，不将其弱化为一般族群称呼。
- source_word: אוֹתָהּ קַח לִי
  choice: 你给我娶她吧
  rationale: 符合古代由父亲出面安排婚姻的语境，同时保留参孙命令式请求的语气。
- source_word: יָשְׁרָה בְעֵינַי
  choice: 她在我眼中是对的
  rationale: 有意保留“在我眼中”和“对的”这两个语义成分，以呼应《士师记》中反复出现的“在自己眼中看为正”的主题措辞；脚注交代该习语也可表示中意或合适。
theological_decisions:
- issue: יָשְׁרָה בְעֵינַי 与《士师记》全书主题用语的呼应
  choice: 她在我眼中是对的
  alternative: 她正合我意；我看她正合适
  rationale: 原句既可表达个人中意、觉得合适，也与全书“各人行自己眼中看为正的事”的措辞形成张力。正文保留较直译的表达，不替读者预先判定此处只谈吸引力还是也带有道德评价。
- issue: “未受割礼”称谓的圣约与族群色彩
  choice: 未受割礼的非利士人
  alternative: 非利士人
  rationale: 原文明确使用该称谓，反映参孙父母所持的以色列身份视角；保留它，但不在正文中扩展其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“竟要”体现父母反问的责难语气；末句刻意保留略显突出的“在我眼中是对的”，以保存原文的习语形式和全书叙事呼应。
