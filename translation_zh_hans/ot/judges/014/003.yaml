- from: 他的父母对他说：“难道在你弟兄的女儿中[a]，或在我全族中，找不到女子吗？你竟要到未受割礼的非利士人中娶妻？”参孙对父亲说：“你给我娶她吧，因为她在我眼中是对的[b]。”
  to: 他的父母对他说：“难道在你弟兄的女儿中[a]，或在我所有同胞中，找不到女子吗？你竟要到未受割礼的非利士人中娶妻？”参孙对父亲说：“你替我把她娶来吧，因为她在我眼中是对的[b]。”
  rationale: 修订仅消除“给我娶她”可能使父亲成为娶妻者的汉语歧义，并以“所有同胞”更自然、较不限缩地表达“我所有的民”。其余文字及脚注均忠实保留原文的措辞、语气、文化语境与习语的开放性。
