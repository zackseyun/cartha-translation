base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: zh_hans
  text: 在那些日子，以色列中没有王。在那些日子，但支派正在为自己寻找一份产业，作为居住之地，因为直到那日，在以色列各支派中，还没有产业落到它名下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “产业落到它名下”直译为“产业落给它”；这是与抽签分配支派土地有关的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: 以色列中没有王
  rationale: 直接保留希伯来文的历史—政治陈述，不额外加入对君王制度的褒贬。
- source_word: שֵׁבֶט הַדָּנִי
  choice: 但支派
  rationale: 指但的后裔所组成的支派；这是现代中文圣经语境中自然、简洁的表达。
- source_word: מְבַקֶּשׁ לוֹ
  choice: 正在为自己寻找
  rationale: 分词表达持续进行的行动；“正在……寻找”保留这一进行意味，反身表达也对应 לוֹ。
- source_word: נַחֲלָה לָשֶׁבֶת
  choice: 一片可居住的产业
  rationale: נַחֲלָה在此指支派所得的土地产业；“可居住的”自然表达定居用途，同时保留“产业”的承受与分地色彩。
- source_word: לֹא נָפְלָה לוֹ ... בְּנַחֲלָה
  choice: 还没有产业落到它名下
  rationale: 保留“落到”这一与抽签分地有关的原文意象，并用“名下”使现代中文易于理解；“它”以单数回指“支派”。
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: 在以色列各支派中
  rationale: 自然表达其在以色列众支派分地范围内的位置与关系。
theological_decisions:
- issue: “以色列中没有王”的叙事含义
  choice: 作为叙事者的历史—政治陈述照原文保留
  alternative: 将其明确解释为对士师时代的批判，或明确解释为对君王制度的赞同
  rationale: 原文只陈述当时没有王；译文不应消除其可能具有的叙事评价意味，也不应把这种意味扩展为原文未明说的政治或神学结论。
- issue: 但支派尚未得产业与其他经文中其已获分地之间的张力
  choice: 保留本节“还没有产业落到它名下”的表述
  alternative: 改写为“尚未完全占有所得的产业”
  rationale: 希伯来文本身使用“产业尚未落到它”的语言；虽然上下文及其他经文可能引出对实际占领或安居的理解，正文不宜替原文预先化解这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。保留原文两次“在那些日子”的重复，以呈现叙事框架；用“产业”保留支派承受土地的语义，用“落到它名下”兼顾原文意象与现代可读性。
