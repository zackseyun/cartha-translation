base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: zh_hans
  text: 他们离米迦的家已经有一段路程了；米迦家附近各家中的男子聚集起来[a]，追上了但的子孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“呼喊报警”。这个希伯来语动词既可着重于发出警报的呼喊，也可指因呼喊而聚集起来。
    reason: 保留 נִזְעֲקוּ 在“呼喊报警”与“受召集而聚集”之间的词义可能。
lexical_decisions:
- source_word: הֵמָּה
  choice: 他们
  rationale: 独立人称代词承接上文的但人；现代汉语用“他们”自然清楚。
- source_word: הִרְחִיקוּ מִבֵּית מִיכָה
  choice: 离米迦的家已有一段路程
  rationale: רחק 的使役式在此表示已经远离；“已有一段路程”既体现叙事中的先后关系，也避免把距离说得过于确定。
- source_word: הָאֲנָשִׁים
  choice: 人
  rationale: 原文指一群男性，但在“各家中的人”这一汉语语境中，“人”自然地指参与追赶者，不额外暗示所有住户。
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: 米迦家附近各家中的人
  rationale: 原文直译较生硬，עִם 在这里表达相邻或相伴的空间关系；“附近各家”清楚传达邻近住户之意。
- source_word: נִזְעֲקוּ
  choice: 聚集起来
  rationale: זעק 的尼法勒式在此可指因呼喊而召集、集结；下文随即追赶，因此正文采用“聚集起来”，并以脚注保留“呼喊报警”的可能。
- source_word: וַיַּדְבִּיקוּ
  choice: 追上了
  rationale: דבק 的使役式在此表示赶上、追及；“追上了”符合现代汉语叙事表达。
- source_word: אֶת־בְּנֵי דָן
  choice: 但的子孙
  rationale: 保留原文“但之子”的亲族表达，同时在现代汉语中清楚可懂。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将原文较生硬的邻近关系表达为“米迦家附近各家”，并把词义脚注标在“聚集起来”之后，使标记与所解释的词直接对应。
