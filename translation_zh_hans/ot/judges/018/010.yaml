base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: zh_hans
  text: 你们到了那里，就会遇到一群安居无忧的人[a]；那地宽广[b]。因为上帝已经把它交在你们手中；那是一个地方，那里不缺那地所出的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一群安然居住的人”，也可理解为“一群毫无戒备的人”。希伯来文描述他们自觉安全、放心的状态。
    reason: lexical_alternative
  - marker: b
    text: 直译：“宽手”。这是希伯来文形容土地宽阔、辽阔的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם ... תָּבֹאוּ
  choice: 你们到那里时，必看见
  rationale: 希伯来文直译近于“你们来到时，必来到……”，在汉语中重复而生硬。结合目的地和后接宾语“一个民族”，译作“到那里时，必看见”自然表达抵达后所遇见的情形，又不改变句意。
- source_word: עַם בֹּטֵחַ
  choice: 一个安居无忧的民族
  rationale: בֹּטֵחַ 表示处于安全、放心的状态；“安居无忧”保留其主观安全感，不直接将其解释为毫无戒备。
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: 那地宽广
  rationale: רַחֲבַת יָדַיִם 字面为“手宽”，是形容地域宽阔、空间充裕的习语；汉语正文采用自然的习语意义。
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: 上帝已经把那地交在你们手中
  rationale: 完成式把这件事说成已经确定；“交在你们手中”保留希伯来文“在手中”的支配、占有意象。
- source_word: מָקוֹם אֲשֶׁר אֵין שָׁם מַחְסוֹר כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: 那地方地上的一切应有尽有
  rationale: 此处 מַחְסוֹר 表示缺乏；“应有尽有”以自然汉语表达“没有任何缺乏”。末尾 בָּאָרֶץ 按上下文理解为该地境内，而非整个世界。
theological_decisions:
- issue: 非专名语境中 אֱלֹהִים 的译法
  choice: 上帝
  alternative: 神明／诸神
  rationale: אֱלֹהִים 在此搭配单数动词 נְתָנָהּ，并在探子的陈述中指一位施行此事的神，因此采用单数“上帝”，不引入额外的宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安居无忧”保留原文关于安全感的含混性；“应有尽有”自然传达丰足之意，并以脚注交代较直译的结构。
