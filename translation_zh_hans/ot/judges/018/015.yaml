base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: zh_hans
  text: 他们便转到那里去，来到那年轻利未人的家，就是米迦的家，向他问安[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“问他是否安好”。希伯来语这一习语字面意思是询问一个人的平安或安好。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: 他们就转到那里
  rationale: סור表示从原路线转开或转向某处；שָׁמָּה带方向意味。译文保留行动方向，又符合现代汉语叙事表达。
- source_word: וַיָּבֹאוּ אֶל
  choice: 来到
  rationale: בוא与אֶל连用表示来到、到达某处；不译作“进入”，以免添加原文未明确表达的动作。
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: 那年轻利未人的住处
  rationale: נַעַר表示年轻人，הַלֵּוִי标明其利未人身份。此处“住处”自然表达人物所居之地，同时与下文“米迦的家”形成说明关系。
- source_word: בֵּית מִיכָה
  choice: 也就是米迦的家
  rationale: 原文重复“家”，以同位结构进一步说明地点。加入“也就是”明确两种称谓指向同一处，避免汉语读者误解为先后到了两栋房屋。
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: 向他问安
  rationale: 该希伯来语习语字面涉及询问平安、安好，可指问候或询问近况。“问安”简洁自然，并保留其涉及平安状况的含义；脚注列出较直译的理解。
