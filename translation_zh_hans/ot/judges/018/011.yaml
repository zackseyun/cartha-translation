- from: 于是，但人的宗族[a]中有六百人从那里出发，离开琐拉和以实陶；他们都腰佩作战的兵器。[b]
  to: 于是，但支派的宗族中有六百人从那里出发，从琐拉和以实陶而来，腰佩作战的兵器。[a][b]
  rationale: 修订使“但支派的宗族”成为清楚自然的族群表述，并重组地点短语以避免“从那里出发，离开……”的重复。删除“他们都”以避免无必要的强调；保留“腰佩”及相应脚注，以反映原文“束佩/配备”的具体军事意象。
