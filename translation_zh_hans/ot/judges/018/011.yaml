base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: zh_hans
  text: 于是，但支派的宗族中有六百人从那里出发，从琐拉和以实陶而来，腰佩作战的兵器。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宗族”也可译作“家族”；原文所指的是但支派内部按亲属关系组成的群体。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“束佩着作战的器具”，在这里指配备作战装备。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 出发
  rationale: 该动词在叙事中表示拔营动身；“出发”符合现代汉语，也保留了离开原地启程的意思。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接保留原文的地点副词，并承接上文所述地点。
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: 但人的宗族中
  rationale: מִשְׁפָּחָה在这里指但支派内部的亲族群体，比整个支派范围更小；“宗族”比日常核心家庭意义上的“家庭”准确。介词מִן在此按部分关系译为“中”。
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: 离开琐拉和以实陶
  rationale: 两者均为地名；“离开”自然表达重复介词מִן所表示的出发地点。
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: 六百人
  rationale: אִישׁ与数词连用时指所计数的成年男子；本节的军事语境已明确其为男性战士，现代汉语用“六百人”最自然。
- source_word: חָגוּר כְּלֵי מִלְחָמָה
  choice: 腰佩作战的兵器
  rationale: חָגוּר本义为“束上、佩在腰间”，与兵器连用表示武装起来；此译既保留原文的具体形象，也让现代读者清楚其军事含义。
theological_decisions: []
