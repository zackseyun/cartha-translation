  - severity: low
    issue: “从那里出发，离开琐拉和以实陶”造成重复并使地点成分关系略显松散。
    rationale: 原文连续给出“从那里”、宗族来源及“从琐拉和从以实陶”。中文可把后两地直接置于“出发”之后，以清晰保留其出发地功能。
  - severity: low
