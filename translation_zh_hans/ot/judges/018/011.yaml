    rationale: 原文以集体性的六百人描述为“佩带/束着作战器具”；中文无需补入“都”。
  revised_text: 于是，但支派的宗族中有六百人从那里出发，从琐拉和以实陶而来，腰佩作战的兵器。[a][b]
