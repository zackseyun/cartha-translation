  text: וַ/יֹּ֧אמֶר לָ/הֶ֛ם הַ/כֹּהֵ֖ן לְכ֣וּ לְ/שָׁל֑וֹם נֹ֣כַח יְהוָ֔ה דַּרְכְּ/כֶ֖ם אֲשֶׁ֥ר תֵּֽלְכוּ בָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: zh_hans
  text: 祭司对他们说：“你们平安地去吧。你们所走的路就在耶和华面前。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华看着你们所走的路。”原文只说明这条路在耶和华面前，并不一定表示他明确认可这次行动。
    reason: 说明נֹכַח יְהוָה的语义范围，避免读者把“在耶和华面前”自动理解为神的认可或成功保证。
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם הַכֹּהֵן
  choice: 祭司对他们说
  rationale: 按希伯来叙事句式自然转为现代汉语；定冠词所指的是上下文中已经出现的那位祭司。
- source_word: לְכוּ לְשָׁלוֹם
  choice: 你们平安地去吧
  rationale: 保留希伯来语送行或祝愿式表达的语气，同时采用自然、庄重的现代汉语。
- source_word: נֹכַח יְהוָה
  choice: 就在耶和华面前
  rationale: נֹכַח表示在某人面前或视线之内；“就在……面前”既贴近原文，也不擅自加强为认可、赐福或保证成功。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译，以专名表达四字神名，而不以称号替代。
- source_word: דַּרְכְּכֶם אֲשֶׁר תֵּלְכוּ בָהּ
  choice: 你们所走的路
  rationale: דֶּרֶךְ在此既可指道路，也可指行程；“所走的路”保留原文的道路意象，并以简洁汉语表达关系从句。
theological_decisions:
- issue: 祭司的话是否明确宣告耶和华认可并保佑但支派探子的行程
  choice: 译作“你们所走的路就在耶和华面前”
  alternative: “耶和华认可你们的行程”或“耶和华必保佑你们一路顺利”
  rationale: 原文只直接说他们的路在耶和华面前，可表示在他眼前或鉴察之下；没有明确说明神认可、赐福或保证成功。因此保留原文的神学张力，不把祭司的话解释得更强。
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。“平安地去吧”保留祝愿式语气；“所走的路”兼顾字面道路与实际行程。脚注用于保留原文对神是否认可此行的含混性。
