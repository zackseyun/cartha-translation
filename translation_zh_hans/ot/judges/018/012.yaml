  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: zh_hans
  text: 他们上去，在犹大的基列·耶琳安营。因此，那地方直到今日还叫作“玛哈尼·但”；看哪，它在基列·耶琳以西。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִרְיַת יְעָרִים
  choice: 基列·耶琳
  rationale: 按希伯来语地名音译，并用间隔号便于现代读者辨识复合地名。
- source_word: מַחֲנֵה דָן
  choice: 玛哈尼·但
  rationale: 作为地名音译；其字面义为“但营”，但本节是在说明该地点的称呼，故保留专名形式。
- source_word: אַחֲרֵי
  choice: 以西
  rationale: 该词字面可指“后面”，在地理方位表达中可按古代面向东方的方位观念表示“西面”；结合此处地点说明译为自然的现代汉语“以西”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文提示读者注意地点说明的语气，采用庄重而通行的圣经叙事表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“看哪”的原文话语标记；地名统一音译，不在正文中以意译替代专名。
