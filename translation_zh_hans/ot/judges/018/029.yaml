  text: וַ/יִּקְרְא֤וּ שֵׁם הָ/עִיר֙ דָּ֔ן בְּ/שֵׁם֙ דָּ֣ן אֲבִי/הֶ֔ם אֲשֶׁ֥ר יוּלַּ֖ד לְ/יִשְׂרָאֵ֑ל וְ/אוּלָ֛ם לַ֥יִשׁ שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: zh_hans
  text: 他们给那城起名叫但[a]，是按他们的祖先但的名字起的；这位但是以色列所生的。不过，那城从前名叫拉亿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“他们的父亲但”；“父亲”也可指先祖。
    reason: 说明希伯来语 אָב 在此处的广义谱系用法，并保留原文的字面表达。
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר דָּן
  choice: 他们给那城起名叫但
  rationale: קרא שֵׁם 在此表示命名。中文用“给……起名叫……”自然地表达其含义，同时保留“名”这一成分。
- source_word: בְּשֵׁם דָּן
  choice: 照着……但的名字起的
  rationale: 介词 ב 与 שֵׁם 连用，表示以某人的名字命名；此译法在现代汉语中清楚自然。
- source_word: אֲבִיהֶם
  choice: 他们祖先
  rationale: אָב 可指父亲，也可指先祖；此处但与这些后世但族人相隔多代，故“祖先”准确传达语境中的所指。脚注保留字面译法。
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: 但出生于以色列
  rationale: 关系代词所指为但；将主语“但”明说，避免中文关系结构产生歧义。“以色列”按原文保留，不改作“雅各”。
- source_word: וְאוּלָם
  choice: 但
  rationale: 该词引出新名与旧名的对比；“但”简洁而合乎现代汉语叙事。
- source_word: לַיִשׁ
  choice: 拉亿
  rationale: 按中文圣经地名的通行音译处理。
- source_word: לָרִאשֹׁנָה
  choice: 从前
  rationale: 这里指改名以前，译作“从前”自然且准确。
theological_decisions:
- issue: אֲבִיהֶם 的谱系称谓
  choice: 他们祖先
  alternative: 他们的父亲
  rationale: 原词字面为“父亲”，但希伯来语 אָב 也常泛指先祖。上下文谈的是但支派后人及其先祖但，主文译“祖先”可避免现代读者误以为是直接父子关系，同时以脚注保存字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“给那城起名叫”比逐字译作“称那城的名为”更自然；分为两句，以免关系从句和转折层叠。
