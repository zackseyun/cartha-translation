  to: 他们给那城起名叫但[a]，是按他们的祖先但的名字起的；这位但是以色列所生的。不过，那城从前名叫拉亿。
  rationale: 修订只消除人名“但”与转折连词的歧义，并以“不过”明确对应 וְאוּלָם；保留原文将但称作“他们的父亲／祖先”、并称其“生于以色列”的信息，不将“以色列”替换为“雅各”。
