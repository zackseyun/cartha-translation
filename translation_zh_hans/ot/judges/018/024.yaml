  naturalness: “你们把我所造的神和祭司都带走了，又走了”在现代汉语中自然，且清楚保留两项被带走的对象和对方离去的动作。“你们怎么还对我说”自然地表达反诘语气；引语“你怎么了？”简洁直接。
  terminology: “神”对应 אֱלֹהַי，避免在正文预先限定为“神像”或“偶像”。脚注保留单复数及具体所指的可能性，并说明本章语境涉及米迦家中的敬拜物。“祭司”准确对应 הַכֹּהֵן。
