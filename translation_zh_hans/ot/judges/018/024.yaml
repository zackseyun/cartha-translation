- from: 他说[a]：“你们把我所造的神像和祭司都带走了，就这样走了。我现在还剩下什么呢？你们怎么还能问我：‘你怎么了？’”
  to: 他说[a]：“你们把我所造的神和祭司都带走了，又走了。我现在还剩下什么呢？你们怎么还对我说：‘你怎么了？’”
