  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: zh_hans
  text: 他说[a]：“你们把我所造的神和祭司都带走了，又走了。我现在还剩下什么呢？你们怎么还对我说：‘你怎么了？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神”或译“众神”或“神像”。这里的希伯来词在某些语境中可指单数或复数；本章上下文所指为米迦家中所造的敬拜物。
    reason: 保留 אֱלֹהַי 在数和具体所指方面的词义歧义，同时说明本章语境。
lexical_decisions:
- source_word: אֱלֹהַי
  choice: 我的神像
  rationale: 该词本义可为“我的神”或“我的众神”；本章语境明确涉及米迦所造的雕像、铸像等敬拜物。“神像”在现代汉语中自然地表达这些被视为神明的实体，同时以脚注保留数与所指上的歧义。
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: 我所造的
  rationale: 直接保留关系从句及“制造”的语义，并凸显人手所造之物被称作神的叙事张力。
- source_word: לְקַחְתֶּם
  choice: 你们……带走了
  rationale: 既表达“拿取”，也呈现物品已被从米迦身边带走的结果；二人称复数明确译出。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 所指在上下文中明确，是米迦所立、后来随但人而去的那位祭司；汉语无需另加定冠词。
- source_word: וַתֵּלְכוּ
  choice: 就这样走了
  rationale: 保留但人带着神像和祭司离去的动作，并使连续叙述在现代汉语中自然。
- source_word: וּמַה לִּי עוֹד
  choice: 我现在还剩下什么呢
  rationale: 按希伯来语惯用表达译为失去后的感叹；“还剩下什么”准确传达 עוֹד 的余留含义。
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: 你们怎么还能问我
  rationale: 该表达带有愤慨和反诘意味；“怎么还能”自然承接前句，并避免把原文的质问弱化为单纯询问原因。
- source_word: מַה לָּךְ
  choice: 你怎么了
  rationale: 这是现代汉语中对应“你出了什么事／你有什么问题”的自然问法，保留直接语气。
theological_decisions:
- issue: 在家庭祭祀物语境中如何翻译 אֱלֹהַי
  choice: 我的神像
  alternative: 我的神／我的众神
  rationale: 上下文所指包括人手制作的宗教形像，而希伯来词本身仍是“神”一词，并可有单复数歧义。正文采用自然且符合具体所指的“神像”，脚注列出较形式对应的译法，以保留原文的词义张力和人造之神的讽刺意味，而不引入特定宗派解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“带走了”“还剩下什么”“怎么还能问我”呈现米迦受损后的愤慨和反诘；不以贬义更强的“偶像”替换原文的“神”，以免提前消解叙事张力。
