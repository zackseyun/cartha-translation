  text: וְ/שֵׁשׁ מֵא֣וֹת אִ֗ישׁ חֲגוּרִים֙ כְּלֵ֣י מִלְחַמְתָּ֔/ם נִצָּבִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר אֲשֶׁ֖ר מִ/בְּנֵי דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: zh_hans
  text: 那六百名佩带作战兵器的人，站在城门入口；他们都是但的子孙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们都是但人。”原文直译为“他们是但的子孙”。
    reason: 说明希伯来语亲族称谓既可按字面译为“但的子孙”，也可按族群身份译为“但人”。
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  choice: 那六百名……的人
  rationale: וְ承接上文，在中文叙事中不必机械译作“并且”；结合上下文用“那”自然指回前述队伍。数词后的אִישׁ为集合用法，译作“六百名……的人”。
- source_word: חֲגוּרִים
  choice: 佩带
  rationale: 该分词本义为“束上、系上”，在兵器语境中表示随身装备；“佩带”既保留原文形象，也符合现代汉语军旅表达。
- source_word: כְּלֵי מִלְחַמְתָּם
  choice: 作战兵器
  rationale: כְּלִי含“器具、装备、兵器”等义，与מִלְחָמָה连用时指用于战争的兵器或装备。“作战兵器”保留军事含义，不限定具体武器种类；物主后缀所表达的归属在中文中可由语境自然体现，无须生硬重复“他们的”。
- source_word: נִצָּבִים
  choice: 站在
  rationale: 分词描绘当时持续的站立状态；“站在”简洁自然，并保留场景铺陈作用，而不额外解释为奉命“驻守”。
- source_word: פֶּתַח הַשָּׁעַר
  choice: 城门入口
  rationale: פֶּתַח指开口或入口，הַשָּׁעַר在本段语境中为城门；“城门入口”保留两个名词的关系，也符合现代汉语。
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: 他们都是但的子孙
  rationale: 关系从句说明这六百人的归属。译文补出“他们都是”以使汉语句法清楚，并保留“但的子孙”这一亲族表述，而未直接改成族群称谓“但人”。
theological_decisions: []
