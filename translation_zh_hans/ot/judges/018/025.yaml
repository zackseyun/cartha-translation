  rationale: 修订保留原文“听见你的声音”的表达及警告语气；将威胁后果直述为米迦和全家丧命，不额外加入“连累”的归责意味。对“心怀苦毒的人”保留较贴近原文的译法，并以脚注呈现语境中的可能含义。
