base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: zh_hans
  text: 但支派的人对他说：“不要让我们听见你的声音，免得有些心怀苦毒的人攻击你们，你和你全家的人都丧命。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: 但人
  rationale: 这是支派称谓；现代汉语以“但人”简洁自然地指但支派的人，比直译“但的众子”更符合当代中文表达。
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: 不要让我们听见你的声音
  rationale: 保留希伯来语“听见你的声音”的具体意象，同时自然传达叫米迦住口、不要再争辩的警告语气。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达带威胁意味的否定目的或警告后果，并保持原句的庄重语气。
- source_word: יִפְגְּעוּ בָכֶם
  choice: 袭击你们
  rationale: 此处动词表示敌意相遇并加害；“袭击”清楚传达语境中的暴力威胁。复数“你们”对应 בָכֶם。
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: 性情凶悍的人
  rationale: 该习语字面为“心灵苦毒的人”，语境中指因愤怒、苦毒而危险凶狠的人；此译自然表达其威胁性，同时以脚注保留原文意象和其他可能理解。
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: 使你丧命
  rationale: אָסף 与 נֶפֶשׁ 的组合在这里表示生命被取去；“丧命”准确而凝练，不按字面误译为“收聚生命”。
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: 也连累你全家丧命
  rationale: “家”的生命是集合性表达，指家中成员的性命；“连累”自然呈现米迦的行为将使全家遭祸这一结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。引语保持威胁的力度，但不把“心灵苦毒”过度限定为某一种心理状态。主语用“但人”体现自然的现代汉语支派称谓；结尾用“丧命”清楚表达希伯来习语所指的死亡。
