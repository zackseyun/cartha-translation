  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: zh_hans
  text: 但人从本族各处差派五个能干的人，就是来自琐拉和以实陶的人，去侦察那地并仔细考察。 但人对他们说：“去考察那地。”他们便来到以法莲山区，直抵米迦的家[b]，在那里过夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文作“米迦的家”，也可能指米迦一家居住的院落或整个家宅。
    reason: 古代语境中的“家”可涵盖家庭院落或家宅，而不一定只指一栋房屋。
lexical_decisions:
- source_word: בְנֵי דָן
  choice: 但人
  rationale: 这是现代汉语中自然、清楚的族群称呼，也保留了其作为但支派成员的含义；直译作“但的众子”容易被误解为但本人的直系儿子。
- source_word: מִמִּשְׁפַּחְתָּם
  choice: 从他们的宗族中
  rationale: מִשְׁפָּחָה在此指支派内部的宗族性群体；“宗族”比现代汉语的“家庭”范围更准确，也不至于扩大成整个支派。
- source_word: מִקְצוֹתָם
  choice: 在全族的人里
  rationale: 这里取该短语的部分性用法，表示五人是从整个群体中选出的，而不是按字面译成“从他们的尽头”。
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: 能干的人
  rationale: 该表达可指有能力、有实力或英勇的人；侦察任务的语境首先突出胜任能力，同时以脚注保留“勇士”的可能含义。
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: 来自琐拉和以实陶
  rationale: 采用通行的中文圣经地名译法，并保留两个地点各自由介词引出的来源关系。
- source_word: לְרַגֵּל
  choice: 侦察
  rationale: 该动词表示为获取情报而窥探或侦察；“侦察”在现代汉语中自然，并符合此处寻找可占领土地的任务语境。
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: 仔细考察／考察
  rationale: חקר强调深入查明、探究；首次加“仔细”体现其强度，命令中用“考察”保持词根上的呼应。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 这里指他们准备查探并寻找机会占领的地域；“那地”既自然又不把范围限定得过死。
- source_word: הַר אֶפְרַיִם
  choice: 以法莲山区
  rationale: 该地理表达指以法莲的山地地区，并非一座名为“以法莲山”的单独山峰。
- source_word: עַד בֵּית מִיכָה
  choice: 直抵米迦的家
  rationale: “直抵”体现עַד所表达的到达界限；“米迦的家”保留בֵּית מִיכָה的基本表达，其范围可能不只是一栋住宅。
- source_word: וַיָּלִינוּ שָׁם
  choice: 在那里过夜
  rationale: לון在此表示住宿一夜；“过夜”是清楚自然的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“但人”避免生硬的血缘直译；用“宗族”“全族的人”呈现支派内部选人的层次。叙事连接简洁，命令句直接；对בְּנֵי חַיִל及“米迦的家”的真实语义范围以脚注保留，不作教派化解释。
