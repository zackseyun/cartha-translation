  - marker: b
    text: 原文作“米迦的家”，也可能指米迦一家居住的院落或整个家宅。
    reason: 古代语境中的“家”可涵盖家庭院落或家宅，而不一定只指一栋房屋。
  revision_rationale: 将“从他们的宗族中，在全族的人里”整合为“从本族各处”，避免把两个语义层级混同，并为 מִקְצוֹתָם 保留其“各处／全体中”的范围感。以“差派”对应“差遣”，明确命令的说话者为但人。保留“能干的人”及脚注中的勇力语义，避免在存在词义范围时作不必要的狭窄化。
