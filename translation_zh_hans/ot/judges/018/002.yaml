revisions:
- from: 但人从他们的宗族中，在全族的人里选派了五个能干的人[a]。这五人来自琐拉和以实陶，要去侦察那地，仔细考察。众人对他们说：“去考察那地。”他们便来到以法莲山区，直抵米迦的家[b]，在那里过夜。
  to: 但人从本族各处差派五个能干的人，就是来自琐拉和以实陶的人，去侦察那地并仔细考察。 但人对他们说：“去考察那地。”他们便来到以法莲山区，直抵米迦的家[b]，在那里过夜。
  rationale: 将“从他们的宗族中，在全族的人里”整合为“从本族各处”，避免把两个语义层级混同，并为 מִקְצוֹתָם 保留其“各处／全体中”的范围感。以“差派”对应“差遣”，明确命令的说话者为但人。保留“能干的人”及脚注中的勇力语义，避免在存在词义范围时作不必要的狭窄化。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:45Z'
review_pass:
  verdict: revise
  source_fidelity: 草案整体忠实呈现了差遣、侦察与考察、以法莲山区、米迦的家及过夜等主要信息。但“在全族的人里”与前面的“从他们的宗族中”层级混杂，且将“众人”作为说话者不如明确为但人，容易造成指代不清。
  naturalness: 行文基本自然；不过“从他们的宗族中，在全族的人里选派”略显重复且不够顺畅。“从本族各处差派”既简洁，也较好保留原文 מִקְצוֹתָם 的“从其各处／全体中”这一有争议但可辨的范围含义。
  terminology: “但人”“宗族”“琐拉”“以实陶”“以法莲山区”“米迦”均恰当。“能干的人”可以成立；以脚注说明其亦可有勇力、英勇之意，能避免将 בְּנֵי חַיִל 限定为单纯职业能力。
  issues:
  - severity: medium
    issue: “在全族的人里”与“从他们的宗族中”混用
    rationale: מִמִּשְׁפַּחְתָּם 指“从他们的宗族／氏族中”，而 מִקְצוֹתָם 的精确空间或部分性细节存在解释余地。译作“全族的人”既重复前语，又可能把氏族层级扩大为整个支派。
  - severity: low
    issue: “众人对他们说”指代不够明确
    rationale: 原文的说话者承接前句的但人。现代汉语中“众人”没有清楚先行词，改为“但人对他们说”更明确，且不增添意义。
  - severity: low
    issue: “选派”弱化了差遣行动
    rationale: וַיִּשְׁלְחוּ 的核心是“差遣／派出”；“选派”包含挑选，虽可由上下文推得，却不如“差派”直接对应原文。
  revised_text: 但人从本族各处差派五个能干的人，就是来自琐拉和以实陶的人，去侦察那地并仔细考察。 但人对他们说：“去考察那地。”他们便来到以法莲山区，直抵米迦的家[b]，在那里过夜。
