revisions:
- from: 他们带走了米迦所做的东西，又带走了那给他作祭司的人；他们来到拉亿，攻击那里安静无忧的居民，用刀杀了他们，又放火烧了那城。[a]
  to: 他们带走了米迦所制作的，以及为他服务的祭司；随后来到拉亿，攻打那安静安稳的民众。他们用刀剑击杀了他们[a]，又用火焚烧那城。
  rationale: 修订保持原文的叙事顺序和暴力描写，不额外补充宗教物件或人物背景；以“安静安稳”对应两项形容，以“为他服务的祭司”表达祭司与米迦的从属服务关系而不把人当作财产。脚注改为紧邻对应语句，并准确呈现希伯来语惯用表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:36Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体正确反映了掳取米迦所制之物及其祭司、进攻拉亿、以刀剑杀戮并焚城的叙事。然“安静无忧”把בֹטֵחַ所表达的安全、安稳具体化为“无忧”，略强；“来到拉亿，攻击那里……”也使“来到／攻向拉亿”和“攻打安静安稳的民众”的并列对象关系不够清楚。
  naturalness: “米迦所做的东西”偏口语且指称笼统；“那给他作祭司的人”虽可理解，但不如“为他服务的祭司”自然。修订以现代庄重叙事语体表达，并将脚注标记紧邻所注短语。
  terminology: 保留“米迦”“拉亿”“祭司”等既有名称和术语。将“刀”调整为“刀剑”，较合乎חֶרֶב在此作为兵器的通常含义；脚注说明“刀剑之口”这一希伯来语惯用表达，避免把“口”误作现代汉语中的“刀口”。
  issues:
  - severity: medium
    issue: “安静无忧”略强化原文。
    rationale: שֹׁקֵט וּבֹטֵחַ意为安静、安稳／安全；“无忧”可引申为毫无忧虑，超出较为克制的原文描述。
  - severity: medium
    issue: “来到拉亿，攻击那里安静无忧的居民”弱化了原文两个“攻向／对着”的结构。
    rationale: 原文先说他们来到（攻向）拉亿，继而说攻向一群安静安稳的民众。改为“来到拉亿，攻打那安静安稳的民众”能更清楚保留敌对行动及其对象。
  - severity: low
    issue: 脚注锚点置于全节末尾。
    rationale: 脚注只说明“用刀杀了”的原文惯用语，应紧随该短语，避免读者误以为脚注也涉及焚城。
  - severity: low
    issue: “米迦所做的东西”口语化且过于泛指。
    rationale: “米迦所制作的”在中文中可自然名词化，也保留原文未逐项列举物件的概括性。
