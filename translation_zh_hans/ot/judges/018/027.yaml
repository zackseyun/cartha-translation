base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: zh_hans
  text: 他们带走了米迦所制作的，以及为他服务的祭司；随后来到拉亿，攻打那安静安稳的民众。他们用刀剑击杀了他们[a]，又用火焚烧那城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用刀剑击杀了他们”原文直译为“以刀剑之口击打他们”；“刀剑之口”是希伯来语指刀刃的惯用表达。
    reason: 说明לְפִי חָרֶב的字面形象及其惯用含义。
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: 他们带走了
  rationale: 独立代词 הֵמָּה 强调行动主体；现代汉语以明确的“他们”保留这一点。“带走”既适用于物件，也能自然衔接随后被带走的祭司，并符合上文强取的语境。
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: 米迦所做的东西
  rationale: 直译关系结构，不把上下文所指的宗教物件逐一补入正文，以免超出本节措辞。
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: 又带走了那给他作祭司的人
  rationale: הָיָה לוֹ 字面为“是给他的／属于他的”。结合上下文，译作“给他作祭司”可表达该祭司与米迦家中神堂的关系，又避免把人描述为财产。
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: 他们来到拉亿，攻击
  rationale: בוא על 在军事语境中表示敌对地来到、进攻。汉语采用“来到……攻击”保留“来到”这一动作，同时明确介词 עַל 的敌对含义。
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: 那里安静无忧的居民
  rationale: שֹׁקֵט 表示安静、太平；בֹטֵחַ 表示安稳、有安全感。“安静无忧”保留两项特征，不额外断定他们毫无戒备；“居民”符合城市人口的语境。
- source_word: וַיַּכּוּ אוֹתָם לְפִי חָרֶב
  choice: 用刀杀了他们
  rationale: נכה 配合“刀口”惯用语，在此毁城叙事中表示以刀击杀。现代汉语“用刀杀了”自然明确；“刀”在此指刀剑类兵器，并非现代餐刀。
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: 又放火烧了那城
  rationale: “放火烧了”自然保留 שׂרף 与 בָאֵשׁ 的动作和手段，也传达希伯来语末句的强烈画面。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号划分掳取与进攻两个阶段；避免使用带明显古典色彩的“刀刃击杀”，也不把本节未逐项列出的宗教物件补入正文。脚注标记置于整节末尾，对应“用刀杀了”的原文惯用语。
