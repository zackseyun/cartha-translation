  yaml_path: translation/ot/judges/018/021.yaml
  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: zh_hans
  text: 于是他们转身继续前行，把孩子、牲畜和财物[a]置于他们前面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财物”或译“行李”、“家当”。希伯来语在这里指可携带的财产或物品。
    reason: lexical_alternative
  - marker: b
    text: 直译“在他们前面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ וַיֵּלֵכוּ
  choice: 他们转身离去
  rationale: פנה表示“转身、转向”，הלך表示“走、离去”；合译为“转身离去”，既保留两个连续动作，也符合现代汉语叙事表达。
- source_word: הַטַּף
  choice: 孩子
  rationale: טף指群体中的幼小者，尤其是尚不能作战的儿童；“孩子”自然准确，不额外扩展为所有受抚养者。
- source_word: הַמִּקְנֶה
  choice: 牲畜
  rationale: מקנה泛指所饲养或拥有的群畜，并不限于牛；“牲畜”范围恰当。
- source_word: הַכְּבוּדָּה
  choice: 财物
  rationale: כבודה在此旅行语境中指可携带的财产或辎重，而不是抽象的“荣耀”；“财物”既自然，也保留其可指贵重物品或行装的宽度。
- source_word: לִפְנֵיהֶם
  choice: 在自己前面
  rationale: 字面义为“在他们前面”；此处主语与代词所指相同，用“自己”清楚表达他们把孩子、牲畜和财物置于本队前方。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“安置”比口语化的“放”更适合人员、牲畜和财物并列的场景；“在自己前面”保留原文空间关系，不进一步断定这是出于防卫策略。
