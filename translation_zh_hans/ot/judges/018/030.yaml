base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: zh_hans
  text: 但族人为自己立了那尊雕刻的像。革舜的儿子约拿单，是摩西的孙子[a]；他和他的子孙都作但支派的祭司，直到那地遭掳掠的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本写作“摩西”；马所拉文本中有一个悬置的字母，使之形成传统读法“玛拿西”。
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ לָהֶם
  choice: 就为自己立了
  rationale: קום的使役形在此指使某物立起、设立；“立了”自然简洁。“为自己”表达לָהֶם所带的自身受益意味。
- source_word: בְּנֵי דָן
  choice: 但族人
  rationale: 希伯来语直译为“但的众子”，在现代汉语中“但族人”既清楚自然，又保留其族群含义。
- source_word: הַפָּסֶל
  choice: 那尊雕像
  rationale: פֶּסֶל具体指雕刻而成的像；量词“尊”符合汉语习惯，而“雕像”避免把经文本身未明说的评价直接译作“偶像”。
- source_word: וִיהוֹנָתָן בֶּן־גֵּרְשֹׁם בֶּן־מְשֶׁה
  choice: 革舜的儿子、摩西的孙子约拿单
  rationale: 按汉语谱系表达调整语序，并依据辅音文本及悬置字母所保留的基础读法译作“摩西”；传统读法另见脚注。
- source_word: וּבָנָיו הָיוּ כֹהֲנִים
  choice: 他和他的子孙都作……祭司
  rationale: 补出“他”以明确约拿单与其后代同为主语；בנים在延续至被掳时期的语境中可包含历代后裔，译作“子孙”更符合汉语表达。
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: 作但支派的祭司
  rationale: לְ在此表示为该支派供职；“但支派”是现代汉语中自然、准确的表达。
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: 直到那地被掳的日子
  rationale: 保留原文简短而略显特殊的表达，不具体认定所指哪一次被掳；以“那地被掳”体现גְּלוֹת הָאָרֶץ的字面关系。
theological_decisions:
- issue: 约拿单祖先名字的文本读法
  choice: 摩西
  alternative: 玛拿西
  rationale: 马所拉文本的基础辅音指向“摩西”，但传统以悬置的字母נ形成“玛拿西”的读法。正文采用基础读法，脚注保留传统读法，以呈现抄传传统有意保存的张力。
- issue: “那地被掳”所指的历史事件
  choice: 不在译文中具体判定
  alternative: 明确解释为某一次特定的被掳或迁徙
  rationale: 原文没有明说具体事件；直译其概括性表达可避免把有争议的历史认定写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雕像”保留具体造物含义；“但族人”与后文“但支派”避免机械重复；正文脚注标记[a]与脚注完全对应。
