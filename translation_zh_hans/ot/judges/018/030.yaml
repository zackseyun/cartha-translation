  to: 但族人为自己立了那尊雕刻的像。革舜的儿子约拿单，是摩西的孙子[a]；他和他的子孙都作但支派的祭司，直到那地遭掳掠的日子。
  rationale: 修订仅改善汉语表达并澄清谱系和脚注的文本学说明：“雕刻的像”更贴近פֶּסֶל；“那地遭掳掠的日子”保留原文对事件及其性质的简略、未定表述，不将其解释为某次特定的流放或迁徙。
