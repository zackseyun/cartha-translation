  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: zh_hans
  text: 他们对他说：“不要出声[a]！把手放在嘴上，跟我们走，作我们的父[b]和祭司。你作一个人的家中的祭司好呢，还是作以色列中一个支派和宗族[c]的祭司好呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“安静！”“不要作声！”希伯来语这个命令可表示安静或保持沉默。
    reason: lexical_alternative
  - marker: b
    text: 这里的“父”是社会或宗教领袖的称号，并非指生理上的父亲。
    reason: cultural_note
  - marker: c
    text: “宗族”或译“家族”；希伯来语所指的是支派内部的亲族群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: 不要出声
  rationale: 这是命令式，意为保持安静、不作声。“不要出声”符合现代汉语，也保留了制止他说话的语气。
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: 用手捂住嘴
  rationale: 既保留手放在嘴上的具体动作，也自然传达闭口不言、自我克制的惯用含义。
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: 作我们的父和祭司
  rationale: 保留“父”与“祭司”并列的双重身份，不把“父”缩窄解释成顾问、领袖或庇护者。
- source_word: הֲטוֹב
  choice: 好呢，还是……好呢
  rationale: 原文以疑问形式比较两种处境；汉语用选择问句自然表达隐含的“哪一个更好”。
- source_word: לְבֵית אִישׁ אֶחָד
  choice: 一个人家里的
  rationale: בֵּית在此指一人的家或家户；此译法既自然，也保存与后文较大群体之间的对比。
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: 以色列一个支派和宗族
  rationale: שֵׁבֶט译为“支派”；מִשְׁפָּחָה指支派内部的亲族群体，译为“宗族”可与现代意义较窄的“家庭”区别开来。
theological_decisions:
- issue: “父”（אָב）作为称号的含义
  choice: 正文直译为“父”，并用脚注说明其非生理关系
  alternative: 顾问、领袖、庇护者
  rationale: 原文把“父”与“祭司”并列，含有社会或宗教领袖称号的意味。保留原词可避免把其职能限定为某一种解释。
- issue: מִשְׁפָּחָה所指的亲族单位
  choice: 译为“宗族”
  alternative: 家族、家庭
  rationale: 这里与“支派”并列，并与“一个人家里”形成规模上的对比；“宗族”较能体现以色列社会中的亲族群体层级。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不要出声”保留命令力度；“作我们的父”虽带古代文化色彩，却有意保存原文称号，并以脚注澄清。“支派和宗族”维持原文社会结构的层级区别。
