review_pass:
  verdict: revise
  source_fidelity: 初句的“喊话”和“但人转过身来”基本符合 וַיִּקְרְאוּ、וַיַּסֵּבּוּ פְּנֵיהֶם。但将 נִזְעָקְתָּ 译为“召集人来”不合该动词在此处的直接词义；它指“呼喊／发出呼号”，而非“召集”。虽然18:22提到米迦的邻人聚集，不能据此改变本节第二人称单数动词的语义。
  naturalness: “他们向但人呼喊；但人转过身来”在现代标准汉语中自然、清楚。问句改为“你怎么了，为什么这样呼喊？”既自然，也准确表达 מַה־לְּךָ 与 כִּי 所引出的缘由。
  terminology: “但人”是自然且准确的支派成员称法；脚注保留“但的子孙”的字面表达即可。“米迦”及叙事语体均恰当。
  issues:
  - severity: high
    issue: 将 נִזְעָקְתָּ 译作“召集人来”
    rationale: נִזְעָקְתָּ 是 זעק 的Niphal完成式第二人称单数，意为“你呼喊了／发出呼号了”。上下文中聚集的人并不使该动词本身变为“召集”。原脚注“聚众而来”同样不应作为此词的译法。
  - severity: medium
    issue: “竟”使原文语气略被加强且未明确呈现因果问法
    rationale: כִּי 在此可自然处理为“为什么／以致”。“为什么这样呼喊”更直接呈现问句所问的缘由，避免加入“竟”所带的额外惊异或谴责色彩。
  revised_text: 他们向但人[a]呼喊；但人转过身来，对米迦说：“你怎么了，为什么这样呼喊[b]？”
  revised_footnotes:
