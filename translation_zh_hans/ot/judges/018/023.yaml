revisions:
- from: 他们向但人[a]喊话。但人转过身来，对米迦说：“你怎么了，竟召集人来[b]？”
  to: 他们向但人[a]呼喊；但人转过身来，对米迦说：“你怎么了，为什么这样呼喊[b]？”
  rationale: 修订保留原文的叙事次序、但支派称谓和“转过身来”的动作，同时将 נִזְעָקְתָּ 恢复为其可由原文支持的“呼喊／发出呼号”义。将 כִּי 译为“为什么”使汉语问句自然，并保留原文所表达的缘由关系。
