base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: zh_hans
  text: 他们向但人[a]呼喊；但人转过身来，对米迦说：“你怎么了，为什么这样呼喊[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译“但的子孙”，即但支派的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“发出呼号”或“呼救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: 喊话
  rationale: קרא在这里指从后方向对方高声呼叫；“喊话”自然地表达可听见的呼喊，又不必暗示哀号。
- source_word: אֶל־בְּנֵי דָן
  choice: 向但人
  rationale: 字面是“向但的子孙”。现代汉语用“但人”清楚表达但支派的人，字面形式在脚注中保留。
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: 转过身来
  rationale: 希伯来语字面为“转过他们的脸”；此处表示但人听见后回身面对追来的人。
- source_word: לְמִיכָה
  choice: 对米迦
  rationale: 按上下文自然表达说话的对象；米迦是受话者，也代表与他同来的一群人。
- source_word: מַה־לְּךָ
  choice: 你怎么了
  rationale: 这一惯用语询问对方出了什么事或为何如此行动；“你怎么了”简洁自然，并保留语气上的责问意味。
- source_word: כִּי
  choice: 竟
  rationale: 此处引出引发前一问句的情形或缘由。汉语“竟”衔接自然，也传达但人对米迦此举的质问语气。
- source_word: נִזְעָקְתָּ
  choice: 召集人来
  rationale: זעק的Nifal形在本段紧接18:22，主要指因呼号而被召集、聚集。虽为第二人称单数，所问对象是米迦，意思可指他召集随从前来；这一译法比单纯“呼喊”更贴合近距上下文，同时以脚注保留词义和语法上的其他理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。“喊话”适合两群人相隔一段距离时的呼叫；“召集人来”结合18:22的直接上下文处理 נִזְעָקְתָּ，同时用脚注保留其可理解为被召集、聚众或呼号的歧义。
