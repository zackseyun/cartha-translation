base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: zh_hans
  text: 他们为自己立了米迦所造的雕刻的像[a]；在上帝的殿位于示罗的所有日子里，这像一直立在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“偶像”。希伯来语指用于祭祀的雕刻形像；“雕刻的像”保留其作为制成之物的具体含义，“偶像”则更明确地表达其用途。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: 他们为自己立了
  rationale: שׂים的基本义是“放置、设立”；在祭祀设施的语境中，“立了”自然表达把像安置起来的意思，并以“为自己”保留לָהֶם的受益或归属意味。
- source_word: פֶּסֶל
  choice: 雕像
  rationale: 该词指为祭祀用途制作的雕刻形像。“雕像”保留其具体、制成之物的含义；“偶像”虽能点明功能，却更具解释性，因此列入脚注。
- source_word: מִיכָה
  choice: 米迦
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所造的
  rationale: 关系从句修饰“雕像”；“所造的”简洁、庄重，也清楚表明雕像是米迦先前制成的。
- source_word: כָּל יְמֵי הֱיוֹת
  choice: ……的那些日子里……一直
  rationale: 以自然中文表达该时间结构的持续含义，并保留它涵盖整个时期的语气。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: 直接保留“上帝之殿”的表达，不把它解释性地改译为“圣所”或进一步说明其正统地位。
- source_word: בְּשִׁלֹה
  choice: 设在示罗
  rationale: 示罗按中文通行形式音译；“设在”比单用“在”更自然地说明敬拜场所位于该地。
theological_decisions:
- issue: 在但支派的祭祀体系与示罗的中央敬拜场所并存的语境中，如何翻译בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  alternative: 上帝的圣所
  rationale: 原文用语本身没有添加明确的褒贬说明。“上帝的殿”保留叙事中两者并存所形成的神学张力，不以解释性称谓替读者作出额外判断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这像一直立在那里”把原文时间短语所限定的持续状态在中文中明说出来，避免译文成为动作延续整段时期的不自然表达；不额外说明示罗敬拜场所与但支派祭祀的合法性。
