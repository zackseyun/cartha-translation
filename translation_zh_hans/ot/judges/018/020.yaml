base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: zh_hans
  text: 祭司心中欢喜，就拿了以弗得、家神[a]和雕刻的神像[b]，走进众人中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家用偶像”，也可音译为“特拉芬”；希伯来语所指的是家庭祭祀用的神像或神祇。
    reason: lexical_alternative
  - marker: b
    text: 或译“偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: 祭司心中欢喜
  rationale: 原文直译近于“祭司的心欢喜/觉得好”。“心中欢喜”既保留希伯来语的“心”意象，也符合现代汉语表达。
- source_word: הָאֵפוֹד
  choice: 以弗得
  rationale: 这是特定的礼仪用语；采用中文圣经中通行的音译，避免以不确定的解释取代原词。
- source_word: הַתְּרָפִים
  choice: 家神
  rationale: 该词指家庭祭祀所用的神像或神祇。“家神”简明自然，同时以脚注说明也可理解为家用偶像或音译为“特拉芬”。
- source_word: הַפָּסֶל
  choice: 雕刻的神像
  rationale: 该词指经雕刻制成的像，且在本语境中具有崇拜对象的含义；此译法兼顾制作方式与宗教语境。
- source_word: בְּקֶרֶב הָעָם
  choice: 走进众人中间
  rationale: 原文既有进入的动作，也有“在……中间”的空间含义；这一表达自然地保留两者。
theological_decisions:
- issue: 如何称呼 תְּרָפִים 而不预先肯定或否定其神性
  choice: 正文译作“家神”，脚注说明其为家庭祭祀用的神像或偶像
  alternative: 家用偶像；特拉芬
  rationale: “家神”传达其家庭宗教功能；脚注保留该词可指具体祭祀物件的含义，避免把有意涵空间的古代术语单一化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“心中欢喜”保留原文意象；“走进众人中间”呈现动作与位置。英文咨询层中脚注[a]的位置与内容明显不对应，因此中文稿将有关“特拉芬”的注释标在“家神”之后。
