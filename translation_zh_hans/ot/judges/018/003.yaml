base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: zh_hans
  text: 他们在米迦家附近时，认出了那个年轻的利未人的声音；于是他们转到那里去，对他说：“谁把你带到这里来的？你在这个地方做什么[a]？你在这里有什么事[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你在这件事上做什么？”；这句话也可理解为“你在这里做什么？”。
    reason: 保留בָּזֶה在地点义和与“这件事”相关的意义之间的省略与含混。
  - marker: b
    text: 也可较字面地译为“你在这里有什么？”。
    reason: 希伯来语מַה לְּךָ פֹה可按字面询问“你有什么”，也常用来询问一个人在此有何事务或理由。
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: 他们在米迦的住宅附近时
  rationale: עִם在这里表示位置上的“在……旁边、附近”，并非与房屋结伴；用“附近”自然表达叙事场景，同时保留其概略性。
- source_word: הִכִּירוּ אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: 认出了那个年轻利未人的声音
  rationale: הִכִּירוּ在此指辨认、认出；קוֹל指人的声音；הַנַּעַר הַלֵּוִי自然理解为“那个年轻利未人”。
- source_word: וַיָּסוּרוּ שָׁם
  choice: 就转到那里
  rationale: סור表示从原来路线转向一旁或转入某处；“转到那里”既保留动作，也避免过度明确他们进入了哪一建筑。
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: 谁把你带到这里来的？
  rationale: הֱבִיאֲךָ是בוא的使役式，意为“把你带来”；הֲלֹם意为“这里”。
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: 你在这个地方做什么？
  rationale: בָּזֶה字面为“在这个里面／用这个”，表达略显省略；按上下文采用地点义“在这个地方”，并以脚注保留原文的含混。
- source_word: וּמַה לְּךָ פֹה
  choice: 你在这里有什么？
  rationale: מַה לְּךָ פֹה可问一个人在此有何所有、利害或事务；正文采用较贴近原文的“有什么”，脚注说明自然的语用理解。
