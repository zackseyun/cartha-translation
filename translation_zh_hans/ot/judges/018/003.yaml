  to: 他们在米迦家附近时，认出了那个年轻的利未人的声音；于是他们转到那里去，对他说：“谁把你带到这里来的？你在这个地方做什么[a]？你在这里有什么事[b]？”
  rationale: 修订限于提升现代标准汉语的自然度，并使两个脚注更准确地说明原文的语义范围。正文仍保留地点义的“在这个地方做什么”，而将末句按其惯用问法译为“有什么事”，同时以脚注保留字面表达。
