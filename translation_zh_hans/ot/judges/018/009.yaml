  rationale: 修订限于消除原文未明示的反问强化，并使末句更贴近希伯来文“去、进入、取得那地”的行动链条。“攻打他们”保留，因其在本段侦察与出征的语境中准确自然。
  reviewer_model: gpt-5.6-terra
