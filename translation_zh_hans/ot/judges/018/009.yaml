base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: zh_hans
  text: 他们说：“起来！我们上去攻打他们吧！我们已经看过那地，看哪，那地非常好。你们却默不作声。不可迟延，前去，进入并取得那地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה
  choice: 起来
  rationale: 保留命令式的号召语气；此处是催促众人立即行动。
- source_word: וְנַעֲלֶה עֲלֵיהֶם
  choice: 我们上去攻打他们吧
  rationale: “上去攻击某人”在此语境中表示军事进攻；译出“攻打”比直译“上到他们那里”自然清楚。
- source_word: מַחְשִׁים
  choice: 还默不作声
  rationale: 该分词本义为保持沉默；保留其责问意味，不径自解释为单纯无所作为。
- source_word: אַל־תֵּעָצְלוּ
  choice: 不要迟延
  rationale: 动词表示懒散、拖延或行动迟缓；结合出征语境，“不要迟延”自然表达催促之意。
- source_word: לָלֶכֶת לָבֹא לָרֶשֶׁת
  choice: 要前去，进入那地，占领它
  rationale: 保留原文连续三个不定式所形成的递进：前去、进入、取得产业；在军事语境中“占领”准确自然。
theological_decisions:
- issue: לָרֶשֶׁת 的产业/占领含义
  choice: 占领它
  alternative: 得那地为业
  rationale: 此处是但支派探子鼓动军事行动，直接语境侧重实际夺取土地；译作“占领”不额外赋予神学正当性，也不否认该词常有承受产业的含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。以感叹句和问句呈现原话中的急切催促；“看哪”保留希伯来语 הִנֵּה 的现场强调色彩。
