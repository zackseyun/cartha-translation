  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: zh_hans
  text: 他们来到琐拉和以实陶的弟兄们那里[a]。弟兄们问他们：“你们有什么消息？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可译作“同族的人”；希伯来语可指同一宗族或支派的亲属，不一定是亲兄弟。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文的问话非常简略，直译近似“什么，你们？”。在此处可理解为询问他们带回什么消息或报告；原文没有具体说明所问的内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们来到
  rationale: 叙事性连续式推动情节发展；“来到”自然表达人物抵达目的地，不额外强化原文未明说的返回含义。
- source_word: אֶל אֲחֵיהֶם
  choice: 弟兄们那里
  rationale: 保留אָח的基本称谓“弟兄”，同时用脚注说明在支派和宗族语境中也可泛指同族亲属。
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: 琐拉和以实陶
  rationale: 按现代中文圣经地名惯例音译两个地名。
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: 弟兄们问他们
  rationale: 保留原文明确重复的主语“他们的弟兄”；鉴于后接疑问句，汉语用“问”比直译为“说”更自然。
- source_word: מָה אַתֶּם
  choice: 你们怎么样？
  rationale: 原文极为简略，字面近似“什么，你们？”。此译保留询问内容的开放性，既可指他们的情况，也可指他们带回的消息，不将含义限定为某一种具体报告。
