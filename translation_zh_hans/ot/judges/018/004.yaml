base_translation:
  language: en
  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: zh_hans
  text: 他对他们说：“米迦如此这般待我[a]，又雇了我，我就作了他的祭司。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“这样那样”；这是希伯来语的概括性说法，指前面所述的事情，不再逐一复述。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 他对他们说
  rationale: 以现代汉语自然表达叙事中的回应；不逐字译出句首连接词，但保留事件的先后推进。
- source_word: כָּזֹה וְכָזֶה
  choice: 如此这般
  rationale: 这是概括前述情形而不逐项复述的希伯来语习语；“如此这般”既保留概括性，也适合庄重而通顺的现代汉语。
- source_word: עָשָׂה לִי
  choice: 待我
  rationale: עשה与לִי连用，表达米迦对说话人所做的事或所作的安排；结合“如此这般”，“如此这般待我”比机械的“为我做”更符合汉语，同时未把具体内容说死。
- source_word: מִיכָה
  choice: 米迦
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וַיִּשְׂכְּרֵנִי
  choice: 又雇了我
  rationale: שׂכר在此指付酬雇用；“雇了我”直接清楚，“又”承接前一项叙述。
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: 我就作了他的祭司
  rationale: היה在事件推进中表示进入新的身份；“就作了”体现雇用之后成为祭司的结果，לוֹ则自然译为“他的”。
theological_decisions:
- issue: 非正规敬拜环境中祭司职分的性质
  choice: 他的祭司
  alternative: 给他作祭司
  rationale: 原文לוֹ לְכֹהֵן表明此人以祭司身份为米迦服务。“他的祭司”保留这种个人隶属关系，但不对该安排是否合法作出文本之外的判断。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“如此这般”略带书面色彩，用来保留原文习语的概括性；全句不补入对米迦祭司安排是否合法的评价。
