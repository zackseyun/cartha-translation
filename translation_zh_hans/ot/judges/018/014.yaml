  terminology: “以弗得”适当保留专名性器物术语。“家神”可行，但其所指究竟偏向家神还是家庭祭祀用神像仍有词义层面的不确定性，脚注应明确保留“特拉非”音译及“家庭神像”这一理解。“雕刻的神像”和“铸像”保留了פֶּסֶל与מַסֵּכָה的区别，未将四项器物不当地合并。
