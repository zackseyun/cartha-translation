  text: וַֽ/יַּעֲנ֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּל֮ אֶת הָ/אָ֣רֶץ לַיִשׁ֒ וַ/יֹּֽאמְרוּ֙ אֶל אֲחֵי/הֶ֔ם הַ/יְדַעְתֶּ֗ם כִּ֠י יֵ֣שׁ בַּ/בָּתִּ֤ים הָ/אֵ֨לֶּה֙ אֵפ֣וֹד וּ/תְרָפִ֔ים וּ/פֶ֖סֶל וּ/מַסֵּכָ֑ה וְ/עַתָּ֖ה דְּע֥וּ מַֽה תַּעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: zh_hans
  text: 那五个曾去窥探拉亿地区的人对他们的弟兄们说：“你们知道这些房屋里有以弗得、家神[a]、雕刻的神像和铸像吗？现在，你们要想想该怎么办。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家神”也可译作“特拉非”或“家庭神像”；该词指与家庭崇拜有关的神祇或神像。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: 对……说
  rationale: 希伯来语叙事公式直译为“回答说”在现代汉语中较显累赘；此处前文没有直接引语需要回应，因此用自然的“对……说”传达发言动作。
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: 曾去窥探
  rationale: 分词按叙事背景指他们先前承担的侦察任务；“曾去”体现该任务相对于本节发言已经发生。
- source_word: אֶת הָאָרֶץ לַיִשׁ
  choice: 拉亿地
  rationale: אָ֫רֶץ在此指与拉亿相关的地域；“拉亿地”简洁自然，也不把它误解为全地或地球。
- source_word: אֶל אֲחֵיהֶם
  choice: 对他们的弟兄
  rationale: 保留אָח的亲属称谓及其阳性指涉；语境中指同行的但支派男子。
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: 这些房屋里
  rationale: 按בָּתִּים的复数形式译为“房屋”，避免擅自限定为家庭、圣所或建筑群。
- source_word: אֵפוֹד
  choice: 以弗得
  rationale: 这是特定宗教器物，汉语圣经传统音译“以弗得”能保留原词，而不武断限定其具体形制或用途。
- source_word: תְּרָפִים
  choice: 家神
  rationale: 该词指家庭宗教崇拜所用的神像或神祇表象；“家神”简明易懂，同时用脚注保留“神像”这一物质层面的可能表达。
- source_word: פֶסֶל
  choice: 雕刻的神像
  rationale: פֶסֶל突出以雕刻方式制成的像；译文保留制作方式，并以“神像”说明其宗教性质。
- source_word: מַסֵּכָה
  choice: 铸造的神像
  rationale: מַסֵּכָה指浇铸而成的像；“铸造”比传统的“熔化”更准确地表达成品的制作工艺。
- source_word: דְּעוּ מַה תַּעֲשׂוּ
  choice: 你们要想清楚该怎么做
  rationale: 字面为“要知道你们将做什么”，在此是促使听者权衡并采取行动的命令；“想清楚”既自然，也不替他们明说具体行动。
theological_decisions:
- issue: 米迦宗教场所中各类器物的区分
  choice: 分别译作“以弗得、家神、雕刻的神像和铸造的神像”
  alternative: 统称为不同种类的“偶像”
  rationale: 原文使用四个有区别的名词。分别翻译可保留器物类别及制作方式，不在正文中预先作统一的神学归类。
- issue: תְּרָפִים的性质
  choice: 正文译“家神”，脚注说明也可理解为家庭崇拜所用的神像
  alternative: 音译“特拉非”或译“家中的偶像”
  rationale: “家神”符合该词通常的家庭祭祀语境，且现代读者容易理解；脚注保留其可能侧重实体神像的含义，避免把词义完全锁定为被崇拜的神祇。
- issue: 末句命令的开放性
  choice: “你们要想清楚该怎么做”
  alternative: “你们该知道要怎么办”或明确译成夺取这些器物
  rationale: 原文没有明说他们应采取哪一种行动，只以含蓄命令推动听者决定。译文保留这种叙事上的暗示和张力，不将后续行为提前写入本节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“窥探”延续侦察语境；“雕刻的神像”和“铸造的神像”保持原文并列及制作工艺的区别。末句用“想清楚”表达劝令，避免生硬的希伯来语式直译。
