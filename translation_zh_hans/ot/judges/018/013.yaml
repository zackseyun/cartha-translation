  text: From there they passed through the hill country of Ephraim and came as far as Micah’s house[a][b].
translation:
  language: zh_hans
  text: 他们从那里经过以法莲山区[b]，一直来到米迦的家[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“米迦的房屋。”
    reason: lexical_alternative
  - marker: b
    text: 原文为“以法莲的山地”；传统上也译作“以法莲山”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: 他们……经过
  rationale: עבר在此行程叙事中表示从一片地域经过；“经过”自然简洁，也保留横越该地区的意思。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 准确表达由前文地点出发的指示副词，符合现代汉语叙事习惯。
- source_word: הַר אֶפְרָיִם
  choice: 以法莲山区
  rationale: 该词组是地域名称；“山区”既反映הַר可指山地，又避免让人误以为是名叫“以法莲山”的单一山峰。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא在此表示抵达；“来到”与后面的目的地搭配自然，并保持叙事推进。
- source_word: עַד
  choice: 来到
  rationale: עַד表示移动所达到的界限或地点；汉语用“来到”已自然体现“直到／到达”的终点含义，无须生硬逐词对应。
- source_word: בֵּית מִיכָה
  choice: 米迦的家
  rationale: 构词短语直指“米迦的房屋／家”；此处叙事语境中“家”自然，也可理解为其住宅或家宅。
