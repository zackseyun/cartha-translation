source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בָּ֚אוּ בֵּ֣ית מִיכָ֔ה וַ/יִּקְחוּ֙ אֶת פֶּ֣סֶל הָ/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/כֹּהֵ֔ן מָ֥ה אַתֶּ֖ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: zh_hans
  text: 这些人进了米迦的家，拿走了雕像[a]、以弗得、家神[b]和铸像。祭司就对他们说：“你们在做什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本在“雕像”和“以弗得”之间没有连接词；也可译作“以弗得的雕像”。
    reason: 保留 פֶּסֶל הָאֵפוֹד 的句法歧义，并说明正文为何将两者按并列物件处理。
  - marker: b
    text: “家神”指家庭祭祀所用的形像或偶像；希伯来语称“特拉非”。
    reason: 解释文化专名 הַתְּרָפִים，帮助现代读者理解它指具体的家庭祭祀物件。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 这些人
  rationale: 指上文所说的那五个人；补出“人”使现代汉语指代自然，并未增加新的所指。
- source_word: בָּאוּ בֵּית מִיכָה
  choice: 进了米迦的家
  rationale: בוא 本义为“来、去”，与“米迦的家”连用时表示进入；译为“进了”符合叙事场景和自然汉语。
- source_word: וַיִּקְחוּ
  choice: 拿走了
  rationale: לָקַח 表示拿取；上下文表明这些物件被带走，“拿走”比单说“拿”更清楚，又不额外强化为“抢夺”。
- source_word: פֶּסֶל
  choice: 雕像
  rationale: 指雕刻制成的宗教形像；“雕像”保留制作方式和实体含义，不笼统并入“偶像”。
- source_word: הָאֵפוֹד
  choice: 以弗得
  rationale: 这是特定宗教器物，汉语圣经传统通常采用音译；本处用途异常，不加“祭司的”等限定，以免过度解释。
- source_word: הַתְּרָפִים
  choice: 家神
  rationale: 指家庭中使用的祭祀形像或神像；“家神”简洁易懂，脚注说明其实体性质，避免读者误以为只是抽象神祇。
- source_word: הַמַּסֵּכָה
  choice: 铸像
  rationale: 指用熔融金属浇铸的形像；“铸像”准确、简洁，并与“雕像”形成原文所保留的制作方式区别。
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: 祭司就对他们说
  rationale: 叙事连接词 וַ־ 表示随后发生的动作；“就”自然地表达事件推进。
- source_word: מָה אַתֶּם עֹשִׂים
  choice: 你们在做什么？
  rationale: 直译原文的质问，不添加原文没有的“在这里”等地点成分。
theological_decisions:
- issue: 如何处理本节所列的多种祭祀物件
  choice: 分别译作“雕像、以弗得、家神、铸像”
  alternative: 统一译作“偶像”或“神像”
  rationale: 原文有意列出不同物件，并区分雕刻和浇铸的形像；保留这些区别可避免把经文中的具体宗教器物扁平化，也不对其功能作超出原文的教义判断。
- issue: פֶּסֶל הָאֵפוֹד 的句法关系
  choice: 正文依上下文按并列物件译为“雕像、以弗得”，并用脚注注明希伯来文本缺少连接词
  alternative: 译为“以弗得的雕像”
  rationale: 本节上下文及相邻经文把雕像和以弗得视为不同物件，但现存希伯来文本在二者之间没有连接词，形式上容许领属结构。正文采用较符合叙事情境的并列理解，同时以脚注保留文本的真实歧义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“进了”“拿走了”“就对他们说”保持故事推进自然；宗教器物使用通行而不过度解释的名称。正文保留物件之间的区别，脚注处理希伯来句法歧义和文化背景。
