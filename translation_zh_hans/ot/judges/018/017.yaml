  text: וַֽ/יַּעֲל֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּ֣ל אֶת הָ/אָרֶץ֒ בָּ֣אוּ שָׁ֔מָּ/ה לָקְח֗וּ אֶת הַ/פֶּ֨סֶל֙ וְ/אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וְ/הַ/כֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַ/שַּׁ֔עַר וְ/שֵׁשׁ מֵא֣וֹת הָ/אִ֔ישׁ הֶ/חָג֖וּר כְּלֵ֥י הַ/מִּלְחָמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: zh_hans
  text: 那五个曾去侦察那地的人就上去[a]，来到那里，拿走了雕刻的神像、以弗得、家神[b]和铸造的神像[c]。当时，祭司和六百名携带兵器的人正站在门口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上去”也可按叙事中的移动理解为“走去”；原文使用通常表示“上去、登上”的动词。
    reason: lexical_alternative
  - marker: b
    text: “家神”原文为“特拉非”，指家庭祭祀所用的神像或崇拜物。
    reason: lexical_alternative
  - marker: c
    text: 传统译法为“铸成的像”或“熔铸的像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 就上去
  rationale: 保留עלה“上去”的空间表达；上下文未明确说明进入何处，因此不译作“进去”。
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: 曾去侦察那地的人
  rationale: רגל在此指带有军事目的的侦察；“曾去”自然表明这是先前的任务。
- source_word: בָּאוּ שָׁמָּה
  choice: 来到那里
  rationale: 直接对应“来到那里”，不擅自补出进入房屋或圣所。
- source_word: לָקְחוּ
  choice: 拿走了
  rationale: לקח基本义为“拿、取”；“拿走”在中文中自然呈现物件被带离，盗取性质由语境显明。
- source_word: הַפֶּסֶל
  choice: 雕刻的神像
  rationale: פסל指雕刻制成的像；此处祭祀语境下“神像”比泛称“像”更清楚，同时避免较古旧的“雕像偶像”式表达。
- source_word: הָאֵפוֹד
  choice: 以弗得
  rationale: 这是特定的古代祭祀用品，采用圣经中文传统音译，不额外限定其具体形制或用途。
- source_word: הַתְּרָפִים
  choice: 家神
  rationale: תרפים指家庭祭祀所用的神像或崇拜物；“家神”简明易懂，并以脚注保留原词及其物件性上的语义空间。
- source_word: הַמַּסֵּכָה
  choice: 铸造的神像
  rationale: מסכה在此指以熔铸方式制成的像；“铸造的神像”是自然现代汉语，也与前面的雕刻神像形成制作方式上的对应。
- source_word: וְהַכֹּהֵן נִצָּב
  choice: 当时，祭司……正站在
  rationale: 将该分句理解为与拿取物件同时发生的背景动作，以“当时……正”表达希伯来语的伴随情形。
- source_word: פֶּתַח הַשַּׁעַר
  choice: 门口
  rationale: 自然对应“门的入口”，在现代汉语中比“门的入口处”更简洁。
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: 和六百名携带兵器的人
  rationale: 将六百人同祭司并列为站在门口者；חגור表示束带装备，译为“携带兵器”自然表达其武装状态。
theological_decisions:
- issue: 如何称呼תרפים及两种神像
  choice: 正文用“家神”“雕刻的神像”“铸造的神像”
  alternative: 用音译“特拉非”或统称“偶像”
  rationale: 具体呈现原文对不同祭祀物件及制作方式的区分，不以统称抹平差异，也不因音译而降低可懂度。
- issue: 祭司与六百人的句法关系
  choice: 将二者共同理解为站在门口
  alternative: 仅明确祭司站在门口，把六百名武装者作为较松散的附加成分
  rationale: 原文以连接词并列“祭司”和“六百人”，中文合并为共同主语最通顺；但不进一步推断他们对拿取行为的态度或参与程度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“侦察”呈现军事语境，以“以弗得”保留专名式祭祀术语；正文区分雕刻、家庭祭祀及铸造物件。三个脚注标记均在正文对应位置出现。
