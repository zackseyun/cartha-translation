base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: zh_hans
  text: 没有人来搭救他们，因为那城离西顿很远，城里的人与任何人都没有往来。那城坐落在属于伯利合的山谷中[a]。于是他们重建了那城，住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在伯利合附近的山谷中。”希伯来语在这里有所省略，介词既可表示归属，也可能表示邻近。
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: 来搭救
  rationale: 该词是 נצל 的使役词干分词，指在危难中施行援救的人。“来搭救”符合军事袭击的语境；希伯来文未明说宾语，因此中文也不另加“他们”。
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: 那城离西顿很远
  rationale: 阴性代词 הִיא 回指该城；中文直接说“那城”，既清楚又自然。
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: 城里的人与任何人都没有往来
  rationale: 原文直译近于“他们与人没有事情”，在此表达社会或政治上的隔绝。“没有往来”是自然的现代汉语，也避免误解为完全没有见过别人。
- source_word: אָדָם
  choice: 任何人
  rationale: 此处虽为单数形式，却具有泛指意义，译作“任何人”准确表达其语用功能。
- source_word: בָּעֵמֶק
  choice: 在……山谷中
  rationale: עֵמֶק 通常指山谷或低地；“山谷”在本处最直接、自然。
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: 属于伯利合的
  rationale: 介词 לְ 可表达归属或关联；正文采用可能性较高的地域归属义，同时用脚注保留地点邻近义。
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: 重建了那城
  rationale: 动词本义为“建造”，但上一节已说明该城被焚毁，因此语境清楚表明这里是重建。
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: 住在其中
  rationale: ישׁב 在此指居住、定居；“住在其中”庄重而符合现代汉语叙事。
- source_word: בֵּית רְחוֹב
  choice: 伯利合
  rationale: 这是地名 Beth-rehob，采用现代中文圣经地名的通行音译形式。
