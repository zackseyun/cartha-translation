base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: zh_hans
  text: 他们对他说：“请你求问上帝，好让我们知道，我们所走的这条路能否顺利。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: 他们对他说
  rationale: 以现代汉语自然承接叙事；希伯来语连续式在此推进下一事件，无须机械译出“于是”或“并且”。
- source_word: שְׁאַל נָא
  choice: 请你求问
  rationale: “求问”适合向上帝寻求指示的语境；“请”表达 נָא 缓和命令语气的作用。
- source_word: בֵאלֹהִים
  choice: 上帝
  rationale: שׁאל 与介词 ב 连用，在此表示向上帝求问；上下文最自然地指单数的上帝。
- source_word: וְנֵדְעָה
  choice: 好让我们知道
  rationale: 队列式在请求之后表达目的或预期结果；此译法符合现代汉语。
- source_word: הֲתַצְלִיחַ
  choice: 能否顺利
  rationale: צלח 的使役式在这里指道路或行程是否亨通、成功；“能否顺利”既自然，也避免把“兴旺”误解为经济繁荣。
- source_word: דַּרְכֵּנוּ
  choice: 我们所走的这条路
  rationale: 保留 דֶּרֶךְ 的“道路”意象，同时借后接关系从句自然表达第一人称复数所属。
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: 我们所走的
  rationale: 凝练表达“我们正在其上行走”，保留实际行路的含义而避免生硬直译。
theological_decisions:
- issue: אֱלֹהִים 的所指
  choice: 上帝（单数）
  alternative: 诸神／神明
  rationale: 该词形态上可作复数，但本段是请祭司求取神谕，直接语境以单数所指最自然；此选择基于词汇与上下文，并未增添教派性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“求问上帝”保留宗教语境中的专门含义；“我们所走的这条路能否顺利”既保存希伯来文的道路意象，也符合普通读者的表达习惯。英文咨询层所附脚注解释的是英语中 journey/way 的取舍；中文正文已自然保留“路”的意象，因此无需脚注。
