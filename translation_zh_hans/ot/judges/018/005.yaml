  source_fidelity: 译文准确传达了希伯来文的请求、求问对象、目的从句以及对所行道路是否亨通的询问。“他们对他说”对应 וַיֹּאמְרוּ לוֹ；“请你求问上帝”恰当地表达带有礼貌语气的 שְׁאַל־נָא בֵּאלֹהִים；“好让我们知道”体现队列式的目的；“我们所走的这条路能否顺利”保留了“道路／所行之路”的意象，并自然表达 הֲתַצְלִיחַ 的“是否成功、亨通”。
