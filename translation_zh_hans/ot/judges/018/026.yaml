base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: zh_hans
  text: 但支派的人继续上路。米迦见他们比他强，就转身回到自己的家里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: 但人
  rationale: 这是“但的子孙”的部族称谓；现代汉语以“但人”自然、简洁地表达其部族身份。
- source_word: לְדַרְכָּם
  choice: 继续赶路
  rationale: 该短语表示沿自己的路前行；结合上下文，译作“继续赶路”既自然，也保留他们继续行程的含义。
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: 他们比自己强
  rationale: 保留形容词加介词 מן 的比较含义，不将其强化解释为“他敌不过他们”。“自己”清楚回指米迦。
- source_word: וַיִּפֶן
  choice: 转身
  rationale: 动词表示转向或转身；后面的 שׁוב 已表达返回，因此不在此处重复译作“转回去”。
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: 回家去了
  rationale: 自然表达“返回自己的房屋／家中”的方向和动作，符合现代汉语叙事习惯。
- source_word: בֵּיתוֹ
  choice: 家
  rationale: בַּיִת 可指房屋，也可指住所；这里是米迦返回自己的住处，汉语“家”比“房子”更自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。以“但人”表达部族称谓；保留“比自己强”的明确比较结构，不额外推断米迦的情绪或胜算。
