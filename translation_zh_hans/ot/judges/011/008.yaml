base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: zh_hans
  text: 基列的长老对耶弗他说：“正因如此，我们现在回来找你[a]，好叫你跟我们一起去攻打亚扪人[b]；你要作我们的首领，统领基列所有的居民。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“回到你这里。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“亚扪的子孙”，即亚扪人。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: 基列的长老
  rationale: “长老”既保留 זָקֵן 的基本称谓，也传达这些人在群体中公认的治理身份。
- source_word: לָכֵן עַתָּה
  choice: 正因如此，我们现在才……
  rationale: “正因如此”承接耶弗他上一节的质问；“现在才”自然表达 עַתָּה 的即时性，并在语境中带出先前排斥、如今返回的反差。
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: 我们……回来找你
  rationale: שׁוּב 的核心义是“返回”；“回来找你”在现代汉语中自然表达长老们重新来接触耶弗他，同时以脚注保留更贴近形式的译法。
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: 要你跟我们一起去
  rationale: 保留 הלך“去”的方向感；结合前面的“回来找你”，用“要你”表达这些并列动词在语境中的目的和邀请意味。
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: 攻打亚扪人
  rationale: נלחם בְ 在此表示与敌方交战；“亚扪人”是 בְּנֵי עַמּוֹן 的通行族名，字面形式另见脚注。
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: 你要作我们的首领
  rationale: רֹאשׁ 字面为“头”，在此指领导者；“首领”保留其权威含义，又符合现代汉语叙事语体。
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: 统领基列所有的居民
  rationale: 明确保留“所有”的范围，并用“居民”表达居住在基列的全体人口；“统领”使其与前面的“首领”自然衔接。
theological_decisions:
- issue: 耶弗他所得权柄的范围
  choice: 长老所应许的不只是战时军事指挥权，也包括对基列所有居民的领导权。
  alternative: 这项应许只涉及临时的军事统帅职位。
  rationale: וְהָיִיתָ לָּנוּ לְרֹאשׁ 后接 לְכֹל יֹשְׁבֵי גִלְעָד，把范围扩展到基列全体居民；译文保留这一较广的管治范围，但不套用后世的政治制度名称。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正因如此”承接上文因果关系；分号区分邀请出战与随后应许的广泛领导地位。脚注标记均置于其所说明的词语之后。
