base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: zh_hans
  text: 耶弗他逃离他的弟兄们，住在陀伯地；有些无赖之徒[a]聚集到耶弗他那里，跟他一同出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“空虚的人”；这是贬义习语，指品行或社会地位低下的人，并非仅指一无所有的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: 逃离
  rationale: 该动词表示因危险或敌意而逃走；“逃离”自然地表达耶弗他是在弟兄的排斥和压力下离开。
- source_word: מִפְּנֵי אֶחָיו
  choice: 他的弟兄
  rationale: מִפְּנֵי 字面为“从……面前”，此处表示躲避其弟兄；与“逃离”连用即可自然传达原意。
- source_word: וַיֵּשֶׁב
  choice: 住
  rationale: ישב 在此指居住，未必强调永久定居；“住”简洁而准确。
- source_word: בְּאֶרֶץ טוֹב
  choice: 在陀伯地
  rationale: אֶרֶץ 可指土地或地域；“陀伯地”保留其地名性质，并符合中文圣经地名表达。
- source_word: וַיִּתְלַקְּטוּ
  choice: 聚集
  rationale: 该反身词形表达众人自行聚拢、结集，不额外断定其组织形式。
- source_word: אֶל יִפְתָּח
  choice: 到耶弗他那里
  rationale: אֶל 的基本方向义是“向、到”；此译法既贴近原文，也自然表达他们前来与耶弗他结伴。
- source_word: אֲנָשִׁים רֵיקִים
  choice: 无赖之徒
  rationale: רֵיקִים 字面为“空的”，用于人时是贬义习语，指品行或社会名声低下的人；“无赖之徒”传达贬义，又不武断地称其为匪徒。
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: 跟着他出去
  rationale: 保留 יצא“出去”的开放含义，只表明这些人与耶弗他一同行动，不把未明说的目的具体化为抢掠或征战。
theological_decisions: []
