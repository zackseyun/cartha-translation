source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: zh_hans
  text: 雅威，以色列的上帝，把西宏和他的所有百姓交在以色列手中[a]，以色列人就击败了他们。于是，以色列占领了住在那地的亚摩利人所有的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”是希伯来语惯用语，意思是交在……的权下或控制之下。
    reason: 解释希伯来语惯用表达，防止读者按字面理解“手中”。
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: 交在以色列手中
  rationale: “给在某人手中”是希伯来语表示交由某人掌控的惯用语；译作“交在……手中”既保留“手”的意象，也自然表达军事语境中的控制权。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按辅音四字神名 יהוה 的通行学术拟音译出上帝的专名，不以“主”这一称号代替。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的领属结构，说明雅威是以色列的上帝。
- source_word: סִיחוֹן
  choice: 西宏
  rationale: 采用该人名在现代中文圣经语境中的通行译名。
- source_word: כָּל־עַמּוֹ
  choice: 他的众民
  rationale: עַם 的基本义是“人民、民众”；“众民”保留原文的广度，不擅自限定为军队。
- source_word: וַיַּכּוּם
  choice: 以色列人就击败了他们
  rationale: נכה 在战争叙事中表示打击并战胜；中文补明复数动作主体为“以色列人”，避免代词指向含混。
- source_word: וַיִּירַשׁ
  choice: 占领了
  rationale: ירש 在此指以色列战胜后取得并据有土地；“占领”简明地表达军事取得领土的结果。
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: 亚摩利人的全部土地
  rationale: 原文单数族名具有集合意义，现代中文自然译为复数概念“亚摩利人”。
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: 住在那地的
  rationale: 将分词短语作为限定语，修饰“亚摩利人”，保留原文所指为居住在那片土地上的亚摩利人。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名而非称号；“雅威”较直接反映当代学界对该神名读音的通行重构，也避免把专名改成“主”。
- issue: 胜利与得地的施动关系
  choice: 保留雅威交付、以色列击败并占领的连续叙述
  alternative: 将全部行动概括为上帝使以色列得胜
  rationale: 原文既说雅威把敌人交在以色列手中，也明确以以色列为随后击败和占地的主体；译文不合并这两层施动关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“众民”略带经文语体，但比“全军”更忠实于 עַם 的广义；其余句式力求自然流畅。
