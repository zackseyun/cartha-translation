revisions:
- from: 以色列的上帝雅威把西宏和他的众民交在以色列手中[a]，以色列人就击败了他们。于是，以色列占领了住在那地的亚摩利人的全部土地。
  to: 雅威，以色列的上帝，把西宏和他的所有百姓交在以色列手中[a]，以色列人就击败了他们。于是，以色列占领了住在那地的亚摩利人所有的土地。
  rationale: 修订仅改善现代汉语的自然性与句法清晰度：“众民”改为“所有百姓”，并用逗号标示“以色列的上帝”对“雅威”的同位说明。其余措辞及脚注均忠实反映希伯来文本，故予以保留。
