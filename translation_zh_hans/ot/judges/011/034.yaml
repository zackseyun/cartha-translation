base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: zh_hans
  text: 耶弗他回到米斯巴，回到自己的家。看哪，他女儿正敲着手鼓、跳着舞出来迎接他。她是他唯一的孩子[a]；除她以外，他既没有儿子，也没有女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“她是他唯一的一个”；按下文的说明，是指他唯一的孩子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 回到
  rationale: 叙事中的连续式推进事件；结合目的地是自己的家，现代汉语用“回到”自然表达其抵达，但不增加额外动作。
- source_word: הַמִּצְפָּה
  choice: 米斯巴
  rationale: 按通行形式音译地名；希伯来语中的冠词在汉语专名中不另译。
- source_word: אֶל בֵּיתוֹ
  choice: 自己的家
  rationale: בַּיִת 在此指他的住所；“自己的家”比“自己的房屋”更符合现代汉语，同时保留所属关系。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示突然出现、加强戏剧张力的话语标记，并维持庄重的叙事语体。
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: 正……出来迎接他
  rationale: “正”体现分词在耶弗他抵达时所呈现的进行状态；“出来迎接”准确表达动作方向和目的。
- source_word: בְתֻפִּים וּבִמְחֹלוֹת
  choice: 敲着手鼓、跳着舞
  rationale: תֹּף 指节庆中使用的框鼓，译作普通读者易懂的“手鼓”；名词“舞蹈”在汉语中自然转为动作“跳着舞”，呈现庆祝场景。
- source_word: וְרַק הִיא יְחִידָה
  choice: 她是他唯一的孩子
  rationale: יְחִידָה 字面为阴性“唯一的一个”，下句明确说明无其他儿女，因此正文采用合乎语境的“唯一的孩子”，并以脚注保存字面形式。
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: 除她以外，他既没有儿子，也没有女儿
  rationale: 按上下文将 מִמֶּנּוּ 理解为除她之外，后半句以“既不……也不……”完整保留对儿女的双重否定。
theological_decisions:
- issue: 耶弗他女儿的身份及其与后续誓愿结局的关系
  choice: 本节只说明她是耶弗他唯一的孩子，并以庆祝的方式出来迎接他，不预断后文中她最终遭遇的性质。
  alternative: 可把“唯一的孩子”的强调预先联系到献祭死亡，或联系到终身不嫁与无后。
  rationale: 原文本节没有明说她后来的结局；译文应保留叙事事实和由此产生的张力，不把争议解释写入正文。
translation_notes:
  register: 采用现代、清楚而庄重的叙事汉语。“看哪”保留原文突发性的文学效果；“手鼓”避免古奥器乐名称。正文不加入对耶弗他誓愿或其女儿结局的解释。
