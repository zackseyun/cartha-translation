  text: וְ/הָיָ֣ה הַ/יּוֹצֵ֗א אֲשֶׁ֨ר יֵצֵ֜א מִ/דַּלְתֵ֤י בֵיתִ/י֙ לִ/קְרָאתִ֔/י בְּ/שׁוּבִ֥/י בְ/שָׁל֖וֹם מִ/בְּנֵ֣י עַמּ֑וֹן וְ/הָיָה֙ לַֽ/יהוָ֔ה וְ/הַעֲלִיתִ֖/הוּ עוֹלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: zh_hans
  text: 那么，无论从我家门口出来迎接我的是什么，在我从亚扪人那里平安归来时，都必归耶和华[a]；我也必把它献作燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都必归耶和华，或我必把它献作燔祭。”有些解经者认为，这里的希伯来语连接词可表示选择，因此出来迎接耶弗他的对象不同，可能有两种不同的处理方式。
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: 无论是什么……出来
  rationale: 原文是阳性单数分词加关系从句，直译近于“那出来、出来的”。上下文并未在语法上明确限定是人还是动物；“无论是什么”在现代汉语中可保留这种关键的指称开放性。
- source_word: מִדַּלְתֵי בֵיתִי
  choice: 从我家门里
  rationale: דַּלְתֵי 字面为复数“门扇／门”，但现代汉语说“从我家门里出来”更自然，也准确表达从住宅入口出来。
- source_word: לִקְרָאתִי
  choice: 迎接我
  rationale: 该结构表示朝向某人而来与之相遇；此处凯旋归家的语境中，“迎接我”自然贴切，又不额外规定迎接者身份。
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: 在我……平安归来时
  rationale: 保留 שָׁלוֹם 的“平安、安然”意味，而不只缩减为军事上的“安全”。
- source_word: מִבְּנֵי עַמּוֹן
  choice: 从亚扪人那里
  rationale: בְּנֵי עַמּוֹן 是民族称谓，译作“亚扪人”；介词 מִן 在此表示从与他们交战之处归回，汉语用“从亚扪人那里”保持原文简洁且不补入“手中”等原文没有的词。
- source_word: וְהָיָה לַיהוָה
  choice: 都必归耶和华
  rationale: 该短语表示归属或奉献给耶和华；“归耶和华”既自然，又不预先说明这种归属将以何种具体方式实现。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 将神名 יהוה 按现代中文圣经通行形式译作“耶和华”，明确呈现专名。
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: 我也必把它献作燔祭
  rationale: 希伯来语使役式 עלה 与 עוֹלָה 构成固定献祭表达，意为“献作燔祭”。代词后缀为阳性单数，但因先行语有意保持人或动物皆可能，汉语用中性的“它”延续这种开放性；ו 按通常的并列义译为“也”。
theological_decisions:
- issue: 誓言后半是一个连续结果，还是按对象不同分成“归耶和华”或“献作燔祭”两种结果
  choice: 正文采用连续结果：“都必归耶和华，我也必把它献作燔祭。”
  alternative: “都必归耶和华，或把它献作燔祭。”
  rationale: 连接词 וְ 通常表示“和／并且”，句法最自然地把两项连成同一誓愿。鉴于有人主张这里可作选择性的“或”，脚注保留这一争议读法，不在正文中借此消解叙事的神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“无论是什么”刻意保留迎接者可能是人或动物的歧义；“平安归来”“归耶和华”“献作燔祭”保持经文语域，同时普通读者能够理解。脚注标记[a]已在正文对应位置出现。
