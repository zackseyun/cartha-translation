revisions:
- from: 以色列的女子年年都去追念基列人耶弗他的女儿[a]，一年四天。
  to: 以色列的女子每年有四天去追念基列人耶弗他的女儿[a]。
  rationale: 仅作低风险的汉语句法调整：以“每年有四天去追念”明确“四天”是年度追念活动所占的日数，同时不额外断定这四天是否连续。正文和脚注继续保留原文动词的释义张力。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:34Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了年度重复的惯常行动、行动者“以色列的女子”、对象“基列人耶弗他的女儿”以及每年四天的时长。将罕见且有争议的 לְתַנּוֹת 译为“追念”，并在脚注中保留“哀悼”和“述说”的可能性，恰当地避免了对其女儿结局作出超出经文的裁定。
  naturalness: 原句末的“一年四天”虽可理解，但在现代汉语中略显悬置，较容易被读成补充性的时间说明，而非“去追念”持续四天。改为“每年有四天去追念”能更清楚、自然地连接四天与该年度行动，且不表示四天必定连续。
  terminology: “基列人耶弗他”“以色列的女子”和“追念”均庄重自然，适合现代标准汉语圣经文本。“追念”作为正文的审慎选择可保留；脚注应明确这是原文罕见、意义有争议的动词，并列出有依据的替代译法。
