  text: מִ/יָּמִ֣ים יָמִ֗ימָ/ה תֵּלַ֨כְנָה֙ בְּנ֣וֹת יִשְׂרָאֵ֔ל לְ/תַנּ֕וֹת לְ/בַת יִפְתָּ֖ח הַ/גִּלְעָדִ֑י אַרְבַּ֥עַת יָמִ֖ים בַּ/שָּׁנָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: zh_hans
  text: 以色列的女子每年有四天去追念基列人耶弗他的女儿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追念”也可译为“哀悼”或“述说有关她的事”。原文这个动词很少见，含义有争议。
    reason: 保留罕见希伯来动词的词义不确定性，并避免译文暗中裁定耶弗他女儿的结局。
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: 年年
  rationale: 这是表示按年定期重复的习语；“年年”在现代汉语中自然、简洁，也保留了反复发生的意味。
- source_word: תֵּלַכְנָה
  choice: 都去
  rationale: 未完成式在此表示过去形成的惯常行动；汉语借“年年”和“都”自然表达这种反复性，不必另加生硬的过去时标记。
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: 以色列的女子
  rationale: 既贴近“以色列的女儿们”这一希伯来表达，又避免现代汉语中“女儿们”可能引起的亲属关系误解；不限定其年龄或婚姻状况。
- source_word: לְתַנּוֹת
  choice: 追念
  rationale: 该动词罕见且词义有争议。“追念”可表达年度纪念活动，又不像“哀悼”那样在正文中预先断定耶弗他女儿的最终遭遇；其他可能词义收入脚注。
- source_word: לְבַת יִפְתָּח הַגִּלְעָדִי
  choice: 基列人耶弗他的女儿
  rationale: 准确保留人物关系和籍贯称谓；“耶弗他”采用现代中文圣经中通行的人名译法。
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: 一年四天
  rationale: 简洁对应原文，说明这一年度活动所占的天数，同时不额外断定四天是否连续。
theological_decisions:
- issue: 以色列女子每年所行之事的性质，以及这是否暗示耶弗他女儿已经死亡
  choice: 正文译作“追念”，并以脚注保留“哀悼”和“述说有关她的事”等可能解释
  alternative: 正文译作“哀悼”，或“述说有关她的事”
  rationale: 罕见动词תנה的确切含义存在争议，而不同译法容易被用来支持对耶弗他誓愿及其女儿结局的不同理解。“追念”符合年度纪念的语境，却不在正文中替叙事解决这一神学和释经争议；脚注明确保留其他有依据的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以色列的女子”比直译“以色列的女儿们”更自然，且不擅自限定年龄；句末“一年四天”保留原文简练的时间说明。
