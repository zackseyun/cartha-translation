  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: zh_hans
  text: 如今，雅威——以色列的上帝——已经把亚摩利人从他子民以色列面前赶出了；难道你要占有那地[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“承受那地”或“取得那地”。希伯来语动词可指承受土地，也可指取得并占有土地。
    reason: 说明 ירש 在土地语境中的词义范围，保留“承受”与“取得占有”之间的语义张力。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 作为承接上文并引出结论的话语标记，既保留连接作用，也符合现代汉语修辞。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的专名，而不以“主”这一称号替代；“雅威”是现代汉语中对该名的常见音译。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构，指明雅威是以色列的上帝。
- source_word: הוֹרִישׁ
  choice: 赶走了
  rationale: 该词在使役词干中表示使人失去土地或将其逐出；这里用自然汉语表达亚摩利人被逐离其地，同时不补入原文未明说的细节。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 希伯来文虽为单数形式，却是族群集合名词；汉语以“亚摩利人”自然地表达整个族群。
- source_word: מִפְּנֵי עַמּוֹ יִשְׂרָאֵל
  choice: 从他子民以色列面前
  rationale: 保留原文的空间意象及“他子民以色列”的同位关系。
- source_word: וְאַתָּה תִּירָשֶׁנּוּ
  choice: 难道你还要占有那地吗
  rationale: 独立代词“你”带有强调，句式是反问；“难道”呈现质问语气。“占有那地”按土地争议语境自然表达 ירש 及阳性单数宾语后缀。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用四字神名，而非“主”的称号；采用音译“雅威”保留专名性质，也避免以传统替代称谓遮盖原文。
- issue: תִּירָשֶׁנּוּ 的宾语所指
  choice: 那地
  alternative: 他们／它
  rationale: 阳性单数后缀在形式上可回指集合性的“亚摩利人”，但 ירש 在本段争议中指取得其土地。译为“那地”符合语境，同时以脚注说明动词本身兼有承受或取得土地的语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威——以色列的上帝——”以破折号清楚呈现同位说明；末句用反问加强耶弗他的质问语气。脚注标记紧随其所解释的“那地”。
