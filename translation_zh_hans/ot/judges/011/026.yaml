  text: בְּ/שֶׁ֣בֶת יִ֠שְׂרָאֵל בְּ/חֶשְׁבּ֨וֹן וּ/בִ/בְנוֹתֶ֜י/הָ וּ/בְ/עַרְע֣וֹר וּ/בִ/בְנוֹתֶ֗י/הָ וּ/בְ/כָל הֶֽ/עָרִים֙ אֲשֶׁר֙ עַל יְדֵ֣י אַרְנ֔וֹן שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וּ/מַדּ֥וּעַ לֹֽא הִצַּלְתֶּ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: zh_hans
  text: 以色列住在希实本及其属城[a]、亚罗珥及其属城，以及亚嫩河沿岸的各城，已有三百年；在那期间，你们为什么没有把这些地方夺回[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它的女儿们”，指隶属于一座较大城市的较小聚落。
    reason: cultural_note
  - marker: b
    text: 或译“救回”或“解救”；本段谈论领土归属，因此这里译作“夺回”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת
  choice: 以色列住在……已有三百年
  rationale: 介词 בְּ 加动词 ישׁב 的不定式附属形构成时间背景；结合后面的“三百年”，用“住在……已有”自然表达延续已久的居住状态。
- source_word: בְּנוֹתֶיהָ
  choice: 属城
  rationale: 字面为“她的女儿们”，是指隶属于中心城的较小聚落。“属城”准确传达从属关系，并以脚注说明原文比喻。
- source_word: עַרְעוֹר
  choice: 亚罗珥
  rationale: 采用现代中文圣经地名的常见音译。
- source_word: עַל יְדֵי אַרְנוֹן
  choice: 亚嫩河沿岸
  rationale: עַל יְדֵי 表示“在旁边、邻近”；“沿岸”适合描述分布在亚嫩河一带的多座城。
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: 已有三百年
  rationale: 明确表达以色列居住时间的延续长度，并使中文句式流畅。
- source_word: וּמַדּוּעַ
  choice: 为什么
  rationale: 连接词 וּ 在中文分号后的反问句中无需机械译作“而”，其论证承接关系已由句式表达。
- source_word: הִצַּלְתֶּם
  choice: 把这些地方夺回
  rationale: נצל 的使役形通常有“解救、救出”之意；在领土争议的语境中，是指从以色列手中收复所谈到的城邑。“这些地方”补明原文语境中省略的宾语。
- source_word: בָּעֵת הַהִיא
  choice: 在那期间
  rationale: 保留指示意味，同时把所指自然地理解为前述三百年的时期，而非某一个时间点。
theological_decisions:
- issue: הִצַּלְתֶּם 在领土争议中的含义
  choice: 夺回
  alternative: 解救／救回
  rationale: 原词本身带有“解救、救出”的语义，但此处论证针对长期未被收复的城邑；正文采用符合语境的“夺回”，脚注保留其较直译的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“属城”简洁表达古代中心城与附属聚落的关系；分号突出三百年事实与随后反问之间的论证联系。
