base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: zh_hans
  text: 于是，他们占领了[a]亚摩利人[b]的全部疆土[c]，从亚嫩河直到雅博河，又从旷野直到约旦河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“占有了”或“承受为业”；希伯来文动词可有这些含义，但这里指取得并控制土地。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“亚摩利人”的单数形式，在这里是集合用法，指亚摩利人这个族群。
    reason: lexical_alternative
  - marker: c
    text: 或译“边界”；这里所指的是这些边界以内的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: 他们就占领了
  rationale: 动词 ירשׁ 在征服土地的语境中表示取得并控制土地；“占领”自然传达主动取得疆域之意，同时以脚注保留“占有、承受为业”等可能语感。
- source_word: כָּל
  choice: 全部
  rationale: 保留希伯来文量词的完整、全面含义。
- source_word: גְּבוּל
  choice: 疆土
  rationale: גְּבוּל 可指边界，也可指边界以内的地域；本节随后列出四方界限，因此“疆土”最符合此处整体地域的含义。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文采用单数集合名词，指整个亚摩利族群；现代汉语用“亚摩利人”表达自然。
- source_word: מֵאַרְנוֹן
  choice: 从亚嫩河
  rationale: 该短语标示疆域的一端；补出“河”能让现代读者明确这是地理水系名称。
- source_word: וְעַד הַיַּבֹּק
  choice: 直到雅博河
  rationale: 准确表达从一个界点延伸至另一界点的范围，并以“河”明确地理所指。
- source_word: וּמִן הַמִּדְבָּר
  choice: 又从旷野
  rationale: מִדְבָּר 指人烟稀少的荒野地带，不必特指沙漠；“旷野”符合圣经地理语境，也易于现代读者理解。
- source_word: וְעַד הַיַּרְדֵּן
  choice: 直到约旦河
  rationale: 与前面的“从旷野”构成第二组疆界；补出“河”使中文清楚自然。
