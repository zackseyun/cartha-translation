base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: zh_hans
  text: 他回答：“去吧。”于是他准她离开两个月。她便和女伴们一起去，在群山中为自己的童贞哀哭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为自己的童贞哀哭”也可理解为“因自己的童贞而哀哭”。希伯来文明确指出，她哀哭所针对的是自己的童贞；这项细节对理解上下文至关重要。
    reason: 说明介词 עַל 的语义范围，并保留本节对“童贞”的明确强调，而不在正文中解决整段经文的解释争议。
lexical_decisions:
- source_word: לֵכִי
  choice: 去吧
  rationale: 这是动词“去”的阴性单数命令式。译作简短自然的“去吧”，既保留直接命令，也符合父女对话的现代汉语表达。
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: 于是他准她离开
  rationale: שׁלח 加直接宾语在此语境中表示让她离去、准许她出行；“准她离开”比单纯的“打发她”更准确，也避免误含厌弃之意。
- source_word: שְׁנֵי חֳדָשִׁים
  choice: 两个月
  rationale: 此处表示获准离开的时长；现代汉语直接说“离开两个月”最自然。
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: 她便和女伴们一起去
  rationale: 希伯来文明确提到“她和她的同伴们”。“女伴们”准确反映 רֵעוֹתֶיהָ 的阴性复数形式，同时保持叙事流畅。
- source_word: וַתֵּבְךְּ
  choice: 哀哭
  rationale: בכה 表示哭泣；“哀哭”既保留实际哭泣的含义，又切合此处庄重悲痛的语境。
- source_word: עַל בְּתוּלֶיהָ
  choice: 为自己的童贞哀哭
  rationale: 介词 עַל 在此表明哀哭所针对或所缘由的事。“童贞”直接对应 בְּתוּלִים，保留原文焦点，不把更广段落中有关死亡、终身不嫁或无后的解释写入正文。
- source_word: עַל הֶהָרִים
  choice: 在山上
  rationale: עַל 与复数 הֶהָרִים 直指山地场景；“在山上”是自然现代汉语，也没有不必要地区分山岳与丘陵。
theological_decisions:
- issue: 耶弗他女儿为自己的童贞哀哭所指为何
  choice: 正文只陈述她为自己的童贞哀哭，不裁定其后究竟是被献为祭、终身守贞，还是涉及两者。
  alternative: 将此句解释性地译成她因即将死亡而哀哭，或因将终身不嫁、无后而哀哭。
  rationale: 本节明说她哀哭的对象是自己的童贞，却没有在本句内明确解决更大段落的争议。保留这一措辞，能忠实呈现原文的神学与叙事张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“准她离开”表达父亲许可她暂时离去；“女伴们”反映原文阴性复数；“童贞”保留原文核心词及其解释张力。
