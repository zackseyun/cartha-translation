base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: zh_hans
  text: 他从亚罗珥一直打到通往米匿的入口[a]，攻打了二十座城，又打到亚备勒·基拉明[b]，使他们遭受极其惨重的打击[c]。这样，亚扪人就在以色列人面前被制伏了[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“直到米匿”或“直到通往米匿之处”。这里的希伯来语表达较难确定，可能指通往该城的入口或接近该城之处，也可能只是指米匿本身。
    reason: alternative_reading
  - marker: b
    text: “亚备勒·基拉明”是地名；名称各部分的字面意思可能近似“葡萄园草场”，但这里按专名音译。
    reason: lexical_alternative
  - marker: c
    text: 或译“使他们惨遭大败”，也可理解为“进行了一场极大的杀戮”。希伯来语可指沉重的军事打击，其措辞本身没有完全限定具体伤亡程度。
    reason: lexical_alternative
  - marker: d
    text: 希伯来语直译为“亚扪的众子”和“以色列的众子”；正文按现代汉语习惯译作“亚扪人”和“以色列人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: 一路攻击他们
  rationale: נכה的基本意思是“击打、攻击”。结合后面的行军范围，用“一路攻击”自然表达持续的军事行动，又不单凭此动词断定死亡程度。
- source_word: מֵעֲרוֹעֵר
  choice: 从亚罗珥
  rationale: 这是地名 עֲרוֹעֵר 的常用中文音译。
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: 直到米匿入口
  rationale: בּוֹאֲךָ在地理范围说明中可指通往某地之处或入口；正文采用简洁自然的“入口”，脚注保留“直到米匿”等可能理解。
- source_word: עֶשְׂרִים עִיר
  choice: 攻打了二十座城
  rationale: “二十座城”在原文中简略地插入行军范围；中文补出与上下文相合的“攻打了”，使句法清楚，但不增加“占领”等原文未明说的结果。
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: 又一直攻到亚备勒·基拉明
  rationale: 该词组在此作地名，采用音译而不按字面译作“葡萄园草场”。
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: 极其惨重的打击
  rationale: מַכָּה可指打击、败仗或杀戮；“极其惨重的打击”既体现 גְּדוֹלָה מְאֹד 的强烈程度，又避免把军事伤亡程度解释得过死。
- source_word: וַיִּכָּנְעוּ
  choice: 被制伏了
  rationale: כנע的尼法勒式在这里表示军事和政治上的屈服，“被制伏”符合战事结局。
- source_word: בְּנֵי עַמּוֹן / בְּנֵי יִשְׂרָאֵל
  choice: 亚扪人／以色列人
  rationale: 希伯来语字面为“亚扪之子／以色列之子”；现代汉语用族群名称更自然，并保留双方群体的对应关系。
- source_word: מִפְּנֵי
  choice: 在……面前
  rationale: 保留“在某方面前”的关系性表达，说明亚扪人在以色列人面前被制伏。
