base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: zh_hans
  text: 以色列向以东王派遣使者，说：“求你准许我从你的境内经过。”[a]可是以东王没有应允。以色列也向摩押王派遣使者，但他不愿意；[b]以色列就留在加低斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“求你让我经过”，为第一人称单数；这里的“我”指作为整体发言的以色列。
    reason: lexical_alternative
  - marker: b
    text: “不愿意”也可译作“不肯”或“不答应”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: 叙事中的普通动词，表示差派使者；现代汉语中“派使者”自然简洁。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 这里是国与国之间交涉的人类使者，不应译作“天使”。
- source_word: אֶעְבְּרָה נָּא
  choice: 求你让我们……经过
  rationale: נָא使第一人称祈愿式带有恳求语气。原文用单数，由作为整体的“以色列”发言；汉语按群体所指自然译为“我们”，并以脚注说明形式差异。
- source_word: בְאַרְצֶךָ
  choice: 从你的地经过
  rationale: 在行程语境中，介词与עבר合用表示过境；这一表达既自然，也不暗示停留或占据。
- source_word: וְלֹא שָׁמַע
  choice: 不肯听从
  rationale: שׁמע在这里不是单指听见，而是听取请求、依从；“不肯听从”准确传达拒绝响应的语境。
- source_word: וְגַם אֶל מֶלֶךְ מוֹאָב שָׁלַח
  choice: 以色列也派人到摩押王那里
  rationale: 原文第二次שׁלח省略显明的主语和宾语类别；汉语补出“以色列”和泛称“人”，使指代清楚而不增加实质内容。
- source_word: וְלֹא אָבָה
  choice: 但他不愿答应
  rationale: אָבָה表示愿意或同意；否定形式在此译为“不愿答应”，保留其意愿和同意层面的含义。
- source_word: וַיֵּשֶׁב
  choice: 仍住
  rationale: 在旅程叙事中表示继续留在某地；“仍住”不暗示永久定居。
- source_word: בְּקָדֵשׁ
  choice: 在加低斯
  rationale: 采用该地名通行的现代中文圣经译名，并自然表达所在地点。
