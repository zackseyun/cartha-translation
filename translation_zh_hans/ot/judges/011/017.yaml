  to: 以色列向以东王派遣使者，说：“求你准许我从你的境内经过。”[a]可是以东王没有应允。以色列也向摩押王派遣使者，但他不愿意；[b]以色列就留在加低斯。
  rationale: 修订保留原文第一人称单数及其集体指称，并将“听从”改为“应允”，避免汉语中主从方向的误解。其余叙事关系、外交语气、地名和“留在”的暂住含义均予保留。
