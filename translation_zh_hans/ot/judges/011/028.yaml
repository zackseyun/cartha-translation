lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: 可是……不听
  rationale: שׁמע 在此指听从、接受前述交涉内容；中文“听”在此语境自然包含“不予听从”的意思。“可是”承接并转折于耶弗他此前的陈词。
- source_word: אֶל דִּבְרֵי יִפְתָּח
  choice: 耶弗他……的话
  rationale: 保留“耶弗他的话”这一所属关系，同时调整语序，使整句符合现代汉语表达。
- source_word: אֲשֶׁר שָׁלַח אֵלָיו
  choice: 派人传给他
  rationale: 原文直译为“他送给他的”；结合11:12、14中使者往来的语境，“派人传给”自然表达通过使者送达话语，且不改变信息内容。
