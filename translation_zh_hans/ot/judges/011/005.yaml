  text: וַ/יְהִ֕י כַּ/אֲשֶׁר נִלְחֲמ֥וּ בְנֵֽי עַמּ֖וֹן עִם יִשְׂרָאֵ֑ל וַ/יֵּֽלְכוּ֙ זִקְנֵ֣י גִלְעָ֔ד לָ/קַ֥חַת אֶת יִפְתָּ֖ח מֵ/אֶ֥רֶץ טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: zh_hans
  text: 亚扪人同以色列交战的时候，基列的长老就到陀伯地去，把耶弗他接回来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接回来”直译“带走”或“带来”。这里指长老们前去把耶弗他从陀伯地带回去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ……的时候
  rationale: 这一希伯来叙事句式承接上文，并引出随后的行动；用“……的时候”自然表达其时间关系，不机械译出“事情发生了”。
- source_word: נִלְחֲמוּ
  choice: 交战
  rationale: לחם 的尼法勒词形在此表示投入战斗；“交战”准确、简洁，也适合庄重的历史叙事语体。
- source_word: בְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 这是指亚扪族群的常规称谓，比逐字译作“亚扪的子孙”更符合现代汉语习惯。
- source_word: עִם יִשְׂרָאֵל
  choice: 同以色列
  rationale: 介词 עִם 本义为“与、同”，与“交战”连用时自然表示交战的对方；汉语“同以色列交战”已清楚传达敌对关系。
- source_word: זִקְנֵי גִלְעָד
  choice: 基列的长老
  rationale: 忠实表达这一属格结构，所指是基列公认的领袖。
- source_word: לָקַחַת
  choice: 接回来
  rationale: לקח 常指“拿、带、领”；本句中长老前往耶弗他所在之处，目的是将他带回，因此“接回来”最符合汉语语境。脚注保留较贴近字面的译法。
- source_word: אֶת יִפְתָּח
  choice: 耶弗他
  rationale: אֶת 是直接宾语标记，不另译；人名按通行中文圣经译名译作“耶弗他”。
- source_word: מֵאֶרֶץ טוֹב
  choice: 到陀伯地去
  rationale: 原文 מִן 表示“从”；汉语将目的地提前说成“到陀伯地去”，再以“接回来”体现“从那里带回”，准确而自然。טוֹב 按通行地名译作“陀伯”。
theological_decisions: []
