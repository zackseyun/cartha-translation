  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: zh_hans
  text: 我没有得罪你，你却以恶待我，来与我交战。愿审判者雅威今日在以色列人和亚扪人之间[a]施行审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子和亚扪的众子”，即以色列人和亚扪人。
    reason: 说明希伯来语族群称谓的字面形式。
lexical_decisions:
- source_word: חָטָאתִי לָךְ
  choice: 得罪你
  rationale: חטא可指“犯罪、犯错”，与介词ל连用时表示对某人犯错或冒犯。在外交申辩语境中，“得罪你”既保留道德与司法意味，也比“向你犯罪”更符合现代汉语。
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: 以恶待我
  rationale: 原文直陈对方正以“恶、坏事”相待。“以恶待我”保留רָעָה的道德分量，并与前句的无罪申辩形成对照。
- source_word: לְהִלָּחֶם בִּי
  choice: 竟来攻打我
  rationale: לחם的反身词干表示交战、攻打；此处不只是个人争斗，而是两族之间的战争。“竟来”自然表达这场进攻正是前述恶待的具体表现。
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: 愿审判者……施行审判
  rationale: 保留同一希伯来词根שפט所形成的“审判者／审判”重复；“愿”体现此处诉诸上帝裁断的祈愿语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，表明这是以色列之上帝的专名，而非以一般称号替代。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 现代汉语中自然、直接地表达裁断的即时性。
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: 在以色列人和亚扪人之间
  rationale: בני加族祖或地名常构成族群称谓；译作“以色列人、亚扪人”准确而自然，字面形式另在脚注说明。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，采用音译可保留其专名性质；“雅威”较接近学界通常重构的读音。
- issue: “审判者”与“审判”的重复
  choice: 愿审判者雅威……施行审判
  alternative: 愿雅威裁决
  rationale: 原文以同根词强调雅威既是审判者，也是作出裁断者；译文保留这一修辞和神学张力。
- issue: בני的群体性表达
  choice: 以色列人和亚扪人
  alternative: 以色列子孙和亚扪子孙
  rationale: 此处争端发生于两个民族群体之间，בני是常见族群称谓。正文采用现代汉语的自然群体名称，同时以脚注保存字面表达。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留外交申辩和诉诸神圣裁断的语气；避免过度古雅，也不把原文的司法措辞弱化为一般性的争吵。
