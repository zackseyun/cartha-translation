base_translation:
  language: en
  yaml_path: translation/ot/judges/011/014.yaml
  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: zh_hans
  text: 耶弗他又派使者到亚扪人的王那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“亚扪之子的王”；“亚扪之子”是指亚扪人的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: 又
  rationale: 该结构表达动作的重复或继续；本句用现代汉语“又”自然传达“再次”的核心意义。叙事连接词 וַ 不必机械译作“然后”。
- source_word: יִפְתָּח
  choice: 耶弗他
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: 在外交使者的语境中，“派使者”比“发送使者”自然，也准确表达差遣之意。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处指奉派交涉的人，并非天使；“使者”兼具清楚、自然和庄重的语体。
- source_word: אֶל
  choice: 到……那里
  rationale: 方向介词 אֶל 在“派使者”结构中译为“到……那里”，符合现代汉语习惯。
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: 亚扪人的王
  rationale: בְּנֵי עַמּוֹן 字面为“亚扪之子”，是指亚扪民族的惯用表达；正文用“亚扪人”自然呈现其实际所指。
