  text: וַ/יִּדַּ֨ר יִפְתָּ֥ח נֶ֛דֶר לַ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָת֥וֹן תִּתֵּ֛ן אֶת בְּנֵ֥י עַמּ֖וֹן בְּ/יָדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: zh_hans
  text: 耶弗他向雅威许愿说：“如果你果真[a]把亚扪人交在我手中，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如果你确实把亚扪人交在我手中”。希伯来文用不定式绝对形与限定动词连用，以加强语气。
    reason: 说明原文强调结构及可行的措辞差异。
lexical_decisions:
- source_word: וַיִּדַּר יִפְתָּח נֶדֶר
  choice: 耶弗他……许愿
  rationale: 希伯来文以动词 נדר 和同源名词 נֶדֶר 构成强调性的同源宾语结构。现代汉语用“许愿”自然表达其意义；若硬译为“许下一个愿”，会显得累赘。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词 ל 在此标明许愿的对象，译作“向”；יהוה 是上帝的专名，音译为“雅威”。
- source_word: אִם
  choice: 如果
  rationale: 引出誓愿的条件从句；本节句意要到下一节才完整，因此保留未完的句式。
- source_word: נָתוֹן תִּתֵּן
  choice: 你果真……交
  rationale: 不定式绝对形 נָתוֹן 与限定动词 תִּתֵּן 连用，强化“交付”这一动作；“果真”既传达强调，也符合誓愿条件句的自然汉语表达。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 这是对“亚扪之子”的自然族名表达，清楚指亚扪民族或其军队。
- source_word: בְּיָדִי
  choice: 在我手中
  rationale: 保留希伯来文“交在某人手中”的惯用意象，意指置于某人的权势或控制之下。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不以称号替代，也不在本节中加入原文没有的解释。
- issue: 誓愿条件句中强调形式的理解
  choice: 如果你果真把……交在我手中
  alternative: 如果你确实把……交在我手中；你若把……交在我手中
  rationale: 原文的不定式绝对形加强限定动词，但不必将条件句改解为无条件的确定陈述；译文同时保留条件性和强调语气。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“许愿说”避免文言化；保留“交在我手中”这一清楚可懂的圣经意象。句末用逗号，表明誓愿的条件从句将在下一节继续。
