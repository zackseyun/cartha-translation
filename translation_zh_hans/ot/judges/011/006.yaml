base_translation:
  language: en
  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: zh_hans
  text: 他们对耶弗他说：“请来作我们的统帅，我们好与亚扪人交战。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“亚扪之子”，是指亚扪人的惯常族群称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 他们对……说
  rationale: 未将连接词机械译作“于是”或“并且”；中文叙事可借语序自然承接上文，同时准确表达复数主语的发言。
- source_word: לְיִפְתָּח
  choice: 对耶弗他
  rationale: 专名按通行中文圣经音译处理；介词标明说话对象。
- source_word: לְכָה
  choice: 请来
  rationale: 该命令式在此是邀请兼召请；“来”符合说话者要求耶弗他加入他们的语境，加“请”使现代汉语直接引语自然，并未削弱其请求意味。
- source_word: וְהָיִיתָה לָּנוּ
  choice: 作我们的
  rationale: 希伯来语直译为“成为/作给我们的”，现代汉语以“作我们的”自然表达所属与职分。
- source_word: לְקָצִין
  choice: 统帅
  rationale: קָצִין可指首领或军事长官；紧接与亚扪人交战的语境使军事性的“统帅”最贴切，同时不把它扩大为一般治理者。
- source_word: וְנִלָּחֲמָה
  choice: 我们好……交战
  rationale: 第一人称复数鼓励式承接前面的召请，可表达预期行动，也可带目的色彩；“我们好……”在中文中保留这种关联，而不强行限定为单纯并列。
- source_word: בִּבְנֵי עַמּוֹן
  choice: 与亚扪人
  rationale: 介词ב与“交战”连用时标示交战对象；“亚扪人”是“亚扪之子”的标准族群表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“统帅”凸显当前军事语境；“我们好与……交战”既自然，也保留希伯来语鼓励式与前句之间可能兼有并列和目的的张力。脚注标记置于整句之后。
