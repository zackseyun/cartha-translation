- from: 基列人耶弗他是个英勇的战士[a]。他是一个妓女所生的儿子；基列生了耶弗他[b]。
  to: 基列人耶弗他是个英勇的战士[a]。他是妓女的儿子；基列是他的父亲[b]。
  rationale: 修订仅处理父系生育动词在现代汉语中的不当表达，并略作措辞简化。修订后的“基列是他的父亲”明确传达原文“基列父亲了耶弗他”的父系关系，不将地区名误作主语，也不引入额外的解释。
