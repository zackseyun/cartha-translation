base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: zh_hans
  text: 基列人耶弗他是个英勇的战士[a]。他是妓女的儿子；基列是他的父亲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大能的勇士”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“基列”是耶弗他父亲的名字，不只是地区名称。
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: 基列人
  rationale: 这是表示地域归属的称谓，译作“基列人”自然、简洁，并与后文作为人名的“基列”有所区分。
- source_word: גִּבּוֹר חַיִל
  choice: 英勇的战士
  rationale: 该词组在本叙事中主要指勇武和军事才能；“英勇的战士”既传达勇力，也符合现代汉语表达。
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: 一个妓女所生的儿子
  rationale: זוֹנָה通常指妓女；此译清楚保留原文对母亲身份及耶弗他出身的陈述，不作委婉化处理。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 此处使役词形表达男性为父、生育后代；汉语家谱和叙事中“生了”简洁自然，并由主语明确父系关系。
- source_word: גִּלְעָד
  choice: 基列
  rationale: 这里是动词“生了”的主语，因此指名叫基列的人，而非仅指基列地区。
- source_word: וְ
  choice: 不单独译出
  rationale: 句首连词承担叙事衔接作用，现代汉语在此无需机械译作“于是”或“现在”；省略可使开篇自然，又不损失命题内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。将首个分句独立成句，以免连续使用“是”显得生硬；后半仍保留原文对母亲身份与父亲生育关系的并列陈述。
