  source_fidelity: “基列人耶弗他”“英勇的战士”以及对母亲为妓女的直述，均基本忠实于希伯来文。惟“基列生了耶弗他”在现代汉语中通常暗示女性分娩，不能准确表达希伯来文使役式在此所指的男性父亲身份。
  naturalness: “一个妓女所生的儿子”虽可理解，但略显累赘；“他是妓女的儿子”更自然、庄重，也保留原文措辞。将基列明确为父亲可消除“生了”造成的不自然和歧义。
  terminology: “基列人”“耶弗他”“英勇的战士”“妓女”均合乎现代标准汉语及经文语域。“大能的勇士”作为 גִּבּוֹר חַיִל 的备选译法可保留。
