base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: zh_hans
  text: 可是，西宏不放心让以色列人经过他的领土[a]。于是，西宏召集他的全体百姓[b]；他们在雅杂安营，西宏便与以色列人交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西宏不信任以色列人经过他的领土。”原文动词也可译为“不相信”；这里强调西宏对以色列人缺乏信任，并不只是说他不准他们经过。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他的全体百姓”，没有明确说“他的军队”，尽管上下文是战争。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: 不放心让
  rationale: 该词使役式在这里表示对人有信心或信任。结合后接“经过他的领土”，现代汉语用“不放心让”既表达西宏的不信任，也自然连接以色列人过境一事；不直接译成“不准”，以免只陈述结果而漏掉信任层面的含义。
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: 经过他的领土
  rationale: עֲבֹר 表示经过、穿越；גְּבוּל 在此指一国掌控范围内的土地，而不只是边界线，因此译作“领土”。
- source_word: וַיֶּאֱסֹף
  choice: 召集
  rationale: 此处描述西宏聚集百姓准备作战。“召集”符合军事背景，又没有把动词本身过度限定为“集结军队”。
- source_word: כָּל עַמּוֹ
  choice: 他的全体百姓
  rationale: 希伯来文直称“他的全体百姓”，并未明确写“军队”；保留这一宽泛说法，不以军事语境取代原文措辞。
- source_word: וַיַּחֲנוּ
  choice: 他们……安营
  rationale: 复数动词的主语是刚被召集的百姓。“安营”是自然、庄重且适合行军语境的表达。
- source_word: בְּיָהְצָה
  choice: 在雅杂
  rationale: 采用该地名常见的中文音译“雅杂”；地点前置词在此自然译为“在”。
- source_word: וַיִּלָּחֶם עִם
  choice: 与以色列人交战
  rationale: עִם 字面为“与”，但 לָחַם 明确表示交战；“与……交战”在现代汉语中自然表达敌对行动，同时保留原文介词结构。
