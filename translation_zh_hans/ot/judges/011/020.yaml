translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不放心让”避免生硬的“不信以色列经过”，也保留原文“不信任”的核心语义；后半句以分号和明确主语消除复数“安营”与单数“交战”之间可能产生的指代混淆。
