base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: zh_hans
  text: 她对他说：“我父亲啊，你既向耶和华开了口[a]，就照你口中所说的待我吧，因为耶和华已经替你向你的仇敌，就是亚扪人[b]，报了仇。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向耶和华开了口”是希伯来语惯用说法，这里指郑重说出了誓言。
    reason: cultural_note
  - marker: b
    text: 或译：“向你的仇敌——亚扪人。”希伯来语直译为“从你的仇敌、从亚扪人那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: 向耶和华开了口
  rationale: 保留希伯来语“开口”的具体表达；在本段许愿的语境中，它指郑重说出誓言。正文不直接改写为“许了愿”，以保存原文意象，并由脚注说明其惯用含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的形式来表达四字神名，而不以“主”这一称号替代。
- source_word: עֲשֵׂה לִי
  choice: 待我吧
  rationale: 表达女儿让父亲按誓言在自己身上履行所说之事；中文“待我”自然，并且没有预先断定具体如何履行誓言。
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: 照你口中所说的
  rationale: 保留“从口中出来”的核心意象，同时按现代汉语习惯表达为“口中所说的”，与前面的“开了口”相呼应。
- source_word: אַחֲרֵי אֲשֶׁר
  choice: 因为
  rationale: 此处主要说明她如此回应的理由，即耶和华已经使耶弗他战胜亚扪人，而不只是交代时间先后。
- source_word: נְקָמוֹת
  choice: 施行了报复
  rationale: 保留该词报复、惩罚仇敌的意义；用动词短语自然表达希伯来语复数名词所指的报复行动。
- source_word: מֵאֹיְבֶיךָ מִבְּנֵי עַמּוֹן
  choice: 向你的仇敌，就是亚扪人
  rationale: 将亚扪人理解为“你的仇敌”的同位说明；介词在报复语境中译为“向”，符合现代汉语搭配。
theological_decisions:
- issue: 耶弗他誓言在女儿身上如何履行
  choice: 只译出女儿愿父亲照所说的待她，不说明誓言最终意味着献祭还是终身不嫁或奉献。
  alternative: 明确译成她接受被献为祭，或明确译成她接受终身守贞、事奉。
  rationale: 本节本身只记载她顺服父亲所说的誓言，并未在这一句中交代履行方式；译文因此保留经文的歧义和神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我父啊”保留古代直接称呼的郑重语气；“待我吧”避免添加本节未明说的誓言履行方式。所有脚注标记均置于相关正文之后。
