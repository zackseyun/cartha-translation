base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: zh_hans
  text: 他对他说[a]：“耶弗他这样说：以色列没有取得摩押地，也没有取得亚扪人之地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他对他说”中的两个“他”，前者指耶弗他的使者，后者指亚扪人的王。
    reason: 原文只使用男性单数代词；中文连续使用两个“他”容易造成指代不清，脚注依据上下文说明所指。
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: 他对他说
  rationale: 按叙事顺序直译这一言说公式，并保留两个男性单数代词；虽然中文略显重复，却忠实保留原文指代关系。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 这是正式的传话公式；“这样说”自然、庄重，也保留了所引信息来自耶弗他的表达。
- source_word: יִפְתָּח
  choice: 耶弗他
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: לֹא לָקַח
  choice: 没有夺取
  rationale: לקח基本义为“拿、取”；此处涉及领土争议，“夺取”能自然表达从他方取得土地的语境，同时不把含义收窄为某一种具体军事行动。
- source_word: אֶרֶץ
  choice: 地
  rationale: “地”简洁地涵盖地域与领土含义，并在两个并列短语中保留原文的重复结构。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用通行中文译名。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 该短语字面为“亚扪之子”，在这里是族群称谓；译作“亚扪人”符合现代汉语习惯，不会误解为仅指男性后裔。
