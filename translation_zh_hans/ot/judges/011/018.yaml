  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: zh_hans
  text: 他们在旷野中前行，绕过以东和摩押的土地，来到摩押地的东面[a]，在亚嫩河的对岸[b]扎营；他们没有进入摩押境内，因为亚嫩河是摩押的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从日出之处来到摩押地”；“日出之处”指东方，也可理解为“从东边来到摩押地”。
    reason: 保留希伯来语“日出”这一字面意象，以及路线表达所含的方位细微差异。
  - marker: b
    text: 或译“在亚嫩河那一边”；原文没有明说以哪一侧为参照点。
    reason: 保留相对方位词的视角歧义。
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: 他们在旷野中前行
  rationale: הלך是“走、前往”，与במדבר连用表示在旷野中的行程。“前行”自然地表达路线推进；主语按上下文明确为以色列众人，并与本节随后出现的复数动词协调。
- source_word: וַיָּסָב אֶת אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: 绕过以东地和摩押地
  rationale: סבב在此指绕行、不穿越两地；“绕过”既准确又符合现代汉语地理叙事。ארץ译作“地”，简洁保留地域含义。
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: 来到摩押地东边[a]
  rationale: מזרח שמש字面与“日出”有关，是表示东方的惯用语。结合下文未进入摩押境内，译作“来到摩押地东边”清楚表达所在方位，同时以脚注保留原文意象及可能的路线表达。
- source_word: וַיַּחֲנוּן
  choice: 扎营
  rationale: חנה意为安营、扎营。“扎营”是现代汉语常用而庄重的叙事表达。
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: 在亚嫩河对岸[b]
  rationale: עבר表示某物的另一边或彼岸，但参照视角没有明说。“对岸”保留这种相对方位，不强行确定具体方向。
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: 他们没有进入摩押境内
  rationale: גבול可指边界，也可延伸指边界以内的领土。与בוא搭配时，“进入摩押境内”自然传达没有越界进入其领土的意思。
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: 因为亚嫩河是摩押的边界
  rationale: כי在此引出原因；גבול在说明河流的地理功能时译作“边界”准确而自然。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“旷野”“扎营”“边界”等词适合普通读者，也保留经文的地理叙述风格。主文避免生硬直译“日出之处”，并用脚注呈现原文表达；所有脚注标记均置于所解释的短语之后。
