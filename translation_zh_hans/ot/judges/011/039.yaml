  terminology: “所许的愿”“与男子同房”“惯例”均合乎本段语境。“与男子同房”准确表达“认识男子”这一性关系委婉语。脚注中应将另一种解释表述为“奉献她，使她终身守贞”，避免“把她献上”在汉语中与献祭解释混同。
