base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: zh_hans
  text: 两个月期满，她回到父亲那里；父亲便在她身上履行了自己所许的愿[a]。她从未与男子同房[b]。这事便成了以色列的一项惯例：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他向她实行了自己所许的愿”。对于这是否表示耶弗他把她献为祭，还是奉献她、使她终身守贞，解释者意见不一；本节的希伯来语措辞本身没有明确裁定。
    reason: alternative_reading
  - marker: b
    text: 直译为“她未曾认识男子”，是希伯来语的委婉说法，表示她未曾与男子发生性关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: 两个月期满
  rationale: מִקֵּץ 表示一段时期达到终点；此译简洁地保留了时间界限。
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: 她回到父亲那里
  rationale: 按 שׁוּב 的通常叙事含义译为“回到”，并保留原文明确指出的关系对象“父亲”，不泛化为“家”。
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: 父亲就照自己所许的愿，在她身上履行了
  rationale: 兼顾 עשה ל־ 的直接性和 נדר 的重复意味。“在她身上履行”避免把句意弱化为一般的“还愿”，同时不替原文裁定具体如何履行。
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: 她从未与男子同房
  rationale: “认识男子”在现代汉语中不能自然传达希伯来语的性关系委婉语；意译为“与男子同房”可准确、庄重地表达实际语义。
- source_word: וַתְּהִי חֹק בְּיִשְׂרָאֵל
  choice: 这事便成了以色列的一项惯例
  rationale: 结合下一节每年举行的群体性活动，חֹק 在此更自然地指确立的惯例，而非正式成文法；“便成了”也保留 וַתְּהִי 的发展意味。
theological_decisions:
- issue: 耶弗他如何履行所许的愿
  choice: 正文保留“照自己所许的愿，在她身上履行了”这一未明说具体行为的表述。
  alternative: 明确译成把女儿献为燔祭，或明确译成将她献上终身守贞。
  rationale: 希伯来文本在本节只说他在她身上履行了所许的愿，随后说明她未曾与男子同房；这两句话本身没有明确裁定长期存在的两种主要解释，因此译文不应替原文消除这一张力。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“在她身上履行了”有意保留原文的突兀感与解释空间；末尾冒号承接下一节对这一惯例的说明。
