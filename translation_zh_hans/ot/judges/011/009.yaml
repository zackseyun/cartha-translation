base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: zh_hans
  text: 耶弗他对基列的长老说：“如果你们接我回去攻打亚扪人，雅威把他们交在我面前，我就作你们的首领[a]。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”原文直译为“头”，也可译作“领袖”或“首脑”。
    reason: lexical_alternative
  - marker: b
    text: 末句也可理解为问句：“我就作你们的首领吗？”
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים אַתֶּם אוֹתִי
  choice: 你们接我回去
  rationale: 使役形态表达“使我返回”。结合耶弗他先前被赶走、如今受邀回归的语境，“接我回去”既保留使役意义，也符合现代汉语习惯。
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: 攻打亚扪人
  rationale: לְהִלָּחֵם 指投入战斗，介词 בְּ 在此带有敌对意义；“攻打亚扪人”简洁自然，并以通行族名表达字面的“亚扪之子”。
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: 雅威使他们败在我面前
  rationale: 字面结构是“雅威把他们交在我面前”，在战争语境中表示神使敌军败在耶弗他面前。“使他们败在我面前”保留 לְפָנַי 的空间意象，同时用自然汉语传达成败含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以“主”等称号替代。
- source_word: לְרֹאשׁ
  choice: 首领
  rationale: רֹאשׁ 本义为“头”，在此比喻群体的领袖。“首领”在现代汉语中自然、庄重，并保留“居首”的词义联系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译，以专名而非头衔呈现。传统译名“耶和华”列为可理解的另一种汉语形式，但不用于正文。
- issue: 末句 אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ 的语气
  choice: 陈述句：“我就作你们的首领”
  alternative: 问句：“我就作你们的首领吗？”
  rationale: 希伯来文没有疑问词或显明的疑问标记，形式上是陈述句，因此正文按陈述处理；但上下文是耶弗他与长老确认条件，也可能理解为要求对方确认的问句，故以脚注保留这一语篇歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。人名和地名使用通行圣经译名“耶弗他”“基列”“亚扪”；条件句结构清楚，避免生硬照搬希伯来语序。
