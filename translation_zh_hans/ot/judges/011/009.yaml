  naturalness: 整体为自然、庄重的现代汉语；“接我回去”“攻打亚扪人”“作你们的首领”均通顺合宜。“把他们交在我面前”具有合适的圣经叙事语体，且在此上下文中可理解。
  terminology: “耶弗他”“基列”“亚扪人”“雅威”一致且恰当。“首领”自然地表达 לְרֹאשׁ 的政治领导含义；脚注保留“头”这一字面隐喻及“领袖”等替代译法是适当的。
