base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: zh_hans
  text: 她对父亲说：“请准我这件事：容我有两个月的时间，让我和我的女伴到山地去，在群山间行走，为我的童贞哀哭[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“为我的童贞哀哭”。“童贞”强调她未婚、未育的处境；本节本身没有解决整段叙事中更广泛的解释问题。
    reason: 保留原文焦点及相关的解释张力。
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: 请答应我这件事
  rationale: 原文直译近于“愿这件事为我成就”。这里是请求语气；译为“请答应我这件事”既符合现代汉语，也保留“这件事”的指示表达，避免擅自扩写为更具体的请求内容。
- source_word: הַרְפֵּה מִמֶּנִּי שְׁנַיִם חֳדָשִׁים
  choice: 让我离开两个月
  rationale: רפה 与 מן 及人称后缀连用，在此表示放手、容许离开。译文采用自然的汉语请求表达；脚注补明也可理解为“暂时不要管我／容我独处”。
- source_word: וְאֵלְכָה וְיָרַדְתִּי עַל הֶהָרִים
  choice: 好让我到山间去
  rationale: 希伯来文连用“去”和“下到”两个动词。逐字译成汉语会显得生硬；“到山间去”自然表达其前往山地的行动，同时不加入原文没有明确表达的“游荡”。
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: 为我的童贞哀哭
  rationale: בכה על 表示为某事哀哭、悲叹；בְּתוּלִים 指童贞或未婚处女的状态。“为我的童贞哀哭”紧贴原文，不把本节没有明说的死亡或终身奉献写入正文。
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: 我和我的女伴一同去
  rationale: רֵעוֹתָי 是阴性复数，指她的女性同伴。补入“一同去”使句末在现代汉语中完整顺畅，并承接前面的行动。
theological_decisions:
- issue: 耶弗他的女儿为何为自己的童贞哀哭
  choice: 保留“为我的童贞哀哭”的原文措辞，不在正文中判定后续结局的具体性质。
  alternative: 明确译成她因即将死亡且无后而哀哭，或明确译成她因终身守童贞而哀哭。
  rationale: 本节明确强调她的童贞，即未婚和未育的状态，却没有在这里直接说她为死亡哀哭。直译这一焦点可保留叙事中真实存在的解释张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“童贞”准确对应原文，并比“处女之身”更简洁；“女伴”明确反映希伯来文的阴性复数。句式保持请求、目的和同行者三个层次，适合公开诵读。
