  naturalness: “从亚嫩河直到雅博河，又直到约旦河”中“又直到”略显生硬，且句号将原文连续的申诉与命令断开。改为“从亚嫩河到雅博河，直至约旦河；现在……”更符合现代汉语，同时不改变地理范围或论证关系。
  terminology: “亚扪人”“耶弗他”“亚嫩河”“雅博河”“约旦河”均为通行且恰当的中文圣经地名、人名译法。“土地”“归还”“和平地”也准确合乎本节争端语境。
