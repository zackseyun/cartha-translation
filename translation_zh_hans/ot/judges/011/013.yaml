base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: zh_hans
  text: 亚扪人的王对耶弗他的使者说：“因为以色列从埃及上来时夺取了我的土地，从亚嫩河到雅博河，直至约旦河；现在就和平地归还这些土地吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 保留原文因果连词及其略显紧凑的答复结构，不改写成单纯陈述。
- source_word: לָקַח
  choice: 夺取
  rationale: 在领土争端语境中表达“取走、占取”的指控，比中性的“拿走”自然准确。
- source_word: אַרְצִי
  choice: 我的土地
  rationale: 保留亚扪王以第一人称提出的领土主张，不由译者判定该主张是否正当。
- source_word: הָשִׁיבָה
  choice: 归还
  rationale: 体现使役/归回含义以及对方要求把所称土地交还的命令语气。
- source_word: אֶתְהֶן
  choice: 这些地方
  rationale: 原文为阴性复数“它们”，语境指前述范围内的土地；汉语用“这些地方”可清楚承接。
- source_word: בְּשָׁלוֹם
  choice: 和平地
  rationale: 保留“不诉诸争战、和平解决”的方式含义，避免译成仅指人身安好的“平安地”而产生歧义。
theological_decisions:
- issue: 亚扪王关于土地归属的陈述
  choice: 按引语保留为“我的土地”的主张
  alternative: 根据后文历史论证改写或弱化其所有权说法
  rationale: 本节记录的是亚扪王的指控，并不在叙述者层面裁定其真伪；译文应保留人物话语与后文反驳之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“因为”开头的希伯来语答复结构。地名采用常见中文圣经译名“亚嫩河、雅博河、约旦河”，命令句以“吧”表达直接要求而不过度粗厉。
