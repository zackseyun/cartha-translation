revisions:
- from: 亚扪人的王对耶弗他的使者说：“因为以色列从埃及上来的时候夺取了我的土地，从亚嫩河直到雅博河，又直到约旦河。现在就和平地归还这些地方吧。”
  to: 亚扪人的王对耶弗他的使者说：“因为以色列从埃及上来时夺取了我的土地，从亚嫩河到雅博河，直至约旦河；现在就和平地归还这些土地吧。”
  rationale: 仅作汉语行文和标点的轻微修订。“上来时”对应原文时间性不定式结构；“从……到……，直至……”自然表达所列边界；“这些土地”明确承接原文阴性复数代词所指的前述土地。原文的因果连词、人物立场、命令语气及“和平地”的方式意义均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:28Z'
review_pass:
  verdict: revise
