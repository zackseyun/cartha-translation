  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: zh_hans
  text: 于是，耶弗他渡到亚扪人那里，与他们交战[a]；雅威把他们交在他手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“渡到亚扪的子孙那里，与他们交战”。“亚扪的子孙”在这里指亚扪人。
    reason: 说明原文的移动意象和族群称谓。
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 渡到
  rationale: עבר的基本意思是“经过、越过、渡过”。结合本段叙事中的军事行动，“渡到”保留了具体的移动意象，同时不把动词本身解释成“进攻”。
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: 到亚扪人那里
  rationale: אֶל通常表示“到、向”；בְּנֵי עַמּוֹן字面为“亚扪的子孙”，在这里是族群称谓，现代汉语自然译作“亚扪人”。
- source_word: לְהִלָּחֶם בָּם
  choice: 与他们交战
  rationale: לחם的尼法勒式搭配介词ב，表示与某方作战。“与他们交战”符合现代汉语军事语境，且不夸大原文含义。
- source_word: וַיִּתְּנֵם
  choice: 把他们交
  rationale: נתן与“在某人手中”组合，是把敌方交由某人制伏的常见战争用语；保留“交在手中”的原文意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用神的专名四字神名；“雅威”以现代汉语音译呈现这一专名，而不是用称号代替。
- source_word: בְּיָדוֹ
  choice: 在他手中
  rationale: 直译保留希伯来语“手”所表达的权势和控制意象，现代汉语也能自然理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 此处原文明确使用四字神名。采用“雅威”是按较通行的学术重构音译神的专名；不以“主”等称号替换，也不使该译法承担经文没有明说的额外神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文；“渡到”保留עבר的具体空间移动，“交在他手中”保留圣经战争叙事中的希伯来语意象。
