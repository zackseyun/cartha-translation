  text: וַ/יֹּאמְר֥וּ זִקְנֵֽי גִלְעָ֖ד אֶל יִפְתָּ֑ח יְהוָ֗ה יִהְיֶ֤ה שֹׁמֵ֨עַ֙ בֵּֽינוֹתֵ֔י/נוּ אִם לֹ֥א כִ/דְבָרְ/ךָ֖ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: zh_hans
  text: 基列的长老对耶弗他说：“如果我们不照你的话去做，雅威必在我们之间作见证[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“雅威必在我们之间作听者”。在立誓或争议的语境中，“听者”可指听取双方所言、作见证，并可能施行判断的一位。
    reason: 说明希伯来语“听”的字面表达及其在立誓语境中的见证和司法含义，同时不把其作用限定为单纯见证或审判。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: 叙事性连续式推进情节；现代汉语无需机械加上“于是”，上下文已能表达顺序。
- source_word: זִקְנֵי גִלְעָד
  choice: 基列的长老
  rationale: 该组合结构指属于基列、代表当地群体的长老或领袖；此译法自然且准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见现代汉语音译处理，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: 必在我们之间听审
  rationale: שֹׁמֵעַ 字面为“听着”，但在双方立誓和争议语境中具有听取案情、作证或判断的司法意味。“听审”既保留“听”的词面意象，也传达司法语境，同时不把角色完全限定为“见证者”或“审判者”。
- source_word: אִם לֹא
  choice: 如果……不……
  rationale: 此处引出誓言所附的否定条件，不宜处理为单纯加强语气的“确实”。
- source_word: כִדְבָרְךָ
  choice: 照你的话
  rationale: 忠实表达“按照你的话”，此处“话”指耶弗他刚才提出的条件。
- source_word: כֵּן נַעֲשֶׂה
  choice: 去做
  rationale: 与前面的“照你的话”合译为自然汉语“照你的话去做”；未完成体在誓言语境中的将来承诺意味由整句表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”可保留专名及其较接近学界通行重构读音的形式，避免用称号“上主”替代，也不与传统上源自另一套元音组合的“耶和华”混同。
- issue: “在我们之间听着”的司法含义
  choice: 听审
  alternative: 作证；审判；听着
  rationale: 原文使用“听”而非通常表示“见证”的名词。“听审”保留词汇意象并提示司法功能，又不武断判定雅威在誓言中仅是见证者还是审判者；脚注说明其可能涵盖的含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“听审”略带司法色彩，切合本节立誓场景；条件句前置符合自然汉语表达。脚注标记已置于对应短语之后。
