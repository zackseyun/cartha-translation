base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: zh_hans
  text: 雅威的灵临到耶弗他身上；他经过基列和玛拿西，又经过基列的米斯巴；从基列的米斯巴，他前往亚扪人那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他越过，到了亚扪人那里。”希伯来语动词可按语境表示经过、越过或继续前行。
    reason: 保留 עבר 在此处可表示前往或越过的词义歧义，并改正原脚注中不自然的中文搭配。
lexical_decisions:
- source_word: ר֣וּחַ יְהוָ֔ה
  choice: 雅威的灵
  rationale: 在《士师记》的叙事语境中，רוּחַ יְהוָה 指雅威赐能力的灵，而非风或气息；יְהוָה 按其专名译为“雅威”。
- source_word: וַ/תְּהִ֤י עַל
  choice: 临到……身上
  rationale: 此表达自然传达神的灵来到并作用于某人，同时保留希伯来语叙事动词的事件性。
- source_word: יִפְתָּח
  choice: 耶弗他
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָד וְ/אֶת מְנַשֶּׁה
  choice: 他就经过基列和玛拿西
  rationale: עבר 带直接宾语指地区时可自然理解为穿行或经过这些地域；“经过”既清楚又不过度限定具体路线。
- source_word: מִצְפֵּ֣ה גִלְעָ֔ד
  choice: 基列的米斯巴
  rationale: 这是地名而非普通名词，采用音译“米斯巴”，并以“基列的”表达希伯来语属格结构。
- source_word: עָבַ֖ר בְּנֵ֥י עַמּֽוֹן
  choice: 继续前往亚扪人那里
  rationale: 此处 עבר 表示从米斯巴继续移动，בְּנֵי עַמּוֹן 是所趋向的人群或敌方。“继续前往”保留移动方向，却不提前断定已经发动攻击。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”较直接地保留其专名性质，不以称号替代。
- issue: 雅威的灵临到耶弗他的含义
  choice: 保留为“雅威的灵临到耶弗他身上”
  alternative: 解释性译为“雅威赐能力给耶弗他”
  rationale: 上下文暗示这是为领导和争战而得能力，但正文不把“灵”改写成抽象能力，以免抹去原文的神学表述或加入超出本节的说明。
- issue: 耶弗他最后一次 עבר 的行动性质
  choice: 译为中性的“继续前往”
  alternative: 向亚扪人进攻
  rationale: 叙事背景是战争，但该动词本身主要表达经过、越过或继续前行；不在此处明定为发动攻击，以保留词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留原文重复出现“基列的米斯巴”的叙事节奏，地名和人名使用简体中文圣经语境中的通行译名。
