  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: zh_hans
  text: 难道凡是你的神基抹使你得以占有的，你不占有吗？凡雅威我们的上帝从我们面前赶走的，我们也要占有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为：“凡雅威我们的上帝从我们面前赶走的，我们就要占有。”本节重复使用同一希伯来语词根，可指占有领土，也可指使原有占有者失去其地；原文在“赶走的”与“占有的”之间的具体所指并未明说。
    reason: 说明重复词根及原文压缩的指代关系，避免正文补入未明说的“人所留下的土地”。
lexical_decisions:
- source_word: הֲלֹא
  choice: 难道……不……吗
  rationale: 引出预期肯定回答的反问，符合耶弗他对亚扪王辩论时的语气。
- source_word: יוֹרִישְׁךָ
  choice: 使你得以占有
  rationale: 保留 ירשׁ 的使役形含义，表达基抹使对方取得领土，同时不把手段解释得过死。
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: 你的神基抹
  rationale: 按原文直接保留外交性、修辞性的称呼，不额外暗示叙述者承认基抹真实具有神性。
- source_word: תִירָשׁ
  choice: 占有
  rationale: 此处谈的是领土控制；“占有”比“继承”更符合军事和外交语境。
- source_word: הוֹרִישׁ
  choice: 赶走
  rationale: 使役形在本分句中突出雅威除去原有居民的行动；现代汉语“赶走”自然清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现上帝的专名，不用称号替代。
- source_word: מִפָּנֵינוּ
  choice: 从我们面前
  rationale: 保留希伯来语的空间意象，指在以色列人前进的道路上将人除去。
- source_word: נִירָשׁ
  choice: 我们也要占有
  rationale: 与前半节的 תִירָשׁ 对应，保留领土占有的含义；“也”清楚表现双方论证的对应关系。
theological_decisions:
- issue: 耶弗他称基抹为“你的神”
  choice: 直接译为“你的神基抹”
  alternative: 加引号、译作“你所谓的神”，或明说基抹并非真神
  rationale: 原文是在转述并利用对方的宗教立场进行外交论证，并未在此处说明基抹是否真实具有神性；直译可保留这种修辞张力。
- issue: 雅威赶走的人与以色列占有的对象之间的语法转换
  choice: 译出隐含的“人所留下的土地”
  alternative: 较形式地译作“凡雅威从我们面前赶走的，我们都要占有”
  rationale: 原文用关系结构将被赶走者与其土地压缩在同一句中。汉语若直接说“赶走的，我们要占有”，容易被误解为占有人；补出“所留下的土地”使所指清楚，但以脚注说明原文结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“难道……不……吗”保留反问力度；“同样”呈现两方主张的平行关系。因正文有脚注标记[a]，脚注与标记完全对应。
