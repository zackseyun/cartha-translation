  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: zh_hans
  text: 耶弗他派使者去见亚扪人的王，说：“我与你有什么相干，你竟来到我这里，在我的地上与我交战？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: 该叙事形式推进事件次序；现代汉语无需机械译出连接词，用“派”自然承接上文。
- source_word: יִפְתָּח
  choice: 耶弗他
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处是外交语境，指奉派传话的人，并非天使；“使者”准确且庄重。
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: 去见亚扪人的王
  rationale: “亚扪人”自然表达原文的族群称谓；“去见”符合汉语中派遣使者前往某人处的说法。
- source_word: מַה לִּי וָלָךְ
  choice: 我跟你有什么过节
  rationale: 这是表示双方争执、敌对或彼此无涉的希伯来语习惯表达。“有什么过节”在现代汉语中自然传达本段的敌对语境，同时以脚注保留其较直译的形式。
- source_word: כִּי
  choice: 竟
  rationale: 这里引出质问所针对的情形；“竟”在汉语中自然表现责问和意外之意，而不把它硬译成因果连词。
- source_word: בָאתָ אֵלַי
  choice: 你竟到我这里来
  rationale: 保留“来到我这里”的空间表达；敌对含义由下文“交战”清楚显明，不额外改成“攻击我”。
- source_word: לְהִלָּחֵם
  choice: 与我交战
  rationale: 该动词表示投入战斗；“交战”比口语化的“打仗”更符合外交质问的庄重语体。
- source_word: בְּאַרְצִי
  choice: 在我的土地上
  rationale: 保留介词“在”和“我的地”之义；“土地”既具体又不预先把争议中的地域解释为现代意义的主权领土。
