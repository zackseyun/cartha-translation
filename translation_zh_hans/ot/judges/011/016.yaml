base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: zh_hans
  text: 原来，以色列人从埃及上来时，在旷野行进，直到红海[a]，又来到加低斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红海”或译“芦苇海”。
    reason: יַם־סוּף的传统译名是“红海”，而按סוּף的通常词义也可译为“芦苇海”；正文采用通行名称，脚注保留词义上的可能译法。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 在耶弗他的历史陈述中引出对前文主张的解释或依据；随后“不定词＋介词”的结构另以“……的时候”表达时间关系。
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: 以色列人从埃及上来的时候
  rationale: ב 加不定词及第三人称复数后缀构成时间从句。中文明确补出“以色列人”，既承接后句主语，也避免代词指向含混；“上来”保留出埃及叙事的惯用空间表达。
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: 以色列人曾在旷野中行进
  rationale: הלך 的基本义为行走、前往；结合地点短语译作“在旷野中行进”自然且不过度规定路线。“以色列人”表达专名在此所指的群体。
- source_word: עַד יַם סוּף
  choice: 直到红海
  rationale: עַד 表示空间所及的界限，译作“直到”。יַם־סוּף 采用现代中文最通行的传统名称“红海”，同时以脚注保留词源上可能的译法。
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: 又来到加低斯
  rationale: בוא 表示来到；地名后的方向词尾 ה 表示朝向该地，中文“来到”已自然包含方向。原文仅作“加低斯”，不扩写为“加低斯巴尼亚”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“因为……的时候”保留 כִּי 的解释功能和 בַּעֲלוֹתָם 的时间功能；“曾”提示这是回顾性的历史叙述。脚注标记置于“红海”之后。
