base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: zh_hans
  text: 他一看见她，就撕裂衣服，说：“唉，我女儿啊！你实在使我大受打击；你也成了使我陷入困境的人！我已经向耶和华开了口[a]，不能收回。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经向耶和华许了愿。”希伯来文直译为“我已经向耶和华开了口”。
    reason: 说明希伯来习语在本段语境中的明确含义，同时保留正文的原文意象。
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: 他一看见她
  rationale: 将希伯来叙事公式自然化为现代汉语时间结构；“一……就……”也与随后立即撕裂衣服的动作衔接。
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: 就撕裂衣服
  rationale: 准确保留撕衣这一表达悲痛、惊骇的具体动作，且符合庄重的中文圣经语体。
- source_word: אֲהָהּ בִּתִּי
  choice: 哀哉，我女儿
  rationale: “哀哉”传达强烈悲叹而不过度口语化；“我女儿”保留直接呼语。
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: 你实在使我一蹶不振
  rationale: 不定式绝对式与同根限定动词构成强调。“一蹶不振”自然表达被彻底击倒、陷入低谷的强烈语气，同时不将其具体化为毁灭。
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: 也成了使我愁苦的人
  rationale: עכר表示使人遭难或陷入困苦；此译保留女儿作为其困扰缘由的说法，却不额外断定她负有道德过错。
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: 我已经向耶和华开了口
  rationale: 保留原文“向耶和华开口”的庄严意象及其上下文中的许愿含义，并在脚注中明示该习语的意思。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神名形式，作为四字神名的音译，而非以称号替代。
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: 不能收回
  rationale: 上下文所指是不能撤回已经向耶和华说出的话；“收回”在中文中自然清楚，同时保留原文回转、撤回之意。
theological_decisions:
- issue: 是否在正文中直接说明耶弗他所说的是许愿
  choice: 保留“向耶和华开了口”这一希伯来习语，并用脚注明示其语境含义。
  alternative: 我已经向耶和华许了愿。
  rationale: 上下文明显涉及耶弗他的誓愿，但原文特意使用“开口”的庄严说法。正文保留这一措辞，可避免把隐含意义完全改写为解释；脚注则帮助普通读者理解。
- issue: 如何呈现耶弗他对女儿所表达的痛苦与归因
  choice: 译作“使我一蹶不振，也成了使我愁苦的人”。
  alternative: 你毁了我，成了我的灾星。
  rationale: 原文情绪极为强烈，并把当前困境与女儿的出现联系起来；但更猛烈的中文措辞容易额外赋予她道德罪责。所选译法保留叙述中的张力而不替文本作伦理裁决。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“哀哉”保留悲叹色彩；其余句式避免过度古雅。“一蹶不振”传达同根结构的强烈强调，“收回”则按上下文明确指向已出口的话。
