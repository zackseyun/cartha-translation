- from: 他一看见她，就撕裂衣服，说：“哀哉，我女儿！你实在使我一蹶不振，也成了使我愁苦的人！我已经向耶和华开了口[a]，不能收回。”
  to: 他一看见她，就撕裂衣服，说：“唉，我女儿啊！你实在使我大受打击；你也成了使我陷入困境的人！我已经向耶和华开了口[a]，不能收回。”
  rationale: 修订仅收敛两处可能过度或偏窄的中文表达：“大受打击”保留重复动词所加强的痛苦与受挫，不加入“一蹶不振”的持久性断言；“使我陷入困境的人”更贴近עכר的致祸、困扰语义。其余措辞及脚注均保留原稿对原文习语、庄重语体和神名的处理。
