base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: zh_hans
  text: 基列的妻子给他生了儿子。那妻子的儿子们长大后，就把耶弗他赶出去，对他说：“你不可在我们父家承受产业，因为你是另一个女人的儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: 基列的妻子
  rationale: 按希伯来文构造直译，明确她是基列的妻子，并与上一节耶弗他的母亲形成对照。
- source_word: בְנֵי הָאִשָּׁה
  choice: 那妻子的儿子们
  rationale: 保留原文定冠词及较突出的重复表达，不擅自改成“他的妻子的儿子”，同时使中文所指清楚。
- source_word: לֹא תִנְחַל
  choice: 你不可……承受产业
  rationale: נחל在此指取得家族产业或继承份额；“不可”保留兄弟们排斥、禁止耶弗他的语气，而非把话改写成单纯的未来预测。
- source_word: בְּבֵית אָבִינוּ
  choice: 在我们父家
  rationale: 保留“父家”这一亲属与家产单位的表达，不窄化为仅指一栋房屋。
- source_word: בֶּן אִשָּׁה אַחֶרֶת
  choice: 另一个女人的儿子
  rationale: 贴近原文字面，并保留说话者以母系差异排斥耶弗他的贬抑意味。
theological_decisions:
- issue: 耶弗他被剥夺家族产业的陈述性质
  choice: 译作兄弟们的禁止性宣告：“你不可……承受产业”
  alternative: “你不会在我们父家有产业”
  rationale: 希伯来文未完成式在直接话语中可表达禁止或坚决否定；上下文是兄弟们主动赶逐耶弗他，因此禁止性表达自然，但不对其行为是否合法作神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“承受产业”“父家”保留古代家族继承语境所需的术语感；通过“那妻子”忠实呈现原文有意的重复与对照。
