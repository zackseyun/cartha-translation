  yaml_path: translation/ot/judges/011/004.yaml
  text: After some time[a], the Ammonites fought against Israel.
translation:
  language: zh_hans
  text: 过了一段时间[a]，亚扪人与以色列人交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“事情发生在一些日子之后。”这是表示一段时间过去的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: 过了一段时间
  rationale: 这一惯用语表示若干时日过去，而不是强调“事情发生了”。译作“过了一段时间”自然、清楚，也保留了时间推移的含义。
- source_word: וַיִּלָּחֲמוּ
  choice: 交战
  rationale: 此处לחם的尼法勒式表示投入战斗；“交战”符合战争语境，语言简洁庄重。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 字面为“亚扪之子”，在此是族群名称；“亚扪人”是现代汉语中自然且通行的译法。
- source_word: עִם יִשְׂרָאֵל
  choice: 与以色列人
  rationale: עִם字面义为“与”，与לחם连用时指出交战的对方。汉语“与……交战”已明确表达敌对关系，无须另加“对抗”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“就”承接叙事中的连续动作；“以色列人”在族群对举中比单称“以色列”更符合汉语表达，并与“亚扪人”保持对应。
