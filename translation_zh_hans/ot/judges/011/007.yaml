base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: zh_hans
  text: 耶弗他对基列的长老说：“从前恨我、把我赶出父家的人，不正是你们吗？如今你们身处困境[a]，为什么来找我呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有难”或“遭遇患难”。希伯来语 כַּאֲשֶׁר צַר לָכֶם 表示处于窘迫或困境中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来叙事中常见的 אמר 连续式，现代汉语自然译作“说”。
- source_word: זִקְנֵי גִלְעָד
  choice: 基列的长老
  rationale: 复数构造词组指基列共同体中具有治理职责的长老；“长老”既保留其社会政治角色，也符合圣经叙事用语。
- source_word: הֲלֹא
  choice: 不正是……吗
  rationale: 该形式引出预期对方承认的反问；“不正是……吗”自然传达其质问语气。
- source_word: שְׂנֵאתֶם
  choice: 恨
  rationale: שׂנא 的直接含义是“恨”；不弱化为“厌弃”，也不作更强烈的发挥。
- source_word: וַתְּגָרְשׁוּנִי
  choice: 把我赶出
  rationale: גרשׁ 表示驱逐；“赶出”在现代汉语中自然，并保留强迫离开的力度。
- source_word: מִבֵּית אָבִי
  choice: 父家
  rationale: 该短语可兼指父亲的家宅和家族共同体；“父家”简洁保留这种家族与法律背景上的含义。
- source_word: וּמַדּוּעַ
  choice: 为什么
  rationale: 连接词承接前面的指控，汉语语序和上下文已显出推论关系，无须硬译“所以”。
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: 现在……又来找我
  rationale: “现在”保留 עַתָּה 的时间强调；“又来找我”是现代汉语中对“来到我这里”的自然表达，并凸显先逐后求的反差。
- source_word: כַאֲשֶׁר צַר לָכֶם
  choice: 你们遭了患难
  rationale: צַר לָכֶם 表示处于困境或患难中；“遭了患难”自然表达促使他们前来的处境，而不额外限定患难的具体性质。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的直接引语。通过“从前……现在……”显明耶弗他的对比与责问；“父家”保留希伯来语可能兼指住所和家族共同体的宽度。原文在本节没有需要用脚注保留的重大文本或词义歧义；所给英文脚注的标记位置与内容明显不一致，且“患难/困境”可在正文中充分表达，故不设脚注。
