base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: zh_hans
  text: 耶弗他就同基列的长老去了，百姓立他作他们的首领和统帅[a]。耶弗他在米斯巴，在雅威面前说了自己的一切话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “统帅”也可译作“官长”或“统治者”。
    reason: 原文 קָצִין 的含义兼有治理与军事领导色彩。
  - marker: b
    text: 原文直译是“说了他一切的话”，可能指耶弗他重申先前提出的一切条件。
    reason: 保留原文措辞的开放性，同时说明语境中可能的具体所指。
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: 耶弗他就同基列的长老去了
  rationale: 按叙事性 wayyiqtol 译为“就……去了”，并以“同”准确表达陪同关系；“长老”是古代地方领袖的通行译法。
- source_word: וַיָּשִׂימוּ הָעָם אֹתוֹ עֲלֵיהֶם
  choice: 百姓立他作他们的……
  rationale: שׂים 加宾语及 עַל 表示把某人置于众人之上，即任命、确立其职位；“立他作”自然且保留正式设立之意。
- source_word: לְרֹאשׁ
  choice: 首领
  rationale: רֹאשׁ 本义为“头”，在这里比喻居首位的领袖；汉语“首领”既保留此意象，也清楚自然。
- source_word: וּלְקָצִין
  choice: 和统帅
  rationale: קָצִין 可指统治者、官长或军事指挥者；面对亚扪人战争的语境使“统帅”较为贴切，同时脚注保留其他可能。
- source_word: וַיְדַבֵּר יִפְתָּח אֶת כָּל דְּבָרָיו
  choice: 耶弗他……陈说了自己的一切话
  rationale: 原文直译是“说了他一切的话”。“陈说”符合公开、庄重场景，但不把这些话限定为条款、誓言或祷告。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前”的立约与临在表达，并将神名 יהוה 音译为“雅威”。
- source_word: בַּמִּצְפָּה
  choice: 在米斯巴
  rationale: 采用该地名的现代中文音译；介词表明事件发生地点。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”可明确保留其作为专名的性质。
- issue: 耶弗他在雅威面前所说之话的性质
  choice: 陈说了自己的一切话
  alternative: 重申了自己的一切条件；把一切事情禀告雅威
  rationale: 此语可能指他重申先前与长老约定的条件，也可能含有庄严宣告或向神陈明的意味；正文保留原文较宽泛的措辞，不把它限定为法律确认或祷告。
- issue: “在米斯巴”与“在雅威面前”的关系
  choice: 在米斯巴、在雅威面前
  alternative: 在米斯巴的雅威面前
  rationale: 原文说明地点和神圣临在，却未交代雅威如何在当地临在；使用并列状语，避免暗示某种未明说的圣所形态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“首领和统帅”保留两个并列职分；第二句调整状语次序为“在米斯巴、在雅威面前”，以免中文误读为雅威位于某个具体物理位置。
