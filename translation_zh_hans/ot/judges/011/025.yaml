base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: zh_hans
  text: 如今，你难道真的比西拨的儿子、摩押王巴勒更强吗？他何曾与以色列争执过[a]？何曾与他们交战过？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争执”也可译作“争辩”或“争讼”。这个希伯来语动词可指一般争端，也可带有诉讼或申辩意味；下一句的动词则明确指交战。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转折，引出耶弗他的反问；现代汉语中“现在”自然简洁，连接意味可由上下文体现。
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: 你难道真……强吗
  rationale: 希伯来文以重复形式加强比较和反问语气；“难道真……强吗”既传达强调，也保持自然的现代汉语表达。
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: 比摩押王西拨的儿子巴勒
  rationale: 按汉语习惯先交代王位与父名，再给出人物名；מִן 表达比较关系，译作“比”。
- source_word: הֲרֹב רָב
  choice: 何曾……争辩过
  rationale: ריב 可指争执、争讼或提出争端；“争辩”保留其广义争议色彩，并与下一句明确的军事行动相区别。“何曾”体现重复结构所加强的反问语气。
- source_word: עִם יִשְׂרָאֵל
  choice: 与以色列
  rationale: 保留 עִם 的基本关系义“与”，配合“争辩”自然成立，也避免提前把该动词限缩为军事敌对。
- source_word: אִם
  choice: （第二个并列反问）
  rationale: 此处引出另一项反问选择；汉语以重复“何曾”并列两问，比直译为“或”更自然。
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: 何曾与他们交战过
  rationale: לחם 明确表示作战；“交战”与前面的“争辩”形成语义递进。“何曾”传达不定式绝对式与限定动词重复所形成的强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个“何曾”再现原文两组强调式动词所构成的连续反问；不把第一个动词窄化为战争，以保留它与“交战”的区别。
