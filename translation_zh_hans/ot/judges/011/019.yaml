  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: zh_hans
  text: 以色列就派使者[b]去见亚摩利人的王西宏，就是希实本王。以色列对他说：“请让我们从你的领土经过，到我的地方[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我的地方”。这里可能是把以色列作为一个整体来发言；也可按现代汉语的集合意义译作“我们的地方”。
    reason: 保留原文第一人称单数与前文复数请求之间的张力。
  - marker: b
    text: “使者”在这里也可译作“使节”。
    reason: 交代该词在外交语境中的可行译法。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派……去
  rationale: 该叙事动词表示差派人员；“派……去见”符合现代汉语表达，也清楚呈现行动的对象。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处是国与国交涉的语境，所指为受差派的人类代表，并非天使；“使者”庄重且易懂。
- source_word: סִיחוֹן
  choice: 西宏
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: 亚摩利人的王
  rationale: 直接保留原文的族群称谓及王的身份。
- source_word: מֶלֶךְ חֶשְׁבּוֹן
  choice: 希实本王
  rationale: 保留原文第二个同位称号，并用“就是”明确它是对西宏身份的进一步说明。
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: 以色列对他说
  rationale: 原文再次明确说话者是“以色列”；译文保留这一重复，不将其省略或改成“使者说”。
- source_word: נַעְבְּרָה נָּא
  choice: 请让我们……经过
  rationale: 意愿式动词配合 נָא 表达礼貌请求；此译法自然呈现请求语气。
- source_word: בְאַרְצְךָ
  choice: 从你的领土经过
  rationale: 介词短语与“经过”连用，表示穿越西宏统治的地域；“领土”比泛指的“地方”更能体现政治地理语境。
- source_word: עַד מְקוֹמִי
  choice: 到我的地方
  rationale: 原文采用第一人称单数“我的”，可能是以色列作为集合体或拟人化主体发言；译文保留这一不寻常的数，不改成“我们的”。
theological_decisions:
- issue: 以色列的复数请求与单数所有格并置
  choice: 保留“让我们……到我的地方”
  alternative: 将后半句顺译为“到我们的地方”
  rationale: 希伯来文动词“我们经过”是复数，而“我的地方”明确是单数。保留这种张力，可避免把以色列作为集合体发言的形式静默抹平；这属于语法与修辞问题，并不强加特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就是希实本王”自然呈现两个王号的同位关系；“到我的地方”刻意保留原文略显突兀的单数表达，并以脚注说明。所有脚注标记均放在所注词语之后。
