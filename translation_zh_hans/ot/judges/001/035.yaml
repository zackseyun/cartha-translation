base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: zh_hans
  text: 但亚摩利人执意住在希烈山、亚雅仑和沙宾；后来，约瑟家的势力越发强大[a]，亚摩利人就被迫服劳役[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“约瑟家的手变重”；也可译作“约瑟家占了优势”。这个希伯来语表达可指势力增强，甚至形成压制之势。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“成了服劳役的人”或“承担贡役”。原文所用词语指强制性的劳动服役。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: 执意
  rationale: 该动词可表示甘愿、决定或着手；本句与不定式“居住”连用，并与下文约瑟家取得优势形成对照，因此译作“执意”最能表达亚摩利人坚持留居之意。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文虽为单数形式，却作为族群集合名词使用；下文复数动词也表明所指为整个群体。
- source_word: לָשֶׁבֶת
  choice: 住在
  rationale: 作为 וַיּוֹאֶל 的补语，表示持续居住、留在这些地方。
- source_word: בְּהַר חֶרֶס
  choice: 在希烈山
  rationale: הַר 可指山或山区；此处保留传统且清楚的地名表达“希烈山”，不武断限定为单一山峰或整个山区。
- source_word: בְּאַיָּלוֹן
  choice: 在亚雅仑
  rationale: 采用该地名通行的现代中文音译。
- source_word: וּבְשַׁעַלְבִים
  choice: 和沙宾
  rationale: 采用该地名通行的中文音译，并保留连接关系。
- source_word: וַתִּכְבַּד יַד
  choice: 势力越发强大
  rationale: 原文直译为“手变重”，是表示权势增强并足以压制对方的惯用语。正文采用自然中文表达，脚注保留原文意象及可能译法。
- source_word: בֵּית יוֹסֵף
  choice: 约瑟家
  rationale: 保留原文亲族兼政治群体的称谓，指由约瑟而出的支派群体。
- source_word: וַיִּהְיוּ לָמַס
  choice: 被迫服劳役
  rationale: מַס 在此指强制性的劳役或作为贡赋承担的劳动；“被迫服劳役”既符合现代中文，也清楚表明并非单指缴纳财物。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“执意”体现亚摩利人坚持留居；“势力越发强大”自然传达希伯来语“手变重”的惯用含义，并在脚注中保留其具体意象。末句重复“亚摩利人”，避免中文代词可能误指约瑟家。
