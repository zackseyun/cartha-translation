  text: וַֽ/יִּלְכְּדָ/הּ֙ עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֣ן מִמֶּ֑/נּוּ וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: zh_hans
  text: 俄陀聂，就是基纳斯的儿子、迦勒的弟弟，比迦勒年轻[a]，攻取了那城；迦勒便把女儿押撒嫁给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“俄陀聂，就是基纳斯的儿子、迦勒较年轻的亲属。”希伯来语最自然的意思是“迦勒的兄弟，比他年轻”，但“兄弟”一词也可能泛指亲属或同族的人。
    reason: 保留希伯来语亲属称谓可能具有较宽含义的另一种理解。
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: 攻取了那城
  rationale: לכד在攻城语境中指夺取、攻占；阴性单数后缀回指上一节的城。中文明确补出“那城”，使指代自然清楚。
- source_word: עָתְנִיאֵל
  choice: 俄陀聂
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: בֶּן קְנַז
  choice: 基纳斯的儿子
  rationale: 按希伯来语标准父子谱系结构直译。
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: 迦勒的弟弟，比迦勒年轻
  rationale: אֲחִי כָלֵב直译为“迦勒的兄弟”，הַקָּטֹן מִמֶּנּוּ说明他比迦勒年轻。用“弟弟”并保留比较语，既自然又呈现原文结构；亲属称谓的另一种理解收入脚注。
- source_word: וַיִּתֶּן לוֹ
  choice: 迦勒便把……嫁给他
  rationale: 原文用代词“他给了他”，上下文表明施事者是迦勒、接受者是俄陀聂。中文明确迦勒，以免连续男性代词造成歧义。
- source_word: עַכְסָה בִתּוֹ
  choice: 女儿押撒
  rationale: בִתּוֹ意为“他的女儿”，所指为迦勒；因已明确以迦勒为主语，中文用“女儿押撒”自然表达所属关系。
- source_word: לְאִשָּׁה
  choice: 嫁给他
  rationale: 该短语与“给”连用，表示把女子给某人为妻，即嫁女。此译法符合现代汉语婚姻叙事用语。
theological_decisions:
- issue: 俄陀聂与迦勒的亲属关系
  choice: 正文译作迦勒的弟弟，并以“比迦勒年轻”呈现比较关系。
  alternative: 可把“兄弟”广义理解为亲属或族人，因而译作“迦勒的年轻亲属”；也有人据相关经文理解为侄辈。
  rationale: 希伯来语最自然的句法是“迦勒的兄弟，比他年轻”。这并非教义问题，但亲属关系确有解释争议，因此正文保留直接语义，脚注说明较宽泛的可能。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“攻取”保留军事语境；“嫁给他”自然表达“给他为妻”。正文略作指代显化，以避免汉语代词歧义，同时用脚注保留亲属关系的原文张力。
