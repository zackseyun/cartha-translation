  text: וַ/יֹּ֣אמֶר אֲדֹֽנִי בֶ֗זֶק שִׁבְעִ֣ים מְלָכִ֡ים בְּֽהֹנוֹת֩ יְדֵי/הֶ֨ם וְ/רַגְלֵי/הֶ֜ם מְקֻצָּצִ֗ים הָי֤וּ מְלַקְּטִים֙ תַּ֣חַת שֻׁלְחָנִ֔/י כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי כֵּ֥ן שִׁלַּם לִ֖/י אֱלֹהִ֑ים וַ/יְבִיאֻ֥/הוּ יְרוּשָׁלִַ֖ם וַ/יָּ֥מָת שָֽׁם־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: zh_hans
  text: 亚多尼·比色说：“从前有七十个王，手上的大拇指和脚上的大脚趾都被砍掉[a]，在我的桌子底下捡拾零碎食物。我怎样待人，神[b]也照样报应我。”他们把他带到耶路撒冷，他就死在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用同一个词分别指手上的大拇指和脚上的大脚趾。
    reason: lexical_alternative
  - marker: b
    text: 译作“神”的希伯来语词 אֱלֹהִים 在形态上是复数，但此处搭配单数动词，因此不是“众神”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: 亚多尼·比色
  rationale: 按上下文作为人物称号或专名音译；其字面含义可能是“比色之主”，但正文不将这一可能含义直接译入。
- source_word: שִׁבְעִים מְלָכִים
  choice: 七十个王
  rationale: 保留原文明确的数词和名词结构。
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: 手上的大拇指和脚上的大脚趾
  rationale: בֹּהֶן 随所指肢体分别表示大拇指或大脚趾；中文采用自然且准确的解剖表达，同时保留原文对手和脚的明确提及。
- source_word: מְקֻצָּצִים
  choice: 被砍掉
  rationale: 该被动分词表示肢体被切断；“被砍掉”清楚传达暴力截断的动作。
- source_word: הָיוּ מְלַקְּטִים
  choice: 从前……捡拾零碎食物
  rationale: 迂回式结构表示过去惯常发生的动作；לקט 是捡拾、收集，桌下语境表明所捡的是掉落的零碎食物。
- source_word: תַּחַת שֻׁלְחָנִי
  choice: 在我的桌子底下
  rationale: 直接保留原文的空间关系和第一人称所属。
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן
  choice: 我怎样待人……也照样
  rationale: 保留原文“怎样……照样”的对应报偿公式；补出“待人”使中文自然，但不具体增加原文未说明的对象。
- source_word: שִׁלַּם לִי אֱלֹהִים
  choice: 神也照样报应我
  rationale: Piel 词形 שׁלם 在此表示按行为施以回报；“报应”贴合此处负面的相称性后果。אֱלֹהִים 虽为复数形态，却搭配单数动词。
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם
  choice: 他们把他带到耶路撒冷
  rationale: 准确表达第三人称复数主语、单数宾语和叙事推进。
- source_word: וַיָּמָת שָׁם
  choice: 他就死在那里
  rationale: “就”自然承接连续叙事，“在那里”保留地点副词。
theological_decisions:
- issue: 亚多尼·比色话语中 אֱלֹהִים 的所指
  choice: 神
  alternative: 众神
  rationale: אֱלֹהִים 在形态上是复数形式，但此处所配的 שִׁלַּם 是单数动词，因此应理解为单数的“神”。译文只呈现说话者承认神施行相称报应，不进一步把这句话解释为完整的信仰告白。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“零碎食物”按桌下捡拾的语境补足自然汉语所需的宾语；不使用生硬的“手脚拇指”，也不把人物名称的可能字面含义写入正文。
