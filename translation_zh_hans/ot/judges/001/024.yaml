  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: zh_hans
  text: 守望的人看见一个男子从城里出来，就对他说：“请把城的入口[a]指给我们看，我们就必恩待你[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“进城的路”。
    reason: lexical_alternative
  - marker: b
    text: “恩待”原文为חֶסֶד（hesed）；按不同语境，也可译为“慈爱”、“忠诚”或“坚定不移的爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: 守望的人
  rationale: 该词是שׁמר的复数分词，指在城外留意、监视动静的人。“守望的人”保留其动作含义，又不把他们过度具体化为城内守军或具有固定军阶的人员。
- source_word: אִישׁ
  choice: 一个男子
  rationale: 此处单数名词指一名男性；“一个男子”准确、自然，也避免泛化为性别不明的“一个人”。
- source_word: יוֹצֵא מִן־הָעִיר
  choice: 从城里出来
  rationale: יצא的分词表示正从城中向外移动；按守望者的观察视角译为“从城里出来”，符合现代汉语表达。
- source_word: מְבוֹא הָעִיר
  choice: 城的入口
  rationale: מְבוֹא可指入口、进入之处或进去的路径。“城的入口”简洁具体，同时以脚注保留“进城的路”这一语境上可能的理解。
- source_word: נָא
  choice: 请
  rationale: 该语气词缓和祈使语气，现代汉语以“请”自然对应。
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: 我们就必恩待你
  rationale: חֶסֶד在此交易性叙事情境中主要表示给予善待或优待。“恩待”自然凝练，保留关系性的善意，而不额外引入盟约忠诚等较强神学含义。
theological_decisions:
- issue: חֶסֶד的语境含义
  choice: 恩待
  alternative: 以忠诚待你／向你施慈爱
  rationale: חֶסֶד可表示慈爱、忠诚或坚定不移的爱，但此处是以提供情报换取宽待的承诺，重点是对这名男子施以善意和优待。译作“恩待”较切合语境，也不排除该词所含的关系性善意。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就必”表达对方若指明入口，他们便承诺善待他的条件关系。脚注标记均紧随所解释的词语。
