base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: zh_hans
  text: 于是，犹大上去[a]，耶和华把迦南人和比利洗人交在他们手中[b]；他们在比色击倒了一万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上去”在这里也可理解为“进军”。
    reason: lexical_alternative
  - marker: b
    text: “交在他们手中”是希伯来语惯用语，意思是“交由他们制伏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去
  rationale: עלה的基本义是“上去、上升”；在军事叙事中也可指进军。“上去”保留原文的空间意象，不武断限定具体地势或军事动作。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 此处指犹大支派及其出战人员；保留专名“犹大”，也保留原文由单数集体主体转为复数代词的表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”译出四字神名，而不以头衔替代。
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: 迦南人和比利洗人
  rationale: 两个带冠词的单数族称均作集合意义；汉语“……人”自然兼具单复数，不必另加复数标记。
- source_word: בְּיָדָם
  choice: 交在他们手中
  rationale: נתן ביד是“交在某人手中、置于某人权下”的惯用语；此译既保留“手”的意象，也能让现代读者理解为交由他们制伏。
- source_word: וַיַּכּוּם
  choice: 击杀了
  rationale: נכה可表示击打、重创或击败；在战斗场景并紧接人数统计时，“击杀”自然体现其强烈、致命的语境，但不在句中增添作战方式。
- source_word: בְּבֶזֶק
  choice: 在比色
  rationale: 介词ב与地名连用表示事件发生地点；“在比色”是自然的现代汉语表达。
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: 一万人
  rationale: 直指一万名男性；战事语境表明是战斗人员。汉语“一万人”比“一万名男子”更自然，也没有扩展为原文未明说的“士兵”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均为四字神名的音译传统；正文采用现代中文圣经读者最熟悉、且明确作为专名使用的“耶和华”，不以“主”等称号取代。
- issue: 神的作为与人的行动
  choice: 保留“耶和华交付”与“他们击杀”的双重施事结构
  alternative: 将全句统一改为犹大单数施事，或把后半句改为被动式
  rationale: 原文一方面明确把胜利的交付归于耶和华，另一方面又以复数动词叙述犹大支派人员的战斗行动；保留两者可避免削平原文的神学张力。
- issue: “犹大”由单数集体名词转为复数代词
  choice: 译作“犹大……他们”
  alternative: 全句统一译作“犹大……他”或反复使用“犹大人”
  rationale: 原文先以支派名“犹大”作单数集体主体，随后用复数“他们”；中文照此表达虽略有转换，却清楚显示支派整体及其成员。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接上文叙事；分号呈现神交付敌人与犹大众人实施战斗之间既紧密又有区别的关系。专名采用通行译名“犹大、耶和华、迦南人、比利洗人、比色”。所有脚注标记均已置于正文相应位置。
