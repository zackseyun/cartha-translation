  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: zh_hans
  text: 犹大和他的弟兄西缅一同前去，击杀了住在洗法的迦南人，把那城归作当毁之物[a]。他[b]便给那城起名叫何珥玛[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把那城尽行毁灭”或“置于禁令之下”。希伯来语动词表示把某物不可撤回地归为当毁之物，通常以毁灭来处置。
    reason: alternative_reading
  - marker: b
    text: 原文是单数“他”；这里可能把犹大视为一个整体或代表性主体。有些译本按犹大和西缅共同参与而译作“他们”。
    reason: alternative_reading
  - marker: c
    text: “何珥玛”的读音与希伯来语中“当毁之物”一词相近，说明了这座城名字的由来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: 犹大和他的弟兄西缅一同前去
  rationale: הלך本义为“去”；这里אֶת表示伴随。译作“一同前去”自然表达犹大与西缅同行，又不额外断定为“进军”。“犹大”和“西缅”依原文保留专名，可在叙事中代表相应支派。
- source_word: וַיַּכּוּ
  choice: 击杀了
  rationale: נכה在战争叙事中表示击打、杀伤或击败；“击杀”保留其强烈的军事行动含义，并与后文毁灭该城相符。
- source_word: הַכְּנַעֲנִי יוֹשֵׁב צְפַת
  choice: 住在洗法的迦南人
  rationale: “迦南人”在希伯来文中形态为单数，却具有集合意义，并与复数动词搭配；中文用集合性的“迦南人”自然准确。יוֹשֵׁב译为“住在”，清楚表达居住之意。
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: 把那城列为当毁之物，彻底毁灭了
  rationale: חרם的使役形同时包含不可撤回地划归为禁物和以毁灭处置的含义。此译保留其礼仪性与毁灭性的张力；“那城”明确了阴性代词所指的洗法城。
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: 他便给那城起名叫
  rationale: 动词为阳性单数，主文本保留“他”，最自然地回指以集合性单数出现的“犹大”。中文“给那城起名叫”自然传达希伯来文的命名公式。
- source_word: חָרְמָה
  choice: 何珥玛
  rationale: 作为地名采用常见中文音译；该名称与חרם“列为当毁之物”形成词源双关，留在脚注说明。
theological_decisions:
- issue: חרם在战争语境中的翻译
  choice: 列为当毁之物，彻底毁灭
  alternative: 尽行毁灭／置于禁令之下
  rationale: 原词兼有奉献、禁绝和毁灭的语义。主文本既不把它淡化为普通的军事“击败”，也不只强调宗教奉献而遮蔽实际毁灭，从而保留原文的神学张力。
- issue: 命名动词单数主语的处理
  choice: 他便给那城起名
  alternative: 他们便给那城起名
  rationale: 原文וַיִּקְרָא明确为单数。译文保留这一形式，让“犹大”作为支派的集合性或代表性主体；脚注提示也可按参与者整体理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“弟兄”既保留原文亲属称谓，也适合犹大与西缅作为支派先祖及支派代表的语境；“列为当毁之物，彻底毁灭”略带术语色彩，但借并列解释保证普通读者可以理解。
