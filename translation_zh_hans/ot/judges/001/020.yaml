  yaml_path: translation/ot/judges/001/020.yaml
  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: zh_hans
  text: 他们照摩西所说的，把希伯仑给了迦勒；迦勒从那里赶出了亚衲的三个子孙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚衲的三个儿子”或“亚衲族的三个人”。希伯来文直译为“亚衲的三个儿子”，这里可能指亚衲的后裔或族人，不一定是他的亲生儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת־חֶבְרוֹן
  choice: 他们……把希伯仑给了迦勒
  rationale: וַיִּתְּנוּ是נתן的叙事过去式，意为“给”；中文用“把”字句自然表达希伯仑为直接宾语、迦勒为接受者。
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: 照摩西所说的
  rationale: כַּאֲשֶׁר表示“照……、正如……”，דִּבֶּר直译为“说了”；不在正文中强化为“应许”，以免加入原文未明确表达的含义。
- source_word: וַיּוֹרֶשׁ מִשָּׁם
  choice: 迦勒从那里赶出了
  rationale: ירש的使役式在此以人为宾语，表示“赶出、逐出而占有”；“赶出”清楚自然。“迦勒”补明希伯来语单数主语，使中文指代明确。
- source_word: שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: 亚衲的三个子孙
  rationale: בְּנֵי字面是“儿子们”，但也常指后裔或族人；此处译作“子孙”保留血缘或宗族关系，又避免让读者误以为必是亚衲的三个亲生儿子。脚注保留更字面的译法及另一种可能。
