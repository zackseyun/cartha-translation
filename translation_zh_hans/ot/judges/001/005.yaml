  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: zh_hans
  text: 他们在比色找到了亚多尼·比色[a]，就与他交战，击败了迦南人和比利洗人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚多尼·比色”按词源也可理解为“比色之主”；这里译作人名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: 找到了
  rationale: מצא在叙事中通常表示“找到”或“遇见”；“找到了”直接自然，也符合连续叙事的语气。
- source_word: אֲדֹנִי בֶזֶק
  choice: 亚多尼·比色
  rationale: 上下文中将其作为人名处理，以音译保留专名；其构词也可能理解为“比色之主”，故以脚注说明。
- source_word: בְּבֶזֶק
  choice: 在比色
  rationale: 介词ב在此表示地点；“在比色”准确而自然。
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: 与他交战
  rationale: לחם的尼法勒式与ב连用表示同某人作战；“与他交战”清楚表达敌对的军事行动。
- source_word: וַיַּכּוּ
  choice: 击败了
  rationale: נכה在战争语境中可指击打、击溃或击败；“击败”符合群体作战语境，又不武断地断定每个人都被杀死。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 形式虽为单数族称，此处具有集合意义；现代汉语用“迦南人”可自然指该族群。
- source_word: הַפְּרִזִּי
  choice: 比利洗人
  rationale: 形式虽为单数族称，此处具有集合意义；沿用现代中文圣经中通行且易识别的族名译法。
theological_decisions: []
