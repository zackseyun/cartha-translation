base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: zh_hans
  text: 她来到的时候，就劝他[a]向她父亲求那块田。随后，她从驴上下来[b]。迦勒问她：“你有什么事？[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝”也可译作“怂恿”或“唆使”。原文动词的语气可轻可重；这里按上下文译为中性的“劝”。
    reason: lexical_alternative
  - marker: b
    text: “下来”也可译作“跳下”或“从驴上落下来”；原文可能带有动作突然的意味。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“你有什么？”，既可表示“你想要什么？”，也可表示“你怎么了？”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: 她来到的时候
  rationale: 介词 בְּ 加不定词和第三人称阴性单数后缀，构成时间表达，意为“在她来到时”。
- source_word: וַתְּסִיתֵהוּ
  choice: 就劝他
  rationale: סות 可表示怂恿、唆使或劝说；本段是请求田地的家庭情境，“劝”既自然，也不强加负面的道德意味。保留宾语“他”，不把上下文中的身份直接写进正文。
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ
  choice: 向她父亲求
  rationale: שאל 在这里表示请求获得某物，מֵאֵת 标明请求的对象或来源；“向……求”准确而自然。
- source_word: הַשָּׂדֶה
  choice: 那块田
  rationale: 名词带定冠词，指特定的一块田；中文用“那块”体现其特指性。
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: 她从驴上下来
  rationale: צנח 描写从坐骑上落下或下来；“下来”符合现代汉语叙事，同时以脚注保留动作可能较突然的语感。
- source_word: מַה לָּךְ
  choice: 你有什么事？
  rationale: 这个希伯来语习语直译为“你有什么？”，可询问对方有何需要或出了什么事。“你有什么事？”自然地保留了两者之间的开放性。
- source_word: כָּלֵב
  choice: 迦勒
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“随后”使连续叙事在中文中流畅，但不改变事件次序；正文保留代词“他”，避免把上下文所指的身份增写为明说内容。所有词义幅度均在脚注中简要保留。
