base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: zh_hans
  text: 迦勒说[a]：“谁攻打基列·西弗并把城夺下，我就把我的女儿押撒给他为妻。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那攻打基列·西弗并把城夺下的人，我就把我的女儿押撒给他为妻。”
    reason: 原文 אֲשֶׁר 可理解为不定关系词“谁”，也可较形式对应地译作“那……的人”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语通常不必机械译出连接词，用“说”即可自然承接上文。
- source_word: כָּלֵב
  choice: 迦勒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֲשֶׁר
  choice: 谁
  rationale: 这里引出不定关系从句，构成公开的条件性挑战；“谁……我就……”自然且保留其开放性。
- source_word: יַכֶּה
  choice: 攻打
  rationale: נכה 的使役词干本义涉及击打；在攻城语境中译为“攻打”最自然，并与随后表示成功占领的动词相区别。
- source_word: קִרְיַת סֵפֶר
  choice: 基列·西弗
  rationale: 按专名音译，并用间隔号清楚呈现复合地名的两个组成部分。
- source_word: וּלְכָדָהּ
  choice: 并把城夺下
  rationale: לכד 在军事语境中表示夺取、占领；以“城”明确阴性代词所指，符合现代汉语表达。
- source_word: וְנָתַתִּי לוֹ
  choice: 我就把……给他
  rationale: “就”自然表达前项行动与后项承诺之间的条件结果关系；“给他”保留希伯来文的间接受词。
- source_word: עַכְסָה
  choice: 押撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בִתִּי
  choice: 女儿
  rationale: 在“我就把女儿……”的结构中，亲属关系已由第一人称主语明确；汉语省去重复的“我的”更自然，意义不变。
- source_word: לְאִשָּׁה
  choice: 为妻
  rationale: 准确表达将女子许配给人为妻的婚姻用语，同时保持简洁庄重。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“攻打……并把城夺下”保留两个军事动词的层次：先发动攻击，再成功占领。脚注标记已置于正文“说”之后。
