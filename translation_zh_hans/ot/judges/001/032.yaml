base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: zh_hans
  text: 亚设人就住在那地的居民迦南人中间，因为亚设人没有把迦南人赶出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译采用集合单数：“亚设人……迦南人……他没有赶走他。”这里按所指的支派和族群译为集合意义。
    reason: 说明原文族称及代词的集合单数形式，避免读者误以为原文明确使用复数。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב在此表示居住、定居；“住在……中间”符合现代汉语，也保留了与另一族群共同居住的含义。
- source_word: הָאָשֵׁרִי
  choice: 亚设人
  rationale: 带冠词的族称单数在这里具有集合意义，指亚设支派的人；汉语“亚设人”本身可作集合称谓。
- source_word: בְּקֶרֶב
  choice: 在……中间
  rationale: 准确表达处于某一群体之中的意思，并与本章相关叙述的对比相协调。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 原文虽为形态上的单数，却是集合用法；汉语“迦南人”既可统称族群，又无需强行标明单复数。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 当地居民
  rationale: 该复数分词短语同位说明迦南人是住在那地的人；“当地居民”自然简洁，并保留其说明作用。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出亚设人住在迦南人中间的原因，译作“因为”清楚表达因果关系。
- source_word: לֹא הוֹרִישׁוֹ
  choice: 他们没有把迦南人赶出去
  rationale: ירשׁ的使役式在《士师记》这一语境中指赶走或剥夺当地居民的土地；“赶出去”自然准确。原文主语和宾语均采用集合单数，汉语用复数代词“他们”并重述“迦南人”，可避免“他们没有把他们赶出去”的指代含混。
theological_decisions:
- issue: 支派名和族群名的集合单数
  choice: 按集合意义译为“亚设人”和“迦南人”，并在后半句用“他们”指亚设人。
  alternative: 形式化保留单数关系，译成类似“亚设人住在迦南人中间，因为他没有赶走他”。
  rationale: 希伯来文常以单数族称代表整个支派或族群。本节上下文谈论亚设支派未能赶走当地居民；若在汉语中机械保留单数代词，会令人误以为是两个个体。集合译法保留了原文所指，同时脚注交代其语法形式。
- issue: 因果关系与责任陈述
  choice: 保留“因为”，直接陈述亚设人未将迦南人赶出。
  alternative: 弱化为并列或说明关系，如“原来他们没有……”。
  rationale: כִּי在此最自然地说明亚设人为何住在迦南人中间。译文不额外解释其动机、能力或神学原因，以保留叙事本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“当地居民迦南人”保留同位说明；后半句重述“迦南人”，避免现代汉语中双重“他们”造成指代不清。
