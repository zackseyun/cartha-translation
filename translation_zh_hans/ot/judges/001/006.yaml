  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: zh_hans
  text: 亚多尼·比色逃走了；他们追赶他，捉住他，截去了他双手的大拇指和双脚的大脚趾。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他双手和双脚的拇指”；同一个希伯来词用于手时指“大拇指”，用于脚时指“大脚趾”。
    reason: 说明希伯来文以同一词指手和脚的相应部位，而汉语须按部位自然区分。
lexical_decisions:
- source_word: וַיָּנָס
  choice: 逃跑了
  rationale: נוּס在此表示逃离战场；“逃跑了”自然、准确，也不暗示他成功脱逃，因为随后他被捉住。
- source_word: אֲדֹנִי בֶזֶק
  choice: 亚多尼·比色
  rationale: 在上下文中作人物的专名或称号式名字处理，采用音译，不径直解释为“比色之主”，以免消除原文在名字与称号之间的可能张力。
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: 他们追赶他
  rationale: רדף加אַחַר表示在后面追逐；“追赶他”符合现代汉语叙事表达。
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: 捉住他
  rationale: אחז表示抓住、拿住；此处是在追赶后将其擒获，“捉住”简明而贴合语境。
- source_word: וַיְקַצְּצוּ
  choice: 砍掉了
  rationale: קצץ在此指截断身体部位；“砍掉”清楚传达暴力截除的动作。
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: 他双手的大拇指和双脚的大脚趾
  rationale: בֹּהֶן用于手时指大拇指，用于脚时指大脚趾。汉语需分别说明，才能自然、准确地表达原文所指。
