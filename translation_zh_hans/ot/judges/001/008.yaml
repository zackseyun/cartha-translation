base_translation:
  language: en
  yaml_path: translation/ot/judges/001/008.yaml
  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: zh_hans
  text: 犹大子孙[a]攻打耶路撒冷[b]，攻取了城，用刀剑击杀了城中的人，又放火烧了城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“犹大的众子”，这里指犹大支派的成员。
    reason: lexical_alternative
  - marker: b
    text: “攻打耶路撒冷”也可译作“在耶路撒冷作战”，但下文“攻取了城”较支持前一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ בִירוּשָׁלִַם
  choice: 攻打耶路撒冷
  rationale: לחם的尼法勒式在战争叙事中表示交战；介词ב在此结合随后“攻取了城”的语境，最自然地表示攻击的对象。不过，该介词也可能按地点理解，因此以脚注保留歧义。
- source_word: בְנֵי יְהוּדָה
  choice: 犹大子孙
  rationale: 原文直译为“犹大的众子”，在这里是对犹大支派成员的集体称呼。“犹大子孙”既保留亲属群体的源语表达，也符合中文圣经历史叙事的庄重语体。
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: 攻取了城
  rationale: לכד在攻城语境中指夺取、占领城市。中文补出“城”，使阴性代词所指的耶路撒冷清楚自然。
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: 用刀刃击杀了城中的人
  rationale: 原文按语法以阴性单数代词回指城，并使用“交给刀口/用刀口击打”的战争惯用语。中文若直说“用刀刃击打城”容易误解，因此按该惯用语的实际所指译出城中遭杀的人，同时保留“刀刃”的意象。
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: 放火烧了城
  rationale: שלח与“在火中”连用，在此表示使城市遭火焚烧。译为“放火烧了城”自然、明确，并避免生硬直译为“送入火中”。
