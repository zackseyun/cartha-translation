  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: zh_hans
  text: 但便雅悯子孙没有赶出住在耶路撒冷的耶布斯人[a]；于是耶布斯人就和便雅悯子孙一同住在耶路撒冷，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“耶布斯人”采用单数形式，在这里集体指整个族群。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: 耶布斯人
  rationale: 原文采用单数族称，集体指耶布斯族人；汉语“耶布斯人”既自然，也可表达个人或群体，保留了原文形式与群体含义。
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: 住在耶路撒冷的
  rationale: 分词表达持续居住的状态；这一译法简明自然，并保留其延续意味。
- source_word: הוֹרִישׁוּ
  choice: 赶出
  rationale: 在征服与定居语境中，该使役词形表示使当地居民失去占据之地、将其逐出；“赶出”是现代汉语中清楚自然的表达。
- source_word: בְּנֵי בִנְיָמִן
  choice: 便雅悯子孙
  rationale: 保留希伯来文的宗族—支派表达方式，同时符合中文圣经叙事的庄重语体。
- source_word: וַיֵּשֶׁב
  choice: 就……一同住
  rationale: 叙事过去时与“直到今日”连用，表示从当时开始并延续到叙述者所处的时代；中文借“就”承接前句，并由末尾时间语明确延续性。
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: 和便雅悯子孙一同
  rationale: 此处 אֶת 表伴随关系，不是宾语标记；“和……一同”准确表达共同居住。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来叙事中常见的时间公式，指某种状况持续到叙述者的当代。
- source_word: וְ
  choice: 但
  rationale: 结合上下文，此连词引出未能赶出当地居民的对比性叙述；“但”自然呈现其转折作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“便雅悯子孙”保留支派谱系色彩；分号呈现未能赶出与后来共同居住之间的紧密结果关系。
