  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: zh_hans
  text: 约瑟家派人侦察伯特利[a]；这城从前名叫路斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“探察伯特利”。这里的希伯来语动词在上下文中指侦察或搜索。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: 派人侦察
  rationale: 此动词在当前军事语境中指搜察、侦察敌情或地形。译作“派人侦察”符合现代汉语习惯，也表达了行动由约瑟家发起；脚注保留“探察”的词义可能。
- source_word: בֵית יוֹסֵף
  choice: 约瑟家
  rationale: 保留希伯来文以“家”指群体的表达，既可涵盖约瑟的后裔或支派集团，又不把其确切社会范围解释得过窄。
- source_word: בְּבֵית אֵל
  choice: 伯特利
  rationale: 介词与前面的侦察动词连用，标明侦察的地点或对象；现代汉语可直接说“侦察伯特利”。
- source_word: וְשֵׁם הָעִיר
  choice: 这城……名叫
  rationale: 以自然的现代汉语表达“城的名字”，同时保留说明城名的功能。
- source_word: לְפָנִים
  choice: 从前
  rationale: 表示较早时期的状态；“从前”自然、清楚，适合叙事中的历史说明。
- source_word: לוּז
  choice: 路斯
  rationale: 按中文圣经地名的通行音译处理此专名。
