base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: zh_hans
  text: 她对他说：“请给我一份福分！你既把南地[a]给了我，也请把水泉[b]给我。”于是，迦勒把上泉和下泉都给了她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “南地”或译“尼革夫地”。希伯来语“尼革夫”既可作地区名称，也可指干旱的南方地带。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语可指泉、水池或其他水源；鉴于南地干旱，“水泉”最符合上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי בְרָכָה
  choice: 请给我一份福分
  rationale: הָבָה引出请求，译作“请给”符合现代汉语语气；בְרָכָה本义为“祝福”，在本处也指父亲所赐的有益产业，译作“福分”兼顾字面意义和具体语境。
- source_word: אֶרֶץ הַנֶּגֶב
  choice: 南地
  rationale: נֶגֶב既可指以色列南部称为“尼革夫”的地区，也可指干旱的南方地带。“南地”简洁自然，并以脚注保留专名及地貌含义。
- source_word: גֻּלֹּת מָיִם
  choice: 水泉
  rationale: 该词组指可供水的泉源，也可能涵盖水池等水源；在干旱土地的上下文中，“水泉”最贴切，并保留具体意象。
- source_word: גֻּלֹּת עִלִּית וְאֵת גֻּלֹּת תַּחְתִּית
  choice: 上泉和下泉
  rationale: עִלִּית与תַּחְתִּית构成“上／下”的地势对照；用“上泉和下泉”简明再现这组对应表达。
- source_word: וַיִּתֶּן לָהּ
  choice: 于是……给了她
  rationale: 连续叙事形式承接女子的请求，引出迦勒的回应；“于是”自然呈现事件推进和结果关系。
theological_decisions: []
