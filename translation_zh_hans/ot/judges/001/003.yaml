  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/שִׁמְע֨וֹן אָחִ֜י/ו עֲלֵ֧ה אִתִּ֣/י בְ/גוֹרָלִ֗/י וְ/נִֽלָּחֲמָה֙ בַּֽ/כְּנַעֲנִ֔י וְ/הָלַכְתִּ֧י גַם אֲנִ֛י אִתְּ/ךָ֖ בְּ/גוֹרָלֶ֑/ךָ וַ/יֵּ֥לֶךְ אִתּ֖/וֹ שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: zh_hans
  text: 犹大对他的兄弟西缅说：“请跟我上到分给我的地界[a]，我们一起攻打迦南人；我也会跟你到分给你的地界。”于是，西缅就跟他去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“我的阄”和“你的阄”，指拈阄分得的地界。
    reason: 说明 גוֹרָל 的字面意义及其在本节中的转喻用法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 以现代汉语自然的叙事衔接表达 wayyiqtol 所推进的事件次序，不额外强化严格的时间关系。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 沿用现代中文圣经中通行的专名译法；本处指人格化的犹大支派。
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: 对他的兄弟西缅
  rationale: 保留 אָחִיו 的明确兄弟称谓，既符合族长家系中的亲属关系，也适用于两支派之间的关系。
- source_word: עֲלֵה אִתִּי
  choice: 请跟我上到
  rationale: 保留 עלה 的“上去”意味，同时用“跟我”自然表达同行的邀请；“请”使汉语中的命令式符合此处邀约语气。
- source_word: בְּגוֹרָלִי
  choice: 分给我的地界
  rationale: גוֹרָל 字面为“阄”，在此借指拈阄所得的领地；正文表达实际所指，脚注保留原文意象。
- source_word: וְנִלָּחֲמָה
  choice: 我们一起攻打
  rationale: 第一人称复数鼓励式表达共同采取行动的倡议；“一起”传达其共同参与的意味。
- source_word: בַּכְּנַעֲנִי
  choice: 攻打迦南人
  rationale: 原文为单数形式的集合称谓，现代汉语以“迦南人”自然指整个族群。
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: 我也会跟你到
  rationale: 保留 גַם אֲנִי 所强调的互惠承诺，并以自然现代汉语表达将来的行动。
- source_word: בְּגוֹרָלֶךָ
  choice: 分给你的地界
  rationale: 与前一个 גוֹרָל 保持一致，表达拈阄所得的领地。
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: 于是，西缅就跟他去了
  rationale: 自然表达叙事结果，说明西缅接受邀请并同行。
theological_decisions:
- issue: אָחִיו 的亲属称谓
  choice: 他的兄弟
  alternative: 他的族人
  rationale: 原文明说“兄弟”；犹大和西缅在以色列祖先谱系中确为兄弟，以此称呼相应支派也符合上下文，不应泛化。
- issue: 征服分地语境中 גוֹרָל 的表达
  choice: 正文译作“分给……的地界”，脚注说明字面为“我的阄／你的阄”
  alternative: 正文直译为“我的阄／你的阄”
  rationale: 本节所指是各支派拈阄所得的领地。意译实际所指可避免现代读者误解，同时以脚注保留原文的拈阄意象及其表达张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“地界”既能指所分得的地域，又比“份额”更清楚地显示本节谈的是领土；句式保持直接、口语可懂，同时保留叙事经文的简洁感。
