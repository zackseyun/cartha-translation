  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: zh_hans
  text: 他从那里向底璧的居民进发[a]。底璧从前名叫基列·西弗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向……进发”也可理解为“去攻打……”。原文介词直译是“向、往”，但在这里的征服叙事中，这一行动很可能带有敌意。
    reason: lexical_alternative
  - marker: b
    text: “基列·西弗”是底璧先前的名字；这个名称可能意为“书卷之城”或“文士之城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 进发
  rationale: 这是הלך的叙事性过去时形式，基本意思是“去、行进”。结合征服叙事的语境，“进发”自然地表达有目标的前往，同时不像“攻打”那样把动词本身未明说的攻击行动写入正文。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 直接表达从上文所述地点离开的意思。
- source_word: אֶל
  choice: 向……
  rationale: 该介词基本义为“向、往、到”。上下文可能暗示敌对行动，但正文保留原文在介词层面的含混，不直接译成“攻打”；脚注说明语境中的可能含义。
- source_word: יוֹשְׁבֵי
  choice: ……的居民
  rationale: ישב的分词在这里作名词使用，指居住在该地的人；“居民”简洁、自然且庄重。
- source_word: דְּבִיר
  choice: 底璧
  rationale: 采用现代中文圣经读者较熟悉的地名音译。
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: 底璧从前名叫
  rationale: 用自然的现代汉语表达该地旧名的说明，并保留לְפָנִים“从前、先前”的时间意义。
- source_word: קִרְיַת סֵפֶר
  choice: 基列·西弗
  rationale: 作为地名采用音译，不在正文中把可能的词源意义固定为唯一译法；中点用于清楚显示复合地名的两个成分。
