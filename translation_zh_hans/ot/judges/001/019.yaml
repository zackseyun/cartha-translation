source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: zh_hans
  text: 耶和华与犹大同在；犹大占领了山区，却不能赶走住在谷地[a]的人，因为他们有铁制战车。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷地”也可译作“平原”或“低地”；希伯来语这个词可以指范围较广的低洼地区。
    reason: 保留 עֵמֶק 的地理语义范围。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中对四字神名 YHWH 最通行、庄重且易于辨认的音译，不以普通称号“主”取代原文专名。
- source_word: אֶת־יְהוּדָה
  choice: 与犹大同在
  rationale: אֵת 在此表示伴随；“犹大”依原文保留其集合性指称，即犹大支派。
- source_word: וַיֹּרֶשׁ
  choice: 占领了
  rationale: ירש 的使役形在以地区为宾语时可表示取得、占有该地；“占领”自然表达犹大取得山区，与下句“赶走”形成恰当区别。
- source_word: הָהָר
  choice: 山区
  rationale: 此处指地理上的山地区域，并非一座特定的山；“山区”是自然、准确的现代中文表达。
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: 却不能赶走
  rationale: 原文句法简略；结合后面的原因从句，最自然地表达犹大未能逐出当地居民。“却”体现与占领山区之间的转折，但不消解经文开头“耶和华与犹大同在”所造成的张力。
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: 住在谷地的人
  rationale: 以自然现代中文表达分词结构；עֵמֶק 通常指谷地，也可指较宽广的平原或低地，故另加脚注。
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: 因为他们有铁制战车
  rationale: 用中文所有句自然表达 לָהֶם，并将 רֶכֶב בַּרְזֶל 译为“铁制战车”；不额外推断战车是全铁打造还是仅有铁制部件。
theological_decisions:
- issue: 第二分句中不能赶走居民的主体及其含义
  choice: 将主体明确为集合意义上的“犹大”，译作“犹大……却不能赶走”。
  alternative: 较字面地译成“却没有赶走”，不明确表达能力不足；或采用解释性译法，以避免在耶和华同在的情况下提到犹大的不能。
  rationale: 希伯来文表述简略，但上下文和随后“因为他们有铁制战车”的理由最自然地指向犹大未能赶走谷地居民。译文保留“耶和华与犹大同在”与“犹大却不能”之间真实存在的神学张力，不加解释以调和二者。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“犹大”在首句后再次明说，以免连续使用“他”导致读者误以为“占领”和“不能赶走”的主体是耶和华。脚注标记置于实际对应的“谷地”之后。
