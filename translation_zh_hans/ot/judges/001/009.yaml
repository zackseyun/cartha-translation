  text: וְ/אַחַ֗ר יָֽרְדוּ֙ בְּנֵ֣י יְהוּדָ֔ה לְ/הִלָּחֵ֖ם בַּֽ/כְּנַעֲנִ֑י יוֹשֵׁ֣ב הָ/הָ֔ר וְ/הַ/נֶּ֖גֶב וְ/הַ/שְּׁפֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: zh_hans
  text: 后来，犹大子孙下去攻打住在山地、南地和低地[a]的迦南人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“示非拉”，指犹大山地与沿海平原之间的丘陵低地区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: 后来
  rationale: 表示随后发生的行动；“后来”自然地保留了时间上的承接关系，又不限定间隔长短。
- source_word: יָרְדוּ
  choice: 下去
  rationale: 保留 ירד“下去、下降”的具体方向和地形意味，不弱化为单纯的“去”。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大子孙
  rationale: 贴近原文“犹大的众子”，在这里作为集体称谓，指犹大支派的人。
- source_word: לְהִלָּחֵם
  choice: 攻打
  rationale: 结合介词 בְּ 和争战语境，表达针对迦南人的敌对战斗；中文叙事中比“争战”更自然明确。
- source_word: בַּכְּנַעֲנִי
  choice: 迦南人
  rationale: 原文形式为单数，但在此为集合用法，泛指当地的迦南族群；现代中文用“迦南人”可自然兼具集合意义。
- source_word: יוֹשֵׁב
  choice: 住在
  rationale: 分词表示持续居住或定居的状态，“住在”简明自然。
- source_word: הָהָר
  choice: 山地
  rationale: 这里与南地和低地并列，所指是地理区域，而非某一座山。
- source_word: הַנֶּגֶב
  choice: 南地
  rationale: 此处是迦南南部的特定地理区域；“南地”既传达名称的字面意义，也符合中文圣经地理用语。
- source_word: הַשְּׁפֵלָה
  choice: 低地
  rationale: 指犹大山地与沿海平原之间的丘陵低地区域；“低地”比音译名称更便于普通读者理解。
theological_decisions: []
