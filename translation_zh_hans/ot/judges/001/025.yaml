  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: zh_hans
  text: 那人就把进城的入口指给他们看。他们用刀剑[a]攻打那城，却放那人和他的全家[b]离去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处字面为“以刀剑的口（刃口）”；这是指以刀剑杀戮的习语。
    reason: lexical_alternative
  - marker: b
    text: “全家”也可译作“全家人”“全家族”或“全宗族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: 指给他们看
  rationale: 该形式在这里具有使役含义，表示那人让他们看见、向他们指出城的入口；“指给他们看”符合现代汉语叙事表达。
- source_word: מְבוֹא הָעִיר
  choice: 进城的入口
  rationale: מָבוֹא可指入口、进入的通道或进路；结合攻城语境，“进城的入口”自然且具体。
- source_word: וַיַּכּוּ אֶת־הָעִיר
  choice: 攻杀那城
  rationale: נכה表示击打、攻打或杀戮；以“城”为宾语时含有攻击并杀戮城中居民的转喻。“攻杀那城”既保留原文以城为宾语的表达，又传达武力杀戮。
- source_word: לְפִי חָרֶב
  choice: 用刀剑
  rationale: 原文直译为“用刀剑之口”，是以刀剑杀戮的固定习语；正文采用自然汉语“用刀剑”，并以脚注保留原有意象。
- source_word: שִׁלֵּחוּ
  choice: 放……离去
  rationale: 此处不是单纯差遣，而是饶过并释放；“放……离去”清楚表达其在屠城中获准离开的含义。
- source_word: כָּל־מִשְׁפַּחְתּוֹ
  choice: 他的全家
  rationale: מִשְׁפָּחָה可指家庭、家族或宗族。“全家”最适合正文，同时脚注提示其范围可能更广。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 定冠词回指上一节提到的男子；汉语用“那人”衔接自然。
