  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: zh_hans
  text: 那人前往赫人之地，建了一座城，给这城起名为路斯[a]；这城至今仍名叫路斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“称它的名为路斯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 往……去
  rationale: 这是הלך的Qal叙事形式，表示“去、前往”；“往赫人之地去”自然地表达了方向与动作。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 带定冠词的阳性单数名词回指上文已经提到的男子；“那人”符合现代汉语叙事习惯，也保持指称连续性。
- source_word: אֶרֶץ הַחִתִּים
  choice: 赫人之地
  rationale: 原文为“赫人的地”；此译保留族群与地域的关系，不进一步断定其政治疆界。
- source_word: וַיִּבֶן עִיר
  choice: 建了一座城
  rationale: בנה与עִיר连用，基本意义是“建城”；量词“一座”使中文自然，同时不增添“创建政权”等含义。
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: 给它起名叫路斯
  rationale: 原文直译为“称它的名为路斯”。中文采用自然的命名表达，“它”回指阴性名词עִיר（城）。
- source_word: לוּז
  choice: 路斯
  rationale: 地名按常见圣经中文音译处理，不尝试翻译其可能的词义。
- source_word: הוּא שְׁמָהּ
  choice: 那城仍叫这个名字
  rationale: 结合后面的时间语，“那城仍叫这个名字”自然表达名词句“那是它的名字”持续至今的意思；补出“那城”以避免中文代词指向含混。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来叙事中常见的时间表达，意为该名称持续到叙述者所处的时代。
