  register: 采用庄重而自然的现代标准汉语。“犹大”保留原文以支派名作集体主体的表达；后半句省略重复主语，符合汉语叙事习惯。括号保留原文关于希伯仑旧名的补充说明，三个人名并列简洁清楚。
