base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: zh_hans
  text: 犹大去攻打住在希伯仑的迦南人[a]（希伯仑从前名叫基列·亚巴[b]），击败了示筛、亚希幔和挞买[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“迦南人”在形式上是单数，此处很可能是集合用法，指迦南居民。
    reason: lexical_alternative
  - marker: b
    text: 直译：“希伯仑从前的名字是基列·亚巴。”
    reason: lexical_alternative
  - marker: c
    text: “击败”也可译作“击杀”；这里的希伯来语动词在军事语境中可表示给予重击、战胜或杀死。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶל
  choice: 犹大去攻打
  rationale: הלך本义为“去、行走”，但本句以אֶל引出敌对对象，处于军事叙事中，表示前去交战。“去攻打”既保留行动意味，也自然表达敌对语境。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 希伯来文在形态上为单数，但此处很可能是集合名词，泛指住在希伯仑的迦南居民。现代汉语“迦南人”本身可作集合称谓。
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: 住在希伯仑的
  rationale: 分词יֹשֵׁב表示持续居住；“住在”是清楚、自然的现代汉语表达。
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע
  choice: 希伯仑从前名叫基列·亚巴
  rationale: לְפָנִים表示“从前、早先”；该句交代城名沿革。地名קִרְיַת אַרְבַּע采用音译“基列·亚巴”，不在正文中解释其可能的词义。
- source_word: וַיַּכּוּ
  choice: 击败了
  rationale: נכה在战争语境中表示给予决定性打击，可涵盖击败或击杀。“击败”在中文军事叙事中自然，同时借脚注保留“击杀”的可能。
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: 示筛、亚希幔和挞买
  rationale: 三者均为人名，按常用中文圣经人名形式音译。
theological_decisions: []
