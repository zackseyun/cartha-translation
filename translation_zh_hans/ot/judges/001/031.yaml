language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: zh_hans
  text: 亚设没有赶走[a]亚柯[b]的居民，也没有赶走西顿、亚黑拉、亚革悉、黑巴、亚弗和利合的居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逐出”或“夺去……的土地”。希伯来语动词在这里指使原有居民失去对土地的占有。
    reason: lexical_alternative
  - marker: b
    text: 亚柯是古代的沿海城市，后来称为阿卡（Acre）。
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: 赶走
  rationale: ירש 的使役式在征服土地的语境中表示使原有居民失去土地，即“赶走”或“逐出”。“赶走”自然易懂，也符合《士师记》第1章反复出现的表达。
- source_word: יֹשְׁבֵי
  choice: 居民
  rationale: ישב 的分词在这里指居住在某地的人；“居民”简洁自然，并保留其群体含义。
- source_word: עַכּוֹ
  choice: 亚柯
  rationale: 按希伯来语地名音译；这是后来称为阿卡（Acre）的古代沿海城。
- source_word: צִידוֹן
  choice: 西顿
  rationale: 采用现代中文圣经语境中通行的地名译法。
- source_word: אַחְלָב
  choice: 亚黑拉
  rationale: 按希伯来语专名音译。
- source_word: אַכְזִיב
  choice: 亚革悉
  rationale: 按希伯来语专名音译，并采用中文圣经中较通行的形式。
- source_word: חֶלְבָּה
  choice: 黑巴
  rationale: 依本节马所拉文本 חֶלְבָּה 音译，不改从其他异体形式。
- source_word: אֲפִיק
  choice: 亚弗
  rationale: 采用该地名在中文圣经语境中的通行译法。
- source_word: רְחֹב
  choice: 利合
  rationale: 采用该地名在中文圣经语境中的通行译法。
- source_word: וְ/אֶת ... וְ/אֶת
  choice: 也没有……、……和……
  rationale: 否定动词统摄一连串并列宾语；中文用“也没有”引出后续名单，并以顿号和“和”连接，能自然表达每一处都未被赶逐。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“居民”在后半句统摄西顿及其后各地名，以自然中文补出希伯来语并列结构中省略而可理解的成分。脚注标记依其实际内容分别置于“赶走”和“亚柯”之后。
