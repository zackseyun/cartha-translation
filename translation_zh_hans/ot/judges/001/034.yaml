base_translation:
  language: en
  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: zh_hans
  text: 亚摩利人把但的子孙逼到山地[a]，因为他们不让但支派下到谷地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逼到”也可译为“逼向”。原文“亚摩利人”为集合性单数族名，但动词用复数；末尾的单数代词可指但支派作为整体。
    reason: 说明“山地”的方向含义，并准确交代原文集合性族名与单、复数指称的语法现象。
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: 逼到
  rationale: 该动词表示挤压、压迫或逼迫；与表示方向的“山地”连用时，“逼到”自然表达被迫困在某一区域的含义，而不过度增译。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文虽为形态上的单数，却是指整个族群的集合用法；现代汉语用“亚摩利人”可自然兼顾集合意义。
- source_word: בְּנֵי דָן
  choice: 但的子孙
  rationale: 保留希伯来文以亲属关系称呼支派成员的表达，也符合中文圣经语体；此处实际指但支派的人。
- source_word: הָהָרָה
  choice: 到山地
  rationale: 词尾表方向，指朝向山地区域；“山地”与下文“谷地”形成清楚的地形对照。
- source_word: כִּי
  choice: （分句承接，不译为显式连词）
  rationale: כִּי在此说明前句情形的原因。中文以“不让……”直接承接，因果关系已清楚，避免重复笨重；也可译作“因为”。
- source_word: לֹא נְתָנוֹ
  choice: 不让他们
  rationale: 原文动词及代词以集合单数形式呼应族群称谓；中文按实际所指采用复数“他们”，指亚摩利人不准但的子孙下去。
- source_word: לָרֶדֶת
  choice: 下到
  rationale: 准确传达从山地向较低谷地移动的地理含义，且比“下降”更符合现代叙事汉语。
- source_word: לָעֵמֶק
  choice: 谷地
  rationale: עֵמֶק指山谷或低洼地带；“谷地”既直接，又与“山地”自然对照。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“但的子孙”保留支派亲属称谓；“逼到山地”简洁呈现敌对压迫及方向。“不让他们……”以中文自然承接原因，同时脚注交代原文集合单数。
