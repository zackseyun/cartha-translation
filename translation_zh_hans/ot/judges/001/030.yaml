base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: zh_hans
  text: 西布伦没有赶出基特仑的居民，也没有赶出拿哈罗[a]的居民；于是迦南人住在西布伦支派中间[b]，成了服苦役的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿哈罗”按本节希伯来文本的读音音译；相关经文和译名传统也作“拿哈拉”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“那迦南人住在他中间”；“迦南人”在原文中是集合单数，“他”很可能把西布伦支派视为一个整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: 赶出
  rationale: 此处为ירש的使役形，在《士师记》第1章的土地与定居语境中，指把原有居民逐出；“赶出”自然清楚，又不加入原文没有明说的细节。
- source_word: יוֹשְׁבֵי
  choice: 居民
  rationale: ישב的分词在这里指居住于某地的人；“居民”简洁并保留地域含义。
- source_word: קִטְרוֹן
  choice: 基特仑
  rationale: 按本节马所拉读音转写地名。
- source_word: נַהֲלֹל
  choice: 拿哈罗
  rationale: 按本节马所拉元音 נַהֲלֹל 转写；相关经文与译名传统另有“拿哈拉”一类形式，列入脚注。
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: 于是迦南人住在西布伦人中间
  rationale: הַכְּנַעֲנִי 是表示族群的集合单数，中文用“迦南人”可自然兼具集合意义；单数后缀指作为整体的西布伦支派，正文将所指明示为“西布伦人”，避免中文代词含混。
- source_word: וַיִּהְיוּ לָמַס
  choice: 服了苦役
  rationale: מַס在此指受制人口所承担的强制劳役；“服苦役”是自然、凝练的现代中文表达，并保留其强制性质。
theological_decisions:
- issue: הַכְּנַעֲנִי 的集合单数与 בְּקִרְבּוֹ 的单数后缀
  choice: 译作“迦南人住在西布伦人中间”
  alternative: 直译为“那迦南人住在他／它中间”
  rationale: 希伯来文常以单数统称一个民族，也把支派视为单一整体。中文明示“西布伦人”能准确传达所指，同时脚注保留原文的语法形式；此处不涉及额外的教义判断。
- issue: וַיִּהְיוּ לָמַס 所表达的身份或处境
  choice: 译作“服了苦役”
  alternative: “成了苦役”或“成了服苦役的人”
  rationale: 原文表达迦南人落入强制劳役的处境，并非把人等同于抽象的“劳役”；中文以动词短语表达更自然，也不削弱受制意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“西布伦”在首句指支派，后句为消除单数后缀在中文中的歧义而译作“西布伦人”。分号呈现未能赶出居民与迦南人继续杂居、服役之间的结果关系。所有脚注标记均已置入正文。
