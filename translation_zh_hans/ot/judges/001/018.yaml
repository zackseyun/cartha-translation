  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: zh_hans
  text: 犹大攻取了迦萨及其辖区[a]、亚实基伦及其辖区，以及以革伦及其辖区。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 每处“辖区”也可译作“边界”；这个希伯来词既可指边界，也可指由边界围定的地域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: 攻取了
  rationale: לכד在军事语境中指以武力夺取城邑；“攻取”既保留行动方式，也符合现代汉语叙事表达。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 原文以专名代表作为集体行动者的犹大支派；不增补“支派”，以免把隐含信息写入正文。
- source_word: גְּבוּלָהּ
  choice: 属……的地区
  rationale: גְּבוּל既可指边界，也可指边界以内的地域。征服城邑的清单中，“属……的地区”自然表达该城及其辖区，同时以脚注保留“边界”的可能。
- source_word: עַזָּה
  choice: 迦萨
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: אַשְׁקְלוֹן
  choice: 亚实基伦
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: עֶקְרוֹן
  choice: 以革伦
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
