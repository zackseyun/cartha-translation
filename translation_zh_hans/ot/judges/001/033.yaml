  text: נַפְתָּלִ֗י לֹֽא הוֹרִ֞ישׁ אֶת יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וְ/אֶת יֹשְׁבֵ֣י בֵית עֲנָ֔ת וַ/יֵּ֕שֶׁב בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ וְ/יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וּ/בֵ֣ית עֲנָ֔ת הָי֥וּ לָ/הֶ֖ם לָ/מַֽס־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: zh_hans
  text: 拿弗他利人没有赶走伯示麦的居民和伯亚纳的居民，就住在迦南人中间；这些人是那地的居民。伯示麦和伯亚纳的居民替他们服苦役[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受他们征用服劳役”。希伯来语“苦役”指强制性的劳役，并非仅指缴纳贡物。
    reason: 说明מַס的制度含义及可行译法，避免读者误解为普通赋税。
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: 拿弗他利人
  rationale: 原文以支派名“拿弗他利”作集合性主语；译作“拿弗他利人”符合现代汉语习惯，也与后文复数代词“他们”自然衔接。
- source_word: הוֹרִישׁ
  choice: 赶走
  rationale: 此处使役形表示把原有居民逐出其地。“赶走”通顺明白，并保留军事占地语境；“夺取……的产业”会把重点移向土地所有权。
- source_word: יֹשְׁבֵי
  choice: 居民
  rationale: 该词是ישב的分词，指居住在某地的人；“居民”简洁自然，适合本章反复出现的句式。
- source_word: בֵית שֶׁמֶשׁ
  choice: 伯示麦
  rationale: 采用现代中文圣经读者较熟悉的传统地名音译，不按字面译作“太阳之家”。
- source_word: בֵית עֲנָת
  choice: 伯亚纳
  rationale: 采用传统中文地名音译，作为专名处理，不将其字面意义译出。
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: 反而住在……中间
  rationale: “住在……中间”准确表达希伯来语习语；“反而”呈现未能赶走居民之后形成的对照结果，但不额外断定因果程度。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 原文虽为形态上的单数，却是集合性族称；汉语“迦南人”本身可作集合称谓。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 当地的
  rationale: 该短语直译为“那地的居民”，与前面的“迦南人”构成同位说明。译作“当地的迦南人”保留其限定作用，同时避免现代汉语中生硬重复“居民”。
- source_word: הָיוּ לָהֶם לָמַס
  choice: 为他们服苦役
  rationale: מַס在此指受强制征用的劳役，而非单纯缴纳金钱贡物。“为他们服苦役”既表达强制性，也自然体现לָהֶם所指的受益或支配一方。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“拿弗他利人”明确支派的集合性主体；第二句用“后来”承接局势变化，而不赋予原文未明说的精确时间间隔。地名沿用简体中文圣经传统音译。脚注标在实际涉及词义的“苦役”之后。
