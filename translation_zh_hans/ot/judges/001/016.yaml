base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: zh_hans
  text: 基尼人（摩西的岳父[a]）的子孙，和犹大的子孙一同从棕榈城[b]上到犹大旷野，就是亚拉得以南的旷野；他[c]便去同那民[d]住在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “岳父”所译的希伯来语也可泛指“姻亲”。
    reason: lexical_alternative
  - marker: b
    text: “棕榈城”通常被认为是耶利哥。
    reason: cross_reference
  - marker: c
    text: 原文在这里由复数转为单数：“他去并住下。”这可能把基尼人的宗族视为一个整体；也有人按复数含义理解。
    reason: grammatical_ambiguity
  - marker: d
    text: 或译“住在那民中间”。一些古代文本见证作“与亚玛力人一同”，而不是“与那民一同”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: 基尼人的子孙
  rationale: בְּנֵי 在宗族叙事中可指后裔或族人；译为“子孙”既保留谱系含义，也不局限于亲生儿子。קֵינִי 是族称，按通行中文名称译为“基尼人”。
- source_word: חֹתֵן מֹשֶׁה
  choice: 摩西岳父
  rationale: חֹתֵן 在这里最可能指岳父；该词也可能泛指姻亲，因此在脚注中保留较宽泛的可能。
- source_word: עָלוּ מֵעִיר הַתְּמָרִים
  choice: 从棕榈城上到
  rationale: 保留原文“棕榈城”的称号，并以“上到”表达 עלה 的移动及可能的地势意味；该城通常被认为是耶利哥，置于脚注说明。
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: 和犹大的子孙一同
  rationale: 此处 אֶת 作伴随意义“和……一同”，בְּנֵי 则按支派成员的谱系表达译为“子孙”。
- source_word: מִדְבַּר יְהוּדָה
  choice: 犹大旷野
  rationale: 这是移动的目的地；中文“上到犹大旷野”已自然表达趋向，无须另加介词。
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: 就是亚拉得南地
  rationale: נֶגֶב 可指“南方、南地”或专名“尼革夫”。此处译作“亚拉得南地”，保留与亚拉得相关的地理表达，同时不把含义过度限定为现代地名。
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: 他去……居住
  rationale: 两个动词均为阳性单数，故保留原文从复数主语转为单数“他”的突变，不擅自协调为复数；“居住”自然表达 ישׁב，并不额外强化永久定居。
- source_word: אֶת הָעָם
  choice: 与那民一同
  rationale: 按马所拉文本将 אֶת 理解为伴随介词，译作“与那民一同”；“那民”的具体所指仍保持含混，古代见证中的“亚玛力”异文列入脚注。
