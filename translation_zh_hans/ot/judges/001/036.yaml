  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: zh_hans
  text: 亚摩利人的边界从亚克拉滨坡[a]起，从西拉[b]向上延伸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚克拉滨”意为“蝎子”；“亚克拉滨坡”也可译作“蝎子坡”。
    reason: lexical_alternative
  - marker: b
    text: 或译“磐石”；原文可指名为“西拉”的地方，也可作普通名词理解。
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: 边界
  rationale: 该词在这里指疆域的界线，而非整片领土；“边界”符合地理语境。
- source_word: הָאֱמֹרִי
  choice: 亚摩利人
  rationale: 原文虽为单数形式，但民族名称在此作集合用法；现代汉语用“亚摩利人”自然准确。
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: 从亚克拉滨坡起
  rationale: מַעֲלֵה 指上坡、坡道或山口；עַקְרַבִּים 是地名的一部分。正文保留音译，并用“坡”表达地形含义。
- source_word: מֵהַסֶּלַע
  choice: 由西拉
  rationale: 地理语境支持将其视为地名“西拉”；但原文也可直接理解为普通名词“磐石”，故以脚注保留歧义。
- source_word: וָמָעְלָה
  choice: 往上延伸
  rationale: 该表达表示从所述地点向上或向更高处继续；“往上延伸”在汉语地界描述中自然，也保留其空间方向。
- source_word: וּ
  choice: （不单独译出）
  rationale: 句首连词承接上文；本节作为独立地理说明时，汉语无需机械译作“并且”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的地理叙述。“从……起，由……往上延伸”使原文两个介词短语在汉语中关系清楚，同时不消除“西拉／磐石”的原文歧义。
