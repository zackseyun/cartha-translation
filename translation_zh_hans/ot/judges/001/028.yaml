base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: zh_hans
  text: 以色列强盛起来的时候，就强迫迦南人服劳役[a]，却没有把他们完全赶出去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使迦南人服劳役”。原文所用的词指统治者强加的义务性劳役。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“没有把他赶出去”；单数宾语是把“迦南人”作为一个整体来指称。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ……的时候
  rationale: 这是引出时间从句的希伯来叙事表达；汉语用“……的时候”自然地交代事件发生的时点，无须直译“事情发生了”。
- source_word: חָזַק
  choice: 强盛起来
  rationale: 此处动词很可能表示以色列逐渐获得实力或优势；“强盛起来”兼顾动态意味和自然汉语。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 原文虽为单数形式，却是指整个族群的集合用法；汉语“迦南人”本身可作集合称谓。
- source_word: לָמַס
  choice: 服苦役
  rationale: מַס在这里指统治者强加的劳役，而非中性的纳税；“服苦役”清楚保留其强制和受辖制的含义。
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: 却始终没有把他们赶出去
  rationale: 不定式绝对形与限定动词并用，在否定句中加强语气；“始终没有”传达彻底未完成驱逐的强调。原文宾语为单数，回指作为集合体的迦南人，汉语依语义用“他们”。
theological_decisions:
- issue: 以色列对迦南人的处置
  choice: 译明以色列强迫迦南人服劳役，却没有将他们赶出去
  alternative: 将其弱化为仅仅缴纳贡物或税款
  rationale: לָמַס在本语境中涉及强制劳役。译文不应淡化这种支配和强迫性质，也不应掩盖以色列没有完成驱逐这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“强盛起来”保留状态变化，“服苦役”明确表达强制劳役，“始终没有”自然体现希伯来文加强否定的结构。
