  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: zh_hans
  text: 以法莲没有赶出住在基色的迦南人；迦南人住在基色，在以法莲人中间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: 赶走
  rationale: 这里是 ירשׁ 的使役式，表示使当地居民失去居所或被逐离。“赶走”符合现代汉语习惯，也保留了以法莲未能清除当地居民的含义。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 原文虽为单数形式，但这里作为族群集合名词使用；汉语“迦南人”自然地兼具集合意义。
- source_word: הַיּוֹשֵׁב
  choice: 住在
  rationale: ישׁב 的分词表示持续居住；“住在”简洁自然，准确表达定居状态。
- source_word: בְּגָזֶר
  choice: 在基色
  rationale: 介词 בְּ 表示地点；“在基色”适合描述居住于该城。
- source_word: וַיֵּשֶׁב
  choice: 仍住
  rationale: 该叙事动词说明迦南人在未被赶走后继续居住。“仍住”自然表达其居留未变的结果，同时不把连接词强化为明确的因果关系。
- source_word: בְּקִרְבּוֹ
  choice: 在以法莲人中间
  rationale: 字面为“在他中间”，单数后缀指作为一个支派整体的以法莲。汉语明确译作“在以法莲人中间”，既传达集合意义，也避免“在他中间”的生硬与歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“赶走”比“驱逐”更易懂；分号清楚呈现两个并列而相关的叙事分句。第二分句保留地名“基色”的重复，以对应原文，并将单数集合指称自然展开为“以法莲人”。
