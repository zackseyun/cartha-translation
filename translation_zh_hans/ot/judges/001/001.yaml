  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: zh_hans
  text: 约书亚死后，以色列人[a]求问雅威说：“谁要为我们先上去攻打迦南人[b]，与他们交战？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，在这里指以色列人。
    reason: lexical_alternative
  - marker: b
    text: 原文“迦南人”在形式上是单数，在意义上却是集合称呼，指迦南各族之人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: 约书亚死后
  rationale: 以自然的现代汉语表达叙事开端和时间关系；不机械译出 וַיְהִי 的“事情发生了”，因为汉语在此无需这一引入语也能保留叙事推进。
- source_word: וַיִּשְׁאֲלוּ ... בַּיהוָה
  choice: 求问雅威
  rationale: שׁאל 与介词 ב 在这里指向神寻求指示；“求问”比普通的“问”更准确地传达这一语境。神名 יְהוָה 音译为“雅威”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，是对以色列群体的惯用称呼；“以色列人”在现代汉语中自然、准确，不把所指限缩为直系儿子。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的常用结构，在汉语中简洁自然。
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: 谁要为我们……上去
  rationale: 保留 עלה 的“上去”以及 לָנוּ 的“为我们”；后者可表达为共同体出战或代表共同体行动，不进一步限定。
- source_word: אֶל הַכְּנַעֲנִי
  choice: 攻打迦南人
  rationale: 介词 אֶל 本可表示朝向，但交战语境要求汉语明确敌对行动；“攻打”自然传达军事进军的方向。单数形式“迦南人”在此具有集合意义。
- source_word: בַּתְּחִלָּה
  choice: 先
  rationale: 这里询问各支派出战次序，“先”比“在开始时”更符合现代汉语。
- source_word: לְהִלָּחֶם בּוֹ
  choice: 与他们交战
  rationale: לחם 表示交战；代词后缀在希伯来语中为单数，与集合单数“迦南人”一致，汉语按群体意义使用“他们”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”以呈现其专名性质，不以称号“主”代替；“耶和华”是传统形式，但较少反映学界通常接受的读音。
- issue: “为我们上去”的主体关系
  choice: 保留“为我们”
  alternative: “我们中谁先上去”或“谁代表我们上去”
  rationale: לָנוּ 可表达为群体利益而行动，也可能在语境中暗示从各支派中选出先锋；译文不把这一关系明确收窄为“我们中”或“代表我们”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求问”体现向神寻求指示的语境；“上去”保留原文军事行动的空间表达；两处脚注标记均置于正文相应词语之后。
