  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: zh_hans
  text: 耶和华说：“犹大要先上去。看哪，我已经把那地交在他手中了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，清楚指向以色列的上帝。
- source_word: יַעֲלֶה
  choice: 要先上去
  rationale: “上去”保留军事出征和地势行进的表达；结合上节询问谁“先”上去的语境，补出“先”使指代自然清楚。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示注意并强调随后宣告的语气。
- source_word: נָתַתִּי
  choice: 已经……交
  rationale: 完成式在此表达上帝所宣告之行动的确定性，以“已经”保留这一力度。
- source_word: בְּיָדוֹ
  choice: 在他手中
  rationale: 保留希伯来语表示控制、占有或胜利的惯用意象，不将其窄化为单一解释。
theological_decisions:
- issue: 上帝已经赐地与尚待出征之间的张力
  choice: “我已经把那地交在他手中了”
  alternative: “我要把那地交在他手中”
  rationale: 原文使用完成式；译文保留已经赐予的宣告与犹大仍须上去争战之间的神学张力，不改写为单纯将来时。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；引语清晰简洁。“看哪”略带经文语体，但能准确承载原文 הִנֵּה 的强调功能。
