  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: zh_hans
  text: 但玛拿西没有逐出伯善及其附属城镇的居民[a]，也没有逐出他纳及其附属城镇的居民、多珥及其附属城镇的居民、以伯莲及其附属城镇的居民，以及米吉多及其附属城镇的居民；迦南人执意住在这片土地上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它的女儿们”，指隶属于主要城市的周边小城或聚落。
    reason: cultural_note
  - marker: b
    text: “执意住在”也可译作“仍坚持住在”；原文动词可表达情愿或决意。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: 赶走
  rationale: 此处使役形表示使当地居民失去占有、将其逐出。“赶走”在现代汉语中自然清楚，并符合本章反复出现的驱逐语境。
- source_word: בְּנוֹתֶיהָ
  choice: 其所属的城镇
  rationale: 字面为“它的女儿们”，是指隶属于中心城市的周边小城或聚落。正文采用自然汉语表达，脚注说明原文比喻。
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: 住在多珥／以伯莲／米吉多……的人
  rationale: 这些由ישׁב构成的形式指当地居民；译为“住在……的人”比“居民”更贴近原文分词结构，也符合现代汉语。
- source_word: וַיּוֹאֶל
  choice: 执意
  rationale: יאל在此可表达情愿或决意；结合玛拿西未能赶走当地人的上下文，“执意”保留其主动意愿和坚定意味，同时不把语义缩减为单纯的持续状态。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 原文形态为单数，但在此作集合名词，现代汉语“迦南人”同样可作群体称谓。
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: 住在这片土地上
  rationale: ל加不定式说明迦南人所情愿或决意做的事；“这片土地”保留指示词הַזֹּאת。
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: 伯·善／他纳／多珥／以伯莲／米吉多
  rationale: 采用现代中文圣经读者较熟悉且可辨识的地名音译；“伯·善”以间隔号标明复合地名。
theological_decisions:
- issue: וַיּוֹאֶל所表达的是持续居住还是意愿／决心
  choice: 正文译作“执意住在”
  alternative: “仍旧住在”或“坚持住在”
  rationale: 原词核心可含情愿、决意之意；“执意”避免只描述时间上的延续，保留迦南人的主动意向。脚注列出较弱的替代译法，以保存词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。地名按常见中文圣经形式音译；重复结构大体保留，以呈现原文列举的节奏，同时用“其所属的城镇”清楚传达古代城市与附属聚落的关系。
