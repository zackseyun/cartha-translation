base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: zh_hans
  text: 约瑟家也上去攻打伯特利[a]，雅威与他们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上到伯特利去。”希伯来文动词直译为“上去”；在这里的军事语境中，很可能指向这城进军并攻打。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: 上去攻打
  rationale: עלה本义为“上去”；在此军事叙事中，后接目标城邑，表示向其进军或发动攻击。“上去攻打”既保留原文的方向性表达，也使敌对行动清楚。
- source_word: בֵית יוֹסֵף
  choice: 约瑟家
  rationale: 这是对约瑟支派群体的正式称呼。“约瑟家”简洁自然，并保留原文的家族—支派用语。
- source_word: גַּם הֵם
  choice: 也
  rationale: 该短语把约瑟家的行动接续于前文各支派的行动；现代汉语用“也”即可自然表达。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用该地名在现代中文圣经中的通行音译。
- source_word: וַיהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה；以“雅威”音译，保留其作为立约之神专名的性质。
- source_word: עִמָּם
  choice: 与他们同在
  rationale: עם在这里表达神的临在与扶助。“与他们同在”直接而自然，并避免把含义过度限定为单纯的军事支持。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名יהוה。译作“雅威”较直接地呈现该专名，而不以称号代替。
- issue: “雅威与他们同在”所表达的意义
  choice: 保留临在与支持两层可能含义
  alternative: 雅威帮助他们；雅威站在他们一边
  rationale: 原文עִמָּם字面为“与他们同在”，在叙事中暗含扶助，但没有明说帮助的具体方式，因此不将其窄化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上去攻打”保留希伯来语军事叙事的方向性习语；“约瑟家”保留支派群体的正式称谓。
