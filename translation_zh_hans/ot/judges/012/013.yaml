  yaml_path: translation/ot/judges/012/013.yaml
  text: After him, Abdon son of Hillel the Pirathonite judged Israel.
translation:
  language: zh_hans
  text: 在他以后，希列的儿子、比拉顿人押顿作以色列的士师。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: 作……的士师
  rationale: שׁפט在《士师记》中是反复出现的核心用语，既指士师施行治理，也与该书中的士师职分相联系；译作“作以色列的士师”自然且不把含义局限为审理案件。
- source_word: אַחֲרָיו
  choice: 在他以后
  rationale: 介词短语带第三人称单数后缀，表示押顿继前一位士师之后；“在他以后”直接保留了承接关系。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: אֶת是直接宾语标记，不需另译；“以色列”在此指以色列民，是押顿治理的对象。
- source_word: עַבְדּוֹן
  choice: 押顿
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: בֶּן הִלֵּל
  choice: 希列的儿子
  rationale: 准确表达希伯来语组合结构所指的父子关系，并符合现代汉语表达。
- source_word: הַפִּרְעָתוֹנִי
  choice: 比拉顿人
  rationale: 该带冠词的族属/地名形容词表示来自比拉顿的人；“比拉顿人”简洁保留其来源身份。
theological_decisions: []
