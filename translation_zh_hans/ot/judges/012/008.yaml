base_translation:
  language: en
  yaml_path: translation/ot/judges/012/008.yaml
  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: zh_hans
  text: 在他以后，来自伯利恒[a]的以比赞作士师治理以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“伯利恒人”。这里的希伯来语介词既可表示来源，也可表示归属或关联。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: 作士师治理
  rationale: שׁפט在《士师记》中常指士师对以色列施行治理。“作士师治理”既保留全书反复出现的“士师”称谓，也比单说“审判”更准确地传达此处的职分与活动。
- source_word: אַחֲרָיו
  choice: 在他以后
  rationale: 介词加第三人称后缀表示继任次序；上文所指清楚，因此不在本节中增添“耶弗他”的名字。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: אֶת是直接宾语标记，不需单独译出；“以色列”是以比赞治理的对象。
- source_word: אִבְצָן
  choice: 以比赞
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: מִבֵּית לָחֶם
  choice: 来自伯利恒
  rationale: 前缀介词מִן通常表示来源，也可能表示归属或关联；正文采用自然且直接的“来自伯利恒”，并以脚注保留另一种理解。
theological_decisions: []
