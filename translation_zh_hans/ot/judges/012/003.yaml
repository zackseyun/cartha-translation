base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: zh_hans
  text: 我看见你没有救我们，就拿自己的性命冒险[a]，越过去攻打亚扪人；雅威把他们交在我手中。你们今天为什么上来与我争战呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“把我的性命放在我的手掌中”，这是指冒着生命危险的习语。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה כִּי אֵינְךָ מוֹשִׁיעַ
  choice: 我见你不来救我们
  rationale: 按希伯来文保留第二人称单数“你”，并在军事语境中把 ישׁע 译作“救”；“我们”是原文未明说但语义所需的受事，结合上下文补出。“不来救”自然表达对方未采取救援行动。
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: 就把自己的性命放在手掌中
  rationale: 保留希伯来语“性命在手掌中”的具体意象，同时以脚注说明其冒死犯险的习语含义。
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: 过去攻打亚扪人
  rationale: עבר 表示越过、前往，אֶל 在战事语境中指向敌方；“过去攻打”既保留移动含义，也明确敌对行动，而不擅自补出河流等原文未言明的地理细节。
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: 雅威把他们交在我手中
  rationale: 保留常见的得胜公式及“交在……手中”的希伯来意象；代词“他们”指亚扪人。
- source_word: וְלָמָה עֲלִיתֶם אֵלַי הַיּוֹם הַזֶּה לְהִלָּחֶם בִּי
  choice: 你们今天为什么上来攻击我，要与我争战呢？
  rationale: 保留原文此处第二人称复数“你们”；עלה אֶל 在军事语境中译为“上来攻击”，后半句“要与我争战”保留目的结构和敌对语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，并明确呈现其专名性质，不以称号替代。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。首句的“你”依原文为单数，末句的“你们”依原文转为复数；不将这一人称张力抹平。两个“手”均予保留，以呈现本节原有的意象呼应。
