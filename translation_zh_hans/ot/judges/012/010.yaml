lexical_decisions:
- source_word: וַיָּמָת
  choice: 后来……死了
  rationale: 动词意为“死”；叙事性的连续式推动事件发展，译作“后来”自然体现先后关系，避免机械重复“于是”。
- source_word: אִבְצָן
  choice: 以比赞
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 该词为尼法勒式，在此表达被动含义；中文“葬在”简洁自然，已能表达死者被安葬。
- source_word: בְּבֵית לָחֶם
  choice: 在伯利恒
  rationale: 介词 בְּ 表示地点；地名 בֵּית לָחֶם 采用现代中文通行译名“伯利恒”。
