  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: zh_hans
  text: 后来，西布伦人以伦死了，葬在西布伦地[a]的亚雅仑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西布伦境内”。
    reason: אֶרֶץ在这里可表达“地”或“境内、地域”；脚注保留这一词义选择。
lexical_decisions:
- source_word: וַיָּמָת
  choice: 后来……死了
  rationale: וַיָּמָת是מות的叙事性连续式，推进事件次序；“后来……死了”既自然，又保留简单的死亡陈述。
- source_word: אֵלוֹן
  choice: 以伦
  rationale: 按现代中文圣经人名的通行音译处理此专名。
- source_word: הַזְּבוּלֹנִי
  choice: 西布伦人
  rationale: 带定冠词的族属词表明以伦属于西布伦支派；“西布伦人”简洁自然，不额外限定为地域居民。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: קבר的尼法勒式表达被动意义“被埋葬”；中文在同一主语下用“葬在”自然地表达这一被动结果。
- source_word: בְּאַיָּלוֹן
  choice: 在……亚雅仑
  rationale: 介词בְּ标明安葬地点；地名אַיָּלוֹן音译为“亚雅仑”。
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: 西布伦地
  rationale: אֶרֶץ在此指西布伦所属的土地或地域；“西布伦地”形式贴近原文，也符合中文地理叙述。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准普通话。人名与地名使用中文圣经传统中易辨认的译名；保留希伯来叙事的顺承关系，同时避免生硬重复被动代词。脚注标记置于其实际对应的“西布伦地”之后。
