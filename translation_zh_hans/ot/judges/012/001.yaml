base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: zh_hans
  text: 以法莲人被召集起来[b]，渡过河到撒分[a]，对耶弗他说：“你为什么渡河去攻打亚扪人，却没有召我们和你一起去？我们要放火烧你的房子，把你也烧在里面[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒分”也可译作“向北”；这取决于צָפוֹנָה在此是地名，还是表示方向的副词。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“一个以法莲人”，但后面的“他们说”是复数，表明这里是集合用法，指以法莲人这一群体。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近似“我们要用火烧你的房子在你身上”，意思很可能是要把耶弗他连同房子一起烧掉。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: 以法莲人被召集起来
  rationale: 动词可表达被召集、集结；אִישׁ虽为单数形式，但后文用复数“他们说”，表明这里是集合用法，指以法莲人这一群体。
- source_word: וַיַּעֲבֹר
  choice: 渡到
  rationale: 原文动词为单数，与集合主语相呼应；现代汉语无需标明数，并可自然表达越过河流或边界前往某地。
- source_word: צָפוֹנָה
  choice: 撒分
  rationale: 此处优先视为地名“撒分”，符合叙事交代行军地点的用法；同时以脚注保留“向北”的可能。
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: 去攻打亚扪人
  rationale: “亚扪人”自然传达“亚扪之子”；“攻打”符合军事语境，简洁有力。
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: 却没有召我们和你一起去
  rationale: קרא在此指召集或召唤参战；译文保持质问语气和共同出征的含义。
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: 我们要放火烧掉你的房子，连你一起烧
  rationale: 保留明确的纵火威胁，并以自然汉语表达עָלֶיךָ所暗示的耶弗他将在房中一同被烧；脚注说明原文的具体意象。
