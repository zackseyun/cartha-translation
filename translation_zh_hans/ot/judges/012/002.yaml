revisions:
- from: 耶弗他对他们说[a]：“我和我的百姓曾与亚扪人发生激烈的争战；我向你们呼求，你们却没有救我脱离他们的手。”
  to: 耶弗他对他们说[a]：“我和我的百姓曾与亚扪人有过激烈的冲突；我向你们呼求，你们却没有救我脱离他们的手。”
  rationale: 将“争战”改为“冲突”，避免无必要地缩窄רִיב的含义；同时调整脚注，使其作为可读的异译，反映原文较紧缩且带有“争端”色彩的表达。其余译文准确保留求援、未获解救和“手”的意象。
