base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: zh_hans
  text: 耶弗他对他们说[a]：“我和我的百姓曾与亚扪人有过激烈的冲突；我向你们呼求，你们却没有救我脱离他们的手。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我和我的百姓与亚扪人之间有极大的争端。”
    reason: 保留אִישׁ רִיב及מְאֹד所表达的“争端／冲突”含义，并以自然汉语呈现原文紧缩的结构。
lexical_decisions:
- source_word: אִישׁ רִיב הָיִיתִי אֲנִי וְעַמִּי וּבְנֵי עַמּוֹן מְאֹד
  choice: 我和我的百姓曾与亚扪人发生激烈的争战
  rationale: 原文直译近于“我是争战之人，我和我的百姓与亚扪人大大争战”，句法紧缩且不自然。这里的 אִישׁ רִיב 与 היה 连用，主要描述耶弗他及其百姓所处的冲突状态；מְאֹד 加强冲突程度，因此译作“发生激烈的争战”，既自然，也保留强烈程度。
- source_word: וְעַמִּי
  choice: 和我的百姓
  rationale: עַם 通常指“百姓、人民”。原文没有足够依据将其窄化为“军队”，故保留集体性称谓。
- source_word: וּבְנֵי עַמּוֹן
  choice: 与亚扪人
  rationale: בְּנֵי עַמּוֹן 字面为“亚扪之子”，在此是民族名称，现代汉语自然译为“亚扪人”。
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: 我向你们呼求
  rationale: זעק 常指在危难中呼喊求助；“向你们呼求”既体现求援含义，又保持庄重、简明的叙事语体。
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: 你们却没有救我
  rationale: ישׁע 的使役形表示“拯救、解救”。此处是军事危难语境，“救我”直接而不过度赋予专门神学含义；“却”准确呈现前后转折。
- source_word: מִיָּדָם
  choice: 脱离他们的手
  rationale: 保留希伯来语以“手”表示权势或控制的形象；这一表达在中文圣经语体中清楚可懂，也没有将意象完全释义化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“争战”适合士师记的军事语境，同时仍可涵盖 רִיב 的冲突含义；主文不把“我的百姓”缩窄为“我的军队”，也不把“他们的手”完全改写为“他们的权势”。
