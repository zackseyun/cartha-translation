base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: zh_hans
  text: 他有三十个儿子；他把三十个女儿送出去，又从外面带来三十个女儿给他的儿子。[a] 他作以色列的士师七年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更明确地译作：“他把三十个女儿嫁到自己的家族（或家室）以外，又从外面为儿子娶来三十个女子作妻子。”希伯来原文在两处都直译为“女儿”。
    reason: 说明婚配语境中的可能含义，同时保留“外面”所指范围的不确定性及原文两次使用“女儿”的措辞。
lexical_decisions:
- source_word: וַיְהִי לוֹ שְׁלֹשִׁים בָּנִים
  choice: 他有三十个儿子
  rationale: היה + ל 是表达领有的希伯来语惯用结构；译为“他有”符合现代汉语，同时准确保留“儿子”的性别所指。
- source_word: וּשְׁלֹשִׁים בָּנוֹת שִׁלַּח הַחוּצָה
  choice: 他把三十个女儿送到外面
  rationale: שׁלח 的基本义是“送、派”，הַחוּצָה 表示朝外的方向。上下文很可能指把女儿嫁到自己家族或家室之外，但正文保留原文较含蓄的表达，不把婚嫁含义直接写死。
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: 又从外面带来三十个女儿给他的儿子
  rationale: 原文再次使用“女儿”（בָּנוֹת），而非通常意义的“女人”或“妻子”；译文保留这一重复和视角。“从外面”不武断限定为外地或外国；婚配语境在脚注中说明。
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: 他作以色列的士师
  rationale: שׁפט 在《士师记》中是描述士师职分的固定用语。用“作……的士师”既维持全书术语的一致性，也避免让现代读者误解为只是在法庭上审判。
- source_word: שֶׁבַע שָׁנִים
  choice: 七年
  rationale: 直接准确地表达任职时长。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“送到外面”和“从外面带来”有意贴近原文并保留其含蓄性；脚注补充很可能隐含的婚嫁关系。用“作以色列的士师”体现《士师记》的书卷术语。
