base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: zh_hans
  text: 希列的儿子、比拉顿人押顿死了，葬在以法莲地的比拉顿，在亚玛力人的山地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作“在亚玛力人的山上”。希伯来语的居民称谓为单数形式，可能具有集合或地域含义。
    reason: 保留הַר可指单座山，以及הָעֲמָלֵקִי在形态上为单数所形成的词义歧义。
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות在此直接表示死亡；“死了”准确自然，不采用委婉说法。
- source_word: עַבְדּוֹן
  choice: 押顿
  rationale: 按现代中文圣经人名的通行译写处理。
- source_word: בֶּן הִלֵּל
  choice: 希列的儿子
  rationale: 保留原文的父子关系，并按现代汉语语序表达。
- source_word: הַפִּרְעָתוֹנִי
  choice: 比拉顿人
  rationale: 定冠词加居民称谓，指押顿来自比拉顿；“比拉顿人”简洁自然。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: קבר的尼法勒式在此表示被埋葬；汉语可省去重复主语，以“葬在”自然表达被动含义。
- source_word: בְּפִרְעָתוֹן
  choice: 在……比拉顿
  rationale: 地名音译，介词ב按地点义译为“在”。
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: 以法莲地
  rationale: 保留原文אֶרֶץ“地、地域”，不简化为仅“以法莲”。
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: 位于亚玛力人的山地
  rationale: הַר在地域描述中可指山地；单数居民称谓可作集合或地域性用法。加入“那里位于”使连续的地点短语在现代汉语中关系清楚，但不改变其地理指向。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文以简洁叙事句呈现；地理关系用“那里位于”明确连接，脚注则保留原文在“山／山地”和单数居民称谓上的歧义。
