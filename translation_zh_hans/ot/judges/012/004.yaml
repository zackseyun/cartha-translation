  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: zh_hans
  text: 于是，耶弗他召集基列所有的男子，与以法莲交战。基列人击败了以法莲人，因为以法莲人曾说：“你们基列人是以法莲的逃亡者，在以法莲中间、在玛拿西中间。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句辱骂的希伯来文句法难解；也可译作：“你们是以法莲的逃亡者，基列啊，在以法莲中间、在玛拿西中间。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: 召集
  rationale: קבץ表示聚集、集合；这里是军事动员语境，“召集”自然地传达这一含义，又不额外限定为正式征兵。
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: 基列所有的男子
  rationale: 贴近“基列所有的男人”这一原文表达；战事语境表明所指是参与作战的男子，但不直接增译为“战士”。
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: 与以法莲交战
  rationale: לחם的Niphal词形在此指交战；“与……交战”符合现代汉语，也保留双方直接作战的含义。
- source_word: וַיַּכּוּ
  choice: 击倒了
  rationale: נכה可指击打、击倒或击败。“击倒”保留战斗的暴力色彩，但不像“杀死”那样把动词的范围限定得过窄。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出冲突的缘由；“因为”在现代汉语中清楚自然。
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: 以法莲的逃亡者
  rationale: פְּלִיטִים指逃出或逃走的人；“逃亡者”保留了这句辱骂的贬抑意味，也没有将难解的句法改写成较自由的解释。
- source_word: אַתֶּם גִּלְעָד
  choice: 你们基列人
  rationale: 原文以地名“基列”代指当地人；汉语用“基列人”表达集体称呼，更为自然。
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: 身处以法莲之中、玛拿西之中
  rationale: בְּתוֹךְ意为“在……之中”。译文保留两个短语及其重复结构，不擅自解释为“在……之间”。
theological_decisions:
- issue: 末句辱骂的句法含混难解
  choice: 正文译为：“你们基列人是以法莲的逃亡者，身处以法莲之中、玛拿西之中。”
  alternative: “你们是以法莲的逃亡者，基列啊，身处以法莲之中、玛拿西之中。”
  rationale: 希伯来文措辞压缩，אַתֶּם与גִּלְעָד的关系及后两个介词短语的修饰对象并不完全明确。正文保留“逃亡者”的词义和原句的直接辱骂形式，脚注则呈现把“基列”视为呼语的可能读法，避免把含混处静默地解释掉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“召集”“交战”“击倒”保持叙事简洁有力；末句刻意保留原文略显突兀的重复与含混，并以脚注说明另一种句法分析。
