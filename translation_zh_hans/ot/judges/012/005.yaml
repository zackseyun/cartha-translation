  text: וַ/יִּלְכֹּ֥ד גִּלְעָ֛ד אֶֽת מַעְבְּר֥וֹת הַ/יַּרְדֵּ֖ן לְ/אֶפְרָ֑יִם וְֽ֠/הָיָה כִּ֣י יֹאמְר֞וּ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אֶעֱבֹ֔רָה וַ/יֹּ֨אמְרוּ ל֧/וֹ אַנְשֵֽׁי גִלְעָ֛ד הַֽ/אֶפְרָתִ֥י אַ֖תָּה וַ/יֹּ֥אמֶֽר לֹֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: zh_hans
  text: 基列人占据了约旦河的渡口[a]，堵截以法莲人。每逢逃亡的以法莲人说：“让我过河”，基列人就问他：“你是以法莲人吗？”如果他说：“不是”，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “渡口”指河中水浅、可供人涉水而过的地方，也可译作“过河处”。
    reason: 说明希伯来词מַעְבְּרוֹת所指的具体地形，并保留词义替代译法。
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: 占据
  rationale: לכד在此指以武力夺取并控制战略地点；“占据”自然地表达基列人控制渡口，而不是俘获某人。
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: 约旦河的渡口
  rationale: מַעְבְּרוֹת指可涉水过河的浅处或过河地点；“渡口”是现代中文中简明自然的对应表达。
- source_word: לְאֶפְרָיִם
  choice: 堵截以法莲人
  rationale: 介词ל本身可有多种关系，但上下文表明基列人控制渡口是为了拦截以法莲人；译为“堵截”传达其敌对和阻断功能。
- source_word: וְהָיָה כִּי
  choice: 每逢
  rationale: 该叙事结构引出反复发生的程序性情形，“每逢”准确体现重复意味。
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: 逃亡的以法莲人
  rationale: פָּלִיט指从战斗或危险中逃脱的人；“逃亡的”比“难民”更符合战败者试图过河脱身的语境。
- source_word: אֶעֱבֹרָה
  choice: 让我过河
  rationale: 第一人称鼓励式在这里表达请求或意愿；“让我过河”自然保留请求语气。
- source_word: הַאֶפְרָתִי אַתָּה
  choice: 你是以法莲人吗？
  rationale: 该族称在此询问支派身份，现代中文直接如此表达。
- source_word: וַיֹּאמֶר לֹא
  choice: 如果他说：“不是”
  rationale: 虽然形式上是叙事动词，但处在反复执行的盘查程序中，具有条件功能；“如果”使中文逻辑清楚，也与下一节衔接。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。以“每逢……就……”呈现原文反复盘查的叙事结构；句末保留逗号，以衔接下一节尚未完成的条件句。
