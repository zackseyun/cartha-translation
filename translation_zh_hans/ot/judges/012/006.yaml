  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: zh_hans
  text: 他们就对他说[a]：“请说‘示播列’。”他却说：“西播列。”因为他不能那样发音。于是他们抓住他，在约旦河的渡口宰杀了他。那时，以法莲人中有四万二千人倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “示播列”在希伯来语中可能意为“谷穗”，也可能意为“水流”或“洪水”；这里用作检验发音的词。
    reason: 说明该词可能的词义，以及其在本节中作为发音测试词的功能。
lexical_decisions:
- source_word: אֱמָר נָא
  choice: 请说
  rationale: 祈使式加语气词 נָא 带有请求语气；“请说”在现代汉语中自然简洁。
- source_word: שִׁבֹּלֶת
  choice: 希波列
  rationale: 此处该词用于检验发音，而非强调其词义；采用音译，并保留希伯来语词首的 sh 音与下文 s 音的区别。
- source_word: סִבֹּלֶת
  choice: 西波列
  rationale: 用“西”对应词首 s 音，与“希波列”的词首音形成可听辨的对照，体现叙事核心。
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: 因为他不能那样发音
  rationale: 字面涉及不能使自己按那样说；语境明确指无法发出所要求的读音。“那样发音”既保留方式含义，也令现代读者明白。
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: 他们抓住他
  rationale: אחז 表示抓住、拿住；“抓住”符合当场拘拿的语境。
- source_word: וַיִּשְׁחָטוּהוּ
  choice: 宰杀了他
  rationale: שׁחט 比一般的“杀死”更强烈，常指屠宰；“宰杀”保留原文的残酷力度。
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: 在约旦河的渡口
  rationale: מַעְבְּרוֹת 指河流可供渡越之处；“渡口”是准确自然的现代汉语表达。
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: 以法莲人倒下了
  rationale: נפל 在战斗和死亡语境中意为倒下、阵亡；保留“倒下”这一原文意象，人数结构则按汉语习惯表达。
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: 四万二千人
  rationale: 准确表达原文数字，并补出量词“人”以符合汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“希波列／西波列”在普通话中的词首音差异重现希伯来语的发音测试；“宰杀”保留原文动词的强烈程度。
