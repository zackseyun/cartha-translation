  yaml_path: translation/ot/judges/012/014.yaml
  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: zh_hans
  text: 他有四十个儿子和三十个孙子，他们骑着七十头驴。他治理以色列八年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי בָנִים
  choice: 孙子
  rationale: 字面为“儿子们的儿子”，现代汉语自然表达为“孙子”；原文使用阳性复数，语境指男性后裔。
- source_word: עֲיָרִם
  choice: 驴
  rationale: 此处是“公驴”的复数形式；汉语用通称“驴”自然准确，也保留其作为身份与财富标志的叙事含义。
- source_word: וַיִּשְׁפֹּט
  choice: 治理
  rationale: שׁפט 在士师记中不只指司法审判，也指士师对以色列的领导和治理；“治理”在此比单用“审判”更符合语境。
theological_decisions:
- issue: “骑着七十头驴”的修饰对象
  choice: 明确由四十个儿子和三十个孙子共同骑乘
  alternative: 保留无显式主语的分词结构，如“骑着七十头驴”
  rationale: 原文复数分词 רֹכְבִים 紧接两组男性后裔，数量合计七十，最自然地共同指向他们；补出“他们”符合汉语表达，并未增加实质解释。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“他有……”贴近希伯来叙事句式；分为两句以避免汉语长句拖沓，同时保留后裔、坐骑和治理年数三个并列信息。
