  yaml_path: translation/ot/judges/012/011.yaml
  text: After him, Elon the Zebulunite judged Israel ten years.
translation:
  language: zh_hans
  text: 在他以后，西布伦人以伦作以色列的士师；他治理以色列十年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: 作……的士师；治理
  rationale: שׁפט在《士师记》中指士师对以色列施行领导和治理。首处译为“作以色列的士师”，凸显本书反复出现的士师身份；第二处译为“治理”，自然表达其任职活动，同时保留原文动词的重复，避免将含义缩窄为司法审判。
- source_word: אַחֲרָיו
  choice: 在他以后
  rationale: 忠实保留原文代词所指，承接上文的士师，而不在本节擅自补出“以比赞”。
- source_word: אֵילוֹן
  choice: 以伦
  rationale: 按现代中文圣经人名音译惯例译写该专名。
- source_word: הַזְּבוּלֹנִי
  choice: 西布伦人
  rationale: 该族属形容词表明以伦属于西布伦支派；“西布伦人”是自然、准确的现代汉语表达。
- source_word: עֶשֶׂר שָׁנִים
  choice: 十年
  rationale: 直接、自然地表达原文所述任职时长。
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: 作以色列的士师；他治理以色列
  rationale: 原文两次使用同一动词。译文以两个相互对应而符合汉语习惯的表达保留这一结构：先介绍以伦担任士师，后说明其治理的年数。
