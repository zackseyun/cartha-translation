base_translation:
  language: en
  yaml_path: translation/ot/judges/012/007.yaml
  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: zh_hans
  text: 耶弗他作以色列的士师六年。基列人耶弗他死了，葬在基列的城邑中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在基列的众城中”。这里的复数可能是一种习惯表达，指基列地区某座未指明的城。
    reason: 说明原文复数形式及其可能的习惯用法，避免正文替原文排除歧义。
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: 作……的士师
  rationale: 保留《士师记》中“士师”这一贯穿全书的称谓，同时以现代汉语自然表达其施行士师职分之意，不将其角色限缩为行政治理或军事领导。
- source_word: שֵׁשׁ שָׁנִים
  choice: 六年
  rationale: 原文为明确的时间长度，直接译出。
- source_word: הַגִּלְעָדִי
  choice: 基列人
  rationale: 该地域形容词表明耶弗他的地域归属；“基列人”简洁自然。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 希伯来文是被动式；汉语丧葬记述中“葬在”已自然包含被安葬之意，避免生硬的“被埋葬”。
- source_word: בְּעָרֵי גִלְעָד
  choice: 在基列的城邑中
  rationale: 以集合性表达保留原文复数“城邑”，同时不武断指定为“其中一座城”；具体的文本歧义在脚注中说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作以色列的士师”保留全书关键词；“城邑”略具书面色彩，但普通读者易懂，也便于呈现原文复数而不造成一人葬于多城的明确印象。
