  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: zh_hans
  text: 她不可吃葡萄树所出的一切[a]，不可喝葡萄酒或烈酒，也不可吃任何不洁之物。凡我吩咐她的，她都要遵守。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“从酒的葡萄树所出的一切”，意思是任何源自葡萄树的东西。
    reason: 说明原文较为具体的意象及该短语的全面范围。
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: 葡萄树所出的一切
  rationale: 保留“所出”的动词意象和范围广泛的“一切”，同时用现代汉语自然表达希伯来语“酒之葡萄树”的实际所指。
- source_word: לֹא תֹאכַל / אַל תֹּאכַל
  choice: 她不可吃
  rationale: 以“不可”自然传达禁令语气；主语根据阴性单数动词及上下文明确为“她”。
- source_word: יַיִן
  choice: 葡萄酒
  rationale: 明确指由葡萄酿成的酒，并与本句的葡萄树语境相连。
- source_word: שֵׁכָר
  choice: 烈酒
  rationale: 采用简洁且通行的圣经用语，泛指葡萄酒以外酒性较强的饮品，不将其过窄地限定为啤酒。
- source_word: כָל טֻמְאָה
  choice: 任何不洁之物
  rationale: “不洁”保留律法及礼仪类别的经文语域；“任何……之物”维持原文宽泛而未具体限定的表达。
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ תִּשְׁמֹר
  choice: 凡我吩咐她的，她都要遵守
  rationale: “凡……都……”自然表达全称范围；“遵守”准确体现 שׁמר 在命令语境中的遵行含义。
theological_decisions:
- issue: 葡萄树产品禁令的范围
  choice: 译为“葡萄树所出的一切”，涵盖所有源自葡萄树的东西。
  alternative: 较窄地理解为可供食用的葡萄或葡萄制品。
  rationale: 原文以“从……所出的一切”作全面表述，宜保留其广度；上下文虽与离俗人的限制相呼应，但正文不额外加入后来的技术性称谓。
- issue: טֻמְאָה 的类别含义
  choice: 不洁之物
  alternative: 不纯之物
  rationale: “不洁”更能保存其与律法洁净规范的互文联系，又不把礼仪、饮食或道德层面的具体性质强行限定下来。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不可……也不可……”保持命令的严肃性；末句用“凡……都要遵守”使汉语流畅，同时保留原文的全称范围。
