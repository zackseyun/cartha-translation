  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: zh_hans
  text: 因为，看哪，你已经怀孕，必生一个儿子。不可用剃刀剃他的头，因为这孩子从母腹中起就要作归上帝的拿细耳人；他将开始从非利士人手中拯救[a]以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“解救”。希伯来语动词可按语境译为“拯救”或“解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: 看哪
  rationale: 保留指示语在庄严宣告中唤起注意、加强语气的作用。
- source_word: הָרָה
  choice: 已经怀孕
  rationale: 原文是表示当前状态的谓语形容词，并非“将要怀孕”；“已经怀孕”在现代汉语中清楚自然。
- source_word: וְיֹלַדְתְּ בֵּן
  choice: 必生一个儿子
  rationale: 按报信语境表达将来的确定事件，同时保持简洁庄重。
- source_word: מוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: 不可用剃刀剃他的头
  rationale: 将希伯来语“剃刀不可上他的头”的习语转成自然汉语，并明确保留不得剃发的禁令。
- source_word: נְזִיר אֱלֹהִים
  choice: 归上帝的拿细耳人
  rationale: “拿细耳人”保留专门的奉献身份，“归上帝的”表达原文属格关系，避免泛化为一般的奉献者。
- source_word: מִן הַבָּטֶן
  choice: 从母腹中起
  rationale: 保留“母腹”的明确意象及其所强调的出生前奉献，不弱化为单纯“从出生起”。
- source_word: יָחֵל
  choice: 将开始
  rationale: 明确表达原文“开始”的意义，显示参孙开启拯救而非在此宣告中完成全部拯救。
- source_word: לְהוֹשִׁיעַ
  choice: 拯救
  rationale: 该动词可表示拯救或解救；正文采用常见而庄重的“拯救”，脚注保留语境上可行的替代译法。
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: 从非利士人手中
  rationale: 保留“手”所表达的权势和控制这一希伯来语意象，现代汉语也易于理解。
theological_decisions:
- issue: 参孙奉献身份的性质
  choice: 从母腹中起就要作归上帝的拿细耳人
  alternative: 从出生起就是奉献给上帝的人
  rationale: 原文采用专门术语 נְזִיר，并明确提到母腹；正文保留其特定身份和出生前奉献的重点，不引入额外教义。
- issue: 参孙在拯救以色列之事上的范围
  choice: 他将开始……拯救以色列
  alternative: 他将拯救以色列
  rationale: יָחֵל 明说“开始”，不可省略，否则会夸大其角色并消除叙事中尚未完成的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”和“拿细耳人”保留经文宣告语气及专门术语；其余句式尽量自然，避免仿古表达。脚注标记置于其实际说明的“拯救”之后。
