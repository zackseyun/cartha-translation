source:
  edition: WLC
  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: zh_hans
  text: 玛挪亚向耶和华恳求[a]说：“主啊，求你让你所差来的那位神人[b]再到我们这里来，教导我们该为那将要出生的男孩[c]做什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迫切祈求”。原文动词含有诚恳求告的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“神的人”。这是玛挪亚当时对来者的称呼，并未在这里进一步说明其身份。
    reason: alternative_reading
  - marker: c
    text: 也可译作“将要出生的孩子”；原文用阳性名词，指男孩。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: 恳求
  rationale: 该动词表示迫切、诚恳地向神祈求；“恳求”既保留其强度，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神名音译，保留原文所用的专名，不以“主”这一称号替代。
- source_word: בִּי אֲדֹנָי
  choice: 主啊，求你
  rationale: בִּי在这里是恭敬恳求的语气词，אֲדֹנָי是对神的尊称；合译为“主啊，求你”自然地传达敬畏和请求的语气。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 直译为“神的人”，是指受神差遣之人的固定表达。“神人”保留玛挪亚此刻对来者的称呼，不提前把来者明确解释为天使。
- source_word: אֲשֶׁר שָׁלַחְתָּ
  choice: 你所差来的
  rationale: 准确表达关系从句及差遣含义，也符合自然中文语序。
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: 求你让……再到我们这里来
  rationale: 用“求你让”表达未完成式配合נָא的委婉祈求语气，以“再”对应עוֹד。
- source_word: וְיוֹרֵנוּ
  choice: 教导我们
  rationale: ירה的使役词干在此指给予指示或教导；“教导”清楚表达玛挪亚寻求具体指引。
- source_word: מַה נַּעֲשֶׂה לַנַּעַר
  choice: 我们该为……男孩做什么
  rationale: “该……做什么”保留商议、求问的语气；介词ל在此自然译为“为”，表示关于孩子应采取的做法。
- source_word: הַיּוּלָּד
  choice: 将要出生的
  rationale: 被动分词在语境中前瞻孩子的出生；“将要出生的”简洁保留其未来指向。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名，因此正文保留专名；“耶和华”是现代中文中广为人知的音译，也避免用称号“主”取代原文神名。
- issue: 是否把אִישׁ הָאֱלֹהִים直接解释为天使
  choice: 神人
  alternative: 神的使者；天使
  rationale: 玛挪亚按自己当时的认识称来者为“神人”。保留这一称呼，可维持叙事逐步揭示其身份所产生的张力。
- issue: לַנַּעַר的性别表达
  choice: 男孩
  alternative: 孩子
  rationale: 该名词为阳性，且上下文明确所应许的是男孩；译作“男孩”保留原文的性别信息。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“恳求”“主啊，求你”体现祷告的迫切与敬意；保留传统而简洁的称呼“神人”，并借脚注解释，以兼顾可读性、原文措辞和叙事张力。
