  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: zh_hans
  text: 耶和华的使者对他说：“你为什么问我的名字呢？因为我的名奇妙难测[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可测度”“超乎理解”，也可能译作“隐秘”。希伯来文这个词指非凡奇妙、令人无法完全领会的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ可指“使者”或“天使”；本叙事中的使者具有超自然身份，但中文“使者”既忠实保留词义，也避免仅凭译词预先界定其身份。יְהוָה音译为“耶和华”，保留神的专名。
- source_word: לָמָּה זֶּה
  choice: 为什么……呢
  rationale: 这是带有反问语气的惯用表达；加“呢”使现代汉语自然地呈现其语气。
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: 问我的名字
  rationale: שׁאל与介词ל及“名字”连用，表示询问某人的名字；直译在现代汉语中自然清楚。
- source_word: וְהוּא
  choice: 这个名字
  rationale: 希伯来文代词按语法回指“我的名字”；中文明确补出“这个名字”，避免“它”指代含混。连接词的解释性关系通过后一句自然呈现。
- source_word: פֶלִאי
  choice: 奇妙难测
  rationale: 该词指非凡、奇妙，并可含超乎人所能理解之意。“奇妙难测”兼顾其惊异性与不可测度性，又不将其缩减为单纯的“秘密”。
theological_decisions:
- issue: פֶלִאי可能具有神显或基督论意味
  choice: 按词义译作“奇妙难测”，不在正文中把它处理为正式称号，也不据此断定使者的身份。
  alternative: 译作“奇妙”、 “不可理解”或“隐秘”，或将其作为带有特定神学含义的称号。
  rationale: 原文具有丰富的神学张力，但本节没有明说使者身份的最终解释；译文应保留这种张力，而不导入特定教义结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留反问的直接性，并以“奇妙难测”传达 פֶלִאי 的复合语义；脚注列出主要词义可能。
