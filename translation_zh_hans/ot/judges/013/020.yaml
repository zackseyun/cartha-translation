  to: 火焰从祭坛上向天升起时，耶和华的使者[a]在祭坛的火焰中升上去。玛挪亚和他的妻子正在观看；他们就俯伏在地[b]。
  rationale: 删除原文未明示的“也”，并以“正在观看”保留持续、同时发生的观察。将“玛挪亚和妻子”补足为“玛挪亚和他的妻子”。修订脚注b，使其如实反映原文的倒下动作和脸朝地的姿态，正文意义不变。
