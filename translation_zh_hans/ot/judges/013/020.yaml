  text: וַ/יְהִי֩ בַ/עֲל֨וֹת הַ/לַּ֜הַב מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ הַ/שָּׁמַ֔יְמָ/ה וַ/יַּ֥עַל מַלְאַךְ יְהוָ֖ה בְּ/לַ֣הַב הַ/מִּזְבֵּ֑חַ וּ/מָנ֤וֹחַ וְ/אִשְׁתּ/וֹ֙ רֹאִ֔ים וַ/יִּפְּל֥וּ עַל פְּנֵי/הֶ֖ם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: zh_hans
  text: 火焰从祭坛上向天升起时，耶和华的使者[a]在祭坛的火焰中升上去。玛挪亚和他的妻子正在观看；他们就俯伏在地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华的天使”。希伯来语这个词既可指一般的“使者”，也可指“天使”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“他们就倒下，脸朝地。”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: ……升起时
  rationale: 该结构引出时间背景；译作“……时”符合现代汉语叙事习惯，也保留了动作同时发生的关系。
- source_word: הַלַּהַב
  choice: 火焰
  rationale: לַהַב指火焰或烈焰；“火焰”具体、自然，并与下文重复出现的同一词保持一致。
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: 从祭坛上
  rationale: 保留介词“从……上”的空间关系，清楚表达火焰由祭坛上方升起。
- source_word: הַשָּׁמַיְמָה
  choice: 向天
  rationale: 方向词尾表示朝向天上，而不必断言已经抵达；“向天”简洁保留这一方向意义。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאָךְ本义为受差遣的使者，也可指天使；正文采用较宽泛的“使者”，脚注注明“天使”这一常见译法，不预先裁定其身份。
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: 在祭坛的火焰中
  rationale: 将ב理解为空间性的“在……中”，保留使者在火焰中上升的鲜明画面，同时不解释其具体机制。
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: 玛挪亚和妻子正看着这一切
  rationale: 分词表达持续且同时发生的观看；“正看着”自然传达这一进行状态，“这一切”承接眼前发生的景象。
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה
  choice: 他们就俯伏在地
  rationale: 以自然汉语表达脸朝地倒伏的姿态；脚注保留希伯来语字面的身体意象。
theological_decisions:
- issue: מַלְאַךְ יְהוָה所指对象的身份
  choice: 译作“耶和华的使者”，不在正文中进一步界定其本体身份
  alternative: “耶和华的天使”；或将其解释为神显
  rationale: 希伯来文称该人物为耶和华的מַלְאָךְ，但本节本身并未要求译者判定他只是受造天使，还是神显。采用“使者”并列出“天使”这一译法，可保留原文的词义幅度和神学张力。
- issue: 倒伏动作是否明确表达敬拜
  choice: 译作“俯伏在地”，描述姿态而不明说“敬拜”
  alternative: “向他下拜”
  rationale: 原文直接描述他们脸朝地倒伏，并未在本句使用“敬拜”的动词；译文保留可能包含敬畏或敬拜意味的动作，却不把解释写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“向天升起”“在……火焰中升了上去”保留原文的重复和纵向动态；分号维持观看与随即俯伏之间的紧密叙事联系。
