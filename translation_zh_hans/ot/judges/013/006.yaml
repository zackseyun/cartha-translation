base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: zh_hans
  text: 那妇人来到丈夫那里，对他说：“有一个神人来到我这里；他的相貌如同上帝的使者的相貌，十分可畏。[a]我没有问他从哪里来，他也没有把自己的名字告诉我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十分可畏”也可译作“令人十分敬畏”或“十分可怕”；原文所表达的感受兼有强烈的敬畏与惧怕。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: 定冠词和叙事语境指向前文已经出现的玛挪亚之妻；“那妇人”既保留希伯来文的表达，也符合现代汉语叙事习惯。
- source_word: לְאִישָׁהּ
  choice: 对丈夫
  rationale: אִישׁ 带第三人称阴性单数后缀，在婚姻语境中自然指“她的丈夫”；汉语中省略“她的”更流畅且不会产生歧义。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 一个神人
  rationale: 保留希伯来文常用称谓“神人”，并用“一个”表达此处非特指的首次报告。
- source_word: בָּא אֵלַי
  choice: 到我这里来
  rationale: 直接表达“来到我这里”，自然且没有添加原文以外的信息。
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה מַלְאַךְ הָאֱלֹהִים
  choice: 他的相貌如同上帝使者的相貌
  rationale: 保留 מַרְאֶה 的重复和比较结构。מַלְאַךְ 本义为使者；此处采用“上帝使者”既适合超自然显现的语境，也避免提前断定妇人已完全认出其身份。
- source_word: נוֹרָא מְאֹד
  choice: 十分可畏
  rationale: “可畏”兼含令人敬畏和使人惧怕的意味，能够保存 נוֹרָא 的语义张力；“十分”对应 מְאֹד。
- source_word: אֵי מִזֶּה הוּא
  choice: 他从哪里来
  rationale: 按希伯来习语表达来历或出处，现代汉语自然清楚。
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: 他也没有把自己的名字告诉我
  rationale: 以自然汉语表达“没有向我说明他的名字”；“自己的”明确名字属于来访者。
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים 在后文将来访者称为耶和华使者的叙事语境中如何翻译
  choice: 上帝使者
  alternative: 上帝的天使
  rationale: “使者”保留 מַלְאַךְ 的基本词义与身份上的叙事张力，不把后文的进一步辨认提前带入本节；“上帝”对应带冠词的 הָאֱלֹהִים。
- issue: 妇人是否已经完全认出来访者的身份
  choice: 保留比较句“如同……的相貌”
  alternative: 译作“看起来就是上帝的天使”
  rationale: 原文使用 כְּ（“如同”）明确作比较；不应把相似性静默改写成确定的身份判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神人”作为圣经中的固定称谓予以保留；“上帝使者”较“天使”更贴近原词，并保存本节尚未完全揭示来访者身份的叙事张力。脚注标记放在“十分可畏”之后，与其所解释的词语直接对应。
