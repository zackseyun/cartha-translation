base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: zh_hans
  text: 耶和华的使者向那妇人显现，对她说：“请看，你不能生育，也没有生过孩子；但你将要怀孕，生一个儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ可指“使者”或“天使”；此处采用“使者”，既保留原词的基本含义，也不预先断定其具体身份。神名יהוה按通行中文圣经用法译作“耶和华”。
- source_word: הִנֵּה נָא
  choice: 请看
  rationale: הִנֵּה用于引起注意，נָא带请求或缓和语气；“请看”简洁保留两者，而不把语气强化为惊叹。
- source_word: עֲקָרָה
  choice: 不能生育
  rationale: 表达女性无法生育的状态；现代汉语中比“是个不育的”自然、庄重，也避免贬损语感。
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: 但你将要怀孕，生一个儿子
  rationale: 准确表达两个连续的将来事件。首个וְ字面为连接词，但此处与先前不能生育的状况构成明显转折，汉语用“但”更自然。
theological_decisions:
- issue: “耶和华的使者”的身份
  choice: 保持“耶和华的使者”这一称谓
  alternative: 译作“耶和华的天使”或直接认定为耶和华本人
  rationale: 原文在此只给出מַלְאַךְ יְהוָה这一称谓；译文不提前消除叙事中关于使者身份的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那妇人”承接上下文中的特定人物；“显现”保留叙事和神显语境的正式色彩。
