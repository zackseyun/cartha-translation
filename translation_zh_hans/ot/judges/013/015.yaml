base_translation:
  language: en
  yaml_path: translation/ot/judges/013/015.yaml
  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: zh_hans
  text: 玛挪亚对耶和华的使者说：“请你暂且留下，我们好为你预备一只山羊羔。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: 请容我们留你片刻
  rationale: 动词עצר在此指挽留、使对方暂不离开；加入“片刻”自然表达暂留之意，但不暗示强行扣留。נָא译为礼貌请求“请容”。
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: 好为你预备
  rationale: עשה结合食物宾语可自然译作“预备”；לְפָנֶיךָ字面为“在你面前”，语境上表示为使者预备，译作“为你”符合现代汉语。
- source_word: גְּדִי עִזִּים
  choice: 一只山羊羔
  rationale: 该词组指幼山羊；“山羊羔”准确区别于绵羊羔，并保持简洁。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: 保留属格结构及传统通行的神名译法，不在本节额外判定这位使者的本体身份。
theological_decisions:
- issue: “耶和华的使者”的身份
  choice: 按原文译作“耶和华的使者”
  alternative: 将其解释性译为耶和华自身或普通天使
  rationale: 原文称谓具有叙事和神学张力，本节不应以解释性措辞预先消解。
- issue: 为使者预备山羊羔的用途
  choice: 仅译为“为你预备”
  alternative: 明确译作供他食用或献为祭物
  rationale: 本节本身尚未明确玛挪亚所设想的是款待还是献祭，后文才推进这一张力，因此不补入“吃”或“献祭”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“请容我们留你片刻”比“扣留你”更符合款待语境，也保留请求对方暂缓离开的含义；全节不用脚注。
