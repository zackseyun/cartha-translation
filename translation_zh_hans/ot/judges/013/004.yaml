  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: zh_hans
  text: 现在请你谨慎[a]，不要喝葡萄酒和烈酒[b]，也不要吃任何不洁之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要留心”或“你要警醒自己”。
    reason: lexical_alternative
  - marker: b
    text: “烈酒”泛指葡萄酒以外能使人醉的酒类，并非专指现代意义上的蒸馏酒。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是引出下文吩咐的时间兼话语标记；“现在”符合现代汉语表达，“而现在”在此略显生硬。
- source_word: הִשָּׁמְרִי נָא
  choice: 请你谨慎
  rationale: Nifal祈使式在这里带有自我警醒、留心防范之意；“请”体现语气词נָא的恳请色彩，而“谨慎”保留其较宽泛的含义。
- source_word: וְאַל תִּשְׁתִּי
  choice: 不要喝
  rationale: 这是对女子说的否定命令；现代汉语用“不要喝”自然、明确。
- source_word: יַיִן
  choice: 葡萄酒
  rationale: 准确指由葡萄酿成的酒，也便于与后面的שֵׁכָר区分。
- source_word: וְשֵׁכָר
  choice: 或烈酒
  rationale: שֵׁכָר泛指葡萄酒以外能使人醉的酒类；正文用现代读者易懂的“烈酒”，脚注说明其范围并不只按现代蒸馏酒定义。连词在汉语并列禁令中自然译作“或”。
- source_word: וְאַל תֹּאכְלִי
  choice: 也不要吃
  rationale: 第二项禁令与前项并列；“也不要”既体现连接关系，又符合自然汉语。
- source_word: כָּל טָמֵא
  choice: 任何不洁之物
  rationale: כָּל与名词化形容词טָמֵא表示任何被视为不洁的东西；“不洁”保留律法及礼仪范畴，不将其缩减为卫生或道德意义。
theological_decisions:
- issue: 本节中טָמֵא的性质
  choice: 不洁
  alternative: 污秽；不净
  rationale: 上下文与拿细耳人相关的吩咐以及《律法书》的洁净类别有关。“不洁”能保留礼仪和盟约语境，又不把含义误解为单纯肮脏、不卫生或道德败坏。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“请你谨慎”保留原文恳请式命令的语气；两个禁令以“不要……也不要……”衔接，使原文结构在汉语中自然清楚。正文的所有脚注标记均已对应列出。
