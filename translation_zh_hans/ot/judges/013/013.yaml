source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר מַלְאַ֥ךְ יְהוָ֖ה אֶל מָנ֑וֹחַ מִ/כֹּ֛ל אֲשֶׁר אָמַ֥רְתִּי אֶל הָ/אִשָּׁ֖ה תִּשָּׁמֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: zh_hans
  text: 雅威的使者[a]对玛挪亚说：“凡我对那妇人所说的，她都要谨守。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“天使”；希伯来语 מַלְאַךְ 可指一般的使者，也可指天上的使者。
    reason: 保留 מַלְאַךְ 的词义范围及本段中的身份张力。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以汉语叙事中自然的动词承接上文；无需机械译出连接词 וַ。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאַךְ 的基本意思是受差遣的“使者”，在本段语境中指天上的使者；采用“使者”可保留词义范围，并以脚注说明也常译作“天使”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质。
- source_word: אֶל מָנוֹחַ
  choice: 对玛挪亚
  rationale: 准确表达说话对象，符合现代汉语表达习惯。
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: 凡我对那妇人所说的
  rationale: 用“凡……都……”自然表达 מִכֹּל 的周全范围，同时保留原文明确的“那妇人”，不改成“你的妻子”。
- source_word: תִּשָּׁמֵר
  choice: 都要谨守
  rationale: 该词为 שׁמר 的未完成式尼法勒形式，在此表示谨慎留意并遵守先前的禁戒。“谨守”既适合上下文，也避免增添原文没有明说的具体行动。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地音译该专名，而不以“主”这一称号替代。
- issue: מַלְאַךְ יְהוָה 的身份与称谓
  choice: 雅威的使者
  alternative: 雅威的天使
  rationale: מַלְאַךְ 本身可指一般使者，也可指天上的使者。本段语境明显指超自然的来使，但正文采用较宽的“使者”，脚注交代“天使”译法，以保留原词的词义张力。
- issue: תִּשָּׁמֵר 所表达的义务
  choice: 都要谨守
  alternative: 都要小心遵行
  rationale: 原文强调她对已吩咐事项的警醒持守；“谨守”保留其反身、警戒色彩，也不把含义局限为积极“施行”，因为上下文主要包括饮食与洁净方面的禁戒。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“凡……都……”简洁表达全面范围；“那妇人”忠实保留原文称谓；“谨守”适合诫命语境，同时避免过度解释。
