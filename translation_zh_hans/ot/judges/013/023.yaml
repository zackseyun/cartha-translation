base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: zh_hans
  text: 他的妻子对他说：“耶和华若有意杀死我们，就不会从我们手中接受燔祭和素祭，也不会让我们看见这一切，也不会在此刻把这样的事告诉我们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: 有意
  rationale: 表达此处‘愿意、意欲’之义，并保留假设语气，不将其强化为已经作出的决定。
- source_word: לָקַח מִיָּדֵנוּ
  choice: 从我们手中接受
  rationale: 按献祭语境译出‘取纳、悦纳’的含义，同时保留原文‘从我们手中’的具体表达。
- source_word: עֹלָה וּמִנְחָה
  choice: 燔祭和素祭
  rationale: 采用现代中文圣经读者熟悉的祭祀术语；מִנְחָה在此与燔祭并列，指献上的素祭。
- source_word: הֶרְאָנוּ
  choice: 让我们看见
  rationale: 直接体现使役意义，即耶和华使他们看见所发生的一切。
- source_word: הִשְׁמִיעָנוּ
  choice: 告诉我们
  rationale: 原义为‘使我们听见’，在本语境自然指宣告或告知；用‘告诉’符合妻子所指向的应许信息。
- source_word: כָעֵת
  choice: 在此刻
  rationale: 保留原文的时间强调，指就在当前这时候。
- source_word: כָזֹאת
  choice: 这样的事
  rationale: 保留指示表达的概括性，可指刚才听见的宣告内容，不额外具体化。
theological_decisions:
- issue: 神接受祭物与赐下启示是否被表述为绝对教义命题
  choice: 保留妻子在叙事中的条件推论
  alternative: 改写为作者直接宣告神绝不会杀他们
  rationale: 原文是妻子对玛挪亚的劝解和推理；译文不把人物言语提升为脱离语境的普遍教义公式。
- issue: יהוה的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 采用简体中文圣经传统中广为人知的专名形式，明确对应以色列神的圣名，且不增添宗派性解释。
translation_notes:
  register: 语言庄重而自然，保留三项并列反证：接受祭物、显明这一切、此刻告知这样的事。用“更不会”体现末项递进，但不改变原文论证结构。
