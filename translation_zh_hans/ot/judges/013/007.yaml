  text: וַ/יֹּ֣אמֶר לִ֔/י הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/עַתָּ֞ה אַל תִּשְׁתִּ֣י יַ֣יִן וְ/שֵׁכָ֗ר וְ/אַל תֹּֽאכְלִי֙ כָּל טֻמְאָ֔ה כִּֽי נְזִ֤יר אֱלֹהִים֙ יִהְיֶ֣ה הַ/נַּ֔עַר מִן הַ/בֶּ֖טֶן עַד י֥וֹם מוֹתֽ/וֹ־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: zh_hans
  text: 他对我说[a]：‘看哪，你将怀孕，生一个儿子。现在你不可喝葡萄酒或浓酒，也不可吃任何不洁之物，因为这孩子从母腹里直到死的那一天，都要作归上帝的拿细耳人[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文较直译可作：“看哪，你怀孕了，并将生一个儿子。”按上下文，这句话也可理解为预告：“你将怀孕，生一个儿子。”
    reason: 保留 הִנָּךְ הָרָה 在形式上的现在状态含义与语境中的预告含义。
  - marker: b
    text: “拿细耳人”是专门称谓，指特别分别出来归给上帝的人；希伯来文也可直译为“上帝的拿细耳人”。
    reason: 说明 נְזִיר אֱלֹהִים 的技术性含义及所属关系的另一种译法。
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: 他对我说
  rationale: 直接表达动词及其间接宾语；句首 וַ 在叙事中承接上文，不额外加入原文没有的因果词。
- source_word: הִנָּךְ הָרָה
  choice: 看哪，你将怀孕
  rationale: הִנֵּה 译为庄重而仍通行的“看哪”；הָרָה 字面可指“怀孕”，结合报信语境采用将来表达，同时以脚注保留其形式上的歧义。
- source_word: וְיֹלַדְתְּ בֵּן
  choice: 生一个儿子
  rationale: 自然、简洁地表达 ילד 与其宾语 בֵּן，并保留孩子的男性身份。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 自然地从预告转入随后的吩咐，无须添加更强的逻辑关系。
- source_word: אַל תִּשְׁתִּי יַיִן וְשֵׁכָר
  choice: 不可喝葡萄酒或浓酒
  rationale: יַיִן 明确译为“葡萄酒”；שֵׁכָר 指葡萄酒以外能使人醉的酒类，“浓酒”保留传统术语，又避免用“烈酒”暗示现代蒸馏酒。
- source_word: וְאַל תֹּאכְלִי כָּל טֻמְאָה
  choice: 也不可吃任何不洁之物
  rationale: 将抽象名词 טֻמְאָה 按饮食禁令的语境自然表达为“不洁之物”，不擅自限定具体食物。
- source_word: נְזִיר אֱלֹהִים
  choice: 归上帝的拿细耳人
  rationale: 以“拿细耳人”保留 נָזִיר 的专门身份，以“归上帝的”表达其奉献归属，不将其泛化为一般的圣洁之人。
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: 出生预告语境中“孩子”比“少年”自然；“这”清楚指向刚才所说的儿子。
- source_word: מִן הַבֶּטֶן
  choice: 从母腹里
  rationale: 保留希伯来文“从腹中”的身体意象和时间起点，比“从出生起”更贴近原文。
- source_word: עַד יוֹם מוֹתוֹ
  choice: 直到死的那一天
  rationale: 直接保留原文的时间表达，不简化为“一生”。
theological_decisions:
- issue: 拿细耳身份的表达
  choice: 归上帝的拿细耳人
  alternative: 献给上帝的人／上帝的拿细耳人
  rationale: נְזִיר 是具有律法与奉献背景的专门称谓，应保留术语；“归上帝的”既表达 אֱלֹהִים 所指的归属或奉献关系，也不把它解释成更宽泛的圣洁观念。
- issue: 怀孕宣告的时间指向
  choice: 你将怀孕，生一个儿子
  alternative: 你已经怀孕，将要生一个儿子
  rationale: הָרָה 的形式可按当前状态理解，但本章报信的叙事语境支持预告意义。正文采用自然的将来表达，脚注保留较字面的现在状态读法，避免消除原文张力。
- issue: 奉献期限
  choice: 从母腹里直到死的那一天
  alternative: 终身
  rationale: 保留原文明确的起点和终点，表明其拿细耳身份并非仅从成年或自愿起誓时开始。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留报信话语的郑重语气；“不可”适合禁令语体；“浓酒”避免现代蒸馏酒的时代错置。脚注标记均放在正文对应词句之后。
