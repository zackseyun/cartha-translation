  text: וַ/יֹּ֣אמֶר מָנ֔וֹחַ עַתָּ֖ה יָבֹ֣א דְבָרֶ֑י/ךָ מַה יִּֽהְיֶ֥ה מִשְׁפַּט הַ/נַּ֖עַר וּ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: zh_hans
  text: 玛挪亚说：“现在，愿你的话实现。[a]那男孩该遵守什么规矩，又该做什么呢？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的话实现时。”这句希伯来文既可理解为祈愿，也可理解为时间性的前提。
    reason: alternative_reading
  - marker: b
    text: “又该做什么”直译为“以及他的作为（或工作）”。“规矩”也可译为“规定”“惯例”或“生活方式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出叙事连接词וַ，以符合现代汉语叙事习惯；上下文已自然体现事件推进。
- source_word: מָנוֹחַ
  choice: 玛挪亚
  rationale: 采用中文圣经人名的通行音译。
- source_word: עַתָּה
  choice: 现在
  rationale: 保留说话人当下的期待语气，简明自然。
- source_word: יָבֹא דְבָרֶיךָ
  choice: 愿你的话实现
  rationale: 希伯来文直译近于“愿你的话来到”，这里指所宣告之事成为事实；“实现”自然地传达这一习语，同时脚注保留时态性理解。
- source_word: מַה יִּהְיֶה מִשְׁפַּט הַנַּעַר
  choice: 这孩子当遵守什么规矩
  rationale: מִשְׁפַּט在此可指规定、惯例或生活规范。“当遵守什么规矩”在现代汉语中清楚表达适用于孩子的规定，又避免将其窄化为司法判决。
- source_word: הַנַּעַר
  choice: 这孩子
  rationale: 所指男孩尚未出生；“孩子”在本语境自然，指示词“这”承接前文所预告的孩子。
- source_word: וּמַעֲשֵׂהוּ
  choice: 又当做什么
  rationale: 原文直译为“和他的作为／工作”。疑问语境中译作“又当做什么”较自然，也保留其可指行为、任务或职分的宽度；直译另见脚注。
theological_decisions:
- issue: יָבֹא דְבָרֶיךָ的语气
  choice: 正文按祈愿理解：“愿你的话实现”
  alternative: 按时间或条件理解：“你的话实现时”
  rationale: 无元音形式及语境容许祈愿和时间性两种听法；正文采用直接的祈愿读法，脚注明确保留另一可能，避免消除原文歧义。
- issue: מִשְׁפַּט与מַעֲשֵׂהוּ所问的范围
  choice: 理解为孩子应遵守的规范及应做之事
  alternative: 可理解为孩子的生活方式及其工作、使命或行为
  rationale: 原文措辞宽泛，并未明确限定为拿细耳人的条例、职业或使命，因此译文不作教派性或过度具体化解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。正文以自然问句表达原文两个并列的询问重点；通过脚注保留祈愿／时间从句的歧义，以及מִשְׁפַּט和מַעֲשֶׂה的语义宽度。
