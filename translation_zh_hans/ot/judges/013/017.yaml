base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: zh_hans
  text: 玛挪亚对雅威的使者[a]说：“你叫什么名字？等你的话应验时，我们好尊敬你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的天使”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאַךְ既可指一般的“使者”，也可指超自然的“天使”。本段叙事将这位来者呈现为超自然存在，但中文“使者”也能保留原词的语义宽度；以脚注说明“天使”这一可能译法。יהוה按神圣名号音译为“雅威”。
- source_word: מִי שְׁמֶךָ
  choice: 你叫什么名字
  rationale: 这是询问对方姓名的希伯来语惯用表达；译为现代汉语自然、直接的问法。
- source_word: כִּי יָבֹא דְבָרֶיךָ
  choice: 等你的话应验时
  rationale: יָבֹא与“话”连用，表示所宣告的事实现；“应验”准确传达这一语境。כִּי在此衔接预期事件及其后的回应，译作“等……时”符合自然汉语。
- source_word: וְכִבַּדְנוּךָ
  choice: 我们好尊敬你
  rationale: כבד的加强词干在此意为给予尊重或尊荣。“尊敬”通俗而庄重，又避免“荣耀”可能带入原文未必要求的更强神学含义；“好”体现目的或预期回应。
theological_decisions:
- issue: 神圣名号יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质。
- issue: מַלְאַךְ在本段中的身份表达
  choice: 使者
  alternative: 天使
  rationale: 该词本义是受差遣的“使者”，也常指超自然的天使。本段具有超自然语境，但本节本身使用的词仍保有两义，因此正文采用“使者”，脚注列出“天使”，不替读者完全消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“等……时，我们好……”自然表达事件应验后给予尊敬的意图；不使用过度古雅的句式，也不把“尊敬”强化为带有特定敬拜含义的“荣耀”。
