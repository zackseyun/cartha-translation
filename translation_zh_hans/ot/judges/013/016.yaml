  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: zh_hans
  text: 雅威的使者对玛挪亚说：“如果你挽留我，我也不吃你的食物[a]；但如果你预备燔祭，就要把它献给雅威[b]。”原来玛挪亚不知道他是雅威的使者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你的饼”；这里的“饼”很可能泛指食物或一餐。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“如果你做燔祭，就要把它献给雅威。”原文先用一个动词表示制作或预备祭物，再用另一个动词表示把祭物献上。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאַךְ既可指普通“使者”，也可指超自然的“天使”；本叙事表明这位来客是超自然使者，但采用“使者”可保留原词的称谓方式及一定张力。יהוה按其专名音译为“雅威”。
- source_word: תַּעְצְרֵנִי
  choice: 你留我
  rationale: עצר在此指挽留、使来客留下；“留我”符合玛挪亚请来客等候备餐的语境，也保持简洁。
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: 我也不会吃你的食物
  rationale: לֶחֶם字面是“饼”，也常泛指食物或一餐；此处按语境译为“食物”，字面义收入脚注。
- source_word: תַּעֲשֶׂה עֹלָה
  choice: 你预备燔祭
  rationale: עשה与祭物连用可指制作或预备；译为“预备”可与下一个明确表示献上的动词区分。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是该献祭术语在现代中文圣经语体中的通行译法，指整只焚烧、烟气上升的祭物。
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: 就要把它献给雅威
  rationale: עלה的使役形在燔祭语境中表示把祭物献上；“把它献给”自然表达宾语后缀及献祭动作。
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: 原来玛挪亚不知道
  rationale: כִּי在此引出叙述者的解释；“原来”自然衔接前文并说明玛挪亚为何仍把来客当作普通人。
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: 他是雅威的使者
  rationale: 保留הוּא所指的男性来客，并直接表达玛挪亚尚未认出其身份。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常见形式音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也明确保留专名，避免改译为“主”这一称号。
- issue: מַלְאַךְ的身份称谓
  choice: 使者
  alternative: 天使
  rationale: 上下文确实将来客描写为超自然存在，但希伯来词本义是“使者”。译作“使者”既符合“雅威的使者”这一固定表达，也不在本节之外进一步界定其本体身份。
- issue: 第一个אִם的语气
  choice: 即使
  alternative: 如果
  rationale: 在玛挪亚已经请求来客留下备餐的语境中，此句具有让步意味：“即使你留我，我也不吃。”该译法不改变条件结构的实际逻辑。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“玛挪亚”“燔祭”沿用读者熟悉的中文圣经专名与祭祀术语；句式避免古奥，同时保留原文条件句、两个献祭动词之间的区别，以及“使者”一词的语义张力。
