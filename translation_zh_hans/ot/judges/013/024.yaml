  rationale: 仅作低风险的中文语域与指称清晰度调整。“那妇人”保留希伯来文定冠词所指的既有角色，避免“那女人”的生硬感；“那孩子”清楚回指前句的儿子。其余表达忠实且自然，予以保留。
