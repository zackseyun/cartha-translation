base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: zh_hans
  text: 那妇人生了一个儿子，给他起名叫参孙。那孩子渐渐长大，雅威赐福给他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 生了
  rationale: 该词是 ילד 的 Qal 叙事过去式，表示生育；“生了”简洁自然，符合现代汉语叙事。
- source_word: הָאִשָּׁה
  choice: 那女人
  rationale: 希伯来文明确作“那女人”，回指玛挪亚的妻子；保留原文措辞，不在本节中补入“他的妻子”。
- source_word: בֵּן
  choice: 一个儿子
  rationale: 在生育语境中，בן 指男性子嗣；“一个儿子”是自然准确的汉语表达。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: 给他起名叫
  rationale: 原文直译为“称他的名”，现代汉语以“给他起名叫”自然传达希伯来文命名公式。
- source_word: שִׁמְשׁוֹן
  choice: 参孙
  rationale: 采用该人名在中文圣经传统中通行且易识别的译名。
- source_word: וַיִּגְדַּל
  choice: 渐渐长大
  rationale: גדל 在此描述孩子的成长；“渐渐长大”符合上下文，也自然表达希伯来叙事动词所概括的成长过程。
- source_word: הַנַּעַר
  choice: 孩子
  rationale: נער 的年龄范围较广；本节紧接出生叙事，“孩子”既符合语境，也不把年龄限定得过窄。
- source_word: וַיְבָרְכֵהוּ
  choice: 赐福给他
  rationale: ברך 是“赐福、祝福”的标准用词；主语为神时，“赐福给他”在现代汉语中自然，并保留其神学含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用神的专名四字神名；“雅威”按其常见学术重构音译，保留专名性质，不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列之神的专名。译作“雅威”旨在保留其专名性质及与希伯来语读音重构的联系；不译作“主”，以免将名字改成称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“那女人”保留原文回指方式；用“给他起名叫”和“渐渐长大”使中文自然流畅，同时忠实呈现原文的命名与成长叙事。
