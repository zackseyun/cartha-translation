base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: zh_hans
  text: 有一个人来自琐拉，出自但支派的一个宗族，名叫玛挪亚。他的妻子不能生育，也没有生过孩子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也没有生育过。”希伯来文直译是“她没有生过”。
    reason: 原文没有明说所生对象，因此保留较贴近字面的译法供读者参考。
lexical_decisions:
- source_word: וַיְהִי
  choice: 有一个人
  rationale: 此处用叙事性的存在句引入新人物；现代汉语无需另加并非原文明示的“那时”或“从前”。
- source_word: אִישׁ אֶחָד
  choice: 一个人
  rationale: אֶחָד使人物具体化，但汉语用“一个人”已能自然表达，不必生硬译成“某一个人”。
- source_word: מִצָּרְעָה
  choice: 来自琐拉
  rationale: 介词מִן表示来源；“来自”清楚保留这一含义，地名采用通行译名“琐拉”。
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: 属但支派的一个宗族
  rationale: מִשְׁפָּחָה在此指支派内部的亲族群体，译作“宗族”比“支派”层级更准确；“但支派”自然表达הַדָּנִי的族属。
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: 名叫玛挪亚
  rationale: 用自然的现代汉语表达希伯来文命名句式，并采用通行人名译法。
- source_word: עֲקָרָה
  choice: 不能生育
  rationale: 准确表达女性不育的状态，比“荒芜”式直译自然，也比带较强医学色彩的“不孕症”更适合叙事语体。
- source_word: וְלֹא יָלָדָה
  choice: 也没有生过孩子
  rationale: ילד以女性为主语时指生产、生育；补出汉语所需的“孩子”使句意自然，同时用脚注保留原文未明说宾语这一特点。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文连续说明妻子不能生育且未曾生产的强调；脚注标记置于其实际所说明的分句之后。
