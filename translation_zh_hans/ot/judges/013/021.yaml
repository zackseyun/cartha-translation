source:
  edition: WLC
  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: zh_hans
  text: 雅威的天使[a]不再向玛挪亚和他的妻子显现。那时，玛挪亚才知道他是雅威的天使。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”；希伯来语מַלְאַךְ可指一般的使者，也可指天使。在本段语境中，这是一位超自然的人物。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף עוֹד
  choice: 不再
  rationale: יָסַף与不定式连用，并有עוֹד加强，表示此后不再继续或再次发生；“不再”简洁自然。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: מַלְאַךְ本义可指“使者”，也可指超自然的“天使”；本段叙事明确呈现超自然人物，因此正文译作“天使”，并以脚注保留词义上的另一可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留原文中的专名性质。
- source_word: לְהֵרָאֹה
  choice: 显现
  rationale: ראה的Nifal形式在此表示“出现、被看见”；“显现”既符合超自然叙事情境，也保持庄重自然。
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: 向玛挪亚和他的妻子
  rationale: 用“向”自然表达重复介词אֶל所标示的显现对象，无须在汉语中机械重复介词。
- source_word: אָז
  choice: 那时
  rationale: 标明玛挪亚的认识是在这一事件之后形成的，符合叙事次序。
- source_word: יָדַע
  choice: 才知道
  rationale: יָדַע在语境中表示认出或确认；加入“才”自然体现到此时方才明白的结果关系。
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: 他是雅威的天使
  rationale: הוּא为阳性单数，回指此前出现的那一位；用“他”保留人格指称，不进一步界定其身份。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；译作“雅威”保留其专名性质，避免以称号代替。
- issue: מַלְאַךְ יְהוָה的身份表述
  choice: 雅威的天使
  alternative: 雅威的使者
  rationale: 上下文表明这是一位超自然人物，故正文采用“天使”；脚注保留מַלְאַךְ也可泛指“使者”的词义，不把该人物进一步等同于某一特定神学身份。
- issue: 人物与雅威之间的关系
  choice: 仅译作“他是雅威的天使”
  alternative: 将其解释为雅威本身或某一特定神圣位格
  rationale: 本节的措辞既辨认这位人物为“雅威的天使”，又未在此明确解释其本体身份；译文保留这一张力，不作超出原文的判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不再……显现”流畅表达希伯来语的停止惯用结构；“才知道”体现事件之后的确认。人名按常见圣经汉语形式译作“玛挪亚”，神名译作“雅威”。
