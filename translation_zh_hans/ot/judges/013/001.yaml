  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: zh_hans
  text: 以色列人[a]又做了在雅威眼中看为恶的事，雅威就把他们交在非利士人手中[b]四十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”：希伯来文直译为“以色列的众子”，是对以色列全体人民的集体称谓。
    reason: lexical_alternative
  - marker: b
    text: “交在非利士人手中”：这是表示交由对方掌控、落入对方权势之下的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: 又行
  rationale: יסף接不定式可表示再次或继续；士师记的循环叙事在此强调以色列重犯先前的恶行，因此译作“又行”，简洁自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在这里是指以色列全体人民的集体称谓；现代汉语用“以色列人”最自然，并以脚注保留其字面形式。
- source_word: לַעֲשׂוֹת הָרַע
  choice: 行……看为恶的事
  rationale: 这是士师记中常见的表达，指做在雅威评判中为恶的事；“行……恶的事”符合庄重、通顺的现代汉语。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来文“在……眼中”的评判性意象，同时用汉语“眼中看为”清楚表达这是雅威的判断。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: וַיִּתְּנֵם
  choice: 就把他们交在
  rationale: נתן与“在……手中”连用，表示将人置于另一方权势之下；“交在”既贴近原文，也符合汉语习惯。
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: 非利士人手中
  rationale: 保留原文单数“手”的权势意象；汉语“落在／交在某人手中”同样可自然表示受其控制。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经传统中通行的族名译法。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 直接表达原文的持续时长；汉语在此无需另加介词。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列之神的专名；“雅威”较贴近学界通常重构的读音，并避免把专名替换为“主”这一称号。
- issue: בְּנֵי יִשְׂרָאֵל 的集体范围
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该阳性复数亲属称谓在语境中指整个以色列民族，并非仅指男性；正文采用自然的集体称谓，脚注注明字面形式，以免缩窄所指。
- issue: “交在非利士人手中”的含义
  choice: 保留“手中”的意象
  alternative: 使他们受非利士人辖制
  rationale: 原文以“手”表达权势和控制。汉语中这一意象同样清楚，因此正文予以保留，不进一步限定受制的具体形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又……就……”呈现希伯来叙事的推进；保留“雅威眼中”和“手中”两处原文意象，同时用脚注说明可能不够直观的希伯来表达。
