base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: zh_hans
  text: 雅威的灵开始在玛哈尼但[b]催动他[a]；那里位于琐拉和以实陶之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “催动”也可译作“推动”或“驱动”。
    reason: lexical_alternative
  - marker: b
    text: “玛哈尼但”意为“但的营地”；这里作为地名使用。
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּחֶל
  choice: 开始
  rationale: 该词在这里是使役词干的叙事形式，表达某一行动的开始；“开始”自然地保留了起始意义。
- source_word: רוּחַ יְהוָה
  choice: 雅威的灵
  rationale: 在士师记参孙叙事的语境中，这一短语指雅威施行能力的灵，而非自然界的风；“灵”既符合上下文，也不额外加入后期神学阐释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的汉语音译呈现四字神名，保留原文使用上帝专名的特点。
- source_word: לְפַעֲמוֹ
  choice: 催动他
  rationale: פעם 在此可表示驱动、激发或搅动；“催动他”兼顾内在推动与行动驱使，不把这种作用限定为情绪上的不安。
- source_word: בְּמַחֲנֵה דָן
  choice: 在玛哈尼但
  rationale: 该词组字面义为“但的营地”，但此处作为地名使用，因此采用音译，并以脚注说明名称含义。
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: 在琐拉和以实陶之间
  rationale: 直接表达两个地点之间的地理位置，并采用现代中文圣经地名的通行音译。
theological_decisions:
- issue: רוּחַ יְהוָה 在本节中的性质
  choice: 雅威施行能力的灵
  alternative: 雅威的风；雅威的气息
  rationale: 参孙叙事把这一短语与他受神力推动联系起来，因此译作“灵”；同时不在译文中加入人格、内住方式等原文未明说的细节。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，也避免以称号替代名字。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那时他在”使希伯来语地点短语与中文句法顺畅衔接；分号避免连续使用“在”造成生硬，同时不改变原文事件与地点的关系。
