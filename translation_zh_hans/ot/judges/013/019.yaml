revisions:
- from: 玛挪亚就取来一只山羊羔和素祭，在磐石上献给耶和华。他行了一件奇妙的事[a]，当时玛挪亚和妻子都在观看。
  to: 玛挪亚就取了一只小山羊和素祭，把它们在磐石上献给耶和华。这时，有奇妙的事发生[a]，玛挪亚和妻子都在观看。
  rationale: 修订主要解决汉语代词“他”的错误回指风险。非人称正文是对原文压缩、未重述主语的安全处理，脚注则保留原文主动式及上下文指向。另将“山羊羔”调整为更自然的“小山羊”，其余祭祀术语与叙事语域维持不变。
