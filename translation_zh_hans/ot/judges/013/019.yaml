  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: zh_hans
  text: 玛挪亚就取了一只小山羊和素祭，把它们在磐石上献给耶和华。这时，有奇妙的事发生[a]，玛挪亚和妻子都在观看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他行了一件奇妙的事”。希伯来文此处语句简略，没有再次明说主语；上下文显示，行这事的很可能是耶和华的使者。
    reason: 原文使用主动的“行奇妙事”表达，却省略行为者。正文以自然的非人称表达避免把“他”误指为玛挪亚；脚注保留主动式的另一种可行译法，并说明上下文所指。
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: 一只山羊羔
  rationale: 这是现代汉语对幼山羊自然、明确的表达，也保留了祭牲的含义。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 在献祭语境中，מִנְחָה指与祭牲一同献上的谷物祭物；“素祭”是简洁而通行的圣经用语。
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: 在磐石上献给耶和华
  rationale: עלה在献祭语境中有“献上”之意；译文自然涵盖前述山羊羔和素祭，同时保留献祭地点与对象。
- source_word: לַיהוָה
  choice: 给耶和华
  rationale: 以“耶和华”表达神名יהוה，符合现代中文圣经读者熟悉的称呼，并区别于普通称号“主”。
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: 他行了一件奇妙的事
  rationale: 保留原文阳性单数行为者及“行奇妙之事”的语义，同时不在正文中补出原文没有明说的主语身份。
- source_word: רֹאִים
  choice: 都在观看
  rationale: 分词表示持续进行的观看；“都在观看”自然传达玛挪亚夫妇当时亲眼注视的状态。
theological_decisions:
- issue: וּמַפְלִא לַעֲשׂוֹת的隐含主语
  choice: 正文译作“他”，不明确补出身份
  alternative: 译作“耶和华的使者行了一件奇妙的事”，或采用非人称表达“有一件奇妙的事发生了”
  rationale: 希伯来文此处省略了明确主语；上下文强烈指向耶和华的使者，但本节没有重述其身份。正文保留“他”的指代，并以脚注说明，可兼顾上下文与原文的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“磐石”“素祭”保留必要的圣经祭祀语域；句式分为两句，以免连续多个“和”造成指代不清。脚注标记[a]置于相关歧义语句之后。
