base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: zh_hans
  text: 妇人急忙跑去，告诉丈夫说：“你看，前些日子[a]来我这里的那个人，又向我显现了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在那日”，指先前来访的那一次；也可译作“那天”。
    reason: 说明原文时间表达的字面形式及其在语境中回指先前来访的含义。
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּרָץ
  choice: 急忙跑去
  rationale: 分别保留“赶紧”和“奔跑”的语义，以简洁自然的现代汉语表现妇人的急切行动。
- source_word: וַתַּגֵּד לְאִישָׁהּ
  choice: 告诉丈夫
  rationale: נגד 的使役形在此意为“告诉、报告”；אִישׁ 加第三人称阴性单数后缀在家庭语境中自然指“她的丈夫”。
- source_word: הִנֵּה
  choice: 你看
  rationale: 这是引起听者注意的指示语。“你看”既保留现场感，也比“看哪”更符合现代口语叙事。
- source_word: נִרְאָה אֵלַי
  choice: 又向我显现了
  rationale: ראה 的尼法勒形在此表示“显现”。“又”依据该男子先前已经向她显现的语境，使中文指代关系自然，但不改变人物身份。
- source_word: הָאִישׁ
  choice: 那个人
  rationale: 妇人仍以“人”称呼这位来者；译文不提前采用上下文中的“耶和华的使者”，以保留她在本句中的叙述视角。
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: 那天来见我的
  rationale: 原文近似直译为“在那日来到我这里的”，回指先前那次来访；“那天来见我的”是自然且准确的现代汉语。
theological_decisions:
- issue: 妇人口中 הָאִישׁ 的身份
  choice: 那个人
  alternative: 那位使者／上帝的使者
  rationale: 虽然上下文把来者认定为耶和华的使者，本节妇人只称他为“那人”。译文保留本句视角，不把后文或叙事者提供的完整身份提前带入她的话。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文连续动作所表现的急切，也保留妇人称来者为“人”的叙述视角。
