  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: zh_hans
  text: 玛挪亚对妻子说：“我们必死无疑，因为我们看见了上帝[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神明”或“神圣的存在者”。希伯来语“以罗欣”（אֱלֹהִים）在某些语境中可较广泛地指神性存在者，但这里的上下文更支持译作“上帝”。
    reason: 保留 אֱלֹהִים 的词义范围及本段有关耶和华使者身份的叙事张力。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是叙事中常见的连续式表达；现代汉语通常不必机械译出连接词，直接用“说”即可自然承接上文。
- source_word: מָנוֹחַ
  choice: 玛挪亚
  rationale: 按通行中文圣经人名音译处理。
- source_word: אֶל אִשְׁתּוֹ
  choice: 对妻子
  rationale: 原文指他的妻子；现代汉语在主语已经明确时省略“他的”更为自然，也不损失所指。
- source_word: מוֹת נָמוּת
  choice: 我们必死无疑
  rationale: 不定式绝对形与未完成式同根连用，强化“死”的确定性；“必死无疑”自然保留这一强调。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出玛挪亚断定必死的原因，具有明确的因果意义。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 上下文将这次遭遇呈现为与上帝相遇，玛挪亚的惧怕也呼应见上帝而死的观念；但该词本身在某些语境中也可泛指神明或神性存在，因此以脚注保留词义空间。
- source_word: רָאִינוּ
  choice: 我们看见了
  rationale: 完成式表示已经发生并造成当前反应的事件；“看见了”在现代汉语中自然传达这一已然意义。
theological_decisions:
- issue: 玛挪亚在耶和华使者显现之后所说 אֱלֹהִים 的译法
  choice: 上帝
  alternative: 神明；神性存在
  rationale: 本章叙事使耶和华使者的显现与对上帝的直接遭遇彼此交叠，玛挪亚因而相信自己必死。正文译作“上帝”最符合当前语境，同时脚注说明原词较宽的可能词义，避免把使者身份的叙事张力解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必死无疑”保留原文强烈的确定语气；正文不机械复制希伯来语叙事连接词。脚注标记[a]已置于相关词语之后。
