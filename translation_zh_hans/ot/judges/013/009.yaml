base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: zh_hans
  text: 上帝垂听了玛挪亚的话，上帝的使者就再次来到那妇人那里。那时，她正坐在田间，她丈夫玛挪亚不在她身边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע הָאֱלֹהִים בְּקוֹל מָנוֹחַ
  choice: 上帝听了玛挪亚的祈求
  rationale: שׁמע בקול字面为“听……的声音”，在本处表示上帝垂听并回应玛挪亚上一节的祈求。现代汉语若译作“听了……的声音”容易显得生硬或仅指听觉，因此以“听了……的祈求”自然传达语境中的含义。
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: 上帝的使者
  rationale: מַלְאָךְ的基本义是“使者”，也可指超自然的天使。本叙事中的对象是来自上帝的超自然使者；译作“上帝的使者”既保留其使者身份，也避免仅凭传统称谓过度限定词义。
- source_word: עוֹד
  choice: 再次
  rationale: 此处表示同一事件再次发生；“再次”简洁、庄重，也符合现代汉语叙事。
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: 原文称她为“那女人/妇人”，并未在此处改用“妻子”。“那妇人”既延续叙事指称，又符合经文语体。
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  choice: 那时，她正坐在田间
  rationale: 分词יוֹשֶׁבֶת描述使者来到时的背景状态。“正坐在”准确表达持续状态；“田间”自然对应בַּשָּׂדֶה。
- source_word: מָנוֹחַ אִישָׁהּ
  choice: 她丈夫玛挪亚
  rationale: אִישׁ带第三人称阴性单数后缀，在婚姻语境中指“她的丈夫”。调整汉语词序，使身份关系清楚自然。
- source_word: אֵין עִמָּהּ
  choice: 不在身边
  rationale: 否定存在结构加עִם表示未与她同在。“不在身边”是自然汉语，准确表达当时玛挪亚没有陪同她。
theological_decisions:
- issue: הָאֱלֹהִים的译法
  choice: 上帝
  alternative: 诸神
  rationale: 虽然אֱלֹהִים在形式上为复数，本句却与单数动词搭配，并在上下文中明确指以色列的上帝，因此译为“上帝”是由句法和叙事语境决定的。
- issue: מַלְאַךְ הָאֱלֹהִים的身份表达
  choice: 上帝的使者
  alternative: 上帝的天使
  rationale: 原词兼有“使者”和“天使”的语义范围。上下文显示其为超自然的神圣使者，但本节本身仍以其受差遣的身份称呼他；“使者”保留原词的基本意义与叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。将较长的希伯来语并列句分为两句，以避免汉语拖沓，同时保留事件次序和背景信息。人名按通行中文圣经译名作“玛挪亚”。
