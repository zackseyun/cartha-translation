  text: וַ/יָּ֛קָם וַ/יֵּ֥לֶךְ מָנ֖וֹחַ אַחֲרֵ֣י אִשְׁתּ֑/וֹ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וַ/יֹּ֣אמֶר ל֗/וֹ הַ/אַתָּ֥ה הָ/אִ֛ישׁ אֲשֶׁר דִּבַּ֥רְתָּ אֶל הָ/אִשָּׁ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: zh_hans
  text: 玛挪亚就起来，跟在妻子后面[a]，来到那人面前，对他说：“你就是曾对那妇人说话的人吗？”他说：“是我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在他妻子后面”；也可译作“随着妻子去”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我就是。”原文只有“我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: 就起来，跟在……后面
  rationale: 两个连续叙事动词分别表达“起来”和“去”；结合 אַחֲרֵי，在现代汉语中译为“起来，跟在……后面”自然地保留动作次序，也不额外限定行走方式。
- source_word: אַחֲרֵי אִשְׁתּוֹ
  choice: 跟在妻子后面
  rationale: אַחֲרֵי 字面为“在……后面”，此处表示玛挪亚随妻子前往；“跟在妻子后面”既保留空间意象，也符合汉语叙事。
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: 来到那人面前
  rationale: בוא אֶל 表示来到某人那里；“来到那人面前”是自然汉语，并保留 אִישׁ 的普通称谓，不提前明说其天使身份。
- source_word: הַאַתָּה הָאִישׁ
  choice: 你就是……的人吗
  rationale: 疑问词与独立代词构成身份确认问句；“你就是……吗”准确体现其确认语气，无须额外加强。
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: 曾对那妇人说话
  rationale: אֶל 表示话语所指向的对象，译作“对……说话”；保留原文“那妇人”，不改写为“我妻子”。“曾”使汉语定语结构顺畅。
- source_word: אָנִי
  choice: 是我
  rationale: 希伯来文回答仅为独立代词“我”，在此承担肯定身份的作用；现代汉语“是我”简洁自然，也保留“我就是那人”的可能语义。
theological_decisions:
- issue: 来访者的身份称谓
  choice: 那人
  alternative: 耶和华的使者／使者
  rationale: 本节使用普通名词 אִישׁ“人／男人”。虽上下文进一步显明其为耶和华的使者，本节仍应保留叙事当下的表层称谓，避免提前揭示身份。
- issue: אָנִי 的自我确认是否具有特殊神学含义
  choice: 是我
  alternative: 我就是／我就是那一位
  rationale: 此处语境是对“你是那人吗”的直接回答。译文不把简单的身份确认扩展为神圣名号式宣告，以免加入原文在本节未明确表达的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那人”“那妇人”有意保留希伯来文的称谓方式；脚注只说明对理解确有帮助的字面形式与译法选择。
