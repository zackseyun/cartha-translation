base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: zh_hans
  text: 基甸就在那里为雅威筑了一座祭坛，称它为“雅威是平安”[a]。这祭坛至今仍在亚比以谢族的俄弗拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“YHWH shalom”；传统上音译为“雅威沙龙”。
    reason: 说明祭坛名称的原文形式及传统音译，供读者辨认，同时正文直接传达其含义。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 筑了
  rationale: בנה在建造祭坛的叙事语境中指修筑、建造；“筑”与“祭坛”搭配自然、庄重。
- source_word: מִזְבֵּחַ
  choice: 祭坛
  rationale: 这是献祭敬拜所用之坛的常用宗教术语；现代汉语用“祭坛”比单用“坛”更清楚。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל表示祭坛奉献、归属的对象；“为雅威筑……祭坛”符合现代汉语表达。יהוה按其专名性质译作“雅威”。
- source_word: וַיִּקְרָא לוֹ
  choice: 称它为
  rationale: קרא + ל在此是给祭坛命名；“称它为”既保留指向祭坛的代词，也符合汉语命名表达。
- source_word: יְהוָה שָׁלוֹם
  choice: 雅威是平安
  rationale: 这是祭坛的纪念性名称。希伯来语为无系词名词句，汉语补出“是”以自然表达其断言性质，同时不把名称仅作音译。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם可涵盖和平、安宁、健全和福祉；在本处名称及上文惧怕死亡的语境中，“平安”最凝练自然，同时保留较宽的意义范围。
- source_word: עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ
  choice: 这祭坛至今仍在
  rationale: “至今”准确表达叙述者所处时代，“仍在”传达עוֹדֶנּוּ所含持续存在之意；补出“这祭坛”使汉语指代清楚。
- source_word: בְּעָפְרָת אֲבִי הָעֶזְרִי
  choice: 在亚比以谢族的俄弗拉
  rationale: עָפְרָה按地名音译为“俄弗拉”；אֲבִי הָעֶזְרִי是族属称谓，译作“亚比以谢族的”可清楚说明该地的归属。
theological_decisions:
- issue: 神名יהוה在献坛对象和祭坛名称中的译法
  choice: 雅威／雅威是平安
  alternative: 耶和华／耶和华沙龙／主是平安
  rationale: 原文两处都直接使用四字神名יהוה。译作专名“雅威”保留其盟约之名的性质；祭坛名则翻译שָׁלוֹם的含义，而不只作音译。
- issue: יְהוָה שָׁלוֹם这一无系词名称的关系
  choice: 雅威是平安
  alternative: 雅威赐平安／雅威平安
  rationale: 原文没有“赐”这一动词，因此不把关系具体化为“赐平安”；补出汉语系词“是”，自然呈现希伯来语名词句，同时保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“筑祭坛”“称它为”“至今仍在”简洁自然；人名、地名和族名采用常见的中文圣经音译形式。脚注标记[a]紧随其所解释的祭坛名称。
