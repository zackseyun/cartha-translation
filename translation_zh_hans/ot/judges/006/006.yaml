  text: וַ/יִּדַּ֧ל יִשְׂרָאֵ֛ל מְאֹ֖ד מִ/פְּנֵ֣י מִדְיָ֑ן וַ/יִּזְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: zh_hans
  text: 以色列因米甸而极其衰微[a]；以色列人[b]就向雅威[c]呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“极其困苦”“变得极其贫穷”，也可理解为“被压得甚低”。原文动词可表示衰弱、困乏或处境卑微。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“以色列的众子”，是对以色列百姓的惯常称呼。
    reason: lexical_alternative
  - marker: c
    text: 原文为四字神名YHWH；“雅威”是其常见音译，汉语传统也译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל
  choice: 极其衰微
  rationale: דָּל在此表示因压迫而衰弱、被削弱或陷入困乏；“衰微”既包含力量与处境被严重削弱，也不把含义局限为经济贫穷。מְאֹד以“极其”表达。
- source_word: מִפְּנֵי מִדְיָן
  choice: 因米甸
  rationale: מִפְּנֵי在本语境中表示原因；简洁自然地译为“因”，说明以色列的衰微是米甸压迫所致。
- source_word: וַיִּזְעֲקוּ
  choice: 就……呼求
  rationale: זעק指人在危难中发出的急切呼喊；“呼求”自然体现向上帝求助的语境，同时不额外说明祈求的具体内容。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在此是指以色列全体百姓的固定群体称谓；现代汉语用“以色列人”最自然，直译信息收入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不是以称号替代专名。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用上帝的专名；“雅威”较贴近学界通常重构的读音，也保留专名性质。脚注交代汉语传统译名。
- issue: בְנֵי יִשְׂרָאֵל的群体性含义
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 该表达虽在语法上是阳性复数“众子”，但在本节作为全体百姓的惯用称谓。正文采用自然的群体称呼，脚注保留其字面形式，避免误导为只包含男性。
- issue: דָּל所表达的困乏范围
  choice: 衰微
  alternative: 贫困；被压得甚低；困苦不堪
  rationale: 上下文包括物资遭掠夺与整体力量被削弱。选择“衰微”保留其可指贫困、软弱和地位低下的语义张力，不把它限定为单纯经济贫穷。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“极其衰微”避免将原文只解释为经济贫穷；分号体现处境与随后呼求之间的紧密承接。所有脚注标记均紧随相关词语。
