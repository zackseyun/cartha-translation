base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: zh_hans
  text: 那时，米甸人、亚玛力人和东方各族都聚集在一起[a]；他们渡河，在耶斯列谷安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东方各族”原文直译为“东方之子”，是指东方诸族的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: 米甸全军
  rationale: 原文直译为“全米甸”，在本段军事语境中是对米甸参战群体的集合称呼。译作“米甸全军”比“所有米甸人”更避免暗示全族无一例外到场。
- source_word: וַ/עֲמָלֵק
  choice: 亚玛力人
  rationale: “亚玛力”在希伯来文中作为民族名称集合使用；现代汉语用“亚玛力人”自然清楚。
- source_word: וּ/בְנֵי קֶדֶם
  choice: 东方各族
  rationale: 字面为“东方之子”，是指东部地区诸族的惯用表达。“东方各族”既传达地理与群体含义，也避免生硬直译。
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: 都聚集在一起
  rationale: 体现אסף的聚集含义及יַחְדָּו“在一起”；“都”与并列的各支群体自然衔接。
- source_word: וַ/יַּעַבְרוּ
  choice: 渡过河去
  rationale: עבר表示越过、渡过；上下文所指很可能是约旦河。正文为符合汉语叙事补出泛称“河”，但不在正文明确命名为约旦河，以免把上下文推断说成原文明示。
- source_word: וַֽ/יַּחֲנוּ
  choice: 安营
  rationale: חנה在军事叙事中指驻扎、扎营；“安营”简洁而庄重。
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: 在耶斯列谷
  rationale: עֵמֶק可指谷地或平原；“耶斯列谷”是自然、通行的中文地名表达。
