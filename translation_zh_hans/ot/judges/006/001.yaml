  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: zh_hans
  text: 以色列人[a]行耶和华眼中看为恶的事[b]，耶和华就把他们交在米甸人手中[c]七年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“以色列的众子”，是对以色列群体的惯用称呼。
    reason: lexical_alternative
  - marker: b
    text: 或译：“行耶和华看为恶的事。”
    reason: lexical_alternative
  - marker: c
    text: “交在……手中”是希伯来语惯用语，意思是交在对方的权势或控制之下；“米甸人”对应原文“米甸”，在这里指米甸这一敌对群体。
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，这里是对以色列群体的惯用称呼。现代汉语用“以色列人”自然、准确；脚注保留字面形式。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: 与“做”连用，表示行了在道德上邪恶的事；“恶”保留原文鲜明的道德判断。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评判性意象，同时按现代汉语句法表达为“眼中看为”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、易识别的音译，不以“主”这一称号替代专名。
- source_word: וַיִּתְּנֵם
  choice: 就把他们交在
  rationale: נתן 与“在……手中”连用时表示交付，使其落在对方权势之下；“交在”既保留原文结构，也清楚表达结果。
- source_word: בְּיַד מִדְיָן
  choice: 米甸手中
  rationale: 保留“手”这一希伯来语权势意象；此处“米甸”可指米甸人这一敌对群体。
- source_word: מִדְיָן
  choice: 米甸
  rationale: 按现代中文圣经传统音译此专名。
- source_word: שֶׁבַע שָׁנִים
  choice: 七年
  rationale: 汉语时段补语无需另加介词，简洁准确地表达持续时间。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。译作“耶和华”保留其专名性质，也是现代中文读者最熟悉的形式；不用称号“上主”替代。
- issue: בְנֵי יִשְׂרָאֵל 的群体所指
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 原短语字面带阳性复数形式，但在这里惯用地指整个以色列群体。正文采用自然的群体名称，不把经文所指缩窄为男性；字面形式收入脚注。
- issue: “交在米甸手中”所表达的行动主体
  choice: 明确保留耶和华为交付者
  alternative: 他们落在米甸权下
  rationale: 原文明确说耶和华将他们交出，呈现本节关于审判与后果的神学张力；译文不将其弱化为被动遭遇。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“做了……看为恶的事”延续《士师记》的反复句式；“交在……手中”保留原文意象，并以脚注说明其含义。所有脚注标记均置于相关正文词句之后。
