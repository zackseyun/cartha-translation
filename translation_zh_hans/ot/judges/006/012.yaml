  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: zh_hans
  text: '雅威的天使[a]向他显现，对他说：“雅威与你同在，大能的勇士[b]！”


    [a] 希伯来语也可译作“雅威的使者”。该词既可指人的使者，也可指天使；这里的显现场景较适合译作“天使”。

    [b] 或译“大有勇力的人”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语也可译作“雅威的使者”。该词既可指人的使者，也可指天使；这里的显现场景较适合译作“天使”。
    reason: lexical_alternative
  - marker: b
    text: 或译“大有勇力的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 显现
  rationale: 此处ראה的尼法勒式用于叙事中的显现场景，译作“显现”自然准确，也比“被看见”更符合现代汉语。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: מַלְאָךְ可指“使者”或“天使”；本段描述超自然的显现，正文采用“天使”，并以脚注保留“使者”这一真实的词义可能。神名יְהוָה音译为“雅威”。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 对他说
  rationale: 忠实保留原文的代词，不在本节擅自补出“基甸”这一名字。
- source_word: יְהוָה עִמְּךָ
  choice: 雅威与你同在
  rationale: 这是无系词名词句；结合语境，最自然地理解为当前事实的宣告，而非“愿雅威与你同在”的祝愿。
- source_word: גִּבּוֹר הֶחָיִל
  choice: 大能的勇士
  rationale: 该短语称呼强壮、英勇并具作战能力的人。“大能的勇士”保留其力量与军事色彩，也保留这称呼在当前处境中可能具有的张力。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文采用接近YHWH传统学术读音的汉语音译“雅威”，以保留其作为专名的性质，而不以称号代替。
- issue: מַלְאַךְ יְהוָה的身份
  choice: 雅威的天使
  alternative: 雅威的使者
  rationale: 正文按显现场景译作“天使”，但不进一步将其认定为某一特定神圣位格；脚注保留“使者”的词义可能，从而避免以教义解释取代翻译。
- issue: יְהוָה עִמְּךָ是宣告还是祝愿
  choice: 雅威与你同在
  alternative: 愿雅威与你同在
  rationale: 原文没有明示系词，因此形式上存在一定开放性；本段中使者随后宣告使命，陈述式更合语境，但不把该句扩写成超出原文的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“向他显现”符合现代汉语圣经叙事习惯；直接引语简洁有力。“大能的勇士”略带庄严色彩，并保留原称呼的军事含义及其在基甸处境中的反差。
