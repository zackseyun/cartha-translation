  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל יוֹאָ֔שׁ הוֹצֵ֥א אֶת בִּנְ/ךָ֖ וְ/יָמֹ֑ת כִּ֤י נָתַץ֙ אֶת מִזְבַּ֣ח הַ/בַּ֔עַל וְ/כִ֥י כָרַ֖ת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: zh_hans
  text: 城中的男子对约阿施说：“把你儿子带出来，让他死！因为他拆毁了巴力的祭坛，又砍倒了坛旁的亚舍拉[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”。希伯来语这个词既可指亚舍拉，也可指与她有关的崇拜物；这里“砍倒”一词表明所指更可能是崇拜物，而不是女神本身。
    reason: 说明原词所指的词义歧义及上下文较可能的理解。
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: 城中的男子
  rationale: 保留希伯来语“城中的男人”这一阳性表达，并以现代汉语中较庄重、自然的“男子”指称参与此事的男性城民。
- source_word: הוֹצֵא
  choice: 把你儿子带出来
  rationale: 该使役命令式意为使某人出来；“带出来”既贴近原文，也符合现场要求约阿施交出儿子的语境。
- source_word: וְיָמֹת
  choice: 让他死
  rationale: 保留连接词加祈愿式所表达的要求或结果，不把原文单纯的“死”扩写为正式司法术语“处死”。
- source_word: נָתַץ אֶת מִזְבַּח הַבַּעַל
  choice: 拆毁了巴力的祭坛
  rationale: “拆毁”适用于祭坛等建筑物，并准确表达 נתץ 的破坏、拆除之意。
- source_word: כָרַת
  choice: 砍倒
  rationale: 该动词用于木质物或树木时常指砍下、砍倒；这里与亚舍拉崇拜物相配。
- source_word: הָאֲשֵׁרָה
  choice: 亚舍拉
  rationale: 音译保留希伯来词既可关联女神、又可指其崇拜物的语义张力；本节的“砍倒”显示这里更可能是崇拜物。
- source_word: אֲשֶׁר עָלָיו
  choice: 坛旁的
  rationale: 介词 עַל 可表示在上、靠近或在旁；此处理解为祭坛旁边最符合崇拜设施的空间关系，同时不暗示该物必定立在祭坛顶上。
theological_decisions:
- issue: אֲשֵׁרָה 在异教崇拜语境中的所指
  choice: 亚舍拉
  alternative: 亚舍拉柱；亚舍拉女神
  rationale: 原词在此更可能指与亚舍拉有关的崇拜物，但其具体形制并未明说。音译并加注既避免把它确定为“柱”，也避免误认此处必定直接指女神。
- issue: וְיָמֹת 所表达的死亡要求
  choice: 让他死
  alternative: 处死他；他必须死
  rationale: 原文在“带出来”之后使用“死”的祈愿式，语境显然是要求他丧命；所选译法保留原句形式，避免额外引入正式审判或行刑程序。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“城中的男子”保留原文的阳性所指；引语中的感叹号体现群众要求处死基甸的强烈语气。脚注标记置于“亚舍拉”之后，与注释内容准确对应。
