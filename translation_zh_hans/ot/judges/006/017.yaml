base_translation:
  language: en
  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: zh_hans
  text: 他对他说：“我若在你眼前蒙恩，请给我一个记号，证明是你在跟我说话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵן
  choice: 恩
  rationale: “在你眼前蒙恩”准确保留希伯来语固定表达，也符合现代中文庄重而自然的用法。
- source_word: אוֹת
  choice: 凭据
  rationale: 此处指用来确认说话者身份的记号或证据；“凭据”比“神迹”更少预设其具体形式，也比单用“记号”更自然地表达验证功能。
- source_word: מְדַבֵּר עִמִּי
  choice: 在跟我说话
  rationale: 保留进行中的动作含义，并以普通现代汉语自然表达。
theological_decisions:
- issue: 说话者身份是否在译文中明确为基甸
  choice: 保留“他对他说”
  alternative: “基甸对他说”
  rationale: 希伯来原文仅使用代词；不在本节内补出专名，可避免超出原文明确程度。
- issue: אות是否译为带有超自然含义的“神迹”
  choice: 译为“凭据”
  alternative: “神迹”或“记号”
  rationale: 原词可泛指记号、征兆或凭证，本节尚未限定其性质，因此不预先加入必然超自然的解释。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言；“在你眼前蒙恩”保留圣经希伯来语表达的礼貌与郑重感，后半句则用自然口语化程度适中的现代汉语。
