base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: zh_hans
  text: 上帝的使者对他说[a]：“取肉和无酵饼，放在这块磐石上，并把汤倒出来。”他就这样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的天使”。希伯来语“使者”既可指人的使者，也可指天使；这里的上下文倾向于指一位超自然的使者。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: 上帝的使者
  rationale: מַלְאַךְ本义为受差遣的“使者”，可指人间使者，也可指天使；本段语境表明这是一位超自然的使者。正文保留希伯来词的基本称谓，并用脚注说明“天使”这一语境性译法。
- source_word: קַח
  choice: 拿来
  rationale: לקח的命令式基本义为“拿、取”；结合随后放到指定磐石上的动作，现代汉语用“拿来”自然，但不额外指定原文没有明说的来源。
- source_word: הַבָּשָׂר
  choice: 肉
  rationale: בָּשָׂר在食物语境中自然译为“肉”，比字面的“肉体”准确。
- source_word: הַמַּצּוֹת
  choice: 无酵饼
  rationale: מַצּוֹת指未发酵的烤制食物；“无酵饼”在中文圣经语境中清楚、简洁，并可作集合称谓。
- source_word: וְהַנַּח
  choice: 放
  rationale: נוח的使役命令式在此意为“放置、安放”；中文由前文自然承接“肉和无酵饼”为宾语。
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: 在这块磐石上
  rationale: סֶלַע意为岩石或磐石；与“放”连用时，介词אֶל在中文宜按落点译为“在……上”。הַלָּז在此具有指示作用，译作“这块”。
- source_word: הַמָּרַק
  choice: 汤
  rationale: מָרָק指烹煮所得的汤汁；“汤”是自然、易懂的现代汉语，且不把它误解为普通果汁。
- source_word: שְׁפֹוךְ
  choice: 倒出来
  rationale: שפך的命令式表示倾倒液体；“倒出来”自然表达将汤倒出的动作，同时不擅自补出“倒在磐石上”，因为希伯来文此处没有重复地点成分。
- source_word: וַיַּעַשׂ כֵּן
  choice: 他就照着做了
  rationale: 这一惯用语表示依命行事；该译文简洁地保留了顺承和服从的语气。
theological_decisions:
- issue: 显现叙事中מַלְאַךְ הָאֱלֹהִים的译法
  choice: 上帝的使者
  alternative: 上帝的天使
  rationale: 希伯来词本身可泛指“使者”，而本章语境逐步显明其超自然身份。正文采用较贴近词义且保留叙事张力的“使者”，脚注给出“天使”这一合乎语境的译法，避免超出本节而过早界定其身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“磐石”保留叙事的庄重感；“汤”与“倒出来”则避免生硬的书面表达。正文中的脚注标记[a]与脚注完全对应。
