revisions:
- from: 城里的人清早起来，看哪，巴力的祭坛被拆毁了，祭坛上面的亚舍拉也被砍倒了[a]，那第二头公牛则献在新筑的祭坛上。
  to: 城里的男人清早起来，只见巴力的祭坛已被拆毁，在祭坛上面的亚舍拉[a]也被砍倒了，那第二头公牛也已在所筑的祭坛上被献上。
  rationale: 修订保留原文的男性指称、被动完成式和“所建的祭坛”这一不附加时间限定的表达；同时以“只见”自然地传达叙事中的突现感。亚舍拉的术语及脚注维持原有的审慎处理。
