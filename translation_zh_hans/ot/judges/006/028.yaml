  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: zh_hans
  text: 城里的男人清早起来，只见巴力的祭坛已被拆毁，在祭坛上面的亚舍拉[a]也被砍倒了，那第二头公牛也已在所筑的祭坛上被献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉”也可译作“亚舍拉柱”或“神木”；原文直译为“在它上面的亚舍拉”。
    reason: 说明该祭祀用语可能所指的物件，并保留原文空间短语的字面意义。
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ אַנְשֵׁי הָעִיר בַּבֹּקֶר
  choice: 城里的人清早起来
  rationale: 保留“城里的人”这一阳性群体表达，也传达 שׁכם 所强调的早起；现代汉语中简洁自然。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留叙事中突然发现的鲜明效果，而不将其省略或淡化。
- source_word: נֻתַּץ מִזְבַּח הַבַּעַל
  choice: 巴力的祭坛被拆毁了
  rationale: 被动表达对应希伯来文被动式；“拆毁”适合用于祭坛等建筑结构。
- source_word: הָאֲשֵׁרָה
  choice: 亚舍拉
  rationale: 音译原词，以免武断限定为“木柱”；本节的“砍倒”表明这里所指的是可砍伐的祭祀物。
- source_word: אֲשֶׁר עָלָיו
  choice: 祭坛上面的
  rationale: 按 עַל 的通常意义译为“上面”，保留原文可能指在其上或附属于其上的空间关系，不擅自改成“旁边”。
- source_word: כֹּרָתָה
  choice: 被砍倒了
  rationale: 准确传达 כרת 在此对木质祭祀物进行砍伐的被动含义。
- source_word: הַפָּר הַשֵּׁנִי
  choice: 那第二头公牛
  rationale: 保留“第二”与上文叙事的照应；“公牛”准确表达 פַּר。
- source_word: הֹעֲלָה
  choice: 献在
  rationale: 在祭坛语境中自然表达献祭之意，同时不额外明说原文此处未直接使用的“燔祭”名词。
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: 新筑的祭坛
  rationale: “所筑的祭坛”虽更形式对应，但“新筑的祭坛”自然地指向前一夜刚建成的祭坛；“新”来自明确的近接语境。
theological_decisions:
- issue: אֲשֵׁרָה 的所指
  choice: 亚舍拉
  alternative: 亚舍拉柱／神木
  rationale: 该词既可关联女神亚舍拉，也可指其祭祀象征物。正文保留音译，不将其形制过度具体化；“砍倒”已显示本节所指为可砍伐的物件。
- issue: עָלָיו 的空间关系
  choice: 祭坛上面的
  alternative: 祭坛旁边的
  rationale: 原文通常义是“在它上面”；虽有译本根据祭祀场景理解为“在旁边”，正文优先保存原文措辞及其可能的含混，不借背景推断替换空间关系。
- issue: הֹעֲלָה 的祭祀含义
  choice: 献在
  alternative: 作为燔祭献在
  rationale: 该动词在本语境显然表示献祭，但本节没有再次出现“燔祭”名词；译文保留祭祀含义而避免过度补足。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留希伯来叙事的突现感；“亚舍拉”采用圣经语境中可辨识的音译，并以脚注提示可能的具体含义。
