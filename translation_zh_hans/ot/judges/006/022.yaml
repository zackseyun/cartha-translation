  text: וַ/יַּ֣רְא גִּדְע֔וֹן כִּֽי מַלְאַ֥ךְ יְהוָ֖ה ה֑וּא וַ/יֹּ֣אמֶר גִּדְע֗וֹן אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי עַל כֵּ֤ן רָאִ֨יתִי֙ מַלְאַ֣ךְ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: zh_hans
  text: 基甸看出他是耶和华的使者[a]，就说：“唉，主耶和华啊！因为我面对面看见了耶和华的使者！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华的天使”。希伯来语这个词可指“使者”或“天使”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看出
  rationale: 动词字面为“看见”，但后接כִּי所引出的认知内容；现代汉语用“看出”既保留视觉语义，也自然表达基甸此刻认出对方身份。
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאָךְ可指一般使者，也可指天使；正文采用较能保留词义张力的“使者”，脚注说明也可译作“天使”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，以专名呈现四字神名，而不以称号替代。
- source_word: אֲהָהּ
  choice: 哀哉
  rationale: 该感叹词表达惊惧和悲叹；“哀哉”庄重简洁，符合基甸因面对神圣使者而发出的惊呼。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现אֲדֹנָי的称号“主”和יְהוָה的神名，保留复合呼语的两个成分。
- source_word: כִּי עַל כֵּן
  choice: 竟
  rationale: 此处说明基甸惊惧的缘由，并带有强烈感叹色彩；汉语以“竟”结合上下文自然传达其震惊，而不机械展开希伯来语粒子。
- source_word: פָּנִים אֶל פָּנִים
  choice: 面对面
  rationale: 这是直接相见的固定表达；“面对面”既贴近原文，也符合现代汉语习惯。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文普通读者最熟悉且可明确识别为神名的传统音译；译文始终将其作为专名处理，不以“上主”等称号代替。
- issue: מַלְאַךְ יְהוָה的身份表达
  choice: 耶和华的使者
  alternative: 耶和华的天使
  rationale: 原词既可表示人间的“使者”，也可表示超自然的“天使”。本段语境表明其为超自然来使，但译作“使者”更能保留原词的词汇幅度和叙事中的神学张力，脚注列出另一译法。
- issue: 基甸所见与耶和华之间的关系
  choice: 不增补身份解释
  alternative: 明确称其为神的显现或与耶和华等同
  rationale: 原文只说基甸认出对方是“耶和华的使者”，同时记录他的惊惧；译文不替叙事解决使者与耶和华之间的关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看出”表达由看见而认出的语境意义；“哀哉”保留突发惊惧的肃穆语气；末句使用“竟”和感叹号呈现基甸的震惊。
