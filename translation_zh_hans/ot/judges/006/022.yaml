revisions:
- from: 基甸看出那是耶和华的使者[a]，就说：“哀哉，主耶和华啊！我竟面对面看见了耶和华的使者！”
  to: 基甸看出他是耶和华的使者[a]，就说：“唉，主耶和华啊！因为我面对面看见了耶和华的使者！”
  rationale: 修订以“唉”替换文言化的“哀哉”，使语体符合自然、庄重的现代标准汉语；以“因为”呈现原文的因果说明；并简化脚注，使其仅说明 מַלְאָךְ 的词汇替代义，避免加入不必要的解释。其余神名、复合神称和“面对面”的表达均予保留。
