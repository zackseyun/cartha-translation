  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: zh_hans
  text: 耶和华的使者伸出手中的杖，用杖头碰了肉和无酵饼。火就从磐石中升起，烧尽了肉和无酵饼；随后，耶和华的使者从他眼前离去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从他眼前离去了”直译为“从他的眼睛离去”，意思是基甸再也看不见他；也可译作“从他面前离去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאָךְ可指“使者”或“天使”；本段具有超自然语境，但“使者”既保留希伯来词的基本语义及身份张力，也符合庄重的现代汉语表达。
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: 杖头
  rationale: קָצֶה指末端，מִשְׁעֶנֶת指供支撑用的杖；“杖头”简洁而具体。
- source_word: וַיִּשְׁלַח
  choice: 伸出
  rationale: 在宾语为杖头的语境中，动词表示将杖向前伸出，并非“差遣”。
- source_word: וַיִּגַּע
  choice: 碰了
  rationale: נגע通常表示触碰；原文没有要求译成力度更强的“击打”。
- source_word: בָּשָׂר
  choice: 肉
  rationale: 原词可指“肉体”或“肉”；此处指基甸预备的食物，因此译作“肉”。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 复数形式指未发酵制成的饼；“无酵饼”是清楚且通行的中文表达。
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: 火就从磐石中升起
  rationale: עלה与מן共同描写火从磐石那里向上出现；“从磐石中升起”保留原文鲜明的空间图景。
- source_word: וַתֹּאכַל
  choice: 烧尽了
  rationale: 该动词字面为“吃掉”，以火为主语时，现代汉语自然表达为“烧尽”。
- source_word: הָלַךְ מֵעֵינָיו
  choice: 从他眼前离去了
  rationale: 希伯来文直译为“从他的眼睛离去”；此译表达不再可见，却不额外断定是突然消失。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语域中广为人知的神名音译，作为四字神名的直接称呼，而非以称号替代。
theological_decisions:
- issue: מַלְאַךְ יְהוָה所指者的身份表达
  choice: 耶和华的使者
  alternative: 耶和华的天使
  rationale: 原词兼有一般“使者”和超自然“天使”的语义。本节语境显示其超自然作为，但译文不超越原文直接界定其本体身份。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都意在呈现四字神名；正文采用中文读者最熟悉、且具有专名功能的“耶和华”，不以“主”替代神名。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。叙事以连续短句保留希伯来文动作推进；“使者”保留מַלְאָךְ的词义张力，脚注仅说明末句的希伯来习语。
