  text: וַ/יֹּ֥אמֶר גִּדְע֖וֹן אֶל הָ/אֱלֹהִ֑ים אִם יֶשְׁ/ךָ֞ מוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: zh_hans
  text: 于是，基甸对神说：“如果你要借我的手拯救以色列，正如你所说的，”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 叙事性连续式推动情节发展；“于是”在现代汉语中自然地表达先后承接。
- source_word: אֶל הָאֱלֹהִים
  choice: 对神
  rationale: 上下文明确指基甸向以色列的神说话；汉语专名式称谓自然译作“神”，无需呈现希伯来语冠词。
- source_word: אִם
  choice: 如果
  rationale: 引出延续到下一节的条件从句，保留原文尚未闭合的条件结构。
- source_word: יֶשְׁךָ מוֹשִׁיעַ
  choice: 你要……拯救
  rationale: יֵשׁ加第二人称后缀及分词表达预期或意向中的行动；“你要”简洁自然，同时保留将要施行之意，避免把条件说得过强。
- source_word: בְּיָדִי
  choice: 借我的手
  rationale: 保留“手”这一具体的希伯来语施事意象，也清楚表达基甸作为施行拯救之工具。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: אֵת为直接宾语标记，不另行翻译；“以色列”作“拯救”的宾语。
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: 照你所说的
  rationale: 准确表达对神先前话语的回指，在现代汉语中庄重自然；置于主要动作之前可避免句尾连续虚词造成生硬。
theological_decisions:
- issue: 基甸所称אֱלֹהִים的指称
  choice: 神
  alternative: 那位神／神明
  rationale: 语境指向先前向基甸说话的以色列之神，而不是泛指某一神明；译作“神”既明确又不增添原文以外的教义说明。
- issue: 条件句是否表示怀疑或强调确证
  choice: 保留中性的“如果”
  alternative: 如果你真的／既然你
  rationale: 原文אִם保持开放的条件形式；不加入“真的”或改成“既然”，以免预先判定基甸话语中的心理状态及神学意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文；保留引号及句末逗号，因为本节的话语和条件结构延续至下一节。
