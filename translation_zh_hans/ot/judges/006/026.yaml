  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: zh_hans
  text: 你要在这座堡垒的顶上，按妥善的安排，为雅威你的上帝筑一座坛；再取来第二头公牛，用你所砍下的亚舍拉[a]的木料作柴，将它献为燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉”也可译作“亚舍拉柱”。原文用词可能指与亚舍拉有关的木制崇拜物，其具体形态不能确定。
    reason: 说明אֲשֵׁרָה的词义范围和实物形态上的不确定性。
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: 你要……筑
  rationale: 连词加第二人称阳性单数完成式在连续指令中表达下一步命令；中文用“你要”自然呈现命令语气。
- source_word: מִזְבֵּחַ
  choice: 一座坛
  rationale: 准确表达献祭所用的祭坛；量词“一座”符合现代汉语习惯。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 为雅威你的上帝
  rationale: ל־表示祭坛归属或奉献对象；保留神名“雅威”和“你的上帝”这一完整称呼。
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: 在这堡垒顶上
  rationale: רֹאשׁ意为顶部；מָעוֹז指坚固、防御或可作庇护的地方。“堡垒”简洁保留其坚固处所之义。
- source_word: בַּמַּעֲרָכָה
  choice: 按规整的样式
  rationale: מַעֲרָכָה可指排列、布置或有秩序的安排；译文保留其含混性，不具体限定为石块、木柴或某一既定地点。
- source_word: וְלָקַחְתָּ אֶת־הַפָּר הַשֵּׁנִי
  choice: 再牵来第二头公牛
  rationale: 在连续命令中用“再”承接前一步；“第二头”照实保留与上下文第一头牛的区分。
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: 献为燔祭
  rationale: עלה的使役式与עֹלָה连用构成献祭术语；“献为燔祭”是清楚、自然的中文表达。
- source_word: בַּעֲצֵי הָאֲשֵׁרָה אֲשֶׁר תִּכְרֹת
  choice: 用你砍下的亚舍拉木作柴
  rationale: 表达被砍下的亚舍拉木料用于燔祭燃烧；主文保留“亚舍拉”，不武断认定其具体形态。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也将其作为专名呈现。
- issue: אֲשֵׁרָה所指对象
  choice: 亚舍拉木
  alternative: 亚舍拉柱／亚舍拉的木制偶像
  rationale: 此词可能指与女神亚舍拉有关的木制崇拜物，但具体形态有争议；主文避免把它限定为柱或偶像，脚注说明这一点。
- issue: בַּמַּעֲרָכָה的具体含义
  choice: 按规整的样式
  alternative: 在预备好的地方／用排列好的材料
  rationale: 该词在本节可指有秩序的排列或布置，所修饰的具体对象并不完全明确；译文保留这种张力，不增添原文未明说的材料或地点。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式依照原文的连续命令推进，以分号划分筑坛和献祭两个动作；保留“第二头公牛”“燔祭”等叙事与礼仪细节。
