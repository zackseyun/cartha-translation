  text: וְ/הָיָ֖ה אִם זָרַ֣ע יִשְׂרָאֵ֑ל וְ/עָלָ֨ה מִדְיָ֧ן וַֽ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם וְ/עָל֥וּ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: zh_hans
  text: 每逢以色列人撒种，米甸人、亚玛力人和东方人就上来攻打他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“攻打他”，用阳性单数代词集合性地指以色列民；这里按现代汉语习惯译作“攻打他们”。
    reason: 保留原文中集合名词与单数代词呼应的语法信息，同时避免正文产生“他”指某个个人的误解。
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: 每逢
  rationale: 该结构在上下文中引出反复发生的情形，不是一次性的条件，因此译为“每逢”，自然表达习惯性、重复性的时间关系。
- source_word: זָרַע יִשְׂרָאֵל
  choice: 以色列人撒种
  rationale: זָרַע指播撒种子；“撒种”直接保留农业意象。יִשְׂרָאֵל在这里集合性地指以色列民，汉语用“以色列人”更清楚自然。
- source_word: וְעָלָה
  choice: 就上来
  rationale: עלה基本义为“上去、上来”，此处描述敌对势力进入以色列境内；“上来”保留方向意象，“就”与“每逢”搭配，体现反复发生的结果。
- source_word: מִדְיָן
  choice: 米甸人
  rationale: 原文用专名“米甸”集合性地指该族群；现代汉语加“人”可清楚表明这里说的是米甸族人。
- source_word: וַעֲמָלֵק
  choice: 亚玛力人
  rationale: 原文用专名“亚玛力”集合性地指该族群；译作“亚玛力人”符合现代汉语表达。
- source_word: וּבְנֵי קֶדֶם
  choice: 东方人
  rationale: 字面为“东方之子”，是指来自东方的族群；“东方人”简明地传达其地域和群体含义。
- source_word: וְעָלוּ עָלָיו
  choice: 攻打他们
  rationale: עלה与על连用在这里表示敌对进逼。“攻打”明确传达军事敌意。原文第三人称阳性单数后缀把“以色列”视为一个集合整体；汉语按实际所指自然译为复数“他们”，并以脚注保留原文形式。
