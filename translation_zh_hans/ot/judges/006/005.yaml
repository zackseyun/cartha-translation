base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: zh_hans
  text: 因为他们和牲畜会上来，帐棚也会随之而来，多如蝗虫；他们和他们的骆驼不计其数。他们进入这地，要毁坏它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁坏”也可译作“蹂躏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明以色列陷入穷困的原因；现代汉语用“因为”自然明确。
- source_word: הֵם וּמִקְנֵיהֶם יַעֲלוּ
  choice: 他们带着牲畜上来
  rationale: 未完成式在过去叙事中表示反复发生的行动；汉语不必另加“常常”也可由上下文体现。将并列结构自然表达为“带着牲畜”，不改变同行之意。
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: 帐棚……而来（合并表达为“帐棚多如蝗虫”）
  rationale: “帐棚”以转喻描写入侵者连同营地迁入；译文保留帐棚意象，同时与随后的数量比喻合并成自然汉语。
- source_word: כְדֵי אַרְבֶּה לָרֹב
  choice: 多如蝗虫
  rationale: 表达数量庞大如蝗群；简洁保留原文的蝗虫比喻。
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: 他们和他们的骆驼不计其数
  rationale: 保留原文同时强调人群与骆驼都无法数算。
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: 他们进入这地
  rationale: 准确表达进入该地的叙事推进。
- source_word: לְשַׁחֲתָהּ
  choice: 要毁坏它
  rationale: 不定式表示入侵的目的；“毁坏”涵盖破坏、蹂躏土地的广义含义。
