  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: zh_hans
  text: 那一夜，神就这样行了：只有那团羊毛是干的，遍地[a]都有露水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地”也可译为“土地”或“大地”。希伯来语 אֶרֶץ 可指“地面”、“土地”或“大地”；这里按基甸求征兆的现场语境译为“地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: 神就照样做了
  rationale: 保留“神”作主语，并以“照样”回指基甸上一节所求的征兆；“做了”简洁呈现叙事动作。
- source_word: בַּלַּיְלָה הַהוּא
  choice: 那一夜
  rationale: 自然、明确地表达特指的时间，也符合现代汉语叙事习惯。
- source_word: חֹרֶב אֶל־הַגִּזָּה לְבַדָּהּ
  choice: 只有羊毛是干的
  rationale: חֹרֶב是表示“干燥”的名词，但汉语用状态谓语“是干的”更自然；“只有”准确表达לְבַדָּהּ所强调的排他性。גִּזָּה在本段指剪下的羊毛。
- source_word: וְעַל כָּל־הָאָרֶץ הָיָה טָל
  choice: 遍地都有露水
  rationale: 以简明自然的汉语呈现“所有地面上有露水”；“遍地”符合此处局部场景，同时用脚注保留אֶרֶץ的词义幅度。
