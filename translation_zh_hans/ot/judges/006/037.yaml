  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: zh_hans
  text: 看哪，我要把一团羊毛放在打谷场上。如果只有羊毛上有露水，而地面[a]全都干燥，我就知道你必借我的手拯救以色列，正如你所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地面”也可译作“全地”或“全境”。希伯来语原词既可指当地的地面，也可泛指土地或大地；这里很可能是指这记号发生处的地面。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和指示当下行动的语气；“看哪”庄重而仍为现代读者所理解。
- source_word: מַצִּיג
  choice: 我要……放在
  rationale: 分词与אָנֹכִי连用，表示基甸即将采取的行动；中文用“我要……放在”自然地表达这一临近意向。
- source_word: גִּזַּת הַצֶּמֶר
  choice: 一团羊毛
  rationale: 指剪下来的羊毛皮或羊毛团；“一团羊毛”通俗自然，也足以与后文承接。
- source_word: בַּגֹּרֶן
  choice: 在打谷场上
  rationale: 准确表达גֹּרֶן这一铺设、打谷的场地，并符合中文空间表达。
- source_word: טַל יִהְיֶה
  choice: 有露水
  rationale: 保留希伯来文存在句的表达，不额外指定露水如何形成或降下。
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: 只有羊毛上有露水
  rationale: 清楚保留לְבַדָּהּ所表达的排他性。
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: 而周围的地面全都干燥
  rationale: 按打谷场上神迹记号的近距离场景，将הָאָרֶץ理解为羊毛周围的地面；“干燥”对应חֹרֶב。
- source_word: וְיָדַעְתִּי
  choice: 我就知道
  rationale: 在条件句中自然表达条件实现后的结果。
- source_word: כִּי תוֹשִׁיעַ
  choice: 你必……拯救
  rationale: תוֹשִׁיעַ是使役形，意为施行拯救；“必”在此表达基甸由记号所确认的未来行动。
- source_word: בְּיָדִי
  choice: 借我的手
  rationale: 保留希伯来文“借我的手”这一施行者或工具性的身体意象，中文也清楚可懂。
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: 正如你所说的
  rationale: 贴近“你所说/所讲”的字义，不擅自加强为“应许”。
theological_decisions:
- issue: הָאָרֶץ在神迹记号中的范围
  choice: 周围的地面
  alternative: 全地／全境
  rationale: 上下文将羊毛与其所在打谷场附近的表面相对照；采用局部意义较符合叙事情境，同时以脚注保留该词更广的可能范围。
- issue: בְּיָדִי的施行者表达
  choice: 借我的手
  alternative: 借着我
  rationale: 直译既能保留希伯来语的身体意象，也不改变上帝是拯救者、基甸是受用之人的张力。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“看哪”保留原文的强调；“借我的手”保留希伯来语意象。脚注标记[a]置于“地面”之后，使其所指明确。
