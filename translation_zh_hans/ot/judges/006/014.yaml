  rationale: 修订使命令句和反问句更符合现代标准汉语，同时维持原文的叙事动作、差遣语气、神名、希伯来语“手”的意象，以及“你这力量”来源未明的表达。脚注补充说明 בְּכֹחֲךָ זֶה 的句法歧义，避免将其单一定为某种神学解释。
