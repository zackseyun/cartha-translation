base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: zh_hans
  text: 耶和华转向他，说：“你要凭着你这力量去拯救以色列，脱离米甸的手[a]。难道不是我差遣你吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米甸的手”是希伯来语惯用说法，指米甸的权势或控制。“凭着你这力量”也可译作“在你这力量中”；原文介词的具体意味可有不同理解。
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: 转向他
  rationale: פנה 表示“转、转向”，与 אֵלָיו 合起来是朝向基甸；“转向他”自然保留叙事动作，不限缩为仅仅观看。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代中文读者熟悉的传统音译来呈现四字神名，同时不以“主”替代原文专名。
- source_word: לֵךְ בְּכֹחֲךָ זֶה
  choice: 你就靠着你这力量去
  rationale: 保留命令语气、第二人称所属形式和 זֶה 的指示强调；“靠着”表达 בְּ 的凭借或工具含义。
- source_word: וְהוֹשַׁעְתָּ
  choice: 拯救
  rationale: 在前置命令“去”之后，此连续形式具有命令延续的作用；中文以“去，拯救”自然表达差遣。
- source_word: מִכַּף מִדְיָן
  choice: 脱离米甸的手
  rationale: 保留“手”的希伯来意象，指米甸的权势或控制，并以脚注说明。
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: 差遣你的，不正是我吗
  rationale: הֲלֹא 引入期待肯定回答的反问；此译法在中文中自然突出差遣者是耶和华，又保留反问语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用普通现代中文圣经语境中辨识度较高的“耶和华”，而不将其泛化为称号“主”。
- issue: “你这力量”的来源或性质
  choice: 保留为“你这力量”，不明说是基甸自身能力或神所赐能力
  alternative: 靠着我赐给你的力量
  rationale: 原文只说“你的这力量”，其所指可以结合语境理解，但本节没有明说来源；译文避免替原文消除神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你就靠着你这力量去”保留原文指示词带来的强调；反问句调整为符合中文习惯的焦点结构。正文仅设置实际需要的脚注，且标记已置于相应短语之后。
