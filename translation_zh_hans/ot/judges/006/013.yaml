  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: zh_hans
  text: 基甸对他说：“请恕我直言，大人[a]，耶和华若与我们同在，为什么这一切会临到我们呢？我们的祖先曾告诉我们：‘耶和华不是把我们从埃及领上来了吗？’他的一切奇妙作为[b]在哪里呢？如今，耶和华却离弃了我们，把我们交在米甸手中[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请恕我直言，大人”也可译作“请容我说，我主”。原文是带恳请意味的礼貌称呼；本句本身并不要求把这称呼理解为神圣称号。
    reason: 说明בִּי אֲדֹנִי的礼貌语气和尊称性质，并保留受话者身份在本句中的未定性。
  - marker: b
    text: “奇妙作为”也可译作“奇事”“奇妙的事”或“神迹”。
    reason: 说明נִפְלְאֹתָיו指令人惊叹的非凡作为，避免将其限定为单一类别。
  - marker: c
    text: 原文直译为“交在米甸手中”；这是表示交给米甸、置于米甸权势之下的惯用说法。
    reason: 解释“手中”的希伯来语权势惯用语。
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: 请听我说，我主
  rationale: בִּי是表示恳请或请求准许发言的礼貌用语；אֲדֹנִי在此保留为尊敬称呼“我主”，不预先断定受话者的神圣身份。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，不以称号替代。
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: 耶和华若与我们同在
  rationale: 原文形式近于“而耶和华与我们同在”，但在反问论证中表达条件前提；“若”自然呈现其语用功能。
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: 为什么这一切还临到我们呢
  rationale: מצא以灾祸为主语时可指临到、遭遇；“还”显出条件与现实之间的反差。
- source_word: נִפְלְאֹתָיו
  choice: 他的……奇妙作为
  rationale: 指令人惊叹的非凡作为，尤其是上帝在救赎历史中的行动；此译不把词义过度限定为某一类神迹。
- source_word: אֲבוֹתֵינוּ
  choice: 我们的祖先
  rationale: 此处泛指以色列先辈及传统传承者；“祖先”比现代汉语中的“父亲们”更准确自然。
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: 耶和华不是把我们从埃及领上来了吗
  rationale: הֲלֹא引出预期肯定回答的反问；保留从埃及“领上来”的出埃及传统表达。
- source_word: נְטָשָׁנוּ
  choice: 丢弃了我们
  rationale: 表达离弃、撇下的强烈意味，并符合基甸抱怨的情绪。
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: 把我们交在米甸手中
  rationale: 保留“在……手中”的希伯来意象，同时中文可自然理解为交由米甸辖制。
- source_word: מִדְיָן
  choice: 米甸
  rationale: 采用中文圣经传统中通行的地名及族名译法。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名；正文以现代中文圣经读者最熟悉的“耶和华”保留其专名性质，而非改译为“主”。
- issue: 基甸称呼中的אֲדֹנִי指向
  choice: 作为尊称译为“我主”
  alternative: 作为神圣称号译为“主”
  rationale: 本句本身容许基甸只是在恭敬地称呼眼前的使者；不借大小写或释义性措辞提前解决叙事随后展开的身份问题。
- issue: וְיֵשׁ的逻辑关系
  choice: 条件性理解：“若……同在”
  alternative: 直陈式理解：“既然/而……同在”
  rationale: 基甸以当前苦难质疑“耶和华与我们同在”的宣告；条件式最自然地保存这一修辞张力，但不否认原文表层是并列存在句。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话保留基甸的恭敬开场、连续反问和由出埃及记忆转向现实苦难的强烈反差；避免文言化的“吾主”“列祖”，也不在使者身份上加入原文未明说的解释。
