  rationale: 修订补回原文“他的这一切奇妙作为在哪里呢？”的独立反问，并调整语序，使祖先所传述的出埃及事件成为该反问所指的具体传统。开场改为自然的现代汉语敬语，且以脚注保留“我主”的可能译法与身份歧义；其余核心专名、神名和权势习语均予保留。
