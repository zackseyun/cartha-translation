source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: zh_hans
  text: 约阿施对所有与他对峙的人说：“你们要为巴力争辩吗？你们要救他吗？凡为他争辩的，必在早晨以前被处死。巴力若是神，就让他为自己争辩吧，因为他的祭坛被拆毁了。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他拆毁了巴力的祭坛。”原文动词带第三人称阳性单数主语，却未指明其所指；可按上下文理解为基甸。
    reason: 原文以未明指的第三人称阳性单数动词陈述拆毁祭坛的行动。主文用被动句保留行动者未被点明的效果；脚注保留按上下文将其理解为基甸的主动句读法。
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: 站在那里与他对峙
  rationale: עָמַד עַל 在本语境中表示敌对地站在某人面前，而非单纯的空间位置；“与他对峙”自然传达众人向约阿施施压的情景。
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: 争辩／争辩／为自己争辩
  rationale: 三个动词同出 ריב，兼有争讼、抗争和替人出头之意；统一译作“争辩”以保留原文的修辞重复，又不把法律或武力色彩说得过死。
- source_word: תּוֹשִׁיעוּן
  choice: 救
  rationale: ישׁע 的使役式在此指拯救、搭救；“救”简洁地保留了反讽：敬拜者竟要拯救他们的神。
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: 凡为他争辩的
  rationale: 不定关系结构表达适用于任何人的警告；“凡……的”符合庄重而自然的现代汉语。
- source_word: יוּמַת
  choice: 被处死
  rationale: 该词为使役被动式，所指不是自然死亡，而是由人执行死刑。
- source_word: עַד הַבֹּקֶר
  choice: 在早晨以前
  rationale: 保留该短语所表达的时间界限，并依上下文呈现为处死的期限；不额外指定执行方式。
- source_word: אֱלֹהִים הוּא
  choice: 巴力若是神
  rationale: 这里的 אֱלֹהִים 是对巴力所谓神性的条件性表述，并非称巴力为以色列的神；汉语“若是神”自然保留这种质疑语气。
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: 因为他的祭坛被拆毁了
  rationale: 希伯来语动词为第三人称阳性单数，却没有明说主语。主文采用汉语被动句，突出祭坛遭拆毁这一事实，避免擅自补出基甸，同时以脚注保留主动句的可能理解。
- source_word: וַיֹּאמֶר
  choice: 约阿施……说
  rationale: 叙事连接词在汉语中无需机械译为“于是”或“但是”；直接引出约阿施的回应，更符合现代汉语叙事习惯。
theological_decisions:
- issue: אֱלֹהִים 在本句中是否指真神
  choice: 译作“神”，并以“巴力若是”明确这是对巴力神性主张的条件性说法
  alternative: 译作“上帝”或“神明”
  rationale: 说话者是在反问：巴力若真具有神性，就应自行申辩；原文并未认定巴力就是以色列的神。“神明”会增加原文没有的分类色彩，“上帝”则容易造成误解。
- issue: 拆毁祭坛者是否在主文中明确为基甸
  choice: 主文采用被动表达，不明说行动者
  alternative: 译作“因为他拆毁了巴力的祭坛”，并把“他”理解为基甸
  rationale: 原文动词带第三人称阳性单数，但主语没有明说。上下文强烈指向基甸，然而主文不补明姓名可保存原文的语法含混；替代读法置于脚注。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“争辩”的重复对应原文 ריב 的三次重复，保留约阿施话语中的反讽和挑战。代词以男性“他”指巴力，符合叙事中的人格化表达；脚注标记置于相关末句之后。
