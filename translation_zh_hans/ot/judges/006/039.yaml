base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: zh_hans
  text: 基甸对上帝说：“求你不要向我发怒[a]，容我只再说这一次。请让我只这一次用羊毛来试验[b]：愿只有羊毛是干的，遍地[c]都有露水。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是希伯来语惯用语，直译为“不要让你的怒气向我燃烧”。
    reason: lexical_alternative
  - marker: b
    text: “试验”也可译作“试”或“检验”；这里指基甸借羊毛进行这一次试验。
    reason: lexical_alternative
  - marker: c
    text: “遍地”也可译作“所有地面”或“整片土地”；这里指羊毛周围的地面，与羊毛本身相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: 求你不要向我发怒
  rationale: 这是希伯来语以“怒气燃烧”表达发怒的惯用语。正文采用自然、庄重的现代汉语，脚注保留原文的火焰意象。
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: 容我只再说这一次
  rationale: 意愿式动词在此带有恳求意味；“只再说这一次”保留限制语气，也符合基甸谨慎请求的语境。
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם בַּגִּזָּה
  choice: 求你让我只用这羊毛试一次
  rationale: נסה可指“试、检验”；正文保留“试”所具有的张力，不把它弱化为单纯“求印证”，也不额外加重为敌意的试探。介词短语译为“用这羊毛”，表明羊毛是这次试验所凭借的物件。
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: 愿只有羊毛是干的
  rationale: חֹרֶב在此指干燥状态，并非大范围的旱灾；汉语用状态句比直译“有干燥”自然，同时保留“只有”的排他意义。
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: 遍地都有露水
  rationale: הָאָרֶץ在羊毛与周围区域的对比中指地面或附近土地，不应理解为整个世界；“遍地”自然地表达羊毛周围全都有露水。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处带冠词的אֱלֹהִים在叙事中明确指以色列的上帝；“上帝”是现代标准汉语中自然且庄重的称呼。
theological_decisions:
- issue: 基甸请求再次用羊毛试验，是否应译得更具谴责意味或更显虔敬
  choice: 按原文译作谨慎地请求再试一次，不在正文中加入赞许或责备
  alternative: 译成带明显负面色彩的“试探上帝”，或弱化成单纯“寻求印证”
  rationale: 原文一方面写基甸担心上帝发怒，另一方面明确使用נסה“试”；译文保留这种神学张力，不替叙事作出评断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“求你”“容我”“愿”体现基甸恳求的语气，却不过度古雅；两个“只／一次”保留原文反复限制请求的修辞重点。
