  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: zh_hans
  text: 于是，基甸从自己的仆人中带了十个人，照着雅威对他所说的话去做。可是，因为他害怕父亲的家人和城里的男人，不敢在白天做这事[a]，便在夜里做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“因害怕……而未在白天做。”原文的结构表示他的恐惧使他没有在白天做这事。
    reason: 说明מֵעֲשׂוֹת יוֹמָם在“害怕”之后所表达的受阻／未能于白天行动的含义，避免把解释性“不能”误称为字面直译。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 带了
  rationale: 在此不是单纯取得物件，而是带领十个人同行办事；现代汉语用“带了”最自然。
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: 十个人
  rationale: אֲנָשִׁים在语境中指男性，但汉语数量短语“十个人”自然且并未改写所指；后文明确的城中男性则译作“男人”。
- source_word: מֵעֲבָדָיו
  choice: 从自己的仆人中
  rationale: עֶבֶד可指仆人或奴仆；本节未突出受奴役身份。“中”保留介词מִן的部分义。
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: 照着雅威对他所说的做了
  rationale: 保留“说”与基甸按所说内容行动之间的对应，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的中文音译呈现四字神名，保留其专名性质，不用称号替代。
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 可是，因为
  rationale: 希伯来语在此引入解释性的情境，并与原本应在白天执行形成叙事转折；这样译自然地表达两层关系。
- source_word: יָרֵא
  choice: 害怕
  rationale: 这里指对人群的惧怕，直译为现代常用的“害怕”。
- source_word: בֵּית אָבִיו
  choice: 父亲的家族
  rationale: בֵּית אָב指以父系为中心的家庭或宗族单位，并非仅指房屋；“家族”较准确。
- source_word: אַנְשֵׁי הָעִיר
  choice: 城里的男人
  rationale: 保留אַנְשֵׁי明确的男性指称；“城里的”比“城中的”更口语自然，又不失庄重。
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: 不敢在白天做这事
  rationale: 介词מִן接不定式在惧怕语境中表示因恐惧而受阻。“不敢”清楚传达其实际含义；脚注保留较直译的结构。
- source_word: וַיַּעַשׂ לָיְלָה
  choice: 就改在夜里做了
  rationale: “夜里”与前文“白天”形成明确对照；“改在”把隐含的时间转移自然表达出来。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留专名性质，也与当前学界较普遍的复原读音相符；不以称号“主”替代。
- issue: 基甸的顺服与惧怕之间的张力
  choice: 既说他照着吩咐做，又说他因害怕而夜间执行
  alternative: 把夜间行动解释为不顺服，或淡化他的恐惧
  rationale: 原文并列呈现他的执行和恐惧，没有进一步作神学评判；译文保留这种张力，不替叙事下结论。
translation_notes:
  register: 采用现代、清楚而庄重的叙事汉语。“于是／可是／就”呈现事件推进、原因和结果；避免古奥表达。主文中的脚注标记[a]与脚注完全对应。
