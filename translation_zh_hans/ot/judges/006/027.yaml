revisions:
- from: 于是，基甸从自己的仆人中带了十个人，照着雅威对他所说的做了。可是，因为他害怕父亲的家族和城里的男人，不敢在白天做这事[a]，就改在夜里做了。
  to: 于是，基甸从自己的仆人中带了十个人，照着雅威对他所说的话去做。可是，因为他害怕父亲的家人和城里的男人，不敢在白天做这事[a]，便在夜里做了。
  rationale: 修订删除“改”所附加的计划变更含义，调整“父亲的家族”以更贴近“父亲的家／家户”，并使动词搭配更自然。脚注改为准确区分原文结构与其语义解释；不改变经文的叙事张力或神学含义。
