  - severity: low
    issue: “父亲的家族”范围略偏宽
    rationale: בֵּית אָבִיו指父亲的家／家户，包含家庭单位而不必指广义宗族。译作“父亲的家人”在现代汉语中较自然且更贴近上下文。
  - severity: low
    issue: 脚注将“不能”称作“较直译”不够严谨
    rationale: מִן加不定式在此表达恐惧造成未能／不敢于白天行动的结果；“不能”是解释性表达，并非字面对应。脚注宜明确说明其结构及语义。
  revised_text: 于是，基甸从自己的仆人中带了十个人，照着雅威对他所说的话去做。可是，因为他害怕父亲的家人和城里的男人，不敢在白天做这事[a]，便在夜里做了。
