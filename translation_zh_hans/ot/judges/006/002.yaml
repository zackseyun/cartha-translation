revisions:
- from: 米甸的势力压倒了以色列。以色列人[a]为了躲避米甸，就在山中为自己修造藏身洞穴[b]、山洞和堡垒。
  to: 米甸的势力胜过以色列。由于米甸，以色列人[a]为自己造了山中的藏身处[b]、洞穴和堡垒。
  rationale: 修订保留“手”作为权势习语的意译，同时以“胜过”避免过度暗示一次性军事击败。将“为了躲避”改为“由于米甸”，保留原文的因果范围；将“修造”改为“造了”，不预断这些处所均为新建。罕见的מִנְהָרוֹת译为宽泛的“藏身处”，并以脚注保留其词义不确定性，且与随后较明确的“洞穴”相区分。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:21:15Z'
