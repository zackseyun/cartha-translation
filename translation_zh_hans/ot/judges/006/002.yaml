base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: zh_hans
  text: 米甸的势力胜过以色列。由于米甸，以色列人[a]为自己造了山中的藏身处[b]、洞穴和堡垒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 译作“藏身处”的希伯来语词十分罕见，也可理解为“地洞”或“洞穴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז יַד מִדְיָן עַל יִשְׂרָאֵל
  choice: 米甸的势力压倒了以色列
  rationale: “手”在此是表示力量或控制的希伯来语习语。汉语直译“米甸的手”较生硬，因此译为“势力”；“压倒”表达米甸对以色列占据优势并施行压迫。
- source_word: מִפְּנֵי מִדְיָן
  choice: 为了躲避米甸
  rationale: 该短语在语境中表示以色列人因米甸的威胁而采取避难措施；“为了躲避”自然呈现行动的原因和目的。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，这里用现代汉语通常的集体称谓“以色列人”，并以脚注保留原文形式。
- source_word: עָשׂוּ לָהֶם
  choice: 为自己修造
  rationale: 既保留反身受益意义，也体现这些避难处经过建造或整备；不限定所有地点均为从无到有地开凿。
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  choice: 山中……藏身洞穴
  rationale: מִנְהָרוֹת 是罕见词，可能指洞穴、地洞或藏身处。译文保留山中位置和避难功能，同时以脚注说明词义不确定。
- source_word: הַמְּעָרוֹת
  choice: 山洞
  rationale: 该词通常指天然洞穴；“山洞”简明自然，并与前一罕见词所译的“藏身洞穴”有所区分。
- source_word: הַמְּצָדוֹת
  choice: 堡垒
  rationale: 表示可供防守的坚固处或据点；“堡垒”在现代汉语中准确、易懂。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。首句将希伯来语“手”的权势习语意译为“势力”；次句避免机械重复“因为米甸”，以“为了躲避米甸”明确语境关系。保留罕见地形词的词义不确定性，并将脚注标记置于正文相应位置。
