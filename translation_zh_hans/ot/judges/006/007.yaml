  yaml_path: translation/ot/judges/006/007.yaml
  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: zh_hans
  text: 以色列人因米甸的缘故向耶和华呼求时，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ……时
  rationale: 这一组合引出新的叙事发展及其时间从句。现代汉语通常无需另译“事情发生了”，用“……时”即可自然保留时间关系；本节句子延续到下一节，故以逗号收束。
- source_word: זָעֲקוּ
  choice: 呼求
  rationale: 该动词表示人在困苦中迫切求助；“呼求”兼具高声呼喊和向神求援之意。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，在这里是指以色列民整体；“以色列人”是准确、自然且不造成性别范围误解的现代汉语表达。
- source_word: אֶל יְהוָה
  choice: 向耶和华
  rationale: 介词 אֶל 表示呼求所指向的对象；“向”符合现代汉语搭配。专名 יְהוָה 音译为“耶和华”，明确保留神的名字。
- source_word: עַל אֹדוֹת מִדְיָן
  choice: 因米甸的缘故
  rationale: עַל אֹדוֹת 在此说明呼求的缘由；“因……的缘故”保留原文略为郑重的因果表达，而“米甸”在上下文中可指米甸人及其压迫。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者熟悉的专名“耶和华”，而不以“主”替代，从而保留其作为名字的性质；“雅威”是另一种较接近学界拟音的译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。本节在希伯来文中是未完句，内容接续第8节，因此保留句末逗号。未设置脚注，因为正文“以色列人”和“因米甸的缘故”已充分传达语义，字面形式不影响理解。
