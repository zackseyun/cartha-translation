  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: zh_hans
  text: 他派使者走遍玛拿西全境，玛拿西人也应召跟随他。他又派使者到亚设、西布伦和拿弗他利各处，他们便上去与他们相会。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们便上去迎接他们。”希伯来语中的“他们”为复数，所指并不明确；按上下文，较可能指敌军，也可理解为他们上去与基甸及随从会合。
    reason: 保留לִקְרָאתָם中复数代词的原文歧义，避免正文将其所指和行动性质限定为迎战敌军。
lexical_decisions:
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 在军事动员的语境中，指奉命传达召集令的人，并非天使；“使者”准确、自然。
- source_word: בְּכָל מְנַשֶּׁה
  choice: 走遍玛拿西全境
  rationale: 介词短语表示使者在整个玛拿西地区巡行传令；此译清楚传达范围的周遍性。
- source_word: וַיִזָּעֵק גַּם הוּא אַחֲרָיו
  choice: 玛拿西人也应召跟随他
  rationale: Niphal形式在此有军事召集之意；补出“玛拿西人”使中文指代清楚，“跟随他”表达集结在基甸之后。
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: 到亚设、西布伦和拿弗他利各处
  rationale: 重复的介词表示使者进入这些支派的地域传令；“到……各处”符合现代汉语习惯。
- source_word: וַיַּעֲלוּ
  choice: 上去
  rationale: 保留希伯来语表示上行或军事推进的叙事用语。
- source_word: לִקְרָאתָם
  choice: 迎战敌军
  rationale: 希伯来语后缀明确为复数，而先行词未明说；结合敌军已在耶斯列谷集结的上下文，将其理解为前去迎击敌方诸军，但以脚注保留另一种可能。
theological_decisions:
- issue: לִקְרָאתָם中复数后缀的所指
  choice: 所召集的各支派上去迎战敌军
  alternative: 他们上去会合基甸及其军队
  rationale: 后缀是复数，但经文本身没有明确指出所指。上下文较支持敌方军队，不过这种歧义不宜被绝对化，因此在脚注中保留另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“应召”简洁表达军事动员；“迎战敌军”在正文中使复数所指自然明晰，同时由脚注保留原文的不确定性。
