base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: zh_hans
  text: 耶和华的使者来到，坐在俄弗拉那棵属于亚比以谢人约阿施的橡树[a]下。当时，约阿施的儿子基甸正在酒榨里打麦子，好把麦子藏起来，免得被米甸人发现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “橡树”所译的希伯来词也可能指笃耨香树，确切树种不详。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 耶和华的使者
  rationale: מַלְאַךְ 可指“使者”或“天使”。本段叙事表明来者具有超自然身份，但汉语“使者”仍保留原词的使者含义及人物身份逐步显明的叙事张力。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译“耶和华”，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: הָאֵלָה
  choice: 橡树
  rationale: 该树名可指笃耨香树一类的大树，具体树种并不完全确定；正文采用普通读者熟悉的传统译法“橡树”，脚注保留另一可能。
- source_word: בְּעָפְרָה
  choice: 在俄弗拉
  rationale: 按希伯来地名音译；此处作地点状语。
- source_word: אֲשֶׁר לְיוֹאָשׁ אֲבִי הָעֶזְרִי
  choice: 那棵属于亚比以谢族人约阿施的
  rationale: 保留树木归约阿施所有及约阿施所属宗族两层信息，并调整语序，使中文自然清楚。
- source_word: חֹבֵט חִטִּים
  choice: 正在……打麦子
  rationale: חבט 具体指击打谷物使籽粒脱落；“打麦子”比宽泛的“打谷”更贴合宾语 חִטִּים，也适合酒榨这一非常规场所。
- source_word: בַּגַּת
  choice: 在酒榨里
  rationale: 保留 בְּ 的空间含义，呈现基甸躲在低洼酒榨中作业的反常场景。
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: 好把麦子藏起来，免得被米甸人发现
  rationale: הניס 字面有“使逃离、移走”之意；结合米甸人抢掠粮食的语境，译出基甸把麦子置于敌人视线和掌控之外的目的。希伯来文用“米甸”指其族人，中文据语境译为“米甸人”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文读者最广泛识别的神名形式，并明确保留专名；“雅威”更接近学界常见的拟音，但尚未成为普通中文的主流形式。
- issue: מַלְאַךְ יְהוָה 的身份表达
  choice: 耶和华的使者
  alternative: 耶和华的天使
  rationale: “使者”贴近 מַלְאַךְ 的基本词义，也不提前断定这位人物与耶和华之间更具体的本体关系，从而保留本段后续叙事的神学张力；上下文仍足以显出他并非普通使臣。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将连续的希伯来叙事句式分为两个中文句子，并以“当时”表达同步背景。人名、地名采用中文圣经中通行的“俄弗拉、亚比以谢、约阿施、基甸、米甸”。
