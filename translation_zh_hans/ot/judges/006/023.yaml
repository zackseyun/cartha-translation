  text: וַ/יֹּ֨אמֶר ל֧/וֹ יְהוָ֛ה שָׁל֥וֹם לְ/ךָ֖ אַל תִּירָ֑א לֹ֖א תָּמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/023.yaml
  text: But Yahweh said to him[a], “Peace be to you. Do not fear; you shall not die.”
translation:
  language: zh_hans
  text: 耶和华对他说：“愿你平安[a]！不要害怕，你不会死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你平安无事。”希伯来语“沙龙”可表达平安、安好，也可用于安慰人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对他说
  rationale: 叙事体 wayyiqtol 在此自然译为“说”；结合 לְוֹ 译作“对他说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的形式音译四字神名，保留其专名性质，不以称号替代。
- source_word: שָׁלוֹם לְךָ
  choice: 愿你平安
  rationale: שָׁלוֹם 在此是安慰、保证平安的表达；“愿你平安”既保留祝福式措辞，也符合自然中文。
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: 准确表达 אַל 加未完成式所构成的禁止或劝止语气，且符合现代汉语习惯。
- source_word: לֹא תָּמוּת
  choice: 你不会死
  rationale: 这里是神对未来结果的明确保证；“不会死”在现代中文中自然、肯定而庄重。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文稿以广为人知的专名“耶和华”呈现，既不以“主”等称号替代，也避免正文使用对普通读者较陌生的形式。
- issue: שָׁלוֹם לְךָ 的语用功能
  choice: 愿你平安
  alternative: 你平安无事
  rationale: 原语既可作为平安祝语，也可在此语境中表达安慰和保证。正文保留祝语形式，并以脚注说明其语义范围，不把含义限定为单纯无危险。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“愿你平安”保留原文祝福兼安慰的语气；“你不会死”比“你必不至死”更符合当代用语，同时保持神圣宣告的确定性。
