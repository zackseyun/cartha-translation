base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: zh_hans
  text: “请不要离开这里，等我回来，把我的供物[a]拿出来，摆在你面前。”他说：“我会留在这里，直到你回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼物”或“贡物”。希伯来语这个词广义上可指献呈的礼品，在某些语境中也可指供物。
    reason: 词义存在真实的语境歧义，需要保留其作为礼物、贡物或宗教供物的可能性。
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: 离开这里
  rationale: מוש在此表示从所在之处移开或离去；“离开这里”是自然、准确的现代汉语。
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: 等我到你这里来
  rationale: 将带第一人称后缀的不定式结构译为自然的汉语分句，并保留“到你这里”的方向含义。
- source_word: וְהוֹצֵאתִי
  choice: 把……拿出来
  rationale: 使役式在这里指基甸从别处把所预备的东西带出来；“拿出来”符合场景和现代汉语习惯。
- source_word: מִנְחָתִי
  choice: 我的供物
  rationale: מִנְחָה可指献呈的礼物、贡物或供物；“供物”保留本段逐渐显出的敬献意味，又不把它过早限定为专门的素祭。
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: 摆在你面前
  rationale: 准确表达将物品放置在对方面前的意思，语言自然庄重。
- source_word: אָנֹכִי אֵשֵׁב
  choice: 我会留在这里
  rationale: ישב字面可指坐下，但此处语境强调留在原处等候；补出“这里”使汉语意思清楚。
- source_word: עַד שׁוּבֶךָ
  choice: 直到你回来
  rationale: 将带第二人称后缀的不定式结构译作自然的时间分句。
- source_word: נָא
  choice: 请
  rationale: 该语气词表达恳求或礼貌请求，“请”在现代汉语中简洁恰当。
theological_decisions:
- issue: מִנְחָה在基甸献呈之物中的含义
  choice: 供物
  alternative: 礼物、贡物、素祭
  rationale: 该词语义宽泛，而后续叙事又使这次献呈带有敬献和祭祀色彩。“供物”既保留这种宗教意味，也不把所献之物过度限定为律法意义上的“素祭”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。请求语气以“请”表达；对话简洁直接。将脚注标记置于“供物”之后，使其明确对应存在词义歧义的מִנְחָה。
