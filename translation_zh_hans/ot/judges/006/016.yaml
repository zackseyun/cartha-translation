base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: zh_hans
  text: 耶和华对他说：“我必与你同在；你必击打米甸，如同击打一人一样[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“如同一人”。这句希伯来语可指把米甸全体看作一人来击打，也可表达如同对付一人般的果断；原文措辞简洁。
    reason: 说明“如同一人”这一希伯来语比较短语的直译及其可能含义，而不将其解释限定为单一意思。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”对应四字神名，保留其作为以色列之神专名的功能，而不改译为称号“主”。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 对他说
  rationale: 准确表达叙事中的言说动作及间接宾语；汉语无需机械保留句首连接词，也能自然承接上文。
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: 我必与你同在
  rationale: 未完成式在应许语境中指向将来的保证；“必”也传达 כִּי 在此所带的强调、确证语气，而不强行限定为因果关系。
- source_word: וְהִכִּיתָ
  choice: 你必击败
  rationale: 该动词在战争语境中可指击打或击败；“击败”在汉语中自然清楚，并保留后续应许所表达的结果。
- source_word: אֶת מִדְיָן
  choice: 米甸
  rationale: 依照原文保留集体性的地名／族名“米甸”，不扩写为“米甸人”。
- source_word: כְּאִישׁ אֶחָד
  choice: 如同击败一个人一样
  rationale: 保留“一人”的单数比喻，并在汉语中补出承前省略的“击败”，使表达自然；该措辞仍容许理解为米甸全体仿佛一人，强调彻底而果断的胜利。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均为神名音译；正文采用现代中文圣经读者最熟悉且明确作为专名使用的“耶和华”，不以“主”替代神名。
- issue: כְּאִישׁ אֶחָד 的比喻所指
  choice: 如同击败一个人一样
  alternative: 像一个人那样／如同一人
  rationale: 语境更可能是把整个米甸视作一人而予以击败，但原文短语简练，可能产生方式或整体性的语感；正文与脚注不把这种张力完全消除。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式简洁，保留神名、应许语气和“一人”的原文意象；脚注标记置于其实际说明的短语之后。
