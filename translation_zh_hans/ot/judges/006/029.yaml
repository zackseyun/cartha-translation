base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: zh_hans
  text: 众人彼此问[a]：“这事是谁做的？”他们查问追查后，就说：“这事是约阿施的儿子基甸做的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“各人对他的邻舍说”，意思是众人互相询问。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: 众人彼此问
  rationale: 这是表示相互交谈的希伯来语习语，直译为“各人对他的邻舍说”。译作“众人彼此问”既传达分布、相互的意思，也符合现代汉语叙事表达。
- source_word: מִי
  choice: 谁
  rationale: 直接保留询问行为者的疑问代词。
- source_word: עָשָׂה
  choice: 做
  rationale: 此处指已经实施的行动；现代汉语用“做”自然，也不额外界定该行动的性质。
- source_word: הַדָּבָר הַזֶּה
  choice: 这事
  rationale: דָּבָר 在这里指刚被发现的行动或事件。“这事”自然、宽泛，保留了可理解为“这件事”或“这种行为”的语义空间。
- source_word: וַיִּדְרְשׁוּ וַיְבַקְשׁוּ
  choice: 查问追查
  rationale: 两个相连动词分别表达询问调查和进一步寻找、追索。用两个不同的汉语动词保留原文的递进与并列，而不把它们合并为单一动作。
- source_word: וַיֹּאמְרוּ
  choice: 就说
  rationale: 保留 אמר 的普通言说含义，不加强为“断定”或“查明”；“就”自然连接查问追查后的叙事结果。
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: 约阿施的儿子基甸
  rationale: 按照现代汉语自然语序表达希伯来语父系称谓，并采用通行圣经人名译法。
