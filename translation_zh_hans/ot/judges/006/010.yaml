  text: וָ/אֹמְרָ֣/ה לָ/כֶ֗ם אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם לֹ֤א תִֽירְאוּ֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יוֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קוֹלִֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: zh_hans
  text: 我曾对你们说：‘我是雅威，你们的神。不可敬畏[a]亚摩利人的神明；你们正住在他们的土地上。可是，你们没有听从我的话[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“惧怕”或“敬奉”；希伯来语在这里表达禁令。
    reason: lexical_alternative
  - marker: b
    text: “听从我的话”直译为“听我的声音”，也含有“服从我”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: 我曾对你们说
  rationale: 用“曾”点明这是雅威先前对以色列人所说的话；“说”直接对应 אמר，并保留叙事中的回顾语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见现代汉语音译处理，保留其作为专名的性质，不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: אֱלֹהִים 虽有复数词形，此处指以色列的神，语义为单数。
- source_word: לֹא תִירְאוּ
  choice: 不可敬畏
  rationale: 否定词加未完成式在此表达禁令。“敬畏”既可涵盖惧怕，也能保留上下文中对异族神明表示宗教性尊崇的可能含义。
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  choice: 亚摩利人的神明
  rationale: 希伯来语以单数族称统指亚摩利人；“神明”自然表达其所敬奉的诸神，并与真神的称谓有所区分，但不改变原文复数意义。
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: 你们正住在他们的土地上
  rationale: ישב 在此表示居住；“正住在”自然传达当时持续的居住状态。“他们”回指亚摩利人。
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: 可是，你们没有听从我的话
  rationale: שמע בקול 是“听声音”并进而“听从、服从”的惯用表达；“听从我的话”在现代汉语中自然保留聆听与顺服的双重意味。“可是”体现此句与先前禁令之间的转折。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。采用“雅威”作为四字神名的现代音译，避免以“主”这一称号取代专名；“耶和华”则是另一种传统音译。
- issue: לֹא תִירְאוּ 中“惧怕”与“敬奉”的张力
  choice: 不可敬畏
  alternative: 不可惧怕；不可敬奉
  rationale: ירא 可指害怕，也可指带有宗教意味的敬畏。鉴于宾语是亚摩利人的神明，“敬畏”较能保留这两层可能，不把经文单向限定为情绪上的恐惧或敬拜行为。
- issue: שמע בקול 的听见与顺服含义
  choice: 听从我的话
  alternative: 听我的声音；服从我
  rationale: 该希伯来语惯用语通常含有顺服之意。“听从”在汉语中兼具听与遵从的含义，不将其神学意义削弱为单纯听见，也不完全抹去原文的声音意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”简洁表达禁令；“可是”清楚呈现责备性的转折。保留原文中“敬畏”的语义张力，并用脚注说明“听从”背后的希伯来语声音意象。
