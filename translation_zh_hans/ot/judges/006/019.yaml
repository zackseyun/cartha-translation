  text: וְ/גִדְע֣וֹן בָּ֗א וַ/יַּ֤עַשׂ גְּדִֽי עִזִּים֙ וְ/אֵיפַת קֶ֣מַח מַצּ֔וֹת הַ/בָּשָׂר֙ שָׂ֣ם בַּ/סַּ֔ל וְ/הַ/מָּרַ֖ק שָׂ֣ם בַּ/פָּר֑וּר וַ/יּוֹצֵ֥א אֵלָ֛י/ו אֶל תַּ֥חַת הָ/אֵלָ֖ה וַ/יַּגַּֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: zh_hans
  text: 基甸进去，预备了一只小山羊，又用一伊法[a]细面做了无酵饼。他把肉放在篮子里，把汤盛在锅里，便端出来，带到那人那里，在笃耨香树[b]下摆在他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊法”是古代的干量单位；其准确容量不能完全确定，通常估计约为二十多升。
    reason: 说明古代度量衡，既保留原文特定单位，也帮助现代读者理解其大致分量。
  - marker: b
    text: 或译“橡树”。这里的希伯来词更可能指笃耨香树一类；“橡树”是传统译法。
    reason: 保留树种辨识上的词义差异，并注明常见传统译法。
lexical_decisions:
- source_word: בָּא
  choice: 进去
  rationale: 结合上文，基甸离开来客去预备食物；“进去”自然表达他进入住处或备餐之处，也符合该动词在语境中的移动方向。
- source_word: וַיַּעַשׂ
  choice: 预备
  rationale: 此处谈烹调食物，“预备”比直译为“做”更符合现代汉语，同时保留动词的宽泛含义。
- source_word: גְּדִי עִזִּים
  choice: 一只山羊羔
  rationale: 该结构指幼小的山羊；“山羊羔”简明自然，并明确动物种类。
- source_word: אֵיפַת קֶמַח
  choice: 一伊法细面
  rationale: 保留希伯来原文特定的干量单位“伊法”，并以脚注说明其性质；“细面”符合食物制作语境。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 指未经过发酵的饼；“无酵饼”是清楚、通行且适合本语境的表达。
- source_word: הַבָּשָׂר
  choice: 肉
  rationale: 在饮食语境中，“肉”是自然准确的现代汉语对应词。
- source_word: סַּל
  choice: 篮子
  rationale: 准确表达盛放或携带物品的编织容器，无须使用更技术化的名称。
- source_word: הַמָּרַק
  choice: 汤
  rationale: 该词指肉汁、汤汁或烹煮所得的液体；“汤”在现代汉语中自然，也不对浓稠程度作过度限定。
- source_word: פָּרוּר
  choice: 锅
  rationale: 指盛放或烹煮液体的器皿；“锅”简洁并符合上下文。
- source_word: וַיּוֹצֵא אֵלָיו
  choice: 拿到……那人那里
  rationale: 希伯来语动词为单数形式，但未明说宾语；汉语省略宾语，可自然涵盖前述肉和汤，同时避免强行确定其语法所指是单件还是整份食物。
- source_word: תַּחַת הָאֵלָה
  choice: 笃耨香树下
  rationale: אֵלָה通常指笃耨香树一类，而非严格意义上的橡树；正文保留较具体的树种，以脚注补充传统译法。
- source_word: וַיַּגַּשׁ
  choice: 摆在他面前
  rationale: 该动词基本义为“使靠近、呈上”；在款待食物的场景中，“摆在他面前”自然准确，又不提前把行动解释为献祭。
theological_decisions:
- issue: 基甸的举动是否应明确译作献祭
  choice: 采用款待和呈上食物的语言：“摆在他面前”
  alternative: “把这些献上”或“献作祭物”
  rationale: 本节只叙述预备、拿出并呈上食物。后文虽逐渐显出献祭意味，本节的希伯来语却没有明确说基甸献祭，因此不把后续含义提前写入正文，以保留叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句式依照原文动作顺序推进；“拿到……摆在……”利用汉语自然的连动结构，避免为希伯来语未明说的宾语强加单复数。“笃耨香树”虽较少见，但比“橡树”更贴近原词，并由脚注帮助普通读者。
