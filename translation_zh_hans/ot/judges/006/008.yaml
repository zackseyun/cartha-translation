language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אִ֥ישׁ נָבִ֖יא אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֥ר יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י הֶעֱלֵ֤יתִי אֶתְ/כֶם֙ מִ/מִּצְרַ֔יִם וָ/אֹצִ֥יא אֶתְ/כֶ֖ם מִ/בֵּ֥ית עֲבָדִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: zh_hans
  text: 于是，雅威差遣一个人，就是一位先知，到以色列人那里[a]。他对他们说：“雅威——以色列的上帝——如此说：是我领你们从埃及上来，又把你们从为奴之家领出来[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“到以色列的子孙那里”。
    reason: 说明惯用群体称谓בְּנֵי יִשְׂרָאֵל的字面形式。
  - marker: b
    text: 直译“从奴仆之家”；意思是从受奴役之地出来。
    reason: 保留בֵּית עֲבָדִים的具体字面意象，并说明其语境含义。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 那时……差遣
  rationale: 连续式叙事动词推动情节向前；“那时”在现代汉语中自然表达承接和推进，而“差遣”符合先知受命作使者的语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: אִישׁ נָבִיא
  choice: 一个人，就是一位先知
  rationale: 原文以两个名词同位，既说“一个人”，又说明他是“先知”；加入“就是”使汉语自然，同时不把两者缩减为单一称谓。
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: 到以色列人那里
  rationale: בְּנֵי יִשְׂרָאֵל是对以色列群体的惯用称呼；“以色列人”在现代汉语中准确、自然，直译“以色列的儿子们”容易被误解为仅指男性或雅各的亲生儿子。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留标准的先知使者宣告公式，语体庄重而清楚。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留原文的圣约性称号，并采用普通现代汉语读者熟悉的表达。
- source_word: אָנֹכִי
  choice: 是我
  rationale: 独立人称代词带有强调作用；“是我”在汉语中明确传达该强调，而不显累赘。
- source_word: הֶעֱלֵיתִי אֶתְכֶם מִמִּצְרַיִם
  choice: 领你们从埃及上来
  rationale: 保留עלה使役式所含“使上来”的方向意象，也符合出埃及叙事的传统空间表达。
- source_word: וָאֹצִיא אֶתְכֶם
  choice: 又把你们……领出来
  rationale: 表达יצא使役式“使出去、带出来”的含义；“又”自然连接平行的拯救行动。
- source_word: מִבֵּית עֲבָדִים
  choice: 从为奴之家
  rationale: 该短语字面为“奴仆之屋/奴隶之家”，在出埃及语境中指受奴役之地；“为奴之家”兼顾原文的“家/屋”意象与自然汉语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并采用较能反映YHWH学术重构读音的现代汉语形式；不以“主”这一称号取代。
- issue: בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 这里指整个圣约群体，并非刻意限定为男性。“以色列人”既保留群体身份，也避免现代读者把“儿子们”误读为性别限制。
- issue: בֵּית עֲבָדִים的具体意象与抽象含义
  choice: 为奴之家
  alternative: 奴隶之家；奴役之地
  rationale: 原文用“屋/家”与复数“奴仆”构成具体表达，但整体指埃及作为受奴役之地。“为奴之家”保留意象而不把埃及说成奴隶居住的普通房屋。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“一个人，就是一位先知”保留希伯来语同位结构；引语中的“如此说”保留先知宣告公式。两个脚注标记均放在其实际说明的短语之后。
