revisions:
- from: 那时，雅威差遣一个人，就是一位先知，到以色列人那里[a]。他对他们说：“雅威以色列的上帝如此说：是我领你们从埃及上来，又把你们从为奴之家领出来[b]。”
  to: 于是，雅威差遣一个人，就是一位先知，到以色列人那里[a]。他对他们说：“雅威——以色列的上帝——如此说：是我领你们从埃及上来，又把你们从为奴之家领出来[b]。”
  rationale: 修订仅处理两处中文表达：以“于是”自然承接叙事，并以破折号明确“以色列的上帝”是“雅威”的同位称号。其余译文和两则脚注均忠实、自然，无须更动。
