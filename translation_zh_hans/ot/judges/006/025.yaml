source:
  edition: WLC
  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה קַ֤ח אֶת פַּר הַ/שּׁוֹר֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וּ/פַ֥ר הַ/שֵּׁנִ֖י שֶׁ֣בַע שָׁנִ֑ים וְ/הָרַסְתָּ֗ אֶת מִזְבַּ֤ח הַ/בַּ֨עַל֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וְ/אֶת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו תִּכְרֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: zh_hans
  text: 那天夜里，雅威对他说：“把你父亲的那头公牛和第二头七岁的公牛牵来；拆毁你父亲的巴力祭坛，砍倒坛上的亚舍拉[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉”也可译作“亚舍拉柱”或“神木”。这个希伯来词在这里指与亚舍拉有关、可以砍倒的崇拜物，但其具体形制并不确定。
    reason: 保留 הָאֲשֵׁרָה 的词义和历史所指的不确定性。
  - marker: b
    text: “坛上的”直译为“在它上面的”，也可能指位于祭坛上、其上方，或与祭坛紧密相连。
    reason: 说明 אֲשֶׁר עָלָיו 的空间关系并不必然限于直接置于祭坛表面。
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: 那天夜里
  rationale: 以自然的现代汉语表达希伯来叙事的时间推进；不机械译出 וַיְהִי，但保留其承接叙事的功能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对四字神名的常见音译呈现专名，区别于称号“主”。
- source_word: קַח
  choice: 牵来
  rationale: 对象是公牛，译作“牵来”比泛泛的“拿”更符合现代汉语，同时保留命令语气。
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: 你父亲的那头公牛
  rationale: 自然表达所属关系；פַּר 指公牛或幼公牛，此处简洁译为“公牛”。
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: 和第二头公牛，就是那头七岁的
  rationale: 保留连接词 וּ，将其理解为另加一头牛，同时以同位说明保留“第二头”和“七岁”的特殊句法。
- source_word: וְהָרַסְתָּ
  choice: 拆毁
  rationale: 准确表达毁坏建筑性祭坛的强制动作，简洁自然。
- source_word: מִזְבַּח הַבַּעַל
  choice: 巴力祭坛
  rationale: 采用现代汉语中清楚、惯用的属格组合。
- source_word: הָאֲשֵׁרָה
  choice: 亚舍拉
  rationale: 采用音译，避免在正文中武断限定为木柱、木像或女神本身；上下文的“砍倒”表明这里指某种可砍伐的崇拜物。
- source_word: אֲשֶׁר עָלָיו
  choice: 坛上的
  rationale: 贴近 עַל 的基本空间义“在……上”；脚注保留也可能表示位于祭坛上方或与祭坛紧密相连的空间弹性。
- source_word: תִּכְרֹת
  choice: 砍倒
  rationale: 自然表达砍伐木质对象的动作。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 音译专名可保留原文将神名直接置于叙事中的特点，也避免以称号代替专名。
- issue: הָאֲשֵׁרָה 的所指
  choice: 亚舍拉
  alternative: 亚舍拉柱；神木；亚舍拉木像
  rationale: 该词可指与亚舍拉相关的崇拜物，其具体形制仍有争议；音译能够保留历史与宗教层面的歧义。
- issue: 两处 פַּר 是否指两头公牛
  choice: 译为两头公牛
  alternative: 你父亲的公牛，就是第二头七岁的公牛
  rationale: 第二个 פַּר 前有连接词 וּ，最自然地表示另加一头公牛；但希伯来语结构较紧凑，另一种同位理解仍属可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。命令句以“牵来、拆毁、砍倒”形成清晰有力的动作序列；不使用文言化的“是夜”“遂”等表达。
