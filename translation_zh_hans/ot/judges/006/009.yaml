base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: zh_hans
  text: 我从埃及人的手中，也从一切欺压你们之人的手中救了你们；我把他们从你们面前赶出去，将他们的土地赐给你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: 救了
  rationale: נצל在此表示从危险或权势控制下搭救、解救；“救了”简洁自然，并与后面的“从……手中”顺畅搭配。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语以“手”表达权势或控制的具体意象；这一说法在现代汉语中也清楚易懂。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 此处与“手中”连用，מִצְרַיִם可指作为压迫主体的埃及；译作“埃及人的手中”较“埃及的手中”自然，同时没有把含义泛化为单纯的地点。
- source_word: כָּל לֹחֲצֵיכֶם
  choice: 一切欺压你们之人
  rationale: לֹחֲצִים指施加压迫、逼迫的人；此译法准确保留动作含义，也比名词“压迫者”更符合自然、庄重的现代汉语。
- source_word: וָאֲגָרֵשׁ
  choice: 我把他们……赶出去
  rationale: גרש表示驱赶、逐出；“赶出去”准确、通顺，并符合夺地与赐地的语境。
- source_word: מִפְּנֵיכֶם
  choice: 从你们面前
  rationale: 保留原文“从你们面前／在你们面前离去”的空间表达，不额外限定具体方式。
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: 将他们的土地赐给你们
  rationale: 准确表达“把他们的地给你们”；“赐给”在上帝为施事者的庄重叙述中自然，并清楚保留其主动赐予。
theological_decisions:
- issue: 以色列获救并得地时上帝的主动作为
  choice: 三个动作都以上帝为第一人称主语：救、赶出、赐给。
  alternative: 弱化主语，把结果表达为以色列自行脱离压迫并取得土地。
  rationale: 原文连续使用第一人称单数动词，突出说话者在拯救、逐出和赐地中的直接行动；译文保留这一重点而不附加解释。
- issue: “他们”所指对象的范围
  choice: 保留代词“他们”，承接“一切欺压你们之人”。
  alternative: 明确改写为特定族群或迦南居民。
  rationale: 原文使用代词אוֹתָם和אַרְצָם，没有在本节进一步点明族群；译文不替原文消除这一指代上的概括性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语；保留“从……手中”和“从你们面前”等希伯来语具体意象。分号呈现连续而彼此相关的神圣行动，不添加原文没有的解释。
