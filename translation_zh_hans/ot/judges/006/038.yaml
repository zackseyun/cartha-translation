base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: zh_hans
  text: 事情果然如此。第二天，他一早起来，挤那团羊毛[a]，从中挤出露水，满满一碗水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按压那团羊毛”或“拧那团羊毛以挤出水分”。希伯来文连续使用两个动词，先描述挤压羊毛，再描述从中挤出露水。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: 事情果然如此
  rationale: 这是对基甸所求之兆确实发生的确认；“果然如此”既自然，也保留希伯来文简洁的肯定语气。
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: 第二天，他一早起来
  rationale: וַיַּשְׁכֵּם表示早起，מִמָּחֳרָת指次日；此译符合现代汉语叙事习惯。
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: 挤压那团羊毛
  rationale: 动词表示用力压挤；הַגִּזָּה在本段指剪下的一团羊毛。“挤压”不预先并入下一动词所表达的液体被挤出这一结果。
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: 从羊毛中拧出露水来
  rationale: וַיִּמֶץ表示挤出或榨出液体；“拧出”在汉语中清楚呈现从吸水羊毛中取出水分的动作，并与前一动词形成动作—结果的连续关系。
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: 足足有一碗水
  rationale: 原文表示水的量足以装满一个碗或盆状容器；“足足有一碗水”自然地保留满器的数量含义。
