  to: 他们就在以色列人那里安营，毁坏地里的出产，直到迦萨一带[a]；在以色列境内，他们不留下任何维生的资源，连羊、牛、驴也不留下。
  rationale: 修订将“安营”与“毁坏”恢复为原文的两个并列动作，避免把安营本身译成直接攻击；同时以自然的范围表达处理涉及迦萨的习语，并保留脚注。对 מִחְיָה 采用“维生的资源”，以保留其广泛的供养与生计含义。
