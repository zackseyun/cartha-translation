base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: zh_hans
  text: 他们就在以色列人那里安营，毁坏地里的出产，直到迦萨一带[a]；在以色列境内，他们不留下任何维生的资源，连羊、牛、驴也不留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“直到你来到迦萨”，这是表示所达到地理范围的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: 他们安营攻打以色列人
  rationale: חנה意为“安营”；עַל在这里带有敌对含义。上下文描述反复发生的侵袭，汉语无需另加“常常”也能由语境表达；将代词所指明说为“以色列人”，可避免中文指代含混。
- source_word: וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ
  choice: 毁坏地里的出产
  rationale: Hiphil词形וַיַּשְׁחִיתוּ表示毁坏、摧毁；יְבוּל涵盖土地的出产或收成，“地里的出产”既保留其广度，也符合现代汉语。
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: 直到通往迦萨之处
  rationale: בּוֹאֲךָ字面涉及“你来到／走近”，在地理范围表达中是惯用说法。“通往迦萨之处”比单说“直到迦萨”更贴近原文，同时保持可读性。
- source_word: וְלֹא יַשְׁאִירוּ מִחְיָה בְּיִשְׂרָאֵל
  choice: 在以色列境内，他们不留下任何维生之物
  rationale: מִחְיָה指维持生命或生活的东西，范围可包括食物、生计与生存资源；“维生之物”避免将其狭化为单纯口粮。בְּיִשְׂרָאֵל按其范围义译为“在以色列境内”。
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: 连羊、牛、驴也不留下
  rationale: 三个单数名词均有集合意义，指各类牲畜；采用现代汉语常用的类称“羊、牛、驴”。重复“不留下”清楚表明这些牲畜也在掠夺殆尽之列。
theological_decisions: []
