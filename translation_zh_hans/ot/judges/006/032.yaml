  text: וַ/יִּקְרָא ל֥/וֹ בַ/יּוֹם הַ/ה֖וּא יְרֻבַּ֣עַל לֵ/אמֹ֑ר יָ֤רֶב בּ/וֹ֙ הַ/בַּ֔עַל כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: zh_hans
  text: 因此，那一天他给他起名叫耶路巴力[a]，说：“让巴力与他争辩[b]，因为他拆毁了巴力的祭坛。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶路巴力”这个名字听起来与“争辩”一词有关；后面的话解释为“让巴力与他争辩”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“愿巴力与他争辩。”这个希伯来语动词也可能理解为陈述语气：“巴力会与他争辩。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: 他给他起名叫
  rationale: קרא ל在此表示给人命名；保留希伯来文的单数主语和宾语，不擅自明确主语所指。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然、准确地表达带介词的时间短语。
- source_word: יְרֻבַּעַל
  choice: 耶路巴力
  rationale: 按专名音译，并由后面的解释和脚注呈现它与ריב“争辩”的文字关联。
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: 让巴力与他争辩
  rationale: 将未完成式理解为祈使愿望语气；ריב可指争辩、争讼或抗争，“与他争辩”保留其宽泛的对抗性含义。
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: 因为他拆毁了巴力的祭坛
  rationale: נתץ指拆毁建筑或祭坛；将代词所指明示为“巴力”，使现代汉语清楚自然，而不改变其紧邻先行词。
theological_decisions:
- issue: בַּעַל在本节中的身份
  choice: 巴力
  alternative: 主、主人
  rationale: 这里指迦南神祇的专名或称号，不是泛称“主”，音译可避免与耶和华混淆。
- issue: יָרֶב的语气
  choice: 让巴力与他争辩
  alternative: 愿巴力与他争辩；巴力会与他争辩
  rationale: 希伯来文可理解为表达愿望的祈使语气，也可能被理解为陈述语气；正文采用较合上下文的祈使读法，并以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“给他起名叫”符合普通话命名表达；“拆毁祭坛”简明有力。正文保留两个“他”所造成的原文指代空间，不凭上下文擅自补出人物姓名。
