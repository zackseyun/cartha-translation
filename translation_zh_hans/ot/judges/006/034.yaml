  text: וְ/ר֣וּחַ יְהוָ֔ה לָבְשָׁ֖ה אֶת גִּדְע֑וֹן וַ/יִּתְקַע֙ בַּ/שּׁוֹפָ֔ר וַ/יִזָּעֵ֥ק אֲבִיעֶ֖זֶר אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: zh_hans
  text: 耶和华的灵披戴了基甸[a]；基甸吹响号角[b]，亚比以谢族人就应召前来跟随他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华的灵临到基甸。”原文直译为：“耶和华的灵披戴了基甸。”
    reason: lexical_alternative
  - marker: b
    text: 原文为“羊角号”，是一种用角制成、用于传递信号的号角。
    reason: cultural_note
  - marker: c
    text: 也可译：“亚比以谢族人就被召集来跟随他”，或“就聚集到他身后”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: 耶和华的灵
  rationale: רוּחַ 可指“灵、风、气息”；本段描述上帝赐能力的语境，宜译“灵”。神名 יְהוָה 采用现代中文圣经读者熟悉的“耶和华”。
- source_word: לָבְשָׁה אֶת־גִּדְעוֹן
  choice: 披戴了基甸
  rationale: לָבַשׁ 的基本意象是穿上或披戴衣物；此处“灵”是主语，基甸是宾语。保留不寻常而鲜明的原文比喻，不将其平化为单纯的“临到”。
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: 吹响号角
  rationale: שׁוֹפָר 是用于传递信号的角号，常由羊角制成。“号角”兼顾文化形态和现代中文可懂度。
- source_word: וַיִּזָּעֵק
  choice: 应召前来
  rationale: 此处为 Niphal 形式，在上下文中表示听到号角后被召集、聚集响应。“应召前来”自然地表达其被召而响应的含义，同时避免过度限定为正式军事征召。
- source_word: אֲבִיעֶזֶר
  choice: 亚比以谢族人
  rationale: 这里的专名作为集合称谓，指基甸所属的亚比以谢宗族，而非只指名为亚比以谢的单独个人。
- source_word: אַחֲרָיו
  choice: 跟随他
  rationale: 字面为“在他后面”，在此表示聚集到基甸一方并跟随他；“跟随他”在中文中自然保留方向与效忠两层意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用长期通行且普通读者熟悉的“耶和华”，不以“主”替代专名；“雅威”是较接近学界拟音的另一可行译法。
- issue: 圣灵赋能的衣着比喻
  choice: 耶和华的灵披戴了基甸
  alternative: 耶和华的灵临到基甸
  rationale: 原文并非通常的“临到”表达，而是以“穿上/披戴”为核心的反常规比喻。保留这一措辞，可呈现圣灵主动掌握并使用基甸的形象，而不进一步规定其系统神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“披戴了基甸”有意保留原文醒目的衣着比喻，并以脚注提供较通顺的解释性译法；“亚比以谢族人”明确其集合性所指；分号呈现圣灵赋能与基甸随后行动之间的紧密推进。
