id: JDG.6.15
reference: Judges 6:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: zh_hans
  text: 他对他说：“请问，主啊[a]，我凭什么能拯救以色列呢？你看，我所属的宗族[b]在玛拿西支派中最弱小[c]，我在父家中又是最年轻的[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”在这里也可作对尊贵者的敬称；原文没有明确限定基甸此时是在称呼人还是称呼神。
    reason: theological_ambiguity
  - marker: b
    text: “宗族”原文直译为“我的千”，在这里可指支派之下的宗族或家族群体。
    reason: lexical_alternative
  - marker: c
    text: “最弱小”也可译为“最贫穷”或“最微小”。
    reason: lexical_alternative
  - marker: d
    text: “最年轻的”也可译为“最微小的”或“地位最低的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: 请容我说
  rationale: 这是表示恳求或请求准许发言的语气词，并非表示地点；译为“请容我说”符合现代汉语的恭敬语气。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 原词可作对尊贵者的敬称，也可能带有对神的称呼意味；“主啊”保留叙事此处尚未完全揭明说话者身份的张力，并以脚注说明歧义。
- source_word: בַּמָּה
  choice: 我凭什么
  rationale: 字面为“借着什么”，在此询问自己能凭何种条件或能力完成拯救；“凭什么”既自然，也贴近原文所问的凭借。
- source_word: אוֹשִׁיעַ
  choice: 拯救
  rationale: 使役形动词在此意为救出、解救；“拯救”保留该词广泛的圣经语义。
- source_word: הִנֵּה
  choice: 你看
  rationale: 用于唤起听者注意，引出基甸对自身处境的说明；“你看”是自然的现代汉语表达。
- source_word: אַלְפִּי
  choice: 我所属的宗族
  rationale: אֶלֶף 字面与“千”有关，但在部族社会结构中可指宗族或部族分支；此处译作“宗族”可避免误解为人数。
- source_word: הַדַּל
  choice: 最弱小
  rationale: דַּל 可表示贫穷、卑微、弱小；上下文强调基甸缺乏地位和能力，“最弱小”较能涵盖此意，同时用脚注保留其他可能。
- source_word: בִּמְנַשֶּׁה
  choice: 在玛拿西支派中
  rationale: 这是以色列支派名称；补出“支派”使现代读者清楚比较范围。
- source_word: הַצָּעִיר
  choice: 最年轻的
  rationale: 该词可指年幼、微小或地位最低；在“父家”这一家庭语境中，“最年轻的”最为自然，同时以脚注保留“最微小”的可能。
- source_word: בְּבֵית אָבִי
  choice: 在父家
  rationale: 这是指父系家庭或家族单位的常用表达；“父家”简洁庄重，并能表达其家庭归属。
theological_decisions:
- issue: 基甸称呼中的 אֲדֹנָי 是敬称还是神圣称号
  choice: 译作“主啊”，并以脚注保留既可为敬称、也可能指向神圣称号的歧义
  alternative: 译作“大人”以明确表示对人的尊称，或译作“主”而明确视为对神的称呼
  rationale: 叙事在此尚保留基甸对说话者身份的认识张力；不宜在译文中提前把称呼完全限定为对人或对神。
- issue: 基甸所说 הַצָּעִיר 强调年龄还是地位
  choice: 正文采用家庭语境中最直接的“最年轻的”，脚注保留“最微小、地位最低”的含义
  alternative: 正文译作“地位最低的”
  rationale: “父家”支持年龄义，但该词也可能表达低微身份；正文与脚注共同保存双重可能。
translation_notes:
  register: 采用现代、庄重且适合朗读的普通话。“请容我说”传达恭敬请求，“我凭什么”保留基甸对自身能力与条件的质疑。正文不刻意古雅，也不提前消解说话者身份及基甸自称卑微所包含的语义张力。
