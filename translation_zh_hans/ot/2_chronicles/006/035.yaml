  text: then hear from heaven their prayer and their plea for favor[a], and maintain their cause.
translation:
  language: zh_hans
  text: 求你从天上垂听他们的祷告和恳求，并为他们主持公道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为他们伸张正义”，或“施行他们的审判”。希伯来文直译为“行他们的公正／审判”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: 求你……垂听
  rationale: 该完成时形式在所罗门向上帝的祷告中具有祈求语气；“求你”自然表达请求，“垂听”符合庄重而通俗的现代汉语祷告用语。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: שָׁמַיִם虽为复数形式，在此是指上帝垂听祷告之处；汉语惯用“从天上”。
- source_word: תְּפִלָּתָם
  choice: 他们的祷告
  rationale: תְּפִלָּה是一般性的祷告用语；单数附复数物主后缀，可自然译为集合意义的“他们的祷告”。
- source_word: תְּחִנָּתָם
  choice: 恳求
  rationale: תְּחִנָּה指恳切求恩、求怜悯；“恳求”在现代汉语中简明自然，并保留其迫切意味。
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: 并为他们主持公道
  rationale: 字面为“施行他们的审判／公正”，语境中指上帝为他们作出公正裁断、维护其正当诉求；“为他们主持公道”兼顾司法意味与现代汉语表达。
theological_decisions:
- issue: 上帝回应祷告时所用司法性措辞的译法
  choice: 为他们主持公道
  alternative: 施行他们的审判；为他们伸张正义；维护他们的权益
  rationale: מִשְׁפָּט可指审判、公正、权利或案件。此处不仅求上帝听见，也求他以审判者身份采取行动。“主持公道”保留司法和伸冤意味，同时不把原文限定为某一种具体法律程序。
translation_notes:
  register: 采用庄重、自然、易懂的现代标准汉语。“求你……垂听”体现祷告语境；“主持公道”避免生硬直译，同时以脚注保留מִשְׁפָּט的多义性。
