base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: zh_hans
  text: 使他们在你赐给我们祖先的这片土地上活着的日子里，敬畏你，行在你的道路上。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“尊崇你”或“对你心存敬惧”。这里的希伯来语包含敬畏与尊崇，并表现为顺服。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“只要他们在这片土地上活着”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 使
  rationale: 引出目的或结果；“使他们……”在现代汉语中自然，并保留原文的目的意味。
- source_word: יִירָאוּךָ
  choice: 敬畏你
  rationale: ירא在此指向对上帝既有畏惧又有尊崇、并落实于顺服的态度；“敬畏”比单用“害怕”更完整地传达其盟约语境。
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: 遵行你的道路
  rationale: 字面为“行在你的道路中”；汉语“遵行你的道路”自然表达按照上帝所规定的方式生活，同时保留“道路”的意象。
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: 活着的一切日子
  rationale: 保留原文具体的“日子”表达；其实际含义是他们一生在世之时。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 在这片土地上
  rationale: 原文含“在土地表面上”的表达；现代汉语省去生硬的“地面之上”，而“这片土地”由随后“你赐给我们祖先的”限定，指应许之地。
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: 你赐给我们祖先的
  rationale: 表达已经完成的神圣赐予；“祖先”在现代汉语中比“列祖”更通俗，同时准确指以色列的先祖。
theological_decisions:
- issue: “敬畏”与盟约顺服的关系
  choice: 正文采用“敬畏你”，并以“遵行你的道路”表明其行为表现。
  alternative: “惧怕你”或“尊崇你”
  rationale: 原文ירא兼具畏惧、尊崇和顺服的意味；“敬畏”保留这种张力，不把它缩减为恐惧或一般尊敬。
- issue: הָאֲדָמָה的范围
  choice: 译作“这片土地”。
  alternative: “大地”或“地面”
  rationale: 后面的关系从句说明这是上帝赐给“我们祖先”的土地，因此语境指盟约之地，而非普世大地或单纯土壤。
- issue: לָלֶכֶת与前一动词的关系
  choice: 译作并列式“敬畏你，遵行你的道路”。
  alternative: “借着遵行你的道路来敬畏你”或“敬畏你，好行你的道路”
  rationale: 不定词可表达敬畏上帝所伴随或体现的行为。并列式在汉语中自然，也避免过度规定二者是手段关系还是目的关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“祖先”避免过度古雅；“遵行你的道路”保留圣经的道路意象，又符合当代宗教语体。脚注标记均置于正文句末，对应相关词义说明。
