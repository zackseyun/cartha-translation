  to: 但耶和华对我父亲大卫说：“因你有心为我的名建造殿宇，你这样存心是好的。[a]”
  rationale: 修订以“因”明示原文的缘由从句，并用“你这样存心是好的”保留原文对大卫的直接称许及“心”的重复。保留“殿宇”作为符合上下文的主文表达，并以脚注交代בַּיִת的字面义；删除与修订后主文近乎重复的末句替译说明。
