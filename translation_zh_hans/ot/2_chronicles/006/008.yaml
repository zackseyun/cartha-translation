  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣יד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱֽטִיב֔וֹתָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: zh_hans
  text: 但耶和华对我父亲大卫说：“因你有心为我的名建造殿宇，你这样存心是好的。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文直译为“房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式译出四字神名，不以“主”这一称号替代。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的叙事常规用语，中文直引中自然准确。
- source_word: אָבִי
  choice: 我父亲
  rationale: 保留所罗门对大卫明确的亲属称谓。
- source_word: יַעַן אֲשֶׁר
  choice: 你……
  rationale: 原文引出缘由；中文通过前置“你有心……”及后句评价自然表达因由关系，无须生硬加入“因为”。
- source_word: הָיָה עִם לְבָבְךָ
  choice: 有心
  rationale: 该希伯来习语表示内在意愿或打算；“有心”在现代中文中简洁自然，并保留“心”的意象。
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: 为我的名建造殿宇
  rationale: בַּיִת字面为“房屋”，语境中指圣殿；“殿宇”既清楚表达所指，也比单说“房屋”更符合庄重中文。脚注保留字面表达。
- source_word: הֱטִיבוֹתָ כִּי הָיָה עִם לְבָבֶךָ
  choice: 这心意是好的
  rationale: 表达神对大卫内在意愿的肯定，同时以自然中文承接原文对“心”的重复。
theological_decisions:
- issue: בַּיִת לִשְׁמִי的圣殿表达
  choice: 为我的名建造殿宇
  alternative: 为我的名建造一座房屋
  rationale: “殿宇”使现代读者明确这里所指圣殿；同时保留“为我的名”这一重要表述，避免暗示神被建筑物容纳。字面上的“房屋”列入脚注。
- issue: 末句对大卫意愿的评价
  choice: 这心意是好的
  alternative: 你有这样的心意，做得好
  rationale: הֱטִיבוֹתָ可直译为“你做得好”，但被肯定的是尚未付诸建殿行动的内在意愿；“这心意是好的”更自然地保留这一神学张力，且不把评价误解为工程行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有心”和“这心意”保留原文两次提到“心”的呼应，但避免逐字重复造成的中文拗口。
