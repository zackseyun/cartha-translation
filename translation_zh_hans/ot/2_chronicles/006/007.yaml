  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣יד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: zh_hans
  text: 我父亲大卫[a]心里有意，要为耶和华——以色列的神——的名建造一座殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文词序也可译作“大卫我父亲”。
    reason: lexical_alternative
  - marker: b
    text: “一座殿”原文直译为“一座房屋”；“为耶和华的名建造一座房屋”是指圣殿与神的名相关联的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 有意
  rationale: 此处 היה 与“在心里”的习语共同表达过去存在于大卫心中的意愿；汉语用“心里有意”自然传达这一状态，无须另加“事情是”之类生硬的起句。
- source_word: עִם לְבַב
  choice: 心里
  rationale: 该习语表示某人的内在意愿或打算。“心里”既保留希伯来文以心表达内在意向的方式，也符合现代汉语。
- source_word: דָּוִיד אָבִי
  choice: 我父亲大卫
  rationale: 希伯来文次序直译为“大卫我父亲”，但“我父亲大卫”是自然、清楚的现代汉语表达；脚注保留较贴近原文次序的译法。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: 准确表达 בנה 的基本意义，并适合庄重的圣殿语境。
- source_word: בַּיִת
  choice: 一座殿
  rationale: בַּיִת 字面是“房屋”，但本节所指明确是圣殿。正文译作“殿”可避免现代读者误解，同时脚注保留原文“房屋”的措辞。
- source_word: לְשֵׁם
  choice: 为……的名
  rationale: 保留历代志中具有神学分量的“为耶和华的名”这一表达，不将其弱化为“为了尊荣”或仅译成“为耶和华”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，明确其为专名，而非以“主”这一称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 自然准确地表达希伯来文属格结构，并保留其盟约性称谓。
theological_decisions:
- issue: 如何翻译 בַּיִת לְשֵׁם יְהוָה 这一与圣殿有关的表达
  choice: 为耶和华……的名建造一座殿
  alternative: 为耶和华建造圣殿；为耶和华的尊名建造一座殿
  rationale: 原文强调建筑是“为耶和华的名”而造，这是申命记与历代志中关于神同在及其名的重要表达。正文保留“名”，不把它化约为一般的圣殿称谓或“尊荣”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心里有意”简洁表达大卫内在的建殿意愿；破折号标明“以色列的神”是对“耶和华”的同位说明，同时使“为……的名”这一结构保持清楚。
