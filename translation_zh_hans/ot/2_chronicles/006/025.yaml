source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: zh_hans
  text: 求你从天上垂听[a]，赦免你子民以色列的罪，使他们回到你赐给他们和他们祖先[b]的土地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你就会从天上垂听”。
    reason: 希伯来语未完成式在此可理解为祈愿，也可理解为将来的陈述。
  - marker: b
    text: 原文直译为“父辈”或“列祖”。
    reason: 说明希伯来语 אֲבֹתֵיהֶם 的字面父系称谓。
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: 垂听
  rationale: 在祷告语境中，此词不只是听见，也含有留意并回应的意味；“垂听”自然、庄重，又不把回应的具体方式明说出来。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: 希伯来语形式为复数，但这里指上帝垂听祷告之处；现代汉语惯用“天上”。
- source_word: סָלַחְתָּ
  choice: 赦免
  rationale: סלח是表示上帝赦罪的常用动词；“赦免”准确而庄重。
- source_word: לְחַטַּאת
  choice: ……的罪
  rationale: 原文为单数，在此可统指以色列所犯的罪；汉语“罪”能保留这种集合性表达。
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: 你子民以色列
  rationale: 保留盟约性的“你子民”和专名“以色列”，同时符合自然汉语语序。
- source_word: וַהֲשֵׁיבוֹתָם
  choice: 使他们回到
  rationale: שוב的使役形表示使他们归回；“使他们回到”明确保留使役意义。
- source_word: אֶל הָאֲדָמָה
  choice: 土地上
  rationale: 此处指上帝赐给以色列的土地，而非泛指泥土；“土地”贴合上下文。
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: 你赐给他们和他们祖先的
  rationale: 保留原文两个受益对象，即当代以色列人与他们的先辈；“祖先”是现代汉语对该亲属复数在历代语境中的自然表达。
theological_decisions:
- issue: 祷告中未完成式 תִּשְׁמַע 的语气
  choice: 求你……垂听
  alternative: 你就会……垂听／你要……垂听
  rationale: 在所罗门向上帝祈求的语境中，未完成式可表达祈愿，也可读作预期的将来。正文采用汉语祷告中自然的祈求式，同时以脚注保留陈述式的可能。
- issue: אֲבֹתֵיהֶם 的称谓
  choice: 他们祖先
  alternative: 他们父辈／他们列祖
  rationale: 原词字面为“他们的父亲们”，在此指承受赐地应许的先辈。“祖先”符合现代汉语且不限定为紧邻上一代；脚注说明其字面形式，以保留原文的父系措辞。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“垂听”“赦免”符合经文语境但不过分古雅；“使他们回到”保留使役含义；标点和语序按现代简体中文表达。
