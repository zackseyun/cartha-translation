  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: zh_hans
  text: 所罗门曾造了一座铜台[a]，安放在院子中央；台长五肘，宽五肘，高三肘。他站在台上，随即在以色列全体会众面前跪下，向天伸开双手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜台”：原文这个词通常指“盆”或“洗濯盆”，但这里的尺寸以及所罗门站在其上的描述表明，它是一座高台式的结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （不单独译出）
  rationale: 本节是对前文场景的补充说明；现代汉语直接承接叙事更自然，也能保留其解释作用，若机械译作“因为”反而会造成悬空感。
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: 一座铜台
  rationale: כִּיּוֹר通常指盆或洗濯盆，但本节说所罗门站在其上，且给出适合台座的尺寸，因此正文按语境译为“铜台”，并用脚注保留词义异常。
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: 在院子中央
  rationale: עֲזָרָה在此指圣殿院子；בְּתוֹךְ表达位于其中或中央，译文采用自然、明确的空间表述。
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: 长五肘，宽五肘，高三肘
  rationale: 保留古代长度单位“肘”，并按现代汉语习惯简洁排列三项尺寸。
- source_word: וַיַּעֲמֹד עָלָיו
  choice: 他站在台上
  rationale: 直接表达所罗门站立于该铜台之上，并以“台”明确所指。
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: 跪下
  rationale: 此处ברך按语境意为屈膝、跪下，并非“祝福”；汉语“跪下”已自然包含双膝着地的动作，无须硬译“跪在膝上”。
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: 当着以色列全体会众
  rationale: נֶגֶד表示在……面前；קָהָל指聚集的会众。“当着……全体会众”符合公开礼拜场景和现代汉语表达。
- source_word: וַיִּפְרֹשׂ כַּפָּיו הַשָּׁמָיְמָה
  choice: 向天伸开双手
  rationale: 保留祷告时张开双手并朝向天的姿态；方向词尾由“向天”清楚表达。
theological_decisions:
- issue: כִּיּוֹר在本节中的具体所指
  choice: 正文译作“铜台”
  alternative: “铜盆”或“铜座”
  rationale: 该词通常指盆，但所罗门能站在其上，且经文列出其长、宽、高，语境明显指可供站立的高台式结构。正文采用语境义，同时以脚注保存常见词义，避免掩盖原文的词汇张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“院子”按上下文指圣殿院子；“当着……跪下”自然呈现公开祷告的场景。脚注标记[a]已置于正文相应词语之后。
