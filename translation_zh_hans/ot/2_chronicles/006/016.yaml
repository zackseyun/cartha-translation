  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: zh_hans
  text: 现在，耶和华——以色列的神啊，求你为你仆人、我父大卫守住你对他所说的话。你曾说：‘在我面前坐以色列王位的人，必不从你而断绝；只是你的子孙若谨守他们的道路，遵行我的律法，像你在我面前所行的。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并转入祈求；现代汉语用“现在”自然表达其话语推进功能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名译法，明确区别于通称“主”。
- source_word: שְׁמֹר ... אֵת אֲשֶׁר דִּבַּרְתָּ
  choice: 守住所应许……的话
  rationale: 保留“守”的核心意象；在祈求神履行所说之话的语境中，以“应许”传达 דִּבֶּר 的语用含义。
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: 你必不断有人
  rationale: 希伯来习语直译为“必不从你那里断绝一人”；中文以“不断有人”自然表达大卫后裔延续之意，同时保留否定断绝的概念。
- source_word: מִלְּפָנַי
  choice: 在我面前
  rationale: 保留原文的神学与宫廷性空间表达，不简化为“蒙我认可”等解释性译法。
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: 谨守自己的道路
  rationale: 保留“守”与“道路”的原文隐喻；“谨守”在现代庄重汉语中表达持续留意并遵守。
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: 遵行我的律法
  rationale: “行走于我的妥拉中”在此说明如何谨守道路；“遵行”自然呈现行为含义，“律法”对应 תּוֹרָה。
theological_decisions:
- issue: 大卫王位应许的条件性
  choice: 用“只要”明确保留条件从句
  alternative: 译作“如果你的子孙……”或弱化为附带劝勉
  rationale: רַק אִם 引出明确限制条件；译文不消解王朝应许与后裔顺服之间的张力。
- issue: “在我面前”的归属
  choice: 按语序理解为“在我面前……坐以色列的王位”
  alternative: 将其与“从你那里断绝”紧密连接，译成“在我面前你必不缺……”
  rationale: 两种句法理解意义相近；当前处理自然地保留君王在神面前执政的表述，并未加入额外教义解释。
- issue: תורה 的范围
  choice: 译作“我的律法”
  alternative: “我的教导”
  rationale: 在历代志的大卫之约与顺服语境中，“律法”最能传达规范性的神圣训令，同时避免把它限定为某一宗派的律法体系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“你仆人、我父大卫”以同位结构清楚呈现关系；引语采用现代中文标点。未设置脚注，因此正文无脚注标记。
