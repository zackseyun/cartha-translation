  timestamp: '2026-07-14T05:56:38Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达所罗门求神实现对大卫所说之言、王位延续及其以子孙遵行律法为条件的意思。但“向……守住”搭配不自然，且“应许”较原文“所说的话”多作了一层解释；“你必不断有人”虽大意可通，却未清晰表达“从你而断绝一人”的王朝延续习语。
  naturalness: 祷告语体庄重、易懂。“求你为你仆人、我父大卫守住你对他所说的话”更符合现代汉语搭配。将王位继承者表述为“坐以色列王位的人，必不从你而断绝”，既自然也更贴近原文。
  terminology: “耶和华”“以色列的神”“仆人”“律法”均恰当。“谨守他们的道路”保留原文复数“子孙／他们”的对应，避免“自己的”可能产生的指代松散。
  issues:
  - severity: medium
    issue: “向你仆人……守住所应许他的话”用语及释义偏移
    rationale: שׁמר ... את אשר דִּבַּרְתָּ לוֹ 是求神为大卫持守／实现“你对他所说的话”。“向……守住”不是自然搭配；“应许”在此虽可由上下文推知，但原文动词是“说”，宜不额外限定其体裁。
  - severity: medium
    issue: “你必不断有人”未充分呈现“必不从你而断绝一人”
    rationale: לֹא יִכָּרֵת לְךָ אִישׁ 是王朝延续的否定断绝公式。改为“坐以色列王位的人，必不从你而断绝”可保留“人”、否定断绝及其与大卫的关联。
  revised_text: 现在，耶和华——以色列的神啊，求你为你仆人、我父大卫守住你对他所说的话。你曾说：‘在我面前坐以色列王位的人，必不从你而断绝；只是你的子孙若谨守他们的道路，遵行我的律法，像你在我面前所行的。’
