revisions:
- from: 现在，耶和华——以色列的神啊，求你向你仆人、我父大卫守住所应许他的话。你曾说：‘在我面前，你必不断有人坐以色列的王位；只要你的子孙谨守自己的道路，遵行我的律法，像你在我面前所行的一样。’
  to: 现在，耶和华——以色列的神啊，求你为你仆人、我父大卫守住你对他所说的话。你曾说：‘在我面前坐以色列王位的人，必不从你而断绝；只是你的子孙若谨守他们的道路，遵行我的律法，像你在我面前所行的。’
  rationale: 修订仅处理原文对应和汉语表达：以“你对他所说的话”对应“你对他说的”，以“必不从你而断绝”保留希伯来语王朝延续公式；保留条件性、神面前的表述及大卫作为子孙顺服的参照。无需脚注。
