source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: zh_hans
  text: 他说：“雅威，以色列的神啊，天上地上没有神能与你相比；你信守约，并向那些全心全意行在你面前的仆人施以坚定的慈爱[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坚定的慈爱”也可译作“守约的信实”。
    reason: 提示 חֶסֶד 在与“约”并列时所具有的圣约忠诚含义。
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他说
  rationale: 以简洁、自然的现代汉语承接叙事，并引出所罗门的祷告。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见现代汉语音译处理，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 自然表达希伯来语属格结构，表明雅威与以色列的圣约关系。
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: 没有神能与你相比
  rationale: 保留原文关于雅威无可比拟的断言，同时不把 אֱלֹהִים 所可能具有的表达张力擅自扩展为系统性的解释。
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: 天上地上
  rationale: 以自然汉语保留涵盖一切领域的对举。
- source_word: שֹׁמֵר הַבְּרִית
  choice: 守约
  rationale: 准确而简练地表达持续信守圣约的行动。
- source_word: וְהַחֶסֶד
  choice: 施忠贞的爱
  rationale: חֶסֶד 在圣约语境中兼有爱、忠诚和恒久信实的意味；此译既可读，又不缩减为单纯的怜悯。
- source_word: לַעֲבָדֶיךָ
  choice: 向……的仆人
  rationale: 表达这些仆人是神守约施爱的对象；“仆人”符合本节关系和身份语境。
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: 行在你面前
  rationale: 保留希伯来语“行走”的生活行为隐喻及活在神面前的含义。
- source_word: בְּכָל לִבָּם
  choice: 全心全意
  rationale: 以现代汉语惯用语表达内心完整、毫无保留的忠诚。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”更直接对应其通常重构的读音，也避免用“主”等称号取代专名。
- issue: 圣约语境中 חֶסֶד 的含义
  choice: 忠贞的爱
  alternative: 慈爱；守约的信实
  rationale: 该词与“约”并列，既指爱与恩惠，也包含坚定忠诚；正文保留两方面含义，脚注提示另一种突出圣约信实的译法。
- issue: אֵין כָּמוֹךָ אֱלֹהִים 的理解
  choice: 没有神能与你相比
  alternative: 众神中没有谁能与你相比
  rationale: 正文自然表达雅威的无可比拟，同时保留 אֱלֹהִים 的“神”用语，不额外界定这里对其他神明的本体论陈述。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。保留“行在你面前”的圣经意象，以“全心全意”避免生硬直译；用破折号使呼语“雅威——以色列的神啊”层次清楚。
