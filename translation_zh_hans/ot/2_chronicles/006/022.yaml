base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: zh_hans
  text: 如果有人得罪邻舍，有人要他承担誓言，叫他起誓；他便带着这誓言，来到这殿中你的祭坛前，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ לְרֵעֵהוּ
  choice: 如果有人得罪邻舍
  rationale: 保留条件句及人际间犯罪、亏负的含义；现代汉语用“有人”自然表达希伯来语单数代表性用法，“得罪”兼具道德与关系层面的力度。
- source_word: וְנָשָׁא בוֹ אָלָה
  choice: 有人使他承担誓言
  rationale: 尽量保留“把誓言加在他身上”的司法性表达，并与随后使役式“要他起誓”分别对应。
- source_word: לְהַאֲלֹתוֹ
  choice: 要他起誓
  rationale: 对应使役式，明确表示使当事人宣誓，不将其与前一短语合并。
- source_word: וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ
  choice: 而他来到……你的祭坛前宣誓
  rationale: 希伯来语字面近于“誓言来到你的祭坛前”；汉语以宣誓者来到祭坛前宣誓来表达该司法场景，同时在脚注保留较直译的结构。
- source_word: בַּבַּיִת הַזֶּה
  choice: 这殿中
  rationale: בַּיִת 字面为“房屋/殿宇”，在此明确指圣殿；“这殿中”比“这房屋中”自然庄重，又保留指示语。
theological_decisions:
- issue: אָלָה 的司法含义
  choice: 正文译作“誓言/宣誓”，脚注说明其可能是带咒诅约束的誓言
  alternative: 咒诅；咒诅之誓
  rationale: 此词在司法语境中既指誓言，也可包含违誓便受咒诅的制裁意味。只译“咒诅”会遮蔽宣誓程序，只译普通“誓言”又可能淡化制裁含义，因此以正文加脚注保存张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留经文作为后续祈求之前件、句末未完的结构。
