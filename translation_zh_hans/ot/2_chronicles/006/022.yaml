revisions:
- from: 如果有人得罪邻舍，有人使他承担誓言，要他起誓，而他来到这殿中你的祭坛前宣誓，[a]
  to: 如果有人得罪邻舍，有人要他承担誓言，叫他起誓；他便带着这誓言，来到这殿中你的祭坛前，
  rationale: 修订保留原文两个相连的司法表达：誓言加在当事人身上，以及使他起誓；同时将末句处理为当事人“带着这誓言”来到祭坛前。这样在现代汉语中可读，也不把原文中以“誓言”为焦点的凝缩句法改写为明确的“来到后宣誓”。句末保留逗号，以反映本节仍是所罗门祷告中未完成的条件从句。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:38Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿正确保留了条件句、对邻舍的过犯、誓言／咒诅的司法背景，以及“这殿”和“你的祭坛”。不过，וּבָא אָלָה 的主语是“誓言”（或其所代表的宣誓事项）而非明确的“他”；正文改作“而他来到……宣誓”既转换了主语，又把“誓言在祭坛前”的凝缩表达扩展为一次新的宣誓行动。用“他便带着这誓言来到……”可在自然汉语中保留该誓言与来到祭坛前之间的关联，且不无根据地增添一个新动作。
  naturalness: “有人使他承担誓言”略显生硬，但在紧接“要他起誓”的司法语境中尚可理解。改为“有人要他承担誓言，叫他起誓”较符合现代庄重汉语；“带着这誓言来到”也比“誓言来到”更自然，同时避免把原文误作单纯地点状语下的“宣誓”。
  terminology: “邻舍”“祭坛”“这殿”均合宜。“誓言”可作为 אָלָה 的正文对应；脚注应明确其可指带咒诅制裁的誓言。不要在正文把该词直接窄化为普通的“宣誓”，也不要仅译为“咒诅”。
  issues:
  - severity: medium
    issue: 末分句将“誓言”改作当事人在祭坛前“宣誓”。
    rationale: 原文的 וּבָא אָלָה 将 אָלָה 置于“来到／在你的祭坛前”的结构中。草稿的“而他来到……宣誓”改变了该词的句法功能，并补入原文未明说的一个宣誓动作。
  - severity: low
    issue: “有人使他承担誓言”措辞稍显书面生硬。
    rationale: 可保留“承担誓言”以表达誓言被加在当事人身上的意思，但“有人要他……，叫他……”更顺畅，也仍分别呈现前一加诸誓言的结构和随后使其起誓的使役表达。
  - severity: low
    issue: 脚注中“希伯来语较直译为‘誓言来到……’”可能使读者误以为该句法毫无歧义。
    rationale: 应说明这是原文凝缩、句法较难的表达，并说明正文以“带着这誓言来到”作自然处理，而非把该直译当成唯一无争议的分析。
  revised_text: 如果有人得罪邻舍，有人要他承担誓言，叫他起誓；他便带着这誓言，来到这殿中你的祭坛前，
  revised_footnotes:
  - marker: a
    text: “誓言”也可指“带咒诅的誓言”：若所起的誓为假，起誓者便承受咒诅。原文末句的表达较为凝缩，字面上将“誓言”与“来到你的祭坛前”相连；正文译作“带着这誓言，来到……前”。
    reason: 说明 אָלָה 所含的誓言与咒诅制裁意味，并交代末句凝缩且句法不甚明确的表达，避免将其不当扩展为明确的新一次宣誓行动。
  revision_rationale: 修订保留原文两个相连的司法表达：誓言加在当事人身上，以及使他起誓；同时将末句处理为当事人“带着这誓言”来到祭坛前。这样在现代汉语中可读，也不把原文中以“誓言”为焦点的凝缩句法改写为明确的“来到后宣誓”。句末保留逗号，以反映本节仍是所罗门祷告中未完成的条件从句。
