  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: zh_hans
  text: 求你从天上——你的居所——垂听、赦免，并按各人所行的一切待他；你知道他的心，因为唯有你知道世人[a]的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”直译为“人的儿子们”，是泛指全人类的希伯来语表达。
    reason: 说明 בְּנֵי הָאָדָם 的字面形式及其泛指全人类的含义。
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: 求你……垂听
  rationale: 未完成式在所罗门祷告的语境中表达祈求；“求你……垂听”既传达祈愿语气，也符合庄重自然的现代汉语。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: 希伯来语形式为复数，但此处指上帝所在的天；“从天上”是自然且准确的汉语表达。
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: 就是你的居所
  rationale: מָכוֹן 表示固定、确立之处；结合 שִׁבְתֶּךָ，指上帝的居所。“就是你的居所”也自然说明前面的“天上”。
- source_word: וְסָלַחְתָּ
  choice: 赦免
  rationale: 带连接词的完成式延续祈求中的动作；汉语以并列动词表达最自然。
- source_word: וְנָתַתָּה לָאִישׁ כְּכָל דְּרָכָיו
  choice: 并照各人所行的一切报应他
  rationale: נתן 本义为“给”，但在按人的道路施予相称结果的审判语境中，“报应”准确传达其司法含义，并保留善恶结果未明说的开放性；“所行”呈现 דֶּרֶךְ 所指的行为和生活道路。
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: 因为你知道他的心
  rationale: 关系词 אֲשֶׁר 在此可说明上帝按各人行为施行判断的依据；汉语用“因为”衔接清楚，同时保留心作为内在思想、意志和动机中心的意象。
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: 唯有你知道
  rationale: 准确保留 לְבַדְּךָ 的排他强调；完成式在此表达恒常事实，汉语用一般时态即可。
- source_word: לְבַב בְּנֵי הָאָדָם
  choice: 世人的心
  rationale: בְּנֵי הָאָדָם 字面为“人的众子”，是泛指全人类的希伯来习语；现代汉语“世人”自然、庄重，并无不必要的男性限定。
theological_decisions:
- issue: 上帝按人的“道路”给予相称结果
  choice: 照各人所行的一切报应他
  alternative: 照各人一切所行的待他
  rationale: 经文同时提到赦免与按行为施予结果，形成真实的神学张力。“报应”在此取中性的按行为给予相称结果之义，不限定为惩罚，也不把赦免与审判之间的关系提前解释掉。
- issue: בְּנֵי הָאָדָם 的人类学表达
  choice: 世人
  alternative: 人的众子
  rationale: 原文是泛指全人类的代表性习语，不是在教导只有男性才被上帝鉴察；“世人”准确传达其范围，脚注交代字面形式。
- issue: 上帝独知人心
  choice: 唯有你知道世人的心
  alternative: 只有你曾知道人的众子的心
  rationale: 保留原文对上帝独有洞察人心能力的明确强调，不将“心”窄化为情感或理智中的某一方面。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的祷告语体。“垂听”与“赦免”保持圣经语域而不显古奥；以分号呈现末句理由的递进。脚注标记已在正文“世人”之后标出。
