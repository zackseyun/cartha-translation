revisions:
- from: 求你从天上，就是你的居所，垂听、赦免，并照各人所行的一切报应他，因为你知道他的心；唯有你知道世人[a]的心。
  to: 求你从天上——你的居所——垂听、赦免，并按各人所行的一切待他；你知道他的心，因为唯有你知道世人[a]的心。
  rationale: 修订以“按各人所行的一切待他”保留“照着他一切道路给他”的开放性，不预设惩罚；以分号将“你知道他的心”保留为与“各人”相连的说明，并让“因为”对应原文末句的כִּי。破折号呈现“天上，你的居所”的同位语关系。
