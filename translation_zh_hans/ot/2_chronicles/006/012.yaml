  text: וַֽ/יַּעֲמֹ֗ד לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֖שׂ כַּפָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: zh_hans
  text: 于是，他站在雅威的祭坛前，面对以色列全体会众[a]，伸开双手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列所有会众”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“伸开他的手掌”；这是祷告时伸展双手的姿势。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 于是，他站
  rationale: 该叙事性动词形式推进事件发展；“于是”自然表达先后衔接，“站”保留动词的基本含义。
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: 在雅威的祭坛前
  rationale: לִפְנֵי 在此表示空间位置“在……前”；构造链 מִזְבַּח יְהוָה 译为“雅威的祭坛”，清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现以色列上帝的专名，避免用称号取代原文中的名字。
- source_word: נֶגֶד
  choice: 面对
  rationale: 该词表示相对于聚集之人的位置；“面对”既保留空间关系，也避免与前面的“在……前”重复。
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: קָהָל 指聚集起来的群体；“会众”保留其共同体含义，“全”对应 כָּל。
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: 伸开双手
  rationale: פרש 与 כף 连用，描述祷告时伸展手掌的动作；“伸开双手”是自然汉语，同时准确传达这一姿态。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为 Yahweh 的现代汉语音译，以专名而非称号呈现。
- issue: 伸手动作是否明说为祷告
  choice: 只译动作“伸开双手”
  alternative: 译作“伸手祷告”
  rationale: 上下文可表明这是祷告姿态，但本节原文本身只陈述动作；正文不额外加入“祷告”，由脚注说明其惯用含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”衔接叙事，“面对”清楚区分人物与祭坛、会众之间的空间关系；整体句式简洁，适合公开诵读。
