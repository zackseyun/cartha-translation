language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י בִנְ/ךָ֙ הַ/יּוֹצֵ֣א מֵֽ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: zh_hans
  text: 不过，你不可建造这殿；你亲生的儿子[a]，他必为我的名建造这殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从你腰间出来的儿子”，是指亲身所生的后代。
    reason: lexical_alternative
  - marker: b
    text: 原文为“这房屋”，在这里是对圣殿的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 不过
  rationale: 此处限制并转折前文的肯定；“不过”自然地表达“然而、只是”的语气。
- source_word: תִבְנֶה הַבָּיִת
  choice: 建造这殿
  rationale: הַבָּיִת 直译为“这房屋”，但在本段明确指献给上帝的圣殿；“这殿”在现代中文中清楚而庄重。
- source_word: כִּי
  choice: （分号承接对比）
  rationale: 否定句之后，כִּי 引出与之相对的肯定陈述。中文用分号承接，避免误读为单纯的因果关系。
- source_word: בִנְךָ הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: 你亲生的儿子
  rationale: 原文直译为“从你腰间出来的儿子”，是指亲身所生后代的希伯来语习语；“亲生的儿子”准确传达其意义，也符合现代中文表达。
- source_word: הוּא
  choice: 他
  rationale: 保留独立人称代词所带的强调，形成“你亲生的儿子，他必……”的中文突出结构。
- source_word: יִבְנֶה
  choice: 必……建造
  rationale: 未完成式在此表达将来的确定陈述；“必”传达其确定性和庄重语气。
- source_word: לִשְׁמִי
  choice: 为我的名
  rationale: 贴近原文，表达圣殿归于上帝之名、代表其名的含义，不将其扩释为某一特定神学解释。
theological_decisions:
- issue: 圣殿用语
  choice: 这殿
  alternative: 这房屋
  rationale: 原文是“这房屋”，在语境中是圣殿的惯常称呼。正文采用自然清楚的“这殿”，脚注保留原文字面形式。
- issue: 血缘习语
  choice: 你亲生的儿子
  alternative: 从你腰间出来的儿子
  rationale: 原文习语明确表示大卫亲身所出的男性后代；译文只传达直接血缘关系，不加入其他教义推论。
- issue: 独立代词的强调
  choice: 你亲生的儿子，他必……
  alternative: 你亲生的儿子必……
  rationale: 保留原文 הוּא 的强调作用，同时使用中文可接受的主语复指结构。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不过”表达限制性的转折；“你亲生的儿子，他必……”保留原文对儿子的强调。脚注分别说明血缘习语和“房屋”作为圣殿称呼的原文特点。
