  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: zh_hans
  text: 他们若在被掳之地，就是掳掠他们的人把他们掳去的地方，全心全意地归向你[a]，并朝着你赐给他们祖先的土地、你所拣选的城，以及我为你的名建造的殿祷告，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“转回到你这里”；在盟约语境中，这个说法也含有悔改之意。
    reason: 保留שׁוּב אֵלֶיךָ的基本空间、关系意义及其语境中的悔改含义。
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: 归向你
  rationale: שׁוּב与אֶל连用，基本义是回转、归回到某人这里；“归向你”既自然，也保留盟约语境中的悔改意味，而不在正文中将其完全解释为“悔改”。
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: 全心全意地
  rationale: “心”和נֶפֶשׁ在此共同表达完整、真诚的内在归向。现代汉语“全心全意”准确传达整体委身，也避免把נֶפֶשׁ误解为与身体相分离的“灵魂”。
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: 在被掳之地
  rationale: 该结构指他们遭受囚掳所在之地；“被掳之地”简洁，并保留原文的被掳主题。
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: 就是掳走他们之人的地方
  rationale: 原文是主动结构，主语隐含为掳掠他们的敌人。此译法在汉语中补明施事者，又不指定原文未明说的民族。
- source_word: וְהִתְפַּלְלוּ
  choice: 并……祷告
  rationale: 在本段条件句序列中承接前面的归向行动，译为“并……祷告”符合现代汉语句法。
- source_word: דֶּרֶךְ אַרְצָם
  choice: 朝着……土地
  rationale: דֶּרֶךְ在祷告朝向的语境中表示方向，“朝着”自然地传达这一含义。
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: 你赐给他们祖先的
  rationale: אָבוֹת在此指先祖；“祖先”比直译“父亲们”更符合现代汉语，同时保留历史与盟约关联。
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: 你所拣选的城
  rationale: “拣选”保留神主动选择这城的经文用语及其持续意义。
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: 以及我为你的名建造的这殿
  rationale: בַּיִת在本语境明确指圣殿，译作“殿”比“房屋”自然；“为你的名”保留希伯来文关于神之名的神学表达。“这”由说话现场与所指对象自然引出，帮助汉语读者明确所指。
theological_decisions:
- issue: שׁוּב אֵלֶיךָ中的悔改含义
  choice: 译作“归向你”
  alternative: “向你悔改”或“转向你”
  rationale: 原词的基本动作是回转、归回，在此盟约祷告中确有悔改意味，但不宜在正文中把隐含意义完全明说；“归向你”保留身体处境、关系恢复和内在悔改之间的张力。
- issue: “全心、全נֶפֶשׁ”的人观表达
  choice: 合译为“全心全意”
  alternative: “尽心尽性”或“全心全魂”
  rationale: 此处强调全人的真诚归向，并非划分人的组成部分。“全心全意”是现代标准汉语中自然且完整的整体性表达。
- issue: “为你的名”是否释义
  choice: 保留“为你的名”
  alternative: “为敬拜你”或“作为你临在之处”
  rationale: 原文的“名”具有丰富的代表、归属和临在内涵；直接保留可避免将其收窄为单一神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。本节是所罗门祷告中条件句的一部分，因此以“他们若”承接上下文，并以逗号结尾。正文使用“被掳”“拣选”“为你的名”等常见经文词汇，但避免生硬直译。
