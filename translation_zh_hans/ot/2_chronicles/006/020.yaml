  text: לִ/הְיוֹת֩ עֵינֶ֨י/ךָ פְתֻח֜וֹת אֶל הַ/בַּ֤יִת הַ/זֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֶל הַ֨/מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ לָ/שׂ֥וּם שִׁמְ/ךָ֖ שָׁ֑ם לִ/שְׁמ֨וֹעַ֙ אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּ/ךָ֔ אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: zh_hans
  text: 愿你的眼目昼夜向着这殿敞开[a]，向着你曾说要把你的名安放在那里的地方[b]，垂听你仆人向这地方所作的祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“愿你留意这殿”。原文直译为“愿你的眼目敞开”，是表示警醒关注的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “把你的名安放在那里”是与圣殿有关的惯用说法，指上帝拣选这地方，使它与自己相关，并不是说上帝实际被局限在其中。
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: 愿你的眼目……敞开
  rationale: לִהְיוֹת在祷告语境中带有祈愿意味；保留“眼目敞开”的具体拟人表达，同时用“愿”自然传达所罗门的祈求。
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: 向这殿
  rationale: אֶל表示朝向；בַּיִת在此特指圣殿，译作“殿”比一般的“房屋”更符合上下文。
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼夜
  rationale: 简洁保留原文表示持续不断的对举表达。
- source_word: לָשׂוּם שִׁמְךָ שָׁם
  choice: 把你的名立在那里
  rationale: 保留“名”这一圣殿神学惯用语；“立”能自然表达שׂום的设置、安置之意，又不把它解释成神被实际容纳在殿中。
- source_word: לִשְׁמוֹעַ
  choice: 垂听
  rationale: 原义为“听”；在向上帝祈求的语境中，“垂听”是自然、庄重且通俗可懂的汉语表达，并传达祈求上帝回应的语用含义。
- source_word: הַתְּפִלָּה אֲשֶׁר יִתְפַּלֵּל
  choice: 所献的祷告
  rationale: 避免汉语中“祷告……所祷告”的重复；“献祷告”自然表达祷告行为，不额外限定其内容。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 这是祷告中表示谦卑服事身份的惯用称谓；“仆人”较“奴隶”更符合此处语境。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 向这地方
  rationale: 保留祷告朝向圣殿所在地的空间含义，不改写为“在这地方”。
theological_decisions:
- issue: 上帝的拟人化描述“眼目敞开”
  choice: 在正文中保留具体的拟人表达
  alternative: 意译为“留意这殿”或“看顾这殿”
  rationale: 原文以身体意象表达上帝警醒的关注；直译可保留其修辞和神学张力，脚注说明其惯用含义。
- issue: “把你的名立在那里”的圣殿用语
  choice: 保留“名”及“立在那里”的表达
  alternative: 解释为“使你的临在住在那里”或“在那里彰显你的名”
  rationale: 原文没有说上帝本身被圣殿容纳，而以“名”表达上帝对该处的拣选和关联；正文不应替读者消解这一紧凑而重要的表达。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“昼夜”“垂听”“仆人”符合经文语域但不过分古雅；保留“眼目敞开”和“把你的名立在那里”的原文意象，并以脚注帮助普通读者理解。
