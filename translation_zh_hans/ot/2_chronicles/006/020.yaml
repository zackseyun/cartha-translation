revisions:
- from: 愿你的眼目昼夜向这殿敞开[a]，向着你曾说要把你的名立在那里的地方[b]，垂听你仆人向这地方所献的祷告。
  to: 愿你的眼目昼夜向着这殿敞开[a]，向着你曾说要把你的名安放在那里的地方[b]，垂听你仆人向这地方所作的祷告。
  rationale: 修订仅处理两个可安全校正之处：以“安放”直接对应“放置”之义，避免“立名”的现代歧义；以“所作的祷告”除去原文未明说的“献”。其余保留原译的祈愿语气、空间朝向、拟人表达和圣殿惯用语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:37Z'
