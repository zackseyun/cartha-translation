base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/003.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: zh_hans
  text: 王转过身来[a]，为以色列全体会众祝福；当时，以色列全体会众都站着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转过身来”原文直译为“转过他的脸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב הַמֶּלֶךְ אֶת־פָּנָיו
  choice: 王转过身来
  rationale: 原文直译为“王转过他的脸”，是描述身体转向的希伯来语表达；现代汉语用“转过身来”自然地传达动作，又不增添方向等原文未明说的信息。
- source_word: וַיְבָרֶךְ
  choice: 为……祝福
  rationale: ברך 在此指王向聚集的百姓祝福。“为……祝福”符合现代汉语表达，也保留了该词直接而庄重的含义。
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: 以色列全体会众
  rationale: קהל 指聚集起来的群体；“会众”既能体现共同聚集，也适合此处公开礼仪的语境。“全体”对应 כָּל，并保留原文两次重复这一短语。
- source_word: עוֹמֵד
  choice: 都站着
  rationale: 分词表示当时持续的姿态；“站着”体现进行中的状态。“都”使单数集合名词与其全体成员的意义在现代汉语中表达清楚。
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: 当时，以色列全体会众都站着
  rationale: 句首 וְ 在这里可表达伴随情形。译作“当时”自然交代王祝福时会众所处的状态，同时避免将其误解为随后发生的动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“以色列全体会众”在原文中的重复，以反映经文的修辞结构；分号区分主要动作与伴随状态。脚注标记置于整节末尾，所释词语在正文中清楚可辨。
