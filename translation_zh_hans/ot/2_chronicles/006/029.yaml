  terminology: “祷告、恳求”“以色列”“这殿”均恰当。“灾患和痛苦”可以保留其宽泛的困苦含义；加入“所受的”使其与人称后缀及上下文关系更明确，而不将נֶגַע狭义化为疾病或瘟疫。
