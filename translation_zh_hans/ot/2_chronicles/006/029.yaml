  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: zh_hans
  text: 无论任何人或你全体子民以色列所献上的祷告、恳求，各人知道自己所受的灾患和痛苦，并向这殿伸开双手——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: 无论是……祷告、恳求
  rationale: 两个כָּל构成全面而不限定的表达；“祷告、恳求”既保留重复结构，也区分一般祷告与恳切求恩。
- source_word: אֲשֶׁר יִהְיֶה לְכָל הָאָדָם וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: 无论是任何人的……还是你全体子民以色列的
  rationale: לְ在此标明祷告所属或发出者；译成“任何人……还是……全体子民”自然呈现由个体到群体的范围。אָדָם在这里是泛指，现代汉语用“人”即可准确涵盖。
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: 他们各自知道
  rationale: אִישׁ在此具有逐一、分配的作用；“各自”清楚表达每个祷告者都知道自身处境。
- source_word: נִגְעוֹ וּמַכְאֹבוֹ
  choice: 自己的灾患和痛苦
  rationale: נֶגַע可指打击、灾病或患难，故用范围较宽的“灾患”；מַכְאוֹב侧重切身疼痛与苦楚，译作“痛苦”，并保留两词之间的区别。
- source_word: וּפָרַשׂ כַּפָּיו
  choice: 向……伸开双手
  rationale: 这是祷告时张开手掌的姿态；“伸开双手”在现代汉语中自然且保留具体动作。
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: 向这殿
  rationale: אֶל在此表示祷告时所朝的方向；上下文中的“这房屋”指圣殿，译作“这殿”简洁而明确。
theological_decisions:
- issue: הָאָדָם作为泛指单数的译法
  choice: 任何人
  alternative: 任何男人
  rationale: 此处אָדָם泛指群体中的个体，并非强调男性性别；汉语“任何人”准确保留其普遍范围，无须加入原文没有的性别限制。
- issue: נֶגַע是否限定为瘟疫或疾病
  choice: 灾患
  alternative: 灾病／击打
  rationale: 该词语义可涵盖打击、灾病和患难；本节强调每个人所知道的自身困境，不宜把它收窄为特定疾病。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。经文句法延续到下一节，因此以破折号收束，保留原文尚未完成的条件结构。
