id: 2CH.6.33
reference: 2 Chronicles 6:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: zh_hans
  text: 求你从天上、从你的居所垂听，照着那外族人向你所求的一切为他成就，使地上万民都认识你的名，敬畏你，像你的子民以色列一样；也使他们知道，我所建的这殿是称为你名下的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你的名被称在这殿之上”；意思是这殿归在你的名下。
    reason: 说明希伯来习语，并保留其字面意象与归属含义。
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: 垂听
  rationale: 在祷告语境中，此词不仅指听见，也含留意并回应之意；“垂听”自然、庄重，适合人向上帝祈求的语境。
- source_word: מִן הַשָּׁמַיִם מִמְּכוֹן שִׁבְתֶּךָ
  choice: 从天上、从你的居所
  rationale: 保留两个并列的来源短语，既忠实于希伯来文，也不把地上的殿等同于上帝的居所。
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: 照着……向你所求的一切为他成就
  rationale: קרא אל 在此为祈求、呼求；“成就”表达上帝按所求而行，同时不具体限定回应的方式。
- source_word: הַנָּכְרִי
  choice: 那外族人
  rationale: 指不属于以色列民族的人；“外族人”比可能带有临时旅居意味的“外人”更准确。
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: 地上万民
  rationale: 此处范围普世，עַמִּים 为复数民族群体；“地上万民”简洁而保留其普世性。
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: 敬畏你
  rationale: “敬畏”兼具畏惧与尊崇，是现代中文圣经语域中对敬神之 ירא 的准确表达。
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: 这殿是称为你名下的
  rationale: 保留“名被称在……之上”的希伯来习语核心，表达这殿归属于上帝、与他的名相联，而不将其简化为仅仅命名。
theological_decisions:
- issue: 上帝的居所与地上圣殿之间的关系
  choice: 保留“从天上、从你的居所”与“这殿”的区分
  alternative: 释义为“从你天上的同在中垂听”
  rationale: 原文明确把天上的居所与所建之殿区分开来，同时又以“名”将殿与上帝关联；直译这种张力可避免暗示上帝被限制在殿内。
- issue: 万民对上帝的态度
  choice: 译为“敬畏你”
  alternative: 译为“尊崇你”
  rationale: “敬畏”保留 ירא 所含的畏惧和崇敬，不削弱其神学分量。
- issue: 上帝之名与圣殿的关系
  choice: 正文采用“称为你名下的”，并以脚注说明字面表达
  alternative: 正文释义为“这殿承载你的名”
  rationale: “称为你名下”较自然地传达归属关系，同时脚注保存希伯来文独特表达，避免将“名”的意义过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你……垂听”承接上下文的祈求；以“殿”译 הַבַּיִת，符合此处圣殿语境。
