source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶל הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַֽל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: zh_hans
  text: 求你在天上垂听[a]，赦免你仆人和你子民以色列的罪；当你教导他们行在美善的道路上时，求你使雨降在你的地上——这地是你赐给你子民作产业的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“垂听天（或诸天）”。这是祷告中指神从其天上居所垂听的惯用表达；也可译作“从天上垂听”。
    reason: 说明希伯来语中“垂听＋天（诸天）”的特殊表达，以及中文译作“在天上垂听”的理由。
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: 在天上垂听
  rationale: 希伯来语直译近于“听天”，按本祷告中的惯用表达，是指神在天上的居所垂听。“在天上垂听”既保留原文表达的方位，又符合庄重、自然的现代汉语。
- source_word: וְסָלַחְתָּ לְחַטַּאת עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: 赦免你仆人和你子民以色列的罪
  rationale: חַטָּאת 在此指罪；עֲבָדֶיךָ 在敬拜与盟约祷告的语境中译作“仆人”比“奴隶”恰当。后面的两个并列对象共同受“罪”支配。
- source_word: כִּי תוֹרֵם
  choice: 你教导他们
  rationale: כִּי 可有“因为、当……时”等关系；此处汉语不加明确连词，以保留其因果或情境关系的含混。תוֹרֵם 是 ירה 的使役形，表达教导、指示。
- source_word: אֶל־הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: 当走的正道
  rationale: “道路”是行为方式的常见比喻；“当走的正道”自然传达 הַדֶּרֶךְ הַטּוֹבָה 的道德含义及应然语气。
- source_word: וְנָתַתָּה מָטָר עַל־אַרְצְךָ
  choice: 并降雨在你的地上
  rationale: נתן 的基本义是“给”；与“雨”搭配时，现代汉语自然说“降雨”。保留“你的地”，反映原文明确的所属关系。
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: 就是你赐给你子民作产业的地
  rationale: נַחֲלָה 指承受所得的产业，尤其是神赐给以色列的土地；“作产业”保留其盟约土地赐予的含义。
theological_decisions:
- issue: כִּי 所表达的逻辑关系
  choice: 不在正文中加入“因为”或“当……时”，以并列式表达“你教导他们”
  alternative: 译作“因为你教导他们”或“当你教导他们时”
  rationale: 原词可表达因果或情境关系，语境虽容许时间性理解，但正文不明定连词，更能保留原文的语义张力，避免把赦免、教导与降雨之间的关系解释得过强。
- issue: 神回应祷告的次序
  choice: 保留垂听、赦免、教导和降雨这一连贯祈求
  alternative: 将“教导”仅解释为赦免或降雨的原因
  rationale: 经文是所罗门的祷告，正文应呈现其祈求结构，不额外建立超出原文的教义因果链。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“垂听、赦免、产业”保留经文语体；整体避免古奥句式。脚注标记置于整节末尾，对应“在天上垂听”的译法说明。
