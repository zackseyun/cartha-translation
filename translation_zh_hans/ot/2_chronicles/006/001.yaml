  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכּ֖וֹן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: zh_hans
  text: 那时，所罗门说：“雅威曾说，他要住在浓重的幽暗中[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“密云中。”这个希伯来词可指浓密的云、昏暗或幽暗，尤其常用于上帝显现的语境。
    reason: 说明עֲרָפֶל的词义范围，并保留“幽暗”与“密云”两种可能意象。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 这是承接上文、推进叙事的时间标记；“那时”在现代汉语中自然，也保留了事件的先后关系。
- source_word: אָמַר ... שְׁלֹמֹה
  choice: 所罗门说
  rationale: אָמַר是常见的言说动词；译作“说”直接、中性，不额外加入“宣告”等语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: אָמַר
  choice: 曾说
  rationale: 完成式在这里指向雅威先前所说的话；“曾说”既符合中文时序，也不过度强调其对当前持续生效的体貌含义。
- source_word: לִשְׁכּוֹן
  choice: 他要住
  rationale: ל加不定式表达所说内容或意向；“要住”是自然的中文间接引语，并保留שׁכן所表达的居住、临在含义。
- source_word: בָּעֲרָפֶל
  choice: 在浓重的幽暗中
  rationale: עֲרָפֶל可指浓云、昏暗或深沉的黑暗，并常见于神显语境；“浓重的幽暗”保留遮蔽感以及神临近却隐而不显的张力。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留专名性质，避免以称号替换，也不把元音传统确定为另一形式。
- issue: עֲרָפֶל所描绘的神圣临在
  choice: 浓重的幽暗
  alternative: 密云；昏暗
  rationale: 本词既可描写黑暗，也可描写浓密云层。正文保留幽暗与遮蔽的意象，脚注交代“密云”这一真实词义可能，不把神的临近与隐蔽之间的张力单向解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那时”自然承接上下文；“雅威”保留神名；“浓重的幽暗”避免过于气象化，同时以脚注呈现“密云”的可能译法。
