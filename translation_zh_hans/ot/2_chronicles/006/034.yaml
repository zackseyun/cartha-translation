  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: zh_hans
  text: “你的子民若沿着你差遣他们所走的路出去，与仇敌交战；他们若朝着你所选择的这城[a]和我为你名所建的殿[b]向你祷告，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“朝着这城的方向”，指祷告时面向这城。
    reason: lexical_alternative
  - marker: b
    text: “殿”原文为“房屋”，这里指所罗门为耶和华的名所建的圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 本句引出一个假设情形，并由下一节承接祈求；“若”自然保留条件句结构。
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: 你的子民……出去，与……交战
  rationale: 保留“出去”的具体动作，也以现代汉语自然表达军事语境。
- source_word: עַל אֹיְבָיו
  choice: 与仇敌交战
  rationale: 介词 עַל 在战争语境中表示敌对对象；希伯来语单数后缀与集合名词“子民”呼应，汉语无须显明其数。
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: 照你差遣他们的路
  rationale: דרך 可指道路、方向或行程；此译保留神所指定路线与差遣的含义，不把它抽象化。
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: 向你祷告
  rationale: פלל 的反身词干配合 אֶל，表示祷告所指向的对象；“向你祷告”准确自然。
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: 面向……这城
  rationale: 这里的 דרך 表示祷告时所朝的方向；“面向”清楚传达具体的空间朝向。
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: 你所选择的
  rationale: 忠实表达神对这城的拣选，同时避免增添原文未明说的对象名称。
- source_word: וְהַבַּיִת אֲשֶׁר בָּנִיתִי
  choice: 和我……所建的殿
  rationale: הַבַּיִת 字面为“这房屋/殿宇”，在本段明确指所罗门所建的圣殿；汉语“殿”既自然又符合上下文。
- source_word: לִשְׁמֶךָ
  choice: 为你名
  rationale: 保留献殿祷告中“为神的名建造”的核心表达，不将“名”扩展解释为其他神学概念。
theological_decisions:
- issue: 祷告朝向耶路撒冷与圣殿
  choice: 保留具体的空间朝向，译作“面向……这城和……殿”
  alternative: 译成较抽象的“想着这城和圣殿向你祷告”或“借着这城和圣殿祷告”
  rationale: 原文使用 דרך 的方向性语言，反映所罗门献殿祷告的历史与圣殿语境；译文不将其灵意化，也不推导后来的礼仪规范。
- issue: “为你名”与神的临在
  choice: 直译为“为你名”
  alternative: 释义为“供你居住”或“作为你临在之处”
  rationale: 原文刻意使用“名”的表达；直译可保留其神学张力，避免把“名”与神的居所完全等同。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“照你差遣他们的路”略带原文式的凝练，以保留“道路/方向”意象；句末保留逗号，因为本节是条件从句，祈求的主句见下一节。
