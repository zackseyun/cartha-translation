source:
  edition: WLC
  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: zh_hans
  text: “你的子民以色列若因得罪你而在仇敌面前败下阵来，又回转[a]，承认你的名[b]，并在这殿里向你祷告、恳求恩惠[c]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回转”也可译作“返回”；在盟约语境中可含有“悔改”的意思。
    reason: lexical_alternative
  - marker: b
    text: “承认你的名”也可译作“称颂你的名”或“感谢你的名”。
    reason: lexical_alternative
  - marker: c
    text: “恳求恩惠”也可译作“求怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִנָּגֵף
  choice: 败下阵来
  rationale: 此处是军事语境中的被动结果，指以色列在仇敌面前战败；这一表达自然、清楚，也保留了原文的受挫含义。
- source_word: לִפְנֵי אוֹיֵב
  choice: 在仇敌面前
  rationale: 贴近希伯来语字面表达，同时符合汉语描述临敌战败的用法；原文单数可作泛指。
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: 因得罪你
  rationale: כִּי在此说明战败的原因；“得罪你”自然表达罪所指向的对象。
- source_word: וְשָׁבוּ
  choice: 回转
  rationale: שׁוב既有返回、转回的基本意象，也可在盟约语境中含悔改之意；“回转”保留这两层可能。
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: 承认你的名
  rationale: ידה的使役词干可表示承认、称颂或感谢；在犯罪后回转的语境中，“承认你的名”保留公开认信、尊崇上帝之名的张力，而不单限定为感谢。
- source_word: וְהִתְפַּלְלוּ
  choice: 祷告
  rationale: 准确而自然地表达פלל的反身词干在此所指的祈祷行动。
- source_word: וְהִתְחַנְּנוּ
  choice: 恳求恩惠
  rationale: חנן的反身词干表示切切求取恩宠或怜悯；“恳求恩惠”兼顾恳切程度与恩典取向。
- source_word: לְפָנֶיךָ
  choice: 向你
  rationale: 汉语祷告语境中，“向你”自然传达在上帝面前直接祈求的意思。
- source_word: בַּבַּיִת הַזֶּה
  choice: 在这殿里
  rationale: בַּ在此通常表示地点；鉴于所指为所罗门奉献的圣殿，“殿”比直译“房屋”更自然，同时仍保留“这”所表达的现场指称。
theological_decisions:
- issue: וְשָׁבוּ是否明确译为悔改
  choice: 回转
  alternative: 悔改；返回
  rationale: 上下文确有犯罪后归向上帝的盟约含义，但原动词的词义范围比专门的“悔改”更广；“回转”不抹去悔改含义，也不把它定为唯一解释。
- issue: וְהוֹדוּ אֶת שְׁמֶךָ所表达的回应
  choice: 承认你的名
  alternative: 称颂你的名；感谢你的名
  rationale: 该动词可涵盖承认、称颂和感谢。犯罪、战败与回转的语境支持认信性的“承认”，但其他褒扬含义仍以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“败下阵来”清楚呈现军事语境；“回转”保留盟约性悔改与一般返回之间的语义张力。句末逗号保留本节与下一节祈求内容的连续关系。
