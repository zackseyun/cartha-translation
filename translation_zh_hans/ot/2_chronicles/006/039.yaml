  text: וְ/שָׁמַעְתָּ֨ מִן הַ/שָּׁמַ֜יִם מִ/מְּכ֣וֹן שִׁבְתְּ/ךָ֗ אֶת תְּפִלָּתָ/ם֙ וְ/אֶת תְּחִנֹּ֣תֵי/הֶ֔ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָ֑/ם וְ/סָלַחְתָּ֥ לְ/עַמְּ/ךָ֖ אֲשֶׁ֥ר חָֽטְאוּ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: zh_hans
  text: 求你从天上、从你的居所垂听他们的祷告和恳求，为他们主持公道[a]，赦免得罪了你的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“秉公处理他们的案件”或“为他们伸张公义”。希伯来语直译为“施行他们的审判”；“审判”在这里也可指公道或案件。
    reason: 保留מִשְׁפָּטָם的司法性及其可指公道或案件的语义范围，避免以“权益”过度具体化。
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: 求你……垂听
  rationale: 该完成式在祷告语境中表达向上帝提出的祈求；“求你”明确其祈愿功能，“垂听”是现代汉语中自然、庄重的祷告用语。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: 希伯来语形式虽为复数，但在此惯用语中指上帝所在的天；“从天上”符合现代汉语表达。
- source_word: מִמְּכוֹן שִׁבְתְּךָ
  choice: 从你的居所
  rationale: מָכוֹן表示固定、确立之处，שִׁבְתְּךָ指“你的居住”；“你的居所”简洁保留其空间含义。
- source_word: תְּפִלָּתָם
  choice: 他们的祷告
  rationale: 采用该词在宗教语境中的常用对应词，并保留原文单数集合意义。
- source_word: תְּחִנֹּתֵיהֶם
  choice: 恳求
  rationale: 该词强调恳切求恩；“恳求”既与“祷告”有别，也自然易懂。
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: 维护他们的权益
  rationale: 原文直译近于“施行他们的审判／案件”，是司法性惯用语，意指为他们秉公处理、主持公道。“维护他们的权益”保留替他们施行公义的方向，同时避免生硬或误解为定罪。
- source_word: וְסָלַחְתָּ לְעַמְּךָ
  choice: 赦免……你的子民
  rationale: סלח在上帝赦罪语境中宜译“赦免”；汉语将受词自然置于动词之后。
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: 得罪了你的
  rationale: חטא加לְ在这里表示犯罪所针对的对象。“得罪了你”自然表达“向你犯罪”，并保留完成行为与当前祈求的关联。
theological_decisions:
- issue: מִשְׁפָּטָם的司法含义
  choice: 维护他们的权益
  alternative: 为他们主持公道；按公义处理他们的案件；施行他们的审判
  rationale: 此处把垂听祷告、司法行动和赦罪并列。译文保留上帝按公义介入并为祈求者行事的含义，却不把该短语限定为无罪宣告或对他们施行惩罚。
- issue: 赦免对象与犯罪方向
  choice: 赦免得罪了你的子民
  alternative: 赦免向你犯罪的子民
  rationale: 保留犯罪是针对上帝而行、同时子民又是蒙赦免对象的张力，不补入悔改等原文本节未明说的条件。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“垂听”“居所”“赦免”保持经文庄严感；避免古奥句式。主文中的[a]与脚注对应。
