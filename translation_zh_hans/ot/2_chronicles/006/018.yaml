  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: zh_hans
  text: 然而，神果真会与人类[a]一同住在地上吗？看哪，天和天上之天尚且容不下你，何况我建造的这殿呢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“与人一同”；这里的“人”是集合性单数，泛指全人类。
    reason: 说明希伯来语 אָדָם 的代表性单数形式及其包含全体人类的意义。
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: 果真
  rationale: 引出带有惊叹意味的反问，既保留“确实、真的”的语义，也符合庄重祷告中的现代汉语表达。
- source_word: יֵשֵׁב
  choice: 住
  rationale: 此处不是强调身体姿态的“坐”，而是指居住、临在；“住”自然地传达这一语境含义。
- source_word: אֶת הָאָדָם
  choice: 与人类一同
  rationale: אֶת 在这里表达伴随关系；אָדָם 是代表全体人的集合性单数，因此译作“人类”比“一个人”更准确。
- source_word: עַל הָאָרֶץ
  choice: 在地上
  rationale: 直接表达地点，符合现代汉语习惯。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文唤起注意和加强语气的作用，也维持祷告的庄重语体。
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: 天和天上之天
  rationale: 保留希伯来语层层提升的表达及其宇宙意象；“天上之天”在中文圣经语体中庄重且仍可理解。
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: 容不下你
  rationale: 该动词在此表示没有足够容量可以容纳；“容不下”清楚传达神不受受造空间限制。
- source_word: אַף כִּי
  choice: 何况
  rationale: 准确表达由大到小的递进论证：连诸天都容不下神，这座殿就更不可能。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת 字面为“房屋”，但此处明确指刚建成的圣殿；“这殿”在中文中既自然又避免被误解为普通住宅。
- source_word: אֲשֶׁר בָּנִיתִי
  choice: 我建造的
  rationale: 简洁表达已经完成、在当前祷告中仍具现实关联的建造行动。
theological_decisions:
- issue: אָדָם 在代表全体人的语境中如何翻译
  choice: 人类
  alternative: 人；世人
  rationale: 原文使用集合性、代表性的单数 אָדָם，重点是神与全体人类之间的对照，而非特指一名男性。“人类”在现代汉语中准确涵盖这一范围；脚注说明其原文形式，避免抹平表达特点。
- issue: 圣殿是否能够容纳神
  choice: 保留反问和“何况”的递进结构，不将“住”解释为神被局限在殿内
  alternative: 直陈为神不住在人造殿宇中
  rationale: 原文以反问表达神的超越性，同时仍处于求神临在的献殿祷告中。译文保留这种张力，不把经文改写成单一的神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“看哪”与“天上之天”保留原文的提升感；其余句法按自然汉语调整。反问号和末尾感叹号呈现所罗门的惊叹及递进语势。
