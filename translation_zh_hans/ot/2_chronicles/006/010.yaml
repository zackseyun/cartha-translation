id: 2CH.6.10
reference: 2 Chronicles 6:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: zh_hans
  text: 耶和华成就了他所说的话[a]；我接续我父亲大卫，坐在以色列的王位上，正如耶和华所说的；我建造了这殿，为耶和华——以色列的上帝——的名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成就了”也可译作“实现了”“使……成立了”或“使……得以坚立”。希伯来语动词字面意思是“使他的话站立”。
    reason: lexical_alternative
  - marker: b
    text: “这殿”原文作“这房屋”，在这里指圣殿。原文保留“为耶和华的名建造房屋”这一表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 使……实现了
  rationale: 希伯来语使役形直译为“使……站立”，用于话语或应许时表示使其成立、成就或实现；“使……实现了”在现代汉语中自然，并保留使役意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神圣名字译法，而不以称号“主”替代专名。
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: 他所说的话
  rationale: 保留“话”与“说”的词根呼应，不直接窄化为“应许”。
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: 我接替我父亲大卫登位
  rationale: תַּחַת 在王位继承语境中表示“代替、接替”；将“起来”译作“登位”，自然表达所罗门继承王位的含义。
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: 坐在以色列的王位上
  rationale: 直译王权用语；“王位”比单独的“宝座”更清楚地呈现此处统治权的语境。
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: 我也……建造了这殿
  rationale: הַבַּיִת 字面是“这房屋/那房屋”，在语境中专指圣殿；正文用“这殿”避免现代读者误解，同时脚注说明原文措辞。
- source_word: לְשֵׁם יְהוָה
  choice: 为耶和华……的名
  rationale: 保留“为……的名”这一重要而略显特殊的原文表达，不解释成仅仅“为了尊崇”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 采用清楚、庄重的现代标准汉语表达。
theological_decisions:
- issue: “为耶和华的名”如何表达
  choice: 保留“为……的名”
  alternative: 译作“为尊崇耶和华”
  rationale: 原文刻意说圣殿是为神的“名”而建；保留此表达可避免暗示圣殿能够容纳或限制上帝，也不把其神学内涵单一化。
- issue: הַבַּיִת 的所指
  choice: 正文译“这殿”，脚注保留其字面义“这房屋”
  alternative: 正文译“这房屋”
  rationale: 上下文明确指圣殿；“这殿”对普通读者更自然，而脚注使读者仍可看见原文及其圣约性表达。
- issue: 神圣名字 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是简体中文读者最熟悉且可辨识为专名的传统音译；不以“主”取代原文专名。“雅威”是较接近现代学术重构的另一音译。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以分号呈现原文连续并列的叙述结构；“接替……登位”清楚表达王位继承，“为……的名”则有意保留原文的神学措辞和张力。
