id: 2CH.6.17
reference: 2 Chronicles 6:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ אֲשֶׁ֥ר דִּבַּ֖רְתָּ לְ/עַבְדְּ/ךָ֥ לְ/דָוִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: zh_hans
  text: 如今，耶和华，以色列的上帝啊，愿你向你仆人大卫所说的话得以成就。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿你……所说的话得以成就”也可译作“愿你的应许得以确立”或“愿你的话显为真实”。
    reason: 说明 יֵאָמֵן 可表示被确立、在实现中证实为真，而 דְּבָרְךָ 在本语境中也可理解为“应许”。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为时间兼话语推进标记，引出所罗门接下来的祈求；现代汉语用“现在”自然清楚，希伯来语连接词 וְ 无须机械译出。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 按现代汉语圣经传统音译上帝的专名四字神名，与作为称号的“主”相区别。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留原文的从属结构，表明耶和华是以色列的上帝。
- source_word: יֵאָמֵן
  choice: 得以成就
  rationale: אמן 的未完成式尼法勒在此用于祈愿，指上帝所说的话被确立并在实现中证实可靠；“得以成就”符合汉语祷告语境，同时保留结果性。
- source_word: דְּבָרְךָ
  choice: 你……所说的话
  rationale: 保留 דָּבָר 的基本义“话”，不直接解释为“应许”；与后面的 דִּבַּרְתָּ 形成原文的词义呼应。
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: 所说的
  rationale: 采用自然的汉语关系结构，保留“说”这一动词，而不把它解释性地改译为“应许”。
- source_word: לְעַבְדְּךָ לְדָוִיד
  choice: 向你仆人大卫
  rationale: דבר 与 ל 连用时，ל 标示话语的对象；“仆人”适合此处君王与上帝之关系，不宜译成容易产生人身奴役联想的“奴隶”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用上帝的专名而非称号。简体中文面向普通读者的经文采用通行且可辨识的“耶和华”，既保留专名性质，也不以“上主”替代原文神名。
- issue: דְּבָרְךָ 是否解释为“应许”
  choice: 你……所说的话
  alternative: 你的应许
  rationale: 上下文确实涉及上帝对大卫的应许，但原文使用较宽泛的“话”；正文保留这一措辞，让应许含义由语境表达，脚注说明可行的解释性译法。
- issue: יֵאָמֵן 所表达的实现与真实性
  choice: 得以成就
  alternative: 得以确立；显为真实
  rationale: 尼法勒形式可涵盖被确立、证实为真以及应验的意味。正文采用自然且符合语境的“得以成就”，脚注保留其余真实可能，避免把词义张力完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。呼语“耶和华—以色列的上帝啊”以破折号清楚呈现同位关系；句法略作汉语化调整，但保留“话／说”的原文呼应及祈愿语气。
