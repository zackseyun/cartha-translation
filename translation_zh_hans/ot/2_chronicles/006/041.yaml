id: 2CH.6.41
reference: 2 Chronicles 6:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: zh_hans
  text: 如今，耶和华上帝啊，求你起来，进入你的安息之所；你和你能力的约柜[a]一同进入。耶和华上帝啊，愿你的祭司披戴拯救[b]；愿忠于你的人因美善而欢喜[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你能力的约柜”也可译作“你权能的约柜”或“你力量的约柜”。
    reason: lexical_alternative
  - marker: b
    text: “拯救”也可译作“救恩”“解救”或“得胜”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“因你的美善而欢喜。”希伯来文直译为“因那美善（好处）”，没有明说“你的”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既保留转入祈求高潮的时间和话语功能，又符合现代汉语表达；上下文的承接关系无需机械译出“和”。
- source_word: קוּמָה
  choice: 求你起来
  rationale: 保留祷告中命令式的“起来”，并用“求”体现汉语对上帝祈求时自然、庄重的语气。
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝啊
  rationale: 直接音译圣名，并以“啊”明确呼格；“上帝”自然对应 אֱלֹהִים。
- source_word: לְנוּחֶךָ
  choice: 进入你的安息之所
  rationale: 此处既有“安息”也有抵达固定居所的含义；“安息之所”适合圣殿与约柜的语境。
- source_word: אַתָּה וַאֲרוֹן עֻזֶּךָ
  choice: 你和你大能的约柜一同进入
  rationale: 补出“一同进入”使汉语句法完整，同时保留上帝与约柜并列进入安息之所的结构；“你大能的约柜”不把 עֹז 过度具体化。
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: 披上拯救
  rationale: 保留原文鲜明的衣着隐喻；תְשׁוּעָה 在此可涵盖拯救、解救和得胜，正文采用范围较广的“拯救”。
- source_word: חֲסִידֶיךָ
  choice: 忠于你的人
  rationale: 表达 חָסִיד 所含对上帝忠诚、虔敬的关系性意义，避免“圣徒”可能带入的后期专门称谓。
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: 因美善而欢喜
  rationale: 原文只说“在/因那美善（好处）”，没有明示所属；“美善”保留其可指良善、福祉或上帝恩惠的开放性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代简体中文读者最熟悉且仍作为专名使用的“耶和华”，不以“主”替代原文明确出现的神名。
- issue: בַטּוֹב 是否应明确译为“因你的美善”
  choice: 因美善而欢喜
  alternative: 因你的美善而欢喜
  rationale: 祷告语境使“你的美善”成为合理解释，但希伯来文没有第二人称所属后缀；正文不补出所属关系，以保留原文的含混和神学张力。
- issue: תְשׁוּעָה 的语义范围
  choice: 拯救
  alternative: 救恩；解救；得胜
  rationale: “拯救”既可表示上帝施行的行动，也可表示祭司所披戴的拯救状态，且不像较术语化的“救恩”那样预先限定神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。两次呼语“耶和华上帝啊”均予保留；通过补出“求”和“一同进入”使希伯来语命令句及并列结构在汉语中自然，但不消除“美善”的语义开放性。
