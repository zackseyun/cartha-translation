source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: zh_hans
  text: 我把约柜安放在那里，柜中有雅威的约，就是他与以色列子民[a]所立的约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，这是对以色列百姓的惯常称呼。
    reason: 说明原文的性别化形式及其群体含义。
lexical_decisions:
- source_word: וָאָשִׂים
  choice: 我把……安放
  rationale: שׂוּם意为“放置、安放”。这里指所罗门已经把约柜放在圣殿中；“安放”既自然庄重，也体现这一行动已经完成。
- source_word: שָׁם
  choice: 在那里
  rationale: 直译为“那里”，回指前文所说的圣殿或至圣所。
- source_word: הָאָרוֹן
  choice: 约柜
  rationale: אָרוֹן本义为“柜、箱”，在此礼仪语境中专指承载立约凭据的圣柜；汉语通行且准确的称呼是“约柜”。
- source_word: אֲשֶׁר שָׁם
  choice: 柜中有
  rationale: 这一关系结构表达约在柜中；汉语用“柜中有”简洁自然，也保留其空间含义。
- source_word: בְּרִית יְהוָה
  choice: 雅威的约
  rationale: בְּרִית译作“约”，表达上帝与以色列之间正式而具约束力的关系；属格结构译作“雅威的约”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名YHWH，保留其作为专名的性质，而不以称号代替。
- source_word: אֲשֶׁר כָּרַת
  choice: 就是他……所立的约
  rationale: כרת ברית字面为“切约”，是希伯来语中“立约”的固定表达；汉语以“立约”准确传达其惯用意义。“就是”清楚连接前面的“雅威的约”与后面的说明。
- source_word: עִם
  choice: 与
  rationale: 在立约语境中表示立约的另一方，译作“与”最为准确。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子民
  rationale: 字面是“以色列的众子”，但在此是指作为立约群体的以色列百姓。“以色列子民”在现代汉语中自然，并保留“子民”这一群体称谓；字面形式另见脚注。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用的是以色列上帝的专名，而非一般称号。“雅威”直接呈现该专名，避免将其默默替换为“主”；“耶和华”是传统形式，但较不贴近通常重构的读音。
- issue: “雅威的约”与“他所立的约”的关系
  choice: 保留“雅威的约，就是他……所立的约”的复述结构
  alternative: 合并为“雅威与以色列子民所立的约”
  rationale: 原文先说“雅威的约”，再以关系从句说明这是他与以色列人所立的约。保留复述可更完整地体现原文结构与强调。
- issue: בְּנֵי יִשְׂרָאֵל所指群体
  choice: 以色列子民
  alternative: 以色列的众子；以色列人
  rationale: 该短语形式上为阳性复数，但在立约语境中是全体以色列民的惯用名称，不宜让现代读者误以为只包括男性。脚注保留其字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“安放”“约柜”“立约”符合圣殿与立约语境；句式保留原文先陈述约的归属、再说明立约对象的层次。
