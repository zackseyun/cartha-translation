  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הָשִׁ֣יב לְ/רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: zh_hans
  text: 求你从天上垂听，采取行动，审判你的仆人：使恶人受报，将他所行的归到他自己头上[a]；判定义人有理[b]，照他的义回报他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“把他的道路放在他头上”。这是希伯来语习用语，表示一个人所行的在审判中归回到他自己身上。
    reason: cultural_note
  - marker: b
    text: 也可译“宣告义人为义”。这里的希伯来语是司法用语，指判定某人有理，或按某人有理来对待。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: 从天上垂听
  rationale: שׁמע在向上帝祷告的语境中不只是听见，也含有留意并回应之意；“垂听”自然、庄重，并保留祷告语体。希伯来语“天”为复数形式，但此处现代汉语惯用单数概念“天上”。
- source_word: וְעָשִׂיתָ
  choice: 采取行动
  rationale: עשׂה本义宽泛，可指“做、行”；在此司法祈求中指上帝作出实际回应。“采取行动”比单说“行”更清楚，又没有具体化原文未说明的行动。
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: 审判你的仆人
  rationale: 上下文以恶人与义人的相反判决展开，שׁפט在这里具有明确的司法含义；עבדים在祷告中指属于上帝、服事上帝的人，译作“仆人”比“奴隶”合宜。
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: 使恶人受报
  rationale: 这里的שׁוב使役式表达报应，即使恶人的行为后果返回到他身上；“使恶人受报”以自然汉语表达其司法结果。
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: 把他所行的归到他自己头上
  rationale: “道路”在希伯来语中常指人的行为或行事方式；译文保留“归到头上”的具体意象，并用“所行的”清楚表达其语义。
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: 判定义人有理
  rationale: הצדיק在司法语境中指宣告或认定某人站在正确的一方。“判定……有理”保留法庭含义，也避免现代汉语“称义”可能引入本段之外的后期神学联想。
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: 照他的义报给他
  rationale: 原文表达与义人的义相称的回报。“照他的义”直接保留צדקה的措辞；“报给他”与前半句恶人受报形成对称，同时没有把回报过度具体化。
theological_decisions:
- issue: 上帝审判的司法性质
  choice: 采用“审判、判定有理、受报”等司法性措辞
  alternative: 理解为一般性的治理或介入，不突出法庭语境
  rationale: שׁפט、הצדיק以及恶人与义人的对举共同显示法庭判决的语境；译文保留这种司法张力，但不引入后期教义体系。
- issue: הצדיק的译法
  choice: 判定义人有理
  alternative: 称义人、宣告义人为义、为义人伸冤
  rationale: 该词在这里指司法上的判定。“判定有理”在现代汉语中清楚自然；脚注列出更贴近形式的译法，以保存原词可能的表达范围。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你……垂听”符合汉语向上帝祈求的自然表达；冒号和分号呈现原文中审判恶人与判定义人有理的平行结构。
