  naturalness: “天闭塞”虽可理解，但在现代标准汉语中略显生硬；改为“当天闭塞、不下雨时”可明确原文的时间条件，也更自然。祷告语境中“应允他们”比“回应了他们”更合汉语圣经语体，且不把未完成式强行处理为过去完成。
