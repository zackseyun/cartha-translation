source:
  edition: WLC
  text: בְּ/הֵעָצֵ֧ר הַ/שָּׁמַ֛יִם וְ/לֹֽא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: zh_hans
  text: 当天闭塞、不下雨时，因他们得罪了你；他们若向这地方祷告，承认你的名，离开自己的罪，因为你应允他们[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你使他们受苦”，或“因为你使他们谦卑”。这里的希伯来语动词也可能表达“使受苦”或“使谦卑”。
    reason: 保留末句希伯来语动词可能具有的词汇歧义，同时正文按祷告语境采用“应允”。
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: 天闭塞
  rationale: בְּ加尼法不定式构成时间条件，描绘雨水被阻、天空如同关闭；“天闭塞”保留原文意象及庄重语体。
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: 不下雨
  rationale: 自然地表达“不再有雨”的结果，比直译“没有雨”更符合现代汉语。
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: 因为他们得罪了你
  rationale: כִּי取因果义，לָךְ表达罪所针对的对象；“得罪了你”准确、自然。
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: 他们若向着这地方祷告
  rationale: אֶל在此表示祷告所朝的方向，而非把这地方当作祷告对象；汉语补出“若”以显明连续条件结构。
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: 承认你的名
  rationale: ידה的使役式可指称谢、赞美或承认；在犯罪、祷告和回转的悔改语境中，“承认你的名”较能表达公开承认神及其权柄，同时不扩写为特定认信公式。
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: 离开自己的罪
  rationale: שוב מן直指从罪中转离；“离开自己的罪”保留方向性意象，避免以神学术语“悔改”取代原文动作。
- source_word: כִּי תַעֲנֵם
  choice: 因为你回应了他们
  rationale: 按ענה“回答、回应”的词根理解，与前面的祷告形成呼求—回应关系；汉语采用完成体以表达神的回应促成其回转。
theological_decisions:
- issue: 末句 תַעֲנֵם 的含义
  choice: 因为你回应了他们
  alternative: 因为你使他们受苦／使他们谦卑
  rationale: 无元音词形可涉及两个同形词根传统：ענה“回答”和ענה“使受苦、压低”。祷告语境支持“回应”，但“使受苦／谦卑”可把旱灾理解为促使人回转的管教，因此以脚注保留真实歧义。
- issue: וְהוֹדוּ אֶת שְׁמֶךָ 的语境义
  choice: 承认你的名
  alternative: 称谢你的名／赞美你的名
  rationale: ידה使役式语义范围包括承认、称谢和赞美；此处悔罪链条使“承认”较合适，但不应把它收窄为某一宗派性的认信观念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天闭塞”保留希伯来诗性意象；全节在原段落中是未完的条件从句，因此末尾保留逗号，衔接下一节。所有代词按本项目常规不使用敬称“祢”。
