  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: zh_hans
  text: 但雅威我的上帝啊，求你垂顾你仆人的祷告和恳求[a]，垂听你仆人在你面前所作的呼求[b]和祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求”所译的希伯来语，指恳切祈求怜悯或恩惠。
    reason: lexical_alternative
  - marker: b
    text: 或译“响亮的呼声”。这个词可指高声呼喊；在这里很可能是祷告中求助的呼声。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: 但……求你垂顾
  rationale: פנה本义为“转向”；在祷告语境中是请求上帝眷顾、留意。“垂顾”既自然庄重，也保留了带有恩待意味的关注；“但”承接上文，突出所罗门转而恳求上帝。
- source_word: תְּפִלַּת
  choice: 祷告
  rationale: תפלה的常用对应词；与后面的תחנה区分开来。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 在君王向上帝祷告的语境中，“仆人”自然地表达臣服身份，而不必强化为社会制度意义上的“奴隶”。
- source_word: תְּחִנָּתוֹ
  choice: 恳求
  rationale: תחנה指恳切祈求恩惠或怜悯；“恳求”简明自然，其语义细节以脚注说明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号代替。
- source_word: אֱלֹהָי
  choice: 我的上帝
  rationale: 直接表达第一人称所属关系，并保留呼语功能。
- source_word: לִשְׁמֹעַ
  choice: 垂听
  rationale: 该不定式说明“垂顾”的目的；“垂听”符合现代汉语庄重祷告语体，并包含认真听取之意。
- source_word: הָרִנָּה
  choice: 呼求
  rationale: רנה可指响亮的呼声；在祷告语境中很可能是求助的呼喊。“呼求”既符合上下文，也不将其弱化为普通话语。
- source_word: הַתְּפִלָּה
  choice: 祷告
  rationale: 保留原文重复用词及其与“呼求”构成的并列关系。
- source_word: מִתְפַּלֵּל
  choice: 所作的……祷告
  rationale: 以汉语关系结构表达仆人在上帝面前祷告的行动；不生硬重复“正在祷告”。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 贴近希伯来语惯用表达，同时在现代汉语中自然地传达“在你临在之中”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名。译作“雅威”保留专名，并较贴近学界通常重构的读音；不以“主”这一称号替换。
- issue: וּפָנִיתָ是否表达恩待性的关注
  choice: 垂顾
  alternative: 转向；留意
  rationale: 原词保有“转向”的意象，但在此祷告语境中实际请求上帝施恩关注。“垂顾”传达语境功能，同时没有把回应或应允预先写入译文。
- issue: רנה在本节中的情感色彩
  choice: 呼求
  alternative: 响亮的呼声；欢呼
  rationale: 该词在别处可带欢乐色彩，但与恳求和祷告并列时更可能指向上帝发出的求助呼声。脚注保留其声音响亮这一词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“垂顾”“垂听”保持敬语色彩，但避免过度古雅；两次“祷告”有意保留原文的重复和平行结构。
