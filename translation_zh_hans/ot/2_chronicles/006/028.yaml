  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: zh_hans
  text: 这地若有饥荒、瘟疫、热风灾害、霉害、蝗虫或食庄稼的害虫[a]；仇敌若在他境内的城邑围困他[b]；无论有什么灾祸、什么疾病——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食庄稼的害虫”所译的希伯来词泛指吞食、毁坏庄稼的虫类，也可译作“吞噬庄稼的蝗虫”；具体是哪一种昆虫并不确定。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在他城门之地”；“城门”在这里借指境内的城市或城镇。
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: 饥荒
  rationale: 在一连串遍及全地的灾害中，指粮食严重短缺的饥荒，而非一般饥饿。
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 指流行性致命疾病；“瘟疫”是现代汉语中自然且庄重的对应词。
- source_word: שִׁדָּפוֹן
  choice: 旱风之灾
  rationale: 该词指庄稼因灼热、干燥的风而受损；此译法比笼统的“枯萎”更具体，同时不把它误解为普通旱灾。
- source_word: יֵרָקוֹן
  choice: 霉病
  rationale: 指使作物变黄、枯败的植物病害；“霉病”沿用农业灾害语境中的通行表达。
- source_word: אַרְבֶּה
  choice: 蝗虫
  rationale: 在灾害清单中指成群毁坏庄稼的蝗虫。
- source_word: חָסִיל
  choice: 食粮虫
  rationale: 词义核心是吞食、毁坏作物的虫类，具体物种不确定；采用概括性译名，并以脚注说明。
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: 仇敌若围困他
  rationale: צור 的使役形在军事语境中表示逼迫、围困；“围困”最符合上下文。
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: 他境内的城邑
  rationale: 原文直译为“他城门之地”；“城门”借代设防的城市或城镇，正文按现代汉语自然表达其所指。
- source_word: כָּל נֶגַע
  choice: 无论有什么灾祸
  rationale: נֶגַע 可指击打、灾害或严重祸患；此处作为总括语，用“灾祸”可避免与前面的“瘟疫”不必要地重复。
- source_word: כָל מַחֲלָה
  choice: 什么疾病
  rationale: מַחֲלָה 泛指疾病，与“灾祸”并列，概括前述及其他苦难。
