base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: zh_hans
  text: 现在，我的神啊，求你睁眼看，侧耳听这地方的祷告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这地方献上的祷告”，或“从这地方发出的祷告”。希伯来文直译为“这地方的祷告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 既可表示时间，也可作为话语转换标记；“现在”自然承接所罗门最后的祈求。
- source_word: אֱלֹהַי
  choice: 我的神啊
  rationale: 第一人称单数词尾表达“我的”，此处为直接呼告；加“啊”符合现代汉语庄重祷告语体。
- source_word: יִהְיוּ נָא
  choice: 求你……
  rationale: 祈愿式与语气词 נָא 共同表达恳求；汉语用“求你”自然传达谦恭的祈请语气。
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: 睁眼看
  rationale: 保留神以眼关注的具体意象，同时按汉语习惯补出“看”，使表达自然；不将其抽象化为“眷顾”。
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: 侧耳听
  rationale: קַשֻּׁבוֹת 表示留心、专注聆听；“侧耳听”是自然且庄重的汉语表达，并保留耳朵聆听的意象。
- source_word: לִתְפִלַּת
  choice: 听……祷告
  rationale: 介词 לְ 标示注意所朝向的对象；与“侧耳听”组合后，以“听……祷告”符合汉语配搭。
- source_word: הַמָּקוֹם הַזֶּה
  choice: 这地方的
  rationale: 直译希伯来语属格结构，不在正文中擅自限定为“在这里献上的”或“从这里发出的”。
theological_decisions:
- issue: 描写神的眼和耳之拟人意象
  choice: 保留“睁眼看，侧耳听”的具体意象
  alternative: 意译为“求你关注并垂听”
  rationale: 原文借眼和耳表达神对祷告的关注与聆听。保留意象可维持经文的文学与神学张力，而不必据此推断神具有肉身。
- issue: “这地方的祷告”所指关系
  choice: 正文保留宽泛的属格表达“这地方的祷告”
  alternative: “在这地方献上的祷告”或“从这地方发出的祷告”
  rationale: 希伯来语本身没有明确说明祷告与地方之间是发生地点、来源还是关联关系，因此不在正文中消除这项真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“我的神啊”“求你”保留直接呼告和恳求语气；“睁眼看，侧耳听”兼顾原文意象与自然汉语。
