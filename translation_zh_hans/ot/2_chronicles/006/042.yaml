base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: zh_hans
  text: 耶和华上帝啊，不要拒绝你的受膏者[a][b]；求你记念向你仆人大卫所施的慈爱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不要转离你受膏者的脸”，意思是“不要拒绝你的受膏者”。
    reason: lexical_alternative
  - marker: b
    text: “受膏者”也可译作“弥赛亚”；按本节语境，也可译作“王”。
    reason: alternative_reading
  - marker: c
    text: 也可译作“求你记念对你仆人大卫的怜悯”或“求你记念你对仆人大卫守约的信实”。原文也可能理解为“你仆人大卫的诸般慈爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: 耶和华上帝
  rationale: 以“耶和华”音译圣约之名，以“上帝”表达其后的通用神圣称号；在呼语中自然译作“耶和华上帝啊”。
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: 不要拒绝
  rationale: 希伯来语直译为“不要使……的脸转回”，在此是不可拒绝或不接纳某人的惯用表达。正文采用现代汉语中清楚自然的“不要拒绝”，并在脚注保留原文的面容意象。
- source_word: מְשִׁיחֶךָ
  choice: 你的受膏者
  rationale: 该词指受膏立的王，也与“弥赛亚”同源。“受膏者”既符合本节王室祷告的直接语境，也保留经卷整体可能产生的弥赛亚意蕴，而不将其过早限定。
- source_word: זָכְרָה
  choice: 求你记念
  rationale: 祷告语境中的祈使式用“求你记念”庄重而自然，也表达圣约祈求中请上帝按所记念之事采取行动的含义。
- source_word: לְחַסְדֵי
  choice: 向……所施的慈爱
  rationale: חֶסֶד可表示坚定的爱、怜悯或守约的信实。介词לְ使“大卫”较自然地被理解为这种慈爱的对象；“所施的慈爱”使汉语关系清楚，同时以脚注保留压缩结构的其他理解。
- source_word: דָּוִיד עַבְדֶּךָ
  choice: 你仆人大卫
  rationale: 依照自然汉语语序表达“大卫，你的仆人”，保留大卫在上帝面前的身份称谓。
theological_decisions:
- issue: 王室祷告中מְשִׁיחֶךָ的译法及其弥赛亚意蕴
  choice: 你的受膏者
  alternative: 你的弥赛亚；你的王
  rationale: 直接语境指大卫王朝中受膏立的王。“受膏者”忠实保留词义，同时不排除正典中的弥赛亚关联，也不把后期更明确的称号含义强加给本节。
- issue: חַסְדֵי דָּוִיד中慈爱的施予者与对象
  choice: 向你仆人大卫所施的慈爱
  alternative: 你仆人大卫的诸般慈爱；对你仆人大卫的怜悯；对大卫守约的信实
  rationale: 原文结构简练，字面上可理解为“大卫的慈爱／怜悯”。结合祷告语境，正文采用上帝向大卫施行慈爱这一较自然的理解；脚注明确保留其他可能，避免抹平语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你记念”保留经文的圣约祈求语气；正文以自然汉语表达希伯来惯用语，并用脚注保存其字面意象、王室／弥赛亚词义范围及חֶסֶד短语的真实歧义。
