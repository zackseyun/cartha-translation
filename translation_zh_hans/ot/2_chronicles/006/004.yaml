  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣יד אָבִ֑/י וּ/בְ/יָדָ֥י/ו מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: zh_hans
  text: 他说：“耶和华——以色列的神——当受称颂！他曾亲口对我父大卫说话，又亲手成全了所说的话[a]，说：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“他用自己的口对我父大卫说，又用自己的手成全。”这里“口”与“手”刻意对应，强调神所说的，他也亲自实行。
    reason: 保留原文拟人措辞及平行结构，并说明正文自然汉语表达背后的字面形式。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 希伯来语叙事式动词承接上文，引出所罗门的话；现代汉语用“他说”自然简洁。
- source_word: בָּרוּךְ
  choice: 当受称颂
  rationale: 这是向神发出的颂赞公式；“当受称颂”既保留庄重语气，也比单纯描述性的“是有福的”更符合此处功能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，在现代简体中文圣经语境中采用广为人知的音译“耶和华”，不以称号替代专名。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 如实表达附属结构及神与以色列的关系。
- source_word: דִּבֶּר בְּפִיו
  choice: 亲口……说话
  rationale: 保留“用他的口”这一拟人表达，并以自然汉语“亲口”呈现，与下文“亲手”构成刻意的平行。
- source_word: אֵת דָּוִיד אָבִי
  choice: 对我父大卫
  rationale: 在דבר的语境中，大卫是说话的对象；“对我父大卫”准确而自然。
- source_word: וּבְיָדוֹ מִלֵּא
  choice: 也亲手成全了
  rationale: “亲手”保留工具性和与“亲口”的平行；“成全”表达神将所说之事付诸实现。宾语依汉语习惯省略，仍可由上文明确领会。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出下一节直接引语内容的常规引语标记；句末用“说”保留其衔接作用。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。中文采用传统且通行的“耶和华”，既明确其为专名，也避免以“主”等称号取代；“雅威”是另一种较贴近学术重建读音的音译。
- issue: 神“亲口”说与“亲手”成全的拟人和平行表达
  choice: 保留“亲口／亲手”
  alternative: 意译为“应许／实现”
  rationale: 原文刻意把神的口与手对应起来，强调言语与行动的一致；保留这一形象，不把它化约为抽象神学表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以破折号标明“以色列的神”是对“耶和华”的同位说明；用“亲口／亲手”兼顾汉语自然度和原文平行。脚注标记置于引语引介词“说”之后，以说明整组表达。
