source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: zh_hans
  text: 求你垂听你仆人和你子民以色列的恳求；他们向着这地方祷告时，求你从你的居所，就是从天上垂听。求你垂听并赦免。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ（שׁמע）
  choice: 求你垂听 / 求你……垂听 / 求你垂听
  rationale: 原文三次重复同一动词，构成全节的祈求框架。“垂听”既保留重复，也符合现代汉语中向上帝祷告时庄重而自然的表达；三处均按上下文表达祈愿语气，不把最后一处擅自改成时间从句。
- source_word: תַּחֲנוּנֵי
  choice: 恳求
  rationale: 该词指迫切求恩、求怜悯的话。“恳求”通俗庄重，也保留了原词的情感力度。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 在所罗门向上帝献上的王室祷告中，这是自谦并表明归属关系的称谓；“仆人”比“奴隶”更符合此处语境。
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: 和你子民以色列
  rationale: “子民”清楚表达以色列是归属上帝的群体，并与“你仆人”形成自然并列。
- source_word: אֲשֶׁר יִתְפַּלְלוּ
  choice: 他们……祷告时
  rationale: 关系结构在此具有情境或时间意味；译为“祷告时”能自然连接前面的“恳求”，且不改变动作主体。
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: 向着这地方
  rationale: 介词 אֶל 在这里带方向性，所指是圣殿。“向着”准确表达祷告方向，同时不暗示上帝居于圣殿之内。
- source_word: מִמְּקוֹם שִׁבְתְּךָ
  choice: 从你的居所
  rationale: 简洁保留“你居住之处”的含义，语体庄重而不古奥。
- source_word: מִן הַשָּׁמַיִם
  choice: 就是从天上
  rationale: 原文以同位性表达说明上帝的居所是在天上；加入“就是”使汉语关系清楚，同时保留第二个“从”所带来的强调。
- source_word: וְסָלָחְתָּ
  choice: 并赦免
  rationale: 该动词在此指上帝赦免罪责。“赦免”是清楚、庄重且具有相应神学含义的现代汉语表达。
theological_decisions:
- issue: 上帝的超越性与圣殿的关系
  choice: 保留人向着圣殿祷告、上帝却从天上的居所垂听这两个并置的陈述。
  alternative: 把上帝的居所直接定位在圣殿，或把向着圣殿祷告纯粹解释为象征行为。
  rationale: 希伯来文有意同时陈述祷告所朝向的“这地方”与上帝在天上的“居所”。译文不消解这层张力，也不额外加入教派性解释。
- issue: 末尾两个动作的关系
  choice: 译为“求你垂听并赦免”，将二者都保留为祈求。
  alternative: 译为“你听见以后，就赦免”，明确处理成时间与结果关系。
  rationale: 希伯来文以两个连续的动词形式并列；上下文支持祈愿语气，但并未明标时间从属关系，因此不在正文中把这种关系说死。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。保留三次“垂听”的修辞重复，并用“向着这地方”与“从你的居所，就是从天上”清楚呈现圣殿方向和天上居所的对照。英文咨询稿所列脚注的标记位置与内容不相符，且该词义在中文正文中无需另注，因此本稿不设置脚注。
