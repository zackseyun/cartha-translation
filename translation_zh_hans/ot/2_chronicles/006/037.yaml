base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: zh_hans
  text: 他们若在被掳到的那地反省醒悟[a]，回转，并在他们被掳之地向你恳求，说：‘我们犯了罪，行了悖谬的事，作了恶。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“使（这事）回到他们心里”，是指把这事重新放在心上，因而反省、醒悟。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: 回心自省
  rationale: 原文直译为“使之回到他们心里”，指内心反省并醒悟。“回心自省”既保留“心”的意象，也自然表达悔悟语境；脚注说明其字面结构。
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: 在被掳到的那地
  rationale: נשבה 的尼פעל词形表示“被掳”。此译简洁自然，并保留具体的被掳处境。
- source_word: וְשָׁבוּ
  choice: 回转过来
  rationale: שׁוב 可兼指实际返回与转向、悔改。此处结合恳求和认罪，含属灵回转之意；译作“回转”保留其隐喻和语义张力，不直接窄化为“悔改”。
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: 向你恳求
  rationale: חנן 的 Hitpael 词形表示为求恩惠而迫切祈求。“恳求”庄重、清楚，并保留请求的迫切意味。
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: 在被掳之地
  rationale: שְׁבִי 指被掳或俘虏的状态。“被掳之地”贴近原文，同时符合现代中文表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 标准引语标记，用“说”自然引出认罪内容。
- source_word: חָטָאנוּ
  choice: 我们犯了罪
  rationale: 准确表达标准认罪用语；“犯了罪”在现代中文中自然明确。
- source_word: הֶעֱוִינוּ
  choice: 行了邪僻的事
  rationale: עוה 的 Hiphil 词形含行为扭曲、偏邪之意。“行了邪僻的事”保留道德偏曲的形象和庄重语气，并与相邻认罪动词有所区分。
- source_word: וְרָשָׁעְנוּ
  choice: 作了恶
  rationale: רשע 表示行恶或有罪。“作了恶”保留动词力量，中文自然，并使三重认罪形成递进。
theological_decisions:
- issue: 被掳处境中的回转用语
  choice: 将 וְשָׁבוּ 译为“回转过来”
  alternative: “归回”或“悔改”
  rationale: 本节同时描写内心醒悟、转向、恳求和认罪。“回转”既可表达向神转回，也不完全排除归返的空间意涵，因而避免把原文过早限定为单一教义术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“回心自省”保留希伯来文“心”的意象；三重认罪分别译为“犯了罪、行了邪僻的事、作了恶”，以体现原文并列而渐强的修辞。
