  text: וַֽ/אֲנִ֛י בָּנִ֥יתִי בֵית זְבֻ֖ל לָ֑/ךְ וּ/מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/002.yaml
  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: zh_hans
  text: 但我为你建造了一座高大的殿宇，作为你永远居住的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵית זְבֻל
  choice: 宏伟的殿宇
  rationale: “בֵית”是房屋、殿宇；罕见词“זְבֻל”在此可指高处、崇高或宏伟的居所。结合圣殿语境，译作“宏伟的殿宇”，既自然庄重，也不把词义过度限定为抽象的“尊贵”。
- source_word: מָכוֹן
  choice: 地方
  rationale: 本词指固定、预备好的所在或居所；在“作为你……居住的”结构中译作“地方”，符合现代汉语表达，并保留其作为确定居所的意义。
- source_word: לְשִׁבְתְּךָ עוֹלָמִים
  choice: 你永远居住
  rationale: 直译其“供你居住，直到永远”的意义；“永远”保留“עוֹלָמִים”的长久、永久表达，不额外解释其神学范围。
theological_decisions:
- issue: 圣殿是否被表述为神永久且受限的住所
  choice: 按原文译为“作为你永远居住的地方”
  alternative: 作为你永远临在的地方
  rationale: 原文使用“居住”而非仅指“临在”；应保留所罗门话语本身的强烈表述及其与上下文中“天和天上的天尚且容不下你”的张力，不在本节内加以调和。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“但”承接前文对神住在幽暗中的陈述；“殿宇”明确圣殿语境。“宏伟”传达罕见词 זְבֻל 的崇高、高耸或尊贵色彩，同时避免生硬直译。
