base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: zh_hans
  text: 你为你仆人——我父大卫——信守了你向他所说的话[a]；你亲口说了，也亲手成就了[b]，正如今日所见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你向他所应许的”。希伯来文直译为“你向他所说的话”；其应许的含义由下文所说的成就显明。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“用你的口……用你的手”，以此对照上帝所说的话与他使之实现的行动。
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: 守住了
  rationale: 在应许及其实现的语境中，שׁמר表示信实地持守、兑现；“守住了”既保留原词意象，也由下文“成就了”明确其履行之意。
- source_word: לְעַבְדְּךָ
  choice: 为你仆人
  rationale: 介词 ל 与 שׁמר 连用，在此自然表示为某人持守所说的话；“仆人”符合王室祷告语体。
- source_word: דָּוִיד אָבִי
  choice: 我父大卫
  rationale: 这是现代汉语中自然、庄重的表达，也准确呈现所罗门与大卫的关系。
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: 向他所说的话
  rationale: 按希伯来文直译为“所说的话”，不在正文中直接改作“所应许的”；其应许含义可由成就语境推知，并在脚注说明。
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: 你亲口说出
  rationale: “亲口”自然保留 בְּפִיךָ 的具体意象，并与下句“亲手”形成清晰对仗。
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: 也亲手成就了
  rationale: מלא 在此指使所说之事完全实现；“亲手成就”保留“手”的行动意象，同时符合现代汉语。
- source_word: כַּיּוֹם הַזֶּה
  choice: 正如今日所见
  rationale: 该惯用语指当日可见的现实印证；“今日所见”比生硬的“如同今日”更清楚地传达其语用意义。
theological_decisions:
- issue: 上帝的“口”与“手”这一拟人表达
  choice: 以“亲口”与“亲手”保留两项具体意象
  alternative: 意译为“你说了，也实行了”
  rationale: 原文刻意把上帝所说的话与有效行动并列；保留“口—手”的对仗，既呈现修辞力量，也不超出经文本身对上帝的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我父大卫”保持祷告语体；“亲口……亲手……”兼顾希伯来文平行结构与自然汉语。正文保留“所说的话”的语义开放性，不把语境所含的应许意义直接写死。
