  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: zh_hans
  text: 但我选择了耶路撒冷，让我的名在那里；又选择了大卫，使他居于我的子民以色列之上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我选择了”也可译作“我已经选择了”，以强调神所作的选择已经确立，至今有效。
    reason: 时态体貌的翻译选择
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: 我选择了
  rationale: בחר意为“选择、拣选”。现代汉语用“选择了”自然表达既成的选择；希伯来语连续式在此可按过去事件理解。
- source_word: בִּירוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 按现代汉语通行译名处理地名。
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: 使我的名在那里
  rationale: לִהְיוֹת表达目的或结果；保留“我的名在那里”这一圣殿语境中的重要希伯来表达，不将其解释性改写为“我的同在”或“受敬拜之处”。
- source_word: בְּדָוִיד
  choice: 大卫
  rationale: בחר后接ב，表示选择对象；汉语无需译出该介词。
- source_word: לִהְיוֹת עַל
  choice: 使他治理
  rationale: 字面为“使他在……之上”，在指人对百姓的权柄时，汉语直译“在……之上”不自然；“治理”自然传达权柄关系，同时不增添“作王”这一原文未明说的称号。
- source_word: עַמִּי יִשְׂרָאֵל
  choice: 我的子民以色列
  rationale: 保留盟约性的“我的子民”，并将“以色列”作为同位说明。
- source_word: וְ
  choice: 但；也
  rationale: 句首连接词承接上文的否定，与本节肯定陈述构成转折，译作“但”；第二个连接词在两个平行选择之间译作“也”。
theological_decisions:
- issue: “我的名在那里”的圣殿神学含义
  choice: 保留“使我的名在那里”这一表达
  alternative: 使我的同在在那里／使那里成为敬拜我的地方
  rationale: 原文明确说的是神的“名”。保留该措辞可承载神的临在、声誉与盟约归属等丰富含义，而不在正文中将其缩减为单一解释。
- issue: 大卫“在我的子民以色列之上”的角色
  choice: 译作“使他治理我的子民以色列”
  alternative: 使他作王治理我的子民以色列／使他在我的子民以色列之上
  rationale: 上下文涉及王权，但本句没有明说“王”；“治理”既传达עַל所表示的权柄关系，也避免添加称号。
- issue: וָאֶבְחַר的时态体貌
  choice: 正文译作“我选择了”
  alternative: 我已经选择了／我拣选了
  rationale: 希伯来语wayyiqtol在叙述与宣告中可表达简单过去。汉语“选择了”自然且不否认该选择持续有效；脚注说明也可译为强调既成结果的“已经选择了”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“子民”保留盟约语感；“治理”避免生硬直译“在……之上”，也不额外加入“作王”。脚注标记置于整节末尾，说明本节两次“选择了”的共同体貌问题。
