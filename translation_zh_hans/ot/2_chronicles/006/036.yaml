  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: zh_hans
  text: 他们若得罪你——因为没有不犯罪的人——你向他们发怒，把他们交在仇敌手中，掳走他们的人把他们掳到远近之地，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: 他们若得罪你
  rationale: 开头的כִּי引出祷告中的条件情形；中文以“若”自然承接后文尚未结束的条件句，也不削弱紧接着对普遍犯罪事实的肯定。חטא加ל表示对某人犯罪，译作“得罪你”。
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: 没有不犯罪的人
  rationale: אָדָם在此泛指人类中的任何人；“人”既保留其人类指称，也符合现代汉语的自然表达。双重否定结构保留原文箴言式力度。
- source_word: וְאָנַפְתָּ בָם
  choice: 你向他们发怒
  rationale: אנף表示发怒；“向他们发怒”准确表达怒气所针对的对象，又不过分强化为暴怒。
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: 把他们交在仇敌手中
  rationale: נתן加לפני אויב表示将人交给仇敌支配；中文惯用“交在……手中”清楚传达这一含义。单数אוֹיֵב在此可作集合或非特指用法，“仇敌”无需强加数量。
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: 掳掠他们的人把他们掳到
  rationale: 保留שׁבה动词与同根施事者之间的重复，以再现原文“掳他们的掳掠者”式强调，同时调整为可读的现代汉语。
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: 到远方或近处的地方
  rationale: 保留“远或近”的对举；“地方”对应אֶרֶץ在此作为被掳目的地的宽泛地域含义，避免现代汉语中“远国或近国”可能造成的过度限定。
theological_decisions:
- issue: אָדָם在普遍犯罪陈述中的泛指意义
  choice: 没有不犯罪的人
  alternative: 世人没有不犯罪的
  rationale: 原文单数אָדָם泛指任何人，并断言犯罪的普遍性。“人”在现代汉语中自然涵盖全人类，不必加入性别含义，也不将这句话扩展成原文没有明说的系统性表述。
- issue: 开头כִּי的条件与事实语气
  choice: 他们若得罪你
  alternative: 他们得罪你的时候
  rationale: 本节是所罗门祷告中的条件句，中文“若”保留条件结构；括号内“因为没有不犯罪的人”同时明确犯罪并非纯粹假设，从而保留原文的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“发怒”“仇敌”“掳”保留经文语域，但句法力求普通读者易懂。本节句末为逗号，因为希伯来文及上下文的条件句在下一节继续。
