  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: zh_hans
  text: “自从我把我的子民从埃及地领出来的那一天起[a]，我没有从以色列任何一个支派中选择一座城，好建造一座房屋[b]，使我的名在那里；也没有选择一名男子作我子民以色列的领袖[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“从我把我的子民从埃及地领出来的那一天开始，我就没有……”。希伯来语完成式可按过去发生的行动翻译；正文用“自从……起”表达其效力延续至所说之时。
    reason: 时态与体貌说明
  - marker: b
    text: 这里的“房屋”指圣殿；希伯来原文用的是“房屋”，而不是更具解释性的“圣殿”一词。
    reason: 词义说明
  - marker: c
    text: “领袖”也可译作“统治者”或“首领”。
    reason: 词义备选
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: 自从……的那一天起
  rationale: 明确标示后面否定行动的时间起点；“自从……起”也自然传达从过去延续至当下的效力。
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: 我把我的子民从埃及地领出来
  rationale: 使役式表达“使……出来”；“领出来”在出埃及语境中自然，并保留“我的子民”和“埃及地”。
- source_word: לֹא בָחַרְתִּי בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 我没有在以色列任何支派中选择一座城
  rationale: בחר所带的ב标示被选择的对象；否定句中的“任何支派”清楚表达מִכֹּל的分配含义。
- source_word: לִבְנוֹת בַּיִת
  choice: 建造一座房屋
  rationale: בַּיִת本义为“房屋”；虽在此指圣殿，正文保留原词，避免把解释直接代入经文。
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: 使我的名在那里
  rationale: 紧贴“让我的名在那里”的原文表达，不增添原文没有使用的“居住”或“临在”等动词。
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: 也没有选择一个人
  rationale: 保留אִישׁ的男性单数表达，并以“也没有”承接前一平行否定句。
- source_word: נָגִיד עַל עַמִּי יִשְׂרָאֵל
  choice: 作我子民以色列的领袖
  rationale: נָגִיד指受立而掌权者；“领袖”现代、清楚，同时不把该词限定为“王子”或直接解释为“君王”。
theological_decisions:
- issue: 圣所称谓与上帝之名的表达
  choice: 采用“房屋”和“使我的名在那里”
  alternative: 采用“圣殿”和“使我的名住在那里”
  rationale: 原文使用普通名词בַּיִת和系词היה。保留其措辞，可避免预先界定上帝的名与圣所之间的关系，也保存经文自身的“名”神学张力。
- issue: אִישׁ的性别表达
  choice: 一个人
  alternative: 任何人
  rationale: “一个人”在现代汉语中自然，并保留原文所指的一位男性统治者；“任何人”会淡化其单数历史指向。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“子民”“支派”保留经文的盟约与以色列历史语域；句式维持原文两组“没有选择”的平行结构。
