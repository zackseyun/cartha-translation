  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: zh_hans
  text: “此外，若有不属你子民以色列的外族人，因你的伟大的名、你大能的手和你伸出的膀臂，从遥远之地而来；他们前来，向这殿祷告[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文先以单数说“外族人……来”，随后转用复数说“他们前来……祷告”，可能是从一个有代表性的个案转而泛指这类人。
    reason: alternative_reading
  - marker: b
    text: “向着这殿”也可较直译为“到这殿”；在这段祷告的语境中，此介词表达朝向这殿祷告。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: 外族人
  rationale: 该词指不属于以色列这一族群的人。“外族人”在现代汉语中自然，也保留了经文所强调的族群和圣约身份之别；相比之下，“陌生人”容易被理解为素不相识的人。
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: 不属于你子民以色列的
  rationale: 清楚表达此人不在以色列民之内，同时保留以色列是上帝“子民”的圣约性称谓。
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: 从遥远之地而来
  rationale: 忠实传达来源地遥远；“遥远之地”比“远方国家”更贴近 אֶרֶץ 的宽泛语义。
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: 是因听闻你的大名
  rationale: לְמַעַן 在这里说明来访的缘由。“大名”保留圣经惯用表达；补出“听闻”使汉语自然，并符合上下文中上帝声名吸引远方人前来的含义，但不把“名”简化为只有声誉。
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: 你大能的手
  rationale: 保留具体的拟人性意象，并以现代汉语表达上帝有力的作为。
- source_word: וּזְרֹעֲךָ הַנְּטוּיָה
  choice: 你伸出的膀臂
  rationale: 保留出埃及传统中表现上帝施展能力的具体图像；“膀臂”庄重而易懂。
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: 他们来到这里，……祷告
  rationale: 保留希伯来文由单数代表性个案转为复数动词的变化；“来到这里”中的“这里”依上下文指圣殿所在之处。
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: 向着这殿
  rationale: אֶל 在祷告语境中具有朝向之意。“殿”在汉语中自然地指上帝的殿，同时不致使读者误以为只是在普通房屋前祷告。
theological_decisions:
- issue: “外族人”之后由单数转为复数
  choice: 前半句以单数类别“外族人”陈述，后半句照原文转为“他们”
  alternative: 全句统一为单数“他”；或全句统一为复数“外族人”
  rationale: 原文先用单数描述一个有代表性的外族人，随后改用复数动词。正文保留这一真实的数变化，并用脚注说明，避免静默抹平原文现象。
- issue: 描述上帝能力的拟人性语言
  choice: 保留“你大能的手和你伸出的膀臂”
  alternative: 概括为“你的大能”
  rationale: 原文的具体形象承载出埃及和圣约传统的神学色彩，不宜抽象化。
- issue: אֶל הַבַּיִת הַזֶּה 的方向含义
  choice: 向着这殿
  alternative: 到这殿
  rationale: 在所罗门的献殿祷告中，此处重点是祷告所朝的方向，不必解释为外族人已经进入殿内；脚注保留介词较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“外族人”明确其不属于以色列民；“大能的手”和“伸出的膀臂”保留原文的圣经意象。句末用逗号，因为第32节的条件结构在下一节继续。
