base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: zh_hans
  text: 基拿拿的儿子西底家为自己造了铁角，说：“雅威如此说：‘你要用这些角冲撞[b]亚兰[a]，直到他们灭尽。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”也可译作“亚兰人”；若采用较晚的地理名称，则可译作“叙利亚”。
    reason: lexical_alternative
  - marker: b
    text: “冲撞”也可译作“抵撞”或“顶击”；希伯来文动词指有角动物用角冲顶的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: 为自己造了
  rationale: לוֹ在此自然带有反身含义；西底家制作铁角，并以此施行预言性的象征动作。
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: 基拿拿的儿子西底家
  rationale: 采用现代中文圣经中通行的人名音译，并自然保留希伯来文父子称谓结构。
- source_word: קַרְנֵי בַרְזֶל
  choice: 两只铁角
  rationale: “铁角”准确保留象征性的角与力量、攻击相关的具体意象；“角”为双数形态，故明确译作“两只”。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信的固定宣告格式，并将神名作为专名呈现。
- source_word: בְּאֵלֶּה
  choice: 用这些角
  rationale: 介词表达工具意义；补出“角”可使中文指代清楚，而不增加新的解释。
- source_word: תְּנַגַּח
  choice: 抵撞
  rationale: 该动词指有角动物以角顶撞、冲击；“抵撞”保留铁角象征动作的具体图像。
- source_word: אֶת אֲרָם
  choice: 亚兰
  rationale: 直接保留古代国家或族群的历史名称，不以后来的地理名称“叙利亚”取代。
- source_word: עַד כַּלּוֹתָם
  choice: 直到他们灭尽
  rationale: 保留原文“直到他们终结/灭尽”的结果表达，不额外明说执行毁灭者是谁。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术重构读音音译，明确将其作为神的专名，而不是用“主”这一称号替代。
- issue: 西底家的宣告是否代表真实神谕
  choice: 按原文保留“雅威如此说”的直接引语，不加评断
  alternative: 加注这是虚假预言
  rationale: 本节只记录西底家的宣称；其真伪由上下文揭示，不宜在本句中预先加入解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“两只铁角”保留象征动作的具体形象；内外两层引语使用中文全角标点。脚注标记紧随所说明的词语。
