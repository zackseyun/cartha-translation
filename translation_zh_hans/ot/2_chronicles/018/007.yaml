revisions:
- from: 以色列王对约沙法说：“还有一个人，我们可以托他求问雅威；可是我恨他，因为他从不预言关于我的好事，终日只说坏事。他就是音拉的儿子米该雅。”约沙法说：“王不要这样说。”
  to: 以色列王对约沙法说：“还有一个人，我们可以借着他求问雅威；可是我恨他，因为他从不预言我会有好事，总是预言凶事。他就是音拉的儿子米该雅。”约沙法说：“王不要这样说。”
  rationale: 修订仅改善汉语自然度，并恢复后半句明确的“预言”语义；未把“凶事”具体化为灾祸、虚假预言或任何神学判断。人名、神名、人物关系及原文的委婉语气均予保留。
