  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: zh_hans
  text: 以色列王对约沙法说：“还有一个人，我们可以借着他求问雅威；可是我恨他，因为他从不预言我会有好事，总是预言凶事。他就是音拉的儿子米该雅。”约沙法说：“王不要这样说。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: 还有一个人
  rationale: 表达尚有一人可供求问的剩余意义，同时符合现代汉语自然表达。
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: 我们可以托他求问雅威
  rationale: “托他”体现 מֵאֹתוֹ 所表达的先知中介角色；“求问”准确传达先知语境中 דרשׁ 的含义。
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: 可是我恨他
  rationale: 完成式在此表示持续、既定的态度，汉语用现在时“我恨他”最自然；“可是”明确上下文的转折。
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: 因为他从不预言关于我的好事
  rationale: 否定词与分词共同表达惯常行为，“从不”保留这种特征性、反复性的语气；“关于我”对应 עָלַי。
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: 终日只说坏事
  rationale: “终日”保留 כָל־יָמָיו 的持续意味；“预言”由前句承接，汉语以“说”避免生硬重复。“只”体现好事与坏事之间的对比，但不把“坏事”解释为预言本身虚假。
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: 音拉的儿子米该雅
  rationale: 保留父子关系，并采用现代中文圣经语境中可辨识的人名音译。
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: 王不要这样说
  rationale: 准确传达 אַל 加未完成式的禁止语气，也保留约沙法以第三人称称王的尊重而委婉的劝止。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，以区别于“主”等称号，并保留原文所用的专名。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名；“雅威”是现代汉语中对 Yahweh 的常见音译，避免以称号取代专名。
- issue: “坏事”所指为何
  choice: 保留为“关于王的不利之事”这一语境含义，不改写成“虚假预言”或“灾祸判语”
  alternative: 总是预言灾祸
  rationale: לְרָעָה 与前面的 לְטוֹבָה 对举，表示王眼中的不利信息；原文并未在本句判断预言真假，因此不作神学性补充。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“托他求问”清楚呈现经由先知求问神的关系；对话保持简洁，并保留约沙法对王委婉而尊重的第三人称劝止。
