    rationale: 原文两个分句都以先知的预言内容为焦点；“说坏事”可泛指日常言语，“终日”也可能被理解为每日整天。改作“他从不预言我会有好事，总是预言凶事”保留对王而言的吉凶对照和惯常性，同时更符合现代汉语。
  - severity: low
