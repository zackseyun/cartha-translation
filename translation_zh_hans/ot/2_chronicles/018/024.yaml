  yaml_path: translation/ot/2_chronicles/018/024.yaml
  text: Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide yourself.”
translation:
  language: zh_hans
  text: 米该雅说：“看吧，在那一天，当你进入内室[a]躲藏时，你必会看见。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“房间在房间里”或“内室进内室”；可指进入内室，也可能表示从一间房到另一间房躲藏。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: 米该雅
  rationale: 按现代中文圣经人名的通行音译处理该人名。
- source_word: הִנְּךָ
  choice: 看吧
  rationale: 这是引人注意的指示语，并加强预言的确定性；“看吧”既保留其语气，也比古雅的表达更适合现代读者。
- source_word: רֹאֶה
  choice: 你就会看见了
  rationale: 该词形式上是分词，但在 הִנְּךָ 之后具有预告将来经历的作用；保留“看见”的基本意义，不擅自解释为“明白”或“知道”。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 自然表达希伯来语的时间短语，并符合预言语境。
- source_word: אֲשֶׁר תָּבוֹא
  choice: 你进入……时
  rationale: 关系词与动词在此引出预言应验的情境；“进入”准确表现进入房间的动作。
- source_word: חֶדֶר בְּחֶדֶר
  choice: 最里面的房间
  rationale: 原文重复“房间”并以介词连接，可指房中之房，即深处的内室；正文采用自然中文，另以脚注保留“逐间躲藏”的可能理解。
- source_word: לְהֵחָבֵא
  choice: 躲藏
  rationale: 该词是不定式，表达进入内室的目的；中文无需另加反身代词便能自然传达其含义。
theological_decisions:
- issue: “看见”所指的结果
  choice: 保留“你就会看见了”
  alternative: 译作“你就会知道了”或明确说明所见为何
  rationale: 原文没有明说看见的具体内容；保留其省略和预言性的张力，避免替作者补足解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看吧”传达 הִנְּךָ 的提示和确定语气；句末“了”使未明说宾语的“看见”在中文中较为自然，同时不消除原文的含蓄。
