base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: zh_hans
  text: 以色列王对约沙法说：“我不是告诉过你吗？他不会预言有关我的好事，只会预言灾祸。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不会预言关于我的好事，只会预言祸患。”
    reason: “有关我／关于我”均可表达עָלַי的所指关系；“灾祸／祸患”均可表达此处לְרָע所指的不利预告。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 就……说
  rationale: 承接前文并推进叙事；“就”符合现代汉语叙事习惯。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 直接保留希伯来语称谓，简洁自然。
- source_word: אֶל יְהוֹשָׁפָט
  choice: 对约沙法说
  rationale: אֶל标明说话对象；原文没有在约沙法名前加“王”，译文也不增添。
- source_word: הֲלֹא אָמַרְתִּי אֵלֶיךָ
  choice: 我不是告诉过你吗
  rationale: 保留预期肯定回答的反问语气，并以“告诉过”自然表达先前说过的话。
- source_word: לֹא יִתְנַבֵּא
  choice: 他不会说预言
  rationale: 未完成式在回顾先前判断的语境中表示其一贯或预期的表现；“不会”在现代汉语中自然。
- source_word: עָלַי
  choice: 给我
  rationale: 与后面的“好处／祸患”结合，表达预言所关乎的对象；脚注补出更形式对应的“关于我”。
- source_word: טוֹב
  choice: 好处
  rationale: טוֹב在此作名词性用法，指对亚哈有利的预言；“好处”比孤立的“好”更自然。
- source_word: כִּי אִם
  choice: 只会
  rationale: 表达强烈的排除和对比，即不是前者，唯有后者。
- source_word: לְרָע
  choice: 有祸患
  rationale: 此处רָע指不利、灾祸性的结果，而非抽象的道德邪恶；“祸患”贴合预言语境。
theological_decisions:
- issue: 预言内容中“好”与“恶”的性质
  choice: 正文译作“给我好处……有祸患”
  alternative: “关于我说好话……只说坏话”或“关于我预言好事……只预言灾祸”
  rationale: 亚哈抱怨的是米该雅总预告对自己不利的结果，并非在论述道德意义上的善恶。译文保留利益与灾祸的对立，又避免把רָע误解为道德邪恶。
- issue: 亚哈对米该雅行为的概括
  choice: 译作“不会说预言”
  alternative: “不说预言”或“将不说预言”
  rationale: 希伯来语未完成式可表示一贯倾向或从先前言语角度看的预期；“不会”保留这两方面，不把它限定为单次未来行为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我不是告诉过你吗”保留亚哈带有不满的反问语气；正文避免生硬的“预言善恶”，脚注提供较形式对应的表达。
