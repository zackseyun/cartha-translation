base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: zh_hans
  text: 约沙法极其富有，享有极大的尊荣，并与亚哈结为姻亲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借婚姻与亚哈结盟。”
    reason: 说明该动词既可侧重因婚姻成为亲属，也可在王室语境中表达婚姻联盟。
lexical_decisions:
- source_word: וַיְהִי
  choice: 拥有
  rationale: 此处 היה 配合所属结构 לִיהוֹשָׁפָט，表达约沙法具有某物；现代汉语用“拥有”自然明晰。句首的 וַ־承接叙事，不另加原文没有的“那时”或“后来”。
- source_word: לִיהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: עֹשֶׁר
  choice: 财富
  rationale: 该词指物质上的富足；“财富”准确、自然，并适合王室语境。
- source_word: וְכָבוֹד
  choice: 和尊荣
  rationale: 在此王室及社会地位的语境中，כָּבוֹד 主要表示声望、地位和所受的敬重；“尊荣”比“荣耀”更能避免误解为可见的神圣荣光。
- source_word: לָרֹב
  choice: 极多的
  rationale: 该短语表示数量或程度丰盛，修饰前面的“财富和尊荣”；“极多的”保留其强调语气。
- source_word: וַיִּתְחַתֵּן
  choice: 结为姻亲
  rationale: חתן 的 Hitpael 形式在这里表示借婚姻建立亲属关系，而非明确说约沙法本人结婚。“结为姻亲”自然地保留了具体婚姻安排未明的空间。
- source_word: לְאַחְאָב
  choice: 与亚哈
  rationale: 介词 לְ 在这一关系表达中指关系所涉及的另一方；现代汉语用“与”最自然。
theological_decisions:
- issue: וַיִּתְחַתֵּן לְאַחְאָב 所指婚姻关系的性质
  choice: 与亚哈结为姻亲
  alternative: 借婚姻与亚哈结盟
  rationale: 原文表明双方因婚姻而建立亲属关系，但没有在本节说明约沙法本人结婚，也未明说具体是哪位家族成员成婚。正文避免过度具体化；脚注提供带有政治联盟意味的另一种表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拥有极多的财富和尊荣”传达原文的丰盛程度；“结为姻亲”不暗示约沙法本人迎娶亚哈家族成员，并保留原文对具体家族安排的含蓄。脚注标记置于其实际说明的婚姻关系短语之后。
