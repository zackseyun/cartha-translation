base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: zh_hans
  text: 可是，有一个人随意开弓[a]，射中了以色列王的甲片和胸甲之间[b]。王就对驾车的人说：“调转车头[c]，把我带出军中，因为我受伤了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有特定目标地”。原文也可含“无心、单纯”的意思；这里不是说他没有射箭的意图，而是说他并未特意瞄准以色列王。
    reason: lexical_alternative
  - marker: b
    text: 这两个护甲名称的确切所指不能完全确定。也可理解为“铠甲接缝和胸甲之间”；意思是箭射进了护甲的缝隙。
    reason: cultural_note
  - marker: c
    text: 原文直译为“转过你的手”，可能指驾车者转动双手，操纵战车掉头离开战斗。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: 可是，有一个人
  rationale: וְ承接叙事并形成情节转折；אִישׁ是不定指，未说明射箭者身份。
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: 开弓
  rationale: 这是拉弓射箭的习惯表达；“开弓”在现代汉语中简洁自然。
- source_word: לְתֻמּוֹ
  choice: 随意
  rationale: 该词可表示纯朴、无心或非特定意图；在战场语境中，重点是没有瞄准这个特定对象，而不是射箭者具有道德上的无辜。
- source_word: וַיַּךְ
  choice: 射中了
  rationale: נכה表示击中、打击；结合弓箭语境译作“射中了”，而受伤的结果留到后句表达。
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: 甲片和胸甲之间
  rationale: דְּבָקִים可能指相连或贴合的甲片，שִׁרְיָן指护身铠甲；此译保留两件护甲部位之间存在缝隙的画面，同时以脚注说明术语的不确定性。
- source_word: לָרַכָּב
  choice: 对驾车的人
  rationale: 此处指驾驶战车者；“驾车的人”比音译或古奥称谓更易懂。
- source_word: הֲפֹךְ יָדֶיךָ
  choice: 调转车头
  rationale: 原文直译为“转过你的手”，在语境中是命驾车者操纵战车掉头；正文传达动作含义，脚注保留希伯来语意象。
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: 把我带出战阵
  rationale: מַחֲנֶה可指营地、军队或列阵作战的部队；此时双方正在交战，“战阵”比静态的“营地”更符合现场语境。
- source_word: כִּי הָחֳלֵיתִי
  choice: 因为我受伤了
  rationale: 该动词本可表示患病或变得虚弱，但紧接中箭事件，在这里自然指受伤；原文没有必须在正文中明确表达的程度副词。
theological_decisions:
- issue: 无意射出的箭与叙事中的预言应验
  choice: 仅译出射箭者没有特定目标，不在正文增添神意或偶然性的解释
  alternative: 译成“碰巧”或明确说这是神的安排
  rationale: לְתֻמּוֹ描述射箭者的方式或意图；经文本节没有用明说的神学措辞解释事件，因此保留叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“战阵”保留古代战争背景但并不生僻；引语简洁直接。脚注用于保存 לְתֻמּוֹ 与古代护甲术语的真实歧义。
