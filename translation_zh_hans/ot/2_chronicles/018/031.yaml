source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: zh_hans
  text: 当战车部队的将领一看见约沙法，就说：“他是以色列王！”于是他们转而向他，要与他交战。约沙法呼喊起来，雅威帮助了他；神使他们转而离开他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们转而离开他”也可译作“把他们从他身边引开”。这里的希伯来语动词可指使人改变方向、离开原来的目标。
    reason: 该使役动词在此处可表达“使转开、调离、引开”等相近意思；原文未说明具体方式。
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: 事情是这样：……看见……
  rationale: 这是希伯来叙事中常见的承接结构。译文保留其叙事推进作用，同时避免逐字译成生硬的“事情发生了，当……的时候”。
- source_word: שָׂרֵי הָרֶכֶב
  choice: 战车部队的将领
  rationale: שָׂרֵי 指军事首领或长官，הָרֶכֶב 在此指战车兵力；“战车部队的将领”既清楚又符合现代汉语。
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: 他就是以色列王
  rationale: 希伯来语无系词名词句认定约沙法就是他们要找的以色列王；“他就是……”自然表达辨认与断定的语气。
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: 他们转向他
  rationale: סבב 可指转向或环绕；上下文明确表现敌军改以约沙法为目标，但不足以确定已经完成包围，因此采用较不限定的“转向他”。
- source_word: לְהִלָּחֵם
  choice: 要与他交战
  rationale: 不定式表示行动目的；“与他交战”准确传达军事语境，也比“攻打”更贴近较宽泛的 לחם。
- source_word: וַיִּזְעַק
  choice: 呼喊起来
  rationale: זעק 表示人在危急中大声呼喊。原文未明说呼喊的对象或内容，因此不增译“向雅威”或“求救”。
- source_word: וַיהוָה עֲזָרוֹ
  choice: 雅威就帮助他
  rationale: עזר 直接表示帮助；雅威作为专名音译，以区别本节后半的通称“神”。
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: 神使他们转离了他
  rationale: 此处 סות 的使役式表示使人改变方向、离开目标。“使他们转离了他”保留神的主动作为，也避免赋予该动词在此处并不必要的“诱惑”道德含义。
theological_decisions:
- issue: 同一节中 יְהוָה 与 אֱלֹהִים 的译法
  choice: 雅威……神
  alternative: 耶和华……神；主……神
  rationale: 原文先用神的专名 יְהוָה，后用通称 אֱלֹהִים。分别译作“雅威”和“神”，保留原文有意或至少实际存在的用词差异，不将两者统一化。
- issue: 约沙法呼喊的对象是否明说
  choice: 约沙法呼喊起来
  alternative: 约沙法向雅威呼求；约沙法呼救
  rationale: 虽然上下文随即说明雅威帮助他，但本节的呼喊动词没有明示对象或内容，因此译文不把呼喊明确解释为祷告或求救。
- issue: 神使敌军离开的行动如何表达
  choice: 神使他们转离了他
  alternative: 神把他们从他身边引开；神使他们不再追击他
  rationale: 译文保留神的直接能动作用，但不增添原文没有明确陈述的行动方式或心理原因。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“事情是这样”承担希伯来语叙事承接功能；“战车部队的将领”和“与他交战”保持军事场景清晰。句末用分号连接雅威的帮助与神使敌军转离的具体行动，既保持紧凑，也不武断断定后者是否穷尽前者的全部含义。
