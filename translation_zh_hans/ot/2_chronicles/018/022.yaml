source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: zh_hans
  text: 现在，看哪，耶和华已经把谎言的灵放在你这些先知的口中；耶和华已经宣告要降祸于你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: 现在，看哪
  rationale: 保留时间推进和引人注意的语气；“看哪”庄重且能表达 הִנֵּה 的强调作用。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，对应原文神名。
- source_word: רוּחַ שֶׁקֶר
  choice: 谎言的灵
  rationale: 形式上贴近原文属格结构，并保留它可指说谎之灵或使人说谎之灵的张力。
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: 在你这些先知的口中
  rationale: 保留“口中”的希伯来语表达及“你的这些先知”所带的指向和距离感。
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: 宣告要降祸于你
  rationale: דבר על 在此表示针对某人所说的判语；רעה 在语境中是临到人的灾祸，而非抽象道德邪恶。
theological_decisions:
- issue: 耶和华与谎言之灵的关系
  choice: 译作“耶和华已经把谎言的灵放在……口中”
  alternative: 弱化为“耶和华容许谎言的灵进入……”
  rationale: 原文使用 נָתַן（放置、给予），直接陈述耶和华的主权行动；不以解释性措辞减弱经文本身的神学张力。
- issue: 末句是言说还是既成灾祸
  choice: 译作“已经宣告要降祸于你”
  alternative: “已经使灾祸临到你”
  rationale: 保留 דִּבֶּר 的“说、宣告”含义，同时用“要降祸”自然表达该话语针对亚哈的灾难性判决。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“现在，看哪”保留先知宣告的现场感；句末用分号连接因果紧密的两项陈述。
