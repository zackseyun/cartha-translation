base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: zh_hans
  text: 以色列王说：“把米该雅带走，送回城中长官[a]亚们和王的儿子[b]约阿施那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城防官”。希伯来语称谓既可指行政长官，也可指军事统领。
    reason: lexical_alternative
  - marker: b
    text: 或译“王子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语无需机械译出连接词，也能自然表达事件顺序。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 忠实保留原文的称号，不以其姓名“亚哈”代替。
- source_word: קְחוּ
  choice: 把……带走
  rationale: לקח在此是复数命令式，基本义为“带走、带去”；不采用语气更强的“抓住”。
- source_word: מִיכָיְהוּ
  choice: 米该雅
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַהֲשִׁיבֻהוּ
  choice: 送回
  rationale: שוב的使役形表示使某人返回；“送回”在现代汉语中简洁自然，并保留返回之意。
- source_word: אָמֹון
  choice: 亚们
  rationale: 采用该希伯来人名的常用中文音译。
- source_word: שַׂר הָעִיר
  choice: 城中长官
  rationale: שַׂר可指行政长官或军事统领；正文采用较宽泛的“长官”，避免无根据地限定其职务性质，并以脚注保留另一可能。
- source_word: וְאֶל יוֹאָשׁ
  choice: 和……约阿施那里
  rationale: 保留第二个并列对象；汉语以“和”连接，并在末尾统一使用方位词“那里”。
- source_word: בֶּן הַמֶּלֶךְ
  choice: 王的儿子
  rationale: 按原文保留亲属关系的表达，不直接解释为身份称号“王子”。
