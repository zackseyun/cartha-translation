base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: zh_hans
  text: 耶和华说：“谁去引诱[a]以色列王亚哈，使他上到基列的拉末，倒在那里呢？”一个这样说，另一个那样说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “引诱”也可译作“劝诱”或“欺骗”。
    reason: 保留 יְפַתֶּה 在此处可能具有的劝诱、诱导和欺骗等语义幅度。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名的通行专名译法，保留其作为名字的功能，而不以“主”这一称号替代。
- source_word: יְפַתֶּה
  choice: 引诱
  rationale: 该词的 Piel 形式可表示引诱、劝诱或欺骗；此处指促使亚哈采取最终使他败亡的行动。“引诱”既保留诱导之意，也不在正文中把词义过早限定为明确的欺骗。
- source_word: אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王亚哈
  rationale: 按自然现代汉语调整同位称号的语序，同时完整保留亚哈的王室身份。
- source_word: וְיַעַל וְיִפֹּל
  choice: 使他上到……倒在那里
  rationale: 前后未完成式在问题中表达所要达成的结果；“上到”保留地理及军事语感，“倒在那里”保留 נפל 的“倒下”意象，并由战事语境暗示败亡。
- source_word: בְּרָמוֹת גִּלְעָד
  choice: 在基列的拉末
  rationale: 使用该地名常见的中文形式，并以“基列的拉末”清楚表达复合地名。
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: 这个这样说，那个那样说
  rationale: 贴近希伯来文平行、重复的表达，同时在现代汉语中自然呈现众说纷纭的场景。
theological_decisions:
- issue: 上帝参与亚哈的败亡
  choice: 保留耶和华直接发问“谁去引诱……”，不削弱其主动发起议议的表述。
  alternative: 译成“谁去影响”或“谁容许他受引诱”，以减轻上帝的主动作用。
  rationale: 希伯来文直接描写耶和华发起天上议事；译文应保留这种神学张力，而不借释义将其缓和。
- issue: פתה 在本段中的道德色彩
  choice: 正文译为“引诱”，脚注列出“劝诱”与“欺骗”。
  alternative: 正文直接译为“欺骗”或较中性的“劝说”。
  rationale: 上下文确实涉及借误导性信息使亚哈走向败亡，但该动词本身有一定语义幅度；“引诱”较能兼顾诱导和负面色彩，又不排除其他理解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“倒在那里”保留战场上倒下、败亡的希伯来意象；末句保留原文简洁的平行结构。
