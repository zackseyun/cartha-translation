review_pass:
  verdict: revise
  source_fidelity: 译文准确传达王对米该雅不耐烦的责问、“使你起誓”以及只说真话的限制。惟“我要”可被理解为单纯将来意愿，较弱地呈现原文“还要／得要……多少次”的反复责问；“才肯”也略将重点移向对方是否愿意。改为“还要……才会”更贴近原文的修辞问法，同时不把此前次数叙述化。
  naturalness: “王对他说”及“奉雅威的名，只对我说真话”庄重自然。“我还要叫你起誓多少次，你才会……”是现代汉语中自然的责问句式，比“我要……你才肯”更顺畅且语义更稳妥。
  terminology: “雅威”一致呈现 יהוה 这一专名；“奉……的名”适合本句郑重的起誓／先知宣告语境。“起誓”对应使役形“使人起誓”，术语恰当。
  issues:
  - severity: low
    issue: “我要叫你起誓多少次”弱化了原文的反复责问。
    rationale: עַד־כַּמֶּה פְעָמִים 搭配使役动词表达“还要／得要……多少次”的不耐烦追问；“我要”在汉语中较易读成未来打算。
  - severity: low
    issue: “才肯”稍带对方主观不愿的附加色彩。
    rationale: 原文的未完成式可在此表达王所要求的结果，但并未明确评价米该雅是否‘肯’；“才会”保留责问的结果导向而少添心理判断。
  revised_text: 王对他说：“我还要叫你起誓多少次，你才会奉雅威的名，只对我说真话呢？”
