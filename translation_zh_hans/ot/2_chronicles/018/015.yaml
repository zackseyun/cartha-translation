  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: zh_hans
  text: 王对他说：“我还要叫你起誓多少次，你才会奉雅威的名，只对我说真话呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו הַמֶּלֶךְ
  choice: 王对他说
  rationale: 按希伯来语叙事顺序直译主语、对象和言说动作；中文上下文中无需另加“于是”，也不补出王的名字。
- source_word: עַד כַּמֶּה פְעָמִים
  choice: 多少次
  rationale: 这是带有不耐和责问语气的惯用问句；结合后面的“才肯”，自然传达“究竟还要多少次”的语用力量。
- source_word: אֲנִי מַשְׁבִּיעֶךָ
  choice: 我要叫你起誓
  rationale: שׁבע 的使役形表示使人发誓或郑重要求人起誓；“叫你起誓”既保留使役意义，也适合现代汉语。
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: 你才肯……只对我说真话
  rationale: 否定词与限制词 רַק 合起来表达“除真话以外什么也不说”。中文以“只……说真话”自然呈现这一排他意义；“才肯”传达反复责令所带出的不耐语气。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉雅威的名
  rationale: 介词短语表示凭借或在雅威之名的权威下说话；“奉……的名”是自然、庄重的中文表达。“雅威”音译原文中的神名 יהוה。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，而不是“主”的称号。正文用“雅威”保留专名性质，并避免把原文无声母的形式改作“耶和华”；“上主”虽为传统替代称呼，却会将专名转成称号。
- issue: 王是否已经多次叫米该雅起誓
  choice: 保留“多少次”的责问形式，不据此断言此前实际起誓的次数
  alternative: 译成明确表示已经屡次起誓的陈述
  rationale: 原文问句可表达强烈不耐，叙事却没有明确记载此前多次起誓。译文保留其修辞张力，不替叙述补足事实。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“只对我说真话”清楚自然；“奉雅威的名”保留先知宣言及起誓语境的郑重感。
