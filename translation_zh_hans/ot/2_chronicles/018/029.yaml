base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: zh_hans
  text: 以色列王对约沙法说：“我要乔装[a]上阵，你却穿上你的衣袍。”于是以色列王乔装，他们就上阵去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我要乔装”：原文形式也可译作“你乔装”；但本句下半和随后叙事表明，乔装的是以色列王。
    reason: 说明希伯来文动词形式与上下文所指之间的歧义。
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: 我要改装
  rationale: 该形式简短，形态上可读作第二人称命令式，但在此也可按省略式表达理解为以色列王自述。紧接着的叙事明确说以色列王改装，因此正文采用第一人称，以符合语境，同时用脚注保留原文的形式歧义。
- source_word: וָבֹא
  choice: 上阵
  rationale: בוא与בַמִּלְחָמָה连用，表示进入战事；现代汉语“上阵”简洁自然，并保留行动方向。
- source_word: בַמִּלְחָמָה
  choice: 上阵／上阵去了
  rationale: 与בוא合译为“上阵”，比直译“进入战争中”更符合现代汉语叙事习惯。
- source_word: וְאַתָּה
  choice: 你却
  rationale: 独立人称代词在语境中形成鲜明对比：以色列王改装，约沙法则仍穿自己的衣袍。
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: 穿上你的衣袍
  rationale: 保留第二人称所属成分“你的”，并以“衣袍”表达王者所穿的外衣；不直接增译为“王服”，以免超过原文字面。
- source_word: וַיִּתְחַפֵּשׂ
  choice: 改装
  rationale: 指改变外表以免被认出；“改装”比“乔装打扮”更凝练庄重。
- source_word: וַיָּבֹאוּ
  choice: 他们就上阵去了
  rationale: 复数动词指两位王共同进入战场；“去了”自然表达叙事中的移动。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 采用现代中文圣经叙事中自然、简洁的王号表达。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用该人名通行的简体中文译名。
theological_decisions:
- issue: 首个הִתְחַפֵּשׂ的主语与语气
  choice: 正文译作第一人称“我要改装”
  alternative: 第二人称命令“你改装”
  rationale: 辅音及元音形式可按第二人称命令式理解，但这会与随后“你却穿上你的衣袍”形成明显冲突；本句后半和紧接的叙事都表明改装者是以色列王。正文按上下文呈现最可能的意思，脚注则保留形式上的另一读法，不把原文张力静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“改装”避免过度口语化，“上阵”自然整合“进入战事”的意思；保留“你的衣袍”，不擅自明确为“王服”。
