base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: zh_hans
  text: 所有先知都这样预言说：“你上基列的拉末去吧，必能得胜；耶和华必把它交在王手中。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华必把它交在王手中”或译“耶和华已经把它交在王手中”。希伯来文用完成式陈述这件事；在此预言语境中，这可指确定的将来，也可把将来的结果说成已经确定的事实。
    reason: 保留וְנָתַן在预言语境中可作确定将来或预言性完成式理解的体貌张力。
lexical_decisions:
- source_word: וְכָל הַנְּבִאִים
  choice: 众先知也都
  rationale: 保留连接词、全称量词和复数主语；“也”承接上文同样发言的西底家，符合汉语叙事表达。
- source_word: נִבְּאִים כֵּן
  choice: 这样说预言
  rationale: 分词表示当时持续或同时进行的动作；“这样”保留כֵּן所指的说话方式，即众人所说一致。
- source_word: עֲלֵה רָמֹת גִּלְעָד
  choice: 你上基列的拉末去吧
  rationale: 保留עלה“上去”的基本意象，同时用“吧”体现命令语气；地名按现代中文圣经惯例译作“基列的拉末”。
- source_word: וְהַצְלַח
  choice: 必能得胜
  rationale: 该动词本义为成功、顺利；在军事语境中，“得胜”比泛指的“成功”更明确。与前一命令连用时，这里表达鼓动并保证战事顺利。
- source_word: וְנָתַן יְהוָה
  choice: 耶和华必把
  rationale: וְנָתַן在这段预言性保证中可表达确定的将来结果；“必”传达其确信语气。神名יְהוָה采用中文通行音译“耶和华”。
- source_word: בְּיַד הַמֶּלֶךְ
  choice: 交在王手中
  rationale: 保留“在……手中”的希伯来语意象，同时自然表达落入王的掌控。
- source_word: implied object of וְנָתַן
  choice: 那城
  rationale: 希伯来文未明说宾语，但语境指基列的拉末；汉语通常需要补出宾语，以“那城”清楚回指而不重复地名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文读者最熟悉且庄重的专名形式，保留其作为以色列之神专名的性质，而不以“主”这一称号替代。
- issue: וְנָתַן的时态与预言确定性
  choice: 耶和华必把那城交在王手中
  alternative: 耶和华已经把那城交在王手中
  rationale: 此处完成式在命令之后可把未来结果说成确定之事。正文用确定将来式，更符合自然汉语；脚注保留将其理解为“预言性完成式”的可能，避免消除原文的体貌张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“说预言”避免“预言”兼作名词和动词时可能产生的短暂歧义；引语则保持战场劝进的直接语气。
