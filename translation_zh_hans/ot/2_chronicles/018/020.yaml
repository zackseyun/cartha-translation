base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: zh_hans
  text: 随后有一个灵走上前来，站在雅威面前，说：“我要引诱[a]他。”雅威问他：“用什么办法？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欺骗”或“劝诱”。希伯来语这个动词可按上下文表示引诱、劝诱或欺骗。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: 那灵
  rationale: רוּחַ可指风、气息或灵；本段中它走上前、站立并说话，显然具有位格，因此译为“那灵”。定冠词结合上下文用“那”自然承接天上议会的场景。
- source_word: וַיֵּצֵא
  choice: 走上前来
  rationale: יצא本义为出去或出来；在议会场景中，这位灵从众者中出来陈述提议，译作“走上前来”既自然，也保留其主动现身的动态。
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: 站在……面前
  rationale: 直译这一表示侍立、呈见的固定表达，保留正式觐见的场景。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现上帝的专名，而不以头衔替代。
- source_word: אֲפַתֶּנּוּ
  choice: 我要引诱他
  rationale: פתה的加强词干在此可表达引诱、劝诱或欺骗。“引诱”保留使亚哈走向某行动的含义，又不提前明说下一节才揭示的具体手段；“要”自然表达说话者的意愿和提议。
- source_word: בַּמָּה
  choice: 用什么办法
  rationale: 介词与疑问词的组合询问所采用的方式或手段；“用什么办法”是清楚自然的现代汉语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 采用较贴近学界通常重构读音的“雅威”，将其作为专名呈现，不以“主”等称号替换。
- issue: 天上议会语境中פתה的道德与神学张力
  choice: 引诱
  alternative: 欺骗；劝诱
  rationale: 本节只记述那灵提出要促使亚哈采取行动，下一节才说明借虚假预言实施。“引诱”既容纳负面意味，也不在本节中提前限定为“欺骗”，从而保留原文的语义幅度与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“走上前来”呈现天上议会中主动出列的动作；对话简洁直接。引号内的脚注标记紧随存在语义分歧的“引诱”之后。
