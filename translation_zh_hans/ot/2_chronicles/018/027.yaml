base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: zh_hans
  text: 米该雅说：“你若果真平安回来，耶和华就没有借着我说话。”随后他说：“万民哪[a]，都要听！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万民”原文为复数，表明这是面向广泛众民的呼召，并非仅指在场的众人。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: 米该雅
  rationale: 采用现代中文圣经中通行且易辨认的人名音译。
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: 你若真能……回来
  rationale: 不定式绝对形与未完成式同根连用，加强条件语气；“若真能”自然表达其强调意味，又保留条件性。
- source_word: בְּשָׁלוֹם
  choice: 平安
  rationale: 这里指安然无恙地返回；“平安回来”既贴近希伯来表达，也符合自然中文。
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: 耶和华就没有藉着我说话
  rationale: 介词 בְּ 在此具有媒介或工具意味；“藉着我”清楚表达先知作为传话媒介，同时没有扩充原意。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的神圣四字名专名译法，而不以称号“主”替代。
- source_word: שִׁמְעוּ
  choice: 你们都要听
  rationale: 复数命令式是庄严的先知性呼召；中文用“要听”表达命令与郑重语气。
- source_word: עַמִּים כֻּלָּם
  choice: 万民哪
  rationale: 保留 עַמִּים 的复数、广泛所指；“万民哪”是自然而庄重的中文呼语，כֻּלָּם 的“全体”含义由“万”及后接“你们都”共同体现。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。中文采用广为人知的专名“耶和华”，既保留其专名性质，也便于普通读者识别；不借此处理其古代发音争议。
- issue: 末句 וַיֹּאמֶר 的说话者
  choice: 仍由米该雅说话
  alternative: 把说话者视为叙述者或另一个未明人物
  rationale: 希伯来文只说“他又说”，最近的明确先行词是米该雅，因此正文自然延续其为说话者；不额外加入原文没有的人名。
- issue: 末句呼语的范围
  choice: 万民
  alternative: 在场的众人
  rationale: עַמִּים 是复数“众民／列民”，具有广泛的先知性呼召意味；不将其收窄为当时现场的人群。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与先知性语体。“你若真能平安回来”保留原文强调条件；末句以“万民哪”呈现宽广而肃穆的呼召。正文唯一脚注标记[a]与脚注相对应。
