  text: וַ/תַּ֤עַל הַ/מִּלְחָמָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וּ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הָיָ֨ה מַעֲמִ֧יד בַּ/מֶּרְכָּבָ֛ה נֹ֥כַח אֲרָ֖ם עַד הָ/עָ֑רֶב וַ/יָּ֕מָת לְ/עֵ֖ת בּ֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: zh_hans
  text: 那天，战事越发激烈。以色列王一直站在战车上，面对亚兰人，直到傍晚；日落时，他就死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: 战事越发激烈
  rationale: עלה字面为“上升”，以“战事”为主语时表示战斗升级、加剧；此译自然地保留这一惯用意义。
- source_word: בַּיּוֹם הַהוּא
  choice: 那天
  rationale: 准确表达标准时间短语，在现代汉语中简洁自然。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 按希伯来语属格结构直译，符合中文圣经叙事的庄重表达。
- source_word: הָיָה מַעֲמִיד
  choice: 一直站
  rationale: היה加分词表示持续状态；使役词形可能含“使自己保持站立或被扶持站立”的意味，但正文不额外补入原文未明说的扶持者。
- source_word: בַּמֶּרְכָּבָה
  choice: 在战车上
  rationale: 中文习惯说人站“在战车上”，比“在战车里”自然，同时不添加“他的”。
- source_word: נֹכַח אֲרָם
  choice: 面对亚兰人
  rationale: נֹכַח表示面对、在对面；此处亚兰指敌方军队，译作“亚兰人”比抽象地“面对亚兰”更符合现代汉语。
- source_word: עַד הָעָרֶב
  choice: 直到傍晚
  rationale: 直接保留时间界限，表达自然。
- source_word: וַיָּמָת
  choice: 他就死了
  rationale: 叙事连接词推进事件；“就”自然承接前句并保持直接语气。
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: 日落时
  rationale: 该短语字面指太阳落下的时候；“日落时”简洁、准确，并未损失实质意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“战事越发激烈”传达希伯来语惯用表达；“一直站”保留持续性，并避免擅自断定王是自行支撑还是由人扶持。
