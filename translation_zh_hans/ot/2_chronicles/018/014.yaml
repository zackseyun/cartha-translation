base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: zh_hans
  text: 于是，他来到王面前。王问他：“米该雅，我们该去攻打基列的拉末，还是我该作罢？”他回答：“你们上去，取得胜利吧！他们必被交在你们手中。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 从上下文看，米该雅这句话很可能带有反讽或讥讽意味；希伯来文本本身并未明确标出这种语气。
    reason: 保留原文未明说的语用含义及其解释空间。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是，他来到
  rationale: 该叙事性连续式推进情节；“于是”自然表达事件的先后承接。
- source_word: מִיכָה
  choice: 米该雅
  rationale: 采用现代中文圣经中对本叙事人物常见的音译，并与先知弥迦相区别。
- source_word: הֲנֵלֵךְ
  choice: 我们该去……吗
  rationale: 保留第一人称复数的商议性问句语气。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 按地名构造译出，表达位于基列地区的拉末。
- source_word: לַמִּלְחָמָה
  choice: 攻打
  rationale: 在军事语境中自然表达“去……作战”的目的，同时避免生硬直译。
- source_word: אִם אֶחְדָּל
  choice: 还是我该作罢
  rationale: חדל表示停止、克制或不采取行动；保留原文由“我们”转为“我”的人称变化。
- source_word: עֲלוּ וְהַצְלִיחוּ
  choice: 你们上去，取得胜利吧
  rationale: 保留两个复数命令式的表层肯定语气；“上去”保存עלה的方向性，“取得胜利”切合军事语境中的צלח。
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: 他们必被交在你们手中
  rationale: 保留נתן的复数被动形式以及“交在手中”这一表示落入权势之下的希伯来语意象；不擅自补明复数主语。
theological_decisions:
- issue: 米该雅的回答是否应在正文中明确译为讽刺
  choice: 正文保留字面上的肯定回答，以脚注提示其可能的反讽语气
  alternative: 在正文中加入“讽刺地说”等解释性措辞
  rationale: 上下文强烈暗示米该雅并非真诚赞同，但希伯来文本本身没有显式标出反讽；保留表层措辞可避免在正文中消除叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作罢”简洁保留王个人是否停止行动的商议语气；米该雅的答话维持正式的先知叙事语域，不在正文中明说反讽。
