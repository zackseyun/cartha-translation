base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: zh_hans
  text: 他说：“我要出去，在他所有先知的口中作谎言的灵[a]。”耶和华说：“你必诱骗他，也必成功[b]。你出去这样做吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“虚谎的灵”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你也必能做到”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: 我要出去
  rationale: 第一人称未完成式在此表达说话者的意愿和打算；“出去”保留了יצא的方向含义，并与后面的命令“你出去”形成呼应。
- source_word: וְהָיִיתִי לְרוּחַ שֶׁקֶר
  choice: 作谎言的灵
  rationale: היה加ל可表示成为或充任某种角色；“作”在现代汉语中自然地表达承担这一角色。“谎言的灵”保留名词结构及其可理解为“使人说谎的灵”的张力。
- source_word: בְּפִי כָּל נְבִיאָיו
  choice: 在他所有先知口中
  rationale: 较直接地保留希伯来文“在……口中”的言语意象；“他”在上下文中指亚哈。
- source_word: תְּפַתֶּה
  choice: 你必能诱骗他
  rationale: פתה的加强词干在此带有引诱并欺骗的意味；补出上下文隐含的宾语“他”，并以“必能”与后面的成功结果顺畅衔接。
- source_word: וְגַם תּוּכָל
  choice: 也必成功
  rationale: יכל在此不只是具备能力，也表示计划能够奏效；“成功”比“胜过”更符合受命执行计策的语境，同时保留וגם的“也”。
- source_word: צֵא וַעֲשֵׂה כֵן
  choice: 你出去这样做吧
  rationale: 保留יצא与前文的词语呼应；“这样做吧”自然表达עשה כן的命令语气。
theological_decisions:
- issue: 异象中耶和华许可并差遣一个施行欺骗的灵
  choice: 按叙事直译耶和华对该计策的认可和命令，不弱化“诱骗”或“谎言”的措辞。
  alternative: 用较弱的“劝动”或“误导”来淡化神与欺骗行动之间的关联。
  rationale: 希伯来文本明确呈现该灵提出欺骗计划，并得到耶和华许可且受命执行。译文应保留这一神学张力，不借释义替文本加以调和。
- issue: 第二个וַיֹּאמֶר的说话者
  choice: 在正文中明确为“耶和华说”。
  alternative: 沿用形式对应的“他说”。
  rationale: 上文异象清楚表明回应者是耶和华；中文若连续使用“他说”容易产生指代歧义。明确主语是上下文所支持的必要显化，并未改变叙事内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“口中”保留原文意象；“作谎言的灵”避免过度解释其本体或角色。“吧”在末句表达命令兼许可的自然汉语语气，并不将命令弱化为建议。
