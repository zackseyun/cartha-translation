revisions:
- from: 亚兰王曾吩咐统领他战车部队的将领说：“无论大小，你们都不可与他们交战，只可单独攻击以色列王。”
  to: 亚兰王曾吩咐统领他战车部队的将领说：“不可与任何人交战，无论尊卑大小；只可与以色列王一人交战。”
  rationale: 修订将“小的与大的”的希伯来语两极成语自然呈现为“任何人，无论尊卑大小”，并把“唯独他”的排他焦点明确落在“以色列王一人”上。保留“曾”所表达的叙事先行背景，以及“交战”这一不额外强化方向性的军事用语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:46Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达亚兰王先前向其战车部队将领所下的命令，以及命令的排他性。原译“单独攻击以色列王”在汉语中容易理解为以色列王单独发动攻击，未能清楚表达 לְבַדּוֹ 是“唯独以色列王一人”为目标。
  naturalness: “统领他战车部队的将领”自然清楚。“无论大小，你们都不可与他们交战”虽可理解，但“他们”的先行对象不够直接；将原文的“小与大”这一涵盖一切人的成语明确为“任何人，无论尊卑大小”，更符合现代汉语。
  terminology: “亚兰”“以色列王”“战车部队”“将领”均恰当，语体庄重且现代。保留“交战”而非改作“攻击”，可避免无必要地增强动词的方向性。
  issues:
  - severity: medium
    issue: “只可单独攻击以色列王”中“单独”修饰关系含混。
    rationale: לְבַדּוֹ强调以色列王是唯一可交战的对象，而非描述攻击者或攻击方式。应译为“只可与以色列王一人交战”或同义表达。
  - severity: low
    issue: “他们”在“无论大小”之后指代不够明晰。
    rationale: 原文以“小的与大的”构成涵盖任何人的两极表达；汉语可明说“任何人，无论尊卑大小”，使范围和指代清楚。
  revised_text: 亚兰王曾吩咐统领他战车部队的将领说：“不可与任何人交战，无论尊卑大小；只可与以色列王一人交战。”
  revised_footnotes: []
