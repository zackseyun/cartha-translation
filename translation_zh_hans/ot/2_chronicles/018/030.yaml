base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: zh_hans
  text: 亚兰王曾吩咐统领他战车部队的将领说：“不可与任何人交战，无论尊卑大小；只可与以色列王一人交战。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: וְ承接上下文；现代汉语叙事无需机械译作“而/于是”。אֲרָם按传统地名译作“亚兰”。
- source_word: צִוָּה
  choice: 曾吩咐
  rationale: 动词意为“命令、吩咐”。“曾”自然表明这项命令先于随后发生的战斗，又不把希伯来语时态体系等同于汉语时制。
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: 统领他战车部队的将领
  rationale: שָׂרֵי指军事首领；הָרֶכֶב在此可指战车兵力或战车部队；אֲשֶׁר לוֹ表达属于或受其统辖。此译法在现代汉语中清楚自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 按希伯来语叙事中引出直接引语的常用结构处理。
- source_word: לֹא תִּלָּחֲמוּ
  choice: 你们都不可与他们交战
  rationale: 该形式在直接命令中表达禁止。“他们”补明“大小”所指的人，使汉语通顺，未改变对象范围。
- source_word: אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: 无论大小
  rationale: 保留“卑小者与尊大者”的两极表达；汉语“无论大小”自然表达不论身份高低、任何人都包括在内。
- source_word: כִּי אִם
  choice: 只可
  rationale: 该结构表达排除其他对象后的唯一例外；在禁止命令之后译作“只可”简洁明确。
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל
  choice: 攻击以色列王
  rationale: 此宾语承接“交战”；汉语若重复“与……交战”较笨重，用“攻击”明确其为唯一作战目标，而不增加神学解释。
- source_word: לְבַדּוֹ
  choice: 单独
  rationale: 保留“唯独他/他一人”的强调，与“只可”共同表达以色列王是唯一目标。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“无论大小”保留原文的身份两极成语，同时以“他们”明确其指人；“只可单独攻击”保留 כִּי אִם 与 לְבַדּוֹ 的双重排他强调。
