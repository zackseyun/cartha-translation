base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: zh_hans
  text: 约沙法对以色列王说：“请你今日求问耶和华的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以普通话自然的叙事句式承接上文；不机械译出连接词，以免汉语显得拖沓。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: 对以色列王
  rationale: 准确表达说话对象，并保留正式王号。
- source_word: דְּרָשׁ נָא
  choice: 请先求问
  rationale: “求问”符合向上帝寻求启示的语境；“请”体现 נָא 缓和命令的语气。“先”结合 כַיּוֹם 在语境中的即时要求，使现代汉语自然。
- source_word: כַיּוֹם
  choice: 今天
  rationale: 按副词性用法处理，表达就在当日求问，而非泛指目前。
- source_word: אֶת דְּבַר יְהוָה
  choice: 耶和华今天有何话要说
  rationale: 将“求问耶和华的话”自然展开为现代汉语，表示寻求从耶和华而来的启示，同时避免误解为查问一段既有言论。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中最通行、最易识别的神名音译，保留其专名性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用广为人知的专名“耶和华”，而不以“主”这一称号替代，从而保留原文的专名性质。
- issue: דְּבַר יְהוָה 的定指与来源关系
  choice: 耶和华有何话要说
  alternative: 耶和华的话
  rationale: 希伯来语可形式化地译为“耶和华的话”，但在求问神谕的语境中，所寻求的是耶和华将赐下的信息。正文作自然展开，不增添具体神谕内容，也不把它限定为已有的一句话。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“求问”保留先知性咨询的宗教语域；整体句式简洁，适合普通读者朗读和理解。
