  text: וַ/יַּ֧עַל מֶֽלֶךְ יִשְׂרָאֵ֛ל וִֽ/יהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֶל רָמֹ֥ת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: zh_hans
  text: 于是，以色列王和犹大王约沙法上到基列的拉末。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上到
  rationale: עלה的基本义是“上去、登上”。此处表示前往某地；“上到”既保留希伯来语的方向意味，也不额外加入“进军”等原文未明说的军事色彩。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 这是常见的王室称号结构；“以色列王”在现代汉语中简洁、自然，并指向上下文中已知的那位王。
- source_word: וִיהוֹשָׁפָט
  choice: 和……约沙法
  rationale: 连接词作并列用；人名按通行的现代中文圣经音译作“约沙法”。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 原文是置于约沙法之后的同位称号。中文为避免“约沙法犹大王”的生硬语序，将称号自然地前置为“犹大王约沙法”。
- source_word: אֶל
  choice: 到
  rationale: 该介词在这里标示移动的目的地；与“上”组合成“上到”，准确表达前往并抵达该地。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 复合地名按现代中文圣经的通行表达处理为“基列的拉末”，清楚表明这是基列地区的拉末。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接前文叙事；调整同位称号的词序以符合汉语习惯，同时保留原文两位君王并列前往的结构。
