base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: zh_hans
  text: 基拿拿的儿子西底家走上前来，在米该雅的脸颊上打了一下，说：“耶和华的灵从我这里离开，走哪条路去向你说话呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 走上前来
  rationale: 既表达靠近的动作，也自然呈现当面对质的场景。
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: 基拿拿的儿子西底家
  rationale: 按现代汉语叙事习惯先说明父子关系，再写人物姓名；专名采用通行圣经译名。
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: 打了米该雅一个耳光
  rationale: נכה是广义的“击打”，而עַל־הַלֶּחִי指脸颊或下颌部位；此处译作“打了……一个耳光”自然地传达当众掌掴与羞辱的动作。
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: 走哪条路
  rationale: 保留“道路、路径”的空间意象，而不是将反讽意味直接释为抽象的“怎样”。
- source_word: עָבַר
  choice: 离开，走……去
  rationale: 表达灵从一人那里经过或转往另一人的移动意象；汉语补出“离开”使מֵאִתִּי所标明的起点清楚。
- source_word: רוּחַ יְהוָה
  choice: 耶和华的灵
  rationale: 先知语境中指上帝的灵；使用“灵”而非“风”或“气”，并保留神名。
- source_word: מֵאִתִּי
  choice: 从我这里离开
  rationale: 清楚标示西底家所声称的移动起点，也保留其讥讽：耶和华的灵仿佛原先在他身上说话。
- source_word: לְדַבֵּר אֹתָךְ
  choice: 去对你说话
  rationale: 按上下文译为向米该雅说话；“对你说话”是自然、明确的现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用现代中文圣经读者最熟悉的专名“耶和华”，而不以“主”替代，从而保留其作为专有神名的功能。
- issue: 西底家问话的语气与灵的移动意象
  choice: 保留字面的路径问句，不明说这是讥讽
  alternative: 意译为“耶和华的灵怎么会离开我，转而对你说话呢？”
  rationale: 原句本身可被理解为讥讽或挑战，但正文不替读者明定语气；保留“走哪条路”的具体意象，也保留西底家对米该雅先知权威的质疑。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“走上前来”呈现冲突动作，“打了……一个耳光”比生硬的“击打脸颊”更符合汉语叙事；问句保留原文刻意具体的路径意象及其中的反讽张力。
