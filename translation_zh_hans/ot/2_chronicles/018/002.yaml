base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: zh_hans
  text: 过了几年，他下到撒玛利亚去见亚哈。亚哈为他和同他一起的人宰了许多牛羊，并怂恿他上去攻打基列的拉末。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“上到基列的拉末去”；这里的上下文表明此行是要攻打该城。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 下到
  rationale: 保留“下去、下行”的方向和地势含义；现代汉语中“下到撒玛利亚”自然且简洁。
- source_word: לְקֵץ שָׁנִים
  choice: 过了几年
  rationale: 这是自然的现代汉语表达，传达若干年过去之意，不对具体年数作无根据的限定。
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: 到撒玛利亚去见亚哈
  rationale: 清楚表达亚哈身在撒玛利亚，以及约沙法前往见他的意思。
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: 亚哈为他……宰了
  rationale: זבח在此处描述为盛宴宰杀牲畜，并未明确指礼仪献祭；“宰了”保留具体动作而不额外加入祭祀含义。
- source_word: צֹאן וּבָקָר
  choice: 牛羊
  rationale: 符合现代汉语常用的牲畜并列表达，同时涵盖原文的小牲畜与牛群。
- source_word: לָרֹב
  choice: 许多
  rationale: 自然传达数量丰盛；置于“牛羊”之前符合汉语语序。
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: 和跟随他的人
  rationale: עָם本义宽泛，不强行限定为军队；“跟随他的人”在此可自然指随行人员。
- source_word: וַיְסִיתֵהוּ
  choice: 怂恿他
  rationale: סות带有挑动、诱使或煽动的力度；“怂恿”比中性的“劝说”更贴近其语义色彩，同时保留行为动机的张力。
- source_word: לַעֲלוֹת אֶל רָמוֹת גִּלְעָד
  choice: 上去攻打基列的拉末
  rationale: 保留עלה“上去”的方向含义，并根据战争语境用“攻打”明确此行的军事目的；地名采用现代中文圣经中易懂的形式。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句首补出“他”的所指仍由上文确定，不在本节擅自加入姓名；“怂恿”保留原词可能含有诱使、煽动的负面力度。
