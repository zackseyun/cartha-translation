base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: zh_hans
  text: 以色列王亚哈对犹大王约沙法说：“你愿意和我一同去基列的拉末吗？”约沙法对他说：“我与你一样，我的人民也与你的人民一样[a]；我也与你一同作战[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为两个省略动词的比较式短语，字面结构为“像我一样，像你一样；像你的人民一样，我的人民”。这里表达双方及双方人民的对等与一致。
    reason: 说明希伯来文无动词的比较结构，并避免把比较表达强化为完全的身份认同。
  - marker: b
    text: 原文为省略式短语，直译为“并且与你在战事中”，没有明说动词；译文按上下文补出“作战”。
    reason: 说明末句的省略结构及为使现代汉语通顺所作的最小补足。
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: 你愿意和我一同去……吗
  rationale: 疑问词 הֲ 与动词 הלך、介词 עִם 构成邀请同行的问句。“愿意……吗”在现代汉语中自然表达征询意愿，同时保留“去”的运动方向。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 按希伯来地名音译，并用“的”清楚表达拉末位于基列这一地名关系；这是中文圣经读者较易辨认的传统形式。
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: 我与你一样
  rationale: 保留原文的比较结构及其所表达的团结、立场一致之意，不将其强化为原文未明说的身份合一。
- source_word: וּכְעַמְּךָ עַמִּי
  choice: 我的人民也与你的人民一样
  rationale: 补出汉语所需的判断表达，并按上下文调整为自然语序；“一样”对应 כְּ 的比较意义。
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: 我会和你一同作战
  rationale: 原文是省略式无动词短语，直译为“在战争中与你同在”。汉语补出主语和动作，使约沙法承诺参战的意思清楚；脚注说明其字面形式。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 说……对他说
  rationale: 保留 אמר 的普通言说意义；第二处补明说话者“约沙法”，避免现代汉语中代词指向不清。
