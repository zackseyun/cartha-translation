source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: zh_hans
  text: 他说：“因此，你们要听雅威的话：我看见雅威坐在他的宝座上，天上的万军[a]都站在他的右边和左边。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的万军”也可译作“天上的众军”或“天军”。
    reason: 原文 צְבָא 可指军队、众军或成列的群体，几种译法分别强调其集合性或军事意象。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 表示承接上文的推论或结果；“因此”既保留逻辑连接，也符合先知宣告的庄重语气。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 原文是复数命令式；明确译出“你们”，保留米该雅向在场众人发出的郑重呼吁。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知宣告的固定表达，并将四字神名作为专名音译，而不以称号替代。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”是现代汉语中对 Yahweh 的音译，能显明这是以色列之神的专名。
- source_word: רָאִיתִי
  choice: 我看见
  rationale: 完成式在这里叙述先知异象中的所见；“我看见”自然、直接。
- source_word: יוֹשֵׁב עַל כִּסְאוֹ
  choice: 坐在他的宝座上
  rationale: 贴近原文的分词结构及王权意象，同时符合现代汉语表达。
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: 天上的万军
  rationale: צָבָא可指军队、众军或成列的群体；“天上的万军”保留其集合性和军事色彩，又适合天上议会的场景。
- source_word: עֹמְדִים
  choice: 都站着
  rationale: 原文分词直接描写姿态；正文结合后面的方位表达译作“都站在”，不额外加入“侍奉”等解释。
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: 在他的右边和左边
  rationale: 直接保留原文左右两侧的空间描写，不赋予两侧不同的地位或功能。
theological_decisions:
- issue: 异象中四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文两次使用神的专名。译作“雅威”保留专名性质，也避免用“主”这一称号代替原文；“耶和华”是传统汉译，但其读音所依据的形式较晚。
- issue: “天上的万军”所指对象的界定
  choice: 保留集合性称谓，不具体解释其成员身份
  alternative: 众天使；天军
  rationale: צְבָא הַשָּׁמַיִם本身可表达天上的军旅或群体；正文不把它收窄为某一种特定灵体，以保留原文的广度和天上议会的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“因此”“雅威的话”等先知宣告语气；方位描写使用日常的“右边和左边”，避免过度古雅。脚注标记紧跟其所说明的“天上的万军”。
