  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: zh_hans
  text: 约沙法却说：“这里不是还有耶和华的先知吗？我们好向他求问。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却说
  rationale: 叙事连接词在此承接并转折于前文众先知的一致意见；“却”自然表达约沙法仍有疑问的语篇关系。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: הַאֵין
  choice: 不是……吗
  rationale: 保留否定疑问句寻求确认的语气，也符合现代汉语表达。
- source_word: פֹּה
  choice: 这里
  rationale: 直接、自然地表达地点副词。
- source_word: נָבִיא לַיהוָה
  choice: 耶和华的先知
  rationale: ל 表示归属或关联；此译既可理解为属于耶和华，也可理解为替耶和华发言，未过度限定。
- source_word: עוֹד
  choice: 还
  rationale: 在上下文中表示除已出现的先知之外仍有一位可供求问；“还”保留其可理解为“仍有”或“另外有”的弹性。
- source_word: וְנִדְרְשָׁה
  choice: 我们可以求问
  rationale: 第一人称复数鼓励式表达共同采取行动；דרשׁ 在此指借先知求问神，“求问”是自然且准确的中文对应。
- source_word: מֵאֹתוֹ
  choice: 他
  rationale: 与“求问”搭配时，现代汉语通常直接说“求问他”；语境表明是从他那里或借着他寻求答复。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且庄重的传统专名“耶和华”，而不是以“主”替代；同时承认“雅威”更接近学界常见的拟定读音。
- issue: 先知与耶和华的关系
  choice: 耶和华的先知
  alternative: 为耶和华说话的先知
  rationale: 保留 לַיהוָה 所含的归属和代表关系，不把它缩减为单一功能解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“却”体现与前文的对比；“不是还有……吗”保留原文否定问句及 עוֹד 的语义弹性。正文无需脚注。
