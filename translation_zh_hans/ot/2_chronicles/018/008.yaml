  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֵ֖ר מיכהו בֶן יִמְלָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: zh_hans
  text: 于是，以色列王叫来一名官员[a]，说：“快把音拉的儿子米该雅带来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个宦官”或“一名宫廷官员”；这个希伯来语词既可指实际的宦官，也可泛指王室官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 叫来
  rationale: 此处动词引出王对侍从的直接命令；“叫来”符合叙事语境，也比单用“叫”更清楚地表达召人前来听命。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 这是表明说话者身份的组合，在现代汉语中译作“以色列王”自然简洁。
- source_word: אֶל סָרִיס אֶחָד
  choice: 一名官员
  rationale: סָרִיס既可指字面意义上的“宦官”，也可泛指王室官员。这里强调的是奉王命办事的职能，而经文本身未明确其生理身份，因此正文采用“一名官员”，并在脚注保留其他可能。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 常见的叙事引语动词，译作“说”准确自然。
- source_word: מַהֵר
  choice: 快把……带来
  rationale: 该命令式表达催促和紧迫感；“快把……带来”在现代汉语中简洁有力。
- source_word: מיכהו
  choice: 米该雅
  rationale: 采用此人物在中文圣经传统中通行且易于辨认的音译。
- source_word: בֶן יִמְלָא
  choice: 音拉的儿子
  rationale: 忠实表达希伯来语父名结构，同时符合现代汉语语序。
theological_decisions: []
