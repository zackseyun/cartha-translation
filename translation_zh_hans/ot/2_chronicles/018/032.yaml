  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּ֥י לֹא הָיָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יָּשֻׁ֖בוּ מֵ/אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: zh_hans
  text: 战车长们看出他不是以色列王，就转身不再追赶他了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从他后面转回去”，意思是停止跟随或追赶他。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: 看出
  rationale: וַיְהִי承接叙事，כִּרְאוֹת以介词כְּ加不定式构成时间关系；汉语无需机械译出“事情发生了，当……时”。结合后文所认出的身份，“看出”比单纯“看见”更准确自然。
- source_word: שָׂרֵי הָרֶכֶב
  choice: 战车长们
  rationale: שָׂרֵי指军事首领，הָרֶכֶב在此指战车部队。“战车长”简洁地表达统领战车部队的军官，并保留原文的军事语境。
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: 他不是以色列王
  rationale: כִּי引出他们看明的事实。希伯来文未明说主语，但随后מֵאַחֲרָיו中的阳性单数代词表明所指是他们正在追赶的那个人，因此汉语补出“他”。
- source_word: וַיָּשֻׁבוּ
  choice: 就转身
  rationale: שׁוּב在此表示转回、停止原先的追逐方向；“转身”自然呈现动作结果，“就”衔接他们认清身份后的即时反应。
- source_word: מֵאַחֲרָיו
  choice: 不再追赶他
  rationale: 字面为“从他后面”，与שׁוּב连用表示不再跟在他后面追逐。“不再追赶他”清楚传达此处习语在战斗场景中的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“战车长”避免冗长官衔，“不再追赶”明确呈现战场语境。脚注标在其所解释的短语之后，而非“以色列王”之后。
