  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: zh_hans
  text: 以色列王召集了先知，共四百人，问他们：“我们该不该到基列的拉末去出战？还是我该罢手？”他们回答：“上去吧！上帝必把它交在王手中[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”是希伯来语惯用语，意思是交在某人的权力或控制之下。
    reason: lexical_alternative
  - marker: b
    text: 原文说“王”，没有明确说“以色列王”，也没有说“你手中”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: 召集了
  rationale: קבץ在此指把一群人聚集起来以供咨询；“召集”符合君王召来先知的语境，也比“收集”自然。
- source_word: הַנְּבִאִים
  choice: 先知
  rationale: נביאים是“先知”的标准称谓；上下文虽随后质疑他们所传的信息，却不宜在本节词汇中预先加入贬义判断。
- source_word: אַרְבַּע מֵאוֹת אִישׁ
  choice: 共四百人
  rationale: 原文明确有“四百”和“人”；“共四百人”在现代汉语中自然，并保留人数信息。
- source_word: הֲנֵלֵךְ
  choice: 我们该不该……去
  rationale: 动词为第一人称复数疑问式；译文保留“我们”，不把它改成君王单独行动。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 地名按现代中文圣经惯用形式音译，并用“的”自然表达其与基列地区的关系。
- source_word: לַמִּלְחָמָה
  choice: 去出战
  rationale: 介词结构表示军事行动的目的；“出战”既明确战争语境，又避免把行动过度具体化为“攻城”或“进攻”。
- source_word: אִם אֶחְדָּל
  choice: 还是我该罢手
  rationale: חדל表示停止、克制或不采取行动；译作“罢手”简洁自然，并保留原文由第一人称复数突然转为第一人称单数的变化。
- source_word: עֲלֵה
  choice: 上去吧
  rationale: עלה的字面和常见行军义是“上去”；译文保留这一表达，不直接释为“进攻”。
- source_word: וְיִתֵּן
  choice: 必把它交在
  rationale: נתן基本义为“给、交付”；原文宾语省略，现代汉语需补“它”，但不进一步限定为城池或战果。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 虽אֱלֹהִים形式上为复数形态，此处所搭配的动词是单数，语境也指单一神明，因此译作“上帝”。
- source_word: בְּיַד הַמֶּלֶךְ
  choice: 交在王手中
  rationale: 这是表示落入某人权力或控制之下的希伯来语惯用语；保留“手中”的意象，同时以脚注说明其含义。
theological_decisions:
- issue: 先知回答中“王”的具体所指
  choice: 保留不加限定的“王”
  alternative: 明确译为“以色列王”或改作“你手中”
  rationale: 希伯来文本只说“王”，没有使用第二人称“你”，也没有在此短语中再次明说“以色列王”。虽然上下文很可能使听者联想到亚哈，译文仍不替原文消除这一措辞上的不明确性。
- issue: 这些人是否应在译文中预先定性为假先知
  choice: 按原文称为“先知”
  alternative: 译为“假先知”
  rationale: 本节使用通常表示“先知”的נביאים，并未在该名词上加“假”或其他限定；他们信息的真实性应由后文叙事揭示，而非由译者预先判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们该不该……还是我该……”刻意保留原文人称由复数转为单数的变化；“上去吧”保留源语的行进意象；“交在王手中”保留希伯来语惯用表达，并用脚注解释。
