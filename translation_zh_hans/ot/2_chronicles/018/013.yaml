  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֛י אֶת אֲשֶׁר יֹאמַ֥ר אֱלֹהַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: zh_hans
  text: 米该雅却说[a]：“我指着永活的雅威起誓：我的上帝说什么，我就说什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威是永活的；我的上帝说什么，我就说什么。”
    reason: 保留 חַי יְהוָה 既可按惯用誓言格式理解、也可按字面陈述表达的可能性。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 却说
  rationale: 前接叙事连词，既推进叙事，也回应上一节使者的劝说；“却说”自然表达此处的反差。
- source_word: מִיכָיְהוּ
  choice: 米该雅
  rationale: 采用现代中文圣经中通行且易辨认的人名音译。
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威起誓
  rationale: 这是希伯来语常见的起誓格式。中文明确补出“起誓”，能自然传达该格式的语用力量；“永活的”表达 חַי 在誓言中的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名作为专名的性质，不用“主”这一称号代替。
- source_word: כִּי אֵת אֲשֶׁר
  choice: 什么
  rationale: כִּי 引出誓言内容，אֵת אֲשֶׁר 标示所说之事；中文“说什么”简洁自然，并保留范围未限定的含义。
- source_word: יֹאמַר
  choice: 说
  rationale: 未完成式在关系结构中指上帝将要或可能说出的内容；现代中文用“说什么”即可涵盖这种未定性。
- source_word: אֱלֹהַי
  choice: 我的上帝
  rationale: 保留第一人称单数词尾所表达的“我的”。
- source_word: אֹתוֹ אֲדַבֵּר
  choice: 我就说什么
  rationale: אֹתוֹ 回指上帝所说的内容；中文以“说什么……就说什么”的对应结构自然表达。דבר 的庄重预言语境由“说”结合誓言句式充分传达。
theological_decisions:
- issue: 誓言中四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”以现代汉语音译保留其专名性质，不以称号“主”替换，也不采用源于另一套传统读音的“耶和华”。
- issue: חַי יְהוָה 是誓言还是独立陈述
  choice: 正文按誓言译为“我指着永活的雅威起誓”
  alternative: “雅威是永活的”
  rationale: 该短语在希伯来叙事中是固定的起誓格式，当前语境也支持庄严保证；但其字面形式可以读作“雅威是永活的”，故以脚注保留。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“说什么，我就说什么”保留原文的强调和先后对应；正文明确表达誓言功能，脚注保留字面句法的另一种呈现。
