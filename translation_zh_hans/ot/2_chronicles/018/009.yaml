base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: zh_hans
  text: 以色列王和犹大王约沙法各自坐在自己的王位上，身着衣服；他们坐在撒马利亚城门入口的打谷场上，所有先知都在他们面前说预言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 句首 וּ 是叙事连接词；中文承接上下文时可不另译“于是”或“现在”，以免加入原文没有的明确时间含义。
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: 和犹大王约沙法
  rationale: 保留连接关系，并按现代汉语习惯将王号置于人名前。
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: 坐在自己的王位上；他们坐在……打谷场上
  rationale: 原文两次使用“坐”，分别交代王位和所在地点；译文保留重复，并用分号使汉语结构清楚。
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: 各自……坐在自己的王位上
  rationale: אִישׁ 在此为分配用法，意为“各自”；王室语境中的 כִּסֵּא 译为“王位”。
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: 穿着礼服
  rationale: 字面为“穿着衣服”，但语境强调两王公开临朝的装束；“礼服”自然表达正式服饰，又不擅自增添“王袍”等更具体含义。
- source_word: בְּגֹרֶן
  choice: 在……打谷场上
  rationale: גֹּרֶן 的通常含义是“打谷场”；中文地点表达用“在……上”自然。
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: 撒马利亚城门入口处
  rationale: 按希伯来语组合关系表达为城门的入口处；“城门”在中文中比单说“门”更明确自然。
- source_word: וְכָל הַנְּבִיאִים
  choice: 所有先知都
  rationale: 保留 כָל 的全称含义；连接词在分句衔接中由中文标点和句法自然体现。
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  choice: 在他们面前说预言
  rationale: מִתְנַבְּאִים 表示进行先知性宣告；“说预言”是现代汉语中清楚自然的表达，לִפְנֵיהֶם 直译为“在他们面前”。
theological_decisions: []
