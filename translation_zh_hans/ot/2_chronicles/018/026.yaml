  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: zh_hans
  text: 你们要说：‘王这样说：把这人关进监牢，给他困苦的饼和困苦的水[a]，直到我平安回来。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困苦的饼和困苦的水”也可译作“患难的饼和患难的水”，指与囚禁和困顿相关、可能很微薄的口粮。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: 并且说
  rationale: 这是阳性复数第二人称的叙事式未完成时，在连续命令中具有祈使作用；译为“并且说”既承接上文，也保留对多人发出的命令。
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: 王这样说
  rationale: 这是标准的传令公式；现代汉语用“王这样说”自然、庄重，也准确表达正式谕令。
- source_word: שִׂימוּ זֶה
  choice: 把这个人关进
  rationale: “这个”指当场的米该雅，语气略显轻蔑；补出“人”使中文明确自然。“关进”与后面的“监牢”搭配，传达置于拘禁之所的动作。
- source_word: בֵּית הַכֶּלֶא
  choice: 监牢
  rationale: 字面为“拘禁之屋”；“监牢”是准确、简洁且符合经文语体的现代汉语表达。
- source_word: וְהַאֲכִלֻהוּ
  choice: 只给他
  rationale: 原文使役式祈使意为“给他吃”。结合后面食物与水的并列，中文用“只给他……饼和……水”自然表达受限的供给；“只”把该习语所含的匮乏处境明示出来。
- source_word: לֶחֶם לַחַץ
  choice: 困苦的饼
  rationale: 保留希伯来语“困苦／压迫之饼”的形象和经文色彩，而不直接将其化约为一种确定的配给制度。
- source_word: וּמַיִם לַחַץ
  choice: 困苦的水
  rationale: 与“困苦的饼”保持原文平行结构；脚注说明这很可能指囚禁困境中的微薄口粮。
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: 直到我平安回来
  rationale: בְשָׁלוֹם 表示安然、平安地从战场归来；此译自然并保留上下文中的反讽意味。
