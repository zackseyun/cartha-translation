base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: zh_hans
  text: 那位去召米该雅的使者对他说：“你看，众先知都异口同声地说对王有利的话[a]。请你所说的话也像他们其中一人的话那样，也说对王有利的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一张口”，是表示完全一致、同声一致的习语。
    reason: 说明希伯来语习语的字面意象与含义。
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: 使者
  rationale: 此人奉命去召米该雅，是人的使者，并非天使。
- source_word: לִקְרֹא
  choice: 召
  rationale: 语境是奉王命叫先知前来；“召”简洁地表达正式传唤。
- source_word: לְמִיכָיְהוּ
  choice: 米该雅
  rationale: 采用现代中文圣经中通行且易辨认的译名。
- source_word: דִּבֶּר אֵלָיו לֵאמֹר
  choice: 对他说
  rationale: 以自然中文表达希伯来叙事引语公式，无须机械重复“说……道”。
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留提示对方注意的语用力量，同时符合现代汉语。
- source_word: דִּבְרֵי הַנְּבִאִים
  choice: 众先知……报……消息
  rationale: 这里的“话”指先知向王所传的信息；结合谓语译为“报……消息”更自然。
- source_word: פֶּה אֶחָד
  choice: 异口同声
  rationale: 这是与“同一张口”意象直接对应的汉语成语，既保留源语形象，也表达完全一致。
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: 向王报好消息
  rationale: טוֹב 在此指对王有利、合王心意的预言；“好消息”保留其正面而可能带有策略迎合的语境含义。
- source_word: וִיהִי נָא
  choice: 请你也
  rationale: “请”体现 נָא 的劝请语气，“也”自然引出与其他先知保持一致的要求。
- source_word: דְבָרְךָ כְּאַחַד מֵהֶם
  choice: 像他们一样说话
  rationale: 表达使者要求米该雅的话与其中任何一人的话相同；中文无需生硬保留“你的话像他们中一个人的话”。
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: 报个好消息吧
  rationale: 重现前句“好”的关键词和劝请语气；“吧”使要求在现代中文中自然。
theological_decisions:
- issue: 使者要求米该雅所说的“好”究竟是客观真理还是对王有利的话
  choice: 译作“报好消息”，不把它解释成真实可靠的预言
  alternative: 说吉利话；说对王有利的话
  rationale: 原文 טוֹב 仅表明内容对王而言是正面的；上下文显出迎合压力，但本节本身没有直接判定这些话的真实性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“异口同声”保留希伯来语“同一张口”的形象；重复“好消息”对应原文两次出现的“好”，也让使者施加的迎合压力清楚可感。
