  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפוֹצִ֣ים עַל הֶֽ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ן רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: zh_hans
  text: 他[a]说：“我看见全以色列人分散在群山上，好像没有牧人的羊群。雅威说：‘这些人没有首领[b]；让他们各自平安回到家中吧。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”指米该雅。
    reason: 为中文读者澄清本节代词所指；人名由上文确定。
  - marker: b
    text: 原文直译为“这些人没有主人们”或“没有主上们”；此处指他们没有统领者。
    reason: 说明אֲדֹנִים的复数形式及其在本处指领导者的语境含义；正文采用自然的中文表达。
lexical_decisions:
- source_word: נְפוֹצִים
  choice: 分散
  rationale: 保留被动分词所描绘的众人溃散、散布各处的景象，同时符合现代汉语表达。
- source_word: עַל הֶהָרִים
  choice: 在群山上
  rationale: 直接表达地点意义；“群山”自然对应复数 הָרִים，并保留地形意象。
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: 好像没有牧人的羊群
  rationale: 保留牧羊比喻及完整关系结构；“羊群”在汉语中比单说“羊”更自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: 这些人没有主人
  rationale: אֲדֹנִים 形态为复数，但此处谓以色列群体失去统领者；中文用单数类称“主人”较自然，复数形式则在脚注注明，以保留原文张力。
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: 让他们各自……回家吧
  rationale: 用“让……吧”表达未完成式在神谕中的祈使/允准语气；“各自”准确传达分配性的 אִישׁ，且“回家”是自然现代汉语。
- source_word: בְּשָׁלוֹם
  choice: 平安
  rationale: 保留 שָׁלוֹם 的常规含义及战败背景下的意味，不缩窄为仅仅“安全”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其专名身份，避免以头衔替代。
- issue: אֲדֹנִים 的数与语义
  choice: 正文译“主人”，脚注说明原文为复数
  alternative: 主人们／众首领
  rationale: 希伯来语形式为复数，必须让读者知悉；但中文“这些人没有主人”能自然表达群体无人统领的意思。“众首领”会加入原文未明说的政治解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“分散在群山上”保留军事溃散与牧羊图景的双重意象；末句用“各自平安回家吧”体现神谕的允准语气。所有脚注标记均已置于正文。
