revisions:
- from: 他[a]说：“我看见以色列众人分散在群山上，好像没有牧人的羊群。雅威说：‘这些人没有主人[b]；让他们各自平安回家吧。’”
  to: 他[a]说：“我看见全以色列人分散在群山上，好像没有牧人的羊群。雅威说：‘这些人没有首领[b]；让他们各自平安回到家中吧。’”
  rationale: 将“主人”改为“首领”，消除现代汉语中“所有者”的歧义，同时以脚注保留原文复数形式及其词汇张力。并将“以色列众人”和“回家”分别调整为更自然且更贴近原文分配含义的表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:49Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确传达了以色列人在山上四散、如无牧人之羊，以及雅威命各人平安归家的图像与语气。惟“主人”在现代汉语中主要指所有者，易将以色列人误解为奴仆，未能自然表达此处因王／统领缺失而无人领导的语境。
  naturalness: 整体庄重自然。“以色列众人”可简化为“全以色列人”；末句改为“各自平安回到家中吧”既自然，也较完整保留“回到自己的家”的分配意义。
  terminology: “雅威”恰当保留四字神名的专名性质。“首领”在正文中自然表达אֲדֹנִים在本处的政治、军事语境；脚注应明确其字面复数形式为“主人们／主上们”，以免掩盖原文的数。
  issues:
  - severity: medium
    issue: “这些人没有主人”在现代汉语中语义易偏向所有权关系。
    rationale: אֲדֹנִים虽可直译为“主人”，但在本节以战败后失去王或领导者的以色列人为对象；正文用“首领”更符合汉语习惯和上下文，复数词形可由脚注保留。
  - severity: low
    issue: “回家”略压缩了“回到自己的家”的表述。
    rationale: “各自平安回到家中吧”更清楚地体现אִישׁ לְבֵיתוֹ的逐一、归家含义，且保持自然。
