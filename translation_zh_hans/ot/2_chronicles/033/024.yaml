  text: 他的臣仆阴谋反对他，在他自己的家中杀了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: 密谋反叛他
  rationale: קשר על是指针对某人结党密谋，王室叙事中常含谋反或刺杀之意。“密谋反叛他”自然地表达其敌对和政治意味。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 在王室语境中，עבד指服侍君王的人，可能包括近臣和官员。“臣仆”既保留从属、服侍的含义，也不武断限定具体官职或奴隶身份。
- source_word: וַיְמִיתֻהוּ
  choice: 将他杀死
  rationale: מות的使役形在此表示使他死亡，即杀死他。“将他杀死”在现代汉语中直接、庄重，也符合刺杀叙事。
- source_word: בְּבֵיתוֹ
  choice: 在他自己的宫中
  rationale: ב表示地点，后缀表示“他的”；鉴于主人公是君王，“宫中”比普通“家中”更符合王室语境，而“自己的”凸显事件发生在其本人居所内。
