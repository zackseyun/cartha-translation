source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֣ל אֵלָ֗י/ו וַ/יֵּעָ֤תֶר ל/וֹ֙ וַ/יִּשְׁמַ֣ע תְּחִנָּת֔/וֹ וַ/יְשִׁיבֵ֥/הוּ יְרוּשָׁלִַ֖ם לְ/מַלְכוּת֑/וֹ וַ/יֵּ֣דַע מְנַשֶּׁ֔ה כִּ֥י יְהוָ֖ה ה֥וּא הָֽ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: zh_hans
  text: 他向上帝祷告；上帝应允了他的恳求[a]，垂听他的哀求，使他回到耶路撒冷，重掌王权[b]。于是，玛拿西认识到，雅威是上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝接受了他的恳求”或“上帝被他的恳求打动”。
    reason: 原词的尼法勒形式既可表示“受人恳求”，也可表示对恳求作出有利回应。
  - marker: b
    text: 希伯来文直译：“使他回到耶路撒冷，归向他的王权（或国位）”。
    reason: 保留לְמַלְכוּתוֹ的字面表达及其可指王权、王位或统治地位的范围。
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: 他向上帝祷告
  rationale: התפלל在此通常指“祷告”。希伯来文直译为“他向他祷告”；汉语连续使用同形代词会使祷告者与受祷告者混淆，因此按上下文明确受词为上帝，而不改变所指。
- source_word: וַיֵּעָתֶר לוֹ
  choice: 上帝应允了他的恳求
  rationale: עתר的尼法勒形可表示“受人恳求”或“对恳求作出有利回应”。“应允了他的恳求”在现代汉语中自然地表达上帝悦纳并回应祈求，同时用脚注保留其被动表达的可能性。
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: 垂听他的哀求
  rationale: תחנה指求怜悯、求恩惠的恳切祈求。“哀求”体现其迫切性；“垂听”符合庄重的祷告语境，也含有听取并回应之意。
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: 使他回到耶路撒冷，重掌王权
  rationale: שוב的使役形表示“使返回、带回”；למלכותו字面为“回到他的王权／国位”。“重掌王权”清楚表达玛拿西不仅返回耶路撒冷，也恢复统治。
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: 这时，玛拿西才知道
  rationale: ידע意为“知道、认识”。“这时……才”自然表达叙事中的结果与认识上的转折，但不额外说明这种认识的性质。
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: 雅威是上帝
  rationale: 直译并保留神名יהוה为“雅威”。הוא带有强调作用，现代汉语以判断句自然传达；不增添原文没有明说的“独一”或“唯有”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界通常重构读音的“雅威”，保留其作为专名的性质。
- issue: כִּי יְהוָה הוּא הָאֱלֹהִים 的排他力度
  choice: 雅威是上帝
  alternative: 唯有雅威是上帝
  rationale: 原句明确确认雅威是上帝，代词הוא具有强调作用；但“唯有”会把排他意义说得比本句字面更明确，因此不在正文中补入。
- issue: 上帝回应祷告的描写
  choice: 应允了他的恳求
  alternative: 被他的恳求打动
  rationale: 尼法勒形式可保留“受恳求、容人求告”的被动色彩，也可表达有利回应。正文采用自然的结果性表达，脚注保留另一语感，避免把经文过度解释为上帝情绪发生变化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为避免多个“他”造成施事者混淆，前两分句按上下文明确写出“上帝”；保留连续动词所形成的紧凑叙事节奏。正文中的脚注标记[a]、[b]均已对应列出。
