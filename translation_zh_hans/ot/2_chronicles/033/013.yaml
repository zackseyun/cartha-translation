revisions:
- from: 他向上帝祷告；上帝应允了他的恳求[a]，垂听他的哀求，使他回到耶路撒冷，重掌王权[b]。这时，玛拿西才知道，雅威是上帝。
  to: 他向上帝祷告；上帝应允了他的恳求[a]，垂听他的哀求，使他回到耶路撒冷，重掌王权[b]。于是，玛拿西认识到，雅威是上帝。
  rationale: 修订仅消除两处不必要的语义偏移，并使脚注更准确地说明原文。“于是，玛拿西认识到”保留叙事结果而不加重“才”的限定。脚注a改用“接受恳求”来表达“受恳求”的核心意义，同时保留“被打动”这一可行但较具情感色彩的译法。脚注b补出原文使役动词；正文“重掌王权”仍是对上下文和לְמַלְכוּתוֹ的自然、忠实表达。
