base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: zh_hans
  text: 他做耶和华眼中看为恶的事，正如他父亲玛拿西所做的。他父亲玛拿西所造的一切雕刻的偶像，亚们都向它们献祭，并侍奉它们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍奉它们”也可译作“敬拜它们”。这里的希伯来语动词本义是“服侍、侍奉”，在此语境中指宗教性的敬奉。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 保留希伯来语“行恶”的评价性惯用表达，同时与后面的“耶和华眼中”自然衔接。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 这是表达神圣评价的希伯来语惯用语；中文如此表达自然，也保留“在……眼中”的意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，明确呈现其为专名，而非以“主”这一称号替代。
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: 正如……所行的
  rationale: 准确表达亚们的行为与其父玛拿西先前行为之间的比较。
- source_word: מְנַשֶּׁה אָבִיו
  choice: 他父亲玛拿西
  rationale: 按自然现代汉语调整同位结构，同时保留亲属关系和人名。
- source_word: הַפְּסִילִים
  choice: 雕像
  rationale: 该词特指雕刻或凿成的宗教形像；“雕像”保留具体制作方式，避免仅用概括性的“偶像”。
- source_word: זִבַּח
  choice: 向它们献祭
  rationale: 在祭祀语境中，该动词指献上祭物；“献祭”准确而简洁。
- source_word: וַיַּעַבְדֵם
  choice: 并且侍奉它们
  rationale: 保留 עבד 的基本义“服侍、事奉”；在雕像与献祭的语境中，其宗教敬拜含义清楚可见。
- source_word: אָמֹון
  choice: 亚们
  rationale: 采用该犹大王姓名在现代简体中文圣经中的通行译名。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。译作“耶和华”符合现代中文读者熟悉的专名形式，也不把专名改成称号。
- issue: 偶像语境中 עבד 的译法
  choice: 侍奉它们
  alternative: 敬拜它们
  rationale: 原词基本义为“服侍、侍奉”；这里的宗教语境使敬拜含义自然成立，无须在正文中缩窄其词义。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。句式适度贴近原文，保留“耶和华眼中”的希伯来意象；为避免代词指向含混，第二句重复“他父亲玛拿西”。脚注标记置于相关分句之后。
