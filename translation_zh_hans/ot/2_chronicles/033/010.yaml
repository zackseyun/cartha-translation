  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מְנַשֶּׁ֥ה וְ/אֶל עַמּ֖/וֹ וְ/לֹ֥א הִקְשִֽׁיבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: zh_hans
  text: 耶和华向玛拿西和他的百姓说话，他们却不听从[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“留心听”或“理会”。这个希伯来语动词指专心聆听，并含有作出回应的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说话
  rationale: דבר 的皮埃勒词干在此表示“说话、讲话”；与 אֶל 连用，译作“对……说话”既贴近原文，也符合现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中对神名四字母词的通行音译“耶和华”，保留其作为专名的性质，而不以称号代替。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用该人名在现代中文圣经中的通行译名。
- source_word: עַמּוֹ
  choice: 他的百姓
  rationale: עַם 加第三人称阳性单数后缀，直指玛拿西的百姓，即其治下的人民；“他的百姓”自然且保留原文关系。
- source_word: וְלֹא
  choice: 却不
  rationale: 原文的连接词加否定在语境中形成明显转折：耶和华向他们说话，他们却没有听从；“却”自然呈现这种对照。
- source_word: הִקְשִׁיבוּ
  choice: 听
  rationale: קשב 的使役词干表示留心听、听从或理会。“听”简洁自然，并借脚注说明这里含有留心并作出回应的意味，以免把语义限缩为单纯听见声音。
theological_decisions:
- issue: “他们却不听”的复数主语所指
  choice: 保留复数代词“他们”，自然指向玛拿西和他的百姓整体
  alternative: 将复数主语理解为只指百姓，而玛拿西仅是另一个受话者
  rationale: 原文先列出两个受话对象“玛拿西和他的百姓”，随后使用第三人称复数动词。最直接的理解是两者都没有听；译文保留“他们”，不作超出句法的进一步限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“对……说话”保留原文较概括的表达，不擅自补出耶和华借先知警告等上下文信息；“他们却不听”简明有力，并由脚注呈现动词所含的留心、回应意味。
