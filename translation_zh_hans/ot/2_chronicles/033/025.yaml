  text: וַ/יַּכּוּ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּֽשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: zh_hans
  text: 但国中的民众[a]杀了所有图谋反对亚们王的人[b]，又立他的儿子约西亚继位为王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “国中的民众”是希伯来语的一种表达，可指全国民众，也可能带有社会政治层面的特定含义。
    reason: cultural_note
  - marker: b
    text: 或译：“所有同谋反对亚们王的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: 杀了
  rationale: נכה在此叙事语境中指致命击杀；对象是谋害亚们的同谋者，因此译作“杀了”自然且明确。
- source_word: עַם הָאָרֶץ
  choice: 国中的民众
  rationale: 保留“该地之民”的基本意象，同时用现代汉语表达其群体含义；具体是否带有社会政治阶层色彩留待脚注说明。
- source_word: כָּל הַקֹּשְׁרִים
  choice: 所有谋害……的人
  rationale: קשר的分词指共同策划阴谋的人；结合עַל הַמֶּלֶךְ אָמוֹן，译为“所有谋害亚们王的人”符合汉语表达。
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: 谋害亚们王
  rationale: קשר与עַל连用表示针对某人结党谋反或策划阴谋；上下文中亚们已被杀，因此“谋害”准确传达其对象与后果。
- source_word: וַיַּמְלִיכוּ
  choice: 立……作王
  rationale: מלך的使役式表示使某人登基、立某人为王；“立……作王”准确而庄重，不额外加入加冕礼仪。
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: 他的儿子约西亚
  rationale: 同位结构表明约西亚是亚们的儿子；按自然汉语调整语序。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该词表示取代某人的位置，在王位继承语境中“接替他”简洁自然。
- source_word: וַ
  choice: 但
  rationale: 虽然叙事中的וַ常作“于是”或“又”，此处与上一节亚们臣仆杀王形成转折，译作“但”能显明语篇对照。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“国中的民众”兼顾源文形式与中文自然度；“立……作王”保持历代志王室叙事的正式语体。脚注标记依其所解释的词语就近安放。
