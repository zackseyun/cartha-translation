  naturalness: 原译整体自然、庄重。“立他的儿子约西亚接替他作王”可以理解，但“立……继位为王”在现代书面汉语中更顺畅，也清楚表达王位继承。
  terminology: “国中的民众”适当地保留了עַם הָאָרֶץ这一可能具有社会政治内涵的表达，脚注说明也恰当。人名“亚们”“约西亚”及王室叙事用语“立……为王”一致、规范。
