  to: 但国中的民众[a]杀了所有图谋反对亚们王的人[b]，又立他的儿子约西亚继位为王。
  rationale: 修订“谋害”为“图谋反对”，以对应原文对阴谋的描述，并避免在本节措辞中将阴谋的性质限定为谋杀；同时将王位继承句式调整为更自然的现代汉语。脚注锚点仍紧邻所释词语，且保留“国中的民众”一语的文化说明。
