- from: 玛拿西其余的事迹、他向他的神所作的祷告，以及先见奉耶和华以色列之神的名对他说的话，看哪，都记在《以色列诸王史录》中[a]。
  to: 玛拿西其余的事迹、他向他的神所作的祷告，以及那些奉耶和华——以色列的神——的名向他说话的先见所说的话，看哪，都记在以色列诸王的史录中[a]。
  rationale: 修订明确了先见的复数及其定语关系，以破折号标明“以色列的神”对“耶和华”的同位说明，并将未经明确命名的史料改作普通名词式。原文的强调语“看哪”、神名、以及“以色列诸王”均予保留。
