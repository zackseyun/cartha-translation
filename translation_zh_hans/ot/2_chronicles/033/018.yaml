    rationale: עַל־דִּבְרֵי מַלְכֵי יִשְׂרָאֵל 指向书面王室史料，但未明确提供现代意义上的固定书名。正文采用普通名词式，脚注保留书名式可能性更稳妥。
  revised_text: 玛拿西其余的事迹、他向他的神所作的祷告，以及那些奉耶和华——以色列的神——的名向他说话的先见所说的话，看哪，都记在以色列诸王的史录中[a]。
