base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: zh_hans
  text: 玛拿西其余的事迹、他向他的神所作的祷告，以及那些奉耶和华——以色列的神——的名向他说话的先见所说的话，看哪，都记在以色列诸王的史录中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都记在《以色列诸王史录》中。”这里的希伯来文引书套语指一种书面的王室史料。
    reason: 说明普通名词式译法与可能的书名式译法，并锚定“史录”这一引书公式。
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: 玛拿西其余的事迹
  rationale: 王室纪事的总结套语；דִּבְרֵי 在此不只指言语，也包括所行的事和相关记载。“其余的事迹”自然保留这一史学语境。
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: 他向他的神所作的祷告
  rationale: 保留两个所有关系，并将 אֶל 明确译为“向”；“所作的”使现代汉语句式顺畅。
- source_word: הַחֹזִים
  choice: 先见
  rationale: 这是特定的先知性称谓，直译为“先见”可避免笼统化为“先知”。
- source_word: הַמְדַבְּרִים אֵלָיו
  choice: 对他说话的
  rationale: 将分词作定语理解，按叙事总结语境用一般过去意义表达。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉耶和华……的名
  rationale: “奉……的名”是自然、庄重的汉语表达，保留代表其权柄发言的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、可辨识的神名音译，不以“主”这一称号取代专名。
- source_word: הִנָּם
  choice: 看哪，都
  rationale: “看哪”保留原文提示读者注意的指示和强调作用；“都”与复数所指相应。
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: 记在《以色列诸王史录》中
  rationale: 该引书套语指向书面王室资料；“史录”比单纯的“话”更准确传达文献性质，“记在”明示原文公式所蕴含的书写概念。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留为专名；“耶和华”是普通现代中文读者最熟悉的标准音译，同时不将其改成称号“主”。
- issue: 所引史料中的“以色列诸王”
  choice: 保留“以色列诸王”
  alternative: 犹大诸王
  rationale: 马所拉文本明确作“以色列”；即使上下文讲的是犹大王玛拿西，也不据预期将原文协调为“犹大”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”略带经文体色彩，但用于保留 הִנָּם 的强调功能；整体避免古奥文言。“先见”作为特定职分名称予以保留。
