  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: zh_hans
  text: 我必不再把以色列人的脚[a]从我为你们祖先所定的土地上挪去，只要他们谨慎遵行我所吩咐他们的一切，照着借摩西传下来的全部律法、律例和典章去行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的脚”，在这里指以色列人在这片土地上的立足和居住。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: 必不再使……离开
  rationale: 保留否定词与“再、继续”之意，并以自然汉语表达使役结构。
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: 以色列人的脚
  rationale: 保留希伯来文具体意象；此处以“脚”指以色列人在土地上的立足与居住，并用脚注说明。
- source_word: מֵעַל הָאֲדָמָה
  choice: 离开……土地
  rationale: מֵעַל含有从某物之上的位置移开的意味；现代汉语用“离开土地”即可自然传达，避免生硬的“从土地之上”。
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
  choice: 我为你们祖先所定的
  rationale: העמיד在此表达使之确立或指定；“所定的”保留神为祖先确定此地的含义。“祖先”比现代汉语中的“列祖”更通俗，同时保留家族历史关系。
- source_word: רַק אִם
  choice: 但……必须
  rationale: 该短语提出排他而真实的条件；“但……必须”在汉语中清楚表达应许以顺服为条件，而不弱化其限制力。
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: 谨慎遵行
  rationale: 兼顾שמר的留心、谨守之意和עשה的实行之意，是现代中文圣经语域中自然清楚的表达。
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: 我吩咐他们的一切
  rationale: 直接保留命令的发出者、领受者和内容的完整性。
- source_word: לְכָל הַתּוֹרָה
  choice: 照着……全部律法
  rationale: 在与“律例、典章”并列的法律语境中，תורה译作“律法”最为清楚；“照着”表达前缀ל在此所示的规范关系。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: 保留其成文规定或法定条例的法律含义，并与相邻法律术语区分。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 传达司法裁定及规范之意，也与“律法、律例”形成自然且庄重的中文法律术语组合。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西之手所传
  rationale: 保留“借……之手”的希伯来语中介表达，同时加“所传”使现代读者清楚这是神借摩西传达的律法。
theological_decisions:
- issue: 以色列继续居住在土地上的条件性
  choice: 明确表达他们留在土地上的应许以谨慎遵行全部诫命为真实条件。
  alternative: 将此理解为不受顺服与否影响的无条件永久保证，或仅视为没有实际条件效力的修辞。
  rationale: רַק אִם清楚引入限制条件。译文保留这项条件及其神学张力，不借本节裁定更广泛的圣约争论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“谨慎遵行”“律法、律例和典章”保留经文的盟约与法律语域；脚注标记紧随各自解释的词语，避免英文咨询层中标记位置可能造成的错配。
