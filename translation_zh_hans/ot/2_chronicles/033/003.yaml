base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: zh_hans
  text: 因为他重新修建了他父亲希西家拆毁的丘坛[a]，又为诸巴力筑起祭坛，造了亚舍拉柱[b]，并向天上的万象下拜，侍奉它们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重新修建”直译为“又回来建造”，意思是恢复先前被拆毁的设施。
    reason: lexical_alternative
  - marker: b
    text: 或译“亚舍拉”；原词通常指与女神亚舍拉有关的祭祀柱或象征物，具体形制不能完全确定。
    reason: lexical_alternative
  - marker: c
    text: “天上的万象”在这里指日月星辰等天体被当作崇拜对象。参列王纪下21:3。
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: 重新修建
  rationale: 两个动词直译为“返回并建造”，在这里表达再次建造、恢复已被拆毁之物；“重新修建”自然传达这一意义。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: 该词指设于高处或与高处崇拜相关的祭祀场所；“丘坛”保留其特定宗教含义，也符合现代中文圣经语体。
- source_word: נִתַּץ
  choice: 拆毁
  rationale: 该动词表示拆除、毁坏建筑或宗教设施；“拆毁”准确而自然。
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: 为诸巴力筑起祭坛
  rationale: “筑起”表达设立、竖立之意；“诸巴力”保留希伯来文复数，不将不同地方性表现或称号简化为单数。
- source_word: אֲשֵׁרוֹת
  choice: 亚舍拉像
  rationale: 复数名词可指与女神亚舍拉有关的祭祀物、木柱或象征物；“亚舍拉像”较易懂，同时不武断限定其具体形制。
- source_word: וַיִּשְׁתַּחוּ
  choice: 下拜
  rationale: 保留俯伏敬拜的身体动作，并与后面的“侍奉”保持词义区别。
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: 天上的万象
  rationale: 在偶像崇拜语境中指天体总体，而非天使军队；“天上的万象”在中文中清楚表达日月星辰等受崇拜对象。
- source_word: וַיַּעֲבֹד אֹתָם
  choice: 侍奉它们
  rationale: עבד在祭祀语境中有敬拜、事奉之意；译作“侍奉”保留它与前一动词“下拜”的词汇区分。
theological_decisions:
- issue: 异教祭祀术语是否概括为“偶像”或“假神”
  choice: 保留“丘坛”“诸巴力”“亚舍拉像”等具体名称
  alternative: 概括译作“偶像”“假神”或“异教祭坛”
  rationale: 原文逐项列举具体崇拜形式；保留名称可呈现历史宗教细节，避免以神学概括取代原文。
- issue: “天上的万象”所指为何
  choice: 理解为受崇拜的天体
  alternative: 理解为天使等属天灵体
  rationale: 本节与巴力、亚舍拉及祭坛并列，语境指向星辰崇拜；中文译法明确指向天体，同时忠实于原文集合性表达。
- issue: “下拜”与“侍奉”的关系
  choice: 分别翻译两个动词
  alternative: 合并概括为“敬拜”
  rationale: 原文用两个动作描写崇拜，既有俯伏下拜，也有祭祀性的服事；分别译出可保留其修辞和神学张力。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“诸巴力”保留原文复数；“亚舍拉像”兼顾可读性与所指的不确定性；“下拜，侍奉”保留原文两个并列动词。
