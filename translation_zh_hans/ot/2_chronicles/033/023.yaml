  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: zh_hans
  text: 但亚们没有在雅威面前谦卑自己，像他父亲玛拿西谦卑自己那样[a]；因为亚们使自己的罪责越发加重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不像他父亲玛拿西在雅威面前谦卑自己那样。”
    reason: “在雅威面前”在句中的关联范围也可理解为明确修饰玛拿西谦卑自己的行动。
lexical_decisions:
- source_word: נִכְנַע
  choice: 谦卑自己
  rationale: 该词的尼法勒词干在这里具有反身意味，指人在上帝面前降卑、顺服；“谦卑自己”自然地衔接玛拿西悔改的语境。
- source_word: מִלִּפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前”的临在含义，并将四字神名 יְהוָה 音译为“雅威”。
- source_word: כְּהִכָּנַע
  choice: 像……谦卑自己那样
  rationale: 比较前缀与不定式构造以玛拿西的行动为对照；重复“谦卑自己”可保留原文的词语呼应。
- source_word: מְנַשֶּׁה אָבִיו
  choice: 他父亲玛拿西
  rationale: 符合现代汉语的亲属称谓和专名次序，清楚表明玛拿西与亚们的父子关系。
- source_word: כִּי
  choice: 反而
  rationale: 此处后句与前句形成鲜明逆转：亚们不但没有效法父亲降卑，反倒增加罪责；“反而”在汉语中自然表达这一语篇关系。
- source_word: הוּא אָמוֹן
  choice: 他
  rationale: 主语“亚们”已在句首明确，后句用“他”保持原文代词的强调而避免汉语中生硬地重复“他亚们”。
- source_word: הִרְבָּה אַשְׁמָה
  choice: 加重了自己的罪责
  rationale: הִרְבָּה 表示使之增多，אַשְׁמָה 在此指应负的罪责而非赎愆祭；该译法既自然，也保留罪责不断增加的意思。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟音，同时“耶和华”是中文传统译名。
- issue: מִלִּפְנֵי יְהוָה 与比较结构的关联范围
  choice: 主要修饰亚们没有谦卑自己的陈述
  alternative: 也可理解为明说玛拿西是在雅威面前谦卑自己
  rationale: 马所拉重音支持在神名之后形成停顿，但句法上也可把“在雅威面前”补入对玛拿西的比较中；正文与脚注共同保留这种关联范围的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“谦卑自己”保留悔改语境中的神学分量；“加重了自己的罪责”比直译“增多罪责”更符合现代汉语，但不把罪责泛化为单纯的恶行。
