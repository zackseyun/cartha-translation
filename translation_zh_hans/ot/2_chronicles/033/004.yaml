  text: וּ/בָנָ֥ה מִזְבְּח֖וֹת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֥ם יִֽהְיֶה שְּׁמִ֖/י לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: zh_hans
  text: 他又在雅威的殿[a]中筑了祭坛。雅威曾论到这殿说：“在耶路撒冷，我的名必存到永远[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“家”，即“雅威的家”，在这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“我的名必存到永远”；相关经文常见的表达是“我的名必永远在那里”，但本节原文没有“那里”。
    reason: textual_precision
lexical_decisions:
- source_word: וּבָנָה
  choice: 他又……筑了
  rationale: בנה的Qal完成式第三人称阳性单数表示“他筑了”；句首连接词וּ在叙事中以“又”表达承接关系。
- source_word: מִזְבְּחוֹת
  choice: 祭坛
  rationale: מִזְבֵּחַ的复数形式，指用于献祭的坛。现代汉语中“祭坛”本身不标示单复数，语境可自然表达泛指多个祭坛。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿中
  rationale: בַּיִת本义为“房屋、家”，在此明确指圣殿；正文用自然明确的“殿”，脚注保留其字面表达“雅威的家”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，不以称号替代。
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: 雅威曾论到这殿说
  rationale: 关系词אֲשֶׁר承接“雅威的殿”；“论到这殿”明确保留其关系，同时“曾”自然表明这番话早于玛拿西筑坛。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按原文前置这一地点短语，保留其语序和焦点。
- source_word: יִהְיֶה שְּׁמִי
  choice: 我的名必存
  rationale: 直译为“我的名将是／存在”；“必存”在汉语中自然、庄重，又不擅自补入原文没有的“那里”。
- source_word: לְעוֹלָם
  choice: 到永远
  rationale: 表达持续无尽的时间，与יִהְיֶה连用时译为“存到永远”符合现代汉语。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，音译为“雅威”可保留其专名性质，避免以称号“主”代替；“耶和华”是另一传统音译。
- issue: 是否在“我的名必存”中补入地点副词
  choice: 不补“那里”
  alternative: 我的名必永远在那里
  rationale: 本节希伯来文本没有שָׁם（“那里”）。虽然相关经文常见“我的名必永远在那里”的表达，本译文保留本节较简略且略带张力的措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“筑了祭坛”沿用清楚自然的宗教用语；以“殿”避免普通读者将“家”误解为一般住所，同时借脚注呈现原文意象。引语保留地点短语前置，并不补入原文没有的“那里”。
