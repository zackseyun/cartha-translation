  yaml_path: translation/ot/2_chronicles/033/021.yaml
  text: Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem.
translation:
  language: zh_hans
  text: 亚们登基的时候二十二岁，在耶路撒冷作王两年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: 二十二岁
  rationale: 希伯来语直译为“二十二岁之子”，是表达年龄的惯用语；现代汉语自然表达为“二十二岁”。
- source_word: אָמ֣וֹן
  choice: 亚们
  rationale: 采用现代中文圣经中常见的人名音译，既便于辨认，也不赋予名字额外释义。
- source_word: בְּמָלְכוֹ
  choice: 登基的时候
  rationale: 介词 בְּ 加 מלך 的不定式附属形表示时间，即开始作王之时；“登基的时候”自然准确地传达即位含义。
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: 两年
  rationale: 直接表达作王持续的年数。
- source_word: מָלַךְ
  choice: 作王
  rationale: 此处动词指在一段时期内执掌王权；“作王”符合现代中文圣经叙事语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词表地点，说明亚们作王的所在地或王都。
