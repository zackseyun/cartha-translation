  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: zh_hans
  text: 玛拿西使犹大和耶路撒冷的居民走入歧途，以致他们行的恶比雅威在以色列人[a]面前所灭的列国更甚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，即“以色列人”或“以色列百姓”。
    reason: 说明带有代表性群体含义的希伯来语阳性表达，并给出其字面形式。
lexical_decisions:
- source_word: וַיֶּתַע
  choice: 使……走入歧途
  rationale: 希菲尔使役形表达“使人迷失、误入歧途”；这一译法自然保留了玛拿西主动误导百姓的使役含义。
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: 犹大和耶路撒冷的居民
  rationale: 保留两个并列受词：作为整体的犹大，以及特别指出的耶路撒冷居民。
- source_word: לַעֲשׂוֹת רָע מִן־הַגּוֹיִם
  choice: 他们行的恶比……列国更甚
  rationale: מִן在此表示比较；补出汉语所需的主语“他们”，并以“比……更甚”清楚表达其恶行超过那些列国。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 这里指迦南诸族或各民族国家，不采用带有后期宗教对比意味的“外邦人”。
- source_word: אֲשֶׁר הִשְׁמִיד
  choice: 所灭的
  rationale: 简洁而有力度地表达使役动词所指的毁灭，并使关系从句符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的学术音译呈现四字神名，将其保留为专名而非替换为称号。
- source_word: מִפְּנֵי
  choice: 在……面前
  rationale: 保留原文空间性习语；在征服语境中表示雅威从以色列人面前除灭列国。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语直译为“以色列的众子”，在此具有全体民族的集合意义；“以色列人”是准确、自然且包含全体百姓的现代汉语表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用的是以色列之神的专名；音译“雅威”保留专名性质，避免以称号代替。
- issue: בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 原文形式为阳性复数，但在此代表整个以色列民族；正文采用现代汉语自然的集合称呼，脚注保留其字面形式。
- issue: 恶行比较的对象
  choice: 他们行的恶比……列国更甚
  alternative: 他们行恶，超过……列国
  rationale: 原文明确比较犹大、耶路撒冷居民与先前列国的恶行程度；译文不淡化这一强烈比较，也不增添具体罪行。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“走入歧途”保留使役动词的形象与道德含义；“更甚”适度保留史书体的凝练庄重。脚注标记置于其实际说明的“以色列人”之后。
