base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: zh_hans
  text: 他的祷告、他怎样蒙垂听、他一切的罪和不忠，以及他在谦卑自己以前在哪些地方建造丘坛、设立亚舍拉[a]和雕像——看哪，这些都记在众先见的记载[b]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉木柱”。这个希伯来词可能指与女神亚舍拉有关的祭祀物件。
    reason: lexical_alternative
  - marker: b
    text: 或译“何赛的言语（或记载）”。末尾的希伯来词可能是人名，而不是“众先见”。
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: 他的祷告
  rationale: 按常用义译为“祷告”，既自然，也不把范围缩窄为单纯的恳求。
- source_word: הֵעָתֶר לוֹ
  choice: 他的祈求如何蒙了垂听
  rationale: 该表达指祷告得到有利回应；采用被动说法，不在本分句中明添希伯来文未明说的主语。
- source_word: כָל חַטָּאתוֹ
  choice: 他一切的罪
  rationale: 保留希伯来文集合性单数，同时用现代汉语自然表达其全部罪行。
- source_word: מַעְלוֹ
  choice: 他的不忠
  rationale: מעל指背信、失信，常带有对上帝不忠的宗教含义；“不忠”清楚而不附加特定宗派术语。
- source_word: בָּמוֹת
  choice: 祭坛
  rationale: 此处指地方性的敬拜设施或邱坛；正文用普通读者易懂的“祭坛”，避免“高处”在现代汉语中仅被理解为空间位置。
- source_word: הָאֲשֵׁרִים
  choice: 亚舍拉
  rationale: 音译此祭祀用语，以免武断限定其形制；脚注说明它也可指与亚舍拉有关的祭祀木柱。
- source_word: הַפְּסִלִים
  choice: 雕像
  rationale: 体现פסילים为雕刻而成的祭祀像，比泛称“偶像”更保留具体词义。
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: 他谦卑下来以前
  rationale: 保留该形式自然的反身或不及物含义，以及历代志叙事对玛拿西自卑的强调。
- source_word: הִנָּם
  choice: 看哪，这些
  rationale: 用庄重而仍可理解的“看哪”保留指示、呈现语气。
- source_word: עַל דִּבְרֵי חוֹזָי
  choice: 记在众先见的记录上
  rationale: 将חוֹזָי理解为“先见们”，并将דברי按文献语境译作“记录”；同时以脚注保留将其视为专名“何赛”的可能。
theological_decisions:
- issue: הִכָּנְעוֹ所表达的玛拿西自卑性质
  choice: 他谦卑下来以前
  alternative: 他被降卑以前
  rationale: 希伯来文自然支持反身或不及物理解，与上下文中的悔改主题相合；不进一步加入经文未明说的完整归信神学。
- issue: 祷告得到回应时行动者是否明说
  choice: 他的祈求如何蒙了垂听
  alternative: 上帝如何回应他
  rationale: 上下文显然涉及上帝的回应，但本节该分句没有明说主语，因此采用汉语被动表达，既清楚又不增补。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“看哪”的历代志文学语气；正文中的每个脚注标记均紧接相关词语。
