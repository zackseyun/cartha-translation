  to: 他的祷告、他怎样蒙垂听、他一切的罪和不忠，以及他在谦卑自己以前在哪些地方建造丘坛、设立亚舍拉[a]和雕像——看哪，这些都记在众先见的记载[b]上。
  rationale: 修订纠正了祷告与蒙应允之间的语义重复，并将“祭坛”改为准确的“丘坛”。同时重组地点、丘坛、亚舍拉和雕像的句法关系，保留原文对这些地点的列举性以及“在他谦卑自己以前”的时间限定。脚注a保留对亚舍拉形制的谨慎说明；脚注b保留末语可为专名“何赛”的文本歧义。
