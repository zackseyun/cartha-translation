base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: zh_hans
  text: 玛拿西与他的列祖同睡；人们把他安葬在他的宫中[a]。他的儿子亚们接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宫”直译为“房屋”或“家”；在君王语境中，也可指王宫或宫殿区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 保留希伯来语王室死亡套语的“睡”之意象，而不直接释为“死了”。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: “列祖”准确传达父辈、先祖之义，也符合汉语圣经叙事中庄重而易懂的表达。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 人们把他安葬
  rationale: 原文为主动复数动词并带第三人称单数宾语后缀；用“人们”保留未明说施事者的复数主动结构。
- source_word: בֵּיתוֹ
  choice: 在他自己的宫中
  rationale: בַּיִת基本义为“房屋、家”，在君王语境中可指王宫或宫殿区域；此处译“宫”较符合现代汉语对王室安葬地点的理解，同时以脚注保留字面义。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 自然、简洁地表达继位并掌权的王室承继公式。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 传达“在他的位置上、取代他”的继位含义，符合现代汉语习惯。
