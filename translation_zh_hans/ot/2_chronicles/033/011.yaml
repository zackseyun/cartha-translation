base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: zh_hans
  text: 于是，耶和华使亚述王军队的将领前来攻击他们；他们用钩子[a]擒住玛拿西，用铜镣锁住他，把他押到巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用荆棘”。希伯来语这个词可指钩子或荆棘；在这里也可能泛指控制俘虏的刑具。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: 使……来攻击他们
  rationale: 保留使役形的直接神圣施事，并按敌对军事语境将介词译为“攻击”。
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: 亚述王的军队将领
  rationale: 简洁表达将领与亚述王的隶属关系，并保留军事语境。
- source_word: וַיִּלְכְּדוּ
  choice: 擒住
  rationale: 符合军事俘获君王的语境，比一般的“抓住”更庄重准确。
- source_word: בַּחֹחִים
  choice: 用钩子
  rationale: 保留 חוח 的具体形象；该词可指钩或荆棘，在此可能指控制俘虏所用的钩具，歧义以脚注说明。
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: 用铜镣锁住他
  rationale: נְחֻשְׁתַּיִם 指铜制的成对束缚器具；“铜镣”既保留材质，也自然表达囚具。
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: 把他押到巴比伦
  rationale: 使役动词在押送俘虏的语境中译作“押到”，自然呈现强制带往目的地的含义。
theological_decisions:
- issue: 亚述军队来袭中的神圣施事
  choice: 译为耶和华“使”亚述王的军队将领来攻击他们
  alternative: 译为耶和华“容许”他们来袭
  rationale: 希伯来文使役形明确把行动归于耶和华；译文保留这一直接陈述，不弱化为单纯许可。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“押到”体现俘虏被强制带走；分号使神的行动与将领随后的一连串行动层次清楚。
