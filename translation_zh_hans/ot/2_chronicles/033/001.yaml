- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: 五十五年
  rationale: 按现代汉语的数字表达方式译出希伯来语“五十又五年”。
- source_word: מָלַךְ
  choice: 作王
  rationale: מלך在此指以君王身份统治；“作王”符合中文历史叙事中的君王纪年用语。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词ב表示地点，直译为“在耶路撒冷”。
