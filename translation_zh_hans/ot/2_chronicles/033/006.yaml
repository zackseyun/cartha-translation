  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: zh_hans
  text: 他使自己的儿子们在欣嫩子谷经火而过[a]，并观测兆象、占卜、施巫术，又行招魂和通灵之术[b]。他做了许多雅威眼中看为恶的事，惹他发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更明确地理解为“把自己的儿子们献在火中”。希伯来语字面作“使自己的儿子们经火而过”，是与献儿女有关的祭仪用语。
    reason: lexical_alternative
  - marker: b
    text: “招魂和通灵之术”所译的希伯来语术语与求问亡灵或灵体有关；这些术语也可指从事这类活动的招魂者、通灵者。
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: 使自己的儿子们……从火中经过
  rationale: 保留希伯来语“使……从火中经过”的祭仪性惯用语，不在正文中直接改写为“焚烧”或“献祭”；其强烈暗示的献子含义在脚注中说明。
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: 在欣嫩子谷
  rationale: 采用现代中文中清楚而简洁的地名形式，保留“欣嫩”这一专名以及“子谷”的构成。
- source_word: וְעוֹנֵן
  choice: 观兆
  rationale: 该词指借征兆预测吉凶；译作“观兆”可与下一个较宽泛的占卜用语有所区分。
- source_word: וְנִחֵשׁ
  choice: 占卜
  rationale: 该动词涉及占卜或解读征兆；“占卜”是现代中文中自然且范围适当的表达。
- source_word: וְכִשֵּׁף
  choice: 施巫术
  rationale: 表达施行法术、巫术之意，并保持原文对禁忌术法的严肃语气。
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: 又行招魂和通灵之术
  rationale: 原短语字面结构生硬，其两个术语可关联于亡灵、灵体以及相应的从业者。正文用实践性表达保持通顺，脚注保留也可能指招魂者、通灵者的词义空间。
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: 做了许多
  rationale: 该结构表示大量、加剧地行事；“做了许多”在现代汉语中自然，并保留行为数量或程度加重的含义。
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为恶的事
  rationale: 贴近希伯来语固定评价公式“在……眼中为恶”，同时使中文句法自然。
- source_word: לְהַכְעִיסוֹ
  choice: 惹他发怒
  rationale: 保留使役含义；不额外加入“故意”或“为要”，以免过度限定此处可表达的目的或结果关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”以音译方式呈现此约名，不以称号替代。
- issue: 是否在正文中明说献子为祭
  choice: 保留“使……从火中经过”的原文惯用语
  alternative: 把儿子们焚烧献祭；把儿子们献在火中
  rationale: 该惯用语强烈关联献儿女的祭仪，但其表层措辞仍是“使……从火中经过”；正文保留原有表达，脚注交代较明确的理解。
- issue: אוֹב וְיִדְּעוֹנִי 指实践还是从业者
  choice: 正文译作“招魂和通灵之术”
  alternative: 招魂者和通灵者；灵媒和巫觋
  rationale: 这些词可指与亡灵或灵体相关的媒介、从业者或实践，且与 עשה 的组合不宜机械直译。正文采用自然而不过度具体的实践性说法，脚注说明另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从火中经过”刻意保留原文祭仪惯用语；“观兆、占卜、施巫术”以并列短语呈现三个相近但不完全相同的禁忌行为。末句用“做了许多”自然传达行为的增多或加剧，不采用生硬的“增多行恶”。
