id: 2CH.33.15
reference: 2 Chronicles 33:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: zh_hans
  text: 他从雅威的殿中除掉外族的神和那偶像[a]，又除掉他在雅威殿所在的山上[b]和耶路撒冷所筑的一切祭坛，把它们扔到城外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神像”。希伯来语 סֶמֶל 可指偶像或用于敬拜的形像。
    reason: lexical_alternative
  - marker: b
    text: “山”也可译作“山冈”；这里指圣殿山。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: 除掉
  rationale: 使役词形表示使某物离开、将其移除；“除掉”自然地表达玛拿西清除异教崇拜物的行动。为使较长的中文句子清楚，在“一切祭坛”前重复“又除掉”。
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: 外族的神
  rationale: 该结构指外来的、非以色列敬拜体系中的诸神；“外族的神”既贴近原文，也比“奇怪的神”更准确。
- source_word: הַסֶּמֶל
  choice: 那偶像
  rationale: סֶמֶל 指供宗教崇拜的形像；“偶像”符合本段改革语境，定冠词以“那”体现。脚注保留较中性的“神像”这一可能译法。
- source_word: מִבֵּית יְהוָה
  choice: 从雅威的殿中
  rationale: בֵּית יְהוָה 在此指圣殿；译作“雅威的殿”既保留“殿/家”的原文表达，又符合现代中文宗教语域。
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: 一切祭坛
  rationale: 直接表达 כָל 加复数名词的总括意义。
- source_word: אֲשֶׁר בָּנָה
  choice: 他……所筑的
  rationale: 关系从句修饰祭坛；“所筑的”简洁、庄重，并清楚表明这些祭坛先前由他建造。
- source_word: בְּהַר בֵּית יְהוָה
  choice: 在雅威殿所在的山上
  rationale: הַר 可指山或山冈；中文补出“所在”以自然表达圣殿与该山的关系，同时脚注说明“山冈”和“圣殿山”的理解。
- source_word: וּבִירוּשָׁלָם
  choice: 和耶路撒冷
  rationale: 保留原文并列的地点范围，不把它缩限为圣殿区域。
- source_word: וַיַּשְׁלֵךְ
  choice: 把它们扔到
  rationale: שׁלך 表达有力的抛弃、丢弃；“扔”保留动作的鲜明感。原文未明说宾语，中文根据前述多项事物补出“它们”。
- source_word: חוּצָה לָעִיר
  choice: 城外
  rationale: 方向副词和介词短语共同表示移至城的外面；“扔到城外”准确而自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见的音译呈现四字神名，而不以“主”这一称号代替。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列神的专名。正文采用较直接对应 Yahweh 发音的“雅威”，保留其作为专名的性质；“耶和华”是中文传统中广为人知的另一音译，但不据传统称号取代原文神名。
- issue: הַסֶּמֶל 的宗教含义
  choice: 偶像
  alternative: 神像
  rationale: 上下文描述清除外族崇拜设施，“偶像”能体现该物件的祭祀用途；但原词本身也可较中性地指宗教形像，因此以脚注保留“神像”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“雅威的殿”首次出现时保留完整结构，后文用较紧凑的“雅威殿”。句中重复“又除掉”是为避免中文读者误将“一切祭坛”只看作地点短语的一部分；不改变原文同一清除动作所涵盖的对象。
