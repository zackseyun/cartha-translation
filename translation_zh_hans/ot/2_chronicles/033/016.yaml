  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: zh_hans
  text: 随后，他修复了雅威的祭坛，在坛上献平安祭[a]和感谢祭[b]，又叫犹大人事奉雅威——以色列的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“感谢”；在这里的献祭语境中，指感谢祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/יכן
  choice: 修复了
  rationale: כון的使役形在此表示使祭坛恢复妥善状态；结合前文祭坛曾遭亵渎的语境，“修复”比字面的“预备”或“设立”更清楚。
- source_word: מִזְבַּח יְהוָה
  choice: 雅威的祭坛
  rationale: 按现代汉语自然表达该领属结构，并将神名יהוה音译为“雅威”。
- source_word: וַ/יִּזְבַּח עָלָיו
  choice: 在坛上献
  rationale: 明确“其上”所指的是祭坛；“献”在后接具体祭类时自然体现献祭动作。
- source_word: זִבְחֵי שְׁלָמִים
  choice: 平安祭
  rationale: 这是祭祀类别的传统、清楚译名；希伯来文虽含“祭牲/祭”这一上位词，汉语不必重复为“献平安祭的祭牲”。
- source_word: וְ/תוֹדָה
  choice: 和感谢祭
  rationale: תוֹדָה可指感谢或感谢祭；在献祭动词及平安祭并列结构中，译作“感谢祭”最符合语境。
- source_word: וַ/יֹּאמֶר לִיהוּדָה
  choice: 又叫犹大人
  rationale: 原文直译为“对犹大说”；此处“犹大”集合性地指犹大居民，“叫”自然表达其要求，又不把动词强化为正式命令。
- source_word: לַ/עֲבֹד
  choice: 事奉
  rationale: עבד用于人与上帝的关系时兼具服事、敬拜与忠诚之意；“事奉”保留其广度，不限于礼仪敬拜。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接保留该领属结构及其所强调的盟约身份。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: יהוה是专有的盟约之名；“雅威”更贴近学界通常重构的读音Yahweh，而非以“主”代称，也不采用源自较晚混合读法的“耶和华”。
- issue: עבד的语义范围
  choice: 事奉
  alternative: 敬拜
  rationale: “敬拜”可能把含义收窄为宗教礼仪；“事奉”同时容纳敬拜、服从和效忠，保留原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“随后”承接叙事进程；破折号使“以色列的上帝”清楚作为“雅威”的同位说明。脚注标记均置于相关词语之后，并纠正了英文咨询层中脚注标记与内容错配的问题。
