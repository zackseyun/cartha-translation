  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: zh_hans
  text: 他在雅威的殿的两个院子里，为天上的万军[a]筑造祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的众星。”这个希伯来语说法可指天上的众军或星体；在这里是星辰崇拜的语境。
    reason: 保留צְבָא הַשָּׁמַיִם的词汇范围及其宗教语境。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 他……筑了
  rationale: 该词是בנה的Qal叙事过去式，承接上下文叙述玛拿西的行动；现代汉语用“筑了”自然表达已发生的建造行为，无须机械译出连接词וַ。
- source_word: מִזְבְּחוֹת
  choice: 祭坛
  rationale: מזבח的复数，指献祭或焚香所用的坛。汉语“祭坛”可由量词和语境表达复数。
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: 为天上的万象
  rationale: 该短语可指天体或被星辰崇拜奉为神明的天上众军。“天上的万象”在现代汉语中自然，也保留其集合性和天体崇拜语境；介词לְ译作“为”，表示为其设立祭坛。
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: 在……两座院子里
  rationale: בִּשְׁתֵּי明确表示两个，חצרות在圣殿建筑语境中指院子或院落；“两座院子”既准确又符合现代汉语习惯。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בית יהוה直译为“雅威的殿/房屋”，此处明确指圣殿；“雅威殿”简洁自然，并按项目规范音译神名יהוה。
theological_decisions:
- issue: יהוה这一神名的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה；采用“雅威”保留其专名性质，避免以称号代替神名。
- issue: צְבָא הַשָּׁמַיִם所指对象
  choice: 天上的万象
  alternative: 天上的万军
  rationale: 在本节祭坛与星辰崇拜的语境中，该短语主要指受敬拜的天体，但其希伯来语意象也可涵盖“天军”。正文采用较自然且契合语境的“天上的万象”，脚注保留“天上的万军”这一可能译法，不将其本体论身份进一步定死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“筑了祭坛”保留经文语体但不显陈旧；“雅威殿”明确地点，“两座院子”准确反映希伯来文的数词。
