revisions:
- from: 他在雅威殿的两座院子里，为天上的万象筑了祭坛。[a]
  to: 他在雅威的殿的两个院子里，为天上的万军[a]筑造祭坛。
  rationale: 修订以“天上的万军”直接对应“天上的军／众”，并以脚注保留其指天上星体的语境性理解；同时调整地点短语和脚注锚点，使译文更符合现代汉语并更清楚地对应原文。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:36Z'
