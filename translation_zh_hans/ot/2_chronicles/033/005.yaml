  source_fidelity: 原文的“天上的万军”（לְכָל־צְבָא הַשָּׁמַיִם）在本节指玛拿西为天上星体／天军所设立的崇拜对象；“天上的万象”虽可联想到天体，却较易被理解为泛指自然界的一切现象，未能充分保留“军、众”的原文意象。原文明确说在雅威殿的两个院子中建造复数祭坛，修订本均予以体现。
  naturalness: “雅威殿”可理解但略显压缩，现代汉语叙事中“雅威的殿”更自然明确。“两个院子”比“两座院子”更合乎汉语对院落空间的常用量词。将脚注标记紧随所注短语，也使指向清楚。
  terminology: 保留“雅威”以对应יהוה；“祭坛”“院子”符合圣殿语境。正文采用“天上的万军”以保存传统且贴近原文的表达，脚注说明其在此处的星辰崇拜语境，避免把所指对象不当地定为单一类别。
