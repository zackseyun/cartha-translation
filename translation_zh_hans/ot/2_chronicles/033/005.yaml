    rationale: “雅威的殿”和“两个院子”在现代标准汉语中更清晰自然，且不改变建筑或数量信息。
  - severity: low
    issue: 脚注锚点置于整句末尾，不能直接显示其所注的是“天上的万军”。
    rationale: 将标记紧随相关词组可消除脚注范围歧义。
