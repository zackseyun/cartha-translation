base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: zh_hans
  text: 他遭患难时，向他的上帝雅威恳求施恩[a]，又在他列祖[b]的上帝面前极其谦卑自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恳求他的上帝雅威”或“求他的上帝雅威开恩”。希伯来语惯用语字面近似“使……的脸柔和”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语作“他的父辈”；也可译为“他的祖先”。正文用“列祖”对应原文的父辈用语，并保留其历史语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: 他遭患难的时候
  rationale: כְּ引出时间处境；הָצֵר לוֹ表示临到他的困苦或压迫。“遭患难的时候”自然地保留了受苦与困窘之意。
- source_word: חִלָּה אֶת־פְּנֵי
  choice: 恳求……施恩
  rationale: 这是希伯来语惯用语，表示恳求某人垂顾、求其恩惠。“恳求……施恩”兼顾其祈求语气和关系性的“求恩”含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按辅音形式所代表的神圣名字音译为“雅威”，不以称号替代。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 准确表达第三人称单数所属后缀，并保留玛拿西与这位上帝之间的关系。
- source_word: וַיִּכָּנַע מְאֹד
  choice: 深深地降卑自己
  rationale: כנע的Nifal在此可按语境理解为反身意义，描述玛拿西主动谦卑下来；מְאֹד强化程度。“深深地降卑自己”避免现代汉语“自卑”所常有的心理学含义。
- source_word: מִלִּפְנֵי
  choice: 在……面前
  rationale: 该介词短语在此表示处于上帝面前或祂的临在中；中文“在……面前”简洁而贴近原文。
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: 他列祖的上帝
  rationale: “列祖”保留אָבוֹת在此处的阳性复数形式及其盟约历史色彩；“祖先”也是可行的宽泛表达。
theological_decisions:
- issue: 神圣名字יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文采用音译“雅威”，以保留其专名性质，而不改译为称号。
- issue: אֱלֹהֵי אֲבֹתָיו中的祖辈称谓
  choice: 他列祖的上帝
  alternative: 他祖先的上帝
  rationale: “列祖”保留原文阳性形式和以色列盟约历史中的固定表达；脚注说明较宽泛的现代译法。
- issue: וַיִּכָּנַע的语态与主体性
  choice: 降卑自己
  alternative: 被降卑；顺服下来
  rationale: Nifal形式容许被动或反身理解；在玛拿西恳求上帝的悔改语境中，反身译法最为自然，但不把它扩写为更具体的宗派性悔罪表述。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“遭患难”“恳求……施恩”清楚传达处境与祈求；以“降卑自己”避免“自卑”在现代汉语中常指低自尊的歧义。脚注标记均置于相关词语之后。
