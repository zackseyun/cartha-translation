revisions:
- from: 此后，玛拿西为大卫城修筑了一道外墙，从谷中基训的西边延伸到鱼门入口；墙环绕俄斐勒[a]，他把墙筑得非常高。随后，他又在犹大所有的坚城中派驻军队统领。
  to: 此后，玛拿西为大卫城修筑了一道外墙，在谷中的基训以西，直到鱼门的入口；他又使城墙环绕俄斐勒[a]，并把它筑得非常高。随后，他又在犹大所有坚固的城邑中设置军事指挥官。
  rationale: 修订仅处理动词主语及空间短语的表达：“使城墙环绕”保留玛拿西作为希伯来叙事中的行动者，同时以自然汉语说明城墙的环绕关系；地理范围改为“在……以西，直到……”以避免无依据地把该处定为路线起点。其余内容及现有地名文化注释均保留。
  reviewer_model: gpt-5.6-terra
