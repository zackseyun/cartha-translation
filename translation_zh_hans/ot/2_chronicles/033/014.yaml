  text: וְ/אַחֲרֵי כֵ֡ן בָּנָ֣ה חוֹמָ֣ה חִֽיצוֹנָ֣ה לְ/עִיר דָּוִ֡יד מַעְרָבָ/ה֩ לְ/גִיח֨וֹן בַּ/נַּ֜חַל וְ/לָ/ב֨וֹא בְ/שַׁ֤עַר הַ/דָּגִים֙ וְ/סָבַ֣ב לָ/עֹ֔פֶל וַ/יַּגְבִּיהֶ֖/הָ מְאֹ֑ד וַ/יָּ֧שֶׂם שָֽׂרֵי חַ֛יִל בְּ/כָל הֶ/עָרִ֥ים הַ/בְּצֻר֖וֹת בִּ/יהוּדָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: zh_hans
  text: 此后，玛拿西为大卫城修筑了一道外墙，在谷中的基训以西，直到鱼门的入口；他又使城墙环绕俄斐勒[a]，并把它筑得非常高。随后，他又在犹大所有坚固的城邑中设置军事指挥官。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俄斐勒”是耶路撒冷的一处地名，大概指圣殿山南面的高地。
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 自然表达叙事中的时间推进，也保留原文“在这以后”的顺序关系。
- source_word: בָּנָה
  choice: 修筑
  rationale: 基本义为“建造”；用于城墙时，“修筑”符合现代汉语，同时不擅自确定是重建。
- source_word: חוֹמָה חִיצוֹנָה
  choice: 一道外墙
  rationale: 准确表达城外或外围城墙之意，措辞自然明确。
- source_word: לְעִיר דָּוִיד
  choice: 为大卫城
  rationale: 介词可表示城墙服务或归属于大卫城；“为大卫城修筑”在汉语中自然，并保留其防护关联。
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: 从谷中基训的西边
  rationale: 将מַעְרָבָה理解为相对于基训的西边；נחל在此按地形译为“谷”，不额外限定为常年或季节性河道。
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: 延伸到鱼门入口
  rationale: 该结构在此表示城墙延展所至；“延伸到”清楚呈现空间范围。
- source_word: וְסָבַב לָעֹפֶל
  choice: 墙环绕俄斐勒
  rationale: סבב可指绕行或环绕；结合上下文，以城墙为语义主语最为清晰，同时保留“环绕”的空间含义。
- source_word: הָעֹפֶל
  choice: 俄斐勒
  rationale: 作为耶路撒冷地名音译，不在正文中解释性改写。
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: 他把墙筑得非常高
  rationale: 阴性宾语后缀回指城墙；明说“墙”可避免汉语代词含混，并保留מְאֹד的强调。
- source_word: שָׂרֵי חַיִל
  choice: 军队统领
  rationale: 此短语在语境中指军事长官；“军队统领”庄重易懂，避免误译为勇士。
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת
  choice: 在犹大所有的坚城中
  rationale: “坚城”简洁表达设防、加固的城市，符合历史叙事语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文以“墙”为“环绕”的语义主语，以免读者误以为玛拿西本人绕行；不把בנה具体化为“重建”，也不对城墙路线作超出原文的地理推断。
