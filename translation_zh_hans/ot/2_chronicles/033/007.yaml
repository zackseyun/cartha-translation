revisions:
- from: 他把自己造的雕像，就是那偶像[a]，放在上帝的殿里。关于这殿，上帝曾对大卫和他儿子所罗门说：“在这殿和耶路撒冷，就是我从以色列各支派中所选择的地方，我要永远立我的名。”
  to: 他把自己所造的雕像——那偶像[a]——放在上帝的殿里。关于这殿，上帝曾对大卫和他儿子所罗门说：“在这殿和耶路撒冷——我从以色列各支派中所选择的地方——我要永远安置我的名。”
  rationale: 修订仅调整两处：以破折号更清楚地呈现“雕像／偶像”的并置关系，并将“立我的名”改为“安置我的名”，以保留שׂים的放置意象，避免汉语“立名”的名声义。其余内容维持原译的措辞、庄重语体与不排他地处理“这殿和耶路撒冷”及其关系从句的方式。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:41Z'
