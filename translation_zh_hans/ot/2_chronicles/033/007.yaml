  naturalness: 整体庄重、通顺，符合现代书面普通话。“雕像，就是那偶像”可理解，但以破折号处理同位关系更自然，也更接近原文两个紧邻名词的并置。引语中将地点关系从句用破折号标出，可避免“就是……地方”造成的强等同感。
  terminology: “上帝”恰当对应אֱלֹהִים；“殿”适合本处圣殿语境；“大卫”“所罗门”“耶路撒冷”“以色列”均规范。“安置我的名”比“立我的名”更能保留原文的圣所—名之意象，而不将其神学化为名声或居住的解释。
