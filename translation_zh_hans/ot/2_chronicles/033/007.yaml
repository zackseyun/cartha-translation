source:
  edition: WLC
  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: zh_hans
  text: 他把自己所造的雕像——那偶像[a]——放在上帝的殿里。关于这殿，上帝曾对大卫和他儿子所罗门说：“在这殿和耶路撒冷——我从以色列各支派中所选择的地方——我要永远安置我的名。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那偶像的雕像”。希伯来文在这里连用了两个意义相近、都可指偶像或神像的词；两者之间的关系可理解为同位或属格。
    reason: 保留פֶּסֶל הַסֶּמֶל两个名词之间可理解为同位或属格关系的词汇歧义。
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 他把……放在
  rationale: שׂים在叙事中表示放置；“把……放在”符合现代汉语习惯，也清楚保留动作与地点。
- source_word: פֶּסֶל הַסֶּמֶל
  choice: 雕像，就是那偶像
  rationale: 两个相近名词并用，指非法敬拜所用的神像；译文以同位结构保留两词，不将其合并为一个概念。
- source_word: אֲשֶׁר עָשָׂה
  choice: 自己造的
  rationale: 明确该像由本节主语制造；“自己”自然体现关系从句所指。
- source_word: בְּבֵית הָאֱלֹהִים
  choice: 在上帝的殿里
  rationale: בית在此指圣殿；“上帝的殿”既自然又保留“殿/房屋”的意象，并与下文重复用词呼应。
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: 关于这殿，上帝曾……说
  rationale: 将关系从句明确连接到上帝的殿；“曾”表达此话早于当前叙事事件。
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: 对大卫和他儿子所罗门
  rationale: 保留两个受话者以及所罗门与大卫的父子关系。
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלִַם
  choice: 在这殿和耶路撒冷
  rationale: 保留圣殿与城市并列的地点表达，并重复“殿”这一关键词。
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 就是我从以色列各支派中所选择的地方
  rationale: 希伯来语关系代词的先行对象在并列地点后可能显得宽泛；补出“地方”使中文通顺，同时不把选择仅限于圣殿或仅限于耶路撒冷。
- source_word: אָשִׂים אֶת שְׁמִי
  choice: 我要……立我的名
  rationale: “立我的名”保留上帝将自己之名置于所选之地的具体盟约性表达，比解释性改写更贴近原文，也较“放我的名”庄重自然。
- source_word: לְעֵילֹום
  choice: 永远
  rationale: 这是לְעוֹלָם在此类盟约宣告中的标准现代汉语表达。
theological_decisions:
- issue: 神的称谓
  choice: 上帝
  alternative: 耶和华
  rationale: 原文使用אֱלֹהִים，并非四字神名יהוה，因此不引入“耶和华”。
- issue: 圣殿神学中的“名”之表达
  choice: 我要永远立我的名
  alternative: 我要使我的名永远居住在那里
  rationale: 原文直说“置立我的名”，没有使用“居住”一词；译文保留这一神学意象，不将其解释为更完整的教义性转述。
- issue: 被选择对象的范围
  choice: 将“这殿和耶路撒冷”共同表述为所选择的地方
  alternative: 只把“耶路撒冷”视为关系从句的先行词
  rationale: 希伯来语关系从句紧随耶路撒冷，但整个地点组合与“立我的名”相连；中文采用不排他的表达，避免武断消除句法上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“殿”比“房屋”更符合本处圣殿语境，同时维持原文בית在上下文中的重复；引语保持盟约宣告的庄严语气。
