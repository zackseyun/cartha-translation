source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: zh_hans
  text: 他做了雅威眼中看为恶的事，效法雅威从以色列人[a]面前赶出的那些民族所行的可憎之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”，即以色列人。
    reason: 说明原文的男性家族式表达及其在本句中的群体所指。
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 将实词化的形容词 הָרַע 译为“恶的事”，并以过去叙事语气自然表达 wayyiqtol；句首的连接词不机械译出。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象，同时采用现代汉语中自然的“眼中看为”结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: כְּתוֹעֲבוֹת
  choice: 效法……所行的可憎之事
  rationale: כְּ 可表示比较或依循；“效法”自然表达按那些民族的行为模式而行。תּוֹעֲבוֹת 具有强烈的宗教与道德厌恶色彩，译作“可憎之事”。补出“所行”仅为明确汉语关系，不增加新的行为内容。
- source_word: הַגּוֹיִם
  choice: 那些民族
  rationale: 此处指迦南地先前的非以色列族群；“民族”比“外邦人”更贴合历史语境，也避免不必要的后期宗教含义。
- source_word: הוֹרִישׁ
  choice: 赶出
  rationale: ירשׁ 的使役形在此表示使原居民失去土地、将他们逐出；“赶出”清楚而自然。
- source_word: מִפְּנֵי
  choice: 从……面前
  rationale: 较直接地保留原文空间性习语，并与“赶出”搭配通顺。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定族群称谓在现代汉语中通常自然译为“以色列人”；其字面形式另以脚注说明，以免正文产生仅指男性后裔的误解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文以“雅威”音译，保留专名性质；“耶和华”是传统形式，“上主”则以称号替代专名。
- issue: בְּנֵי יִשְׂרָאֵל 的性别与族群表达
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 这里的复数阳性家族表达在历史叙事中指整个以色列群体，而非只强调男性。正文采用现代汉语常用族称，并用脚注保存字面形式。
- issue: תּוֹעֲבוֹת 的宗教—道德力度
  choice: 可憎之事
  alternative: 可恶的风俗；令人厌恶的行为
  rationale: “可憎之事”保留该词强烈的否定评价，也不把其范围擅自限定为礼仪、风俗或一般道德行为。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“雅威眼中看为恶”保留原文评价性意象；“效法……所行的可憎之事”兼顾 כְּ 的依循含义和汉语可读性。脚注标记置于其实际所解释的“以色列人”之后。
