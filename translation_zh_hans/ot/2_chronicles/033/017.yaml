  text: אֲבָל֙ ע֣וֹד הָ/עָ֔ם זֹבְחִ֖ים בַּ/בָּמ֑וֹת רַ֖ק לַ/יהוָ֥ה אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: zh_hans
  text: 不过，百姓仍在丘坛献祭，只献给耶和华——他们的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָל
  choice: 不过
  rationale: 表示与上文改革成果相对的转折，语气自然庄重，也保留让步意味。
- source_word: עוֹד
  choice: 仍
  rationale: 表达这种做法持续存在，并未随着此前的改革完全停止。
- source_word: הָעָם
  choice: 百姓
  rationale: 符合历史叙事中对全体民众的常用称呼。
- source_word: זֹבְחִים
  choice: 献祭
  rationale: 准确表达祭献行为；希伯来语分词在这里概括持续的惯常行为，汉语以“仍在……献祭”自然呈现。
- source_word: בַּבָּמוֹת
  choice: 在丘坛
  rationale: “丘坛”是 בָּמוֹת 的传统而准确的中文表达，指地方性的祭祀场所，不必然强调每处都位于山顶。
- source_word: רַק
  choice: 只
  rationale: 限定献祭的对象而非地点：虽然仍使用丘坛，但对象仅是耶和华。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词 לְ 标明祭献的对象；以“耶和华”呈现经文中的神圣名字 יהוה。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 自然表达带第三人称复数后缀的构造形式，并说明耶和华与百姓的关系。
theological_decisions:
- issue: 神圣名字 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文圣经传统中“耶和华”是该名字最广为人知且可辨识的形式；这里按专名翻译，不以“主”替代。
- issue: 丘坛献祭这一分句的含义
  choice: 百姓继续在丘坛献祭，但祭献对象仅为耶和华他们的上帝
  alternative: 百姓只在属于耶和华的丘坛献祭
  rationale: 希伯来语 רַק לַיהוָה 位于地点短语之后，最自然地限定献祭对象，而不是限定丘坛的归属或献祭地点；由此保留改革尚不彻底的张力。
- issue: 分词 זֹבְחִים 的时态体貌
  choice: 仍在……献祭
  alternative: 仍献祭
  rationale: 分词与 עוֹד 结合，突出当时仍持续存在的做法；“仍在”在现代汉语中清楚呈现这种延续性。
translation_notes:
  register: 采用现代标准普通话，简洁而庄重。“不过”承接上文形成转折；“丘坛”保留历代志叙事的宗教文化术语。原文语义清楚，无需脚注。
