  yaml_path: translation/ot/2_chronicles/011/002.yaml
  text: And the word of Yahweh came to Shemaiah the man of God, saying,
translation:
  language: zh_hans
  text: 耶和华的话临到神人示玛雅，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 该叙事形式承接上一事件；现代汉语无需机械译出“于是发生了”，由整句语序自然表达事件推进。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知叙事中惯用的“耶和华的话临到……”公式，并明确其构造关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中通行的专名形式音译四字神名，不以称号替代。
- source_word: שְׁמַעְיָהוּ
  choice: 示玛雅
  rationale: 采用该希伯来人名在简体中文圣经传统中的通行译名。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是指先知性人物的固定称谓；“神人”简洁、庄重，并为现代中文读者所熟悉。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出后续直接引语的公式，译作“说”自然且贴近原文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是现代简体中文基督教读者最熟悉的专名形式，既保留其专名性质，也避免用“主”这一称号代替。
- issue: אִישׁ הָאֱלֹהִים 的身份称谓
  choice: 神人
  alternative: 属神的人
  rationale: 原文是一个公认的先知性职分称谓，并非泛指敬虔之人；“神人”更能保留其称号性质，而不额外界定其身份。
translation_notes:
  register: 采用自然、庄重的现代标准普通话，并保留中文圣经中易于辨认的先知启示公式。原文句首的叙事连接词不单独译作“但”，以免加入明确的转折关系；中文以“……临到……”自然承接上下文。
