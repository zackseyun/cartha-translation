base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: zh_hans
  text: 他加固了这些设防城邑[a]，在其中委派长官[b]，并在其中储备粮食、油和酒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设防城邑”也可译作“堡垒”或“要塞”。
    reason: lexical_alternative
  - marker: b
    text: “长官”也可译作“首领”“统领”或“官员”。
    reason: lexical_alternative
  - marker: c
    text: 原文用词既可指“储藏处”，也可指储存在其中的物资；这里按备用物资理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: 加固了
  rationale: חזק在此为使之坚固、加强防御之意；“加固”自然表达使既有防御设施更牢固的动作。
- source_word: הַמְּצֻרוֹת
  choice: 这些设防城邑
  rationale: 该复数名词指设防之地、堡垒或要塞；结合上文所列城邑，译作“这些设防城邑”既承接语境，也不把它们一概限定为单体堡垒。
- source_word: וַיִּתֵּן בָּהֶם
  choice: 在其中安置……又储备……
  rationale: נתן与ב连用表示把人或物置于其中。中文按人和物分别用“安置”与“储备”，使表达自然，同时保留二者都被置于设防城邑中的意义。
- source_word: נְגִידִים
  choice: 长官
  rationale: נָגִיד可指首领、统领、官长等。此处虽有军事背景，但词本身不必专指将领；“长官”保留行政与军事职权之间的宽度。
- source_word: וְאֹצְרוֹת
  choice: 储备
  rationale: אֹצָרוֹת既可指储藏处，也可指储存的物资。后接粮食、油和酒，正文采用自然的“储备”，并以脚注保留“储藏处”的可能。
- source_word: מַאֲכָל
  choice: 粮食
  rationale: מַאֲכָל泛指食物或口粮；在城防物资清单中，“粮食”比笼统的“食物”更符合储备语境。
- source_word: שֶׁמֶן
  choice: 油
  rationale: שֶׁמֶן通常指油，在此很可能是作为日常物资的橄榄油，但原文未明说种类，故不具体化。
- source_word: יָיִן
  choice: 酒
  rationale: יָיִן通常指酒；“酒”是简明、准确的现代汉语对应词。
theological_decisions: []
