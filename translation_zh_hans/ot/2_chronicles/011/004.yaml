base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: zh_hans
  text: 耶和华如此说：“你们不可上去，也不可与你们的弟兄交战。各人回自己的家去吧，因为这事出于我。”他们听从了耶和华的话，就转回，不再往耶罗波安那里去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“就转回，不往耶罗波安那里去”；根据上下文，这是指他们不再前往与耶罗波安交战。
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传达神谕的固定使者公式；中文庄重自然，并明确呈现神名。
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: 你们不可上去……交战
  rationale: “上去”保留עלה所表达的上行或军事进发意象；“交战”准确传达לחם在本处的战争语境。
- source_word: עִם אֲחֵיכֶם
  choice: 与你们的弟兄
  rationale: 保留“弟兄”的亲属称谓，突出敌对双方同属以色列人；中文“与……交战”自然表达敌对关系。
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: 各人回自己的家去吧
  rationale: “各人”传达אִישׁ的逐一分配意义；“回自己的家”贴近原文且符合现代汉语。
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: 因为这事出于我
  rationale: 简洁保留该事件源于神的明确断言，不额外界定其因果方式。
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: 他们听从了耶和华的话
  rationale: שׁמע兼有听见与顺从之意，后续行动表明他们遵从了命令，因此“听从”最符合语境。
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: 就回去了，不再前去攻打耶罗波安
  rationale: 原文直译近于“转回，不往耶罗波安那里去”；上下文明确是军事行动，正文以“攻打”呈现语境意义，并用脚注保留较字面的可能译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用普通中文读者最熟悉、庄重且明确作为专名的传统译法，不以“主”遮蔽原文神名。
- issue: מֵאִתִּי נִהְיָה所表达的神圣因果关系
  choice: 这事出于我
  alternative: 这事是我使它发生的
  rationale: 原文明确将此事归于神，却未在本句详述神施行的机制；“出于我”保留其力度与一定表达空间，避免扩展为更具体的教义陈述。
- issue: אֶל יָרָבְעָם在军事语境中的方向与敌对含义
  choice: 前去攻打耶罗波安
  alternative: 往耶罗波安那里去
  rationale: אֶל本身表达趋向，敌对含义来自上下文；正文使军事语境清楚，脚注则保留介词更直接的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“上去”和“弟兄”等原文重要意象；命令句用“不可”“去吧”，既有权威感，也符合自然汉语。
