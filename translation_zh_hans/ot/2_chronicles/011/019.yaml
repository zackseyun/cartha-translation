  text: 她给他生了儿子：耶乌施、示玛利雅和撒罕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 她……生了
  rationale: 该动词为 ילד 的叙事性未完成式，承接前文并叙述随后发生的事；现代汉语用“生了”自然简洁，也明确保留女性主语。
- source_word: לוֹ
  choice: 给他
  rationale: 介词 ל 加第三人称阳性单数后缀，在生育表达中指孩子的父亲；“给他生了”符合现代汉语习惯。
- source_word: בָּנִים
  choice: 几个儿子
  rationale: 原文明确为复数“儿子”，随后列出三名男性后代；加入量词“几个”使汉语自然，但不另行补出原文未明说的数字。
- source_word: יְעוּשׁ
  choice: 耶乌施
  rationale: 按希伯来语人名音译，并采用中文圣经语境中清楚、庄重的形式。
- source_word: שְׁמַרְיָה
  choice: 示玛利雅
  rationale: 按希伯来语 Šəmaryāh 音译，保留末尾神名构件在传统音译中的表现。
- source_word: זָהַם
  choice: 撒罕
  rationale: 按希伯来语 Zāham 音译，采用适合现代普通话读者的人名形式。
