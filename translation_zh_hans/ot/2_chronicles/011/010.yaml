  text: and Zorah[a], Aijalon, and Hebron, which are in Judah and in Benjamin[b], fortified cities.
translation:
  language: zh_hans
  text: 又修筑了琐拉、亚雅仑和希伯仑；这些城位于犹大和便雅悯境内，都是坚城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרְעָה
  choice: 琐拉
  rationale: 地名采用现代中文圣经读者较熟悉的传统译名，不另行解释其可能的词源含义。
- source_word: אַיָּלוֹן
  choice: 亚雅仑
  rationale: 地名采用通行的中文圣经音译。
- source_word: חֶבְרוֹן
  choice: 希伯仑
  rationale: 地名采用通行的中文圣经音译。
- source_word: אֲשֶׁר בִּיהוּדָה וּבְבִנְיָמִן
  choice: 这些城位于犹大和便雅悯境内
  rationale: 希伯来文关系从句没有明示系词；中文补出“这些城位于”，以自然表达地理位置，同时不具体判定各城分别属于哪一支派区域。
- source_word: עָרֵי מְצֻרוֹת
  choice: 坚城
  rationale: 该组合指设有防御工事的城邑；“坚城”简洁、庄重，也符合本段修筑防御城邑的语境。
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: 又修筑了……、……和……
  rationale: 本节以连续的宾语标记承接上文统领整份名单的动词“修筑”；中文为使独立经节完整而补出该动词，并以自然的并列结构呈现名单。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“又修筑了”从上文补足省略的支配动词；分号显示后半句是对所列城邑的说明。避免使用“分别”，以免超出原文而指定每座城与犹大、便雅悯的对应关系。
