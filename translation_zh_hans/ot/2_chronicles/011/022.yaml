base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: zh_hans
  text: 罗波安任命玛迦的儿子亚比雅为首领，在众弟兄中作领袖[a]，因为他有意立他为王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在众弟兄之上作领袖。”希伯来语介词在这里可理解为“在……中”，也可表示相对于众弟兄居于首位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: 立
  rationale: 使役形在这里表示使某人处于特定职位，即任命、确立；“立”简洁自然，也与后文“立……为王”形成呼应。
- source_word: לָרֹאשׁ
  choice: 为首
  rationale: רֹאשׁ本义为“头”，用于地位时表示居首或首领身份；“为首”保留了原文意象。
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: 玛迦的儿子亚比雅
  rationale: 按现代汉语习惯表达希伯来语的父母子女关系，并采用通行圣经人名译法。
- source_word: לְנָגִיד
  choice: 居领导地位
  rationale: נָגִיד指被指定承担权柄的领袖或统治者。结合前面的“为首”，译作“居领导地位”既呈现其职权，又避免用两个近义头衔造成生硬重复。
- source_word: בְּאֶחָיו
  choice: 在众弟兄中
  rationale: 介词ב可表示在群体之中，也可表达相对于该群体的优先或管辖关系；正文采用较谨慎的“在……中”，另以脚注保留“管理众弟兄”的可能。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出罗波安这样安排的原因；“因为”是清楚自然的现代汉语。
- source_word: לְהַמְלִיכוֹ
  choice: 他有意立亚比雅为王
  rationale: 带ל的使役不定式表达目的或意图，即“使他作王”。补出“有意”呈现目的含义，并用“亚比雅”消除汉语代词可能造成的指代含混。
theological_decisions:
- issue: 罗波安的安排是否已经使亚比雅作王
  choice: 译为“有意立亚比雅为王”，表明这是当时的意图而非已经完成的登基。
  alternative: 译为“为要立他作王”。
  rationale: לְהַמְלִיכוֹ是带目的意味的不定式；上下文说明任命亚比雅居首是为将来的王位安排。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“为首”保留希伯来语的头部隐喻；“居领导地位”传达נָגִיד的职权含义。正文与脚注共同保留בְּאֶחָיו在“众弟兄中”与“管理众弟兄”之间的真实歧义。
