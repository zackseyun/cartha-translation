base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: zh_hans
  text: 在她之后，他娶了押沙龙的女儿[a]玛迦；她给他生了亚比雅、亚太、细撒和示罗密。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“押沙龙的女儿”；“女儿”有时也可指较远的女性后裔，因此有人理解为“押沙龙的孙女”。
    reason: 保留家谱称谓可能具有较宽含义的另一种理解。
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: 继她之后
  rationale: “她”回指上一节提到的妻子；译文保留阴性单数指代，不笼统译作“后来”。
- source_word: לָקַח
  choice: 娶了
  rationale: 该动词本义为“取、带走”，在此明确用于婚姻语境；现代汉语用“娶了”自然且准确。
- source_word: מַעֲכָה
  choice: 玛迦
  rationale: 按中文圣经人名的通行译法音译。
- source_word: בַּת אַבְשָׁלוֹם
  choice: 押沙龙的女儿
  rationale: 正文直接保留希伯来语“女儿”的称谓；此词在家谱语境中也可能泛指较远的女性后裔，相关可能性列入脚注。
- source_word: וַתֵּלֶד לוֹ
  choice: 她给他生了
  rationale: 既表达“生育”，也保留希伯来语间接受词“给他”。
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: 亚比雅、亚太、西撒和示罗密
  rationale: 各人名按中文圣经传统形式音译；希伯来语重复的宾格标记在汉语中无需逐一表达。
theological_decisions:
- issue: 玛迦被称为“押沙龙的女儿”所涉及的家谱关系
  choice: 正文译作“押沙龙的女儿”
  alternative: 押沙龙的孙女／女性后裔
  rationale: 希伯来文明确使用“女儿”，因此正文不替原文消解家谱上的张力；同时用脚注保存该词可能指较远女性后裔的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“继她之后”保留原文对前一位妻子的阴性指代；分号清楚区分娶妻与生子两个连续事件。
