base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: zh_hans
  text: “你要对所罗门的儿子、犹大王罗波安，以及住在犹大和便雅悯的全体以色列人说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: 你要……说
  rationale: 这是命令式，要求传达上帝的信息；“你要……说”在现代汉语中自然地保留了直接命令的语气。
- source_word: אֶל
  choice: 对
  rationale: 该介词标明说话的对象；汉语用“对……说”最为自然。
- source_word: רְחַבְעָם
  choice: 罗波安
  rationale: 采用现代简体中文圣经语境中通行的人名译法。
- source_word: בֶּן שְׁלֹמֹה
  choice: 所罗门的儿子
  rationale: 准确表达希伯来语附属结构所标明的父子关系。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 作为罗波安的同位称号；“犹大王”简洁、自然，并忠实表达其王权所属。
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: 以及……全体以色列人
  rationale: “以色列”在此指被称为以色列的民众。汉语若直译“全以色列”容易被理解为整个国家，故用“全体以色列人”更清楚，同时不改变其群体称谓。
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: 住在犹大和便雅悯的
  rationale: 介词 בְּ 表示所在地；补出“住在”符合汉语习惯，并避免误解为只是在说明支派身份。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的信息内容。汉语以冒号自然地标示随后开始的直接引语，无须重复“说道”。
theological_decisions: []
