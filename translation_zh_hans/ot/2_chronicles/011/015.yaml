base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: zh_hans
  text: 耶罗波安为自己，为丘坛、山羊鬼[a]和他所造的牛犊设立祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山羊鬼”也可译作“山羊”，或指羊形的灵体（传统上有时译作“萨梯”）。这个希伯来词在祭祀语境中可能指与不当敬拜有关的羊形存在。
    reason: 保留 שְׂעִירִים 的词义范围及其在本节祭祀语境中的不确定性。
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: 设立
  rationale: 此处为使役、任职语境，宾语是祭司，表示任命或设立其担任祭司职分，而非单纯使其站立。
- source_word: לּוֹ
  choice: 为自己
  rationale: 与主语耶罗波安相呼应，表达他为自身所建立的敬拜体系任命人员。
- source_word: כֹּהֲנִים
  choice: 祭司
  rationale: 这是该礼仪职分在现代汉语中的标准译法。
- source_word: לַבָּמוֹת
  choice: 负责丘坛
  rationale: בָּמוֹת 指用于敬拜的高处或高地祭坛；“丘坛”既保留地点和祭祀设施的含义，也符合中文圣经语体。介词 לַ 在此与“设立祭司”连用，译作“负责”较自然。
- source_word: לַשְּׂעִירִים
  choice: 山羊鬼
  rationale: 在祭祀语境中，שְׂעִירִים 很可能指山羊形的鬼灵或受崇拜的此类形象；“山羊鬼”保留山羊意象和超自然含义，同时以脚注注明词义范围。
- source_word: וְלָעֲגָלִים
  choice: 以及……牛犊
  rationale: 原词本义为牛犊，语境表明它们是敬拜对象或神像；正文保留简洁的具体形象，不额外加入“偶像”。
- source_word: אֲשֶׁר עָשָׂה
  choice: 他所造的
  rationale: 自然表达关系从句，并明确牛犊由耶罗波安制造。原文单数动词可概括与其相关的敬拜设施和对象，但关系从句在语序上最直接修饰牛犊，因此不擅自扩大修饰范围。
theological_decisions:
- issue: 祭祀语境中 שְׂעִירִים 的所指
  choice: 山羊鬼
  alternative: 山羊；羊形怪物
  rationale: 本节列举耶罗波安所设敬拜体系中的丘坛和牛犊，故此词较可能指与非法敬拜有关的山羊形鬼灵，而非普通动物。不过希伯来词本身仍有“公山羊”等词义，因此通过脚注保留词义上的不确定性。
- issue: 关系从句 אֲשֶׁר עָשָׂה 的修饰范围
  choice: 按就近关系译为“他所造的牛犊”
  alternative: 理解为概括前述全部敬拜对象或设施
  rationale: 希伯来语关系从句紧随“牛犊”，最自然地修饰该名词；不把“造”明确扩展到丘坛和山羊鬼，以免消除原文可能存在的句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丘坛”保留熟悉的圣经祭祀术语；“负责”使三个介词短语与“设立祭司”的关系在中文中清楚自然。脚注标记已在正文“山羊鬼”后标出。
