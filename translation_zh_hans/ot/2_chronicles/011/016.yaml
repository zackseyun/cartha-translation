  text: וְ/אַחֲרֵי/הֶ֗ם מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל הַ/נֹּֽתְנִים֙ אֶת לְבָבָ֔/ם לְ/בַקֵּ֕שׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בָּ֚אוּ יְר֣וּשָׁלִַ֔ם לִ/זְבּ֕וֹחַ לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: zh_hans
  text: 在他们之后，以色列各支派中凡立定心志[a]寻求雅威——以色列的上帝——的人，也都来到[b]耶路撒冷，向雅威、他们列祖的上帝献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“给（或置）自己的心”，意思是立定心意、专心寻求雅威。
    reason: lexical_alternative
  - marker: b
    text: 或译“去了”。希伯来语这个动词可按叙事视角译作“来”或“去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: 在他们之后
  rationale: 保留连接词与先后次序，承接上一节所述先行归向罗波安的人。
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派中
  rationale: מִן表示来源；此译自然表达这些人来自以色列所有支派。
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: 凡立定心志
  rationale: 原文直译为“把自己的心交出/摆上”；在此是希伯来语习语，表示坚定地定意或委身。
- source_word: לְבַקֵּשׁ
  choice: 寻求
  rationale: 在宗教语境中指转向并追求上帝，而不只是寻找资料或位置。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列上帝专名的性质，不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达构造短语，明确雅威是以色列的上帝。
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: 来到耶路撒冷
  rationale: בוא可随叙事视角译作“来”或“去”；本段以犹大和耶路撒冷为叙事落点，故正文采用“来到”。
- source_word: לִזְבּוֹחַ
  choice: 献祭
  rationale: 不定式表示前往耶路撒冷的目的；“献祭”简洁、自然且准确。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们祖先的上帝
  rationale: אָבוֹת在此为群体历史与盟约语境中的历代父祖；现代汉语“祖先”自然表达其集体所指。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文两次明确使用四字神名。音译“雅威”保留专名性质，也避免把神名无标记地替换为称号。
- issue: אֱלֹהֵי אֲבוֹתֵיהֶם的群体与盟约含义
  choice: 他们祖先的上帝
  alternative: 他们父辈的上帝；他们列祖的上帝
  rationale: 原词形式为阳性复数“父辈/父祖”，但在此惯用表达中指共同体历代祖先。“祖先”既保留历史延续，也比“列祖”更便于普通现代读者理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威——以色列的上帝——”用破折号保留原文同位说明；加入“也都”承接“在他们之后”并使汉语句势顺畅，但不增加新的神学含义。脚注标记按其实际解释对象分别置于“立定心志”和“来到”之后。
