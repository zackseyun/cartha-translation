source:
  edition: WLC
  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: zh_hans
  text: 罗波安爱押沙龙的女儿玛迦，胜过爱他所有的妻子和妾[a]。他娶了十八个妻子和六十个妾，生了二十八个儿子和六十个女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女儿”也可能泛指“女性后裔”；在家谱语境中，希伯来文的“女儿”有时可用于较宽泛的亲属关系。
    reason: 保留原文家谱称谓可能具有的较宽泛含义。
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: 爱
  rationale: אהב直接表达爱或感情；比较意义由后面的מִכָּל体现，因此译作“爱……胜过……”。
- source_word: בַת אַבְשָׁלוֹם
  choice: 押沙龙的女儿
  rationale: בַת通常意为“女儿”。虽然在家谱语境中有时可泛指女性后裔，正文仍保留希伯来文最直接的表达，并以脚注说明另一种可能。
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: 胜过爱他所有的妻子和妾
  rationale: מִכָּל在此表示比较；“妻子”和“妾”分别保留两种不同的婚姻及社会身份。汉语补出第二个“爱”，使比较关系清楚自然。
- source_word: כִּי
  choice: （另起一句，不显译连接词）
  rationale: כִּי引出解释性的背景。现代汉语可通过句序和语境自然表达这一关系，无须生硬译为“因为”或“原来”。
- source_word: נָשִׁים ... נָשָׂא
  choice: 娶了十八个妻子
  rationale: נשא与נשים连用表示娶妻；“娶了”比直译“带来”准确，也符合现代汉语。
- source_word: פִּילַגְשִׁים
  choice: 妾
  rationale: 该词指地位有别于正妻的伴侣；“妾”简洁而准确地保留了这一社会身份区别。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: 此处以男性为主语，表示他生育、育有这些子女。现代汉语说“生了……儿子和……女儿”自然清楚，且避免文言式“生养”或“生下”可能造成的母性主语联想。
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים
  choice: 二十八个儿子
  rationale: 按现代汉语数字和量词习惯表达。
- source_word: וְשִׁשִּׁים בָּנוֹת
  choice: 六十个女儿
  rationale: 按现代汉语数字和量词习惯表达。
theological_decisions:
- issue: 玛迦被称为“押沙龙的女儿”的家谱含义
  choice: 正文保留“押沙龙的女儿”
  alternative: 可理解为“押沙龙的女性后裔”，可能具体指孙女等后代
  rationale: 希伯来文בַת最直接的意思是“女儿”，但在家谱语境中有时可作较宽泛的亲属称谓。为避免擅自消除原文的张力，正文直译，脚注保留较宽泛的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。人名依常见中文圣经译名处理；“妻子”和“妾”保留原文中的身份区别。正文脚注标记[a]紧接相关称谓所在分句。
