  yaml_path: translation/ot/2_chronicles/011/006.yaml
  text: And he built Bethlehem[a], Etam, and Tekoa.
translation:
  language: zh_hans
  text: 他修建了伯利恒、以坦和提哥亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 修建了
  rationale: בנה的基本义是“建造、修建”。结合上下文所列的是城镇，“修建”自然表达兴建或整修城邑，同时不把本节未明说的“设防”直接写入正文。
- source_word: אֶת
  choice: 不译
  rationale: 这是希伯来语直接宾语标记，现代汉语中没有对应的独立词语。
- source_word: בֵּית לֶחֶם
  choice: 伯利恒
  rationale: 采用现代中文圣经传统中通行且易于识别的地名译法。
- source_word: עֵיטָם
  choice: 以坦
  rationale: 按希伯来语地名音译，并采用中文圣经中较通行的形式。
- source_word: תְּקוֹעַ
  choice: 提哥亚
  rationale: 按希伯来语地名音译，并采用现代中文读者熟悉的通行形式。
- source_word: וְ...וְ...וְ
  choice: 、……和……
  rationale: 希伯来语以连接词逐项串联；现代汉语列举通常使用顿号，并在末项前用“和”，既保留并列关系，也避免生硬。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“他”承接上文的罗波安；本节不重复人名。英文咨询层的脚注标在“Bethlehem”之后，却说明“Tekoa”的另一拼写，且该差异只是英语音译形式，在中文中不构成有意义的文本异读或词义备选，因此不设脚注。
