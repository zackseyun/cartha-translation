  text: Rehoboam lived in Jerusalem[a], and he built fortified cities in Judah.
translation:
  language: zh_hans
  text: 罗波安住在耶路撒冷；他在犹大建造了用于防御的城邑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“设防城邑”或“作为堡垒的城邑”；希伯来文直译为“为防御而建造城邑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住
  rationale: ישׁב在此表示居住、驻留；“住”自然简明，不额外暗示迁居或定居的过程。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按其处所意义直译，并采用现代中文通行地名。
- source_word: וַיִּבֶן
  choice: 修建
  rationale: בנה的基本义是建造；“修建”适合城邑这一宾语，同时不把动词本身解释成“加固”。
- source_word: עָרִים
  choice: 城邑
  rationale: עִיר可指城市或设防聚落；“城邑”既符合古代历史语境，也避免现代“城市”可能带来的规模联想。
- source_word: לְמָצוֹר
  choice: 用作防御
  rationale: לְ表示用途，מָצוֹר在此涉及防御工事、堡垒或围城防务；“用作防御”保留目的关系，又不把具体形态限定为堡垒。
- source_word: בִּיהוּדָה
  choice: 在犹大
  rationale: 按处所短语直译，表明这些城邑修建于犹大境内。
theological_decisions: []
