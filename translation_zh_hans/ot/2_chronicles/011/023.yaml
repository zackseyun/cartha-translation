base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: zh_hans
  text: 他行事明智[a]，从自己的众子中分派一些，把他们安置在犹大和便雅悯全境的各座坚城里[b]；他供给他们充足的粮食，又为他们物色了许多妻子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他显出见识”；直译：“他明白”。
    reason: lexical_alternative
  - marker: b
    text: 这句也可理解为：“把他的众子分散安置在犹大和便雅悯全境的各座坚城里。”希伯来文强调把他们分置各地，并不表示每个儿子都被派往每一处地方。
    reason: textual_ambiguity
  - marker: c
    text: 原文直译：“又寻求了许多妻子。”这里很可能是指他为儿子们安排婚姻。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: 他办事精明
  rationale: בין在此处表示显出洞察力、行事有见识；结合王室行政安排的语境，译为“办事精明”比直译“他明白”更自然，同时不把这种评价提升为属灵智慧。
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: 从自己的众子中分派一些，把他们安置
  rationale: פרץ可表示扩散、散布；后接多个地域和坚城，语境指有意把儿子们分置各处。מִן加כָּל בָּנָיו可作部分用法，因此正文表达“从众子中……一些”，脚注保留“把众子分散安置”的另一种理解。
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: 在犹大和便雅悯全境
  rationale: אֲרָצוֹת在这里指犹大和便雅悯辖下的各地域，并非不同国家；“全境”符合现代汉语行政地理表达。
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: 各座坚城里
  rationale: עָרֵי הַמְּצֻרוֹת指设防的城邑；“坚城”简洁、庄重，并符合圣经历史叙事语体。
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: 他供给他们充足的粮食
  rationale: מָזוֹן是食物、给养；לָרֹב表示数量丰富。“供给……充足的粮食”兼顾具体含义和行政供应语境。
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: 又为他们物色了许多妻子
  rationale: שׁאל基本义为求、寻求；在王室婚姻安排的语境中，“物色”自然表达替儿子寻求婚配对象。“为他们”由上文复数对象补出，脚注注明原文的字面形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的历史叙事语体。“办事精明”“分派”“供给”“物色”体现王室行政和婚姻安排的语境；对מִכָּל בָּנָיו的范围及末句省略的受益对象以脚注保留原文的歧义，避免在正文中作过度确定的解释。
