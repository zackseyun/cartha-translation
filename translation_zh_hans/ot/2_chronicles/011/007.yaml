  text: 以及伯夙[a]、梭哥和亚杜兰；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为三个地名：“伯夙……梭哥……亚杜兰。”这些地名在不同译本中的音译可能略有差异；“梭哥”也常见作“梭哥赫”等形式。
    reason: 说明地名音译差异。
lexical_decisions:
- source_word: וְ/אֶת
  choice: 以及
  rationale: וְ与宾语标记אֶת连用，承接上一节未完的城邑清单；אֶת在中文不另行译出，“以及”自然体现续列关系。
- source_word: בֵּית צוּר
  choice: 伯·夙
  rationale: 犹大地名，采用音译而不按其可能的字面意义“磐石之家”意译；中点有助于呈现复合地名。
- source_word: שׂוֹכוֹ
  choice: 梭哥
  rationale: 该词是地名，采用现代中文圣经读者较熟悉的音译“梭哥”；原文拼写可产生不同的转写形式，但不影响所指地点。
- source_word: עֲדֻלָּם
  choice: 亚杜兰
  rationale: 采用这一犹大地名通行且易懂的中文音译。
