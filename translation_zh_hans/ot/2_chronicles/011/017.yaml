base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: zh_hans
  text: 他们就巩固了犹大国，又扶持[a]所罗门的儿子罗波安三年，因为他们三年之久走在大卫和所罗门的道路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扶持”也可译为“使……刚强”。原文此动词与前面的“巩固”属于相近的语义范围。
    reason: 保留אַמץ可表示支持、加强或使刚强的词义幅度，并说明其与前一近义动词的关系。
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: 巩固了
  rationale: חזק的加强式表示使之坚固、稳固；宾语是“犹大国”，译作“巩固”自然，也不把含义局限于军事防御。
- source_word: מַלְכוּת יְהוּדָה
  choice: 犹大国
  rationale: מַלְכוּת既可指王权，也可指国度；本处侧重犹大这一政治实体，故译作“犹大国”。
- source_word: וַיְאַמְּצוּ
  choice: 扶持
  rationale: אמץ的加强式可表示使刚强、加强或支持；宾语是罗波安本人，结合上下文译作“扶持”最符合现代汉语，同时以脚注保留较直译的可能。
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: 所罗门的儿子罗波安
  rationale: 按现代汉语自然语序保留父子关系和人名。
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: 三年
  rationale: לְ加时间段表示持续时长；原文两次出现“三年”，正文两处都予以保留。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述巩固与扶持的原因，明确表达因果关系。
- source_word: הָלְכוּ בְּדֶרֶךְ דָּוִיד וּשְׁלֹמֹה
  choice: 走大卫和所罗门所走的道路
  rationale: 保留“行走—道路”的行为隐喻，并用现代汉语较自然的结构表达以二人为行为榜样之意，不额外扩展为全面或终身的忠信。
theological_decisions:
- issue: “大卫和所罗门所走的道路”的评价范围
  choice: 保留道路隐喻，并把正面评价限定在经文明说的三年之内
  alternative: 意译为“像大卫和所罗门一样忠于耶和华”
  rationale: 原文只说他们在三年间走二人的道路，并未在本节说明这是终身、全面的义，也未直接加入“忠于耶和华”等解释性措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留原文两次“三年”的强调，也保留“走……道路”的圣经行为隐喻。
