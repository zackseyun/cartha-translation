base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: zh_hans
  text: 原来，利未人离开了他们的城郊草场[a]和地产，前往犹大和耶路撒冷；因为耶罗波安和他的儿子们排斥他们，不准他们担任事奉雅威的祭司[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的城郊空地”或“他们的牧场”。希伯来语指附属于他们城邑的开阔土地。
    reason: lexical_alternative
  - marker: b
    text: 或译“把他们排除在外，不许他们事奉雅威作祭司”。
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: 自己的城郊草场
  rationale: מִגְרָשׁ指附属于城邑的空地，常供放牧使用；“城郊草场”兼顾其地理位置和土地用途。
- source_word: אֲחֻזָּתָם
  choice: 产业
  rationale: אֲחֻזָּה指持有的地产或基业；“产业”在现代中文中简洁庄重，并保留土地占有的含义。
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: 前往犹大和耶路撒冷
  rationale: הלך与方向介词ל连用，表示向目的地移动；“前往”符合叙事视角。
- source_word: הִזְנִיחָם
  choice: 排斥他们
  rationale: זנח的使役式在此表达弃绝、排除；结合后面的介词短语，“排斥”同时保留对人的弃绝和职务上的排除。
- source_word: מִכַּהֵן
  choice: 不让他们作……的祭司
  rationale: 介词מִן接כהן的不定式，表示阻止或排除他们履行祭司职分；此译自然呈现这一禁止含义。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文直接使用神名יהוה；以“雅威”音译，保留其专名性质。
- source_word: כִּי ... כִּי
  choice: 因为……这是因为
  rationale: 第一个כִּי承接上文作解释，第二个כִּי说明利未人离开的原因；如此处理可清楚呈现两层因果关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；“雅威”作为音译，直接保留启示之名，而不以称号替代。
- issue: 利未人被排除在祭司职分之外的语气
  choice: 排斥他们，不让他们作雅威的祭司
  alternative: 革除他们，不许他们事奉雅威作祭司
  rationale: 原文既有对人的弃绝，也有阻止其履行祭司职分之意；正文保留这两层力量，而不进一步断定其职分是否被正式撤销。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“城郊草场”避免旧式“郊野”的含混；以分号和“这是因为”清楚区分本节承接上文的解释与本节内部的原因。
