revisions:
- from: 因为利未人离开了自己的城郊草场[a]和产业，前往犹大和耶路撒冷；这是因为耶罗波安和他的儿子们排斥他们，不让他们作雅威的祭司[b]。
  to: 原来，利未人离开了他们的城郊草场[a]和地产，前往犹大和耶路撒冷；因为耶罗波安和他的儿子们排斥他们，不准他们担任事奉雅威的祭司[b]。
  rationale: 修订以“原来”对应承接上文的首个 כִּי，并以“因为”对应说明离开原因的第二个 כִּי，消除中文重复因果和不自然断裂。将“产业”改为“地产”以明确土地持有，将祭司短语调整为“担任事奉雅威的祭司”，但不增添关于职分撤销程序的解释。脚注标记均保留并紧邻所注词语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:50Z'
review_pass:
  verdict: revise
  source_fidelity: 正文基本准确传达了利未人离开其所属土地、前往犹大和耶路撒冷，以及耶罗波安父子禁止其向雅威担任祭司的因果关系。惟“产业”在现代汉语中较易指行业或家业，未能明确原文所指的土地持有；“作雅威的祭司”也可更明确地表达“事奉雅威的祭司职分”。
  naturalness: “因为……；这是因为……”在同一句中重复设置两层因果，且分号造成不自然的断裂。以“原来”承接上文的解释，并以“因为”引出本节内部原因，更合现代汉语叙事习惯，也保留原文两个 כִּי 的不同功能。
  terminology: “雅威”准确对应 יהוה，宜保留。“城郊草场”可表达附属城邑的开阔牧放地；将“产业”改为“地产”可更准确自然地表达 אֲחֻזָּה 的土地持有含义。
