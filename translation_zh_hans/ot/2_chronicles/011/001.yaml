  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: zh_hans
  text: 罗波安来到耶路撒冷，就召集犹大和便雅悯的家族[a]，共十八万名精锐战士[b]，要同以色列交战，使王国重新归属罗波安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“犹大和便雅悯的家”；这是对由这两个支派构成的南方群体的称呼。
    reason: 说明希伯来语“家”的群体性、政治性称谓，并保留其字面表达。
  - marker: b
    text: 或译“十八万名经挑选、能征战的人”。
    reason: 保留בָּחוּר与עֹשֵׂה מִלְחָמָה较为直译的表达。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא在以耶路撒冷为目的地的叙事中表示来到或进入；“来到”符合现代汉语叙事习惯。
- source_word: וַיַּקְהֵל
  choice: 召集
  rationale: קהל的使役式在这里指把人员聚集、征召起来，军事语境中的“召集”自然准确。
- source_word: אֶת־בֵּית יְהוּדָה וּבִנְיָמִן
  choice: 犹大家和便雅悯家
  rationale: בֵּית与支派名称连用，表示家族、支派或政治共同体；保留“家”可传达原文的群体称谓。
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 十八万名
  rationale: 按现代汉语数字表达直接译出，并以“名”衔接人员名词。
- source_word: בָּחוּר
  choice: 精锐
  rationale: 该词在军事语境中可指经过挑选的精壮人员；“精锐”简洁传达被选拔、适合作战的含义。
- source_word: עֹשֵׂה מִלְחָמָה
  choice: 战士
  rationale: 字面为“从事战争的”，在此修饰被召集的人；译作“战士”符合汉语军事实境。
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: 去攻打以色列
  rationale: עִם本义可为“与”，但在交战语境中表示以色列是敌对方；“攻打”清楚表达这一关系。
- source_word: לְהָשִׁיב אֶת־הַמַּמְלָכָה לִרְחַבְעָם
  choice: 要使王国重新归属罗波安
  rationale: שוב的使役式表示使某物返回；此处是使王国重新归给罗波安。“重新归属”保留恢复原有统治权的政治含义。
theological_decisions:
- issue: 王国分裂后“以色列”的所指
  choice: 正文保留“以色列”
  alternative: 北方各支派；反叛的以色列人
  rationale: 原文直接称敌对政体为“以色列”。保留这一名称可反映《历代志》的用语，并避免加入带有评判性的解释。
- issue: “王国归属罗波安”的含义
  choice: 译为使王国重新归属罗波安
  alternative: 恢复罗波安的王权；为罗波安夺回王国
  rationale: מַמְלָכָה可指王国、王权或统治领域。正文采用较宽泛的“王国”，不把含义限定为抽象王权，也不额外强化军事夺取的语气。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“犹大家和便雅悯家”有意保留原文的共同体称谓，并以脚注说明；句末保留“罗波安”的重复，以对应原文而不改成代词。
