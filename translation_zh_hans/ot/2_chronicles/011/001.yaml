  to: 罗波安来到耶路撒冷，就召集犹大和便雅悯的家族[a]，共十八万名精锐战士[b]，要同以色列交战，使王国重新归属罗波安。
  rationale: 将军事行动改为“同以色列交战”，避免“攻打”可能附加的主动进攻意味；将“犹大家和便雅悯家”调整为更自然且较少歧义的现代汉语表达，并在脚注中保留原文“家”的字面及其群体称谓功能。其余措辞忠实且自然，予以保留。
