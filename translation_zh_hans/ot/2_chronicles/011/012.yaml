base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: zh_hans
  text: 他在各城[a]中安置盾牌和长矛，使这些城极为坚固；犹大和便雅悯都归属他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文重复“城”字，直译为“在每一城和城中”，强调每一座城，无一例外。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/כָל עִיר וָ/עִיר
  choice: 在各城中
  rationale: 希伯来文逐字为“在每一城和城中”，用名词重复构成分配式表达，强调每一座城。现代汉语以“各城”自然传达此意，并以脚注说明原文形式。
- source_word: צִנּוֹת
  choice: 盾牌
  rationale: צִנּוֹת 指军用盾牌，可能尤指较大的盾；正文采用清楚而不过度限定的现代通称“盾牌”。
- source_word: וּ/רְמָחִים
  choice: 和长矛
  rationale: רְמָחִים 是长柄刺击武器的常用词，“长矛”在现代汉语中准确、自然。
- source_word: וַֽ/יְחַזְּקֵם
  choice: 使这些城极为坚固
  rationale: חזק 的复数宾语后缀回指前文各城；译出“这些城”可消除汉语代词指向含混，同时保留“使之强固”的基本意义。
- source_word: לְ/הַרְבֵּה מְאֹד
  choice: 极为
  rationale: 该结构强烈加强 חזק 的程度；“极为”简洁而充分地表达“非常、大大地”的强调。
- source_word: וַ/יְהִי ל֖/וֹ יְהוּדָה וּ/בִנְיָמִן
  choice: 犹大和便雅悯都归属他
  rationale: ויהי לו 可表达所有、掌控或效忠关系。“归属他”保留这种范围，不把原文过窄地解释为领土所有权或单纯政治统治。
theological_decisions:
- issue: “犹大和便雅悯归属他”所表达的关系
  choice: 归属他
  alternative: 归他管辖／是他的
  rationale: 原文的 לו 是宽泛的所属结构，语境可涉及疆域、支派及政治效忠。“归属他”保留这种张力，避免加入原文未明说的特定政治或神学解释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“各城”自然表达希伯来语分配式重复，并在脚注中保留其形式与强调；“这些城”明确复数宾语所指；分号保留末句总结性的转折层次。
