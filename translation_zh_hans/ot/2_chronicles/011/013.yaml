  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: zh_hans
  text: 分布在全以色列的祭司和利未人，都从他们各处的地区站在他一边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来到他面前”或“站在他面前”。希伯来语这一表达可指实际来到罗波安面前，也可指选择支持他；上下文较倾向后者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司和利未人，也
  rationale: 保留两个带定冠词的并列群体；“也”自然承接上文叙事中的新增支持者。
- source_word: אֲשֶׁר בְּכָל יִשְׂרָאֵל
  choice: 在全以色列的
  rationale: 简洁表达这些祭司和利未人分布于以色列全境，而非只在犹大。
- source_word: הִתְיַצְּבוּ עָלָיו
  choice: 前来，站在他一边
  rationale: התיצב 可指现身、站立或采取立场；结合 עליו 与上下文，此处既有来到罗波安面前的行动，也含支持他的意味。“站在他一边”保留主动表态和效忠的语感。
- source_word: מִכָּל גְּבוּלָם
  choice: 从他们各自的境内
  rationale: גְּבוּל 在此指各群体所在的疆域或地区，而非单指边界；“各自的境内”也能自然表达复数领地的分布。
theological_decisions:
- issue: הִתְיַצְּבוּ עָלָיו 所表达的是物理上的来到面前，还是政治与宗教上的支持
  choice: 正文译作“前来，站在他一边”
  alternative: “到他面前”或“站在他面前”
  rationale: 上下文偏向他们选择支持罗波安，但希伯来语习语仍容许“来到或站在他面前”的空间意义，因此以脚注保留歧义，不把效忠含义绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在全以色列的”避免生硬的“遍及全以色列者”；“境内”比“边界”更准确地表达居住地区。正文保留脚注标记[a]。
