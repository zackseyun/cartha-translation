    issue: 脚注的“直译近似”未准确反映希伯来文中各个“儿子／女儿”形式所紧随的人名。
    rationale: 原脚注写成“玛哈拉，耶利摩的儿子，大卫的儿子；亚比孩，以利押的女儿，耶西的儿子”，容易被读为耶利摩是玛哈拉的儿子、以利押是亚比孩的女儿，反而混淆原文实际的压缩排列。应明确说明：马所拉文本在玛哈拉后接阳性“儿子”，在亚比孩后接阴性“女儿”，而耶利摩和以利押后也各接阳性“儿子”。
