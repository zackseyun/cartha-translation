base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: zh_hans
  text: 罗波安娶了玛哈拉为妻；她是大卫之子耶利摩的女儿，也是耶西之子以利押的女儿亚比孩所生。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的家谱表达十分简略，且性别形式异常。按字面次序，文本在“玛哈拉”后接阳性的“儿子”，在“耶利摩”后接“儿子（大卫）”；又列“亚比孩”，其后接阴性的“女儿”，在“以利押”后接“儿子（耶西）”。这里很可能是说，玛哈拉的父亲是大卫之子耶利摩，母亲是耶西之子以利押的女儿亚比孩。也有人把亚比孩视为家谱中的另一种同位说明，或较少数地认为她是罗波安所娶的另一位妻子。
    reason: 保留马所拉文本中性别形式和句法关系的异常，并说明主要理解及其他可能读法。
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: 娶了……为妻
  rationale: 准确表达希伯来语“为自己取一个女子/妻子”的婚姻用语，同时符合现代汉语习惯。
- source_word: מָחֲלַת
  choice: 玛哈拉
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: בן יְרִימוֹת בֶּן דָּוִיד
  choice: 大卫之子耶利摩的女儿
  rationale: 马所拉文本在玛哈拉与耶利摩之间写作阳性的“儿子”，语法关系异常；结合全句的家谱结构，以“女儿”表达最可能的亲属关系，并以脚注保留原文疑难。
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  choice: 耶西之子以利押的女儿亚比孩所生
  rationale: 将亚比孩理解为玛哈拉的母亲，使父系和母系家谱都得到交代；“所生”自然地显明其母女关系。
theological_decisions:
- issue: 本节各人名之间的句法和家谱关系
  choice: 本节只提到一位妻子玛哈拉；她的父亲是大卫之子耶利摩，母亲是耶西之子以利押的女儿亚比孩。
  alternative: 亚比孩是玛哈拉的另一个名字或家谱中的另一项说明；或本节提到玛哈拉和亚比孩两位妻子。
  rationale: 开头的“妻子”为单数，而上下文最连贯的理解是借父母双方说明玛哈拉的血统。不过希伯来文本高度压缩且语法异常，因此不把其他解释从脚注中排除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“娶了……为妻”保留原文婚姻表达；正文清楚呈现最可能的家谱关系，脚注则保留原文真正的歧义。
