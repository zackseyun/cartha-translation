  text: וְ/שָׂרָ֞י/ו לִ/נְדָבָ֥ה לָ/עָ֛ם לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם הֵרִ֑ימוּ חִלְקִיָּ֨ה וּ/זְכַרְיָ֜הוּ וִֽ/יחִיאֵ֗ל נְגִידֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים לַ/כֹּהֲנִ֞ים נָתְנ֣וּ לַ/פְּסָחִ֗ים אַלְפַּ֨יִם֙ וְ/שֵׁ֣שׁ מֵא֔וֹת וּ/בָקָ֖ר שְׁלֹ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: zh_hans
  text: 他的众首领也甘心捐献，供百姓、祭司和利未人使用。上帝的殿的主管希勒家、撒迦利亚和耶歇给祭司两千六百只逾越节祭牲[a]，另有三百头牛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逾越节祭牲”原文为复数，意为“为逾越节（祭）”；这里指为守逾越节预备的祭牲。原文没有明说这两千六百只的具体畜种。
    reason: lexical_and_ellipsis_clarification
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: 他的众首领
  rationale: שָׂרִים可指有权位的首领或官员；本节是圣殿与节期筹备的语境，“首领”既保留身份地位，也符合现代中文。
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: 也甘心捐献
  rationale: נְדָבָה表示出于自愿的礼物或奉献，הרים在此表示拿出、捐出；合译为“甘心捐献”自然地表达自愿贡献之意。
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: 供百姓、祭司和利未人使用
  rationale: 重复的ל־标明受益对象；“供……使用”自然表达这些捐献是为各群体预备的。
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: 上帝殿的主管
  rationale: נָגִיד可指首领、负责人或主管；此处三人在圣殿中负有领导职责，“主管”贴合行政语境，“上帝殿”保留原文称谓。
- source_word: לַפְּסָחִים אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 两千六百只逾越节祭牲
  rationale: לַפְּסָחִים字面为复数的“为逾越节之物/逾越节祭牲”；数字要求有可数对象，语境表明所指是用于逾越节献祭的牲畜。中文以“只”表达原文省略而由上下文可知的牲畜。
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: 另有三百头牛
  rationale: בָּקָר是牛群或牛类的集合名词；“三百头牛”准确而自然。“另有”清楚区分这批牛与前述逾越节祭牲。
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: 希勒家、撒迦利亚和耶歇
  rationale: 采用现代中文圣经人名的通行音译形式。
theological_decisions:
- issue: לַפְּסָחִים所指的对象
  choice: 在正文译为“逾越节祭牲”，并用脚注说明原文表达
  alternative: 译为“为逾越节献上两千六百”，不补出受数点的对象
  rationale: 上下文明确涉及为逾越节预备牲畜，而希伯来文没有在数字后重述牲畜类别。正文补出“祭牲”使中文完整，脚注则保留原文复数形式及其可能侧重于用途的特点，避免把具体畜种强加给文本。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“甘心捐献”体现自愿奉献的具体行动；“主管”避免过度宫廷化；数字用中文书写以配合经文体例。
