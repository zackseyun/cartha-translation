  text: וְ/לֹֽא הֵסֵב֩ יֹאשִׁיָּ֨הוּ פָנָ֜י/ו מִמֶּ֗/נּוּ כִּ֤י לְ/הִלָּחֵֽם בּ/וֹ֙ הִתְחַפֵּ֔שׂ וְ/לֹ֥א שָׁמַ֛ע אֶל דִּבְרֵ֥י נְכ֖וֹ מִ/פִּ֣י אֱלֹהִ֑ים וַ/יָּבֹ֕א לְ/הִלָּחֵ֖ם בְּ/בִקְעַ֥ת מְגִדּֽוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: zh_hans
  text: 然而，约西亚没有转脸避开他[a]，反而乔装起来，要与他交战。他不听尼哥那些出自上帝之口的话[b]，来到米吉多谷[c]交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有离开他”。
    reason: lexical_alternative
  - marker: b
    text: “出自上帝之口”是希伯来文的字面表达，表明这些话源于上帝。
    reason: lexical_alternative
  - marker: c
    text: 或译“米吉多平原”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: 没有转脸离开他
  rationale: 保留“转脸”的希伯来语意象，同时在现代汉语中自然易懂；脚注列出较简洁的译法。
- source_word: כִּי
  choice: 反而
  rationale: 此处承接前面的否定，说明约西亚没有避开尼哥，反倒乔装出战；“反而”能自然表达这一转折说明关系。
- source_word: לְהִלָּחֵם בּוֹ
  choice: 要与他交战
  rationale: 不定式表达目的；结合军事语境，בּוֹ指以尼哥为交战对象。
- source_word: הִתְחַפֵּשׂ
  choice: 乔装起来
  rationale: 该反身动词表示改变外表、隐藏身份；“乔装起来”准确而符合现代汉语表达。
- source_word: שָׁמַע אֶל
  choice: 听
  rationale: 保留“听从／听取”的宽泛语义，不径直强化为“服从”，让上下文体现其拒绝的严重性。
- source_word: דִּבְרֵי נְכוֹ
  choice: 尼哥那些……话
  rationale: 直译为尼哥的“话”，不将其解释性地改写为“信息”或“命令”。
- source_word: מִפִּי אֱלֹהִים
  choice: 出自上帝之口
  rationale: 保留希伯来文“从上帝口中”的具体意象，并清楚呈现历代志作者对这些话之神圣来源的陈述。
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 按בוא的基本意义译出叙事动作，并与地点短语自然衔接。
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: 在米吉多谷
  rationale: בִּקְעָה可指宽阔的谷地或平原；“谷”简洁地保留其主要地貌含义，脚注注明另一可能译法。
theological_decisions:
- issue: 尼哥的话是否被经文表述为真正源于上帝
  choice: 正文译作“尼哥那些出自上帝之口的话”
  alternative: 可较宽泛地译作“尼哥从上帝那里得来的话”，或将此理解为尼哥单方面的宣称
  rationale: 本节叙述者直接把这些话说成“出自上帝之口”；译文保留这一断言及其引发的神学张力，不替读者质疑或弱化它，也不额外说明启示的具体方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“转脸离开”“出自上帝之口”保留原文意象；“乔装起来”“与他交战”则避免生硬直译。所有代词均依上下文指向法老尼哥。
