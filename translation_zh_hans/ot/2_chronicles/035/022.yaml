  to: 然而，约西亚没有转脸避开他[a]，反而乔装起来，要与他交战。他不听尼哥那些出自上帝之口的话[b]，来到米吉多谷[c]交战。
  rationale: 修订仅改善现代汉语的清晰度，并使末句不重复补出原文未明示的宾语。“转脸避开”保留原文的面部意象和转离、回避之意；“出自上帝之口”及其脚注维持经文对尼哥之话的神圣来源所作的陈述，不化解其神学张力。
