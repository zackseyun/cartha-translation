  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: zh_hans
  text: 弓箭手向约西亚王射箭，王对臣仆说：“带我离开，因为我受了重伤。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּרוּ
  choice: 射中了
  rationale: ירה的使役形在军事语境中指射击；结合目标标记及后文所述伤势，“射中了”比单纯“射向”更符合叙事结果。
- source_word: הַיֹּרִים
  choice: 弓箭手
  rationale: 该分词字面意为“射手”；在古代战场语境中，自然地指弓箭手。
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: 约西亚王
  rationale: 介词ל在此标示射击的目标，现代汉语用“射中了约西亚王”自然表达。
- source_word: הַעֲבִירוּנִי
  choice: 把我带离这里
  rationale: עבר的使役形意为使某人移开或经过；这里是王命臣仆将他撤离当前战场，“带离这里”自然且不额外断定搬运方式。
- source_word: כִּי
  choice: 因为
  rationale: 引出要求被带走的原因，直引中用“因为”清楚自然。
- source_word: הָחֳלֵיתִי
  choice: 我受了重伤
  rationale: חלה可泛指患病、衰弱或受创；紧接中箭的战场语境，译作“受伤”最合适，同时由מְאֹד表达严重程度。
- source_word: מְאֹד
  choice: 重
  rationale: 作为程度强化词，与“受伤”搭配成“受了重伤”，符合现代汉语且保持庄重。
