    issue: “百姓子弟”在现代汉语中有年龄或后辈的常用含义。
    rationale: 希伯来语“百姓之子”在本节是与利未人相对的群体称谓，并非指年轻人；该译法可能造成不必要的语义偏移。
  - severity: low
    issue: “利未人父家”领属关系略显紧缩。
    rationale: “利未人的父家”更清楚自然，且同样保留原文中利未人与父家班次的关系。
  revised_text: 你们要站在圣所中，按照你们弟兄——就是百姓中的人——各父家的班次，也按照利未人的父家班次。
  revised_footnotes:
  - marker: a
    text: “百姓中的人”原文直译为“百姓之子”；这里指有别于利未人的以色列百姓，也可译作“平民”。
    reason: 说明原文的字面表达及其在本节中区别非利未以色列人与利未人的语境功能，避免正文中“百姓子弟”可能带来的年龄含义。
