base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: zh_hans
  text: 你们要站在圣所中，按照你们弟兄——就是百姓中的人——各父家的班次，也按照利未人的父家班次。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: 你们要站
  rationale: 这是עמד的复数祈使式，直接吩咐利未人站定；“要站”符合现代汉语命令语气。句首连接词在汉语中不必机械译出，其承接作用由上下文自然体现。
- source_word: בַקֹּדֶשׁ
  choice: 在圣所里
  rationale: 介词与定冠词表明具体地点，指神圣的礼仪区域；“圣所”既保留宗教语境，也不过度限定为某一房间。
- source_word: לִפְלֻגּוֹת / וַחֲלֻקַּת
  choice: 按照……班次，也按照……班次
  rationale: 两个同源名词都表示有组织的分组或班次。译文用平行结构传达双方按所属群体列班站立的意思，同时不进一步解释各班之间的具体对应方式。
- source_word: בֵּית הָאָבוֹת / בֵּית אָב
  choice: 各父家 / 父家
  rationale: 这是以父系祖先为单位的宗族家庭组织。“父家”是简洁而庄重的圣经用语；前一处结合复数分组译作“各父家”，后一处保留代表性单数的形式。
- source_word: לַאֲחֵיכֶם
  choice: 你们弟兄
  rationale: 保留原文的亲属称谓，指受命利未人的以色列同胞，也维持以色列群体的家族性表达。
- source_word: בְּנֵי הָעָם
  choice: 百姓子弟
  rationale: 贴近字面“百姓之子”，并在中文中保留男性家族用语；此处与利未人相对，具体所指在脚注中说明。
- source_word: לַלְוִיִּם
  choice: 利未人
  rationale: 明确第二组父家班次属于利未人；汉语用领属结构“利未人父家的班次”自然表达原文关系。
theological_decisions:
- issue: 亲属称谓及百姓群体的性别化表达
  choice: 正文保留“弟兄”和“百姓子弟”
  alternative: 译作“以色列同胞”或“平民”
  rationale: 原文采用男性亲属和家族用语，并以此呈现以色列的宗族结构。保留这些表达可避免抹平原文形式；同时用脚注解释这里与利未人相对的语境功能。
- issue: 百姓父家班次与利未父家班次之间的关系
  choice: 用两个并列的“按照……班次”保留原文的协调结构
  alternative: 解释为每个百姓班次配若干利未人，或两组一一对应
  rationale: 原文语法表明两类班次并列，却没有明确说明其配属比例或是否一一对应；译文不替原文消除这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“圣所”“父家”“班次”符合历代志礼仪与宗族组织的语境；破折号标明“百姓子弟”是对“你们弟兄”的同位说明。
