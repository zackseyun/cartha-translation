revisions:
- from: 你们要站在圣所里，按照你们弟兄——百姓子弟[a]——各父家的班次，也按照利未人父家的班次。
  to: 你们要站在圣所中，按照你们弟兄——就是百姓中的人——各父家的班次，也按照利未人的父家班次。
  rationale: 以“百姓中的人”替换“百姓子弟”，消除现代汉语中“子弟”常指年轻后辈的歧义；通过脚注保留原文“百姓之子”的字面信息。调整为“利未人的父家班次”，使领属关系更清晰。两个“按照”继续保留原文两项组织单位并列的结构，未擅自说明二者的具体配属关系。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:51Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确呈现了命令、圣所、按父家组织的班次，以及百姓与利未人两类群体的并列关系。不过“百姓子弟”在现代汉语中通常指百姓家的年轻人或后辈，容易引入原文没有的年龄含义；“利未人父家”也可更清楚地表达为“利未人的父家”。
  naturalness: “你们弟兄——百姓子弟——各父家的班次”以破折号嵌入同位语，句法负担较重，且“百姓子弟”不够自然。改为“你们的弟兄，就是百姓中的人”更符合现代庄重书面语；脚注保留“百姓之子”的字面形式及其群体区分功能。
  terminology: “圣所”“父家”“班次”“利未人”均适合本段礼仪和宗族组织语境。“百姓中的人”在正文传达此处非利未以色列人的语境所指，不将“百姓之子”误解为特定年龄层；脚注说明字面表达。
  issues:
