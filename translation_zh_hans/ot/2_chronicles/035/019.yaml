  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: zh_hans
  text: 约西亚执政第十八年，举行了这次逾越节。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“守了这次逾越节”；直译：“行了这次逾越节”。
    reason: 保留 נַעֲשָׂה 在此处可按惯用意义或较字面意义理解的翻译层次。
lexical_decisions:
- source_word: בִּשְׁמוֹנֶה עֶשְׂרֵה שָׁנָה לְמַלְכוּת יֹאשִׁיָּהוּ
  choice: 约西亚执政第十八年
  rationale: 这是王朝纪年的惯用表达。“执政第十八年”既准确表达约西亚作王的年期，也符合现代汉语习惯。
- source_word: נַעֲשָׂה
  choice: 举行了
  rationale: 该动词本义为“做、行”，与“逾越节”连用时表示守节或举行节期。“举行了”自然、庄重，同时保留被动式所表达的事件焦点。
- source_word: הַפֶּסַח
  choice: 逾越节
  rationale: 采用现代中文圣经语境中通行且准确的专名。
- source_word: הַזֶּה
  choice: 这次
  rationale: 指向上文刚刚详述的那一次逾越节；汉语以“这次”比单说“这个”更自然。
