    issue: “燔祭的部分”无原文根据地加入“部分”。
    rationale: הָעֹלָה 指燔祭，虽可具集合意义，但经文并未说“燔祭的部分”。本节的分配与随后“献给雅威”表明可译为“燔祭牲”，避免错误限定为已经分切的部分。
  - severity: low
    issue: “按父家的班次”可能将父家分组误读为值班轮次。
    rationale: לְמִפְלַגּוֹת לְבֵית־אָבוֹת 所指为父家单位的分组／组别；“按父家分组”较明确且自然。
