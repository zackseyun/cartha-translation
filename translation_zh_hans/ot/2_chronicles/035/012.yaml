source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: zh_hans
  text: 他们把燔祭牲取出来，按父家分组分给百姓[a]，使他们照《摩西书》所写的献给雅威；牛也照样办理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“百姓的众子”，是按宗族说的一种称呼，指一般百姓，有别于祭司和利未人。
    reason: 说明希伯来语的字面形式、代表性用法及其社会宗教语境。
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: 取出来
  rationale: 使役词形在此表示把祭物从原处取出；结合献祭准备和分配的语境，“取出来”自然且不额外限定具体操作。
- source_word: הָעֹלָה
  choice: 燔祭的部分
  rationale: עֹלָה虽为单数形式，在此可作集合意义；上下文似指从逾越节祭牲中划出的燔祭部分，因此用“燔祭的部分”既保留祭祀术语，也避免让人误以为是另一些完整祭牲。
- source_word: לְתִתָּם
  choice: 分给
  rationale: 字面为“为要把它们给……”。汉语结合后续受领者，用“分给”自然表达分配目的。
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: 按父家的班次
  rationale: מִפְלַגּוֹת指分组或班次，בֵית אָבוֹת是以父系祖家为单位的社会组织；“按父家的班次”保留行政与宗族层面的结构。
- source_word: לִבְנֵי הָעָם
  choice: 给百姓
  rationale: 字面为“给百姓的众子”，在此是按宗族划分的一般民众，与祭司、利未人相区别；现代汉语直译“百姓的儿子们”容易误解，故正文采用自然的代表性表达，并以脚注说明。
- source_word: לְהַקְרִיב לַיהוָה
  choice: 让他们……献给雅威
  rationale: הקריב在祭祀语境中指呈献或献上；补出汉语所需的主语“他们”，而不改变其所指仍可能依语境理解。神名按希伯来文专名译作“雅威”。
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: 照《摩西书》上所写的
  rationale: 保留诉诸摩西书面律法的公式；书名号符合现代汉语出版习惯。
- source_word: וְכֵן לַבָּקָר
  choice: 牛也照样处理
  rationale: 原文简略地把同样程序延伸到牛；补出“处理”使汉语成句，同时不具体化未明说的操作细节。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留其专名性质。
- issue: לִבְנֵי הָעָם 的性别与群体含义
  choice: 百姓
  alternative: 百姓的众子／平民
  rationale: 该短语字面带阳性复数，但在这里代表按父家编组的一般民众。译作“百姓”符合现代汉语的集合表达；脚注保留字面形式及其与祭司、利未人的区分作用。
- issue: לְהַקְרִיב 的隐含主语
  choice: 让他们……献给
  alternative: 为要献给
  rationale: 希伯来文不明说谁执行呈献；上下文最自然地指领受祭物的百姓。正文用“他们”使汉语清楚，但不进一步界定献祭礼仪中的角色。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“父家”“班次”“燔祭”保留必要的古代以色列制度和祭祀术语；句法适度汉语化，同时保留末句的简略承接。
