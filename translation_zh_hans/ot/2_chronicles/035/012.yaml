  to: 他们把燔祭牲取出来，按父家分组分给百姓[a]，使他们照《摩西书》所写的献给雅威；牛也照样办理。
  rationale: 修订删除原文未明说的“部分”，以“燔祭牲”表达集合性的燔祭对象；将“班次”改为“分组”，更准确反映父家作为分配单位的组织结构。其余语序、神名译法、祭祀术语及脚注均予保留。
