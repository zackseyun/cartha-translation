  source_fidelity: “燔祭的部分”把原文集合性的 הָעֹלָה 误限为“部分”；原文所说是被取出并分配、供献给雅威的燔祭牲／燔祭。其余主要结构——按父家编组分配给一般百姓、依摩西书所载献祭，以及牛亦同样办理——基本得到保留。
  naturalness: 原译整体通顺、庄重。“按父家的班次”可以理解，但“班次”较容易联想到祭司或利未人的值班轮次；这里宜明示为按父家所分的组别。“牛也照样处理”自然，但“办理”更贴近经文体且不使操作现代化。
  terminology: “燔祭”“父家”“雅威”均可采用。“燔祭牲”既保留祭祀术语，也避免把 הָעֹלָה 译为不明所指的抽象“燔祭”或无根据的“部分”。脚注准确说明 לִבְנֵי הָעָם 的字面形式及其社会语境。
  issues:
