revisions:
- from: 这样，在那一天，雅威的一切敬拜事务都安排妥当了，为要守逾越节，并照约西亚王的命令，在雅威的祭坛上献燔祭。
  to: 于是，在那一天，为守逾越节并在雅威的祭坛上献燔祭，雅威的一切事奉都照约西亚王的命令预备妥当了。
