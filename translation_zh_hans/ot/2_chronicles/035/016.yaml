  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: zh_hans
  text: 于是，在那一天，为守逾越节并在雅威的祭坛上献燔祭，雅威的一切事奉都照约西亚王的命令预备妥当了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: 都安排妥当了
  rationale: 该词为כון的尼法勒式，表达相关事务被设立、整顿而达到预备就绪的状态；“安排妥当了”兼顾被动结果和现代汉语的自然表达。
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: 雅威的一切敬拜事务
  rationale: עֲבוֹדָה在此处指圣殿礼仪和献祭方面的事奉或工作。“敬拜事务”保留礼仪语境，又不将范围缩限为祭司个人的服事。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，而不以称号替代。
- source_word: בַּיּוֹם הַהוּא
  choice: 在那一天
  rationale: 直接保留时间短语及指示词的强调。
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: 为要守逾越节
  rationale: 直译“做逾越节”是希伯来语礼仪惯用语，意思是遵守、举行逾越节；“守逾越节”是准确而自然的汉语表达。
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: 并……献燔祭
  rationale: עלה的使役式与עֹלוֹת连用，是将燔祭献上的标准献祭表达；“献燔祭”简明准确。
- source_word: עַל מִזְבַּח יְהוָה
  choice: 在雅威的祭坛上
  rationale: 保留祭物被献在祭坛上的地点关系，以及祭坛与雅威的所属或关联关系。
- source_word: כְּמִצְוַת
  choice: 照……的命令
  rationale: מִצְוָה在这里指约西亚王所下的具体指令，译作“命令”比泛指律法条文的“诫命”更贴合上下文。
- source_word: הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: 约西亚王
  rationale: 按现代汉语习惯，将王的称号置于人名之后。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文两次直接使用四字神名。采用“雅威”作为较贴近学界通行重构读音的中文音译，以专名呈现，不用“主”这一称号替代；同时不把有争议的元音重构说成绝对确定。
- issue: עֲבוֹדַת יְהוָה所指范围
  choice: 雅威的一切敬拜事务
  alternative: 雅威的一切事奉；雅威的一切工作
  rationale: 上下文涉及逾越节礼仪和燔祭，具有明确的圣殿敬拜色彩；“敬拜事务”既体现礼仪语境，也避免把它限定为某一种职分。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“这样”承接叙事结果；句子按汉语信息结构调整语序，把“照约西亚王的命令”置于献祭动作之前，同时不改变其对当日礼仪安排和执行的统摄关系。
