  text: וַ/יְקוֹנֵ֣ן יִרְמְיָהוּ֮ עַל יֹאשִׁיָּהוּ֒ וַ/יֹּאמְר֣וּ כָֽל הַ/שָּׁרִ֣ים וְ֠/הַ/שָּׁרוֹת בְּ/קִינ֨וֹתֵי/הֶ֤ם עַל יֹאשִׁיָּ֨הוּ֙ עַד הַ/יּ֔וֹם וַ/יִּתְּנ֥וּ/ם לְ/חֹ֖ק עַל יִשְׂרָאֵ֑ל וְ/הִנָּ֥/ם כְּתוּבִ֖ים עַל הַ/קִּינֽוֹת־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: zh_hans
  text: 耶利米为约西亚唱哀歌；所有男歌者和女歌者直到今日仍在哀歌中吟唱约西亚。他们把这些哀歌定为以色列的定例。看哪，这些哀歌都载于《哀歌集》[a]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“载于哀歌中”；这里可能泛指哀歌，而不是一部名为《哀歌集》的特定文集。
    reason: 保留 הַקִּינוֹת 是特定文集名称还是一般类别的歧义。
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: 作了哀歌
  rationale: קונן表示为死者作出或吟唱哀歌。“作了哀歌”保留其哀悼性质，同时不过度限定耶利米究竟是创作还是吟唱。
- source_word: עַל יֹאשִׁיָּהוּ
  choice: 为约西亚
  rationale: 在哀悼语境中，עַל指哀悼的对象；现代汉语以“为约西亚作哀歌”自然明确。
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: 男歌唱者和女歌唱者
  rationale: 两个分词分别为阳性和阴性，指歌唱者而非官长；译文明确保留原文的性别区分。
- source_word: וַיֹּאמְרוּ ... עַד הַיּוֹם
  choice: 直到今日仍……咏唱
  rationale: אמר字面为“说”，但主语是歌唱者，内容又在哀歌中，因此译作“咏唱”符合语境；“仍”表达“直到今日”所显示的持续惯例。
- source_word: בְּקִינוֹתֵיהֶם
  choice: 在他们的哀歌中
  rationale: קִינוֹת指为死者所作的哀歌；此译清楚、自然，并保留复数意义。
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: 他们把这些哀歌定为以色列的常例
  rationale: חֹק可指固定条例或规定下来的惯例。此处与歌唱哀歌的实践有关，“常例”比法律意味较强的“律例”更合语境；עַל יִשְׂרָאֵל表达该惯例适用于以色列。
- source_word: וְהִנָּם
  choice: 看哪，这些歌都
  rationale: “看哪”保留הִנֵּה引人注意的语用力量；“这些歌”承接前文哀歌，使汉语指代清楚。
- source_word: כְּתוּבִים עַל הַקִּינוֹת
  choice: 记在《哀歌集》中
  rationale: 该短语可能指一部已知的哀歌文集，因此正文采用书名式译法《哀歌集》；泛指“哀歌”的可能性以脚注保留。
theological_decisions:
- issue: הַקִּינוֹת是特定文集还是泛指哀歌
  choice: 正文译为《哀歌集》，视为一部特定文集
  alternative: “记在哀歌中”，泛指哀歌作品
  rationale: 定冠词可能指向当时已知的哀歌汇集，但不能据此断定它就是正典《耶利米哀歌》。正文采用中性的《哀歌集》，并以脚注保留泛指读法，避免作教派性或正典身份上的推断。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“看哪”保留历代志叙事的正式语气；“咏唱”兼顾歌唱者的身份与אמר的语境含义。正文不把《哀歌集》等同于正典《耶利米哀歌》。
