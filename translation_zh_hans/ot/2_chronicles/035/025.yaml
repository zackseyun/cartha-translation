  terminology: “哀歌”“定例”准确且保持庄重叙事语体。“《哀歌集》”可作为正文中对特定文集的暂定处理，但不应与正典《耶利米哀歌》混同；脚注已恰当地保留其可能泛指哀歌的歧义。
