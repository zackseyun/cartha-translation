revisions:
- from: 耶利米为约西亚作了哀歌；所有男歌唱者和女歌唱者直到今日仍在他们的哀歌中咏唱约西亚。他们把这些哀歌定为以色列的常例。看哪，这些歌都记在《哀歌集》[a]中。
  to: 耶利米为约西亚唱哀歌；所有男歌者和女歌者直到今日仍在哀歌中吟唱约西亚。他们把这些哀歌定为以色列的定例。看哪，这些哀歌都载于《哀歌集》[a]中。
  rationale: 修订避免把耶利米的哀悼行为限定为文学创作，改善现代汉语搭配，并将末句的代词明确回指前文的哀歌。保留《哀歌集》这一非正典化、暂定的正文处理及其脚注中的替代理解。
