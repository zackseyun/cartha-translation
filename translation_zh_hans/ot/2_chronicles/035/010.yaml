base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: zh_hans
  text: 这样，敬拜的事奉就预备好了[a]。祭司各就各位[b]，利未人按各自的班次就位[c]，遵照王的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬拜的事奉已安排妥当了”“敬拜的事奉已就绪了”或“敬拜的事奉已设立好了”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在他们站立的位置上”；指各自被指定的位置。
    reason: lexical_alternative
  - marker: c
    text: 或译：“按照各自的班次”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: 安排妥当了
  rationale: 该词在此表示被设立、整顿或预备就绪；结合逾越节礼仪的语境，“安排妥当了”自然表达一切已经就绪，同时保留“整顿有序”的含义。
- source_word: הָעֲבוֹדָה
  choice: 礼仪
  rationale: 在圣殿和献祭语境中，עֲבוֹדָה 指敬拜方面的事奉或礼仪事务。“礼仪”简明地传达本节所说的宗教仪式，不采用容易泛指一般劳动的“工作”。
- source_word: וַיַּעַמְדוּ
  choice: 站在／站好
  rationale: עמד 的基本义是“站立”或“就位”。祭司句采用“站在”，利未人句依汉语省略所需而补出“站好”，使并列关系清楚。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 祭祀语境中的标准译名。
- source_word: עַל עָמְדָם
  choice: 在各自的岗位上
  rationale: 原文直指他们站立或被指定的位置；“各自的岗位”以现代汉语准确表达指定的礼仪位置。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 该群体名称的标准汉语译法。
- source_word: עַל מַחְלְקוֹתָם
  choice: 按各自的班次
  rationale: מַחְלְקוֹת 指有组织的分班或班次，尤其用于祭司和利未人的编组。“按各自的班次”兼顾组织方式与自然汉语。
- source_word: כְּמִצְוַת
  choice: 遵照……的命令
  rationale: 这里指王所发的具体指令；“遵照……的命令”比“诫命”更符合王命语境。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 按上下文指当时的君王；汉语圣经叙事中简洁译作“王”自然庄重。
theological_decisions:
- issue: עֲבוֹדָה 的圣殿敬拜含义
  choice: 礼仪
  alternative: 事奉；礼仪事务；工作
  rationale: 上下文描述逾越节献祭程序，因此采用敬拜语境明确的词，但不引入后世特定宗派的礼拜制度概念。
- issue: 祭司与利未人的组织性就位
  choice: 祭司站在各自的岗位上，利未人也按各自的班次站好
  alternative: 祭司站在自己的位置上，利未人照着各班次站立
  rationale: 译文保留原文对“岗位”和“班次”的区分，呈现礼仪井然有序的情形，不额外推断其具体职务内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“礼仪”承载圣殿敬拜语境，“岗位”和“班次”清楚区分祭司的位置与利未人的编组。脚注标记按相关词语的出现顺序排列。
