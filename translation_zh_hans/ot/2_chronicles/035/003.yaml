source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: zh_hans
  text: 他对那些教导全以色列人[a]、归耶和华为圣的利未人说：“要把圣约柜安放在以色列王大卫之子所罗门建造的殿[b]里。你们不必再用肩膀抬它[c]了。现在要事奉耶和华你们的神，也要服事他的子民以色列。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教导”也可译作“使……明白”“有见识”或“受过教导”。希伯来语分词既可表示明白、受教，也可表示使人明白。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“房子”，这里指所罗门建造的圣殿。
    reason: cultural_note
  - marker: c
    text: 原文直译：“你们肩上没有担子。”这里指不再用肩膀抬约柜。
    reason: lexical_alternative
lexical_decisions:
- source_word: ה/מבונים
  choice: 教导全以色列人
  rationale: 该分词源于 בין，形态与语义可涉及“有见识、受教”或“使人明白、教导”。结合《历代志》中利未人教导百姓的职分，正文采用自然的功能性表达，并以脚注保留歧义。
- source_word: הַ/קְּדוֹשִׁים לַ/יהוָה
  choice: 归耶和华为圣
  rationale: 既表达其圣洁身份，也保留 ליהוה 所表示的归属与奉献关系；比单说“圣洁”更准确，又不过度解释为具体礼仪。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语域中广为人知的神名音译，使其与原文专名相对应，而非以称号替代。
- source_word: תְּנוּ אֶת אֲרוֹן הַקֹּדֶשׁ בַּבַּיִת
  choice: 把圣约柜安放在……殿里
  rationale: נתן 在此是放置、安放之意；אֲרוֹן הַקֹּדֶשׁ 指神圣的约柜。בית 在语境中明确指所罗门建造的圣殿，正文用“殿”以符合自然中文，脚注说明原文字面。
- source_word: אֵין לָכֶם מַשָּׂא בַּכָּתֵף
  choice: 你们不必再用肩膀抬它了
  rationale: 原文直译为“你们肩上没有担子”，语境所指是肩抬约柜。中文以清楚自然的方式传达其含义，同时在脚注保留字面措辞。
- source_word: עַתָּה עִבְדוּ
  choice: 现在要事奉……也要服事
  rationale: עבד 可指事奉神，也可指为人服务。对神用“事奉”，对其子民用“服事”，保持同一词根的关联并符合现代中文搭配。
- source_word: וְאֵת עַמּוֹ יִשְׂרָאֵל
  choice: 也要服事他的子民以色列
  rationale: 保留神与以色列之间的归属关系，并使“以色列”自然地作为“他的子民”的同位说明。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文以中文读者最熟悉、且具有专名功能的“耶和华”对应；“雅威”是较接近学术重构读音的另一可行音译。
- issue: ה/מבונים 所描述的利未人角色
  choice: 教导全以色列人
  alternative: 有见识的／受教的利未人
  rationale: 该希伯来分词兼有理解、受教及使人理解等语义可能。上下文和《历代志》的利未人职分支持主动的“教导”，但形态上的歧义以脚注明确保留。
- issue: 同时事奉神与服事百姓
  choice: 事奉耶和华你们的神，也要服事他的子民以色列
  alternative: 为耶和华你们的神和他的子民以色列效力
  rationale: 原文同一动词统摄两个宾语，显示利未人的圣职既朝向神，也惠及其百姓。中文采用不同但相近的搭配，避免把对百姓的服务误说成敬拜，同时保留二者并列关系。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“归耶和华为圣”保留圣礼与归属语义；“圣约柜”沿用普通中文读者熟悉的称谓。“事奉／服事”区分对神和对人的对象，同时反映原文同一动词的统摄关系。所有脚注标记均已置于正文相应位置。
