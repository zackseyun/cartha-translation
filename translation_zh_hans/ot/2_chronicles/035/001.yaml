  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: zh_hans
  text: 约西亚在耶路撒冷为雅威守逾越节；正月十四日，他们宰杀了逾越节的祭牲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“逾越节”；这里指被宰杀的逾越节祭牲。
    reason: 说明原文以节期名称转指祭牲，避免读者误以为希伯来语明确写了某一种动物。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 守
  rationale: 该动词本义为“做、行”，以“逾越节”为宾语时，指按礼仪守节；“守”既符合现代汉语的宗教表达，也保留了实际遵行的意味。
- source_word: פֶּסַח（第一次）
  choice: 逾越节
  rationale: 第一次出现指整个逾越节礼仪或节期，采用通行且准确的名称“逾越节”。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 ל 表示此礼仪是归给、献给雅威的；“为雅威”在汉语中自然表达这种指向和奉献关系，而不将其过度解释。
- source_word: בִירוּשָׁלַםִ
  choice: 在耶路撒冷
  rationale: 按其地点意义直接译出。
- source_word: וַיִּשְׁחֲטוּ
  choice: 众人宰杀了
  rationale: שׁחט 指宰杀动物，尤其适用于祭礼语境。“众人”明确表达希伯来语第三人称复数主语，却不擅自认定具体群体。
- source_word: הַפֶּסַח（第二次）
  choice: 逾越节的祭牲
  rationale: 此处是“宰杀”的宾语，因而不是节期本身，而是逾越节所用的祭牲。译文将希伯来语的转喻明确化，但以脚注保留其字面形式。
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月十四日
  rationale: “第一个月”在此是宗教历法中的首月；“正月十四日”是简洁自然的汉语日期表达，未另行加入月份名称。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界普遍接受的古代读音，并保留其作为专名的性质。
- issue: לַיהוָה 所表达的关系
  choice: 为雅威守逾越节
  alternative: 向雅威守逾越节／守雅威的逾越节
  rationale: 原文介词可表示方向、归属或奉献。“为雅威”保留这种范围，不把它收窄为所有权或单一的祭献解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“守逾越节”沿用普通读者熟悉的经文表达；将原文由单数主语“约西亚”转为复数主语“众人”的变化清楚呈现。
