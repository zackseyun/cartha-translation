base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: zh_hans
  text: 你们要按各自的父系家族[a]，照着你们的班次[b]做好准备，遵照以色列王大卫的文书和他儿子所罗门的文书。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父系家族”也可译作“父家”；希伯来语指以父系祖先为纽带的家族或宗族单位。
    reason: lexical_alternative
  - marker: b
    text: “班次”也可译作“分组”或“班组”；在祭司和利未人的组织语境中，可指所分配的组别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: 预备妥当
  rationale: 该词是כון的使役词干复数命令式，表示主动预备或安排就绪；结合上下文，用“预备妥当”既自然，也保留组织整备的含义。
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: 按各自的父系家族
  rationale: בֵית אָבוֹת指以父系祖先为纽带的家族或宗族单位；“父系家族”比直译“父家”更易为现代读者理解，同时保留古代社会结构。
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: 和班次
  rationale: מַחְלְקוֹת在祭司和利未人的组织语境中指分组轮值的班次；“班次”兼顾组织单位与轮值含义。
- source_word: בִּכְתָב
  choice: 遵照……的文书……所规定的
  rationale: כְּתָב本义为书面文件，介词ב在此表达依照该权威文书行事；此译明确其规范功能，又保留“文书”的具体意象。
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王大卫
  rationale: 按现代汉语习惯排列王号和人名，准确保留大卫的君王称号。
- source_word: וּבְמִכְתַּב שְׁלֹמֹה בְנוֹ
  choice: 和他儿子所罗门的文书
  rationale: 保留第二份文书的独立表述，并清楚表明“他儿子”指大卫的儿子所罗门。
