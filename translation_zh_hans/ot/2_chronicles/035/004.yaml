  naturalness: “按各自的父系家族和班次预备妥当”可理解，但将两个不同的组织依据并列在同一“按”字之下，层次不够清楚。“按……，照着……”能更自然地显出原文的两个短语。“遵照……文书……所规定的去做”也有“遵照／规定／去做”语义叠加。
