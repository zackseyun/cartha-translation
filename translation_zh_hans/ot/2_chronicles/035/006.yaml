base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: zh_hans
  text: 你们要宰杀逾越节的祭牲[a]，使自己分别为圣，并为你们的弟兄预备，好让他们照雅威借摩西之手[b]所传的话而行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“逾越节”；这里指被宰杀的逾越节祭牲。
    reason: lexical_alternative
  - marker: b
    text: 或译：“借着摩西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: 宰杀
  rationale: 该动词常指宰杀动物，在这里具有献祭礼仪的语境；“宰杀”比泛指的“杀”更准确。
- source_word: הַפָּסַח
  choice: 逾越节的祭牲
  rationale: 该词字面为“逾越节”，也可指逾越节祭物；因这里是被宰杀的对象，译为“逾越节的祭牲”既明确所指，也不限定动物种类。
- source_word: וְהִתְקַדְּשׁוּ
  choice: 使自己分别为圣
  rationale: 该反身形式表示为神圣礼仪洁净并预备自己；“分别为圣”保留其礼仪和神圣层面的含义。
- source_word: וְהָכִינוּ
  choice: 预备
  rationale: 希伯来文没有明说所预备的具体对象，因此中文也不擅自补入“祭物”等宾语。
- source_word: לַאֲחֵיכֶם
  choice: 为你们的弟兄
  rationale: 忠实保留希伯来文阳性复数亲属称谓；在语境中指他们的以色列同胞。
- source_word: לַעֲשׂוֹת
  choice: 好……而行
  rationale: 以目的或结果意味连接前面的预备与遵行雅威的话，同时避免过度明确其隐含主语。
- source_word: כִּדְבַר יְהוָה
  choice: 照雅威……所传的话
  rationale: דבר在此指带有权威的神圣指示；译作“话”保留原文表达，而“照……而行”自然传达遵行之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号代替。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西之手
  rationale: 保留希伯来语“借某人之手”这一中介表达，同时在现代中文中仍可理解为“借着摩西”。
theological_decisions:
- issue: לַאֲחֵיכֶם的性别与群体范围
  choice: 为你们的弟兄
  alternative: 为你们的以色列同胞
  rationale: 原文明确使用阳性复数“弟兄”；虽然语境可能涉及更广的共同体，正文不将其范围自行扩展。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 正文直接呈现专有神名，避免以“主”替代；“雅威”较直接对应通常重构的读音。
- issue: לַעֲשׂוֹת的隐含主语
  choice: 好照……而行
  alternative: 使他们可以照……而行
  rationale: 希伯来文不明说此不定式的施事者；正文采用可自然衔接而不过度锁定主语的表达，保留句法上的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留献祭语境中的“宰杀”“分别为圣”，并避免补出原文未明说的预备对象或不定式主语。脚注标记[a]、[b]均已置于正文相应位置。
