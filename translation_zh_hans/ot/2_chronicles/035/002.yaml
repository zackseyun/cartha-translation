  text: וַ/יַּעֲמֵ֥ד הַ/כֹּהֲנִ֖ים עַל מִשְׁמְרוֹתָ֑/ם וַֽ/יְחַזְּקֵ֔/ם לַ/עֲבוֹדַ֖ת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: zh_hans
  text: 他派定祭司各按自己的班次[a]，又勉励他们从事耶和华殿的事奉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把祭司安置在各自的岗位上”“按他们各自的轮班派定他们”；较直译为“派定祭司在他们的值守（班次）上”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使他们刚强”或“扶持他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: 安排……各就
  rationale: 该词是עמד的使役式，表示使人站在指定位置或将人安置于职分中；结合祭司班次的语境，译作“安排……各就”既保留安置之意，也符合现代汉语。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כהנים的标准译法；汉语中无须另用冠词表达希伯来语定冠词。
- source_word: עַל מִשְׁמְרוֹתָם
  choice: 各就各的班次
  rationale: מִשְׁמָרוֹת可指轮值、岗位或编组；圣殿祭司事奉的语境中，“班次”能自然表达有组织的轮班与职守，同时脚注保留其他可能。
- source_word: וַיְחַזְּקֵם
  choice: 又勉励他们
  rationale: חזק的加强词干可表示使坚强、扶持或鼓励；此处指约西亚使祭司有力量承担事奉，“勉励”在现代汉语中自然，并由脚注明示较直译的可能。
- source_word: לַעֲבוֹדַת
  choice: 办理……事奉
  rationale: עֲבוֹדָה在圣殿语境中指服事或工作；“事奉”准确体现敬拜场所中的职务活动，“办理”使句法自然。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿中
  rationale: בֵּית יְהוָה字面为“耶和华的殿/家”，在本处明确指圣殿；“耶和华殿”简洁保留其所属关系，并以“耶和华”呈现神名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代简体中文圣经语域中，“耶和华”是最广为人知且可辨识的专名译法；“雅威”更接近学术界常见的拟音，但原始发音并不能完全确定。正文不以“主”替代专名。
- issue: וַיְחַזְּקֵם所表达的支持方式
  choice: 勉励他们
  alternative: 使他们刚强／加强他们
  rationale: 原词既可表示赋予力量，也可表示鼓励。上下文没有说明具体物质支持或能力强化，因此采用自然且宽泛的“勉励”，同时在脚注中保留“使他们刚强”的词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“各就各的班次”体现圣殿人员的组织安排；“事奉”保留宗教职务语感而不使用生僻表达。所有脚注标记均置于正文相关词语之后。
