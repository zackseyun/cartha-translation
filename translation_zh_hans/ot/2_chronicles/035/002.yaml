revisions:
- from: 他安排祭司各就各的班次[a]，又勉励他们办理耶和华殿中的事奉[b]。
  to: 他派定祭司各按自己的班次[a]，又勉励他们从事耶和华殿的事奉[b]。
  rationale: 修订删除原文未明确的“办理”，以“从事……事奉”自然对应“为耶和华殿的服务”。“派定……各按自己的班次”保留使役动词的职务安排含义，并使“班次”的分配关系明确。脚注a改正了原先失真的所谓直译，同时保留“岗位、轮班、值守／班次”等合理词义范围；脚注b保留加强、扶持与勉励之间的语义弹性。
