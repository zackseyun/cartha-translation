  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וַ/חֲסָדָ֑י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: zh_hans
  text: 约西亚其余的事迹，以及他照雅威律法所记而行的忠信之举[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信之举”也可译作“忠诚的行为”“慈爱之举”或“善行”。希伯来语这个词可表达慈爱、忠诚或守约的信实。
    reason: 说明 חֲסָדָיו 的宽广语义范围，避免正文译法排除其他合理理解。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: 其余的事迹
  rationale: 在君王史料的总结套语中，דִּבְרֵי 指君王的行事与相关事件，而非单指“言语”；“其余的事迹”符合现代汉语史书语体。
- source_word: יֹאשִׁיָּהוּ
  choice: 约西亚
  rationale: 采用现代简体中文圣经中通行的人名译法。
- source_word: וַחֲסָדָיו
  choice: 他的忠信之举
  rationale: חֶסֶד 可涵盖慈爱、忠诚及盟约信实；此处为复数并用于评价君王的行为，译作“忠信之举”既体现行动，也保留忠诚与信实的语义张力。
- source_word: כַּכָּתוּב בְּתוֹרַת
  choice: 照……律法所记而行的
  rationale: כַּכָּתוּב 表示以所写的内容为准。这里并非说约西亚的具体事迹预先记载在律法中，而是说其行为依照律法所写；补出“而行”使这一关系在现代汉语中清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名的性质，不以“主”这一称号替代。
theological_decisions:
- issue: חֶסֶד 用于约西亚时的含义
  choice: 忠信之举
  alternative: 慈爱之举；善行；忠诚的行为
  rationale: 语境是按雅威律法评价约西亚，故该词不宜弱化为一般的仁慈或善行；“忠信”保留对神及其约的忠诚意味，同时不把原词限定为某一套系统神学术语。
- issue: כַּכָּתוּב בְּתוֹרַת יְהוָה 与约西亚行为的关系
  choice: 他照雅威律法所记而行的
  alternative: 如雅威律法中所记载的
  rationale: 律法记载的是行为准则，而非约西亚生平中的具体行动；此译法表达“依照所写”的规范关系，又避免误导读者以为他的事迹本身已载于摩西律法。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用专名音译，以区别于称号，并对应原文的四字神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“其余的事迹”保留历代志君王纪事的总结语气；句末用逗号而非句号，因为本节句法和叙事内容延续至下一节。
