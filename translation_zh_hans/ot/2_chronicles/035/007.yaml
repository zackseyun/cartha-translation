base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: zh_hans
  text: 约西亚从羊群中拨出羊羔和山羊羔，共三万只，全都供所有在场的百姓[a]作逾越节的祭牲；又拨出三千头牛。这些都出自王的财产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “百姓”原文直译为“人民的众子”，这里可能指普通民众，与祭司和利未人相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: 拿出……供给
  rationale: 此处使役式并非字面“举起”，而是指约西亚从自己的产业中拨出牲畜供百姓使用；“拿出……供给”自然表达王室供应之意，又不暗示约西亚亲自献祭。
- source_word: לִבְנֵי הָעָם
  choice: 给百姓
  rationale: 字面为“给人民的众子”，在本段语境中指参加节期的普通民众，可能与祭司、利未人相对；现代汉语用“百姓”最自然，并在脚注保留较直译的可能。
- source_word: צֹאן כְּבָשִׂים וּבְנֵי עִזִּים
  choice: 羊群中……羊羔和山羊羔
  rationale: צֹאן 是绵羊与山羊等小型牲畜的集合词，后文具体说明为羊羔和山羊羔；译文保留总称与具体分类的关系。
- source_word: הַכֹּל לַפְּסָחִים
  choice: 全都作逾越节的祭牲
  rationale: פְּסָחִים 为复数，在此很可能集合性地指逾越节所宰献的牲畜；“祭牲”清楚表达其礼仪用途，而不把复数机械译成多个“逾越节”。
- source_word: לְכָל הַנִּמְצָא
  choice: 给所有在场的人
  rationale: מצא 的被动分词在此指被发现身处其间、即到场参加节期的人；“在场的人”符合现代汉语习惯。
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף
  choice: 三万只
  rationale: 该数目修饰前述羊羔和山羊羔的总数；汉语用量词“只”自然明确。
- source_word: וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: 又拿出三千头牛
  rationale: בָקָר 是牛类牲畜的集合词，不限定性别或具体用途；“三千头牛”准确且自然。
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: 这些牲畜都出自王的产业
  rationale: רְכוּשׁ 指财产、产业或所有物；“王的产业”表明这些牲畜来自约西亚掌管或拥有的王室资源，同时不必过度断定现代意义上的私人产权。
theological_decisions:
- issue: “逾越节”复数所指
  choice: 逾越节的祭牲
  alternative: 逾越节祭／逾越节所献的牲畜
  rationale: 上下文列举羊羔、山羊羔和牛，表明这里的复数主要指节期所用祭牲。译文避免把它解释为多个逾越节，也不额外规定所有牛都具有同一种祭祀功能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免希伯来语长句在汉语中层次不清，重组语序：先交代小型牲畜及数目，再说明用途和受益者，随后列出牛。正文保留“王的产业”而不用现代法律色彩较强的“私人财产”。
