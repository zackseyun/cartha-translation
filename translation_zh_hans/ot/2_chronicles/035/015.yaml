  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: zh_hans
  text: 亚萨的子孙，就是歌唱的人，都站在自己的岗位上，照着大卫、亚萨、希幔和耶杜顿——王的先见——所吩咐的；守门的人守在各门口。他们无须离开自己的职务[b]，因为他们的弟兄，就是利未人，为他们预备好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“他们不可离开自己的职务。”希伯来语可以表达较强的语气，不过下句说利未人替他们预备，较支持“无须离开”的理解。
    reason: 保留原文语气的另一种可能。
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: 歌唱的
  rationale: 该词是 שׁיר 的分词形式，指从事歌唱的人；结合“亚萨子孙”译为“歌唱的亚萨子孙”，比范围较广的“乐师”更贴近原文。
- source_word: בְּנֵי אָסָף
  choice: 亚萨子孙
  rationale: 字面为“亚萨的儿子们”，此处指亚萨所属的世系或班组；“子孙”在现代汉语中能自然表达这一历史语境。
- source_word: עַל מַעֲמָדָם
  choice: 各站在自己的岗位上
  rationale: מַעֲמָד 指站立之处或指定岗位；此译体现圣殿礼仪中有组织的职分安排。
- source_word: כְּמִצְוַת
  choice: 照着……的命令
  rationale: מִצְוָה 在此表示具有权威的指令；“照着……的命令”准确且自然。
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: 王的先见
  rationale: חוֹזֶה 是具有历史和职分色彩的专门称谓；“先见”比泛化为“先知”更能保留词义区别。
- source_word: הַשֹּׁעֲרִים
  choice: 守门的
  rationale: 指被派在圣殿各门任职的人；“守门的”简洁自然，并准确反映其职责。
- source_word: לְשַׁעַר וָשָׁעַר
  choice: 守在各门
  rationale: 原文是逐一分配的表达，意为每一道门都有守门者；“各门”清楚传达分配意义。
- source_word: אֵין לָהֶם לָסוּר
  choice: 他们无须离开
  rationale: אֵין 加介词 ל 与不定词可表达没有必要或没有 occasion；下文说明利未人替他们预备，支持“无须”而非严格禁令。
- source_word: מֵעַל עֲבֹדָתָם
  choice: 自己的职务
  rationale: עֲבֹדָה 在圣殿语境中指所承担的服事或职责；“职务”能清楚表现固定岗位和职责。
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: 他们的弟兄利未人
  rationale: 保留原文明确的亲族称谓“弟兄”，并将“利未人”作为同位说明。
- source_word: הֵכִינוּ לָהֶם
  choice: 替他们预备好了
  rationale: הכין 意为预备、使就绪；原文未说明具体所预备的物品，因此不作补充限定。
theological_decisions:
- issue: “王的先见”的句法归属
  choice: 将“王的先见”理解为紧接前文的耶杜顿之称号。
  alternative: 也可较宽泛地理解为与前列诸人相关的称谓。
  rationale: 单数短语 חוֹזֵה הַמֶּלֶךְ 最自然地修饰其前紧邻的单数专名“耶杜顿”；脚注保留其句法归属，避免汉语标点造成误读。
- issue: “他们无须离开”的语气
  choice: 表达没有必要离开，而非禁止离开。
  alternative: 可较强地译作“他们不可离开自己的职务”。
  rationale: אֵין לָהֶם לָסוּר 的结构可以有较强语气，但随后的原因从句说明利未人替他们预备，较支持“不需要离开”的描述性理解；脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亚萨子孙”体现世系和班组背景；“先见”保留古代职分术语；“职务”凸显歌唱者和守门者各自固定的圣殿职责。所有脚注标记均已置于正文相应位置。
