base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: zh_hans
  text: 在约西亚整备圣殿、完成这一切事之后，埃及王尼哥上到幼发拉底河边的迦基米施去作战；约西亚出去迎战他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出去迎战他”也可译作“出去迎见他”；原文这一表达本身可指出去迎接或相遇，在军事语境中则可含有对阵之意。
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כָל זֹאת
  choice: 这事以后
  rationale: 概括前文约西亚整顿敬拜和守逾越节等事；现代汉语用“这事以后”自然简洁。
- source_word: הֵכִין ... אֶת־הַבַּיִת
  choice: 整备了圣殿
  rationale: הֵכִין可指预备、使就绪或整顿；“整备”兼顾使其进入妥善状态的结果义。הַבַּיִת字面是“殿/房屋”，在本语境明确指圣殿，译为“圣殿”避免普通读者误解。
- source_word: עָלָה
  choice: 上到
  rationale: 保留עלה“上去”的基本方向表达，不另行强化为“进军”。
- source_word: לְהִלָּחֵם
  choice: 去作战
  rationale: 直接表达投入战斗的目的，符合军事语境而不过度具体化。
- source_word: בְּכַרְכְּמִישׁ עַל־פְּרָת
  choice: 到幼发拉底河边的迦基米施
  rationale: בְּ标示作战地点，עַל־פְּרָת说明迦基米施位于幼发拉底河边；按自然汉语重组地名关系。
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: 出去迎战他
  rationale: לִקְרָאתוֹ本可泛指“出去迎接/与他相遇”，但本节及后文是军事对抗语境，“迎战”自然传达此处含义；脚注保留较中性的词义可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“整备”比“预备”更能体现圣殿已被安排妥当、恢复正常功用；将“圣殿”明说，以符合历代志语境。
