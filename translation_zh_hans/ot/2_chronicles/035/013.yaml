source:
  edition: WLC
  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: zh_hans
  text: 他们照着规定，用火烹制逾越节的祭牲[a]；又用锅、釜和盘煮圣物，随即分送给众民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“烹制”也可更具体地译为“烤”。原文动词可泛指烹煮，但逾越节的规定要求用火烤，不可用水煮（参出埃及记12:8—9）。
    reason: 说明原词的宽泛词义，以及本处由礼仪规定限定的具体烹制方式。
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: 烹制
  rationale: בשׁל可泛指烹煮；此处由“用火”和逾越节规例限定具体方式。译作“烹制”既保留词义宽度，又不造成用水煮逾越节祭牲的误解。
- source_word: הַפֶּסַח
  choice: 逾越节的祭牲
  rationale: 在烹制的礼仪语境中，该词具体指逾越节所献并食用的祭牲。译出“祭牲”比单说“逾越节”更符合现代汉语，但不擅自限定为羊。
- source_word: בָּאֵשׁ
  choice: 用火
  rationale: 直接表达火是烹制方式，同时避免过度规定为“在火中”或“火上”的具体空间关系。
- source_word: כַּמִּשְׁפָּט
  choice: 照着规定
  rationale: 此处指礼仪上规定的做法；“照着规定”自然、庄重，也保留规范性。
- source_word: וְהַקֳּדָשִׁים
  choice: 圣物
  rationale: 保留原文较宽泛的礼仪用语，指分别为圣的祭物或祭肉，并与前面的逾越节祭牲形成对照。
- source_word: בִּשְּׁלוּ
  choice: 煮熟
  rationale: 后接锅、釜、盘等器皿，在此适合取用器皿煮制的意义，并与前句用火烹制相区别。
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: 放在锅、釜和盘中
  rationale: 按原文列出三类器皿；“釜”可表示较大的炊具，“盘”则保留第三种器皿形制并不完全确定的余地。
- source_word: וַיָּרִיצוּ
  choice: 随即迅速分送
  rationale: 该动词突出动作急速；结合食物与受事者，现代汉语用“迅速分送”自然地表达快速送达众人。
- source_word: לְכָל בְּנֵי הָעָם
  choice: 给众民
  rationale: 这是指全体民众的惯用表达，不宜机械译作“人民的众子”。
theological_decisions:
- issue: בשׁל与逾越节祭牲须用火烤制的规例之间的张力
  choice: 正文译“用火烹制”，脚注说明按逾越节规例具体为烤制。
  alternative: 正文直接译“用火烤”；或把两处动词都统一译为“煮”。
  rationale: 原文第一处使用可泛指烹煮的动词，却以“用火、照着规定”限定其方式；宽译动词并由语境和脚注说明，既不抹去词汇现象，也不使经文与逾越节规例表面冲突。
- issue: הַפֶּסַח的具体所指
  choice: 译为“逾越节的祭牲”，不限定动物种类。
  alternative: 译为“逾越节”；或译为“逾越节的羊羔”。
  rationale: 烹制语境表明所指是祭牲，而希伯来文本本节未明说“羊羔”；当前译法兼顾清楚与克制。
- issue: “圣物”与逾越节祭牲的关系
  choice: 按句法对照，理解为另一些分别为圣的祭物。
  alternative: 把“圣物”视为包括逾越节祭牲在内的一切圣食。
  rationale: 两者分别作不同动词的宾语，并采用不同烹制方式，最自然地显示此处有所区分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祭牲”准确表达礼仪语境且不额外限定为羊；“锅、釜和盘”保留三种器皿的区分。正文中的脚注标记[a]与脚注对应。
