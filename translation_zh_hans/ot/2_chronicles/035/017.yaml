  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: zh_hans
  text: 当时，在场的以色列人守逾越节，又守除酵节七天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 守
  rationale: 该动词本义为“做、行”，但以节期为宾语时表示遵守、庆守节期；“守”符合现代中文的圣经与礼仪语境，也不过度增添“庆祝”的情感色彩。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是指以色列民的集合称谓；“以色列人”比直译“以色列的众子”更符合现代汉语。
- source_word: הַנִּמְצְאִים
  choice: 在场的
  rationale: 该分词在此指当时身在现场的人；“在场的”准确表达语境意义，避免生硬直译为“被找到的”。
- source_word: הַפֶּסַח
  choice: 逾越节
  rationale: 此处可涵盖逾越节的礼仪、筵席及祭牲，不宜狭义限定为祭牲；采用通行且足够宽泛的“逾越节”。
- source_word: בָּעֵת הַהִיא
  choice: 当时
  rationale: 原文只是时间指示，并未明确说“指定的时间”；“当时”直接自然，不作过度解释。
- source_word: חַג הַמַּצּוֹת
  choice: 除酵节
  rationale: 这是该节期在现代中文圣经语境中的通行名称，简洁且易于辨认，对应“无酵饼之节”。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 放在“守除酵节”之后，自然表达持续时间，无须另加“共”或“长达”。
