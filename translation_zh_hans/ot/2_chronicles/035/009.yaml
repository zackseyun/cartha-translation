base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: zh_hans
  text: 哥楠雅和他的弟兄示玛雅、拿坦业，以及利未人的首领哈沙比雅、耶利、约撒拔，捐给利未人五千只逾越节祭牲[a]，另有五百头牛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作逾越节的祭物”；希伯来语直译为复数的“逾越节祭”，在这里很可能指为守逾越节而预备的祭牲。
    reason: 说明希伯来语复数形式及其在献祭语境中的可能所指。
lexical_decisions:
- source_word: כונניהו
  choice: 哥楠雅
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: שְׁמַעְיָהוּ
  choice: 示玛雅
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: נְתַנְאֵל
  choice: 拿坦业
  rationale: 依希伯来语人名音译，并采用中文读者熟悉的形式。
- source_word: אֶחָיו
  choice: 他的弟兄
  rationale: 保留原文的亲属称谓；此词也可能泛指男性近亲，但本句不宜擅自扩大其含义。
- source_word: חֲשַׁבְיָהוּ
  choice: 哈沙比雅
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: יעיאל
  choice: 耶利
  rationale: 采用中文圣经传统中此处人名的通行形式。
- source_word: יוֹזָבָד
  choice: 约撒拔
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: שָׂרֵי הַלְוִיִּם
  choice: 利未人的首领
  rationale: שָׂרֵי在这里指担任领导职分的人；“首领”既保留正式意味，也符合自然现代汉语。
- source_word: הֵרִימוּ
  choice: 捐给
  rationale: 此处使役形表示拿出财物作贡献；结合受领者“利未人”，译作“捐给”最清楚自然。
- source_word: לַלְוִיִּם
  choice: 给利未人
  rationale: 介词在这里标明捐赠的受领者。
- source_word: לַפְּסָחִים
  choice: 逾越节祭牲
  rationale: 复数形式在献祭语境中指为守逾越节预备的祭牲；不限定为羊羔，因为经文也明确列出牛。
- source_word: חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: 五千只……另有五百头牛
  rationale: 准确呈现两个数目，并按现代汉语分别使用牲畜量词“只”和牛的量词“头”；“另有”清楚表达并列增列关系。
theological_decisions:
- issue: לַפְּסָחִים复数的所指
  choice: 正文译作“逾越节祭牲”
  alternative: “逾越节的祭物”或较直译的“逾越节祭”
  rationale: 上下文在清点献给利未人的牲畜，故此复数最可能指供逾越节使用的祭牲；脚注保留较字面的表达，避免把语义解释伪装成原文唯一形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名使用简体中文圣经传统中的常见形式；句式避免古奥，同时保留原文对利未人首领、受领者和牲畜数目的明确区分。
