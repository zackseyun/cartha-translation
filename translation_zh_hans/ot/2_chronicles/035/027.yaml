  text: וּ/דְבָרָ֕י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: zh_hans
  text: 他所行的事[a]，从始至终，看哪[b]，都记在《以色列和犹大诸王记》上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他的话”或“有关他的事”；希伯来语这个词可指话语、事情或行为。在这里的君王生平总结中，译作“他所行的事”较符合语境。
    reason: lexical_alternative
  - marker: b
    text: “看哪”是希伯来文中引人注意、加强语气的词。
    reason: lexical_alternative
  - marker: c
    text: “记上”也可译作“记在……书卷中”；希伯来文介词直译为“在……之上”，而“书”也可指书卷。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: 他所行的事
  rationale: דבר 可指“话语”“事情”或“事迹”。在君王生平总结的固定语境中，“所行的事”最自然地涵盖其政绩与事迹，同时用脚注保留词义范围。
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: 从始至终
  rationale: 该表达概括一个人生平前后全部事迹；“从始至终”在现代汉语中自然、凝练，也保留了完整跨度。
- source_word: הִנָּם
  choice: 看哪
  rationale: 保留希伯来文引人注意并加强语气的指示词；“看哪”庄重且为普通圣经读者所熟悉。
- source_word: כְּתוּבִים
  choice: 都记在
  rationale: כתב 的被动分词直指已有文字记载；中文档案引证惯用“记在……上”，比机械译作“被写”自然。
- source_word: עַל סֵפֶר
  choice: 记在……记上
  rationale: עַל 字面为“在……之上”，与 סֵפֶר 连用时指载于书卷；中文以“记在书上”表达最合乎习惯。
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: 《以色列和犹大诸王记》
  rationale: 按所引文献的名称处理，并用书名号明确这是史料书名；“诸王”准确表达复数 מַלְכֵי。
