base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: zh_hans
  text: 后来，利未人为自己和祭司预备[a]；因为祭司，就是亚伦的子孙，忙于献燔祭和脂油，直到夜间。因此，利未人为自己和祭司，就是亚伦的子孙，预备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为自己”两处或译“为他们”。希伯来语代词本身没有明确表示反身，但上下文很可能是说，利未人既为自己，也为祭司预备。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: 后来
  rationale: 表示承接前文的后续行动；“后来”自然、简洁地保留了时间次序。
- source_word: הֵכִינוּ
  choice: 预备
  rationale: כון的使役式在此指预备、备妥；上下文暗示所预备的是食物，但原文未明说，译文也不增补。
- source_word: לָהֶם
  choice: 为自己
  rationale: 代词形式本身并非显式反身，但本句行动主体按上下文是利未人，最自然的理解是他们为自己以及祭司预备；另一个可能译法见脚注。
- source_word: וְלַכֹּהֲנִים
  choice: 和祭司
  rationale: 保留介词所表达的受益对象，与“为自己”共同受“为”支配，符合现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出利未人替祭司预备的原因。
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: 亚伦的子孙作祭司的
  rationale: 保留原文“祭司”与“亚伦的子孙”的同位关系，同时用自然汉语说明这些亚伦子孙的祭司身份。
- source_word: בְּהַעֲלוֹת
  choice: 忙于献
  rationale: 祭祀语境中的עלה使役式指把祭物献上；“忙于”体现持续进行、无暇自备的语境含义。
- source_word: הָעוֹלָה
  choice: 燔祭
  rationale: 这是עֹלָה的传统且准确的汉语祭祀术语，指全烧献上的祭物。
- source_word: וְהַחֲלָבִים
  choice: 和脂油
  rationale: 在祭祀语境中指献在坛上的脂油部分；“脂油”既准确又符合圣经祭祀用语。
- source_word: עַד לָיְלָה
  choice: 直到夜间
  rationale: 忠实表达工作持续到夜里的时间范围，避免译作“傍晚”而弱化לַיְלָה。
- source_word: וְהַלְוִיִּם
  choice: 所以利未人
  rationale: 此处连接词在原因说明后恢复主句；“所以”自然呈现前因后果。
