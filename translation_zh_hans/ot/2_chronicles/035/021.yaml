  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: zh_hans
  text: 尼哥却差遣使者去见约西亚，说：“犹大王啊，我与你有什么相干？我今天不是来攻击你，而是要攻打与我交战的王国[a]。神吩咐我赶快行动。不要抵挡与我同在的神，免得他毁灭你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“我战争的家”。也可理解为“我作战的地方”“我所攻打的王室（国家）”或“与我交战的势力”；这句希伯来语含义不确定。
    reason: 保留罕见短语אֶל בֵּית מִלְחַמְתִּי的词义和结构歧义。
lexical_decisions:
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 本叙事语境指尼哥派出的人间代表，不是天使；“使者”庄重、自然，也保留其受差遣的身份。
- source_word: מַה לִּי וָלָךְ
  choice: 我与你有什么相干
  rationale: 这是表示彼此无涉、不应介入的希伯来惯用语；此译法保留其反问语气，又符合现代汉语表达。
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: 我今天不是来攻击你
  rationale: 原文省略了动作动词，语境表明尼哥说约西亚并非此次军事行动的目标；补出“来攻击”使汉语完整而不改变意思。
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: 而是要攻打与我交战的王国[a]
  rationale: 该短语结构罕见，בֵּית直译为“家”，也可能指王室、国家或势力。正文采用语境中较自然的“王国”，并以脚注保留原文的不确定性。
- source_word: וֵאלֹהִים
  choice: 神
  rationale: 虽אֱלֹהִים在形态上可作复数，但这里搭配单数动词אָמַר；下节叙述者又称这些话出自神的口，因此译作单数“神”。
- source_word: לְבַהֲלֵנִי
  choice: 吩咐我赶快行动
  rationale: 该词表达催促、使之迅速行动；“赶快行动”在军事语境中自然，也比单说“赶快”更完整。
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: 不要再抵挡……神
  rationale: 原文是叫约西亚停止干预或抗拒神正在做的事；“不要再抵挡”准确传达警告的力度。
- source_word: אֲשֶׁר עִמִּי
  choice: 与我同在的
  rationale: 直接保留“与我同在”的关系，不进一步解释为神完全认可尼哥或站在他的政治阵营一边。
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: 免得他毁灭你
  rationale: אַל在警告之后表达应当避免的结果；“毁灭”保留שׁחת在本处严厉的语气。
theological_decisions:
- issue: 尼哥话语中אֱלֹהִים的所指
  choice: 译作单数“神”
  alternative: 译作“一个神”或“诸神”，以反映尼哥可能具有的异教背景
  rationale: 单数动词明确支持单数理解，而35:22又从叙述者角度称这些话是“出自神口中的话”。译作“神”遵从文本自身的叙事框架，但不额外说明尼哥对神有何种完整认识。
- issue: בֵּית מִלְחַמְתִּי的解释
  choice: 正文译作“与我交战的王国”，脚注说明原文歧义
  alternative: 译作“我作战的地方”“我所攻打的家（王室）”或“与我交战的势力”
  rationale: “家”在这里可能转指王室、国家或政治势力，也有人将短语理解为作战地点。正文需保持可读性，故采用符合军事语境的“王国”，同时借脚注避免把难解短语定得过死。
- issue: “与我同在的神”是否表示对尼哥全面的神学认可
  choice: 按原文保留“与我同在”，不作扩充
  alternative: 译成“站在我这一边的神”或解释为神认可尼哥的一切行动
  rationale: 原文只陈述神在此事上与尼哥同在；直译关系用语可避免导入超出本节范围的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我与你有什么相干”保留古希伯来反问的力度；“王国”确保正文自然可读，原文的难点则在脚注中完整提示。为避免连续代词在中文中所指不清，按上下文明确写出“尼哥”和“约西亚”。
