  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: zh_hans
  text: 从先知撒母耳的日子以来，以色列从未守过像这样的逾越节[a]；以色列的历代君王也没有守过像约西亚与祭司、利未人、全犹大、在场的以色列人[b]和耶路撒冷居民一同所守的逾越节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从先知撒母耳的日子以来，以色列未曾举行过这样的逾越节。”
    reason: lexical_alternative
  - marker: b
    text: “在场的以色列人”直译为“被找到的以色列”，指当时在那里参加庆典的以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה ... פֶסַח
  choice: 守……逾越节
  rationale: 希伯来语 עשה 与 פֶּסַח 连用，惯常指举行、遵守逾越节，而非“制作”逾越节；“守逾越节”是现代中文自然且准确的表达。
- source_word: פֶסַח
  choice: 逾越节
  rationale: 本处指整个逾越节庆典，而不只指逾越节祭牲；“逾越节”保留了原词在上下文中的宽泛含义。
- source_word: כָּמֹהוּ
  choice: 像这样的
  rationale: 代词后缀回指本次逾越节庆典。中文用“像这样的”自然地表达比较，同时不把比较具体限定为规模、礼仪或其他单一方面。
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: 从先知撒母耳的日子以来
  rationale: מִן 与“日子”连用表示比较所追溯的起点；此译法保留原文的历史回顾形式。
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא עָשׂוּ
  choice: 以色列的历代君王也没有守过
  rationale: 希伯来语“所有……不”在此表示全称否定。译作“历代君王也没有”符合现代中文，并保留整体否定。
- source_word: אֲשֶׁר עָשָׂה יֹאשִׁיָּהוּ וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: 像约西亚与祭司、利未人……一同所守的
  rationale: 原文连续列出约西亚及其他参与者。用“与……一同”明确他们共同参与守节，而不改变并列关系的实质。
- source_word: וְכָל יְהוּדָה
  choice: 全犹大
  rationale: 保留原文的集体性国家称谓与“全”的范围表达。
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: 在场的以色列人
  rationale: הַנִּמְצָא 字面为“被找到的／在那里的”，在本语境指当时在场参与庆典的以色列群体；中文以复数集合称谓“以色列人”更自然。
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: 耶路撒冷居民
  rationale: 准确简洁地表达居住在耶路撒冷的人。
theological_decisions:
- issue: 与撒母耳以来历次逾越节的历史比较
  choice: 按原文直译为“从……以来……从未守过像这样的逾越节”，不在正文中说明比较究竟侧重规模、礼仪完整性还是整体性质。
  alternative: 将其明确解释为对庆典质量的修辞性或限定性比较，以便与希西家等时期的重要逾越节协调。
  rationale: 希伯来文本宣称约西亚的逾越节无可比拟，却没有界定比较维度。译文保留这种张力，不加入历史协调或特定神学解释。
- issue: “以色列的君王”的指称范围
  choice: 保留“以色列的历代君王”，不明确限定为北国君王或泛指全体以色列诸王。
  alternative: 译作“以色列国的君王”，将其明确限定为北国诸王。
  rationale: דברי הימים中“以色列”可依语境具有整体民族或特定王国色彩；本节措辞本身容许一定张力，因此不在译文中缩窄其范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“守逾越节”沿用普通读者熟悉的圣经表达；以分号呈现原文两个紧密相连的否定比较句。所有脚注标记均置于正文相应位置。
