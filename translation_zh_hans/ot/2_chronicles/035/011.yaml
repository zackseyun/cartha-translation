base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: zh_hans
  text: 他们宰杀逾越节的祭牲[a]；祭司从他们手中洒血[b]；利未人正在剥皮[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逾越节祭物”。这里指逾越节时被宰杀的祭牲。
    reason: lexical_alternative
  - marker: b
    text: “洒”是献祭礼仪用语，指祭司施洒祭血；也可译作“泼洒”。原文直译为“祭司从他们手中洒”。在这类礼仪中，血通常施于祭坛，但本节没有明说地点。
    reason: lexical_and_cultural_note
  - marker: c
    text: 即利未人剥下已宰祭牲的皮；原文没有明说宾语。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: 宰杀
  rationale: שׁחט是宰杀祭牲的常用礼仪用语；“宰杀”既准确，也比泛称“杀死”更能体现献祭语境。
- source_word: הַפָּסַח
  choice: 逾越节的祭牲
  rationale: 这里的פֶּסַח指被宰杀的逾越节祭牲，不只是节期本身。原文并未限定为羊，因此采用较宽泛的“祭牲”。
- source_word: וַיִּזְרְקוּ
  choice: 洒在坛上
  rationale: זרק在献祭语境中是祭司把血施于祭坛的专门用语。“洒”符合现代汉语礼仪表达；祭坛虽未明说，却由该祭祀用语和上下文所含示。
- source_word: מִיָּדָם
  choice: 从他们手中接过
  rationale: 字面为“从他们手中”。在此语境中，意思是祭司从宰杀祭牲者手中取得血；补出“接过”可使汉语关系清楚，同时保留“他们”而不擅自明确其所指。
- source_word: מַפְשִׁיטִים
  choice: 剥去祭牲的皮
  rationale: פשט在宰牲语境中指剥除动物的皮。原文宾语省略，汉语补出“祭牲”以免歧义。
theological_decisions:
- issue: 首句“他们”以及מִיָּדָם中“他们”的具体所指
  choice: 保留“他们”，不在正文中明确为利未人或其他人
  alternative: 直接译作“利未人宰杀……祭司从利未人手中接过血”
  rationale: 本节原文本身只用第三人称复数代词；虽然上下文可帮助判断，但正文不应消除原有的指代余地。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“祭牲”“宰杀”等词保留圣殿礼仪色彩；用分号呈现三个紧密相连的动作，并以“则”自然表达利未人同时进行的工作。
