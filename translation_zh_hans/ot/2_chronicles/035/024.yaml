base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: zh_hans
  text: 他的臣仆把他从战车上移下来，安置到他自己的第二辆战车上[a]，送他到耶路撒冷。他死了，葬在他祖先的坟墓里。全犹大和耶路撒冷都为约西亚哀悼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“属于他的第二辆战车”。“第二辆战车”的确切含义不明；也可能指第二等的车或备用车。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: 把他……抬下来
  rationale: 使役形在此表示将受伤的约西亚从一处移到另一处；结合他负伤和战车场景，“抬下来”比泛泛的“移下来”更自然，但不额外说明伤势程度。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עבד可指仆人、侍从或臣属；王室与战场语境中的“臣仆”兼顾其服侍和臣属身份，又不具体限定官阶。
- source_word: הַמֶּרְכָּבָה
  choice: 战车
  rationale: 该词指战车；上下文是战场，中文用“战车”清楚自然。
- source_word: וַיַּרְכִּיבֻהוּ
  choice: 安置在……上
  rationale: 使役形意为使其乘坐或登上；约西亚已经受伤，“安置”自然表达由他人扶抬放置，避免“让他乘坐”可能暗示主动行动。
- source_word: רֶכֶב הַמִּשְׁנֶה
  choice: 备用战车
  rationale: 字面结构含“第二”之意，语境很可能指君王的第二辆或后备车辆；正文采用自然的“备用战车”，并以脚注保留字面形式及其不确定性。
- source_word: אֲשֶׁר לוֹ
  choice: 他那辆
  rationale: 简洁表达该车属于约西亚，符合现代汉语领属表达。
- source_word: וַיּוֹלִיכֻהוּ
  choice: 送他到
  rationale: 使役形可表示带领或带去；这里是运送伤者前往耶路撒冷，“送他到”最合语境。
- source_word: וַיָּמָת
  choice: 他死后
  rationale: 原文依次叙述死亡和安葬；汉语用“死后”顺畅连接两事，未改变事件次序。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 希伯来语为被动形式；汉语“葬在”在此自然承载被安葬之意，无须生硬加入“被”。
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: 在他祖先的坟墓里
  rationale: אבות在此指先祖；“祖先”比现代汉语中可能仅指父亲的“列祖”更直白，复数“坟墓”也予以保留。
- source_word: וְכָל יְהוּדָה וִירוּשָׁלַם
  choice: 全犹大和耶路撒冷
  rationale: 保留原文以地域名称代指其中民众的表达；中文可自然理解为犹大和耶路撒冷的全体民众。
- source_word: מִתְאַבְּלִים
  choice: 都为……哀悼
  rationale: 分词体现持续哀悼的状态；在叙事中文里“都为约西亚哀悼”自然，并保留全民哀悼的含义。
