base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/004.yaml
  text: The matter seemed right in the eyes of the king and in the eyes of all the assembly[a].
translation:
  language: zh_hans
  text: 王和全体会众都认为这事合宜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在王和全体会众眼中，这事是对的。”
    reason: 保留וַיִּישַׁר及בְּעֵינֵי较为直译的表达，并呈现“合宜／是对的”之间的词义选择。
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: 认为……合宜
  rationale: ישר在此与“在……眼中”这一习语连用，表示有关事情被看为正确、妥当或可取；译为“认为……合宜”既传达评价含义，也符合现代汉语表达。
- source_word: הַדָּבָר
  choice: 这事
  rationale: דבר可指“话、事情、事项”；此处承接上文所议定的安排，译作“这事”直接而自然，并避免把原文明确化为“提议”或“计划”。
- source_word: בְּעֵינֵי
  choice: 认为
  rationale: 希伯来语“在……眼中”表示某人的判断或看法。正文采用自然的现代汉语“认为”，而在脚注中保留原文意象的直译可能。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 准确对应带定冠词的“王”；上下文已明确所指，汉语无需另加指示语。
- source_word: כָּל הַקָּהָל
  choice: 全体会众
  rationale: קהל指聚集起来的群体或大会；“全体会众”兼顾集合含义和庄重语体，כָּל由“全体”完整表达。
