source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְחִזְקִיָּ֗הוּ עַל לֵב֙ כָּל הַ/לְוִיִּ֔ם הַ/מַּשְׂכִּילִ֥ים שֵֽׂכֶל ט֖וֹב לַ/יהוָ֑ה וַ/יֹּאכְל֤וּ אֶת הַ/מּוֹעֵד֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים מְזַבְּחִים֙ זִבְחֵ֣י שְׁלָמִ֔ים וּ/מִ֨תְוַדִּ֔ים לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: zh_hans
  text: 希西家勉励所有在侍奉耶和华的事上颇有见识的利未人[a]。他们一连七天吃节期的筵席，献上平安祭[b]，并向耶和华——他们祖先的上帝——称谢[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勉励”直译为“向……的心说话”。“颇有见识”也可译作“对耶和华有美好的见识”或“在耶和华的事上办事精明”。
    reason: 保留“向心说话”这一习语的字面形式，并说明利未人相关短语所含的洞察、熟练或胜任等语义范围。
  - marker: b
    text: “平安祭”也可译作“团契祭”或“福祉祭”。
    reason: 说明该专门祭祀名称的主要译法。
  - marker: c
    text: “称谢”所译的动词也可表示“赞美”“承认”或“认罪”；这里按节期敬拜的语境译为“称谢”。
    reason: 保留原词在此处可能涉及的词义张力。
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: 勉励
  rationale: 该习语直译为“对……的心说话”，在此表示以言语鼓励、坚固；“勉励”自然简洁，并保留积极劝慰的语气。
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב
  choice: 显出良好悟性
  rationale: 动词分词与同根名词连用，强调表现出的洞察、明达或胜任；此译避免将其收窄为“教导”，也不把主动含义弱化为单纯“具有”。
- source_word: לַיהוָה
  choice: 在侍奉耶和华的事上
  rationale: 介词表示与耶和华有关或以他为指向；结合利未人的礼仪职责，此处自然理解为敬拜与侍奉方面，同时不改变句子的核心指向。
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד
  choice: 吃节期的筵席
  rationale: 原文以“节期”为“吃”的直接宾语，是较凝缩的表达；中文补出“筵席”以形成自然搭配，而不添加原文没有的“守节”或“度过”含义。
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: 献上平安祭
  rationale: “平安祭”是该祭类在中文圣经语境中清楚而通行的名称，也保留其专门礼仪性质。
- source_word: וּמִתְוַדִּים
  choice: 称谢
  rationale: ידה的反身式可表示承认、认罪、赞美或感谢；在节庆献祭的正面敬拜语境中，“称谢”最为合适，同时脚注保留其词义张力。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们祖先的上帝
  rationale: “祖先”准确表达群体先辈之意，现代中文自然，也保留该短语的盟约和历史关联。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉且可辨识为专有神名的“耶和华”；“雅威”更接近学界常见的拟音，但原始发音并非完全确定。
- issue: וּמִתְוַדִּים 的敬拜含义
  choice: 称谢
  alternative: 认罪／赞美
  rationale: 节期、平安祭及向耶和华敬拜的语境支持“称谢”，但该词本身也能表达“承认、认罪”，故不宣称词义在所有层面毫无歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“一连七天”自然表达持续时间；破折号标明“他们祖先的上帝”是“耶和华”的同位说明。所有脚注标记均置于所解释的正文表达之后。
