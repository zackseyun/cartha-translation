  text: כִּ֣י בְ/שׁוּבְ/כֶ֞ם עַל יְהוָ֗ה אֲחֵי/כֶ֨ם וּ/בְנֵי/כֶ֤ם לְ/רַחֲמִים֙ לִ/פְנֵ֣י שֽׁוֹבֵי/הֶ֔ם וְ/לָ/שׁ֖וּב לָ/אָ֣רֶץ הַ/זֹּ֑את כִּֽי חַנּ֤וּן וְ/רַחוּם֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/לֹא יָסִ֤יר פָּנִים֙ מִ/כֶּ֔ם אִם תָּשׁ֖וּבוּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: zh_hans
  text: 因为你们若归向耶和华，你们的弟兄和儿子就会在掳走他们的人面前蒙怜悯[a]，得以回到这地。因为耶和华你们的神满有恩典和怜悯；你们若归向他，他必不转脸离开你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在掳走他们的人面前得蒙怜悯。”
    reason: 保留לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם所表达的、在掳去他们的人面前成为蒙怜悯对象的意思。
  - marker: b
    text: 直译：“不从你们那里移开脸。”
    reason: 说明לֹא יָסִיר פָּנִים מִכֶּם所保留的“脸”这一希伯来语关系意象。
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה
  choice: 你们若归向耶和华
  rationale: שׁוּב在这里表达回转并恢复对耶和华的忠诚；“归向”自然保留悔改、关系恢复和方向性。בְּ加不定式在语境中带条件意味，因此译作“若”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: 你们的弟兄和儿子
  rationale: 原文明确使用阳性的亲属称谓，正文照实保留，不泛化为“家人”或“儿女”。
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: 在掳掠他们的人面前蒙怜悯
  rationale: 该结构表示他们在掳走他们的人眼前成为蒙怜悯的对象；“蒙怜悯”符合自然中文，并保留被动含义。
- source_word: שׁוֹבֵיהֶם
  choice: 掳掠他们的人
  rationale: 该分词指将他们掳去的人；展开翻译比“俘虏者”更自然、明确。
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: 得以回到这地
  rationale: 不定式与前面的蒙怜悯相连，可表示结果或目的；“得以”自然呈现这种联系，同时不明确添加使他们归回的施事者。
- source_word: חַנּוּן וְרַחוּם
  choice: 有恩典、有怜悯
  rationale: 分别传达חַנּוּן所指的施恩与רַחוּם所指的怜悯，保留常见的神性描述组合。
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: 必不转脸离开你们
  rationale: 保留“脸”的关系性意象，并以自然中文表达撤去眷顾、转离对方之意。
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: 你们若归向他
  rationale: 与开头同用“归向”，保留שׁוּב在本节中的重复及修辞呼应。
theological_decisions:
- issue: שׁוּב所表达的悔改与关系恢复
  choice: 归向耶和华／归向他
  alternative: 转向耶和华／回到耶和华那里
  rationale: “归向”既保留回转和恢复关系的含义，也避免把后来的系统神学术语直接嵌入正文。
- issue: 亲属称谓的性别表达
  choice: 弟兄和儿子
  alternative: 弟兄和儿女／家人
  rationale: 原文使用阳性名词，正文予以保留；不依据可能的广义指称而将其静默中性化。
- issue: 怜悯与归回之间的逻辑关系
  choice: 蒙怜悯，得以回到这地
  alternative: 蒙怜悯，并回到这地
  rationale: 原文不定式可带结果或目的意味；“得以”呈现两者的紧密联系，却不强行确定归回的具体施事方式。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。保留“耶和华”“归向”“转脸”等圣经语域中可理解且承载原文意象的表达；句法适度调整，使条件关系和结果关系在中文中明确。
