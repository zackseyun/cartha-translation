base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/013.yaml
  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: zh_hans
  text: 许多人聚集在耶路撒冷，要在第二个月守[a]无酵节[b]；这是人数极多的大会。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守”也可译作“庆祝”或“举行”；原文动词本义为“做、办理”。
    reason: lexical_alternative
  - marker: b
    text: “无酵节”也可译作“无酵饼节”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: 聚集
  rationale: 该词是אָסַף的尼法勒式，表示人们聚到一起或被召集起来；“聚集”自然地保留了原文的事件意义，也不强行限定主动或被动。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经与通行用法中的标准地名译法。
- source_word: עַם רָב
  choice: 许多人
  rationale: 原文指人数众多的民众；“许多人”简洁自然，并保留数量上的强调。
- source_word: לַעֲשׂוֹת
  choice: 守
  rationale: 该动词本义为“做、举行”，以节期为宾语时表示遵守或庆祝节期；“守”符合现代中文宗教节期语境，并以脚注保留其他可能译法。
- source_word: חַג הַמַּצּוֹת
  choice: 无酵节
  rationale: חַג指节期，מַצּוֹת指无酵饼；“无酵节”是准确、简明且通行的现代中文名称，脚注说明其较直译形式。
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: 在二月
  rationale: 按原文保留明确的历法时间；这里的“二月”指历法中的第二个月，并非现代公历二月。
- source_word: קָהָל
  choice: 会众
  rationale: 该词指聚集起来的群体或大会；“会众”能表达共同聚集的群体，同时适合本节正式而庄重的语域。
- source_word: לָרֹב מְאֹד
  choice: 人数极多
  rationale: 原文以加强语气强调聚集群体规模很大；译作“人数极多”在中文中自然明确，并保留强调力度。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“许多人”与“会众人数极多”保留原文先陈述聚集、后再次强调规模的重复结构。标点使用分号，使末尾同位总结既紧接前句，又不显得生硬。
