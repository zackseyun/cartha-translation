  text: וַ/יַּֽעֲמִ֣ידוּ דָבָ֗ר לְ/הַעֲבִ֨יר ק֤וֹל בְּ/כָל יִשְׂרָאֵל֙ מִ/בְּאֵֽר שֶׁ֣בַע וְ/עַד דָּ֔ן לָ/ב֞וֹא לַ/עֲשׂ֥וֹת פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם כִּ֣י לֹ֥א לָ/רֹ֛ב עָשׂ֖וּ כַּ/כָּתֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: zh_hans
  text: 于是，他们作出决定，要发布通告，传遍全以色列，从别是巴直到但，召人到耶路撒冷，为耶和华——以色列的神——守逾越节；因为他们没有普遍地按所记载的规定守这节。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为照所记载的规定守这节的人并不多。”希伯来文末句表达简略；它可着重于守节者人数不多，也可着重于守节并未普遍地遵照成文规定。
    reason: 保留לָרֹב的数量／普遍性含义，以及其与“按所记载的规定”在压缩句法中的关联余地。
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: 他们作出决定
  rationale: 该习语字面意为“使一件事立定”，在这里指正式议定并确立一项行动；“作出决定”自然清楚，又保留其正式意味。
- source_word: לְהַעֲבִיר קוֹל
  choice: 传出公告
  rationale: 字面是“使声音传遍”，行政语境中指公开传达消息；“传出公告”兼顾传播动作与正式性质。
- source_word: בְּכָל יִשְׂרָאֵל
  choice: 向全以色列
  rationale: 结合“传出公告”译为公告所面向并遍及的范围，比机械译作“在全以色列中”更符合现代汉语。
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: 从别是巴直到但
  rationale: 保留原文由南至北概括全境的地名表达，不将其解释性展开。
- source_word: לָבוֹא לַעֲשׂוֹת פֶּסַח
  choice: 叫众人……守逾越节
  rationale: 两个不定式表达公告的目的和内容；“守逾越节”是对节期礼仪行动自然且准确的汉语表达。
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 向耶和华以色列的神
  rationale: 介词保留敬拜和献祭所指向的对象；神名采用中文传统且明确的专名“耶和华”，而非以“主”替代。
- source_word: בִּירוּשָׁלִָם
  choice: 到耶路撒冷
  rationale: 原文介词表示地点；因句中同时有“来”的方向含义，现代汉语用“到耶路撒冷”可清楚表达守节地点和召聚目的地。
- source_word: כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב
  choice: 因为照所记载的那样守这节的人并不多
  rationale: לָרֹב 首先按数量理解，指参与者不多或守节并不普遍；将“照所记载的那样”与守节相连，保留对成文规定的指涉，同时以脚注说明压缩句法所容许的侧重点差异。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。译作专名“耶和华”可保留其作为以色列之神盟约名号的性质，避免用称号“主”取代；“雅威”是另一种可能的音译。
- issue: 末句是否强调人数或守节方式
  choice: 正文以人数少为主，同时保留“照所记载的”对守节方式的限定
  alternative: 他们没有大规模地照所记载的那样守这节；他们没有按所记载的规定守节
  rationale: לָרֹב 通常具有数量、众多的意义，而不是时间意义；但希伯来语表达紧凑，כַּכָּתוּב 又明确涉及成文规范，因此不应把经文简化成单纯的人数陈述，也不应擅自译成“很久没有”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“作出决定”“传出公告”体现官方行动；地名和节期名沿用通行中文圣经形式。正文不采用较古雅的“颁旨”“宣告于遍地”等措辞，也不把有争议的 לָרֹב 解释成原词未明确表达的“很久”。
