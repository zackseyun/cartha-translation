  - severity: medium
    issue: “向耶和华以色列的神守逾越节”缺少同位语界标。
    rationale: “以色列的神”是“耶和华”的同位说明。没有逗号、破折号或括号时，中文读者可能误解其内部修饰关系；“向……守”也不如“为……守”自然。
