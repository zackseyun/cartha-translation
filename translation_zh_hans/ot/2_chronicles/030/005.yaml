  naturalness: 修订后使用“发布通告，传遍全以色列”及“为耶和华——以色列的神——守逾越节”，更符合现代标准汉语的正式叙事语体，也清楚标示神名与同位语关系。
  terminology: 保留通行的“别是巴”“但”“耶路撒冷”“耶和华”“以色列的神”“逾越节”。“为耶和华……守逾越节”自然表达原文לְ的礼仪指向，且不额外限定具体仪式行为。
