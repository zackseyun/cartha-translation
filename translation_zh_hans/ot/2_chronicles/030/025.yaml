base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: zh_hans
  text: 犹大全体会众、祭司和利未人，以及所有从以色列来的会众、从以色列地来的寄居者[a]和住在犹大的人，都欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“外来居民”。希伯来语 גֵּרִים 指非本地出身而居住在以色列人中间的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: 都欢喜快乐
  rationale: שׂמח表示欢喜、喜乐；“欢喜快乐”在现代汉语中自然庄重，也没有把具体庆祝方式强加于原文。句末的“都”统摄希伯来文并列列出的各群体。
- source_word: כָּל קְהַל יְהוּדָה
  choice: 犹大全体会众
  rationale: קהל指聚集起来的群体；“会众”既贴近原文，又适合本段共同守节的语境。“全体”表达כָּל。
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司和利未人
  rationale: 采用这两个群体在中文圣经语境中的标准称谓，并保留二者的区别。
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: 所有从以色列来的会众
  rationale: 保留קהל的群体含义，并以“从以色列来的”自然表达分词短语；此处“以色列”按上下文指与犹大有别的以色列地区或群体。
- source_word: הַגֵּרִים
  choice: 寄居者
  rationale: גֵּרִים指住在本族土地以外、在当地长期居留的人；“寄居者”保留其社会身份含义，而不把它单纯化为族裔称呼。脚注补充较明白的释义。
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: 从以色列地来的
  rationale: 明确保留אֶרֶץ“地、地域”的成分，并用现代汉语定语结构表达其来源。
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: 住在犹大的人
  rationale: ישׁב在此表示居住。“住在犹大的人”自然并保留分词的描述作用；其是否仍受“寄居者”统辖存在句法歧义，故在脚注中保留另一种理解。
