  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: zh_hans
  text: 耶和华垂听了希西家，医治了百姓。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听了希西家。”这里的希伯来语动词既可表示“听见”，也可在这种结构中表示“垂听、作出有利回应”。
    reason: lexical_alternative
  - marker: b
    text: “医治”可能指耶和华除去与百姓礼仪状态不合要求有关的灾患或审判，不一定只指身体疾病得愈。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 垂听了
  rationale: שׁמע与介词אֶל连用，在本段祷告语境中不只是听见声音，也含有听取并作出有利回应之意。“垂听”以庄重而通行的现代汉语表达这一层意思。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中对四字神名的通行音译，以保留其作为以色列之神专名的性质。
- source_word: יְחִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וַיִּרְפָּא
  choice: 医治了
  rationale: רפא的基本意义是“医治”。上下文可能涉及除去因礼仪状态不合要求而来的灾患或审判，但正文保留原文的医治意象，不将其缩窄为赦免、免罚或单纯身体痊愈。
- source_word: הָעָם
  choice: 百姓
  rationale: עם在此指聚集守逾越节的以色列群体；“百姓”自然、庄重，也符合本段群体性语境。
theological_decisions:
- issue: “医治百姓”所指的性质
  choice: 保留“医治”的表述，不限定为身体疾病得愈。
  alternative: 译作“赦免了百姓”“饶过了百姓”或“使百姓复原”。
  rationale: 18—19节涉及未按洁净条例守逾越节的人，以及希西家为他们所作的祷告；然而本节实际使用רפא“医治”。保留这一措辞可兼顾身体、灾患、审判得除去等可能含义，避免替原文消除神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“垂听”适合祷告语境；“医治”保留希伯来原文的形象及其范围上的开放性。所有脚注标记均已置于正文。
