base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: zh_hans
  text: 他们站在自己的岗位上，照着自己的规例，照着神人摩西的律法。祭司把从利未人手中接过来的血洒出去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל־עָמְדָם
  choice: 各站在自己的岗位上
  rationale: עמד与עמד的同根表达强调各人站在指定位置；“岗位”自然传达礼仪中的职分和站位。
- source_word: כְּמִשְׁפָּטָם
  choice: 照着规定
  rationale: משפט在祭祀语境中指规定的程序或规例，而不只是习惯；“规定”兼顾正式性与现代汉语的自然表达。
- source_word: כְּתוֹרַת מֹשֶׁה אִישׁ־הָאֱלֹהִים
  choice: 遵行神人摩西的律法
  rationale: “律法”准确表达此处规范逾越节礼仪的תורה；“神人”保留איש האלהים这一固定而庄重的称号。
- source_word: הַכֹּהֲנִים זֹרְקִים אֶת־הַדָּם
  choice: 祭司……把血洒出去
  rationale: זרק的基本动作是投、洒；用于祭血时指礼仪性地把血洒向祭坛。“洒出去”既保留动作力度，又避免译成现代汉语中较轻柔的“喷洒”。
- source_word: מִיַּד הַלְוִיִּם
  choice: 从利未人手中接过来的
  rationale: 原文直译为“从利未人的手中”；补出“接过来”使汉语关系明确，同时不改变血由利未人递交给祭司的含义。
theological_decisions:
- issue: 祭血动作זרק的表达
  choice: 把……血洒出去
  alternative: 把……血泼在坛上／把……血洒在坛上
  rationale: 上下文属于规定的献祭礼仪，但本节没有明说“坛上”；因此保留礼仪性洒血动作，不补入地点。
- issue: כְּמִשְׁפָּטָם是习惯还是规定
  choice: 照着规定
  alternative: 照着惯例
  rationale: 此处紧接“摩西的律法”，且处于祭司与利未人的礼仪分工语境，“规定”更能体现规范程序，不把它弱化为一般习惯。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“各站在自己的岗位上”呈现礼仪秩序；句法保持简洁，不增加原文未明说的祭坛位置。
