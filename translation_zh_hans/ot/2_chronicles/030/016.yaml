  terminology: “规例”在此比笼统的“规定”略能体现祭祀程序的规范性；“洒血”是现代汉语圣经语境中自然且准确的礼仪术语。保留“从利未人手中接过”以清楚表达מִיַּד的交接关系，未补入原文未明言的祭坛地点。
