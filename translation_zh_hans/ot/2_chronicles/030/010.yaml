base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: zh_hans
  text: 于是，信使[a]从一城到另一城，在以法莲和玛拿西地行走，直到西布伦；人们却嗤笑他们，嘲弄他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“跑信的人”或“使者”。希伯来语原词指奉命传递信息的人，可能强调他们快速赶路。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语在这里连用两个表示轻蔑的动词，意思是人们嗤笑并嘲弄这些信使。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: 驿使
  rationale: 该词源于“奔跑”，在这里指奉命迅速传递信息的人。“驿使”兼顾了受差遣传信和快速行程的含义；脚注保留“跑信的人、使者”等可能译法。
- source_word: עֹבְרִים מֵעִיר לָעִיר
  choice: 逐城而行
  rationale: 分词表达他们持续穿行，מֵעִיר לָעִיר具有从一城到另一城的分配性含义；“逐城而行”简洁地保留了这一点。
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: 在以法莲和玛拿西境内……直到西布伦
  rationale: 按原文保留行程的地理范围，并以“直到”明确表达 וְעַד 的终点意义。
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: 嗤笑他们
  rationale: 此处不是一般的欢笑，而是以人为笑柄、带有轻蔑意味的讥笑；“嗤笑”准确而自然。
- source_word: וּמַלְעִגִים בָּם
  choice: 嘲弄他们
  rationale: לעג 表达轻蔑的讥刺和戏弄；与“嗤笑”并列，保留原文两个近义动词叠加的力度。
- source_word: וַיִּהְיוּ ... מַשְׂחִיקִים ... וּמַלְעִגִים
  choice: 人们却不断嗤笑……嘲弄
  rationale: היה 加分词呈现持续或反复的行为，以“不断”保留其延续意味；“却”体现使者传信与众人反应之间的语义转折。
