translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“驿使”略带历史色彩，适合古代王命传递的语境；“逐城而行”保留持续穿行各城的画面。“人们”依上下文指各城听见信息的人，没有把其身份进一步具体化。
