  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַתָּ֕ה אַל תַּקְשׁ֥וּ עָרְפְּ/כֶ֖ם כַּ/אֲבוֹתֵי/כֶ֑ם תְּנוּ יָ֣ד לַ/יהוָ֗ה וּ/בֹ֤אוּ לְ/מִקְדָּשׁ/וֹ֙ אֲשֶׁ֣ר הִקְדִּ֣ישׁ לְ/עוֹלָ֔ם וְ/עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/יָשֹׁ֥ב מִ/כֶּ֖ם חֲר֥וֹן אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: zh_hans
  text: 现在，不要像你们的祖先那样硬着颈项。要向耶和华归顺[a]，到他分别为圣、直到永远的圣所来，事奉耶和华你们的上帝，好使他的烈怒转离你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把手给耶和华”，是表示归顺、顺服或效忠的习语。
    reason: 说明源语习语的字面意象及其可能含义。
  - marker: b
    text: 或译：“他的烈怒就会转离你们。”
    reason: 保留 וְיָשֹׁב 也可理解为结果性陈述的可能。
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 希伯来文有明确的时间副词 עַתָּה，因此译出“现在”，承接上下文并加强当前劝告的紧迫性。
- source_word: תַּקְשׁוּ עָרְפְכֶם
  choice: 硬着颈项
  rationale: 保留希伯来文“使颈项刚硬”的具体意象，表达固执抗拒；现代中文虽带经文色彩，仍清楚可懂。
- source_word: כַּאֲבוֹתֵיכֶם
  choice: 像你们的祖先那样
  rationale: 此处指先前世代。“祖先”比直译“父亲们”更准确地传达群体历史层面的所指。
- source_word: תְּנוּ יָד לַיהוָה
  choice: 向耶和华伸手
  rationale: 保留“给手”的源语意象，同时用较自然的中文表达；该习语含归顺、委身或效忠之意，脚注予以说明，避免正文过度释义。
- source_word: מִקְדָּשׁוֹ
  choice: 他的圣所
  rationale: מִקְדָּשׁ 指分别为圣的场所；“圣所”既准确，又不把所指不必要地缩窄为某一建筑部分。
- source_word: הִקְדִּישׁ לְעוֹלָם
  choice: 分别为圣、直到永远
  rationale: “分别为圣”传达使之圣洁、专归神圣用途的含义；“直到永远”直接反映 לְעוֹלָם。
- source_word: וְעִבְדוּ
  choice: 事奉
  rationale: עבד 用于人与上帝的关系时包括敬拜和服事；“事奉”保留这一较宽的盟约与敬拜含义。
- source_word: וְיָשֹׁב מִכֶּם
  choice: 好使……转离你们
  rationale: 在一连串命令之后，该分句自然表达所期望的结果；“好使”保留目的或结果色彩，不把它写成机械性的保证。
- source_word: חֲרוֹן אַפּוֹ
  choice: 他的烈怒
  rationale: 该希伯来习语描写怒气炽烈。“烈怒”以自然中文表达强烈怒气，避免生硬直译鼻孔发热的意象。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，使其与普通名词“主”有所区分。
theological_decisions:
- issue: 习语 תְּנוּ יָד לַיהוָה 的含义
  choice: 正文保留手的意象，译作“向耶和华伸手”
  alternative: “归顺耶和华”或“顺服耶和华”
  rationale: 原语可能指归顺、委身或作出效忠保证。正文保留重要意象，脚注交代其语用含义，避免只选定其中一种解释。
- issue: וְיָשֹׁב 在劝告序列中的语气
  choice: “好使他的烈怒转离你们”
  alternative: “他的烈怒就必转离你们”
  rationale: 该形式接续命令语气，可表达劝告所指向或期望的结果。“好使”保存这种张力，不将其强化为无条件、机械性的应许。
translation_notes:
  register: 采用庄重而现代的标准普通话。“硬着颈项”“圣所”“事奉”等保留经文所需的具体意象和宗教语域，同时句法力求普通读者易懂。正文所有脚注标记均与相应注释紧邻。
