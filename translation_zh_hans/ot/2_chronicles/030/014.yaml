base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: zh_hans
  text: 他们起来，除掉在耶路撒冷的祭坛，又除掉所有的焚香设施[a]，把它们扔进汲沦溪谷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有的香坛”“所有的香台”或“所有焚香的地方”。原文一词泛指与焚香有关的敬拜设施。
    reason: lexical_alternative
  - marker: b
    text: 原文也可译作“汲沦溪”或“汲沦河谷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 他们起来
  rationale: קום在此以叙事形式引出果断行动；“起来”既贴近原文，也符合现代汉语叙事表达。
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: 除掉
  rationale: 使役形在此意为移走、清除；“除掉”能体现对这些敬拜设施的废除与清理，并自然对应两次出现的动词。
- source_word: הַמִּזְבְּחוֹת
  choice: 祭坛
  rationale: 这是מִזְבֵּחַ的复数，通常指祭坛；上下文已说明这些是耶路撒冷城中被清除的敬拜设施，无须在正文另加性质限定。
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: 耶路撒冷的
  rationale: 以自然简洁的汉语表达原文“在耶路撒冷的”这一关系从句，同时保留其地点限定。
- source_word: הַמְקַטְּרוֹת
  choice: 焚香设施
  rationale: 该名词源于“焚香”词根，具体可指香坛、香台或焚香处。正文采用涵盖性较强的“焚香设施”，避免在原文含义未完全确定时过度具体化。
- source_word: וַיַּשְׁלִיכוּ
  choice: 扔进
  rationale: שׁלך表示投掷、抛入；“扔进”是自然的现代汉语，也保留了强力弃置的动作感。
- source_word: לְנַחַל קִדְרוֹן
  choice: 进汲沦溪谷
  rationale: נחל可指溪流、干河谷或带季节性水流的谷地；“汲沦溪谷”兼顾地貌含义和中文读者熟悉的地名形式。
