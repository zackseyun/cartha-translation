  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: zh_hans
  text: 希西家派人到全以色列和犹大[a]，又写信给以法莲和玛拿西，叫他们到耶路撒冷耶和华的殿来，为耶和华——以色列的上帝——守逾越节[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“遍及全以色列和犹大”。这里的希伯来语介词既可指信息传达的对象，也可强调差遣所遍及的范围。
    reason: lexical_alternative
  - marker: b
    text: “守逾越节”直译为“做逾越节”，是指遵守或举行逾越节的惯用说法。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: 动词本义为“差遣”；上下文表明所差遣的人负责传达召集信息。“派人”自然明确，又不过度限定使者身份。
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: 到全以色列和犹大
  rationale: 介词 עַל 在此可表示差遣所朝向的对象或遍及的范围；正文采用自然的方向表达，脚注保留范围性的可能。
- source_word: אִגְּרוֹת כָּתַב
  choice: 写信
  rationale: 简洁对应“写书信”，符合现代汉语习惯。
- source_word: עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: 给以法莲和玛拿西
  rationale: 此处 עַל 表示书信的收信对象或目标地区；译作“给”清楚自然。
- source_word: לְבֵית יְהוָה
  choice: 耶和华的殿
  rationale: 原文直译为“耶和华的家”；在耶路撒冷语境中指圣殿，汉语译作“殿”既准确又庄重。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中通行的专名形式呈现四字神名，区别于称号“主”。
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: 守逾越节
  rationale: 字面为“做逾越节”，是指遵守、举行这一节期的惯用语；“守逾越节”准确而简洁。
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 为耶和华以色列的上帝
  rationale: 前置“为”表达 לְ 的归属、献予或尊崇关系，同时保留“以色列的上帝”对耶和华的同位说明。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名，而非“主”这一称号。正文采用简体中文读者最熟悉的专名“耶和华”，不以称号替代。
- issue: לַיהוָה 所表达的关系
  choice: 为耶和华……守逾越节
  alternative: 向耶和华……守逾越节
  rationale: 介词 לְ 可表达节期是为耶和华而守、归于耶和华；“为”在现代汉语中自然，并未把其含义缩减为单纯受益关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“派人”补出差遣行为中自然包含的人员，但不具体称为使者；语序调整为“到耶路撒冷耶和华的殿来”，符合汉语表达。所有脚注标记均已置于正文相应位置。
