base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: zh_hans
  text: 那时他们不能守这节，因为祭司还没有充分地使自己分别为圣[a]，百姓也还没有聚集到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使自己分别为圣的祭司还不够多”。原文既可指祭司预备得不够充分，也可指完成这种预备的祭司人数不足。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: 不能
  rationale: 该动词表示能力；与否定词连用，译作“不能”，保留了无法实行而非仅仅不愿实行的含义。
- source_word: לַעֲשֹׂתוֹ
  choice: 守这节
  rationale: 原文直译为“行它”，代词按上下文指守逾越节。译作“守这节”既明确所指，也符合现代汉语对节期的常用表达。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 指前文所述原定守逾越节的时间；“那时”简洁自然，不额外加入原文没有明说的“指定”。
- source_word: הִתְקַדְּשׁוּ
  choice: 使自己分别为圣
  rationale: 该词在祭司礼仪语境中表示为履行圣职而自我洁净、分别为圣；此译法保留其礼仪和神圣用途层面的含义。
- source_word: לְמַדַּי
  choice: 充分
  rationale: 该副词表示达到足够的程度或数量。正文用“充分”贴近其程度义，同时以脚注保留“人数不够”的可能理解。
- source_word: נֶאֶסְפוּ
  choice: 聚集
  rationale: 该词在此表示众人集合；“聚集”自然准确，也避免把形式机械地译成被动语态。
- source_word: לִירוּשָׁלִַם
  choice: 到耶路撒冷
  rationale: 介词 לְ 具有方向性；“聚集到耶路撒冷”在现代汉语中自然地表达百姓前往该城集合。
theological_decisions:
- issue: לְמַדַּי 修饰的是分别为圣的程度，还是已分别为圣之祭司的数量
  choice: 正文译作“祭司还没有充分使自己分别为圣”
  alternative: “使自己分别为圣的祭司还不够多”
  rationale: 希伯来语表达紧凑，可按程度或数量理解。正文采用较贴近表面句法的程度义，脚注保留数量义，不把经文本身的歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“守这节”根据上下文明确指守逾越节；分号呈现不能按时守节的两个并列原因。
