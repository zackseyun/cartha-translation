base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: zh_hans
  text: 因为犹大王希西家给会众[a]一千头公牛、七千只羊[b]，众首领也给会众一千头公牛、一万只羊[b]；许多祭司也将自己分别为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “给会众”也可译作“为会众”；这里的希伯来介词在此语境中可作这两种理解。
    reason: lexical_alternative
  - marker: b
    text: “羊”所译的希伯来词可泛指群畜，包括绵羊和山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，为会众能延长守节并一同欢庆说明原因；译作“因为”自然保留其因果衔接。
- source_word: הֵרִים / הֵרִימוּ
  choice: 给
  rationale: 使役式在此指为会众的共同献祭提供牲畜，并非字面上的“举起”；“给”直接、自然，又不过度限定具体礼仪动作。
- source_word: לַקָּהָל
  choice: 给会众
  rationale: קהל 指聚集起来的共同体；介词 ל 可表示“给”或“为”，正文采用自然的“给会众”，并以脚注保留“为会众”的可能。
- source_word: פָּרִים
  choice: 公牛
  rationale: 该词在献祭语境中指牛类祭牲，复数阳性通常可明确译为“公牛”。
- source_word: צֹאן
  choice: 羊群牲畜
  rationale: צֹאן 是集合名词，可包括绵羊和山羊；译作“羊群牲畜”比单译“羊”更完整地保留其范围。
- source_word: הַשָּׂרִים
  choice: 众首领
  rationale: שׂרים 指身居领导地位的人；“众首领”在历代志的王国语境中庄重自然，又不误导为现代行政人员或世袭王子。
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  choice: 祭司也使自己分别为圣
  rationale: קדשׁ 的反身式表示祭司为礼仪服事使自己成圣或分别出来；此译保留反身意义和敬拜语境，不简化为一般性的洁净。
- source_word: לָרֹב
  choice: 许多
  rationale: 该短语表示数量众多；在汉语中将数量修饰语置于“祭司”之前最为自然。
theological_decisions:
- issue: 祭司的自我分别为圣是否应译作“自洁”
  choice: 使自己分别为圣
  alternative: 洁净自己／自洁
  rationale: 原词核心是“成为圣、分别出来”，虽可能包含礼仪洁净，但正文不将其缩窄为洁净程序，从而保留原文的礼仪与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“羊群牲畜”略带说明性，但能准确传达希伯来集合名词的广泛范围；分号呈现末句结果性的新重点。
