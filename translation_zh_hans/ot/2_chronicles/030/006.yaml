  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: zh_hans
  text: 于是，传令使者带着王和众首领发出的书信，走遍以色列和犹大，照王的命令宣告说：“以色列人哪，你们要归向耶和华——亚伯拉罕、以撒和以色列的神[a]，使他也转向那从亚述诸王手中逃脱、仍为你们存留的余民[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“以色列”，不是这一族长名字更常见的形式“雅各”。
    reason: 说明原文在族长名单中使用“以色列”，避免按常见公式协调为“雅各”。
  - marker: b
    text: “仍为你们存留的余民”也可译作“仍留给你们的逃脱者”。
    reason: 保留 לָכֶם 可表示“给你们／为你们”的开放关系，并说明 פְּלֵיטָה 指逃脱者或幸存者。
lexical_decisions:
- source_word: הָרָצִים
  choice: 驿使
  rationale: 该词字面指“奔跑的人”，在携送王室书信的行政语境中指奉命递送公文的使者；“驿使”简洁地保留其官方递送职能。
- source_word: בָּאִגְּרוֹת
  choice: 带着……书信
  rationale: אִגְּרוֹת 指书信或公文；介词 ב 在此表示伴随或所携之物，译为“带着……书信”符合现代汉语。
- source_word: מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: 王和众首领亲手交付的
  rationale: 保留“从……手中”所表达的直接授权和交付意味；שָׂרִים 在此指王廷领袖或官长，译作“首领”既宽泛又合乎历代志语域。
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: 走遍以色列和犹大
  rationale: 结合主语的移动行动，以“走遍”自然表达使命覆盖两地全境的意思。
- source_word: וּכְמִצְוַת הַמֶּלֶךְ
  choice: 照王的命令
  rationale: מִצְוָה 在这里是君王的指令，并非特指神圣诫命；“命令”准确而自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来文阳性复数“以色列的众子”，同时用“众子”形成庄重而可懂的呼语。
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: 归向耶和华
  rationale: שׁוב 在盟约劝告中兼有回转与归回之意；“归向”可自然表达关系和属灵方向上的回转，并与下文神的“转向”相呼应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行且可辨识的专名形式，而不以“主”这一称号替代。
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: 亚伯拉罕、以撒和以色列的神
  rationale: 原文明确写“以色列”而非更常见公式中的“雅各”，故不作协调改写。
- source_word: וְיָשֹׁב
  choice: 好让他也转向
  rationale: 命令式之后的未完成式可表达目的或结果；“好让”保留这一语气而不把结果断定为必然，“也转向”再现 שׁוב 的对应关系。
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: 你们中间那些……逃脱、存留下来的人
  rationale: פְּלֵיטָה 指逃脱灾难者，נשאר 指仍然存留者；整合为自然汉语，同时把 לָכֶם 理解为与受话群体相关、仍在他们中间的余民。
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: 从亚述诸王手中
  rationale: 保留“手中”这一权势和控制的形象；复数 מַלְכֵי 译为“诸王”。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用神的专名，不宜仅以称号代替。“耶和华”是简体中文普通读者最熟悉且明确作为专名使用的形式；“雅威”较接近现代学界重建读音，但在大众中文语境中通行度较低。
- issue: 是否把族长名“以色列”协调为“雅各”
  choice: 保留“以色列”
  alternative: 亚伯拉罕、以撒和雅各的神
  rationale: 尽管“雅各”是更熟悉的固定表达，本节希伯来文本明确为 יִשְׂרָאֵל；应保留这一有意措辞及其与“以色列众子”的呼应。
- issue: וְיָשֹׁב 的语气
  choice: 好让他也转向
  alternative: 他就必转向；愿他转向
  rationale: 该动词接在“你们要归向”的命令之后，可表示目的或结果，但并未以明确条件句保证结果；译文保留这种语法开放性和人与神彼此回转的张力。
- issue: לָכֶם 与余民的关系
  choice: 你们中间……的人
  alternative: 为你们存留下来的余民；留给你们的余民
  rationale: לָכֶם 可表示“给你们、属于你们、与你们相关”；正文采用自然的群体关联表达，脚注保留“为你们存留”的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”“照王的命令宣告说”保持历史叙事和王令口吻；呼语用“以色列众子啊”保留原文形式。正文两处脚注标记均已出现，并紧随相关语句。
