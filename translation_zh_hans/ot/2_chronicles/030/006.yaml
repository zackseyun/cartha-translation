revisions:
- from: 于是，驿使带着王和众首领亲手交付的书信，走遍以色列和犹大，照王的命令宣告说：“以色列众子啊，你们要归向耶和华——亚伯拉罕、以撒和以色列的神[a]，好让他也转向你们中间那些从亚述诸王手中逃脱、存留下来的人[b]。”
  to: 于是，传令使者带着王和众首领发出的书信，走遍以色列和犹大，照王的命令宣告说：“以色列人哪，你们要归向耶和华——亚伯拉罕、以撒和以色列的神[a]，使他也转向那从亚述诸王手中逃脱、仍为你们存留的余民[b]。”
  rationale: 修订避免把王室授权的“从……手中”译成“亲手交付”，以免增加原文未明说的动作；同时不以“你们中间”限定 לָכֶם。译文保留原文中“归向”与神“转向”的对应，也保留“以色列”这一不寻常的族长名。
