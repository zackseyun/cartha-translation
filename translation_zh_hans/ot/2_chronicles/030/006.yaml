  - severity: medium
    issue: “你们中间”把 לָכֶם 限定为地理或社群内部关系。
    rationale: לָכֶם 可指“给你们、为你们、留给你们”，原文没有明确说余民必定在受话者“中间”。正文宜保留较开放的“为你们存留／留给你们”，并可在脚注说明。
