  source_fidelity: 需修订。“亲手交付”把“从王和众首领手中”这一表示发出、授权的行政惯用语具体化为亲自交付，超出了原文。将 לָכֶם 译为“你们中间”也限定了原文较开放的“给你们／为你们留下”的关系。其余关键内容，包括“以色列”而非“雅各”、亚述“诸王”以及神人回转的对应，基本忠实。
  naturalness: “驿使”虽可理解，但容易唤起后世驿站制度，且“亲手交付的书信”不够贴合此处王室文书语境。改为“传令使者”和“王和众首领发出的书信”更自然、准确。
  terminology: 保留“耶和华”作为专名；“以色列人哪”是现代汉语中自然的呼语，并在不造成男性专指的情况下传达 בְּנֵי יִשְׂרָאֵל 这一对全体以色列民的称呼。以“余民”对应 הַפְּלֵיטָה，并以“逃脱、仍存留”呈现两个相连的存活语义。
