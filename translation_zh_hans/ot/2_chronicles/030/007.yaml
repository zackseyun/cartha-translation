base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: zh_hans
  text: 你们不要像你们的列祖和弟兄那样；他们对雅威——他们列祖的上帝——不忠，雅威使他们成为荒凉的景象[a]，正如你们所看见的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他们成为令人惊骇的景象”。这里的希伯来语既可表示荒凉毁坏，也可表示这种毁坏在人眼中造成的惊骇。
    reason: 保留שַׁמָּה兼有“荒凉”与“骇人景象”的词义幅度。
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: 你们不要像
  rationale: אַל加未完成式表达禁止；结合后面的比较结构，现代汉语用“不要像”最自然。
- source_word: כַאֲבוֹתֵיכֶם
  choice: 像你们的列祖
  rationale: אָבוֹת在此指先前世代；“列祖”既保留父系称谓，也清楚表达祖先之意。
- source_word: וְכַאֲחֵיכֶם
  choice: 和弟兄
  rationale: אָח可指亲兄弟或同族之人；“弟兄”保留原文的亲属与圣约群体色彩，不把范围过早限定为一般“同胞”。
- source_word: מָעֲלוּ
  choice: 不忠
  rationale: מעל在与上帝关系的语境中表示背信、失信；“不忠”简洁传达其圣约背叛的含义。
- source_word: בַּיהוָה
  choice: 对雅威
  rationale: מעל与该介词连用时表示对某者不忠；“对雅威不忠”符合现代汉语习惯。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们列祖的上帝
  rationale: 较为直接地保留圣约公式，并与前面的“列祖”形成呼应。
- source_word: וַיִּתְּנֵם
  choice: 雅威就使他们沦为
  rationale: נתן与לְשַׁמָּה连用，表达使之处于某种结果状态；“使他们沦为”自然呈现这一结果，同时以“雅威”明确原文单数主语。
- source_word: לְשַׁמָּה
  choice: 一片荒凉
  rationale: שַׁמָּה可指荒凉毁坏，也可侧重由此形成的骇人景象；正文采用主要空间意象“荒凉”，脚注保留另一层语义。
- source_word: כַאֲשֶׁר אַתֶּם רֹאִים
  choice: 正如你们所看见的
  rationale: 保留原文对听众亲眼可见之现实的直接诉诸。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，保留其专名性质，而不以称号替代。
- issue: מעל所表达的关系性质
  choice: 对雅威不忠
  alternative: 得罪雅威／背叛雅威
  rationale: “不忠”保留圣约失信的关系性含义，又不把该词缩减为一般过犯或强化为仅具政治意味的背叛。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“列祖”“弟兄”保留原文的家族和群体修辞；破折号标明“他们列祖的上帝”是对雅威的同位说明。脚注标记置于其实际所说明的“荒凉”之后。
