  terminology: “雅威”“列祖”“弟兄”“不忠”“上帝”均恰当，且“对雅威不忠”准确表达מעל在圣约关系中的背信。脚注保留שַׁמָּה“荒凉”与“令人惊骇的景象”的词义幅度，处理适切。
