  text: גַּ֣ם בִּ/יהוּדָ֗ה הָֽיְתָה֙ יַ֣ד הָ/אֱלֹהִ֔ים לָ/תֵ֥ת לָ/הֶ֖ם לֵ֣ב אֶחָ֑ד לַ/עֲשׂ֞וֹת מִצְוַ֥ת הַ/מֶּ֛לֶךְ וְ/הַ/שָּׂרִ֖ים בִּ/דְבַ֥ר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: zh_hans
  text: 在犹大，神的手也临到他们，使他们同心[a]遵行王和众首领照着雅威的话所下的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同心”直译为“一颗心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: 在犹大……也
  rationale: 保留 גַּם 的添加意味，并自然承接上文；בִּיהוּדָה 按地点理解为“在犹大”。
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: 神的手临到他们
  rationale: 保留希伯来文“神的手”这一形象，表达神主动施加的能力和影响，而不进一步限定其作用机制。
- source_word: לָתֵת לָהֶם לֵב אֶחָד
  choice: 使他们同心
  rationale: לֵב אֶחָד 直译为“一颗心”，语境中指共同一致的意愿；“使他们同心”在现代汉语中自然，并保留神赐下合一意志的含义。
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: 遵行……所下的命令
  rationale: לַעֲשׂוֹת 在命令语境中指付诸实行；מִצְוַת 为单数，译作“命令”符合王室行政语境。
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: 王和众首领
  rationale: שָּׂרִים 指掌权者、官长或首领；“众首领”清楚自然，也避免把其现代化为特定官僚职称。
- source_word: בִּדְבַר יְהוָה
  choice: 照着雅威的话
  rationale: בִּדְבַר 在此表达王和首领的命令以雅威的话为依据、与之相符，而不只表示传达命令的工具。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神的专名，区别于作为称号的“主”。
theological_decisions:
- issue: “神的手临到他们”所表达的神圣行动性质
  choice: 明确归因于神主动使众人同心，同时不说明这种作用是否具有某种后来的系统神学机制。
  alternative: 弱化为“神帮助他们”，或强化解释为“神不可抗拒地迫使他们”。
  rationale: 原文把共同遵行命令的意愿直接归于神的手，但没有进一步界定神的主权行动与人的回应之间的机制，应保留这种张力。
- issue: 王和首领的命令与雅威之话的关系
  choice: 将“照着雅威的话”理解为修饰王和首领所下的命令，表明该命令以雅威的话为规范。
  alternative: 理解为百姓“照着雅威的话”来遵行命令。
  rationale: 希伯来语短语位置允许一定句法关联空间，但紧接“王和首领的命令”，最自然地说明该命令符合雅威的话；译文保持这一主要读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“临到”保留经文语体但仍易懂；“遵行”适合表达实际执行命令。专名 יְהוָה 译为“雅威”。
