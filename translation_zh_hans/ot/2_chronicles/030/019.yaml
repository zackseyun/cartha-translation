  text: כָּל לְבָב֣/וֹ הֵכִ֔ין לִ/דְר֛וֹשׁ הָ/אֱלֹהִ֥ים יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתָ֑י/ו וְ/לֹ֖א כְּ/טָהֳרַ֥ת הַ/קֹּֽדֶשׁ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: zh_hans
  text: 凡立定心意寻求上帝[a]——雅威，他列祖的上帝——的人，虽未按圣所所要求的洁净规定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”也可译为“圣处”。希伯来语 קֹדֶשׁ 在这里用于礼仪语境，所指具体圣所范围未完全确定。
    reason: 保留 הַקֹּדֶשׁ 在礼仪语境中与圣所相关的词义开放性，避免加入过于抽象的替代解释。
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: 凡……的人
  rationale: כָּל与带单数后缀的לְבָבוֹ在这里具有逐一分配的作用；用“凡……的人”自然表达“每一个这样的人”，并保留后文单数“他”的呼应。
- source_word: הֵכִין
  choice: 立定心意
  rationale: כון的使役形可表示预备、确立或使之定向；与“心”连用时，“立定心意”贴切表达有意识地使内心转向某一目标，且比单说“预备”更符合现代汉语习惯。
- source_word: לִדְרוֹשׁ
  choice: 寻求
  rationale: דרש以上帝为宾语时，可涵盖敬拜、求问和专心归向；“寻求”保留了这一宽广含义。
- source_word: הָאֱלֹהִים יְהוָה
  choice: 上帝——雅威
  rationale: 原文为同位结构，所寻求的上帝被明确认定为雅威；破折号既保留两个称谓，也清楚呈现同位关系。
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: 他列祖的上帝
  rationale: 单数后缀与前面的逐一分配结构相配；“列祖”自然保留祖先及圣约传统的意味。
- source_word: וְלֹא
  choice: 虽没有
  rationale: 此处连接词在语境中具有让步意味，将诚心寻求上帝与未合礼仪洁净标准并置；“虽没有”保留这种张力。
- source_word: כְּטָהֳרַת
  choice: 按……所要求的洁净礼仪
  rationale: כְּ表示依照某一标准，טָהֳרָה指礼仪性的洁净或洁净程序；“按……所要求的洁净礼仪”明确其规范性和礼仪语境，而不把它误解为一般卫生。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 在本章逾越节与礼仪洁净的语境中，קֹדֶשׁ很可能指神圣场所，即圣所；但也可能指圣物或神圣领域，故以脚注保留歧义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“主”代替神名
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其作为专名的功能，不以称号取代。
- issue: 诚心寻求与礼仪不洁之间的关系
  choice: 并列保留“立定心意寻求”与“未按洁净礼仪行事”
  alternative: 弱化礼仪上的欠缺，或让礼仪欠缺压倒内心的诚意
  rationale: 希伯来文刻意将内心取向和礼仪上的不合规定并置；译文不进一步断定二者在神学上如何权衡。
- issue: הַקֹּדֶשׁ 的所指
  choice: 正文译“圣所”，脚注保留“圣物/神圣领域”的可能
  alternative: 圣物；神圣领域
  rationale: 上下文支持圣所这一礼仪场所含义，但词本身并不只限于地点，因此不应无提示地排除其他解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立定心意”呈现希伯来语“使心坚定、定向”的习语；“洁净礼仪”避免把 טָהֳרָה 理解为一般清洁。正文使用破折号清楚标示“雅威”与“上帝”的同位关系。
