  text: אַךְ אֲנָשִׁ֛ים מֵ/אָשֵׁ֥ר וּ/מְנַשֶּׁ֖ה וּ/מִ/זְּבֻל֑וּן נִֽכְנְע֔וּ וַ/יָּבֹ֖אוּ לִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: zh_hans
  text: 然而，亚设、玛拿西和西布伦中有些人谦卑下来，来到耶路撒冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 此处与上一节许多人的讥笑和拒绝形成转折；“然而”自然表达逆势而行的对比，不取限制义“只是”。
- source_word: אֲנָשִׁים
  choice: 有些人
  rationale: 结合语境表达所列支派中的一部分人。希伯来语为阳性复数，但现代汉语一般无需在此明说性别；“有些人”准确而自然。
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: 亚设、玛拿西和西布伦中
  rationale: 介词表示这些支派中的来源；“中”既保留所属关系，也符合现代汉语表达。支派名采用通行中文译名。
- source_word: נִכְנְעוּ
  choice: 谦卑下来
  rationale: כנע 的尼法勒形在此可表示自我降卑或被折服；上下文是他们响应呼召并前往耶路撒冷，因此“谦卑下来”自然呈现主动回应，同时不过度增添具体的悔改术语。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא 在连续叙事中表示向目的地而来；“来到”简洁地连接其行动和目的地。
- source_word: לִירוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 方向由“来到”自然体现；地名采用通行中文译名。
theological_decisions:
- issue: נִכְנְעוּ 所表达的降卑是主动还是被动
  choice: 谦卑下来
  alternative: 被降卑；顺服下来
  rationale: 尼法勒语态容许“变得卑微/被折服”与反身性理解。此处随后主动来到耶路撒冷，支持“谦卑下来”，但译文不把它扩展为某一特定教义意义上的悔改。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“然而”承接上文形成鲜明转折；句式简洁，适合公开诵读。
