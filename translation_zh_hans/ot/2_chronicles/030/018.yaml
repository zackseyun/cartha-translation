source:
  edition: WLC
  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: zh_hans
  text: 因为民众中有一大群人，其中许多来自以法莲、玛拿西、以萨迦和西布伦；他们没有洁净自己，却不照所写的规定[a]吃了逾越节祭物。希西家便为他们祷告，说：“愿雅威这位良善者为……赎罪——”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不照所写的规定”直译为“不照所写的”。这里所指的是书面律法对守逾越节的规定。
    reason: lexical_alternative
  - marker: b
    text: 这句祷告在第19节继续；希伯来文本在本节末只写到“为”，句子尚未完成。
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: 民众中有许多人……许多人
  rationale: 保留两个表示数量众多的表达及其部分性含义，不把它强化为“多数人”；中文以重复维持原文的强调。
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: 来自以法莲、玛拿西、以萨迦和西布伦
  rationale: 按原文列出四个支派名称，并用现代汉语标点明确并列关系。
- source_word: לֹא הִטֶּהָרוּ
  choice: 还没有洁净自己
  rationale: 希特帕勒词形具有反身意义，且语境涉及礼仪洁净；此译法同时保留反身和祭礼色彩。
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: 吃了逾越节祭物
  rationale: הַפֶּסַח在此可指逾越节祭牲或相关祭餐；“祭物”使中文自然并保留范围，不限定为原文未明说的“羊羔”。
- source_word: בְּלֹא כַכָּתוּב
  choice: 不照所写的规定
  rationale: 直译为“不照所写的”；补出“规定”说明这里指书面律法的要求，而不具体指定某一条文。
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: 为他们祷告
  rationale: 直接表达希西家代表未洁净者祈求的含义，避免用神学色彩更强的“代求”替代普通祷告用语。
- source_word: יְהוָה הַטּוֹב
  choice: 良善的雅威
  rationale: 以音译保留神的专名，并把定冠词修饰的形容词自然地表达为“良善的”，不将其改成称号。
- source_word: יְכַפֵּר בְּעַד
  choice: 为……赎罪
  rationale: כפר在逾越节与洁净的祭礼语境中保留“赎罪”含义；本节止于介词בְּעַד，其宾语延至下一节，因此用省略号和破折号保留未完句法。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以头衔取代。
- issue: כפר的祭礼含义
  choice: 赎罪
  alternative: 赦免；遮盖
  rationale: 上下文涉及逾越节、礼仪洁净和代祷，采用“赎罪”保留祭礼语义，同时不进一步界定赎罪如何实现。
- issue: 本节末尾未完成的祷告
  choice: 保留“为……”的悬置结构
  alternative: 补作“为他们赎罪”
  rationale: 马所拉文本在בְּעַד之后分节，介词的宾语在下一节出现；不提前补入“他们”，以保存原文跨节延续的句法和释义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“洁净自己”“逾越节祭物”“赎罪”保留祭礼语域；以“……——”有意显示原文在分节处中断，而不是误补宾语。
