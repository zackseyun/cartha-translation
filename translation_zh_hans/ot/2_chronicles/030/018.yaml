  to: 因为民众中有一大群人，其中许多来自以法莲、玛拿西、以萨迦和西布伦；他们没有洁净自己，却不照所写的规定[a]吃了逾越节祭物。希西家便为他们祷告，说：“愿雅威这位良善者为……赎罪——”[b]
