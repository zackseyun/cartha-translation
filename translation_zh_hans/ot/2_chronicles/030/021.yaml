base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: zh_hans
  text: 在耶路撒冷的以色列人欢欢喜喜地守了七天除酵节；利未人和祭司天天用有力的乐器赞美雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有力的乐器”原文直译为“力量的器具”。此处“器具”通常理解为乐器；该短语也可译为“强有力的乐器”，其确切含义不完全确定。
    reason: 原文短语 בִּכְלֵי עֹז 含义不寻常；脚注保留其字面意思及适度的解释空间，避免将其限定为“响亮”。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... אֶת חַג הַמַּצּוֹת
  choice: 守了……除酵节
  rationale: עשה与“节期”连用，表示遵守、庆祝节期；“守节”是现代汉语圣经语境中自然且准确的表达。
- source_word: בְנֵי יִשְׂרָאֵל הַנִּמְצְאִים בִּירוּשָׁלִַם
  choice: 在耶路撒冷的以色列人
  rationale: הנמצאים字面为“被找到的”，在此语境中指身在或聚集于耶路撒冷的人；译成“在耶路撒冷的”自然简洁，也不额外限定他们原本的居住地。
- source_word: בְשִׂמְחָה גְדוֹלָה
  choice: 欢欢喜喜地
  rationale: 传达“大大喜乐”的程度，并符合现代汉语叙事表达。
- source_word: יוֹם בְּיוֹם
  choice: 天天
  rationale: 准确表达逐日、每天持续进行的分配意义。
- source_word: בִּכְלֵי עֹז
  choice: 用响亮的乐器
  rationale: 该短语字面为“用力量的器具”；在敬拜语境中很可能描写强劲、响亮的乐器声。“响亮的乐器”较自然，脚注保留字面及其他可能理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并保留其专名性质。
- issue: בִּכְלֵי עֹז 的语义
  choice: 响亮的乐器
  alternative: 有力的乐器；大有力量地用乐器
  rationale: 希伯来语结构含混，既可将עֹז修饰乐器，也可理解为演奏或赞美的力度。正文采用符合敬拜场景且自然的译法，脚注明确保留这种歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“欢欢喜喜地”自然表达强烈喜乐；“除酵节”“利未人”“祭司”沿用通行术语。脚注标记紧接相关短语，避免误指神名。
