  yaml_path: translation/ot/2_chronicles/030/002.yaml
  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: zh_hans
  text: 王和他的官员，以及在耶路撒冷的全体会众，共同商议决定在第二个月守逾越节[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“行逾越节”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: 共同商议决定
  rationale: 该词为יעץ的尼法勒式，在这里表示多人共同商议并形成决定。“共同商议决定”既保留商议过程，也表达最终决议，与复合主语相称。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 按原文保留头衔，不以具体人名“希西家”替换。
- source_word: וְשָׂרָיו
  choice: 和他的官员
  rationale: שָׂרָיו指王所属的高级官员或首领；“官员”在现代汉语中自然，也避免“王子”可能造成的亲属身份误解。
- source_word: וְכָל הַקָּהָל
  choice: 以及全体会众
  rationale: קָהָל指聚集起来的群体或大会。“全体会众”保留其共同体和集会含义，表达清楚而庄重。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷的
  rationale: 将地点短语自然地修饰“全体会众”，对应原文“在耶路撒冷”。
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: 守逾越节
  rationale: 字面为“行逾越节”，是指举行、遵守逾越节礼仪的惯用表达。“守逾越节”简洁自然，并保留节期遵行的含义。
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: 在二月
  rationale: 直接表达原文“在第二个月”；这里指历法中的第二月，并非现代公历二月。
theological_decisions:
- issue: 如何翻译“行逾越节”这一礼仪性惯用语而不增添解释
  choice: 守逾越节
  alternative: 举行逾越节；庆祝逾越节；行逾越节
  rationale: “守逾越节”兼顾现代汉语的自然程度与原文所含的遵行、举行节期之意；不把经文扩展为具体礼仪说明，也不将其单纯弱化为庆祝活动。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“共同商议决定”略作展开，以呈现尼法勒式动词在复合主语下所表达的共同商议与决议；“二月”按圣经历法语境理解为第二个月。
