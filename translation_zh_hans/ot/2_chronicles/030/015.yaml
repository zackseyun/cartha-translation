  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: zh_hans
  text: 他们在二月十四日宰了逾越节的祭牲[a]。祭司和利未人感到羞愧，就使自己分别为圣，并把燔祭带到耶和华的殿中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“逾越节”；这里指为逾越节所献的祭牲。
    reason: 说明原文以节期名称转指被宰杀的祭牲，并保留其表达特点。
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: 宰了
  rationale: שׁחט在祭祀语境中指宰杀牲畜；“宰了”自然、直接，也保留礼仪背景。
- source_word: הַפֶּסַח
  choice: 逾越节的祭牲
  rationale: 原文直译为“逾越节”，此处具体指被宰杀的逾越节祭牲；不限定为“羊羔”，以免超过该词本身的信息。
- source_word: נִכְלְמוּ
  choice: 感到羞愧
  rationale: כלם的尼法勒式表达蒙羞或羞愧；这里用现代汉语“感到羞愧”清楚呈现其内在反应。
- source_word: וַיִּתְקַדְּשׁוּ
  choice: 洁净自己
  rationale: קדש的反身形式在这里指为圣殿职事作礼仪上的自我预备；“洁净自己”符合上下文，也便于普通读者理解。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是指全牲焚烧献上的祭，采用通行且准确的圣经祭祀术语“燔祭”。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בֵּית在此指圣殿；“殿”比字面的“家”更自然。“耶和华”作为现代汉语圣经传统中对四字神名的通行音译。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。简体中文采用广为人知的传统音译“耶和华”，而不以“主”替代，从而保留专名性质。
- issue: וַיִּתְקַדְּשׁוּ 的礼仪含义
  choice: 洁净自己
  alternative: 使自己分别为圣
  rationale: 上下文涉及祭司和利未人恢复礼仪资格；“洁净自己”传达实际礼仪预备，但不扩展为特定宗派的成圣教义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句法按希伯来文事件顺序展开；祭祀术语保留“燔祭”，同时以“祭牲”和“洁净自己”减少古奥感。
