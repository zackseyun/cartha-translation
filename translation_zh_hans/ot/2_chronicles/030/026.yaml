  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: zh_hans
  text: 于是，耶路撒冷有极大的喜乐，因为自以色列王、大卫的儿子所罗门的日子以来，耶路撒冷从未有过这样的情形。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: 于是……充满了
  rationale: 叙事性连接词推进前文事件并引出其结果；结合地点和“喜乐”，译作“于是，耶路撒冷充满了”符合现代汉语表达。
- source_word: שִׂמְחָה גְדוֹלָה
  choice: 极大的喜乐
  rationale: 保留名词与形容词所表达的强烈、群体性的欢喜，同时采用庄重而易懂的现代汉语。
- source_word: בִּירוּשָׁלָם
  choice: 耶路撒冷
  rationale: 前一处地点成分融入“耶路撒冷充满了”这一自然汉语结构；末尾再次译出，以保留原文首尾呼应。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前述极大喜乐之所以格外显著的解释或依据。
- source_word: מִימֵי
  choice: 自……在位的日子以来
  rationale: 表达从所罗门时代延续到当前叙事时点的时间跨度；补入“在位”是根据紧接的王号作出的汉语明示。
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: 大卫的儿子所罗门
  rationale: 直接表达希伯来语属格结构，保留人物的家系身份。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 将同位称号置于人名前，符合自然汉语，并明确所罗门的王权身份。
- source_word: לֹא כָזֹאת
  choice: 从未有过这样的盛况
  rationale: 原文直译为“没有像这样的”；语境指逾越节庆典及其带来的群体欢喜。“盛况”自然补足省略内容，但不限定为某个单一动作。
