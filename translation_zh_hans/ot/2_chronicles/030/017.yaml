  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: zh_hans
  text: 因为会众中有许多人还没有使自己分别为圣[a]，利未人便负责替所有不洁净的人[c]宰杀逾越节的祭牲[b]，好使这些祭牲归给雅威为圣[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“还没有将自己奉献为圣”。原文使用“分别为圣”的词语，尽管这里直接涉及礼仪上的洁净。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“逾越节祭”，是复数；这里指逾越节所献的祭牲。
    reason: lexical_alternative
  - marker: c
    text: “不洁净”在这里指礼仪上不洁净。
    reason: clarification
  - marker: d
    text: 原文没有明说“使……归给雅威为圣”的宾语；按上下文，最自然地指逾越节的祭牲，也可能被理解为那些不洁净的人。
    reason: textual_ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: 会众中有许多人
  rationale: 表达聚集的群体中人数众多；“会众”符合敬拜聚会的语境，也是现代汉语中清楚庄重的说法。
- source_word: הִתְקַדָּשׁוּ
  choice: 使自己分别为圣
  rationale: 保留קדשׁ的成圣、归圣含义，不把它缩减为礼仪上的洁净；反身形式以“使自己”表达。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该支派及其礼仪职分群体的通行译名。
- source_word: עַל שְׁחִיטַת
  choice: 负责……宰杀
  rationale: 此处עַל表示承担职责；“负责宰杀”既自然，也准确传达礼仪性宰杀的责任。
- source_word: הַפְּסָחִים
  choice: 逾越节的祭牲
  rationale: 原文为复数，字面可作“逾越节祭”；上下文所指是逾越节所献的牲畜。“祭牲”不把牲畜种类限定为羊，也清楚表达其祭祀用途。
- source_word: לְכֹל לֹא טָהוֹר
  choice: 为所有不洁净的人
  rationale: טָהוֹר在此指礼仪上的洁净；“不洁净”保留经文的礼仪范畴，同时易于现代读者理解。
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: 好分别为圣，归给雅威
  rationale: 保留קדשׁ的归圣含义，并以省略宾语的汉语结构反映希伯来文未明说宾语这一点。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，而不以称号代替。
theological_decisions:
- issue: 逾越节语境中קדשׁ的礼仪与神学含义
  choice: 译作“使自己分别为圣”及“分别为圣，归给雅威”
  alternative: 译作“洁净自己”及“使之成为圣洁”
  rationale: 本节直接涉及礼仪资格，但קדשׁ并不等同于单纯的洁净。采用“分别为圣”可保留圣洁、归属与礼仪预备之间的张力。
- issue: לְהַקְדִּישׁ所省略的宾语
  choice: 正文不补出明确宾语，并用脚注说明歧义
  alternative: 明确补作“把祭牲分别为圣”或“使那些人分别为圣”
  rationale: 希伯来文没有明说宾语。祭牲是较近且符合宰杀语境的所指，但语法上也可能让人理解为那些不洁净的人；正文不强行消除这种含混。
- issue: כי与主句的逻辑关系
  choice: 用“因为……便……”表达原因与结果
  alternative: 逐字并列为“因为……，而利未人……”
  rationale: כי引出原因；现代汉语用“因为……便……”能清楚呈现该节与行动之间的因果，同时不改变其内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“分别为圣”保留敬拜语境中的术语色彩；“祭牲”比“逾越节羊羔”更贴近原文未注明牲畜种类的表达。脚注标记均置于相关词语之后。
