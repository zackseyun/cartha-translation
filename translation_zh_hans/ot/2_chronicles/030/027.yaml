base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: zh_hans
  text: 祭司，就是利未人，起来为百姓祝福；他们的声音蒙垂听，他们的祷告也上达到他在天上的圣洁居所。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 起来
  rationale: קום的Qal叙事形式表示起身或站起来；“起来”自然保留了祝福前的具体动作。
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: 祭司，就是利未人
  rationale: 将两个带定冠词的名词理解为同位关系，说明这些祭司是利未人，避免译成两个并列群体。
- source_word: וַיְבָרֲכוּ אֶת־הָעָם
  choice: 为百姓祝福
  rationale: ברך在此指向百姓宣告祝福；“为百姓祝福”符合现代汉语宗教语境，也不增加祝福的具体内容。
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: 他们的声音蒙了垂听
  rationale: 保留Niphal被动表达，不明说施事者；“蒙了垂听”在中文中自然传达祈祷获听的含义。
- source_word: תְפִלָּתָם
  choice: 他们的祷告
  rationale: 原文为单数集合性名词，带第三人称复数后缀；中文“他们的祷告”可自然表达共同的祈祷。
- source_word: לִמְעוֹן קָדְשׁוֹ
  choice: 上达他的圣所
  rationale: מָעוֹן意为居所、住处；在神圣语境中“圣所”简洁庄重，而“上达”表达祷告来到该处。
- source_word: לַשָּׁמָיִם
  choice: 就是天上
  rationale: 将末语理解为对“他的圣所”的同位定位；“就是天上”既保留独立成分，又避免生硬重复方向介词。
theological_decisions:
- issue: 是否明确补出神是垂听者
  choice: 采用被动式“他们的声音蒙了垂听”，不在正文补出“神”或“耶和华”
  alternative: 神听见了他们的声音
  rationale: 希伯来文使用被动形式，虽上下文暗示神是垂听者，却未在本分句明说；保留被动可避免增添原文未明示的主语。
- issue: “祭司”和“利未人”的关系
  choice: 按同位关系译作“祭司，就是利未人”
  alternative: 祭司和利未人
  rationale: 原文没有连接词，较自然地把“利未人”视为对“祭司”的进一步说明；并列翻译会引入两个群体。
- issue: “他的圣所”与“天上”的关系
  choice: 以“就是天上”表达同位或解释关系
  alternative: 到他的圣所，到天上
  rationale: 两个介词短语可理解为后者定位前者；中文以解释性同位表达较为自然，同时保留天上是神圣居所这一空间意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“蒙了垂听”“上达”保留经文的礼仪与祷告语域，但避免过度古雅；无脚注，因此正文不设脚注标记。
