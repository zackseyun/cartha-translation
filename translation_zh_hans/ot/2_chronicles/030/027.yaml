- from: 祭司，就是利未人，起来为百姓祝福；他们的声音蒙了垂听，他们的祷告也上达他的圣所，就是天上。
  to: 祭司，就是利未人，起来为百姓祝福；他们的声音蒙垂听，他们的祷告也上达到他在天上的圣洁居所。
  rationale: 修订仅校正“圣所”对מָעוֹן的词义偏移，并将“天上”自然地表达为神圣居所的定位；不补出垂听者，不改变祭司与利未人的同位理解，也不改变经文含义。
