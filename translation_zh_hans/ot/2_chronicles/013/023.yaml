  terminology: 人名“亚比雅”“亚撒”及地名“大卫城”一致且通行。“列祖同睡”是合宜的圣经惯用表达；“国中得享安宁”没有把“安静／安稳”过度限定为外交意义上的“和平”。脚注准确呈现“那地平静”的可行形式对应译法。
