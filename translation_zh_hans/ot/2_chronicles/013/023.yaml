base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: zh_hans
  text: 亚比雅与列祖同睡，人们把他葬在大卫城。他儿子亚撒接替他作王。在亚撒的日子，国中得享安宁十年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那地平静了十年。”
    reason: שָׁקְטָה הָאָרֶץ 也可较为形式对应地译为“那地平静”；脚注保留该词组在“安宁、平静”之间的词义幅度。
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与列祖同睡
  rationale: 这是希伯来语记述君王去世的惯用语。保留“同睡”的意象及庄重的圣经语体，不直接释作“去世”；“列祖”在现代中文圣经语境中也能自然表达先祖群体。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 人们把他葬在
  rationale: 原文为主动复数，主语未明确。“人们把他葬在”既保留主动结构，也不擅自指明安葬者。
- source_word: בְּעִיר דָּוִיד
  choice: 在大卫城
  rationale: “大卫城”是该地名在现代中文中的通行译法，准确反映原文的组合结构。
- source_word: וַיִּמְלֹךְ אָסָא בְנוֹ תַּחְתָּיו
  choice: 他儿子亚撒接替他作王
  rationale: וַיִּמְלֹךְ 表示作王、掌权，תַּחְתָּיו 表示取代前任的位置；“接替他作王”自然清楚地表达王位继承，又不额外加入“开始”等时相含义。
- source_word: בְּיָמָיו
  choice: 在亚撒的日子
  rationale: 原文直译为“在他的日子”。用“亚撒”消除中文代词可能产生的指代含混，同时保留原文以“日子”表述其时期的方式。
- source_word: שָׁקְטָה הָאָרֶץ
  choice: 国中得享安宁
  rationale: שָׁקְטָה 可指安静、安稳或不受扰乱；הָאָרֶץ 在此指亚撒统治之地。“国中得享安宁”自然表达全国免受扰乱的状态，但不将其强化为含义更具体的“和平”。
- source_word: עֶשֶׂר שָׁנִים
  choice: 十年
  rationale: 置于“得享安宁”之后即可自然表达持续时间，无须另加解释。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“与列祖同睡”保留原文死亡委婉语；其余部分避免过度古雅。脚注标记置于其实际说明的末句，而不是置于“与列祖同睡”之后。
