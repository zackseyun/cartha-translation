  source_fidelity: 译文准确对应希伯来原文的四个叙事分句：亚比雅与列祖同睡、未指明者将他葬于大卫城、其子亚撒继位，以及在亚撒时期那地安宁十年。“与列祖同睡”保留死亡委婉语；“人们把他葬在”恰当保留了原文未明主语的主动复数；“接替他作王”准确表达继位；“国中得享安宁十年”符合שָׁקְטָה הָאָרֶץ在此处指国家／境内安定的语境。
