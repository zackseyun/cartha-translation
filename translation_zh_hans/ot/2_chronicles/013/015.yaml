  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: zh_hans
  text: 犹大人呐喊起来。犹大人呐喊时，上帝在亚比雅和犹大面前击败了耶罗波安和全以色列。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: 呐喊起来／呐喊时
  rationale: רוע在战争语境中指高声呼喊、发出战斗呐喊；保留原文重复，同时用自然的现代汉语表达。
- source_word: נָגַף
  choice: 击败
  rationale: 该词在此表示上帝使敌军遭受打击并溃败；“击败”符合战事语境，也避免把含义限定为亲手击杀。
- source_word: לִפְנֵי
  choice: 使他们败在……面前
  rationale: 直译为“在……面前”，结合נָגַף表达战败于对方面前；增补“使他们败”以使汉语关系清楚。
theological_decisions:
- issue: 上帝在战果中的主动作用
  choice: 上帝击败了耶罗波安和全以色列
  alternative: 耶罗波安和全以色列败在……面前
  rationale: 原文明确以上帝为נָגַף的主语，因此保留上帝主动施行击打、使其战败的陈述。
- issue: 呐喊与上帝行动之间的关系
  choice: 犹大人呐喊时，上帝……
  alternative: 因为犹大人呐喊，所以上帝……
  rationale: בְּ加不定式表达时间背景；原文并未明确陈述因果关系，故不将其解释为呐喊导致上帝行动。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“犹大人”对应集合性单数אִישׁ יְהוּדָה，按群体理解；保留前后两次“呐喊”，体现希伯来文的强调和叙事节奏。
