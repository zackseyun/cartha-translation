  text: In the eighteenth year of King Jeroboam[a], Abijah became king over Judah.
translation:
  language: zh_hans
  text: 耶罗波安王[a]在位第十八年，亚比雅登基作犹大王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 列王纪上15:1的平行记载称他为“亚比央”；历代志此处作“亚比雅”。
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: 在位第十八年
  rationale: 这是君王纪年公式；现代汉语以“在位第十八年”自然、准确地表达按其统治年数纪年。
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: 耶罗波安王
  rationale: 介词ל在纪年公式中标明所依据的君王；按现代汉语语序与前语合译为“耶罗波安王在位第十八年”。人名采用通行圣经译名。
- source_word: וַ/יִּמְלֹךְ
  choice: 登基作……王
  rationale: 此处动词在叙事序列中表达开始执掌王权的进入性意义；“登基作王”比单说“统治”更清楚地体现即位。
- source_word: אֲבִיָּה
  choice: 亚比雅
  rationale: 按本节历代志的希伯来文形式אֲבִיָּה译作通行人名“亚比雅”，不以列王纪平行经文的异名替换。
- source_word: עַל יְהוּדָה
  choice: 作犹大王
  rationale: עַל与מלך连用表示治理某地；中文以“作犹大王”自然表达对犹大的王权。
theological_decisions: []
