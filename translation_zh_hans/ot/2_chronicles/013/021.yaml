base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: zh_hans
  text: 亚比雅日渐强盛[a]，又娶了十四个妻子[b]，生了二十二个儿子和十六个女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“变得强大”，也可理解为“使自己强盛起来”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“为自己取了十四个妻子”，意思是娶她们为妻。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: 日渐强盛
  rationale: 该词是חזק的Hitpael形式，在这里表示变得强大、强盛或稳固。“日渐强盛”自然地表达力量或地位有所增长，同时不把含义限定为军事或政治势力。
- source_word: אֲבִיָּהוּ
  choice: 亚比雅
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: 又娶了十四个妻子
  rationale: נשא与נשים连用是娶妻的惯用表达；“娶了十四个妻子”在现代中文中自然清楚。לוֹ所含“为自己”的意味已由“娶”及“妻子”体现，无须生硬直译。
- source_word: וַיּוֹלֶד
  choice: 生了
  rationale: ילד的Hiphil形式以男性为主语时表示生育、作父亲。“生了”是现代中文叙述子女数目时自然且准确的说法。
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: 二十二个儿子
  rationale: 按原文保留确切数目及男性子女的指称。
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: 和十六个女儿
  rationale: 按原文保留确切数目及女性子女的指称。
theological_decisions:
- issue: 对多妻婚姻的叙述
  choice: 客观译作“娶了十四个妻子”，不附加道德评价。
  alternative: 采用带有褒贬意味的措辞，或在正文中解释这种婚姻实践。
  rationale: 本节只记述亚比雅的行为和儿女数目，并未明确赞许或谴责；译文不应加入原文没有表达的伦理或教义判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“日渐强盛”保留原词可指力量、地位或稳固程度增长的宽度；全句按希伯来文叙事次序展开，同时避免文言化的“生了……子女”以外的古旧措辞。
