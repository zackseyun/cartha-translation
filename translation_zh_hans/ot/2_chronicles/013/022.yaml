base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: zh_hans
  text: 亚比雅其余的事迹、他的行事和言语，都记载在先知易多的米德拉什[a]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“注释”“阐释”，也可泛指“记载”。原文为“米德拉什”（מִדְרָשׁ），这里指一部带有考察或解释性质的书面作品，不一定是后来已经发展成熟的拉比米德拉什文类。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲבִיָּה
  choice: 亚比雅其余的事迹
  rationale: “其余”准确表达 יֶתֶר；王室史书的总结套语 דִּבְרֵי 在这里广指君王的事迹，而不只是言语。
- source_word: וּדְרָכָיו
  choice: 他的行事为人
  rationale: דֶּרֶךְ 的复数在此指生活道路和行为表现；“行事为人”在现代汉语中自然地传达这一含义。
- source_word: וּדְבָרָיו
  choice: 和言论
  rationale: 此处与“事迹”和“行事为人”并列，较可能特指亚比雅所说的话或留下的陈述；“言论”保留这一层区别。
- source_word: כְּתוּבִים
  choice: 都记在……中
  rationale: 该词表示内容已被写下；汉语史书语境中“记在……中”比直译“写在……中”更自然，同时没有改变书面记录之意。
- source_word: בְּמִדְרַשׁ
  choice: 《考释录》
  rationale: מִדְרָשׁ 在这里指经考察、阐释而成的书面作品。“考释录”兼顾其探究、解释和记录性质，并以脚注保留其他可能译法及历史语义范围。
- source_word: הַנָּבִיא עִדּוֹ
  choice: 先知易多的
  rationale: 按希伯来语属格关系，说明这部作品与先知易多有关，可能是其所作或归于他名下；译文不进一步断定具体编著方式。
theological_decisions: []
