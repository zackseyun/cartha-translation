base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: zh_hans
  text: 亚比雅和他的军兵给了他们沉重的一击[a]；以色列有五十万名精选的战士[b]阵亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“击打他们，给他们以重大的击打。”也可译作“使他们遭受沉重打击”或“给予他们沉重的一击”。
    reason: 说明מַכָּה רַבָּה与前置动词构成的同源表达，并保留自然的汉语替代译法。
  - marker: b
    text: 或译：“五十万名以色列的精壮战士”或“五十万名被选出的以色列战士”。
    reason: 说明אִישׁ בָּחוּר可指被选出的、精壮的男子；战事语境中指这类战士。
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: 重创了他们
  rationale: נכה在战争语境中表示击打、攻击；与后面的מַכָּה רַבָּה连用，表达使敌方遭受沉重打击。“重创”既自然，又保留具体的军事行动及其严重程度。
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: 亚比雅和他的军兵
  rationale: עַם字面为“人民、百姓”，但本节明确处于交战语境，所指是随亚比雅作战的人。“军兵”比“百姓”更符合现代汉语，同时不将其限定为现代编制意义上的军队。
- source_word: מַכָּה רַבָּה
  choice: 重创
  rationale: 该短语字面是“重大的击打”，可指沉重打击或严重杀伤。“重创”简洁地传达其战争语境中的力度；脚注保留较直译及更强调伤亡的译法。
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: 阵亡
  rationale: נפל与חֲלָלִים组合，字面为“作为被杀者倒下”，是战争叙事中表示战死的惯用说法。“阵亡”在现代汉语中准确而庄重。
- source_word: מִיִּשְׂרָאֵל
  choice: 以色列有
  rationale: 介词מִן指出这些阵亡者出自以色列一方。汉语用“以色列有……阵亡”自然表达其所属群体。
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: 五十万名
  rationale: 按马所拉文本直接翻译其明确数值，不在译文中缩减、象征化或改释。
- source_word: אִישׁ בָּחוּר
  choice: 精兵
  rationale: בָּחוּר可表示经挑选的、精锐的或正值壮年的男子；在军队人数的语境中，“精兵”自然表达被选拔出来参战的人员，脚注保留“精选出来的人”这一较贴近词形的译法。
theological_decisions:
- issue: 战役伤亡人数巨大
  choice: 按希伯来文本保留“五十万”
  alternative: 视为夸张修辞，或把“千”改解为宗族或军事单位
  rationale: 本节直接陈述该数目，现有文本没有明示应作象征性解释。翻译应呈现原文，不在正文中替读者解决历史或文本批判问题。
translation_notes:
  register: 采用庄重、简明的现代标准汉语。“重创”避免生硬复制希伯来语同源宾语结构；“阵亡”准确呈现战争语境。两个脚注标记均置于正文对应词语之后。
