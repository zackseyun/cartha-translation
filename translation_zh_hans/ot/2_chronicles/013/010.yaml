base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: zh_hans
  text: 至于我们，耶和华是我们的上帝；我们没有离弃他。事奉耶和华的祭司是亚伦的子孙，利未人则在履行职务。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“利未人在这工作中”，即正在从事他们所负责的服务。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: 至于我们
  rationale: 独立代词配合连词在上下文中形成对比，突出犹大与北国的不同；“至于我们”自然传达这一话语功能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”对应四字神名，保留其作为以色列之上帝名字的性质，而不改作称号。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 这里所指为单数的耶和华；该复数形态是指以色列之上帝的常规称谓。
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: 我们没有离弃他
  rationale: עזב可指离弃、抛弃；“离弃”保留盟约忠诚语境中的宗教分量，并可表达此前至今未曾背弃。
- source_word: מְשָׁרְתִים לַיהוָה
  choice: 事奉耶和华
  rationale: 分词表示持续承担礼仪职分；“事奉”适合祭司圣殿服事的语境，也保持现代中文的庄重自然。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的子孙
  rationale: 希伯来语直译为“亚伦的儿子们”，这里指承袭祭司职分的后裔；中文用“子孙”可自然准确地表达谱系群体。
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: 利未人也各尽其职
  rationale: 原文是省略系词的“利未人在工作中”，指他们正在承担所分派的圣殿事务；“各尽其职”以自然中文呈现该含义，但属于语境化表达，故加注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文圣经传统及现代普通读者更熟悉“耶和华”；此译名作为专名使用，不以“主”替代原文神名。
- issue: עֲזַבְנֻהוּ 的时态和盟约含义
  choice: 我们没有离弃他
  alternative: 我们未曾离弃他
  rationale: 完成式在此陈述持续有效的忠诚状态；“没有离弃”在现代汉语中既可回顾过去，也可涵盖当前结果，不强行限定为单一时态。
- issue: 亚伦后裔与祭司职分的关系
  choice: 事奉耶和华的祭司是亚伦的子孙
  alternative: 亚伦的儿子们作祭司事奉耶和华
  rationale: 保留原文的身份陈述，表明此处祭司属于亚伦谱系，同时不扩展为超出本节的教义论述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“至于我们”保留上下文的对比语气；分号和短句使宣告层次清楚。“各尽其职”自然表达利未人正在承担指定事务，脚注同时保留原文较简略的措辞。
