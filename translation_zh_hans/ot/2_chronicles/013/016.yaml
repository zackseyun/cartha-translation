id: 2CH.13.16
reference: 2 Chronicles 13:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּנ֥וּסוּ בְנֵי יִשְׂרָאֵ֖ל מִ/פְּנֵ֣י יְהוּדָ֑ה וַ/יִּתְּנֵ֥/ם אֱלֹהִ֖ים בְּ/יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: zh_hans
  text: 以色列人[a]从犹大人面前逃跑，神把他们交在犹大人手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他们的手中”；“手中”是指权势或控制之下。这里的“他们”指犹大人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: 逃跑
  rationale: נוּס在战争语境中指面对危险而逃走或溃退；“逃跑”简明自然，并保留动作的直接性。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文形式为“以色列的众子”，在此是指北方以色列军队的惯用群体称谓；现代汉语用“以色列人”最自然，字面形式另以脚注说明。
- source_word: מִפְּנֵי יְהוּדָה
  choice: 从犹大人面前
  rationale: מִפְּנֵי含“从……面前”的意思，在战事中表示面对对方而逃退；“犹大人”按语境表达作为交战群体的犹大，同时不把范围缩窄为特定军种。
- source_word: וַיִּתְּנֵם
  choice: 把他们交在
  rationale: נתן在军事语境中可表示把敌方交在另一方的权势之下；“把他们交在……手中”既贴近原文，又是自然的汉语表达。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本节使用אֱלֹהִים而非神圣名号יהוה，因此译作“神”，不译作“耶和华”。
- source_word: בְּיָדָם
  choice: 犹大人手中
  rationale: 原文为单数“手”加复数后缀，意为落在他们的权力或控制之下。汉语明确补出前文所指的“犹大人”，避免把“他们”误解为以色列人。
theological_decisions:
- issue: 神在战果中的主动作用
  choice: 神把他们交在犹大人手中
  alternative: 神容许他们落在犹大人手中
  rationale: 原文以神为נתן的主语，直接把战事结果归于神的行动；译文不将此弱化为单纯许可。
- issue: 以色列与犹大的群体称谓
  choice: 以色列人……犹大人
  alternative: 以色列的众子……犹大
  rationale: 这里对举的是北方以色列与犹大两方。现代汉语用“以色列人”和“犹大人”清楚自然；同时以脚注保留בְנֵי יִשְׂרָאֵל的字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“从……面前逃跑”和“交在……手中”保留希伯来文的战争叙事色彩；对可能产生指代歧义的复数代词则在正文中明确为“犹大人”。
