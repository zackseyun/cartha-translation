  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: zh_hans
  text: 如今，你们说要在耶和华的国面前逞强[a]；这国在大卫子孙手中[b]。你们人数众多，又有耶罗波安造给你们作神明的金牛犊[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逞强”或译“使自己强盛”或“显出强势”。
    reason: lexical_alternative
  - marker: b
    text: “在大卫子孙手中”是希伯来语的表达，指耶和华的国由大卫的后裔掌管或治理。
    reason: cultural_note
  - marker: c
    text: “作神明”或译“作神”。希伯来文用复数，带有针对耶罗波安所造牛犊偶像的论战意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: 竟想
  rationale: 该分词在此可表达当前的主张或意图；结合亚比雅责问的语气，译作“竟想”自然地传达其修辞力度，同时不把它限定为单纯的口头宣称。
- source_word: לְהִתְחַזֵּק לִפְנֵי
  choice: 在……面前逞强
  rationale: התפעל词形表达使自己强盛或显出强势，לִפְנֵי字面为“在……面前”。“在……面前逞强”保留力量和当面对抗的意象，也符合本段论战语境。
- source_word: מַמְלֶכֶת יְהוָה
  choice: 耶和华的国
  rationale: 忠实保留该重要神学表达：国度属于耶和华，而不是仅仅属于大卫王朝。
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: 在大卫子孙手中
  rationale: 保留希伯来文“在……手中”的形象；此处表示耶和华的国由大卫的后裔掌管或施行治理。
- source_word: הָמוֹן רָב
  choice: 人数众多
  rationale: 在军事对峙语境中，该短语强调人数上的优势；此译清楚自然。
- source_word: עֶגְלֵי זָהָב
  choice: 金牛犊
  rationale: 指耶罗波安所造、众所周知的崇拜物；“金牛犊”是现代汉语中明确而自然的表达。
- source_word: לֵאלֹהִים
  choice: 奉作神明
  rationale: 保留复数所指向的偶像含义及原文的讽刺性；“奉作”也容纳“作为／当作”与“给你们作神”的语义关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉且庄重的专名“耶和华”，明确将四字神名作为名字处理，而非泛称“主”。
- issue: 耶和华的国与大卫王朝的关系
  choice: “在大卫子孙手中、耶和华的国”
  alternative: “由大卫子孙统治的耶和华之国”
  rationale: 保留原文双重断言及其张力：国属于耶和华，同时在大卫子孙手中；不把“手中”完全解释成某一种治理理论。
- issue: 金牛犊被称为אֱלֹהִים
  choice: 奉作神明
  alternative: 给你们作神
  rationale: 复数在此带有针对偶像的论战意味。“神明”既能按所指使用集合性表达，也不会暗示这些偶像真实具有神性。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“竟想”体现亚比雅责问和讽刺的语气；“逞强”保留强弱对抗意象。句法略作重排以符合汉语信息结构，但保留“耶和华的国”与“在大卫子孙手中”之间的神学张力。所有脚注标记均置于对应正文之后。
