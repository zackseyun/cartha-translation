revisions:
- from: 你们不是赶走了雅威的祭司，就是亚伦的子孙和利未人，又像各地的民族那样为自己设立祭司吗？无论谁带着一头公牛犊和七只公绵羊来承接圣职[a]，谁就成了那些并不是神的祭司[b]。
  to: 你们不是赶走了雅威的祭司——亚伦的子孙和利未人——又像各地的民族那样为自己设立祭司吗？凡带着一头小公牛和七只公绵羊来承接祭司职分[a]的，就成为服事那些并非神明者的祭司[b]。
  rationale: 修订仅处理影响理解和句法关系的表达：以破折号避免“不是……就是……”的歧义；明确末句的祭司与“非神明者”的服事关系，同时不将其简化为单纯的“假神”；并将“公牛犊”调整为更自然的“小公牛”。脚注标记仍分别紧随所说明的授职习语和“并非神明者”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:57:08Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的反问、驱逐合法祭司与利未人、仿效列邦自行设立祭司、以一头小公牛和七只公绵羊取得祭司身份，以及对“非神”的论战性否定，均应保留。草稿主要问题在于“就是”既造成歧义，也会与“不是”构成汉语中常见的“不是……就是……”选择句式；末句“那些并不是神的祭司”则易理解为“那些祭司本身不是神”，没有表达其为非神明服务／所属的关系。
  naturalness: 修订以破折号处理同位说明，避免“不是……就是……”的误读；将末句改为“服事那些并非神明者的祭司”，使修饰关系明确且保持庄重、现代的普通话表达。“一头小公牛”也比“公牛犊”更自然。
  terminology: “雅威”“祭司”“利未人”“亚伦的子孙”均可保留。“承接祭司职分”准确传达“使手充满”的授职习语，且不把原文未明说的施事者强化为“自行授职”。“并非神明者”保留לֹא אֱלֹהִים对其神性的直接否定，脚注保留“假神”等较顺译法。
  issues:
  - severity: high
    issue: “雅威的祭司，就是亚伦的子孙和利未人”中的“就是”产生句法歧义。
    rationale: 在“你们不是……”之后出现“就是”，容易被读作“不是……就是……”的二选一格式；同时也不够清楚地表达原文中“雅威的祭司”与“亚伦的子孙和利未人”的并列／说明关系。
  - severity: high
    issue: “谁就成了那些并不是神的祭司”修饰关系不清。
    rationale: 该措辞通常会被理解为“祭司不是神”，而原文לְלֹא אֱלֹהִים所指的是祭司所服事或所属的敬拜对象并非神。应在中文中明确这一关系。
  - severity: low
    issue: “公牛犊”不够自然。
    rationale: “小公牛”是现代汉语中更通顺且同样准确的祭牲名称。
