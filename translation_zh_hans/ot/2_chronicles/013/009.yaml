source:
  edition: WLC
  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: zh_hans
  text: 你们不是赶走了雅威的祭司——亚伦的子孙和利未人——又像各地的民族那样为自己设立祭司吗？凡带着一头小公牛和七只公绵羊来承接祭司职分[a]的，就成为服事那些并非神明者的祭司[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“使他的手充满”，是授予或承接祭司职分的专门用语。
    reason: 说明正文所译“承接祭司职分”背后的希伯来语礼仪习语。
  - marker: b
    text: 也可译作“非神明的祭司”或“假神的祭司”；希伯来文直陈这些敬拜对象并不是真正的神。
    reason: 保留否定结构的其他可行译法及其论战性表达。
lexical_decisions:
- source_word: הֲלֹא
  choice: 你们不是……吗
  rationale: 保留预期对方承认事实的反问语气，也自然传达责备意味。
- source_word: הִדַּחְתֶּם
  choice: 赶走了
  rationale: 希菲勒形表示使人离开、驱逐；“赶走”准确且符合现代汉语。
- source_word: כֹּהֲנֵי יְהוָה
  choice: 雅威的祭司
  rationale: 按专名呈现四字神名，并直接保留所属关系。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的子孙
  rationale: 此处指亚伦祭司家系；“子孙”比仅指亲生儿子的“儿子”更准确地表达历代后裔。
- source_word: וְהַלְוִיִּם
  choice: 和利未人
  rationale: 保留亚伦祭司与利未人两类人的并列关系。
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: 为自己设立祭司
  rationale: עשה在此有任命、设立之意；“为自己”保留לָכֶם所含的自立意味。
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: 像各地的民族那样
  rationale: 自然表达与周边各地民族相仿的比较，不额外加入“异教”等解释性标签。
- source_word: כָּל הַבָּא
  choice: 无论谁……来
  rationale: 体现泛指单数结构，突出任何人都可前来的批评意味。
- source_word: לְמַלֵּא יָדוֹ
  choice: 承接圣职
  rationale: “使他的手充满”是祭司授职的专门用语；正文用通顺而庄重的汉语表达其礼仪含义，直译见脚注。
- source_word: בְּפַר בֶּן בָּקָר
  choice: 带着一头公牛犊
  rationale: 准确呈现作为授职所带来的幼公牛，并与“来”自然衔接。
- source_word: וְאֵילִם שִׁבְעָה
  choice: 和七只公绵羊
  rationale: “公绵羊”明确区别于泛称的羊，保留祭牲的种类和数目。
- source_word: וְהָיָה כֹהֵן לְלֹא אֱלֹהִים
  choice: 谁就成了那些并不是神的祭司
  rationale: 保留结果关系及原文对这些敬拜对象神性的直接否定，避免弱化成单纯类别名称“假神”。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术复原音译，保留专名性质。
- issue: לְלֹא אֱלֹהִים 是指“假神”还是直接否定其神性
  choice: 那些并不是神
  alternative: 假神；非神明
  rationale: 原文的否定结构具有论战锋芒，直接否认敬拜对象是真神；正文保留这种神学张力而不将其平滑为分类标签。
- issue: לְמַלֵּא יָדוֹ 是否明说为自行授职
  choice: 承接圣职
  alternative: 使自己的手充满；授予自己祭司职分
  rationale: 该短语是授职习语，但原文没有独立的反身代词；因此不额外断定是“自行授职”，同时由上下文“为自己设立祭司”保留其非法制度背景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公牛犊”“公绵羊”保持祭牲用语的具体性；反问句和重复的“谁”使责备与结果关系清楚。脚注标记均置于其实际所说明的短语之后。
