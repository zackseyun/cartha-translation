  rationale: 修订仅调整“米该亚”的通行中文人名形式，并将来源短语改为更明晰自然的汉语表达。正文仍严格保留马所拉文本的“米该亚、乌列的女儿、来自基比亚”，不与《列王纪上》的“玛迦”协调；末句继续采用不额外加入体貌意义的存在句译法。
