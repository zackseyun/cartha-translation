base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: zh_hans
  text: 他在耶路撒冷作王三年。他母亲名叫米该亚[a]，是来自基比亚的乌列的女儿。亚比雅和耶罗波安之间有战争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行经文《列王纪上》15:2称亚比雅的母亲为“玛迦”。希伯来语“女儿”有时也可泛指女性后裔，因此两处记载可能采用了不同的称名或家谱表达方式。
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: 作王
  rationale: 这是君王在位年限公式中的常用表达，既准确表达“统治、为王”，也符合现代汉语圣经叙事的庄重语体。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 自然地表达希伯来文“他母亲的名字是”这一家谱式固定用语，意义完整而不显生硬。
- source_word: מִיכָיָהוּ
  choice: 米该雅
  rationale: 按希伯来文此处的人名形式音译，不以《列王纪上》平行经文中的“玛迦”替换。
- source_word: בַת אוּרִיאֵל
  choice: 乌列的女儿
  rationale: 正文保留 בַת 最直接的“女儿”之义，不在译文中擅自解释为孙女或女性后裔。
- source_word: מִן גִּבְעָה
  choice: 基比亚人乌列
  rationale: 希伯来介词 מִן 表示来源；汉语以“基比亚人”自然表达乌列来自基比亚，并使修饰关系清楚。
- source_word: וּמִלְחָמָה הָיְתָה
  choice: 有战争
  rationale: 忠实表达原文简洁的存在句“战争存在”，不添加“爆发”“持续”等原文未明确说明的时态或体貌意义。
- source_word: בֵּין ... וּבֵין
  choice: 在……和……之间
  rationale: 直接表达双方彼此敌对的关系，符合希伯来文配对介词的结构与意义。
- source_word: אֲבִיָּה
  choice: 亚比雅
  rationale: 依《历代志》所用 אֲבִיָּה 的人名形式翻译，不引入《列王纪》传统中的另一名称形式。
theological_decisions:
- issue: 《历代志下》与《列王纪上》关于亚比雅母亲姓名的差异
  choice: 正文保留马所拉文本的“米该雅，是……乌列的女儿”
  alternative: 按《列王纪上》15:2协调为“玛迦”，或在正文中把“女儿”解释为“孙女／后裔”
  rationale: 翻译应呈现《历代志》希伯来文本本身，不在正文中消除平行记载之间的姓名或家谱张力。בַת 有时可泛指女性后裔，但本句表层意义仍是“女儿”，可能的协调解释仅置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“作王三年”保留君王纪年公式的简洁感；末句直译为“有战争”，避免加入原文未明说的持续性。脚注标记置于“米该雅”之后，使其与所说明的姓名差异直接对应。
