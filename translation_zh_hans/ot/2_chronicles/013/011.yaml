source:
  edition: WLC
  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: zh_hans
  text: 我们每天早晚向耶和华焚献燔祭，焚烧香料制成的香；又在洁净的桌子上陈设饼[a]，每天晚上点燃金灯台上的灯。因为我们谨守耶和华我们上帝的吩咐，你们却离弃了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陈设饼”原文直译为“摆列的饼”或“饼的摆列”；也可称为“同在饼”。
    reason: 保留מַעֲרֶכֶת לֶחֶם的字面重点，并标示传统相关名称。
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: 焚献
  rationale: 该词是קטר的使役形式，在祭祀语境中指使祭物在坛上焚烧、烟气上腾；“焚献”兼顾焚烧动作与献祭含义。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 直接音译圣名יהוה，并以“向”自然表达献祭的对象。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是עֹלָה在献祭语境中的标准汉语对应词，指在坛上全部焚烧的祭物。
- source_word: בַּבֹּקֶר בַּבֹּקֶר וּבָעֶרֶב בָּעֶרֶב
  choice: 每天早晚
  rationale: 希伯来语重复时间词，表示逐日、惯常进行；“每天早晚”在现代汉语中清楚自然，并保留规律性。
- source_word: וּקְטֹרֶת סַמִּים
  choice: 又献芬芳的香
  rationale: סַמִּים指芳香香料；“芬芳的香”自然表达由香料调制、用于礼仪的香。动词“献”依据前文祭司职务补出，使句意完整。
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: 摆好陈设饼
  rationale: מַעֲרֶכֶת强调有秩序的摆列；“摆好”保留这一动作。“陈设饼”是普通读者较易辨识的圣所用语，脚注同时说明原文直义及另一传统称谓。
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: 在洁净的桌上
  rationale: טָהוֹר在此具有礼仪洁净含义；“洁净”比单纯表示材质或外观的“纯净”更贴近语境。
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
  choice: 并使金灯台上的灯……点燃
  rationale: 将希伯来语名词结构转为自然汉语动作表达，保留金灯台、灯及燃点用途。
- source_word: כִּי שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה אֱלֹהֵינוּ
  choice: 因为我们谨守耶和华我们上帝所吩咐的职守
  rationale: שׁמר את־משׁמרת是“谨守职守、履行所托职责”的固定表达；补出“所吩咐的”说明该职守属于耶和华，而不改变命题。
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: 你们却离弃了他
  rationale: 保留第二人称复数的直接指责及与“我们谨守”之间的鲜明对比。
theological_decisions:
- issue: 圣所用饼的名称
  choice: 陈设饼
  alternative: 摆列的饼；同在饼
  rationale: 原文מַעֲרֶכֶת לֶחֶם直指“饼的摆列/摆列的饼”，而“陈设饼”在汉语圣经语境中简明可懂。脚注保留原文字面重点和另一传统称呼，避免把解释隐藏在正文中。
- issue: 圣名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用现代简体中文读者最熟悉的专名形式“耶和华”，将其作为名字呈现，而不以称号“主”替代。
- issue: מִשְׁמֶרֶת的责任归属
  choice: 耶和华我们上帝所吩咐的职守
  alternative: 对耶和华我们上帝的职守；耶和华我们上帝的吩咐
  rationale: 该短语既可侧重守卫、职责，也可侧重应遵守的规定。正文以“所吩咐的职守”兼顾两面，不把它缩减为纯粹法规或泛泛敬虔。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“每天早晚”自然传达希伯来语时间词重复所表达的逐日规律；后半句另保留“每天晚上”，对应原文再次出现的重复短语。句末用“谨守……职守／离弃”维持原文的对照和责备力度。
