base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: zh_hans
  text: 犹大人转过身来，只见前后都有战事；他们便向耶和华呼求，祭司也吹着号筒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ יְהוּדָה
  choice: 犹大人转身一看
  rationale: פנה表示转身或转向；“犹大”在这里集体指犹大军队。“转身一看”自然表达他们转身后突然发现局势的动作，但不额外说明是伏兵。
- source_word: וְהִנֵּה
  choice: 竟
  rationale: הִנֵּה引导突然而醒目的发现；现代汉语用“竟”在句中传达意外和紧迫感，比直译为“看哪”更符合叙事语境。
- source_word: הַמִּלְחָמָה פָּנִים וְאָחוֹר
  choice: 战事竟在他们前后展开
  rationale: 保留“战事”及“前后”的空间结构，表达军队两面临战的处境；避免直接增译原文未明说的“敌军”或“夹击”。
- source_word: וַיִּצְעֲקוּ לַיהוָה
  choice: 他们就向耶和华呼求
  rationale: צעק在此表示危急中向神发出的求告；“呼求”兼顾声音的迫切和祷告性质。
- source_word: וְהַכֹּהֲנִים מחצצרים בַּחֲצֹצְרוֹת
  choice: 祭司也吹响号筒
  rationale: חֲצֹצְרוֹת指礼仪及军事场合使用的直管号筒。“吹响”自然传达吹奏发声；“也”保留并列关系，不把祭司的行动仅处理为背景。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名“耶和华”，明确保留神名，而不以“主”替代；原文在此未要求对其发音作进一步判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用两个短句保持战场叙事的紧迫节奏；不增添“伏兵”“敌军”或“银号”等本节未明说的信息。
