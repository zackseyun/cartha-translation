revisions:
- from: 犹大人转身一看，战事竟在他们前后展开。他们就向耶和华呼求，祭司也吹响号筒。
  to: 犹大人转过身来，只见前后都有战事；他们便向耶和华呼求，祭司也吹着号筒。
  rationale: 修订将“转身”与“只见”分开，分别对应וַיִּפְנוּ与וְהִנֵּה，避免把语篇提示词过度实化为“看”的动作。以“前后都有战事”保留原文战事来自前后两方的表述，而不增添“展开”“伏兵”或“夹击”。“吹着号筒”反映祭司吹号与呼求同时进行的分词情状。
