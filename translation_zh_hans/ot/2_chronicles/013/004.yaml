  text: וַ/יָּ֣קָם אֲבִיָּ֗ה מֵ/עַל֙ לְ/הַ֣ר צְמָרַ֔יִם אֲשֶׁ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי יָרָבְעָ֥ם וְ/כָל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: zh_hans
  text: 亚比雅站在洗玛脸山上[a]；这山位于以法莲山区。他说：“耶罗波安和以色列众人哪，你们要听我说！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以法莲山区”或译“以法莲山地”。希伯来语的表达可指以法莲境内的丘陵山区或山岳地带。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 站在
  rationale: קום在叙事中可指起身或站立；这里随即发表公开讲话，“站在”自然地表达其位置和姿态，又不额外解作正式列阵。
- source_word: מֵעַל לְהַר
  choice: 在……山上
  rationale: 这一介词组合字面较复杂，但在此惯用地说明亚比雅位于山上；中文用“在……山上”清楚自然。
- source_word: צְמָרַיִם
  choice: 洗玛脸
  rationale: 按希伯来语地名音译，并采用现代中文圣经地名中较常见的形式。
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: 这山位于以法莲山区
  rationale: הַר在这里可指山地或山区，而不必是单独一座山峰；“以法莲山区”保留地域意义，脚注说明另一种较直译的理解。
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 标准叙事引语公式；中文补出主语，使句子顺畅明确。
- source_word: שְׁמָעוּנִי
  choice: 你们要听我说
  rationale: שמע的复数命令式带第一人称单数宾语后缀；此译保留直接而郑重的号召语气。
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: 耶罗波安和以色列众人哪
  rationale: 保留“以色列”这一民族—政治称谓，并以呼格助词“哪”自然表达直接称呼。
theological_decisions:
- issue: 分裂王国背景下יִשְׂרָאֵל的译法
  choice: 以色列众人
  alternative: 所有以色列人
  rationale: 原文直接使用“以色列”这一立约民族和国家名称。译作“以色列众人”既符合现代中文，又保留历代志作者在王国分裂背景下仍如此称呼北方群体所形成的政治与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“耶罗波安和以色列众人哪”保留公开讲话的郑重呼告；分号将站立地点与地理说明清楚分开。
