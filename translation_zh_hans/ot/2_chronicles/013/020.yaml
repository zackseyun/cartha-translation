base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: zh_hans
  text: 亚比雅在位期间，耶罗波安不再拥有实力；耶和华击打他[a]，他就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他受苦”或“降灾于他”。希伯来文只说耶和华“击打”耶罗波安，没有说明具体方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: 没有力量
  rationale: 该短语直译涉及“保持、持有力量”。结合否定词和עוֹד，表示耶罗波安未能继续保有实力；中文用“再也没有力量”自然表达这一状态，同时不把含义局限为某一场军事胜负。
- source_word: עוֹד
  choice: 再也没有
  rationale: 在לֹא的否定结构中，עוֹד表示“不再、再也不”，故与“没有力量”合译为“再也没有力量”。
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: 亚比雅在位期间
  rationale: 这是表示时间的惯用语，可指某人的生平或统治时期；本处君王叙事语境下，“在位期间”清楚自然。
- source_word: וַיִּגְּפֵהוּ
  choice: 击打他
  rationale: נגף可指击打、降灾或使人受创。采用宽泛的“击打”，保留原文没有说明具体方式的含混性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语域中广为人知的专名“耶和华”呈现四字神名，而非以称号替代。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: 按希伯来叙事顺序表达后续事件。“就”连接前后动作，但不额外断定击打的具体手段或死亡发生的速度。
theological_decisions:
- issue: 耶和华“击打”耶罗波安的性质及其与死亡的关系
  choice: 直接陈述耶和华击打他，随后他死了，但不说明击打的具体方式。
  alternative: 明确译为耶和华使他患病、降瘟疫，或当场将他击杀。
  rationale: 原文把耶罗波安遭击打并死亡归于耶和华的行动，却没有交代这是疾病、灾祸、战伤还是其他方式；译文保留这种神学主张及其未说明之处。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“亚比雅在位期间”符合历史叙事语域；“再也没有力量”通俗清楚，并保留“力量”可能兼指权势、实力或能力的宽度。
