  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: zh_hans
  text: 那时，以色列人被制伏；犹大人占了上风，因为他们倚靠耶和华——他们列祖的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: 被制伏
  rationale: כנע的尼法勒式表达被置于臣服、受压制或降卑的结果；战事语境中“被制伏”既保留被动含义，也不额外断言彻底溃败。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这里指与犹大交战的北国以色列一方；现代汉语用“以色列人”自然准确，无须机械译作“以色列的儿子们”。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 简洁、自然地表达叙事中的特定时间。
- source_word: וַיֶּאֶמְצוּ
  choice: 强盛起来
  rationale: אמץ在此表示变得强大、占据优势；“强盛起来”保留词义本身，并由军事上下文呈现取胜之意，避免直接增译为“得胜”。
- source_word: בְנֵי יְהוּדָה
  choice: 犹大人
  rationale: 与“以色列人”形成自然、清楚的平行，指犹大一方的人众。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达后句是犹大强盛的原因。
- source_word: נִשְׁעֲנוּ עַל
  choice: 倚靠
  rationale: שען על本义为倚在、靠在某者之上，引申为依赖；“倚靠”在现代中文中自然，并保留这一形象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语域中广为人知的专名“耶和华”呈现四字神名，不以称号替代。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们列祖的上帝
  rationale: 忠实保留复数“父祖”及其祖先、盟约关联；“列祖”比泛称“祖先”更贴近原文男性复数及庄重经文语域。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文采用读者熟悉且具有专名功能的“耶和华”，而不以“主”这一称号替换；“雅威”是另一种较贴近学术重构发音的音译。
- issue: 犹大强盛与倚靠上帝的因果关系
  choice: 用“因为”明确保留因果关系
  alternative: 用较弱的连接词“原来”或“因”
  rationale: כִּי在本句说明犹大一方强盛的原因；译文不将这层神学叙述弱化，也不进一步解释倚靠如何带来战果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“却”补出两方结局的鲜明对照；不添加脚注，因为本节的词义与句法可在正文中清楚表达。
