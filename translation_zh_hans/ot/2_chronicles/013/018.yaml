  - severity: low
    issue: 神名与同位语之间缺少界标。
    rationale: “耶和华他们列祖的上帝”容易显得语法粘连；以破折号明确“他们列祖的上帝”是对“耶和华”的说明，不改变原义。
  revised_text: 那时，以色列人被制伏；犹大人占了上风，因为他们倚靠耶和华——他们列祖的上帝。
