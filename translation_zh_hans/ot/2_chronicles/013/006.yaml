base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: zh_hans
  text: 尼八的儿子耶罗波安，是大卫的儿子所罗门的臣仆；他起来反叛他的主人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的主上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום的Qal叙事形式在这里引出耶罗波安开始反抗的行动；“起来”保留原文动作感，又不把含义限缩为军事起事。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 采用现代中文圣经人名惯例，并按希伯来语亲子结构明确表达其父名。
- source_word: עֶבֶד
  choice: 臣仆
  rationale: עבד可指奴隶或仆人；在王室政治语境中，“臣仆”自然表达耶罗波安对所罗门的从属关系，同时避免误导为单纯家奴身份。
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: 大卫儿子所罗门
  rationale: 依中文惯用译名处理专名，并保留原文对大卫王朝血统的强调。
- source_word: וַיִּמְרֹד
  choice: 背叛
  rationale: מרד通常指反抗合法权威；“背叛”符合此处政治语境，也能自然地与“主上”搭配。
- source_word: עַל אֲדֹנָיו
  choice: 背叛了他的主上
  rationale: אדון加第三人称单数后缀在此指所罗门这位人间上级；“主上”既体现君臣等级关系，也避免与神的称号混淆。
theological_decisions:
- issue: 人间称谓אֲדֹנָיו的译法
  choice: 他的主上
  alternative: 他的主人
  rationale: 此处所指是所罗门，并非神的名字或称号。“主上”保留政治权威与君臣关系；“主人”在词义上也成立，但可能更容易让现代读者联想到家内或奴仆关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“原是……却……”自然呈现其臣属身份与背叛行为之间的反差；脚注保留אדון在此可译作“主人”的词汇可能性。
