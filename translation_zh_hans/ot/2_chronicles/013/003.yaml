base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: zh_hans
  text: 亚比雅率领四十万精兵投入战斗[a]，他们都是英勇的战士；耶罗波安也率领八十万精兵列阵迎战他，他们都是勇猛善战的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “投入战斗”所译的希伯来语习语，字面意思是“把战斗捆绑起来”，意即交战。
    reason: lexical_alternative
  - marker: b
    text: “勇猛善战的人”所译的希伯来语军事称谓，指勇敢而有作战能力的人。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: 投入战斗
  rationale: 动词אָסַר通常指“捆绑”，但与“战斗”连用时构成军事习语，表示交战或投入战斗；此译法自然清楚，同时以脚注保留其字面意象。
- source_word: בְּחַיִל
  choice: 率领……精兵
  rationale: חַיִל在这里指军队或兵力；结合后面的兵员数目，译作“率领……精兵”符合汉语军事叙述。
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: 英勇的战士
  rationale: 该短语指强健、善于作战的军人；“英勇的战士”既保留力量感，也明确其军事身份。
- source_word: בָּחוּר
  choice: 精兵
  rationale: 此处指经过挑选、素质出众的战士；“精兵”比直译“被选中的人”更符合现代汉语军旅语境。
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: 列阵迎战他
  rationale: עָרַךְ在军事语境中表示部署、排列军队；“列阵迎战”同时表达布阵和敌对交战的含义。
- source_word: גִּבּוֹר חָיִל
  choice: 勇猛善战的人
  rationale: 这一常见军事称谓表示有勇力、有能力的战士；此译法自然传达其勇武和作战能力，不把חַיִל在此处误解为财富。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“投入战斗”和“列阵迎战”分别保留原文两个不同军事表达的侧重点；两组庞大兵员数字按马所拉文本直译，不作历史性调整。
