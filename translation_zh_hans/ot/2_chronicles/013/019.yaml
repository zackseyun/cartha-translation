  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: zh_hans
  text: 亚比雅追赶耶罗波安，从他手中夺取了几座城邑：伯特利及其附属村镇、耶沙拿及其附属村镇，以及以弗仑及其附属村镇。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: 所属的乡镇
  rationale: 字面为“她的女儿们”，在城邑语境中指隶属于中心城的周边村镇；译为“所属的乡镇”既传达行政从属关系，也符合现代汉语表达。
- source_word: עָרִים
  choice: 几座城
  rationale: 原文明确以复数“城”统领随后列举的三座中心城，汉语加“几座”使句法自然，又不限定超出上下文的确切数目。
- source_word: עפרון
  choice: 以法莲
  rationale: WLC正文无元音拼写为עפרון；传统马所拉读法及多数对译支持此处作“以法莲”（Ephron/Ephrain的地名传统存在异文），故正文采用较常见的中文地名形式，并以脚注保留文本差异。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。“从他手中夺取”准确表达מִמֶּנּוּ的对象关系；“所属的乡镇”避免直译“女儿城”造成误解。
