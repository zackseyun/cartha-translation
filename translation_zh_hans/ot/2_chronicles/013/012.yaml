language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: zh_hans
  text: 看哪，上帝在我们中间，作我们的元首；他的祭司手持号筒，要向你们吹响战号。以色列子孙[a]啊，不要与耶和华——你们祖先的上帝争战，因为你们必不能得胜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来文直译为“以色列之子”，这里是对以色列民众的直接称呼。
    reason: 说明原文的阳性复数亲属称谓及其在语境中的群体性用法。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意、加强语气的讲话标记，也符合庄重而自然的现代汉语。
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: 上帝与我们同在，率领我们
  rationale: בָרֹאשׁ直译为“在首位／在前头”，在这里表达上帝居首带领；译为“率领我们”自然呈现其领导和先锋意象。
- source_word: וְכֹהֲנָיו
  choice: 他的祭司也在这里
  rationale: 第三人称单数后缀指向上帝；补出“在这里”承接“与我们同在”的省略结构，使汉语清楚流畅。
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: 拿着发出战号的号筒
  rationale: חֲצֹצְרוֹת指号筒，תְּרוּעָה在军事语境中指呼喊、警报或战斗信号；“战号”保留军事功能。
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: 要吹号攻击你们
  rationale: 目的不定式与前面的名词短语分开处理；הָרִיעַ表示发出响亮信号，עֲלֵיכֶם在此表敌对方向。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留“以色列之子”的亲属与盟约称谓，同时用现代中文圣经语域中可理解的表达。
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: 不要与耶和华……争战
  rationale: 否定命令直接有力；עִם在לחם之后表示争战的对象，汉语用“与……争战”。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: 你们祖先的上帝
  rationale: 准确表达关系结构；“祖先”在现代普通话中比仅指男性的“列祖／父辈”更自然，并涵盖此处承袭的先辈意义。
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: 因为你们必不能得胜
  rationale: צלח的使役形可指成功、顺利；军事语境下“得胜”准确传达此处不会成功的具体指向。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名；“耶和华”是现代简体中文读者最熟悉且可直接识别为专名的传统音译，不以“主”替代神名。
- issue: בְּנֵי יִשְׂרָאֵל所指群体的性别与范围
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 原文形式是阳性复数“以色列之子”，但在此作为对北方以色列群体的盟约性称呼；正文保留亲属称谓，脚注说明其群体范围，避免误解为只对男性说话。
- issue: 上帝“在首位”的含义
  choice: 率领我们
  alternative: 在我们前头
  rationale: 原文意象兼有居首、领导和在前方之义；正文采用自然的功能性表达，不进一步断定具体空间位置。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“看哪”“争战”保持宣告与劝戒的修辞力度；其余措辞避免古奥。将名词短语“发出战号的号筒”与目的动作“要吹号攻击你们”分别表达，以保留希伯来文的结构层次。
