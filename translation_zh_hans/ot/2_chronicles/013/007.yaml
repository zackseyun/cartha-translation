revisions:
- from: 有一群无用之人，就是彼列之子[a]，聚集到他那里；他们压过了所罗门的儿子罗波安。那时罗波安年轻，心志软弱，没有刚强起来抵挡他们。
  to: 有一群无用之徒，就是彼列之子[a]，聚集到他那里；他们胜过了所罗门的儿子罗波安。那时罗波安年轻，心志软弱，没有刚强起来抵挡他们。
  rationale: 仅作两处安全的措辞修订：“无用之徒”使贬义更自然明确；“胜过了”更准确表达这些人相对于罗波安显出强势、占了上风，且不额外加入“压制”的动作意味。脚注及其锚点维持不变。
