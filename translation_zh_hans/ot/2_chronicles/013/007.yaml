  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: zh_hans
  text: 有一群无用之徒，就是彼列之子[a]，聚集到他那里；他们胜过了所罗门的儿子罗波安。那时罗波安年轻，心志软弱，没有刚强起来抵挡他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼列之子”也可意译为“恶徒”或“无赖之徒”。“彼列”在这里可能是表示卑劣、邪恶的用语，也可能带有拟人化称谓的色彩。
    reason: 保留原文习语的形式及其词义歧义，同时为现代读者说明其实际贬义。
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: 聚集到他那里
  rationale: קבץ与עַל连用，在此既可指聚集在某人周围，也可能带有联合行动的意味。译文保留他们聚集到耶罗波安那里的图景，不额外明说其政治动机。
- source_word: אֲנָשִׁים רֵקִים
  choice: 无用之人
  rationale: רֵקִים字面意为“空的”，用于人时指无价值、无品格之辈。“无用之人”保留原文的贬义，也与后面的同位语保持区别。
- source_word: בְּנֵי בְלִיַּעַל
  choice: 彼列之子
  rationale: 按原文形式保留这一习语，以免预先断定בְּלִיַּעַל在此是专名还是表示邪恶、卑劣的抽象词；脚注提供现代汉语的意译。
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: 他们压过了
  rationale: התאמץ在此表示显出强势，介词עַל带出对抗或占优势的关系。“压过了”以自然汉语表达他们相对于罗波安占了上风。
- source_word: נַעַר
  choice: 年轻
  rationale: נַעַר可指少年或年轻人；此处是亚比雅陈述中的相对性描述，不宜译成字面意义过强的“少年”。
- source_word: רַךְ לֵבָב
  choice: 心志软弱
  rationale: 字面为“心柔软”，在政治对抗语境中指意志不坚定，而不是仁慈或富有同情心。
- source_word: לֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: 没有刚强起来抵挡他们
  rationale: 保留חזק“使自己刚强”的主动意味及未然陈述；“抵挡他们”自然表达לִפְנֵיהֶם在此语境中的对抗关系，而不改成表示能力不足的“不能”。
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל的性质
  choice: 正文译作“彼列之子”
  alternative: 恶徒；无赖之徒
  rationale: 该词组既可视为固定的贬义习语，也可能保留“彼列”作为拟人化称谓的色彩。正文保存形式上的歧义，脚注说明其习语意义，不把它明确处理为某一恶灵的专名。
- issue: 罗波安“年轻”的叙事表述
  choice: 保留“年轻”
  alternative: 少不更事；缺乏经验
  rationale: 原文直接使用נַעַר。虽然这里可能意在强调不成熟，但正文不把这种语用含义提升为明确断言，也不试图依据罗波安的实际年龄修正发言者的说法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“压过了”避免生硬直译“使自己刚强攻击”，而末句保留“刚强起来”，呈现原文חזק词根的意味。“彼列之子”较为陌生，故以脚注释义。
