  yaml_path: translation/ot/2_chronicles/013/013.yaml
  text: But Yarobam had turned the ambush around to come behind them, so they were in front of Judah, and the ambush was behind them.
translation:
  language: zh_hans
  text: 耶罗波安却调动伏兵，绕到他们后面；这样，以色列军队在犹大人前面，伏兵在他们后面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרָבְעָם
  choice: 耶罗波安
  rationale: 采用现代中文圣经读者熟悉的人名译法，指北国以色列王。
- source_word: הֵסֵב אֶת־הַמַּאְרָב
  choice: 调动伏兵，绕到
  rationale: הֵסֵב 表示使其转向或迂回，הַמַּאְרָב 指伏兵；这一译法自然呈现伏兵被调往敌后。
- source_word: לִפְנֵי יְהוּדָה
  choice: 以色列军队在犹大人前面
  rationale: 原文主语仅为复数“他们”，依上下文指耶罗波安率领的以色列军队；明示所指可避免中文误解，同时保留前后夹击的布局。
- source_word: מֵאַחֲרֵיהֶם
  choice: 在他们后面
  rationale: 直译空间关系，所指为犹大人。
