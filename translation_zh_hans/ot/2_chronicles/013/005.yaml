source:
  edition: WLC
  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: zh_hans
  text: 你们岂不知道，耶和华——以色列的上帝——凭着盐约[a]，把统治以色列的王权永远赐给大卫和他的子孙[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盐约”直译为“盐的约”。这个说法很可能表示具有约束力、长久有效的约；参民数记18:19。
    reason: 保留希伯来语盟约惯用语的字面意象，并以审慎说明交代其可能含义，避免把立约程序解释进正文或脚注。
  - marker: b
    text: 原文直译为“他的儿子们”。这里指大卫王室承继王位的后裔，即大卫王朝的世系。
    reason: 说明王室承继语境中“儿子们”可指延续的王室后裔，而非仅限大卫第一代儿子。
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  choice: 你们岂不知道……吗
  rationale: 保留期待听众赞同、并带有质问意味的反问语气；“你们”准确反映复数第二人称。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文中广为人知的专名形式音译四字神名，保留其作为以色列之上帝专名的功能，而不以称号代替。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现希伯来语属格结构，说明耶和华与以色列的关系。
- source_word: נָתַן מַמְלָכָה
  choice: 把……王权……赐给了
  rationale: מַמְלָכָה在此侧重授予大卫统治以色列的王权，而非仅指疆域；“赐给”也自然表达上帝授予权柄。
- source_word: עַל יִשְׂרָאֵל
  choice: 统治以色列的
  rationale: עַל在王权语境中表示对以色列的统治，使中文明确而不增加额外解释。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 保留原文关于这一王权持久性的强烈盟约表述，不预先限定其神学实现方式。
- source_word: לוֹ וּלְבָנָיו
  choice: 归给他和他的子孙
  rationale: “他”保留原文对大卫本人的强调；בָּנָיו字面为“他的儿子们”，在王位承继语境中指其后裔王朝，正文采用自然中文“子孙”，并以脚注说明。
- source_word: בְּרִית מֶלַח
  choice: 借着盐约
  rationale: 保留希伯来语独特的“盐之约”意象，并用“借着”表达该约是授予王权的盟约性根据；具体含义留在脚注解释。
theological_decisions:
- issue: 大卫所得王权的永久性
  choice: 按原文译为“永远”，并保留“盐约”的盟约意象
  alternative: 将整句解释性地译成“凭着永久的约”
  rationale: 原文同时使用לְעוֹלָם和בְּרִית מֶלַח。正文保留两种表达，可呈现其神学力度，又不把后来关于大卫之约如何实现的结论写入译文。
- issue: “他的众子”在王室语境中的所指
  choice: 译为“他的子孙”，脚注说明是大卫的王室后裔或王朝
  alternative: 严格直译为“他的儿子们”
  rationale: 此处讨论跨世代延续的王权，“子孙”更自然准确地传达王位承继语境；脚注保留原词及其王朝含义，避免误解为仅指大卫第一代儿子。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华——以色列的上帝——”以同位结构保留原文的身份说明；“王权”比“国”更准确地突出此处所授予的是统治权。“盐约”保留陌生但重要的原文意象，并由脚注帮助普通读者理解。
