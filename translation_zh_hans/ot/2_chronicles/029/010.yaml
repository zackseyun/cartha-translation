base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: zh_hans
  text: 现在我心里定意，要与以色列的上帝耶和华立约[a]，好使他的烈怒从我们身上转离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立约”原文直译为“切割盟约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 直接表达希西家此刻作出决定的时间意味，简洁自然。
- source_word: עִם לְבָבִי
  choice: 我心里定意
  rationale: 希伯来语习语表达内心的意愿或决心；此译保留“心”的意象，同时让现代读者清楚理解。
- source_word: לִכְרֹת בְּרִית
  choice: 立约
  rationale: “立约”是现代中文圣经语体中自然、庄重而准确的表达；原文直译为“切约”，以脚注保留。
- source_word: לַיהוָה
  choice: 与耶和华
  rationale: 这里的介词按立约关系译作“与”；יהוה以通行的中文专名“耶和华”表达。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 忠实表达所属关系，并明确立约对象的身份。
- source_word: וְיָשֹׁב
  choice: 好使……转消
  rationale: 上下文可自然理解为希西家立约所期望的结果；“好使”保留目的或结果语气，而不将结果说成已经必然实现。
- source_word: מִמֶּנּוּ
  choice: 从我们身上
  rationale: 准确传达第一人称复数及怒气离开其承受对象的空间意象。
- source_word: חֲרוֹן אַפּוֹ
  choice: 他的烈怒
  rationale: 该习语表示炽烈的怒气；“烈怒”在现代中文中简洁、庄重，并保留其强烈程度。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代简体中文读者最熟悉且可辨识为以色列上帝专名的传统译法；正文不以“主”替代专名，因原文明确使用四字神名。
- issue: וְיָשֹׁב 的目的、结果或后续关系
  choice: 好使他的烈怒……转消
  alternative: 他的烈怒就会……转消
  rationale: 前文是人的立约意向，后文可表达所期望的目的或结果；“好使”避免把神怒转消表述为机械性的必然后果，保留原句的语义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我心里定意”兼顾希伯来语的“心”之意象与中文清晰度；“烈怒转消”表达怒气从群体身上离开的动态。
