source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: zh_hans
  text: 他们带来七头公牛、七只公绵羊、七只羊羔和七只公山羊，为王国、圣所和犹大献作赎罪祭。他又吩咐亚伦的子孙，就是祭司，把这些祭牲献在雅威的祭坛上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: 他们牵来
  rationale: 动词 בוא 在这里指把祭牲带来；汉语说牲畜时用“牵来”比泛泛的“带来”更自然，同时没有加入“呈献”等解释性意味。
- source_word: פָרִים
  choice: 公牛
  rationale: 该词在献祭清单中指可作祭牲的雄性牛；原文此处没有明确标示年龄，故不译作“公牛犊”。
- source_word: אֵילִים
  choice: 公绵羊
  rationale: 准确表达该词所指的雄性绵羊，并与后面的羊羔和公山羊清楚区分。
- source_word: כְבָשִׂים
  choice: 羊羔
  rationale: 这是献祭语境中的常见含义；原文在本节没有进一步明说性别。
- source_word: צְפִירֵי עִזִּים
  choice: 公山羊
  rationale: 该结构明确指雄性的山羊；“公山羊”是现代汉语中清楚自然的说法。
- source_word: לְחַטָּאת
  choice: 献作赎罪祭
  rationale: חַטָּאת 在祭祀语境中指特定种类的祭，而非抽象的“罪”；“赎罪祭”保留这一礼仪类别。
- source_word: עַל הַמַּמְלָכָה
  choice: 为王国
  rationale: 介词 עַל 在献祭语境中表示为某对象或代表某对象；“为王国”简洁保留这一关系。
- source_word: הַמִּקְדָּשׁ
  choice: 圣所
  rationale: מִקְדָּשׁ 指分别为圣的祭祀场所；“圣所”比宽泛的“圣殿”更贴近原词。
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 亚伦的子孙，就是祭司
  rationale: “子孙”在汉语圣经叙事中可自然表示宗族后裔；“就是祭司”保留原文同位说明。
- source_word: לְהַעֲלוֹת
  choice: 献
  rationale: עלה 在祭祀用法中表示把祭物献上；此处用“献”简洁自然，祭坛短语已明确其祭祀含义。
- source_word: מִזְבַּח יְהוָה
  choice: 雅威的祭坛
  rationale: 按原文保留神的专名 יְהוָה，并以“雅威”音译；所属结构自然译为“雅威的祭坛”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，不以头衔代替，也不采用较晚形成的混合读音。
- issue: חַטָּאת 在祭祀语境中的含义
  choice: 赎罪祭
  alternative: 为罪而献的祭；洁净祭
  rationale: 这里列举作为 חַטָּאת 献上的牲畜，因此所指是特定祭类。“赎罪祭”是现代中文读者熟悉的礼仪术语；不在正文中进一步限定其功用，以免消解该词可能兼有的除罪与洁净含义。
- issue: וַיֹּאמֶר 的未明说主语
  choice: 他又吩咐
  alternative: 希西家又吩咐
  rationale: 本节希伯来文本只用第三人称单数动词，主语须由上下文确定。正文保留“他”，不在本节补入原文未明说的人名；“吩咐”符合其后命令祭司献祭的语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。祭牲量词按现代汉语习惯分别使用“头”和“只”；用“这些祭牲”补明 לְהַעֲלוֹת 的语境宾语，避免“把它们献”在中文中指代生硬。保留“王国、圣所和犹大”三项并列，不把“王国”解释成王室或君王。
