base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: zh_hans
  text: 此外，有大量的燔祭，连同平安祭[a]的脂油，以及配合燔祭献上的奠祭。这样，耶和华殿的事奉便得以确立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 此外
  rationale: 表达承接上文并补充说明的语气，符合现代汉语叙事习惯。
- source_word: עֹלָה ... לָרֹב
  choice: 燔祭数量很多
  rationale: עֹלָה虽为单数形式，在此具有集合意义；לָרֹב表示数量众多。
- source_word: בְּחֶלְבֵי הַשְּׁלָמִים
  choice: 连同平安祭的脂油
  rationale: 祭祀语境中的חֵלֶב指献上的脂油部分；בְּ在此表达伴随关系。שְׁלָמִים译作传统且明确的祭名“平安祭”。
- source_word: וּבַנְּסָכִים לָעֹלָה
  choice: 和燔祭所配的奠祭
  rationale: נְסָכִים指浇奠的液体祭物；לָעֹלָה表明这些奠祭与燔祭相配。
- source_word: וַתִּכּוֹן
  choice: 就建立起来了
  rationale: כון在此为结果性的被动意义，表示圣殿事奉得以确立、恢复正常秩序；“建立起来”保留原文措辞的宽度，不限定为单纯预备或整顿。
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: 耶和华殿里的事奉
  rationale: עֲבוֹדָה在此指圣殿礼仪和祭祀事奉；以自然汉语表达该结构链，同时保留神名。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名音译，明确对应四字神名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代汉语中广为人知的专名形式；它将原文的盟约之名作为名字呈现，而非以“主”替代。
- issue: 祭名שְׁלָמִים的译法
  choice: 平安祭
  alternative: 团契祭
  rationale: “平安祭”保留通行的旧约祭祀类别名称，也不把该祭的意义缩减为某一种特定神学解释；另一译法列入脚注。
- issue: וַתִּכּוֹן所表达的结果
  choice: 事奉就建立起来了
  alternative: 事奉就恢复了／安排妥当了
  rationale: 原词可表示被确立、安置稳妥或预备好；正文保留较宽泛的结果义，避免把上下文暗示的“恢复”写成原文明确陈述。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“燔祭、平安祭、奠祭、事奉”保留必要的祭祀和圣殿术语；句法略作汉语化处理，以“数量很多”和“所配的”清楚传达集合意义及祭物之间的关联。脚注标记紧随其实际说明的“平安祭”。
