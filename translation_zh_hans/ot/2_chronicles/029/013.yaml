base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/013.yaml
  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: zh_hans
  text: 以利撒反的子孙[a]中，有申利和耶乌利[b]；亚萨的子孙中，有撒迦利雅和玛探雅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”所译的希伯来语也可指较广泛的家族后裔或宗族成员，不一定只是亲生儿子。
    reason: lexical_alternative
  - marker: b
    text: 此处希伯来文的人名写作“耶乌利”；有些相近的人名在别处写作“耶利”。
    reason: textual_name_clarification
lexical_decisions:
- source_word: וּמִן
  choice: ……中，有
  rationale: 结合前置连词和介词，承接上文名单；汉语用“……中，有”自然呈现“并从……中”的列举关系。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 该词字面为“儿子们”，但在族谱和名单语境中常指后裔或宗族成员；“子孙”既保留亲属谱系意味，也避免误解为仅限亲生儿子。
- source_word: אֱלִיצָפָן
  choice: 以利撒反
  rationale: 按现代中文圣经人名惯例音译。
- source_word: שִׁמְרִי
  choice: 申利
  rationale: 按希伯来语人名音译，并采用中文圣经中通行的形式。
- source_word: ויעואל
  choice: 耶乌利
  rationale: 马所拉辅音文本为 יעואל，较直接支持 Yeuel/Jeuel 一类读法；“耶乌利”比“耶利”更能反映其中的 ו 辅音。
- source_word: בְּנֵי אָסָף
  choice: 亚萨的子孙
  rationale: 保留谱系或宗族归属的表达；亚萨在此是祖先或群体领袖的名字。
- source_word: זְכַרְיָהוּ
  choice: 撒迦利雅
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וּמַתַּנְיָהוּ
  choice: 和玛探雅
  rationale: 保留连接词，并采用通行的中文人名音译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的名单体。用“……中，有……”避免生硬直译，同时保留两组平行列举结构；人名尽量沿用中文圣经惯例，但“耶乌利”依本节希伯来文辅音形式译出。
