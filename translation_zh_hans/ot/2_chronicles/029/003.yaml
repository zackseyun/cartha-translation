base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: zh_hans
  text: 他在登基第一年的第一个月，打开了耶和华殿的门，并加固了这些门。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并修理了这些门。”原词的基本意思是“使坚固、加固”；在这里也可指把门修复得牢固。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: 他
  rationale: 独立代词在叙事中重申并略加强调主语；现代汉语用“他”即可自然承接上文，不必另加“亲自”。
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: 他登基第一年
  rationale: 这是表示首个在位年份的惯用时间结构；“登基第一年”简洁自然，也准确表达其王权开始后的第一年。
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: 正月
  rationale: 原文直译为“第一个月”；在古代以色列历法语境中，现代汉语用“正月”可自然表示一年的第一个月。
- source_word: פָּתַח
  choice: 打开
  rationale: 该动词在殿门这一语境中的基本义就是“打开”。
- source_word: דַּלְתוֹת
  choice: 门
  rationale: דֶּלֶת 指门或门扇，而非城门；汉语集合名词“门”在此最自然。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: בֵּית 字面为“家、房屋”，在此特指圣殿；“耶和华殿”既自然，又保留了所属关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的形式音译四字神名，保留其专名性质，而不以称号替代。
- source_word: וַיְחַזְּקֵם
  choice: 并把门修缮坚固
  rationale: 该词的使役加强形式基本义是“使坚固、加固”；在修复圣殿门的语境中也包含修缮之意。“修缮坚固”兼顾具体语境和原词的强固含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为读者认识的音译“耶和华”，保留专名而不替换为“主”；“雅威”是另一种较贴近学界重构发音的译法。
- issue: וַיְחַזְּקֵם 所表达的行动
  choice: 修缮坚固
  alternative: 修理
  rationale: 原词明确含“使坚固”的意义，但语境表明这是对久被关闭的殿门进行恢复。正文同时表达修缮和加固，不把它仅收窄为一般维修。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“他登基第一年正月”符合汉语历史叙事习惯；“修缮坚固”略具书面色彩，但普通读者容易理解，并保留原文词义张力。
