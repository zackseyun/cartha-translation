base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: zh_hans
  text: 他们进去见希西家王，对王说：“我们已经洁净了耶和华的整个殿、燔祭坛及其一切器具，也洁净了陈设饼的桌子[a]及其一切器具。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“摆列之物的桌子”，指把饼摆列在耶和华面前的桌子。
    reason: 说明 שֻׁלְחַן הַמַּעֲרֶכֶת 的字面结构及其在圣所语境中的所指。
lexical_decisions:
- source_word: פְנִימָה
  choice: 进去见
  rationale: 该方向副词表示向内进入；结合 אֶל חִזְקִיָּהוּ，译作“进去见希西家王”符合现代汉语表达，同时保留进入后向王禀报的场景。
- source_word: טִהַרְנוּ
  choice: 我们已经洁净了
  rationale: 在圣殿语境中，该动词指礼仪性的清洁。“洁净”保留祭祀语义，“已经”表明行动完成且结果仍然有效。
- source_word: בֵּית יְהוָה
  choice: 耶和华的整个殿
  rationale: בַּיִת 直译为“房屋”，此处明确指圣殿；译作“殿”自然清楚。כָּל 修饰整体，故译“整个殿”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的音译呈现神的专名，不以“主”这一称号取代。
- source_word: מִזְבַּח הָעוֹלָה
  choice: 燔祭坛
  rationale: 这是献全烧祭之祭坛的固定称谓；“燔祭坛”简洁、准确，并符合中文圣经传统用语。
- source_word: כֵּלָיו
  choice: 坛上的一切器具／桌上的一切器具
  rationale: כְּלִי 在圣所语境中泛指礼仪器皿和用具。补出所属物“坛上／桌上”，比机械地译作“它的一切器具”更自然，所指仍保持明确。
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: 陈设饼的桌子
  rationale: מַעֲרֶכֶת 表示按次序摆列之物；在此指摆列在耶和华面前的饼。正文采用功能明确、中文读者熟悉的“陈设饼的桌子”，脚注说明较贴近字面的表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知的专名音译“耶和华”，既不以称号“主”替代，也避免读者误以为原文仅有一般称谓。
- issue: שֻׁלְחַן הַמַּעֲרֶכֶת 所指为何
  choice: 陈设饼的桌子
  alternative: 摆列之物的桌子／摆列成行的桌子
  rationale: 该短语字面上突出“摆列”，上下文及圣所制度表明所摆列的是饼。正文明确所指，脚注保留原文表达方式，避免掩盖其词汇结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“洁净”“燔祭坛”“陈设饼”等保留圣殿礼仪色彩；通过“坛上的”“桌上的”使重复结构在中文中清楚流畅。
