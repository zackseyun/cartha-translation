id: 2CH.29.15
reference: 2 Chronicles 29:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּֽאַסְפ֤וּ אֶת אֲחֵי/הֶם֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבֹ֥אוּ כְ/מִצְוַת הַ/מֶּ֖לֶךְ בְּ/דִבְרֵ֣י יְהוָ֑ה לְ/טַהֵ֖ר בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: zh_hans
  text: 他们召集弟兄，使自己分别为圣；他们照着王的命令，按雅威的话，前来洁净雅威的殿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照着王的命令，按雅威的话”也可理解为“照着王按雅威的话所下的命令”。“雅威的殿”原文直译为“雅威的家”。
    reason: 保留בְּדִבְרֵי יְהוָה与王命令之间的句法关联余地，并说明בֵּית יְהוָה的字面形式。
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת־אֲחֵיהֶם
  choice: 他们召集了自己的弟兄
  rationale: 保留אָסַף的主动“召集”之意和אֲחֵיהֶם字面的男性亲属称谓；上下文表明所指是同为利未人的弟兄，但正文不将其解释性展开。
- source_word: וַיִּתְקַדְּשׁוּ
  choice: 洁净自己
  rationale: 此处התפעל词形表示为圣殿事奉作礼仪上的自洁或自圣；现代汉语“洁净自己”自然，也与本节随后洁净圣殿的语境协调。
- source_word: וַיָּבֹאוּ
  choice: 前来
  rationale: 采用动词בוא的基本意义，不补入原文未明说的“进入”。
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: 照着王的命令
  rationale: 准确表达依照君王命令而行，符合现代汉语表达。
- source_word: בְּדִבְרֵי יְהוָה
  choice: 按雅威的话
  rationale: 将介词ב理解为规范或依据，表明王的命令以雅威的话为准；中文集合名词“话”可自然对应希伯来语复数דִבְרֵי，同时避免生硬的“借着……的话”。
- source_word: לְטַהֵר
  choice: 洁净
  rationale: 在圣殿语境中指礼仪性的清除污秽与恢复洁净，“洁净”兼顾准确和庄重。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בֵּית字面是“家、房屋”，在此明确指圣殿；译为“殿”在中文中自然简洁，脚注保留字面形式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，同时不把不确定的古代元音细节发展为教义主张。
- issue: בְּדִבְרֵי יְהוָה与王命令的句法关系
  choice: “照着王的命令，按雅威的话”——把雅威的话理解为王命令所依据的规范
  alternative: “照着王借雅威的话所下的命令”；“照王的命令，借着雅威的话”
  rationale: 希伯来语介词短语可有不同连接方式。正文采用语境上顺畅且不把王说的话等同于神谕的理解，并以脚注保留句法歧义。
- issue: אֲחֵיהֶם的性别与群体指向
  choice: 自己的弟兄
  alternative: 同族的人；其他利未人
  rationale: 原文使用阳性复数亲属词，且上下文所指为男性利未人；保留“弟兄”而不改成中性或解释性群体名称。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“弟兄”保留原文男性亲属用语；“洁净自己”比“使自己成圣”更易为普通读者理解此处礼仪预备的含义。正文中的脚注标记置于相关整句之后。
