revisions:
- from: 他们召集了自己的弟兄，洁净自己，照着王的命令，按雅威的话，前来洁净雅威的殿。[a]
  to: 他们召集弟兄，使自己分别为圣；他们照着王的命令，按雅威的话，前来洁净雅威的殿。[a]
  rationale: 本次修订仅纠正关键礼仪术语：以“使自己分别为圣”对应וַיִּתְקַדְּשׁוּ，并保留“洁净”对应句末的לְטַהֵר。脚注调整为更自然且不预断句法关系的替代理解；其余译文维持原意与既有术语选择。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:40Z'
review_pass:
  verdict: revise
  source_fidelity: “洁净自己”未充分表达וַיִּתְקַדְּשׁוּ（hitpael of קדש）的核心含义，即为圣职／礼仪事奉而使自己分别为圣。该词与句末לְטַהֵר“洁净（圣殿）”有意不同，宜在中文中予以区分。其余主要成分均忠实：‘召集弟兄’保留主动及男性亲属称谓；‘前来’未擅自补作‘进入’；王命令与雅威话语的关系保留了适当的句法弹性。
  naturalness: 修订后的“使自己分别为圣”在当代庄重书面汉语中清楚自然，也避免将人的礼仪性自我成圣与对圣殿的洁净使用同一措辞。以分号划分预备行为和随后执行的任务，使长句更易读。
  terminology: “雅威”一致呈现四字神名；“弟兄”适当保留原文的男性复数亲属词；“殿”适合此处明确所指的圣殿，脚注说明原文的“家／殿宇”字面表达。将וַיִּתְקַדְּשׁוּ改为“使自己分别为圣”，使其不与טהר的‘洁净’混同。
  issues:
  - severity: medium
    issue: 将וַיִּתְקַדְּשׁוּ译为“洁净自己”
    rationale: קדש的自反式在此指礼仪性的自我成圣／分别为圣，而非一般的洁净；句末另用טהר表示洁净圣殿。正文应保留这两个词的语义区别。
  - severity: low
    issue: 脚注的替代译文“王借雅威的话所下的命令”措辞过于确定且不够自然
    rationale: 该表述把介词短语明确限定为王下令的工具，超过希伯来语短语所允许的句法开放性。改为“王按雅威的话所下的命令”可保留这一可能理解而不强化‘借着’的工具意味。
  revised_text: 他们召集弟兄，使自己分别为圣；他们照着王的命令，按雅威的话，前来洁净雅威的殿。[a]
  revised_footnotes:
