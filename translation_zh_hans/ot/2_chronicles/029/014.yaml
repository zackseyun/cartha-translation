  yaml_path: translation/ot/2_chronicles/029/014.yaml
  text: 'And from the sons of Heman: Jehuel and Shimei[a]; and from the sons of Jeduthun: Shemaiah and Uzziel.'
translation:
  language: zh_hans
  text: 希幔的子孙中有耶歇和示每；耶杜顿的子孙中有示玛雅和乌薛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: ……中有
  rationale: 本节承接上文列举人员；中文以“……中有”自然表达希伯来语连词加介词的追加和出自某家族之意，无须机械译出“并且从”。
- source_word: בְּנֵי
  choice: 子孙
  rationale: 此处是家族或谱系名单，“子孙”既保留亲属谱系含义，也比“儿子”更能涵盖家族成员。
- source_word: הֵימָן
  choice: 希幔
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: יחואל
  choice: 耶歇
  rationale: 按本处希伯来辅音形式及现代中文圣经常用形式音译；不同文本传统或译名体系可能采用近似异译。
- source_word: וְשִׁמְעִי
  choice: 和示每
  rationale: 保留连接词以呈现名单中两人的并列关系，并采用通行中文音译。
- source_word: יְדוּתוּן
  choice: 耶杜顿
  rationale: 按现代中文圣经人名的通行形式音译。
- source_word: שְׁמַעְיָה
  choice: 示玛雅
  rationale: 音译希伯来人名，反映其完整形式。
- source_word: וְעֻזִּיאֵל
  choice: 和乌薛
  rationale: 保留最后一项前的连接词，并采用通行中文音译。
