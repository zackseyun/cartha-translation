base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: zh_hans
  text: 希西家吩咐把燔祭献在祭坛上。燔祭开始献上时，耶和华的歌[a]也开始了，伴有号角，并使用以色列王大卫的乐器。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“耶和华的歌”；也可理解为“向耶和华所唱的歌”。
    reason: 保留שִׁיר יְהוָה属格结构所含的归属与指向歧义。
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: 吩咐人把……献在
  rationale: אמר接ל不定式在这里表达王的指令；译作“吩咐人”既体现整个结构的命令作用，也不把单独的动词אמר机械强化为专门的“命令”一词。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: 这是עֹלָה的传统且准确的礼仪用语，指整牲焚烧献上的祭。
- source_word: וּבְעֵת הֵחֵל הָעוֹלָה הֵחֵל
  choice: 燔祭开始献上的时候，……也随之响起
  rationale: 保留两个“开始”之间的同步关系；中文用“随之响起”自然表达歌声开始，同时避免生硬重复。
- source_word: שִׁיר יְהוָה
  choice: 献给耶和华的歌声
  rationale: 属格结构字面可作“耶和华的歌”；在敬拜语境中很可能指向耶和华所唱的歌。正文采用自然中文，同时用脚注保留原文属格的歧义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，区别于作为称号的“主”。
- source_word: הַחֲצֹצְרוֹת
  choice: 号声
  rationale: חֲצֹצְרָה指礼仪所用的号；此处与歌声和乐器并列，中文用“号声”更自然地表达声音伴随。
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  choice: 以色列王大卫的乐器伴奏
  rationale: כְּלִי本义宽泛，但本段礼仪音乐语境明确指乐器；“伴奏”自然传达עַל־יְדֵי在此的工具性关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为人知的专名“耶和华”，不以称号“主”代替，也不据宗派立场增添解释。
- issue: שִׁיר יְהוָה的关系
  choice: 献给耶和华的歌声，并加脚注
  alternative: 耶和华的歌
  rationale: 希伯来语属格可能表示归属或指向。上下文支持“献给耶和华”，但原文没有明确介词，因此脚注保留较为字面的表达，不把歧义完全消除。
- issue: 音乐与献祭的同步关系
  choice: 也随之响起
  alternative: 也开始了
  rationale: 原文重复הֵחֵל，强调燔祭开始与敬拜音乐开始同步；译文保留这一神学礼仪场景而不额外说明其意义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“燔祭”“祭坛”“耶和华”保留必要的圣经礼仪与专名用语；句法则避免仿希伯来语造成的生硬重复。
