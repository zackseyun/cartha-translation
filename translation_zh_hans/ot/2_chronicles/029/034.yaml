source:
  edition: WLC
  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: zh_hans
  text: 只是祭司人数太少，不能给所有的燔祭牲剥皮，于是他们的弟兄利未人便协助他们[a]，直到工作完成，也直到祭司使自己分别为圣[b]。因为在使自己分别为圣这件事上，利未人的内心比祭司更正直[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “协助他们”直译为“使他们刚强”或“加强他们”。
    reason: lexical_alternative
  - marker: b
    text: “使自己分别为圣”也可译为“自我祝圣”；指为圣殿事奉作礼仪上的预备。
    reason: lexical_alternative
  - marker: c
    text: “内心更正直”直译为“心里更正直”；也可译为“更全心”或“更一心一意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק הַכֹּהֲנִים הָיוּ לִמְעָט
  choice: 只是祭司人数太少
  rationale: רַק在此具限制兼转折作用；לִמְעָט结合הָיוּ表示人数不足以完成任务，译为“人数太少”自然且明确。
- source_word: לְהַפְשִׁיט
  choice: 剥皮
  rationale: 此处指从献祭牲畜身上剥去皮，现代汉语“剥皮”准确易懂。
- source_word: הָעֹלוֹת
  choice: 燔祭牲
  rationale: עֹלוֹת是全牲焚烧献上的祭物；结合“剥皮”的动作，补出“牲”可清楚表明所处理的是祭牲，同时保留传统祭祀术语“燔祭”。
- source_word: וַיְחַזְּקוּם
  choice: 协助他们
  rationale: 该动词字面为“使他们刚强、加强他们”，在此语境中表示利未人实际帮助祭司完成剥皮工作；“协助”比直译“使他们刚强”更符合现代汉语，但以脚注保留字面意象。
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: 他们的弟兄利未人
  rationale: 保留אֲחֵיהֶם的亲属性称谓，并自然地标明这些弟兄就是利未人。
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: 直到工作完成
  rationale: 准确表达动作持续到任务全部结束；“工作”保留原文较宽泛的מְלָאכָה。
- source_word: יִתְקַדְּשׁוּ / לְהִתְקַדֵּשׁ
  choice: 洁净自己
  rationale: 在圣殿礼仪语境中，קדשׁ的反身形式指为圣职作礼仪上的分别与预备。“洁净自己”符合历代志本章的语境并便于普通读者理解；脚注说明也可译为“使自己分别为圣”。
- source_word: יִשְׁרֵי לֵבָב
  choice: 诚心正意
  rationale: 该短语字面为“心里正直”，强调内在真诚与正直；“诚心正意”在现代庄重汉语中自然，并保留心志层面的评价。
- source_word: מֵהַכֹּהֲנִים
  choice: 比祭司更
  rationale: מִן在此表达比较，必须保留利未人与祭司之间明确而有限于当下情境的比较。
theological_decisions:
- issue: 利未人与祭司之间比较的性质
  choice: 译为利未人在洁净自己这件事上“比祭司更诚心正意”
  alternative: 利未人比祭司更迅速、更殷勤或更有准备去洁净自己
  rationale: יִשְׁרֵי לֵבָב主要描述内心的正直和诚意，而非单纯的速度或行政准备程度。译文保留原文对祭司的尖锐比较，却不将其扩展为对整个祭司制度的普遍批判。
- issue: קדשׁ反身形式的礼仪含义
  choice: 洁净自己
  alternative: 使自己分别为圣／使自己成圣
  rationale: 上下文谈圣殿礼仪资格，故此处不是宣称道德上达到完全圣洁，而是指为圣职事奉作礼仪预备；脚注保留更形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“燔祭”“祭司”“利未人”等经文传统术语；句法顺畅但不消除原文对祭司与利未人的神学张力。所有脚注标记均置于相关主文之后。
