revisions:
- from: 只是祭司人数太少，不能给所有的燔祭牲剥皮，于是他们的弟兄利未人便协助他们[a]，直到工作完成，也直到众祭司洁净自己[b]。因为利未人在洁净自己这件事上，比祭司更诚心正意[c]。
  to: 只是祭司人数太少，不能给所有的燔祭牲剥皮，于是他们的弟兄利未人便协助他们[a]，直到工作完成，也直到祭司使自己分别为圣[b]。因为在使自己分别为圣这件事上，利未人的内心比祭司更正直[c]。
  rationale: 修订仅澄清并统一本节两处“使自己分别为圣”的礼仪术语，且以更直接的中文表达“心里正直”的比较；不改变原文对利未人与祭司在此一事项上的有限比较，也不扩展为制度性或教义性的判断。
