    rationale: 洁净可属于礼仪预备的一部分，但该动词的核心是自我分别为圣、祝圣；同一节重复此词，中文宜保持术语一致。
  - severity: low
    issue: “更诚心正意”对יִשְׁרֵי לֵבָב的对应略显意译。
    rationale: “内心更正直”更贴近字面与语义，且避免“诚心正意”可能带来的固定成语色彩。
