  verdict: revise
  source_fidelity: “洁净自己”弱化了希伯来文 hitpael 形式 קדשׁ 在此处“使自己分别为圣／自我祝圣”的礼仪含义；原文在本节两次使用同一词根，应在中文主文中一致呈现。其余主要内容，包括祭司人数不足、给燔祭牲剥皮、利未人提供协助，以及利未人与祭司的比较，均忠实反映原文。
  naturalness: 原译整体庄重流畅。“诚心正意”可以理解，但“内心比祭司更正直”更直接、自然地对应“心里正直”的希伯来习语，也能清楚限定比较是在分别为圣这件事上。
  terminology: “燔祭”“祭司”“利未人”均为合宜的既有术语。将两处“洁净自己”统一改为“使自己分别为圣”，能保留礼仪性自我成圣／祝圣的术语含义，而不把它简化为一般洁净。
  issues:
