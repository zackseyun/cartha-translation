  yaml_path: translation/ot/2_chronicles/029/004.yaml
  text: Then he brought in the priests and the Levites and assembled them in the eastern square[a].
translation:
  language: zh_hans
  text: 他把祭司和利未人召来，将他们聚集在东边的广场上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将他们聚集到东边的广场。”
    reason: 介词ל在此既可按聚集地点译为“在……”，也可突出移动方向译为“到……”。
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 召来
  rationale: 使役形式表达“使他们前来、把他们带来”。结合下文召集众人的场景，“召来”在现代汉语中自然，也保留了主动使其到来的含义。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כהנים的标准译法。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: לוים的标准译法，指与祭司有别的利未支派圣殿人员。
- source_word: וַיַּאַסְפֵם
  choice: 将他们聚集
  rationale: אסף加第三人称阳性复数宾语后缀，意为“聚集他们”；此译法适合正式召集的场景，同时自然易懂。
- source_word: לִרְחוֹב
  choice: 在……广场上
  rationale: רחוב在这里指宽阔的公共空地或广场，并非现代意义上的街道。介词ל可表示趋向或聚集后的所在；正文采用自然的处所表达。
- source_word: הַמִּזְרָח
  choice: 东边的
  rationale: מזרח意为“东、东方”。“东边的广场”自然表达该广场位于东侧；具体句法关系仍可理解为“东方广场”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“召来”避免生硬直译“带进来”；“广场”准确传达רחוב所指的宽阔公共空间。正文保留脚注标记[a]。
