  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: zh_hans
  text: 他行了雅威眼中看为正的事；凡他祖先大卫[a]所行的，他都照着行了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他父亲大卫”。这里的“父亲”表示王朝世系中的祖先，并非亲生父亲。
    reason: 说明אָבִיו在君王世系语境中的含义，并保留较字面的译法。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他行了
  rationale: 这是עשה的Qal叙事时态，表示“他行了／做了”。中文用“行了”既自然，也适合描述君王的行为。
- source_word: הַיָּשָׁר
  choice: 看为正的事
  rationale: 带定冠词的形容词ישר在此作名词使用，指“正的事”。与后面的“在……眼中”合译为“眼中看为正的事”，符合现代汉语表达。
- source_word: בְּעֵינֵי
  choice: 眼中
  rationale: 保留希伯来语“在……眼中”的评价性比喻，同时在现代汉语中自然易懂。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音译出其专名，不以“主”这一称号替代。
- source_word: כְּכֹל אֲשֶׁר
  choice: 凡……所行的，他都照着行了
  rationale: “凡……都……”保留כֹל的全括意义，“照着”表达כְּ的依照、符合之意。
- source_word: עָשָׂה
  choice: 所行的
  rationale: 指大卫先前的行为；汉语借上下文和“所”字结构自然表达其先于希西家发生，无须另加时态标记。
- source_word: דָּוִיד
  choice: 大卫
  rationale: 采用该人名在现代中文圣经传统中的标准译名。
- source_word: אָבִיו
  choice: 他祖先
  rationale: אָב可指父亲，也可指父祖或祖先；大卫并非希西家的生父，此处是王朝世系用语。正文用“祖先”准确传达语境中的所指，脚注保留较字面的另一译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”保留专名性质，也避免以称号“主”替代原文。
- issue: “他父亲大卫”的世系含义
  choice: 正文译作“他祖先大卫”
  alternative: 他父亲大卫；他父祖大卫
  rationale: 希伯来语אָבִיו字面可译“他父亲”，但在此君王公式中表示王朝祖先。译作“祖先”避免现代读者误以为大卫是希西家的生父，同时用脚注保留原词的字面表达和王朝用法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“雅威眼中看为正”保留原文的评价性比喻；后半句用“凡……都……”明确表达对大卫全部行为的遵循。
