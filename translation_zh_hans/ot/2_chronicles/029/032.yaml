  text: וַ/יְהִ֞י מִסְפַּ֣ר הָ/עֹלָה֮ אֲשֶׁ֣ר הֵבִ֣יאוּ הַ/קָּהָל֒ בָּקָ֣ר שִׁבְעִ֔ים אֵילִ֥ים מֵאָ֖ה כְּבָשִׂ֣ים מָאתָ֑יִם לְ/עֹלָ֥ה לַ/יהוָ֖ה כָּל אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: zh_hans
  text: 会众带来的燔祭，数目如下：牛七十头，公绵羊一百只，羊羔二百只；这些全都是献给耶和华的燔祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה / לְעֹלָה
  choice: 燔祭
  rationale: 这是希伯来祭祀术语，指祭牲全然焚烧献上的祭，沿用现代中文圣经中准确且通行的表达。
- source_word: הַקָּהָל
  choice: 会众
  rationale: 指聚集参与敬拜的群体；“会众”既贴近原义，也符合庄重的经文语体。
- source_word: בָּקָר
  choice: 牛
  rationale: 该词是牛类的集合名词，本节没有明确限定为公牛，因此不擅自加上性别。
- source_word: אֵילִים
  choice: 公绵羊
  rationale: 明确表达该词所指的成年雄性绵羊，并与后面的羊羔区分。
- source_word: כְּבָשִׂים
  choice: 羊羔
  rationale: 自然表达幼羊之义；原文在此未进一步限定性别。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词 לְ 表示奉献对象；用“献给”使汉语关系清楚，神名 יהוה 译作“耶和华”。
theological_decisions:
- issue: בָּקָר 是否译为“公牛”
  choice: 牛
  alternative: 公牛
  rationale: 原词本身是泛指牛类的集合名词。尽管献祭法规可能提供背景，译文不从背景推入原句未明说的性别。
- issue: 神名 יהוה 的呈现
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”是简体中文读者最熟悉的专名形式，保留其作为神圣专名的功能，也不采用全大写称号替代专名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“数目如下”自然呈现希伯来文的统计句式，并保留祭牲类别、数量和全部作为燔祭献给耶和华的信息；不添加原文未明示的祭牲性别。
