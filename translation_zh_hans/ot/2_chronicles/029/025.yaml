  text: וַ/יַּֽעֲמֵ֨ד אֶת הַ/לְוִיִּ֜ם בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ בִּ/נְבָלִ֣ים וּ/בְ/כִנֹּר֔וֹת בְּ/מִצְוַ֥ת דָּוִ֛יד וְ/גָ֥ד חֹזֵֽה הַ/מֶּ֖לֶךְ וְ/נָתָ֣ן הַ/נָּבִ֑יא כִּ֧י בְ/יַד יְהוָ֛ה הַ/מִּצְוָ֖ה בְּ/יַד נְבִיאָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: zh_hans
  text: 他使利未人在耶和华的殿中各就其位，使用钹、瑟和琴，遵照大卫、王的先见迦得[a]和先知拿单的命令；因为这命令是从耶和华而来，借着他的众先知传达的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先见”所译的希伯来语称谓与本节“先知”所译的词不同，不过两种职分密切相关。
    reason: lexical_alternative
  - marker: b
    text: 更直译为：“因为这命令是借耶和华的手、借他众先知的手而来的。”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: 安排……在……中
  rationale: 该动词为使役形式，表示使利未人各就其位、承担礼仪职分；“安排”兼顾位置与职务，符合现代汉语表达。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: “殿”在此自然地指耶和华的圣殿，同时保留“耶和华”这一专名。
- source_word: בִּמְצִלְתַּיִם בִּנְבָלִים וּבְכִנֹּרוֹת
  choice: 使用钹、瑟和琴
  rationale: 介词表示礼仪中所使用的器具。“钹、瑟、琴”是易懂且彼此有别的传统汉语乐器名称；古代两种弦乐器与现代乐器的精确对应并不确定。
- source_word: גָּד חֹזֵה הַמֶּלֶךְ
  choice: 王的先见迦得
  rationale: “先见”保留חֹזֶה这一称谓，并与下文נָבִיא“先知”有所区别；“王的先见”表达其与君王的职务关系。
- source_word: נָתָן הַנָּבִיא
  choice: 先知拿单
  rationale: 按现代汉语习惯将称谓置于人名前，清楚表达其身份。
- source_word: כִּי בְיַד יְהוָה הַמִּצְוָה בְיַד נְבִיאָיו
  choice: 因为这命令是耶和华借他的众先知传下的
  rationale: 两个“借手”结构分别表达命令的终极来源和传达媒介；此译法避免生硬直译，同时保留耶和华与众先知两层施事关系。
theological_decisions:
- issue: 大卫所定礼仪秩序与神圣权威的关系
  choice: 命令由耶和华发出，并借他的众先知传达；大卫、迦得和拿单均与该命令的实施或传达有关。
  alternative: 把这命令仅理解为大卫的王室规定，后来才被赋予神圣认可。
  rationale: 末句明确把命令归于耶和华，并说明众先知是传达媒介，因此译文同时保留人的参与和神的终极权威。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华的殿”比“耶和华的家”更符合本处圣殿语境；“使用”清楚说明所列乐器在礼仪中的功能，而不额外断定乐器的精确形制。
