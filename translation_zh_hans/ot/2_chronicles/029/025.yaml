revisions:
- from: 他照着大卫、王的先见迦得[a]和先知拿单的命令，安排利未人在耶和华的殿中使用钹、瑟和琴，因为这命令是耶和华借他的众先知传下的。[b]
  to: 他使利未人在耶和华的殿中各就其位，使用钹、瑟和琴，遵照大卫、王的先见迦得[a]和先知拿单的命令；因为这命令是从耶和华而来，借着他的众先知传达的。[b]
  rationale: 修订仅增强两个语义重点：以“使……各就其位”反映使役动词在礼仪任职语境中的安置含义；以“从耶和华而来，借着他的众先知传达”分别表达命令的终极来源和先知的中介角色。其余专名、乐器术语、称谓区别及脚注锚点均予保留。
