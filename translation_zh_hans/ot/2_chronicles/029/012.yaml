  text: וַ/יָּקֻ֣מוּ הַ֠/לְוִיִּם מַ֣חַת בֶּן עֲמָשַׂ֞י וְ/יוֹאֵ֣ל בֶּן עֲזַרְיָהוּ֮ מִן בְּנֵ֣י הַ/קְּהָתִי֒ וּ/מִן בְּנֵ֣י מְרָרִ֔י קִ֚ישׁ בֶּן עַבְדִּ֔י וַ/עֲזַרְיָ֖הוּ בֶּן יְהַלֶּלְאֵ֑ל וּ/מִן הַ/גֵּ֣רְשֻׁנִּ֔י יוֹאָח֙ בֶּן זִמָּ֔ה וְ/עֵ֖דֶן בֶּן יוֹאָֽח־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: zh_hans
  text: 于是，利未人起来了：哥辖子孙中，有亚玛赛的儿子玛哈和亚撒利雅的儿子约珥[a]；米拉利子孙中，有亚伯底的儿子基士和耶哈利勒的儿子亚撒利雅；革顺族人中[b]，有心玛的儿子约亚和约亚的儿子伊甸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从哥辖子孙中……从米拉利子孙中”。这种谱系说法表明，所列的人分别出自这些利未支族。
    reason: cultural_note
  - marker: b
    text: 或译：“革顺的子孙中”。这里的希伯来文使用族属称谓，没有重复前面完全相同的谱系句式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 起来了
  rationale: קום的叙事形式表示这些利未人响应命令、开始行动。“起来了”既保留原文动作意象，也符合现代汉语叙事表达。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是לְוִיִּם在中文圣经语境中的标准族群称谓；定指意义由上下文自然表达。
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: 哥辖族的子孙中
  rationale: 保留בני的谱系含义，并将单数族属形容词הקהתי按集合意义译为“哥辖族”，表明所列人物属于该利未支族。
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: 米拉利的子孙中
  rationale: 对应原文重复的谱系结构，清楚表明随后两人出自米拉利支族。
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: 革顺族人中
  rationale: 原文此处没有重复בני，而使用带冠词的族属称谓，按集合意义指革顺族人；译文保留了这一措辞差异。
- source_word: בֶּן
  choice: ……的儿子
  rationale: 本节逐一列出父子关系，直译为“儿子”自然透明；上下文没有必要泛化为“后代”。
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: 玛哈；亚玛赛；约珥；亚撒利雅；基士；亚伯底；耶哈利勒；约亚；心玛；伊甸
  rationale: 人名依希伯来语音译，并采用现代中文圣经读者较熟悉的通行形式。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号区分三个利未支族，以“……中，有……”呈现名单结构；保留哥辖、米拉利两处谱系表达与革顺处族属称谓之间的原文差异。
