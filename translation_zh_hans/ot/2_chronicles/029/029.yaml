base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: zh_hans
  text: 献祭完毕后[a]，王和所有与他一同在场的人都跪下敬拜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“当他们献上完毕”；在这里的献祭语境中，指献上祭物的行动已经完成。依上下文，所献的是燔祭。
    reason: lexical_alternative
  - marker: b
    text: 或译“俯伏”或“下拜”。原词既可表示恭敬俯身的动作，也可表示敬拜；这里按圣殿献祭的语境译为“敬拜”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת
  choice: 完毕
  rationale: 介词 כְ 与 כלה 的不定式组合构成时间从句，表示前一行动完成之时；汉语以“……完毕”自然承接后续动作。
- source_word: לְ/הַעֲל֑וֹת
  choice: 献祭
  rationale: עלה 的使役式在此圣殿献祭语境中表示把祭物献上；原文此处未明说宾语，因此正文用概括性的“献祭”，不擅自补入“燔祭”，并以脚注说明其字面和语境含义。
- source_word: כָּרְעוּ
  choice: 跪下
  rationale: כרע 表示屈膝、跪下；如此翻译既清楚表达身体动作，也与随后 שחה 所表达的俯伏敬拜有所区分。
- source_word: הַ/מֶּלֶךְ
  choice: 王
  rationale: 直接对应带定冠词的名词；上下文所指明确，现代汉语不必另加指示词。
- source_word: וְ/כָל הַ/נִּמְצְאִים אִתּוֹ
  choice: 和所有跟他在场的人
  rationale: מצא 的被动分词在此指当时在场的人；译文保留“与他同在”的关系，同时采用自然的现代汉语表达。
- source_word: וַ/יִּשְׁתַּחֲווּ
  choice: 敬拜
  rationale: שחה 的这一词形可指俯伏，也可在宗教语境中指敬拜。此处位于圣殿献祭场景，译作“敬拜”传达行为的宗教意义，而前面的“跪下”已表达其身体姿态。
theological_decisions:
- issue: 圣殿礼仪语境中 שחה 的译法
  choice: 敬拜
  alternative: 俯伏／下拜
  rationale: 献祭完成后的动作具有明确的礼仪和宗教指向。“敬拜”保留这一层意义，但脚注同时说明原词也可侧重俯伏的身体动作，避免消除原文的语义张力。
- issue: 是否在正文补出“燔祭”
  choice: 正文作“献祭”
  alternative: 献上燔祭
  rationale: 上下文确实涉及燔祭，但本节希伯来文本只用 עלה 的使役式不定式，并未明说祭物名称。正文不补出隐含宾语，以免把上下文推定写成原文明说的内容；脚注交代祭祀语境。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“献祭完毕”简洁表达时间关系；“跪下敬拜”保留原文两个连续动词，既呈现身体姿态，也呈现礼仪意义。所有脚注标记均置于正文相应词语之后。
