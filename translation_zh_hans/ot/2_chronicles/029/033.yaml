  text: 分别为圣的祭牲有六百头牛、三千只羊。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣的祭牲”原文直译为“分别为圣之物”，这里指被分别出来作为神圣供物的牲畜。
    reason: lexical_alternative
  - marker: b
    text: “羊”所译的希伯来语可泛指小型群畜，包括绵羊和山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  choice: 分别为圣的祭牲
  rationale: 该复数词直译为“圣物”或“分别为圣之物”；下文随即列出牛和羊群，表明这里具体指为敬拜而分别出来的祭牲。此译既保留“分别为圣”的含义，也自然交代其所指。
- source_word: בָּקָר
  choice: 牛
  rationale: 这是牛类的集合名词，不限定性别或用途；现代汉语用“牛”配数量“六百头”最自然。
- source_word: שֵׁשׁ מֵאוֹת
  choice: 六百
  rationale: 按原文基数词直译。
- source_word: וְצֹאן
  choice: 羊群
  rationale: צֹאן是羊群牲畜的集合名词，可包括绵羊和山羊。“羊群”比单说“绵羊”更能保留原词的范围，也符合现代汉语。
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: 三千
  rationale: 按原文基数词直译。
