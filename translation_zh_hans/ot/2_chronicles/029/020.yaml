  text: וַ/יַּשְׁכֵּם֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֶּאֱסֹ֕ף אֵ֖ת שָׂרֵ֣י הָ/עִ֑יר וַ/יַּ֖עַל בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: zh_hans
  text: 希西家王一早起来，召集城里的首领，上到耶和华的殿去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: 一早起来
  rationale: 使役词干在此表示清早起身或一早行动；“一早起来”自然地保留了时间含义。
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: 希西家王
  rationale: 采用现代汉语中君王称号置于人名之后的惯常表达，并使用通行译名“希西家”。
- source_word: וַיֶּאֱסֹף
  choice: 召集
  rationale: 此处 אָסַף 指把人聚集起来；“召集”贴合君王召聚官长的语境。
- source_word: אֵת שָׂרֵי הָעִיר
  choice: 城里的首领
  rationale: שָׂרֵי 可指官长、领袖或掌权者；“首领”既涵盖城市领导者，又不额外限定其具体官职或贵族身份。
- source_word: וַיַּעַל
  choice: 上
  rationale: 保留 עָלָה 所表达的上行意象；在前往圣殿的语境中，“上……的殿”简洁自然。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בֵּית 字面为“家、房屋”，在此指圣殿；汉语“殿”既符合所指，也保留宗教场所的庄重语体。神名 יְהוָה 采用通行的“耶和华”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文正文采用读者广泛熟悉的专名“耶和华”，不以称号替代，也不在本节额外解释其读音争议。
- issue: בֵּית יְהוָה 的表达
  choice: 耶和华的殿
  alternative: 耶和华的家；耶和华的圣殿
  rationale: 这里明确指敬拜建筑；“殿”在现代中文圣经语体中自然庄重，同时没有像“圣殿”那样补入原文未明说的“圣”。
translation_notes:
  register: 采用现代、简明而庄重的叙事语体。将三个连续动作依原文次序表达；补出“一同”以自然说明希西家与所召集的首领共同上殿，不改变事件参与者。
