base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: zh_hans
  text: 亚哈斯王在位、背信时所弃置的所有器具，我们都已经预备妥当，并分别为圣。看哪，它们就在耶和华的祭坛前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֵּלִים
  choice: 器具
  rationale: 该词泛指器皿、用具或物件；在圣殿语境中，“器具”自然且范围足够宽，不把所指限于盛装物品的器皿。
- source_word: הִזְנִיחַ
  choice: 弃置
  rationale: 该动词表示把某物撇下、不再使用或照管；“弃置”既体现主动搁置，也保留可能包含“疏忽不用”的语义空间。
- source_word: בְּמַלְכוּתוֹ
  choice: 在位期间
  rationale: 这里的介词短语具有时间意义，指亚哈斯作王执政的时期。
- source_word: בְּמַעֲלוֹ
  choice: 因背信
  rationale: מַעַל表示违背信义、失信或冒犯，在历代志的宗教语境中常带有对上帝不忠的含义；“背信”保留这种关系性和道德性的严重程度。
- source_word: הֵכַנּוּ
  choice: 我们都已经预备妥当
  rationale: 使役词形在此表示使器具恢复到可供使用的状态；“预备妥当”比单说“预备”更符合语境。
- source_word: וְהִקְדָּשְׁנוּ
  choice: 分别为圣
  rationale: 该使役词形表示将器具划归神圣用途；“分别为圣”准确表达礼仪性的设立，不暗示器具本身发生性质变化。
- source_word: וְהִנָּם
  choice: 看哪，它们就在
  rationale: הִנֵּה带有引人注意、指示眼前事实的作用；“看哪”保留原文庄重而鲜明的提示语气。
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: 在耶和华的祭坛前
  rationale: לִפְנֵי在此表达空间位置“在……前”；将神名作为专名译出，而不以称号“主”代替。
theological_decisions:
- issue: בְּמַעֲלוֹ所表达的罪责性质
  choice: 背信
  alternative: 过犯；不忠；行事不忠
  rationale: 原词不只是一般错误，而强调对既有信义关系的破坏。“背信”保留其宗教和关系层面的张力，同时不进一步指定某套系统神学解释。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文以中文读者广泛识别的专名“耶和华”呈现四字神名，保留其作为名字的功能；“雅威”更接近常见的学术拟音，而“上主”则以称号替代专名。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“分别为圣”保留圣殿礼仪语境中的专门含义；“看哪”有意保留原文的提示和展示语气。句首较长的关系结构呼应希伯来文将器具前置为焦点的表达，同时仍符合现代汉语习惯。
