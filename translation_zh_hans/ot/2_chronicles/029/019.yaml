    reason: lexical_alternative
  - marker: b
    text: “弃置”也可译作“撇在一边”或“弃而不用”；原词也可能包含疏于使用或照管的意味。
    reason: lexical_alternative
  revision_rationale: 修订“因背信而”为“背信时”，以免把原文的处境性介词短语限定为明确因果；以“并”清楚连接“预备”和“分别为圣”两个并列动作，并润饰脚注的现代汉语表达。脚注锚点仍分别对应“背信”和“弃置”。
