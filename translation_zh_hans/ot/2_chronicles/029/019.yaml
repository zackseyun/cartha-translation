revisions:
- from: 亚哈斯王在位期间因背信[a]而弃置[b]的所有器具，我们都已经预备妥当，分别为圣。看哪，它们就在耶和华的祭坛前。
  to: 亚哈斯王在位、背信时所弃置的所有器具，我们都已经预备妥当，并分别为圣。看哪，它们就在耶和华的祭坛前。
  rationale: 修订“因背信而”为“背信时”，以免把原文的处境性介词短语限定为明确因果；以“并”清楚连接“预备”和“分别为圣”两个并列动作，并润饰脚注的现代汉语表达。脚注锚点仍分别对应“背信”和“弃置”。
