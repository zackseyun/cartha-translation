base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: zh_hans
  text: 于是，耶和华的烈怒临到犹大和耶路撒冷；他使他们成为令人惊骇的对象[a]，沦为荒凉，受人发出讥诮的嘘声[b]，正如你们亲眼所见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可怕的景象”或“令人战栗之物”；希伯来语指使人惊骇或战栗的事物。
    reason: lexical_alternative
  - marker: b
    text: 直译“成为人发出嘘声（或吹哨声）的对象”；这里指旁观者面对毁灭景象所作的讥诮性反应。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: 烈怒
  rationale: 表达审判中强烈的神圣愤怒，比一般的“怒气”更贴近原文力度，同时符合现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确对应四字神名。
- source_word: וַיְהִי ... עַל
  choice: 临到
  rationale: 自然表达烈怒开始作用于犹大和耶路撒冷，也保留原文“在……之上”的动态含义。
- source_word: וַיִּתְּנֵם
  choice: 他使他们成为
  rationale: נתן与表示结果的介词ל连用，指使其落入某种公开可见的境况；此译法清楚呈现结果。
- source_word: לְזוֹעָה
  choice: 令人惊骇的对象
  rationale: 该词指引起战栗或惊骇的事物；此译法兼顾其使旁观者惊骇的含义。
- source_word: לְשַׁמָּה
  choice: 沦为荒凉
  rationale: 传达审判所造成的毁坏、荒废状态；“荒凉”是自然且庄重的现代汉语。
- source_word: וְלִשְׁרֵקָה
  choice: 受人嗤笑
  rationale: 原词描绘旁观者面对毁灭景象所发出的讥诮嘘声；中文以“嗤笑”自然传达其公开羞辱意味。
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: 正如你们亲眼所见
  rationale: 保留原文对听众直接而强调的诉诸，指出审判后果是他们当前可见的事实。
theological_decisions:
- issue: 是否弱化神施行审判的表述
  choice: 耶和华的烈怒临到……他使他们成为……
  alternative: 耶和华向……发怒……他们便成了……
  rationale: 原文明确把严厉的审判及其结果归于耶和华的行动；译文保留这一张力，不淡化，也不附加超出经文的教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“烈怒”“临到”“亲眼所见”保留经文的审判力度和直接诉诸；并通过脚注说明两个较难在中文正文中同时保留具体意象与自然表达的名词。
