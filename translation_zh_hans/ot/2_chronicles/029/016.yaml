base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: zh_hans
  text: 祭司进入耶和华殿里面，要洁净那里；他们把在耶和华殿堂里发现的一切污秽之物都搬到耶和华殿的院子里，利未人接过来，运到外面的汲沦溪谷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: 耶和华殿的内殿
  rationale: לִפְנִימָה 表示向内、进入内部；结合祭司进入圣殿洁净的语境，用“内殿”自然表达殿内较深处，又不擅自限定为至圣所。
- source_word: לְטַהֵר
  choice: 要洁净那里
  rationale: 保留不定式所表达的目的；补出“那里”使现代汉语语意完整，其所指为殿内。
- source_word: כָּל הַטֻּמְאָה
  choice: 一切污秽之物
  rationale: 此处指从殿中搬出的、造成礼仪不洁的东西；“污秽之物”兼顾实体语境与礼仪含义。
- source_word: בְּהֵיכַל יְהוָה
  choice: 耶和华殿堂里
  rationale: הֵיכָל 在这里指圣殿建筑内部；译作“殿堂”以区别本节较广义的“耶和华殿”，但不把范围过度限定为某一圣所分区。
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: 到外面的汲沦溪谷去
  rationale: נַחַל 可指溪流或溪谷；此处是搬运目的地，采用熟悉而符合地形的“汲沦溪谷”，并明确保留 חוּצָה 的“外面”之意。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，明确对应四字神名，同时避免仅用称号而隐藏原文专名。
- issue: הַטֻּמְאָה 的礼仪含义
  choice: 污秽之物
  alternative: 不洁之物／一切污秽
  rationale: 原词具有礼仪不洁的背景，但本句又描述可被搬出的对象；该译法既不将其弱化为普通垃圾，也不额外断定具体物件或罪的性质。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。句式按原文动作顺序展开，以分号和逗号保持叙事连贯；避免古奥的“其内”“除秽”等表达，也不加入原文没有说明的礼仪细节。
