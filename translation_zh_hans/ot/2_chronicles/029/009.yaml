base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: zh_hans
  text: 看哪[a]，我们的父辈倒在刀剑之下；我们的儿子、女儿和妻子因这事被掳[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们看”。希伯来语的这一话语标记着重引人注意下文。
    reason: lexical_alternative
  - marker: b
    text: 直译“在被掳的境况中”，即处于被俘的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 这是引人注意并加强语气的话语标记；“看哪”保留其庄重、强调的功能。句首的连接作用在现代汉语中由上下文自然承接，不机械译出“并且”。
- source_word: נָפְלוּ
  choice: 倒在
  rationale: 保留 נפל“倒下”的形象；与“刀剑之下”连用，在现代汉语中自然表达战乱中的死亡，又不额外增添原文没有的细节。
- source_word: אֲבוֹתֵינוּ
  choice: 我们的父辈
  rationale: 原文为阳性复数“我们的父亲们”，此处指先前一代的男性；“父辈”比逐字的“父亲们”自然，也比“祖先”更贴合近代亲属语境。
- source_word: בֶּחָרֶב
  choice: 在刀剑之下
  rationale: 保留希伯来语以“刀剑”表示战争暴死的惯用形象；汉语“倒在刀剑之下”庄重自然。
- source_word: וּבָנֵינוּ וּבְנוֹתֵינוּ
  choice: 我们的儿子、女儿
  rationale: 分别保留原文所列的男性和女性后代，不合并为泛称“儿女”或“孩子”。
- source_word: וְנָשֵׁינוּ
  choice: 我们的妻子
  rationale: 在带领属后缀的家庭成员清单中，נָשִׁים 最自然地指“妻子”，而非泛指“妇女”。
- source_word: בַּשְּׁבִי
  choice: 被掳
  rationale: 原文字面为“在被掳/俘虏的状态中”；汉语“被掳”简洁表达其现时被俘状态。脚注保留较贴近名词结构的译法。
- source_word: עַל זֹאת
  choice: 因此
  rationale: 表达因果关系，回指上文所述的背信及其后果；“因此”在汉语中简洁清楚。
theological_decisions:
- issue: 审判语境中的性别化亲属称谓
  choice: 我们的父辈……我们的儿子、女儿和妻子
  alternative: 我们的祖先……我们的孩子和妇女
  rationale: 原文有意逐项列出不同家庭群体。译文保留这些性别与亲属区别，不将其概括为中性集合称谓。
- issue: עַל זֹאת 所指的因果关系
  choice: 因此
  alternative: 为此／由于这事
  rationale: 该短语回指上下文中犹大的不忠以及由此临到的审判。译作“因此”保留回指，不在本节内替原文具体说明“这”究竟涵盖哪些罪行。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“看哪”保留原文的强调语气；分号呈现本节两项灾祸之间的并列关系。“父辈”“儿子、女儿和妻子”既自然，也保留原文明确的亲属类别。
