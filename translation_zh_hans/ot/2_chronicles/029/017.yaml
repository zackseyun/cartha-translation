revisions:
- from: 他们在正月初一开始行分别为圣的工作；本月初八，他们来到雅威殿的廊门[a]。他们用了八天使雅威的殿分别为圣，到正月十六日才完成。
  to: 他们在正月初一开始进行分别为圣的工作；到正月初八，他们来到雅威殿的前廊。随后，他们用八天使雅威的殿分别为圣；正月十六日完成了。
  rationale: 修订将“廊门”改为“前廊”，以准确对应אוּלָם；将“本月初八”明示为“正月初八”；并删除“才”所附加的语气。其余译法保留原稿对日期、神名和קדשׁ礼仪语义的处理。
