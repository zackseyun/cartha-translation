  text: וַ֠/יָּחֵלּוּ בְּ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הָ/רִאשׁוֹן֮ לְ/קַדֵּשׁ֒ וּ/בְ/י֧וֹם שְׁמוֹנָ֣ה לַ/חֹ֗דֶשׁ בָּ֚אוּ לְ/אוּלָ֣ם יְהוָ֔ה וַ/יְקַדְּשׁ֥וּ אֶת בֵּית יְהוָ֖ה לְ/יָמִ֣ים שְׁמוֹנָ֑ה וּ/בְ/י֨וֹם שִׁשָּׁ֥ה עָשָׂ֛ר לַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן כִּלּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: zh_hans
  text: 他们在正月初一开始进行分别为圣的工作；到正月初八，他们来到雅威殿的前廊。随后，他们用八天使雅威的殿分别为圣；正月十六日完成了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּחֵלּוּ
  choice: 开始
  rationale: 准确表达希伯来语使役词形在此处“开始”的叙事含义，简洁自然。
- source_word: לְקַדֵּשׁ
  choice: 行分别为圣的工作
  rationale: קדשׁ在圣殿语境中指为神圣用途而洁净、分别出来；此译保留“成为圣洁”的核心含义，又避免在原文未明说宾语之处擅自补出具体对象。
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: 在正月初一
  rationale: 这是汉语表达宗教历法第一个月第一日的自然方式；“正月”在此仅指一年首月，并不强行等同于中国农历。
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: 他们来到雅威殿的廊门
  rationale: אוּלָם指圣殿主体前方的门廊或前廊；“来到”保留方向含义，不把原文过度解释为进入圣所内部。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现原文中的神名四字母，而不以称号代替专名。
- source_word: וַיְקַדְּשׁוּ אֶת בֵּית יְהוָה
  choice: 使雅威的殿分别为圣
  rationale: “雅威的殿”自然表达בית יהוה所指的圣殿；“分别为圣”与本节前半的קדשׁ保持词义呼应，并涵盖礼仪洁净和奉献作圣的语境。
- source_word: לְיָמִים שְׁמוֹנָה
  choice: 用了八天
  rationale: 自然表达完成这一阶段所用的时间，同时符合从初八到十六日完成的叙事进程。
- source_word: כִּלּוּ
  choice: 才完成
  rationale: כלה的加强词形表示完成；“才”在汉语中清楚衔接前述八天工期和最后日期，但不额外加入评价。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神名יהוה。音译“雅威”保留其作为专名的性质；不以“上主”这一称号取代，也不采用源自后期元音组合传统的“耶和华”。
- issue: קדשׁ在圣殿整顿语境中的含义
  choice: 分别为圣
  alternative: 洁净；使成圣
  rationale: 上下文涉及清除污秽并恢复圣殿用途，因此该词兼有礼仪洁净和奉献作圣的色彩。“分别为圣”保留这种张力，不将含义缩减为单纯清扫，也不暗示圣殿此前全无神圣地位。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正月初一”与“正月十六日”简明呈现希伯来历法日期；“雅威的殿”在首次出现廊门时补出“殿”，使中文建筑关系清楚，但不增添原文没有的神学判断。
