base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: zh_hans
  text: 随后，他们把作赎罪祭的公山羊带到王和会众面前；王和会众[a]把手按在它们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他们把手按在它们身上”。这里的“他们”最自然地指王和会众；这项礼仪也可能由他们的代表执行。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: 牵到……面前
  rationale: 该词是 נגשׁ 的使役式，表示“使靠近、呈上”。因宾语是活的公山羊，“牵到……面前”既体现实际移动，也符合现代汉语表达。
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: 赎罪祭的公山羊
  rationale: שָׂעִיר 指公山羊；חַטָּאת 在此献祭语境中指赎罪祭，并非抽象的“罪”。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 表示这些祭牲被带到王和聚集的群体面前，保留礼仪场景中的空间与呈献意味。
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: 王和会众
  rationale: קָהָל 指聚集起来的共同体；“会众”在此庄重自然，又不特指某种教会制度。
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: 把手按在
  rationale: סמך 与“手”连用时描述献祭中按手在祭牲上的礼仪动作；“按在”比直译为“倚靠”更符合现代汉语及该语境。
- source_word: עֲלֵיהֶם
  choice: 羊身上
  rationale: 复数代词回指前面的公山羊。汉语补出“羊”可避免连续代词造成歧义，同时不增加实质信息。
theological_decisions:
- issue: חַטָּאת 在献祭语境中的含义
  choice: 赎罪祭
  alternative: 罪
  rationale: 上下文提到公山羊被带来并接受按手，明确显示这里所指的是为罪而献的祭物。
- issue: “把手按在羊身上”的施事者
  choice: 正文明确为王和会众，同时以脚注保留可能由代表执行的空间
  alternative: 祭司把手按在羊身上
  rationale: 希伯来文动词的复数主语未再次明说，但最近的复数先行项是“王和会众”，而“他们的手”也自然回指二者。为使汉语指代清楚，正文重复主语；脚注说明集体行动可能由代表执行，但不改成经文未明说的“祭司”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“牵到……面前”适合活祭牲，“赎罪祭”保留礼仪术语。为避免希伯来文中连续复数主语在汉语里产生歧义，后半句明说“王和会众”，并用脚注交代原文形式及代表性行动的可能。
