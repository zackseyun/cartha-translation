base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: zh_hans
  text: 希西家王和众首领吩咐利未人用大卫和先见亚萨的话[a]赞美耶和华。于是，他们欢欢喜喜地赞美[b]，又俯伏，又敬拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照大卫和先见亚萨的话”。
    reason: 介词בְּ既可表示“用”，也可表示“照着、按照”。
  - marker: b
    text: 希伯来文直译近于“直到喜乐”或“达到喜乐”；意思可能是他们的赞美洋溢着喜乐。
    reason: 原文עַד לְשִׂמְחָה的表达不寻常，正文采用自然中文，脚注保留其字面形式和语义张力。
lexical_decisions:
- source_word: וַיֹּאמֶר ... לַ לְוִיִּם לְהַלֵּל
  choice: 吩咐利未人……赞美
  rationale: אָמַר本义为“说”，但“对某人说去做某事”的句式在这里表达指示；“吩咐”自然明确，又不像“命令”那样强化语气。
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: 王和众首领
  rationale: שָׂרִים指有领导或治理职分的人；“众首领”符合历代志语境，也避免现代“官员”可能带来的纯行政色彩。
- source_word: לְהַלֵּל לַיהוָה
  choice: 赞美耶和华
  rationale: הלל在礼仪语境中意为“赞美”；יהוה按其专名译为“耶和华”。
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: 用大卫和先见亚萨的话
  rationale: 介词בְּ可表示凭借或采用的内容，דִבְרֵי直译为“话”；此译不擅自收窄为“诗歌”，并保留“按……的话”的可能解释。
- source_word: הַחֹזֶה
  choice: 先见
  rationale: חֹזֶה是与先知职分相关的传统称号；“先见”是中文圣经语体中准确而简洁的对应。
- source_word: עַד לְשִׂמְחָה
  choice: 欢欢喜喜地
  rationale: 原文较特殊，字面近于“直到喜乐／达到喜乐”；结合礼仪场景，将其自然表达为赞美时洋溢喜乐，同时以脚注保留字面形式。
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: 又俯伏敬拜
  rationale: 两个动词分别涉及俯身和敬拜。中文“俯伏敬拜”保留身体动作与敬拜行为，同时避免生硬重复。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。采用现代中文读者最熟悉的专名“耶和华”，不以“主”替代，从而保留其专名性质。
- issue: 大卫和亚萨之“话”与赞美的关系
  choice: 用……的话
  alternative: 照……的话
  rationale: 介词בְּ既可理解为使用这些话作为赞美内容，也可理解为依照这些话；正文选择较符合礼仪语境的工具／内容义，并用脚注保留另一种读法。
- issue: 末句两个敬拜动词的关系
  choice: 俯伏敬拜
  alternative: 俯身，又敬拜
  rationale: 原文有两个并列动词。中文组合表达既呈现身体俯伏，也呈现敬拜，不将其解释成额外的礼仪或教义规定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吩咐”“首领”“先见”“俯伏敬拜”保留历史礼仪语境；“欢欢喜喜地”自然传达喜乐的情态。所有脚注标记均已置于正文对应位置。
