  terminology: “希西家王”“众首领”“利未人”“先见”“耶和华”均恰当；“耶和华”准确保留神名的专名性质。脚注a保留介词בְּ的工具义与“按照”义之可能，脚注b适当地说明罕见表达，不把其句法语义过度确定化。
