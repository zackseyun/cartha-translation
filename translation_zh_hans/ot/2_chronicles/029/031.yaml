revisions:
- from: 希西家回应说：“现在你们已经为雅威承接圣职了[a]。你们要上前，把祭物和感恩祭带到雅威的殿里。”于是，会众带来祭物和感恩祭；凡心里甘愿的，也都带来燔祭。
  to: 希西家回应说：“现在你们已经为雅威受职了[a]。你们要上前，把祭物和感恩祭带到雅威的殿里。”于是，会众带来祭物和感恩祭；凡心里甘愿的，也都带来燔祭。
  rationale: 修订仅优化礼仪任职惯用语及脚注的汉语表达。“为雅威受职”保留原文在此语境中的祝圣／任职含义，却不把它表述为职位交接，也不限定具体职级；其余译文忠实、自然，予以保留。
