  text: וַ/יַּ֨עַן יְחִזְקִיָּ֜הוּ וַ/יֹּ֗אמֶר עַתָּ֨ה מִלֵּאתֶ֤ם יֶדְ/כֶם֙ לַ/יהוָ֔ה גֹּ֧שׁוּ וְ/הָבִ֛יאוּ זְבָחִ֥ים וְ/תוֹד֖וֹת לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבִ֤יאוּ הַ/קָּהָל֙ זְבָחִ֣ים וְ/תוֹד֔וֹת וְ/כָל נְדִ֥יב לֵ֖ב עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: zh_hans
  text: 希西家回应说：“现在你们已经为雅威受职了[a]。你们要上前，把祭物和感恩祭带到雅威的殿里。”于是，会众带来祭物和感恩祭；凡心里甘愿的，也都带来燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“你们已经使自己的手为雅威充满了”；这是指受任从事圣礼、归雅威为圣的惯用说法。
    reason: 说明正文所译希伯来礼仪惯用语，并保留其字面表达。
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回应说
  rationale: 保留希伯来叙事中“回答并说”的回应意味，同时避免现代汉语中“回答说”的生硬重复。
- source_word: מִלֵּאתֶם יֶדְכֶם לַיהוָה
  choice: 你们已经为雅威承接圣职了
  rationale: 该短语字面为“你们为雅威充满了自己的手”，是承接或受任圣职的固定礼仪用语；正文传达其惯用意义，脚注保留字面表达。
- source_word: גֹּשׁוּ
  choice: 上前
  rationale: 表达走近并参与圣所礼仪的含义，符合自然现代汉语。
- source_word: זְבָחִים
  choice: 祭物
  rationale: 指宰杀献上的祭牲或祭物；“祭物”在此可自然涵盖这一广义祭祀类别。
- source_word: תוֹדוֹת
  choice: 感恩祭
  rationale: 指为感谢而献的祭，使用明确而常见的祭祀术语。
- source_word: לְבֵית יְהוָה
  choice: 到雅威的殿里
  rationale: בֵּית字面是“家、殿”；在圣殿语境中译作“殿”清楚自然，并保留其归属关系。
- source_word: הַקָּהָל
  choice: 会众
  rationale: 指聚集起来的共同体；“会众”适合公共敬拜语境。
- source_word: כָל נְדִיב לֵב
  choice: 凡心里甘愿的
  rationale: 保留意愿发自内心的希伯来表达，不把它缩窄为单纯的慷慨。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是整只焚烧献上的祭类，采用规范且简洁的汉语术语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，体现原文直接使用上帝盟约之名。
theological_decisions:
- issue: מִלֵּאתֶם יֶדְכֶם所表达的圣职身份
  choice: 为雅威承接圣职
  alternative: 为雅威使自己的手充满；把自己分别为圣归给雅威
  rationale: 这是旧约中与任职、承接圣职相关的礼仪惯用语。上下文涉及已经自洁并恢复圣殿礼仪的人；译作“承接圣职”传达该惯用意义，但不进一步限定具体职级。脚注保留其字面形式与语义范围。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文两次直接使用四字神名，音译可保留其作为盟约名字的性质。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“回应说”“上前”“带来”保持叙事流畅；祭祀术语“感恩祭”“燔祭”则保留经文的礼仪类别。
