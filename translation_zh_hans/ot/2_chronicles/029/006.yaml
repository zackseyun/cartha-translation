id: 2CH.29.6
reference: 2 Chronicles 29:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: zh_hans
  text: 因为我们的祖先行事不忠[a]，做了雅威我们神眼中看为恶的事。他们离弃他，把脸转离雅威的居所[b]，背过身去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“背信”或“干犯”。原文动词常指不忠或背信，尤其可用于违背盟约或宗教责任。
    reason: lexical_alternative
  - marker: b
    text: 原文为“离开雅威的居所”。这里所指的是圣殿；“会幕”也可作为该词在其他语境中的译法。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近于“把颈项（后颈）给出”，是表示背转、拒绝或反叛的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: 行事不忠
  rationale: 该动词指背信、失信，常带有违背盟约或宗教责任的意味。“行事不忠”既保留这种关系与盟约层面的分量，又符合现代汉语表达。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: 与 עשה 连用时，表示“做恶事”或“做被视为恶的事”；结合 בְּעֵינֵי，译为“眼中看为恶的事”，保留原文的评价结构。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威……眼中
  rationale: 保留希伯来语“在……眼中”的常见意象，同时在汉语中补入“看为”，使句意自然清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代其专名。
- source_word: וַיַּעַזְבֻהוּ
  choice: 他们离弃他
  rationale: 此处指对神的关系性和宗教性背弃；“离弃”准确且庄重，也不显陈旧。
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: 转脸背向
  rationale: 保留“转脸”的身体意象，并用“背向”自然表达介词 מִן 所表示的离开方向。
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: 雅威的居所
  rationale: מִשְׁכָּן 本义为居住之处；本节语境指圣殿作为雅威的居所。“居所”既忠于词义，也避免让读者误以为这里只能指旷野时期的会幕。
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: 又把背转过去
  rationale: 原文直译近于“把后颈给出”，是表示拒绝、背弃的身体惯用语。“把背转过去”在现代汉语中自然，并与前句“转脸背向”形成平行意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名而非“主”这一称号；“雅威”较直接反映学界通常重构的读音，同时不把专名改成称号。
- issue: 圣殿语境中 מִשְׁכָּן 的理解
  choice: 居所
  alternative: 会幕；圣所
  rationale: 本章论及圣殿礼仪，而该词本身着重“居住之处”。译作“居所”保留神居于其中的神学意象，又不把所指限定为摩西时代的会幕。
- issue: וַיִּתְּנוּ עֹרֶף 的反叛含义
  choice: 以身体动作“把背转过去”表达，不直接增译“悖逆”
  alternative: 悖逆；硬着颈项
  rationale: 原文通过身体惯用语暗示拒绝与反叛。正文保留这一意象，避免把隐含意义直接解释进经文；脚注说明其语用含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行事不忠”“离弃”“居所”保留经文的宗教与盟约分量，但避免生僻古语；末句保留原文连续的身体意象，不把隐含的反叛意义过度明说。
