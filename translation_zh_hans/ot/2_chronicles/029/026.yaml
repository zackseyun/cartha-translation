  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: zh_hans
  text: 于是，利未人手持大卫的乐器[a]站立，祭司手持号筒[b]站立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大卫所定的乐器”。原文可指属于大卫、由大卫指定，或与大卫有关的乐器。
    reason: lexical_alternative
  - marker: b
    text: 指祭司在礼仪中使用的号筒；其他经文说明这类号筒是银制的，但本节没有明说。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: 于是……站立
  rationale: 未完成式配合叙事性连接词推进事件次序；译作“于是……站立”，既符合现代汉语叙事习惯，也保留“站立、就位”的基本含义。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是对该支派及其礼仪职分群体的标准译法；原文定冠词所表达的特指在语境中自然体现。
- source_word: בִּכְלֵי דָוִיד
  choice: 拿着大卫的乐器
  rationale: כְּלִי 可泛指器具，但圣殿礼乐语境表明这里是乐器。介词 בְּ 表示伴随或所用器具，汉语用“拿着”表达自然；“大卫的”保留属格关系，而不限定为所有、制作或制定。
- source_word: וְהַכֹּהֲנִים
  choice: 祭司也
  rationale: 原文以并列连词引出第二组人；“也”在汉语中清楚呈现两组人各持器具站立的平行结构。
- source_word: בַּחֲצֹצְרוֹת
  choice: 拿着号筒
  rationale: חֲצֹצְרָה 指祭司礼仪中使用的直管号筒。“号筒”比泛称“号”更具体；本节未明说材质，因此正文不增补“银”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以“拿着……站立”自然表达两组礼仪人员各持乐器就位的画面；不把“大卫的”属格关系解释得过窄，也不在正文补入原文未出现的“银”。
