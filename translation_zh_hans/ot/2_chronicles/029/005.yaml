  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: zh_hans
  text: 他对他们说：“利未人哪，你们要听我说！如今，你们要使自己分别为圣，也要使雅威——你们祖先的神——的殿分别为圣，并把污秽[a]从圣所[b]中清除出去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不洁”或“不洁之物”；希伯来语指会玷污圣所的礼仪性污秽，或造成这种玷污的事物。
    reason: lexical_alternative
  - marker: b
    text: 或译“神圣之处”或“圣域”；这里指圣殿内的神圣区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: 要听我说
  rationale: 这是带第一人称单数宾语后缀的命令式；“要听我说”自然地表达直接而郑重的召唤。
- source_word: הַלְוִיִּם
  choice: 利未人哪
  rationale: 这是对利未人的直接称呼；语气词“哪”在现代庄重汉语中清楚标示呼语。
- source_word: עַתָּה
  choice: 现在
  rationale: 保留时间副词及立即行动的劝令意味，不额外强化为“立刻”。
- source_word: הִתְקַדְּשׁוּ
  choice: 使自己分别为圣
  rationale: 该词为קדש的反身命令式，指为圣殿职事作礼仪上的预备；“分别为圣”保留其宗教礼仪含义。
- source_word: וְקַדְּשׁוּ
  choice: 也要使……分别为圣
  rationale: 与前一动词同出קדש；重复“分别为圣”保留原文的词根呼应，并表明对象转为雅威的殿。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת直译为“房屋”，但在此明确指圣殿；汉语用“殿”既自然又保留其敬拜场所的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，不以称号替代专名。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: 你们祖先的神
  rationale: “祖先”自然涵盖历代先祖，准确传达此处的圣约历史表达，同时避免现代汉语中“父亲们”的歧义。
- source_word: וְהוֹצִיאוּ
  choice: 清除出去
  rationale: 该使役命令式表示使某物离开；结合清理圣殿的语境，“清除出去”自然表达移除造成玷污之物。
- source_word: הַנִּדָּה
  choice: 污秽
  rationale: 此词在这里指玷污圣所的礼仪性不洁；“污秽”保留抽象性，也可由语境涵盖造成污秽的事物。
- source_word: מִן הַקֹּדֶשׁ
  choice: 从圣所中
  rationale: קֹדֶשׁ在本节指神圣场所；“圣所”比抽象的“圣洁”准确，也保留其范围可能指圣殿神圣区域的弹性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”以较贴近学界通常重构的读音，并保留这是专名而非“主”等称号。
- issue: קדש用于人和圣殿时的表达
  choice: 两处均译为“分别为圣”
  alternative: 前者译“洁净自己”，后者译“洁净圣殿”
  rationale: 原文连续使用同一词根，既涉及礼仪预备，也涉及使圣殿恢复合宜的神圣状态；统一译法保留词根呼应，不把其意义缩减为一般清洁。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“利未人哪”保留公开训示的呼语色彩；“使……分别为圣”保留圣殿礼仪语域，两次重复则反映原文קדש词根的刻意呼应。脚注标记置于实际涉及词义差异的“污秽”和“圣所”之后。
