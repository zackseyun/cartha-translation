  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: zh_hans
  text: 全体会众都俯伏敬拜，歌声在响，号角在鸣响；这一切一直持续到燔祭献完。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָּהָל
  choice: 全体会众
  rationale: 指聚集敬拜的群体；“会众”自然、庄重，并保留共同体含义。
- source_word: מִשְׁתַּחֲוִים
  choice: 俯伏敬拜
  rationale: 该词既描写俯身、伏地的身体动作，也在此敬拜语境中表达敬拜；合译可兼顾动作与功能。
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: 歌声响起
  rationale: 原文直译近似“歌在歌唱”，属于以“歌”为主语的表达；汉语用“歌声响起”自然地传达歌唱正在进行，而不强行指定歌唱者。
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: 号角吹响
  rationale: 指礼仪中使用的直管号；原文以号角为主语，现代汉语“号角吹响”简洁自然。
- source_word: הַכֹּל
  choice: 这一切
  rationale: 概括前述俯伏、歌唱和吹号等全部敬拜行动。
- source_word: עַד לִכְלוֹת
  choice: 持续到……献完为止
  rationale: 表达前述行动延续至献祭完成这一终点。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: 这是עֹלָה的传统且准确的祭祀术语，指全部焚烧献上的祭物。
theological_decisions: []
translation_notes:
  register: 采用现代标准普通话，语气庄重而清楚。用分号区分会众俯伏与歌声、号角同时进行的场景，再以独立句概括这些行动一直延续到燔祭结束。
