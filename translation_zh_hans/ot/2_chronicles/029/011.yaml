base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: zh_hans
  text: 我的儿子们啊，现在不要懈怠[a]，因为雅威拣选了你们，要你们侍立在他面前[b]，事奉他，并作服事他的侍从和烧香的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “懈怠”也可译为“松懈”或“疏忽”。
    reason: lexical_alternative
  - marker: b
    text: “侍立在他面前”是祭司用语，指在上帝面前供职。
    reason: cultural_note
  - marker: c
    text: “烧香的人”也可译为“献香的人”；原词指使祭物或香上腾，在这里指圣殿中的烧香职务。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
  choice: 我的众子啊
  rationale: 保留“我的儿子们”的阳性复数呼语及亲切、郑重的劝勉语气；上下文所指是祭司和利未人。
- source_word: אַל תִּשָּׁלוּ
  choice: 不要懈怠
  rationale: 此处动词在圣殿职责的语境中指松懈、疏忽职守；“不要懈怠”自然且保留劝诫力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译四字神名，不以“主”这一称号代替。
- source_word: לַעֲמֹד לְפָנָיו
  choice: 侍立在他面前
  rationale: 既保留“站在……面前”的希伯来意象，也借“侍立”表达祭司在上帝面前供职的含义。
- source_word: לְשָׁרְתוֹ
  choice: 事奉他
  rationale: שרת在祭司礼仪语境中指履行圣所职务；“事奉”比一般的“服务”更符合此处。
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים וּמַקְטִרִים
  choice: 并作服事他、烧香的人
  rationale: 将两个并列分词理解为受任命的职分或角色，以自然中文保留“服事”与“烧香”两项并列职责。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名；“雅威”按通行学术重构音译，避免用称号替代专名。“耶和华”是中文传统译名，但反映的是另一种历史读音形式。
- issue: “侍立在他面前”的性质
  choice: 保留祭司性表达，不展开为解释性译文
  alternative: 在他面前供职
  rationale: 原文既有实际站立的图像，也含在上帝面前履行圣职的惯用意义；正文保留两者之间的张力，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“我的众子啊”保留领袖对祭司和利未人的父辈式称呼；“侍立”“事奉”维持圣殿礼仪语域，但避免过度古雅。
