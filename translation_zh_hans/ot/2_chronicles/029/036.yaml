  text: וַ/יִּשְׂמַ֤ח יְחִזְקִיָּ֨הוּ֙ וְ/כָל הָ/עָ֔ם עַ֛ל הַ/הֵכִ֥ין הָ/אֱלֹהִ֖ים לָ/עָ֑ם כִּ֥י בְּ/פִתְאֹ֖ם הָיָ֥ה הַ/דָּבָֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: zh_hans
  text: 希西家和全体百姓都因上帝为百姓所预备的而欢喜[a]，因为这事发生得很突然。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝预备了百姓”，或“上帝为百姓确立了这事”。
    reason: 原文可指上帝为百姓有所预备，也可指上帝使百姓预备妥当，或为他们确立此事。
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: 欢喜
  rationale: שׂמח表示喜乐、欣喜；“欢喜”符合现代汉语叙事语体，也自然表达公开的喜悦。
- source_word: יְחִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וְכָל הָעָם
  choice: 和全体百姓
  rationale: עָם在此指共同参与敬拜复兴的民众；“全体百姓”既保留כָל的整体含义，也符合中文表达。
- source_word: עַל
  choice: 因
  rationale: עַל接在表示欢喜的动词之后，可引出欢喜的缘由或对象；“因”简洁自然。
- source_word: הֵכִין
  choice: 所预备的
  rationale: כון的使役形可表示预备、使就绪或确立。此处宾语没有明说，用“所预备的”保留其开放性，不擅自限定为百姓本身。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处明确指以色列的上帝；采用庄重而通行的现代汉语称谓。
- source_word: לָעָם
  choice: 为百姓
  rationale: 介词ל在此自然表示受益对象，译作“为百姓”比“预备百姓”更贴近希伯来语形式，并避免把百姓断定为直接宾语。
- source_word: כִּי
  choice: 因为
  rationale: כִּי引出解释前述欢喜缘由的从句；现代汉语用“因为”清楚自然。
- source_word: בְּפִתְאֹם
  choice: 很突然
  rationale: 该副词表示事情出乎意料地迅速发生；“很突然”保留突发、迅速的语感。
- source_word: הָיָה הַדָּבָר
  choice: 这事发生
  rationale: דָּבָר在此泛指整个事件或进展；“这事发生”保留原文的概括性，不将所指过度具体化。
theological_decisions:
- issue: 上帝预备的对象或内容
  choice: 上帝为百姓所预备的
  alternative: 上帝预备了百姓；上帝为百姓确立了这事
  rationale: 原文הֵכִין后接לָעָם，既可理解为上帝为百姓有所预备，也可能在语境中指上帝使百姓预备妥当，或确立此事。正文保留未明说的预备内容，并把לָעָם译为受益对象；脚注列出其他合理理解，以保存原文的歧义和神圣行动的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“所预备的”在中文中允许省略具体内容，与希伯来文在此处的语义开放性相应；“这事”则概括前文敬拜恢复的整个进展。
