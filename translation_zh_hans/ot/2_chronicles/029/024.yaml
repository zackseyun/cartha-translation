  verdict: revise
  source_fidelity: 正文的献祭范围、因果关系及“燔祭／赎罪祭”均与希伯来文相符。但“把它们的血献在祭坛上”在现代汉语中较容易被理解为把血作为祭物献上，未充分表达血被施用于祭坛的礼仪动作。改为“施在祭坛上”较忠实地保留原文未说明涂抹或洒血方式的概括性。
  naturalness: 修订后采用“将……血施在祭坛上”和“都是为全以色列献的”，语体庄重、自然，并保留经文所需的祭祀术语。
  terminology: “燔祭”“赎罪祭”“赎罪”均为通行且适切的术语。脚注保留“洁净祭”以及祭坛得洁净的可行理解，避免将חטאת的语义限缩为单一神学解释。
  issues:
  - severity: medium
    issue: “把它们的血献在祭坛上”可能将血误解为被献上的祭物。
    rationale: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה指祭司以祭牲之血在祭坛上施行赎罪／洁净礼；原文未明确涂、洒等具体方式。用“施在祭坛上”能表达礼仪性的血之施用，又不擅定动作。
  - severity: low
    issue: 末句“是为全以色列献的”可加“都”以明确两个祭的共同范围。
    rationale: 希伯来文以“燔祭和赎罪祭”为并列主语，二者均属“为全以色列”的范围；“都是”使中文关系更清楚，未增添原文意义。
  revised_text: 祭司宰杀了它们，将它们的血施在祭坛上[a]，为全以色列赎罪；因为王曾说，燔祭和赎罪祭[b]都是为全以色列献的。
