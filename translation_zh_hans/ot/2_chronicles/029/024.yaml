base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: zh_hans
  text: 祭司宰杀了它们，将它们的血施在祭坛上[a]，为全以色列赎罪；因为王曾说，燔祭和赎罪祭[b]都是为全以色列献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用它们的血洁净祭坛。”这里的希伯来语动词可指施行洁净礼或赎罪祭的礼仪。
    reason: lexical_alternative
  - marker: b
    text: “赎罪祭”或译“洁净祭”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: 宰杀了它们
  rationale: שׁחט在献祭语境中指宰杀祭牲；宾语后缀指上一节的公山羊。“宰杀”既准确表达祭牲被杀，也不额外增添原文未明说的成分。
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: 把它们的血献在祭坛上
  rationale: חטא的使役形在祭司礼仪中可指施行赎罪祭或洁净礼；这里以“它们的血”为宾语，并以“祭坛”为方向。“献在祭坛上”自然表达祭司把血用于祭坛礼仪，同时不武断限定为抹、洒等具体动作。脚注保留“用血洁净祭坛”的可能理解。
- source_word: לְכַפֵּר
  choice: 赎罪
  rationale: כפר在献祭语境中表示借礼仪施行遮罪、洁净或和解；“赎罪”是现代中文圣经语体中清楚且通行的对应词。
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: 为全以色列
  rationale: 介词עַל在此标明赎罪礼所代表和惠及的对象；“为全以色列”简洁保留其代表性范围。
- source_word: כִּי
  choice: 因为
  rationale: 此词引出献祭涵盖全以色列的原因；“因为”符合现代汉语因果表达。
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: 王曾说……是为全以色列献的
  rationale: 按自然汉语调整希伯来语词序，并以“曾说”表达该话相对于当前献祭行动的先行背景；不把“说”强化成“命令”。
- source_word: הָעוֹלָה
  choice: 燔祭
  rationale: עוֹלָה指祭物全部焚烧献上的祭，传统且通行的中文术语是“燔祭”。
- source_word: וְהַחַטָּאת
  choice: 赎罪祭
  rationale: חַטָּאת在献祭语境中指处理罪或不洁的祭。“赎罪祭”便于普通读者理解，同时用脚注保留“洁净祭”所强调的礼仪洁净含义。
theological_decisions:
- issue: חטא／חטאת相关献祭术语兼有处理罪与施行洁净礼的含义
  choice: 正文采用“赎罪祭”，并把祭司对血所行的礼仪译作“把它们的血献在祭坛上”
  alternative: “洁净祭”；“用它们的血洁净祭坛”
  rationale: 上下文明确属于圣殿献祭程序。“赎罪祭”是普通中文读者较熟悉的名称，但希伯来词根也可突出除去礼仪不洁，因此脚注保存另一种理解。正文对血的处理采用较宽泛措辞，避免在原文没有明确动作方式时擅自指定为抹或洒，也避免把血本身等同于赎罪祭。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“燔祭”“赎罪”等必要的献祭术语；句法按自然汉语重组，但没有把原文的“说”强化为“吩咐”，也没有限定血是抹上还是洒上。
