- from: 他们宰了牛群[a]，祭司接了血，把血泼洒在祭坛上[b]。他们又宰了公绵羊，把血泼洒在祭坛上；随后宰了羊羔，也把血泼洒在祭坛上。
  to: 他们宰杀了牛[a]，祭司接了血，把血泼在祭坛上[b]。他们又宰杀了公绵羊，把血泼在祭坛上；随后宰杀了羊羔，也把血泼在祭坛上。
  rationale: 仅作安全的汉语措辞调整：以“牛”替换不够地道的“牛群”，避免将集合名词误表达为一群活体；并将“泼洒”简化为更自然的“泼”。原文的重复结构、祭牲类别、祭司接血及血施于祭坛的动作均完整保留。脚注锚点仍分别对应“牛”和首次施血动作，且脚注内容与锚点一致。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:38Z'
