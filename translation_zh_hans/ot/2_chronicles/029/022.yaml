base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: zh_hans
  text: 他们宰杀了牛[a]，祭司接了血，把血泼在祭坛上[b]。他们又宰杀了公绵羊，把血泼在祭坛上；随后宰杀了羊羔，也把血泼在祭坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牛”所译的希伯来语是牛类牲畜的集合称呼；按献祭语境，也可理解为“公牛”。
    reason: lexical_alternative
  - marker: b
    text: “泼在”也可译作“泼洒在”或“泼向”。希伯来语动词指礼仪中有力地施用血，并非轻轻地撒几滴。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: 宰了
  rationale: שׁחט在献祭语境中指宰杀祭牲；“宰了”自然、明确，并保留礼仪性宰杀的含义。
- source_word: הַבָּקָר
  choice: 牛群
  rationale: בקר是牛类牲畜的集合名词；“牛群”保留其集合性，不擅自限定为公牛。
- source_word: וַיְקַבְּלוּ
  choice: 接了
  rationale: קבל的基本义是“接、领受”；这里指祭司接取祭牲的血。“接了血”符合中文表达，也不过度说明具体容器或方式。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כהנים的标准译法；中文中集合性主语无需另加复数标记。
- source_word: הַדָּם
  choice: 血
  rationale: 直接表达献祭所用的血；上下文已使所指明确。
- source_word: וַיִּזְרְקוּ
  choice: 泼洒
  rationale: זרק在献祭礼仪中表示将血有力地洒向或泼到祭坛上；“泼洒”比“轻轻撒上”更能体现动作力度，同时在现代中文中自然可懂。
- source_word: הַמִּזְבֵּחָה
  choice: 在祭坛上
  rationale: 带方向词尾的形式表示血朝祭坛施用并落在其表面；“在祭坛上”是自然中文，不排除洒向祭坛侧面的礼仪动作。
- source_word: הָאֵלִים
  choice: 公绵羊
  rationale: אילים明确指成年公羊；“公绵羊”准确而通俗。
- source_word: הַכְּבָשִׂים
  choice: 羊羔
  rationale: כבשים在献祭清单中通常指幼羊；“羊羔”符合此处语境，同时避免笼统译作“羊”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语体。保留原文三次宰杀和三次将血施于祭坛的重复结构；后两句加入“又”“随后”“也”，使中文衔接自然，但不增添新的礼仪步骤。
