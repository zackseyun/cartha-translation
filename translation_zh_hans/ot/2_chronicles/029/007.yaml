reference: 2 Chronicles 29:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: zh_hans
  text: 他们还关上了殿廊[a]的门，熄灭了灯，也不烧香，不在圣所[b]向以色列的上帝献燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“前廊”；希伯来语指圣殿入口处的门廊。
    reason: lexical_alternative
  - marker: b
    text: 或译“神圣之处”；原文可指圣殿中分别为圣的区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: 还
  rationale: 承接上文并增列罪状；“还”自然保留了累加语气。
- source_word: סָגְרוּ דַּלְתוֹת הָאוּלָם
  choice: 关上了殿廊的门
  rationale: אוּלָם指圣殿主体建筑入口处的门廊；“殿廊”简洁明确，也避免把它误解为普通住宅的门厅。
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: 熄灭了灯
  rationale: 准确表达使礼仪用灯停止燃烧，保留具体的圣殿陈设意象。
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: 也不烧香
  rationale: קטר的使役式与“香”连用，指礼仪性的焚香；“烧香”是现代汉语中自然、具体的表达。
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: 不……献燔祭
  rationale: עֹלָה是全牲焚烧的专门祭祀术语；“献燔祭”保留了历史与礼仪上的特指。
- source_word: בַקֹּדֶשׁ
  choice: 在圣所
  rationale: 该词指分别为圣的圣殿区域；“圣所”忠实而不把具体范围限定得超过原文。
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: 向以色列的上帝
  rationale: 介词ל在此表示祭献所指向的对象；“向”清楚呈现敬拜和奉献的方向。
theological_decisions:
- issue: 圣殿礼仪术语
  choice: 保留“烧香”“圣所”“燔祭”等具体礼仪用语
  alternative: 概括译为“敬拜”或“献祭”
  rationale: 本节逐项列举圣殿事奉遭废弃的具体表现，并非泛指宗教冷淡；保留专门术语可呈现其历史与神学分量。
- issue: בַקֹּדֶשׁ所指范围
  choice: 译作“圣所”，不进一步限定为圣殿内某一特定房间
  alternative: 译作“至圣所”或笼统译作“圣殿”
  rationale: 原词表示神圣区域，但本句没有足够信息要求把它限定为“至圣所”；译作“圣所”保留原文可能具有的范围弹性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句子依照原文的累加结构排列各项失职，同时用“也”与重复的否定使中文流畅。脚注[b]置于其实际说明的“圣所”之后，而非置于“烧香”之后。
