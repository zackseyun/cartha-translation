  edition: WLC
  text: וַ/תִּכֹּן֙ כָּל מְלֶ֣אכֶת שְׁלֹמֹ֔ה עַד הַ/יּ֛וֹם מוּסַ֥ד בֵּית יְהוָ֖ה וְ/עַד כְּלֹת֑/וֹ שָׁלֵ֖ם בֵּ֥ית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: zh_hans
  text: 这样，所罗门的一切工程，从耶和华的殿奠基之日直到竣工[b]，都安排妥当了[a]。耶和华的殿就全部建成了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所罗门的一切工程都确立了（或预备齐全了）。”希伯来语动词可表示确立、预备妥当或安排就绪。
    reason: lexical_alternative
  - marker: b
    text: 直译：“直到耶和华的殿奠基之日，又直到它完工。”这里概括的是从奠基到竣工的时段。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: 都安排妥当了
  rationale: כון的尼法勒式在这里表达工程已预备妥当、安排就绪或稳妥确立的结果状态。“安排妥当”既保留被动、结果性的含义，也符合现代汉语对整体工程进展的概括。
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: 所罗门的一切工程
  rationale: מְלָאכָה可指工作、劳作或工程；本节语境是圣殿建造项目，译作“一切工程”自然且范围恰当。
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: 从耶和华的殿奠基之日直到竣工
  rationale: 该短语概括从奠基到完工的整个时段。中文以“从……直到……”清楚表达起讫关系；脚注同时给出较贴近希伯来语字面的名词化表达。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בַּיִת字面是“房屋、殿”，在这里明确指圣殿；译作“殿”比“房屋”自然，同时保留原文而不扩写为其他专门术语。神名יְהוָה采用现代汉语中通行的音译“耶和华”。
- source_word: שָׁלֵם בֵּית יְהוָה
  choice: 耶和华的殿就全部建成了
  rationale: שָׁלֵם在这里作表语，表示完整、完毕的状态。“全部建成了”自然表达圣殿已经完工，并保留总结性的语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代简体中文圣经语境中“耶和华”辨识度高，并作为专名保留；“雅威”则是另一种较接近学术重建发音的音译。
- issue: וַתִּכֹּן所表达的工程状态
  choice: 安排妥当
  alternative: 确立／预备齐全
  rationale: 原词可涵盖确立、预备和安排就绪等意义。正文不把它收窄为单纯的开工或完工，以免与本节末尾明确的“全部建成”混同。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“工程”“奠基”“竣工”“建成”形成清楚的建筑语义链；保留原文先概括所罗门全部工程、再总结圣殿完工的重复与强调。
