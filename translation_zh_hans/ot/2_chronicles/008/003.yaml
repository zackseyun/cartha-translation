  text: 所罗门前往哈马琐巴，制伏了那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胜过它”或“控制了它”。希伯来语习语直译为“在它之上强盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 往……去
  rationale: הלך在连续叙事形式中基本义为“去”。上下文虽涉及军事行动，但该动词本身并未明说“攻打”，因此不在此处额外加入敌对含义。
- source_word: חֲמָת צוֹבָה
  choice: 哈马琐巴
  rationale: 两词在本节合用为地名。采用传统且易辨认的复合音译，不强行解释为“琐巴的哈马”，因为希伯来文的所属关系并不明确。
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: 制伏了那里
  rationale: חזק על字面涉及“在……之上强盛/占优势”，在君王征战的语境中表示胜过并控制该地。“制伏”自然表达军事政治结果；以“那里”回指该地，比把城市或地区称作“它”更符合现代汉语。
