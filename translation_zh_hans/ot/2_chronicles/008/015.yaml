  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: zh_hans
  text: 他们没有偏离王关于祭司和利未人的命令；无论在什么事上，或在库房[a]的事上，都是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “库房”或译“宝库”或“财库”。原文所用的词可指储存物资或贵重物品的地方；此处语境也可指圣殿的财宝库。
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: 偏离
  rationale: 该动词可表示“转离、离开、偏离”。这里用于遵守命令的语境，“偏离”既保留原文意象，也符合现代汉语表达。
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: 王……的命令
  rationale: מִצְוָה在此指王所发布的命令；译为“命令”准确、自然，也符合行政语境。
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 有关祭司和利未人
  rationale: עַל在此较自然地引出命令所涉及的对象或事项，而非表示王在祭司和利未人“之上”；同时分别保留“祭司”和“利未人”两个群体。
- source_word: לְכָל דָּבָר
  choice: 在任何事上
  rationale: 在否定句中，这一短语表示无论什么事项都不例外；“在任何事上”准确而自然。
- source_word: וְלָאֹצָרוֹת
  choice: 以及在库房的事务上
  rationale: אֹצָרוֹת可指存放物资或贵重物品的库房、宝库。圣殿行政语境中，“库房”涵盖面较广；补出“事务上”使其与前面的范围短语衔接清楚，同时保留连接词“以及”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“没有偏离……命令”保留希伯来文的具体表达；通过“在任何事上，以及在库房的事务上”呈现原文并列结构，不把连接词解释为选择关系。
