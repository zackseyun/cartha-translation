  text: מִן בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נוֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֥ר לֹֽא כִלּ֖וּ/ם בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַ֔ס עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: zh_hans
  text: 所罗门把他们的后代中那些在他们之后仍留在这地、没有被以色列人[a]灭尽的人征调来服劳役[b]，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，是对以色列民族的惯常称呼。
    reason: lexical_alternative
  - marker: b
    text: 或译“征作劳役”或“征发劳役”。原文所用的词指国家强制征派的劳役。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: 从他们的后代中
  rationale: בְּנֵיהֶם 字面为“他们的儿子”，但在族群和世代延续的语境中指后代；“后代”准确涵盖其范围，也符合现代汉语表达。介词 מִן 译作“从……中”，保留原文的部分关系。
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם בָּאָרֶץ
  choice: 那些在他们之后仍留在这地
  rationale: נוֹתְרוּ 表示“剩下、留下”，אַחֲרֵיהֶם 表示“在他们之后”；“仍留在这地”保留其存留下来的结果意味，又不擅自解释他们如何留下。
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: 以色列人没有灭尽的
  rationale: כִּלּוּם 在此征服语境中表示彻底消灭；“没有灭尽”既表达动作，也保留“未彻底完成”的词义色彩。בְּנֵי יִשְׂרָאֵל 是以色列民族的惯常称谓，正文自然译为“以色列人”。
- source_word: וַיַּעֲלֵם שְׁלֹמֹה לְמַס
  choice: 所罗门征调他们服劳役
  rationale: וַיַּעֲלֵם 与 לְמַס 连用，指统治者将人征用于国家强制劳役；“征调……服劳役”体现行政强制性，同时避免使用生僻术语。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是希伯来文惯用语，表示该状况延续至叙述者所处的时代；“直到今日”庄重、自然，并保留其叙事视角。
theological_decisions: []
