  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: zh_hans
  text: 这些是所罗门王属下官员[a]的首领，共二百五十人；他们管理百姓[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官员”或译“监督官”；希伯来语指王权之下受任命、履行职务的人。
    reason: lexical_alternative
  - marker: b
    text: “管理百姓”也可译作“辖管百姓”或“监督百姓”；原文动词指行使权柄，在这里可能侧重行政管理。按上下文，“百姓”也可能特指服役的人，但本节没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 这些是
  rationale: 承接历史叙事并引出统计内容；现代汉语无需直译句首连接词“和”。
- source_word: שָׂרֵי הַנְּצִיבִים
  choice: 官员的首领
  rationale: שָׂרֵי 表示居领导地位者，הַנְּצִיבִים 指王权之下受任命的官员；此译保留两者之间的层级关系，又不把职务过度限定为军事或劳役监督。
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王属下
  rationale: 该短语表示这些人归属于所罗门王或为王任职；“属下”符合行政语境，也比生硬的所有格更自然。
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: 二百五十人
  rationale: 准确表达希伯来文数目，并补出汉语计数官员所需的量词。
- source_word: הָרֹדִים בָּעָם
  choice: 他们管理百姓
  rationale: רדה 表示对某对象行使权柄、治理或辖管；在本节行政语境中，“管理”自然传达职权关系，同时避免无根据地暗示苛刻统治。בָּעָם 最直接指“百姓”，上下文虽可能涉及劳动力，但本节没有明说。
theological_decisions: []
