  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: zh_hans
  text: 所罗门把法老的女儿从大卫城接上来，安置在他为她建造的宫中，因为他说：“我的妻子不可住在以色列王大卫的宫里，因为耶和华的约柜到过的那些地方[a]都是圣的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“因为它们是圣的，耶和华的约柜曾到它们那里。”原文没有明说“地方”，但相关代词都是复数。
    reason: 说明译文为使隐含的复数所指清楚而补出“那些地方”，并保留原文表达上的省略。
lexical_decisions:
- source_word: הֶעֱלָה
  choice: 接上来
  rationale: 使役形表达“使上去、带上来”。“接上来”既保留由较低处迁往较高处的方向意味，也符合现代汉语叙述人物迁居的习惯。
- source_word: מֵעִיר דָּוִיד
  choice: 从大卫城
  rationale: 采用这一地名在现代中文圣经语境中的通行、清楚表达。
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: 安置在他为她建造的宫中
  rationale: בַּיִת 可指房屋或宫室；此处是为法老女儿修建的王室住所，译作“宫”符合语境。“安置在”自然表达迁入目的地，但不增添永久性等含义。
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: 我的妻子不可住
  rationale: אִשָּׁה 在此因所指为法老女儿而取“妻子”义；ישׁב 在语境中指居住。“我的妻子”保留单数形式，不扩大为对所有妇女或所有妻子的普遍禁令。
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: 在以色列王大卫的宫里
  rationale: 此处 בַּיִת 指与大卫王室住所有关的建筑空间；“宫”比字面的“家”或“房屋”更准确自然，同时保留“大卫”为所有者。
- source_word: קֹדֶשׁ הֵמָּה
  choice: 那些地方都是圣的
  rationale: 保留复数谓语所表达的多个所指，并采用圣经语体中清楚而庄重的“圣的”。
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: 耶和华的约柜到过的那些地方
  rationale: 原文复数代词需要一个省略的复数先行词；补出“那些地方”使中文语法清楚，同时将补足处用脚注说明。完成体 בָּאָה 在叙事背景中自然译为“到过”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中对神名的通行音译，明确这是专名而非一般称号。
theological_decisions:
- issue: 圣洁理由中复数代词的隐含所指
  choice: 补出“那些地方”，理解为约柜曾到过的大卫宫室范围内的地方
  alternative: 按字面译为“因为它们是圣的，耶和华的约柜曾到它们那里”，或笼统说整个“大卫家”是圣的
  rationale: הֵמָּה 与 אֲלֵיהֶם 都是复数，而明说的“宫”是单数。补出“那些地方”最能反映原文语法和上下文，又不把圣洁抽象化为大卫王朝的属性。脚注保留原文省略造成的张力。
- issue: אִשָּׁה לִי 的范围
  choice: “我的妻子”，特指法老的女儿
  alternative: “女人”或“我的任何妻子”
  rationale: 上下文直接谈论法老的女儿，单数 אִשָּׁה 最自然指她作为所罗门的妻子；不宜据此扩展成关于所有妇女或所罗门全部妻子的陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“接上来”保留地势方向；王室住所按语境译作“宫”。神名译为“耶和华”。脚注标记置于整节末尾，对应主文中补出的“那些地方”。
