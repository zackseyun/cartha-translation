  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: zh_hans
  text: 他照着他父亲大卫[a]的规例，安排祭司的班次，各司其职；又安排利未人各尽其职，赞美并在祭司面前供职，按每日所当尽的职分[b]；又安排守门人按班次看守各门；因为这是上帝之人大卫的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父亲”也可指“祖先”；这里是希伯来文王室和族谱用语。
    reason: 说明希伯来文亲属称谓的语义范围，同时保留正文的原文形式。
  - marker: b
    text: 原文直译为“按一日之事，在其日办理”，意即每天照当天所规定的事项履行职分。
    reason: 保留希伯来文惯用语的字面结构，并解释正文的自然译法。
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: 设立
  rationale: 此处是 עמד 的使役形式，表示把圣殿人员安置在规定的岗位和制度中；“设立”兼顾任命与组织安排的含义。
- source_word: כְּמִשְׁפַּט
  choice: 照着……所定的规例
  rationale: מִשְׁפָּט 在此指既定的规范或制度，不是司法判决；“规例”符合圣殿行政礼仪语境。
- source_word: דָּוִיד אָבִיו
  choice: 他父亲大卫
  rationale: 保留希伯来文“父亲”的王室及族谱用语，不在正文中直接解释为“祖先”，并以脚注说明。
- source_word: מַחְלְקוֹת
  choice: 班次
  rationale: 该词指祭司和守门人按编组轮班服役的组织单位；现代中文圣经语境中“班次”清楚而贴切。
- source_word: עַל עֲבֹדָתָם
  choice: 让他们各尽职分
  rationale: 介词结构表示祭司被安排负责其服役工作；此译法自然表达岗位职责，同时保留圣殿职事的语境。
- source_word: מִשְׁמְרוֹתָם
  choice: 值班安排
  rationale: מִשְׁמֶרֶת 可指值守、职守或所承担的任务；在人员轮值的上下文中，“值班安排”比单纯“职责”更具体。
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: 赞美，并……供职
  rationale: הלל 是赞美；שרת 在礼仪语境中指执行圣所职事，“供职”既保留专门服役的意味，也适合现代中文。
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: 在祭司面前
  rationale: נֶגֶד 通常表示在……面前或对面。译文保留空间及职务关系上的开放性，不改释为“协助祭司”。
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: 每日照当天所规定的办理
  rationale: 直译近于“按一日之事，在其日办理”，意指每天按当天规定的事项执行；正文自然传意，脚注保留字面结构。
- source_word: הַשֹּׁעֲרִים
  choice: 守门人
  rationale: 指负责圣殿各门值守的人；“守门人”是清楚、通行的现代中文。
- source_word: לְשַׁעַר וָשָׁעַר
  choice: 看守各门
  rationale: 这是分配式表达，意为逐门、每一门；结合守门人的任务译作“看守各门”自然明确。
- source_word: מִצְוַת
  choice: 所吩咐的
  rationale: 该词表示具有权威性的命令；“所吩咐的”在句末比名词式“命令”更自然，同时保留权威性。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 上帝之人
  rationale: 保留这一特定称号的形式及尊严，不将其泛化为“属上帝的人”或解释为某种职衔。
theological_decisions:
- issue: “他父亲大卫”的王室族谱称谓
  choice: 正文保留“父亲”
  alternative: 译作“祖先”或“先祖”
  rationale: 希伯来文可用“父亲”指祖先或王室前任。保留原文形式，并以脚注提示其宽泛用法，可避免在正文中替原文消除这种语义张力。
- issue: 利未人与祭司的职务关系
  choice: 译作“在祭司面前供职”
  alternative: 译作“协助祭司供职”或“与祭司一同供职”
  rationale: נֶגֶד 本身主要表示“在……面前”，并未明确规定是协助还是并列关系；采用较形式对应的译法，避免加入经文未明说的圣职关系。
- issue: “上帝之人”作为大卫的称号
  choice: 保留“上帝之人”
  alternative: 译作“属上帝的人”
  rationale: 该表达在希伯来圣经中是具有特定分量的称号。直译能保留其经文互文和神学开放性，不把它弱化为一般敬虔描述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“班次”“值班安排”“供职”等词体现圣殿礼仪与行政组织，但避免艰涩古语。通过分号呈现祭司、利未人和守门人三组安排，使长句结构清晰。所有脚注标记均已置于正文相应位置。
