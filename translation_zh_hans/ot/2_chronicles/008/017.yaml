base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: zh_hans
  text: 那时，所罗门前往以东地沿海的以旬迦别和以禄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以禄”也译作“以拉他”或“以拉特”。
    reason: 保留该希伯来地名在中文音译中的常见异体，便于读者与其他译本或现代地名对照。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作叙事中的时间标记，承接前文并引出下一件事；“那时”自然、庄重，也不比原文更具体地限定先后间隔。
- source_word: הָלַךְ
  choice: 前往
  rationale: 此处表示去往某地，并非强调步行；“前往”准确而符合现代书面叙事语体。
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: 前往以旬迦别
  rationale: 介词 לְ 表示方向；地名采用中文圣经传统中易辨识的音译“以旬迦别”。
- source_word: וְאֶל אֵילוֹת
  choice: 和以禄
  rationale: וְאֶל 引入第二个目的地；中文由前面的“前往”同时支配两个并列地名，避免生硬重复。אֵילוֹת 音译为中文较通行的“以禄”。
- source_word: עַל שְׂפַת הַיָּם
  choice: 在……海岸上
  rationale: שְׂפַת הַיָּם 字面是“海的边缘”，在地理语境中指海岸；此译保留明确的空间位置。
- source_word: בְּאֶרֶץ אֱדֹם
  choice: 在以东地
  rationale: 原文明确含 אֶרֶץ“地、国土”，故保留为“以东地”，而不简化为“以东”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。为避免中文误把“在海岸上”只理解为修饰第二个地名，译作“这两地”，明确该地点说明涵盖前述两个并列地点；这一指代是句法澄清，并未增添新的事件信息。
