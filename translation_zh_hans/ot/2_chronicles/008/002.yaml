base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: zh_hans
  text: 至于户兰[a]赐给所罗门的那些城，所罗门重建了它们[b]，并安置以色列人[c]住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“户兰”；传统译作“希兰”。
    reason: alternative_reading
  - marker: b
    text: 或译“建造了它们”。希伯来文动词既可指“建造”，在本语境中也可指“重建”或“修复”。
    reason: lexical_alternative
  - marker: c
    text: 字面为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: 至于……那些城
  rationale: 前缀连词与定冠词名词在此承接上文，并引出叙事总结中的新事项；用“至于”符合现代汉语篇章衔接，也保留所指明确的复数“城”。
- source_word: אֲשֶׁר נָתַן חוּרָם לִשְׁלֹמֹה
  choice: 户兰赐给所罗门的
  rationale: 按希伯来文关系从句表达；完成式在此指先于所罗门修建诸城的赠予，汉语语序已自然呈现这一先后关系，无须另加时态词。
- source_word: חוּרָם
  choice: 户兰
  rationale: 依本文希伯来文 חוּרָם 音译，并以脚注说明传统译名“希兰”。
- source_word: בָּנָה
  choice: 重建
  rationale: 该动词基本义为“建造”，但这些城已经存在且已被赠给所罗门，语境较支持修复或重新建设之意；脚注保留“建造”的词义可能。
- source_word: וַיּוֹשֶׁב
  choice: 并安置……住
  rationale: 这是 ישׁב 的使役式，表示所罗门使人居住在那里；“安置……住”在现代汉语中自然，并保留使役含义。
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此泛指以色列民众；译作“以色列人”准确、自然，且不误限于男性。
