base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: zh_hans
  text: 至于赫人、亚摩利人、比利洗人、希未人和耶布斯人中所有剩下的人，他们并非出自以色列[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不是以色列人。”希伯来文直译为“他们并非出自以色列”。
    reason: 说明身份性意译，并保留原文介词结构的较直译表达。
lexical_decisions:
- source_word: כָּל הָעָם הַנּוֹתָר
  choice: 所有剩下的人
  rationale: כָּל涵盖全部，הָעָם是集合意义的“人”，הַנּוֹתָר为尼法勒分词，指被留下或仍存留的人；译文自然保留这一集合和存留之意。
- source_word: מִן הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: 赫人、亚摩利人、比利洗人、希未人和耶布斯人中
  rationale: מִן在此表示这些剩余人口所属或来自所列族群；汉语用“……人中”最自然。各族名采用现代中文圣经传统中通行且易辨识的译名。
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: 他们并非出自以色列
  rationale: 直译保留מִן所表达的来源或归属关系，不把原文进一步限定为现代意义上的族裔身份；“并非出自以色列”在庄重现代汉语中清楚自然。
theological_decisions:
- issue: “不出自以色列”所指的是来源、归属还是身份
  choice: 他们并非出自以色列
  alternative: 他们不是以色列人
  rationale: 原文含介词מִן，较直译为“不是出自以色列”。正文保留其措辞和可能的来源/归属张力，脚注提供自然的身份性译法，而不在正文中替原文消除这一细微差异。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句首“至于”承接本节作为后续句子的主题结构，句末破折号保留希伯来语句法在下一节继续展开的未完感。
