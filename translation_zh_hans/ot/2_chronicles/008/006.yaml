base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: zh_hans
  text: 又建造了巴拉，以及所罗门所有的仓储城[a]、战车城和骑兵城[b]；凡所罗门想要建造[c]的，无论在耶路撒冷、黎巴嫩，还是在他统治的全境，他都建造了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仓储城”或译“供应城”，也可能指“宝库城”。
    reason: lexical_alternative
  - marker: b
    text: 或译“骑马者的城”；这里的希伯来词通常指骑马者或骑兵，也有人理解为“养马的城”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译近于“所罗门一切所愿、他所愿建造的”，以同根词的重复强调他的意愿或喜好。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: 巴拉
  rationale: 这是地名，采用现代中文圣经中自然、简明的音译。
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: 储备城
  rationale: 指用于储存物资或供应品的城；“储备城”比“积货城”更符合现代汉语，也不把含义限定为财宝。
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: 所罗门所有的
  rationale: 自然表达希伯来文的所属关系，同时适合行政设施的语境。
- source_word: עָרֵי הָרֶכֶב
  choice: 战车城
  rationale: 保留这些城与战车及其配套设施的关联，不额外具体化其功能。
- source_word: עָרֵי הַפָּרָשִׁים
  choice: 骑兵城
  rationale: פָּרָשִׁים通常指骑马者或骑兵；“骑兵城”简洁地保留其与前面“战车城”的区别。
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: 凡所罗门想要建造的
  rationale: 以自然现代汉语传达同根名词与动词所强调的愿望，不生硬复制重复形式。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: 原词意为“建造”，本节措辞本身不要求译成“重建”。
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: 在他统治的全境
  rationale: 兼顾מֶמְשָׁלָה的统治含义与אֶרֶץ所表达的地域范围，中文自然清楚。
