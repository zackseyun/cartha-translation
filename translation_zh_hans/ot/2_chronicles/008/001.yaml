  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: zh_hans
  text: 二十年期满时，所罗门建成了耶和华的殿和自己的房屋[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的王宫”。希伯来文直译为“自己的房屋”。
    reason: 保留 בֵּיתוֹ 的字面意义，同时说明其在语境中可能特指所罗门的王宫。
lexical_decisions:
- source_word: וַיְהִי
  choice: ……时
  rationale: 该叙事推进公式与后面的时间短语合译为自然的现代汉语时间结构；本节句意延续至下一节，无须机械译出“事情发生了”。
- source_word: מִקֵּץ עֶשְׂרִים שָׁנָה
  choice: 二十年期满时
  rationale: 准确表达经过二十年而到达期限终点，语气简洁庄重。
- source_word: אֲשֶׁר בָּנָה
  choice: 所罗门建成了
  rationale: 上下文表示所述工程在二十年结束时已经完成；“建成”比单纯“建造”更清楚地传达完成性。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בַּיִת 字面为“房屋”，但用于耶和华时在此明确指圣殿；“殿”是自然、庄重且不带额外宗派色彩的汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，保留其作为专名的性质。
- source_word: בֵּיתוֹ
  choice: 自己的房屋
  rationale: 保留希伯来文“他的房屋”的词义，并用“自己的”清楚呈现它与耶和华之殿的对照；上下文可能特指王宫，列入脚注。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名；正文采用现代简体中文圣经传统中最通行、普通读者最易识别的“耶和华”，同时不把它改写成称号“主”。
- issue: בֵּית יְהוָה 的具体所指
  choice: 耶和华的殿
  alternative: 耶和华的房屋
  rationale: 这里所指是圣殿；译作“殿”使现代汉语读者准确理解所指，而没有改变原文的神学关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。本节原句延续到下一节，因此以逗号收束。脚注标记置于真正存在词义选择的“自己的房屋”之后，而非时间短语之后。
