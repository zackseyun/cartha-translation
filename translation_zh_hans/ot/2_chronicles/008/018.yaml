base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: zh_hans
  text: 户兰借着他的臣仆，给所罗门送去船只和熟悉航海的臣仆[a]。这些臣仆同所罗门的臣仆前往俄斐，从那里取得四百五十他连得金子[b]，带到所罗门王那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“熟悉海的臣仆”，也可译作“有航海经验的臣仆”或“水手”。
    reason: lexical_alternative
  - marker: b
    text: “他连得”是古代重量单位；各时期和地区的实际重量可能不同，因此这里不换算成现代单位。
    reason: cultural_note
lexical_decisions:
- source_word: חוּרָם
  choice: 户兰
  rationale: 按本节希伯来文形式音译，并采用中文圣经人名的通行译法。
- source_word: בְּיַד עֲבָדָיו
  choice: 借着他的臣仆
  rationale: 这是表示中介或代理的希伯来语习语；译出实际意义，比直译“借他臣仆的手”更符合现代汉语。
- source_word: אוניות
  choice: 船只
  rationale: 上下文是前往俄斐的海上航行；“船只”自然且不额外限定具体船型。
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: 熟悉航海的臣仆
  rationale: 既保留עֲבָדִים的身份含义，也传达字面“熟悉海”的航海经验；避免只译作“水手”而遗漏其臣仆身份。
- source_word: אוֹפִירָה
  choice: 前往俄斐
  rationale: 词尾方向式ה表示朝向俄斐；现代汉语以“前往”自然表达。
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: 从那里取得
  rationale: לקח基本义为拿取；“取得”在金子来源的语境中自然，同时不武断说明获取方式。
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: 四百五十他连得金子
  rationale: 保留古代重量单位כִּכָּר，不换算为有争议的现代重量。
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: 带到所罗门王那里
  rationale: 自然表达复数主语所执行的运送动作；汉语无需为金子强加单复数代词。
theological_decisions: []
