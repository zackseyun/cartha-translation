  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: zh_hans
  text: 又按每日当尽的本分献上祭物，照摩西所吩咐的，在安息日、月朔和一年三次的指定节期，就是无酵节、七七节[b]和住棚节[c]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按每日的定例”；直译近似“按一日当日的事”。
    reason: lexical_alternative
  - marker: b
    text: “七七节”在后来的希腊语用法中称为“五旬节”。
    reason: cross_reference
  - marker: c
    text: 希伯来语直译为“棚子节”；传统亦译“帐幕节”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: 又按每日所定的献祭
  rationale: 这个短语直译近似“按一日当日的事”，在本段献祭语境中指每日规定的献祭安排；译文保留“每日所定”的制度性含义，同时使现代汉语自然明白。
- source_word: לְהַעֲלוֹת
  choice: 献上祭物
  rationale: עלה的使役式在祭祀语境中表示把祭物献上。上文已提到燔祭，本节则着重献祭安排，因此采用较自然且不把范围限定得过窄的表达。
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: 照摩西的吩咐
  rationale: 准确表达这些礼仪是依照摩西所颁布的命令，同时符合现代汉语表达习惯。
- source_word: לַשַּׁבָּתוֹת
  choice: 在安息日
  rationale: 介词在这里标明献祭的日期或场合；“在安息日”比“为安息日”更符合汉语。
- source_word: וְלֶחֳדָשִׁים
  choice: 月朔
  rationale: 在以色列礼仪历法中，该词指每月新月开始时的宗教礼仪。“月朔”是简洁、准确且通行的汉语表达。
- source_word: וְלַמּוֹעֲדוֹת
  choice: 定期节日
  rationale: מוֹעֵד兼有“指定的时间”和“节期”之意；“定期节日”保留由上帝指定日期的含义，也与随后列出的三个节日衔接。
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: 一年三次
  rationale: 直接、自然地传达每年三次的时间频率。
- source_word: בְּחַג הַמַּצּוֹת
  choice: 无酵节
  rationale: 按希伯来名称直译其核心意象，即吃无酵食物的节期；这是现代中文圣经语境中清楚而常见的名称。
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: 七七节
  rationale: 希伯来名称直指按“七个七”计算的节期。“七七节”保留原文命名方式，不以较晚的希腊名称“五旬节”取代。
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: 住棚节
  rationale: סֻכּוֹת意为棚子或临时居所。“住棚节”既保留具体意象，也是现代中文中易懂的通行名称。
theological_decisions:
- issue: 三个以色列节期应采用希伯来名称的直译，还是采用后来的教会传统名称
  choice: 无酵节、七七节、住棚节
  alternative: 逾越节期、五旬节、帐幕节
  rationale: 原文直接列出三个节期的希伯来名称。主文采用贴近这些名称且现代读者可懂的译法，避免把较晚的希腊名称“五旬节”倒置进旧约文本；传统名称仅在注释中说明。
- issue: לְהַעֲלוֹת在本节是否专指燔祭
  choice: 献上祭物
  alternative: 献上燔祭
  rationale: 该动词在祭祀语境中可指献祭，上文虽明确提及燔祭，但本节本身没有重复祭物名称。采用较宽的表达，既依赖语境，又避免在本节中加入过度限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“月朔”“七七节”“住棚节”属于圣经礼仪语境中的常用词，但句法保持清楚易读。三个脚注标记均紧接相关词语，且脚注顺序与正文一致。
