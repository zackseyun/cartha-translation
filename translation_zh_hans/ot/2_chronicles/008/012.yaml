  text: אָ֣ז הֶעֱלָ֧ה שְׁלֹמֹ֛ה עֹל֖וֹת לַ/יהוָ֑ה עַ֚ל מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֥ר בָּנָ֖ה לִ/פְנֵ֥י הָ/אוּלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: zh_hans
  text: 那时，所罗门在耶和华的祭坛上，向耶和华献上燔祭；这祭坛是他在圣殿门廊[a]前建造的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“前厅”或“廊子”。希伯来语指圣殿入口处的厅廊。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为时间与叙事推进标记，承接前文并引出所罗门接下来的行动；现代汉语中自然庄重。
- source_word: הֶעֱלָה
  choice: 献上
  rationale: עלה 的使役式与祭物连用时表示把祭物献在坛上；“献上”既体现祭祀动作，也符合现代汉语表达。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: עֹלָה 指在坛上焚烧献上的祭物；“燔祭”是准确且通行的中文祭祀术语。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 介词 ל 表示祭物所献的对象或归属；“向耶和华”清楚传达献祭对象。
- source_word: עַל מִזְבַּח יְהוָה
  choice: 在耶和华的祭坛上
  rationale: 保留 עַל 的空间关系及名词构造关系，明确燔祭是在属于耶和华的祭坛上献的。
- source_word: אֲשֶׁר בָּנָה
  choice: 这祭坛是他……建造的
  rationale: 将希伯来语关系从句自然转换为汉语分句；“他”按语境指所罗门，不额外补入原文没有的身份说明。
- source_word: לִפְנֵי הָאוּלָם
  choice: 在圣殿门廊前
  rationale: לִפְנֵי 表示空间上的“在……前”；אוּלָם 是圣殿入口处的厅廊。“圣殿”作为必要的语境性限定，使现代读者清楚所指，并由脚注保留可行译法。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次直接使用四字神名。中文正文采用读者最熟悉且明确作为专名的“耶和华”，不以“主”取代神名；“雅威”是较接近学术拟音的可行替代。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“燔祭”“祭坛”等必要的圣经祭祀术语；将较生硬的关系从句拆分，以清楚呈现祭坛的位置与建造者。
