revisions:
- from: 他在旷野建造了达莫尔[a]，又建造了哈马境内所有的储货城。
  to: 他在旷野建造了达莫尔[a]，又在哈马建造了所有储存物资的城邑。
  rationale: 修订仅澄清“储藏城”的功能性含义，并以更清楚的汉语句法反映原文“在哈马建造”的关系从句；地名音译、旷野的地貌开放性及注释信息均予保留。
