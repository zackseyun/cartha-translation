  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
translation:
  language: zh_hans
  text: 他在旷野建造了达莫尔[a]，又在哈马建造了所有储存物资的城邑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上认为达莫尔就是巴尔米拉。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 建造了
  rationale: 该词是בנה的叙事性过去时形式，表示顺序发生的建造行动；现代汉语用“建造了”自然表达，不必机械译出句首连接词。
- source_word: תַּדְמֹר
  choice: 达莫尔
  rationale: 按希伯来语地名音译，保留原文名称；后来的名称“巴尔米拉”放在注释中说明，不替换正文地名。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר可指荒野或沙漠地带；“旷野”是自然且范围较宽的圣经汉语表达，不把地貌限定为沙质沙漠。
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: 所有的储货城
  rationale: 该结构指用于储存物资的城邑；“储货城”简明表达其储藏和供应功能。
- source_word: אֲשֶׁר בָּנָה
  choice: 又建造了
  rationale: 原文是修饰“储货城”的关系从句。汉语若直译为“所有他建造的储货城”略显生硬，改用并列谓语，仍保留这些城由他建造的含义。
- source_word: בַּחֲמָת
  choice: 哈马境内
  rationale: 介词ב表示位于哈马之中；“境内”符合上下文，也保留哈马可指城市辖区或地域的开放性。
