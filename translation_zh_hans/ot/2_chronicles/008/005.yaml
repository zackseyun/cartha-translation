  text: וַ/יִּ֜בֶן אֶת בֵּ֤ית חוֹרוֹן֙ הָֽ/עֶלְי֔וֹן וְ/אֶת בֵּ֥ית חוֹר֖וֹן הַ/תַּחְתּ֑וֹן עָרֵ֣י מָצ֔וֹר חוֹמ֖וֹת דְּלָתַ֥יִם וּ/בְרִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/005.yaml
  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: zh_hans
  text: 他又建造了上伯和仑和下伯和仑，使它们成为坚城，有城墙、门扇[a]和门闩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门扇”指坚城入口处用来关闭城门的门板；原文并非通常译作“城门”的那个词。
    reason: lexical_alternative
  - marker: b
    text: “门闩”也可译作“门栓”或“横闩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 又建造了
  rationale: בנה在这里直接表示建造；上下文虽涉及设防，但该动词本身不必译为“重建”。“又”承接连续叙事中的וַ。
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: 上伯和仑
  rationale: 这是地名，采用现代中文圣经读者较熟悉的音译“伯和仑”，并用“上”表达其地势较高。
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: 下伯和仑
  rationale: 与“上伯和仑”平行，以“下”表达其地势较低。
- source_word: עָרֵי מָצוֹר
  choice: 坚城
  rationale: 该组合词指具有防御设施的城邑；“坚城”简洁自然，也保留军事防御含义。
- source_word: חוֹמוֹת
  choice: 城墙
  rationale: 上下文明确是城防设施，译作“城墙”比泛称“墙”准确自然。
- source_word: דְּלָתַיִם
  choice: 门扇
  rationale: 原词通常指门或双扇门，并非通常表示城门整体的שׁער；“门扇”既贴近词义，也适合坚城入口的语境。
- source_word: וּבְרִיחַ
  choice: 和门闩
  rationale: בְּרִיחַ指横闩或闩门的栓；“门闩”在现代中文中清楚表达其防御和闭锁作用。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“使它们成为”明示希伯来文同位描述“坚城”与前述两城的关系；城防设施依原文次序列出。
