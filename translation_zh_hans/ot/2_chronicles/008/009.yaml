  rationale: 仅作措辞和句法润饰：“使……为奴”比“立为奴隶”更自然且更直接对应原文的使役意义；后半句改为并列列举，以更紧凑地反映希伯来文连续的军事职分。脚注a、c内容准确保留；脚注b微调搭配，不改变其释义。
