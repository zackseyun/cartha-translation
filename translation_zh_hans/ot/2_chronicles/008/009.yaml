base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make slaves for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: zh_hans
  text: 但所罗门没有使以色列人[a]为奴，替他做工[b]，因为他们是战士、他的军官[c]、战车部队的统领和骑兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的子孙”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“没有把他们派去服奴役性劳役。”原文所说的是使他们从事奴隶劳役。
    reason: lexical_alternative
  - marker: c
    text: 译作“军官”的希伯来词可能指精锐军官或侍从官，确切职衔不能确定；也可译作“将领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי יִשְׂרָאֵל
  choice: 但……以色列人
  rationale: וּ在上下文中带有转折作用，与上一节把外族人征作劳役形成对照；בְּנֵי יִשְׂרָאֵל按现代汉语自然译为“以色列人”，脚注保留其字面形式。
- source_word: לֹא נָתַן ... לַעֲבָדִים
  choice: 没有把……立为奴隶
  rationale: 这一结构表示使人处于奴隶身份或奴役性劳作之中；“立为奴隶”保留其力度，不弱化为一般的“仆人”。
- source_word: לִמְלַאכְתּוֹ
  choice: 替他做工
  rationale: מְלָאכָה在此指所罗门所用的劳作；译法自然，并保持其宽泛含义。
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: 战士
  rationale: 准确表达军事人员身份，比直译“战争之人”更符合现代汉语。
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: 他的军官
  rationale: שָׁלִישׁ是含义不完全确定的军事职衔，可能指精锐军官、侍从官或高级武官；“军官”避免虚假的精确性。
- source_word: שָׂרֵי רִכְבּוֹ
  choice: 他战车部队的统领
  rationale: 该短语指负责战车或战车军团的长官；补出“部队”使现代读者不致误解为只管理车辆。
- source_word: וּפָרָשָׁיו
  choice: 骑兵
  rationale: פָרָשִׁים指骑马作战的人，现代汉语以“骑兵”表达最清楚。
