  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: zh_hans
  text: 罗波安王在耶路撒冷巩固了自己的地位，并在那里作王[a]。罗波安登基时四十一岁，在耶路撒冷作王十七年。耶路撒冷是耶和华从以色列各支派中拣选出来、要把自己的名安置在那里的城。他母亲名叫拿玛，是亚扪人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巩固了自己的地位”也可译作“使自己强盛起来”。原文动词既可指变得强大，也可指站稳脚跟、稳固权位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: 巩固了自己的地位
  rationale: 该词是חזק的Hitpael形式，在此具有反身及逐渐稳固的意味；结合罗波安在危机后整固王权的语境，此译比单纯的“强盛起来”更明确，也比字面的“使自己刚强”更自然。
- source_word: וַיִּמְלֹךְ
  choice: 继续作王
  rationale: 该叙事形式承接前一动作，表示罗波安稳固地位后执掌王权；译作“继续作王”符合本节总结其统治的语境，同时不把该动词误解为此刻才登基。
- source_word: כִּי בֶן אַרְבָּעִים וְאַחַת שָׁנָה ... בְּמָלְכוֹ
  choice: 罗波安登基时四十一岁
  rationale: 这是王朝纪年公式；בְּמָלְכוֹ标明即位时间，现代汉语以“登基时”表达最自然。句首כִּי在此引入说明性的年龄资料，无须机械译为“因为”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语域中通行的专名“耶和华”指称四字神名，保留其作为上帝名字而非称号的性质。
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: 要把自己的名立在那里
  rationale: 保留希伯来文圣约—圣殿用语中具体的“名”之表达，不扩写为“临在”或“居住”；“立”在中文中庄重自然，也能表达שׂום的设置、安置之意。
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 从以色列各支派中
  rationale: מן表示从整体范围中作出拣选；“从……中”准确传达这一关系。
- source_word: וְשֵׁם אִמּוֹ נַעֲמָה
  choice: 他母亲名叫拿玛
  rationale: 采用自然的现代汉语王室纪年表达，同时完整保留母亲姓名资料。
- source_word: הָעַמֹּנִית
  choice: 是亚扪人
  rationale: 阴性族称说明拿玛的族属；现代汉语不需用性别化族称，译作“亚扪人”简洁准确。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为读者熟悉、作为专名使用的“耶和华”，而不以“主”这一称号代替；“雅威”是较接近现代学术重构读音的另一译法。
- issue: “把自己的名立在那里”的圣殿拣选公式
  choice: 保留“名”的具体表达
  alternative: 在那里彰显自己的临在
  rationale: 原文只说上帝把自己的“名”设立在那里；不将其解释性扩展为“临在”或“居住”，以免加入经文本身未明说的神学阐释。
- issue: 罗波安“巩固自己”与“作王”的关系
  choice: 按相继而密切相关的两个动词表达为“巩固了自己的地位，继续作王”
  alternative: 在耶路撒冷强盛，作了王
  rationale: 原文并列两个叙事动词，既可理解为巩固权位后执政，也带有变得强盛的字面色彩；正文按上下文呈现王权稳固，脚注保留较贴近形式的译法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。王朝纪年公式用“登基时”“作王十七年”；圣殿拣选公式保留“把自己的名立在那里”的具体意象。避免古奥的“岁登基”等表达，也不把“名”解释性改写为上帝的临在。
