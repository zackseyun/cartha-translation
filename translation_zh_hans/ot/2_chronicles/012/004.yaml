  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: zh_hans
  text: 他攻取了犹大的坚固城，一直来到耶路撒冷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并进军直到耶路撒冷。”希伯来文用“来到”与“直到”表明他在攻取犹大的坚固城后推进至耶路撒冷；经文本身没有说明他是否进入或攻取该城。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: 攻取
  rationale: לכד在战争语境中指夺取、占领；“攻取”自然地保留了军事行动和成功夺城的含义。
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: 坚固城
  rationale: 该短语明确指设防的城邑；“坚固城”是简洁、庄重且常见的中文表达，也没有像“堡垒”那样略去“城”的含义。
- source_word: אֲשֶׁר לִיהוּדָה
  choice: 犹大的
  rationale: 介词ל在这里表示归属或隶属；“犹大的”保留政治归属的含义，同时不将其限定为单纯的地理位置。
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: 并来到耶路撒冷
  rationale: בוא与עַד表示行进至某一界限。“来到耶路撒冷”是自然中文，但可能被理解为进入城内，因此用脚注说明较严格的界限性译法。
