base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/014.yaml
  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: zh_hans
  text: 他行恶，因为他没有立定心意[a]寻求雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有预备好自己的心来寻求雅威。”
    reason: הֵכִין 可表示“预备、确立、使坚定”；此处与“心”及“寻求雅威”的目的性不定式连用，脚注保留较直译的表达。
lexical_decisions:
- source_word: וַיַּעַשׂ הָרָע
  choice: 他行了恶
  rationale: 直译叙事动词与道德评价；“行了恶”在现代汉语中简洁、庄重，也保留原文对行为的明确判断。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他行恶的原因，用“因为”清楚表达因果关系。
- source_word: לֹא הֵכִין לִבּוֹ
  choice: 没有立定心意
  rationale: הֵכִין 是 כון 的使役式，可指预备、确立或使之坚定；与“心”和目的性不定式连用时，“立定心意”自然表达内在意志未被坚定导向神，同时用脚注保留“预备”的词义。
- source_word: לִדְרוֹשׁ
  choice: 寻求
  rationale: דרשׁ 以神为宾语时可兼含寻求、求问和专心归向之意；“寻求”既简洁，又保留其较宽的语义范围。
- source_word: אֶת יְהוָה
  choice: 雅威
  rationale: 原文直接使用神的专名 יהוה；“雅威”按常见学术重构音译，避免把专名改成称号。
theological_decisions:
- issue: 如何处理“没有立定心意”与“行恶”之间的因果关系
  choice: 保留“因为”，直接呈现原文的因果陈述
  alternative: 弱化为“而且他没有……”
  rationale: כִּי 明确给出原因；译文不额外解释这种内在取向与外在恶行的神学关系。
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名而非称号；采用音译以保留专名性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“立定心意”保留希伯来语“心”作为意志与内在取向中心的表达；不把它窄化为纯粹的思想活动。
