base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: zh_hans
  text: 罗波安从始至终的事，岂不都记在先知示玛雅和先见易多的记载中，按家谱编录[a]吗？罗波安和耶罗波安常常交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本短语也可译作“在家谱记录中”或“为登记家谱”。希伯来原文较难确定，可能说明与易多有关的资料采用何种形式，或为何目的而编写。
    reason: 保留 לְהִתְיַחֵשׂ 的语法关系及功能上的不确定性。
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: 罗波安……的事
  rationale: 在君王生平的总结公式中，דִבְרֵי 指其统治期间的事迹、事件，而不只是言语；“事”自然且涵盖面合宜。
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: 从始至终
  rationale: 这是概括君王全部生平或统治事迹的惯用表达；中文“从始至终”准确传达整体范围，也比直译“最初的和末后的”自然。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 岂不都记在……吗
  rationale: 保留希伯来文引用史料时所用的反问句式；“都”呼应复数主语和全面概括。
- source_word: בְּדִבְרֵי
  choice: 记载中
  rationale: 此处指示玛雅和易多留下的书面史料；“记载”比“话语”更符合编史语境，同时避免擅自断定具体文献体裁。
- source_word: הַנָּבִיא / הַחֹזֶה
  choice: 先知／先见
  rationale: 分别翻译两个不同的希伯来称号，既使用通行圣经用语，也保留原文的措辞区别。
- source_word: לְהִתְיַחֵשׂ
  choice: 按家谱编录
  rationale: 该词源于“按谱系登记、列入家谱”的词根。原句语法关系不够明确，因此采用简洁短语并以脚注保留其可能表示资料形式或目的的歧义。
- source_word: וּמִלְחֲמוֹת רְחַבְעָם וְיָרָבְעָם
  choice: 罗波安和耶罗波安……一直彼此争战
  rationale: 希伯来文形式上是名词短语；中文补出隐含的述语并用“彼此”明确双方关系，使句子自然而不改变意义。
- source_word: כָּל הַיָּמִים
  choice: 在世的日子一直
  rationale: 保留“所有日子”的时间意象，同时用现代中文表达持续发生的争战；在此可涵盖两王同时在位、彼此对立的时期。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“先知”和“先见”保留原文不同称号；史料引用的反问语气予以保留。脚注标记紧接其实际解释的疑难短语，而非置于人名之后。
