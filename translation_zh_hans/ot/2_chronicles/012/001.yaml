  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: zh_hans
  text: 罗波安的国度巩固、他强盛以后，就离弃了耶和华的律法[a]；全以色列也随他离弃了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“训诲”。希伯来语“妥拉”可按语境表示律法或训诲。
    reason: 保留תּוֹרָה的词义选择，避免把其含义不必要地限定为法条。
lexical_decisions:
- source_word: וַיְהִי
  choice: 以后
  rationale: 这里引出时间背景；将其与两个כְ结构合并为自然的汉语“……以后”，不生硬直译为“事情发生了”。
- source_word: כְהָכִין מַלְכוּת רְחַבְעָם
  choice: 罗波安的王国巩固
  rationale: כון在此表达政权得以确立、稳固；“王国巩固”既保留מַלְכוּת的范围，也符合现代汉语叙事表达。
- source_word: וּכְחֶזְקָתוֹ
  choice: 他自己也强盛
  rationale: חזק表示罗波安达到强盛、稳固的状态；补出“他自己”以明确第三人称后缀所指，并与前面的“王国”区分。
- source_word: עָזַב
  choice: 离弃
  rationale: 该词在盟约语境中不只是普通的离开，而有背弃之意；“离弃”庄重、清楚，也符合现代宗教叙事语体。
- source_word: תּוֹרַת יְהוָה
  choice: 耶和华的律法
  rationale: תּוֹרָה可指律法或训诲；在此历史—盟约语境中，“律法”贴切且易懂，同时以脚注保留“训诲”的词义可能。神名按其专名译作“耶和华”。
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: 全以色列也和他一起离弃了
  rationale: 原文省略重复的动词，意思是全以色列与罗波安一同离弃耶和华的律法；汉语补出“离弃了”，使所参与的行动明确，同时保留“全以色列”的原文措辞。
theological_decisions:
- issue: 分裂王国时期“全以色列”的范围
  choice: 保留“全以色列”
  alternative: 全犹大／他的全体百姓
  rationale: 《历代志》在此仍使用יִשְׂרָאֵל。译文不把其历史或盟约范围解释性地缩窄为犹大，而保留原文可能具有的张力。
- issue: תּוֹרָה的语义范围
  choice: 正文译“律法”，脚注注明“训诲”
  alternative: 正文译“训诲”或“妥拉”
  rationale: “律法”适合此处离弃耶和华之道的盟约语境，但תּוֹרָה本身也可表示教导、训诲，因此不排除这一真实的词义层面。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“王国巩固”与“他自己也强盛”形成清楚的两个时间条件；末句补出省略的动词，以适应汉语表达，但不改变原文所述共同背弃的关系。
