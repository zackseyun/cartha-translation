  text: כִּ֥י יִהְיוּ ל֖/וֹ לַ/עֲבָדִ֑ים וְ/יֵדְעוּ֙ עֲב֣וֹדָתִ֔/י וַ/עֲבוֹדַ֖ת מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his slaves[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: zh_hans
  text: 因为他们必作他的奴仆，好使他们知道服事我[a]和服事列国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服事”也可译作“事奉”或“敬拜”；这个希伯来词也可指服役、劳作或受人辖制。本节重复使用这个词，形成服事上帝与服事列国之间的对照。
    reason: 保留 עֲבוֹדָה 可指敬拜性服事、劳役和臣服的词义范围，并说明原文的重复和对照，避免在正文增添“不同”。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明耶和华为何仍让他们受示撒辖制；“因为”自然表达这里的解释作用。
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: 他们必作他的奴仆
  rationale: היה + ל 构式表示成为某种身份；עֲבָדִים 在此指臣服于示撒，既有服役也有受辖制的含义。“奴仆”比单纯“仆人”更能体现这种政治性强制服役，同时保持庄重语体。
- source_word: וְיֵדְעוּ
  choice: 好让他们明白
  rationale: 此处未完成式前接 ו，在上下文中可表达目的或结果。“明白”保留 ידע 的认知含义，也自然传达他们将从经历中认识两种服事的差别。
- source_word: עֲבוֹדָתִי
  choice: 服事我
  rationale: עֲבוֹדָה 可指服役、劳作，也可指对上帝的敬拜性服事。“服事我”在现代中文中兼顾事奉、效忠与敬拜层面，避免缩窄为礼仪性的“敬拜”。
- source_word: וַעֲבוֹדַת
  choice: 服事
  rationale: 与前一处采用相同词语，以保留希伯来文刻意形成的平行和对照；在诸国一侧也能包含受统治、服劳役的意味。
- source_word: מַמְלְכוֹת הָאֲרָצוֹת
  choice: 各地诸国
  rationale: 保留复数“地”和“国度”的政治含义；“各地诸国”比逐字的“诸地的国度”更符合现代汉语，又不把范围扩大为全世界。
theological_decisions:
- issue: עֲבוֹדָה 在指向耶和华时应译为“服事”还是更具体的“敬拜”
  choice: 服事我
  alternative: 敬拜我
  rationale: 经文将归属并服事耶和华与臣服于世上诸国相对照。译作“服事”能同时保留宗教敬拜、忠诚和劳役等层面，并维持两处 עֲבוֹדָה 的词语呼应。
- issue: 是否在中文正文中明说两种服事之间的差别
  choice: 明白……有什么不同
  alternative: 知道服事我和服事各地诸国
  rationale: 希伯来文并未出现“不同”一词，但并列宾语在语境中显然要求比较性的理解。中文若机械并列会残缺难懂；明说“有什么不同”是为传达原句含蓄的对照，而非增添新的神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奴仆”体现受辖制的处境；两次使用“服事”保留原文的重复与反差。为使中文完整自然，将原文隐含的比较关系表达为“有什么不同”。
