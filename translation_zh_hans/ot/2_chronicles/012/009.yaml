  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: zh_hans
  text: 于是，埃及王示撒上来攻打耶路撒冷，夺走了耶和华殿[a]里的宝物和王宫[b]里的宝物。他把一切都夺走了，也夺走了所罗门所造的金盾牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华殿”原文直译为“耶和华的家”。
    reason: lexical_alternative
  - marker: b
    text: “王宫”原文直译为“王的家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: 上来攻打耶路撒冷
  rationale: עלה与介词עַל用于军事语境，表示向某城进军或攻打；“上来攻打”既保留登临耶路撒冷的表达，也明确军事行动。
- source_word: שִׁישַׁק
  choice: 示撒
  rationale: 采用现代中文圣经传统中通行且易识别的人名音译。
- source_word: אֹצְרוֹת
  choice: 宝物
  rationale: 此处指圣殿和王宫中储藏的贵重物品；中文“宝物”比“宝库”更自然地作为“夺走”的宾语，也不排除原词兼指储藏处或库藏。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: בית יהוה直译为“耶和华的殿/家”，在本处明确指圣殿；正文采用自然而庄重的“耶和华殿”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，避免将专名仅译作称号。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的家”，在此与圣殿并列，语境所指为王宫；“王宫”是自然清楚的现代中文。
- source_word: אֶת־הַכֹּל לָקָח
  choice: 他把一切都夺走了
  rationale: 保留希伯来文复述性短句及其强调作用，突出劫掠的彻底。
- source_word: מָגִנֵּי הַזָּהָב
  choice: 金盾牌
  rationale: 准确简洁地表达由金制成或以金装饰的盾牌，不额外限定其礼仪用途。
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: 所罗门制造的
  rationale: 自然表达这些盾牌是所罗门先前命人制作或制作的；不强行补出原文未明说的使役含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留为专名，并采用普通现代中文读者最熟悉的“耶和华”；“雅威”是较接近学术重构读音的可行替代。
- issue: בית יהוה所指
  choice: 耶和华殿
  alternative: 耶和华的家
  rationale: 在历代志的叙事语境中，此固定表达指耶路撒冷圣殿；译作“殿”清楚自然，同时脚注保留较贴近形式的译法。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。以两个“夺走”重现原文反复使用לקח所形成的强调，并保留“他把一切都夺走了”这一复述句。正文将两个בית按具体语境分别译为“殿”和“王宫”，脚注说明其字面平行结构。
