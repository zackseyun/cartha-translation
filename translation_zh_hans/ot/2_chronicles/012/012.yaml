revisions:
- from: 他谦卑下来时，雅威的怒气就从他身上转去，不致彻底毁灭；而且犹大境内也有一些美善之事[a]。
  to: 当他谦卑时，雅威的怒气就从他转去，使他不至于被彻底毁灭；而且，犹大境内也有美好的事[a]。
  rationale: 修订补足“彻底毁灭”在中文中的受事关系，以消除句法歧义，同时仍以“使他不至于被彻底毁灭”表达原文怒气转离所带来的结果。末句删去“一些”，并将“美善之事”调整为更自然而不失宽泛性的“美好的事”；脚注继续说明其所指未被限定。
