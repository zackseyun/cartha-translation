base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: zh_hans
  text: 当他谦卑时，雅威的怒气就从他转去，使他不至于被彻底毁灭；而且，犹大境内也有美好的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美好的事”原文含义宽泛，可指犹大境内可称许的状况、行为或其他事情。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: 他谦卑下来时
  rationale: 介词 בְּ 加不定词构成时间表达；כנע 的 Hitpael 形式在此表示罗波安使自己谦卑，而非仅仅遭受羞辱。
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: 雅威的怒气就从他身上转去
  rationale: שׁוּב 与 מִן 连用，保留怒气从罗波安身上转离的方向意象；אַף 在此按惯用义译为“怒气”，יהוה 音译为神的名字“雅威”。
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: 不致彻底毁灭
  rationale: 否定词加不定词承接怒气转去所产生的结果；לְכָלָה 强调毁灭达到完全程度。原文未明说毁灭的宾语，中文也不补出，以保留其范围可能指罗波安、相关群体或犹大的含混性。
- source_word: וְגַם בִּיהוּדָה
  choice: 而且犹大境内也
  rationale: וְגַם 表示进一步补充；בִּיהוּדָה 按地点义自然译为“犹大境内”。
- source_word: הָיָה דְּבָרִים טוֹבִים
  choice: 有一些美善之事
  rationale: דְּבָרִים 的指涉宽泛，可能涵盖状况、行为或其他事情；“美善之事”保持这种概括性，不限定为道德改革、善行或繁荣。
theological_decisions:
- issue: 神的怒气转去与审判减轻之间的关系
  choice: 雅威的怒气就从他身上转去，不致彻底毁灭
  alternative: 雅威便后悔，不再毁灭他
  rationale: 原文描写怒气从罗波安身上转离，并明确说没有达到彻底毁灭；这既保留真实的神圣忿怒与审判，也呈现因谦卑而有的减免，却不暗示一切后果都被撤销。
- issue: 毁灭对象的范围
  choice: 不补出宾语
  alternative: 不把他彻底毁灭／不把他们彻底毁灭
  rationale: 希伯来文在“毁灭”后没有明示宾语。中文省略宾语仍可通顺，并避免武断限定为罗波安个人或犹大众人。
- issue: 犹大中“美善之事”的具体所指
  choice: 一些美善之事
  alternative: 犹大的景况良好／犹大人有善行
  rationale: 原文 דְּבָרִים טוֹבִים 有意保持宽泛，可指可称许的状况、行动或事务；译文不将其单一定义为属灵改革、道德行为或物质昌盛。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谦卑下来”自然表达反身动作；“怒气从他身上转去”保留原文意象；末句使用“美善之事”及脚注，避免过度解释。
