  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: zh_hans
  text: 先知示玛雅来到罗波安和那些因示撒[a]而聚集在耶路撒冷的犹大众首领那里，对他们说：“雅威如此说：‘你们离弃了我，所以我也离弃了你们，把你们交在示撒手中。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因示撒”：希伯来文直译为“从示撒面前”，可表示由于示撒的威胁、因惧怕他，或为躲避他。
    reason: 说明希伯来习语的字面形式及其在本处保留的语义范围。
lexical_decisions:
- source_word: וּשְׁמַעְיָה הַנָּבִיא
  choice: 先知示玛雅
  rationale: וּ推进叙事，中文无需机械译作“于是”；专名按现代中文圣经通行形式译为“示玛雅”，并保留其先知身份。
- source_word: בָּא אֶל רְחַבְעָם וְשָׂרֵי יְהוּדָה
  choice: 来到罗波安和犹大众首领那里
  rationale: בָּא אֶל表示来到某人那里；שָׂרִים在此指具有统治地位的领袖，“首领”比“官员”更能涵盖其政治领导身份。
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלִַם
  choice: 他们……聚集在耶路撒冷
  rationale: נֶאֶסְפוּ为尼法勒式，可表达聚集或被召集；上下文未明说施事者，正文自然译作主动而不添加原因。אֶל字面为“到”，结合完成后的地点自然译为“在耶路撒冷”。
- source_word: מִפְּנֵי שִׁישָׁק
  choice: 因示撒
  rationale: מִפְּנֵי可指“由于、因惧怕、为躲避”；简洁译为“因”保留原因的宽度，脚注说明更具体的可能语气。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留标准先知使者公式，并将四字神名直接音译为“雅威”。
- source_word: עֲזַבְתֶּם אֹתִי … עָזַבְתִּי אֶתְכֶם
  choice: 你们离弃了我……我也离弃了你们
  rationale: 同一动词עָזַב重复出现，采用相同译词以保存审判宣告中的对应与反转；“离弃”也保有盟约背叛的分量。
- source_word: בְּיַד שִׁישָׁק
  choice: 把你们交在示撒手中
  rationale: “在某人手中”是受其权势支配的希伯来语习语；中文加“交”使句法完整，同时保留“手中”的意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近现代学界通常采用的读音重构，并明确呈现盟约之名。
- issue: 神离弃百姓与百姓离弃神之间的关系
  choice: 所以我也离弃了你们
  alternative: 我也任凭你们
  rationale: 原文前后使用同一个动词עָזַב，并以וְאַף אֲנִי构成对应性的审判。“所以……也”显出这种回应关系，却不进一步解释其系统神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。保留“雅威如此说”的先知公式、“离弃”的盟约分量，以及“交在……手中”的圣经意象；避免古奥虚词和不必要的解释性增译。
