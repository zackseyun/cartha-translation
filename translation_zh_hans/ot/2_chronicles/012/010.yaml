  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתֵּי/הֶ֔ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: zh_hans
  text: 于是，罗波安王造了铜盾牌来代替那些金盾牌[a]，交给守卫王宫门口的卫兵[b]长官保管。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即用铜盾牌代替示撒在上一节夺走的金盾牌。
    reason: cross_reference
  - marker: b
    text: “卫兵”原文直译为“奔跑者”，可能指兼任传令和王宫护卫的王室侍从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: עָשָׂה在此表示制作器物；“造了”自然、简洁，符合叙事语体。
- source_word: תַּחְתֵּיהֶם
  choice: 来代替那些金盾牌
  rationale: תַּחַת加代词后缀表示替代；正文补明上节被夺走的金盾牌，使中文指代清楚，并以脚注标示其语境补足性质。
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: 铜盾牌
  rationale: נְחֹשֶׁת可指铜或青铜；在古代武器语境中很可能是青铜，但现代中文圣经传统常用“铜”，故保留较宽泛且自然的表达。
- source_word: וְהִפְקִיד עַל יַד
  choice: 交给……保管
  rationale: הִפְקִיד与עַל יַד合起来表达把物件交托在某人手下看管；“交给……保管”准确传达托付和保管的含义。
- source_word: שָׂרֵי
  choice: 长官
  rationale: שַׂר在此指统领卫队的人；“长官”既适合宫廷职务语境，也避免擅自确定具体军阶。
- source_word: הָרָצִים
  choice: 卫兵
  rationale: 字面为“奔跑者”，但在王室语境中指承担传令和护卫职责的一类侍从；正文按此处职能译为“卫兵”，字面含义留在脚注。
- source_word: הַשֹּׁמְרִים
  choice: 守卫
  rationale: 分词表示持续执行看守职责；中文用“守卫”自然地修饰这队卫兵。
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: 王宫门口
  rationale: 字面为“王的房屋的入口”；在语境中指王宫入口，“王宫门口”是清楚自然的现代中文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。调整希伯来语修饰关系为自然中文，将“守卫王宫门口”置于“卫兵”之前；不把שָׂר具体化为未经文本明确的军衔。
