base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: zh_hans
  text: 他带着一千二百辆战车和六万名骑兵；同他从埃及来的人不计其数[a]，有利比亚人、苏基人[b]和古实人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这些人没有数目。”
    reason: lexical_alternative
  - marker: b
    text: “苏基人”是一个确切身份不明的族群名称。
    reason: cultural_note
  - marker: c
    text: “古实人”有时译作“埃塞俄比亚人”，但“古实人”更直接反映希伯来文的历史地理称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: 带着一千二百辆战车
  rationale: 介词 בְּ 在军力列举中表示随带或拥有；רֶכֶב 在数词后按具体车辆译为“战车”，符合现代汉语习惯。
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: 和六万名骑兵
  rationale: פָּרָשִׁים 指骑马作战的人；“骑兵”简明自然，也保留军事语境。
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: 人不计其数
  rationale: 保留希伯来语“没有数目”的夸张性惯用表达，同时使用自然、庄重的现代汉语。
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: 同他从埃及来
  rationale: 准确表达这些人随示撒同行并来自埃及；本节承接上文，代词“他”自然清楚。
- source_word: לוּבִים
  choice: 利比亚人
  rationale: 该族名通常指利比亚人，采用现代汉语通行名称。
- source_word: סֻכִּיִּים
  choice: 苏基人
  rationale: 此族群的确切身份不明，因此按希伯来语音译，不作推测性辨认。
- source_word: וְכוּשִׁים
  choice: 和古实人
  rationale: “古实”直接对应历史地理名称 כּוּשׁ，避免以现代“埃塞俄比亚”过度限定其范围。
