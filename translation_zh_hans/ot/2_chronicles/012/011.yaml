  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: zh_hans
  text: 每逢王进入雅威的殿，卫兵[a]就来把它们拿走[b]，随后把它们送回卫兵的房间[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卫兵”直译为“奔跑的人”，在这里指王室卫队。
    reason: lexical_alternative
  - marker: b
    text: “它们”指上一节所说的铜盾牌。
    reason: cross_reference
  - marker: c
    text: 或译“卫兵室”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: 每逢……进入
  rationale: מִדֵּי加不定式表示反复发生的情形；“每逢”自然地保留了这一迭代意义。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת字面为“房屋”，在此指圣殿；现代汉语用“殿”既清楚自然，也保留了宗教建筑的庄重语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以专名呈现，不以称号替代。
- source_word: הָרָצִים
  choice: 卫兵
  rationale: 该词字面可指“奔跑的人”，但在王室语境中指承担护卫职责的卫队；“卫兵”准确传达其职能。
- source_word: וּנְשָׂאוּם
  choice: 抬起它们
  rationale: נשׂא在此表示拿起并携带；宾语后缀所指为上一节的铜盾牌。译文保留代词，以维持本节与上文的衔接。
- source_word: וֶהֱשִׁיבוּם
  choice: 把它们送回
  rationale: שׁוב的使役式在此表示使物件返回原处；“送回”符合卫兵用后归还盾牌的语境。
- source_word: תָּא
  choice: 室
  rationale: 该词指小室或房间；与“卫兵”组合成“卫兵室”，简洁自然，并保留空间含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”音译，将其作为专名呈现，避免以称号“主”取代；“耶和华”是另一传统音译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“每逢……就……”清楚表达原文反复发生的动作；保留代词“它们”及其上文所指，并用脚注说明。
