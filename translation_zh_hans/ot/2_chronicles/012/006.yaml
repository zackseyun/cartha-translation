  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: zh_hans
  text: 于是，以色列[a]的首领和王都谦卑下来，说：“雅威是公义的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“以色列”。在此语境中，有人认为这是特指罗波安治下犹大的首领，但原文本身写的是“以色列”。
    reason: 说明原文措辞及一种语境性理解，同时避免在正文中将“以色列”改成“犹大”。
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: 谦卑下来
  rationale: כּנע 的尼法勒形式在这里表示面对先知责备而自我降卑、顺服；“谦卑下来”自然地表达了这种主动回应，同时不排除受外在处境促使的意味。
- source_word: שָׂרֵי
  choice: 首领
  rationale: שָׂרִים 指掌权者、官长或贵族；“首领”是现代汉语中清楚而庄重的概括性称呼。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 希伯来文本明确写“以色列”。虽然上下文涉及罗波安统治下的犹大，译文仍保留原文用词，不改成“犹大”。
- source_word: וְהַמֶּלֶךְ
  choice: 和王
  rationale: 忠实保留并列结构，将王与众首领区分开来。
- source_word: וַיֹּאמְרוּ
  choice: 说
  rationale: 承接前面的复数主语；现代汉语无需重复“他们”，叙事衔接自然。
- source_word: צַדִּיק
  choice: 公义的
  rationale: צַדִּיק 在此肯定雅威施行审判的正直与公正；“公义”保留其道德和盟约语境中的分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名 YHWH，而不以称号替代其专名。
theological_decisions:
- issue: 神名 יְהוָה 应保留为专名还是译成称号
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留其专名性质，并较接近学界通常重构的读音；不以“主”替代。
- issue: 是否因历史上下文将“以色列”协调为“犹大”
  choice: 以色列
  alternative: 犹大
  rationale: 原文明确为 יִשְׂרָאֵל。译作“犹大”会把上下文解释写进正文，因此保留原词，并用脚注说明其语境。
- issue: צַדִּיק 在此强调一般道德属性还是审判正确
  choice: 公义的
  alternative: 公正的；是对的
  rationale: “公义的”既可涵盖雅威在此次审判中行事公正，也保留该词更广的道德与盟约含义，不将语义缩窄。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“谦卑下来”表达首领和王对先知责备的回应；“都”清楚表明两个并列主体共同采取行动。脚注标记置于“以色列”之后，使注释与所说明的词直接对应。
