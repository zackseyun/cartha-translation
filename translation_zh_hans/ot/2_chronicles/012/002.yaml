base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: zh_hans
  text: 罗波安王第五年，埃及王示撒上来进犯耶路撒冷，因为他们对耶和华[a]不忠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不忠”也可译作“背信”或“违背了对耶和华的忠诚”。原文动词含有背信、违背信约或神圣责任的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这里是希伯来叙事承接形式；中文直接从时间状语起句，更自然，也保留叙事推进。
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: 罗波安王第五年
  rationale: 这是君王纪年的标准表达；中文用“某王第五年”简洁、自然且贴近原意。
- source_word: עָלָה ... עַל יְרוּשָׁלִָם
  choice: 上来攻打耶路撒冷
  rationale: עלה על在军事语境中表示向某地进军、与之为敌；“上来攻打”既保留上行意象，又清楚表达敌对行动，但不进一步断言此时已经攻陷。
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: 埃及王示撒
  rationale: 按现代中文习惯将称号置于人名前；专名采用通行圣经译名“示撒”。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达历代志作者所给出的因果关系。
- source_word: מָעֲלוּ בַּיהוָה
  choice: 得罪了耶和华
  rationale: מעל指背信、失信或违背神圣责任。“得罪了耶和华”是自然庄重的中文，并由脚注补明其背信含义，以免只被理解为一般过错。
theological_decisions:
- issue: 示撒入侵的盟约性解释
  choice: 因为他们得罪了耶和华
  alternative: 因为他们对耶和华不忠／背叛了耶和华
  rationale: 原文明确把入侵与百姓对耶和华的מעל联系起来。正文保留直接因果关系，不把事件仅仅处理为政治或军事发展；脚注说明该动词含有背信、不忠的关系性意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“耶和华”用于对应神名יהוה；“上来攻打”保留原文军事行动及上行色彩。脚注标记[a]已置于相关短语之后。
