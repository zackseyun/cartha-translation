  text: וּ/בִ/רְא֤וֹת יְהוָה֙ כִּ֣י נִכְנָ֔עוּ הָיָה֩ דְבַר יְהוָ֨ה אֶל שְׁמַֽעְיָ֧ה לֵ/אמֹ֛ר נִכְנְע֖וּ לֹ֣א אַשְׁחִיתֵ֑/ם וְ/נָתַתִּ֨י לָ/הֶ֤ם כִּ/מְעַט֙ לִ/פְלֵיטָ֔ה וְ/לֹא תִתַּ֧ךְ חֲמָתִ֛/י בִּ/ירוּשָׁלִַ֖ם בְּ/יַד שִׁישָֽׁק־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: zh_hans
  text: 雅威看见他们谦卑下来，雅威的话就临到示玛雅，说：“他们已经谦卑下来，我不会毁灭他们；我要使他们略得解救[a]，我的烈怒也不会借示撒的手倾倒在耶路撒冷。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“给他们一点逃脱的机会”，也可理解为“使他们留下一些幸存者”。希伯来语原句十分简练，可能强调他们只会得到有限的解救，而不是完全免受毁灭。
    reason: 保留 כִּמְעַט לִפְלֵיטָה 在“解救、逃脱、幸存者”之间的词义空间。
lexical_decisions:
- source_word: וּבִרְאוֹת
  choice: 见……时／见……（随即）
  rationale: 介词 בְּ 加 ראה 的不定式附属形构成时间从句；中文以“见……”承接下句，既自然又保留事件次序。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，不以称号替代；“雅威”是现代汉语中清楚、通行的形式。
- source_word: נִכְנָעוּ
  choice: 谦卑下来
  rationale: כנע 的尼法勒形在此表示他们因先知的责备而自卑、降服；“谦卑下来”保留其主动回应与状态变化。
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: 雅威的话就临到
  rationale: 保留先知叙事中的固定表达，同时“就”自然呈现前后紧接的关系。
- source_word: לֹא אַשְׁחִיתֵם
  choice: 我不会毁灭他们
  rationale: שׁחת 的使役形在审判语境中通常指毁灭；此译直接而庄重。
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: 我要使他们略得解救
  rationale: 原文表达紧凑，פְלֵיטָה 可指逃脱、解救或存留下来的人；“略得解救”保留 כִּמְעַט 所表达的有限程度，又不把歧义过度限定为“少数余民”。
- source_word: תִתַּךְ חֲמָתִי
  choice: 我的烈怒……倾倒
  rationale: נתך 与 חמה 构成形象鲜明的审判用语；“烈怒倾倒”保留原文隐喻和庄重语域。
- source_word: בְּיַד שִׁישָׁק
  choice: 借示撒的手
  rationale: 保留希伯来语表示施事或工具的“借……的手”结构，在现代中文中仍清楚可懂。
- source_word: שִׁישָׁק
  choice: 示撒
  rationale: 采用该埃及王名在中文圣经传统中通行且易辨认的音译。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，不以称号代替。
- issue: כִּמְעַט לִפְלֵיטָה 所指的解救范围
  choice: 使他们略得解救
  alternative: 给他们一点逃脱的机会／使他们留下一些幸存者
  rationale: 原文可能强调有限的拯救、逃脱或存留者。正文不将其固定解释为完全免灾或仅有少数幸存者，并用脚注保存其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威的话就临到”保留先知公式；“烈怒倾倒”保留审判意象。脚注标记置于实际存在词义歧义的“略得解救”之后。
