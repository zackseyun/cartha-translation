base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
translation:
  language: zh_hans
  text: 罗波安与列祖同睡[a]，葬在大卫城；他儿子亚比雅接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与列祖同睡”是表示去世并归入祖先行列的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与列祖同睡
  rationale: 这是希伯来文史书中君王去世的惯用表达。保留“同睡”的形象和王朝记述的固定语气，而下文的安葬自然表明这是指死亡；“列祖”也准确表达父辈与祖先的群体。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 以自然简洁的现代汉语表达希伯来文被动式“被安葬”；汉语在此省略“被”不改变受事意义。
- source_word: בְּעִיר דָּוִיד
  choice: 在大卫城
  rationale: “大卫城”是该地名在汉语圣经传统中清楚而通行的表达。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位承继的叙事中，מלך表示执掌王权；“作王”自然、庄重，并与后面的承继关系相配。
- source_word: אֲבִיָּה
  choice: 亚比雅
  rationale: 按本节马所拉文本的名字形式 אֲבִיָּה 音译为“亚比雅”，不采用其他经文所见的异形。
- source_word: בְנוֹ
  choice: 他儿子
  rationale: 直接表达父子关系，简洁符合现代汉语。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 此处指王位承继。“接替他”自然传达“在他的位置上”的含义，同时不增添原文没有的细节。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留希伯来文君王去世公式中的“同睡”意象，并用脚注说明其惯用含义。分号清楚呈现安葬与王位承继两个相连的叙事动作。
