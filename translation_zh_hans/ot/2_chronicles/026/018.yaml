  text: וַ/יַּעַמְד֞וּ עַל עֻזִּיָּ֣הוּ הַ/מֶּ֗לֶךְ וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹא לְ/ךָ֣ עֻזִּיָּ֗הוּ לְ/הַקְטִיר֙ לַֽ/יהוָ֔ה כִּ֣י לַ/כֹּהֲנִ֧ים בְּנֵי אַהֲרֹ֛ן הַ/מְקֻדָּשִׁ֖ים לְ/הַקְטִ֑יר צֵ֤א מִן הַ/מִּקְדָּשׁ֙ כִּ֣י מָעַ֔לְתָּ וְ/לֹֽא לְ/ךָ֥ לְ/כָב֖וֹד מֵ/יְהוָ֥ה אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: zh_hans
  text: 他们站出来反对乌西雅王，对他说[a]：“乌西雅啊，向耶和华烧香不是你的职分，而是亚伦的子孙，就是那些分别为圣、可以烧香的祭司的职分。离开圣所吧！因为你行事不忠[b]；这事不会使你从耶和华上帝那里得到尊荣[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站出来反对”也可译作“抵挡他”或“上前制止他”。
    reason: lexical_alternative
  - marker: b
    text: “行事不忠”也可译作“干犯了”或“背信了”。这个希伯来语动词常指在神圣或圣约之事上背信、越界。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近于：“并不归你得着来自耶和华上帝的尊荣。”这是一个省略式表达，意思是乌西雅的这一行为不会使他从上帝那里得到尊荣。
    reason: textual_clarity
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: 他们挡住
  rationale: 该短语在这里表示站出来阻挡、抗拒某人；“挡住”自然地传达祭司正面制止王的语境，同时不弱化其对抗意味。
- source_word: עֻזִּיָּהוּ הַמֶּלֶךְ
  choice: 乌西雅王
  rationale: 按现代汉语习惯将称号置于名字之后。
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: 向耶和华烧香不是你的职分
  rationale: 此结构表达某事不属于乌西雅应有的权限或职责；“不是你的职分”既自然，也避免引入现代行政术语。
- source_word: לְהַקְטִיר
  choice: 烧香
  rationale: 在本节祭司礼仪语境中，קטר 的使役形专指焚烧、献上香。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 以“耶和华”呈现四字神名，符合现代中文圣经语体，也保留专名性质。
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: 而是亚伦子孙中……祭司的职分
  rationale: 保留烧香职分专属于亚伦系祭司这一明确限制；补出“职分”承接前句，是汉语所需的省略补足。
- source_word: הַמְקֻדָּשִׁים
  choice: 分别为圣
  rationale: 被动分词指这些祭司已被分别出来从事圣职；“分别为圣”保留礼仪与宗教含义。
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: 离开圣所吧
  rationale: מקדש 指神圣场所或圣所；“圣所”不武断限定为更狭窄的内室。
- source_word: מָעַלְתָּ
  choice: 你行事不忠
  rationale: מעל 常指在圣约或圣物之事上背信、干犯；“行事不忠”保留其严重的关系性和宗教性，而不把它淡化为程序错误。
- source_word: וְלֹא לְךָ לְכָבוֹד מֵיְהוָה אֱלֹהִים
  choice: 这事不会使你从耶和华上帝那里得着尊荣
  rationale: 原文是省略式表达，直译近于“这对你并非来自耶和华上帝的尊荣”；译文补明结果关系，使现代汉语清楚，同时保留尊荣来自上帝这一点。
theological_decisions:
- issue: 在圣所烧香的祭司专属职分
  choice: 明确说明烧香是分别为圣的亚伦系祭司的职分，不属于乌西雅王。
  alternative: 将其泛化为王权与宗教领导权之间的一般冲突。
  rationale: 原文针对的是圣所中烧香这一具体礼仪职分，并明确指出亚伦子孙中的祭司；译文不将其扩展为经文未明说的普遍制度论。
- issue: מָעַלְתָּ 的神学分量
  choice: 译为“你行事不忠”。
  alternative: 译为“你犯了规”或仅表示程序失误。
  rationale: 该动词在祭祀和圣约语境中表示严重的背信或干犯；“行事不忠”保留这种分量，但不额外指定后世神学分类。
- issue: 末句尊荣的来源及结果
  choice: 理解为乌西雅此举不会使他从耶和华上帝那里得着尊荣。
  alternative: 机械直译为“并不归你为尊荣，从耶和华上帝”。
  rationale: 希伯来文为省略句，语义指向此举不会带来上帝所赐的尊荣；译文作最低限度补足，并用脚注保留原文形式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“职分”“分别为圣”“圣所”“尊荣”保留祭司礼仪语境，又避免过度古雅。直接称呼“乌西雅啊”传达原文当面对王发出的严正警告。
