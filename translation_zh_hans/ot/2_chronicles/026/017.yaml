base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: zh_hans
  text: 祭司亚撒利雅跟着他进去；与亚撒利雅同去的，还有八十位事奉耶和华的祭司，都是勇敢的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有能力的人”或“英勇的人”。希伯来语这一习语可指以力量、能力、勇气或英勇著称的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: 跟着他进去
  rationale: בוא可表示“来、去、进入”，אַחֲרָיו表示跟随在某人之后。结合亚撒利雅随乌西雅进入圣所区域的上下文，译作“跟着他进去”自然且不额外限定具体位置。
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: 祭司亚撒利雅
  rationale: 按现代汉语称谓习惯将职分置于姓名之前；定冠词表明其祭司身份，但本节本身没有明确使用“大祭司”一称。
- source_word: וְעִמּוֹ
  choice: 与亚撒利雅同去的，还有
  rationale: 原文是表示陪同的短语，未重复动词。汉语补出“同去的，还有”，清楚表达八十位祭司与亚撒利雅同行，并避免代词指向含混。
- source_word: כֹּהֲנִים לַיהוָה
  choice: 事奉耶和华的祭司
  rationale: 介词ל表示这些祭司与耶和华的归属或事奉关系；译作“事奉耶和华的祭司”在汉语中清楚自然。
- source_word: שְׁמוֹנִים
  choice: 八十位
  rationale: 直译数词，并以适合人的量词“位”表达。
- source_word: בְּנֵי חָיִל
  choice: 勇士
  rationale: 这是希伯来语习语，字面为“能力之子”，可指以力量、勇气或英勇著称的人。本处强调这些祭司敢于面对君王，译作“勇士”简洁有力，同时以脚注保留词义范围。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者熟悉且具有专名形式的“耶和华”，而不以“主”替代，从而保留经文使用神圣专名这一特点。
- issue: הַכֹּהֵן是否译作“大祭司”
  choice: 祭司
  alternative: 大祭司
  rationale: 原文仅为带定冠词的“祭司”，没有“大祭司”一词；因此不根据人物身份或传统解释增译“大”。
- issue: בְּנֵי חָיִל的性别与人物特征
  choice: 勇士
  alternative: 勇敢的人
  rationale: 上下文中的祭司为男性，原习语也采用阳性表达。“勇士”既保留其阳性人物指称，也呈现力量与胆识，不将其仅缩减为内在勇敢。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“跟着他进去”保留原文动作方向的适度含混；重复“亚撒利雅”以消除“与他同去”可能指向乌西雅的歧义。脚注标记置于“勇士”之后，与所解释的希伯来语习语准确对应。
