  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: zh_hans
  text: 可是，当他强盛起来时，他的心就高傲起来，以致败亡。他对他的上帝雅威不忠，进入雅威的圣殿，要在香坛上烧香。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: 可是，他一强盛起来
  rationale: כְּ与“他的强盛”在此构成时间背景，且上下文有明显转折；“一强盛起来”自然表达“当他强盛时”，又显出强盛与随后骄傲之间的紧密联系。
- source_word: גָּבַהּ לִבּוֹ
  choice: 心就高傲
  rationale: 希伯来文直译为“他的心高了”，是骄傲自大的惯用表达。现代汉语用“心就高傲”既保留“心”的意象，也清楚传达其道德含义。
- source_word: עַד לְהַשְׁחִית
  choice: 以致自取败亡
  rationale: 该短语可表达达到毁坏或败亡的结果。结合主语自身因骄傲而遭祸，“自取败亡”简洁传达结果，但不把它误解为仅仅“行事败坏”。
- source_word: וַיִּמְעַל
  choice: 他……不忠
  rationale: מעל常指违背信任或盟约关系的不忠行为；“不忠”比泛泛的“犯罪”更能保留其关系和盟约色彩。
- source_word: בַּיהוָה אֱלֹהָיו
  choice: 对自己的上帝雅威
  rationale: ב与מעל连用表示不忠所针对的对象，译作“对……不忠”；“自己的上帝”对应 אֱלֹהָיו，并以“雅威”呈现神名。
- source_word: הֵיכַל יְהוָה
  choice: 雅威的圣殿
  rationale: הֵיכָל在此指圣殿建筑或圣所；“圣殿”符合中文圣经语域，也清楚区别于一般宫殿。
- source_word: לְהַקְטִיר
  choice: 要……烧香
  rationale: קטר的使役形在礼仪语境中指焚烧或献上香；“烧香”直接自然，并与下文香坛相配。
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香坛
  rationale: 该组合意为专供焚香的祭坛；“香坛”是简洁、明确且通行的现代中文表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”呈现其作为上帝盟约名字的性质，而不以称号“主”替代。
- issue: עַד לְהַשְׁחִית 所指是败亡结果还是败坏行为
  choice: 以致自取败亡
  alternative: 直到行事败坏
  rationale: 该结构容许结果意义，叙事也强调骄傲最终给王带来灾祸；译文保留因骄傲走向毁灭的张力，不将其缩减为一般的道德败坏。
- issue: 王进入圣殿烧香的罪责如何表达
  choice: 仅按原文叙述其不忠和行动，不在正文补入祭司职权说明
  alternative: 明确补译为“擅自”或“越权”烧香
  rationale: 上下文会说明祭司职分方面的冲突，本节本身以“不忠”和“竟进入”评价其行为；避免在正文加入原文未明说的制度解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“可是”承接前文成功并形成逆转；“竟”自然显出此举的僭越和惊人性质，但没有额外添加具体教义说明。全节不需脚注。
