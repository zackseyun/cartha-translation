  text: וַ/יְהִי֙ לִ/דְרֹ֣שׁ אֱלֹהִ֔ים בִּ/ימֵ֣י זְכַרְיָ֔הוּ הַ/מֵּבִ֖ין בִּ/רְאֹ֣ת הָ/אֱלֹהִ֑ים וּ/בִ/ימֵי֙ דָּרְשׁ֣/וֹ אֶת יְהוָ֔ה הִצְלִיח֖/וֹ הָ/אֱלֹהִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: zh_hans
  text: 乌西雅在撒迦利亚的日子不断寻求上帝；撒迦利亚通晓上帝的异象[a]。乌西雅寻求耶和华期间，上帝使他亨通[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“撒迦利亚教导人敬畏上帝。”这句希伯来语含义不易确定；马所拉经文较直译为“通晓上帝的异象”。
    reason: 保留一个流传广泛、可能反映不同读法的译法，同时说明正文所依据的马所拉经文。
  - marker: b
    text: 或译：“只要乌西雅寻求耶和华，上帝就使他亨通。”
    reason: 说明原文时间短语在语境中可带有持续性的条件意味。
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: 不断寻求上帝
  rationale: היה与不定式连用表示持续的状态或惯常行为；“不断寻求”自然传达这种延续性。דרש在本语境中指以敬虔和倚靠来寻求上帝，不仅是向上帝求问信息。
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: 在撒迦利亚的日子
  rationale: 保留希伯来语的时间表达，同时在现代汉语中仍清楚庄重。
- source_word: הַמֵּבִין
  choice: 有洞察力
  rationale: בין的分词表示理解、明辨；此译法避免把它未经证实地解释为主动“教导”。
- source_word: בִּרְאֹת הָאֱלֹהִים
  choice: 对上帝的异象
  rationale: 马所拉经文的读音与“看见、异象”相关；“对……的异象有洞察力”保留其启示性视觉含义，也承认原文措辞艰深。
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: 乌西雅寻求耶和华的日子
  rationale: 贴近“在他寻求耶和华的日子”的时间结构，不把它完全改写为明确条件句；为避免中文主语含混，补明“乌西雅”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名形式呈现四字神名，区别于称号“主”。
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: 上帝使他亨通
  rationale: 准确表达צלח使役形的神圣施动意义；“亨通”简洁、庄重，也包括顺遂与成功。
theological_decisions:
- issue: בִּרְאֹת הָאֱלֹהִים这一疑难短语的含义
  choice: 撒迦利亚对上帝的异象有洞察力
  alternative: 撒迦利亚教导人敬畏上帝／明白敬畏上帝的事
  rationale: 马所拉经文的元音标注支持与“看见、异象”有关的理解，而非“敬畏”。正文优先保留原文证据所支持但略显艰深的读法，常见异读则置于脚注。
- issue: וּבִימֵי דָּרְשׁוֹ的时间与条件意味
  choice: 乌西雅寻求耶和华的日子
  alternative: 只要乌西雅寻求耶和华
  rationale: 希伯来语字面构造标示一段以寻求为特征的时期，语境可产生“只要”的条件意味，但不必在正文中将这种语用含义绝对化；脚注保留更明确的条件式译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“乌西雅”在第二、三句补出，以免读者误把“寻求耶和华”的主语理解为撒迦利亚。句中保留“上帝”与专名“耶和华”的区别，并将疑难读法置于脚注，不在正文中消除原有歧义。
