base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: zh_hans
  text: 犹大的全体百姓选定乌西雅[a]；他十六岁[b]，并立他作王，接替他的父亲亚玛谢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “选定”原文直译为“取了”；在这里指百姓选定乌西雅，并立他作王。
    reason: lexical_alternative
  - marker: b
    text: 这句话也可译为“虽然他才十六岁”。希伯来语的连接词本身可仅表示承接；是否含有让步意味，要由语境判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 选中了
  rationale: 原义为“取、拿”，但在此登基语境中指百姓选定乌西雅；译作“选中了”既自然，也避免让现代读者误解为实际拿取。
- source_word: כָּל עַם יְהוּדָה
  choice: 犹大众民
  rationale: 完整保留“全体、百姓、犹大”三层信息，突出参与行动的是犹大的全体民众。
- source_word: עֻזִּיָּהוּ
  choice: 乌西雅
  rationale: 按本节马所拉文本中的人名形式音译；相关经文虽另见“亚撒利雅”，本节不据此改名。
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: 他当时十六岁
  rationale: 以现代汉语表达希伯来语“他是十六岁之子”的年龄句式；“当时”自然连接叙事，同时不把连接词强行解释为让步。
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: 众民立他作王
  rationale: 使役式动词表示“使他为王”；“立他作王”准确、庄重，也不额外加入加冕礼仪。补出“众民”使汉语指代清楚。
- source_word: תַּחַת
  choice: 接替
  rationale: 在王位继承语境中表示取代前任的位置；“接替”比字面空间义更符合现代汉语。
- source_word: אָבִיו אֲמַצְיָהוּ
  choice: 他父亲亚玛谢
  rationale: 直接表达亲属关系，并采用该人名通行的中文音译。
theological_decisions: []
