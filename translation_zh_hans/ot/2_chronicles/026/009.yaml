base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: zh_hans
  text: 乌西雅在耶路撒冷的角门、谷门和转角处[a]建造了塔，并加固这些塔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转角处”或译“角处”；希伯来语可指建筑或防御工事的角、拐角或转折处。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 建造了
  rationale: בנה意为“建造”；这里叙述王修筑防御设施，用“建造了”自然且准确。
- source_word: עֻזִּיָּהוּ
  choice: 乌西雅
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: מִגְדָּלִים
  choice: 塔楼
  rationale: מִגְדָּלִים是“塔”的复数；“塔楼”符合城防语境，又不预先加入后文“加固”的含义。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 介词ב在此表示地点，直译为“在耶路撒冷”。
- source_word: עַל
  choice: 在……处
  rationale: 在城门及防御工事的语境中，עַל表示设置塔楼的位置；译作“在……处”比“在……上”更自然，也避免断定塔楼必然建在门顶。
- source_word: שַׁעַר הַפִּנָּה
  choice: 角门
  rationale: 这是城门名称，直译为“角门”，简洁并符合中文地名表达。
- source_word: שַׁעַר הַגַּיְא
  choice: 谷门
  rationale: גַּיְא意为“谷”；作为城门名称，译作“谷门”。
- source_word: הַמִּקְצוֹעַ
  choice: 城墙转角处
  rationale: מִקְצוֹעַ可指角、拐角或转折处。结合城防语境，以“城墙转角处”清楚表达其地形或建筑意义，并与“角门”区分。
- source_word: וַיְחַזְּקֵם
  choice: 并加固这些塔楼
  rationale: חזק的加强式在城防语境中表示加固；阳性复数宾语后缀最自然地回指前文的塔楼，明说“这些塔楼”可避免中文代词指向含混。
theological_decisions: []
