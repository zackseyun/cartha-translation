source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: zh_hans
  text: 他在耶路撒冷制造了由巧匠设计的装置[a]，安放在城楼和城角上，用来发射箭矢和大石。他的名声传到远方[b]，因为他得了非同寻常的帮助[c]，直到强盛起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“器械”或“机械”；指设计安装在城防设施上的军事装置。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他的名传到远方。”
    reason: lexical_alternative
  - marker: c
    text: 原文没有明确指出是谁帮助他，不过上下文暗示这帮助来自上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: 装置
  rationale: 该词指经过构思制造的器具或机械。“装置”是自然、宽泛的现代汉语，既符合军事语境，又不对其具体构造作无根据的限定。
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: 由巧匠设计
  rationale: 同源词组合强调设计者经过筹划而作的设计；“由巧匠设计”兼顾其构思与技艺层面，并保持汉语简洁自然。
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: 在城楼和城角上
  rationale: מִגְדָּלִים指城楼或塔楼，פִּנּוֹת字面为角落、转角；“城角”保留原文意象，同时由上下文表明这是城防设施的位置。
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: 用来发射箭矢和大石
  rationale: 不定式表达用途，同一动词同时支配箭与石；“发射”可自然涵盖箭矢及由器械投出的石块。
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: 他的名声传到远方
  rationale: “他的名出去”是名声传播的习语；此译既符合现代汉语，也保留传播至远方的空间意象。
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: 他得了非同寻常的帮助
  rationale: 原文表达所受帮助具有非凡、奇异的性质，并以被动意义留下施助者未明说；该译不擅自补出施助者。
- source_word: עַד כִּי חָזָק
  choice: 直到强盛起来
  rationale: 此句说明帮助持续所达到的结果或程度；“强盛起来”自然表达他进入强盛状态。
theological_decisions:
- issue: 帮助乌西雅的主体是否应明说为上帝
  choice: 正文保留未明说的施助者：“他得了非同寻常的帮助”
  alternative: 明确译作“耶和华奇妙地帮助他”
  rationale: 本节希伯来文使用表示“得帮助”的结构，却没有明确指出施助者；虽然上下文暗示这是来自上帝的帮助，译文仍保留本节自身的含蓄，不把上下文推断直接写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“城楼和城角”保留原文的城防空间意象；“非同寻常的帮助”传达其非凡性质，同时避免把原文未明说的施助者加入正文。
