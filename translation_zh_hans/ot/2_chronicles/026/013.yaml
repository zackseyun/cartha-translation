base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/013.yaml
  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
translation:
  language: zh_hans
  text: 他们统领的军队共有三十万七千五百人[a]，都是以强大的力量作战、帮助王抵御仇敌的战士。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“在他们的管理下，有一支三十万七千五百人的军队，是以勇力作战的人。”正文将希伯来文的军事用语译成自然的现代汉语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: 他们统领的
  rationale: עַל־יַד 在这里是表示管理、指挥权的军事行政用语，并非字面所说的“在他们手下”；“他们统领的”符合现代汉语表达。
- source_word: חֵיל צָבָא
  choice: 军队
  rationale: 两个名词连用表示一支军事力量；译作“军队”简洁自然，避免生硬重复为“军队的兵力”。
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 三十万七千五百人
  rationale: 按希伯来文数字直接合计为307,500；加“人”明确这是军队人数。
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: 作战
  rationale: 字面意为“从事战争／作战的人”。这里保留实际作战的含义，不擅自限定为“受过训练”，同时借“都能”使中文符合军队名册语境。
- source_word: בְּכֹחַ חָיִל
  choice: 以强大的战力
  rationale: כֹּחַ 与 חַיִל 都带有力量、勇力或军事实力之意；“强大的战力”保留叠加强调，也适合军事语境。
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: 帮助王
  rationale: 忠实直译常用动词 עזר（帮助、协助），行文清楚自然。
- source_word: עַל הָאוֹיֵב
  choice: 抵御仇敌
  rationale: 在帮助君王的军事语境中，עַל 表示敌对方向；“抵御仇敌”比字面“对抗仇敌”更顺畅，又不改变基本含义。
