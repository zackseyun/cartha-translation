base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: zh_hans
  text: 乌西雅与他的列祖同睡。他们把他与他的列祖一同葬在属于诸王的墓田里，因为他们说：“他是麻风病人[a]。”他的儿子约坦接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“患皮肤病的人。”希伯来文所指的是患 צָרַעַת 的人；这种古代疾病类别可能比现代所说的麻风病（汉森病）更广。
    reason: 保留原词在古代礼仪及疾病分类上的范围，避免作过度精确的现代医学诊断。
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 这是君王讣告中表示死亡的惯用语；“同睡”保留希伯来文的委婉表达，又能由上下文清楚表明死亡。
- source_word: עִם אֲבֹתָיו
  choice: 与列祖
  rationale: “列祖”是现代中文圣经语体中自然、庄重的王朝性表达，兼具先祖和历代先王的含义。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 人把他……葬在
  rationale: 原文是主语未明的主动复数形式；用泛指的“人”保留施事者未具体说明这一点，避免改成被动式。
- source_word: בִּשְׂדֵה הַקְּבוּרָה
  choice: 在……墓田里
  rationale: “墓田”简洁地保留 שָׂדֶה“田地”的具体意象，同时在现代中文中可以理解为安葬之地。
- source_word: אֲשֶׁר לַמְּלָכִים
  choice: 属于诸王的
  rationale: 介词 ל 可表示归属或用途；此译自然地表达王室墓地的关联，而不进一步断定产权或具体用途。
- source_word: מְצוֹרָע
  choice: 麻风病人
  rationale: 保留传统且简明的称谓，但以脚注说明 צָרַעַת 并不必然等同于现代医学所说的汉森病。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 符合王位继承叙事的常用中文表达。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 明确表达儿子取代父亲继承王位的含义，比单说“在他以后”更贴近原文。
theological_decisions:
- issue: מְצוֹרָע 所指疾病类别与现代医学“麻风病”的关系
  choice: 正文译作“麻风病人”，并加注限定
  alternative: “患皮肤病的人”或“患严重皮肤病的人”
  rationale: 该词指患 צָרַעַת 的人，涉及古代礼仪和疾病分类，其范围可能广于现代汉森病。正文保留熟悉的传统表达，脚注则避免把古代术语武断地等同于单一现代诊断。
- issue: “与列祖同睡”是否直接释为死亡
  choice: 保留“与列祖同睡”的委婉语
  alternative: “死了”
  rationale: 原文采用君王讣告的固定表达。保留意象能呈现其文学和传统意味，且随后的安葬叙述足以消除误解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“列祖”“同睡”“墓田”保留原文的王室讣告语气和具体意象；句法适度现代化，以“人们说”“接替他作王”确保普通读者易于理解。
