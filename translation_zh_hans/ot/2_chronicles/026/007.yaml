  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: zh_hans
  text: 神帮助他攻打非利士人、住在古珥巴力的阿拉伯人和米乌尼人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“玛云人”。这个希伯来文族名可能指一个有关联的群体，也可能是同一群体名称的另一种形式。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: 帮助他
  rationale: עזר带第三人称阳性单数宾语后缀，直译为“帮助他”；保留神为施行帮助的主语。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 此处虽带定冠词，却是叙事中对以色列之神的常规称呼；现代汉语自然译作“神”。
- source_word: עַל
  choice: 攻打
  rationale: עַל与“帮助”连用并处于军事语境，表示援助他与敌对群体交战；“帮助他攻打”比逐字译作“帮助他反对”更符合现代汉语。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 该族名在中文圣经及历史叙事中的通行译名。
- source_word: הערביים
  choice: 阿拉伯人
  rationale: 该族名指阿拉伯地区的族群；“阿拉伯人”是现代汉语清楚、通行的历史族称。
- source_word: הַיֹּשְׁבִים
  choice: 住在
  rationale: ישב的分词在此表示居住，用“住在”自然地引出地点，并修饰“阿拉伯人”。
- source_word: בְּגוּר בָּעַל
  choice: 在姑珥巴力
  rationale: ב表示居住地点；גור בעל按专名音译为“姑珥巴力”。
- source_word: הַמְּעוּנִים
  choice: 米乌尼人
  rationale: 按马所拉文本的辅音形式音译该族名；其确切所指有争议，因此另在脚注保留相关异译。
