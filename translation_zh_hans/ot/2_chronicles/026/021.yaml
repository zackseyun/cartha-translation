  text: וַ/יְהִי֩ עֻזִּיָּ֨הוּ הַ/מֶּ֜לֶךְ מְצֹרָ֣ע עַד י֣וֹם מוֹת֗/וֹ וַ/יֵּ֜שֶׁב בֵּ֤ית ה/חפשות מְצֹרָ֔ע כִּ֥י נִגְזַ֖ר מִ/בֵּ֣ית יְהוָ֑ה וְ/יוֹתָ֤ם בְּנ/וֹ֙ עַל בֵּ֣ית הַ/מֶּ֔לֶךְ שׁוֹפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: zh_hans
  text: 乌西雅王患了麻风[a]，直到去世；他患麻风，住在一所隔离的房子里[b]，因为他被隔绝在雅威的殿之外。他的儿子约坦管理王宫，审理那地的百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“麻风”的希伯来语所指范围比现代医学上的麻风病更广，可包括多种严重的皮肤病症。
    reason: 避免把古代疾病名称误认作单一的现代医学诊断。
  - marker: b
    text: “隔离的房子”所译的希伯来语含义不确定，字面可译作“自由之屋”；这里很可能指乌西雅因病而分开居住的住所。
    reason: 保留疑难短语的字面可能性及其语境性解释。
lexical_decisions:
- source_word: מְצֹרָע
  choice: 患了麻风／患麻风
  rationale: 沿用读者熟悉的圣经传统用语，但不把 צָרַעַת 等同于现代医学所定义的麻风病；以脚注说明其语义范围。
- source_word: בֵּית הַחפשות
  choice: 一所隔离的房子
  rationale: 该短语字面意义和具体所指均不确定；结合乌西雅因皮肤病与王宫、圣殿生活分离的语境，译出其很可能表达的独居、隔离住所之意，同时用脚注保留字面译法。
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: 被隔绝在雅威的殿之外
  rationale: נִגְזַר 表示被割断、隔绝；此译法保留其强烈程度，并自然表达他不能进入圣殿的处境。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת 字面为“房屋、家”，在此明确指圣殿；现代汉语以“殿”表达较自然，同时保留与神圣居所相关的措辞。
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: 管理王宫
  rationale: 该短语表示负责王室住所或王家事务；“管理王宫”简洁自然，且不把约坦的具体职衔说得过于确定。
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: 治理国民
  rationale: שׁפט 可指审判、断事，也可延伸为施行统治；在约坦代行王政的语境中，“治理”较自然，并保留其行政司法的广义。
- source_word: עַם הָאָרֶץ
  choice: 国民
  rationale: 此处指国中的百姓；“国民”比直译“地上的百姓”更符合现代汉语，且未将其限定为某一社会阶层。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重构的发音，并将其作为专名呈现。
- issue: 乌西雅被隔绝的性质
  choice: 被隔绝在雅威的殿之外
  alternative: 从雅威的殿中被剪除
  rationale: 原文说明他与圣殿隔绝，但没有在本句中进一步界定这是礼仪禁入、司法处分还是更广泛的神圣惩罚；译文不额外判定其机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“去世”比“死的日子”自然；“管理王宫，治理国民”简洁呈现约坦代掌王室与国政的情形。脚注标记均置于其所解释的词语之后。
