  to: 乌西雅王患了麻风[a]，直到去世；他患麻风，住在一所隔离的房子里[b]，因为他被隔绝在雅威的殿之外。他的儿子约坦管理王宫，审理那地的百姓。
  rationale: 修订恢复“患麻风”与“住在隔离的房子里”的原文并列关系，并将“因为”直接连接到“被隔绝在雅威的殿之外”。同时将“治理国民”改为“审理那地的百姓”，更贴近שׁוֹפֵט与עַם הָאָרֶץ的措辞，且不排除其在语境中的广义行政含义。
