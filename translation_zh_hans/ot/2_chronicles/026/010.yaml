  text: וַ/יִּ֨בֶן מִגְדָּלִ֜ים בַּ/מִּדְבָּ֗ר וַ/יַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים כִּ֤י מִקְנֶה רַּב֙ הָ֣יָה ל֔/וֹ וּ/בַ/שְּׁפֵלָ֖ה וּ/בַ/מִּישׁ֑וֹר אִכָּרִ֣ים וְ/כֹֽרְמִ֗ים בֶּ/הָרִים֙ וּ/בַ/כַּרְמֶ֔ל כִּֽי אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: zh_hans
  text: 他在旷野建造塔楼[a]，又凿了许多蓄水池，因为他有许多牲畜。他在低地[b]和平原有农夫，在山地和肥沃之地[c]有栽培葡萄的人，因为他喜爱土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔楼”或译“守望塔”。
    reason: lexical_alternative
  - marker: b
    text: “低地”也可音译为“示非拉”，指犹大山地西面的低丘地带。
    reason: cultural_note
  - marker: c
    text: “肥沃之地”或译“迦密”，若此处作地名理解。
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: 塔楼
  rationale: 该词泛指塔；上下文虽可能指用于守望的塔，但希伯来文本未明确说明其功能，因此正文采用较克制的“塔楼”。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר可指旷野、草原或牧地；“旷野”保留宽泛含义，也不把地貌限定为极度干旱的沙漠。
- source_word: וַיַּחְצֹב בֹּרוֹת
  choice: 凿了……蓄水池
  rationale: חצב常指在岩石中凿挖，בֹּרוֹת在为牲畜供水的语境中宜理解为储水池，而非泉水井；此译兼顾动作和用途。
- source_word: מִקְנֶה רַב
  choice: 许多牲畜
  rationale: מִקְנֶה是牲畜的集合名词；译作“许多牲畜”不把范围缩小为牛群。
- source_word: שְׁפֵלָה
  choice: 低地
  rationale: 此词可指犹大山地以西的低丘地区；正文按地形意义译为“低地”，另以脚注提示专名译法。
- source_word: מִישׁוֹר
  choice: 平原
  rationale: 该词表示平坦之地；“平原”是现代汉语中自然且宽泛的对应词。
- source_word: אִכָּרִים
  choice: 农夫
  rationale: 该词指耕种土地的人；“农夫”简洁、自然，并保留其农业劳动者之意。
- source_word: כֹרְמִים
  choice: 栽培葡萄的人
  rationale: 该词特指料理、种植葡萄园的人；此译比泛称“农夫”更准确，也比生硬的专门称谓更易懂。
- source_word: בֶּהָרִים
  choice: 在山地
  rationale: הרים可指山或丘陵；“山地”既保留地貌类别，也适合农业语境。
- source_word: בַּכַּרְמֶל
  choice: 在肥沃之地
  rationale: כַּרְמֶל既可能是普通名词，指肥沃、可耕种之地，也可能是专名“迦密”；正文依农业语境采用普通名词义，并用脚注保留另一读法。
- source_word: אֹהֵב אֲדָמָה
  choice: 他喜爱土地
  rationale: אֲדָמָה指土地、土壤；“喜爱土地”保留原文具体的农耕意象，同时在现代汉语中较“喜爱土壤”自然。
