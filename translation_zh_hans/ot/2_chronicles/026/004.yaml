  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为正的事，完全照他父亲亚玛谢所行的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他行
  rationale: 叙事性 wayyiqtol 推进事件；现代汉语不必另译句首连接词，译作“他行”自然简洁。
- source_word: הַיָּשָׁר
  choice: 看为正的事
  rationale: 与 עשה 构成“行正直之事”的惯用表达；结合 בְּעֵינֵי 译成“眼中看为正的事”，既保留评价含义，也符合现代汉语习惯。
- source_word: בְּעֵינֵי
  choice: 眼中
  rationale: 保留希伯来语以“眼中”表达判断或评价角度的比喻。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字音译“耶和华”，不以称号替代专名。
- source_word: כְּכֹל אֲשֶׁר
  choice: 完全照……所……的
  rationale: “完全”体现 כֹל 的全面范围，“照”体现 כְּ 的依照、相符之意。
- source_word: עָשָׂה
  choice: 所行的
  rationale: 中文以关系结构自然表明亚玛谢的行为是当前比较的既有先例，无需显式标示过去完成时。
- source_word: אֲמַצְיָהוּ
  choice: 亚玛谢
  rationale: 采用该人名通行的现代中文圣经译名。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 上下文明确亚玛谢是乌西雅的亲生父亲，因此按直接亲属义翻译。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用历史悠久且普通读者最熟悉的音译“耶和华”，保留其专名性质，不改译为“主”；“雅威”是较贴近学界拟音的可行替代。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准普通话。保留“眼中”的原文意象，并用“完全照”清楚表达行为模式的全面一致。
