base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: zh_hans
  text: 乌西雅登基时十六岁[a]，在耶路撒冷作王五十二年。他母亲名叫耶可利雅[b]，是耶路撒冷人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“他开始作王时”或“他作王之际”。
    reason: lexical_alternative
  - marker: b
    text: “耶可利雅”也可音译为“耶基利雅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: 十六岁
  rationale: 这是希伯来语表达年龄的惯用语；译为现代汉语“十六岁”自然、准确。
- source_word: בְמָלְכוֹ
  choice: 登基时
  rationale: 该结构标明开始作王的时间；“登基时”简洁地表达即位之际。
- source_word: מָלַךְ
  choice: 作王
  rationale: 此动词指担任君王并施行统治；“作王”符合历代志王朝纪年的庄重用语。
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: 五十二年
  rationale: 按现代汉语数字表达方式准确翻译原文。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词表示作王的地点，直译为“在耶路撒冷”。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 自然呈现希伯来语常见的家谱式姓名公式。
- source_word: יכיליה
  choice: 耶可利雅
  rationale: 按该希伯来人名的常见读音音译，同时以脚注保留另一种音译可能。
- source_word: מִן יְרוּשָׁלִָם
  choice: 是耶路撒冷人
  rationale: 介词מִן表示来源；在现代汉语人物介绍中，“是耶路撒冷人”自然地表达其籍贯或来源。
