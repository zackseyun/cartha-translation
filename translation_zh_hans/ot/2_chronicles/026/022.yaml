  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י עֻזִּיָּ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרֹנִ֑ים כָּתַ֛ב יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/022.yaml
  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: zh_hans
  text: 乌西雅其余的事迹[a]，自始至终，是亚摩斯的儿子以赛亚先知所写的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“乌西雅其余的话，先前的和后来的。”这里的“话”是希伯来文史籍常用的表达，指他在位期间的事件或作为。
    reason: 说明דִּבְרֵי的字面意义及其在君王记述公式中的用法。
lexical_decisions:
- source_word: וְיֶתֶר
  choice: 其余的
  rationale: יֶתֶר指剩余的部分；在王朝记述的总结句式中，“其余的”自然准确。句首的וְ不必机械译成“现在”，中文可借上下文体现承接。
- source_word: דִּבְרֵי
  choice: 事迹
  rationale: 该词本义可指“话”或“事情”，但在记述君王生平的固定句式中，指其在位期间的事件和作为；“事迹”符合中文史传语体。
- source_word: עֻזִּיָּהוּ
  choice: 乌西雅
  rationale: 按本节所用名字עֻזִּיָּהוּ音译；不以别处同一君王的异名“亚撒利雅”替代。
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: 自始至终
  rationale: 原文直译为“先前的和后来的”，在此涵盖乌西雅事迹的整个时间范围；“自始至终”自然且保留其完整跨度。
- source_word: כָּתַב
  choice: 写的
  rationale: 保留动词“写”的直接词义，不改作较具解释性的“编纂”或“记载”。
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: 亚摩斯的儿子、先知以赛亚
  rationale: 完整保留姓名、父称和先知身份；以现代中文同位结构清楚表达。
theological_decisions:
- issue: 王朝记述句式中דִּבְרֵי的含义
  choice: 译为“事迹”
  alternative: 译为“话”或“事情”
  rationale: 上下文说的是乌西雅在位期间的历史内容，并非只指他说过的话；脚注保留较直译的可能，避免掩盖希伯来文表达。
- issue: “先前的和后来的”所表达的范围
  choice: 译为“自始至终”
  alternative: 译为“早期的和晚期的”
  rationale: 该成对表达在此概括整段统治时期；“自始至终”不额外断定材料的具体分期，也符合现代汉语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“都是……写的”重排希伯来语语序以符合中文表达，同时保留作者、父称和先知身份。
