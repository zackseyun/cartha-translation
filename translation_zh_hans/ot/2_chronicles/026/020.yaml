  to: 祭司长亚撒利雅转向他，众祭司也都看见，只见他额头上患了麻风[a]。他们急忙把他赶出那里[b]；他自己也急忙出去[c]，因为耶和华击打了他。
  rationale: 修订恢复原文中亚撒利雅先转向、众祭司继而察见的叙述层次，不把“察看”过度并入原动词；同时将“长了麻风”改为更自然且较不具体化的“患了麻风”。脚注锚点与内容均保留，并继续呈现“赶出／催离”和“主动急出／被催逼”的词义张力。
