review_pass:
  verdict: revise
  source_fidelity: 原文的动作次序是亚撒利雅这位祭司长先转向乌西雅，众祭司随即察看；现译“祭司长亚撒利雅和众祭司转过身来看他”将众祭司也直接并入“转过身”的主语，且“来看”比原文“转向他”多出察看的动作。病状译作“额头上患了麻风”较“长了麻风”更自然，也避免将古代术语过度当作具体病变。其余关于紧急离开与耶和华击打的表达基本忠实，并以脚注保留了动词的歧义。
  naturalness: 建议采用“祭司长亚撒利雅转向他，众祭司也都看见”来既贴合句法又符合现代庄重叙事汉语。“只见”引出突见的病状自然；“急忙把他赶出那里；他自己也急忙出去”流畅清楚。
  terminology: “祭司长”恰当地对应“为首的祭司”，不应擅自改作带有更强技术含义的“大祭司”。“耶和华”保留四字神名，符合中文通行的专名译法。“麻风”可保留，但必须由脚注说明其不必然等同现代医学所称麻风病。
