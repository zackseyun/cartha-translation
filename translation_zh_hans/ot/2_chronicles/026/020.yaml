  text: וַ/יִּ֣פֶן אֵלָ֡י/ו עֲזַרְיָהוּ֩ כֹהֵ֨ן הָ/רֹ֜אשׁ וְ/כָל הַ/כֹּהֲנִ֗ים וְ/הִנֵּה ה֤וּא מְצֹרָע֙ בְּ/מִצְח֔/וֹ וַ/יַּבְהִל֖וּ/הוּ מִ/שָּׁ֑ם וְ/גַם הוּא֙ נִדְחַ֣ף לָ/צֵ֔את כִּ֥י נִגְּע֖/וֹ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: zh_hans
  text: 祭司长亚撒利雅转向他，众祭司也都看见，只见他额头上患了麻风[a]。他们急忙把他赶出那里[b]；他自己也急忙出去[c]，因为耶和华击打了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “麻风”译自希伯来语中用于祭司洁净条例的一类严重皮肤病名称，不一定与现代医学所说的麻风病完全相同。
    reason: cultural_note
  - marker: b
    text: “赶出那里”也可译作“催他赶快离开”。原文动词可侧重祭司强力移走他，也可侧重当时仓促紧急的情形。
    reason: lexical_alternative
  - marker: c
    text: “急忙出去”也可译作“被催逼出去”。希伯来语形式可强调他受到外力驱赶，但上下文也表明他本人急于离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: 转过身来看他
  rationale: פנה配合אֵלָיו表示转向某人；结合下文众人发现他额头上的病状，译为“转过身来看他”自然呈现身体转向与察看，但不削弱原文动作。
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: 祭司长亚撒利雅
  rationale: כֹהֵן הָרֹאשׁ直译为“为首的祭司”。“祭司长”在现代汉语中简洁自然，又不必把该短语强行等同于另一固定技术称谓。
- source_word: וְכָל הַכֹּהֲנִים
  choice: 和众祭司
  rationale: 表达亚撒利雅与全体祭司一同转向察看；“众祭司”比“所有的祭司”更凝练庄重。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: הִנֵּה在此标示突然而鲜明的发现。“只见”符合现代汉语叙事习惯，并保留现场感。
- source_word: מְצֹרָע בְּמִצְחוֹ
  choice: 他额头上长了麻风
  rationale: 保留祭司洁净条例中的传统疾病用语，同时以“长了”自然表达病症显现在额头上；脚注说明其与现代医学麻风病未必完全对应。
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: 他们急忙把他从那里赶出去
  rationale: בהל的使役式含有使人仓促、惊惶离开的意味；此处祭司采取紧急行动将他移出。“赶出去”体现实际移除，但脚注保留可侧重催促、使其赶快出去的可能。
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: 他自己也急着出去
  rationale: וְגַם הוּא强调他本人也参与这场紧急离开。נִדְחַף为被动形态，可有“被催逼、被驱使”的意味；正文依语境译作主动急切，脚注保留形式上的被动色彩。
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: 因为耶和华击打了他
  rationale: נגע在此不是中性的“触摸”，而指神所施的打击或灾病。“击打”保留叙事中的神圣审判意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中广为人知的神名音译，明确表达原文四字神名，而不以一般称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列神的专名。中文正文保留专名，并采用普通读者最熟悉、庄重且通行的“耶和华”；“雅威”是另一种较接近学术重构发音的音译。
- issue: כֹהֵן הָרֹאשׁ是否作为严格的技术职衔处理
  choice: 祭司长
  alternative: 大祭司；为首的祭司
  rationale: 原文字面是“为首的祭司”。“祭司长”既能表达其领导地位，也避免仅凭此处措辞进一步规定其职衔的全部制度含义。
- issue: 乌西雅离开是否完全出于自主行动
  choice: 正文译为“他自己也急着出去”，脚注保留“被催逼出去”
  alternative: 他也被迫出去
  rationale: נִדְחַף的形态和词义容许外力催逼，但וְגַם הוּא又强调他本人也迅速离开。正文按情境表达其急切反应，同时用脚注保存被动意味，不替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“只见”保留突见病状的现场感；分号区分祭司的紧急行动与乌西雅本人的反应。所有脚注标记均紧随所说明的词句。
