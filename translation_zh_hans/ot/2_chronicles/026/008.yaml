  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: zh_hans
  text: 亚扪人向乌西雅进贡。他的名声[a]传到埃及的入口[b]，因为他极其强盛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的名传到”；这里的“名”指名声或声望。
    reason: lexical_alternative
  - marker: b
    text: “埃及的入口”可能指通往埃及之处，或埃及的边境地区。
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: 亚扪人
  rationale: 这是民族名称；“亚扪人”是现代中文圣经语境中清楚而通行的译法。
- source_word: מִנְחָה
  choice: 进贡
  rationale: 在外国族群向君王交付财物的政治语境中，此词指贡物或贡赋；用动词“进贡”最自然。
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: 他的名声传到
  rationale: 原文直译为“他的名传到”，其中“名”指声望、名望；译作“名声”既符合现代汉语，也保留了原文概念。
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: 传到埃及入口
  rationale: “埃及入口”较贴近希伯来文的空间意象，同时脚注说明它可能指通往埃及之处或埃及边境地区。
- source_word: הֶחֱזִיק
  choice: 强盛
  rationale: 此处使役词形表达变得或显得强大；结合君王的政治军事处境，“强盛”简洁自然。
- source_word: עַד לְמַעְלָה
  choice: 极其
  rationale: 该短语在此强化“强盛”的程度，表示达到很高的程度；“极其”准确而符合现代书面汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“进贡”体现政治关系；保留“埃及入口”的原文空间意象，并借脚注说明其可能所指。为使脚注与内容准确对应，将[a]置于“名声”之后，将[b]置于“埃及入口”之后。
