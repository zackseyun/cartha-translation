lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 宗族首领
  rationale: 字面为“父系家族的首领”，在历代志的家族组织语境中，现代汉语用“宗族首领”既简洁自然，也保留其按父系家族划分的含义。
- source_word: לְגִבּוֹרֵי חָיִל
  choice: 勇士的
  rationale: לְ 在此表示这些首领与“勇士”群体的归属或关联；译作“勇士的宗族首领”较自然，并避免把首领与勇士误解为两个彼此独立的群体。
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 二千六百人
  rationale: 准确表达原文数目；补出量词“人”符合现代汉语习惯。
