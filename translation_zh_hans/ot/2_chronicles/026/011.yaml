base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: zh_hans
  text: 乌西雅有一支能征战的军队，按登记在册的人数分队出征，由书记耶乌利[b]和官员玛西雅负责管理，并受王的众将领之一哈拿尼雅统辖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按他们点验的总数。”这里的希伯来语指对士兵进行正式清点或登记。
    reason: lexical_alternative
  - marker: b
    text: 本节希伯来文本将此名写作“יעואל”；也可音译为“耶利”或“耶韦勒”。
    reason: textual_name_form
lexical_decisions:
- source_word: חַיִל עֹשֵׂה מִלְחָמָה
  choice: 一支能征战的军队
  rationale: חַיִל在此指军事力量；分词短语עֹשֵׂה מִלְחָמָה说明这支军队具备作战能力。译文既保留军事含义，也符合现代汉语表达。
- source_word: יוֹצְאֵי צָבָא לִגְדוּד
  choice: 分队出征
  rationale: יוֹצְאֵי צָבָא指执行军事任务或出征的人，לִגְדוּד在军队编制语境中表示按队伍、分队行动。
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: 按照登记点名的人数
  rationale: פְּקֻדָּה在此涉及军队正式清点、登记或点名；并列“登记点名”可传达其行政与军事点验含义，同时以脚注保留词义范围。
- source_word: בְּיַד
  choice: 由……负责管理
  rationale: 字面为“在……手中”，此处表示耶乌利和玛西雅承担直接的行政管理职责。
- source_word: הַסּוֹפֵר
  choice: 书记
  rationale: סֹפֵר可指抄写员、书记或行政秘书；在王国军事行政语境中，“书记”自然且保留其官职色彩。
- source_word: הַשּׁוֹטֵר
  choice: 官员
  rationale: שֹׁטֵר指负责执行、监督或管理的官吏；其具体职能在本节并未完全说明，因此采用较宽泛的“官员”。
- source_word: עַל יַד
  choice: 受……统辖
  rationale: 该短语在这里表明更高一级的监督或指挥关系；“统辖”清楚呈现军队层级，又不把具体职权规定得过细。
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: 王的一位将领
  rationale: שַׂר可指首领、官长或将领；本节处于军事语境，因此译作“将领”，而介词מִן表达他属于王的众首领之一。
