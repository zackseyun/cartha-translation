  to: 乌西雅有一支能征战的军队，按登记在册的人数分队出征，由书记耶乌利[b]和官员玛西雅负责管理，并受王的众将领之一哈拿尼雅统辖。[a]
  rationale: 修订仅改善军队清点用语、句法衔接和“众将领之一”的群体含义；保留原文的军事行政层级与人名处理。脚注a仍说明פְּקֻדָּה的点验／登记范围，脚注b紧随所说明的耶乌利。
