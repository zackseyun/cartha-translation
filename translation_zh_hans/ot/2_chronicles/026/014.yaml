base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: zh_hans
  text: 乌西雅为他们，也就是为全军，预备了盾牌、长矛、头盔、铠甲、弓和投石索用的石块[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“投石索的石头”。
    reason: 保留希伯来语属格结构，并说明这里指供投石索使用的石块。
lexical_decisions:
- source_word: וַיָּכֶן
  choice: 预备了
  rationale: 使役词形在这里表示使军械齐备、可供使用；“预备了”符合军需语境，又不暗示这些装备都是乌西雅制造的。
- source_word: לָהֶם
  choice: 为他们
  rationale: 直接保留希伯来语代词；下文“也就是为全军”说明其所指。
- source_word: לְכָל הַצָּבָא
  choice: 为全军
  rationale: צָבָא在本段指军事力量；“全军”简洁自然，并体现לְכָל的整体范围。
- source_word: מָגִנִּים
  choice: 盾牌
  rationale: 这是该军事装备名词在此处的常规含义。
- source_word: רְמָחִים
  choice: 长矛
  rationale: 准确表达רֹמַח所指的长柄刺击武器，也比音译或古雅名称更易懂。
- source_word: כּוֹבָעִים
  choice: 头盔
  rationale: 在军械清单中指防护头部的装备。
- source_word: שִׁרְיֹנוֹת
  choice: 铠甲
  rationale: 该词指护身甲胄；“铠甲”庄重、通行，同时不擅自限定为锁子甲。
- source_word: קְשָׁתוֹת
  choice: 弓
  rationale: 直接对应复数名词，汉语列举装备时无需显式标示复数。
- source_word: אַבְנֵי קְלָעִים
  choice: 投石索用的石块
  rationale: 短语直译为“投石索的石头”；此译明确说明石块的用途及其对应武器，符合现代汉语。
theological_decisions: []
