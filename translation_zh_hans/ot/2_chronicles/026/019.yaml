  text: וַ/יִּזְעַף֙ עֻזִּיָּ֔הוּ וּ/בְ/יָד֥/וֹ מִקְטֶ֖רֶת לְ/הַקְטִ֑יר וּ/בְ/זַעְפּ֣/וֹ עִם הַ/כֹּהֲנִ֗ים וְ֠/הַ/צָּרַעַת זָרְחָ֨ה בְ/מִצְח֜/וֹ לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ בְּ/בֵ֣ית יְהוָ֔ה מֵ/עַ֖ל לְ/מִזְבַּ֥ח הַ/קְּטֹֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: zh_hans
  text: 乌西雅发怒了，手里拿着香炉，要烧香。他正向祭司们发怒时，皮肤病[a]突然出现在他的额头上，就在耶和华殿中、众祭司面前、香坛旁边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“麻风病”。希伯来词 צָרַעַת 所指范围更广，可以指皮肤病或使人在礼仪上不洁的皮肤病症，不一定是现代医学所说的麻风病（汉森病）。
    reason: 说明原词的语义范围，避免将古代病名与现代医学诊断简单等同。
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: 发怒了
  rationale: 表达动词的愤怒、恼怒之意，并以“了”自然呈现叙事中的起始变化，不夸大愤怒程度。
- source_word: מִקְטֶרֶת
  choice: 香炉
  rationale: 指用于焚香的器具；“香炉”是现代汉语中简洁、自然的礼仪用语。
- source_word: לְהַקְטִיר
  choice: 要烧香
  rationale: 保留不定式的目的含义，也直接表达礼仪动作。
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: 他正向祭司们发怒时
  rationale: 将介词结构理解为伴随下一事件的时间情境；“向”保留怒气针对祭司们的含义。
- source_word: הַצָּרַעַת
  choice: 严重的皮肤病
  rationale: צָרַעַת的范围比现代医学所说的麻风病更广；此译法避免武断诊断，同时表达这种病症的严重性。
- source_word: זָרְחָה
  choice: 突然出现在
  rationale: 该词本义有“发出、显现”之意；在皮肤病出现在额头的语境中，“突然出现”自然传达其骤然显露。
- source_word: בְמִצְחוֹ
  choice: 在他的额头上
  rationale: 准确表达病症显现在额头部位。
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: 众祭司面前
  rationale: 既可表达空间上的“在……面前”，也自然包含祭司亲眼看见这一事件的意味。
- source_word: בְּבֵית יְהוָה
  choice: 在耶和华殿中
  rationale: בַּיִת在此指圣殿；“耶和华殿”在中文中自然，并保留神的专名。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的标准音译，保留其作为神专名的性质。
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: 香坛旁边
  rationale: 该压缩的介词组合在此用于定位；“旁边”清楚表达事件发生在香坛近旁，而不强行限定移动来源。
theological_decisions:
- issue: צָרַעַת的译法
  choice: 严重的皮肤病
  alternative: 麻风病
  rationale: 希伯来词可指多种造成礼仪不洁的严重皮肤病症，不必等同于现代医学的汉森病；正文采用较宽泛的译法，并用脚注保留传统译名。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 二者都是对四字神名的音译；采用现代简体中文读者最熟悉且庄重的“耶和华”，而不以“主”这一称号替代专名。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“耶和华殿”“香坛”保留圣殿礼仪语境；句序略作汉语化处理，同时保留事件发生地点的三个层次：殿中、祭司面前、香坛旁边。
