base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/002.yaml
  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
translation:
  language: zh_hans
  text: 王与列祖同睡之后[b]，他修建了以禄，使它重归犹大[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使它归回犹大”。
    reason: lexical_alternative
  - marker: b
    text: “与列祖同睡”是希伯来语表示死亡的委婉说法。
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: 修建
  rationale: 该动词基本义为“建造”。用于已有名称的城邑时，“修建”既保留原文未明确说明“重建”的含义，又比单说“建造”更符合现代汉语。
- source_word: אֵילוֹת
  choice: 以禄
  rationale: 按圣经地名的通行汉语音译处理；不以现代地名形式取代原文的古代名称。
- source_word: וַיְשִׁיבֶהָ
  choice: 使它重归
  rationale: שוב的使役形带阴性单数宾语后缀，指以禄；此处表达使该城重新归于犹大控制。“使它重归”保留使役和恢复归属两层意思。
- source_word: לִיהוּדָה
  choice: 犹大
  rationale: 介词ל指归属或趋向；与“重归”搭配时，现代汉语无需另译“给/到”，仍清楚表达归还犹大。
- source_word: אַחֲרֵי שְׁכַב
  choice: 在……同睡之后
  rationale: 保留王室讣告中以“睡”婉指死亡的希伯来表达，而不直接释为“死后”。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文只称“王”，没有写出亚玛谢的名字，因此不在正文中补名。
- source_word: עִם אֲבֹתָיו
  choice: 与列祖同睡
  rationale: 这是希伯来语固定的死亡委婉语。“列祖”比现代汉语的“父亲们”更准确地表达祖先群体，同时保留传统公式的庄重感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。正文保留原文的死亡委婉语及“王”这一称谓，并用脚注解释文化习语和“使其归回”的词义选择。
