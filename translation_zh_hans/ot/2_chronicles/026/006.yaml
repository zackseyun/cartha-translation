  naturalness: 修订后“他出去攻打非利士人”自然、庄重且符合现代标准汉语。“非利士人当中”比“非利士人中间”稍自然；其余逐一列举三处城墙的表达清楚。
  terminology: “非利士人”“迦特”“雅比尼”“亚实突”和“城邑”均适合中文圣经历史叙事语体。关于亚实突，正文不预先限定为行政意义的“境内”，脚注说明其可指城或相关地区，以保留原文的指称弹性。
