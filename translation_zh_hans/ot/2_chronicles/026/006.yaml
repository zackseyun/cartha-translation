base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: zh_hans
  text: 他出去攻打非利士人，攻破了迦特的城墙、雅比尼的城墙和亚实突的城墙[a]；又在亚实突和非利士人当中建造城邑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “攻破”也可译作“冲破”或“拆毁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 他出兵
  rationale: 原义为“他出去”；因下文紧接“攻打”，译作“出兵”符合现代汉语叙事，同时没有额外说明军队规模或行动方式。
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: 攻打非利士人
  rationale: נלחם 表示作战、争战；介词在此表达敌对对象。“攻打”自然地传达军事行动及其对象。
- source_word: וַיִּפְרֹץ
  choice: 拆毁
  rationale: פרץ 以城墙为宾语时可指冲破、攻破或拆毁。上下文列举三城的城墙，“拆毁”简明自然；脚注保留“攻破”的可能。
- source_word: חוֹמַת גַּת וְאֵת חוֹמַת יַבְנֵה וְאֵת חוֹמַת אַשְׁדּוֹד
  choice: 迦特的城墙、雅比尼的城墙和亚实突的城墙
  rationale: 希伯来文分别以单数“城墙”搭配三座城，译文保留逐项列举，避免笼统化。
- source_word: גַּת
  choice: 迦特
  rationale: 采用现代中文圣经中通行的希伯来地名译法。
- source_word: יַבְנֵה
  choice: 雅比尼
  rationale: 依希伯来文地名音译，并采用中文圣经中的通行形式，不采用源于后期希腊传统的名称。
- source_word: אַשְׁדּוֹד
  choice: 亚实突
  rationale: 采用现代中文圣经中通行的地名译法。
- source_word: וַיִּבְנֶה עָרִים
  choice: 建造城邑
  rationale: בנה 是“建造”，经文没有明说是“重建”；עָרִים 为复数，故译作“城邑”。
- source_word: בְּאַשְׁדּוֹד
  choice: 在亚实突境内
  rationale: 若仅译“在亚实突”，容易让人误以为在一座城内另建多座城；“境内”可表达亚实突所属地区，但脚注保留其可能指城本身或周边地域的歧义。
- source_word: וּבַפְּלִשְׁתִּים
  choice: 以及非利士人中间
  rationale: 原文使用族群名称而非地名“非利士地”；“非利士人中间”保留这一表达。
