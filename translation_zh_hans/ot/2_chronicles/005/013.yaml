  to: 当吹号的和歌唱的如同一人[a]，发出同一个声音赞美、称谢雅威；他们用号、钹和奏乐的器具扬起声音，并赞美雅威[b]：“他本为善，他的慈爱[c]永远长存！”那殿，就是雅威的殿，满了云彩。
