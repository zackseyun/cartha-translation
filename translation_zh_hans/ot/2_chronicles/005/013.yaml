source:
  edition: WLC
  text: וַ/יְהִ֣י כְ֠/אֶחָד ל/מחצצרים וְ/לַ/מְשֹֽׁרֲרִ֜ים לְ/הַשְׁמִ֣יעַ קוֹל אֶחָ֗ד לְ/הַלֵּ֣ל וּ/לְ/הֹדוֹת֮ לַ/יהוָה֒ וּ/כְ/הָרִ֣ים ק֠וֹל בַּ/חֲצֹצְר֨וֹת וּ/בִ/מְצִלְתַּ֜יִם וּ/בִ/כְלֵ֣י הַ/שִּׁ֗יר וּ/בְ/הַלֵּ֤ל לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּ֑/וֹ וְ/הַ/בַּ֛יִת מָלֵ֥א עָנָ֖ן בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: zh_hans
  text: 当吹号的和歌唱的如同一人[a]，发出同一个声音赞美、称谢雅威；他们用号、钹和奏乐的器具扬起声音，并赞美雅威[b]：“他本为善，他的慈爱[c]永远长存！”那殿，就是雅威的殿，满了云彩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如同一人”也可译作“同心合一”或“一齐”。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明确的“说”；这里用冒号引出他们赞美的内容。
    reason: source_ambiguity
  - marker: c
    text: “慈爱”所译的希伯来词是 hesed，常包含忠贞、信实和守约之爱的意味，也可译作“怜悯”或“忠贞的爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֶחָד
  choice: 如同一人
  rationale: 保留“一”的形象，并与下文“同一个声音”呼应；所强调的是合一协调，而不只是同时行动。
- source_word: לְהַשְׁמִיעַ קוֹל אֶחָד
  choice: 发出同一个声音
  rationale: 贴近希伯来文具体的听觉表达，同时在现代汉语中自然清楚。
- source_word: לְהַלֵּל וּלְהוֹדוֹת
  choice: 赞美、称谢
  rationale: 分别保留两个不定式的意义；“称谢”兼有感谢和颂赞意味，适合礼仪语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现经文中的神圣名字，而不将其替换为称号“主”。
- source_word: בַחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  choice: 用号、钹和奏乐的器具
  rationale: “号”和“钹”对应具体乐器；“奏乐的器具”保留 כלי השיר 的功能性表达，不武断限定其他乐器种类。
- source_word: כִּי טוֹב כִּי לְעוֹלָם חַסְדּוֹ
  choice: 他本为善，他的慈爱永远长存
  rationale: 保留重复的 כִּי 和熟知的礼仪宣告；“慈爱”在简体中文圣经语体中自然，并能涵盖恩慈、忠贞和盟约信实。
- source_word: וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה
  choice: 那殿，就是雅威的殿，充满了云
  rationale: 保留“殿／房屋”的同位重复及其强调作用；“云”按原文不定表达，不添加“荣耀”等解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译能区别神的名字与称号，并避免把源文本身未作的替换带入正文。
- issue: חֶסֶד 的语义范围
  choice: 慈爱
  alternative: 怜悯；忠贞的爱；信实之爱
  rationale: “慈爱”简明、庄重且为普通中文读者所熟悉，同时不把该词仅缩减为情感或怜悯；脚注说明其忠贞、守约的内涵。
- issue: 引入赞歌是否补出“说”
  choice: 用冒号直接引出赞歌，不补“说”
  alternative: 赞美雅威，说
  rationale: 希伯来文没有明确的“说”；冒号能在中文中自然引出赞歌内容，又不增加原文未明说的动词。
- issue: 殿中之云的性质
  choice: 仅译作“云”
  alternative: 荣耀的云；雅威荣耀的云
  rationale: 本节只说“云”；其神学含义由上下文呈现，不在本节正文中补足解释。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话书面语。长句依照原文的礼仪性推进组织，但用逗号和冒号理清层次；保留“如同一人／同一个声音”和“那殿，就是雅威的殿”的重复与强调，不使用古奥的“事就这样成了”等句式。
