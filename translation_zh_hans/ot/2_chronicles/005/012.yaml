base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: zh_hans
  text: 所有歌唱的利未人，就是亚萨、希幔、耶杜顿，以及他们的儿子和弟兄，都身穿细麻布衣服，手持钹、竖琴和里拉琴[a]，站在祭坛东边[b]；与他们同在的，还有一百二十名吹号的祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文列出两种古代弦乐器；其具体形制及彼此区别难以确定。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“站在祭坛以东”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: 歌唱的利未人
  rationale: 分词作限定语，说明这些利未人的职分；采用简洁自然的现代汉语表达。
- source_word: לְכֻלָּם
  choice: 所有……都
  rationale: 用总括结构保留“全体”的强调，并使后续名单自然嵌入句中。
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: 亚萨、希幔、耶杜顿
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: 以及他们的儿子和弟兄
  rationale: 保留原文的亲属称谓；在本处也可能涵盖同族或同职分的男性成员，但正文不将其解释性改写。
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: 身穿细麻布衣服
  rationale: 准确表达被动状态及衣料；“细麻布”体现该词在礼仪和尊贵场合中的用法。
- source_word: בִּמְצִלְתַּיִם
  choice: 拿着钹
  rationale: 钹是该古代打击乐器的通行对应词；“拿着”使汉语器乐列举自然。
- source_word: וּבִנְבָלִים וְכִנֹּרוֹת
  choice: 琴瑟
  rationale: 以中文传统的成对弦乐器名称顺畅表达两类古代弦乐器，同时用脚注说明其精确形制和对应关系不确定。
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: 站在祭坛东边
  rationale: 自然表达方位关系；原短语也可理解为“在祭坛以东”，故保留脚注。
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים
  choice: 与他们同在的，还有一百二十名……祭司
  rationale: 补出汉语所需的存在结构，忠实呈现祭司与利未歌唱者同在。
- source_word: מחצררים בַּחֲצֹצְרוֹת
  choice: 吹号的
  rationale: 根据辅音文本及语境理解为分词“吹号”，并以定语修饰祭司。
