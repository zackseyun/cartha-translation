  terminology: 人名“亚萨、希幔、耶杜顿”、群体称谓“利未人”、礼仪用语“祭坛”“祭司”和衣料“细麻布”均可保留。“竖琴”和“里拉琴”暂作两个古代弦乐器的区分性译名，脚注说明其精确对应及形制未定。
