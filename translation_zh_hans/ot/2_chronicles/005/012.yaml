revisions:
- from: 所有歌唱的利未人，就是亚萨、希幔、耶杜顿，以及他们的儿子和弟兄，都身穿细麻布衣服，拿着钹、琴瑟[a]，站在祭坛东边[b]；与他们同在的，还有一百二十名吹号的祭司。
  to: 所有歌唱的利未人，就是亚萨、希幔、耶杜顿，以及他们的儿子和弟兄，都身穿细麻布衣服，手持钹、竖琴和里拉琴[a]，站在祭坛东边[b]；与他们同在的，还有一百二十名吹号的祭司。
  rationale: 仅修订乐器名称及相应脚注。“竖琴和里拉琴”依原文次序区分两种乐器，避免“琴瑟”的中国古典乐器联想；脚注保留学界对其精确形制和区分的疑问。其余措辞忠实、自然，无须改动。
