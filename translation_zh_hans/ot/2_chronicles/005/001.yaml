revisions:
- from: 这样，所罗门为雅威的殿所做的一切工程都完成了。随后，所罗门把他父亲大卫所献的圣物[a]，以及银子、金子和所有器具都带了进来，存放在神殿的库房里。
  to: 这样，所罗门为雅威的殿所做的一切工程都完成了。随后，所罗门把他父亲大卫的圣物[a]，以及银子、金子和所有器具带了进来，放在神殿的库房里。
  rationale: 修订将正文的“圣物”恢复为较贴近原文构词、并保留歧义的表达；奉献或分别为圣的解释置于脚注。另将末句动词衔接调整为更清楚的现代汉语，同时保留原文“带入”后“放入库房”的动作次序。
