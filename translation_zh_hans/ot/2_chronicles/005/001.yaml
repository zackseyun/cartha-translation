id: 2CH.5.1
reference: 2 Chronicles 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: zh_hans
  text: 这样，所罗门为雅威的殿所做的一切工程都完成了。随后，所罗门把他父亲大卫的圣物[a]，以及银子、金子和所有器具带了进来，放在神殿的库房里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他父亲大卫所奉献的物品”或“他父亲大卫分别为圣的物品”。
    reason: 原文 קָדְשֵׁי 可中性地指“大卫的圣物”，也可强调这些物品是奉献给神、分别为圣的。
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: 都完成了
  rationale: 此处 שלם 表示工程达到完成状态；“完成了”自然、准确，并保留结果意味。
- source_word: כָּל הַמְּלָאכָה
  choice: 一切工程
  rationale: מְלָאכָה 指建造并装备圣殿的整体工作；“工程”比泛指的“工作”更贴合此处语境。
- source_word: לְבֵית יְהוָה
  choice: 为雅威的殿
  rationale: 介词 לְ 表目的或关联；בַּיִת 在此明确指圣殿，译作“殿”既自然又保留“神的居所”意象；专名 יְהוָה 音译为“雅威”。
- source_word: וַיָּבֵא
  choice: 带了进来
  rationale: בוא 的使役式在此意为把物品带入圣殿范围，译文保留进入的方向意味。
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: 他父亲大卫所献的圣物
  rationale: קָדְשֵׁי 指分别归于神、供神圣用途的物品；“所献的圣物”兼顾其奉献来源和神圣性质。脚注保留更直译的可能。
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: 银子、金子
  rationale: 保持原文列举的节奏；现代汉语不必重复定指词。
- source_word: כָּל הַכֵּלִים
  choice: 所有器具
  rationale: כֵּלִים 是涵盖各类物件或用具的广义词；圣殿语境下“器具”庄重且不过度限定。
- source_word: נָתַן
  choice: 存放
  rationale: נתן 本义宽泛，可指放置；结合库房语境，“存放”自然表达将贵重物品置于库中的动作。
- source_word: בְּאֹצְרוֹת
  choice: 在……库房里
  rationale: אֹצָר 可指储藏贵重物品的库房；复数由“库房”这一可作集合或复数理解的形式自然承载。
- source_word: בֵּית הָאֱלֹהִים
  choice: 神殿
  rationale: 保留 אֱלֹהִים 与前文专名“雅威”的区别，同时用“殿”明确此处所指建筑；不将两处神称谓拉平。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，音译“雅威”直接呈现其专名性质，避免以称号替代。
- issue: 同节中 בֵּית יְהוָה 与 בֵּית הָאֱלֹהִים 的区别
  choice: 分别译作“雅威的殿”和“神殿”
  alternative: 两处都译作“圣殿”
  rationale: 原文先用神的专名，后用普通称谓“神”；译文保留这一有意义的变化，同时保持中文自然。
- issue: קָדְשֵׁי 的语义范围
  choice: 正文译“所献的圣物”，脚注说明其他可能
  alternative: 圣物；分别为圣之物
  rationale: 该词既可突出物品本身的神圣归属，也可突出其被奉献的状态；正文作自然的语境化表达，脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“殿”比“房屋”更符合普通读者对圣殿建筑的表达习惯；句法保留原文先总结工程完成、再叙述圣物入库的推进关系。
