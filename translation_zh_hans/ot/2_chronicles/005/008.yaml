base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: zh_hans
  text: 基路伯的翅膀展开在约柜所在之处的上方；基路伯从上方遮盖约柜和约柜的杠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基路伯伸展翅膀，覆盖约柜的地方；基路伯从上方遮盖约柜和它的杠。”
    reason: “约柜所在之处”对应希伯来文“约柜的地方”；此译法较贴近原文的名词结构，并保留“地方”与随后“约柜”之间的措辞区分。
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים
  choice: 张开
  rationale: היה与分词构成迂回表达，描写持续的姿态；现代汉语用“张开”自然表达当时展开翅膀的状态，无须另译“正”。
- source_word: הַכְּרוּבִים
  choice: 基路伯
  rationale: 采用中文圣经传统中对这种与上帝宝座和圣所相关之受造者的通行音译，避免使用容易引起现代形象联想的意译。
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: 张开翅膀
  rationale: פרשׂ表示伸展、铺开；“张开翅膀”符合现代汉语习惯，也保留其空间姿态。
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: 覆在约柜所在之处
  rationale: 保留מקום“地方、所在之处”的明确措辞，不把本句与下一分句直接提到约柜本身的表达合并。עַל在此按空间关系译为“覆在……之处”。
- source_word: וַיְכַסּוּ
  choice: 遮盖
  rationale: כסה的基本义为覆盖、遮盖；“遮盖”既直接，又不加入“荫庇”等解释性含义。
- source_word: עַל הָאָרוֹן וְעַל בַּדָּיו
  choice: 约柜和抬柜的杠
  rationale: בדים指搬运约柜所用的杠；补出“抬柜的”使现代读者易懂，同时不改变所指。
- source_word: מִלְמָעְלָה
  choice: 从上方
  rationale: 准确表达מן前缀所带的方向或位置意味，说明基路伯是在约柜及其杠的上方形成遮盖。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“约柜”“基路伯”沿用通行圣经术语；“抬柜的杠”比“杠杆”或古雅的“杠木”更易懂。正文中的脚注标记与脚注相对应。
