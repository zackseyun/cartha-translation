  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: zh_hans
  text: 祭司把雅威的约柜抬到它的位置，就是殿的内殿，即至圣所，在基路伯的翅膀下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: 抬到
  rationale: 该词是בוא的使役式，意为“带来、送入”。结合约柜需要搬抬的语境，“抬到”在中文中自然，也不超出叙事所表达的移动动作。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 准确对应带定冠词的复数名词，明确执行搬运的是祭司。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: 采用现代中文圣经语境中通顺而明确的表达；“约柜”保留בְּרִית的立约含义，“雅威的”对应原文构造链末尾的神名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译直接呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: מְקוֹמוֹ
  choice: 安放它的地方
  rationale: 字面为“它的地方”。中文补出“安放”可清楚表达约柜预定的安置处，同时不加入“永久”或“合宜”等原文未明说的限定。
- source_word: דְּבִיר הַבַּיִת
  choice: 殿的内殿
  rationale: דְּבִיר指圣殿最里面的房间；“内殿”简洁保留其空间和礼仪含义。此处בַּיִת按上下文自然译作“殿”，避免“房屋”造成误解。
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: 至圣所
  rationale: 这是希伯来语以重复构造表达最高级的说法，指圣殿中最神圣的区域；“至圣所”是清楚、庄重且广为理解的现代中文名称。
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: 在基路伯的翅膀下
  rationale: 直接保留“在……下面”和“翅膀”的空间意象；כְּרוּבִים采用通行音译“基路伯”，不擅自解释这些受造物的具体类别。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可让读者看出这里是专名，而不是普通称号；“耶和华”是传统音译，“主”则会隐藏原文专名。
- issue: קֹדֶשׁ הַקְּדָשִׁים的表达
  choice: 至圣所
  alternative: 圣中之圣
  rationale: 原文形式可直译为“圣中之圣”，具有最高级含义。“至圣所”既传达这一含义，也明确指出这里是圣殿内的处所；脚注保留其字面形式。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“就是”表明“殿的内殿”与“至圣所”是同一地点的重述；使用“殿”而非机械直译“房屋”，符合本节圣殿语境。
