base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: zh_hans
  text: 他们把约柜、会幕和会幕里所有的圣器具运了上去；利未人的祭司[a]把这些物件运了上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“祭司，利未人”。
    reason: 保留希伯来文并置／同位结构；此处可理解为利未人中的祭司，而非泛指所有利未人都是祭司。
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: 抬了上去
  rationale: עלה的使役式在这里指把圣物运送到较高处。“抬上去”既保留方向意味，也符合搬运约柜、会幕和器具的场景；两处采用相同译法，以保留原文的重复。
- source_word: הָאָרוֹן
  choice: 约柜
  rationale: 原文只作“柜”，但本段语境明确指耶和华的约柜；现代汉语圣经语境中“约柜”简洁清楚，不必扩展为“耶和华的约柜”。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该固定词组在现代汉语中的通行表达，指作为相会之处的帐幕；比逐字译作“会见的帐棚”自然凝练。
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: 所有的圣器具
  rationale: כְּלִים可泛指器皿、用具或物件；“圣器具”既保留其广义，又清楚表达这些器具分别为圣的性质。
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: 会幕里
  rationale: 关系从句说明圣器具所在之处。汉语采用前置修饰“会幕里所有的圣器具”，比逐字后置更自然，并与前文“会幕”保持一致。
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: 利未支派的祭司
  rationale: 原文两个带定冠词的名词并置，直译为“祭司，利未人”。“利未支派的祭司”在汉语中自然地表达同位限定，也避免让人误以为所有利未人都是祭司；脚注保留原文较直接的形式。
theological_decisions:
- issue: הַכֹּהֲנִים הַלְוִיִּם中祭司与利未人的关系
  choice: 利未支派的祭司
  alternative: 祭司，就是利未人；或：祭司和利未人
  rationale: 希伯来文没有连接词，较自然地可把“利未人”理解为对“祭司”的同位说明，而不是两个并列群体。正文采用清楚而不混淆职分的表达，脚注列出原文直译，以保留其句法张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他们”保留首个动词未明说主语的形式；分号及后半句的重复对应希伯来文再次陈述搬运者的强调。
