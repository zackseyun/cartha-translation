  text: וַ/יָּבֹ֕אוּ כֹּ֖ל זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הַ/לְוִיִּ֖ם אֶת הָ/אָרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/004.yaml
  text: And all the elders of Israel came[a], and the Levites carried the ark.
translation:
  language: zh_hans
  text: 以色列的众长老都来了，利未人就抬那柜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即约柜；上下文清楚表明这里所指的是约柜。
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来了
  rationale: 该叙事形式推进事件次序；“来了”在现代汉语叙事中自然准确，也保留了朝向当前场景而来的意味。
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的众长老都
  rationale: “众长老”表达以色列公认的领袖群体，“都”明确保留 כֹּל 所表示的全体性。
- source_word: וַיִּשְׂאוּ
  choice: 就抬
  rationale: נשׂא 在这里指抬运柜；“抬”既能表达负载搬运，也符合多人搬运这一具体场景。“就”自然衔接接续发生的动作。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该支派及其礼仪职分群体在现代中文圣经语境中的标准称呼。
- source_word: אֶת הָאָרוֹן
  choice: 那柜
  rationale: 原文只说带定冠词的“柜”，没有在本节明说“约柜”。“那柜”在中文中体现特指，并避免把上下文已明确但本节未写出的“约”加入正文。
theological_decisions:
- issue: “柜”的具体身份
  choice: 正文译作“那柜”，脚注说明所指为约柜
  alternative: 正文直接译作“约柜”
  rationale: 本节希伯来文只有 הָאָרוֹן（“那柜”），而上下文清楚说明它是约柜。正文保留原文的简略表达，脚注则帮助读者确认所指，既不模糊语境，也不把本节未明说的成分加入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“众长老都来了”顺应中文语序；“抬那柜”简洁地呈现礼仪搬运场景。脚注标记紧接其所解释的“那柜”，避免英文资料中标记位置与注释对象不一致的问题。
