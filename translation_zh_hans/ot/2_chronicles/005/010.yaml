  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֚ק שְׁנֵ֣י הַ/לֻּח֔וֹת אֲשֶׁר נָתַ֥ן מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: zh_hans
  text: 约柜里除了两块版以外，什么也没有；这两块版是摩西在何烈山放入约柜里的[a]。耶和华曾在那里与以色列人[b]立约，那时他们从埃及出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放入约柜里”：希伯来语直译为“给”；这里指摩西把两块版放入约柜。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: 约柜里除了……以外，什么也没有
  rationale: 以现代汉语自然的“除了……以外，什么也没有”表达希伯来语存在否定 אֵין 与限制词 רַק 的组合，同时保留约柜中仅有两块版的强调。
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: 两块版
  rationale: לֻחוֹת 指书写用的版；本节没有明说材质，因此正文不增添“石”字。量词“块”符合现代汉语习惯。
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: 是摩西……放在里面的
  rationale: נָתַן 的基本义是“给”，但在此处指把两块版安放在约柜里；“放在里面”既自然，又明确承接前文的约柜。
- source_word: בְּחֹרֵב
  choice: 在何烈山
  rationale: 保留希伯来文本的地名“何烈”，不与“西奈”协调替换；汉语按传统和语境补出“山”。
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: 耶和华曾在那里与……立约
  rationale: כָּרַת 与语境中省略的“约”构成“立约”的惯用表达。将关系词理解为回指何烈山，并用“在那里”自然呈现。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名 יהוה，而不改写为称号“主”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在这里是对以色列群体的统称；“以色列人”是准确自然的现代汉语。
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: 那时他们正从埃及出来
  rationale: 用时间从句表达介词 בְּ 加不定式结构；“正从埃及出来”保留出埃及事件发生之际的时间关系。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留这是神的专名，而非以“主”代替；采用现代中文圣经传统中辨识度最高的“耶和华”，不借此解决其古代发音问题。
- issue: 第二个 אֲשֶׁר 的关系指向及省略的“约”
  choice: 理解为回指何烈山，并译作“耶和华曾在那里……立约”
  alternative: 将关系词紧接“两块版”，译成与版有关的关系从句
  rationale: “与以色列人立约”在语义上最自然地指发生于何烈山的事件；希伯来语虽未在此明写 בְּרִית（约），但 כָּרַת 与 עִם 在该语境中要求补出“立约”才符合汉语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“约柜”“何烈山”“立约”等沿用读者熟悉且准确的圣经用语；分成两句并使用分号，以免多个关系从句造成歧义。所有脚注标记均按正文出现顺序排列。
