  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: zh_hans
  text: 那时，所罗门把以色列的长老和各支派的首领——以色列子孙各父家的领袖——召集到耶路撒冷，要把雅威的约柜从大卫城，就是锡安，运上来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为叙事推进的时间标记，既自然又保留“随后、当时”的语义。
- source_word: יַקְהֵיל
  choice: 召集
  rationale: 使役形表达“使众人聚集”；“召集”清楚体现所罗门主动召聚领袖。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老
  rationale: 保留这一正式领导群体的传统称谓。
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: 各支派所有的首领
  rationale: מַטּוֹת在此指以色列的支派；רָאשֵׁי按领导职分译为“首领”。
- source_word: נְשִׂיאֵי הָאָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: 以色列子孙各父家的族长
  rationale: 保留“以色列子孙”的宗族与盟约身份，也以“父家”反映父系宗族结构；“族长”自然表达נְשִׂיאֵי的领导身份。
- source_word: אֶל יְרוּשָׁלִָם
  choice: 到耶路撒冷
  rationale: 介词אֶל表示召集所至的地点，现代汉语用“到”自然明确。
- source_word: לְהַעֲלוֹת
  choice: 运上来
  rationale: 保留עלה的上行方向，并表达搬运约柜这一实际行动。
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: 雅威的约柜
  rationale: “约柜”是自然且固定的汉语圣经用语，表达这是属于雅威之约的柜。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译神的盟约之名，不以称号替代专名。
- source_word: מֵעִיר דָּוִיד
  choice: 从大卫城
  rationale: 直接保留地名式表达和起点含义。
- source_word: הִיא צִיּוֹן
  choice: 也就是锡安
  rationale: 将该短语理解为同位说明，指出此处的大卫城就是锡安。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文明确使用四字神名；“雅威”较直接地呈现该专名，避免用“主”等称号取代。
- issue: לִבְנֵי יִשְׂרָאֵל与הָאָבוֹת所表达的宗族结构
  choice: 以色列子孙各父家
  alternative: 以色列人的各家族
  rationale: 本节列举正式的支派和父系宗族领袖；保留“子孙”和“父家”可呈现原文的谱系与群体结构，而不将其泛化为普通家庭。
- issue: “支派首领”与“父家族长”的句法关系
  choice: 以“也就是”表达同位说明
  alternative: 将两者视为并列的不同群体
  rationale: 希伯来语中后一个名词短语最自然地进一步说明“各支派所有的首领”；译文保留这种理解，同时不加入原文没有的额外群体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体；保留“长老、支派、父家、约柜”等承载古代以色列制度与盟约背景的关键词，避免过度口语化或教派化表达。
