  to: 那时，所罗门把以色列的长老和各支派的首领——以色列子孙各父家的领袖——召集到耶路撒冷，要把雅威的约柜从大卫城，就是锡安，运上来。
  rationale: 修订仅改善汉语行文，并以较中性的同位结构呈现“支派首领”与“父家领袖”的关联；不改变原文所述人物、地点、神名或行动的含义。“运上来”保留עלה在约柜移运语境中的上行意象。
