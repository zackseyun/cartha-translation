base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: zh_hans
  text: 祭司因云彩不能站立供职，因为雅威的荣耀充满了神的殿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“神的家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: 不能
  rationale: 该动词表示能力；与否定词连用，译为“不能”，自然准确。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 明确的复数名词，指在圣殿中供职的祭司。汉语无需另加复数标记。
- source_word: לַעֲמוֹד
  choice: 站立
  rationale: 保留 עמד 的具体意象；在本语境中也可含有站着履行职务之意，但不在正文中过度解释。
- source_word: לְשָׁרֵת
  choice: 供职
  rationale: שרת 在祭司和圣所语境中指礼仪性服事；“供职”既体现正式职分，也符合现代汉语表达。
- source_word: מִפְּנֵי הֶעָנָן
  choice: 因云彩
  rationale: מִפְּנֵי 在此表达原因；简洁译为“因”，并保留“云彩”这一可见现象。
- source_word: כִּי
  choice: 因为
  rationale: 引出祭司不能站立供职的解释或原因；“因为”清楚保留逻辑关系。
- source_word: מָלֵא
  choice: 充满了
  rationale: 叙事语境中的完成式，译为“充满了”符合现代汉语，并体现已经发生的状态。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: 按构词关系译出“雅威的荣耀”，保留神名及原文结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: בֵּית הָאֱלֹהִים
  choice: 神的殿
  rationale: 字面为“神的家／房屋”，本处所指为圣殿；正文用“神的殿”自然明确，脚注保留字面表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名；“雅威”较贴近通常重构的读音，也避免把专名无提示地改为称号。
- issue: 云彩与荣耀之间的关系
  choice: 按原文以“因为”连接，不进一步解释二者是否等同
  alternative: 将云彩直接解释为雅威荣耀的显现
  rationale: 原文说明祭司因云彩不能供职，并以雅威的荣耀充满殿作为理由；译文保留这种关联而不添加神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“站立供职”保留原文具体动作及祭司礼仪职分；句式紧凑，适合经文宣读。脚注标记置于其实际说明的“神的殿”之后。
