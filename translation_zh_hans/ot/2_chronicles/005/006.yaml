base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: zh_hans
  text: 所罗门王和聚集到他那里的以色列全体会众[a]，都在约柜前献上羊群[b]和牛群为祭；牲畜多得无法点数，也无法计算。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集到他那里”也可译作“同他聚集”或“聚集在他面前”。这里的希伯来语短语可指会众来到所罗门那里与他一同聚集，也可指他们聚集在他面前。
    reason: lexical_alternative
  - marker: b
    text: “羊群”所译的希伯来语范围较广，可包括绵羊和山羊等小型牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: 以色列全体会众
  rationale: עֵדָה指作为共同体聚集起来的民众。“全体会众”既体现其整体性，也符合现代汉语的庄重叙事语体。
- source_word: הַנּוֹעָדִים
  choice: 聚集……的人
  rationale: 该词为יעד的Niphal分词，在此描述已经集合、正在场的群体；“聚集……的人”自然表达这一附加说明。
- source_word: עָלָיו
  choice: 在他身边
  rationale: עַל在此可表示会众以所罗门为聚集中心，与他同在或来到他那里。“在他身边”保留空间关系，同时不把含义过度限定为站在他面前。
- source_word: לִפְנֵי הָאָרוֹן
  choice: 在约柜前
  rationale: 这是直接的空间表达；“在约柜前”在现代汉语中清楚自然，也符合庄重语体。
- source_word: מְזַבְּחִים
  choice: 献上……为祭
  rationale: 分词呈现当时正在进行的献祭行动。“献上……为祭”明确表达祭祀含义，又避免生硬的直译。
- source_word: צֹאן וּבָקָר
  choice: 羊群和牛群
  rationale: צֹאן泛指绵羊、山羊等小型牲畜，בָּקָר指牛类。“羊群和牛群”保持原文次序及群体含义；脚注说明前者的范围。
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: 无法点数，也无法计算
  rationale: 原文用两个近义动词加强语气。译文保留两个对应表达，不将其压缩为单一的“数不清”。
- source_word: מֵרֹב
  choice: 多得
  rationale: מֵרֹב说明不能数算的原因，即数量极多。“多得……”以自然简洁的汉语表达该因果关系。
theological_decisions:
- issue: 会众与所罗门之间的关系（עָלָיו）
  choice: 聚集在他身边
  alternative: 聚集到他那里；聚集在他面前
  rationale: 该介词短语可理解为会众来到所罗门那里、与他聚集，或在他面前聚集。正文采用不限定具体朝向的“在他身边”，并以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“全体会众”“在约柜前”“献上……为祭”保持经文场景的礼仪性；用分号区分献祭行动与牲畜数量的补充说明，使长句清晰。
