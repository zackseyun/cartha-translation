base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: zh_hans
  text: 他们把约柜的杠拉长了，以致在内殿前可以看见从约柜伸出的杠头，但从外面却看不见；这些杠直到今日还在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内殿”或译“至圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: 他们把杠抬长
  rationale: 希伯来语为使役式，表示使杠变长或向外伸展；“把杠抬长”保留使役含义，同时不限定具体操作方式。
- source_word: הַבַּדִּים
  choice: 杠
  rationale: 指抬约柜所用的杠；“杠”简洁、现代，也符合圣所器具的语境。
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: 杠头……可以看见
  rationale: רָאשֵׁי直译为“头”，在此指杠的端头；译作“杠头”既保留原文形象，又符合现代汉语。被动形式按汉语习惯译为“可以看见”。
- source_word: מִן הָאָרוֹן
  choice: 从约柜那里伸到
  rationale: מִן表示起点；加入“伸到”使空间关系在汉语中清楚，同时保留杠从约柜处向外延伸之意。
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: 内殿前
  rationale: דְּבִיר指圣殿最里面的圣所；“内殿”是清楚而庄重的建筑用语，עַל פְּנֵי在此按空间关系译为“前”。
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: 但从外面却看不见
  rationale: 保留内侧可见、外侧不可见的对照，并采用自然的现代汉语表达。
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: 这些杠直到今日还在那里
  rationale: 原文动词虽为单数，但此处可作存在性表达，所指为杠；“直到今日还在那里”准确表达从叙事事件持续至作者当时。
theological_decisions:
- issue: הַדְּבִיר所指空间的译法
  choice: 内殿
  alternative: 至圣所
  rationale: “内殿”较直接保留建筑空间称谓，不预先把术语解释为其礼仪名称；另译见脚注，以保留语义可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬长”保留使役语气；句法稍作调整，以清楚呈现杠从约柜处伸至内殿前、在那里可见而从外面不可见的空间关系。
