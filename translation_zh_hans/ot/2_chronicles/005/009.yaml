  source_fidelity: 草稿将使役动词译为“把杠抬长”，但“抬长”在现代汉语中通常指抬高，而非拉长、延长，未准确表达原文使其变长／向外拉出的意思。并且“杠头从约柜那里伸到内殿前”把可见的位置和杠的延伸方向混合，易读成杠实际伸至内殿前。
