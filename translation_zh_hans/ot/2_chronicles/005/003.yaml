  yaml_path: translation/ot/2_chronicles/005/003.yaml
  text: And all the men of Israel assembled before the king at the feast, that is, in the seventh month.
translation:
  language: zh_hans
  text: 以色列众人都在节期聚集到王那里；这节期就是第七个月。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 希伯来语直译为“以色列的每一个人/男子”，在这里是集合性表达；译作“以色列众人”自然、准确，也不把所指范围不必要地限定为男性。
- source_word: אֶל הַמֶּלֶךְ
  choice: 到王那里
  rationale: 介词 אֶל 表示聚集所朝向的对象；“到王那里”比“在王面前”更直接体现方向。
- source_word: בֶּחָג
  choice: 在节期
  rationale: חָג 指宗教节期；原文未在本节明说具体节名，因此正文保留概称，不从上下文补入“住棚节”。
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 这节期是在七月
  rationale: 原文以代词 הוּא 将“节期”与“第七月”相联，表达简略。分句处理既保留这种说明关系，又符合现代汉语习惯。
theological_decisions:
- issue: 是否明确节期名称
  choice: 仅译作“节期”
  alternative: 译作“住棚节”
  rationale: 上下文及历法背景可指向住棚节，但本节原文本身只写 חָג“节期”；不在正文中补入未明说的名称，以免消除原文的简略性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“七月”按希伯来历法语境理解；本节不另加解释性脚注。
