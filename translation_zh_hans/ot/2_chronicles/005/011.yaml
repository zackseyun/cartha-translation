  to: 祭司从圣所出来的时候——因为所有在场的祭司都已经分别为圣，并不按班次[a]——
  rationale: 修订仅收紧礼仪预备的译法：以“已经分别为圣”对应原文单一的自我祝圣动词，不添加“洁净”的独立动作；并将“不拘班次”改为“并不按班次”，使通常祭司班次未被遵守的含义更清楚。保留原有破折号，以反映本节句法继续至下一节。
