  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: zh_hans
  text: 祭司从圣所出来的时候——因为所有在场的祭司都已经分别为圣，并不按班次[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不按班次供职”，意思是这次没有遵守祭司通常的轮班制度。
    reason: 说明原文凝缩表达的另一种译法及“班次”的制度含义。
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: ……出来的时候
  rationale: וַיְהִי承接叙事，ב加不定式构成时间从句；合译为“……出来的时候”，既自然，也保留原文尚未完结的时间铺垫。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כהנים在圣殿语境中的标准对应词。
- source_word: מִן הַקֹּדֶשׁ
  choice: 从圣所
  rationale: הַקֹּדֶשׁ在此指圣殿中的神圣区域；“圣所”准确而简洁，不将其误解为抽象的“圣洁”。
- source_word: כִּי
  choice: 原来
  rationale: 此处引出对当时情形的补充说明；“原来”能自然表达解释作用，同时适合破折号内的插入语。
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: 所有在场的祭司
  rationale: הַנִּמְצְאִים在此指当时在场或可到场的人；“在场”比直译“被找到的”更符合现代汉语。
- source_word: הִתְקַדָּשׁוּ
  choice: 已经洁净自己，使自己成圣
  rationale: קדש的Hitpael形式表示为礼仪事奉而使自己成为圣洁、合宜；此译明确其自我预备的动作，又避免只用“成圣”可能引起的抽象教义联想。
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: 不拘班次
  rationale: 原文大意是“不按班次遵守/行事”；“不拘班次”简洁地表达这次没有受祭司通常轮班安排限制，同时以脚注说明较直译的理解。
theological_decisions:
- issue: 祭司礼仪预备的用语
  choice: 洁净自己，使自己成圣
  alternative: 使自己分别为圣
  rationale: 上下文所说的是圣殿事奉前的礼仪预备，并非专门陈述后世系统神学中的道德成圣；所选译法保留“圣”的词义，也交代其礼仪性质。
- issue: 祭司班次是否照常执行
  choice: 不拘班次
  alternative: 不按班次供职
  rationale: אֵין לִשְׁמֹר לְמַחְלְקוֹת的表达较凝缩，重点在此次场合未受通常班次制度约束；正文不额外限定为某一种具体职责，脚注则说明其制度背景。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。破折号保留原文解释性插入语及句子向下一节延续的结构；“圣所”“祭司”“班次”保留圣殿语境所需的专门含义。
