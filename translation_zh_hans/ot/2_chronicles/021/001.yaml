base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: zh_hans
  text: 约沙法与列祖同眠[a]，葬在大卫城，与列祖同葬[b]。他的儿子约兰继位作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与列祖同眠”是希伯来语中表示去世的委婉说法；也可译作“去世”。
    reason: lexical_alternative
  - marker: b
    text: “与列祖同葬”对应希伯来语的惯用表达，指与祖先一同安葬。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同眠
  rationale: 此处属于王室去世记述的固定表达；“同眠”保留希伯来语以睡眠委婉指死亡的庄重语气，脚注说明其含义。
- source_word: עִם אֲבֹתָיו
  choice: 与列祖
  rationale: “列祖”自然承接圣经历史叙事中的宗族用语，也比逐字译作“与他的父亲们”更符合现代汉语。
- source_word: וַיִּקָּבֵר
  choice: 葬
  rationale: 简洁准确地表达被动意义；汉语无须机械添加“被”。
- source_word: בְּעִיר דָּוִיד
  choice: 在大卫城
  rationale: 采用通行且清楚的圣经地名形式。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位承继语境中自然表达מלך；与“接续他”连用，明确表示继位掌权。
- source_word: תַּחְתָּיו
  choice: 接续他
  rationale: 自然表达继承其位置的含义，避免“代替他”在中文中可能带出的对立意味。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: יְהוֹרָם
  choice: 约兰
  rationale: 采用现代中文圣经中对该人名的通行译法，并与此处较完整的希伯来语名字形式对应。
