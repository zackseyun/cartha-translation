  text: Jehoram was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: zh_hans
  text: 约兰登基的时候三十二岁，在耶路撒冷作王八年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: 三十二岁
  rationale: 这是希伯来语表达年龄的固定结构；现代汉语自然表达为“三十二岁”，不直译为“三十二岁之子”。
- source_word: יְהוֹרָם
  choice: 约兰
  rationale: 采用现代中文圣经中对该希伯来人名较通行的译名，并与本节较完整的希伯来语名称形式相对应。
- source_word: בְּמָלְכוֹ
  choice: 登基的时候
  rationale: 介词 בְּ 加带代词后缀的不定式结构在此表示即位的时间；“登基的时候”自然、简明地传达开始作王之意。
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: 八年
  rationale: 准确表达作王持续的时间。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词意为统治或为王；“作王”符合中文叙述君王在位年数的惯用表达。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 保留地点介词的含义，指出其作王所在的都城。
