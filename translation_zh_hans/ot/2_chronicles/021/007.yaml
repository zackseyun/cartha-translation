revisions:
- from: 然而，耶和华不愿毁灭大卫家，因为他与大卫所立的约，也因为他曾说，要赐给大卫和他的众子一盏永不熄灭的灯[a]。
  to: 然而，耶和华不愿毁灭大卫家，因为他与大卫所立的约；正如他所说的，他要赐给大卫和他的儿子们一盏灯，直到永远[a]。
  rationale: 修订将“正如他所说的”从因果并列中恢复出来，反映原文将不毁灭大卫家与大卫之约及耶和华先前所说的话相联系的句法。将“永不熄灭的灯”改为“灯，直到永远”，避免把“所有的日子”过度具象化，同时以脚注保留其字面表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:58Z'
review_pass:
  verdict: revise
  source_fidelity: “也因为他曾说”将 וְכַאֲשֶׁר אָמַר（“正如／照着他所说的”）误作与“因所立的约”平行的另一项原因，未准确呈现其作为神先前所说之话的对应关系。“永不熄灭”则把“所有日子”的时间表达具体化为灯的物理状态，并略加强了原文措辞。
  naturalness: 原译整体庄重通顺，但“因为他与大卫所立的约，也因为他曾说”在中文中结构不完整且逻辑关系不够清楚。修订后以分号和“正如他所说的”清晰呈现原文的并列关系。
  terminology: 保留“耶和华”“大卫家”“立约”“灯”等既准确又符合中文圣经语域的表达。“儿子们”对应原文复数“他的儿子们”，避免“众子”可能带来的额外数量强调。
  issues:
  - severity: medium
    issue: “也因为他曾说”误释连接语
    rationale: וְכַאֲשֶׁר אָמַר意为“正如／照着他所说的”，将耶和华不毁灭大卫家与其先前所说要赐灯的话相连；它不宜译成独立的“也因为”原因分句。
  - severity: medium
    issue: “永不熄灭”过度具体化时间短语
    rationale: כָּל הַיָּמִים字面为“所有的日子”，可在语境中理解为持续至永远；“永不熄灭”却将持续性明确表述为灯的熄灭与否。正文宜保留“灯”及时间表达，脚注说明字面语义与隐喻。
  revised_text: 然而，耶和华不愿毁灭大卫家，因为他与大卫所立的约；正如他所说的，他要赐给大卫和他的儿子们一盏灯，直到永远[a]。
