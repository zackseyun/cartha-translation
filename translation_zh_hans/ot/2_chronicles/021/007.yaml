  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: zh_hans
  text: 然而，耶和华不愿毁灭大卫家，因为他与大卫所立的约；正如他所说的，他要赐给大卫和他的儿子们一盏灯，直到永远[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到永远”直译为“所有的日子”。“灯”可能象征大卫的世系或王权得以延续。
    reason: 说明希伯来语时间表达及其王朝性隐喻；正文保留“灯”的比喻而不将其直接解释为王朝。
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: 然而……不愿
  rationale: אָבָה表达意愿或同意；“不愿”保留其意志色彩。“然而”按上下文体现轻微转折。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现以色列之神的名字，而非以称号代替。
- source_word: לְהַשְׁחִית
  choice: 毁灭
  rationale: 该词的使役形在此指使大卫家走向灭亡；“毁灭”准确而庄重。
- source_word: בֵּית דָּוִיד
  choice: 大卫家
  rationale: 保留希伯来语“家”的王朝性隐喻及其经文呼应，不直接解释成“大卫王朝”。
- source_word: לְמַעַן הַבְּרִית
  choice: 因为……约
  rationale: לְמַעַן在此说明耶和华不毁灭大卫家的原因；中文以“因为”自然表达。
- source_word: כָּרַת ... לְדָוִיד
  choice: 与大卫所立
  rationale: 希伯来语直译为“切约”，中文惯用“立约”；介词在此按盟约关系译为“与大卫”。
- source_word: וְכַאֲשֶׁר אָמַר
  choice: 也因为他曾说
  rationale: 保留“说”的原文措辞，不把它进一步解释为“应许”；结合汉语句法，表达为与前一原因并列。
- source_word: לָתֵת לוֹ נִיר וּלְבָנָיו
  choice: 要赐给大卫和他的众子一盏……灯
  rationale: נִיר保留为“灯”，维持王统延续的隐喻；将代词“大卫”明示以避免中文指代含混，并把大卫与众子呈现为共同领受者。
- source_word: כָּל הַיָּמִים
  choice: 永不熄灭
  rationale: 字面为“所有的日子”；结合“灯”的意象译成“永不熄灭”，自然传达持续不断之意，但不直接改写为抽象的“永远保全王朝”。
theological_decisions:
- issue: 大卫之约语境中 נִיר 的王朝隐喻
  choice: 一盏永不熄灭的灯
  alternative: 一盏灯，直到永远；长存的王朝
  rationale: 正文保留“灯”这一圣经隐喻，不直接释作“王朝”，从而保存其互文和神学张力；“永不熄灭”在中文中使“所有的日子”与灯的意象自然结合。
- issue: לוֹ וּלְבָנָיו 的受领者关系
  choice: 赐给大卫和他的众子一盏灯
  alternative: 赐给他一盏灯，也赐给他的众子
  rationale: 希伯来语可自然理解为大卫及其众子共同领受这一“灯”；正文采用流畅中文，同时不进一步界定“灯”在每一代的具体实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“大卫家”“立约”“灯”等词保留经文的盟约与王朝意象；句式经过汉语化处理，避免生硬照搬希伯来语结构。
