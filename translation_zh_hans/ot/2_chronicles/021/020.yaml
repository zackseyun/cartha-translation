  text: בֶּן שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וּ/שְׁמוֹנֶ֣ה שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יֵּ֨לֶךְ֙ בְּ/לֹ֣א חֶמְדָּ֔ה וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֖א בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: zh_hans
  text: 他登基时三十二岁，在耶路撒冷作王八年。后来他离世，无人惋惜[a]。人们把他葬在大卫城，却没有葬在列王的陵墓里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他离世时，无人眷恋。”此处希伯来语词可表示喜爱、眷恋或珍视。
    reason: 保留בְּלֹא חֶמְדָּה的词义范围及原文表达上的含混性。
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: 三十二岁
  rationale: 这是希伯来语表达年龄的固定说法；现代汉语自然表达为“三十二岁”。
- source_word: בְמָלְכוֹ
  choice: 登基时
  rationale: 介词结构在王朝纪年公式中表示即位的时间；“登基时”简洁、自然，也符合君王语境。
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: 作王八年
  rationale: מָלַךְ意为“作王、统治”；“作王八年”保留原文的纪年公式，同时符合现代汉语圣经叙事语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按其地点用法直接翻译。
- source_word: וַיֵּלֶךְ
  choice: 后来他离世
  rationale: 该动词本义为“走、离去”，在本节讣告语境中委婉指死亡；“离世”保留委婉色彩，避免直接增译为“死了”。
- source_word: בְּלֹא חֶמְדָּה
  choice: 无人惋惜
  rationale: חֶמְדָּה可表示喜爱、眷恋、珍视或渴望。结合君王去世的语境，“无人惋惜”自然表达其离去未引起眷恋或失落；脚注保留较贴近字面的另一理解。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 人们把他葬在
  rationale: 原文为第三人称复数动词并带宾语后缀，主语未明；汉语用泛指的“人们”自然呈现这一不定主语。
- source_word: בְּעִיר דָּוִיד
  choice: 在大卫城
  rationale: “大卫城”是这一地名在现代汉语中的通行译法。
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: 却没有葬在列王的陵墓里
  rationale: קִבְרוֹת可指坟墓或墓穴；在王室安葬语境中，“陵墓”较自然。“列王”保留复数和王朝墓葬的意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“登基”“作王”“离世”“陵墓”适合王室讣告语境；对“无人惋惜”加注，以免把原文关于喜爱、眷恋或珍视的含义限定得过窄。
