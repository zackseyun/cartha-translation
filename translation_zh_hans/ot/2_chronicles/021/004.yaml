base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: zh_hans
  text: 约兰登基统治他父亲的国，巩固了自己的权势之后，就用刀剑杀了他所有的兄弟，也杀了以色列的一些首领[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”也可译作“官长”或“高官”；希伯来语原词可指身居高位的统治者或行政官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכַת אָבִיו
  choice: 约兰掌管了他父亲的国
  rationale: קום与עַל及“国”连用，在王权语境中表示起来执掌、取得对王国的统治。“掌管”自然表达即位掌权，并保留עַל所含的统治意味。
- source_word: וַיִּתְחַזַּק
  choice: 又巩固了自己的权位
  rationale: 该动词为反身形式，字面是“使自己强大”。本处紧接执掌王国，语境指稳固自身势力或统治；“巩固了自己的权位”自然传达其反身及政治语境，同时不限定具体手段。
- source_word: וַיַּהֲרֹג אֶת כָּל אֶחָיו בֶּחָרֶב
  choice: 就用刀杀了他所有的兄弟
  rationale: 准确保留“所有”“兄弟”和以刀杀害的工具意义；“杀了”是现代汉语清楚而不古奥的表达。
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: 也杀了以色列的一些首领
  rationale: מִן具有部分意义，因此译出“一些”；שָׂר可指首领、高官或贵族，“首领”在此既自然又不过度限定官阶。省略号所支配的“杀了”在汉语中补出，以免歧义。
theological_decisions:
- issue: “以色列”的所指
  choice: 保留“以色列”
  alternative: 犹大；全国
  rationale: 历代志在犹大王国的语境中仍可用“以色列”表达较广的盟约、民族或王朝意义。译文不把原文明确的称呼改成“犹大”，也不以释义消除其历史与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“掌管了他父亲的国”表达即位统治；“巩固了自己的权位”按上下文自然呈现反身动词的含义。脚注仅说明“首领”的词义范围，不把“以色列”改释为“犹大”。
