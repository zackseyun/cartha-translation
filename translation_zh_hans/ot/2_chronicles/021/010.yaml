base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: zh_hans
  text: 以东背叛犹大，摆脱了犹大的统治[b]，直到今日[a]。那时，立拿也背叛约兰，摆脱了他的统治[b]，因为约兰离弃了雅威——他列祖的神[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背叛”也可译作“反叛”或“脱离”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“从犹大的手下”和“从他的手下”，是指摆脱其权势或统治。
    reason: cultural_note
  - marker: c
    text: 末尾的因果从句可能概括解释约兰所遭遇的这些变故，也可能只解释立拿的反叛。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: 背叛
  rationale: 在政治语境中指反叛权威、脱离臣属关系；“背叛”既保留原文力度，又适合以东和立拿两个主语。
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: 脱离了……的统治
  rationale: 原文直译为“从……手下”，是摆脱其权势或管辖的惯用语。正文采用现代汉语的自然表达，脚注保留原文意象。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留希伯来文常见的时间套语，表示这一局面延续到作者所处的时代。
- source_word: אָז
  choice: 那时
  rationale: 简洁、自然地标明立拿的反叛与前述事件处于同一时期。
- source_word: עָזַב
  choice: 离弃
  rationale: 此处指约兰背离以色列之神；“离弃”保留其关系性和信仰层面的严重意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术拟音译出其专名，不以表示称号的“主”代替。
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: 他列祖的神
  rationale: 贴近原文复数“列祖”，并采用现代中文圣经语体中清楚、庄重的表达。
theological_decisions:
- issue: 末尾因果从句所解释的范围
  choice: 保持因果从句附于整段叙述之后，不在正文中限定它只解释立拿的反叛。
  alternative: 把“因为他离弃了雅威”仅理解为立拿反叛的原因。
  rationale: 从句紧接立拿的反叛，可能只解释最近的事件；但历代志作者也常以君王离弃神解释整体政治灾祸。原文未明确限定范围，因此译文保留这种张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“脱离了……的统治”清楚传达希伯来惯用语，同时借脚注保留“手下”的原文图像；“他列祖的神”保留历代志的传统与盟约语感。
