  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: zh_hans
  text: 他走以色列诸王所走的道路，正如亚哈家所行的一样；因为亚哈的女儿是他的妻子。他行雅威眼中看为恶的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: 他行……所行的道
  rationale: 这是表示生活方式和行为取向的惯用语；译文保留“行道”的希伯来语比喻，同时用现代汉语可理解的结构表达。
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: 以色列诸王
  rationale: 指北国以色列历代君王，采用简洁、自然的属格表达。
- source_word: בֵּית אַחְאָב
  choice: 亚哈家
  rationale: 王室语境中的“家”兼有家族与王朝之意；保留原文表达，不把含义限定为“家庭”或“王朝”。
- source_word: כִּי
  choice: 因为
  rationale: 引出他仿效亚哈家的原因，现代汉语中因果关系清楚自然。
- source_word: בַּת אַחְאָב
  choice: 亚哈的女儿
  rationale: 忠实保留本节的亲属称谓，不以她在别处出现的名字替代。
- source_word: הָיְתָה לּוֹ אִשָּׁה
  choice: 作了他的妻子
  rationale: 表达既有的婚姻关系；这里的“作了”按汉语语境表示身份关系，并不强调婚姻在此时才发生。
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 将带定冠词的“恶”具体化为“恶的事”，符合历代志评价君王行为的固定叙述语气。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留“在……眼中”的评价性习语，并调整为自然的现代汉语句式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确呈现原文专名而非以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为人知且具有专名功能的“耶和华”，不译作“主”，从而保留原文使用神名的特点；“雅威”是较接近学术重构读音的另一可行译法。
- issue: 亚哈家与婚姻关系的因果关联
  choice: 保留“因为”所表达的解释关系
  alternative: 弱化为并列说明
  rationale: 原文 כִּי 明确引出解释：亚哈的女儿是他的妻子，与他效法亚哈家的道路有关。译文保留此联系，但不额外断定妻子是其恶行的唯一原因。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行……所行的道”保留原文行为道路的比喻；“亚哈家”保留家族与王朝之间的语义空间。
