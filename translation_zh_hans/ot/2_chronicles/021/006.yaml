revisions:
- from: 他行以色列诸王所行的道，正如亚哈家所做的，因为亚哈的女儿作了他的妻子；他行耶和华眼中看为恶的事。
  to: 他走以色列诸王所走的道路，正如亚哈家所行的一样；因为亚哈的女儿是他的妻子。他行雅威眼中看为恶的事。
  rationale: 修订仅处理既有婚姻关系、现代汉语行文及与英语 POB 神名政策的一致性。保留“亚哈家”的家族／王朝语义空间，保留 כִּי 的解释性因果关系，也没有把亚哈女儿的身份扩展为对恶行的单一因果断言。原稿未设脚注，故无脚注锚点需要修订。
