source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: zh_hans
  text: 看哪[a]，雅威即将用一场大灾祸击打你的百姓、儿子、妻子和你所有的财物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“看哪，雅威正在用一场大瘟疫击打……”或“雅威必重重击打……”。希伯来文分词既可表示正在发生或即将发生的行动，也可作一般将来理解；“灾祸”一词也可特指瘟疫，或泛指神所施的沉重打击。
    reason: 保留 נֹגֵף 的时间指向及 מַגֵּפָה 的词义范围。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中郑重、引人注意并强调迫近之事的语气；现代读者也容易理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译希伯来文神名，避免以称号取代原文专名。
- source_word: נֹגֵף
  choice: 即将……击打
  rationale: 分词与 הִנֵּה 连用时可表达迫近的行动；“即将”体现警告的紧迫性，“击打”保留该动词施行打击的力度。
- source_word: מַגֵּפָה גְדוֹלָה
  choice: 一场大灾祸
  rationale: מַגֵּפָה 可指瘟疫，也可泛指神所施的重击或灾害；正文采用较宽泛的“灾祸”，避免把语义不必要地限定为疫病。
- source_word: בְּעַמֶּךָ
  choice: 你的百姓
  rationale: 介词 בְּ 在 נֹגֵף 的支配下标明受打击的对象，汉语可直接译出宾语。
- source_word: וּבְבָנֶיךָ
  choice: 儿子
  rationale: בָנִים 在此为阳性复数，按原文具体译作“儿子”，不泛化为“儿女”。
- source_word: וּבְנָשֶׁיךָ
  choice: 妻子
  rationale: 在第二人称所属关系中，נָשִׁים 明确指多位妻子，而非泛指妇女。
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: 你所有的财物
  rationale: רְכוּשׁ 指财产、物资或所有物；“财物”简洁自然，并保留 כָל 的全称范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用四字神名，正文以“雅威”直接呈现其专名性质，不以称号代替。
- issue: 先知宣告中分词 נֹגֵף 的时态力度
  choice: 即将……击打
  alternative: 正在击打／必击打
  rationale: הִנֵּה 加分词可描述眼前或迫近的行动；此处采用迫近将来，但以脚注保留现在或一般将来的可能。
- issue: מַגֵּפָה 的灾难性质
  choice: 大灾祸
  alternative: 大瘟疫／沉重打击
  rationale: 该词既可能指瘟疫，也可指神所降的严重打击；正文使用范围较宽的译语，不武断限定具体形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留先知话语的郑重感；句法尽量贴近希伯来文的连续受击对象，同时用顿号式并列使中文易读。
