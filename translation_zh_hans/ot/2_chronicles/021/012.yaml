base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: zh_hans
  text: 后来，有一封来自先知以利亚的信送到了他那里，信上说：“耶和华、你祖先大卫的上帝这样说：因为你没有走你父亲约沙法的道路，也没有走犹大王亚撒的道路，”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: 后来，……送来一封信给他
  rationale: 原文直译为“一封信来到他那里”，其中“信”是后置主语；中文用“送来一封信给他”更自然，同时保留信件抵达他的叙事含义。“后来”体现叙事连接词。
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: 先知以利亚
  rationale: 按现代汉语习惯将身份称谓置于人名前；מֵ־所表达的来源关系已由“送来”体现。
- source_word: לֵאמֹר
  choice: 信上说
  rationale: 结合书信语境自然呈现引语导入，比机械译作“说”更清楚。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华……如此说
  rationale: 保留先知性使者公式的庄重结构，并将四字神名按通行中文圣经人名形式译作“耶和华”。
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: 你祖先大卫的上帝
  rationale: אָב在王朝谱系中可指祖先；大卫并非约兰的直接父亲，因此明确译作“祖先”可避免现代读者误解。
- source_word: תַּחַת אֲשֶׁר
  choice: 因为
  rationale: 此处引出后续审判的原因，现代汉语用“因为”清楚自然。
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: 你没有行……所行的道
  rationale: 保留“行道”这一希伯来语行为隐喻，同时用中文关系结构表达效法某人生活方式的意思。
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: 你父亲约沙法
  rationale: 约沙法是约兰的直接父亲，照原文明确保留父子关系。
- source_word: וּבְדַרְכֵי אָסָא מֶלֶךְ יְהוּדָה
  choice: 也没有行犹大王亚撒所行的道
  rationale: וּ在否定结构中连接两项；中文以“没有……也没有……”自然表达两者均未遵行，同时保留原文连接关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且能作为专名识别的“耶和华”，不以“主”这一头衔替代神名。
- issue: דָּוִיד אָבִיךָ 中 אָב 的亲属范围
  choice: 你祖先大卫
  alternative: 你父亲大卫
  rationale: אָב可泛指父辈或祖先；在本节王朝语境中，大卫是约兰的祖先而非直接父亲，译作“祖先”忠实呈现所指关系，又不改变其大卫王朝的神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和先知宣告语体。“行……所行的道”保留圣经常见的行为隐喻。正文以逗号结尾，因为本节引语和因果句在后续经文中继续。
