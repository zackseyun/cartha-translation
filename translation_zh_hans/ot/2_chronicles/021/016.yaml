  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: zh_hans
  text: 耶和华激起[a]了非利士人和在古实人附近[b]的阿拉伯人的心，使他们敌对约兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “激起”也可译作“唤起”或“煽动”。原文动词表明，耶和华使这些族群起来敌对约兰。
    reason: lexical_alternative
  - marker: b
    text: “在古实人附近的”也可译作“在古实人旁边的”；这句话很可能是在说明这些阿拉伯人的地理位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: 激起了
  rationale: 该动词表示使人奋起或煽动其采取行动；“激起”自然地保留了耶和华主动促成敌对行动的含义，又不把其心理机制说得过细。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中对四字神名的通行音译，以个人名字而非称号呈现原文。
- source_word: עַל יְהוֹרָם
  choice: 敌对约兰
  rationale: 介词 עַל 在本句敌对语境中表示行动所针对的对象；与“心”搭配译作“敌对约兰”符合现代汉语。
- source_word: רוּחַ
  choice: ……的心
  rationale: רוּחַ 在此指驱使这些族群行动的内在意向或精神。“心”在中文中自然表达这种敌对意向，同时没有直接增译为“敌意”。
- source_word: הַפְּלִשְׁתִּים
  choice: 非利士人
  rationale: 该古代族群的标准中文译名。
- source_word: וְהָעַרְבִים
  choice: 阿拉伯人
  rationale: 该古代族群的通行中文名称；上下文明确指古代群体，不需使用较生硬的“阿拉伯族人”。
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: 住在古实人附近的
  rationale: עַל יַד 在这里最自然地表示空间上的“在旁边、附近”；补出“住在”使关系从句在现代汉语中顺畅，并避免误解为政治隶属。
theological_decisions:
- issue: 耶和华使外族兴起攻击约兰的主动因果作用
  choice: 译作“耶和华激起了……敌对约兰的心”，直接保留神主动促成此事的陈述。
  alternative: 译成耶和华只是容许这些族群原有的敌意显露。
  rationale: 原文动词直接以耶和华为施事者，不宜弱化为单纯许可；同时译文不进一步解释神如何作用于这些族群的意向，保留经文本身的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式将希伯来语“激起……的灵”转化为中文惯用的“激起……的心”，保留内在驱动力的意象；“住在”属于为汉语清晰度所作的最小补充。所有脚注标记均已置于正文。
