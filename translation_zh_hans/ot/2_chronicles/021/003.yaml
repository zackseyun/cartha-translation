base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: zh_hans
  text: 他们的父亲赐给他们许多礼物，包括金银和珍贵物品[a]，又把犹大境内的坚固城赐给他们；但他把王国交给约兰，因为约兰是长子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上选之物”或“贵重礼品”。这个希伯来词可泛指贵重或精选的物品。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם אֲבִיהֶם
  choice: 他们的父亲赐给他们
  rationale: 按叙事性 wayyiqtol 译为完成的过去行动；“赐给”自然表达父亲以君王身份分赠财物和城邑。
- source_word: מַתָּנוֹת רַבּוֹת
  choice: 许多礼物
  rationale: 保留 רַבּוֹת 的数量意义，并以现代汉语常用表达呈现。
- source_word: לְכֶסֶף וּלְזָהָב
  choice: 包括金银
  rationale: 介词 לְ 在此引出礼物的类别；“包括”使清单关系在汉语中清楚自然，而不限定为仅由金银制成。
- source_word: וּלְמִגְדָּנוֹת
  choice: 和珍贵物品
  rationale: מִגְדָּנוֹת 可泛指贵重、上选之物；此处王室馈赠的语境适合译作“珍贵物品”，同时以脚注保留其他可能。
- source_word: עִם עָרֵי מְצֻרוֹת בִּיהוּדָה
  choice: 又把犹大境内的坚固城赐给他们
  rationale: עִם 表示这些城邑与前述礼物一同赐下；“犹大境内”明确修饰城邑所在地，“坚固城”保留设防城邑之义。
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: 但他把王国交给约兰
  rationale: וְ 字面为“和”，此处在兄弟所得礼物与约兰所得王国之间形成对比，现代汉语用“但”能自然体现篇章关系；“王国”保留 הַמַּמְלָכָה 的统治领域含义。
- source_word: כִּי הוּא הַבְּכוֹר
  choice: 因为约兰是长子
  rationale: כִּי 明示原因；重复“约兰”避免汉语代词指向含混，“长子”准确表达 הַבְּכוֹר 的家族身份。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“金银”合并为汉语惯用表达；通过“但”呈现原文并列结构中实际存在的对比。脚注标记已在“珍贵物品”后出现。
