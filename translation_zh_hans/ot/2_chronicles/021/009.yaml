base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: zh_hans
  text: 约兰带着他的众将领和所有随行的战车过去了。他夜间起身，攻击包围他的以东人和战车统领[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战车统领”也可译作“战车长官”。希伯来文没有明说这些统领属于哪一方；按上下文，很可能指以东军的战车统领。
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 过境
  rationale: עבר表示经过、越过或渡过；此处目的地和具体路线未明，“过境”保留军事行进的具体感，又不补入原文没有说明的方向。
- source_word: שָׂרָיו
  choice: 他的众将领
  rationale: שַׂר可指首领、官员或军事长官；上下文是战车与作战行动，因此译作“将领”最合语境。
- source_word: וְכָל הָרֶכֶב עִמּוֹ
  choice: 和所有战车
  rationale: רֶכֶב在这里可集合性地指战车或战车部队；“所有战车”贴近词面，也符合现代汉语表达。
- source_word: וַיְהִי קָם לַיְלָה
  choice: 他夜间起来
  rationale: 将叙事公式וַיְהִי与分词קָם自然地转为汉语连续动作，不生硬保留“事情发生了”之类套语。
- source_word: וַיַּךְ
  choice: 击杀了
  rationale: נכה可泛指击打、攻击或杀伤；此处直接宾语为敌军人员，“击杀”符合军事语境，同时不扩大为彻底“击败”。
- source_word: אֱדוֹם הַסּוֹבֵב אֵלָיו
  choice: 包围他的以东人
  rationale: אֱדוֹם是民族或国家集合称谓，作为被击杀的对象，汉语用“以东人”自然；分词הַסּוֹבֵב表达当时围住约兰的状态。
- source_word: שָׂרֵי הָרָכֶב
  choice: 战车部队的统领
  rationale: 该结构直指战车军力的长官；“战车部队”显明רֶכֶב的集合意义，“统领”则保留שָׂרֵי的军事职务含义。
theological_decisions:
- issue: 战车统领的归属
  choice: 正文不明说是以东的战车统领
  alternative: 译为“以东的战车统领”或“他的战车统领”
  rationale: 希伯来文只说“战车部队的统领”，没有所有格。语境很可能指围困约兰的以东军官，但明加“以东的”会消除原文保留的句法含混；理解为约兰自己的统领则与动词“击杀”的并列宾语关系不自然。
translation_notes:
  register: 采用庄重而明晰的现代标准汉语。以“率领……过境”使首句自然连贯；第二句保留夜间突击和被包围的情势。避免使用古旧的“击打”“车兵长”等表达，也不把这次行动强化为原文未明说的全面胜利。
