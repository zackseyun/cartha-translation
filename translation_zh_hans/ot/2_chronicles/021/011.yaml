base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: zh_hans
  text: 他又在犹大的山地建造丘坛，使耶路撒冷的居民行淫[a]，并使犹大走入歧途[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行淫”也可译作“使……沦为娼妓”。这里使用盟约不忠的语言，既可使人想到性方面的不贞，也可比喻在信仰上背叛耶和华。
    reason: lexical_alternative
  - marker: b
    text: “使犹大走入歧途”也可译作“使犹大偏离”。该动词可含“驱离”的意思；在本节语境中，指犹大被引离对耶和华应有的忠诚。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: 他又
  rationale: 既保留“也、又”的承接作用，也以自然的现代汉语延续上下文对约兰恶行的叙述。
- source_word: עָשָׂה בָמוֹת
  choice: 建造丘坛
  rationale: עָשָׂה直译为“做、造”，与祭祀场所בָמוֹת连用时，汉语用“建造丘坛”自然明确；“丘坛”是历史书中此类敬拜场所的通行译法。
- source_word: בְּהָרֵי יְהוּדָה
  choice: 在犹大的山地
  rationale: הָרִים可指山岭或山地区域；“犹大的山地”既符合地理语境，也不把它限定为个别山峰。
- source_word: וַיֶּזֶן
  choice: 使……行淫
  rationale: 该使役形式表示使人行淫或卖淫；在建造丘坛的盟约语境中，也以性不忠的意象表达宗教背叛。“使……行淫”保留原文强烈而含混的意象，脚注说明其双重指向。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 准确表达“居住在耶路撒冷的人”，简洁而庄重。
- source_word: וַיַּדַּח
  choice: 使……偏离正道
  rationale: נדח的使役形式可表示驱离、使偏离或引入歧途；此处关乎犹大背离应有的忠诚。“使……偏离正道”在汉语中自然，并保留原文未明说所偏离对象的特点。
- source_word: אֶת יְהוּדָה
  choice: 犹大
  rationale: 原文以“犹大”统称其国民或整个王国，译文保留这一集体称谓。
theological_decisions:
- issue: “行淫”是指实际的性行为，还是以性不忠比喻宗教背叛
  choice: 正文保留“使……行淫”的盟约不忠意象，不限定为单一含义
  alternative: 使耶路撒冷的居民敬拜别神／陷入淫乱
  rationale: 高处祭坛的上下文强烈指向宗教背叛，但זנה本身仍可唤起实际性淫乱。正文不将其解释性地缩减为其中一义，脚注交代两层含义。
- issue: 是否明确说犹大“偏离耶和华”
  choice: 正文译作“使犹大偏离正道”，不补出“耶和华”
  alternative: 使犹大离弃耶和华
  rationale: 上下文暗示犹大背离耶和华和盟约忠诚，但本节希伯来文本没有明说所偏离的对象。译文保留这种简略性，同时以脚注说明语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“丘坛”保留圣经历史语境中的专门称谓；“行淫”保留原文尖锐的盟约不忠意象，并借脚注避免读者将其仅理解为性行为。
