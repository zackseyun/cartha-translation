  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: zh_hans
  text: 他们上来攻打犹大，攻入境内，把王宫里所有的财物，连同王的众子和众妻都掳走了；除王最小的儿子约哈斯[a]以外，没有给他留下一个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约哈斯很可能就是别处所称的亚哈谢（参列王纪下8:24–26；历代志下22:1）。
    reason: 说明相关经文中的另一名字形式及人物辨识。
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: 他们上来攻打犹大
  rationale: עלה与介词ב连用可表示进入某地；在军事语境中是敌对进军。“上来攻打”既保留上行意象，也明确敌意。
- source_word: וַיִּבְקָעוּהָ
  choice: 攻入境内
  rationale: בקע本义为劈开、突破；以犹大为宾语时，指突破防线进入其境。“攻入境内”符合现代汉语军事叙述。
- source_word: וַיִּשְׁבּוּ
  choice: 掳走
  rationale: שבה通常表示俘获、掳去；此处统摄财物与王室成员，“掳走”能体现劫掠和俘虏的共同结果。
- source_word: כָּל הָרְכוּשׁ הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: 王宫里所有的财物
  rationale: רכוש指财物或产业；בית המלך在此自然指王宫。此译简洁呈现原文“在王宫中找到/存有的一切财物”。
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: 连同王的众子和众妻
  rationale: גם带有追加意味；“连同”自然表达财物之外，王的儿子和妻子也被掳去。补出“王的”可避免汉语代词指向含混。
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן כִּי אִם
  choice: 除……以外，没有给他留下一个儿子
  rationale: 保留שאר的“留下、剩下”含义，并以“除……以外”准确表达כי אם所引出的唯一例外。
- source_word: יְהוֹאָחָז
  choice: 约哈斯
  rationale: 正文依照马所拉文本保留此处的人名形式；与相关经文中“亚哈谢”的关系放入脚注说明。
- source_word: קְטֹן בָּנָיו
  choice: 最小的儿子
  rationale: קטן在家庭排行语境中表示年龄最小，而非体形最小；现代汉语可自然说“最小的儿子”。
theological_decisions:
- issue: 约兰幸存之子的名字形式
  choice: 正文采用马所拉文本的“约哈斯”
  alternative: 依据列王纪下8:24–26及历代志下22:1作“亚哈谢”
  rationale: 这是文本和叙事人物辨识问题。原文优先要求正文保留WLC所载יְהוֹאָחָז，同时以脚注透明说明他很可能就是别处所称的亚哈谢，不在正文中默默统一名字。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“攻入境内”避免把犹大这个地区说成可被字面“劈开”；“王宫”按语境自然表达“王的家”。脚注标记紧随“约哈斯”，使注释所指更明确。
