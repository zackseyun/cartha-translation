base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: zh_hans
  text: 过了一段日子，到两年期满时，他的肠子因病脱出；他死于严重的疾病。他的百姓没有为他举行焚烧礼[a]，像为他的列祖所行的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“焚烧礼”很可能指为死者焚烧香料等丧葬尊荣仪式，并不是把遗体火化。参看《历代志》中其他君王的丧葬习俗。
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: 过了一段日子
  rationale: 这是表示一段不确定时间过去的习语；采用自然的现代汉语表达，避免生硬直译。
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: 到两年期满的时候
  rationale: 保留原文较完整的时间结构，表明病程到两年时达到终点。
- source_word: מֵעָיו / יָצְאוּ מֵעָיו
  choice: 他的肠子……脱出
  rationale: מֵעִים可指内脏，尤指肠子；这里具体而惨烈，译文不加以淡化。“脱出”自然表达יצא的实际动作。
- source_word: עִם חָלְיוֹ
  choice: 因这病
  rationale: עִם本义为“与、伴随”，此处表示伴随的病因或情状；“因这病”符合上下文和现代汉语。
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: 在痛苦的病患中
  rationale: רָעִים在此表示恶劣、痛苦或严重；保留复数所呈现的多重病苦，同时避免把它机械地译成多个独立疾病。
- source_word: שְׂרֵפָה
  choice: 焚烧香料
  rationale: 在历代志的王室丧葬语境中，这很可能是为死者举行的焚香料礼仪，而非焚烧尸体；正文采用可理解的文化对应，并以脚注保留解释空间。
- source_word: כִּשְׂרֵפַת אֲבֹתָיו
  choice: 像为他的列祖所行的那样
  rationale: 比较的是先王或祖先所得的丧葬尊荣。“列祖”符合庄重的圣经叙事语域，也不暗示遗体被火化。
theological_decisions:
- issue: 王室丧葬语境中שְׂרֵפָה的性质
  choice: 正文译作“焚烧香料”，理解为丧葬尊荣仪式
  alternative: 直译“焚烧”，或理解为火化遗体
  rationale: 历代志相关王室丧葬记载的重点是给予或不给予君王尊荣；这里更可能指焚烧香料等仪式，而非火化。脚注用“可能”标明解释并非词义本身绝对限定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文对病情的强烈描写，不加委婉化；时间表达兼顾希伯来语结构和汉语自然度。
