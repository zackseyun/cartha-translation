  text: בְּ/יָמָי/ו֙ פָּשַׁ֣ע אֱד֔וֹם מִ/תַּ֖חַת יַד יְהוּדָ֑ה וַ/יַּמְלִ֥יכוּ עֲלֵי/הֶ֖ם מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/008.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: zh_hans
  text: 约兰在位期间，以东背叛了犹大的统治[a]，为自己立了一个王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从犹大手下背叛出去”；意思是脱离犹大的控制。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: 约兰在位期间
  rationale: 这是指约兰统治时期的时间表达。用“在位期间”自然明确，也符合本节上下文；补出“约兰”以避免中文代词指向含混。
- source_word: פָּשַׁע
  choice: 背叛
  rationale: 在以东脱离犹大权力的政治语境中，此词指反叛、脱离控制，而非抽象的道德过犯。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: 犹大的统治
  rationale: 希伯来语直译为“犹大手下”，是表示权柄或控制的习语；正文以自然现代汉语表达其含义，脚注保留原文意象。
- source_word: וַיַּמְלִיכוּ
  choice: 立
  rationale: מלך 的使役式在此意为使某人作王，即拥立或设立为王。“立……为王”是简洁自然的中文表达。
- source_word: עֲלֵיהֶם
  choice: 为自己
  rationale: 第三人称阳性复数后缀所指为以东人；“为自己立了一个王”自然表达他们在自身之上设立君王的意思。
- source_word: מֶלֶךְ
  choice: 一个王
  rationale: 原文此处为不定名词，译作“一个王”保留其不定性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“约兰在位期间”比照搬“在他的日子”更符合现代汉语；政治习语在正文中按含义翻译，并由脚注保存希伯来语的具体意象。
