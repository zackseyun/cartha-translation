language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: zh_hans
  text: 你却走上以色列诸王的道路，使犹大和耶路撒冷的居民行淫[a]，就像亚哈家[b]使人行淫一样；你还杀了你父家中的兄弟，他们比你更好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……行淫”保留了先知常用的比喻，指对上帝不忠、违背盟约；这往往表现为拜偶像。
    reason: lexical_alternative
  - marker: b
    text: “亚哈家”指亚哈的王室家族，即他的王朝。
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: 走……所走的道路
  rationale: 保留希伯来语以“走道路”表示遵循某种行为模式的比喻，同时采用现代汉语可自然理解的重复式表达。
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: 以色列诸王
  rationale: 直接保留历史上的国别称谓和复数含义，以维持犹大与以色列之间的重要对照。
- source_word: וַתַּזְנֶה אֶת־יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 使犹大和耶路撒冷的居民行淫
  rationale: זנה在使役形式中表示使人行淫；这里以先知性婚姻不忠的比喻谴责背约与偶像崇拜。译文保留“行淫”的强烈比喻，不直接收窄为“拜偶像”。
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: 就像亚哈家使人行淫一样
  rationale: כ加不定式表示比较；使役意义与前句保持平行。“人”概括原文未明说的受使役对象，避免在汉语中产生句法残缺。
- source_word: בֵּית אַחְאָב
  choice: 亚哈家
  rationale: “家”保留希伯来语王室家族和王朝的表达，并以脚注说明其所指。
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: 你父家中的兄弟
  rationale: 把兄弟明确限定为父家、即王室家族中的成员，既符合原文关系，也比生硬的同位结构更自然。
- source_word: הַטּוֹבִים מִמְּךָ
  choice: 他们都比你好
  rationale: 直接表达טובים与מן构成的比较，不额外限定究竟是道德、品格还是资格上的“更好”，从而保留原文的概括性责备。
- source_word: הָרָגְתָּ
  choice: 你还杀了
  rationale: הרג的基本义是“杀死”；不用解释性更强的“谋杀”，并以“还”体现וְגַם递进加罪的语气。
theological_decisions:
- issue: זנה在王室背道语境中的性比喻与盟约含义
  choice: 正文译作“使……行淫”，脚注说明这是对背约不忠、常表现为偶像崇拜的先知性比喻。
  alternative: 直接译作“使……拜偶像”或“使……背约不忠”。
  rationale: 直接译为“拜偶像”会把原文较宽的婚姻不忠比喻收窄；只译“背约不忠”又会削弱原文刻意采用的强烈性比喻。正文与脚注结合，可兼顾原词形象和语境含义。
- issue: הַטּוֹבִים מִמְּךָ中“更好”的评判范围
  choice: 保留概括性的“比你好”。
  alternative: 译为“比你更正直”或“比你更配作王”。
  rationale: 原文没有明确把“好”限制为道德正直、政治资格或其他具体方面，因此不作神学或历史上的进一步判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“走……所走的道路”保留圣经惯用比喻；“行淫”刻意保留原文尖锐的先知性措辞，并用脚注防止读者只按字面性行为理解。分号呈现两项递进指控：引人背道与杀害兄弟。
