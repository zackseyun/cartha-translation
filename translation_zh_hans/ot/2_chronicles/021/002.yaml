base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: zh_hans
  text: 他有兄弟，都是约沙法的儿子：亚撒利雅、耶歇、撒迦利雅、亚撒利亚胡[a]、米迦勒和示法提雅。这些人都是以色列王约沙法的儿子。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处第四个人名的希伯来文拼写与名单中第一个“亚撒利雅”不同，因此译作“亚撒利亚胡”以示区别。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“以色列王”。按历史记载，约沙法通常被称为犹大王；《历代志》在这里可能以较广泛的盟约意义使用“以色列”一词。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֽ/וֹ אַחִים
  choice: 他有几个兄弟
  rationale: 希伯来语直译为“而对他有兄弟”，是表达领有关系的惯用结构；译作“他有几个兄弟”符合现代汉语，也保留叙事衔接和复数含义。
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: 都是约沙法的儿子
  rationale: 明确这些兄弟同为约沙法之子，并保留原文的家谱式表述。
- source_word: עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 按现代中文圣经人名的常见音译处理。
- source_word: וִֽיחִיאֵל
  choice: 耶歇
  rationale: 采用简明且较为通行的中文圣经人名音译。
- source_word: וּזְכַרְיָהוּ
  choice: 撒迦利雅
  rationale: 采用现代中文读者熟悉的传统圣经人名形式。
- source_word: וַעֲזַרְיָהוּ
  choice: 亚撒利亚胡
  rationale: 原文此名为 עֲזַרְיָהוּ，与名单中较早的 עֲזַרְיָה 拼写不同；用“亚撒利亚胡”保留这一区别。
- source_word: וּמִיכָאֵל
  choice: 米迦勒
  rationale: 采用现代中文圣经中通行的人名形式。
- source_word: וּשְׁפַטְיָהוּ
  choice: 示法提雅
  rationale: 按希伯来语人名音译，并采用中文圣经人名的常见构形。
- source_word: כָּל אֵלֶּה
  choice: 他们全都是
  rationale: 自然表达原文在名单之后的总括语气。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 严格保留马所拉文本的“以色列王”，不按历史背景改成“犹大王”。
theological_decisions:
- issue: 约沙法的称号 מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  alternative: 犹大王
  rationale: 希伯来文本明确写“以色列王”。虽然约沙法在分裂王国时期通常被称为犹大王，但译文不作协调性改写，以保留《历代志》可能对“以色列”一词所作的较广泛、盟约群体性的使用。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。首句以“都是”清楚呈现兄弟与约沙法众子的同位关系；人名兼顾中文圣经传统与原文拼写差异。
