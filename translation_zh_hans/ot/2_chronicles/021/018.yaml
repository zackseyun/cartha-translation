  text: וְ/אַחֲרֵ֖י כָּל זֹ֑את נְגָפ֨/וֹ יְהוָ֧ה בְּ/מֵעָ֛י/ו לָ/חֳלִ֖י לְ/אֵ֥ין מַרְפֵּֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/018.yaml
  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: zh_hans
  text: 这一切事以后，雅威以无法医治的疾病击打他的肠子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有医治的办法”；直译：“没有医治”。
    reason: 说明לְאֵין מַרְפֵּא的字面表达及可接受的词义表达。
lexical_decisions:
- source_word: וְ/אַחֲרֵי כָּל זֹאת
  choice: 这一切事以后
  rationale: 保留时间顺序和对前文诸事的概括；希伯来语连词在现代汉语叙事中无需机械译作“而”。
- source_word: נְגָפ/וֹ
  choice: 击打他
  rationale: 表达上帝直接施加打击或灾病的强烈语气，又不额外限定具体方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为以色列之上帝专名的性质。
- source_word: בְּ/מֵעָי/ו
  choice: 他的肠子
  rationale: מֵעֶה在这里指腹内脏器，尤其是肠道；“肠子”清楚、自然，并符合后文疾病的语境。
- source_word: לָ/חֳלִי
  choice: 使他患上……的病
  rationale: 前置词结构表示击打所造成的结果或状态；此译法符合现代汉语表达。
- source_word: לְ/אֵין מַרְפֵּא
  choice: 无可医治
  rationale: 原文直义为“没有医治”，在此修饰疾病；“无可医治”简洁保留病情没有治愈可能或医治办法的含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近学界通行复原读音的“雅威”，而不以称号替代。
- issue: 疾病与上帝行动的关系
  choice: 雅威击打他，使他患病
  alternative: 雅威使他受疾病折磨
  rationale: 保留נְגָפוֹ所表达的直接神圣行动及审判力度，不将因果关系弱化，也不超出原文明定疾病机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“肠子”比“肠腑”或“内脏”更直接对应此处身体部位；脚注标记置于“无可医治的病”之后，使其准确对应所注释的短语。
