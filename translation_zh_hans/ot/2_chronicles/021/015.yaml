base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: zh_hans
  text: 至于你自己，必患多种疾病，患上腹内的疾病，直到你的肠子因这病流出来，日复一日[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希伯来语直译为“日子加上日子”，意思是“日复一日”或“持续多日”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你，你自己
  rationale: 连词与独立人称代词构成强调性的转折，直接把话锋转向约兰本人；这一译法保留强调，又符合现代汉语表达。
- source_word: בָּחֳלָיִם רַבִּים
  choice: 必患多种疾病
  rationale: 介词ב在此表示所处的患病状态；复数חֳלָיִם与רַבִּים保留为“多种疾病”，不把“多”擅自改释为疾病程度严重。
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: 肠子也必患病
  rationale: 直译近于“在你肠子的疾病中”。汉语以“肠子也必患病”自然表达具体病症，并保留מֵעֶה所指内脏、尤其肠道的含义。
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: 直到你的肠子……流出来
  rationale: יצא的基本意思是“出去、出来”。结合疾病导致内脏排出的语境，译作“流出来”既保持原文骇人的直接性，也不额外指定现代医学机制。
- source_word: מִן הַחֹלִי
  choice: 因这病
  rationale: מן在这里表示原因或结果来源，即肠子由于该病而出来；“因这病”简洁地传达这一因果关系。
- source_word: יָמִים עַל יָמִים
  choice: 日复一日
  rationale: 原文惯用语直译为“日子加上日子”，表示这一过程持续多日；“日复一日”是自然且有尊严的现代汉语表达。
