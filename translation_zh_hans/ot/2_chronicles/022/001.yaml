  text: וַ/יַּמְלִיכוּ֩ יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אֶת אֲחַזְיָ֨הוּ בְנ֤/וֹ הַ/קָּטֹן֙ תַּחְתָּ֔י/ו כִּ֤י כָל הָ/רִאשֹׁנִים֙ הָרַ֣ג הַ/גְּד֔וּד הַ/בָּ֥א בָֽ/עַרְבִ֖ים לַֽ/מַּחֲנֶ֑ה וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בֶן יְהוֹרָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: zh_hans
  text: 耶路撒冷的居民立约兰最小的儿子亚哈谢继承约兰的王位，因为与阿拉伯人[a]一同来到营地的那支劫掠队，杀了约兰所有年长的儿子。于是，犹大王约兰的儿子亚哈谢作了王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与阿拉伯人一同”或译“在阿拉伯人中间”。希伯来语中与“阿拉伯人”连用的介词可表示伴随，也可表示处于其中。
    reason: 保留 הַבָּא בָעַרְבִים 中介词 ב 的句法歧义；脚注标记紧邻相关短语。
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: 立……作王
  rationale: 该词是 מלך 的使役形，表示拥立某人为王；“立……作王”自然且保留使役含义。
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 直译为“耶路撒冷的居住者”；“居民”是现代汉语中庄重而易懂的表达。
- source_word: בְנוֹ הַקָּטֹן
  choice: 约兰的小儿子
  rationale: קטן 本义为“小、年幼”；与下文“年长的儿子”相对，指诸子中最年幼者。补出“约兰”以免汉语代词所指含混。
- source_word: תַּחְתָּיו
  choice: 接续他
  rationale: 表示取代前任、继承王位；“接续他作王”符合汉语王位承继的表达。
- source_word: כָל הָרִאשֹׁנִים
  choice: 约兰所有年长的儿子
  rationale: 字面为“所有先前的／在先的”；上下文表明是比亚哈谢年长的诸子。
- source_word: הַגְּדוּד
  choice: 那支劫掠队
  rationale: גדוד 可指军队、队伍或劫掠队；此处涉及袭营杀人，“劫掠队”体现其军事侵袭含义。
- source_word: הַבָּא בָעַרְבִים
  choice: 跟随阿拉伯人来到
  rationale: 将介词 ב 理解为伴随关系；“跟随”表达同行而来，但原文也容许“在阿拉伯人中间”的理解，故加脚注说明。
- source_word: לַמַּחֲנֶה
  choice: 来到营中
  rationale: ל 表示趋向；在袭击语境中译为进入营地，汉语表达自然。
- source_word: וַיִּמְלֹךְ
  choice: 作了王
  rationale: 此处是登基总结语，采用起始意义，表示亚哈谢就此成为王，而非强调一段统治过程。
- source_word: אֲחַזְיָהוּ בֶן יְהוֹרָם מֶלֶךְ יְהוּדָה
  choice: 犹大王约兰的儿子亚哈谢
  rationale: 按汉语语序清楚表明“犹大王”修饰约兰，并交代亚哈谢的父系身份。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重、易懂的叙事体。“立……作王”和“作了王”分别体现使役登基与总结性的即位表达；为避免汉语代词歧义，适度重复“约兰”。脚注标记置于相关原因分句之后。
