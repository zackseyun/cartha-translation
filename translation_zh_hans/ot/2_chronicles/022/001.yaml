revisions:
- from: 耶路撒冷的居民立约兰的小儿子亚哈谢接续他作王，因为跟随阿拉伯人来到营中的那支劫掠队，已经杀了约兰所有年长的儿子。[a] 就这样，犹大王约兰的儿子亚哈谢作了王。
  to: 耶路撒冷的居民立约兰最小的儿子亚哈谢继承约兰的王位，因为与阿拉伯人[a]一同来到营地的那支劫掠队，杀了约兰所有年长的儿子。于是，犹大王约兰的儿子亚哈谢作了王。
  rationale: 修订仅处理两处汉语表达：以“与阿拉伯人一同”替换含有额外“后随”意味的“跟随阿拉伯人”，并以“继承约兰的王位”替换不够自然且指向较弱的“接续他作王”。其余译法及脚注所保留的歧义均予维持。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:55Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了拥立亚哈谢、较年长诸子被杀及其即位的叙事。惟“跟随阿拉伯人”通常表示后随、追随，较原文介词 ב 所可表达的伴随关系更具体，也未能在正文中采用较中性的处理。将其改为“与阿拉伯人一同”可保留伴随义，并由脚注说明“在……中间”的另一种可能。
  naturalness: “接续他作王”略显生硬，且“他”的指向虽可推知为约兰，汉语读者仍可能短暂停顿。改为“继承约兰的王位”更自然、明确。其余叙事语体庄重通顺。
  terminology: 人名“约兰”“亚哈谢”、地名“耶路撒冷”、民族名“阿拉伯人”及王权用语均恰当。“劫掠队”可反映 גדוד 在此军事侵袭语境中的含义，属可接受的具体化。
  issues:
  - severity: medium
    issue: “跟随阿拉伯人来到”把介词的伴随义译成了“跟随”关系。
    rationale: בָּעַרְבִים 可理解为“与阿拉伯人一同／在阿拉伯人中间”，但“跟随”额外暗示该队在阿拉伯人之后或受其带领。采用“与阿拉伯人一同”较忠实，并保留脚注中的句法歧义。
  - severity: low
    issue: “接续他作王”的表达及代词指向不够自然明确。
    rationale: תחתיו 表示继任、取代。明确译为“继承约兰的王位”既保留王位继承意义，也避免汉语代词歧义。
  revised_text: 耶路撒冷的居民立约兰最小的儿子亚哈谢继承约兰的王位，因为与阿拉伯人[a]一同来到营地的那支劫掠队，杀了约兰所有年长的儿子。于是，犹大王约兰的儿子亚哈谢作了王。
