  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: zh_hans
  text: 他也照他们的计谋行事[a]，与以色列王亚哈的儿子约兰一同到基列的拉末，跟亚兰[b]王哈薛交战；亚兰人击伤了约兰[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他们的计谋中行走”；意思是照他们的建议行事。
    reason: 说明希伯来语惯用表达及其字面形式。
  - marker: b
    text: “亚兰”传统上也译作“叙利亚”；“亚兰人”相应也常译作“叙利亚人”。
    reason: 交代传统译名。
  - marker: c
    text: 本节前后所用的希伯来名字形式略有不同，分别是“耶何兰”和“约兰”；这里按现代汉语常用译名均译作“约兰”。
    reason: 说明原文中相关人名形式的差异。
lexical_decisions:
- source_word: גַּם בַּעֲצָתָם הָלַךְ
  choice: 他也照他们的计谋行事
  rationale: 保留“也”所表达的承接关系，并将希伯来语“按某人的计谋行走”这一惯用表达自然译为“照……的计谋行事”。
- source_word: וַיֵּלֶךְ אֶת
  choice: 与……一同到
  rationale: 该结构表示陪同某人前往；“与……一同到”在现代汉语叙事中自然清楚。
- source_word: יְהוֹרָם ... יוֹרָם
  choice: 约兰……约兰
  rationale: 原文前后采用两个相关的名字形式；现代汉语圣经人名惯例通常都译作“约兰”，差异另以脚注说明。
- source_word: לַמִּלְחָמָה עַל
  choice: 跟……交战
  rationale: 准确表达前去作战以及敌对对象，符合现代汉语习惯。
- source_word: אֲרָם / הָרַמִּים
  choice: 亚兰／亚兰人
  rationale: 依照希伯来语的历史名称翻译，并使国名与族称保持一致。
- source_word: בְּרָמוֹת גִּלְעָד
  choice: 到基列的拉末
  rationale: “基列的拉末”采用清楚而通行的汉语地名形式；结合运动动词，以“到”自然交代作战地点。
- source_word: וַיַּכּוּ
  choice: 击伤了
  rationale: 动词本义为击打；下文表明约兰受伤，因此译作“击伤”最贴合此处叙事语境。
theological_decisions:
- issue: אֲרָם及其族称的译法
  choice: 亚兰／亚兰人
  alternative: 叙利亚／叙利亚人
  rationale: 采用原文所指的古代历史名称，避免以较晚的地缘政治名称取代希伯来文本的称呼。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“照他们的计谋行事”既传达希伯来语隐喻的含义，也避免生硬直译；人名和地名沿用普通中文读者较熟悉的形式。
