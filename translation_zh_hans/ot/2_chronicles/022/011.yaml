- from: 但王的女儿约示巴[a]把亚哈谢的儿子约阿施从那些正被杀害的王子中偷偷带走，又把他和他的乳母安置在卧房[b]里。约示巴是约兰王的女儿、祭司耶何耶大的妻子；她因是亚哈谢的妹妹，就把约阿施藏起来，躲过亚他利雅，亚他利雅便没有杀死他[c]。
  to: 但王的女儿约示巴[a]把亚哈谢的儿子约阿施从那些正被杀害的王子中偷偷带走[d]，又把他和他的乳母安置在卧房[b]里。约示巴是约兰王的女儿、祭司耶何耶大的妻子；她是亚哈谢的妹妹，就把他藏起来，使他躲过亚他利雅；亚他利雅便没有杀死他[c]。
  rationale: 修订将藏匿行动的受益者明确为约阿施（“使他躲过亚他利雅”），同时仍依据上下文在正文中将末句主语译为亚他利雅，并以脚注保留希伯来文的语法歧义。另为“正被杀害”补加其可表示即将被处死的脚注，避免将分词的时态解释定死。
