  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: zh_hans
  text: 但王的女儿约示巴[a]把亚哈谢的儿子约阿施从那些正被杀害的王子中偷偷带走[d]，又把他和他的乳母安置在卧房[b]里。约示巴是约兰王的女儿、祭司耶何耶大的妻子；她是亚哈谢的妹妹，就把他藏起来，使他躲过亚他利雅；亚他利雅便没有杀死他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约示巴”在《列王纪下》11:2作“约示巴”。此处希伯来文名字的形式较长，也常译作“约示巴特”。
    reason: name_variant
  - marker: b
    text: 原文直译为“床铺的房间”。
    reason: lexical_alternative
  - marker: c
    text: 原文末句只以阴性单数动词表达“她没有杀死他”，没有明说主语。按上下文，这个“她”最可能指亚他利雅；语法上也可能指约示巴。
    reason: alternative_reading
  - marker: d
    text: 或译“从那些将被杀害的王子中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: 把……带走
  rationale: לקח的基本义是“拿、带”；结合婴孩获救的场景译作“把……带走”，不把“营救”的解释直接写入词义。
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: 偷偷带走
  rationale: גנב本义与“偷”有关，此处侧重秘密地将孩子带离；“偷偷带走”在现代汉语中自然，也保留隐秘行动的意味。
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: 从那些正被杀害的王子中
  rationale: 被动分词 הַמּוּמָתִים 可指正在遭处死的人，也可指将被处死的人；正文采用进行中的理解，并在脚注保留另一可能。
- source_word: מֵינִקְתּוֹ
  choice: 他的乳母
  rationale: 该词指哺乳照料幼儿的妇人；“乳母”准确且符合庄重叙事语体。
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: 在卧房里
  rationale: 字面为“床铺之室”；“卧房”简洁自然，同时由脚注说明原文形式。
- source_word: וַתַּסְתִּירֵהוּ
  choice: 把约阿施藏起来
  rationale: סתר意为“隐藏”；重述姓名可避免长句中男性代词指向不清。
- source_word: כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  choice: 她因是亚哈谢的妹妹
  rationale: כִּי在此引出行动理由；保留经文明确陈述的亲属关系及因果联系。
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: 躲过亚他利雅
  rationale: 该短语字面为“离开亚他利雅面前”，语境指藏在她无法发现、伤害之处；“躲过”是自然汉语表达。
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: 亚他利雅便没有杀死他
  rationale: 动词主语仅由阴性单数形式体现；按紧邻语境最可能指亚他利雅。正文明确主语以免汉语歧义，脚注保留希伯来文形式上的含混。
theological_decisions:
- issue: וְלֹא הֱמִיתָתְהוּ末句动词的主语
  choice: 正文将亚他利雅作为隐含主语：“亚他利雅便没有杀死他”。
  alternative: 也可把约示巴理解为主语，即“她没有杀死他”。
  rationale: 希伯来文动词仅标示阴性单数，没有明说主语；紧接“躲过亚他利雅”的上下文，以及整个救援情节，都更支持亚他利雅为主语，但文本的语法歧义应在脚注中保留。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。姓名依照常见简体中文圣经译名；通过重述“约阿施”和“亚他利雅”减少长句中的代词歧义。保留原文对处死状态及末句主语的真实含混，并以脚注说明。
