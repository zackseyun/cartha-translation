  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: zh_hans
  text: 于是，他回到耶斯列养伤，因为他与亚兰王哈薛交战时，他们在拉玛使他受了伤。犹大王约兰的儿子亚撒利雅[a]下到耶斯列，去看[b]亚哈的儿子约兰，因为他病了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 历代志此处写作“亚撒利雅”；同一位王在别处称为“亚哈谢”。
    reason: alternative_reading
  - marker: b
    text: “去看”也可译作“去探望”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב לְהִתְרַפֵּא
  choice: 于是，他回到……养伤
  rationale: וַיָּשָׁב承接叙事，译作“于是……回到”；לְהִתְרַפֵּא在受伤语境中指疗养、康复，“养伤”自然明确。
- source_word: בְיִזְרְעֶאל
  choice: 回到耶斯列／在耶斯列
  rationale: 第一处随运动动词，表达目的地；第二处是探望发生的地点。中文分别按语境处理。
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: 因为……他们……使他受了伤
  rationale: 原文直指别人击打他所造成的伤；译文保留因果关系，并以现代汉语自然表达伤势的形成。
- source_word: בָרָמָה
  choice: 在拉玛
  rationale: 依WLC本节所载地名音译，不与平行经文中的地名作无声协调。
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: 他与亚兰王哈薛交战时
  rationale: ב加不定式表达时间情境；לחם与宾语连用表示和某人交战。
- source_word: וַעֲזַרְיָהוּ
  choice: 亚撒利雅
  rationale: 正文保留本节马所拉文本所写的名字，不改成其他经文常用的“亚哈谢”。
- source_word: יָרַד
  choice: 下到
  rationale: 保留ירד所含“下去”的方向意味，同时符合圣经地理叙事的表达。
- source_word: לִרְאוֹת
  choice: 去看
  rationale: 保留ראה“看、见”的基本词义；此处语境也可理解为前去探望，故在脚注注明。
- source_word: יְהוֹרָם בֶּן אַחְאָב
  choice: 亚哈的儿子约兰
  rationale: 按希伯来文的完整名字יְהוֹרָם译作“约兰”，并保留父子关系。
- source_word: כִּי חֹלֶה הוּא
  choice: 因为他病了
  rationale: 直译其因果说明；חֹלֶה可指患病或因伤而处于病弱状态，此处不进一步限定。
theological_decisions:
- issue: 历代志叙事中的王名异体
  choice: 正文采用“亚撒利雅”
  alternative: 亚哈谢
  rationale: 本节希伯来文本写作עֲזַרְיָהוּ，故正文按原文保留“亚撒利雅”；脚注说明同一位王在别处称为“亚哈谢”，避免无声协调，也帮助读者辨认人物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“养伤”比“使自己得医治”更符合现代汉语；“下到”保留原文方向色彩。人名和地名按简体中文圣经常见译法处理，并将脚注标记置于其实际所解释的词语之后。
