  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: zh_hans
  text: 他做了在雅威眼中看为恶的事，如同亚哈家一样，因为在他父亲死后，他们作了他的谋士，以致他灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他败亡”；也可理解为“为要毁灭他”。希伯来语可指他们作他谋士所带来的毁灭性结果，也可指他们要毁灭他的目的。
    reason: 保留 לְמַשְׁחִית לוֹ 在结果与目的之间的语义歧义。
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 这是希伯来叙事中常见的评价用语；译文保留“行恶”的基本结构，同时用现代汉语自然表达。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象，并将圣名 יהוה 音译为“雅威”。
- source_word: כְּבֵית אַחְאָב
  choice: 像亚哈家一样
  rationale: כְּ 表示比较；“亚哈家”指亚哈的家族或王朝，不只指亚哈本人。
- source_word: הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: 他们作了他的谋士
  rationale: 保留原文代词“他们”，其语境所指是亚哈家的人；“谋士”准确表达 יוֹעֲצִים 的名词性用法。
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: 他父亲死后
  rationale: 以简洁自然的现代汉语表达原文“在他父亲死后”。
- source_word: לְמַשְׁחִית לוֹ
  choice: 最终使他走向毁灭
  rationale: 该结构可表达劝告所造成的毁灭性结果，也可能暗示毁灭他的目的；正文采取结果性表达，但不把谋士的主观意图说死。
theological_decisions:
- issue: 圣名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也与所提供审校层采用 Yahweh 相对应。
- issue: לְמַשְׁחִית לוֹ 表示结果还是目的
  choice: 按毁灭性结果理解
  alternative: 按谋士意图毁灭他理解
  rationale: 希伯来语介词 לְ 在此既可指结果，也可指目的。正文采用较少限定主观动机的结果性译法，并以脚注保留另一可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亚哈家”保留王朝、家族含义；分号呈现前后评价与原因的关系。
