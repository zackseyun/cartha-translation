  text: גַּם ה֣וּא הָלַ֔ךְ בְּ/דַרְכֵ֖י בֵּ֣ית אַחְאָ֑ב כִּ֥י אִמּ֛/וֹ הָיְתָ֥ה יֽוֹעַצְתּ֖/וֹ לְ/הַרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: zh_hans
  text: 他也行在亚哈家的道路上，因为他的母亲作他的谋士，使他行恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作他的谋士，使他行恶”也可译作“给他出主意，叫他作恶”。
    reason: 原文的名词性结构与使役式不定词可在汉语中分别采用较形式对应或较动态的表达。
lexical_decisions:
- source_word: גַּם הוּא
  choice: 他也
  rationale: 保留 גַּם 与独立代词所表达的追加和强调，表明这位王同样走上了此前恶王的道路。
- source_word: הָלַךְ בְּדַרְכֵי
  choice: 行在……的道路上
  rationale: 这里的“行”指生活方式和道德行为；译文保留希伯来文“行在道路上”的伦理性比喻，同时在现代汉语中仍易理解。
- source_word: בֵּית אַחְאָב
  choice: 亚哈家
  rationale: “家”兼有家族与王朝的含义，比直接译作“亚哈王朝”更贴近原文，也避免把所指范围解释得过窄。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他如此行事的原因，明确译出因果关系。
- source_word: הָיְתָה יֽוֹעַצְתּוֹ
  choice: 作他的谋士
  rationale: 保留原文名词性结构“是他的谋士／顾问”，并传达她持续影响他的角色，而不只是一回劝说。
- source_word: לְהַרְשִׁיעַ
  choice: 使他行恶
  rationale: 该使役式不定词表明她的谋划导向邪恶行为；“使他行恶”保留使役意味和原文明确的道德判断，但不增添原文未明说的心理动机。
theological_decisions:
- issue: 母亲的影响与王本人作恶之间的关系
  choice: 明确说母亲作他的谋士，使他行恶
  alternative: 他的母亲劝他作恶／在恶事上给他出主意
  rationale: 原文既指出母亲的引导，也仍以王为实际行恶者。译文不淡化经文的道德判断，也不把责任完全转移给母亲。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“行在……的道路上”保留经文常见的伦理性道路比喻；“谋士”准确呈现持续的顾问角色。脚注标记置于其所说明的分句之后。
