  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מֵֽ/אֱלֹהִ֗ים הָיְתָה֙ תְּבוּסַ֣ת אֲחַזְיָ֔הוּ לָ/ב֖וֹא אֶל יוֹרָ֑ם וּ/בְ/בֹא֗/וֹ יָצָ֤א עִם יְהוֹרָם֙ אֶל יֵה֣וּא בֶן נִמְשִׁ֔י אֲשֶׁ֣ר מְשָׁח֣/וֹ יְהוָ֔ה לְ/הַכְרִ֖ית אֶת בֵּ֥ית אַחְאָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: zh_hans
  text: 亚哈谢因前往约兰那里而遭败亡，这事出于上帝；亚哈谢来到以后，就与约兰一同出去，到宁示的儿子耶户那里[a]。雅威曾膏立耶户，为要剪除亚哈家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与约兰一同出去攻打耶户”，或“与约兰一同出去迎见耶户”。希伯来文直译是“到耶户那里”，但上下文显示这次相遇带有敌对性质。
    reason: 原文介词אֶל本身只表示“向、到”；究竟是攻打还是迎见，须由上下文推断。
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: 这事出于上帝
  rationale: מן表示来源；“出于上帝”忠实保留神圣因果关系，同时不进一步断定其方式是直接命定、护理安排还是许可。
- source_word: תְּבוּסַת אֲחַזְיָהוּ
  choice: 亚哈谢……遭败亡
  rationale: תְּבוּסָה含被践踏、溃败或毁灭之意；“败亡”在本段中自然涵盖亚哈谢的失败及最终覆亡。
- source_word: לָבוֹא אֶל יוֹרָם
  choice: 去约兰那里
  rationale: ל加不定式在此说明与败亡相连的行动或情境；译文借“而”维持二者的紧密关联，却不把因果机制说得过细。
- source_word: וּבְבֹאוֹ
  choice: 他到了以后
  rationale: ב加带后缀的不定式构成时间从句；“到了以后”自然表达事件次序，并保留原文未明说到达何处的简略。
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: 同约兰出去，往……耶户那里去
  rationale: יָצָא可指一般出行，也常用于军事行动；אֶל本义为“向、到”，正文保持中性，敌对或会面的语意可能性列入脚注。
- source_word: יְהוֹרָם / יוֹרָם
  choice: 约兰
  rationale: 希伯来文在本节使用该名的长短两种形式，但现代中文圣经人名惯例均作“约兰”；若强造两个中文名称，反会让读者误以为是两个人。
- source_word: מְשָׁחוֹ
  choice: 所膏立
  rationale: “膏立”既保留受膏的具体表达，也自然传达耶户被委任执行使命；“所”字结构表明该行动先于当前相遇。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译“雅威”，保留专名性质，不以称号代替。
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: 要剪除亚哈家
  rationale: “剪除”保留הכרית的审判性习语；“亚哈家”指亚哈的王朝、家族或家室。
theological_decisions:
- issue: 亚哈谢败亡中的神圣因果关系
  choice: 译作“这事出于上帝”，明确把败亡归因于上帝，却不界定上帝施行此事的具体方式。
  alternative: 可译作“这是上帝所命定的”或“这是上帝所容许的”。
  rationale: 原文明确陈述来源，却未说明这是直接命定、护理性审判还是许可性因果；正文保留这一神学张力。
- issue: 耶户受膏与剪除亚哈家的目的关系
  choice: 译作“耶户是雅威所膏立、要剪除亚哈家的”，使剪除亚哈家成为受膏使命的目的。
  alternative: 可较字面地译作“雅威膏了他，为要剪除亚哈家”。
  rationale: לְהַכְרִית自然表示目的；译文不淡化耶户使命所带有的神圣审判性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以分号和句号拆开希伯来文长句，避免中文关系从句过重；“败亡”“膏立”“剪除”保留历史叙事及审判语域。
