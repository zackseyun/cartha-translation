revisions:
- from: 亚哈谢去约兰那里而遭败亡，这事出于上帝；他到了以后，就同约兰出去，往宁示的儿子耶户那里去[a]。耶户是雅威所膏立、要剪除亚哈家的。
  to: 亚哈谢因前往约兰那里而遭败亡，这事出于上帝；亚哈谢来到以后，就与约兰一同出去，到宁示的儿子耶户那里[a]。雅威曾膏立耶户，为要剪除亚哈家。
  rationale: 修订只改善现代汉语的句法与行文：以“因……而……”表达原文中亚哈谢前往约兰与其败亡的关联；重复主语以消除“来到”的指向歧义；将有关耶户的关系从句展开为完整叙事句，保留雅威先前膏立耶户及“为要剪除亚哈家”的目的关系。正文仍将“到耶户那里”保持为中性说法，未把敌对行动作为确定事实写入正文。
