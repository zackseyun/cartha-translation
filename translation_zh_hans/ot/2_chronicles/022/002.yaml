  text: בֶּן אַרְבָּעִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲתַלְיָ֖הוּ בַּת עָמְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: zh_hans
  text: 亚哈谢登基时四十二岁[a]，在耶路撒冷作王一年。他母亲名叫亚他利雅[b]，是暗利的女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“四十二岁”。平行经文《列王纪下》8:26作“二十二岁”，因此有人认为这里存在文本问题，也有人提出应按另一种方式理解这个数字。
    reason: textual_variant
  - marker: b
    text: 或译“暗利的后裔”。希伯来语“女儿”有时可宽泛地指女性后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים וּשְׁתַּיִם שָׁנָה
  choice: 四十二岁
  rationale: 这是希伯来语表达年龄的惯用语；现代汉语自然地译为“四十二岁”，并保留马所拉文本的数字。
- source_word: בְמָלְכוֹ
  choice: 登基时
  rationale: 介词ב与该形式共同标明即位的时间；“登基时”简洁、自然，符合君王纪事的语体。
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: 作王一年
  rationale: 直接表达在位时长，并保留原文“一年”的明确数值。
- source_word: בִּירוּשָׁלָם
  choice: 在耶路撒冷
  rationale: 介词ב在此表示地点，按现代汉语常规译法处理。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 这是君王纪事中的固定表述；该译法准确而符合现代汉语习惯。
- source_word: עֲתַלְיָהוּ
  choice: 亚他利雅
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: בַּת עָמְרִי
  choice: 是暗利的女儿
  rationale: בַּת的直接词义是“女儿”；正文保留原文亲属称谓，不在翻译中预先解决谱系关系。
theological_decisions:
- issue: 亚哈谢登基年龄的年代张力
  choice: 正文保留马所拉文本的“四十二岁”
  alternative: 依照《列王纪下》8:26作“二十二岁”，或把四十二理解为与暗利王朝有关的另一种纪年
  rationale: 所给WLC文本明确作“四十二”。译文不静默校改或调和平行经文，而以脚注说明文本和年代上的难题。
- issue: “暗利的女儿”的谱系含义
  choice: 正文直译为“暗利的女儿”
  alternative: 暗利的女性后裔
  rationale: 原文使用普通亲属词“女儿”，但希伯来语亲属称谓有时可泛指后裔；正文保留直接措辞，脚注呈现较宽泛的可能含义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并保留历代志君王纪事的简洁句式。正文中的[a]、[b]与脚注一一对应；不在正文中消解年代与谱系张力。
