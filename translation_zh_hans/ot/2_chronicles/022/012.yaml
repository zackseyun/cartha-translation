  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֤י אִתָּ/ם֙ בְּ/בֵ֣ית הָֽ/אֱלֹהִ֔ים מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֖ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: zh_hans
  text: 约阿施和他们一起在上帝的殿[b]里藏身[a]六年；那时，亚她利雅统治着这地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被藏起来”。这里的希伯来语分词既可理解为反身的“藏身”，也可结合上下文描述他被隐藏的状态。
    reason: lexical_alternative
  - marker: b
    text: 指圣殿及其范围；原文字面意思是“上帝的家”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: 约阿施……在
  rationale: 上下文中的主语是约阿施。这里的叙事形式说明他持续处于该处；汉语用“在……六年”自然表达这种持续状态。
- source_word: אִתָּם
  choice: 和他们一起
  rationale: 介词及其复数后缀表示约阿施与藏匿、保护他的人同在；“他们”保留原文复数而不额外限定成员身份。
- source_word: בְּבֵית הָאֱלֹהִים
  choice: 在上帝的殿里
  rationale: 原文字面为“上帝的家／殿”，在此具体指圣殿；译作“上帝的殿”既符合语境，也保留原文的归属表达。
- source_word: מִתְחַבֵּא
  choice: 藏身
  rationale: Hitpael 分词具有反身或中间语态意味，“藏身”自然呈现约阿施处于躲藏状态，同时不排除他是由别人藏起来的这一语境含义。
- source_word: שֵׁשׁ שָׁנִים
  choice: 六年
  rationale: 汉语可直接用时段补语表达持续时间，无须另加介词。
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: 那时，亚她利雅统治着
  rationale: 分词表达与约阿施藏身六年同时持续发生的统治；“那时……统治着”清楚体现同步和延续。
- source_word: עַל הָאָרֶץ
  choice: 这地
  rationale: הָאָרֶץ 在此指犹大之地或其国土；“这地”直接而不过度具体化为“王国”。
theological_decisions:
- issue: 约阿施藏匿状态的施事关系
  choice: 正文译作“藏身”，脚注说明也可理解为“被藏起来”
  alternative: 被藏起来
  rationale: Hitpael 形式支持反身或中间语态理解，而上下文又明确有人保护并隐藏约阿施；保留两种可能，避免把语法和叙事情境之间的张力单向消解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上帝的殿”明确指向圣殿，又保留希伯来语“上帝的家／殿”的表达痕迹；用分号划分约阿施藏身与亚她利雅同期统治两个并行情景。
