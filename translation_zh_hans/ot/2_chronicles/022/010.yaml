base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: zh_hans
  text: 亚她利雅[a]，亚哈谢的母亲，见自己的儿子死了，就起来除灭了犹大家的一切王室后裔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文动词形式较难，字面是“说”；但本句上下文以及《列王纪下》11:1的平行记载支持“除灭”或“杀死”的意思。
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: 亚她利雅
  rationale: 按现代中文圣经人名惯例音译；句首叙事连接词不另译为“那时”或“于是”，以免增添原文没有明示的时间含义。
- source_word: אֵם אֲחַזְיָהוּ
  choice: 亚哈谢的母亲
  rationale: 自然表达希伯来语的属格结构，并清楚说明亚她利雅的身份。
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: 见自己的儿子死了
  rationale: רָאָה加כִּי表示察知事实；“死了”自然表达已经发生的死亡，也保留原句简洁直接的叙述。
- source_word: וַתָּקָם
  choice: 就起来
  rationale: קוּם在叙事中常引出果断行动；“起来”保留其字面意象和叙事力度，“就”自然承接前因后果。
- source_word: וַתְּדַבֵּר
  choice: 除灭了
  rationale: 马所拉文本的字形通常意为“说”，但在此与直接宾语搭配难以成立；上下文及列王纪下11:1的平行记载支持“消灭、杀死”的语义。“除灭”表达企图清除整个王室后裔的行动，同时不限定具体手段。
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: 所有的王室后裔
  rationale: זֶרַע本义为“种子、后裔”，在王朝语境中指具有王室血统的人；“王室后裔”既保留血脉含义，也符合现代汉语。
- source_word: לְבֵית יְהוּדָה
  choice: 犹大家
  rationale: בֵּית在此指王朝或家族。“犹大家”简洁表达这些后裔所属的犹大王朝，而非泛指犹大地区。
theological_decisions:
- issue: 疑难动词וַתְּדַבֵּר的译法
  choice: 按上下文译为“除灭了”
  alternative: 直译为“说了／向……说话”；或译为“使人杀死”
  rationale: 其通常词形虽指“说”，但后接“所有的王室后裔”作直接宾语，在本句中语义不通。列王纪下11:1的平行记载使用“除灭”一类动词，古代译本传统也支持杀害或消灭之意。正文采用语境所要求的意义，同时用脚注公开文本难点，不把问题隐藏起来。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“起来”这一带有希伯来叙事色彩的表达，但用“就”使中文衔接顺畅；“王室后裔”和“犹大家”兼顾普通读者的可懂度与王朝血统语境。脚注标记紧随存在文本难点的人名后的惯例位置，且正文含对应[a]标记。
