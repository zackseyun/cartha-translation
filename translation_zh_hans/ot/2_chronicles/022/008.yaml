source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: zh_hans
  text: 耶户向亚哈家施行审判时[a]，遇见了犹大的官长和亚哈谢兄弟的儿子[b]；这些人都在服侍亚哈谢。耶户就杀了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶户审判亚哈家时”。
    reason: 原词可较直接地译为“审判”；正文“施行审判”更自然地表现这里正在执行裁断的行动。
  - marker: b
    text: “亚哈谢兄弟的儿子”即亚哈谢的侄子。
    reason: 正文保留希伯来文的亲属关系表达，脚注说明现代汉语中相应的称谓。
lexical_decisions:
- source_word: כְּהִשָּׁפֵט
  choice: 施行审判时
  rationale: 保留שׁפט的司法、裁断意味，同时由כְּ表达时间关系；不将经文进一步解释为明确的神圣认可。
- source_word: עִם בֵּית אַחְאָב
  choice: 向亚哈家
  rationale: עִם在这里与带有敌对、惩治含义的行动连用，指审判所针对的对象；“亚哈家”保留家族与王朝的双重含义。
- source_word: שָׂרֵי יְהוּדָה
  choice: 犹大的官长
  rationale: שָׂרִים可指首领、官员或权贵；“官长”适合宫廷政治语境，又不把他们限定为王族。
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: 亚哈谢兄弟的儿子
  rationale: 按原文保留明确的亲属关系表达，不直接以“侄子”取代。
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: 这些人都在服侍亚哈谢
  rationale: 分词表示持续的侍奉或随侍状态；“这些人”自然地承接前述两组人，并避免“事奉”可能带来的专属宗教意味。
- source_word: וַיַּהַרְגֵם
  choice: 耶户就杀了他们
  rationale: הרג是直接表示杀死的常用动词；补出主语“耶户”使现代汉语指代清楚。
- source_word: וַיְהִי
  choice: 以“……时”的时间结构表达
  rationale: 该叙事公式在此引出随后发生的事件；汉语无需机械译成“事情发生了”，时间从句即可自然承载其叙事功能。
theological_decisions:
- issue: 耶户行动的司法性措辞是否表示明确的神圣认可
  choice: 译作“施行审判”，保留שׁפט的司法意味，但不增添“奉神之命”或“公义”等评价。
  alternative: 译作“惩罚”或“处置”，强化惩治结果而弱化司法措辞。
  rationale: 本节以司法性语言描述耶户的行动，却没有在本句中明确评价每一次杀戮；译文应保留这种张力，不作额外神学判定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亚哈家”沿用圣经叙事中的家族—王朝表达；将较长的希伯来语连句分为两句，以免误读修饰关系，并保持叙事力度。
