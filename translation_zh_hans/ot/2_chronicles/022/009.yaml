  text: וַ/יְבַקֵּשׁ֩ אֶת אֲחַזְיָ֨הוּ וַֽ/יִּלְכְּדֻ֜/הוּ וְ/ה֧וּא מִתְחַבֵּ֣א בְ/שֹֽׁמְר֗וֹן וַ/יְבִאֻ֣/הוּ אֶל יֵהוּא֮ וַ/יְמִתֻ/הוּ֒ וַֽ/יִּקְבְּרֻ֔/הוּ כִּ֤י אָֽמְרוּ֙ בֶּן יְהוֹשָׁפָ֣ט ה֔וּא אֲשֶׁר דָּרַ֥שׁ אֶת יְהוָ֖ה בְּ/כָל לְבָב֑/וֹ וְ/אֵין֙ לְ/בֵ֣ית אֲחַזְיָ֔הוּ לַ/עְצֹ֥ר כֹּ֖חַ לְ/מַמְלָכָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: zh_hans
  text: 耶户搜寻亚哈谢。亚哈谢藏在撒马利亚时，众人抓住了他，把他带到耶户那里，杀了他[a]。他们埋葬了他，因为他们说：“他是约沙法的儿子；约沙法曾全心寻求雅威。”亚哈谢家无力维持王权[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他死亡”。希伯来语动词为使役形式，字面意思是“使他死”。
    reason: lexical_alternative
  - marker: b
    text: 或译“亚哈谢家无力维持王国”。原文可指该王室家族无力保全或维系其统治。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ אֶת אֲחַזְיָהוּ
  choice: 耶户搜寻亚哈谢
  rationale: בקש表示寻找、搜寻。希伯来文动词为单数，主语由上下文判断为耶户；中文明说主语，以免与随后复数主语“众人”混淆。
- source_word: וַיִּלְכְּדֻהוּ
  choice: 众人抓住了他
  rationale: לכד指捕获、擒住；保留希伯来文复数施事者，与前面的单数主语形成区别。
- source_word: וְהוּא מִתְחַבֵּא בְשֹׁמְרוֹן
  choice: 亚哈谢藏在撒马利亚时
  rationale: התפעל分词表达当时正在藏匿的状态；以时间从句自然呈现，并保留地点“撒马利亚”。
- source_word: וַיְבִאֻהוּ אֶל יֵהוּא
  choice: 把他带到耶户那里
  rationale: 使役形态的 בוא 在此意为“带来”，中文按叙事语序直译。
- source_word: וַיְמִתֻהוּ
  choice: 将他处死
  rationale: מות 的使役形式字面为“使他死”；“处死”体现使役意义，又不额外断定正式司法程序。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 他们埋葬了他
  rationale: קבר在此为普通叙事用语，直译为“埋葬”。
- source_word: בֶּן יְהוֹשָׁפָט הוּא
  choice: 他是约沙法的儿子
  rationale: 按无动词名词句的直接引语语气翻译；“儿子”也可按王朝谱系关系理解为后裔，但正文不作扩展解释。
- source_word: אֲשֶׁר דָּרַשׁ אֶת יְהוָה
  choice: 约沙法曾……寻求雅威
  rationale: דרש以神为宾语时兼有敬虔寻求、倚靠之意；“寻求”保留其宗教与关系层面的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按其专名性质音译为现代中文常用形式“雅威”，不以称号替代。
- source_word: בְּכָל לְבָבוֹ
  choice: 全心
  rationale: 自然表达希伯来语“以全部的心”这一表示专一、完全委身的惯用语。
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: 亚哈谢家再没有力量保住王权
  rationale: 保留“家”所指的王室家族及其无力维持统治的意思；“王权”比具体疆域更贴近此处ממלכה的王朝政治语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文以“雅威”保留其专名身份，而不换成称号；“耶和华”是另一传统音译。
- issue: 末句所说亚哈谢家的处境
  choice: 王室家族无力保住王权
  alternative: 家中无人有能力治理国家
  rationale: 希伯来文“为王国留住力量”措辞凝练，可指王朝整体无法维持王权，也可理解为家中没有能够执政的人。正文采用前者，脚注保留后者。
- issue: 约沙法与亚哈谢的亲属称谓
  choice: 儿子
  alternative: 后裔
  rationale: בן可用于较广的父系后裔关系，但原文直接称“儿子”；正文保留原有称谓，不在翻译中改释谱系层级。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。叙事动词简洁连贯，区分原文单数主语耶户与复数施事者“众人”。直接引语保持自然口吻；涉及王朝延续的末句采用普通读者易懂的“保住王权”，并以脚注保存原文可能指“无人能够执政”的歧义。
