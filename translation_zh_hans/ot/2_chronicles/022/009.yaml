  naturalness: 语言庄重、清楚，人物与地点名称一致。改为“无力维持王权”比“再没有力量保住王权”更简练，也避免添加时间含义。
  terminology: “雅威”符合将四字神名作为专名音译的既定取向。“王权”可恰当表达末句所涉王朝统治；脚注应保留其可译作“王国/王位”的语义范围，但不将其扩大为“无人有能力治理国家”。
