base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: zh_hans
  text: 以色列众人见王不听从他们，就回答王说：“我们与大卫有什么份？与耶西的儿子没有产业可承。以色列啊，各回各的帐篷去吧！大卫啊，现在你顾好自己的家吧！”于是，以色列众人都回自己的帐篷去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回自己的帐篷”是叫众人各自散去的惯用说法，也可意译为“各自回家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: 听从
  rationale: 这里不是单指听见，而是指听取并接受百姓的诉求；“听从”准确传达其语境义。
- source_word: וַיָּשִׁיבוּ
  choice: 回答
  rationale: 该形式在此构成“作答、回应”的惯用表达，“回答”自然且贴近原文。
- source_word: חֵלֶק
  choice: 份
  rationale: 保留分得份额的比喻，也适合表达百姓否认自己与大卫王朝有政治关联。
- source_word: נַחֲלָה
  choice: 产业
  rationale: “产业”保留了分得之地、承受之业及家族传承的意味，比单纯的“关系”更贴近原文。
- source_word: בְּבֶן יִשַׁי
  choice: 在耶西的儿子中
  rationale: 保留介词结构及原文政治宣告的诗性张力，不直接释为“与耶西的儿子毫无关系”。
- source_word: אִישׁ לְאֹהָלֶיךָ
  choice: 各回各的帐篷去吧
  rationale: אִישׁ在这里作分配性用法；现代汉语用“各”即可自然表达逐一分散之意，同时保留“帐篷”的历史意象。
- source_word: רְאֵה בֵיתְךָ
  choice: 你顾好自己的家吧
  rationale: 这是对大卫王朝的斥退之语；“顾好自己的家”既自然，也保留“家”可指家室或王朝的含混性。
- source_word: לְאֹהָלָיו
  choice: 回自己的帐篷去了
  rationale: 原文在集合名词“以色列众人”之后使用单数领属形式，汉语以“众人都回自己的……”自然表达其分配性意义。
theological_decisions:
- issue: 对大卫王朝的政治决裂公式
  choice: “我们在大卫中有什么份呢？在耶西的儿子中，我们没有产业。”
  alternative: “我们与大卫有什么关系？耶西的儿子与我们无分。”
  rationale: 采用“份”和“产业”保留原文分配、继承及盟约历史的语言，不把它完全改写成现代政治口号。
- issue: בֵיתְךָ中“家”的指向
  choice: 保留“家”
  alternative: 明确译作“王朝”或“家事”
  rationale: 原文בַּיִת既可指家，也能指家族或王朝；保留“家”可维持其有意的双重意味，不替文本消除张力。
- issue: אִישׁ的阳性单数分配用法
  choice: 译为“各回各的……”
  alternative: “每个男人都回……”
  rationale: 此处阳性单数主要发挥群体中的分配功能，而非刻意限定男性；汉语“各回各的”准确表达语法作用，避免产生原文并未强调的性别排除。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事文体。引语保留原文简短有力的政治决裂措辞；“帐篷”“份”“产业”“家”等核心意象均予保留，并用一则脚注解释“回帐篷”的习语意义。
