base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: zh_hans
  text: “现在，我父亲使你们负了重轭，我还要加重你们的轭。我父亲用鞭子管教你们，我却要用蝎子[a]管教你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蝎子鞭”，可能指装有尖刺或倒钩的鞭子；希伯来文直译为“蝎子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס עֲלֵיכֶם עֹל כָּבֵד
  choice: 使你们负了重轭
  rationale: הֶעְמִיס是使役形，表示使人承担重负；译文保留“轭”的具体比喻，并以现代汉语自然表达使人负轭之意。
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: 我还要加重你们的轭
  rationale: 希伯来文直译为“我要在你们的轭上增加”；“加重你们的轭”在汉语中更自然，同时保留与前句相呼应的轭之比喻。
- source_word: יִסַּר
  choice: 管教
  rationale: 该动词兼有惩戒和纠正之意；“管教”保留这种语义张力，且符合现代庄重汉语。
- source_word: בַּשּׁוֹטִים
  choice: 用鞭子
  rationale: שׁוֹטִים指鞭子或用于抽打的鞭具；“鞭子”清楚、通俗。
- source_word: בָּעֲקְרַבִּים
  choice: 用蝎子
  rationale: 原文按字面是“蝎子”。正文保留这一强烈形象，不直接把可能的器具含义写入正文，并用脚注说明语境中的另一种理解。
