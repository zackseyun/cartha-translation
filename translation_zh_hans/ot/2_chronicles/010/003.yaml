base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: zh_hans
  text: 于是，他们派人去召耶罗波安[a]。耶罗波安和全以色列人都来了，对罗波安说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们派遣，又召他。”原文没有说明所派遣的对象，意思可能是“派人传话召他”。
    reason: 保留希伯来文中“派遣”宾语省略所产生的表达空间，并交代正文为符合中文习惯所作的补足。
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: 他们派人去召耶罗波安
  rationale: 希伯来文“派遣”的宾语省略，后面的“召他”表明派遣的目的。中文若直译为“他们派遣并召他”不自然，因此正文按语境译为“派人去召”，同时用脚注说明原文的省略结构。
- source_word: וַיָּבֹא
  choice: 都来了
  rationale: 原文动词为单数，以耶罗波安为主导主体，随后接“耶罗波安和全以色列”。现代汉语不标动词数，加入“都”可自然涵盖并列主体。
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: 耶罗波安和全以色列人
  rationale: “全以色列”在此指作为群体前来的以色列民众；译作“全以色列人”符合现代汉语，同时保留其全国性、共同体性的表达。
- source_word: וַיְדַבְּרוּ אֶל רְחַבְעָם
  choice: 对罗波安说
  rationale: דבר אל 意为“向……说话”。因 לֵאמֹר 紧接并引出下一节的直接引语，中文合并为自然的叙事表达“对……说”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该词引出下一节的直接引语；中文以冒号清楚标示引语将继续，避免生硬地译为“说道”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语体。“派人去召”比机械直译更易懂；句末用冒号表明本节的话语引介延续到下一节。
