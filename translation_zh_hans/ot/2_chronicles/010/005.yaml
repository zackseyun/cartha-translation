  text: And he said to them[a], “Come back to me in three days.” So the people went away.
translation:
  language: zh_hans
  text: 他对他们说：“三天后再来见我[a]。”百姓就离去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“再过三天，回到我这里来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 他对他们说
  rationale: 按希伯来语叙事链自然译出；中文无需机械保留句首连接词，也能清楚承接上文。
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: 再等三天
  rationale: 原文直译近于“再三天”，在此表示经过三天后再回来；补出“等”使现代中文自然，同时用脚注保留原文较简略的表达。
- source_word: וְשׁוּבוּ אֵלַי
  choice: 然后回来见我
  rationale: שׁוּב为复数命令式“回来/返回”，אֵלַי表示朝向说话者；“回来见我”符合中文会面语境，又保留返回到说话者这里的方向。
- source_word: וַיֵּלֶךְ הָעָם
  choice: 百姓就离去了
  rationale: “百姓”对应集合名词הָעָם；“就”体现叙事上的顺承结果，“离去了”自然表达他们依命退去。
