  yaml_path: translation/ot/2_chronicles/010/013.yaml
  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: zh_hans
  text: 王严厉地回答了他们[a]；罗波安王撇弃了长老们的劝告[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用严厉的话回答他们。”
    reason: 原文קָשָׁה形式上为形容词，在这里可理解为描述回答的严厉性质或方式。
  - marker: b
    text: 或译：“放弃了长老们的建议。”
    reason: עזב有“离开、撇弃、放弃”之意，עֵצָה也可译作“建议”。
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: 回答他们
  rationale: ענה在此表示回应，第三人称复数宾语后缀明确指“他们”，因此将宾语译出。
- source_word: קָשָׁה
  choice: 严厉地
  rationale: 该词形式上是“严厉、强硬”，在句中修饰“回答”；译作“严厉地”符合现代汉语表达，也保留回应强硬严峻的语气。
- source_word: וַיַּעֲזֹב
  choice: 丢弃了
  rationale: עזב可指离开、撇弃或放弃；此处宾语是长老们的劝告，“丢弃”体现罗波安将其搁置不用，又不额外说明他的动机。
- source_word: עֲצַת הַזְּקֵנִים
  choice: 长老们的劝告
  rationale: עֵצָה在此指所提出的意见或劝告；זְקֵנִים指具有资历和顾问身份的长老，而不只是年老的人。
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: 罗波安王
  rationale: 原文以同位结构说明这位王就是罗波安；“罗波安王”是自然简洁的现代汉语表达。
