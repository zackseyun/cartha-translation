base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/001.yaml
  text: Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: zh_hans
  text: 罗波安前往示剑，因为以色列众人都来到示剑，要立他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁכֶמָה / שְׁכֶם
  choice: 示剑
  rationale: 采用该地名通行的中文音译；方向词尾所表达的“往”由“前往”自然体现。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出罗波安前往示剑的原因，与上下文逻辑相符，同时保留原文直接的因果关系。
- source_word: כָל יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 表达原文“全以色列”的集合性概括，避免让现代读者误解为毫无例外的逐一个人。
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: 要立他作王
  rationale: 准确表达使役词形，即众人来拥立他成为王，而非仅承认既成事实。
theological_decisions:
- issue: “以色列众人”的范围
  choice: 保留原文的整体性政治称谓“以色列众人”
  alternative: 以色列各支派的代表
  rationale: 原文没有明说是代表，因此不把合理的历史推断写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体；语序贴近自然普通话，并保留原文简洁的因果结构。
