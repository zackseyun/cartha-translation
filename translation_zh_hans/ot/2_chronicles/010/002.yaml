base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: zh_hans
  text: 尼八的儿子耶罗波安听见了这事[a]——那时他在埃及；他先前为躲避所罗门王，逃到了那里[b]——就从埃及回来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“听见了”。希伯来原文没有明说他听见什么，具体内容由上下文补足。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他从所罗门王面前逃走。”“那里”回指埃及。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: ……听见了……就……
  rationale: “ויהי”接介词כ与不定式构造，在叙事中引出时间从句。现代汉语用“……就……”自然表达事件承接，无须生硬译出“事情发生了”。
- source_word: יָרָבְעָם בֶּן־נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 按现代中文圣经人名惯例音译专名，并直接表达父子身份。
- source_word: שְׁמֹעַ
  choice: 听见了这事
  rationale: 希伯来文本没有明说“听见”的宾语，上下文却可补足所听见的事。中文为求自然补入“这事”，并用脚注保留原文的省略。
- source_word: וְהוּא בְמִצְרַיִם
  choice: 那时他在埃及
  rationale: 该代词句提供背景信息；“那时”在现代汉语中清楚表明这是主句事件发生时的处境。
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: 他先前为躲避所罗门王，逃到了那里
  rationale: “אשר”回指埃及，“ברח”表示逃走；“מפני”字面与“面前”有关，在本语境表示因所罗门王的威胁或追逼而躲避他。“先前”体现相对于当前叙事的既往动作。
- source_word: וַיָּשָׁב
  choice: 就……回来了
  rationale: “שוב”在此表示从埃及返回，不涉及悔改等神学含义；“就”承接前面的时间条件。
- source_word: מִמִּצְרָיִם
  choice: 从埃及
  rationale: 介词מן标明返回的起点。
