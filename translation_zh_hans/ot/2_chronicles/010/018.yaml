  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: zh_hans
  text: 罗波安王差派掌管劳役的哈多兰[a]前去。以色列人却用石头砸他，他就死了。罗波安王奋力[b]登上战车，逃往耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“哈多兰”；平行记载《列王纪上》12:18作“亚多兰”。
    reason: 保留平行经文中人名形式的差异。
  - marker: b
    text: “奋力”所译的希伯来文直译为“使自己刚强”；也可理解为他竭力或急忙登上战车。
    reason: 说明原词的字面意义及其在紧急逃亡语境中的译法差异。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 差派
  rationale: 叙事中自然、庄重地表达“派遣”，并保留王所采取行动的主动性。
- source_word: הֲדֹרָם
  choice: 哈多兰
  rationale: 按《历代志下》马所拉文本的名称形式音译；平行经文的不同形式另见脚注。
- source_word: אֲשֶׁר עַל הַמַּס
  choice: 掌管劳役的
  rationale: מַס在这里指国家征派的劳役，而非一般税款；这一表达简洁地说明哈多兰的职务。
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: 用石头砸他
  rationale: 同时体现希伯来文的投石动作和明确出现的“石头”，又避免汉语中不自然的同义重复。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是民族称谓；译作“以色列人”符合现代汉语习惯，也不把原文习语误解为仅指男性后裔。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: 保留简洁的叙事结果，并自然承接投石行为。
- source_word: הִתְאַמֵּץ
  choice: 奋力
  rationale: 该词的反身形态表示使自己刚强、鼓起力量；“奋力”既保留自我振作和用力的意味，也符合紧急逃生的语境，而不直接改译为表示速度的“赶紧”。
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: 登上战车
  rationale: 保留עלה的向上、登乘意象；“登上战车”在现代汉语中自然且庄重。
- source_word: לָנוּס יְרוּשָׁלָם
  choice: 逃往耶路撒冷
  rationale: נוס明确表示逃跑、逃离危险，“逃往”也准确表达耶路撒冷是目的地。
theological_decisions:
- issue: הִתְאַמֵּץ所表达的是自我刚强还是行动急速
  choice: 奋力
  alternative: 赶紧、急忙
  rationale: 原词来自表示刚强、坚固的词根，并非通常表示迅速的词根；正文保留自我振作、用力逃生的含义，不将上下文中的紧迫感替代为词本身的意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“掌管劳役”避免把מַס误解为单纯税务；“用石头砸他”保留原文明确提到石头的具体性；“奋力登上战车”保留词根含义，同时使中文行文自然。所有脚注标记均置于相关正文之后。
