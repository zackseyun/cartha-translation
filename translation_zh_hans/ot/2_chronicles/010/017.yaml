  yaml_path: translation/ot/2_chronicles/010/017.yaml
  text: But Rehoboam reigned over the children of Israel who lived in the cities of Judah[a].
translation:
  language: zh_hans
  text: 但住在犹大各城的以色列人[a]，罗波安作他们的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译：“以色列的子孙”。
    reason: 说明“以色列人”所对应的希伯来语族群称谓之字面形式。
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: 但……以色列人
  rationale: בְּנֵי יִשְׂרָאֵל在这里是指以色列民族成员的惯用称谓，译为“以色列人”自然准确；句首וּ结合上文北方支派背叛罗波安的语境，译作“但”以表达转折。
- source_word: הַיֹּשְׁבִים
  choice: 住在
  rationale: ישׁב的分词在此表示持续居住，现代汉语用“住在”简洁自然。
- source_word: בְּעָרֵי יְהוּדָה
  choice: 犹大各城
  rationale: 该短语指犹大境内的城邑；“各城”符合汉语表达，也保留复数含义。
- source_word: וַיִּמְלֹךְ עֲלֵיהֶם
  choice: 仍作他们的王
  rationale: מלך על表示对某群体行使王权。“作他们的王”准确传达此义；“仍”根据上下文突出北方背叛之后这些居民依旧归罗波安统治，并非另立新王。
- source_word: רְחַבְעָם
  choice: 罗波安
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions: []
