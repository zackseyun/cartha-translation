  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: zh_hans
  text: 可是，罗波安弃绝了长老们给他的建议，反而去和那些同他一起长大、站在他面前的年轻人商议。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站在他面前”也可译作“侍立在他面前”“在他面前供职”或“服侍他”；这是宫廷用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: 弃绝了
  rationale: 该动词可指离弃、撇下；这里不是暂且搁置，而是拒绝长老的建议，转而另求意见，因此译为“弃绝了”。
- source_word: עֲצַת הַזְּקֵנִים
  choice: 长老们……的建议
  rationale: “长老”兼顾年龄与资深顾问的身份；“建议”符合现代汉语，也准确表达עֵצָה在本句中的意思。
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: 给他的
  rationale: 与前面的“建议”自然组合为“长老们给他的建议”，避免重复译成“建议他的建议”。
- source_word: וַיִּוָּעַץ אֶת
  choice: 去和……商议
  rationale: 该形式在这里表示与人共同磋商；“和……商议”既自然，又保留互动协商之意。
- source_word: הַיְלָדִים
  choice: 年轻人
  rationale: 这些人是与王一同长大并在宫廷中侍立的同辈，并非幼童；“年轻人”最符合语境。
- source_word: גָּדְלוּ אִתּוֹ
  choice: 同他一起长大
  rationale: 直接保留共同成长的关系，表达自然清楚。
- source_word: הָעֹמְדִים לְפָנָיו
  choice: 侍立在他面前
  rationale: “站在某人面前”在宫廷语境中可表示随侍或服事。“侍立”既保留站立的意象，又提示其宫廷含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是……反而……”清楚呈现两项行动的转折；“罗波安”从上下文补出主语，使独立经节在中文中清晰。脚注标记置于整句之后，对应“侍立在他面前”。
