base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: zh_hans
  text: 他们对他说：“你若善待这百姓，取悦他们，并对他们说好话，他们就会始终作你的臣仆[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“他们就会一直服事你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  choice: 善待这百姓
  rationale: 这个结构表达对某人有益、以良善相待；“善待”在现代汉语中自然简洁，也保留了良善统治这一较宽泛的关系含义。
- source_word: וּרְצִיתָם
  choice: 使他们喜悦
  rationale: רצה 在此可指使对方满意、赢得对方的好感，也可能指向对他们施恩。“使他们喜悦”符合劝王采取安抚行动的语境，同时以脚注保留另一种理解。
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: 对他们说好话
  rationale: 保留 דבר 与 דברים 的同词根表达以及 טוב 的“好”义；汉语自然，并未将其过度收窄为仅仅语气温和。
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: 作你的臣仆
  rationale: 这里描述百姓对君王的政治效忠和服事，而非动产奴隶制度。“臣仆”既保留谓语名词结构，也符合君臣语境。
- source_word: כָּל הַיָּמִים
  choice: 始终
  rationale: 该希伯来语惯用语直译为“所有的日子”，在此表示持续不断。“始终”是自然庄重的现代汉语，并避免武断限定为谁的一生。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“百姓”符合政治共同体语境；“臣仆”体现对王的忠诚服事而不引入不当的奴隶制含义。脚注标记均置于所解释的相应短语之后。
