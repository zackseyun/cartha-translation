base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: zh_hans
  text: 他对他们说：“你们有什么建议，好让我们回答这百姓？他们对我说：‘求你减轻你父亲加在我们身上的轭[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轭”也可按比喻义译为“重担”。希伯来文此处直译为“从这轭减轻”，所减轻的负担由上下文补足；“轭”比喻强加的劳役或统治。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֽוֹעָצִים
  choice: 有何建议
  rationale: 该词源自יעץ，表示提出意见、谋略或劝告；“有何建议”在现代汉语问话中自然，并保留征询谋议的含义。
- source_word: וְנָשִׁיב דָּבָר
  choice: 好让我们回复
  rationale: שׁוב与דָּבָר连用，在此意为作出答复；结合上下文，“好让我们回复”自然表达征求建议的目的。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留希伯来文单数集合名词的表达；“这百姓”符合庄重的历史叙事语体。
- source_word: דִּבְּרוּ אֵלַי
  choice: 他们对我说
  rationale: 准确传达此前向王提出请求的动作；汉语无需借助完成时形式，也能由上下文表明其先行性。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出直接引语的引述形式，在汉语中自然融入“他们对我说”。
- source_word: הָקֵל
  choice: 减轻
  rationale: 使役形式在此表示使某物变轻；“减轻”既准确又适合与“轭”搭配。
- source_word: מִן הָעֹל
  choice: 轭
  rationale: עֹל本义为套在牲畜颈上的轭，此处比喻强加的劳役或统治；正文保留具体意象。
- source_word: נָתַן ... עָלֵינוּ
  choice: 加在我们身上
  rationale: 表达外在强加的负担，并与“轭”的比喻自然搭配。
- source_word: אָבִיךָ
  choice: 你父亲
  rationale: 忠实表达对罗波安所用的第二人称单数所属形式。
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 他对他们说
  rationale: 以现代汉语常用的叙事衔接方式表达希伯来文连续叙事形式，无需机械译出句首连接词。
