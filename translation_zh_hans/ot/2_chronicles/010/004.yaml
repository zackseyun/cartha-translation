base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: zh_hans
  text: “你父亲使我们的轭难以承受[a]。现在，求你减轻你父亲的苛苦劳役和他加在我们身上的重轭，我们就服事你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “难以承受”也可译作“严酷”或“艰难”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: 使我们的轭难以承受
  rationale: הִקְשָׁה是使役形，表示使某物艰难、严酷；结合“轭”的负担意象，译为“难以承受”既保留使役关系，也符合现代汉语表达，且不与后文表示重量的כָּבֵד完全混同。
- source_word: עֻלֵּנוּ / עֻלּוֹ
  choice: 我们的轭 / 重轭
  rationale: עֹל本指套在牲畜身上的轭，此处比喻王权之下的沉重负担。保留“轭”可维持原文贯穿全句的具体意象。
- source_word: הָקֵל
  choice: 减轻
  rationale: 该命令式要求罗波安减少百姓所承受的负担；“减轻”自然简洁，也与轭和苦役的语境相配。
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: 你父亲加给我们的苦役
  rationale: עֲבֹדָה可指工作、劳役或服事；在王权统治的语境中，“苦役”传达被强加的劳作或义务。原文关系结构由后面的“加给我们”统摄，中文前置宾语以求清楚自然。
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: 和重轭
  rationale: כָּבֵד明确表示沉重；“重轭”保留字面重量及其压迫性隐喻。中文省略重复的“他的”，因“你父亲加给我们的”可自然同时修饰“苦役”和“重轭”。
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: 加给我们的
  rationale: נָתַן עַל字面为“放在……之上”，在负担语境中可自然译作“加给”，既保留施加之意，又避免过度解释为某一种具体政策。
- source_word: וְנַעַבְדֶךָּ
  choice: 我们就服事你
  rationale: 未完成式在此表达百姓以减轻负担为条件所作的承诺。“就”清楚呈现语境中的条件后果关系；“服事”既可指臣服效忠，也呼应עבד词根。
