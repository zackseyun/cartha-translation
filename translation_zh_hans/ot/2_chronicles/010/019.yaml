  language: zh_hans
  text: 于是，以色列背叛大卫家，直到今日[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，以色列一直反叛大卫家，直到今日。”希伯来语动词可译为单纯过去的“背叛”，也可结合“直到今日”理解为强调持续的反叛状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: 就背叛了
  rationale: פשע在此指臣民反叛统治权；“背叛”准确传达政治性的反叛或叛离，比泛指道德过犯的译法更符合上下文。叙事形式译为过去时，而“直到今日”表明其后果或状态持续存在。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留专名；在本段语境中指与大卫王朝分离的北方支派整体，不在正文中解释性扩写。
- source_word: בְּבֵית דָּוִיד
  choice: 大卫家
  rationale: ב与פשע连用可标示反叛所针对的对象；“大卫家”保留בֵית的王朝、家系含义。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是常见的时间表达，表示有关局面延续到叙述者所处的时代；“直到今日”庄重自然，并保留原文视角。
