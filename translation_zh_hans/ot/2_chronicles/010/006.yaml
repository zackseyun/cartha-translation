base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: zh_hans
  text: 于是，罗波安王向那些曾在他父亲所罗门在世时侍立在所罗门面前的长老们请教，说：“你们建议我怎样答复这百姓？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: 请教
  rationale: 此处יעץ的尼法勒式表示向他人寻求意见；“请教”自然地传达了罗波安征询长老意见的意思。
- source_word: הַזְּקֵנִים
  choice: 长老们
  rationale: זקנים在此指年长且具有顾问身份的人；“长老们”既贴近原文，也符合叙事语境。
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: 侍立在……面前
  rationale: 保留“站在某人面前”的希伯来语意象，同时“侍立”能自然体现其在君王面前供职、随侍的含义。
- source_word: שְׁלֹמֹה אָבִיו
  choice: 他父亲所罗门
  rationale: 按现代汉语习惯调整语序，同时完整保留所罗门与罗波安的父子关系。
- source_word: בִּהְיוֹתוֹ חַי
  choice: 在世时
  rationale: 简洁、自然地表达所罗门仍活着的时期，不增加原文没有明说的含义。
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: 你们建议我怎样
  rationale: “建议我怎样”自然表达众长老应为王提出答复方式；“我”是汉语中依据语境补出的受事。
- source_word: לְהָשִׁיב לָעָם הַזֶּה דָּבָר
  choice: 答复这百姓
  rationale: 原文直译为“向这百姓回一个话”；“答复这百姓”准确传达该希伯来语习语，并保持简洁。
