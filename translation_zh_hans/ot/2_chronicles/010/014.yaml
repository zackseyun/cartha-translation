base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: zh_hans
  text: 他照着那些年轻人的主意对民众说：“我要使你们的轭更重，还要再加重它。我父亲用鞭子管教你们，我却要用蝎子[a]管教你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用蝎子鞭”，即可能指装有尖刺或倒钩的鞭子；希伯来文直译为“用蝎子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: 他……对民众说
  rationale: דבר是“说、讲话”的常用动词；אֲלֵהֶם直译为“对他们”。结合上下文，以“民众”明确代词所指，符合现代汉语表达。
- source_word: כַּעֲצַת הַיְלָדִים
  choice: 照着那些年轻人的主意
  rationale: עֵצָה指主意、劝告或谋略；יַלָדִים在此不是幼童，而是与罗波安一同长大的年轻谋士。“照着……的主意”自然表达前缀כ所含的依照之意。
- source_word: אַכְבִּיד אֶת־עֻלְּכֶם
  choice: 我要使你们的轭更重
  rationale: כבד的使役式表示“使……沉重”；עֹל本义为“轭”，在此喻指劳役和重担。保留“轭”的形象，并以“更重”体现原有负担将被加剧。
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: 还要再加重它
  rationale: יסף与עַל连用表示在原有事物上增加；“它”回指“轭”。译为“加重”比生硬的“加在它上面”更符合汉语，同时保留递增之意。
- source_word: יִסַּר אֶתְכֶם
  choice: 管教你们
  rationale: יסר可指管教、惩戒或责打。此处带有强制惩罚意味，但“管教”保留该词较宽的语义范围，具体严厉程度由后面的刑具显明。
- source_word: בַּשּׁוֹטִים
  choice: 用鞭子
  rationale: שׁוֹט指鞭子或刑鞭；“鞭子”是清楚、通行的现代汉语。
- source_word: בָּעֲקְרַבִּים
  choice: 用蝎子
  rationale: עַקְרָב本义为“蝎子”。正文保留希伯来文鲜明而可能带隐喻性的说法，不直接替换成解释性的“带刺刑鞭”；可能的器具含义放入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“轭”和“蝎子”这两个原文意象；脚注标记置于其实际说明的“蝎子”之后。引语中保留原文由“我父亲……我却……”形成的强烈对比。
