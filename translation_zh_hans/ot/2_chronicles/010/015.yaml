id: 2CH.10.15
reference: 2 Chronicles 10:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: zh_hans
  text: 王没有听从百姓，因为这事的发展[a]是出于上帝，为要使雅威坚立他借着示罗人亚希雅向尼八的儿子耶罗波安所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事的缘由”。希伯来语名词可指转变、情势，或促成事情发展的缘由。
    reason: 保留 נְסִבָּה 的词义范围及其不同理解。
lexical_decisions:
- source_word: שָׁמַע אֶל־הָעָם
  choice: 听从百姓
  rationale: 这里不是单指听见声音，而是指留意并接受百姓的请求。“听从”简洁自然，同时不必强化为完全服从。
- source_word: נְסִבָּה
  choice: 事态的这一转变
  rationale: 该名词可指转变、情势或促成事情发展的缘由；正文采用叙事性较强的表达，并以脚注保留“缘由”的可能译法。
- source_word: מֵעִם הָאֱלֹהִים
  choice: 出于上帝
  rationale: 直接表达该事态转变的神圣来源，不把上帝的作用弱化，也不把经文改写成上帝直接迫使王拒绝百姓。
- source_word: לְמַעַן
  choice: 为要
  rationale: 保留原文明确的目的意味，语体庄重而易懂。
- source_word: הָקִים
  choice: 坚立
  rationale: 使役词形本义为“使之站立”，此处指使所说的话确立、实现；“坚立”保留原文意象，避免直接窄化为“应验”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的形式音译四字神名，保留其作为专名的功能，而不以称号代替。
- source_word: דְּבָרוֹ
  choice: 他的话
  rationale: 保留该词宽泛的语义，使上下文表明这是先前宣告的预言，不擅自限定为“应许”或“信息”。
- source_word: בְּיַד
  choice: 借着
  rationale: 这是表示媒介或代理的常见希伯来语习语；“借着”自然表达亚希雅作为传话者的角色。
- source_word: הַשִּׁלוֹנִי
  choice: 示罗人
  rationale: 按现代汉语自然表达其地域身份，即来自示罗的人。
- source_word: בֶּן נְבָט
  choice: 尼八的儿子
  rationale: 明确保留希伯来语父名结构，符合现代汉语叙事表达。
theological_decisions:
- issue: 上帝的主权与王的人的行动
  choice: 王没有听从百姓，因为事态的这一转变是出于上帝
  alternative: 王没有听从百姓，因为事情的缘由出于上帝
  rationale: 原文一方面把拒绝百姓记为王的真实行动，另一方面明确说事情的发展出于上帝。译文并置两者，不削弱神圣主权，也不把上帝说成经文未明言的直接强迫者。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留神名而不用“主”这一称号代替；“耶和华”是现代简体中文读者最熟悉、可辨识度最高的专名形式。
- issue: הָקִים 与预言实现的关系
  choice: 坚立他的话
  alternative: 应验他的话
  rationale: “坚立”较贴近使役词形“使之站立、确立”的表达，也容纳话语得到确认和实现的含义，而不在正文中只保留“应验”这一解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“事态的这一转变”承接叙事发展；“为要”“坚立”略带经文语体，但普通读者仍易理解。脚注标记[a]紧随其所解释的词组。
