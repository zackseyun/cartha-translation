base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: zh_hans
  text: 第三天，耶罗波安和众百姓都来到罗波安那里，正如王先前所说：“第三天再到我这里来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא 可按叙述视角译为“来、去、到达”；与 אֶל רְחַבְעָם 连用时，“来到罗波安那里”在现代汉语中自然明确。
- source_word: יָרָבְעָם
  choice: 耶罗波安
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְכָל הָעָם
  choice: 和众百姓都
  rationale: עָם 在此泛指与耶罗波安同来的人群，并非正式会众；“众百姓”保留整体含义，而“都”自然表达 כָל。
- source_word: אֶל רְחַבְעָם
  choice: 罗波安那里
  rationale: אֶל 表示朝向某人；结合“来到”，译作“来到罗波安那里”符合现代汉语习惯。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 第三天
  rationale: 直接保留希伯来文的时间表达，无需补出“之后”。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达实际行动与王先前所说的话完全相符。
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: 王先前所说
  rationale: דבר 是一般性的“说、讲”；“先前”在汉语中自然体现该话发生在本节行动之前，不强化为“命令”。
- source_word: לֵאמֹר
  choice: 所说：
  rationale: 该不定式用于引出先前话语的内容；汉语以冒号直接引语更自然，无需机械译作“说”。
- source_word: שׁוּבוּ אֵלַי
  choice: 再到我这里来
  rationale: שׁוב 的核心义为“返回、再来”；在王要求众人三天后回来见他的语境中，此译法自然传达返回之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“第三天”的原文表述及话语重复；人名使用简体中文通行译名。原文不存在需要以脚注保留的实质歧义；שׁוּבוּ אֵלַי 在本语境中译为“再到我这里来”已兼顾“返回”与朝说话者而来的方向。
