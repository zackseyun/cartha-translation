  text: וַ/יְדַבְּר֣וּ אִתּ֗/וֹ הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֡ר לָ/עָם֩ אֲשֶׁר דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תֹּאמַ֣ר אֲלֵ/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: zh_hans
  text: 那些与他一同长大的年轻人对他说：“你要这样对那些曾对你说：‘你父亲使我们的轭沉重，但你要把我们身上的轭减轻。’的百姓说：你要这样对他们说：‘我的小指头[a]比我父亲的腰[b]还粗。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“我的小处（或：我的小者）”；这里通常按习语理解为“我的小指头”。
    reason: 说明原文词语的字面含义及正文所采用的习语释义。
  - marker: b
    text: “腰”也可译作“腰部”或“腰间”。
    reason: 保留מָתְנַיִם所指身体部位的词义范围。
lexical_decisions:
- source_word: הַיְלָדִים
  choice: 年轻人
  rationale: 该词本可指孩子或少年，但这里有“和他一起长大”的限定，所指是与罗波安同辈的年轻谋士；“年轻人”符合语境，也自然易懂。
- source_word: גָּדְלוּ אִתּוֹ
  choice: 和他一起长大的
  rationale: 这一表达指共同成长，译文保留他们与罗波安自幼相伴的关系。
- source_word: כֹּה תֹאמַר
  choice: 你要这样回答他们
  rationale: כֹּה引出应当照说的话，תֹאמַר带有指示语气；鉴于前文已经明确百姓向王说话，此处用“回答”符合汉语语境而不改变言语行为。
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: 你父亲使我们的轭沉重
  rationale: 保留原文“轭”的具体比喻及“使……沉重”的表达，不将其完全释义为一般性的负担。
- source_word: הָקֵל מֵעָלֵינוּ
  choice: 减轻我们身上的重担
  rationale: 原文动词“使轻省”省略了宾语，由前面的“轭”补足；מֵעָלֵינוּ具有从我们身上卸下、减轻之意。中文若直译“使它从我们身上轻些”不自然，因此以“减轻我们身上的重担”传达其空间意象和请求内容。
- source_word: קָטָנִּי
  choice: 我的小指头
  rationale: 字面形式较含混，近于“我的小处／我的小者”，但在这一夸张的人体比较中通常理解为“小指头”；正文采用可理解的惯用释义，并以脚注保留字面信息。
- source_word: עָבָה
  choice: 比……还粗
  rationale: 该词表示粗、厚，配合比较介词מִן；汉语“比……还粗”自然地表达夸张比较。
- source_word: מִמָּתְנֵי אָבִי
  choice: 比我父亲的腰
  rationale: מָתְנַיִם指腰或腰胯、腰部；“腰”在现代汉语中清楚自然，脚注说明也可译作“腰胯”。
