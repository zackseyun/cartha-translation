  to: 那些与他一同长大的年轻人对他说：“你要这样对那些曾对你说：‘你父亲使我们的轭沉重，但你要把我们身上的轭减轻。’的百姓说：你要这样对他们说：‘我的小指头[a]比我父亲的腰[b]还粗。’”
  rationale: 修订恢复原文连续两次“你要这样说”的结构，删除“现在求你”这一非明示补充，并将省略的宾语明确为“轭”，同时维持现代汉语的可读性、庄重叙事语体和脚注锚点。
