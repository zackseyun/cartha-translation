base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: zh_hans
  text: 他的儿子们、许多针对他的宣告[a]，以及上帝殿的根基——看哪，这些都记在《列王记》的米德拉什[b]中。他的儿子亚玛谢接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “许多针对他的宣告”所译的希伯来文较难理解；也可能译作“加在他身上的重担之大”或“大量关于他的神谕”，甚至可能指“加给他的沉重贡赋”。
    reason: lexical_alternative
  - marker: b
    text: “米德拉什”（מִדְרַשׁ）在这里可能指与《列王记》有关的解释性记录、阐释或注释。
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: 他的众子
  rationale: 按复数名词及第三人称阳性单数后缀直译；句首的 waw 不另加“现在”，以免引入原文没有的时间意味。
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: 许多针对他的宣告
  rationale: מַשָּׂא 可指“重担”或带权威性的“宣告、神谕”；此处含义困难，正文采用较自然且不过度限定为预言体裁的“宣告”，其他可能保留在脚注。
- source_word: וִיסוֹד בֵּית הָאֱלֹהִים
  choice: 上帝殿的奠基工程
  rationale: יסוד 来自“奠基、建立”词根；结合本章圣殿修缮的语境，“奠基工程”既保留词根意象，也避免把它简单解释成初次建殿。בֵּית הָאֱלֹהִים 在此自然译作“上帝殿”。
- source_word: הִנָּם כְּתוּבִים
  choice: 看哪，这些事都记在
  rationale: “看哪”保留 הִנָּם 的指示与强调作用；“都记在”以自然中文表达被动记载。
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: 记在《列王记释义》上
  rationale: מִדְרַשׁ 在此可能指与《列王记》相关的解释性记录、阐释或注释；译作“释义”使现代普通读者易懂，同时不把它等同于后世特定体裁。
- source_word: וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַחְתָּיו
  choice: 他儿子亚玛谢接替他作王
  rationale: 自然表达希伯来文标准的王位继承公式，保留“其子”与“代替他”的信息。
