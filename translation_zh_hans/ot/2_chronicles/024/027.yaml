  to: 他的儿子们、许多针对他的宣告[a]，以及上帝殿的根基——看哪，这些都记在《列王记》的米德拉什[b]中。他的儿子亚玛谢接替他作王。
  rationale: 修订纠正了 רֹב 的句法归属，将脚注锚点移至含义存疑的短语；同时以“根基”替代无原文依据的“奠基工程”，并以音译的“米德拉什”保留该文献名称和体裁的不确定性。其余王位继承公式及强调语气均予保留。
