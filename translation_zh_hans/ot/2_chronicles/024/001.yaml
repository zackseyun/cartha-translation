  text: בֶּן שֶׁ֤בַע שָׁנִים֙ יֹאָ֣שׁ בְּ/מָלְכ֔/וֹ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: zh_hans
  text: 约阿施登基时七岁，在耶路撒冷作王四十年。他母亲名叫西比亚，是别是巴人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: 七岁
  rationale: 希伯来语直译为“七岁之子”，是常见的年龄表达；现代汉语自然表达为“七岁”。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 此处介词 בְּ 加不定式结构表示时间，指约阿施开始执掌王权之时；“登基时”简洁地表达其即位时间。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词意为“作王、统治”；“作王”符合中文圣经历史叙事中的君王纪年格式，也保留其动词意义。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 在此表示地点，译作“在”；地名按通行中文译名译为“耶路撒冷”。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 这是介绍母亲姓名的固定叙事格式；“他母亲名叫”自然、清楚，并保留原文信息。
- source_word: צִבְיָה
  choice: 西比亚
  rationale: 按该希伯来人名 Ṣibyāh 的通行中文音译处理。
- source_word: מִבְּאֵר שָׁבַע
  choice: 是别是巴人
  rationale: 前缀 מִן 表示来源。现代汉语以“是别是巴人”自然表达她来自别是巴；“别是巴”采用通行中文地名。
