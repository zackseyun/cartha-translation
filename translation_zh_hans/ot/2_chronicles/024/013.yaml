base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: zh_hans
  text: 做工的人动手施工，修缮工程也在他们手中不断推进[a]。他们使神的殿恢复到应有的状态[b]，并加固了它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处译作“修缮”的词也可指“医治”或“恢复”；整句也可译作“修复工程经他们的手得以进展”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“恢复到原有的形制”或“按其既定的形制重新立稳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: 工匠们动手做工
  rationale: 原文直译近似“做工的人做了”，汉语会显得重复生硬；译作“工匠们动手做工”，既保留实际施工之意，也自然易懂。
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: 修缮工作……不断推进
  rationale: אֲרוּכָה 可指医治、恢复或修复；在圣殿整修语境中指修缮。עלה 在此表达进展，而非单纯的向上移动。
- source_word: בְּיָדָם
  choice: 在他们手中
  rationale: 这是表示执行者或经手者的希伯来语表达；“在他们手中”保留手的具体意象，同时符合现代汉语习惯。
- source_word: וַיַּעֲמִידוּ
  choice: 使……恢复
  rationale: עמד 的使役式本义为“使站立、使立稳”；用于建筑修复时，表示将建筑重新恢复、建立起来。
- source_word: בֵּית הָאֱלֹהִים
  choice: 神的殿
  rationale: 原文为“神的家／神的房屋”，此处明确指圣殿；“神的殿”在中文中清楚、庄重，也保留这一固定称谓的意义。
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: 恢复原有的格局
  rationale: מַתְכֹּנֶת 可指既定的形制、安排、尺度或状态。修殿语境很可能指恢复原定或原有形制，但该词并不只限于外观，故以脚注保留“应有状态”的可能。
- source_word: וַיְאַמְּצֻהוּ
  choice: 加固了殿宇
  rationale: אמץ 的加强式意为使坚固、加强；在建筑语境中，“加固”最为具体自然。末尾用“殿宇”明确代词所指，避免汉语歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“动手做工”化解原文同根词语在中文中的生硬重复；“修缮”“格局”“加固”符合建筑语境。正文保留“在他们手中”的原文意象，并用脚注呈现 אֲרוּכָה 与 מַתְכֻּנֶת 的语义幅度。
