base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: zh_hans
  text: 于是他们密谋对付他[a]，奉王的命令，在耶和华殿的院子里用石头打死他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “密谋对付他”也可译作“合谋反对他”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“用石头打他”；这里指用石头将他处死。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: 他们合谋害他
  rationale: קשר עַל 在此表示共同策划对付某人；“合谋害他”自然表达敌对阴谋，并由下文明确其致死目的。
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: 用石头把他打死
  rationale: רגם 指以石头击打，语境表明这是处死；אֶבֶן 为工具性用法。此译既保留“石头”，也清楚表达结果。
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  choice: 奉王的命令
  rationale: מִצְוָה 在这里指权威性的命令；“奉王的命令”简洁自然，并保留王对此事的直接责任。
- source_word: בַּחֲצַר
  choice: 在……院子里
  rationale: חָצֵר 指建筑群内的院落；在圣殿语境中译为“院子”通俗而准确。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: בֵּית 字面为“殿／房屋”，在此指圣殿；将 יְהוָה 音译为“耶和华”，保留专名性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。现代简体中文圣经语境中“耶和华”辨识度高，并作为专名呈现；不以普通称号取代原文神名。
- issue: רגם 是否明确译出处死结果
  choice: 用石头把他打死
  alternative: 拿石头打他；用石头砸他
  rationale: 上下文说明这次投石导致撒迦利亚死亡，且 רגם 常用于以石刑处死。译出“打死”符合事件含义，同时脚注保留较贴近形式的表达。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“奉王的命令”保持原文的责任归属；“耶和华殿的院子”以自然中文表达圣殿院落。所有脚注标记均置于正文相关句末。
