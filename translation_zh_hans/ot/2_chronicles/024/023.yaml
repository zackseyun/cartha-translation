  text: וַ/יְהִ֣י לִ/תְקוּפַ֣ת הַ/שָּׁנָ֗ה עָלָ֣ה עָלָי/ו֮ חֵ֣יל אֲרָם֒ וַ/יָּבֹ֗אוּ אֶל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּשְׁחִ֛יתוּ אֶת כָּל שָׂרֵ֥י הָ/עָ֖ם מֵ/עָ֑ם וְ/כָל שְׁלָלָ֥/ם שִׁלְּח֖וּ לְ/מֶ֥לֶךְ דַּרְמָֽשֶׂק׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: zh_hans
  text: 到了岁序更替的时候[a]，亚兰[b]的军队前来攻打他。他们进入犹大和耶路撒冷，把百姓中的所有首领都除灭了，又把他们掳掠的一切财物[c]送给大马士革王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到了年终的时候”；希伯来语惯用语指一年运转到转折点，也可涉及季节的更替。
    reason: lexical_alternative
  - marker: b
    text: “亚兰”是希伯来名称，常译作“叙利亚”。
    reason: cultural_note
  - marker: c
    text: 或译“他们所有的战利品”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: 到了岁序更替的时候
  rationale: תְּקוּפָה表示循环、转折或季节周期。此处用“岁序更替”保留“年岁转回”的希伯来语意象，同时不武断限定为某一具体季节。
- source_word: עָלָה עָלָיו
  choice: 前来攻打他
  rationale: עלה与עַל连用，在军事语境中表示上去攻击某人；“前来攻打他”符合现代汉语叙事习惯，并保留原文代词。
- source_word: חֵיל אֲרָם
  choice: 亚兰的军队
  rationale: חֵיל在此指军事力量；采用历史名称“亚兰”，不以较晚的地缘名称“叙利亚”替代。
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: 他们进入犹大和耶路撒冷
  rationale: בוא基本义为来、进入；“进入”在战争语境中自然，又不额外加入原文没有明说的“侵略”等词。
- source_word: וַיַּשְׁחִיתוּ
  choice: 除灭了
  rationale: שׁחת的使役形可指毁坏、消灭；宾语是人，故“除灭”体现致命性的毁灭，也符合庄重的历史叙事语体。
- source_word: כָּל שָׂרֵי הָעָם מֵעָם
  choice: 把百姓中的所有首领都除灭了
  rationale: שָׂרֵי可指首领、官长或统治者；“首领”清楚而不误导为王子。מֵעָם以“百姓中的”表达这些首领出自百姓之中。
- source_word: וְכָל שְׁלָלָם
  choice: 他们掳掠的一切财物
  rationale: שָׁלָל指战争中夺取的战利品或掠物；此译在现代汉语中自然，并体现这是亚兰军队掳得之物。
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: 送给大马士革王
  rationale: 介词לְ在此表示送交的对象；“大马士革王”简洁对应以大马士革为统治中心的君王。
