revisions:
- from: 于是，王召来首领耶何耶大，对他说：“你为什么没有要求利未人从犹大和耶路撒冷收来耶和华仆人摩西和会众向以色列所征、供见证帐幕使用的捐税[a]呢？”
  to: 于是，王召来首领耶何耶大，对他说：“你为什么没有要求利未人从犹大和耶路撒冷带来耶和华仆人摩西和以色列会众为见证帐幕所定的捐税[a]呢？”
  rationale: 修订恢复 לְהָבִיא 的“带来”义，并以“摩西和以色列会众为见证帐幕所定的捐税”作自然且相对克制的汉语表达。脚注明确提示原文关系仍有句法讨论，避免正文的“向以色列所征”造成单一解释。
