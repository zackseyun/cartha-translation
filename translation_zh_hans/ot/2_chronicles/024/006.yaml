base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: zh_hans
  text: 于是，王召来首领耶何耶大，对他说：“你为什么没有要求利未人从犹大和耶路撒冷带来耶和华仆人摩西和以色列会众为见证帐幕所定的捐税[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “捐税”指为圣所规定并征集的款项。原文直译近于“摩西……和以色列会众……为见证帐幕的捐税”；其中摩西、以色列会众与该款项的具体关系，句法上有不同理解。
    reason: 说明 מַשְׂאַת 的征集性质，并保留 מֹשֶׁה、וְהַקָּהָל、לְיִשְׂרָאֵל 之间紧凑结构所产生的关系歧义，不把会众明确限定为征收者。
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: 首领
  rationale: 原文只称耶何耶大为“头领、首领”，本节没有明说“大祭司”，因此不把上下文中的身份直接补入正文。
- source_word: דָרַשְׁתָּ עַל הַלְוִיִּם
  choice: 要求利未人
  rationale: 该结构在此表示向利未人追究或责成其履行任务；“要求”既自然，也保留王责问耶何耶大的语气。
- source_word: מַשְׂאַת
  choice: 捐税
  rationale: 此词指为圣所用途征收或筹集的款项，兼具规定缴纳与奉献的性质；“捐税”比单纯“奉献”更能体现其征收性质。
- source_word: אֹהֶל הָעֵדוּת
  choice: 见证帐幕
  rationale: 按词面保留“见证”的圣经专门用语，并以“帐幕”表达 אֹהֶל。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的专名译法，并明确呈现原文神名。
theological_decisions:
- issue: מַשְׂאַת מֹשֶׁה ... וְהַקָּהָל לְיִשְׂרָאֵל 的施行者与承受者关系
  choice: “摩西和会众向以色列所征”
  alternative: “摩西和以色列会众的捐税”
  rationale: לְיִשְׂרָאֵל 更自然地理解为捐税加在以色列身上，而“摩西和会众”是制定或施行者；但句法较紧凑，故以脚注提示另一种理解，不把歧义完全抹平。
- issue: 耶何耶大的职衔
  choice: 首领
  alternative: 大祭司
  rationale: 虽然上下文显示其祭司身份，原文此处仅用 הָרֹאשׁ，因此避免加入本节没有明说的教职称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。王的责问以直接、自然的口吻表达；保留“耶和华仆人”“见证帐幕”等经文术语，同时避免把“首领”解释性扩写为“大祭司”。
