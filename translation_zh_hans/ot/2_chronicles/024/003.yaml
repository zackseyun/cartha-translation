  yaml_path: translation/ot/2_chronicles/024/003.yaml
  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: zh_hans
  text: 耶何耶大为他娶了两个妻子[a]，他生了儿女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一种可能性较小的译法是：“耶何耶大娶了两个妻子，并生了儿女。”这种译法把耶何耶大看作全节的主语。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ל֥וֹ
  choice: 为他娶了
  rationale: נשׂא与“妻子”连用通常指娶妻；לּוֹ表明受益者。此处译作“为他娶了”，自然表达耶何耶大为约阿施安排婚事，同时保留原文代词所造成的指代空间。
- source_word: יְהוֹיָדָע
  choice: 耶何耶大
  rationale: 采用现代中文圣经中通行且易辨识的人名音译。
- source_word: נָשִׁים שְׁתָּיִם
  choice: 两个妻子
  rationale: 婚姻语境下נָשִׁים指妻子；明确保留数词“两个”。
- source_word: וַיּוֹלֶד
  choice: 他也生了
  rationale: 使役词干在男性作主语时表示生育、成为父亲。现代汉语“生了儿女”自然简洁；保留“他”而不直接补出约阿施，以免消除原文的句法歧义。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿女
  rationale: “儿女”在现代汉语中同时明确涵盖儿子和女儿，简洁对应原文成对表达。
theological_decisions:
- issue: 本节代词及后半句动词的所指
  choice: 正文按上下文理解为耶何耶大替约阿施娶妻，随后约阿施生了儿女，但以“为他”和“他”保留原文表层形式。
  alternative: 把耶何耶大视为全节连续的主语，即他自己娶了两个妻子，并生了儿女。
  rationale: 上下文以约阿施为叙事中心，לּוֹ“为他”也强烈表明耶何耶大替另一人办理婚事；不过，耶何耶大是最近的明确主语，后半句仍存在句法上的另一种理解，因此用脚注保留该可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“为他娶了”兼顾希伯来语结构与中文婚姻表达；“他也生了儿女”避免强行补明约阿施，从而保留真实的指代歧义。
