source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: zh_hans
  text: 王和耶何耶大把钱交给从事雅威殿中工程的人[a]。他们雇用石匠和工匠来修复雅威的殿[b]，也雇用加工铁和铜的工匠[c]来加固雅威的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把钱交给”直译为“把它交给”；“它”按上文是指所收集的钱。原文的短语近于“从事雅威之殿服事工程的人”。
    reason: 说明代词所指，并提示原文层叠的职责短语。
  - marker: b
    text: 原文作“雅威的房屋”，在这里指圣殿。
    reason: 说明希伯来语惯用表达与正文语境译法。
  - marker: c
    text: 也可译作“铁匠和铜匠”。原文泛指加工铁和铜的工匠。
    reason: 保留职业名称具体程度上的词义选择。
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: 把钱交给
  rationale: 动词直译为“把它交给”；阳性单数代词按上文指所收集的钱。正文明确所指，使现代汉语自然，脚注保留原文的代词形式。
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: 给承办雅威殿中工程的人
  rationale: 原文结构层叠，近于“给做雅威之殿服事工程的人”。“承办……工程的人”既清楚表达其工作职责，又不加入原文未明说的“监督”身份。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 字面是“雅威的家／房屋”，在本段建筑修缮语境中指圣殿；用“殿”符合现代汉语，同时在脚注说明原文措辞。
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: 他们雇用
  rationale: היה加分词表示持续或实际进行的动作；汉语以“雇用”自然表达他们用款项聘请工人。
- source_word: חֹצְבִים
  choice: 石匠
  rationale: 该词指凿取、切割石料的人；在圣殿修缮语境中，“石匠”准确且通俗。
- source_word: חָרָשִׁים
  choice: 工匠
  rationale: 该词可泛指有技能的手艺人，不必限定为木匠；“工匠”保留其宽泛含义。
- source_word: לְחַדֵּשׁ
  choice: 修复
  rationale: 使役加强词干在此表示使建筑恢复更新；“修复”兼顾维修与恢复原状的含义。
- source_word: וְגַם לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: 也把钱交给加工铁和铜的工匠
  rationale: 原文以“也给……”衔接前面的交付款项，因此正文补出汉语所需的“把钱交给”。“加工铁和铜的工匠”不把其工种过度限定为某一种锻造技术。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或铜合金；此处材质无法进一步确定。中文“铜”比特指合金的“青铜”更能保留词义范围。
- source_word: לְחַזֵּק
  choice: 加固
  rationale: 该动词意为使之坚固；在建筑语境中，“加固”比一般的“加强”更准确自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名，而非“主”这一称号。“雅威”按较通行的学术重构音译神名，保留其专名性质；“耶和华”是传统音译，但反映了较晚形成的混合读法。
- issue: בֵּית יְהוָה 在本节中的所指
  choice: 雅威的殿
  alternative: 雅威的家／房屋
  rationale: 上下文明确谈到宗教建筑的修缮与加固，因此“殿”自然表达其所指；脚注仍保留“房屋”的字面信息，避免掩盖原文意象。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“承办……工程”“修复”“加固”符合建筑语境；避免古奥的“役事”“匠人”等措辞。句法分成两句，以清楚呈现交付款项、雇用工人和加固圣殿之间的关系。
