base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: zh_hans
  text: 人们把他葬在大卫城，与众王同葬[a]，因为他在以色列中行了善，在上帝和他的殿的事上也行了善[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“与众王一起”。
    reason: lexical_alternative
  - marker: b
    text: 原文后半句可较直译为“也与上帝和他的殿”。这里“他的殿”按上下文指上帝的殿。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: 人们把他葬
  rationale: 希伯来文是第三人称阳性复数主动式，并带第三人称阳性单数宾语后缀；用“人们把他葬”既保留主动语态，也不擅自指明未交代的主语。
- source_word: בְעִיר דָּוִיד
  choice: 在大卫城
  rationale: 这是该地名在现代汉语圣经语境中的自然表达，准确保留原文地点结构。
- source_word: עִם הַמְּלָכִים
  choice: 与众王同葬
  rationale: עִם 本义为“与……一起”；在安葬语境中，“与众王同葬”自然表达他被安葬在诸王之列，同时保留原文的共同关系。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他获此尊荣安葬的原因；“因为”清楚自然。
- source_word: עָשָׂה טוֹבָה
  choice: 行了善／做了美善的事
  rationale: 原短语指行善或做有益、美好的事。前半用凝练的“行了善”，后半为使并列对象在汉语中清楚而用“做了美善的事”，不把含义限缩为单一行为。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列
  rationale: 保留介词的范围或领域意义，表示他的善行发生并施行于以色列中。
- source_word: וְעִם הָאֱלֹהִים
  choice: 也为上帝
  rationale: 字面可作“也与上帝”；结合 עָשָׂה טוֹבָה 的支配关系，此处表达善行所关涉、所服务的对象。汉语译作“为上帝”可避免误解为与上帝共同做某事。
- source_word: וּבֵיתוֹ
  choice: 和上帝的殿
  rationale: 第三人称单数后缀最自然地回指紧邻的“上帝”；结合上下文，所指是上帝的殿。正文明确重复“上帝”，以免汉语“他的殿”出现不必要的指代混淆。
theological_decisions:
- issue: וּבֵיתוֹ（“他的殿／家”）的所指
  choice: 指上帝的殿，即圣殿
  alternative: 指耶何耶大自己的家室
  rationale: 最近的先行词是“上帝”，而本章上下文着重叙述耶何耶大维护圣殿之事，因此回指上帝并理解为圣殿最符合句法和叙事语境。
- issue: עִם 在“与上帝和他的殿”中的关系
  choice: 理解为善行所关涉或服事的对象，译作“为上帝和上帝的殿”
  alternative: 严格直译为“与上帝和他的殿一起”
  rationale: 若在现代汉语中直译“与上帝一起行善”，容易产生上帝与耶何耶大共同实施该行为的额外含义；“为”更自然地表达原句对其敬虔事奉的评价，同时脚注保留结构说明。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“大卫城”“上帝”“圣殿”等用语保持清晰一致；正文避免生硬照搬希伯来介词，但以脚注保留其字面结构和可能感受到的语义张力。
