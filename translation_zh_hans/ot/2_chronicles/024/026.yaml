base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: zh_hans
  text: 合谋反对他的人[a]如下：亚扪妇人示米押的儿子撒拔，以及摩押妇人示米利的儿子约萨拔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “合谋反对他的人”也可译为“同谋反对他的人”或“那些合谋反对他的人”。
    reason: 原词指联合策划阴谋的人；“反对他”表明阴谋所针对的对象。本节本身未明确阴谋的具体目的。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 在叙事中引出下列人员的身份；与后面的冒号配合，符合现代汉语表达。
- source_word: הַמִּתְקַשְּׁרִים
  choice: 合谋……的人
  rationale: קשר的Hitpael分词表示彼此联合、策划阴谋；“合谋……的人”既保留共同策划的含义，也自然体现分词所指的一类人。
- source_word: עָלָיו
  choice: 反对他
  rationale: 在קשר的搭配中，עַל标明阴谋所针对的对象。“反对他”不超出本节字面意义；刺杀的结果已由上下文说明。
- source_word: זָבָד
  choice: 撒拔
  rationale: 按中文圣经人名的通行形式音译。
- source_word: שִׁמְעָת
  choice: 示米押
  rationale: 按中文圣经人名的通行形式音译。
- source_word: הָעַמּוֹנִית
  choice: 亚扪妇人
  rationale: 希伯来语为阴性单数，明确指出示米押是亚扪女子；“妇人”保留其性别信息。
- source_word: וִיהוֹזָבָד
  choice: 以及……约萨拔
  rationale: 人名按中文圣经通行形式音译，并用“以及”自然连接名单中的第二人。
- source_word: שִׁמְרִית
  choice: 示米利
  rationale: 按中文圣经人名的通行形式音译。
- source_word: הַמּוֹאָבִית
  choice: 摩押妇人
  rationale: 希伯来语为阴性单数，明确指出示米利是摩押女子；“妇人”保留其性别信息。
