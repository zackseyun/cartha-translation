  text: וַ/יִּקְבֹּץ֮ אֶת הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֒ וַ/יֹּ֣אמֶר לָ/הֶ֡ם צְא֣וּ לְ/עָרֵ֪י יְהוּדָ֟ה וְ/קִבְצוּ֩ מִ/כָּל יִשְׂרָאֵ֨ל כֶּ֜סֶף לְ/חַזֵּ֣ק אֶת בֵּ֣ית אֱלֹֽהֵי/כֶ֗ם מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/אַתֶּ֖ם תְּמַהֲר֣וּ לַ/דָּבָ֑ר וְ/לֹ֥א מִֽהֲר֖וּ הַֽ/לְוִיִּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: zh_hans
  text: 于是，他召集祭司和利未人，对他们说：“你们要到犹大的各城去，每年向全以色列收取银子[a]，用来修缮你们上帝的殿[b]。你们要赶快办理这事。”可是利未人没有赶快去办这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银子”也可译作“钱”。希伯来文使用具体的“银子”一词来指所收取的款项。
    reason: lexical_alternative
  - marker: b
    text: “修缮”直译为“使……坚固”；这里指加固或修复圣殿建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: 召集
  rationale: 该词指把人聚集起来；“召集”自然贴合祭司和利未人作为宾语的语境。
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司和利未人
  rationale: 明确保留原文所区分的两个圣殿职事群体。
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: 到犹大的各城去
  rationale: 既表达יצא的出行动作，也自然呈现目的地；“各城”符合复数及巡行收集的语境。
- source_word: וְקִבְצוּ
  choice: 收集
  rationale: 宾语是银子，因此“收集”比再次使用“聚集”更符合现代汉语搭配。
- source_word: מִכָּל יִשְׂרָאֵל
  choice: 从全以色列
  rationale: 保留原文“全以色列”的宽广表述，不将其缩窄为犹大或预先解释为某一特定人群。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 保留希伯来文的具体物质称谓；该词在此也可指用作款项的钱财，脚注说明这一语用意义。
- source_word: לְחַזֵּק
  choice: 修缮
  rationale: חזק本义为使坚固，在建筑语境中指加固、修复；“修缮”准确而自然地表达圣殿维修。
- source_word: בֵּית אֱלֹהֵיכֶם
  choice: 你们上帝的殿
  rationale: בית直译为“家/房屋”，但在此明确指圣殿；“殿”在现代中文中庄重自然，同时不额外引入解释。
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: 每年
  rationale: 简洁表达该希伯来习语所指的逐年、每年定期进行。
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר
  choice: 你们要赶快办理这事
  rationale: 保留命令的紧迫语气；“办理这事”符合现代汉语表达。
- source_word: וְלֹא מִהֲרוּ הַלְוִיִּם
  choice: 可是利未人并没有赶快办理
  rationale: 重复“赶快办理”，呼应前一句命令，并清楚表现利未人没有按要求迅速行动。
theological_decisions:
- issue: “全以色列”的范围
  choice: 从全以色列
  alternative: 从所有以色列人／从犹大众人
  rationale: 《历代志》可在以犹大为叙事中心的语境中广义使用“以色列”。直译可保留其历史与神学张力，不武断限定范围。
- issue: “你们上帝的殿”中的人称
  choice: 保留“你们上帝”
  alternative: 上帝的殿／耶和华的殿
  rationale: 原文使用第二人称复数后缀，保留这一称呼可呈现约阿施对祭司和利未人的直接劝责语气，不改写为更一般的称谓。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“祭司”“利未人”“上帝的殿”等保留经文语域；命令与末句均用“赶快办理”形成有意的词语呼应。
