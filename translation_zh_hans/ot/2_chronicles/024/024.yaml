  text: כִּי֩ בְ/מִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ חֵ֣יל אֲרָ֗ם וַֽ/יהוָה֙ נָתַ֨ן בְּ/יָדָ֥/ם חַ֨יִל֙ לָ/רֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/אֶת יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: zh_hans
  text: 亚兰军以少数人马来攻[a]，雅威却把一支极其庞大的军队交在他们手中[b]；这是因为犹大人离弃了雅威——他们列祖的上帝。亚兰人对约阿施施行了审判[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“以很少的人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“交在他们手中”，意思是交在他们的权势之下。
    reason: lexical_alternative
  - marker: c
    text: 或译：“亚兰人惩治了约阿施。”原文“审判”一词为复数，指惩罚性的审判行动。
    reason: alternative_reading
lexical_decisions:
- source_word: בְמִצְעַר אֲנָשִׁים
  choice: 人数很少
  rationale: 该短语表示人数稀少；译文简洁自然，并保留其与后来“极其庞大的军队”之间的强烈对比。
- source_word: חֵיל אֲרָם
  choice: 亚兰军
  rationale: חֵיל 在本语境中指军队；专名按希伯来文译作“亚兰”，不以现代地名“叙利亚”替代。
- source_word: נָתַן בְּיָדָם
  choice: 交在他们手中
  rationale: 保留希伯来语“交在手中”的常见表达，其含义是使对方落入他们的权势或控制之下。
- source_word: חַיִל לָרֹב מְאֹד
  choice: 一支极其庞大的军队
  rationale: חַיִל 此处再次指军队，לָרֹב מְאֹד 强调规模极大。
- source_word: עָזְבוּ
  choice: 离弃
  rationale: “离弃”既自然，又保留该动词在背弃上帝的语境中所具有的严肃分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为上帝专名的性质，而不以称号替代。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们列祖的上帝
  rationale: “列祖”保留原文的父系、历史及圣约色彩，也符合庄重而易懂的汉语圣经语体。
- source_word: עָשׂוּ שְׁפָטִים
  choice: 施行了审判
  rationale: 该复数短语指带有司法报应性质的惩治行动；汉语用集合意义的单数“审判”更自然，又不把它弱化为普通攻击。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近现今对该名的学术重构，也明确保留其专名性质。
- issue: 亚兰人的胜利是否呈现为神的审判
  choice: 亚兰人也向约阿施施行了审判
  alternative: 亚兰人也惩治了约阿施
  rationale: 原文使用 שְׁפָטִים，带有审判和报应意味；译作“施行了审判”保留神学张力，不额外解释亚兰人如何成为神审判的工具。
- issue: 两个隐含复数主语的辨明
  choice: 分别明示为“犹大人”和“亚兰人”
  alternative: 两处均译作“他们”
  rationale: 希伯来语依上下文可辨：离弃雅威的是犹大一方，向约阿施施行审判的是亚兰人。汉语若连续使用“他们”容易造成错误指代，因此作最小限度的语境明示。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“来犯”自然表达军队前来作战的语境；“列祖”保留历史和圣约色彩。为避免汉语代词误指，按上下文明示“犹大人”和“亚兰人”，但不扩展原文的因果关系或审判机制。
