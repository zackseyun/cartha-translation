  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: zh_hans
  text: 众首领和全体百姓都欢喜；他们把捐项带来，投进柜中，直至结束[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到（柜子）装满。”希伯来语原文只说“直到完成”或“直到结束”，没有明说完成的是捐献行动还是柜子装满。
    reason: 保留 עַד לְכַלֵּה 的语法省略与词义开放性，并将“柜子装满”明确为上下文容许的解释，而非原文的明说。
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: 欢喜
  rationale: שׂמח表示喜悦、欢乐；“欢喜”自然庄重，也保留全体共同喜悦的叙事语气。
- source_word: כָל הַשָּׂרִים
  choice: 众首领
  rationale: שׂרים指掌权者或官长；“首领”符合本段所述民间及国家领袖的语境，又避免“王子”所暗示的王室血缘。
- source_word: וְכָל הָעָם
  choice: 和全体百姓
  rationale: 直接表达原文的整体范围；“百姓”符合历史叙事的现代中文语体。
- source_word: וַיָּבִיאוּ
  choice: 把捐项带来
  rationale: 动词本义是“带来”，宾语在希伯来文中省略；上下文明确是为修殿募集款项，因此补出“捐项”使中文完整自然。
- source_word: וַיַּשְׁלִיכוּ
  choice: 投进
  rationale: שלך具有“投、抛”的具体动作感；“投进”既保留原文力度，也符合将款项放入收集柜的自然中文表达。
- source_word: לָאָרוֹן
  choice: 柜中
  rationale: אָרוֹן可指柜、箱或约柜；此处是收取捐项的容器，并非约柜，故译作“柜”。
- source_word: עַד לְכַלֵּה
  choice: 直到完毕
  rationale: כלה的不定式表示完成或终结，但原文没有明说是众人捐完还是柜子装满；“直到完毕”保留这一省略与歧义，不强行指定主语。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的历史叙事语体。“众首领”“全体百姓”体现原文两组人的整体参与；“捐项”是依据紧邻上下文补出的隐含宾语。主文用“直到完毕”保留原文终点表达的开放性，并以脚注说明常见的情境化理解。
