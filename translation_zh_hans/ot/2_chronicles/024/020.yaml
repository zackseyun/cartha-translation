  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: zh_hans
  text: 上帝的灵披在祭司耶何耶大的儿子撒迦利亚身上[a]。撒迦利亚站在众人上方，对他们说：“上帝如此说：‘你们为什么违犯雅威的诫命，以致不能亨通呢？[b]因为你们离弃了雅威，他也离弃了你们。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的灵临到撒迦利亚。”原文直译为“上帝的灵披在撒迦利亚身上”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你们必不能亨通。”
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: 上帝的灵
  rationale: 在先知受赋能的叙事语境中，这一短语最自然地指上帝的灵；译文保留其主动施行作为的主体地位。
- source_word: לָבְשָׁה אֶת
  choice: 披在……身上
  rationale: 保留לבשׁ的衣着意象，同时采用现代汉语可理解的表达；脚注注明更贴近原文语法的直译及常见意译。
- source_word: זְכַרְיָה בֶּן יְהוֹיָדָע הַכֹּהֵן
  choice: 祭司耶何耶大的儿子撒迦利亚
  rationale: 按希伯来语关系将“祭司”理解为修饰耶何耶大，并以自然汉语交代父子关系。
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: 撒迦利亚站在众人上方
  rationale: 保留מֵעַל所表达的垂直空间意味，不将其弱化为仅仅“站在众人面前”。
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: 上帝如此说
  rationale: 采用庄重、简洁的先知传信公式，并自然处理希伯来语定冠词。
- source_word: לָמָה אַתֶּם עֹבְרִים אֶת מִצְוֹת יְהוָה
  choice: 你们为什么违犯雅威的诫命
  rationale: עבר与“诫命”连用表示越界、违犯；“违犯”准确传达盟约与道德层面的责问。
- source_word: וְלֹא תַצְלִיחוּ
  choice: 以致不能亨通
  rationale: 在修辞问句中将该分句理解为违犯诫命所导致的结果；同时以脚注保留并列或预告后果的另一种理解。
- source_word: כִּי עֲזַבְתֶּם אֶת יְהוָה וַיַּעֲזֹב אֶתְכֶם
  choice: 因为你们离弃了雅威，他也离弃了你们
  rationale: 用同一动词“离弃”重现原文刻意形成的对应关系，并保留上帝回应性离弃所带来的神学张力。
theological_decisions:
- issue: יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现上帝在盟约中启示的名字，也与所给审校层的决定一致。
- issue: “上帝的灵”的主体性
  choice: 上帝的灵
  alternative: 上帝的气息；来自上帝的一个灵
  rationale: 上下文描写先知受神赋能并宣告神谕，最自然地指上帝的灵亲自施行作为；译文不进一步加入超出本节的教义界定。
- issue: 上帝离弃百姓的表述
  choice: 他也离弃了你们
  alternative: 他必离弃你们；他任凭你们
  rationale: 保留原文重复עזב形成的直接对称，不以解释性措辞减弱或化解“百姓离弃上帝—上帝离弃百姓”的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“披”的衣着意象和“站在众人上方”的空间意味；先知宣告使用“上帝如此说”，以维持简洁庄严的语气。
