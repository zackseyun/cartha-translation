  text: וַ/יִּזְקַ֧ן יְהוֹיָדָ֛ע וַ/יִּשְׂבַּ֥ע יָמִ֖ים וַ/יָּמֹ֑ת בֶּן מֵאָ֧ה וּ/שְׁלֹשִׁ֛ים שָׁנָ֖ה בְּ/מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: zh_hans
  text: 耶何耶大渐渐年老，享尽天年[a]，就去世了。他去世时一百三十岁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“日子满足了”，意思是寿数充足，度过了完整的一生。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: 渐渐年老
  rationale: 希伯来语动词 זקן 在连续叙事中表示年岁增长；“渐渐年老”自然地保留过程意味。
- source_word: יְהוֹיָדָע
  choice: 耶何耶大
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: וַיִּשְׂבַּע יָמִים
  choice: 享尽天年
  rationale: 原文直译为“日子满足了”，表示寿数充足、人生完整；“享尽天年”是自然庄重的中文表达，同时以脚注保留原文意象。
- source_word: וַיָּמֹת
  choice: 就去世了
  rationale: מות 表示死亡；“去世”符合叙述人物死亡时庄重而自然的现代中文语体，“就”承接连续叙事。
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: 一百三十岁
  rationale: 希伯来语年龄公式直译为“一百三十岁之子”，现代中文惯用“一百三十岁”。
- source_word: בְּמוֹתוֹ
  choice: 他去世时
  rationale: 介词 בְּ 加“死亡”及第三人称后缀在这里表示时间，译作“他去世时”最自然。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重且易懂的现代标准普通话。“享尽天年”传达希伯来语习语的意义，脚注则保留其字面意象；句法按中文叙事习惯调整，但未增添神学解释。
