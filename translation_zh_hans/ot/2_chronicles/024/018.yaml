revisions:
- from: 他们离弃了雅威——他们祖先之上帝的殿，转去事奉亚舍拉[a]和偶像。因此，烈怒临到犹大和耶路撒冷，因为他们犯了这罪。
  to: 他们离弃了雅威——他们祖先的上帝——的殿，转去事奉亚舍拉[a]和偶像。于是，震怒临到犹大和耶路撒冷，因他们这罪责。
  rationale: 修订仅改善现代汉语的顺畅度，并将末句恢复为更贴近原文的“罪责”名词表达。“雅威——他们祖先的上帝——”以双破折号清楚标示同位语，避免把“他们祖先的上帝”误读为另一位神或与“殿”发生不清楚的修饰关系。脚注锚点仍紧随“亚舍拉”，并保留其复数与所指的争议。
