  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: zh_hans
  text: 他们离弃了雅威——他们祖先的上帝——的殿，转去事奉亚舍拉[a]和偶像。于是，震怒临到犹大和耶路撒冷，因他们这罪责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”。希伯来语这个复数词可指与亚舍拉崇拜有关的物件，也可能使人联想到亚舍拉女神。
    reason: 保留该文化专名在崇拜物与相关神祇之间的词义张力，避免正文过度限定。
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: 离弃
  rationale: עָזַב在这里不只是离开某处，也表达对雅威的不忠；“离弃”自然、庄重，并保留这种关系和圣约层面的意味。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת直译为“家、房屋”，但在本语境明确指圣殿；中文“殿”既自然，也保留其宗教场所的所指。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用现代汉语中对四字神名的常见音译，直接呈现专名，不以称号替代。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们祖先之上帝
  rationale: 保留“祖先”所承载的家族与圣约历史含义；“之上帝”使其与前面的“雅威”构成清楚的同位说明。
- source_word: וַיַּעַבְדוּ
  choice: 事奉
  rationale: עבד用于神明或敬拜对象时兼有服事和敬拜之意；“事奉”较贴近原词，同时让宗教含义由上下文显明。
- source_word: הָאֲשֵׁרִים
  choice: 亚舍拉
  rationale: 该复数形式可指与亚舍拉有关的崇拜物，也会使人联想到亚舍拉女神；正文保留音译，避免武断限定为木柱或神像，脚注补充说明。
- source_word: הָעֲצַבִּים
  choice: 偶像
  rationale: 该词指供奉的形像，常带贬义；“偶像”清楚传达其宗教和批判意味。
- source_word: וַיְהִי קֶצֶף
  choice: 因此，烈怒临到
  rationale: 保留希伯来文简洁的结果关系，并不在正文中补出烈怒的发出者；“烈怒”传达קֶצֶף强烈的审判意味。
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: 临到犹大和耶路撒冷
  rationale: עַל与“烈怒”连用，表示审判落在这些地方及其居民身上；“临到”符合现代中文圣经叙事语体。
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: 因为他们犯了这罪
  rationale: בְּ在此表示原因，אַשְׁמָה兼含罪责与有罪行为；“犯了这罪”在中文中自然，并保留指示词“这”和他们应负的责任。
theological_decisions:
- issue: “烈怒”的发出者
  choice: 正文只说“烈怒临到”，不明说“上帝的烈怒”或“雅威的烈怒”
  alternative: 译为“雅威的烈怒临到”
  rationale: 上下文清楚暗示这是雅威施行审判，但希伯来文没有明说所属者；保留隐含表达，可避免增添原文未有的词。
- issue: אֲשֵׁרִים的所指
  choice: 正文音译为“亚舍拉”
  alternative: 译为“亚舍拉柱”或“亚舍拉像”
  rationale: 原词是复数，可指亚舍拉崇拜物，也与亚舍拉女神相关。音译能保留这种文化与词义上的张力，脚注再说明常见理解。
- issue: “祖先之上帝”的圣约意味
  choice: 保留祖先关系，不简化为“他们世代所信的上帝”
  alternative: 译为“他们祖传的上帝”
  rationale: 原文明确说“他们祖先的上帝”，既指家族历史，也呼应以色列与雅威的关系；直陈祖先更忠实，也不把经文缩减为一种传承信仰。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“雅威——他们祖先之上帝”用破折号标明同位关系；“转去事奉”自然呈现从离弃圣殿到敬奉其他对象的转折。脚注标记置于“亚舍拉”之后，与脚注实际解释对象一致。
