source:
  edition: WLC
  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: zh_hans
  text: 因为邪恶的妇人亚她利雅和她的儿子强行闯入了上帝的殿，还把雅威的殿里一切圣物都用来供奉众巴力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“还把雅威的殿里一切圣物都为众巴力制作”。这里的希伯来语动词通常意为“做、制作”，但按上下文，也可能是说他们把圣殿的圣物挪用于巴力崇拜。
    reason: 保留 עָשׂוּ לַבְּעָלִים 在“制作”与“用作、挪作”之间的词义可能性。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为有关修缮圣殿的命令说明原因；现代汉语用“因为”自然地表达解释关系。
- source_word: עֲתַלְיָהוּ הַמִּרְשַׁעַת
  choice: 那恶妇亚她利雅
  rationale: 按通行译名音译人名，并以“那恶妇”明确保留阴性形式及强烈的道德谴责语气。
- source_word: בָּנֶיהָ
  choice: 她的儿子们
  rationale: 保留希伯来文阳性复数“儿子”，不泛化为“儿女”或“子孙”。
- source_word: פָרְצוּ אֶת־בֵּית הָאֱלֹהִים
  choice: 闯入了上帝的殿
  rationale: פרץ可表示冲破、破门而入；“闯入”简洁传达对圣殿的强行侵犯，同时避免凭本节断定具体毁坏程度。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: “殿”在现代汉语中自然明确地指圣殿，并保留其为上帝居所的表达。
- source_word: כָּל־קָדְשֵׁי בֵית יְהוָה
  choice: 雅威殿里的一切圣物
  rationale: קָדְשֵׁי在此指分别为圣、属于圣殿的器物；“圣物”准确而简明。“雅威”直接音译神圣四字名。
- source_word: עָשׂוּ לַבְּעָלִים
  choice: 都用来供奉众巴力
  rationale: 直译可作“为众巴力制作”，但以圣殿圣物为宾语时，עשה ל很可能指把这些物品挪作巴力崇拜之用；“用来供奉”符合语境，并以脚注保留原文较直译的可能性。
- source_word: בְּעָלִים
  choice: 众巴力
  rationale: 保留希伯来文复数，可能泛指不同地方或形态的巴力神祇及其偶像崇拜。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常学术重构的读音，并避免以“主”替代原有专名。
- issue: בְּעָלִים 的复数形式
  choice: 众巴力
  alternative: 巴力／巴力偶像
  rationale: 原文明确为复数；译作“众巴力”既不抹平数量，也不武断限定为偶像实体或某一种地方性崇拜。
- issue: עָשׂוּ לַבְּעָלִים 的含义
  choice: 用来供奉众巴力
  alternative: 为众巴力制作
  rationale: 上下文中的宾语是雅威殿里的圣物，故该短语更可能表示挪用这些物品服务于巴力崇拜；脚注同时保留动词“制作”的形式对应，避免掩盖原文的简约和歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“恶妇”保留原文尖锐的谴责；“闯入”表达对圣殿的暴力侵犯，但不额外断言具体损毁方式。句序基本贴近希伯来文，同时调整为自然汉语。
