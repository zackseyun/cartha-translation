source:
  edition: WLC
  text: וְ/אַֽחֲרֵ֥י מוֹת֙ יְה֣וֹיָדָ֔ע בָּ֚אוּ שָׂרֵ֣י יְהוּדָ֔ה וַ/יִּֽשְׁתַּחֲו֖וּ לַ/מֶּ֑לֶךְ אָ֛ז שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: zh_hans
  text: 耶何耶大死后，犹大的首领[a]来向王俯伏。于是王听了他们的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首领”也可译作“官长”或“权贵”。
    reason: lexical_alternative
  - marker: b
    text: “听了他们的话”也可理解为“听从了他们”或“依从了他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת יְהוֹיָדָע
  choice: 耶何耶大死后
  rationale: 以自然的现代汉语表达时间关系；省略句首连接词，不影响事件承接。专名按通行圣经译名音译。
- source_word: בָּאוּ
  choice: 来
  rationale: 准确表达来到王面前的动作，不额外补出原文未明说的目的地。
- source_word: שָׂרֵי יְהוּדָה
  choice: 犹大的首领
  rationale: שָׂרִים可指首领、官长或权贵；“首领”在现代汉语中自然，也保留其较宽泛的统治阶层含义。
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: 向王俯伏
  rationale: 保留身体俯伏的具体动作，不将其解释为敬拜，也不预先判定其政治动机。
- source_word: אָז
  choice: 于是
  rationale: 既标明后续事件，也自然呈现前后动作之间的叙事联系。
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: 王听了他们的话
  rationale: שׁמע אל可表示听取、听从或依从；此译法在汉语中保留“听取”与“采纳”之间的语义空间，并由脚注说明较强含义。
theological_decisions:
- issue: 犹大首领向王所作动作的性质
  choice: 译作“向王俯伏”
  alternative: 向王致敬／向王下拜／敬拜王
  rationale: 该希伯来动词可按语境表示俯伏、致敬或敬拜。对象在此是人间君王，因此“敬拜”会过度引入宗教含义；“俯伏”保留动作本身及其动机上的张力。
- issue: 王对首领意见的回应程度
  choice: 译作“听了他们的话”
  alternative: 听从了他们／依从了他们
  rationale: 原文习语可能包含采纳、顺从之意，但单节没有明说他们说了什么；正文采用较宽的表达，避免把顺从程度说得过满，脚注保留较强解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“俯伏”保留叙事的古代宫廷语境，但普通读者仍易理解；“听了他们的话”自然且保留原文习语的语义弹性。脚注标记已放在各自所说明的词语之后。
