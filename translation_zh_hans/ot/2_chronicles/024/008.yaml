base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: zh_hans
  text: 于是，王下令，他们做了一个箱子[a]，放在雅威殿的门外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“一个箱子”，可能强调这是一个专门指定的收款箱。
    reason: 说明数词אֶחָד在此既可构成普通的不定表达，也可能强调单一、专用的容器。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 下令
  rationale: 该动词字面义为“说”，但在王发话、众人随即执行的行政语境中具有命令意味；“下令”自然传达其语用功能。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 准确对应带定冠词的名词；汉语叙事中无需另加“这位”。
- source_word: וַיַּעֲשׂוּ
  choice: 他们做了
  rationale: 保留希伯来文复数而未明说身份的执行者，并以常用动词表达制作实物。
- source_word: אֲרוֹן אֶחָד
  choice: 一个箱子
  rationale: אֲרוֹן在此指收纳财物的箱子，并非约柜；“一个”保留אֶחָד，同时现代汉语也自然。
- source_word: וַיִּתְּנֻהוּ
  choice: 放
  rationale: נתן在此表示把物件安置于某处；“放”简明自然。
- source_word: בְּשַׁעַר בֵּית יְהוָה חוּצָה
  choice: 在雅威殿门外
  rationale: 将地点关系自然整合为汉语；“门外”清楚表达箱子位于殿门的外侧。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术拟音译作专名，不以“主”替代。
- issue: אֲרוֹן 的所指
  choice: 箱子
  alternative: 柜
  rationale: 本节语境是收取奉献的容器；译作“箱子”可避免让读者误以为这是约柜，同时不额外限定材质或构造。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文行动；“下令”体现语境中的命令功能。句式简洁，保留执行者未具体说明这一点，并将地点表达为习惯用语“殿门外”。
