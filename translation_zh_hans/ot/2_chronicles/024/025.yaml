revisions:
- from: 他们离开他的时候——他们把他撇下时，他已身患重病——他的臣仆因祭司耶何耶大众子的血[a]，合谋背叛他，在床上杀了他，他就死了。人把他葬在大卫城，却没有葬在列王的坟墓里。
  to: 他们离开他时，把他撇下，使他身患许多疾病；他的臣仆因祭司耶何耶大的众子之血[a]密谋反叛他，在床上杀了他，他就死了。人把他葬在大卫城，却没有葬在列王的坟墓里。
  rationale: 修订开头以“把他撇下，使他身患许多疾病”连贯表达离去时留下约阿施患病的情状，并保留“许多疾病”的复数。将阴谋表述调整为“密谋反叛”，明确“耶何耶大的众子之血”的所属关系，并修正脚注中单数替代理解的汉语歧义。
