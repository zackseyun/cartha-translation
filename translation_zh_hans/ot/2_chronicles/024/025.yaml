    rationale: “把他撇下时”重复时间结构，未体现原文对离去时留下他患有许多疾病这一情状的说明；“重病”也没有保留复数“许多疾病”。
  - severity: medium
    issue: 脚注的“耶何耶大儿子”有歧义。
    rationale: 现代汉语中“某人儿子”可被读作其长子；这里所需的是“耶何耶大的儿子（单数）”，即上下文所指的撒迦利亚。
  - severity: low
    issue: “合谋背叛”可更直接表达宫廷阴谋。
    rationale: הִתְקַשְּׁרוּ 指结党密谋、谋反；“密谋反叛”更简洁自然，且不改变含义。
