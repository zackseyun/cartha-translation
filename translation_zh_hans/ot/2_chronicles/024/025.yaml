source:
  edition: WLC
  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: zh_hans
  text: 他们离开他时，把他撇下，使他身患许多疾病；他的臣仆因祭司耶何耶大的众子之血[a]密谋反叛他，在床上杀了他，他就死了。人把他葬在大卫城，却没有葬在列王的坟墓里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“祭司耶何耶大的众子之血”。结合上下文，这里可能特指“祭司耶何耶大的儿子之血”，即撒迦利亚的血（24:20–22）。
    reason: 保留马所拉文本的复数“众子”，同时说明上下文可能支持单数“儿子”的理解；“儿子之血”避免被误解为“长子”。
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: 他们离开他的时候
  rationale: ב 加不定式附属形表达时间关系；结合上文，主语是撤离的亚兰军队。
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: 他们把他撇下时，他已身患重病
  rationale: מַחֳלָיִם 为复数，指疾病或病痛；现代汉语用“身患重病”自然表达病势严重，而不误释为单纯受伤。כי 在此补充说明他被留下时的状况。
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: 他的臣仆……合谋背叛他
  rationale: קשר 的反身词干在宫廷叙事中指结党谋反；עֲבָדָיו 既可指仆人，也可指王室臣属，“臣仆”兼顾宫廷身份和词面意义。
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: 因祭司耶何耶大众子的血
  rationale: 保留马所拉文本的复数“众子”和“血”的血债意象，不在正文中补入“流了”等原文未明说的内容。
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: 在床上杀了他，他就死了
  rationale: 直接保留“杀”和随后“死了”的叙事次序，也保留遇刺时卧床这一细节。
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: 人把他葬在大卫城，却没有葬在列王的坟墓里
  rationale: 希伯来文两处均为未明说身份的复数主语，汉语以泛指“人”处理，避免误指紧邻的谋杀者；“却”清楚表达葬于大卫城但被排除在王陵之外的反差。
theological_decisions:
- issue: 马所拉文本“耶何耶大的众子”与24:20仅明确提到其子撒迦利亚之间的张力
  choice: 正文保留复数“众子”
  alternative: “祭司耶何耶大儿子的血”，特指撒迦利亚
  rationale: 所给希伯来文本明确使用复数 בְּנֵי。上下文虽可能专指撒迦利亚，但不应在正文中静默协调；脚注说明语境上的单数理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“撇下”“臣仆”“合谋背叛”符合王室遇刺语境；正文保留“血”的希伯来表达及“众子”的文本张力。脚注标记[a]已置于相关短语之后。
