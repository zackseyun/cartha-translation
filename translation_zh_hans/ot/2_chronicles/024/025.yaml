review_pass:
  verdict: revise
  source_fidelity: 正文基本忠实于希伯来文，保留了马所拉文本“众子”的复数以及遇刺、葬于大卫城而未入王陵的对比。但“他们把他撇下时，他已身患重病”将 כִּי 的说明／因果关系改成时间关系，并把复数“许多疾病”笼统化为“重病”。
  naturalness: 原文整体庄重通顺，但开头“他们离开他的时候——他们把他撇下时”重复且句法不顺；“耶何耶大儿子”在脚注中容易被理解为“长子”，不宜用来表达“耶何耶大的一个儿子”。
  terminology: “臣仆”“大卫城”“列王的坟墓”均适合王朝叙事。“众子之血”应以“耶何耶大的众子之血”明确所属关系；脚注须以“儿子（单数）”而非“儿子”可能表示长子来说明替代理解。
  issues:
