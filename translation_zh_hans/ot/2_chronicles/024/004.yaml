  text: וַ/יְהִ֖י אַחֲרֵי כֵ֑ן הָיָה֙ עִם לֵ֣ב יוֹאָ֔שׁ לְ/חַדֵּ֖שׁ אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: zh_hans
  text: 此后，约阿施心里有意修复[a]雅威的殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “修复”也可译作“更新”或“修缮”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“雅威的家”，这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 此后
  rationale: 自然简洁地标明叙事进入下一阶段，同时保留希伯来文的时间承接关系。
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: 约阿施心里有意
  rationale: 传达原文“这事在约阿施心里”的惯用表达，表示内在意愿或打算；不采用“立定心志”，以免加入原文未必具有的强烈决意色彩。
- source_word: לְחַדֵּשׁ
  choice: 修复
  rationale: 该词有使之重新、更新、复原之意；在既有圣殿建筑的语境中，“修复”最自然，也比“修理”更能涵盖恢复原状的意义。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 原文直译为“雅威的家”；此处明确指圣殿，译作“殿”符合现代汉语，并以脚注保留原文意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常重构的读音，并避免把专名改译为“主”等称号。
- issue: הָיָה עִם לֵב 所表达的意愿强度
  choice: 心里有意
  alternative: 立定心志
  rationale: 原文表达约阿施内心存有这一打算，但未必强调已经作出不可动摇的决断，因此采用较中性的译法。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“心里有意”保留希伯来文关于内心意向的表达，又不显生硬；“殿”清楚指向圣殿，原文“家”的措辞则由脚注说明。
