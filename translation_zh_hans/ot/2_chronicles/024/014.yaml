base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: zh_hans
  text: 他们完成之后[a]，把剩余的银子呈到王和耶何耶大面前；随后用这些银子为雅威的殿制造器具[b]：供事奉和献上[c]用的器具、碗，以及金银器皿。耶何耶大在世的日子，他们不断在雅威的殿里献上燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有在本节明说他们完成了什么；上下文指向圣殿修缮工程。
    reason: 保留原文省略，并说明上下文所指。
  - marker: b
    text: 原文动词为单数“他制造”，宾语后缀也为单数，指剩余的银子；本节没有明说该单数主语具体是谁。
    reason: 说明原文单数形式，并保留其主语指向的未明性。
  - marker: c
    text: 原文只说“献上”，没有说明所献的对象；本节后半才明确提到燔祭。
    reason: 保留词语的开放性，避免在前半节补入原文未明说的宾语。
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: 他们办完以后
  rationale: 该结构表示时间背景，直译为“当他们完成时”；原文没有在本节明说完成的对象。中文用“办完”可自然保留这一省略。
- source_word: שְׁאָר הַכֶּסֶף
  choice: 剩余的银子
  rationale: שְׁאָר指剩余之物；כֶּסֶף兼有“银子、钱财”之义。下文涉及金银器皿，“银子”既保留材质含义，也可指款项。
- source_word: וַיַּעֲשֵׂהוּ
  choice: 他用这些银子……制造
  rationale: 动词及宾语后缀均为单数；“他”最自然承接近处的耶何耶大，宾语后缀则指剩余的银子。译文不改成复数，以保存原文语法。
- source_word: כֵלִים
  choice: 器具
  rationale: 该词泛指器皿、用具或器械；在圣殿语境中，“器具”范围宽广且符合现代中文。
- source_word: כְּלֵי שָׁרֵת
  choice: 供事奉……用的器具
  rationale: שָׁרֵת在礼仪语境中指服事、供职。“事奉”表达圣殿服事，同时避免将其限定为某一特定职分。
- source_word: וְהַעֲלוֹת
  choice: 献上
  rationale: 这是עלה的使役式不定词，字面指使某物上升或献上；原文未明说宾语，因此不在此处直接补作“燔祭”。
- source_word: וְכַפּוֹת
  choice: 碗
  rationale: 该词可指有凹面的礼仪器皿，具体形制不完全确定；“碗”简明并保留其宽泛性。
- source_word: וּכְלֵי זָהָב וָכָסֶף
  choice: 金银器皿
  rationale: 简洁表达由金和银制成的器具，符合圣殿陈设语境。
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת ... תָּמִיד
  choice: 他们不断……献上燔祭
  rationale: “成为/处于”加分词，并有תָּמִיד强化，表达持续或惯常进行的行动；“不断”保留这种延续意味。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿里
  rationale: בֵּית יְהוָה字面为“雅威的家/殿”；此处明确指圣殿，现代中文以“雅威的殿”自然清楚。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为其常见的学术音译，保留专名性质，不以称号替代。
- issue: וְהַעֲלוֹת所献之物是否明确为燔祭
  choice: 在前半节译作“献上”，不补明宾语
  alternative: 献祭；献燔祭
  rationale: 该不定词本身没有明说宾语；虽然本节后半明确提到燔祭，但前半仍应保留原文的开放性，避免倒推并补足未出现的词。
- issue: 献燔祭行动的持续性
  choice: 不断献上燔祭
  alternative: 献了燔祭；经常献燔祭
  rationale: 分词结构与תָּמִיד共同指向持续或惯常行动。译作“不断”既保存延续性，也不额外解释其礼仪频率。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“办完以后”自然保留原文未明说宾语的特点；“器具、碗、金银器皿”保持清楚的圣殿清单语气；末句调整为中文自然语序，并以“不断”体现持续性的希伯来语结构。
