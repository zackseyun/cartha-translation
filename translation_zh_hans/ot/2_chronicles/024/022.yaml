source:
  edition: WLC
  text: וְ/לֹא זָכַ֞ר יוֹאָ֣שׁ הַ/מֶּ֗לֶךְ הַ/חֶ֨סֶד֙ אֲשֶׁ֨ר עָשָׂ֜ה יְהוֹיָדָ֤ע אָבִי/ו֙ עִמּ֔/וֹ וַֽ/יַּהֲרֹ֖ג אֶת בְּנ֑/וֹ וּ/כְ/מוֹת֣/וֹ אָמַ֔ר יֵ֥רֶא יְהוָ֖ה וְ/יִדְרֹֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: zh_hans
  text: 可是，约阿施王没有记念耶何耶大——他的父亲——向他所施的恩情[a][b]，还杀了耶何耶大的儿子。耶何耶大的儿子临死时说：“愿雅威看见，并追究此事。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩情”也可译作“忠诚”或“守约的慈爱”。
    reason: lexical_alternative
  - marker: b
    text: 耶何耶大并不是约阿施的生父；这里的“父亲”很可能是指他对约阿施具有父亲般的养育、保护和引导之责。
    reason: cultural_note
  - marker: c
    text: “追究此事”也可译作“查究此事”或“索讨罪责”。这里的希伯来语动词可指查究罪行并追讨责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא זָכַר
  choice: 没有记念
  rationale: 保留זכר“记得、记念”的基本意义；在上下文中也自然暗示约阿施没有以感恩和忠诚回应，但不把这一含义直接扩写进正文。
- source_word: הַחֶסֶד
  choice: 恩情
  rationale: חֶסֶד可表示仁慈、忠诚或守约之爱。在施恩者与受恩者的关系中，“恩情”既自然，又能体现需要铭记和报答的厚重情义。
- source_word: יְהוֹיָדָע אָבִיו
  choice: 他的父亲耶何耶大
  rationale: 按希伯来语保留“他的父亲”，不在正文中改写为“恩人”或“养父”；脚注说明这很可能指父亲般的身份，而非生父关系。
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: 还杀了耶何耶大的儿子
  rationale: “杀了”直接传达הרג；为避免连续两个“他”造成所指不清，明确重复“耶何耶大”。
- source_word: וּכְמוֹתוֹ
  choice: 那人临死时
  rationale: כְּמוֹתוֹ在这里具有时间意义，指耶何耶大的儿子临死之际；“那人”消除现代汉语中的代词歧义，同时不把本节未出现的名字补入正文。
- source_word: יֵרֶא יְהוָה
  choice: 愿雅威看见
  rationale: 未完成式在此表达祈愿或呼求；“愿……看见”保留原文简洁直接的司法诉求。
- source_word: וְיִדְרֹשׁ
  choice: 并追究此事
  rationale: דרש在罪责和公义语境中可指查究并要求交账。“追究”符合现代汉语；“此事”补明希伯来语省略的宾语，而不限定追究将采取何种方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的汉语音译，以保留原文使用上帝专名而非称号的特点。
theological_decisions:
- issue: 撒迦利亚临终呼求的性质
  choice: 译为请求雅威看见并追究这件事
  alternative: 译为请求雅威报仇，或译成“雅威必看见”这一陈述
  rationale: 两个动词的形式和语境更适合作祈愿；“追究”表达神施行司法问责，却不把原文进一步限定为直接报仇，从而保留其张力。
- issue: 耶何耶大被称为约阿施的“父亲”
  choice: 正文保留“他的父亲”，脚注说明可能是父亲般的身份
  alternative: 正文直接改为“恩人”“保护人”或“养父”
  rationale: 原文明确使用אָב“父亲”，而叙事背景表明这未必是生物学父子关系。保留原称谓并加注，既忠于文本，也避免误解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“记念”“恩情”“临死时”保持经文语体的凝练感，但不使用生僻古语。重复“耶何耶大”并使用“那人”，是为消除现代汉语连续代词可能造成的指代混乱。
