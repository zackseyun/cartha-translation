    rationale: 希伯来文为“耶何耶大、他的父亲”；以破折号标出同位语可保留字面称谓及其非生父的叙事张力。
  - severity: low
    issue: “那人临死时”指称泛化。
    rationale: 虽不改变含义，但直接说“耶何耶大的儿子临死时”更清楚地承接原文的“他的儿子”，避免现代汉语中“那人”显得疏离。
  - severity: medium
    issue: 脚注c的“要求偿还”不够准确。
    rationale: דרש在此司法语境是查究、索讨罪责或要求交账；“偿还”容易引向民事赔偿，且为原文省略宾语作了不必要的具体化。
