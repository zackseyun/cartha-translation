revisions:
- from: 可是，约阿施王没有记念他的父亲耶何耶大向他所施的恩情[a][b]，还杀了耶何耶大的儿子。那人临死时说：“愿雅威看见，并追究此事。[c]”
  to: 可是，约阿施王没有记念耶何耶大——他的父亲——向他所施的恩情[a][b]，还杀了耶何耶大的儿子。耶何耶大的儿子临死时说：“愿雅威看见，并追究此事。[c]”
  rationale: 修订仅改善同位语的汉语表达和临终者的指称清晰度，并校正脚注c可能误导为民事“偿还”的替代译法；不改变原文的祈愿语气、神名译法或司法问责所保留的含义范围。
