  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: zh_hans
  text: 然而，他差遣先知到他们中间，要使他们回转归向耶和华；先知警告他们[a]，他们却不肯听从。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作证指控他们。”原文动词既可指郑重警告，也可带有作证指控的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח בָּהֶם נְבִאִים
  choice: 他差遣先知到他们中间
  rationale: שלח用“差遣”符合先知受神委派的语境；בָּהֶם在此表示进入群体之中，译作“到他们中间”自然且准确。
- source_word: לַהֲשִׁיבָם אֶל יְהוָה
  choice: 要使他们回转归向耶和华
  rationale: שוב的使役形表示使人返回；“回转归向”既保留使役意义，也表达重新归向耶和华的关系性含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的专名形式，明确呈现四字神名。
- source_word: וַיָּעִידוּ בָם
  choice: 先知警告他们
  rationale: עוד的使役形可指郑重警告或作证；本句的先知劝诫语境中，“警告”在现代汉语里更自然，同时以脚注保留“作证指控”的司法色彩。重复“先知”可避免中文零主语产生歧义。
- source_word: וְלֹא הֶאֱזִינוּ
  choice: 他们却不肯听从
  rationale: האזין指留心听；结合持续悖逆的上下文，“不肯”体现拒绝，“听从”也自然传达听而顺服的语用含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是简体中文普通读者最广泛识别的传统专名，不以“主”替代原文神名，也不借此加入宗派解释。
- issue: וַיָּעִידוּ בָם的语义力度
  choice: 警告他们
  alternative: 作证指控他们
  rationale: 该动词兼有郑重警告和作证的含义。正文采用自然且切合先知劝诫语境的“警告”，脚注保留可能的司法性理解，不消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“然而……却……”清楚呈现转折；“回转归向”保留先知性劝返的力度。
