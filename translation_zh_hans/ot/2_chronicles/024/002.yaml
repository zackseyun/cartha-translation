source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: zh_hans
  text: 约阿施在祭司耶何耶大在世的日子里，行耶和华眼中看为正的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 行
  rationale: עָשָׂה在“行正事”这一评价君王的固定表达中，译作“行”简洁自然，也保留行为层面的含义。
- source_word: הַיָּשָׁר
  choice: 看为正的事
  rationale: יָשָׁר意为“正、正直”。与“在……眼中”连用时，现代汉语用“看为正的事”可自然表达评价含义。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在……眼中”的视角隐喻，同时按汉语语序组成“耶和华眼中看为正的事”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名YHWH最通行且易识别的音译“耶和华”，作为专名而非以“主”这一称号替代。
- source_word: כָּל יְמֵי
  choice: 一生的日子里
  rationale: 该短语直译为“所有……的日子”。这里指耶何耶大在世的整个时期；“一生的日子里”既保留“日子”的表达，也清楚传达时间范围。
- source_word: יְהוֹיָדָע
  choice: 耶何耶大
  rationale: 按现代中文圣经中常见的人名音译处理。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 准确表达כֹּהֵן所指的宗教职分，并作为同位称谓置于人名前。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应以专名呈现而不以“主”替代。“耶和华”是现代简体中文读者最熟悉、最易识别的传统音译；“雅威”更接近学界常见的拟音，但尚未同样普及。
- issue: 约阿施行正的时间限定
  choice: 明确限定在耶何耶大一生的日子里
  alternative: 只笼统译为“约阿施一生行正”
  rationale: 原文כָּל יְמֵי יְהוֹיָדָע明确把正面评价的时间范围与耶何耶大在世期间相连，不应扩大为约阿施整个一生。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“行……看为正的事”保留史书评价君王的传统语感；语序稍作汉语化处理，同时维持原文关于耶何耶大在世期间这一重要限定。
