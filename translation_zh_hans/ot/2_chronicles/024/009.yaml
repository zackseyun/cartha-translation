  text: וַ/יִּתְּנוּ ק֞וֹל בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֗ם לְ/הָבִ֤יא לַֽ/יהוָה֙ מַשְׂאַ֞ת מֹשֶׁ֧ה עֶֽבֶד הָ/אֱלֹהִ֛ים עַל יִשְׂרָאֵ֖ל בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: zh_hans
  text: 他们在犹大和耶路撒冷发布通告，要把摩西——上帝的仆人——在旷野向以色列人征定的献款[a]带来献给雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“征款”或“上帝的仆人摩西在旷野向以色列人征定的税款”。希伯来语可指按规定摊派或征收的款项。
    reason: 保留 מַשְׂאַת 可指献款、征款或税款的词义范围，并说明 עַל יִשְׂרָאֵל 所表达的向以色列人征定／加诸其上的关系。
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: 发布通告
  rationale: 该习语直译为“发出声音”，在此指公开宣告；“发布通告”自然传达其公开、正式的语气。
- source_word: בִּיהוּדָה וּבִירוּשָׁלִַם
  choice: 在犹大和耶路撒冷
  rationale: 按地点范围直译，保留宣告遍及犹大与耶路撒冷的含义。
- source_word: לְהָבִיא לַיהוָה
  choice: 要把……带来献给雅威
  rationale: לְהָבִיא 表目的，“带来”；לַיהוָה 表归向雅威。加“献”使汉语明确这是交纳给神的款项，而不改变原意。
- source_word: מַשְׂאַת
  choice: 献款
  rationale: 该词在本语境指按规定征集的宗教性款项。“献款”兼顾其献给神的性质；其可理解为摊派、征收款的语义以脚注保留。
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: 上帝仆人摩西
  rationale: 保留摩西的称号“上帝的仆人”，并按现代汉语调整语序。
- source_word: עַל יִשְׂרָאֵל
  choice: 为以色列所规定的
  rationale: עַל 在此可表示款项加在以色列身上，也可较宽泛地理解为关乎或为以色列；正文用“为以色列所规定的”自然表达规定对象，同时避免把它弱化为自愿捐献。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: 采用圣经语境中 מִדְבָּר 的常见译法，指摩西与以色列人在旷野时期。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可显明这是神的盟约名，而不是普通称号。
- issue: 摩西之款项与以色列的关系
  choice: 摩西在旷野为以色列所规定的献款
  alternative: 摩西在旷野向以色列征收的款项；摩西在旷野为以色列所设的献款
  rationale: מַשְׂאַת 与 עַל 的组合含有规定、摊派款项的意味，但具体是“献款”“征款”还是“税款”仍有词义张力；正文保留宗教奉献与规定义，脚注列出替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发布通告”体现公开宣告；“带来献给雅威”符合汉语表达；句中保留“上帝仆人摩西”和“旷野”等经文语域。
