  yaml_path: translation/ot/2_chronicles/017/017.yaml
  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: zh_hans
  text: 又从便雅悯支派，有大能的勇士以利雅大；随他有二十万人，都是装备着弓和盾牌的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “装备着弓和盾牌的”也可译作“携带弓和盾牌的”或“配备弓和盾牌的”。原文分词表示这些人装备了这些武器。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בִּנְיָמִן
  choice: 便雅悯支派中
  rationale: 介词短语承接前文的军队名册，并引出来自便雅悯的队伍；中文补出“支派”使部族含义清楚自然。
- source_word: גִּבּוֹר חַיִל
  choice: 大能的勇士
  rationale: 该固定搭配指勇猛、有战斗能力的人；此译既保留力量与英勇的含义，也符合庄重的现代汉语。
- source_word: אֶלְיָדָע
  choice: 以利雅大
  rationale: 按中文圣经人名的通行音译处理。
- source_word: וְעִמּוֹ
  choice: 跟随他的有
  rationale: 表达这批军士归在以利雅大统领之下，同时保持名单中先列统领、后列部众的结构。
- source_word: נֹשְׁקֵי
  choice: 配备
  rationale: 该分词在军事语境中表示装备、携带武器；“配备”自然地说明后列的弓和盾牌是军士的装备。
- source_word: קֶשֶׁת וּמָגֵן
  choice: 弓和盾牌
  rationale: 两个单数名词在此具有集合意义，指全体军士所配备的武器；中文按类别用单数形式即可。
- source_word: מָאתַיִם אָלֶף
  choice: 二十万人
  rationale: 直接表达原文的二十万兵员数目。
