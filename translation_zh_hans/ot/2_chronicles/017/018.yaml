  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
translation:
  language: zh_hans
  text: 在他旁边[a]的是约萨拔；与他同在的有十八万整装待战的军兵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在他手边”；这个说法也可能表示“在他统领之下”或“驻在他旁边”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“十八万装备齐全的军兵。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: 在他旁边
  rationale: עַל־יָדוֹ字面为“在他手边”，在人员或军事名单中可表示位于某人身旁，也可能含有归其统领的意味。“在他旁边”保留其空间和隶属关系上的含混，不武断译成“在他指挥之下”。
- source_word: יְהוֹזָבָד
  choice: 约萨拔
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: וְעִמּוֹ
  choice: 跟随他的有
  rationale: עִם表示“与……同在、随同”。在军事名单语境中，“跟随他的有”自然地表达这些人与该首领同行或隶属其队伍，同时不额外规定严格军衔关系。
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 十八万
  rationale: 准确表达希伯来文基数，并采用现代中文惯用数字表述。
- source_word: חֲלוּצֵי צָבָא
  choice: 整装待战的
  rationale: חֲלוּצֵי指已经配备、武装或列队预备行动的人，צָבָא限定其军事或作战用途。“整装待战”简洁自然，兼顾装备齐全和预备作战两层含义。
