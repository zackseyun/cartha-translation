base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: zh_hans
  text: 他在雅威的道路上心志高昂[a]；此外，他还从犹大除去了丘坛和亚舍拉柱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的心在雅威的道路上高起来”。这个说法可指心志高昂、刚强壮胆；这里的上下文是褒义，并非指他狂妄自大。
    reason: lexical_alternative
  - marker: b
    text: “亚舍拉柱”原文为复数，指与亚舍拉崇拜有关的祭祀物件；也可译作“亚舍拉木”或“神圣木柱”，其具体形制并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: 他……心志高昂
  rationale: 原文直译为“他的心高起来”。“心志高昂”保留“高”的意象，也自然表达此处积极的勇气与决心；不把这个在别处可能表示骄傲的说法强行译成负面含义。
- source_word: בְּדַרְכֵי יְהוָה
  choice: 在雅威的道路上
  rationale: 保留希伯来语“道路”的比喻，指雅威所定的生活方式与行为准则，并维持原句与“心志高昂”之间略带张力的结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现神的专名，而非用称号替代。
- source_word: וְעוֹד
  choice: 此外……还
  rationale: 准确表达原文添加另一项行动的递进、补充语气，符合现代汉语表达。
- source_word: הֵסִיר
  choice: 除去了
  rationale: 对应使役形动词“使离开、移除”，适合描述约沙法清除敬拜设施的行动，又不夸大为彻底废绝。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: 这是现代中文圣经语境中对古代高处祭祀场所的简明惯用译法。
- source_word: הָאֲשֵׁרִים
  choice: 亚舍拉柱
  rationale: 该复数名词指与亚舍拉崇拜有关的祭祀物件；“亚舍拉柱”兼顾可懂性与宗教关联，但以脚注说明其具体形制并不确定。
- source_word: מִיהוּדָה
  choice: 从犹大
  rationale: 自然表达这些敬拜设施被从犹大境内移除。
theological_decisions:
- issue: וַיִּגְבַּהּ לִבּוֹ 在此表示骄傲还是积极的勇气与决心
  choice: 译作“心志高昂”，按上下文理解为积极投身于雅威的道路
  alternative: 他的心因雅威的道路而自高；他在雅威的道路上刚强壮胆
  rationale: 该习语在不同语境中可有正面或负面含义；这里“在雅威的道路上”以及随后清除非法敬拜设施的行动构成正面评价。“心志高昂”既保留原文意象，也不完全抹去其语义张力。
- issue: אֲשֵׁרִים 所指祭祀物件的具体性质
  choice: 亚舍拉柱
  alternative: 亚舍拉木、亚舍拉像、神圣木柱
  rationale: 原词明确关联亚舍拉崇拜，但未精确说明物件的形制。“亚舍拉柱”便于普通读者理解，同时脚注保留其可能是木柱、圣木或其他祭祀物件的开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心志高昂”保留希伯来语的“心高起来”意象，又避免生硬直译；“丘坛”和“亚舍拉柱”简洁、易懂，并用脚注交代后者的词义范围。
