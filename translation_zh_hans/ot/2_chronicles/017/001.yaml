  text: וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּ֑י/ו וַ/יִּתְחַזֵּ֖ק עַל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: zh_hans
  text: 他的儿子约沙法接替他作王，并巩固自己的力量，以对抗以色列。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 准确表达该动词在王位承继语境中的意思，且符合现代汉语圣经叙事的庄重语体。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 这里指约沙法继承父亲亚撒的王位；译作“接替他”自然清楚，不额外补入原文未明说的身份。
- source_word: וַיִּתְחַזֵּק
  choice: 加强防备
  rationale: 该反身式动词有使自己强盛、巩固力量之意；结合下文在犹大设防驻军，译为“加强防备”体现其军事语境，同时避免笨拙的“使自己强大”。
- source_word: עַל יִשְׂרָאֵל
  choice: 以对抗以色列
  rationale: 介词עַל可表示针对或敌对方向；此处南北两国对峙的语境支持“对抗”，与英文本审定用词against一致。
theological_decisions:
- issue: עַל所表达的是统治还是敌对关系
  choice: 以对抗以色列
  alternative: 在以色列之上巩固自己的势力
  rationale: 约沙法并未统治北国以色列，且紧接着的经文描述他在犹大防御城中驻军，因此应保留敌对、防范的含义，而不暗示其拥有对以色列的主权。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他的儿子”承接上文所指的亚撒；句式保持简洁，并明确呈现王位承继及针对北国以色列的军事巩固。
