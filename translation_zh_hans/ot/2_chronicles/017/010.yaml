base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: zh_hans
  text: 耶和华的惊惧临到犹大四周各地的列国[a]，他们没有与约沙法交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“对耶和华的恐惧”或“从耶和华而来的惊惧”。希伯来语这一短语的属格关系可以指对耶和华的恐惧，也可以指由耶和华所引起的惊惧；本节的军事语境较可能指后者。
    reason: 词义与属格关系存在真实歧义。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的“וַיְהִי + 抽象名词 + עַל”表示某种状态开始笼罩或作用于一群人；“临到”既保留起始意味，也符合庄重的叙事语体。
- source_word: פַּחַד יְהוָה
  choice: 对耶和华的恐惧
  rationale: פַּחַד可指恐惧、惊惧或畏惧；属格结构既可能表示对耶和华的恐惧，也可能表示由耶和华所降的恐惧。正文采用直接、易懂的表达，脚注保留其来源义上的可能性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 按现代中文圣经传统，以“耶和华”音译以色列上帝的专名。
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: 临到……各地的所有王国
  rationale: עַל标明恐惧所影响的对象；מַמְלְכוֹת与הָאֲרָצוֹת两个名词均予保留，译为“各地的所有王国”，比逐字的“诸地的所有王国”更自然。
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: 犹大周围
  rationale: 该关系结构限定这些地区和王国位于犹大四周；中文简化为前置修饰语，语义不变。
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: 他们就没有与……交战
  rationale: נלחם עם在此指发动或进行军事冲突。“交战”准确体现政治军事语境；“就”自然呈现前述恐惧与未开战之间的叙事结果关系。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用该人名通行的现代中文圣经译名。
theological_decisions:
- issue: “耶和华的恐惧”在本节中的属格含义
  choice: 正文译作“对耶和华的恐惧”，在语境中理解为周围王国因耶和华而产生的惊惧
  alternative: “耶和华所降的恐惧”或“从耶和华而来的恐惧”
  rationale: 军事政治语境表明，这不是主要指敬虔的敬畏，而是使敌国不敢开战的惊惧。不过，希伯来语属格本身也容许将耶和华理解为恐惧的来源，因此不在脚注中排除这一含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“临到”和“交战”保留经文的庄严感，但避免生硬直译；地名、人名使用简体中文圣经读者熟悉的形式。
