base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: zh_hans
  text: 他作王第三年，差遣他的官员[a]——便亥伊勒、俄巴底亚、撒迦利亚、拿坦业和米该亚——到犹大各城教导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“首领”或“大臣”；希伯来语这个词可指王室或行政体系中的官员、长官。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: 他作王第三年
  rationale: 以自然的现代汉语表达“在他统治的第三年”，保留明确的王权和时间含义；句首连接词在中文叙事中无需机械译出。
- source_word: שָׁלַח
  choice: 差遣
  rationale: 该动词表示派出某人执行任务；“差遣”既准确又符合庄重的历史叙事语体。
- source_word: לְשָׂרָיו
  choice: 他的官员
  rationale: שַׂר 可指首领、长官、官员或王公；此处这些人受王委派执行教导任务，译作“官员”最能清楚传达其行政身份，又不暗示他们属于王族。
- source_word: לְבֶן חַיִל וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: 便亥伊勒、俄巴底亚、撒迦利亚、拿坦业和米该亚
  rationale: 均按希伯来文人名音译，并采用现代中文圣经读者较熟悉的译名形式。
- source_word: לְלַמֵּד
  choice: 教导
  rationale: 这是 למד 的使役/强化词干不定式，意为“教导”；中文不补出希伯来文未明说的受教对象。
- source_word: בְּעָרֵי יְהוּדָה
  choice: 到犹大各城
  rationale: בְּ 表示行动实施的地点；结合“差遣”，中文用“到……各城”自然表达他们在犹大诸城开展教导，且“各城”传达复数和分布范围。
theological_decisions: []
