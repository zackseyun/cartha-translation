source:
  edition: WLC
  text: כִּ֠י לֵֽ/אלֹהֵ֤י אָבִי/ו֙ דָּרָ֔שׁ וּ/בְ/מִצְוֺתָ֖י/ו הָלָ֑ךְ וְ/לֹ֖א כְּ/מַעֲשֵׂ֥ה יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: zh_hans
  text: 却[a]寻求他父亲的神，遵行他的诫命，不效法以色列[b]的行为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他寻求他父亲的神。”希伯来语连词也可表示“因为”；正文依照与上一节的对比译作“却”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“以色列”很可能指与犹大相对的北国以色列。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 却
  rationale: 本节承接上文，与约沙法不寻求诸巴力形成对比；“却”能在现代汉语中自然表达这一转折，同时以脚注保留“因为”的可能译法。
- source_word: לֵאלֹהֵי אָבִיו
  choice: 他父亲的神
  rationale: ל־在דָּרַשׁ之后标明寻求的对象，汉语无需另译介词；“他父亲的神”保留אָבִיו的单数形式及原文所表达的信仰承续。
- source_word: דָּרָשׁ
  choice: 寻求
  rationale: 此处不仅指求问信息，也指专心归向并敬奉神；“寻求”简洁且保留其信仰含义。
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: 遵行他的诫命
  rationale: 原文直译为“行在他的诫命中”。现代汉语用“遵行”自然表达按诫命生活，也保留了持续实践而非仅仅认同的含义。
- source_word: כְּמַעֲשֵׂה
  choice: 效法……的行为
  rationale: מַעֲשֶׂה在此指实际行为或行事方式；结合否定词译作“不效法……的行为”，比逐字译法更自然，同时准确传达“不照其行为而行”。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文仅称“以色列”，正文不扩写为“北国以色列”，以免把语境推断直接写入译文。
theological_decisions:
- issue: “以色列”的所指
  choice: 正文保留“以色列”，脚注说明这里很可能指与犹大相对的北国。
  alternative: 在正文中译为“北国以色列”或“亚哈家”。
  rationale: 原文保留了一定程度的指称张力；不在正文中扩写，可避免用解释取代翻译，同时脚注帮助读者理解历代志的历史语境。
- issue: כִּי的逻辑关系
  choice: 正文译为表示对比的“却”。
  alternative: 译为“因为”或“原来”。
  rationale: 结合上一节“不寻求诸巴力”，此句明显形成行为上的对照；不过כִּי常有原因说明功能，因此在脚注中保留该可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寻求”“遵行”是当代读者能够理解的宗教伦理用语；正文结构简洁，避免生硬照搬希伯来语的“行在诫命中”，也不把“以色列”的语境解释写入正文。
