  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֥י יְהוָ֖ה עִם יְהוֹשָׁפָ֑ט כִּ֣י הָלַ֗ךְ בְּ/דַרְכֵ֞י דָּוִ֤יד אָבִי/ו֙ הָ/רִ֣אשֹׁנִ֔ים וְ/לֹ֥א דָרַ֖שׁ לַ/בְּעָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: zh_hans
  text: 雅威与约沙法同在，因为他遵行他祖先大卫先前的道路[a]，没有寻求众巴力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他祖先大卫较早时期的道路。”希伯来文的“先前的”修饰“道路”，可能是要将这些道路与大卫后来的过失相区别。
    reason: “先前的”可译为“较早时期的”；脚注说明其可能暗示的对比，同时不把该解释强加于正文。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译保留上帝向以色列启示的专名，不用称号替代。
- source_word: וַיְהִי ... עִם
  choice: 与……同在
  rationale: 这是现代汉语圣经语体中自然清楚的表达，传达雅威的临在与扶助。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出雅威与约沙法同在的原因，因果关系明确。
- source_word: הָלַךְ בְּדַרְכֵי
  choice: 行在……道路上
  rationale: 保留希伯来文以行路比喻生活和品行的表达，同时符合庄重的现代汉语。
- source_word: דָּוִיד אָבִיו
  choice: 他祖先大卫
  rationale: אָב在王朝谱系语境中可指祖先；大卫并非约沙法的直接父亲，因此译作“祖先”可避免现代读者误解，同时保留其宗族关系。
- source_word: הָרִאשֹׁנִים
  choice: 早年的
  rationale: 表达大卫较早时期的行事，保留原文可能将其早期行为与后期过失相区别的意味。
- source_word: דָרַשׁ
  choice: 寻求
  rationale: 该词用于神明时可涵盖求问、倚靠和敬奉；“寻求”保留其较宽泛的宗教含义，不作过度限定。
- source_word: לַבְּעָלִים
  choice: 众巴力
  rationale: 希伯来文是复数，指不同地方或形态的巴力崇拜；“众巴力”明确保留复数。
theological_decisions:
- issue: 大卫作为榜样与其后期过失之间的张力
  choice: 他祖先大卫早年的道路
  alternative: 他祖先大卫起初所行的道路
  rationale: 原文 הָרִאשֹׁנִים 限定大卫较早时期的道路，可能有意不把大卫后来的失败包括在约沙法所效法的榜样中；正文与脚注共同保留这一限定及其措辞差异。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“行在……道路上”保留原文的伦理行路隐喻；“众巴力”保留复数；脚注标记已置于正文相应位置。
