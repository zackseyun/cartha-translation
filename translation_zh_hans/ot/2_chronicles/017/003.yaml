  to: 雅威与约沙法同在，因为他遵行他祖先大卫先前的道路[a]，没有寻求众巴力。
  rationale: 修订使“先前的”直接对应希伯来文对“大卫的道路”的限定，避免将其不必要地收窄为大卫的“早年”。其余译法忠实、自然，且脚注锚点保留在受限定的短语之后。
