base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/019.yaml
  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: zh_hans
  text: 这些人都是服事王的；此外，还有王安置在犹大全境的坚城中的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 指回上文所列的官长和军队；译为“这些人”简洁自然，并保留总结性的指示作用。
- source_word: הַמְשָׁרְתִים
  choice: 服事
  rationale: שׁרת的分词表示侍奉、供职或随侍，在此为王室和军事行政语境。“服事”既保留正式服务的含义，又不限定为宗教职分。
- source_word: אֶת־הַמֶּלֶךְ
  choice: 王
  rationale: את为直接宾语标记，所指为约沙法王；中文直接译作“王”。
- source_word: מִלְּבַד
  choice: 此外
  rationale: 表示除前述人员以外另有一组人员；“此外”自然地表达附加关系。
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: 王还……安置了人
  rationale: נתן基本义为“给、放置”，在此指王把人员配置在防御城市中。“安置”贴近原词而适合行政军事语境；补出“人”承接关系代词所指。
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: 在……坚城中
  rationale: 该组合词指设防加固的城市。“坚城”是简洁、庄重且易懂的圣经历史语体表达。
- source_word: בְּכָל יְהוּדָה
  choice: 犹大全境
  rationale: בְּכָל表达遍及整个地域的分布范围；“全境”自然传达全面性。
