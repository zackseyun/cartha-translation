  text: וַֽ/יְלַמְּדוּ֙ בִּֽ/יהוּדָ֔ה וְ/עִ֨מָּ/הֶ֔ם סֵ֖פֶר תּוֹרַ֣ת יְהוָ֑ה וַ/יָּסֹ֨בּוּ֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה וַֽ/יְלַמְּד֖וּ בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: zh_hans
  text: 他们在犹大教导，雅威的律法书与他们同在[a]；他们走遍犹大所有的城，在百姓中教导[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书”也可译为“书卷”；这里可指写在卷轴上的文献。
    reason: lexical_alternative
  - marker: b
    text: 或译：“教导百姓。”原文较直译为“在百姓中教导”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: 施教
  rationale: למד 的 Piel 形在此意为“教导”。译作“施教”简洁庄重，也能在本节两次出现时保持前后一致。
- source_word: בִּיהוּדָה
  choice: 在犹大
  rationale: 介词 בְּ 首先表示地点；后文“走遍犹大所有的城”已经清楚表达遍及各地的意思，无须在此增译“遍及”。
- source_word: וְעִמָּהֶם סֵפֶר תּוֹרַת יְהוָה
  choice: 随身带着雅威的律法书
  rationale: 希伯来文是无系词的伴随结构，直译为“与他们同在的是……书”。汉语用“随身带着”自然地表达该书伴随他们巡回施教，同时不改变信息重点。
- source_word: סֵפֶר
  choice: 书
  rationale: סֵפֶר 可指书写的文献或卷轴；正文采用现代汉语惯用的“书”，另以脚注保留“书卷”的可能。
- source_word: תּוֹרַת
  choice: 律法
  rationale: תּוֹרָה 可泛指教导或训诲，但在“雅威的律法书”这一搭配中指神赐给以色列的律法性文献，译作“律法”最清楚。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是四字神名 YHWH，不是“主”这一头衔；“雅威”保留其专名性质，也是现代汉语中通行的音译。
- source_word: וַיָּסֹבּוּ בְּכָל עָרֵי יְהוּדָה
  choice: 他们走遍犹大所有的城
  rationale: סבב 在此表示巡行各处；“走遍”自然传达他们逐城巡回的动作。
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: 在百姓中施教
  rationale: 介词 בְּ 表明教导是在百姓中进行；此译法保留该结构，而不直接改写为“教导百姓”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列神的专名 YHWH。正文采用“雅威”以保留专名性质，不以头衔“上主”代替；“耶和华”是传统形式，但较不贴近该名通常重构的读音。
- issue: תּוֹרָה 在本节中的含义
  choice: 律法
  alternative: 教导；训诲
  rationale: 该词本身语义可宽至“教导”，但与 סֵפֶר 构成“雅威的……书”时，语境指作为施教依据的神圣律法文献。译作“律法”不进一步界定其具体范围，以免超出本节所说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“施教”避免连续使用“教导”造成句式笨重，并与巡回讲授的语境相合；分号保留原文前后两组动作之间的推进关系。
