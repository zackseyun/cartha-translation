  rationale: 修订保留原文两个“教导”的重复、首句地点状语及“律法书与他们同在”的伴随结构，不把该结构进一步解释为主动携带。用现代自然的“教导”取代“施教”，并微调脚注a，使其准确而通顺地保留“书／书卷”的词汇可能性。
