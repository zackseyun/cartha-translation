base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/012.yaml
  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: zh_hans
  text: 约沙法日益强盛，达到极高的程度；他在犹大建造堡垒[a]和储备城[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坚固据点”。希伯来语指设防的坚固之地。
    reason: lexical_alternative
  - marker: b
    text: 或译“储藏城”“供应城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: 日益强盛，达到极盛
  rationale: “日益强盛”自然表达两个分词构成的持续增长之意；“达到极盛”单独保留 עַד לְמָעְלָה 的强化意味，避免将其完全吸收到前一短语中。
- source_word: וַיִּבֶן
  choice: 建造
  rationale: 符合叙事语境，也适用于堡垒及具有特定功能的城。
- source_word: בִּירָנִיּוֹת
  choice: 堡垒
  rationale: 指设防的坚固据点；“堡垒”在现代汉语中清楚自然，也避免“城堡”可能带来的中世纪联想。
- source_word: עָרֵי מִסְכְּנוֹת
  choice: 储备城
  rationale: 该词组指用于储存物资、承担供应功能的城；“储备城”简洁地兼顾储藏和供应含义。
- source_word: בִּיהוּדָה
  choice: 在犹大
  rationale: 直接表达建造活动发生的地点。
