base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: zh_hans
  text: 有些非利士人给约沙法送来贡物和成担运来的银子[a][b]；阿拉伯人也给他送来羊群：公绵羊七千七百只，公山羊七千七百只。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从非利士人那里”。希伯来语在这里既可强调来源，也可表示“有些非利士人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“银子，一担（重物）”，指作为贡物成担运来的银子。
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: 有些非利士人
  rationale: 介词 מִן 与族名连用，既可表示来源“从非利士人那里”，也可有部分义“有些非利士人”。正文采用自然的部分义表达，并用脚注保留来源义。
- source_word: מְבִיאִים
  choice: 送来
  rationale: 分词在叙事中可表示持续或惯常行为；现代汉语“送来”结合上下文即可自然表达这一动作，不必机械加入进行标记。
- source_word: מִנְחָה
  choice: 贡物
  rationale: 此处是外族向君王进献物品的政治语境，译作“贡物”比“礼物”或祭祀性的“供物”更准确。
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: 银子，作为一担担的贡品
  rationale: כֶסֶף 直译“银子”；מַשָּׂא 是“负荷、担子”。译文保留银子被成担运来的具体意象，同时说明其在本句中属于贡品。
- source_word: גַּם הָעַרְבִיאִים
  choice: 阿拉伯人也
  rationale: 保留 גַּם 的附加意义，并采用现代汉语通行的族群名称。
- source_word: ל/וֹ צֹאן
  choice: 给他送来牲畜
  rationale: צֹאן 是羊群等小型家畜的集合名词，后文具体列出公绵羊和公山羊；“牲畜”可作为自然的总称。
- source_word: אֵילִים
  choice: 公绵羊
  rationale: 明确表达成年雄性绵羊，较单说“公羊”更能与后面的公山羊区分。
- source_word: שִׁבְעַת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: 七千七百只
  rationale: 用汉字数字符合庄重、流畅的经文体例，并补量词“只”以合现代汉语习惯。
- source_word: וּ/תְיָשִׁים
  choice: 公山羊
  rationale: תְיָשִׁים 特指雄性山羊；“公山羊”准确且自然。
theological_decisions: []
