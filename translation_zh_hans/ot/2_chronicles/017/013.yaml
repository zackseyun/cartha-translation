  text: וּ/מְלָאכָ֥ה רַבָּ֛ה הָ֥יָה ל֖/וֹ בְּ/עָרֵ֣י יְהוּדָ֑ה וְ/אַנְשֵׁ֧י מִלְחָמָ֛ה גִּבּ֥וֹרֵי חַ֖יִל בִּ/ירוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/013.yaml
  text: And he had much work in the cities of Judah, and men of war, mighty men of valor, in Jerusalem.
translation:
  language: zh_hans
  text: 他在犹大各城有许多事务[a]；在耶路撒冷有作战的勇士，都是英勇善战的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事务”也可译作“工作”或“工程”；该词在某些语境也可指“产业”或“财物”。
    reason: 希伯来词מְלָאכָה语义范围较宽。正文避免将其限定为建设工程，脚注保留其可指工作、工程或财产的解释空间。
lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: 许多工程
  rationale: מְלָאכָה可指工作、事务或工程；结合上一节修筑堡垒和储货城的语境，“工程”既保留“工作”的基本含义，也比笼统的“许多工作”更符合现代汉语。
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: 战士
  rationale: 直指从事战争的人，即军人或战士；“战士”简洁自然。
- source_word: גִּבּוֹרֵי חַיִל
  choice: 英勇善战的勇士
  rationale: 该词组兼有勇猛、有能力和善战之意；此处军事语境下用“英勇善战”表达其综合含义。
theological_decisions:
- issue: “战士”与“英勇善战的勇士”的句法关系
  choice: 将后者理解为对前者的进一步说明，以“都是”连接
  alternative: 将两者理解为并列的两类人
  rationale: 希伯来文两组名词紧密相接而无并列连词，更自然地构成同位说明；译文不增加额外的神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在耶路撒冷还有……”补出希伯来文省略而汉语表达所需的谓语关系；“都是”明确紧邻名词组的同位关系。
