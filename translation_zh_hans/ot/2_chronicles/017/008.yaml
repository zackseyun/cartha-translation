base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: zh_hans
  text: 与他们同行的利未人有示玛雅、尼探雅、西巴第雅、亚撒黑、示米拉末、耶何拿单、亚多尼雅、多比雅和陀伯·亚多尼雅[a]；与他们同行的还有祭司以利沙玛和约兰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文分写作“陀伯 亚多尼雅”，很可能是一个复合人名；也有人将其理解为两个名字。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: 跟他们同去的
  rationale: 该介词短语表示这些人与上文所述人员同行；补出“同去的”符合现代汉语表达，同时保留陪同关系。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 保留原文对这一职分群体的明确称呼。
- source_word: שְׁמַעְיָהוּ
  choice: 示玛雅
  rationale: 按中文圣经人名的通行形式音译。
- source_word: נְתַנְיָהוּ
  choice: 尼探雅
  rationale: 按希伯来语名称音译，并采用现代中文较易辨读的形式。
- source_word: זְבַדְיָהוּ
  choice: 西巴第雅
  rationale: 按中文圣经人名的通行形式音译。
- source_word: עֲשָׂהאֵל
  choice: 亚撒黑
  rationale: 采用中文读者熟悉的传统音译。
- source_word: שמרימות
  choice: 示米拉末
  rationale: 按辅音文本所保存的人名音译；这是专名，不作意义翻译。
- source_word: יְהוֹנָתָן
  choice: 耶何拿单
  rationale: 原文是含较完整神名成分的长形式，译名尽量体现其与较短形式“约拿单”的区别。
- source_word: אֲדֹנִיָּהוּ
  choice: 亚多尼雅
  rationale: 采用中文圣经传统中通行的音译形式。
- source_word: טוֹבִיָּהוּ
  choice: 多比雅
  rationale: 采用中文圣经传统中通行的音译；原名所含的神名词尾不另作意译。
- source_word: טוֹב אֲדוֹנִיָּה
  choice: 陀伯·亚多尼雅
  rationale: 马所拉文本分写为两个成分，但句法上很可能构成一个复合人名；间隔号既表明其复合结构，也避免误读为两个人。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 明确保留原文对以利沙玛和约兰身份的说明，并与前面的利未人区分。
theological_decisions:
- issue: 利未人与祭司是否属于同一名单
  choice: 先列利未人，再另列同行的两位祭司
  alternative: 把所有人名一概列为利未人
  rationale: 原文重复“跟他们同去”，并在末尾以“祭司”明确限定以利沙玛和约兰，因此应保留两个群体之间的制度性区别。
- issue: טוֹב אֲדוֹנִיָּה 是一个复合人名还是两个相邻人名
  choice: 正文按一个复合人名“陀伯·亚多尼雅”处理，并加注说明
  alternative: 译成两个人“陀伯和亚多尼雅”
  rationale: 上下文名单结构及马所拉重音支持将其理解为一个复合专名，但分写形式仍容许读者意识到文本上的问题，因此不应无注释地消除歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“跟他们同去的……有”承接上下文，避免生硬照搬希伯来语省略系词的结构；人名以中文传统音译为基础，同时在耶何拿单及复合名等处尽量反映原文形态。
