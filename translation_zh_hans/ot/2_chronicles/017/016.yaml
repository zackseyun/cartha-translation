base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: zh_hans
  text: 在他麾下的是细基利的儿子亚玛斯雅；他自愿献身于雅威[a]，与他一同的有二十万勇士。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他自愿为雅威献上自己。”希伯来语分词强调自愿的自我奉献，而介词既可理解为“向”，也可理解为“为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: 在他以下的是
  rationale: עַל־יָד在军队名册的层级语境中表示处于前述统领之下；译文以现代汉语清楚表达隶属关系，同时避免把原文具体化为未明说的“指挥”。
- source_word: עֲמַסְיָה בֶן זִכְרִי
  choice: 细基利的儿子亚玛斯雅
  rationale: 按希伯来语姓名音译，并以自然的汉语谱系表达保留“某人的儿子”这一关系。
- source_word: הַמִּתְנַדֵּב
  choice: 自愿献身
  rationale: נדב的Hitpael分词突出主动、自愿地奉献自己；“自愿献身”兼顾其自愿性和反身的自我奉献意味。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词ל可表达奉献的对象或所为对象；“给雅威”与“献身”搭配自然，并保留方向性，但其“为雅威”的可能含义列入脚注。
- source_word: וְעִמּוֹ
  choice: 率领
  rationale: 直译为“与他一起”也可成立；在军事编制名册中，这二十万人是随同亚玛斯雅的部队，汉语用“率领”简洁表达其功能关系。
- source_word: מָאתַיִם אֶלֶף
  choice: 二十万
  rationale: 准确转换希伯来语数词。
- source_word: גִּבּוֹר חָיִל
  choice: 勇士
  rationale: 该固定军事用语指有力量、有作战能力的精锐战士；“勇士”自然、庄重，且不显冗赘。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟音，也保留其作为专名的性质。
- issue: 亚玛斯雅自愿委身的对象或目的
  choice: 自愿献身给雅威
  alternative: 自愿为雅威献上自己
  rationale: ל既可指奉献所朝向的对象，也可表达“为了”；正文采用简洁自然的对象表达，脚注保留目的性读法，不替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的军队名册文体。句首保留编制层级，后半句以“率领”顺应汉语表达；神名音译为“雅威”。
