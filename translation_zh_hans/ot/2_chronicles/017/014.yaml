base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: zh_hans
  text: 以下是他们按父系家族编制的军队[a]：犹大的千夫长中，押拿是统领；与他同在的英勇战士有三十万。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们按父系家族登记的人数如下”。这里的希伯来词可指点名统计、登记入册，也可指由此形成的军队编制。
    reason: 保留פְקֻדָּתָם在军事语境中可指统计、登记或编组结果的词义范围。
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: 点名编组的军队
  rationale: 该词在此军事语境中可指点名统计、登记入册，或由此形成的军队编制。“点名编组的军队”兼顾清点与组织两层含义，并与随后列出的军官和兵员数相衔接。
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: 按父系家族
  rationale: 这是家谱和行政用语，指以父系宗族为单位进行组织；“按父系家族”比直译为“按父家”更符合现代汉语。
- source_word: לִיהוּדָה
  choice: 犹大的
  rationale: 在名单中引出犹大所属的部队和军官，作为下列条目的范围限定。
- source_word: שָׂרֵי אֲלָפִים
  choice: 千夫长
  rationale: 指统领以千计兵员之军事单位的军官；“千夫长”简洁、易懂，也保留原文的单位规模。
- source_word: עַדְנָה הַשָּׂר
  choice: 统领押拿
  rationale: הַשָּׂר表明押拿在本条目中的军官身份；用“统领”既保留职权含义，又避免与前面的“千夫长”机械重复。
- source_word: גִּבּוֹרֵי חַיִל
  choice: 勇士
  rationale: 该固定军事表达指有能力、英勇善战的战士；“勇士”在现代汉语中自然凝练，并保留其褒义军事色彩。
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: 三十万
  rationale: 忠实表达原文的基数“三百个千”，即三十万。
theological_decisions: []
