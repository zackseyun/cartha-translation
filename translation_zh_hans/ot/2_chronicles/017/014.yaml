    text: 或译“他们按父系家族登记的人数如下”。这里的希伯来词可指点名统计、登记入册，也可指由此形成的军队编制。
    reason: 保留פְקֻדָּתָם在军事语境中可指统计、登记或编组结果的词义范围。
