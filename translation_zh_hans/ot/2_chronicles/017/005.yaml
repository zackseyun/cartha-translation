  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: zh_hans
  text: 雅威使王国在他手中得以稳固；全犹大都向约沙法献上贡物[a]；他拥有极多的财富和尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贡物”也可译作“礼物”、“馈赠”或“供物”。希伯来词 מִנְחָה 的含义较广；本节的王室语境较支持“贡物”。
    reason: 保留 מִנְחָה 的词义范围，并说明本译文依王室政治语境采用“贡物”。
lexical_decisions:
- source_word: וַיָּכֶן
  choice: 使……稳固
  rationale: כון的使役形在此表示使王权或国度确立、稳固；这一译法保留“使之坚定”的含义，又不局限为军事上的增强。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名直接音译为“雅威”，不以称号替代其专名。
- source_word: הַמַּמְלָכָה
  choice: 王国
  rationale: מַמְלָכָה可指王国或王权；“王国”在本句政治语境中自然，也保留了原词可能兼含疆域与统治权的宽度。
- source_word: בְּיָדוֹ
  choice: 在他手中
  rationale: 保留希伯来文“在他手中”的意象，现代汉语亦可自然表达掌握、控制或归属。
- source_word: וַיִּתְּנוּ כָל־יְהוּדָה
  choice: 全犹大的人都……献上
  rationale: “全犹大”是集合性主语，指犹大境内的民众；补出“的人”使现代汉语顺畅，“献上”符合向君王呈交物品的场景。
- source_word: מִנְחָה
  choice: 贡物
  rationale: 该词可指礼物、供物或祭物；在巩固君王统治的政治语境中，“贡物”最贴切，同时以脚注保留其他词义可能。
- source_word: לִיהוֹשָׁפָט
  choice: 向约沙法
  rationale: 采用该人名在现代中文圣经语境中的通行音译，并用“向”配合“献上”。
- source_word: וַיְהִי לוֹ
  choice: 他便拥有
  rationale: 这是表示所有或所得状态的希伯来语结构；“拥有”符合现代汉语表达，“便”承接前文结果，但不额外规定严格的因果关系。
- source_word: עֹשֶׁר
  choice: 财富
  rationale: עֹשֶׁר指物质财富；“财富”庄重而通俗。
- source_word: וְכָבוֹד
  choice: 和尊荣
  rationale: כָבוֹד在君王语境中主要指地位、声望和荣耀；“尊荣”比“荣耀”更能避免误解为专属神性的荣光。
- source_word: לָרֹב
  choice: 极多的
  rationale: 该短语表示数量丰盛；置于“财富和尊荣”之前，符合自然现代汉语，并传达丰厚充足之意。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的四字神名；译作“雅威”旨在保留专名性质，而不以“主”等称号替代。
- issue: מִנְחָה在本节是贡物还是一般礼物／供物
  choice: 贡物
  alternative: 礼物、供物或祭物
  rationale: 上下文涉及约沙法王权的稳固，因此政治性的“贡物”较合适；但该词本身语义较宽，故以脚注保留其他可能，避免把词义绝对限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使王国稳固在他手中”保留原文的手之意象；“全犹大的人”将集合性地名转为自然汉语。脚注标记紧随其所解释的“贡物”。
