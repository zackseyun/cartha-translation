base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: zh_hans
  text: 他在犹大所有的坚城里驻扎军队，又在犹大境内和他父亲亚撒攻取的以法莲各城中设置驻军。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驻军”或译“官员”、“长官”。希伯来语 נְצִיבִים 既可指受任命的官员，也可指驻防人员；本节的军事语境支持译作“驻军”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: 驻扎军队
  rationale: נתן本义为“放置、设置”，与חַיִל及坚城连用时表示部署军事力量；“驻扎军队”符合现代汉语军事语境。
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: 在犹大所有的坚城里
  rationale: הַבְּצֻרוֹת指设防的城邑；“坚城”简洁、庄重，也为普通读者熟悉。
- source_word: נְצִיבִים
  choice: 驻军
  rationale: 该词可指受任命的官员、长官，也可在军事语境中指驻防人员或驻军。本节先提在坚城部署军队，且涉及攻取的城邑，因此正文采用“驻军”，同时用脚注保留行政职官的可能。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 在犹大境内
  rationale: אֶרֶץ在此指犹大的地域；“境内”自然地表达其范围，并与后面的各城相衔接。
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: 和……以法莲各城中
  rationale: 忠实保留以法莲这一支派兼地域名称；“各城”在现代汉语中自然。
- source_word: אֲשֶׁר לָכַד
  choice: 攻取的
  rationale: לכד用于城邑时通常指军事上的夺取；“攻取”准确体现该语境。
- source_word: אָסָא אָבִיו
  choice: 他父亲亚撒
  rationale: 按自然汉语语序清楚表明亚撒与约沙法的父子关系。
