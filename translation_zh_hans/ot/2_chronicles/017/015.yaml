  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: zh_hans
  text: 又在他手下[a]的是将领约哈难；与约哈难同在的有二十八万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他身旁”或“在他的权柄之下”。希伯来语这一习语直译为“在他手上”。
    reason: 保留该希伯来语习语在空间关系与权属关系之间的词义可能性。
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: 又在他手下
  rationale: 希伯来语习语字面为“在他手上”，在此军队编制名单中表示处于某人的统辖之下；“在他手下”既自然，也保留了原文的形象。句首的 וְ 译作“又”，承接前文名单。
- source_word: יְהוֹחָנָן
  choice: 约哈难
  rationale: 按希伯来语人名形式音译，并采用现代中文圣经语境中清楚、通行的写法。
- source_word: הַשַּׂר
  choice: 将领
  rationale: שַׂר 可指首领、官长或军队指挥者；本节处于军事编制和兵员统计语境中，因此译作“将领”。
- source_word: וְעִמּוֹ
  choice: 跟随他的有
  rationale: 原文直译为“与他同在的”；这里引出归属约哈难的兵员数。“跟随他的有”符合中文表达，同时不额外规定更具体的军阶关系。
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 二十八万人
  rationale: 准确表达二百八十千，即二十八万；采用现代汉语最自然的计数方式。
