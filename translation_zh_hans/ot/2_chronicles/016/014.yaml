  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: zh_hans
  text: 他们把他葬在大卫城他为自己凿出的墓地中，又把他安放在一张床榻[a]上；这床榻上满是香料和各种按调香工艺配制的芳香制品。他们又为他举行了极其盛大的焚烧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “床榻”也可译作“床”或“躺卧之处”；在这里可能指丧葬时安放遗体的榻架。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“他们为他作了一场极大的焚烧”，没有明说所烧的是什么；这里很可能指在丧礼中焚烧香料或其他芳香物以示哀荣，并非说他的遗体被火化。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ בְקִבְרֹתָיו
  choice: 他们把他葬在……坟墓里
  rationale: 动词明确表示埋葬。קִבְרֹתָיו 虽为复数形式，在此可指其墓穴或墓葬建筑；现代汉语用单数“坟墓”更自然，也不暗示多个互不相干的墓。
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: 他为自己凿出的
  rationale: כּרה 有挖掘、开凿之意；墓穴语境中“凿出”自然地传达可能在岩石中开凿的动作。
- source_word: בְּעִיר דָּוִיד
  choice: 在大卫城
  rationale: 采用清楚、通行的地名译法。
- source_word: וַיַּשְׁכִּיבֻהוּ בַּמִּשְׁכָּב
  choice: 又把他安放在卧榻上
  rationale: 使役形动词表示使其躺下或将其安放。מִשְׁכָּב 本义为躺卧之处、床榻；“卧榻”保留词义范围，脚注说明其在丧葬场景中的可能功能。
- source_word: אֲשֶׁר מִלֵּא
  choice: 榻上铺满了
  rationale: 希伯来文为第三人称阳性单数完成式，主语并未明说。“铺满了”以自然汉语表达准备完成后的状态，同时不武断指定施事。
- source_word: בְּשָׂמִים וּזְנִים
  choice: 香料和各种……香膏
  rationale: בְּשָׂמִים 指芳香物；罕见词 זְנִים 在此通常理解为不同种类的芳香制品。结合后面的“配制”，译作“各种……香膏”，但承认该罕见词的具体所指并不完全确定。
- source_word: מְרֻקָּחִים בְּמִרְקַחַת מַעֲשֶׂה
  choice: 按调香之术配制的
  rationale: רקח 词族涉及调配香料、香膏；此译保留专业技艺和人工配制的含义，又符合现代汉语。
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: 他们还为他焚烧了极多的香料
  rationale: 字面为“为他焚烧了一场极大的焚烧”。上下文先说安葬，相关王室丧葬语境也支持焚烧芳香物以示哀荣；正文采用自然的情境性表达，脚注保留希伯来文未明说焚烧对象这一点。
theological_decisions:
- issue: 丧礼中“极大的焚烧”是否指火化遗体
  choice: 理解为为亚撒举行的大规模芳香物焚烧仪式
  alternative: 火化遗体，或经文未说明焚烧对象的一般丧礼火焚
  rationale: 本节先明确说亚撒被埋葬，又被安放在铺有芳香物的卧榻上；因此“为他焚烧”较可能是焚烧香料等芳香物以示哀荣，而不是断言焚尸。脚注仍明示原文没有说出焚烧的具体对象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“安放”“卧榻”“调香之术”保持丧葬场景的尊严；正文流畅表达可能含义，脚注则保留罕见词、卧榻功能和焚烧对象的原文不确定性。
