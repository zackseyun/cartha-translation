base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: zh_hans
  text: 亚撒在位第三十六年[a]，以色列王巴沙上来攻打犹大，修建拉玛，为要使人不得到犹大王亚撒那里出入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“亚撒作王的第三十六年”。这一纪年与《列王纪上》所记巴沙的年代存在张力。有人认为这里是从王国分裂时起算，也有人主张校订文字，以协调年代。
    reason: 保留原文读法，同时向读者说明年代上的张力和主要解释。
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֵׁשׁ לְמַלְכוּת אָסָא
  choice: 亚撒在位第三十六年
  rationale: 按马所拉文本保留明确的纪年方式；“在位第三十六年”是现代汉语自然、庄重的表达。
- source_word: עָלָה ... עַל יְהוּדָה
  choice: 上来攻打犹大
  rationale: 保留עלה“上来”的方向性，同时以“攻打”明确军事语境中עַל的敌对含义。
- source_word: וַיִּבֶן אֶת הָרָמָה
  choice: 修建拉玛
  rationale: בנה基本义为“建造、修建”；上下文可能涉及设防，但正文不把动词收窄为“加固”或“筑垒”。
- source_word: לְבִלְתִּי תֵּת
  choice: 为要阻止
  rationale: 表达目的及禁止、阻断之意，符合现代汉语行文。
- source_word: יוֹצֵא וָבָא
  choice: 人出入
  rationale: 用简洁自然的汉语保留“出去和进来”这一对举，表示人员往来。
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: 到犹大王亚撒那里去
  rationale: 将介词ל的关系或方向意义译出；不擅自扩展成“归附”或“双向往来”。
theological_decisions:
- issue: 本节纪年与《列王纪上》所记巴沙年代表面上存在张力
  choice: 正文保留马所拉文本“亚撒在位第三十六年”
  alternative: 按王国分裂起算第三十六年；或校订为亚撒在位第二十六年
  rationale: 现存希伯来文本明确作“亚撒在位第三十六年”。翻译不应在正文中暗自协调或改订，而应通过脚注如实说明年代张力及主要解释。
translation_notes:
  register: 采用现代标准普通话和简体中文，语气庄重而清楚。地名רמה音译为“拉玛”。“修建”避免超出בנה本身而直接解释为“加固”；末句保持方向上的含混，不加入“投奔”等原文未明说的动机。
