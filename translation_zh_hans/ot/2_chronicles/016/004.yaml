base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: zh_hans
  text: 便哈达听了亚撒王的话，就派遣他军队的将领前往以色列的城邑。他们攻打以云、但、亚伯玛音[a]，以及拿弗他利所有的储备城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文本作“亚伯玛音”；有人认为这就是平行经文中的“亚伯伯玛迦”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听从
  rationale: 此处不仅表示听见，也表示便哈达接受并照亚撒的请求采取行动；“听从”自然地传达听取并响应之意，但不像“服从”那样过度强调上下级关系。
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: 他手下的军队将领
  rationale: שָׂרֵי 表示将领，הַחֲיָלִים 指军事力量，אֲשֶׁר לוֹ 表明这些力量或将领属于便哈达；此译法符合现代汉语表达。
- source_word: אֶל עָרֵי יִשְׂרָאֵל
  choice: 去攻打以色列各城
  rationale: 介词 אֶל 在派兵的军事语境中表示行动所针对的目标；“去攻打”清楚表达其方向和敌对性质。
- source_word: וַיַּכּוּ
  choice: 他们攻打了
  rationale: נכה 在军事叙事中可指击打、攻击或击败；“攻打”保留军事行动的含义，同时不额外断定这些城全被占领。
- source_word: עִיּוֹן
  choice: 以云
  rationale: 按希伯来地名音译，并采用简明、常见的中文圣经地名形式。
- source_word: אָבֵל מָיִם
  choice: 亚伯玛音
  rationale: 直接依照本节马所拉文本的地名音译，不在正文中与平行经文的“亚伯伯玛迦”协调。
- source_word: כָּל מִסְכְּנוֹת עָרֵי נַפְתָּלִי
  choice: 拿弗他利所有的储备城
  rationale: מִסְכְּנוֹת 指用于储存物资之处；结合“城”的结构关系，译作“储备城”既简洁，又能反映其储存和供应功能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文忠实保留马所拉文本的地名“亚伯玛音”，并将可能的平行地名辨认置于脚注；军事动词译为“攻打”，避免将原文可能涵盖的攻击、击败或占领含义限定得过死。
