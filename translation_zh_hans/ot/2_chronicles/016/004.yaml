  to: 便哈达听了亚撒王的话，就派遣他军队的将领前往以色列的城邑。他们攻打以云、但、亚伯玛音[a]，以及拿弗他利所有的储备城。
  rationale: 以“听了亚撒王的话”表达便哈达对请求的积极回应，同时不强化为服从关系；删除前句预置的“攻打”，使“派遣”与随后“攻打”的两个叙事动作分别对应原文。
