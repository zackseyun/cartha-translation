base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: zh_hans
  text: 亚撒王召集全犹大人[a]，他们把拉玛的石头和木料，就是巴沙用来建造拉玛的材料[b]，都搬走了。亚撒用这些材料建造了迦巴和米斯巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “召集全犹大人”，原文直译为“取了全犹大”；这里指动员犹大人参加工程。
    reason: lexical_alternative
  - marker: b
    text: 即巴沙建造拉玛工事时所用的石头和木料。
    reason: lexical_clarification
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: 召集全犹大人
  rationale: 字面为“取了全犹大”，但在本段语境中是动员犹大众人参与搬运工程；现代汉语译作“召集”能自然表达该习语的实际含义，并以脚注保留字面措辞。
- source_word: וַיִּשְׂאוּ
  choice: 他们……都搬走了
  rationale: נשׂא在此指抬起并运走建筑材料；“搬走”符合拆除拉玛工事、转运材料的语境。
- source_word: אַבְנֵי הָרָמָה
  choice: 拉玛的石头
  rationale: 保留希伯来语所属结构；在上下文中指拉玛工事所用的石头。
- source_word: עֵצֶיהָ
  choice: 木料
  rationale: 这里所说的是建筑用木材；汉语“木料”比泛称“木头”更切合施工语境。所属关系已由“拉玛的石头和木料”自然表达。
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: 就是巴沙用来建造拉玛的材料
  rationale: 原文关系从句在形式上简略，语境表明石头和木料是巴沙建造拉玛时所用的材料；译文补出宾语“拉玛”，使现代汉语清楚，脚注说明这一理解。
- source_word: וַיִּבֶן בָּהֶם
  choice: 亚撒用这些材料建造了
  rationale: 单数动词的主语回指亚撒，复数代词指前述石头和木料；明确姓名可避免汉语代词歧义，同时不加入原文未明说的“加固”。
- source_word: גֶּבַע
  choice: 迦巴
  rationale: 采用现代中文圣经地名的常见音译。
- source_word: הַמִּצְפָּה
  choice: 米斯巴
  rationale: 采用现代中文圣经地名的常见音译；希伯来语定冠词不另行译出。
theological_decisions: []
