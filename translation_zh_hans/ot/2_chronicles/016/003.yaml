base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: zh_hans
  text: “我和你之间有约[a]，我父亲和你父亲之间也有约。看，我已送给你金银。去废除你与以色列王巴沙所立的约，使他从我这里退去。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约”也可译作“条约”或“盟约”；这里指君王之间的政治协定。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使他从我上面上去”，意即使巴沙不再向亚撒施压或用兵，退去离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: 约
  rationale: 此处指君王之间的政治协定。“约”既保留希伯来词在本节两次出现的对应关系，又能涵盖条约、盟约等含义；具体政治性质由上下文和脚注说明。
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: 我和你之间……我父亲和你父亲之间也……
  rationale: 保留原文反复使用“之间”的平行外交表述，同时以“也”使现代汉语自然顺畅。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留引人注意的语用作用，表达自然且不使用古奥的“看哪”。
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: 我给你送来了金银
  rationale: 完成体在书信和外交语境中表示已经送出且与当前请求直接相关；“送来了”符合现代汉语表达。
- source_word: לֵךְ
  choice: 去
  rationale: 直接保留命令语气，引出所要求的行动。
- source_word: הָפֵר
  choice: 废除
  rationale: 使役形在此表示使所立的约失效；“废除”比“破坏”更准确地表达正式取消政治协定。
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: 你与……巴沙所立的约
  rationale: 自然表达该约涉及巴沙，同时补出汉语习惯所需的“所立”。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 采用现代汉语中简洁、标准的王室称号。
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: 使他从我这里撤军
  rationale: 原文直译为“使他从我上面上去/离去”，在当前军事压力的语境中指巴沙撤离、不再进逼；正文清楚表达语境意义，脚注保留原文意象和较宽泛的可能性。
theological_decisions: []
