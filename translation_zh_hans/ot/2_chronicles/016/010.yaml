base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: zh_hans
  text: 亚撒恼怒那先见，把他关进监牢[a]，因为他因这事对那先见大为愤怒。那时，亚撒也残酷地欺压民中的一些人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“枷锁房”；这个希伯来语短语可能指一处以刑具束缚人的拘禁场所。
    reason: lexical_alternative
  - marker: b
    text: “欺压”原文带有“压碎、击碎”的强烈意味，也可译作“摧残”或“虐待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: 恼怒
  rationale: כעס表示生气、恼怒；“恼怒”符合叙事语体，又不额外夸大其程度。
- source_word: הָרֹאֶה
  choice: 先见
  rationale: רֹאֶה是较古老的先知称谓，字面意为“看见者”；“先见”能区别于较宽泛的“先知”，也符合中文圣经语体。
- source_word: וַיִּתְּנֵהוּ בֵּית הַמַּהְפֶּכֶת
  choice: 把他关进监牢
  rationale: נתן在此表示把某人置于某处；难解短语בֵּית הַמַּהְפֶּכֶת指用于拘禁、可能带有枷锁刑具的场所。正文按上下文译作“监牢”，具体形式保留于脚注。
- source_word: בְזַעַף עִמּוֹ עַל זֹאת
  choice: 为这事向先见大发烈怒
  rationale: זַעַף表示强烈的愤怒；“大发烈怒”传达其强度。把代词明确为“先见”，避免连续两个“他”在现代汉语中指代不清。
- source_word: וַיְרַצֵּץ
  choice: 残酷地欺压
  rationale: רצץ的基本意象是压碎、击碎，在以人为宾语的语境中表示严酷虐待或压迫；“残酷地欺压”既自然，也保留该动词的暴力强度。
- source_word: מִן הָעָם
  choice: 民中的一些人
  rationale: 介词מִן在这里有部分义，所指是民众中的一部分，并非全体百姓。
- source_word: בָּעֵת הַהִיא
  choice: 就在那时
  rationale: 准确表达时间短语，并以“就”自然衔接同一时期发生的另一项暴行。
theological_decisions: []
