  source_fidelity: 译文整体准确呈现了亚撒对先见发怒、拘禁先见，以及后来严酷对待部分民众的叙事。‘先见’恰当地保留了רֹאֶה这一较具特征的称谓；‘民中的一些人’也表达了מן的部分义。惟开头‘那时’无对应的明确时间短语，且与句末‘就在那时’重复；原文的时间短语只出现在末句。
  naturalness: ‘因为他为这事向先见大发烈怒’语义清楚，但‘大发烈怒’在现代标准汉语中搭配略显生硬；改为‘因这事对那先见大为愤怒’更自然、庄重。删去开头无来源的‘那时’，使末句时间语自然落在其原有位置。
  terminology: ‘监牢’作为בֵּית הַמַּהְפֶּכֶת的上下文译法可接受，脚注保留其可能涉及枷锁或束缚刑具的含义。‘残酷地欺压’可传达רצץ对人的严酷、暴力性质；脚注应保留‘压碎、击碎’的字面意象及替代译法。
