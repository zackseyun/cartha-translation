  to: 亚撒恼怒那先见，把他关进监牢[a]，因为他因这事对那先见大为愤怒。那时，亚撒也残酷地欺压民中的一些人[b]。
  rationale: 修正无原文依据的首句时间提示及其与末句时间短语的重复，并将稍显生硬的‘大发烈怒’改为自然的现代书面语。其余关键译词、脚注内容及脚注锚点均保留，未改变经文含义。
