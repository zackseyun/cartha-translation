base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: zh_hans
  text: 亚撒在位第三十九年，脚上患病，病情极其严重；然而，他即使在病中也没有寻求雅威，却求助于医生[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有求问雅威，却求问医生。”希伯来语后半句有所省略，直译近于“没有寻求雅威，却在医生那里”，重点在于两者的对比。
    reason: 保留דרש的“寻求／求问”语义幅度，并说明末句省略结构所造成的译法差异。
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: 患了病
  rationale: חלה表示生病或衰弱；“患了病”在现代汉语中自然，并与下文“病情”“病中”形成清楚呼应。
- source_word: בְּרַגְלָיו
  choice: 他的脚
  rationale: רֶגֶל可指脚或腿；此处按其常见具体义译作“脚”，同时不对病症作超出原文的医学判断。
- source_word: עַד לְמַעְלָה
  choice: 极其严重
  rationale: 此处是程度强化语，描述病势严重，并非空间意义的“向上”。
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: 病情／病中
  rationale: 依汉语搭配分别译为“病情”和“病中”，既保留同一词根的联系，也避免生硬重复。
- source_word: דָרַשׁ אֶת יְהוָה
  choice: 寻求雅威
  rationale: דרש用于上帝时可涵盖寻求、求问或求助；“寻求”保留较宽的盟约性含义，不把意思限缩为询问信息或祈求医治。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名的性质，而不以“主”这一称号替代。
- source_word: כִּי בָּרֹפְאִים
  choice: 却求助于医生
  rationale: 希伯来语原句省略了与דרש相应的动作，只说“却／而在医生那里”；汉语补出“求助于”以表达上下文中的对比，并以脚注保留其省略性及另一译法。
theological_decisions:
- issue: 本节是否谴责医疗或医生本身
  choice: 保留亚撒没有寻求雅威、反而求助于医生的对比，但不扩展为对医疗行为本身的全面否定。
  alternative: 把本节理解为禁止求医，或把求医仅视为与不寻求上帝无关的附带事实。
  rationale: 原文的重点是寻求对象的对比。译文应呈现亚撒对雅威的忽视，却不加入“所有医疗都不合法”这一原文未明说的结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“在位第三十九年”是中文历史叙事的自然表达；“即使在病中”对应原文וְגַם的强调。“雅威”作为神名音译，与称号“主”相区别。
