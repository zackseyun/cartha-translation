  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: zh_hans
  text: 那时，先见哈拿尼来见犹大王亚撒，对他说：“因为你倚靠亚兰王[a]，没有倚靠雅威你的神，所以亚兰王的军队从你手中逃脱了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“叙利亚王”；希伯来文作“亚兰”。
    reason: 说明传统地名译法，同时保留希伯来文的名称。
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: 那时
  rationale: 以自然、简洁的现代汉语表达叙事的时间框架；句首连接词不必机械译出。
- source_word: חֲנָנִי הָרֹאֶה
  choice: 先见哈拿尼
  rationale: “先见”保留רֹאֶה这一特定的先知性称号，不笼统改译为“先知”；人名按通行形式音译。
- source_word: אָסָא מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒
  rationale: 按自然汉语次序表达王号与人名。
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: 因为你倚靠……没有倚靠
  rationale: “倚靠”既保留שׁען本有的依凭意象，也清楚表达政治及信仰上的依赖；两处采用同一译词以保留原文重复。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 按希伯来文的古代地名直译为“亚兰”，不在正文中以较晚的名称“叙利亚”替换。
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: 雅威你的神
  rationale: 以“雅威”音译四字神名，并保留原文直接称呼“你的神”的契约性表达。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 用自然现代汉语明确标示前因后果。
- source_word: נִמְלַט
  choice: 逃脱了
  rationale: 该动词在军事语境中表示逃脱或脱离掌控；句末“了”表达已经造成的结果。
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: 亚兰王的军队
  rationale: חֵיל在此指军事力量，“军队”清楚而自然。
- source_word: מִיָּדֶךָ
  choice: 从你手中
  rationale: 保留原文“从手中”的意象；现代汉语也能自然表达脱离某人的控制。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也避免以称号替代专名。
- issue: 亚兰军队“逃脱”的因果陈述
  choice: 保留为“所以……逃脱了”
  alternative: 释义为“所以你失去了消灭亚兰军队的机会”
  rationale: 原文陈述军队从亚撒手中逃脱，并未进一步说明本可发生的具体军事结果，因此不扩展解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“先见”作为较专门的古代职分名称予以保留；其余句法尽量符合当代普通读者的阅读习惯。脚注标记置于“亚兰王”之后，使其准确对应地名译法。
