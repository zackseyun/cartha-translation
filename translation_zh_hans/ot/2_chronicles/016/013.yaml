  yaml_path: translation/ot/2_chronicles/016/013.yaml
  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: zh_hans
  text: 亚撒与列祖同睡；他在位第四十一年去世了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与列祖同睡”是希伯来语中表示死亡的惯用说法；在王室叙事中常与归葬祖先的观念相关。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 保留希伯来王室叙事中表示死亡的惯用表达，同时不与后面的“去世”合并，从而体现原文两个动词。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: “列祖”自然保留家族、先祖及王朝语感，并与“同睡”共同构成传统死亡用语。
- source_word: וַיָּמָת
  choice: 去世了
  rationale: 明确译出 מות，与前面的委婉语并列；“去世”庄重且符合现代汉语。
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: 第四十一年
  rationale: 按王朝纪年语境，将希伯来语基数形式自然译为汉语序数。
- source_word: לְמָלְכוֹ
  choice: 在位
  rationale: 在君王纪年公式中，“在位”比“作王”或“统治”更简洁自然，准确表示其执政年期。
- source_word: אָסָא
  choice: 亚撒
  rationale: 采用现代中文圣经传统中通行的人名音译。
