  yaml_path: translation/ot/2_chronicles/016/005.yaml
  text: And when Baasha heard it[a], he stopped building Ramah and ceased his work.
translation:
  language: zh_hans
  text: 巴沙听见这事，就停下修筑拉玛[a]，中止了他的工程。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“停下加固拉玛”；希伯来文指停止在拉玛进行修建或加固城防的活动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 听见这事，就
  rationale: 该结构引出时间从句，并推进叙事次序。中文用“听见这事，就”自然表达；“这事”依上文补出其所听见的内容。
- source_word: בַּעְשָׁא
  choice: 巴沙
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: 停下修筑
  rationale: חדל与介词מִן加不定式连用，表示停止某项活动；“停下修筑”符合现代汉语表达。
- source_word: אֶת הָרָמָה
  choice: 拉玛
  rationale: 此处是地名；在修筑语境中可包含建设或加固城防之意，但正文保留较宽泛的“修筑”。
- source_word: וַיַּשְׁבֵּת
  choice: 中止了
  rationale: 使役形在此表示使某项工作停下来；以“中止了”自然传达其结果，并与前句形成语义呼应。
- source_word: מְלַאכְתּוֹ
  choice: 他的工程
  rationale: מְלָאכָה可指工作、劳作；上下文明确涉及拉玛的修筑活动，因此“工程”比泛称“工作”更具体自然。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“修筑”保留原文בנה在城市语境中可兼指建造和加固的语义范围，并以脚注说明；两处停止性动词分别译为“停下”和“中止”，既体现原文用词变化，也避免中文重复生硬。
