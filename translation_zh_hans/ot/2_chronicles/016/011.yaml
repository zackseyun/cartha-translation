base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: zh_hans
  text: 看哪，亚撒自始至终的事迹[a]，看哪，这些事都记载在《犹大和以色列诸王记》中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事迹”也可较直译为“事情”；“自始至终”直译为“先前的和后来的”。这是希伯来史书总结君王生平时所用的表达。
    reason: 说明希伯来语王室史书套语的字面形式和惯用含义。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留结语开头引人注意的语气；וְ在此主要承接上下文，不必机械译作“现在”。
- source_word: דִּבְרֵי אָסָא
  choice: 亚撒的事迹
  rationale: דְּבָרִים在王室史书的总结套语中泛指君王的事务、作为和经历，并非只指他说过的话；“事迹”准确而自然。
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: 自始至终
  rationale: 这组对应词字面为“先前的和后来的”，在史书套语中涵盖整个时期；“自始至终”传达其惯用意义。
- source_word: הִנָּם כְּתוּבִים
  choice: 看哪，这些事都记载在
  rationale: 第二个指示词הִנָּם再次引人注意，并回指前述诸事；“记载”自然表达其已写入文献的含义。
- source_word: עַל סֵפֶר
  choice: 在……记中
  rationale: עַל字面可作“在……上”，但在文献引证套语中，现代汉语用“记载在……中”更自然；סֵפֶר在此指书面史料。
- source_word: הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל
  choice: 《犹大和以色列诸王记》
  rationale: 按原文透明地理解为与犹大和以色列诸王有关的书卷名称，不扩译为原文未明说的“年鉴”或“档案”。
