  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: zh_hans
  text: 因为耶和华的眼目遍察全地，为要坚固那些一心归向他的人[a]。你在这事上做得愚妄；从今以后，你必遭遇战争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为那些全心归向他的人显出大能。”
    reason: 希伯来语 לְהִתְחַזֵּק 可理解为“坚固、强力支持”，也可理解为“显出自己强大”；שָׁלֵם 强调完整、专一的忠诚。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名译法，明确保留专名功能。
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: 他的眼目遍察
  rationale: 保留“眼目”的拟人意象；“遍察”自然表达分词所描绘的四处巡行、鉴察。
- source_word: בְּכָל הָאָרֶץ
  choice: 全地
  rationale: 此处格言式陈述具有普遍范围；“全地”既忠实又符合庄重的现代中文表达。
- source_word: לְהִתְחַזֵּק עִם
  choice: 为要坚固……的人
  rationale: 把动词理解为施力支持、使人刚强，契合亚撒没有倚靠耶和华的上下文；反身含义“显出大能帮助”列入脚注。
- source_word: לְבָבָם שָׁלֵם אֵלָיו
  choice: 那些一心归向他的人
  rationale: “一心归向”表达 שָׁלֵם 所指向的完整、专一忠诚，避免被误解为毫无罪过的道德完美。
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: 你在这事上做得愚妄
  rationale: 以自然中文保留先知直接而严厉的责备，并让“这事”回指上下文中的行为。
- source_word: מֵעַתָּה יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: 从今以后，你必遭遇战争
  rationale: 将带时间标记的存在句按中文习惯译出将来结果；“遭遇战争”比字面“战争与你同在”更清楚。
theological_decisions:
- issue: שָׁלֵם 描写人心时的含义
  choice: 专一、全心归向耶和华
  alternative: 在他面前完全无可指摘
  rationale: 语境聚焦于对耶和华的忠诚和倚靠，而非宣称人达到无罪的完美；“一心归向”保留整全忠诚的重点。
- issue: לְהִתְחַזֵּק 的受益式或反身式含义
  choice: 坚固那些归向他的人
  alternative: 为那些归向他的人显出大能
  rationale: 希伯来语形式容许强调耶和华施力支持，也容许强调他显明自己的能力；正文采用在中文中与后接对象最顺畅的受益式译法，并以脚注保存另一可能。
- issue: הָאָרֶץ 的范围
  choice: 全地
  alternative: 全国／全境
  rationale: 这句话语气普遍，强调耶和华无处不在的鉴察，不宜限缩为犹大境内。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“眼目遍察全地”保留原文鲜明意象；“一心归向”传达专一忠诚而不暗示无罪完美。正文中的脚注标记与脚注项目相对应。
