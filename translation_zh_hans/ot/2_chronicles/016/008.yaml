  text: הֲ/לֹ֧א הַ/כּוּשִׁ֣ים וְ/הַ/לּוּבִ֗ים הָי֨וּ לְ/חַ֧יִל לָ/רֹ֛ב לְ/רֶ֥כֶב וּ/לְ/פָרָשִׁ֖ים לְ/הַרְבֵּ֣ה מְאֹ֑ד וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥ עַל יְהוָ֖ה נְתָנָ֥/ם בְּ/יָדֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: zh_hans
  text: 古实人[a]和路比人不是有一支人数众多的大军，战车和骑兵极多吗？但你倚靠雅威的时候，他就把他们交在你手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实人”和“路比人”也可分别译作“埃塞俄比亚人”和“利比亚人”；正文保留较贴近希伯来原文的族名。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 不是……吗？
  rationale: 引出预期肯定回答的反问，保留原文的修辞力量，也符合现代汉语表达。
- source_word: הַכּוּשִׁים
  choice: 古实人
  rationale: 按希伯来族名 כּוּשׁ 作传统而贴近原文的音译性名称，避免直接等同于后世的埃塞俄比亚。
- source_word: וְהַלּוּבִים
  choice: 和路比人
  rationale: 按希伯来族名 לוּבִים 音译，避免过度确定地套用后世国家名称“利比亚人”。
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: 有一支人数众多的大军
  rationale: חַיִל 在此指军事力量或军队；לָרֹב 表明数量庞大。译文用自然汉语明确军队规模。
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: 战车和骑兵极多
  rationale: 保留战车与骑马作战者的具体意象，并以“极多”表达 מְאֹד 的强烈程度。
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: 但你倚靠……的时候
  rationale: שׁען 的比喻义是倚赖、信靠；“但”显出先前强大敌军与因倚靠雅威而得胜之间的对照。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: נְתָנָם בְּיָדֶךָ
  choice: 他就把他们交在你手中
  rationale: 保留希伯来语“交在手中”的胜利惯用语；现代读者可自然理解为使敌人落入掌控。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名。采用较贴近 Yahweh 的汉语音译“雅威”，以专名而非头衔呈现；“耶和华”是传统汉译音式，但对希伯来语可能读音的反映较间接。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。反问句保留原文论证语气；“人数众多的大军，战车和骑兵极多”既呈现军势规模，也避免生硬照搬希伯来语介词结构。
