base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: zh_hans
  text: 亚撒从雅威的殿和王宫的库房中取出金银，送给住在大马士革的亚兰王[a]便哈达，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”传统上也译作“叙利亚”。
    reason: 提示传统地名译法，同时以原文专名“亚兰”为正文。
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: 取出
  rationale: 该词是יצא的使役形，在这里指把财物从储藏之处拿出来；“取出”自然、具体，也不额外解释亚撒的动机。
- source_word: כֶּסֶף וְזָהָב
  choice: 金银
  rationale: 希伯来文明确指银和金；现代汉语常按固定搭配说“金银”，完整保留两种贵金属。
- source_word: מֵאֹצְרוֹת
  choice: 从……宝库中
  rationale: 原文为复数，指储藏贵重财物之处；汉语“宝库”本身不强制标明单复数，并由“雅威殿和王宫”显示财物来自两处所属的库房。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בֵּית字面为“家、殿宇”，在此指圣殿；“雅威殿”既自然简洁，又保留神名יְהוָה。
- source_word: וּבֵית הַמֶּלֶךְ
  choice: 和王宫
  rationale: 字面是“王的家”，在此语境中即王宫；译作“王宫”是现代汉语最自然且准确的表达。
- source_word: וַיִּשְׁלַח
  choice: 送给
  rationale: 动词本义为“差遣、送出”；上下文隐含所送的是刚提到的金银，汉语用“送给”自然补明接受者关系。
- source_word: אֶל בֶּן הֲדַד
  choice: 给……便哈达
  rationale: 人名按音译作“便哈达”；介词אֶל在此标明送交的对象。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: אֲרָם是地名“亚兰”；采用原文地名，不直接以较后期的地缘名称“叙利亚”代替。
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: 住在大马士革的
  rationale: 分词短语描述便哈达当时的居住或驻留地点；“住在”清楚自然，并保留持续状态。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下节直接引语的常用叙事公式；汉语以“说：”自然衔接后文。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”按其通常学术重构发音音译，保留这是专名的性质，而不以称号代替。
- issue: אֲרָם的历史地名
  choice: 亚兰
  alternative: 叙利亚
  rationale: “亚兰”直接对应原文地名，也避免把古代亚兰与后世范围并不完全相同的“叙利亚”无条件等同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威殿”和“王宫”兼顾原文两处“家／殿宇”的平行关系与自然汉语；句末用冒号承接下一节的直接引语。
