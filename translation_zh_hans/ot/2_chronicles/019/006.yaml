  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: zh_hans
  text: 他对审判官说：“你们要留心自己所做的，因为你们不是为人施行审判，而是为雅威施行审判；他在审判的事上与你们同在。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: 审判官
  rationale: 该分词在这里用作名词，指受任办理司法事务的人；“审判官”比泛指性的“官员”更准确。
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: 你们要留心自己所做的
  rationale: 祈使词 רְאוּ 在此要求审判官认真省察其办案行为；“留心”自然地传达警醒、慎重之意，同时保留“所做的”这一原文表达。
- source_word: לְאָדָם
  choice: 为人
  rationale: אָדָם 是泛指人类的单数，与雅威形成修辞对照；“为人”既保留单数形式，也可在现代汉语中作泛指理解。
- source_word: תִּשְׁפְּטוּ
  choice: 你们施行审判
  rationale: שׁפט 在此指履行司法审判职责；“施行审判”保留正式的法律语域。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 ל 表明审判是代表雅威、向雅威负责而施行；采用“雅威”直接呈现四字神名。
- source_word: וְעִמָּכֶם
  choice: 他与你们同在
  rationale: 希伯来语省略系词，主语自然承接前句的雅威；补出“他”符合现代汉语表达。
- source_word: בִּדְבַר מִשְׁפָּט
  choice: 在审判的事上
  rationale: דבר 可指事情、事务或案件，מִשְׁפָּט 可指审判或公正；此译法保留司法语境及原短语的宽泛性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术拟音呈现这一专名，不以称号“主”替代。
- issue: אָדָם 的泛指单数
  choice: 人
  alternative: 世人／人类
  rationale: “人”保留原文单数形式及其与雅威之间的鲜明对照，同时在汉语中可以自然地泛指人类。
- issue: 雅威在审判中的同在
  choice: 在审判的事上，他与你们同在
  alternative: 他在你们作出判决时与你们同在
  rationale: 原文确言雅威与审判官同在，却没有进一步说明这种同在的具体方式；译文不把它扩展为认可每项判决或保证判决无误。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“审判官”“施行审判”维持司法语域；语序略作汉语化处理，但保留原文的命令、因果关系、人和雅威之间的对照，以及末句关于神同在的陈述。
