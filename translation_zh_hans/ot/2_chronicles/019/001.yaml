  yaml_path: translation/ot/2_chronicles/019/001.yaml
  text: And Jehoshaphat king of Judah returned in peace to his house in Jerusalem[a].
translation:
  language: zh_hans
  text: 犹大王约沙法平安地回到他在耶路撒冷的家中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“安全地回到他在耶路撒冷的家中。”原文“平安地”也可着重表示安然返回。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: 该动词在叙事中表示返回；结合目的地结构，译作“回到”自然准确。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 简洁保留原文中对约沙法王室身份的同位说明。
- source_word: אֶל בֵּיתוֹ
  choice: 他的宫中
  rationale: בַּיִת本义为房屋、住所；此处主体是君王，语境中指其王宫住所，中文译作“宫中”自然，同时不将其扩大为家族或王朝。
- source_word: בְּשָׁלוֹם
  choice: 平安地
  rationale: שָׁלוֹם兼含平安、安好与安全抵达之意；“平安地”保留这一语义宽度。
- source_word: לִירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 原文介词形式为“向／到”，但它在这里与“他的住所”连用，中文自然表达为“他在耶路撒冷的宫中”，说明住所所在之处。
