base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: zh_hans
  text: 在耶路撒冷，约沙法也从利未人、祭司和以色列各宗族的族长中委派了一些人，负责耶和华的审判[a]和争讼；他们回到了耶路撒冷。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“负责按耶和华的律法审判”，即办理受耶和华律法管辖的案件。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本作“他们回到了耶路撒冷”。这句话在上下文中稍显突兀，因此有人按不同方式理解，如“他们住在耶路撒冷”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 承接上文并增添一项举措；“也”简洁自然地保留了附加语气。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按其通常的地点含义直译。
- source_word: הֶעֱמִיד
  choice: 委派
  rationale: 该词的使役形式在行政和司法语境中表示使人担任某种职分；“委派”比“设立”更自然地体现职责的授予。
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: 从利未人、祭司和以色列各宗族的族长中……一些人
  rationale: “从……中”配合“一些人”表达介词 מִן／מֵ 的部分义；“各宗族的族长”以现代汉语表达以色列宗族结构，又不将其泛化为普通家庭。
- source_word: לְמִשְׁפַּט יְהוָה
  choice: 负责耶和华的审判
  rationale: 保留原文属格结构的开放性，既可能指依耶和华律法办理的审判，也可能指在耶和华权柄之下施行的审判。
- source_word: וְלָרִיב
  choice: 和争讼
  rationale: רִיב 在司法语境中指争议、诉讼或案件；“争讼”庄重而易懂，并保留法律语境。
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: 他们回到了耶路撒冷
  rationale: 按马所拉文本中 שוב 的通常含义翻译为“回来／返回”；虽然与句首地点短语衔接突兀，仍不在正文中擅自改读。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经读者最熟悉且庄重的专名形式；正文以专名呈现四字神名，而不以“主”替代。
- issue: לְמִשְׁפַּט יְהוָה 的范围和关系
  choice: 耶和华的审判
  alternative: 为耶和华施行审判／按耶和华的律法审判
  rationale: 原文可指属于耶和华、受其律法管辖或代表其权柄进行的审判；采用较宽的属格表达，避免把它限定为其中一种解释。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“委派”“争讼”保持司法语境；正文保留原文末句的突兀，并用脚注说明其他理解。所有脚注标记均置于相关正文之后。
