base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: zh_hans
  text: 约沙法住在耶路撒冷。他又出去，在百姓中间行走，从别是巴直到以法莲山区，使他们归向雅威[a]，他们祖先的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的译音；中文传统也常译作“耶和华”，或以“上主”代称。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住在
  rationale: ישׁב在此与地点短语“在耶路撒冷”连用，表示居住或驻留；“住在”自然、准确，不取字面的“坐”。
- source_word: וַיָּשָׁב וַיֵּצֵא
  choice: 又出去巡视
  rationale: 原文连续使用“返回/再”和“出去”，表明约沙法回到耶路撒冷后再次展开行动。“又”保留重复行动之意；结合后面的地域范围，“巡视”自然表达他行走在百姓中间，但不把行动限缩为单纯探访。
- source_word: וַיֵּצֵא בָעָם
  choice: 出去巡视百姓
  rationale: 介词ב在此表示进入百姓当中、遍行其间；译文以“巡视百姓”表达巡行各地、接触百姓的含义。
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: 从别是巴直到以法莲山区
  rationale: מִן…עַד表示从一端直到另一端；הַר אֶפְרַיִם指以法莲的山地地区，现代汉语用“山区”简洁自然。
- source_word: וַיְשִׁיבֵם
  choice: 使他们归向
  rationale: 这是שׁוב的使役形，意为使百姓返回；“使他们归向”保留使役意义及属灵、盟约性的方向，避免额外加入“悔改”或“归信”等解释。
- source_word: אֶל יְהוָה
  choice: 归向雅威
  rationale: 介词אֶל表示朝向；יהוה是上帝的专名，音译为“雅威”，使其与普通称号区分。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们祖先的上帝
  rationale: 直译为“他们列祖的上帝”。现代汉语以“祖先”自然涵盖复数先辈，同时保留祖传信仰与盟约关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。采用较贴近通行学术重构的“雅威”，并以脚注提示中文传统译名，不把专名改作称号。
- issue: וַיְשִׁיבֵם אֶל יְהוָה所描述行动的性质
  choice: 使他们归向雅威
  alternative: 使他们悔改／使他们归信
  rationale: 原文使用“返回”的使役形，只明确约沙法促使百姓回到雅威那里；译文不进一步界定这是悔改、归信、礼仪改革或政治归顺，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又”承接约沙法回到耶路撒冷后重新展开的巡行；“祖先”比“列祖”更符合现代普通读者用语。
