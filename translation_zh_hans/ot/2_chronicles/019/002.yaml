base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: zh_hans
  text: 哈拿尼的儿子、先见耶户出来迎接他[a]，对约沙法王说：“难道你应该帮助恶人，爱那些恨雅威的人吗？因此，有震怒从雅威面前临到你[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“出去到他面前”；这是表示“出去迎接他”的希伯来语说法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“雅威的震怒临到你。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: 出来迎接他
  rationale: “向着他的面出去”是希伯来语习语，在本处表示出去与对方相遇；译作“出来迎接他”自然清楚，又保留叙事动作。
- source_word: הַחֹזֶה
  choice: 先见
  rationale: חֹזֶה是特定的先知性称号；“先见”保留其与一般“先知”称谓之间的词汇区别。
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: 难道你应该帮助恶人
  rationale: 疑问词与不定式构成责问语气。“恶人”按带冠词的形容词作类别性表达，不将其明确缩窄为亚哈一人。
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: 爱那些恨雅威的人
  rationale: 保留שֹׂנְאֵי的分词性含义“那些恨……的人”，不改写为较概括的“仇敌”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: וּבָזֹאת
  choice: 因此
  rationale: 简洁表达该短语回指约沙法上述行为并引出后果的因果作用。
- source_word: עָלֶיךָ קֶּצֶף מִלִּפְנֵי יְהוָה
  choice: 雅威的震怒临到你
  rationale: 主文采用自然庄重的现代汉语表达；脚注说明原文“从雅威面前”这一来源兼临在的具体意象。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；音译“雅威”既保留专名性质，也避免以称号代替。
- issue: “恶人”及“恨雅威的人”的指涉范围
  choice: 保留类别性称呼，不在正文点名亚哈
  alternative: 帮助那个恶人（即亚哈）；爱雅威的仇敌
  rationale: 上下文虽指约沙法与亚哈结盟，原文却用较广的道德类别发出责问；译文不将其缩窄为解释性专名。
- issue: מִלִּפְנֵי יְהוָה的表达
  choice: 正文译作“雅威的震怒临到你”，脚注保留“从雅威面前”
  alternative: 有震怒从雅威面前临到你；有震怒从雅威那里临到你
  rationale: 既使正文符合现代汉语习惯，也不抹去原文关于震怒来自雅威面前／临在的意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“先见”保留古代职分名称；反问句保留先知责备的力度。所有脚注标记均放在其所说明的正文短语之后。
