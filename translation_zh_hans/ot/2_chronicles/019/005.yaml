  yaml_path: translation/ot/2_chronicles/019/005.yaml
  text: And he appointed judges in the land[a], in all the fortified cities of Judah, city by city.
translation:
  language: zh_hans
  text: 他在境内[a]，在犹大所有的坚固城中，一城一城地设立审判官。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“遍及全境”。
    reason: 原文介词短语可较直译为“在境内”，也可按语境理解为强调分布范围的“遍及全境”。
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: 设立
  rationale: 使役形在这里表示任命或设置人员担任职务；“设立”既符合行政语境，也保留了原词“使之就位”的意味。
- source_word: שֹׁפְטִים
  choice: 审判官
  rationale: 这里指负责司法事务的官员；“审判官”比现代语境中可能泛指比赛裁判的“裁判”更准确。
- source_word: בָּאָרֶץ
  choice: 在境内
  rationale: 该短语说明设立审判官的地域范围。“境内”自然指所治理的国土，同时不把后文明确表达的周遍范围提前过度译入。
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: 遍布犹大所有的坚固城
  rationale: 保留“犹大”“所有”“坚固城”三项信息，并以“遍布”自然表达介词与全称范围在汉语中的分布意义。
- source_word: לְעִיר וָעִיר
  choice: 一城一城地设立
  rationale: 希伯来语重复结构具有逐一分配的意味；汉语“一城一城地”保留其强调作用，补出“设立”则使句意完整自然。
theological_decisions: []
