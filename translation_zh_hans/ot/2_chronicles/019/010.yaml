  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: zh_hans
  text: 凡有争讼从住在各城的弟兄那里来到你们面前，无论是血与血之间[a]，还是律法、诫命、律例和典章之间，你们都要警戒他们，免得他们在雅威面前负罪，以致愤怒临到你们和你们的弟兄。你们要这样做，就不至于担罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“血与血之间”，可能指涉及流血、杀人或血债责任的不同案件。
    reason: 说明这一法律术语的具体所指不完全确定，同时保留正文的字面表达及其歧义。
lexical_decisions:
- source_word: רִיב
  choice: 争讼
  rationale: 该词在本节司法语境中指需要裁断的争议或案件；“争讼”既保留法律色彩，也不把它过度限定为正式诉讼。
- source_word: יָבֹוא עֲלֵיכֶם
  choice: 带到你们面前
  rationale: 按司法语境表达案件被提交给审判者处理，比机械译作“临到你们”更自然。
- source_word: מֵאֲחֵיכֶם הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: 住在各城的弟兄
  rationale: 保留“弟兄”这一盟约群体的亲属称谓；“各城”以自然中文表达他们所居住的诸城。
- source_word: בֵּין דָּם לְדָם
  choice: 血与血之间的案件
  rationale: 保留希伯来文简短而带技术性的“血与血之间”，并以“案件”说明其司法功能；可能所指另在脚注交代。
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: 律法与诫命、律例与典章之间的争议
  rationale: 分别保留四类法律训示用语，不把它们笼统合并为“法律”。
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: 你们都要警告他们
  rationale: זהר的使役形在这里表示警戒当事人，以防他们犯罪担责；“警告”与下文目的句衔接自然。
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: 他们得罪雅威
  rationale: אשׁם表示有罪或负罪责；“得罪雅威”自然表达对神负有罪责，同时避免生硬直译。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号代替。
- source_word: קֶצֶף
  choice: 烈怒
  rationale: 该词在此指神审判性的震怒；“烈怒”保留其强烈程度。
- source_word: כֹּה תַעֲשׂוּן וְלֹא תֶאְשָׁמוּ
  choice: 你们要这样做，就不至于担罪
  rationale: 以自然中文表达命令及其结果，并用“担罪”体现审判者若失职也会承担罪责。
theological_decisions:
- issue: 盟约群体称谓 אֲחֵיכֶם
  choice: 弟兄
  alternative: 同胞／以色列同胞
  rationale: 原文明确采用阳性复数的亲属称谓；保留“弟兄”可呈现经文的盟约亲属语言，而上下文已表明是群体成员。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用四字神名，故以“雅威”音译其专名性质，不用“主”这一称号替代。
- issue: 两处 אשׁם 的责任主体
  choice: 先译当事人“得罪”，后译审判者“担罪”
  alternative: 两处均译“有罪”
  rationale: 原文先警告当事人不要在雅威面前负罪，又说明审判者如此履职便不负罪；中文用词随句法角色调整，但保留双方都可能承担罪责的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“争讼”“典章”“担罪”保留司法与经文语域，但整体句法面向普通读者；正文保留“血与血之间”的原文张力，并用脚注解释其可能含义。
