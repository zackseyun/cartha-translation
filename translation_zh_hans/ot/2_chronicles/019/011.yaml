source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: zh_hans
  text: 看哪，祭司长[a]亚玛利雅要监督你们，负责耶和华的一切事务；以实玛利的儿子西巴第雅是犹大家的领袖，负责王的一切事务；利未人要在你们面前担任官员。你们要刚强行事！愿耶和华与善者[b]同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祭司长”直译为“为首的祭司”；也可译作“大祭司”。
    reason: lexical_alternative
  - marker: b
    text: “善者”也可译作“行善的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意下述安排的语篇功能；这种表达庄重而仍为现代读者所理解。
- source_word: כֹהֵן הָרֹאשׁ
  choice: 大祭司
  rationale: 字面为“为首的祭司”。在此指居首位并负责监督的大祭司；脚注保留较非技术性的“祭司长”这一可能译法。
- source_word: עֲלֵיכֶם
  choice: 要监督你们
  rationale: 表达司法行政安排中的上级监督权；汉语补出系词和功能性动词，使无动词句自然清楚。
- source_word: לְכֹל דְּבַר יְהוָה
  choice: 负责耶和华的一切事务
  rationale: דָּבָר在这里可指事务、事项或案件；“事务”保持范围宽泛，不把它限缩为诉讼案件。
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: 犹大家的领袖
  rationale: נָגִיד指领袖、统领或执政者；“领袖”适合本节的行政语境，并保留בֵית“家”。
- source_word: לְכֹל דְּבַר הַמֶּלֶךְ
  choice: 负责王的一切事务
  rationale: 与“耶和华的一切事务”形成平行，保存宗教司法事务与王室事务的区分。
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: 利未人要在你们面前担任官员
  rationale: שֹׁטְרִים是执行行政职责的官员；“在你们面前”保留其在场听命、辅助办事的空间和职能意象。
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: 你们要刚强行事
  rationale: 简洁保留命令语气；“行事”在语境中指切实履行所委派的职责。
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: 愿耶和华与善者同在
  rationale: וִיהִי按祈愿语气译为“愿……同在”；הַטּוֹב是名词化形容词，“善者”保留其概括性，脚注说明也可理解为“行善的人”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语读者熟悉的专名形式呈现四字神名，而不以“主”取代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代简体中文圣经语境中辨识度较高的专名“耶和华”，保留其作为专名而非称号的性质。
- issue: כֹהֵן הָרֹאשׁ是否采用技术性职衔
  choice: 大祭司
  alternative: 祭司长
  rationale: 该词组字面为“为首的祭司”，可指首席祭司，也可对应“大祭司”。正文采用读者熟悉的“大祭司”，脚注保留较少技术色彩的译法，避免掩盖词义范围。
- issue: הַטּוֹב所指是抽象的善还是良善之人
  choice: 善者
  alternative: 行善的人
  rationale: 原文以带定冠词的形容词作名词使用，可概括指良善者，亦可在语境中理解为行善的人；正文采用简洁而不具体化行为内容的“善者”，并在脚注列出另一理解。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”“刚强行事”保留原文劝告与宣告的力度；其余句法适度汉语化，同时维持两类事务之间的平行结构及利未官员“在你们面前”的原文意象。
