source:
  edition: WLC
  text: וַ/יְצַ֥ו עֲלֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּ֤ה תַעֲשׂוּ/ן֙ בְּ/יִרְאַ֣ת יְהוָ֔ה בֶּ/אֱמוּנָ֖ה וּ/בְ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: zh_hans
  text: 他吩咐他们说：“你们要这样行[a]：敬畏雅威[b]，忠信无欺[c]，并且一心一意[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要这样做。”
    reason: lexical_alternative
  - marker: b
    text: “敬畏雅威”也可表达为“尊崇雅威”。这里的“敬畏”兼有畏惧和尊崇之意。
    reason: lexical_alternative
  - marker: c
    text: 或译：“忠诚地”“凭忠信”或“诚实无欺”。
    reason: lexical_alternative
  - marker: d
    text: 直译：“怀着完整的心”；也可译：“全心”或“专心一意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם לֵאמֹר
  choice: 他吩咐他们说
  rationale: צוה表示下达命令或嘱咐；与על连用时，现代汉语自然译为“吩咐他们”。לֵאמֹר是引出直接引语的惯用结构，译作“说”。
- source_word: כֹּה תַעֲשׂוּן
  choice: 你们要这样行
  rationale: כֹּה意为“这样”，עשה语义宽泛，可指“做、行事”；司法训令的语境中，“行”既自然又保留其行为伦理色彩。“要”表达该句的命令语气。
- source_word: בְּיִרְאַת יְהוָה
  choice: 敬畏雅威
  rationale: יִרְאָה在此兼有畏惧与尊崇之意；“敬畏”保留这一成熟而有分量的圣经表达。יְהוָה按其专名音译为“雅威”。
- source_word: בֶּאֱמוּנָה
  choice: 忠信无欺
  rationale: אֱמוּנָה在审判与履职语境中主要指可靠、忠诚、诚实可信的行事态度，而不是抽象的内在信念。“忠信无欺”使现代读者清楚看见其伦理和司法含义。
- source_word: וּבְלֵבָב שָׁלֵם
  choice: 并且一心一意
  rationale: לֵבָב שָׁלֵם字面为“完整的心”，在此表达内心纯全、不分裂、专一投入。“一心一意”自然地传达这种完整与专一，同时不把它缩减为仅仅“无罪”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，而不以称号替代。
- issue: 司法训令中אֱמוּנָה的含义
  choice: 忠信无欺
  alternative: 凭信心；忠诚；诚实
  rationale: 上下文是约沙法吩咐审判官如何履职，因此该词重在忠实、可靠和公正无欺的行为，而非专指宗教意义上的“信心”。
- issue: לֵבָב שָׁלֵם所表达的内心状态
  choice: 一心一意
  alternative: 全心；心地纯全；存完全的心
  rationale: 该词组同时包含完整、专一和真诚的意味。“一心一意”保存其不分心、不二意的重点，但脚注保留较贴近原文意象的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“忠信无欺”贴合审判官履职的语境；“一心一意”自然表达希伯来语“完整的心”所含的专一与纯全，同时以脚注保留原文意象和其他可能译法。
