base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: zh_hans
  text: 不过，你身上有美善之处，因为你从这地清除了亚舍拉祭祀物[a]，并且立定心意寻求上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“亚舍拉”（复数），指与女神亚舍拉崇拜有关的祭祀物；其具体形制不能完全确定。
    reason: cultural_note
  - marker: b
    text: “立定心意”也可译作“预备自己的心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: 不过
  rationale: 承接上一节的责备，表达让步性的转折；现代自然，同时保留庄重语气。
- source_word: דְּבָרִים טוֹבִים
  choice: 美善之处
  rationale: 原文含义宽泛，不仅限于具体善行；此译法保留对品格与行为的综合肯定。
- source_word: נִמְצְאוּ עִמָּךְ
  choice: 你身上仍有
  rationale: 将希伯来语被动式按现代汉语习惯表达，传达在约沙法身上发现可称许之处的评价意味；“仍”体现上下文中的让步关系。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出上述肯定的根据。
- source_word: בִעַרְתָּ
  choice: 清除了
  rationale: 该动词可指焚除或彻底除去；“清除”表达坚决移除，却不武断限定具体方式。
- source_word: הָאֲשֵׁרוֹת
  choice: 亚舍拉柱
  rationale: 指与亚舍拉崇拜有关的祭祀物；采用读者较易理解的名称，并以脚注说明原文形式及所指。
- source_word: מִן הָאָרֶץ
  choice: 从这地
  rationale: 直接表达从该领土范围内除去；“这地”在上下文中自然指犹大境内。
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: 并且立定心意
  rationale: 原文直译为“预备／坚定你的心”；“立定心意”自然表达内在的定向和决意，同时在脚注保留较贴字面的译法。
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: 寻求上帝
  rationale: 《历代志》中这一表达通常涵盖归向、专心追求并求问上帝，不宜缩窄为单纯询问信息。
theological_decisions:
- issue: הָאֲשֵׁרוֹת 所指祭祀物的译法
  choice: 亚舍拉柱
  alternative: 亚舍拉祭物／亚舍拉像
  rationale: 主文既保留专名“亚舍拉”，也让普通读者看出这是有形的异教祭祀物；脚注避免把其确切形制说得过死。
- issue: לִדְרֹשׁ הָאֱלֹהִים 的范围
  choice: 寻求上帝
  alternative: 求问上帝
  rationale: “寻求”保留《历代志》中对上帝的敬虔归向与持续追求这一较宽含义，同时不排除求问之意。
- issue: וַהֲכִינוֹתָ לְבָבְךָ 的意志与预备含义
  choice: 立定心意
  alternative: 预备自己的心
  rationale: 主文采用自然的现代汉语表达内在决意，脚注保留原文“预备／坚定”的词义张力，不将其化约为纯粹情感或行为。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“不过”保留责备之后的让步转折；“美善之处”避免把原文宽泛的称许局限为若干善行。所有脚注标记均置于所解释的词语之后。
