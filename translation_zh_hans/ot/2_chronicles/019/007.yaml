  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: zh_hans
  text: 现在，你们当敬畏雅威；要谨慎行事，因为我们的神雅威绝无不公，不偏待人[a]，也不收受贿赂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“抬起脸面”，是指看人的情面而偏袒。
    reason: 说明希伯来语习语的字面意象及其在本节中的含义。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既承接上文，也引出眼前的劝诫；现代汉语用“现在”简洁自然。
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: 愿你们心存对雅威的敬畏
  rationale: 用“愿”体现祈使式的劝勉语气；“心存……敬畏”自然表达对神既畏惧又尊崇的态度，同时避免把“临到你们”误解为单纯的恐怖袭击。
- source_word: שִׁמְרוּ וַעֲשׂוּ
  choice: 你们要谨慎行事
  rationale: 两个命令连用，要求审慎留意并付诸行动；合译为“谨慎行事”符合审判官履职的语境。
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: 因为雅威我们的神绝无
  rationale: “绝无”清楚表达在雅威的品格与作为中不存在下列恶事；保留“雅威我们的神”的原文关系。
- source_word: עַוְלָה
  choice: 不公
  rationale: 本节处于司法语境，“不公”准确涵盖枉法和不正义，也适合现代汉语。
- source_word: מַשֹּׂא פָנִים
  choice: 偏待人
  rationale: 该习语指因人的身份、地位等而有所偏袒；“偏待人”简明、自然，并以脚注保留原文意象。
- source_word: מִקַּח שֹׁחַד
  choice: 收受贿赂
  rationale: 准确表达接受贿赂的行为，也是现代汉语司法语境中的常用说法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通常学术拟音译出其专名，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，不用称号替换，也不引入特定宗派解释。
- issue: פַחַד יְהוָה 所表达的态度
  choice: 对雅威的敬畏
  alternative: 雅威所带来的恐惧
  rationale: 司法劝诫的上下文指向人在神面前谨慎、尊崇且有所畏惧的态度；译作“敬畏”保留其严肃性，同时不把它缩减为纯粹惊恐。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前句以“愿”保留希伯来语祈使式的劝勉色彩；后句用司法语境中常见的“不公”“偏待人”“收受贿赂”。脚注标记紧跟其实际说明的词语“偏待人”，避免放在与注释内容无关的位置。
