  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְחִזְקִיָּ֖הוּ וַ/חֲסָדָ֑י/ו הִנָּ֣/ם כְּתוּבִ֗ים בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: zh_hans
  text: 希西家其余的事迹和他忠诚的作为，看哪[a]，都记在亚摩斯的儿子、先知以赛亚的异象中，载于《犹大和以色列诸王记》。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠诚的作为”也可译作“忠信的作为”或“守约忠信的行为”。这里的希伯来词可含忠诚、信实、慈爱或恩惠等意义；在此处是指希西家的作为。
    reason: 说明חֶסֶד的词义范围及其在描述人之行为时可能具有的忠诚／盟约色彩，而不将某一神学意义强加于正文。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְחִזְקִיָּהוּ
  choice: 希西家其余的事
  rationale: 王室史料的总结语中，דִּבְרֵי泛指君王的事迹或事务，并非仅指言语；译作“其余的事”自然且准确。
- source_word: וַחֲסָדָיו
  choice: 他忠信的作为
  rationale: חֶסֶד在此指希西家表现忠诚、信实的具体行为。“忠信的作为”保留其关系性和伦理色彩，同时不把盟约含义绝对化。
- source_word: הִנָּם
  choice: 看哪，都
  rationale: 该指示词强调下文所述记录的存在；“看哪”保留原文醒目的修辞作用，“都”与复数指代及中文句法相合。
- source_word: כְּתוּבִים
  choice: 记
  rationale: 该被动分词意为“写下、记载”；在史料引用公式中译作“记”简洁自然。
- source_word: בַּחֲזוֹן
  choice: 在……异象中
  rationale: חָזוֹן的基本义是“异象”，虽可转指先知性文献，正文仍保留其直接词义。
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: 亚摩斯的儿子以赛亚先知
  rationale: 保留人物的父系身份和先知职分，并采用现代中文圣经人物的通行译名。
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: 收录在《犹大和以色列诸王记》里
  rationale: עַל在此书目公式中表明前述先知文献与王室史书的归属或关联。“收录在……里”以自然中文表达这种关系，同时避免生硬地译作“在……之上”。
theological_decisions:
- issue: חֶסֶד用于描述希西家的行为时所含的忠诚或盟约意味
  choice: 忠信的作为
  alternative: 守约施慈爱的行为；忠诚的行为；善行
  rationale: 原词可涵盖忠诚、信实和慈爱，并可能带有盟约关系色彩。此处主语是人间君王，“忠信的作为”既保留正面的关系性与道德含义，也不强行断定其为技术性的盟约术语。
- issue: “以赛亚的异象”与《诸王记》的文献关系
  choice: 异象……收录在《犹大和以色列诸王记》里
  alternative: 异象……记在《犹大和以色列诸王记》里；异象，载于《犹大和以色列诸王记》
  rationale: 原文介词עַל在这里的准确文献关系略有弹性。正文采用顺畅但不过度具体的“收录在”，不把两者武断地认定为完全相同的作品。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“看哪”有意保留原文的提示和强调作用，虽略带典雅色彩。书名使用书名号，以清楚标示所引史料。
