base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/003.yaml
  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: zh_hans
  text: 他和自己的官长、勇士商议，要堵住城外的泉水[a]；他们就帮助他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他和自己的官长、勇士商议如何堵住城外的泉水。”
    reason: 原文不定式既可理解为商议的目的，也可理解为商议的内容；两种译法在意义上非常接近。
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: 商议
  rationale: 该词为 יעץ 的尼法勒式，在此表示与他人共同商议、征求意见。“商议”简洁自然，也保留了共同谋划的含义。
- source_word: שָׂרָיו
  choice: 自己的官长
  rationale: שַׂר 可指首领、官员或将领。此处兼有行政和军事语境，“官长”较宽泛，也不误导为王室成员。使用“自己的”明确其所属关系，并避免“他的官长、他的勇士”连续出现时的拗口。
- source_word: גִבֹּרָיו
  choice: 勇士
  rationale: גִּבּוֹר 常指英勇有力之人或战士。“勇士”保留军事色彩，且符合现代中文圣经叙事的庄重语体。
- source_word: לִסְתּוֹם
  choice: 要堵住
  rationale: 不定式可表示商议的内容或目的。“要堵住”在中文中自然承接“商议”，并准确表达封堵水源的实际行动。
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: 泉水
  rationale: 该结构直译为“泉源的水”；现代中文用“泉水”即可清楚、自然地表达，不必机械重复“水”。
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: 城外的
  rationale: 关系从句说明泉水位于城的外面。压缩为定语“城外的”符合现代汉语表达，同时完整保留地点信息。
- source_word: וַיַּעְזְרֻהוּ
  choice: 他们就帮助他
  rationale: עזר 加第三人称阳性单数后缀，直接表示“他们帮助他”；复数主语回指前述官长和勇士。“就”自然承接商议后的响应，但不额外说明具体如何协助。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“官长”兼顾行政与军事身份，“勇士”保留原文称谓的军事色彩。分号体现商议与众人响应之间的紧密推进。
