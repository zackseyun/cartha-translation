  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: zh_hans
  text: 他们出言攻击[a]耶路撒冷的上帝，就像攻击地上各族的神——人手所造之物——一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出言攻击”按上下文译出敌意；希伯来语较直译为“向……说话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֶל
  choice: 出言攻击
  rationale: דבר本义为“说话”，介词אֶל通常表示“向、对”；但本节上下文是亚述使者的亵渎和敌对言论，因此合译为“出言攻击”，既保留言语行为，也自然表达其敌意。
- source_word: אֱלֹהֵי יְרוּשָׁלָם
  choice: 耶路撒冷的上帝
  rationale: אֱלֹהֵי虽在形式上与复数相同，但此处指以色列的独一上帝，在语义上是单数。
- source_word: כְּעַל
  choice: 就像攻击……一样
  rationale: 该组合把他们谈论耶路撒冷上帝的方式，与谈论列国诸神的方式作比较；结合语境，以“攻击”表达敌对色彩。
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: 地上各族的神
  rationale: 此处אֱלֹהֵי为复数，指地上各民族所敬奉的诸神；“各族”简洁而自然地传达עַמֵּי的复数含义。
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: 人手所造之物
  rationale: 直译并保留原文对偶像属人为制品的强调；הָאָדָם在此泛指人类，并非特指男性。
theological_decisions:
- issue: 言论是“向着”还是“攻击”耶路撒冷的上帝
  choice: 出言攻击
  alternative: 向耶路撒冷的上帝说话
  rationale: 介词אֶל本身通常是“向、对”，但前后文明确描述嘲弄和亵渎。正文采用符合汉语习惯的敌对表达，同时用脚注保留原文介词的字面可能。
- issue: אֱלֹהֵי יְרוּשָׁלָם应理解为单数还是复数
  choice: 耶路撒冷的上帝
  alternative: 耶路撒冷的诸神
  rationale: 上下文把以色列的上帝与地上各族的人造神明相对照，因此这里是语义单数。
- issue: “人手所造之物”与哪一成分同位
  choice: 用破折号将其作为“地上各族的神”的同位说明
  alternative: 将其理解为他们也把耶路撒冷的上帝直接称作人手所造之物
  rationale: 希伯来语中该短语紧接“地上各族的神”，最自然地说明这些神是人造之物；全句比较仍表明说话者错误地把耶路撒冷的上帝与它们等同看待。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“出言攻击”明确呈现上下文中的敌意；破折号清楚标示“人手所造之物”是对列国诸神的同位说明，同时保留全句将耶路撒冷的上帝与这些神相提并论的讽刺张力。
