  to: 希西家因自己心里的高傲而谦卑自己；他和耶路撒冷的居民都如此。因此，雅威的忿怒在希西家的日子没有临到他们。
  rationale: 修订以“谦卑自己”准确表达原文动词在此的反身/中间语态意味，并将居民的参与简洁地表达为“都如此”。将“烈怒”调整为庄重且常用的“忿怒”。脚注改写为自然中文，并继续保留 בְּ 在“因/为”之间的解释余地。
