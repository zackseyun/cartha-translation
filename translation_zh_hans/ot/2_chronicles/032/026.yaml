base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: zh_hans
  text: 希西家因自己心里的高傲而谦卑自己；他和耶路撒冷的居民都如此。因此，雅威的忿怒在希西家的日子没有临到他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: 就谦卑下来
  rationale: 此处尼法勒形式在上下文中具有反身或中间语态意味，表达希西家主动降卑自己；现代汉语用“谦卑下来”自然清楚，并与悔改语境相合。
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: 因心里高傲
  rationale: גֹבַהּ 本义为“高、高度”，与“心”连用时指内在的高傲。介词 בְּ 在此最自然地理解为原因，但仍以脚注保留“为自己的心高气傲而”的关联性译法。
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלָם
  choice: 他和耶路撒冷的居民都这样做
  rationale: 原文以强调性代词明确把希西家和耶路撒冷居民一并列入谦卑者。汉语补出“都这样做”，可清楚承接前面的谓语，避免误读。
- source_word: קֶצֶף יְהוָה
  choice: 雅威的烈怒
  rationale: קֶצֶף 在审判语境中表示强烈的忿怒；“烈怒”保留其力度。יהוה 按本项目所给神学决定音译为“雅威”，保留盟约之名。
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: 没有临到他们
  rationale: בוא על 是灾祸或审判“临到”某人的常见表达；此译既贴近原文，又符合现代汉语习惯。
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: 在希西家的日子
  rationale: 保留原文时间表达，不擅自限定为其在位期间或整个寿命，维持原有范围上的开放性。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；依项目提供的决定采用“雅威”，而不以称号替代，保留其作为神盟约之名的性质。
- issue: 烈怒未在希西家时期临到的含义
  choice: 仅陈述审判在希西家的日子没有临到
  alternative: 理解为烈怒被永久消除
  rationale: 原文的时间限定只说明审判当时未临到，并未明说威胁被永久撤销；译文保留这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“谦卑下来”“临到他们”保留经文语体但不显陈旧；分成两句并补出“都这样做”，使复合主语与结果关系在汉语中清楚。
