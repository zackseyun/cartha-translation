  text: מִ֠י בְּֽ/כָל אֱלֹהֵ֞י הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔/י אֲשֶׁ֣ר יָכ֔וֹל לְ/הַצִּ֥יל אֶת עַמּ֖/וֹ מִ/יָּדִ֑/י כִּ֤י יוּכַל֙ אֱלֹ֣הֵי/כֶ֔ם לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: zh_hans
  text: 在我祖先使之归于毁灭的这些列国的一切神明中，有哪一个能从我手中救出自己的百姓呢？[a]你们的神又怎能从我手中救出你们呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使之归于毁灭”也可译作“交付毁灭”。希伯来语动词指把某人或某物划归毁灭，不只是一般地毁坏。
    reason: 说明 חרם 的特殊词义，并以现代汉语清楚表达其“交付／划归毁灭”的语义。
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: 在……这些列国的一切神明中，有哪一个
  rationale: מִי 引出带有嘲讽意味的反问；בְּכָל 在此表示从整体中选取，译作“在……中”自然准确。“神明”在此指各国所敬奉的神，不添加“所谓”或“偶像”等解释性措辞。
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: 我祖先使之归于毁灭
  rationale: חרם 的使役式不只表示一般的击败或毁坏，还含有将对象划定、交付于毁灭的语义。“使之归于毁灭”保留这一较强且带技术色彩的含义，同时避免生硬术语。אֲבוֹתַי 在王室言辞中指先王或前代，译作“我祖先”比现代汉语中的“我父辈”更贴合此处。
- source_word: יָכוֹל לְהַצִּיל אֶת עַמּוֹ
  choice: 能……救出自己的百姓
  rationale: יָכוֹל 表示能力；נצל 的使役式在军事权势语境中表示从控制或危险中救出。“自己的百姓”保留单数指称，即逐一设想每一个神与其百姓的关系。
- source_word: מִיָּדִי
  choice: 从我手中
  rationale: 直译并保留希伯来语以“手”喻权势和控制的表达；该说法在现代汉语中同样清楚自然。
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: 你们的神又怎能
  rationale: כִּי 在此承接前一反问并推出说话者自负的结论；“又怎能”自然传达未完成式所带的质疑和不信，而不将其误作单纯将来时。
- source_word: לְהַצִּיל אֶתְכֶם
  choice: 救出你们
  rationale: 与前半节的同一动词保持一致，也明确表达从敌王权势下获救。
theological_decisions:
- issue: חרם 在亚述王嘲讽话语中的译法
  choice: 使之归于毁灭
  alternative: 毁灭；置于禁毁之下
  rationale: 原词含有将对象划归毁灭的意味，强于普通的“毁灭”；正文采用可理解而又保留其特殊语义的表达，脚注说明较传统的替代译法，但不额外引入后来的神学体系。
- issue: 对列国之神的称呼
  choice: 神明
  alternative: 所谓的神；偶像
  rationale: 说话者直接使用 אֱלֹהִים 类词称呼各国的神。译文不加“所谓的”，也不以“偶像”代换，以免加入原文没有的评判。
- issue: אֱלֹהֵיכֶם 的数与指称
  choice: 你们的神
  alternative: 你们的诸神
  rationale: 上下文是西拿基立向犹大人挑战，且谓语 יוּכַל 为单数；故按单数指称翻译，同时不进一步用特定神名替代原文的一般称呼。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个连续反问保留原文的夸口和嘲讽语气；以“又怎能”自然连接其推论。正文保留“从我手中”的权势隐喻，并避免用“所谓的神”或“偶像”进行编辑性解释。
