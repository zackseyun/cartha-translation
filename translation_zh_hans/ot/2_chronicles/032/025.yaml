base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: zh_hans
  text: 但希西家没有照着自己所蒙的恩惠作出相称的回报[a]，因为他心里骄傲；因此，烈怒临到他，也临到犹大和耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有照着所得的善待作出回应。”原文泛指对所蒙的好处作出相称的回报。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: 照着自己所蒙的恩惠
  rationale: גְּמוּל在此可指所受的善待、恩惠或所得的好处；结合上文医治与拯救的语境，译为“所蒙的恩惠”自然庄重，同时保留介词כ所表达的相称关系。
- source_word: הֵשִׁיב
  choice: 作出相称的回报
  rationale: 使役形态的שׁוב本义涉及“归还、还以”，与גמול连用时指对所受之善作适当回应。“作出……回报”比单译“感谢”更宽，不把希西家的过失局限于言语感恩。
- source_word: גָבַהּ לִבּוֹ
  choice: 他心里骄傲
  rationale: 原文直译为“他的心高举”，是表示高傲的惯用语。“心里骄傲”符合现代汉语，也保留了内在道德状态的焦点。
- source_word: קֶצֶף
  choice: 烈怒
  rationale: 该词表示强烈的忿怒，常用于审判语境。“烈怒”保留其严肃与强度，又不在正文中补出原文未明说的施怒者。
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: 烈怒临到他
  rationale: 原文是存在或结果性结构；“临到”自然表达审判发生并落在人身上，不额外指定施怒主体。
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: 犹大和耶路撒冷
  rationale: 采用现代中文圣经语境中通行的地名音译。
theological_decisions:
- issue: 希西家对所蒙恩惠的亏欠具体为何
  choice: 译为没有作出与所蒙恩惠相称的回报，不限定为某一种行为。
  alternative: 译为没有献上感谢，或没有以相称的感恩回应。
  rationale: 希伯来语的表达较宽泛，指未按所受的善作出合宜回报；若专译为“感谢”，会把原文没有限定的道德回应缩窄为言语或礼仪行为。
- issue: 烈怒的来源
  choice: 保留隐含主体，只说“烈怒临到”。
  alternative: 明确译为“耶和华的烈怒”或“上帝的烈怒”。
  rationale: 上下文自然使人理解这是神的烈怒，但本节该分句并未明说耶和华或上帝；保留隐含主体更贴近原文，并保存其措辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“所蒙的恩惠”符合经文语域；“作出相称的回报”避免将含义缩窄成单纯口头感谢。正文中的脚注标记与脚注完全对应。
