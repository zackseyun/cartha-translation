  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: zh_hans
  text: 这样，雅威救了希西家和耶路撒冷的居民，使他们脱离亚述王西拿基立的手，也脱离其他各方的手[a]；他又在各方面引导他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“也脱离一切的手”；希伯来文没有说明“一切”具体指什么，可能是其他敌人或敌对势力。
    reason: lexical_alternative
  - marker: b
    text: 或译“他在四围带领他们”；也有人把这句话理解为“他使他们四境安宁”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: 救了
  rationale: ישׁע在这里表示搭救、解救。“救了”自然简洁，也保留上帝施行拯救的神学分量，而不把含义限缩为军事胜利。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接译出四字神名，而不用“主”这一称号代替；“雅威”是现代汉语中对YHWH的常见音译。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 准确表达分词结构“住在耶路撒冷的人”，行文庄重而自然。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留希伯来文“从某人的手中”的权势意象；在汉语中以“脱离……的手”仍可理解为摆脱其控制或威胁。
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: 亚述王西拿基立
  rationale: 采用通行中文专名，并按自然汉语语序表达其王号。
- source_word: וּמִיַּד כֹּל
  choice: 也脱离其他一切势力的手
  rationale: כֹּל的受词在希伯来文中省略。正文以“其他一切势力”表达语境所暗示的其余敌对者，同时用脚注保留原文的省略和歧义。
- source_word: וַיְנַהֲלֵם
  choice: 他……引导他们
  rationale: נהל的直接词义是带领、引导；选“引导”避免把原文直接解释成“使他们安居”或“赐他们平安”。
- source_word: מִסָּבִיב
  choice: 在四围
  rationale: 表达环绕四面的范围，保留原文与“引导”搭配时略有开放性的含义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。正文采用音译“雅威”，保存这是以色列上帝专名这一点，而不以称号取代。
- issue: וַיְנַהֲלֵם מִסָּבִיב的含义
  choice: 他在四围引导他们
  alternative: 他带领他们周游各处；他使他们四境安宁
  rationale: 正文优先保留נהל“引导、带领”的词汇意义及מִסָּבִיב“四围”的表达，不将该短语隐含的保护或安宁直接写入正文；脚注交代另一种理解。
- issue: וּמִיַּד כֹּל中省略的受词
  choice: 其他一切势力
  alternative: 一切；所有人；所有敌人
  rationale: 上下文指西拿基立以外的敌对权势，但原文没有明说名词。正文作最低限度补足，并以脚注标明直译，以免把推断当作明说。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“脱离……的手”有意保留原文意象；“在四围引导他们”略带希伯来式张力，以免把可能表示带领、看顾或四境安宁的含义过早固定为单一解释。
