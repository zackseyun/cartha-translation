  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: zh_hans
  text: 除掉他的丘坛和祭坛的，不正是希西家本人吗？他对犹大和耶路撒冷说：“你们要在一座祭坛前敬拜，并在上面焚香。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬拜”直译为“俯伏”。“焚香”所译动词也可泛指使供物化为烟气上升。
    reason: 保留 תשתחוו 的动作性含义，并说明 תקטרו 在祭祀语境中的较宽词义范围，而不在正文限定未明说的焚烧对象。
lexical_decisions:
- source_word: הֲלֹא
  choice: 不正是……吗
  rationale: 引出预期听者赞同的反问，也自然契合过去发生的事件。
- source_word: הוּא יְחִזְקִיָּהוּ
  choice: 希西家本人
  rationale: 用“本人”保留代词与专名并列所表达的强调。
- source_word: הֵסִיר
  choice: 除掉
  rationale: 准确表达使之离开、废除这些敬拜场所的含义，且符合现代汉语。
- source_word: בָּמֹתָיו
  choice: 他的那些丘坛
  rationale: “丘坛”是 בָּמוֹת 在旧约祭祀语境中的简明对应；“他的”保留希伯来语后缀及亚述发言者的论辩视角，“那些”使汉语领属结构更自然。
- source_word: מִזְבְּחֹתָיו
  choice: 祭坛
  rationale: 与前面的“他的那些”共同统摄并列成分；既避免生硬重复，又不抹去原文领属关系。
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: 他还对犹大和耶路撒冷说
  rationale: 将希伯来语常规引语式 לֵאמֹר 自然融入汉语冒号结构，避免赘余的“说……说”。
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: 在一座祭坛前
  rationale: 保留 לִפְנֵי 的空间意象及 אֶחָד 对单一祭坛的强调。
- source_word: תִּשְׁתַּחֲווּ
  choice: 敬拜
  rationale: 该动词本含俯伏动作，在祭坛语境中指以俯伏表达敬拜；中文“敬拜”自然明确，脚注补出“俯伏”的形式对应。
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: 并在上面焚烧祭物，使烟上升
  rationale: קטר 的使役式可指使祭物化烟上升，不必限定为香；此译保留原文祭祀用语的语义宽度。
theological_decisions:
- issue: “丘坛”和“祭坛”所带领属后缀的发言者视角
  choice: 译作“他的那些丘坛和祭坛”
  alternative: 那些丘坛和祭坛
  rationale: 原文明确带第三人称阳性单数后缀。保留“他的”呈现亚述发言者把这些场所说成属于犹大之神的论辩措辞，并不等于叙述者认可这一判断。
- issue: 敬拜集中于一座祭坛
  choice: 直译为“在一座祭坛前”，不在正文解释希西家的改革
  alternative: 只可在圣殿的祭坛前敬拜
  rationale: 本节记录敌方的指控，而非叙述者对改革的神学说明；不增添“圣殿”等解释，可保存原文的历史与神学张力。
- issue: קטר 所指祭祀行为
  choice: 正文采用较宽的“焚烧祭物，使烟上升”
  alternative: 焚香
  rationale: 该词可用于焚香，也可泛指使祭物化烟上升。上下文没有明说对象，故不应在正文中无依据地缩窄为香。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。反问句保留亚述发言者的讥讽语气；引语以自然汉语表达，避免机械复制希伯来语的重复引语公式。
