    rationale: 原文仅有叙事连接词“并且/于是”，并不明确表达“又、还”的附加意味；删去可避免增义。
  - severity: medium
    issue: “焚烧祭物，使烟上升”在正文中明示“祭物”
    rationale: תקטרו未在本句明说所焚之物。此动词可指焚香，也可泛指使供物化烟上升；将“祭物”放入正文会把未明说的宾语具体化。
  - severity: low
    issue: 引语结束标点混用
    rationale: “[a]’””混合英文单、双引号，不符合简体中文正文排版，且脚注锚点位置不清晰。
