  to: 除掉他的丘坛和祭坛的，不正是希西家本人吗？他对犹大和耶路撒冷说：“你们要在一座祭坛前敬拜，并在上面焚香。”[a]
  rationale: 删除无原文根据的“还”，将正文的解释性“焚烧祭物，使烟上升”改为上下文中自然的“焚香”，并以脚注保留该动词可指其他烟祭行为的可能性。同步统一中文引号和脚注锚点格式。
