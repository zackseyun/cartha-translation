  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: zh_hans
  text: 许多人把供物带到耶路撒冷[a]，献给耶和华；又把珍贵的礼物送给犹大王希西家[b]。此后，希西家在列国眼中备受尊崇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在耶路撒冷献供物给耶和华。”这里的希伯来语介词既可表示目的地，也可按此语境理解为地点。
    reason: lexical_alternative
  - marker: b
    text: “珍贵的礼物”也可译作“上好的礼物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: 许多人
  rationale: 该形容词在此作名词使用，明确指人数众多的人；汉语补出“人”自然清楚。
- source_word: מְבִיאִים
  choice: 不断把……带到
  rationale: 分词在过去叙事中表达持续或反复发生的行动，“不断”保留其延续意味。
- source_word: מִנְחָה
  choice: 供物
  rationale: 此词可指礼物、贡物或献礼；接受者是耶和华，故“供物”既符合敬拜语境，又不限定具体祭物种类。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词表明耶和华是供物的接受者；以“献给”自然表达宗教性奉献，并音译神名。
- source_word: לִירוּשָׁלִַם
  choice: 带到耶路撒冷
  rationale: 介词 לְ 可表示目的地，也可在语境中理解为地点；正文采用方向义，另以脚注保留地点义。
- source_word: מִגְדָּנוֹת
  choice: 珍贵的礼物
  rationale: 该词指贵重、上好的物品；“珍贵的礼物”不把含义不必要地收窄为食品。
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 送给犹大王希西家
  rationale: 自然表达希西家是礼物的接受者，并保留其“犹大王”的身份。
- source_word: וַיִּנַּשֵּׂא
  choice: 备受尊崇
  rationale: Nifal 形态表示被抬高、地位或声望得到提升；此译法保留被动结果，并符合公众评价的语境。
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: 在列国眼中
  rationale: 近直译希伯来习语，表示在各国的公开评价中；“列国”符合庄重经文语体。
- source_word: מֵאַחֲרֵי כֵן
  choice: 从此以后
  rationale: 表示上述事件之后的时间；结合尊荣状态，此译自然呈现其后续结果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代中文圣经读者最熟悉“耶和华”，且它作为专名保留了经文对立约之神的直接称呼；“雅威”是较接近学术重构发音的可行译法。
- issue: וַיִּנַּשֵּׂא 所表达的尊荣
  choice: 备受尊崇
  alternative: 被高举
  rationale: 语境涉及希西家在列国中的公共地位和声望，因此采用可兼顾被动与社会评价的表达，不把这种尊荣明确解释为敬拜或神授地位。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“不断”体现过去叙事中分词的持续或反复意味；以两个分句和句号减轻希伯来语长串并列在中文中的生硬感。所有脚注标记均置于正文相应词组之后。
