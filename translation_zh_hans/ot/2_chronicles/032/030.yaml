base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: zh_hans
  text: 正是希西家塞住了基训水的上方出水口[a]，把水向下、向西引[b]到大卫城。希西家所做的一切都很顺利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基训的上泉”。这里的希伯来语既可指水涌出的出口，也可较广泛地指泉源或出流处。
    reason: lexical_alternative
  - marker: b
    text: 或译“使水直流”或“开渠引水”。原文动词表示使水沿着整直或指定的路线流去。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: 正是希西家
  rationale: 代词与专名并列构成强调；“正是希西家”自然保留了强调语气。
- source_word: סָתַם
  choice: 堵住
  rationale: 该动词表示封闭或阻塞开口；在水利工程语境中，“堵住”准确自然。
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: 基训水的上出口
  rationale: 保留“基训水”的结构及“上”的地形限定，同时用“出口”表达水流涌出的地点，不把它过度确定为泉源本身。
- source_word: וַיַּישְּׁרֵם
  choice: 把水引……直通
  rationale: 该词是 ישר 的使役形式，表示使水沿着直向或整治过的路线流去；“引……直通”兼顾方向性和中文表达。
- source_word: לְמַטָּה מַּעְרָבָה לְעִיר דָּוִיד
  choice: 向下方，直通大卫城的西边
  rationale: 同时表达向下和向西的方位；“大卫城的西边”将 לְעִיר דָּוִיד 理解为对西向目的地的地点说明，同时脚注保留另一种句法理解。
- source_word: וַיַּצְלַח
  choice: 都很顺利
  rationale: 该动词表示成功、顺遂；结合“所做的一切”，译为“都很顺利”比抽象的“兴盛”更贴合各项事务。
- source_word: בְּכָל־מַעֲשֵׂהוּ
  choice: 所做的一切
  rationale: 单数集合名词 מַעֲשֵׂהוּ 在 כל 之后概括其全部作为或工程；中文用“所做的一切”自然传达集合意义。
