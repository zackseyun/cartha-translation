  rationale: 修订避免把“向下、向西、到大卫城”的原文方向及目的地关系预先限定为“直通大卫城的西边”，并删去原文未明说的“直通”。同时改善水利措辞的现代汉语自然度；脚注分别锚定“出水口”和“引”，对应其实际所说明的词语。
