  text: וַ/יִּתְפַּלֵּ֞ל יְחִזְקִיָּ֣הוּ הַ/מֶּ֗לֶךְ וִֽ/ישַֽׁעְיָ֧הוּ בֶן אָמ֛וֹץ הַ/נָּבִ֖יא עַל זֹ֑את וַֽ/יִּזְעֲק֖וּ הַ/שָּׁמָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: zh_hans
  text: 于是，希西家王和亚摩斯的儿子以赛亚先知为这事祷告，向天[a]呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“诸天”；希伯来语名词为复数形式。
    reason: 保留הַשָּׁמָיִם在形式上的复数特征及其可能的直译。
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: 祷告
  rationale: פלל的Hitpael词形通常表示“祷告”。希伯来文先用单数动词，随后用复数动词；中文以两个并列主语自然统摄两个动作。
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: 希西家王
  rationale: 采用现代中文圣经人名的通行译法，并保留其王的身份；合译为“希西家王”比“王希西家”更符合现代汉语。
- source_word: וִישַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: 亚摩斯的儿子以赛亚先知
  rationale: 保留父子关系和“先知”称号，并采用通行中文音译。此处的亚摩斯是人名Amoz，不是先知阿摩司Amos。
- source_word: עַל זֹאת
  choice: 为这事
  rationale: על זאת指向引发祷告的这件事；“为这事”既可表达缘由，也可表达祷告所关切的事项，不把原文意义限制得过窄。
- source_word: וַיִּזְעֲקוּ
  choice: 呼求
  rationale: זעק表示在危难中迫切呼喊，常含向上帝求助之意；“呼求”比一般的“呼喊”更符合此处祷告语境，同时保留迫切感。
- source_word: הַשָּׁמָיִם
  choice: 天
  rationale: 该词形态上为复数，但在此表示呼求所朝向的天上领域。现代汉语的“天”自然、庄重，也不强行加入超出原文的宇宙论解释。
theological_decisions:
- issue: 祷告语境中הַשָּׁמָיִם的译法
  choice: 向天呼求
  alternative: 向诸天呼求
  rationale: 原文直接说他们向“天/诸天”呼求，并未在句中明说“向上帝”。译作“向天”保留原文表达及其指向神圣领域的含义，同时避免把隐含对象直接改写成明说的“上帝”。
- issue: עַל זֹאת所表达的是缘由还是事项
  choice: 为这事
  alternative: 因这事
  rationale: 介词短语既可理解为祷告所关切的事项，也可理解为促使他们祷告的缘由。“为这事”在中文中较自然地保留这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接上下文；“希西家王”与“以赛亚先知”符合自然现代汉语。脚注标记置于实际涉及异译的“天”之后，而不是人名之后。
