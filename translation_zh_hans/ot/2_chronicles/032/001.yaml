base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: zh_hans
  text: 这些事和这些忠信的作为[a]以后，亚述王西拿基立前来，进入犹大；他在这些坚固城外安营，打算攻破这些城，占为己有[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信的作为”也可理解为“真实”或“忠信”。希伯来语אֱמֶת可表示“真实”或“忠信”；这里可能指前文所述希西家的忠信作为。
    reason: lexical_alternative
  - marker: b
    text: 末句也可较直译为“打算为自己攻破它们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים וְהָאֱמֶת הָאֵלֶּה
  choice: 这些事和这一切忠信之举以后
  rationale: “这些事”承接前文事件；אֱמֶת可指“真实、忠信”，在此语境中较自然地指希西家先前忠信的作为。用“忠信之举”既照顾词义，也使汉语表达清楚。
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: 亚述王西拿基立
  rationale: 按现代汉语习惯将王号置于人名前；专名采用通行译名。
- source_word: בָּא וַיָּבֹא בִיהוּדָה
  choice: 来侵入犹大
  rationale: 原文连续使用两个表示“来、进入”的动词；“来侵入”在战争语境中自然表达其进入犹大的敌对行动，又未增添“征服”等结果含义。
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: 在各坚固城外安营
  rationale: חנה על表示针对这些城安营；“在……外安营”符合汉语叙事，并保留尚未明说已经围城或攻克的程度。
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: 打算攻破这些城，占为己有
  rationale: וַיֹּאמֶר在此表示心中打算；בקע指破开、防线被突破。末尾אֵלָיו字面方向关系较含混，在此可理解为使这些城归向自己、为自己取得，故译“占为己有”，并以脚注保留较直译的可能。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“坚固城”为中文圣经语体中易懂且准确的军事用语；避免将“安营”过度解释为已经完成围城，也不把אֱמֶת单一限定为抽象的“真理”。
