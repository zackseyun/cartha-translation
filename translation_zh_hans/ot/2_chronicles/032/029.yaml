  text: וְ/עָרִים֙ עָ֣שָׂה ל֔/וֹ וּ/מִקְנֵה צֹ֥אן וּ/בָקָ֖ר לָ/רֹ֑ב כִּ֤י נָֽתַן ל/וֹ֙ אֱלֹהִ֔ים רְכ֖וּשׁ רַ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: zh_hans
  text: 他还为自己建造了城镇，拥有大量的羊群和牛群，因为上帝赐给他极多的财富[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”也可译作“财物”或“产业”。
    reason: רְכוּשׁ 的语义范围包括财物、产业和物质财富；脚注保留这些合理的词义选择。
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: 他还为自己建造了城镇
  rationale: וְ 表示与上文相加的关系，译作“还”；עָרִים 可指城市或城镇，结合复数及自然汉语译作“城镇”；עָשָׂה לוֹ 直指为自己而建造或置办，译作“为自己建造了”保留其受益、归属意味。
- source_word: וּמִקְנֵה צֹאן וּבָקָר לָרֹב
  choice: 拥有大量的羊群和牛群
  rationale: מִקְנֵה 指牲畜或牲畜产业，后面的 צֹאן וּבָקָר 具体说明为小型牲畜群与牛群；用“拥有……羊群和牛群”自然表达希伯来语名词结构，לָרֹב 译作“大量”。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出希西家拥有众多产业的原因，现代汉语用“因为”清楚表达因果关系。
- source_word: נָתַן לוֹ אֱלֹהִים
  choice: 上帝赐给他
  rationale: 该短语明确以上帝为施予者；“赐给”既准确表达 נָתַן，也符合庄重而自然的经文语体。
- source_word: רְכוּשׁ רַב מְאֹד
  choice: 极多的财富
  rationale: רְכוּשׁ 指财物、产业或物质财富；“财富”能概括上下文中的各类资产。רַב מְאֹד 强调数量极其丰厚，译作“极多”保留强化语气。
theological_decisions:
- issue: 希西家富足的来源
  choice: 明确说他的众多财富是上帝所赐
  alternative: 仅陈述希西家拥有财富，不凸显其来源
  rationale: כִּי נָתַן לוֹ אֱלֹהִים 明确将这些财富归因于上帝的赐予；译文保留这一陈述，但不将其扩展为超出本节的普遍性财富教义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“城镇”“羊群和牛群”“财富”均为当代读者熟悉的表达；句式保持简洁，并清楚呈现原文的递进和因果关系。
