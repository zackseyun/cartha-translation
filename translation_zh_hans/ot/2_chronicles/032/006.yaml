  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: zh_hans
  text: 他任命军队统领管理百姓，把他们召集到城门广场、自己面前，并鼓励他们[a]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“向他们的心说话”；这是指以能鼓励、坚固人心的方式对他们说话的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 委派
  rationale: 该动词本义为“给、安置”，在设立官长管理百姓的结构中表示任命或委派；“委派”自然地传达职务安排。
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: 军队统领
  rationale: 该短语直译近于“战争的首领”，这里指军事领导者；“军队统领”既明确其职能，又保持庄重。
- source_word: עַל הָעָם
  choice: 管理百姓
  rationale: 介词 עַל 在任命语境中表示居于其上、负有管辖权；译作“管理百姓”比生硬的“在百姓之上”更符合现代汉语。
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: 把众人召集到自己那里
  rationale: 保留 קבץ 的召集含义和 אֵלָיו“到他那里”的指向，表明希西家亲自召集众人。
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: 聚在城门的广场上
  rationale: רְחוֹב 指城门附近的开阔公共场地；“城门的广场”清楚呈现这一公共空间。
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: 对他们说了鼓舞人心的话
  rationale: 希伯来习语字面为“向／在他们心上说话”，语境中指安慰、鼓励或坚定人心；正文采用自然汉语表达，并以脚注保留原文意象。
- source_word: לֵאמֹר
  choice: ：
  rationale: 该词引出下文直接引语；现代汉语以冒号自然承接下一节的话，无须机械译出“说”。
