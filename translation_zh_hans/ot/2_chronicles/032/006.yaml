    issue: 脚注锚点和脚注内容不对应
    rationale: 正文的 [a] 附在“百姓”后，脚注却说明“设立在百姓之上”；但英文学术审校轨迹所保留的注释应对应“向他们的心说话”这一习语。现有脚注既未说明该习语，也不必要地为正文已清楚表达的任命关系另设注释。
  - severity: low
    issue: 召集与地点的汉语句法不顺
    rationale: “把众人召集到自己那里，聚在城门的广场上”使“聚在”似乎另起一个未明主语，且“到自己那里”与地点短语的关系不够清晰。
  - severity: low
    issue: “众人”使代词所指过宽
    rationale: 原文的“他们”紧接“军事首领”，在叙事衔接上首先指这些首领。译为“他们”可保留原文指代，而不扩大为全体百姓。
