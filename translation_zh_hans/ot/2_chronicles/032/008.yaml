revisions:
- from: “与他同在的不过是血肉的膀臂[a]；与我们同在的却是耶和华我们的上帝，他必帮助我们，为我们争战。”百姓听了犹大王希西家的话，就有了倚靠。
  to: “与他同在的只是血肉的膀臂[a]；但与我们同在的是耶和华——我们的上帝，来帮助我们，并为我们争战。”百姓倚靠犹大王希西家的话。
  rationale: 修订保留原文的人力与耶和华帮助之间的鲜明对照、神名和膀臂隐喻。将“他必”改为“来”，较贴近两个不定式与“同在”的关系；末句恢复“倚靠……的话”这一明确的动词—介词宾语关系，删去原文没有的“听了”。
