  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: zh_hans
  text: “与他同在的只是血肉的膀臂[a]；但与我们同在的是耶和华——我们的上帝，来帮助我们，并为我们争战。”百姓倚靠犹大王希西家的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人的力量”。原文直译为“血肉的膀臂”，以有限的人力与耶和华的帮助相对照。
    reason: 说明希伯来语隐喻及其意译选择。
lexical_decisions:
- source_word: עִמּוֹ
  choice: 与他同在的
  rationale: 保留与后句“与我们同在的”之间鲜明的平行结构，并表达站在他一方、作为其助力之意。
- source_word: זְרוֹעַ בָּשָׂר
  choice: 血肉的膀臂
  rationale: 保留希伯来语“膀臂”的力量意象；“血肉”表明这只是人的力量，与上帝的帮助形成对照。
- source_word: וְעִמָּנוּ
  choice: 与我们同在的却是
  rationale: 将连接词在语境中的强烈转折作用自然表达出来，同时保留前后平行。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的形式音译四字神名，保留其作为以色列上帝专名的功能。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 直接表达第一人称复数所属关系及群体的认信。
- source_word: לְעָזְרֵנוּ
  choice: 帮助我们
  rationale: 目的不定式在此说明耶和华与他们同在所要施行的帮助。
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: 为我们争战
  rationale: 自然表达希伯来语“争战我们的战争”的同源结构及“属于我们、关乎我们”的战事；避免生硬直译。
- source_word: וַיִּסָּמְכוּ
  choice: 就有了倚靠
  rationale: 保留动词“倚靠、支撑自己”的形象，并在现代中文中表达百姓因这番话而得着信心。
- source_word: עַל דִּבְרֵי
  choice: 听了……的话
  rationale: 结合中文句法表达百姓的倚靠是由希西家的话所引发；“倚靠”本身仍保留原动词核心意义。
- source_word: יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王希西家
  rationale: 依照自然中文次序完整保留人物姓名、王位及所属国。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文圣经传统中最广为人知的专名形式，不以“主”这一称号替代。
- issue: 人的力量与上帝帮助之间的对照
  choice: 以“不过……却……”明确表达转折
  alternative: 按字面并列为“和……和……”
  rationale: 上下句的平行结构本身构成强烈反差；中文用转折词可忠实再现修辞力度，而不增加原文没有的教义判断。
- issue: לְעָזְרֵנוּ וּלְהִלָּחֵם 的语气
  choice: 他必帮助我们，为我们争战
  alternative: 来帮助我们，并争战我们的战争
  rationale: 不定式说明神与他们同在的目的或结果；“必”在引语中自然传达希西家确信的语气，但不把具体得胜方式解释得超出原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“血肉的膀臂”特意保留原文隐喻，并用脚注解释；后半句调整为自然中文语序，同时保留“倚靠”的核心形象。
