  text: storehouses for the produce of grain[a], new wine, and oil, and stalls for all kinds of animals[c][b], and folds for the flocks.
translation:
  language: zh_hans
  text: 又有为谷物、新酒和油的收成而设的仓库[a][b]，有为各类牲畜预备的棚圈，也有为羊群预备的圈栏[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仓库”或译“储藏城”；该词也可能指较大型的储藏设施或储藏区。
    reason: lexical_alternative
  - marker: b
    text: “新酒”所译的希伯来语词常用于农产品清单，与泛指酒的其他词有所区别。
    reason: lexical_alternative
  - marker: c
    text: “圈栏”也可译作“畜圈”或“围圈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: 仓库
  rationale: 这里指储存农产品的设施；译作“仓库”既符合上下文，也比“储藏城”更自然。
- source_word: תְבוּאַת דָּגָן
  choice: 五谷
  rationale: 该短语指谷物的出产；现代汉语用“五谷”可简洁表达各类粮食作物及其收成。
- source_word: תִירוֹשׁ
  choice: 新酒
  rationale: 该词常见于“五谷、新酒和油”的农产组合中；“新酒”保留它与一般“酒”字词之间的词汇区别。
- source_word: יִצְהָר
  choice: 油
  rationale: 在这一农产组合中通常指橄榄油；正文采用简洁、传统而不过度解释的“油”。
- source_word: אֻרָוֹת
  choice: 棚圈
  rationale: 该复数名词指安置或饲养牲畜的处所；“棚圈”兼顾遮蔽和圈养之意，又不局限于马厩。
- source_word: לְכָל בְּהֵמָה וּבְהֵמָה
  choice: 供各类牲畜使用
  rationale: 原文重复“牲畜”一词，具有逐类、遍指的意味；译作“各类牲畜”以自然汉语传达这种分配性表达。
- source_word: עֲדָרִים
  choice: 羊群
  rationale: 该词可泛指群畜，但常用于绵羊、山羊等小型牲畜；上下文与圈栏相配，译作“羊群”清楚自然。
- source_word: אֲוֵרוֹת
  choice: 圈栏
  rationale: 该词指供群畜栖息的围圈；“圈栏”与前面的“棚圈”有所区分，同时保留其围护设施的含义。
