base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: zh_hans
  text: 你们要刚强勇敢！不要因亚述王和所有与他同在的一大群人[a]而惧怕，也不要惊慌；因为与我们同在的，比与他同在的更多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有与他同在的全军。”这里的希伯来词可泛指众多的人，在本语境中也可指大队军兵。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为与我们同在的，多于与他同在的。”原文的比较句有所省略，其含义由下一节进一步说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: 要刚强勇敢
  rationale: 两个复数命令式组成常见的劝勉搭配。译作“刚强勇敢”既保留两个相辅相成的概念，也符合现代汉语的自然表达。
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: 不要……惧怕，也不要惊慌
  rationale: 分别传达 ירא 的“惧怕”和 חתת 在受威胁语境中的“惊慌、丧胆”之意，同时保留两个并列的否定命令。
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: 因亚述王……而
  rationale: מִפְּנֵי 在与“惧怕”连用时表示惧怕的缘由或所面对的威胁；汉语用“因……而惧怕”比直译“在……面前”更自然。
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: 跟随他的这一大群人
  rationale: הָמוֹן 可指众多的人、群众，也可在军事语境中指大队军兵。“一大群人”保留词义的宽度，不在正文中过度限定为“军队”。
- source_word: עִמָּנוּ רַב מֵעִמּוֹ
  choice: 与我们同在的，比与他同在的更多
  rationale: 原文是省略式比较，直译近于“与我们同在的，多于与他同在的”。此译补足汉语比较结构，却不把第8节才明说的身份提前写入本节。
theological_decisions:
- issue: 末句省略式比较所指的是数量还是单一位格
  choice: 保留数量比较：“与我们同在的，比与他同在的更多”
  alternative: “与我们同在的那一位，比与他同在的更大”
  rationale: 原文 רַב 为单数形式，但这里的省略结构接续前文的“大群人”，下一节才进一步说明双方倚靠的力量。本节译为数量上的“更多”，既顺应直接语境，也避免引入其他经文中较明确的单一位格表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“刚强勇敢”保留军事劝勉的力度；分号明确标出后半句是前述命令的理由。所有代词依原文保持男性第三人称所指，即亚述王。
