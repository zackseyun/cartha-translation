base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: zh_hans
  text: 这事以后[a]，亚述王西拿基立派他的臣仆前往耶路撒冷，向犹大王希西家和所有在耶路撒冷的犹大人说；那时他正攻打拉吉，率领着他所统辖的一切力量[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这些事以后”。
    reason: 原文的时间短语可按汉语语境作单数或概括性的复数表达。
  - marker: b
    text: “他所统辖的一切力量”也可理解为“他的全部军力”或“他的整个辖域”。原文所用的词可指统治权、辖域，也可在本处语境中指他所掌控并带在身边的力量。
    reason: 保留 מֶמְשַׁלְתּוֹ 在统治、辖域和军事力量之间的语义张力。
lexical_decisions:
- source_word: אַחַר זֶה
  choice: 这事以后
  rationale: 这是自然的时间承接语，既保留原文的先后关系，也不把单数指示语扩展成“这些事”。
- source_word: שָׁלַח
  choice: 派
  rationale: 在君王差遣臣仆的语境中，“派”比“送”自然准确。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 王室语境中的 עבד 可指侍奉君王的人或官员；“臣仆”兼顾其从属身份和宫廷背景，而不武断限定为具体官职。
- source_word: יְרוּשָׁלַיְמָה
  choice: 前往耶路撒冷
  rationale: 方向词尾表示朝向某地运动；“前往”清楚传达这一点。
- source_word: וְהוּא עַל לָכִישׁ
  choice: 他正……驻兵攻打拉吉
  rationale: 介词 עַל 与城名连用时在此具有敌对的军事含义。“驻兵攻打”用自然汉语表达其兵临城下、针对该城采取军事行动的状态，同时脚注保留较宽的可能译法。
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: 率领自己统辖的全部力量
  rationale: מֶמְשָׁלָה 的核心含义是统治权、辖域或所掌管的权势；本处军事语境指向他权下随行的整体实力。“统辖的全部力量”保留统治层面的词义，也符合上下文。
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: 向犹大王希西家和所有……犹大人
  rationale: 这里的敌对背景已经由攻打拉吉及下文话语显明；汉语以“向……说”自然引出受话者，避免生硬的“敌对……说”，但不消除其威胁性质。
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: 在耶路撒冷的
  rationale: 明确限定这里所说的“所有犹大人”是当时身在耶路撒冷的人。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 以现代汉语直接引语的常用格式承接下一节内容。
