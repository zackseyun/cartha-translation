  register: 采用现代、庄重而易懂的叙事体。“西拿基立”“希西家”“拉吉”沿用常见中文圣经专名。将原文较长的嵌入结构分成两句，以免汉语关系混乱；内容关系仍保持为：西拿基立本人攻打拉吉，同时差遣臣仆前往耶路撒冷传话。
