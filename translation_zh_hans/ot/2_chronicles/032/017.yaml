language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: zh_hans
  text: 他还写信辱骂以色列的神雅威[a]，并诋毁他，说：“列邦各地的神怎样没有从我手中救出他们的百姓，希西家的神也必照样不能从我手中救出他的百姓。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辱骂”也可译作“毁谤”、“蔑视”或“公然挑战”；这个希伯来语动词含有以言语侮辱、凌辱的意思。
    reason: 词义有多个相近选项，正文无法同时呈现其侮辱与挑衅的全部色彩。
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: 他还写信
  rationale: סְפָרִים在这一叙事语境中指书信；前缀ו承接上文，用“还”自然表达其延续和追加作用。
- source_word: לְחָרֵף
  choice: 辱骂
  rationale: חרף表示以言语侮辱、毁谤或公然蔑视；“辱骂”既保留敌对言辞的强度，也符合现代汉语表达。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה；以“雅威”音译，保留其作为以色列之神专名的性质。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 按原文属格结构直译，明确雅威与以色列的关系。
- source_word: וְלֵאמֹר עָלָיו
  choice: 并说攻击他的话
  rationale: עַל在上下文中带有敌对指向；这样译出“针对他发言”的意思，同时避免生硬重复两个“说”。
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: 列邦各地的神怎样
  rationale: כֵּ引出比较；“列邦各地”简洁保留גּוֹיֵי הָאֲרָצוֹת所表达的众邦、众地之意。
- source_word: לֹא הִצִּילוּ / לֹא יַצִּיל
  choice: 不能……救出 / 也照样不能……救出
  rationale: נצל的使役形在军事威胁语境中指从控制或危险中解救；前后重复“救出”保持原文的平行和讥讽力度。
- source_word: מִיָּדִי
  choice: 从我手中
  rationale: 保留希伯来语以“手”表示权势和控制的形象，两处重复也维持原文修辞。
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: 希西家的神
  rationale: 保留说话者把雅威贬称为希西家所属之神的挑衅语气，而不替他改为较中性的称谓。
- source_word: עַמּוֹ
  choice: 他的百姓
  rationale: 代词所指是“希西家的神”；“他的百姓”保留原文指代，不额外解释为犹大或耶路撒冷。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用以色列之神的专名，而非普通称号；音译“雅威”保留专名性质，也避免将其默默改作称谓。
- issue: חרף用于针对神的敌对言语
  choice: 辱骂
  alternative: 亵渎／毁谤／蔑视
  rationale: 此词兼有侮辱、毁谤和公然挑战的语义。“辱骂”不预先把该行为限定为某个神学术语，脚注则保留其他可能表达。
- issue: “希西家的神”的称呼
  choice: 保留原称
  alternative: 以色列的神／雅威
  rationale: 这是亚述王讥讽话语的一部分；保留该称呼才能呈现他把雅威与列国诸神并列的错误主张和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“列邦各地”略带经文语体但普通读者易懂；引语保留前后严格平行的讥讽结构。“百姓”用于群体归属，“手中”保留原文权势隐喻。
