  yaml_path: translation/ot/2_chronicles/032/010.yaml
  text: 'Thus says Sennacherib king of Assyria: On what are you trusting, that you remain under siege in Jerusalem?'
translation:
  language: zh_hans
  text: “亚述王西拿基立如此说：你们倚靠什么，竟留在耶路撒冷受围困呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留希伯来语使者宣告公式的形式和庄重语气。
- source_word: עַל מָה אַתֶּם בֹּטְחִים
  choice: 你们倚靠什么
  rationale: עַל מָה 在此询问信赖的根据或对象；“倚靠什么”自然且不额外限定答案。
- source_word: וְיֹשְׁבִים
  choice: 竟留在
  rationale: יֹשְׁבִים 可指坐着、居住或停留；结合围城语境译为“留在”，并用“竟”传达前后分句在质问中的结果意味。
- source_word: בְּמָצוֹר
  choice: 受围困
  rationale: מָצוֹר 在此指被围城的处境，“受围困”准确表达其被动状态。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按现代汉语通行地名音译，并保留地点关系。
