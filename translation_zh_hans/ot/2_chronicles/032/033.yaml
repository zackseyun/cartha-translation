  text: וַ/יִּשְׁכַּ֨ב יְחִזְקִיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ/הוּ֮ בְּֽ/מַעֲלֵה֮ קִבְרֵ֣י בְנֵי דָוִיד֒ וְ/כָבוֹד֙ עָֽשׂוּ ל֣/וֹ בְ/מוֹת֔/וֹ כָּל יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: zh_hans
  text: 希西家与列祖同睡[a]，人们把他葬在大卫子孙墓地的高处。希西家去世时，全犹大和耶路撒冷的居民都向他表示敬意。他儿子玛拿西继位作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与列祖同睡”是圣经中表示死亡的惯用委婉语。
    reason: 帮助现代读者理解保留在正文中的希伯来语王室讣告表达。
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与列祖同睡
  rationale: 保留希伯来文王室讣告中的固定委婉语；下文安葬的叙述清楚表明这里指死亡。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 人把他葬在
  rationale: 原文为主动复数，主语未明；用泛指的“人”既保留主动语态，也符合现代汉语表达。
- source_word: בְּמַעֲלֵה
  choice: 在……的高处
  rationale: מַעֲלֵה 可指上坡、上行处或较高区域；此译法保留地形含义，又不武断限定具体墓葬结构。
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: 大卫子孙坟墓
  rationale: בני 在此是王朝谱系用语，现代汉语“子孙”可自然涵盖大卫王室后裔，同时贴近原文字面。
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: 向他表示敬意
  rationale: 准确传达字面为“为他行尊荣”的希伯来语习语，也适合去世和葬礼语境。
- source_word: בְּמוֹתוֹ
  choice: 去世时
  rationale: 自然而庄重地表达时间关系，并保留死亡语境中的委婉语体。
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: 犹大众人和耶路撒冷的居民
  rationale: “犹大众人”表达 כָּל יְהוּדָה 的整体公众范围，“居民”准确对应居住者。
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: 接续他作王
  rationale: 这是王位承继的固定表述；该译法自然地表达其儿子继位掌权。
theological_decisions:
- issue: 王室讣告中的死亡委婉语
  choice: 保留“与列祖同睡”
  alternative: 译作“去世了”或“死了”
  rationale: 保留原文惯用公式及其与列王叙事的文学连续性，不将其意义扁平化；安葬句已使含义清楚。
- issue: “大卫之子”的范围
  choice: 正文译为“大卫子孙”
  alternative: 直译为“大卫众子的”并加注说明王室后裔
  rationale: 在希伯来文语境中，这一复数短语指大卫王朝的后裔；汉语“子孙”既保留谱系意象，又避免让读者误以为仅指大卫的亲生儿子。
- issue: 所受尊荣的具体形式
  choice: 译作概括性的“表示敬意”
  alternative: 具体化为“举行隆重葬礼”或“厚葬”
  rationale: 原文只说众人向他行尊荣，并未说明具体仪式；译文不补入未经文本明说的丧葬细节。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“列祖同睡”刻意保留圣经叙事的传统语感；其余措辞尽量自然。“高处”保留 בְּמַעֲלֵה 的地形歧义，不具体断定为墓群的上部或通往墓地的坡道。
