base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: zh_hans
  text: 他的臣仆又出言攻击耶和华上帝，也攻击耶和华上帝的仆人希西家。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又谈论耶和华上帝和他的仆人希西家。”希伯来文的介词也可较中性地译为“谈论、论到”，但这里的上下文更支持带敌意的“攻击”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: 又
  rationale: 承接上文并表示进一步的言语行动；现代汉语用“又”简洁自然。
- source_word: דִּבְּרוּ
  choice: 出言
  rationale: דבר在此指说话；与“攻击”搭配为“出言攻击”，既保留言语行为，也体现语境中的敌意。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 这里指亚述王派出的下属或官员。“臣仆”保留עבד的服事、隶属含义，又符合王室语境，不武断限定为奴隶。
- source_word: עַל
  choice: 攻击
  rationale: דבר与עַל在敌对语境中可表示出言反对、攻击；上下文谈到亵渎和敌对言论，因此正文采用敌意义，同时以脚注保留较中性的可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，明确其为专名，而非以称号“主”替代。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 在“耶和华上帝”中自然表达神名与称谓的同位关系；希伯来文虽带冠词，中文无需另译“那位”。
- source_word: יְחִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用该人名通行的现代中文译法。
- source_word: עַבְדּוֹ
  choice: 他的仆人
  rationale: 指希西家是耶和华的仆人，具有忠诚服事及君王—神学色彩；“仆人”比“奴隶”更符合本处语境。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留为专名，并采用普通读者最熟悉且庄重的传统音译“耶和华”；“雅威”是更接近学术重构发音的另一音译。
- issue: 希西家被称为עַבְדּוֹ的含义
  choice: 他的仆人
  alternative: 他的奴仆
  rationale: 此处强调希西家对耶和华的归属和服事，也是君王的神学称谓；译作“奴仆”可能不必要地突出社会身份。
- issue: 介词עַל在敌对言语中的语气
  choice: 攻击
  alternative: 谈论
  rationale: 上下文清楚呈现亚述使者的亵渎和敌意，故正文体现“针对、反对”的含义；不过介词本身也可较中性地表示“关于”，因此保留脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”适合亚述王室下属的语境，“出言攻击”明确这是言语上的敌对行为。正文保留原文两次עַל所形成的平行结构：“攻击……也攻击……”。
