source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: zh_hans
  text: “现在，不要让希西家欺骗你们，也不要让他用这样的话蛊惑你们[a]；不要相信他。因为任何民族或国度的神，都不能从我手中和我列祖手中[b]救出自己的百姓；何况你们的神又怎能从我手中救出你们呢！”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛊惑”也可译作“煽动”“诱使”或“劝诱”。
    reason: lexical_alternative
  - marker: b
    text: “手”在这里是表示权势或控制的希伯来习语；“列祖”可指先祖或王室前人。
    reason: cultural_note
  - marker: c
    text: “何况……又怎能……呢”也可译作“你们的神当然更不能……”，表达原文加强否定结论的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 自然引出说话者眼前的劝阻和威吓，也保留了希伯来语的语篇转折。
- source_word: יַשִּׁיא
  choice: 欺骗
  rationale: 该动词表示使人受骗、被引入歧途；“欺骗”直接而符合上下文。
- source_word: יַסִּית
  choice: 怂恿
  rationale: 该词可指煽动、诱使或劝动。这里是指希西家用话语影响百姓；“怂恿”保留负面意味，又避免与前面的“欺骗”重复。
- source_word: כָּזֹאת
  choice: 这样
  rationale: 保留指示语气，指希西家以这种方式或这些话影响百姓。
- source_word: תַּאֲמִינוּ לוֹ
  choice: 相信他
  rationale: 此处焦点是百姓是否接受希西家的话；“相信他”比“信靠他”更贴合直接语境。
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: 任何民族或国度的神
  rationale: 以自然汉语表达原文的全称否定范围，即各民族、各国度所属的神明无一例外。
- source_word: לְהַצִּיל
  choice: 救出
  rationale: 军事威胁语境中表示从敌方控制下解救出来；“救出”清楚自然。
- source_word: מִיַּדִי וּמִיַּד אֲבוֹתָי
  choice: 从我和我列祖手中
  rationale: 保留“手”这一表示权势、控制的希伯来习语；“列祖”在此指说话者的先祖或王室前人。
- source_word: אַף כִּי
  choice: 更何况……绝不能
  rationale: 该习语在此承接前面的否定论证并加强结论；汉语用“更何况”配合“绝不能”自然呈现其挑衅语气。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 虽有复数形态，此处按上下文指犹大所敬奉的独一位神，因此译作单数。
theological_decisions:
- issue: אֱלֹהֵיכֶם 的单复数所指
  choice: 译作单数“你们的神”，指犹大/以色列的神
  alternative: 按形态直译为“你们的众神”
  rationale: אֱלֹהִים 常以复数形式指以色列的神；上下文中亚述人的讥讽对象也是犹大所敬奉的这一位神。译成复数会误导读者。
- issue: 亚述使者对上帝能力的否定
  choice: 作为人物原话直译为“他绝不能……救出你们”
  alternative: 弱化为仅仅表达怀疑或可能性
  rationale: 原文是亵渎性的强烈断言。应保留叙事中的神学张力，不把人物的话改成叙述者认可的判断，也不削弱其挑衅力度。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。以短句和分号保留演说式威吓的节奏；“列祖”略具经文语体，但普通读者仍易理解。所有脚注标记均置于相关正文之后。
