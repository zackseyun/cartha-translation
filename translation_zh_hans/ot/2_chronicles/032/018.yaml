base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: zh_hans
  text: 他们用犹大人的语言，向城墙上的耶路撒冷人大声呼喊，要使他们惧怕、惊慌，好攻取这城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: 犹大人的语言
  rationale: 指犹大地区居民所说的语言；此处强调对方使用城墙上百姓听得懂的本地语言，译成“犹大人的语言”比仅作“犹大语”更便于现代读者理解。
- source_word: בְקוֹל גָּדוֹל
  choice: 大声
  rationale: 希伯来语直译为“用大的声音”，自然汉语以“大声”准确表达其方式和音量。
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: 要使他们惧怕、惊慌
  rationale: 保留两个并列使役动词的递进效果：先使人害怕，再使人陷入慌乱。
- source_word: לְמַעַן יִלְכְּדוּ אֶת־הָעִיר
  choice: 好攻取这城
  rationale: לְמַעַן 表目的；לכד 在军事语境中指夺取或攻占城邑，“攻取”简洁而贴切。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留原文的目的链条，并避免不必要地补出呼喊者身份或言语内容。
