base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: zh_hans
  text: “你们岂不知道，我和我列祖[a]对各地所有的人民做了什么吗？各地列国的神真能从我手中救出他们的国土吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列祖”也可译作“先辈”；希伯来语使用家族和王朝承继的称谓。
    reason: 说明 אֲבוֹתַי 的词汇替代及其王朝家族语境。
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: 你们不知道……吗
  rationale: 保留期待肯定回应的反问语气；现代汉语自然简洁。
- source_word: מֶה עָשִׂיתִי
  choice: 怎样处置
  rationale: 此处指对各地人民所施行的征服行为。“怎样处置”既自然，也保留原文“做了什么”的威吓意味，而不额外具体化。
- source_word: אֲנִי וַאֲבוֹתַי
  choice: 我和我列祖
  rationale: “列祖”保留希伯来语的家族及王朝用语，语体庄重；这里可指父辈或王朝先辈。
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: 各地所有的人民
  rationale: 保留“各地”的复数地域概念，并用自然汉语表达全称范围。
- source_word: הֲיָכוֹל יָכְלוּ
  choice: 真能……吗
  rationale: 不定式绝对式与限定动词连用表示加强；“真能”准确传达带有蔑视意味的强调反问。
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: 各地列国的神
  rationale: 按说话者的表述直译为“神”，不加入“所谓”等解释性限定；“各地列国”兼顾地域复数和政治群体。
- source_word: לְהַצִּיל
  choice: 救出
  rationale: 在军事威胁语境中表示从敌方权势下解救；“救出”清楚而自然。
- source_word: אֶת אַרְצָם
  choice: 他们的国土
  rationale: 此处指各国各自的领土；“国土”比单用“地”更明确，同时保留集合性的单数表达。
- source_word: מִיָדִי
  choice: 从我手中
  rationale: 保留原文以“手”表示权势和控制的形象，在现代汉语中也清楚自然。
theological_decisions:
- issue: 异教君王夸口中“神”的称谓
  choice: 直接译为“神”
  alternative: 译为“所谓的神”
  rationale: 原文呈现西拿基立自己的比较性言论。译文不在正文中预先否定这些神，以免把神学评注加入说话者的话。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个反问句保留西拿基立挑衅和夸耀的口吻；“真能”体现希伯来语加强结构。脚注标记已在正文中出现。
