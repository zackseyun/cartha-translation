base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: zh_hans
  text: 那些日子，希西家病重，几乎要死。他向雅威祷告；雅威回应了他[a]，又赐给他一个神迹[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“对他说”。这里指雅威回应希西家的祷告。
    reason: lexical_alternative
  - marker: b
    text: 或译“记号”、“奇事”或“征兆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 保留希伯来语常见的时间表达，同时符合现代汉语叙事习惯。
- source_word: חָלָה יְחִזְקִיָּהוּ עַד לָמוּת
  choice: 希西家病得要死
  rationale: חלה 表示患病，עַד לָמוּת 表明病情严重、濒临死亡；此译简洁自然，也保留原文力度。
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: 他向雅威祷告
  rationale: 准确表达向神祈祷的动作，并将圣名 יְהוָה 音译为“雅威”。
- source_word: וַיֹּאמֶר לוֹ
  choice: 雅威回应了他
  rationale: 该动词字面是“对他说”，但在祷告之后表示雅威作出回应；正文采用符合语境的表达，脚注保留字面译法。
- source_word: מוֹפֵת
  choice: 兆头
  rationale: מוֹפֵת 可指具有确认作用的神迹、奇事或征兆；“兆头”既可理解为记号，也保留其超常和预示意味。
- source_word: נָתַן לוֹ
  choice: 赐给他
  rationale: נתן 基本义为“给”；因施予者是雅威，现代庄重汉语用“赐给”自然贴切。
theological_decisions:
- issue: 圣名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的古希伯来语读音重构，并明确保留专名性质。
- issue: וַיֹּאמֶר לוֹ 的主语与语用意义
  choice: 雅威回应了他
  alternative: 他对他说
  rationale: 希伯来语动词仅明示阳性单数主语，语境最自然地承接雅威；平行叙事也表明这是神对希西家祷告的回应，但脚注保留原文较形式化的说法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“病得要死”自然传达病情濒危；分号凸显祷告与神回应之间的关系。所有代词所指在正文中适度明示，以免汉语读者误解，同时不扩充原文事件内容。
