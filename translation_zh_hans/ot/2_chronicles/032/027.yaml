base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: zh_hans
  text: 希西家拥有极其丰厚的财富和尊荣，又为自己建造库房[a]，收藏银子、金子、宝石、香料、盾牌，以及各样珍贵的器物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “库房”也可译作“宝库”。希伯来语词既可泛指储藏物品的库房，也可特指存放财宝的库房。
    reason: lexical_alternative
  - marker: b
    text: “各样珍贵的器物”也可译作“所有贵重物品”。原文用语范围较广，不一定只指容器。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: 希西家拥有
  rationale: 这是表达所有关系的希伯来语惯用结构，现代汉语自然译为“拥有”；上下文的叙事承接无需机械译出句首连接词。
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: 极其丰厚的财富和尊荣
  rationale: “极其丰厚”保留双重加强语气；“尊荣”兼顾君王所享的声望、地位与荣华，避免把 כָבוֹד 限定为单纯的内在美德。
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: 又为自己建造库房
  rationale: אֹצָרוֹת 可指一般库房，也可特指财宝库；按后续多类收藏品，正文采用较宽泛的“库房”。עָשָׂה 在建筑语境中自然译作“建造”，“为自己”明确保留 לוֹ。
- source_word: לְכֶסֶף וּלְזָהָב
  choice: 收藏银子、金子
  rationale: 希伯来语介词表示这些库房的用途；汉语以“收藏”统摄清单，比逐项重复“为……建造”更自然。
- source_word: וּלְאֶבֶן יְקָרָה
  choice: 宝石
  rationale: 单数名词在此具有集合意义，现代汉语“宝石”自然涵盖贵重石料。
- source_word: וְלִבְשָׂמִים
  choice: 香料
  rationale: 该词泛指芳香物质；“香料”保留其宽泛范围，不窄化为香水或乳香。
- source_word: וּלְמָגִנִּים
  choice: 盾牌
  rationale: מָגֵן 的通常具体含义为盾牌，不应泛化为武器或军械。
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: 以及各样珍贵的器物
  rationale: כְּלֵי 可指器具、物件；חֶמְדָּה 表示可喜爱、珍贵之物。“各样珍贵的器物”既保留广度，也符合财富清单的语境。
theological_decisions: []
