base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: zh_hans
  text: 他振作起来，重修所有破损的城墙，又把城墙加高到城楼处[c]；他还在城墙外另筑一道墙，加固大卫城的米罗[a]，并制造了大量兵器[b]和盾牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米罗”或译“台地”、“填土工程”，可能是耶路撒冷的一处加固填土或支撑结构。
    reason: lexical_alternative
  - marker: b
    text: “兵器”或译“投射兵器”、“飞镖”或“标枪”；希伯来语所指比某一种具体武器更宽泛。
    reason: lexical_alternative
  - marker: c
    text: 本句希伯来语十分简略；或译“又在城墙上修建城楼”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: 他振作起来
  rationale: 该词是חזק的反身词干，表示希西家使自己刚强、振作并果断采取防御行动；此译保留反身意味，同时符合现代汉语表达。
- source_word: וַיִּבֶן אֶת כָּל הַחוֹמָה הַפְּרוּצָה
  choice: 重修所有破损的城墙
  rationale: בנה在此指修复、重建防御工事；הַפְּרוּצָה表示城墙已有破口或损坏。“重修所有破损的城墙”准确而自然。
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: 又把城墙加高到城楼处
  rationale: 希伯来语句式简略，宾语可由上文的城墙补出；此译采用“把城墙加高到城楼处”的理解，同时以脚注保留“在墙上修建城楼”的另一种可能。
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: 他还在城墙外另筑一道墙
  rationale: לַחוּצָה表示在外面；汉语补出“城墙”作为方位参照和“筑”作为承接上文的动词，使意思清楚而不改变原意。
- source_word: וַיְחַזֵּק אֶת הַמִּלּוֹא עִיר דָּוִיד
  choice: 加固大卫城的米罗
  rationale: מִלּוֹא是与耶路撒冷有关、具体所指仍有争议的建筑或地名。正文音译为“米罗”可避免假定其精确结构；“加固”符合防御工事的语境。
- source_word: שֶׁלַח
  choice: 兵器
  rationale: 该名词可泛指武器，尤其可能指投射武器；“兵器”不把意义不必要地限定为某一种具体武器。
- source_word: לָרֹב
  choice: 大量
  rationale: 该表达表示数量众多；“大量”是简洁自然的现代汉语。
- source_word: וּמָגִנִּים
  choice: 和盾牌
  rationale: מָגֵן通常指盾牌；采用现代汉语通用名称，不作过细分类。
