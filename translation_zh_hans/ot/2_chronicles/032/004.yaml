  text: וַ/יִּקָּבְצ֣וּ עַם רָ֔ב וַֽ/יִּסְתְּמוּ֙ אֶת כָּל הַ/מַּעְיָנ֔וֹת וְ/אֶת הַ/נַּ֛חַל הַ/שּׁוֹטֵ֥ף בְּ/תוֹךְ הָ/אָ֖רֶץ לֵ/אמֹ֑ר לָ֤/מָּה יָב֨וֹאוּ֙ מַלְכֵ֣י אַשּׁ֔וּר וּ/מָצְא֖וּ מַ֥יִם רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: zh_hans
  text: 于是，许多人聚集起来，堵住所有泉眼和那条流经境内的溪流[a]，说：“为什么要让亚述诸王[b]前来，找到充足的水呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那条流经境内的水道（河谷）”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“亚述诸王”。这里的复数可能泛指亚述的王权或王朝；有些译本根据当时的历史处境译作单数“亚述王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: 许多人聚集起来
  rationale: נפעל形式表示聚集或被召集；结合上下文译作主动而自然的“聚集起来”。עַם רָב在此指人数众多的民众，并非特指某一民族。
- source_word: וַיִּסְתְּמוּ
  choice: 堵住
  rationale: 该动词在水源语境中表示封堵、阻塞；“堵住”准确且符合现代汉语习惯。
- source_word: כָּל הַמַּעְיָנוֹת
  choice: 所有泉眼
  rationale: מַעְיָן指泉源或泉眼；“泉眼”清楚表达天然水源的源头。
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: 那条流经……的溪流
  rationale: נַחַל可指溪流、河谷或季节性水道；与表示流动的分词הַשּׁוֹטֵף连用时，正文译作“溪流”最自然，同时用脚注保留“水道”的可能。
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: 流经境内
  rationale: 该短语表示水流位于并穿行于这片地域之中；“境内”简洁自然，不把הָאָרֶץ过度具体化为某个已明言的国家。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来文引出直接引语的常用话语标记。
- source_word: לָמָּה יָבֹאוּ
  choice: 为什么要让……前来
  rationale: 此处是带有阻止意图的反问；“为什么要让”自然传达商议和目的意味。
- source_word: מַלְכֵי אַשּׁוּר
  choice: 亚述诸王
  rationale: 原文为复数“亚述的众王”；译作“亚述诸王”保留其数的形式及可能指王权或王朝的含义，不按当前历史场景擅自改成单数。
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: 找到充足的水
  rationale: מַיִם רַבִּים在此强调水量供应充裕；“充足的水”符合围城备战的实际语境。
theological_decisions:
- issue: “亚述诸王”的复数表达
  choice: 保留复数，译为“亚述诸王”
  alternative: 按眼前历史人物译为单数“亚述王”
  rationale: 希伯来文明确使用复数。它可能泛指亚述王权、王朝或随军诸王；正文保留这种张力，避免根据历史背景替原文消除歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“泉眼”“溪流”“境内”等词为普通读者熟悉，同时保留地理语义；反问句用“为什么要让……呢”体现备战决策中的阻止意图。脚注标记按其实际所注释的词语放置。
