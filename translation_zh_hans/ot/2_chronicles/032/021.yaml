revisions:
- from: 耶和华差遣一位天使，把亚述王营中所有英勇的战士、统帅和将领全都除灭了。于是，亚述王满面羞愧地回到自己的国。他进了自己神明的庙，他亲生的几个儿子就在那里用刀杀了他。[a]
  to: 耶和华差遣一位天使，把亚述王营中所有英勇的战士、统帅和将领全都除灭了。于是，亚述王满面羞愧地回到自己的国土。他进了他所信奉的神的庙宇，他亲生的儿子们就在那里用刀杀了他。[a]
  rationale: 作两项低风险精确化修订：以单数、所属明确的“他所信奉的神”对应“他的神”，并以“亲生的儿子们”取代含有额外数量暗示的“几个儿子”。同时将“自己的国”调整为“自己的国土”，更贴近“他的地／土地”的原文用语。其余叙事结构、军事称谓及脚注锚点均予保留。
