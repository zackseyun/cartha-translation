  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ מַלְאָ֔ךְ וַ/יַּכְחֵ֞ד כָּל גִּבּ֥וֹר חַ֨יִל֙ וְ/נָגִ֣יד וְ/שָׂ֔ר בְּ/מַחֲנֵ֖ה מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּשָׁב֩ בְּ/בֹ֨שֶׁת פָּנִ֜ים לְ/אַרְצ֗/וֹ וַ/יָּבֹא֙ בֵּ֣ית אֱלֹהָ֔י/ו ו/מ/יציא/ו מֵעָ֔י/ו שָׁ֖ם הִפִּילֻ֥/הוּ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: zh_hans
  text: 耶和华差遣一位天使，把亚述王营中所有英勇的战士、统帅和将领全都除灭了。于是，亚述王满面羞愧地回到自己的国土。他进了他所信奉的神的庙宇，他亲生的儿子们就在那里用刀杀了他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他亲生的儿子们”原文直译为“从他身体出来的人”；这是指亲生后裔的表达。参列王纪下19:37，其平行记载指明他们是他的儿子。
    reason: 保留原文的身体意象和复数表达，并说明正文采用“儿子们”的依据；避免“几个”所带来的数量暗示。
lexical_decisions:
- source_word: מַלְאָךְ
  choice: 一位天使
  rationale: 该词可指使者或天使；这里施行超自然审判，译作“天使”符合语境，也保留不定指表达。
- source_word: וַיַּכְחֵד
  choice: 全都除灭了
  rationale: 该动词表达彻底消灭；配合כָּל，译为“全都除灭”准确而有力度。
- source_word: גִּבּוֹר חַיִל
  choice: 英勇的战士
  rationale: 此搭配在军事语境中指勇猛有力的战士。
- source_word: נָגִיד וְשָׂר
  choice: 统帅和将领
  rationale: 两词均指具有领导或军事权位者；用两个有区别但不过度精细化的现代军事称谓保留并列关系。
- source_word: בְּבֹשֶׁת פָּנִים
  choice: 满面羞愧地
  rationale: 直译为“带着脸面的羞耻”；此汉语表达自然地保留公开蒙羞之意。
- source_word: בֵּית אֱלֹהָיו
  choice: 自己神明的庙
  rationale: 此处指亚述王所敬拜之神的庙宇；“神明”与“庙”避免让普通读者误解为耶和华的圣殿。
- source_word: מֵעָיו
  choice: 他亲生的几个儿子
  rationale: 字面为“从他内脏而出的”，是指亲生后裔的希伯来表达；结合列王纪下19:37的平行记载，明确为儿子。
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: 用刀杀了他
  rationale: 字面为“使他倒在刀下”，在此明确表示以利刃击杀；现代汉语用“用刀杀了”清楚自然。
theological_decisions:
- issue: 神的名称יהוה
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确指出行动者是以色列的神，而非泛称。
- issue: “从他身体出来的人”的身份
  choice: 正文译为“他亲生的几个儿子”，并以脚注交代字面表达
  alternative: 从他身体出来的一些人
  rationale: 原文成语明确表达血缘后裔，平行经文进一步说明是儿子；正文采用可理解的所指，同时在脚注保留原文形象。
- issue: 天使与除灭行动的关系
  choice: 天使执行耶和华差遣下的审判
  alternative: 将“使者”理解为普通人间使者
  rationale: 叙事将大规模除灭归于耶和华所差者，历代志及其平行传统支持“天使”的理解，不额外说明具体方式或人数。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。句式保持叙事推进和审判力度；对古代官衔不过度技术化，对异教敬拜场所译作“神明的庙”，以免产生指涉混淆。
