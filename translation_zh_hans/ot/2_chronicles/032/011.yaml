base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: zh_hans
  text: 希西家岂不是在误导你们[a]，要使你们因饥荒和干渴而死，说：“雅威——我们的上帝——必救我们脱离亚述王的手”吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欺骗你们”或“诱使你们”。这个希伯来语动词可以表示使人走偏，或劝人接受错误的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂不是
  rationale: 保留预期听者赞同的反问语气，也传达说话者的指控意味。
- source_word: מַסִּית
  choice: 误导
  rationale: 该使役分词表示使人偏离或错误地受劝服；“误导”既自然，又不把词义过度限定为蓄意欺骗或煽动。
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: 要把你们交出去，使你们……而死
  rationale: “交出去”保留 נתן 将人置于某种结局之下的敌对意味；补出“使”令汉语关系清楚。
- source_word: בְּרָעָב וּבְצָמָא
  choice: 因饥荒和干渴
  rationale: 围城语境下 רָעָב 指粮食断绝所造成的饥荒；“因……而死”自然表达希伯来语介词所标明的死因。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译直接呈现四字神名，不用头衔替代专名。
- source_word: יַצִּילֵנוּ
  choice: 必救我们脱离
  rationale: 准确表达 נצל 使役式在军事威胁中“解救、救出”的意义，并与 מִכַּף 自然衔接。
- source_word: מִכַּף מֶלֶךְ אַשּׁוּר
  choice: 脱离亚述王的手
  rationale: 保留“从……手中”的希伯来语权势隐喻，同时采用自然的现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留专名性质，而不以称号代替。
- issue: 希西家之话的叙事身份
  choice: 保留为敌方使者所转述的宣称
  alternative: 把这句话直接处理为叙述者的神学断言
  rationale: 本节是敌方言论中的引语；直译其内容而不替说话者判定该宣称的真假，保留原有修辞和神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“岂不是”保留反问的攻击性；“饥荒和干渴”贴合围城处境；引语层次清楚，并保留原文神名。
