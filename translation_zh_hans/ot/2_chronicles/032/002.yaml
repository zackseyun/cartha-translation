  text: When Hezekiah saw that Sennacherib had come and that his purpose was to make war against Jerusalem,[a]
translation:
  language: zh_hans
  text: 希西家看见西拿基立已经来到，并且决意要攻打耶路撒冷，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他的脸转向与耶路撒冷交战”；这是表示意向坚定的说法。
    reason: 保留וּפָנָיו לַמִּלְחָמָה这一希伯来语表达的字面形象，同时说明正文“决意”的依据。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 见
  rationale: ראה在连续叙事形式中基本义为“看见”；此处也包含察知眼前局势的意味。“见”既保留希伯来叙事风格，也符合庄重自然的现代汉语。
- source_word: כִּי
  choice: （引出“见”的内容）
  rationale: 此处כִּי引出希西家所见的事实，汉语可直接用“见……已经……”表达，无须另译“那”。
- source_word: בָא
  choice: 已经来了
  rationale: 完成式表示西拿基立来到这一事实在希西家察觉局势时已经成立；“已经来了”清楚表达其先成状态。
- source_word: סַנְחֵרִיב
  choice: 西拿基立
  rationale: 采用现代中文圣经传统中通行且易辨识的人名音译。
- source_word: וּפָנָיו
  choice: 并且定意
  rationale: 字面为“他的脸（朝向）”，与לַמִּלְחָמָה连用表达意向或决心。正文按汉语习惯译出其惯用义，字面形式在脚注保留。
- source_word: לַמִּלְחָמָה
  choice: 要攻打
  rationale: מִלְחָמָה意为战争或战斗；结合“他的脸朝向……”这一意向性表达，译为“要攻打”自然传达军事行动的目标。
- source_word: עַל
  choice: 攻打
  rationale: עַל在战争语境中表示敌对方向，汉语将其意义融入动词“攻打”。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文通行地名译法。
