  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: zh_hans
  text: 同样，当巴比伦众首领派使者来见他，查问这地所发生的神迹[a]时，上帝离开了他，为要试验他，好知道他心里的一切[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神迹”也可译作“奇事”或“征兆”。
    reason: lexical_alternative
  - marker: b
    text: 这里保留原文“知道他心里的一切”的说法，以呈现经文本身的张力；也有人理解为“显明”或“揭露”他心里的一切。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: 同样
  rationale: 承接上文并引出另一个相关情形，保留连接和类比意味；比生硬的“并且如此”更符合现代汉语。
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל הַמְשַׁלְּחִים עָלָיו
  choice: 在巴比伦众首领派使者来见希西家……这件事上
  rationale: מְלִיצֵי在此指居间传话或履行外交使命的人，即“使者”。句法虽紧凑且略有歧义，整体意思是巴比伦首领差遣使者前来；用“在……这件事上”也自然表达前置介词ב所标示的情境。
- source_word: לִדְרֹשׁ
  choice: 查问
  rationale: דרש在外交语境中不只是随口询问，也含查询、探问之意；“查问”简洁而自然。
- source_word: הַמּוֹפֵת
  choice: 神迹
  rationale: מוֹפֵת可指具有征兆意义的奇事、异象或奇迹。上下文所说的是引起巴比伦方面关注的非凡事件；“神迹”符合现代中文圣经语体，其他可能译法列入脚注。
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: 那发生在这地的
  rationale: 将היה按事件义译为“发生”，并以“这地”表达叙事者所指的本地，语意比直译“在地上的”清楚。
- source_word: עֲזָבוֹ
  choice: 离开了他
  rationale: עזב可译“离开、撇下、离弃”。此处采用语气较中性的“离开”，避免擅自强化为永久弃绝，同时保留叙事张力。
- source_word: לְנַסּוֹתוֹ
  choice: 为要试验他
  rationale: נסה表示试验、考验；“试验”直接保留其评估和显露实情的含义。
- source_word: לָדַעַת כָּל בִּלְבָבוֹ
  choice: 好知道他心里的一切
  rationale: 直译目的结构和“心里”的希伯来习语，不把“知道”解释性改写为“显明”或“揭露”，从而保留原文有关上帝试验与知道的神学张力。
theological_decisions:
- issue: 上帝的试验与“知道”
  choice: 上帝离开了他，为要试验他，好知道他心里的一切
  alternative: 上帝离开他，为要试验他，好显明／揭露他心里的一切
  rationale: 原文明确使用“离开”“试验”和“知道”。正文按原文保留这些措辞，不以解释性译法消解它对上帝知识所形成的叙事张力；脚注说明另一种理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“同样，在……这件事上”保留原文与上文的衔接；明确补出“希西家”以避免连续代词造成指代不清，但没有增添新的解释。脚注标记紧随其所说明的词句。
