base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: zh_hans
  text: 约沙法其余的事，自始至终，都记在哈拿尼的儿子耶户的记述中[a]；这记述收录在《以色列诸王记》里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记述”也可译作“记载”或“记录”；希伯来语直译为“哈拿尼的儿子耶户的话”。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来语直译近于“他使（某物）上到《以色列诸王记》之上”；宾语未明说，句法也有困难，可能表示耶户的记述被编入或收录在这部较大的王室文献中。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: 约沙法其余的事
  rationale: 王朝史总结语中的 דִּבְרֵי 泛指君王的事迹、事务，而不只是言语；“其余的事”简明自然，并保留 וְיֶתֶר 的承接作用。
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: 自始至终
  rationale: 这一对词构成首尾兼举的表达，涵盖约沙法全部时期的事迹；“自始至终”比直译“先前的和后来的”更符合现代汉语，同时保留整体范围。
- source_word: הִנָּם כְּתוּבִים
  choice: 都记在
  rationale: כְּתוּבִים 本义为“写着”；结合史料引证语境译为“记在”自然准确。הִנָּם 的强调作用由“都”及整句语序体现，避免生硬插入“看哪”。
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: 在哈拿尼的儿子耶户的记述中
  rationale: 此处 דִּבְרֵי 指与耶户有关的书面材料；“记述”既表达文献性质，又不武断认定其为特定体裁的“编年史”。
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: 这记述已收录在《以色列诸王记》里
  rationale: 希伯来语字面近于“他使之上到《以色列诸王记》之上”，句法和习语含义均有难处；“已收录在”自然表达该记述与较大王室文献之间的关系，同时以脚注保留原文形式及其他理解的可能。
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王记》
  rationale: סֵפֶר 是书卷或文献；书名号体现这里的文献题名性质，“以色列诸王”忠实保留原构词关系。
