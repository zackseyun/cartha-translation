  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: zh_hans
  text: 然而，丘坛仍未废除，百姓也仍未立定心志，归向他们列祖的上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未立定心志，归向”或译“还没有预备好自己的心，归向他们列祖的上帝”。
    reason: 希伯来语 הֵכִינוּ לְבָבָם 可指预备、坚定或使内心定向；此处 לְ 表示心所朝向的对象。
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 承接上一节对约沙法的正面评价，转而指出仍然存在的缺失；“然而”自然地保留让步和转折语气。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: 这是希伯来圣经中对此类祭祀场所的传统而准确的称呼，既保留历史宗教背景，也不额外断定每一处丘坛的具体性质。
- source_word: לֹא סָרוּ
  choice: 还没有废除
  rationale: 原文直译为“没有离去”，在本语境中指丘坛仍然存在；汉语用“没有废除”更自然，并准确表达改革尚未完成。
- source_word: וְעוֹד
  choice: 也仍
  rationale: 表示先前的状况持续未改；“仍”保留延续意味，“也”连接外在丘坛与百姓内心这两方面的缺失。
- source_word: הָעָם
  choice: 百姓
  rationale: 自然表达这里作为整体的民众。
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: 未立定心志
  rationale: 使役式 כון 与“心”连用，可指预备、坚定或定向内心。“立定心志”兼顾内在意愿与坚定取向，又不把含义缩减为情绪。
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: 归向他们祖先的上帝
  rationale: 介词 ל 表示内心所朝向的对象；“归向”在现代汉语中自然地传达这种方向性，“祖先的上帝”保留盟约历史关联。
theological_decisions:
- issue: 百姓缺失的性质
  choice: 译文同时呈现外在宗教改革未完成，以及百姓内心尚未坚定归向祖先的上帝。
  alternative: 可理解为百姓尚未预备内心来敬拜，或尚未坚定地专一敬拜。
  rationale: 原文把丘坛仍存与“心”尚未预备或坚定并列。译文不把这缺失仅解释为情绪上的未准备，也不引入后来的教派性范畴，而保留内在取向与盟约忠诚的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“丘坛”保留经文的历史宗教术语；“立定心志，归向”以自然汉语表达内心坚定并朝向上帝的含义。脚注标记已置于正文相关句末。
