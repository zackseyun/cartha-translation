base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: zh_hans
  text: 此后，摩押人和亚扪人，连同一些米乌尼人[a]，前来与约沙法交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“一些亚扪人”。许多解释者根据上下文和古代译本，认为这里指米乌尼人或另一个类似的结盟族群，而不是再次提到亚扪人。
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 此后
  rationale: 这是叙事中的时间转换语；译作“此后”既保留先后关系，也避免生硬照译“事情发生在这以后”。
- source_word: בְּנֵי מוֹאָב
  choice: 摩押人
  rationale: 这里是族群称谓，现代汉语自然表达为“摩押人”，不直译为“摩押之子”。
- source_word: בְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 这里是族群称谓；“亚扪人”准确且符合现代中文圣经地名、人名惯例。
- source_word: וְעִמָּהֶם
  choice: 连同
  rationale: 表明后述群体与摩押人和亚扪人一同前来；“连同”简洁自然。
- source_word: מֵהָעַמּוֹנִים
  choice: 一些米乌尼人
  rationale: 马所拉文本按现有读法是“一些亚扪人”，会与前面的亚扪人重复；结合上下文和古译本证据，不少解释将其理解为另一个结盟族群，即米乌尼人。正文采用较可能的语境含义，并以脚注保留希伯来文本的读法。
- source_word: עַל יְהוֹשָׁפָט לַמִּלְחָמָה
  choice: 前来与约沙法交战
  rationale: 在军事语境中，עַל 表示敌对方向，לַמִּלְחָמָה 表示作战目的；合译为“前来与……交战”自然且不增添具体战术含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“此后”简洁承接上文；“前来与……交战”保留军事目的。族名采用简体中文常见译名。
