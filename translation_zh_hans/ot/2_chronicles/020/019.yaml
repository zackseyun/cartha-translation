  text: וַ/יָּקֻ֧מוּ הַ/לְוִיִּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים וּ/מִן בְּנֵ֣י הַ/קָּרְחִ֑ים לְ/הַלֵּ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בְּ/ק֥וֹל גָּד֖וֹל לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: zh_hans
  text: 于是，利未人中哥辖子孙和可拉子孙的人站起来，用极大的声音赞美雅威——以色列的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用极大的声音”：原文在“大声”后另有表示加强程度的词，可译为“极其大声”或“非常响亮”。
    reason: 说明句末程度加强语的作用，避免将其误解为“向上”的空间意义。
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 站起来
  rationale: קום的Qal叙事形式表示起身这一具体动作；“站起来”自然清楚，也保留公开起立赞美的画面。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经语境中通行的族群称谓。
- source_word: מִן בְּנֵי הַקְּהָתִים וּמִן בְּנֵי הַקָּרְחִים
  choice: 利未人中哥辖族和可拉族的子孙
  rationale: 保留介词“从……中”和בני所表达的后裔关系，同时用“族”自然呈现两个宗族名称。
- source_word: לְהַלֵּל
  choice: 赞美
  rationale: הלל的不定式在此表示起身的目的；原文没有明确使用“歌唱”一词，因此不增译为“歌唱赞美”。
- source_word: לַיהוָה
  choice: 赞美雅威
  rationale: 将四字神名יהוה音译为“雅威”，并按现代中文语序把介词所标示的对象直接置于“赞美”之后。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接呈现原文的属格结构，并作为“雅威”的同位说明。
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: 极其高声
  rationale: בְּקוֹל גָּדוֹל表示“大声”，句末לְמָעְלָה在此最自然地作加强语气理解；“极其高声”简洁传达音量受到强化。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”保留其专名性质，不以称号取代，也避免把本节没有明说的解释加入正文。
- issue: 赞美是否特指歌唱
  choice: 仅译“赞美”
  alternative: 歌唱赞美
  rationale: הלל本身可涵盖歌唱式赞美，但本节没有另用“唱”这一动词；保留较宽泛的表达，可避免无根据地限定其形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接叙事，“站起来”保留具体动作；破折号清楚标示“以色列的神”是对“雅威”的同位说明。
