base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: zh_hans
  text: 明天你们要下去迎战他们。看，他们正从洗斯的上坡路上来；你们会在耶鲁伊勒旷野前面的溪谷[a]尽头找到他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪谷”所译的希伯来词可指沟谷、峡谷，或季节性的水道。
    reason: 说明 נַחַל 的地貌与水文词义范围，并将标记锚定于对应中文词语。
lexical_decisions:
- source_word: מָחָר
  choice: 明天
  rationale: 直接表达时间副词的通常含义，不增添“早晨”等原文没有的信息。
- source_word: רְדוּ עֲלֵיהֶם
  choice: 下去迎战他们
  rationale: 保留“下去”的地势方向，并按军事语境表达介词短语的敌对含义；“迎战”比单纯“到他们那里去”更准确自然。
- source_word: הִנָּם
  choice: 看哪
  rationale: 保留提示听者注意下文的指示功能；“看哪”庄重且为现代读者熟悉。
- source_word: עֹלִים
  choice: 正……上来
  rationale: 分词表示正在发生或即将发生的上行移动；“上来”自然体现说话者所处视角。
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: 从洗斯坡上来
  rationale: מַעֲלֶה 指上坡路或上行通道；汉语用“洗斯坡”简洁保留地形意义，并将专名 הַצִּיץ 音译为“洗斯”。
- source_word: וּמְצָאתֶם אֹתָם
  choice: 你们会……找到他们
  rationale: 依命令之后的结果或将来意义直译，符合上下文。
- source_word: בְּסוֹף הַנַּחַל
  choice: 在溪谷的尽头
  rationale: נַחַל 可指溪谷、沟谷或季节性水道；“溪谷”兼顾谷地和水道概念，避免“溪流”使人误以为必有常流水。
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: 耶鲁伊勒旷野前面
  rationale: פְּנֵי 在空间表达中指“前面”；מִדְבָּר 译作“旷野”，比“沙漠”更符合该词可指荒野或干旱草原的范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。地名按普通话音译；保留军事行动、地势方向与地理定位。原文没有必须借脚注处理的文本异读；英文咨询层所列脚注内容实际说明的是“wadi/נחל”，但其脚注标记疑误置于“Look”之后，因此中文正文不沿用该错位标记。
