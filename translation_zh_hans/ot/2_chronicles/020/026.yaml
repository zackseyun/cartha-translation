  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: zh_hans
  text: 第四天，他们聚集在比拉迦谷[a]，因为他们在那里称颂雅威。因此，他们给那地方起名叫比拉迦谷，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比拉迦”意为“祝福”，与本节“称颂”一词在希伯来语中同源。
    reason: 说明地名含义，并呈现 בְּרָכָה 与本节“称颂”之间的希伯来语双关。
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: 聚集
  rationale: 该词的尼法勒形在此表示众人聚到一起；“聚集”自然、准确，也不额外指定是谁召集他们。
- source_word: עֵמֶק בְּרָכָה
  choice: 比拉迦谷
  rationale: 将作为地名的 בְּרָכָה 音译为“比拉迦”，并把 עֵמֶק 译为“谷”；其“福分／祝福”之义由脚注说明，以保留命名中的双关。
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: 因为他们在那里称颂雅威
  rationale: כִּי 在此引出命名的原因；בֵּרֲכוּ 以“称颂”表达人在以色列上帝面前所作的祝颂，同时避免现代汉语中“祝福上帝”可能造成的误解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，而不以称号替代。
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: 他们给那地方起名叫
  rationale: 这是希伯来语的命名表达；译成现代汉语惯用的“给……起名叫”，既准确又不生硬。
- source_word: עַד הַיּוֹם
  choice: 直到今日
  rationale: 保留该希伯来语惯用语，表示这个名称一直沿用到叙述者所处的时代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名；“雅威”较贴近通常重构的希伯来语读音，并避免用“主”等称号取代专名。
- issue: בֵּרֲכוּ אֶת יְהוָה 的表达
  choice: 称颂雅威
  alternative: 祝福雅威
  rationale: 原文动词确属“祝福／称颂”词根；在上帝作为受词时，“称颂”是自然且庄重的现代汉语，同时通过地名及脚注保留与 בְּרָכָה 的词源联系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。地名按专名音译，正文中的因果关系和命名公式清楚呈现；脚注补足汉语音译无法直接显示的希伯来语文字游戏。
