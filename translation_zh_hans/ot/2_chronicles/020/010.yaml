  text: וְ/עַתָּ֡ה הִנֵּה֩ בְנֵֽי עַמּ֨וֹן וּ/מוֹאָ֜ב וְ/הַר שֵׂעִ֗יר אֲ֠שֶׁר לֹֽא נָתַ֤תָּה לְ/יִשְׂרָאֵל֙ לָ/ב֣וֹא בָ/הֶ֔ם בְּ/בֹאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם כִּ֛י סָ֥רוּ מֵ/עֲלֵי/הֶ֖ם וְ/לֹ֥א הִשְׁמִידֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: zh_hans
  text: 如今，看哪，亚扪人、摩押人和西珥山一带的人[a]，就是以色列人从埃及地出来时，你不许以色列人攻入他们的境内[b]的那些人；以色列人转离了他们，没有灭绝他们——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“亚扪的子孙、摩押和西珥山”；这里指亚扪人、摩押人以及西珥山一带的人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“你没有让以色列进入他们”；按这里的语境，意思是上帝不许以色列攻击或进入他们的领地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: 如今，看哪
  rationale: “如今”承接前文祷告并转向当前处境；“看哪”保留 הִנֵּה 的指示和强调语气，符合庄重祷告的语体。
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: 亚扪人、摩押人和西珥山一带的人
  rationale: בְנֵי עַמּוֹן 是“亚扪人”的民族称谓；上下文所指是来自摩押和西珥的敌对群体，因此中文以并列的人群名称表达，同时用脚注保留希伯来文表层形式的不整齐之处。
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: 你不许他们攻入其境的那些人
  rationale: “给以色列进入他们”在此是许可结构，结合旷野行程的军事语境，表示不准以色列攻入这些族群的领地。“攻入其境”既交代敌对方向，又避免把意思强化为全面侵略。
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: 以色列人从埃及地出来时
  rationale: 时间性不定式结构自然译为“……时”；明确主语“以色列人”，避免中文代词连续出现所造成的歧义。
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: 以色列人绕道离开了他们
  rationale: 动词 סור 在此回指以色列避开这些民族、改变行进路线；“绕道离开”比单纯“转离”更清楚地呈现叙事背景。
- source_word: וְלֹא הִשְׁמִידוּם
  choice: 没有灭绝他们
  rationale: הִשְׁמִיד 是使役形，指战争中的彻底毁灭；“灭绝”保留其力度，不弱化为一般的“打败”或“伤害”。
theological_decisions:
- issue: 祷告中对上帝的第二人称称呼
  choice: 你不许他们攻入其境
  alternative: 耶和华不许他们攻入其境
  rationale: 希伯来文处于直接向上帝祷告的语境，并使用第二人称；保留“你”可维持祷告的直接性，不额外加入原文此处没有的神名。
- issue: 上帝禁令的具体性质
  choice: 不许……攻入其境
  alternative: 不许……进入他们中间
  rationale: 原文“进入他们”本身较简略，但所回顾的是以色列没有侵犯相关民族领地的事件。正文表达语境中的军事方向，脚注同时保存原文较直译的形式，避免把禁令扩展为禁止任何接触。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“看哪”保留原文的强调色彩；句末用破折号表示本节语法和论述尚未结束，承接下一节。正文中的两个脚注标记均紧随其所解释的内容。
