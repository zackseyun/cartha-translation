  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: zh_hans
  text: 说：“耶和华——我们列祖的神啊，你不是天上的神吗？你不是统管万国的国度吗？能力和大能都在你手中，没有谁能抵挡你。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有人能与你抗衡。”
    reason: 保留 לְהִתְיַצֵּב 在此语境中“站出来抗衡、抵挡”的含义，并提供自然的中文替代表达。
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 说
  rationale: 承接上文叙事；中文无需在本节重复已经明确的主语，也不必机械译出连接词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译四字神名，采用现代简体中文圣经语境中最通行、最易辨认的形式。
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: 我们列祖的神
  rationale: 保留“父辈”这一阳性复数及其盟约历史色彩；“列祖”比“父亲们”更自然庄重。
- source_word: הֲלֹא אַתָּה הוּא אֱלֹהִים בַּשָּׁמַיִם
  choice: 你不是天上的神吗
  rationale: 保留 הֲלֹא 所引入、期待肯定回答的反问语气；“天上的神”自然且不额外限定其含义。
- source_word: מוֹשֵׁל בְּכֹל מַמְלְכוֹת הַגּוֹיִם
  choice: 统管列国万邦
  rationale: מוֹשֵׁל 表持续掌权；“列国万邦”自然表达所有民族国家的诸王国，也保留宏阔祷告语体。
- source_word: וּבְיָדְךָ
  choice: 在你手中
  rationale: 保留希伯来文以“手”表达实际掌控和能力的意象。
- source_word: כֹּחַ וּגְבוּרָה
  choice: 能力和大能
  rationale: 分别表达力量、施行能力与强盛威力，保留并列强化结构。
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: 没有谁能抵挡你
  rationale: 按语境将 התיצב 理解为站立抗衡；译文清楚表达无人能够与神对抗。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号；正文保留专名。现代普通话简体中文读者最熟悉“耶和华”，且不将其泛化为“主”。
- issue: אֲבֹתֵינוּ 的性别与盟约表达
  choice: 我们列祖的神
  alternative: 我们祖先的神
  rationale: “列祖”保留原文阳性复数及历代父辈的盟约历史色彩，同时符合庄重、自然的汉语表达。
- issue: 末句是否表达敌对含义
  choice: 没有谁能抵挡你
  alternative: 没有谁能在你面前站立得住
  rationale: 语境表明 התיצב 是与神对抗、抗衡；“抵挡”传达该含义，而备选译法更贴近站立意象，却可能被理解为单纯处于神面前。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“耶和华—我们列祖的神啊”以破折号标示同位呼语；两个反问保留原文的宣认力度。正文唯一脚注标记[a]已在相关句末出现。
