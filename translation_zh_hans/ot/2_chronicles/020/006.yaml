  source_fidelity: 正文总体准确传达了祷告的呼语、两层肯定式反问、对万国政权的统治，以及神手中的能力和威力。末句“没有谁能抵挡你”符合语境中“站立以抗衡”的意思。惟“列国万邦”偏向泛指各国各民，未清楚表达 מַמְלְכוֹת（王国、国度）；改为“万国的列邦”不自然，宜以“万国的国度”明确保留该名词。
