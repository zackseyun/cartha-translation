base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: zh_hans
  text: 我们的上帝啊，难道不是你把这地的居民从你的子民以色列面前赶出去，又把这地永远赐给爱你的亚伯拉罕[a]的后裔吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的朋友亚伯拉罕”。
    reason: 原文直译为“爱你的亚伯拉罕”；在相关经文和关系性称号的语境中，也可表达为“你的朋友亚伯拉罕”。
lexical_decisions:
- source_word: הֲלֹא
  choice: 难道不是……吗
  rationale: 引出期待肯定回答的反问；这一现代汉语句式自然保留了原文的修辞力量。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝啊
  rationale: 这是祷告中的直接称呼；句末语气词“啊”清楚表达呼格，又保持庄重自然。
- source_word: הוֹרַשְׁתָּ
  choice: 赶出去
  rationale: 使役形在这里指使原住民失去土地并离开；“赶出去”清楚保留征服语境，比“剥夺产业”更符合普通现代汉语。
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: 这地的居民
  rationale: 准确表达“住在这地的人”，简洁自然。
- source_word: מִלִּפְנֵי
  choice: 从……面前
  rationale: 保留希伯来语的空间意象，即这些居民在以色列人来到时被从他们面前赶走。
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: 你子民以色列
  rationale: 保留“你的子民”这一盟约性称谓，并将“以色列”作为同位名称。
- source_word: וַתִּתְּנָהּ
  choice: 又把这地……赐给
  rationale: 代词所指是“这地”；在汉语中明说“这地”可避免指代含混。“赐给”适合上帝施予土地的语境。
- source_word: לְזֶרַע אַבְרָהָם
  choice: 亚伯拉罕的后裔
  rationale: זֶרַע是集合单数；现代汉语“后裔”既自然，也能整体指一族后代。
- source_word: אֹהַבְךָ
  choice: 爱你的
  rationale: 按主动分词的直接语义译作“爱你的”，保留亚伯拉罕爱上帝这一方向；上下文中也可理解为关系性称号，故脚注列出“你的朋友”。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表达土地赐予的长久、持续效力，符合应许语境，同时不额外界定其神学范围。
theological_decisions:
- issue: 亚伯拉罕称谓 אֹהַבְךָ 的翻译
  choice: 爱你的亚伯拉罕
  alternative: 你的朋友亚伯拉罕
  rationale: 希伯来语为主动分词，直接表示“爱你的人”。“你的朋友”符合相关经文形成的关系性称号，但会把原文的主动语义解释化，因此正文采用较贴近原文的译法，并在脚注保留传统而自然的替代译法。
- issue: לְעוֹלָם 所表达的持续性
  choice: 永远赐给
  alternative: 赐给……作永远的产业
  rationale: 原文只明说“赐给”和“永远”，没有出现“产业”一词；正文不增补所有权术语，从而保留原句简洁而有张力的应许表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“难道不是……吗”呈现祷告中的反问语气；“赶出去”“居民”“后裔”等用词便于普通读者理解，同时避免引入原文没有明说的教派性或神学性限定。
