base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: zh_hans
  text: 约沙法作王统治犹大。他登基时三十五岁，在耶路撒冷作王二十五年。他母亲名叫阿苏巴，是示利希的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: 作王统治
  rationale: מלך在王朝纪事中表示作王、执掌王权；译作“作王统治”既保留君王身份，也明确其治理含义，并与下文年期公式自然衔接。
- source_word: עַל יְהוּדָה
  choice: 统治犹大
  rationale: 介词עַל与מלך连用，标明受其统治的国土或人民；现代汉语以“统治犹大”自然表达。
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: 三十五岁
  rationale: 这是希伯来语标准年龄表达，现代汉语宜直接译为“三十五岁”。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 介词ב加מלך的不定式结构及代词后缀表示他开始作王之时；“登基时”简洁准确地传达即位时点。
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: 作王二十五年
  rationale: 直陈其在位年数；“作王二十五年”符合中文圣经史书的庄重语体，也易于现代读者理解。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 地点成分直接译出，说明其王权中心和在位地点。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 忠实表达母亲姓名公式，同时采用自然的现代汉语语序。
- source_word: עֲזוּבָה
  choice: 阿苏巴
  rationale: 按希伯来语人名音译，并采用简体中文中清楚、自然的形式。
- source_word: בַּת שִׁלְחִי
  choice: 是示利希的女儿
  rationale: בַּת明确表示女儿关系；以完整判断句译出，在现代汉语中更流畅。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。首句用“作王统治”呈现王朝纪事的起始公式，后文用“登基时”和“作王二十五年”避免生硬重复，同时保留原文的即位年龄、在位地点、年数及母系身份资料。无需脚注。
