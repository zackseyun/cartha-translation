base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: zh_hans
  text: 有人来禀报约沙法说：“有一大群人从海的对岸、从亚兰[a]来攻击你。看哪，他们已经到了哈洗逊·他玛，也就是隐·基底。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”是希伯来地名，常译作“叙利亚”；有些古代译本作“以东”。
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיַּגִּידוּ
  choice: 有人来禀报
  rationale: 原文是复数动词，主语未明；用“有人”自然保留不特指的来报者。“禀报”符合向君王报告紧急军情的语境。
- source_word: בָּא עָלֶיךָ
  choice: 来攻击你
  rationale: בָּא 表示来临，עָלֶיךָ 在军事语境中带敌对意味；译为“来攻击你”比直译“来到你之上”自然准确。
- source_word: הָמוֹן רָב
  choice: 一大群人
  rationale: הָמוֹן 指庞大的人群或众多群众；上下文暗示敌军，但原词没有明确限定为正规军队，因此不直接译作“大军”。
- source_word: מֵעֵבֶר לַיָּם
  choice: 从海的对岸
  rationale: 忠实表达“从海那边／越过海而来”的空间意义，同时符合现代汉语习惯。
- source_word: מֵאֲרָם
  choice: 从亚兰
  rationale: 按马所拉文本保留希伯来地名“亚兰”，不以较晚的名称“叙利亚”取代。
- source_word: וְהִנָּם
  choice: 看哪，他们已经到了
  rationale: הִנֵּה 带有引人注意和强调眼前紧迫情势的作用；结合地点补语，译文用“已经到了”自然表达敌众现已身处该地。
- source_word: בְּחַצְצוֹן תָּמָר
  choice: 到了哈洗逊·他玛
  rationale: 音译地名；介词 בְּ 表示身处该地点，汉语用“到了”与前文来袭的动态语境衔接自然。
- source_word: הִיא עֵין גֶּדִי
  choice: 也就是隐·基底
  rationale: 此句将哈洗逊·他玛解释为隐·基底；“也就是”清楚传达同位辨识关系。
theological_decisions: []
