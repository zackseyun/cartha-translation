source:
  edition: WLC
  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: zh_hans
  text: 这场战事不用你们争战。你们要就位，站稳，观看雅威为你们施行的拯救[a]。犹大和耶路撒冷啊，不要害怕，也不要惊惶。明天要出去面对他们；雅威与你们同在[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“解救”；此处的语境是雅威在战事中施行救援，但该词的含义不限于军事解救。
    reason: lexical_alternative
  - marker: b
    text: 或译：“雅威必与你们同在。”希伯来文此句没有明示动词，既可表达当前的同在，也可理解为对次日的应许。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: 这场战斗不用你们争战
  rationale: 原文直译近于“在这事上，争战不在于你们”，语境表明犹大人不必亲自投入战斗；此译自然地传达这一意思，同时保留“争战”的军事语境。
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: 各就各位，站稳
  rationale: 两个连续命令分别强调站到指定位置和坚定站立；“各就各位，站稳”既保留递进，也符合现代汉语表达。
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה
  choice: 观看……雅威所施行的拯救
  rationale: יְשׁוּעָה在本节首先指战场上的解救，但也有较广的“拯救”含义；正文采用“拯救”，脚注保留“解救”的语境性译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，区别于作为称号的“主”。
- source_word: עִמָּכֶם
  choice: 与你们同在
  rationale: עם表达临在与支持；“与你们同在”直接保留原文，并使神的临在成为应许的核心。
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: 明天要出去面对他们
  rationale: לִפְנֵיהֶם字面为“到他们面前”，在军事语境中指走出去面对敌军；此译自然，又没有明确说他们必须交战。
- source_word: וַיהוָה עִמָּכֶם
  choice: 雅威与你们同在
  rationale: 原文为无显式动词的名词句；正文用现在时表达持续的同在，脚注说明也可按上下文理解为面向次日的应许。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用神的专名而非“主”这一称号；正文采用较贴近学界重构发音、且现代汉语可理解的“雅威”，不以称号替代专名。
- issue: יְשׁוּעַת יְהוָה的含义范围
  choice: 雅威所施行的拯救
  alternative: 雅威所施行的解救
  rationale: 当下语境是从敌军手中获救，但该词本身不限于军事救援；“拯救”保留其较宽含义，脚注交代具体语境。
- issue: 末句无动词结构的时间指向
  choice: 雅威与你们同在
  alternative: 雅威必与你们同在
  rationale: 希伯来文没有明示现在或将来的系词。正文保留直接的临在宣告，脚注呈现因“明天”语境而可能具有的将来应许意味。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“各就各位，站稳”保留两个命令的层次；“出去面对他们”维持军事场景，却不与前文“不用争战”冲突。称呼语“犹大和耶路撒冷啊”保留先知对群体的直接呼告。
