  to: 他们清早起来，前往提哥亚的旷野。他们出发时，约沙法站着说：“犹大人和耶路撒冷的居民，请听我说！要信靠雅威[a]你们的神，你们就必站立得稳；要信靠他的先知[b]，你们就必亨通。”
  rationale: 修订仅统一神名的音译，并消除“出去前往”的汉语重复。其余保留原译的公开劝告语体、两次重复的“信靠”，以及“站立得稳／亨通”的结果表达。
