  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: zh_hans
  text: 他们清早起来，前往提哥亚的旷野。他们出发时，约沙法站着说：“犹大人和耶路撒冷的居民，请听我说！要信靠雅威[a]你们的神，你们就必站立得稳；要信靠他的先知[b]，你们就必亨通。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文的神名 יהוה（YHWH）。
    reason: 说明神名的原文性质，并与项目将 YHWH 音译为 Yahweh 的处理一致。
  - marker: b
    text: 原文在“信靠”和“站立得稳”中使用同一词根，形成文字呼应；也可译作：“相信雅威你们的神，你们就必得以坚立；相信他的先知，你们就必顺利。”
    reason: 保留原文 אמן 的同根双关，并呈现“相信／信靠”及“坚立／站稳”的合理译法。
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: 他们清早起来
  rationale: שׁכם 的使役词干在叙事中通常表示早起；“清早起来”自然、明确，并保留时间信息。
- source_word: לְמִדְבַּר תְּקוֹעַ
  choice: 前往提哥亚的旷野
  rationale: מִדְבָּר 指旷野或荒野地带，不必特指沙漠；“提哥亚的旷野”符合地理语境。
- source_word: וּבְצֵאתָם
  choice: 他们出发时
  rationale: 介词加带后缀的不定词结构表达时间背景；此处“出发时”比逐字的“出去时”更符合现代汉语叙事。
- source_word: שְׁמָעוּנִי
  choice: 请听我说
  rationale: 准确表达带第一人称宾语后缀的命令语气；加“请”使公开劝告在现代汉语中自然，但不削弱其命令性质。
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: 要信靠耶和华你们的神
  rationale: אמן 的使役词干与 ב 连用表示相信、倚靠；“信靠”兼顾认信与倚赖，并适合对神的劝勉语境。
- source_word: וְתֵאָמֵנוּ
  choice: 你们就必站立得稳
  rationale: אמן 的被动词干含坚立、稳固之意；此译保留与前句“信靠”之间的词根呼应所形成的双关。
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: 要信靠他的先知
  rationale: 原文重复同一动词以产生修辞效果，因此重复“信靠”，不改用“听从”而缩窄含义。
- source_word: וְהַצְלִיחוּ
  choice: 你们就必亨通
  rationale: צלח 的使役词干在此表示顺利、成功；“亨通”简洁庄重，并适合军事行动前的语境。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用普通中文读者最熟悉且可辨识为专名的“耶和华”，同时以脚注说明这是希伯来文神名，而不是一般称号。
- issue: אמן 在两项劝告中的含义
  choice: 两处均译“信靠”
  alternative: “相信”或第二处译“听从”
  rationale: 重复同一译词能保留原文修辞关联；“信靠”同时传达相信与倚赖，但不把此处强行解释为后期系统神学意义上的“得救之信”。
- issue: אמן 的命令式与被动式之间的文字游戏
  choice: “信靠……站立得稳”
  alternative: “相信……得以坚立”
  rationale: 自然汉语无法完整复制希伯来语同根词游戏；“站立得稳”清楚保留稳固的结果意象，脚注则补明原文的同根呼应。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“清早起来”“出发时”“请听我说”便于普通读者理解；“站立得稳”“亨通”保留公开劝告的经文语体。所有脚注标记均已置于正文相应位置。
