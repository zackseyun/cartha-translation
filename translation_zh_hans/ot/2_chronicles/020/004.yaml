base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: zh_hans
  text: 犹大众人聚集起来，向雅威寻求帮助[a]；他们也从犹大各城来寻求雅威[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从雅威那里寻求。”原文没有明说所求的是什么；按上下文，是向他寻求帮助或解救。
    reason: lexical_alternative
  - marker: b
    text: 原文作“寻求雅威”。这里的句法与前一句“从雅威那里寻求”略有不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: 犹大众人聚集起来
  rationale: 动词的尼法勒形式表示聚集、集合；“犹大”在这里整体指犹大的民众。“犹大众人”使现代汉语读者能自然理解其集合名词用法。
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: 向雅威寻求帮助
  rationale: בקש 表示“寻求”，מן 表示所求之事来自雅威；所求的具体内容在希伯来文中省略，结合危难语境可理解为帮助或解救。正文采用自然汉语表达，并以脚注保留字面结构及其含蓄性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，而不以称号替代专名。
- source_word: גַּם
  choice: 甚至
  rationale: 在第二分句中起强调作用，突出参与者来自犹大各城，范围广泛。
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: 从犹大各城
  rationale: 准确表达来自犹大境内所有城邑的广泛参与；“各城”比逐字的“所有城市”更符合庄重自然的现代汉语。
- source_word: בָּאוּ
  choice: 赶来
  rationale: 基本义为“来”；结合从各城前来聚集的场景，“赶来”自然表现他们有目的地前来，但不额外规定行进方式。
- source_word: לְבַקֵּשׁ אֶת יְהוָה
  choice: 寻求雅威
  rationale: את 标明雅威是直接宾语。译文保留“寻求雅威”这一直接表达，不与前一分句的“向雅威寻求帮助”混同。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用音译以保留经文中的神圣专名，避免用称号“主”取代；“雅威”贴近学界通常重构的读音。
- issue: 是否把两处 בקש 统一翻译
  choice: 分别译为“向雅威寻求帮助”和“寻求雅威”
  alternative: 两处都译为“寻求雅威”；两处都译为“向雅威求助”
  rationale: 原文刻意采用不同结构：第一处是 בקש 加 מן，所求之物隐含为从雅威而来的帮助；第二处以 את 将雅威标为直接宾语。区别翻译既符合现代汉语，也保留原文的语义张力，不把求援和寻求神本人完全等同。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“犹大众人”明确集合主体；分号保留两个紧密相连分句的并列推进。正文适度明示第一分句在危难语境中的含义，脚注则保留希伯来文的省略与两种句法结构之间的差异。
