  text: וַ֠/יַּֽעַמְדוּ בְּנֵ֨י עַמּ֧וֹן וּ/מוֹאָ֛ב עַל יֹשְׁבֵ֥י הַר שֵׂעִ֖יר לְ/הַחֲרִ֣ים וּ/לְ/הַשְׁמִ֑יד וּ/כְ/כַלּוֹתָ/ם֙ בְּ/יוֹשְׁבֵ֣י שֵׂעִ֔יר עָזְר֥וּ אִישׁ בְּ/רֵעֵ֖/הוּ לְ/מַשְׁחִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: zh_hans
  text: 于是，亚扪人和摩押人起来攻击西珥山的居民，要把他们尽行毁灭、彻底除灭[a]。当他们灭尽了西珥的居民，就彼此帮助，互相毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可译作“把他们置于禁令之下”；此词指献作毁灭。
    reason: 说明希伯来语חרם所含置于禁令之下并献作毁灭的含义。
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: 起来攻击
  rationale: עמד与介词עַל用于军事语境时，表示起来敌对或攻击；此译自然地传达敌对行动，同时保留“起来”的叙事动态。
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: 亚扪人和摩押人
  rationale: 按现代汉语民族名称表达，比直译“亚扪之子和摩押”更自然准确。
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: 西珥山的居民
  rationale: 准确表达分词名词化的“居民”，并采用通行地名“西珥山”。
- source_word: לְהַחֲרִים
  choice: 把他们尽行毁灭
  rationale: חרם在使役词干中指将对象置于禁令之下、奉献以毁灭；正文采用清楚庄重的现代汉语，脚注补明其宗教性含义。
- source_word: וּלְהַשְׁמִיד
  choice: 彻底除灭
  rationale: 与前一动词形成累加强调，并保留שׁמד所表达的彻底毁灭之意。
- source_word: וּכְכַלּוֹתָם
  choice: 等他们灭尽了
  rationale: 介词כְּ加不定式构造在此表示时间关系；结合宾语语境译为“等……灭尽了”，体现行动完成后才转向彼此攻击。
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ
  choice: 彼此帮助
  rationale: 原文直译为“各人帮助同伴”，在此是相互性的分配表达；“彼此帮助”保留了原文略带反讽的措辞。
- source_word: לְמַשְׁחִית
  choice: 互相毁灭
  rationale: 不定式说明他们彼此协助的目的或结果；上下文表明毁灭的对象就是对方，因此用“互相毁灭”明确汉语所需的对象关系。
theological_decisions:
- issue: 战争语境中חרם的译法
  choice: 把他们尽行毁灭
  alternative: 把他们置于禁令之下，奉献为毁灭之物
  rationale: 该词不只是普通的杀灭，还带有置于禁令之下、奉献以毁灭的宗教与战争含义。正文兼顾可懂性与庄重性，脚注保留其专门含义，避免把神学色彩静默抹平。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“尽行毁灭／彻底除灭”保留原文两个毁灭动词的累加力度；末句保留“彼此帮助”的反讽张力，不改写成单纯的“互相残杀”。
