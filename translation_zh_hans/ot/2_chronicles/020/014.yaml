  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: zh_hans
  text: 那时，在会众当中，耶和华的灵临到雅哈悉；他是撒迦利雅的儿子、比拿雅的孙子、耶利的曾孙、玛探雅的玄孙，是利未人，出于亚萨的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַחֲזִיאֵל
  choice: 那时……雅哈悉
  rationale: וְ在叙事中承接上文，译作“那时”比机械译作“并且”更符合现代汉语；人名按通行圣经音译处理。
- source_word: בֶּן זְכַרְיָהוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָה
  choice: 玛探雅的玄孙、耶利的曾孙、比拿雅的孙子、撒迦利雅的儿子
  rationale: 希伯来文连续使用בֶּן列出四代谱系。汉语按由远及近的亲属称谓表达，既保留每一代，也避免反复使用生硬的“儿子”。
- source_word: הַלֵּוִי מִן־בְּנֵי אָסָף
  choice: 亚萨的子孙、利未人
  rationale: 该短语说明雅哈悉所属的利未支系。将“亚萨的子孙”置前，可使整段谱系在汉语中自然连贯；“利未人”保留定冠词所表达的身份说明。
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: 耶和华的灵临到……
  rationale: הָיְתָה עָלָיו在此具有事件性，描述上帝的灵临到雅哈悉，使他随后发出预言；“临到”自然并保留动态意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，明确保留专名，而不以“主”等称号替代。
- source_word: בְּתוֹךְ הַקָּהָל
  choice: 在会众中
  rationale: 准确表达בְּתוֹךְ的“在……中间/当中”以及קָהָל在公共聚集场景中的“会众”之义。
theological_decisions:
- issue: רוּחַ יְהוָה的所指
  choice: 耶和华的灵
  alternative: 耶和华的气息／来自耶和华的感动
  rationale: 上下文表明这是使雅哈悉发出先知性宣告的神圣临在与能力；直译为“耶和华的灵”保留原文表达，不将其弱化为心理感动，也不额外展开后期神学定义。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文保留专名；“耶和华”是普通现代中文读者最熟悉且庄重的形式，同时不以头衔替代神名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免汉语中连续“某某的儿子”的歧义，将四代谱系转换成准确的玄孙、曾孙、孙子、儿子关系，并把主语“雅哈悉”置于句末，使“耶和华的灵临到雅哈悉”成为清晰主干。
