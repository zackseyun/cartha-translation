revisions:
- from: 于是，对上帝的惧怕[a]临到各地所有的王国，因为他们听说雅威与以色列的仇敌争战。
  to: 当他们听说雅威曾同以色列的仇敌争战时，上帝所降的恐惧[a]临到各地所有的王国。
  rationale: 修订将“因为”改为“当……时”，恢复原文时间性句法；将主文的恐惧表述为“上帝所降的恐惧”，使其符合列国听闻雅威为以色列作战后的语境，并用脚注保留“对上帝的惧怕”的可行理解。神名、王国范围及对仇敌作战的意思均予保留。
