  naturalness: “各地所有的王国”可以理解，但略显生硬；保留其范围而调整语序后更自然。“雅威与以色列的仇敌争战”在汉语中通常可理解为敌对交战，使用“同……争战”也更贴近原文介词结构。
  terminology: “雅威”恰当保留 יְהוָה 的专名。以“上帝所降的恐惧”为主文，并在脚注保留“对上帝的惧怕”这一属格可能，可较好兼顾语境和原文短语的歧义。
