  text: וַ/יְהִי֙ פַּ֣חַד אֱלֹהִ֔ים עַ֖ל כָּל מַמְלְכ֣וֹת הָ/אֲרָצ֑וֹת בְּ/שָׁמְעָ֕/ם כִּ֚י נִלְחַ֣ם יְהוָ֔ה עִ֖ם אוֹיְבֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: zh_hans
  text: 当他们听说雅威曾同以色列的仇敌争战时，上帝所降的恐惧[a]临到各地所有的王国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对上帝的惧怕。”希伯来语短语也可指与上帝的临在或作为相关的恐惧。
    reason: 保留 פַּחַד אֱלֹהִים 的属格歧义；主文按上下文表达由上帝的作为所引起的恐惧。
lexical_decisions:
- source_word: וַיְהִי
  choice: 于是……临到
  rationale: 该叙事形式引出前述事件所造成的新局面；“于是……临到”既体现结果和起始，也符合现代汉语叙事表达。
- source_word: פַּחַד אֱלֹהִים
  choice: 对上帝的惧怕
  rationale: 保留希伯来语属格结构的主要理解，即因上帝显明作为而产生、以他为对象的畏惧；另在脚注注明也可能指上帝所降的恐惧。
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: 临到各地所有的王国
  rationale: מַמְלְכוֹת 译为“王国”，הָאֲרָצוֹת 为复数，译作“各地”而不扩大为全世界；“临到”自然表达 עַל 在此结构中的含义。
- source_word: בְּשָׁמְעָם כִּי
  choice: 因为他们听说
  rationale: 介词加不定式结构表示时间或原因背景，כִּי 引出所听见的内容；此处“因为他们听说”清楚呈现恐惧产生的缘由。
- source_word: נִלְחַם
  choice: 争战
  rationale: 该完成式指雅威已经施行、后来被列国听闻的战斗行动；汉语在“听说”之后无需另加过去完成标记。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保存四字神名，不以称号替代。
- source_word: עִם אוֹיְבֵי יִשְׂרָאֵל
  choice: 与以色列的仇敌争战
  rationale: עִם 本义为“与”，与“争战”连用时由宾语“仇敌”清楚表明敌对关系；此译保留希伯来语的表达方式，同时在汉语中不会误解为并肩作战。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留专名性质，避免用称号取代。
- issue: פַּחַד אֱלֹהִים 中属格关系
  choice: 对上帝的惧怕
  alternative: 从上帝而来的恐惧
  rationale: 上下文显示各国因听见雅威为以色列争战而惧怕，主要译文可自然理解为对上帝的畏惧；但该结构也可指由上帝造成或降下的恐惧，因此以脚注保留这一真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“各地所有的王国”保留原文“地／国土”的复数范围，不擅自补入“周围”，也不夸大为全世界；“与……仇敌争战”兼顾原文介词形式和汉语可懂度。
