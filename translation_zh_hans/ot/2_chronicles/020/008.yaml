  yaml_path: translation/ot/2_chronicles/020/008.yaml
  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: zh_hans
  text: 他们住在这地[a]，并在那里为你建造了一座为你的名而设的圣所[b]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住”也可译作“居住”或“定居”。
    reason: lexical_alternative
  - marker: b
    text: “为你的名而设的圣所”指一处奉献给耶和华之名的圣洁地方，与他所启示的临在和尊荣相关。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: 他们住
  rationale: ישׁב在此指在那地居住、定居。“住”是现代汉语中自然直接的表达，也不把重点局限于最初的定居行动。
- source_word: בָהּ
  choice: 在这地／在这里
  rationale: 阴性单数后缀回指上文的“地”。第一次明说“这地”以避免汉语指代含混，第二次用“这里”使行文自然。
- source_word: וַיִּבְנוּ
  choice: 建造
  rationale: 准确表达בנה；“建造”符合庄重叙事语体。
- source_word: לְךָ
  choice: 为你
  rationale: 介词ל在此表示归属、受益或奉献对象；“为你”保留圣所献给上帝的含义。该意义在“为你的名”这一整体结构中表达。
- source_word: מִקְדָּשׁ
  choice: 一座圣所
  rationale: מִקְדָּשׁ指分别为圣的场所。“圣所”既保留其神圣性质，又不将词义直接收窄为制度化称谓“圣殿”，尽管此处实际所指是圣殿。
- source_word: לְשִׁמְךָ
  choice: 为你的名
  rationale: 直译并保留旧约中“名”的丰富含义，包括上帝所启示的临在、尊荣和声名；不改译为“奉你的名”，以免产生凭其权柄行事的意思。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下一节所述的话。汉语用冒号自然地标明后续引语，同时保留本节与下文的句法连接。
theological_decisions:
- issue: “为你的名……圣所”的所指和神学张力
  choice: 为你的名建造圣所
  alternative: 为你的尊荣建造圣殿／建造一座以你的名命名的圣所
  rationale: 所选译法保留圣经关于上帝之“名”与圣所相联的表达，表明奉献和上帝所启示的临在与尊荣，却不暗示上帝被空间所容纳，也不把“名”简化为荣誉或命名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这地／这里”明确阴性代词的所指；保留“为你的名”这一圣经特有表达，并用脚注说明其文化和神学背景。脚注标记按其实际说明对象分别置于“住在这地”和“圣所”之后。
