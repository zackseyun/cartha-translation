  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: zh_hans
  text: 他走在父亲亚撒所走的道路上，未曾偏离，行雅威眼中看为正的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: 行……所行的道
  rationale: הלך与דרך共同构成以道路比喻行为方式的表达。译文保留“行道”的意象，并借“所行的”使现代汉语关系清楚自然。
- source_word: אָבִיו אָסָא
  choice: 他父亲亚撒
  rationale: 忠实表达亚撒与约沙法的父子关系，采用自然的现代汉语语序。
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: 没有偏离
  rationale: סור מן表示从某条道路转离；中文“偏离”延续前文的道路意象，所偏离的对象由上下文清楚指向“道”。
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: 做……看为正的事
  rationale: לַעֲשׂוֹת在此说明其行为表现；הַיָּשָׁר指符合正直、正确标准的事，译作“正的事”简洁而庄重。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象，并将神名יהוה音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；采用较贴近YHWH常见学术重构读音的“雅威”，而不以称号“主”代替。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语；保留“道”“偏离”和“眼中”等希伯来语核心意象，避免把本节扩展成超出原文的道德或宗派性解释。
