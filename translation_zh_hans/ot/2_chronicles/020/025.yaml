base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: zh_hans
  text: 约沙法和他的百姓来掠取敌人的战利品；他们在敌军中发现了大量财物、尸体和珍贵物品。他们为自己取走的，多得无法搬运。他们用了三天掠取战利品，因为实在太多了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: 收取敌人的战利品
  rationale: 该不定式表示前来的目的，שָׁלָל指战争中的掳物。中文用“收取……战利品”既自然庄重，也保留军事语境；“敌人的”明确第三人称复数后缀在上下文中的所指。
- source_word: בָהֶם
  choice: 在那些尸体中
  rationale: 介词短语可指在阵亡敌军中间或其身上。结合马所拉文本紧接的פְגָרִים，此译法使场景清楚，同时不排除从尸身上取得物品的含义。
- source_word: לָרֹב
  choice: 大量
  rationale: 表达数量丰盛，置于宾语列举之前，符合现代汉语习惯。
- source_word: רְכוּשׁ
  choice: 财物
  rationale: 该词泛指可移动的产业、物资或所有物；“财物”适合战利品清单，又不局限于金钱。
- source_word: פְגָרִים
  choice: 尸体（体现在“在那些尸体中”）
  rationale: 马所拉文本通常意为“尸体、死尸”。为避免中文出现“发现了大量……尸体”而误把尸体本身列为战利品，将其自然地落实在地点短语中，并以脚注说明文本问题。
- source_word: כְלֵי חֲמֻדוֹת
  choice: 珍贵物品
  rationale: כְלֵי可泛指器物、物件，חֲמֻדוֹת表示可喜爱或宝贵之物；“珍贵物品”保持宽泛，不武断限定为器皿。
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: 就取来归自己
  rationale: נצל的加强词干在此有剥取、夺取之意，לָהֶם表示为自己取得。此译保留占有方向，同时比直译“剥下来”更符合现代汉语。
- source_word: לְאֵין מַשָּׂא
  choice: 数量多得带不走
  rationale: 原文直译近于“以致无法负载”，表示战利品超过可搬运的数量；此译清楚自然。
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: 他们用了三天收取战利品
  rationale: 该结构表示持续三天进行掳取；中文以“用了三天”准确表达时长和持续动作。
- source_word: כִּי רַב הוּא
  choice: 因为实在太多了
  rationale: 说明为何需三天，强调战利品数量巨大；“实在太多”符合现代叙事语体。
