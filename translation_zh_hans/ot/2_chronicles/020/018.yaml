base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: zh_hans
  text: 约沙法便俯伏在地；犹大人和耶路撒冷的居民都伏倒在雅威面前，敬拜雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向雅威下拜”。
    reason: לְהִשְׁתַּחֲוֺת既可强调敬拜，也可强调俯身下拜的动作。
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: 面伏
  rationale: קָדַד表示因敬畏而屈身、低头；结合紧随其后的“脸朝地”，译作“面伏”自然地呈现深深俯身的动作，又不额外限定为跪下。
- source_word: אַפַּיִם אָרְצָה
  choice: 于地
  rationale: 该短语直指脸朝向地面，与“面伏”合译为“面伏于地”，清楚表达完全俯伏的姿态。
- source_word: וְכָל יְהוּדָה
  choice: 犹大众人
  rationale: “犹大”在此转喻犹大群体；补出“众人”符合现代汉语习惯，并保留כָל“全体”的范围。
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 分词יֹשְׁבֵי指居住在那里的人，“居民”准确、简洁而自然。
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: 俯伏在雅威面前
  rationale: נפל的基本意象是倒下；在敬拜语境中指伏倒。“俯伏”既保留具体动作，也符合庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以“主”这一称号替代；本节两次出现均予保留。
- source_word: לְהִשְׁתַּחֲוֺת
  choice: 敬拜
  rationale: שׁחה的Hitpael形式可指俯身下拜，也可在此语境表达敬拜；前文已明说俯伏动作，正文采用“敬拜”以传达其目的，同时以脚注保留动作性译法。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 保留原文重复出现的神名，明确敬拜的对象，不改用代词。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以音译保留其专名性质，避免用称号“主”取代。
- issue: לְהִשְׁתַּחֲוֺת兼有身体动作与敬拜含义
  choice: 正文译“敬拜”
  alternative: 向……下拜
  rationale: 语境先以“俯伏”描述身体动作，因此“敬拜”自然表达动作的宗教指向；脚注保留较为形式对应的动作性理解，不消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“面伏于地”保留经文的肃穆感；“犹大众人”明确地名在此代指群体。分号呈现约沙法的动作与全体民众随之俯伏之间的并列推进。
