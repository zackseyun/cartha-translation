  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: zh_hans
  text: 他说：“犹大众人、耶路撒冷的居民和约沙法王，都要听！耶和华这样对你们说：‘不要因这大军惧怕，也不要惊慌，因为这场争战不属于你们，而属于上帝。[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为这场争战不在于你们，而在于上帝。”希伯来语以两个介词短语作对照，首先表达争战的归属；在语境中也可含有由谁承担或主导的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: 你们要听
  rationale: 复数祈使式要求在场众人留心听；译法自然，并保留命令语气。
- source_word: כָל יְהוּדָה
  choice: 犹大众人
  rationale: 此处“犹大”是对整个群体的集合称呼；补出“众人”可使现代汉语呼语清楚自然。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 准确表达分词结构所指的居住者，庄重而通俗。
- source_word: וְהַמֶּלֶךְ יְהוֹשָׁפָט
  choice: 以及约沙法王
  rationale: 保留君王与百姓一同受话的并列关系，同时符合现代汉语称谓习惯。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华对你们这样说
  rationale: 自然呈现先知性的传信公式，并明确לָכֶם所指的受话者。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的专名形式，直接对应四字神名，而不以称号取代。
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: 不要惧怕，也不要……惊慌
  rationale: 分别保留两个否定命令及连接词的递加力量；“惧怕”与“惊慌”体现两个相关而有别的反应。
- source_word: מִפְּנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: 因这大军
  rationale: מִפְּנֵי在此表示缘由；הָמוֹן在军事语境中指庞大的敌方群体，译作“大军”简洁自然，且不额外赋予贬义。
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: 因为争战不在于你们，而在于上帝
  rationale: 用“不在于……而在于……”表达希伯来语介词短语的对照关系，同时避免把省略结构误解为仅指抽象所有权。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文保留专名而非改为“主”；“耶和华”是现代普通中文读者最熟悉且可辨识的专名形式。
- issue: 争战归属陈述的含义
  choice: 争战不在于你们，而在于上帝
  alternative: 争战不是你们的，而是上帝的
  rationale: 原文两次用לְ构成紧凑对照，可表达归属、责任或承担关系。“在于”保留一定语义张力，不将其缩减为法律式所有权，也不扩展为超出本次战事的普遍教义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。直接引语层次依原文呈现；“不要惧怕，也不要……惊慌”保留两个并列禁令。“大军”按军事上下文处理הָמוֹן，正文脚注则保留末句介词结构的另一种自然理解。
