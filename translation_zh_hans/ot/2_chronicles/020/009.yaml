language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: zh_hans
  text: “如果灾祸临到我们——刀剑、审判[a]、瘟疫或饥荒——我们必站在这殿前，也站在你面前；因为你的名在这殿里[b]。我们要在患难中向你呼求，你必垂听并拯救。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判”也可与“刀剑”相连，理解为“施行审判的刀剑”或“刑罚的刀剑”。
    reason: 希伯来语 חֶרֶב שְׁפוֹט 的句法关系存在歧义；正文保留其作为灾祸清单中并列项的理解。
  - marker: b
    text: 也可按这一惯用语译作“这殿归在你的名下”。
    reason: 保留圣名与圣殿关系的另一种表达，不将其含义限定为物理位置。
lexical_decisions:
- source_word: רָעָה
  choice: 灾祸
  rationale: 这里指临到百姓的灾难，而非道德意义上的邪恶；“灾祸”也自然引出后面的具体灾难。
- source_word: חֶרֶב שְׁפוֹט
  choice: 刀剑、审判
  rationale: 按所给马所拉文本将二者作为灾祸清单中的并列项处理，同时用脚注保留“施行审判的刀剑”这一可能理解。
- source_word: דֶבֶר
  choice: 瘟疫
  rationale: 指群体性的疫病灾害，符合盟约咒诅语境，也比泛称“疾病”更准确。
- source_word: רָעָב
  choice: 饥荒
  rationale: 指普遍性的粮食短缺，而非个人感到饥饿。
- source_word: נַעַמְדָה
  choice: 我们就站
  rationale: 意愿式在条件句中表达灾祸来临时百姓将采取的行动；“就站”符合现代汉语条件结构。
- source_word: לִפְנֵי הַבַּיִת הַזֶּה וּלְפָנֶיךָ
  choice: 站在这殿前，也就是站在你面前
  rationale: “殿”在此自然指圣殿；补入“也就是”显明两个介词短语的紧密关系，同时没有把圣殿等同于神本人。
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: 因为你的名在这殿里
  rationale: 贴近希伯来语的圣殿—圣名表达，不把神的临在、所有权或立名关系单一化解释；另在脚注列出惯用意义。
- source_word: וְנִזְעַק אֵלֶיךָ מִצָּרָתֵנוּ
  choice: 我们要在患难中向你呼求
  rationale: “呼求”体现急迫祈求；介词 מִן 在这里可表达呼求所处或发出的困境，汉语用“在患难中”较自然。
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: 你必垂听并拯救
  rationale: 保留两个动词；“垂听”符合向神祷告的庄重语域，“拯救”不限定施救方式。
theological_decisions:
- issue: “你的名在这殿里”的圣殿—圣名神学
  choice: 正文保留“你的名在这殿里”这一希伯来语表达。
  alternative: “你的名在这殿之上”或“这殿归在你名下”。
  rationale: 保留神的圣名与圣殿之间的关系及其神学张力，不将其简化为物理居住、所有权或命名关系中的任何一种。
- issue: חֶרֶב שְׁפוֹט 的句法关系
  choice: 正文译作并列的“刀剑、审判”。
  alternative: “施行审判的刀剑”或“刑罚的刀剑”。
  rationale: 该短语形式简峻，既可按灾祸清单理解，也可能把“审判”与“刀剑”结合；正文遵循所给马所拉文本的传统并列理解，以脚注保存另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿”“垂听”“呼求”维持祷告和圣殿场景所需的经文语域，但避免文言句法。破折号标示灾祸清单，分号区分站立祷告的理由与随后呼求、蒙救的行动。
