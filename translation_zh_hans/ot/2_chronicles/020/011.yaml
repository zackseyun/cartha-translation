source:
  edition: WLC
  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: zh_hans
  text: 看哪，他们竟这样报答我们：前来把我们从你的产业[a]中赶出去；这产业是你使我们承受的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的产业”也可译作“你的所有之地”；本句后半也可译作“就是你赐给我们为业的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意并加强申诉语气的篇章功能；在现代中文中庄重而易懂。
- source_word: הֵם
  choice: 他们竟
  rationale: 独立代词带有强调作用；加入“竟”自然表达约沙法话语中的意外与责难，但不另增事实内容。
- source_word: גֹּמְלִים עָלֵינוּ
  choice: 这样报答我们
  rationale: גמל 在此表示针对先前行为作出回报；结合上下文，“报答”准确传达其中的反讽意味。
- source_word: לָבוֹא לְגָרְשֵׁנוּ
  choice: 前来把我们……赶出去
  rationale: 保留“来”与“赶出去”的动作关系，并以自然中文表达其目的。
- source_word: מִיְּרֻשָּׁתְךָ
  choice: 从你的产业中
  rationale: יְרֻשָּׁה 可指产业、所有之地或所承受之业；“你的产业”保留土地属于上帝的含义，也与下句以色列蒙赐承受这地形成张力。
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: 这产业是你使我们承受的
  rationale: 使役形态表达上帝使以色列取得并承受这地；此译法保留神主动赐予的意思，又不把“产业”单纯改写为一般礼物。
theological_decisions:
- issue: 上帝对土地的所有权与以色列承受土地之间的关系
  choice: 你的产业；这产业是你使我们承受的
  alternative: 你的所有之地，就是你赐给我们为业的
  rationale: 正文同时保留土地是上帝的产业和上帝使以色列承受土地这两层意思，不将二者合并，也不对两者之间的神学张力作额外解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的申诉语体。“看哪”保留原文的强调；分号将关系从句独立呈现，使中文清楚，同时维持原文中“你的产业”与“我们承受”之间的对应。
