source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: zh_hans
  text: 他们开始欢唱赞美的时候，雅威就设下伏击[a]，攻击那些前来攻打犹大的[b]亚扪人、摩押人和西珥山人；他们就被击败了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伏击”也可译作“伏兵”或“埋伏的人”。希伯来语可指执行埋伏的人，也可较概括地指伏击或埋伏行动。
    reason: lexical_alternative
  - marker: b
    text: “前来攻打犹大”也可译作“来到犹大”。这里按战争语境译出敌对含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: 他们开始……的时候
  rationale: 以自然的现代汉语表达时间关系，同时保留动作刚开始时随即发生后续事件的叙事意味。
- source_word: בְרִנָּה וּתְהִלָּה
  choice: 欢唱赞美
  rationale: רִנָּה可指欢呼、欢唱，תְהִלָּה指赞美；在敬拜语境中合译为“欢唱赞美”，既简洁又保留喜乐发声的意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通常拟音直接译出，区别于以称号替代神名。
- source_word: נָתַן ... מְאָרְבִים
  choice: 设下伏兵
  rationale: נָתַן在此与מְאָרְבִים构成军事语境中的表达；“设下伏兵”符合现代汉语，也保留其可能指埋伏者的具体含义。
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: 亚扪人、摩押人和西珥山人
  rationale: “亚扪之子”按民族名称译为“亚扪人”；摩押和西珥山在本句中同样指参战群体，因此补出“人”以使汉语清楚自然。
- source_word: הַבָּאִים לִיהוּדָה
  choice: 那些前来攻打犹大的
  rationale: 介词ל本可只表示方向“到”，但上下文明确是敌军入侵，因此正文译出敌对含义，同时以脚注保留字面可能。
- source_word: וַיִּנָּגֵפוּ
  choice: 他们就被击败了
  rationale: 保留Niphal形态的被动意义；“被击败”涵盖遭击打、受挫败的军事结果，不额外断定伏兵的身份或具体方式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用接近YHWH通常读音的“雅威”，不以称号替代，也避免把较晚形成的“Jehovah”读法当作原始发音。
- issue: 伏兵的施动者与性质
  choice: 雅威“设下伏兵”
  alternative: 雅威使埋伏发生；雅威派伏兵
  rationale: 原文明确以雅威为主语，却没有说明伏兵究竟是谁，也没有交代其行动机制；正文保留这种张力，不推定是天使、犹大军队或敌军内部人员。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“欢唱赞美”适合敬拜场景；“设下伏兵”“被击败”保持军事语境。分号帮助读者辨明敌军被击败是前述神圣行动的结果。
