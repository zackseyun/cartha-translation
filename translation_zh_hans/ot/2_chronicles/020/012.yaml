  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: zh_hans
  text: 我们的上帝啊，你不审判他们吗？因为我们无力抵挡这一大群前来攻击我们的人。我们不知道该怎么办，但我们的眼睛都仰望你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们的眼睛都仰望你。”
    reason: כִּי通常表示“因为”，也可在此按上下文理解为由无助转向信靠的语意转折。
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝啊
  rationale: 这是祷告中的呼语；“啊”自然地标明直接呼求，也保留“我们的”所表达的群体关系。
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: 你不审判他们吗？
  rationale: 保留反问语气及שׁפט的司法含义；“审判”既可包含定罪，也可包含为受欺压者伸张正义，不缩窄为单纯“惩罚”。
- source_word: אֵין בָּנוּ כֹּחַ
  choice: 我们无力
  rationale: 简洁表达“我们里面没有力量”，在军事危机的语境中自然清楚。
- source_word: לִפְנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: 抵挡这一大群……的人
  rationale: לִפְנֵי在此表示面对强敌；译作“抵挡”符合汉语表达。הָמוֹן本指庞大群体，未直接限定为军队，因此不在正文中过度具体化。
- source_word: הַבָּא עָלֵינוּ
  choice: 前来攻击我们
  rationale: 分词表达正在逼近的威胁；语境中的עַל带有敌对意味，译为“攻击”清楚而自然。
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: 我们不知道该怎么办
  rationale: 直接保留原文简洁、迫切的无助表白。
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: 但我们的眼睛都仰望你
  rationale: 保留“眼睛”这一信靠与期待的意象；主文以“但”表现从无计可施转向倚靠上帝的语意推进，同时以脚注注明כִּי较形式对应的因果译法。
theological_decisions:
- issue: 末句כִּי与前一句无助表白之间的关系
  choice: 正文按语意转折译为“但我们的眼睛都仰望你”
  alternative: 较形式地译为“因为我们的眼睛都仰望你”
  rationale: כִּי通常可表示“因为”，但此处也构成祷告的高潮：人虽不知道该做什么，却专一等候上帝。正文以转折关系呈现这一推进，脚注保留因果理解，避免排除原文的语法可能性。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“我们的上帝啊”保留呼求语气；“这一大群……的人”避免把הָמוֹן过度限定为“军队”；末句保留“眼睛仰望”的原文意象。
