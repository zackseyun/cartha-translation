- from: 于是，约沙法的国得享太平[a]，他的上帝使他四境安宁。
  to: 约沙法的国得享太平[a]；他的上帝赐他四境平安。
  rationale: 修订仅澄清第二分句的使役和受益关系：“赐他四境平安”对应上帝使约沙法从四围得安歇。脚注保留שׁקט的词汇替代译法及其既有锚点。
