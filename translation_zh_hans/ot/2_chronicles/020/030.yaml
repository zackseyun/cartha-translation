  text: וַ/תִּשְׁקֹ֖ט מַלְכ֣וּת יְהוֹשָׁפָ֑ט וַ/יָּ֧נַֽח ל֦/וֹ אֱלֹהָ֖י/ו מִ/סָּבִֽיב׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: zh_hans
  text: 约沙法的国得享太平[a]；他的上帝赐他四境平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约沙法的国安静无事。”
    reason: שׁקט也可较直译为“安静、平静”；此处指国家不受战乱或敌患侵扰。
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: 得享太平
  rationale: שׁקט表示安静、不受扰乱或处于和平状态。以“国”为主语时，“得享太平”既自然，也表达了国境安稳、没有战乱的语境。
- source_word: מַלְכוּת
  choice: 国
  rationale: מַלְכוּת在这里指约沙法所统治的王国或国度；“约沙法的国”简明自然，并保留原文以该国为主语的结构。
- source_word: יְהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיָּנַח
  choice: 使他……安宁
  rationale: נוח的使役形在此表示上帝使约沙法得安歇、免受侵扰。“使他……安宁”保留了上帝主动赐下安稳的使役意义。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 该形式意为“他的上帝”，所指是约沙法的上帝；采用“上帝”作为自然、庄重的现代汉语表达。
- source_word: מִסָּבִיב
  choice: 四境
  rationale: 该短语表示四周、各方；与“安宁”连用译作“四境安宁”，自然地表达来自周围各方的威胁都已止息。
- source_word: וַ
  choice: 于是；并列衔接
  rationale: 首个叙事连接词译作“于是”，承接上文事件；第二个连接词不明说因果，而以逗号并列两句，保留原文可理解为顺承或说明的关系。
theological_decisions:
- issue: 国家太平与上帝作为之间的关系
  choice: 保留两个并列分句，并明确说是上帝“使”约沙法四境安宁
  alternative: 用“因为”明确将第二句处理为第一句的原因
  rationale: 原文第二句确实把安宁归于上帝的行动，但连接词本身只是常见的וַ。中文不增添“因为”，可保留顺承与解释关系之间的张力，同时不削弱上帝的主动作为。
- issue: “他的上帝”的归属表达
  choice: 直译为“他的上帝”
  alternative: 译作“耶和华他的上帝”或只译“上帝”
  rationale: 原文只有אֱלֹהָיו，并未在本节使用神名；直译既忠实，也避免补入原文没有的称谓。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“得享太平”适合历史叙事且易于理解；“四境安宁”凝练表达四周均得安歇。脚注标记[a]已置于正文对应词组之后。
