  to: 他与百姓商议后，就指派一些人歌颂雅威，并赞美圣洁的荣美[b]。他们走在先锋部队[c]前面时，说：“要称谢雅威[a]，因为他坚定不移的爱[d]永远长存。”
  rationale: 修订消除了“歌唱的人向雅威歌唱”的重复，令歌唱者的受派职责在现代汉语中更自然。保留“圣洁的荣美”这一贴近原文的主要译法，同时以脚注呈现其可作方式或处境理解的歧义。将חסד译为“坚定不移的爱”，以较自然的汉语保留其恒久、忠诚的含义；脚注继续说明“慈爱”等替代译法。
