  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: zh_hans
  text: 他与百姓商议后，就指派一些人歌颂雅威，并赞美圣洁的荣美[b]。他们走在先锋部队[c]前面时，说：“要称谢雅威[a]，因为他坚定不移的爱[d]永远长存。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה的音译，传统上也译作“耶和华”或“上主”。
    reason: divine_name
  - marker: b
    text: 或译“圣洁的华美”或“圣洁之美”。这个希伯来语短语也可理解为“在圣洁的华美中”赞美。
    reason: lexical_alternative
  - marker: c
    text: 或译“先头部队”或“前线部队”。
    reason: lexical_alternative
  - marker: d
    text: 或译“他的慈爱永远长存”。希伯来文חסד包含坚定、忠诚而信实的爱，也可带有怜悯之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל־הָעָם
  choice: 他与百姓商议后
  rationale: יעץ的尼法勒形在这里表示商议、征求意见；用“与百姓商议”既自然，也保留百姓参与商议的含义。
- source_word: וַיַּעֲמֵד מְשֹׁרֲרִים
  choice: 就指派歌唱的人
  rationale: עמד的使役形可指使人站立、安置或指派；本处涉及安排礼仪人员，“指派”最贴合语境。מְשֹׁרֲרִים专指歌唱者。
- source_word: לַיהוָה
  choice: 向雅威歌唱
  rationale: 介词ל可表示对象或受益者；在赞美语境中译作“向……歌唱”符合现代汉语。
- source_word: וּמְהַלְלִים לְהַדְרַת־קֹדֶשׁ
  choice: 赞美圣洁的荣美
  rationale: 保留הדרת קדש中“荣美/华美”与“圣洁”的紧密关系，同时不把这一短语过度限定为服饰、仪仗或神本身的属性。
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: 他们走在先锋部队前面
  rationale: ב加不定式表示同时发生的行动；החלוץ指先行、武装在前的队伍，故译为“先锋部队”，而非笼统的全军。
- source_word: הוֹדוּ לַיהוָה
  choice: 要称谢雅威
  rationale: ידה的使役形在敬拜语境中通常指称谢或赞美；后面的כי从句说明称谢的理由，因此“称谢”较精确。
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: 因为他的信实之爱永远长存
  rationale: חסד兼有坚定、忠诚、慈爱与盟约信实等内涵；“信实之爱”在简洁的同时保留其关系性和忠诚意味。“长存”补出希伯来语无动词句在汉语中自然需要的谓语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。“雅威”较接近学界通常重构的读音，也把专名与称号区分开；脚注说明其传统译名，便利普通读者辨认。
- issue: חסד的神学内涵
  choice: 信实之爱
  alternative: 慈爱；怜悯；坚定不移的爱
  rationale: 不把חסד缩减为单纯情感或怜悯，而保留忠诚、坚贞和关系承诺的含义；同时避免在正文中明确添加原文未直接出现的“盟约”一词。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。用“百姓”“称谢”“长存”保持经文语体的尊严，但避免文言句法；把较少见的神名“雅威”和多义词חסד放入脚注说明。
