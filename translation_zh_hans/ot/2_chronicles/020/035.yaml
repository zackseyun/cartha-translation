source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: zh_hans
  text: 此后，犹大王约沙法与以色列王亚哈谢联合；亚哈谢行事邪恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他行恶去做”；“他”最自然是指亚哈谢，也可能被理解为指约沙法或与这次联合有关。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 自然、简洁地表达时间上的承接关系，不把原文扩展为特定事件之后。
- source_word: אֶתְחַבַּר
  choice: 联合
  rationale: 该词为חבר的Hitpael形式，在此指结成关系或合作；“联合”既保留政治合作的意味，也没有把下一节才说明的具体合作内容提前写入。
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: 犹大王约沙法
  rationale: 按现代汉语常用次序表达王衔与人名。
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: 与以色列王亚哈谢
  rationale: 直接表达介词关系，并按现代汉语习惯排列王衔。
- source_word: הוּא
  choice: 亚哈谢
  rationale: 原文独立代词意为“他”，其最近的先行对象是亚哈谢；汉语明说人名可避免代词所指含混，但以脚注保留句法上的可能张力。
- source_word: הִרְשִׁיעַ לַעֲשׂוֹת
  choice: 行事邪恶
  rationale: הִרְשִׁיעַ表达行恶或行为邪恶，后接לַעֲשׂוֹת的说法简略；“行事邪恶”保留道德判断，同时不擅自限定其所指的具体行为。
theological_decisions:
- issue: 独立代词הוּא所指的对象
  choice: 正文将其理解为亚哈谢
  alternative: 理解为约沙法，或把邪恶的判断更广泛地联系到这次联合
  rationale: 亚哈谢是最近的先行对象，叙事语境也把他刻画为行恶的人，因此这是最自然的句法理解；但希伯来文只写“他”，故在脚注中说明原文形式，避免把另一种理解完全排除。
- issue: לַעֲשׂוֹת是否特指这次联合
  choice: 译为概括性的“行事邪恶”
  alternative: 译为“他这样做是邪恶的”或“他在这事上行恶”
  rationale: 原文不明确指出不定式所涵盖的是联合本身、后续造船合作，还是亚哈谢总体的行为；正文不将这一含义过度具体化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“联合”简洁表达政治或事务上的结伴合作；末句保持原文简略的道德评价，并用脚注交代代词所指及短语结构的含混。
