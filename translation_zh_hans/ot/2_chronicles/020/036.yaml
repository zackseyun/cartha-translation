  text: וַ/יְחַבְּרֵ֣/הוּ עִמּ֔/וֹ לַ/עֲשׂ֥וֹת אֳנִיּ֖וֹת לָ/לֶ֣כֶת תַּרְשִׁ֑ישׁ וַ/יַּעֲשׂ֥וּ אֳנִיּ֖וֹת בְּ/עֶצְי֥וֹן גָּֽבֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: zh_hans
  text: 于是，约沙法与他结盟[a]，要造船前往他施[b]；他们在以旬·迦别造船。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与他合作”或“同他联合”。希伯来语动词表示与人建立联合或合作关系。
    reason: lexical_alternative
  - marker: b
    text: 或译“驶往他施”。有些解释认为航运语境中的“他施”可作惯用表达，但本句的希伯来语句法最自然地表示目的地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  choice: 约沙法与他结盟
  rationale: חבר 的使役式在此表示建立联合或合作关系，并非单纯在空间上连接。根据上文补出主语“约沙法”，使中文指代清楚；“与他结盟”也保留政治、商业合作的语气。
- source_word: לַעֲשׂוֹת אֳנִיּוֹת
  choice: 要造船
  rationale: עשה 基本义为“做、制造”，以船为宾语时，现代汉语自然表达为“造船”。
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: 前往他施
  rationale: הלך 的不定式后直接接“他施”，句法上最自然地表示目的地。船只航行的含义可由语境得知，无须在正文额外添加“航行”。
- source_word: וַיַּעֲשׂוּ אֳנִיּוֹת
  choice: 他们……造船
  rationale: 复数动词指结盟双方的共同行动；沿用“造船”，与前半句呼应，并符合现代汉语习惯。
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: 在以旬·迦别
  rationale: 介词 בְּ 在此标明造船地点；“以旬·迦别”按专名音译，并以间隔号区分复合名称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“于是”承接上文；为避免中文中连续代词造成主语含混，依语境明确补出“约沙法”。所有脚注标记均置于相关词语之后。
