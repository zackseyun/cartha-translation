  text: וִֽ/יהוּדָ֛ה בָּ֥א עַל הַ/מִּצְפֶּ֖ה לַ/מִּדְבָּ֑ר וַ/יִּפְנוּ֙ אֶל הֶ֣/הָמ֔וֹן וְ/הִנָּ֧/ם פְּגָרִ֛ים נֹפְלִ֥ים אַ֖רְצָ/ה וְ/אֵ֥ין פְּלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: zh_hans
  text: 犹大人来到面向旷野的瞭望处，就转向那一大群人；看哪，尸体倒在地上[a]，没有一个幸存者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“尸体，倒在地上。”希伯来文以分词描述尸体倒地的状态。
    reason: 说明原文分词结构及“朝地而倒”的表达，不把其具体化为“横倒”。
lexical_decisions:
- source_word: וִיהוּדָה
  choice: 犹大人
  rationale: “犹大”在此集合性地指犹大一方的人；后面的复数动词也支持这一理解。译作“犹大人”符合现代汉语表达。
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: 来到朝向旷野的瞭望台
  rationale: מִצְפֶּה指供观察的高处或瞭望点；לַמִּדְבָּר表示其朝向旷野。此译保留地形和观察方向，又较为自然。
- source_word: וַיִּפְנוּ אֶל הֶהָמוֹן
  choice: 转身望向那一大群人
  rationale: פנה本义为“转向”，在此也含转眼观看之意；הָמוֹן指众多的人群，语境中为敌军，但原词本身不必明确译成“军队”。
- source_word: וְהִנָּם
  choice: 看哪
  rationale: 保留希伯来叙事中突显眼前景象、引起注意的指示语气。
- source_word: פְּגָרִים
  choice: 尸体
  rationale: פֶּגֶר明确指尸首或死尸；“尸体”准确、庄重，并适合战场语境。
- source_word: נֹפְלִים אַרְצָה
  choice: 横倒在地
  rationale: 原文较直译为“倒下在地/倒向地面”。“横倒在地”自然呈现尸体倒伏地面的状态，同时不增添死因。
- source_word: וְאֵין פְּלֵיטָה
  choice: 没有一人逃脱
  rationale: פְּלֵיטָה可指逃脱者，也可表达逃脱、幸存这一结果；此译在现代汉语中自然，并保留“无人逃出”的核心含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“看哪”保留原文突现景象的修辞力度；避免把“那一大群人”直接解释为“敌军”，以免超出本节原词。英文咨询层的脚注标记位置与脚注内容不一致；本稿按脚注实际所释的希伯来短语，将[a]置于“尸体横倒在地”之后。
