  naturalness: 原译整体通顺、庄重。“来到面向旷野的瞭望处”比“来到朝向旷野的瞭望台”更自然，且不把瞭望地点限定为一座塔。“转向那一大群人”可保留原文的动作，避免“转身望向”额外明说观看。
  terminology: “犹大人”“旷野”“看哪”“尸体”均合适。“幸存者”在此准确传达无人从这场死亡中存留的结果，同时不需要进一步解释战事。
  issues:
