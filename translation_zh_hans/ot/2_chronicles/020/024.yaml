  rationale: 修订避免将尸体的姿态具体化为“横倒”，以“倒在地上”保留原文的倒地状态；将末句译为“没有一个幸存者”，清楚表达此处无人生还的结果。并以“瞭望处”避免把原文的瞭望地点限定为建筑性“瞭望台”。
