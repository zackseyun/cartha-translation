  text: וַ֠/יָּשֻׁבוּ כָּל אִ֨ישׁ יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ וִֽ/יהוֹשָׁפָ֣ט בְּ/רֹאשָׁ֔/ם לָ/שׁ֥וּב אֶל יְרוּשָׁלִַ֖ם בְּ/שִׂמְחָ֑ה כִּֽי שִׂמְּחָ֥/ם יְהוָ֖ה מֵֽ/אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: zh_hans
  text: 于是，犹大和耶路撒冷所有的男子都回转，约沙法走在他们前头，欢欢喜喜地返回耶路撒冷；因为耶和华使他们因仇敌而欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因仇敌而欢喜”也可译为“为仇敌而欢喜”“因脱离仇敌而欢喜”或“因胜过仇敌而欢喜”。原文介词可表示喜乐所关涉的对象、缘由或脱离的来源。
    reason: 保留מִן在此处的语义范围，避免在正文将其与“仇敌”的关系限定为“战胜”。
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... לָשׁוּב
  choice: 踏上归程……返回
  rationale: 原文两次使用שׁוב，先叙述众人回程，后以不定式说明返回耶路撒冷的行动或目的。此译保留重复概念，同时避免中文生硬地说“返回去返回”。
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלִַם
  choice: 犹大和耶路撒冷所有的男子
  rationale: אִישׁ是阳性单数，以分配方式指全体；“所有的男子”既表达其集体意义，也保留原文的性别指称。
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: 约沙法走在他们前头
  rationale: בְּרֹאשָׁם字面为“在他们的头部／首位”，在此表示约沙法位于队伍前方并带领众人。
- source_word: בְּשִׂמְחָה
  choice: 欢欢喜喜地
  rationale: 以自然的现代汉语表达“带着喜乐”的方式状态，并与下文同根动词相呼应。
- source_word: שִׂמְּחָם יְהוָה
  choice: 耶和华使他们……欢喜
  rationale: שׂמח的Piel形式具有使役意义，译文明确保留“使他们欢喜”的语法关系。
- source_word: מֵאוֹיְבֵיהֶם
  choice: 因战胜仇敌
  rationale: 介词מִן在喜乐动词之后可标明喜乐所关涉的对象或缘由；上下文是仇敌遭败，因此正文用中文自然地表达凯旋之喜，并以脚注保留介词关系的其他理解。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中广为人知的专名形式呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用以色列上帝的专名。正文采用普通中文读者熟悉的“耶和华”，保留其专名性质，不用称号替换。
- issue: מֵאוֹיְבֵיהֶם所表达的喜乐关系
  choice: 因战胜仇敌而欢喜
  alternative: 因仇敌而欢喜；脱离仇敌而欢喜
  rationale: 上下文支持凯旋于仇敌之上的意思，但介词本身可表示缘由、关联对象或脱离来源；正文按语境通顺表达，脚注保留其语言上的开放性。
- issue: כָּל אִישׁ的性别与集体意义
  choice: 所有的男子
  alternative: 众人；每一个人
  rationale: 原文明确使用阳性名词אִישׁ，同时以单数分配结构指整个群体；译文兼顾这两方面。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“踏上归程……返回”呼应原文重复的שׁוב，又避免汉语赘复；分号帮助读者看清队伍回程与喜乐原因之间的层次。
