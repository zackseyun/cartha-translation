base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: zh_hans
  text: 他们带着瑟[a]、琴和号，来到耶路撒冷，前往雅威的殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瑟”所译的希伯来语指一种古代弦乐器，其确切形制不能确定；也可译作“竖琴”或“琉特琴一类的乐器”。
    reason: lexical_alternative
  - marker: b
    text: “殿”原文直译为“雅威的房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来到……到了
  rationale: בוא 表示移动到某处；结合句中先提耶路撒冷、后提雅威之殿的双重地点结构，用“来到……到了”自然呈现事件的推进，不把动词过度具体化为“进入”。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般中文通行的地名译法。
- source_word: בִּנְבָלִים
  choice: 带着瑟
  rationale: נֵבֶל 指一种古代弦乐器，具体形制不能完全确定。“瑟”简洁庄重，并与下文 כִּנּוֹר 所译的“琴”保持区别；不在正文中擅自补出“弹着”。
- source_word: וּבְכִנֹּרוֹת
  choice: 琴
  rationale: כִּנּוֹר 是古代拨弦乐器，常对应 lyre。“琴”是自然且易懂的中文概称，也避免与 נֵבֶל 合并为同一种乐器。
- source_word: וּבַחֲצֹצְרוֹת
  choice: 号
  rationale: חֲצֹצְרָה 指礼仪中使用的直管号角或号筒。“号”符合中文宗教礼仪语境；本节没有明说材质，因此不增译“银号”。
- source_word: אֶל בֵּית יְהוָה
  choice: 到了雅威的殿
  rationale: בֵּית יְהוָה 字面为“雅威的房屋”，在此明确指敬拜场所，译作“雅威的殿”自然清楚；以脚注保留字面表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，以区别于“主”等称号，并保留原文使用神圣名字的特点。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的专名，而不是“主”这一称号；“雅威”较直接地呈现该专名。
- issue: בֵּית יְהוָה 的表达
  choice: 雅威的殿
  alternative: 雅威的家；雅威的房屋
  rationale: “殿”按上下文说明这是敬拜场所，但脚注保留“房屋”这一字面意象，避免完全隐藏原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文不增添原文没有明说的演奏动作；用“瑟、琴、号”保持三种乐器的并列和前两种弦乐器之间的词汇区别。
