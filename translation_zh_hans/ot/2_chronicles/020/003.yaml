base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: zh_hans
  text: 约沙法害怕[a]，就决意寻求雅威[b]，并在全犹大宣告禁食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约沙法就惧怕”；这里的希伯来语叙事形式可能表示他开始感到害怕。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“把自己的脸定住，以寻求雅威”，是表示坚定决心或有意采取行动的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: 害怕起来
  rationale: 该动词源于 ירא，在此表示面对威胁时的惧怕；“害怕起来”也保留叙事中可能含有的状态起始意味。
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
  choice: 定意
  rationale: 希伯来语直译为“把他的脸转向/定住”，是表达坚定决心或刻意行动的习语；现代汉语用“定意”自然而庄重。
- source_word: לִדְרוֹשׁ
  choice: 寻求
  rationale: דרש 用于神时，可涵盖转向他、求问他并寻求帮助；“寻求”保留了这一较宽的语义范围。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 原文使用四字神名 יהוה；音译为“雅威”，明确保留其作为立约之神专名的性质。
- source_word: וַיִּקְרָא צוֹם
  choice: 宣告禁食
  rationale: 该搭配指公开宣布或召集禁食；“宣告禁食”符合君王向全国发布命令的语境。
- source_word: עַל כָּל יְהוּדָה
  choice: 向全犹大
  rationale: 介词 עַל 在发布宣告的语境中指对象或覆盖范围；“向全犹大”自然表达宣告遍及犹大全地及其人民。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，并避免以称号取代原文的名字。
- issue: 约沙法惧怕与信靠之间的关系
  choice: 直译为“害怕起来”，随后写“定意寻求雅威”
  alternative: 弱化为“警觉”或将其解释为敬畏
  rationale: 原文并不掩饰约沙法的惧怕，也没有把惧怕与寻求神视为矛盾；译文保留这种叙事与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定意”简洁表达希伯来习语的坚定意向；“禁食”沿用普通读者熟悉的宗教用语。所有脚注标记均已置于正文相应位置。
