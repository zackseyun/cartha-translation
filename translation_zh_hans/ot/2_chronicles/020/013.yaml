  text: וְ/כָ֨ל יְהוּדָ֔ה עֹמְדִ֖ים לִ/פְנֵ֣י יְהוָ֑ה גַּם טַפָּ֖/ם נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: zh_hans
  text: 犹大众人都站在雅威面前，连幼儿、妻子和儿女[a]也都站在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子”。希伯来语这个词既可特指儿子，也可按上下文泛指儿女。
    reason: 保留בְנֵיהֶם在性别范围上的词义歧义。
lexical_decisions:
- source_word: וְכָל יְהוּדָה
  choice: 犹大众人都
  rationale: וְ承接上文，在中文中可由语序自然体现；כָל表示全体，יְהוּדָה在此集合性地指犹大人。“犹大众人都”既清楚又符合现代汉语表达。
- source_word: עֹמְדִים לִפְנֵי
  choice: 站在……面前
  rationale: 分词עֹמְדִים描写持续的站立状态，לִפְנֵי表示在某位面前或临在之中。“站在……面前”保留了原文的姿态和庄严场景。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代。
- source_word: גַּם
  choice: 连……也
  rationale: 此处强调幼儿、妻子和儿女也包括在聚集者之中；“连……也”自然传达这种强调。
- source_word: טַפָּם
  choice: 他们的幼儿
  rationale: טַף指家中年幼、受抚养的孩子，可包括很小的儿童；“幼儿”简洁传达其年龄较小的含义。
- source_word: נְשֵׁיהֶם
  choice: 妻子
  rationale: 在按家庭成员列举的语境中，该词最自然地指这些人的妻子。
- source_word: וּבְנֵיהֶם
  choice: 和儿女[a]
  rationale: בנים既可具体指儿子，也可在家族语境中泛指后代或儿女。正文采用较宽泛的“儿女”，并以脚注保留“儿子”这一真实可能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以“雅威”音译，保留其作为专名的性质，而不改作“主”等称号。
- issue: בְנֵיהֶם的性别范围
  choice: 儿女
  alternative: 儿子
  rationale: 该词可特指男性后代，也可泛指子女。此处列举全体家庭成员，正文用“儿女”较合语境，同时以脚注保留较窄的译法，避免消除词义歧义。
- issue: 幼儿与其他家属是否都在“站立”
  choice: 也都在场
  alternative: 也都站在那里
  rationale: 希伯来文省略重复谓语，其成员均包括在站在雅威面前的会众中。“在场”避免把实际站立姿势不必要地强加给所有幼儿，同时不削弱全家共同来到雅威面前的含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“犹大众人”表达地名的集合性用法；“连……也都在场”清楚呈现全体家庭成员共同参与的场景。脚注标记置于实际存在歧义的“儿女”之后。
