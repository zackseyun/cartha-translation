  to: 犹大众人都站在雅威面前，连幼儿、妻子和儿女[a]也都站在那里。
  rationale: 将“也都在场”改为“也都站在那里”，以保留希伯来文“站着”的持续姿态，并使后列的家庭成员明确同样站在雅威面前。“他们的”在汉语并非必要，省略后仍自然表达所属关系，且不改变原意。
