source:
  edition: WLC
  text: וַ/יִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן דֹּדָוָ֨הוּ֙ מִ/מָּ֣רֵשָׁ֔ה עַל יְהוֹשָׁפָ֖ט לֵ/אמֹ֑ר כְּ/הִֽתְחַבֶּרְ/ךָ֣ עִם אֲחַזְיָ֗הוּ פָּרַ֤ץ יְהוָה֙ אֶֽת מַעֲשֶׂ֔י/ךָ וַ/יִּשָּׁבְר֣וּ אֳנִיּ֔וֹת וְ/לֹ֥א עָצְר֖וּ לָ/לֶ֥כֶת אֶל תַּרְשִֽׁישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: zh_hans
  text: 那时，来自玛利沙的多大瓦户之子以利以谢针对约沙法说预言，说：“因为你与亚哈谢联合，雅威已经毁掉你所做的事[a]。”于是，船只都毁坏了，无法前往他施[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威已经破坏了你的工程（或计划）。”原文直译为“你所做的事”，在这里指约沙法的造船事业。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“不能前往”或“被阻止前往”他施。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: 发出预言
  rationale: 该词为נבא的Hitpael形式，表示以先知身份说出预言；“发出预言”在现代汉语中自然，并保留其先知性言说的含义。
- source_word: עַל
  choice: 向……发出预言
  rationale: 此处预言直接针对约沙法，并带有责备和审判意味。汉语用“向……发出预言”比生硬的“攻击……说预言”自然，而下文内容保留了谴责语气。
- source_word: מִמָּרֵשָׁה
  choice: 来自玛利沙
  rationale: 介词מִן表示来源或籍贯；“来自玛利沙”清楚表达以利以谢的出身地。
- source_word: כְּהִתְחַבֶּרְךָ
  choice: 因为你与……联合
  rationale: חבר的Hitpael形式带有主动使自己与另一方联结的意味。“联合”保留这种关系，又不把它过度限定为正式盟约。
- source_word: פָּרַץ
  choice: 毁掉
  rationale: פרץ基本意象为冲破、破坏；以“你所做的事”为宾语时，表示雅威使其工程或计划破败。“毁掉”符合上下文，也比直译“冲破”自然。
- source_word: מַעֲשֶׂיךָ
  choice: 你所做的事
  rationale: 原文为复数“你的作为/工作”，在本节具体指造船事业。“你所做的事”保留较宽泛的原文表达，脚注说明语境所指。
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: 那些船都撞毁了
  rationale: שבר的Niphal形式表示船遭到破坏。对船而言，“撞毁”是自然的现代汉语表达，但不额外说明事故方式。
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: 无法前往
  rationale: עצר在此可表达没有能力继续或受到阻止。因主语是已损毁的船，“无法前往”简洁呈现实后果，同时以脚注保留其他语义可能。
- source_word: תַּרְשִׁישׁ
  choice: 他施
  rationale: 采用该地名在现代中文圣经传统中通行且易辨认的音译。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；“雅威”以中文音译保留其专名性质，而不以称号代替。
theological_decisions:
- issue: 如何译出神名יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名。译作“雅威”保留专名性质，并避免以“主”这一称号取代原文；“耶和华”是中文传统形式，但“雅威”更接近通常重构的读音。
- issue: 预言与船只毁坏之间的关系
  choice: 以“于是”连接预言宣告与实际结果
  alternative: 译作单纯并列的“船就毁坏了”
  rationale: 原文以连续叙事形式陈述船只毁坏。译文呈现其紧随审判宣告而发生的结果，但不额外断言具体毁坏机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。人名和地名使用中文圣经读者较熟悉的音译；神名译作“雅威”。正文尽量保留原文“你所做的事”的宽泛表达，并借脚注交代造船事业这一具体语境。
