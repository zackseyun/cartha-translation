revisions:
- from: 那时，来自玛利沙的多大瓦户之子以利以谢向约沙法发出预言，说：“因为你与亚哈谢联合，雅威已经毁掉你所做的事[a]。”于是，那些船都撞毁了，无法前往他施[b]。
  to: 那时，来自玛利沙的多大瓦户之子以利以谢针对约沙法说预言，说：“因为你与亚哈谢联合，雅威已经毁掉你所做的事[a]。”于是，船只都毁坏了，无法前往他施[b]。
  rationale: 修订仅消除“撞毁”所引入的碰撞机制，并使预言的对象及谴责方向更贴近原文；其余措辞和两条脚注均可保留。
