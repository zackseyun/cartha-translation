base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: zh_hans
  text: 约沙法站在犹大和耶路撒冷的会众中，在雅威的殿里、在新院前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 站在
  rationale: עמד在此叙述约沙法站立于会众中的动作；“站在”简洁自然，不额外加入“挺身而出”等解释。
- source_word: בִּקְהַל יְהוּדָה וִירוּשָׁלַם
  choice: 在犹大和耶路撒冷的会众中
  rationale: קהל指聚集起来的群体，译作“会众”符合公共敬拜场景；保留介词ב所表达的“在……中”，不改译为较具解释性的“在……面前”。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿里
  rationale: בֵּית־יְהוָה字面为“雅威的家”，在此明确指圣殿；中文译作“殿”既自然又准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: לִפְנֵי
  choice: 前
  rationale: 此处表达空间位置，译作“前”简明庄重，并保留其具体方位关系。
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: 新院子
  rationale: חָצֵר指圣殿建筑群中的院落。“院子”是普通现代读者容易理解的表达；“新院”可作为较凝练的备选。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名，正文采用“雅威”音译，以保留其专名性质；“耶和华”是汉语传统形式，但反映的是另一种历史读音传统。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句序基本贴近希伯来文，并以逗号呈现两个地点短语的层次；不补入原文未明说的动作意图。
