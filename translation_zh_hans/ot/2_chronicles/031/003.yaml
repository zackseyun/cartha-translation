  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: zh_hans
  text: 王从自己的财产中所出的份额，是用于燔祭的：就是早晚的燔祭，以及安息日、月朔[b]和指定节期[c]的燔祭，正如耶和华的律法[d]中所写的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “月朔”指以色列敬拜历法中每月新月之日的礼仪。
    reason: cultural_note
  - marker: c
    text: “指定节期”也可译为“规定的日期”或“规定的节日”。
    reason: lexical_alternative
  - marker: d
    text: “律法”所译的希伯来词可音译为“托拉”，也有“训诲”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: 王……拨出一份
  rationale: מְנָה指划定或分配的一份。结合后面的用途，译为“拨出一份”既保留“份额”的含义，也自然表达王为献祭提供经费。
- source_word: מִן רְכוּשׁוֹ
  choice: 从自己的财产中
  rationale: רְכוּשׁ可指财物、产业或所有物；“自己的财产”清楚表明这些供物来自王的私人资产。
- source_word: לָעֹלוֹת
  choice: 供献燔祭
  rationale: עֹלָה是全部焚烧献上的祭物，汉语圣经传统和现代宗教语境通常称为“燔祭”。
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: 早晚的燔祭
  rationale: 忠实表达早晨与傍晚所献的燔祭，同时采用自然简洁的现代汉语。
- source_word: וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: 以及安息日、月朔和指定节期的燔祭
  rationale: שַׁבָּתוֹת指安息日；חֳדָשִׁים在礼仪历法中指月朔的敬拜活动；מוֹעֲדִים指规定或指定的节期。
- source_word: כַּכָּתוּב
  choice: 正如……所写的
  rationale: 这是说明行为符合成文规定的常见引述公式。
- source_word: בְּתוֹרַת יְהוָה
  choice: 耶和华的律法中
  rationale: תּוֹרָה在本节献祭规例的语境中指成文的神圣训诲或律法；“耶和华”是现代中文中对四字神名最通行的专名译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非“主”这一称号；正文保留专名。现代中文读者最熟悉“耶和华”，同时承认“雅威”更接近许多学者所重构的古代读音。
- issue: תּוֹרָה 在本节中的范围
  choice: 律法
  alternative: 训诲；托拉
  rationale: 本节涉及献祭历法的成文规定，因此“律法”符合语境；脚注保留该词也可泛指“训诲”或音译为“托拉”的可能性，不把它缩减为后世某一宗派性的法律分类。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“拨出一份”避免生硬的名词堆叠；“早晚”简洁表达原文“早晨和傍晚”；“月朔”保留以色列礼仪历法的专门含义，并以脚注解释。标点和“就是”显明原文概括后列举的结构，但不改变各类燔祭之间的关系。
