revisions:
- from: 也按家谱登记他们所有的幼儿、妻子、儿子和女儿，就是全会众[a]；因为他们忠信可靠[b]，把自己分别出来，成为圣洁[c]。
  to: 又按家谱登记他们所有的幼儿、妻子、儿子和女儿，遍及全会众[a]；因为他们忠信地自洁为圣[b]。
  rationale: 修正 לְכָל־קָהָל 的句法功能，避免把“全会众”误译为家庭成员清单的同位语。末句改用“忠信地自洁为圣”，使中文更顺畅，并同时保留“忠信”的语境义、反身成圣的动作和原文重复的圣洁意象。脚注锚点随合并后的说明重新编排。
