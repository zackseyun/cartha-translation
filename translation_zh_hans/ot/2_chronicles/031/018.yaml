base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: zh_hans
  text: 又按家谱登记他们所有的幼儿、妻子、儿子和女儿，遍及全会众[a]；因为他们忠信地自洁为圣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按家谱登记”也可译作“编入宗族名册”。原文动词指登记在家族或家谱记录中；“遍及全会众”表明这种登记所及的范围。
    reason: lexical_alternative
  - marker: b
    text: 这里的“忠信”主要指他们在办理圣职事务上忠诚可信，并非主要指内在的信心。原文用“使自己成圣”的反身动词，又加上“圣洁”一词以加强语气；也可译作“在圣洁中自洁”或“持守圣洁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: 也按家谱登记
  rationale: 该词在《历代志》中指按宗族或家谱编入名册；明说“按家谱”可保留其行政和宗族登记的含义。
- source_word: בְּכָל טַפָּם
  choice: 他们所有的幼儿
  rationale: טַף特指年幼的孩子，比笼统的“儿女”更准确；后文又明确列出儿子和女儿。
- source_word: נְשֵׁיהֶם וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: 他们的妻子、儿子和女儿
  rationale: 家庭成员清单中נָשִׁים宜译为“妻子”，并保留原文对儿子和女儿的分别列举。
- source_word: לְכָל קָהָל
  choice: 就是全会众
  rationale: קָהָל指整个群体；结合前面的成员清单，“就是全会众”在中文中自然地表明登记范围，同时不把它缩限为一次聚会。
- source_word: בֶאֱמוּנָתָם
  choice: 他们忠信可靠
  rationale: 此处אֱמוּנָה主要指履行圣职时的忠诚和可靠，而非专指内在信念；中文用“忠信可靠”呈现这一语境义。
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: 把自己分别出来，成为圣洁
  rationale: יִתְקַדְּשׁוּ是反身形式，表达使自己分别为圣；后接קֹדֶשׁ强化圣洁观念。译文用两个相连短语保留这种强调，又避免生硬重复。
theological_decisions:
- issue: 祭司行政语境中אֱמוּנָה的含义
  choice: 忠信可靠，即忠诚履行圣职
  alternative: 内在或敬虔意义上的信心
  rationale: 上下文是祭司和利未人的登记、分配与圣职，故此词首先描述其可靠忠诚；译文不排除属灵品格，却不把后期神学意义强加于此。
- issue: יִתְקַדְּשׁוּ קֹדֶשׁ中重复的圣洁观念
  choice: 把自己分别出来，成为圣洁
  alternative: 在圣洁中自洁／持守圣洁
  rationale: 原文反身动词后又有“圣洁”名词，语法关系可作强化或结果理解；正文保留两层表达，脚注列明其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按家谱登记”保留经文的行政背景；“忠信可靠”避免把אֱמוּנָה误读为单纯的主观信念；末句以“分别出来，成为圣洁”自然呈现原文反身动作及重复的圣洁意象。
