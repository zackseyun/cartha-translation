base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: zh_hans
  text: 他们忠实地把奉献物、十分之一和圣物[a]运了进来。利未人哥楠雅主管这些物品，他的兄弟示每任副手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可译作“分别为圣之物”。
    reason: lexical_alternative
  - marker: b
    text: “他的兄弟示每任副手”也可译作“示每是他的兄弟，位居第二”；原文只简略说“第二”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: 运了进来
  rationale: 使役形在此表示把物品带入或运入；结合上一节圣殿库房的语境，“运了进来”自然表达送入库房，又不在正文中增添“收存”等原文未明说的内容。
- source_word: הַתְּרוּמָה
  choice: 奉献物
  rationale: תְּרוּמָה指分别出来供神圣用途的捐献；“奉献物”是现代中文中清楚而不失庄重的表达，也避免采用此处未必强调礼仪动作的技术用语“举祭”。
- source_word: הַמַּעֲשֵׂר
  choice: 十分之一
  rationale: מַעֲשֵׂר是献给神的十分之一；直译为“十分之一”准确、通俗，并适合本节列举实物的语境。
- source_word: הַקֳּדָשִׁים
  choice: 圣物
  rationale: קֹדֶשׁ的复数在此指分别为圣的物品或礼物；“圣物”简洁贴近原文，脚注保留“分别为圣之物”这一较解释性的译法。
- source_word: בֶּאֱמוּנָה
  choice: 忠实地
  rationale: אֱמוּנָה在管理财物的语境中可表达忠信、可靠或诚实；“忠实地”保留其方式副词功能，不把含义缩窄为单纯的“诚实”。
- source_word: וַעֲלֵיהֶם
  choice: 主管这些物品
  rationale: עַל加代词后缀在此表示管理权；代词最自然地回指前面列举的奉献物、十分之一和圣物。中文明确说“这些物品”可避免“主管他们”的误读，同时脚注保留其可能泛指相关事务的余地。
- source_word: נָגִיד
  choice: 主管
  rationale: נָגִיד表示受命居首或负责管理的人；在圣殿库房的行政语境中，“主管”比“首领”更自然，也不暗示王权。
- source_word: כונניהו
  choice: 歌楠雅
  rationale: 按现代中文圣经人名的惯用音译处理该名。
- source_word: הַלֵּוִי
  choice: 利未人
  rationale: 忠实表达带定冠词的身份说明，并按中文习惯置于人名前。
- source_word: אָחִיהוּ
  choice: 他的兄弟
  rationale: אָחִיהוּ通常指他的亲兄弟；上下文没有充分理由泛化为“亲属”。
- source_word: מִשְׁנֶה
  choice: 副手
  rationale: מִשְׁנֶה指位居第二者或副职人员；“任副手”以自然中文清楚表达其行政等级，脚注另列较形式对应的译法。
theological_decisions: []
