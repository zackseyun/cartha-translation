  register: 采用现代、庄重而易懂的叙事体。“奉献物”避免过度技术化，“副手”使古代圣殿行政关系在现代汉语中清楚可辨；同时以脚注保留 הַקֳּדָשִׁים 和 מִשְׁנֶה 的字面表达及语义幅度。
