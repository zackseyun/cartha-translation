  text: וַ/יַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת מַחְלְק֣וֹת הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם עַֽל מַחְלְקוֹתָ֞/ם אִ֣ישׁ כְּ/פִ֣י עֲבֹדָת֗/וֹ לַ/כֹּהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/עֹלָ֖ה וְ/לִ/שְׁלָמִ֑ים לְ/שָׁרֵת֙ וּ/לְ/הֹד֣וֹת וּ/לְ/הַלֵּ֔ל בְּ/שַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: zh_hans
  text: 希西家按着各自的班次，安排祭司和利未人的班次[a]；祭司和利未人各人都照自己的职务，负责燔祭和平安祭[b]的事奉，在耶和华诸营的门口[c]供职、称谢、颂赞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “班次”也可译作“班组”，指祭司和利未人按次序供职的编组。
    reason: lexical_alternative
  - marker: b
    text: “平安祭”也可译作“团契祭”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来原文作“耶和华诸营”；有人按圣殿语境解释为“耶和华的院宇”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: 设立
  rationale: 此处指希西家正式安排祭司和利未人的组织与职责；“设立”既体现行政性的任命安排，也不局限于使人站立的字面意思。
- source_word: מַחְלְקוֹת
  choice: 班次
  rationale: 该词指祭司和利未人有组织、轮班供职的群体。“班次”是现代中文宗教与行政语境中清楚而贴切的表达，并保留原文的重复。
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: 各人都照自己的职务
  rationale: 保留单数分配意义；这里所指为祭司和利未职分中的男性人员。“职务”自然表达各人被分派的圣殿工作。
- source_word: לְעֹלָה
  choice: 办理燔祭
  rationale: עֹלָה是整只焚烧献上的祭，中文圣经传统称“燔祭”；加入“办理”使它与人员职责的句法关系更清楚。
- source_word: וְלִשְׁלָמִים
  choice: 和平安祭
  rationale: שְׁלָמִים是献祭制度中的专门类别，“平安祭”直接保留其传统名称，避免只强调团契意义。
- source_word: לְשָׁרֵת
  choice: 供职
  rationale: 在圣殿礼仪语境中指执行神圣职务；“供职”比一般的“服侍”更能体现正式、受派的职责。
- source_word: וּלְהוֹדוֹת
  choice: 称谢
  rationale: 该动词在与“颂赞”并列的敬拜语境中表示向上帝感谢；“称谢”庄重而易懂。
- source_word: וּלְהַלֵּל
  choice: 颂赞
  rationale: 表达公开赞美上帝，与“称谢”并列，保留礼仪敬拜色彩。
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: 在耶和华诸营的门口
  rationale: מַחֲנוֹת为复数，故译“诸营”；“门口”自然表达בְּ与“门”结合时的地点意义，同时保留原文在圣殿语境中较不寻常的“营”这一意象。
theological_decisions:
- issue: אִישׁ的性别与分配意义
  choice: 各人都照自己的职务
  alternative: 每个男人都照自己的职务
  rationale: 上下文中的祭司和利未供职人员在历史制度中为男性；中文“各人”在此并未改变所指群体，又比“每个男人”自然，并准确表达逐一分配职责的意义。
- issue: שְׁלָמִים的祭名
  choice: 平安祭
  alternative: 团契祭
  rationale: “平安祭”更直接地呈现希伯来献祭类别，并延续清楚可辨的中文术语；“团契祭”虽能凸显共享筵席等含义，却较具解释性。
- issue: מַחֲנוֹת יְהוָה在圣殿语境中的理解
  choice: 耶和华诸营
  alternative: 耶和华的院宇
  rationale: 原文明确使用复数“营”，虽在圣殿语境中显得特殊，仍不应未经说明便解释为“院宇”。正文保留原有意象，并用脚注提示解释性译法。
- issue: 末尾地点短语与前列诸动词的关系
  choice: 置于“事奉”整体之后，不限定只修饰“颂赞”
  alternative: 仅理解为在门口称谢、颂赞
  rationale: 希伯来语的并列不完全排除地点短语修饰全部礼仪活动或只贴近后两个动词。中文采用总体性的结句，避免武断限定其作用范围。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“班次”“燔祭”“平安祭”“供职”等词保留圣殿制度的专门色彩；句式稍作重组，以清楚呈现祭司和利未人各按职责供职，同时保留原文“诸营”的异常意象及末尾修饰关系的一定开放性。
