source:
  edition: WLC
  text: מִ/לְּ/בַ֞ד הִתְיַחְשָׂ֣/ם לִ/זְכָרִ֗ים מִ/בֶּ֨ן שָׁל֤וֹשׁ שָׁנִים֙ וּ/לְ/מַ֔עְלָ/ה לְ/כָל הַ/בָּ֥א לְ/בֵית יְהוָ֖ה לִ/דְבַר י֣וֹם בְּ/יוֹמ֑/וֹ לַ/עֲב֣וֹדָתָ֔/ם בְּ/מִשְׁמְרוֹתָ֖/ם כְּ/מַחְלְקוֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: zh_hans
  text: 除按家谱登记的三岁以上男子[a]以外，凡进入雅威殿、每日按当日所需，照着各自的值班[c]和分班供职的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按家谱登记的男子”。
    reason: 保留 הִתְיַחְשָׂם לִזְכָרִים 的另一种句法组合；“三岁以上”的年龄限定仍属于正文范围。
  - marker: c
    text: 或译：“照着各自的守班”或“按各自轮值的职务”。
    reason: מִשְׁמָרוֹת 可指值守班次，也可泛指受派的职责。
lexical_decisions:
- source_word: מִלְּבַד
  choice: 除……以外
  rationale: 既可表达另列一类，也可表达排除关系，保留希伯来语在此处的衔接张力，不武断确定为“此外”或“排除”。
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: 按家谱登记的……男子
  rationale: 体现 יחס Hitpael 所指的按宗族谱系登记，也保留 לִזְכָרִים 明确的男性指称。
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: 三岁以上
  rationale: 用现代汉语自然表达年龄下限，包含三岁。
- source_word: לְכָל הַבָּא
  choice: 凡……进入……的人
  rationale: 将集合意义的分词自然地译出，并保留其概括性。
- source_word: לְבֵית יְהוָה
  choice: 进入雅威殿
  rationale: 在圣殿语境中，בֵּית 译作“殿”比“房屋”自然；יהוה 音译为“雅威”，保留神的专名。
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: 每天按当日所需
  rationale: 传达逐日办理当日事项或满足当日要求的行政性惯用语，同时借脚注保留字面结构。
- source_word: לַעֲבוֹדָתָם
  choice: 供职
  rationale: 在圣殿职责语境中自然表达 עֲבוֹדָה 的服事、职务含义，又避免引入后来的教会术语。
- source_word: בְּמִשְׁמְרוֹתָם
  choice: 照着各自的值班
  rationale: מִשְׁמָרוֹת 可指守班、轮值或受派职责；“值班”在现代汉语中清楚保留轮班含义。
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: 按各自的分班
  rationale: 指祭司或利未人组织化的班次分组；“分班”简明且符合上下文。
theological_decisions:
- issue: 圣殿人员的性别指称
  choice: 男子
  alternative: 人员／众人
  rationale: 原文 זְכָרִים 明确指男性，不应中性化。
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名；采用现代汉语中常见的学术性音译“雅威”，以专名而非称号呈现。
- issue: מִלְּבַד 所表达的关系
  choice: 除……以外
  alternative: 此外还有／不包括
  rationale: 该介词在此可能表示另列或排除；“除……以外”容纳两种关系，避免替上下文过早定论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。原文是承接上文的句法片段，正文保留这一未完句性质，不擅自补入“领受分配”等上文谓语；“值班”与“分班”并列，以区分 מִשְׁמָרוֹת 和 מַחְלְקוֹת。
