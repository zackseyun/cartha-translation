  terminology: “雅威”“按家谱登记”“男子”“供职”“值班”“分班”均符合原文及庄重现代书面语。保留“值班”与“分班”的区分是恰当的。脚注a可更准确地只说明“按家谱登记的男子”这一替代组合，避免其措辞看似省略年龄限定。
