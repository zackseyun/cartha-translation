  to: 除按家谱登记的三岁以上男子[a]以外，凡进入雅威殿、每日按当日所需，照着各自的值班[c]和分班供职的人。
  rationale: 调整“每日按当日所需”的位置，消除其错误修饰“进入”的歧义，同时保留原文逐日事务／需要与供职安排之间的紧密联系。微调脚注a，使其准确说明所涉短语的替代译法，且不暗示年龄限定被省略。
