  source_fidelity: 正文基本保留了希伯来文的年龄范围、男性家谱登记、进入雅威殿、逐日需要、供职、值班和分班等要素，也适当地保留了承接上文的句法片段性质。不过，“凡每天按当日所需进入雅威殿”会把“每天按当日所需”误连到“进入”，仿佛人员每天按需要进入圣殿；原文该短语是说明每日的事务／需要及其供职安排，需调整断句与修饰关系。
