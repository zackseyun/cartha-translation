  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: zh_hans
  text: 这一切办完后，所有在场的以色列人都前往犹大的各城，打碎柱像，砍倒亚舍拉祭祀物[a]，拆毁丘坛和祭坛；他们遍及犹大、便雅悯、以法莲和玛拿西，直到把这些全都除尽。随后，以色列众人各自回到自己的产业，回到自己的城里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”。希伯来语这个复数词指与亚舍拉有关的祭祀物，通常被理解为木柱或树木。
    reason: 保留אֲשֵׁרִים所指祭祀物具体形态上的词义余地。
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: 这一切事办完以后
  rationale: כ加不定式构造时间从句；“办完以后”自然表达完成之时，又不补出原文未明说的主语。
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: 所有在场的以色列人
  rationale: הַנִּמְצְאִים直指当时在那里、参加先前活动的人；“在场的”简明自然。
- source_word: וַיְשַׁבְּרוּ הַמַּצֵּבוֹת
  choice: 打碎柱像
  rationale: מַצֵּבוֹת是宗教用途的竖立石柱；“柱像”在中文圣经语境中能表达其祭祀性质，“打碎”体现שׁבר的力度。
- source_word: וַיְגַדְּעוּ הָאֲשֵׁרִים
  choice: 砍倒亚舍拉木
  rationale: אֲשֵׁרִים是与亚舍拉有关的祭祀物，通常为木柱或树木；“亚舍拉木”保留其专名和木质祭祀物的含义，同时以脚注提示形态上的不确定性。
- source_word: וַיְנַתְּצוּ אֶת הַבָּמוֹת וְאֶת הַמִּזְבְּחֹת
  choice: 拆毁丘坛和祭坛
  rationale: בָּמוֹת指高处的祭祀场所，“丘坛”是简洁而明确的对应；נָתַץ用“拆毁”表达彻底破坏。
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה עַד לְכַלֵּה
  choice: 把全犹大和便雅悯，以及以法莲和玛拿西境内的这些东西全都除尽
  rationale: 将希伯来文介词的细微转换自然化为地域范围；“全都除尽”准确表达עַד לְכַלֵּה的完成和彻底性，并让宾语清楚回指上述祭祀设施。
- source_word: וַיָּשׁוּבוּ כָּל בְּנֵי יִשְׂרָאֵל אִישׁ לַאֲחֻזָּתוֹ לְעָרֵיהֶם
  choice: 随后，以色列众人各自回到自己的产业，回到自己的城里
  rationale: בְּנֵי יִשְׂרָאֵל作为民族称谓译为“以色列众人”自然且不扩大或缩小范围；אִישׁ的分配意义以“各自”表达，אֲחֻזָּה则译为具有土地归属意味的“产业”。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל与אִישׁ的性别形式
  choice: 以色列众人各自回到自己的产业
  alternative: 以色列的众子，各人回到自己的产业
  rationale: 这里的阳性形式用于民族整体及分配表达。现代汉语“以色列众人……各自”准确传达所指群体和逐一返回之意，同时不额外断定妇女是否包括在行动者之内。
- issue: 对亚舍拉祭祀物形态的表达
  choice: 亚舍拉木，并加脚注保留其可能为木柱或树木的语义范围
  alternative: 亚舍拉柱
  rationale: 原词可指与亚舍拉有关的多种祭祀物，正文采用传统而可懂的概括表达，不把有争议的具体形态绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“柱像”“丘坛”“产业”等词保留古代宗教和土地制度语境，又避免过度技术化。脚注标记紧随其实际解释的“亚舍拉木”之后。
