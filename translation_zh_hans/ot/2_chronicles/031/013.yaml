  to: 耶歇、亚撒细雅、拿哈、亚撒黑、耶利末、约撒拔、以利列、伊斯玛基雅、玛哈和比拿雅都是管理人员，受哥楠雅和他的兄弟示每管辖[a]，由希西家王和上帝的殿的主管亚撒利雅委派[b]。
