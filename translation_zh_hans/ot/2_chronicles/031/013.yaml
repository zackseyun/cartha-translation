  text: וִֽ/יחִיאֵ֡ל וַ֠/עֲזַזְיָהוּ וְ/נַ֨חַת וַ/עֲשָׂהאֵ֜ל וִֽ/ירִימ֤וֹת וְ/יוֹזָבָד֙ וֶ/אֱלִיאֵ֣ל וְ/יִסְמַכְיָ֔הוּ וּ/מַ֖חַת וּ/בְנָיָ֑הוּ פְּקִידִ֗ים מִ/יַּ֤ד כונניהו וְ/שִׁמְעִ֣י אָחִ֔י/ו בְּ/מִפְקַד֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/עֲזַרְיָ֖הוּ נְגִ֥יד בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: zh_hans
  text: 耶歇、亚撒细雅、拿哈、亚撒黑、耶利末、约撒拔、以利列、伊斯玛基雅、玛哈和比拿雅都是管理人员，受哥楠雅和他的兄弟示每管辖[a]，由希西家王和上帝的殿的主管亚撒利雅委派[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“在哥楠雅和他的兄弟示每的手下。”
    reason: lexical_alternative
  - marker: b
    text: “委派”也可译作“命令”或“监督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: 管理人员
  rationale: 指受任命并负有行政管理责任的人员；“管理人员”符合圣殿物资管理的语境，也不夸大其官阶。
- source_word: מִיַּד
  choice: 受……的管辖
  rationale: 原义为“从/在……手下”，在此表示权柄、管理或监督关系；译文自然呈现其行政隶属关系。
- source_word: אָחִיו
  choice: 他兄弟
  rationale: 按字面保留示每与歌楠雅的亲属关系，不作泛化处理。
- source_word: בְּמִפְקַד
  choice: 由……委派
  rationale: 该词可表示委任、命令或监督；本节列出上下级行政关系，“委派”最自然地表达正式授权，同时以脚注保留其他可能。
- source_word: נְגִיד
  choice: 主管
  rationale: 该词表示领袖或主要负责人；在圣殿行政语境中，“主管”清楚自然，又避免“王侯”等可能造成的身份误解。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝殿
  rationale: 紧贴“上帝的殿”这一原文表达，同时在现代汉语中明确指圣殿。
- source_word: יְחִיאֵל、עֲזַזְיָהוּ、נַחַת、עֲשָׂהאֵל、יְרִימוֹת、יוֹזָבָד、אֱלִיאֵל、יִסְמַכְיָהוּ、מַחַת、בְּנָיָהוּ、כונניהו、שִׁמְעִי、יְחִזְקִיָּהוּ、עֲזַרְיָהוּ
  choice: 耶歇、亚撒细雅、拿哈、亚撒黑、耶利末、约撒拔、以利列、伊斯玛基雅、玛哈、比拿雅、歌楠雅、示每、希西家、亚撒利雅
  rationale: 采用简体中文圣经传统中较为通行、便于识别的人名音译；人名不作意义翻译。
theological_decisions:
- issue: 圣殿行政职衔的性质
  choice: 以“管理人员”“主管”等普通行政用语翻译
  alternative: 译作“首领”“统治者”等更具权位色彩的称谓
  rationale: 本节重点在人员名单及其权责层级；采用普通行政用语可避免把原文没有明说的祭司等级、王权身份或宗教职阶带入译文。
- issue: בְּמִפְקַד 所表达的授权关系
  choice: 正文译为“委派”，脚注保留“命令/监督”的可能
  alternative: 直接确定为“奉命”或“在监督下”
  rationale: 希伯来词在此可涉及委任、命令或监督。正文依行政语境采用最顺畅的“委派”，但不排除其余语义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。名单以顿号排列，末项用“和”连接；句子清楚呈现两层行政关系：这些人员受歌楠雅和示每管辖，并由希西家王与圣殿主管亚撒利雅正式授权。
