  yaml_path: translation/ot/2_chronicles/031/007.yaml
  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: zh_hans
  text: 三月，他们开始为堆垛[a]打底[b]；七月，便完成了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堆垛”指把所献的农产品积成的一堆一堆；也可译作“堆”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“开始为这些堆奠基”，意思是从底部开始把堆垛堆起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: 三月
  rationale: חֹדֶשׁ在这类纪年表述中指月份；现代汉语以“三月”自然表达“第三个月”。
- source_word: הֵחֵלּוּ
  choice: 他们开始
  rationale: החל的使役形在此结构中表示“开始”，主语承接上下文中的众人。
- source_word: הָעֲרֵמוֹת
  choice: 这些堆垛
  rationale: עֲרֵמוֹת指堆积起来的成堆物品；结合上下文，是百姓所献农产品形成的堆垛。“堆垛”保留具体形象，也适用于谷物等物资。
- source_word: לְיִסּוֹד
  choice: 打底
  rationale: יסד意为奠基、打基础；与“堆垛”连用时，“打底”自然表达从底部开始堆起，同时保留原文的基础意象。
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 到了七月
  rationale: 以“到了”自然呈现时间推进；原文连接词ו的承接关系由分号和该短语共同表达。
- source_word: כִּלּוּ
  choice: 才全部堆完
  rationale: כלה的加强形表示完成。汉语补出由上下文可知的动作“堆”，并以“全部……完”表达完成；“才”凸显从三月延续到七月的终点，但不改变事件内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“给这些堆垛打底”既符合汉语习惯，也保留希伯来文“奠基”的具体意象；脚注说明其惯用含义，避免让读者误以为是在建造永久性建筑。
