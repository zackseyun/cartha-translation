base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: zh_hans
  text: 希西家在全犹大都这样行；他在耶和华他的上帝面前，行良善、正直、忠实[a]的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠实”或译“真实”。希伯来语אֱמֶת可表示真实、可靠或忠信；这里可能是形容诚实可靠、忠信不欺的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: 这样行
  rationale: 概括上文所述的改革与安排，既保留回指作用，也符合现代汉语表达。
- source_word: בְּכָל יְהוּדָה
  choice: 在全犹大都
  rationale: 表达行动遍及犹大全境；“都”自然突出范围的完整性。
- source_word: הַטּוֹב
  choice: 良善
  rationale: 此处带定冠词并作名词性用法，指道德上良善的事，与后两项构成并列。
- source_word: הַיָּשָׁר
  choice: 正直
  rationale: 在伦理语境中指正当、端正；“正直”既保留品格与行为层面的含义，也适合庄重文体。
- source_word: הָאֱמֶת
  choice: 忠实
  rationale: אֱמֶת可指真实、可靠或忠信；在描述行为的伦理三联词中，“忠实”较自然地表达可靠、诚实守信的实践含义，同时以脚注保留“真实”的可能。
- source_word: לִפְנֵי יְהוָה
  choice: 耶和华……眼中看为
  rationale: לִפְנֵי在此具有处于上帝面前并受其鉴察、评价的含义；采用现代汉语熟悉的评价性表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中通行的专名形式呈现四字神名，而非以“主”这一称号替代。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 准确保留第三人称阳性单数后缀以及希西家与上帝之间的关系。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神名。中文采用广为人知且可辨识为专名的“耶和华”，不以“主”替换；“雅威”是较贴近学术重构读音的另一选择。
- issue: הָאֱמֶת 在行为描述中的含义
  choice: 忠实
  alternative: 真实
  rationale: 该词可表示真理、真实性、可靠性或忠信。与“良善、正直”并列并受“行”支配时，“忠实”较能体现行为可靠、诚实守信的含义；脚注保留“真实”的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在全犹大都这样行”承接上文；后半句用“眼中看为”明确 לִפְנֵי 的鉴察与评价意味。脚注标记置于相关词后，避免误以为注释针对地名“犹大”。
