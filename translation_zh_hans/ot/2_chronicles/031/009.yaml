- source_word: הָעֲרֵמוֹת
  choice: 这些堆积之物
  rationale: עֲרֵמוֹת字面指成堆的东西；上下文涉及奉献物的堆积。正文保留概括性，不提前把具体内容说死，同时用“这些”承接上文已提到的堆。
