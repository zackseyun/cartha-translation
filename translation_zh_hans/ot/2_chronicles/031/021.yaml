  text: וּ/בְ/כָֽל מַעֲשֶׂ֞ה אֲשֶׁר הֵחֵ֣ל בַּ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים וּ/בַ/תּוֹרָה֙ וּ/בַ/מִּצְוָ֔ה לִ/דְרֹ֖שׁ לֵֽ/אלֹהָ֑י/ו בְּ/כָל לְבָב֥/וֹ עָשָׂ֖ה וְ/הִצְלִֽיחַ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: zh_hans
  text: 他在上帝的殿中的事奉上，以及在律法[a]和诫命上，为寻求[b]他的上帝所着手的一切工作，他都全心去做，并且亨通[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“教导”；希伯来语תּוֹרָה兼有这两层含义。
    reason: lexical_alternative
  - marker: b
    text: “寻求”也可译作“求问”。希伯来语动词可兼指寻求上帝和向他求问。
    reason: lexical_alternative
  - marker: c
    text: 或译：“成功”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה אֲשֶׁר הֵחֵל
  choice: 他所着手的一切事
  rationale: מַעֲשֶׂה指所做的事、工作或行动；הֵחֵל意为“开始”。“所着手的一切事”在现代汉语中自然，并保留了开始办理各项事务的含义。
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: 上帝殿里的事奉
  rationale: עֲבוֹדָה可指劳作、职务或礼仪性事奉；此处涉及圣殿事务。“事奉”保留敬拜语境，又不把范围限于祭司礼仪。
- source_word: וּבַתּוֹרָה
  choice: 律法
  rationale: תּוֹרָה可指教导或律法。在希西家改革及圣殿秩序的语境中，“律法”最贴切；“教导”作为词义上的可能译法收入脚注。
- source_word: וּבַמִּצְוָה
  choice: 诫命
  rationale: מִצְוָה为单数，但此处可作集合性用语。“诫命”在汉语中不强制标示单复数，既贴近原文形式，也表达所命定的要求。
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: 为了寻求他的上帝
  rationale: דרשׁ用于上帝时可指寻求、求问或求取指引。“寻求”保留《历代志》中持续出现的委身主题；目的式“为了”对应不定词前的ל。
- source_word: בְּכָל לְבָבוֹ עָשָׂה
  choice: 他都全心去做
  rationale: 按马所拉重音，לֵאלֹהָיו后有句中主要停顿，因此“全心”在句法上较自然地修饰“做”。译文保留这一结构，不把它无标记地改接到“寻求”上。
- source_word: וְהִצְלִיחַ
  choice: 并且亨通
  rationale: הצליח在此可表示亨通或成功。“亨通”保留经文对其行事结果的概括性评价，而“成功”列作脚注中的现代替代译法。
theological_decisions:
- issue: תּוֹרָה在宗教改革语境中的含义
  choice: 正文译作“律法”
  alternative: 教导
  rationale: 上下文涉及按上帝所定秩序恢复圣殿事奉，“律法”符合这一盟约与规范性语境；同时以脚注保留该词“教导”的较宽含义。
- issue: לִדְרֹשׁ לֵאלֹהָיו所表达的行动
  choice: 译作“寻求他的上帝”
  alternative: 求问他的上帝
  rationale: “寻求”呈现《历代志》中对上帝忠诚归向的核心用法；“求问”也是דרשׁ的真实词义，故在脚注中保留，避免把表达缩窄为单一含义。
- issue: “全心”的句法归属
  choice: 接续“去做”
  alternative: 理解为“全心寻求他的上帝”
  rationale: 马所拉重音在“他的上帝”之后设置主要停顿，支持“全心”修饰后面的“做”；但语义上全心行事也涵盖前述寻求上帝的目标，译文不额外作教义化限定。
- issue: וְהִצְלִיחַ的结果含义
  choice: 译作“亨通”
  alternative: 成功
  rationale: “亨通”能保留原词可能包含的顺遂、进展良好之意，而不具体断定成功的形式；脚注给出“成功”这一直接译法。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“上帝殿”避免仅以专名“圣殿”代替原文的“上帝的殿”；“事奉”保留敬拜与圣殿职务的双重色彩。用“无论……还是……”展开希伯来语连续介词结构，并以分号清楚呈现马所拉重音所示的句法停顿。
