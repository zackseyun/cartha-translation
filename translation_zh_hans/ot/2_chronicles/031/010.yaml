source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֲזַרְיָ֧הוּ הַ/כֹּהֵ֛ן הָ/רֹ֖אשׁ לְ/בֵ֣ית צָד֑וֹק וַ֠/יֹּאמֶר מֵ/הָחֵ֨ל הַ/תְּרוּמָ֜ה לָ/בִ֣יא בֵית יְהוָ֗ה אָכ֨וֹל וְ/שָׂב֤וֹעַ וְ/הוֹתֵר֙ עַד לָ/ר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת עַמּ֔/וֹ וְ/הַ/נּוֹתָ֖ר אֶת הֶ/הָמ֥וֹן הַ/זֶּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: zh_hans
  text: 撒督家族的祭司长亚撒利雅对他说：“自从开始把奉献之物[a]带进耶和华的殿，我们吃得饱足，还有许多剩下；因为耶和华赐福给他的子民，所剩下的便有这么多。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉献之物”也可译作“供物”；希伯来语指分别出来作神圣用途的捐献物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: 祭司长
  rationale: 直译为“为首的祭司”；“祭司长”在现代中文中简洁自然，保留其领导地位，同时避免译作原文未明确使用的专门称号“大祭司”。
- source_word: לְבֵית צָדוֹק
  choice: 撒督家族的
  rationale: 这里的介词与“家”表示家族归属；译作“撒督家族的”自然地表达亚撒利雅所属的祭司世系。
- source_word: מֵהָחֵל
  choice: 自从人们开始
  rationale: מן与不定式连用，标明动作的起点；根据语境补出泛指主语“人们”，使中文清楚自然。
- source_word: הַתְּרוּמָה
  choice: 奉献之物
  rationale: 该词指分别出来归于神圣用途的捐献物；“奉献之物”既体现其宗教用途，也符合本段粮食等实物供给的语境。
- source_word: לָבִיא בֵית יְהוָה
  choice: 带进耶和华的殿
  rationale: בוא的使役意义与地点短语共同表达把物品带入圣殿；“带进”保留方向感。
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: 我们不但吃得饱足
  rationale: 这组形式概括吃用并满足的结果；按说话者代表祭司和利未人的语境补出“我们”，并用“吃得饱足”准确传达饱足之意。
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: 而且还剩下许多
  rationale: יתר及程度表达表示大量余剩；与前句用“不但……而且……”连接，使结果关系在现代中文中自然清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译“耶和华”，明确呈现专名而非以“主”这一称号替代。
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: 赐福给了他的子民
  rationale: 完成式说明大量余剩的原因；“赐福给了”体现已经发生且结果持续可见的恩福。
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: 剩下的就是这一大堆
  rationale: הנותר指“剩下的”，המון在此指大量物资；“这一大堆”保留眼前可见、数量巨大的具体感，不把它误解为人群。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应以专名呈现，而不以“主”替代。“耶和华”是现代中文普通读者最熟悉的专名形式；“雅威”更接近学界常用的拟音，也属可行译法。
- issue: הַכֹּהֵן הָרֹאשׁ 是否译为“大祭司”
  choice: 祭司长
  alternative: 大祭司
  rationale: 原文是“为首的祭司”，强调领导地位，却没有采用通常表示“大祭司”的明确专门形式；故以“祭司长”保留层级含义而避免过度技术化。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“不但……而且……”自然呈现吃得饱足与大量余剩的递进关系；“这一大堆”使结尾所指的可见物资保持具体鲜明。脚注标记置于整节末尾，对应正文中的“奉献之物”。
