base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: zh_hans
  text: 希西家和众首领前来，看见了那些成堆的物品[a]，就称颂耶和华，也为他的子民以色列人祝福[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“那些堆”或“一堆堆的东西”；按上下文，指百姓献上的出产所堆成的各堆。
    reason: lexical_alternative
  - marker: b
    text: “他的”最自然地指耶和华；也可能指希西家，意为“他的百姓，就是以色列人”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来
  rationale: בוא在连续叙事中表示来到现场；现代汉语用“来”简洁自然，无须增添原文没有明确表达的目的地。
- source_word: יְחִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְהַשָּׂרִים
  choice: 和众首领
  rationale: שׂרים泛指居领导地位的人；“众首领”既符合古代语境，又比“王子们”准确，并避免把范围过度限定为行政官员。
- source_word: וַיִּרְאוּ
  choice: 看见
  rationale: ראה在这里表示直接的视觉察看，“看见”最为自然。
- source_word: הָעֲרֵמוֹת
  choice: 那些堆积之物
  rationale: ערמות指堆成的一堆堆物品；结合上下文是奉献的出产。“堆积之物”保留具体景象，同时避免中文“堆”单独使用时含义不够完整。
- source_word: וַיְבָרֲכוּ
  choice: 称颂……也为……祝福
  rationale: ברך同时支配耶和华和以色列，但中文对神通常说“称颂”，对人说“祝福”。按两个宾语分别自然表达其语用意义，同时保留同一希伯来动词统摄两者的结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经传统中对四字神名的通行音译，使普通读者能够辨认这是神的专名。
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: 他的子民以色列
  rationale: “他的”最自然地回指紧邻的耶和华，“以色列”作为“子民”的同位语，表达以色列是属于他的子民；脚注保留语法上可能回指希西家的读法。
theological_decisions:
- issue: “他的子民”中代词后缀的所指
  choice: 正文将“他的”理解为指耶和华，即“他的子民以色列”。
  alternative: “他的”也可能指希西家，即“他的百姓，就是以色列人”。
  rationale: 耶和华是该后缀之前最近的阳性单数先行词，而且“耶和华的子民”是常见的盟约表达，因此正文采用此读法；不过希伯来文在语法上不能完全排除回指希西家，故以脚注保留。
- issue: 同一动词ברך用于耶和华与以色列
  choice: 译为“称颂耶和华，也为他的子民以色列祝福”。
  alternative: 可形式一致地译为“祝颂耶和华和他的子民以色列”，或将对百姓的动作理解为“称赞”。
  rationale: 原文用同一个动词连接两个宾语，形成有意的紧密结构；但现代汉语中“祝福神”容易被误解为向神赐福，因此依宾语分别译出“称颂”和“为……祝福”，不额外规定祝福的具体内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众首领”适合古代政治宗教语境；“堆积之物”避免生硬的“堆堆”。为使ברך对神与对人的不同语用在中文中清楚自然，分别用“称颂”和“为……祝福”，并以“也”保留两个并列宾语之间的连接。所有脚注标记均已置于正文相应位置。
