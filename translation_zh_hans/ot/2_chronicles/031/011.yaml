  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: zh_hans
  text: 于是，希西家吩咐要在耶和华的殿里预备房间[a]；他们便把这些房间预备好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“内室”“库房”。这里的希伯来词泛指圣殿建筑群中的房室；这些房间在本段语境中用于储藏物品。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 吩咐
  rationale: 该动词字面为“说”，但后接带 לְ 的不定式，表达君王所发出的指示；译作“吩咐”符合本处语用，同时不过度强化为严厉命令。
- source_word: יְחִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: לְהָכִין
  choice: 预备
  rationale: כון 的使役式在此意为使之就绪；结合上下文，译作“预备”自然准确。
- source_word: לְשָׁכוֹת
  choice: 房间
  rationale: לְשָׁכוֹת 指圣殿建筑群中的若干房室；“房间”是现代中文中自然且不预先限定用途的表达。上下文显示这些房间用于存放物品，但该名词本身并不明确表示“库房”。
- source_word: בְּבֵית יְהוָה
  choice: 在耶和华的殿里
  rationale: בֵּית יְהוָה 字面为“耶和华的家/殿”；在圣殿语境中，“耶和华的殿”既保留希伯来表达，也清楚表明所指建筑。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉、已固定化的神名音译“耶和华”，而非以“主”这一称号替代专名。
- source_word: וַיָּכִינוּ
  choice: 他们就预备好了
  rationale: 复数主语隐含于动词中，宾语承接前面的“房间”。中文用“预备好了”自然表达行动完成，并避免生硬重复“预备它们”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应保留为专名而非译作“主”。“耶和华”是简体中文圣经传统和普通现代读者中最通行、辨识度最高的形式；“雅威”更接近学界常见的拟音，但未在正文中采用，以维持自然可懂的公共语体。
- issue: “房间”的具体用途
  choice: 不在正文中明确译成“库房”
  alternative: 库房
  rationale: 本节上下文表明这些房间承担储藏用途，但 לְשָׁכוֹת 本身泛指房室。正文保留词义宽度，以免把语境推断写成词汇明义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是……就……”体现叙事推进及命令随即得到执行。“吩咐人在……”自然补出未明说的受命者，不将其限定为某一特定群体；末句用“预备好了”避免机械重复，同时保持完成意味。
