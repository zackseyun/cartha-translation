base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: zh_hans
  text: 祭司按其父系家族[a]登记在册；利未人[b]则从二十岁及以上，按他们的职守和班次登记在册。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父系家族”指按父系祖先划分、用于正式登记和安排服役的宗族单位。
    reason: cultural_note
  - marker: b
    text: 原文在“利未人”之后承接前文的按谱系登记；中文补出“登记在册”，以表达完整。
    reason: translation_clarity
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: 登记族谱
  rationale: 此词指按谱系记入名册。希伯来文在 וְאֵת 之后结构紧缩、省略，译文补出“登记”以清楚表达行政语境，同时保留族谱依据。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 对有定冠词的祭司群体采用现代中文的标准译法。
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: 按父系家族
  rationale: 此语指以父系祖先为基础的宗族家室单位，用于登记和组织服役；“父系家族”比直译“父家”更易为现代读者理解。
- source_word: וְהַלְוִיִּם
  choice: 利未人则……登记
  rationale: 原文承接前面的族谱登记而有所省略；补出“则……登记”使两个群体的平行关系在中文中清楚，但不增加新的实质内容。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: 从二十岁以上的
  rationale: 表达年满二十岁及更年长者这一年龄门槛，并尽量贴近希伯来文“从……往上”的公式。
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: 按他们的职守
  rationale: מִשְׁמֶרֶת 在此可指所承担的职责、值班或服役任务；“职守”保持其行政和事奉含义的宽度。
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: 和班次
  rationale: מַחֲלֹקֶת 指有组织的分组或轮班单位；“班次”符合历代志中祭司、利未人分班服役的语境。两个名词前均有 בְּ，中文用“按……和……”统摄，避免无根据地区分介词关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将原文的压缩、省略结构适度展开，但以脚注说明所补内容；“职守和班次”保留两个并列的行政服役范畴。
