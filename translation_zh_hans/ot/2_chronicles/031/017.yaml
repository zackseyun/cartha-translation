  to: 祭司按其父系家族[a]登记在册；利未人[b]则从二十岁及以上，按他们的职守和班次登记在册。
  rationale: 修订以“登记在册”取代“登记族谱”，更准确自然地表达按谱系列名登记的行政意义，避免将祭司误读为登记行为的主动施事。保留原文的省略式平行结构所表达的两类登记条件，并调整脚注b的锚点以对应其实际说明内容。
