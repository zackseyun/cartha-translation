  naturalness: “他又吩咐耶路撒冷的居民”及“把……应得的一份交给他们”均为自然、庄重的现代汉语。“好使他们能够专注于……”比“使他们能专心遵守……”更顺畅，也避免不必要地界定他们对律法的具体关系。
  terminology: “祭司”“利未人”“耶和华”“律法”均符合中文圣经的常用且可辨识的术语。“应得的一份”恰当反映所分定的份额。
