  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: zh_hans
  text: 他又吩咐耶路撒冷的居民，把祭司和利未人应得的一份交给他们，好使他们能够专注于耶和华的律法[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好使他们能够专注于耶和华的律法”，或译“好使他们在耶和华的律法上刚强”，又或“好使他们坚守耶和华的律法”。
    reason: 原文动词חזק可表示刚强、得以坚固或牢牢持守；在此与“耶和华的律法”连用，其具体含义存在真实的词义歧义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他又吩咐
  rationale: אמר本义为“说”，但这里后接要求百姓采取行动的不定式结构，且说话者是王，因此译为“吩咐”较自然地传达语境中的命令意味；“又”体现叙事承接。
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: 住在耶路撒冷的百姓
  rationale: 后面的“住在耶路撒冷的”限定“百姓”；合并表达比生硬保留同位结构更符合现代汉语，同时不改变所指范围。
- source_word: לָתֵת מְנָת הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 要把祭司和利未人应得的份供给他们
  rationale: מְנָה指分定或当得的一份；“应得的份”保留制度性配给之意。“供给他们”自然表达百姓提供该份额，代词所指明确。
- source_word: לְמַעַן
  choice: 使
  rationale: 引出目的，简洁自然地对应“为了使／好使”。
- source_word: יֶחֶזְקוּ בְּתוֹרַת יְהוָה
  choice: 使他们能专心遵守耶和华的律法
  rationale: חזק在此可表达坚固、持守或全力投入；物质供给使祭司和利未人能够专注于律法所规定的职责。“专心遵守”传达语境功能，但原文的具体语义仍有歧义，故以脚注说明其他译法。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，作为四字神名的专名表达，而非以称号替代。
theological_decisions:
- issue: יֶחֶזְקוּ בְּתוֹרַת יְהוָה的语义
  choice: 使他们能专心遵守耶和华的律法
  alternative: 使他们在耶和华的律法上刚强；使他们坚守耶和华的律法
  rationale: 原短语可指“在……上刚强”、牢牢持守，也可在本段供给祭司和利未人的语境中表示使他们能够专心履行律法职责。正文采用自然的语境化表达，脚注保留真实的词义张力。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均用于转写四字神名；正文采用现代中文圣经传统中辨识度最高的“耶和华”，不将专名改为“主”等称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“应得的份”保留祭司和利未人依法所得份额的含义；避免使用过度古雅的“分例”等词。脚注标记置于相关歧义短语之后。
