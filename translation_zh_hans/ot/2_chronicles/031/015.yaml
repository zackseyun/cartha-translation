base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: zh_hans
  text: 在他的管理下，伊甸、米拿民、耶书亚、示玛雅、亚玛利雅和示迦尼雅在祭司的各城，忠实地按班次分给他们的弟兄[b]，无论大小，都包括在内。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “他们的弟兄”在这里指祭司群体中的同伴。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: 在他手下
  rationale: 此希伯来习语可表示在某人的协助、监管或权柄之下；行政语境中译作“在他手下”自然，并保留一定语义宽度。
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: 伊甸、米拿民、耶书亚、示玛雅、亚玛利雅和示迦尼雅
  rationale: 人名依照现代中文圣经常见音译处理，不翻译其词义。
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: 在祭司的各城
  rationale: 直接表达所属关系；“各城”也符合上下文所指的多个祭司城邑。
- source_word: בֶּאֱמוּנָה
  choice: 忠实地
  rationale: 在行政分配的语境中，该词描述办事可靠、忠诚的方式。
- source_word: לָתֵת
  choice: 分给
  rationale: 字面义为“给”，但上下文涉及有组织地发放份额，“分给”准确且自然。
- source_word: לַאֲחֵיהֶם
  choice: 给他们的弟兄
  rationale: 保留原文“弟兄”的亲属称谓；此处按语境指祭司群体中的同胞。
- source_word: בְּמַחְלְקוֹת
  choice: 按班次
  rationale: מַחְלְקוֹת在祭司行政语境中指编定的班组或班次；“按班次”比抽象的“按分组”更贴合历代志用语。
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: 无论大小，一视同仁
  rationale: 此对举表示大者小者都包括在内、不受差别待遇；译文保留范围并自然表达公平分配之意。
