revisions:
- from: 在他手下[a]有伊甸、米拿民、耶书亚、示玛雅、亚玛利雅和示迦尼雅；他们在祭司的各城忠实地按班次分给他们的弟兄[b]，无论大小，一视同仁。
  to: 在他的管理下，伊甸、米拿民、耶书亚、示玛雅、亚玛利雅和示迦尼雅在祭司的各城，忠实地按班次分给他们的弟兄[b]，无论大小，都包括在内。
  rationale: 将开头调整为“在他的管理下”，使行政关系在现代汉语中更自然。将末尾改为“无论大小，都包括在内”，保留原文大者、小者皆在分配范围内的意思，而不额外强化为明确的公平原则。同步修订脚注a、b，使其与原文语义及现代汉语用法一致。
