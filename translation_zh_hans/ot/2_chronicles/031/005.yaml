source:
  edition: WLC
  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: zh_hans
  text: 这事一传开，以色列人[a]就把五谷、新酒、油、蜜[b]和田地一切出产的初熟之物大量送来；他们也把所有物产的十分之一大量送来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的儿子们”，是指以色列民众的惯用集体称谓。
    reason: lexical_alternative
  - marker: b
    text: “蜜”在某些语境中也可指椰枣蜜等甜浆，不一定专指蜂蜜。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: 这事一传开
  rationale: פרץ本有“冲破、迸发”之意，此处与דבר搭配，表示这事迅速传开；כי加不定式结构表达“当……时／一……就……”的时间关系。
- source_word: הִרְבּוּ
  choice: 大量送来
  rationale: רבה的使役形表示增多、使之丰富；结合后文明确的הֵבִיאוּ“送来”，译出语境隐含的动作，同时保留数量很多的重点。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的儿子们”，在历史叙事中是指以色列全体民众的固定集体称谓；现代汉语用“以色列人”准确而自然，直译信息收入脚注。
- source_word: רֵאשִׁית
  choice: 初熟之物
  rationale: 在奉献语境中指从收成中首先分别出来献上的部分；“初熟之物”既保留祭礼含义，也适用于后列的多种农产。
- source_word: דָּגָן
  choice: 五谷
  rationale: 该词泛指谷类收成；“五谷”是现代汉语中自然的统称，并非限定恰好五种谷物。
- source_word: תִּירוֹשׁ
  choice: 新酒
  rationale: 通常指新近酿成的酒或葡萄汁所得的酒，“新酒”保留其农业收获语境。
- source_word: יִצְהָר
  choice: 油
  rationale: 通常指新榨的油，尤其是橄榄油；原文未明说橄榄，正文保留较宽泛的“油”。
- source_word: דְבַשׁ
  choice: 蜜
  rationale: 可指蜂蜜，也可能指椰枣等果实制成的甜浆；正文用含义宽泛而传统的“蜜”，并以脚注说明歧义。
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: 和田地一切出产
  rationale: תבואה指土地的出产或收成，此译法自然地保留农业含义和“全部”的范围。
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: 各样物产的十分之一
  rationale: מעשר是献上十分之一的专门用语；结合本节农产清单，将הכל译为“各样物产”，避免汉语“所有东西”可能造成的不必要扩大。
- source_word: לָ/רֹב
  choice: 大量送来
  rationale: 表示数量丰盛；与动词“送来”结合，清楚呈现他们所献十分之一数量众多。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל的性别化集体称谓
  choice: 正文译作“以色列人”，脚注注明原文直译
  alternative: 以色列的子孙／以色列众子
  rationale: 该希伯来语固定表达在这里整体指以色列民，并非仅强调男性。现代汉语“以色列人”避免读者误解其范围，同时脚注保存原文形式。
- issue: רֵאשִׁית在农产奉献语境中的含义
  choice: 初熟之物
  alternative: 最先的一份／上好的部分
  rationale: 该词可泛指开端或首份，但本段论及按律法献上的农产，祭礼术语“初熟之物”最贴合上下文，又不额外规定品质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这事一传开……就……”体现希伯来语的时间推进和迅速扩散感；两次使用“大量送来”保留原文对奉献丰盛的重复强调。
