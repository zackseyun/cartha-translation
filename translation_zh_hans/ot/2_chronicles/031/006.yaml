revisions:
- from: 住在犹大各城的以色列人和犹大人，也把牛群和羊群的十分之一，以及分别为圣归给他们的上帝雅威的圣物的十分之一带来，堆成一堆又一堆。
  to: 住在犹大各城的以色列人和犹大人，也带来了牛群和羊群的十分之一，以及献给他们的上帝雅威、已分别为圣的圣物的十分之一；他们把这些物品堆放成一堆又一堆。
  rationale: 仅调整“圣物”的修饰语次序，并将末尾动作明确为“把这些物品堆放成”，以使中文句法顺畅。未改变献物类别、分别为圣的状态、归属对象或重复语的强化意义。
