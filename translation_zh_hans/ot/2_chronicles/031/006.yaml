base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: zh_hans
  text: 住在犹大各城的以色列人和犹大人，也带来了牛群和羊群的十分之一，以及献给他们的上帝雅威、已分别为圣的圣物的十分之一；他们把这些物品堆放成一堆又一堆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: 以色列人和犹大人
  rationale: בני在这里是群体称谓，并非只指男性；译作“以色列人和犹大人”自然地保留两个群体的并列。
- source_word: הַיּוֹשְׁבִים בְּעָרֵי יְהוּדָה
  choice: 住在犹大各城的
  rationale: ישב的分词表示居住；“各城”准确而自然地表达复数עָרֵי。
- source_word: גַּם הֵם
  choice: 也
  rationale: 表示这些居民同样参与奉献；汉语用“也”即可自然传达强调。
- source_word: מַעְשַׂר בָּקָר וָצֹאן
  choice: 牛群和羊群的十分之一
  rationale: מַעְשַׂר本义为十分之一；בקר指牛类，צאן是羊群等小型牲畜的集合词。采用“牛群和羊群”保留集合意义，同时避免把צאן过窄地限定为绵羊。
- source_word: וּמַעְשַׂר קָדָשִׁים
  choice: 圣物的十分之一
  rationale: קָדָשִׁים在此指分别出来、具有神圣归属的物品；“圣物”简洁而不擅自限定具体种类。
- source_word: הַמְקֻדָּשִׁים לַיהוָה אֱלֹהֵיהֶם
  choice: 分别为圣归给他们的上帝雅威的
  rationale: 被动分词表明这些物品已经分别为圣，ל表示归属或献给；此译保留奉献和归属两层含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按辅音神名YHWH的通行学术重构音译，保留经文中的专名性质。
- source_word: הֵבִיאוּ
  choice: 带来
  rationale: 使役词形在此为“带来”，符合奉献者将物品送到指定地点的语境。
- source_word: וַיִּתְּנוּ עֲרֵמוֹת עֲרֵמוֹת
  choice: 堆成一堆又一堆
  rationale: נתן在此结合“堆”表示放置、堆放；名词重复表达数量多、接连成堆，汉语以“一堆又一堆”自然重现其强化效果。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”保留其专名身份，不以称号替代；“耶和华”是传统混合读音，“上主”则体现代读传统。
- issue: קָדָשִׁים所指的范围
  choice: 圣物
  alternative: 圣礼物；分别为圣之物
  rationale: 原文没有明确限定这些物品的具体类别，因此采用较宽泛的“圣物”，保留其可能包括各种奉献物的含义。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。句法按汉语信息顺序重组，但保留“也”、两类十分之一，以及末尾重复名词的强调。将“分别为圣归给……的”置于“圣物”之后会更贴近希伯来语，却在中文中容易产生修饰歧义，因此前置为定语。
