    rationale: מָנוֹת指分配的份额；上下文支持供应和分发，但该词本身未明确表达“应得”的权利性质。
  revised_text: 至于亚伦的子孙，即祭司，在他们各城周围的牧场中，每一座城都有按名指定的人，向祭司中的所有男丁分发份额，也分给利未人中所有按族谱登记的人[e]。
