revisions:
- from: 至于亚伦的子孙，就是众祭司[a]，他们住在各城周围的牧场[b]；每一座城[c]都有按名指定的人[d]，把应得的份分给祭司中的所有男丁，也分给利未人中所有按族谱登记的人[e]。
  to: 至于亚伦的子孙，即祭司，在他们各城周围的牧场中，每一座城都有按名指定的人，向祭司中的所有男丁分发份额，也分给利未人中所有按族谱登记的人[e]。
  rationale: 删除无原文根据的“他们住在”，将“在他们各城周围的牧场中”恢复为全句的地点范围；并以“分发份额”直译分配行为，避免加入“应得”的推论。为使脚注锚点与相关词语对应，正文保留所有标记。
