base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: zh_hans
  text: 至于亚伦的子孙，即祭司，在他们各城周围的牧场中，每一座城都有按名指定的人，向祭司中的所有男丁分发份额，也分给利未人中所有按族谱登记的人[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: e
    text: 指利未人中列入族谱记录的人。
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: 至于亚伦的子孙，就是众祭司
  rationale: 保留“亚伦的子孙”这一谱系表达，并以同位语“众祭司”体现原文；这里的“子孙”可包括后世的男性后裔。
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: 住在各城周围的牧场
  rationale: מִגְרָשׁ 指城邑周围供放牧等用途的空地或公地；“各城周围的牧场”在现代汉语中清楚自然。结合上下文，将地点短语理解为描述住在这些城外土地上的祭司。
- source_word: בְּכָל עִיר וָעִיר
  choice: 每一座城
  rationale: 希伯来语以“城又城”的重复形式表达逐一涵盖；“每一座城”自然传达其周遍性。
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: 按名指定的人
  rationale: 原文表示这些人被正式按名字辨明或指定；译文保留行政安排的意味，但不武断限定为任命或单纯登记。
- source_word: לָתֵת מָנוֹת
  choice: 把应得的份分给
  rationale: מָנוֹת 是所分配的份额；“应得的份”符合本章供应与分配的语境，也使中文句意完整。
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: 祭司中的所有男丁
  rationale: זָכָר 明确指男性；“男丁”保留性别所指，并适合谱系和群体分配的语境。
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: 利未人中所有按族谱登记的人
  rationale: התיחש 指依据家谱被登记或认定；该译法同时保留谱系与正式登记两层含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“至于”承接希伯来语的与格结构；以分号划分居住地点和分配安排，使较长的原文句子清楚流畅。脚注保留“子孙”、城郊土地、逐城强调、按名指定及族谱登记等原文细节和可能译法。
