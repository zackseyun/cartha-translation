source:
  edition: WLC
  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: zh_hans
  text: 音拿的儿子可利，是利未人，在东边守门；他负责管理献给上帝的自愿献礼，并分发献给雅威的供物和至圣之物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献给雅威的供物”也可译作“雅威的供物”；“至圣之物”指具有最高圣洁等级的物品或供物，不是指至圣所。
    reason: 保留构造短语的语义张力，并避免将“至圣之物”误解为空间名称。
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  choice: 音拿的儿子可利
  rationale: 按现代普通话的谱系表达处理；专名采用常见中文圣经音译。句首连接词在本节独立成句时不必机械译出。
- source_word: הַלֵּוִי הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: 是利未人，在东边守门
  rationale: 保留其利未人身份和守门职务；“东边”只表达方位，不增补原文未明说的“东门”。
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  choice: 负责管理献给上帝的自愿献礼
  rationale: עַל 在行政语境中表示主管；נִדְבוֹת 指出于自愿的奉献。属格结合语境自然译为“献给上帝的”，避免让中文误解为上帝所献的礼物。
- source_word: לָתֵת
  choice: 分发
  rationale: 字面为“给予”；在管理圣物的语境中，指把已奉献之物发放给合宜的领受者，译作“分发”较清楚。
- source_word: תְּרוּמַת יְהוָה
  choice: 献给雅威的供物
  rationale: תְּרוּמָה 是分别出来的供物或奉献；构造短语形式上可作“雅威的供物”，但语境表明是献给雅威之物。神名 יְהוָה 音译为“雅威”。
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: 和至圣之物
  rationale: 这是表示最高圣洁程度的表达，所指为特别神圣的物品或供物，而非至圣所这一地点。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此以现代汉语音译“雅威”保留其专名性质，不用称号替代。
- issue: תְּרוּמַת יְהוָה 的属格关系
  choice: 献给雅威的供物
  alternative: 雅威的供物
  rationale: 希伯来语构造关系本身简练，可能表达归属或奉献对象；结合祭物管理语境，中文用“献给雅威”最自然，同时以脚注保留较形式对应的另一译法。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“自愿献礼”区别于一般奉献，“负责管理……并分发”呈现本节的行政职能；不增补原文未明说的“东门”或具体领受者。
