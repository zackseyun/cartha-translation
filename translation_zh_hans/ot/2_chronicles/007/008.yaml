base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: zh_hans
  text: 那时，所罗门守这节七天；与他一同守节的以色列众人是极大的会众，从利波哈马[a]直到埃及溪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“哈马入口”。希伯来语既可理解为地名“利波哈马”，也可理解为描述边界的说法。
    reason: alternative_reading
  - marker: b
    text: 或译“埃及河谷”。这里的希伯来语可指季节性水道、溪流或溪谷，不一定是常年有水的大河。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת־הֶחָג
  choice: 守节
  rationale: עָשָׂה本义为“做、举行”，与חָג搭配时指举行或庆守节期；“守节”简洁自然，也保留遵行节期的意味。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 直接表达希伯来语的时间指示，符合现代汉语叙事习惯。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 忠实保留节期持续的时间；汉语在“守节”之后无需另加介词。
- source_word: וְכָל־יִשְׂרָאֵל עִמּוֹ
  choice: 以色列众人也和他一同守节
  rationale: “以色列众人”表达集合性的“全以色列”；根据上文省补“守节”，使汉语完整自然而不改变语义。
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: 极其庞大的会众
  rationale: קָהָל指聚集起来的群体；“会众”保留其群体与集会意味，“极其庞大”准确传达双重加强语气。
- source_word: מִלְּבוֹא חֲמָת
  choice: 从利波哈马
  rationale: 正文按地名处理并音译，以保留这一固定北部边界名称；其也可理解为“哈马入口”，故以脚注保留歧义。
- source_word: עַד נַחַל מִצְרַיִם
  choice: 直到埃及溪
  rationale: נַחַל通常指溪流、河谷或季节性水道，并非必然指大河；“埃及溪”自然简洁，脚注补充地貌含义。
