base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: zh_hans
  text: 所罗门王献上牛二万二千头、羊[a]十二万只为祭；王和全体百姓为上帝的殿举行了奉献礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“小型牲畜”；希伯来语原词可统指绵羊和山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: 献上……为祭
  rationale: זבח在祭祀语境中指宰杀并献作祭物；此译既保留祭祀含义，也比单说“宰杀”更准确自然。
- source_word: זֶבַח הַבָּקָר
  choice: 牛二万二千头
  rationale: בקר指牛类或大牲畜；现代汉语用“牛”并配量词“头”，清楚而自然。原文的זבח含义已由“献上……为祭”表达。
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: 二万二千
  rationale: 按现代汉语数词习惯表达原文的二十二千。
- source_word: וְצֹאן
  choice: 羊
  rationale: צאן是羊群或小型牲畜的集合称谓，可统指绵羊和山羊；正文用简洁自然的“羊”，并以脚注保留其较宽泛的词义。
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: 十二万
  rationale: 按现代汉语数词习惯表达原文的一百二十千。
- source_word: וַיַּחְנְכוּ
  choice: 举行了奉献礼
  rationale: חנך在这里指正式启用并奉献圣殿。“举行了奉献礼”既表达礼仪事件，也避免让“奉献殿”被误解为捐献建筑物。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: 保留“上帝的殿”这一源语意象，同时“殿”在圣殿语境中比直译“房屋”自然庄重。
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: 王和全体百姓
  rationale: 依照原文在已点明所罗门之后改用“王”，并将כל העם译为自然且具有整体性的“全体百姓”。
theological_decisions: []
