id: 2CH.7.11
reference: 2 Chronicles 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְכַ֧ל שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל הַ/בָּ֜א עַל לֵ֣ב שְׁלֹמֹ֗ה לַ/עֲשׂ֧וֹת בְּ/בֵית יְהוָ֛ה וּ/בְ/בֵית֖/וֹ הִצְלִֽיחַ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: zh_hans
  text: 所罗门建完了雅威的殿和王宫[a]。凡所罗门心里想要在雅威的殿和自己的宫中做的事[b]，他都顺利办成了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王宫”直译为“王的房屋”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“凡来到所罗门心上的”，指他心里有意或想要做的事。
    reason: cultural_note
  - marker: c
    text: 或译“他成功了”或“他使这一切成功”。这个希伯来语动词既可表示成功、顺利，也可表示使某事成功。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: 建完了
  rationale: 该动词表示使工程达到完成；结合后面的殿与王宫，用“建完了”比单说“完成了”更自然，也准确点明建筑语境。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בֵּית 字面为“房屋、家”，在此明确指敬拜建筑；现代汉语以“殿”表达最自然，并保留其庄重语体。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋”，语境所指是王的宫室；“王宫”是现代汉语中清楚自然的对等表达，字面形式另见脚注。
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: 凡所罗门心里想要……做的事
  rationale: 希伯来语字面意象是“凡来到所罗门心上的”，在此指他心中的意愿或计划；译文以自然汉语传达该习语，同时由脚注保存原文意象。
- source_word: וּבְבֵיתוֹ
  choice: 和自己的宫中
  rationale: 后缀指所罗门；“自己的”明确回指所罗门，“宫”则符合王室建筑语境。
- source_word: הִצְלִיחַ
  choice: 顺利办成了
  rationale: 该使役词形可表达“使之成功”或“成功、顺利”；在工程语境中，“顺利办成了”既传达成功实行，也与前文各项计划自然衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近 YHWH 通常学术读音的现代汉语音译，不以“主”替代神名，也不将其改作源于另一套元音传统的“耶和华”。
- issue: הִצְלִיחַ 的施事与成功含义
  choice: 他都顺利办成了
  alternative: 他凡事亨通／他使这一切成功
  rationale: 原文动词既可侧重所罗门成功，也可侧重他使计划成功。正文以“顺利办成”保留行动及成果两面，避免将本节扩大解释为所罗门生活各方面普遍亨通。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“建完了”点明建筑语境；第二句保留所罗门作为明确主语，并用“顺利办成了”自然收束全句。脚注标记均置于相关词句之后。
