  text: וְ/אִם תְּשׁוּב֣וּ/ן אַתֶּ֔ם וַ/עֲזַבְתֶּם֙ חֻקּוֹתַ֣/י וּ/מִצְוֺתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: zh_hans
  text: 但你们若转离，离弃我摆在你们面前的律例和诫命，去事奉别的神，向它们下拜，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: 转离
  rationale: 该动词基本义为“转、回转”；在此与离弃诫命及敬拜别神并列，译作“转离”自然表达背离之意，同时保留原文的转向意象。
- source_word: וַעֲזַבְתֶּם
  choice: 离弃
  rationale: 准确表达主动抛弃、不再持守之意，语体庄重，并与“转离”形成递进。
- source_word: חֻקּוֹתַי וּמִצְוֺתַי
  choice: 我的律例和诫命
  rationale: 分别对应“规定、律例”和“命令、诫命”，保留两个法律术语的并列。
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: 我摆在你们面前的
  rationale: 直译“我放置在你们面前”，表达上帝将律例诫命明确陈示给他们；“摆在……面前”保留原文空间性意象。
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: 去事奉别的神
  rationale: עבד 在敬拜语境中指服事、事奉神明；“事奉”既准确又符合现代中文圣经语体。
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: 向它们下拜
  rationale: 该词指俯伏敬拜；“下拜”保留身体动作及宗教敬拜含义。别神在现代汉语中以“它们”指代，避免赋予人格尊称。
theological_decisions:
- issue: 条件句中的背道行为是否弱化为一般过失
  choice: 保留“转离、离弃、事奉别的神、下拜”的连续动作
  alternative: 概括译为“不再顺服我”
  rationale: 原文具体描述从离弃诫命到偶像崇拜的过程，不应以概括性神学语言取代。
- issue: אֱלֹהִים אֲחֵרִים 的表达
  choice: 别的神
  alternative: 别神／其他神明
  rationale: 保留原文常见表达及其语境中的所谓神祇含义，不额外加入“假”字来替原文作明示判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文条件句尚未完结的结构，因此句末用逗号，与下一节的结果分句衔接。
