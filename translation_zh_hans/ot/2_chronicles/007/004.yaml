  text: Then the king and all the people offered sacrifices before Yahweh[a].
translation:
  language: zh_hans
  text: 随后，王和全体百姓都在耶和华面前献祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“献祭一祭”，动词和宾语同根；这是指献上祭物的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: 随后，王
  rationale: 连接词 וְ 延续叙事并承接前文，在现代汉语中译为“随后”可自然表达事件的推进；הַמֶּלֶךְ 直译为“王”。
- source_word: וְכָל הָעָם
  choice: 和全体百姓
  rationale: עָם 通常指“百姓、人民”；此处指与王一同参与礼仪的全体民众，“全体百姓”准确而自然。
- source_word: זֹבְחִים זֶבַח
  choice: 都在……献祭
  rationale: 原文是分词加同根宾语，字面为“献上一项祭献”，表示正在进行献祭。汉语“献祭”已包含同根表达的语义；加“在”保留分词所呈现的进行状态，并以“都”自然呼应复数主语。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 该介词短语表示在某者面前或临在中；“在……面前”既直接，也保留礼仪行为在上帝面前进行的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是神名四字母 יהוה。现代简体中文圣经语境中，“耶和华”是广为人知且可辨识的专名音译，不以“主”等称号替代原文专名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神名，而非表示“主”的称号。正文采用现代中文读者最熟悉的专名形式“耶和华”；“雅威”更接近学界常见的拟音，但两者都不是对古代读音完全确定的复原。
- issue: 献祭动作的时态与体貌
  choice: 都在……献祭
  alternative: 献了祭
  rationale: זֹבְחִים 是分词，描述当时正在进行的动作。“都在……献祭”保留其持续或进行意味，避免将其压缩成单纯完成事件。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“随后”承接叙事，“全体百姓”适合公共礼仪场景；正文避免生硬重复“献祭祭物”，并用脚注说明原文的同根表达。
