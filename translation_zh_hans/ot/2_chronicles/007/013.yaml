  text: הֵ֣ן אֶֽעֱצֹ֤ר הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הֵן אֲצַוֶּ֥ה עַל חָגָ֖ב לֶ/אֱכ֣וֹל הָ/אָ֑רֶץ וְ/אִם אֲשַׁלַּ֥ח דֶּ֖בֶר בְּ/עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: zh_hans
  text: 我若使天闭塞，以致不降雨[a]；或吩咐蝗虫吞吃这地；或在我的子民中降下瘟疫[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，我若使天闭塞……”希伯来语开头的词可带强调或提示语气。
    reason: lexical_alternative
  - marker: b
    text: “瘟疫”也可译作“疫病”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 若
  rationale: 此处引出假设性的条件场景，与下一节的回应条件相接。“若”自然保留条件意味；原词也可带“看哪”或加强语气，列入脚注。
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: 使天闭塞
  rationale: 保留“关闭天空”的具体意象，同时用“使……闭塞”表达上帝主动止住降雨。
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: 不再降雨
  rationale: 按语境表达天被关闭所造成的结果，现代汉语清楚自然。
- source_word: אֲצַוֶּה עַל חָגָב
  choice: 吩咐蝗虫
  rationale: חָגָב为单数集合名词；汉语“蝗虫”本身可作集合表达，并保留上帝直接发令的含义。
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: 吞吃这地
  rationale: “吞吃”传达蝗灾毁灭性的取食；“这地”按盟约语境指当地国土，而非整个世界。
- source_word: אֲשַׁלַּח דֶּבֶר בְּעַמִּי
  choice: 在我的子民中降下瘟疫
  rationale: “降下”自然表达神所差遣灾病的主动作为；בְּ表示瘟疫发生在子民中间。
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 指流行性致命疾病，符合盟约审判语境；也可译“疫病”。
theological_decisions:
- issue: 这些灾祸是否作为条件性场景表达
  choice: 以“我若……；或……；或……”呈现
  alternative: “看哪，我若……”或“当我……”
  rationale: הֵן在这里引出可能发生的神圣管教，而下一节继续说明子民在此情形下的回应。“若”保留条件性，也不削弱上帝在各项审判中的直接主权。
translation_notes:
  register: 采用现代、庄重而易懂的圣经汉语。“使天闭塞”保留原文意象，“子民”体现盟约关系。句末用逗号，因为本节条件句在下一节继续。
