  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: zh_hans
  text: 祭司不能进入雅威的殿[a]，因为雅威的荣耀充满了雅威的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“雅威的房屋”，这里指圣殿；正文译为“雅威的殿”，以符合上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: 不能
  rationale: 叙事连接词 וְ 在中文中不必机械译出；否定词与 יכל 共同表达无能力，译为“不能”自然简洁，又不额外判定阻碍的具体性质。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: כהנים 在圣殿语境中的标准现代汉语译法。
- source_word: לָבוֹא אֶל
  choice: 进入
  rationale: בוא 与 אֶל 连用，在此自然表示进入某处；“进入”准确而简练。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת 字面为“房屋、殿”，此处指圣殿。用“殿”既保留希伯来语“房屋/殿”的意象，也符合现代中文宗教建筑语境；两处同样翻译，以保留原文重复。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出祭司不能进入的原因，现代汉语以“因为”最清楚。
- source_word: מָלֵא
  choice: 充满了
  rationale: 该动词表达雅威的荣耀充满殿；“充满了”自然呈现已经发生的叙事事件，不对希伯来语完成体作过度时态化解释。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: 直接保留构词关系；“荣耀”是 כָּבוֹד 在上帝显现语境中的常用且庄重译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名功能，避免以称号取代；“耶和华”是传统形式，“上主”则属于代称。
- issue: בֵּית יְהוָה 的表达
  choice: 雅威的殿
  alternative: 雅威的圣殿；雅威的居所
  rationale: 上下文明确指圣殿，但原文只用 בַּיִת。译为“殿”既符合语境，又不增加原文没有的“圣”字，并保留上帝之“殿/家”的神学意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文两次“雅威的殿”的重复，不为行文变化而改写。省略句首 וְ 的显式对应，符合中文叙事衔接习惯；不把祭司不能进入解释成身体阻挡或礼仪禁令。
