id: 2CH.7.21
reference: 2 Chronicles 7:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: zh_hans
  text: 这殿[a]曾经崇高；凡从它旁边经过的人都必惊骇[b]，说：“雅威为什么这样对待这地和这殿呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“这房屋”；这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: “惊骇”所译的希伯来词也可表达“荒凉”。本句也有人理解为：“这殿……必荒凉，令凡从旁经过的人惊骇。”
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת字面为“房屋、家”，在本段明确指圣殿；正文用现代汉语自然的“殿”，并以脚注保留原词信息。
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: 曾经崇高
  rationale: עֶלְיוֹן可指高、高贵或尊崇；“曾经崇高”既保留其地位显赫的意味，也与审判之后的景况形成对照。
- source_word: לְכָל עֹבֵר עָלָיו
  choice: 凡从它旁边经过的人
  rationale: 按希伯来语的分配性单数表达为“凡……的人”；עָלָיו在此是从圣殿旁经过的惯用说法。
- source_word: יִשֹּׁם
  choice: 都必惊骇
  rationale: 将单数动词的主语理解为紧邻的“凡经过的人”。שמם在此表达目睹毁坏后震惊、骇异的反应；这一读法也与随后“说”自然衔接。
- source_word: וְאָמַר
  choice: 说
  rationale: 希伯来语为单数，与“每一个经过的人”呼应；汉语在“凡……的人”之后直接用“说”即可自然表达。
- source_word: בַּמֶּה
  choice: 为什么
  rationale: 字面为“因什么”；疑问语境中译作“为什么”最自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，保留经文所用的专名而不以称号替代。
- source_word: עָשָׂה ... כָּכָה
  choice: 这样对待
  rationale: “这样行”在此指雅威使土地和圣殿遭遇眼前的灾况；“这样对待”符合现代汉语，同时保留行为本身未被进一步解释的开放性。
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: 这地和这殿
  rationale: “地”保留אֶרֶץ的土地及盟约语境；末尾继续用“殿”与本节开头一致。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的四字神名；音译“雅威”可将专名与称号区分开来。
- issue: יִשֹּׁם的主语及含义
  choice: 经过的人都必惊骇
  alternative: 这殿必荒凉／成为令人惊骇之物
  rationale: 紧邻的לְכָל עֹבֵר עָלָיו可自然充当分配性单数主语，后面的单数“说”也支持这一句法。不过שמם兼有荒凉与惊骇的语义，故在脚注中保留另一种可能。
- issue: 圣殿先前“崇高”的含义
  choice: 曾经崇高
  alternative: 曾经高耸；曾被尊崇
  rationale: 不把עֶלְיוֹן限定为建筑高度或宗教地位，保留其可兼指高大、显赫和受尊崇的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“崇高”刻意保留原词可指高大、显赫或受尊崇的多重意味；问句用“这样对待”避免古奥的“如此行”，同时不补入原文没有明说的审判原因。
