  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: zh_hans
  text: 所罗门祷告完毕，火就从天上降下[a]，烧尽了燔祭和祭物；雅威的荣耀充满了圣殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从天上下来”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“这殿”（字面为“房屋”）；在这里指圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: 所罗门祷告完毕
  rationale: כְּ加不定词结构引出时间从句；现代汉语以“……完毕”自然表达动作完成，同时不额外强调“立刻”。
- source_word: וְהָאֵשׁ
  choice: 火
  rationale: 希伯来文带定冠词，语境表明这是从天而降的特定之火；汉语无需机械加入“那”，仍可由上下文体现其特指性。
- source_word: יָרְדָה מֵהַשָּׁמַיִם
  choice: 从天上降下
  rationale: 准确保留由天而降的方向与来源；“天上”是 שׁמים 在此类表达中的自然现代汉语对应。
- source_word: וַתֹּאכַל
  choice: 烧尽了
  rationale: 该动词字面有“吃、吞吃”之意，但以火为主语时，“烧尽”最符合汉语习惯，也保留祭物被完全焚烧的结果。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: עֹלָה 是特定祭祀术语，指全部焚烧献上的祭，中文传统且准确的对应为“燔祭”。
- source_word: וְהַזְּבָחִים
  choice: 和各种祭牲
  rationale: זְבָחִים 为复数，指献祭所用的祭牲，与前面的特定“燔祭”有别；加入“各种”自然体现复数和类别的广泛性，而不将其限定为某一种祭。
- source_word: וּכְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: כָּבוֹד 在这里指神显现的荣耀；“雅威”以现代汉语音译呈现四字神名 יְהוָה，而不以称号代替专名。
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: 充满了圣殿
  rationale: בַּיִת 字面是“房屋”，但在本段明确指所罗门建成并奉献的圣殿；正文译作“圣殿”使普通读者无需依赖上下文即可理解所指，脚注保留字面信息。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留其作为以色列之神专名的性质，避免以称号替代。
- issue: הַבָּיִת 的所指
  choice: 圣殿
  alternative: 殿；这房屋
  rationale: 该词字面为“房屋”，在历代志当前语境中专指耶路撒冷圣殿。正文明确其所指，脚注同时保留希伯来文的字面表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“祷告完毕”“从天上降下”“充满了圣殿”清楚流畅；“燔祭”作为必要的祭祀术语予以保留，“各种祭牲”则帮助普通读者分辨其与燔祭的区别。
