id: 2CH.7.3
reference: 2 Chronicles 7:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: zh_hans
  text: 以色列众人[a]看见火降下来，又看见雅威的荣耀在殿宇上[b]，就俯伏在铺石地上，脸伏于地，敬拜并称谢雅威：“他本为善；他的慈爱永远长存[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，这是指以色列全体民众的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 这里的“殿宇”指圣殿；原文所用的词也可直译为“房屋”或“殿”。
    reason: cultural_note
  - marker: c
    text: “慈爱”也可译为“怜悯”“信实之爱”或“盟约中的忠诚”；原词包含忠贞、守约的爱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: 以色列众人
  rationale: בְּנֵי יִשְׂרָאֵל字面为“以色列的众子”，却是指以色列全体民众的惯用集体称呼；译作“以色列众人”既准确涵盖所指，也符合现代汉语习惯。
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: 看见火降下来
  rationale: 分词与带בְּ的不定式结构描写众人目睹火下降的情景；“看见火降下来”自然保留了动作及其方向。
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: 又看见雅威的荣耀在殿宇上
  rationale: “看见”同时支配火与雅威的荣耀；עַל保留为“在……上”，בַּיִת依上下文指圣殿，译作“殿宇”比单称“房屋”更清楚。
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: 就俯伏在铺石地上，脸伏于地
  rationale: 译文同时呈现屈身俯伏、面向地面以及所在铺石地面三个要素，并采用自然庄重的汉语语序。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 敬拜
  rationale: 该动词可指俯伏或敬拜；前句已经明确描述身体姿势，此处用“敬拜”表达动作的宗教意义，避免无谓重复。
- source_word: וְהוֹדוֹת לַיהוָה
  choice: 并称谢雅威
  rationale: ידה的使役式在这一礼仪性颂词中表示称谢或赞美；“称谢”既庄重，也自然引出后面的赞词。
- source_word: כִּי טוֹב
  choice: 他本为善
  rationale: 希伯来语省略主语，但固定颂词所指为雅威；汉语补出“他”以求明晰，“本为善”保留礼仪颂赞的庄重感。
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: 他的慈爱永远长存
  rationale: חֶסֶד兼有仁爱、忠诚和守约不渝的内涵；正文用简明而传统的“慈爱”，脚注提示其更丰富的语义。“长存”为汉语通顺而补出，表达לְעוֹלָם的持续意义。
theological_decisions:
- issue: 神圣之名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”音译，明确保留上帝在盟约中启示的专名，而不以称号替代。
- issue: 礼仪颂词中חַסְדּוֹ的译法
  choice: 他的慈爱
  alternative: 他的怜悯；他的信实之爱；他的盟约信实
  rationale: “慈爱”适合正文的简洁和颂词节奏，同时不把该词仅限于怜悯；脚注说明其中也包含忠贞、守约的意味，以保留其神学张力和语义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留叙事推进和礼仪颂词的节奏；“铺石地”“脸伏于地”具体呈现敬拜姿态，“他本为善；他的慈爱永远长存”则保持简洁、可诵读的赞美语体。
