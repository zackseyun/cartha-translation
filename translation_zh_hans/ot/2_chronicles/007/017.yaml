  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: zh_hans
  text: “至于你，你若在我面前行事，像你父亲大卫那样，照我吩咐你的一切去做，并谨守我的律例和典章[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “典章”或译“法令”。
    reason: מִשְׁפָּטַי 在此可指司法性的规定、条例或法令；两种译法均能反映其法律语义。
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 前置代词带有强调和转向直接称呼所罗门的作用；“至于你”自然保留这一话语重点。
- source_word: אִם
  choice: 若
  rationale: 明确引出条件从句，并与庄重的叙事语体协调。
- source_word: תֵּלֵךְ לְפָנַי
  choice: 在我面前行事
  rationale: 保留“在我面前”的神面前生活意涵，同时以现代汉语“行事”自然表达希伯来语以“行走”指生活行为的习语。
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: 像你父亲大卫那样
  rationale: 清楚保留与大卫的比较；汉语无需机械重复“行”，即可由前句承接其行事方式。
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: 照我吩咐你的一切去做
  rationale: 将不定式结构表达为条件中伴随的行为要求，并保留 כְּכֹל 的全面范围。
- source_word: חֻקַּי
  choice: 我的律例
  rationale: “律例”是盟约和法律语境中自然而庄重的对应词，并与后面的 מִשְׁפָּטַי 保持词义区分。
- source_word: וּמִשְׁפָּטַי
  choice: 我的典章
  rationale: “典章”可表达具有规范效力的司法规定或条例，又不与“律例”合并；“法令”也是可行译法。
- source_word: תִּשְׁמֹר
  choice: 谨守
  rationale: 准确表达盟约语境中遵守、持守的含义；“谨”体现认真遵行，而未增加文本以外的神学判断。
theological_decisions:
- issue: 如何呈现盟约顺服的条件，而不引入功德论
  choice: 保留“你若……去做，并谨守……”的真实条件结构和具体顺服要求。
  alternative: 概括为一般性的“忠心”，或弱化条件语气。
  rationale: 原文直接向所罗门提出条件；译文应保留其神学张力，不以任何后设教义淡化或强化这项条件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在我面前行事”既保留原文意象的核心，又避免“行走在我面前”在现代汉语中的生硬感。句末保留逗号，因为条件句的结果在下一节继续。
