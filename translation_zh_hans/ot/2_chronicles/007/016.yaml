  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: zh_hans
  text: 如今，我已拣选并使这殿分别为圣[a]，好叫我的名永远在那里；我的眼和我的心也必日日在那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使这殿分别为圣”也可译作“使这殿成为圣洁”，意思是把这殿划归神圣的用途。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“所有的日子”；“日日”表示持续不断。
    reason: translation_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接前文并引出神宣告的当前结果；现代汉语用“现在”自然清楚，无须机械保留连接词。
- source_word: בָּחַרְתִּי
  choice: 我已拣选
  rationale: 完成式表示已经完成且仍具现实效力的行动；“已拣选”也保留圣经语体。
- source_word: וְהִקְדַּשְׁתִּי
  choice: 并使它分别为圣
  rationale: Hiphil词形表示使之成为圣、划归神圣用途；此译比单说“成圣”更清楚地表达使役含义。
- source_word: הַבַּיִת הַזֶּה
  choice: 这殿
  rationale: בַּיִת本义为“房屋”，但在此语境明确指圣殿；汉语“这殿”简洁、庄重，也避免读者误解为普通住宅。
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: 使我的名……在这里
  rationale: 保留“我的名”这一圣殿神学用语，不将其解释扩大为“我的同在”；“使”表达不定式结构的目的或结果。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 自然表达持续不止的时限，同时保留原文强度。
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: 我的眼、我的心也必……在这里
  rationale: 直留拟人化意象；“必”自然表达后续状态，并显出神郑重的应许。
- source_word: כָּל הַיָּמִים
  choice: 天天
  rationale: 原文直译为“所有的日子”；“天天”在现代汉语中自然，并保留逐日、持续不断的意象，较单纯“常常”更准确。
theological_decisions:
- issue: 神的拟人化表达“我的眼、我的心”
  choice: 按原有意象译为“我的眼、我的心”
  alternative: 意译为“我的眷顾和关怀”
  rationale: 原文借“眼”和“心”表达神持续的看顾、关注与委身；直译可保存经文的神学质感，而不以解释取代文本。
- issue: 圣殿神学中的“我的名”
  choice: 保留“我的名”
  alternative: 译为“我的同在”或“我自己”
  rationale: “名”在此不只是名声，却也不能未经说明便等同于神完整的临在；保留原词可维持原文有意留下的神学张力。
- issue: “永远”与“天天”的并列
  choice: 分别译出עַד עוֹלָם和כָּל הַיָּמִים
  alternative: 将二者都概括为“永远”或“常在”
  rationale: 前者强调持续的时限，后者强调每一日持续的看顾；分别表达可保存原文的修辞层次。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拣选”“分别为圣”保留适度的圣经语体；“这殿”按明确语境处理הַבַּיִת הַזֶּה。两个脚注标记均已在正文中出现。
