  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ וּ/בָחַ֜רְתִּי בַּ/מָּק֥וֹם הַ/זֶּ֛ה לִ֖/י לְ/בֵ֥ית זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: zh_hans
  text: 夜里，雅威向所罗门显现，对他说：“我已经听了你的祷告，也为自己选择了这地方，作为献祭的殿[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“作献祭之殿”，即分别出来用于献祭敬拜的殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 显现
  rationale: 此处 ראה 的尼法勒式表示雅威向所罗门显现；“显现”自然保留了神显的含义，又不推断显现的具体方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 יהוה 的通行学术拟音译出专名，而不以“主”这一称号替代。
- source_word: בַּלָּיְלָה
  choice: 夜里
  rationale: 介词 בְּ 与“夜”连用，交代显现发生的时间；“夜里”准确、自然，符合现代汉语叙事。
- source_word: שָׁמַעְתִּי אֶת־תְּפִלָּתֶךָ
  choice: 我已经听了你的祷告
  rationale: 完成式陈述已经完成且与当前回应有关的行动；“已经听了”保留这一语用重点，不额外解释为“应允”。
- source_word: וּבָחַרְתִּי בַּמָּקוֹם הַזֶּה
  choice: 也……选择了这地方
  rationale: 完成式与前面的“听了”平行，表示选择已经作出；“这地方”直接对应圣殿所在地。
- source_word: לִי
  choice: 为自己
  rationale: 保留该与格所表达的归属和目的，表明这地方是雅威为自己选择的。
- source_word: לְבֵית זָבַח
  choice: 作为献祭的殿
  rationale: 原文意为“作祭牲／献祭之殿”；“献祭的殿”既保留祭祀用途，也比生硬的直译“祭牲之家”更符合现代汉语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”保留其专名性质，并与较通行的希伯来语拟音相符；不用“主”替代，也不采用源于较晚混合读法的“耶和华”。
- issue: “听了你的祷告”是否表示祷告已蒙应允
  choice: 保留为“听了”，不扩译为“应允了”
  alternative: 我已经应允了你的祷告
  rationale: שׁמע 在此明确表示听见或垂听，但经文本身没有直接使用“应允”的动词；保留原有措辞可避免提前化解“听见”与“应允”之间的神学张力。
- issue: לְבֵית זָבַח 所指
  choice: 献祭的殿
  alternative: 献祭的地方；祭牲之家
  rationale: “殿”保留 בַּיִת 在圣殿语境中的建筑及宗教含义；“献祭的”说明其用途，却不把整句缩减为泛指的祭祀场所。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“夜里”用于清楚交代叙事时间；“向……显现”“为自己选择”保持经文的正式语气，同时避免古奥表达。
