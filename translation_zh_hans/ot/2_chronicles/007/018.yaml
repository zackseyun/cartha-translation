  text: וַ/הֲקִ֣ימוֹתִ֔י אֵ֖ת כִּסֵּ֣א מַלְכוּתֶ֑/ךָ כַּ/אֲשֶׁ֣ר כָּרַ֗תִּי לְ/דָוִ֤יד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: zh_hans
  text: 我就必坚立你国度的王位，正如我与你父大卫立约时所说：“你必不断有治理以色列的人。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“一个治理以色列的人必不从你断绝。”
    reason: 原文用“断绝／被剪除”的意象表达大卫王朝不会缺少统治以色列的人。
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: 我就必坚立
  rationale: קום的使役形在此指使王位稳固、确立；“就”自然承接上文条件的结果，“坚立”保留其使之站立稳固的意象。
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: 你国的王位
  rationale: 保留“国度/王权”与“宝座/王位”两个概念，同时用现代汉语较自然的“王位”表达作为统治象征的宝座。
- source_word: כָּרַתִּי לְדָוִיד אָבִיךָ
  choice: 我向你父大卫立约
  rationale: כרת在此属于立约惯用语；原文虽省略“约”字，汉语须补出才能清楚自然。“父”照原文保留，可按王朝语境理解为先祖。
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: 你那里必不至断绝……的人
  rationale: 尽量保留כרת被动式“被剪除、断绝”的王朝延续意象，又以“你那里”表达לְךָ所指的所属关系，避免直接加入原文未明说的“后裔”。
- source_word: מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: 治理以色列
  rationale: משל的分词描述此人的职能；与该动词连用的בְּ在汉语中自然表达为治理的对象，即“治理以色列”。
theological_decisions:
- issue: 大卫王朝应许的措辞
  choice: 你那里必不至断绝治理以色列的人
  alternative: 你必不断有人治理以色列
  rationale: 正文保留“断绝”的原文意象和王朝应许的张力，不把应许进一步解释为某种特定的继承方式；脚注提供更通顺的汉语表达。
- issue: “你父大卫”的身份称谓
  choice: 你父大卫
  alternative: 你的祖先大卫
  rationale: 保留原文“父”的王朝性称谓，不在正文中将其解释性改写为“祖先”。
translation_notes:
  register: 采用庄重而现代的叙述语体。“坚立”“立约”“不至断绝”保留经文的盟约与王朝语感，但句法仍力求让普通现代读者易于理解。
