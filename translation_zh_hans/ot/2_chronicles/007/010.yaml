base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: zh_hans
  text: 第七月二十三日，他遣散百姓，让他们各自回到自己的帐篷[a]。百姓因雅威[b]向大卫、所罗门和他子民以色列所施的恩惠[c]，都满心欢喜快乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐篷”也可按其惯用含义译作“家”。原文直译为“帐篷”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是神的专名，希伯来文写作 יהוה（YHWH）；传统常译作“耶和华”。
    reason: divine_name
  - marker: c
    text: 原文直译可作“所行的美善”或“所做的好事”；此处译为“所施的恩惠”，表达雅威向这些对象所作的良善行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: 第七月二十三日
  rationale: 按现代汉语日期语序表达；叙事连接词 וּ 不机械译出，以免句首生硬。
- source_word: שִׁלַּח אֶת־הָעָם לְאָהֳלֵיהֶם
  choice: 他遣散百姓，让他们各回自己的帐棚
  rationale: שִׁלַּח 在这里指让聚集的百姓离去；“遣散……让……回”自然表达其使役和返程语境，同时保留“帐棚”的具体意象。
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: 都满心欢喜快乐
  rationale: טוֹבֵי לֵב 是表示内心欢畅的希伯来语习语；“满心”保留“心”的内在意味，并与 שְׂמֵחִים 共同构成自然的现代汉语。
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: 因……所行的美善
  rationale: 保留 עָשָׂה“行、做”和 הַטּוֹבָה“美善、好处”的搭配，不把它缩窄为某一种具体恩惠。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现希伯来文的神圣专名，而不以“主”这一称号替代。
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: 为大卫、所罗门和他的子民以色列
  rationale: 三个 לְ 标明美善行动的受益者；“他的子民以色列”保留原文的同位关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用较贴近通常重建读音 Yahweh 的“雅威”，并以脚注说明传统译名，既保留专名性质，也方便普通读者识别。
- issue: הַטּוֹבָה אֲשֶׁר עָשָׂה 的范围
  choice: 所行的美善
  alternative: 所施的恩惠；所赐的福
  rationale: “美善”保留原文抽象单数词的宽度，“所行”直接对应 עָשָׂה，避免把行动预先限定为“施恩”或“赐福”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“遣散百姓”交代礼仪聚会结束，“让他们各回自己的帐棚”使动作方向自然明确；后句重述“百姓”，避免长句中分词性描述的主语含混。“满心欢喜快乐”以常用汉语传达外在喜乐与内心欢畅。
