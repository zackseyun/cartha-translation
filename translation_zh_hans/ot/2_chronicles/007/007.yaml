revisions:
- from: 所罗门把耶和华殿前院子的中央分别为圣，因为他在那里献上燔祭和平安祭的脂肪；所罗门所造的铜祭坛容纳不下燔祭、素祭和脂肪。
  to: 所罗门把耶和华殿前的院子中央分别为圣，因为他在那里献上燔祭和平安祭的脂肪部分；这是因为所罗门所造的铜祭坛容纳不下燔祭、素祭和脂肪部分。
  rationale: 修订仅澄清原文的空间关系、祭仪术语和连续因果关系：以“脂肪部分”对应献祭语境中的 חלב，并以“这是因为”显出第二个 כִּי 的解释性因果。其余既有术语及神名译法均予保留。
