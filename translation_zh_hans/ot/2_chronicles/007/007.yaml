id: 2CH.7.7
reference: 2 Chronicles 7:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: zh_hans
  text: 所罗门把耶和华殿前的院子中央分别为圣，因为他在那里献上燔祭和平安祭的脂肪部分；这是因为所罗门所造的铜祭坛容纳不下燔祭、素祭和脂肪部分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: 分别为圣
  rationale: 使役形式在此指把一处地方划定作神圣用途；“分别为圣”既保留礼仪含义，也符合现代中文圣经语体。
- source_word: תּוֹךְ הֶחָצֵר
  choice: 院子的中央
  rationale: תּוֹךְ 在此指院子中间或中央区域，而非泛指整个院子。
- source_word: לִפְנֵי בֵית יְהוָה
  choice: 耶和华殿前
  rationale: לִפְנֵי 表达空间位置；בֵית יְהוָה 在此指圣殿建筑，译为“耶和华殿”自然凝练。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的神名音译，明确呈现原文专名，而不以称号替代。
- source_word: עָשָׂה שָׁם
  choice: 他在那里献上
  rationale: עָשָׂה 字面为“做”，但在献祭语境中指举行或献上祭物，译为“献上”更准确自然。
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: 燔祭
  rationale: 这是 עלה 的标准礼仪术语；中文不以数形变化，既可对应前处复数，也可对应后处类别性单数。
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: 平安祭的脂肪
  rationale: חלב 指献祭时焚烧的脂肪部分；שְׁלָמִים 采用通行且中性的礼仪名称“平安祭”。
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: 铜祭坛
  rationale: נְחֹשֶׁת 可指铜或青铜；“铜祭坛”是自然、通行的中文表达，不对具体合金作超出原文的限定。
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: 容纳不下
  rationale: 准确表达祭坛容量不足，且比直译“不能容纳”更符合现代汉语。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 在祭祀语境中 מִנְחָה 是以细面等为主要祭物的专门祭类，采用通行术语“素祭”。
- source_word: הַחֲלָבִים
  choice: 脂肪
  rationale: 复数形式指各祭物中当焚烧的脂肪部分；中文用集合性“脂肪”表达自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文保留专名而非改作“主”；“耶和华”是现代简体中文圣经语境中最广为人知且可直接识别的译法，不借此裁定其精确古代发音。
- issue: שְׁלָמִים 的祭类名称
  choice: 平安祭
  alternative: 团契祭
  rationale: 该词的确切语义关联可涉及完整、福祉或共享筵席；“平安祭”保留传统礼仪名称，不把其神学功能单一化为团契。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留“燔祭、素祭、平安祭、分别为圣”等必要礼仪术语。原文两次 כִּי 均表达因果；中文为避免连续两个“因为”的生硬重复，第二处以分号引出具体原因，逻辑关系仍清楚。
