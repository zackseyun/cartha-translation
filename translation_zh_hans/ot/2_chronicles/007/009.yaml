base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: zh_hans
  text: 第八天，他们举行了严肃会[a]，因为他们举行祭坛奉献礼七天，又守节七天。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严肃会”也可译作“集会”或“闭幕集会”。希伯来词指圣礼节期中的特别聚集，常带有结束节期的意味。
    reason: lexical_alternative
  - marker: b
    text: “举行祭坛奉献礼”也可译作“为祭坛行奉献礼”或较直译为“做祭坛的奉献礼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 直译希伯来文的时间短语，不补入本节未明说的“节期”。
- source_word: עֲצָרֶת
  choice: 严肃会
  rationale: 该词在圣礼节期语境中指特别的聚集，常为节期结束时的集会；“严肃会”既保留宗教分量，也符合现代中文圣经语体。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出第八天举行严肃会的背景或理由，保留希伯来文的解释关系。
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: 祭坛奉献礼
  rationale: 指祭坛启用时的礼仪性奉献；“奉献礼”自然、清楚，也不把含义过度限定为其他神学术语。
- source_word: עָשׂוּ
  choice: 行
  rationale: 希伯来文直义为“做、举行”；与“奉献礼”搭配译作“行”简洁自然，并保留其宽泛动作义。
- source_word: וְהֶחָג
  choice: 又守节
  rationale: הֶחָג 是特指的“节期”；结合 עָשׂוּ 的省略延续，中文以“守节”表达举行、庆祝节期的意思。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 按希伯来文保留两个各为七天的时段，不将其合并，以维持原句的结构和时间张力。
theological_decisions:
- issue: 两个七天与第八天的关系
  choice: 保留“奉献礼七天，又守节七天”的并列说法
  alternative: 将两段活动解释为连续十四天，或解释为完全重叠的同一七天
  rationale: 本节本身没有明确说明两个七天是连续、重叠还是部分重合；译文不替原文消除这一历时与上下文所形成的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“严肃会”“祭坛奉献礼”“守节”适合公共诵读，也能让普通读者理解。正文保留希伯来文的解释关系及两个“七天”的并列结构；所有脚注标记均置于正文中。
