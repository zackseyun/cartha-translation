  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: zh_hans
  text: 我就必把他们从我赐给他们的土地上连根拔除；至于这座我为我的名所分别为圣的殿[a]，我必把它从我面前抛弃[b]，使它在万民中成为笑谈和讥刺[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”。
    reason: lexical_alternative
  - marker: b
    text: “从我面前”也可译作“从我眼前”；原文按字面为“从我的脸前”。
    reason: lexical_alternative
  - marker: c
    text: “笑谈和讥刺”也可译作“俗语和笑柄”或“讥讽的话和被嘲笑的对象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: 我就必把他们……连根拔除
  rationale: נתשׁ表示拔出、铲除；“连根拔除”保留土地和植物的形象。连词按上节条件句的结果关系译为“就”。
- source_word: מֵעַל אַדְמָתִי אֲשֶׁר נָתַתִּי לָהֶם
  choice: 从我赐给他们的土地上
  rationale: אֲדָמָה在这里指神所赐、仍属神的土地；此译自然保留神的所有权与赐予关系。
- source_word: הַבַּיִת הַזֶּה
  choice: 这座……殿
  rationale: בַּיִת直译为“房屋”，但在此明确指圣殿；“殿”在现代中文中自然清楚，脚注保留字面译法。
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: 我为我的名分别为圣
  rationale: הקדיש在使役形中表示使之成为圣、专门归圣；保留“为我的名”，不将神名的神学含义改写为“为我自己”。
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: 我必把它从我面前丢弃
  rationale: 较贴近“从我面前扔开”的原文意象，同时以自然中文表达神的拒绝。
- source_word: וְאֶתְּנֶנּוּ
  choice: 使它……成为
  rationale: נתן与表语连用时可表示使某物成为某种状态；中文以“使……成为”清楚表达。
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: 笑谈和讥讽
  rationale: מָשָׁל在此可指流传的谈资、笑柄或警戒性俗语，שְׁנִינָה指尖刻讥刺的话；译文突出公开受辱的语境，并以脚注保存其他可能译法。
- source_word: בְּכָל הָעַמִּים
  choice: 在万民中
  rationale: עַמִּים是“众民”；“万民”简洁自然，也保留其复数和普遍范围。
theological_decisions:
- issue: 圣殿称谓
  choice: 殿
  alternative: 这座房屋／这殿宇
  rationale: 原文是“房屋”，在所罗门圣殿语境中所指明确。正文用现代中文易懂的“殿”，脚注说明字面形式，避免损失原文“神的家”这一称谓。
- issue: 神拒绝圣殿的表达
  choice: 从我面前丢弃
  alternative: 从我眼前丢弃／从我的同在中赶走
  rationale: 保留“面前”的拟人性原文表达和拒绝意象，不进一步断定这是仅指不再眷顾，还是指从神的同在中除去。
- issue: מָשָׁל与שְׁנִינָה的羞辱含义
  choice: 笑谈和讥讽
  alternative: 俗语和笑柄／谈资和讥刺的话
  rationale: 两个词的语义范围有重叠，且מָשָׁל并非总含嘲弄义。正文依本处审判语境表达羞辱，脚注保留词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“连根拔除”保存原文土地意象；“分别为圣”保留礼仪与归属含义；避免使用过于古雅的“芟除”“鉴戒”等词。所有脚注标记均置于所说明的正文词语之后。
