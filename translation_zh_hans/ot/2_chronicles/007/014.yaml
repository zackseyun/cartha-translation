source:
  edition: WLC
  text: וְ/יִכָּנְע֨וּ עַמִּ֜/י אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עֲלֵי/הֶ֗ם וְ/יִֽתְפַּֽלְלוּ֙ וִֽ/יבַקְשׁ֣וּ פָנַ֔/י וְ/יָשֻׁ֖בוּ מִ/דַּרְכֵי/הֶ֣ם הָ/רָעִ֑ים וַ/אֲנִי֙ אֶשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/אֶסְלַח֙ לְ/חַטָּאתָ֔/ם וְ/אֶרְפָּ֖א אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: zh_hans
  text: 如果称为我名下的子民[a]谦卑自己，祷告，寻求我的面，转离他们的恶道，我就会从天上垂听，赦免他们的罪，医治他们的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 近直译为“我的名被称在他们之上”。这是希伯来语的惯用说法，表示他们属于上帝、承载他的名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: 自卑
  rationale: 该词为כנע的尼法勒式，在此表示主动降卑自己；“自卑”简洁、庄重，并保留人的意志回应。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 这是指归属于上帝的群体性称谓；“子民”在现代汉语中自然体现其群体与归属意味。
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: 称为我名下的
  rationale: 这是希伯来语归属与身份认同的惯用语。“称为我名下”既保留“名”的意象，又能让现代读者理解其属于上帝的含义。
- source_word: וְיִתְפַּלְלוּ
  choice: 祷告
  rationale: פלל的希特帕勒式通常表示“祷告”；对象由上下文表明，无须增添“向我”。
- source_word: וִיבַקְשׁוּ פָנַי
  choice: 寻求我的面
  rationale: 保留原文“面”的具体比喻及寻求上帝临在的神学张力，避免简化为“寻求我”或解释为“求我的恩宠”。
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: 转离他们的恶道
  rationale: שוב在这里表示方向与行为的逆转；“转离”自然传达悔改含义，“恶道”保留“道路”作为生活方式的比喻。
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: 我就会从天上垂听
  rationale: “就”清楚呈现条件之后的结果；“从天上”对应מן השמים，“垂听”在庄重现代汉语中自然表达上帝听见祷告。
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: 赦免他们的罪
  rationale: 原文“罪”为单数集合名词；中文“罪”自然保留这一集合用法。
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: 医治他们的土地
  rationale: רפא本义为“医治”；直译可保留土地如同受创、由上帝恢复的意象，而不把它缩减为一般性的“复兴”。
theological_decisions:
- issue: 条件与结果的句法结构
  choice: 以“如果”引出条件，并以“就”引出上帝的回应。
  alternative: 所有分句一律用“并且”并列。
  rationale: 原文虽连续使用连接词和未完成式，但上下文构成清楚的条件—结果结构；中文用“如果……就……”可准确而自然地再现其逻辑。
- issue: 上帝之名的归属惯用语
  choice: 译为“称为我名下的”。
  alternative: 直译为“我的名被称在他们身上”。
  rationale: 该短语表达属于上帝并承载其名的身份；正文采用可理解的中文表达，脚注保留原文较具体的措辞。
- issue: “寻求我的面”的比喻
  choice: 保留“寻求我的面”。
  alternative: 译为“寻求我”或“寻求我的恩宠”。
  rationale: 原文既可指寻求上帝本人、临在或眷顾；保留“面”可避免把这一丰富意象限定为单一解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“自卑”“垂听”略带经文语体但仍为当代读者熟悉；保留“寻求我的面”和“医治土地”的原文意象。
