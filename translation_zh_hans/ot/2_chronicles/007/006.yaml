  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: zh_hans
  text: 祭司站在各自的岗位上；利未人拿着颂赞雅威的乐器[a]，就是大卫王为称谢雅威而制作的，因为他的慈爱永远长存[b]。大卫借着他们献上赞美时[c]，祭司在他们对面吹号，以色列众人都站着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属于雅威的乐器”。原文短语既可指献给雅威的乐器，也可指用于颂赞雅威的乐器。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“因为他的慈爱直到永远”；“长存”是按汉语习惯补出的意思。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“大卫借他们的手赞美时”，结构较为紧缩，可能指利未人代为奏唱大卫的赞歌。
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: 各自的岗位
  rationale: 该词指祭司按班次受派的值守位置或职分；“各自的岗位”既体现有秩序的安排，也符合现代汉语表达。
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: 颂赞雅威的乐器
  rationale: כְּלֵי 指器具或乐器，שִׁיר 指歌唱或音乐；此处指用于敬拜雅威的乐器，同时以脚注保留“属于雅威的乐器”这一可能理解。
- source_word: לְהוֹדוֹת לַיהוָה
  choice: 称谢雅威
  rationale: ידה 的使役词干在此表示感谢或赞美；紧接着的感恩公式支持译作“称谢”。
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: 因为他的信实慈爱永远长存
  rationale: חֶסֶד 融合慈爱、忠诚和守约不变之意；“信实慈爱”比单用“怜悯”涵盖面更广。“长存”是按汉语习惯补出的谓语。
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: 大卫借着他们献上赞美时
  rationale: 原文结构紧缩，字面为大卫“借他们的手”赞美，表达利未人作为媒介奏出或唱出大卫的赞歌；正文采用自然汉语表达，并以脚注保留原文意象。
- source_word: מחצצרים
  choice: 吹号
  rationale: 该动词专指吹响号筒；“吹号”简洁、具体，符合礼仪场景。
- source_word: נֶגְדָּם
  choice: 在他们对面
  rationale: 该介词表示位于某人面前或对面；“在他们对面”保留原文的空间关系。
- source_word: עֹמְדִים
  choice: 站着
  rationale: 分词描绘持续中的姿态和场景，译作“站着”比单纯完成式的“站立”更贴切。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较可能的读音音译，保留其作为专名的性质，而不以称号替代。
- issue: חֶסֶד 的语义范围
  choice: 信实慈爱
  alternative: 慈爱／怜悯／守约的信实
  rationale: 此词兼有慈爱、忠诚及守约不变的含义；“信实慈爱”避免把它缩减为单纯的怜悯，同时不把约的概念过度明说。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用分号和短句呈现礼仪场面的并列层次；避免生硬照搬希伯来语结构，但通过脚注保留词组歧义和“大卫借他们的手赞美”这一压缩表达。
