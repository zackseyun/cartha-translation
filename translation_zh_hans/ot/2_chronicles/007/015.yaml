  text: עַתָּ֗ה עֵינַ/י֙ יִהְי֣וּ פְתֻח֔וֹת וְ/אָזְנַ֖/י קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: zh_hans
  text: 如今，我的眼目必睁开，我的耳朵必留心听这地方的祷告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这地方献上的祷告”，或“从这地方发出的祷告”。希伯来文直译为“这地方的祷告”。
    reason: 说明原文属格结构可能表达的不同关系，同时保留其真实含混性。
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 保留表示当前结果的时间副词；不扩展为较具解释性的“从今以后”。
- source_word: עֵינַי יִהְיוּ פְתֻחוֹת
  choice: 我的眼必睁开
  rationale: 保留原文关于上帝关注的拟人化意象，也表达将持续成立的状态。
- source_word: וְאָזְנַי קַשֻּׁבוֹת
  choice: 我的耳必留心听
  rationale: “留心听”自然表达专注聆听，并保留与“我的眼”平行的身体意象。
- source_word: לִתְפִלַּת
  choice: 祷告
  rationale: 介词 ל 表明注意所指向的对象；中文以“听……祷告”自然承载这一关系。
- source_word: הַמָּקוֹם הַזֶּה
  choice: 这地方的
  rationale: 贴近希伯来语属格结构“这地方的祷告”，不在正文中限定祷告是在此献上还是从此发出。
theological_decisions:
- issue: 关于上帝感知的拟人化语言
  choice: 保留“我的眼”和“我的耳”
  alternative: 译作“我必察看并垂听”
  rationale: 原文用身体意象描写上帝的关注；直译可保存其关系性和盟约语境中的表达力度，而不将其抽象化。
- issue: “这地方的祷告”的关系含义
  choice: 正文保留较含混的属格表达
  alternative: “在这地方献上的祷告”或“从这地方发出的祷告”
  rationale: 希伯来语本身只明确说“这地方的祷告”；正文不应无声地裁定祷告与地点之间的具体关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必睁开……必留心听”保留经文的平行结构与郑重语气；使用“这地方”而非更口语的“这里”，以配合圣殿奉献语境。
