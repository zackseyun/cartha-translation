revisions:
- from: 他们必说：“这是因为他们离弃了耶和华他们列祖的神，就是那领他们出埃及地的神；他们依附别神[a]，向别神下拜，事奉别神。因此，耶和华使这一切灾祸临到他们[b]。”
  to: 他们必说：“这是因为他们离弃了耶和华，就是他们列祖的神；他曾领他们出埃及地，他们却依附别神[a]，向它们下拜，事奉它们。因此，耶和华使这一切灾祸临到他们[b]。”
  rationale: 修订仅澄清“耶和华”与“他们列祖的神”的同位关系，并将原文关系从句以自然的中文分句表达；“它们”明确回指别神。脚注 a 改善中文搭配，仍保留 חזק加介词所表达的执意依附之意。
