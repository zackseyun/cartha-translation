source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: zh_hans
  text: 他们必说：“这是因为他们离弃了耶和华，就是他们列祖的神；他曾领他们出埃及地，他们却依附别神[a]，向它们下拜，事奉它们。因此，耶和华使这一切灾祸临到他们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “依附”原文直译为“抓住”，也可译作“紧紧依附”或“投靠”，表示他们主动而坚定地归附别神。
    reason: lexical_alternative
  - marker: b
    text: “灾祸”在这里指临到人的灾难或审判，不是指道德上的邪恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 他们必说
  rationale: 连词加完成式承接上一节的预告，在这里表达将来的结果；“必说”自然且保留确定语气。
- source_word: עַל אֲשֶׁר
  choice: 这是因为
  rationale: 该结构引出灾难发生的原因；“这是因为”适合直接引语中的解释。
- source_word: עָזְבוּ
  choice: 离弃
  rationale: 既表达抛弃，也保留背弃与神之关系的郑重含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中对四字神名的通行音译，保留其作为专名的性质。
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: 他们列祖的神
  rationale: “列祖”简洁表达群体的先祖，并保留圣约历史的庄重语感。
- source_word: אֲשֶׁר הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: 就是那领他们出埃及地的神
  rationale: 准确表达使役式“使他们出来”的意义；补出“神”使较长定语在中文中更清楚。
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: 他们依附别神
  rationale: חזק 加介词 ב 在此表达主动抓住、执意归附；“依附”在现代中文中自然，并保留刻意结合的意味。
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: 向别神下拜
  rationale: 保留俯伏下拜的具体动作，不与后面的“事奉”合并。
- source_word: וַיַּעַבְדוּם
  choice: 事奉别神
  rationale: 在以神明为宾语时，עבד 表示宗教性的服事；“事奉”保留与“下拜”的词义区别。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 明确标示前述背弃行为所导致的后果。
- source_word: הֵבִיא עֲלֵיהֶם
  choice: 使……临到他们
  rationale: 符合希伯来语“使之来到其上”的使役结构，也是自然庄重的现代中文。
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: 这一切灾祸
  rationale: רָעָה 在本节指审判性的灾难而非道德上的邪恶；“灾祸”准确保留其语境含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。中文正文采用广为读者识别的传统音译“耶和华”，而不以“主”这一称号代替，从而保留专名性质。
- issue: 灾祸的施行者是否明说
  choice: 耶和华使这一切灾祸临到他们
  alternative: 他使这一切灾祸临到他们
  rationale: 希伯来语动词主语由前文的耶和华延续而来。中文若仅用“他”，可能因紧邻“别神”而产生错误指代；重述神名是为澄清语法指向，不改变神学内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“列祖、事奉、临到”等已为普通读者理解的圣经语汇；通过重复“别神”和“耶和华”避免中文代词指向含混。所有脚注标记均置于正文相应词句之后。
