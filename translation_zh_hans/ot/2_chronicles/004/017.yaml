base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/017.yaml
  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: zh_hans
  text: 王在约旦河平原、疏割和撒利但之间，在厚实的泥土中[a]铸造了这些器物。撒利但[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在厚实的泥土中”。在铸造器物的语境中，这可能指适于制模浇铸的黏土层，但原文未明确说明具体工艺。
    reason: 保留罕见工艺／地貌短语的字面含义及其合理的语境解释。
  - marker: b
    text: 《列王纪上》7:46的平行经文作“撒拉但”；本节希伯来文本作“撒利但”，可能是同一地名的另一形式。
    reason: 说明平行经文中的地名异文。
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: 在约旦河平原
  rationale: כִּכָּר在此指约旦河一带的平原地区；译作“约旦河平原”自然清楚，也保留地形含义。
- source_word: יְצָקָם
  choice: 铸造了这些器物
  rationale: יצק在金属器具制造语境中指浇铸；宾语后缀为复数，结合上文明确为圣殿器物，补出“器物”使中文指代清楚。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词所指为上下文中的所罗门；中文叙事中译作“王”简洁自然。
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: 用黏土模
  rationale: 短语字面涉及泥土的厚实或密实状态；在青铜浇铸语境下，指利用黏土制作铸模。译文表达实际工艺，同时用脚注说明原文较直译的含义与可能译法。
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: 就是疏割和洗利达之间
  rationale: 按原文《历代志》的地名形式音译；“就是”自然连接平原与更具体的位置。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“黏土模”比“黏土之地”更符合中文工艺表达，但脚注保留原文的字面张力；地名采用常见简体中文圣经音译形式。
