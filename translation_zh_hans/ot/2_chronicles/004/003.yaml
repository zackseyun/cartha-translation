base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: zh_hans
  text: 海盆下方四周有牛像[a]，每肘十个[b]，环绕海盆一周。牛像排成两行，与海盆一同铸成[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“牛的形像”；希伯来文指牛形的装饰造型，并非活牛。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“每肘十个”，大概是指沿海盆圆周每一肘排列十个牛像。
    reason: cultural_note
  - marker: c
    text: 希伯来文直译“在它的铸造中”；意思是牛像与海盆在同一次浇铸中成形。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: 牛像
  rationale: דְּמוּת表示形状、样式或形像；这里指铸造在器物上的牛形装饰，并非活牛。“牛像”简洁自然，也保留其表象性质。
- source_word: תַּחַת לוֹ
  choice: 在海盆下面
  rationale: 表示这些牛像位于“海”的下方；补出“海盆”使现代读者清楚所指是圣殿器具。
- source_word: סָבִיב סָבִיב סוֹבְבִים אֹתוֹ
  choice: 有一圈……环绕
  rationale: 希伯来文重复“周围”以加强环绕之意；中文以“一圈”和“环绕”自然传达这种视觉效果。
- source_word: עֶשֶׂר בָּאַמָּה
  choice: 每肘十个
  rationale: 直译其数量与长度的比例关系，指沿圆周每一肘有十个牛像。
- source_word: מַקִּיפִים אֶת הַיָּם סָבִיב
  choice: 环绕海盆一周
  rationale: 保留牛像围绕器皿整圈排列的意思；“海盆”说明הַיָּם在此是圣殿大型水盆的名称。
- source_word: שְׁנַיִם טוּרִים
  choice: 排成两行
  rationale: טוּרִים指成列、成行的排列；“排成两行”符合现代中文表达。
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: 与海盆一同铸成
  rationale: 金属加工语境中的יצק指浇铸；此短语说明牛像在海盆铸造时一同成形，而非后来另行安装。
