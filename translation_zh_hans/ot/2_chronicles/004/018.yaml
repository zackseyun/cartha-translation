base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/018.yaml
  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: zh_hans
  text: 所罗门制作了这一切器具，数量极多，因为铜的重量无法查明[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无法查明”也可译作“没有核定”。原文动词可表示“查究”或“确定”；这里是说铜极多，其重量没有被核算出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 制造了
  rationale: עָשָׂה在此指制作圣殿器具；“制造”自然、明确，也符合金属器物的语境。
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: 这一切器具
  rationale: כֵּלִים是涵盖各类用具、器皿的广义词；结合上下文所列圣殿物件，“器具”比单指容器的“器皿”更全面。
- source_word: לָרֹב מְאֹד
  choice: 数量极其众多
  rationale: לָרֹב表示数量多，מְאֹד加强程度；此译明确保留数量含义和强烈语气。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在这里引出对前句的解释；“因为”保留原文显明的因果或说明关系，而不擅自改写为结果关系。
- source_word: לֹא נֶחְקַר
  choice: 无法查明
  rationale: חקר的尼法勒式可指未被查究、未被确定；在重量语境中，“无法查明”既自然，又保留“查考后确定”的词义色彩。
- source_word: מִשְׁקַל
  choice: 重量
  rationale: מִשְׁקַל具体指重量，应避免泛化为“数量”。
- source_word: הַנְּחֹשֶׁת
  choice: 所用铜
  rationale: נְחֹשֶׁת可指铜或青铜；古代圣殿器物语境通常理解为青铜，但原词本身并不严格区分。“所用铜”在中文中自然，并说明这里所称的是制作器具所耗用的金属。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“数量极其众多”完整体现原文的强化表达；保留“因为”所呈现的解释关系，不将其改写成原文未明说的“以致”。
