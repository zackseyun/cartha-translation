  terminology: “灯台”“按定例”“内殿”均适切、庄重。“内殿”保留原词的空间性，脚注提供“至圣所”为可行传统译法。材质宜保留为“纯金制的”，并以脚注说明该希伯来语词组亦可理解为精炼的金。
