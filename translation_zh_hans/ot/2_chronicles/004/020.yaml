base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/020.yaml
  text: the lampstands and their lamps[a], to burn according to the ordinance before the inner sanctuary, of pure gold[b];
translation:
  language: zh_hans
  text: 以及纯金[b]制的灯台和台上的灯，使灯按定例在内殿[a]前燃烧；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“至圣所”。希伯来语 דְּבִיר 指圣殿内部的圣所。
    reason: lexical_alternative
  - marker: b
    text: 或译“精炼的金”。希伯来语词组 זָהָב סָגוּר 指品质上乘、经过提炼的金。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: 灯台
  rationale: מְנוֹרָה指承托灯盏的台架；“灯台”是现代中文圣殿器具语境中清楚、庄重的表达。
- source_word: וְנֵרֹתֵיהֶם
  choice: 和台上的灯
  rationale: נֵר可指灯或灯火；这里是灯台所承托的灯，译作“台上的灯”既说明所属关系，也避免误解为抽象的光。
- source_word: לְבַעֲרָם
  choice: 使灯……点燃
  rationale: 该不定式带第三人称复数后缀，表达使这些灯燃烧的目的；中文用“使灯……点燃”明确保留其使役和目的含义。
- source_word: כַּמִּשְׁפָּט
  choice: 按定例
  rationale: מִשְׁפָּט在此指礼仪上规定的方式或规例；“按定例”简洁地保留其规范性。
- source_word: לִפְנֵי הַדְּבִיר
  choice: 在内殿前
  rationale: דְּבִיר指圣殿最里面的圣所；“内殿”自然且不过度限定，并以脚注保留“至圣所”这一传统译法。
- source_word: זָהָב סָגוּר
  choice: 纯金制成的
  rationale: זָהָב סָגוּר表示高品质、经过精炼的金；“纯金”符合现代中文习惯，“制成的”清楚交代器物材质。
- source_word: וְאֶת
  choice: 以及
  rationale: וְ连接上一节延续的器物清单，אֶת是直接宾语标记；“以及”自然体现清单的承接关系，而不机械翻译宾语标记。
theological_decisions:
- issue: הַדְּבִיר所指圣殿空间的名称
  choice: 正文译“内殿”
  alternative: 至圣所
  rationale: 原词本身着重圣殿内部最深处的圣所。“内殿”较贴近词义并保留术语空间，“至圣所”作为可能且传统的理解收入脚注，避免正文无声地消除词汇差异。
translation_notes:
  register: 采用现代、庄重而易懂的清单体表达。“以及”承接上一节；分号保留本节作为较长器物清单一部分的未完句式。脚注标记均置于所解释的词语之后。
