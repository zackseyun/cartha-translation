base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: zh_hans
  text: 它厚一掌[a]，边沿做成杯口的样式，像百合花。它可容纳三千罢特[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一掌”是古代长度单位，约为一个手掌的宽度。
    reason: cultural_note
  - marker: b
    text: “罢特”是古希伯来的液量单位。《列王纪上》7:26说铜海可容纳两千罢特；这里则作三千罢特。两者可能分别指最大容量与通常装载量，也可能反映文本或传承上的差异。
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: 它厚
  rationale: 该词指铸造铜海器壁的厚度；译作“厚”简洁自然，并准确表达建筑器物语境中的尺寸。
- source_word: טֶפַח
  choice: 一掌
  rationale: 这是古代以手掌宽度为基础的小长度单位；“一掌”既保留原单位，也便于现代读者理解。
- source_word: שְׂפָתוֹ
  choice: 边沿
  rationale: שָׂפָה用于器皿时指口沿或边缘；“边沿”适用于大型盆状器皿，且语言自然。
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: 边沿的样式如同杯口
  rationale: מַעֲשֶׂה在此指制作出的式样或形制；译文保留铜海边沿与杯口形制之间的比较。
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: 又像百合花
  rationale: 该短语描写花朵形状；“百合花”自然、形象，并保留它与前一比较之间可能的同位或补充关系。
- source_word: מַחֲזִיק ... יָכִיל
  choice: 它可容纳
  rationale: 原文以分词和限定动词共同表达容量；汉语用“可容纳”自然传达其容量意义，避免机械重复。
- source_word: בַּתִּים
  choice: 罢特
  rationale: 这是古希伯来的液量单位בַּת；采用音译，不擅自换算成存在争议的现代容量。
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: 三千
  rationale: 按马所拉文本直接译出数量。
theological_decisions:
- issue: 本节“三千罢特”与《列王纪上》7:26的“两千罢特”不同
  choice: 正文依《历代志下》的马所拉文本译作“三千”，并在脚注说明平行经文的差异
  alternative: 在正文中调和为“两千”，或断言两数分别指最大容量和通常装载量
  rationale: 源文本明确写“三千”；两处数字差异的成因无法由经文本身确定，因此不在正文中改写，也不把某种调和解释当作定论。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“边沿的样式如同杯口，又像百合花”保留原文连续比喻及其关系上的一定含混，不进一步断定具体造型。“罢特”采用常见的圣经度量衡音译，并以脚注解释。
