base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: zh_hans
  text: 他又铸造了“海”[a]：从边沿到边沿十肘，周围是圆形的；高五肘，一条三十肘的线环绕它四周[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海”是圣殿中这个大型水盆的名称；也可按字面译为“铸造的海”。
    reason: lexical_alternative
  - marker: b
    text: 原文说“一条三十肘的线环绕它四周”。这是古代按直径与周长描述圆形器物的惯常方式。
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: “海”
  rationale: 直译这一圣殿大型水盆的专名，并用引号表明这里不是普通的海；注释说明其所指。
- source_word: מוּצָק
  choice: 铸造
  rationale: 该词表示以熔化的金属浇铸而成；译为动词“铸造”既自然，也避免在本节未明说的情况下擅自补出金属种类。
- source_word: עֶשֶׂר בָּאַמָּה
  choice: 十肘
  rationale: 保留古代长度单位；后面的“从这边沿到那边沿”明确这是横向尺寸。
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: 从这边沿到那边沿
  rationale: שָׂפָה可指器皿的唇口或边沿；此译符合现代汉语对大型容器口沿的表达。
- source_word: עָגוֹל סָבִיב
  choice: 周围呈圆形
  rationale: 同时表达עָגוֹל的圆形和סָבִיב的周围之意，避免生硬重复。
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: 高五肘
  rationale: 简洁、自然地保留原文对器物高度的陈述。
- source_word: וְקָו
  choice: 一条……绳
  rationale: קַו在这里指用于量度的线或绳；译作“绳”保留具体的测量工具意象，而不直接抽象化为“周长”。
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: 环绕它一周
  rationale: 传达该绳围绕器物四周的意思，并以自然现代汉语呈现原文动词与副词的组合。
