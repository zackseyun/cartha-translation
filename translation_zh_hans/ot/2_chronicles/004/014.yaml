  text: He made the stands[b][a], and he made the basins on the stands.
translation:
  language: zh_hans
  text: 他制造了盆座[a]，又制造了盆座上的盆[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盆座”或译“底座”；希伯来语所指的是承托这些盆的结构。
    reason: lexical_alternative
  - marker: b
    text: 这里的“盆”指供洗濯使用的盆；传统译法有“洗濯盆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: 盆座
  rationale: 此词在圣殿器具的语境中指承托盆的特制支座；“盆座”既说明其功能，又比单说“底座”更明确。
- source_word: עָשָׂה
  choice: 制造
  rationale: 常用动词 עשה 在这里表示制作器具；“制造”自然、庄重，不额外强化工艺色彩。
- source_word: הַכִּיֹּרוֹת
  choice: 盆
  rationale: כִּיּוֹר 指供洗濯使用的盆；现代汉语用“盆”清楚易懂，而“洗濯盆”虽更具体，却会加入原词在本句中未明说的用途。
- source_word: עַל
  choice: 在……上
  rationale: 该介词表示盆位于支座之上；“盆座上的盆”以自然汉语准确表达这种空间关系。
- source_word: וְאֶת ... וְאֶת
  choice: ……，又……
  rationale: 两个带连接词的宾语结构组成并列清单；汉语用“又”连接两个制作动作，既顺畅也保留重复句式。
