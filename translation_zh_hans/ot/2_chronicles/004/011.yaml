base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: zh_hans
  text: 户兰[a]制造了盆、铲和碗。于是，户兰完成了他为所罗门王在上帝的殿中所做的工作：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文的人名也作“希兰”；相关经文和中文译本传统中常见这一写法。
    reason: alternative_reading
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: 户兰
  rationale: 按本节马所拉文本所反映的名称形式音译，并与相关经文常见的另一译名“希兰”区别；同一节内两种希伯来拼写视为同一人名。
- source_word: הַסִּירוֹת
  choice: 盆
  rationale: 该词泛指盛装用的器皿；在圣殿器具语境中译作“盆”自然，又不武断限定为烹调用锅。
- source_word: הַיָּעִים
  choice: 铲
  rationale: 指处理祭坛灰烬或其他物料的器具，“铲”简明且符合语境。
- source_word: הַמִּזְרָקוֹת
  choice: 碗
  rationale: 指礼仪中使用的碗状器皿；译作“碗”保留器形而不额外加入其具体礼仪用途。
- source_word: וַיְכַל
  choice: 完成了
  rationale: 这里的 כלה 表示完成、做完，译作“完成了”符合叙事语体。
- source_word: לַעֲשׂוֹת אֶת הַמְּלָאכָה
  choice: 完成了……工程
  rationale: 此结构指完成受托的制作工作；“工程”能自然涵盖前后所列的各项器具制作。
- source_word: אֲשֶׁר עָשָׂה לַמֶּלֶךְ שְׁלֹמֹה
  choice: 他为所罗门王……所做的
  rationale: 保留关系从句和“为所罗门王”的受益或委托关系，同时避免连续重复“制造”。
- source_word: בְּבֵית הָאֱלֹהִים
  choice: 在上帝殿中
  rationale: 保留介词 בְּ 最直接的地点含义“在……中”；“上帝殿”自然表达字面的“上帝之家”，并符合圣殿语境。
theological_decisions:
- issue: בְּבֵית הָאֱלֹהִים 中介词的关系
  choice: 在上帝殿中
  alternative: 为上帝的殿
  rationale: 希伯来文 בְּ 通常首先表达地点；不因工程显然服务于圣殿，就把它改释为目的关系。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“盆、铲和碗”保持器具清单简洁；句末冒号予以保留，因为本节引出下文对工程项目的列举。
