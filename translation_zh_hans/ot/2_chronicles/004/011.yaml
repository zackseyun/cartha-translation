  to: 户兰[a]制造了盆、铲和碗。于是，户兰完成了他为所罗门王在上帝的殿中所做的工作：
  rationale: 修正“上帝殿中”为自然的“上帝的殿中”，以“工作”避免将受托制作过度限定为建筑工程，并保留人名异写的注释锚点。其余译文保持原文的器具清单、叙事完成体和句末引出下文列举的冒号。
