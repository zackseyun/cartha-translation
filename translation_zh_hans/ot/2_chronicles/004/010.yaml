  text: And he set the Sea at the southeast side[a], facing south.
translation:
  language: zh_hans
  text: 他把“海”安放在东南边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“在右边，向东，与南方相对。”古希伯来人描述方位时通常以面向东方为基准，所以“右边”相当于南边；与“向东”合起来，所指的是东南边。
    reason: 说明正文对原文方位表达所作的综合翻译，并保留其字面形式。
lexical_decisions:
- source_word: וְאֶת
  choice: 他把
  rationale: וְ承接上文；אֵת是宾语标记，汉语用“把”字结构自然表达，不另作实词翻译。
- source_word: הַיָּם
  choice: “海”
  rationale: 直译为“海”，指圣殿中那座大型铜盆；加引号表明这是器物的特定称呼，同时不把原文此处未明说的“铜”加入正文。
- source_word: נָתַן
  choice: 安放
  rationale: 在陈设圣殿器具的语境中，נָתַן表示把器物放置在指定位置；“安放”自然且庄重。
- source_word: מִכֶּתֶף הַיְמָנִית קֵדְמָה
  choice: 在东南边
  rationale: כָּתֵף在空间描述中指侧边；古希伯来方位通常以面向东方为基准，因此“右边”即南边，再与“向东”合起来表示东南边。正文采用综合方位，脚注保留原文逐字结构。
- source_word: מִמּוּל נֶגְבָּה
  choice: 朝着南方
  rationale: מִמּוּל表达相对、面对的位置关系，נֶגְבָּה表示向南；“朝着南方”符合现代汉语，也保留器物所处方位关系。
