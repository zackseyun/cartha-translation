base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: zh_hans
  text: 所罗门制造了神殿所用的一切器具：金坛、桌子，以及摆在桌上的陈设饼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“面前的饼”；也可译为“临在之饼”。
    reason: 说明原文礼仪术语的字面意义，并保留正文中自然、通行的称呼。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 制造了
  rationale: עָשָׂה在器具清单的语境中表示“制作、制造”；“制造”自然表达器物由人制成，也保持庄重。
- source_word: כָּל הַכֵּלִים אֲשֶׁר בֵּית הָאֱלֹהִים
  choice: 神殿所用的一切器具
  rationale: 原文关系结构简略，语义是这些器具属于或供神的殿使用；“所用”比单说“在神殿里”更准确。“神殿”是现代汉语对“神的殿宇”的自然表达。
- source_word: מִזְבַּח הַזָּהָב
  choice: 金坛
  rationale: 直指以金制成或包金的祭坛；“金坛”简洁，并符合圣殿器具的中文表达。
- source_word: הַשֻּׁלְחָנוֹת
  choice: 桌子
  rationale: 保留原文复数所表达的多张桌子，不将其具体化为原文未明说的其他器具。
- source_word: וַעֲלֵיהֶם
  choice: 摆在桌上
  rationale: 明确复数代词所回指的是桌子，并自然表达饼与桌子之间的位置关系。
- source_word: לֶחֶם הַפָּנִים
  choice: 陈设在神面前的饼
  rationale: 该礼仪用语字面为“面前之饼”，指陈设在神面前的饼；此译法比只用传统术语“陈设饼”更透明。
theological_decisions:
- issue: בֵּית הָאֱלֹהִים的表达
  choice: 神殿
  alternative: 神的殿
  rationale: 两者均可表达“神的家／殿宇”；“神殿”在现代汉语中简洁清楚，且上下文明确指圣殿，并不引入额外教义含义。
- issue: לֶחֶם הַפָּנִים的表达
  choice: 陈设在神面前的饼
  alternative: 陈设饼
  rationale: 选择透明呈现这饼置于神面前的礼仪意义，同时以脚注保留传统简称；这里补明“神”是该圣殿语境中“面前”的隐含所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神殿所用”传达原文中器具归属或用途的简略结构；末项稍作展开，以自然汉语同时保留饼摆在桌上以及陈设在神面前两层信息。
