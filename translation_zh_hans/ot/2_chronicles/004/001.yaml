  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: zh_hans
  text: 他造了一座铜坛[a]，长二十肘，宽二十肘，高十肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜”也可译作“青铜”。原文所用的词可指铜或铜合金。
    reason: 保留נְחֹשֶׁת在金属种类上的词义范围，说明常见的具体译法。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他造了
  rationale: 该叙事性动词形式推进事件，汉语用简单过去语义的“造了”自然表达；主语承接上文。
- source_word: מִזְבַּח
  choice: 一座……坛
  rationale: מִזְבַּח指献祭用的坛；“坛”是简洁且通行的圣经建筑用语，量词“一座”符合现代汉语。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可泛指铜或铜合金；汉语“铜”能保留材质范围，避免在原文未明确合金成分时过度限定为“青铜”。
- source_word: עֶשְׂרִים אַמָּה אָרְכּוֹ
  choice: 长二十肘
  rationale: 按现代汉语尺寸表达重组为“长二十肘”，同时保留古代长度单位“肘”。
- source_word: וְעֶשְׂרִים אַמָּה רָחְבּוֹ
  choice: 宽二十肘
  rationale: רֹחַב在建筑尺寸中指宽度，译作“宽”自然准确。
- source_word: וְעֶשֶׂר אַמּוֹת קוֹמָתוֹ
  choice: 高十肘
  rationale: קוֹמָה在此指物体高度；“高十肘”符合现代汉语尺寸表述。
