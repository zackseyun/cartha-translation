  text: the one Sea[a], and the twelve oxen under it.
translation:
  language: zh_hans
  text: 一座铜海，和它下面的十二头牛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיָּם
  choice: 铜海
  rationale: יָם字面意为“海”，在圣殿器具语境中指大型铸造水盆，作为专名译作“铜海”既符合现代中文的传统称呼，也明确其器物性质；“铜”由本章语境所说明。
- source_word: אֶחָד
  choice: 那一个
  rationale: 保留数词“一”的清单式表达；与“那”结合，使片段在中文中自然，并呼应前文所列器物。
- source_word: הַבָּקָר
  choice: 牛
  rationale: בָּקָר是牛类的集合名词，此处指承托铜海的十二个牛形像；不进一步限定为公牛或阉牛，以免超出原词信息。
- source_word: שְׁנֵים עָשָׂר
  choice: 十二头
  rationale: 准确表达复合数词“十二”，并使用现代汉语中计数牛的量词“头”。
- source_word: תַּחְתָּיו
  choice: 它下面的
  rationale: 第三人称阳性单数后缀回指“海”；此译简洁自然，并表达这些牛位于其下。
- source_word: אֶת ... וְאֶת
  choice: 不单独翻译
  rationale: אֶת是直接宾语标记，中文无需对应词，其并列关系由“和”及语序表达。
