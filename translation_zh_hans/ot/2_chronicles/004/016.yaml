base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: zh_hans
  text: 户兰·亚比[a]为所罗门王、为雅威的殿制造了锅、铲子、叉子以及其余所有器具；这一切都是用磨亮的青铜[b]制成的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “户兰·亚比”也可译作“户兰，他的父亲”；这里较可能是这名工匠的复合名字或称号。
    reason: alternative_reading
  - marker: b
    text: “磨亮的青铜”也可译作“磨光的青铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: 锅
  rationale: סִירוֹת通常指锅或烹煮用的容器；在圣殿器具清单中译作“锅”具体而自然。
- source_word: הַיָּעִים
  choice: 铲子
  rationale: יָעִים指清除灰烬或拨弄炭火的铲形器具，“铲子”符合语境。
- source_word: הַמִּזְלָגוֹת
  choice: 叉子
  rationale: מִזְלָגוֹת指带齿的叉形器具；“叉子”既贴近原词，也便于现代读者理解。
- source_word: כָּל כְּלֵיהֶם
  choice: 及其一切用具
  rationale: כְּלִי是涵盖器皿、工具和用具的宽泛词；此处采用自然的集合表达，同时保留代词所指的概括性。
- source_word: חוּרָם אָבִיו
  choice: 户兰·亚比
  rationale: 结合历代志对这名工匠的称呼，将该词组视为复合名字或称号，可避免正文误传为所罗门或户兰的亲生父亲。
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: 为所罗门王
  rationale: 介词לְ在此表示受益者或受命对象；“为所罗门王”准确传达奉王之命制作的关系。
- source_word: לְבֵית יְהוָה
  choice: 供雅威的殿使用
  rationale: בֵּית יְהוָה直译为“雅威的家”；在圣殿建筑语境中，“雅威的殿”自然明确，补出“使用”表达器具的用途。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其专名性质。
- source_word: נְחֹשֶׁת מָרוּק
  choice: 磨亮的青铜
  rationale: נְחֹשֶׁת在古代器物语境中通常指铜或青铜，מָרוּק表示经过擦磨而光亮；“磨亮的青铜”准确且通顺。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名，译作“雅威”可保留其作为盟约之神专名的性质，而不以称号替代。
- issue: חוּרָם אָבִיו的身份含义
  choice: 作为复合名字或称号“户兰·亚比”
  alternative: “户兰，他父亲”或“户兰，他的师傅”
  rationale: 原文形式确实容许把אָבִיו按普通词义理解为“他的父亲”，但本段上下文将其用作工匠的称谓；正文采用复合名，并以脚注保留另一种语法理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。器具名称使用普通现代汉语；保留“户兰·亚比”的原文歧义并用脚注说明。句末改写为“这些都是用……制成的”，使希伯来语后置的材料说明在汉语中清楚自然。
