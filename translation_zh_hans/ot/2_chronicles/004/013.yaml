base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: zh_hans
  text: 以及为两件网状饰物[a]所配的四百个石榴；每件网状饰物各有两行石榴，用来遮盖柱子上的两个柱头的碗状部分[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“格子饰网”。原文指柱头上的网状装饰结构。
    reason: lexical_alternative
  - marker: b
    text: 直译“柱头的两个碗”。原文用碗的形象描写柱头上圆弧形的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: 石榴
  rationale: 保留该名词的具体形象；在圣殿器物的语境中，自然可理解为石榴形的装饰。
- source_word: אַרְבַּע מֵאוֹת
  choice: 四百个
  rationale: 按原文直译基数，并用量词使现代汉语自然。
- source_word: שְּׂבָכוֹת
  choice: 网状饰物
  rationale: 该词指柱头上的网状或格子状装饰结构；“网状饰物”既说明形态，也符合器物清单的语境。
- source_word: שְׁנַיִם טוּרִים
  choice: 两行
  rationale: טוּרִים表示按次序排列的行列；“两行”简明准确。
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: 每张网状饰物上
  rationale: 原文形式上是“在那一张网状饰物上”，在两张饰物的语境中具有逐一分配的意思，现代汉语用“每张”表达最清楚。
- source_word: לְכַסּוֹת
  choice: 用来遮盖
  rationale: 保留不定式所表达的用途或目的。
- source_word: גֻּלּוֹת
  choice: 碗状部分
  rationale: 该词描写柱头上圆而似碗的构件；译作“碗状部分”保留原文形象，同时避免误解为另置的器皿。
- source_word: כֹּתָרוֹת
  choice: 柱头
  rationale: 在建筑语境中指柱子顶部的柱头，而不是君王所戴的冠冕。
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: 柱子顶上
  rationale: 字面涉及柱子的表面或上方；结合柱头的位置，译作“柱子顶上”最符合此处空间关系。
theological_decisions: []
