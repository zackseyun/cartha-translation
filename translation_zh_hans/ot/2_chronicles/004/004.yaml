  text: עוֹמֵ֞ד עַל שְׁנֵ֧ים עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלוֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: zh_hans
  text: 海立在十二头牛上：三头朝北，三头朝西[a]，三头朝南，三头朝东。海在它们上面，所有牛的后部都朝向里面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朝西”按希伯来语的方位惯用法翻译；原文直译为“朝海”。
    reason: lexical_alternative
  - marker: b
    text: “后部”也可译作“后身”；“里面”指向这一支承结构的内部，或中央方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  choice: 立在
  rationale: 该词为动词עמד的主动分词，在这里描述海的静止位置；“立在”既保留其状态含义，也符合支承结构的描写。
- source_word: בָּקָר
  choice: 牛
  rationale: 此处指支撑铜海的十二个牛形铸像；希伯来词可泛指牛类，译作“牛”避免无根据地限定为公牛或阉牛。
- source_word: פֹנִים
  choice: 朝
  rationale: 字面涉及“脸面朝向”，但在本句的方位结构中表示面向某方向；“朝”简洁自然。
- source_word: יָמָּה
  choice: 朝西
  rationale: 该词字面与“海”有关，但在希伯来语方位用法中通常指向海的方向，即西方；正文译明实际方位，脚注保留字面信息。
- source_word: הַיָּם
  choice: 海
  rationale: 这里不是地理意义上的海，而是圣殿中的大型铜制水池；沿用上下文中的专名“海”，保留希伯来原文的称呼。
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: 在它们上面
  rationale: 该短语强调海位于十二头牛之上；直译清楚，也保留原文略显重复的空间描写。
- source_word: אֲחֹרֵיהֶם
  choice: 所有牛的后部
  rationale: 原词表示它们的后面或后部；“后部”庄重而明确，不把含义缩窄为某一具体解剖部位。
- source_word: בָּיְתָה
  choice: 朝向里面
  rationale: 这是带方向意味的形式，表示向内，即朝支承结构的内部或中央；原文没有明确说“中央”，因此正文保留较宽泛的“里面”。
