base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: zh_hans
  text: 他造了十张桌子，安放在圣殿里，右边五张，左边五张；又造了一百个金碗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金盆”或“金洒血盆”；原文所用的词指圣殿礼仪中使用的器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: 桌子
  rationale: 该词通常指桌子；在圣殿器具清单中采用普通、明确的名称，不额外限定其用途。
- source_word: וַיַּנַּח
  choice: 安放
  rationale: 该动词表示把物件放置在某处；“安放”自然庄重，也体现有意安排位置的动作。
- source_word: בַּהֵיכָל
  choice: 在圣殿里
  rationale: הֵיכָל 可指宫殿或殿堂，但在本段敬拜设施的语境中明确指圣殿建筑；译作“圣殿”可避免误解为王宫。
- source_word: מִיָּמִין
  choice: 右边
  rationale: 保留原文的相对方位，不将其解释为某一罗盘方向。
- source_word: מִשְּׂמֹאול
  choice: 左边
  rationale: 与“右边”对称，忠实保留原文的相对空间安排。
- source_word: מִזְרְקֵי זָהָב
  choice: 金碗
  rationale: מִזְרָק 指圣殿礼仪中使用的碗或盆。“金碗”简洁易懂，具体礼仪含义及其他可行译法在脚注说明。
- source_word: מֵאָה
  choice: 一百个
  rationale: 直接译出基数，并按现代汉语为器皿配用量词“个”。
theological_decisions: []
