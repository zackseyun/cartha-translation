base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: zh_hans
  text: 并有灯剪、盆、碗和火盘，都是纯金制的；殿的门口——通往至圣所的内门，以及通往正殿的殿门——都是金制的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: 灯剪
  rationale: 在圣殿器具清单中指修剪灯芯的工具；“灯剪”简明自然，也比泛称“刀”更符合语境。
- source_word: מִּזְרָקוֹת
  choice: 盆
  rationale: 该词常指承接或洒祭牲之血的器皿；译作“盆”可与后面的“碗”区别。
- source_word: כַּפּוֹת
  choice: 碗
  rationale: 该词可指较小的容器；“碗”既自然，也不与前面的“盆”混同。
- source_word: מַּחְתּוֹת
  choice: 火铲
  rationale: 指盛取或搬运炭火的器具；“火铲”保留其与火有关的用途，而不特定解释为焚香用的香炉。
- source_word: זָהָב סָגוּר
  choice: 纯金
  rationale: 这一搭配表示品质上乘、经过炼净的金；“纯金”是现代汉语中清楚而庄重的表达。
- source_word: פֶּתַח הַבַּיִת
  choice: 殿的入口
  rationale: פֶּתַח指入口或门口；结合圣殿语境，以“殿”译הַבַּיִת比直译“房屋”自然。
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: 内门
  rationale: 复数可指成对的门或门扇；“内门”简洁保留其与随后另一组殿门的对照。
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: 通往至圣所的
  rationale: 介词לְ在门的语境中自然表达其所通向之处；“至圣所”准确传达希伯来语最高级结构。
- source_word: וְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: 通往正殿的殿门
  rationale: הֵיכָל在这里指区别于至圣所的圣殿主体内室；“正殿”通俗庄重，并清楚显示两组门的区别。
- source_word: זָהָב
  choice: 也都是金的
  rationale: 句末的“金”在希伯来文中作材料谓语；补出“也都是……的”使中文语法完整，并与前半句呼应。
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים的名称
  choice: 至圣所
  alternative: 圣中之圣
  rationale: “至圣所”是现代中文读者熟悉且准确的名称，既表达希伯来语的最高级意义，也不额外加入宗派解释。
- issue: הֵיכָל所指的圣殿空间
  choice: 正殿
  alternative: 圣所／殿堂
  rationale: 上下文将其与至圣所区分，故以“正殿”表示圣殿的主要内室；避免用可能涵盖整座圣殿的宽泛词语。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。前半句补出“都是”，后半句补出“也都是”，使两个句末材料谓语在中文中清晰呈现；不加入原文没有的礼仪用途说明。
