base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: zh_hans
  text: 他造了十个盆[a]，五个安在右边，五个安在左边，供洗涤之用；用这些盆洗涤献燔祭所用的物件[b]。至于“海”[c]，是给祭司洗濯用的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盆”也可译作“洗濯盆”，指圣殿礼仪中使用的盛水洗涤器皿。
    reason: lexical_alternative
  - marker: b
    text: “献燔祭所用的物件”：希伯来文直译近于“燔祭的工作”，可能泛指预备和献上燔祭时需要冲洗的物件或材料。
    reason: lexical_alternative
  - marker: c
    text: “海”是大型铜制贮水器的称呼；本节说明它供祭司洗濯。
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: 盆
  rationale: 指圣殿礼仪中盛水洗涤的大型器皿。“盆”是现代汉语中清楚自然的称呼；脚注补充“洗濯盆”这一较明确的译法。
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: 在右边／在左边
  rationale: 按原文保留空间方位，不擅自补明是圣殿、院子或其他参照物的哪一侧。
- source_word: לְרָחְצָה
  choice: 供洗涤之用
  rationale: 表达目的意义，既自然，也与下文具体的“冲洗”相区分。
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: 献燔祭所用的物件
  rationale: 原文直译近于“燔祭的工作／制品”，语义有所省略；结合礼仪语境，译为与预备、献上燔祭有关并需冲洗的物件，同时以脚注保留原文措辞的不确定性。
- source_word: יָדִיחוּ
  choice: 都在盆里冲洗
  rationale: 该动词在这里表示冲洗、洗去污物；未完成式结合器具用途可表达惯常行为。“都”使汉语句子顺畅，但不改变范围。
- source_word: וְהַיָּם
  choice: 至于“海”
  rationale: “海”是这座大型铜制贮水器的专名式称呼。保留原文形象，并用引号及脚注避免读者误解为天然海洋。
- source_word: לַכֹּהֲנִים
  choice: 给祭司
  rationale: 简明表达供祭司使用的目的关系。
theological_decisions:
- issue: מַעֲשֵׂה הָעוֹלָה所指为何
  choice: 献燔祭所用的物件
  alternative: 燔祭的工作／与燔祭有关的东西
  rationale: 上下文谈洗涤礼仪器物或祭物相关材料，但原文没有逐项说明。正文作最低限度的语义补足，脚注则保留其字面表达和范围的不确定性。
- issue: 两个洗涤设施的用途区分
  choice: 盆用于冲洗燔祭相关物件，“海”供祭司洗濯
  alternative: 将两者都笼统译为一般清洗设施
  rationale: 原文明示用途上的对照，应予保留；但不进一步推断祭司具体洗身体的哪一部分，也不加入原文未明说的礼仪规定。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。“燔祭”沿用准确且通行的圣经祭祀术语；“洗涤／冲洗／洗濯”分别表达一般用途、清洗物件的动作和祭司使用该设施的用途。所有解释性信息均限于脚注或最低限度的语义补足，未把原文省略处作过度确定化处理。
