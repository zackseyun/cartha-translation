  text: the flowers[a], the lamps[b], and the tongs of gold—pure gold.
translation:
  language: zh_hans
  text: 还有花饰、灯盏和钳子，都是金制的——是精炼的金。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“金——它是完全的金”；这句话可能指充分炼净的金，也可能强调金器做工完备，原文含义不十分确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַפֶּרַח
  choice: 花饰
  rationale: פֶּרַח本义为“花、花朵”，在圣殿器具清单中较可能指灯台上的花形装饰；用“花饰”既保留形象，也符合器物语境。
- source_word: וְהַנֵּרוֹת
  choice: 灯盏
  rationale: נֵרוֹת指灯或灯火；此处列举灯台相关部件，“灯盏”比泛称“灯”更贴合器具语境。
- source_word: וְהַמֶּלְקַחַיִם
  choice: 火钳
  rationale: מֶלְקַחַיִם是夹取灯芯或炭火的钳具；“火钳”是现代汉语中自然且宽泛的器具名称，不把具体用途限定得过死。
- source_word: זָהָב
  choice: 金的
  rationale: 首次出现的זָהָב说明所列器具的材质；译作“都是金的”符合中文清单表达。
- source_word: הוּא מִכְלוֹת זָהָב
  choice: 是精炼的金
  rationale: 原文直译近于“它是金的完全/完成”，语义困难，可能描述金子经过充分炼净或制作完善。正文采用自然但不过度强化为最高级的“精炼的金”，并以脚注保留原文异常表达及其他可能。
