base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: zh_hans
  text: 两根柱子，以及柱顶上的两个圆球状构件[a]和两个柱头；又有两个网状饰件[b]，用来遮盖柱顶两个柱头上的两个圆球状构件；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圆球状构件”或译“钵状构件”；希伯来语所指的确切建筑形状不能确定。
    reason: lexical_alternative
  - marker: b
    text: “网状饰件”或译“格子状饰件”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  choice: 柱子
  rationale: 指圣殿前的两根独立柱子；“柱子”是现代汉语中自然、清楚的建筑用语。
- source_word: גֻּלּוֹת
  choice: 球状饰件
  rationale: 该词指柱头附近圆形或钵形的构件，具体形制不确定；“球状饰件”既表达其大致外形，也符合装饰性建筑语境。
- source_word: כֹּתָרוֹת
  choice: 柱头
  rationale: 在建筑语境中指柱子顶端的装饰构件；“柱头”是准确且通行的现代汉语术语。
- source_word: רֹאשׁ
  choice: 顶上／柱顶
  rationale: 本义为“头”，用于建筑时自然指柱子的顶部；按汉语句法分别译为“柱顶上的”和“柱顶”。
- source_word: שְּׂבָכוֹת
  choice: 网格
  rationale: 指网状、交织状的装饰构件；“网格”具体易懂，同时保留其形态意义。
- source_word: לְכַסּוֹת
  choice: 用来遮盖
  rationale: 不定式表示用途或目的；“用来遮盖”在现代汉语中自然地传达这一功能。
- source_word: אֲשֶׁר
  choice: 柱顶……的
  rationale: 希伯来语关系从句依自然汉语改作前置定语，同时保留其修饰关系。
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: 两／两个／两根／两片
  rationale: 保留原文逐项重复的数目，并按各名词选用自然量词。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文清单式结构和各项反复出现的“两”，并以分号划分主要构件。鉴于 גֻּלּוֹת 的形制存在真实不确定性，正文采用较中性的“球状饰件”，脚注列出“钵状饰件”。
