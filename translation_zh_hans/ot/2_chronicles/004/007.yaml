base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: zh_hans
  text: 他照规定的样式[a]造了十座金灯台，把它们安放在圣殿正殿[b]里：右边五座，左边五座。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“照它们的定例”或“照规定的规格”。原文用词可指规定、准则或既定式样。
    reason: lexical_alternative
  - marker: b
    text: 或译“圣所”或“圣殿主体建筑”。原文指圣殿建筑本身，尤其是正殿，而不是整个圣殿区域。
    reason: lexical_alternative
  - marker: c
    text: 原文作“右边五座，左边五座”；按圣殿的朝向，这可能分别对应南边和北边。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……造了
  rationale: עשה的Qal叙事形式表示“制作、造”；中文叙事中不必机械译出连接词。
- source_word: מְנֹרוֹת הַזָּהָב עֶשֶׂר
  choice: 十座金灯台
  rationale: מְנוֹרָה指承放灯盏的灯台，并非单指灯；量词“座”适合较大型的圣殿器物。
- source_word: כְּמִשְׁפָּטָם
  choice: 照规定的样式
  rationale: מִשְׁפָּט可指规定、定例或合宜的规范；在制造圣殿器具的语境中，兼有按既定规范或式样制作之意，脚注保留其他可能。
- source_word: וַיִּתֵּן
  choice: 把它们安放
  rationale: נתן本义范围包括放置；此处描述圣殿器具的位置，“安放”自然且庄重。
- source_word: בַּהֵיכָל
  choice: 在圣殿正殿里
  rationale: הֵיכָל在此指圣殿建筑的主体或正殿，而非整个圣殿区域；“圣殿正殿”较准确地表达其范围。
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: 右边五座，左边五座
  rationale: 忠实保留原文的左右方位，不直接解释成南北方向。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“金灯台”“圣殿正殿”“安放”符合圣殿器具语境；正文保留原文“右边、左边”的表达，并以脚注说明可能对应的方位。
