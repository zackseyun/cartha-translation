  text: And the weight of the nails was fifty shekels of gold[a], and he overlaid the upper rooms with gold.
translation:
  language: zh_hans
  text: 钉子的重量是五十舍客勒金子；他又用金子包覆上层房间[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上层屋子”；希伯来语也可能泛指圣殿上部的房间或建筑结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל לְמִסְמְרוֹת
  choice: 金钉重
  rationale: מִשְׁקָל表示“重量”，מִסְמְרוֹת表示“钉子”。结合后面的זָהָב，译作“金钉重”简洁自然，并表明所称量的是用于工程的金钉。
- source_word: לִשְׁקָלִים חֲמִשִּׁים זָהָב
  choice: 五十舍客勒
  rationale: 该短语给出黄金的重量数值。“舍客勒”保留古代重量单位；“金”已在“金钉”中表达，避免汉语重复。
- source_word: וְהָעֲלִיּוֹת
  choice: 楼房
  rationale: עֲלִיּוֹת指位于上层的房间、楼屋或上部建筑。“楼房”在此建筑语境中自然，但原词所指的具体圣殿结构并不完全确定，因此加注说明。
- source_word: חִפָּה זָהָב
  choice: 包上金子
  rationale: חפה在建筑语境中指用某种材料包覆或贴面。“包上金子”是现代汉语中清楚自然的表达，并与圣殿装饰的语境相符。
