base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: zh_hans
  text: 殿前的门廊长二十肘，与殿的宽度相同；高一百二十肘[a]。他用纯金贴饰门廊的里面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本记门廊高“一百二十肘”。《列王纪上》6:3的平行记载提到门廊的长度和宽度，却没有记载这一高度，因此有些解释者认为这里的文本可能存在问题；本译文依照现存的马所拉文本翻译。
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: 门廊
  rationale: 指主殿前的入口厅堂或廊式建筑；“门廊”是现代汉语中自然、清楚的建筑用语。
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: 殿前的
  rationale: 简洁表达位于主殿前方的空间关系，不额外推断其朝向。
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: 长二十肘，与殿的宽度相同
  rationale: 原文措辞紧凑，将门廊的长度与殿的宽度对应起来；此译法明确表达该关系，同时不添加具体方位。
- source_word: אַמּוֹת עֶשְׂרִים
  choice: 二十肘
  rationale: 保留古代长度单位“肘”，不作可能造成虚假精确性的现代单位换算。
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: 高一百二十肘
  rationale: 依照马所拉文本译出数值；“肘”虽未在这一分句中重复出现，但由前文度量语境自然补足。
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: 他又在门廊里面贴上
  rationale: צפה表示用材料包覆或贴面；“贴上”符合中文建筑语境。מִפְּנִימָה表明施工位置在里面，译文保留这一空间限定。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 直接、自然地表达原文所指材料。
