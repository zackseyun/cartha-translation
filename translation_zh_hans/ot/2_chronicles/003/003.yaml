base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: zh_hans
  text: 所罗门为建造上帝的殿所立的根基[a]如下：按旧有的尺度[b]，长度为六十肘，宽度为二十肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所立的根基”原文含义较难确定，也可理解为“所奠定的基础”或泛指所罗门建殿所采用的基本规格。
    reason: lexical_alternative
  - marker: b
    text: “按旧有的尺度”可能是指按较早使用的肘尺标准。
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  choice: 所立的根基
  rationale: 该词是יסד的被动形式，语境和句法较为困难；译作“所立的根基”既保留奠基、立定之意，也能自然引出后面的建筑尺寸，而不把含义限定为抽象的“规划”。
- source_word: לִבְנוֹת
  choice: 为建造
  rationale: 带ל的动词不定式表示目的，译作“为建造”自然且保留目的意义。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: “殿”在中文中自然指向圣殿建筑，同时保留בַּיִת在本语境中的建筑含义；“上帝的殿”比“上帝的家”更庄重准确。
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: 按旧有的尺度计算
  rationale: 该短语很可能指较早的度量标准，但确切历史所指不明；“旧有的尺度”保留这一开放性，不直接断定为某一种特定的肘制。
- source_word: אַמּוֹת
  choice: 肘
  rationale: 保留古代长度单位，不换算成现代单位，以忠实呈现原文的建筑尺寸。
- source_word: הָאֹרֶךְ ... וְרֹחַב
  choice: 长度……宽度
  rationale: 采用现代中文常用的建筑尺寸术语，清楚呈现平行结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“肘”这一古代单位，并用脚注说明难解的הוּסַד及“旧有的尺度”，避免把原文的词义和历史所指解释得过于确定。
