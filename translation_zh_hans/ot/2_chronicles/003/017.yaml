base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: zh_hans
  text: 他把两根柱子立在圣殿正殿[a]前，一根在右边，一根在左边；他给右边的柱子起名叫雅斤，给左边的柱子起名叫波阿斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正殿”或译“圣殿大厅”。希伯来文 הֵיכָל 在这里指圣殿建筑的主厅，不一定包括整个圣殿区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 立
  rationale: 此处是קום的使役形式，表示使柱子竖立、安置就位；“立”简洁自然，符合建筑语境。
- source_word: הָעַמּוּדִים
  choice: 两根柱子
  rationale: עַמּוּדִים指柱子；下文明确逐一提到右边和左边各一根，因此在汉语中补出“两根”，使指称自然清楚。
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: 在圣殿正殿前
  rationale: עַל־פְּנֵי表示“在……前”；הֵיכָל在此指圣殿建筑的主厅，而非整个圣殿范围。“圣殿正殿”兼顾具体空间含义与现代汉语可懂度。
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: 一根在右边，一根在左边
  rationale: 按原文保留相对方位，不将其解释为南北方向；量词“根”与柱子搭配自然。
- source_word: וַיִּקְרָא שֵׁם
  choice: 起名叫
  rationale: 这是希伯来语命名惯用语；“起名叫”在现代汉语中自然，并保留正式命名的动作。
- source_word: הַיְמִינִי
  choice: 右边的
  rationale: 准确对应“右侧的那一根”，并与前文方位表达保持一致。
- source_word: יָכִין
  choice: 雅斤
  rationale: 采用中文圣经传统中通行的人名音译，便于读者识别。
- source_word: הַשְּׂמָאלִי
  choice: 左边的
  rationale: 准确对应“左侧的那一根”，与“右边的”形成平行。
- source_word: בֹּעַז
  choice: 波阿斯
  rationale: 采用中文圣经传统中通行的专名音译。
