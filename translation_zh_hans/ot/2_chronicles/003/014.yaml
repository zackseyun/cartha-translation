  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: zh_hans
  text: 他用蓝色、紫色、朱红色线和细麻做成幔子[a]，又在上面做出基路伯的图案[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幔子”也可译作“帘子”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近于“使基路伯升到其上”，意思是用基路伯的图案装饰幔子；原文没有说明具体采用哪一种制作技法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: 幔子
  rationale: 该词指圣所内部起分隔作用的垂挂织物。“幔子”既自然易懂，也符合圣殿语境；“帘子”可作另一译法，列入脚注。
- source_word: תְּכֵלֶת
  choice: 蓝色线
  rationale: 该词指蓝色或蓝紫色的染色材料。中文在这一纺织材料清单中补出“线”，可自然表达颜色所指的染色纱线。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 通常指贵重的紫色染料或染色材料；与其余材料并列时译作“紫色线”简洁自然。
- source_word: כַרְמִיל
  choice: 朱红色线
  rationale: 该词表示红色染料或染色材料。“朱红色”保留鲜明的红色色调；“深红色”也是可能译法。
- source_word: בּוּץ
  choice: 细麻
  rationale: 该词不是泛指麻布，而是指质地精细的麻料；“细麻”保留其品质含义，也符合圣殿纺织品的语境。
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: 又在上面做出基路伯的图案
  rationale: 原文直译近于“使基路伯升到其上”，语境中是指用基路伯形象装饰幔子。“做出……图案”表达工艺结果，同时避免把具体技法限定为刺绣或编织。
- source_word: כְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经中通行的专名，保留圣殿图像的特定含义，不把它泛化为普通天使。
theological_decisions: []
