base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: zh_hans
  text: 他在内殿[a]做了链状装饰[b]，安在柱顶上；又做了一百个石榴，安在链子上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“内室”；传统译作“至圣所”。这里的希伯来词指圣殿最里面的部分，但本句也可能较宽泛地说明这些装饰的所在或关联。
    reason: alternative_reading
  - marker: b
    text: 或译“链子”“链饰”或“花环”。原词指链形的装饰构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: 链状装饰／链子
  rationale: 该词指链形的装饰构件。第一次译作“链状装饰”，自然交代其建筑装饰功能；末句用“链子”承接同一希伯来词，同时保留具体形象。
- source_word: בַּדְּבִיר
  choice: 在内殿
  rationale: דְּבִיר通常指圣殿内部最深处的内殿。“内殿”简洁、庄重，也避免在正文中直接采用解释性更强的礼仪名称。
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: 柱顶
  rationale: 希伯来语直译为“柱子的头”，在现代汉语建筑语境中自然译为“柱顶”。
- source_word: רִמּוֹנִים
  choice: 石榴
  rationale: 此处指石榴形的装饰物；按原文保留“石榴”，上下文足以显示其装饰性质。
- source_word: מֵאָה
  choice: 一百个
  rationale: 直接传达数目，并用量词“个”使现代汉语表达自然。
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: 安在链子上
  rationale: 介词ב在此最自然地表示附着或安置的位置；“安在”符合装设饰物的建筑语境。
theological_decisions:
- issue: דְּבִיר的名称
  choice: 内殿
  alternative: 至圣所／内室
  rationale: 原词指圣殿最里面的空间，但本节短语在装饰工程中的具体关联存在解释余地；正文采用较中性的建筑称谓，脚注保留传统及其他译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“安在”比口语化的“放在”更适合圣殿构件的安装场景；分号保留本节两个连续制作动作的层次。
