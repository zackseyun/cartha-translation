base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: zh_hans
  text: 这些基路伯的翅膀伸展，共二十肘；他们站立着，脸朝殿宇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“房屋”；这里指圣殿建筑。
    reason: 说明希伯来语 בַּיִת 的字面词义及其在本节建殿语境中的所指。
lexical_decisions:
- source_word: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה
  choice: 这些基路伯的翅膀
  rationale: 准确表达希伯来语的属格结构和指示语；“基路伯”是现代中文圣经语境中通行且庄重的名称。
- source_word: פֹּרְשִׂים
  choice: 伸展开来
  rationale: 该分词在这里描写翅膀展开的状态；此译法自然表达其延展状态，又不额外限定动作发生的时间。
- source_word: אַמּוֹת עֶשְׂרִים
  choice: 共二十肘
  rationale: 保留原文的长度单位“肘”；“共”清楚表明这里说的是翅膀展开后的总跨度，但不增添原文没有的具体尺寸术语。
- source_word: וְהֵם עֹמְדִים עַל רַגְלֵיהֶם
  choice: 他们直立在自己的脚上
  rationale: 原文以代词将描述对象由翅膀转回基路伯本身；“直立”自然表达“站在脚上”的姿态，同时保留“自己的脚上”这一具体意象。
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: 面朝殿宇
  rationale: לַבָּיִת 表示脸所朝向的方位；“殿宇”在建殿语境中自然指圣殿建筑，并以脚注说明原文采用普通名词“房屋”。
theological_decisions:
- issue: 建殿语境中 בַּיִת 的译法
  choice: 殿宇
  alternative: 房屋／圣殿
  rationale: 原词本义是“房屋”，在《历代志》的语境中常用来指圣殿建筑。“殿宇”既符合现代中文表达，也不把它扩展为整个圣殿体系；脚注保留原文字面信息。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语体。分号连接翅膀跨度与基路伯站姿这两项密切相关的描述；保留古代长度单位“肘”。脚注标记置于“殿宇”之后，与脚注实际解释的词语对应。
