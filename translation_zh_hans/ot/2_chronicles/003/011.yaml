base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: zh_hans
  text: 基路伯的翅膀总长二十肘：其中一只翅膀长五肘，伸到[a]殿宇[b]的墙；另一只翅膀也长五肘，伸到另一个基路伯的翅膀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸到”也可译作“碰到”。这里的希伯来语分词既可表示延伸至某处，也可强调实际接触。
    reason: lexical_alternative
  - marker: b
    text: 这里的“殿宇”指圣殿建筑。
    reason: cultural_note
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: 基路伯的翅膀
  rationale: 按复数结构译出；“基路伯”采用现代中文圣经传统中通行的音译，不另加解释性称谓。句首连接词在本节独立呈现时省略，使中文自然。
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: 总长二十肘
  rationale: 将字面的“它们的长度是二十肘”自然表达为“总长二十肘”；保留古代长度单位“肘”，不擅自换算。
- source_word: כְּנַף הָאֶחָד
  choice: 其中一只翅膀
  rationale: 希伯来语直译近于“那一只翅膀”；“其中一只”符合中文建筑尺寸说明的表达，也不额外指定它属于哪一个基路伯。
- source_word: לְאַמּוֹת חָמֵשׁ
  choice: 长五肘
  rationale: 原文是省略式的尺寸表达，中文补出“长”，清楚传达量度含义。
- source_word: מַגַּעַת / מַגִּיעַ
  choice: 伸到
  rationale: 两个分词均源于 נגע，可表示延伸至某处，也可强调实际接触；正文用自然且保留一定开放性的“伸到”，脚注说明“碰到”的可能。
- source_word: לְקִיר הַבַּיִת
  choice: 殿宇的墙
  rationale: בַּיִת 字面为“房屋”，但在此建筑语境中指圣殿建筑本体；“殿宇”既符合所指，也保留庄重语体。
- source_word: וְהַכָּנָף הָאַחֶרֶת
  choice: 另一只翅膀
  rationale: 准确保留 אַחֶרֶת 的“另一”之意，不改译成解释性更强的“第二只”。
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: 另一个基路伯的翅膀
  rationale: 保留原文单数“基路伯”和“另一个”的对应关系。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的建筑叙述语体。尺寸单位保留为“肘”；避免补入原文未明说的归属关系，并以脚注保存 נגע 在“伸到”与“碰到”之间的语义张力。
