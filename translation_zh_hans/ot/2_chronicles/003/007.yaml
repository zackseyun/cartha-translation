base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: zh_hans
  text: 他用金子包覆殿宇[a]——梁木[b]、门槛[c]、墙壁和门——又在墙上雕刻[d]基路伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文直译为“房屋”，在这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: “梁木”也可译作“椽木”。
    reason: lexical_alternative
  - marker: c
    text: “门槛”所译的希伯来语词也可指“门框”或“门柱”。
    reason: lexical_alternative
  - marker: d
    text: “雕刻”也可译作“镌刻”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  choice: 用金子包覆
  rationale: 该动词在建筑语境中表示在表面覆盖一层材料；“包覆”准确表达以金子覆盖殿宇构件的意思。
- source_word: הַבַּיִת
  choice: 殿宇
  rationale: 原文直译为“房屋”，但本段明确指圣殿建筑；“殿宇”既自然庄重，也保留建筑物本身的含义。
- source_word: הַקֹּרוֹת
  choice: 梁木
  rationale: 该复数名词指建筑中的结构木材；“梁木”较为宽泛，不把它过度限定为椽子。
- source_word: הַסִּפִּים
  choice: 门槛
  rationale: 该词可指门口的槛、框或相关构件；此处采用最可能的建筑含义“门槛”，并以脚注保留其他可能。
- source_word: קִירוֹתָיו
  choice: 墙壁
  rationale: 这是“墙”的复数形式，带第三人称阳性单数后缀，所指为殿宇的墙壁。
- source_word: דַלְתוֹתָיו
  choice: 门
  rationale: 该词可指门或门扇；“门”是现代汉语中最清楚自然的概括表达。
- source_word: זָהָב
  choice: 金子
  rationale: 原文在所列构件之后标明覆盖材料；汉语将其提前放在“包覆”之前，更自然地说明材料。
- source_word: וּפִתַּח
  choice: 又……雕刻
  rationale: 该动词表示刻出装饰性图案；“雕刻”自然且不预断具体采用浅刻、镌刻或其他工艺。
- source_word: כְּרוּבִים
  choice: 基路伯
  rationale: 采用汉语圣经传统中对圣殿相关天上活物的专门称谓，避免使用现代艺术语境中容易产生误解的“天使宝宝”等表达。
- source_word: עַל הַקִּירוֹת
  choice: 在墙上
  rationale: 介词最自然地表示雕刻图案所在的位置；“在墙上”简洁准确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿宇”适合圣殿建筑语境；破折号将梁木、门槛、墙壁和门标示为殿宇中被金子包覆的各部分，同时尽量保留希伯来语列举结构。
