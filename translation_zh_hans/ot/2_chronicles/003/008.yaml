base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: zh_hans
  text: 他建造至圣所[a]：长二十肘，与殿的宽度相当；宽二十肘。他又用上等金子包裹它，共用了六百他连得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“至圣之所”；原文采用重复“圣”的最高级表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: 至圣所
  rationale: 该构造短语直译近似“至圣之圣的殿室”，是希伯来语表达最高级的方式，指圣殿最里面的圣所。“至圣所”简洁自然，并保留其最高级含义。
- source_word: אָרְכּוֹ עַל פְּנֵי רֹחַב הַבַּיִת
  choice: 长二十肘，与殿的宽度相当
  rationale: עַל־פְּנֵי 在这里描述建筑空间上的对应关系；此句说明至圣所的长度与殿的宽度相合。将“二十肘”紧接“长”，可避免误解其所修饰的对象。
- source_word: אַמּוֹת עֶשְׂרִים
  choice: 二十肘
  rationale: 保留原文的古代线性单位“肘”，不作推测性的现代换算。
- source_word: וְרָחְבּוֹ אַמּוֹת עֶשְׂרִים
  choice: 宽二十肘
  rationale: 简明地再现原文的尺寸陈述，也与前面的“长二十肘”形成自然对应。
- source_word: וַיְחַפֵּהוּ
  choice: 将它包上
  rationale: חפה 在圣殿建筑语境中指用金属覆盖或包贴表面；“包上”在现代汉语中自然，也保留覆盖结构物的意思。
- source_word: זָהָב טוֹב
  choice: 上等金子
  rationale: טוֹב 在这里表示品质优良；“上等金子”比“好金子”自然，又不会像“纯金”那样加入原文未明确表达的纯度概念。
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: 共用了六百他连得
  rationale: 介词 לְ 在这里最可能引出金子的总量。“共用了”自然表达总重量，同时保留“他连得”这一原文重量单位。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。尺寸分句处理，使长度、与殿宽的对应关系以及自身宽度都清晰可辨；保留“肘”和“他连得”等古代度量单位。
