  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: zh_hans
  text: 所罗门在耶路撒冷的摩利亚山上开始建造雅威的殿。雅威曾在那里向他父亲大卫显现[a]；那地方是大卫预备的，就在耶布斯人奥珥南的禾场上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这山曾显给他父亲大卫看。”希伯来文没有明说“显现”的主语。
    reason: 保留אשר נראה在语法上的歧义：可理解为雅威在那里显现，也可理解为那山被显给大卫看。
  - marker: b
    text: 《历代志》称他为“奥珥南”；另见《撒母耳记下》24:16、18，那里称他为“亚劳拿”。
    reason: 说明同一人物在不同经卷中的希伯来名字形式有别。
lexical_decisions:
- source_word: וַיָּחֶל שְׁלֹמֹה לִבְנוֹת
  choice: 所罗门……开始建造
  rationale: ויחל与不定式לבנות表示叙事进程中的“开始建造”；汉语把主语提前并采用“开始建造”，自然且准确。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בית在此特指供敬拜的圣殿；译作“殿”符合现代汉语，同时保留它是雅威居所的基本意象。神名יהוה按专名译作“雅威”。
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: 在……摩利亚山上
  rationale: 该短语指名为“摩利亚”的特定山岭；“摩利亚山”是清楚自然的地名表达。
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: 雅威曾在那里向他父亲大卫显现
  rationale: נראה在神显语境中通常表示“显现”。希伯来文没有明说主语，但上下文最自然地以雅威为显现者；汉语需补出主语以免误解，同时用脚注保留另一种语法理解。
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: 那地方是大卫预备的
  rationale: 原文表达紧凑，按上下文是指大卫为建殿预备或确定了该地点。译文重组语序，使地点关系清楚，不额外说明预备的具体方式。
- source_word: בְּגֹרֶן אָרְנָן הַיְבוּסִי
  choice: 就在耶布斯人奥珥南的禾场上
  rationale: גרן指打谷用的场地，译作现代读者熟悉的“禾场”；专名依《历代志》的形式译为“奥珥南”，并在脚注说明《撒母耳记》的异名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”把它作为专名呈现，不以称号取代，也不引入特定宗派解释。
- issue: נִרְאָה的隐含主语
  choice: 明确译为“雅威……显现”
  alternative: “这山曾向大卫显现”或“这山曾显给大卫看”
  rationale: 动词为阳性单数尼法勒式，形式上可与“山”关联，但在大卫于奥珥南禾场经历神显的叙事背景下，以雅威为隐含主语更合语境；脚注保留形式上可能的另一理解。
- issue: 大卫“预备”地点的含义
  choice: 不具体说明大卫如何预备
  alternative: 大卫“指定”或“设立”这地方
  rationale: הכין可表示预备、使稳固或确定。主文采用较宽的“预备”，避免把其具体行动解释得过窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将原文较长的关系从句拆成两句，以免“显现”和“预备”的修饰对象含混；仍以“曾”“那地方”“就在”维持各分句的时序和地点联系。所有脚注标记均置于相关正文之后。
