  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: zh_hans
  text: 他以宝石覆饰殿宇[a]，使其华美；所用的金子是巴瓦音的金子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文直译为“房屋”，在《历代志》中常用来指圣殿。
    reason: lexical_alternative
  - marker: b
    text: “巴瓦音”所指不详；本短语也可译作“来自巴瓦音的金子”或“巴瓦音金”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: 用……装饰
  rationale: צפה通常有“包覆、贴覆”之意；但原文以“宝石”为材料，在此译作“用……装饰”较符合建筑语境，也避免现代汉语“镶满”所可能增添的程度含义。
- source_word: הַבַּיִת
  choice: 殿宇
  rationale: 原义为“房屋”，《历代志》中常用来指圣殿；“殿宇”既自然说明所指，又保留“建筑物”的表达色彩。
- source_word: אֶבֶן יְקָרָה
  choice: 宝石
  rationale: 单数名词在此可作集合意义，指用于装饰的贵重石材；“宝石”简洁自然。
- source_word: לְתִפְאָרֶת
  choice: 使其华美
  rationale: 介词短语表达目的或效果；“华美”兼顾美观、荣美和装饰效果，不额外强化为专门的神学术语。
- source_word: וְהַזָּהָב
  choice: 所用的金子
  rationale: 下半句转而说明金子的种类；补出“所用的”使现代汉语衔接自然，而不改变原意。
- source_word: זְהַב פַּרְוָיִם
  choice: 巴瓦音的金子
  rationale: 保留原文属格结构的开放性，不武断断定为产地；“巴瓦音”作为未能确定的专名音译。
