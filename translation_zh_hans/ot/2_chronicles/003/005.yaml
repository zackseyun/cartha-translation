  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: zh_hans
  text: 他用柏木[a]铺盖大殿，又用上好的金子覆盖它，并在上面饰以棕榈树和链子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏木”所对应的希伯来词所指树种尚有争议，也可译作“杜松木”或“冷杉木”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“棕榈树和链子”；这里很可能指棕榈树形和链形的装饰图案。
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: 大殿
  rationale: 直译为“大房屋”，但在圣殿建筑语境中指主要的殿堂；“大殿”既保留“大”的含义，也符合现代汉语建筑称谓。
- source_word: חִפָּה עֵץ בְּרוֹשִׁים
  choice: 用柏木铺盖
  rationale: חפה 表示覆盖、包覆；此处材料为木材，“铺盖”自然表达以木材覆盖殿内表面的施工过程，又不将范围限定为天花板。
- source_word: עֵץ בְּרוֹשִׁים
  choice: 柏木
  rationale: בְּרוֹשׁ 所指树种有争议，传统及常见译法为柏木；正文采用“柏木”，脚注保留杉木、冷杉木等可能。
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: 又用上好的金子贴在其上
  rationale: 再次出现的 חפה 指覆盖或包裹；“贴在其上”符合建筑表面覆金的语境。זָהָב טוֹב 直义为“好的金子”，“上好的金子”自然体现其优质，而不擅自等同于“纯金”。
- source_word: וַיַּעַל עָלָיו
  choice: 在上面装饰
  rationale: עלה 的使役式在此表示把装饰物安置、施加在表面；结合后接棕榈树和链子，“装饰”在汉语中清楚自然，同时不具体断定制作工艺。
- source_word: תִּמֹרִים
  choice: 棕榈树
  rationale: 原词可指棕榈树或棕榈树形象；正文保留直接称谓，脚注说明在本语境中可能是装饰图案。
- source_word: שַׁרְשְׁרוֹת
  choice: 链子
  rationale: 原词指链条或链状装饰；“链子”直接对应原文，脚注说明可能指链形纹饰。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大殿”适合圣殿建筑语境；“铺盖”与“贴在其上”保留两次 חפה 的覆盖含义及先木后金的施工层次。正文不把装饰明确说成雕刻、浮雕或镶嵌，以免超出原文。
