base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: zh_hans
  text: 他在殿前造了两根柱子，长三十五肘[a]；每根柱子顶上的柱头为五肘[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“长三十五肘”。《列王纪上》7:15说每根柱子高十八肘，因此有人认为这里的三十五肘是两根柱子的合计高度，也有人认为此处存在文本疑难。
    reason: cross_reference
  - marker: b
    text: 原文作“它顶上的”，使用单数后缀；这里很可能是分别指两根柱子各自的柱头。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: 在殿前
  rationale: לִפְנֵי表示“在……前面”；הַבַּיִת在建造圣殿的语境中指圣殿。译作“殿前”既自然，也准确传达所指。
- source_word: עַמּוּדִים שְׁנַיִם
  choice: 两根柱子
  rationale: עַמּוּדִים指建筑中的柱；量词“根”符合现代汉语习惯。
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: 高三十五肘
  rationale: 原文用אֹרֶךְ表达“长度”，但所量的是竖立的柱子，正文用“高”更符合现代汉语的建筑表达；脚注保留原文措辞及平行经文所造成的文本难点。
- source_word: הַצֶּפֶת
  choice: 柱头
  rationale: 该词在此指柱子顶端的建筑构件；“柱头”是准确且通俗的现代汉语建筑术语。
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: 每根柱子顶上的
  rationale: רֹאשׁוֹ字面为“它的头上／顶上”，采用单数后缀；上下文有两根柱子，正文以分配意义译作“每根柱子”，并在脚注说明原文形式。
- source_word: אַמּוֹת חָמֵשׁ
  choice: 高五肘
  rationale: 原文只给出“五肘”的尺寸，结合柱头的建筑语境补出“高”，使汉语表达完整自然，同时不改变数值。
