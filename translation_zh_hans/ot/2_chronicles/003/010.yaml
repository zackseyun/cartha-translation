  text: In the Most Holy Place he made two cherubim[a], the work of an image-maker[b], and overlaid them with gold.
translation:
  language: zh_hans
  text: 他在至圣所造了两个基路伯，作为雕塑作品，并用金子包裹它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: 在至圣所内
  rationale: 该短语直译为“在至圣之圣的殿中”，是表示最高级的希伯来语结构，指圣殿最里面的至圣所；译作“至圣所”符合现代中文圣经语境，也自然明了。
- source_word: כְּרוּבִים שְׁנַיִם
  choice: 两个基路伯
  rationale: “基路伯”是 כְּרוּבִים 在中文圣经传统中通行且庄重的译名；原文直接称其为两个基路伯，正文不额外添加“像”。
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: 是雕塑作品[a]
  rationale: מַעֲשֵׂה 表示作品或工艺，罕见词 צַעֲצֻעִים 在本处较可能描述雕塑、雕刻一类的工艺或成品，而非工匠本人。“雕塑作品”在中文中自然，并以脚注保留词义上的不确定性。
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: 他们又给这两个基路伯包上金子
  rationale: צפה 在此指以金属覆盖或贴覆物件，“包上金子”准确而通俗。希伯来文动词为复数，和前句单数“他造了”形成主语数的变化，因此译出“他们”，不将其悄然改成单数。
