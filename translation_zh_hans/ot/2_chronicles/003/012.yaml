  source_fidelity: 译文准确呈现了两翼各五肘、第一翼延至殿墙、另一翼与另一基路伯之翼接触的结构。惟“这一个基路伯”在现代汉语中略显指示性和累赘，改为“一个基路伯”即可保留原文的配对关系。
