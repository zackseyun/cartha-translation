  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: zh_hans
  text: 一个基路伯的一只翅膀长五肘，伸到殿的墙壁；另一只翅膀也长五肘，与另一个基路伯的翅膀相接。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְנַף
  choice: 翅膀
  rationale: 在圣殿内基路伯像的语境中，指具体的翅膀，而非“边缘”等引申义。
- source_word: כְּרוּב
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译；原文此处为单数，指其中一个基路伯。
- source_word: אַמּוֹת חָמֵשׁ
  choice: 五肘
  rationale: 保留原文的古代长度单位，以维持建筑尺寸的准确性和一致性。
- source_word: מַגִּיעַ
  choice: 伸到
  rationale: 自然表达翅膀延伸至墙面的状态，也保留原文分词所呈现的延展和到达之意。
- source_word: קִיר הַבָּיִת
  choice: 殿宇的墙
  rationale: בַּיִת字面为“房屋”，但本段明确指圣殿建筑；“殿宇”既符合语境，也保留建筑物本身的含义。
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: 另一只翅膀
  rationale: 准确表达阴性形容词“另一”对“翅膀”的修饰，中文自然清楚。
- source_word: דְּבֵקָה
  choice: 相接
  rationale: 该词表示紧密接触；“相接”适合此处两翼彼此接触的建筑描述，又不额外断言两翼被固定连接。
- source_word: הַכְּרוּב הָאַחֵר
  choice: 另一个基路伯
  rationale: 保留原文“另一个”的对应关系，清楚指出成对的另一尊基路伯像。
