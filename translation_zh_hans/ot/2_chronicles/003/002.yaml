  yaml_path: translation/ot/2_chronicles/003/002.yaml
  text: He began to build in the second month[a], on the second day, in the fourth year of his reign.
translation:
  language: zh_hans
  text: 他作王第四年二月初二[a]，开始建造。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“二月，在第二”；其中重复的“第二”通常理解为“初二（第二日）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: 开始
  rationale: 使役词干在此表示着手进行某事；汉语用“开始”自然、准确。叙事连接词 וַ־ 不必机械译出。
- source_word: לִבְנוֹת
  choice: 建造
  rationale: בנה 的不定式，指建筑工程；“建造”既贴近原文，也符合庄重叙事语体。
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: 二月
  rationale: 表示工程开始的月份。按汉语日期习惯译作“二月”。
- source_word: בַּשֵּׁנִי
  choice: 初二
  rationale: 原文仅重复序数词“第二”，属于省略表达，通常理解为该月第二日；译作“初二”符合现代汉语日期表达，同时以脚注保留原文的省略和可能的歧义。
- source_word: בִּשְׁנַת אַרְבַּע
  choice: 第四年
  rationale: 这是君王在位纪年的常用格式，译作“第四年”清楚直接。
- source_word: לְמַלְכוּתוֹ
  choice: 他作王
  rationale: 指以他的王权统治为纪年基准；“他作王第四年”是自然、简明的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的纪年表达，并按汉语习惯将“作王第四年”置于月日前。主语保留为“他”，不把上下文中的所罗门姓名补入本节。
