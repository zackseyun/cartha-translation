id: 2CH.23.6
reference: 2 Chronicles 23:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: zh_hans
  text: 除了祭司和供职的利未人以外，任何人都不可进入雅威的殿[a]。他们可以进去，因为他们是圣洁的。全体百姓都要谨守雅威所交付的职责[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”直译为“家”或“房屋”，即“雅威的家”。
    reason: lexical_alternative
  - marker: b
    text: “谨守雅威所交付的职责”也可译为“为雅威守卫”或“遵守雅威所规定的职守”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: 任何人都不可进入
  rationale: אַל与短式祈愿语气动词连用，表达禁止；此译法在现代汉语中自然，并保留明确的禁令语气。
- source_word: בֵית יְהוָה
  choice: 雅威的殿
  rationale: 该短语直译为“雅威的家（房屋）”，在此具体指圣殿；正文用“殿”更符合现代汉语宗教语境，脚注保留字面表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: כִּי אִם
  choice: 除了……以外
  rationale: 该组合在否定句后引出例外，汉语用“除了……以外”清楚自然。
- source_word: הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: 祭司和供职的利未人
  rationale: מְשָׁרְתִים表示执行礼仪职事的人；“供职的利未人”既保留其职事含义，也避免把它泛化为普通服务。
- source_word: הֵמָּה יָבֹאוּ
  choice: 他们可以进去
  rationale: 承接前面的例外条款，表达获准进入，而不只是陈述将来的行动。
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: 因为他们是圣洁的
  rationale: 保留קֹדֶשׁ的“圣”这一核心概念；上下文所指主要是礼仪上的神圣身份和分别归属。
- source_word: וְכָל הָעָם
  choice: 全体百姓
  rationale: 表达הָעָם作为整体会众的集合意义，并与获准入殿的祭司和利未人形成对照。
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: 要谨守雅威所交付的职责
  rationale: שׁמר与מִשְׁמֶרֶת构成同根结构，可指守卫、值守或履行规定的职责；正文采用较宽的“谨守……职责”，同时用脚注保留其他可能含义。
theological_decisions:
- issue: 祭司和利未人的礼仪性圣洁
  choice: 译作“圣洁的”，按语境理解为具有分别归属、可进入圣所的神圣身份
  alternative: “分别为圣的”或“已分别出来的”
  rationale: 原文以קֹדֶשׁ说明其入殿资格。保留“圣洁”这一圣经核心用语，同时不把它解释成道德上毫无罪过。
- issue: 神名的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名יהוה；采用“雅威”保留专名性质，避免以称号代替，也不在正文中引入关于其发音的额外论断。
- issue: 百姓所守的מִשְׁמֶרֶת性质
  choice: 雅威所交付的职责
  alternative: 为雅威守卫；遵守雅威的规定
  rationale: 该词在此可涵盖受命的职守、值守或应遵行的秩序。正文不把意义缩窄为纯军事守卫，脚注则明确保留语义幅度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“供职”保留圣殿职事色彩；“全体百姓”清楚表达集体范围。脚注标记已放在各自所解释的词语之后，并纠正了咨询层中脚注标记与内容错位的问题。
