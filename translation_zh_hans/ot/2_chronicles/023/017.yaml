base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: zh_hans
  text: 于是众民都到巴力庙去，把庙拆毁，又砸碎巴力的祭坛和神像，并在祭坛前杀了巴力的祭司玛坦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: 巴力庙
  rationale: 这里指供奉巴力的宗教建筑；译作“巴力庙”自然简洁，也符合现代汉语习惯。
- source_word: וַיִּתְּצֻהוּ
  choice: 把庙拆毁
  rationale: 该动词表示拆除、毁坏；补出“庙”以明确代词所指。
- source_word: מִזְבְּחֹתָיו
  choice: 巴力的祭坛
  rationale: 原文为“他的祭坛”；在中文中明确所有者为巴力，可避免把代词误解为庙宇或祭司。
- source_word: צְלָמָיו
  choice: 神像
  rationale: צֶלֶם指雕刻或塑造的宗教形像；“神像”比泛指的“像”更清楚地传达此处语境。
- source_word: שִׁבֵּרוּ
  choice: 砸碎
  rationale: 强化词形表达彻底打碎；“砸碎”准确而具象。
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: 在祭坛前
  rationale: 按原文保留空间表达，不额外推断其仪式意义。
theological_decisions:
- issue: 祭坛和神像所属者的指代
  choice: 译为“巴力的祭坛和神像”
  alternative: 译为“他的祭坛和神像”
  rationale: 希伯来语阳性单数后缀在上下文中指巴力；中文直说“巴力的”可消除不必要的代词歧义，并未增添教义解释。
- issue: 毁坏行为的描述
  choice: 分别译作“拆毁”庙和“砸碎”祭坛、神像
  alternative: 统一译作“毁坏”
  rationale: 原文使用两个不同动词，分别描述拆除建筑与打碎物件，宜保留动作差异。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“于是”承接前文叙事；句式紧凑，保留原文连续动作的推进感。
