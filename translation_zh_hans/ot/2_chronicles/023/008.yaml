base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: zh_hans
  text: 利未人和犹大众人都照祭司耶何耶大所吩咐的一切行。各人都带着自己的人，即安息日来值班的和安息日离班的，因为祭司耶何耶大没有让各班[a]退下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各班”也可译作“各班次”或“各轮值队伍”，指按安排轮流供职的祭司和利未人群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 去做
  rationale: 在“照……所吩咐的一切”这一结构中，自然表达完全遵行命令，同时保留 עשה 的常用义。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 这是该族群及圣职群体的标准现代汉语译名。
- source_word: וְכָל יְהוּדָה
  choice: 和犹大众人
  rationale: יהודה 在此集合性地指犹大群体；“犹大众人”比生硬的“全犹大”更符合现代汉语，又不把范围具体限定为某一阶层。
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: 照……所吩咐的一切
  rationale: 表达 כְּכֹל אֲשֶׁר 所强调的全面遵行，并保持庄重、自然。
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: 祭司耶何耶大
  rationale: 采用通行圣经人名“耶何耶大”，并按自然汉语语序将职衔置于姓名之前。
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: 各人都带着自己的人
  rationale: אִישׁ 作分配用法，译为“各人”；אֲנָשָׁיו 保留较宽泛的“自己的人”，避免过度解释为军队。
- source_word: בָּאֵי הַשַּׁבָּת
  choice: 安息日进班的人
  rationale: 该短语在轮值语境中指安息日到来接班的人；“进班”简明呈现进入当值状态。
- source_word: עִם יוֹצְאֵי הַשַּׁבָּת
  choice: 和安息日出班的人
  rationale: 与“进班”形成对应，指安息日本应结束轮值的人，保留进出动作的平行。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出两批人员同时在场的原因。
- source_word: לֹא פָטַר
  choice: 没有让……退下
  rationale: פטר 在此意为不准已完成轮值者离开；“让……退下”符合人员奉命留守的场景。
- source_word: הַמַּחְלְקוֹת
  choice: 各班
  rationale: 指按次序编组、轮流服役的祭司和利未人群体；“各班”在现代汉语中清楚自然，并保留复数和组织单位之意。
