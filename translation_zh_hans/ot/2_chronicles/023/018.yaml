  to: 耶何耶大将耶和华殿的职务交在祭司、利未人[a]手中；大卫曾把他们分派在耶和华的殿中，使他们照摩西律法上所写的，向耶和华献上燔祭，并欢喜地歌唱，遵照大卫的安排[b]。
