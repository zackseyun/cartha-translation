source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: zh_hans
  text: 耶何耶大将耶和华殿的职务交在祭司、利未人[a]手中；大卫曾把他们分派在耶和华的殿中，使他们照摩西律法上所写的，向耶和华献上燔祭，并欢喜地歌唱，遵照大卫的安排[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语可理解为“利未祭司”，也可理解为“祭司和利未人”；该表达的关系不止一种可能。
    reason: alternative_reading
  - marker: b
    text: 希伯来语直译为“借大卫之手”；在这里可理解为遵照大卫的安排或规定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: 把……职务交在……手中
  rationale: שׂים与פְּקֻדּוֹת在圣殿行政语境中表示设立并托付职责；“职务”比抽象的“监督权”更自然，“交在……手中”也保留希伯来语意象。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: 在此处明确指圣殿；中文“殿”既自然庄重，也比直译“家”准确。
- source_word: בְּיַד
  choice: 交在……手中
  rationale: 保留“在手中”的源语意象，同时清楚表达托付管理职责之意。
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: 祭司，就是利未人
  rationale: 按希伯来语无连词的同位结构直译，但以脚注保留也可能指“利未祭司”或“祭司和利未人”的歧义。
- source_word: אֲשֶׁר חָלַק דָּוִיד
  choice: 这些人是大卫……分派的
  rationale: חלק本义为分开、分配；此处指大卫将圣职人员编班分派。
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: 献上燔祭
  rationale: 采用现代中文圣经语域中清楚且通行的祭祀术语。
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: 照摩西律法上所写的
  rationale: 自然呈现书面律法规范的依据，并保留原文公式性表达。
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: 欢喜歌唱
  rationale: 以自然汉语表达两个并列名词所描写的敬拜方式，意义未减。
- source_word: עַל יְדֵי דָוִיד
  choice: 照大卫所安排的
  rationale: 该习语字面为“借大卫之手”，在本段礼仪行政语境中可指大卫的安排或规定；正文采用最合语境的表达，并在脚注保留字面和代理义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神名音译，明确呈现专名而非以“主”这一称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均为四字神名的汉语表达；“耶和华”在现代中文圣经传统中辨识度最高，并保留其专名性质。
- issue: הַכֹּהֲנִים הַלְוִיִּם 的关系
  choice: 祭司，就是利未人
  alternative: 利未祭司；祭司和利未人
  rationale: 原文没有连接词，结构可作同位或涉及两个群体；正文贴近其表面句法，脚注明示其他合理理解，不替原文消除制度上的歧义。
- issue: עַל יְדֵי דָוִיד 的指向
  choice: 照大卫所安排的
  alternative: 借大卫之手
  rationale: 上下文很可能指大卫对圣殿音乐礼仪的安排，但原习语也可表达代理或媒介；脚注保留这一张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。句式略作汉语化处理，以避免机械欧化，同时保留“交在……手中”等关键希伯来语意象；祭司与利未人的关系及“大卫之手”的含义以脚注保存原文歧义。
