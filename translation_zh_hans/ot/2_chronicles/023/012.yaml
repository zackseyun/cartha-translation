  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: zh_hans
  text: 亚她利雅听见百姓奔跑、赞颂王的声音，就来到耶和华殿，到百姓那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲתַלְיָהוּ
  choice: 亚她利雅
  rationale: 采用该人物在现代中文圣经中的通行译名。
- source_word: קוֹל
  choice: 声音
  rationale: 此处泛指奔跑和颂赞所发出的声响；译作“声音”自然，也不把语义过度限定为嘈杂声。
- source_word: הָרָצִים
  choice: 奔跑
  rationale: 保留分词的动作意义，并与后面的“颂赞”并列。
- source_word: מְהַלְלִים
  choice: 颂赞
  rationale: 准确表达 הלל 的赞美、称颂之意；在王权场景中仍保留原文的宗教性措辞。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: 按专名יהוה的中文传统译法处理，并用简洁自然的“耶和华殿”表达。
