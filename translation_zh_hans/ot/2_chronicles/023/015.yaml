  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: zh_hans
  text: 于是他们抓住她[a]；她来到王宫的马门入口处[b]，他们就在那里将她处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“把手放在她身上。”
    reason: lexical_alternative
  - marker: b
    text: “王宫”直译为“王的房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: 众人抓住她
  rationale: 原文直译为“把手放在她身上”，在拘捕并处死的语境中表示抓住或拿住她；现代汉语用“抓住她”自然明确，同时以脚注保留字面表达。
- source_word: מְבוֹא
  choice: 入口处
  rationale: 该词指进入之处或入口；“入口处”符合现代汉语地点表达。
- source_word: שַׁעַר הַסּוּסִים
  choice: 马门
  rationale: 此处很可能是专名，译作“马门”简洁，并符合中文地名惯例。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 原文为“王的房屋”，在此地点语境中自然指王宫；“王宫”是准确、通顺的现代汉语表达。
- source_word: וַיְמִיתוּהָ
  choice: 将她处死
  rationale: מות的使役式意为使其死亡、将其处死；此处是奉命执行杀戮，“处死”准确而庄重，又不过度强调现代司法程序。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达原文的地点副词，并清楚回指马门入口处。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“抓住”传达拘押语境；“将她处死”保持史书叙述的正式感。主文保留原文动作顺序，不把“她走到”改写为被动押送，以免加入原文未明说的细节。
