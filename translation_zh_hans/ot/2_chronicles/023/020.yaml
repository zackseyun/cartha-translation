  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: zh_hans
  text: 耶何耶大带领百夫长、权贵、百姓的首领和全国民众，把王从雅威的殿领下来。他们经由上门进入王宫，让王坐在王国的宝座上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 带领
  rationale: 此处不是单纯“拿取”，而是耶何耶大带着所列各群体行动；“带领”自然表达语境中的召集、引领之意。
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: 百夫长
  rationale: 指挥百人的军职名称；“百夫长”简洁自然，且在本段历代志的军事语境中不会必然使人误解为罗马军职。
- source_word: הָאַדִּירִים
  choice: 权贵
  rationale: 该词指有权势、有地位的人；“权贵”兼顾其显要身份和势力，适合宫廷政治场景。
- source_word: הַמּוֹשְׁלִים בָּעָם
  choice: 百姓的首领
  rationale: 表达这些人在百姓中行使治理权；“首领”符合现代汉语叙事语体。
- source_word: כָּל עַם הָאָרֶץ
  choice: 全国民众
  rationale: 这里是王权叙事中作为社会政治群体的“地上之民”；按语境译为“全国民众”，比逐字的“全地之民”更清楚。
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: 把王接下来
  rationale: 使役形表示使王下去；“接下来”既保留从圣殿往下行的方向，也符合护送幼王的情境，避免“带下来”可能带有拘押意味。
- source_word: מִבֵּית יְהוָה
  choice: 从雅威的殿
  rationale: בֵּית在此指圣殿；译为“殿”简洁明确。神名יְהוָה音译为“雅威”，保留专名性质。
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: 从上门进入
  rationale: 介词短语在移动语境中表示经过该门；“上门”保留门名的字面形式，不武断判定为“上层的门”或其他特定方位。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋”，在此显然指君王的宫殿；“王宫”是准确自然的现代汉语。
- source_word: וַיּוֹשִׁיבוּ
  choice: 让王坐在
  rationale: 使役形字面为“使他坐下”；此译保留动作本身及登基意味，不过度增译为“拥立”。
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: 国位
  rationale: 此短语字面是“王国的宝座”；“国位”在庄重汉语中自然表达统治者的王座及王权位置。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名。音译“雅威”保留其作为神圣专名的性质，不以称号替代，也不采用较晚形成的混合读音。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保持希伯来文连续动作的节奏，但按汉语习惯分为两句；不增添原文未明说的登基仪式细节。
