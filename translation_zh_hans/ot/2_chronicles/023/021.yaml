  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: zh_hans
  text: 全地的民众都欢喜，城里也安静了。他们用刀处死了亚她利雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: 欢喜
  rationale: שׂמח表示欢喜、喜乐；这里描写民众公开庆贺，用“欢喜”自然且庄重。
- source_word: כָל עַם הָאָרֶץ
  choice: 全国民众
  rationale: 该词组指当地全体民众；“全国民众”以现代汉语传达其整体性，同时避免生硬直译为“地上的百姓”。
- source_word: וְהָעִיר שָׁקָטָה
  choice: 城里也安静了
  rationale: שׁקט表示动乱止息后的安静、平静；原文只说“城”，不在正文中补明为耶路撒冷。
- source_word: וְאֶת־עֲתַלְיָהוּ הֵמִיתוּ
  choice: 他们用刀处死了亚她利雅
  rationale: הֵמִיתוּ是מות的使役式，表示“使之死”，在此为正式执行死刑；“处死”比泛称“杀死”更符合叙事语境。开头的וְ按并列承接处理，不额外译成因果关系。
- source_word: בֶחָרֶב
  choice: 用刀
  rationale: 介词ב表示工具，חֶרֶב指刀剑类兵器；“用刀”是简洁自然的现代汉语表达。
theological_decisions: []
