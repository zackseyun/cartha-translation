  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: zh_hans
  text: 耶何耶大部署众人，各人手拿兵器，从殿的南侧直到北侧，在祭坛和殿旁，围绕着王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: 叫……站在
  rationale: 使役语义为“使站立、部署”；结合守卫场景，以自然汉语表达其安排众人站位之意。
- source_word: וְאִישׁ שִׁלְחוֹ בְיָדוֹ
  choice: 各拿兵器
  rationale: שֶׁלַח在此指武器；“各……在手”自然译为“各拿兵器”，不限定具体兵器种类。
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית עַד כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: 在殿的南侧到北侧
  rationale: 字面为殿的“右侧”至“左侧”；按古代面向东方的方位习惯，分别指南、北，采用语境中的实际方位以便现代读者理解。
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: 从祭坛直到圣殿
  rationale: 介词ל可表达在旁、朝向或范围关系；此处描述部署区域，译作范围表达，同时保留祭坛与殿两个地标。
- source_word: עַל־הַמֶּלֶךְ סָבִיב
  choice: 四面护卫王
  rationale: 字面为“围绕着王”；结合武装部署的目的，用“护卫”明确场景中自然蕴含的保护功能。
