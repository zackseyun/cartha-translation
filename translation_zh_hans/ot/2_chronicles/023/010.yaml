revisions:
- from: 耶何耶大叫众人各拿兵器，站在殿的南侧到北侧，从祭坛直到圣殿，四面护卫王。
  to: 耶何耶大部署众人，各人手拿兵器，从殿的南侧直到北侧，在祭坛和殿旁，围绕着王。
  rationale: 修订恢复祭坛与殿作为并列部署地点，而非错误的第二个起讫范围；同时以“围绕着王”贴近原文，保留其空间性的表述。南、北方位沿用本项目英语审校记录所采用的古代朝向理解。
