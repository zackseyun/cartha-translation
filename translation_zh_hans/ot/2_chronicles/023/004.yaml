base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/004.yaml
  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: zh_hans
  text: “你们要这样做：在安息日来值班的祭司和利未人中，要有三分之一看守各门槛[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要作各门槛的守门人。”希伯来语把“守门人”和“门槛”连用，着重说明他们负责把守入口。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: 你们要这样做
  rationale: 以现代汉语自然表达希伯来语的指示性引言，同时保留命令语气。
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: 你们中……三分之一
  rationale: 明确表达部分关系，即从受命者中划出三分之一。
- source_word: בָּאֵי הַשַּׁבָּת
  choice: 在安息日来值班的
  rationale: 字面为“在安息日进来的”；结合轮班语境，“来值班”自然传达这些人在安息日进入岗位，而不将具体交接制度说得过细。
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: 祭司和利未人
  rationale: 按原文保留两个群体，并让该短语自然修饰安息日来值班的人。
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: 要在各门槛处守门
  rationale: שֹׁעֲרִים指守门人，סִפִּים指门槛或门口；译文以动词结构清楚表达守卫入口的职责，同时保留“门槛”这一具体意象。
