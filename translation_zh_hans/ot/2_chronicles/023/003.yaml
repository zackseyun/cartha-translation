base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: zh_hans
  text: 全会众在上帝的殿里与王立约。耶何耶大对他们说：“看哪，王的儿子必作王，正如耶和华论到大卫子孙所说的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל הַקָּהָל
  choice: 全会众
  rationale: קהל 指聚集的群体或会众；“全会众”既贴近原文，也符合本段正式、公共的场景。
- source_word: בְּרִית
  choice: 立约
  rationale: כרת ברית 是希伯来语固定表达，直义为“切约”，现代中文圣经语体自然译为“立约”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意并带庄重宣告色彩的语气，比单纯省略更能反映原文。
- source_word: בֶן הַמֶּלֶךְ
  choice: 王的儿子
  rationale: 按原文保留明确的身份表达，不扩写为专名或“王子”。
- source_word: יִמְלֹךְ
  choice: 必作王
  rationale: 表达未完成式在此宣告语境中的将来和确定意味；“作王”自然体现统治及登位。
- source_word: עַל בְּנֵי דָוִיד
  choice: 论到大卫子孙
  rationale: עַל 在“说”之后可表示谈论对象；בני דוד 可指大卫的后裔，译作“大卫子孙”保留王朝延续的集体含义。
theological_decisions:
- issue: “与王立约”中“王”的身份
  choice: 保留“与王”，不在正文补明为约阿施
  alternative: 译为“与约阿施王立约”或加脚注解释
  rationale: 原文仅写“王”；保留称谓可维持叙事所赋予王子的合法王权身份，不作释义性增补。
- issue: וַיֹּאמֶר 的主语
  choice: 明确为“耶何耶大”
  alternative: 直译为“他对他们说”
  rationale: 希伯来文用代词性动词承接上文，最近且合乎情境的发言者是祭司耶何耶大；中文若写“他”容易误指紧邻的“王”，因此以语境中明确的专名消除非原意的歧义。
- issue: 神名 יהוה
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文读者广泛熟悉的传统专名形式，体现原文专有神名，而不改作一般称号。
- issue: 大卫之约的表述范围
  choice: “正如耶和华论到大卫子孙所说的”
  alternative: 扩译为“照耶和华应许大卫家必永远作王的话”
  rationale: 原文没有在本节复述应许的具体内容；保持简洁，以免把跨经文的神学解释直接写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“全会众”“立约”“作王”等词兼具可读性与经文语域；用“耶何耶大”明确原文在中文中可能含混的发言者。
