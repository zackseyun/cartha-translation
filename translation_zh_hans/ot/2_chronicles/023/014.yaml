  text: וַ/יּוֹצֵא֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י הַ/מֵּא֣וֹת פְּקוּדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ הֽוֹצִיא֨וּ/הָ֙ אֶל מִ/בֵּ֣ית הַ/שְּׂדֵר֔וֹת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ יוּמַ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן לֹ֥א תְמִית֖וּ/הָ בֵּ֥ית יְהוָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: zh_hans
  text: 祭司耶何耶大把军队中受委任的百人队长领出来，对他们说：“把她从队列之间带出去[a]；凡跟随她的，都要用刀处死。”因为祭司先前吩咐过：“不可在雅威的殿里处死她。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一短语较难确定；也可理解为“把她带到队列外面”。这里可能是指把亚她利雅从排列成行的卫兵之间，或经由队列之外，押离圣殿。
    reason: 保留罕见短语 אֶל מִבֵּית הַשְּׂדֵרוֹת 在词义及空间关系上的不确定性，同时使正文的方向表达自然一致。
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: 领出
  rationale: 这是 יצא 的使役式，表示使人出去或将人带出；“领出”既保留使役动作，也符合耶何耶大召出军官下令的场景。
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: 百人队长
  rationale: 这是按百人编制的军事职衔；“百人队长”贴近希伯来语结构，又避免“百夫长”可能带来的罗马军制联想。
- source_word: פְּקוּדֵי הַחַיִל
  choice: 受命统领军队的
  rationale: פקד 的被动分词在此指这些人被委派承担军队职务；译文明确其受命任职的身份，同时不把具体职权说得过细。
- source_word: הוֹצִיאוּהָ
  choice: 把她带出去
  rationale: 复数命令式带第三人称阴性单数后缀，所指是亚她利雅；译法保留使役意义，并符合当时把她押离圣殿的语境。
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: 带到列队之间
  rationale: 原文措辞罕见且结构困难；שדרות 在此军事场景中很可能指排列成行的队伍。“列队之间”表达较可能的场景，同时以脚注保留另一种理解。
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: 凡跟随她的
  rationale: 分词 הבא 配合 אחריה 可指任何跟在她后面或追随她的人；中文保留了动作与效忠对象之间可能存在的双重意味。
- source_word: יוּמַת בֶּחָרֶב
  choice: 都要用刀处死
  rationale: 被动式在命令语境中具有处决令的效力；“处死”保留正式、司法性的语气。
- source_word: כִּי אָמַר הַכֹּהֵן
  choice: 因为祭司先前吩咐过
  rationale: 此句说明前述安排的原因；“先前”使叙事时序在现代汉语中清楚，“吩咐过”也符合此前所下禁令的语境。
- source_word: לֹא תְמִיתוּהָ
  choice: 不可……处死她
  rationale: מות 的使役式意为使其死亡、处死；采用正式命令语气。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 在本处指献给雅威的圣殿；“殿”比字面的“房屋”更自然准确，并保留神名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其专名性质，而不改为称号，也不采用较晚形成的混合读音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“百人队长”体现古代军事编制而不引入罗马色彩；“用刀处死”保持命令的正式性。脚注标记紧随其实际解释的疑难短语。
