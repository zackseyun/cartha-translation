  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: zh_hans
  text: 他派守门人驻守在雅威殿的各门口，不许任何在任何方面不洁的人进入。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“任何在任何事上不洁的人不可进入。”这里的“任何事”可指使人不洁的任何缘由、事项或类别；原文措辞宽泛。
    reason: 保留 לְכָל־דָבָר 的字面关联及其关于不洁缘由或类别的语义幅度。
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: 派……驻守
  rationale: 这是 עמד 的使役形，表示使守门人站在指定岗位；“派……驻守”自然地传达安排人员把守之意。
- source_word: הַשֹּׁועֲרִים
  choice: 守门人
  rationale: 该词特指负责看守入口或城门、殿门的人；“守门人”在圣殿语境中准确而自然。
- source_word: עַל שַׁעֲרֵי
  choice: 在……各门
  rationale: 介词 עַל 在此表示人员被安置于各门口；“在……各门”符合现代汉语表达，并以“各”体现复数。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בַּיִת 与神名连用，字面为“雅威的殿（家）”；在圣殿语境中译作“雅威殿”简洁自然，同时保留神名。
- source_word: וְלֹא יָבוֹא
  choice: 不让……进去
  rationale: 连词加否定未完成式在此表达设立守门人的目的或结果，即阻止不洁者进入。
- source_word: טָמֵא
  choice: 不洁的人
  rationale: 在圣殿准入的语境中，טָמֵא 指礼仪上的不洁；“不洁”是准确且通行的宗教用语。
- source_word: לְכָל דָּבָר
  choice: 在任何事上
  rationale: 原文短语宽泛而略带歧义，可指因任何事项、缘由或方面而成为不洁；正文采用较贴近形式的表达，并用脚注说明其含义范围。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近多数现代学者对该神名读音的重构，也避免以称号替代专名。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“驻守”和“不让……进去”使人员部署及其目的表达清楚；对 לְכָל דָּבָר 不作过度限定，以脚注保留原文的概括性与歧义。
