  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עוֹמֵ֨ד עַֽל עַמּוּד֜/וֹ בַּ/מָּב֗וֹא וְ/הַ/שָּׂרִ֣ים וְ/הַ/חֲצֹצְרוֹת֮ עַל הַ/מֶּלֶךְ֒ וְ/כָל עַ֨ם הָ/אָ֜רֶץ שָׂמֵ֗חַ וְ/תוֹקֵ֨עַ֙ בַּ/חֲצֹ֣צְר֔וֹת וְ/הַ/מְשֽׁוֹרֲרִים֙ בִּ/כְלֵ֣י הַ/שִּׁ֔יר וּ/מוֹדִיעִ֖ים לְ/הַלֵּ֑ל וַ/תִּקְרַ֤ע עֲתַלְיָ֨הוּ֙ אֶת בְּגָדֶ֔י/הָ וַ/תֹּ֖אמֶר קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: zh_hans
  text: 她一看，只见王正站在入口处的柱旁，众首领和号筒[a]都在王旁边；全国的百姓都在欢庆，吹响号筒；歌唱者用乐器引导颂赞[b]。亚她利雅就撕裂衣服，喊道：“谋反了！谋反了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“众首领和号筒都在王旁边”。“号筒”也可能是以乐器代指吹号的人。
    reason: lexical_alternative
  - marker: b
    text: “引导颂赞”也可译为“指挥颂赞”或“发出颂赞的信号”；这里的希伯来语表达在音乐礼仪语境中的确切含义并不完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: 她一看，只见
  rationale: 用现代汉语自然呈现连续的视觉动作和 הִנֵּה 引人注意、突然发现的叙事效果，既不生硬直译为“看哪”，也不削弱现场感。
- source_word: הַמֶּלֶךְ עוֹמֵד
  choice: 王站在
  rationale: 分词描绘当时正在持续的姿态；汉语“站在”在场景描写中已自然表达这一状态。
- source_word: עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: 在入口处自己的柱旁
  rationale: 将 עַל 按礼仪场景理解为靠近、位于柱旁，而非站在柱子上；“自己的”保留三单阳性后缀所表示的归属或特定关联。
- source_word: הַשָּׂרִים וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: 众首领和号筒都在王旁边
  rationale: 保留马所拉文本所写的“号筒”而不直接改作“吹号的人”；“首领”可涵盖官长和军政领袖，比单指军官更宽。
- source_word: כָל עַם הָאָרֶץ
  choice: 全国民众
  rationale: 该短语在此指国中聚集庆贺的百姓；此译比逐字的“地上所有人民”自然，也避免误解为全世界的人。
- source_word: שָׂמֵחַ וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: 欢喜快乐，吹响号筒
  rationale: 体现公开庆典中持续欢庆和吹奏号筒的动作。
- source_word: הַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: 歌唱的人用乐器
  rationale: מְשׁוֹרֲרִים 特指歌唱者；כְלֵי הַשִּׁיר 指用于歌乐的器具，以自然汉语译作“乐器”。
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: 领着众人颂赞
  rationale: 该使役形式在音乐礼仪语境中可能表示引导、指挥或发出颂赞的信号；正文采用可理解的功能性表达，并以脚注保留其他可能。
- source_word: קֶשֶׁר קָשֶׁר
  choice: 谋反了！谋反了！
  rationale: קֶשֶׁר 在政治场景中指合谋叛乱；重复保留亚她利雅惊惧而急促的喊叫。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“她一看，只见”传达原文突现的视觉场景；庆典部分保持节奏感。保留“号筒”这一原文换喻，并用脚注说明；不以正文消除“领着颂赞”一语的语义弹性。
