base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: zh_hans
  text: 祭司耶何耶大把矛、盾牌和大盾牌[a]交给百人队的长官们；这些武器原属于大卫王，存放在上帝的殿中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大盾牌”所译的希伯来词与前面的“盾牌”不同，可能指另一种较大的盾。
    reason: lexical_alternative
  - marker: b
    text: “上帝的殿”直译为“上帝的家”，这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 交给
  rationale: 这里的נתן表示把物品转交给人；“交给”比单说“给”更自然，也符合分发武器的叙事语境。
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: 祭司耶何耶大
  rationale: 按现代汉语习惯将职衔置于姓名之前；专名采用通行的圣经音译。
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: 给百人队的长官们
  rationale: 直译其“百人单位之首领”的军事含义，同时避免“百夫长”可能带来的特定罗马军制联想。
- source_word: הַחֲנִיתִים
  choice: 矛
  rationale: חנית是常见的长柄刺击兵器；“矛”在现代汉语中简洁清楚。
- source_word: הַמָּגִנּוֹת
  choice: 盾牌
  rationale: מגן是一般性的盾牌用语；译作“盾牌”自然明确。
- source_word: הַשְּׁלָטִים
  choice: 大盾牌
  rationale: 该词在此与מגנות并列，较可能指另一类、通常较大的盾；译文保留两种防御器具之间的区别，同时以脚注说明词义问题。
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: 原属于大卫王
  rationale: 希伯来文关系从句表达归属；“原属于”自然体现这些器物从大卫时代保存至当时，但不额外断定其具体来源。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: 字面是“上帝的家/房屋”，在本处明确指圣殿；“上帝的殿”既保留“殿宇”意象，也符合现代汉语表达。
theological_decisions: []
