  text: וּ/בַ/שָּׁנָ֨ה הַ/שְּׁבִעִ֜ית הִתְחַזַּ֣ק יְהוֹיָדָ֗ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת לַ/עֲזַרְיָ֣הוּ בֶן יְרֹחָ֡ם וּ/לְ/יִשְׁמָעֵ֣אל בֶּן יְ֠הוֹחָנָן וְ/לַֽ/עֲזַרְיָ֨הוּ בֶן עוֹבֵ֜ד וְ/אֶת מַעֲשֵׂיָ֧הוּ בֶן עֲדָיָ֛הוּ וְ/אֶת אֱלִישָׁפָ֥ט בֶּן זִכְרִ֖י עִמּ֥/וֹ בַ/בְּרִֽית־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: zh_hans
  text: 第七年，耶何耶大刚强起来，便与百夫长——耶罗罕的儿子亚撒利雅、约哈难的儿子以实玛利、俄备得的儿子亚撒利雅、亚大雅的儿子玛西雅和细基利的儿子以利沙法——立约[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他们带入与他所立的约中”。希伯来文以“取”这些军官、又说“与他在约中”，表达耶何耶大使他们参与同他所立的盟约。
    reason: 保留 וַיִּקַּח 与 עִמּוֹ בַבְּרִית 的组合所含“带入/纳入盟约”的表达方式，同时主文采用自然汉语。
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: 第七年
  rationale: 这是标明行动时间的介词短语；句首连接词在现代汉语中不必机械译出。
- source_word: הִתְחַזַּק
  choice: 刚强起来
  rationale: 保留 התפעל 词形所表达的自我振作、变得刚强之意，同时符合自然的现代汉语表达。
- source_word: וַיִּקַּח
  choice: 带来
  rationale: 基本含义是“取、带”；此处指耶何耶大把这些军官带到自己一方，以便与他们立约。“带来”既保留具体动作，也避免过度解释为“招募”。
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: 百夫长
  rationale: 指统领百人单位的军官；“百夫长”是简洁、通行的汉语称谓，在此语境中并非特指罗马军职。
- source_word: עִמּוֹ בַבְּרִית
  choice: 与他立约
  rationale: 该短语表明这些军官被带入一个与耶何耶大共同订立的盟约。“与他立约”在汉语中清楚自然；原文结构上的特殊性另以脚注说明。
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: 亚撒利雅……以实玛利……亚撒利雅……玛西雅……以利沙法
  rationale: 按通行圣经人名音译；原文中两个不同的人都名叫亚撒利雅，照原样保留。
- source_word: בֶן
  choice: ……的儿子
  rationale: 按希伯来文父名式身份说明直译，并采用自然的汉语领属结构。
