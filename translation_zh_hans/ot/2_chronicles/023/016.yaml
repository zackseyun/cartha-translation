  text: וַ/יִּכְרֹ֤ת יְהוֹיָדָע֙ בְּרִ֔ית בֵּינ֕/וֹ וּ/בֵ֥ין כָּל הָ/עָ֖ם וּ/בֵ֣ין הַ/מֶּ֑לֶךְ לִ/הְי֥וֹת לְ/עָ֖ם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: zh_hans
  text: 耶何耶大便与全体百姓和王立约，要作雅威的子民。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: 就……立约
  rationale: כרת ברית字面为“切约”，是希伯来语固定习语；现代汉语以“立约”自然、准确地表达其含义。“就”承接叙事中的连续式。
- source_word: בֵּינוֹ וּבֵין כָּל־הָעָם וּבֵין הַמֶּלֶךְ
  choice: 在自己、全体百姓和王之间
  rationale: 保留原文列出的三方：耶何耶大本人、全体百姓和王；不把雅威增补为直接缔约的一方。
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: 要作雅威的子民
  rationale: 以简洁自然的汉语表达不定式所指的立约目的或结果，并保留“百姓归属于雅威”的盟约含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文所写的神圣名字采用现代汉语音译，而不以称号“主”替代。
theological_decisions:
- issue: 雅威是否是本句直接列明的缔约方
  choice: 缔约各方按原文列为耶何耶大、全体百姓和王；雅威是他们立约归属的对象
  alternative: 把本句理解为雅威与百姓及王立约
  rationale: 原文在三个בין结构中明确列出“他、全体百姓、王”，随后以目的短语说明他们要作雅威的子民；此处没有把雅威列入בין所引出的各方。
- issue: 目的短语的主语范围
  choice: 不在译文中另加明确代词，以“要作”保留原文的简略表达
  alternative: 明确译作“使他们作”或“让众人作”
  rationale: לִהְיוֹת没有明说主语；中文省略主语既自然，也避免过度限定究竟是全体缔约者还是以百姓为中心。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“立约”“子民”是普通读者可理解且适合宗教历史叙事的用语；句法尽量贴近原文，同时避免生硬直译“切约”。
