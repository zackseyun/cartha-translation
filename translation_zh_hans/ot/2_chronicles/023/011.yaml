base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: zh_hans
  text: 他们把王的儿子带出来，把冠冕和见证[a]放在他身上，立他作王。耶何耶大和他的儿子们膏立他，并说：“愿王万岁！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见证”也可译为“律法”或“盟约文书”，可能指与君王统治职责有关的成文盟约凭据。
    reason: 说明 הָעֵדוּת 在此处可能特指律法或盟约文书，同时保留原文用词的宽度。
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: 带出来
  rationale: 该使役形式表示使人出来；“带出来”自然地表现众人将王子领到公开加冕场合。
- source_word: בֶּן־הַמֶּלֶךְ
  choice: 王的儿子
  rationale: 忠实保留其王室血统和继承身份，不在本节补出人名。
- source_word: הַנֵּזֶר
  choice: 冠冕
  rationale: 此词在加冕语境中指具有分别、王权意义的王冠；“冠冕”庄重且为现代读者熟悉。
- source_word: הָעֵדוּת
  choice: 见证
  rationale: 保留该词“见证、证言”的基本意义及其盟约意味，不在正文中径直限定为律法书或约书。
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: 立他作王
  rationale: 准确表达使他登基为王，与前面加上冠冕的动作保持区别。
- source_word: וַיִּמְשָׁחֻהוּ
  choice: 膏立他
  rationale: “膏立”既保留用油膏抹的仪式含义，也自然传达君王受立的语境。
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: 耶何耶大和他的众子
  rationale: 按希伯来语明示的复数主语翻译，并将其自然地与膏立及随后高呼的动作相连。
- source_word: יְחִי הַמֶּלֶךְ
  choice: 愿王万岁！
  rationale: 以现代汉语熟悉的拥立欢呼表达希伯来语祈愿式，同时用“愿”保留其愿望语气。
theological_decisions:
- issue: 加冕礼中 הָעֵדוּת 的所指
  choice: 正文译作“见证”
  alternative: 律法；约书；见证文书
  rationale: 该词可能指与君王职责相关的成文律法或盟约文书，但原词本身是“见证”。正文保留较宽的表达，脚注说明主要解释，避免把未明说的具体文献类型定死。
- issue: 膏立动作的施行者
  choice: 将“耶何耶大和他的众子”理解为“膏立他”的明示主语，并延续到高呼
  alternative: 把膏立者理解为前文未具名的众人，仅将耶何耶大和众子视为高呼者
  rationale: 希伯来语在“膏立他”之后紧接复数名词主语“耶何耶大和他的众子”，其后又用复数动词“他们说”；最自然的句法是该名词组同时支配这两个动作。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“立他作王”“膏立”“愿王万岁”符合公开加冕场景。正文保留原文连续动作，但以句号划分，避免汉语长句拖沓；脚注标记紧随其实际解释的“见证”。
