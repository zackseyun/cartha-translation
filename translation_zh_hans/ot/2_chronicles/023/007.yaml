  text: וְ/הִקִּיפוּ֩ הַ/לְוִיִּ֨ם אֶת הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/בַּ֖יִת יוּמָ֑ת וִֽ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/בֹא֥/וֹ וּ/בְ/צֵאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: zh_hans
  text: 利未人要四面围住王，各人手持兵器；凡进入那房屋[a]的，必被处死。王进出时，你们要在他身边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”直译如此；《历代志》中这个词常指圣殿。
    reason: 说明原文הַבַּיִת的字面意义及其在本书中的常见语境所指，同时不在正文中预先限定其含义。
lexical_decisions:
- source_word: וְהִקִּיפוּ הַלְוִיִּם אֶת־הַמֶּלֶךְ סָבִיב
  choice: 利未人要四面围住王
  rationale: 使役词形在祭司耶何耶大的指令中带命令意味；“要”表达指令语气，“四面围住”自然地传达 סָבִיב 所强调的全面环绕。
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: 各人手持兵器
  rationale: אִישׁ 在这里是逐一分配用法；כֵלָיו 结合武装护卫的语境指兵器。“手持”简洁保留“在他手中”的具体意象。
- source_word: וְהַבָּא אֶל־הַבַּיִת
  choice: 凡进入殿里的
  rationale: 带冠词的分词表示泛指，译作“凡……的”保留普遍性和法令语气。הַבַּיִת 字面为“房屋”，在本段语境中是圣殿，正文用自然的“殿”，并以脚注说明字面形式。
- source_word: יוּמָת
  choice: 必被处死
  rationale: Hophal 被动词形表示使其死亡；“被处死”保留被动和执行刑罚的意味，“必”传达命令条款的确定语气。
- source_word: וִהְיוּ אֶת־הַמֶּלֶךְ
  choice: 你们都要在他身边
  rationale: היה 加 אֶת 在此表示陪伴、随侍；补出复数主语“你们”，并用“在他身边”自然表达护卫性的伴随，同时不增添原文没有的具体动作。
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: 王出入时
  rationale: 保留希伯来文“进来、出去”的成对表达，以简洁自然的汉语“出入时”呈现王行动的全过程。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的指令语体。“四面围住”“各人手持兵器”“必被处死”保留原文的军事护卫和法令力度；末句用“在他身边”表达陪伴护卫，不把原文进一步具体化为“跟随”或“保护”。
