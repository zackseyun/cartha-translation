  text: וַ/יָּסֹ֨בּוּ֙ בִּֽ/יהוּדָ֔ה וַ/יִּקְבְּצ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה וְ/רָאשֵׁ֥י הָ/אָב֖וֹת לְ/יִשְׂרָאֵ֑ל וַ/יָּבֹ֖אוּ אֶל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: zh_hans
  text: 他们走遍犹大，从犹大各城召集利未人和以色列各父家[a]的首领；他们来到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “父家”指以共同祖先为纽带的宗族或家族单位，也可译作“宗族”或“家族”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: 走遍
  rationale: סבב在这里指在一个地区内四处行走、执行任务；“走遍犹大”自然地表达了巡行全境的意思。
- source_word: וַיִּקְבְּצוּ
  choice: 召集
  rationale: קבץ意为聚集；本段是有组织地把利未人和首领招聚起来，因此“召集”比单纯的“聚集”更符合叙事语境。
- source_word: אֶת־הַלְוִיִּם
  choice: 利未人
  rationale: 采用这一族群兼宗教职分名称的标准中文译法。
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: 从犹大各城
  rationale: 准确表达这些利未人来自犹大全境各城；“各城”自然简洁，并不把כָּל的整体范围削弱为少数城邑。
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: 和……各父家的首领
  rationale: 该历代志常用语指父系宗族或家族单位的首领。“父家”保留原文的亲属组织结构，脚注说明较通俗的译法。
- source_word: לְיִשְׂרָאֵל
  choice: 以色列各父家
  rationale: 这里的לְ表示归属或关联，用“以色列各父家”表达这些首领属于以色列，不改写为“犹大”。
- source_word: וַיָּבֹאוּ אֶל־יְרוּשָׁלִָם
  choice: 他们来到耶路撒冷
  rationale: בוא与אֶל连用通常表示来到某地；“来到耶路撒冷”忠实而自然。
theological_decisions:
- issue: 在以犹大为中心的语境中“以色列”的范围
  choice: 正文保留“以色列”
  alternative: 犹大；以色列民
  rationale: 希伯来文明确使用יִשְׂרָאֵל。历代志在南国背景下仍可用“以色列”指更广的圣约群体；保留原称谓，避免替作者限定其范围。
- issue: 亲属组织用语הָאָבוֹת的表达
  choice: 正文译作“父家”，脚注解释
  alternative: 宗族；家族
  rationale: “父家”保留原文父系家族单位的文化和行政色彩，同时借脚注帮助现代读者理解。
- issue: 末句复数主语的指代范围
  choice: 保留“他们”，不明确限定为先前出行者或全体被召集者
  alternative: 众人；这些首领和利未人
  rationale: 希伯来文只使用第三人称复数动词，可能自然涵盖前述群体，但没有显式重列主语；“他们”保留这种指代上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“走遍”“召集”“来到”流畅自然；保留“父家”和“以色列”等具有原文结构及神学语汇色彩的表达，并用脚注解释较陌生的亲属组织术语。
