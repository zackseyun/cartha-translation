  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: zh_hans
  text: 三分之一在王宫，三分之一在根基门[a]；全体百姓在雅威殿的各院内。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “根基门”也可直译为“根基的门”；这可能是一处特定门的名称，确切所指不详。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: 三分之一
  rationale: 带定冠词的阴性序数词在这里作名词使用，表示人员分组中的三分之一；中文用“三分之一”自然、准确。
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: 守在王宫
  rationale: בֵּית הַמֶּלֶךְ直译为“王的房屋”，此处指王的住所或宫殿建筑群；结合上文的守卫部署，以“守在王宫”表达地点和承接而来的动作。
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: 守在根基门[a]
  rationale: שַׁעַר意为“门”，יְסוֹד通常意为“根基、基础”；此处很可能是特定门名，因此译作“根基门”，并以脚注保留其名称性质及确切所指的不确定性。
- source_word: וְכָל הָעָם
  choice: 所有民众
  rationale: עָם是“人民、民众”的常用词；“所有民众”符合叙事语境，也避免将其限定为军队或特定会众。
- source_word: בְּחַצְרוֹת
  choice: 在……院内
  rationale: חָצֵר的复数指围合的院落；在圣殿语境中，中文以集合性的“院内”表达多个院区，简洁自然。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: 该短语字面为“雅威的殿宇/房屋”，所指是圣殿建筑群；“雅威殿”既明确所指，也保留神名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的发音重构，并明确将其作为专名呈现。
- issue: 补出原文省略而由上文承接的动作
  choice: 两处补作“守在”，末句补作“都要在”
  alternative: 逐字保留无动词结构：“三分之一在……三分之一在……所有民众在……”
  rationale: 本节各地点短语承接上文的人员部署命令。中文补出“守在/都要在”使句意完整，但不额外规定具体守卫方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“王宫”比“王的房屋”更符合现代汉语；分号标明守卫分组与全体民众所在区域之间的结构关系。脚注标记[a]已置于相关词语之后。
