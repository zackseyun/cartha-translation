  text: He built cities in the hill country of Judah[b][a], and in the forests he built fortresses and towers.
translation:
  language: zh_hans
  text: 他在犹大山区建造城邑，在林地[a]建造堡垒[b]和塔楼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “林地”或译“森林”或“丛林”。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”或译“要塞”或“卫城”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרִים
  choice: 城邑
  rationale: 指有人居住的城镇；“城邑”既符合古代历史语境，又避免让现代读者只联想到大型城市。
- source_word: בָּנָה
  choice: 建造
  rationale: 直接表达修建之意，并保留原文两次使用该动词的简洁叙事结构。
- source_word: בְּהַר יְהוּדָה
  choice: 在犹大山区
  rationale: 此处 הַר 指犹大的山地地带，而非某一座山；“山区”是自然、准确的现代汉语地理表达。
- source_word: חֳרָשִׁים
  choice: 林地
  rationale: 该词可指森林、树木繁茂之地或丛林；“林地”能较宽泛地保留其地貌含义。
- source_word: בִּירָנִיּוֹת
  choice: 堡垒
  rationale: 指设防的坚固建筑；“堡垒”自然地体现军事防御用途，又不引入“城堡”的时代联想。
- source_word: מִגְדָּלִים
  choice: 高楼
  rationale: מִגְדָּלִים 通常指高耸的塔楼；“高楼”在此保留古代防御性高耸建筑的含义，且与“堡垒”搭配自然。
