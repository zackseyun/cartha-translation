  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: zh_hans
  text: 约坦登基时二十五岁，在耶路撒冷作王十六年。他母亲名叫耶路沙，是撒督的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: 二十五岁
  rationale: 这是希伯来语表示年龄的惯用格式，按现代汉语自然表达为“二十五岁”。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: ב 加相关动词形式在此标示即位的时间；“登基时”简洁、自然，并符合君王纪年语境。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词表示施行王权、统治；“作王”既保留原文含义，也符合中文圣经历史叙事的庄重语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 ב 在此作地点用法，直译为“在耶路撒冷”。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 以自然现代汉语呈现原文的母系身份说明格式。
- source_word: יְרוּשָׁה
  choice: 耶路沙
  rationale: 按常见中文圣经人名音译惯例处理该专名。
- source_word: בַּת צָדוֹק
  choice: 是撒督的女儿
  rationale: 准确表达希伯来语“某人的女儿”这一亲属关系结构。
