id: 2CH.27.2
reference: 2 Chronicles 27:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为正的事，效法他父亲乌西雅所行的一切；只是他没有进入耶和华的殿[a]。但百姓仍然行败坏的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进入耶和华的殿”也可译作“到耶和华的殿里去”。这句话很可能是将约坦与乌西雅作对比；乌西雅曾擅自进入圣殿烧香（参代下26:16–21）。
    reason: 说明原文动词的译法，并交代上下文中可能的对比，但不把推论写入正文。
  - marker: b
    text: “行败坏的事”也可译作“败坏自己”或“仍旧行为败坏”。
    reason: 原文分词可表达持续败坏的行为，也可能带有使役或反身意味。
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: 他做……看为正的事
  rationale: 定冠词修饰的形容词 הַיָּשָׁר 在这里作名词用，指“正的事”；保留希伯来叙事中的道德评价，并采用自然的现代汉语表达。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留“在……眼中”这一希伯来评价性意象，同时用“看为”使汉语句式顺畅。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中广为人知的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: 一切都照他父亲乌西雅所做的
  rationale: כְּכֹל אֲשֶׁר 表达全面依循先前榜样；“一切都照……”既保留其完整性，也符合现代汉语。
- source_word: רַק
  choice: 只是
  rationale: 此词限制前面的全面比较，指出约坦与乌西雅之间的例外；“只是”简洁自然。
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: 他没有进入耶和华的殿
  rationale: בוא 与 אֶל 连用在此表示进入；הֵיכָל 在上下文中指圣殿。译文不额外加入“不合法”等解释。
- source_word: וְעוֹד
  choice: 但……仍然
  rationale: 同时表达不良状况的延续及其与君王行为之间的对比。
- source_word: מַשְׁחִיתִים
  choice: 行败坏的事
  rationale: שׁחת 的使役分词可指败坏、作恶或造成毁坏；此处不明确宾语，译作“行败坏的事”保留道德与宗教层面的宽泛含义及持续状态。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者广泛熟悉的专名“耶和华”，保留其为专名而非称号的性质；“雅威”是较接近学术重构发音的另一译法。
- issue: 约坦没有进入圣殿这一句与乌西雅事件的关系
  choice: 正文仅译“只是他没有进入耶和华的殿”
  alternative: 明确译成“他没有像乌西雅那样擅自进入圣殿”
  rationale: 上下文很可能指向乌西雅擅入圣所的事件（代下26:16–21），但本节原文没有“擅自”或“像乌西雅那样”等词，因此把关联放在脚注中，不在正文中补足。
- issue: מַשְׁחִיתִים 的语态和含义
  choice: 行败坏的事
  alternative: 败坏自己／继续败坏
  rationale: 使役词形可能带有“使败坏”的色彩，但经文未说明受事者；采用较宽泛的行为描述，避免断定百姓是在败坏自己还是别人。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华眼中看为正”适度保留原文意象；“一切都照……；只是……”清楚呈现全面比较及其例外。两个脚注标记均已置于正文对应位置。
