  text: וְ/יֶתֶר֙ דִּבְרֵ֣י יוֹתָ֔ם וְ/כָל מִלְחֲמֹתָ֖י/ו וּ/דְרָכָ֑י/ו הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: zh_hans
  text: 约坦其余的事迹[a]，以及他一切的战争和他的行事为人[b]，看哪，都记在《以色列和犹大诸王记》上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事迹”也可译作“有关约坦的事”；希伯来语原意为“约坦其余的话／事情”，在这里是记述君王事迹或事务的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “行事为人”也可译作“他的道路”或“他的行为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: 约坦其余的事迹
  rationale: דִּבְרֵי 在王室史料总结公式中不是单指“言语”，而是指君王的事迹或相关事务；“其余的事迹”既符合上下文，也自然庄重。句首 וְ 不机械译作“现在”，其承接作用由汉语语序自然表达。
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: 以及他一切的战争
  rationale: מִלְחָמָה 的复数直接指战争或战事；“战争”比“战役”或“军事行动”更少解释性。
- source_word: וּדְרָכָיו
  choice: 和他的行事为人
  rationale: דֶּרֶךְ 本义为“道路”，用于人时可指行径、品行或生活方式。“行事为人”在现代汉语中自然表达其行为和生活方式，同时保留一定语义宽度。
- source_word: הִנָּם
  choice: 看哪，都
  rationale: הִנָּם 带有指示和强调作用；“看哪”保留原文突出的语气，“都”与复数所指事项相应。
- source_word: כְּתוּבִים עַל סֵפֶר
  choice: 记在……记上
  rationale: 原文为“写在书卷上”；汉语史料引用公式用“记在……上”更自然，同时忠实表达书面记录。
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: 《以色列和犹大诸王记》
  rationale: 该短语指一部已知史料的名称，采用书名号；“以色列和犹大诸王记”准确反映其结构，不把它等同于现存正典中的《列王纪》。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”略带传统书面色彩，但用于保留原文 הִנָּם 的强调和指示语气。所有脚注标记均置于对应词语之后。
