  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: zh_hans
  text: 他与亚扪人的王交战，战胜了他们。那一年，亚扪人给他一百他连得银子、一万柯珥小麦和一万柯珥大麦[a]。第二年和第三年，亚扪人也照数交给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“大麦”前没有重复“柯珥”，但可由上文补出。
    reason: 说明原文省略“柯珥”的结构，以及译文补足该计量单位的依据。
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: 与……交战
  rationale: 该结构表示同对方作战；“与……交战”自然、庄重，并由下句明确双方的敌对关系及战果。
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: 亚扪人的王
  rationale: בְּנֵי עַמּוֹן是指亚扪民族的惯用称呼；此译法准确而符合现代汉语。
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: 胜了他们
  rationale: חזק与עַל用于军事语境时表示占上风、制伏或获胜；此处简洁表达战争结果。
- source_word: וַיִּתְּנוּ לוֹ
  choice: 给他
  rationale: 保留נתן“给”的基本词义；贡赋性质可从所列财物及后文连续交纳看出。
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: 一百他连得银子
  rationale: כִּכָּר是古代重量单位，采用中文圣经读者较熟悉的音译“他连得”，避免用不确定的现代重量折算。
- source_word: עֲשֶׂרֶת אֲלָפִים כֹּרִים חִטִּים
  choice: 一万柯珥小麦
  rationale: כֹּר是古代干量单位，以“柯珥”音译，既保留具体单位，也不作有争议的现代容量换算。
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: 一万柯珥大麦
  rationale: 原文在“大麦”后省略量词，但从并列结构可自然补出כֹּרִים；正文补明单位以免现代读者误解为一万粒或一万份。
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: 也照数交给他
  rationale: הֵשִׁיבוּ字面可指“归还、再交”，在贡赋语境中表示随后年份再次缴纳同样数额；“照数交给”清楚传达指代和重复。
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: 第二年和第三年
  rationale: 指首次缴纳之后连续两年重复交纳；结合“也”自然表达延续关系。
