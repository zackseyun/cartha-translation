  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: zh_hans
  text: 他建造了雅威殿的上门，又在俄斐勒的城墙上大兴土木。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又在俄斐勒的城墙上建造甚多”或“又在俄斐勒的城墙上大规模建造”。原文没有说明所建的具体项目。
    reason: לָרֹב 表示建造甚多或规模很大；希伯来原文未明示建造的具体对象。
lexical_decisions:
- source_word: בָּנָה
  choice: 建造
  rationale: 这是该动词在建筑语境中的通常含义；上下文没有明确要求译成更具体的“重建”或“修建”。”
- source_word: שַׁעַר
  choice: 门
  rationale: 此词指城门或圣殿建筑群的门；“门”在现代汉语中自然简明。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: 希伯来语直译为“雅威的殿（家）”；在此建筑语境中，“雅威殿”既清楚指圣殿，又保持原文以神名限定该殿的结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的音译，而不以“主”这一称号替代，保留原文中的专有名字。
- source_word: הָעֶלְיוֹן
  choice: 上
  rationale: 该形容词修饰“门”，表示其位置；“上门”简洁对应“上面的门、上层的门”。
- source_word: וּבְחוֹמַת
  choice: 又在……的城墙上
  rationale: 介词 ב 在建筑语境中表示工程施作的所在；“在城墙上”符合现代汉语表达。
- source_word: הָעֹפֶל
  choice: 俄斐勒
  rationale: 这是耶路撒冷一处高地或设防区域的专名，采用音译，避免把专名的可能含义直接解释进正文。
- source_word: לָרֹב
  choice: 大兴建造
  rationale: 该短语表示建造工程数量多、规模大；“大兴建造”在现代汉语中自然地传达“建造甚多”，同时不具体化工程项目。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以称号替代，也不把较晚形成的混合读音放入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威殿”明确指圣殿；“大兴建造”传达工程规模，又保留原文未说明具体建造项目的含混性。脚注标记置于其所解释的 לָרֹב 对应短语之后。
