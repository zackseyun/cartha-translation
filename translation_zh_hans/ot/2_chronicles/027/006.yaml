  text: וַ/יִּתְחַזֵּ֖ק יוֹתָ֑ם כִּ֚י הֵכִ֣ין דְּרָכָ֔י/ו לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/006.yaml
  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: zh_hans
  text: 约坦日渐强盛，因为他在耶和华他的上帝面前行事坚定。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: 日渐强盛
  rationale: 该词表示变得强大、强盛；结合未完成式叙事形式，译为“日渐强盛”自然表达其逐步强盛的结果。
- source_word: הֵכִין דְּרָכָיו
  choice: 谨慎行事
  rationale: 字面为“使自己的道路坚定/端正”。“谨慎行事”在现代汉语中自然传达他使自己的生活道路稳定、端正之意，同时避免误解为安排出行路线。
- source_word: לִפְנֵי יְהוָה אֱלֹהָיו
  choice: 在耶和华他的上帝面前
  rationale: 保留“在……面前”的关系性和神学性表达，并按本项目惯例将神名译作“耶和华”。
theological_decisions:
- issue: 约坦强盛与其行为之间的因果关系
  choice: 保留“因为”所表达的明确因果关系
  alternative: 弱化为“同时”或“这时”
  rationale: 原文 כִּי 明确引出原因；译文不回避经文将他的强盛与他在上帝面前端正行事相联系的陈述。
- issue: הֵכִין דְּרָכָיו 所强调的是内在定意还是外在行为
  choice: 用“谨慎行事”兼顾生活方向与实际行为
  alternative: “立定心志”或“安排自己的道路”
  rationale: 原文说的是“他的道路”，范围宽于单纯内心意愿；同时“安排道路”在中文中生硬且易产生字面误解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式简洁，保留原文的因果结构和“在耶和华……面前”的圣经表达；“谨慎行事”比逐字译法更易为普通读者理解。
