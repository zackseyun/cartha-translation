base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: zh_hans
  text: 约坦与他的列祖同睡[a]，人们把他葬在大卫城。他儿子亚哈斯接续他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按其含义译作“与他的列祖一同去世”。希伯来文直译为“与他的列祖同睡”，是记述君王死亡的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 在王室讣告套语中，此词表示死亡；保留“睡”的希伯来表达，同时由脚注说明其惯用含义。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: “列祖”自然保留王室死亡与归祖套语，也比单纯译作“祖先”更能呈现原文形式。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 人们把他葬在
  rationale: 原文为主动复数且主语未明；用泛指的“人们”保留主动结构，符合现代汉语。
- source_word: בְּעִיר דָּוִיד
  choice: 在大卫城
  rationale: 采用该地名在现代中文圣经语境中的简洁、通行表达。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 准确表达行使王权，并适合王位承继的叙述语境。
- source_word: תַּחְתָּיו
  choice: 接续他
  rationale: 在王位承继语境中表达取代前王、继位作王，比机械直译“在他之下”更自然准确。
- source_word: יוֹתָם
  choice: 约坦
  rationale: 采用现代简体中文圣经人名的通行译法。
- source_word: אָחָז
  choice: 亚哈斯
  rationale: 采用现代简体中文圣经人名的通行译法。
- source_word: בְּנוֹ
  choice: 他儿子
  rationale: 明确保留原文的父子关系与王位承继公式。
