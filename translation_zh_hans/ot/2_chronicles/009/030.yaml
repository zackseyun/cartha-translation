lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 该词是מלך的叙事性过去时形式，表示所罗门担任君王并施行王权；“作王”是现代中文圣经语体中自然、明确的表达。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用该人名通行的现代中文译名。
- source_word: בִירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 介词ב表示地点；“在耶路撒冷”准确而自然。
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: 统治全以色列
  rationale: עַל与מלך连用表示王权所及的对象；“全以色列”保留其整体性的民族与国家含义，“统治”使中文句法关系清楚。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 希伯来语以数词加单数名词表达这段年数，中文自然译作“四十年”。
