  text: וְ/גַם עַבְדֵ֤י חירם וְ/עַבְדֵ֣י שְׁלֹמֹ֔ה אֲשֶׁר הֵבִ֥יאוּ זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֛יאוּ עֲצֵ֥י אַלְגּוּמִּ֖ים וְ/אֶ֥בֶן יְקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: zh_hans
  text: 此外，希兰[a]的仆人和所罗门的仆人，就是那些从俄斐运来金子的人，也运来了阿勒古木[b]和宝石[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 历代志中这个名字也常按另一形式译作“户兰”；本节希伯来文作“希兰”。
    reason: alternative_reading
  - marker: b
    text: “阿勒古木”所指的具体树种不能确定；也有译本译作“檀香木”或按另一形式音译为“阿勒木”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文“宝石”在形式上是单数，这里很可能是集合用法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 此外……也
  rationale: 既承接上文，又保留附加、递进的语气；按现代汉语习惯将其自然分置于句首和主要动词前。
- source_word: עַבְדֵי
  choice: 仆人
  rationale: 在王室行政语境中，指为君王效力的人；“仆人”既贴近原词，也不额外强调奴隶身份或限定为官员。
- source_word: חירם
  choice: 希兰
  rationale: 按本节希伯来文专名形式音译，并采用现代中文圣经读者较熟悉的译名。
- source_word: וְעַבְדֵי שְׁלֹמֹה
  choice: 和所罗门的仆人
  rationale: 保留与前一短语平行的结构。
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: 就是那些从俄斐运来金子的人
  rationale: 明确保留关系从句对两组仆人的说明作用；“运来”准确表达使役词形在货物运输语境中的含义。
- source_word: אוֹפִיר
  choice: 俄斐
  rationale: 地名采用通行中文音译，不对其位置作无根据的认定。
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: 阿勒古木
  rationale: 原词所指树种不能确定，因此采用近似音译，避免以“檀香木”等具体树种作过度认定。
- source_word: וְאֶבֶן יְקָרָה
  choice: 和宝石
  rationale: אֶבֶן 虽为单数形式，在货物清单中很可能是集合用法；现代汉语“宝石”本身可作集合称谓，既自然又保留数目的开放性。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就是那些……”清楚连接关系从句，“此外……也……”传达原文的承接与附加语气。对无法确定的木材名称采取音译并加注，不在正文中强行确定树种。
