base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: zh_hans
  text: 你手下的人有福了[a]！你这些臣仆也有福了！他们常侍立在你面前[b]，聆听你的智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福”也可理解为“幸福”或“幸运”，指处于一种令人羡慕的境况。
    reason: lexical_alternative
  - marker: b
    text: “侍立在你面前”是宫廷用语，指在君王面前随侍、听候差遣。
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 该词表示一种令人羡慕的幸福、幸运或蒙福状态。“有福了”既保留庄重的赞颂语气，也符合现代中文表达。
- source_word: אֲנָשֶׁיךָ
  choice: 你手下的人
  rationale: 原词通常指“人、男人”。在王宫语境中，它指所罗门身边或属下的人；“你手下的人”比生硬的“你的人”自然，同时不把其身份过度限定为官员。
- source_word: עֲבָדֶיךָ
  choice: 臣仆
  rationale: עֶבֶד可指奴仆、仆人或臣属；此处是王宫侍奉的语境，“臣仆”既体现其服侍君王的身份，也不突出奴隶属性。
- source_word: אֵלֶּה
  choice: 这些
  rationale: 保留希伯来文指示词的现场指向性，表明示巴女王所说的是眼前这些臣仆。
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: 侍立在你面前
  rationale: 直译意象是“站在你面前”，同时也是宫廷用语，表示在君王面前随侍；“侍立”自然传达两层含义。
- source_word: תָּמִיד
  choice: 常
  rationale: 表示经常、持续地随侍，不必理解为毫无间断的绝对“永远”。
- source_word: וְשֹׁמְעִים אֶת חָכְמָתֶךָ
  choice: 聆听你的智慧之言
  rationale: 原文直译为“听你的智慧”。中文以“智慧之言”表达智慧借言语被听见的含义，既自然，也保留智慧属于所罗门这一重点。
