  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: zh_hans
  text: 示巴女王听说了所罗门的声名[a]，就带着规模极为庞大的随行队伍，以及驮着香料、大量黄金和宝石的骆驼，来到耶路撒冷，要用谜语[b]考验所罗门。她来到所罗门那里，就同他谈论她心里所想的一切[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听到了有关所罗门的传闻”。
    reason: lexical_alternative
  - marker: b
    text: “谜语”也可指隐语或难解的问题。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“同他谈论她心里所有的一切”，指她把自己的各种想法、疑问和关切全都说了出来。
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: 声名
  rationale: 这里指流传开来的有关所罗门的消息和名望。“声名”既符合“听说了”的汉语搭配，也保留其名声远播的含义。
- source_word: לְנַסּוֹת
  choice: 考验
  rationale: 此处表示借谜语检验所罗门的智慧；“考验”自然且准确。
- source_word: בְחִידוֹת
  choice: 用谜语
  rationale: חִידוֹת可指谜语、隐语或难解的问题。“谜语”保留原词具体而含有智力挑战的色彩。
- source_word: בִּירוּשָׁלִַם
  choice: 来到耶路撒冷
  rationale: 介词字面可作“在”，但与运动动词连用时表示到达地点，现代汉语自然表达为“来到耶路撒冷”。
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: 带着极其庞大的随从
  rationale: חַיִל语义可包括力量、军队、财富或队伍；结合骆驼和贵重礼物的出行情境，指规模可观的随行队伍最为合适，同时不把它限定为军队。
- source_word: בְּשָׂמִים
  choice: 香料
  rationale: 指有香气的香料或芳香物，在王室礼物的语境中译作“香料”通俗准确。
- source_word: לָרֹב
  choice: 大量
  rationale: 表示黄金数量很多；“大量黄金”是简洁自然的现代汉语。
- source_word: אֶבֶן יְקָרָה
  choice: 宝石
  rationale: 原文虽为单数形式，但在清单中可作集合意义；汉语“宝石”本身可作类称，无须强行标明单复数。
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: 都对他讲了
  rationale: דבר与עִם表示与某人说话。结合后接宾语，汉语用“把……都对他讲了”更自然，也保留向所罗门倾诉、交谈的意味。
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: 把心里所有的事都对他讲了
  rationale: 保留希伯来语以“心”指人的思想、疑问和关切的表达，同时用现代汉语可理解的句式呈现。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以两个较短句子承载长串随行物品，避免希伯来语长句在中文中显得拖沓；保留“心里”的源语意象，并以脚注说明其范围。所有脚注标记均置于对应正文内容之后。
