base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: zh_hans
  text: 王用阿勒古木[b]为雅威的殿和王宫修造通道[a]，又用它为歌唱者制作里拉琴和竖琴。这些东西以前在犹大地从未见过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“台阶”。原文词语可指筑起的道路；在这里可能指建筑物的通道或阶梯。
    reason: lexical_alternative
  - marker: b
    text: “阿勒古木”是音译，确切树种不明；平行经文《列王纪上》10:12使用形式略有不同的名称“阿勒木”。
    reason: cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  choice: 阿勒古木
  rationale: 这是指一种贵重木材的罕见名称，确切树种不明，因此按《历代志》的词形音译，不作推测性鉴定。
- source_word: מְסִלּוֹת
  choice: 通道
  rationale: 该词通常指筑起的道路；在建筑语境中可指供人通行的建筑结构，也可能特指台阶。“通道”保留较宽的词义，另以脚注说明。
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: 为雅威的殿和王宫
  rationale: בַּיִת直译为“房屋”，但此处分别指圣殿和王的宫殿；采用自然、明确的现代汉语。
- source_word: כִנֹּרוֹת וּנְבָלִים
  choice: 里拉琴和竖琴
  rationale: 原文区分两类弦乐器；“里拉琴”和“竖琴”是便于现代读者理解的近似名称，同时保留二者的区别。
- source_word: לַשָּׁרִים
  choice: 为歌唱的人
  rationale: 该词源自动词“歌唱”，直接指歌唱者；不泛化为所有乐师。
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים
  choice: 这样的东西，以前……从未见过
  rationale: 保留原文“像这些”的复数概括和前所未见的强调语气。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 在犹大地
  rationale: 保留原文明确出现的“地”，并采用简洁自然的地理表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界普遍接受的读音重构，并将其作为专名呈现，而不以“主”替代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。将“殿”和“王宫”用于建筑语境，以免生硬直译为两个“家”；对树种和建筑结构的真实不确定性通过音译及脚注保留。
