  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: zh_hans
  text: 于是，她对王说：“我在本国所听到的、关于你的话语和你智慧的传闻，是真的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 于是，她……说
  rationale: 该叙事动词形式承接前文并推进事件；“于是”自然体现先后衔接，女性代词由上下文中的示巴女王确定。
- source_word: אֶל־הַמֶּלֶךְ
  choice: 对王
  rationale: 直接表达说话的对象，符合现代汉语习惯。
- source_word: אֱמֶת הַדָּבָר
  choice: 传闻，果然是真的
  rationale: 原文是强调真实性的名词性表达；结合“所听见”的语境，“传闻”比直译为“话”或“事情”更自然。“果然”也呼应她亲自考察后确认了传闻。
- source_word: אֲשֶׁר שָׁמַעְתִּי בְּאַרְצִי
  choice: 我在本国所听见
  rationale: 保留第一人称所属含义，并以自然的汉语关系结构修饰“传闻”。
- source_word: עַל־דְּבָרֶיךָ
  choice: 关于你的言论
  rationale: דבר可指话语、事情或事务；“言论”较直接地保留其“话语”义，同时脚注说明另一种可能。
- source_word: וְעַל־חָכְמָתֶךָ
  choice: 和智慧
  rationale: 直接保留原文的“智慧”，并与前项并列；第二人称所属关系由共同的“你的”统摄。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”推进叙事，“果然是真的”体现女王亲眼验证后的确认；脚注保留דבר在“话语”与“事情”之间的词义空间。
