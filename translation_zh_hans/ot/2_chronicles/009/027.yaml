base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: zh_hans
  text: 王使银子在耶路撒冷多如石头，又使香柏木多如低地[a]的无花果桑树。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“示非拉”，指犹大中央山地以西的丘陵地带。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: 使……多如
  rationale: 该动词本义为“给、放置”，但在两个比较结构中表达使某物达到极其丰富的状态；译为“使……多如”既体现结果意义，也符合现代汉语表达。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: 这里指作为贵重物资的银，而非特指铸币；“银子”在叙事语体中自然易懂。
- source_word: כָּאֲבָנִים
  choice: 多如石头
  rationale: 比较的重点是数量众多、随处可见；“多如石头”保留原文意象，并自然表达其丰富程度。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按地点短语直接翻译。
- source_word: הָאֲרָזִים
  choice: 香柏木
  rationale: 复数名词在此可指香柏树或作为物资的香柏木；上下文强调王所积聚的资源，译作“香柏木”较为自然。
- source_word: כַּשִּׁקְמִים
  choice: 如……无花果桑树
  rationale: שִׁקְמִים 指无花果桑（sycamore fig），并非现代英语中常称 sycamore 的悬铃木或槭属树种；“无花果桑树”较准确且便于现代读者理解。
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: 低地的
  rationale: שְׁפֵלָה 可作普通名词“低地”，也可指犹大山地以西称为“示非拉”的特定丘陵地带；正文采用易懂的“低地”，专名可能性置于脚注。
- source_word: לָרֹב
  choice: 多如
  rationale: 该短语强调数量繁多；其意义融入“多如……树”的比较句中，避免生硬地另加“极其众多”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。两个分句以“使……多如”形成平行结构，保留希伯来文的修辞。脚注标记放在“低地”之后，因为注释说明的是 שְׁפֵלָה，而不是“耶路撒冷”。
