  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: zh_hans
  text: 天下所有的君王都求见所罗门[a]，为要听取上帝放在他心中的智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“寻求所罗门的面”，是寻求见面或觐见的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: 天下所有的君王
  rationale: “天下”自然表达 הָאָרֶץ 在列国君王语境中的广泛范围；“所有”保留 כֹל 的全称意义，又不把这一惯用表达解释为现代地理意义上的绝对全球范围。
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: 都求见所罗门
  rationale: 原文直译为“寻求所罗门的面”，是寻求见面或觐见的惯用语。“求见”在现代汉语中自然、庄重，并保留主动寻求觐见的含义；分词所表达的持续或反复行动由上下文中的概括性叙述体现。
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: 要听……智慧
  rationale: 不定式表示目的，译作“要听”。汉语可用“听……智慧”表达亲耳听取智慧教导，避免擅自补入“言语”或“教导”。
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: 上帝赐在他心里的
  rationale: “赐”体现 נתן 的给予含义及上帝是智慧来源；“在他心里”保留希伯来文的内在人观表达，不将“心”缩减为单纯的“头脑”。
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 所罗门智慧的神圣来源
  choice: 上帝赐在他心里的智慧
  alternative: 上帝赐给他的智慧
  rationale: 原文既明确智慧来自上帝，也明确说智慧被赐在所罗门“心里”。正文保留这两个要素，避免淡化内在生命、思想与意志所共同承载的智慧。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“天下所有的君王”延续王国叙事的宏阔语体；“求见”比直译“寻求……的面”更符合汉语习惯，同时用脚注保留原文意象。
