    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 看见
  rationale: 该叙事形式承接上文并推进情节；结合句子延续到下一节的结构，用“看见”自然表达其动作，不另行硬译连接词。
- source_word: מַלְכַּת שְׁבָא
  choice: 示巴女王
  rationale: 该结构表示以地域或国名界定的女王；“示巴女王”是现代汉语中自然、通行的表达。
- source_word: אֵת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，现代汉语中没有对应的独立词，其语法功能由语序体现。
- source_word: חָכְמַת שְׁלֹמֹה
  choice: 所罗门的智慧
  rationale: 忠实表达所属结构；这里的“智慧”包括洞察力与判断力，并非只指知识。
- source_word: וְהַבַּיִת
  choice: 和……宫室
  rationale: בַּיִת本义宽泛，可指房屋、住所或宫殿；在君王语境中很可能指所罗门的宫殿建筑。“宫室”既符合语境，又比“宫殿”稍宽，脚注保留“房屋”的字面可能。
- source_word: אֲשֶׁר בָּנָה
  choice: 他建造的
  rationale: 自然表达修饰前面名词的关系从句，并保持建造行为已完成的语义。
