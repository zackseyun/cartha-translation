  text: The king made a great ivory throne and overlaid it with pure gold[a].
translation:
  language: zh_hans
  text: 王制作了一座宏伟的象牙[a]宝座，并用纯金包覆它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“牙的宝座”；这里的“牙”指象牙。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: עשה在此叙事语境中表示制作、建造；“造了”简洁自然，不增添原文没有的工艺细节。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称号“王”，上下文虽指所罗门，本节仍保留称号而不改用人名。
- source_word: כִּסֵּא
  choice: 宝座
  rationale: 该词在君王语境中指王座；现代汉语以“宝座”自然表达其王权用途。
- source_word: שֵׁן
  choice: 象牙
  rationale: 该词本义为“牙”，在此材料用法中指象牙；译作“象牙”可直接传达原意。
- source_word: גָּדוֹל
  choice: 宏伟的
  rationale: גדול既可表示体量大，也可表示宏大、显赫；“宏伟”兼顾宝座的规模和气派。
- source_word: וַיְצַפֵּהוּ
  choice: 用……包覆
  rationale: צפה的强意词干在此表示以某种材料覆盖或包裹器物；“包覆”比“镀”更少限定具体工艺。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 直译材料及其品质，符合现代汉语固定搭配。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“宏伟”保留גדול在尺寸与气派之间的语义张力；避免用“镀金”过度限定古代制作工艺。
