base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/013.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: zh_hans
  text: 一年内来到所罗门那里的金子，重六百六十六他连得。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一年内送到所罗门那里的金子。”希伯来文直译为“来到所罗门那里的金子”，没有说明是谁送来的。
    reason: 说明原文未明示施事，并保留较贴近字面的译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 重……
  rationale: 此处以叙事句式陈述金子的重量；现代汉语无需另加“现在”之类未由原文明确表达的时间标记。
- source_word: מִשְׁקַל הַזָּהָב
  choice: 金子，重……
  rationale: מִשְׁקַל明确指重量。汉语用“金子，重……”比“金子的重量是……”更自然简洁，同时准确保留度量意义。
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: 所罗门……所得的
  rationale: 原文直译为“来到所罗门那里的”，并未说明由谁送来。“所得”在现代汉语中自然表达金子归到所罗门手中，也不明确指定施事；脚注交代其字面表达。
- source_word: בְּשָׁנָה אֶחָת
  choice: 一年内
  rationale: 直接表达原文所说的一年时间范围，不擅自将其明确解释为“每年”，从而保留原文可能指一年或年度数额的空间。
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: 六百六十六
  rationale: 按原文准确呈现基数，不附加象征性解释。
- source_word: כִּכְּרֵי זָהָב
  choice: 他连得
  rationale: כִּכָּר是古代的大重量单位；采用中文圣经语境中通行的音译“他连得”，避免用现代重量单位作不确定的精确换算。
theological_decisions:
- issue: 数字六百六十六是否具有象征意义
  choice: 仅将其译为金子重量的历史数额，不作象征性提示
  alternative: 在译文中暗示它与其他经文中“六百六十六”的象征意义相关
  rationale: 本节自身只陈述所罗门一年内所得金子的重量，没有解释这个数字的神学或象征含义；译文不应引入后来的关联。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“所罗门一年内所得的金子，重……”符合自然汉语语序；不用未由原文明确表达的篇章标记。“他连得”为古代重量单位的通行音译。
