  source_fidelity: 译文准确传达所罗门去世、被葬于他父亲大卫的城，以及罗波安继位。原文的主动复数“他们葬了他”以泛指“人”表达，未擅定施事者，处理妥当。
  naturalness: 整体庄重、自然，符合现代标准汉语的经文语体。“安葬”较“葬”更适合此处庄重的王室死亡记载。
  terminology: “所罗门”“大卫”“罗波安”“列祖同睡”均合乎通行圣经汉语用法。“他父亲大卫的城”保留原文对大卫为所罗门之父的说明，且不将其简化为仅有地名意义的表述。
  issues:
