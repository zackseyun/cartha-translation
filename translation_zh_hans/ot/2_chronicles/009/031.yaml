    issue: 脚注把“与列祖同睡”解释为“并归葬于先祖之中”。
    rationale: 该惯用语在此主要是死亡的委婉说法；安葬是下句另行叙述，且地点明确为大卫城。将“归葬于先祖之中”纳入该短语的释义，超出了此处短语本身可确定的含义，并模糊了经文分别陈述死亡与安葬的结构。
  - severity: low
    issue: “人把他葬在”可改为“人把他安葬在”。
    rationale: 两者均忠于原文主动复数的泛指施事者；“安葬”在死亡、王室葬礼的庄重语境中更自然。
