base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: zh_hans
  text: 所罗门与他的列祖同睡[a]，人把他安葬在他父亲大卫的城里。他儿子罗波安接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他的列祖同睡”是希伯来文的惯用说法，委婉地表示一个人去世。
    reason: 说明所保留的希伯来惯用语，避免将“同睡”理解为普通睡眠，同时不把下句另述的安葬内容附加到该短语上。
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与他的列祖同睡
  rationale: 保留希伯来文王室去世记载中的固定委婉语及其经文间呼应；现代读者可能不熟悉，故加脚注说明。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 人把他葬
  rationale: 原文是主动复数动词并带第三人称单数宾语后缀，施事者未明；用泛指的“人”既保留主动表达，也不擅自指明安葬者。
- source_word: בְּעִיר דָּוִיד אָבִיו
  choice: 在他父亲大卫的城里
  rationale: 忠实呈现“大卫之城”与“大卫是他父亲”的关系；此处“父亲”直接指所罗门之父大卫。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位承继语境中自然表达“统治、为王”，与后面的替代短语连用流畅。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该词在此表示王位上的替代与承继；“接替他作王”比直译“在他的位置上作王”更符合现代汉语，同时保留原义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留传统经文用语“列祖同睡”，以维持王室讣告公式的文学特色；其余部分避免生硬逐词对应。“罗波安”采用通行中文圣经人名译法。
