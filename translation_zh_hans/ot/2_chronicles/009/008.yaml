source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: zh_hans
  text: 愿耶和华你的神受称颂[a]！他喜悦你，使你坐在他的王位上，为耶和华你的神作王。因为你的神爱以色列，要使以色列永远坚立[b]，所以他立你作王治理他们，施行公平和公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华你的神是当受称颂的。”
    reason: 原文祝颂句式可理解为祈愿，也可在中文中表述为宣告。
  - marker: b
    text: 原文“以色列”按集体为单数；也可译作“要使他们永远坚立”。
    reason: 说明希伯来文单数后缀与集体名词之间的关系，并保留另一种自然译法。
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: 愿……受称颂
  rationale: 未完成式祈愿形态与被动分词构成祝颂语。“愿……受称颂”在现代汉语中自然庄重，并保留祈愿语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法。
- source_word: חָפֵץ בְּךָ
  choice: 喜悦你
  rationale: 准确表达该动词所含的欢喜、满意之意，简洁而不削弱其温暖的评价色彩。
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: 使你坐在他的王位上
  rationale: 在中文中自然表达君王被安置于王位之意，同时明确保留“他的王位”这一代词及其神学张力。
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: 为耶和华你的神作王
  rationale: 保留介词所表达的归属、代表或服事关系，不将其过度解释为某一种制度性概念。
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: 因为你的神爱以色列
  rationale: 将介词短语按上下文译为原因，符合句子逻辑，也保持现代汉语流畅。
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: 要使以色列永远坚立
  rationale: “坚立”保留使之站立、稳固长存的意象；重复“以色列”可在中文中清楚体现阳性单数后缀所指的集体对象，同时避免误指所罗门。
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: 所以他立你作王治理他们
  rationale: “立……作王”自然表达任命或设立；补出“治理”使“在他们之上作王”的关系在中文中清晰，并未加入新的职分内容。
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: 施行公平和公义
  rationale: 保留两个并列名词及其王权治理语境；“施行”准确传达实际执行的含义。
theological_decisions:
- issue: כִּסְאוֹ（“他的王位”）与所罗门王权的关系
  choice: 译作“他的王位”，代词指向耶和华
  alternative: 弱化为“王位”或理解为一般的王朝宝座
  rationale: 原文明确保留第三人称单数后缀，呈现君王在神的权柄之下并代表神施行统治的观念；译文不将这一表述淡化。
- issue: לְהַעֲמִידוֹ 中单数后缀的指代
  choice: 在正文中明确为“使以色列永远坚立”
  alternative: “使它永远坚立”或按集体复数译作“使他们永远坚立”
  rationale: 语法后缀为阳性单数，最自然地回指作为集体的“以色列”。中文重复名词既保留单数集体指向，也消除代词歧义；脚注记录可行的集体复数表达。
- issue: מִשְׁפָּט וּצְדָקָה 的王权含义
  choice: 译作“公平和公义”
  alternative: “审判和正义”或合并为“秉公行义”
  rationale: 分别保留两个希伯来名词，避免把二者压缩为单一概念，也不把“公义”仅限于司法裁判。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“他的王位”“为耶和华你的神作王”等原文中具有神学张力的措辞；为避免中文代词误指，在目的从句中重复“以色列”。
