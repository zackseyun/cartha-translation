base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: zh_hans
  text: 通往宝座的台阶有六级；宝座还有一个与它相连的金脚凳[a]。座位两边都有扶手，两个狮子立在扶手旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一条与宝座相连的金斜坡（或阶道）。”希伯来语“כֶּבֶשׁ”的含义不完全确定；在这里译作“脚凳”较符合宝座的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: 台阶
  rationale: 该词在宝座建筑的语境中指向上通往宝座的阶级；“台阶”既自然，也准确表达其功能。
- source_word: כֶּבֶשׁ
  choice: 脚凳
  rationale: 该词可指斜坡或阶道，但在宝座陈设的语境中，“脚凳”较为贴切；由于词义仍有不确定性，另在脚注保留其他可能。
- source_word: מָאֳחָזִים
  choice: 与它相连
  rationale: 这个被动分词表达固定、连接之意；译作“与它相连”符合现代汉语，也清楚呈现脚凳与宝座的关系。
- source_word: יָדוֹת
  choice: 扶手
  rationale: 原义为“手”，在座椅语境中指座位两侧供手臂倚放的部分，现代汉语通常称为“扶手”。
- source_word: מִזֶּה וּמִזֶּה
  choice: 两边
  rationale: 该短语直指一边和另一边，即左右两侧；“两边”简洁自然。
- source_word: מְקוֹם הַשָּׁבֶת
  choice: 座位
  rationale: 字面为“坐的地方”；在宝座结构的语境中，译作“座位”最为清楚。
- source_word: אֲרָיוֹת
  choice: 狮子
  rationale: 忠实保留原文的普通名词，不额外说明其为雕像，避免超出原文。
- source_word: עֹמְדִים
  choice: 立
  rationale: 直接表达狮子呈站立或竖立状态，简洁而符合描述性文体。
- source_word: אֵצֶל
  choice: 旁
  rationale: 表达紧邻的位置关系；“在扶手旁”自然、准确。
