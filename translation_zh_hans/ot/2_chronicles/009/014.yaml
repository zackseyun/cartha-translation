  source_fidelity: 译文基本保留了“除……以外”以及两类贡献来源，也正确译出阿拉伯诸王、地方官员、金银和所罗门。但“此外，还有……所带来的”未明确表达לְבַד מִן（“不包括／除……以外”）的排除关系，且原句在分号前形成不完整的名词性短语。
  naturalness: “此外，行商和商人所带来的也不算在内”是现代汉语中自然、完整的表达，并清晰承接上节所述数量。后半句以“各地的省长”表达“那地的总督／省长”，避免“当地”所指不明。
  terminology: “行商和商人”可保留原文两个并列的商贸群体；“阿拉伯的众王”“金银”“所罗门”均恰当。“省长”可作为פַּחוֹת的现代功能性对应词；“各地的”比“当地的”更贴合复数官员及其辖区关联，且不武断界定“那地”的范围。
