  to: 此外，行商和商人所带来的也不算在内；阿拉伯的众王和各地的省长都把金银带给所罗门。
  rationale: 修订以“不算在内”明确表达“除……以外”的句法功能，并使前半句成为完整自然的汉语。保留原文两组商贸人员及后句的并列贡献者；“都”对应“所有／众”并使全句汉语行文顺畅，未增加“进贡”等原文未明示的政治含义。
