  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: zh_hans
  text: 此外，行商和商人所带来的也不算在内；阿拉伯的众王和各地的省长都把金银带给所罗门。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבַד מֵאַנְשֵׁי הַתָּרִים וְהַסֹּחֲרִים
  choice: 此外，还有行商和商人所带来的
  rationale: לְבַד מִן在这里表示前述数额之外的补充来源；אַנְשֵׁי הַתָּרִים与הַסֹּחֲרִים是两个近义商贸群体，分别译作“行商”和“商人”，既保留并列，也符合现代汉语。
- source_word: מַלְכֵי עֲרַב
  choice: 阿拉伯的众王
  rationale: עֲרַב在此宜作地域名称“阿拉伯”；复数מַלְכֵי保留为“众王”。
- source_word: פַחוֹת הָאָרֶץ
  choice: 当地的省长
  rationale: פַחוֹת指受任命治理地区的高级官员，译作“省长”；הָאָרֶץ在此范围未必指全地，采用“当地”自然表达其地域关联，同时避免过度限定具体版图。
- source_word: מְבִיאִים זָהָב וָכֶסֶף לִשְׁלֹמֹה
  choice: 把金银带给所罗门
  rationale: 保留分词מְבִיאִים所表达的持续或惯常贡献，不另加“进贡”等原文未明说的政治含义；זָהָב וָכֶסֶף按原顺序译作“金银”。
