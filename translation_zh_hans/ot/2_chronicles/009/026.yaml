  yaml_path: translation/ot/2_chronicles/009/026.yaml
  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: zh_hans
  text: 他统管从大河[a]直到非利士人之地，又直到埃及边界的所有君王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大河”很可能指幼发拉底河；在希伯来圣经中，这是一个惯用的地理称呼。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: 他统管
  rationale: “וַיְהִי”与分词“מוֹשֵׁל”合用，描述持续的统治状态。译为“统管”既符合现代汉语，也保留对诸王行使权柄的政治含义。
- source_word: בְּכָל הַמְּלָכִים
  choice: 所有君王
  rationale: 介词ב与“统治”义的משל连用，表示统治所及的对象；“统管……所有君王”清楚表达宗主权，而非仅仅身处众王之中。
- source_word: מִן הַנָּהָר
  choice: 从大河
  rationale: 保留希伯来文带定冠词的地理称呼“那河／大河”；汉语圣经地理语境中“大河”自然庄重，具体所指以脚注说明。
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: 直到非利士人之地
  rationale: 贴近原文的领土表达，并明确其为非利士人居住的地域，不以专名“非利士地”替代。
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: 并直到埃及边界
  rationale: “גְּבוּל”指疆界或边界；“埃及边界”准确表达地域范围的西南界限。
