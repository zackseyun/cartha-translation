base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: zh_hans
  text: 所罗门王所有的饮器都是金制的；黎巴嫩林宫[a]里所有的器皿也都是精金制成的[b]。在所罗门的时代，银子算不得什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“黎巴嫩林之家”；这是所罗门的一座王室建筑的名称。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译近于“封闭的金”，通常理解为“纯金”或“炼净的金”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: 饮器
  rationale: 指饮用酒水等所用的各类器具；“饮器”简洁而不把范围缩窄为杯子。
- source_word: זָהָב
  choice: 金
  rationale: 直接表达器皿的材质，并保留原文重复强调金器的效果。
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: 黎巴嫩林宫
  rationale: 这是特定王室建筑的名称；“宫”符合其实际用途和现代汉语表达，脚注同时保留 בֵּית 的直译可能。
- source_word: זָהָב סָגוּר
  choice: 精金
  rationale: סָגוּר 修饰金时是含义不完全透明的固定说法，通常指纯净或精炼的优质黄金；“精金”自然、庄重，并由脚注说明原文措辞。
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: 银子算不得什么
  rationale: 贴近原文“未被算作任何东西”的表达，传达银子在当时无足轻重，而不把含义限定为严格的市场价值。
- source_word: בִּימֵי שְׁלֹמֹה
  choice: 所罗门在世的日子
  rationale: 保留希伯来语“在所罗门的日子”的历史性说法，又使现代汉语通顺；不额外限定为仅指其执政时期。
