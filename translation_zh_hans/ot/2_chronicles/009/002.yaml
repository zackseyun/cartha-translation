base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/002.yaml
  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
translation:
  language: zh_hans
  text: 所罗门把她所问的一切都回答了[a]；没有一件事瞒得过所罗门而他没有告诉她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所罗门把她所有的话都告诉了她。”希伯来文也可指“她所提出的一切事项”。
    reason: lexical_alternative
  - marker: b
    text: 更贴近字面可译：“没有一件事向所罗门隐藏，是他没有告诉她的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: 回答
  rationale: נגד的基本义是“告诉、说明”；结合上文女王用难题考问所罗门的语境，此处译为“回答”最自然，也准确表达叙事中的问答关系。
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: 她所问的一切
  rationale: דבר可指“话、事情、问题”。这里承接上文的难题，译作“她所问的一切”既符合语境，也保留其涵盖各种话题和事项的宽度。
- source_word: נֶעְלַם
  choice: 不知道
  rationale: 该词为עלם的尼法勒式，直译为“被隐藏”。汉语用“没有什么事是所罗门不知道”自然表达“没有一事向所罗门隐藏”的意思；脚注保留其字面表述。
- source_word: דָּבָר
  choice: 什么事
  rationale: 单数דבר与否定词连用，具有“没有一件事、没有什么”的概括含义；译作“什么事”符合现代汉语习惯。
- source_word: מִשְּׁלֹמֹה
  choice: 所罗门不知道
  rationale: 介词מן在נעלם之后标明事情对谁是隐藏的。汉语以“不知道”重构这一关系，意义为“没有事情向所罗门隐藏”。
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: 不能向她解明的
  rationale: 原文再次使用נגד，基本义为“告诉、说明”。在解答难题的语境中，“向她解明”自然传达所罗门把答案说明白的含义；脚注列出更贴近字面的译法。
