  text: כִּֽי אֳנִיּ֤וֹת לַ/מֶּ֨לֶךְ֙ הֹלְכ֣וֹת תַּרְשִׁ֔ישׁ עִ֖ם עַבְדֵ֣י חוּרָ֑ם אַחַת֩ לְ/שָׁל֨וֹשׁ שָׁנִ֜ים תָּב֣וֹאנָה אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ נֹֽשְׂאוֹת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קוֹפִ֖ים וְ/תוּכִּיִּֽים־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: zh_hans
  text: 因为王有船只同户兰的臣仆一道前往他施；每三年，他施的船只回来一次，载着金、银、象牙、猴子和孔雀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孔雀”或作“鹦鹉”；希伯来语所指的鸟类不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为所罗门财富的来源作解释；现代汉语中“因为”自然清楚。
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: 王有船只
  rationale: 介词短语字面为“属于王／给王”，在此表达领有关系，译作“王有船只”符合汉语习惯。
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: 前往他施
  rationale: 保留分词所表达的航行与目的地方向，不在此处直接处理成船只类别。
- source_word: עִם עַבְדֵי חוּרָם
  choice: 同户兰的臣仆一道
  rationale: עבדים 在王室语境中指为户兰效力的人员；“臣仆”既贴近原词，又避免突出奴隶身份。
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: 每三年……一次
  rationale: 以自然汉语表达周期性时间。
- source_word: תָּבֹאנָה
  choice: 回来
  rationale: 未完成式表示过去反复发生的惯常行动；船只带货抵达王所在之处，汉语用“回来”最自然。
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: 他施船队
  rationale: 此处是名词结构，可指与他施航线或贸易有关的远洋船只；“船队”在汉语中自然表达复数整体，同时保留“他施”这一关联。
- source_word: נֹשְׂאוֹת
  choice: 载着
  rationale: 准确表达船只运输货物的持续或惯常动作。
- source_word: שֶׁנְהַבִּים
  choice: 象牙
  rationale: 这是该货物名称的常规且自然的对应词。
- source_word: וְקוֹפִים
  choice: 猴子
  rationale: 该动物词通常理解为猴类或猿类；“猴子”是现代汉语中较通俗的表达。
- source_word: וְתוּכִּיִּים
  choice: 孔雀
  rationale: 传统上常译“孔雀”，但具体鸟类无法确定，因此在脚注列出另一可能。
theological_decisions: []
