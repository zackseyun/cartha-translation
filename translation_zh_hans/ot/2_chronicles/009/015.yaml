  yaml_path: translation/ot/2_chronicles/009/015.yaml
  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: zh_hans
  text: 所罗门王用锤打过的金子制成二百面大盾牌；每面盾牌用去重六百舍客勒[a]的锤打过的金子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“六百锤打过的金子用在一面盾牌上”，没有明说重量单位；这里按语境补出“舍客勒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: עשה是“做、制造”的常用动词；在记述器物制作的语境中，“做了”自然清楚。
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 按现代汉语习惯将王号置于人名之后，准确表达原文的“王所罗门”。
- source_word: מָאתַיִם
  choice: 二百
  rationale: 直接对应原文基数词。
- source_word: צִנָּה
  choice: 大盾牌
  rationale: צִנָּה通常指可护住较多身体部位的大型盾牌，有别于较小的盾；译作“大盾牌”保留这种词义区别。
- source_word: זָהָב שָׁחוּט
  choice: 锤打的金子
  rationale: שָׁחוּט在此描述经锤打、延展加工的金；“锤打的金子”比“精金”等译法更贴近其制作含义。
- source_word: שֵׁשׁ מֵאוֹת
  choice: 六百
  rationale: 直接对应原文数词；原文未明说计量单位。
- source_word: יַעֲלֶה עַל
  choice: 用了
  rationale: 该短语字面表示一定数量的金子“加到、用在”盾牌上；汉语用“用了”自然表达每面盾牌所耗用的金量，同时不武断说明具体覆盖工艺。
- source_word: הַצִּנָּה הָאֶחָת
  choice: 每面盾牌
  rationale: 原文字面为“那一面盾牌”，在数量分配结构中具有逐一分配的意义，现代汉语宜译作“每面盾牌”。
- source_word: '[שֵׁשׁ מֵאוֹת后省略的计量单位]'
  choice: 舍客勒[a]
  rationale: 原文只说“六百”，语境隐含重量单位；据平行记载和古代称量习惯，可补出“舍客勒”，并用脚注说明原文的省略，以免把补充内容误当作明文。
