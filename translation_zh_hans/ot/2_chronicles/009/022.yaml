  yaml_path: translation/ot/2_chronicles/009/022.yaml
  text: King Solomon surpassed all the kings of the earth in wealth and wisdom.
translation:
  language: zh_hans
  text: 所罗门王在财富和智慧上，胜过地上所有的君王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: 胜过
  rationale: גדל与比较介词מִן连用，表示相较之下更为卓越；“胜过”自然传达这种比较意义，而不是身体或规模上的增长。
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: 所罗门王
  rationale: 原文以称号和名字同位指称所罗门；“所罗门王”符合现代汉语习惯，并完整保留两项信息。
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: 地上所有的君王
  rationale: אָרֶץ可指“地”或“全地”；本节处于列国君王与所罗门比较的国际性语境中，“地上所有的君王”既保留广泛范围，也符合汉语圣经语体。
- source_word: לְעֹשֶׁר
  choice: 在财富……上
  rationale: 介词לְ在此标明比较所涉及的方面；“在……上”准确而自然地表达这一范围。
- source_word: וְחָכְמָה
  choice: 和智慧
  rationale: חָכְמָה意为“智慧”；与“财富”并列，共同受汉语框架“在……上”支配，无须重复介词结构。
