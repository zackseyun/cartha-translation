  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: zh_hans
  text: 所罗门其余的事迹，从始至终，不都记在先知拿单的记载[a]、示罗人亚希雅的预言，以及先见易多论到[b]尼八之子耶罗波安的异象中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记载”也可译作“言语”或“记述”。希伯来语这个词既可指说出的话，也可指书面记录；这里很可能是指一份文献资料。
    reason: lexical_alternative
  - marker: b
    text: “论到”也可译作“关于”，或可能译作“针对”。希伯来语介词可表达这些相关含义；在列举文献来源的语境中，“论到”最为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: 所罗门其余的事迹
  rationale: 在王室史书的总结套语中，דִּבְרֵי 指所行之事或事迹，不限于说过的话；“事迹”自然地传达史料语境。句首 וּ 连接上文，汉语无需机械译作“并且”。
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: 从始至终
  rationale: 该对举涵盖所罗门生平或统治的全部时段；“从始至终”保留其总括意义，并符合现代汉语表达。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……吗
  rationale: 保留原文反问形式；“记在”适合引述文献来源的语境。加入“都”自然体现复数主语及前文总括范围。
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: 在先知拿单的记载
  rationale: 在 כתב 与 עַל 构成的来源引述中，宜译为“记在……中”。דִּבְרֵי 在此很可能指文献性记载，但仍以脚注保留“言语／记述”的词义幅度。
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: 示罗人亚希雅的预言
  rationale: נְבוּאָה 直指预言或先知信息；“示罗人”清楚表达籍贯称谓。
- source_word: וּבַחֲזוֹת יעדי הַחֹזֶה
  choice: 先见易多……的异象
  rationale: חֲזוֹת 是与异象启示有关的复数或集合形式，译作“异象”。חֹזֶה 译作“先见”，以保留它与 נָבִיא“先知”的称谓区别。WLC正文辅音显示 יעדי；“易多”按历代志相关人物及古代译本所支持的通行识别处理。
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: 论到尼八之子耶罗波安
  rationale: עַל 在文献来源语境中最自然地表示主题，即“论到／关于”；它也可能带有“针对”的意味，因此用脚注保留这一可能。
