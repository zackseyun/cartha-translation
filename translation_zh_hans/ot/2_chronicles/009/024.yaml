  text: וְ/הֵ֣ם מְבִיאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: zh_hans
  text: 他们各自带来贡礼[a]，有银器、金器、衣服[b]、武器[c]、香料、马和骡子，年年如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贡礼”或译“礼物”或“礼品”；希伯来语在这里可指献给君王的礼物，而本节的王室语境可能含有进贡之意。
    reason: lexical_alternative
  - marker: b
    text: “衣服”或译“袍服”。
    reason: lexical_alternative
  - marker: c
    text: “武器”或译“军械”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִיאִים
  choice: 带来
  rationale: 希伯来语分词在上下文中表示惯常、反复发生的行动；与句末“年年如此”结合，中文用“带来”即可自然表达。
- source_word: אִישׁ מִנְחָתוֹ
  choice: 各自带来贡礼
  rationale: אִישׁ 在此作分配用法，意为“各人”；מִנְחָה 可指礼物或献礼，在向君王定期进献的语境中译作“贡礼”最贴切，同时以脚注保留“礼物”的可能。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: 银器、金器
  rationale: כְּלִי 的范围较广，可指器物、用具；“银器、金器”在中文礼品清单中简洁自然，又不限定具体器型。
- source_word: וּשְׂלָמוֹת
  choice: 衣服
  rationale: 该词指衣物，可能特别指贵重外衣；正文采用宽泛自然的“衣服”，脚注保留“袍服”。
- source_word: נֵשֶׁק
  choice: 武器
  rationale: 该词可泛指武器或军用装备；“武器”是现代中文最清楚且不过度解释的表达，脚注注明“军械”的可能。
- source_word: וּבְשָׂמִים
  choice: 香料
  rationale: 在王室贡礼语境中指芳香物或香料；“香料”自然且范围适中。
- source_word: סוּסִים וּפְרָדִים
  choice: 马和骡子
  rationale: 直接对应原文所列两类牲畜。
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: 年年如此
  rationale: 这是表示每年照例发生的习语；“年年如此”既保留反复性，也符合现代汉语行文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。贡物清单使用简洁并列结构；以“年年如此”表达希伯来语的惯常年度重复。所有词义歧义均通过脚注保留，未加入宗派性解释。
