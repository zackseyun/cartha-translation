base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/019.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: zh_hans
  text: 有十二只狮子立在六级台阶上[a]，分列在这边和那边。任何王国都没有造过这样的宝座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有十二只狮子分列在六级台阶两边。”
    reason: 原文的方位短语说明狮子位于台阶两侧；结合六级台阶与十二只狮子，可推知每级两侧各一只，但该逐级分配并非方位短语本身的明说。
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיוֹת
  choice: 有十二只狮子
  rationale: 以现代汉语自然的存在句引出宝座的下一项特征；“狮子”在上下文中指狮子造型。
- source_word: עֹמְדִים שָׁם
  choice: 立在
  rationale: 分词描绘狮子造型所处的静态位置；汉语“立在”简洁而保留视觉形象，“那里”依上下文可自然省略。
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: 在六级台阶上
  rationale: מַעֲלוֹת在此指通向宝座的台阶；עַל按其基本空间意义译作“在……上”。
- source_word: מִזֶּה וּמִזֶּה
  choice: 这边一只，那边一只
  rationale: 该短语表示分列两边；结合十二只狮子和六级台阶，译文自然传达每级两边各有一只的分布，同时以脚注保留较宽泛的句法理解。
- source_word: לֹא נַעֲשָׂה כֵן לְכָל מַמְלָכָה
  choice: 任何一个王国都没有造过这样的宝座
  rationale: 被动结构在汉语中转为泛指主动句更自然；“这样的宝座”依据本段明确的描述对象补出，表达没有任何王国造过同类宝座的独特性。
