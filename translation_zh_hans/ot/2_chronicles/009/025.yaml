  source_fidelity: 原文称所罗门有四千个与马匹和战车相关的厩舍（或栏位），以及一万二千名骑马者；随后说他将这些资源部署在战车城和在耶路撒冷与王同在之处。草稿的“耶路撒冷王的身边”改变了原文的句法关系，仿佛“耶路撒冷王”是一个称号，且未明确耶路撒冷是地点。
