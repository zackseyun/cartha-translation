base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: zh_hans
  text: 所罗门有四千处供马匹和战车使用的厩舍[a][b]，又有一万二千名骑兵；他把这些人马和战车部署在战车城，并在耶路撒冷与王同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厩舍”也可译作“栏位”或“马厩”；希伯来语一词指安置马匹的栏位或厩舍。
    reason: lexical_alternative
  - marker: b
    text: 列王纪上4:26的平行记载作“四万个厩位”，本节则作“四千处”。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: 所罗门有
  rationale: היה + ל 表示拥有或归属；译为“所罗门有”自然、准确。
- source_word: אַרְבַּעַת אֲלָפִים
  choice: 四千个
  rationale: 直接表达希伯来语数词，并以量词“个”修饰厩位。
- source_word: אֻרְיוֹת
  choice: 厩位
  rationale: 该词指安置马匹的隔间或栏位；“厩位”比泛指整座建筑的“马厩”更贴近词义。
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: 安置战马和战车的
  rationale: 原文并列“马”和“战车”；补出用途关系，使现代汉语通顺而不把两者合并为单一概念。
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 还有一万二千名骑兵
  rationale: פָּרָשִׁים 指骑马者或骑兵；在军事语境中译作“骑兵”自然，且避免“骑士”的后世文化联想。
- source_word: וַיַּנִּיחֵם
  choice: 他把他们驻扎
  rationale: 动词有放置、安置之意；军事行政语境下，“驻扎”准确表达人员和军力的部署。
- source_word: בְּעָרֵי הָרֶכֶב
  choice: 在战车城
  rationale: 保留原文构造“战车之城”，指专门配置战车部队的城邑；“战车城”简洁而庄重。
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלִָם
  choice: 和耶路撒冷王的身边
  rationale: 原文直译为“并与王同在耶路撒冷”；汉语以“在耶路撒冷王的身边”清楚表达地点和随侍于王的关系。
theological_decisions: []
