base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: zh_hans
  text: 她送给王一百二十他连得的金子、大量香料和宝石。此前从未有过像示巴女王送给所罗门王的那些香料那样的香料。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：“后来再没有像示巴女王送给所罗门王的那些香料那样的香料。”希伯来语可理解为截至当时无可相比，也可作更广义的理解，指这份礼物在以色列的历史记忆中无可匹敌。
    reason: 原文的否定比较在时间范围上可有不同理解；正文采用截至叙事时点的回顾性读法，脚注保留较广义的读法。
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: 她送给
  rationale: 叙事性连续式推动事件发展；现代汉语用“她送给”自然承接上文，也清楚表达赠予。
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: 一百二十他连得金子
  rationale: כִּכָּר是古代重量单位，采用圣经汉语中通行的音译“他连得”，不擅自折算为不确定的现代重量。
- source_word: וּבְשָׂמִים לָרֹב מְאֹד
  choice: 极多的香料
  rationale: בְשָׂמִים泛指芳香香料，לָרֹב מְאֹד强烈表示数量众多；此译简洁保留强调。
- source_word: וְאֶבֶן יְקָרָה
  choice: 和宝石
  rationale: אֶבֶן虽为单数形式，在礼物清单中可作集合名词；汉语“宝石”无需标示单复数。
- source_word: כַּבֹּשֶׂם הַהוּא
  choice: 那批香料
  rationale: כְּ表达比较，בֹּשֶׂם可作集合名词；“那批”自然指回女王所赠的大量香料，并避免把比较范围误限为某一种香料。
- source_word: וְלֹא הָיָה
  choice: 是此前从未有过的
  rationale: 完成式在叙事语境中最直接表示截至当时未曾有过；“此前”明确保留这一主要时间指向。
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: 给所罗门王
  rationale: 按现代汉语习惯将称号置于人名之后，清楚表达受赠者。
theological_decisions:
- issue: “从未有过”的时间范围
  choice: 正文译为“此前从未有过”，理解为截至叙事所述时点无可相比。
  alternative: 也可将这句话理解为后来再没有可与之相比的香料，或在以色列的历史记忆中这份礼物无可匹敌。
  rationale: 希伯来语וְלֹא הָיָה本身是过去时态陈述，正文优先保留截至当时的含义；但这种绝对化比较也可能在叙事修辞中表达更广泛的无可匹敌，因此以脚注保留范围上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“他连得”保留古代重量单位；“那批香料”既照应前文数量极多，也避免生硬直译。脚注标记置于它实际说明的第二句之后，而不是误置在金子重量之后。
