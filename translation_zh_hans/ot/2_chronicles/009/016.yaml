base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: zh_hans
  text: 又做了三百面锤成薄片的金盾牌；每面盾牌用了三百舍客勒金子[a]。王把这些盾牌放在“黎巴嫩林宫”[b]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文意为“三百金子用在每面盾牌上”，没有注明计量单位；这里根据王上10:17的平行记载补作“舍客勒”。
    reason: lexical_alternative
  - marker: b
    text: “黎巴嫩林宫”是一座王室建筑的名称；也可译作“黎巴嫩林府”。
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: 盾牌
  rationale: 该词泛指盾牌；上下文没有充分依据采用更具体或较古雅的名称。
- source_word: זָהָב שָׁחוּט
  choice: 锤成薄片的金
  rationale: שָׁחוּט在此描述经过捶打加工的金子，很可能指锤成薄片；这一译法既表达制作方式，也不把它误解为纯金铸成的整面盾牌。
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: 三百舍客勒金子
  rationale: 希伯来文直译为“三百金子”，没有明说计量单位；参考王上10:17的平行经文，所省略的单位很可能是舍客勒。正文补出单位以便理解，并以脚注说明原文的简略表达。
- source_word: יַעֲלֶה עַל
  choice: 用了
  rationale: 原表达的具体意象是所述数量的金子“加在”每面盾牌上；汉语用“用了”可自然表达制作每面盾牌所耗用的金量，同时避免生硬直译。
- source_word: הַמָּגֵן הָאֶחָת
  choice: 每面盾牌
  rationale: 形式上是单数“那一面盾牌”，在三百面盾牌的语境中具有逐一分配的含义，现代汉语自然译作“每面盾牌”。
- source_word: וַיִּתְּנֵם
  choice: 把这些盾牌放在
  rationale: נתן与地点搭配时意为放置；补出“这些盾牌”比单用代词更清楚自然。
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: “黎巴嫩林宫”
  rationale: 这是王室建筑的专名。译作“黎巴嫩林宫”既保留“黎巴嫩”和“林”的名称成分，也以“宫”表明其王宫建筑性质；引号标示专名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“锤成薄片”准确交代金子的加工方式；“舍客勒”保留古代重量单位并用脚注揭示原文未明说单位。“黎巴嫩林宫”作为建筑专名加引号，避免被误读为位于黎巴嫩森林中的普通房屋。
