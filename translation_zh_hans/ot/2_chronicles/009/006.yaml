  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: zh_hans
  text: 但我先前不信他们的话，直到我亲自来，亲眼看见。原来，人告诉我的，还不到你智慧之丰富的一半！你超过了我所听到的报道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: 不信
  rationale: 此处使役词形表示不把所听见的话当真；“不信”准确而自然，不采用容易暗示人身倚靠的“不信任”。
- source_word: לְדִבְרֵיהֶם
  choice: 他们的话
  rationale: 保留דבר的基本意义，也让上下文自然表明这些话是关于所罗门的报道。
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: 亲眼看见
  rationale: 希伯来文直译为“我的眼睛看见”；汉语“亲眼看见”自然传达亲身验证的强调。
- source_word: וְהִנֵּה
  choice: 想不到
  rationale: 在此表达亲见之后的惊叹和出乎意料，比生硬的“看哪”更符合现代汉语叙述，同时保留话语力度。
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: 你丰盛的智慧
  rationale: מַרְבִּית可指丰富、众多或宏大；“丰盛的智慧”保留其数量和程度上的充盈感。
- source_word: הֻגַּד לִי
  choice: 人告诉我的
  rationale: 被动形式意为“被告诉／被报道”；现代汉语用泛指主语“人”表达被动关系，简洁自然。
- source_word: יָסַפְתָּ עַל
  choice: 你远远超过了
  rationale: יסף与על连用在这里表示在已有标准之上更多、超出；“远远超过”清楚传达比较和强烈赞叹。
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: 我所听到的传闻
  rationale: שְׁמוּעָה指听来的消息或报道；“传闻”与“听到”保持原文的词义呼应，在此不必然含虚假之意。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亲自来，亲眼看见”保留原文从听闻到亲证的递进；“想不到”承载וְהִנֵּה所表达的惊讶。英文咨询层的脚注标记与脚注内容位置明显错配，且这些词义差异无需在本节中文正文中另设脚注，因此未沿用。
