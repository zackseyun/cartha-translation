  to: 但我先前不信他们的话，直到我亲自来，亲眼看见。原来，人告诉我的，还不到你智慧之丰富的一半！你超过了我所听到的报道。
  rationale: 修订明确“半数”所指为所罗门智慧的丰富程度，以免中文产生歧义；将带有潜在贬义的“传闻”改为中性的“报道”，并删除原文未明示的程度加强语“远远”。其余保留原稿的现代、庄重语体及亲身验证的强调。
