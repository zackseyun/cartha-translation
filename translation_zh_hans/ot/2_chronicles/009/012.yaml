base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: zh_hans
  text: 所罗门王把示巴女王所想要的一切，就是她所求的一切，都给了她；除了她带给王的东西以外[a]。随后，她转身回自己的国土去了；她的仆从也同去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这短语也可译作“此外还有她带给王的东西”。希伯来语未明确说明这句话与所罗门所给之物的确切关系；它可指不包括女王带给王的东西，也可按上下文理解为除所求之物以外另有与她所带之物相关的赠与。
    reason: 保留מִלְּבַד短语的句法和语境歧义，不把平行经文所支持的解释性补足写入正文。
  - marker: b
    text: 希伯来语直译为“她转身，往自己的国土去了，她和她的仆从”。
    reason: 说明“转身”和随行仆从均出自原文；中文正文为自然表达而调整语序。
lexical_decisions:
- source_word: נָתַן
  choice: 送给
  rationale: 此处指王向女王赠送物品；“送给”比单纯“给”更清楚地表达馈赠语境，同时保持自然。
- source_word: מַלְכַּת שְׁבָא
  choice: 示巴女王
  rationale: 采用现代中文圣经地名的通行音译，并以自然的中文次序表达称号。
- source_word: כָּל חֶפְצָהּ אֲשֶׁר שָׁאָלָה
  choice: 所想要的一切，就是她所求的
  rationale: חֵפֶץ可指愿望或所喜爱的东西；结合后面的שׁאל，以“所想要的一切，就是她所求的”既保留两个相连表达，也符合现代汉语。
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: 此外还有与她带给王的相称之礼
  rationale: 该短语按《历代志》平行语境可理解为所罗门除满足请求外，另有回赠；希伯来文本表面也可理解为“除她带给王的以外”，故正文作语境化表达，并以脚注保留较直译的可能。
- source_word: וַתַּהֲפֹךְ וַתֵּלֶךְ לְאַרְצָהּ
  choice: 转身回本国去了
  rationale: “转身”保留הפך的叙事动作，“回本国去”自然表达הלך אל־ארצה的返程含义。
- source_word: הִיא וַעֲבָדֶיהָ
  choice: 她和臣仆
  rationale: עֲבָדֶיהָ在王室随行人员语境中用“臣仆”较“奴仆”中性，也比“随从”更保留其服侍和臣属色彩。
