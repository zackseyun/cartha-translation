  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד מְשָׁרְתָ֜י/ו וּ/מַלְבּֽוּשֵׁי/הֶ֗ם וּ/מַשְׁקָי/ו֙ וּ/מַלְבּ֣וּשֵׁי/הֶ֔ם וַ/עֲלִיָּת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה ע֛וֹד בָּ֖/הּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: zh_hans
  text: 又看见他席上的食物、臣仆的座次、侍从的侍立以及他们的服装、司酒的人以及他们的服装，还有他登上雅威的殿所走的台阶[a]，她就惊讶得喘不过气来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以及他在雅威的殿所献的燔祭。”列王纪上10:5的平行经文作“燔祭”；但本节希伯来文本最自然的意思是他登殿所走的台阶或上行处。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译：“她里面再没有气息。”这是形容极度震惊、惊叹的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: 他席上的食物
  rationale: 直译其具体含义，既可指席上所摆的食物，也自然包含王室膳食的丰盛供应。
- source_word: מוֹשַׁב עֲבָדָיו
  choice: 臣仆的座次
  rationale: מוֹשָׁב在这里指就座的位置或座位安排；“座次”简洁地传达宫廷中井然有序的席位安排。עֲבָדָיו按王宫语境译为“臣仆”，避免使人误解为近代意义上的奴隶。
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: 侍从如何站班
  rationale: 保留מַעֲמַד所含“站立、站位”的可见场景，也表达侍从按次序当值服侍的意思，并与前面的臣仆有所区分。
- source_word: מַלְבּוּשֵׁיהֶם
  choice: 他们的服装
  rationale: 采用清楚、现代的用语，保留原文对宫廷人员衣着的具体观察。
- source_word: מַשְׁקָיו
  choice: 司酒的人
  rationale: 该词在王宫语境中指负责供应酒水的人；“司酒的人”比音译式官衔更易懂，也不加入现代管家制度的联想。
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: 他登上雅威殿所走的台阶
  rationale: 依马所拉文本，将עֲלִיָּה理解为上行处或台阶，并保留原文“上去”的语义呼应；列王纪上10:5的平行经文可能支持“燔祭”，故在脚注列出。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: “殿”在现代汉语中自然指神的圣所；יְהוָה以“雅威”音译，以呈现原文中的专名。
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: 她就惊讶得屏住了呼吸
  rationale: רוּחַ在此可指气息；译文保留呼吸的形象，同时用自然汉语表明这是极度震惊的惯用表达，没有改写成纯心理概述。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文以现代汉语中较接近YHWH常见学术拟音的“雅威”呈现专名，不以头衔替代，也不把某一宗派解释带入经文。
- issue: “不再有气息”的含义
  choice: 惊讶得屏住了呼吸
  alternative: 她魂不附体；她喘不过气来；她里面再没有灵
  rationale: 上下文表明这是面对所罗门荣耀时的强烈惊叹。“屏住了呼吸”保留רוּחַ的身体性意象，同时避免将其解释为灵魂离体或实际濒死。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“座次”“站班”“司酒的人”共同呈现王宫秩序，又避免生硬古语。为使本节在中文中承接上文，补出原句所省略、由上一节支配的“又看见”。
