  text: And they were importing horses for Solomon from Egypt and from all the lands[a].
translation:
  language: zh_hans
  text: 他们从埃及和各地为所罗门运来马匹。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他们把马匹从埃及带出，给所罗门；也从各地带出。”希伯来语动词字面意思是“使出来、带出”，在这里指贸易供应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: 运来
  rationale: 该词是 יצא 的使役分词，字面意思是“使出来、带出”。本节描述从埃及等地向所罗门供应马匹，“运来”既符合贸易语境，也保留运输、带出的动作含义；主语采用泛指的“他们”，对应希伯来语复数分词。
- source_word: סוּסִים
  choice: 马匹
  rationale: 复数名词，意为“马”；“马匹”在现代汉语叙事中自然庄重。
- source_word: מִ/מִּצְרַיִם
  choice: 从埃及
  rationale: 介词 מן 表示来源，说明马匹来自埃及。
- source_word: לִ/שְׁלֹמֹה
  choice: 为所罗门
  rationale: 介词 ל 可表示方向或受益者；在供应和贸易语境中，“为所罗门”自然表达受益者或采购对象，同时不排除运往他那里的含义。
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: 和各地
  rationale: כָּל 与 אֶרֶץ 的复数连用，泛指众多地域。“各地”比“所有国家”较少加入现代民族国家概念，也符合现代汉语表达。
