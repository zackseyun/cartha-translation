  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: zh_hans
  text: 耶和华[a]—他们列祖的上帝—屡次殷切地[b]差遣自己的使者到他们那里，因为他怜惜自己的子民和自己的居所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是上帝名字“YHWH”的传统中文译法。
    reason: divine_name
  - marker: b
    text: 原文直译为“早起并差遣”，是表示殷切、持续行动的惯用语，也可理解为“一次又一次地差遣”。
    reason: lexical_and_contextual_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现四字神名，而不以“主”替代。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们列祖的上帝
  rationale: 贴近原文，保留以色列人与列祖之间的历史及圣约关联；“列祖”庄重且为普通中文读者所能理解。
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: 传话给他们
  rationale: שׁלח本义是“差遣、发送”；本句未明说所传内容，但借使者而来的显然是信息。“传话”以自然中文表达原文隐含的交际作用。
- source_word: בְּיַד מַלְאָכָיו
  choice: 借他的使者
  rationale: ביד在此表示媒介或代理。直译“借……的手”在现代中文中生硬，故译作“借”；“使者”既保留מַלְאָךְ的基本义，也不误导为天使。
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: 一次又一次地
  rationale: 这是希伯来语惯用语，字面为“早起并差遣”，在此强调殷切、持续、反复地差遣。正文传达其实际语义，字面形态及语气见脚注。
- source_word: כִּי חָמַל
  choice: 因怜惜
  rationale: חמל兼有怜悯并欲保全之意。“怜惜”简洁自然，既表达情感，也隐含不愿毁灭的倾向。
- source_word: עַל עַמּוֹ
  choice: 自己的子民
  rationale: 在“怜惜”之后，介词עַל自然融入中文宾语结构；反身代词清楚指向耶和华。
- source_word: מְעוֹנוֹ
  choice: 自己的居所
  rationale: 保留מָעוֹן“居所”的词义及上帝临在其中的神学表达，不在正文中直接窄化为“圣殿”。
theological_decisions:
- issue: “他的使者”的身份
  choice: 采用可指人间奉差者的“使者”，语境中主要指先知
  alternative: 天使
  rationale: 上下文所说的是上帝在审判以前不断发出警告，历代志通常以先知承担这一使命；原词本身意为奉差遣者，译成“天使”会加入原文并未要求的天上使者解释。
- issue: 上帝怜惜“自己的居所”
  choice: 保留“居所”这一表达
  alternative: 明确译作“圣殿”
  rationale: 此处语境确实指耶路撒冷圣殿，但原文用的是较广的“居所”，借此把圣殿与上帝在子民中间的临在联系起来，正文不宜将其完全扁平化为建筑名称。
- issue: הַשְׁכֵּם וְשָׁלוֹחַ的表达
  choice: 正文译出反复且殷切差遣的惯用义
  alternative: 逐字译作“早起并差遣”
  rationale: 逐字形式在现代中文里容易被理解为上帝每天清早采取行动，遮蔽该希伯来惯用语所表达的持续、迫切和屡次差遣；脚注保存字面意象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将原因从句前置，使“因怜惜”清楚说明上帝反复传话的动机；以破折号标明同位语“他们列祖的上帝”。正文侧重传达希伯来惯用语的实际意义，同时用脚注保留其字面意象。
