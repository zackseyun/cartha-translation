  naturalness: 原译庄重自然。“屡次殷切地差遣自己的使者到他们那里”在现代标准汉语中流畅，也更直接对应原文的动词及其惯用语。
  terminology: “耶和华”“列祖的上帝”“使者”“子民”“居所”均恰当。“使者”应保留，不宜在脚注中断言其必然为先知；上下文支持人间使者的理解，但该词本身并不在本节明定其身份。
