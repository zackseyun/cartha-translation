revisions:
- from: 耶和华[a]—他们列祖的上帝—因怜惜自己的子民和自己的居所，便一次又一次地借他的使者[b]传话给他们。
  to: 耶和华[a]—他们列祖的上帝—屡次殷切地[b]差遣自己的使者到他们那里，因为他怜惜自己的子民和自己的居所。
  rationale: 修订以“差遣自己的使者到他们那里”对应“藉着他的使者向他们差遣”，不将隐含的信息内容明确化为“话”。将持续、迫切的惯用义译为“屡次殷切地”，并把脚注锚点移至该短语后。脚注仅说明惯用语，不对“使者”的具体身份作超过本节明示内容的断言。
