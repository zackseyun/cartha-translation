language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: zh_hans
  text: 祭司的众首领和百姓也都越来越背信，仿效[a]列国一切可憎的事，并且玷污了雅威[b]所分别为圣、在耶路撒冷的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仿效”也可译作“如同”或“照着”，即他们的行为与列国一切可憎的习俗相同。
    reason: 说明כְּכֹל所容许的比较与依照之语义范围。
  - marker: b
    text: “雅威”音译希伯来文神名“YHWH”；有些译本译作“耶和华”或以“主”代替。
    reason: 说明四字神名的译法。
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 承接上文，并表明祭司首领和百姓同样陷入罪恶；现代汉语中简洁自然。
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: 祭司的众首领和百姓
  rationale: 保留שָׂרֵי作为“首领”的含义，不将其处理为可能令人联想到后期专称的“祭司长”；同时按希伯来语结构，使“百姓”与“祭司的众首领”并列。
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: 都越来越背信
  rationale: 动词רבה的使役形与同根表达מעל共同加强语气，表示背信行为不断增多、加深；“越来越背信”在现代汉语中自然，也保留持续加剧的力度。
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: 仿效列国一切可憎的事
  rationale: 介词כ在此可表达相似或依照；“仿效”清楚传达其行为与列国可憎习俗一致。תּוֹעֵבָה译作“可憎的事”，保留其强烈的道德和宗教意味。
- source_word: וַיְטַמְּאוּ
  choice: 玷污了
  rationale: 在圣殿语境中兼具礼仪与道德上的污秽含义；“玷污”庄重且符合现代汉语表达。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת直译为“房屋”，但在此明确指圣殿；汉语用“殿”既准确又自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译四字神名，保留经文所用的上帝专名，而非以称号替代。
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: 在耶路撒冷分别为圣的
  rationale: הקדיש表示使之成圣、专用于神圣用途；“分别为圣”保留圣殿奉献与归属上帝的含义。关系从句的主语依上下文为雅威。
theological_decisions:
- issue: מָעַל所表达的盟约及敬拜层面的违信
  choice: 背信
  alternative: 不忠；干犯；行诡诈
  rationale: “背信”既表达对上帝忠诚关系的破坏，也不把含义局限于法律罪名；适合本节同时涉及百姓犯罪和玷污圣殿的语境。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，并以脚注说明。
- issue: 关系从句אֲשֶׁר הִקְדִּישׁ的主语
  choice: 理解为雅威将殿分别为圣
  alternative: 以不明说主语的被动式表达
  rationale: 希伯来语第三人称单数主语自然回指雅威；中文句式仍紧贴原文，没有引入殿由谁建造等额外信息。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“越来越背信”体现原文同根结构的加强作用；“可憎的事”“玷污”“分别为圣”保留本节浓厚的道德与圣殿语域。脚注标记[a]置于“背信”之后，但内容说明紧随其后的כְּכֹל短语之译法，以兼顾阅读流畅与原始脚注安排。
