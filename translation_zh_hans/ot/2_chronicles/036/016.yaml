source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: zh_hans
  text: 可是，他们不断嘲弄上帝的使者[a]，藐视他的话，讥诮他的先知，直到雅威向他的子民大发烈怒，以致再无补救的办法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“天使”；这里下文提到“他的先知”，因此语境更支持指上帝差遣的人。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“直到没有医治或补救”；也可理解为“直到无药可救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 不断
  rationale: 该动词与随后几个分词构成迂回表达，表示过去持续或反复发生的行为；“不断”自然传达其延续性。
- source_word: מַלְעִבִים
  choice: 嘲弄
  rationale: 表达以轻蔑态度戏弄、讥笑；“嘲弄”符合现代汉语，也保留原文责难的力度。
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: 上帝的使者
  rationale: מַלְאָךְ 可指“使者”或“天使”；本节与“他的先知”并列，语境更支持受上帝差遣的人。
- source_word: וּבוֹזִים דְּבָרָיו
  choice: 藐视他的话
  rationale: בזה 表示轻视、鄙弃；“藐视”保留了主动拒绝上帝言语的强烈意味。复数 דְּבָרָיו 直译为“他的话”。
- source_word: וּמִתַּעְתְּעִים בִּנְבִיאָיו
  choice: 讥诮他的先知
  rationale: 该动词表示带着嘲讽加以戏弄；“讥诮”与前面的“嘲弄”有所区别，同时保留修辞上的递进和庄重语体。
- source_word: עַד עֲלוֹת חֲמַת יְהוָה
  choice: 直到雅威……发烈怒
  rationale: עַד 加不定式表示行为持续至某一结果发生；חֵמָה 指强烈、炽烈的怒气，“发烈怒”在汉语中自然且有分量。
- source_word: בְּעַמּוֹ
  choice: 向他的子民
  rationale: 在“烈怒”语境中，介词 בְּ 标明怒气所针对的对象；汉语以“向……发烈怒”表达自然。
- source_word: עַד לְאֵין מַרְפֵּא
  choice: 到了无可挽救的地步
  rationale: מַרְפֵּא 可表示医治或补救；此处描述审判已无法逆转，“无可挽救”既自然又保留最终性。
theological_decisions:
- issue: “上帝的使者”的所指
  choice: 指上帝差遣的人，即先知性使者
  alternative: 上帝的天使
  rationale: 该词本身容许两种意义，但紧接着的平行短语“他的先知”强烈表明这里所指的是向百姓传话的人；脚注保留词汇上的另一可能。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“耶和华/主”代称
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，并与提供的项目决策一致。
- issue: “无可挽救”的含义
  choice: 审判局势到了没有补救办法的地步
  alternative: 没有医治；病入膏肓
  rationale: 保留 מַרְפֵּא 在“医治”和“补救”之间的语义张力，不将其限定为身体疾病，也不额外断言悔改在神学上绝无可能。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“不断……藐视……讥诮”保留三个持续性分词形成的层层推进；两个“直到”在汉语中调整为“直到……，到了……的地步”，避免生硬重复，同时保留原文从长期悖逆到烈怒、再到无法补救的结构。
