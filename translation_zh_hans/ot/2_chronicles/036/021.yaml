  text: לְ/מַלֹּ֤אות דְּבַר יְהוָה֙ בְּ/פִ֣י יִרְמְיָ֔הוּ עַד רָצְתָ֥ה הָ/אָ֖רֶץ אֶת שַׁבְּתוֹתֶ֑י/הָ כָּל יְמֵ֤י הָשַּׁמָּ/ה֙ שָׁבָ֔תָה לְ/מַלֹּ֖אות שִׁבְעִ֥ים שָׁנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: zh_hans
  text: 为要应验耶和华借耶利米所说的话[a]，直到这地得享它的安息[b][c]。在这地荒凉的日子里，它一直安息[d]，为要满了七十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借耶利米传达的话。”原文直译为“借耶利米的口”。
    reason: lexical_alternative
  - marker: b
    text: “得享”也可译为“接受了”或“补足了”；原文为复数“安息”，意思是这地得到了先前未曾得到的安息。
    reason: lexical_alternative
  - marker: c
    text: 这里呼应盟约中的警告：百姓流亡时，土地要得享安息（参利未记26:34–35）。
    reason: cross_reference
  - marker: d
    text: 或译：“歇息了。”希伯来文用同根词形成呼应：“它的安息……它安息了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: 应验／满了
  rationale: 该不定式在开头表示目的或结果，译作“应验”自然地表达耶和华的话成为事实；末尾同一词根与“七十年”连用，译作“满了”更符合现代汉语，同时保留“达到规定数目”的意思。
- source_word: דְּבַר יְהוָה
  choice: 耶和华……所说的话
  rationale: דָּבָר在先知预言实现的语境中指神所说的话；采用“所说的话”既自然，也保留话语得以应验的重点。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是现代汉语圣经传统中对四字神名最通行、最易识别的音译，而不是以“主”这一称号代替专名。
- source_word: בְּפִי יִרְמְיָהוּ
  choice: 借耶利米所说
  rationale: 希伯来文直译为“借耶利米的口”；正文采用自然汉语表达先知作为传话者的意思，并在脚注保留原文形象。
- source_word: רָצְתָה
  choice: 享足了
  rationale: 此处土地为主语、安息期为宾语，动词表示土地终于得到或享有先前未得的安息。“享足了”兼顾利未记26章的呼应和持续至满足的语意。
- source_word: אֶת שַׁבְּתוֹתֶיהָ
  choice: 它的安息期
  rationale: 复数指归给土地的安息，语境很可能涉及安息年；“安息期”保留复数概念的广度，避免把原文未明说的范围限定为每周安息日或仅仅安息年。
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: 在荒凉的那些日子里
  rationale: 表达土地处于荒凉状态的整个时期；“那些日子”自然地涵盖原文“所有日子”的持续意味。
- source_word: שָׁבָתָה
  choice: 守了安息
  rationale: 该动词可指停止、歇息，也与前面的“安息期”同根。“守了安息”在汉语中保留原文刻意的安息双关。
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: 直到满了七十年
  rationale: 原文表示七十年达到足数。加入“直到”使汉语句法清楚，并与全句所描写的荒凉持续时间相合。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用以色列之神的专名。正文用现代汉语读者最熟悉的专名形式“耶和华”，不以称号“主”取代；“雅威”则是另一种较接近学术重构发音的音译。
- issue: שַׁבְּתוֹתֶיהָ与שָׁבָתָה中的安息神学及文字呼应
  choice: 它的安息期……守了安息
  alternative: 它的安息年……歇息了
  rationale: 原文把名词“安息期”和同根动词“守安息／歇息”并置，使被掳期间土地所得的安息与盟约警告相连。正文保留这一呼应，同时用“安息期”避免过度限定复数名词的具体范围。
- issue: 土地作为有行动能力的主语
  choice: 这地享足……这地守了安息
  alternative: 土地得以休耕
  rationale: 希伯来文把土地拟人化为享受并遵守安息的主体。保留这种表达可维持经文的诗性和神学张力，不把它简化成纯农业现象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“为要应验”承接上文的历史叙述；“这地”明确指犹大之地。“安息期／守了安息”既让普通读者能够理解，也保留希伯来文的同根词呼应和土地拟人化。
