  text: 约哈斯登基时二十三岁[a]，在耶路撒冷作王三个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“是二十三岁之子。”这是希伯来语表达年龄的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: 二十三岁
  rationale: 希伯来语直译为“二十三岁之子”，是表达年龄的固定习语；现代汉语自然译为“二十三岁”。
- source_word: יוֹאָחָז
  choice: 约哈斯
  rationale: 采用现代中文圣经传统中通行、易辨识的人名译法。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 此处介词加不定式结构表示开始作王之时；“登基时”简洁自然，符合君王纪年公式。
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: 三个月
  rationale: 直接表达该王统治的时长；连接关系已由汉语分句自然体现。
- source_word: מָלַךְ
  choice: 作王
  rationale: 在君王纪年语境中表示执掌王权、在位；“作王”庄重而通俗。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词בְּ表示地点，译作“在耶路撒冷”准确自然。
