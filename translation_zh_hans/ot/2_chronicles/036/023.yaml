source:
  edition: WLC
  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: zh_hans
  text: “波斯王居鲁士如此说：‘天上的上帝耶和华[a]已把地上万国赐给我，又委派我在犹大的耶路撒冷为他建造殿宇。你们中间凡属他子民的，愿耶和华他的上帝与他同在[b]！让他上去[c]吧！’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文的上帝之名 יהוה（YHWH）；也常译作“雅威”，有些译本按传统写作“主”。
    reason: divine_name
  - marker: b
    text: 这句话也可理解为陈述：“耶和华他的上帝与他同在。”原文没有明说“愿”，但这里的语境较支持祝福、祝愿的语气。
    reason: alternative_reading
  - marker: c
    text: 即上耶路撒冷去。圣经惯用“上去”描述前往耶路撒冷，尤其是前往圣城敬拜。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留王室诏令的传信公式，同时符合现代汉语书面表达。
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: 波斯王居鲁士
  rationale: 采用现代中文通行译名，并以自然汉语语序表达王号。
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: 地上万国
  rationale: 准确表达广泛的地缘政治含义；“万国”是庄重且易懂的概括说法，并不机械指一万个国家。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名音译呈现四字神名，不以称号“主”替代。
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: 天上的上帝
  rationale: 自然表达希伯来语构词“诸天之上帝”，避免生硬的复数形式。
- source_word: וְהוּא פָקַד עָלַי
  choice: 又委派我
  rationale: 此处 פקד 表示把一项有权威性的任务交托给居鲁士；“委派”兼顾任命与使命，未过度强化为直接命令。
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: 为他建造殿宇
  rationale: בַיִת 字面为“房屋”，但在耶路撒冷为上帝建造的语境中明确指圣殿；“殿宇”既保留“居所/房宇”的意象，也使现代读者不误解为普通住宅。
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: 在犹大的耶路撒冷
  rationale: 以简洁自然的汉语保留耶路撒冷位于犹大的信息。
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: 你们中间凡属他子民的
  rationale: 原文句式压缩，מִן 具部分/归属意味；此译自然传达在场者中凡属于耶和华子民的人都可响应。
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: 愿耶和华他的上帝与他同在
  rationale: 上下文较支持祝愿语气；保留“他的上帝”与单数代词，以对应前面的每一位响应者。
- source_word: וְיָעַל
  choice: 让他上去吧
  rationale: 保留 עלה 表示上耶路撒冷的传统方向用语，也用“吧”体现此处许可、劝勉性的意愿语气。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文明确使用上帝的专名。采用简体中文圣经传统中最广为人知的“耶和华”，既显示其为专名，也避免用“主”抹去原文与 אֲדֹנָי 的区别；脚注说明其对应的希伯来神名。
- issue: בַיִת 在圣殿语境中的表达
  choice: 殿宇
  alternative: 房屋；圣殿
  rationale: “房屋”虽较直译，却容易使普通读者误解为住宅；“圣殿”清楚但把语境解释直接纳入正文。“殿宇”在两者之间，保留建筑和居所意象，又清楚指向敬拜建筑。
- issue: יְהוָה אֱלֹהָיו עִמּוֹ 的语气
  choice: 祝愿语气：“愿……与他同在”
  alternative: 陈述语气：“……与他同在”
  rationale: 希伯来语无显式动词，可作陈述，也可在诏令结尾理解为祝福。与随后“让他上去”相连时，祝愿语气更自然，但以脚注保留陈述读法。
translation_notes:
  register: 采用现代、庄重而易懂的诏令体。引号区分叙事引语与居鲁士的宣告；“如此说”“地上万国”“殿宇”等用语保留经文庄严感，但避免过度古雅。“上帝”用于 אֱלֹהִים，“耶和华”用于专名 יהוה，以维持词项区别。
