  source_fidelity: 译文准确传达了居鲁士宣告的主要成分：耶和华作为“天上的上帝”赐下地上万国，委派居鲁士在犹大的耶路撒冷为他建造殿宇，并向在场的耶和华子民发出带祝愿的上行呼召。“你们中间凡属他子民的”恰当地处理了压缩的 מִי בָכֶם מִכָּל עַמּוֹ，未不当缩窄或扩展其范围。
