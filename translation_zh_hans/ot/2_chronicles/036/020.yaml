base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became slaves to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: zh_hans
  text: 他把逃过刀剑的余民掳到巴比伦；他们就作他和他儿子们的奴隶[a]，直到波斯王国开始统治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希伯来词可指仆人，也可指奴隶；这里征服和被掳的语境更支持“奴隶”。
    reason: 保留 עֲבָדִים 的词义范围及语境判断。
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: 掳到
  rationale: 该词是 גלה 的使役用法，表示强迫人离乡流亡；“掳到”在征服与流亡的语境中自然地表达强制迁移。
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: 逃过刀剑的余民
  rationale: הַשְּׁאֵרִית 指剩余下来的人，מִן הַחֶרֶב 直译为“从刀剑”；合译为“逃过刀剑的余民”，既保留“余民”的经文意蕴，也清楚表达他们在杀戮中幸存。
- source_word: אֶל בָּבֶל
  choice: 到巴比伦
  rationale: 按其方向含义直译，符合现代汉语表达。
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: 他们就给他和他的儿子们作奴隶
  rationale: עֲבָדִים 可指仆人或奴隶；此处是战败、被掳并受帝王辖制的语境，“奴隶”更能体现其非自愿的从属身份。“他的儿子们”保留复数。
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: 直到波斯国掌权的时候
  rationale: 该短语从形式上指波斯王国开始或进入统治；“波斯国掌权”比把国家说成“作王”更合乎现代汉语，同时保留政权更替这一时间界限。
theological_decisions:
- issue: 征服和流亡语境中 עֲבָדִים 的身份含义
  choice: 奴隶
  alternative: 仆人／奴仆
  rationale: 该词本身涵盖仆役与奴隶，但本节所述之人是战败后被强制迁往巴比伦、归征服者及其后代支配的幸存者，因此正文采用“奴隶”；脚注保留词义上的另一种可能。
- issue: 波斯掌权所构成的历史界限
  choice: 直到波斯国掌权的时候
  alternative: 直到波斯国统治／波斯王国作王
  rationale: 希伯来文把“掌权”与“波斯王国”相连，重点是帝国统治的更替；译文不进一步断定具体指即位瞬间还是整个统治时期。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“余民”“刀剑”保留经文语体与意象；“掳到”“掌权”使事件关系清楚，避免生硬直译。
