  naturalness: “到了年头转换的时候”不够自然，且“年头”在现代汉语中容易被理解为年初，可能误导读者。改为“到了年岁轮转之时”既较自然庄重，也保留原文未限定具体季节的习语性。“派人把他带到”“立……作王”均自然合乎叙事体。
