base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: zh_hans
  text: 到了年岁轮转之时[a]，尼布甲尼撒王派人把他带到巴比伦，并把耶和华的殿中珍贵的器皿[b]一同带去；又立约雅斤的兄弟西底家[c]作王，统治犹大和耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一年返回（或转回）的时候”，即年岁轮转到相应时节；这里没有说明具体季节。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“耶和华的殿中贵重的器具”或“珍藏的器皿”。
    reason: lexical_alternative
  - marker: c
    text: 原文作“他的兄弟”，指约雅斤。这里的“兄弟”可宽泛指近亲；按王室谱系，西底家实际是约雅斤的叔父。
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: 到了年头转换的时候
  rationale: 原文直指一年“返回、转换”之时。这一译法保留时间习语及其一定程度的含混，不径自限定为“春天”。
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: 派人把他带到
  rationale: שָׁלַח 后接使役形态的 בוא，表示王差遣人将约雅斤带走；汉语用“派人把他带到”自然体现间接使役。
- source_word: בָבֶלָה
  choice: 到巴比伦
  rationale: 词尾的方向成分表示朝向巴比伦。
- source_word: כְּלֵי חֶמְדַּת
  choice: 珍贵的器皿
  rationale: כְּלֵי 在圣殿语境中可指器具、器皿；חֶמְדַּת 表示可珍爱、贵重，故译为“珍贵的器皿”。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: “殿”在现代汉语中比直译“房屋”更清楚地表达圣所语境，同时以“耶和华”对应神圣四字名。
- source_word: וַיַּמְלֵךְ
  choice: 立……作王
  rationale: 该使役形式意为使某人掌王权；“立……作王”简洁、庄重而自然。
- source_word: אָחִיו
  choice: 他的兄弟
  rationale: 正文保留希伯来语的亲属称谓，不在译文中直接改成更具体的“叔父”；历史亲属关系另以脚注说明。
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: 统治犹大和耶路撒冷
  rationale: עַל 在此标明王权所及范围；“统治”在汉语中明确表达作王管辖之意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。中文普通读者最熟悉且可辨识为专名的传统音译是“耶和华”；不以称号“主”代替专名。
- issue: אָחִיו 的亲属含义
  choice: 正文译“他的兄弟”，脚注说明西底家实际是约雅斤的叔父
  alternative: 正文直接译“他的叔父”或“他的亲属”
  rationale: 保留原文宽泛亲属词造成的张力，同时帮助读者理解历代志及相关王室谱系资料中的具体关系。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。“到了年头转换的时候”有意保留原文时间习语的含混；“派人把他带到”符合王命经代理人执行的汉语表达。脚注标记均紧随所说明的正文词组。
