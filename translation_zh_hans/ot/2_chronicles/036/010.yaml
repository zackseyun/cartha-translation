revisions:
- from: 到了年头转换的时候[a]，尼布甲尼撒王派人把他带到巴比伦，也把耶和华殿中珍贵的器皿[b]一同带去；又立他的兄弟西底家[c]作王，统治犹大和耶路撒冷。
  to: 到了年岁轮转之时[a]，尼布甲尼撒王派人把他带到巴比伦，并把耶和华的殿中珍贵的器皿[b]一同带去；又立约雅斤的兄弟西底家[c]作王，统治犹大和耶路撒冷。
  rationale: 修订仅改善现代汉语的自然度和指代清晰度，不改变原文含义。“年岁轮转之时”避免把习语误限为年初或春季；补出“约雅斤的”是为消除汉语代词歧义，脚注仍明确原文只写“他的兄弟”，并保留其宽泛亲属称谓及历史说明。
