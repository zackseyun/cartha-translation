source:
  edition: WLC
  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: zh_hans
  text: 所以，他使迦勒底人的王[a]上来攻击他们；这王在他们的圣殿里用刀杀了他们的青年男子，对青年男子、处女[c]、老人和年迈者都毫不怜惜[b]。上帝把一切都交在他手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巴比伦人的王”；希伯来文作“迦勒底人的王”。
    reason: lexical_alternative
  - marker: b
    text: 或译“毫不顾惜”或“并不饶恕”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文特指未婚的年轻女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: 他使……上来攻击他们
  rationale: 保留使役形的含义及军事语境中“上来攻击”的表达；主语依上文是上帝。
- source_word: מֶלֶךְ כשדיים
  choice: 迦勒底人的王
  rationale: 直接对应希伯来语“迦勒底人”；“巴比伦人的王”作为脚注中的通俗替代译法。
- source_word: וַיַּהֲרֹג בַּחוּרֵיהֶם בַּחֶרֶב
  choice: 这王……用刀杀了他们的青年
  rationale: 明确动作执行者是迦勒底人的王，并自然传达“用刀杀”的工具性短语；“青年”在此依上下文主要指青年男子。
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: 在他们的圣殿里
  rationale: “圣殿”自然简洁地表达“他们圣所的殿”，并保留杀戮发生于神圣场所的冲击力。
- source_word: וְלֹא חָמַל
  choice: 毫不怜惜
  rationale: חמל兼有因怜悯而饶恕、顾惜之意；“毫不怜惜”同时传达情感与行动层面的含义。
- source_word: בָּחוּר וּבְתוּלָה
  choice: 青年、处女
  rationale: 分别保留“青年男子”和“处女”的性别及婚姻状态含义；中文“青年”在并列语境中简洁自然。
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: 老人和年迈者
  rationale: 以两个近义称谓保留原文对高龄者的双重表述及修辞力度。
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: 上帝把一切都交在他手中
  rationale: “交在他手中”保留落入其权势之下的希伯来习语；“一切”保存原文 הַכֹּל 的范围开放性。
theological_decisions:
- issue: 开头和末句动词的主语
  choice: 在开头用“他”承接上文，在末句用“上帝”明确指称
  alternative: 两处都用“他”，或将末句译作无明确主语的表达
  rationale: 希伯来语第三人称单数主语由前文所述耶和华施行审判补足。末句若连续使用两个男性代词，现代汉语容易混淆“交付者”和迦勒底王；明确为“上帝”只消除指代歧义，不增加新的神学判断。
- issue: “一切”的所指范围
  choice: 保留“一切”，不限定为“所有人”或“所有东西”
  alternative: “把所有人都交在他手中”或“把一切所有的都交在他手中”
  rationale: 原文 הַכֹּל 本身可以概括前述众人，也可能带有更广的总体意味；保留“一切”避免过度限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用分号划分上帝兴起敌王与敌王实施杀戮两个紧密相连的动作；脚注标记均置于对应词句之后。
