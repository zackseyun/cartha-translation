  source_fidelity: 首句准确表达希伯来文使役式“立……为王”、统治范围及改名。末句“押到埃及”比 וַיְבִיאֵהוּ（带他到埃及）更强，加入了原文未明说的押解方式；“约雅敬的兄弟”虽可由上下文推知，但原文在改名前称以利亚敬，明示这一名称更贴近叙事顺序。
  naturalness: 整体庄重自然。将末句简化为“带到埃及”可避免“带走”与“押到”语义叠加，并保持现代汉语的简洁。
  terminology: 人名“以利亚敬、约雅敬、约哈斯、尼哥”及“犹大、耶路撒冷”均可接受，且前后一致。无需脚注。
  issues:
