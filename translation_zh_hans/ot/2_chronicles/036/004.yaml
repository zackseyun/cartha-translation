base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: zh_hans
  text: 埃及王立约哈斯的兄弟以利亚敬为王，统治犹大和耶路撒冷，又把他的名字改为约雅敬。尼哥把以利亚敬的兄弟约哈斯带到埃及。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: 立……作王
  rationale: מלך的使役式在此表示埃及王使以利亚敬登基，即立他为王，而非仅说他自行开始统治。
- source_word: אֶלְיָקִים אָחִיו
  choice: 约哈斯的兄弟以利亚敬
  rationale: “他的兄弟”承接上文所说的约哈斯；在中文中明示所指，可避免代词悬空，同时保留兄弟关系。
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: 统治犹大和耶路撒冷
  rationale: 介词עַל与立王语境结合，表示受任治理的范围；同时保留犹大及其都城耶路撒冷。
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ יְהוֹיָקִים
  choice: 把他的名字改为约雅敬
  rationale: 该表达指更改名字；此译法自然清楚，并体现改名是埃及王所施行的。
- source_word: לָקַח
  choice: 带走
  rationale: לקח基本义为“拿、带走”；本处涉及废王被送往埃及，“带走”既保持克制，也符合上下文。
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: 把他押到埃及
  rationale: 方向词尾表示往埃及去；约哈斯并非自愿前往，因此“押到”在中文中自然呈现被控制带往异国的语境。
- source_word: נְכוֹ
  choice: 尼哥
  rationale: 按希伯来文专名נְכוֹ音译，并采用现代中文圣经读者熟悉的形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。第二句保留希伯来文连接词的顺承关系，以“又”连接，不额外强化为转折。两处“兄弟”在中文中明确其所指，以避免孤立经节中的代词歧义；未加入原文没有的“法老”称号。
