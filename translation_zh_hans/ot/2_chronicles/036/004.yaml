    rationale: 原文先称以利亚敬，后说埃及王改其名为约雅敬；末句的“他的兄弟”自然承接以利亚敬。改作“以利亚敬的兄弟约哈斯”更贴近原文叙事次序，也消除指代层面的轻微延后。
