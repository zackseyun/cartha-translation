  text: בֶּן שְׁמוֹנֶ֤ה שָׁנִים֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֤ה חֳדָשִׁים֙ וַ/עֲשֶׂ֣רֶת יָמִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: zh_hans
  text: 约雅斤登基时八岁[a]，在耶路撒冷作王三个月零十天。他行耶和华眼中看为恶的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 列王纪下24:8记作“十八岁”，而不是“八岁”。
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: 八岁
  rationale: 这是希伯来语表达年龄的惯用语；现代汉语自然译为“八岁”，并按马所拉文本保留此数值。
- source_word: יְהוֹיָכִין
  choice: 约雅斤
  rationale: 采用现代中文圣经中通行且易辨识的人名译法。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 该结构标明开始作王时的年龄；“登基时”简洁自然，符合中文王朝叙事语体。
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: 三个月零十天
  rationale: 准确表达作王时长；“零”符合现代汉语连接月数与日数的习惯。
- source_word: מָלַךְ
  choice: 作王
  rationale: 这是王朝纪年的常见中文表达，准确对应“统治、为王”。
- source_word: בִּירוּשָׁלָם
  choice: 在耶路撒冷
  rationale: 直接表达地点，并保留原文中与作王动词的关系。
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 与后面的“在……眼中”合译，既保留原文的道德评价公式，也使现代中文通顺。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的意象，同时采用自然、庄重的中文固定表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的四字神名音译，明确呈现专名而非以“主”这一称号替代。
theological_decisions:
- issue: 与列王纪下24:8所载登基年龄存在年代差异
  choice: 正文依WLC马所拉文本译作“八岁”
  alternative: 列王纪下24:8作“十八岁”
  rationale: 忠实保留所给原文的读法，不在正文中暗自协调平行经文；显著差异以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。王朝纪年使用“登基”“作王”；末句保留希伯来文神圣评价公式的意象。
