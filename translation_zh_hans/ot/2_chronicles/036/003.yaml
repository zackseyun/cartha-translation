base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: zh_hans
  text: 埃及王在耶路撒冷废黜了他[a]，又向这地征收罚金：一百他连得银子和一他连得金子[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “废黜了他”或译“把他带走”；希伯来语动词既可指撤去某人的职位，也可指将他带离原处。
    reason: alternative_reading
  - marker: b
    text: “向这地征收罚金”或译“罚这地缴纳”；原文动词表示课以金钱处罚。
    reason: lexical_alternative
  - marker: c
    text: “他连得”是古代的大重量单位；正文保留原有度量名称，不换算成现代单位。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: 废黜了他
  rationale: 使役形在君王更替的语境中表示将约哈斯从王位上撤下。“废黜”自然明确；脚注保留“把他带走”的语义可能。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: 埃及王
  rationale: 按希伯来语属格结构简洁直译，不补入本节未出现的法老姓名。
- source_word: בִּירוּשָׁלָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 在此最自然地表示事件发生的地点。
- source_word: וַיַּעֲנֹשׁ
  choice: 罚……缴纳
  rationale: ענשׁ 在所列金额的语境中指课以金钱处罚。“罚……缴纳”兼顾惩罚性质和财物征收，避免把它直接解释为一般性的贡赋。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 此处指犹大国土及其民众；“这地”保留 אָרֶץ 的历史叙事措辞。
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: 一百他连得银子
  rationale: 保留古代重量单位 כִּכָּר，以传统中文音译“他连得”表达，不在正文中作不确定的现代重量换算。
- source_word: וְכִכַּר זָהָב
  choice: 和一他连得金子
  rationale: 保留与前项相同的重量单位，并准确呈现原文单数。
