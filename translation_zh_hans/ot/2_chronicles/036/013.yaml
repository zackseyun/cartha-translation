id: 2CH.36.13
reference: 2 Chronicles 36:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/גַם בַּ/מֶּ֤לֶךְ נְבֽוּכַדְנֶאצַּר֙ מָרָ֔ד אֲשֶׁ֥ר הִשְׁבִּיע֖/וֹ בֵּֽ/אלֹהִ֑ים וַ/יֶּ֤קֶשׁ אֶת עָרְפּ/וֹ֙ וַ/יְאַמֵּ֣ץ אֶת לְבָב֔/וֹ מִ/שּׁ֕וּב אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: zh_hans
  text: 他也背叛了尼布甲尼撒王[a]；尼布甲尼撒王曾使他指着上帝起誓。他硬着颈项[b]，使自己的心刚硬，不肯回转归向耶和华——以色列的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他指着上帝起誓”也可译为“使他在上帝面前立誓”。这里可强调起誓所凭的上帝，也可强调誓约与上帝有关的庄严情境。
    reason: lexical_alternative
  - marker: b
    text: “硬着颈项”是希伯来语的形象说法，表示顽梗、抗拒，不肯顺服。
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: 他也
  rationale: 承接上文并表达递进或附加关系；补出主语符合现代汉语叙事习惯。
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: 背叛了尼布甲尼撒王
  rationale: מָרַד 与介词 ב 连用，表示反叛某位统治者；“背叛”既能涵盖政治反叛，也与违背誓约的语境相合。
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵאלֹהִים
  choice: 这王曾使他指着上帝起誓
  rationale: 使役式 הִשְׁבִּיעוֹ 表示“使他起誓”；“指着上帝”直接表达 בֵאלֹהִים 所标明的起誓凭据，同时保留其也可能指在上帝面前立誓的空间。
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: 硬着颈项
  rationale: 保留希伯来语“使颈项刚硬”的形象，表达顽梗抗拒；该意象在圣经语境中具有连贯性。
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: 固执己心
  rationale: אָמֵץ 本可表示使之刚强；在拒绝回转的负面语境中，指内心变得坚决顽固。“固执己心”既传达语境义，又避免与前句重复使用“硬”。
- source_word: מִשּׁוּב אֶל
  choice: 不肯回转归向
  rationale: 介词 מִן 加不定式在此表达阻止、拒绝或远离某行动；汉语“不肯”自然呈现其顽固拒绝回转的结果，同时“回转归向”保留 שׁוב 与 אֶל 的方向性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，并与本节的“上帝”区分。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 自然表达希伯来语属格结构，并保留其盟约身份指称。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名；译作“耶和华”保留专名性质，也符合普通现代中文读者较熟悉的传统用法，不将其泛化为头衔。
- issue: מִשּׁוּב 所表达的拒绝回转
  choice: 不肯回转归向
  alternative: 不再归向；以致不归向；拒绝归向
  rationale: 原文可表达从回转中退缩、阻止回转或拒绝回转。这里用“不肯”保留主观顽梗的语境，却不进一步规定关于悔改能力或因果次序的神学解释。
- issue: “心”变得刚强的道德含义
  choice: 固执己心
  alternative: 使自己的心刚硬；坚定自己的心
  rationale: 动词本义可偏中性地指“使刚强”，但与硬着颈项及拒绝归向耶和华并列时明显带负面含义；“固执”传达这种语境意义而不额外推断上帝与人的因果关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“硬着颈项”有意保留原文意象，并用脚注解释；“固执己心，不肯回转归向”使句意对普通读者清楚。分号和破折号用于理清较长的希伯来语复句，并突出“耶和华——以色列的上帝”的同位关系。
