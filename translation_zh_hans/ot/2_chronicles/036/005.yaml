  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: zh_hans
  text: 约雅敬登基时二十五岁，在耶路撒冷作王十一年。他行耶和华他上帝眼中看为恶的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: 二十五岁
  rationale: 这是希伯来语表达年龄的惯用语，现代汉语自然译为“二十五岁”。
- source_word: יְהוֹיָקִים
  choice: 约雅敬
  rationale: 采用现代中文圣经中通行且易于辨认的人名译法。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 介词 בְּ 加不定式结构在此表示即位的时间；“登基时”简洁自然，并符合君王纪年语境。
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: 作王十一年
  rationale: מָלַךְ 表示作王、统治；中文王朝叙事中“作王十一年”自然且准确。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按其地点含义直接翻译。
- source_word: וַיַּעַשׂ הָרַע
  choice: 他做……看为恶的事
  rationale: 保留“做”这一动词及道德评价；与后面的“眼中”结构组合成自然中文。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在某人眼中”的评价视角，同时以“看为”使现代汉语通顺。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用中文长期通行的专名“耶和华”对应四字神名，使其保持为神的名字，而非以“主”这一称号替代。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 准确保留第三人称阳性单数所属后缀，指出耶和华是约雅敬的上帝。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。现代中文里“耶和华”是广为人知的专名形式，可保留其作为名字的功能；“雅威”更接近学界常见的拟音，但在普通中文读者中通行度较低。
- issue: אֱלֹהָיו 所表达的关系
  choice: 他的上帝
  alternative: 上帝
  rationale: 保留原文所属后缀，不淡化约雅敬对“他的上帝”所负的责任，也不进一步解释这种关系的性质。
translation_notes:
  register: 采用简洁、庄重而现代的历史叙事语体。“登基”“作王”符合君王纪年公式；句末保留原文的评价性表达及“他的上帝”这一张力。
