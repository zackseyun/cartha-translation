base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: zh_hans
  text: 于是，国中的百姓[a]选了约西亚的儿子约哈斯，在耶路撒冷立他接替父亲作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“当地的民众”。希伯来语“国中的百姓”可以泛指当地居民，在某些语境中也可指其中一个特定的社会群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 选了
  rationale: לקח在这里指百姓选定并拥立约哈斯；译作“选了”符合现代汉语叙事，也不加入“抓住”所暗示的强制意味。
- source_word: עַם הָאָרֶץ
  choice: 国中的百姓
  rationale: 保留“这地之民”的地域含义，同时用自然的现代汉语表达；该词组也可能特指民众中的某一社会群体，故附注说明。
- source_word: יְהוֹאָחָז
  choice: 约哈斯
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: 约西亚的儿子
  rationale: 直接、自然地表达父子关系。
- source_word: וַיַּמְלִיכֻהוּ
  choice: 立他……作王
  rationale: 准确体现מלך使役式“使某人成为王”的含义，不加入原文未提及的加冕礼仪。
- source_word: תַחַת אָבִיו
  choice: 接替父亲
  rationale: תחת在此表示王位上的替代和继承，而非空间意义上的“在……之下”。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 自然对应介词ב与地名，并按汉语语序置于“立他”之后。
