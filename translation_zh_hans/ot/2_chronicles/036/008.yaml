  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהֽוֹיָקִ֜ים וְ/תֹֽעֲבֹתָ֤י/ו אֲשֶׁר עָשָׂה֙ וְ/הַ/נִּמְצָ֣א עָלָ֔י/ו הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר מַלְכֵ֥י יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: zh_hans
  text: 约雅敬其余的事迹、他所行的可憎之事，以及查出对他不利的事[a]，看哪，这些都记载在《以色列和犹大诸王记》上。他儿子约雅斤继位作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“查明与他有关的事。”希伯来语这一表达可以泛指所发现的有关约雅敬的事；本节的负面语境也容许理解为“查出对他不利的事”。
    reason: 保留 וְהַנִּמְצָא עָלָיו 在“有关他”与“对他不利”之间的词义歧义。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: 约雅敬其余的事迹
  rationale: 王室史料总结语中的 דִּבְרֵי 不仅指“话”，也指一位君王在位期间的事迹；“其余的事迹”自然保留这一惯用表达。句首连接词 וְ 不必机械译成“现在”，其承接作用由上下文体现。
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: 他所行的可憎之事
  rationale: תֹּעֵבָה 带有强烈的道德或敬拜层面的负面评价；“可憎之事”既保留力度，也符合现代中文圣经叙事语体。
- source_word: וְהַנִּמְצָא עָלָיו
  choice: 以及查出对他不利的事[a]
  rationale: נמצא על 可表示发现有关某人的事，也可在此负面语境中带有“查出对他不利之事”的意味。正文采用较符合语境的理解，并用脚注保留较中性的可能。
- source_word: הִנָּם כְּתוּבִים
  choice: 看哪，都记在……上
  rationale: הִנָּם 是引人注意的指示语，“看哪”保留其强调作用；כְּתוּבִים 直译为“记在”，适合史料引证公式。
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: 《以色列和犹大诸王记》
  rationale: 按一部被引用史籍的名称处理，以书名号标示，同时保留“以色列和犹大诸王”的希伯来语结构。
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: 他儿子约雅斤接续他作王
  rationale: וַיִּמְלֹךְ 表示登基并作王，תַּחְתָּיו 表示取代前王、继承王位；“接续他作王”简明自然地表达这一继位公式。
theological_decisions:
- issue: וְהַנִּמְצָא עָלָיו 所指内容的性质
  choice: 正文译为“查出对他不利的事”，依照可憎之事的负面语境理解，但不具体断定为法律指控或某类罪行。
  alternative: “查明与他有关的事”或“在他身上所发现的事”。
  rationale: 希伯来语本身未明确说明所发现的具体内容；正文反映语境中的不利意味，脚注则保留较宽泛的语义，避免把它神学化或法律化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”略带经典文体色彩，用来保留原文 הִנָּם 的提示和强调功能；其余措辞避免不必要的古雅表达。
