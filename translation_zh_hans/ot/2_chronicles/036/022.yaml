  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה בְּ/פִ֣י יִרְמְיָ֑הוּ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: zh_hans
  text: 波斯王居鲁士元年，为要使耶和华借耶利米之口所说的话得以应验，耶和华激动了波斯王居鲁士的心[a]。他就在全国各地发布通告，也以书面形式发布，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心”原文作“灵”，这里指人的内在意向或行动动力。
    reason: 说明 רוּחַ 的字面形式及其在此语境中的含义，同时保留词语的语义张力。
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: 波斯王居鲁士元年
  rationale: 采用现代汉语常见的君王纪年格式；句首的 waw 在此承担叙事衔接作用，无须机械译出“于是”。
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: 为要使耶和华……所说的话得以应验
  rationale: 不定式在语境中表示目的或结果；与上帝先前所说之话搭配时，“应验”自然表达其达到预告的成全。
- source_word: בְּפִי יִרְמְיָהוּ
  choice: 借耶利米之口
  rationale: 保留希伯来语“借……之口”的先知传言意象，同时符合庄重、清楚的现代汉语。
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כֹּרֶשׁ
  choice: 耶和华激动了……居鲁士的心
  rationale: רוּחַ 此处指人的内在意向和行动动力；汉语“激动……的心”保留神促使君王行动的含义，也避免误读为独立灵体。
- source_word: וַיַּעֲבֶר קוֹל בְּכָל מַלְכוּתוֹ
  choice: 他便通告全国
  rationale: 该习语字面为“使声音传遍”，实际指向全境发布公告；“通告全国”简洁自然。
- source_word: וְגַם בְּמִכְתָּב
  choice: 并且写下诏令
  rationale: 明确公告不仅口头传达，也形成书面文件；鉴于发令者为君王，“诏令”符合语境。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 按汉语直接引语的常规格式译出，并以冒号引出下一节内容。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用普通简体中文读者最熟悉且可辨识为专名的传统译名；不以“主”替代，以保留原文神名。
- issue: רוּחַ כֹּרֶשׁ 的理解
  choice: 居鲁士的心
  alternative: 居鲁士的灵
  rationale: 此处强调上帝激发居鲁士的内在意愿，使他采取行动；“心”在现代汉语中更自然，但脚注保留“灵”的形式对应，避免抹去原词的语义张力。
- issue: לִכְלוֹת 的目的与结果关系
  choice: 为要使……得以应验
  alternative: 于是……得以应验
  rationale: לְ 加不定式可表达目的或结果；正文采用目的表达，但“得以”也容纳实际结果，不进一步断定居鲁士是否主观知道这一神圣目的。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“波斯王居鲁士元年”使用汉语纪年习惯；“借耶利米之口”有意保留原文意象；以“通告全国，并且写下诏令”清楚呈现口头传告与书面颁布两个层面。
