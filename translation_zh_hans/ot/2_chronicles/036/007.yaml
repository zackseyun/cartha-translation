base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: zh_hans
  text: 尼布甲尼撒又把耶和华殿中的一些器皿带到巴比伦，放在他在巴比伦的殿宇里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”所译的希伯来词可指神庙，也可指宫殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִכְּלֵי
  choice: 又把……一些器皿
  rationale: וּ承接上文并有附加意味；מִן在此具部分义，表示器皿中的一部分。译作“又把……一些器皿”既明确部分义，也符合现代汉语叙事。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: בֵּית字面为“家、房屋”，在此指敬拜场所；汉语“耶和华殿”自然、庄重，同时保留原文表达的核心意象。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，避免用一般称号取代专名。
- source_word: הֵבִיא
  choice: 带到
  rationale: בוא的使役式在这里表示使物品来到某地；“带到”清楚表达把器皿运往巴比伦的动作和终点。
- source_word: נְבוּכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: לְבָבֶל
  choice: 到巴比伦
  rationale: 介词לְ标明动作的目的地。
- source_word: וַיִּתְּנֵם
  choice: 放在
  rationale: נתן在此表示安放或置于某处；“放在”是自然、准确的现代汉语。
- source_word: בְּהֵיכָלוֹ
  choice: 在他的殿宇里
  rationale: הֵיכָל可指神庙，也可指宫殿。正文采用较为中性的“殿宇”，不在正文中强行消除词义歧义；“他的”对应第三人称阳性单数后缀。
- source_word: בְּבָבֶל
  choice: 位于巴比伦的
  rationale: 介词בְּ表示地点。调整为定语结构，可避免连续两个“在”造成拗口，同时保留地点信息。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列上帝的专名。中文正文采用广为人知且具有专名功能的“耶和华”；“雅威”是较贴近学术重构读音的另一种译法，但不必借此解决原文未涉及的问题。
- issue: הֵיכָל所指建筑的性质
  choice: 殿宇
  alternative: 神庙；宫殿
  rationale: 该词本身可指神庙或宫殿。器皿来自耶和华殿，使“神庙”在语境中颇有可能，但仅凭本节仍不宜完全排除“宫殿”；因此正文保留歧义，并用脚注列明两种具体理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“耶和华殿”简洁保留原文“耶和华的房屋”之意；末句用“位于巴比伦的殿宇”使汉语顺畅，并通过脚注保存הֵיכָל的真实词义歧义。
