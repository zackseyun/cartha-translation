base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: zh_hans
  text: 他们焚烧上帝的殿[a]，拆毁耶路撒冷的城墙，用火烧毁城中所有的宫殿，并毁坏其中一切珍贵的器物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“上帝的家”，这里指上帝的圣殿。
    reason: lexical_alternative
  - marker: b
    text: “珍贵的器物”也可译作“珍藏的物件”或“可喜爱的物品”。希伯来文所指范围较广，不必只限于圣殿器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: 他们焚烧
  rationale: 这是 שׂרף 的 Qal 叙事形式，表示“烧、焚烧”；动词的第三人称阳性复数词形提供了“他们”这一主语。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: 希伯来文直译为“上帝的家”，在本处明确指圣殿；译作“殿”既保留“房屋、居所”的表达，又符合现代汉语对圣殿建筑的称呼。
- source_word: וַיְנַתְּצוּ
  choice: 拆毁
  rationale: נתץ 常指拆除或摧毁建筑结构；“拆毁”与宾语“城墙”搭配自然，也保留动作的具体性。
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: 耶路撒冷的城墙
  rationale: 按希伯来文单数结构译出；这里的单数整体指环绕城市的防御城墙。
- source_word: אַרְמְנוֹתֶיהָ
  choice: 城中所有的宫殿
  rationale: אַרְמוֹן 可指宫殿、堡垒或宏伟坚固的建筑；“宫殿”是本处的常见含义。阴性单数后缀所指的是耶路撒冷，故以“城中”清楚表达。
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: 用火烧毁
  rationale: 原文明确有“用火”这一成分；译文保留其强调，同时用“烧毁”表达焚烧造成的结果。
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: 其中一切珍贵的器物
  rationale: כְּלִי 可泛指器具、物件或器皿，מַחֲמַד 表示可喜爱、贵重或珍藏之物；“珍贵的器物”兼顾价值含义与具体物品的性质，不把范围限定为祭祀器皿。
- source_word: לְהַשְׁחִית
  choice: 毁坏
  rationale: 这是 שׁחת 的 Hifil 不定式，表示使之败坏、毁灭。此处承接前面的叙事动作，现代汉语以并列谓语“毁坏”自然表达其目的或结果。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文连续的毁城动作和两次焚烧的表达；以“城中”“其中”明确阴性代词后缀所指的耶路撒冷，并避免汉语中连续使用“它的”所造成的生硬感。
