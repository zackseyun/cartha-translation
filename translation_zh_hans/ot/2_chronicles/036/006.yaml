  text: Nebuchadnezzar king of Babylon came up against him and bound him with bronze chains to take him to Babylon[a].
translation:
  language: zh_hans
  text: 巴比伦王尼布甲尼撒上来进犯他，用铜制镣铐把他锁住，要把他带到巴比伦去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用铜链”或“用铜制脚镣”。希伯来文指套在他身上的铜制束缚器具。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: 上来攻打他
  rationale: 该军事语境中的习语表示向某人进军、与其敌对；“上来攻打他”既保留“上来”的方向意象，也自然表达敌对行动。
- source_word: נְבוּכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中广为人知的标准人名译法。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 简洁、自然地表达附加于人名的王室头衔。
- source_word: וַיַּאַסְרֵהוּ
  choice: 捆住他
  rationale: 原词基本义为捆绑或拘束，尤可用于俘虏；此译法直接对应下文的铜制刑具。
- source_word: בַּנְחֻשְׁתַּיִם
  choice: 用铜链
  rationale: 该词指铜制的束缚器具，形态可能是链、镣或铐；正文采用通顺易懂的“铜链”，脚注保留具体形态的不确定性。
- source_word: לְהֹלִיכוֹ
  choice: 要把他带到
  rationale: 使役形式表示使他前往；在俘虏被押送的语境中，“把他带到”自然准确。
- source_word: בָּבֶלָה
  choice: 巴比伦去
  rationale: 词尾方向标记表示朝向巴比伦；中文以“到巴比伦去”清楚表达目的地。
