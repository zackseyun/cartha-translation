  text: Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem.
translation:
  language: zh_hans
  text: 西底家登基时二十一岁，在耶路撒冷作王十一年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: 二十一岁
  rationale: 希伯来语“בֶּן＋数词＋שָׁנָה”是表示年龄的惯用结构，现代汉语自然译为“二十一岁”。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְמָלְכוֹ
  choice: 登基时
  rationale: בְ 加动词不定式结构在此表示即位的时间；“登基时”简洁、自然，并明确表达开始作王。
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: 十一年
  rationale: 数词与“年”表示作王持续的时间。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词指担任君王并施行王权；“作王”是庄重而通行的中文表达。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בְ 表示地点，地名采用现代中文通行译名。
