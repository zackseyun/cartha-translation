    rationale: “他行雅威他神眼中看为恶的事”应有“在”，并应将“他的神”与“雅威”的同位关系清楚标示。
  - severity: medium
    issue: 末句未直接表明“从雅威口中”修饰耶利米说话
    rationale: 原文的 מפי יהוה 与“先知耶利米”相连，宜译明耶利米奉雅威之命说话，而非仅称其所传达的内容为雅威亲口所说。
  - severity: low
    issue: “谦卑自己”不够合乎现代汉语习惯
    rationale: “在……面前自卑”在此语境中自然地表达其不肯谦卑、屈服的意思，且不额外限定其具体行动。
  revised_text: 他行雅威——他的神——眼中看为恶的事；他也不在奉雅威之命说话的先知耶利米面前自卑。[a]
  revised_footnotes:
