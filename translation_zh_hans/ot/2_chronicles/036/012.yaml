  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: zh_hans
  text: 他行雅威——他的神——眼中看为恶的事；他也不在奉雅威之命说话的先知耶利米面前自卑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从雅威口中。”
    reason: 原文此语修饰先知耶利米说话，保留先知的话语出自雅威的“口”的意象。
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 采用自然的现代汉语表达希伯来语常见的道德评判句式，同时保留“行”的动作含义。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在某人眼中”的视角性表达，又使中文句法自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名作为专名音译，而不以“主”这一称号替代。
- source_word: אֱלֹהָיו
  choice: 他神
  rationale: 保留第三人称所属关系，突出西底家对自己的神所负的责任。
- source_word: לֹא נִכְנַע
  choice: 不……谦卑自己
  rationale: 此处尼法勒词干在上下文中具有反身或中动态含义，指他拒绝自卑，而非单纯被动地“没有被降卑”。
- source_word: מִלִּפְנֵי
  choice: 在……面前
  rationale: 直接表达他面对先知耶利米时本应有却没有表现出的谦卑。
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: 先知耶利米
  rationale: 采用中文通行人名，并明确保留其先知身份。
- source_word: מִפִּי יְהוָה
  choice: 雅威亲口所说的话
  rationale: 保留原文“从雅威口中”的鲜明意象，并将其与耶利米传话的职分清楚连接。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，避免以称号“主”取代。
- issue: מִפִּי יְהוָה 与“先知耶利米”的关系
  choice: 解释为耶利米所传的话来自雅威亲口所说
  alternative: 直译为“从雅威口中”，不补出“传达”关系
  rationale: 希伯来语表达简练，语义上表明耶利米传达雅威的话；译文补足中文所需的句法关系，同时用脚注保留原文形式。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留“眼中”“亲口”等原文意象，同时以分号理清两个分句及先知传话的关系。
