base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: zh_hans
  text: 他把上帝的殿中所有的器皿，无论大小，以及雅威的殿的财宝[a]、王和他的官员的财宝[b]，全都带到了巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财宝”或译“宝库”；这个希伯来词既可指储藏的贵重物品，也可指储藏它们的库房。
    reason: lexical_alternative
  - marker: b
    text: “财宝”或译“宝库”；这个希伯来词既可指储藏的贵重物品，也可指储藏它们的库房。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל כְּלֵי בֵּית הָאֱלֹהִים
  choice: 上帝殿里所有的器皿
  rationale: כְּלֵי 在圣殿遭掳的语境中泛指礼仪用具及各类物件；“器皿”既保留传统经文语感，也不过度限定具体种类。בֵּית הָאֱלֹהִים 译为“上帝殿”，自然表达其指圣殿之意。
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: 无论大小
  rationale: 这一对举涵盖大小不同的器皿；“无论大小”在现代汉语中自然，并保留无一遗漏的含义。
- source_word: וְאֹצְרוֹת בֵּית יְהוָה
  choice: 以及雅威殿里的财宝
  rationale: אֹצְרוֹת 可指宝物，也可指宝库；因这些东西被带往巴比伦，正文采用可搬运的“财宝”。בֵּית יְהוָה 以自然汉语译作“雅威殿”。
- source_word: וְאֹצְרוֹת הַמֶּלֶךְ וְשָׂרָיו
  choice: 王和他官员的财宝
  rationale: שָׂרָיו 泛指王属下有权位的人；“官员”比“王子”范围更准确，也符合现代汉语。
- source_word: הַכֹּל הֵבִיא בָבֶל
  choice: 全都带到巴比伦去了
  rationale: הַכֹּל 回指前述全部物品；“全都”体现总结性强调。הֵבִיא 为单数，主语承接上下文中的尼布甲尼撒，中文用“他”表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”作为较贴近学界通行重构读音的音译，不以称号替代专名；同时保留本节“上帝”与“雅威”两种原文称谓的区别。
- issue: בֵּית הָאֱלֹהִים 与 בֵּית יְהוָה 的关系
  choice: 分别译为“上帝殿”和“雅威殿”
  alternative: 两处统一译为“上帝的殿”或“圣殿”
  rationale: 两者在所指上是同一座圣殿，但原文有意采用不同神称；译文不将其无声统一，以保留原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“无论大小……全都”保留原文列举后总结的节奏；句末“去了”使“带到巴比伦”的动作在现代汉语中更自然。所有脚注标记均置于其所说明的词语之后。
