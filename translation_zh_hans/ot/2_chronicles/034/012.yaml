base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: zh_hans
  text: 这些人都忠实地做工。受派管理他们的，有米拉利子孙中的利未人雅哈特和俄巴底亚，也有哥辖族人中的撒迦利亚和米书兰；他们负责监督[a]。还有所有精通乐器[b]的利未人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“指挥”。这里的希伯来语动词可指督导性的领导。
    reason: lexical_alternative
  - marker: b
    text: 直译“所有懂得歌唱用的器具的（人）”；意思是所有熟练使用乐器的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: 忠实地
  rationale: 该名词在这里作方式状语，表示工人办事可靠、尽责，而不是指主观上的“相信”。
- source_word: בַּמְּלָאכָה
  choice: 做工
  rationale: מְלָאכָה在语境中指圣殿修缮工程；与עֹשִׂים合译为“做工”，符合现代汉语表达。
- source_word: מֻפְקָדִים
  choice: 受派管理
  rationale: 保留Hophal分词“被委派”的被动含义，同时清楚表达这些人受命负责管理工人。
- source_word: יַחַת וְעֹבַדְיָהוּ
  choice: 雅哈和俄巴底亚
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: מִן בְּנֵי מְרָרִי
  choice: 米拉利子孙中的
  rationale: 保留原文的宗族和谱系表达，同时使汉语自然。
- source_word: זְכַרְיָה וּמְשֻׁלָּם
  choice: 撒迦利亚和米书兰
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: 哥辖族人中的
  rationale: 原文使用哥辖族的族称；译文以自然汉语表达其宗族归属，避免生硬的“哥辖族人的子孙”。
- source_word: לְנַצֵּחַ
  choice: 负责监督
  rationale: 在圣殿修缮的行政语境中，此词表示督导、指挥工程；“负责监督”既贴合语境，也保留其管理职能。
- source_word: כָּל מֵבִין
  choice: 所有精通……的
  rationale: מֵבִין在此表示实际技能和熟练程度，不只是抽象的理解。
- source_word: בִּכְלֵי שִׁיר
  choice: 乐器
  rationale: 字面为“歌唱的器具”，实际指用于音乐或歌唱伴奏的器具；“乐器”简明自然。
theological_decisions: []
