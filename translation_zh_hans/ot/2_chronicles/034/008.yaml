  source_fidelity: “为要洁净”在孤立语法上可成立，但在本章叙事中，约西亚此前已洁净这地和圣殿；此处的 לְטַהֵר 更适合译为该行动完成后的时间／背景关系。正文采用目的义会令人以为差派官员的目的在于洁净，而非修缮圣殿，因而偏离上下文及英语审校轨迹。
  naturalness: 人名及整体句式自然庄重。“城里的长官”可简化为更凝练的“城的长官”。“耶和华他上帝的殿”虽可理解，但“他上帝耶和华的殿”在现代汉语中关系更清楚。
  terminology: “圣殿”“长官”“史官”“修缮”均可用；保留通行人名和“耶和华”。将“他上帝耶和华”置于“殿”之前，既保留 אֱלֹהָיו（他的上帝），也避免其修饰范围含混。
