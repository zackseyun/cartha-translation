  text: וּ/בִ/שְׁנַ֨ת שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ לְ/מָלְכ֔/וֹ לְ/טַהֵ֥ר הָ/אָ֖רֶץ וְ/הַ/בָּ֑יִת שָׁ֠לַח אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֜הוּ וְ/אֶת מַעֲשֵׂיָ֣הוּ שַׂר הָ/עִ֗יר וְ֠/אֵת יוֹאָ֤ח בֶּן יֽוֹאָחָז֙ הַ/מַּזְכִּ֔יר לְ/חַזֵּ֕ק אֶת בֵּ֖ית יְהוָ֥ה אֱלֹהָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: zh_hans
  text: 约西亚在位第十八年，洁净了这地和圣殿以后[a]，他派亚萨利雅的儿子沙番、城的长官玛西雅，以及约哈斯的儿子、史官约亚，去修缮他上帝耶和华的殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可译作“为要洁净这地和圣殿”。
    reason: 原文 לְ 加不定式在语法上可表目的；但按本章前文已述的洁净行动及本节叙事顺序，正文译为完成后的时间／背景关系。
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: 约西亚在位第十八年
  rationale: 采用现代汉语常用的君王纪年表达；主语由本段明确的上下文补出，使句子自然清楚。句首 וּ־ 主要承接叙事，不另译为“现在”。
- source_word: לְטַהֵר הָאָרֶץ וְהַבָּיִת
  choice: 为要洁净这地和圣殿
  rationale: לְטַהֵר 的不定式可表达目的；本节此前叙事虽已记述洁净行动，但原文并未明示“完成以后”。הַבַּיִת 在此语境指圣殿，译作“圣殿”可避免现代读者误解为普通房屋。
- source_word: שַׂר הָעִיר
  choice: 城里的长官
  rationale: שַׂר 表示具有治理权的官员；“长官”既保留职衔的一般性，也不把其具体官阶限定为现代意义的“市长”或“省长”。
- source_word: הַמַּזְכִּיר
  choice: 史官
  rationale: 该词指王室中负责记录、奏报或提醒事务的官员；“史官”是简明且较为传统的汉语职衔，但其职责范围可能宽于单纯编史。
- source_word: לְחַזֵּק אֶת בֵּית
  choice: 修缮……殿
  rationale: חזק 字面为“使坚固”，用于建筑时指加固、修复；“修缮”准确传达本处的实际行动。
- source_word: יְהוָה אֱלֹהָיו
  choice: 耶和华他上帝
  rationale: 保留四字神名的常用简体中文译名“耶和华”，并照原文保留“他的上帝”这一关系表达。
theological_decisions:
- issue: לְטַהֵר 与主句的关系
  choice: 译为目的：“为要洁净”
  alternative: 译为时间或完成状态：“洁净了……以后／当他洁净了……”
  rationale: 希伯来文 לְ 加不定式首先容许目的义，且不直接标明动作已经完成；为保存原文的语法张力，正文采用目的义，并以脚注提示时间义的可能。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者最熟悉且具有专名功能的“耶和华”；“雅威”是较接近学术重构读音的另一译法。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。人名按中文圣经常见形式音译；避免现代行政职称造成时代错置。脚注标记置于相关整句末尾，并在脚注中保留关键句法歧义。
