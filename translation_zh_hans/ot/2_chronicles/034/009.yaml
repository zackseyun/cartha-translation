source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: zh_hans
  text: 他们来到大祭司希勒家那里，把送进上帝殿里的银钱交给他。这些钱是看守门槛的利未人[a]从玛拿西、以法莲、以色列所有余民，以及全犹大、便雅悯和耶路撒冷居民那里收集来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“守门的利未人”；原文直译为“看守门槛的利未人”。
    reason: 说明职能性译法，并保留源语的具体意象。
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们来到
  rationale: 连续叙事形式推进情节；现代汉语无需另加“然后”，上下文已能表达先后。
- source_word: חִלְקִיָּהוּ
  choice: 希勒家
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该祭司职分在现代汉语中的通行、准确称谓。
- source_word: וַיִּתְּנוּ
  choice: 交给他
  rationale: 语境是将所收集的款项交付给希勒家；“交给”比单纯“给”更自然，其中“他”承接前述希勒家，并未改变受领对象。
- source_word: הַכֶּסֶף
  choice: 银钱
  rationale: כֶּסֶף本义为“银”，此处指作为圣殿款项收集的金钱；“银钱”兼顾物质本义与货币功能。
- source_word: הַמּוּבָא
  choice: 送进
  rationale: 被动分词表示款项此前已被带入；汉语以“送进……的”自然表达其被动及先行动作。
- source_word: בֵית אֱלֹהִים
  choice: 上帝的殿
  rationale: 保留“上帝之殿”的源语意象，同时“殿”清楚表明此处所指的敬拜场所。
- source_word: אָסְפוּ
  choice: 收集来的
  rationale: 说明交付前已经完成的收集行动，符合汉语自然的时间关系表达。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用该族群及圣职群体的标准中文名称。
- source_word: שֹׁמְרֵי הַסַּף
  choice: 看守门槛的利未人
  rationale: 直译其结构和“门槛”意象；其职能也可理解为守门人，故在脚注中列出。
- source_word: מִיַּד
  choice: 从……那里
  rationale: 源语字面为“从……手中”，在收取款项的语境中是来源用法；如此译成现代汉语自然准确。
- source_word: מְנַשֶּׁה וְאֶפְרַיִם
  choice: 玛拿西、以法莲
  rationale: 采用现代中文圣经地名及支派名的通行音译。
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: 以色列所有余民
  rationale: “余民”保留שְׁאֵרִית“剩余者”的基本意义及其可能具有的盟约色彩；“所有”对应כֹּל。
- source_word: וישבי יְרוּשָׁלִָם
  choice: 和耶路撒冷居民
  rationale: 按马所拉传统所表达的“耶路撒冷居民”处理，并以“和”接续名单末项。
theological_decisions:
- issue: שְׁאֵרִית（余民）是否仅译为一般意义的“其余人”
  choice: 以色列所有余民
  alternative: 以色列其余所有人
  rationale: “余民”既可指北方各支派中剩下的人，也保留《历代志》中可能存在的盟约与救赎历史意味；不在正文中进一步限定，从而保留原文张力。
- issue: בֵית אֱלֹהִים的表达
  choice: 上帝的殿
  alternative: 上帝的家；上帝的圣殿
  rationale: “殿”使现代读者明确这是敬拜建筑，同时不额外加入原文没有的“圣”字；也保留“上帝之殿”与制度性圣殿之间的自然关联。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将较长的希伯来语单句分为两句，以清楚交代款项的交付和来源；不改变各动作之间的逻辑关系。脚注标记紧随其实际解释的短语，而不是置于“上帝的殿”之后。
