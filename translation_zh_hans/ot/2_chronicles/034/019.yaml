base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: zh_hans
  text: 王听见律法[a]的话，就撕裂了自己的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“教导”。希伯来语“妥拉”可泛指教导；此处指在王面前宣读的盟约律法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 听见……就
  rationale: ויהי与כ加不定式构成叙事中的时间背景；汉语用“听见……就”自然表达事件的紧接关系，无须机械译出“事情发生了”。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的头衔，所指在上下文中是约西亚；译文保留头衔，不补出人名。
- source_word: דִּבְרֵי
  choice: ……上的话
  rationale: דברי在此指所宣读的具体内容。“律法上的话”既保留“话”的复数集合意义，也符合现代汉语表达。
- source_word: הַתּוֹרָה
  choice: 律法
  rationale: תורה可泛指教导、训诲，但本处语境是王面前所宣读之约书的律法内容；“律法”清楚、庄重，并保留脚注说明较宽的词义。
- source_word: וַיִּקְרַע
  choice: 就撕裂了
  rationale: קרע指撕裂衣服，是哀痛、惊惧或悔改的惯常举动；“撕裂”准确且符合圣经叙事语体。
- source_word: בְּגָדָיו
  choice: 自己的衣服
  rationale: בגד是一般性的衣物用语，不特指王袍；“自己的衣服”清楚标明物主，又不增加原文没有的细节。
theological_decisions:
- issue: 约西亚改革语境中תורה的译法
  choice: 律法
  alternative: 教导；妥拉
  rationale: 上下文所指是被发现并宣读的约书及其具有盟约和法律性质的内容。“律法”最能在现代中文中传达这一语境，同时以脚注保留תורה更广泛的“教导”义，避免把词义不必要地收窄。
translation_notes:
  register: 采用现代、简洁而庄重的叙事汉语。“王”比“国王”更贴合历代志的传统历史叙事语域；“撕裂了自己的衣服”保留原文动作，不在正文中解释其象征意义。
