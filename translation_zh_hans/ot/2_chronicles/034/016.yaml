base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: zh_hans
  text: 沙番把那书卷带到王那里，又向王复命说：“凡交在你仆人手中的事，他们都在办理。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 带到
  rationale: 该词是 בוא 的使役形，表示沙番将书卷带到王那里，而不只是自己前去。
- source_word: הַסֵּפֶר
  choice: 那书卷
  rationale: סֵפֶר 可指书、卷轴或文书；结合本段所发现的律法书，以“那书卷”既承接上下文，也适度体现古代文本的形态。
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: 又向王复命
  rationale: 这是向委派者回报消息的表达；“复命”自然、庄重，并保留 עוֹד 所表达的“又、还”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出直接引语的常规表达，现代汉语用“说”最自然。
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: 交在你仆人手中的一切事
  rationale: 保留 נִתַּן בְּיַד“交在手中”的希伯来意象，同时汉语可自然理解为受托办理。根据下文“办理”，补出“一切事”是符合语境的最小显化。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 王室语境中的 עבד 指臣仆或办事人员；“仆人”保留原文的宫廷自称，不强化为奴隶，也不解释为官员。
- source_word: הֵם עֹשִׂים
  choice: 他们都在办理
  rationale: 独立代词 הֵם 带有强调意味，分词 עֹשִׂים 表示正在持续进行；“他们都在办理”自然呈现两者，并由语境补足所办的是受托之事。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“书卷”贴合古代文本语境；“复命”简洁体现回报委派者；引语保留“交在……手中”的原文意象，同时避免生硬直译。
