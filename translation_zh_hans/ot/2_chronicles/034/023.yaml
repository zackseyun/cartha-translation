base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: zh_hans
  text: 她对他们说：“以色列的神耶和华[a]如此说：你们要对那差你们来见我的人说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为四字神名“YHWH”，亦常音译为“雅威”。
    reason: 说明四字神名及另一常见音译。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 她对他们说
  rationale: 以顺承叙事形式译出 wayyiqtol，并按动词阴性单数形式保留说话者为女性；“对他们说”自然表达 לָהֶם。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信的固定公式，同时符合庄重、清楚的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不只以“主”这一称号替代；脚注说明原文情况。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接译出构造词组，表明耶和华是以色列的神。
- source_word: אִמְרוּ
  choice: 你们要……说
  rationale: 明确复数命令的受话者，并保留 אמר“说”的基本意义。
- source_word: לָאִישׁ
  choice: 对……人
  rationale: אִישׁ 为阳性单数；汉语“那……的人”既自然，又准确指向差遣他们的那一位。
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: 那差你们来见我的
  rationale: 准确表达关系从句及朝向说话者的 אֵלַי；“来见我”比生硬的“到我这里”更符合此处受差遣求问的语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名。正文采用中文圣经传统中最通行且可辨识为专名的“耶和华”，并以脚注交代神名本身，避免把专名无说明地化为称号。
- issue: 将 לָאִישׁ 译为具体身份还是普通名词
  choice: 那……的人
  alternative: 那位王
  rationale: 上下文所指虽是约西亚王，但本节原文只说“那人”。正文不把上下文身份直接补入，以保留原文措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如此说”保留先知传信公式；末尾用冒号并不闭合引号，表明耶和华的信息在下一节继续。
