  yaml_path: translation/ot/2_chronicles/034/029.yaml
  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: zh_hans
  text: 王就派人去召集犹大和耶路撒冷所有的长老。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: שׁלח的基本义是“派遣、差遣”。这里没有明说所派何人或传达何种信息，因此译作“派人”，既符合召集长老的语境，也不把“传令”等未明说的内容写入正文。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称号“王”，上下文所指是约西亚；本节仍保留称号，不改用人名。
- source_word: וַיֶּאֱסֹף
  choice: 召集
  rationale: אָסף可指“聚集、召集”。宾语是具有公共身份的长老，因此“召集”比单纯“聚集”更符合现代汉语语境。
- source_word: אֶת כָּל
  choice: 所有
  rationale: אֶת是宾语标记，不另译；כָּל译为“所有”，保留范围的完整性。
- source_word: זִקְנֵי
  choice: 长老
  rationale: 此处指犹大和耶路撒冷中受认可的群体领袖，而不只是年长男子；“长老”准确保留其社会身份。
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: 犹大和耶路撒冷的
  rationale: 保留原文并列的地域名称，表明所召集的长老来自犹大和耶路撒冷。
