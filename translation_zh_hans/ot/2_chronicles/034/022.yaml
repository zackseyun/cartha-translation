base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: zh_hans
  text: 于是，希勒家和王所派的人去见女先知户勒大。她是沙龙的妻子；沙龙是托哈特的儿子，托哈特是哈斯拉的儿子。沙龙负责看管衣服[a]。户勒大住在耶路撒冷的第二城区[b]。他们这样对她说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“负责管理衣库”。希伯来文直译为“看守衣服的人”。
    reason: lexical_alternative
  - marker: b
    text: “第二城区”所译的希伯来文是“米示拿”，很可能是耶路撒冷一个城区的名称；传统上译为“第二区”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 去见
  rationale: 这是希伯来叙事中常见的连续式动词；结合后面的介词 אֶל，在中文中自然译为“去见”。
- source_word: וַאֲשֶׁר הַמֶּלֶךְ
  choice: 和王所派的人
  rationale: 原文是省略式表达，直译近似“和那些属于王的人”；根据上一节所述的使团，在中文中补出“所派”以明确关系，但不增添具体人名。
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: 女先知户勒大
  rationale: 保留 נְבִיאָה 的阴性标记，同时采用现代汉语自然、庄重的称谓次序。
- source_word: אֵשֶׁת שַׁלֻּם
  choice: 沙龙的妻子
  rationale: 直接表达原文的婚姻关系。
- source_word: בֶּן תוקהת בֶּן חַסְרָה
  choice: 特哈的儿子、哈斯拉的孙子
  rationale: 原文逐代列出父系谱系；中文以“儿子、孙子”清楚保留相同关系。
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: 负责看管衣服
  rationale: 贴近字面“看守衣服的人”，同时用现代汉语表达其职责；原文是否特指宫廷衣库职务并不完全确定，故在脚注列出另一译法。
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: 户勒大住在
  rationale: 分词结构提供持续居住的背景信息；中文重复姓名可避免上一句多个男性人物造成的代词歧义。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 采用通行地名译法。
- source_word: בַּמִּשְׁנֶה
  choice: 在第二城区
  rationale: מִשְׁנֶה 很可能是耶路撒冷一个特定城区的名称；译出其“第二”之意，并以脚注说明也可音译。
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 他们这样对她说：
  rationale: 自然保留 כָּזֹאת 的指示意味，并引出下文的话。
