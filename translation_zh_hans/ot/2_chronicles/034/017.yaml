  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: zh_hans
  text: 他们把在耶和华的殿中找到的银子取出，交在督工和做工的人手中。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“倒出了银子”。这里的希伯来语动词可指倒出、取出或拨付银子；在此处并不一定指把银子熔化。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“耶和华的家”，即圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: 倒了出来
  rationale: 此处所处理的是随后交给督工和工人的银子，语境更支持“倒出、取出并拨付”，而不是“熔化”。“倒了出来”保留了希伯来语的具体意象。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף本义为“银”，也可指钱财；这里是圣殿所收的银钱，用“银子”既贴近原文，也符合中文圣经语体。
- source_word: הַנִּמְצָא
  choice: 所得的
  rationale: 该被动分词指已被发现或收集到的银子。结合圣殿款项的语境，“所得的”比生硬的“被发现的”更自然，同时不具体限定取得方式。
- source_word: בְּבֵית יְהוָה
  choice: 耶和华殿里
  rationale: “耶和华的家”在此明确指圣殿。正文用“耶和华殿”自然简洁，脚注保留其字面形式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝专名的性质，而不改作称号“主”。
- source_word: וַיִּתְּנוּהוּ
  choice: 交
  rationale: נתן基本义为“给、放置”；与“在……手中”的表达连用时，“交在……手中”准确传达款项被托付给相关人员。
- source_word: עַל יַד
  choice: 在……手中
  rationale: 保留希伯来语“在某人手上”的托付意象，在现代汉语中也清楚自然。
- source_word: הַמֻּפְקָדִים
  choice: 督工
  rationale: 该词指受委派、负责监管的人；在修缮圣殿的语境中，“督工”简洁地体现其监督职责。
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: 做工的人
  rationale: 直译其广义表达，不把这些人过度限定为某一种具体工匠。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的专名。正文保留专名而不以“主”替代；“耶和华”是现代中文圣经传统中最为人熟悉的形式。
- issue: בֵּית יְהוָה所指为何
  choice: 耶和华殿
  alternative: 耶和华的家
  rationale: 上下文明确涉及圣殿修缮和殿中款项，因此正文用自然明确的“殿”；脚注说明原文的字面表达，以免掩盖其措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“倒了出来”保留原文意象，“交在……手中”保留行政托付的表达；不使用过于古雅的“匠人”或生硬的逐词结构。
