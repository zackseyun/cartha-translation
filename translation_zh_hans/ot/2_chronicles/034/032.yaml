base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: zh_hans
  text: 他使凡在耶路撒冷和便雅悯地区的人都站定[a]。耶路撒冷的居民就照着上帝、他们祖先的上帝的约而行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站定”原文直译为“使……站立”。在重申约的语境中，也可理解为使他们表明立场、委身于这约；原文未明确说明其具体方式。
    reason: 保留使役动词עמד的“站立”意象，并说明其在立约语境中可能含有委身之意，避免将其限定为单纯身体姿势或特定仪式。
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: 使……都坚守这约
  rationale: 该词是עמד的使役形，字面为“使……站立”。在本段重申圣约的语境中，它表达使众人站定立场、委身于约；译作“坚守这约”在现代汉语中自然，也保留坚定遵守的语义。脚注说明其字面意象及可能理解，以免消除原文的含蓄。
- source_word: אֵת כָּל הַנִּמְצָא
  choice: 所有……的人
  rationale: 被动分词נמצא在这里指当时身处该地、可以找到的人；“所有……的人”准确表达其整体范围，并符合现代汉语习惯。
- source_word: בִירוּשָׁלִַם וּבִנְיָמִן
  choice: 在耶路撒冷和便雅悯境内
  rationale: 原文直接列出耶路撒冷和便雅悯；便雅悯在此指相关地域。“境内”使现代读者清楚这是地点用法，而不把它误解为个人。
- source_word: וַיַּעֲשׂוּ
  choice: 行事
  rationale: עשה与כִּבְרִית搭配，表示依照圣约而行；“行事”比直译“做”更自然，同时没有把含义收窄为某一项具体礼仪。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 准确表达居住在耶路撒冷的人，措辞清楚、庄重而现代。
- source_word: כִּבְרִית
  choice: 照着……所立的约
  rationale: 前缀כ在这里表示准则或符合关系，即按照该约而行。“所立的约”符合汉语搭配，并未改变原文的所属关系。
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 上帝——他们祖先的上帝——
  rationale: 以同位结构保留原文对“上帝”的重复强调；破折号使现代汉语读者能清楚辨认补充说明。“祖先”比“列祖”更通俗，同时保持庄重。
theological_decisions:
- issue: 约西亚使众人“站立”的具体含义
  choice: 理解为使众人坚定委身、坚守圣约
  alternative: 仅指使众人实际站立起来，或特指使他们正式进入圣约
  rationale: 使役形עמד本身保留“使站立”的意象，但上下文谈的是重申并遵行圣约，因此含有站定立场、承担约之义务的意味。正文采用自然的语境译法，脚注保留字面读法及解释空间，不把它限定为原文没有明说的特定仪式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“上帝”“祖先”“居民”“行事”避免过度古雅；破折号清楚呈现同位说明。正文以语境清晰度为先，脚注保存原文动词的字面意象和解释张力。
