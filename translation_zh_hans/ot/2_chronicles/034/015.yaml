base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: zh_hans
  text: 希勒家回答书记沙番说：“我在耶和华的殿里找到了律法书[a]。”希勒家就把书交给沙番。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“律法卷”；希伯来语סֵפֶר可指书、文书或卷轴。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 回答……说
  rationale: 保留希伯来叙事中常见的复合言说公式；即使前文未必有直接问句，“回答……说”仍可表示对当时情势或先前话语作出回应。
- source_word: הַסּוֹפֵר
  choice: 书记
  rationale: סֹפֵר在此指王室或行政官员；“书记”既自然，又比“文士”更能体现沙番的官职语境。
- source_word: סֵפֶר הַתּוֹרָה
  choice: 律法书
  rationale: תּוֹרָה在此指圣约律法或训诲的文本；“律法书”是现代中文圣经语境中清楚而庄重的表达，同时不限定其物质形态。
- source_word: מָצָאתִי
  choice: 我……找到了
  rationale: 希伯来语完成式陈述刚完成且与当前相关的发现；中文“找到了”自然传达发现已经发生及其即时结果。
- source_word: בְּבֵית יְהוָה
  choice: 在耶和华的殿里
  rationale: בַּיִת字面为“房屋”，但此处明确指圣殿；译作“殿”比“家”自然准确，并保留所属关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”呈现四字神名，避免将专名改作称号。
- source_word: וַיִּתֵּן ... אֶת הַסֵּפֶר אֶל שָׁפָן
  choice: 希勒家就把书交给沙番
  rationale: נתן基本义为“给”；在实物递交的上下文中，“交给”自然、明确，并忠实表达转交动作。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的“耶和华”可将其作为专名呈现；“雅威”是较接近现代学界拟音的可行替代。
- issue: תּוֹרָה在本节中的含义
  choice: 律法
  alternative: 训诲
  rationale: 该词可泛指教导或训诲，但本段所发现的是具有圣约和规范权威的文本；“律法”符合语境，同时不进一步断定这卷书的具体范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“书记”体现宫廷行政职务；“殿”按语境表达耶和华的圣殿。专名采用常见中文形式“希勒家、沙番、耶和华”。
