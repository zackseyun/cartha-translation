  to: 王和犹大的所有男子、耶路撒冷的居民、祭司、利未人，以及全体百姓，从大到小，都上到雅威[a]的殿去。王在他们面前宣读了在雅威殿里找到的约书中的一切话。
  rationale: 修订把王与所列群体统一为“都上到……去”的共同主语，贴近希伯来文的单一动词结构；以“从大到小”替代“无论尊卑”，避免将原文开放的全体性表达限定为社会等级。“在他们面前宣读”自然表达“在他们耳中／给他们听”，并保持公开朗读的意思。脚注b仍解释正文“所有男子”，但原草稿中该锚点未实际标在正文，故不保留未锚定脚注。
