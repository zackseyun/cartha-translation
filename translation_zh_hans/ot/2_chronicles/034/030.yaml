  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: zh_hans
  text: 王和犹大的所有男子、耶路撒冷的居民、祭司、利未人，以及全体百姓，从大到小，都上到雅威[a]的殿去。王在他们面前宣读了在雅威殿里找到的约书中的一切话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文的神名יהוה（YHWH）；其古代的确切读音不能完全确定。
    reason: 说明神名的原文形式及音译性质。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上到
  rationale: 保留עלה“上去”的方向含义，也符合圣殿位于高处的语境；“上到……的殿”在现代汉语中清楚自然。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בֵּית字面为“家、房屋”，在此指圣殿；译作“殿”既准确又避免现代汉语中“房子”的误解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名YHWH，而不以称号替代专名。
- source_word: כָל אִישׁ יְהוּדָה
  choice: 犹大的所有男子
  rationale: כָל与单数אִישׁ构成周遍表达，指犹大的男子；译文保留其阳性措辞，不将其泛化为无性别的“所有人”。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 分词结构指居住在耶路撒冷的人；“居民”是自然、准确的集体称呼。
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: 祭司、利未人
  rationale: 采用这两个宗教及族群职分的标准现代汉语译名。
- source_word: כָל הָעָם
  choice: 全体百姓
  rationale: 表达聚集者的整体性，并与前面列举的群体自然衔接。
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: 无论尊卑
  rationale: 这是涵盖整个社会范围的习语；“无论尊卑”传达其语用意义，较字面的“从大到小”更符合现代汉语。
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: 念给他们听
  rationale: קרא在书卷作宾语时指宣读，בְאָזְנֵיהֶם字面为“在他们耳中”；合译为“念给他们听”准确且自然。
- source_word: סֵפֶר הַבְּרִית
  choice: 约书
  rationale: 保留“书”和“约”两个核心概念，指记载盟约内容的书卷；“约书”也是简洁庄重的圣经用语。
- source_word: הַנִּמְצָא בֵּית יְהוָה
  choice: 在雅威殿里找到的
  rationale: 准确表达被动分词“被找到的”及发现地点，不添加发现者等原文未明说的信息。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质；脚注说明其来源，同时不把有争议的确切古代读音说成绝对确定。
- issue: כָל אִישׁ יְהוּדָה的性别范围
  choice: 犹大的所有男子
  alternative: 犹大众人；所有犹大人
  rationale: 原文使用阳性名词אִישׁ，且随后另有“全体百姓”。正文保留这一明确措辞，脚注则提示这里是周遍性的集合表达。
- issue: מִגָּדוֹל וְעַד קָטָן所指的范围
  choice: 无论尊卑
  alternative: 从大到小；从最大的到最小的
  rationale: 该搭配通常表达社会地位或重要性范围，而非身体大小或年龄；“尊卑”传达此义，但不进一步限定具体阶层。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“也都去了”补明希伯来文并列主语共同受“上到”支配的句法关系；不改变参与者范围。“念给他们听”自然呈现公开宣读的动作。
