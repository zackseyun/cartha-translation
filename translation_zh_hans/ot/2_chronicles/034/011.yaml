base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: zh_hans
  text: 他们把钱交给工匠和建筑工人，用来购买采石场开采的石料[a]和木材，用于接合工程[b]，并为犹大诸王所毁坏的圣殿建筑架梁盖顶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凿好的石头”。希伯来语指从采石场开采、凿取，供建筑使用的石料。
    reason: lexical_alternative
  - marker: b
    text: 译作“接合工程”的希伯来词含义不确定，也可能指连接件、支撑件、框架构件，或结构的接合工作。
    reason: lexical_alternative
  - marker: c
    text: 或译“用梁木覆盖”。这个希伯来动词可指给建筑架梁、加顶或覆盖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 他们把钱交给
  rationale: נתן的基本义是“给、交给”。原文宾语承接上文的款项；为使现代汉语完整自然，明示为“钱”。
- source_word: חָרָשִׁים
  choice: 工匠
  rationale: 指有专门技艺的工人；“工匠”既保留技术性，也不局限于木匠等某一种工种。
- source_word: בֹּנִים
  choice: 建筑工人
  rationale: 这是בנה的分词名词用法，指从事建造的人；译作“建筑工人”自然，并与前面的广义“工匠”有所区分。
- source_word: לִקְנוֹת
  choice: 用来购买
  rationale: קנה在此意为“买、购置”；结合款项的用途，译作“用来购买”符合汉语表达。
- source_word: אַבְנֵי מַחְצֵב
  choice: 采石场凿出的石料
  rationale: 该短语指从采石场开采、凿取的建筑用石；此译同时表达来源和加工性质，而不武断限定其精加工程度。
- source_word: עֵצִים
  choice: 木材
  rationale: 在建筑语境中指作为建材使用的木料，“木材”比泛称“木头”更准确。
- source_word: לַמְחַבְּרוֹת
  choice: 制作连接构件
  rationale: 此词含义不完全确定，与连接、接合或结构构件有关；“连接构件”保留基本语义，又避免具体断定为支架、托梁或框架。
- source_word: וּלְקָרוֹת
  choice: 架梁盖顶
  rationale: קרה在建筑语境中可指用梁木覆盖、给建筑加顶；“架梁盖顶”自然表达其建筑动作，同时保留“梁”和“覆盖”两方面。
- source_word: הַבָּתִּים
  choice: 殿宇
  rationale: בָּתִּים字面为“房屋、建筑”，在本段修缮圣殿的语境中指圣殿建筑；“殿宇”既符合语境，又不必具体限定为某一座附属建筑。
- source_word: הִשְׁחִיתוּ
  choice: 所毁坏的
  rationale: שחת的使役形可表示使败坏、毁坏或破坏；“毁坏”保留较强语气，但不必理解为彻底拆毁。
- source_word: מַלְכֵי יְהוּדָה
  choice: 犹大诸王
  rationale: 直接表达复数构造短语；“诸王”是庄重而自然的现代书面语。
theological_decisions: []
