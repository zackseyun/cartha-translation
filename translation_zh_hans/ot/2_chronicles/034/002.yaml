  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דַרְכֵי֙ דָּוִ֣יד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: zh_hans
  text: 他做耶和华[a]眼中看为正的事，行他祖先大卫[b]的道路，不偏向右，也不偏向左。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上主”。原文是以色列上帝的名 יהוה（YHWH）。
    reason: divine_name_alternative
  - marker: b
    text: 原文直译“大卫他的父”；这里的“父”用于王朝谱系，指祖先。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: 他做……看为正的事
  rationale: עשה在王政评价套语中宜译为“做”；הישר作名词性用法，译作“正的事”，自然表达道德评价。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价意象，同时用现代汉语“看为”使句意顺畅。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”音译四字神名，并在脚注说明也可按敬称传统译作“上主”。
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: 行……所行的道
  rationale: הלך与דרך构成行为和生活方式的道路隐喻；“行……的道”既保留意象，也符合庄重自然的中文表达。
- source_word: דָּוִיד אָבִיו
  choice: 他祖先大卫
  rationale: אָב在此是王朝谱系中的广义用法，指远祖而非生父；正文译明“祖先”，避免现代读者误解。
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: 不偏左也不偏右
  rationale: 保留道路隐喻和两个方向的完整对举；中文简洁自然。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 上主
  rationale: 原文直接使用神的专名。正文采用中文传统中广为人知的音译“耶和华”，不以普通称号取代；脚注保留敬称传统的译法。
- issue: “大卫是他的父”中 אָב 的范围
  choice: 祖先
  alternative: 父亲
  rationale: 约西亚并非大卫的亲生儿子，此处是王朝与谱系意义上的“父”；译作“祖先”忠实传达所指，并避免事实性误读。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“眼中看为正”与“行……的道”保留原文的评价和道路意象；句末用“不偏左也不偏右”呈现希伯来语的方向次序。
