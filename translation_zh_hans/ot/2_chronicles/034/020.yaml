  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: zh_hans
  text: 王吩咐希勒家、沙番的儿子亚希甘、米迦的儿子押顿[a]、书记沙番和王的臣仆亚撒雅[b]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马所拉文本作“米迦的儿子押顿”；平行经文《列王纪下》22:12作“米该雅的儿子亚革波”。
    reason: textual_variant
  - marker: b
    text: 或译：“王的官员亚撒雅”。希伯来文直译为“王的仆人”，在这里也可指王室官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: 该动词表示君王发出具有权威的命令；“吩咐”符合现代汉语叙事语体，也保留其权威意味。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定指上下文中的约西亚；汉语历史叙事中用“王”自然简洁。
- source_word: חִלְקִיָּהוּ
  choice: 希勒家
  rationale: 采用中文圣经人名的通行音译。
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: 沙番的儿子亚希甘
  rationale: 以自然汉语表达父子身份，并采用通行人名音译。
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: 米迦的儿子押顿
  rationale: 遵从《历代志》马所拉文本的人名与父名，同时在脚注说明平行经文的异文。
- source_word: שָׁפָן הַסּוֹפֵר
  choice: 书记沙番
  rationale: סֹפֵר在王室语境中可指负责文书的官员；“书记”既保留文书职能，又适合现代汉语。
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: 王的臣仆亚撒雅
  rationale: עֶבֶד字面为“仆人”，在宫廷语境中也可指王室官员；“臣仆”兼顾字面意义和王室身份，另以脚注保留“官员”的可能。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是引出下文直接话语的固定公式；用“说：”符合现代汉语叙事习惯。
theological_decisions: []
