  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: zh_hans
  text: 王站在自己的位置上，在雅威面前立了这约：要跟随雅威，尽心尽性地遵守他的诫命、法度和律例，并实行这书[a]上所写的约的话语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这卷轴上”。希伯来语“书”也可指以卷轴形式保存的书面文献。
    reason: 保留“书”一词可指卷轴这一古代文献形态的词义可能性。
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל־עָמְדוֹ
  choice: 王站在自己的位置上
  rationale: “עמד”直指站立；“על עמדו”指王所处的指定位置。译作“自己的位置”自然，也不擅自确定具体建筑或礼仪设施。
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: 立了这约
  rationale: “כרת ברית”是希伯来语“立约”的固定表达；定冠词表明这是上下文所指的约，因此译作“这约”。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留在神面前郑重立约的临在含义，并以“雅威”音译神的专名。
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: 跟随雅威
  rationale: 原文直译为“行在雅威之后”，是忠诚跟随的盟约用语；现代汉语用“跟随”可自然传达该意象而不增添解释。
- source_word: מִצְוֹתָיו וְעֵדְוֹתָיו וְחֻקָּיו
  choice: 他的诫命、法度和律例
  rationale: 分别保留三个并列的律法术语，不把它们合并为一个泛称；“诫命、法度、律例”兼具可懂性与庄重的盟约语域。
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: 尽心尽性
  rationale: 凝练地保留“全心、全性命”的申命记式盟约表达及其互文意味。
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: 履行……约言
  rationale: “履行”自然表达按约行事；“约言”保留“约的言语”之意，比直接解释成“条款”更少限定。
- source_word: הַסֵּפֶר הַזֶּה
  choice: 这书
  rationale: “ספר”指书写的文献，在古代实际形态很可能是卷轴；正文采用现代读者自然理解的“书”，另以脚注保留历史形态。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为盟约专名的性质，不以称号替代。
- issue: לָלֶכֶת אַחֲרֵי יְהוָה 的盟约意涵
  choice: 跟随雅威
  alternative: 行在雅威之后
  rationale: “跟随”保留忠诚归从的核心意义，同时避免逐字译法在现代汉语中产生生硬或空间性的误读。
- issue: “心”和“性命”表达的整体委身
  choice: 尽心尽性
  alternative: 全心全意；全心全性命
  rationale: 采用具有经文互文辨识度的表达，既不把“נפש”仅解释为非物质的“灵魂”，也不把两个词扁平化为普通副词。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“立约、诫命、法度、律例、尽心尽性、约言”等词保留盟约与律法语域；句中冒号清楚表明后文是所立之约的内容。
