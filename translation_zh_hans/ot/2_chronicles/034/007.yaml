base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: zh_hans
  text: 他拆毁祭坛和亚舍拉像[a]，把雕刻的神像砸成粉末；他又在以色列全境砍倒所有的日像[b]。然后，他回到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”。希伯来语所指的是与亚舍拉有关的崇拜物，其具体形制可能随语境而异。
    reason: lexical_alternative
  - marker: b
    text: 或译“太阳柱”。这个希伯来词指与太阳相关的崇拜物，但其具体所指仍有争议；也有人译作“香坛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: 拆毁
  rationale: נתץ常指拆除、毁坏建筑物或设施；“拆毁”自然准确，适用于祭坛等宗教设施。
- source_word: הַמִּזְבְּחוֹת
  choice: 祭坛
  rationale: מִזְבֵּחַ的标准对应词；本处指约西亚所清除的非法敬拜设施。
- source_word: הָאֲשֵׁרִים
  choice: 亚舍拉像
  rationale: 该词指与亚舍拉有关的崇拜物，其具体形制因语境而异。“亚舍拉像”保留专名及物件性质，但不武断限定为木柱；脚注说明另一常见译法。
- source_word: הַפְּסִלִים
  choice: 雕刻的神像
  rationale: פֶּסֶל具体指雕刻而成的崇拜像；此译比泛称“偶像”更贴近词义，也符合现代汉语。
- source_word: כִּתַּת לְהֵדַק
  choice: 砸得粉碎
  rationale: 这一组合表达击碎至细小颗粒的结果；“砸得粉碎”简明有力，并保持动作与结果。
- source_word: הַחַמָּנִים
  choice: 香坛
  rationale: חַמָּנִים所指的崇拜物并不完全确定，可能与太阳柱或焚香设施有关。正文采用较易懂的“香坛”，脚注保留“太阳柱”这一重要可能。
- source_word: גִּדַּע
  choice: 砍倒
  rationale: גדע表示砍断、砍倒，适用于直立的崇拜物。
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: 以色列全境
  rationale: 简洁表达行动遍及以色列全地，保留בכל所强调的范围。
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: 然后，他回到耶路撒冷
  rationale: “然后”自然呈现希伯来叙事动词所推进的先后次序。
theological_decisions:
- issue: 如何翻译与偶像崇拜有关的专门用语
  choice: 分别译作“亚舍拉像”“雕刻的神像”“香坛”，保留各类崇拜物的具体差异。
  alternative: 概括译为“偶像和神龛”等泛称。
  rationale: 原文列举不同的崇拜设施与物件；保留其差异更能反映约西亚改革的具体行动，也避免加入原文没有的概括性解释。
- issue: חַמָּנִים所指物件的不确定性
  choice: 正文译“香坛”，并以脚注注明“太阳柱”的可能。
  alternative: 正文译“太阳柱”或“日像”。
  rationale: 该词的精确所指仍有争议；正文需自然可懂，同时脚注明示真实的词义不确定性，不把有争议的认定写成定论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“拆毁”“砸得粉碎”“砍倒”依次呈现原文鲜明的动作；专门崇拜用语尽量具体，并用脚注保存词义上的不确定性。
