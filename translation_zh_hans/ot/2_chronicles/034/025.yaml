source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: zh_hans
  text: 因为他们离弃了我，向别的神烧香[a]，以他们手所做的一切惹我发怒[b]，所以我的烈怒必倾倒在这地方，也必不熄灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“别的神明”。希伯来文直译是“别的神”。
    reason: lexical_alternative
  - marker: b
    text: “他们手所做的一切”可泛指他们制造或所行的事，在这里尤其包括人手制造的偶像及相关敬拜行为。
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: 因为……所以
  rationale: 该结构说明审判的缘由；汉语用“因为……所以”清楚呈现因果关系，也使长句自然连贯。
- source_word: עֲזָבוּנִי
  choice: 他们离弃了我
  rationale: “离弃”准确表达 עזב 在盟约和敬拜语境中的背弃含义，语体庄重而自然。
- source_word: וַיַּקְטִירוּ
  choice: 向……烧香
  rationale: קטר 的使役词干在此偶像崇拜语境中通常指焚香或焚烧馨烟祭；“烧香”是简洁且语境贴切的译法。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别的神
  rationale: 直译 אֲחֵרִים 为“别的”，保留原文措辞，不将其限定为族群意义上的“外邦神”。
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: 惹我发怒
  rationale: 保留 כעס 使役形式所表达的激怒含义；目的或结果关系在汉语句法中自然呈现，不武断限定其一。
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: 以他们手所做的一切
  rationale: 保留“手所做的”这一希伯来表达，同时“一切”可涵盖他们制造的偶像及相关行为。
- source_word: וְתִתַּךְ חֲמָתִי
  choice: 所以我的烈怒必倾倒
  rationale: “倾倒”保留 נתך 的鲜明液体意象；“烈怒”传达 חֵמָה 在审判语境中的强烈程度。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 在这地方
  rationale: 汉语说怒气“倾倒在”某地自然明确，表达审判临到该处。
- source_word: וְלֹא תִכְבֶּה
  choice: 不能熄灭
  rationale: 保留 כבה 的火焰隐喻，并表达该审判不会止息的确定性。
theological_decisions:
- issue: 如何表达神的审判而不弱化或过度系统化
  choice: 我的烈怒必倾倒在这地方，不能熄灭
  alternative: 我的愤怒要倾泻在这地方，永不止息
  rationale: 所选译文直接保留神亲自宣告的烈怒、倾倒和熄灭意象，不引入本节之外的末世论或教义框架。
- issue: 第一人称所指的神
  choice: 我／我的
  alternative: 耶和华／耶和华的
  rationale: 希伯来文在引语内使用第一人称词尾，直接译为“我／我的”最忠实，也避免无依据地以神名替换。
- issue: לְמַעַן 所表达的目的或结果
  choice: 以……惹我发怒
  alternative: 为要……惹我发怒
  rationale: 该结构可表达目的或结果；采用较不限定主观动机的汉语结构，以保留原文可能存在的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“离弃”“烈怒”“倾倒”“熄灭”保留经文的盟约背弃与审判意象；句式以“因为……所以”明确组织原文的因果关系。所有脚注标记均已置于正文相应位置。
