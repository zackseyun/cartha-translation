source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֗/י וּ/בְעַד֙ הַ/נִּשְׁאָר֙ בְּ/יִשְׂרָאֵ֣ל וּ/בִֽ/יהוּדָ֔ה עַל דִּבְרֵ֥י הַ/סֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי גְדוֹלָ֤ה חֲמַת יְהוָה֙ אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹא שָׁמְר֤וּ אֲבוֹתֵ֨י/נוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה לַ/עֲשׂ֕וֹת כְּ/כָל הַ/כָּת֖וּב עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: zh_hans
  text: “你们去，替我，也替以色列和犹大剩下的人，就所发现的这卷书[a]上的话求问耶和华；因为耶和华已经向我们倾倒极大的烈怒，这是由于我们的列祖[b]没有遵守耶和华的话，也没有照着这卷书上所记的一切去行。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此词可指“书”或“卷轴”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我们的父辈”；也可译为“我们的先祖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: 求问耶和华
  rationale: 在王命的语境中，דרשׁ指为具体事务寻求上帝的指示；“求问”既自然，也比泛指敬虔追求的“寻求”更准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，避免将其改写为称号“主”。
- source_word: וּבְעַד הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: 也为以色列和犹大剩下的人
  rationale: הַנִּשְׁאָר字面指留下、剩下的人；此译法自然清楚，并保留其历史处境，不额外加入神学化的术语。
- source_word: עַל דִּבְרֵי הַסֵּפֶר
  choice: 就……这卷书上的话
  rationale: עַל在此引出求问所关乎的内容；“就……的话”符合现代汉语，דִּבְרֵי则保留为“话”。
- source_word: הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: 所发现的这卷书
  rationale: סֵפֶר可指书或卷轴；“卷书”兼顾古代书写载体与中文可读性。
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: 耶和华……的烈怒甚大
  rationale: חֵמָה带有炽烈怒气之意，“烈怒”体现语义强度；“甚大”保留原文强调。
- source_word: נִתְּכָה בָנוּ
  choice: 向我们倾下
  rationale: נתך的被动形式在此描写烈怒被倾倒；“倾下”保存原文意象，并避免误译为单纯“发作”。
- source_word: אֲבוֹתֵינוּ
  choice: 我们的先祖
  rationale: 此处指前代祖先；现代中文“先祖”准确自然，也不暗示仅指亲生父亲。
- source_word: שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: 没有遵守耶和华的话
  rationale: שׁמר与“话”搭配时表示谨守、遵行；中文“遵守”比直译“守住”自然。
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב
  choice: 没有照……所记的一切去行
  rationale: 保留“照着全部所写内容实行”的范围与行动含义，同时使中文句法流畅。
- source_word: עַל־הַסֵּפֶר הַזֶּה
  choice: 这卷书上
  rationale: 书写内容在中文通常说“书上所记”；这里的עַל也与该表达直接对应。
theological_decisions:
- issue: 如何呈现神名יהוה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用专有神名而非称号；正文保留专名。中文传统通行形式“耶和华”具有最高辨识度，且不将神名替换为“主”。
- issue: הַנִּשְׁאָר是否译作神学术语“余民”
  choice: 剩下的人
  alternative: 余民
  rationale: 原词确可在圣经神学语境中形成“余民”概念，但本句首先指以色列和犹大仍存留的人；采用描述性译法，避免在正文中预先强化特定神学解释。
- issue: אֲבוֹתֵינוּ的性别与群体范围
  choice: 我们的先祖
  alternative: 我们的父辈
  rationale: 该词为阳性复数，并常指历代祖先。“先祖”保留父系祖辈的历史指向，同时在现代中文中不会被误解为仅上一代男性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留王命“你们去”、神名、烈怒被“倾下”的意象以及“所记的一切”的完整范围；通过“这是由于”理清长句因果关系，但不消解原文的审判张力。
