  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: zh_hans
  text: 他把祭司的骸骨烧在他们的祭坛上[a]，洁净了犹大和耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些祭坛”。这里的希伯来语词形不寻常；意思是约西亚把这些祭司的骸骨烧在与他们有关的祭坛上。
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת כֹּהֲנִים
  choice: 祭司的骸骨
  rationale: עַצְמוֹת 是 עֶצֶם 的复数附属形，指实际的骨头；用“骸骨”比“骨头”更符合庄重的历史叙事语体。原文只说“祭司”，不擅自增补“拜偶像的”。
- source_word: שָׂרַף
  choice: 烧
  rationale: 该词为 שׂרף 的 Qal 完成式第三人称阳性单数，意为焚烧；“烧”自然、准确，并由上下文表明动作已经完成。
- source_word: עַל מזבחותים
  choice: 在他们的祭坛上
  rationale: עַל 表示“在……上”；异常词形 מזבחותים 在上下文中很可能带有第三人称复数所属含义，因此译作“他们的祭坛”，并用脚注保留“那些祭坛”的可能。
- source_word: וַ/יְטַהֵר
  choice: 洁净了
  rationale: טהר 的 Piel 形式在本段改革语境中表示除去敬拜偶像所造成的污秽。“洁净”兼顾礼仪与道德层面，也符合现代中文圣经历史叙事的庄重语域。
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: 犹大和耶路撒冷
  rationale: 两个地名均为直接宾语；采用现代中文通行译名，指被洁净的地区及其首府。
theological_decisions:
- issue: “洁净”的性质
  choice: 除去偶像崇拜污秽的礼仪—道德性洁净
  alternative: 纯粹的礼仪净化，或仅指物理上的清除和毁坏
  rationale: 改革上下文表明，טהר 不只是清理场所，也涉及除去非法敬拜造成的污秽；译作“洁净”保留其礼仪与道德张力，而不引入后期宗派性解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“骸骨”适合涉及死者遗骨的历史叙事；“洁净”保留原文在礼仪和道德层面的含义。脚注标记已在正文对应位置标出。
