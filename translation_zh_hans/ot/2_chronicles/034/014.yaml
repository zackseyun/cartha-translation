  text: וּ/בְ/הוֹצִיאָ֣/ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה מָצָא֙ חִלְקִיָּ֣הוּ הַ/כֹּהֵ֔ן אֶת סֵ֥פֶר תּֽוֹרַת יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: zh_hans
  text: 他们取出送进雅威的殿里的银子时，祭司希勒家找到了雅威借摩西之手所传的律法书。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借摩西之手”直译为“在摩西手中／借摩西的手”，是表示中介或代理的希伯来语用语，也可译为“通过摩西”。
    reason: 说明 בְּיַד מֹשֶׁה 的习语含义；不将其限定为摩西亲笔写作或某一种具体颁授方式。
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: 他们……取出来时
  rationale: 介词 בְּ 加不定式连词形及第三人称复数后缀构成时间从句；译作“……时”自然地保留“在他们取出之际”的含义。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף 可指银或钱财；此处是圣殿修缮所收集的款项，译作“银子”既贴近词面，也符合古代语境。
- source_word: הַמּוּבָא בֵּית יְהוָה
  choice: 先前送进雅威殿里的
  rationale: הַמּוּבָא 是 בוא 的被动分词，表示“被带入的”；“先前”清楚表达这笔银子已被送入殿中的时序。בֵּית יְהוָה 直译为“雅威的殿/家”，现代汉语在此用“雅威殿”较自然。
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: 希勒家祭司
  rationale: 按希伯来语次序保留人名及其职分；“希勒家”采用现代中文圣经中可辨识的音译形式。
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: 《雅威律法书》
  rationale: סֵפֶר 可指书卷或文书，תּוֹרָה 可指训诲或律法；在此特定圣约文献语境中，“律法书”准确且为普通读者熟悉。书名号体现它是所发现文献的名称。
- source_word: בְּיַד מֹשֶׁה
  choice: 由摩西经手的
  rationale: 字面为“借摩西的手”，可表达代理、传递或媒介关系。“由摩西经手”保留“手”的意象所含的中介意味，同时避免额外断定究竟是亲笔写作还是授予。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文两次直接使用四字神名；“雅威”较贴近其通行学术重构读音，并保留专名性质。
- issue: בְּיַד מֹשֶׁה 所表达的摩西角色
  choice: 由摩西经手的
  alternative: 摩西所写的；借摩西颁布的
  rationale: 原文的“借/在摩西手中”可涉及写作、传递或中介，却未明确加上“写”或“颁布”。正文保留这种神学与语义张力，不将其单一化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“殿”比字面的“家”更能让普通读者立即理解此处指圣殿；“取出来时”保持叙事流畅。脚注标记置于整句之后，对正文中的“由摩西经手”作说明。
