  text: וּ/בִ/שְׁמוֹנֶ֨ה שָׁנִ֜ים לְ/מָלְכ֗/וֹ וְ/הוּא֙ עוֹדֶ֣/נּוּ נַ֔עַר הֵחֵ֕ל לִ/דְר֕וֹשׁ לֵ/אלֹהֵ֖י דָּוִ֣יד אָבִ֑י/ו וּ/בִ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה שָׁנָ֗ה הֵחֵל֙ לְ/טַהֵ֔ר אֶת יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם מִן הַ/בָּמוֹת֙ וְ/הָ֣/אֲשֵׁרִ֔ים וְ/הַ/פְּסִלִ֖ים וְ/הַ/מַּסֵּכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: zh_hans
  text: 他在位第八年，仍年少时，就开始寻求他先祖大卫的神[a]；在位第十二年，他开始洁净犹大和耶路撒冷，清除其中的丘坛、亚舍拉祭祀物[b]、雕刻的像和铸造的像[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“他父亲大卫的神”；“父亲”在这里是王室谱系用语，指先祖。
    reason: lexical_alternative
  - marker: b
    text: “亚舍拉祭祀物”也可译作“亚舍拉木柱”。原文指与亚舍拉有关的祭祀象征物，可能是木柱、树木或其他形制。
    reason: lexical_alternative
  - marker: c
    text: “铸造的像”也可译作“铸像”或“熔铸的像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: 他在位第八年
  rationale: ב与年数构成时间表达，לְמָלְכוֹ界定为执政年；此译符合现代汉语纪年习惯。
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: 自己还年轻
  rationale: נַעַר可指少年或青年；约西亚此时约十六岁，用“还年轻”既保留年龄意味，也避免误解为幼童。
- source_word: הֵחֵל לִדְרוֹשׁ
  choice: 开始寻求
  rationale: דרשׁ以神为对象时通常指专心归向、寻求神，不只是求问信息。
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: 他先祖大卫的神
  rationale: אָבִיו字面为“他的父亲”，但在王室谱系语言中指祖先；中文正文采用“先祖”可避免把大卫误认作约西亚的生父，同时脚注保留原文表达。
- source_word: וּבִשְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: 到了第十二年
  rationale: 上下文延续执政纪年；“到了”自然呈现从第八年到第十二年的时间推进。
- source_word: הֵחֵל לְטַהֵר
  choice: 开始洁净
  rationale: טהר在这里指清除敬拜上的污秽；“洁净”兼具礼仪和宗教含义。
- source_word: מִן הַבָּמוֹת
  choice: 除掉丘坛
  rationale: במות指地方性的高处祭祀设施；“丘坛”是简洁且明确的现代中文圣经用语。介词מן在洁净语境中表达从境内清除，故译出“除掉”。
- source_word: וְהָאֲשֵׁרִים
  choice: 亚舍拉像
  rationale: 复数אֲשֵׁרִים指与亚舍拉有关的祭祀物或象征物，具体形制未必能确定；“像”较宽泛，脚注说明也可能是木柱。
- source_word: וְהַפְּסִלִים
  choice: 雕刻的神像
  rationale: פְּסִלִים强调以雕刻方式制成的偶像；此译保留制作方式，并以“神像”明确其祭祀性质。
- source_word: וְהַמַּסֵּכוֹת
  choice: 铸造的神像
  rationale: מַסֵּכוֹת指以熔化材料浇铸的像；“铸造的神像”比笼统的“金属像”更准确地保留制作方式。
theological_decisions:
- issue: “大卫是他的父亲”的王朝谱系表达
  choice: 正文译作“他先祖大卫”
  alternative: “他父亲大卫”
  rationale: 原文אָב可用作祖先称谓。现代汉语若直译“父亲”会把大卫误解为约西亚的直接父亲，因此正文明确实际亲属关系，同时脚注保存字面形式及其王室谱系功能。
- issue: “寻求神”的含义
  choice: 保留“寻求”，不扩写为悔改、敬拜或求问
  alternative: “专心归向”或“求问”
  rationale: דרשׁ在此具有敬虔寻求的含义，但原文没有进一步限定具体行为；保留“寻求”可避免将其神学含义收窄。
- issue: 洁净犹大和耶路撒冷的性质
  choice: 使用“洁净”，并以“除掉”连接祭祀设施和神像
  alternative: “清除……中的”或“使……纯洁”
  rationale: 原文טהר兼具礼仪和宗教意味；译文不把它仅处理为行政拆除，也不额外加入道德评价。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“丘坛”“洁净”“寻求”保留经文的宗教语域；对可能造成直系亲属误解的谱系称谓采用语义明确的“先祖”，并以脚注交代原文字面表达。所有脚注标记均置于正文相应词语之后。
