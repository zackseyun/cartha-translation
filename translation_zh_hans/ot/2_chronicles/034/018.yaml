  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: zh_hans
  text: 书记沙番向王禀报说：“祭司希勒家给了我一本书[a]。”沙番就在王面前读这书。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书卷”或“文书”。希伯来语这个词可泛指书面文献或书；在当时，其实际形制通常是卷轴。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 禀报
  rationale: 该动词在使役词干中常指告诉、报告；此处是王室官员向君王陈报，用“禀报”既自然又符合场景，且不过分强化正式程度。
- source_word: הַסּוֹפֵר
  choice: 书记
  rationale: סֹפֵר可指抄写人员，也可指王室秘书或书记官。此处结合宫廷语境译作“书记”，保留历史职能并便于现代读者理解。
- source_word: סֵפֶר
  choice: 一卷书
  rationale: סֵפֶר泛指书面文献或书，并不严格限定载体；在当时通常采用卷轴形制。“一卷书”兼顾语义范围与历史语境，脚注说明也可译作“书卷”或“文书”。
- source_word: נָתַן לִי
  choice: 给了我
  rationale: 希伯来语完成式叙述已发生的交付，中文用“给了我”自然表达该动作及其当前结果。
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: 希勒家祭司
  rationale: 人名按常用中文圣经音译处理，职衔译出；原文定冠词所标示的头衔在中文中自然置于人名之后。
- source_word: וַיִּקְרָא בוֹ
  choice: 诵读这书
  rationale: קרא在书面材料语境中指读出，介词ב表示从其中读取。中文“诵读这书”自然体现公开读出的动作；以“这书”回指前述书卷，避免生硬直译介词。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 在王面前
  rationale: 该短语表示处于王的面前或在王的在场之下；直译“在王面前”简洁、自然，并保留原文表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“禀报”体现王室场景；“诵读”表明是在王面前读出内容。保留原文先报告、后诵读的叙事次序。
