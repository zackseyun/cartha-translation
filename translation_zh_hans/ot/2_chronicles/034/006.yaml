  yaml_path: translation/ot/2_chronicles/034/006.yaml
  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: zh_hans
  text: 又在玛拿西、以法莲和西缅各城，远至拿弗他利，在这些城四围的废墟中[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末语的希伯来文本有困难。按传统读法，句末可理解为“在它们四围的废墟中”；这里的“它们”指前述各城或地区。
    reason: textual_variant
  - marker: b
    text: 或译：“在它们四围荒废的地方。”若按辅音文本较严格地理解，其中一词也可能读作“他们的房屋”；但本段描述拆毁祭祀设施的语境较支持“废墟”或“荒废之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: 又在……各城
  rationale: 保留连接词和地点介词；“各城”符合历史叙事的自然汉语表达，并能承接上文约西亚洁净各地的行动。
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: 玛拿西、以法莲和西缅
  rationale: 按现代中文圣经人名的通行译法音译这些支派兼地域名称，并保留并列关系。
- source_word: וְ/עַד נַפְתָּלִי
  choice: 远至拿弗他利
  rationale: עַד 表示行动所达到的地理界限；“远至”既自然，也传达范围一直延伸到拿弗他利的强调意味。
- source_word: ב/הר בתי/הם
  choice: 在各处……的废墟中
  rationale: 原文末语形式艰涩，按上下文采用地点义，并以“废墟”表达遭毁坏、荒废之处；不在正文中武断重构具体的希伯来文本。
- source_word: סָבִיב
  choice: 四周
  rationale: 该词表示周围、环绕的范围；“各处四周的废墟”在现代汉语中可表达分布于周边各处的荒废地点。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“又在”使本节与上文的连续行动自然衔接；“远至”清楚传达地理范围。因末语存在真实的文本和词义困难，正文采用最符合语境的译法，同时用两个脚注保留直译困难及“房屋／荒废之处”的可能性。
