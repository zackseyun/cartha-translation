base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: zh_hans
  text: 至于那位派你们来求问雅威[a]的犹大王，你们要对他这样说：“雅威——以色列的上帝——如此说：至于你所听见的那些话——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寻求雅威”或“请示雅威”。此处的希伯来语动词在先知求询的语境中可指寻求或求问。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל מֶלֶךְ יְהוּדָה
  choice: 至于……犹大王
  rationale: וְאֶל转向对另一对象传话；用“至于”自然标示话语转向，并保留“对王说”的方向关系，后文以“对他”明确表达。
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: 那位派你们……的
  rationale: 带定冠词的分词作限定语，指明犹大王就是派遣这群使者的人；“你们”保留希伯来语复数。
- source_word: לִדְרוֹשׁ בַּיהוָה
  choice: 来求问雅威
  rationale: דרשׁ与ב在本语境指为获得神谕而寻求、求问；“求问”兼顾主动寻求与请示神意的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质。
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: 你们要对他这样说
  rationale: 准确表达复数主语、指令语气和先知传信公式。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威……如此说
  rationale: 保留先知宣告的固定公式及希伯来语的完成式形式；汉语“如此说”自然引出随后的神谕。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直译所属结构，表明雅威与以色列的关系。
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: 至于你所听见的那些话—
  rationale: 用主题结构“至于”保留原文左置、悬置的句法；破折号表示话意要到下一节才完成，不擅自补足。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并避免以称号替代神名。
- issue: דרשׁ ביהוה的语义范围
  choice: 求问雅威
  alternative: 寻求雅威；请示雅威
  rationale: 此处是使团奉王差遣寻求神谕的场景。“求问”最贴合即时语境，同时不把动作弱化为一般性的敬虔追求。
- issue: 末句未完结构
  choice: 保留“至于……—”的悬置
  alternative: 将其补写成完整判断句
  rationale: 原文把“你所听见的那些话”置于句首，内容在下一节继续。保留悬置可呈现原有张力，避免提前解释其句法关系。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。两次使用“至于”分别标示说话对象的转向和末句的主题前置；虽有重复，却对应原文不同层次的篇章结构。以破折号保留跨节未完的神谕。
