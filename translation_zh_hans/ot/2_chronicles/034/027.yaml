  source_fidelity: 草稿总体准确保留了因果结构、两次“谦卑自己”、撕裂衣服与哭泣，以及雅威的宣告。然“你听见……就……”将“听见”与首次谦卑的关系略作了汉语式重排，且“责备”较原文“针对／反对这地方和居民所说的话”范围偏窄；原文所指是审判性信息，不限于责备言辞。
  naturalness: “心柔软”可保留字面意象，但脚注中的“容易受感”不够自然，也可能带有情绪易感的现代联想。修订为“内心柔软、乐于领受”较自然，并明确不是软弱。修订正文以逗号和“又”连贯处理长句，保持庄重现代汉语。
  terminology: “上帝”“雅威”“谦卑自己”与本段用语一致。“针对这地方和其中居民所说的话”比“责备这地方和其中居民的话”更贴近 עַל 的不利指向，同时不把原文未明说的具体审判内容过度明示。
  issues:
