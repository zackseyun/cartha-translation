revisions:
- from: 因为你的心柔软[a]，你听见上帝责备这地方和其中居民的话，就在上帝面前谦卑自己；你在我面前谦卑自己，撕裂衣服，在我面前哭泣，所以我也听见了。这是雅威的宣告。
  to: 因为你的心柔软[a]，你听见上帝针对这地方和其中居民所说的话时，便在上帝面前谦卑自己；又在我面前谦卑自己，撕裂衣服，在我面前哭泣，我也听见了——这是雅威的宣告。
  rationale: 修订只处理“责备”过窄及脚注措辞问题。“针对……所说的话”对应审判语境中 עַל 的不利指向，却不替原文补入具体审判术语；其余关键重复、神名和因果关系均予保留。
