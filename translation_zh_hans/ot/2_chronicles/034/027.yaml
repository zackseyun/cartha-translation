    rationale: 在此审判语境中，עַל 确有针对、反对的含义，但“责备”通常指谴责性言语，未能充分涵盖神对该地及居民所宣布的不利信息。宜译为“针对……所说的话”，保留原文的广度与不利方向。
  - severity: low
    issue: 脚注“容易受感”用语不够自然。
    rationale: 该说法在现代汉语中容易被理解为情绪敏感。原文惯用语强调内心柔软、 receptive 并谦卑，宜以更清晰中性的说明表达。
