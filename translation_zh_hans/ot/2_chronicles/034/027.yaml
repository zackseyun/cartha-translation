source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/לִּ/פְנֵ֣י אֱלֹהִ֗ים בְּ/שָׁמְעֲ/ךָ֤ אֶת דְּבָרָי/ו֙ עַל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/עַל יֹ֣שְׁבָ֔י/ו וַ/תִּכָּנַ֣ע לְ/פָנַ֔/י וַ/תִּקְרַ֥ע אֶת בְּגָדֶ֖י/ךָ וַ/תֵּ֣בְךְּ לְ/פָנָ֑/י וְ/גַם אֲנִ֥י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: zh_hans
  text: 因为你的心柔软[a]，你听见上帝针对这地方和其中居民所说的话时，便在上帝面前谦卑自己；又在我面前谦卑自己，撕裂衣服，在我面前哭泣，我也听见了——这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柔软”也可译为“柔和”。这里形容内心乐于领受上帝的话，并谦卑回应，不是指软弱。
    reason: 说明希伯来语 רַךְ 与“心”连用时的惯用含义，并保留其字面意象。
lexical_decisions:
- source_word: יַעַן
  choice: 因为……所以
  rationale: 引出雅威回应约西亚的原因；汉语用“因为……所以”清楚呈现整句的因果结构。
- source_word: רַךְ לְבָבְךָ
  choice: 你的心柔软
  rationale: 保留 רַךְ“柔软”的核心意象；与“心”连用表示内心容易受感、肯谦卑回应，而非性格软弱。
- source_word: וַתִּכָּנַע
  choice: 你……谦卑自己
  rationale: 这里的 Niphal 形式在语境中表示约西亚主动降卑；两次出现均作同样翻译，以保留原文重复。
- source_word: מִלִּפְנֵי אֱלֹהִים / לְפָנַי
  choice: 在上帝面前 / 在我面前
  rationale: 自然表达身处上帝面前并向他谦卑的含义，同时保留从第三人称“上帝”转为第一人称“我”的原文措辞。
- source_word: בְּשָׁמְעֲךָ
  choice: 你听见……就
  rationale: ב 加不定词在此表达时间关系；“听见……就”符合现代汉语，并连接其后的谦卑反应。
- source_word: דְּבָרָיו
  choice: 上帝……的话
  rationale: 后缀在上下文中指上帝；汉语明确所指，可避免“他的话”在长句中产生歧义。
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: 责备这地方和其中居民
  rationale: 审判语境使 עַל 带有针对、反对之意；“责备”比单纯“论到”更能体现不利信息，又不额外具体化审判内容。
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: 撕裂衣服
  rationale: 直译这一表示悲痛和悔悟的行动；“衣服”是自然、易懂的现代用语。
- source_word: וַתֵּבְךְּ
  choice: 哭泣
  rationale: 准确表达 בכה 的哀哭含义，并保持庄重语体。
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: 所以我也听见了
  rationale: 保留“我也”的呼应；汉语在语境中无需补出原文没有明示的宾语“你”。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 保留 נְאֻם 的郑重神谕公式，并将四字神名 יְהוָה 音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”较直接地区别神名与称号，并符合所给审校层的决定。
- issue: “心柔软”的属灵含义
  choice: 正文保留意象，并以脚注说明是易受感、肯谦卑回应
  alternative: 直接译作“你的心敏锐”或“你的心受感动”
  rationale: 直译保留希伯来语的身体隐喻及其开放性；脚注防止现代读者误解为软弱，同时不把含义缩窄成单一心理状态。
- issue: עַל 在审判语境中的关系
  choice: 责备这地方和其中居民
  alternative: 论到这地方和其中居民；攻击这地方和其中居民
  rationale: 上下文是审判信息，因此不宜仅译作中性的“论到”；但“攻击”又可能过度强化，故采用“责备”呈现不利指向。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“谦卑自己”和“在我面前”的重复，以呈现原文的强调；用分号梳理希伯来语长句，但不改变因果关系。
