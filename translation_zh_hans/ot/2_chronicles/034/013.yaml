base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: zh_hans
  text: 他们管理搬运重物的人，并督导所有从事各项事务的工人；利未人中有些人作书记、官员和守门人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: 管理搬运重物的人
  rationale: עַל在此表示管理、督导的职权；סַבָּלִים特指承担搬运重物工作的人。此译法准确而符合现代汉语表达。
- source_word: וּמְנַצְּחִים
  choice: 督导
  rationale: 此处נצח的分词表示对工作人员进行监督和指挥；“督导”既保留行政监督之意，也与上下文自然衔接。
- source_word: לְכֹל עֹשֵׂה מְלָאכָה
  choice: 所有……的工人
  rationale: 保留כֹל的全称范围以及עֹשֵׂה的行动含义，用现代汉语整合为“所有从事……的工人”。
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: 从事一项又一项事务
  rationale: 希伯来文重复עֲבוֹדָה，可能具有逐项分配或涵盖各类事务的作用。“一项又一项事务”保留表层重复及其分配意味，不把原文含义限定为单一解释。
- source_word: וּמֵהַלְוִיִּם
  choice: 利未人中还有
  rationale: מִן在这里具有部分含义，表示利未人当中有些人担任随后列出的职务；“中还有”符合自然汉语。
- source_word: סוֹפְרִים
  choice: 书记
  rationale: 该词指书写、记录事务的人员；“书记”保留古代文书职务的含义，又比单纯音译或过度解释更简洁。
- source_word: שֹׁטְרִים
  choice: 官员
  rationale: 该词指承担行政或监督职责的人。“官员”语义宽度与原文相称，避免擅自限定具体职权。
- source_word: שׁוֹעֲרִים
  choice: 守门人
  rationale: 该词指在门口值守的人，尤其用于圣殿职务；“守门人”是直接且通行的对应词。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“搬运重物的人”比“负重者”更便于普通读者理解；分号区分监督工人的职责与部分利未人所担任的其他职务。
