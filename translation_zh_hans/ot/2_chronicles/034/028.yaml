  text: הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ אֶל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁ֨ר אֲנִ֥י מֵבִ֛יא עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹשְׁבָ֑י/ו וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: zh_hans
  text: “看哪，我要使你归到你列祖那里[a]；你必平安地[b]归入你的墓地[c]。你的眼睛不会看到我要降在这地方和这里居民身上的一切灾祸。”他们便把这话回报王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列祖”也可译作“祖先”。这是希伯来语中表示死后与先人同归的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 这里的“平安”着重于约西亚在灾祸临到以前离世，因而不会亲眼看见灾祸；这句话不一定表示他的死亡过程绝无暴力。
    reason: theological_tension
  - marker: c
    text: 原文作“你的坟墓”（复数），可能泛指祖先的墓地或墓群。
    reason: source_form
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留宣告性的提示语；“我要”结合后面的分词结构，表达已经确定、即将实行的行动。
- source_word: אֹסִפְךָ אֶל אֲבֹתֶיךָ
  choice: 使你归到你列祖那里
  rationale: 这是死亡后与先祖同归的惯用表达。中文用“归到列祖那里”自然庄重，同时不把经文本身扩写为解释。
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: 归入你的墓地
  rationale: 原文继续使用“收聚”的被动形式，并以复数“坟墓”指向安葬之处。中文“归入你的墓地”保留死亡与安葬的意象，也避免“归入你的多个坟墓”的误解。
- source_word: בְּשָׁלוֹם
  choice: 平安地
  rationale: 保留 שָׁלוֹם 的宽广含义，不预先限定为死亡过程绝无暴力；后句说明约西亚不会亲眼见到将临的灾祸。
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: 你的眼睛不会看到
  rationale: 保留原文以“你的眼睛”为主语的具体而强调性的表达。
- source_word: בְּכֹל הָרָעָה
  choice: 一切灾祸
  rationale: רָעָה 在审判语境中指临到地方和居民的灾难，而非抽象的道德邪恶。
- source_word: אֲנִי מֵבִיא
  choice: 我要降
  rationale: 分词表达已经确定、将要临到的行动；“降在……身上”符合现代中文中灾祸临到人的表达。
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: 他们便把这话回报王
  rationale: 该短语意为把求问所得的信息带回并报告给王；“回报”简洁体现了返回答复的语义。
theological_decisions:
- issue: “平安地”与约西亚后来战死之间的张力
  choice: 保留“平安地”的宽泛表达，并在注释中指出下句着重说明他不会看见将临的灾祸。
  alternative: 把它直接译成“安然去世”或断定他必不会死于暴力。
  rationale: 原文没有明确说明死亡方式；紧接着的“不看到……灾祸”解释了这项应许的重点。译文不应替经文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“列祖”“灾祸”“回报王”保留历史叙事的经文语体；避免生硬直译“被收聚到你的多个坟墓”，并用脚注交代原文复数形式。
