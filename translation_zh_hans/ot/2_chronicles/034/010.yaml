language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: zh_hans
  text: 他们把银子交给奉派监管雅威殿[a]的工程负责人，又把银子交给在雅威殿施工的工人，用来修缮并加固殿宇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“雅威的房屋”，即圣殿。
    reason: cultural_note
  - marker: b
    text: “修缮并加固”也可译作“修复并使殿宇坚固”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 交在……手中／又把……用于
  rationale: נתן可表示“给、交付、放置”。首处结合עַל־יַד译作“交在……手中”，体现托付；第二处按款项用途自然译为“把……用于”。
- source_word: עַל יַד
  choice: 交在……手中
  rationale: 该习语表示交由某人掌管或经手；中文保留“手中”的具体意象，同时清楚表达委托关系。
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: 工人
  rationale: 此处单数形式具有集合意义，在修殿语境中指从事工程的人员。
- source_word: הַמֻּפְקָדִים
  choice: 受派管理
  rationale: פקד的被动分词表示被委派承担监管职责；“受派管理”兼顾被动委任与管理职能。
- source_word: בְּבֵית יְהוָה
  choice: 管理雅威殿／在雅威殿
  rationale: בֵּית יְהוָה直译为“雅威的殿（房屋）”，语境明确指圣殿。首处介词关系结合“受派”表达为管理该殿，次处表达工作地点。
- source_word: אֹתוֹ
  choice: 银子
  rationale: 阳性单数代词回指上文交付的款项。中文若仅译“它”指代生硬且不够清楚，因此将隐含所指明译为“银子”。
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: 做工的工人
  rationale: 保留עשה相关表达的重复，同时用自然的现代汉语呈现持续施工之意。
- source_word: לִבְדּוֹק
  choice: 修缮
  rationale: בדק虽可有“查看、检查”之义，但在圣殿工程语境中指修补、修复破损；“修缮”准确且符合建筑语域。
- source_word: וּלְחַזֵּק
  choice: 并加固
  rationale: חזק的使役意义是使建筑坚固、稳固；“加固”准确表达结构工程含义。
- source_word: הַבָּיִת
  choice: 殿宇
  rationale: 字面为“房屋”，此处回指雅威的殿。译作“殿宇”既明确所指，又避免末尾单称“房子”的歧义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的中文音译呈现四字神名，将专名与“主”等称号区分开来。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用以色列上帝的专名。译作“雅威”较直接地音译神名，不以称号替代，也不在本节中加入额外神学解释。
- issue: בֵּית יְהוָה所指为何
  choice: 雅威殿
  alternative: 雅威的房屋／圣殿
  rationale: 该短语字面为“雅威的房屋”，在本段历史与工程语境中明确指圣殿。“雅威殿”自然、庄重，并由脚注说明字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“银子”依据上文明确代词所指；分号保留原文两次交付款项的推进关系。所有脚注标记均置于正文中，且分别说明圣殿称谓与工程动词的可替代表达。
