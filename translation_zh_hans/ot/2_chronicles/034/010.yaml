  to: 他们把银子交给奉派监管雅威殿[a]的工程负责人，又把银子交给在雅威殿施工的工人，用来修缮并加固殿宇[b]。
  rationale: 修订恢复两次“交付”的动作与款项交给施工人员的关系；以“奉派监管……的工程负责人”表达被委派的监管职分，同时避免与实际施工的工人混淆。脚注内容保留，仅将[b]移至所注释的词组之后。
