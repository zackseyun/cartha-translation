base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: zh_hans
  text: 耶和华如此说：“看哪，我必使灾祸临到这地方和住在其中的人，就是他们在犹大王面前所宣读的书卷[b]上所写的一切咒诅[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切誓约咒诅”，强调律法书中因盟约而宣告的制裁。
    reason: lexical_alternative
  - marker: b
    text: “书卷”也可译作“书”；原词可指书写的卷轴或文献。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的专名形式，明确保留原文的神名。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合自然的现代中文表达。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留原文提示听者注意的宣告力量；与“我要”连用，自然表达即将施行的行动。
- source_word: מֵבִיא רָעָה
  choice: 降灾祸
  rationale: 此处 רָעָה 指审判所带来的灾难，而非道德上的邪恶；“降灾祸”也清楚表达灾祸来自耶和华的审判。
- source_word: הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: 按原文保留概括性的地点指称，不在译文中擅自限定为耶路撒冷或犹大。
- source_word: יוֹשְׁבָיו
  choice: 其中的居民
  rationale: 准确表达“住在其中的人”，并使中文简洁自然。
- source_word: אֵת כָּל הָאָלוֹת
  choice: 一切咒诅
  rationale: אָלָה 在这里指律法书中与盟约制裁有关的咒诅；正文采用普通读者易懂的“咒诅”，脚注保留“誓约咒诅”的语义色彩。
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: 书卷上写的
  rationale: “书卷”适合古代书写载体，也不排除其作为成文文献的含义；“上写的”贴近介词 עַל 的表述。
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: 他们在……面前所宣读的
  rationale: 保留原文主动复数动词中未明说的“他们”，并以“宣读”自然表达在王面前朗读文献。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 简洁、准确地表达原文的属格结构，符合现代中文习惯。
theological_decisions:
- issue: 神所降下的 רָעָה 的性质
  choice: 灾祸
  alternative: 祸患；灾难；恶
  rationale: 上下文所说的是盟约审判及其灾难性后果。“灾祸”保留审判的严重性，又避免让现代读者误以为原文称神施行道德上的恶。
- issue: הָאָלוֹת 的盟约含义
  choice: 正文译作“一切咒诅”，脚注说明“誓约咒诅”
  alternative: 一切誓约咒诅
  rationale: “咒诅”最为清楚自然，而脚注提示这些不是泛指恶言，而是律法书中盟约性的制裁，不把技术性解释强加进正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“耶和华如此说”和“看哪”保留先知宣告的正式语体；其余句法尽量自然流畅。脚注标记分别紧随“咒诅”和“书卷”，与所解释的词对应。
