    rationale: אֶת־יְהוָה אֱלֹהֵיהֶם意为“耶和华——他们的上帝”。中文若不加破折号或其他连接，专名和名词短语会不自然地连缀。
  - severity: low
    issue: “以色列人所有的各地”表达含混。
    rationale: אֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל指属于以色列子民的各地/土地；改为“以色列子民所属的各地”可更清楚保留归属和复数地域。
  revised_text: 约西亚从以色列子民所属的各地除掉了一切可憎之物，又使以色列境内所有的人都事奉耶和华——他们的上帝。在约西亚有生之年，他们都没有偏离耶和华——他们列祖的上帝。
