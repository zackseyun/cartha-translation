revisions:
- from: 约西亚从以色列人所有的各地除掉了一切可憎之物，又使以色列境内所有的人都事奉耶和华他们的上帝。他在世的日子，他们都没有偏离耶和华他们列祖的上帝。
  to: 约西亚从以色列子民所属的各地除掉了一切可憎之物，又使以色列境内所有的人都事奉耶和华——他们的上帝。在约西亚有生之年，他们都没有偏离耶和华——他们列祖的上帝。
  rationale: 修订仅处理汉语句法和归属关系的清晰度：以“以色列子民所属的各地”对应“属于以色列子民的各地”，并以破折号呈现“耶和华——他们的上帝”这一同位结构。将时间短语明确为“在约西亚有生之年”，避免“他”在前句主语转换后的潜在指代停顿，且不改变原文所表达的持续期间。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:38Z'
