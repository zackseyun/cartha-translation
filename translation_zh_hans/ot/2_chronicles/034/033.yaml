source:
  edition: WLC
  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: zh_hans
  text: 约西亚从以色列子民所属的各地除掉了一切可憎之物，又使以色列境内所有的人都事奉耶和华——他们的上帝。在约西亚有生之年，他们都没有偏离耶和华——他们列祖的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסַר
  choice: 除掉
  rationale: 使役形在这里表示移除、除去；“除掉”自然且符合宗教改革的语境。
- source_word: הַתּוֹעֵבוֹת
  choice: 可憎之物
  rationale: 该词在本段主要指上帝所憎恶的偶像及相关宗教事物；此译保留强烈的宗教与盟约色彩，又不把所指限于物件或行为之一。
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: 从以色列人所有的各地
  rationale: 保留复数“各地”和介词结构所表达的归属关系；现代汉语以“以色列人”自然涵盖“以色列的子孙”。
- source_word: וַיַּעֲבֵד
  choice: 使……事奉
  rationale: 使役形表明约西亚促使或要求众人事奉上帝；“使……事奉”保留使役力度，但不额外断言具体强制方式。
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: 以色列境内所有的人
  rationale: 分词字面为“被找到的”，在此惯用地指当时身在或居于以色列境内的人；汉语如此表达可避免“被搜寻发现”的误解。
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: 事奉耶和华他们的上帝
  rationale: עבד既包括敬拜，也有更广泛的忠诚服事之义；“事奉”最能保留这种盟约性的广度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中对四字神名最通行、最易识别的音译，明确保留专名而不以“主”替代。
- source_word: כָּל יָמָיו
  choice: 他在世的日子
  rationale: 指约西亚一生或执政期间；结合后句的复数主语，此译清楚表达约西亚在世期间百姓持续忠于耶和华。
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: 没有偏离耶和华
  rationale: 希伯来语意为没有转离跟随耶和华；“偏离”在汉语中简洁保留背离与不再跟随的意象。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们列祖的上帝
  rationale: “列祖”保留复数父辈及传统盟约用语，同时在现代中文圣经语体中自然易懂。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名，因此正文保留专名。中文受众对“耶和华”最为熟悉；“雅威”较贴近学术重建的发音，但两者均为音译。
- issue: 是否弱化 וַיַּעֲבֵד 的使役力度
  choice: 使……事奉
  alternative: 带领……事奉
  rationale: 使役词形表明约西亚主动促使或要求境内的人事奉耶和华；“带领”会弱化原文力度，“强迫”则可能过度具体化。
- issue: כָּל יָמָיו 与后句主语的关系
  choice: 理解为约西亚在世期间，百姓没有偏离
  alternative: 把“他在世的日子”理解为单数人物自身的忠诚
  rationale: “他的日子”中的单数指约西亚，而“他们没有偏离”的复数动词回指以色列境内的人；译文保留这种主语转换。
- issue: אֲבוֹתֵיהֶם 的性别与盟约含义
  choice: 列祖
  alternative: 祖先
  rationale: “列祖”既保留原文“父辈”的男性家族措辞，也承载以色列传统中的盟约历史意味；“祖先”更中性但会削弱这一固定表达。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句法适度贴近希伯来文，同时避免“所有被找到的人”等容易造成误读的生硬直译。神名用“耶和华”，上帝称谓用“上帝”；“事奉”“列祖”保留经文的盟约语域。
