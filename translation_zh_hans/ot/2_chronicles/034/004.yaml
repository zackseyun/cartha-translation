source:
  edition: WLC
  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: zh_hans
  text: 他们在他面前拆毁了诸巴力的祭坛；祭坛上方的香坛[a]，他都砍倒了。他又把亚舍拉[b]、雕刻的神像和铸造的神像打碎，碾成粉末，撒在那些曾向它们献祭之人的坟墓上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香坛”原文含义不确定，也可译作“太阳柱”，可能指与太阳崇拜有关的祭祀柱。
    reason: 保留חמנים的词义不确定性及主要替代译法。
  - marker: b
    text: “亚舍拉”也可译作“亚舍拉柱”；原词可指与女神亚舍拉有关的祭祀物件。
    reason: 避免把אשרים过度限定为某一种具体形制。
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: 他们……拆毁了
  rationale: 保留希伯来文复数动词的主语“他们”，并以“拆毁”表达נתץ用于毁坏建筑或设施的含义。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 贴近字面“在他面前／当着他的面”，表明这事在约西亚亲自监督或在场时进行。
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: 诸巴力的祭坛
  rationale: 用“诸巴力”体现בעלים的复数形式，可能涉及巴力的不同地方性表现或崇拜形态。
- source_word: הַחַמָּנִים
  choice: 香坛
  rationale: 此词含义有争议；上下文容许理解为设在巴力祭坛上方的焚香设施。正文采用通顺而合乎语境的译法，并在脚注保留“太阳柱”这一重要可能。
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: 祭坛上方的
  rationale: 将关系从句理解为修饰前面的חמנים，并明确“它们”所指的是巴力祭坛，使中文自然清楚。
- source_word: גִּדֵּעַ
  choice: 砍倒
  rationale: גדע表示砍下、砍倒，适合描述对高立祭祀设施的摧毁。
- source_word: הָאֲשֵׁרִים
  choice: 亚舍拉
  rationale: 采用音译，保留该词可能指亚舍拉崇拜物、柱像或与女神亚舍拉有关之物的范围，避免正文过早限定为木柱。
- source_word: הַפְּסִלִים
  choice: 雕刻的神像
  rationale: 体现פסילים是雕刻而成的祭祀图像，比笼统的“偶像”更具体。
- source_word: הַמַּסֵּכוֹת
  choice: 铸造的神像
  rationale: 体现מסכות所指的铸造金属神像及其制作方式。
- source_word: שִׁבַּר וְהֵדַק
  choice: 打碎，碾成粉末
  rationale: 两个连续动词分别表达击碎和进一步碾细；“碾成粉末”保留第二个动词所呈现的彻底毁坏程度。
- source_word: וַיִּזְרֹק
  choice: 撒
  rationale: 在神像已被碾碎的语境中，“撒”自然表达将其碎屑抛散在坟墓上的动作。
- source_word: הַזֹּבְחִים לָהֶם
  choice: 那些曾向它们献祭之人
  rationale: 保留介词所表达的对象关系；“曾”说明坟中之人生前向这些崇拜对象献祭。
theological_decisions:
- issue: אֲשֵׁרִים所指为何
  choice: 亚舍拉
  alternative: 亚舍拉柱
  rationale: 原词可指与亚舍拉有关的祭祀物件，并不必然只指木柱；正文音译以保留历史与词义上的开放性，脚注列出常见解释。
- issue: הַחַמָּנִים所指为何
  choice: 香坛
  alternative: 太阳柱
  rationale: 该词词义不确定，可能指焚香设施，也可能指与太阳崇拜有关的祭祀柱。正文采用符合本段空间描述的译法，同时以脚注明示另一重要解释。
- issue: בְּעָלִים的复数表达
  choice: 诸巴力
  alternative: 巴力
  rationale: 保留原文复数，避免把各地或各种巴力崇拜形态无声归并为单一称谓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“他们”与随后“他”的转换刻意保留希伯来文先复数、后单数的动词变化；分号帮助读者辨明众人拆毁祭坛与约西亚继续砍倒、粉碎祭祀物件的动作层次。
