  text: וְ/כֻתְּת֥וּ גוֹי בְּ/ג֖וֹי וְ/עִ֣יר בְּ/עִ֑יר כִּֽי אֱלֹהִ֥ים הֲמָמָ֖/ם בְּ/כָל צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: zh_hans
  text: 一国被一国击垮，一城被一城摧毁，因为上帝用各样患难使他们陷入混乱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们惊惶失措”。
    reason: המם兼有扰乱、使慌乱或使惊惶的语义，脚注保留其可能侧重心理恐慌的译法。
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: 被……击垮／被……摧毁
  rationale: כתת的Pual完成式表示遭到击碎、击垮。按中文搭配，国家用“击垮”，城市用“摧毁”，共同表达同一个希伯来动词所描绘的毁坏。
- source_word: גוֹי בְּגוֹי
  choice: 一国被一国
  rationale: 介词ב在这里表示敌对行动中的施事关系；“一国被一国”既保留原文被动结构，也自然表达国与国互相攻伐。
- source_word: וְעִיר בְּעִיר
  choice: 一城被一城
  rationale: 与前句平行，保留原文简洁的逐一、彼此冲突结构。
- source_word: כִּי
  choice: 因为
  rationale: 这里引出上述毁灭局面的原因。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该复数形名词在此与单数动词连用，语境中指独一的上帝。
- source_word: הֲמָמָם
  choice: 使他们陷入混乱
  rationale: המם表示使人慌乱、惊惶或陷入混乱；此译保留上帝主动造成动荡的语义，也符合现代中文表达。
- source_word: בְּכָל צָרָה
  choice: 用各样患难
  rationale: 介词ב可表达手段或伴随情形，כָל צָרָה表示各种各样的困苦、患难；“用各样患难”明确保留其工具性含义。
theological_decisions:
- issue: 灾祸的施事者
  choice: 明确译为“上帝用各样患难使他们陷入混乱”
  alternative: “上帝容许他们在患难中陷入混乱”
  rationale: 希伯来文以上帝为主动动词的主语，因此不把上帝的行动弱化为仅仅许可；同时不添加经文本身没有给出的神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“一国被一国……一城被一城……”保留希伯来文紧凑的平行结构；对国家和城市分别使用自然的中文动词搭配，避免机械重复。
