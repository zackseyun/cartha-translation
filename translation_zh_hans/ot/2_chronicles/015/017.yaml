  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: zh_hans
  text: 然而，以色列境内的丘坛没有废除；亚撒的心一生都是完全的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚撒的心一生都是完整的”。这里的“完整／完全”表示心志完整、专一，并非说他毫无过失。
    reason: 保留שָׁלֵם的字面意象及其在此语境中所含的专一意味，且不在正文补出原文未明说的归向对象。
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: 指设在高处或其他地点的祭祀场所；“丘坛”是简洁而较为通行的圣经用语。
- source_word: לֹא סָרוּ מִיִּשְׂרָאֵל
  choice: 没有从以色列境内废除
  rationale: סור在此指使祭祀设施消失、将其除去；补出“境内”可自然表达מן所标示的范围。
- source_word: לְבַב אָסָא הָיָה שָׁלֵם
  choice: 亚撒的心……完全归向上帝
  rationale: שָׁלֵם的基本意象是完整、无二；结合“心”的语境，表达专一忠诚，同时避免误解为亚撒毫无过失。
- source_word: כָּל יָמָיו
  choice: 一生
  rationale: 这是现代汉语对“他所有的日子”的自然、准确表达。
theological_decisions:
- issue: 丘坛未废与亚撒之心完整之间的张力
  choice: 保留“然而……不过……”的转折，不解释二者如何协调
  alternative: 将丘坛解释为百姓单方面保留，或限定为合法祭祀场所
  rationale: 原文同时陈述两项事实，并未明确消解其张力，译文不应擅自补入归责或祭祀性质。
- issue: “心是完整的”的神学含义
  choice: 译作“心……完全归向上帝”，并加注说明字面意义
  alternative: “心完全”“心正直”“全心忠于耶和华”
  rationale: 正文需让现代读者明白这是忠诚与专一的评价，而非道德上绝对无罪；原文此处未明说神名，因此正文采用“上帝”属于语义补足，并以脚注保留字面形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“丘坛”保留经文文化背景；分号及双重转折清楚呈现原文两项评价之间的张力。
