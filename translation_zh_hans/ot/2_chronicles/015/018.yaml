base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/018.yaml
  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: zh_hans
  text: 他把他父亲所献的圣物和自己所献的圣物带进上帝的殿里：银、金和器皿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו וְקָדָשָׁיו
  choice: 他父亲分别为圣的物品和他自己分别为圣的物品
  rationale: 两个同源词在此指归为圣、奉献给上帝的财物；译作“分别为圣的物品”既保留其圣别含义，也不额外断定这些物品奉献的具体方式。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝的殿
  rationale: 在本叙事语境中指圣殿；“上帝的殿”自然且贴近原文。
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: 金、银和器皿
  rationale: 按现代汉语列举贵重物品的自然次序表达；“器皿”保留 כֵלִים 可指各类器具、器物的宽泛含义。
- source_word: וַיָּבֵא
  choice: 带进
  rationale: 该使役式动词表示使物品进入，即带入；结合 בֵּית 表达为“带进……殿里”。
theological_decisions:
- issue: 圣物的性质
  choice: 分别为圣的物品
  alternative: 奉献的礼物／圣物
  rationale: 原文说明这些物品已被归为圣，却未明确交代它们究竟是礼物、战利品还是其他类别；采用较宽泛的表述以保留原文空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“分别为圣”传达宗教语境中的专属归属，“物品”则避免把范围过度限定为礼物。
