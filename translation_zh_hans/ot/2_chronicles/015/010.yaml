lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: 他们……聚集
  rationale: קבץ 的尼法勒式在此表示众人聚集起来，并承接叙事发展；现代汉语用主动形式“聚集”即可自然表达这种共同会集的含义。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般汉语中通行的地名译法。
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: 三月
  rationale: 原文直译为“第三个月”；在上下文的王年纪年表达中，汉语“ 三月”自然简洁，且不把它误解为现代公历三月。
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: 第十五年
  rationale: 介词 לְ 与“年”构成纪年用语，汉语惯用“第十五年”表达。
- source_word: לְמַלְכוּת אָסָא
  choice: 亚撒作王
  rationale: מַלְכוּת 在此指亚撒的统治时期；“作王”符合中文历史纪年的自然表达，并准确保留王年含义。
