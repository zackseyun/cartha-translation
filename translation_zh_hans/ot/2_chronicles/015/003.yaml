  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: zh_hans
  text: 以色列长期没有真神[a]，没有教导人的祭司，也没有训诲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真神”或译“真理的神”或“信实的神”。
    reason: lexical_alternative
  - marker: b
    text: “训诲”或译“律法”或“教导”。希伯来语“妥拉”可按语境表示训诲、教导或律法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים לְיִשְׂרָאֵל
  choice: 以色列长期
  rationale: 希伯来语直译为“以色列有许多日子”，表达持续很久的状态；“以色列长期”在现代汉语中自然简洁，也不额外限定具体年代。句首连接词按上下文承接关系不机械译出。
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: 没有真神
  rationale: לְלֹא表示缺少、没有；אֱלֹהֵי אֱמֶת可指“真神”，也可理解为“真理的神”或“信实的神”。正文采用最自然且符合语境的“真神”，并以脚注保留其词义张力。
- source_word: וּלְלֹא כֹּהֵן מוֹרֶה
  choice: 没有教导人的祭司
  rationale: מוֹרֶה是ירה的分词，表示施行教导的人。“教导人的祭司”清楚呈现祭司的教导职分，比“教导的祭司”更符合现代汉语习惯。
- source_word: וּלְלֹא תוֹרָה
  choice: 也没有训诲
  rationale: תּוֹרָה在此可泛指教导、训诲，也可传统地译作“律法”。“训诲”保留较宽的语义范围，并与前面的祭司教导相呼应；脚注列出其他常见译法。
theological_decisions:
- issue: אֱלֹהֵי אֱמֶת的理解
  choice: 真神
  alternative: 真理的神；信实的神
  rationale: 结构本身容许“真实的神”和“具有真实、信实属性的神”等理解。正文用自然的“真神”，脚注保留其他可能，不把经文限定为单一神学阐释。
- issue: תּוֹרָה的译法
  choice: 训诲
  alternative: 律法；教导
  rationale: 该词的语义不限于成文法规，在祭司施教的语境中可指神圣教导。译作“训诲”既保持庄重，也避免无根据地缩窄为法典意义。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。三个“没有”保留原文的排比结构；“长期”自然表达“许多日子”，不添加原文未明说的具体时间范围。
