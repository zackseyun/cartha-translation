base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: zh_hans
  text: 那一天，他们从所带来的战利品中向耶和华献祭：七百头牛和七千只羊[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊”原文泛指小型家畜，可包括绵羊和山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: 献……作祭
  rationale: זבח在祭祀语境中指宰献牲畜。“献……作祭”自然明确，保留礼仪含义。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 介词ל标明祭物所献的对象；יהוה采用现代中文圣经读者熟悉的专名“耶和华”。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 准确、自然地表达指示性的时间短语。
- source_word: מִן הַשָּׁלָל הֵבִיאוּ
  choice: 把所带来的战利品
  rationale: שׁלל指战争中夺得的财物或牲畜；关系结构“所带来的”保留动作已经发生的语境关系。
- source_word: בָּקָר
  choice: 牛
  rationale: 该集合名词泛指牛类牲畜；中文按数量计数时用“牛……头”最自然。
- source_word: וְצֹאן
  choice: 羊群
  rationale: צֹאן是集合名词，可包括绵羊和山羊；“羊群”比单说“绵羊”更能保留其宽泛语义。
- source_word: שְׁבַע מֵאוֹת / שִׁבְעַת אֲלָפִים
  choice: 七百 / 七千
  rationale: 直接对应原文基数词，并配合中文量词“头、只”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，避免以“主”替代专名；“雅威”是更接近学术重构发音的另一种音译。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“献给耶和华作祭”清楚表达祭祀行为；数量使用符合现代汉语习惯的量词。原文“战利品”已足以表达战争所得，无需另加同义脚注。
