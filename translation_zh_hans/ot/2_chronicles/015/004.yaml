base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: zh_hans
  text: 但他们[a]在患难中归向耶和华、以色列的神，寻求他，他就被他们寻见了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更贴近原文形式可译作：“他在患难中”；这里的单数“他”集合性地指以色列。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们就寻见了他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 归向
  rationale: שׁוב在此不是单指空间上的返回，而是指以色列在疏离之后重新转向神；“归向”自然、庄重，也保留关系恢复的意味。
- source_word: בַּצַּר לוֹ
  choice: 他们在患难中
  rationale: 原文后缀为单数“他”，但上下文以集合性的以色列为所指，后续代词也是复数；正文用“他们”清楚传达集体含义，并以脚注保留形式上的单数。
- source_word: עַל יְהוָה
  choice: 归向耶和华
  rationale: עַל与שׁוב连用，在此表示转回、归向某人；现代汉语用“归向”最能传达这一关系性动作。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译“耶和华”，使其与称号“以色列的神”有别。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 直接保留原文的属格结构和圣约身份指称。
- source_word: וַיְבַקְשֻׁהוּ
  choice: 寻求他
  rationale: בקשׁ以神为宾语时，常指人在依靠、敬拜和祈求中寻求神；“寻求他”准确而自然。
- source_word: וַיִּמָּצֵא לָהֶם
  choice: 他就让他们寻见了
  rationale: 原文Nifal形式可直译为“被他们寻见”；这里用“让他们寻见”避免中文被动式可能带来的偶然发现之感，同时保留神回应寻求者的主动许可意味。脚注列出更形式对应的译法。
theological_decisions:
- issue: 开头单数后缀的集合性所指
  choice: 正文译为复数“他们在患难中”
  alternative: 按形式译为“他在患难中”，其中“他”集合性地指以色列
  rationale: 前后语境谈论作为整体的以色列，且本节后面的动词宾语和介词后缀为复数。正文采用自然汉语的复数表达，脚注保留原文形式。
- issue: וַיִּמָּצֵא לָהֶם中的神圣回应与被动语态
  choice: 译为“他就让他们寻见了”
  alternative: 译为“他就被他们寻见了”
  rationale: 原文容许直接被动译法，也可在以神为主语的语境中表达他应允人寻求。正文用使动式保留神的能动性，但以脚注呈现形式上更直接的被动译法，不排除原文的语态张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“患难”“归向”“寻求”符合经文语域但不显古奥；保留“耶和华”作为专名。所有脚注标记均已置于正文相应位置。
