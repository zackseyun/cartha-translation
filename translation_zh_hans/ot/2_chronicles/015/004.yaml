  to: 但他们[a]在患难中归向耶和华、以色列的神，寻求他，他就被他们寻见了[b]。
  rationale: 修订将脚注a移至其实际所说明的集合性“他们”，补足神名后同位语的顿号，并把“让他们寻见了”改为“被他们寻见了”，以保留原文Nifal被动式，而不在正文中预先解释其可能蕴含的神主动回应。脚注b提供更自然的主动语序作为替代，且不替代正文的语态信息。
