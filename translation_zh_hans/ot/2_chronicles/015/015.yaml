  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: zh_hans
  text: 犹大众人都因这誓言而欢喜，因为他们全心起誓，一心一意地寻求他；他让他们寻见[a]。雅威使他们四境安宁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“他被他们寻见。”
    reason: 保留 וַיִּמָּצֵא לָהֶם 的被动形式及其真实歧义。
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ כָל־יְהוּדָה
  choice: 犹大众人都……欢喜
  rationale: 将“全犹大”按其集体所指自然表达为“犹大众人”，同时保留 כָל 的整体范围。שׂמח 译为“欢喜”，符合共同立誓的喜乐语境。
- source_word: עַל הַשְּׁבוּעָה
  choice: 因这誓言
  rationale: עַל 在情感动词之后表示引发欢喜的对象或原因；“因这誓言”在现代汉语中清楚自然。
- source_word: בְכָל־לְבָבָם נִשְׁבָּעוּ
  choice: 全心起誓
  rationale: 保留“心”的意象和全然投入之意；“起誓”准确表达 נשבע。
- source_word: וּבְכָל־רְצוֹנָם בִּקְשֻׁהוּ
  choice: 尽意寻求他
  rationale: רָצוֹן 在此包含意愿、愿望和甘心投入；“尽意”既与“全心”形成平行，也避免只译成情感性的“渴望”或副词性的“甘心”。代词“他”保留原文形式。
- source_word: וַיִּמָּצֵא לָהֶם
  choice: 他也让他们寻见
  rationale: 原文 Niphal 形式直译为“被他们寻见”，在神为寻求者所寻见的语境中可表达他容许自己被寻见；正文采用自然汉语，并以脚注保留较形式对应的译法。
- source_word: וַיָּנַח יְהוָה לָהֶם מִסָּבִיב
  choice: 雅威使他们四境安宁
  rationale: Hiphil 的 נוח 表示“使得安歇、赐下安宁”；“四境安宁”自然表达 מִסָּבִיב 所指四周不受敌扰的安稳。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代简体中文中常见的音译呈现四字神名，保留其专名性质，不以称号替代。
theological_decisions:
- issue: וַיִּמָּצֵא לָהֶם 是否表达神主动容许人寻见
  choice: 他也让他们寻见
  alternative: 他也被他们寻见
  rationale: Niphal 的形式容许被动译法，但在历代志的寻求—寻见表述中具有神回应寻求者的关系性意味。正文呈现这一自然含义，脚注保留原文较直译的被动形式，避免把语义张力完全消除。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用神的专名；音译“雅威”保留专名，与称号相区别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全心……尽意……”保留希伯来文平行结构；“四境安宁”简洁表达周围得享安歇的历史语境。
