  text: וְ/אַתֶּ֣ם חִזְק֔וּ וְ/אַל יִרְפּ֖וּ יְדֵי/כֶ֑ם כִּ֛י יֵ֥שׁ שָׂכָ֖ר לִ/פְעֻלַּתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: zh_hans
  text: 但你们要刚强，不要手发软[a]，因为你们的劳作有报偿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要让你们的手松懈”。“手发软”是希伯来语的表达，指失去力量、决心或勇气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: 但你们
  rationale: 连词加独立人称代词在上下文中带有对比和强调作用；“但你们”自然地表达转折性的劝勉，又不添加原文没有的内容。
- source_word: חִזְקוּ
  choice: 要刚强
  rationale: חזק的复数祈使式在此劝勉听众保持力量、坚定和勇气；“要刚强”直接而庄重。
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: 不要手发软
  rationale: רפה与“手”连用，是指失去力量、决心或勇气的希伯来语意象。“手发软”保留身体意象，在现代汉语中也容易理解。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前面劝勉的理由，因果关系明确。
- source_word: יֵשׁ
  choice: 有
  rationale: 忠实保留存在句的表达，不把原文未明说的将来时态写进译文。
- source_word: שָׂכָר
  choice: 报偿
  rationale: 该词可指报酬、赏赐或回报；“报偿”既涵盖付出所得的回报，也不过度限定其具体性质。
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: 你们的劳作
  rationale: פְעֻלָּה指工作、行动或劳苦；“劳作”能体现实际付出，并与“报偿”自然搭配。
theological_decisions:
- issue: 报偿语言的性质
  choice: 因为你们的劳作有报偿
  alternative: 因为你们所做的必得赏赐
  rationale: 原文以报偿鼓励忠诚和坚持，却没有说明报偿的时间、形式，也没有建立关于功德或救恩的完整教义。译文保留其直接应许，同时避免加入“必得”所带来的显著未来时态或额外神学界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“刚强”保留经文劝勉的力度；“手发软”保留原文具体意象，并由脚注解释其惯用含义。
