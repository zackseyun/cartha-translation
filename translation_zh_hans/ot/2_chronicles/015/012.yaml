id: 2CH.15.12
reference: 2 Chronicles 15:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: zh_hans
  text: 他们立约[a]，要尽心尽性寻求雅威，就是他们列祖的上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“进入那约”；也可理解为“以约约束自己”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“他们父辈的上帝”，指他们列祖所敬拜的立约之上帝。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: 他们立约
  rationale: 原文直译为“他们进入那约”。“立约”是自然、庄重的现代汉语表达，准确传达众人共同作出约的承诺；脚注保留原文意象和另一种理解。
- source_word: לִדְרוֹשׁ
  choice: 寻求
  rationale: דרש在此不是单指询问，而是指以忠诚和敬拜来转向、追求上帝；“寻求”保留了这一宗教和立约语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的音译“雅威”，保留这是以色列之上帝的专名，而不以称号替代。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们列祖的上帝
  rationale: “列祖”保留希伯来文阳性复数“父辈、先祖”的形式及其立约历史意味，也符合庄重而通行的汉语圣经语域。
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: 尽心尽性
  rationale: 这一固定表达分别对应“全部的心”和“全部的性命/生命”，传达整个人毫无保留地投入；同时避免把 נֶפֶשׁ 过度限定为后世哲学意义上的灵魂。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的立约专名。音译“雅威”既保留专名性质，也避免以“主”这一称号取代原文。
- issue: אֲבוֹתֵיהֶם 的祖辈称谓
  choice: 他们列祖
  alternative: 他们的祖先
  rationale: “列祖”保留原文明确的阳性祖辈用语及其立约传承色彩；脚注说明这里所指的历史和文化含义。
- issue: לֵבָב 与 נֶפֶשׁ 的并列表达
  choice: 尽心尽性
  alternative: 全心全意；用全部的心和全部的生命
  rationale: 保留原文两个并列概念及全然委身的张力，不把 נֶפֶשׁ 单一定义为“灵魂”或把两者完全合并成一个汉语概念。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“立约”和“寻求”清楚易懂；“列祖”与“尽心尽性”略带圣经语域色彩，但在现代汉语中仍通行，并能简洁保留原文的祖辈传承和双重全人委身表达。
