base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: zh_hans
  text: 凡不寻求耶和华——以色列的神的，都要被处死；无论尊卑[a]，无论男女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无论尊卑”直译为“从小到大”，是表示全体无一例外的说法，也可理解为“从最小的到最大的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: 凡……的，都
  rationale: 这一结构自然表达希伯来语关系从句的全面范围，涵盖所有符合所述条件的人。
- source_word: לֹא יִדְרֹשׁ
  choice: 不寻求
  rationale: דרשׁ在历代志的宗教与立约语境中常指寻求神；中文“不寻求”既保留核心词义，也可在誓约条款中自然表达拒绝或未履行的含义。
- source_word: לַיהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译神的专名יהוה。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列之神
  rationale: 准确表达原文的所属结构，并明确所寻求的是以色列的神。
- source_word: יוּמָת
  choice: 要被处死
  rationale: מות的使役被动式明确表示“被处死”，而非仅仅“死亡”；“要”保留誓约条款的规定性。
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: 无论尊卑
  rationale: 原文“从小到大”是涵盖全体的两极表达，可能涉及身份、地位或重要程度；“尊卑”在中文中自然简洁，且不把含义误限于年龄。
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: 无论男女
  rationale: 自然表达“从男人到女人”这一涵盖性配对，保留全体男女均包括在内的意思。
theological_decisions:
- issue: 是否弱化严厉的立约刑罚
  choice: 明确译为“要被处死”
  alternative: 译为“必死”，或解释为逐出群体、象征性的盟约咒诅
  rationale: 原文יוּמָת是מות的使役被动式，直接表明处死。译文应忠实保留叙述中的严厉规定，不加以淡化或扩展解释。
- issue: “寻求”是否加入意愿色彩
  choice: 译作“不寻求”
  alternative: 译作“不愿寻求”
  rationale: 法律与誓约语境可能使该表达带有意愿或规定意味，但希伯来动词本身未明说“不愿”。正文保留较宽的“不寻求”，避免替原文消除这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……的，都……”对应全面性的关系结构；两个“无论”使中文节奏自然，并突出该规定涵盖整个群体。正文避免把“从小到大”限定为年龄，因为原文也可能指地位或重要程度。
