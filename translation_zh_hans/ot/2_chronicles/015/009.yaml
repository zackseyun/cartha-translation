base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: zh_hans
  text: 亚撒召集了犹大和便雅悯的全体民众，以及寄居在他们中间、来自以法莲、玛拿西和西缅的人；因为许多以色列人看见雅威——他的神——与他同在，就归附了他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“投奔了他”；较直译为“倒向了他”。这个希伯来语惯用语是指人转而效忠亚撒。
    reason: 说明 נָפְלוּ עָלָיו 的字面形象及其政治语境含义。
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: 召集
  rationale: 该词指把众人聚集起来；“召集”符合君王组织民众集会的语境，又不过度限定集会形式。
- source_word: כָּל־יְהוּדָה וּבִנְיָמִן
  choice: 犹大和便雅悯全体民众
  rationale: 支派或地域名称在此借指其中的人民；补出“民众”使现代汉语自然，并保留“全体”的范围。
- source_word: הַגָּרִים עִמָּהֶם
  choice: 寄居在他们中间……的人
  rationale: גֵּר 指居住在非本族或非本地群体中的人。“寄居”保留其社会身份含义；“在他们中间”自然表达 עִם 所指的共同居住关系。
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: 来自以法莲、玛拿西和西缅
  rationale: 前缀 מִן 表明这些寄居者的来源，译为“来自”清楚自然。
- source_word: נָפְלוּ עָלָיו
  choice: 归附了他
  rationale: 这一希伯来语惯用语在政治语境中表示转而效忠、加入某一方。“归附”传达效忠关系，同时以脚注保留其较直译的形象和其他可能译法。
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: 许多以色列人
  rationale: לָרֹב 在此表示人数众多；此译法简洁地表达“大量来自以色列的人”。
- source_word: בִּרְאֹתָם
  choice: 看见……就
  rationale: 介词 בְּ 加不定词结构表示伴随时间，并在上下文中引出他们归附的缘由；汉语“看见……就”自然保留两层联系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אֱלֹהָיו עִמּוֹ
  choice: 他的神与他同在
  rationale: 直陈神的同在与支持，不把含义扩展为更具体的政治或军事解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”以专名音译呈现，并避免以“主”等称号代替；“耶和华”是汉语传统中的另一音译。
- issue: אֱלֹהָיו עִמּוֹ 所表达的神圣同在
  choice: 他的神与他同在
  alternative: 他的神支持他
  rationale: “同在”保留原文在场、眷助的神学张力，不将其缩减为政治支持或军事胜利。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“归附”略带历史叙事色彩，适合君王与支派效忠的语境；整体句式分为两句，以免多个修饰成分造成理解困难。
