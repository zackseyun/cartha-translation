source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: zh_hans
  text: 亚撒王甚至废去了他母亲玛迦的太后之位，因为她为亚舍拉[b]造了一个骇人的神像[a]。亚撒砍倒她的神像，把它捣碎，又在汲沦谷[c]焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可憎的像”或“恐怖之物”。这个希伯来词指令人厌恶或惊恐的崇拜物。
    reason: lexical_alternative
  - marker: b
    text: “亚舍拉”既可能指这位女神，也可能指与她有关的崇拜物；一些较早的译本译作“树林”。
    reason: cultural_note
  - marker: c
    text: 或译“在汲沦溪”或“在汲沦干河谷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 甚至
  rationale: 该词表示递进并带强调，突出亚撒的改革连自己的王室至亲也不例外。
- source_word: מַעֲכָה
  choice: 玛迦
  rationale: 按现代普通话圣经人名的惯用音译处理。
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: 亚撒王……的母亲
  rationale: 忠实表达希伯来语的亲属关系和君王身份，同时调整为自然的汉语语序。
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: 废去了她的太后之位
  rationale: הסיר 表示移除；גְּבִירָה 在犹大王室语境中指具正式地位的太后。此译清楚表达从该身份或职位上撤下她，又不额外规定具体的废黜程序。
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: 因为她为亚舍拉造了
  rationale: 将关系从句按语境译为原因；לַאֲשֵׁרָה 译作“为亚舍拉”，保留神祇与相关崇拜物之间的开放性。
- source_word: מִפְלָצֶת
  choice: 骇人的神像
  rationale: 该罕见名词指令人恐惧、厌恶的祭祀物。“骇人的”保留其强烈负面色彩；“神像”由制作、砍倒、捣碎和焚烧的上下文补明。
- source_word: וַיִּכְרֹת
  choice: 砍倒
  rationale: 动词意为砍下或砍倒，适合此处可被砍伐的亚舍拉崇拜物。
- source_word: מִפְלַצְתָּהּ
  choice: 她的神像
  rationale: 保留第三人称阴性单数所属后缀所表达的归属；汉语中省略重复的评价词，使叙述自然，但所指仍与前句“骇人的神像”相同。
- source_word: וַיָּדֶק
  choice: 把它捣碎
  rationale: 该动词表示使物体变细碎或成为粉末；“捣碎”既准确又符合现代汉语。
- source_word: וַיִּשְׂרֹף
  choice: 焚烧
  rationale: 直接表达用火烧毁，语体庄重，并与前面的连续处置动作协调。
- source_word: בְּנַחַל קִדְרוֹן
  choice: 在汲沦谷
  rationale: נחל 可指溪流、干河谷或谷地；“汲沦谷”既符合地理语境，也便于现代读者理解。
theological_decisions:
- issue: אֲשֵׁרָה 的所指
  choice: 译作专名“亚舍拉”，并以脚注说明既可能指女神，也可能指相关崇拜物。
  alternative: 亚舍拉柱；树丛
  rationale: 原文没有明确限定形制。保留专名可呈现古代宗教背景，并避免把女神与其崇拜象征之间真实存在的歧义悄然消除。
- issue: גְּבִירָה 的王室含义
  choice: 太后
  alternative: 女主人；尊贵夫人
  rationale: 在犹大王室语境中，该词最自然地指王母所具有的受承认身份或职位；“太后”是现代汉语最简明的对应表达。
- issue: מִפְלָצֶת 的性质
  choice: 骇人的神像
  alternative: 可憎之物；恐怖之物；淫秽的像
  rationale: 原词强调令人恐惧或厌恶的祭祀物，但具体形状不明。“神像”根据上下文补足其礼仪对象性质，同时脚注保留较宽泛的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“废去了……太后之位”明确王室身份变化；连续使用“砍倒、捣碎、焚烧”保留原文动作推进。脚注标记均紧接其所解释的词语。
