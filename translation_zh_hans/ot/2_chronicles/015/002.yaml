  text: וַ/יֵּצֵא֮ לִ/פְנֵ֣י אָסָא֒ וַ/יֹּ֣אמֶר ל֔/וֹ שְׁמָע֕וּ/נִי אָסָ֖א וְ/כָל יְהוּדָ֣ה וּ/בִנְיָמִ֑ן יְהוָ֤ה עִמָּ/כֶם֙ בִּֽ/הְיֽוֹתְ/כֶ֣ם עִמּ֔/וֹ וְ/אִֽם תִּדְרְשֻׁ֨/הוּ֙ יִמָּצֵ֣א לָ/כֶ֔ם וְ/אִם תַּעַזְבֻ֖/הוּ יַעֲזֹ֥ב אֶתְ/כֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: zh_hans
  text: 他出去迎接亚撒，对他说：“亚撒和犹大、便雅悯众人啊，你们要听我说：你们与耶和华同在时，耶和华就与你们同在。你们若寻求他，他必被你们寻见[a]；你们若离弃他，他也必离弃你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必让你们寻见。”
    reason: Niphal 形式除可按被动译为“被寻见”外，也可能带有反身或容许意味；脚注保留这一自然的中文表达及其语义可能。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 他出去
  rationale: 这是 יצא 的 Qal 叙事时态，表示接续发生的动作；“出去”直接、自然。
- source_word: לִפְנֵי אָסָא
  choice: 迎接亚撒
  rationale: 字面为“到亚撒面前”，在移动语境中表示出去迎面相见；“迎接”符合现代汉语表达，又不削弱其可能带有的郑重或劝诫意味。
- source_word: שְׁמָעוּנִי
  choice: 你们要听我说
  rationale: 复数命令式带第一人称单数宾语后缀；此译保留先知直接呼告众人的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译，明确保留其作为专名的性质，而不以称号替代。
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: 你们与耶和华同在……耶和华就与你们同在
  rationale: 保留重复的“同在”及双向对应关系；第二处用“耶和华”代替代词，使中文所指清楚。
- source_word: בִּהְיוֹתְכֶם
  choice: ……时
  rationale: 介词 בְּ 加 היה 不定词结构表示同时或条件背景；“时”简洁保留“当……的时候／只要……”之间的语义张力。
- source_word: תִּדְרְשֻׁהוּ
  choice: 寻求他
  rationale: דרש 在敬拜与盟约语境中表示专心寻求上帝，不只是向他询问。
- source_word: יִמָּצֵא לָכֶם
  choice: 他必被你们寻见
  rationale: 忠实保留 מצא 的 Niphal 形式及 לָכֶם 所表达的关系，不额外加入“允许”或“使自己”等原文未明说的因果含义。
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: 你们若离弃他，他也必离弃你们
  rationale: 前后用同一动词“离弃”，保留希伯来文的重复、对应和盟约语气。
theological_decisions:
- issue: 盟约语言中的条件与对应关系
  choice: 直译为“你们与耶和华同在时，耶和华就与你们同在”，并保留寻求／寻见、离弃／离弃的对应结果。
  alternative: 将这些话弱化为仅描述人主观经历上帝同在与否。
  rationale: 原文明确使用时间兼条件结构及两个“若”从句。译文保留经文本身的条件性和神学张力，不借本节解决更广泛的坚忍或背道问题。
- issue: יִמָּצֵא 的语态与神主动性的表达
  choice: 他必被你们寻见
  alternative: 他必让你们寻见
  rationale: Niphal 在此可按被动理解；“让你们寻见”可能表达反身或许可意味，但会比原文更明确地解释神的主动作用，因此正文采用较少阐释的译法。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“亚撒和犹大、便雅悯众人啊”保留公开先知宣告的呼告语气；全节用对称句式呈现希伯来文的修辞结构。
