id: 2CH.15.8
reference: 2 Chronicles 15:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: zh_hans
  text: 亚撒听见这些话和先知俄德的预言[a]，就振作起来，除掉犹大和便雅悯全境，以及从以法莲山区夺取的各城中的可憎之物，又重新修整了雅威殿的门廊前的祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“先知俄德的预言”。结合上下文，有些解释者和文本讨论认为这里与“俄德的儿子亚撒利雅”有关。
    reason: 保留马所拉文本与上下文之间可能存在的文本或抄写张力，避免在正文中擅自协调。
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: 听见……就
  rationale: 该结构以不定式引出时间从句；汉语用“听见……就”自然表达先后关系，但不额外强调即时性。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: דְּבָרִים 可指“话”或“事情”；此处承接前文先知的信息，译作“这些话”最符合语境。
- source_word: וְהַנְּבוּאָה
  choice: 和……的预言
  rationale: 保留 נְבוּאָה 的“预言”含义及原文并列形式，不擅自将“和”解释成同位关系。
- source_word: עֹדֵד הַנָּבִיא
  choice: 先知俄德
  rationale: 马所拉文本明确写作“先知俄德”；不按上下文改成“俄德的儿子亚撒利雅”，相关张力留在脚注说明。
- source_word: הִתְחַזַּק
  choice: 振作起来
  rationale: Hitpael 形式表达亚撒因所听见的信息而刚强、鼓起勇气；“振作起来”兼顾反身意味与现代汉语的自然表达。
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: 除掉……可憎之物
  rationale: שִׁקּוּצִים 在本语境中指与偶像崇拜有关的可憎事物；不进一步限定为某一种器物。
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: 犹大和便雅悯全境
  rationale: אֶרֶץ 在此指地域或疆土；“全境”比逐字的“全地”更符合现代汉语。
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: 以及他在以法莲山区所夺各城中
  rationale: לכד 表示攻取、夺取；מֵהַר אֶפְרָיִם 的空间关系可理解为从以法莲山区取得这些城，汉语以“在以法莲山区所夺”清楚传达其地理位置。
- source_word: וַיְחַדֵּשׁ
  choice: 修复
  rationale: Piel 的 חדשׁ 表示更新、恢复如新；祭坛语境下“修复”自然，但不排除更广的重新整治之意。
- source_word: מִזְבַּח יְהוָה
  choice: 雅威……的祭坛
  rationale: 构词短语表示属于或供奉雅威的祭坛；结合后续地点短语，汉语整合为“雅威殿廊前的祭坛”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: 雅威殿廊前
  rationale: אוּלָם 指圣殿前部的门廊；“殿廊”简洁而能表达建筑位置，לִפְנֵי 译为“前”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，正文以“雅威”保留专名性质，避免用称号替代。
- issue: “先知俄德”与上下文“俄德的儿子亚撒利雅”之间的文本张力
  choice: 正文按马所拉文本译作“先知俄德”
  alternative: 按上下文协调为“先知俄德的儿子亚撒利雅”
  rationale: 所给 WLC 正文为 עֹדֵד הַנָּבִיא，翻译不应静默协调；上下文所引发的另一种理解在脚注中说明。
translation_notes:
  register: 采用现代、庄重而通俗的普通话书面语。“振作起来”“全境”“殿廊”等表达兼顾可读性与历史叙事语体；正文保留原文的并列结构和文本张力。
