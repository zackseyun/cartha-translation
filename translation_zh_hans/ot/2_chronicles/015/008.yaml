  source_fidelity: 正文总体忠实于马所拉文本，正确保留“先知俄德”而未按上下文协调为亚撒利雅；神名“雅威”一致。惟“他在以法莲山区所夺各城中”将מִן（从、出自）的关系译成“在……中”，宜改为“从以法莲山区夺取的各城中”，以保留原文的来源／夺取关系。
  naturalness: 行文庄重自然。“雅威殿廊前”略显压缩，改作“雅威殿的门廊前”更符合现代汉语，也更清楚呈现所属与空间关系。
  terminology: “可憎之物”“祭坛”“雅威”恰当；“重新修整”比单纯“修复”更能涵盖חִדֵּשׁ的更新、恢复之意，同时不越过原文所能确定的范围。
