  - severity: low
    issue: “雅威殿廊前”结构压缩，所属关系不够清晰。
    rationale: אֻלָם יְהוָה是雅威殿的门廊（或殿廊）；“雅威殿的门廊前”在现代汉语中更明晰，不改变空间意义。
  revised_text: 亚撒听见这些话和先知俄德的预言[a]，就振作起来，除掉犹大和便雅悯全境，以及从以法莲山区夺取的各城中的可憎之物，又重新修整了雅威殿的门廊前的祭坛。
