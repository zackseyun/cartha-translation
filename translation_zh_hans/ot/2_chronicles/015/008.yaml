revisions:
- from: 亚撒听见这些话和先知俄德的预言[a]，就振作起来，除掉犹大和便雅悯全境，以及他在以法莲山区所夺各城中的可憎之物，又修复了雅威殿廊前的祭坛。
  to: 亚撒听见这些话和先知俄德的预言[a]，就振作起来，除掉犹大和便雅悯全境，以及从以法莲山区夺取的各城中的可憎之物，又重新修整了雅威殿的门廊前的祭坛。
  rationale: 修订仅澄清以法莲山区与“夺取各城”的原文关系，并使圣殿门廊短语更符合现代汉语。保留马所拉文本的“先知俄德”、脚注锚点及其文本说明；未对争议作正文协调。
