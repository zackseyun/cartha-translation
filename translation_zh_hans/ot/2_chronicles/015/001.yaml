  text: וַ/עֲזַרְיָ֨הוּ֙ בֶּן עוֹדֵ֔ד הָיְתָ֥ה עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/001.yaml
  text: The Spirit of God came upon Azariah son of Oded[a].
translation:
  language: zh_hans
  text: 神的灵临到俄德的儿子亚撒利雅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神的灵在俄德的儿子亚撒利雅身上。”
    reason: 保留 הָיְתָה עָלָיו 较静态、贴近字面的译法。
lexical_decisions:
- source_word: וַ/עֲזַרְיָהוּ
  choice: 亚撒利雅
  rationale: 按现代中文圣经人名惯例音译。词首的 וַ־承接上文，中文在本节不必机械译作“于是”或“现在”，叙事推进可由语境自然体现。
- source_word: בֶּן עוֹדֵד
  choice: 俄德的儿子
  rationale: בֶּן 在此最自然地表示直接的父子关系；עוֹדֵד 按中文惯例音译为“俄德”。
- source_word: הָיְתָה עָלָיו
  choice: 临到
  rationale: 直译为“在他身上”，但与 רוּחַ 连用时可表达神的灵临到某人，使其受感说话或得着能力。“临到”自然地保留了这里可能具有的动态意味；较静态的理解收入脚注。
- source_word: רוּחַ אֱלֹהִים
  choice: 神的灵
  rationale: 在先知受感的语境中，这一结构最自然地指神的灵。希伯来语虽未在 רוּחַ 前使用冠词，但属格结构在这里具有确定意义；中文无需冠词即可自然表达。
theological_decisions:
- issue: רוּחַ אֱלֹהִים 应理解为非人格性的“从神而来的灵”，还是“神的灵”
  choice: 神的灵
  alternative: 从神而来的灵；神圣的灵
  rationale: 本段公式引出亚撒利雅受感宣告信息，“神的灵”最符合《历代志》中的先知性语境，也没有加入原文未明说的进一步系统神学界定。
- issue: הָיְתָה עָלָיו 是动态的“临到”，还是静态的“在……身上”
  choice: 临到
  alternative: 在……身上
  rationale: 与“灵”连用并引出随后的先知宣告时，动词短语很可能具有事件性；但希伯来语字面也可作状态描述，因此以脚注保留另一种译法。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“临到”是现代中文圣经语体中通行且易懂的表达；句法简洁，不额外添加原文没有的时间副词或显性连接词。
