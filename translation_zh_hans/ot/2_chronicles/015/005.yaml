base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: zh_hans
  text: 那时，无论出去还是进来，都不得平安[b]，因为各地的居民都陷在许多动乱之中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “许多动乱”也可译作“大骚乱”；原文所用的词可以表示动荡、混乱或惊惶。
    reason: lexical_alternative
  - marker: b
    text: “出去、进来”是希伯来语的成对说法，泛指日常往来，尤其是出行或公开活动。
    reason: cultural_note
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: 那时
  rationale: 简洁自然地表达该时间短语；上下文已指明特定时期，汉语无需机械保留复数。
- source_word: אֵין שָׁלוֹם
  choice: 都不得平安
  rationale: “平安”保留 שָׁלוֹם 所含和平、安稳与福祉的宽广意义；结合出入活动，表达当时缺乏安全安宁。
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: 无论出门还是回家
  rationale: 以自然现代汉语保留“出去和进来”的成对表达及其泛指意义，指日常往来、出行或公开活动。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达后半句对不得平安之原因的说明。
- source_word: מְהוּמֹת רַבּוֹת
  choice: 许多动乱
  rationale: מְהוּמָה 可指骚乱、混乱或惊惶；“动乱”适合此处社会失序的语境，而“许多”保留复数及 רַבּוֹת 的数量表述。
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: 各地所有的居民都陷在……之中
  rationale: 用自然汉语表达动乱临到并笼罩居民的图景；“各地”保留 הָאֲרָצוֹת 的复数范围，不把它限于单一国土。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不得平安”保留原文的神学与语义宽度；“陷在……之中”避免生硬直译“在居民之上”，同时传达动乱笼罩众人的情形。脚注标记均置于相应主文表达之后。
