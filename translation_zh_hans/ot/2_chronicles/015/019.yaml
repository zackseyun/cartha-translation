base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/019.yaml
  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: zh_hans
  text: 没有战争，直到亚撒在位的第三十五年。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到亚撒王权的第三十五年。”有些解释者认为，这个数字是按一个较广泛的纪年体系计算，而非严格按亚撒本人的在位年数计算，以与相关经文协调。
    reason: 说明纪年表达的另一种直译方式及其与相关经文之间的年代张力，同时不改动正文所反映的希伯来文本。
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: 没有战争
  rationale: מִלְחָמָה意为“战争、战事”，与否定词לֹא及作存在用法的הָיָתָה连用；译为“没有战争”自然、准确。句首וּ承接上文，但现代汉语在此不必机械译作“并且”。
- source_word: עַד
  choice: 直到
  rationale: 表示无战争时期的时间终点；“直到”直接保留原文的时间关系。
- source_word: שְׁנַת שְׁלֹשִׁים וְ/חָמֵשׁ
  choice: 第三十五年
  rationale: 名词“年”的构词形式后接三十五，构成纪年表达；现代汉语自然译作“第三十五年”。
- source_word: לְ/מַלְכוּת
  choice: 统治
  rationale: מַלְכוּת在此指君王掌权或在位的时期。“统治”既可自然地构成“亚撒统治第三十五年”，也避免将其误解为国度本身。
- source_word: אָסָא
  choice: 亚撒
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions:
- issue: 本节纪年与亚撒相关叙事之间的年代张力
  choice: 按马所拉文本直译为“亚撒统治第三十五年”
  alternative: 把数字解释为始于王国分裂的更广泛纪年，或改动数字以求与《列王纪》协调
  rationale: 希伯来文本明确把第三十五年与亚撒的מַלְכוּת相连。译文应保留这一直接表述，不在正文中用和谐化解释或文本校改消除年代张力；相关解释仅在脚注中说明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“统治第三十五年”紧贴原文的纪年结构；脚注保留另一种常见措辞“在位第三十五年”，并明确把协调年代的方案作为解释而非正文译法。
