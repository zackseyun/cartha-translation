  text: וַ/יִּשָּֽׁבְעוּ֙ לַ/יהוָ֔ה בְּ/ק֥וֹל גָּד֖וֹל וּ/בִ/תְרוּעָ֑ה וּ/בַ/חֲצֹצְר֖וֹת וּ/בְ/שׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: zh_hans
  text: 他们高声向雅威起誓，伴有呼喊声、号筒声和角号声[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角号”原文为שׁוֹפָרוֹת（shofar的复数），通常指兽角号；原文明确将它与前面的“号筒”区别开来。
    reason: 说明两类乐器的词义区别，避免在中文中将二者混为同一种号。
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: 起誓
  rationale: 该词是שׁבע的尼法勒式，在这里表示郑重立誓；“起誓”简洁自然，也保留盟约语境中的正式意味。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词לְ标明起誓所指向的对象；יהוה按其专名译为“雅威”。
- source_word: בְּקוֹל גָּדוֹל
  choice: 高声
  rationale: 直译为“以大声音”，实际表示声音洪亮；“高声”符合现代汉语表达并保留听觉重点。
- source_word: וּבִתְרוּעָה
  choice: 伴有呼喊声
  rationale: תְּרוּעָה可指呼喊、欢呼或呐喊；此处不明确限定为喜乐或战争场景，因此用中性的“呼喊声”保留语义幅度。
- source_word: וּבַחֲצֹצְרוֹת
  choice: 号筒声
  rationale: חֲצֹצְרוֹת指以色列敬拜和集会中使用的直形金属号筒；译作“号筒”既清楚，也能与后面的角号区分。
- source_word: וּבְשׁוֹפָרוֹת
  choice: 角号声
  rationale: שׁוֹפָרוֹת指用兽角制成或以兽角为典型的号类乐器，与前面的金属号筒不同；“角号”通俗而能保留两种乐器的区别。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名יהוה；采用“雅威”以专名形式呈现这一盟约之名，不以称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“伴有……声”贴近原文连续使用介词בְּ所表达的伴随情形，也避免擅自补出原文没有明说的“吹响”。
