  text: וַ/יִּגֹּ֤ף יְהוָה֙ אֶת הַ/כּוּשִׁ֔ים לִ/פְנֵ֥י אָסָ֖א וְ/לִ/פְנֵ֣י יְהוּדָ֑ה וַ/יָּנֻ֖סוּ הַ/כּוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: zh_hans
  text: 雅威在亚撒和犹大面前击败了古实人[a]，古实人就逃跑了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“埃塞俄比亚人”。希伯来原文的民族名称是“古实人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: 击败了
  rationale: נָגַף在军事叙事中表示击打并使敌军败退；“击败了”自然明确，也保留雅威亲自施行行动的表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: הַכּוּשִׁים
  choice: 古实人
  rationale: 直接对应希伯来民族名称כּוּשִׁים，避免直接套用范围与古实未必完全相同的后世地名“埃塞俄比亚人”。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留希伯来语“在……面前”的战事叙述方式，表达敌军当着亚撒和犹大人的面被击败。
- source_word: אָסָא
  choice: 亚撒
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: יְהוּדָה
  choice: 犹大人
  rationale: 此处“犹大”在战事语境中集体指随亚撒作战的犹大众人；译作“犹大人”使现代汉语意思清楚，不额外限定为某一具体军制单位。
- source_word: וַיָּנֻסוּ
  choice: 就逃跑了
  rationale: נוּס意为逃走、逃跑；“就”自然承接前句被击败的结果，同时保持叙事简洁。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术重构音译，保留专名性质。“耶和华”是有深厚中文传统的另一音译，但并非目前较通行的原语发音重构。
- issue: 雅威在战果中的主动角色
  choice: 以“雅威……击败了”明确保留神为动作主语
  alternative: 译成被动式“古实人败在……面前”
  rationale: 原文明确以雅威为נָגַף的主语；主动表达不淡化经文对战果来源的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“在亚撒和犹大人面前”有意保留原文重复介词所强调的双方见证与临场关系；全句不添加原文未明说的“军队”等词。
