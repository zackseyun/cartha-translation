base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: zh_hans
  text: 亚撒行耶和华他上帝眼中看为善和正直的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华他上帝眼中看为”直译为“在耶和华他上帝的眼中”，指按耶和华的看法或判断。
    reason: 解释希伯来语“在……眼中”的惯用表达，并说明“他的上帝”回指亚撒。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 行……的事
  rationale: עשה在这一道德评价句式中指人的行为；用“行……的事”既贴近原文，又符合现代汉语的圣经叙事语体。
- source_word: אָסָא
  choice: 亚撒
  rationale: 按现代中文圣经中通行的人名音译。
- source_word: הַטּוֹב
  choice: 美善
  rationale: טוֹב在这里指道德上蒙认可的善；“美善”比单用“好”更庄重，也适合与“正直”并列。
- source_word: וְהַיָּשָׁר
  choice: 正直
  rationale: יָשָׁר在伦理语境中表示正直、正当；保留它与“美善”并列而略有区别的评价意味。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在……眼中”的形象，同时用“看为”清楚表达这是耶和华的判断和评价。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的圣名传统音译，明确呈现专名而不以“主”这一称号代替。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 此处虽使用形态上为复数形式的אֱלֹהִים，但所指是以色列的上帝，并带第三人称单数所属后缀，故译为单数“他的上帝”。
theological_decisions:
- issue: 圣名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是四字圣名的中文转写；正文采用普通现代中文读者更熟悉的“耶和华”，同时保留其作为上帝专名的性质，不以称号替代。
- issue: “美善”和“正直”的关系
  choice: 保留两个并列的道德评价词
  alternative: 合并为“正确的事”
  rationale: 原文הַטּוֹב וְהַיָּשָׁר明确并列两个形容词；不将其合并，以保留经文评价的力度和可能的语义差别。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“行……的事”延续中文圣经叙事中常见的伦理评价句式；“眼中看为”兼顾原文隐喻与汉语可读性。
