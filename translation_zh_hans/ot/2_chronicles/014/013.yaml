  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: zh_hans
  text: 他们击败了基拉尔周围的所有城邑，因为对雅威的恐惧笼罩着城中的人。他们劫掠了所有城邑，因为其中有许多战利品。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: 击败了
  rationale: נכה在军事叙事中表示出兵击打并制伏；这里直接宾语是各城，并非逐一说明杀死所有居民。“击败”既保留军事暴力和决定性结果，也避免把城市本身说成被“击杀”。
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: 基拉尔周围的所有城邑
  rationale: סְבִיבוֹת表示“周围”；עָרִים在古代军事语境中译为“城邑”，比现代行政意义较强的“城市”更贴切。
- source_word: פַּחַד יְהוָה
  choice: 对雅威的恐惧
  rationale: פַּחַד在此不是敬虔的敬畏，而是临到周边居民的惊恐。“对雅威的恐惧”保留属格短语可能表示由雅威造成、也以雅威为对象的张力，不擅自限定因果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文中的专名，而不以称号替代。
- source_word: עֲלֵיהֶם
  choice: 笼罩着城中的人
  rationale: 希伯来语直译为“在他们之上”；现代汉语用“笼罩着”自然表达压倒性的恐惧状态。代词在语义上最可能指各城的居民，译文予以明示，避免说恐惧临到无生命的城邑。
- source_word: וַיָּבֹזּוּ
  choice: 劫掠了
  rationale: בזז指战争中掠取财物；“劫掠”简洁地保留军事抢掠含义。
- source_word: בִּזָּה רַבָּה
  choice: 许多战利品
  rationale: בִּזָּה指战争中可掠取之物；“战利品”在现代汉语中清楚自然，并区别于前面的动词“劫掠”。
- source_word: בָהֶם
  choice: 其中
  rationale: 复数代词回指各城邑；“其中”自然表达战利品在这些城内。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以传统音译或称号替代。
- issue: פַּחַד יְהוָה 中属格关系
  choice: 对雅威的恐惧
  alternative: 雅威所降的恐惧
  rationale: 上下文显然涉及雅威带来的震慑，但希伯来结构本身也可理解为因雅威而生、以雅威为对象的恐惧；正文采用不完全消解这种张力的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“城邑”保持古代战争叙事色彩；句式简明，并保留原文两个因果分句的对应结构。
