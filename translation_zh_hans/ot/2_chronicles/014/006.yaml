  text: וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֜ה נִבְנֶ֣ה אֶת הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/נָסֵ֨ב חוֹמָ֣ה וּ/מִגְדָּלִים֮ דְּלָתַ֣יִם וּ/בְרִיחִים֒ עוֹדֶ֨/נּוּ הָ/אָ֜רֶץ לְ/פָנֵ֗י/נוּ כִּ֤י דָרַ֨שְׁנוּ֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ דָּרַ֕שְׁנוּ וַ/יָּ֥נַֽח לָ֖/נוּ מִ/סָּבִ֑יב וַ/יִּבְנ֖וּ וַ/יַּצְלִֽיחוּ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: zh_hans
  text: 他对犹大人说：“让我们建造这些城，给它们筑上城墙和城楼，安上城门和门闩。趁这地仍在我们面前[a]，因为我们寻求了耶和华我们的上帝。我们寻求了他，他就使我们四境安宁。”于是他们建造，并且顺利成功。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地仍在我们面前”也可理解为“机会仍摆在我们面前”，或指这片土地尚未受到威胁，他们仍可自由行动。
    reason: 说明希伯来语习语可能表达当前机会尚存或土地仍处于无阻碍状态，避免正文过度诠释。
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: 他对犹大人说
  rationale: “犹大”在此以地名代指其人民；译作“犹大人”比直译“对犹大”更符合现代汉语，同时保留所指。
- source_word: נִבְנֶה
  choice: 我们要建造
  rationale: 第一人称复数意愿式表达劝勉和共同决心；“我们要建造”自然传达这一语气，不加入“重建”的含义。
- source_word: הֶעָרִים הָאֵלֶּה
  choice: 这些城
  rationale: עָרִים指城市或城镇；结合筑防御工事的语境，译作“城”简洁准确。
- source_word: וְנָסֵב
  choice: 用……围起来
  rationale: 此处使役形表达环绕、围住；与后列防御设施结合，译为“用城墙和城楼围起来”符合汉语习惯。
- source_word: חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: 城墙和城楼……城门和门闩
  rationale: 这些词列举城市防御设施。חוֹמָה虽为单数，在此具有集合意义；דְּלָתַיִם在城防语境中指城门；בְרִיחִים指固定城门的横闩。
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: 趁这地仍在我们面前
  rationale: 保留“仍然”和“在我们面前”的希伯来语意象，并以“趁”表达当前机会尚存的时间意味，不将其明确解释为“这地太平”或“任我们支配”。
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ
  choice: 因为我们寻求了耶和华我们的上帝
  rationale: דרשׁ用于上帝时通常指在信靠和敬虔中寻求他，不仅是询问信息；“寻求”保留这一较宽广的含义。
- source_word: דָּרַשְׁנוּ
  choice: 我们寻求了他
  rationale: 保留原文的强调性重复，以“他”自然回指前句的耶和华。
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: 他就使我们四境安宁
  rationale: 动词表达使人得安歇、免受搅扰；מִסָּבִיב意为四周。“使我们四境安宁”是自然凝练的现代汉语，也未擅自补入原文未明说的敌人。
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: 于是他们建造城邑，事事顺利
  rationale: 结尾叙述建造行动及其成功结果。“事事顺利”传达צלח的顺利、成功之意；补出“城邑”使汉语宾语明确，其所指来自上文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。中文采用广为人知且具有专名功能的“耶和华”，保留其为以色列之上帝名字的性质，而不改成称号“主”。
- issue: דרשׁ 的属灵含义
  choice: 寻求
  alternative: 求问
  rationale: 此处不仅可能涉及求问，也包括归向、倚靠和敬拜上帝；“寻求”保留原词较宽的关系性与敬虔含义，不将其缩窄为获取指示。
- issue: 土地“仍在我们面前”的含义
  choice: 保留原文意象，并用脚注说明
  alternative: 这地仍然太平；这地仍任我们支配
  rationale: 原文可表示机会仍然敞开，或土地仍未受威胁、可供行动；正文不把含义限定为政治控制或军事和平。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“城楼、城门、门闩、四境安宁”等词符合历史城防语境，又不显生僻。保留原文“寻求”的重复及“这地仍在我们面前”的意象，以维持强调和语义张力。
