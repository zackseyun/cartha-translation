- from: 他对犹大人说：“我们要建造这些城，用城墙和城楼围起来，并安设城门和门闩。趁这地仍在我们面前[a]，我们要这样做，因为我们寻求了耶和华我们的上帝。我们寻求了他，他就使我们四境安宁。”于是他们建造城邑，事事顺利。
  to: 他对犹大人说：“让我们建造这些城，给它们筑上城墙和城楼，安上城门和门闩。趁这地仍在我们面前[a]，因为我们寻求了耶和华我们的上帝。我们寻求了他，他就使我们四境安宁。”于是他们建造，并且顺利成功。
  rationale: 删除无原文依据的“我们要这样做”，使“趁／因为”的理由关系保留原文的紧凑表达。调整城防设施的句法以提升自然度；末句改为较不泛化的成功表述，同时保留原文“建造”与“成功”的并列叙述。脚注锚点及其对歧义的谨慎说明均可保留。
