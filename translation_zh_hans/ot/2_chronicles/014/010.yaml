  text: וַ/יִּקְרָ֨א אָסָ֜א אֶל יְהוָ֣ה אֱלֹהָי/ו֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֵֽין עִמְּ/ךָ֤ לַ/עְזוֹר֙ בֵּ֥ין רַב֙ לְ/אֵ֣ין כֹּ֔חַ עָזְרֵ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ כִּֽי עָלֶ֣י/ךָ נִשְׁעַ֔נּוּ וּ/בְ/שִׁמְ/ךָ֣ בָ֔אנוּ עַל הֶ/הָמ֖וֹן הַ/זֶּ֑ה יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אַ֔תָּה אַל יַעְצֹ֥ר עִמְּ/ךָ֖ אֱנֽוֹשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: zh_hans
  text: 亚撒呼求雅威他的神，说：“雅威啊，在强大的和无力的之间施行帮助的，除了你以外，没有谁。[a] 雅威我们的神啊，求你帮助我们，因为我们倚靠你；我们奉你的名来攻击这大军。雅威我们的神啊，你不要让人胜过你。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威啊，除了你以外，没有谁能施行帮助，无论人多还是无力。”希伯来文十分凝练；“人多”也可理解为“强大”。
    reason: alternative_reading
  - marker: b
    text: “胜过你”也可译作“抵挡你”或“在你面前保持强势”。原文动词在这里的确切含义不易确定；“人”指必死的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼求
  rationale: 在向神祷告的语境中，קרא אל 表示迫切地呼喊求告；“呼求”既保留紧迫感，也符合现代汉语祷告用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，而不以“主”这一称号代替。
- source_word: אֵין עִמְּךָ לַעְזוֹר בֵּין רַב לְאֵין כֹּחַ
  choice: 无论强盛的还是无力的，除了你，没有谁能帮助
  rationale: 原句高度凝练，עִמְּךָ 可表达“与你相比／在你以外”，而 רַב 兼有“多”和“强盛”之意。正文保留强弱两极的对照，并以脚注说明人数层面的另一种理解。
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: 因为我们倚靠你
  rationale: נשען 本义为“倚靠、靠在……上”，此处表达信赖；“倚靠”在现代汉语中自然且保留原有意象。
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: 我们奉你的名来
  rationale: “奉你的名”自然表达凭神的权柄、代表神并依赖神而行动，同时保留“名”的经文意象。
- source_word: הֶהָמוֹן הַזֶּה
  choice: 这一大群人
  rationale: הָמוֹן 指人数众多的群体；上下文虽为军队，原词本身并非军队的专门称谓，因此不在正文中过度限定。
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: 不要让世人胜过你
  rationale: עצר 在这里语义困难，战事语境支持“抵挡、占上风”。אֱנוֹשׁ 强调软弱必死的人类，“世人”在汉语中可作泛指，并与神形成对照。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名；采用“雅威”保留专名性质，不用称号取代，也避免沿用较不贴近该名辅音形式的传统音译。
- issue: אֵין עִמְּךָ לַעְזוֹר בֵּין רַב לְאֵין כֹּחַ 的关系与指向
  choice: 无论强盛的还是无力的，除了你，没有谁能帮助
  alternative: 对你而言，无论帮助人多的一方还是无力的一方，都没有分别
  rationale: 原句可理解为唯有雅威能施助，也可理解为雅威施助不受人数或力量限制。正文采取语法上较直接的排他性理解，脚注保留另一可能，避免消除原文张力。
- issue: 祷告末句中 אַתָּה 的处理
  choice: 雅威我们的神啊，你不要让世人胜过你
  alternative: 雅威啊，你是我们的神；不要让世人胜过你
  rationale: אַתָּה 可作为后一句的强调主语，也可与前面的“我们的神”构成名词句。正文不补入系词，保留其句法紧凑性；汉语中的显式“你”传达强调。
- issue: אֱנוֹשׁ 的泛指意义
  choice: 世人
  alternative: 人／必死的人
  rationale: 该词为阳性单数但泛指必死的人类。“世人”可自然表达代表性、普遍性的用法，同时保留人与神之间的对照。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。祷告中的呼语重复照原文保留；句式力求简明有力，不以教派术语解释亚撒对神帮助和人之有限性的陈述。
