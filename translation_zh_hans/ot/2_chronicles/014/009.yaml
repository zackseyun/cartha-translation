base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: zh_hans
  text: 亚撒出去迎战他[a]，他们就在玛利沙的洗法谷摆开阵势[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迎战他”直译为“到他面前”或“在他面前”；也可译作“出去面对他”或“出去对抗他”。
    reason: lexical_alternative
  - marker: b
    text: “摆开阵势”也可译作“列阵备战”或“布置战阵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: יצא在连续叙事形式中表示“出去”；军事语境赋予行动以迎敌意味，但译文不另加“率军”等原文未明说的内容。
- source_word: לְפָנָיו
  choice: 迎战他
  rationale: 字面为“到他面前／在他面前”。本节语境是亚撒面对来犯之敌，“迎战他”以自然现代汉语表达这里的对抗性，同时用脚注保留字面意义及其他可能译法。
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: 列阵交战
  rationale: ערך与מלחמה连用，指为战斗排列阵势。“列阵交战”既传达军队布阵的含义，也符合简洁庄重的现代汉语叙事。
- source_word: בְּגֵיא
  choice: 在……谷
  rationale: גיא指山谷或谷地；在地名中译为“谷”，简明且符合中文地理名称习惯。
- source_word: צְפַתָה
  choice: 洗法
  rationale: 专名按希伯来语音译；采用中文圣经地名中通行且易辨识的“洗法”。
- source_word: לְמָרֵשָׁה
  choice: 玛利沙的
  rationale: 介词לְ在此标示洗法谷与玛利沙的地理关联。译作“玛利沙的洗法谷”自然简洁；也可能理解为“在玛利沙附近”。
