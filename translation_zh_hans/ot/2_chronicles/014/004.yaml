  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: zh_hans
  text: 他从犹大所有城邑中除掉丘坛和香坛[a]，国在他任内得享安宁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“太阳柱”。希伯来语所指的是祭祀物件；在某些语境中，它可能与太阳崇拜有关。
    reason: 保留חַמָּנִים词义上真实存在的不确定性，避免将其具体性质或崇拜对象写死。
  - marker: b
    text: 直译“在他面前”；也可理解为“在他治理之下”。
    reason: 说明לְפָנָיו的字面表达，并保留其在此处可指亚撒任内或其治理下的语境含义。
lexical_decisions:
- source_word: וַיָּסַר
  choice: 除掉
  rationale: 该词是סור的使役形，表示使某物离开或被移除。“除掉”自然地表达亚撒实际清除这些设施的行动，又不扩大为制度性的“废除”。
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: 从犹大所有城邑中
  rationale: מן表示移除的起点或范围；כל与“犹大的城邑”连用，表明这次整治遍及犹大全境的城邑。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: במות指设在高处或称为“高处”的祭祀场所。“丘坛”是简洁而具有历史宗教含义的中文表达，比笼统的“神庙”更贴近原词。
- source_word: הַחַמָּנִים
  choice: 香坛
  rationale: חמנים所指的具体祭祀物件并不完全确定，可指与焚香有关的祭坛或立柱，也可能与太阳崇拜有关。正文采用语境中可读且有词典依据的“香坛”，并以脚注保留“太阳柱”的可能。
- source_word: וַתִּשְׁקֹט
  choice: 安享太平
  rationale: שקט表示安静、不受扰乱或得享安宁；以国家为主语时，“安享太平”自然传达国中没有战乱、局势安定的含义。
- source_word: הַמַּמְלָכָה
  choice: 国
  rationale: ממלכה可指王国或王权统辖的国土；此处“国”简洁自然，并与“安享太平”搭配。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 直译为“在他面前”。正文保留这一希伯来语表达及其可能的关系意味，脚注说明语境中也可理解为“在他统治期间”或“在他治理之下”。
theological_decisions:
- issue: 亚撒所除掉的祭祀设施性质
  choice: 将במות和חמנים译作具体的祭祀场所与物件，即“丘坛和香坛”，但不在正文中断定后者专属太阳崇拜。
  alternative: 把חמנים明确译作“太阳柱”或“太阳神柱”。
  rationale: 经文清楚报告亚撒清除祭祀设施，却没有在本节明确说明חמנים的崇拜对象。脚注保留更具体的太阳崇拜解释，避免把尚有争议的词义写死。
- issue: 国在亚撒“面前”安定的含义
  choice: 正文保留“在他面前”，不明确指定太平是由亚撒治理直接造成，还是在他在位期间出现。
  alternative: 意译为“在他治理下”或“在他统治期间”。
  rationale: לפניו字面为“在他面前”，语境可能指在他统治之下或在他任内。保留原有表达并以脚注解释，可避免过度确定因果或治理关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“城邑”“丘坛”保留历史叙事所需的典雅感；句法简洁，适合公开诵读。
