base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: zh_hans
  text: 他除掉外邦的祭坛和丘坛，打碎祭祀柱石，砍倒与亚舍拉有关的祭祀物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”。希伯来文指与亚舍拉崇拜有关的祭祀物；其具体形态可能是木柱、神木或其他象征物，尚不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: 他除掉
  rationale: 使役形式在此表示移除、除去；“除掉”自然地表达亚撒实施宗教改革的具体行动，又不额外引入正式废止的含义。
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: 外邦的祭坛
  rationale: נֵכָר 指外来的、异族的事物；在敬拜语境中，重点是与外邦或非正统敬拜相关的祭坛，而不只是外族人拥有的祭坛。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: בָּמוֹת 是祭祀场所的专门用语，常指设在高处的祭坛或祭祀地点；“丘坛”简洁并符合中文圣经语境。
- source_word: וַיְשַׁבֵּר
  choice: 打碎
  rationale: שׁבר 表示强力击破；“打碎”清楚传达彻底毁坏的动作。
- source_word: הַמַּצֵּבוֹת
  choice: 神柱
  rationale: מַצֵּבוֹת 指用于宗教崇拜的立石或石柱；“神柱”既简明，又点明其祭祀功能，而非普通建筑柱。
- source_word: וַיְגַדַּע
  choice: 砍倒
  rationale: גדע 表示砍断、砍倒，适合描述木制或树状的祭祀物。
- source_word: הָאֲשֵׁרִים
  choice: 亚舍拉木柱
  rationale: 该复数名词指与女神亚舍拉崇拜有关的祭祀物，可能是木柱、神木或树状象征物。“亚舍拉木柱”便于普通读者理解，同时用脚注保留具体形态的不确定性。
theological_decisions:
- issue: 偶像崇拜改革语境中 אֲשֵׁרִים 的译法
  choice: 亚舍拉木柱
  alternative: 亚舍拉神木；亚舍拉崇拜物
  rationale: 原词明确关联亚舍拉崇拜，但这些物件究竟是木柱、神木还是其他树状象征物，并不能一概确定。正文采用通顺而常见的“亚舍拉木柱”，脚注说明其所指范围，避免把形态说得过于确定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。四个并列动作以简洁动词推进；对古代祭祀术语采用“丘坛”“神柱”“亚舍拉木柱”，并以脚注解释最具不确定性的术语。
