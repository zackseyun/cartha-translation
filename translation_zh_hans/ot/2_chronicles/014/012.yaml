source:
  edition: WLC
  text: וַ/יִּרְדְּפֵ֨/ם אָסָ֜א וְ/הָ/עָ֣ם אֲשֶׁר עִמּ/וֹ֮ עַד לִ/גְרָר֒ וַ/יִּפֹּ֤ל מִ/כּוּשִׁים֙ לְ/אֵ֣ין לָ/הֶ֣ם מִֽחְיָ֔ה כִּֽי נִשְׁבְּר֥וּ לִ/פְנֵֽי יְהוָ֖ה וְ/לִ/פְנֵ֣י מַחֲנֵ֑/הוּ וַ/יִּשְׂא֥וּ שָׁלָ֖ל הַרְבֵּ֥ה מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: zh_hans
  text: 亚撒和随同他的百姓追赶他们，直到基拉耳。古实人[a]倒下，以致没有一个存活；他们在雅威和他的军队[b]面前被击溃。他们掳去了极多的战利品。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上也译作“埃塞俄比亚人”。希伯来文作“古实人”，指来自古实的人。
    reason: 说明族名的传统译法，同时避免将古代古实直接等同于现代埃塞俄比亚。
  - marker: b
    text: “军队”也可译作“营地”。“他的”可能指亚撒，也可能指雅威；若指雅威，可理解为“雅威的军队”或“雅威的营地”。
    reason: 原词兼有“营地”和“军队”之义，且第三人称后缀的所指存在真实歧义。
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: 追赶他们
  rationale: רָדַף在军事叙事中表示追击、追赶；此译自然，并保留行动的连续性。
- source_word: עַד לִגְרָר
  choice: 直到基拉耳
  rationale: עַד加地名表示追击所达到的地点；“直到”准确表达范围终点。
- source_word: מִכּוּשִׁים
  choice: 古实人
  rationale: כּוּשִׁים指古实的居民；采用音译兼传统地名“古实”，避免用现代国家名称“埃塞俄比亚”造成时代错置。
- source_word: וַיִּפֹּל מִכּוּשִׁים
  choice: 古实人纷纷倒下
  rationale: נפל与מן连用，表示该群体中有人阵亡；“纷纷倒下”在中文中自然传达大量伤亡，同时未额外说明具体人数。
- source_word: לְאֵין לָהֶם מִחְיָה
  choice: 无一存活
  rationale: 该表达在本段战争语境中指没有存活者；译文简洁保留彻底败亡的力度。
- source_word: נִשְׁבְּרוּ
  choice: 被击溃
  rationale: שׁבר的被动式字面为“被打碎”，用于军队时表示遭到毁灭性击败；“被击溃”符合现代汉语军事叙事。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留介词“在……面前”所表达的空间—神学意象，并以“雅威”呈现圣名。
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: 和他的军队面前
  rationale: מַחֲנֶה可指营地或军队；战斗语境中“军队”更自然。代词所指仍可能有歧义，故以脚注说明。
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: 亚撒的人夺走了极多战利品
  rationale: נשא שׁלל表示带走掳获物；补明承接上文的主语“亚撒的人”，避免中文代词误指古实人；“极多”充分表达הַרְבֵּה מְאֹד的强调。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现这一专名，不以称号取代。
- issue: מַחֲנֵהוּ中第三人称后缀的所指
  choice: 正文保留“他的”，按叙事脉络主要理解为亚撒的军队
  alternative: 雅威的军队；他的营地
  rationale: “亚撒”是较自然的人称先行词，且经文并列“雅威”和这支作战力量；然而原文语法并未完全排除指雅威，也未限定מַחֲנֶה只能译作“军队”，因此在脚注中保留歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。句式贴近希伯来文的叙事推进，但适度分句以利普通读者理解；避免古奥词语，并以脚注保留族名、词义和代词所指的歧义。
