  to: 亚撒和随同他的百姓追赶他们，直到基拉耳。古实人[a]倒下，以致没有一个存活；他们在雅威和他的军队[b]面前被击溃。他们掳去了极多的战利品。
  rationale: 修订仅消除两处不必要的语义具体化：将“跟随他的人”改为“随同他的百姓”，并以“他们”承接末句复数主语。脚注b改用不偏向任何一方的措辞，保留原文对“他的”及מַחֲנֶה含义的歧义。
