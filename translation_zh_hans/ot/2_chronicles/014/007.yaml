base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: zh_hans
  text: 亚撒有一支军队：犹大人三十万，手持大盾和矛；便雅悯人二十八万，手持盾牌、拉弓的。这些人都是英勇的战士。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיִל
  choice: 军队
  rationale: 此处处于军事统计语境，指亚撒所拥有的军兵整体；译作“军队”清楚自然。
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: 手拿大盾和矛
  rationale: נֹשֵׂא表示携带或装备武器；צִנָּה指较大的护身盾，与后文מָגֵן有所区别；רֹמַח译作通俗明确的“矛”。
- source_word: מִיהוּדָה
  choice: 犹大人
  rationale: 介词מִן表示来源或支派归属；在汉语军队统计中，用“犹大人”比直译“来自犹大”更自然。
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: 三十万
  rationale: 按希伯来文数字直接翻译。
- source_word: נֹשְׂאֵי מָגֵן
  choice: 手拿盾牌
  rationale: 分词表示装备盾牌的军士；מָגֵן译作“盾牌”，并以此前的“大盾”保留两种盾牌名称的区别。
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: 能拉弓射箭
  rationale: 字面涉及踩弓或张弓，是描述弓手的习语；“能拉弓射箭”以现代汉语表达其军事技能，同时避免误解为只在给弓上弦。
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 二十八万
  rationale: 按希伯来文数字直接翻译。
- source_word: כָּל אֵלֶּה
  choice: 这些人都
  rationale: 自然表达总结性的指称，并明确所指为前述军士。
- source_word: גִּבּוֹרֵי חָיִל
  choice: 英勇的战士
  rationale: 这是指强健、勇武之战士的固定军事用语；“英勇的战士”既保留勇武含义，又符合现代汉语习惯。
theological_decisions:
- issue: גִּבּוֹרֵי חָיִל的性别与军事含义
  choice: 英勇的战士
  alternative: 勇猛之士
  rationale: 上下文明显指古代军队中的作战人员。“战士”准确保留军事身份；汉语无需另加“男性”才能忠实表达，且不把该短语扩展为抽象的道德或属灵称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以冒号和分号清楚呈现犹大、便雅悯两支军兵的统计；“大盾”与“盾牌”保留צִנָּה和מָגֵן的词汇区别。
