base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/003.yaml
  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: zh_hans
  text: 他吩咐犹大人寻求耶和华他们祖先的神，遵行律法和诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: 他吩咐犹大人
  rationale: אָמַר 后接间接宾语及不定式，在此语境中表达命令，译为“吩咐”自然准确；“犹大”指当地群体，补出“人”以符合现代汉语。
- source_word: לִדְרוֹשׁ אֶת־יְהוָה
  choice: 寻求耶和华
  rationale: דָּרַשׁ 在此指转向、求问并敬奉神；“寻求”保留其较宽的语义范围。神名 יהוה 按现代中文圣经惯例译为“耶和华”。
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: 他们祖先的神
  rationale: אָבוֹת 可指父辈或历代祖先；此处涉及以色列共同传承，译为“祖先”比字面的“父亲们”自然。
- source_word: וְלַעֲשׂוֹת הַתּוֹרָה וְהַמִּצְוָה
  choice: 遵行律法和诫命
  rationale: עָשָׂה 与“律法、诫命”搭配时意为实行、遵守，译作“遵行”既准确又庄重；保留两个并列单数名词。
theological_decisions:
- issue: “律法和诫命”两个单数名词的关系
  choice: 保留为“律法和诫命”
  alternative: 合并译为“律法的一切诫命”或泛化为“律法”
  rationale: 原文以 וְ 并列 הַתּוֹרָה 与 הַמִּצְוָה，具体关系并未说明；直保并列可避免替作者消除可能的强调或张力。
- issue: “寻求耶和华”的含义范围
  choice: 直译为“寻求耶和华”
  alternative: 解释性译为“敬拜耶和华”或“求问耶和华”
  rationale: 原词可涵盖求问、归向、敬奉等意思；“寻求”保留原文的开放性，不限缩为单一宗教行为。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句法紧凑，保留原文两个并列目的动作；不添加原文没有的解释性成分。
