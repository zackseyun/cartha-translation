  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: zh_hans
  text: 古实人[a]谢拉率领一百万大军[b]和三百辆战车，出兵向他们进军，来到玛利沙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实人”是希伯来文的民族地理称谓，传统上也译作“埃塞俄比亚人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“一千个一千”；可按算术译作“一百万”，也可能是表示极大数目的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: 出兵攻打他们
  rationale: יצא在战争叙事中表示出动或出战；אֲלֵיהֶם字面为“向他们”，在此语境中带有敌对意味。译为“出兵攻打他们”既自然，也明确保留军事语境。
- source_word: זֶרַח הַכּוּשִׁי
  choice: 古实人谢拉
  rationale: “谢拉”按希伯来人名音译；כּוּשִׁי采用圣经地理民族名称“古实人”，比传统的“埃塞俄比亚人”更直接对应原文，并避免把古代古实与现代国家简单等同。
- source_word: בְּחַיִל
  choice: 率领……大军
  rationale: חַיִל在此指军事力量或军队，不是财富或勇力；结合汉语叙事句式译作“率领……大军”。
- source_word: אֶלֶף אֲלָפִים
  choice: 一百万
  rationale: 该表达按算术可理解为“一千个一千”，即一百万。正文采用自然清楚的现代汉语表达，脚注保留其希伯来语字面形式以及可能作为极大数目表达的张力。
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: 和三百辆战车
  rationale: 按原文数目和名词直接翻译，并使用现代汉语量词“辆”。
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: 一直来到玛利沙
  rationale: עַד表示行动所达到的地点或界限；“一直来到”比单纯的“到了”更能体现“来到……为止”的意味。
