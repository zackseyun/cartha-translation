base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: zh_hans
  text: 他们又攻打了放牧牲畜的营地[a]，掳走[b]了大批羊群[c]和骆驼，然后返回耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“牲畜的帐棚”，可能指牧人扎营放牧的地方。
    reason: lexical_alternative
  - marker: b
    text: 原文动词通常可译为“掳为俘虏”；以牲畜为宾语时，意思是把它们夺作战利品。
    reason: lexical_alternative
  - marker: c
    text: “羊群”所译的希伯来语也可泛指由绵羊和山羊构成的小型牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 又
  rationale: 表达附加和承接关系，把本次行动与上文相连，符合现代汉语叙事习惯。
- source_word: אָהֳלֵי מִקְנֶה
  choice: 放牧牲畜的营地
  rationale: 原文直译为“牲畜的帐棚”，实际可能指与畜群相连的牧人营地；此译既保留牧畜背景，也避免让读者误以为牲畜本身住在帐棚里。
- source_word: הִכּוּ
  choice: 攻打了
  rationale: נכה基本义为“击打”，在军事和劫掠语境中表示攻击；“攻打”比生硬的“击打帐棚”更符合现代汉语。
- source_word: וַיִּשְׁבּוּ
  choice: 掳走
  rationale: שבה常指掳为俘虏；此处宾语是牲畜，因此译为“掳走”，保留夺取战利品的意味。
- source_word: צֹאן
  choice: 羊群
  rationale: צֹאן是集合名词，可指绵羊、山羊等小型牲畜；“羊群”自然地保留其集合意义，脚注说明其范围。
- source_word: לָרֹב
  choice: 大批
  rationale: 准确表达数量很多的意思，并与“羊群”自然搭配。
- source_word: וּגְמַלִּים
  choice: 和骆驼
  rationale: 直接对应原文名词和连接词。
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: 然后返回耶路撒冷
  rationale: 体现连续叙事中的下一步行动；汉语可由上下文明确主语仍是他们。
theological_decisions: []
