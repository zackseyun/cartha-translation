  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: zh_hans
  text: 他在犹大建造了设防城，因为那地安宁；那些年间，没有战事与他有关[a]，因为雅威使他得享安息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有涉及他的战争。”希伯来语这一表达也可泛指亚撒没有卷入战争。
    reason: 保留וְאֵין עִמּוֹ מִלְחָמָה可指战争未涉及亚撒、而不必限定为战争进攻他的语义幅度。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 他……建造了
  rationale: 该词是בנה的叙事性未完成式连续体，述说亚撒过去的行动；中文不必机械译出句首连接词。
- source_word: עָרֵי מְצוּרָה
  choice: 设防城
  rationale: 该组合表示具有防御工事的城邑；“设防城”简洁、自然，并保留军事防御含义。
- source_word: בִּיהוּדָה
  choice: 在犹大
  rationale: 介词בְּ在此表示地点。
- source_word: שָׁקְטָה הָאָרֶץ
  choice: 那地安宁
  rationale: שׁקט表示平静、不受扰乱；“安宁”在现代中文中自然，也没有提前把后文“安息”的含义完全并入此处。
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: 没有战争临到他
  rationale: 希伯来表达直译近于“没有战争与他同在”，意指没有涉及或面对他的战争；正文采用自然中文，同时以脚注保留其范围上的含混。
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: 那些年间
  rationale: 这是指叙事所述时期的时间短语。
- source_word: הֵנִיחַ
  choice: 使他得享安息
  rationale: נוח的使役式表示使人获得安歇或免受冲突；此译保留由神赐下安息的主题。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来四字神名作音译，保留其专名性质，不以称号替代。
- source_word: לוֹ
  choice: 他
  rationale: 该代词是הֵנִיחַ的间接受词；中文以“使他得享安息”自然表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，保留专名性质，不用称号替代。
- issue: 安宁与安息的因果关系
  choice: 保留两个“因为”所表达的因果链
  alternative: 将末句弱化为并列说明
  rationale: 原文两次使用כִּי：那地安宁解释筑城的时机，雅威赐安息又解释没有战争的状况；译文保留这一神学与叙事结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“设防城”“那地安宁”“得享安息”兼顾历史叙事的清晰度与原文措辞的呼应；脚注标记紧接其所说明的战争短语。
