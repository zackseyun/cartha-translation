revisions:
- from: 他们对那些人说：“不可把俘虏带到这里来！你们竟打算使雅威所追讨的罪责落在我们身上[a]，在我们的罪和罪责上再加一层。我们的罪责已经很重，烈怒[b]也临到以色列了。”
  to: 他们对那些人说：“不可把俘虏带到这里来！因为你们打算加增我们的罪和罪责，使雅威所加的罪责落在我们身上[a]；我们的罪责很重，并且有烈怒临到以色列[b]。”
  rationale: 修订删除原文未明确表达的“也”和完成时“了”，并以“加增我们的罪和罪责”替代不够自然的“再加一层”。中段维持审计译文所采纳的理解，即拟议行动会使罪责从雅威而来、落在他们身上；脚注则以不增添时态的方式保留该困难短语的另一种可能理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:21:06Z'
