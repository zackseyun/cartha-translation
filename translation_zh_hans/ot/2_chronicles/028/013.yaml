  text: וַ/יֹּאמְר֣וּ לָ/הֶ֗ם לֹא תָבִ֤יאוּ אֶת הַ/שִּׁבְיָה֙ הֵ֔נָּה כִּי֩ לְ/אַשְׁמַ֨ת יְהוָ֤ה עָלֵ֨י/נוּ֙ אַתֶּ֣ם אֹמְרִ֔ים לְ/הֹסִ֥יף עַל חַטֹּאתֵ֖י/נוּ וְ/עַל אַשְׁמָתֵ֑י/נוּ כִּֽי רַבָּ֤ה אַשְׁמָה֙ לָ֔/נוּ וַ/חֲר֥וֹן אָ֖ף עַל יִשְׂרָאֵֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: zh_hans
  text: 他们对那些人说：“不可把俘虏带到这里来！因为你们打算加增我们的罪和罪责，使雅威所加的罪责落在我们身上[a]；我们的罪责很重，并且有烈怒临到以色列[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来语十分紧凑，也可理解为“我们对雅威所负的罪责在我们身上”。它可能强调雅威因罪施行的追讨，也可能强调人对雅威所负的罪责。
    reason: alternative_reading
  - marker: b
    text: 希伯来语直译为“怒气的燃烧”，是形容极其强烈的愤怒的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: 俘虏
  rationale: 此词既可指被掳的状态，也可统指被掳的人；在“带到这里来”的语境中，具体指被俘的人。
- source_word: הֵנָּה
  choice: 到这里来
  rationale: 这是表示朝说话者所在之处移动的方位副词；现代汉语以“到这里来”表达最自然。
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: 使雅威所追讨的罪责落在我们身上
  rationale: 希伯来语结构紧凑，既可能侧重对雅威所负的罪责，也可能侧重雅威因罪而施加的追讨或审判。正文按上下文采用后者，同时以脚注保留另一种理解。
- source_word: אַתֶּם אֹמְרִים
  choice: 你们竟打算
  rationale: 字面为“你们说”，但此处表达将要采取某项行动的意图；“打算”符合现代汉语，“竟”传达说话者的责难语气。
- source_word: לְהֹסִיף עַל
  choice: 在……上再加一层
  rationale: 保留“加在……之上”的累积意象，也自然表达罪与罪责进一步加重。
- source_word: חַטֹּאתֵינוּ
  choice: 我们的罪
  rationale: 指所犯的罪或过犯；与后面的“罪责”分别翻译，以保留原文两个相关而不完全相同的词。
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: 我们的罪责／我们的罪责已经很重
  rationale: 该名词着重犯罪所产生的责任和负罪状态，不仅指犯罪行为。“很重”以自然汉语表达 רַבָּה 的“重大、众多”之意，并契合累积罪责的语境。
- source_word: וַחֲרוֹן אָף
  choice: 烈怒
  rationale: 字面含“怒气燃烧”的意象，是表示强烈愤怒的惯用语；“烈怒”简洁而保留其强度。
- source_word: עַל יִשְׂרָאֵל
  choice: 临到以色列
  rationale: 介词 עַל 与烈怒连用，可表示怒气落在某对象身上；“临到”保留审判已经压在以色列之上的语感。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为上帝盟约之名的性质，避免以称号替代专名。
- issue: לְאַשְׁמַת יְהוָה עָלֵינוּ 中罪责与雅威的关系
  choice: 雅威所追讨的罪责落在我们身上
  alternative: 我们对雅威所负的罪责／使我们在雅威面前有罪
  rationale: 上下文警告把俘虏带来会使既有罪责加重，并招致神的追讨；然而原文属格关系本身含混，因此正文采用合乎语境的一种理解，脚注明示另一种可能，不消除神学张力。
- issue: 以色列在南北国历史语境中的所指
  choice: 以色列
  alternative: 北国／以法莲
  rationale: 原文使用“以色列”，正文保留这个正典称谓，不把其历史所指解释性地缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可”保持公开劝阻的郑重语气；“俘虏”“罪”“罪责”均为普通读者易懂的词，并保留原文对犯罪行为与负罪状态的区分。脚注标记均置于所解释的具体短语之后。
