  - severity: low
    issue: “在我们的罪和罪责上再加一层”不够自然。
    rationale: 该译法虽保留累积意象，但现代庄重汉语中“加增我们的罪和罪责”更顺畅，并能清楚表达 לְהוֹסִיף עַל 的加重含义。
  - severity: low
    issue: 脚注a的替代译文加入“已经”。
    rationale: 原文困难短语本身并无“已经”；应避免在脚注替代译法中增加时态信息。
