  source_fidelity: 草稿正确保留了“俘虏”“罪／罪责”的区分、雅威之名和“以色列”。但“烈怒也临到以色列了”加入了原文未明说的完成时态；“罪责已经很重”中的“已经”虽合语境，却最好不作为对 רַבָּה 的直接限定。中段可更明确保留原文中“加增罪与罪责”及其招致雅威所加罪责的关系，而不把困难短语解释得过满。
  naturalness: “在……上再加一层”略显口语化且搭配生硬；“烈怒也临到……了”带有不必要的“也”和完成体。改为“加增……的罪和罪责”“有烈怒临到……”更庄重、自然，也更贴近希伯来语的名词性陈述。
  terminology: “雅威”“俘虏”“罪”“罪责”“以色列”均可保留。“雅威所加的罪责”谨慎表达英译审计所采用的“from Yahweh upon us”，同时脚注保留该短语可理解为“对雅威所负的罪责”的歧义。
