base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: zh_hans
  text: 亚哈斯收集了上帝殿中的器皿，又把上帝殿中的器皿砍碎；他关闭了耶和华殿的门，并在耶路撒冷的每个角落为自己设立祭坛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 收集了
  rationale: 基本保留“聚集、收拢”的动作含义；上下文表明亚哈斯把殿中器皿集中起来，但本节本身未明说具体目的。
- source_word: כְּלֵי בֵית הָאֱלֹהִים
  choice: 上帝殿里的器皿
  rationale: כְּלֵי 可泛指器具、用具或器皿；在圣殿语境中，“器皿”庄重自然，也不额外限定其种类。
- source_word: וַיְקַצֵּץ
  choice: 砍碎
  rationale: 该加强词形表达砍断、切碎或砍成块；“砍碎”既体现破坏性动作，也避免添加原文未明说的熔化等处理方式。
- source_word: דַּלְתוֹת
  choice: 门
  rationale: 希伯来文为复数门扇；现代汉语通常自然地统称为“门”，而“关闭”已清楚表达封闭入口。
- source_word: בְּכָל־פִּנָּה
  choice: 每个街角
  rationale: 字面为“每个角落”；在城市及设置祭坛的语境中，指各街角或各处转角，“每个街角”比抽象的“每个角落”更具体自然。
- source_word: מִזְבְּחוֹת
  choice: 祭坛
  rationale: 准确表达用于献祭的坛，复数意义由“每个街角”与动词宾语关系自然体现。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／以“大写的主”作替代称谓
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，明确区别于普通称谓“主”，同时不在正文中加入对其发音史的解释。
- issue: “上帝的殿”与“耶和华的殿”的措辞转换
  choice: 依原文分别译为“上帝殿”和“耶和华殿”
  alternative: 两处统一译成同一称谓
  rationale: 保留原文先用 אֱלֹהִים、后用 יהוה 的措辞变化，不擅自抹平其文体与神学表达。
- issue: לֹו 的受益关系
  choice: 为自己筑起祭坛
  alternative: 筑了祭坛
  rationale: 明确保留原文“给他自己／为自己”的成分，呈现亚哈斯自主设坛的意味，但不额外断言这些坛具体献给哪一位神。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。句法保留原文连续叙事的推进感，以“又、并且、还”连接各项行动；不添加原文未说明的祭坛对象、器皿用途或关闭圣殿的动机。
