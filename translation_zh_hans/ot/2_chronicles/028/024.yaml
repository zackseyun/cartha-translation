revisions:
- from: 亚哈斯收集了上帝殿里的器皿，又把上帝殿里的器皿砍碎，并且关闭了耶和华殿的门，还在耶路撒冷的每个街角为自己筑起祭坛。
  to: 亚哈斯收集了上帝殿中的器皿，又把上帝殿中的器皿砍碎；他关闭了耶和华殿的门，并在耶路撒冷的每个角落为自己设立祭坛。
  rationale: 作两项轻微修订：将“街角”恢复为涵盖更广的“角落”，并以“设立”替代带有较强施工含义的“筑起”。同时调整介词结构，使庄重现代汉语更顺畅；其余叙事次序、重复、神名差异和“为自己”均保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T06:20:34Z'
