base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: zh_hans
  text: 雅威因以色列王亚哈斯[a]的缘故，使犹大降卑；因为他使犹大放纵无度[b]，极其不忠于雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“以色列王亚哈斯”。亚哈斯实际是犹大王；这里保留《历代志》的原文措辞，不作协调。
    reason: alternative_reading
  - marker: b
    text: “使犹大放纵无度”或译“在犹大任意妄为”，也可译“使犹大失去约束”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: 使……降卑
  rationale: 保留使役形的含义，表明雅威使犹大的地位和境况降低；也避免将其局限为纯军事意义的“制伏”。”
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现以色列上帝的专名，而不以称号代替。
- source_word: בַּעֲבוּר
  choice: 因为
  rationale: 此处表示原因；用“因为……所以……”清楚呈现希伯来语的因果关系。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 马所拉文本明确称亚哈斯为“以色列王”；正文保留这一措辞，不按历史身份协调为“犹大王”。”},{
- source_word: הִפְרִיעַ
  choice: 使……放纵无度
  rationale: 保留使役意味，并表达解除约束、导致失序的含义；脚注列出其他可能译法。
- source_word: בִּיהוּדָה
  choice: 犹大
  rationale: 与使役动词连读为“使犹大……”，在现代汉语中自然表达行动所涉及的对象或范围。
- source_word: וּמָעוֹל מַעַל
  choice: 并且大大背叛
  rationale: 同根词的强化结构表示严重的盟约不忠；“大大”保留强化语气，“背叛”体现对雅威的不忠。
- source_word: בַּיהוָה
  choice: 雅威
  rationale: 与“背叛”搭配时，汉语直接以宾语表达背叛所针对的对象。
theological_decisions:
- issue: 亚哈斯被称为“以色列王”
  choice: 正文保留“以色列王亚哈斯”
  alternative: 按历史身份译作“犹大王亚哈斯”
  rationale: 原文明确写“以色列王”。虽然亚哈斯在历史上统治犹大，但译文不应消除《历代志》此处可能具有的修辞或神学张力；历史说明置于脚注。
- issue: מעל 的盟约含义
  choice: 译作“大大背叛雅威”
  alternative: 译作“严重得罪雅威”或“对雅威极不忠信”
  rationale: “背叛”能自然传达对雅威的严重不忠，同时不额外指定某种具体罪行；“大大”反映原文同根强化结构。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“降卑”“背叛”保留经文的神学分量；以清楚的因果句式重组希伯来语语序。正文脚注标记[a]、[b]均已对应列出。
