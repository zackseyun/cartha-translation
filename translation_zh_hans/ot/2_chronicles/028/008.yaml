base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: zh_hans
  text: 以色列人从自己的弟兄[a]中掳走了二十万妇女、儿子和女儿；又从他们那里掠夺了大量战利品，把这些战利品带到撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“同族”或“以色列同胞”。希伯来原文直译为“弟兄”，强调双方共有的亲族身份。
    reason: 词义范围及亲属语言的强调
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: 掳走了
  rationale: 该动词指战争中将人掳为俘虏；“掳走”自然地保留了军事语境和被带离的含义。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 现代汉语通常以“以色列人”表达该群体称谓；下文“自己的弟兄”仍清楚保留同族之间冲突的亲属张力。
- source_word: מֵאֲחֵיהֶם
  choice: 从自己的弟兄中
  rationale: 直译“弟兄”以保留原文强调共同亲族身份的伦理与神学分量；“自己的”明确反身所属关系。
- source_word: מָאתַיִם אֶלֶף
  choice: 二十万
  rationale: 按原文基数直接翻译。
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: 妇女、儿子和女儿
  rationale: 保留原文明确列出的三个群体，不笼统合并为“妇女儿童”；“儿子和女儿”也延续本节的亲属语言。
- source_word: שָׁלָל רָב
  choice: 许多财物
  rationale: 此处指战争中夺取的大量物品；“财物”使首处表达符合现代汉语，同时后句用“掠物”对应重复出现的同一希伯来名词。
- source_word: בָּזְזוּ
  choice: 掠取了
  rationale: 准确表达以战争劫掠方式夺取物品，而不是一般意义的拿取。
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: 把掠物带到撒马利亚
  rationale: 直接传达动作、宾语和目的地；“撒马利亚”为该地名的现代标准译法。
theological_decisions:
- issue: 以色列内部冲突中的亲属称谓
  choice: 从自己的弟兄中
  alternative: 从自己的同胞中／从以色列同族中
  rationale: 原文以“弟兄”突出掳掠者与被掳者的共同亲族和立约群体身份。保留这一称谓，不把其中的伦理张力弱化为一般的“敌人”或仅解释为“同胞”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“以色列人”比逐字译作“以色列的儿子们”更符合现代汉语；“弟兄”则特意保留原文的亲属称谓及其道德张力。脚注标记置于完整列举之后，说明的是“弟兄”的译法。
