  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: zh_hans
  text: 因为亚哈斯搜刮了雅威的殿[a]、王宫和众首领，把所得的财物送给亚述王，却对他毫无帮助[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “搜刮”所译的希伯来词也可译为“分开”或“分配”；这里指从这些地方和首领那里取走财物。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却没有得到他的帮助。”上下文可理解为亚述王没有给亚哈斯带来援助。
    reason: ambiguity
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为亚哈斯越发困苦的处境提供解释，保留因果意味。
- source_word: חָלַק
  choice: 搜刮
  rationale: 该词本义可指“分开、分配”，但本处所取之物被送给亚述王，语境表明亚哈斯从圣殿、王宫和首领那里搜取财物；“搜刮”自然传达此处的负面语义，同时在脚注保留字面可能。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: “殿”在现代汉语中自然指神的圣所；既传达 בֵּית 的语境所指，也避免较生硬的“雅威的家”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，不用称号代替专名。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 该短语在此指王的宫室；“王宫”简洁自然，并与“殿”和“众首领”清楚区分。
- source_word: הַשָּׂרִים
  choice: 众首领
  rationale: שָׂרִים 可指首领、官长或贵族；“众首领”保留其较宽的统治阶层含义，不限定为王子。
- source_word: וַיִּתֵּן
  choice: 把所得的财物送给
  rationale: 希伯来文直译为“给了”，宾语由前面的搜刮行为隐含；汉语补出“所得的财物”，使指代清楚而不增添新的事件。
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: 给亚述王
  rationale: 准确、自然地表达间接宾语。
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: 却没有得到他的帮助
  rationale: 短语较直译为“却没有成为对他的帮助”；此处“他的”自然回指亚述王，表达亚哈斯送礼却未获援助的结果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其专名性质，不以称号替代。
- issue: 末句中帮助关系的表达
  choice: 没有得到他的帮助
  alternative: 这对他并没有帮助
  rationale: 希伯来语 לְעֶזְרָה לוֹ 可概括为“没有给他带来帮助”，也可结合最近的“亚述王”理解为亚哈斯未从亚述王得到帮助。正文采用后者以符合叙事关系，但脚注保留非人格化的语法表达，避免排除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威的殿、王宫和众首领”按原文列出三个并列来源；补出“所得的财物”以消除汉语中宾语省略造成的含混。
