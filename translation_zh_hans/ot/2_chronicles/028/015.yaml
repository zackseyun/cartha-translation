revisions:
- from: 那些被点名指定的人就起来，接手照管俘虏；凡俘虏中赤身的，他们都用战利品给他们穿上。他们给俘虏穿好衣服和鞋，供他们吃喝，为他们抹油，又让所有走不动的人骑上驴，领他们到棕榈城耶利哥，回到他们的弟兄[a]那里；随后，他们返回撒马利亚。
  to: 那些被点名指定的人就起来，接手照管俘虏；他们用战利品中的衣物，给俘虏中所有赤身露体的人穿上衣服。他们又给俘虏穿上衣服和鞋，供他们吃喝，为他们抹油，使所有虚弱、走不动的人骑上驴，把他们带到耶利哥，就是棕榈城，送到他们的弟兄[a]那里；随后，这些人返回撒马利亚。
  rationale: 修订只解决汉语句法和指代问题，并更明确表达衣物取自战利品。保留原文中两次“穿衣”的重复、对虚弱者以驴载送的画面，以及“弟兄”的字面称谓和脚注所说明的较广亲属／同胞含义。
