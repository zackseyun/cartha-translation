  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: zh_hans
  text: 那些被点名指定的人就起来，接手照管俘虏；他们用战利品中的衣物，给俘虏中所有赤身露体的人穿上衣服。他们又给俘虏穿上衣服和鞋，供他们吃喝，为他们抹油，使所有虚弱、走不动的人骑上驴，把他们带到耶利哥，就是棕榈城，送到他们的弟兄[a]那里；随后，这些人返回撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可理解为“亲族”或“以色列同胞”。
    reason: 说明 אֲחֵיהֶם 在此不一定专指亲兄弟，也可表示同族、同胞。
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: 被点名指定
  rationale: 被动式配合“按名字”表示这些人被明确点名或指定；此译既保留“点名”，也自然表达其受委派的含义。
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: 接手照管俘虏
  rationale: חזק ב 在此怜悯、救助的语境中不是敌意地抓住，而是承担照料和管理责任；“接手照管”兼顾动作与语境。
- source_word: מַעֲרֻמֵּיהֶם
  choice: 俘虏中赤身的
  rationale: 指俘虏群体中衣不蔽体或被剥去衣服的人；明确其范围，避免汉语中代词指向不清。
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: 用战利品给他们穿上
  rationale: 保留衣物来自战利品这一信息；“战利品”符合战争叙事的现代庄重用语。
- source_word: וַיַּלְבִּשׁוּם וַיַּנְעִלוּם
  choice: 给俘虏穿好衣服和鞋
  rationale: 希伯来文逐项叙述穿衣、穿鞋；汉语合并表达更自然，同时“穿好”体现实际为他们装备妥当，并保留前后重复所带来的照料强调。
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: 供他们吃喝
  rationale: 准确而简洁地表达使其吃、使其喝，不擅自限定饮料为水。
- source_word: וַיְסֻכוּם
  choice: 为他们抹油
  rationale: סוך 在此更可能指用油护理、恢复身体，而非礼仪性的膏立；“抹油”保留动作，也避免引入宗教仪式含义。
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: 让所有走不动的人骑上驴，领他们
  rationale: כושל 本指蹒跚、将要跌倒者，语境中是虚弱到难以行走的人；נהל 表示引领，故译文同时保留乘驴与领送的图景。
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: 棕榈城耶利哥
  rationale: 这是耶利哥的传统称号；“棕榈城耶利哥”比“棕榈树之城”更凝练自然。
- source_word: אֵצֶל אֲחֵיהֶם
  choice: 回到他们的弟兄那里
  rationale: אצל 表示到其弟兄身边；结合送还俘虏的情境，以“回到”自然显明归还，但不改变“弟兄”的字面亲族与同胞意涵。
theological_decisions:
- issue: אֲחֵיהֶם 在盟约同胞语境中的范围
  choice: 他们的弟兄
  alternative: 他们的亲族／以色列同胞
  rationale: 原文为阳性复数“弟兄”，在此可广指犹大同胞。正文保留原有亲属称谓及其群体关系，不将范围收窄为亲兄弟，也不直接释义成民族身份；脚注说明其较宽泛的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。连续救助动作按汉语节奏适度整合，但保留原文从穿衣、穿鞋、饮食、抹油到护送的层层推进。正文脚注标记与脚注一致。
