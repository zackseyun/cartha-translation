  text: וּ/פְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּ/עָרֵ֨י הַ/שְּׁפֵלָ֣ה וְ/הַ/נֶּגֶב֮ לִֽ/יהוּדָה֒ וַֽ֠/יִּלְכְּדוּ אֶת בֵּֽית שֶׁ֨מֶשׁ וְ/אֶת אַיָּל֜וֹן וְ/אֶת הַ/גְּדֵר֗וֹת וְ/אֶת שׂוֹכ֤וֹ וּ/בְנוֹתֶ֨י/הָ֙ וְ/אֶת תִּמְנָ֣ה וּ/בְנוֹתֶ֔י/הָ וְ/אֶת גִּמְז֖וֹ וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יֵּשְׁב֖וּ שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: zh_hans
  text: 非利士人侵袭了犹大的低地和南地的城邑，又攻取了伯示麦、亚雅仑、基低罗、梭哥[a]及其所属的村庄、亭拿及其所属的村庄、瑾锁及其所属的村庄，并住在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “梭哥”也可音译为“梭可”。
    reason: 地名שׂוֹכוֹ存在不同的音译形式；正文采用中文读者较熟悉的“梭哥”，脚注保留另一种可行音译。
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经读者熟悉的族名；前缀连词在中文中由后文“又”体现叙事衔接，避免句首“并且”的生硬表达。
- source_word: פָּשְׁטוּ
  choice: 侵袭了
  rationale: 此动词在军事语境中指突袭、侵入或劫掠；“侵袭”既表达军事进犯，也不把原文限定为单纯抢掠。
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: 犹大低地和南地的城邑
  rationale: הַשְּׁפֵלָה与הַנֶּגֶב均为地理区域名称；“低地”和“南地”简洁保留其地域性质，“城邑”自然涵盖有城防或规模不一的聚落。
- source_word: וַיִּלְכְּדוּ
  choice: 又攻取了
  rationale: 军事语境中表示夺取城邑；“攻取”比泛泛的“拿下”更庄重明确。
- source_word: בֵּית שֶׁמֶשׁ / אַיָּלוֹן / הַגְּדֵרוֹת / שׂוֹכוֹ / תִּמְנָה / גִּמְזוֹ
  choice: 伯示麦、亚雅仑、基低罗、梭哥、亭拿、金锁
  rationale: 均按现代中文圣经地名惯例音译，同时保持各地名之间的区分。
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: 及其所属的村庄
  rationale: 字面为“它的女儿们”，是指依附于主城的卫星聚落；“所属的村庄”清楚传达这种从属关系，又避免照搬希伯来语习语。
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: 并住在那里
  rationale: ישׁב可指居住、定居；原文没有明确说明永久性，故用较中性的“住在那里”，保留占领后居住的含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。地理区域保留为“低地”和“南地”，附属聚落译作“所属的村庄”，以兼顾原文结构和现代读者的理解。
