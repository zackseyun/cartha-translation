id: 2CH.28.5
reference: 2 Chronicles 28:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: zh_hans
  text: 因此，他的上帝雅威把他交在亚兰王[a]手中。亚兰人击打他，从他那里掳走大批俘虏[b]，带到大马士革。他也被交在以色列王手中；以色列王使他遭受重大打击[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“叙利亚王”；希伯来文作“亚兰”。
    reason: lexical_alternative
  - marker: b
    text: 或译“从他那里掳走大量被掳的人”。
    reason: lexical_alternative
  - marker: c
    text: 或译“使他遭遇惨败”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ…בְּיַד
  choice: 把他交在……手中
  rationale: 保留“交在某人手中”这一希伯来语意象，同时自然表达落入对方权势之下的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译四字神名，不以“主”这一称号替代。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 保留原文的第三人称单数领属关系；即使处于审判语境，原文仍称雅威为他的上帝。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 采用希伯来专名“亚兰”，而不在正文中换成后世常用的“叙利亚”。
- source_word: וַיַּכּוּ בוֹ
  choice: 亚兰人击打他
  rationale: 动词为复数，按上下文补明主语“亚兰人”；“击打”保留 נכה 较宽泛的语义及其与末句军事打击的呼应。
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: 从他那里掳走大批人
  rationale: 将“众多被掳者／大批俘虏”的具体结果译出，同时以脚注保留另一种自然表述。
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: 带到大马士革
  rationale: 中文可承接前句“大批人”而省略重复宾语，指向清楚。
- source_word: וְגַם…נִתָּן בְּיַד
  choice: 他也被交在……手中
  rationale: 保留附加关系、被动形式，以及与前半节“把他交在……手中”的呼应。
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: 使他遭受重大打击
  rationale: 既保留 מַכָּה 的“打击”意象，也符合军事语境；脚注列出更明确的“惨败”译法。
theological_decisions:
- issue: 犹大败亡背后的施事者
  choice: 正文明确说雅威把他交在外国君王手中，并在后半句保留“被交在”这一被动表达。
  alternative: 将全节仅译作政治或军事上的失败，不凸显神的作为。
  rationale: 原文先用主动式 וַיִּתְּנֵהוּ，后用被动式 נִתָּן，明确把军事败局置于神施行审判的框架内；译文不削弱这一因果关系，也不额外发挥。
- issue: 四字神名的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用 יְהוָה；采用音译专名，以区别于称号“主”。
- issue: 单数代词“他”的所指
  choice: 保留“他”，不在正文中改成“亚哈斯和犹大”。
  alternative: 按历史处境扩展为亚哈斯或犹大国。
  rationale: 原文使用阳性单数代词，近指亚哈斯；但王所受的军事打击牵涉其臣民。保留单数可避免把这种代表性关系解释得过满。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“交在……手中”有意保留原文意象；“亚兰人”由复数谓语及上下文补明。所有脚注标记均置于正文相应词句之后。
