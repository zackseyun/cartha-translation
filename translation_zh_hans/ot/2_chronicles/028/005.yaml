revisions:
- from: 因此，雅威他的上帝把他交在亚兰王[a]手中。亚兰人击打他，从他那里掳走大批人[b]，带到大马士革。他也被交在以色列王手中；以色列王使他遭受重大打击[c]。
  to: 因此，他的上帝雅威把他交在亚兰王[a]手中。亚兰人击打他，从他那里掳走大批俘虏[b]，带到大马士革。他也被交在以色列王手中；以色列王使他遭受重大打击[c]。
  rationale: 修订仅补足“俘虏／被掳者”这一原文明确的语义，并调整首句语序使现代汉语更自然。其余措辞保留原稿对神圣施事、专名、单数代词及军事打击意象的忠实表达。
