base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: zh_hans
  text: 他在丘坛[a]、山冈上和每一棵青翠的树下献祭、烧香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在丘坛、山冈上和每一棵枝叶繁茂的树下献祭，并焚烧祭物，使烟上腾。”
    reason: 保留 וַיְקַטֵּר 可指焚烧祭物、使烟上腾的较宽祭祀含义，以及 רַעֲנָן“繁茂、枝叶丰盛”的词义可能。
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: 献祭
  rationale: 该动词的 piel 形式表示举行献祭；“献祭”简洁自然，并保留宗教礼仪含义。
- source_word: וַיְקַטֵּר
  choice: 烧香
  rationale: קטר 的 piel 形式可指焚香，也可泛指焚烧祭物使烟上腾；在本节祭祀语境中，“烧香”是自然且很可能的理解，另一可能性在脚注中保留。
- source_word: בַּבָּמוֹת
  choice: 在丘坛
  rationale: במות 是设于高处或与高处崇拜相关的祭祀场所。“丘坛”保留其专门的宗教含义，也符合中文圣经传统用语。
- source_word: וְעַל הַגְּבָעוֹת
  choice: 山冈上
  rationale: גבעות 是普通的“山冈、小山”，这里与作为专门祭祀场所的“丘坛”并列，不宜合并。
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: 各青翠树下
  rationale: רענן 描写繁茂、鲜绿的植物；“青翠树”保留原文惯用表达及其鲜明意象。“各”自然表达 כָּל 在此分配性的“每一处”。
theological_decisions:
- issue: 如何处理与非法或偶像崇拜相关的祭祀地点惯用语
  choice: 保留“丘坛”和“各青翠树下”的传统祭祀语言
  alternative: 意译为“异教祭坛”或“各枝叶茂盛的树下”
  rationale: 原文用语在旧约中具有跨文本呼应，并未在本句直接加上“异教”这一解释性标签。保留惯用语可传达其祭祀背景，同时避免把上下文判断写进正文。
- issue: קטר 的祭祀动作范围
  choice: 正文译为“烧香”，脚注保留泛指焚烧祭物的可能
  alternative: 正文译为“焚烧祭物，使烟上腾”
  rationale: 该词在礼仪语境中常指烧香，但也能涵盖焚烧祭物所产生的祭烟；采用常见自然的译法，同时以脚注保存词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“丘坛”作为旧约祭祀场所的专门术语予以保留；句式紧凑，依照希伯来文列举三个地点。脚注标记置于“丘坛”后，所注内容实际涵盖整句的词汇替代译法。
