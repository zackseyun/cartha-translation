- from: 亚哈斯登基时二十岁，在耶路撒冷作王十六年。他没有像他父亲大卫[a]那样，行雅威眼中看为正的事。
  to: 亚哈斯登基时二十岁，在耶路撒冷作王十六年。他没有行雅威眼中看为正的事，不像他父亲大卫[a]那样。
  rationale: 修订仅调整末句语序，使“没有行正事”与“不同于大卫”的关系在现代汉语中更明确、自然。脚注将“并非亲生父亲”具体化为“并非亚哈斯的直接父亲”，更准确说明大卫在此是王朝祖先。
