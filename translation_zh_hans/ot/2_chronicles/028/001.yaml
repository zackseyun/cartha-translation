  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: zh_hans
  text: 亚哈斯登基时二十岁，在耶路撒冷作王十六年。他没有行雅威眼中看为正的事，不像他父亲大卫[a]那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“父亲”指王室祖先，并非亚哈斯的直接父亲。
    reason: 文化与谱系用语说明
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: 二十岁
  rationale: 这是希伯来语表达年龄的固定格式；译为现代汉语“二十岁”自然且准确。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 该结构说明亚哈斯开始执掌王权时的年龄；“登基时”简洁地传达即位之意。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词指执掌王权、统治；“作王”符合中文圣经叙事的庄重语体，也易于理解。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 忠实表达其统治地点。
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: 没有……行……看为正的事
  rationale: 保留历代志常见的君王评价公式，同时调整语序，使现代汉语通顺。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为正的
  rationale: 保留“在……眼中”这一表达神作出评价的希伯来语意象，并采用自然的汉语句式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名而非称号的性质。
- source_word: כְּדָוִיד אָבִיו
  choice: 像他父亲大卫那样
  rationale: 保留原文“父亲”的王朝及宗族用语，不在正文中改写为“祖先”；用脚注说明此处并非指亲生父亲。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列神的四字神名；“雅威”旨在按较通行的学术复原读音将其作为专名呈现，而不是用“主”等称号替代。
- issue: “他父亲大卫”所表达的亲属关系
  choice: 正文保留“他父亲大卫”，脚注说明是王室祖先
  alternative: 直接译为“他的祖先大卫”
  rationale: 原文确实使用“父亲”，而在王室谱系语境中可泛指先祖。保留正文措辞并加注，既保存原文表达，也避免读者误以为大卫是亚哈斯的亲生父亲。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“登基时”“作王”符合君王纪年公式；后半句保留“雅威眼中看为正”的希伯来语评价意象。脚注标记紧接“大卫”，对应实际需要说明的“父亲”一词。
