base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: zh_hans
  text: 他又在犹大的每一座城[a]设立丘坛，向别的神烧香，惹雅威——他列祖的神——发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“犹大的一城又一城”，是分配式表达，意思是遍及犹大各城。
    reason: 说明原文重复结构及其周遍含义。
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: 又在犹大的每一座城
  rationale: עִיר וָעִיר是分配式重复，强调遍及犹大各城；译作“每一座城”既保留周遍含义，又符合现代汉语表达。句首“又”承接上文叙事。
- source_word: עָשָׂה בָמוֹת
  choice: 设立丘坛
  rationale: עשה本义宽泛，此处与宗教设施במות搭配，译作“设立”自然且不过度限定具体建造方式；“丘坛”保留其作为祭祀场所的传统语义。
- source_word: לְקַטֵּר
  choice: 烧香
  rationale: קטר的皮埃勒式在祭祀语境中通常指焚香或使祭物冒烟；本处译作“烧香”简明自然。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别的神
  rationale: 直译为“别的神”，不额外加入“外邦”等原文未明确表达的限定。
- source_word: וַיַּכְעֵס
  choice: 惹……发怒
  rationale: כעס的使役式表示激怒、惹怒；拆译为“惹……发怒”符合现代汉语，也清楚呈现使役含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: 他列祖的神
  rationale: “列祖”简洁保留אָבוֹת的家族与盟约历史意味，比泛化为“祖先”更贴近经文语域。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；“雅威”是较贴近YHWH常见学术复原读音的现代汉语音译，可避免把专名改成称号。“耶和华”虽为传统译名，但源自另一种读音传统。
- issue: “别的神”的表述
  choice: 保留原文措辞“别的神”
  alternative: 偶像；假神；外邦神明
  rationale: 原文אֱלֹהִים אֲחֵרִים直称“别的神”；译文不替作者添加本体论说明，也不把“别的”收窄为“外邦的”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“丘坛”“列祖”保留必要的圣经历史语感；破折号标明“他列祖的神”是对“雅威”的同位说明。
