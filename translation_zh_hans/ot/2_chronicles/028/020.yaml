base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: zh_hans
  text: 亚述王提革拉·毗列色前来攻击亚哈斯，压迫他[a]，却没有使他强盛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他困苦。”这里的希伯来语可指逼迫、压制或使人困苦；在军事语境中也可能带有围困的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: 前来攻击亚哈斯
  rationale: בוא על 在这里的军事和政治语境中含有敌对意味；用“攻击”比中性的“来到他那里”更能传达上下文。将代词明确为“亚哈斯”，符合现代汉语跨节阅读的清晰需要。
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: 提革拉·毗列色
  rationale: 采用现代中文圣经语境中通行且易辨认的亚述王名译法，并用间隔号标示复合音译名。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 简明自然地表达希伯来语属格结构，同时保留其政治身份。
- source_word: וַיָּצַר לוֹ
  choice: 使他陷入困境
  rationale: צרר 可指逼迫、压制或使人困苦；这里不必收窄为“围困”，因此采用能涵盖敌对压迫及其后果的表达。
- source_word: וְלֹא חֲזָקוֹ
  choice: 却没有帮助他强盛
  rationale: חזק 在此可表示使之强大、加强或给予支持。译文既保留“强”的词义，也用“帮助”呈现亚哈斯原本寻求援助的语境；“却”自然表达上下句的反差。
theological_decisions:
- issue: 亚述王的行动与亚哈斯所求援助之间的反差
  choice: 用“却”明确自然语义上的转折，但不把它改写成“反而”或“没有救他”
  alternative: 直译为“并没有使他强盛”
  rationale: 希伯来语以 וְ 连接两句，形式上可译“并且”，但上下文形成明显反差；“却”符合现代汉语，同时不额外断定更具体的神学含义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“陷入困境”避免把语义过度限定为正式围城；“帮助他强盛”兼顾 חזק 的“使强大”义及本节求援背景。脚注标记已在正文中对应出现。
