base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: zh_hans
  text: 利玛利的儿子比加在犹大一天之内杀了十二万人；他们全都是英勇的战士[b]，因为[c]他们离弃了耶和华[a]——他们祖先的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文的上帝之名“יהוה”。
    reason: divine_name
  - marker: b
    text: 希伯来文直译“勇力之子”，即英勇善战的人。
    reason: lexical_alternative
  - marker: c
    text: 或译：“当他们离弃耶和华——他们祖先的上帝时。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: 杀了
  rationale: הרג直接表示杀死；“杀了”是清楚、自然的现代汉语，也不弱化事件的惨烈程度。
- source_word: בִּיהוּדָה
  choice: 在犹大
  rationale: 介词ב在此表示地点；“犹大”符合当时王国或地域的历史语境。
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: 十二万人
  rationale: 直接、自然地表达原文数目一百二十千。
- source_word: בְּיוֹם אֶחָד
  choice: 一天之内
  rationale: 原文直译为“一天中”；“一天之内”既自然，也体现大规模杀戮发生在单日之内。
- source_word: הַכֹּל
  choice: 全都是
  rationale: 概括前述十二万死者，并自然引出他们的身份。
- source_word: בְּנֵי חָיִל
  choice: 英勇的战士
  rationale: 该短语字面为“勇力之子”，在此指勇武、能征战的男子；译作“英勇的战士”符合战争语境，脚注保留字面形式。
- source_word: בְּעָזְבָם
  choice: 因为他们离弃了
  rationale: 介词ב加不定词结构可表达时间或原因；上下文将军事灾难解释为背约的后果，正文采用因果义，同时在脚注保留时间义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以称号“主”替代。
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: 他们祖先的上帝
  rationale: 准确表达构词关系和群体的历史传承；“祖先”在现代汉语中自然，并涵盖原文所指的先辈。
theological_decisions:
- issue: בְּעָזְבָם与杀戮之间的关系
  choice: 因果义：“因为他们离弃了”
  alternative: 时间或伴随义：“当他们离弃……时”
  rationale: 《历代志》的上下文常把军事失败呈现为离弃耶和华的后果，因果义在此很合适；但希伯来结构本身也容许时间或伴随理解，因此以脚注保留该歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“十二万人”“一天之内”简洁自然；“英勇的战士”明确战争语境。神名采用中文通行专名“耶和华”。所有脚注标记均置于正文相应位置。
