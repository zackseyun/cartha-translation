base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: zh_hans
  text: 他又在欣嫩子谷烧香，并把自己的儿子们在火中焚烧[a]，效法那些被雅威从以色列人面前赶走的列国所行的可憎之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己的儿子们经火。”这里的希伯来文更直接地说，他把自己的儿子们在火中焚烧。
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  choice: 烧香
  rationale: 该动词的使役式指使祭物冒烟，在敬拜语境中常指烧香；此处译为“烧香”简洁自然，也不额外指定祭物种类。
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: 在欣嫩子谷
  rationale: 这是地名；采用现代中文圣经读者较熟悉的音译“欣嫩子谷”，不使用带有后期观念的“地狱”等译法。
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: 并把自己的儿子们在火中焚烧
  rationale: 原文使用使役式 בער，并有“在火中”，直接语义比“使……经火”更强；“儿子们”保留 בָּנָיו 的阳性复数含义。
- source_word: כְּתוֹעֲבוֹת
  choice: 效法……所行的可憎之事
  rationale: 兼顾比较介词 כ 与 תועבות 的强烈道德评价；补出“所行”使现代汉语顺畅，但不改变其所指的行为性质。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 此处指先前居住在当地、被赶走的各民族；“列国”自然且不带“外邦人”可能引发的额外神学色彩。
- source_word: הֹרִישׁ
  choice: 赶走
  rationale: ירש 的使役式在这里表示使原居民失去土地并离开；“赶走”清楚保留驱逐之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译上帝的专名，而不以“主”这一称号替代。
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: 从以色列人面前
  rationale: 保留 מִפְּנֵי 的空间性驱逐表达；“以色列人”是“以色列之子”在现代汉语中的自然群体称呼。
theological_decisions:
- issue: 是否弱化献子经火的明确程度
  choice: 正文译作“把自己的儿子们在火中焚烧”
  alternative: 使自己的儿子们经火
  rationale: 此处原文使用 בער，而不是其他经文常见的“使……从火中经过”公式。正文保留较强烈的直陈含义，同时在脚注列出传统上可能的理解，以保存释义空间。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句序略作调整，将“列国所行的可憎之事”组成自然的汉语关系结构；保留原文对行为的严厉措辞以及复数“儿子们”。
