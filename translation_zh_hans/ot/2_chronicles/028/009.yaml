base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: zh_hans
  text: 那里有一位耶和华的先知，名叫俄德；他出去到那支来到撒马利亚的军队面前，对他们说：“看哪，耶和华你们祖先的神向犹大发怒，把他们交在你们手中；你们却在暴怒中杀了他们，甚至你们的怒气上达于天。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָבִיא לַיהוָה
  choice: 耶和华的先知
  rationale: 自然表达归属和奉差关系；神名按现代中文圣经通行形式译作“耶和华”。
- source_word: לִפְנֵי הַצָּבָא
  choice: 迎接……军队
  rationale: 直译为“到军队面前”，语境中指先知出去与归来的军队相遇并当面讲话，译作“迎接”自然且未增加立场色彩。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中引人注意并带警告意味的语气。
- source_word: בַחֲמַת יְהוָה
  choice: 耶和华……因……发怒
  rationale: 将希伯来语介词结构自然转化为原因表达，说明犹大被交出的背景。
- source_word: נְתָנָם בְּיֶדְכֶם
  choice: 把他们交在你们手中
  rationale: 保留希伯来语“交在手中”的惯用意象，也清楚表达神使其落入敌方控制。
- source_word: בְזַעַף
  choice: 狂怒地
  rationale: 该词表示强烈、暴烈的怒气；副词化处理，使其直接修饰杀戮行为。
- source_word: עַד לַשָּׁמַיִם הִגִּיעַ
  choice: 以致怒气上达于天
  rationale: 源文动词为第三人称单数，最自然的隐含主语是前述“怒气”；保留夸张意象及其控诉力度。
theological_decisions:
- issue: 神使犹大败亡与以色列军队杀戮之罪的张力
  choice: 用“才……；可是……”同时表达神因怒气把犹大交出，以及得胜者仍须为狂暴杀戮负责
  alternative: 用单纯并列“并且你们杀了他们”，弱化转折
  rationale: 上下文逻辑明确形成道德反转：胜利出于耶和华对犹大的审判，却不构成以色列人残暴行为的正当理由。
- issue: “上达于天”的主语
  choice: 补明为“怒气”
  alternative: 译作“杀戮之声上达于天”或不明示主语
  rationale: 希伯来语单数动词紧承单数名词זַעַף（怒气、暴怒），以“怒气”为主语最贴近语法；不引入源文没有的“声音”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留先知宣告的圣经语体；其余句法避免过度古雅。专名按现代中文圣经常用译名处理：Oded译“俄德”，Samaria译“撒马利亚”，Judah译“犹大”。
