revisions:
- from: 那里有一位耶和华的先知，名叫俄德。他出来迎接那支返回撒马利亚的军队，对他们说：“看哪，耶和华你们祖先的神因向犹大发怒，才把他们交在你们手中；可是你们竟狂怒地杀戮他们，以致怒气上达于天。”
  to: 那里有一位耶和华的先知，名叫俄德；他出去到那支来到撒马利亚的军队面前，对他们说：“看哪，耶和华你们祖先的神向犹大发怒，把他们交在你们手中；你们却在暴怒中杀了他们，甚至你们的怒气上达于天。”
  rationale: 修正军队行程方向这一明确的源文偏差，并以中性措辞表达先知出去面对军队的行动。保留原文的因果关系、神名与专名、对军队暴怒杀人的谴责，以及“怒气上达于天”的修辞意象；未增添任何教义性解释。
