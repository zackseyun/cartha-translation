  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female slaves for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: zh_hans
  text: 现在，你们竟说要制伏犹大和耶路撒冷的人[a]，把他们收作自己的奴仆和婢女[b]。难道你们自己在雅威你们的神面前不也有罪过吗？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大和耶路撒冷的人”直译为“犹大和耶路撒冷的众子”；这是指当地民众的集合说法。
    reason: lexical_alternative
  - marker: b
    text: 也可较直译为“制伏他们，作你们的奴仆和婢女”。
    reason: lexical_alternative
  - marker: c
    text: 本句希伯来文十分紧缩，较直译可作：“岂不是只有（或正是）你们中间有归于雅威你们神的罪责吗？”其中“只／正是”如何与全句衔接，存在解释空间；正文按上下文译为对他们自身罪责的反问。
    reason: source_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为承接上文并转入当下责问的话语标记；现代汉语以“现在”自然表达其时态和推进作用。
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  choice: 犹大和耶路撒冷的人
  rationale: 字面为“犹大和耶路撒冷的众子”，此处泛指两地的居民；译作“人”避免造成仅指男性后裔的误解。
- source_word: אַתֶּם אֹמְרִים
  choice: 你们竟说要
  rationale: 代词加分词表达他们当前声称或打算做的事；“竟”配合责问语境传达先知的斥责语气，但不把“说”直接改释为“决定”。
- source_word: לִכְבֹּשׁ
  choice: 制伏
  rationale: כּבש 的基本义是使之屈服、置于控制之下；后接奴役身份，故保留“制伏”，而不直接并入“奴役”。
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: 收作自己的奴仆和婢女
  rationale: 语境是战后强制奴役，并明确区分男性与女性；“奴仆和婢女”在庄重现代汉语中清楚表达两类奴隶身份。
- source_word: לָכֶם
  choice: 自己的
  rationale: 表达利益和占有关系，即把被制伏者据为己有。
- source_word: הֲלֹא רַק אַתֶּם עִמָּכֶם אֲשָׁמוֹת
  choice: 难道你们自己……不也有罪过吗
  rationale: 原文是紧缩的反问，强调责备别人者自身同样负有罪责；以反问保留其修辞力量，并用“也”呈现上下文中的对照。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: 在雅威你们的神面前
  rationale: 介词在此表示人在神面前所负的罪责；“雅威”音译神名 יהוה，保留其专名性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”作为现代汉语音译，保留其盟约专名性质，而不以称号替代。
- issue: עֲבָדִים וְשְׁפָחוֹת 的身份含义
  choice: 奴仆和婢女
  alternative: 男奴和女奴；仆人和使女
  rationale: 战俘被强行制伏并据为己有，奴隶身份十分明确；“奴仆和婢女”既保留性别配对，也符合经文的庄重语体。
- issue: 末句紧缩结构所表达的罪责
  choice: 你们自己在雅威你们的神面前不也有罪过吗
  alternative: 岂不只有你们有得罪雅威你们神的罪过吗
  rationale: רַק 在这里的确切衔接较为紧缩；结合上下文，核心是指出以色列人自己也有罪。正文保留反问和“也”的对照，脚注说明字面结构，避免把“只有”强行解释为排他判断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“竟说要”保留先知责备的力度；“制伏”与“收作”分别呈现强制征服和奴役结果。末句维持反问，不将希伯来文紧缩结构中的歧义过度消解。
