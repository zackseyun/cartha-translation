  text: וּ/בְ/עֵת֙ הָצֵ֣ר ל֔/וֹ וַ/יּ֖וֹסֶף לִ/מְע֣וֹל בַּ/יהוָ֑ה ה֖וּא הַ/מֶּ֥לֶךְ אָחָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: zh_hans
  text: 他遭受困苦的时候，竟越发背叛耶和华——就是亚哈斯王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעֵת
  choice: ……的时候
  rationale: 介词短语交代时间背景；汉语用“……的时候”自然地保留这一时间结构。
- source_word: הָצֵר לוֹ
  choice: 他遭受困苦
  rationale: 该表达表示他处于受压、受困的境地。“遭受困苦”既体现临到他的压力，也符合现代汉语。
- source_word: וַיּוֹסֶף
  choice: 越发
  rationale: יסף接不定式表示继续或进一步做某事；结合上下文，“越发”简洁表达他非但没有回转，反而进一步不忠。
- source_word: לִמְעוֹל
  choice: 背叛
  rationale: מעל指违背信义，在本书中带有对上帝不忠的宗教和盟约含义；“背叛”比“犯罪”更能体现关系性的失信。
- source_word: בַּיהוָה
  choice: 耶和华
  rationale: 介词在מעל的搭配中标明背叛所针对的对象；יהוה按其专名译作“耶和华”。
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: ——就是亚哈斯王
  rationale: 独立代词הוּא带强调作用，随后以同位语点明此人；破折号和“就是”保留原文带有震惊、谴责意味的强调。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉、且明确作为专名的“耶和华”；“雅威”是较接近学术拟音的可行译法，但不在正文中替换传统通行形式。
- issue: מעל的关系性与宗教含义
  choice: 背叛耶和华
  alternative: 对耶和华不忠／得罪耶和华
  rationale: “背叛”保留违背信义和盟约关系的力度，又不额外限定为某一种礼仪罪；“不忠”较弱，“得罪”则范围过宽。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“竟越发”传达逆境本应促使回转、亚哈斯却进一步背叛的反常与强调；用破折号重现末尾对“亚哈斯王”的突出指认。
