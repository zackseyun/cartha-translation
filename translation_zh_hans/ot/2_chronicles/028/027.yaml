base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: zh_hans
  text: 亚哈斯与列祖同眠。他们把他葬在城里，就是耶路撒冷，因为没有把他送入以色列诸王的陵墓[a]。他儿子希西家接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“以色列诸王”。亚哈斯是犹大王，因此有人认为这里指大卫王朝诸王的陵墓；也有人认为按上下文可能会预期为“犹大诸王”。
    reason: 说明原文“以色列诸王”的措辞，并保留因亚哈斯为犹大王而产生的解释空间或上下文预期，不在正文中改写原文。
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与列祖同眠
  rationale: 这是君王去世记述中的固定委婉语；“与列祖同眠”既保留希伯来语意象，也能让现代读者从上下文理解为去世。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 他们把他葬在
  rationale: 保留希伯来语第三人称复数主动式，而不改成被动表达。
- source_word: בָעִיר בִּירוּשָׁלִַם
  choice: 在城里，就是耶路撒冷
  rationale: 原文先说“在城里”，再说“在耶路撒冷”；译文保留两部分及其强调效果，同时用“就是”使中文自然清楚。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出亚哈斯葬在城内而未入王陵的原因。
- source_word: לֹא הֱבִיאֻהוּ
  choice: 没有把他送入
  rationale: הביא的使役形基本义为“带入、送入”；此译保留具体的移动意象，不直接释为“没有安葬”。
- source_word: לְקִבְרֵי
  choice: 陵墓
  rationale: 在王室安葬语境中，“陵墓”比一般的“坟墓”更准确地表达王族墓葬。
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: 以色列诸王
  rationale: 严格保留马所拉文本的“以色列”，不因亚哈斯是犹大王而擅自改为“犹大”。
- source_word: וַיִּמְלֹךְ יְחִזְקִיָּהוּ בְנוֹ תַּחְתָּיו
  choice: 他儿子希西家接替他作王
  rationale: 自然表达王位继承公式，同时保留“在他的位置上”所含的接替之意。
theological_decisions:
- issue: 是否因亚哈斯是犹大王而把“以色列诸王”规范化为“犹大诸王”
  choice: 正文保留“以色列诸王”
  alternative: 犹大诸王；或解释为大卫王朝诸王
  rationale: 马所拉文本明确写“以色列”。历代志也可能用“以色列”广指圣约群体或大卫王朝的传承，因此译文不作校改，并以脚注说明上下文上的理解空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“同眠”保留传统死亡委婉语，但避免过度古奥；“接替他作王”比直译“在他的位置上作王”更符合现代汉语。脚注标记置于其实际说明的“以色列诸王”之后。
