base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: zh_hans
  text: 现在，你们要听我；把你们从弟兄[a]中掳来的人送回去，因为耶和华的烈怒临到你们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“以色列同胞”。希伯来文使用亲属称谓，指同属一个圣约民族的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 引出直接讲话中的紧迫转折；现代汉语用“现在”自然清楚。
- source_word: שְׁמָעוּנִי
  choice: 你们要听我的
  rationale: 该祈使式要求听众留心听从；“听我的”既保留听觉意象，也传达劝诫力度。
- source_word: וְהָשִׁיבוּ
  choice: 送回去
  rationale: שׁוב 的使役式表示使人返回；就被掳者而言，“送回去”比单说“归还”更自然。
- source_word: הַשִּׁבְיָה אֲשֶׁר שְׁבִיתֶם
  choice: 你们……掳来的人
  rationale: 该名词在此集合性地指战争中被俘的人；合并关系从句可避免中文中“被掳的人，就是你们所掳的”之类的重复。
- source_word: מֵאֲחֵיכֶם
  choice: 从弟兄中
  rationale: 保留 אָח 的亲属称谓和同一圣约民族的关系语言；脚注说明此处所指范围。
- source_word: חֲרוֹן אַף
  choice: 烈怒
  rationale: 该固定表达描写怒气炽烈；“烈怒”在现代庄重汉语中简洁地保留其强度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中广为人知的专名形式呈现四字神名，而不以称号代替。
- source_word: עֲלֵיכֶם
  choice: 临到你们了
  rationale: על 与怒气连用，表示怒气已指向并压在他们身上；“临到”保留其迫近、落在其上的意象。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用读者较熟悉的音译“耶和华”，不以“主”这一称号替代；“雅威”是另一种较贴近学界重构读音的音译。
- issue: “弟兄”的群体含义
  choice: 正文保留“弟兄”，脚注说明指同胞以色列人
  alternative: 正文直译为“以色列同胞”
  rationale: 保留原文刻意使用的亲属语言及其圣约群体张力，同时借脚注避免读者误解为仅指亲生兄弟。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“掳来的人”明确战争俘虏的语境；“送回去”传达使役式的动作。“烈怒临到”保留原文的强度与空间意象。
