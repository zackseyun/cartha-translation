  text: וַ/יִּזְבַּ֗ח לֵֽ/אלֹהֵ֣י דַרְמֶשֶׂק֮ הַ/מַּכִּ֣ים בּ/וֹ֒ וַ/יֹּ֗אמֶר כִּ֠י אֱלֹהֵ֤י מַלְכֵֽי אֲרָם֙ הֵ֚ם מַעְזְרִ֣ים אוֹתָ֔/ם לָ/הֶ֥ם אֲזַבֵּ֖חַ וְ/יַעְזְר֑וּ/נִי וְ/הֵ֛ם הָֽיוּ ל֥/וֹ לְ/הַכְשִׁיל֖/וֹ וּ/לְ/כָל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: zh_hans
  text: 他向大马士革那些击打他的[a]众神献祭，说：“亚兰诸王的众神帮助他们，所以我要向这些神献祭，好让他们帮助我。”可是，这些神反倒使他和全以色列败亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些正在击败他的”。希伯来文分词既可表示持续进行的行动，也可描述具有这种特征的行动者。
    reason: lexical_alternative
  - marker: b
    text: 直译：“成了使他跌倒、也使全以色列跌倒的。”这里的“跌倒”可指败落或毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: 献祭
  rationale: זבח指献上祭牲或祭物；“献祭”简洁自然，并保留宗教礼仪含义。
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  choice: 向大马士革众神
  rationale: אֱלֹהֵי在此为复数附属形式，偶像崇拜语境中译作“众神”；“大马士革”采用现代通行地名。
- source_word: הַמַּכִּים בּוֹ
  choice: 那些击打他的
  rationale: 带冠词的分词作定语，描述这些神是击打他者；“击打”保留原词形象，并不替亚哈斯认可其真实神力。脚注说明分词也可表达持续的“正在击败”。
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: 亚兰诸王的众神
  rationale: 同时保留“神”和“王”的复数形式，不将מַלְכֵי擅自改成单数。
- source_word: מַעְזְרִים אוֹתָם
  choice: 帮助他们
  rationale: 分词可表达持续或一贯的行动；汉语一般现在式自然呈现亚哈斯的推理。
- source_word: לָהֶם אֲזַבֵּחַ וְיַעְזְרוּנִי
  choice: 我要向这些神献祭，好让他们帮助我
  rationale: 未完成式表达意愿；后一动词在语境中自然表示亚哈斯献祭的目的，“好让”清楚传达这一关系。
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ וּלְכָל יִשְׂרָאֵל
  choice: 可是，这些神反倒使他和全以色列败亡
  rationale: הכשיל的使役形本义为“使跌倒”，也可指使人败落、毁灭；“败亡”符合历史审判语境。“可是……反倒”呈现上下文中的强烈反转，而不改变基本命题。
theological_decisions:
- issue: “击打他的”是否承认大马士革众神具有真实神力
  choice: 按叙事原话保留亚哈斯对战败原因的异教解释，不在正文中加入否定性说明
  alternative: 明说“他以为是这些神击败了他”，或把行动完全归给亚兰军队
  rationale: 本节是在转述亚哈斯的错误推理；结尾的反转已经表达叙述者的批判。增加“他以为”虽能避免误读，却会把原文含蓄的讽刺明确化。
- issue: הכשיל的比喻与结局力度
  choice: 正文译作“使……败亡”，脚注保留“使……跌倒”的直译
  alternative: 正文直译为“使他和全以色列跌倒”
  rationale: “败亡”能让现代读者明白此处不是单指身体绊倒，同时脚注保留希伯来文的形象和可能的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众神”“诸王”明确保留原文复数；“好让”自然表达目的；末句用“可是……反倒”凸显原文语境中的讽刺性转折。
