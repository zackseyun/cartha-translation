base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: zh_hans
  text: 于是，以法莲人的首领[a]中有几个人起来反对从军中回来的人：约哈难的儿子亚撒利雅、米实利末的儿子比利家、沙龙的儿子希西家，以及哈得莱的儿子亚玛撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以法莲人的首领”直译为“以法莲子孙的首领”。
    reason: 说明希伯来文族群称谓的字面形式，同时正文采用自然的现代汉语表达。
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 起来
  rationale: קום的Qal叙事形式表示采取明确行动；“起来”保留动作感，也与后面的对抗语境自然衔接。
- source_word: אֲנָשִׁים מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: 以法莲人的首领中有几个人
  rationale: 将字面“以法莲子孙的首领中一些人”译成自然现代汉语，同时保留这些人来自以法莲领导层这一信息。
- source_word: עַל
  choice: 拦住
  rationale: 此处与קום连用，表达迎面反对或阻止；结合上下文，“拦住”比生硬的“起来反对”更自然，并体现实际阻止归军的行动。
- source_word: הַבָּאִים מִן הַצָּבָא
  choice: 从军中回来的人
  rationale: בוא的分词表示正在归来的人；צָבָא可指军队或军事行动。上下文是军队战后返回，故以“从军中回来”清楚表达，但不额外加入战役细节。
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: 亚撒利雅……比利家……希西家……亚玛撒
  rationale: 采用现代中文圣经人名的通行音译，保持人物辨识度。
- source_word: בֶן
  choice: ……的儿子
  rationale: 准确表达希伯来文父系称谓，并符合现代汉语列举人物身份的习惯。
theological_decisions: []
