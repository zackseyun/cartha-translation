base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/026.yaml
  text: The rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: zh_hans
  text: 他其余的事迹和一切所行的，自始至终，都记在《犹大和以色列诸王记》上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: 他其余的事迹
  rationale: 在王朝纪事的总结套语中，דְּבָרִים 指君王的事迹或政务，而非单指言语；“其余的事迹”准确且符合现代汉语史书语体。句首 וְ 不必机械译为“并且”，其承接作用由上下文自然体现。
- source_word: וְכָל דְּרָכָיו
  choice: 和一切所行的
  rationale: דֶּרֶךְ 本义为“道路”，用于人时可指其行为、行事方式。“一切所行的”传达其行为历程，且比“一切道路”更自然。
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: 自始至终
  rationale: 这一对词构成按时间涵盖全部的表达；“自始至终”自然地传达从早期到后期的整体范围。
- source_word: הִנָּם כְּתוּבִים
  choice: 都记在
  rationale: הִנָּם 带有指示和强调作用；现代汉语以“都”自然体现其总结性强调。כְּתוּבִים 字面为“写着”，在文献引用套语中译作“记在”更符合汉语习惯。
- source_word: עַל סֵפֶר
  choice: 记在……记上
  rationale: עַל 字面为“在……上”，与 סֵפֶר 连用表示载于某文献；汉语采用“记在《……》上”的惯用结构。
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: 《犹大和以色列诸王记》
  rationale: 该短语在此指《历代志》所引用的一部史料，故用书名号标示；“诸王记”清楚表达复数 מַלְכֵי，并保留犹大、以色列的并列次序。
theological_decisions: []
