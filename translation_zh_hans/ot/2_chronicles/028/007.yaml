base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: zh_hans
  text: 以法莲的勇士细基利[a]杀了王的儿子玛西雅、王宫总管押斯利甘[b]，以及地位仅次于王的以利加拿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “勇士”或译“勇猛之人”或“英雄”。
    reason: lexical_alternative
  - marker: b
    text: “王宫总管”，希伯来文直译“那家的主管”；在这里，“家”很可能指王宫或王室。
    reason: lexical_alternative
  - marker: c
    text: 或译“王的副手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: 杀了
  rationale: הרג直接表示杀死；“杀了”符合现代汉语叙事表达。
- source_word: זִכְרִי
  choice: 细基利
  rationale: 按中文圣经人名的通行形式音译。
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: 以法莲的勇士
  rationale: גִּבּוֹר可指勇士、勇猛之人或英雄；此处战争语境中“勇士”自然，并保留其属于以法莲的含义。
- source_word: מַעֲשֵׂיָהוּ בֶּן הַמֶּלֶךְ
  choice: 王的儿子玛西雅
  rationale: 按自然汉语调整姓名与身份说明的次序；בֶּן הַמֶּלֶךְ直译为“王的儿子”。
- source_word: עַזְרִיקָם נְגִיד הַבָּיִת
  choice: 王宫总管押斯利甘
  rationale: נְגִיד表示主管或领袖；在王室语境中，הַבָּיִת很可能指王宫或王室。“王宫总管”清楚表达其宫廷职务，同时以脚注保留字面歧义。
- source_word: אֶלְקָנָה מִשְׁנֵה הַמֶּלֶךְ
  choice: 地位仅次于王的以利加拿
  rationale: מִשְׁנֵה表示位居第二者；该译法保留等级关系，不将其限定为某个后世官衔。
