base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/016.yaml
  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: zh_hans
  text: 那时，亚哈斯王派人去见亚述诸王，请他们帮助他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“亚述诸王”；有些译本为配合通常理解的历史情境，译作“亚述王”。
    reason: 说明原文复数与部分译本采用的单数之间的差异。
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 这是自然、简洁的现代汉语叙事时间表达，准确保留原文的时间背景。
- source_word: שָׁלַח
  choice: 派人去见
  rationale: 原文直译为“派遣”，宾语省略；按语境是派人向统治者求助。汉语若只说“派往”不够完整，因此以“派人去见”自然表达，同时不具体断定所派的是使者。
- source_word: הַמֶּלֶךְ אָחָז
  choice: 亚哈斯王
  rationale: 符合现代汉语对君王名号的自然表达，并保留其身份与名字。
- source_word: עַל
  choice: 去见
  rationale: 此处与“派遣”连用，表示行动指向所求助的权势者，并非“攻击”。“去见”在汉语中自然呈现这一方向关系。
- source_word: מַלְכֵי אַשּׁוּר
  choice: 亚述诸王
  rationale: 马所拉文本明确使用复数“王们”。“诸王”既忠实保留复数，也采用庄重而易懂的现代书面语。
- source_word: לַעְזֹר לוֹ
  choice: 请他们帮助他
  rationale: 不定式结构表达亚哈斯派人的目的。“请他们帮助他”在汉语中清楚自然，也保留求助对象实施帮助的语义。
theological_decisions:
- issue: 是否为配合通常理解的历史情境，将“亚述诸王”改成单数“亚述王”
  choice: 正文保留马所拉文本的复数“亚述诸王”
  alternative: 亚述王
  rationale: 这虽非教义性问题，却涉及重要的文本透明度。希伯来原文为复数，不应仅因历史推断而在正文中改成单数；脚注说明其他译法，以保留文本张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“亚述诸王”略带正式色彩，但能准确保留原文复数；“派人去见……请……”使省略宾语的希伯来语表达在汉语中完整通顺。
