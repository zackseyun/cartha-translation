  yaml_path: translation/ot/2_chronicles/028/014.yaml
  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: zh_hans
  text: 于是，武装的人把俘虏和掠物留在众首领和全体会众面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: 留在
  rationale: עזב在此不是遗弃俘虏，而是指武装人员放弃占有，将俘虏和战利品留交众首领及会众处置；“留在……面前”自然且保留原文动作。
- source_word: הֶחָלוּץ
  choice: 武装的人
  rationale: 该词在此作集合性名词，指装备好、参与作战的人；“武装的人”贴近原文，也符合上下文的军事场景。
- source_word: הַשִּׁבְיָה
  choice: 俘虏
  rationale: 该名词虽可抽象地表示“被掳”，此处与掠物并列，具体指战争中被掳的人。
- source_word: הַבִּזָּה
  choice: 掠物
  rationale: 指战争中掳掠所得的财物；“掠物”简洁、庄重，并清楚体现其来源。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 既可表达空间上的置于面前，也保留当众交出的公开意味。
- source_word: הַשָּׂרִים
  choice: 众首领
  rationale: שׂרים在本段指具有权威、负责监督此事的人；“首领”比“官员”更贴合历代志的古代社会语境，又不限定为军事统帅或王子。
- source_word: כָל הַקָּהָל
  choice: 全体会众
  rationale: קהל指聚集起来的共同体；“会众”在圣经叙事中自然，且“全体”准确表达כָל。
