base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/002.yaml
  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: zh_hans
  text: 他行在以色列诸王的道路上，又为诸巴力[b]制造铸像[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铸造的像”。原文指用熔化的材料浇铸而成的像。
    reason: lexical_alternative
  - marker: b
    text: 原文“巴力”为复数，可能指与巴力崇拜有关的多种地方形态或代表形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: 行……所行的道
  rationale: 保留希伯来语以“行走/道路”表达生活方式和行为模式的比喻，同时用现代汉语可理解的结构呈现。
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: 以色列诸王
  rationale: 准确表达复数属格结构，并保留其历史指向。
- source_word: וְגַם
  choice: 又
  rationale: 简洁自然地表达这是在前项罪行之外再加的一项行为。
- source_word: מַסֵּכוֹת
  choice: 铸造神像
  rationale: 该词特指以熔融材料浇铸而成的像；“铸造神像”既保留制作方式，也符合现代汉语表达。
- source_word: עָשָׂה
  choice: 铸造
  rationale: 结合宾语的词义，将普通动词“做”自然整合为“铸造”，不丢失原文信息。
- source_word: לַבְּעָלִים
  choice: 为诸巴力
  rationale: 保留希伯来语“巴力”的复数形式；“诸”使中文读者明确这里不是单数。
theological_decisions:
- issue: בְּעָלִים 的复数表达
  choice: 诸巴力
  alternative: 巴力；巴力偶像
  rationale: 原文明确使用复数，可能涉及巴力崇拜的多种地方形态或代表形式；译为单数会抹去这一文本细节。
- issue: 是否保留“行在……道路上”的道德行为比喻
  choice: 行以色列诸王所行的道
  alternative: 效法以色列诸王的行为
  rationale: 原文的“行—道”比喻在中文圣经语体中清楚可懂，也能保留源语意象，故不改写为纯解释性表达。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“诸王”“诸巴力”简洁保留复数；“行……所行的道”保留希伯来语行为隐喻，整体适合公开诵读。
