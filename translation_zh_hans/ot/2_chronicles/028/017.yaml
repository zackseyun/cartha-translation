  text: The Edomites had also come and attacked Judah and carried away captives[a].
translation:
  language: zh_hans
  text: 此外，以东人也前来攻打犹大，掳走了俘虏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“掳走了被掳的人。”希伯来文在此使用同源的动词和名词，近似直译为“掳掠了俘虏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: 此外
  rationale: 在上下文中引出临到亚哈斯和犹大的另一场敌对行动；“此外”自然表达补充关系，不强行规定为重复发生。
- source_word: אֲדוֹמִים
  choice: 以东人
  rationale: 复数族群称谓指以东民族，而非仅指以东地域。
- source_word: בָּאוּ
  choice: 前来
  rationale: 表示以东人来到犹大采取军事行动；现代汉语叙事无需用时态形式额外标示其完成性。
- source_word: וַיַּכּוּ
  choice: 攻打
  rationale: נכה本义为“击打”，在军事语境中表示攻击；“攻打”清楚自然，同时不额外断言彻底击败。
- source_word: בִיהוּדָה
  choice: 犹大
  rationale: 介词ב与军事动词连用时可表达行动所针对或发生的对象；“攻打犹大”符合现代汉语习惯，并保留地名与国民共同体之间的原文张力。
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: 掳走了一批人
  rationale: 动词שבה与同根名词שבי构成“掳掠俘虏”的同源表达；译文用自然汉语表达有人被掳走，并以脚注保留较贴近原文的说法。
