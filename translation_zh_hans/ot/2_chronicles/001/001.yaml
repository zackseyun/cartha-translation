  source_fidelity: 首句的“在他的国位上强盛起来”大体反映וַיִּתְחַזֵּק与עַל מַלְכוּתוֹ，但“国位”在现代汉语中主要指王位，较窄，未能充分涵盖מַלְכוּת的国度／王权范围。末句“使他极其尊大”保留了使役与加强意义，却偏文言，和目标的现代标准汉语不完全相称。
  naturalness: “大卫的儿子所罗门”与“雅威他的上帝与他同在”均通顺庄重；但“尊大”在当代一般叙事汉语中罕用。改为“使他极其伟大”更自然，且不丢失“使……为大”的使役意义。
  terminology: “雅威”准确呈现יהוה，脚注说明适切。“上帝”“与他同在”也恰当。以“王国”替换“国位”，可较自然地表达该处王国／统治领域，同时不把原文争议性较大的介词关系过度理论化。
