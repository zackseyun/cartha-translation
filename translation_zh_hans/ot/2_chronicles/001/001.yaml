- from: 大卫的儿子所罗门在他的国位上强盛起来[a]；雅威[b]他的上帝与他同在，使他极其尊大。
  to: 大卫的儿子所罗门在自己的王国中日益强盛起来[a]；雅威[b]——他的上帝——与他同在，使他极其伟大。
  rationale: 修订仅处理现代汉语表达与语义范围：以“王国”避免将מַלְכוּת限定为单指王位；以“日益强盛起来”自然呈现Hitpael可有的自我强化／渐趋强盛意味，而不把它定为被动或直接归因于上帝。末句改为“使他极其伟大”，忠实反映Piel使役和לְמָעְלָה的强化。破折号使“雅威他的上帝”这一同位所属结构在汉语中清晰自然。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:45Z'
review_pass:
