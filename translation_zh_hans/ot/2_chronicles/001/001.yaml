  text: וַ/יִּתְחַזֵּ֛ק שְׁלֹמֹ֥ה בֶן דָּוִ֖יד עַל מַלְכוּת֑/וֹ וַ/יהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וַֽ/יְגַדְּלֵ֖/הוּ לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: zh_hans
  text: 大卫的儿子所罗门在自己的王国中日益强盛起来[a]；雅威[b]——他的上帝——与他同在，使他极其伟大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“巩固了自己的王权”或“在自己的王国中强盛起来”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: 强盛起来
  rationale: חזק的Hitpael形式在这里可表达主体自身变得强盛或使自己强盛。“强盛起来”保留其反身／不及物的开放性，也避免过早解释为政治上的“巩固”。
- source_word: עַל מַלְכוּתוֹ
  choice: 在他的国位上
  rationale: עַל与מַלְכוּת的组合涉及所罗门相对于王权或国度的地位。“在他的国位上”既符合现代汉语，又保留“国位／王权”与“国度”之间的语义幅度。
- source_word: בֶן דָּוִיד
  choice: 大卫的儿子
  rationale: 按原文直译，保留历代志作者所强调的父子和王朝关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名יהוה，而不以称号代替专名。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 直接保留第三人称所属关系，呈现所罗门与上帝之间的个人及圣约关系。
- source_word: עִמּוֹ
  choice: 与他同在
  rationale: 这是表达上帝临在和眷顾的自然、庄重汉语说法。
- source_word: וַיְגַדְּלֵהוּ
  choice: 使他……尊大
  rationale: גדל的Piel形式带宾语后缀，表示使某人变得伟大或受尊崇；“使他尊大”保留使役意义。
- source_word: לְמָעְלָה
  choice: 极其
  rationale: 此处在“使他尊大”之后作加强语，表示达到很高的程度；“极其”自然地传达这种强调作用。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留专名性质，并以脚注说明其希伯来文形式。
- issue: 所罗门兴盛中的行动主体
  choice: 同时保留所罗门“强盛起来”和上帝“使他极其尊大”
  alternative: 把首句译成纯被动的“得以强盛”；或解释为“上帝巩固了他的王位”
  rationale: 原文先用可具反身／不及物意义的动词描述所罗门，又明确说雅威与他同在并使他尊大。译文不把两方面的行动合并为单一主体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“国位”比“王位”更能兼顾מַלְכוּת所含的王权、统治和国度含义；全句保留希伯来文连续叙事的推进感，并用分号使汉语层次清楚。
