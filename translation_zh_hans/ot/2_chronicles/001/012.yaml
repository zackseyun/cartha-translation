  text: הַֽ/חָכְמָ֥ה וְ/הַ/מַּדָּ֖ע נָת֣וּן לָ֑/ךְ וְ/עֹ֨שֶׁר וּ/נְכָסִ֤ים וְ/כָבוֹד֙ אֶתֶּן לָ֔/ךְ אֲשֶׁ֣ר לֹא הָ֣יָה כֵ֗ן לַ/מְּלָכִים֙ אֲשֶׁ֣ר לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹ֥א יִֽהְיֶה כֵּֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: zh_hans
  text: 智慧和知识已经赐给你；我也必赐给你财富、财产和尊荣。在你以前的列王中，从未有过这样的；在你以后，也不会再有这样的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“在你以前的列王中，未曾有过这样的；在你以后，也不会有这样的。”后半句省略了“列王”，而“这样的”概括回指前文所说的恩赐。
    reason: 说明希伯来文概括性比较及后半句的省略，避免将解释性补足误作原文的替代译法。
lexical_decisions:
- source_word: הַחָכְמָה
  choice: 智慧
  rationale: חָכְמָה在此指治理所需的智慧；“智慧”是现代汉语中准确而自然的对应词。
- source_word: הַמַּדָּע
  choice: 知识
  rationale: מַדָּע可指知识或明达；与“智慧”并列时译作“知识”，既保留词义区别，也不过度解释。
- source_word: נָתוּן לָךְ
  choice: 已经赐给你
  rationale: 被动分词表达已经授予而现今拥有的状态；“已经赐给你”自然传达这一完成并持续有效的含义。
- source_word: עֹשֶׁר
  choice: 财富
  rationale: עֹשֶׁר指丰富的财物或财富；“财富”清楚、庄重，并可与后面的具体产业区分。
- source_word: נְכָסִים
  choice: 产业
  rationale: נְכָסִים指财产、所有物；“产业”适合古代君王语境，又比“资产”更自然庄重。
- source_word: כָבוֹד
  choice: 尊荣
  rationale: כָבוֹד在君王蒙赐的语境中指尊贵和荣誉；“尊荣”比“荣耀”更能避免误解为专属神的荣光。
- source_word: אֶתֶּן לָךְ
  choice: 我也必赐给你
  rationale: 未完成式在应许语境中表达将来的赐予；“必”传达应许的确定性，“也”承接已经赐下的智慧和知识。
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים אֲשֶׁר לְפָנֶיךָ
  choice: 在你以前的列王中，从未有过这样的
  rationale: 尽量保留希伯来文“未曾如此”的宽泛比较，不把比较对象过度限定为君王本人或某一项礼物。
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: 在你以后，也不会再有这样的
  rationale: 保留原文省略“列王”及以“这样”回指前文的表达，使比较的范围由上下文决定。
theological_decisions:
- issue: 所罗门独特性的比较范围
  choice: 把“这样的”放在所列恩赐之后，使比较自然指向智慧、知识、财富、产业和尊荣这一整体，同时不明说所罗门在所有方面都胜过历代君王。
  alternative: 译成“从来没有一个王像你，以后也不会有”，将比较直接扩大到所罗门本人。
  rationale: 原文的比较紧随所列恩赐，且使用宽泛的כֵן（“这样”）；译文保留这一范围和张力，避免作超出经文的绝对化断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“财富、产业和尊荣”保持三个并列名词的区别；末句保留“这样的”所具有的概括性，脚注提供更明确、较意译的理解。
