base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: zh_hans
  text: 那天夜里，上帝向所罗门显现，对他说：“你求吧：我将赐给你什么？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“你求：我将赐给你什么？”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: 那天夜里
  rationale: 希伯来语直指前述时间，意为“在那一夜”；“那天夜里”是自然、明确的现代汉语表达。
- source_word: נִרְאָה
  choice: 显现
  rationale: ראה 的尼法勒式在神显现的语境中表示“出现、显现”；“显现”既贴近原文，也不额外加入“启示自己”等解释。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词虽具复数形式，却与单数动词搭配，在本叙事中明确指以色列的独一上帝。
- source_word: לִשְׁלֹמֹה
  choice: 向所罗门
  rationale: 介词 ל 在此标明显现所面向的人；现代汉语用“向……显现”自然准确。
- source_word: וַיֹּאמֶר לוֹ
  choice: 对他说
  rationale: 直接对应“并对他说”，按汉语叙事习惯用“对他说”承接前句。
- source_word: שְׁאַל
  choice: 你求吧
  rationale: 命令式表示直接邀请提出所求；“求”比一般的“问”更符合请求赐予之物的语境，“吧”使语气自然，又不削弱命令式。
- source_word: מָה אֶתֶּן לָךְ
  choice: 我该赐给你什么
  rationale: 原文直译为“我要赐给你什么”，置于“求吧”之后可理解为询问所求内容。“该”在现代汉语中自然表达此处未完成式在疑问句中的意向或商询语气，同时脚注保留更形式对应的译法。
theological_decisions:
- issue: 神显现语境中 אֱלֹהִים 的译法
  choice: 上帝
  alternative: 诸神
  rationale: 单数动词的一致关系及上下文均明确表明所指为一位上帝；译作“上帝”忠实反映语法和叙事，并不附加其他教义解释。
- issue: מָה אֶתֶּן לָךְ 的语气
  choice: 我该赐给你什么
  alternative: 我要赐给你什么
  rationale: 希伯来语未完成式可在此表达将来意向，而整句也可视为承接命令式的询问。正文采用自然的汉语商询表达，脚注保留更直译的将来式措辞，避免把语气解释得过死。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“那天夜里”“向……显现”“对他说”清楚简洁；引语保留上帝直接邀请所罗门祈求的开放性。
