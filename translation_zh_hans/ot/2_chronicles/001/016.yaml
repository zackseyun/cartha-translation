  register: 采用庄重、清楚的现代标准汉语。正文保留较可能的地名解释，同时以脚注呈现希伯来词的真实歧义。为避免两个脚注标记挤在同一处，脚注[a]标示争议地名，脚注[b]置于句末，说明整句的另一种译法。
