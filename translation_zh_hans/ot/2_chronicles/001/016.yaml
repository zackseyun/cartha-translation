base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: zh_hans
  text: 所罗门的马匹来自埃及和古厄[a]；王的商人按价从古厄购得马匹。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处译作“古厄”的希伯来词含义不确定；也可理解为普通名词，译作“集散地”或“货栈”。
    reason: alternative_reading
  - marker: b
    text: 若将该希伯来词理解为普通名词，本句也可译作：“王的商人在集散地按价购得马匹。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא
  choice: 来自
  rationale: 该词可指来源或出处；在马匹贸易的语境中，用“来自”自然表达其来源，同时不具体化为“进口”。
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: 所罗门的马匹
  rationale: 介词ל־在此表示归属或关联，“所罗门的马匹”是简洁自然的现代汉语。
- source_word: מִמִּצְרָיִם
  choice: 埃及
  rationale: 采用该地名通行的中文译名。
- source_word: וּמִקְוֵא / מִקְוֵא
  choice: 古厄／从古厄
  rationale: 此词含义有争议；结合平行经文和地理贸易背景，正文按地名理解，并在脚注保留“集散地”等普通名词解释。
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: 王的商人
  rationale: 分词名词化，指从事贸易的人；“商人”符合商业语境。
- source_word: יִקְחוּ
  choice: 购得
  rationale: 该动词基本义为“拿、取得”；与“按价”连用时明显涉及交易，“购得”在汉语中自然且准确。
- source_word: בִּמְחִיר
  choice: 按价
  rationale: 表达以某一价格取得货物的交易含义，简练而自然。
