base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: zh_hans
  text: 所罗门向全以色列人讲话，就是向千夫长、百夫长[a]、审判官，以及全以色列各首领——各父家的首领[b]——讲话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千夫长、百夫长”指统领千人或百人单位的军事或行政长官。
    reason: cultural_note
  - marker: b
    text: “父家”直译为“父亲的家”，指以共同父系祖先为纽带的宗族或祖家单位。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 讲话
  rationale: 该动词基本义为“说”，但这里以多个群体为对象，描述的是公开发言；译作“讲话”既自然，又不增加“召集”或“命令”等原文没有的含义。
- source_word: לְכָל יִשְׂרָאֵל
  choice: 向以色列全体
  rationale: 保留“全以色列”这一整体性的民族称谓；后面的官长名单说明这里所指的是由各级领袖代表的全国群体。
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: 千夫长、百夫长
  rationale: שָׂרֵי 在此指军事或行政长官；“千夫长、百夫长”是简明而有历史感的汉语表达，并保留原文按“千”和“百”划分单位的说法。
- source_word: וְלַשֹּׁפְטִים
  choice: 审判官
  rationale: 该词来自“审判、治理”的词根，在这里是明确的职衔；“审判官”比现代司法语境较强的“法官”更适合古代行政背景。
- source_word: וּלְכֹל נָשִׂיא לְכָל יִשְׂרָאֵל
  choice: 以及以色列所有的领袖
  rationale: נָשִׂיא 可指首领、族长或领袖；此处用范围较广的“领袖”，避免“王子”所暗示的王室身份，并自然表达其遍及全以色列的范围。
- source_word: רָאשֵׁי הָאָבוֹת
  choice: 各父系家族的族长
  rationale: 该短语指以共同父系祖先为纽带的宗族或祖家之首。“父系家族”保留原文男性亲属结构的历史特征，“族长”则以现代读者易懂的方式表达其领导身份。
theological_decisions:
- issue: רָאשֵׁי הָאָבוֹת 与前文“领袖”的句法关系
  choice: 将“各父系家族的族长”作为“以色列所有的领袖”的同位说明
  alternative: 将其视为名单中另一个独立群体
  rationale: 希伯来语没有在该短语前另加连接词或介词，最自然的理解是它补充说明前面的“领袖”。破折号保留这种关系，同时不把解释扩展为原文未明说的具体制度。
- issue: הָאָבוֹת 的亲属与社会含义
  choice: 父系家族
  alternative: 祖家；家族
  rationale: 译文保留古代以色列社会结构中的父系表述，不将其泛化为不带性别标记的“家庭”；脚注则说明这是一种宗族性社会单位，并非只指核心家庭。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“向……讲话，就是向……”保留原文先说“以色列全体”、后列举各级领袖的结构；破折号标示末语与“领袖”的同位关系。职衔使用传统且仍易理解的“千夫长、百夫长”，并以脚注交代其古代军事—行政背景。
