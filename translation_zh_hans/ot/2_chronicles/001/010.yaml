  text: עַתָּ֗ה חָכְמָ֤ה וּ/מַדָּע֙ תֶּן לִ֔/י וְ/אֵֽצְאָ֛ה לִ/פְנֵ֥י הָֽ/עָם הַ/זֶּ֖ה וְ/אָב֑וֹאָה כִּֽי מִ֣י יִשְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/זֶּ֖ה הַ/גָּדֽוֹל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: zh_hans
  text: 现在，求你赐我智慧和知识，使我可以在这百姓面前出入[a]；因为谁能审判你这众多的百姓[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在这百姓面前出入”是指在百姓面前履行公开的领导职责。
    reason: cultural_note
  - marker: b
    text: “众多”或译“伟大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 作时间兼话语承接词，引出所罗门当下的请求；“现在”简洁自然。
- source_word: חָכְמָה וּמַדָּע
  choice: 智慧和知识
  rationale: 分别保留两个名词的通常含义，不把“知识”并入“智慧”或改释为单一的治理才能。
- source_word: תֶּן לִי
  choice: 求你赐我
  rationale: 原文是“给我”；中文向上帝提出请求时加“求你”自然体现语用语气，“赐”符合受予关系而不过度增添含义。
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: 使我可以……出入
  rationale: 两个意愿式在请求后表达目的或结果；“出入”保留希伯来语成对动词及其履行公共领导职责的意象。
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: 在这百姓面前
  rationale: לִפְנֵי 直指“在……面前”；译文保留空间意象，同时上下文显示这是在百姓中履行领袖职责。
- source_word: כִּי
  choice: 因为
  rationale: 引出所罗门请求智慧和知识的理由。
- source_word: מִי יִשְׁפֹּט
  choice: 谁能审判
  rationale: שׁפט 的直接含义是施行审判、公断；君王语境也涉及治理，但保留“审判”可避免把司法含义消解为泛泛的领导。反问句自然包含能力之意，故译作“谁能……呢”。
- source_word: עַמְּךָ
  choice: 你……的百姓
  rationale: 明确保留第二人称单数后缀，表明百姓属于受祈求的上帝。
- source_word: הַגָּדוֹל
  choice: 众多
  rationale: גָּדוֹל 可指大、众多或重要；这里反问谁有能力审判，人数规模很可能是重点。正文采用自然的“众多”，脚注保留“伟大”这一较宽的词义可能。
theological_decisions:
- issue: 所罗门请求中的领袖职分惯用语
  choice: 保留“在这百姓面前出入”的原文意象，并以脚注说明其功能
  alternative: 带领这百姓／治理这百姓
  rationale: 原文没有直接使用“带领”或“治理”的动词；保留惯用表达可呈现君王在百姓面前履职的具体意象，同时脚注帮助现代读者理解。
- issue: יִשְׁפֹּט 在君王语境中的范围
  choice: 正文译作“审判”
  alternative: 治理
  rationale: 该词在王权语境可涵盖治理和主持公义，但“审判”是其直接词义，也与所求智慧的司法用途相连；不宜在正文中把它泛化。
- issue: הַגָּדוֹל 对百姓的描述
  choice: 正文译作“众多”，脚注列“伟大”
  alternative: 伟大
  rationale: 该形容词兼有规模大与地位重要的语义空间。语境偏向百姓数量带来的治理重任，但原文并未完全排除“伟大”，故不把另一层意义静默删除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“求你赐我”符合祷告语境；“出入”略带经文式凝练感，但仍是现代读者可识别的表达，并由脚注解释。标点用分号连接请求与理由，使反问的逻辑清楚。
