  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: zh_hans
  text: 现在，雅威上帝啊，愿你向我父亲大卫所说的话得以坚立[a]；因为你已立我作王，治理多如地上尘土的人民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿你向我父亲大卫所作的应许得以坚立。”
    reason: 词义备选：דָּבָר在此语境可指“应许”，יֵאָמֵן也可译作“得以确立”。
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 作为时间兼话语标记，引出所罗门接下来的祈求；简洁自然。
- source_word: יְהוָה אֱלֹהִים
  choice: 雅威上帝
  rationale: 按原文直接呈现圣名יהוה，并将אֱלֹהִים作为称号译为“上帝”，保留“圣名＋称号”的组合。
- source_word: יֵאָמֵן
  choice: 愿……得以确立
  rationale: אמן的尼法勒未完成式在此表达祈愿，含有使话语被证实、坚立或成就的意思；“得以确立”既保留被动意味，也适合应许语境。
- source_word: דְּבָרְךָ
  choice: 你……所说的话
  rationale: 基本义为“你的话”；用现代汉语关系结构与עִם דָּוִיד אָבִי连结，不在正文中直接窄化为“应许”。
- source_word: עִם דָּוִיד אָבִי
  choice: 对我父亲大卫所说
  rationale: עִם字面可作“与”，但与“话”搭配时，此处所指是上帝向大卫说的话；译为“对……所说”符合现代汉语习惯。
- source_word: כִּי
  choice: 因为
  rationale: 引出祈求的依据，清楚保留原文的因果关系。
- source_word: הִמְלַכְתַּנִי
  choice: 你已立我作王
  rationale: מלך的使役形表达“使我成为王”；“立我作王”自然、庄重，并保留使役意义。
- source_word: עַל עַם רַב
  choice: 治理……的人民
  rationale: עַל表示作王所辖的对象，汉语以“治理”自然传达；רַב的众多含义由后面的尘土比喻明确表达。
- source_word: כַּעֲפַר הָאָרֶץ
  choice: 多如地上尘土
  rationale: 保留希伯来语表示人数不可胜数的传统比喻；“地上尘土”在现代汉语中自然清楚。
theological_decisions:
- issue: 如何翻译神名יהוה
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为盟约之神专名的性质，不以称号取代。
- issue: 是否将דְּבָרְךָ明确译成“应许”
  choice: 正文保留“所说的话”
  alternative: 你的应许
  rationale: 上下文确有应许之意，但希伯来文用的是较宽泛的“话”；正文保留原词的广度，脚注提示其在这里可指应许。
- issue: יֵאָמֵן表达的是证实、坚立还是应验
  choice: 得以确立
  alternative: 得到证实／得以应验
  rationale: 该动词容纳“被坚立、被证实为可靠”的张力；“确立”避免只强调认知上的证实或只强调未来事件的应验。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“雅威上帝啊”保留呼语；“立我作王，治理……”符合当代标准汉语，并避免过度古雅。
