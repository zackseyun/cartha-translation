base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: zh_hans
  text: 所罗门就上到那里，在雅威[a]面前、会幕那里的铜祭坛上，献了一千份燔祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是神名“雅威”（יְהוָה，YHWH）；传统上也常译作“耶和华”或以“主”代称。
    reason: 说明神名的原文形式及常见译法。
lexical_decisions:
- source_word: וַיַּעַל ... שָׁם
  choice: 上到那里
  rationale: עלה表示向上行，שָׁם承接上文所说的基遍；“上到那里”既保留方向含义，也符合现代汉语表达。
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: 铜祭坛
  rationale: נְחֹשֶׁת可指铜或铜合金；在会幕器具的语境中，“铜祭坛”是简明而通行的译法。
- source_word: לִפְנֵי יְהוָה
  choice: 雅威面前
  rationale: לִפְנֵי表示处于某位面前或临在之中；此处保留其空间及礼仪意味。
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: 那座属于会幕的
  rationale: 介词לְ在这里可表达祭坛与会幕的归属或关联；译为“属于会幕”自然地指明这座祭坛的身份，同时不补入原文没有明说的具体方位。
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: 在坛上献……燔祭
  rationale: 第二个עלה用于献祭语境，表示使祭物在坛上升起，汉语以“献……燔祭”准确传达这一惯用含义；עָלָיו译作“在坛上”。
- source_word: עֹלוֹת אָלֶף
  choice: 一千份燔祭
  rationale: עֹלוֹת是עֹלָה的复数，指全烧献上的祭；加入量词“份”使“一千”明确修饰所献的燔祭，并符合现代汉语。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名יְהוָה。正文采用较贴近其常见学术重构读音的“雅威”，以神名而非称号来呈现；脚注说明原文形式。
- issue: אֲשֶׁר לְאֹהֶל מוֹעֵד所表达的关系
  choice: 属于会幕
  alternative: 在会幕那里；会幕前的
  rationale: לְ可表示归属或关联，原文没有使用明确表示“在……前”的לִפְנֵי。译文不把祭坛的具体位置说得超过原文，而保留它与会幕相属的关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上到那里”保留原文的行进方向；后半句用“献”表达希伯来语献祭惯用语，避免机械重复“上”。“一千份燔祭”既清楚表达数量，也保留燔祭这一礼仪专名。
