base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: zh_hans
  text: 于是，所罗门从基遍的丘坛[a]——即从会幕前[b]——回到耶路撒冷[c]，统治以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丘坛”指设在高处或称为高处的敬拜场所；本节所说的是会幕所在的基遍丘坛。
    reason: cultural_note
  - marker: b
    text: 希伯来文直译为“从会幕面前”，是表示离开圣所范围的空间说法。
    reason: literal_rendering
  - marker: c
    text: “回到”也可译作“来到”或“去到”；希伯来文动词可随叙述视角表示不同方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 回到
  rationale: בוא可按叙述视角表示“来、去、进入”。结合上文所罗门先前往基遍、此时返回耶路撒冷的情境，译作“回到”最符合现代汉语表达；其方向上的词义弹性保留在脚注中。
- source_word: לַבָּמָה אֲשֶׁר בְּגִבְעוֹן
  choice: 从基遍的丘坛
  rationale: במה指用于敬拜的高处或丘坛。“丘坛”是简洁而通行的对应词；本节并未谴责该地点，因此不加入贬义。马所拉文本的语序和介词搭配十分紧缩，依据上下文将其理解为所罗门离开基遍的丘坛。
- source_word: מִלִּפְנֵי
  choice: 从……前
  rationale: 直译为“从……面前”，是表示离开某处或某对象所在范围的空间表达。正文采用自然的“从会幕前”，脚注说明其字面形式。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: “会幕”是现代中文圣经语域中对“会见之帐”的通行称呼，简明地保留其作为敬拜场所的含义。
- source_word: וַיִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: 作王统治以色列
  rationale: מלך在此指作王、掌权；所罗门此前已经登基，因此不译成“成为王”，而用“作王统治”表达持续治理。
theological_decisions:
- issue: “耶路撒冷”与“基遍的丘坛”在紧缩希伯来语序中的句法关系
  choice: 所罗门从基遍的丘坛回到耶路撒冷
  alternative: 所罗门来到基遍的丘坛，又到耶路撒冷
  rationale: 马所拉文本的词序若机械照搬，会造成目的地与出发地关系不清。上下文明确记载所罗门此前前往基遍，此处则离开会幕所在的敬拜地点返回耶路撒冷。正文按这一语境关系重组语序，同时以脚注承认בוא本身可从不同方向视角翻译。
- issue: 基遍丘坛的宗教性质
  choice: 使用中性的“丘坛”
  alternative: 带贬义地译为“异教祭坛”或解释性地译为“丘坛圣所”
  rationale: 本节把基遍丘坛与会幕联系起来，并未在此作负面评价；译文只呈现原词的敬拜地点含义，不引入后期经文中的负面联想。
- issue: “从会幕前”与“基遍的丘坛”的关系
  choice: 用破折号和“即”表明同一离开地点的补充说明
  alternative: 把两者译成两个彼此独立的出发地点
  rationale: 语境表明会幕位于基遍的丘坛，此短语进一步说明所罗门从敬拜场所离开。这样的处理不把会幕与丘坛混为同一物件，而是说明二者在空间上的关联。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接前文；以破折号处理补充说明，避免希伯来语紧缩语序在中文中产生误解。“丘坛”“会幕”“作王”等沿用清楚而通行的中文圣经用语。
