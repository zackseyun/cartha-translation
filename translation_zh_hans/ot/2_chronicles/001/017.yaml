base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: zh_hans
  text: 他们从埃及进口战车：一辆价六百舍客勒银子[a]；马匹：一匹价一百五十舍客勒银子。他们又经手把这些战车和马匹转卖给赫人诸王和亚兰诸王[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“他们把战车从埃及带上来、带出来”。这里是贸易语境，因此译作“进口”。
    reason: lexical_alternative
  - marker: b
    text: 直译作“借他们的手”；这是表示经由或代理的惯用语。
    reason: lexical_alternative
  - marker: c
    text: “亚兰”传统上也译作“叙利亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: 他们从埃及进口
  rationale: 两个动词直译有“带上来、从……带出”之意；在价格和转售的贸易语境中，“进口”自然地表达货物从埃及运入的商业含义。
- source_word: מֶרְכָּבָה
  choice: 战车，每辆
  rationale: 原文用单数说明商品单位和单价；中文以“战车，每辆”清楚表达按辆计价。
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: 价值六百舍客勒银子
  rationale: 原文仅说“六百银子”，重量单位“舍客勒”由语境隐含；补出可使现代读者明确理解价格。
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: 马匹每匹一百五十舍客勒银子
  rationale: סוּס通常指“马”；数额直译为“五十和一百”。沿用前句隐含的银子重量单位，并补出“每匹”以呈现单价结构。
- source_word: לְכָל מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם
  choice: 给赫人的众王和亚兰诸王
  rationale: 按原文保留“赫人”和“亚兰”这两个历史名称，不以较晚的“叙利亚”替换亚兰。
- source_word: בְּיָדָם יוֹצִיאוּ
  choice: 他们也经手把这些卖给
  rationale: בְּיָדָם是表示中介或代理的惯用语，意为“经他们的手”；结合贸易语境，יוֹצִיאוּ指把商品转售或供应出去。“经手把这些卖给”既保留代理含义，也符合现代中文表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。用“每辆／每匹”明确原文的单件价格结构；用“经手”保留בְּיָדָם所表达的中介作用，同时避免生硬直译为“借他们的手”。
