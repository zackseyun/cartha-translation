base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: zh_hans
  text: 王使耶路撒冷的金银多如石头[a]，又使香柏木多如低地[b]的桑叶无花果树。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“像石头一样”；下半句则可译作“像低地的桑叶无花果树一样多”。希伯来文借比较来形容数量极其丰富。
    reason: lexical_alternative
  - marker: b
    text: “低地”指示非拉，即犹大山地与沿海平原之间的丘陵地带。这里的“桑叶无花果树”指一种无花果树（Ficus sycomorus），不是普通桑树。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: 使……多如
  rationale: נתן本义常为“给、放置”，但这里与宾语和比较短语连用，表达使这些物资极其丰富；译为“使……多如”自然传达其使役和结果含义。
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: 金银
  rationale: 指作为贵重物资的银和金。汉语并列为“金银”简洁自然，不必机械体现希伯来语冠词。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 按其地点含义直译。
- source_word: כָּאֲבָנִים
  choice: 多如石头
  rationale: 字面为“像石头”；语境以比较表达数量极多，译作“多如石头”既保留比喻，也清楚表达其含义。
- source_word: הָאֲרָזִים
  choice: 香柏木
  rationale: אֲרָזִים是香柏的复数；在财富和建筑物资的语境中，主要指香柏木供应。译作“香柏木”比“香柏树”更切合此处，同时避免误解为王在低地栽种树木。
- source_word: כַּשִּׁקְמִים
  choice: 如……桑树
  rationale: שִׁקְמִים指当地常见的桑属无花果树。正文采用圣经汉语中简明通行的“桑树”，重点保留其常见且数量众多的比较作用。
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: 低地的
  rationale: שְׁפֵלָה在此特指犹大山地与沿海平原之间的丘陵低地区域；正文用易懂的“低地”，专名背景置于脚注。
- source_word: לָרֹב
  choice: 多如
  rationale: 该短语表示“数量众多、极其丰富”，在汉语中融入比较结构“多如……”，避免生硬地另译为“极多”。
