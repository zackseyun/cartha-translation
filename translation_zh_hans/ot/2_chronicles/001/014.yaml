base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: zh_hans
  text: 所罗门聚集了战车和骑兵[a]。他有一千四百辆战车和一万二千名骑兵；他把它们安置在战车城[b]，又安置在耶路撒冷、与王同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“骑手”。希伯来词指骑乘的人；在这里是军事语境，故译作“骑兵”。
    reason: lexical_alternative
  - marker: b
    text: 指专门存放战车或驻防战车部队的城邑。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 聚集了
  rationale: אָסַף在此表示汇集、聚拢军事实力；“聚集”既贴近原文，也不额外说明取得这些车马的方式。
- source_word: רֶכֶב
  choice: 战车
  rationale: 该词可集合性地指战车部队，但下文有明确数量，因此译作可计数的“战车”最清楚。
- source_word: פָּרָשִׁים
  choice: 骑兵
  rationale: 该词指骑乘者，而非单指马匹；上下文是王的军备，所以“骑兵”自然准确，同时以脚注保留“骑手”这一较字面的表达。
- source_word: וַיְהִי לוֹ
  choice: 他有
  rationale: 希伯来语字面为“有归于他”，现代汉语用“他有”自然表达所有关系。
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 一千四百辆战车
  rationale: 完整保留确切数目，并使用“辆”作为战车的自然量词。
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 一万二千名骑兵
  rationale: 完整保留确切数目，并用“名”指称人员。
- source_word: וַיַּנִּיחֵם
  choice: 他把这些安置
  rationale: 使役形式在这里表示将所聚集的军事资源放在指定地点；“安置”既适用于战车，也适用于骑兵，避免只适用于人员的狭义措辞。
- source_word: בְּעָרֵי הָרֶכֶב
  choice: 在战车城
  rationale: 该结构指专门存放或驻防战车的城邑；“战车城”简洁保留原文名词结构，具体含义由脚注说明。
- source_word: וְעִם הַמֶּלֶךְ
  choice: 也安置在……王的身边
  rationale: 原文直译为“也与王同在”；“在王的身边”符合现代汉语，同时没有把原文未明说的“一部分”写入正文。
- source_word: בִּירוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代汉语通行的地名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。数目用汉字写出；对军事术语保持简洁。末句保留原文“与王同在”的表达范围，不擅自加入“一部分”，同时用“在王的身边”使汉语自然。
