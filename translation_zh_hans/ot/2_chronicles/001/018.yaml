  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה לִ/בְנ֥וֹת בַּ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: zh_hans
  text: 所罗门决定[a]为耶和华的名建造一座殿，又为自己的王国建造一座宫殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“说”；在这里后接“建造”，可表示“决定”“定意”或“吩咐”。
    reason: 说明 וַיֹּאמֶר 的基本词义，并交代正文按此处语境译为“决定”。
  - marker: b
    text: 原文两处都用同一个词，直译为“房屋”：一座为耶和华的名，一座为他的王国。
    reason: 说明正文“殿／宫殿”背后原文重复使用 בַּיִת。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该动词的基本义是“说”。在后接不定式“建造”时，语境中也可含有定意或吩咐之意；译作“说，要……”既符合现代汉语，也保留原文对具体言语行为的含混性。
- source_word: לִבְנוֹת
  choice: 要……建造
  rationale: בנה 的不定式直接表示“建造”；配合前面的“说”，用“说，要……建造”自然表达原文结构。
- source_word: בַּיִת
  choice: 殿；宫殿
  rationale: 原文两处都用 בַּיִת（房屋）。第一处由“为耶和华的名”限定，指圣殿；第二处由“为自己的王国”限定，指王宫。正文采用汉语中自然且清楚的“殿／宫殿”，并以脚注说明原文重复同一个词。
- source_word: לְשֵׁם יְהוָה
  choice: 为耶和华的名
  rationale: 保留圣殿语境中特有的“为……的名”表达，不将其意译成“为尊荣耶和华”，以免抹去其神学含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神名音译“耶和华”，明确呈现原文的专名，而不是用“主”这一称号替代。
- source_word: לְמַלְכוּתוֹ
  choice: 为自己的王国
  rationale: מַלְכוּת 可指王国、王权或统治；此处与王室建筑相连，“为自己的王国”保留其宽泛含义。“自己的”自然指向主语所罗门。
theological_decisions:
- issue: “耶和华的名”的圣殿表述
  choice: 为耶和华的名
  alternative: 为尊荣耶和华／归耶和华之名
  rationale: 直译这一惯用语，保留圣殿与神之名相联的观念，也避免暗示神本身被建筑物容纳。
- issue: 两处 בַּיִת 的译法
  choice: 殿……宫殿
  alternative: 房屋……房屋
  rationale: 原文刻意重复同一名词，但汉语若两处都译“房屋”会显得失当，且不能自然表明圣殿与王宫。正文按语境翻译，脚注保留原文的词语重复。
- issue: וַיֹּאמֶר 所表达的言语行为
  choice: 说，要……
  alternative: 定意要……／吩咐建造……
  rationale: 上下文可能侧重所罗门的决定或命令，但原文只明确使用普通动词“说”。正文不把潜在语用含义固定为“定意”或“吩咐”。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“说，要……”避免生硬的“说去建造”，同时不把原文明确化为“定意”或“吩咐”。“殿／宫殿”符合普通读者对圣殿和王宫的自然称呼；脚注补足原文重复 בַּיִת 的形式特征。
