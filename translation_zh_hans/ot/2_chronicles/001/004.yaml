  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: zh_hans
  text: 不过，大卫已经把上帝的约柜从基列·耶琳运到他为它预备的地方[a]，因为他曾在耶路撒冷为它支搭了一座帐篷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“到大卫为它所预备之处”；希伯来语表达较为紧缩，意思是大卫把约柜带到他为约柜预备好的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: 不过
  rationale: 承接上节并形成对比：铜坛在基遍，而上帝的约柜已被移到耶路撒冷。
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: 上帝的约柜
  rationale: 按原文结构直译；“约柜”是现代中文圣经语境中清楚、通行的称呼。
- source_word: הֶעֱלָה
  choice: 已经……运上来
  rationale: 使役形表达把约柜带上去；在本节中交代先前发生的背景行动，故用“已经”。“运上来”也保留耶路撒冷地势及叙事中的“上去”概念。
- source_word: מִקִּרְיַת יְעָרִים
  choice: 从基列·耶琳
  rationale: 采用现代中文中易辨读的地名音译，并以间隔号划分音节成分。
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: 安放在他为约柜预备的地方
  rationale: 希伯来语表达紧缩，字面近于“到大卫为它预备的”；补出“地方”与目的动作“安放”，使中文通顺，同时用脚注保留原文形式。
- source_word: כִּי
  choice: 因为
  rationale: 引出对所预备地点的解释：大卫曾在那里为约柜支搭帐篷。
- source_word: נָטָה לוֹ אֹהֶל
  choice: 为约柜支搭了一座帐篷
  rationale: נטה 与 אהל 连用表示支搭帐篷；“支搭”自然且保持庄重。重复“约柜”可避免中文代词指代含混。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按地点介词短语直接翻译，采用通行中文地名。
