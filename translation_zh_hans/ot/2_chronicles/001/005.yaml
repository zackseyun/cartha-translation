  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: zh_hans
  text: 乌利的儿子、户珥的孙子比撒列所造的铜祭坛，也放在耶和华的帐幕前；所罗门和会众就在那里寻求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的代词后缀所指不明确；可指耶和华，也可指铜祭坛。或译：“所罗门和会众就在那里寻求他／它。”
    reason: 保留 וַיִּדְרְשֵׁהוּ 中阳性单数后缀的所指歧义，避免正文在争议处作不必要的定论。
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: 铜祭坛，也
  rationale: מִזְבַּח意为“祭坛”，נְחֹשֶׁת在圣所器具语境中指铜；连接词按中文叙事习惯译作“也”，承接上文。
- source_word: אֲשֶׁר עָשָׂה בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: 户珥的孙子、乌利的儿子比撒列所造的
  rationale: 保留完整谱系关系，同时按自然现代汉语调整语序；人名采用通行中文圣经译名。
- source_word: שָׂם
  choice: 在那里
  rationale: 该词形式可作“放置”理解，但此处主语为祭坛且未说明放置者；译为“在那里”自然表达其所在状态，又不擅自补出施事者。
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: 在耶和华的帐幕前
  rationale: לִפְנֵי在此表示空间位置“在……前”；מִשְׁכָּן译作礼仪语境中通行而准确的“帐幕”；神名按源文音译为“耶和华”。
- source_word: וַיִּדְרְשֵׁהוּ
  choice: 就在那里寻求他
  rationale: דרשׁ以代词后缀为宾语时可指寻求或求问；结合紧邻的“耶和华”，正文将阳性单数后缀理解为指耶和华。“在那里”明示行为发生地点，是由上下文自然补出的连接语。
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: 所罗门和会众
  rationale: קָהָל指聚集起来的群体；“会众”简洁、庄重，也符合共同敬拜的语境。
theological_decisions:
- issue: וַיִּדְרְשֵׁהוּ中阳性单数后缀的所指
  choice: 正文理解为耶和华：“寻求他”
  alternative: 理解为铜祭坛：“寻找它”或“到它那里”；也可作不明说宾语的“在那里求问”
  rationale: דרשׁ常以神为宾语，意思是“寻求／求问神”，而前文刚提到“耶和华的帐幕”，因此此解较合乎惯用法；但语法上的阳性单数后缀也可能回指较近的“祭坛”，故以脚注保留真实歧义，不把争议隐去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。谱系用“孙子、儿子”清楚呈现；礼仪术语使用“铜祭坛、帐幕、会众”。正文不回避“寻求他”的神学含义，同时借脚注保留后缀可能指祭坛的语法歧义。
