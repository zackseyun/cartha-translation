  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: zh_hans
  text: 所罗门对神说：“你向我父亲大卫施了极大的慈爱[a]，又立我接替他作王。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “慈爱”也可译作“忠贞的爱”或“信实”。希伯来语חֶסֶד常指在关系中坚定不移的爱与忠诚，在这里也可能含有守约信实的意味。
    reason: 保留חֶסֶד兼具慈爱、忠诚和盟约信实的词义幅度，避免正文将其含义过度限定。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式承接上文并推进叙事；现代汉语通常无须机械译出连接词，直接用“说”自然且忠实。
- source_word: לֵאלֹהִים
  choice: 对神
  rationale: 此处是所罗门向独一的神说话；“对神说”是清楚自然的汉语表达。
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: 向……施了极大的慈爱
  rationale: “施慈爱”符合该希伯来语搭配，也保留חֶסֶד所含的仁爱、忠诚与关系性信实；“极大的”直接表达גָּדוֹל的强调。脚注保留其盟约性忠诚等可能内涵。
- source_word: דָּוִיד אָבִי
  choice: 我父亲大卫
  rationale: 采用现代汉语自然语序，准确表达大卫与所罗门的父子关系。
- source_word: וְהִמְלַכְתַּנִי
  choice: 又立我……作王
  rationale: 该使役形式表示神使所罗门为王；“立我作王”明确保留神的主动作为。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 此处指王位承继，即所罗门取代大卫的王位，而不暗示以强力夺位；“接替他”符合现代汉语用法。
theological_decisions:
- issue: 盟约语境中חֶסֶד的译法
  choice: 慈爱
  alternative: 盟约信实；忠贞的爱；恩慈
  rationale: “慈爱”在中文圣经语体中自然、庄重，并可同时容纳爱、恩慈和忠诚的含义。正文不把חֶסֶד仅限定为抽象的“盟约信实”，脚注则说明其在神与大卫的关系中可能含有忠贞和守约信实的分量，从而保留原词的丰富性与张力。
- issue: 王位承继与神的主动作为
  choice: 又立我接替他作王
  alternative: 又使我在他以后作王；又使我代替他掌权
  rationale: 此译明确表达神使所罗门作王，也准确传达他接续大卫王位的意思，不额外加入有关王权方式或政治过程的主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“施了极大的慈爱”保留适度的圣经语体；“立我接替他作王”简洁清楚，兼顾原文的使役意义与王位承继语境。
