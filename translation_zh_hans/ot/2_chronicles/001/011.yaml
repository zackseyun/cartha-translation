source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: zh_hans
  text: 上帝对所罗门说：“既然你心里所想的是这事，没有为自己求财富、财产或尊荣，也没有求恨你之人的性命[a]，也没有求长寿[b]，却为自己求智慧和知识，好判断我使你作王治理的子民，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你仇敌的性命”；直译是“恨你之人的性命”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“许多日子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 既然
  rationale: 引出上帝回应的原因；“既然”在现代汉语中自然地表达因果依据。
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: 你心里所想的是这事
  rationale: 保留“心”的希伯来语意象，同时以自然汉语表达内在意念或愿望，避免把具体内容过度解释为单纯的“欲望”。
- source_word: עֹשֶׁר נְכָסִים וְכָבוֹד
  choice: 财富、财产或尊荣
  rationale: 分别保留三个词的区别：财富指富足，财产指所拥有之物，尊荣指地位与受人敬重。否定语境中用“或”符合现代汉语列举习惯。
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: 恨你之人的性命
  rationale: 贴近原文单数集合式表达，并保留“恨你之人”，不直接改写为较概括的“仇敌”。
- source_word: יָמִים רַבִּים
  choice: 长寿
  rationale: 字面为“许多日子”，在此是希伯来语表示寿命长久的自然说法；正文采用清楚的现代汉语，脚注保留字面形式。
- source_word: חָכְמָה וּמַדָּע
  choice: 智慧和知识
  rationale: 分别对应两个希伯来语词，避免用“聪明”或“悟性”模糊二者的区别。
- source_word: לְךָ
  choice: 为自己
  rationale: 明确受益者是所罗门本人；语境表明这是为履行王职，并不暗示自私。
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: 好判断
  rationale: 表达所求智慧和知识的目的，并保留 שׁפט 的审判、判断含义，不泛化为单纯“治理”。
- source_word: אֲשֶׁר הִמְלַכְתִּיךָ עָלָיו
  choice: 我使你作王治理的
  rationale: 自然表达上帝立所罗门在百姓之上为王；“治理”补足汉语中作王所辖对象的关系。
theological_decisions:
- issue: 神圣说话者 אֱלֹהִים 的译法
  choice: 上帝
  alternative: 神
  rationale: 原文使用 אֱלֹהִים，而不是神名 יהוה；因此不译作“耶和华”。“上帝”是现代普通话中清楚、庄重且广为理解的称呼。
- issue: 王职中 תִּשְׁפּוֹט 的含义
  choice: 判断
  alternative: 治理
  rationale: 保留原词的司法判断意味，同时承认古代君王的判断属于其治理职责；不把两者完全等同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留本节未完的句法，因为经文在下一节继续上帝的话；正文末用逗号而非句号。所有脚注标记均置于相关词语之后。
