  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: zh_hans
  text: 所罗门和随同他的全体会众都前往基遍的丘坛，因为[a]神的会幕在那里；这会幕是耶和华的仆人摩西在旷野所造的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为”或译“原来”。
    reason: 保留כִּי在此处既可引出前往基遍的原因，也可作解释性连接的语义幅度。
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 前往
  rationale: 该动词推动叙事向前；“前往”自然表达去往基遍，不额外加入原文未明说的上行方向。
- source_word: הַקָּהָל
  choice: 全体会众
  rationale: קהל指聚集起来的群体；“会众”在敬拜与公共集会语境中自然，“全体”对应כָל。
- source_word: עִמּוֹ
  choice: 跟随他的……一同
  rationale: 表达与所罗门同行的伴随关系，同时符合现代汉语语序。
- source_word: לַבָּמָה
  choice: 丘坛
  rationale: במה指设于高处或称为“高处”的敬拜场所。“丘坛”简洁保留其地形与礼仪含义，且不在此处擅自赋予贬义。
- source_word: בְּגִבְעוֹן
  choice: 基遍
  rationale: 按地名音译；结合“丘坛”译作“基遍的丘坛”，自然表达其所在地。
- source_word: כִּי
  choice: 因为
  rationale: 最自然地表达前往该处的原因；原词也可作解释性连接，因此加注保留“原来”的可能。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语境中的清楚、凝练表达，意为神与人相会之帐幕。
- source_word: הָאֱלֹהִים
  choice: 神的
  rationale: 直接保留与“会幕”的所属关系。
- source_word: עָשָׂה
  choice: 造的
  rationale: 简明表达摩西先前制作会幕的行动；中文关系分句无需另加过去完成标记。
- source_word: עֶבֶד יְהוָה
  choice: 耶和华的仆人
  rationale: “仆人”适合此处作为摩西忠心服事神的尊称，不必突出“奴隶”义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 使用现代中文读者熟悉的神名音译，保留原文专名而不以称号替代。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”准确贴合以色列旷野时期的叙事背景。
theological_decisions:
- issue: 在建殿以前合法敬拜的语境中如何译במה
  choice: 丘坛
  alternative: 高处；高地祭坛
  rationale: 保留敬拜地点的具体称谓，却不因该词在其他经文中的负面用法而在本节加入谴责意味；本节说明神的会幕当时就在基遍。
- issue: 如何呈现神名יהוה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，正文采用现代中文圣经传统中广为人知的专名形式，不以“主”这一称号替代。
- issue: כִּי所引分句与前文的关系
  choice: 原因：“因为”
  alternative: 解释或补充：“原来”
  rationale: 上下文最自然地把会幕位于基遍作为所罗门前往的原因，但该连词也可引出解释性说明，故以脚注保留此张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。以“丘坛”保留古代敬拜地点的性质，以“会幕”使用普通读者熟悉的圣经用语；分号使末尾关系分句的指向清楚。
