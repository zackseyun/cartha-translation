  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: zh_hans
  text: 亚玛谢奋勇起来，率领他的百姓前往盐谷，击杀了西珥的子孙[a]一万人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“西珥人”或“西珥的后裔”。希伯来文直译为“西珥的子孙”，是表示族群和谱系的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: 奋勇起来
  rationale: 该词为חזק的Hitpael形式，含有使自己刚强、振作奋勇的意味；“奋勇起来”既保留主体主动振作的色彩，也符合出征语境中的现代汉语表达。
- source_word: וַיִּנְהַג אֶת עַמּוֹ
  choice: 率领他的百姓
  rationale: נהג可指带领、引导或驱赶；军事语境下译为“率领”自然明确，而“百姓”保留עַמּוֹ的宽泛含义，不擅自限定为军队。
- source_word: גֵּיא הַמֶּלַח
  choice: 盐谷
  rationale: 按地名构词直译，并采用简洁、通行的汉语专名形式。
- source_word: וַיַּךְ
  choice: 击杀
  rationale: נכה可表示击打、击败或杀死；此处紧接一万人的数目，且处于战争叙事中，“击杀”最符合上下文，但仍不添加作战方式等细节。
- source_word: בְּנֵי שֵׂעִיר
  choice: 西珥的子孙
  rationale: 直译希伯来语的族群—谱系表达“西珥之子”，既能传达其民族性含义，也保留原文的家族谱系色彩。
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: 一万人
  rationale: 准确表达数词短语；补出量词“人”符合现代汉语习惯及所数对象。
- source_word: וַאֲמַצְיָהוּ
  choice: 亚玛谢
  rationale: 叙事连接词由汉语句序自然承接，无须机械译出“于是”或“然后”；人名采用通行译名。
