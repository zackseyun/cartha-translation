  yaml_path: translation/ot/2_chronicles/025/028.yaml
  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: zh_hans
  text: 他们用马匹[a]运送他，把他葬在犹大城，与他列祖同葬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“在马匹之上”；“马”为复数。
    reason: 说明正文“用马匹”对应的较形式化原文表达，并保留复数信息而不推断具体运载方式。
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: 众人……把他运回去
  rationale: נשׂא在此指运送亚玛谢的遗体。中文用“运回去”自然地表达把遗体带回安葬之地；“众人”体现希伯来语复数主语，但不擅自指明身份。
- source_word: עַל הַסּוּסִים
  choice: 用马
  rationale: 原文直译为“在那些马之上”，且“马”为复数。正文采用自然中文“用马”，不进一步推定马车、车辆或担架；脚注保留其较形式对应的表达。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 将他葬
  rationale: 直接表达קבר“埋葬、安葬”及其第三人称阳性单数宾语。
- source_word: עִם אֲבֹתָיו
  choice: 在他列祖那里
  rationale: 保留希伯来文传统安葬用语的家族与王朝意味；“列祖”在中文圣经语体中庄重且易懂，比泛化为“祖先”更贴近原文。
- source_word: בְּעִיר יְהוּדָה
  choice: 在犹大城
  rationale: 严格依据马所拉文本“犹大城”，不按相似经文协调为“David城”，也不泛化为“在犹大”。
theological_decisions:
- issue: 安葬地点的文本措辞
  choice: 犹大城
  alternative: 大卫城；犹大境内
  rationale: WLC所据马所拉文本明确作“犹大城”。虽然这一说法不如“大卫城”常见，仍应保存其文本张力，不据平行措辞改写或解释性概括。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列祖”保留传统安葬公式；“犹大城”忠实呈现马所拉文本的特殊措辞。
