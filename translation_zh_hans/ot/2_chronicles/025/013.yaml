base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: zh_hans
  text: 可是，亚玛谢曾把那队士兵遣返回去，不让他们随自己出征；他们却袭击了从撒马利亚直到伯和仑的犹大城镇[a]，击杀了其中三千人[b]，又掠走许多财物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们袭击了犹大的城镇，从撒马利亚直到伯和仑。”原文这一表达标明袭击所及的范围。
    reason: lexical_alternative
  - marker: b
    text: 或译：“击倒了其中三千人。”原文动词本义较宽，在战争语境中通常含杀死之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: 那队士兵
  rationale: 该词组直译为“队伍之子”，是指这支军队或武装队伍的成员；“那队士兵”符合现代汉语习惯，也保留军事语境。
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ
  choice: 亚玛谢曾把……遣返回去
  rationale: 使役形态表达“使其返回”；“遣返回去”自然地传达亚玛谢命令这队人离开的意思。
- source_word: מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: 不让他们随自己出征
  rationale: 原文不定式结构表示阻止他们与亚玛谢一同参战；此译简洁而明确。
- source_word: וַיִּפְשְׁטוּ
  choice: 袭击
  rationale: 该动词在军事语境中常指突袭或侵袭；“袭击”既表达敌对行动，也不提前把含义缩限为掠夺。
- source_word: בְּעָרֵי יְהוּדָה
  choice: 犹大的城镇
  rationale: עָרִים 可指城市或设防城镇；“城镇”适合概括当时不同规模的聚居地。
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: 所到之处从撒马利亚直到伯和仑
  rationale: מִן…וְעַד… 标明行动范围。“所到之处”使这层关系在汉语中清楚，同时保留两个地名所界定的范围。
- source_word: וַיַּכּוּ מֵהֶם
  choice: 击杀了其中……人
  rationale: נכה 基本义较宽，可表示击打、击倒，在战争叙事中常含杀死之意；“击杀”符合这里的人数统计和军事语境，同时以脚注注明较贴字面的译法。
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: 三千
  rationale: 按原文直接译出数目。
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: 掠走许多财物
  rationale: 原文用同根动词和名词加强“掠夺”之意；汉语以“掠走许多财物”自然传达大量战利品被夺走的结果。
