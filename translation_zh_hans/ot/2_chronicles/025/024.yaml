base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: zh_hans
  text: 他带走了所有的金子和银子、上帝的殿中在俄别·以东那里的所有器皿[a]、王宫的财宝和人质[b]，然后返回撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“与俄别·以东同在”。这可能是指这些器皿由俄别·以东保管。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“担保之子”，很可能指被扣作保证的人，也就是人质。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הַזָּהָב וְהַכֶּסֶף
  choice: 所有的金银
  rationale: 保留כָּל“所有”的总体含义；现代汉语以“金银”自然并列两种贵金属。
- source_word: כָל הַכֵּלִים
  choice: 一切器皿
  rationale: כֵּלִים泛指器具或物件；在圣殿语境中，“器皿”既准确又符合庄重的现代汉语表达。
- source_word: בֵּית הָאֱלֹהִים
  choice: 上帝殿
  rationale: “殿”自然表达此处作为圣所的“上帝之家”，同时避免冗长。
- source_word: עִם עֹבֵד אֱדוֹם
  choice: 由俄别·以东看管
  rationale: עִם字面为“与……同在/在……那里”；上下文较可能表示器皿在俄别·以东的保管之下。正文采用自然明确的表达，并以脚注保留字面读法。
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: 王宫的财宝
  rationale: אֹצְרוֹת在掳掠贵重物品的语境中宜指财宝；בֵּית הַמֶּלֶךְ按所指自然译为“王宫”。
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: 人质
  rationale: 该难解短语字面为“担保之子”，最可能指被扣作保证的人，即人质；脚注保留其字面构造和不确定性。
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: 然后返回撒马利亚
  rationale: 连续叙事形式推进事件；依前文补出主语“他”，并将撒马利亚表达为返回的目的地。
