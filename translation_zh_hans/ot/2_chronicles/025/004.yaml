  text: וְ/אֶת בְּנֵי/הֶ֖ם לֹ֣א הֵמִ֑ית כִּ֣י כַ/כָּת֣וּב בַּ/תּוֹרָ֡ה בְּ/סֵ֣פֶר מֹשֶׁה֩ אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יָמ֨וּתוּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יָמ֣וּתוּ עַל אָב֔וֹת כִּ֛י אִ֥ישׁ בְּ/חֶטְא֖/וֹ יָמֽוּתוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: zh_hans
  text: 但他没有处死他们的儿子，因为摩西律法书上记载着雅威所吩咐的话：“父亲不可因儿子而被处死；儿子也不可因父亲而被处死；各人必因自己的罪而死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם לֹא הֵמִית
  choice: 但他没有处死他们的儿子
  rationale: 承接上一节处死谋杀者之事，וְ 在语篇中表示转折，译作“但”。הֵמִית 是 מות 的使役式，在司法语境中译作“处死”。בְּנֵיהֶם 特指“他们的儿子”，不泛化为“儿女”。
- source_word: כִּי כַכָּתוּב בַּתּוֹרָה בְּסֵפֶר מֹשֶׁה
  choice: 因为摩西书卷的律法上记着
  rationale: 保留 כִּי 的因果关系，并将 תּוֹרָה 与 סֵפֶר מֹשֶׁה 的嵌套关系用自然汉语表达；“律法”既准确又为普通读者熟悉。
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵאמֹר
  choice: 雅威的命令，说
  rationale: 关系从句说明所记内容是雅威所吩咐的；汉语用“记着雅威的命令，说”简洁衔接引文。לֵאמֹר 译作“说”，引出直接引语。
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים
  choice: 父亲不可因儿子被处死
  rationale: 在这条司法禁令中，מות 的未完成式表达禁止，按法律语境译为“不可……被处死”；עַל 表示因某人而承担刑责，译作“因”。
- source_word: וּבָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: 儿子也不可因父亲被处死
  rationale: 与前一分句保持对称，保留“父亲／儿子”的具体亲属称谓和司法责任含义。
- source_word: כִּי אִישׁ בְּחֶטְאוֹ יָמוּתוּ
  choice: 各人只可因自己的罪而死
  rationale: אִישׁ 在此具有逐一分配的意义，译作“各人”；后缀明确是“自己的罪”。末尾动词虽为复数形式，却与分配性单数主语搭配，汉语自然译为单数概括。“只”显明与代人受刑相对的限制语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”以音译保存盟约之名，不以称号“主”代替。
- issue: 父子之间刑责原则的范围
  choice: 按司法语境译作“被处死”，并保留各人因自己之罪而死的表述
  alternative: 按一般死亡意义译作“死”
  rationale: 上下文是亚玛谢是否处死弑君者的儿子，且所引申命记律例涉及司法刑罚；译作“被处死”能显明语境，同时末句保留较贴近原文的“而死”，不把经文扩展为对一切罪责或苦难的系统性论断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式尽量保持希伯来文法律引语的平行结构，同时避免生硬直译。本文无脚注，因此正文不设脚注标记。
