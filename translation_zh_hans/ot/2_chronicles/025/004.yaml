revisions:
- from: 但他没有处死他们的儿子，因为摩西书卷的律法上记着雅威的命令，说：“父亲不可因儿子被处死，儿子也不可因父亲被处死；各人只可因自己的罪而死。”
  to: 但他没有处死他们的儿子，因为摩西律法书上记载着雅威所吩咐的话：“父亲不可因儿子而被处死；儿子也不可因父亲而被处死；各人必因自己的罪而死。”
  rationale: 修订仅调整引言的中文句法，并删除原文未明示的“只可”。前两项禁令仍按上下文译为“被处死”，末句保留原文较宽的“死”，从而既呈现司法语境，也不越过原文措辞。无需脚注。
