    rationale: 原文指“律法中、摩西书上所记的”雅威命令。中文以“摩西律法书上记载着雅威所吩咐的话”可清楚表达书面记载及命令来源，不改变含义。
  - severity: low
    issue: “各人只可因自己的罪而死”中的“只可”增加了原文未明说的情态限制。
    rationale: 原文的重点是个人承担自己的罪责；“各人必因自己的罪而死”已充分表达该法律原则，并更贴近原文的陈述式法律措辞。
