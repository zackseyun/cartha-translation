id: 2CH.25.2
reference: 2 Chronicles 25:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה רַ֕ק לֹ֖א בְּ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: zh_hans
  text: 他做了耶和华眼中看为正的事，只是心不完全[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“却不是全心全意”，也可译“心不专一”。希伯来文直译为“不是以一颗完整的心”，指他的内在忠诚或委身并不完全。
    reason: 说明 לֵבָב שָׁלֵם 的字面意象和语义范围，避免把“完全”误解为毫无罪过的完美。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他做了
  rationale: 连词未完成式在叙事中表达过去发生的动作；现代汉语无须机械译出句首的“并且”。
- source_word: הַיָּשָׁר
  choice: 看为正的事
  rationale: 带定冠词的形容词在此作名词使用，指“正的事”；结合“在……眼中”译为“看为正的事”，自然且保留道德评价。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中
  rationale: 保留希伯来语“在……眼中”的评价性比喻，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文圣经传统中通行的专名“耶和华”音译四字神名，明确其为名字而非称号。
- source_word: רַק
  choice: 只是
  rationale: 此处引出对前面正面评价的限制；“只是”自然表达这种转折和保留。
- source_word: לֹא
  choice: 不
  rationale: 直接表达否定。
- source_word: בְּלֵבָב שָׁלֵם
  choice: 心不完全
  rationale: 尽量保留“完整、完全的心”这一原文意象，指内在的忠诚或委身并不完整，而不额外断定其动机虚伪。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文采用读者最熟悉且明确作为专名使用的“耶和华”；“雅威”是按学术界常见拟音的另一译法。
- issue: 亚玛谢内心忠诚的程度
  choice: 心不完全
  alternative: 不是全心全意／心不专一
  rationale: 原文只说他的“心”并非“完整、完全”，形成外在行为正确与内在委身不足之间的张力；正文不强化为虚伪，也不将其解释为绝对无罪意义上的“不完美”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“耶和华眼中看为正”保留希伯来语的评价性意象；“心不完全”略具经文语体，但由脚注说明其现代含义。
