base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: zh_hans
  text: 但你若要去参战，就要奋勇作战；神必使你在敌人面前跌倒，因为神有能力帮助，也有能力使人跌倒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跌倒”在这里也可理解为“败倒”。原文在本句前面也使用同一动词：“神必使你在敌人面前跌倒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 但……若
  rationale: 承接上文的劝阻，引出带有转折意味的条件句。
- source_word: בֹּא אַתָּה
  choice: 你若执意要去
  rationale: 显明动词与独立代词所形成的强调；结合上下文，用“执意”自然表达明知受劝仍要前去之意。
- source_word: עֲשֵׂה חֲזַק לַמִּלְחָמָה
  choice: 就在战场上奋勇吧
  rationale: 该短语直译近于“行事刚强，为着争战”；“奋勇”简洁传达战斗语境中的刚强行动，同时保留其劝令语气。
- source_word: יַכְשִׁילְךָ
  choice: 必使你……跌倒
  rationale: 保留כשל使役式“使跌倒”的形象，并与本节末同根动词形成明显呼应。
- source_word: לִפְנֵי אוֹיֵב
  choice: 在敌人面前
  rationale: 贴近希伯来语空间表达，也自然表示在敌军面前遭遇失败。
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: 神有能力
  rationale: 以自然现代汉语表达“在神里面有能力”的存在结构，不改变能力属于神的意义。
- source_word: לַעְזֹר וּלְהַכְשִׁיל
  choice: 帮助人，也有能力使人跌倒
  rationale: 保留两个并列不定式的平衡，并重复“使……跌倒”，显出原文的修辞呼应；补出泛指宾语“人”以合乎汉语表达。
theological_decisions:
- issue: 神在军事失败中的直接行动
  choice: 神必使你在敌人面前跌倒
  alternative: 神会任凭你败在敌人面前
  rationale: 原文直接以神为使役动词的主语，并称神既能帮助也能使人跌倒；译文不将这种直接施事弱化为许可或任凭，以保留经文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“执意要去”体现原文对第二人称的强调及上下文中的逆劝而行；“奋勇”适合军事场景。保留两次“使……跌倒”，以呈现原文的词语重复和神既能帮助、也能使人失败的张力。
