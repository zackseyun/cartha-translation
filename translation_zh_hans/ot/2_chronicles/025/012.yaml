base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: zh_hans
  text: 犹大人活捉了一万人，把他们带到峭壁[a]的顶上，又从峭壁的顶上把他们扔下去；他们全都摔得四分五裂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“磐石”或“岩峰”（希伯来语：selaʿ）。
    reason: lexical_alternative
  - marker: b
    text: 直译“全都裂开了”或“全都破裂了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: 活捉
  rationale: 该动词在军事语境中与“活着”连用，表示把人活着俘获；“活捉”简洁自然，也避免误解为一般性的拘留。
- source_word: חַיִּים
  choice: 活
  rationale: 此词在数量短语后作述谓性修饰，说明这一万人被俘时仍然活着；与 שָׁבוּ 合译为“活捉”。
- source_word: בְּנֵי יְהוּדָה
  choice: 犹大人
  rationale: 字面为“犹大之子”，此处指犹大众人或军兵；现代汉语用“犹大人”更自然。
- source_word: וַיְבִיאוּם
  choice: 把他们带到
  rationale: בוא 的使役式通常表示“带来、带到”；此处按目的地译为“带到”。
- source_word: לְרֹאשׁ
  choice: 顶上
  rationale: רֹאשׁ 字面为“头”，用于地貌时指顶部或顶峰；“顶上”符合现代汉语表达。
- source_word: הַסָּלַע / הַסֶּלַע
  choice: 峭壁
  rationale: סֶלַע 可指岩石、岩峰或峭壁；结合从其顶部把人扔下的动作，“峭壁”最清楚地传达此处地貌，同时以脚注保留其他可能。
- source_word: וַיַּשְׁלִיכוּם
  choice: 把他们……扔下去
  rationale: שלך 表示“扔、抛”；下文明确说“从峭壁顶上”，因此“扔下去”自然传达动作方向。
- source_word: וְכֻלָּם
  choice: 他们全都
  rationale: 保留原文代词后缀和整体性的强调。
- source_word: נִבְקָעוּ
  choice: 摔得支离破碎
  rationale: בקע 的被动式表示“裂开、破开”；结合从高处坠落的语境，“摔得支离破碎”以自然汉语表达惨烈结果，并在脚注中给出较直译说法。
