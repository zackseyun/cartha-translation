  text: אָמַ֗רְתָּ הִנֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּ/נְשָׂאֲ/ךָ֥ לִבְּ/ךָ֖ לְ/הַכְבִּ֑יד עַתָּה֙ שְׁבָ֣/ה בְּ/בֵיתֶ֔/ךָ לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: zh_hans
  text: 你说：‘看哪，你击败了以东，你的心便高傲起来，要夸耀自己[a]。’如今你还是待在家里吧！何必招惹祸患，以致你和犹大都倒下呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“你的心把你抬高，为要得荣耀（或显荣）”，也可理解为“你的心使你自高，要夸耀自己”。这是描写胜利后自我抬高的习语。
    reason: 保留נשא与כבד组合中“抬高、尊荣、自夸”之间的词义幅度和原文意象。
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: 你说
  rationale: Qal完成式第二人称阳性单数，在叙事中的直接引语前自然译为“你说”，不必机械表达完成时态。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示注意和加强语气的功能；“看哪”庄重而仍为现代中文读者所熟悉。
- source_word: הִכִּיתָ אֶת אֱדוֹם
  choice: 你击败了以东
  rationale: נכה的Hiphil形式在军事语境中表示击打并战胜；“击败”比字面的“击打”更准确传达此处战果。
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: 你的心便高傲起来
  rationale: 原文直译近于“你的心把你抬高”，是得胜后自高的习语；中文以“心高傲起来”自然表达其含义，同时在脚注说明原有意象。
- source_word: לְהַכְבִּיד
  choice: 要夸耀自己
  rationale: 该不定式可指使自己显为尊贵、求荣耀或自夸；在责备骄傲的语境中，“夸耀自己”自然且保留自我抬高的意味。
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: 如今你还是待在家里吧
  rationale: “住/坐在你家中”在这里是叫对方留在本处、不要出战；“待在家里”符合现代汉语习惯，“还是……吧”传达劝诫语气。
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: 何必挑起祸患
  rationale: גרה的Hitpael形式在此指挑起冲突、招惹事端，רָעָה在军事警告中指灾祸而非道德上的邪恶。
- source_word: וְנָפַלְתָּ
  choice: 使……倒下
  rationale: 连接式完成时在反问后说明可能造成的后果；“倒下”保留原文军事失败与覆亡兼具的意象。
- source_word: אַתָּה וִיהוּדָה עִמָּךְ
  choice: 你和犹大一同
  rationale: 明确保留君王个人的失败会连累整个犹大的集体后果。
theological_decisions:
- issue: 得胜后内心自高与夸耀之间的关系
  choice: 译作“你的心便高傲起来，要夸耀自己”
  alternative: “你的心把你抬高，使你得荣耀”
  rationale: 原文可涉及自高、显荣或求尊荣；正文按责备语境采用“夸耀自己”，但用脚注保留“抬高/尊荣”的词义张力，不把它扩展为特定神学判断。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留经文的强调语气；“待在家里”“何必挑起祸患”则避免过度古雅。正文以自然中文表达希伯来习语，并由脚注保存其字面意象与词义歧义。
