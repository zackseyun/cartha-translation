revisions:
- from: 亚玛谢就把他们，就是从以法莲来投奔他的那支军队，分别出来，叫他们回自己的地方去。他们便对犹大极其恼怒，带着烈怒回自己的地方去了。
  to: 亚玛谢便遣散那支从以法莲来到他那里的军队，让他们回本处去。他们就对犹大极其恼怒，怒气冲冲地回本处去了。
  rationale: 修订删除“投奔”所含的额外归附意味，并将不自然的“分别出来”改为语境准确的“遣散”。“对犹大极其恼怒”保留介词可表达的怒气对象；“怒气冲冲地”自然对应“在烈怒中”。原文在此没有必须以脚注保存而译文无法承载的实质歧义。
