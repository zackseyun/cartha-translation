base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: zh_hans
  text: 亚玛谢便遣散那支从以法莲来到他那里的军队，让他们回本处去。他们就对犹大极其恼怒，怒气冲冲地回本处去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: 把他们……分别出来
  rationale: בדל的基本义是“分别、分开”。这里指亚玛谢将以法莲军队从自己的部队中分离并遣回；译作“分别出来”既保留原词意象，也由后文“叫他们回……去”说明实际处置。
- source_word: לְהַגְּדוּד
  choice: 那支军队
  rationale: גְּדוּד可指军队、队伍或武装部队。此处是受雇而来的以法莲兵士，译作“那支军队”清楚自然。
- source_word: אֲשֶׁר בָּא אֵלָיו מֵאֶפְרַיִם
  choice: 从以法莲来投奔他的
  rationale: 直译为“从以法莲来到他那里”。结合招募军队的语境，“来投奔他的”自然表达其前来归入亚玛谢麾下，但不额外说明其动机。
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: 叫他们回自己的地方去
  rationale: 原文是“去他们的地方”。中文用“回自己的地方去”更自然，并明确该地是他们来处；“叫”表达目的性不定式。
- source_word: וַיִּחַר אַפָּם מְאֹד בִּיהוּדָה
  choice: 他们便对犹大极其恼怒
  rationale: חרה אף是怒气燃烧的习语，现代汉语自然译作“极其恼怒”；בְּ在此标示怒气所针对的对象，译为“对犹大”。
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם
  choice: 回自己的地方去了
  rationale: שׁוב表示返回；译文保留与前句“自己的地方”的呼应。
- source_word: בָּחֳרִי אָף
  choice: 带着烈怒
  rationale: חֳרִי אָף描写炽烈、猛烈的怒气。“带着烈怒”既传达强度，也自然修饰他们返回时的状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“分别出来”有意贴近希伯来文בדל，同时以“叫他们回自己的地方去”交代其在军事语境中的实际含义。原文没有需要以脚注保留的实质歧义；“对犹大”自然涵盖怒气针对犹大的含义。
