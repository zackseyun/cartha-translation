  text: וַ/יִּשְׂכֹּ֣ר מִ/יִּשְׂרָאֵ֗ל מֵ֥אָה אֶ֛לֶף גִּבּ֥וֹר חָ֖יִל בְּ/מֵאָ֥ה כִכַּר כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/006.yaml
  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: zh_hans
  text: 他又从以色列雇了十万名勇猛的战士[a]，代价是一百他连得银子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“英勇善战的人”或“勇士”。希伯来语这一词组指有能力、善于作战的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: 他又……雇了
  rationale: שׂכר 的 Qal 词干通常表示付报酬雇用；译作“雇”直接、自然，不额外加入“雇佣兵”这一带有解释性的称谓。句首 וַ 依叙事承接关系译为“又”。
- source_word: מִיִּשְׂרָאֵל
  choice: 从以色列
  rationale: 介词 מן 表示来源；“从以色列”准确表达这些受雇战士来自以色列，此处按历代志的语境指北国。
- source_word: מֵאָה אֶלֶף
  choice: 十万名
  rationale: 按希伯来语基数结构直接翻译；加量词“名”使现代汉语表达自然。
- source_word: גִּבּוֹר חָיִל
  choice: 勇猛的战士
  rationale: 该词组在军事语境中指强健、能征善战的人。“勇猛的战士”保留其力量与作战能力两方面的含义，同时比逐字式表达更符合现代汉语。
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: 代价是一百他连得银子
  rationale: 此处 בְּ 表示雇用的价款。“代价是”明确呈现其功能；保留古代重量单位“他连得”，不作不确定的现代重量或币值换算。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。语序基本跟随希伯来文的信息推进，同时将价款表达为“代价是”，使其在汉语中清楚自然；保留古代单位“他连得”。
