base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: zh_hans
  text: 于是，以色列王约阿施上去[a]，与犹大王亚玛谢在属犹大的伯示麦面对面相见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“出兵前往”。希伯来语原意为“上去”；在这里的战事语境中可能含有进军之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去
  rationale: עלה在叙事中通常表示“上去”。此处虽有军事进军的语境，但原文没有明说“出兵”或“进攻”，因此保留较直接的表达，并以脚注说明语境中可能含有的军事意味。
- source_word: וַיִּתְרָאוּ פָנִים
  choice: 彼此交锋
  rationale: 这一由ראה与“脸”构成的习语，字面意思是彼此见面；在当前战事语境中则表示双方正面对阵。“彼此交锋”在现代汉语中自然，并传达其对抗意味。
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: 与犹大王亚玛谢
  rationale: 原文直译为“他和亚玛谢”，着重指出双方。汉语承接前一分句，以“与”连接更自然，双方身份仍然清楚。
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: 在……伯示麦
  rationale: 介词ב在这里标示双方相遇交锋的地点；地名按传统译作“伯示麦”。
- source_word: אֲשֶׁר לִיהוּדָה
  choice: 犹大的
  rationale: לִיהוּדָה表示领土归属，即这座伯示麦属于犹大。把限定语前置为“犹大的伯示麦”，符合自然汉语，也区别于其他同名地点。
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: 以色列王 / 犹大王
  rationale: 直接、对称地翻译两个王号，符合现代汉语圣经叙事的庄重语体。
theological_decisions: []
