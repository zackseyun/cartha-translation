base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: zh_hans
  text: 亚玛谢对神人说：“可是，我给以色列军队的那一百他连得[a]怎么办呢？”神人说：“耶和华能赐给你比这更多的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“那一百他连得”；上一节说明这是银子的重量。
    reason: cross_reference
  - marker: b
    text: 也可译作“耶和华有足够的，可以赐给你比这更多”。原文的表达强调耶和华有能力和充足的资源供应。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来语对蒙神差遣之人的惯用称号。“神人”保留原文形式，也避免把其身份进一步限定为“先知”。
- source_word: וּמַה לַּעֲשׂוֹת
  choice: 可是……怎么办呢
  rationale: 该表达询问应当如何处理一件事；结合上文亚玛谢被吩咐遣回雇来的军队，此处用“可是”自然体现异议或顾虑。
- source_word: מְאַת הַכִּכָּר
  choice: 那一百他连得
  rationale: כִּכָּר是重量单位，传统译作“他连得”。本节原文本身没有“银子”，因此正文不补入，而在脚注中说明上节已明确是银子。
- source_word: גְדוּד יִשְׂרָאֵל
  choice: 以色列军队
  rationale: גְּדוּד可指部队、军旅或武装队伍；这里指受雇的以色列士兵，用“军队”简明自然。
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: 耶和华能赐给你
  rationale: 此存在句式强调耶和华拥有赐予的能力或资源；“能赐给你”以自然现代汉语表达其重点。
- source_word: הַרְבֵּה מִזֶּה
  choice: 比这更多的
  rationale: הַרְבֵּה与比较介词מִן连用，表达数量远超于此；“比这更多的”清楚保留比较意义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名；“耶和华”是现代中文圣经语境中广为人知的专名译法，保留其作为神名字的功能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留神名而不以“主”这一称号替代；采用中文读者最熟悉且庄重的“耶和华”，同时承认“雅威”更接近许多学者所重建的发音。
- issue: יֵשׁ לַיהוָה所表达的供给能力
  choice: 耶和华能赐给你
  alternative: 耶和华有足够的，可以赐给你
  rationale: 原句既可侧重能力，也可侧重拥有可供赐予的资源。正文采用自然的能力表达，并以脚注保留资源充足这一词义角度，避免把二者对立化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“怎么办呢”贴近日常而不失经文语体；“他连得”保留传统重量单位，并用脚注补足上文语境。标点及引语格式按现代简体中文规范处理。
