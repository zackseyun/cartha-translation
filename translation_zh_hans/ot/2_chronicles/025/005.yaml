  text: וַ/יִּקְבֹּ֤ץ אֲמַצְיָ֨הוּ֙ אֶת יְהוּדָ֔ה וַ/יַּֽעֲמִידֵ֣/ם לְ/בֵית אָב֗וֹת לְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וּ/לְ/שָׂרֵ֣י הַ/מֵּא֔וֹת לְ/כָל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן וַֽ/יִּפְקְדֵ֗/ם לְ/מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וַ/יִּמְצָאֵ֗/ם שְׁלֹשׁ מֵא֨וֹת אֶ֤לֶף בָּחוּר֙ יוֹצֵ֣א צָבָ֔א אֹחֵ֖ז רֹ֥מַח וְ/צִנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: zh_hans
  text: 亚玛谢召集犹大和便雅悯的人，按父系家族编组，归在千夫长和百夫长之下。他点阅二十岁以上的人，查得共有三十万精壮男子[a]，能出征[b]，手持矛和大盾[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精壮男子”也可译作“年轻男子”；希伯来语 בָּחוּר 可强调年龄，也可在军事语境中指精选或强健的男子。
    reason: lexical_alternative
  - marker: b
    text: “能出征”直译为“出去从军（或出战）”，是指可服军役或预备出战的希伯来语惯用说法。
    reason: lexical_alternative
  - marker: c
    text: 这里译作“大盾”的希伯来语 צִנָּה 特指一种大型盾牌。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: 召集
  rationale: קבץ表示把人聚集起来；“召集”自然地体现君王组织民众的行动，又不过度限定为单纯点兵。
- source_word: וַיַּעֲמִידֵם לְבֵית אָבוֹת
  choice: 按父系家族把他们编在……之下
  rationale: עמד的使役式在此表示安排、编列；בֵית אָבוֹת指以父系为基础的家族或宗族单位。“编”符合军事组织语境，“父系家族”也保留原有社会结构。
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: 在千夫长和百夫长之下
  rationale: שׂר在军事语境中是统领者；“千夫长、百夫长”简洁保留按千人和百人划分的指挥层级。
- source_word: לְכָל יְהוּדָה וּבִנְיָמִן
  choice: 包括犹大和便雅悯众人
  rationale: 该短语说明此次编组所涵盖的范围；“包括……众人”在现代汉语中比逐字照译“为全犹大和便雅悯”更清楚。
- source_word: וַיִּפְקְדֵם
  choice: 点阅
  rationale: פקד在军事语境中兼有清点、核查和检阅人员之意；“点阅”同时传达统计与军事审核。
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 二十岁以上的人
  rationale: 这是表示年龄下限的固定说法；此译文符合现代汉语表达。
- source_word: וַיִּמְצָאֵם
  choice: 查得共有
  rationale: מצא在这里引出点阅所得的数目；“查得共有”明确显示三十万是清点结果。
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: 三十万
  rationale: 直接按希伯来文数值翻译。
- source_word: בָּחוּר
  choice: 精壮男子
  rationale: 该词既可指年轻男子，也可在军事语境中指精选、强健而适合服役的人；“精壮男子”保留此处可能兼有的年龄和战斗能力色彩。
- source_word: יוֹצֵא צָבָא
  choice: 可以出征
  rationale: 字面为“出去从军/出战”，是指具备出征或服军役资格的惯用说法；“可以出征”在汉语中自然，并以脚注保留字面信息。
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: 手持矛和大盾
  rationale: אֹחֵז直指拿着、持有，故不额外加入“善于使用”；צִנָּה特指较大的盾牌，因此译作“大盾”。
