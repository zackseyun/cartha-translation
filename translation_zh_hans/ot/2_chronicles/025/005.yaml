  rationale: 修订首句以消除“犹大人”与“犹大和便雅悯众人”之间的范围歧义，并调整编组表达，使父系家族单位和千、百人指挥层级在现代汉语中更清楚。其余内容及所有脚注锚点均保留；“能出征”仅作轻微措辞润色，未改变原文所保留的军事资格／出战含义。
