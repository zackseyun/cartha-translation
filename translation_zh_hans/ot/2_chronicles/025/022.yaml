  footnotes:
  - marker: a
    text: 希伯来文直译为“各人逃到自己的帐棚”；这是表示众人四散撤退、各自返回驻处的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: 败
  rationale: נָגַף 的尼法勒式在此处描述战败；“败”简洁、自然，也符合军事叙事语境。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 指南国犹大，采用现代中文圣经传统中通行的专名译法。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留希伯来语军事叙事中“败在敌方面前”的表达，同时现代中文仍可自然理解为被对方击败。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 此处指北国以色列，采用现代中文通行的专名译法。
- source_word: וַיָּנֻסוּ
  choice: 逃回
  rationale: נוּס 意为逃跑；结合目的语“到自己的帐棚”，译作“逃回”自然地表达败退并返回各自驻处。
- source_word: אִישׁ
  choice: 各人
  rationale: 单数 אִישׁ 在此具有逐一分配的意义。“各人”准确表达每个人分别行动，也适合指代上下文中的作战人员。
- source_word: לְאֹהָלָיו
  choice: 自己的帐棚
  rationale: 字面意象是“到他的帐棚”；中文以“自己的帐棚”保留帐棚意象，并清楚表达各自返回所属驻处。
