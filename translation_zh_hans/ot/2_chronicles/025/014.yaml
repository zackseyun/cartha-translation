  text: וַ/יְהִ֗י אַחֲרֵ֨י ב֤וֹא אֲמַצְיָ֨הוּ֙ מֵֽ/הַכּ֣וֹת אֶת אֲדוֹמִ֔ים וַ/יָּבֵ֗א אֶת אֱלֹהֵי֙ בְּנֵ֣י שֵׂעִ֔יר וַ/יַּֽעֲמִידֵ֥/ם ל֖/וֹ לֵ/אלֹהִ֑ים וְ/לִ/פְנֵי/הֶ֥ם יִֽשְׁתַּחֲוֶ֖ה וְ/לָ/הֶ֥ם יְקַטֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: zh_hans
  text: 亚玛谢击败以东人归来后，把西珥子孙的神[a]带了回来，立为自己的神；他在它们面前下拜[b]，又向它们烧香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西珥子孙”也可译作“西珥人”。希伯来文直译为“西珥子孙的神”。
    reason: 说明希伯来文的亲属称谓，并保留“西珥人”这一自然的替代译法；不将原文的“神”限定为“神像”。
  - marker: b
    text: 或译：“俯伏在它们面前”。
    reason: 保留השתחוה所指更具体的身体动作这一替代译法。
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  choice: ……回来以后
  rationale: וַיְהִי承接叙事，汉语无需机械译出“事情发生了”；בוא结合מֵהַכּוֹת所表达的行动来源，按语境自然译作“回来以后”。
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: 击败以东人
  rationale: נכה可指击打、击杀或击败；这里概括亚玛谢对以东的军事行动，译作“击败”既自然，也不额外断定杀戮范围。
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: 西珥子孙的神像
  rationale: בני שעיר直译为“西珥的子孙”；上下文中的复数אֱלֹהֵי指他们所敬奉并可被带走、竖立的神祇形像。用“神像”既符合具体动作，也避免现代读者误读为把神祇本身当作可搬运物。脚注保留“西珥人”的自然替代译法。
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: 立作自己的神
  rationale: 使役式עמד表示把对象竖立或安置起来；לוֹ לֵאלֹהִים说明亚玛谢将它们确立为自己敬奉的神。
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: 在它们面前下拜
  rationale: השתחוה表示俯伏、下拜，常带敬拜含义；“下拜”保留身体动作，不将含义抽象化为单纯“敬拜”。
- source_word: וְלָהֶם יְקַטֵּר
  choice: 向它们烧香
  rationale: Piel形式קטר在祭祀语境中指焚烧香料或献烟祭；“烧香”简洁并符合现代中文宗教语境。
theological_decisions:
- issue: 异教神祇אֱלֹהֵי的表达
  choice: 神像
  alternative: 诸神
  rationale: 本节的宾语被带回并竖立，具体所指显然包括代表西珥诸神的偶像；“神像”使中文动作搭配自然。与此同时，不译作贬义更强的“假神”，以免把叙事本身的神学判断额外写入词义。
- issue: השתחוה是否直接译为“敬拜”
  choice: 下拜
  alternative: 敬拜
  rationale: 原词首先描述俯伏下拜的动作，祭祀含义由立为神和烧香的上下文清楚显明；保留动作性可避免过度解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事中文。省略וַיְהִי的机械对应，以汉语时间从句自然承接情节；分号划分设立神像与随后祭拜的动作。代词用“它们”指神像，符合现代汉语对无生命偶像的指称。
