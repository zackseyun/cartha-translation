base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: zh_hans
  text: 亚玛谢其余的事迹[a]，自始至终，不都记在《犹大和以色列诸王记》上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事迹”原文也可直译为“言语”或“事情”；在记述君王的总结语中，通常泛指他的作为和相关事件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ
  choice: 亚玛谢其余的事迹
  rationale: יֶתֶר表示其余部分；דִּבְרֵי在君王生平的总结套语中不只指言语，也指有关其统治的事情和作为，因此译为自然且符合史书语境的“事迹”。句首וְ在此承接上下文，中文无需机械译作“又”。
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: 自始至终
  rationale: 字面为“先前的和后来的”，在此概括亚玛谢生平事迹的整个时间跨度；“自始至终”简洁保留了总括意义。
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: 不都记在……上吗
  rationale: הֲלֹא引出预期肯定回答的反问；הִנָּם带有指示或强调意味。中文以“不都……吗”自然呈现反问及强调，כְּתוּבִים在文献语境中译作“记”。
- source_word: עַל סֵפֶר
  choice: 记在……上
  rationale: עַל字面为“在……之上”；中文谈到书面记载时，“记在书上”既自然，也较贴近原文表达。
- source_word: סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: 《犹大和以色列诸王记》
  rationale: 按所引文献的名称处理，以书名号标示；保留原文“犹大和以色列”的次序。“诸王记”表达这是有关两国君王的记录，不把它误认作现今圣经中的《列王纪》。
