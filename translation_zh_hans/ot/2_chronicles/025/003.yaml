  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר חָזְקָ֥ה הַ/מַּמְלָכָ֖ה עָלָ֑י/ו וַֽ/יַּהֲרֹג֙ אֶת עֲבָדָ֔י/ו הַ/מַּכִּ֖ים אֶת הַ/מֶּ֥לֶךְ אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/003.yaml
  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: zh_hans
  text: 他的统治稳固以后[a]，他就杀了那些曾击杀他父王的臣仆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“王权在他手中巩固以后。”也可理解为“王国在他掌控下稳固以后”。
    reason: “王国／王权／统治”均可反映ממלכה在此处的语义范围；“在他手中／掌控下”表达原文关于控制权的意象。
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 以后
  rationale: 这一叙事结构引出随后发生的事；用“……以后”自然表达时间关系，不另加原文没有的“那时”。
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: 王国在他手中巩固
  rationale: חזק在此指王权或统治得到巩固；“在他手中”保留控制、掌握的具体意象，同时现代汉语通顺。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 在王室语境中，该词指服事君王的人，可能兼有臣属与仆役身份；“臣仆”比单纯“奴仆”或“官员”更能保留其范围。
- source_word: וַיַּהֲרֹג
  choice: 他就杀了
  rationale: 直接表达הרג的致死含义；“就”承接前面的时间条件。
- source_word: הַמַּכִּים
  choice: 那些曾击杀……的
  rationale: 分词指明这些臣仆就是刺杀者；“击杀”保留נכה的击打意象及致死语境，并避免与主句“杀了”完全重复。
- source_word: אֶת־הַמֶּלֶךְ אָבִיו
  choice: 他父王
  rationale: 原文是“王、他的父亲”的同位表达；现代汉语以“父王”简洁自然地兼顾父亲与君王双重身份。
theological_decisions: []
