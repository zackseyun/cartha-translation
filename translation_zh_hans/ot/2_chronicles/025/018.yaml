revisions:
- from: 以色列王约阿施派人到犹大王亚玛谢那里，说：“黎巴嫩的一棵荆棘[a]派人去见黎巴嫩的一棵香柏树，说：‘把你的女儿嫁给我的儿子。’后来，黎巴嫩的一只野兽经过，把那棵荆棘踩倒了。”
  to: 以色列王约阿施传话给犹大王亚玛谢，说：“黎巴嫩的一株荆棘[a]传话给黎巴嫩的一棵香柏树，说：‘把你的女儿给我的儿子作妻子。’随后，黎巴嫩田野中的一只野兽经过，把那株荆棘踩踏了。”
  rationale: 以“传话给……说”对应原文省略宾语的“差遣……说”，既保留框架叙述和寓言中的重复结构，也不擅自指定传递者。将“踩倒”改为“踩踏”，并补出“田野”，使译文更贴近原文语义；其余意象、专名和脚注均可保留。
