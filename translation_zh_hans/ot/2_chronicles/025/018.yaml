base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: zh_hans
  text: 以色列王约阿施传话给犹大王亚玛谢，说：“黎巴嫩的一株荆棘[a]传话给黎巴嫩的一棵香柏树，说：‘把你的女儿给我的儿子作妻子。’随后，黎巴嫩田野中的一只野兽经过，把那株荆棘踩踏了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荆棘”也可译作“蒺藜”或“刺灌木”。希伯来语指一种有刺植物，确切种类不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: 一棵荆棘
  rationale: 该词泛指有刺植物，具体种类不确定；“荆棘”在现代汉语中自然，也保留了它与高大香柏树之间的鲜明反差。
- source_word: הָאֶרֶז
  choice: 一棵香柏树
  rationale: 该词通常指香柏树；这一形象突出其高大强壮，与低矮的荆棘形成对照。
- source_word: בַּלְּבָנוֹן
  choice: 黎巴嫩的
  rationale: 中文用领属结构自然表达植物和野兽所在的地域，同时保留原文三次出现的地点。
- source_word: שָׁלַח ... לֵאמֹר
  choice: 派人……说
  rationale: 原文没有明说所派的是人还是口信；中文若直译“派到……说”不自然，因此用“派人”表达差遣传话的语境，并保留重复的叙述结构。
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: 把你的女儿嫁给我的儿子
  rationale: 这是缔结婚姻的惯用表达；这样译成现代汉语简洁自然，并准确表达“给我儿子作妻子”的含义。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 一只野兽
  rationale: 该短语指野外的兽类；“野兽”已包含野外动物之意，避免生硬的“田野之兽”。
- source_word: וַתַּעֲבֹר
  choice: 经过
  rationale: 准确表达动物从旁经过的动作，并使荆棘被踩显得轻易而偶然。
- source_word: וַתִּרְמֹס
  choice: 踩倒
  rationale: 表达用脚践踏并压倒的动作，比单用“践踏”更贴合现代叙事语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留寓言中荆棘与香柏树的强烈反差，以及“派人……说”的重复结构；用“后来”中性承接事件，不添加转折含义。
