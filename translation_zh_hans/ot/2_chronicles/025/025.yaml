base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: zh_hans
  text: 犹大王约阿施的儿子亚玛谢，在以色列王约哈斯的儿子约阿施死后，又活了十五年[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在约阿施死后活了十五年”，意思是亚玛谢比以色列王约阿施多活了十五年。
    reason: 说明原文结构及其在这段年代记载中的含义。
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 此处חיה表示亚玛谢在以色列王约阿施死后继续活了一段时间；“又活了”自然表达这种延续，同时不把动词过度解释为“比……多活”。
- source_word: אֲמַצְיָהוּ
  choice: 亚玛谢
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בֶן יוֹאָשׁ
  choice: 约阿施的儿子
  rationale: 按希伯来文父子关系表达，并用自然的现代汉语语序呈现。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 准确、简洁地表达管理犹大的君王身份。
- source_word: אַחֲרֵי מוֹת
  choice: 死后
  rationale: 忠实表达“在……死亡之后”的时间关系，现代汉语中比“在……之死以后”更自然。
- source_word: יְהוֹאָחָז
  choice: 约哈斯
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 准确、简洁地表达管理以色列的君王身份。
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: 十五年
  rationale: 直接、准确地翻译数目与时间单位。
