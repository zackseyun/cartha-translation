  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: zh_hans
  text: 以色列王约阿施在伯示麦俘获了犹大王亚玛谢，就是约阿施的儿子、约哈斯的孙子，并把他带到耶路撒冷。他又拆毁耶路撒冷的城墙，从以法莲门直到角门[a]，共四百肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角门”原文直译可作“转向的门”或“朝向的门”。这里的译法依据列王纪下14:13的平行记载，可能指同一座城门。
    reason: 保留 שַׁעַר הַפּוֹנֶה 的词义歧义，并说明传统地点辨识的依据。
lexical_decisions:
- source_word: תָּפַשׂ
  choice: 俘获
  rationale: 该动词表示抓住、拘捕；在军事语境中，“俘获”既自然，也明确表达亚玛谢落入敌王手中。
- source_word: בְּבֵית שָׁמֶשׁ
  choice: 在伯示麦
  rationale: 介词 בְּ 与地名连用，指出俘获事件发生的地点；采用现代中文常用地名音译“伯示麦”。
- source_word: וַיְבִיאֵהוּ
  choice: 并把他带到
  rationale: בוא 的使役式通常表示“带来、带到”；此处不额外限定押送方式。
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: 拆毁耶路撒冷的城墙
  rationale: פרץ 在城墙语境中表示破坏、打开缺口；“拆毁”清楚表达城墙遭到大范围毁坏。
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: 从以法莲门直到角门[a]
  rationale: “以法莲门”按专名处理。הַפּוֹנֶה 字面含义并不完全明确，可能指“转向”或“朝向”的门；正文采用与列王纪下14:13平行记载相符、且便于辨识的“角门”，并用脚注保留字面歧义。
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: 共四百肘
  rationale: 原文直接给出度量而未明说“长”；中文加“共”使句意顺畅，但不额外改换为现代长度单位。
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: 约阿施的儿子、约哈斯的孙子
  rationale: 以自然中文清楚保留两代谱系关系，且不省略原文对亚玛谢家世的说明。
theological_decisions: []
