revisions:
- from: 但有一位神人来见他，说：“王啊，不要让以色列军队跟你一起出征，因为雅威不与以色列同在——不与以法莲的所有子孙同在[a]。”
  to: 但有一位神人来见他，说：“王啊，不要让以色列军队跟你一起出征，因为雅威不与以色列同在，也不与以法莲的众子孙同在[a]。”
  rationale: 仅作低风险的汉语句法和文体修订。修订后的末句以自然的并列结构呈现原文中“以色列”及“所有以法莲子孙”的紧邻关系，避免把其解释为明确的“就是”同位语，也避免破折号造成的突兀断裂。其余内容保持原意、军事语境和神名译法不变。
