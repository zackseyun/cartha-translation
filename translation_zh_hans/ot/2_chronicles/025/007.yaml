  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: zh_hans
  text: 但有一位神人来见他，说：“王啊，不要让以色列军队跟你一起出征，因为雅威不与以色列同在，也不与以法莲的众子孙同在[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以法莲的众子孙”直译也可译作“所有以法莲人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: 一位神人
  rationale: 这是对奉神差遣之使者的惯用称谓；“一位”符合此处首次引入人物的不定表达。
- source_word: בָּא אֵלָיו
  choice: 来见他
  rationale: בוא 与 אֶל 连用表示来到某人那里；“来见他”在现代汉语中自然清楚。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是希伯来语常见的引语引入公式，汉语简洁译作“说”。
- source_word: הַמֶּלֶךְ
  choice: 王啊
  rationale: 定冠词名词在此用作直接称呼；“王啊”保留呼语语气。
- source_word: אַל יָבֹא עִמְּךָ
  choice: 不要让……跟你一起出征
  rationale: אַל 加未完成式表达禁止；结合军事行动的语境，以“出征”自然呈现同行之意。
- source_word: צְבָא יִשְׂרָאֵל
  choice: 以色列军队
  rationale: צָבָא 在此指军事力量，“军队”准确且庄重。
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: 因为雅威不与以色列同在
  rationale: כִּי 引出禁止的理由；אֵין…עִם 表示“不与……同在”。
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: 以法莲的所有子孙
  rationale: 保留 בְּנֵי 的家族性表达，同时脚注给出自然的族群译法。末句以破折号体现其对“以色列”的补充说明，而不把关系过度定死。
theological_decisions:
- issue: 神圣之名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的古希伯来语拟音，并保留其作为专名的性质。
- issue: “以色列”与“以法莲的所有子孙”的句法关系
  choice: 以破折号作补充说明，并重复“不与……同在”
  alternative: 译作“以色列，就是以法莲的所有子孙”
  rationale: 原文将 כֹּל בְּנֵי אֶפְרָיִם 置于“以色列”之后，却没有明示连接词。破折号既呈现补充、聚焦关系，又避免将其严格限定为同位等同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神人”沿用简洁的圣经称谓；“跟你一起出征”按军事语境自然表达同行。破折号保留末句略显突出的补充结构。
