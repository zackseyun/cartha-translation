base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: zh_hans
  text: 雅威向亚玛谢大发烈怒，便差遣一位先知到他那里。先知对他说：“你为什么寻求[a]那个民族的神明呢？那些神明并没有把自己的民从你手中救出来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寻求”也可译作“求问”或“询问”。
    reason: 保留 דָרַשְׁתָּ 在宗教语境中“寻求、求问或咨询”的词义幅度，而不把行为限定为敬拜。
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: 雅威……燃起怒火
  rationale: 保留希伯来语“怒气燃烧”的鲜明意象，同时采用自然的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译四字神名，保留经文所用的上帝之名，而不以称号代替。
- source_word: בַּאֲמַצְיָהוּ
  choice: 向亚玛谢
  rationale: 介词与发怒表达连用，表示怒气所针对的对象。
- source_word: נָבִיא
  choice: 一位先知
  rationale: 这是该词在此处作为上帝使者的标准译法。
- source_word: דָרַשְׁתָּ
  choice: 寻求
  rationale: 该词在宗教语境中可指寻求、求问或寻问；“寻求”保留较宽泛的含义，不把行为限定为求问或敬拜。
- source_word: אֱלֹהֵי הָעָם
  choice: 那个民族的神明
  rationale: 语境中指被亚玛谢击败的民族之神；“神明”自然表达此处的复数异教神祇。
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: 那些神明并没有……救出
  rationale: 希伯来文陈述它们没有施行拯救，并未明确断言它们“不能”拯救，因此不强化为能力上的不可能。
- source_word: עַמָּם
  choice: 自己的民
  rationale: “自己”自然明确反身领属关系，并凸显先知责问中的反讽。
- source_word: מִיָּדֶךָ
  choice: 从你手中
  rationale: 保留希伯来语以“手”表示权势和控制的具体意象，现代汉语仍清楚可懂。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名；音译“雅威”既保留专名性质，也避免以称号“主”取代原文。
- issue: 诸神没有施救的表述
  choice: 并没有……救出
  alternative: 不能……救出
  rationale: 原文只陈述这些神明未救出自己的民，没有直接把事实改述为能力判断，故保留原文的表述范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；用“燃起怒火”保存原文意象，用“神明”清楚表达异教诸神，并将脚注标记紧接在其所说明的“寻求”之后。
