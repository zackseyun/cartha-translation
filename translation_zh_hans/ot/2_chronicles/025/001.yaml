base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: zh_hans
  text: 亚玛谢二十五岁[a]时登基[b]，在耶路撒冷作王二十九年。他母亲名叫约耶但，是耶路撒冷人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“二十五岁之子”。
    reason: lexical_alternative
  - marker: b
    text: “登基”也可译作“开始作王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: 二十五岁
  rationale: 这是希伯来语表达年龄的惯用语，字面为“二十五岁之子”；现代汉语自然表达为“二十五岁”。
- source_word: מָלַךְ（第一次）
  choice: 登基
  rationale: 在君王年龄公式中，此处表示开始作王；“登基”简洁、自然，并准确表达即位之意。
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: 作王二十九年
  rationale: 第二次出现的 מָלַךְ 描述统治持续的时间；“作王二十九年”符合现代汉语的王朝纪年表达。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 在这里表示地点，直译并自然表达为“在耶路撒冷”。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 以自然的现代汉语表达希伯来语“他母亲的名字是”，不损失原意。
- source_word: יְהוֹעַדָּן
  choice: 约耶但
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: מִירוּשָׁלָיִם
  choice: 是耶路撒冷人
  rationale: 介词 מִן 表示来源或籍贯；在人物介绍语境中，“是耶路撒冷人”比“来自耶路撒冷”更自然，同时保留其籍贯含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。君王纪年用“登基”和“作王”区分即位事件与统治时长；末句以“是耶路撒冷人”自然表达母亲的籍贯。两个脚注均紧接其所说明的“登基”公式，其中[a]说明前置年龄惯用语，[b]说明动词的可选译法。
