source:
  edition: WLC
  text: וְ/לֹא שָׁמַ֣ע אֲמַצְיָ֔הוּ כִּ֤י מֵ/הָֽ/אֱלֹהִים֙ הִ֔יא לְמַ֖עַן תִּתָּ֣/ם בְּ/יָ֑ד כִּ֣י דָֽרְשׁ֔וּ אֵ֖ת אֱלֹהֵ֥י אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: zh_hans
  text: 但亚玛谢不肯听从，因为这事出于上帝，为要把他们交在敌人手中[a]，因为他们寻求了以东的神明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“交在手中”；这是希伯来语惯用语，意思是交在别人权下。“敌人”依上下文补出。
    reason: 说明希伯来语惯用语及译文中的语境补足。
lexical_decisions:
- source_word: שָׁמַע
  choice: 听从
  rationale: 此处不是单指听见声音，而是指听取并接受警告；“不肯听从”也自然表达了亚玛谢拒绝劝告的语境意味。
- source_word: מֵהָאֱלֹהִים הִיא
  choice: 这事出于上帝
  rationale: 阴性代词所指可理解为亚玛谢不听从这一事态；“这事”保留所指的一定开放性，同时明确表达其出于上帝。
- source_word: לְמַעַן
  choice: 为要
  rationale: 清楚表达原文的目的意味，也允许上下文中目的与结果之间的张力继续存在。
- source_word: תִּתָּם בְּיָד
  choice: 把他们交在敌人手中
  rationale: “交在……手中”是希伯来语表示交由对方权势支配的惯用语；“敌人”由当前战争语境补出，使现代汉语完整易懂，并以脚注说明。
- source_word: דָרְשׁוּ
  choice: 寻求
  rationale: 该词以神明为宾语时可指求问、倚赖或敬拜；“寻求”保留较宽的宗教含义，不把动作限缩为单纯求问。
- source_word: אֱלֹהֵי אֱדוֹם
  choice: 以东的神明
  rationale: 原文构词直接指以东所敬奉的诸神；“神明”在现代汉语中自然表达异教神祇，并避免与独一的上帝混淆。
theological_decisions:
- issue: 亚玛谢拒绝听从与败亡中的神圣因果关系
  choice: 保留“这事出于上帝”和“为要”的直接陈述，表明其拒绝与随后被交付都处于上帝的作为和目的之中。
  alternative: 将本句弱化为上帝仅仅许可亚玛谢拒绝，或只把败亡结果归于上帝。
  rationale: 希伯来文明确说“这事出于上帝”，并使用目的标记 לְמַעַן。译文不削弱神圣能动性，也不添加经文未提供的系统性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不肯听从”体现拒绝劝告；“出于上帝……为要”保留原文的神学张力；“神明”用于以东诸神，与“上帝”形成清楚区分。
