base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: zh_hans
  text: 他正对王说话的时候，王对他说[a]：“我们岂立你作王的谋士吗？住口吧！何必受人击打呢？[b]”于是先知住了口，说：“我知道，神已经定意要毁灭你[c]，因为你做了这事，也不听我的劝告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他对他说”；这里的“他”按上下文指亚玛谢王。
    reason: clarity
  - marker: b
    text: 希伯来文直译为“为什么他们要击打你？”动手的人没有明确指出，可能是奉王命惩治先知的人。
    reason: lexical_alternative
  - marker: c
    text: “定意”所译的希伯来语动词也可译为“筹划”或“计划”；这个词本义与出谋、谋划有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: 王对他说
  rationale: 希伯来文直译为“他对他说”，主语承接上下文中的亚玛谢王。正文明确为“王”，便于现代读者辨认说话者，同时以脚注说明原文形式。
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: 我们岂立你作王的谋士吗
  rationale: 将疑问词、介词短语与动词合读为带责斥意味的反问：“我们岂立你作王的谋士吗？”“立……作”简洁表达任命某人担任职务。
- source_word: חֲדַל
  choice: 住口吧
  rationale: 此命令要求先知停止说话；“住口吧”比泛指停止行动的“停下”更贴合语境，也保留王的强硬语气。
- source_word: לָמָּה יַכּוּךָ
  choice: 何必让人击打你呢
  rationale: 原文动词为第三人称复数，施事者没有明说。“让人击打你”在中文中自然保留不定施事者，也传达王的威胁而不擅自断定是处死。
- source_word: וַיֶּחְדַּל הַנָּבִיא
  choice: 于是先知住了口
  rationale: 与前面的命令“住口吧”形成词语呼应，并明确保留“先知”的身份称谓。
- source_word: יָעַץ אֱלֹהִים
  choice: 神已经定意
  rationale: יעץ 的基本语义涉及出谋、筹划或定意；神作主语且后接“毁灭你”时，表示已经形成的旨意。“定意”自然而不削弱判断的确定性。
- source_word: לְהַשְׁחִיתֶךָ
  choice: 要毁灭你
  rationale: שחת 的使役式在此表示使人遭毁灭；“毁灭你”直接保留审判的力度。
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: 又不听我的劝告
  rationale: שמע 在此兼有听从、理会之意；עצה 是劝告或谋议。“不听我的劝告”符合现代汉语，并与前文“定意”背后的谋划词汇保持一定呼应。
theological_decisions:
- issue: יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ 所表达的神的意向
  choice: 神已经定意要毁灭你
  alternative: 神已经筹划要毁灭你／神有意毁灭你
  rationale: 原文直接把毁灭性的审判表述为神已经作出的意向。译文不淡化这种确定性，也不加入关于护理、预定或自由意志的额外教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“我们岂……吗”保留王的反问和权威口吻；“住口吧”传达即时威胁；“何必让人击打你呢”避免古奥，同时保留原文未明说施事者的特点。
