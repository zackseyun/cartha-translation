base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: zh_hans
  text: 从亚玛谢不再跟随耶和华[a]的时候起，耶路撒冷就有人密谋反对他。他逃到拉吉；他们却派人追到拉吉，在那里杀了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从耶和华后面转离”，意思是不再跟随耶和华。
    reason: 说明原文习语的字面意象及其语境含义。
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: 从……的时候起
  rationale: 准确表达以某一事件为起点的时间关系；句首的 וּ 无须机械译作“而”。
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: 转离、不再跟随耶和华
  rationale: סָר 表示偏离或背离，מֵאַחֲרֵי יְהוָה 字面为“从耶和华后面离开”，合起来指停止跟随耶和华。正文保留“转离”意象，并用“不再跟随”清楚传达习语含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式音译四字神名，区别于称号“主”。
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: 有人密谋反对他
  rationale: 同根动词与名词构成强调式表达，意为策划叛乱或阴谋；希伯来文主语只标示复数，并未说明具体是谁，因此译作泛指的“有人”。
- source_word: וַיָּנָס לָכִישָׁה
  choice: 他逃到拉吉
  rationale: נוס 表示因危险而逃走，地名后的方向词尾自然译为“到”。
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: 他们却派人追到拉吉
  rationale: 原文直译为“派〔人〕跟在他后面到拉吉”；中文需补出隐含受差遣者，“却”体现他逃走与追杀者随后行动之间的转折。
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: 在那里把他处死
  rationale: מות 的使役式表示使其死亡；“处死”体现有意将他杀死的语气，并保留地点副词“在那里”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名，而非一般称号。正文采用现代中文圣经传统中最通行、普通读者最熟悉的“耶和华”，不以“主”替代专名。
- issue: 亚玛谢行为的宗教含义
  choice: 转离、不再跟随耶和华
  alternative: 离开耶和华
  rationale: 原文的“从耶和华后面转离”强调停止跟随，不宜弱化为单纯的空间离开；同时不额外加入“背道”等解释性较强的神学术语。
- issue: 阴谋与亚玛谢转离之间的时间和因果关系
  choice: 从……的时候起……就……
  alternative: 因为……所以……
  rationale: 原文明确表达时间起点，却没有用显式因果连词；译文保留时间关联，不把它强化为明说的因果判断。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“密谋反对他”避免把原文未明说的具体政治罪名加入正文；以短句处理连续的叙事动词，使追逃和处死的过程清楚。
