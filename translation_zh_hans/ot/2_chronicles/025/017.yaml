  text: וַ/יִּוָּעַ֗ץ אֲמַצְיָ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה וַ֠/יִּשְׁלַח אֶל יוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לך נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: zh_hans
  text: 犹大王亚玛谢经过商议，就派人到以色列王约阿施那里；约阿施是约哈斯的儿子、耶户的孙子。亚玛谢说：“来吧，让我们面对面相见吧。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让我们彼此见面吧！”希伯来语字面与看见对方的脸有关；在这里很可能是向对方发出直接交锋的挑战。
    reason: 保留原文习语的字面可能性，并说明其在上下文中的对抗含义。
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: 与人商议后
  rationale: יעץ 的尼פעל式在这里表示经过商议或筹划；译作“与人商议后”既保留共同商议的意味，也自然衔接随后采取的行动。
- source_word: וַיִּשְׁלַח אֶל
  choice: 派人到……那里
  rationale: 原文直译为“差遣到”；所差遣的对象未明说，但汉语需要补出隐含的“人”，才能自然表达传递挑战信息的行动。
- source_word: יוֹאָשׁ בֶּן־יְהוֹאָחָז בֶּן־יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王约阿施……约哈斯的儿子、耶户的孙子
  rationale: 保留原文完整的王号与谱系，并采用现代中文圣经读者较熟悉的人名形式；分为两句可避免长串修饰语造成歧义。
- source_word: לֵאמֹר
  choice: 亚玛谢说
  rationale: 原文是引出直接引语的叙事公式。中文明确补出说话者“亚玛谢”，使指代清楚，不改变原意。
- source_word: לְךָ
  choice: 来吧
  rationale: 该命令式在这里用于发出挑战；“来吧”简洁自然，也保留邀约兼挑衅的语气。
- source_word: נִתְרָאֶה פָנִים
  choice: 我们面对面较量吧
  rationale: 该表达字面涉及彼此见面或看见对方的脸；在当前军事政治语境中是直接挑战。“面对面较量”保留“面对面”的形象，同时自然传达对抗意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将较长的王号和谱系拆成两句，以确保约阿施的身份关系清楚；直接引语则保留简短有力的挑战语气。
