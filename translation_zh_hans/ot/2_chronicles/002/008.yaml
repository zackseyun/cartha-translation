  text: וּ/לְ/הָכִ֥ין לִ֛/י עֵצִ֖ים לָ/רֹ֑ב כִּ֥י הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֥וֹל וְ/הַפְלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/008.yaml
  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
translation:
  language: zh_hans
  text: 又为我预备大量木料，因为我要建造的殿宇[a]必宏伟非凡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“房屋”；这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: 或译：“极其宏伟。”原文末语也可理解为加强“宏伟”的程度。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וּלְהָכִין
  choice: 又……预备
  rationale: 带有连词和介词的不定式承接上一节的请求；“又……预备”在中文中自然地表达这一延续关系。
- source_word: לִי
  choice: 为我
  rationale: 介词加第一人称单数后缀表示受益者，直译为“为我”。
- source_word: עֵצִים
  choice: 木料
  rationale: 在建造语境中指建筑用木材；“木料”比笼统的“木头”或字面的“树木”更准确。
- source_word: לָרֹב
  choice: 大量
  rationale: 表示数量众多；“大量木料”简洁自然，并保留数量方面的重点。
- source_word: כִּי
  choice: 因为
  rationale: 引出请求大量木料的理由。
- source_word: הַבַּיִת
  choice: 殿宇
  rationale: 原词字面为“房屋”，此处所指是所罗门要建造的圣殿；“殿宇”既符合语境，也保留其作为建筑物的表达，并以脚注说明字面形式。
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: 我要建造的
  rationale: 分词可表示正在进行或已确定、即将进行的行动；在此请求建材的语境中，“我要建造的”是自然且不把工程误说成已经动工的译法。
- source_word: גָּדוֹל
  choice: 宏伟
  rationale: 此词在圣殿语境中兼有规模大和气势盛大的意味，“宏伟”比单纯的“大”更充分。
- source_word: וְהַפְלֵא
  choice: 非凡
  rationale: 源自动词 פלא 的使役形式，表达超乎寻常、令人惊叹；“非凡”与“宏伟”搭配自然，同时保留其超常意味。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“殿宇”符合所罗门建殿的语境，“宏伟非凡”保留原文对规模与超常壮丽的并列表达；两个脚注标记均置于相应正文词语之后。
