id: 2CH.2.11
reference: 2 Chronicles 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: zh_hans
  text: 户兰[a]说：“雅威——以色列的上帝是当受称颂的！他创造了天和地，又赐给大卫王一个有智慧、具备明辨和悟性的儿子[b]；这儿子将为雅威建造殿宇，也为自己的国度建造宫室[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《列王纪》的平行记载将这个名字写作“希兰”；《历代志》本节所用的希伯来形式是“户兰”。
    reason: alternative_reading
  - marker: b
    text: “具备明辨和悟性”也可译作“有见识、有辨别力”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“为他的王权（或国度）建造一座房屋”；这里可能指王宫或王宫建筑群。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未机械译出连接词 וַ；中文叙事由上下文自然承接，直接用“说”简洁流畅。
- source_word: חוּרָם
  choice: 户兰
  rationale: 按本节《历代志》所用希伯来名字 חוּרָם 音译，不与《列王纪》的 חִירָם 强行统一。
- source_word: בָּרוּךְ יְהוָה
  choice: 雅威……是当受称颂的
  rationale: 保留祝颂公式，并以现代中文自然表达其宣告语气；“雅威”直接音译四字神名。
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: 创造了天和地
  rationale: 准确表达天地受造的整体，并符合中文圣经语体；希伯来语“诸天”的复数形式在汉语中通常自然表达为“天”。
- source_word: בֵּן חָכָם
  choice: 一个有智慧……的儿子
  rationale: חָכָם 的核心义为有智慧；定语结构在中文中清楚自然。
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: 明事理、有悟性
  rationale: 将分词 יוֹדֵעַ 融入中文描述；“明事理”表达 שֵׂכֶל 所含的审慎、良好判断力，“悟性”表达 בִּינָה 的理解与辨别能力，同时保留两个相近而不完全相同的概念。
- source_word: בַּיִת לַיהוָה
  choice: 为雅威建造殿宇
  rationale: בַּיִת 字面为“房屋”，在此明确指献给雅威的圣殿；“殿宇”既保留“殿”的建筑意象，又比单说“房屋”更符合中文语境。
- source_word: וּבַיִת לְמַלְכוּתוֹ
  choice: 为自己的王权建造宫殿
  rationale: 保留 לְמַלְכוּתוֹ 与“他的王权/国度”的关系，同时用“宫殿”说明此处第二座 בַּיִת 属于王室建筑；不把范围过度限定为某一具体建筑群。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 本节直接使用上帝的专名；“雅威”依较通行的学术重构音译，避免用称号替代专名。
- issue: לְמַלְכוּתוֹ 所指为何
  choice: 为自己的王权建造宫殿
  alternative: 为自己的国度建造一座殿宇
  rationale: 该短语可指与所罗门王权相称的王宫或王室建筑，但希伯来语本身是“为他的王权/国度”；正文兼顾语义与中文可读性，脚注保留其可能范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。祝颂句保留经文的礼仪感；两处 בַּיִת 分别译作“殿宇”和“宫殿”，以呈现同词在圣殿与王室建筑两个语境中的自然中文对应。所有脚注标记均置于正文相关词句之后。
