revisions:
- from: 户兰[a]说：“雅威——以色列的上帝是当受称颂的！他创造了天和地，又赐给大卫王一个有智慧、明事理、有悟性的儿子[b]；这儿子将为雅威建造殿宇，也为自己的王权建造宫殿[c]。”
  to: 户兰[a]说：“雅威——以色列的上帝是当受称颂的！他创造了天和地，又赐给大卫王一个有智慧、具备明辨和悟性的儿子[b]；这儿子将为雅威建造殿宇，也为自己的国度建造宫室[c]。”
  rationale: 修订仅处理第二个“房屋”的不当限定及智慧术语的中文表达。正文以“国度”和“宫室”自然表达王室建筑的语境，同时借脚注明确保留原文“王权／国度”和“房屋”的解释空间，未将其断定为单一具体建筑。
