id: 2CH.2.3
reference: 2 Chronicles 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: zh_hans
  text: 看哪，我正在为耶和华[a]我上帝的名建造一座殿，要把殿分别为圣归给他，在他面前焚烧芬芳的香，陈设常供的饼[b]，并在早晚、安息日、朔日和耶和华我们上帝所定的节期献上燔祭。这是以色列永远要遵行的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自希伯来文的上帝之名 יהוה（YHWH）。
    reason: 说明专名的来源，并与称号“主”区别。
  - marker: b
    text: 原文直译为“持续的陈设”；在这里指经常陈设在上帝面前的饼，传统上也称“陈设饼”。原文此处没有明说“饼”。
    reason: 保留原文的字面表达，说明正文按礼仪语境补明“饼”，并提供传统术语。
  - marker: c
    text: 原文也可直译为：“这永远在以色列身上。”意思是这是以色列长久当尽的责任。
    reason: 交代希伯来文末句简练而略显含混的介词结构，以及正文所采用的义务性理解。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是引人注意的话语标记；“看哪”保留了王室宣告的庄重语气，又是现代中文读者熟悉的圣经表达。
- source_word: בֹנֶה
  choice: 正在……建造
  rationale: 分词可表达正在进行或当前筹划中的行动；“正在建造”保留其进行体色彩，不把它明确改成单纯将来时。
- source_word: בַּיִת
  choice: 一座殿
  rationale: 原词通常意为“房屋”，这里明确指敬拜用的圣殿。中文用“殿”自然庄重，同时保留“为耶和华的名建造”的原文结构。
- source_word: לְשֵׁם יְהוָה
  choice: 为耶和华的名
  rationale: 直译这一具有神学意义的表达，不改写为较笼统的“为荣耀耶和华”或“奉耶和华的名”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最广为人知的神名音译，区别于称号“主”。
- source_word: לְהַקְדִּישׁ לוֹ
  choice: 要把殿分别为圣归给他
  rationale: 使役词形表示把某物划分出来成为圣洁、专归上帝；补出“殿”以使中文指代清楚。
- source_word: קְטֹרֶת סַמִּים
  choice: 芬芳的香
  rationale: 既表达特制香料之香气，也保留其礼仪用品“香”的意义。
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: 常常陈设供饼
  rationale: 字面是“经常／持续的陈设”，在圣殿礼仪中所指为持续陈设在上帝面前的饼；译文补明对象，但不采用较生僻的传统术语。
- source_word: עֹלוֹת
  choice: 燔祭
  rationale: 这是整只焚烧献上的祭物；“燔祭”是准确且仍为中文圣经读者通晓的固定术语。
- source_word: לַבֹּקֶר וְלָעֶרֶב
  choice: 在早晚
  rationale: 简洁保留每日早晨和傍晚献祭的规律。
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וּלְמוֹעֲדֵי
  choice: 安息日、朔日和……所定的节期
  rationale: 分别对应每周安息日、月初之日和规定的宗教节期；“朔日”简明准确。
- source_word: לְעוֹלָם זֹאת עַל־יִשְׂרָאֵל
  choice: 这是以色列永远要遵行的
  rationale: 介词 עַל 在这里表达加在以色列身上的持续责任；中文用“要遵行的”传达其义务性。
theological_decisions:
- issue: 如何处理神名 יהוה
  choice: 耶和华
  alternative: 雅威；主
  rationale: 保留专名而不以称号“主”替代；“耶和华”在现代中文普通读者中辨识度最高。
- issue: בַּיִת 译作“殿”还是“房屋”
  choice: 殿
  alternative: 房屋；圣殿
  rationale: 上下文所指明确是敬拜场所。“殿”在中文中自然且不冗赘；同时保留“为……的名建造”这一源文神学表达，而没有把整句释义化。
- issue: מַעֲרֶכֶת תָּמִיד 是否补明“饼”
  choice: 常常陈设供饼
  alternative: 持续的陈设；常设的陈设饼
  rationale: 本节希伯来文没有明说“饼”，但该固定礼仪表达在历代志语境中指持续陈设的饼。正文补明所指以便普通读者理解，并用脚注保留字面形式。
- issue: 末句是否明确为义务
  choice: 这是以色列永远要遵行的
  alternative: 这在以色列中直到永远；这是以色列永远的责任
  rationale: 原文简练且介词结构带有责任落在以色列身上的含义。“要遵行的”自然表达义务，又不进一步界定“永远”的神学范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“分别为圣”“燔祭”“安息日”“朔日”等礼仪词汇因准确且在中文圣经传统中通晓而保留；句法经过适度调整，使一连串敬拜事项在中文中层次清楚。
