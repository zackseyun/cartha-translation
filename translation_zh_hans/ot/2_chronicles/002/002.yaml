  text: וַ/יִּשְׁלַ֣ח שְׁלֹמֹ֔ה אֶל חוּרָ֥ם מֶֽלֶךְ צֹ֖ר לֵ/אמֹ֑ר כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִם דָּוִ֣יד אָבִ֔/י וַ/תִּֽשְׁלַֽח ל֣/וֹ אֲרָזִ֔ים לִ/בְנֽוֹת ל֥/וֹ בַ֖יִת לָ/שֶׁ֥בֶת בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: zh_hans
  text: 于是，所罗门派人去见推罗王户兰[a]，说：“你从前怎样待我父亲大卫，给他送来香柏木，让他建造一座供自己居住的房屋——”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “户兰”是本节希伯来文本所用的名字形式；《列王纪》的平行记载通常采用另一形式，常译作“希兰”。
    reason: 说明名称异形，避免读者误以为是不同人物。
  - marker: b
    text: 原文在这里没有说“也照样待我”，而是让这个尚未说完的比较句接续下一节。
    reason: 说明原文跨节的未完句法，并交代为何没有采用英语咨询文本中的补足语。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 于是……派人去见
  rationale: 连续式叙事动词推进情节；“于是”自然表达先后关系。“派人去见”符合汉语中“差遣到某人那里”的表达。
- source_word: חוּרָם
  choice: 户兰
  rationale: 按本节希伯来文本的名称形式 חוּרָם 音译，以区别《列王纪》中常见的 חִירָם（通常译作“希兰”）。
- source_word: מֶלֶךְ צֹר
  choice: 推罗王
  rationale: 以现代汉语自然表达希伯来语的属格结构“推罗的王”。
- source_word: עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: 你从前怎样待我父亲大卫
  rationale: עשה עם 在此表示“怎样对待、怎样待”；“从前”由所述往事的语境自然体现，不增添具体行动内容。
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: 给他送来香柏木
  rationale: אֲרָזִים 字面为香柏的复数，在建筑语境中指香柏木材；“香柏木”既自然，也避免误解为移栽活树。
- source_word: לִבְנוֹת לוֹ בַיִת לָשֶׁבֶת בּוֹ
  choice: 让他建造一座供自己居住的房屋
  rationale: 保留建造目的及受益者含义；בַיִת 译为较宽泛的“房屋”，不因大卫的王室身份而擅自限定为“宫殿”。
- source_word: כַּאֲשֶׁר
  choice: 怎样
  rationale: 引出比较关系。原文在本节末只陈述比较的前半部分，译文不补出未见于本节希伯来文本的主句。
theological_decisions:
- issue: 本节末比较句的未完结构
  choice: 以破折号保留悬而未决的句法，并让话语接续下文
  alternative: 补译“也照样待我”
  rationale: 所给WLC文本没有对应“也照样待我”的词语。补足虽可使本节独立成句，也符合英语咨询层的处理，但会消除原文跨节延续的结构；故正文保留其张力，并用脚注说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“派人去见”比直译“差遣到”更自然；破折号保留原文句子在节末尚未完成的效果。所有脚注标记均已置于正文对应位置。
