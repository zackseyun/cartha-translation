  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: zh_hans
  text: 现在，请派一个技艺精湛的人给我。他要会用金、银、铜、铁，以及紫色、朱红色[a]和蓝色材料做工，也懂得雕刻图案[b]，好与我在犹大和耶路撒冷的能工巧匠一同工作；这些人是我父亲大卫预备的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朱红色”也可译作“猩红色”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“雕刻雕刻物”，以同根词强调精巧的雕刻工作。
    reason: lexical_alternative
  - marker: c
    text: “预备”也可译作“使……预备妥当”或“使……就绪”；原文动词可指预备或使之准备完成。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 原文含有明确的连接词与时间副词，意为“而现在／现在”；保留“现在”比省略更忠实，也自然承接上下文。
- source_word: אִישׁ חָכָם
  choice: 一个技艺精湛的人
  rationale: 在工匠语境中，חָכָם 指专门技艺而非抽象智慧；此译法保留单数人物，并以现代汉语清楚表达其工艺才能。
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: 会用金、银、铜、铁……做工
  rationale: 介词 בּ 指做工所用或所处理的材料。“用……做工”符合现代汉语工艺语境；נְחֹשֶׁת 可泛指铜或铜合金，此处用较宽泛的“铜”，避免过度限定。
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: 紫色、朱红色和蓝色材料
  rationale: 三个词指昂贵的染色材料或相应颜色，原文未明确说是线、布或纱，因此以“材料”自然统摄而不擅自缩窄。
- source_word: וְיֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: 也懂得雕刻各种图案
  rationale: 希伯来文以同根动词和名词构成强调式表达，直译近似“雕刻雕刻物”。正文用自然汉语表达其雕刻技能，并以脚注保存原文形式。
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: 与我的能工巧匠一同工作
  rationale: 上下文是圣殿工艺协作，חֲכָמִים 指有技能的人；“能工巧匠”自然明确。“我的”在此表达“与我同在／在我这里”，不额外强调严格的隶属关系。
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: 这些人是我父亲大卫预备的
  rationale: 关系从句最自然地回指前面的能工巧匠。הֵכִין 的基本范围包括预备、使就绪；正文保留较宽的“预备”，另在脚注说明语境中可能的“委任”。
theological_decisions:
- issue: 关系从句“我父亲大卫预备的”的先行词
  choice: 理解为前述在犹大和耶路撒冷的能工巧匠
  alternative: 理解为大卫预备了相关事物或安排
  rationale: 语法上最近且数一致的先行对象是 הַחֲכָמִים（能工巧匠），上下文也在谈所罗门已有的工匠；因此正文明确为“这些人”，但不赋予额外神学含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“技艺精湛的人”和“能工巧匠”准确体现工艺语境；材料清单保持简洁，不擅自添加“纱线”或“布匹”。句首保留原文明确出现的“现在”。
