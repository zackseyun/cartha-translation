source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: zh_hans
  text: 我现派一位工匠给你：他是一位出自但的众女子的妇人所生的儿子[a]，父亲是推罗人；他善于用金、银、铜、铁、石、木，以及紫色、蓝色、细麻和朱红色材料[b]制作各样工艺，又能雕刻各样图案，构思交付给他的各种设计，并与你的巧匠和我主大卫——你父亲——的巧匠一同工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一位出自但的众女子的妇人所生的儿子”。这通常表示他的母亲出自但支派。
    reason: cultural_note
  - marker: b
    text: “朱红色材料”也可译作“绯红色材料”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: 他母亲是但的女子
  rationale: 原文直译为“一个出自但众女子之妇人的儿子”。现代汉语若照搬“但的众女子”会生硬；译文保留其母系出身的陈述，并用脚注说明这很可能指母亲属于但支派。
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: 父亲是推罗人
  rationale: צֹרִי 表示来自推罗的人；“推罗人”简洁自然。
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: 善于……制作各样工艺
  rationale: 该结构在此表达工匠的实际技能，而非单纯“知道怎样做”。
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: 用金、银、铜、铁、石、木
  rationale: 介词 ב 标明加工所用的材料；“用”符合现代汉语工艺语境。נְחֹשֶׁת 在此材料清单中译作“铜”。
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: 紫色料、蓝色料、细麻和朱红色料
  rationale: 前三者分别指紫色染料或染色材料、蓝色染料或染色材料及细麻；כַּרְמִיל 是红色染料或染色材料，译作“朱红色料”，同时在脚注保留“绯红色料”的可能译法。
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: 又能雕刻各样图案
  rationale: 保留动词与同根名词所表达的雕刻技艺，同时避免汉语中生硬的“雕刻各样雕刻”。
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת
  choice: 构思……各种设计
  rationale: חשב 在工艺语境中指规划、设计艺术作品；“构思……设计”体现原文同根式强调而保持自然。
- source_word: אֲשֶׁר יִנָּתֶן לוֹ
  choice: 交给他的
  rationale: 原文是非人称被动表达，可指交付给他的任何设计或任务；译文不明说交付者。
- source_word: עִם חֲכָמֶיךָ וְחַכְמֵי אֲדֹנִי דָּוִיד אָבִיךָ
  choice: 与你的巧匠和我主大卫——你父亲——的巧匠一同工作
  rationale: חכמים 在工艺上下文中是有技艺的人，故译“巧匠”；אֲדֹנִי 是对人的宫廷敬称，译“我主”，不是神名。末尾补出“一同工作”，使原文省略式在汉语中完整。
theological_decisions:
- issue: אֲדֹנִי 的宫廷称谓
  choice: 我主大卫
  alternative: 我的主人、大卫我主
  rationale: 此处称呼的是大卫，显然为对人的尊称；“我主”保留宫廷语体，也不将其误作神圣称号。
- issue: חֲכָמֶיךָ／חַכְמֵי 的人员称谓
  choice: 巧匠
  alternative: 智慧人、能工巧匠
  rationale: 虽然词形为阳性复数且基本义与“智慧”相关，但上下文明确谈工艺技能；“巧匠”准确传达所指，不额外断定更窄的工种。
- issue: אֲשֶׁר יִנָּתֶן לוֹ 的修饰关系
  choice: 构思交给他的各种设计
  alternative: 完成交给他的任何任务
  rationale: 关系从句在句法上紧接“各种构思／设计”，译文据此连接，但不排除它在意义上涵盖所交付的工艺任务。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。材料清单保持并列节奏；用“色料”避免把古代颜色词武断限定为染料、纱线或成品布。破折号标明“你父亲”是对大卫的同位说明。
