revisions:
- from: 他母亲是但的女子[a]，父亲是推罗人。他善于用金、银、铜、铁、石、木，以及紫色料、蓝色料、细麻和朱红色料[b]制作各样工艺；又能雕刻各样图案，构思交给他的各种设计。他可以与你的巧匠和我主大卫——你父亲——的巧匠一同工作。
  to: 我现派一位工匠给你：他是一位出自但的众女子的妇人所生的儿子[a]，父亲是推罗人；他善于用金、银、铜、铁、石、木，以及紫色、蓝色、细麻和朱红色材料[b]制作各样工艺，又能雕刻各样图案，构思交付给他的各种设计，并与你的巧匠和我主大卫——你父亲——的巧匠一同工作。
  rationale: 修订以“他是一位……妇人所生的儿子”保留原文的系谱措辞，同时借脚注说明“但的众女子”的通常含义，避免将其正文直接解释为“但支派”。删除无来源的“可以”，使末尾的“与”明确为合作关系；并调整材料类别和设计短语，使现代普通话更自然而不缩窄古代工艺材料的含义。
