base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: zh_hans
  text: 现在，我已派出一位有智慧、善于明辨的人——户兰·亚比。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“户兰·亚比”。最后一个词字面意思是“我的父亲”，但在这里很可能是尊称，或是这位工匠称谓的一部分；另参历代志下4:16中类似的“户兰，他的父亲”这一难解表达。
    reason: 说明该希伯来称谓的歧义，保留其可指“父亲”、尊称或姓名／称谓组成部分的可能性，并提示4:16的相关平行表达。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出王回应中的下一步行动；现代汉语用“现在”即可自然表达希伯来语连接词与时间副词的推进作用。
- source_word: שָׁלַחְתִּי
  choice: 我已经派来
  rationale: 完成式在此表示已经作出、并与当前情势相关的派遣；“已经派来”也符合说话者从收信方角度描述人员到来的汉语习惯。
- source_word: אִישׁ חָכָם
  choice: 一位有智慧……的人
  rationale: אִישׁ指一名男性个体；חָכָם基本义为“有智慧”，在工艺语境中也含有娴熟能干之意。译文保留“智慧”，由下文进一步说明其才干。
- source_word: יוֹדֵעַ בִּינָה
  choice: 通达事理
  rationale: 字面为“懂得理解力／明辨”，兼有认知、判断和实践能力。“通达事理”在现代汉语中自然，并保留其广于单纯技术熟练的含义。
- source_word: לְחוּרָם אָבִי
  choice: 就是户兰·亚比
  rationale: 这一表达语义困难。结合上下文，它用于指认所派来的工匠；将חוּרָם אָבִי音译为“户兰·亚比”，避免在正文中武断地解释为生父或特定官职，同时用“就是”自然呈现其同位指认功能。
theological_decisions:
- issue: אָבִי在“户兰·亚比”这一称谓中的含义
  choice: 在正文中将其作为工匠的姓名或称号的一部分音译为“亚比”
  alternative: 译作“我的父亲”或“我的工匠师傅”
  rationale: אָבִי字面可指“我的父亲”，但“父亲”也可作为对师傅、顾问或尊贵人物的敬称。此处不大可能意在说明生物学亲属关系，而具体荣衔又无法确定，因此音译并以脚注交代歧义，较能保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有智慧、通达事理”保留原文两个相邻表达，而不把它们缩减为单一的“技艺高超”；专名以间隔号显示复合称谓，并在脚注中说明其难解之处。
