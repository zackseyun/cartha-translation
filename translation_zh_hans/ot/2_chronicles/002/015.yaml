  text: וַ֠/אֲנַחְנוּ נִכְרֹ֨ת עֵצִ֤ים מִן הַ/לְּבָנוֹן֙ כְּ/כָל צָרְכֶּ֔/ךָ וּ/נְבִיאֵ֥/ם לְ/ךָ֛ רַפְסֹד֖וֹת עַל יָ֣ם יָפ֑וֹ וְ/אַתָּ֛ה תַּעֲלֶ֥ה אֹתָ֖/ם יְרוּשָׁלִָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: zh_hans
  text: 我们必照你所需要的，从黎巴嫩砍伐木材，把木材扎成筏子，经海路运到约帕[a]；你再把木材运上耶路撒冷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约帕是海港，后来称为雅法。
    reason: cultural_note
  - marker: b
    text: 原文作“运上耶路撒冷”；“上”反映耶路撒冷地势较高。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרֹת
  choice: 砍伐
  rationale: כרת 的 Qal 未完成式第一人称复数在树木语境中表示砍下、伐取；“砍伐”符合现代汉语的林木与建材语境。
- source_word: עֵצִים
  choice: 木材
  rationale: 这里所说的是供建造并运输的木料，不仅指仍在生长的“树木”；“木材”准确而自然。
- source_word: מִן הַלְּבָנוֹן
  choice: 从黎巴嫩
  rationale: 该短语指从黎巴嫩这一著名林区取得木材；按现代汉语地名习惯译作“黎巴嫩”。
- source_word: כְּכָל צָרְכֶּךָ
  choice: 照你所需要的
  rationale: 表达木材数量依照对方全部需求而定；此译自然，也不额外限定需求的种类或数量。
- source_word: וּנְבִיאֵם לְךָ
  choice: 把木材……运到
  rationale: 动词表示带来、送达；复数宾语后缀指前述木料。汉语以“木材”回指，并用“运到”体现运输语境。
- source_word: רַפְסֹדוֹת
  choice: 扎成筏子
  rationale: 该词指为水运而连接成排、可漂浮的木料。“扎成筏子”清楚说明木材本身组成运输用的木筏，同时保留“作为筏子/成筏运输”的语义。
- source_word: עַל יָם יָפוֹ
  choice: 经海路运到约帕
  rationale: 原文简略地表达木筏在海上运往约帕；“经海路运到”在现代汉语中清楚呈现运输方式与目的地。
- source_word: יָפוֹ
  choice: 约帕
  rationale: 采用现代中文圣经语境中通行的古地名译法。
- source_word: תַּעֲלֶה אֹתָם
  choice: 把木材运上
  rationale: עלה 在使役性语境中表示带上去、运上去；“运上”既符合木材运输，也保留前往地势较高之处的方向含义。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文通行的圣经地名译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我们必……；你再……”保留双方分工及未完成式在此承诺语境中的将来意味。将英文咨询层中错置的脚注标记按其实际所指重新安放：约帕说明置于“约帕”之后，地势与方向说明置于“运上耶路撒冷”之后。
