revisions:
- from: 可是，谁有能力为他建造殿宇呢？[a] 天和天上的天尚且容不下他。我又算什么，竟能为他建造殿宇呢？不过是在他面前烧香罢了。[b]
  to: 但谁有能力为他建造房屋呢？天和天上的天[a]尚且容不下他；我又算什么，竟能为他建造房屋呢？这房屋不过是为了在他面前烧香罢了。[b]
  rationale: 修订以“房屋”对应בַּיִת，避免将其直接定为“殿宇”。“天和天上的天”及“容不下”保留原文强调神超越诸天的修辞。末句补出中文所需的指代“这房屋”，使“不过是为了”明确限定建造的目的；这只是展开原文省略的逻辑关系，并未增添神学含义。脚注a移至其实际解释的短语之后；脚注b保留动词可涵盖焚烧祭物的词义范围。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:56:42Z'
