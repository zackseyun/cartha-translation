source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: zh_hans
  text: 但谁有能力为他建造房屋呢？天和天上的天[a]尚且容不下他；我又算什么，竟能为他建造房屋呢？这房屋不过是为了在他面前烧香罢了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的天”是希伯来语的强调表达，指最高的诸天。
    reason: lexical_alternative
  - marker: b
    text: “烧香”也可较广义地译作“使祭物焚烧升烟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: 有能力
  rationale: 该短语表示具备足够的力量或能力完成某事；“有能力”自然清楚，也保留反问所强调的人的不足。
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: 为他建造殿宇
  rationale: בַיִת本义为“房屋”，此处明确指献给上帝、用于敬拜的建筑；“殿宇”既符合上下文，又不像“圣殿”那样过度专名化。
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: 天和天上的天
  rationale: 保留希伯来语两部分的强化表达及其庄重感，不把其含义完全化约为“最高的天”。
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: 尚且容不下他
  rationale: 该动词在此表示无法容纳；“容不下”是自然的现代汉语，“尚且”突显连诸天也不足以容纳上帝。
- source_word: וּמִי אֲנִי
  choice: 我又算什么
  rationale: 用自然汉语表达说话者在上帝伟大面前的自谦和反问语气。
- source_word: אֲשֶׁר אֶבְנֶה לוֹ בַיִת
  choice: 竟能为他建造殿宇
  rationale: “竟能”承接“我又算什么”，表达资格与能力上的不配，而非单纯将来时。
- source_word: כִּי אִם
  choice: 不过……罢了
  rationale: 此结构在这里限定殿宇的用途；该译法清楚表明殿宇不是用来容纳上帝，只是用于在他面前献祭敬拜。
- source_word: לְהַקְטִיר לְפָנָיו
  choice: 在他面前烧香
  rationale: הקטיר可泛指使祭物焚烧升烟，也常用于烧香；正文采用合乎圣殿语境的“烧香”，并以脚注保留较宽的词义。
theological_decisions:
- issue: 上帝的超越性与殿宇作为其居所之间的张力
  choice: 明确译出诸天也容不下上帝，并把殿宇的作用限定为在他面前烧香敬拜。
  alternative: 将殿宇理解为能在空间意义上容纳上帝的住所。
  rationale: “天和天上的天尚且容不下他”控制全句含义；末句并未否定殿宇与上帝的特殊关系，却说明建殿不是为了把上帝局限其中。
- issue: הקטיר所指礼仪行为的范围
  choice: 正文译作“烧香”。
  alternative: 译作“焚烧祭物献给他”或“使祭物升烟”。
  rationale: 无明示宾语时，该词在圣殿语境中可以指烧香，但其希伯来语词义也可能较广，因此用脚注保存这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿宇”既保留בַיִת的建筑意象，也使圣殿语境清楚；两个连续反问保持原文的修辞力度。所有脚注标记均已置于正文相应位置。
