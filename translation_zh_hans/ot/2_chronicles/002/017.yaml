base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: zh_hans
  text: 他从他们中选派七万人搬运重物，八万人在山中凿石[a]，又选派三千六百人督工，使百姓做工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在山中（的）凿者”或“在山区开凿的人”；所凿的对象没有明说，按建殿的上下文可理解为石料。也可译作“在山里采石”。
    reason: 说明原文以分词称呼开凿者，且所凿对象在原文中省略，并保留“凿石”与“采石”之间的词义选择。
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: 他从他们中选派
  rationale: 这里的“从他们中作成”是从一群人中任用、安排人员的表达；译作“从他们中选派”既体现来源范围，也符合现代汉语用法。
- source_word: סַבָּל
  choice: 搬运重物
  rationale: 该词指承担、搬运重物的人。汉语用“七万人搬运重物”简洁自然，也比泛称“劳工”更准确。
- source_word: חֹצֵב בָּהָר
  choice: 在山中凿石
  rationale: חצב 表示凿、砍或开采；原文没有明说所凿的对象，但建殿语境表明是石料。“在山中凿石”清楚传达语境中的意义，同时以脚注说明原文的省略。
- source_word: מְנַצְּחִים
  choice: 督工
  rationale: 在劳役管理语境中，该分词指负责监督、指挥工作的人；“督工”庄重而简明。
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: 使百姓做工
  rationale: 使役形态表达“使……工作、服劳役”。此译保留使役力度，不额外判断工作是否出于强迫。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文是一般性的“民、百姓”；虽然上下文中他们构成劳动力，译文不将其窄化为“工人”。
theological_decisions: []
