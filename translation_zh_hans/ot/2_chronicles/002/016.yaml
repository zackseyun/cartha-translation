base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: zh_hans
  text: 所罗门在他父亲大卫数点他们之后，数点了所有寄居在以色列地的外族人[a]；结果共有十五万三千六百人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寄居者”或“外来居民”。希伯来语这个词指居住在以色列境内的非以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: 数点了
  rationale: 该动词在这里指清点、统计人数。“数点”既贴近原文，也符合庄重而易懂的现代汉语叙事用语。
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: 寄居的外族人
  rationale: גֵּרִים 指居住在以色列境内、并非本地以色列人的群体，不只是短暂停留的旅客。“寄居的外族人”兼顾其居留状态与外来身份。
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: 以色列地
  rationale: 保留 אֶרֶץ 的地域含义，比单译“以色列”更贴近原文。
- source_word: אַחֲרֵי הַסְּפָר
  choice: 这是在……数点……以后进行的
  rationale: 原短语可表达时间上的“在……以后”，也可能暗含依据先前统计的意思。正文采用直接的时间关系，同时避免添加原文未明说的“人口普查记录”。
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: 他父亲大卫数点他们
  rationale: 直译重复 ספר 的“数点”，清楚保留大卫先前统计这些人的信息。
- source_word: וַיִּמָּצְאוּ
  choice: 结果共有
  rationale: 该被动形式引出清点所得的总数。“结果共有”以自然汉语表达统计后发现的数量，同时保留结果意味。
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 十五万三千六百人
  rationale: 准确合计为153,600；用汉字数字并补出量词“人”，适合中文经文行文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“寄居的外族人”比单用传统术语“寄居者”更直观，也避免“外侨”等现代行政色彩过强的称谓。分号使先前数点与本次数点结果之间的关系清楚。
