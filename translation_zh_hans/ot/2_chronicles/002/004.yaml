  text: וְ/הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֑וֹל כִּֽי גָד֥וֹל אֱלֹהֵ֖י/נוּ מִ/כָּל הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/004.yaml
  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: zh_hans
  text: 而且，我正在建造的殿宇十分宏大[a]，因为我们的神比众神都伟大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文直译为“房屋”，在这里指神的殿。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们的神在众神之上为大。”原文以“大”与“超过所有神”的搭配表达比较。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  choice: 殿宇
  rationale: בַּיִת直译为“房屋”，但在此明确指为神建造的圣所；“殿宇”既符合现代汉语语境，也保留庄重语体。直译在脚注中说明。句首וְ承接上文，在独立呈现本节时不必机械译作“并且”。
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: 我所建造的
  rationale: 关系结构自然译为“我所……的”；分词בוֹנֶה表示正在进行或已经着手的建造工程，“所建造的”在汉语中可自然涵盖这一语境。
- source_word: גָּדוֹל
  choice: 宏大
  rationale: 用于殿宇时，גָּדוֹל兼有规模大和地位显著之意；“宏大”比单纯的“大”更能兼顾这两层含义，又不额外加入“华美”等原文未明说的概念。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出殿宇必须宏大的理由，现代汉语用“因为”表达最清楚自然。
- source_word: גָדוֹל אֱלֹהֵינוּ מִכָּל הָאֱלֹהִים
  choice: 我们的神比众神都伟大
  rationale: 形容词גָדוֹל虽无比较级形态，但与מִן构成明确比较；汉语以“比……都伟大”自然表达。אֱלֹהִים在比较对象中译作“众神”，不预先界定其本体身份。
theological_decisions:
- issue: 如何表达以色列的神与其他神明之间的比较
  choice: 我们的神比众神都伟大
  alternative: 我们的神在众神之上为大
  rationale: 原文作出直接比较，却未在本节解释“众神”是偶像、虚假神明还是天上存在。译文保留“众神”这一开放称谓，不以神学解释替代原文；同时采用现代汉语清楚的比较句式。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“殿宇”符合圣殿语境，“宏大”与“伟大”分别适配建筑和神，同时呼应原文两次使用גָדוֹל。保留“众神”的神学张力，不在正文中解释其性质。
