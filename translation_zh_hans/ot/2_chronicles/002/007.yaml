base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: zh_hans
  text: 请从黎巴嫩给我送来香柏木、柏木[a]和阿尔古木[b]，因为我知道你的仆人懂得砍伐黎巴嫩的树木。看哪，我的仆人将同你的仆人在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏木”所译的希伯来词是 beroshim；也可能指刺柏或冷杉，确切树种不详。
    reason: lexical_alternative
  - marker: b
    text: “阿尔古木”是音译，也可音译作“阿尔穆木”；有人认为是檀香木，但确切树种不详。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: 请……给我运来
  rationale: שׁלח是命令式；结合木材运输的语境译为“运来”比单纯“送来”更具体自然。前缀连接词不必机械译作“并且”，以免中文突兀。
- source_word: עֲצֵי אֲרָזִים
  choice: 香柏木
  rationale: 指供建筑使用的香柏木材；“香柏木”是现代中文圣经语境中清楚而稳妥的名称。
- source_word: בְּרוֹשִׁים
  choice: 柏木
  rationale: 该树种的确切鉴定存在争议；正文采用通行的“柏木”，并以脚注保留其他可能。
- source_word: אַלְגּוּמִּים
  choice: 阿尔古木
  rationale: 树种无法确定，因此按希伯来词音译，不武断采用“檀香木”等推测性名称。
- source_word: מֵהַלְּבָנוֹן
  choice: 从黎巴嫩
  rationale: 忠实表达木材来源地，并符合现代汉语地名用法。
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: 因为我知道
  rationale: 完成式在此表达当前已经具备的认识，中文用“知道”自然准确。
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים לִכְרוֹת
  choice: 你的仆人懂得砍伐
  rationale: יֹדְעִים加不定式表示“知道怎样做、懂得做”；“懂得砍伐”简洁地传达技能含义。
- source_word: עֲצֵי לְבָנוֹן
  choice: 黎巴嫩的树木
  rationale: 这里直接指在黎巴嫩砍伐的树木；保留“树木”可避免在尚未砍伐时预先称为木材。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意下文安排的语用力量，同时维持庄重的经文语体。
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: 我的仆人会同你的仆人在一起
  rationale: 原文是无显式系词的名词句；请求语境指向将来的协作安排，因此补出“会”，但不额外添加原文未明说的具体工作内容。
theological_decisions: []
