base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: zh_hans
  text: 现在，请我主把小麦、大麦、油[b]和酒，就是他所说的[a]那些，送给他的仆人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他所说的”；原文并不要求理解为“他所应许的”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“油”在供应物资的语境中可能特指橄榄油。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语转换标记，引出随后的实际请求；现代汉语用“现在”即可自然承载连接和转折推进的作用。
- source_word: הַחִטִּים וְהַשְּׂעֹרִים
  choice: 小麦、大麦
  rationale: 准确表达两种粮食；汉语列举物资时通常不另行表达希伯来语定冠词。
- source_word: הַשֶּׁמֶן
  choice: 油
  rationale: 原词泛指油；本处按供应物资的语境很可能是橄榄油，但正文不作超出原文的限定。
- source_word: וְהַיַּיִן
  choice: 和酒
  rationale: 直接表达所列供应品，并以“和”自然连接清单末项。
- source_word: אֲשֶׁר אָמַר
  choice: 他所说的
  rationale: 表达这些物资是对方先前提到的，不将普通的“说”强化为“应许”。
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是户兰对所罗门的宫廷敬称，并非神圣称号；“我主”保留尊敬而不过度解释为所有权关系。
- source_word: יִשְׁלַח
  choice: 请……送
  rationale: 该未完成式在语境中具有祈使或请求意味；现代汉语用“请”清楚而得体。
- source_word: לַעֲבָדָיו
  choice: 给他的仆人
  rationale: 直接保留介词和名词的意义；语境指户兰手下的仆人或工人，而代词“他的”依语法回指“我主”。
theological_decisions:
- issue: לַעֲבָדָיו 中第三人称代词的指向
  choice: 他的仆人
  alternative: 我的仆人／工人
  rationale: 希伯来正文明确为第三人称阳性单数后缀，形式上回指“我主”；尽管上下文可能使读者期待户兰的工人，正文保留原文措辞，不以语境推断改写代词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“请我主……”保留宫廷通信中的敬意；物资清单按自然汉语排列。所有脚注标记均置于其所说明的词语之后。
