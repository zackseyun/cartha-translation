base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: zh_hans
  text: 泰尔王户兰写信给所罗门，回答说：“因为耶和华爱他的子民，所以立你作他们的王。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为耶和华爱他的子民”，也可译作“出于耶和华对他子民的爱”。
    reason: 保留 בְּאַהֲבַת 的名词式表达与因果式表达之间的翻译选择。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 回答说
  rationale: 连词加未完成式推动叙事；结合上文所罗门的请求，此处是户兰作出答复。“回答说”既符合语境，也保留“说”的表达。
- source_word: חוּרָם
  choice: 户兰
  rationale: 按本节希伯来文 חוּרָם 音译；中文圣经传统通常译作“户兰”。
- source_word: מֶלֶךְ צֹר
  choice: 泰尔王
  rationale: 该结构表示户兰是泰尔的王；“泰尔王”是自然简洁的现代汉语。
- source_word: בִּכְתָב וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: 写信给所罗门
  rationale: 原文直译为“以书面形式，并送给所罗门”。合译为“写信给所罗门”自然地表达书面答复及寄送对象，未增加实质内容。
- source_word: בְּאַהֲבַת יְהוָה אֶת עַמּוֹ
  choice: 因为耶和华爱他的子民
  rationale: 介词 בְּ 加抽象名词在此可表示原因；将名词结构转为动词句，清楚表达耶和华对其子民的爱是立王的原因。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中辨识度最高的神名传统音译，保留专名性质，不以称号“主”替代。
- source_word: נְתָנְךָ
  choice: 立你
  rationale: נתן 字面为“给”，但与君王职分连用时表示任命、设立；“立你”准确而庄重。
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: 作他们的王
  rationale: על 表示统治对象；中文“作他们的王”自然表达“在他们之上为王”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留专名，并采用普通中文读者最熟悉的传统形式“耶和华”；“雅威”是更贴近现代学界拟音的可选形式，但两者均非以“主”替代原名。
- issue: 耶和华的爱与所罗门作王之间的关系
  choice: 明确译为因果关系：“因为……所以……”
  alternative: “出于耶和华对他子民的爱”
  rationale: בְּאַהֲבַת 在本句中自然表示原因；两种译法神学含义一致，正文用因果句使现代汉语更清楚。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“写信给所罗门，回答说”避免逐词直译造成的生硬重复，同时保留书面答复、寄送对象和发言引语三项信息。
