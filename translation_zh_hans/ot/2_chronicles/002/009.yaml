base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: zh_hans
  text: 看哪，我已经把两万柯珥[b]加工过的小麦[a]、两万柯珥大麦、两万罢特[c]酒和两万罢特油给了你的仆人，就是那些伐木、砍伐树木的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “加工过的小麦”：原文用语少见，也可能指供作食物的小麦或压碎的小麦。
    reason: lexical_alternative
  - marker: b
    text: “柯珥”是古代的干量单位。
    reason: cultural_note
  - marker: c
    text: “罢特”是古代的液量单位。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 提请注意的语篇作用；中文省去机械对应连接词的“和”，使书信语气自然而庄重。
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: 给那些伐木的人，就是砍伐树木的人
  rationale: 保留原文两个近义分词短语的同位说明关系，不将其压缩为单一称谓；“树木”直译 הָעֵצִים。
- source_word: נָתַתִּי
  choice: 我已经……预备了
  rationale: 完成式在书信语境中可表达已经作出的供应安排；结合物资清单译为“预备了”比字面“给了”更符合现代汉语，同时由“交给”体现给予关系。
- source_word: חִטִּים מַכּוֹת
  choice: 打制的小麦
  rationale: מַכּוֹת 语义不寻常，可能指经捶打或加工、供食用的小麦。“打制”保留加工方式上的模糊性，避免过度确定为磨碎。
- source_word: לַעֲבָדֶיךָ
  choice: 交给你的仆人
  rationale: 保留 עֲבָדִים 的基本含义“仆人”，并用“交给”自然表达介词 ל 与给予动词之间的关系。
- source_word: כֹּרִים
  choice: 柯珥
  rationale: 音译古代干量单位，不以不确定的现代容量换算代替原文。
- source_word: בַּתִּים
  choice: 罢特
  rationale: 音译古代液量单位，避免与现代单位混淆。
- source_word: יַיִן
  choice: 酒
  rationale: 自然对应 יַיִן；上下文没有理由进一步限定酒的类别。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原文只说“油”；虽很可能指橄榄油，正文不增添未明说的限定。
- source_word: עֶשְׂרִים אֶלֶף
  choice: 两万
  rationale: 逐项准确保留原文数目。
