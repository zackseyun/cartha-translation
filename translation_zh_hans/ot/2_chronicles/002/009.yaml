revisions:
- from: 看哪，我已经给那些伐木的人，就是砍伐树木的人，预备了两万柯珥打制的小麦[a]、两万柯珥大麦、两万罢特酒和两万罢特油，交给你的仆人。[b][c]
  to: 看哪，我已经把两万柯珥[b]加工过的小麦[a]、两万柯珥大麦、两万罢特[c]酒和两万罢特油给了你的仆人，就是那些伐木、砍伐树木的人。
  rationale: 修订恢复原文的受益对象：这些“仆人”就是伐木、砍树的工人。将物资清单前置后以同位语说明其身份，符合现代汉语，并保留原文两个近义伐木称谓。以“加工过的小麦”处理罕见词组，同时在脚注中保存合理的词义可能性；量器脚注移至对应术语后。
