  text: וַ/יִּסְפֹּ֨ר שְׁלֹמֹ֜ה שִׁבְעִ֥ים אֶ֨לֶף֙ אִ֣ישׁ סַבָּ֔ל וּ/שְׁמוֹנִ֥ים אֶ֛לֶף אִ֖ישׁ חֹצֵ֣ב בָּ/הָ֑ר וּ/מְנַצְּחִ֣ים עֲלֵי/הֶ֔ם שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: zh_hans
  text: 所罗门数点了七万名搬运工、八万名在山区凿石的工人[a]，以及三千六百名监督他们的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在山区凿石的工人”或译“山中的开凿工”；希伯来文直译“在山中凿的人”。
    reason: 原文חֹצֵב未明说所凿的对象，בָּהָר也可理解为“在山中”；正文依据建筑劳役语境补出“石”，脚注保留原文的简略和词义空间。
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: 数点了
  rationale: ספר在叙事形式中意为数算、清点；“数点”既准确表达统计人数，也保持庄重而易懂的叙事语体。
- source_word: אִישׁ סַבָּל
  choice: 搬运工
  rationale: סַבָּל指负重、搬运的人；“搬运工”比直译“负重者”更符合现代汉语，同时清楚标明其劳役类别。上下文中的人数词已经自然表达אִישׁ所指的男性劳工群体，无须逐字译出“人”。
- source_word: חֹצֵב בָּהָר
  choice: 在山区凿石的工人
  rationale: חצב意为凿、砍或开采；在圣殿建筑劳役的语境中，所凿之物自然是石材。“在山区”对应בָּהָר，同时脚注保留原文未明说宾语的表达。
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: 监督他们的人
  rationale: נצח的分词在此行政劳役语境中指负责督导者；“监督他们的人”既传达职能，也保留עֲלֵיהֶם“在他们之上、管理他们”的关系。
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 三千六百名
  rationale: 按现代汉语习惯直接表达这一基数，并以量词“名”衔接人员类别。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且通顺的叙事语言。“搬运工”“在山区凿石的工人”“监督他们的人”清楚区分三类劳役人员；并列结构紧贴希伯来文次序，不额外加入“派遣”等原文未明说的动作。
