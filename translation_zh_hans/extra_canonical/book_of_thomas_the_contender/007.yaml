base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/007.yaml
  text: '“Blessed are you who know beforehand what can trip you up and who flee from strange things.

    Blessed are you who are insulted and disrespected because of the love their Lord shows them.

    Blessed are you who weep and are persecuted by those who are without hope, because you will be freed from every captivity.


    “Watch and pray that you may avoid living in the flesh and instead depart from the bitter captivity of this life. When you pray, you will find rest because you have abandoned suffering and shame. For when you depart from bodily sufferings and appetites, you will receive rest from the Good One, and you will reign with the King, you and he united with one another, from now on, forever and ever. Amen.”


    The Book of Thomas

    The Contender

    Writing to the Mature


    Remember me too, my brothers,

    [in] your prayers:

    Peace be to the saints

    and to those of the spirit.'
translation:
  language: zh_hans
  text: '“你们有福了！你们预先知道什么会使自己绊倒，并且逃避陌生之事。


    你们有福了！你们因他们的主向他们显出的爱而受辱、不被尊重。[a]


    你们有福了！你们哀哭，又受那些没有盼望之人的迫害，因为你们必从一切囚禁中得释放。


    “要警醒祷告，使你们不至于活在肉身之中，反而能脱离今生苦涩的囚禁。你们祷告时，必寻得安息，因为你们已经离弃痛苦和羞耻。因为当你们脱离肉身的苦楚和欲望时，就必从那良善者得着安息，并要与那王一同掌权；你们与他彼此联合，从今以后，直到永永远远。阿们。”


    《多马书》


    争战者


    写给成熟的人


    弟兄们，也请在你们的祷告中记念我：


    愿平安临到众圣徒，

    也临到属灵的人。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句现有英语见证中的代词关系并不清楚；也可能有其他理解。科普特语原文仍待复核。
    reason: 提示真实的句法与指代歧义，避免中文译文造成虚假的确定性。
  - marker: b
    text: “属灵的人”也可理解为“属于灵的人”或“灵性的众者”；具体所指仍不确定。
    reason: 保留结语中群体身份和本体含义的开放性。
lexical_decisions:
- source_word: knowledge beforehand
  choice: 预先知道
  rationale: 现有材料只有公共领域英语见证，尚未完成科普特语复核；此处按见证保留认知性的“预先知道”，不译作身体性的“同行”。
- source_word: strange things
  choice: 陌生之事
  rationale: 保留原见证较含混的表达，不擅自具体化为异端、罪恶或外来事物。
- source_word: existing/living in the flesh
  choice: 活在肉身之中
  rationale: 既保留该文献中肉身与安息之间的张力，也避免直接套用后世宗派化术语。
- source_word: the Good One
  choice: 那良善者
  rationale: 保留带称号意味的单数人格性表达，不武断认定其具体所指。
- source_word: the Mature
  choice: 成熟的人
  rationale: 采用普通现代汉语，同时保留可能具有群体或灵性层面含义的开放性。
- source_word: the Contender
  choice: 争战者
  rationale: 表达奋力争竞、抗争之意；不将其缩窄为一般的“对手”。
theological_decisions:
- issue: 因主之爱而受辱一句中的代词指向
  choice: 保留“他们的主向他们显出的爱”
  alternative: 译作“因你们的主爱你们”或“因你们爱主”
  rationale: 英语见证本身代词关系突兀，且科普特语复核尚待进行；不应静默消除文本歧义。
- issue: 脱离肉身的陈述
  choice: 按文献表面措辞译为“不至于活在肉身之中”及“脱离肉身的苦楚和欲望”
  alternative: 弱化为“不随从肉体”或解释成单纯道德禁欲
  rationale: 保留该文献真实的神学张力，不以正典或宗派框架替它重述。
- issue: “属灵的人”的身份
  choice: 译作“属灵的人”并加注说明歧义
  alternative: 译作“灵界众者”或“有圣灵的人”
  rationale: 现有见证不足以确定是人的属灵身份、灵性群体，还是灵体存在。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；祝福句用“你们有福了”形成节奏。正文仅收录作品文本，不纳入网页联系方式、商业声明和现代编者附注。由于科普特语源文审查尚待完成，本稿明确以所给公共领域英语见证为临时证据基础，并在关键歧义处保持克制。
