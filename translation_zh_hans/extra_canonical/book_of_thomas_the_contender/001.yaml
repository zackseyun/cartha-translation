  text: '[] The secret sayings that the Savior spoke to Judas Thomas, which I—yes, I, Mathaias—wrote down as I walked along, listening to them speak with one another.'
translation:
  language: zh_hans
  text: '[] 救主对犹大·多马所说的隐秘话语，是我——正是我，马提亚——在边走边听他们彼此交谈时记录下来的。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文暂据所提供的公版英文见证译出；科普特语原文尚待直接核校。开头的“[]”表示见证文本此处可能有缺损或编辑标记，故予保留。
    reason: 明确当前底本限制，并解释正文开头无法由现有资料进一步判定的方括号。
lexical_decisions:
- source_word: secret sayings
  choice: 隐秘话语
  rationale: 既保留这些话语不公开、隐而未显的性质，又避免把它限定为某种后世宗教术语。
- source_word: Savior
  choice: 救主
  rationale: 采用自然、庄重且通行的中文称谓。
- source_word: Judas Thomas
  choice: 犹大·多马
  rationale: 保留双名结构，不把“多马”解释性改译为“双生子”，以免在缺乏科普特语核验时过度阐释。
- source_word: Mathaias
  choice: 马提亚
  rationale: 按该专名的常见中文形式音译，同时不擅自等同于其他拼写相近的人物。
- source_word: wrote down
  choice: 记录下来
  rationale: 比单纯“写下”更自然，并准确表达将所听内容付诸文字。
- source_word: while I was walking, listening to them speak with one another
  choice: 在边走边听他们彼此交谈时
  rationale: 保留行走、聆听以及双方彼此交谈三个要素，也维持叙述者作为随行听者的画面。
theological_decisions:
- issue: “隐秘话语”的性质
  choice: 不说明其为何隐秘，也不将其解释为秘传教义
  alternative: 译作“秘密教训”或“奥秘启示”
  rationale: 现有英文见证只支持“secret sayings”；进一步界定会消除原文可能保留的含混。
- issue: 犹大与多马的关系
  choice: 作为一个人的双名“犹大·多马”处理
  alternative: 译成“犹大，多马”或解释为“犹大双生子”
  rationale: 英文见证将其作为 Judas Thomas；双名译法最少增添解释，也符合该文献人物称呼的常见理解。
- issue: 叙述者的强调语气
  choice: 保留“是我——正是我”
  alternative: 简化为“我马提亚”
  rationale: 见证中的“yes I”具有显著自我强调，可能涉及作者身份或见证权威，不宜删去。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“边走边听”保留原句的现场感；破折号突出叙述者反复自称的强调。因科普特语复核尚未完成，未对双名、标题性用语或开头缺损作超出英文见证的重构。
