review_pass:
  verdict: revise
  source_fidelity: 需修订若干影响原文对应的细节：animals 不应强化为“野兽”；“cover themselves in dark graves”应保留“遮蔽自己”而非“藏起来”；末段“he”指受罚者，中文应避免误指高处的统治者。残缺符号也应更逐项保留，尤其是原文的空方括号“[]”。其余关键歧义，如“甜美的火”、高处统治者的身份及塔耳塔鲁科斯的句法位置，宜继续不作教义化解释。
  naturalness: 原稿整体庄重、通顺，问答体和审判意象的节奏处理良好。个别句子可更自然且更精确，如“在幽暗的坟墓中遮蔽自己”、“冥府那坚定不移的[沉重苦毒]”；“那人必不能转身或移动”可消除代词歧义。
  terminology: “救主”“深渊”“塔耳塔罗斯”“冥府”“审判之日”均可保留。“animals”建议统一译为“动物”，不凭上下文改作语义更强的“野兽”。“塔耳塔鲁科斯”保留音译及不确定性说明是恰当的。
  issues:
  - severity: medium
    issue: “animals”译为“野兽”
    rationale: 英语见证两次均为 animals，虽上下文有贬抑和互相吞吃的比喻，却未限定为野兽；译作“动物”更忠实地保留原词范围。
  - severity: medium
    issue: “they will cover themselves in dark graves”译为“把自己藏在幽暗的坟墓里”
    rationale: “cover themselves”是遮盖／遮蔽自己的动作；“藏在”加入进入、躲藏的空间动作。应改为“在幽暗的坟墓中遮蔽自己”。
  - severity: medium
    issue: “He will be confined... Furthermore, he will be unable...”中的受罚者指代不清
    rationale: 紧接“统治者”后使用“他”会使中文读者误解为统治者被囚禁、不能移动；英语此处的 he 指被交付并被抛下的人。
  - severity: low
    issue: 残缺符号未逐项保留
    rationale: 英语见证在“their body”之后有独立的“[]”，在“fire chasing them”之后亦有“[]”及另一处缺文；草稿将后一处改成连续省略号，弱化了空方括号这一既有编辑信号。
  - severity: low
    issue: “撒种的”略偏施事者
    rationale: 原文为“what sows and what is sown”，以“那播种的和所播下的”较能保留中性、语法上不明的表达。
  revised_text: '多马回答说：“这些话之后，我们还能说什么呢？对那些瞎眼的人，我们能说什么呢？对于这些可怜的世人，我们该把什么教导传给他们呢？他们说：‘我们到这里来，是要[行]善，不是要咒诅。’却又[说]：‘如果我们不是从肉身生的，就绝不会知道[罪]。’”


    救主说：“我实在告诉你们，至于[那些人]，不要把他们看作人，而要把他们看作[动物]；因为动物怎样彼此吞吃，这种人也照样彼此吞吃。事实恰恰相反：他们因自己的爱而失去了[国度]——那甜美的火；他们作了死亡的奴仆，奔去行朽坏的事。他们放纵祖先的欲望。他们必被扔进深渊，受自身本性中苦毒邪恶的折磨；他们要遭鞭打，被迫向后奔逃，逃往自己看不见的地方；他们[将与]自己的肢体[分离]，不是勇敢地忍受，而是[陷入]绝望。他们欢喜，是因为[……]疯狂和无理性[……]。[他们]追逐这种无理性，却认不出[自己的疯狂，还以为]自己[有]智慧。[他们……]自己的身体[……][]他们的心思只顾自己，因为他们的思想被自己的行为占据；然而，火必烧灼他们。”


    多马回答说：“主啊，那被扔到他们那里的人会怎样呢？我非常挂念他们，因为有许多人攻击他们。”


    救主回答说：“你自己怎么看？”


    那称为多马的犹大说：“主啊，你说、我听，这是理所当然的。”


    救主回答说：“要留心我将要告诉你的，并且相信真实的事。那播种的和所播下的，都必消失在火中，在火与水中；他们要在幽暗的坟墓中遮蔽自己。过了许久，他们必显出恶树的果子，在动物和人的口中受责罚、被杀害，又被雨、风、空气和从上面照下来的光催逼。”


    多马回答说：“主啊，你确实已经使我们信服了。我们心里知道，这件事显然[确是如此]，你的话也已经足够。然而，你对我们所说的这些话，在世人看来可笑又可憎，因为他们曲解这些话。那么，我们怎能去传讲呢？因为我们在世上[不]受尊重。”


    救主回答说：“我实在告诉你们，凡听见[你们]的话却弃绝它，或嘲弄它，或讥笑这些事的人——我实在告诉你们——他必被交给高处的统治者；那统治者作他们的王，辖制一切权势。他要使那人不停旋转，把他从天上扔进深渊；那人必被囚禁在狭窄幽暗之地。此外，那人必不能转身或移动，因为塔耳塔罗斯[b]深不可测，冥府那坚定不移的[沉重苦毒]。[……]他们到那里[……]他们不会饶恕[……]追赶你们。他们要把[……]交给[……]塔耳塔鲁科斯天使[c][……]火追赶他们。[][……]喷射火星如雨、直扑被追赶者脸面的烈焰鞭子。


    “他若逃往西方，就会遇见火。


    “他若逃往南方，也会在那里遇见火。


    “他若转向北方，沸腾烈火的危险又会迎面而来。


    “他也找不到一条通往东方的路，可以逃到那里而获救。


    “因为他住在肉身中的日子没有找到这条路，所以在审判之日也必找不到。”'
