  footnotes:
  - marker: a
    text: 此处及上下文多处原稿残缺；方括号内文字表示编者补足，省略号表示无法复原的缺文。
    reason: 说明正文中的残损与补足符号，防止读者误以为句法断裂来自译文。
  - marker: b
    text: “塔耳塔罗斯”是希腊传统中极深的幽暗刑罚之地；此处保留音译，以区别于下文的“冥府”。
    reason: 解释现代普通读者不熟悉的古代专名，同时避免将不同术语混为一谈。
  - marker: c
    text: “塔耳塔鲁科斯”按专名音译，字面与“塔耳塔罗斯”有关；由于此处原稿残缺，其角色和句法关系并不完全清楚。
    reason: 标明罕见专名及文本不确定性。
  - marker: d
    text: 此处原稿有一段无法辨读的缺文。
    reason: 正文出现独立残损标志，需要明确其依据。
lexical_decisions:
- source_word: Savior
  choice: 救主
  rationale: 采用庄重而通行的宗教称谓，不额外限定其教派含义。
- source_word: blind
  choice: 瞎眼的人
  rationale: 保留原文可兼具身体与属灵意味的意象，不解释为单一意义。
- source_word: animals
  choice: 野兽
  rationale: 上下文强调彼此吞吃，译作“野兽”比宽泛的“动物”更自然，也保留贬抑性比喻。
- source_word: the sweet fire
  choice: 那甜美的火
  rationale: 保留原见证文本中突兀且可能具有专门象征意义的表达，不擅自释义。
- source_word: abyss
  choice: 深渊
  rationale: 保留宇宙论和刑罚语境中的空间意象。
- source_word: Tartaros
  choice: 塔耳塔罗斯
  rationale: 音译专名，以免与一般的“地狱”混同。
- source_word: Hades
  choice: 冥府
  rationale: 区别于塔耳塔罗斯，并保留死者领域的古代概念。
- source_word: Tartarouchos
  choice: 塔耳塔鲁科斯
  rationale: 按专名音译；其具体身份因底本与残损语境而不确定。
- source_word: day of judgment
  choice: 审判之日
  rationale: 采用现代中文中自然、庄重且语义准确的表达。
theological_decisions:
- issue: “they have forfeited [the kingdom] with/through their love, the sweet fire”的句法与指涉
  choice: “他们因自己的爱而失去了[国度]——那甜美的火”
  alternative: “他们因爱那甜美的火而失去了[国度]”
  rationale: 英语见证的标点与句法允许不同理解；正文以破折号保留“甜美的火”与前句关系上的张力，未将其明确处理为欲爱的宾语。
- issue: “begotten in the flesh”与罪的关系
  choice: “从肉身生的……知道[罪]”
  alternative: “生在肉体中……认识[罪]”
  rationale: 保留肉身出生与认识罪之间的原有陈述，不加入原罪、肉身本恶或其他体系化解释。
- issue: 审判刑罚的描述
  choice: 按见证文本直译为具体的火、深渊、冥府与鞭打意象
  alternative: 概括为“永恒刑罚”
  rationale: 不把该作品独特的宇宙论意象归并为后世教义术语，也不判断这些描述应按字面还是象征理解。
- issue: “the way”在末句的补足
  choice: “这条路”
  alternative: “救恩”或“真理”
  rationale: 由前句四方逃路承接为“路”，不神学化为见证文本未明说的抽象概念。
- issue: “the ruler on high”身份
  choice: “高处的统治者”
  alternative: “至高的掌权者”或某一特定恶灵名称
  rationale: 保留该称谓的身份歧义，不把他等同于上帝、撒但或某一诺斯替宇宙论角色。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体，保留问答节奏、反复句式和强烈审判意象。鉴于所供材料明确标注“科普特语源文复核待完成”，本稿只能依据公共领域英语见证并参考英文POB审校层起草，故严格保留方括号、缺文和关键句法歧义，不声称已经完成科普特语直译。
