  text: 'Thomas replied, “What can we say after these things? What can we say to the blind? What teaching should we communicate to these pitiable mortals who say, ‘We came here to [do] good and not to curse,’ and yet [say], ‘If we had not been begotten in the flesh, we would never have known [sin]’?”


    The Savior said, “Truly, regarding [those], do not consider them human, but consider them [as] animals, because just as animals eat each other, so these people also eat each other. It is exactly the opposite: they have forfeited [the kingdom] through their love, the sweet fire, becoming servants of death and rushing to perform deeds of decay. They practice the lust of their ancestors. They will be cast down into the abyss to suffer the torment of the bitter evil of their nature, because they will be whipped, making them run backward to where they cannot see, and they [will be separated] from their limbs, not enduring it bravely, but [in] despair. And they are glad because [. . .] insanity and irrationality [. . .] [They] pursue this irrationality without recognizing [their insanity, believing] that they [are] wise. [They . . .] their body [. . .] [] Their mind is selfishly directed, because their thinking is preoccupied with their actions, but the fire will scorch them.”


    Thomas replied, “Lord, what will the person cast down to them do? I am deeply concerned for them, since many attack them.”


    The Savior answered, “What do you yourself think?”


    Judas, called Thomas, said, “Lord, it is right for you to speak and for me to listen.”


    The Savior replied, “Pay attention to what I will tell you, and believe what is true. What sows and what is sown will vanish in the fire, in fire and water, and they will cover themselves in dark graves. After much time has passed, they will reveal the fruit of evil trees, being reproved and killed in the mouths of animals and humans, driven on by the rains, winds, air, and the light shining from above.”


    Thomas replied, “Without a doubt, you have convinced us, Lord. We know in our hearts, and it is clear that this [is the case] and that your word is sufficient. Yet these words you speak to us are laughable and detestable to the world because they are misinterpreted. So how can we go and preach them, since we are [not] respected [in] the world?”


    The Savior replied, “Truly I tell you, whoever hears [your] word and rejects it, mocks it, or laughs at these matters—truly I tell you, he will be handed over to the ruler on high, who rules as king over every power. He will spin that person around in circles and cast him out of heaven and down into the abyss, and he will be confined in a narrow, gloomy place. Furthermore, he will be unable to turn or move because of the tremendous depth of Tartaros and the [ponderous bitterness] of unwavering Hades. [. . .] them to it [. . .] they will not forgive [. . .] chase you. They will hand [. . .] over to [. . .] angel Tartarouchos [. . .] fire chasing them. [] [. . .] fiery whips that spew a shower of sparks into the face of the one being chased.


    If he runs to the west, he will encounter the fire.


    If he runs to the south, he will encounter it there too.


    If he turns to the north, the danger of boiling fire will meet him again.


    Nor will he find a way to the east to flee there and be rescued.


    Because he did not find it in the day when he lived in the body, he will not find it on the day of judgment.”'
translation:
  language: zh_hans
  text: '多马回答说：“这些话之后，我们还能说什么呢？对那些瞎眼的人，我们能说什么呢？对于这些可怜的世人，我们该把什么教导传给他们呢？他们说：‘我们到这里来，是要[行]善，不是要咒诅。’却又[说]：‘如果我们不是从肉身生的，就绝不会知道[罪]。’”


    救主说：“我实在告诉你们，至于[那些人]，不要把他们看作人，而要把他们看作[野兽]；因为野兽怎样彼此吞吃，这种人也照样彼此吞吃。事实恰恰相反：他们因自己的爱而失去了[国度]——那甜美的火；他们作了死亡的奴仆，奔去行朽坏的事。他们放纵祖先的欲望。他们必被扔进深渊，受自身本性中苦毒邪恶的折磨；他们要遭鞭打，被迫向后奔逃，逃往自己看不见的地方；他们[将与]自己的肢体[分离]，不是勇敢地忍受，而是[陷入]绝望。他们欢喜，是因为[……]疯狂和无理性[……]。[他们]追逐这种无理性，却认不出[自己的疯狂，还以为]自己[有]智慧。[他们……]自己的身体[……][a]他们的心思只顾自己，因为他们的思想被自己的行为占据；然而，火必烧灼他们。”


    多马回答说：“主啊，那被扔到他们那里的人会怎样呢？我非常挂念他们，因为有许多人攻击他们。”


    救主回答说：“你自己怎么看？”


    那称为多马的犹大说：“主啊，你说、我听，这是理所当然的。”


    救主回答说：“要留心我将要告诉你的，并且相信真实的事。撒种的和所撒的，都必消失在火中，在火与水中；他们要把自己藏在幽暗的坟墓里。过了许久，他们必显出恶树的果子，在野兽和人的口中受责罚、被杀害，又被雨、风、空气和从上面照下来的光催逼。”


    多马回答说：“主啊，你确实已经使我们信服了。我们心里知道，这件事显然[确是如此]，你的话也已经足够。然而，你对我们所说的这些话，在世人看来可笑又可憎，因为他们曲解这些话。那么，我们怎能去传讲呢？因为我们在世上[不]受尊重。”


    救主回答说：“我实在告诉你们，凡听见[你们]的话却弃绝它，或嘲弄它，或讥笑这些事的人——我实在告诉你们——他必被交给高处的统治者；那统治者作他们的王，辖制一切权势。他要使那人不停旋转，把他从天上扔进深渊，囚禁在狭窄幽暗之地。他也无法转身或动弹，因为塔耳塔罗斯[b]深不可测，冥府那[沉重的苦毒]坚定不移。[……]他们到那里[……]他们不会饶恕[……]追赶你们。他们要把[……]交给[……]塔耳塔鲁科斯天使[c][……]火追赶他们。[……][d][……]喷射火星如雨的烈焰鞭子，抽打那被追赶之人的脸。


    “他若逃往西方，就会遇见火。


    “他若逃往南方，也会在那里遇见火。


    “他若转向北方，沸腾烈火的危险又会迎面而来。


    “他也找不到一条通往东方的路，可以逃到那里而获救。


    “因为他住在肉身中的日子没有找到这条路，所以在审判之日也必找不到。”'
