source:
  text: 'Thomas said to the Lord: “I implore you, then, to answer what I ask of you before your ascension, and when I hear from you about concealed things, that then I can discuss them (openly). And it is clear to me that it is difficult to do the truth in front of others.”


    The Savior answered: “If visible things are concealed to you, how can you hear about invisible things? If it is difficult for you to do the works of truth that in this world are visible, then how, in fact, will you do those that relate to the invisible lofty height and Fullness? And how will you be called ‘workers’? In this regard you are students, and have not yet obtained the summit of perfection.”


    Thomas responded and said to the Savior: “Explain to us about what you call invisible things, [that are nevertheless] concealed from us.”


    The Savior said: [“All] bodies [. . .] the animals are begotten [. . .] it is manifest like [. . .] also this, those who are above [. . .] visible things, but [they are] visible [] in their own root, and their fruit nurtures them. These visible bodies, however, survive by eating animals that resemble them, the result being that the bodies change. What changes will degenerate and perish, and from that point on it loses any hope for life, because that is an animal body. Accordingly, just as animal bodies perish, so these (bodily) forms will also perish. They originate from intercourse, just like those of animals, no? If it also originates from intercourse, then how will it beget something different from the animals? Consequently, then, you will remain infants until you become mature.”


    And Thomas responded: “I therefore tell you, Lord, that those who talk about invisible things and things difficult to interpret resemble those who at night shoot arrows at a target. They certainly shoot their arrows like everyone (else) who does, given that they shoot at the target, yet it cannot be seen. When, though, the light emerges and veils the darkness, the work of each will then appear. And O Lord, our light, illuminate us.”


    Jesus said: “The nature of light is light.”


    Thomas spoke: “Lord, why does this visible light that shines for humans rise and set?”


    The Savior responded: “O blessed Thomas, of course this visible light shines for you, not so that you will stay here, but so you can instead depart. And when all the chosen ones forsake the animal state, then this light will depart upward (back) to its essence, and it will greet (the light), because it is a good servant.”'
