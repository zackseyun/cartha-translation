translation:
  language: zh_hans
  text: '多马对主说：“那么，我恳求你，在你升天以前回答我要问你的事；等我从你那里听见隐秘之事以后，我就能公开谈论这些事。我清楚知道，在别人面前行出真理是困难的。”


    救主回答说：“如果连可见之事对你们也是隐蔽的，你们又怎能听明白不可见之事呢？如果你们难以行出这世上可见的真理之工，那么，你们又怎能行那与不可见的至高之境和圆满[a]有关的事呢？你们又怎能称为‘工人’呢？在这方面，你们还是学生，尚未达到完全的顶峰。”


    多马回答救主说：“请向我们解释你所说的不可见之事，就是那些向我们隐藏的事。”


    救主说：“[一切]身体……动物被生出……显明如同……这也是，那些在上面的……可见之事，但[它们]在自己的根源里是可见的[]，它们的果实滋养它们。[b]然而，这些可见的身体靠吃与自己相似的动物维生，结果身体就会改变。凡会改变的，都要衰败、灭亡；从那时起，它便失去一切得生命的指望，因为那是属动物的身体。[c]所以，动物的身体怎样灭亡，这些形体也照样灭亡。它们由交合而生，正如动物一样，不是吗？既然它也是由交合而生，又怎能生出与动物不同的东西呢？因此，你们仍将是婴孩，直到长大成熟。”


    多马回答说：“所以，主啊，我告诉你：那些谈论不可见之事和难以解释之事的人，就像在夜间向靶子射箭的人。他们的确像其他射箭的人一样把箭射出去，因为他们是朝着靶子射的，然而靶子却看不见。可是，当光显现、遮蔽黑暗时，各人的工作就会显露出来。主啊，我们的光，求你照亮我们。”


    耶稣说：“光的本性就是光。”


    多马说：“主啊，这照耀人类的可见之光为什么升起又落下呢？”


    救主回答说：“蒙福的多马啊，这可见之光照耀你们，当然不是要你们留在这里，而是要你们离去。当所有蒙拣选的人都舍弃属动物的状态[d]时，这光就要向上返回自己的本质，并要迎接那光[e]，因为它是良善的仆人。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圆满”所对应的词可能是此类文献中的宇宙论术语，也可按普通意义理解为完满或完备。
    reason: 保留技术性与普通词义之间的真实歧义。
  - marker: b
    text: 本段抄本残缺严重。方括号表示编辑补足，省略号表示缺文；“可见的[]”中的空方括号照所据见证保留。整句的衔接与所指均不确定。
    reason: 明确文本损坏，避免把暂定复原伪装成完整原文。
  - marker: c
    text: “属动物的”在这里主要指与动物同类的生育、摄食、变化和朽坏状态；不必然等于现代汉语中带道德贬义的“兽性”。
    reason: 防止读者把宇宙论或人类学用语误读为单纯的道德辱称。
  - marker: d
    text: “属动物的状态”也可译作“动物性”或“动物般的生存状态”；具体所指有待科普特文复核。
    reason: 标示源语复核尚未完成，并保存概念范围。
  - marker: e
    text: “它”“那光”的所指及“迎接”的方向并不完全清楚；也可能理解为这光返回本质，并与光相会。
    reason: 保留末句代词关系和动作方向的歧义。
lexical_decisions:
- source_word: Fullness
  choice: 圆满
  rationale: 保留该词在此类文献中可能兼具普通意义与宇宙论术语色彩的张力，不直接音译或加上宗派化解释。
- source_word: workers
  choice: 工人
  rationale: 保留与“真理之工”和“行”之间的语义关联，同时用引号显示其称号性质。
- source_word: animal body / animal state
  choice: 属动物的身体／属动物的状态
  rationale: 原见证文本强调与动物生命、生育和朽坏的关联；译为“属动物的”比“兽性”更少引入道德化解释。
- source_word: essence
  choice: 本质
  rationale: 采用自然且具哲学承载力的现代汉语，不把它预先解释为来源、领域或神性。
- source_word: the nature of light is light
  choice: 光的本性就是光
  rationale: 尽量保存原句简短、同义反复且可能带格言意味的表达。
theological_decisions:
- issue: “Fullness”是否作为特定宇宙论专名处理
  choice: 正文译作“圆满”，脚注说明其潜在术语性
  alternative: “丰满”“普累若麻”或“圆满界”
  rationale: 现有材料只是待科普特文复核的英语见证；不宜在正文中锁定某一诺斯替体系的技术含义。
- issue: 身体段落对肉身与动物性的评价
  choice: 按见证文本直译其朽坏、生育和动物身体的论证
  alternative: 弱化为一般性的“物质生命”或强化为“罪恶肉体”
  rationale: 既不缓和文本的身体观，也不把它神学化为后世特定的罪性教义。
- issue: 末句“it will greet (the light)”的主语和宾语
  choice: 译作“它要迎接那光”并加注歧义
  alternative: “那光要迎接它”或“它要与光相会”
  rationale: 英语见证本身用括号表明补足或解释，代词所指不稳；正文保留较贴近所给语序的读法，脚注呈现不确定性。
- issue: 可见之光的升降与拣选者离开动物状态
  choice: 保留宇宙论式陈述，不解释为死亡、升天或末世事件
  alternative: 明确解释为灵魂离身、世界终结或太阳回归
  rationale: 原段在这些可能性之间留有张力，现阶段不应替文本定论。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。对话保持直接自然；保留“救主”“主”“蒙拣选的人”等文本自身的宗教称谓。因所据材料是公共领域英语见证，且科普特文源语审校尚待完成，本稿为源语复核前的暂定出版草案；残缺处严格保留方括号与省略号，不擅自补全。
