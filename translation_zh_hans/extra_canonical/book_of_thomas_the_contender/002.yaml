base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/002.yaml
  text: 'The Savior said, “Brother Thomas, listen to me while you have time (left) in the world, and I will reveal to you the things you have wondered about in your mind.


    “It has been said that you are my twin and true friend. Therefore, examine yourself and discover who you are, the mode in which you are, and how you will be (in the future). Since you will be called ‘my brother,’ it is not fitting for you to be ignorant of yourself. Yet I know that you have understood (yourself), because you have already understood that I am true knowledge. Thus, even though you do not understand, as you concur with me 1, you have already attained knowledge, and (so) you will be called ‘the one of self-knowledge.’ For whoever has no knowledge of himself knows nothing, but whoever knows himself has, along with that, already gained deep knowledge about everything. Consequently, my brother Thomas, you have looked upon what is hidden from human beings—namely, that which they stumble over in (self-)ignorance.”'
translation:
  language: zh_hans
  text: '救主说：“多马弟兄，趁你在世上还有时间，要听从我；你心里所疑惑的事，我必向你揭示。


    “既然有人说你是我的孪生兄弟和真正的朋友，你就要省察自己，弄清楚你是谁、你以何种状态存在，以及将来会怎样。既然你将被称为‘我的弟兄’，就不该不了解自己。不过，我知道你已经认识了自己，因为你已经认识到我就是真知识。因此，即使你尚未明白，只要你与我一致[a]，你就已经获得了知识，也将被称为‘认识自己的人’。因为不认识自己的人一无所知；认识自己的人，也已经由此对万有有了深刻的认识。所以，我的多马弟兄，你已经看见了那向世人隐藏的事，也就是他们因不认识自己而绊跌之处。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与我一致”所对应的见证也可理解为“同意我”或“与我相合”。现有材料中的数字“1”似为原见证的注记标号，但未提供注释内容。
    reason: 该短语的关系和语气存在歧义，且所给见证保留了一个无注释文本对应的标号；用脚注说明而不在正文中武断定解。
lexical_decisions:
- source_word: Savior
  choice: 救主
  rationale: 采用庄重而通行的中文宗教称谓，与所给见证一致。
- source_word: heed me
  choice: 要听从我
  rationale: 不只表达听见，也保留留意并遵从的语义力度。
- source_word: twin
  choice: 孪生兄弟
  rationale: 上下文称多马为男性弟兄；加入“兄弟”使现代汉语自然，同时保留“孪生”的核心意义。
- source_word: study yourself
  choice: 省察自己
  rationale: 表达认真审视自身，而非一般性的学习。
- source_word: the mode in which you are
  choice: 你以何种状态存在
  rationale: 原表达抽象且可能涉及存在方式；译文保留这种哲学性，不擅自具体化。
- source_word: true knowledge
  choice: 真知识
  rationale: 保留“真实/真”与“知识”的直接关系，避免解释成智慧、启示或某种教义体系。
- source_word: self-knowledge
  choice: 认识自己
  rationale: 现代汉语清楚自然，并维持本段反复出现的自我认识主题。
- source_word: everything
  choice: 万有
  rationale: 比“一切事情”更能保留此处可能具有整体、宇宙论意味的宽广指向。
theological_decisions:
- issue: “我就是真知识”的身份断言
  choice: 按见证直译为“我就是真知识”
  alternative: “我拥有真正的知识”或“我是真理的知识”
  rationale: 现有见证明示系词身份表达；不将其弱化为拥有知识，也不替文本界定“真知识”的神学含义。
- issue: “即使你尚未明白”与“已经获得知识”之间的张力
  choice: 保留表面悖论
  alternative: 解释为“即使你尚未完全明白”
  rationale: 原文在不明白与已得知识之间形成刻意张力；加入“完全”会替作者消解张力。
- issue: 自我认识与认识万有的关系
  choice: 译为由认识自己而对万有获得深刻认识
  alternative: 解释为得救、神化或获得秘密启示
  rationale: 只呈现文本明说的认识论联系，不导入特定宗派或诺斯替体系的解释。
- issue: 向世人隐藏之事与绊跌之处的句法关系
  choice: 依现有英文见证译作同位说明
  alternative: 将隐藏之事与绊跌之物分作两个对象
  rationale: 见证以“namely”明确连接二者；但底本科普特语复核尚待完成，因此不作超出见证的重构。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。鉴于科普特语源文复核尚未完成，本稿以所给公共领域英文见证为暂定依据，并尽量保留“存在状态”“真知识”“尚未明白却已获得知识”等抽象表达和内在张力。
