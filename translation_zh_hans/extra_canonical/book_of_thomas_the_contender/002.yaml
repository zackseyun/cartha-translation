review_pass:
  verdict: revise
  source_fidelity: 在所提供的英文见证范围内，译文总体保留了论述的抽象性、自我认识与深刻知识的关联，以及“尚未领悟”却“已得知识”的张力。不过，“heed me”译为“听从我”将留意／听取扩展为顺服；“as you concur with me”译作“只要你与我一致”则将原句较可能的陈述性或因果性关系改成条件关系。末句的“绊跌之处”也把所指对象由“所绊跌的事物”偏移为地点。科普特原文尚未直接复核，以下修订严格以供给的英文见证为依据，并保留其歧义。
  naturalness: 原译整体庄重、通顺。“你以何种状态存在”可理解但略显生硬；改为“你以何种方式存在”较符合现代书面汉语，同时不具体化其哲学含义。“孪生兄弟”虽可通，但英文仅称“my twin”，用“我的孪生者”可避免在该处额外补入亲属关系，后文仍照译“我的弟兄”。
  terminology: “救主”“真知识”“认识自己／自知”均可保留，且不应预设特定教义诠释。为使反复的关键词更凝练一致，正文采用“自知”，并在脚注中说明其指自我认识。“万有”可以保留，因其恰当地传达“everything”的宽广范围。
  issues:
  - severity: medium
    issue: “要听从我”加强了 heed me 的语义。
    rationale: 英文见证的 heed 可表示留意、听取或认真聆听，并不必然要求服从。译为“留心听我说”更准确且不额外引入命令性顺服。
  - severity: medium
    issue: “只要你与我一致”将 as you concur with me 改成条件句。
    rationale: 见证的 as 可有“既然／由于”或伴随意味；“只要”设定了原文未明示的充分条件。应保留为“既然你与我相合”，并用脚注标示该短语的可译性。
  - severity: medium
    issue: 末句“他们因不认识自己而绊跌之处”把宾语译成地点。
    rationale: that which they stumble over 指他们所绊跌的对象／事物，不是“地点”；且括号中的 self- 应保留为“自我无知”而非直接定为“不认识自己”，以免过度消解标记的歧义。
  - severity: low
    issue: “孪生兄弟”在此处补入了英文未明说的兄弟关系。
    rationale: 下文确实称多马为“弟兄”，但此处 my twin 本身未明确亲属称谓；改为“我的孪生者”更贴近见证。
  revised_text: 救主说：“多马弟兄，趁你在世上还有时间，留心听我说；你心中所思量的事，我要向你揭示。\n\n“因为人曾说你是我的孪生者和真正的朋友，所以你要省察自己，弄清你是谁、你以何种方式存在，以及你将来会如何。既然你将被称为‘我的弟兄’，你就不应不了解自己；但我知道你已经领悟了自己，因为你已经领悟到我是真知识。因此，尽管你并不领悟，既然你与我相合[a]，你已经获得了知识，并将被称为‘自知者’。因为没有自知的人一无所知；有自知的人也已经随之获得了关于万有的深切知识。所以，我的多马弟兄，你已经看见那向人隐藏的事：就是他们在（自我）无知中所绊跌的事。”
  revised_footnotes:
  - marker: a
    text: “与我相合”也可译为“同意我”或“与我一致”。所提供英文见证在此保留数字“1”，但未提供相应注释内容；该短语的具体关系和语气因此不能确定。
    reason: 保留 concur with me 的语义与句法歧义，不把它译成条件性的“只要”，并说明见证中无内容可核的标号。
  revision_rationale: 修订限于可由英文见证安全支持的校正：避免将“留意”强化为“服从”，避免将含糊连接词改作条件句，恢复末句“所绊跌的事物”的对象关系，并以较自然的现代汉语表达抽象的存在方式与自我认识主题。未对尚待科普特文本复核之处作重构或教义化解释。
