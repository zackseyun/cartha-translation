review_pass:
  verdict: revise
  source_fidelity: 以所提供的英文见证为准，译文总体忠实地保留了自我认识、‘真知识’及‘尚未明白却已得知识’之间的张力。由于尚未提供可核对的科普特语底本，无法完成独立的原语逐词复核；下列修订避免超出英文见证作重构。
  naturalness: 原稿整体庄重通顺，但“你心里所疑惑的事”容易限缩为怀疑而非心中思索的问题；“只要你与我一致”误添较强的条件意味，且“以何种状态存在”略显生硬。修订后更贴近现代标准汉语，同时维持原文的抽象性。
  terminology: “救主”“真知识”“认识自己的人”“万有”均可保留。为维持‘self-knowledge’的术语连贯，正文保留“认识自己”，并在脚注中说明“与我相合”的歧义及英文见证遗留的无内容注号。
  issues:
  - severity: medium
    issue: “只要你与我一致”将“as you concur with me”处理成条件句。
    rationale: “只要”表示‘只需满足此条件便可’的条件关系，英文见证的 as 更适宜保留为伴随、依据或相合的关系；不应加强其逻辑条件。
  - severity: low
    issue: “你心里所疑惑的事”可能把 wondered about 限缩为疑惑、质疑。
    rationale: 见证仅指心中所思索或想知道的事，改为“你心中所思索的事”较宽而贴切。
  - severity: low
    issue: “也已经由此对万有有了深刻的认识”将 along with that 明确解释为因果。
    rationale: 英文见证表达自我认识与关于万有的深刻知识并得，未必明示严格因果；改作“也已同时获得关于万有的深刻知识”较能保留关系。
  revised_text: '救主说：“多马弟兄，趁你在世上还有时间，留心听我；你心中所思索的事，我要向你揭示。


    “有人说你是我的孪生兄弟和真正的朋友。因此，你要省察自己，弄清楚你是谁、你以何种方式存在，以及你将来会怎样。既然你将被称为‘我的弟兄’，你就不该不认识自己。不过，我知道你已经明白了自己，因为你已经明白我就是真知识。因此，即使你尚未明白，你既与我相合[a]，就已经获得了知识，也将被称为‘认识自己的人’。因为不认识自己的人一无所知；认识自己的人，也已同时获得关于万有的深刻知识。所以，我的多马弟兄，你已经看见那向人隐藏的事，也就是他们因（自我）无知而绊跌的事。”'
  revised_footnotes:
  - marker: a
    text: “与我相合”所对应的见证也可理解为“同意我”或“与我一致”。现有材料中的数字“1”似为原英文见证的注记标号，但未提供相应注释内容。
    reason: 该短语的具体关系与语气存在歧义；脚注保留其他可行理解，不在正文中武断定解，并说明未附内容的见证标号。
  revision_rationale: 修订“wondered about”“mode in which you are”“as you concur with me”及“along with that”的中文表达，避免增加疑惑、条件或明确因果等英文见证未明说的含义。其余关键术语与段落的修辞张力均予保留。
