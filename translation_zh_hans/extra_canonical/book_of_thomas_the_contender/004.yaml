translation:
  language: zh_hans
  text: '于是，救主继续说：“啊，对光那深不可测的爱！啊，那火何等苦涩！它在人里面的身体和骨髓中燃烧，昼夜在他们里面点燃，灼烧人的肢体，[使]他们的心智沉醉、灵魂癫狂……他们，无论男女……夜间，他们有所动作，……或暗中或公开，因为男人[在女人身上……动作]，女人也在[男人身上]。因此，[]有话说：‘凡从真正的智慧寻求真理的人，都将长出翅膀飞翔，逃离那灼烧人灵的欲望；他们也将长出翅膀，逃离所看见的任何[邪]灵。’”[a]


    多马回答说：“主啊，我所问的正是这件事，因为我已经领悟到，正如你所说，你是我们的恩人。”


    救主又回答说：“正因如此，我们必须对你讲，因为这是给成熟之人的教导。你若现在愿意成为成熟的人，就会实行这些事；否则，你的名字就是‘无知者’。因为明智的人不能与愚昧人同住；明智的人在一切智慧上都是成熟的。事实上，智慧人必受真理滋养，‘他要像一棵树，生长在曲折的溪流旁。’（诗篇1:3）[b] 然而，对愚昧人来说，善与恶并无分别；有些人即使有翅膀，仍奔向那些远离真理的可见之物。这是因为引导他们的火为他们造出真理的幻象，[又]以一种[必朽坏的]美丽照亮他们，把他们禁闭在甜美的幽暗里，以芬芳的享乐迷惑他们。


    “这火还会用无法熄灭的欲望使他们眼瞎，灼烧他们的灵魂，并在他们里面变得像一根打进心里的木桩，永远无法拔除。它随心所欲地驱使他们，好像用嚼环勒住他们的口。对可见之物的欲望使他们沦为俘虏；那些事物一受冲动便败坏、改变、偏离。这火以那俘虏之苦，用锁链捆住他们，铐住他们的每一个肢体。他们不断被拖向下方。等他们被杀，必朽坏领域里的一切兽类就把他们消化。”


    多马回答说：“这很清楚，正如经上所说：[‘……的人很多，他们不认识]……灵魂。’”[c]


    [救主]回答说：[“有福的是]智慧人；他[寻求真理，]找到以后，[]便永远安息于真理之上，也不惧怕那些想要搅扰他的人。”[d]


    多马回答说：“主啊，我们安息在属于我们的事物之中，是好的吗？”


    救主说：“是的，这有益处，对你们也是好的。因为人间可见的事物都要消逝；他们属肉体的器皿也要消逝。当它归于虚无时，就会存在于可见之物中，存在于那些能被看见的事物中。[e] 那时，他们所看见的火必因他们从前对信仰的爱而使他们受痛苦。[f] 他们将重新聚集到可见之物那里。此外，那些能在不可见之物中看见、却没有那最大的爱的人，必因专注于今生并受烈火灼烧而灭亡。再过不久，可见之物就要消逝。随后，无形的影子将会出来；它们要在坟墓间永远停留在尸体上，受着痛苦，而它们的灵魂则在腐烂。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段多处原稿残损；方括号表示补拟文字，省略号表示缺文，空方括号照现有英文见证保留。“邪”也属补拟。
    reason: 说明严重残损及编辑性复原，避免读者误以为句子完整可靠。
  - marker: b
    text: 引自《诗篇》1:3；这里的“曲折的溪流”照本见证译出，与较熟悉的经文措辞不同。
    reason: 标明引用来源，并保存该文献所传引文的独特措辞。
  - marker: c
    text: 引语大部分已经残缺，无法可靠重构完整句意。
    reason: 防止对残句作无根据的补足。
  - marker: d
    text: 本句有多处残损和补拟；空方括号照见证保留。
    reason: 提示文本基础不完整。
  - marker: e
    text: “归于虚无”后又“存在于可见之物中”的说法在现有见证中语义困难，译文未加调和。
    reason: 公开真正的文本歧义，不以解释替代翻译。
  - marker: f
    text: “因他们从前对信仰的爱”照现有英文见证译出；此处在上下文中含义突兀，尚待科普特语复核。
    reason: 记录关键文本困难与当前草案的暂定性质。
lexical_decisions:
- source_word: Savior
  choice: 救主
  rationale: 沿用早期基督教文献中自然、庄重且不额外限定身份的通行称谓。
- source_word: mature
  choice: 成熟（的人）
  rationale: 保留该词兼具成长完成与领受高阶教导资格的意味，不释作特定宗派术语。
- source_word: Ignoramus
  choice: 无知者
  rationale: 表达作为称号的贬义，并用引号保留命名语气；避免过度口语化的“笨蛋”。
- source_word: visible things
  choice: 可见之物
  rationale: 保留本文反复出现的可见与不可见之对照及其思想张力。
- source_word: reposed on it
  choice: 安息于真理之上
  rationale: 保留原见证中介词关系的异样表达，不擅自改成“在真理里得安息”。
- source_word: bit in the mouth
  choice: 嚼环勒住他们的口
  rationale: 采用驭马器具的具体意象，清楚表达受驱使和控制。
- source_word: perishable realm
  choice: 必朽坏领域
  rationale: 保留宇宙论色彩，又不将其扩释成某一既定神学体系。
- source_word: faith
  choice: 信仰
  rationale: 忠实保留见证文本中语义突兀的“faith”，不按上下文擅改为“欲望”或“可见之物”。
theological_decisions:
- issue: 对欲望和身体意象的处理
  choice: 直译其强烈的禁欲性批判，同时保留残缺处
  alternative: 将其缓和为一般性的道德警戒
  rationale: 文本把欲望描绘成灼烧、奴役灵魂的火；译文不应淡化其神学张力，也不应补全残卷未保存的具体内容。
- issue: “有翅膀”与逃离诸灵的意象
  choice: 保留字面飞翔与逃离[邪]灵
  alternative: 解释为灵性提升或战胜邪灵
  rationale: 原文意象可能具有象征性，但未明确解释；应保留开放性。
- issue: “从前对信仰的爱”引发火的痛苦
  choice: 照见证保留“对信仰的爱”
  alternative: 依上下文校正为“对可见事物的爱”
  rationale: 该短语在现有见证中困难且可能涉及底本文本问题；在科普特语复核前不静默修正。
- issue: 肉体器皿归于虚无后仍在可见之物中存在
  choice: 近形式地保留矛盾句法
  alternative: 解释为身体消亡、灵魂进入另一境界
  rationale: 见证本身具有难解张力；不导入灵魂与身体的特定教义来消除矛盾。
- issue: 末段无形影子、尸体与腐烂灵魂
  choice: 保留各意象及指代上的不确定性
  alternative: 系统化为地狱、阴间或末日审判教义
  rationale: 文本没有明确使用这些后来的规范术语，不应加以宗派化或体系化。
translation_notes:
  register: 采用现代标准普通话的庄重叙事体，人物对话自然但不口语化。保留反复、猛烈意象和可见／不可见的术语对应。所有方括号、空缺和省略均尽量映照所供英文见证；本稿因科普特语源文复核尚未完成，属于以公共领域英文见证为依据的暂定出版草案。
