    “这火还会以无法熄灭的欲望使他们眼瞎，灼烧他们的灵魂，并在他们里面变得像一根打进心里的木桩，永远无法拔除。它随心所欲地驱使他们，像口中的嚼子一样。它以对可见之物之欲望的奴役之苦——那些事物一受冲动便败坏、改变、偏离——用锁链捆住他们，铐住他们的每一个肢体。他们不断被拖向下方。他们被杀时，必朽坏领域里的一切兽类就把他们消化。”



    多马回答说：“这很清楚，正如所说的：[‘……的人很多，他们不认识]……灵魂。’”[c]



    [救主]回答说：[“有福的是]那智慧的人，他[寻求真理，]找到以后，[]便永远安息于真理之上，也不惧怕那些想要搅扰他的人。”[d]



    多马回答说：“主啊，我们安息在属于我们的事物之中，是好的吗？”



    救主说：“是的，这有益处，对你们也是好的。因为人间可见的事物都要消逝；他们肉身的器皿也要消逝。当它归于虚无时，就会存在于可见之物中，存在于那些能被看见的事物中。[e] 那时，他们所看见的火必因他们从前对信仰的爱而使他们受痛苦。[f] 他们将重新聚集到可见之物那里。此外，那些能在不可见之物中看见、却没有至大的爱的人，必因专注于今生和烈火的灼烧而灭亡。再过不久，可见之物就要消逝。随后，无形的影子将会出来；它们要在坟墓间永远停留在尸体上，受着痛苦，灵魂也在朽坏。”'
