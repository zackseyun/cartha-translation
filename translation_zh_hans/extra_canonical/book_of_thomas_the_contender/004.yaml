review_pass:
  verdict: revise
  source_fidelity: 草案总体忠实跟随所供英文见证，并谨慎保留残损标记、空方括号和见证本身的困难语句。惟有数处关系与语气需要校正：不可将“as it has been said”增译为“经上所说”；若干中文表达也轻微重排或弱化了原文的句法和比喻。由于直接科普特语复核仍待进行，以下修订仍是基于英文公共领域见证的暂定译文。
  naturalness: 原稿庄重且基本自然。修订“在人里面的身体和骨髓”“从真正的智慧寻求”等不合现代汉语搭配之处，并将“嚼环勒住他们的口”调整为更自然且保留驭马意象的“口中的嚼子”。
  terminology: “救主”“成熟（的人）”“无知者”“可见之物／不可见之物”“必朽坏领域”等关键术语可保留。“经上”不宜加入，因为见证在该残句只说“正如所说的”，没有明确指向经文。
  issues:
  - severity: medium
    issue: 将“as it has been said”译为“正如经上所说”
    rationale: 英文见证并未说“Scripture”或明确指定经卷；“经上”会不当增添权威文本指向。应仅译为“正如所说的”。
  - severity: medium
    issue: 首段“在人里面的身体和骨髓中”及“从真正的智慧寻求真理”不够自然
    rationale: 前者的修饰关系不清，后者缺少必要介词结构；改为“在人类的身体和骨髓中”“从真正的智慧中寻求真理”，不改变见证意思。
  - severity: low
    issue: “好像用嚼环勒住他们的口”偏离“like a bit in the mouth”的意象
    rationale: 原文是以口中的驭马嚼子比喻其受驱使；“像口中的嚼子一样”较准确、自然。
  - severity: low
    issue: 末段将“greatest love”译作“那最大的爱”略显生硬，且部分代词指向被过早确定
    rationale: “至大的爱”较符合庄重现代汉语；末句宜保留影子、尸体和灵魂之间在见证中本有的指代张力。
