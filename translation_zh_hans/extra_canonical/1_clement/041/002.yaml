base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/002.yaml
  text: For the sacrifices of the continual offering, or of prayers, or concerning sin and transgression, are not offered everywhere, brothers, but only in Jerusalem; and even there they are not offered in every place, but before the sanctuary, at the altar, after the offering has been inspected for blemishes by the high priest and the ministers already mentioned.
translation:
  language: zh_hans
  text: 弟兄们，常献祭、祷告的祭[a]、赎罪祭和赎愆祭，并不是到处都可献的，只能在耶路撒冷献；即使在那里，也不是在每个地方都可献，而是在圣殿前、在祭坛处献；祭物须先由大祭司和前面提到的供职人员查验是否有瑕疵。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祷告的祭”所译的希腊词也可指与誓愿或许愿有关的祭；原词在此有歧义。
    reason: 保留εὐχῶν在“祷告”与“誓愿／许愿”之间的词义可能性，不在正文作排他性裁定。
  - marker: b
    text: “查验是否有瑕疵”译自罕见的检验用词，指对祭物进行检查。
    reason: 说明μυωροσκοπηθέν的礼仪性含义，同时不超出原文所表达的检验程序。
lexical_decisions:
- source_word: θυσίαι ἐνδελεχισμοῦ
  choice: 常献的祭
  rationale: 指持续、定期献上的祭，与圣殿礼仪语境相符；避免将其误解为泛指经常性的奉献。
- source_word: εὐχῶν
  choice: 许愿祭
  rationale: εὐχή既可指祷告，也可指誓愿；在与各类祭并列的圣殿礼仪清单中，‘许愿祭’更贴切，同时以脚注保留词义上的可能性。
- source_word: περὶ ἁμαρτίας καὶ πλημμελείας
  choice: 赎罪祭和赎愆祭
  rationale: 此处使用七十士译本祭祀术语，分别对应为罪与过犯所献的祭；采用现代中文圣经读者较熟悉的礼仪名称。
- source_word: ἔμπροσθεν τοῦ ναοῦ πρὸς τὸ θυσιαστήριον
  choice: 在圣所前的祭坛上
  rationale: ναός在此指圣殿核心的圣所，而非整个圣殿区域；πρὸς τὸ θυσιαστήριον表达献祭所朝向或所在的祭坛。
- source_word: μωροσκοπηθέν / μυωροσκοπηθέν
  choice: 检验，确认没有残缺
  rationale: 该罕见词在上下文中指检查祭物是否有瑕疵；意译其礼仪功能，使普通读者能够理解。
- source_word: λειτουργῶν
  choice: 供职人员
  rationale: 指前文所说参与圣殿礼仪职事的人；不强行限定为某一具体阶层。
theological_decisions:
- issue: εὐχῶν应理解为‘祷告’还是‘誓愿/许愿祭’
  choice: 正文作‘许愿祭’
  alternative: 祷告（或祷告的祭）
  rationale: 上下文逐项列举只能在指定地点献上的祭物，‘许愿祭’在语法和祭祀背景中更自然；脚注保留‘祷告’这一词典可能性。
- issue: 圣殿祭祀规定是否被表述为普遍基督教礼制
  choice: 按作者的历史类比原样陈述，不添加后世教会制度解释
  alternative: 将祭坛、大祭司和供职人员直接对应于某种教会圣职体系
  rationale: 本句明说耶路撒冷及圣所祭坛，属于犹太圣殿礼仪论证；译文不导入宗派性的对应关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用‘弟兄们’保留原文直接称呼；以‘只能’‘须先’清楚呈现礼仪地点与程序限制。祭祀术语尽量采用现代中文圣经传统中易懂且准确的表达，不加入宗派性解释。
