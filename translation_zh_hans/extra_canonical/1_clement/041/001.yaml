id: 1CLEM.41.1
reference: 1 Clement 41:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἕκαστος ἡμῶν, ἀδελφοί, ἐν τῷ ἰδίῳ τάγματι εὐαρεστείτω τῷ θεῷ ἐν ἀγαθῇ συνειδήσει ὑπάρχων, μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα, ἐν σεμνότητι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/001.yaml
  text: Let each of us, brothers, please God in his own rank, maintaining a good conscience, not overstepping the fixed rule of his ministry, with dignity.
translation:
  language: zh_hans
  text: 弟兄们，我们每个人都要庄重地在自己的位分[a]上讨上帝喜悦，存着良善的良心，不越过为自己的服事所定的规范。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “位分”也可译作“班次”或“次序中的位置”。
    reason: τάγμα可指等级、队列、班次或秩序中的位置；正文采用较自然且不把具体制度说死的译法。
lexical_decisions:
- source_word: τάγματι
  choice: 位分
  rationale: 此词表示人在既定秩序中的位置、等级或班次；“位分”既自然，又保留其秩序与职责色彩，不擅自加入“受任命”的含义。
- source_word: εὐαρεστείτω τῷ θεῷ
  choice: 讨上帝喜悦
  rationale: 准确表达主动命令语气，即以自己的行为使上帝喜悦；也是现代汉语中自然且庄重的宗教表达。
- source_word: ἐν ἀγαθῇ συνειδήσει ὑπάρχων
  choice: 存着良善的良心
  rationale: 保留“良善”这一正面而宽泛的描述，并以“存着”体现持续状态，避免将其收窄为仅仅“无愧”。
- source_word: ὡρισμένον…κανόνα
  choice: 所定的规范
  rationale: ὡρισμένον指已经划定或规定，κανών指准则、规范或界限；译文兼顾二者，且与“不越过”的空间隐喻相合。
- source_word: λειτουργίας
  choice: 服事
  rationale: 在本段礼仪与职分语境中指履行的公共或宗教服务；“服事”保留服务与职务两方面，不限定为后世某一特定圣职。
- source_word: ἐν σεμνότητι
  choice: 庄重地
  rationale: 表达端庄、郑重、可敬的行事方式；置于句首主要谓语前，使其可自然涵盖全句行为。
theological_decisions:
- issue: τάγμα是否应明确译作受委任的教会等级
  choice: 译作“位分”，不加入“受委任”或具体圣职名称
  alternative: 自己的受任职级／班次
  rationale: 原词本身强调秩序中的位置，但本节没有明说任命方式或具体教阶；较宽的译法避免导入后期宗派制度。
- issue: λειτουργία是否专指礼仪圣职
  choice: 译作较宽泛的“服事”
  alternative: 礼仪职务／圣职
  rationale: 上下文具有祭司与礼仪背景，但该词仍可表示所承担的服务或职责；保留这种语义张力，不把它限定为后世制度化术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讨上帝喜悦”“存着良善的良心”“服事”等表达保留早期基督教劝勉语体，同时避免生硬直译和后世宗派化术语。
