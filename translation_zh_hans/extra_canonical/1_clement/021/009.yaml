  yaml_path: translation/extra_canonical/1_clement/021/009.yaml
  text: For he is a searcher of thoughts and intentions; his breath is in us, and whenever he wills, he will take it away.
translation:
  language: zh_hans
  text: 因为他鉴察意念和心思；他的气息在我们里面，他愿意的时候，就会把它取走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρευνητής
  choice: 鉴察
  rationale: 表达深入察看、探知之意；用动词谓语比直译为“察验者”更符合现代汉语，同时保留上帝洞察人内心的语义。
- source_word: ἐννοιῶν καὶ ἐνθυμήσεων
  choice: 意念和心思
  rationale: 保留两个近义名词并列，不强行划定两者的心理学差异；“意念”和“心思”自然、庄重，也传达内在思想与盘算。
- source_word: πνοή
  choice: 气息
  rationale: 此处指维系生命的气息；“气息”既贴近词义，也与后文被取走的生命语境相合，而不扩译为“生命”。
- source_word: ἀνελεῖ
  choice: 将它取走
  rationale: 在此语境中表示除去、收回气息；“取走”保留原文以气息为宾语的表达，不直接释义为“使人死亡”。
theological_decisions:
- issue: “他的气息”与人的生命之间的关系
  choice: 按原文译作“他的气息在我们里面”
  alternative: “他赐的气息在我们里面”或“我们的生命气息来自他”
  rationale: 原文用属格 αὐτοῦ，直指“他的气息”，但没有明说“赐予”或“来自”；保留原文措辞可避免加入解释。
- issue: 取走气息的主权与时机
  choice: “他什么时候愿意，就什么时候将它取走”
  alternative: “他若愿意，就会将它取走”
  rationale: ὅταν θέλῃ 带有不定时间意味；重复“什么时候”在现代汉语中清楚表达完全取决于他的意愿，而不把句意缩减成单纯条件。
translation_notes:
  register: 采用现代、庄重且易懂的书面语。以分号维持希腊文两部分之间的紧密关系；不加脚注，因为正文足以保留原文的措辞与张力。
