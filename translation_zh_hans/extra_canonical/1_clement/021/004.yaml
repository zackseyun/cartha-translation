  text: Therefore it is right that we should not desert his will[a].
translation:
  language: zh_hans
  text: 因此，我们理当不可离弃他的旨意，擅离职守。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειποτακτεῖν
  choice: 擅离职守
  rationale: 这是带有军事色彩的动词，指离开岗位、作逃兵。译作“擅离职守”既保留其军事意象，也比笼统的“背离”更贴近原词。
- source_word: ἀπὸ τοῦ θελήματος αὐτοῦ
  choice: 从他的旨意中
  rationale: 保留介词ἀπό所表达的“从……离开”关系；θέλημα在此译为“旨意”，符合当代中文宗教语境且不额外解释其内容。
- source_word: δίκαιον οὖν ἐστίν
  choice: 因此，我们理当
  rationale: δίκαιον在此表达合宜、应当之意；“理当”自然而庄重，οὖν译作“因此”以承接上文。
theological_decisions:
- issue: “他的旨意”与军事隐喻的关系
  choice: 保留“从他的旨意中擅离职守”这一略带陌生感的表达
  alternative: 不可背离他的旨意
  rationale: 较顺畅的替代译法会消除λειποτακτεῖν所含的军伍、岗位和逃离意象；现译不把“旨意”具体化，也不引入额外的教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“擅离职守”刻意保留原文军事隐喻；全句维持原文的否定式劝诫，而不改写为正面的“坚守”。
