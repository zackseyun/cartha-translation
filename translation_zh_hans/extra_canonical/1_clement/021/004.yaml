    rationale: “擅离职守”通常以职务、岗位或职责为语义对象；“旨意”并非“职守”所在之处。原文虽将军事性动词用于“从他的旨意”这一抽象对象，中文宜以“离弃……，擅离职守”重现这一张力，而不造成不通顺的空间结构。
