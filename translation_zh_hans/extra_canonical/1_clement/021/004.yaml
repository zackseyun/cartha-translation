review_pass:
  verdict: revise
  source_fidelity: 原文δίκαιον οὖν ἐστίν可译为“因此，我们理当”；μὴ λειποτακτεῖν ἡμᾶς ἀπὸ τοῦ θελήματος αὐτοῦ的核心是不可从他的旨意离开，如同逃兵离开岗位。草稿以“擅离职守”保留了军事隐喻，但“从他的旨意中擅离职守”在汉语中把“旨意”不自然地处理成可供任职的场所，句法关系不清。
  naturalness: “从……中擅离职守”不合现代汉语常用搭配。“离弃他的旨意，擅离职守”以并列方式表达离开其旨意与军事性的离岗意象，庄重、清楚，也不将旨意具体化。
  terminology: “旨意”适切对应θέλημα，并符合本段宗教性书面语体。“擅离职守”可保留λειποτακτέω的军事性“离岗／逃兵”联想；“离弃”自然呈现ἀπό所标示的脱离关系。
  issues:
