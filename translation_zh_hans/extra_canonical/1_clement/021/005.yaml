  text: μᾶλλον ἀνθρώποις ἄφροσι καὶ ἀνοήτοις καὶ ἐπαιρομένοις καὶ ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν προσκόψωμεν ἢ τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/005.yaml
  text: Rather, let us offend foolish and senseless men, who are puffed up and boast in the arrogance of their speech, rather than God.
translation:
  language: zh_hans
  text: 我们宁可得罪那些愚昧无知、在自己狂妄的言语中自高自夸的人，也不要得罪上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκόψωμεν
  choice: 得罪
  rationale: 此处与人和上帝分别构成比较，语境所指是冒犯、触犯；“得罪”在现代汉语中自然，并保留其关系层面的力度。
- source_word: ἄφροσι καὶ ἀνοήτοις
  choice: 愚昧无知
  rationale: 分别体现缺乏明智与缺乏理解力，两词并列译出，同时符合自然汉语表达。
- source_word: ἐπαιρομένοις
  choice: 自高
  rationale: 表达自我抬高、心高气傲之意；与后面的“自夸”形成原文两个分词的并列。
- source_word: ἐγκαυχωμένοις
  choice: 自夸
  rationale: 保留以自身言语为夸耀资本的含义，避免加入原文没有的宗派性解释。
- source_word: ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν
  choice: 因自己的言语而自高自夸
  rationale: 原短语可指在其言语的狂妄中夸口，也可指凭借其夸大的言辞夸口；正文采用顺畅而不过度限定的因由表达。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 采用现代标准汉语中庄重且广泛通行的 θεός 对应词。
theological_decisions:
- issue: 比较句是否补出第二个“得罪”
  choice: 也不要得罪上帝
  alternative: 而不是上帝
  rationale: 希腊文后半省略与前半共用的 προσκόψωμεν；汉语补出谓语可清楚表达“宁可得罪人，也不要得罪上帝”的比较关系，不改变原意。
- issue: λόγος 的具体所指
  choice: 言语
  alternative: 言论／话语
  rationale: 采用涵盖面较广的“言语”，不把它限定为教义、讲论或修辞能力，从而保留原文语义空间。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“宁可……也不要……”自然重现 μᾶλλον…ἢ… 的比较取舍结构；保留“愚昧无知”“自高自夸”的并列修辞。
