  text: For somewhere it says[a], “The Spirit of the Lord is a lamp, searching the inner chambers of the belly.”
translation:
  language: zh_hans
  text: 因为有话说：“主的灵是一盏灯，探察腹中的密室。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ που
  choice: 因为有一处说
  rationale: 保留 γάρ 的因果承接和 που 的不特指引文方式，符合早期基督教文献引用经文时的表达。
- source_word: Πνεῦμα κυρίου
  choice: 主的灵
  rationale: 直译希腊文属格结构，不把“灵”具体化为人的灵或圣灵，以保留原文可能存在的理解空间。
- source_word: λύχνος
  choice: 明灯
  rationale: 指用于照明的灯；“明灯”在现代汉语中自然庄重，也凸显其照察功能。
- source_word: ἐρευνῶν
  choice: 察验
  rationale: 该分词表示搜寻、探察；“察验”既体现深入查察，又适合智慧文学语境。
- source_word: τὰ ταμιεῖα τῆς γαστρός
  choice: 腹中的密室
  rationale: ταμιεῖα 在此比喻人最深处、隐秘之处，“密室”优于字面而易引起误解的“储藏室”；γαστήρ 的身体意象则以“腹中”保留。
theological_decisions:
- issue: “主的灵”所指为何
  choice: 保留“主的灵”
  alternative: 译作“人的灵”或明确译作“圣灵”
  rationale: 现有希腊文本明确为 Πνεῦμα κυρίου；虽其所引箴言的其他文本传统可能有所不同，译文不据此改写或强行确定神学指称。
- issue: “腹中的密室”的比喻意义
  choice: 保留身体意象与隐秘空间意象
  alternative: 意译为“人的内心深处”
  rationale: 原文同时使用 γαστήρ 与 ταμιεῖα；保留二者可避免消解古代智慧文学鲜明而有张力的隐喻。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。句式简洁，保留引文公式以及“腹中密室”这一古代身体—内在生命隐喻；本节无需脚注，因为中文“密室”已准确表达经修订确认的语境义。
