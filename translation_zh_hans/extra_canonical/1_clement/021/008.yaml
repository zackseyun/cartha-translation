source:
  edition: Funk 1901 (normalized OCR)
  text: τὰ τέκνα ἡμῶν τῆς ἐν Χριστῷ παιδείας μεταλαμβανέτωσαν· μαθέτωσαν, τί ταπεινοφροσύνη παρὰ θεῷ ἰσχύει, τί ἀγάπη ἁγνὴ παρὰ θεῷ δύναται, πῶς ὁ φόβος αὐτοῦ καλὸς καὶ μέγας καὶ σῴζων πάντας τοὺς ἐν αὐτῷ ὁσίως ἀναστρεφομένους ἐν καθαρᾷ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/008.yaml
  text: Let our children partake of the discipline that is in Messiah. Let them learn what humility accomplishes before God[a], what pure love is able to do before God, how his fear is good and great and saves all who live in holiness in him, with a pure mind.
translation:
  language: zh_hans
  text: 愿我们的儿女领受在弥赛亚里的教养。愿他们明白：谦卑在上帝面前有何力量[a]，纯洁的爱在上帝面前能做什么；敬畏他是何等美好、何等伟大，并且能拯救所有以清洁的心思在其中[b]虔诚度日的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谦卑在上帝面前能成就什么。”
    reason: τί……ἰσχύει既可强调谦卑所具有的力量，也可表达它所产生的功效。
  - marker: b
    text: “其中”可能指“在敬畏中”；也可能指“在他里面”，即在上帝里面。
    reason: 希腊语代词αὐτῷ为阳性单数，其先行词存在真实的指代歧义。
lexical_decisions:
- source_word: παιδείας
  choice: 教养
  rationale: 该词兼有教导、训练和管教之意；“教养”在本句涉及儿女的语境中自然，并保留塑造品格的含义。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: Χριστός对应“受膏者／弥赛亚”；依本项目术语惯例译为“弥赛亚”。
- source_word: ταπεινοφροσύνη ... ἰσχύει
  choice: 谦卑……有何力量
  rationale: 保留ἰσχύει的“有力量、能发挥效力”之义，也反映τί在此询问程度或效力的句法。
- source_word: ἀγάπη ἁγνή ... δύναται
  choice: 纯洁的爱……有何功效
  rationale: 自然表达δύναται在此所指的能力或效力，同时与前一分句形成对应。
- source_word: ὁσίως ἀναστρεφομένους
  choice: 虔诚度日
  rationale: ἀναστρέφομαι在伦理语境中指生活、行事；ὁσίως表示虔敬、圣洁地，合译为“虔诚度日”简洁自然。
- source_word: ἐν καθαρᾷ διανοίᾳ
  choice: 以清洁的心思
  rationale: διάνοια指心思、思想或内在意念；“心思”比单译“心”更贴近原词，同时符合现代汉语表达。
theological_decisions:
- issue: ἐν αὐτῷ的所指
  choice: 正文译作“在其中”，并加注说明歧义
  alternative: “在他里面”，指上帝
  rationale: αὐτῷ在语法上既可回指较近的阳性名词“敬畏”，也可能指上帝；用“其中”并加脚注，避免在正文中武断消除原文的指代张力。
- issue: φόβος αὐτοῦ的含义
  choice: 敬畏他
  alternative: 惧怕他
  rationale: 上下文称这种φόβος为美好、伟大且施行拯救，故“敬畏”更准确传达带有虔敬和尊崇的畏惧，而非单纯恐惧。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；两个祈愿句以“愿”开头，保持劝勉语气。后半句保留原文层层推进的并列结构，同时以分号改善中文可读性。
