  text: ἴδωμεν, πῶς ἐγγύς ἐστιν, καὶ ὅτι οὐδὲν λέληθεν αὐτὸν τῶν ἐννοιῶν ἡμῶν οὐδὲ τῶν διαλογισμῶν ὧν ποιούμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/003.yaml
  text: Let us see how near he is[a], and that nothing of our thoughts nor of the reasonings we make has escaped his notice.
translation:
  language: zh_hans
  text: 让我们看看他离我们有多么近，也看看我们的意念和我们所作的思量，没有一样逃过他的察觉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: 让我们看看
  rationale: 保留劝勉式语气；这里不只是肉眼观看，也包含省察、认识之意，现代汉语“看看”在上下文中可自然承载这一含义。
- source_word: ἐγγύς
  choice: 离我们多么近
  rationale: 按希腊文表达临近、贴近之意，并补出汉语所需的关系对象“我们”，不改变所指。
- source_word: ἐννοιῶν
  choice: 意念
  rationale: 该词指内心的念头、想法或意向；“意念”庄重而通俗，并与下文“思量”有所区分。
- source_word: διαλογισμῶν ὧν ποιούμεθα
  choice: 心中的思量
  rationale: διαλογισμός可指推想、盘算、思忖；配合中间语态ποιούμεθα，译为人内心所进行或形成的“思量”，避免生硬直译为“我们所作的推理”。
- source_word: οὐδὲν λέληθεν αὐτόν
  choice: 没有一样能瞒过他
  rationale: 准确表达“没有任何事逃过他的察觉”；“瞒过他”是自然现代汉语，也保留其无所隐藏的语义。
theological_decisions:
- issue: “他”的身份与全知含义
  choice: 保留原文代词“他”，不在正文增补“上帝”或“主”
  alternative: 译作“上帝”或“主”，并将句意明确表述为神的全知
  rationale: 本节希腊文仅有代词αὐτόν；虽上下文很可能指上帝，译文不应在本句中替原文明确未明说的称谓。“没有一样能瞒过他”则忠实保留原句关于人的内在思想无法向他隐藏的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“也要明白”使并列的ὅτι从句在汉语中衔接自然；“意念”和“心中的思量”保留原文两组近义内心活动，而不强行赋予过度精细的术语差别。
