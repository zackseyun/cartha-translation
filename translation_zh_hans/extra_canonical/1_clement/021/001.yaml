  text: Ὁρᾶτε, ἀγαπητοί, μὴ αἱ εὐεργεσίαι αὐτοῦ αἱ πολλαὶ γένωνται εἰς κρίμα πᾶσιν ἡμῖν, ἐὰν μὴ ἀξίως αὐτοῦ πολιτευόμενοι τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ ποιῶμεν μεθ’ ὁμονοίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/001.yaml
  text: See to it, beloved, that his many benefits do not become a judgment against us all, if we do not conduct ourselves worthily of him and do what is good and pleasing before him in concord.
translation:
  language: zh_hans
  text: 亲爱的弟兄姊妹，你们要谨慎，免得他所赐的许多恩惠成为对我们众人的审判；若我们不按与他相称的方式行事为人[a]，又不以同心和睦做他面前美好而蒙悦纳的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行事为人”所译的希腊语也可带有“作为公民生活、履行公民本分”的意味。
    reason: 保留 πολιτεύομαι 的公民与公共生活色彩，而不使正文显得生硬。
lexical_decisions:
- source_word: εὐεργεσίαι
  choice: 恩惠
  rationale: 该词指施惠者所给予的恩泽或益处；“恩惠”既保留受惠关系，也比泛泛的“美好礼物”更贴近原词。
- source_word: πολιτευόμενοι
  choice: 行事为人
  rationale: 原词可指履行公民身份、按某种准则生活；正文采用自然的现代汉语表达，并以脚注保留其公民生活色彩。
- source_word: κρίμα
  choice: 审判
  rationale: 保留原词所表达的司法性判断，不擅自强化为已经定罪或刑罚。
- source_word: ὁμονοίας
  choice: 和睦同心
  rationale: 兼顾“和睦、协调一致”的公共共同体含义，也呼应本书反对纷争的主题。
theological_decisions:
- issue: “他的”所指对象
  choice: 保留“他”
  alternative: 明确译为“上帝”或“主”
  rationale: 本句本身使用代词，具体所指依赖上文；不在译文中补明，以免消除原文的篇章指涉。
- issue: 恩惠与审判的关系
  choice: 译为“恩惠恐怕会成为……审判”
  alternative: 译为“恩惠会使我们被定罪”
  rationale: 保留原文带警戒意味的条件结构及张力，不把 κρίμα 直接解释成最终定罪。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“亲爱的弟兄姊妹”自然表达复数称呼 ἀγαπητοί；句式调整为汉语条件句，但保留原文的警告、共同体责任和“和睦”主题。
