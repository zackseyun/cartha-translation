  to: 亲爱的弟兄姊妹，你们要谨慎，免得他所赐的许多恩惠成为对我们众人的审判；若我们不按与他相称的方式行事为人[a]，又不以同心和睦做他面前美好而蒙悦纳的事。
  rationale: 仅调整句法和警戒语气：“免得”更直接对应 μὴ…γένωνται，并使条件分句清楚说明恩惠何以会成为审判。保留原有关键词与脚注，不增加原文未明说的神学解释。
