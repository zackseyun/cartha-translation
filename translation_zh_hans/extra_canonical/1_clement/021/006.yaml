revisions:
- from: 我们要敬重主耶稣基督[a]，他的血为我们而献出；要敬重那些走在我们前面的人；要尊敬长老；要用敬畏上帝的训育教导年轻人[b]；要引导我们的妻子[c]向善。
  to: 我们要敬畏主耶稣基督[a]，他的血为我们而献出；要敬重那些走在我们前面的人；要尊敬长老；要以敬畏上帝的训育培育年轻人[b]；要劝导我们的妻子[c]归向善。
  rationale: 修订仅为提高原文语义和现代汉语表达的精确度：“敬畏”更贴近对主的 ἐντραπῶμεν 所表达的敬畏性尊崇；“以……训育培育”自然呈现 παιδεύσωμεν τὴν παιδείαν 的同源搭配；“劝导……归向善”补回 διορθωσώμεθα 的整饬、归正意味。其余译文及脚注锚点均予保留。
