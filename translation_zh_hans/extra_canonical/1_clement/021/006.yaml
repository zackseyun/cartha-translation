reference: 1 Clement 21:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸν κύριον Ἰησοῦν Χριστόν, οὗ τὸ αἷμα ὑπὲρ ἡμῶν ἐδόθη, ἐντραπῶμεν, τοὺς προηγουμένους ἡμῶν αἰδεσθῶμεν, τοὺς πρεσβυτέρους τιμήσωμεν, τοὺς νέους παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ, τὰς γυναῖκας ἡμῶν ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/006.yaml
  text: Let us have reverence for the Lord Jesus Christ[a], whose blood was given for us; let us respect those who go before us; let us honor the elders; let us train the young in the discipline of the fear of God[c][b]; let us direct our wives toward what is good.
translation:
  language: zh_hans
  text: 我们要敬畏主耶稣基督[a]，他的血为我们而献出；要敬重那些走在我们前面的人；要尊敬长老；要以敬畏上帝的训育培育年轻人[b]；要劝导我们的妻子[c]归向善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，即与“弥赛亚”相对应的称号。
    reason: 说明希腊语 Χριστός 是称号，并保留其与“弥赛亚”的对应关系。
  - marker: b
    text: “敬畏上帝的训育”也可理解为“由敬畏上帝而来的训育”或“以敬畏上帝为内容的训育”。
    reason: 希腊语属格结构可有不止一种关系，正文不宜将其缩窄。
  - marker: c
    text: “妻子”所对应的希腊语也可译作“妇女”；这里的所有格和家庭语境较支持“妻子”。
    reason: 保留 γυνή／γυναῖκες 在“妇女”和“妻子”之间的词义歧义。
lexical_decisions:
- source_word: ἐντραπῶμεν
  choice: 敬重
  rationale: 该词在此表示因尊崇而有所顾忌、心存敬畏；“敬重”在现代汉语中自然庄重，又不把语义限定为恐惧或羞愧。
- source_word: τοὺς προηγουμένους ἡμῶν
  choice: 那些走在我们前面的人
  rationale: 保留 προηγέομαι“走在前面、居先”的形象和一定开放性，不径直解释为拥有正式职位的“领袖”。
- source_word: τοὺς πρεσβυτέρους
  choice: 长老
  rationale: 此词既可指年长者，也可指群体中的长老；译作“长老”符合早期教会语境，同时保留身份与年龄之间的张力。
- source_word: τοὺς νέους
  choice: 年轻人
  rationale: νέους是“年轻的”这一原级形容词名词化，并非比较级“较年轻的人”。
- source_word: παιδεύσωμεν τὴν παιδείαν
  choice: 用……的训育教导
  rationale: 以“训育／教导”体现同根词 παιδεύω 与 παιδεία 所涵盖的教育、训练和管束之意，同时避免生硬重复。
- source_word: τὰς γυναῖκας ἡμῶν
  choice: 我们的妻子
  rationale: γυναῖκας可指“妇女”或“妻子”，但所有格“我们的”及家庭伦理语境更支持“妻子”；另以脚注保留词义可能性。
- source_word: ἐπὶ τὸ ἀγαθόν
  choice: 向善
  rationale: 简洁表达“朝向美善之事”，保留目标和方向性。
theological_decisions:
- issue: Χριστός的称号含义
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”是中文读者熟悉的称号；脚注提示其意为“弥赛亚”，避免将其仅当作姓名。
- issue: τοῦ φόβου τοῦ θεοῦ的属格关系
  choice: 敬畏上帝的训育
  alternative: 由敬畏上帝而来的训育；以敬畏上帝为内容的训育
  rationale: 直译式结构保留属格可能表示内容、性质或来源的歧义，不在正文中强行判定。
- issue: “长老”是年龄还是职分
  choice: 长老
  alternative: 年长者
  rationale: 上下文不足以完全排除任一含义；“长老”在中文中可承载早期教会职分意味，而原词的年龄背景仍可被感知。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉体，以连续的“要……”再现希腊文一连串第一人称复数劝勉虚拟式。正文尽量保留原文的平行节奏与词义开放性；“他的血为我们而献出”紧贴被动式 ἐδόθη，不额外说明献血的施事者或赎罪机制。
