    rationale: 原文谓语直接以“爱”为宾语；“平等对待”虽意近，却改换表达焦点。译作“向……平等地施予爱”更贴合原文。
  revised_text: 愿她们显出纯洁的可爱品格；愿她们表明自己温柔的纯正心志；愿她们借着静默显明自己言语的温和；愿她们不按偏袒施予爱，而要以敬虔之心平等地向所有敬畏上帝的人施予爱。
