  - severity: medium
    issue: ὁσίως译为“圣洁地”不够贴切
    rationale: ὁσίως主要表达敬虔、虔敬、合乎对神的敬畏；“以敬虔之心”既自然，也保留它修饰施爱方式的理解。
  - severity: low
