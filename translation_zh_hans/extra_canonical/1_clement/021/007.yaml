base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/007.yaml
  text: Let them show the lovely character of purity; let them demonstrate the sincere disposition of their gentleness; let them make the moderation of their tongue evident through silence; let them extend their love not according to partiality, but equally to all who fear God in holiness.
translation:
  language: zh_hans
  text: 愿她们显出纯洁的可爱品格；愿她们表明自己温柔的纯正心志；愿她们借着静默显明自己言语的温和；愿她们不按偏袒施予爱，而要以敬虔之心平等地向所有敬畏上帝的人施予爱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁγνείας
  choice: 贞洁
  rationale: 此词指道德与生活上的纯洁；结合本节对品格和行为的劝勉，“贞洁”既保留传统伦理含义，也自然凝练。
- source_word: ἀκέραιον
  choice: 纯正
  rationale: 基本义为完整、未掺杂，修饰心志时译作“纯正”，表达真诚而无杂念，避免误解为单指坦率。
- source_word: βούλημα
  choice: 心志
  rationale: 在此指内在的意愿或倾向；“心志”比单纯的“意图”更适合与温柔这一品格相连。
- source_word: ἐπιεικὲς
  choice: 温和
  rationale: 词义可涵盖温良、克制、宽厚；用于舌头或言语时，“温和”自然传达有节制、不苛厉的表达。
- source_word: σιγῆς
  choice: 静默
  rationale: 直译其不说话、保持安静之意，并保留“借静默显明言语温和”这一带张力的修辞。
- source_word: προσκλίσεις
  choice: 偏爱
  rationale: 复数名词指偏向、徇情或偏袒；译为“偏爱”符合现代汉语，并以“不因……而有分别”展现其实际含义。
- source_word: ὁσίως
  choice: 圣洁地
  rationale: 副词表达合乎敬虔、圣洁的方式；保留为修饰平等施爱的方式，不擅自改作修饰“敬畏上帝的人”。
theological_decisions:
- issue: ὁσίως 的句法归属
  choice: 理解为修饰“平等对待／施予爱”的方式：圣洁地平等对待
  alternative: 理解为与“敬畏上帝的人”关系更密切，译作“所有圣洁地敬畏上帝的人”
  rationale: ὁσίως 位于 πᾶσιν τοῖς φοβουμένοις τὸν θεὸν 与 ἴσην παρεχέτωσαν 之间，句法上存在一定弹性；但副词更自然地修饰谓语 παρεχέτωσαν，故正文如此处理，同时不增加宗派性解释。
- issue: πᾶσιν τοῖς φοβουμένοις τὸν θεόν 的对象范围
  choice: 所有敬畏上帝的人
  alternative: 所有敬畏神的人
  rationale: 按原文明确限定爱的平等对象，不将其扩展为毫无限定的普遍对象；“上帝”符合现代标准普通话的庄重表达。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉体，以四个平行的“愿她们”保留希腊文连续命令式的节奏。根据本章语境及希腊语阴性复数形式，使用“她们”。“借着静默显明言语的温和”刻意保留原文修辞上的张力。
