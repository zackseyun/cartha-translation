revisions:
- from: 愿她们显出贞洁那可爱的品格；愿她们表明自己温柔纯正的心志；愿她们借着静默显明自己言语的温和；愿她们施予爱，不因偏爱而有分别，而是圣洁地平等对待所有敬畏上帝的人。
  to: 愿她们显出纯洁的可爱品格；愿她们表明自己温柔的纯正心志；愿她们借着静默显明自己言语的温和；愿她们不按偏袒施予爱，而要以敬虔之心平等地向所有敬畏上帝的人施予爱。
  rationale: 将“贞洁”改为涵盖更广的“纯洁”，并将ὁσίως改译为“以敬虔之心”。末句恢复“爱”作为直接施予的内容，避免由“施予爱”转成“对待”的语义转换；其余保留原译的女性复数指称、四重劝勉节奏和庄重现代文体。
