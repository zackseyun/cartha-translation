lexical_decisions:
- source_word: πύλη
  choice: 门
  rationale: 准确表达供人进入的门或门口；此处采用简洁、自然且保留经文意象的译法。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 保留属格关系，并依照早期基督教文献及其所引诗篇的惯常称谓译为“主”。
- source_word: δίκαιοι
  choice: 义人
  rationale: 表达“公义的人”，也是现代中文圣经语体中清楚而庄重的惯用称呼。
- source_word: εἰσελεύσονται
  choice: 要……进去
  rationale: 体现将来时态，同时用现代汉语自然表达进入的动作。
- source_word: ἐν αὐτῇ
  choice: 从这门
  rationale: 希腊语介词结构在此表达经由该门进入；译为“从这门”比直译“在其中”更符合现代汉语。
