  text: πολλῶν οὖν πυλῶν ἀνεῳγυιῶν ἡ ἐν δικαιοσύνῃ αὕτη ἡ ἐστὶν ἡ ἐν Χριστῷ, ἐν ᾗ μακάριοι πάντες οἱ εἰσελθόντες καὶ κατευθύνοντες τὴν πορείαν αὐτῶν ἐν ὁσιότητι καὶ δικαιοσύνῃ, ἀταράχως πάντα ἐπιτελοῦντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/004.yaml
  text: Therefore[a], though many gates stand open, this gate in righteousness is the one in Christ, in which all who have entered and are directing their course in holiness and righteousness, accomplishing all things without disturbance[b], are blessed.
translation:
  language: zh_hans
  text: 因此，许多门既已敞开，这在义中的门就是在基督里的门；凡进入其中，并在圣洁和公义中使自己的道路正直、毫无纷扰地完成一切事的人，都是有福的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  choice: 义／公义
  rationale: 同一希腊词在两处分别依汉语搭配译作“义”和“公义”：前者保留“在义中的门”的凝练结构，后者与“圣洁”并列时用“公义”更自然庄重。
- source_word: Χριστός
  choice: 基督
  rationale: 此处“在基督里”已是早期基督教文献中的固定表达；译作“基督”比还原为“弥赛亚”更符合语境。
- source_word: κατευθύνω
  choice: 端正……道路
  rationale: 该词有使之笔直、引导正确之意；“端正自己道路”既保留主动意味，也符合中文伦理劝勉语体。
- source_word: ἀταράχως
  choice: 毫无纷扰地
  rationale: 保留“不受扰乱、平静无乱”的语义范围，不将其过窄解释为“不制造纷争”。
- source_word: ἐπιτελέω
  choice: 完成
  rationale: 表达把各样事务实行到底、完成之意，并维持原文概括性的“完成一切事”。
theological_decisions:
- issue: “在义中的门”与“在基督里的门”的关系
  choice: 译作同一扇门：“这扇在义中的门，就是在基督里的门”
  alternative: “这就是那扇在义中的门——在基督里的门”
  rationale: 原文重复阴性冠词并省略“门”，最自然地将两个介词短语所限定的门等同起来；不额外解释“义”与“基督”的神学关系。
- issue: 进入与持续行路的时态关系
  choice: “进入其中，并……端正自己道路”
  alternative: “已经进入其中，并正在……引导自己路程”
  rationale: “进入”对应不定过去分词，先于现在分词所表达的持续行进；中文无需机械标出完成体和进行体，也能自然呈现先进入、继而行路的关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。整体保留原文长句的论证关系，但分为两句以避免中文结构过度缠绕；“在义中”“在基督里”保留原文重要的介词表达及其神学张力。
