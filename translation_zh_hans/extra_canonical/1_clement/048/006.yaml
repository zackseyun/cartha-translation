source:
  edition: Funk 1901 (normalized OCR)
  text: . τοσούτῳ γὰρ μᾶλλον ταπεινοφρονεῖν ὀφείλει, ὅσῳ δοκεῖ μᾶλλον μείζων εἶναι, καὶ ζητεῖν τὸ κοινωφελὲς πᾶσιν, καὶ μὴ τὸ ἑαυτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/006.yaml
  text: For he ought to be all the more humble[a], the greater he seems to be, and to seek what is beneficial to all, and not what is his own.
translation:
  language: zh_hans
  text: 因为，一个人越显得更为显要，就越应当谦卑，并且要寻求对众人有益的事，而不是自己的利益。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινοφρονεῖν
  choice: 谦卑
  rationale: 表达谦逊自持的态度，符合现代汉语宗教与一般伦理语境，也不额外引入自我贬抑之意。
- source_word: δοκεῖ μᾶλλον μείζων εἶναι
  choice: 越显得尊大
  rationale: 保留 δοκεῖ“显得、看来”的认识限定，不把外在评价断言为实际地位；“尊大”自然表达 μείζων 在身份或声望方面的较高。
- source_word: τὸ κοινωφελὲς πᾶσιν
  choice: 对众人有益的事
  rationale: 贴近该中性名词化表达，既涵盖共同益处，也保持行动所追求对象的宽泛性。
- source_word: τὸ ἑαυτοῦ
  choice: 自己的利益
  rationale: 原文为省略式中性名词化结构；结合与“对众人有益的事”的对照，补出“利益”使中文清楚自然。
theological_decisions:
- issue: δοκεῖ 是否暗示所谓尊大并不真实
  choice: 译作“显得尊大”
  alternative: “越是尊大”
  rationale: 保留原文对人的观感或评价所作的限定，不裁定其尊大是真实、表面还是自认为如此。
- issue: γὰρ 与上文的逻辑关系
  choice: 译作“因为”
  alternative: “然而”
  rationale: γὰρ 表示解释或理由，而非转折；此处说明越被视为尊大，越有谦卑并求众人益处的责任。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“越……就越……”自然再现 τοσούτῳ μᾶλλον…ὅσῳ μᾶλλον 的比例关联；不设脚注，因为译文已直接保存主要语义与原文的认识限定。
