source:
  edition: Funk 1901 (normalized OCR)
  text: πύλη γὰρ δικαίσύνης ἀνεῳγυῖα εἰς ζωὴν αὐτὴ, καθὼς γέγραπται· Ἀνοίξατέ μοι πύλας δικαιοσύνης· εἰσελθὼν ἐν αὐταῖς ἐξομολογήσομαι τῷ κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/002.yaml
  text: 'For this is the gate of righteousness[a], opened unto life itself, just as it is written: “Open to me the gates of righteousness; entering through them, I will give thanks to the Lord.”'
translation:
  language: zh_hans
  text: 因为这就是公义之门[a]，已经敞开，通向生命，正如经上所记：“请给我打开公义之门；我进入其中，就要称谢主。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为一道公义之门已经敞开——这门正通向生命。”
    reason: 希腊文的代词形式及句法容许将本句理解为存在句加同位说明，而非判断句。
lexical_decisions:
- source_word: πύλη δικαιοσύνης
  choice: 公义之门
  rationale: 保留原文属格结构及其与随后诗篇引文“公义之门”的直接呼应；“公义”在此比“正义”更符合敬虔与合乎神旨意的语境。
- source_word: ἀνεῳγυῖα εἰς ζωήν
  choice: 已经敞开，通向生命
  rationale: ἀνεῳγυῖα是完成时主动分词，表达门已被打开而现今仍敞开；εἰς ζωήν自然译作“通向生命”。
- source_word: ἐξομολογήσομαι
  choice: 称谢
  rationale: 在诗篇敬拜语境中，该词表示公开承认并赞颂、感谢；“称谢”比一般的“感谢”更庄重，也符合现代中文圣经语体。
- source_word: κύριος
  choice: 主
  rationale: 按引文中的神圣称谓译为“主”，不额外补入专名。
theological_decisions:
- issue: αὐτὴ的指代与句法
  choice: 这就是公义之门……通向生命
  alternative: 有一道公义之门已经敞开——这门正通向生命
  rationale: 所给文本写作αὐτὴ，但语境及校勘所反映的读法可理解为指示性的αὕτη，从而构成“这就是……门”的判断句；正文采用这一较合语境的理解，同时以脚注保留另一种句法可能。
- issue: “生命”的性质
  choice: 生命
  alternative: 永生
  rationale: 原文仅有ζωή，未明说“永恒”；不在译文中提前限定其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；引文保持诗篇式敬拜语气。正文中的脚注标记[a]与脚注完全对应。
