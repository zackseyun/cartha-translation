  to: 因为这就是公义之门[a]，已经敞开，通向生命，正如经上所记：“请给我打开公义之门；我进入其中，就要称谢主。”
  rationale: 仅作引文的现代汉语润饰：“请给我打开”自然对应“向我打开”；“进入其中”保留原文对复数“门”的回指，并以“就要”表达分词引出的后续行动。正文和脚注保留原有对句法歧义的审慎处理。
