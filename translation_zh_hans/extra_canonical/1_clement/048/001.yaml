source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐξάρωμεν οὖν τοῦτο ἐν τάχει καὶ προσπέσωμεν τῷ δεσπότῃ καὶ κλαύσωμεν ἱκετεύοντες αὐτόν, ὅπως ἵλεως γενόμενος ἐπικαταλλαγῇ ἡμῖν καὶ ἐπὶ τὴν σεμνὴν τῆς φιλαδελφίας ἡμῶν ἁγνὴν ἀγωγὴν ἀποκαταστήσῃ ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/001.yaml
  text: Let us therefore put this away quickly, and let us fall down before the Master and weep, imploring him that, having become gracious, he may be reconciled to us and restore us to the solemn and pure conduct of our brotherly love.
translation:
  language: zh_hans
  text: 所以，我们要赶快除去这事，俯伏在主宰面前，哀哭着恳求他：愿他施恩，与我们和好，使我们恢复到我们弟兄之爱的庄重而纯洁的生活方式中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恢复到我们弟兄相爱时那庄重而纯洁的生活方式中”。希腊文中“庄重”和“纯洁”都修饰“生活方式”，而非只修饰“弟兄之爱”。
    reason: 说明属格短语与“生活方式”的连接方式，并明确两个形容词的共同修饰对象。
lexical_decisions:
- source_word: Ἐξάρωμεν
  choice: 除去
  rationale: 此处指迅速清除前文所责备的事；译作“除去”既保留动作力度，也符合现代汉语表达。
- source_word: δεσπότῃ
  choice: 主宰
  rationale: 保留 δεσπότης 所含的绝对权柄意味，并与较常见的 κύριος“主”作适度区分。
- source_word: ἵλεως γενόμενος
  choice: 施恩
  rationale: 该短语表示转为恩慈、宽宥；“施恩”在祈求语境中自然，同时不把含义过度限定为某一赎罪理论。
- source_word: ἐπικαταλλαγῇ ἡμῖν
  choice: 与我们和好
  rationale: 中被动形式在此表达关系复和；直译为“与我们和好”保留了由神采取恩慈行动的语气。
- source_word: ἀγωγὴν
  choice: 行事为人
  rationale: 指生活方式、行为操守；“行事为人”比单独的“行为”更能表达持续的生活实践。
theological_decisions:
- issue: 神与人复和的表达
  choice: 他施恩，与我们和好
  alternative: 他息怒，使我们与他和好
  rationale: 原文说 ἵλεως γενόμενος ἐπικαταλλαγῇ ἡμῖν，强调主宰变得恩慈并与众人复和；不额外加入原文没有明说的“息怒”，也不改换复和行动的语法主体。
- issue: σεμνὴν 与 ἁγνὴν 的修饰对象
  choice: 弟兄之爱那庄重而纯洁的行事为人
  alternative: 庄重的弟兄之爱所应有的纯洁行为
  rationale: 两个阴性宾格形容词均与 ἀγωγὴν 一致，最自然地共同修饰“行事为人”；译文据此避免把“庄重”只归给“弟兄之爱”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“俯伏”“恳求”“行事为人”保留劝诫与祈求的宗教语域；避免生硬照搬希腊语长句，同时保持原文连续的共同劝勉语气。
