  yaml_path: translation/extra_canonical/1_clement/048/005.yaml
  text: Let one be faithful; let one be able to expound knowledge; let one be wise in discerning words; let one be pure in works.
translation:
  language: zh_hans
  text: 人当忠信，当能讲明知识，当善于辨析言辞，当在行为上纯洁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤτω
  choice: 任凭……
  rationale: 保留四次重复所形成的许可式、让步式语气；在现代汉语中比生硬的“让……成为”更自然，也不把它改写成直接命令。
- source_word: τις
  choice: 一个人
  rationale: 表达不定代词的泛指意义，不限定性别。
- source_word: πιστός
  choice: 忠信
  rationale: 兼顾“可信、忠诚”与信仰语境中的“有信心”，避免只锁定其中一义。
- source_word: δυνατὸς γνῶσιν ἐξεπεῖν
  choice: 有能力阐明知识
  rationale: ἐξεπεῖν指充分说出、讲明；“阐明”既保留表达与解释之意，也符合中文表达。
- source_word: σοφὸς ἐν διακρίσει λόγων
  choice: 善于辨析言辞
  rationale: διακρίσει表示分辨、辨别；λόγων可指话语、言论或论述，译作“言辞”以保留范围。
- source_word: ἁγνὸς ἐν ἔργοις
  choice: 在行为上纯洁
  rationale: ἁγνός表达纯洁、清白；ἔργοις是所行之事，译作“行为”自然且准确。
theological_decisions:
- issue: πιστός的语义范围
  choice: 忠信
  alternative: 有信心／忠诚
  rationale: 原词既可能强调信仰，也可能强调忠诚可靠；“忠信”保留这种张力。
- issue: ἤτω的语气
  choice: 任凭……
  alternative: 让……／即使……
  rationale: 该形式是第三人称命令式，在上下文中带许可或让步色彩；不将其强化为道德命令，也不直接添加原文没有的“即使”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以四次“任凭”对应希腊文四次ἤτω，保存排比节奏和修辞力度。
