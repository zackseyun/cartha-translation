  source_fidelity: 原文的命令是“把……遣回/送回我们这里”，草稿的“让……回到”虽通顺，却将收信人的遣送行动弱化为容许其自行返回。改为“将……遣回我们这里”更准确保留ἀναπέμψατε的使役、遣返含义。
  naturalness: 修订句在现代汉语书信语体中自然、庄重；“平安、欢喜地”分别表达“在平安中”和“带着喜乐”，避免把两个名词压缩为较固定的宗教性搭配“平安喜乐”。
  terminology: 人名按希腊文所指的完整罗马姓名一致音译为“克劳狄乌斯·埃斐布斯”和“瓦勒里乌斯·比托”。不添加身份、职分或神学解释。
  issues:
