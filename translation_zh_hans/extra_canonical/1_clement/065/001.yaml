    issue: “让……回到我们这里”未充分表达ἀναπέμψατε。
    rationale: ἀναπέμπω在这里指将使者遣回、送回；中文“让……回到”可理解为准许他们自行回来，遣送的动作和对收信人的要求不够明确。
  - severity: low
    issue: “平安喜乐地”将两个原文表达凝结为固定搭配。
    rationale: ἐν εἰρήνῃ μετὰ χαρᾶς逐项为“在平安中、带着喜乐”；“平安、欢喜地”既自然，也较清楚保留二者的并列关系。
  - severity: low
