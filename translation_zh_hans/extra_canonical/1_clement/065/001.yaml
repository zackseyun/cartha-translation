  yaml_path: translation/extra_canonical/1_clement/065/001.yaml
  text: Send back to us quickly, in peace and with joy, the men sent from us—Claudius Ephebus and Valerius Bito, together with Fortunatus—
translation:
  language: zh_hans
  text: 请尽快将我们所差派的克劳狄乌斯·埃斐布斯、瓦勒里乌斯·比托，以及福图纳图斯，平安、欢喜地遣回我们这里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοὺς δὲ ἀπεσταλμένους ἀφʼ ἡμῶν
  choice: 我们所差派的
  rationale: ἀπεσταλμένους是完成时被动分词，指先前由“我们”差派出去的人；中文用“我们所差派的”自然表达其关系。δέ在此承接并转入请求，无须机械译作“现在”或“但是”。
- source_word: ἐν τάχει ἀναπέμψατε πρὸς ἡμᾶς
  choice: 请尽快……回到我们这里
  rationale: ἀναπέμψατε是命令式，意为送回、遣回；鉴于受事者是人，中文用使役式“让……回到”较自然。“请”使书信请求符合现代汉语语体，并未削弱命令语气。
- source_word: ἐν εἰρήνῃ μετὰ χαρᾶς
  choice: 平安喜乐地
  rationale: 保留εἰρήνη与χαρά两个并列概念，以简洁而庄重的现代汉语表达其状态或方式。
- source_word: Κλαύδιον Ἔφηβον καὶ Οὐαλέριον Βίτωνα σὺν καὶ Φορτουνάτῳ
  choice: 克劳狄·埃斐波、瓦勒里·比托，以及福图纳图斯
  rationale: 按希腊文音译三个人名；用“以及”体现σὺν καί所补充的第三人，同时不额外推断其身份或差派关系的细微差别。
