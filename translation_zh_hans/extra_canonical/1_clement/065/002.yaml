  text: so that they may report to us all the sooner the peace and concord we have prayed for and desired[a], in order that we too may more quickly rejoice concerning your good order.
translation:
  language: zh_hans
  text: 好让他们尽快把我们所祈求、所渴望的和平与和睦的消息带给我们[a]，使我们也能早日因你们安定有序而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所祈求、所渴望的”也可译作“我们热切祈求的”。
    reason: 希腊文以两个并列形容词修饰“和平与和睦”；其中 εὐκταίαν 可强调祈求或祈愿，ἐπιποθήτην 则强调渴望。合译可突出两词共同表达的热切程度，但会弱化二者的区别。
lexical_decisions:
- source_word: εὐκταίαν
  choice: 所祈求的
  rationale: 该词表示祈求、祈愿的对象；这样译既保留其祷告意味，也与后面的 ἐπιποθήτην 区分开来。
- source_word: ἐπιποθήτην
  choice: 所渴望的
  rationale: 表达强烈盼望和向往，补足两个并列形容词的意义。
- source_word: εἰρήνην καὶ ὁμόνοιαν
  choice: 和平与和睦
  rationale: 分别保留“和平”和“一致、和谐”的含义，避免合并而损失修辞上的并列。
- source_word: ἀπαγγέλλωσιν ἡμῖν
  choice: 把……的消息带给我们
  rationale: ἀπαγγέλλω 表示报告、传达消息；结合受差者返回的语境，此译比生硬的“向我们报告和平”更自然。
- source_word: εὐσταθείας
  choice: 安定有序
  rationale: 该词兼有稳固、安定及秩序良好的意味；并列表达可较完整地传达其语义范围。
