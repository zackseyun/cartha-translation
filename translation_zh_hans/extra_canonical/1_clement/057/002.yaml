source:
  edition: Funk 1901 (normalized OCR)
  text: μάθετε ὑποτάσσεσθαι, ἀποθέμενοι τὴν ἀλαζόνα καὶ ὑπερήφανον τῆς γλώσσης ὑμῶν αὐθάδειαν· ἄμεινον γάρ ἐστιν ὑμῖν, ἐν τῷ ποιμνίῳ τοῦ Χριστοῦ μικροὺς καὶ ἐλλογίμους εὑρεθῆναι, ἢ καθ' ὑπεροχὴν δοκοῦντας ἐκβληθῆναι ἐκ τῆς ἐλπίδος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/002.yaml
  text: Learn to submit[a], putting away the arrogant and proud self-will of your tongue. For it is better for you to be found small and esteemed within the flock of Christ than, while seeming preeminent[b], to be cast out from his hope.
translation:
  language: zh_hans
  text: 你们要学习顺服，除去你们言语中狂妄傲慢的任性。因为，对你们来说，宁可在基督的羊群中被认作微小、被算在其中[a]，也不要看似居于高位，却被逐出他的盼望[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被算在其中”也可译作“受看重”或“受尊重”。
    reason: ἐλλογίμους可指被计入、列在成员之中，也可指受看重；本句与“被逐出”的对照使前一含义更为贴切。
  - marker: b
    text: 原文直译为“从他的盼望中”。“他的盼望”可理解为对他的盼望、与他相联的盼望，或他所赐的盼望。
    reason: αὐτοῦ与ἐλπίδος之间的属格关系存在歧义；正文保留原文措辞，脚注列出主要理解。
lexical_decisions:
- source_word: ὑποτάσσεσθαι
  choice: 顺服
  rationale: 中动/被动不定式表示使自己服从、接受秩序；“学习顺服”自然且保留劝诫力度。
- source_word: ἀλαζόνα καὶ ὑπερήφανον ... αὐθάδειαν
  choice: 狂妄骄傲的任性
  rationale: ἀλαζών与ὑπερήφανος叠加强调自夸和高傲，αὐθάδεια指自以为是、任意妄为的态度；结合“舌头”表达为言语中流露的任性。
- source_word: μικροὺς
  choice: 显得微小
  rationale: 与后文“显得高人一等”构成鲜明对照，指地位低微、不居首位，并非身体大小。
- source_word: ἐλλογίμους
  choice: 被算在其中
  rationale: 该词可指“被看重”，也可指“被计入、算在内”；上下文以“在羊群中”对照“被逐出”，成员归属义更契合，但以脚注保留另一可能。
- source_word: καθ' ὑπεροχὴν δοκοῦντας
  choice: 显得高人一等
  rationale: καθ’ ὑπεροχήν表示居于优越或突出地位，δοκοῦντας保留“看来、显得”而非实际如此。
- source_word: ἐκ τῆς ἐλπίδος αὐτοῦ
  choice: 逐出他所赐的盼望
  rationale: 直译为“从他的盼望中”，汉语容易误解为基督自己怀有的希望；正文按关系属格作较自然表达，同时脚注保留原文结构及歧义。
theological_decisions:
- issue: Χριστός的称谓
  choice: 基督
  alternative: 弥赛亚
  rationale: 在《革利免一书》的教会语境中，Χριστός已是固定称谓；“基督”既准确又符合现代汉语基督教文献惯用语。
- issue: ἐλλογίμους所表达的是归属还是尊荣
  choice: 正文采用“被算在其中”
  alternative: “受重视／受尊重”
  rationale: 本句的核心对照是留在基督羊群中与被逐出，故归属义更能呈现修辞结构；因词本身可有“受看重”义，脚注保留。
- issue: “他的盼望”的属格关系
  choice: 正文采用“他所赐的盼望”
  alternative: “他的盼望”或“对他的盼望”
  rationale: 原文属格可有多种关系，语境大概指与基督相联的救恩盼望。正文避免让读者误以为是基督本人的主观期待，脚注明确原文并保留其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“你们要学习顺服”直截了当；“舌头上……的任性”保留原文将言语器官与傲慢意志相连的形象。“显得微小／显得高人一等”呈现平行对照。所有脚注标记均已置于正文。
