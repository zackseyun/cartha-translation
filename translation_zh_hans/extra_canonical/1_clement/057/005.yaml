  text: ἔσται γάρ, ὅταν ἐπικαλέσησθέ με, ἐγὼ δὲ οὐκ εἰσακούσομαι ὑμῶν· ζητήσουσί με κακοὶ καὶ οὐχ εὑρήσουσιν. ἐμίσησαν γὰρ σοφίαν, τὸν δὲ φόβον τοῦ κυρίου οὐ προείλαντο, οὐδὲ ἤθελον ἐμαῖς προσέχειν βουλαῖς· ἐμυκτήριζον δὲ ἐμοὺς ἐλέγχους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/005.yaml
  text: For it shall be that when you call upon me, I will not listen to you; evil men will seek me and will not find me. For they hated wisdom, and did not choose the fear of the Lord, nor were they willing to attend to my counsels, but they mocked my reproofs.
translation:
  language: zh_hans
  text: 因为当你们呼求我时，我却不听你们；恶人会寻找我，却找不到我。因为他们恨恶智慧，不选择敬畏主，也不愿留心我的劝告，反而嘲笑我的责备。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσησθέ
  choice: 呼求
  rationale: 表达向某人求告、求助之意，保留宗教语境而符合现代汉语。
- source_word: οὐκ εἰσακούσομαι
  choice: 不听
  rationale: 此词在语境中不只是听见，也含不予应允之意；正文采用简洁的“不听”，不额外消解其含义。
- source_word: κακοὶ
  choice: 恶人
  rationale: 忠实对应形容词名词化的复数形式，指品行邪恶的人。
- source_word: σοφίαν
  choice: 智慧
  rationale: 采用常见且准确的对应词，并保留此处智慧作为说话者的语境关联。
- source_word: φόβον τοῦ κυρίου
  choice: 敬畏主
  rationale: “敬畏”同时保留畏惧与尊崇的宗教含义；κύριος译为“主”。
- source_word: βουλαῖς
  choice: 劝告
  rationale: 在此训诲语境中指忠告、谋略或指导；“劝告”自然且与下文“责备”相称。
- source_word: ἐμυκτήριζον
  choice: 讥笑
  rationale: 体现轻蔑、嘲弄之意，比单纯“拒绝”更贴近原词。
- source_word: ἐλέγχους
  choice: 责备
  rationale: 保留揭错、斥责和纠正的含义，符合现代宗教文体。
theological_decisions:
- issue: 神不听呼求的含义
  choice: 译作“我却不听你们”
  alternative: “我也不应允你们”
  rationale: 原文可包含不垂听、不应允之意；采用较形式对应的“不听”，避免将审判语境解释得过满。
- issue: 智慧与第一人称说话者的关系
  choice: 不增补“智慧说”或将“我”明确等同于神
  alternative: 明说“智慧说”或“神说”
  rationale: 本节所引文本以第一人称发言，同时说人恨恶智慧；译文保留这一文学与神学张力，不作额外身份判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式尽量贴近希腊文的因果与转折结构，以“反倒”明确呈现δέ的对比。原文无须设置文本异读或解释性脚注，因此正文不设脚注标记。
