  text: Therefore they will eat the fruits of their own way and be filled with their own ungodliness.
translation:
  language: zh_hans
  text: 所以，他们必吃自己道路的果子，并被自己的不敬虔充满。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοιγαροῦν
  choice: 所以
  rationale: 表达由前文推出结果的强承接关系，符合现代汉语经文语体。
- source_word: ἔδονται
  choice: 必吃
  rationale: 保留将来时所表达的确定后果；“吃……果子”也维持原文隐喻。
- source_word: τῆς ἑαυτῶν ὁδοῦ τοὺς καρπούς
  choice: 自己道路的果子
  rationale: 按原文保留“道路—果子”的审判性隐喻，不解释为较抽象的“行为后果”。
- source_word: ἀσεβείας
  choice: 不敬虔
  rationale: 该词指缺乏对上帝应有的敬畏与尊崇；“不敬虔”比“邪恶”更准确地保留其宗教伦理含义。
- source_word: πλησθήσονται
  choice: 而饱足
  rationale: 保留“被充满、吃到饱足”的意象，并与前面的“吃”自然衔接。
theological_decisions:
- issue: ἀσεβείας在结果结构中的语义关系
  choice: 因自己的不敬虔而饱足
  alternative: 被自己的不敬虔充满
  rationale: 希腊语属格可与表示充满的动词连用，原句延续进食与饱足的图像；采用“因……而饱足”保留其恶果反噬之意，同时避免把它仅处理为内在品格状态。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留原文平行结构及“道路的果子／饱足”的形象表达。
