  text: ἐπειδὴ ἐκάλουν καὶ οὐχ ὑπηκούσατε, καὶ ἐξέτεινον λόγους καὶ οὐ προσεἴχετε, ἀλλὰ ἀκύρους ἐποιεῖτε τὰς ἐμὰς βουλάς, τοῖς δὲ ἐμοῖς ἐλέγχοις ἠπειθήσατε· τοιγαροῦν κἀγὼ τῇ ὑμετέρᾳ ἀπωλείᾳ ἐπιγελάσομαι, καταχαροῦμαι δέ, ἥνικα ἂν ἔρχηται ὑμῖν ὄλεθρος καὶ ὡς ἂν ἀφίκηται ὑμῖν ἄφνω θόρυβος, ἡ δὲ καταστροφή ὁμοία καταιγὶδι παρῇ, ἢ ὅταν ἔρχηται ὑμῖν θλῖψις καὶ πολιορκία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/004.yaml
  text: Because I called and you did not listen, and I stretched out words and you paid no attention, but made my counsels void, and disobeyed my reproofs, therefore I also will laugh at your ruin; I will rejoice when destruction comes upon you, and when sudden turmoil reaches you, and your overthrow comes like a storm, or when affliction and siege come upon you.
translation:
  language: zh_hans
  text: 因为我呼唤，你们却不听从；我不断向你们陈说，你们却不留意；反倒使我的谋略落空，不肯听从我的责备。因此，在你们灭亡时，我也要嗤笑；当毁灭临到你们、突如其来的惊扰来到你们、灾祸如暴风雨般临到，或当患难和围城来到你们时，我必因这事欢喜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπηκούσατε
  choice: 听从
  rationale: 此词不只是听见，也含服从之意；译作“听从”保留其伦理要求。
- source_word: ἐξέτεινον λόγους
  choice: 伸出言语
  rationale: 原文表达较不寻常，可能呼应智慧伸手呼唤的意象；采取较形式对应的译法，以免擅自改成“伸手”。
- source_word: ἀκύρους ἐποιεῖτε
  choice: 使……落空
  rationale: 表达把谋略视为无效、加以废弃；“使……落空”自然且保留结果意味。
- source_word: ἐλέγχοις
  choice: 责备
  rationale: 可指纠正、斥责或揭露错误；此处“责备”符合警告语境。
- source_word: ἐπιγελάσομαι
  choice: 嗤笑
  rationale: 保留审判宣告中带嘲讽意味的强烈措辞。
- source_word: καταχαροῦμαι
  choice: 幸灾乐祸
  rationale: 该复合动词表示因对方遭祸而欢喜；此译准确呈现原文令人不安的强烈张力，不加弱化。
- source_word: θόρυβος
  choice: 骚乱
  rationale: 可指喧嚷、混乱或惊恐；在灾难语境中译为“骚乱”，保留一定语义宽度。
- source_word: πολιορκία
  choice: 围困
  rationale: 字面指围城、围攻；“围困”既准确，也适用于此处并列的灾难描写。
theological_decisions:
- issue: 说话者面对恶人灭亡而发笑、欢喜的强烈拟人表达
  choice: 直译为“嗤笑”“幸灾乐祸”
  alternative: 弱化为“我必不施怜悯”或“我任凭你们”
  rationale: 原文明确使用发笑和因灾祸欢喜的动词；应保留智慧/神圣审判话语的尖锐张力，而不以解释性措辞消解。
- issue: 末句多个时间从句与主句的关系
  choice: 末尾补出“我都要如此”，指回“嗤笑／幸灾乐祸”
  alternative: 完全按希腊语长句悬置，不补主句
  rationale: 希腊语依靠前文主句统摄后续多个灾难来临的从句；汉语若不适度补足会显得残缺。补语仅明示句法关系，不增加新的神学内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留原文连续排比、审判语气及不寻常的“伸出言语”表达。未设置脚注，因此正文无脚注标记。
