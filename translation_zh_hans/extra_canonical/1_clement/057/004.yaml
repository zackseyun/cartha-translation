revisions:
- from: 因为我呼唤，你们却不听从；我伸出言语，你们却不留意；反倒使我的谋略落空，不肯听从我的责备。因此，你们灭亡时，我也要嗤笑；毁灭临到你们时，我要幸灾乐祸；骚乱突然临到你们，倾覆如暴风雨袭来，或患难和围困临到你们时，我都要如此。
  to: 因为我呼唤，你们却不听从；我不断向你们陈说，你们却不留意；反倒使我的谋略落空，不肯听从我的责备。因此，在你们灭亡时，我也要嗤笑；当毁灭临到你们、突如其来的惊扰来到你们、灾祸如暴风雨般临到，或当患难和围城来到你们时，我必因这事欢喜。
  rationale: 修订以自然、庄重的现代汉语表达原文。“不断向你们陈说”处理不寻常的 ἐξέτεινον λόγους，不添加原文没有的“手”。末句重组为汉语可读的并列时间从句，并以“我必因这事欢喜”明确承接 καταχαροῦμαι；保留原文中说话者对灾难的嗤笑和欢喜，未作神学弱化。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:25:31Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了原文的排比、警告和审判意象，也区分了“灭亡／毁灭”等灾祸用语。但“伸出言语”虽逐字对应，却不符合现代汉语表达，容易造成字面误解；末段可更清楚地保留各个灾难来临时由前述“嗤笑／欢喜”统摄的关系。
  naturalness: “伸出言语”不自然。“幸灾乐祸”在现代汉语中带有较强的口语性和人格贬义，虽触及原文强烈语气，却不如“因……而欢喜”庄重且贴近句法。将 πολιορκία 译为“围城”比泛称“围困”更准确。
  terminology: “听从”“谋略”“责备”“嗤笑”均合适。将 ἐξέτεινον λόγους 译为“不断向你们陈说”，在不擅加“手”的前提下传达持续地发出言语的意思。θόρυβος 译为“突如其来的惊扰”保留其可指喧乱、骚动或惊恐的宽度。
  issues:
  - severity: medium
    issue: “我伸出言语”不符合现代标准汉语习惯。
    rationale: 希腊语的“伸展言语”是修辞性表达；汉语直译会显得语义不明。译作“我不断向你们陈说”保留持续呼告之意，且不把原文改作“伸手”。
  - severity: low
    issue: “幸灾乐祸”语体偏口语，并附带较强的现代道德评断色彩。
    rationale: καταχαροῦμαι确有因对方灾祸而欢喜的强烈含义，但用“我必因……而欢喜”能保留其刺耳张力，同时更庄重并与原文的时间从句相配。
  - severity: low
    issue: “围困”未充分表达 πολιορκία 的围城含义。
    rationale: 该词通常指军事性的围城或围攻；“围城”更具体准确。
