  rationale: 修订仅改善现代汉语的搭配和句法，并更明确反映两个希腊语将来时；保留“气息”“言辞／话”及“智慧”的原有源语对应与语义张力。英语审校轨迹中的替代措辞不需要在中文中另设脚注，因为本译文已以“言辞／话”呈现 ῥῆσις 与 λόγος 的区别，且没有未解决的文本歧义。
