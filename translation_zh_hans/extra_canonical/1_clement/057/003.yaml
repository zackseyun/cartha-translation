base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/003.yaml
  text: 'For thus says all-virtuous Wisdom: “Behold[a], I will pour out to you a saying from my breath, and I will teach you my word.”'
translation:
  language: zh_hans
  text: 因为具备一切美德的智慧这样说：“看哪，我要向你们倾吐我气息所发的言辞；我要把我的话教给你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πανάρετος
  choice: 满有一切美德的
  rationale: 保留该词“具备一切德行”的强化含义，同时用现代汉语可理解的表达修饰拟人化的“智慧”。
- source_word: προΐομαι
  choice: 倾吐
  rationale: 该词在此表示发出、倾出；“倾吐”既自然，又保留言语如同从气息中涌出的诗性意象。
- source_word: πνοῆς
  choice: 气息
  rationale: 直译为“气息”，保留原文的身体与诗性意象，不擅自解释为“灵”。
- source_word: ῥῆσιν
  choice: 言辞
  rationale: 表示说出的话或言辞，并与下文 λόγον 的译法有所区分。
- source_word: λόγον
  choice: 话
  rationale: 在“教导你们”之后译作自然的现代汉语“我的话”，同时保持 λόγος 的基本语义。
theological_decisions:
- issue: 智慧的拟人化
  choice: 智慧
  alternative: 智慧者
  rationale: 原文以带定冠词的 σοφία 将“智慧”拟人化，但并未明确改用人物称谓；保留“智慧”可避免加入额外的身份解释。
- issue: πνοή 是否具有“灵”的含义
  choice: 气息
  alternative: 灵
  rationale: 这里的直接意象是呼吸或气息；译作“灵”会过早消除原文可能保有的意象与语义张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语；保留引文的诗性平行结构，并以“言辞／话”对应 ῥῆσις／λόγος 的词汇差异。
