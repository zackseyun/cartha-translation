revisions:
- from: 因为他们欺压愚蒙人[a]，自己必被杀；审查必毁灭不敬虔的人。但听从我的，必怀着盼望、安然居住，并且得享安宁，不怕任何灾祸。
  to: 因他们欺压愚蒙人[a]，必被杀；查究必除灭不敬虔的人。但听从我的，必安居，在盼望中确信，并且必无惧地安歇，脱离一切祸患。
  rationale: 修订补出了πεποιθώς所表达的信赖／确信，并将“安居”与“无惧地安歇”分别对应κατασκηνώσει和ἡσυχάσει ἀφόβως。“脱离一切祸患”在此表达ἀπὸ παντὸς κακοῦ所指的免于一切祸害，且不把κακόν狭义化为抽象的道德邪恶。
  reviewer_model: gpt-5.6-terra
