source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνθ' ὧν γὰρ ἠδίκουν νηπίους φονευθήσονται, καὶ ἐξέτασμος ἀσεβεῖς ὀλεῖ· ὁ δὲ ἐμοῦ ἀκούων κατασκηνώσει ἐπ' ἐλπίδι πεποιθὼς καὶ ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/007.yaml
  text: For because they were wronging the innocent[a], they will be slain, and inquiry will destroy the ungodly; but the one who hears me will dwell, trusting in hope, and will be at rest without fear from every evil.
translation:
  language: zh_hans
  text: 因他们欺压愚蒙人[a]，必被杀；查究必除灭不敬虔的人。但听从我的，必安居，在盼望中确信，并且必无惧地安歇，脱离一切祸患。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愚蒙人”也可按字面译作“幼小者”；在此智慧文学语境中，很可能指缺乏阅历、容易受迷惑的人。
    reason: νηπίους可指幼小者，也可在智慧文学中指单纯、缺乏判断力的人；脚注保留其字面含义和语境上的歧义。
lexical_decisions:
- source_word: νηπίους
  choice: 愚蒙人
  rationale: 该词在智慧文学语境中通常指缺乏阅历、容易受诱惑的人，而非必然在道德上无辜的人；“愚蒙人”既保留这一智慧文学类别，也符合现代中文表达。
- source_word: ἐξέτασμος
  choice: 审查
  rationale: 该名词表示查验、考察或追究；“审查”保留其主动查究之意，且不预先限定为司法审判。
- source_word: κατασκηνώσει
  choice: 安然居住
  rationale: 原词本义为驻留、安居；结合后文无惧与安宁的语境，译作“安然居住”自然且不失原意。
- source_word: ἐπ' ἐλπίδι πεποιθὼς
  choice: 怀着盼望、安然
  rationale: 兼顾ἐλπίς的“盼望”和πεποιθώς的信赖、笃定意味，使这份安居建立在有把握的盼望之上。
- source_word: ἀπὸ παντὸς κακοῦ
  choice: 不怕任何灾祸
  rationale: 结合ἀφόβως表达从一切恶事、危害或灾祸而来的无惧；“灾祸”在此比抽象的“邪恶”更符合处境性含义。
theological_decisions:
- issue: νηπίους是指“愚蒙人”还是“无辜者”
  choice: 正文译作“愚蒙人”，脚注保留“年幼者”的可能
  alternative: 无辜者
  rationale: 该词可按字面指幼小者，也可在智慧文学中指单纯、缺乏判断力的人；原文没有使用明确表示道德无辜的词，因此不宜在正文中加入“无辜”的伦理判断。
- issue: 末句是否表示绝对免遭一切恶事
  choice: 译为面对任何灾祸都不惧怕
  alternative: 免受一切邪恶
  rationale: ἀφόβως首先修饰安歇的状态，重点是无所畏惧，而不必理解为信从者在现实中绝不会遭遇灾祸。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留智慧文学的劝诫语气。“愚蒙人”略带传统智慧文学色彩，但普通读者仍可理解，并由脚注说明其含义。
