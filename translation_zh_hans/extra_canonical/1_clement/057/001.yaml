source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑμεῖς οὖν οἱ τὴν καταβολὴν τῆς στάσεως ποιήσαντες ὑποτάγητε τοῖς πρεσβυτέροις καὶ παιδεύθητε εἰς μετάνοιαν, κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/001.yaml
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance, bending the knees of your heart.
translation:
  language: zh_hans
  text: 所以，你们这些为这场纷争[a]奠定根基的人，要顺服长老，接受管教，以至悔改；并屈下你们心中的膝盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“叛乱”。
    reason: στάσις可指纷争、派系冲突、骚乱或叛乱；此处指破坏群体秩序的冲突，带有强烈负面意味。
lexical_decisions:
- source_word: καταβολὴν τῆς στάσεως ποιήσαντες
  choice: 挑起纷争的人
  rationale: 该短语直译为“奠下纷争根基的人”，在此指造成或发动教会内部争端者；“挑起纷争”以自然汉语表达其责任及 στάσις 的负面含义。
- source_word: ὑποτάγητε
  choice: 要顺服
  rationale: 保留主动置身于长老权柄之下的命令语气。
- source_word: τοῖς πρεσβυτέροις
  choice: 长老
  rationale: 在《革利免一书》的教会语境中，πρεσβύτεροι 指群体中的长老；不额外判定它与其他职分称谓的制度关系。
- source_word: παιδεύθητε εἰς μετάνοιαν
  choice: 接受管教而悔改
  rationale: παιδεύω 可指纠正性的教导或管教；εἰς μετάνοιαν 表明其导向悔改，译文保留两者关系。
- source_word: κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν
  choice: 屈下你们心中的膝盖
  rationale: 保留原文鲜明而可理解的身体隐喻，表达内心谦卑降服。
theological_decisions:
- issue: στάσις 所指事件的性质
  choice: 正文译作“纷争”
  alternative: 叛乱；骚乱；结党
  rationale: στάσις 可涵盖派系冲突、骚乱或反叛。此处是哥林多教会内部破坏秩序的争端，“纷争”符合上下文且不过度政治化；脚注保留更强的可能译法。
- issue: εἰς μετάνοιαν 的句法关系
  choice: 接受管教而悔改
  alternative: 在悔改中受教；接受通往悔改的管教
  rationale: 原文可强调管教以悔改为目标，也可视为悔改过程中的受教；正文自然表达主要方向，但不把它扩展为特定悔改论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“屈下你们心中的膝盖”有意保留原文隐喻；“长老”“管教”“悔改”沿用普通读者熟悉且与希腊文相称的宗教语汇。
