  text: For they went down alive into Hades, and death will shepherd them.
translation:
  language: zh_hans
  text: 因为他们活着下到阴间，死亡必牧养他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾅδου
  choice: 阴间
  rationale: 指死者所在之处；“阴间”既保留古代语境，也避免把该词直接解释为最终刑罚之地。
- source_word: ζῶντες
  choice: 活着
  rationale: 保留原文强调：他们是在仍然活着时下去。
- source_word: ποιμανεῖ
  choice: 必牧养
  rationale: 直译其“作牧人、牧养”意象，不将这个带有反讽和审判意味的隐喻弱化为“辖制”或“吞灭”。
theological_decisions:
- issue: ᾅδης所指为何
  choice: 译作“阴间”
  alternative: “地狱”
  rationale: 原词通常指死者的领域，并不必然等同于最终惩罚之地；因此不作过度限定。
- issue: “死亡必牧养他们”的隐喻
  choice: 保留牧养意象
  alternative: “死亡必辖制他们”
  rationale: 原文沿用诗篇中的牧人隐喻；保留其突兀张力，而不替作者解释。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语；句式紧贴希腊文，并保留“死亡牧养”的诗性与神学张力。
