source:
  edition: Funk 1901 (normalized OCR)
  text: καλὸν γὰρ ἀνθρώπῳ ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων ἢ σκληρῦναι τὴν ₂₅ καρδίαν αὐτοῦ, καθὼς ἐσκληρύνθη ἡ καρδία τῶν στασιασάντων πρὸς τὸν θεράποντα τοῦ θεοῦ Μωϋσῆν, ὧν τὸ κρίμα πρόδηλον ἐγενήθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/003.yaml
  text: For it is good for a man to confess his transgressions rather than to harden his heart[a], just as the heart of those who rebelled against Moses, the servant of God, was hardened, whose judgment became evident.
translation:
  language: zh_hans
  text: 因为人承认自己的过犯，总比硬着心好；正如那些反抗上帝的仆人摩西的人，他们的心变得刚硬，他们所受的审判也显明出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων
  choice: 承认自己的过犯
  rationale: ἐξομολογεῖσθαι 在此表示坦白、认罪；περὶ τῶν παραπτωμάτων 按现代汉语习惯自然译作动词的宾语。“过犯”保留 παραπτώματα 所指的失足与违犯之意。
- source_word: σκληρῦναι τὴν καρδίαν
  choice: 硬着心
  rationale: 采用自然且具有经文语感的现代汉语表达，传达主动使内心刚硬、不肯悔改之意。
- source_word: στασιασάντων πρὸς
  choice: 反抗
  rationale: στασιάζω 在此指起而抗拒、叛逆；“反抗”准确表达其针对摩西的敌对行动，又不额外限定具体事件。
- source_word: θεράποντα τοῦ θεοῦ
  choice: 上帝仆人
  rationale: θεράπων 在此为尊称，指侍奉上帝的人；“仆人”符合汉语经文传统，也比“侍从”自然。
- source_word: τὸ κρίμα πρόδηλον ἐγενήθη
  choice: 所受的审判也显明了
  rationale: κρίμα 可指审判、判决或定罪的结果；此处保留“审判”的概括性，πρόδηλον 译为“显明”，表达其结果公开可见。
theological_decisions:
- issue: κρίμα 是审判行为、判决，还是惩罚结果
  choice: 所受的审判
  alternative: 所受的惩罚／定罪
  rationale: “审判”保留 κρίμα 的语义宽度，不把原文明确收窄为惩罚或定罪；加“所受的”使其与反抗者的关系在汉语中清楚。
- issue: 心刚硬的施事者是否为上帝
  choice: 他们的心变得刚硬
  alternative: 上帝使他们的心刚硬／他们使自己的心刚硬
  rationale: ἐσκληρύνθη 是被动形式，原文没有明说施事者；译作“变得刚硬”保留这种含混，避免引入特定神学解释。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“硬着心”与后文“心变得刚硬”分别对应主动式和被动式；保留原文在心刚硬之施事者方面的含混。句末用“而”理顺关系，同时维持 ὧν 对前述反抗者的指代。
