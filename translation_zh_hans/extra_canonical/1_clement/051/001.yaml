  to: 所以，无论我们因仇敌的什么手段而失足或犯错，都让我们恳求蒙赦免。那些带头挑起纷争和分裂的人，也应当顾念共同的盼望。
  rationale: 修订首句以“无论……失足或犯错”清楚对应ὅσα…παρεπέσαμεν καὶ ἐποιήσαμεν，并以“让我们恳求蒙赦免”传达ἀξιώσωμεν ἀφεθῆναι ἡμῖν的劝勉语气。第二句保留“也”以表达καὶ ἐκεῖνοι δέ的附加关系。删除会引入不必要且较不可靠替代释义的脚注。
