source:
  edition: Funk 1901 (normalized OCR)
  text: Ὅσα οὖν παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου, ἀξιώσωμεν ἀφεθῆναι ἡμῖν· καὶ ἐκεῖνοι δέ, οἵτινες ἀρχηγοὶ στάσεως καὶ διχοστασίας ἐγενήθησαν, ὀφείλουσιν τὸ κοινὸν ₂₀ τῆς ἐλπίδος σκοπεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/001.yaml
  text: Therefore, whatever things we have done wrong and committed through any schemes of the adversary, let us ask that they be forgiven us. And those, too, who became leaders of revolt and division ought to consider the common hope.
translation:
  language: zh_hans
  text: 所以，无论我们因仇敌的什么手段而失足或犯错，都让我们恳求蒙赦免。那些带头挑起纷争和分裂的人，也应当顾念共同的盼望。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπέσαμεν καὶ ἐποιήσαμεν
  choice: 失足、犯下的过错
  rationale: παραπίπτω含有偏离正道、失足犯错之意；ἐποιήσαμεν泛指所做之事。中文以并列而不机械重复的表达保留“犯错并做出”的双重措辞。
- source_word: διά τινος τῶν τοῦ ἀντικειμένου
  choice: 因仇敌的某种手段
  rationale: 原文省略了受属格限定的名词，意指仇敌所用的某种手段、计谋或影响；译文不把具体方式说死。ἀντικείμενος译作“仇敌”，保留其人格化却未明说身份的表达。
- source_word: ἀξιώσωμεν ἀφεθῆναι ἡμῖν
  choice: 都当恳求得到赦免
  rationale: ἀξιόω在此表示请求、恳求；被动式ἀφεθῆναι表达过犯蒙赦免。
- source_word: ἀρχηγοὶ στάσεως καὶ διχοστασίας
  choice: 带头挑起纷争和分裂的人
  rationale: ἀρχηγός是带头者、发起者；στάσις在群体语境中可指争斗或叛乱，διχοστασία指造成阵营分裂。此译符合教会群体语境而不过度政治化。
- source_word: τὸ κοινὸν τῆς ἐλπίδος
  choice: 共同的盼望
  rationale: 该结构可将τὸ κοινόν理解为由τῆς ἐλπίδος限定的共同之事，惯用意义为群体共有的盼望；同时以脚注保留较直译的结构可能性。
- source_word: σκοπεῖν
  choice: 顾念
  rationale: 该词表示留意、审视或以某事为念；“顾念”在劝诫语境中自然且庄重。
theological_decisions:
- issue: “仇敌”的身份
  choice: 保留“仇敌”，不明确补作魔鬼或撒但
  alternative: 译作“魔鬼的计谋”或“撒但的手段”
  rationale: 原文只有人格化的ὁ ἀντικείμενος，并未在本句直接指名；保留称谓可避免把解释写入正文。
- issue: “共同”所修饰的对象
  choice: 正文采用“共同的盼望”
  alternative: “盼望中共同的事物”或“盼望所共有的益处”
  rationale: “共同的盼望”最符合该希腊短语的惯用理解，也呼应全体共同面向的盼望；脚注保留语法上更直译的理解。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“失足”“恳求得到赦免”“顾念”保持书信的伦理与宗教语感；避免使用过度政治化的“叛乱”，也不把“仇敌”未经明说地定名为撒但。
