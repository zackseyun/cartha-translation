revisions:
- from: 法老、他的军队和埃及所有的首领，连同战车和车上的人，都沉入红海，灭亡了。他们遭遇这一切，并非由于别的缘故，而是因为上帝借着他的仆人摩西在埃及地施行神迹奇事以后，他们那愚昧的心仍变得刚硬。[a]
  to: 法老、他的军队和埃及所有的首领，连同战车和车上的人，都沉入红海而灭亡了。他们之所以如此，并无别的原因，只因上帝借着他的仆人摩西在埃及地施行神迹奇事之后，他们那愚昧的心变得刚硬。[a]
  rationale: 删除“仍”，以免加入原文未表达的持续性；将概括性的“他们遭遇这一切”改为“他们之所以如此”，使因果关系直接回指前述沉没与灭亡。其余译词和脚注均可保留。
