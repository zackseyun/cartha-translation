source:
  edition: Funk 1901 (normalized OCR)
  text: Φαραὼ καὶ ἡ στρατιὰ αὐτοῦ καὶ πάντες οἱ ἡγούμενοι Αἰγύπτου, τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν οὐ διʼ ἄλλην τινὰ αἰτίαν ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν καὶ ἀπώλοντο, ἀλλὰ διὰ τὸ σκληρυνθῆναι αὐτῶν τὰς ἀσυνέτους καρδίας μετὰ τὸ γενέσθαι τὰ σημεῖα καὶ τὰ τέρατα ἐν γῇ Αἰγύπτου διὰ τοῦ θεράποντος τοῦ θεοῦ Μωϋσέως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/005.yaml
  text: 'Pharaoh and his army and all the leaders of Egypt, both the chariots and those who rode in them, were sunk into the Red Sea and perished for no other cause than this: their foolish hearts were hardened after the signs and wonders had taken place in the land of Egypt through Moses, the servant of God.'
translation:
  language: zh_hans
  text: 法老、他的军队和埃及所有的首领，连同战车和车上的人，都沉入红海而灭亡了。他们之所以如此，并无别的原因，只因上帝借着他的仆人摩西在埃及地施行神迹奇事之后，他们那愚昧的心变得刚硬。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “变得刚硬”：原文采用被动形式，但没有说明是谁使他们的心刚硬。
    reason: 保留σκληρυνθῆναι的被动语态及施事者未明这一真实歧义，避免正文判定刚硬的责任归属。
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: 首领
  rationale: 指埃及居领导地位的人；“首领”自然、庄重，且不把其职分过度限定为君王或官员。
- source_word: τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν
  choice: 连同战车和车上的人
  rationale: 保留战车与乘坐者的并列表达；“车上的人”既自然，也不武断限定为驾车者或战士。
- source_word: ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν καὶ ἀπώλοντο
  choice: 都沉入红海，灭亡了
  rationale: 分别呈现“沉入”与“灭亡”两个谓语，并采用现代汉语通行地名“红海”。
- source_word: ἀσυνέτους καρδίας
  choice: 愚昧的心
  rationale: ἀσύνετος侧重缺乏领悟与明辨；“愚昧”符合圣经语体，又比“无知觉”更自然。
- source_word: θεράποντος τοῦ θεοῦ
  choice: 上帝的仆人
  rationale: θεράπων在此表达服事上帝者；“仆人”是自然且庄重的汉语对应，不额外引入特殊职衔。
- source_word: σημεῖα καὶ τέρατα
  choice: 神迹奇事
  rationale: 采用现代中文圣经语境中清楚而固定的搭配，同时保留两个希腊名词的并列。
theological_decisions:
- issue: 心刚硬的语态与责任归属
  choice: 他们那愚昧的心仍变得刚硬
  alternative: 他们那愚昧的心被刚硬了
  rationale: σκληρυνθῆναι为不定过去时被动式，但未明说使其刚硬的施事者。“变得刚硬”保留状态变化和施事者未明的含混，避免擅自断定是上帝、法老本人或其他因素使其刚硬。
- issue: 摩西作为θεράπων的身份表达
  choice: 上帝的仆人摩西
  alternative: 上帝的侍从摩西
  rationale: “仆人”忠实传达服事关系，也最适合普通现代读者；不借此词建立后世宗派性的职分区分。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为使较长的希腊句子在汉语中清晰自然，分为两句；“并非由于别的缘故，而是因为”保留原文强烈的排他性因果结构。正文中的“仍”体现神迹奇事已经发生之后，刚硬状态依然出现或持续的语境关系，但不扩充其神学原因。
