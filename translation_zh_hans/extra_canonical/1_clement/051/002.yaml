source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ γὰρ μετὰ φόβου καὶ ἀγάπης πολιτευόμενοι ἑαυτοὺς θέλουσιν μᾶλλον αἰκίαις περιπίπτειν ἢ τοὺς πλησίον· μᾶλλον δὲ ἑαυτῶν κατάγνωσιν φέρουσιν ἢ τῆς παραδεδομένης ἡμῖν καλῶς καὶ δικαίως ὁμοφωνίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/002.yaml
  text: For those who conduct themselves with fear and love desire rather to fall into mistreatment themselves than their neighbors[a]; indeed[b], they bear condemnation of themselves rather than of the harmony that has been handed down to us well and justly.
translation:
  language: zh_hans
  text: 因为那些怀着敬畏和爱而行事的人，宁愿自己遭受凌辱，也不愿邻舍遭受[a]；更甚者，他们宁可谴责自己，也不愿谴责那美好而正当地传给我们的和睦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“宁愿自己陷入凌辱，而不是邻舍”；这里是说宁愿自己遭受凌辱，也不愿邻舍遭受，并非说使邻舍受害。
    reason: 说明ἑαυτούς与τοὺς πλησίον同为省略的“陷入凌辱”的逻辑主语。
  - marker: b
    text: “谴责自己”也可理解为“承担对自己的谴责”；本句的对照是自己与那传给我们的和睦。原文“美好而正当地”在句法上修饰“传给”。
    reason: 说明κατάγνωσιν φέρειν的表达方式，并交代两个副词的直接句法修饰对象。
lexical_decisions:
- source_word: πολιτευόμενοι
  choice: 行事
  rationale: 此处指生活为人、处世行止；译作“行事”自然简明，同时不强加城邦或公民身份的含义。
- source_word: μετὰ φόβου καὶ ἀγάπης
  choice: 存敬畏和爱
  rationale: 保留 φόβος 与 ἀγάπη 的并列关系；“存……而行事”符合现代汉语宗教文体。
- source_word: αἰκίαις περιπίπτειν
  choice: 遭受凌辱
  rationale: αἰκία 可指虐待、凌辱或伤害；“遭受凌辱”保留被动受害之意，不引入加害邻舍的主动行为。
- source_word: κατάγνωσιν φέρουσιν
  choice: 定……的罪
  rationale: 该搭配在此表示作出或加以谴责、定罪，而不是承受定罪；用“定……的罪”清楚呈现其所指对象。
- source_word: ὁμοφωνίας
  choice: 和睦
  rationale: 本义涉及同声、一致；语境强调群体之间传承下来的和谐合一，“和睦”较自然，也保留共同一致的意味。
- source_word: καλῶς καὶ δικαίως
  choice: 以美善、公义的方式
  rationale: 将两个副词都理解为修饰“传给”，避免把它们未经说明地转作“和睦”的形容词；同时保留其方式或规范性的开放性。
theological_decisions:
- issue: ἢ τοὺς πλησίον 中省略成分的补足
  choice: 也不愿邻舍遭受
  alternative: 也不愿使邻舍遭受
  rationale: τοὺς πλησίον 与 ἑαυτούς 平行，都是省略的 περιπίπτειν 的逻辑主语；原文说宁愿自己受害而非邻舍受害，并未表达他们使邻舍受害。
- issue: κατάγνωσιν φέρειν 的施事关系
  choice: 他们宁可定自己的罪
  alternative: 他们宁可承受对自己的定罪
  rationale: 该表达结合属格 ἑαυτῶν / τῆς ὁμοφωνίας，较可能指把定罪加在某对象上；因此保留“宁可责己而不责和睦”的对比。
- issue: καλῶς καὶ δικαίως 的修饰范围
  choice: 以美善、公义的方式传给我们的
  alternative: 传给我们的美好而正当的和睦
  rationale: 希腊文为副词，形式上最直接修饰 παραδεδομένης；正文按此处理，同时脚注提示也可能按结果性或性质理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“存敬畏和爱而行事”保留劝勉文体；“邻舍”“定罪”“和睦”与早期基督教伦理语境相称，但避免生硬仿古。
