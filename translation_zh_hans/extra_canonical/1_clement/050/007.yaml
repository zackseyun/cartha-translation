  text: οὗτος ὁ μακαρισμὸς ἐγένετο ἐπὶ τοὺς ἐκλελεγ₁₅ μένους ὑπὸ τοῦ θεοῦ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/007.yaml
  text: This blessedness came upon those chosen by God through Jesus Messiah our Lord[a], to whom be the glory forever and ever. Amen.
translation:
  language: zh_hans
  text: 这福分临到了那些蒙上帝借着我们的主耶稣弥赛亚拣选的人；荣耀归于他，直到永永远远。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρισμός
  choice: 福分
  rationale: 该词在此指蒙福的境况或福乐；“福分”自然庄重，并能承接上文所述的有福状态。
- source_word: ἐκλελεγμένους
  choice: 蒙……拣选的人
  rationale: 完成时被动分词表示已经被拣选、现今仍处于这一身份的人；“蒙……拣选”保留被动意义。
- source_word: διὰ
  choice: 借着
  rationale: 在属格宾语“耶稣弥赛亚”之前通常表达媒介或中介，译作“借着”而不进一步界定其神学机制。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 保留希腊词在此所承载的称号含义，采用现代中文读者可理解的标准音意称谓。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 以自然的中文颂赞用语表达加强式的永恒时间公式。
theological_decisions:
- issue: “借着耶稣弥赛亚”修饰的范围
  choice: 译为“蒙上帝借着我们的主耶稣弥赛亚拣选”
  alternative: “蒙上帝拣选、借着我们的主耶稣弥赛亚得着这福分”
  rationale: 希腊语中 διὰ Ἰησοῦ Χριστοῦ 紧接“被上帝拣选”，最自然地表示上帝借着耶稣弥赛亚施行拣选；不将其改接到“福分临到”上。
- issue: 关系代词 ᾧ 的指称
  choice: “愿荣耀归给他”保留代词，不明说所指
  alternative: “愿荣耀归给耶稣弥赛亚”或“愿荣耀归给上帝”
  rationale: 语法上最近的阳性单数先行词是“我们的主耶稣弥赛亚”，但“上帝”也在句中出现；保留代词可避免消除原文可能存在的指称张力。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性散文。“这福分临到了”紧贴原文，不添加“因此”等原文没有的连接词；末句保留传统颂赞语气。
