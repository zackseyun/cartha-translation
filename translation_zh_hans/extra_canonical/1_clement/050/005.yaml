  text: μακάριοι ἐσμὲν, ἀγαπητοί, εἰ τὰ προστάγματα τοῦ θεοῦ ἐποι₁₀ οῦμεν ἐν ὁμονοίᾳ ἀγάπης, εἰς τὸ ἀφεθῆναι ἡμῖν δι’ ἀγάπης τὰς ἁμαρτίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/005.yaml
  text: Blessed are we[a], beloved, if we do the commandments of God in the harmony of love, so that through love our sins may be forgiven us.
translation:
  language: zh_hans
  text: 亲爱的，我们若在爱里的同心合意中遵行上帝的命令，好叫我们的罪借着爱得蒙赦免，我们就是有福的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: 有福的
  rationale: 表达蒙福、处于可称颂境况之意；比“快乐”更符合早期基督教劝勉语境。
- source_word: ἀγαπητοί
  choice: 亲爱的
  rationale: 保留直接称呼及亲爱之意，不额外加入原文没有的性别或身份称谓。
- source_word: προστάγματα
  choice: 命令
  rationale: 指上帝所颁布、要求人遵行的命令或训令；译法简明而庄重。
- source_word: ὁμονοίᾳ
  choice: 同心合意
  rationale: 体现共同一心、彼此和睦的含义，并保留该词在《革利免一书》中与纷争相对的群体性分量。
- source_word: ἀγάπης
  choice: 爱
  rationale: 两次出现均译为“爱”，保留原文重复以及爱与赦罪之间未经进一步解释的关系。
- source_word: ἀφεθῆναι
  choice: 得蒙赦免
  rationale: 准确表达罪被赦免的被动意义，并以庄重自然的现代汉语呈现。
theological_decisions:
- issue: “借着爱”与罪得赦免的关系
  choice: 直译为“我们的罪借着爱得蒙赦免”
  alternative: 将“爱”解释为上帝的爱、基督的爱或人的爱
  rationale: 原文未明确爱的主体或具体施行方式，因此不替作者消解其神学张力。
- issue: εἰς τὸ ἀφεθῆναι 所表达的逻辑关系
  choice: 正文译作目的性的“好使”并加注
  alternative: 结果性的“以致”
  rationale: εἰς τό加不定式可表达目的，也可能偏向结果；正文采用自然且常见的目的表达，同时以脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的书面汉语。“在爱里的同心合意中”保留原文“爱之同心”的紧密结构；整体语序略作调整，使“就是有福的”自然承接条件句。
