revisions:
- from: 亲爱的，我们若在爱里的同心合意中遵行上帝的命令，就是有福的，好使[a]我们的罪借着爱得蒙赦免。
  to: 亲爱的，我们若在爱里的同心合意中遵行上帝的命令，好叫我们的罪借着爱得蒙赦免，我们就是有福的。
  rationale: 仅作安全的汉语表达修订：以“好叫”替换“好使”，并将“我们就是有福的”置于句末，使条件句及其目的分句在现代书面汉语中更完整自然。保留原文的条件关系、爱的重复、赦免的被动式，以及“爱”的主体未明之处。
