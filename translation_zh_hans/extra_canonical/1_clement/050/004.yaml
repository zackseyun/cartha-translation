  text: γέγραπται γάρ· Εἰσέλθετε εἰς τὰ ταμεῖα μικρὸν ὅσον ὅσον, ἕως οὗ παρέλθῃ ἡ ὀργὴ καὶ ὁ θυμός μου, καὶ μνησθήσομαι ἡμέρας ἀγαθῆς, καὶ ἀναστήσω ὑμᾶς ἐκ τῶν θηκῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/004.yaml
  text: For it is written, “Enter into your chambers for a very little while, until my wrath and anger pass by; and I will remember a good day, and I will raise you from your tombs.”
translation:
  language: zh_hans
  text: 因为经上记着说：“你们要进入自己的房间，待一小会儿，直到我的愤怒和烈怒过去；我必记念一个美好的日子，也必使你们从坟墓中起来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταμεῖα
  choice: 内室
  rationale: 指房屋中可关闭、可藏身的房间；“内室”在现代汉语中自然，也符合此处进入躲避的语境，不额外强化为密室。
- source_word: μικρὸν ὅσον ὅσον
  choice: 躲藏片刻
  rationale: 该短语表示极短的一段时间；译作“片刻”简洁自然。“躲藏”由进入内室并等候烈怒过去的语境明确引出，使汉语句意完整。
- source_word: ἡ ὀργὴ καὶ ὁ θυμός μου
  choice: 我的烈怒和怒气
  rationale: 保留原文两个近义怒气词的并列，不将其合并；“烈怒”与“怒气”体现强度上的细微差别。
- source_word: μνησθήσομαι
  choice: 我必记念
  rationale: 采用“记念”保留其有意眷顾并采取行动的圣经语义，而不仅是心理上的想起。
- source_word: ἡμέρας ἀγαθῆς
  choice: 那美好的一日
  rationale: 按原文保留单数和较宽泛的“美好”含义，不具体解释这一天的性质。
- source_word: ἀναστήσω
  choice: 使……起来
  rationale: 该动词可表达使人站起，也可在坟墓语境中指使死人复起；此译保留动作意象及复活含义。
- source_word: θηκῶν
  choice: 坟墓
  rationale: 在“使你们起来”的上下文中指安放遗体之处，译作“坟墓”准确清楚。
theological_decisions:
- issue: “从坟墓中起来”是否应明确译为“复活”
  choice: 使你们从坟墓中起来
  alternative: 使你们从坟墓中复活
  rationale: 原文使用一般性的“使起来”而非另加解释性名词；结合“坟墓”已清楚表达复活意象，直译可保存原句的修辞形式。
- issue: “美好的一日”的具体所指
  choice: 保留为“那美好的一日”
  alternative: 解释为拯救之日或复活之日
  rationale: 原文没有明确界定这一日；不在正文中加入特定末世论解释，以保留文本本身的开放性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留引文的圣经语体和原文近义词并列。句法略作汉语化处理，但不消解“美好的一日”及“使……起来”的神学张力。
