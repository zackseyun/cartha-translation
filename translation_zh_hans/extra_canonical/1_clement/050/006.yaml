    reason: 希腊文使用不定过去时被动语态；在这句祝福语中可着重表达已经发生并形成现状的赦免。
  revision_rationale: 仅修订第二个祝福语的句法，明确“罪”是主不予归算给该人的对象，恢复原文关系从句的语义与中文可读性。首半句及脚注对不定过去时在祝福语中的状态性表达均可保留。
