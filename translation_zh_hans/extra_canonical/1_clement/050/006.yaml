revisions:
- from: 因为经上写着[a]：“过犯得蒙赦免、罪恶得以遮盖的人有福了；主绝不算他有罪的人有福了，他口中也没有诡诈。”
  to: 因为经上写着[a]：“过犯得蒙赦免、罪恶得以遮盖的人有福了；主绝不把罪算在他身上的人有福了，他口中也没有诡诈。”
  rationale: 仅修订第二个祝福语的句法，明确“罪”是主不予归算给该人的对象，恢复原文关系从句的语义与中文可读性。首半句及脚注对不定过去时在祝福语中的状态性表达均可保留。
  reviewer_model: gpt-5.6-terra
