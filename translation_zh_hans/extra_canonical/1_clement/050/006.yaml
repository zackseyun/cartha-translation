  text: γέγραπται γάρ· Μακάριοι, ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι· μακάριος ἀνήρ, οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν, οὐδέ ἐστιν ἐν τῷ στόματι αὐτοῦ δόλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/006.yaml
  text: For it is written[a], “Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man whose sin the Lord will certainly not reckon, and in whose mouth there is no deceit.”
translation:
  language: zh_hans
  text: 因为经上写着[a]：“过犯得蒙赦免、罪恶得以遮盖的人有福了；主绝不把罪算在他身上的人有福了，他口中也没有诡诈。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“过犯已经蒙赦免、罪恶已经得以遮盖的人有福了。”
    reason: 希腊文使用不定过去时被动语态；在这句祝福语中可着重表达已经发生并形成现状的赦免。
lexical_decisions:
- source_word: ἀνομίαι
  choice: 过犯
  rationale: 指违背律法的行为；“过犯”自然、庄重，又保留其道德与律法意味。
- source_word: ἀφέθησαν
  choice: 得蒙赦免
  rationale: 被动语态含施恩者隐而未明的意味；在祝福语中，汉语用“得蒙”也能表达现今所享的赦免状态。
- source_word: ἐπεκαλύφθησαν
  choice: 得以遮盖
  rationale: 保留原文“遮盖”的诗性比喻及被动意义，不将其解释性改写为“除去”。
- source_word: λογίσηται
  choice: 算……有罪
  rationale: λογίζομαι在此指把罪记在某人账上、归算给他；“算他有罪”符合现代汉语并保留司法或记账色彩。
- source_word: δόλος
  choice: 诡诈
  rationale: 表示欺骗、奸诈；“诡诈”契合经文体裁且不显古奥。
theological_decisions:
- issue: 两个不定过去时被动动词的时间与体貌
  choice: 译为“得蒙赦免、得以遮盖”，表达蒙赦之后的有福状态
  alternative: 译为“曾蒙赦免、曾被遮盖”
  rationale: ἀφέθησαν与ἐπεκαλύφθησαν虽为不定过去时，但在诗歌式祝福语中概括一类人的状态，不宜在中文中限定为某一次过去事件。
- issue: οὐ μὴ λογίσηται的强烈否定
  choice: “绝不算他有罪”
  alternative: “不算他有罪”
  rationale: οὐ μή加虚拟语气构成强调否定，“绝不”准确保留其力度。
- issue: 末句与有福之人的关系
  choice: 译作“他口中也没有诡诈”
  alternative: 另起一句译作“口中没有诡诈的人有福了”
  rationale: 关系代词αὐτοῦ回指前述“人”；保留原文把不被归罪与口无诡诈并列描述同一人的结构，而不增添原文没有的第三个“有福”。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“因为经上写着”自然引出引文；“得蒙赦免”“得以遮盖”保留诗性平行结构；全句避免过度古雅，也不对赦罪与诚实之间的神学关系作超出原文的解释。
