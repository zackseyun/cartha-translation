- from: 除了蒙上帝看为配得的人，谁能被发现是在爱中呢？所以，让我们祈求，从他的怜悯求得恩典，使我们被发现是在爱中，不存人的偏私，无可指责。
  to: 除了上帝所看为配得的人，谁足以在爱中被发现呢？所以，让我们祈求、求告他的怜悯，好叫我们在爱中被发现，不存人的偏私，无可指责。
  rationale: 修订恢复ἱκανός的“足以”意味，删除原文没有明说的“恩典”，并调整“在爱中被发现”的语序。译文仍将αὐτῇ明确为“爱”，并保留末尾伦理描述的并列结构及其不额外界定的神学含义。
