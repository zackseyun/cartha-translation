source:
  edition: Funk 1901 (normalized OCR)
  text: τίς ἱκανὸς ἐν αὐτῇ εὑρεθῆναι, εἰ μὴ οὓς ἂν καταξιώσῃ ὁ θεός; δεηθῶμεν οὖν καὶ αἰτώμεθα ἀπὸ τοῦ ἐλέους αὐτοῦ, ἵνα ἐν ἀγάπῃ εὑρεθῶμεν δίχα προσκλίσεως ἀνθρωπίνης, ἄμωμοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/002.yaml
  text: Who is sufficient to be found in it, except those whom God may count worthy? Therefore let us pray and ask from his mercy that we may be found in love, without human partiality, blameless.
translation:
  language: zh_hans
  text: 除了上帝所看为配得的人，谁足以在爱中被发现呢？所以，让我们祈求、求告他的怜悯，好叫我们在爱中被发现，不存人的偏私，无可指责。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανός
  choice: 能
  rationale: 在“谁能……”的反问句中自然表达“足以、有能力”，并避免将其误解为道德上的配得。
- source_word: καταξιώσῃ
  choice: 看为配得
  rationale: 保留上帝作出评定并使人得享此资格的含义，不简化为人的自有功德。
- source_word: δεηθῶμεν καὶ αἰτώμεθα
  choice: 让我们祈求……求得恩典
  rationale: 用自然的现代汉语体现两个近义祈求动词的叠加强调；补出“恩典”作为所求之事，使句法通顺，但不改变所求内容。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 采用常见、庄重的圣经汉语，表达上帝慈悲施恩。
- source_word: ἀγάπη
  choice: 爱
  rationale: 保留本段核心用词，不额外限定为某一特定类别的爱。
- source_word: πρόσκλισις ἀνθρωπίνη
  choice: 人的偏私
  rationale: 表达因人的关系或考量而有所偏向、徇私的含义。
- source_word: ἄμωμοι
  choice: 无可指责
  rationale: 表达没有可归咎之处，比“无瑕疵”更适合此处伦理语境。
theological_decisions:
- issue: 人进入或持守在爱中与上帝认可之间的关系
  choice: “除了蒙上帝看为配得的人”
  alternative: “若不是上帝使之配得的人”
  rationale: καταξιόω可侧重“认为配得”，也可含“使之配得/准许”的意味；正文采用较贴近表层句法且不过度界定神学机制的译法。
- issue: ἐν αὐτῇ中代词所指
  choice: 按上下文译明为“在爱中”
  alternative: 直译为“在其中”
  rationale: 阴性代词明确回指前文的ἀγάπη；译明可使独立节选自然易懂，而不增加新的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被发现是在爱中”略保留希腊文εὑρεθῆναι ἐν ἀγάπῃ的审察/显明语感；“不存人的偏私，无可指责”保持末尾两个修饰语的紧凑力度。
