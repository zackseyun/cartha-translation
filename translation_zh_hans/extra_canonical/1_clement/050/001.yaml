  text: Ὁρᾶτε, ἀγαπητοί, πῶς μέγα καὶ θαυμαστόν ἐστιν ἡ ἀγάπη, καὶ τῆς τελειότητος αὐτῆς οὐκ ἔστιν ἐξήγησις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/001.yaml
  text: See, beloved, how great and marvelous love is, and of its perfection there is no description.
translation:
  language: zh_hans
  text: 请看，亲爱的各位，爱是何等伟大、何等奇妙；爱的完美无法描述。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“爱的完美无法述说。”
    reason: ἐξήγησις在此可指描述、叙说或陈述；此译保留其言语表达层面的语义幅度。
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: 你们看
  rationale: 保留复数命令语气，表达作者呼吁听众留意、思量。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 该词是对群体的亲切称呼；结合早期基督徒书信语境，用现代汉语中包容男女听众的称谓自然传达。
- source_word: ἀγάπη
  choice: 爱
  rationale: 直接对应原文，且不额外限定为某一种神学类别的爱。
- source_word: μέγα καὶ θαυμαστόν
  choice: 何等伟大、何等奇妙
  rationale: 用感叹结构再现原文对爱的伟大与奇妙所作的强调。
- source_word: τελειότητος
  choice: 完全
  rationale: 保留‘达到完满、完善状态’的核心含义，同时维持原文较抽象的表达。
- source_word: ἐξήγησις
  choice: 描述
  rationale: 此处指用言语作出叙述、陈说或描绘；‘描述’比现代汉语中偏重说明因果的‘解释’更贴近语境。
theological_decisions:
- issue: ‘它的完全’所指为何
  choice: 保留代词结构，指向前句的‘爱’
  alternative: 译成‘完全的爱’或‘爱的完美境界’
  rationale: 原文使用属格加代词，措辞抽象；不将其具体化可保存原文的开放性和修辞张力。
- issue: 无法描述的程度
  choice: 以‘实在无法描述’表达不可充分言说
  alternative: 绝对化为‘任何人都不可能描述’
  rationale: 原文说‘没有描述/陈说’，重点在爱的完全超越言语表达；避免额外添加主体或哲学性断言。
translation_notes:
  register: 采用现代、庄重而易懂的书信劝勉语体；以两个“何等”再现原文的感叹力度，并用感叹号呈现修辞重心。
