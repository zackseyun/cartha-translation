revisions:
- from: 亲爱的弟兄姊妹，你们看，爱是何等伟大、何等奇妙！它的完全，实在无法描述。[a]
  to: 请看，亲爱的各位，爱是何等伟大、何等奇妙；爱的完美无法描述。[a]
  rationale: The revision removes an unstated kinship designation, replaces an unnatural nominal use of “完全” with idiomatic “完美,” and retains the source’s emphasis that love’s perfection exceeds adequate verbal description.
  reviewer_model: gpt-5.6-terra
