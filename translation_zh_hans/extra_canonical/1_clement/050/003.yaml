  text: αἱ γενεαὶ πᾶσαι ἀπὸ Ἀδὰμ ἕως τῆσδε τῆς ἡμέρας παρῆλθον, ἀλλ’ οἱ ἐν ἀγάπῃ τελειωθέντες κατὰ τὴν τοῦ θεοῦ χάριν ἔχουσιν χῶρον εὐσεβῶν, οἳ ₅ φανερωθήσονται ἐν τῇ ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/003.yaml
  text: All the generations from Adam until this day have passed away, but those who were perfected in love according to the grace of God have a place among the godly, who will be revealed in the visitation of the kingdom of Messiah.
translation:
  language: zh_hans
  text: 从亚当直到今日，所有世代都已过去；但那些按着上帝的恩典、在爱中得以成全的人，在敬虔者中有一席之地。他们将在弥赛亚国度眷临的时候[a]显现出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷临”也可译作“临到”“探访”“察看”或“鉴察”；原词可指探访、监察或审察，此处不宜预先限定为某一种具体事件或结果。
    reason: 提示ἐπισκοπή的语义范围，并保留“弥赛亚国度的眷临”在原文中的属格关系及末世含义的开放性。
lexical_decisions:
- source_word: αἱ γενεαὶ πᾶσαι
  choice: 历代的人
  rationale: γενεαί在此指一代又一代的人；译作“历代的人”比直译“所有世代”更符合现代汉语，同时保留历史延续感。
- source_word: οἱ ἐν ἀγάπῃ τελειωθέντες
  choice: 那些……在爱中达到完全的人
  rationale: 保留完成时被动分词所表达的状态，也保留“爱”与“完全”之间的神学张力，不改写为较弱的“有完全的爱”。
- source_word: κατὰ τὴν τοῦ θεοῦ χάριν
  choice: 照着上帝的恩典
  rationale: κατά在此表示准则或所依凭的恩典；“照着”避免过度限定为单纯原因或方式。
- source_word: χῶρον εὐσεβῶν
  choice: 在敬虔人中有一席之地
  rationale: χῶρον意为地方、位置；属格εὐσεβῶν可自然理解为“敬虔人中的地方”。这一表达既通顺，也不额外具体化为天堂或某一特定来世处所。
- source_word: φανερωθήσονται
  choice: 显现出来
  rationale: 保留将来时被动语态，表达他们将被显明、显现，而不是自行出现。
- source_word: ἐπισκοπῇ
  choice: 眷临
  rationale: 该词可指察看、探访或带有审察意味的临到；“眷临”保留神圣临在与鉴察的双重可能，并以脚注提示语义范围。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός本义为“受膏者”，在此作为称号；“弥赛亚”直接呈现该称号的含义，并与所给审校层的最终用词一致。
theological_decisions:
- issue: 关系代词οἳ的指代
  choice: 另起一句译为“他们”，就近承接“那些……在爱中达到完全的人”，同时语境上也涵盖被称为敬虔人的同一群体
  alternative: 严格译成“这些敬虔人将……”，使其只在语法表面上承接εὐσεβῶν
  rationale: 希腊文关系代词为阳性复数，可在意义上回指前述得以完全的人；由于“敬虔人”很可能与他们同指，中文采用“他们”可保留这种重合，不人为划分为两群人。
- issue: “国度的眷临”所指的事件
  choice: 保留为“弥赛亚国度眷临的时候”
  alternative: 解释性译为“弥赛亚国度降临的时候”或“弥赛亚来察看的时候”
  rationale: 原文将ἐπισκοπή与“国度”构成属格关系，可能强调国度的临到、显现或审察；不应在正文中单一化为某一种末世事件解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“历代的人”“有一席之地”便于普通读者理解；“达到完全”“敬虔”“眷临”则保留原文的宗教语域和神学张力。分号与另起一句处理希腊长句，使关系清楚而不改变论证推进。
