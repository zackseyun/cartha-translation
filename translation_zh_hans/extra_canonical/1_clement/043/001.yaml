  text: Καὶ τί θαυμαστόν, εἰ οἱ ἐν Χριστῷ πιστευθέντες παρὰ θεοῦ ἔργον τοιοῦτο κατέστησαν τοὺς προειρημένους;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/001.yaml
  text: And what is remarkable if those entrusted in Messiah by God with such a work appointed the aforementioned persons?
translation:
  language: zh_hans
  text: 那么，那些在基督里蒙上帝托付了这等工作的人，设立了前面所说的那些人，这有什么稀奇呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，那些蒙上帝在基督里托付了这等工作的人，设立了前面所说的那些人，这有什么稀奇呢？”
    reason: 保留ἐν Χριστῷ在句中可能修饰“托付”方式或领域的附着歧义；不把“这等工作”接到“设立了”上。
lexical_decisions:
- source_word: τί θαυμαστόν
  choice: 这有什么稀奇呢
  rationale: 保留反问语气，采用自然、庄重的现代汉语表达。
- source_word: οἱ ἐν Χριστῷ πιστευθέντες παρὰ θεοῦ
  choice: 那些在基督里蒙上帝托付……的人
  rationale: 将 πιστευθέντες 按被动义理解为“蒙托付”；παρὰ θεοῦ 表明托付来自上帝，ἐν Χριστῷ 保留为“在基督里”。
- source_word: ἔργον τοιοῦτο
  choice: 这等工作
  rationale: 作 πιστευθέντες 所带的宾语，即这些人蒙托付的是“这等工作”，不把它误接到“立了”上。
- source_word: κατέστησαν
  choice: 立了
  rationale: 在任命职分人员的上下文中，简洁表达“任命、设立”。
- source_word: τοὺς προειρημένους
  choice: 前面所说的那些人
  rationale: 明确回指上文已经提及的人，同时不额外指定其身份。
theological_decisions:
- issue: ἐν Χριστῷ 与“蒙托付”的关系
  choice: 在基督里蒙上帝托付
  alternative: 蒙上帝在基督里托付
  rationale: 希腊语在修饰关系上可产生不同附着理解；正文采用较自然且贴近英语审校层的表达，脚注提示另一种句法理解。
- issue: ἔργον τοιοῦτο 的句法归属
  choice: 作为 πιστευθέντες 的宾语：蒙托付这等工作
  alternative: 作为 κατέστησαν 的任命目标：立那些人担任这等工作
  rationale: 源文的宾格短语最自然地由 πιστεύω 的“托付某事”用法支配；后者会加入原文没有的目标介词关系。
translation_notes:
  register: 采用现代标准普通话，语气庄重而易懂。“这等工作”略带书面色彩，与早期教会文献的论述语体相称；“立了”在职分任命语境中简洁自然。
