source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκεῖνος γάρ, ζήλου ἐμπεσόντος περὶ τῆς ἱερωσύνης καὶ στασιαζουσῶν τῶν φυλῶν, ὁποία αὐτῶν εἴη τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη, ἐκέλευσεν τοὺς δώδεκα φυλάρχους προσενεγκεῖν αὐτῷ ῥάβδους ἐπιγεγραμμένας ἑκάστης φυλῆς κατ' ὄνομα· καὶ λαβὼν αὐτὰς ἔδησεν καὶ ἐσφράγισεν τοῖς δακτυλίοις τῶν φυλάρχων, καὶ ἀπέθετο αὐτὰς εἰς τὴν σκηνὴν τοῦ μαρτυρίου ἐπὶ τὴν τράπεζαν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/003.yaml
  text: For when jealousy arose concerning the priesthood and the tribes were engaged in factional strife over which of them was adorned with the glorious name[a], he ordered the twelve tribal leaders to bring him staffs, each inscribed according to the name of its tribe. And taking them, he bound them and sealed them with the rings of the tribal leaders, and placed them in the tent of witness upon the table of God.
translation:
  language: zh_hans
  text: 因为当关于祭司职分的嫉妒兴起、各支派为他们中哪一支派是以那荣耀的名号为装饰的而陷入派系纷争时，他命令十二位支派首领把杖带到他那里来，每根杖上都按所属支派的名称写上名字。他拿过这些杖，把它们捆起来，以各支派首领的印戒加封，然后把它们放在见证帐幕里上帝的桌子上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζήλου
  choice: 嫉妒
  rationale: 此处指围绕祭司职分而生的妒忌与争竞；“嫉妒”保留本段负面的冲突语境。
- source_word: ἱερωσύνης
  choice: 祭司职分
  rationale: 表示祭司的身份、职任或祭司制度；此处争议针对谁享有这一职分。
- source_word: στασιαζουσῶν
  choice: 纷争
  rationale: 该词有结党争斗、陷入派系冲突之意；“纷争”自然简洁，同时保留主动冲突色彩。
- source_word: τῷ ἐνδόξῳ ὀνόματι
  choice: 那荣耀的名号
  rationale: 直译为“荣耀的名字/名号”，在上下文中可能指祭司职分的尊荣称号；保留原文含蓄，不直接替换成“祭司名号”。
- source_word: ῥάβδους
  choice: 杖
  rationale: 与《民数记》所述各支派首领的杖相应；用“杖”而非限定为权杖。
- source_word: σκηνὴν τοῦ μαρτυρίου
  choice: 见证帐幕
  rationale: 形式上对应希腊语，并保留其与以色列礼仪传统的联系。
- source_word: τράπεζαν τοῦ θεοῦ
  choice: 上帝的桌子
  rationale: 原文是“上帝的桌子”，不擅自解释为祭坛或陈设饼桌。
theological_decisions:
- issue: “荣耀的名号”具体指什么
  choice: 保留“那荣耀的名号”这一间接表达
  alternative: 译为“祭司这一荣耀的名号”或“荣耀的祭司名分”
  rationale: 希腊文未在该短语内明确重复“祭司”；保留指代可维持原文的修辞与一定程度的歧义。
- issue: “上帝的桌子”的礼仪对象
  choice: 按原文译为“上帝的桌子”
  alternative: 译为“上帝的祭坛”或“陈设饼桌”
  rationale: 原文使用τράπεζα而非“祭坛”，且此处叙述与现存《民数记》文本的细节并不完全相同，不宜以调和性解释代替翻译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是，他”承接本章前文所指的摩西；本节不自行补出姓名。句法适度拆分，以免希腊文长句在中文中过于沉重，同时保留因果关系、支派纷争及封存诸杖的动作次序。
