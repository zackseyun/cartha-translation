  source_fidelity: 草稿总体准确呈现祭司职分之争、十二支派首领的杖、捆绑加封及安放地点。然“有人因祭司职分而起了嫉妒”无据地补出“有人”，且将无主语的ζήλου ἐμπεσόντος处理得不够贴切；“配得以……为妆饰”将ὁποία…εἴη…κεκοσμημένη（“哪一支派是/会被……装饰”）误作“配得”，增加了原文没有的资格判断。
  naturalness: “以那荣耀的名号为妆饰”及“用……戒指封住”在现代汉语中较生硬。“以各支派首领的印戒加封”既自然，也较准确表达ἐσφράγισεν…τοῖς δακτυλίοις。
  terminology: “祭司职分”“荣耀的名号”“见证帐幕”“上帝的桌子”均可保留。“纷争”可明确为“派系纷争”，以反映στασιαζουσῶν的结党、内讧意味，而不扩大其历史含义。
  issues:
  - severity: medium
    issue: “有人因祭司职分而起了嫉妒”补入未见于原文的施事者。
    rationale: ζήλου ἐμπεσόντος为属格绝对结构，意为“当关于祭司职分的嫉妒发生/兴起时”；原文未说“有人”兴起嫉妒。
  - severity: medium
    issue: “哪一个配得以那荣耀的名号为妆饰”加入“配得”。
    rationale: ὁποία αὐτῶν εἴη τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη询问哪一支派是（或会是）“以荣耀名号为装饰的”，并未明说其是否“配得”。
  - severity: low
    issue: “戒指封住”未明确其印信功能，且措辞不自然。
    rationale: δακτύλιοι在此封缄语境中是用于加印的印戒；译作“印戒加封”更清楚。
