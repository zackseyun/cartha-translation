revisions:
- from: 因为当时有人因祭司职分而起了嫉妒，各支派也纷争，争论他们中哪一个配得以那荣耀的名号为妆饰；于是，他命令十二位支派首领把杖拿来给他，每根杖都按各支派的名称写上名字。他接过这些杖，把它们捆好，用各支派首领的戒指封住，然后放在见证帐幕里上帝的桌子上。
  to: 因为当关于祭司职分的嫉妒兴起、各支派为他们中哪一支派是以那荣耀的名号为装饰的而陷入派系纷争时，他命令十二位支派首领把杖带到他那里来，每根杖上都按所属支派的名称写上名字。他拿过这些杖，把它们捆起来，以各支派首领的印戒加封，然后把它们放在见证帐幕里上帝的桌子上。
  rationale: 修订删除无依据的“有人”，以“当……嫉妒兴起”对应属格绝对结构；将“配得”改为不带资格判断的“是以……为装饰的”，保留原文对“荣耀的名号”指向的含蓄；并以“派系纷争”和“印戒加封”分别更充分、自然地表达στασιάζω和封缄语境中的δακτύλιοι。未设置脚注：英文审校轨迹中的脚注仅记录旧英语译法，不构成此中文译文需保留的源文歧义或注释锚点。
