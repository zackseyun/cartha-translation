  text: τί δοκεῖτε, ἀγαπητοί; οὐ προῄδει Μωϋσῆς τοῦτο μέλλειν ἔσεσθαι; μάλιστα ᾔδει· ἀλλ' ἵνα μὴ ἀκαταστασία γένηται ἐν τῷ Ἰσραήλ, οὕτως ἐποίησεν, εἰς τὸ δοξασθῆναι τὸ ὄνομα τοῦ ἀληθινοῦ καὶ μόνου θεοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/006.yaml
  text: What do you think, beloved? Did not Moses know beforehand that this was going to happen? Certainly he knew. But so that there might not be disorder in Israel, he acted in this way, so that the name of the true and only God might be glorified—to whom be the glory forever and ever. Amen.
translation:
  language: zh_hans
  text: 亲爱的各位，你们怎么看？难道摩西没有预先知道这事将要发生吗？他当然知道。但为了不让以色列中出现混乱，他才这样做，为要使那真实而独一的上帝的名得荣耀。愿荣耀归于他，直到永永远远。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 原词直译为“蒙爱的人”或“亲爱的”，在面向群体的早期基督教劝勉中，用现代汉语“亲爱的弟兄姊妹”自然表达亲密称呼，同时不改变所指群体。
- source_word: ἀκαταστασία
  choice: 混乱
  rationale: 该词可指失序、骚乱或纷乱；此处涉及以色列中祭司职分的争议，以“混乱”保留较宽泛的语义，不具体化为叛乱。
- source_word: δοξασθῆναι
  choice: 得着荣耀
  rationale: 用被动式对应希腊文不定过去时被动不定式，表达上帝的名受到尊崇。
- source_word: ἀληθινοῦ καὶ μόνου θεοῦ
  choice: 真实而独一之上帝
  rationale: 分别保留ἀληθινός的“真实”和μόνος的“独一、唯一”，避免将两者合并为单一概念。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 采用现代中文宗教语境中自然且庄重的表达，对应强调无限延续的希腊语惯用语。
theological_decisions:
- issue: 摩西的预知
  choice: 预先知道
  alternative: 预见
  rationale: προῄδει直接表示事先知道；译文保留其认知陈述，不进一步说明知识的来源或性质。
- issue: 颂荣句的语法关系
  choice: 愿荣耀归给他
  alternative: 荣耀是他的
  rationale: 希腊文ᾧ ἡ δόξα为省略动词的颂荣表达；补出“愿……归给”符合自然汉语，同时不把句子强化为所有权教义陈述。
- issue: 上帝称谓
  choice: 上帝
  alternative: 神
  rationale: θεός可译“上帝”或“神”；采用“上帝”作为庄重、通行且能清楚指向独一上帝的现代标准汉语称谓，不引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文连续的反问、肯定回答、目的从句和颂荣结构；不添加原文没有的教义解释。
