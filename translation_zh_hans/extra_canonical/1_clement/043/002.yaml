  text: ὅπου καὶ ὁ μακάριος πιστὸς θεράπων ἐν ὅλῳ τῷ οἴκῳ Μωϋσῆς τὰ διατεταγμένα αὐτῷ πάντα ἐσημειώσατο ἐν ταῖς ἱεραῖς βίβλοις, ᾧ καὶ ἐπηκολούθησαν οἱ λοιποὶ προφῆται, συνεπιμαρτυροῦντες τοῖς ὑπ' αὐτοῦ νενομοθετημένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/002.yaml
  text: For there also the blessed and faithful servant Moses[a], in all his house, recorded in the sacred books all the things commanded to him, and the rest of the prophets also followed him, bearing witness together to the ordinances enacted by him.
translation:
  language: zh_hans
  text: 在那里，蒙福、在全家中忠信的仆人摩西也把所吩咐他的一切记载在圣书中；其余的先知也跟随他，为他所制定的条例一同作证。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου καὶ
  choice: 在那里
  rationale: 承接上文所指的经文或事例；καί在此带有附加、强调色彩，中文不必机械译出“也”。
- source_word: ὁ μακάριος πιστὸς θεράπων
  choice: 那位蒙福、忠信的仆人
  rationale: μακάριος译为“蒙福”，πιστός译为“忠信”；θεράπων在此指服事神的人，译作“仆人”自然且符合经文语域。
- source_word: ἐν ὅλῳ τῷ οἴκῳ
  choice: 在神全家
  rationale: 保留“全家”的圣经互文表达；依其修饰“忠信”的句法关系调整到定语内部。原文未明说“神”，但语境中的“家”指神的家，中文补出以免误解为摩西自己的家庭。
- source_word: τὰ διατεταγμένα αὐτῷ πάντα
  choice: 吩咐他的一切
  rationale: διατάσσω在此为被动完成时意义，指交付给摩西的全部命令；中文采用自然的主动式表达。
- source_word: ἐσημειώσατο
  choice: 记载
  rationale: 中动态形式表示摩西将这些事记录下来；“记载”适合书面及经文语体。
- source_word: ἐν ταῖς ἱεραῖς βίβλοις
  choice: 在圣书中
  rationale: 直译其复数概念为作为整体的神圣典籍；“圣书”比现代专名“圣经”更能保留早期文本语境。
- source_word: ἐπηκολούθησαν
  choice: 跟随
  rationale: 保留先知继摩西之后、与其传统相承的基本意象，不窄化为单纯时间上的“继起”。
- source_word: συνεπιμαρτυροῦντες
  choice: 一同作证
  rationale: συν-带有共同、相互印证的色彩；与后接与格连用，表示为相关条例作证。
- source_word: τοῖς ὑπ' αὐτοῦ νενομοθετημένοις
  choice: 为他所制定的条例
  rationale: 将与格理解为作证所针对的对象；νενομοθετημένοις为名词化的被动完成分词，指由摩西制定或颁定之事，中文补出“条例”。
theological_decisions:
- issue: “在全家忠信”中的“家”归属
  choice: 译作“在神全家忠信”
  alternative: “在他的全家忠信”或“在全家中忠信”
  rationale: 该措辞明显呼应《民数记》12:7及其后续经文传统，所指是神的家；补出“神”使现代中文读者不会误认作摩西的家庭，同时不改变原意。
- issue: 先知作证的对象及συν-的作用
  choice: “为他所制定的条例一同作证”
  alternative: “与他所制定的条例一同作证”
  rationale: 与格短语最自然地充当συνεπιμαρτυροῦντες所支配的对象，即先知为条例作证，而不是条例与先知共同作证；脚注保留后一种较不可能但语法上曾被提出的理解。
- issue: 条例由谁制定
  choice: 保留“他所制定”指摩西
  alternative: “借着他所颁定”以突出神为最终立法者
  rationale: ὑπ' αὐτοῦ在句法上直接指摩西。译文不额外加入神学上的终极施令者，以免超出本句明说的内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保留“蒙福、忠信、仆人、圣书、作证”等早期基督教文献语汇。长句按中文节奏用分号分隔摩西与众先知两个分句。脚注标记[a]置于相关歧义所在句末。
