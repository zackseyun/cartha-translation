source:
  edition: Funk 1901 (normalized OCR)
  text: πρωΐας δὲ γενομένης συνεκάλεσεν πάντα τὸν Ἰσραήλ, τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν, καὶ ἐπεδείξατο τοῖς φυλάρχοις τὰς σφραγῖδας, καὶ ἤνοιξεν τὴν σκηνὴν τοῦ μαρτυρίου καὶ προεῖλεν τὰς ῥάβδους· καὶ εὑρέθη ἡ ῥάβδος Ἀαρὼν οὐ μόνον βεβλαστηκυῖα, ἀλλὰ καὶ καρπὸν ἔχουσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/005.yaml
  text: Then when morning came, he called together all Israel, the six hundred thousand men, and showed the seals to the tribal leaders; and he opened the tent of witness and brought out the staffs. And the staff of Aaron was found not only to have sprouted, but even to be bearing fruit.
translation:
  language: zh_hans
  text: 到了早晨，他召集了全体以色列人，就是那六十万男子，把封印展示给各支派的首领；随后，他打开见证帐幕，取出那些杖。结果，亚伦的杖不但发了芽，而且还结了果。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωΐας δὲ γενομένης
  choice: 到了早晨
  rationale: 自然表达时间推进，并保留分词结构所表示的时序。
- source_word: τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν
  choice: 就是那六十万男子
  rationale: 将同位说明明确译出；“男子”对应ἀνδρῶν，不泛化为所有人口。
- source_word: τοῖς φυλάρχοις
  choice: 各支派的首领
  rationale: 准确传达φυλάρχοις所指的支派领袖，且符合现代汉语。
- source_word: τὰς σφραγῖδας
  choice: 封印
  rationale: 保留用于验证帐幕未被动过的实体印封含义；上下文虽可理解为封缄标记，但本节不作扩展解释。
- source_word: τὴν σκηνὴν τοῦ μαρτυρίου
  choice: 见证帐幕
  rationale: 贴近希腊文属格结构，并采用易懂而庄重的圣经语体。
- source_word: προεῖλεν τὰς ῥάβδους
  choice: 取出那些杖
  rationale: προεῖλεν表示带出、取出；定冠词指向前文已有的各杖，以“那些”体现。
- source_word: βεβλαστηκυῖα
  choice: 发了芽
  rationale: 完成分词强调已经萌发的状态，以“发了芽”自然表达。
- source_word: καρπὸν ἔχουσα
  choice: 结了果
  rationale: 直译其具有果实的结果状态，并与“发了芽”形成递进。
theological_decisions:
- issue: 帐幕名称的处理
  choice: 见证帐幕
  alternative: 会幕
  rationale: 原文明确为σκηνὴ τοῦ μαρτυρίου（见证之帐幕）；译作“见证帐幕”保留措辞本身，不以传统等效名称消除其表达特色。
- issue: 亚伦之杖显证的程度
  choice: 不但发了芽，而且还结了果
  alternative: 不但萌芽，还带着果实
  rationale: 保留οὐ μόνον…ἀλλὰ καί的强递进关系，不增添关于神迹性质或祭司权柄的解释。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语体。保留“六十万男子”的同位强调和“封印—打开—取出—发现”的证验过程；不加入原文未明说的背景说明。
