  yaml_path: translation/extra_canonical/1_clement/043/004.yaml
  text: And after shutting the tent[a], he sealed the staffs in the same way, and said to them, “Brothers, the tribe whose staff shall sprout—this one God has chosen to serve as priest and to minister to him.”
translation:
  language: zh_hans
  text: 他锁上会幕后，也给钥匙和杖加上了封印，并对他们说：“弟兄们，哪一支派的杖发芽，神就拣选哪一支派，使它履行祭司职分并事奉他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκηνή
  choice: 会幕
  rationale: 此处指存放各支派之杖、用于见证神拣选的圣所帐幕；“会幕”符合上下文，也比单纯的“帐篷”更准确自然。
- source_word: κλεῖδας
  choice: 钥匙
  rationale: 希腊原文明列“钥匙”，与后面的“杖”由καί连接；即使表达在上下文中略显突兀，也应保留，不随咨询层将其删去。
- source_word: ῥάβδους
  choice: 杖
  rationale: 指代表各支派、被放在会幕中的杖；“杖”简洁并符合相关叙事用语。
- source_word: Ἄνδρες ἀδελφοί
  choice: 各位弟兄
  rationale: 这是对群体的郑重称呼；现代汉语用“各位弟兄”自然地传达其敬重语气，无须生硬译出“男人”。
- source_word: εἰς τὸ ἱερατεύειν καὶ λειτουργεῖν αὐτῷ
  choice: 担任祭司、事奉他
  rationale: 分别表达履行祭司职分和向神供职；中文措辞庄重清楚，同时保留两个并列动作。
theological_decisions:
- issue: 神所拣选的是杖还是支派
  choice: 明确以“哪一个支派”为“拣选”的对象
  alternative: 译作“神所拣选的就是那根杖”
  rationale: ταύτην为阴性单数，语法上回指同为阴性的φυλή（支派），而不是阳性的ῥάβδος（杖）；杖发芽是辨认蒙拣选支派的记号。
- issue: “担任祭司”与“事奉”之间的关系
  choice: 保留为两个并列的不定式概念
  alternative: 合并为“在祭司职分上事奉他”
  rationale: 原文用καί连接ἱερατεύειν与λειτουργεῖν；保留并列可避免提前判定二者是同义复述还是有所区分。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“发了芽”承接预期结果，“就是哪一个支派”再现原文强调性的指示结构。忠实保留原文的“钥匙”，不依照英文咨询文本的删节处理。
