revisions:
- from: 他关上会幕，又照样封住钥匙和那些杖，并对他们说：“各位弟兄，哪一个支派的杖发了芽，神所拣选担任祭司、事奉他的，就是哪一个支派。”
  to: 他锁上会幕后，也给钥匙和杖加上了封印，并对他们说：“弟兄们，哪一支派的杖发芽，神就拣选哪一支派，使它履行祭司职分并事奉他。”
  rationale: 修订以希腊文为准，保留κλεῖδας的“钥匙”，不采纳英文审校轨迹中删除该词的上下文性处理。措辞调整旨在使“锁上—钥匙—加封印”的动作链在中文中清楚自然，并保留“履行祭司职分”和“事奉他”两个并列不定式的区分。
