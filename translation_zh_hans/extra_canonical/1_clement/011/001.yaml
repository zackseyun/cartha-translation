  to: 罗得因着好客和敬虔，从所多玛得救；当整个周边地区受火和硫磺审判时，主借此清楚表明：他不撇弃仰望他的人，却把转离的人置于刑罚和苦刑之中。
  rationale: 修订限于消除轻微的语义强化、改善现代汉语搭配，并减少对“转离者”所偏离内容的具体化。其余措辞保留原稿对原文结构、庄重语域和神学称号的忠实处理。
