source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ φιλοξενίαν καὶ εὐσέβειαν Λὼτ ἐσώθη ἐκ Σοδόμων, τῆς περιχώρου πάσης κριθείσης διὰ πυρὸς καὶ θείου, πρόδηλον ποιήσας ὁ δεσπότης, ὅτι τοὺς ἐλπίζοντας ἐπʼ αὐτὸν οὐκ ἐγκαταλείπει, τοὺς δὲ ἑτεροκλινεῖς ὑπάρχοντας εἰς κόλασιν καὶ αἰκισμὸν τίθησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/001.yaml
  text: Because of hospitality and godliness, Lot was saved from Sodom, when the whole surrounding region was judged by fire and sulfur. In this the Master made it plain that he does not abandon those who hope in him, but appoints those who turn aside to punishment and torment.
translation:
  language: zh_hans
  text: 罗得因着好客和敬虔，从所多玛得救；当整个周边地区受火和硫磺审判时，主借此清楚表明：他不撇弃仰望他的人，却把转离的人置于刑罚和苦刑之中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοξενίαν
  choice: 好客
  rationale: 指接待并善待旅客、陌生人的品格；“好客”自然简明，也与罗得接待客旅的叙事背景相符。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 表达对神的敬畏及由此而来的虔诚生活，比单纯“虔诚”更能保留宗教伦理意味。
- source_word: περιχώρου
  choice: 周围全境
  rationale: 指所多玛周边的整个地区；结合 πάσης 译出范围的完整性。
- source_word: κριθείσης
  choice: 受了……审判
  rationale: 保留司法性和神学性的“审判”含义，而不弱化为单纯“毁灭”。
- source_word: πυρὸς καὶ θείου
  choice: 烈火和硫磺
  rationale: 准确对应火与硫磺；“烈火”符合现代汉语灾变语境且行文庄重。
- source_word: ὁ δεσπότης
  choice: 主
  rationale: 此处指拥有权柄的主宰者；“主”是自然、庄重且不额外限定所指身份的译法。
- source_word: τοὺς ἐλπίζοντας ἐπʼ αὐτὸν
  choice: 仰望他的人
  rationale: 表达把盼望和信赖寄托于他；“仰望”在中文宗教语境中自然，并保留持续倚靠之意。
- source_word: ἑτεροκλινεῖς
  choice: 偏离正道的人
  rationale: 该词表示转向另一边、偏离应走方向；补出“正道”使现代读者易懂，同时不具体指定其偏离的教义或行为。
- source_word: κόλασιν καὶ αἰκισμὸν
  choice: 刑罚和苦刑
  rationale: 保留两个并列而有区别的概念：前者是惩罚，后者含虐待、折磨或严酷处置之意。
theological_decisions:
- issue: 罗得获救与好客、敬虔的关系
  choice: 直译为“因着好客和敬虔……得救”
  alternative: 译为“由于他的好客和敬虔，罗得获救”或弱化因果关系
  rationale: 原文 διὰ 明确表达原因或凭借关系。译文保留其神学张力，不擅自改写为这些品格仅是获救后的表现。
- issue: “主”的身份
  choice: 保留为“主”
  alternative: 明确译为“上帝”
  rationale: 原文使用 δεσπότης 而非 θεός；上下文虽明显指神，仍不应把称号直接替换成专名。
- issue: 对偏离者的处置
  choice: “把……置于刑罚和苦刑之中”
  alternative: “注定……受刑罚和折磨”
  rationale: τίθησιν 的基本意象是放置、置于；所选译法保留主动处置与当前陈述的语气，避免加入更强的预定论色彩。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。分号连接罗得获救与全境受审判的对照，第二句明确“借此”的指代关系。避免过度古雅的“硫磺与火”“不弃绝”等措辞，也不把含义解释成特定宗派教义。
