source:
  edition: Funk 1901 (normalized OCR)
  text: συνεξελθούσης γὰρ αὐτῷ τῆς γυναικὸς ἑτερογνώμονος ὑπάρχουσης καὶ οὐκ ἐν ὁμονοίᾳ, εἰς τοῦτο σημεῖον ἐτέθη, ὥστε γενέσθαι αὐτὴν στήλην ἁλὸς ἕως τῆς ἡμέρας ταύτης, εἰς τὸ γνωστὸν εἶναι πᾶσιν, ὅτι οἱ δίψυχοι καὶ οἱ διστάζοντες περὶ τῆς τοῦ θεοῦ δυνάμεως εἰς κρίμα καὶ εἰς σημείωσιν πάσαις ταῖς γενεαῖς γίγονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/002.yaml
  text: For when his wife went out with him[a], being of a different mind and not in agreement, she was made a sign for this reason, so that she became a pillar of salt to this very day[c][b], in order that it might be known to all that the double-minded and those who doubt the power of God become a judgment and a warning to all generations.
translation:
  language: zh_hans
  text: 因为他的妻子与他一同出去，却心怀异念，并不与他同心；为此她被立为一个标记[a]，以致成了一座盐柱，直到今日。这是要让众人知道：心怀二意的人和怀疑上帝能力的人，都会成为万代的审判和警戒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为此她被立为一个标记”也可译作“她被立作这样的标记”。
    reason: εἰς τοῦτο与σημεῖον的句法关系容许两种自然的汉语语序；正文保留“为此”的目的／缘由指向。
  - marker: b
    text: 原文以同一个“成为”同时支配“审判”和“警戒”；“审判”也可理解为受审判的实例，而非指审判临到万代。
    reason: 保留γίγονται εἰς κρίμα καὶ εἰς σημείωσιν的并列结构及κρίμα的语义张力，并澄清汉语可能产生的修饰歧义。
lexical_decisions:
- source_word: ἑτερογνώμονος
  choice: 心怀异念
  rationale: 表达“持不同心意、另有想法”，并与后面的“不能同心一致”相呼应；不把它过度具体化为某一种行为或动机。
- source_word: ὁμονοίᾳ
  choice: 同心一致
  rationale: ὁμόνοια在《革利免一书》中是重要主题词，既指意见相合，也带有群体和睦、协调一致的意味；“同心一致”在现代汉语中自然且保留其群体性。
- source_word: δίψυχοι
  choice: 心怀二意的人
  rationale: 贴近字面“有两颗心”，传达内心分裂、摇摆不定，而不简单等同于一般性的怀疑。
- source_word: διστάζοντες
  choice: 怀疑……的人
  rationale: 在此指对上帝能力迟疑、不确信；与δίψυχοι并列，保留两个近义而不完全相同的概念。
- source_word: σημείωσιν
  choice: 警戒
  rationale: 在此不是单纯的“记号”，而是供后世引以为戒的显著实例；译作“警戒”符合上下文功能。
theological_decisions:
- issue: κρίμα所指的是这些人受到审判，还是他们本身成为审判性的实例
  choice: 成为对万代的审判和警戒
  alternative: 受到审判，并成为万代的警戒
  rationale: 希腊文以同一个γίγονται支配两个并列的εἰς短语，直说这些人成为“审判”和“警戒”。正文保留这一紧张表达，不擅自拆成“受到审判”与“成为警戒”。
- issue: 罗得之妻成为盐柱的叙述性质
  choice: 按作者表述译为“成了一根盐柱，直到今日”
  alternative: 将其弱化为象征或传说性陈述
  rationale: 原文直接陈述此事，并以其作为历代的标记；译文既不弱化，也不添加超出文本的历史或科学判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“同心一致”保留ὁμόνοια在本书中的核心主题色彩；句末维持“审判和警戒”的平行结构，不以解释性改写消除原文张力。
