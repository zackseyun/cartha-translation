  to: 因为他的妻子与他一同出去，却心怀异念，并不与他同心；为此她被立为一个标记[a]，以致成了一座盐柱，直到今日。这是要让众人知道：心怀二意的人和怀疑上帝能力的人，都会成为万代的审判和警戒[b]。
