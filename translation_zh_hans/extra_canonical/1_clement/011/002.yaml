    rationale: οὐκ ἐν ὁμονοίᾳ陈述她不在同心、一致的状态中，并未说她“不能”同心；“不能”会引入原文没有的能力或必然性含义。
  - severity: medium
    issue: “对万代的审判”可能误指审判的对象
    rationale: πάσαις ταῖς γενεαῖς修饰整项结果；中文“对万代的审判”容易表示审判临到万代。改作“成为万代的审判和警戒”较能保留原文称这些人为审判性实例及警示的张力。
  - severity: low
    issue: “一根盐柱”量词不够自然
    rationale: “一座盐柱”在现代汉语中更自然，且不改变叙述内容。
