  yaml_path: translation/extra_canonical/1_clement/046/008.yaml
  text: For he said[a], “Woe to that man. It would have been good for him if he had not been born, rather than to cause one of my chosen ones to stumble. It would have been better for him to have a millstone hung around him and to be sunk into the sea, than to lead one of my chosen ones astray.”
translation:
  language: zh_hans
  text: 因为他说[a]：“那人有祸了！他若没有出生，倒还好过使我所拣选的人中的一个跌倒。他若有一块磨石挂在他身上，沉入海中，倒还好过把我所拣选的人中的一个引入歧途。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这段话结合了福音传统中的相近说法；现存福音书没有完全相同的逐字表述。
    reason: 说明引语与马太福音26:24、18:6及其平行经文的关系，同时避免误称为某一现存福音文本的逐字引用。
lexical_decisions:
- source_word: ἐκλεκτῶν
  choice: 所拣选的人
  rationale: 保留“被拣选”这一核心含义，也自然表达复数及所属关系。
- source_word: σκανδαλίσαι
  choice: 使……跌倒
  rationale: 既保留绊倒的形象，也传达导致人在信仰或行为上失足的含义。
- source_word: μύλον
  choice: 磨石
  rationale: 原词泛指磨石；不额外限定为驴拉的大磨石。
- source_word: καταποντισθῆναι
  choice: 沉入海中
  rationale: 准确表达被淹没、沉入深水的被动含义。
- source_word: διαστρέψαι
  choice: 把……引入歧途
  rationale: 表达使人偏离正道、走入错误方向的使动含义，并与前句“跌倒”有所区分。
theological_decisions:
- issue: “我所拣选的人”的身份范围
  choice: 按原文直译为“我所拣选的人”
  alternative: 译为“我的选民”或具体限定为信徒、门徒
  rationale: 原文没有进一步界定其群体范围，不在译文中加入宗派性或解释性限定。
- issue: 两个比较结构的逻辑关系
  choice: 译作“倒还好过……”
  alternative: 把第一处解释成独立条件句，或将比较对象改写为审判结果
  rationale: 保留希腊文 ἢ 引出的强烈比较：不出生或沉海，比使被拣选者跌倒、偏离更好；不额外补足原文未明说的逻辑环节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那人有祸了”保留警告语气；“套上磨石”比“挂着磨石”更符合汉语搭配。主文中的脚注标记[a]与脚注对应。
