  text: τὸ σχίσμα ὑμῶν πολλοὺς διέστρεψεν, πολλοὺς εἰς ἀθυμίαν ἔβαλεν, πολλοὺς εἰς δισταγμόν, τοὺς πάντας ἡμᾶς εἰς λύπην· καὶ ἐπίμονος ὑμῶν ἐστὶν ἡ στάσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/009.yaml
  text: Your schism has turned many aside, cast many into discouragement, many into doubt, and all of us into grief; and your factional strife persists.
translation:
  language: zh_hans
  text: 你们的分裂使许多人走偏了，使许多人陷入灰心，使许多人犹疑不定，也使我们所有人忧伤；而你们的纷争仍持续不止。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: 分裂
  rationale: 直接表达群体内部的破裂，既保留原词的强烈程度，也符合现代汉语宗教及一般语境。
- source_word: διέστρεψεν
  choice: 使……偏离正道
  rationale: 该动词可指扭曲、使转离或引入歧途；此处以人作宾语，译为“使……偏离正道”自然地传达被引离正确道路之意，同时不过度限定具体偏离的内容。
- source_word: ἀθυμία
  choice: 灰心
  rationale: 表示丧失勇气、消沉；“灰心”简明自然，并保留其情绪与意志层面的含义。
- source_word: δισταγμός
  choice: 疑惑
  rationale: 可表示迟疑、犹疑或怀疑；“心生疑惑”保留语义范围，不将其收窄为纯理智上的怀疑。
- source_word: λύπη
  choice: 忧伤
  rationale: 准确表达悲痛、愁苦，并保持庄重语体。
- source_word: στάσις
  choice: 纷争
  rationale: 在群体冲突语境中指争斗、党争或叛乱；“纷争”不预设正式政治叛乱，也能传达群体内部对立。
- source_word: ἐπίμονος
  choice: 执意不休
  rationale: 该词兼有持续和顽固不退之意；“执意不休”比单纯“仍在继续”更充分地传达其负面的坚持色彩。
theological_decisions:
- issue: διέστρεψεν所指的偏离性质
  choice: 译作“偏离正道”，不明说偏离信仰、真理或教会
  alternative: 使许多人离弃信仰／误入歧途
  rationale: 原文没有明确补出偏离的具体对象；当前译法保持其道德与属灵分量，同时避免加入原文未明说的教义对象。
- issue: στάσις是否译为正式的“结党”或“叛乱”
  choice: 译作“纷争”
  alternative: 党争／叛乱／结党纷争
  rationale: 上下文确有派系冲突意味，但本节本身没有要求将其限定为政治叛乱或组织化结党；“纷争”保留必要张力而不过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文连续排比：“使许多人……使许多人……使许多人……使我们众人……”，以呈现累积性的修辞力度；末句用“仍执意不休”传达纷争持续且顽固的意味。
