  text: ἢ οὐχὶ ἕνα θεὸν ἔχομεν καὶ ἕνα Χριστὸν καὶ ἓν πνεῦμα τῆς χάριτος τὸ ἐκχυθὲν ἐφ’ ἡμᾶς, καὶ μία κλῆσις ἐν Χριστῷ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/006.yaml
  text: Or do we not have one God and one Messiah and one Spirit of grace poured out upon us[b][a], and one calling in Messiah?
translation:
  language: zh_hans
  text: 或者，难道我们不都有一位神、一位弥赛亚、一位倾注在我们身上的恩典之灵，以及在弥赛亚里的一个呼召吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文前三项是“有”的宾语，末项“一个呼召”却转为主格，形成破格的并列；也可理解为：“而且，在弥赛亚里只有一个呼召。”
    reason: 保留原文末项格变化所造成的真实句法歧义。
lexical_decisions:
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 这里用“弥赛亚”传达该称号的受膏者含义，并与本项目既定术语保持一致。
- source_word: πνεῦμα τῆς χάριτος
  choice: 恩典之灵
  rationale: 保留属格结构及其可能的丰富含义，不把它窄化为“赐恩典的灵”或“充满恩典的灵”。
- source_word: κλῆσις
  choice: 呼召
  rationale: 该词在早期基督教语境中指神的召唤；“呼召”既准确又为现代中文读者所熟悉。
- source_word: ἐκχυθέν ἐφ’ ἡμᾶς
  choice: 倾注在我们身上的
  rationale: 保留“倾倒、浇灌在……之上”的意象，并明确该分词修饰“恩典之灵”。
- source_word: ἔχομεν
  choice: 同有
  rationale: 复数主语所共有的合一现实是本句重点；“同有”在中文中比单说“有”更自然地表达这一点，而不改变所列对象的唯一性。
theological_decisions:
- issue: Χριστός应译为称号还是专名式“基督”
  choice: 弥赛亚
  alternative: 基督
  rationale: 源词本为“受膏者”的称号；译作“弥赛亚”能较明显地保留称号意义，也符合项目术语政策。
- issue: μία κλῆσις与前面宾格列举之间的格变化
  choice: 正文按同一反问句中的并列项目自然表达，并用脚注提示希腊文句法转折
  alternative: 另起有限动词句，译作“在弥赛亚里岂不也只有一个呼召吗”
  rationale: 原文末项突然转为主格，可能是急促修辞中的破格结构；另补一个判断动词会过度确定其句法关系，因此正文保留连贯列举，脚注保存原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不然，难道……”承接上文的反问语气；整句保留反复出现的“一位／一个”，突出合一主题。
