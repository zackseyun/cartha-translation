  terminology: “圣洁的人”忠实反映形容词名词化的 τοῖς ἁγίοις，避免将后世较固定的“圣徒”称谓强加于文本。“成为圣洁”与前文“圣洁的人”形成清晰呼应，且不预设具体成圣机制或施事者。
