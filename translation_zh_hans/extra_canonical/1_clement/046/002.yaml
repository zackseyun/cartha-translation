  source_fidelity: 译文准确对应 γέγραπται γάρ 的引文公式，并保留了命令式“你们要”及后半句的将来结果。以“紧密相连”处理 κολλᾶσθε／κολλώμενοι，恰当地表达了依附、联结之义，也保留了原文重复同一词根的呼应。“成为圣洁”自然地传达 ἁγιασθήσονται 的结果；原文未明说施事者，译文没有擅自补出，处理稳妥。
