  text: γέγραπται γάρ· Κολλᾶσθε τοῖς ἁγίοις, ὅτι οἱ κολλώμενοι αὐτοῖς ἁγιασθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/002.yaml
  text: For it is written, “Cling to the holy ones, because those who cling to them will be made holy.”
translation:
  language: zh_hans
  text: 因为经上写着：“你们要与圣洁的人紧密相连，因为与他们紧密相连的人也必成为圣洁。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολλᾶσθε / κολλώμενοι
  choice: 紧密相连
  rationale: 原词有黏合、依附之意；“紧密相连”既保留关系上的亲近与持守，也比字面的“黏附”更符合现代汉语的庄重表达。
- source_word: τοῖς ἁγίοις
  choice: 圣洁的人
  rationale: 这里是形容词作名词，指圣洁之人；译作“圣洁的人”比可能带有后世固定称谓色彩的“圣徒”更直接。
- source_word: ἁγιασθήσονται
  choice: 必成为圣洁
  rationale: 保留将来被动式所表达的结果与被动意味；汉语中以“成为圣洁”自然呈现，而不明确补出施事者。
theological_decisions:
- issue: ἁγιασθήσονται的被动施事者
  choice: 不补出“被上帝”
  alternative: 必被上帝使其成圣
  rationale: 希腊文使用被动式但没有明说施事者；译文保留这种含蓄，避免把虽可能成立的神学理解直接写入正文。
- issue: “圣洁的人”与“成为圣洁”之间关系的性质
  choice: 按原文保留因果陈述，不解释其机制
  alternative: 解释为道德感染、群体归属或上帝的成圣作为
  rationale: 原句只陈述与圣洁之人相连者将成为圣洁，并未说明成圣如何发生。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为经上写着”对应引文公式 γέγραπται γάρ；重复“紧密相连”以保留原文同一词根的修辞呼应。
