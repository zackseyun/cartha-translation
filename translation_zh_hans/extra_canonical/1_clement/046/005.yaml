  yaml_path: translation/extra_canonical/1_clement/046/005.yaml
  text: Why are there quarrels and anger and divisions and schisms and even war among you?
translation:
  language: zh_hans
  text: 为什么你们中间有争吵、愤怒、纷争、分裂，甚至争战呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρεις
  choice: 争吵
  rationale: 保留复数所概括的多起争执，也符合现代汉语的自然表达。
- source_word: θυμοὶ
  choice: 愤怒
  rationale: 直接表达强烈怒气，不额外限定为外显的“暴怒”或“怒气爆发”。
- source_word: διχοστασίαι
  choice: 纷争
  rationale: 表达造成彼此对立、不和的争端，并与后面的“分裂”保持区别。
- source_word: σχίσματα
  choice: 分裂
  rationale: 体现群体内部裂开的状态，保留其比“纷争”更进一步的语义。
- source_word: πόλεμος
  choice: 争战
  rationale: 保留“战争、交战”的强烈意象；“争战”在庄重现代汉语中既自然，也不必把这里限定为字面军事战争。
- source_word: ἐν ὑμῖν
  choice: 你们中间
  rationale: 准确传达群体内部发生这些事的意思。
theological_decisions:
- issue: πόλεμος是字面战争还是群体内部的激烈冲突
  choice: 争战
  alternative: 战争
  rationale: 原文的强烈措辞应予保留，但上下文所指是否为字面军事战争并不明确；“争战”可维持这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的反问句，保留原文五项并列递进的结构，并用“甚至”体现τε在末项上的强调效果。
