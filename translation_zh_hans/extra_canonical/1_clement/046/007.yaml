source:
  edition: Funk 1901 (normalized OCR)
  text: ἱνατί διέλκωμεν καὶ διασπῶμεν τὰ μέλη τοῦ Χριστοῦ καὶ στασιάζομεν πρὸς τὸ σῶμα τὸ ἴδιον, καὶ εἰς τοσαύτην ἀπόνοιαν ἐρχόμεθα, ὥστε ἐπιλαθέσθαι ἡμᾶς, ὅτι μέλη ἐσμὲν ἀλλήλων; μνήσθητε τῶν λόγων Ἰησοῦ τοῦ κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/007.yaml
  text: 'Why do we pull apart and tear to pieces the members of Messiah[a], and rise in revolt against our own body, and come to such a pitch of madness that we forget that we are members of one another?


    Remember the words of Jesus our Lord.'
translation:
  language: zh_hans
  text: '我们为什么要把弥赛亚的肢体拉扯开来、撕成碎片，又与我们自己的身体为敌，竟陷入如此疯狂，以致忘了我们彼此互为肢体呢？


    你们要记住我们的主耶稣所说的话。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλκωμεν καὶ διασπῶμεν
  choice: 拉扯、撕裂
  rationale: 分别体现两个动词“拉开、拖扯”与“强行撕开”的递进力度，同时保持肢体意象自然可懂。
- source_word: τὰ μέλη
  choice: 肢体
  rationale: 既可指身体的各部分，也保留群体成员的比喻意义。
- source_word: στασιάζομεν πρὸς
  choice: 与……为敌
  rationale: 表达结党反抗、对立相争的含义，并与“自己的身体”构成强烈反讽。
- source_word: ἀπόνοιαν
  choice: 失去理智
  rationale: 传达因疯狂或愚妄而丧失判断力的状态，避免使用现代医学诊断色彩过重的词。
- source_word: μέλη ἐσμὲν ἀλλήλων
  choice: 彼此互为肢体
  rationale: 简洁保留相互归属的身体比喻，不弱化为一般的“彼此属于”。
- source_word: μνήσθητε
  choice: 你们要记住
  rationale: 保留复数命令语气，符合对群体的直接劝诫。
theological_decisions:
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός 本义为“受膏者”，此处采用“弥赛亚”以明确其称号意义，并保持源文所指，不额外展开解释。
- issue: 基督群体与身体的关系
  choice: 保留“弥赛亚的肢体”“自己的身体”“彼此互为肢体”三重身体意象
  alternative: 释义为“信徒群体中的成员”
  rationale: 源文有意把群体纷争描绘成撕裂同一身体；直保意象可维持其神学张力。
translation_notes:
  register: 采用现代、庄重而清楚的劝诫语体。“与自己的身体为敌”使原文悖谬感清晰；末句另起一段，保留由质问转入直接命令的节奏。
