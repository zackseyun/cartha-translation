  naturalness: “又在另一处说”作为中文独立引文公式略显主语悬空；“又在另一处这样说”自然，并仍不擅自确定说话者。“与……相处”在现代标准汉语中通顺，且三句平行鲜明。
  terminology: “无辜”“蒙拣选”“乖谬”均可用。“蒙拣选”保留ἐκλεκτός的被动语义和文本中的对应重复；“乖谬／变得乖谬”适当地反映末句的扭曲、乖僻意象，而不强加未明示的宾语。
