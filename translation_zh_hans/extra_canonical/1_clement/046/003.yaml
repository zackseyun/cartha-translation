  to: 又在另一处这样说：“你与无辜的人相处，就会成为无辜的人；与蒙拣选的人相处，就会成为蒙拣选的人；与乖谬的人相处，就会变得乖谬。”
  rationale: 仅作两项低风险的表达调整：以“这样说”改善无明示主语的中文引文公式；以“相处”替换语义较强的“相交”，从而更审慎地对应μετά + 属格。其余措辞保留，以维持原文的泛指性、重复和格言式平行。
