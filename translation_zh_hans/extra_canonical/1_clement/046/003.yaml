  text: And again[a], in another place it says, “With an innocent man you will be innocent, and with an elect one you will be elect, and with a crooked one you will become twisted.”
translation:
  language: zh_hans
  text: 又在另一处这样说：“你与无辜的人相处，就会成为无辜的人；与蒙拣选的人相处，就会成为蒙拣选的人；与乖谬的人相处，就会变得乖谬。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετά + genitive
  choice: 与……相交
  rationale: 此处不只是静态的“和……在一起”，而是格言式地描述与某类人交往所产生的相应影响；补出“相交”使现代汉语自然，同时保留三重平行结构。
- source_word: ἀθῷος
  choice: 无辜的
  rationale: 基本义为无罪、无辜；在此既修饰“人”，又作表语，重复译为“无辜”以保存原文的词语呼应。
- source_word: ἐκλεκτός
  choice: 蒙拣选的
  rationale: 保留“被拣选”的语义及前后同词反复，同时不把无冠词的实体化形容词误解为某一位特定人物或弥赛亚称号。
- source_word: στρεβλός / διαστρέψεις
  choice: 乖谬的／变得乖谬
  rationale: 两词同源，含弯曲、扭曲并引申为品性乖谬之意；中文采用同词呼应，表达与乖谬之人交往而受到扭曲。
- source_word: λέγει
  choice: 说
  rationale: 希腊文为第三人称单数且主语未明说；沿用引文公式“在另一处说”，不擅自补定为“经上”或某位作者。
theological_decisions:
- issue: ἐκλεκτός 是否指特定的“那位蒙拣选者”
  choice: 译作泛指的“蒙拣选的人”
  alternative: “那位蒙拣选者”
  rationale: 原文无冠词，并与“无辜的人”“乖谬的人”构成泛指、格言式的平行；不应使其听起来像特定的基督论称号。
- issue: 末句的结果语气
  choice: “就会变得乖谬”
  alternative: “你就会使之扭曲”
  rationale: διαστρέψεις 形式上可作及物理解，但本引文与诗篇传统的平行结构支持对人的对应状态作中性／不及物式表达；译文保留“成为扭曲”的格言意义，而不另加未出现的宾语。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。三句保持严格平行，并通过“相交”明确 μετά 所表达的人际关联；避免使用可能过于文言的“清白者、乖僻者”等表达，也不补入原文未明说的引文主体。
