  yaml_path: translation/extra_canonical/1_clement/046/004.yaml
  text: Let us therefore join ourselves to the innocent and righteous[a], for these are God’s chosen ones.
translation:
  language: zh_hans
  text: 所以，我们要与无辜而公义的人紧密相连；他们就是上帝所拣选的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“而他们是上帝所拣选的人。”
    reason: δὲ在这里可作承接或补充理解，不一定强调‘就是’所表达的识别语气。
lexical_decisions:
- source_word: κολληθῶμεν
  choice: 我们要……紧密相连
  rationale: 该词表示黏合、依附或紧密联合；此处用劝勉式表达，既保留紧密结合的力度，也符合现代汉语习惯。
- source_word: τοῖς ἀθῴοις καὶ δικαίοις
  choice: 与无辜而公义的人
  rationale: ἀθῷος指无辜、无罪责，δίκαιος指公义、正直；保留两个并列性质词，不将其合并弱化。
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: 上帝所拣选的人
  rationale: 以自然汉语表达属格关系及‘蒙拣选者’之意，不额外引入有关拣选方式或范围的教义解释。
theological_decisions:
- issue: 后半句与前述‘无辜而公义的人’的关系
  choice: 译作‘他们就是上帝所拣选的人’
  alternative: ‘因为他们是上帝所拣选的人’
  rationale: 希腊文δὲ可表示承接、补充或轻微转折，原句未明确使用因果连词；正文保留识别、说明关系，避免把它强化为明确因果。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体；以分号呈现原文两个紧密相连而又各自完整的分句。
