  language: zh_hans
  text: 所以，弟兄们，我们也必须紧随这样的榜样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοιούτοις οὖν ὑποδείγμασιν
  choice: 所以……这样的榜样
  rationale: τοιούτοις 指前文所述同类榜样，οὖν 表示承接推论；中文以“所以”自然衔接上下文。
- source_word: κολληθῆναι
  choice: 效法
  rationale: 该词本义为“紧贴、依附”；与“榜样”搭配时，直译“依附于榜样”在现代汉语中生硬，“效法”自然表达紧随这些榜样而行的语境含义。
- source_word: καὶ ἡμᾶς δεῖ
  choice: 我们也必须
  rationale: 保留 καί 的“也”和 δεῖ 所表达的必要性。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 采用初期基督徒书信中对群体成员的传统称呼；原文为阳性复数，语境中也可能涵盖整个会众。
