  yaml_path: translation/extra_canonical/1_clement/042/001.yaml
  text: The apostles were given the good news for us from the Lord Jesus Messiah, and Jesus the Messiah was sent out from God.
translation:
  language: zh_hans
  text: 使徒们从主耶稣基督领受了为我们而来的福音；耶稣基督是由上帝差遣而来的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ ἀπόστολοι
  choice: 使徒们
  rationale: 采用现代汉语中通行且准确的基督教历史术语，保留复数意义。
- source_word: ἡμῖν εὐηγγελίσθησαν
  choice: 领受了要传给我们的福音
  rationale: 该罕见被动结构按语境表达使徒从主领受福音、又以‘我们’为传达对象；译文保留ἡμῖν的受益或指向意义，同时避免生硬的‘被福音化’。
- source_word: ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: 从主耶稣基督
  rationale: ἀπό表示来源；Χριστός在此与专名连用，采用中文通行称谓‘基督’，不另行解释为‘弥赛亚’。
- source_word: ἐξεπέμφθη
  choice: 奉……差遣而来
  rationale: 保留ἐκπέμπω‘差遣出去’的被动意义，并以自然汉语显明差遣者是上帝。
- source_word: τοῦ θεοῦ
  choice: 上帝
  rationale: 采用现代标准汉语中庄重、通行的神称。
theological_decisions:
- issue: 两重差遣关系及其次序
  choice: 使徒从主耶稣基督领受福音，耶稣基督奉上帝差遣
  alternative: 把两句都直译为同一种‘被差遣’，或将前句译作‘使徒由主奉差遣’
  rationale: 原文前句使用εὐαγγελίζομαι，后句使用ἐκπέμπω；译文保留动词差异，也呈现上帝—基督—使徒—我们的传递次序，不额外建立超出文本的教制结论。
translation_notes:
  register: 语言庄重而现代；用分号呈现希腊原句的平行递进结构。无脚注标记。
