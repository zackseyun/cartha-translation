base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/005.yaml
  text: And this was not something new[a], for indeed it had been written about overseers and deacons from many ages ago. For thus the Scripture says somewhere, “I will appoint their overseers in righteousness, and their deacons in faith.”
translation:
  language: zh_hans
  text: 这并不是什么新事；因为早在很久以前，经上已经写到监督和执事。圣经中有一处这样说：“我要按公义设立他们的监督，按信实设立他们的执事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ καινῶς
  choice: 并不是什么新事
  rationale: 自然表达“不是新近出现的事”，保留作者强调此安排由来已久的意思。
- source_word: ἐκ γὰρ δὴ πολλῶν χρόνων
  choice: 因为早在许多世代以前
  rationale: 体现 πολλῶν χρόνων 的长久时间跨度，并以现代汉语顺畅表达 γὰρ δὴ 的强调和说明作用。
- source_word: ἐπισκόπων
  choice: 监督
  rationale: 保留该词“看顾者、监督者”的职分含义，避免直接套用带有特定宗派制度色彩的称谓。
- source_word: διακόνων
  choice: 执事
  rationale: 这是现代汉语基督教语境中对 διάκονος 的通行职分译名，也与本段职分并列关系相称。
- source_word: οὕτως γάρ που λέγει ἡ γραφή
  choice: 圣经中有一处这样说
  rationale: 同时保留 οὕτως“这样”和 που“某处”的语义，以自然汉语呈现引用公式。
- source_word: ἐν δικαιοσύνῃ
  choice: 按公义
  rationale: 介词短语可表方式或规范；“按公义”在汉语中自然，并不把关系过度限定为某一种语法解释。
- source_word: ἐν πίστει
  choice: 按信实
  rationale: πίστις 在此引文平行结构中可指忠信、信实；选择“信实”较符合任命职分者的品质语境，同时避免仅理解为主观信仰。
theological_decisions:
- issue: ἐπίσκοποι 与 διάκονοι 是否应译为后世制度化教阶名称
  choice: 译作“监督”和“执事”
  alternative: 译作“主教”和“辅祭”
  rationale: 原文虽使用后来成为教阶术语的词，但此处不宜把后世特定教制反投射进文本；“监督、执事”既保留职分含义，也较少宗派限定。
- issue: ἐν πίστει 中 πίστις 的含义
  choice: 译作“按信实”
  alternative: 译作“在信仰中”或“凭信心”
  rationale: 与“按公义”的平行结构及职分任命语境相配，“信实”较可能指可靠、忠诚；但原词本身仍有“信仰/信心”的语义范围，因此不作教义性扩展。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。引文保留原文对以赛亚书文本的早期基督教式改写，不按现存旧约译本校正；全节无需脚注。
