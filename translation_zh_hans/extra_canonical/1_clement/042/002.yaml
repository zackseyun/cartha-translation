base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/002.yaml
  text: So then Messiah is from God[a], and the apostles are from Messiah; therefore both came about in good order by the will of God.
translation:
  language: zh_hans
  text: 所以，弥赛亚来自上帝，使徒来自弥赛亚；这两件事都是按着上帝的旨意有序地成就的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Χριστός
  choice: 弥赛亚
  rationale: 按其希腊语称号的含义译出，既准确表达“受膏者”，也符合现代中文的通行圣经用语。
- source_word: ἀπό
  choice: 来自
  rationale: 保留两处表示来源的平行结构：弥赛亚来自上帝，使徒来自弥赛亚。
- source_word: ἀμφότερα
  choice: 这两者
  rationale: 指前述两个彼此对应的来源或差遣关系，同时保留原文中性复数概括表达的简洁性。
- source_word: εὐτάκτως
  choice: 有条不紊地
  rationale: 表达按适当次序、井然有序之意，符合此处论述秩序的语境。
- source_word: ἐκ θελήματος θεοῦ
  choice: 按着上帝的旨意
  rationale: ἐκ 与“旨意”连用表示事情所依据或发端的意愿；中文用“按着”自然传达这一关系，避免生硬的“来自旨意”。
- source_word: ἐγένοντο
  choice: 成就的
  rationale: 表示前述两件事得以发生、实现；“成就”在庄重现代中文中兼顾事件发生和旨意实现的意味。
theological_decisions:
- issue: 弥赛亚与上帝、使徒与弥赛亚之间的来源关系
  choice: 以两个完全平行的“来自”直译
  alternative: 译为“受上帝差遣／受弥赛亚差遣”
  rationale: 原文使用宽泛的来源介词 ἀπό，并未明说“差遣”；保留“来自”可避免把上下文可能包含的差遣含义直接写入正文。
- issue: 上帝旨意与有序成就之间的关系
  choice: “按着上帝的旨意”
  alternative: “出于上帝的旨意”
  rationale: 两者均可表达 ἐκ θελήματος θεοῦ；“按着”在中文中更自然地连接旨意、秩序与成就，同时不额外界定旨意作用的具体方式。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留原文两组来源关系的平行结构，并以“这两者”承接；不增加原文未明说的“差遣”或制度性术语。
