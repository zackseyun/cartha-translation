  text: κατὰ χώρας οὖν καὶ πόλεις κηρύσσοντες καθίστανον τὰς ἀπαρχὰς αὐτῶν, δοκιμάσαντες τῷ πνεύματι, εἰς ἐπισκόπους καὶ διακόνους τῶν μελλόντων πιστεύειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/004.yaml
  text: So, preaching through regions and cities, they appointed their firstfruits, after testing them by the Spirit, to be overseers and deacons for those who were going to believe.
translation:
  language: zh_hans
  text: 于是，他们在各地区和城市传道；他们经过圣灵的察验，任命最先归信的一批人[a]为将要信之人的监督和执事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最先归信的一批人”原文直译为“他们的初熟果子”，指各地最早归信的一批人。
    reason: 保留ἀπαρχαί的农业祭献比喻及其“最先一批”的含义。
lexical_decisions:
- source_word: κατὰ χώρας οὖν καὶ πόλεις
  choice: 于是……在各地各城
  rationale: κατά配合复数可表达遍及各地区和城市；“各地各城”自然简洁，并保留οὖν的承接意味。
- source_word: κηρύσσοντες
  choice: 传道
  rationale: 指公开宣讲福音信息；“传道”符合早期基督教语境，又不额外限定所宣讲内容。
- source_word: τὰς ἀπαρχὰς αὐτῶν
  choice: 初信的那些人
  rationale: 字面为“他们的初熟果子”，在此喻指各地最早归信的一批人；正文采用明白的意义翻译，脚注保留原有比喻。
- source_word: δοκιμάσαντες τῷ πνεύματι
  choice: 借着圣灵考验了
  rationale: δοκιμάζω表示考验、察验以确认是否合格；τῷ πνεύματι可理解为凭借圣灵，译文保留这一工具性关系。
- source_word: ἐπισκόπους καὶ διακόνους
  choice: 监督和执事
  rationale: 采用能反映早期职分名称、又较为通行的对应词；不把ἐπίσκοπος预先解释为后期特定教阶。
- source_word: τῶν μελλόντων πιστεύειν
  choice: 服事将要信的人
  rationale: 属格短语说明这些职分所面向的群体；补出“服事”使汉语关系清楚，但不把“将要”削弱为泛指未来可能性。
theological_decisions:
- issue: τῷ πνεύματι中的“灵”是否明确指圣灵
  choice: 圣灵
  alternative: 灵／在属灵方面
  rationale: 在使徒考验并任命教会职分的语境中，定冠词单数τῷ πνεύματι最自然地指圣灵；但原文没有进一步说明考验的具体方式。
- issue: ἐπισκόπους是否采用后期教阶称谓
  choice: 监督
  alternative: 主教
  rationale: “监督”较能保留一世纪职分词的基本含义，避免把后期制度化的主教职分直接读入文本。
- issue: τῶν μελλόντων πιστεύειν与任命对象的关系
  choice: 监督和执事服事将要信的人
  alternative: 把他们任命为将要信之人的监督和执事
  rationale: 原文属格可直接依附两个职分名称；汉语补出“服事”表达职分面向，同时不主张超出原文的具体权力结构。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文“传道—考验—任命”的行动次序；职分名称使用“监督、执事”，避免以后期宗派制度解释早期文本。
