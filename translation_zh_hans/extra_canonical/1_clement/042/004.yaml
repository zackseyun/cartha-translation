  rationale: 以“最先归信的一批人”准确呈现ἀπαρχάς的优先性，并使脚注紧邻对应词语。“经过圣灵的察验”保留δοκιμάσαντες τῷ πνεύματι的工具性表达；删除原文未明说的“服事”，直接译出职分名称与“将要信之人”的属格关系。
