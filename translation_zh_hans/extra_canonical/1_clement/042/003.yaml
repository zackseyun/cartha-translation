source:
  edition: Funk 1901 (normalized OCR)
  text: παραγγελίας οὖν λαβόντες καὶ πληροφορηθέντες διὰ τῆς ἀναστάσεως τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ, μετὰ πληροφορίας πνεύματος ἁγίου ἐξῆλθον εὐαγγελιζόμενοι, τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/003.yaml
  text: Therefore[a], after receiving instructions and being fully assured through the resurrection of our Lord Jesus Messiah, and being confirmed in the word of God, they went out with the full assurance of the Holy Spirit, proclaiming the good news that the kingdom of God was about to come.
translation:
  language: zh_hans
  text: 所以，他们领受了指示，借着我们主耶稣弥赛亚的复活得了完全的确信，又在上帝的话语中得着坚固；他们便怀着圣灵的充分确信出去，宣告福音：上帝的国即将来临[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将要来临”。
    reason: μέλλειν ἔρχεσθαι可强调临近，也可较一般地表示未来将发生。
lexical_decisions:
- source_word: παραγγελίας
  choice: 吩咐
  rationale: 指所领受的指示或命令；“吩咐”既保留权威意味，也符合现代中文表达。
- source_word: πληροφορηθέντες
  choice: 得了充分的确信
  rationale: 该词表示获得充分把握、深信不疑；与后文同根名词 πληροφορία 的译法相互呼应。
- source_word: πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ
  choice: 因上帝的话语得到确证
  rationale: 被动分词表达他们得到确认或坚固；介词短语可表示凭借或范围，此译文以自然中文表达其依据，同时不把它缩减为单纯的主观相信。
- source_word: μετὰ πληροφορίας πνεύματος ἁγίου
  choice: 带着圣灵的充分确信
  rationale: 保留属格结构的简洁和一定开放性，不在正文中强行判定为“圣灵所赐的确信”或“对于圣灵的确信”。
- source_word: εὐαγγελιζόμενοι
  choice: 宣告福音
  rationale: 表达公开传扬好消息的动作，在早期基督教语境中“福音”自然且为普通读者熟悉。
- source_word: μέλλειν ἔρχεσθαι
  choice: 即将来临
  rationale: μέλλω 加不定式带有将要发生、临近发生之意；中文间接引语通常无须像英文那样作过去时回移。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ 中 Χριστός 的译法
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: Χριστός 在此保有“受膏者／弥赛亚”的称号意义；采用“弥赛亚”避免仅将其视为固定姓名，同时不增加宗派性解释。
- issue: πνεύματος ἁγίου 属格的关系
  choice: 圣灵的充分确信
  alternative: 圣灵所赐的充分确信
  rationale: 希腊文属格本身未明说是来源、归属还是关联；正文保留张力，不无根据地补出“所赐”。
- issue: 上帝之国来临的时间意味
  choice: 即将来临
  alternative: 将要来临
  rationale: μέλλειν ἔρχεσθαι 具有将临意味，并可能带临近感；正文采用“即将”，脚注给出较弱的时间表达，以保存语义幅度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文连续分词形成的推进关系，但用分号划分较长句子；“上帝的话语”“宣告福音”“上帝的国”等表达兼顾可读性与早期基督教文本语域。
