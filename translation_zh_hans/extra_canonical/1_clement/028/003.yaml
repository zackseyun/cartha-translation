base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/003.yaml
  text: “Where shall I go, and where shall I hide from your face? If I go up into heaven, you are there; if I depart to the farthest parts of the earth, there is your right hand; if I lie down in the depths, there is your Spirit.”
translation:
  language: zh_hans
  text: “我往哪里去？又在哪里藏身，躲避你的面？我若升到天上，你在那里；我若去到大地的尽头，你的右手也在那里；我若躺卧在深渊中，你的灵也在那里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποῦ ἀφίξω
  choice: 我往哪里去
  rationale: ἀφικνέομαι在此表示到达、前往；用“往哪里去”自然地承接无处逃避上帝临在的语境。
- source_word: κρυβήσομαι ἀπὸ τοῦ προσώπου σου
  choice: 藏在哪里，才能躲开你的面
  rationale: 保留πρόσωπον的具体意象“面”，并以“躲开”表达ἀπό在隐藏语境中的远离含义。
- source_word: τὰ ἔσχατα τῆς γῆς
  choice: 大地的尽头
  rationale: 直译其空间极限意象，不把它限定为某一方位或地区。
- source_word: ἡ δεξιά σου
  choice: 你的右手
  rationale: 保留原文拟人化表达及其可能蕴含的能力、掌管或扶持意味，不在正文中加以解释。
- source_word: καταστρωθῶ εἰς τὰς ἀβύσσους
  choice: 躺卧在深渊中
  rationale: καταστρώννυμι的被动形式在此可表达铺陈自身、躺卧；“躺卧”避免添加原文没有的“床”，复数ἀβύσσους在汉语中以集合性“深渊”自然表达。
- source_word: τὸ πνεῦμά σου
  choice: 你的灵
  rationale: πνεῦμα在此译作“灵”，既忠于措辞，也不预先界定其具体神学所指。
theological_decisions:
- issue: 上帝临在与人的逃避
  choice: 以“你在那里……也在那里”保留诗性陈述
  alternative: 解释为上帝无所不在、无人能逃脱
  rationale: 原文借空间层层展开表达，正文不应把诗性张力改写成抽象教义命题。
- issue: “右手”所表示的作用
  choice: 保留“你的右手”
  alternative: 译为“你的能力／权柄”
  rationale: 原文意象可兼具能力、掌管、扶持等含义；直保意象可避免只选定其中一种。
- issue: “你的灵”的身份与功能
  choice: 保留“你的灵”
  alternative: 明确译成“圣灵”或“你的气息”
  rationale: 原文只说τὸ πνεῦμά σου；保留词义范围，不额外加入称号或缩窄为气息。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留引文的诗性排比和第二人称直陈。避免生硬古语，也不增添原文没有的解释性神学术语。
