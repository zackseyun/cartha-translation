  text: Where, then, can one go, or where can one escape from the one who encompasses all things?
translation:
  language: zh_hans
  text: 那么，人能往哪里去，或能从哪里逃离那包容万有者呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποῖ ... ἀπέλθῃ
  choice: 能到哪里去
  rationale: 以自然的现代汉语表达去往某处的反问语气；情态“能”由上下文所含的不可能性引出。
- source_word: ποῦ ἀποδράσῃ
  choice: 又能逃到哪里
  rationale: 保留ἀποδράσῃ“逃走、逃脱”的力度，并与前一问句形成平行。
- source_word: τοῦ τὰ πάντα ἐμπεριέχοντος
  choice: 那包容万有的主
  rationale: ἐμπεριέχω表示环抱、包围或涵括；“包容万有”简洁保留其空间性与普遍范围。希腊文以带冠词的分词指代上文的神，汉语用“主”明确所指而不展开额外解释。
theological_decisions:
- issue: 带冠词分词所指对象的表达
  choice: 译作“那包容万有的主”
  alternative: 译作“那包容万有者”或“那位包容万有的”
  rationale: 上下文明指神；“主”在汉语宗教文体中自然且庄重，同时未给原文添加具体的位格称谓或教义说明。
- issue: ἐμπεριέχοντος的含义范围
  choice: 包容万有
  alternative: 环抱万有／围住万有／涵盖一切
  rationale: “包容”兼具环绕与涵括之意，避免把神与万有的关系过度解释为单纯空间包围，也不将其抽象化为仅仅“知道”或“掌管”。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式；以“那么……又……”再现οὖν及两个疑问分句的推进。经文无脚注标记。
