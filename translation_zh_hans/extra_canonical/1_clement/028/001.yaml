source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντων οὖν βλεπομένων καὶ ἀκουομένων, φοβηθῶμεν αὐτὸν καὶ ἀπολίπωμεν φαύλων ἔργων μιαρὰς ἐπιθυμίας, ἵνα τῷ ἐλέει αὐτοῦ σκεπασθῶμεν ἀπὸ τῶν μελλόντων κριμάτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/001.yaml
  text: Therefore, since all things are seen and heard, let us fear him and leave behind the foul desires for wicked deeds, so that by his mercy we may be sheltered from the judgments that are about to come.
translation:
  language: zh_hans
  text: 所以，既然一切都被看见、被听见，我们就当敬畏他，摒弃作恶的污秽欲望[a]，好使我们因他的怜悯而蒙庇护，免受将要临到的审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“属于恶行的污秽欲望”。
    reason: 希腊文属格 φαύλων ἔργων 最自然可理解为欲望所指向的对象，但也可较宽泛地理解为所属或关联。
lexical_decisions:
- source_word: βλεπομένων καὶ ἀκουομένων
  choice: 被看见、被听见
  rationale: 保留两个被动分词及其并列结构；施动者在希腊文中未明说，因此不直接补出“被上帝”。
- source_word: φοβηθῶμεν
  choice: 我们就当敬畏他
  rationale: 在劝勉语境中，φοβέομαι 指对上帝怀有敬畏；“敬畏”比单纯的“害怕”更符合此处语义和庄重语体。
- source_word: ἀπολίπωμεν
  choice: 摒弃
  rationale: 表达离开、弃绝之意，同时自然搭配后面的“欲望”。
- source_word: μιαρὰς ἐπιθυμίας
  choice: 污秽欲望
  rationale: μιαρός 含污秽、玷污之意；用“污秽”保留其强烈的道德评价。
- source_word: φαύλων ἔργων
  choice: 作恶的
  rationale: 将属格理解为欲望所指向的对象，即“想要行恶”，以自然汉语表达为“作恶的欲望”。
- source_word: σκεπασθῶμεν ἀπὸ
  choice: 蒙庇护，免受
  rationale: 兼顾 σκεπάζω 的遮盖、护庇意象和 ἀπό 所表达的避开审判结果。
- source_word: τῶν μελλόντων κριμάτων
  choice: 将要临到的审判
  rationale: μέλλω 表示即将发生；κρίματα 为复数，但汉语“审判”可自然涵盖多项或多次判决而不必生硬量化。
theological_decisions:
- issue: 一切被谁看见、听见
  choice: 保留被动表达，不明说施动者
  alternative: 译作“上帝看见、听见一切”
  rationale: 上下文显然指向上帝，但原文使用无人称的被动结构；正文保留这一表达，避免把隐含信息提升为明说内容。
- issue: φαύλων ἔργων 与 ἐπιθυμίας 的关系
  choice: 理解为指向恶行的欲望，即“作恶的污秽欲望”
  alternative: 理解为“属于恶行的污秽欲望”
  rationale: 该属格最自然地作宾语属格或内容属格，表示欲望以恶行为对象；脚注保留另一种较宽泛的所属关系读法。
- issue: 怜悯与免受审判的关系
  choice: 按 ἵνα 和 τῷ ἐλέει αὐτοῦ 表达为“好使我们因他的怜悯而蒙庇护”
  alternative: 译成仅凭人的敬畏与弃恶而逃避审判
  rationale: 原文明说庇护出于“他的怜悯”，同时将前面的劝勉置于目的结构中；译文保留二者之间未被进一步解释的张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“我们就当”体现第一人称复数劝勉式；“蒙庇护，免受”既保留遮护意象，也使汉语意义清楚。
