base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/002.yaml
  text: 'For where can anyone of us flee from his mighty hand? Or what world will receive anyone who deserts from him? For the Scripture says somewhere:'
translation:
  language: zh_hans
  text: 因为我们中有谁能逃离他大能的手呢？又有哪一个世界会接纳任何背弃他的人呢？因为经上某处说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经上某处说”所引内容见《诗篇》139:7–10；《一克莱门特书》所引的希腊文措辞与现存《七十士译本》并不完全相同。
    reason: 交代引文来源，并说明其与现存《七十士译本》的措辞差异；正文仍保留原文不定的出处表达。
lexical_decisions:
- source_word: κραταιᾶς χειρός
  choice: 大能的手
  rationale: 保留“手”的身体意象，并以“大能”表达 κραταιός 所指的强大、不可抗拒。
- source_word: κόσμος
  choice: 世界
  rationale: 按通常意义直译，保留反问中遍察整个受造领域的空间意味。
- source_word: τῶν αὐτομολούντων ἀπ᾿ αὐτοῦ
  choice: 那背离他的人
  rationale: αὐτομολέω 原有叛逃、投奔敌方之意；“背离”自然庄重，也保留主动离弃的负面含义，避免现代“叛逃”过强的政治色彩。
- source_word: τὸ γραφεῖον
  choice: 经上
  rationale: 此处指神圣书卷或经文；汉语“经上说”是自然且准确的引经表达。
- source_word: πού
  choice: 有一处
  rationale: 这里是不定地点副词，表示“在某处”；译作“有一处”符合汉语引文习惯，同时不补定具体出处。
theological_decisions:
- issue: 是否明确“他”指上帝
  choice: 保留代词“他”
  alternative: 译作“上帝”或“神”
  rationale: 原文使用 αὐτοῦ，且上文已提供指称对象；保留代词避免在本节内添加原文没有的显明称谓。
- issue: “哪一个世界”是否改释为“哪里”
  choice: 保留“哪一个世界”
  alternative: 译作“还有哪里”
  rationale: κόσμος 明确是“世界”，这一 unusual 的表达强化无人能逃离其权能的张力，不宜静默化解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两个反问句保持原文递进结构；末尾用冒号引出下一节的经文引语。
