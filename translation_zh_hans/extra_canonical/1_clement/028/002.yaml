review_pass:
  verdict: revise
  source_fidelity: 整体准确地传达了两个反问、κραταιᾶς χειρός的力量意象、κόσμος的“世界”以及引经时πού所保留的不定出处。第二问中的τινα带不定泛指，中文宜明确为“任何……的人”，以免“那……的人”造成特指感。
  naturalness: 语体庄重自然。“经上某处说”比“经上有一处说”更凝练，也更符合现代汉语的引经表达。保留“哪一个世界”虽略带修辞性，但忠实保留原文κόσμος及其反问张力。
  terminology: “大能的手”“世界”“经上”均合适。“背离”可表达离弃，但“背离他的人”配合“那”略弱化并特指化了αὐτομολούντων的叛离/逃离意味；改为“背弃他的人”较自然，且以“任何”保留不定性。脚注应明确是《一克莱门特书》所引文本与现存《七十士译本》不完全相同，而非笼统称“古希腊文本”。
