- from: 因为我们中有谁能逃离他大能的手呢？又有哪一个世界会接纳那背离他的人呢？因为经上有一处说：[a]
  to: 因为我们中有谁能逃离他大能的手呢？又有哪一个世界会接纳任何背弃他的人呢？因为经上某处说：[a]
  rationale: 仅作两项安全的微调：以“任何背弃他的人”保留原文的不定泛指并使中文更自然；将脚注的比较对象明确为《一克莱门特书》引文与现存《七十士译本》。其余译文忠实且适合现代庄重书面语。
