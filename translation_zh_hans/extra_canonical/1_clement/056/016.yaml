  rationale: 以“有何等有力的辩护”自然呈现“何等大的辩护存在于受主管教的人身上”这一原文表达，同时不把其具体限定为法律程序。“良善的父”更直接对应ἀγαθὸς πατήρ。补出“弟兄们”以体现ἀγαπητοί作为复数呼语的常见中文书信体表达，且不改变其亲切、劝勉的语气。
