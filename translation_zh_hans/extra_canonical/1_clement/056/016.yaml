base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/016.yaml
  text: See, beloved, how great a defense there is for those who are disciplined by the Master. For, being a good Father, he disciplines us so that we may receive mercy through his holy discipline.
translation:
  language: zh_hans
  text: 亲爱的弟兄们，你们看，受主管教的人有何等有力的辩护！因为他是良善的父，管教我们，为要使我们借着他圣洁的管教蒙怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερασπισμός
  choice: 维护
  rationale: 该词指为受管教者提供的护卫、支持或辩护。“维护”既保留保护与声援的含义，也比单纯的“保护”更贴近其替人撑持、护卫的语感。
- source_word: παιδευομένοις / παιδεύει / παιδείας
  choice: 受管教 / 管教 / 管教
  rationale: 同一词根贯穿全句，兼有教育、训练和纠正之意；统一译作“管教”，既符合父亲管教儿女的语境，也保留其中可能包含的惩戒意味。
- source_word: δεσπότου
  choice: 主
  rationale: 在此指拥有权柄的主宰；“主”在中文宗教语境中自然庄重，并避免“主人”可能产生的世俗奴属联想。
- source_word: ἀγαθὸς
  choice: 慈爱
  rationale: 在“父”与“管教”的语境中，ἀγαθός不只表示一般意义的“好”，也突出其良善仁慈；译作“慈爱”使现代中文自然，同时与后文“蒙怜悯”呼应。
- source_word: ὁσίας
  choice: 圣洁的
  rationale: 保留该词所表达的敬虔、神圣和合宜于神的性质；“圣洁的”是清楚而庄重的现代中文表达。
theological_decisions:
- issue: 管教与蒙怜悯之间的关系
  choice: “为要使我们……蒙怜悯”
  alternative: “以致我们……蒙怜悯”
  rationale: εἰς τό加不定式可表示目的或结果。正文采用自然的目的表达，但不进一步说明管教本身如何带来怜悯，因而不引入特定的救恩论解释。
- issue: “主”与“父”的所指
  choice: 以同一代词“他”承接，保留原文自然形成的同一所指
  alternative: 明确补出“上帝”或分别处理两个称谓
  rationale: 原文先称δεσπότης，继而称其为ἀγαθὸς πατήρ；不额外补入原文没有的神名，也不割裂两个称谓。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“亲爱的，你们看”保留使徒性劝勉的直接语气；感叹句体现πόσος的强烈程度。全句尽量保留原文重复的“管教”，使论证链条清楚可见。
