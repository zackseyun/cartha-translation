  text: And he will hide you from the scourge of the tongue[a], and you will certainly not fear evils when they come.
translation:
  language: zh_hans
  text: 他也必把你藏起来，使你免受口舌的鞭笞[a]；你也绝不会惧怕将临的灾祸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “口舌的鞭笞”也可译为“口舌的鞭子”；指恶意言语所造成的伤害。
    reason: 说明μάστιγος γλώσσης的比喻性表达，并保留正文中“鞭笞”的原文意象。
lexical_decisions:
- source_word: κρύψει
  choice: 必将你隐藏，使你免受
  rationale: 保留“隐藏、庇护”的核心意象，同时用自然汉语表达其后接ἀπό所表示的保护、免受之意。
- source_word: μάστιγος γλώσσης
  choice: 口舌的鞭打
  rationale: 保留“鞭打”的鲜明比喻；“口舌”在现代汉语中自然地指向言语及其伤害。
- source_word: οὐ μὴ φοβηθήσῃ
  choice: 也绝不会惧怕
  rationale: οὐ μή加强否定语气，因此用“绝不会”表达其确定和强调。
- source_word: κακῶν ἐπερχομένων
  choice: 灾祸临到时
  rationale: 将现在分词ἐπερχομένων自然地处理为时间情境，既表达灾祸正在来到或临到，也不把它缩窄为单纯的“逼近”。
