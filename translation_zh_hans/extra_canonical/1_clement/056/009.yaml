  text: ἐν λιμῷ ῥύσεταί σε ἐκ θανάτου, ἐν πολέμῳ δὲ ἐκ χειρὸς σιδήρου λύσει σε·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/009.yaml
  text: 'In famine he will rescue you from death,

    and in war he will deliver you from the hand of the sword[a].'
translation:
  language: zh_hans
  text: '饥荒时，他必救你脱离死亡；

    战争中，他必使你摆脱刀剑的权势[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刀剑的权势”直译为“铁的手”；“铁”在这里借指兵器或刀剑。
    reason: 原文ἐκ χειρὸς σιδήρου保留了“手”和“铁”的具体意象；脚注说明正文为避免生硬而作的语义化处理。
lexical_decisions:
- source_word: ἐν λιμῷ
  choice: 饥荒时
  rationale: λιμός指饥荒或严重缺粮；用“饥荒时”自然、简洁地保留处境含义。
- source_word: ῥύσεταί σε ἐκ θανάτου
  choice: 他必救你脱离死亡
  rationale: ῥύομαι表示救出、搭救；“救你脱离死亡”贴近原文，也符合庄重的现代汉语表达。
- source_word: ἐν πολέμῳ
  choice: 战争中
  rationale: πόλεμος在此指战争；保留与前句“饥荒时”相呼应的处境结构。
- source_word: ἐκ χειρὸς σιδήρου
  choice: 脱离刀剑的权势
  rationale: 字面为“脱离铁的手”，是带有闪语色彩的表达；“铁”借指兵器或刀剑，“手”表示掌控或权势。正文采用自然且能传达意象实际含义的译法，并以脚注保留字面信息。
- source_word: λύσει σε
  choice: 他必使你摆脱
  rationale: λύω在此有释放、解脱之意；用“使你摆脱”与前句的“救”有所区别，同时准确表达获释。
