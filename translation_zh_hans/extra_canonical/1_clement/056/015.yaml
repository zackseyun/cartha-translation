  naturalness: 原译整体庄重通顺；将末句调整为“禾场上的谷堆……被收聚起来”，可保持农业图像及被动语态，并使两个时间短语平行。
  terminology: “坟墓”“成熟的谷物”恰当。“归入坟墓”是符合汉语庄重语体的死亡委婉表达，仍保留原文的墓葬意象，未添加关于死亡状态的解释。
