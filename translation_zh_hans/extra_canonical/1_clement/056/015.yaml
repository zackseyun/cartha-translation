  text: ἐλεύσῃ δὲ ἐν τάφῳ ὥσπερ σῖτος ὥριμος κατὰ καιρὸν θεριζόμενος, ἢ ὥσπερ θημωνιὰ ἅλωνος καθ’ ὥραν συγκομισθεῖσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/015.yaml
  text: 'And you will come to the grave like ripe grain harvested in its season,

    or like a heap from the threshing floor gathered in at the proper time[a].'
translation:
  language: zh_hans
  text: 你必归入坟墓，像成熟的谷物按时收割，又像禾场上的谷堆在适当的时候被收聚起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσῃ
  choice: 你必进入
  rationale: 该动词是将来时，基本义为“你将来到”；与“坟墓”连用时，现代汉语以“进入坟墓”较自然，也保留其委婉表达死亡的语气。
- source_word: τάφῳ
  choice: 坟墓
  rationale: 直接对应“墓、坟墓”，不扩展为抽象的“死亡”。
- source_word: σῖτος ὥριμος
  choice: 成熟的谷物
  rationale: σῖτος 可泛指谷物，ὥριμος 指已经成熟、适于收割；不限定为某一种粮食。
- source_word: κατὰ καιρὸν θεριζόμενος
  choice: 按时收割
  rationale: 表达在相宜、既定的时节被收割；“按时”简洁保留时机恰当之意。
- source_word: θημωνιὰ ἅλωνος
  choice: 禾捆……从禾场
  rationale: θημωνιά 可指收聚成堆的禾谷或禾捆，ἅλων 是打谷场；此处用“禾捆”形成自然农业意象，同时保留地点“禾场”。
- source_word: καθ’ ὥραν συγκομισθεῖσα
  choice: 在合宜的时候……收聚起来
  rationale: συγκομίζω 表示收集、收聚入仓；καθ’ ὥραν 强调在适当时节，译文保留与上一分句平行的时间意象。
theological_decisions:
- issue: 死亡意象是否解释为安然离世或寿终正寝
  choice: 保留“进入坟墓”的农业比喻，不加解释
  alternative: 译为“你必寿终正寝”
  rationale: 原文借成熟谷物按时收聚描绘死亡，但没有明说寿数、安详程度或死后状态；直保意象可避免加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面语；两重农业比喻保持平行。原文没有需要以脚注标示的实质异文或歧义，英文旧脚注仅涉及已删除的孤立引号，故中文不设脚注。
