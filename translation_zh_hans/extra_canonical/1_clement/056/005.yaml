base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/005.yaml
  text: '“For,” it says[a], “a righteous person will discipline me in mercy and will reprove me,

    but let not the oil of sinners anoint my head.”'
translation:
  language: zh_hans
  text: 因为经上说：“义人会以怜悯管教我，责备我；但愿罪人的油不要膏在我的头上。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παιδεύσει
  choice: 愿……管教我
  rationale: 该词可指管教、训诲或纠正；结合本段彼此劝诫的语境，“管教”既保留力度，也不局限于惩罚。希腊语形式为将来时，但引文承接诗篇中的祈愿语气，汉语用“愿”更自然。
- source_word: δίκαιος
  choice: 义人
  rationale: 无冠词，宜按泛指理解，即“一个义人/义人”，不擅自特指上帝或某位特定人物。现代中文“义人”已能自然表达这种类指，无须加“一位”。
- source_word: ἐν ἐλέει
  choice: 在怜悯中
  rationale: 尽量保留介词结构及管教伴随怜悯的张力；不将其过度解释为单纯“仁慈地”。
- source_word: ἐλέγξει
  choice: 责备我
  rationale: 表达指出过错并纠正的意思，与“管教”形成自然并列。
- source_word: ἔλαιον
  choice: 油
  rationale: 保留原文意象，不具体化为膏油或香油。
- source_word: λιπανάτω
  choice: 滋润
  rationale: 该动词本义为使肥润、滋润；相较“膏抹”，更贴近该词本身，也保留油施于头上的诗性意象。
theological_decisions:
- issue: δίκαιος是否特指“那位义者”
  choice: 采用泛指“义人”
  alternative: 那位义者
  rationale: 原文无冠词，且《革利免一书》上下文强调彼此劝诫；不应通过译文擅自引入神性或弥赛亚式特指。
- issue: 将来时是预告还是祈愿
  choice: 按引文语境译作“愿……管教我”
  alternative: 义人必管教我
  rationale: 此句引用诗篇，语义上表达说话者乐意接受义人的纠正，并与后半句否定祈愿相称；直译成预告式将来时会削弱这一语用功能。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“因为经上说”自然传达 φησίν 的引文功能；分号保留两种影响之间的鲜明对照。未设置脚注，因为“义人”在中文中可自然保留原文的泛指性，无须另列英文层所需的冠词辨析。
