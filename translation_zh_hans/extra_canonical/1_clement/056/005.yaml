  naturalness: “在怜悯中管教我”可以理解，但“以怜悯管教我”在现代中文中更自然。“滋润我的头”不符合中文里油用于头部的常见搭配，也未充分表达λιπανάτω使头部受油膏抹、润泽的动作；“膏在我的头上”既自然又保留意象。
  terminology: 保留“义人”“管教”“责备”和“罪人”，措辞庄重且不引入对“义人”的特指或神学解释。“油”不具体化为香油或其他制品。
