  rationale: 修订将前半句恢复为与希腊文将来直陈式及英文审校文本相应的“会”，同时保留后半句“但愿……不要”的祈愿语气。又以“膏在我的头上”替换不自然的“滋润我的头”，更准确传达油施于头部的意象。其余译法可保留。
