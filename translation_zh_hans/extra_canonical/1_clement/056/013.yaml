  yaml_path: translation/extra_canonical/1_clement/056/013.yaml
  text: 'Then you will know that your house will be at peace,

    and you will inspect your dwelling and not miss anything[a].'
translation:
  language: zh_hans
  text: '然后你就会知道，你的家必享平安；

    你察看帐棚的住处，必不会遗漏什么[a]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译为“你帐棚的居处绝不会失误”。这句话引自《约伯记》5:24；按该处语境及其底层希伯来文，亦可理解为“你察看自己的住处，必不会遗漏什么”。
    reason: 现存希腊文以“居处”为 οὐ μὴ ἁμάρτῃ 的语法主语，形成汉语中不寻常的搭配；正文采用引文语境所支持的通顺理解，脚注保留字面句法的歧义。
lexical_decisions:
- source_word: εἶτα γνώσῃ
  choice: 然后你就会知道
  rationale: 保留时间推进和将来语气，符合现代汉语自然表达。
- source_word: εἰρηνεύσει σου ὁ οἶκος
  choice: 你的家必平安
  rationale: εἰρηνεύω表示处于和平、安稳的状态；“家”既可指房屋，也可涵盖家中成员，保留οἶκος的语义幅度。
- source_word: ἡ δίαιτα τῆς σκηνῆς σου
  choice: 你帐棚中的居处
  rationale: δίαιτα在此处与οἶκος平行，宜理解为居所、住处；“帐棚”直译σκηνή，并保留古代生活图景。
- source_word: οὐ μὴ ἁμάρτῃ
  choice: 也绝不会有差错
  rationale: οὐ μή强烈否定；ἁμαρτάνω本义为失误、偏离目标。由于希腊文本以“居处”为主语，采用不擅自补入“察看”的译法，同时用脚注说明另一种语境性理解。
theological_decisions:
- issue: 是否把οὐ μὴ ἁμάρτῃ解释为人察看住处时不会遗漏
  choice: 正文依现存希腊句法译为“居处也绝不会有差错”
  alternative: “你察看自己的住处，必不会遗漏什么”
  rationale: 希腊文本没有明说“察看”，且语法上“居处”是动词的主语。正文优先保留源文本的结构和异常表达，另一种受《约伯记》语境及底层希伯来文影响的理解列入脚注。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“帐棚中的居处”略带古代色彩，以保留原文意象；脚注处理源文本句法与引文背景之间的张力。
