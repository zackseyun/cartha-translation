base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/006.yaml
  text: 'And again it says:


    “Blessed is the man whom the Lord reproves;

    and do not reject the admonition of the Almighty.

    For he causes pain[a], and then restores;'
translation:
  language: zh_hans
  text: '他又说：


    “受主责备的人是有福的[a]；


    不要拒绝全能者的劝诫。


    因为他使人受苦，又使人恢复；”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主曾责备的人是有福的。”
    reason: 希腊文ἤλεγξεν为不定过去时；上下文中可概括地表达一般真理，也可形式上译作过去时。
lexical_decisions:
- source_word: ἤλεγξεν
  choice: 责备
  rationale: 该词可指指出过错、责备或管教；此处采用“责备”，既贴近原文，也保留福语中受主纠正之意。
- source_word: νουθέτημα
  choice: 劝诫
  rationale: 指为纠正和教导而作的告诫；“劝诫”比单纯的“劝告”更能体现警戒意味，又不把它窄化为惩罚。
- source_word: παντοκράτορος
  choice: 全能者
  rationale: 这是该神圣称号在现代汉语中的自然、庄重对应，保留其“统管万有者”的含义。
- source_word: ἀλγεῖν ποιεῖ
  choice: 使人受苦
  rationale: 原文直指使人感到痛苦；补出泛指宾语“人”，使汉语完整，同时不限定痛苦的具体形式。
- source_word: ἀποκαθίστησιν
  choice: 使人复原
  rationale: 该词表示恢复到原有或健全状态；“使人复原”保留及物和恢复性的含义。
theological_decisions:
- issue: ἤλεγξεν的不定过去时如何表达
  choice: 正文用一般性的“责备”，脚注保留“曾责备”的可能
  alternative: 曾责备
  rationale: 在这一福语式的一般陈述中，不定过去时可作概括性用法；汉语不标明时态最自然，也能保留一般真理的表达。
- issue: 神使人受苦与使人复原之间的张力
  choice: 按原文直接保留两个并列行动
  alternative: 将前者弱化为“容许人受苦”
  rationale: ποιεῖ明确表达“使”，不宜为缓和神学张力而改成“容许”；译文因此保留原文的直接表述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留引文的诗行结构及末尾未完的分号，以对应本节在下一节继续的句法。
