base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/014.yaml
  text: 'And you will know that your offspring will be many,

    and your children like the abundant grass of the field[a].'
translation:
  language: zh_hans
  text: 你必知道，你的后裔众多；你的儿女如同田野中茂盛的草。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “茂盛的草”也可译作“田野中所有的草（草本植物）”。
    reason: παμβότανον 是少见的复合表达；主文按上下文表达其丰盛意象，脚注保留 παν（“所有、遍布”）与 βοτάνη（“草、草本植物”）的词义幅度。
lexical_decisions:
- source_word: γνώσῃ
  choice: 你必知道
  rationale: 保留将来时语气；现代汉语用“必”自然表达确定的将来，而不额外强化为命令或应许公式。
- source_word: σπέρμα
  choice: 后裔
  rationale: 此处与“众多”搭配，语境指子孙后代；译作“后裔”比直译“种子”自然，也与下句“儿女”形成同义呼应。
- source_word: τέκνα
  choice: 儿女
  rationale: 准确表达 τέκνα 所指的子女，措辞自然庄重。
- source_word: παμβότανον
  choice: 繁茂的草木
  rationale: 该词强调遍地生长、草木丰盛；译作“繁茂的草木”兼顾丰盛意象及 βοτάνη 可指草本植物的宽泛含义，避免仅限于“草”的过窄理解。
- source_word: ἀγροῦ
  choice: 田野
  rationale: 在此自然景物比喻中译作“田野”符合现代汉语，并保留原文场景。
theological_decisions:
- issue: σπέρμα 与 τέκνα 的关系
  choice: 分别译为“后裔”和“儿女”，保留原文平行而近义的表达
  alternative: 将两者都统一译为“子孙”
  rationale: 原文使用两个不同名词，宜保留措辞变化，不将二者之间可能存在的细微张力抹平。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留希腊文两个分句的平行结构；“如同田野中繁茂的草木”保持原文的自然意象，不增添数量之外的神学解释。
