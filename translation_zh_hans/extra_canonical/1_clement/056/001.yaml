id: 1CLEM.56.1
reference: 1 Clement 56:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ ἡμεῖς οὖν ἐντύχωμεν περὶ τῶν ἐν τινι παραπτώματι ὑπαρχόντων, ὅπως δοθῇ αὐτοῖς ἐπιείκεια καὶ ταπεινοφροσύνη εἰς τὸ εἶξαι αὐτοὺς μὴ ἡμῖν, ἀλλὰ τῷ θελήματι τοῦ θεοῦ· οὕτως γὰρ ἔσται αὐτοῖς ἔγκαρπος καὶ τελεία ἡ πρὸς τὸν θεὸν καὶ τοὺς ἁγίους μετ’ οἰκτιρμῶν μνεία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/001.yaml
  text: Therefore let us also intercede concerning those who are in some transgression, so that gentleness and humility may be given to them, that they may yield not to us, but to the will of God. For in this way their compassionate remembrance before God and the saints will be fruitful and complete.
translation:
  language: zh_hans
  text: 所以，我们也要为那些处于某种过犯中的人[a]代求，使他们得着温和和谦卑，好让他们顺服的不是我们，而是上帝的旨意。因为这样，他们带着怜悯、向上帝和众圣徒所作的记念[b]，就必富有果效而且完全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在某种过犯中的人”。
    reason: ἐν τινι παραπτώματι ὑπαρχόντων直指处于某种过犯之中；不含“被抓住”或“受困”的明确意味。
  - marker: b
    text: 或译：“他们向上帝和众圣徒所作的记念，就必带着怜悯，富有果效而且完全。”
    reason: μετ’ οἰκτιρμῶν紧连μνεία，最自然地描述记念带着怜悯；其在汉语句中的位置可有不同安排。πρός所表关系可宽泛译作“向”。
lexical_decisions:
- source_word: ἐντύχωμεν
  choice: 祈求
  rationale: 此处指为犯过者向上帝代求；“祈求”在现代汉语中自然，并由“为……”清楚表达代求含义。
- source_word: ἐν τινι παραπτώματι ὑπαρχόντων
  choice: 陷在某种过犯中的人
  rationale: ὑπαρχόντων表示处于某种状态，并无“被发现”的意思；“陷在”自然表达身处过犯之中，但不译成“被过犯所胜”。
- source_word: ἐπιείκεια
  choice: 温柔
  rationale: 该词可指温和、宽厚、谦让；与ταπεινοφροσύνη并列且作为赐给犯过者的品格时，“温柔”较贴切。
- source_word: ταπεινοφροσύνη
  choice: 谦卑
  rationale: 准确表达卑己、不自高的心态，也符合早期基督教文献的伦理语境。
- source_word: εἶξαι
  choice: 顺服
  rationale: 表示让步、屈从或听从；在“不向我们，而向上帝旨意”的对照中，“顺服”最自然。
- source_word: ἔγκαρπος
  choice: 富有果效
  rationale: 保留“结果子、产生效果”的意象与含义，同时符合现代中文表达。
- source_word: μνεία
  choice: 记念
  rationale: 保留宗教语境中被提念、蒙记念的意味，而不擅自具体化为人的祷告或上帝的回想。
theological_decisions:
- issue: “上帝和众圣徒”是记念所朝向的对象还是记念发生的领域
  choice: 在上帝和众圣徒面前……的记念
  alternative: 对上帝和众圣徒的记念
  rationale: πρὸς τὸν θεὸν καὶ τοὺς ἁγίους在此存在一定解释空间；结合αὐτοῖς及上下文，译作“在……面前蒙记念”较符合为犯过者代求的语境，也避免断言这是对上帝与圣徒的纪念。
- issue: μετ’ οἰκτιρμῶν与μνεία的关系
  choice: 蒙怜悯的记念
  alternative: 记念……带着怜悯
  rationale: 希腊语词序使“带着怜悯”更可能修饰“记念”本身，而非修饰“富有果效而且完全”；中文以“蒙怜悯的记念”体现这一结合。
- issue: 顺服的对象
  choice: 顺服的不是我们，而是上帝的旨意
  alternative: 不是向我们让步，而是向上帝的旨意让步
  rationale: 保留原文明确的对照，避免把教会领袖或群体的要求直接等同于上帝旨意。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以”承接上文；“好让”表达εἰς τό加不定式的目的或预期结果。“上帝”与“众圣徒”保持早期基督教文本语域；不将“众圣徒”窄化为后世特定封圣制度中的圣人。
