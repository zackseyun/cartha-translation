id: 1CLEM.56.8
reference: 1 Clement 56:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: ἑξάκις ἐξ ἀναγκῶν ἐξελεῖταί σε, ἐν δὲ τῷ ἑβδόμῳ οὐχ ἅψεταί σου κακόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/008.yaml
  text: 'Six times he will deliver you from distresses,

    and in the seventh no evil will touch you.'
translation:
  language: zh_hans
  text: '他会六次救你脱离困境；

    第七次，灾祸也不会触及你。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑξάκις
  choice: 六次
  rationale: 直接保留次数表达，并与下句“第七次”形成原文的递进关系。
- source_word: ἐξ ἀναγκῶν
  choice: 脱离困境
  rationale: ἀνάγκη 在此为复数，指逼迫、患难或窘迫处境；“困境”自然易懂，又不把含义限缩为某一种灾难。
- source_word: ἐξελεῖταί
  choice: 救……脱离
  rationale: 中间语态将来时表达从危难中解救；采用“救你脱离”清楚呈现动作及其来源。
- source_word: κακόν
  choice: 灾祸
  rationale: 此处指临到人的祸患，而非抽象的道德邪恶；“灾祸”较符合上下文。
- source_word: ἅψεταί σου
  choice: 触及你
  rationale: 保留ἅπτομαι的接触意象，也忠实呈现属格宾语的关系。
theological_decisions:
- issue: 动词ἐξελεῖται的主语在本句中未明示
  choice: 译作“他”，不进一步指明身份
  alternative: 译作“上帝”或省略主语
  rationale: 希腊文本仅由动词形式隐含第三人称单数主语；“他”保留本句对前文指称的依赖，避免擅自补入神名。
- issue: 数字“六次／第七次”的修辞力度
  choice: 按字面保留
  alternative: 意译为“屡次……最终也……”
  rationale: 原文沿用智慧文学式的数字递进；字面保留既呈现其修辞，也不预先断定这些数字仅为泛指。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话；分行与分号呈现希腊文两个对应分句的平衡结构。
