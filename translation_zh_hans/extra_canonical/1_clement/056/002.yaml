source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλάβωμεν παιδείαν, ἐφ’ ᾗ οὐδεὶς ὀφείλει ἀγανακτεῖν, ἀγαπητοί. ἡ νουθέτησις, ἣν ποιούμεθα εἰς ἀλλήλους, καλὴ ἐστιν καὶ ὑπεράγαν ὠφέλιμος· κολλᾷ γὰρ ἡμᾶς τῷ θελήματι τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/002.yaml
  text: Let us accept discipline, at which no one ought to be resentful, beloved. The admonition that we give to one another is good and exceedingly beneficial, for it binds us to the will of God.
translation:
  language: zh_hans
  text: 亲爱的，我们要接受管教；没有人应当因此心生不满。我们彼此所作的劝诫是美好的，并且极其有益，因为它使我们紧紧依附于上帝的旨意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάβωμεν παιδείαν
  choice: 我们要接受管教
  rationale: ἀναλαμβάνω在此有承担、接受之意；παιδεία可指教导、训练或管教。结合下文不应恼怒，译作“接受管教”既保留纠正意味，也自然易懂。
- source_word: ἀγανακτεῖν
  choice: 心生不满
  rationale: 该词可表达愤慨、恼怒或不悦。“心生不满”保留情绪反感的范围，又不把程度限定得过强。
- source_word: νουθέτησις
  choice: 劝诫
  rationale: 指为纠正或引导而作的提醒、告诫；“劝诫”兼具劝导和警戒两层含义。
- source_word: κολλᾷ
  choice: 使我们紧紧依附
  rationale: 字面义为黏合、使紧贴，转义为使人紧密归附；此译保留原文强烈的联结意象。
- source_word: τῷ θελήματι τοῦ θεοῦ
  choice: 上帝的旨意
  rationale: θέλημα在此指上帝所意愿的事，现代中文基督教文体通常自然表达为“上帝的旨意”。
theological_decisions:
- issue: παιδεία所指是一般教导还是带纠正性的管教
  choice: 管教
  alternative: 教导／训练
  rationale: 紧接着的“谁都不该心生不满”以及彼此“劝诫”的语境显示，这里侧重令人可能不悦的纠正性教导；但“管教”仍可涵盖塑造和训练，不限定具体惩罚方式。
- issue: κολλᾷ与上帝旨意的关系强度
  choice: 紧紧依附上帝的旨意
  alternative: 使我们与上帝的旨意相连
  rationale: 原词具有黏合、紧贴的强烈意象；“紧紧依附”保留这种力度，同时不额外说明这种依附在教义上的机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“亲爱的”保留ἀγαπητοί的群体称呼；第二句保持彼此劝诫的互惠性，并用“极其有益”对应ὑπεράγαν ὠφέλιμος的强调。
