id: 1CLEM.56.3
reference: 1 Clement 56:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γάρ φησιν ὁ ἅγιος λόγος· Παιδεύων ἐπαίδευσέν με ὁ κύριος, καὶ τῷ θανάτῳ οὐ παρέδωκέν με·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/003.yaml
  text: 'For thus says the holy word:


    “The Lord disciplined me severely,

    and he did not hand me over to death.”[a]'
translation:
  language: zh_hans
  text: '因为圣言这样说：


    “主严厉管教了我，

    却没有把我交给死亡。”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“确实管教了我”。
    reason: 保留希腊文加强结构也可能被理解为强调动作确定性的译法。
lexical_decisions:
- source_word: ὁ ἅγιος λόγος
  choice: 圣言
  rationale: 直译为“圣言”，在此指接下来引用的神圣经文；措辞简洁庄重。
- source_word: Παιδεύων ἐπαίδευσέν με
  choice: 严厉管教了我
  rationale: 同源分词与限定动词连用，反映闪语式加强结构，强调管教的程度；“严厉”比表示认知确信的“确实”更贴合此处。
- source_word: τῷ θανάτῳ οὐ παρέδωκέν με
  choice: 却没有把我交给死亡
  rationale: 保留παραδίδωμι“交给、交付”的意象，并以“却”自然呈现与前句的转折对照。
theological_decisions:
- issue: 管教的加强语气
  choice: 严厉管教了我
  alternative: 确实管教了我
  rationale: 希腊文Παιδεύων ἐπαίδευσέν延续《七十士译本》诗篇117[118]:18的表达，主要加强动作程度，而不是表达说话者对事实的确信。
- issue: “死亡”的表达
  choice: 交给死亡
  alternative: 置我于死地
  rationale: 保留原文将“死亡”作为被交付对象的拟人化张力，不把含义收窄为直接处死。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；引文分行以呈现诗体。脚注标记已置于正文引文末尾。
