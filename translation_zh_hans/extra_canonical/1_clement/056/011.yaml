  yaml_path: translation/extra_canonical/1_clement/056/011.yaml
  text: 'You will laugh at the unrighteous and lawless,

    and you will certainly not fear wild beasts,'
translation:
  language: zh_hans
  text: '你必嗤笑不义和不法的人，

    也绝不会惧怕野兽。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγελάσῃ
  choice: 嗤笑
  rationale: 表达带有轻蔑意味的“嘲笑”，并保留原文第二人称单数的陈述语气。
- source_word: ἀδίκων καὶ ἀνόμων
  choice: 不义和不法的人
  rationale: 两个带冠词含义的复数形容词名词化，分别译出“不义”与“不法”，不将二者合并。
- source_word: θηρίων ἀγρίων
  choice: 野兽
  rationale: θηρίον 指兽类，ἀγρίων 强调野生、凶猛；现代汉语“野兽”自然涵盖这一组合意义。
- source_word: οὐ μὴ φοβηθῇς
  choice: 绝不会惧怕
  rationale: 保留 οὐ μή 加虚拟式所表达的强烈否定，而不弱化为普通的“不怕”。
