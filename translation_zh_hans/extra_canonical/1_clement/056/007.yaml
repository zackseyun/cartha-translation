  text: 他击打；他的双手也施行医治。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαισεν
  choice: 击打
  rationale: 保留动词“击、打”的直接力度，不擅自补出原文未明说的受事者；过去时态由上下文体现。
- source_word: αἱ χεῖρες αὐτοῦ
  choice: 他的双手
  rationale: 按原文保留“手”的复数及所属关系；“双手”符合现代汉语习惯。
- source_word: ἰάσαντο
  choice: 医治
  rationale: 表达ἰάομαι在此处的治疗、使人痊愈之意；汉语可自然省略原文同样未明说的宾语。
theological_decisions:
- issue: 医治的受事者是否明说
  choice: 不补出“他”或“人”
  alternative: 他的双手医治了他／医治人
  rationale: 希腊文未明示宾语；不补宾语可保留原文的简洁与指涉开放性，同时“他的双手也医治”在汉语中自然理解为施行医治，而非双手自身痊愈。
- issue: 两个不定过去时的时态表达
  choice: 采用无显式时态标记的汉语陈述
  alternative: 他曾击打，他的双手也曾医治／他击打，他的双手也医治
  rationale: 现代汉语不必机械标出希腊语不定过去时；当前译法既可承接叙述语境，也不将其强行解释为恒常现在时。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“也”呈现两分句之间的对应关系，但不额外规定为强转折；全句保留原文未明说宾语的特点。
