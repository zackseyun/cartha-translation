base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/004.yaml
  text: '“For the Lord disciplines the one whom he loves,

    and he scourges every son whom he receives.”'
translation:
  language: zh_hans
  text: '“因为主所爱的，他就管教；

    他所接纳的每一个儿子，他都鞭打。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδεύει
  choice: 管教
  rationale: 该词在此指带有纠正和培育目的的训导；“管教”既保留惩戒意味，也不排除教育、塑造的内涵。
- source_word: μαστιγοῖ
  choice: 鞭打
  rationale: 原词本义强烈，指用鞭抽打；采用“鞭打”保留引文鲜明而严厉的意象，不将其弱化为泛指的惩罚。
- source_word: παραδέχεται
  choice: 接纳
  rationale: 此处意为承认、接受某人为己所接纳者；“接纳”自然准确，也保留关系性的含义。
- source_word: υἱόν
  choice: 儿子
  rationale: 按原文保留阳性亲属称谓及父子意象，不泛化为“儿女”。
- source_word: κύριος
  choice: 主
  rationale: 采用早期基督教文献中对 κύριος 的常规庄重译法；原句本身不进一步明示所指。
theological_decisions:
- issue: 管教与爱的关系
  choice: 依照原文并列保留“爱”与“管教、鞭打”之间的张力
  alternative: 将“鞭打”解释性弱化为“责罚”或“磨炼”
  rationale: 原文引用传统以强烈措辞表达主的接纳和管教；翻译不应替读者消解其神学张力。
- issue: “凡……儿子”的范围和性别意象
  choice: 译为“凡他所接纳的儿子”
  alternative: 译为“他所接纳的每一个儿女”或“每一个人”
  rationale: 原文 πάντα υἱόν 明确使用单数阳性“每一个儿子”，且父子身份是论述意象的一部分，应予保留。
translation_notes:
  register: 采用现代、庄重且便于诵读的引文体。句式紧贴希腊文的两行平行结构；“必”和“都”使汉语关系清楚，但不增加原文之外的解释。
