  yaml_path: translation/extra_canonical/1_clement/005/006.yaml
  text: having worn chains seven times, having been driven into exile, having been stoned, having become a herald both in the east and in the west, he received the noble renown of his faith,
translation:
  language: zh_hans
  text: 他曾七次身负锁链，遭放逐，受石刑；又在东方和西方作宣讲者，获得了其信仰的崇高声名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτάκις δεσμὰ φορέσας
  choice: 七次身披锁链
  rationale: 保留“七次”的明确次数，并以“身披锁链”自然表达 φορέσας 的持续承受意味。
- source_word: φυγαδευθείς
  choice: 被放逐
  rationale: 准确表达被迫离乡、遭流放的被动含义。
- source_word: λιθασθείς
  choice: 被石头打
  rationale: 直译石刑或投石袭击的动作，同时不擅自断定其是否被打死。
- source_word: κῆρυξ γενόμενος
  choice: 作了传道者
  rationale: κῆρυξ 本义为宣告者、传令者；在此宣教语境中译作“传道者”清楚自然。
- source_word: ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει
  choice: 在东方和西方
  rationale: 保留原文对称的地理表达，不进一步指定具体地域。
- source_word: τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν
  choice: 赢得了他信仰的崇高美名
  rationale: κλέος 指声名、荣誉；γενναῖον 有高贵、崇高之意。“赢得”符合 ἔλαβεν 在此语境中的结果含义。
theological_decisions:
- issue: “东方”和“西方”的具体范围
  choice: 保留概括性的“东方和西方”
  alternative: 解释为罗马帝国东部和西部，或特定城市地区
  rationale: 原文没有界定具体疆域，译文不替作者缩小或扩张其所指。
- issue: “信仰的崇高美名”所表达的关系
  choice: 保留属格结构的开放性
  alternative: 译为“因信仰而得的崇高美名”或“为其信仰赢得崇高声誉”
  rationale: τῆς πίστεως αὐτοῦ 可表达美名与其信仰的归属或原因关系；现译避免过度限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；分词串列以连续短句呈现，保留原文累积苦难后转入荣誉结果的修辞节奏。
