review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了七次锁链、放逐、东方与西方的对照，以及最后获得声名的结果。不过，“被石头打”没有充分对应 λιθασθείς 所指的“遭受石刑／被人用石头砸”的特定行为，且汉语表达略显生硬。
  naturalness: “被石头打”在现代汉语中不够自然，容易把石头误作施事者；“作了传道者”也稍口语且弱化 κῆρυξ 的公开宣告含义。其余句子庄重流畅。
  terminology: δεσμὰ 译为“锁链”可取；κῆρυξ 宜译“宣讲者”，既保留其公开宣告者的核心含义，又不额外限定为某一特定教会职分。“其信仰的崇高声名”可保留属格关系的概括性。
  issues:
  - severity: medium
    issue: “被石头打”对 λιθασθείς 的表达不够准确、自然。
    rationale: λιθασθείς 是“被人用石头砸／遭石刑”，并非泛指受到石头击打；译为“遭石刑”既说明特定行动，也不暗示受害者死亡。
  - severity: low
    issue: “作了传道者”略弱化 κῆρυξ 的公开宣告意义。
    rationale: κῆρυξ 是宣告、传报的人；“作宣讲者”在现代汉语中自然，并较贴近原词的功能性含义。
