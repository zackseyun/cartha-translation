  yaml_path: translation/extra_canonical/1_clement/005/001.yaml
  text: But to cease from the ancient examples, let us come to the athletes who lived nearest to our own time. Let us take the noble examples from our own generation.
translation:
  language: zh_hans
  text: 不过，让我们不再列举古代的榜样，转而来看那些离我们最近的斗士；让我们从我们这个世代中取高尚的榜样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἀρχαίων ὑποδειγμάτων παυσώμεθα
  choice: 让我们不再谈古人的榜样
  rationale: παύομαι加属格表示停止、撇开某事；此处是结束对古代事例的列举，而非以古人为最后一例。这样译符合现代汉语，也保留劝勉语气。
- source_word: τοὺς ἔγγιστα γενομένους ἀθλητάς
  choice: 那些离我们时代最近的斗士
  rationale: ἀθλητής本指竞赛者、斗士，在早期基督教语境中可比喻经受苦难或争战的人；保留“斗士”的形象。ἔγγιστα γενομένους结合下句“我们这一代”，指时代上最近的人。
- source_word: τῆς γενεᾶς ἡμῶν
  choice: 我们这一代中
  rationale: γενεά可指世代、同代人；这里与“古人”及“离我们时代最近”相对，译作“我们这一代”最自然。
- source_word: τὰ γενναῖα ὑποδείγματα
  choice: 高尚榜样
  rationale: γενναῖος可表示高贵、高尚、英勇；此处修饰可供效法的榜样。“高尚”自然庄重，并不过度限定为单纯的勇敢。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝勉体。“不过”承接上文并转折；两个“让我们”保留原文第一人称复数劝勉式的修辞结构。未设置脚注，因为正文已清楚表达παύομαι加属格在此处的离开、停止之义。
