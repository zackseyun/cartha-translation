revisions:
- from: 彼得因不义的嫉妒，不只忍受了一两次苦难，而是忍受了许多苦难；他就这样作了见证，前往那当得的荣耀之地。
  to: 彼得因不义的嫉妒，忍受的劳苦不止一两样，而是许多；他这样作了见证，就到了那应归于他的荣耀之处。
  rationale: 修订使数量结构和句法关系更清楚，并以“劳苦”保留πόνους较宽的语义范围；其余关键术语及μαρτυρήσας可能包含殉道意味的开放性均予保留。
  reviewer_model: gpt-5.6-terra
