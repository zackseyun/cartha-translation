review_pass:
  verdict: revise
  source_fidelity: “苦难”可涵盖πόνους，但该词也带有“劳苦、艰辛”之意；改为“劳苦”更贴近原文而不缩窄为特定迫害。“那当得的荣耀之地”在汉语中对ὀφειλόμενον所修饰的对象不够清楚；原文是彼得所应得的“荣耀之处”。
  naturalness: 原译“忍受了一两次苦难”可以理解，但“一两样……许多”更自然地承接原文省略的πόνους，并保持“不止一……不止二……而是许多”的强调。调整语序后更符合现代庄重汉语。
  terminology: 保留“彼得”“不义的嫉妒”“作了见证”。“作了见证”不将μαρτυρήσας限定为“殉道”。“应归于他的荣耀之处”表达ὀφειλόμενον的“应得／应归”，不预设功德或预定论解释。
  issues:
  - severity: low
    issue: “一两次苦难”对原文的名词省略及数量表达略显生硬。
    rationale: οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας所省略的是后置的πόνους，意为“不止一两样，而是许多（劳苦）”。
  - severity: medium
    issue: “那当得的荣耀之地”中“当得”与“荣耀之地”的修饰关系不够清晰。
    rationale: ὀφειλόμενον直接修饰τόπον；结合上下文，指应归于彼得的荣耀之处。译文应避免读作“本身当得荣耀的地方”。
  revised_text: 彼得因不义的嫉妒，忍受的劳苦不止一两样，而是许多；他这样作了见证，就到了那应归于他的荣耀之处。
