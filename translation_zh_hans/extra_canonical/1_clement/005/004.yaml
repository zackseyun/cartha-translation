  text: Πέτρον, ὃς διὰ ζῆλον ἄδικον οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας ὑπήνεγκεν πόνους, καὶ οὕτω μαρτυρήσας ἐπορεύθη εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/004.yaml
  text: Peter, who because of unrighteous jealousy endured not one or two but many sufferings, and so, having borne witness, went to the glorious place that was due him.
translation:
  language: zh_hans
  text: 彼得因不义的嫉妒，忍受的劳苦不止一两样，而是许多；他这样作了见证，就到了那应归于他的荣耀之处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλον ἄδικον
  choice: 因不义的嫉妒
  rationale: 直译该介词短语，保留嫉妒在道德上属不义的判断，也不额外指明嫉妒者。
- source_word: πλείονας ὑπήνεγκεν πόνους
  choice: 忍受了许多苦难
  rationale: ὑποφέρω表示承受、忍受；πόνοι可指劳苦、困苦或苦难，此处与彼得受迫害的语境相称。
- source_word: μαρτυρήσας
  choice: 作了见证
  rationale: 保留该词“见证”的基本意义及其可能含有殉道意味的张力，不直接译成“殉道”。
- source_word: τὸν ὀφειλόμενον τόπον τῆς δόξης
  choice: 那当得的荣耀之地
  rationale: 兼顾ὀφειλόμενον“所应得、所当归于”和属格τῆς δόξης；用自然汉语表达，同时避免把短语过度解释为某一具体末世地点。
theological_decisions:
- issue: μαρτυρήσας是否明确表示殉道
  choice: 作了见证
  alternative: 殉道以后
  rationale: 在早期基督教语境中该词可能暗含以死作见证，但其词面仍是“见证”；译文保留这种语义张力。
- issue: ὀφειλόμενον是否暗示功德性的报偿
  choice: 当得的
  alternative: 为他预定的
  rationale: 原词表示应归给或所当得的，并未使用“预定”一词；译文不进一步建构功德或预定论解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不只……而是……”再现原文递进强调；分号保持长句的修辞连贯。
