  source_fidelity: “猜忌”主要指猜疑、疑忌，未能对应 ζῆλος 与 φθόνος 这两个均属嫉妒/妒忌语义场的并列词。“直到死地”不是现代汉语中表达 ἕως θανάτου 的自然说法，且容易引出战场地点的含义。修订后保留两个近义词并列、最高级以及奋斗至死的范围。
  naturalness: “最为义”略显生硬；“最公义”在庄重现代汉语中更自然。“直至死亡仍奋力抗争”自然明确，也保留 ἤθλησαν 的持续奋力、竞赛性比喻。
  terminology: 保留“柱石”这一适切的支柱隐喻；不补入“使徒”等原文未明言的身份。“嫉妒和妒忌”虽语义相近，但恰当反映原文两个并列的近义词。
