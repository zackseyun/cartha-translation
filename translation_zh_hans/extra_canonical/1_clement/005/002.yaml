  text: Because of jealousy and envy, the greatest and most righteous pillars were persecuted and struggled even unto death.
translation:
  language: zh_hans
  text: 因着嫉妒和妒忌，那些最伟大、最公义的柱石遭受迫害，并直至死亡仍奋力抗争。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλον καὶ φθόνον
  choice: 嫉妒和猜忌
  rationale: 两个词在此都指因妒意而生的敌对心态；用近义而不完全相同的词保留原文并列与语义重叠。
- source_word: οἱ μέγιστοι καὶ δικαιότατοι στῦλοι
  choice: 那些最伟大、最为义的柱石
  rationale: 保留最高级语气及“柱石”的群体支柱隐喻；“为义”比“正义”更自然地描述人物品格。
- source_word: ἐδιώχθησαν
  choice: 遭受迫害
  rationale: 准确表达被动语态以及因敌意而受逼迫的含义。
- source_word: ἤθλησαν
  choice: 奋战
  rationale: 该动词源于竞技场语汇，在此比喻坚忍争战；“奋战”既自然，又保留奋斗色彩。
- source_word: ἕως θανάτου
  choice: 直到死地
  rationale: 保留其范围终点为死亡的强烈表达，不把它弱化为一般的艰苦经历。
theological_decisions:
- issue: “柱石”所指人物的身份
  choice: 保留泛指，不在正文中明确为使徒或其他领袖
  alternative: 译作“那些最伟大、最为义的使徒柱石”
  rationale: 本节希腊文本只说“柱石”，具体人物由后文展开；不宜在此提前补入原文没有的身份称谓。
- issue: ἕως θανάτου 是实际死亡还是冒死程度
  choice: 译为“直到死地”，保留以死亡为终点的读法
  alternative: 译为“甚至不惜一死”
  rationale: 原文介词结构可强调争战延续至死；正文不将其改写为仅表示冒死意愿。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留“柱石”和竞技性争战的意象，句式简洁，并维持原文两个妒忌词并列所产生的修辞力度。
