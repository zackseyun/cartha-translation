  text: δικαιοσύνην διδάξας ὅλον τὸν κόσμον, καὶ ἐπὶ τὸ τέρμα τῆς δύσεως ἐλθὼν καὶ μαρτυρήσας ἐπὶ τῶν ἡγουμένων, οὕτως ἀπηλλάγη τοῦ κόσμου καὶ εἰς τὸν ἅγιον τόπον ἐπορεύθη, ὑπομονῆς γενόμενος μέγιστος ὑπογραμμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/007.yaml
  text: having taught righteousness to the whole world[a], and having come to the farthest limit of the west, and having borne witness before the rulers, thus he departed from the world and went to the holy place, having become the greatest example of endurance.
translation:
  language: zh_hans
  text: 他向全世界教导公义，到了西方的尽头，并在执政者面前作了见证；就这样，他离开了这世界，前往圣洁之地，成为忍耐的最伟大典范。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνην
  choice: 公义
  rationale: 既保留其道德与宗教含义，也符合庄重、自然的现代汉语表达。
- source_word: τὸ τέρμα τῆς δύσεως
  choice: 西方的尽头
  rationale: 按字面保留地理表达及其可能的修辞宽度，不具体认定为某一地点。
- source_word: μαρτυρήσας
  choice: 作了见证
  rationale: 保留“见证”的基本意义及可能涉及受难殉道的语义张力，不直接译成“殉道”。
- source_word: τῶν ἡγουμένων
  choice: 执政者
  rationale: 指掌权治理的人，避免过度具体化为某一级官员。
- source_word: ἀπηλλάγη τοῦ κόσμου
  choice: 离开了这个世界
  rationale: 该结构在此委婉表示死亡或离世；译文保留原文的委婉说法，不引入“被释放”的额外神学意味。
- source_word: τὸν ἅγιον τόπον
  choice: 圣洁之地
  rationale: 保持原文不明确指认该地点的表达，不擅自解释为天堂或某特定圣所。
- source_word: ὑπομονῆς ... μέγιστος ὑπογραμμός
  choice: 忍耐的至高榜样
  rationale: ὑπογραμμός表示供人效法的范本；“至高榜样”自然传达μέγιστος的最高程度。
theological_decisions:
- issue: μαρτυρέω是否明确表示殉道
  choice: 作了见证
  alternative: 殉道
  rationale: 原词可在受审和死亡语境中带有殉道意味，但本句仍可按“作见证”理解；保留这种张力较为稳妥。
- issue: “圣洁之地”的具体所指
  choice: 不作具体解释
  alternative: 天堂
  rationale: 原文只说“圣洁之地”，直接译成“天堂”会消除其原有的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。将三个希腊语分词所构成的连续铺陈在中文中以“又……并……”呈现，并在主句前分句，以免汉语句子过度拖长，同时保留其先行经历最终导向离世的逻辑。
