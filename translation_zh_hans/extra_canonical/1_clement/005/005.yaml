  text: 保罗因嫉妒和纷争，显明了忍耐的奖赏。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλον καὶ ἔριν
  choice: 因嫉妒和纷争
  rationale: 按自然因果关系译出 διά；ζῆλος 在此承接受逼迫的负面语境，译作“嫉妒”，ἔρις 译作“纷争”。
- source_word: ὑπομονῆς βραβεῖον
  choice: 忍耐的奖赏
  rationale: 保留属格结构的简洁性；βραβεῖον 指竞赛所得的奖赏，“奖赏”既自然又保留其比喻色彩。
- source_word: ἔδειξεν
  choice: 显明了
  rationale: 比单纯“指出”更能保留 δείκνυμι 的展示、表明之意，也没有增添保罗已在本句获得奖赏的含义。
theological_decisions:
- issue: “显明奖赏”所表达的关系
  choice: 保留“显明了忍耐的奖赏”这一略带凝练的表达
  alternative: “表明了忍耐会得到怎样的奖赏”或“获得了忍耐的奖赏”
  rationale: 原文只说 ἔδειξεν（显明/展示），并未在本句直接使用“获得”，也未具体解释奖赏是什么；因此不把后文信息提前带入。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。句式紧凑，保留原文以“保罗”为主语及其竞赛奖赏意象。
