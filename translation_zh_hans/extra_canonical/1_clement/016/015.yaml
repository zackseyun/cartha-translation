  text: καὶ πάλιν αὐτὸς φησίν· Ἐγὼ δὲ εἰμι σκώληξ καὶ οὐκ ἄνθρωπος, ὄνειδος ἀνθρώπων καὶ ἐξουθένημα λαοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/015.yaml
  text: 'And again he himself says,

    “But I am a worm and not a man,

    a reproach of men and despised by the people[a].'
translation:
  language: zh_hans
  text: '他自己又说：


    “但我是虫，不是人，

    受世人羞辱，被民众藐视。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκώληξ
  choice: 虫
  rationale: 直译为“虫”，保留原文强烈的自我卑微意象；不具体化为某一种虫。
- source_word: ὄνειδος ἀνθρώπων
  choice: 受世人羞辱
  rationale: 表达“成为人们羞辱、辱骂的对象”之意；用现代汉语被动结构，简洁自然。
- source_word: ἐξουθένημα λαοῦ
  choice: 被民众藐视
  rationale: 该名词指受轻视、被鄙弃的对象；译作被动结构既准确传意，也与上一分句形成整齐的诗歌并列。
- source_word: λαοῦ
  choice: 民众
  rationale: 保留集合意义，不额外限定为某一民族或宗教群体。
theological_decisions:
- issue: 引语中说话者的身份
  choice: 沿用“他自己”，不在译文中点明身份
  alternative: 明确译作“基督自己”或其他特定人物
  rationale: 希腊文本在本节只用代词αὐτός；为避免把上下文中的神学认定直接增添到引语提示语中，保留原文的指代方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语，并以分行保留诗体。两个末尾短语均用被动结构，传达希腊文两个并列谓语名词所表示的“成为羞辱／藐视对象”之意，同时避免生硬的“羞辱之物、藐视之物”。
