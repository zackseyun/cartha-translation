revisions:
- from: '因此，他必承受许多人，

    并分取强者的战利品；

    因为他的性命被交于死亡，

    他也被列在不法之人中间；'
  to: '因此，他必承受许多人为业，


    并分配强者的战利品；


    因为他的性命被交付给死亡，


    他也被列在不法之人中间；'
  rationale: 修订仅处理三个可安全判定的措辞问题：以“分配”准确传达 μεριεῖ；以“为业”使“承受许多人”的继承意象在现代汉语中可理解而不改释其不寻常结构；以“交付给死亡”提升自然度并对应 εἰς。保留“强者的战利品”的属格歧义、末尾分号及原有庄重语体。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:24:30Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了四个并列分句、将 ψυχή 按语境译作“性命”，并恰当表达 ἐλογίσθη 的“被算作／被列入”之意。不过，μεριεῖ 的基本义是“分配、分开”，而非“分取（自己的一份）”；后一表达会改变行动的侧重点。
  naturalness: “承受许多人”虽紧贴希腊文不寻常的直接宾语结构，但在现代汉语中容易被误解为继承人的人身归属。“承受许多人为业”以最少补足使继承意象可理解，仍保留原文的张力。“被交付给死亡”也比“被交于死亡”更符合现代标准汉语，同时保留 εἰς 的趋向。
  terminology: “性命”“不法之人”均合适且没有引入特定教派的人论或律法解释。“强者的战利品”保留属格关系的解释余地；改用“分配”则更贴合 μεριεῖ。
  issues:
  - severity: medium
    issue: “分取强者的战利品”未充分表达 μεριεῖ。
    rationale: μερίζειν 在此是“分配、分开战利品”，而“分取”通常指取得自己的一份，可能将主语从分配者改为领取者。应译为“分配强者的战利品”。
  - severity: low
    issue: “承受许多人”在现代汉语中歧义过强。
    rationale: 原文确有 κληρονομήσει πολλούς 的不寻常继承意象，但加入“为业”是汉语中对“承受”的常规补足，可避免误作继承某些人的身份或财产，同时不消解其对象为“许多人”的张力。
  - severity: low
    issue: “被交于死亡”略显文言且未明示趋向。
    rationale: “被交付给死亡”更自然地对应 παρεδόθη εἰς θάνατον，意义不变。
