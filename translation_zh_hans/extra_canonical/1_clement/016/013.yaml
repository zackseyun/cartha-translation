source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο αὐτὸς κληρονομήσει πολλοὺς καὶ τῶν ἰσχυρῶν μεριεῖ σκῦλα ἀνθ’ ὧν παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ, καὶ ἐν τοῖς ἀνόμοις ἐλογίσθη·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/013.yaml
  text: 'Because of this he will inherit many,

    and he will divide the spoils of the strong,

    because his soul was given over to death,

    and he was counted among the lawless;'
translation:
  language: zh_hans
  text: '因此，他必承受许多人为业，


    并分配强者的战利品；


    因为他的性命被交付给死亡，


    他也被列在不法之人中间；'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομήσει πολλούς
  choice: 承受许多人
  rationale: 保留 κληρονομέω 的“承受、得为产业”意象，以及 πολλούς 作为直接宾语的表达，不将其改释为“分得许多”。
- source_word: τῶν ἰσχυρῶν μεριεῖ σκῦλα
  choice: 分取强者的战利品
  rationale: μερίζειν 表示分配或分取，σκῦλα 指战争中夺得的战利品；属格 τῶν ἰσχυρῶν 保留为“强者的”，不预先判定是从强者夺来还是属于强者的份。
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: 他的性命
  rationale: 此处 ψυχή 与“被交于死亡”连用，语境中主要指生命、性命；译成“性命”比现代汉语的“灵魂”更准确自然。
- source_word: τοῖς ἀνόμοις
  choice: 不法之人
  rationale: ἄνομος 指无视或违背律法的人；“不法之人”保留其法律与道德色彩，避免缩窄为一般的罪犯。
- source_word: ἐλογίσθη
  choice: 被列在……中间
  rationale: λογίζομαι 的被动态表示被算作、被列入；此译法自然地表达归类之意。
theological_decisions:
- issue: “承受许多人”的含义
  choice: 直译为“承受许多人”
  alternative: “分得许多人”或“得着许多人为产业”
  rationale: 希腊文本以 πολλούς 为 κληρονομήσει 的宾语，表述较不寻常但具有产业继承意象；不在正文中替作者消解这一张力。
- issue: “强者的战利品”的属格关系
  choice: 保留“强者的战利品”
  alternative: “从强者那里夺来的战利品”或“与强者瓜分战利品”
  rationale: 原文 τῶν ἰσχυρῶν 的结构存在解释空间，正文避免明确指定来源或共同分配关系。
- issue: ψυχή 的人论含义
  choice: 按语境译为“性命”
  alternative: “灵魂”
  rationale: 这里强调被交付至死，不必据此引入灵魂与身体分离的特定人论解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，并保留原文四行并列结构与末尾分号，以衔接后文。正文中的“承受许多人”略带经文式张力，是为忠实保存希腊语的继承意象；其余措辞力求普通读者可懂。
