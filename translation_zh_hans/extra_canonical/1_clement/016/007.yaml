source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος παρέδωκεν αὐτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν, καὶ αὐτὸς διὰ τὸ κεκακῶσθαι οὐκ ἀνοίγει τὸ στόμα. ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείραντος ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ. ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/007.yaml
  text: 'And the Lord gave him over for our sins,

    and he[a], because of being afflicted,

    does not open his mouth.

    Like a sheep he was led to slaughter,

    and as a lamb before its shearer is voiceless,

    so he does not open his mouth.

    In his humiliation his judgment was taken away.'
translation:
  language: zh_hans
  text: '主为我们的罪把他交付了；


    他因受苦害，并不开口。


    他像羊被牵去宰杀，


    又像羔羊在剪毛的人面前默不作声，


    他也这样不开口。


    在他受屈辱时，他的审判被夺去了。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的审判被夺去了”也可理解为“他未获公正的审判”。
    reason: κρίσις αὐτοῦ ἤρθη可直指“他的审判／裁断被拿走”，也可在语境中指他被剥夺应有的公正裁断；正文保留原文的简练和歧义。
lexical_decisions:
- source_word: παρέδωκεν
  choice: 交了出去
  rationale: 保留“交出、交付”的核心含义及受难语境，不擅自明确交给谁。
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: 为我们的罪
  rationale: 自然表达其代受或因罪而被交出的关系，同时不把介词所容许的神学张力扩写为解释。
- source_word: διὰ τὸ κεκακῶσθαι
  choice: 因受苦害
  rationale: 该完成时被动不定式表示遭受恶待或苦害；“受苦害”既涵盖受苦，也保留他人加害的被动意味。
- source_word: ἄφωνος
  choice: 默不作声
  rationale: 比字面“无声”更符合现代汉语，并准确表达在剪毛者面前不发声。
- source_word: ταπείνωσις
  choice: 受屈辱
  rationale: 在此受难语境中表达被贬抑、受羞辱的状态，避免仅译作主观的“谦卑”。
- source_word: κρίσις
  choice: 审判
  rationale: 保留该词“审判、裁断、公正裁决”等语义空间，不直接释义为“公正”。
- source_word: ἤρθη
  choice: 被撤去了
  rationale: 体现被动的“被拿走、除去”，同时在汉语中能与“审判”搭配，并保留原句的解释余地。
theological_decisions:
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν所表达的代受关系
  choice: 为我们的罪
  alternative: 因我们的罪／担当我们的罪而
  rationale: “为”既忠实又简洁；不把原文未明说的赎罪机制解释性地加入正文。
- issue: “他的审判被撤去”的含义
  choice: 正文保留直译，并用脚注说明歧义
  alternative: 他没有得到公正的审判
  rationale: 希腊文可被理解为他的审判或裁决被夺去，也可指他被剥夺公正审判；正文不应默默选定其中一种。
- issue: 受苦者的身份
  choice: 沿用“他”，不在正文加入“基督”或“仆人”
  alternative: 基督／上主的仆人
  rationale: 本节引文只使用代词；虽处于基督论语境，仍不应把解释直接写入引文本身。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并按原文诗行排列。两次“不开口”予以保留，以呈现引文的重复和强调；“羊”与“羔羊”、“宰杀”与“剪羊毛”也分别保留。
