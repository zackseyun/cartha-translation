  text: Ὁρᾶτε, ἄνδρες ἀγαπητοί, τίς ὁ ὑπογραμμὸς· δεδομένoς ἡμῖν· εἰ γὰρ ὁ κύριος οὕτως ἐταπεινοφρόνησεν, τί ποιήσωμεν ἡμεῖς οἱ ὑπὸ τὸν ζυγὸν τῆς χάριτος αὐτοῦ δι’ αὐτοῦ ἐλθόντες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/017.yaml
  text: See[a], beloved men, what is the pattern given to us. For if the Lord so humbled himself, what should we do, we who through him have come under the yoke of his grace?
translation:
  language: zh_hans
  text: 亲爱的弟兄们，请看，赐给我们的榜样是什么？主既这样谦卑自己，我们这些借着他来到他恩典之轭下的人，又当怎样行呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: 请看
  rationale: 按命令语气理解，保留作者劝勉听众留意前述榜样的修辞力量；加“请”使现代汉语自然庄重。
- source_word: ἄνδρες ἀγαπητοί
  choice: 亲爱的弟兄们
  rationale: 此处是对共同体成员的亲切称呼；“弟兄们”比直译“亲爱的男人们”更符合早期基督徒书信语境及现代汉语习惯。
- source_word: ὑπογραμμός
  choice: 榜样
  rationale: 该词指供人临摹、效法的范式；“榜样”清楚表达基督谦卑供信徒效法之意。
- source_word: ἐταπεινοφρόνησεν
  choice: 谦卑自己
  rationale: 表达主采取谦卑的心志和姿态；避免仅译作“自卑”可能带来的现代负面心理含义。
- source_word: ὑπὸ τὸν ζυγὸν τῆς χάριτος αὐτοῦ
  choice: 归入他恩典之轭下
  rationale: 保留“轭”的鲜明隐喻及“恩典”与“轭”并置的神学张力；“归入……之下”传达进入其权柄范围。
- source_word: δι’ αὐτοῦ ἐλθόντες
  choice: 借着他归入
  rationale: 将 δι’ αὐτοῦ 与进入恩典之轭下相连，保留基督作为中介的含义。
theological_decisions:
- issue: 主的谦卑是否明确表达为自我降卑
  choice: 谦卑自己
  alternative: 存心谦卑
  rationale: 希腊语不宜削弱为单纯性情描述；“谦卑自己”既体现主动性，也不额外限定其具体方式。
- issue: “恩典之轭”的张力
  choice: 保留“恩典之轭”
  alternative: 接受他恩典的约束
  rationale: 原文有意把通常象征约束的“轭”与“恩典”结合；解释性改写会消解这一张力。
- issue: τί ποιήσωμεν 的语气
  choice: 又当怎样行呢？
  alternative: 我们该做什么呢？
  rationale: 保留劝勉性的修辞问句，不替作者具体规定行动内容。
translation_notes:
  register: 采用现代、庄重而易懂的书信劝勉语体。首句以“请看”体现命令语气；用“何等的榜样”自然呈现 τίς 的感叹性修辞。保留“恩典之轭”这一不寻常但重要的原文意象。
