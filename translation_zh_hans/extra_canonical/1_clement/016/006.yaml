base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/006.yaml
  text: 'We all went astray like sheep;

    each man went astray in his own way[a].'
translation:
  language: zh_hans
  text: '我们众人都像羊一样走迷了路；

    各人都在自己的路上走迷了。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες
  choice: 我们众人都
  rationale: 结合第一人称复数动词ἐπλανήθημεν，明确表达“我们所有人”，自然且完整。
- source_word: ὡς πρόβατα
  choice: 像羊一样
  rationale: 保留明喻及复数群体意象，用现代汉语的自然说法表达。
- source_word: ἐπλανήθημεν / ἐπλανήθη
  choice: 走迷了路／走迷了
  rationale: 既传达偏离正路、迷失方向的含义，也保留“路”的语境关联。
- source_word: ἄνθρωπος
  choice: 各人
  rationale: 此处为按个体分配的用法，并非单指某一个男人；“各人”与后面的“自己的”自然对应。
- source_word: τῇ ὁδῷ αὐτοῦ
  choice: 在自己的路上
  rationale: 尽量保留希腊文与格结构所容许的“在其道路上”之意，不额外补入“偏行”等解释。
theological_decisions:
- issue: 第二分句是描述各人在自己的道路上迷失，还是强调各人转向自己的道路
  choice: 各人都在自己的路上走迷了
  alternative: 各人都偏向自己的路
  rationale: 所给希腊文本重复使用ἐπλανήθη，且τῇ ὁδῷ为与格；正文据此保留“在自己的路上迷失”的直译方向，不用其他传统文本形式来改写。
- issue: πάντες所表达的普遍范围
  choice: 我们众人都
  alternative: 众人都
  rationale: 动词ἐπλανήθημεν明确是第一人称复数，因此在中文中保留“我们”，避免削弱说话者自我包含的意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；两分句保持平行，并重复“走迷”以对应希腊文中同一动词的重复。
