  yaml_path: translation/extra_canonical/1_clement/016/014.yaml
  text: 'And he bore the sins of many,

    and was given over because of their sins.'
translation:
  language: zh_hans
  text: '他自己担当了许多人的罪，

    又因他们的罪被交付了。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτός
  choice: 他亲自
  rationale: αὐτός在此有强调作用；译作“亲自”既自然，也保留原文的强调。
- source_word: ἁμαρτίας πολλῶν
  choice: 许多人的罪
  rationale: 按原文属格关系直译，保留“许多人”而不扩大为“众人”或“所有人”。
- source_word: ἀνήνεγκε
  choice: 担当了
  rationale: 该动词可指带上、承担或献上；此处以罪为宾语，结合引文语境译作“担当”，同时不明说其祭献方式。
- source_word: διὰ τὰς ἁμαρτίας αὐτῶν
  choice: 因他们的罪
  rationale: διά加宾格在这里表达原因；“因”简洁保留因果关系。
- source_word: παρεδόθη
  choice: 被交了出去
  rationale: 保留被动语态及“交出、交付”的基本含义，不擅自补明交付者或接受者。
theological_decisions:
- issue: ἀνήνεγκε是否明确译成祭献用语
  choice: 担当了
  alternative: 献上了／背负了
  rationale: “担当”能表达代负罪责的语境，也不把动词唯一限定为献祭动作；原文可能兼有承担与献祭色彩，应保留张力。
- issue: παρεδόθη的施事者与交付对象
  choice: 不补出施事者或接受者
  alternative: 被上帝交出／被交在敌人手中
  rationale: 希腊文仅用神学被动式，未明说是谁将他交出或交给谁；译文不作解释性增补。
- issue: διά所表达的关系
  choice: 译为原因“因他们的罪”
  alternative: 为了他们的罪
  rationale: διά加宾格通常表示“因为、由于”；如此也避免把原文直接解释成目的关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；两分句保持原文的平行结构。“被交了出去”略带受难叙事的庄严色彩，并保留原文未指明交付双方的含蓄性。
