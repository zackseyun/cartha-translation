source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ· ὅτι ἀνομίαν οὐκ ἐποίησεν, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ. καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/010.yaml
  text: 'And I will give the wicked in place of his burial,

    and the rich in place of his death;

    because he committed no lawlessness,

    nor was deceit found in his mouth.

    And the Lord wills to cleanse him from the affliction.'
translation:
  language: zh_hans
  text: '“我要以恶人代替他的埋葬，

    以富人代替他的死亡；

    因为他未曾行不法之事，

    他口中也没有诡诈。

    主愿意洁净他，除去他的伤患。”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节引文的希腊文本在“以恶人代替他的埋葬，以富人代替他的死亡”以及“洁净他，除去他的伤患”等处，与《以赛亚书》53:9—10的其他古代文本形式不同。“埋葬”也可译作“下葬”；“伤患”也可译作“击打”或“灾害”。
    reason: 说明本段引文与其他《以赛亚书》文本传统的真实差异，并交代ταφή和πληγή的相关词义范围。
lexical_decisions:
- source_word: πονηρούς
  choice: 恶人
  rationale: 保留该词在道德层面的明确贬义，并与复数所指相符。
- source_word: ἀντὶ
  choice: 代替
  rationale: 直译其替代、交换关系；原文措辞本身不寻常，不在正文中擅自解释。
- source_word: ταφῆς
  choice: 坟墓
  rationale: 此处可指埋葬或墓所；结合所有格“他的”，译作“坟墓”较自然，同时脚注提示异译。
- source_word: ἀνομίαν
  choice: 不法之事
  rationale: 既表达违反律法或正道的含义，又符合现代汉语“行……之事”的自然搭配。
- source_word: δόλος
  choice: 诡诈
  rationale: 保留欺骗、奸诈之意，也与相关经文传统用语相衔接。
- source_word: βούλεται
  choice: 愿意
  rationale: 表达主的意愿或旨意，不额外强化为已经完成的行动。
- source_word: καθαρίσαι αὐτὸν τῆς πληγῆς
  choice: 洁净他，使他脱离苦难
  rationale: καθαρίσαι译为“洁净”；属格结构可表达从伤患或灾苦中除去、释放。采用自然汉语显明其脱离关系，同时保留“洁净”的核心意象。
- source_word: πληγῆς
  choice: 苦难
  rationale: 该词可指击打、伤患、灾害或折磨；上下文中“苦难”较宽泛，不把含义限制为一次具体击打。
theological_decisions:
- issue: “恶人/富人”与“坟墓/死亡”的关系
  choice: 按原文保留“代替”的对应结构
  alternative: 依照其他文本传统译为“他的坟墓设在恶人中，他死时与财主同葬”
  rationale: 本节所引希腊文本的ἀντί明确形成替代关系，且与其他传本有显著差异；翻译不应无声改按较熟悉的经文形式。
- issue: 主洁净受苦者的含义
  choice: 译作“主愿意洁净他，使他脱离苦难”
  alternative: 译作“主定意击打他/使他受苦”
  rationale: 所给希腊文是καθαρίσαι而非表示击打或压伤的动词，应忠实保留“洁净”；同时不进一步界定其救赎论或医治层面的含义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并保留引文的诗行结构。原文两个ἀντί短语较为突兀，正文不加解释性补词；末句则以“使他脱离”自然呈现希腊语属格所表达的分离关系。
