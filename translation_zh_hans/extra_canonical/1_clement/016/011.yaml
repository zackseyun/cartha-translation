  text: 'If you give for sin,

    your soul will see long-lived offspring[a].'
translation:
  language: zh_hans
  text: 你们若献上赎罪祭[a]，你们的心灵必看见长寿的后裔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你们若为罪而献上。”这里的希腊语短语通常也可指献上赎罪祭。
    reason: 保留περὶ ἁμαρτίας的字面结构与祭祀术语之间的歧义。
lexical_decisions:
- source_word: δῶτε περὶ ἁμαρτίας
  choice: 献上赎罪祭
  rationale: περὶ ἁμαρτίας在《七十士译本》的献祭语境中常表示“赎罪祭”；“献上”体现δῶτε在此处的奉献含义，同时以脚注保留希腊文本未明说“祭物”的形式特点。
- source_word: ἡ ψυχὴ ὑμῶν
  choice: 你们的心灵
  rationale: 保留原文“你们的ψυχή”这一表达及单数集合性意象；“心灵”在现代汉语中比“灵魂”更自然，也不把它简化为人称代词。
- source_word: σπέρμα μακρόβιον
  choice: 长寿的后裔
  rationale: σπέρμα在这里是集合意义的“后裔”，μακρόβιον直指寿命长久；译文不将其解释性改写为“永存的后代”。
theological_decisions:
- issue: περὶ ἁμαρτίας是否应明确为祭祀术语
  choice: 正文译作“赎罪祭”，并用脚注注明较直译形式
  alternative: “为罪而献上”
  rationale: 祭祀术语符合该短语在希腊旧约中的惯常用法，也避免现代读者误解为“为了犯罪而给予”；但由于名词“祭物”并未明写，脚注保留形式上的歧义。
- issue: “后裔”的身份与应许性质
  choice: 仅译作“长寿的后裔”
  alternative: 解释为特定群体或属灵后裔
  rationale: 原句没有进一步界定σπέρμα，故不加入基督论、教会论或血缘性的限定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“必看见”传达将来指向而不增加原文没有的时间说明；保留“你们的心灵”这一略带希伯来语色彩的表达，以维持原句意象。
