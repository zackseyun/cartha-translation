id: 1CLEM.16.8
reference: 1 Clement 16:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ . ἀπὸ τῶν ἀνομιῶν τοῦ λαοῦ μου ἤκει εἰς θάνατον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/008.yaml
  text: 'Who will describe his generation?

    For his life is taken from the earth.

    Because of the lawless deeds of my people he came to death.'
translation:
  language: zh_hans
  text: '谁能述说他的世代？


    因为他的生命从地上被夺去；


    因我百姓的不法之事，他已到了死亡。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν γενεὰν αὐτοῦ
  choice: 他的世代
  rationale: 保留 γενεά 可指“世代、同代人、出身”的原文含混性，不径自解释为“后裔”或“身世”。
- source_word: τίς διηγήσεται
  choice: 谁能述说
  rationale: διηγήσεται 表示详述、讲述；“述说”兼顾庄重语体与现代可懂性。
- source_word: αἴρεται
  choice: 被夺去
  rationale: 此处为被动形式，结合生命离开地上的语境，“被夺去”比单纯“被取走”更自然，并保留受难意味。
- source_word: ἀπὸ τῶν ἀνομιῶν
  choice: 因……的不法之事
  rationale: ἀπό 在此表达原因或根源；ἀνομίαι 指违背律法、邪恶不法的行为，译作“不法之事”而不缩窄为某类罪。
- source_word: ἤκει εἰς θάνατον
  choice: 他走向死亡
  rationale: ἥκω εἰς 可表达来到、达到某种境地；“走向死亡”自然地传达其结果，同时避免擅自补入“被处死”等更具体解释。
theological_decisions:
- issue: “他的世代”的所指
  choice: 保留为“他的世代”
  alternative: “他的身世”或“他的后裔”
  rationale: 原文 γενεά 本身存在解释空间；译文不替读者解决其可能指同代人、出身或后裔的张力。
- issue: 死亡与百姓不法之间的关系
  choice: 译为“因我百姓的不法之事”
  alternative: “为我百姓的不法之事”
  rationale: ἀπό 较直接表达原因或来源，并不明确等同于代赎性的“为了”；因此避免在译文中强化原文未明说的神学关系。
translation_notes:
  register: 采用庄重而清晰的现代书面汉语，并按原文三句诗行排列。保留先知性引文的凝练节奏及关键语义含混，不加入解释性称谓或代词。
