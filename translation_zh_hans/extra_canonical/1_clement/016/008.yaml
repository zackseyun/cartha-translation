  source_fidelity: 首两句基本忠实地呈现了“谁能述说他的世代？”以及“他的生命从地上被夺去”。末句的“走向死亡”把 ἤκει（已来到、已达到）弱化为尚在进行的趋向，未充分表达原文所呈现的抵达死亡这一结果。
