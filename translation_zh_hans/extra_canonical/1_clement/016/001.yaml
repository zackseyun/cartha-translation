  yaml_path: translation/extra_canonical/1_clement/016/001.yaml
  text: For the Messiah belongs to the humble-minded, not to those who exalt themselves over his flock.
translation:
  language: zh_hans
  text: 因为基督属于谦卑的人，而不属于那些凌驾于他的羊群之上的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给的规范化OCR希腊文本疑有严重讹误，作“把自己投向他的敬畏”；本译文依《革利免一书》此处通行的希腊文本，作“凌驾于他的羊群之上”。
    reason: 说明所给OCR文本与通行希腊文本之间的实质差异，并交代正文采用通行文本的依据。
lexical_decisions:
- source_word: Ταπεινοφρονούντων
  choice: 谦卑的人
  rationale: 表示心思谦卑、持谦逊态度的人；译作自然的现代汉语，同时保留其品格含义。
- source_word: ὁ Χριστός
  choice: 基督
  rationale: 此处是称号，采用现代汉语基督教文献中通行而庄重的译法。
- source_word: ἐπαιρομένων
  choice: 抬高自己的人
  rationale: 中间语态表达自高、自我抬举；这样译能清楚传达原文对骄傲者的批评。
- source_word: τὸ ποίμνιον αὐτοῦ
  choice: 他的羊群
  rationale: 保留原文牧养隐喻，指属于基督的群体，不将其解释性地窄化为某一制度性称谓。
theological_decisions:
- issue: “基督属于……”所表达的归属关系
  choice: 保留“基督属于谦卑的人”这一反常而有张力的表述
  alternative: “谦卑的人属于基督”或“基督与谦卑的人同在”
  rationale: 希腊文使用属格加ἐστίν，字面关系是“基督是谦卑之人的”；不倒转归属方向，也不改写成较弱的陪伴关系。
- issue: 羊群意象的所指
  choice: 直译为“他的羊群”
  alternative: “他的教会”或“会众”
  rationale: 保留作者的牧养意象，避免把隐喻直接解释为特定教会论术语。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“谦卑”与“抬高自己”形成清晰对照；保留“属于”和“羊群”所承载的原文张力与意象。
