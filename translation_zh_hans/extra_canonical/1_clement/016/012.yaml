  text: καὶ κύριος βούλεται ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ, δεῖξαι αὐτῷ φῶς καὶ πλάσαι τῇ συνέσει, δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς· καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/012.yaml
  text: 'And the Lord wills to remove the anguish of his soul,

    to show him light and to form him with understanding,

    to justify the righteous one who serves many well;

    and he himself will bear their sins[a].'
translation:
  language: zh_hans
  text: '主愿意使他脱离心灵的痛苦，


    让他看见光，以悟性塑造他，[a]


    使那好好服事许多人的义者得称为义；


    他们的罪，他必亲自担当。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以悟性塑造他”原文表达简约；“他”是按上下文补出的。
    reason: 说明希腊文 πλάσαι τῇ συνέσει 未明说宾语，避免让读者误以为代词在原文中明确出现。
lexical_decisions:
- source_word: βούλεται
  choice: 定意
  rationale: 表达主明确的旨意与意愿；比单纯的“想要”庄重，也不额外引入强制或预定含义。
- source_word: ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ
  choice: 使他脱离心灵的痛苦
  rationale: 按希腊文“从……痛苦中除去/带走”的结构自然转译；“心灵”对应 ψυχή，避免把痛苦仅限于身体劳苦。
- source_word: δεῖξαι αὐτῷ φῶς
  choice: 让他看见光
  rationale: 直译为“向他显明光”亦可；结合宾语与受事者关系，“让他看见光”在现代汉语中更自然。
- source_word: πλάσαι τῇ συνέσει
  choice: 以悟性塑造他
  rationale: 保留 πλάσσω“塑造、形成”的具体意象和 σύνεσις“悟性、理解力”的含义；宾语“他”由连续的不定式结构补出。
- source_word: δικαιῶσαι δίκαιον
  choice: 使……义者得称为义
  rationale: 保留原文“称义/判为义”与“义者”并置所形成的张力，不改写为单纯的奖赏或宣告无罪。
- source_word: εὖ δουλεύοντα πολλοῖς
  choice: 好好服事众人
  rationale: εὖ 修饰“服事”，故译作“好好服事”；πολλοῖς 字面为“许多人”，此处用“众人”保持庄重而不暗示毫无限定的全体。
- source_word: αὐτὸς ἀνοίσει
  choice: 他必亲自担当
  rationale: 用“亲自”体现强调代词 αὐτός；“担当”符合 ἀναφέρω 在承担罪过语境中的意义。
theological_decisions:
- issue: “称义”与“义者”的并置
  choice: 使那……的义者得称为义
  alternative: 使那……的义人称许多人为义
  rationale: 现有希腊文将 δικαιῶσαι 的直接宾语自然读作 δίκαιον，而 εὖ δουλεύοντα πολλοῖς 修饰该“义者”；译文保留这一句法，同时不解释其称义机制。
- issue: 末句代词的指向
  choice: 他们的罪，他必亲自担当
  alternative: 众人的罪，他必亲自担当
  rationale: 原文 αὐτῶν 为“他们的”，很可能回指前面的“众人/许多人”，但译文保留代词形式，不把指向绝对化。
- issue: 光与塑造的关系
  choice: 让他看见光，以悟性塑造他
  alternative: 显光给他看，并以悟性塑造
  rationale: 把两个不定式视为并列、同受“主定意”支配；不将“光”解释为复活、启示或其他特定教义概念。
translation_notes:
  register: 采用现代、庄重而可诵读的书面汉语，并按原文诗性分行。保留“心灵的痛苦”“看见光”“塑造”“称义”“担当罪”等核心意象与神学张力；避免用教派术语解释其具体机制。
