    issue: “众人”弱化了 πολλοῖς 的数量限定。
    rationale: πολλοῖς 的通常意义是“许多人”，并非“所有人”。“众人”在现代汉语中通常指全体，与原文的限定不符。
  - severity: low
    issue: “主定意”对 βούλεται 略显强化。
    rationale: βούλεται 表示“愿意、意欲、旨意是”，未必包含汉语“定意”所暗示的决断性。译为“主愿意”更直接，也不引入额外的神学意味。
