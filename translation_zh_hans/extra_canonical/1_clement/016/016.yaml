  naturalness: 原译庄重流畅，但“摇头说道”将动作与言语连接得略紧。“嘴唇翕动，说道；摇着头：”既保留诗歌式排比，也更自然地为引语铺垫。
  terminology: “主”“信靠”“搭救”“拯救”“喜爱”均合乎现代汉语圣经语体，并能反映 κύριον、ἤλπισεν、ῥυσάσθω、σωσάτω、θέλει。补出“主”可消除汉语第三人称指代歧义，未改变原意。
