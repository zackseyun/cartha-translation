  text: πάντες οἱ θεωροῦντές με ἐξεμυκτήρισάν με, ἐλάλησαν ἐν χείλεσιν, ἐκίνησαν κεφαλήν· Ἤλπισεν ἐπὶ κύριον, ῥυσάσθω αὐτόν, σωσάτω αὐτόν, ὅτι θέλει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/016.yaml
  text: 'All who saw me mocked me;

    they spoke with their lips,

    they shook their heads:

    ‘He hoped in the Lord; let him rescue him;

    let him save him[a], because he delights in him.’'
translation:
  language: zh_hans
  text: '凡看见我的人都嘲笑我；

    他们嘴唇翕动，说道；

    摇着头：

    “他信靠主；愿主搭救他，

    愿主拯救他，

    因为主喜爱他。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεωροῦντές
  choice: 看见
  rationale: 该词指观看、注视；在此与宾语“我”连用，译作“看见”自然准确。希腊文为现在分词，但受过去时主句统摄；现代汉语无须强行标示时态。
- source_word: ἐξεμυκτήρισάν
  choice: 嘲笑
  rationale: 表示带有轻蔑的讥笑；“嘲笑”符合现代汉语诗体语境。
- source_word: ἐλάλησαν ἐν χείλεσιν
  choice: 撇着嘴说话
  rationale: 直译为“用嘴唇说话”在汉语中含义不明；结合嘲弄语境，用“撇着嘴”传达嘴唇动作和轻蔑语气，同时保留“说话”。
- source_word: ἐκίνησαν κεφαλήν
  choice: 摇头
  rationale: 字面为“摇动头”；单数“头”在复数主语后作分配用法，汉语惯用“摇头”。
- source_word: ἤλπισεν ἐπὶ κύριον
  choice: 信靠主
  rationale: ἤλπισεν 可指盼望或信赖；介词短语 ἐπὶ κύριον 在此表达把倚靠放在主身上，“信靠主”最贴合上下文。
- source_word: ῥυσάσθω
  choice: 搭救
  rationale: 表示从危险或困境中救出；“搭救”与后句“拯救”区分措辞，并保留两个平行命令。
- source_word: σωσάτω
  choice: 拯救
  rationale: 常指救助、拯救；这里译作“拯救”，保留与 ῥυσάσθω 的平行关系。
- source_word: θέλει
  choice: 喜爱
  rationale: θέλω 可表示愿意、想要，也可在此引文语境中表示以某人为喜悦；“喜爱”符合句义，又避免生硬的“想要他”。
theological_decisions:
- issue: ὅτι θέλει αὐτόν 中省略主语的指向
  choice: 译为“因为主喜爱他”，将省略的主语理解为“主”
  alternative: “因为他喜爱他”或“因为他愿意救他”
  rationale: 紧邻的两个第三人称命令均以“主”为隐含主语，且本句说明主搭救、拯救此人的理由，因此补出“主”最清楚；“他喜爱他”在现代汉语中指代不明，而“愿意救他”则加入了原文没有明说的“救”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并按诗歌排行。为使希腊文省略的命令主语在汉语中清楚，两次补出“主”。“他们撇着嘴说话，摇头说道”既呈现身体动作，也自然引出后面的直接引语。
