  rationale: 将“撇着嘴说话”改为“嘴唇翕动，说道”，以避免把原文未明确的“撇嘴”动作写入译文，同时保留希腊文对嘴唇的提及及其与随后直接引语的关系。把“摇头说道”调整为“摇着头：”，使摇头与说话这两个并列动作在汉语诗行中更清楚。“愿主”保留原文第三人称祈使在讥讽引语中的语气。
