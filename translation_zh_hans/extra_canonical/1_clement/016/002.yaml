  text: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ, ὁ κύριος Ἰησοῦς Χριστός, οὐχ ἦλθεν ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας, καίπερ δυνάμενος, ἀλλὰ ταπεινοφρονῶν, καθὼς τὸ πνεῦμα τὸ ἅγιον περὶ αὐτοῦ ἐλάλησεν· φησὶν γάρ· . Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη; ἀνηγγείλαμεν ἐναντίον αὐτοῦ, ὡς παιδίον, ὡς ῥίζα ἐν γῇ διψώσῃ· οὐκ ἔστιν εἶδος αὐτῷ οὐδὲ δόξα, καὶ εἴδομεν αὐτόν, καὶ οὐκ εἶχεν εἶδος οὐδὲ κάλλος, ἀλλὰ τὸ εἶδος αὐτοῦ ἄτιμον, ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων· ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ καὶ εἰδὼς φέρειν μαλακίαν ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ, ἠτιμάσθη καὶ οὐκ ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/002.yaml
  text: 'The scepter of the majesty of God[a], the Lord Jesus Messiah, did not come in the pomp of arrogance or pride, though being able, but in humility, just as the Holy Spirit spoke concerning him. For it says:


    “Lord, who has believed our report?

    and to whom has the arm of the Lord been revealed?

    We announced him before him,

    like a child,

    like a root in thirsty ground.

    He has no form nor glory,

    and we saw him,

    and he had neither form nor beauty,

    but his appearance was dishonored,

    lacking beyond the appearance of men;

    a man being in affliction and toil

    and knowing how to bear weakness,

    because his face is turned away[c][b];

    he was dishonored and not esteemed.”'
translation:
  language: zh_hans
  text: '上帝威严的权杖——主耶稣弥赛亚——本来有能力，却没有带着狂妄自大的排场而来，反倒心存谦卑，正如圣灵论到他所说的。因为说：


    “主啊，谁信了我们所传的？


    主的膀臂向谁显露了呢？


    我们在他面前宣告，


    如同孩童，


    又像干旱之地的根。


    他没有形貌，也没有荣美；


    我们看见他，


    他也没有形貌和美丽。


    反倒他的形貌受辱，


    远逊于常人的形貌；[a]


    他是身受苦楚、劳苦的人，[b]


    知道怎样承受软弱。


    因为他的脸已经转开了；[c]


    他受人鄙视，不被看重。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “远逊于常人的形貌”也可译作“他的形貌比世人更为残缺”。
    reason: ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων的比较结构生硬且语义不寻常；脚注保留较直译的理解。
  - marker: b
    text: “身受苦楚”直译可作“处在击打（或创伤）中”。
    reason: πληγή可指击打、伤口、灾患或痛苦；此处不应限定为某一种具体病患。
  - marker: c
    text: 这句话也可理解为“因为人们转脸避开他”或“因为他的脸被转过去了”。
    reason: ἀπέστραπται τὸ πρόσωπον αὐτοῦ为被动完成式，施事及具体所指均不明确；正文保留其被动和含混。
lexical_decisions:
- source_word: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ
  choice: 上帝威严的权杖
  rationale: 保留“权杖”这一统治权象征，并将 μεγαλωσύνη 自然译作“威严”。
- source_word: ὁ κύριος Ἰησοῦς Χριστός
  choice: 主耶稣弥赛亚
  rationale: Χριστός 在此是称号，译作“弥赛亚”可显明其“受膏者”身份，而非仅作姓名处理。
- source_word: ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας
  choice: 带着狂妄自大的排场
  rationale: κόμπος 指夸示、铺张的外在声势；ἀλαζονεία 与 ὑπερηφανία 共同表达狂妄和高傲，合并为现代汉语自然表达。
- source_word: ταπεινοφρονῶν
  choice: 心存谦卑
  rationale: 表达持续的谦卑心态，而非仅指低微处境。
- source_word: ἀνηγγείλαμεν ἐναντίον αὐτοῦ
  choice: 我们在他面前宣告
  rationale: 原文动词没有明说直接宾语，故不补入“他”；ἐναντίον αὐτοῦ 译为“在他面前”，保留所引希腊文本的结构与含混性。
- source_word: ἐν γῇ διψώσῃ
  choice: 干旱之地
  rationale: 字面为“干渴的土地”，汉语“干旱之地”自然且保留意象。
- source_word: ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων
  choice: 甚至不及常人
  rationale: ἐκλεῖπον 有缺失、逊于之意；此译在汉语中自然呈现其相较于人的外貌有所不及的困难措辞。
- source_word: ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ
  choice: 他是身受苦楚、劳碌的人
  rationale: πληγή 在此以赛亚受苦仆人的语境中指打击、创伤或苦楚，不宜译成现代汉语通常指传染病的“瘟疫”；πόνος 译作“劳碌”。
- source_word: εἰδὼς φέρειν μαλακίαν
  choice: 知道怎样承受软弱
  rationale: 贴近 εἰδὼς φέρειν 的“知道如何承受”，并保留 μαλακία 可指软弱或病弱的语义张力。
- source_word: οὐκ ἐλογίσθη
  choice: 不被看重
  rationale: λογίζομαι 在此为算作、重视之意；被动表达译作“不被看重”简洁自然。
theological_decisions:
- issue: 耶稣作为“上帝威严的权杖”的同位关系
  choice: 用破折号标明“主耶稣弥赛亚”解释“上帝威严的权杖”
  alternative: 将两者顺接，可能被误读为两个主语
  rationale: 希腊文中二者为同位结构；标点明确语法关系，不额外解释其神学含义。
- issue: καίπερ δυνάμενος 所指能力的具体内容
  choice: 译为“本来有能力”，不补充“彰显权势”或其他宾语
  alternative: 译为“虽然本可彰显大能”
  rationale: 原文没有说明他有能力做什么，宜保留省略和张力。
- issue: 圣灵与经文引语的关系
  choice: 译为“正如圣灵论到他所说的。因为经上说”
  alternative: 直接写成“圣灵在以赛亚书中说”
  rationale: 忠实呈现作者将引文归于圣灵的说法，同时不添加原文未明说的书卷名称。
- issue: ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ 的施事与语态含混
  choice: 译为“因为他的脸被人转避”并加注
  alternative: 译为“因为他转过脸去”或“人们掩面不看他”
  rationale: 原句形式和所引七十士译本式措辞较为晦涩；正文尽量保留被动意味，脚注说明可理解为人们避开他的脸。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。叙述部分力求自然；引文使用略带诗体的分行形式，但避免过度古雅。所有脚注标记均置于相应正文之后。
