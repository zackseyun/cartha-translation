  text: οὗτος τὰς ἁμαρτίας ἡμῶν φέρει καὶ περὶ ἡμῶν ὀδυνᾶται, καὶ ἡμεῖς ἐλογισάμεθα αὐτὸν εἶναι ἐν πόνῳ καὶ ἐν πληγῇ καὶ ἐν κακώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/004.yaml
  text: This one bears our sins and suffers on our behalf[a], and we considered him to be in pain and under a blow and in affliction.
translation:
  language: zh_hans
  text: 这位担当我们的罪，也为我们受苦[a]；我们认为他正处于痛苦、受击打和困苦之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为我们受苦”也可译作“因我们而痛苦”或“为我们的事忧伤”。原词可兼指身体的疼痛和内心的忧苦。
    reason: 保留ὀδυνᾶται及περὶ ἡμῶν在痛苦类型和关系表达上的语义幅度。
lexical_decisions:
- source_word: φέρει
  choice: 担当
  rationale: 这里指承担、背负罪；“担当我们的罪”既贴近希腊文，也符合庄重而自然的现代汉语表达。
- source_word: ὀδυνᾶται
  choice: 受痛苦
  rationale: 该词表示经历疼痛或忧苦；此处用概括性的“受痛苦”，不把含义限缩为纯粹肉体疼痛或内心忧伤。
- source_word: ἐν πόνῳ
  choice: 遭受痛楚
  rationale: πόνος在此指疼痛、苦楚，而非现代意义上的劳作；“痛楚”也可与前面的概括性“受痛苦”适度区分。
- source_word: ἐν πληγῇ
  choice: 遭受……击打
  rationale: πληγή基本义为击打、创伤或灾击；“击打”保留原文具体意象，避免误译为传染性的“瘟疫”。
- source_word: ἐν κακώσει
  choice: 遭受……苦待
  rationale: κάκωσις可指折磨、虐待或困苦；“苦待”保留被加害、受压迫的色彩。
theological_decisions:
- issue: περὶ ἡμῶν所表达的关系
  choice: 为我们
  alternative: 因我们／关于我们
  rationale: 介词短语可表示关乎我们，也可在语境中带有代表或代受意味。“为我们”是自然且有根据的表达，但脚注保留较宽泛的关系解释，避免过度限定其神学机制。
- issue: 对受苦者遭遇的判断
  choice: 我们却认为他正遭受痛楚、击打和苦待
  alternative: 我们算定他处在痛苦、击打和困苦之中
  rationale: ἐλογισάμεθα表示认定、认为；采用“认为”不额外说明这种判断是否正确，保留原文张力。“遭受”使三个介词短语在现代汉语中更自然。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“这位”对应οὗτος，保留原文指示语气；后半句以三个并列宾语呈现原文的累积节奏，同时避免生硬照搬三个“在……之中”的结构。
