id: 1CLEM.16.5
reference: 1 Clement 16:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἁμαρτίας ἡμῶν καὶ μεμαλάκισται διὰ τὰς ἀνομίας ἡμῶν. παιδεία εἰρήνης ἡμῶν ἐπ’ αὐτόν· τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/005.yaml
  text: 'But he was wounded because of our sins

    and was afflicted because of our lawless deeds.

    The chastisement of our peace was upon him;

    by his bruise we were healed.'
translation:
  language: zh_hans
  text: '然而，他因我们的罪而受伤，

    因我们的不法之事而受苦。

    使我们得平安的管教落在他身上；

    因他所受的伤，我们得了医治。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: 受伤
  rationale: 直接表达被动意义“被创伤、受伤”，并保留原文简洁庄重的措辞。
- source_word: μεμαλάκισται
  choice: 受苦
  rationale: 该词本可指“变得软弱”或“遭受折磨、苦待”；此处与“受伤”平行，译作“受苦”较符合语境，同时避免生硬的“被削弱”。
- source_word: ἀνομίας
  choice: 不法之事
  rationale: 保留 ἀνομία 的“违背律法、无法无天”语义，不将其泛化为普通的过错。
- source_word: παιδεία
  choice: 管教
  rationale: 该词涵盖训练、纠正和惩治；“管教”能保留其纠正性与受罚意味。
- source_word: εἰρήνης
  choice: 平安
  rationale: “平安”既可涵盖安宁，也可表达完整、和好的状态，适合此处浓缩的属格结构。
- source_word: μώλωπι
  choice: 所受的伤
  rationale: 原词可指鞭痕、青肿或伤痕；上下文未明说致伤方式，采用较宽的“伤”以免过度具体化。
- source_word: ἰάθημεν
  choice: 得了医治
  rationale: 保留被动语态和完成性结果，表达“我们被医治了”。
theological_decisions:
- issue: παιδεία εἰρήνης ἡμῶν 的压缩关系
  choice: 使我们得平安的管教
  alternative: 我们平安的刑罚
  rationale: 原文的属格关系高度凝缩，可指带来我们平安的管教，也可理解为与我们平安有关的惩治。正文采用自然而不失张力的目的/结果表达，不进一步规定赎罪机制。
- issue: 因果介词 διά 的表达
  choice: 因我们的罪／因我们的不法之事
  alternative: 为了我们的罪／由于我们的罪
  rationale: διά 加宾格通常表达“因为、由于”；译文保持罪与受苦之间的因果关联，但不额外解释其具体神学模式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语，并以四行诗体保留原文引文的平行结构。时态按汉语习惯统一处理，不机械复制希腊语的时体差异。
