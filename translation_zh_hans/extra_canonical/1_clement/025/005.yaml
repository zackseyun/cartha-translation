base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/005.yaml
  text: So then the priests inspect the records of the times[a], and they find that it came when the five-hundredth year was completed.
translation:
  language: zh_hans
  text: 于是，祭司们查考年代的记载，发现它是在第五百年期满时来到的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱερεῖς
  choice: 祭司们
  rationale: 直接对应复数名词，符合古代宗教语境，也为现代读者所熟悉。
- source_word: ἐπισκέπτονται
  choice: 查考
  rationale: 此处表示仔细查阅、核查记录；“查考”比泛泛的“查看”更贴合语境。
- source_word: ἀναγραφὰς τῶν χρόνων
  choice: 年代的记载
  rationale: 保留“时间／年代”与“书面记录”的属格关系，中文表达自然，且不擅自具体化为某一种编年史。
- source_word: ἐληλυθέναι
  choice: 来到
  rationale: 完成时不定式置于间接陈述中，表示他们查明它已在所述时间来到；中文用“来到”配合“发现……是……时”自然呈现。
- source_word: πεντακοσιοστοῦ ἔτους πεπληρωμένου
  choice: 第五百年期满时
  rationale: 准确表达属格独立结构以及序数“第五百年”，同时以简洁自然的现代汉语传达该年完成之时。
theological_decisions:
- issue: αὐτόν所指对象的表达
  choice: 它
  alternative: 他
  rationale: 该阳性代词承接上下文中的阳性名词所指之物（凤凰）；汉语按非人动物通常用“它”，不把希腊语的语法性别误作人格或神学判断。
- issue: 五百年周期的表述
  choice: 第五百年期满时
  alternative: 满五百年时
  rationale: 原文使用序数“第五百”，本译保留这一形式，避免将其无痕改写成基数时段，尽管两者在此语境中意义接近。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“于是”承接上文论述；句式清楚简洁，保留原文先查考记录、后得出发现的叙述顺序。
