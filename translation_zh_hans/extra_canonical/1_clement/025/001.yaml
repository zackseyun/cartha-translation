  text: Let us consider the remarkable sign that takes place in the eastern regions, that is, in the areas around Arabia.
translation:
  language: zh_hans
  text: 让我们来看一看发生在东方各地、也就是阿拉伯一带的那个奇异征兆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδωμεν
  choice: 让我们来看一看
  rationale: 保留第一人称复数劝勉语气；“看一看”在现代汉语中自然，也适合引出随后描述的现象。
- source_word: τὸ παράδοξον σημεῖον
  choice: 那个奇异征兆
  rationale: παράδοξον 指出乎寻常、令人惊异；σημεῖον 在此为具有指示意义的现象，译作“征兆”比泛称“事情”更贴近原词。定冠词结合语境译为“那个”。
- source_word: τὸ γινόμενον
  choice: 发生
  rationale: 用“发生”表达现在分词所描述的出现或发生，不额外限定为一次性或持续性事件。
- source_word: ἐν τοῖς ἀνατολικοῖς τόποις
  choice: 在东方各地
  rationale: ἀνατολικοῖς 表示东方的，τόποις 为地方或地区；“东方各地”简洁自然，并保留复数地域范围。
- source_word: τουτέστιν τοῖς περὶ τὴν Ἀραβίαν
  choice: 也就是阿拉伯一带
  rationale: τουτέστιν 是解释语，译为“也就是”；περὶ τὴν Ἀραβίαν 指阿拉伯周边或邻近区域，“阿拉伯一带”保留其地域边界的宽泛性。
