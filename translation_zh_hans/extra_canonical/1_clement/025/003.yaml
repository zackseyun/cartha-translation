source:
  edition: Funk 1901 (normalized OCR)
  text: σηπομένης δὲ τῆς σαρκὸς σκώληξ τις γεννᾶται, ὃς ἐκ τῆς ἰκμάδος τοῦ τετελευτηκότος ζώου ἀνατρεφόμενος πτεροφυεῖ· εἶτα γενναῖος γενόμενος αἴρει τὸν σηκὸν ἐκεῖνον, ὅπου τὰ ὀστᾶ τοῦ προγεγονότος ἐστίν, καὶ ταῦτα βαστάζων διανύει ἀπὸ τῆς Ἀραβικῆς χώρας ἕως τῆς Αἰγύπτου εἰς τὴν λεγομένην Ἡλιούπολιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/003.yaml
  text: But as its flesh decays[a], a certain worm is produced, which, being nourished from the moisture of the dead creature, grows wings. Then, when it has become strong, it lifts up that nest in which are the bones of the one that came before, and carrying them it travels from the land of Arabia as far as Egypt, to the city called Heliopolis.
translation:
  language: zh_hans
  text: 但当它的肉腐烂时，就生出一条虫；这虫由那死去动物的湿气养育，长出翅膀。随后，它变得强壮，便抬起那个巢[a]，先前那只鸟的骨头就在其中；它带着这些骨头，从阿拉伯地区一直行到埃及，来到那座称为赫利奥波利斯的城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巢”所译的希腊词也可指围起来的处所、容器或龛室；这里指存放先前那只鸟遗骨的所在。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: σηπομένης
  choice: 腐烂
  rationale: 准确表达肉体腐败、朽坏的过程，且符合现代汉语自然表达。
- source_word: σκώληξ τις
  choice: 一条虫
  rationale: 保留原文笼统的虫类称谓，不擅自具体化为蛆或某种昆虫。
- source_word: ἰκμάδος
  choice: 汁液
  rationale: 此处指死去生物体内的湿气或液质；“汁液”在叙事中自然，也保留古代生物观念。
- source_word: πτεροφυεῖ
  choice: 渐渐长出翅膀
  rationale: 表达复合动词“生出翅膀”的含义；“渐渐”与受滋养成长的语境协调，但不改变事件实质。
- source_word: σηκόν
  choice: 巢
  rationale: 结合凤凰传说语境及其中盛放遗骨的功能译为“巢”，同时以脚注注明该词也可指围栏、容器或龛室。
- source_word: διανύει
  choice: 一路行到
  rationale: 体现走完一段路程、抵达目的地的动态含义。
- source_word: Ἡλιούπολιν
  choice: 赫利奥波利斯
  rationale: 采用该埃及古城通行的音译，避免直接意译为“太阳城”而掩盖专名性质。
theological_decisions:
- issue: 凤凰再生叙述的陈述语气
  choice: 按原文直接叙述，不增加“据说”等限定语
  alternative: 译作“据说会生出一条虫”以标明传说性质
  rationale: 本节原文以直接陈述方式延续例证；译文不替作者加入认识论上的保留，也不将这一自然史例证提升为教义断言。
- issue: τοῦ προγεγονότος所指对象
  choice: 译为“先前那只鸟”
  alternative: 译为“先前存在的那一个”或“前一个生物”
  rationale: 上下文谈论凤凰，汉语需要补出量词所依附的名词；“鸟”使指代清楚，又不引入额外神学解释。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语，保留原文由腐烂、滋养、长翼到迁行的叙事次序。关系代词ὃς明确指向“一条虫”，故译作“这虫……”，避免误解为并列主语。
