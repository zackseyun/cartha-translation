  to: 但当它的肉腐烂时，就生出一条虫；这虫由那死去动物的湿气养育，长出翅膀。随后，它变得强壮，便抬起那个巢[a]，先前那只鸟的骨头就在其中；它带着这些骨头，从阿拉伯地区一直行到埃及，来到那座称为赫利奥波利斯的城。
