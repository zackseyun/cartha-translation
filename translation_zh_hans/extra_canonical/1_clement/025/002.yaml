  naturalness: 原译通顺庄重。改为“仅此一只”“等到时候满足”更自然，也更适合古代叙述文体；“已临近死期”保留 ἤδη 及明确的死亡语义。
  terminology: “凤凰”“乳香”“没药”“香料”均为合适的现代标准汉语和常用圣经术语。“巢”在此传说语境中可接受。
