  text: ὄρνεον γάρ ἐστιν, ὃ προσονομάζεται φοῖνιξ· τοῦτο μονογενὲς ὑπάρχον ζῇ ἔτη πεντακόσια, γενόμενόν τε ἤδη πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό, σηκὸν ἑαυτῷ ποιεῖ ἐκ λιβάνου καὶ σμύρνης καὶ τῶν λοιπῶν ἀρωμάτων, εἰς ὃν πληρωθέντος τοῦ χρόνου εἰσέρχεται καὶ τελευτᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/002.yaml
  text: For there is a bird that is called the phoenix. This creature[a], being the only one of its kind, lives for five hundred years; and when it has now come near to the time of its death, it makes for itself a nest from frankincense and myrrh and the other spices. When the time has been fulfilled, it enters into it and dies.
translation:
  language: zh_hans
  text: 因为有一种鸟，名叫凤凰；这种鸟仅此一只，活五百年。当它已临近死期时，就用乳香、没药和其他香料为自己筑巢；等到时候满足，便进入其中死去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄρνεον
  choice: 鸟
  rationale: 采用现代汉语普通、自然的类称，符合上下文。
- source_word: προσονομάζεται φοῖνιξ
  choice: 名叫凤凰
  rationale: φοῖνιξ在此指传说中的凤凰鸟；“名叫”自然表达被如此称呼。
- source_word: μονογενὲς
  choice: 世上唯一的一只
  rationale: 此处描述该鸟只有一个个体，而非亲子关系中的“独生”；如此译出可避免“独生”的神学联想。
- source_word: πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό
  choice: 临近死亡之时
  rationale: 保留ἀποθανεῖν明确的死亡含义，同时以自然汉语表达ἀπόλυσις所含的离世、终结意味，不生硬译作“获释”。
- source_word: σηκόν
  choice: 巢
  rationale: 在凤凰传说语境中指其以香料筑成、进入其中死去的巢或窝；“巢”简洁自然。
- source_word: λίβανος καὶ σμύρνα
  choice: 乳香、没药
  rationale: 采用两种芳香树脂的通行圣经译名。
- source_word: τῶν λοιπῶν ἀρωμάτων
  choice: 其他香料
  rationale: ἀρώματα在此泛指芳香材料，“香料”符合现代汉语习惯。
- source_word: πληρωθέντος τοῦ χρόνου
  choice: 期限一满
  rationale: 表达所定时间达到终点，不额外说明期限由谁设定。
- source_word: τελευτᾷ
  choice: 死去
  rationale: 直接保留生命终止的意义，与前文“死亡”相呼应。
theological_decisions:
- issue: μονογενές是否采用带有基督论传统色彩的“独生”
  choice: 世上唯一的一只
  alternative: 独生的／独一无二的
  rationale: 这里谈的是凤凰作为唯一存活个体，并无生育或基督论含义；采用数量与类别意义明确的说法，避免导入经文之外的神学联想。
- issue: ἀπόλυσις与死亡的关系
  choice: 临近死亡之时
  alternative: 临近离世之时／到了从死亡中得释放的时候
  rationale: 属格不定式τοῦ ἀποθανεῖν明确涉及“死”，而ἀπόλυσις可有离去、解脱意味。正文保留明确的死亡语言，但不把语法关系解释成“从死亡中得释放”。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“因为”承接上文论证；分号与短句呈现原文事件次序。未添加脚注，因为主要语义可在正文中自然保留，且所给英文脚注内容与其正文标记位置疑似不相对应。
