revisions:
- from: 因为有一种鸟，名叫凤凰。这鸟是世上唯一的一只，能活五百年；等它临近死亡之时，便用乳香、没药和其他香料为自己筑巢。期限一满，它就进入巢中死去。
  to: 因为有一种鸟，名叫凤凰；这种鸟仅此一只，活五百年。当它已临近死期时，就用乳香、没药和其他香料为自己筑巢；等到时候满足，便进入其中死去。
  rationale: 修订限于移除原文未明说的“世上”范围，并以更贴近 πληρωθέντος τοῦ χρόνου 的表达替换“期限一满”。“已临近死期”保留 ἤδη 以及 τοῦ ἀποθανεῖν 所明示的死亡含义；不增设脚注，因为正文已可自然传达相关语义，英文审计轨迹中的脚注亦不构成需要在此处复制的有效中文锚点。
