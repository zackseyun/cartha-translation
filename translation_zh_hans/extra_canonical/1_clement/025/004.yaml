base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/004.yaml
  text: And by day[a], in the sight of all, it flies to the altar of the sun, places them there, and so starts back.
translation:
  language: zh_hans
  text: 它白天[a]当着众人的面，飞到太阳的祭坛上，把它们放在那里，随后便启程返回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它在白昼当着众人的面，飞到太阳的祭坛上，把它们放在那里，随后便启程返回。”
    reason: 说明ἡμέρας可较凝练地译为“在白昼”，也可按现代汉语自然表达为“白天”；两者意义相同，并保留英语审校记录中的措辞差异。
lexical_decisions:
- source_word: ἡμέρας
  choice: 在白昼
  rationale: 这是表示时间的属格，意为“在白天、白昼时”；译文采用自然且庄重的现代汉语。
- source_word: βλεπόντων πάντων
  choice: 当着众人的面
  rationale: 保留属格绝对结构“所有人都看着”的公开可见含义，同时使汉语流畅。
- source_word: ἐπιπτὰς ἐπὶ τὸν τοῦ ἡλίου βωμόν
  choice: 飞到太阳的祭坛
  rationale: ἐπιπτὰς在此描写飞落或飞抵；结合后续放置动作，译作“飞到”既自然，也不额外限定落下方式。
- source_word: τίθησιν αὐτά
  choice: 把它们放在那里
  rationale: αὐτά为中性复数，指向上文所提之物；本节单独给出时不擅自补明其具体所指。
- source_word: εἰς τοὐπίσω ἀφορμᾷ
  choice: 启程返回
  rationale: 表达向后、往回出发之意；避免生硬直译，同时保留开始返程的动态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。主语依上下文译作“它”；不补充原文未明说的凤凰名称或αὐτά的具体指代。
