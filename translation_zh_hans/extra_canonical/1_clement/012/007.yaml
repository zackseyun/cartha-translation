base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/007.yaml
  text: And they gave her a sign[a], that she should hang scarlet from her house, making it clear that through the blood of the Lord there will be redemption for all who believe and hope in God.
translation:
  language: zh_hans
  text: 他们又给了她一个记号[a]，叫她从自己房屋上挂出朱红色之物，以此清楚表明：借着主的血，凡信靠并仰望上帝的人都必蒙救赎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们接着给了她一个记号。”
    reason: προσέθεντο 与不定式连用是受闪语影响的结构，可强调继续或进一步采取行动；正文采用更简洁自然的“又给了”。
lexical_decisions:
- source_word: προσέθεντο ... δοῦναι
  choice: 又给了
  rationale: 这是受闪语影响的表达，表示继续或进一步做某事；不译成“又说要给”，以免引入原文没有的将来或间接引语意味。
- source_word: σημεῖον
  choice: 记号
  rationale: 既指给喇合的识别标志，也承载作者随后阐明的象征意义；“记号”能兼顾两层含义。
- source_word: ἐκκρεμάσῃ ἐκ τοῦ οἴκου αὐτῆς
  choice: 从自己的房屋悬挂
  rationale: 贴近原文的空间表达，同时保持现代汉语可读性；不擅自补为从“窗户”垂下。
- source_word: κόκκινον
  choice: 朱红色的东西
  rationale: 该词在此实词化，原文没有明说是绳、线或布；译文保留其所指物件的不确定性。
- source_word: λύτρωσις
  choice: 救赎
  rationale: 表达借代价获得释放的含义，也符合这里由“主的血”所界定的神学语境。
- source_word: πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν
  choice: 信靠并仰望上帝
  rationale: 两个并列分词都以对上帝的依靠为核心；“信靠”和“仰望”既自然，又保留相信与盼望的区分。
theological_decisions:
- issue: 朱红标志与主之血的关系
  choice: 译作“以此清楚表明：借着主的血……”
  alternative: 将朱红物直接等同于主的血
  rationale: πρόδηλον ποιοῦντες 引出作者明确赋予该记号的预表意义；译文表达象征关联，而不超出原文断言二者在实体上等同。
- issue: 救赎的范围与条件
  choice: “凡信靠并仰望上帝的人都必蒙救赎”
  alternative: “所有人都必蒙救赎”
  rationale: πᾶσι 受后置定语 τοῖς πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν 限定，范围是所有信靠并仰望上帝的人。
- issue: ἔσται 的时间与语气
  choice: “都必蒙救赎”
  alternative: “都有救赎”
  rationale: 保留将来时所带的应许或展望意味，但不进一步规定其末世论时间点。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留 κόκκινον 所指物件的含混，不补作“绳子”或“线”；以“朱红色的东西”避免中文中将形容词无着落地名词化。脚注标记已在正文中以 [a] 标出。
