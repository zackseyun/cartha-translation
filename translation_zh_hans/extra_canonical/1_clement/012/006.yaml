revisions:
- from: 他们对她说：“就照你对我们所说的成就吧。你一知道我们来了，就要把所有属你的人都聚集在你的屋檐下，他们便会得救；因为凡被发现身在屋外的，都必灭亡。”
  to: 他们对她说：“事情必照你对我们所说的那样成就。你一知道我们要来，就要把所有属于你的人都召集到你家里，他们必得以保全；因为凡被发现是在屋外的，都必丧命。”
  rationale: 修订仅调整语气、现代汉语表达及具体灾难语境下的生死措辞；保留原文“所有属于你的人”的范围开放性，以及知道他们来临后聚集众人的条件与结果关系。无需增设脚注。
