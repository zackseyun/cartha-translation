  text: καὶ εἶπαν αὐτῇ· Ἔσται οὕτως, ὡς ἐλάλησας ἡμῖν. ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς, συνάξεις πάντας τοὺς σοὺς ὑπὸ τὸ στέγος σου, καὶ διασωθήσονται· ὅσοι γὰρ ἐὰν εὑρεθῶσιν ἔξω τῆς οἰκίας, ἀπολοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/006.yaml
  text: And they said to her, “It shall be so, as you have spoken to us. But when you know that we are coming, you shall gather all your people under your roof, and they will be preserved; for as many as are found outside the house will perish.”
translation:
  language: zh_hans
  text: 他们对她说：“事情必照你对我们所说的那样成就。你一知道我们要来，就要把所有属于你的人都召集到你家里，他们必得以保全；因为凡被发现是在屋外的，都必丧命。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται οὕτως
  choice: 就……成就吧
  rationale: 保留将来式“必如此”的语义，同时用自然中文表达对喇合所提条件的确认。
- source_word: τοὺς σοὺς
  choice: 所有属你的人
  rationale: 原文为名词化的所有格表达，并未明确限定为家人；译文保留其范围上的含混。
- source_word: ὑπὸ τὸ στέγος σου
  choice: 在你的屋檐下
  rationale: 较贴近原文，同时在现代汉语中自然表示聚在她家中、受其庇护。
- source_word: διασωθήσονται
  choice: 会得救
  rationale: 该词在这里指从即将发生的毁灭中获救；“得救”既符合上下文，也保留其救援色彩。
- source_word: ἀπολοῦνται
  choice: 必灭亡
  rationale: 准确表达与“得救”相对的毁灭结局，并保持原文严肃语气。
theological_decisions:
- issue: τοὺς σοὺς所指群体的范围
  choice: 译作“所有属你的人”
  alternative: “你所有的亲属”或“你全家的人”
  rationale: 希腊文没有明说亲属或家人，故不把范围缩窄，以保留原文的开放性。
- issue: διασωθήσονται的救恩含义
  choice: 译作“会得救”
  alternative: “会保全性命”
  rationale: 上下文明显涉及免遭死亡，但原词具有较宽的拯救语义；采用“得救”而不添加属灵救恩解释，可保留文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；引语结构清晰，保留原文条件与结果的强烈对照。
