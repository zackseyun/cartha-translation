review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确传达了条件、聚集与屋外者遭毁灭的对照。不过“就照……成就吧”中的“吧”使陈述性的将来确认带有中文祈使/祝愿色彩；“得救”“灭亡”在此具体的免死语境中也较容易被理解为属灵或终末意义。修订以“必照……成就”“保全”“丧命”更准确呈现原文的叙事语境，同时不排除其较宽的拯救词汇色彩。
  naturalness: “所有属你的人”略显生硬，“屋檐下”虽可直译但在现代汉语中容易转为抽象庇护的习语，且与“聚集”搭配不如“到你家里”自然。修订保持庄重叙事体，并使条件句和结果句更顺畅。
  terminology: τοὺς σοὺς保留为“所有属于你的人”，不擅自限定为亲属。διασωθήσονται译为“得以保全”，ἀπολοῦνται译为“丧命”，符合此处迫近灾祸中的生死结果，避免不必要的教义化引申。
  issues:
  - severity: medium
    issue: “就照你对我们所说的成就吧”中的“吧”
    rationale: Ἔσται οὕτως是对未来结果的陈述/确认，不是祈使或祝愿；中文“吧”会轻微改变语气。
  - severity: medium
    issue: “会得救；……都必灭亡”
    rationale: 在本段具体语境中，原文指免于或遭遇即将临到的死亡；“得救/灭亡”在现代中文中较易引出属灵或终末论含义。采用“得以保全/丧命”更贴合语境。
  - severity: low
    issue: “所有属你的人”“在你的屋檐下”
    rationale: 前者不够自然，后者在中文中偏习语化。改为“所有属于你的人”“到你家里”，同时保留原文未明确限定该群体身份的范围。
  revised_text: 他们对她说：“事情必照你对我们所说的那样成就。你一知道我们要来，就要把所有属于你的人都召集到你家里，他们必得以保全；因为凡被发现是在屋外的，都必丧命。”
