  to: 王的人来到她那里，说：“我们这地的探子到你这里来了；把他们带出来，因为王这样命令。”她回答说：“你们所找的那些人的确到过我这里，但他们随即离开，正沿着那条路走。”说这话时，她却给他们指了另一个方向。[a]
