  text: ἐπισταθέντων δὲ τῶν περὶ τοῦ βασιλέως καὶ λεγόντων· Πρὸς σὲ εἰσῆλθον οἱ κατάσκοποι τῆς γῆς ἡμῶν· ἐξάγαγε αὐτούς, ὁ γὰρ βασιλεὺς οὕτως κελεύει, ἥδε ἀπεκρίθη· Εἰσῆλθον μέν οἱ ἄνδρες, οὓς ζητεῖτε, πρὸς με, ἀλλʼ εὐθέως ἀπῆλθον καὶ πορεύονται τῇ ὁδῷ ὑποδεικνύουσα αὐτοῖς ἐνλλάξις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/004.yaml
  text: But when those from the king stood by and said, “The spies of our land came in to you; bring them out, for the king so orders,” she answered, “The men whom you seek did indeed come in to me, but they immediately departed and are going on the road,” while she pointed them in another direction.
translation:
  language: zh_hans
  text: 王的人来到她那里，说：“我们这地的探子到你这里来了；把他们带出来，因为王这样命令。”她回答说：“你们所找的那些人的确到过我这里，但他们随即离开，正沿着那条路走。”说这话时，她却给他们指了另一个方向。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本末尾的用语形式不规则；其意思可能是“给他们指出相反的方向”或“误导他们往别处去”。
    reason: 提示源文本末语的文字与语义难点，同时保留她将追捕者指往别处这一叙事核心。
lexical_decisions:
- source_word: ἐπισταθέντων
  choice: 来到那里
  rationale: 该词在此表示王的人来到并站在现场；中文用“来到那里”自然呈现场景，又不额外强调原文未必着重的站立姿态。
- source_word: οἱ περὶ τοῦ βασιλέως
  choice: 王派来的人
  rationale: 指与王有关、奉王命而来的人；译为“王派来的人”符合下文传达王命的语境。
- source_word: κατάσκοποι
  choice: 探子
  rationale: 指秘密侦察土地的人；“探子”简明自然，并保留带敌意的指控口吻。
- source_word: ἐξάγαγε
  choice: 把他们交出来
  rationale: 字面为“把他们带出来”；在官差要求喇合交人的语境中，“交出来”更符合现代汉语表达，行动含义未变。
- source_word: ὑποδεικνύουσα αὐτοῖς ἐνλλάξις
  choice: 却给他们指了另一个方向
  rationale: 末语的传本形式不规则，但上下文明确表达她以指示误导追捕者，使其转往别处；译文保留这一动作及其反向意味。
theological_decisions:
- issue: 喇合的回答与误导行为是否加以道德评断
  choice: 只叙述她的言语和指向另一方向的行动
  alternative: 在正文中说明她欺骗了王的人，或为其行为作辩护
  rationale: 原文在本句中叙事而不明说伦理评价；译文不替作者消解有关谎言、忠诚与信心之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。对话简洁有力；“的确……但……”保留 μέν…ἀλλά 的转折结构。正文不增添伦理或神学评语。
