  text: Because of faith and hospitality, Rahab the prostitute was saved.
translation:
  language: zh_hans
  text: 妓女喇合因着信心和好客而得救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ πίστιν
  choice: 因着信心
  rationale: διά加宾格在此表达原因；“因着”自然保留信心作为得救缘由的表述。
- source_word: φιλοξενίαν
  choice: 好客
  rationale: 指接待并善待外来者或旅客；“好客”简洁、自然，也与上下文中喇合接待探子的传统相符。
- source_word: ἐσώθη
  choice: 得救
  rationale: 不定过去时被动语态，表示喇合获拯救；“得救”保留被动含义及可能兼具的现实与神学色彩。
- source_word: Ῥαὰβ ἡ πόρνη
  choice: 妓女喇合
  rationale: 以现代汉语自然同位结构表达，直译其身份称谓，不加缓和或解释。
theological_decisions:
- issue: 信心与好客同得救的关系
  choice: 保留“因着信心和好客而得救”的并列表述
  alternative: 将好客解释为信心的证明，译作“因信并因信而有的好客”
  rationale: 原文将πίστις与φιλοξενία并列置于διά之后，并未明确说明二者之间的逻辑层级，因此不在译文中加入解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；语序突出“妓女喇合”，同时完整保留原文的因果结构和身份称谓。
