  text: ὁρᾶτε, ἀγαπητοί, ὅτι οὐ μόνον πίστις, ἀλλὰ καὶ προφητεία ἐν τῇ γυναικὶ γέγονεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/008.yaml
  text: You see[a], beloved, that not only faith, but also prophecy came to be in the woman.
translation:
  language: zh_hans
  text: 亲爱的弟兄姊妹，你们看：在这女子身上，不但有信心，也有预言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾶτε
  choice: 你们看
  rationale: 保留第二人称复数命令式的劝请语气；在现代汉语中自然，并可引出下文的结论。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 该阳性复数称呼在共同体书信中泛指蒙爱的会众；译为“弟兄姊妹”明确其包容性，又保持教会书信的亲切庄重。
- source_word: πίστις
  choice: 信心
  rationale: 在此指女子所表现的信靠，与上下文所述行动相连；“信心”是自然且不预设额外教义含义的对应。
- source_word: προφητεία
  choice: 预言的恩赐
  rationale: 此处抽象名词表示先知性言说或预言能力；加“恩赐”使现代汉语顺畅，但不把具体内容限定为单纯预测未来。
- source_word: ἐν τῇ γυναικὶ γέγονεν
  choice: 这女子……有了
  rationale: γέγονεν为完成时，表达这些品质或能力已经在她身上形成并存在；“有了”兼顾结果状态与发生意味，也比生硬的“在女子里面成为了”自然。
theological_decisions:
- issue: προφητεία是一次预言行为，还是女子所具有的先知性能力
  choice: 预言的恩赐
  alternative: 预言
  rationale: 希腊语本身可指预言活动或预言能力；正文采用自然汉语表达其在女子身上出现的能力，脚注保留较形式对应的译法，避免把它限定为某种后世制度化职分。
- issue: γέγονεν的完成时应侧重产生还是存在
  choice: 有了
  alternative: 存在于这女子身上／在这女子身上产生了
  rationale: “有了”同时传达已经发生及当前具备的结果状态，不武断地只取“产生”或“存在”一端。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“亲爱的弟兄姊妹”自然呈现共同体称呼；正文避免欧化句式，并以脚注保存希腊语结构与词义的开放性。
