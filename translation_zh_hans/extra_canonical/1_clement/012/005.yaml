base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/005.yaml
  text: And she said to the men, “I know for certain that the Lord God is giving this land to you, for the fear and dread of you has fallen upon those who dwell in it. Therefore, when it comes about that you take it, preserve me and my father’s house.”
translation:
  language: zh_hans
  text: 她对那些男子说：“我确实知道，主上帝正把这地交给你们，因为你们的恐惧和战栗已经临到住在这地的人身上。因此，当你们取得这地时，请保全我和我父亲的家。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσα γινώσκω ἐγώ
  choice: 我确实知道
  rationale: 以现代汉语自然表达同源动词叠用及显式主语所构成的强调，避免生硬直译为“知道着我知道”。
- source_word: κύριος ὁ θεός
  choice: 主上帝
  rationale: 保留“主”与“上帝”两个称谓，符合原文定冠词结构所指向的独一神语境。
- source_word: παραδίδωσιν
  choice: 正把……交给
  rationale: 现在时可呈现正在发生或确定展开的行动；“交给”保留移交、交付之义。
- source_word: ὁ φόβος καὶ ὁ τρόμος
  choice: 恐惧战兢
  rationale: 以两个并列词保留原文 φόβος 与 τρόμος 的加强表达。
- source_word: ἐπέπεσεν
  choice: 已经……陷入
  rationale: 原义为恐惧“临到、落在”居民身上；汉语用“陷入”更自然，并以“已经”体现不定过去时所述的既成状态。
- source_word: τὸν οἶκον τοῦ πατρός μου
  choice: 我父亲全家
  rationale: οἶκος 在此指父亲的家属或家族，而非单指房屋；“全家”清楚传达所求保全的对象。
theological_decisions:
- issue: παραδίδωσιν 的时态与神圣行动
  choice: 正把这地交给你们
  alternative: 必把这地交给你们
  rationale: 保留希腊文现在时，不将其解释性地改成纯将来预言；同时呈现行动的确定性。
- issue: κύριος ὁ θεός 的称谓关系
  choice: 主上帝
  alternative: 上帝是主
  rationale: 原句中该词组作主语，意为“主上帝”，并非系词判断句；如此避免增加原文没有的命题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语保持恳求语气；“请保全”自然传达命令式 διασώσατε 在此语境中的请求功能。
