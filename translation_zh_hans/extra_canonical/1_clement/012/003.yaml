  text: So the hospitable Rahab welcomed them and hid them in the upper room under the stalks of flax[a].
translation:
  language: zh_hans
  text: 于是，那好客的喇合接待了他们，把他们藏在楼上房间的亚麻秆下面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，喇合作为一个好客的人，接待了他们……”。
    reason: 提示可将φιλόξενος转译为伴随性表达；正文则保留其称谓式定语功能。
lexical_decisions:
- source_word: φιλόξενος
  choice: 好客的
  rationale: 保留定冠词加形容词与专名构成的称谓式表达“好客的喇合”，而不改写成表示原因或伴随状态的分句。
- source_word: εἰσδεξαμένη
  choice: 接待了
  rationale: 该词表示迎入并接待；“接待”在现代汉语中自然，也与“好客”形成语义呼应。
- source_word: ὑπερῷον
  choice: 楼上的房间
  rationale: 指房屋上层的房间；如此译法比单说“楼上”更明确，又不强行断定具体建筑形式。
- source_word: λινοκαλάμην
  choice: 亚麻秆
  rationale: 复合词指亚麻的茎秆；结合藏人的场景，用集合意义的“亚麻秆”准确自然。
theological_decisions: []
