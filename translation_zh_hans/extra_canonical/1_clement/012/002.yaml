id: 1CLEM.12.2
reference: 1 Clement 12:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκπεμφθέντων γὰρ ὑπὸ Ἰησοῦ τοῦ τοῦ Ναυὴ κατασκόπων εἰς τὴν Ἰεριχώ, ἔγνω ὁ βασιλεὺς τῆς γῆς, ὅτι ἥκασιν κατασκοπεῦσαι τὴν χώραν αὐτῶν, καὶ ἐξέπεμψεν ἄνδρας τοὺς συλλημψομένους αὐτούς, ὅπως συλληφθέντες θανατωθῶσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/002.yaml
  text: For when spies had been sent out by Joshua son of Nun to Jericho, the king of the land learned that they had come to spy out their land, and he sent men to seize them, so that, once captured, they might be put to death.
translation:
  language: zh_hans
  text: 因为嫩的儿子约书亚派探子前往耶利哥以后，当地的王得知他们是来窥探他们的疆土，就派人去捉拿他们，好叫他们被捕后被处死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπεμφθέντων
  choice: 派……前往以后
  rationale: 以时间背景结构表达属格绝对结构，并保留“派出”的含义。
- source_word: Ἰησοῦ τοῦ τοῦ Ναυὴ
  choice: 嫩的儿子约书亚
  rationale: 此处Ἰησοῦ指旧约人物约书亚；“嫩的儿子”按现代中文惯用形式表达其父称。
- source_word: κατασκόπων / κατασκοπεῦσαι
  choice: 探子 / 窥探
  rationale: 分别保留名词和动词的词形呼应，同时使中文自然。
- source_word: ὁ βασιλεὺς τῆς γῆς
  choice: 当地的王
  rationale: 避免生硬的“那地的王”，自然表达该地统治者，且不把他具体化为经文未明说的“耶利哥王”。
- source_word: τὴν χώραν αὐτῶν
  choice: 他们的疆土
  rationale: 保留αὐτῶν“他们的”，并以“疆土”体现χώρα作为地域、领土的含义。
- source_word: τοὺς συλλημψομένους αὐτούς
  choice: 去捉拿他们
  rationale: 目的性分词以自然中文表达，保留派人实施抓捕的意图。
- source_word: ὅπως συλληφθέντες θανατωθῶσιν
  choice: 好叫他们被捕后处死
  rationale: 保留目的从句、被动语态以及先被捕再被处死的次序。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因为”承接上文的论证关系；句法略作汉语化调整，但保留原文事件次序、目的关系和两处“他们”所产生的指称结构。
