  text: 让我们来看果实：播种是怎样、以什么方式进行的？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβωμεν τοὺς καρπούς
  choice: 让我们看看果实
  rationale: λάβωμεν在此引入供观察的自然实例；καρπούς直译为“果实”。“让我们看看”比生硬的“让我们取果实”更符合现代汉语，同时不额外加入原文没有的“作为例子”。
- source_word: ὁ σπόρος
  choice: 播种
  rationale: σπόρος既可指种子，也可指播种行为；此处与下一节使用σπέρμα指具体种子形成对照，故采用事件义“播种”。
- source_word: πῶς καὶ τίνα τρόπον γίνεται
  choice: 是怎样进行的
  rationale: 两个近义疑问表达共同强调过程或方式；汉语合并为自然的“怎样”。γίνεται与事件名词“播种”搭配，译作“进行”。
