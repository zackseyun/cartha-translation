base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/001.yaml
  text: Let us consider, beloved, how the Master continually shows us that the future resurrection will take place, of which he made the Lord Jesus Messiah the firstfruits by raising him from the dead.
translation:
  language: zh_hans
  text: 亲爱的各位，让我们仔细想想：主宰怎样不断向我们显明，将来的复活将会发生；他藉着使主耶稣基督从死人中复活，立他为这将来的复活的初熟果子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατανοήσωμεν
  choice: 让我们思想一下
  rationale: 表达劝勉式第一人称复数，并体现“认真留意、思考”的含义，符合现代汉语表达。
- source_word: ἀγαπητοί
  choice: 亲爱的各位
  rationale: 保留亲切称呼，同时避免把原文阳性复数在混合群体中的惯常用法不必要地限定为男性。
- source_word: ὁ δεσπότης
  choice: 主宰
  rationale: 与后文κύριον“主”作适当区分，并传达δεσπότης所含的权柄与统治意味。
- source_word: τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι
  choice: 将来的复活必会发生
  rationale: 按希腊语不定式结构自然表达未来复活将成为事实，避免机械重复“将要……将会是”。
- source_word: τὴν ἀπαρχήν
  choice: 初熟的果子
  rationale: 保留献上初熟果实这一具体喻象，也传达基督的复活是后来复活之开端与保证的语境意义。
- source_word: Ἰησοῦν Χριστόν
  choice: 耶稣基督
  rationale: 采用现代汉语基督教文献中Χριστός作为称号及专名的通行译法，不额外改写为解释性称谓。
theological_decisions:
- issue: 基督与未来复活的关系
  choice: 以他作为这复活初熟的果子
  alternative: 使他成为复活者中的第一位
  rationale: 原文采用ἀπαρχή“初熟果子”的祭献及收成意象；正文保留该隐喻，不将其窄化为单纯的时间先后。
- issue: “主宰”所显明的复活是否确定会发生
  choice: 必会发生
  alternative: 将会发生
  rationale: ἔσεσθαι明确断言未来复活将成为事实；“必会”在汉语中自然体现该断言，但不进一步解释复活的方式或范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以冒号和分号梳理原文长句的劝勉、陈述和说明关系；保留“主宰／主”的词汇区分及“初熟果子”的圣经性意象。
