revisions:
- from: 撒种的人出去，把各样种子撒在地里；这些种子落在地里时，既干枯又赤裸，便腐解了。随后，主宰护理的大能使它们从腐解中复起；又从那一个长出许多个，并结出果实。[a]
  to: 撒种的人出去，把每一粒种子撒在地里；这些种子落在地里，干枯而裸露，便腐解。随后，主宰护理的伟大使它们从这腐解中复起；由那一粒种子生长出许多来，并结出果实。[a]
  rationale: 改正“每一粒”被误译为“各样”的实质性语义问题；以更贴合种子意象的措辞修订“赤裸”；并更直接反映“主宰之护理的伟大”。正文按中性复数主语的自然分析译出，脚注保留另一可能分析，符合在有争议处保留歧义的原则。
