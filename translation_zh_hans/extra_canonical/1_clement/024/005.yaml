id: 1CLEM.24.5
reference: 1 Clement 24:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξῆλθεν ὁ σπείρων καὶ ἔβαλεν εἰς τὴν γῆν ἕκαστον τῶν σπερμάτων, ἅτινα πεσόντα εἰς τὴν γῆν ξηρὰ καὶ γυμνὰ διαλύεται· εἶτʼ ἐκ τῆς διαλύσεως ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου ἀνίστησιν αὐτά, καὶ ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/005.yaml
  text: The sower went out and cast each of the seeds into the ground; these[a], when they fall into the ground, dry and bare, decay. Then from that decay the greatness of the Master's providence raises them up, and from one it increases many and brings forth fruit.
translation:
  language: zh_hans
  text: 撒种的人出去，把每一粒种子撒在地里；这些种子落在地里，干枯而裸露，便腐解。随后，主宰护理的伟大使它们从这腐解中复起；由那一粒种子生长出许多来，并结出果实。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译作：“从那一粒种子，主宰护理的伟大使许多个生长，并结出果实。”希腊文πλείονα可理解为中性复数主语（中性复数主语常配单数动词），也可理解为动词的宾语。
    reason: 保留末句主语分析的语法歧义，同时不使脚注中的替代译法取代正文较顺畅的一／多对照。
lexical_decisions:
- source_word: ὁ σπείρων
  choice: 撒种的人
  rationale: 保留分词名词化的普通意义，表达自然，也呼应耶稣撒种比喻的传统措辞。
- source_word: ἔβαλεν
  choice: 撒
  rationale: 字面可作“投、丢”，但在种子和土地的语境中，现代汉语以“撒”最自然。
- source_word: ξηρὰ καὶ γυμνὰ
  choice: 既干枯又赤裸
  rationale: 分别保留“干的”和“裸露的”两个形容词；“赤裸”在此描写没有外在生机或装饰的种子，避免弱化原文鲜明意象。
- source_word: διαλύεται / διαλύσεως
  choice: 腐解了／腐解
  rationale: 同一词根前后照应，兼顾“分解、消解”与种子腐败的自然过程；不译成完全消灭，以免与随后复起的意象冲突。
- source_word: ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου
  choice: 主宰护理的大能
  rationale: 以自然汉语表达“主宰之护理的伟大”；“主宰”保留 δεσπότης 的权柄色彩，“护理”表达 πρόνοια 的照管与安排，“大能”传达 μεγαλειότης 在此所强调的伟大效力。
- source_word: ἀνίστησιν αὐτά
  choice: 使它们……复起
  rationale: 保留使役语态及“起来、复起”的复活联想，又不直接译成“使其复活”，以免把种子比拟过早定为严格的教义陈述。
- source_word: ἐκ τοῦ ἑνὸς πλείονα
  choice: 从那一个长出许多个
  rationale: 保留定冠词所形成的“那一个”与“许多个”的对照，并将 πλείονα 理解为中性复数主语。
- source_word: ἐκφέρει καρπόν
  choice: 结出果实
  rationale: 这是植物语境中自然且准确的表达，也保留 καρπόν 的单数集合意义。
theological_decisions:
- issue: ἀνίστησιν 的复活含义
  choice: 复起
  alternative: 使它们复活
  rationale: 本段以种子的自然过程论证复活；“复起”既保留词语与复活主题的联系，又不把植物现象直接等同于人的复活。
- issue: 末句 αὔξει 与 ἐκφέρει 的主语
  choice: 把 πλείονα 理解为中性复数主语：“许多个长出并结果”
  alternative: 把“主宰护理的大能”视为省略的主语：“使许多个增长并带出果实”
  rationale: 希腊语中性复数主语常配单数动词，因此 πλείονα 可自然支配 αὔξει 和 ἐκφέρει；这也使“从那一个”与“许多个”的对照清楚。不过格位和单数动词容许另一分析，故以脚注保留。
- issue: δεσπότης 的称谓
  choice: 主宰
  alternative: 主人／主
  rationale: “主宰”较能保存该词所含的所有权与绝对权柄，同时避免在此将其无标记地等同于常见神名译法“主”。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。句法保留原文从撒种、腐解到复起、结果的递进；“各样种子”“护理的大能”“复起”等措辞兼顾普通读者可懂性与早期基督教复活论证的修辞力度。
