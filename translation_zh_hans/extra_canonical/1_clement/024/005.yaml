  terminology: “主宰”可体现δεσπότης的权柄意味；“护理”可译πρόνοια。将“护理的大能”调整为“护理的伟大”，避免把μεγαλειότης具体化、强化为原文未明说的“大能”。“复起”适合本段以种子说明复活的论证，并避免过度释义。
