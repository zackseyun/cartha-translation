  text: ἡμέρα καὶ νὺξ ἀνάστασιν ἡμῖν δηλοῦσιν· κοιμᾶται ἡ νύξ, ἀνίσταται ἡ ἡμέρα· ἡ ἡμέρα ἄπεισιν, νὺξ ἐπέρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/003.yaml
  text: 'Day and night show us a resurrection: the night falls asleep[a], the day rises; the day departs, night comes.'
translation:
  language: zh_hans
  text: 白昼和黑夜向我们显明复活：黑夜睡去，白昼起来；白昼离去，黑夜来临。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρα καὶ νὺξ
  choice: 白昼和黑夜
  rationale: 这里指昼夜交替的自然现象；“白昼和黑夜”比单用“日夜”更能保留二者并列、拟人化的画面。
- source_word: ἀνάστασιν
  choice: 复活
  rationale: 该词在上下文中以昼夜循环作为复活的类比；直译“复活”既保留其神学含义，也不把不定形式过度解释为某一次特定事件。
- source_word: κοιμᾶται
  choice: 睡去
  rationale: 保留原文将黑夜人格化为“睡眠”的意象，并与随后“起来”形成呼应。
- source_word: ἀνίσταται
  choice: 起来
  rationale: 该动词可指起身，也与“复活”有词义关联；译作“起来”自然地描写白昼出现，同时保留与复活主题的隐约联系。
- source_word: ἄπεισιν
  choice: 离去
  rationale: 准确表达白昼退去、消逝的动态。
- source_word: ἐπέρχεται
  choice: 来临
  rationale: 表达黑夜随之到来；“来临”符合现代汉语书面表达，并保留原文的动态感。
theological_decisions:
- issue: ἀνάστασιν是否具体化为末日复活或某一次复活
  choice: 仅译作“复活”
  alternative: “一次复活”或“末日的复活”
  rationale: 希腊文在此未限定为某一次特定事件，也未明说末日；保持概括表达可避免加入原文没有的神学限定。
- issue: ἀνίσταται与ἀνάστασιν的词义呼应
  choice: 分别译为“起来”和“复活”
  alternative: 将ἀνίσταται也译为“复起”或“复活”
  rationale: “起来”既符合白昼出现的自然画面，也在汉语中保留一定呼应；若译成“复活”，会使拟人比喻过度实体化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。四个短分句不加连接词，以保留希腊原文省略连词所形成的明快节奏和鲜明对照。
