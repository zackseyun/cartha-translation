  language: zh_hans
  text: 亲爱的各位，让我们看看那在适当时节发生的复活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: 让我们看看
  rationale: 保留第一人称复数劝勉语气，并以现代汉语自然表达“观察、留意”。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 该复数称呼指受信群体；补出“弟兄姊妹”使现代中文称谓自然且具包容性，同时传达“蒙爱者/亲爱的各位”之意。
- source_word: τὴν ... ἀνάστασιν
  choice: 复生
  rationale: 此处承接对自然界周期性复苏的论述，用“复生”既保留“重新起来、恢复生命”的核心语义，也避免在本句中先行限定为末日身体复活。
- source_word: κατὰ καιρὸν γινομένην
  choice: 按时发生的
  rationale: κατὰ καιρόν表示依着适当或应有的时节；“按时”简洁自然，不额外加入原文没有的所属或明确指定者。
theological_decisions:
- issue: ἀνάστασις在本句中是自然界复苏还是末日复活术语
  choice: 译作“复生”，保留它与复活主题的联系及上下文中的类比张力
  alternative: 译作“复活”
  rationale: “复活”在现代基督教中文中容易被专指死者末日复活；本段此句引入按季节出现的自然现象，“复生”较能保留语义开放性，而不消除其神学类比。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。句式紧贴希腊文结构，但将呼语自然置于句首；无脚注标记。
