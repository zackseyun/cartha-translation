  text: Τούτοις τοῖς ἀνδράσιν ὁσίως πολιτευσαμενοις συνηθροίσθη πολὺ πλῆθος ἐκλεκτῶν, οἵτινες πολλαῖς αἰκίαις καὶ βασάνοις διὰ ζῆλος παθόντες ὑπόδειγμα κάλλιστον ἐγένοντο ἐν ἡμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/001.yaml
  text: To these men, who had conducted themselves in holiness, there was gathered a great multitude of the elect, who, having suffered many outrages and tortures because of jealousy, became a most beautiful example among us.
translation:
  language: zh_hans
  text: 有一大群蒙拣选的人被聚集到这些过着圣洁生活的人那里；他们因嫉妒遭受许多凌辱和酷刑[a]，成为我们中间最美的典范。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们因嫉妒而遭受许多凌辱和酷刑。”
    reason: 保留英语审校记录所标示的另一种语序；两种译法均将διὰ ζῆλος理解为受苦的原因，且不指明嫉妒者。
lexical_decisions:
- source_word: ὁσίως πολιτευσαμενοις
  choice: 以圣洁为人处世
  rationale: πολιτεύομαι在此指生活、行事为人；ὁσίως表示合乎圣洁、虔敬地。译文兼顾其生活实践意味与庄重语体。
- source_word: συνηθροίσθη
  choice: 与他们聚在一起
  rationale: 该被动动词表示被聚集、集合；保留被动含义，同时使中文句法自然。
- source_word: πλῆθος ἐκλεκτῶν
  choice: 一大群蒙拣选的人
  rationale: πλῆθος表示众多的人群，ἐκλεκτῶν是名词化形容词，直指被拣选者；不额外限定其群体身份。
- source_word: αἰκίαις
  choice: 凌辱
  rationale: αἰκία可涵盖虐待、侮辱及暴行；与βασάνοις并列时译作“凌辱”，既保留受辱意味，也避免与“酷刑”完全重叠。
- source_word: βασάνοις
  choice: 酷刑
  rationale: 该词在受迫害语境中指折磨或严刑拷打，译作“酷刑”简洁明确。
- source_word: διὰ ζῆλος
  choice: 因嫉妒
  rationale: 原文ζῆλος的形式可能是通行希腊语中的非标准用法，语境表示致因；ζῆλος在本段承接嫉妒所引发的迫害。
- source_word: ὑπόδειγμα κάλλιστον
  choice: 极美的榜样
  rationale: 保留κάλλιστον的最高级审美措辞，而不弱化为一般的“极好”。
- source_word: ἐν ἡμῖν
  choice: 在我们中间
  rationale: 直译其群体内部的关系表达，不擅自改成“给我们”或“对我们而言”。
theological_decisions:
- issue: ἐκλεκτῶν所指群体的身份
  choice: 蒙拣选的人
  alternative: 选民
  rationale: “蒙拣选的人”保留原文的被拣选含义，又不预先规定其系统神学身份或范围。
- issue: διὰ ζῆλος中“嫉妒”的施事者
  choice: 仅译“因嫉妒”，不说明是谁嫉妒
  alternative: 因他人的嫉妒
  rationale: 原文未明说嫉妒者，故保留施事者不确定性。
- issue: 所受苦难与“嫉妒”的句法关系
  choice: 正文将“因嫉妒”理解为遭受凌辱和酷刑的原因
  alternative: 将“因嫉妒”更宽泛地连接于整个受苦事件
  rationale: διά加宾格通常表示原因；但词序允许略有不同的修辞侧重，因此以脚注保留较贴近原词序的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“为人处世”自然表达πολιτεύομαι的生活实践含义；分号帮助呈现长句结构。所有代词均按原文保持群体指向，不增补性别或身份说明。
