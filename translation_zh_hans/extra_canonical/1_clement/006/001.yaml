  naturalness: “以圣洁为人处世的男子”略显生硬；“过着圣洁生活的人”更合现代庄重书面语。“最美的典范”比“极美的榜样”更自然，同时保留κάλλιστον的最高级和审美色彩。
  terminology: 保留“蒙拣选的人”，不将其教义化为“选民”。“凌辱和酷刑”能分别对应αἰκίαις与βασάνοις。“因嫉妒”不补出嫉妒者，符合原文的未明指性。
