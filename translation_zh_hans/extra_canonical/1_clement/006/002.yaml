base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/002.yaml
  text: Because of jealousy, women were persecuted as Danaids and Dircae; after suffering terrible and unholy outrages, they safely reached the goal of the faith and received a noble reward, though weak in body.
translation:
  language: zh_hans
  text: 因嫉妒，妇女们遭受迫害，被当作达那伊得斯和狄耳刻[a]；她们受尽可怕而亵渎的凌辱[b]，却跑完了信仰坚定不移的赛程，赢得了高贵的奖赏——尽管她们身体柔弱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“妇女们——达那伊得斯和狄耳刻——遭受迫害”。“达那伊得斯”是希腊神话中达那俄斯的女儿们；“狄耳刻”则是神话中遭受惨烈处刑的女子。这里可能指受迫害的妇女在公开刑罚或表演中被扮作这些神话人物，但原文没有明说。
    reason: 说明古典典故，并保留并置句法所造成的历史解释不确定性。
  - marker: b
    text: 所给希腊文转录在此作“可怕而勇武的”，语意异常；常见文本作“可怕而亵渎的”。本译文依后者译出。
    reason: 如实标示所给转录与通行读法之间的重要文本差异，避免把不确定读法静默处理。
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: 因嫉妒
  rationale: ζῆλος在本章反复指造成迫害与纷争的嫉妒；原文格形不规则，但因果关系明确。
- source_word: γυναῖκες Δαναΐδες καὶ Δίρκαι
  choice: 妇女们……被当作达那伊得斯和狄耳刻
  rationale: 希腊文以神话人物名称与“妇女们”并置，可能指受刑者在公开表演中被装扮或当作这些人物；正文采用通顺而审慎的表达，并以脚注保留句法和历史所指的不确定性。
- source_word: αἰκίσματα
  choice: 凌辱
  rationale: 该词指残酷虐待、摧残或侮辱性暴行；“凌辱”兼顾身体折磨和羞辱性质。
- source_word: τὸν τῆς πίστεως βέβαιον δρόμον κατήντησαν
  choice: 跑完了信仰坚定不移的赛程
  rationale: δρόμος具有道路或赛程意象，κατήντησαν表示抵达；译文以“跑完”自然表达坚持到底并到达终点，同时保留竞赛隐喻。
- source_word: γέρας γενναῖον
  choice: 高贵的奖赏
  rationale: γέρας是荣誉、奖品或赏赐，γενναῖον指高贵、卓越；结合赛程意象译作“高贵的奖赏”。
- source_word: αἱ ἀσθενεῖς τῷ σώματι
  choice: 尽管她们身体柔弱
  rationale: 原文以同位结构强调这些女子身体上的软弱，与其忍受苦难并得奖赏形成反差；用让步句自然再现这种张力。
theological_decisions:
- issue: “信仰的赛程”是否应明确解释为殉道得救之路
  choice: 保留“信仰……赛程”的比喻，不进一步界定其教义含义
  alternative: 译成“安全抵达得救的终点”或“完成殉道之路”
  rationale: 原文强调在苦难中坚守信仰并获得奖赏，但没有明确使用“得救”或“殉道”一词；避免加入超出文本的教义解释。
- issue: 女性“身体柔弱”的表述
  choice: 按原文保留，并以“尽管”呈现修辞反差
  alternative: 弱化为“她们虽处于弱势”
  rationale: τῷ σώματι明确指身体；这是古代作者的修辞判断，翻译不应删改，也不应扩展成关于女性本质的普遍教义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“赛程—奖赏”保持原文连贯的竞赛意象；破折号突出末句“身体柔弱”与前文坚忍得胜之间的反差。神话人物采用音译，并用脚注解释，正文不作过度历史重构。
