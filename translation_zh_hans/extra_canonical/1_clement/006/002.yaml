review_pass:
  verdict: revise
  source_fidelity: 正文将 γυναῖκες Δαναΐδες καὶ Δίρκαι 译为“被当作”神话人物，较原文的并置结构多加了扮演／处刑方式的断定。并且所给希腊文作 αἰκίσματα δεινὰ καὶ ἀνδρία；草稿正文采用“亵渎的”，实际是依常见异读（或校勘读法）ἀνόσια，而非逐字反映所给底本。应在正文保留此处的文本不确定性，并在注释中说明。
  naturalness: “跑完了信仰坚定不移的赛程”在汉语中会使“坚定不移”看似直接修饰“信仰”，且把“抵达”明确化为“跑完”。改为“走到了信仰坚稳的路程终点”较清楚地保留道路／赛程意象及完成、抵达的含义。
  terminology: “达那伊得斯”和“狄耳刻”可保留音译。以破折号保持原文中妇女与这些名称的并置，不把其历史所指、是否为表演角色或绰号写死。“奖赏”“身体柔弱”均恰当。
  issues:
  - severity: medium
    issue: “被当作达那伊得斯和狄耳刻”把原文并置句法具体化为扮作或视作神话人物。
    rationale: γυναῖκες 与 Δαναΐδες、Δίρκαι之间没有明示“当作”一类动词；其确切历史所指存在争议，应保留。
  - severity: high
    issue: 正文“亵渎的”未反映所给希腊文的 ἀνδρία。
    rationale: “亵渎的”对应常见的 ἀνόσια 读法，而非任务所提供的转录。可采纳通行读法，但必须在正文中显示不确定性，或改按所给读法作审慎译法；不可仅在脚注承认而在正文静默采用。
  - severity: low
    issue: “跑完了信仰坚定不移的赛程”措辞略显歧义。
    rationale: βέβαιον修饰 δρόμον；调整语序可使“坚稳”明确修饰信仰的道路／赛程。
  revised_text: 因嫉妒，妇女们——达那伊得斯和狄耳刻[a]——遭受迫害；她们忍受了可怕而〔原文此处有异文〕的折磨[b]，走到了信仰坚稳的路程终点，虽身体柔弱，却获得了高贵的奖赏。
  revised_footnotes:
  - marker: a
    text: 原文将“妇女们”与“达那伊得斯、狄耳刻”并置。达那伊得斯是希腊神话中达那俄斯的女儿们；狄耳刻是神话中的女子，传说遭受惨烈处刑。这可能暗指受迫害妇女在公开刑罚或表演中所扮的角色，也可能另有所指；原文没有明说。
    reason: 说明古典典故，并保留并置句法及历史所指的不确定性。
  - marker: b
    text: 所给希腊文转录作“可怕而勇武的／有勇气的”（ἀνδρία），与“折磨”连用时语意不甚明确；常见文本作“可怕而亵渎的”（ἀνόσια）。因此正文不在未注明的情况下采用后者，并标示此处的文本问题。
    reason: 使正文忠于所给底本，同时如实标明通行读法与所给转录之间的重要差异。
  revision_rationale: 修订避免将神话名称的并置结构解释为明确的“被当作”，并把所给希腊文与通行异读之间的差异从静默的正文取舍改为可见的文本不确定性。赛程比喻亦调整为更自然、且更贴近“抵达坚稳道路”的汉语表达。
