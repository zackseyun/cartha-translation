review_pass:
  verdict: revise
  source_fidelity: 草稿将原文的神话名称并置结构解释为“被当作”，这一历史重构虽有可能，却超出原文明确所说。更重要的是，所给希腊文作“可怕而勇武的凌辱”（δεινὰ καὶ ἀνδρία），草稿正文却按另一常见读法译为“可怕而亵渎的凌辱”；应在正文及脚注中明确保留这一异文/转录问题，不能无提示地以通行读法替代所给底本。κατήντησαν是“抵达、达到”，不宜直接译作“跑完”。
  naturalness: 修订以“妇女们——达那伊得斯和狄耳刻——”保留原文的同位并置，同时用脚注说明其所指未定。“抵达了信仰那稳固道路的终点”在现代汉语中较顺畅，并保留道路／竞赛的比喻及“抵达”的动词意义。
  terminology: 保留“嫉妒”“信仰”“奖赏”等本段一致的表达。神话名称音译为“达那伊得斯”和“狄耳刻”。“身体柔弱”准确反映τῷ σώματι，且不将古代修辞泛化为现代判断。
  issues:
  - severity: high
    issue: 正文未按所给希腊文的ἀνδρία翻译，却采用“亵渎的”读法。
    rationale: 所给底本与常见文本在此明显不同。即使判断为转录或异文，也须在译文中保留不确定性，不能将通行读法静默置换为底本文字。
  - severity: medium
    issue: “被当作达那伊得斯和狄耳刻”将并置名称确定解释为扮演或被视作神话人物。
    rationale: γυναῖκες与Δαναΐδες、Δίρκαι的关系历来有历史解释空间；正文应保留并置，解释置于脚注。
  - severity: medium
    issue: “跑完了……赛程”把κατήντησαν的“抵达／达到”强化为完成赛跑。
    rationale: 原文确有δρόμος的道路或赛程意象，但动词本身主要表示到达；修订应避免增加“跑完”的动作细节。
  revised_text: 妇女们——达那伊得斯和狄耳刻——因嫉妒受到迫害[a]；她们遭受了可怕而“勇武的”凌辱[b]，却抵达了信仰那稳固道路的终点，并获得了高贵的奖赏，尽管她们身体柔弱。
  revised_footnotes:
  - marker: a
    text: 原文将“妇女们”与“达那伊得斯和狄耳刻”并置。达那伊得斯是希腊神话中达那俄斯的女儿们；狄耳刻是神话人物。此处可能指在公开惩罚或表演中与这些人物相关的受害妇女，但原文没有明说具体关系。
    reason: 说明古典典故，并避免将原文并置结构确定译为“被当作”或“扮作”。
  - marker: b
    text: 所给希腊文转录作“可怕而勇武的”（δεινὰ καὶ ἀνδρία）；这一搭配在语境中不寻常。常见文本则作“可怕而亵渎的”。正文按所给转录保留“勇武的”并加引号，未在无明确底本校勘依据下静默改从常见读法。
    reason: 如实标示所给转录与常见文本的关键差异，并保留文本不确定性。
  revision_rationale: 修订优先遵循所提供的希腊文，同时以脚注交代其与常见读法的差异。删除对神话名称关系的过度断定，调整“跑完”为“抵达……终点”，使汉语自然且更贴近κατήντησαν。
