base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/004.yaml
  text: Because of jealousy and strife, great cities have been overthrown and great nations uprooted.
translation:
  language: zh_hans
  text: 嫉妒和纷争摧毁了大城，也把强大的民族连根拔起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 结合本章反复列举其破坏性后果的语境，此处表示负面的嫉妒或妒忌，而非正面的热心。
- source_word: ἔρις
  choice: 纷争
  rationale: 准确表达争竞、冲突之意，并与“嫉妒”自然并列。
- source_word: πόλεις μεγάλας
  choice: 大城
  rationale: 保留原文“伟大／规模宏大的城市”之意，以简洁庄重的现代汉语表达。
- source_word: κατέστρεψεν
  choice: 摧毁了
  rationale: 原文为主动形式，主语是并列的“嫉妒和纷争”；译作“摧毁”自然呈现城市遭毁灭或倾覆的意思。
- source_word: ἔθνη μεγάλα
  choice: 强大的民族
  rationale: ἔθνη 可指民族或邦国；此处与“连根拔起”的比喻搭配，译作“民族”较自然，而 μεγάλα 在此可含强盛之意。
- source_word: ἐξερίζωσεν
  choice: 连根拔起
  rationale: 保留原文生动的“拔根”隐喻，表达一个民族被彻底铲除。
theological_decisions:
- issue: ζῆλος 的褒贬含义
  choice: 嫉妒
  alternative: 热心／嫉恨
  rationale: 上下文将 ζῆλος 视为迫害、离间和毁灭的根源，负面义明确；“嫉妒”是现代汉语中最清楚且不过度诠释的对应。
- issue: 句子的因果关系
  choice: 用主语结构直译为“嫉妒和纷争摧毁了……”
  alternative: “由于嫉妒和纷争……”
  rationale: 所给希腊文本第4句没有 διὰ，而是 ζῆλος καὶ ἔρις 作主语，两个动词也是主动单数；因此不补入显式的“由于”，以忠实保存原句语法和修辞。
- issue: ἔθνη 的指称范围
  choice: 民族
  alternative: 国家／万族
  rationale: 原词语义可涵盖民族、族群或邦国；“民族”既保留其广度，也避免把古代概念过度现代化为民族国家。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留原文的主动因果表达和“连根拔起”的强烈意象；“也”呈现两个并列后果，不增加原文没有的神学解释。
