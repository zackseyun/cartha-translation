base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/003.yaml
  text: 'Jealousy estranged wives from their husbands and altered what was spoken by our father Adam: “This now is bone from my bones and flesh from my flesh.”'
translation:
  language: zh_hans
  text: 嫉妒使妻子与丈夫疏远，也改变了我们祖先亚当所说的话：“这一次，是我骨中的骨、肉中的肉。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一次”也可译作“如今”；此处引自《创世记》2:23。
    reason: 说明Τοῦτο νῦν的另一种自然译法，并标明引文出处。
lexical_decisions:
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 本段反复列举其破坏性后果，语境明确指负面的妒忌，而非正面的热忱。
- source_word: ἀπηλλοτρίωσεν
  choice: 使……疏远
  rationale: 保留该动词造成关系离异、隔绝的含义，同时避免把程度具体化为原文未明说的离婚。
- source_word: γυναῖκας ἀνδρῶν
  choice: 妻子与丈夫
  rationale: 在亚当关于婚姻结合之话的引文语境中，关系义译为夫妻最自然；希腊语结构直译为“女人与男人”。
- source_word: ἠλλοίωσεν
  choice: 改变了
  rationale: 忠实表达‘使变样、改变’，并保留作者未进一步说明改变方式的含混性。
- source_word: πατρὸς ἡμῶν Ἀδάμ
  choice: 我们祖先亚当
  rationale: πατήρ 在此指人类共同先祖；现代汉语用‘祖先’比‘父亲’更清楚自然。
- source_word: Τοῦτο νῦν
  choice: 这是
  rationale: 对应《创世记》引文；νῦν 可有‘这一次/如今’之意，但在汉语正文中省去生硬的时间副词，并以脚注提示。
theological_decisions:
- issue: 亚当之言被‘改变’的含义
  choice: 不解释嫉妒具体怎样改变了这句话
  alternative: 解释为嫉妒破坏了婚姻中‘二人成为一体’的合一
  rationale: 原文只说‘改变了所说的话’，没有明言机制；正文保留其修辞张力，避免加入解释性神学。
- issue: 亚当的身份称谓
  choice: 我们祖先亚当
  alternative: 我们的父亲亚当
  rationale: 既传达人类共同源自亚当的观念，又符合现代普通话表达，不引入特定宗派立场。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式尽量贴近希腊文的因果推进；引文使用现代汉语中熟悉的圣经措辞，但不依赖某一特定中文译本。
