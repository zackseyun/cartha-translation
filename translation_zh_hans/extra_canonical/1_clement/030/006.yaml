  text: Let our praise be in God and not from ourselves, for God hates those who praise themselves.
translation:
  language: zh_hans
  text: 我们的夸耀，应当在上帝里面，不要出于我们自己；因为上帝恨恶自夸的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔπαινος ἡμῶν
  choice: 我们所夸的
  rationale: 保留“我们的夸赞/称赞”这一名词性表达，同时使现代汉语自然；结合后文“自我夸赞的人”，这里指夸耀的内容或根据。
- source_word: ἐν θεῷ
  choice: 在于上帝
  rationale: 较直接地保留介词ἐν的表达，并传达夸赞应以、归于上帝为中心，而不把含义收窄为单一解释。
- source_word: μὴ ἐξ αὐτῶν
  choice: 不可出于自己
  rationale: 保留ἐκ所表达的来源意义，并依照主语“我们”将第三人称反身形式自然译为“自己”。
- source_word: αὐτεπανέτους
  choice: 自我夸赞的人
  rationale: 该词指称赞或夸耀自己的人；译文既对应词义，也与前半句形成清楚呼应。
- source_word: μισεῖ
  choice: 恨恶
  rationale: 准确保留强烈的憎恶语气，同时符合庄重的经文语体。
theological_decisions:
- issue: 夸赞“在上帝里面”的含义
  choice: 在于上帝
  alternative: 归给上帝／以上帝为夸耀
  rationale: 原文ἐν θεῷ可涉及夸赞的范围、根据或对象；“在于上帝”保留一定开放性，避免只解释为把称赞归给上帝或以上帝为自夸。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“当……不可……”保留劝勉语气；分号呈现原文命令与理由之间的结构。
