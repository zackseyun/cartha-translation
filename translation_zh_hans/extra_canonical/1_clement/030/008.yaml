  text: θράσος καὶ αὐθάδεια καὶ τόλμα τοῖς κατηραμένοις ὑπὸ τοῦ θεοῦ· ἐπιείκεια καὶ ταπεινοφροσύνη καὶ πραΰτης παρὰ τοῖς ηὐλογημένοις ὑπὸ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/008.yaml
  text: Insolence and arrogance and recklessness belong to those cursed by God[a]; but gentleness and humility and meekness are found among those blessed by God.
translation:
  language: zh_hans
  text: 放肆[a]、傲慢和鲁莽，是受神咒诅之人的特征；宽厚、谦卑和柔和，是蒙神赐福之人的特征。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“胆大”；此处带贬义，指放肆逾越的胆量。
    reason: θράσος可有“胆大”之基本义，但本句置于恶行清单中，含贬义。
lexical_decisions:
- source_word: θράσος
  choice: 狂妄
  rationale: 该词在此恶行清单中指过度而无耻的胆量或放肆，不是值得称许的勇敢；“狂妄”既保留“胆大”的成分，也明确表达其负面含义。
- source_word: αὐθάδεια
  choice: 傲慢
  rationale: 此词表示自以为是、任性自负的态度；“傲慢”在现代汉语中自然地概括其负面人格特征。
- source_word: τόλμα
  choice: 妄为
  rationale: 在与前两个贬义词并列时，该词不是中性的勇气，而是鲁莽冒进、胆敢做不当之事；“妄为”符合此处语境。
- source_word: ἐπιείκεια
  choice: 宽厚
  rationale: 该词可指温和、宽容、不苛刻；“宽厚”能与后面的谦卑和温柔区分，同时保留待人宽和的意味。
- source_word: ταπεινοφροσύνη
  choice: 谦卑
  rationale: 准确表达卑己、不自高的心态，并符合早期基督教伦理语境。
- source_word: πραΰτης
  choice: 温柔
  rationale: 表达柔和、克制而非软弱，是现代中文读者熟悉且贴切的对应词。
theological_decisions:
- issue: ὑπὸ τοῦ θεοῦ 所表达的施事关系
  choice: 被神咒诅／蒙神赐福
  alternative: 受神咒诅／受神祝福
  rationale: 保留神作为咒诅与赐福之施事者的明确表达，不将其弱化为一般状态；两句采用平行而自然的现代汉语。
- issue: τοῖς／παρὰ τοῖς 与品格特征的关系
  choice: 见于……的人
  alternative: 属于……的人
  rationale: 原文前半仅用与格，后半用 παρά 加与格，均可表达这些特征存在于相应人群之中；“见于”既自然又避免把关系过度界定为所有权。
translation_notes:
  register: 采用现代、庄重而易懂的伦理劝诫语体；两半句保持对称结构，并以“见于”呈现原文省略系词的名词句式。
