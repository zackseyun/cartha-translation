  text: Ἅγια οὖν μερὶς ὑπάρχοντες ποιήσωμεν τὰ τοῦ ἁγιασμοῦ πάντα, φεύγοντες καταλαλιάς, μιαράς τε καὶ ἀνάγνους συμπλοκὰς, μέθας τε καὶ νεωτεροποιΐας καὶ βδελυκτὰς ἐπιθυμίας, μυσερὰν μοιχείαν, βδελυκτὴν ὑπερηφανίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/001.yaml
  text: Therefore, since we are a holy portion, let us do all the things that belong to sanctification, fleeing slanders, foul and unclean entanglements, drunkenness and seditions, and detestable desires, loathsome adultery, detestable pride.
translation:
  language: zh_hans
  text: 所以，我们既是圣洁的一份，就当行一切合乎圣洁的事，远避种种毁谤、污秽不洁的结合[a]、醉酒和作乱，以及可憎的欲望、可恶的奸淫、可憎的骄傲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结合”所译的希腊词也可指纠缠或相抱；上下文表明其具有负面的道德意味，但未明确限定为某一种具体的结合。
    reason: 原词συμπλοκή的语义范围较宽；修订正文避免将其预先限定为不正当性关系，同时保留上下文的负面评价。
lexical_decisions:
- source_word: ἅγια μερίς
  choice: 圣洁的一分
  rationale: 保留“部分、分有”的比喻，不将其具体化为某一特定教会论概念。
- source_word: τὰ τοῦ ἁγιασμοῦ πάντα
  choice: 一切合乎圣洁的事
  rationale: 以自然汉语表达所有属于成圣或圣洁范畴之事，同时避免把抽象名词处理成宗派化术语。
- source_word: καταλαλιάς
  choice: 种种毁谤
  rationale: καταλαλιάς为复数；“种种”在汉语中自然体现其复数含义。
- source_word: συμπλοκάς
  choice: 苟合
  rationale: 该词本义涉及缠结、相抱或结合；结合μιαράς与ἀνάγνους的道德语境，正文采用指向不洁结合的“苟合”，并以脚注保留词义范围。
- source_word: νεωτεροποιΐας
  choice: 作乱
  rationale: 此词可指制造动乱、叛乱或煽动变革；“作乱”简洁保留其扰乱秩序的负面含义，不额外规定政治形式。
- source_word: βδελυκτάς ... βδελυκτήν
  choice: 可憎的……可憎的
  rationale: 原文对欲望与骄傲重复同一形容词，译文保留这一修辞重复。
- source_word: μυσεράν μοιχείαν
  choice: 可恶的奸淫
  rationale: μυσερός表示令人厌恶、可憎；用“可恶”既区别于重复的βδελυκτός，也保留强烈谴责语气。
theological_decisions:
- issue: ἁγιασμός在此处应译作“成圣”还是“圣洁”
  choice: 圣洁
  alternative: 成圣
  rationale: 该句强调与圣洁身份相称的行为；“圣洁”在现代汉语中更自然，也避免把此处必然限定为系统神学中的成圣过程，同时仍保留其神学张力。
- issue: ἅγια μερίς的群体身份含义
  choice: 圣洁的一分
  alternative: 圣洁群体的一员
  rationale: 直译保留μερίς“部分、份”的意象，不擅自补出原文未明说的“群体”或其具体所指。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“就当”表达劝勉语气；列举中保留“醉酒和作乱”的明确并列关系，并保留末尾原文较紧凑的罪恶清单及“可憎的”重复。
