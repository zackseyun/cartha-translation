  text: Let the testimony of our good deeds be given by others[a], just as it was given to our righteous fathers.
translation:
  language: zh_hans
  text: 我们的善行应当由别人作见证，正如我们那些义的祖先也曾得到见证一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ μαρτυρία ... διδόσθω ὑπ’ ἄλλων
  choice: 应当由别人来作见证
  rationale: 将希腊语“见证……应由别人给出”的被动结构转为自然的现代汉语，同时保留见证来自他人、而非自我称许的重点。
- source_word: τῆς ἀγαθῆς πράξεως ἡμῶν
  choice: 我们的善行
  rationale: πρᾶξις既可指具体行动，也可指行为表现；“善行”简洁庄重，并可涵盖单项善举或整体良好行为。
- source_word: τοῖς πατράσιν ἡμῶν τοῖς δικαίοις
  choice: 我们的义祖
  rationale: πατέρες在此指先辈、先祖；“义祖”凝练地保留“我们的”和“义”的修饰关系，也符合早期基督教文献的庄重语域。
theological_decisions:
- issue: 善行是单一行为还是整体品行
  choice: 正文采用“善行”，不限定为某一次孤立的善举
  alternative: 好行为；善举
  rationale: 希腊语单数πρᾶξις在此可能概括人的行为或行事表现；译文保留这一语义弹性，不将其强行解释为单一事件或完整生活方式。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“得到这样的见证”承接前半句，避免机械重复，又清楚表达先祖也曾由别人为其作见证。
