  text: κολληθῶμεν οὖν ἐκείνοις, οἷς ἡ χάρις ἀπὸ τοῦ θεοῦ δεδοται· ἐνδυσώμεθα τὴν ὁμόνοιαν ταπεινοφρονοῦντες, ἐγκρατευόμενοι, ἀπὸ παντὸς ψιθυρισμοῦ καὶ καταλαλιᾶς πόρρω ἑαυτοὺς ποιοῦντες, ἔργοις δικαιούμενοι καὶ μὴ λόγοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/003.yaml
  text: Let us therefore cling to those to whom grace has been given from God. Let us clothe ourselves with concord, being humble-minded and self-controlled, keeping ourselves far from every whispering and slander, being justified by works and not by words.
translation:
  language: zh_hans
  text: 所以，让我们紧紧依附那些从上帝领受恩典的人。让我们披上同心，存谦卑的心，自我节制，使自己远离一切窃窃私语和毁谤；借着行为被称为义，而不是借着言语。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: 紧密相连
  rationale: 该词本义为“黏合、紧贴”，用于人际关系时表示坚定依附；“紧密相连”既保留力度，也符合现代汉语表达。
- source_word: ἡ χάρις ἀπὸ τοῦ θεοῦ δεδοται
  choice: 蒙上帝赐予恩典
  rationale: 保留恩典来自上帝并已赐下的被动含义，同时以自然汉语重组句式。
- source_word: ἐνδυσώμεθα τὴν ὁμόνοιαν
  choice: 披上和睦
  rationale: 保留“穿上”的隐喻；ὁμόνοια 指同心、和谐一致，此处译为“和睦”简洁自然。
- source_word: ταπεινοφρονοῦντες
  choice: 存谦卑的心
  rationale: 表达谦卑的心态与思维取向，比单译“谦卑”更能体现复合词的内涵。
- source_word: ἐγκρατευόμενοι
  choice: 凡事节制
  rationale: 表示克制、自制；“凡事节制”能自然表达持续操练自制的意思。
- source_word: ψιθυρισμοῦ
  choice: 窃窃私语
  rationale: 该词可指暗中的抱怨、挑拨或诽议；直译保留其含蓄范围，不限定为某一种罪行。
- source_word: καταλαλιᾶς
  choice: 毁谤
  rationale: 指恶言中伤、背后诋毁；“毁谤”准确且庄重。
- source_word: ἔργοις δικαιούμενοι
  choice: 凭行为被称为义
  rationale: 保留 δικαιόω 的神学张力及被动形式，不将其弱化为“证明自己正直”，也不额外解释其与保罗书信用法的关系。
theological_decisions:
- issue: “凭行为被称为义”与“因信称义”措辞之间的潜在张力
  choice: 按原文直译为“凭行为被称为义”
  alternative: 以行为显明为义／凭行为证明自己正直
  rationale: 原文明确使用 δικαιούμενοι 及工具或根据性的复数与格 ἔργοις。译文不应为消除神学张力而加入“显明”或“证明”等原文没有的限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“披上和睦”的原文隐喻，并以分号呈现末句的劝勉重心。
