  yaml_path: translation/extra_canonical/1_clement/030/002.yaml
  text: For it says[a], "God opposes the proud, but gives grace to the humble."
translation:
  language: zh_hans
  text: 因为经上说[a]：“上帝敌挡骄傲的人，却赐恩给谦卑的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他说：‘上帝敌挡骄傲的人，却赐恩给谦卑的人。’”
    reason: 保留 φησίν 可按字面理解为第三人称单数“他说”的语法可能；正文则依其引经公式功能译为“经上说”。
lexical_decisions:
- source_word: ὑπερηφάνοις
  choice: 骄傲的人
  rationale: 准确表达傲慢、自高者，且符合现代汉语经文语体。
- source_word: ἀντιτάσσεται
  choice: 敌挡
  rationale: 保留原词所含对抗、站在对立面的强烈意味。
- source_word: ταπεινοῖς
  choice: 谦卑的人
  rationale: 指态度谦卑者；此处与“骄傲的人”形成明确对照。
- source_word: χάριν
  choice: 恩
  rationale: 简洁保留 χάρις 在此处“恩惠、恩典”的神学与语义幅度。
theological_decisions:
- issue: φησίν 的引文功能
  choice: 经上说
  alternative: 他说
  rationale: φησίν 在这里是引入《箴言》3:34引文的非人称引用公式；“经上说”自然地表明经文引述，也避免让读者误以为句中的上帝是“他说”的主语。
- issue: χάριν 的译法
  choice: 恩
  alternative: 恩典／恩惠
  rationale: “恩”既能表达上帝所赐的恩惠，也不把词义过度限定为某一套教义术语。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“敌挡”略带传统经文语感，但准确保留希腊文的强烈对抗含义；正文用引号清楚标示经文引语。
