  yaml_path: translation/extra_canonical/1_clement/030/005.yaml
  text: Blessed is one born of woman[a], short-lived. Do not be one of many words.
translation:
  language: zh_hans
  text: 妇人所生、寿命短促的人是有福的[a]。不要做多言的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的措辞也可译作：“有福的是妇人所生、寿命短促的人。”
    reason: 保留 εὐλογημένος 与后续名词性短语之间在汉语语序上的不同处理可能。
lexical_decisions:
- source_word: εὐλογημένος
  choice: 有福的
  rationale: 保留该词在此处最直接的被动形容词意义，不因上下文中的突兀感而擅自改写。
- source_word: γεννητὸς γυναικὸς
  choice: 妇人所生的人
  rationale: 准确表达属格结构，并采用现代汉语中庄重而易懂的说法。
- source_word: ὀλιγόβιος
  choice: 寿命短促
  rationale: 兼顾“生命短暂”的词义与原文凝练的语气。
- source_word: μὴ πολὺς ἐν ῥήμασιν γίνου
  choice: 不要做多言的人
  rationale: 按希腊语习语表达“不成为言语很多的人”；中文用“多言”自然传达其劝诫意味，避免生硬直译为“在话语上很多”。
theological_decisions:
- issue: “有福的”与“寿命短促”并置所形成的张力
  choice: 保留原文表面的悖论式陈述
  alternative: 按可能的引文背景改成“妇人所生的人寿命短促”或其他较顺畅的断言
  rationale: 现有希腊文本明确有 εὐλογημένος；即使表达突兀，也不应依据可能的底本或熟悉的经文措辞擅自删改。
translation_notes:
  register: 采用现代、庄重而简洁的劝诫语体。“妇人所生”略带经文风格，但普通读者仍易理解；“不要做多言的人”比逐字译法自然，同时保持原句结构与力度。
