  text: λέγει γάρ· Ὁ ἰὰ πολλὰ λέγων καὶ ἀντακουσεται· ἢ ὁ εὐλάλος οἴεται εἶναι δίκαιος;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/004.yaml
  text: For he says[a], “He who speaks many things will also hear in reply; or does the eloquent man think himself righteous?”
translation:
  language: zh_hans
  text: 因为他说[a]：“说许多话的人也必听见回应；能言善辩的人岂以为自己是义人吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所引的话见《约伯记》11:2（七十士译本）。本句也可译作：“多言的人也必听到答复；善于言辞的人岂以为自己是义人吗？”
    reason: 标明引文出处，并保留ἀντακούσεται与εὐλάλος在汉语中可有的另一种自然表达。
lexical_decisions:
- source_word: πολλὰ λέγων
  choice: 说许多话的人
  rationale: 贴近希腊语“说许多话”的表述，同时保持现代汉语自然通顺。
- source_word: ἀντακούσεται
  choice: 必听见回应
  rationale: 保留动词“反过来听见”的意象，也传达其语境中的“听到答复、遭到反驳”之意。
- source_word: εὐλάλος
  choice: 能言善辩的人
  rationale: 该词可指善于说话、口才流利的人；此译法既保留言辞能力之意，也不把它过度贬义化为“多嘴”。
- source_word: δίκαιος
  choice: 义人
  rationale: 采用宗教及伦理语境中通行的对应词，表达“正直、合乎公义的人”。
theological_decisions:
- issue: 引文范围
  choice: 将两个问句都置于“他说”所引的经文之内
  alternative: 在第一句后结束引文，把第二句视为革利免自己的评论
  rationale: λέγει γάρ之后的希腊文连续构成同一段引语；第二问句也属于所引用的《约伯记》11:2。
- issue: 反问语气
  choice: 将第二句译为“岂以为自己是义人吗？”
  alternative: 直陈为“能言善辩的人以为自己是义人吗？”
  rationale: 希腊语疑问句在上下文中具有反问意味；“岂……吗”自然保留了这种责问语气，而不将其改写为明确断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文的引文结构、反问语气及“听见回应”的听觉意象，避免把εὐλάλος解释成带有更强贬义的“油嘴滑舌”。
