source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου καὶ ἀπὸ τῆς ἁμαρτίας μου καθάρισόν με· ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω, καὶ ἡ ἁμαρτία μου ἐνώπιόν μου ἐστιν διαπαντός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/003.yaml
  text: 'Wash me more and more from my lawlessness,

    and cleanse me from my sin.

    For I know my lawlessness,

    and my sin is before me continually.'
translation:
  language: zh_hans
  text: '求你更彻底地洗涤我，使我脱离我的不法，


    洁净我，使我脱离我的罪。


    因为我知道我的不法，


    我的罪常在我面前。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον πλῦνόν με
  choice: 将我……洗得更加洁净
  rationale: ἐπὶ πλεῖον表示程度上的加深；用“洗得更加洁净”既保留强化之意，也符合现代汉语的自然表达。
- source_word: ἀνομία
  choice: 不法
  rationale: 保留该词“违背法度、行不义”的基本语义，并与下文“罪”相区别。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 这是现代汉语中对ἁμαρτία最直接、通行且合乎语境的对应词。
- source_word: καθάρισόν με
  choice: 除净我
  rationale: 表达从罪中得到洁净，与前句“洗”形成原文所具有的平行关系。
- source_word: διαπαντός
  choice: 常
  rationale: 简洁表达“始终、不断”的持续意义，并使诗行自然凝练。
theological_decisions:
- issue: ἀνομία与ἁμαρτία是否合并为同一用词
  choice: 分别译为“不法”和“罪”
  alternative: 两处均译为“罪”或将ἀνομία译为“罪孽”
  rationale: 原文有意使用两个相关但不同的词；分别翻译可保存其平行结构和语义张力，不预设二者完全同义。
- issue: “罪在我面前”的含义
  choice: 保留空间性隐喻“我的罪常在我面前”
  alternative: 解释为“我时常意识到自己的罪”
  rationale: 直译保留原文可能包含的持续自觉、控诉或无法回避等多重意味，避免在正文中限定为单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并按原文的诗体平行关系分行。祈求语气以“求你”明确呈现；措辞凝练，适合公众诵读。
