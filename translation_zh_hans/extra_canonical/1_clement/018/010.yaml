base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/010.yaml
  text: 'Create in me a clean heart, O God,

    and renew a right spirit within me.'
translation:
  language: zh_hans
  text: '上帝啊，求你在我里面造一颗清洁的心，


    在我内心深处更新正直的灵。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδίαν καθαρὰν
  choice: 一颗清洁的心
  rationale: 直译“清洁的心”，既保留礼仪和道德层面的丰富含义，也符合现代中文经文语体。
- source_word: κτίσον ἐν ἐμοί
  choice: 求你为我造
  rationale: κτίζω表达创造、造出的强意；加入“求”自然呈现希腊语祈使句在祷告中的语用功能。
- source_word: πνεῦμα εὐθὲς
  choice: 正直的灵
  rationale: εὐθύς在此可指正直、坚定或端正；“正直”保留其伦理取向，又不排除稳定坚定的意味。
- source_word: ἐγκαίνισον
  choice: 使……更新
  rationale: 该动词意为更新、重新恢复；采用使动结构，使中文自然，并与后接的位置短语顺畅结合。
- source_word: ἐν τοῖς ἐγκάτοις μου
  choice: 在我里面
  rationale: 字面为“在我的内在深处/内脏中”，在此惯用地指人的内心深处；译作“在我里面”自然庄重，并保留内在性的重点。
theological_decisions:
- issue: πνεῦμα是否特指圣灵
  choice: 译作“灵”，不加“圣”
  alternative: 圣灵
  rationale: 原文没有ἅγιον等限定语，且“我的内在深处”更自然地指祈祷者里面正直、坚定的灵；不应在译文中将其明确化为圣灵。
- issue: εὐθὲς的含义
  choice: 正直的
  alternative: 坚定的／端正的
  rationale: 词义可涵盖正直、端正与坚定。译作“正直”保留传统且自然的主要含义，不在正文中排除其稳定坚定的语义色彩。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体；以两行呈现诗句的平行结构。称呼用“上帝啊”，祈使句用“求你”表达敬虔请求。
