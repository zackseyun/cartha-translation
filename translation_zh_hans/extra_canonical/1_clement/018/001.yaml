base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/001.yaml
  text: And what shall we say And what shall we say about David, who has received testimony? To him God said, “I found a man according to my heart, David the son of Jesse; with everlasting mercy I anointed him.”
translation:
  language: zh_hans
  text: 对于那位得到见证的大卫，我们又该说什么呢？上帝曾对他说：“我找到了合我心意的人，就是耶西的儿子大卫；我以永恒的怜悯膏立了他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῷ μεμαρτυρημένῳ Δαυίδ
  choice: 对于那位得到见证的大卫
  rationale: 保留完成时被动分词所表达的“大卫已获得见证”之意，同时避免生硬地直译为“被作见证的大卫”。
- source_word: κατὰ τὴν καρδίαν μου
  choice: 合我心意
  rationale: 这是自然、庄重且为普通中文读者熟悉的表达，准确传达“与我的心相合／符合我的心意”。
- source_word: ἐν ἐλέει αἰωνίῳ
  choice: 以永恒的怜悯
  rationale: 保留介词短语的方式或领域意味，不将“怜悯”弱化为单纯的态度。
- source_word: ἔχρισα
  choice: 膏立
  rationale: 既体现以膏油膏抹的字面背景，也传达为职分拣选、设立的语境含义。
theological_decisions:
- issue: μεμαρτυρημένῳ所指见证的性质
  choice: 得到见证
  alternative: 蒙认可／有美好见证
  rationale: 原文只说明大卫是已经被见证的一位，并未明确限定见证者、见证方式或评价性质，因此采用较开放的译法。
- issue: ἐν ἐλέει αἰωνίῳ与膏立的关系
  choice: 我以永恒的怜悯膏立了他
  alternative: 我膏立他，使他永远蒙怜悯
  rationale: 语法上该介词短语直接修饰“膏立”，译文保留这种关系，不把它解释成膏立之后的结果。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我们又该说什么呢”承接前文论述；引文保持略带经文色彩，但避免古奥措辞。
