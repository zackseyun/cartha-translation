  text: ῥῦσαί με ἐξ αἱμάτων, ὁ θεός, ὁ θεὸς τῆς σωτηρίας μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/014.yaml
  text: Deliver me from bloodguilt, O God, the God of my salvation.
translation:
  language: zh_hans
  text: 神啊，求你救我脱离流人血的罪；你是拯救我的神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥῦσαί με
  choice: 求你救我脱离
  rationale: ῥύομαι表示从危险或困境中搭救、解救；用“求你救我脱离”既保留祈求语气，也自然表达其支配的对象。
- source_word: ἐξ αἱμάτων
  choice: 脱离流人血的罪
  rationale: 字面为“脱离诸血”，在此为希伯来语影响下的表达，指流血所带来的罪责；“流人血的罪”比单说“血”更能让现代读者理解，同时避免含混地译成一般性的杀戮。
- source_word: ὁ θεὸς τῆς σωτηρίας μου
  choice: 你是拯救我的神
  rationale: 属格结构可表达神是“我的拯救之神”或拯救的施行者；此译自然清楚，并保留救恩来自神这一含义。
theological_decisions:
- issue: “血”（αἱμάτων）是指流血行为、流血罪责，还是血债
  choice: 译作“流人血的罪”
  alternative: “血债”或字面译作“血”
  rationale: 复数“血”承接七十士译本《诗篇》50:16（通行编号51:14）的闪语表达，主要指流血罪责。“流人血的罪”保留道德与司法张力，却不进一步指定某一具体事件。
- issue: “救恩之神”的属格关系
  choice: 译作“拯救我的神”
  alternative: “我救恩的神”
  rationale: 两者均可能；所选译法在现代汉语中更自然，并明确神是施行拯救者，不额外引入教派性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留直接呼求神的祷告语气，并用分号呈现原文同位呼语之间的关系。
