    我在你面前行了恶，


    好使你在自己的话语中显为公义，


    并在你受审时得胜[a]。”'
  rationale: 修订直接对应希腊文的强调、从句关系和司法意象：以“我唯独得罪了你”准确表达σοὶ μόνῳ；以“好使”保留ὅπως；以“得胜”译νικήσῃς。正文维持传统且可行的“受审”理解，脚注明确给出中间语态的“施行审判”读法，避免在这一有争议的形式上作不必要的教义性裁断。
