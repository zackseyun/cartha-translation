  text: σοὶ μόνῳ ἥμαρτον καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/004.yaml
  text: 'Against you only I sinned,

    and I did what is evil before you,

    so that you may be justified in your words

    and prevail when you are judged[a].'
translation:
  language: zh_hans
  text: '“我唯独得罪了你；


    我在你面前行了恶，


    好使你在自己的话语中显为公义，


    并在你受审时得胜[a]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并在你施行审判时得胜。”希腊语κρίνεσθαί在这里可按被动语态理解为“受审”，也可按中间语态理解为“施行审判”；后一理解也与所引诗篇的希伯来语背景相符。
    reason: 保留κρίνεσθαί σε的中、被动语态分析歧义，不在正文中武断消除有文本和语法根据的替代理解。
lexical_decisions:
- source_word: σοὶ μόνῳ
  choice: 我得罪了你，唯独得罪了你
  rationale: 以自然的汉语重复凸显“你一位/唯独你”这一强烈强调，同时不暗示罪只影响神而不影响人。
- source_word: τὸ πονηρὸν ἐνώπιόν σου ἐποίησα
  choice: 我在你面前行了恶
  rationale: 保留“在你面前”的关系性和审判语境；“行了恶”庄重且易懂。
- source_word: δικαιωθῇς ἐν τοῖς λόγοις σου
  choice: 你在自己的话语中显为公义
  rationale: δικαιόω在此可指被证明或显明为公义；“显为公义”比“被称义”更符合对神话语正确性的陈述，也避免不自然的被动表达。
- source_word: νικήσῃς
  choice: 必胜诉
  rationale: 该动词本义为“得胜”；结合随后的审判/诉讼语境，“胜诉”凝练地表达在争讼中占胜。
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: 你受审判时
  rationale: κρίνεσθαι的形式可作中间或被动理解；正文采用直接可行的被动读法，并以脚注保留中间语态的替代解释。
theological_decisions:
- issue: κρίνεσθαι在神作为主语时应理解为被动“受审判”，还是中间语态“施行审判/进入争讼”
  choice: 正文作“你受审判时”
  alternative: “你施行审判时”或“你进入争讼时”
  rationale: 希腊形式本身容许中间与被动两种分析。正文保留较直观的被动读法，脚注明确另一种有语法及诗篇希伯来语背景支持的理解，不在译文中消除真实歧义。
- issue: ὅπως所表达的逻辑关系
  choice: 译作“因此”
  alternative: “好使”
  rationale: 在认罪诗句中，ὅπως可引出由认罪事实显明的结果或论证目的。直译“好使”容易让现代读者误以为人犯罪的目的在于使神显义；“因此”较自然地呈现推论关系，同时不改变神被显明为公义的核心。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，分行保留引文的平行结构。避免宗派术语；“显为公义”“胜诉”传达法庭意象，又不把经文改写成教义解释。
