  text: μὴ ἀπορίψῃς με ἀπὸ τοῦ προσώπου σου, καὶ τὸ πνεῦμα τὸ ἅγιόν σου μὴ ἀντανέλῃς ἀπʼ ἐμοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/011.yaml
  text: 'Do not cast me away from your presence,

    and do not take your Holy Spirit from me.'
translation:
  language: zh_hans
  text: '不要把我从你面前丢弃，

    也不要从我取去你的圣灵。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀπορίψῃς με
  choice: 不要把我……丢弃
  rationale: ἀπορίπτω表示抛弃、丢弃；这样既保留原文强烈的恳求语气，也符合现代汉语表达。
- source_word: ἀπὸ τοῦ προσώπου σου
  choice: 从你面前
  rationale: πρόσωπον直译为“面”，此处指在上帝面前、与其同在；“从你面前”保留了原文意象。
- source_word: τὸ πνεῦμα τὸ ἅγιόν σου
  choice: 你的圣灵
  rationale: 依照词组结构译为“你的圣灵”，准确呈现所属关系和“圣”的限定。
- source_word: μὴ ἀντανέλῃς ἀπʼ ἐμοῦ
  choice: 不要从我身上收回
  rationale: ἀνταναιρέω在此表示取去、撤回；“收回”自然传达从某人那里撤去之意，但不额外加入英语旧稿“take back”可能暗示的恢复后再取回之含义。
theological_decisions:
- issue: “圣灵”被取去的神学含义
  choice: 按原文直译为“不要从我身上收回你的圣灵”
  alternative: 解释为失去救恩、恩赐、膏立或同在
  rationale: 原句本身未界定“取去圣灵”的具体教义含义，因此保留其祈求中的神学张力，不加解释性限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留两行平行结构与诗性节奏；不加脚注，因为正文无需借助异文或解释即可准确表达原文。
