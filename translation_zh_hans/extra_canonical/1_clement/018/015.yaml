id: 1CLEM.18.15
reference: 1 Clement 18:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγαλλιάσεται ἡ γλῶσσά μου τὴν δικαιοσύνην σου. κύριε, τὸ στόμα μου ἀνοίξεις, καὶ τὰ χείλη μου ἀναγγελεῖ τὴν αἴνεσίν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/015.yaml
  text: 'My tongue will rejoice in your righteousness.

    Lord, you will open my mouth,

    and my lips will declare your praise.'
translation:
  language: zh_hans
  text: '我的舌头要因你的公义欢欣。


    主啊，你必开启我的口，


    我的嘴唇必宣扬对你的赞美。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: 要……欢欣
  rationale: 表达强烈喜乐，并保留希腊语将来时的语气。
- source_word: δικαιοσύνην
  choice: 公义
  rationale: 在敬虔语境中自然对应“正直、公正”，且不缩减其神学内涵。
- source_word: ἀνοίξεις
  choice: 必开启
  rationale: 保留第二人称将来时，不改写成祈使或祈愿。
- source_word: ἀναγγελεῖ
  choice: 必宣扬
  rationale: 体现公开述说、传扬之意，并保留将来时。
- source_word: αἴνεσίν
  choice: 赞美
  rationale: 指向献给上主的称颂；用“对你的赞美”自然表达希腊语属格关系。
theological_decisions:
- issue: τὴν δικαιοσύνην σου 与欢欣的关系
  choice: 因你的公义欢欣
  alternative: 欢呼你的公义
  rationale: 原文的宾格结构不寻常，可理解为欢欣所关乎的内容；“因……欢欣”在中文中通顺，同时避免把动词明确改作“宣告”。
- issue: 两个将来时的语气
  choice: 你必开启……我的嘴唇必宣扬
  alternative: 求你开启……我的嘴唇就宣扬
  rationale: 希腊文使用直陈式将来时；译文保留陈述或确信的语气，不依据其诗篇背景擅自改成祈求。
translation_notes:
  register: 采用庄重而现代的诗体汉语，按三个诗行呈现。用“舌头、口、嘴唇”的身体意象对应原文；避免古奥措辞，也不额外补入因果或条件关系。
