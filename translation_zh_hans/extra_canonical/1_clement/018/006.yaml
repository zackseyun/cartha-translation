base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/006.yaml
  text: 'For behold, you loved truth;

    the hidden and secret things of your wisdom you made known to me.'
translation:
  language: zh_hans
  text: '看哪，你喜爱真理；

    你使我知道你智慧中未显明和隐秘的事。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ γάρ
  choice: 看哪
  rationale: ἰδού用于引人注意；γάρ承接上文作说明，在独立呈现本节时不必生硬译作“因为”，以自然汉语保留强调语气。
- source_word: ἀλήθειαν ἠγάπησας
  choice: 你喜爱真理
  rationale: 直译其宾语与动词，保留完成时所陈述的既成事实，不另加解释。
- source_word: τὰ ἄδηλα καὶ τὰ κρύφια
  choice: 隐而未现、深藏不露的事
  rationale: 分别体现ἄδηλα“未显明、不可见”和κρύφια“隐藏、隐秘”的相近而有别的含义，同时避免现代汉语中不自然的名词堆叠。
- source_word: τῆς σοφίας σου
  choice: 你智慧中
  rationale: 属格可表示属于或包含关系；译作“你智慧中”符合汉语习惯，也不把其关系过度限定。
- source_word: ἐδήλωσάς μοι
  choice: 你已……指示我
  rationale: δηλόω意为使清楚、显明；“指示”兼顾启示与使人明白之意，且“已”体现不定过去时所述的完成事件。
theological_decisions:
- issue: “你的智慧”与隐秘之事的关系
  choice: 你智慧中隐而未现、深藏不露的事
  alternative: 你隐秘而深藏的智慧
  rationale: 希腊文两个中性复数名词化形容词由“你的智慧”的属格修饰；保留“诸事/事情”与“智慧”的区分，不将其合并为“隐秘的智慧”。
- issue: 说话者与受话者的身份
  choice: 沿用第二人称“你”，不补出“神”或其他称谓
  alternative: 神啊，你喜爱真理
  rationale: 本节希腊文本身没有明说称谓；不以语境推断替代原文，从而保留文本表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以分号和换行保留原文两分句的诗体平行感。“隐而未现、深藏不露”既区分两个近义词，也保持朗读节奏。
