  text: ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου, καὶ πνεύματι ἡγεμονικῷ στήριξόν με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/012.yaml
  text: 'Restore to me the joy of your salvation[b][a],

    and uphold me with a willing spirit.'
translation:
  language: zh_hans
  text: '求你使我重新得享你救恩的喜乐，

    以乐意的灵扶持我。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐意的灵”也可译作“引导人的灵”或“主导的灵”。
    reason: ἡγεμονικός兼有领导、引导、居主导地位等含义；在这一诗篇引文中传统上也常按甘愿、乐意的心志理解。
lexical_decisions:
- source_word: ἀπόδος
  choice: 使我重新得享
  rationale: 该动词有“归还、恢复”之意；与宾语“喜乐”搭配时，这一译法比直译“归还给我”更符合现代汉语。
- source_word: ἀγαλλίασιν
  choice: 喜乐
  rationale: 表示欢欣、欢腾；“喜乐”自然庄重，也适合诗篇祈祷语境。
- source_word: τοῦ σωτηρίου σου
  choice: 你救恩的
  rationale: 属格结构修饰“喜乐”；σωτήριον在此指上帝所赐的拯救。
- source_word: στήριξόν με
  choice: 扶持我
  rationale: στήριζω可指使人坚定、稳固；“扶持”既保留支撑之意，也适合向上帝祈求的语境。
- source_word: πνεύματι ἡγεμονικῷ
  choice: 以乐意的灵
  rationale: 此词组沿用七十士译本诗篇50:14；ἡγεμονικός可表达主导、引领或甘愿坚定的性质。正文采用汉语诗篇传统中自然且合乎语境的“乐意”，并以脚注保留另一可能。
theological_decisions:
- issue: πνεῦμα是人的灵还是上帝所赐的灵
  choice: 不明确添加“我的”或“你的”
  alternative: 以你引导的灵／使我的灵乐意
  rationale: 希腊文本仅说“以……的灵”，没有物主限定；译文保留其可能指人的内在心志或上帝所赐之灵的开放性。
- issue: ἡγεμονικός的语义
  choice: 乐意的
  alternative: 引导人的／主导的
  rationale: 在本句祈求坚定扶持的语境中，“乐意的灵”表达甘愿、坚定的心志；但该形容词本身也可有领导、引导之义，故以脚注注明。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷体；两行对应原文两个祈使句。避免补入原文没有的物主代词，以保留“灵”的指向及ἡγεμονικός的语义张力。
