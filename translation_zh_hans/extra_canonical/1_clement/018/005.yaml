  text: ἰδοὺ γὰρ ἐν ἀνομίαις συνελήμφθην, καὶ ἐν ἁμαρτίαις ἐκίσσησέν με ἡ μήτηρ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/005.yaml
  text: 'For behold[a], in lawless deeds I was conceived,

    and in sins my mother bore me.'
translation:
  language: zh_hans
  text: '看哪，因为我是在种种不法中被怀上的；

    我母亲是在罪中怀了我。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怀了我”所译的希腊词较罕见，本指孕妇妊娠期间的特殊欲求；在这里引申为怀孕、孕育。有些旧译作“哺育我”。
    reason: 说明该罕见词的语义发展及旧译差异；此处按七十士译本式用法译为“怀了我”，不理解为分娩或哺乳。
lexical_decisions:
- source_word: ἀνομίαις
  choice: 种种不法
  rationale: 保留复数含义，并以现代汉语表达违背法度、正道的行为状态；不把它收窄为某一种具体罪行。
- source_word: συνελήμφθην
  choice: 受孕
  rationale: 这是被动形式，指诗人被母亲孕育、成胎；“受孕”准确保留被动视角，也与下句的主动表达形成对应。
- source_word: ἁμαρτίαις
  choice: 罪
  rationale: 中文集合名词“罪”自然涵盖希腊文复数，不必生硬译作“诸罪”。
- source_word: ἐκίσσησέν με
  choice: 怀了我
  rationale: 该罕见动词本指孕妇的妊娠反应或欲求，在此七十士译本式语境中引申为怀孕、孕育；“怀了我”既区别于上句“受孕”，又不误译为生产或哺乳。
theological_decisions:
- issue: 罪与受孕、怀胎之间的关系
  choice: 按原文保留“在……中”的宽泛表述
  alternative: 明确译成“因父母犯罪而受孕”或“生来就有原罪”
  rationale: 原文没有明确说明罪属于谁，也没有直接界定其传递机制；译文应保留诗句本身的神学张力，不加入特定教派的解释。
- issue: 第二行是否译作“生了我”
  choice: 译作“怀了我”
  alternative: “生了我”
  rationale: ἐκίσσησεν 所指更接近怀孕、孕育，而非分娩；“生了我”会把语义推进到出生阶段。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留诗体的两行平行结构。“因为，看哪”对应 γὰρ ἰδού；“种种不法”与“罪”避免过度抽象，也不额外指定犯罪主体。
