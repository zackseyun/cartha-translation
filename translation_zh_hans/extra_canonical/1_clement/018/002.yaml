source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλὰ καὶ αὐτὸς λέγει πρὸς τὸν θεόν· Ἐλέησόν με, ὁ θεός, κατὰ τὸ μέγα ἔλεός σου, καὶ κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/002.yaml
  text: 'But he himself also says to God:


    Have mercy on me[a], O God, according to your great mercy,

    and according to the abundance of your compassions blot out my lawlessness.'
translation:
  language: zh_hans
  text: '但他自己也对上帝说：


    上帝啊，求你按你浩大的慈爱怜悯我，


    按你丰盛的怜悯涂抹我的不法。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ αὐτὸς
  choice: 但他自己也
  rationale: 兼顾ἀλλά的转折、καί的“也”以及αὐτός的强调，呼应上文上帝对大卫说话，而这里大卫自己也对上帝说话。
- source_word: ἔλεος
  choice: 慈爱
  rationale: 在“按你丰盛的……”这一诗篇语境中，“慈爱”自然表达上帝施怜悯的恒常恩慈；随后用“怜悯我”译同词根动词，以符合现代汉语搭配。
- source_word: οἰκτιρμοί
  choice: 怜悯
  rationale: 复数形式表达上帝丰富而充盈的怜恤；汉语通常不以形态标示复数，数量意味由“满溢”体现。
- source_word: ἐξάλειψον
  choice: 涂抹
  rationale: 保留原词把罪过如记录般抹去的具体意象，也符合经文庄重语体。
- source_word: ἀνόμημα
  choice: 不法
  rationale: 保留其违反律法、悖逆法度的抽象含义，不擅自具体化为某一桩罪行。
theological_decisions:
- issue: 大卫说话时的强调与上下文对照
  choice: 他自己也
  alternative: 他也
  rationale: 原文καὶ αὐτός带有明确强调；此译保留上帝先对大卫说话、而大卫自己也转向上帝说话的对照。
- issue: ἀνόμημα的抽象性
  choice: 我的不法
  alternative: 我的不法行为
  rationale: 采用抽象表达，避免把原文单数抽象名词限定为一项具体行为，同时保留其律法性语义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。诗句按平行结构分行；“上帝啊”作直接呼告。“满溢的怜悯”保留原文“众多、丰盛”的力度，同时避免生硬的“许多怜悯”。
