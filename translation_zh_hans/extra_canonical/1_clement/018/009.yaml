  text: 'Turn your face away from my sins,

    and blot out all my lawless deeds.'
translation:
  language: zh_hans
  text: '求你转脸不看我的罪，

    涂抹我一切不法的行为。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστρεψον τὸ πρόσωπόν σου
  choice: 求你转脸不看
  rationale: 保留“转开你的脸”的具体意象，同时用“不看”自然表达其与后接对象之间的关系。
- source_word: ἁμαρτιῶν
  choice: 罪
  rationale: 采用现代汉语中准确、通行的宗教与伦理用语。
- source_word: ἀνομίας
  choice: 不法的行为
  rationale: 保留“违背律法、行事不法”的含义，并与前句的“罪”有所区分。
- source_word: ἐξάλειψον
  choice: 涂抹
  rationale: 保留原文“擦除、抹去”的形象，也呼应诗篇祈祷语言的庄重语体。
theological_decisions:
- issue: “罪”与“不法”是否合并为同义表达
  choice: 分别译作“罪”和“不法的行为”
  alternative: 两处都译作“罪”或“过犯”
  rationale: 原文使用ἁμαρτίαι与ἀνομίαι两个不同词，应保留其修辞平行中的词义差异，而不把二者完全等同。
translation_notes:
  register: 采用自然、庄重的祈祷语体；两行平行，措辞清楚，保留原文的面容与涂抹意象。
