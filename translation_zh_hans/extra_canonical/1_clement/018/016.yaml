  text: ὅτι εἰ ἠθέλησας θυσίαν, ἔδωκα ἄν· ὁλοκαυτώματα οὐκ εὐδοκήσεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/016.yaml
  text: 'For if you had desired sacrifice, I would have given it;

    in whole burnt offerings you will not delight.'
translation:
  language: zh_hans
  text: '因为你若想要祭物，我本会献上；

    燔祭你不会喜悦。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠθέλησας
  choice: 喜爱
  rationale: 在祭祀语境中表达上帝对祭物的意愿与悦纳，比单纯的“想要”更庄重自然，并与下一分句的 εὐδοκήσεις 呼应。
- source_word: θυσίαν
  choice: 祭物
  rationale: 此处指献给上帝的祭牲或祭品；译作“祭物”既准确，也便于现代读者理解。
- source_word: ἔδωκα ἄν
  choice: 我早已献上
  rationale: ἄν 与过去时表达未实现条件下的结果；“早已”自然传达“本来就会”的反事实意味，“献上”符合祭祀语境。
- source_word: ὁλοκαυτώματα
  choice: 燔祭
  rationale: 指全部焚烧献上的祭物；“燔祭”是准确且通行的中文圣经术语。
- source_word: οὐκ εὐδοκήσεις
  choice: 并非你所喜悦的
  rationale: 保留希腊文本的将来式形式所承载的陈述意味，同时用自然汉语表达“不以……为悦”。
theological_decisions:
- issue: 祭祀本身与上帝所喜悦之事的张力
  choice: 直译为上帝并不喜悦燔祭，不增添限定语
  alternative: 译成“你并非只喜悦燔祭”或“你不会因燔祭本身而喜悦”
  rationale: 原文没有“只”或“本身”等限定；增添这些词会预先调和本句的尖锐表达，因此保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留诗行式分句。以“因为……；……”呈现论证关系，并用“燔祭”维持历史祭祀语境。
