source:
  edition: Funk 1901 (normalized OCR)
  text: θυσία τῷ θεῷ πνεῦμα συντετριμμένον· καρδίαν συντετριμμένην καὶ τεταπεινωμένην ὁ θεὸς οὐκ ἐξουδενώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/017.yaml
  text: 'A sacrifice to God is a broken spirit;

    a broken and humbled heart God will not despise.”'
translation:
  language: zh_hans
  text: '献给上帝的祭，是破碎的灵；

    破碎而谦卑的心，上帝必不轻看。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία
  choice: 祭
  rationale: 保留献祭语境，并用现代读者易懂的简洁名词表达。
- source_word: πνεῦμα συντετριμμένον
  choice: 破碎的灵
  rationale: 直译诗性意象；συντετριμμένον 表示被压碎、痛悔的状态，不将其窄化为单一心理感受。
- source_word: καρδίαν συντετριμμένην καὶ τεταπεινωμένην
  choice: 破碎而谦卑的心
  rationale: 分别保留两个并列分词的含义；“心”符合圣经语境中人的内在生命与意志中心。
- source_word: οὐκ ἐξουδενώσει
  choice: 必不轻看
  rationale: 表达“不视为无物、不藐视”；“轻看”自然庄重，也保留拒斥与贬抑的语义。
theological_decisions:
- issue: 献祭与内在悔罪的关系
  choice: 维持原文判断句：“献给上帝的祭，是破碎的灵”
  alternative: 译作“上帝所悦纳的祭，是痛悔的心灵”
  rationale: 原文没有明说“悦纳”，也没有把 πνεῦμα 直接释为“痛悔”；当前译法保留其诗性和神学张力。
- issue: οὐκ 的语气呈现
  choice: 译为“必不轻看”
  alternative: 译为“不会轻看”
  rationale: “必不”符合引文的庄重诗体，并清楚传达强烈否定；不额外引入条件或教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，保留希腊文平行结构与诗性意象。末尾引号依照所给上下文保留，表明本节结束一段引文。
