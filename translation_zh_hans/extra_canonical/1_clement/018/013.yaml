  text: διδάξω ἀνόμους τὰς ὁδούς σου, καὶ ἀσεβεῖς ἐπιστρέψουσιν ἐπὶ σέ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/013.yaml
  text: 'I will teach the lawless your ways,

    and the ungodly will turn to you.'
translation:
  language: zh_hans
  text: '我要将你的道路教导给不守律法的人，

    不敬虔的人将归向你。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόμους
  choice: 不守律法的人
  rationale: 表达其“无视或违背律法者”的含义，同时避免只译作泛指的“恶人”。
- source_word: τὰς ὁδούς σου
  choice: 你的道路
  rationale: 保留原文比喻，指上帝的行事方式、旨意和所要求的生活道路。
- source_word: ἀσεβεῖς
  choice: 不敬虔的人
  rationale: 准确体现对上帝缺乏敬畏与虔敬，而不将其泛化为一般道德意义上的“不义”。
- source_word: ἐπιστρέψουσιν ἐπὶ σέ
  choice: 就必归向你
  rationale: ἐπιστρέφω在此表示转向、归向；不加入原文未明确表达的“重新”，并以“归向”呈现其宗教语境。
theological_decisions:
- issue: ἐπιστρέψουσιν是否含有“回转”的既往归属意味
  choice: 归向你
  alternative: 回转归向你／转向你
  rationale: 原文明确表达朝向上帝的转变，但未明确说明这些人此前曾归属于上帝；因此不加入“回”所暗示的既往状态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留“道路”的圣经性比喻，并用“不守律法的人”“不敬虔的人”区分原文两个群体称谓。
