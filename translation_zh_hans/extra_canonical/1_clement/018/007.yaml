  yaml_path: translation/extra_canonical/1_clement/018/007.yaml
  text: 'You will sprinkle me with hyssop, and I will be cleansed;

    you will wash me, and I will be made whiter than snow.'
translation:
  language: zh_hans
  text: '你要用牛膝草洒我，我便得洁净；

    你要洗我，我便比雪更白。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαντιεῖς
  choice: 洒
  rationale: 直译其“以液体洒、喷”的动作，并保留礼仪洁净的语境。
- source_word: ὑσσώπῳ
  choice: 用牛膝草
  rationale: 对应洁净礼仪所用的植物“hyssop”；采用现代中文圣经传统中通行且易懂的名称。
- source_word: καθαρισθήσομαι
  choice: 得洁净
  rationale: 保留被动意义，表达因洒净而进入洁净状态。
- source_word: πλυνεῖς
  choice: 洗净
  rationale: 不仅表达清洗动作，也自然衔接下句洁白的结果。
- source_word: ὑπὲρ χιόνα λευκανθήσομαι
  choice: 变得比雪更白
  rationale: 准确保留比较结构和被动结果含义，同时符合现代汉语表达。
theological_decisions:
- issue: 洁净动作的施行者与结果
  choice: 保留第二人称施行、第一人称被洁净的结构
  alternative: 改写为“求你……使我……”
  rationale: 希腊文使用将来时陈述而非显式祈使或愿望语气；因此不把它解释性地改成祈求句。
- issue: 礼仪洁净与道德洁净的关系
  choice: 保留“牛膝草”“洁净”“洗净”的具体意象
  alternative: 意译为“除去我的罪”
  rationale: 原文借礼仪和洗涤意象表达洁净，未在本句中直接出现“罪”；译文不提前消解其诗性与神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留两分句的诗体平行结构；不添加原文没有的“求”或“使”。
