  naturalness: “欢喜快乐的声音”虽可解释为汉语对“听见欢喜和快乐”的补足，但“声音”并不见于原文，且会使抽象名词具体化。删去后仍可作为庄重诗体自然理解。“受压低的骨头”需要改为更合乎现代汉语的“受屈抑的骨头”。
