  yaml_path: translation/extra_canonical/1_clement/018/008.yaml
  text: 'You will make me hear gladness and joy;

    the bones that have been humbled will rejoice.'
translation:
  language: zh_hans
  text: '你必使我听见欢喜和快乐；

    受屈抑的骨头必欢腾。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκουτιεῖς με
  choice: 你必使我听见
  rationale: 该动词是使役性表达，直译为“使我听见”，既保留原文结构，也符合现代汉语。
- source_word: ἀγαλλίασιν καὶ εὐφροσύνην
  choice: 欢喜快乐的声音
  rationale: 两个近义名词并列，分别用“欢喜”“快乐”呈现；补出“的声音”，使“听见”在汉语中自然，同时没有把它们改写成具体言语。
- source_word: ὀστᾶ τεταπεινωμένα
  choice: 受压低的骨头
  rationale: 保留 τεταπεινωμένα 的被动与结果状态，并维持“骨头”这一鲜明的身体意象；“压低”也保留可指屈辱或压碎、受创的语义张力。
- source_word: ἀγαλλιάσονται
  choice: 必欢腾
  rationale: 表达强烈、外显的喜乐，并与前面的名词 ἀγαλλίασιν 形成词根呼应。
theological_decisions:
- issue: τεταπεινωμένα 是指谦卑、受辱，还是受创压碎
  choice: 受压低的
  alternative: 被压碎的；受屈辱的
  rationale: 希腊词本身可涵盖被降低、受辱或受压的状态。译文不把意象限定为单纯内在谦卑，也不强化为原文未明说的骨折或粉碎，以保留其张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。上下两行保持诗体平行；以“必”对应两个将来时。
