  naturalness: 原译庄重流畅，但“恒忍”“蒙他的名喜悦”较不自然；后者还造成句法角色不清。修订为“忍耐和宽容”及“讨他名的喜悦”，在不抹去原文“名”的措辞下更符合现代标准汉语。
  terminology: “上帝”“主宰”“大祭司”“护佑者”均适切，且没有引入宗派性术语。将 σωφροσύνη 译为“明辨”较“明智”更能表达清醒、审慎的判断力，并与前面的“自制”有所区别。
