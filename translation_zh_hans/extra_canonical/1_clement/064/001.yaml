source:
  edition: Funk 1901 (normalized OCR)
  text: Λοιπὸν ὁ παντεπόπτης θεὸς καὶ δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός, ὁ ἐκλεξάμενος τὸν κύριον Ἰησοῦν Χριστὸν καὶ ἡμᾶς διʼ αὐτοῦ εἰς λαὸν περιούσιον, δῴη πάσῃ ψυχῇ ἐπικεκλημένῃ τὸ μεγαλοπρεπὲς καὶ ἅγιον ὄνομα αὐτοῦ πίστιν, φόβον, εἰρήνην, ὑπομονὴν καὶ μακροθυμίαν, ἐγκράτειαν, ἁγνείαν καὶ σωφροσύνην, εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ διὰ τοῦ ἀρχιερέως καὶ προστάτου ἡμῶν Ἰησοῦ Χριστοῦ, διʼ οὗ αὐτῷ δόξα καὶ μεγαλωσύνη, κράτος καὶ τιμή, καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/064/001.yaml
  text: Finally, may the all-seeing God and Master of spirits and Lord of all flesh, who chose the Lord Jesus Messiah and us through him to be a people for his own possession, grant to every soul that has been called by his magnificent and holy name faith, fear, peace, endurance and longsuffering, self-control, purity, and sound judgment, so as to be pleasing to his name through our high priest and protector Jesus Messiah, through whom be glory and majesty to him, might and honor, both now and through all the ages of ages. Amen.
translation:
  language: zh_hans
  text: 最后，愿那洞察一切的上帝、众灵的主宰、凡有血肉者的主——就是拣选了主耶稣基督，又借着他拣选我们作自己子民的上帝——将信心、敬畏、和平、忍耐和宽容、自制、纯洁和明辨，赐给每一个奉他尊荣而圣洁之名蒙召的灵魂[a]，好叫他们借着我们的大祭司和护佑者耶稣基督，讨他名的喜悦[b]。愿荣耀与威严、权能与尊贵，借着耶稣基督归于上帝，从现在直到万世万代。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可理解为“奉他尊荣而圣洁之名蒙召”，也可能带有“有他尊荣而圣洁之名被称在其上”的含义。
    reason: ἐπικεκλημένῃ 与“名”的结构具有解释空间；正文采用自然的“奉……名蒙召”，脚注保留另一可能的语义关联。
  - marker: b
    text: 原文直译为“为讨他名的喜悦”；也可按较自然的汉语表达为“讨他喜悦”。
    reason: εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ 明确提及“他的名”。正文保留这一措辞，避免把它直接简化为“蒙他喜悦”。
lexical_decisions:
- source_word: παντεπόπτης
  choice: 鉴察万有的
  rationale: 兼顾“看见一切”与神圣监察的语义，较“全视的”更符合现代汉语。
- source_word: δεσπότης τῶν πνευμάτων
  choice: 众灵的主宰
  rationale: 保留 δεσπότης 的主权意味，并直译 πνευμάτων 为“众灵”，不擅自限定为人类灵魂或天使。
- source_word: κύριος πάσης σαρκός
  choice: 凡有血肉者的主
  rationale: 按希腊语保留闪语式“凡有血肉者”，指一切有生命的人类或受造生命，避免缩窄为“全人类”。
- source_word: λαὸν περιούσιον
  choice: 自己子民
  rationale: 表达“特别归属、作为产业”的核心意义，采用自然庄重的现代汉语。
- source_word: μακροθυμία
  choice: 恒忍
  rationale: 与前面的 ὑπομονή“忍耐”作适度区分，突出长久忍受、迟于发怒。
- source_word: σωφροσύνη
  choice: 明智
  rationale: 该词兼有健全判断、审慎和自持之意；上下文已有“自制”，故用“明智”避免重复。
- source_word: προστάτου
  choice: 护佑者
  rationale: 保留保护、援助和代表一方的含义，不引入特定制度或宗派性头衔。
- source_word: αἰῶνας τῶν αἰώνων
  choice: 世世代代
  rationale: 以自然汉语表达强调无尽时期的惯用叠加强调。
theological_decisions:
- issue: “拣选主耶稣基督”和“借着他拣选我们”的句法关系
  choice: 拣选了主耶稣基督、又借着他拣选我们
  alternative: 借着主耶稣基督拣选了我们
  rationale: 原文把 τὸν κύριον Ἰησοῦν Χριστόν 与 ἡμᾶς 都置于 ἐκλεξάμενος 之下，而 διʼ αὐτοῦ 特别修饰“我们”；译文保留这一不寻常但明确的并列结构。
- issue: “名字被呼求/被称于其上”的含义
  choice: 蒙他庄严而圣洁之名所召的人
  alternative: 有他庄严而圣洁之名被称在其上的人
  rationale: ἐπικεκλημένῃ 与宾格“名”可表达因该名而蒙召，也带有该名被称在某人身上的色彩；正文采用自然表达，脚注保留句法余义。
- issue: “蒙他的名喜悦”这一不寻常表达
  choice: 蒙他的名喜悦
  alternative: 讨他喜悦
  rationale: 原文是 εὐαρέστησιν τῷ ὀνόματι αὐτοῦ，明确以“他的名”为对象；不把它静默简化为“蒙他喜悦”，以保存原文措辞及神学张力。
- issue: 基督作为“大祭司和护佑者”
  choice: 我们的大祭司和护佑者耶稣基督
  alternative: 我们的大祭司和中保耶稣基督
  rationale: προστάτης 不等同于技术性的“中保”；“护佑者”较完整地传达保护与援助，同时避免导入后期教义术语。
translation_notes:
  register: 采用现代、庄重、适合公共诵读的标准普通话。句式保留原文祷愿与颂荣的一气贯通感，同时用标点和重复“上帝”澄清长句结构；避免古奥虚词及宗派性专门术语。
