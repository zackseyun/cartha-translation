  to: 最后，愿那洞察一切的上帝、众灵的主宰、凡有血肉者的主——就是拣选了主耶稣基督，又借着他拣选我们作自己子民的上帝——将信心、敬畏、和平、忍耐和宽容、自制、纯洁和明辨，赐给每一个奉他尊荣而圣洁之名蒙召的灵魂[a]，好叫他们借着我们的大祭司和护佑者耶稣基督，讨他名的喜悦[b]。愿荣耀与威严、权能与尊贵，借着耶稣基督归于上帝，从现在直到万世万代。阿们。
