  text: ζῆλος φυγεῖν ἠνάγκασεν Μωυσῆν ἀπὸ προσώπου Φαραὼ βασιλέως Αἰγύπτου ἐν τῷ ἀκοῦσαι αὐτὸν ἀπὸ τοῦ ὁμοφύλου· Τίς σε κατέστησεν κριτὴν ἢ δικαστὴν ἐφʼ ἡμῶν; μὴ ἀνελεῖν με σὺ θέλεις, ὃν τρόπον ἀνεῖλες ἐχθὲς τὸν Αἰγύπτιον;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/010.yaml
  text: Jealousy compelled Moses to flee from the presence of Pharaoh king of Egypt[a], when he heard from his fellow tribesman, ‘Who appointed you judge or magistrate over us? Do you want to kill me, as you killed the Egyptian yesterday?’
translation:
  language: zh_hans
  text: 嫉妒迫使摩西从埃及王法老面前逃走，因为他听见一个同族人对他说：“谁立你作我们的审判官或裁判官？难道你想杀我，像昨天杀那个埃及人一样吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 在本段列举恶行后果的语境中指嫉妒、妒忌；采用“嫉妒”自然且准确。
- source_word: ἀπὸ προσώπου Φαραὼ
  choice: 逃离埃及王法老
  rationale: 该短语表示离开法老面前、躲避法老；汉语用“逃离……法老”简洁自然，不机械直译“从面前”。
- source_word: ὁμοφύλου
  choice: 同族人
  rationale: 指与摩西同一民族的人；“同族人”比“同胞”更明确保留族属含义。
- source_word: κριτὴν ἢ δικαστὴν
  choice: 审判官或裁判官
  rationale: 原文有两个并列的司法称谓，不采用七十士译本熟悉措辞中的“首领”；“审判官”与“裁判官”既有区分，也保留近义重叠。
- source_word: μὴ ἀνελεῖν με σὺ θέλεις
  choice: 难道你想杀我
  rationale: μή引导的问题预期否定回答，汉语以“难道”自然传达其反问语气。
theological_decisions:
- issue: 是否按《出埃及记》2:14的通行措辞译为“首领和审判官”
  choice: 按《革利免一书》现存希腊文本译为“审判官或裁判官”
  alternative: 首领或审判官
  rationale: 此处革利免使用κριτής与δικαστής两个司法词，翻译应忠于本书实际引文，不以熟悉的经文措辞校正作者文本。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。引语保持直接有力；不人为消除“审判官”和“裁判官”两个近义司法称谓之间的张力。
