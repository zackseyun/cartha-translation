  text: Because of jealousy our father Jacob fled from the face of Esau his brother.
translation:
  language: zh_hans
  text: 由于嫉妒，我们的先祖雅各从他兄弟以扫面前逃走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: 由于嫉妒
  rationale: 原文表达原因；ζῆλος在此承接本段主题，指嫉妒或忌恨。虽然希腊语格形不规则，语义仍清楚。
- source_word: ὁ πατὴρ ἡμῶν
  choice: 我们的先祖
  rationale: 直译是“我们的父亲”，但在追述以色列先祖的语境中，现代汉语用“先祖”更自然，也避免误解为直系父亲。
- source_word: ἀπέδρα ἀπὸ προσώπου
  choice: 逃离了……的面
  rationale: 保留原文带有希伯来语色彩的“从某人面前逃走”表达；“逃离了……的面”庄重且贴近原文意象。
- source_word: Ἠσαῦ τοῦ ἀδελφοῦ αὐτοῦ
  choice: 他哥哥以扫
  rationale: ἀδελφός本身只表示兄弟，但创世记叙事明确以扫是雅各的哥哥；汉语按自然亲属称谓表达。
theological_decisions:
- issue: “嫉妒”的主体是否明确
  choice: 保留无明确主体的原因短语“由于嫉妒”
  alternative: 译为“由于以扫的嫉妒”或“因为受到嫉妒”
  rationale: 原文没有明说是谁嫉妒，也没有以语法形式明确雅各是施事者还是受害者；不应在正文中擅自补足。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；整体贴近原文，并保留“面”的圣经式意象及嫉妒主体的含混性。
