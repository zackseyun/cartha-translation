  source_fidelity: 原文“διὰ ζῆλος”可译为“由于嫉妒”；其嫉妒主体未明，应保持不明。“ὁ πατὴρ ἡμῶν”在此祖先叙述中译作“我们的先祖”合适。“ἀπέδρα ἀπὸ προσώπου”意为“从……面前逃走”；草稿的“逃离了……的面”虽试图保留字面意象，但现代汉语不自然，且“面”不能独立指“面前”。“Ἠσαῦ τοῦ ἀδελφοῦ αὐτοῦ”直指“他的兄弟以扫”，原文未标明兄长；即使创世记背景中以扫为兄长，正文不宜补入。
