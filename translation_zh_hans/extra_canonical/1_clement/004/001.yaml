base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/001.yaml
  text: 'For it is written thus: “And it came to pass after some days that Cain brought from the fruits of the earth an offering to God, and Abel also brought from the firstborn of the sheep and from their fat portions.'
translation:
  language: zh_hans
  text: 因为经上这样记着：“过了些日子，该隐把地里的出产献给上帝作祭物；亚伯也把羊群中头生的羊，以及它们的脂肪献上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自《创世记》4:3–4（七十士译本措辞）；本句在此处尚未结束，后文接续引文。
    reason: 说明引文来源，并提示原始节选止于未闭合的引文处，避免擅自补全。
lexical_decisions:
- source_word: Γέγραπται γὰρ οὕτως
  choice: 因为经上这样记着
  rationale: 保留γὰρ的因果衔接和经文引用公式的庄重语气；用现代汉语自然表达。
- source_word: μεθ' ἡμέρας
  choice: 过了些日子
  rationale: 原文没有明确具体天数，此译保留其不确定性。
- source_word: ἀπὸ τῶν καρπῶν τῆς γῆς
  choice: 地里的出产
  rationale: καρποί在这里泛指土地所产之物，“出产”比字面的“果子”涵盖更广。
- source_word: θυσίαν
  choice: 祭物
  rationale: 在献给上帝的语境中指供献之物；译为“祭物”简洁且符合上下文。
- source_word: τῶν πρωτοτόκων τῶν προβάτων
  choice: 羊群中头生的
  rationale: 保留“头生”这一祭献语汇；πρόβατα在此按语境译为羊群。
- source_word: τῶν στεάτων αὐτῶν
  choice: 它们的脂肪
  rationale: 直接反映原文，避免擅自具体化为某些特定肥美部位。
theological_decisions:
- issue: 亚伯所献之物的句法关系
  choice: 把“羊群中头生的”与“它们的脂肪”并列呈现
  alternative: 把后者解释为头生羊中最肥美的部分
  rationale: 原文以两个ἀπό短语并列，可能指头生羊及其脂肪；译文不把它神学化或解释为品质等级，以保留文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；尽量保留希腊文引述公式、并列结构和不确定表达。
