  text: Jealousy caused Joseph to be persecuted even to death and to enter into slavery[a].
translation:
  language: zh_hans
  text: 嫉妒使约瑟遭受迫害，几乎丧命，并沦为奴隶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“遭受迫害，直至死亡，并陷入奴役。”
    reason: 保留μέχρι在两个短语中表示所达限度或境地的较形式对应译法；主文以“几乎丧命”明确其逼近死亡而非实际死亡的含义。
lexical_decisions:
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 在本段列举嫉妒所造成恶果的语境中，指负面的嫉妒，而非中性的热心。
- source_word: ἐποίησεν
  choice: 使
  rationale: 保留使役关系：嫉妒导致约瑟遭遇后述两件事。
- source_word: μέχρι θανάτου διωχθῆναι
  choice: 遭受迫害，几乎丧命
  rationale: μέχρι 表示所达到的限度；结合约瑟并未实际死亡的叙事背景，用“几乎丧命”自然表达迫害逼近死亡，而不误解为已经被害死。
- source_word: μέχρι δουλείας εἰσελθεῖν
  choice: 沦为奴隶
  rationale: 表达进入奴役状态及其被动、屈辱的处境，比逐字译作“进入奴役”更符合现代汉语。
theological_decisions:
- issue: “直到死亡”是否表示约瑟实际死亡
  choice: 译作“几乎丧命”
  alternative: “被迫害至死”或“遭受迫害，直到死亡”
  rationale: 原文 μέχρι θανάτου 可表示迫害所逼近的极限；约瑟故事明确没有以死亡告终，因此避免让现代读者误以为他实际被杀，同时保留死亡威胁的强度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“几乎丧命”避免“至死”可能造成的事实误读；“沦为奴隶”简洁呈现约瑟被卖为奴的处境。
