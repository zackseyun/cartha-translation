  text: καὶ εἶπεν ὁ θεὸς πρὸς Κάϊν· Ἱνατί περίλυπος ἐγένου, καὶ ἱνατί συνέπεσεν τὸ πρόσωπόν σου; οὐκ ἐὰν ὀρθῶς προσενέγκῃς, ὀρθῶς δὲ μὴ διέλῃς, ἥμαρτες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/004.yaml
  text: And God said to Cain, ‘Why have you become grieved, and why has your face fallen? If you offer rightly, but do not divide rightly, have you not sinned?’
translation:
  language: zh_hans
  text: 上帝对该隐说：“你为什么变得忧愁？为什么你的脸色沉下来？你若献得合宜，却分得不合宜[a]，不是犯了罪吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分得不合宜”：原文直译如此，也可理解为“没有正确分配”；原文没有说明所分的是什么。
    reason: 说明希腊语διέλῃς的基本字面意义，并保留其所指对象未明的歧义。
lexical_decisions:
- source_word: περίλυπος
  choice: 忧愁
  rationale: 表达因悲伤、苦恼而心情沉重；不额外加入原文未明确要求的程度副词。
- source_word: συνέπεσεν τὸ πρόσωπόν σου
  choice: 沉下脸来
  rationale: 以自然现代汉语保留“脸落下”的形象，表示面容低沉、沮丧。
- source_word: ὀρθῶς προσενέγκῃς
  choice: 献得合宜
  rationale: προσφέρω在此指献上供物或祭物；“合宜”传达ὀρθῶς的“正确、恰当”，同时避免生硬措辞。
- source_word: ὀρθῶς δὲ μὴ διέλῃς
  choice: 却分得不合宜
  rationale: 保留διαιρέω“分开、分配”的基本意义及原句不寻常的祭献措辞，不擅自解释具体所分之物。
- source_word: ἥμαρτες
  choice: 犯了罪
  rationale: 准确表达ἁμαρτάνω在此处的道德和宗教含义。
theological_decisions:
- issue: “分得不合宜”具体所指
  choice: 正文保留“分”的模糊性，并用脚注提示原文措辞
  alternative: 解释为没有正确分配祭物、没有分别祭物，或没有端正行为
  rationale: 希腊文本本身没有说明所分的对象；直接选定某种祭祀程序或伦理解释会消除原有歧义。
- issue: 末句的反问语气
  choice: 译作“不是犯了罪吗？”
  alternative: 译作陈述句“你就犯了罪”
  rationale: οὐκ与问号支持反问读法，且与所给文本的句法和语气相符。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“沉下脸来”保留原文意象；“献得合宜／分得不合宜”呈现平行结构，并保留希腊文祭献语境中的张力和歧义。
