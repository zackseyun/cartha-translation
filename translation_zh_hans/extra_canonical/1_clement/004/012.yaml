  text: ζῆλος Δαθὰν καὶ Ἀβειρὼν ζῶντας κατήγαγεν εἰς ᾅδου διὰ τὸ στασιάσαι αὐτοὺς πρὸς τὸν θεράποντα τοῦ θεοῦ Μωυσῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/012.yaml
  text: Jealousy brought Dathan and Abiram down alive into Hades because they rebelled against Moses[a], the servant of God.
translation:
  language: zh_hans
  text: 嫉妒使大坍和亚比兰活着下到阴间，因为他们反叛了上帝的仆人摩西。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 在本段列举嫉妒所造成恶果的语境中，指负面的嫉妒或争竞之心；“嫉妒”自然且贴合上下文。
- source_word: ζῶντας κατήγαγεν εἰς ᾅδου
  choice: 使……活着下到阴间
  rationale: 保留“活着”这一强调，也以“下到”对应 κατήγαγεν 的方向意味；“阴间”表达 ᾅδης 所指的死者境域，不径自解释为最终刑罚之地。
- source_word: στασιάσαι
  choice: 反叛
  rationale: 该词表示结党作乱、反抗权柄；此处民数记背景下，“反叛”比一般的“反对”更能传达事件的严重性。
- source_word: θεράποντα τοῦ θεοῦ
  choice: 上帝的仆人
  rationale: θεράπων 在摩西传统中是尊荣称号；“仆人”保留其圣经语感及事奉关系，较“侍从”自然且不削弱其分量。
theological_decisions:
- issue: ᾅδου 的译法
  choice: 阴间
  alternative: 冥府／地狱
  rationale: 原文指哈得斯，即死者所在之境；译作“地狱”可能过早限定为最终惩罚之所，因此采用较中性的“阴间”。
- issue: θεράπων 用于摩西的称号
  choice: 上帝的仆人摩西
  alternative: 上帝的侍从摩西
  rationale: “仆人”准确保留此称号的尊荣和圣经传统，同时避免引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。人名按通行圣经译名处理；语序尽量自然，同时保留原文中嫉妒为施事者、二人“活着”下到阴间以及反叛摩西的因果关系。
