review_pass:
  verdict: revise
  source_fidelity: “安静下来”准确传达ἡσύχασον的单数命令。后半句草稿将ἡ ἀποστροφὴ αὐτοῦ（字面为“他的转向／归向”）改为带将来意味的“他必转向你”，不当地把名词性、无明确时态的表述处理为将来动作；“必”只应对应ἄρξεις。所给希腊文本在πρὸς后未见宾语，句法上异常；英语审校轨迹及该处引文传统均按“向着你”理解，故修订按此读法翻译，同时建议核对希腊底本是否漏录σέ。
  naturalness: “他转向你”是自然现代汉语，也避免“他的转向是朝着你”过于生硬。用分号分隔两个谓语结构，保持原文简洁、庄重的引语体。
  terminology: “管辖”适切表达ἄρχω加属格的统治、支配意义。“安静下来”可保留。代词“他”不解释其具体所指，因而不预设神学或解释传统。
  issues:
  - severity: medium
    issue: “他必转向你”把名词性表述处理成将来动作。
    rationale: ἡ ἀποστροφὴ αὐτοῦ本身没有将来时；原句的将来语气明确见于ἄρξεις。“必”不应同时扩展到前一分句。
  - severity: high
    issue: 所提供的希腊底本文字在πρὸς后缺少明示宾语。
    rationale: πρὸς δὲ ἡ ἀποστροφὴ αὐτοῦ按现有转录句法异常；英语轨迹译为“toward you”，并与通常引文读法相符，显示底本或OCR可能漏录σέ。此处应由人工核对版面或校勘资料。
  revised_text: 安静下来；他转向你；你必管辖他。’
  revised_footnotes: []
  revision_rationale: 修订删除前一分句无依据的将来副词“必”，以自然汉语保留“他的转向朝向你”的关系；“你必管辖他”保留原有将来和支配含义。未添加解释性脚注，亦未界定“他”的所指。由于所给希腊转录存在疑似漏字，正文暂依英语审校轨迹所反映的“向着你”读法处理。
