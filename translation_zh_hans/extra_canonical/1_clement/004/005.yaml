  text: Be still; his turning is toward you, and you shall rule over him.’
translation:
  language: zh_hans
  text: 安静下来；他的转向是朝着你，你必管辖他。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασον
  choice: 安静下来
  rationale: 保留第二人称单数命令语气，表达停止躁动、平静下来的意思。
- source_word: ἡ ἀποστροφὴ αὐτοῦ
  choice: 他必转向你
  rationale: ἀποστροφή本可指“转向、归向”，此处依句法与引文语境用动词化表达，使现代汉语自然；代词所指仍按原文保留，不加解释。
- source_word: ἄρξεις αὐτοῦ
  choice: 你也必管辖他
  rationale: ἄρχω加属格表示统治、管辖；“必”体现将来时，“管辖”保持关系中的支配意味。
theological_decisions:
- issue: 男性代词“他”的所指
  choice: 保留“他”，不在正文中明确其所指
  alternative: 解释为罪、冲动或兄弟
  rationale: 希腊文本仅使用阳性代词αὐτοῦ，所指存在解释空间；译文不应替原文消除这种含混。
- issue: 与《创世记》4:7传统措辞的关系
  choice: 按本段现存希腊文直译其命令和关系结构
  alternative: 直接套用某一现代《创世记》译本的固定表述
  rationale: 本句虽呼应《创世记》4:7，却应以《革利免一书》的希腊文本为首要依据，避免由后来的译本传统反向改写。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留原句的命令、转向和管辖三层结构。末尾引号表明这是前文引语的结尾。
