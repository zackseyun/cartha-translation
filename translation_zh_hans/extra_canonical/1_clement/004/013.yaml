  text: Because of jealousy David incurred envy not only from the foreigners[a], but was also persecuted by Saul king of Israel.
translation:
  language: zh_hans
  text: 因嫉妒，大卫不仅受到外族人[a]的嫉恨，也受到以色列王扫罗的追逼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“外族人”也可能特指非利士人。
    reason: ἀλλόφυλοι 的词面意义较宽；但在希腊文旧约的大卫叙事中，此词常用来指非利士人。
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: 因着嫉妒
  rationale: 保留原文简短的因果表达及其未明说嫉妒者是谁的含混性；不擅自补成“大卫因嫉妒”或“别人因嫉妒大卫”。
- source_word: φθόνον ἔσχεν ὑπὸ
  choice: 招致……的嫉恨
  rationale: 该结构表示成为他人嫉妒、怨恨的对象；“招致……的嫉恨”既贴近字面，又符合现代汉语表达。
- source_word: τῶν ἀλλοφύλων
  choice: 外族人
  rationale: ἀλλόφυλοι直指异族、外族之人；在七十士译本相关叙事中常特指非利士人，因此以脚注说明可能所指。
- source_word: ἐδιώχθη
  choice: 受到……的追逼
  rationale: 被动形式表示大卫遭扫罗追赶、迫害；“追逼”兼顾实际追赶和敌意迫害。
theological_decisions:
- issue: “因着嫉妒”的主体
  choice: 不补明主体
  alternative: 译作“因为别人嫉妒大卫”
  rationale: 希腊文只陈述嫉妒是事情的缘由，并未在该短语中明示主体；保留这种张力，避免解释性增译。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以“不仅……也……”呈现两个并列的被动遭遇，并保留原文中“嫉妒”与“嫉恨”的词义呼应。
