translation:
  language: zh_hans
  text: 弟兄们，你们看，嫉妒和妒恨导致了杀害弟兄的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾶτε
  choice: 你们看
  rationale: 保留第二人称复数命令语气；在现代汉语中自然地引导读者留意前述事例。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 符合早期基督教群体称呼的语境，语体庄重而通俗。
- source_word: ζῆλος καὶ φθόνος
  choice: 嫉妒和猜忌
  rationale: 两个词语义相近且可重叠；分别译出，以保留原文并列及其修辞力度。ζῆλος在此处语境中带负面意味，译作“嫉妒”；φθόνος指因他人所得而生的恶意妒恨，以“猜忌”作近义区分。
- source_word: ἀδελφοκτονίαν
  choice: 手足相残
  rationale: 自然表达杀害兄弟这一含义，也呼应前面的“弟兄们”；“相残”在汉语中可涵盖致死，但不如“杀害兄弟”明示死亡，因此在决策中予以说明。
- source_word: κατειργάσατο
  choice: 竟导致了
  rationale: 表达造成、酿成结果；“竟”体现句子的警示和修辞力度，但不是独立词义成分。
theological_decisions:
- issue: ἀδελφοκτονία是否应理解为一般性的“自相残杀”还是具体的“杀害兄弟”
  choice: 手足相残
  alternative: 杀害兄弟
  rationale: 上下文很可能指该隐杀害亚伯，原词也明确含“兄弟”与“杀害”；“手足相残”在中文中既自然又保留兄弟相害的意象，不额外点明该隐，以免把语境推断写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。保留“你们看”的命令式和“弟兄们”的直接称呼；句序稍作汉语化处理。
