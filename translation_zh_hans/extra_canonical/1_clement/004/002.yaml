base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/002.yaml
  text: And God looked upon Abel and upon his gifts[a], but to Cain and to his sacrifices he paid no heed.
translation:
  language: zh_hans
  text: 上帝垂顾亚伯和他的礼物，却不顾该隐和他的祭物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν ... ἐπὶ
  choice: 看顾
  rationale: 此处不是单指视觉上的“看见”，而是指上帝对亚伯及其礼物予以关注和悦纳；“看顾”既保留“看”的意象，也表达有利的关注，并与后句形成对照。
- source_word: δῶροις
  choice: 礼物
  rationale: 按原词通常意义直译为“礼物”，避免擅自将其与后面的“祭物”合并为同一术语。
- source_word: θυσίαις
  choice: 祭物
  rationale: 该词指献祭之物；“祭物”自然、准确，也能与“礼物”保持原文的词汇差异。
- source_word: οὐ προσέσχεν
  choice: 不理会
  rationale: 表达“没有留意、没有给予关注”，在现代汉语中自然有力，并保留原文与前半句之间的鲜明反差。
theological_decisions:
- issue: 上帝对亚伯的正面回应是否应明确译作“悦纳”
  choice: 看顾
  alternative: 悦纳
  rationale: 上下文确有悦纳之意，但原文使用“看向/关注”而非明确表示接纳的动词；译作“看顾”可传达正面关注，同时避免把隐含意义完全明说。
- issue: 对该隐及其祭物的否定是否应解释为拒绝
  choice: 不理会
  alternative: 不悦纳
  rationale: 原文直接说没有给予关注，并未使用明确的“拒绝”或“不悦纳”；保留这种措辞可避免消解原文的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。句式保留“亚伯和他的礼物／该隐和他的祭物”的平行结构，并以“却”清楚呈现转折。原文无必须另注的文本歧义，因此不设脚注。
