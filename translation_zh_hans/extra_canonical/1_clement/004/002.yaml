  text: καὶ εἶδεν ὁ θεὸς ἐπὶ Ἄβελ καὶ ἐπὶ τοῖς δώροις αὐτοῦ, ἐπὶ δὲ Κάϊν καὶ ἐπὶ ταῖς θυσίαις αὐτοῦ οὐ προσέσχεν.
