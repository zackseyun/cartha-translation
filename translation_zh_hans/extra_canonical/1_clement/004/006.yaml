  text: And Cain said to Abel his brother[a], ‘Let us go into the field.’ And it came to pass, while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: zh_hans
  text: 该隐对他的兄弟亚伯说：“我们到田野去吧。”[a] 他们在田野的时候，该隐起来攻击他的兄弟亚伯，把他杀了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们出去，到田野去吧。”
    reason: διέλθωμεν可突出从当前所在之处出去、前往田野；正文采用更自然且不额外强化起点的表达。
lexical_decisions:
- source_word: Διέλθωμεν εἰς τὸ πεδίον
  choice: 我们到田野去吧
  rationale: διέρχομαι在此与εἰς连用，表示从一处前往另一处；译文自然表达“到田野去”，避免“穿过田野”所暗示的不同目的地。
- source_word: ἀνέστη ... ἐπʼ
  choice: 起来攻击
  rationale: 保留ἀνίστημι“起来”的叙事形象，并以“攻击”表达ἐπί在敌对语境中的含义。
- source_word: ἀπέκτεινεν
  choice: 杀了
  rationale: 直接对应“杀死”，用现代汉语简洁呈现动作及其完成性。
