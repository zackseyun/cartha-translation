  text: 由于嫉妒，亚伦和米利暗在营外过夜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: 因嫉妒
  rationale: 按上下文取原因义；ζῆλος在此指负面的嫉妒。原文名词形式异常，但意义清楚。
- source_word: παρεμβολῆς
  choice: 营
  rationale: 该词在此指以色列人的营地；译作“营”简洁，并符合相关经事的传统语境。
- source_word: ηὐλίσθησαν
  choice: 住宿
  rationale: 该动词本义为过夜、住宿；保留其具体含义，不扩大解释为单纯“被赶出去”或“被隔离”。
theological_decisions:
- issue: 亚伦和米利暗在营外住宿的原因及共同主语
  choice: 依原文直译为二人都“因嫉妒”而在营外住宿
  alternative: 按《民数记》12章的叙事细节，仅说明米利暗被隔离在营外
  rationale: 本句明确以亚伦和米利暗为复数主语，并把嫉妒表述为原因；译文保留《革利免一书》自身的概括，不用希伯来圣经平行叙事修正它。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“在营外住宿”贴近希腊语动作表达，也避免加入原文没有明说的惩罚方式。
