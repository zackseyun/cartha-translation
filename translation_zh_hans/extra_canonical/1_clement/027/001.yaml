  text: Ταύτῃ οὖν τῇ ἐλπίδι προσδεδέσθωσαν αἱ ψυχαὶ ἡμῶν τῷ πιστῷ ἐν ταῖς ἐπαγγελίαις καὶ τῷ δικαίῳ ἐν τοῖς κρίμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/001.yaml
  text: In this hope, then, let our souls be bound to the One who is faithful in his promises and righteous in his judgments.
translation:
  language: zh_hans
  text: 所以，愿我们的心灵在这盼望中，与那位在应许上信实、在审判上公义者紧紧相连。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，愿我们的心灵与这盼望紧紧相连，就是在那位信实者里面的盼望。”
    reason: 保留将“这盼望”理解为连结对象、并将“那位信实者”理解为盼望所在者的另一种句法分析；正文采用更符合 προσδέω 与与格搭配的理解。
lexical_decisions:
- source_word: ἐλπίδι
  choice: 盼望
  rationale: 准确表达基督教希腊语中对所期待之事的坚定指望；介词化译为“在这盼望中”，体现此处与格所表示的范围或凭借。
- source_word: προσδεδέσθωσαν
  choice: 愿……紧紧相连
  rationale: 保留完成时被动命令式所含的持续连结状态，并以自然中文表达劝勉语气。
- source_word: τῷ πιστῷ
  choice: 与那位……信实的
  rationale: 该与格是 προσδέω 所连接的对象；阳性单数形容词名词化，所指身份未明说，故译作“那位”而不擅自补入“上帝”。
- source_word: ἐπαγγελίαις
  choice: 应许
  rationale: 在此指所作的承诺；中文用集合性的“应许”自然涵盖希腊文复数。
- source_word: δικαίῳ
  choice: 公义
  rationale: 表达符合正义、判断正直的属性，并与“信实”形成平行结构。
- source_word: κρίμασιν
  choice: 审判
  rationale: 保留判决、裁断及其司法意味；集合性译法适合现代中文。
theological_decisions:
- issue: τῷ πιστῷ 所指者的身份
  choice: 译作“那位”，不在正文补出身份
  alternative: 译作“上帝”或“主”
  rationale: 上下文很可能指上帝，但本句希腊文仅以名词化形容词表达；保留原文含蓄，避免把推断写进正文。
- issue: Ταύτῃ……τῇ ἐλπίδι 与 προσδεδέσθωσαν 的关系
  choice: 理解为范围或凭借：“在这盼望中”
  alternative: 理解为连结的对象：“与这盼望相连”
  rationale: 动词 προσδέω 的连结对象更自然是与格 τῷ πιστῷ；因此按主要句法分析翻译，同时以脚注保留旧有或次要理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“心灵”对应 ψυχαί，避免“灵魂”在现代语境中可能引出的狭窄二元论联想；“在应许上……在审判上……”保留希腊文平行结构。
