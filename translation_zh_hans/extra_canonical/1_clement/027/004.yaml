  source_fidelity: 原文以两个平行的 ἐν λόγῳ（“凭／借着话语”）表达施行方式；前者带“他的威严”这一属格限定，后者不带限定语。草案总体忠实，但“自己威严的话语”在汉语中较易读成“他自己所说的、很威严的话”，没有清楚呈现“他的威严”的限定关系。συνεστήσατο 在此以“建立”较直接对应“建立、使成立”；καταστρέψαι 译为“倾覆”保留推翻、颠覆的强度，合宜。
  naturalness: “以……的话语”可以理解，但“凭……的话语”更符合现代书面汉语的施事手段表达。“建立万物”也比“使万物立定”更简洁自然，同时不必将该动词特指为从无创造。
  terminology: 保留“话语／一句话”的前后呼应，不将 λόγος 专名化为“道”。“威严”适切对应 μεγαλωσύνη；“万物”适切对应 τὰ πάντα；“倾覆”可表达 καταστρέψαι 的强烈颠覆意味。
