  text: By the word of his majesty he established all things, and by a word he is able to overthrow them.
translation:
  language: zh_hans
  text: 他凭他威严的话语建立万物，也能凭一句话倾覆它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λόγῳ
  choice: 以……的话语／以一句话
  rationale: 介词短语表示凭借或方式。前半句与属格短语相连，译作“以自己威严的话语”；后半句不带冠词且语境突出神只须发令即可行动，译作“以一句话”，同时保留两处 λόγος 的呼应。
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: 自己威严的
  rationale: μεγαλωσύνη 表示崇高、威严或尊荣；“威严”自然庄重，并使 αὐτοῦ 所指清楚。
- source_word: συνεστήσατο
  choice: 使……立定
  rationale: 该动词在此可指建立、构成或使之存立。“使万物立定”既涵盖创造和维系的语义空间，也不过度限定具体机制。
- source_word: τὰ πάντα
  choice: 万物
  rationale: 惯用而凝练地表达“一切事物”。
- source_word: καταστρέψαι
  choice: 倾覆
  rationale: 该词可表示推翻、毁坏或彻底颠覆；“倾覆”保留其强烈程度，同时避免擅自将意义收窄为彻底消灭。
theological_decisions:
- issue: λόγος 是否应人格化为专名“道”
  choice: 译作普通名词“话语／一句话”
  alternative: “道”
  rationale: 本句语法和上下文首先强调神以言语施行权能，并未明确要求将 λόγος 解释为人格化称号；因此不导入后来的专名化理解。
- issue: συνεστήσατο 是否明确指从无创造
  choice: “使万物立定”
  alternative: “创造了万物”
  rationale: 原词语义比“从无创造”宽，可包括建立、组成、使之存立；采用较开放的表达，以保存原文可能的语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留前后“话语／一句话”的修辞呼应，并用“立定—倾覆”呈现原句的鲜明对照。
