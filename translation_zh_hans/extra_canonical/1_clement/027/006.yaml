  text: πάντα ἐνώπιον αὐτοῦ εἰσίν, καὶ οὐδὲν λέληθεν τὴν βουλὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/006.yaml
  text: All things are before him[a], and nothing has escaped his counsel.
translation:
  language: zh_hans
  text: 一切都在他面前；没有什么能瞒过他的谋虑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋虑”也可译作“意旨”或“计划”。
    reason: 保留βουλή在“谋议、谋断”与“意旨、计划”之间的词义幅度。
lexical_decisions:
- source_word: πάντα
  choice: 一切
  rationale: 概括万有、万事，保留原文不加限定的全称范围。
- source_word: ἐνώπιον αὐτοῦ
  choice: 在他面前
  rationale: 直译空间性表达，并保留其引申的全然显明之意。
- source_word: λέληθεν
  choice: 无所不察
  rationale: 该完成时动词表示“未能逃过注意、未被隐藏”；结合汉语句法转换为肯定式，传达没有任何事物瞒过或逃过察知的含义。
- source_word: βουλή
  choice: 谋虑
  rationale: 既可指审议、谋断，也可引申为意旨或计划；“谋虑”在本句中能承接察知含义，同时不把词义单一定为已制定的计划。
theological_decisions:
- issue: βουλή是指神的谋断能力，还是神的意旨或计划
  choice: 正文译作“谋虑”，保留审议、谋断的语义，并以脚注说明其他可能译法。
  alternative: 意旨；计划；筹算
  rationale: 语境强调一切都不能逃过神，原文又容许βουλή兼有“谋议”和“意旨、计划”之义；不宜把句子仅解释为神的计划不可受挫，也不宜完全抹去目的性的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“无所不察”以简洁的汉语表达原文“没有什么逃过其察知”的结构；分号保留两分句之间紧密的递进关系。
