  text: Τίς ἐρεῖ αὐτῷ· Τί ἐποίησας; ἢ τίς ἀντιστήσεται τῷ κράτει τῆς ἰσχύος αὐτοῦ; ὅτε θέλει καὶ ὡς θέλει, ποιήσει πάντα καὶ οὐδὲν μὴ παρελθῇ τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/005.yaml
  text: Who will say to him, “What have you done?” Or who will withstand the might of his strength? When he wills, and as he wills, he will do all things, and not one of the things decreed by him shall ever pass away.
translation:
  language: zh_hans
  text: 谁能对他说：“你做了什么？”谁又能抗拒他力量的权势？他何时愿意、怎样愿意，就必行一切；他所定规的事，没有一件会落空。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: 抗拒
  rationale: 表达迎面抵挡、与之对抗之意，符合此处反问所强调的无人能抵挡上帝。
- source_word: τῷ κράτει τῆς ἰσχύος αὐτοῦ
  choice: 他大能的威力
  rationale: 保留 κράτος 与 ἰσχύς 叠加强调力量和权能的表达，同时使现代汉语自然凝练。
- source_word: ὅτε θέλει καὶ ὡς θέλει
  choice: 他愿意何时成就，就何时成就；他愿意怎样成就，就怎样成就
  rationale: 分别保留 ὅτε 的时间含义和 ὡς 的方式含义；补出“成就”以使汉语完整，并与后句 ποιήσει 呼应。
- source_word: ποιήσει πάντα
  choice: 他必成就万事
  rationale: ποιέω 在此涉及意旨的实现，用“成就”比宽泛的“做”更贴合上下文；将来时译作“必”，传达确定性。
- source_word: τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ
  choice: 凡他所定的
  rationale: δεδογματισμένων 指已经裁定、命定之事；“所定的”保留范围上的概括，也避免额外引入特定教义术语。
- source_word: οὐδὲν μὴ παρελθῇ
  choice: 没有一件会落空
  rationale: 双重否定加强绝不失效之意；παρέρχομαι 在此不是单纯时间上的“过去”，而是所定之事未能实现，故译“落空”。
theological_decisions:
- issue: 上帝旨意的主权与实现
  choice: 以“必成就万事；凡他所定的，没有一件会落空”表达其旨意必然实现
  alternative: “他必做成一切，他所颁定的没有一件会过去”
  rationale: 本译保留原文对其意志与命定之事不可受阻的强调，但不进一步界定“万事”的哲学或教义范围。
- issue: ὅτε 与 ὡς 所表达的自由
  choice: 明确译出“何时”与“怎样”两个层面
  alternative: 合并为“他随己意行一切”
  rationale: 原文有意并列时间与方式，展开翻译可避免丢失这一修辞和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前两句保留反问气势；后半段通过平行句式呈现希腊文“何时／怎样”的结构。全节无需脚注。
