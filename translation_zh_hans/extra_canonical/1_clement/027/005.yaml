  to: 谁能对他说：“你做了什么？”谁又能抗拒他力量的权势？他何时愿意、怎样愿意，就必行一切；他所定规的事，没有一件会落空。
  rationale: 修订将“何时”和“怎样”恢复为共同修饰“必行一切”的并列状语，避免不必要的重复扩展；并补明末句所指为“所定规的事”。“会落空”在此语境中表达原文所强调的任何神圣定规都不会失效，未额外界定其教义含义。
