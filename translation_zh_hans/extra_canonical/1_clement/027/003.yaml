  yaml_path: translation/extra_canonical/1_clement/027/003.yaml
  text: Therefore let faith in him be rekindled in us, and let us understand that all things are near to him.
translation:
  language: zh_hans
  text: 所以，愿对他的信心在我们里面重新燃起；让我们明白，万物对他都不遥远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζωπυρησάτω
  choice: 愿……重新燃起
  rationale: 该词以复燃火焰为喻，意为重新激发、使之旺盛；用“重新燃起”保留原文意象及第三人称命令式所带的劝愿语气。
- source_word: ἡ πίστις αὐτοῦ
  choice: 对他的信心
  rationale: 属格 αὐτοῦ 在此可理解为信心所指向的对象；结合语境译为“对他的信心”，同时避免较生硬的“他的信心”。
- source_word: νοήσωμεν
  choice: 让我们明白
  rationale: 保留第一人称复数劝勉式，表达共同领会、认识之意。
- source_word: πάντα
  choice: 万物
  rationale: 简洁保留“所有事物／一切”的广泛范围。
- source_word: ἐγγὺς αὐτῷ
  choice: 对他来说都是近在咫尺的
  rationale: 与格 αὐτῷ 表示相对于他；“近在咫尺”自然传达毫无遥远或阻隔之意，同时保留“近”的空间隐喻。
theological_decisions:
- issue: πίστις αὐτοῦ 中属格的含义
  choice: 对他的信心
  alternative: 他的信实／他所赐的信心
  rationale: 原文属格在语法上可有不同理解，但上下文的劝勉最自然地指群体对上帝的信靠；译文采用对象属格理解，不额外引入“所赐”或将 πίστις 改释为上帝的“信实”。
- issue: “万物都临近他”的含义
  choice: 万物对他来说都是近在咫尺的
  alternative: 万事在他面前都迫近／一切都在他的掌握之中
  rationale: 保留 ἐγγύς 的“近”这一开放性表达，不将其收窄为时间上的迫近、认知上的显明或主权掌控。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“重新燃起”延续希腊文的火焰隐喻；分号呈现两个并列劝勉。未添加原文没有的神学限定。
