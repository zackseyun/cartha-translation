  text: ὁ παραγγείλας μὴ ψεύδεσθαι, πολλῷ μᾶλλον αὐτὸς οὐ ψεύσεται· οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ, εἰ μὴ τὸ ψεύσασθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/002.yaml
  text: He who commanded not to lie will much more not lie himself; for nothing is impossible with God[a], except to lie.
translation:
  language: zh_hans
  text: 那位吩咐“不可说谎”的，自己就更不会说谎；因为在上帝那里，没有什么是不可能的，唯有说谎除外。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραγγείλας
  choice: 那位吩咐……的
  rationale: 以名词化关系结构表达带冠词的过去分词，所指为上帝；保留原文未明说受命对象这一点。
- source_word: μὴ ψεύδεσθαι
  choice: 不可说谎
  rationale: 自然表达否定命令的内容，不补入原文没有的“我们”。
- source_word: πολλῷ μᾶλλον
  choice: 就更
  rationale: 传达由上帝的命令推及上帝自身行为的强烈递进论证。
- source_word: αὐτὸς οὐ ψεύσεται
  choice: 自己就更不会说谎
  rationale: 用“自己”保留 αὐτός 的强调，以“不会”表达将来式在此所含的确定断言。
- source_word: οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ
  choice: 因为在上帝没有什么是不可能的
  rationale: 沿用圣经式而仍清楚自然的表达；παρὰ τῷ θεῷ 表示在上帝那里、就上帝而言。
- source_word: εἰ μὴ τὸ ψεύσασθαι
  choice: 唯有说谎除外
  rationale: 保留 εἰ μή 的例外结构，以及不定式名词化所指的“说谎”这一行为。
theological_decisions:
- issue: “上帝无所不能”与“不能说谎”的张力
  choice: 按原文直陈“没有什么是不可能的，唯有说谎除外”
  alternative: 解释为“上帝凡事都能，只是本性使他不会说谎”
  rationale: 原文刻意采用例外式悖论表达；译文不以神学解释消解其张力。
- issue: 命令的受命对象
  choice: 不补出“我们”或“人”
  alternative: “那位吩咐我们不可说谎的”
  rationale: 希腊文未明示宾语；虽然语境可自然理解为对人的命令，正文仍保留其形式上的未明确性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那位……的”明确承接上帝，同时保留原句的修辞推进；不添加原文没有的受命对象，也不另加解释性脚注。
