  text: εἰ οἱ οὐρανοὶ διηγοῦνται δόξαν θεοῦ, ποίησιν δὲ χειρῶν αὐτοῦ ἀναγγέλλει τὸ στερέωμα· ἡ ἡμέρα τῇ ἡμέρᾳ ἐρεύγεται ῥῆμα, καὶ νὺξ νυκτὶ ἀναγγέλλει γνῶσιν· καὶ οὐκ εἰσὶν λόγοι οὐδὲ λαλιαί, ὧν οὐχὶ ἀκούονται αἱ φωναὶ αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/007.yaml
  text: The heavens declare the glory of God[a], and the firmament proclaims the work of his hands; day to day pours forth speech, and night to night announces knowledge. There are no words or utterances whose voices are not heard.
translation:
  language: zh_hans
  text: 诸天述说神的荣耀[a]，穹苍传扬他手所做的；日复一日涌出言语，夜复一夜传递知识。没有一种言语或话语，是听不见其声音的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句开头的规范化OCR作“εἰ”（“如果”或“既然”）；但原版字体和所引《诗篇》18:2（七十士译本编号）表明，应读作“οἱ”（定冠词），即“诸天述说……”。
    reason: 说明源文本的OCR异文，并交代正文未译作条件句或原因从句的依据。
lexical_decisions:
- source_word: οἱ οὐρανοί
  choice: 诸天
  rationale: 保留希腊文复数，并采用自然、庄重的汉语圣诗用语。
- source_word: τὸ στερέωμα
  choice: 穹苍
  rationale: 表达可见天空或苍穹的古代宇宙图景，避免用现代科学术语改写。
- source_word: ποίησιν χειρῶν αὐτοῦ
  choice: 他双手所做的
  rationale: ποίησις在此指所造、所做之工；保留“手”的具体意象，并以“双手”自然体现希腊文复数。
- source_word: ἐρεύγεται ῥῆμα
  choice: 涌出言语
  rationale: ἐρεύγεται有喷涌、倾吐之意；“涌出”既保留动态形象，也符合现代汉语。
- source_word: ἀναγγέλλει γνῶσιν
  choice: 传报知识
  rationale: 兼顾ἀναγγέλλω的宣告、传达含义与γνῶσις的“知识”本义。
- source_word: ἡ ἡμέρα τῇ ἡμέρᾳ / νὺξ νυκτί
  choice: 日复一日／夜复一夜
  rationale: 以自然汉语表达日期与日期、夜晚与夜晚之间持续不断的传递关系。
- source_word: λόγοι / λαλιαί
  choice: 言语／话音
  rationale: 保留两个近义词的并列：前者偏重言辞，后者偏重口头表达或话音。
theological_decisions:
- issue: 首词εἰ是否应译作条件或原因连接词
  choice: 按定冠词οἱ理解，直译为“诸天述说”
  alternative: 按现存规范化OCR的εἰ译作“既然／如果诸天述说”
  rationale: 该处引自《诗篇》18:2—4（七十士译本编号），Funk旧版印刷体中的Οἱ很可能被OCR误识为εἰ；按εἰ理解会使句法残缺或错误地把后文当作结果句。
- issue: 末句的普遍范围与代词指向
  choice: 译作“没有哪一种言语或话音听不见它们的声音”
  alternative: 译作“无言无语，也无声音可听”
  rationale: 依希腊文οὐκ εἰσὶν…ὧν οὐχὶ ἀκούονται保留“没有……是听不见的”这一普遍否定结构，不以希伯来文本的另一种表达取代七十士译本措辞；“它们”保留原文αὐτῶν的指向张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留诗歌的平行结构与宇宙图景。“日复一日／夜复一夜”使希腊文与格关系在汉语中自然呈现，末句则尽量保留希腊文本身略显紧张的表述和代词歧义。
