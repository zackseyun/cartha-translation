  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς γὰρ παρεπιδημήσας πρὸς ὑμᾶς τὴν πανάρετον καὶ βεβαίαν ὑμῶν πίστιν οὐκ ἐδοκίμασεν; τήν τε σώφρονα καὶ ἐπιεικῆ ἐν Χριστῷ εὐσέβειαν οὐκ ἐθαύμασεν; καὶ τὸ μεγαλοπρεπὲς τῆς φιλοξενίας ὑμῶν ἦθος οὐκ ἐκήρυξεν; καὶ τὴν τελείαν καὶ ἀσφαλῆ γνῶσιν οὐκ ἐμακάρισεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/002.yaml
  text: For who, after staying among you, did not approve your all-virtuous and steadfast faith? Who did not admire your sober and gentle godliness in Messiah? Who did not proclaim the magnificent character of your hospitality? And who did not count blessed your complete and sure knowledge?
translation:
  language: zh_hans
  text: 因为，谁曾在你们中间寄居，却不称许你们具备各样美德、坚定不移的信仰呢？谁不赞叹你们在弥赛亚里自守而温和的敬虔呢？谁不传扬你们接待客人的崇高品格呢？谁不称你们完整而可靠的知识为有福呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπιδημήσας πρὸς ὑμᾶς
  choice: 曾在你们中间寄居
  rationale: παρεπιδημέω指作为外来者暂住、旅居；“寄居”保留这一含义，同时符合现代中文书面语。
- source_word: πανάρετον καὶ βεβαίαν ... πίστιν
  choice: 德行完备、坚定不移的信仰
  rationale: πανάρετος意为具备各样美德或极其卓越；βεβαία表示稳固可靠。此译兼顾修德意味与信仰的坚定性。
- source_word: ἐδοκίμασεν
  choice: 称许
  rationale: 该词可指检验后认可；此处反问语境重在访客对其信仰予以认可，“称许”自然地表达这一结果。
- source_word: σώφρονα καὶ ἐπιεικῆ ... εὐσέβειαν
  choice: 自守而温和的敬虔
  rationale: σώφρων涵盖清醒、节制、自制；ἐπιεικής指温和、宽厚、不苛刻；“自守而温和”简洁保留两方面。
- source_word: μεγαλοπρεπὲς ... ἦθος
  choice: 高尚风范
  rationale: μεγαλοπρεπής表示宏伟、卓越、高贵，ἦθος在此指特质或风范；与“慷慨待客”搭配时，“高尚风范”比直译“宏伟品格”更自然。
- source_word: φιλοξενίας
  choice: 慷慨待客
  rationale: φιλοξενία指友爱并接待外客；译作“慷慨待客”表现实际德行，避免现代“好客”可能仅指性格热情。
- source_word: ἐμακάρισεν
  choice: 称羡
  rationale: 该词表示称为有福、认为可羡；“称羡”保留赞为有福而令人羡慕的意味，不误作单纯的“祝福”。
- source_word: τελείαν καὶ ἀσφαλῆ γνῶσιν
  choice: 完备而确实的知识
  rationale: τέλειος表示完整、成熟或完备；ἀσφαλής表示稳妥、可靠、确定。原文未说明知识的具体对象，译文也不补足。
theological_decisions:
- issue: ἐν Χριστῷ的称号译法
  choice: 在弥赛亚里
  alternative: 在基督里
  rationale: Χριστός意为“受膏者”，作为称号对应“弥赛亚”。采用“弥赛亚”保留其称号意义；“在……里”也保留原文联合或归属关系的开放性，不解释为单一神学机制。
- issue: γνῶσις的内容
  choice: 知识
  alternative: 真理知识／属灵认识
  rationale: 原文只有γνῶσις，并未限定其内容或性质，因此不添加“真理”“属灵”等解释性成分。
- issue: πίστις的语义范围
  choice: 信仰
  alternative: 信实／忠诚
  rationale: πίστις可涉及信靠、信仰或忠信；本句与敬虔、知识并列，用“信仰”最符合共同体语境，但不在译文中进一步界定其对象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以连续反问保留希腊文的赞誉力度和修辞节奏。避免古奥虚词，也不把原文的“知识”、敬虔或“在弥赛亚里”作教派化阐释。
