  naturalness: 译文庄重流畅。“德行完备的信仰”在现代汉语中略显搭配生硬，改为“具备各样美德、坚定不移的信仰”更清楚地使“各样美德”修饰信仰。“完备而确实的知识”可理解，但“完整而可靠”更贴近原文的完整与稳妥。
  terminology: “信仰”“敬虔”“弥赛亚”和“知识”均可保留；“自守而温和”适当地传达σώφρων及ἐπιεικής。将φιλοξενία译作“接待客人”避免添加“慷慨”的程度含义。
