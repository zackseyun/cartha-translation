  to: 因为你们做一切事都不偏待人，并且遵行上帝的律例，顺服你们的领袖，也把应有的尊敬给予你们中间的长者[a]。你们教导青年男子存有有分寸、端庄的心思；又嘱咐妇女凡事都存着无可指责、端庄、纯洁的良心去做，并恰当地爱自己的丈夫。你们还教导她们要在顺服的准则之下，以端庄的方式管理家务，极其自持。[b]
