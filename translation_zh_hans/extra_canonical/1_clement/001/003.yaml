source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπροσωπολήμπτως γὰρ πάντα ἐποιεῖτε καὶ ἐν τοῖς νομίμοις τοῦ θεοῦ ἐπορεύεσθε, ὑποτασσόμενοι τοῖς ἡγουμένοις ὑμῶν καὶ τιμὴν τὴν καϑήκουσαν ἀπονέμοντες τοῖς παρ’ ὑμῖν πρεσβυτέροις· νέοις τε μέτρα καὶ σεμνὰ νοεῖν ἐπετρέπετε· γυναξὶν τε ἐν ἀμώμῳ καὶ σεμνῇ καὶ ἁγνῇ συνειδήσει πάντα ἐπιτελεῖν παρηγγέλλετε, στεργούσας καϑηκόντως τοὺς ἄνδρας ἑαυτῶν· ἐν τε τῷ κανόνι τῆς ὑποταγῆς ὑπάρχουσας τὰ κατὰ τὸν οἶκον σεμνῶς οἰκουρεῖν ἐδιδάσκετε, πάνυ σωφρονούσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/003.yaml
  text: For you did everything without partiality[a], and you walked in the ordinances of God, submitting yourselves to your leaders and giving the honor that is fitting to the elders among you. You were directing the younger men to think moderate and dignified thoughts. And you were instructing the women to carry out all things with a blameless and dignified and pure conscience, loving their own husbands as is fitting; and you taught them, being under the rule of submission, to manage the affairs of the household with dignity[b], showing complete self-control.
translation:
  language: zh_hans
  text: 因为你们做一切事都不偏待人，并且遵行上帝的律例，顺服你们的领袖，也把应有的尊敬给予你们中间的长者[a]。你们教导青年男子存有有分寸、端庄的心思；又嘱咐妇女凡事都存着无可指责、端庄、纯洁的良心去做，并恰当地爱自己的丈夫。你们还教导她们要在顺服的准则之下，以端庄的方式管理家务，极其自持。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长者”也可译作“长老”；希腊词既可指年长的人，也可指群体中担任长老职分的人。
    reason: 保留 πρεσβύτεροι 在年龄称谓与群体职分之间的词义歧义。
  - marker: b
    text: “极其自持”也可译作“十分节制”或“极其审慎”。
    reason: πάνυ σωφρονούσας 表示高度的自制、清醒审慎和端正；中文难以用一个词完全涵盖。
lexical_decisions:
- source_word: ἀπροσωπολήμπτως
  choice: 不偏待人
  rationale: 表达不以人的身份、地位或外在条件区别对待，保留副词的伦理含义。
- source_word: τοῖς ἡγουμένοις ὑμῶν
  choice: 你们的领袖
  rationale: ἡγούμενοι 指带领群体的人；用“领袖”既自然，又不预设后世特定教会职衔。
- source_word: τοῖς παρ’ ὑμῖν πρεσβυτέροις
  choice: 你们中间的长者
  rationale: πρεσβύτεροι 可指年长者，也可能指群体中的长老；正文采用较宽泛的“长者”，歧义见脚注。
- source_word: μέτρα καὶ σεμνὰ νοεῖν
  choice: 思想有分寸、端庄的事
  rationale: 按通常理解，OCR 的 μέτρα 反映 μέτρια，意为适度、有分寸；σεμνά 表示庄重、可敬。
- source_word: ἐν τῷ κανόνι τῆς ὑποταγῆς
  choice: 谨守顺服的准则
  rationale: 保留 κανών“准则、规范”与 ὑποταγή“顺服”的组合，同时用现代汉语自然表达其规范性。
- source_word: οἰκουρεῖν
  choice: 料理家务
  rationale: 该词在此指照管家庭、处理家中事务；避免译成仅仅“留在家里”。
- source_word: πάνυ σωφρονούσας
  choice: 凡事保持节制
  rationale: σωφρονεῖν 涵盖自制、审慎、端正；“保持节制”在本句中简明而不过度收窄。
theological_decisions:
- issue: πρεσβύτεροι 是年长者还是教会长老
  choice: 正文译“长者”
  alternative: “长老”
  rationale: 前文已另称“领袖”，而 πρεσβύτεροι 本身兼有年龄与职分含义；正文不把它限定为制度化职衔，并以脚注保留另一可能。
- issue: 妇女顺服之语的句法力度
  choice: “谨守顺服的准则”
  alternative: “处在顺服的规范之下”
  rationale: 希腊文表达她们在“顺服的准则”中或之下；所选译法保留规范性，但不额外说明顺服对象，以免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文连续劝勉的结构，并明确译出末句独立的 ἐδιδάσκετε（“你们还教导”）。不使用后世宗派化职衔来消解原文歧义。
