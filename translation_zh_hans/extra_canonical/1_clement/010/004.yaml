  text: καὶ πάλιν ἐν τῷ διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ εἶπεν αὐτῷ ὁ θεός· Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε ἀπὸ τοῦ τόπου, οὗ νῦν σὺ εἶ, πρὸς βορρᾶν καὶ λίβα καὶ ἀνατολὰς καὶ θάλασσαν, ὅτι πᾶσαν τὴν γῆν, ἣν σὺ ὁρᾷς, σοὶ δώσω αὐτὴν καὶ τῷ σπέρματί σου ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/004.yaml
  text: And again[a], when he was separated from Lot, God said to him, “Lift up your eyes and look from the place where you now are, toward the north and the south and the east and the sea, because all the land that you see I will give to you and to your seed forever.”
translation:
  language: zh_hans
  text: 他与罗得分开时，神又对他说：“你举目，从你现在所在的地方向北、向南、向东、向海观看；我要把你所看见的全地赐给你和你的后裔，直到永远。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ
  choice: 他与罗得分开时
  rationale: 虽然形式为被动不定式，但在此可表达不及物或近似中间态的“分开、各自离去”；中文用“与……分开”既自然，也不暗示有人强迫他们分离。
- source_word: Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε
  choice: 你举目……观看
  rationale: 保留“举目”的具体意象，并以“观看”表达命令式ἴδε在方向描述中的含义。
- source_word: λίβα
  choice: 南
  rationale: 该词在此指西南风方向，所引《创世记》经文的方位序列通常以“南”表达；上下文列举四方。
- source_word: θάλασσαν
  choice: 海边
  rationale: 字面为“海”，在巴勒斯坦地理方位中指向地中海，即西方；译作“海边”保留原文地理表达，不直接改写成“西”。
- source_word: σπέρματί σου
  choice: 你的后裔
  rationale: σπέρμα字面为“种子”，用于族裔延续时，现代汉语以“后裔”最自然，并保留集合性的开放范围。
- source_word: ἕως αἰῶνος
  choice: 直到永远
  rationale: 对应持续至世代或永远的时间表达；此处采用庄重而通行的汉语措辞，不额外界定其时间哲学含义。
theological_decisions:
- issue: 土地应许的承受者范围
  choice: “你和你的后裔”
  alternative: “你和你的子孙”或“你和你的那一位后裔”
  rationale: 原文σπέρμα为单数形式但可作集合名词；译为“后裔”保留这种范围上的开放性，不预先作基督论或纯群体化解释。
- issue: 应许期限ἕως αἰῶνος
  choice: “直到永远”
  alternative: “直到世世代代”
  rationale: 采用原文常见的强时限表达，同时不在正文中解释该应许如何在救赎史或土地神学中实现。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。保留引文中“向海边”的古代地理方位表达；避免将διαχωρισθῆναι机械译成会暗示外力的汉语被动句。
