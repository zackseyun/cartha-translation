  text: καὶ πάλιν λέγει· Ἐξήγαγεν ὁ θεὸς τὸν Ἀβραὰμ καὶ εἶπεν αὐτῷ· Ἀνάβλεψον εἰς τὸν οὐρανὸν καὶ ἀρίθμησον τοὺς ἀστέρας, εἰ δυνήσῃ ἐξαριθμῆσαι αὐτούς· οὕτως ἔσται τὸ σπέρμα σου. ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/006.yaml
  text: And again he says[a], “God brought Abraham out and said to him, ‘Look up to heaven and count the stars, if you are able to count them; so will your offspring be.’ And Abraham believed God, and it was counted to him as righteousness.”
translation:
  language: zh_hans
  text: 他又说：“上帝领亚伯拉罕到外面，对他说：‘你抬头望天，数一数众星，看你能不能数得清；你的后裔也将如此。’亚伯拉罕信了上帝，这就算为他的义。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: 领……到外面
  rationale: 结合《创世记》15:5的语境，动词指把亚伯拉罕带到外面；这样译比单作“领出”更符合现代汉语。
- source_word: ἀνάβλεψον
  choice: 抬头望
  rationale: 在望天的语境中兼顾“向上看”的动作和自然汉语表达。
- source_word: τὸ σπέρμα σου
  choice: 你的后裔
  rationale: σπέρμα在此是集合意义，指亚伯拉罕将来的子孙；“后裔”自然且保留整体性，不把语法单数误解成一个人。
- source_word: ἐλογίσθη αὐτῷ εἰς δικαιοσύνην
  choice: 这就算为他的义
  rationale: 保留“算、归算”的核心意象，并以简洁庄重的现代汉语表达；“这”承接亚伯拉罕的信。
theological_decisions:
- issue: ἐλογίσθη的未明说主语
  choice: 译作“这就算为他的义”，不补出行动者
  alternative: “上帝就算他为义”或“这就被算作他的义”
  rationale: 希腊文使用无人称式被动表达，没有明说是谁执行“算”；本译保留这一形式上的含蓄，也避免把“算他为义”与“把信算为义”之间的解释张力提前消解。
- issue: σπέρμα的单数形式与集合意义
  choice: 后裔
  alternative: 种子、子孙、一个后裔
  rationale: 上下文以众星喻数量，明显采用集合意义；“后裔”既准确又不额外引入基督论限定。
- issue: 整段是否均属引文
  choice: 把“亚伯拉罕信了上帝……”保留在同一组外层引号内
  alternative: 在应许后结束经文引语，将最后一句视为革利免的叙述
  rationale: καὶ πάλιν λέγει引出连续的《创世记》15:5–6引文；希腊文没有迹象表明最后一句已退出引文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他又说”忠实保留λέγει的未明说主语，不擅自改成“经上又说”或点明说话者。内外层引号区分上帝对亚伯拉罕的话与整段经文引语。
