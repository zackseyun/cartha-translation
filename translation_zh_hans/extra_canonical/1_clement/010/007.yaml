base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/007.yaml
  text: Because of faith and hospitality a son was given to him in old age[a], and through obedience he offered him as a sacrifice to God on one of the mountains that he had shown him.
translation:
  language: zh_hans
  text: 因着信心和好客，他在年老时获赐一个儿子；又因着顺服，他到指给他的众山中的一座山上，把这个儿子献给上帝为祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“到他所指给他的一座众山中的山上”。“指给”的主语没有明说；按语境，通常理解为上帝指给亚伯拉罕。
    reason: 说明原文未明说动词主语所造成的指代含混，并交代“众山中的一座”的原文结构。
lexical_decisions:
- source_word: πίστιν
  choice: 信心
  rationale: 保留其宗教语境中的信靠含义，也与本段借亚伯拉罕说明信心的主旨相符。
- source_word: φιλοξενίαν
  choice: 好客
  rationale: 自然概括接待陌生人、旅客的美德；比逐字译作“爱陌生人”更符合现代汉语。
- source_word: ἐδόθη αὐτῷ υἱὸς
  choice: 他……得了一个儿子
  rationale: 保留希腊文被动表达所暗示的赐予意味，同时避免补出原文未明说的施予者。
- source_word: διʼ ὑπακοῆς
  choice: 因着顺服
  rationale: 既表达行为的依据和推动因素，也保留与前句“因着信心和好客”的结构呼应。
- source_word: προσήνεγκεν αὐτὸν θυσίαν τῷ θεῷ
  choice: 把这个儿子献给上帝为祭
  rationale: 准确表达“献上”及其作为祭物的身份；用“这个儿子”消除现代汉语中连续代词造成的不必要含混。
- source_word: πρὸς ἓν τῶν ὀρέων
  choice: 在……的一座山上
  rationale: πρός在此依叙事语境表示献祭所到达并进行的地点，汉语用“在……山上”最自然。
theological_decisions:
- issue: 赐下儿子的施予者
  choice: 不在正文中补出“上帝”作主语
  alternative: 译作“上帝在他年老时赐给他一个儿子”
  rationale: 神学和叙事语境虽清楚暗示上帝，但希腊文本身采用无施事者的被动式；正文保留这一表达层次。
- issue: ἔδειξεν的主语及αὐτῷ的受事者
  choice: 采用“所指给他”的无主语表达，并加注说明
  alternative: 明确译作“上帝指给他”或按字面写成两个含混的“他”
  rationale: 希腊文动词主语未明说，语境通常指上帝，而αὐτῷ指亚伯拉罕；无主语的汉语被动结构既自然，也避免把语境推断直接写成原文明示内容。
- issue: 以撒被献为祭的表述
  choice: 按叙述写作“献给上帝为祭”
  alternative: 改作“准备献给上帝为祭”或“几乎献上”
  rationale: 原文直接使用“献上”一词；不以《创世记》后续结局削弱本句有意强调的顺服。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“因着……；又因着……”保留原文两组διὰ结构的修辞平衡；“好客”“顺服”“献给上帝为祭”符合普通读者熟悉的宗教语汇。
