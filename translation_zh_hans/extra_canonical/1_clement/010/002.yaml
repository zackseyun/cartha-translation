  rationale: 修订仅校正三个形容词短语的语义范围和中文文体：以“少许”对应ὀλίγην，以“软弱”对应ἀσθενῆ，并以“一个小家”对应οἶκον μικρόν。其余结构、术语和句末承接下文引语的冒号均保留。
