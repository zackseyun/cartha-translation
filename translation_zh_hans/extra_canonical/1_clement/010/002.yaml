base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/002.yaml
  text: And in obedience he went out from his land and from his kindred and from his father’s house, so that, leaving behind a little land and a weak kindred and a small house, he might inherit the promises of God. For he says to him,
translation:
  language: zh_hans
  text: 他却因顺服，离开了自己的土地、亲族和父家，为要撇下少许土地、软弱的亲族和一个小家，承受上帝的应许。因为上帝对他说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακοῇ
  choice: 因顺服
  rationale: 与工具格所表达的原因或方式相符，也自然地突出亚伯拉罕顺服而离开的行动。
- source_word: γῆς / γῆν ὀλίγην
  choice: 土地 / 狭小的土地
  rationale: 保留前后重复，并以“狭小”表达ὀλίγην在范围或规模上的有限。
- source_word: συγγενείας / συγγένειαν ἀσθενῆ
  choice: 亲族 / 势单力薄的亲族
  rationale: συγγένεια在此指亲属群体；ἀσθενής并非身体虚弱，而是力量、地位或规模有限，故译为“势单力薄”。
- source_word: οἴκου τοῦ πατρὸς αὐτοῦ / οἶκον μικρόν
  choice: 父家 / 小小的家
  rationale: 前者采用自然且带经文色彩的“父家”；后者保留οἶκος可兼指家庭与家室的含义，不将其限缩为建筑物。
- source_word: κληρονομήσῃ
  choice: 承受
  rationale: 保留继承、获得产业式应许的语义，同时符合现代中文圣经语体。
- source_word: τὰς ἐπαγγελίας τοῦ θεοῦ
  choice: 上帝的应许
  rationale: 原文为复数，但现代汉语“应许”可作集合表达；不机械添加“各项”。
- source_word: λέγει γὰρ αὐτῷ
  choice: 因为上帝对他说
  rationale: 希腊文主语省略，语境中指上帝；中文补出主语以避免悬空，并用冒号承接下文引语。
theological_decisions:
- issue: 顺服与承受应许之间的关系
  choice: 译作“因顺服……为要……承受”，保留原句的目的结构
  alternative: 译成“由于他的顺服，他就得以承受”，明确建立功德或因果关系
  rationale: 原文以ὑπακοῇ描述离开的原因或方式，又以ὅπως引出目的或结果；不应把承受应许解释为靠顺服赚取。
- issue: 应许的数
  choice: 使用汉语集合名词“应许”
  alternative: “诸般应许”或“各项应许”
  rationale: 既保留神学概念的整体性，也避免在汉语中造成不自然的复数标记；并未否认希腊文复数。
- issue: λέγει的隐含主语
  choice: 补为“上帝”
  alternative: 保留为“因为有话对他说”
  rationale: 最近的明确属格主体是“上帝”，且接续内容显然是上帝对亚伯拉罕说话；补出主语属于中文所需的明示，而非额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文三组平行结构（土地、亲族、父家/家），并以“势单力薄”自然传达ἀσθενῆ的群体性含义。句末冒号表明引语将在下一节继续。
