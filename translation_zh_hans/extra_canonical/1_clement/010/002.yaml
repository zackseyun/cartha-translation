  - severity: medium
    issue: “狭小的土地”对应γῆν ὀλίγην不够准确
    rationale: ὀλίγος通常表示少、小、有限，而“狭小”主要表示面积或空间逼仄。译为“少许土地”较不限定其“小”的具体维度。
  - severity: low
    issue: “势单力薄的亲族”略加强并具体化ἀσθενῆ
    rationale: ἀσθενής意为软弱、无力，可涉及力量、地位或资源；“势单力薄”虽可通，却较强地导向人数或势力。译为“软弱的亲族”保留原文概括性。
  - severity: low
    issue: “小小的家”略显口语化
    rationale: μικρόν表达“小”；“一个小家”在现代庄重中文中较平实，且不把οἶκος限于单纯建筑。
