  text: Ἄπελθε ἐκ τῆς γῆς σου καὶ ἐκ τῆς συγγενείας σου καὶ ἐκ τοῦ οἴκου τοῦ πατρός σου εἰς τὴν γῆν, ἣν ἄν σοι δείξω· καὶ ποιήσω σε εἰς ἔθνος μέγα καὶ εὐλογήσω σε καὶ μεγαλυνῶ τὸ ὄνομά σου, καὶ ἔσῃ εὐλογημένος· καὶ εὐλογήσω τοὺς εὐλογοῦντάς σε καὶ καταράσομαι τοὺς καταρωμένους σε, καὶ εὐλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/003.yaml
  text: “Depart from your land and from your kindred and from your father’s house to the land that I will show you; and I will make you into a great nation[a], and I will bless you and magnify your name, and you will be blessed. And I will bless those who bless you, and I will curse those who curse you, and in you all the tribes of the earth will be blessed.”
translation:
  language: zh_hans
  text: “你要离开你的本地、你的亲族和你的父家，往我要指示你的地去。我要使你成为大国；我要赐福给你，使你的名显大，你必蒙福。我要赐福给那些祝福你的人；那些咒诅你的人，我要咒诅他们。地上所有的族群都必因你蒙福。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄπελθε
  choice: 离开……去
  rationale: ἀπέρχομαι在这里表示离开原处、前往别处；译作“离开……去”既体现其与ἐξέρχομαι“出去”的词汇差异，也符合现代汉语表达。
- source_word: συγγενείας
  choice: 本族
  rationale: 指亲属、宗族关系；与“本地”和“父家”并列时，“本族”简洁而能体现范围层次。
- source_word: ποιήσω σε εἰς ἔθνος μέγα
  choice: 使你成为大国
  rationale: 保留ποιέω加εἰς所表达的结果意义；ἔθνος在此指由亚伯兰而出的民族或国家，“大国”承接熟悉的经文语体。
- source_word: μεγαλυνῶ τὸ ὄνομά σου
  choice: 使你的名为大
  rationale: 较直接地保留“使……大”的意象及庄重语气，避免解释性改写为“使你声名远扬”。
- source_word: ἔσῃ εὐλογημένος
  choice: 你也必成为福
  rationale: 希腊文形式可直译为“你必蒙福”，但在此祝福链条中也可承接希伯来传统所表达的“成为福”；采用“成为福”保留其向他人延展的语境张力。
- source_word: φυλαὶ
  choice: 族群
  rationale: φυλή可指支派、部族或族类；“族群”比“支派”更适合这里普及全地各族的范围。
theological_decisions:
- issue: ἔσῃ εὐλογημένος的被动状态与使命性含义
  choice: 你也必成为福
  alternative: 你也必蒙福
  rationale: 希腊文表面是“成为蒙福的”，但引文语境紧接着说万族因他得福。“成为福”保留这项应许由领受祝福转向成为祝福媒介的张力，而不额外指定其实现方式。
- issue: ἐν σοὶ的关系含义
  choice: 因你
  alternative: 在你里面
  rationale: ἐν可表达范围、关联或媒介。“因你”是自然汉语，并保留亚伯兰与万族得福之间的关联；不进一步解释为特定后裔或救恩机制。
translation_notes:
  register: 采用现代、庄重且适合诵读的经文语体。以分号和短句呈现连续应许；保留“本地、本族、父家”“大国”“名为大”等源文意象，不加入解释性神学术语。
