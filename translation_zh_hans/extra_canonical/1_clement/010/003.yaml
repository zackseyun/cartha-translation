review_pass:
  verdict: revise
  source_fidelity: 主要问题在于ἔσῃ εὐλογημένος是将来时被动分词性表语，意为“你必蒙福／你将成为蒙福的”，不能安全地译为“你也必成为福”。后者将领受祝福的被动陈述转成“成为祝福媒介”，虽与所引《创世记》传统的某些译法相近，却超出了本希腊文本的明确语法。其余主要内容与原文相符。
  naturalness: 原译整体庄重流畅，但“使你的名为大”略显生硬；“使你的名显大”在保留原文“大”的意象时更合乎现代汉语。“地方”可改为“地”，以对应γῆ并保留应许之地的土地意象。
  terminology: “本地、本族、父家”“大国”“赐福／祝福”“咒诅”“族群”等术语基本恰当。为忠实呈现εὐλογημένος的被动意义，应统一采用“蒙福”。本段无须保留英文审计轨迹中仅涉及英文“Depart/Go out”的脚注。
  issues:
  - severity: high
    issue: “你也必成为福”
    rationale: ἔσῃ εὐλογημένος的语法是“你将是蒙福的／你必蒙福”，并非“你将成为祝福”。把其译为“成为福”引入了文本未明说的使命性或媒介性含义。后文“万族因你蒙福”可以保留其关联，但不能反过来改变本句的语态。
  - severity: low
    issue: “我将要指示你的地方”
    rationale: γῆ意为“地、土地”，此处与离开故土、前往所示之地的语境相连。译为“地”更贴近原文且保留其具体土地意象。
  - severity: low
    issue: “使你的名为大”
    rationale: 可理解，但现代汉语略不自然。“使你的名显大”较顺畅，并仍对应μεγαλυνῶ τὸ ὄνομά σου的“使你的名为大／尊大”意象。
  revised_text: “你要离开你的本地、你的亲族和你的父家，往我要指示你的地去。我要使你成为大国；我要赐福给你，使你的名显大，你必蒙福。我要赐福给那些祝福你的人；那些咒诅你的人，我要咒诅他们。地上所有的族群都必因你蒙福。”
