  to: “你要离开你的本地、你的亲族和你的父家，往我要指示你的地去。我要使你成为大国；我要赐福给你，使你的名显大，你必蒙福。我要赐福给那些祝福你的人；那些咒诅你的人，我要咒诅他们。地上所有的族群都必因你蒙福。”
  rationale: 修订仅纠正“成为福”对εὐλογημένος被动含义的越译，并微调“地”和“名显大”以提升源文对应及现代汉语自然度。末句继续译为“因你蒙福”，以自然表达ἐν σοὶ的关联／媒介范围，而不指定其神学机制。
