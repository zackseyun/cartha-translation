  yaml_path: translation/extra_canonical/1_clement/010/005.yaml
  text: And I will make your seed like the sand of the earth; if anyone is able to count the sand of the earth, your seed also will be counted.”
translation:
  language: zh_hans
  text: “我要使你的后裔多如地上的尘沙；若有人能数清地上的尘沙，你的后裔也就能数得清。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα
  choice: 后裔
  rationale: 此处指亚伯拉罕的子孙或后代；译作“后裔”既符合现代汉语，也保留原词可作集合单数的特点。
- source_word: ἄμμον τῆς γῆς
  choice: 地上的尘沙
  rationale: ἄμμος通常指沙；结合本句所引《创世记》13:16的语境，用“尘沙”自然表达地面尘土、沙粒不可胜数的意象。
- source_word: ἐξαριθμῆσαι / ἐξαριθμηθήσεται
  choice: 数清 / 能数得清
  rationale: 保留主动与被动结构的对应关系，同时以现代汉语自然表达“逐一数算、得出数目”的含义。
theological_decisions:
- issue: σπέρμα的单数形式与集合意义
  choice: 译为集合性的“后裔”
  alternative: 译为“子孙”或字面的“种子”
  rationale: 上下文论及亚伯拉罕繁多的后代；“后裔”不强行限定为单一个体，也不引入本节未明说的基督论解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留引语形式和原文两分句的条件—结果结构；以“多如”明确汉语中的比较关系，而不改变原意。
