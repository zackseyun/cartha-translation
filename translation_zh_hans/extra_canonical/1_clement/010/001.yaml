  text: Ἀβραὰμ, ὁ φίλος προσαγορευθείς, πιστὸς εὑρέθη ἐν τῷ αὐτὸν ὑπήκοον γενέσθαι τοῖς ῥήμασιν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/001.yaml
  text: Abraham, who was called the friend, was found faithful by becoming obedient to the words of God.
translation:
  language: zh_hans
  text: 被称为“朋友”的亚伯拉罕，藉着顺从上帝的话[a]，被证明是忠信的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他被证明是忠信的，表现在他顺从上帝的话这件事上。”
    reason: 希腊语 ἐν τῷ 加不定式可表示途径，也可描述忠信显明于其中的情形。
lexical_decisions:
- source_word: ὁ φίλος προσαγορευθείς
  choice: 被称为“朋友”的
  rationale: 保留原文“被称作朋友”的称号式表达；希腊文本本身没有明说“上帝的朋友”，因此不在正文中补出所属关系。
- source_word: πιστὸς εὑρέθη
  choice: 被证明是忠信的
  rationale: 体现 εὑρέθη 的被动语态及“经检验显为”的含义；“忠信”兼顾 πιστός 在此处的可靠、忠诚意味。
- source_word: τοῖς ῥήμασιν τοῦ θεοῦ
  choice: 上帝的话
  rationale: ῥήματα 为复数，但现代汉语通常以集合性表达“上帝的话”，比“上帝的诸话语”自然庄重。
- source_word: ἐν τῷ αὐτὸν ὑπήκοον γενέσθαι
  choice: 因顺从
  rationale: 以自然汉语表达 ἐν 加带冠词不定式所表示的途径或相关情形，同时用脚注保留另一种句法理解。
theological_decisions:
- issue: “朋友”是否明确补为“上帝的朋友”
  choice: 正文只作“朋友”
  alternative: “上帝的朋友”
  rationale: 虽然后文语境及传统称号很可能指上帝的朋友，但本节希腊文仅有 ὁ φίλος；保留原文的简略，不把隐含关系写成明说。
- issue: ἐν τῷ 结构表示途径还是领域/情形
  choice: 正文按途径译为“因顺从”
  alternative: “在他顺从……这件事上”
  rationale: 该结构可表示手段或伴随情形；正文采用流畅的汉语表达，脚注保留较贴近形式、强调所涉情形的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“忠信”保留宗教伦理语境中的忠诚可靠之意；句序按汉语习惯调整，同时维持原文的被动陈述与称号式措辞。
