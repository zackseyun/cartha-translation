  text: ἐλπίζειν ἐπὶ τὸ ἀρχέγονον πάσης κτίσεως ὄνομά σου, ἀνοίξας τοὺς ὀφθαλμοὺς τῆς καρδίας ἡμῶν εἰς τὸ γινώσκειν σε τὸν μόνον ὕψιστον ἐν ὑψίστοις, ἅγιον ἐν ἁγίοις ἀναπαυόμενον· τὸν ταπεινοῦντα ὕβριν ὑπερηφάνων, τὸν διαλύοντα λογισμοὺς ἐθνῶν, τὸν ποιοῦντα ταπεινοὺς εἰς ὕψος καὶ τοὺς ὑψηλοὺς ταπεινοῦντα, τὸν πλουτίζοντα καὶ πτωχίζοντα, τὸν ἀποκτείνοντα καὶ ζῳοποιοῦντα καὶ ζῆν ποιοῦντα, μόνον εὐεργέτην πνευμάτων καὶ θεὸν πάσης σαρκός· τὸν ἐπιβλέποντα ἐν τοῖς ἀβύσσοις, τὸν ἐπόπτην ἀνθρωπίνων ἔργων, τὸν τῶν κινδυνευόντων βοηθόν, τὸν τῶν ἀπηλπισμένων σωτῆρα, τὸν παντὸς πνεύματος κτίστην καὶ ἐπίσκοπον· τὸν πληθύνοντα ἔθνη ἐπὶ γῆς καὶ ἐκ πάντων ἐκλεγόμενον τοὺς ἀγαπῶντάς σε διὰ Ἰησοῦ Χριστοῦ τοῦ ἠγαπημένου παιδός σου, δι’ οὗ ἡμᾶς ἐπαίδευσας, ἥγιασας, ἐτίμησας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/003.yaml
  text: to hope in your name[a], the source of all creation, having opened the eyes of our heart so that we might know you, the only Most High among the highest, the Holy One resting among the holy ones; the one who humbles the insolence of the proud, who frustrates the plans of the nations, who exalts the humble and humbles the exalted, who makes rich and makes poor, who kills and gives life, the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds, the helper of those in danger, the savior of those without hope, the creator and overseer of every spirit; who multiplies nations on the earth and from among them all chooses those who love you through Jesus Messiah, your beloved servant, through whom you instructed us, sanctified us[b], and honored us.
translation:
  language: zh_hans
  text: 使我们仰望你的名——一切受造物的本源[a]；你开启了我们心里的眼睛，使我们认识你：你是在至高之处独一的至高者，是安息在众圣者中的圣者[b]；你挫败骄傲人的狂妄，破除列国的谋算；你使卑微的人升高，使高傲的人降卑；你使人富足，也使人贫穷；你杀死，也赐人生命，使人存活；你是众灵唯一的恩主，是凡有血肉者的上帝。你察看深渊，鉴察人的作为；你帮助身处险境的人，拯救绝望的人；你创造并看顾一切的灵。你使地上的列国增多，又从万民中拣选那些借着耶稣弥赛亚、你所爱的仆人[c]而爱你的人；你也借着他教导我们，使我们成圣，使我们得尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我们仰望你的名；一切受造物最初都由这名而来。”
    reason: ἀρχέγονον与“你的名”的关系及其“原初、源头”含义可有不同表达。
  - marker: b
    text: “众圣者”也可理解为“圣洁者”或“圣洁之物”。
    reason: 希腊语ἁγίοις可作阳性或中性复数，所指并未完全限定。
  - marker: c
    text: “仆人”所译的希腊词也可指“孩子”；因此也可译作“你所爱的孩子”。
    reason: παῖς同时具有仆人和孩子两种词义，应保留原文的语义张力。
lexical_decisions:
- source_word: ἀρχέγονον
  choice: 本源
  rationale: 此词修饰“名”，可表达“最初产生、原初来源”的含义；正文以自然汉语表达该名与一切受造物之起源的关系，同时用脚注保留句法和语义上的另一种理解。
- source_word: ἐν ὑψίστοις
  choice: 在至高之处
  rationale: 中性复数可指最高之处；这样比“在至高者中”更符合希腊语形式，也保留庄严祷告语体。
- source_word: ἅγιον ἐν ἁγίοις ἀναπαυόμενον
  choice: 安居在众圣者中的圣者
  rationale: 将单数实体化形容词译为“圣者”，并把复数 ἁγίοις 理解为众圣者；脚注保留“圣所”这一可能读法。
- source_word: ζῳοποιοῦντα καὶ ζῆν ποιοῦντα
  choice: 赐人生命，使人存活
  rationale: 原文并列两个相近而不完全相同的表达，译文不按英语修订层将其合并或删减。
- source_word: ἐπίσκοπον
  choice: 看顾
  rationale: 在此指上帝对一切灵的监督与照管；“看顾”比音译或制度化的“监督者”更自然，并避免引入后期教会职分含义。
- source_word: παιδός
  choice: 仆人
  rationale: παῖς 可指孩子或仆人；在此宗教语境中“仆人”自然且与受差遣者的语义相称，脚注保留“爱子”这一可能译法。
- source_word: ἐπαίδευσας
  choice: 教导
  rationale: 该词可含教育、训育或管教之意；此处借着耶稣施行的行动以“教导”最贴合上下文而不过度限定。
theological_decisions:
- issue: 耶稣的称号 Χριστός
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός 是“受膏者”的希腊称号；译作“弥赛亚”明确其称号性质，也避免把它仅当作姓名的一部分。
- issue: παῖς 所表达的身份
  choice: 正文译“仆人”，脚注注明也可译“爱子”
  alternative: 孩子／儿子
  rationale: 原词确有仆人与孩子两义；正文依早期基督徒祷告及圣仆传统选“仆人”，但不以此消除词本身的亲子义可能。
- issue: “圣者安居在圣者中”的所指
  choice: 众圣者
  alternative: 众圣所／圣物
  rationale: ἁγίοις 的形式容许指圣者或圣物、圣所；正文采用人格复数的自然理解，脚注保存另一可能。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告语体；连续以“你”引出上帝的作为，重现原文一连串同位称谓和分词结构，同时适度分句以便普通读者理解。译文保留了原文“赐生命／使人存活”的近义并列，没有依英语咨询层删去其中一项。
