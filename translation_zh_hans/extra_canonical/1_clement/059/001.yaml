  text: Ἐὰν δέ τινες ἀπειθήσωσιν τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις, γινωσκέτωσαν, ὅτι παραπτώσει καὶ κινδύνῳ οὐ μικρῷ ἑαυτοὺς ἐνδήσουσιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/001.yaml
  text: But if some disobey the things spoken by him through us, let them know that they will entangle themselves in transgression and in no small danger.
translation:
  language: zh_hans
  text: 但若有人不服从他借着我们所说的话，他们应当知道，自己必将使自己陷入过犯和不小的危险之中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθήσωσιν
  choice: 不服从
  rationale: 既保留对所传达之话语不顺从的含义，也避免仅译作“不相信”而缩窄语义。
- source_word: τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις
  choice: 他借着我们所说的话
  rationale: 保留原文的施事关系：话出于“他”，并“借着我们”说出；不擅自明确“他”的所指。
- source_word: γινωσκέτωσαν
  choice: 他们应当知道
  rationale: 体现第三人称命令式的告诫语气，同时符合现代汉语表达。
- source_word: παραπτώσει
  choice: 过犯
  rationale: 表达偏离正道、犯错或犯罪的宗教伦理含义，语体庄重且不过度教派化。
- source_word: ἐνδήσουσιν
  choice: 必将陷入
  rationale: 原词具有使自己受缚、卷入其中的形象；“陷入”在现代汉语中自然，并保留自陷于某种处境的意味。
- source_word: κινδύνῳ οὐ μικρῷ
  choice: 不小的危险
  rationale: 直译原文的缓叙表达，不强化为“极大的危险”。
theological_decisions:
- issue: 代词 αὐτοῦ（“他”）的指代
  choice: 保留为“他”
  alternative: 明确译为“神”或“基督”
  rationale: 本节单独看并未明说指代对象；保留代词可维护原文的篇章依赖和真实歧义。
- issue: 使徒性或神圣权威的表达
  choice: 译作“他借着我们所说的话”
  alternative: 弱化为“我们奉他的名所说的话”或强化为“神谕”
  rationale: 原文明确表达“由他、借我们说出”，译文照实保留，不额外建构启示论或教会权威体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句法尽量贴近希腊文的条件句、告诫和后果结构，同时避免生硬直译；“不小的危险”特意保留原文克制的修辞。
