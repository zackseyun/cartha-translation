  terminology: “万有的创造主”“他所爱的仆人耶稣基督”“选民之数”均合乎原文和早期教会祷文的庄重语域。“仆人”的脚注应保留παῖς可作“孩子”的语义幅度，但不宜无据扩展为“儿子”。
