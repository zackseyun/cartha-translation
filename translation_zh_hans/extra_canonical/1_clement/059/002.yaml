revisions:
- from: 但我们必不因这罪而被定罪[a]。我们要恳切祈求、切切恳求，愿万有的创造主，借着他所爱的仆人耶稣基督，保守他在全世界数点过的选民之数完整无缺；他借着耶稣基督召我们出黑暗、入光明，出无知、得以认识他名的荣耀。
  to: 但我们就必不担负这罪的罪责。我们将以恳切的祈求和哀恳祷告，求万有的创造主借着他所爱的仆人耶稣基督，保守他在全世界所数点的选民之数完整无缺；他曾借着耶稣基督召我们出黑暗，进入光明；出无知，进入对他名荣耀的认识。
  rationale: 修订避免将“无辜／免于罪责”过度具体化为“被定罪”，并更清楚呈现原文的祈祷句法及“从……进入……”的平行结构。保留“仆人”“耶稣基督”“选民之数”和“所数点”的措辞，不将其神学含义扩展为特定预定论解释。
