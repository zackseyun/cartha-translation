source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς δὲ ἀθῷοι ἐσόμεθα ἀπὸ ταύτης τῆς ἁμαρτίας καὶ αἰτησόμεθα ἐκτενῆ τὴν δέησιν καὶ ἱκεσίαν ποιούμενοι, ὅπως τὸν ἀριθμὸν τὸν κατηριθμημένον τῶν ἐκλεκτῶν αὐτοῦ ἐν ὅλῳ τῷ κόσμῳ διαφυλάξῃ ἄθραυστον ὁ δημιουργὸς τῶν ἁπάντων διὰ τοῦ ἠγαπημένου παιδὸς αὐτοῦ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐκάλεσεν ἡμᾶς ἀπὸ σκότους εἰς φῶς, ἀπὸ ἀγνωσίας εἰς ἐπίγνωσιν δόξης ὀνόματος αὐτοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/002.yaml
  text: But we will be innocent of this sin[a], and we will ask, making earnest prayer and supplication, that the Creator of all may keep intact the number of his elect that has been counted throughout the whole world, through his beloved servant Jesus Christ, through whom he called us from darkness into light, from ignorance into the knowledge of the glory of his name,
translation:
  language: zh_hans
  text: 但我们就必不担负这罪的罪责。我们将以恳切的祈求和哀恳祷告，求万有的创造主借着他所爱的仆人耶稣基督，保守他在全世界所数点的选民之数完整无缺；他曾借着耶稣基督召我们出黑暗，进入光明；出无知，进入对他名荣耀的认识。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθῷοι
  choice: 不因这罪而被定罪
  rationale: 该词可表示无罪、无辜或免于罪责；结合ἀπὸ ταύτης τῆς ἁμαρτίας，译为“不因这罪而被定罪”自然地表达不承担此罪责，而不暗示说话者在一切事上无罪。
- source_word: ἐκτενῆ
  choice: 恳切
  rationale: 表示热切、持续而专注；在祷告语境中“恳切”简洁且合乎现代汉语。
- source_word: δέησιν καὶ ἱκεσίαν
  choice: 祈求、切切恳求
  rationale: 保留两个近义祷告词的叠加强调；后者体现ἱκεσία较强的哀恳、求告意味。
- source_word: τὸν ἀριθμὸν τὸν κατηριθμημένον
  choice: 数点过的选民之数
  rationale: 保留原文“数目—已数定/数点”的刻意重复和被动意味，不将其释义为预定或固定名册。
- source_word: ἄθραυστον
  choice: 完整无缺
  rationale: 原义为未破损、未受破坏；用于人数时意指整体不被减损，“完整无缺”既自然又保留意象。
- source_word: δημιουργὸς τῶν ἁπάντων
  choice: 万有的创造主
  rationale: 准确表达“所有一切的创造者”，并保持祷文的庄重语体。
- source_word: παιδὸς
  choice: 仆人
  rationale: παῖς既可指孩子，也可指仆人；此处处于受经文传统影响的祷告语境，“仆人”更能传达上主仆人的礼仪性回响。
- source_word: ἐπίγνωσιν
  choice: 得以认识
  rationale: 译出认识、确知之意，但不额外强化成“充分认识”，以免超出词项在此处可确定的力度。
theological_decisions:
- issue: “选民之数”是否暗示人数由神预先固定
  choice: 保留“他在全世界数点过的选民之数”
  alternative: “全世界所有蒙他拣选的人”
  rationale: 原文明确使用“数目”和“已数点的”双重表达；译文保留其神学张力，不进一步解释为预定人数，也不淡化成泛指所有选民。
- issue: παῖς用于耶稣时的身份称谓
  choice: 他所爱的仆人耶稣基督
  alternative: 他所爱的孩子耶稣基督
  rationale: “仆人”符合早期基督徒祷文中以παῖς称耶稣的经文与礼仪背景；但该希腊词本身确有“孩子”义，故以脚注保留歧义。
- issue: ἀθῷοι的罪责范围
  choice: 不因这罪而被定罪
  alternative: 在这罪上是无辜的
  rationale: 原文谈的是从“这罪”所得的无罪责状态，而非普遍无罪；当前译法限定了范围，并保留未来时语气。
translation_notes:
  register: 采用庄重而可读的现代标准汉语，保留早期教会祷文的铺陈和经文式对偶（“出黑暗、入光明；出无知、得以认识……”）。避免使用过度古典的虚词，也不把“选民之数”解释为特定宗派的预定论命题。
