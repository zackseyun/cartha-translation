source:
  edition: Funk 1901 (normalized OCR)
  text: ἀξιόμεν σε, δέσποτα, βοηθὸν γενέσθαι καὶ ἀντιλήμπτορα ἡμῶν. τοὺς ἐν θλίψει ἡμῶν ῥῦσαι, τοὺς ταπεινοὺς ἐλέησον, τοὺς πεπτωκότας ἔγειρον, τοῖς δεομένοις ἐπιφάνηθι, τοὺς ἀσθενεῖς ἴασαι, τοὺς πλανωμένους τοῦ λαοῦ σου ἐπίστρεψον· χόρτασον τοὺς πεινῶντας, λύτρωσαι τοὺς δεσμίους ἡμῶν, ἐξανάστησον τοὺς ἀσθενοῦντας, παράκαλεσον τοὺς ὀλιγοψυχούντας· γνωτώσαν σε ἅπαντα τὰ ἔθνη, ὅτι σὺ εἶ ὁ θεὸς μόνος καὶ Ἰησοῦς Χριστὸς ὁ παῖς σου καὶ ἡμεῖς λαός σου καὶ πρόβατα τῆς νομῆς σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/004.yaml
  text: We ask you[a], Master, to be our helper and protector. Rescue those of us in affliction, have mercy on the lowly, raise up the fallen, appear to those in need, heal the weak, turn back those of your people who wander. Feed the hungry, redeem our prisoners, raise up the sick, encourage the fainthearted. Let all the nations know that you alone are God, and Jesus Messiah is your servant, and we are your people and the sheep of your pasture.
translation:
  language: zh_hans
  text: 主宰啊，我们恳求你作我们的帮助者和保护者。求你解救我们中遭患难的人，怜悯卑微的人，扶起跌倒的人，向有需要的人显现，医治软弱的人，使你子民中迷失的人回转。求你使饥饿的人饱足，赎回我们中被囚的人，使患病的人起来，勉励灰心的人。愿万国都认识你，知道唯有你是上帝，耶稣弥赛亚是你的仆人[a]；我们是你的子民，是你草场上的羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”所译的希腊词也可指“孩子”。
    reason: 保留 παῖς 的真实词义歧义，避免正文单一译法完全遮蔽另一可能。
lexical_decisions:
- source_word: δέσποτα
  choice: 主宰啊
  rationale: 保留对拥有绝对权柄之主的庄重呼求，比一般的“主啊”更能体现原词语气。
- source_word: βοηθὸν ... καὶ ἀντιλήμπτορα
  choice: 帮助者和保护者
  rationale: 分别表达援助与扶持、保护的含义，并保留两个并列称谓。
- source_word: τοὺς πλανωμένους τοῦ λαοῦ σου ἐπίστρεψον
  choice: 使你子民中迷失的人回转
  rationale: 把阳性复数分词理解为人，而非抽象的“迷失”；“回转”也保留 ἐπίστρεψον 可含归回正道的意味。
- source_word: λύτρωσαι τοὺς δεσμίους ἡμῶν
  choice: 赎回我们中被囚的人
  rationale: λύτρωσαι 含以赎价解救、释放之意；“赎回”比单纯“释放”更保留原词的救赎色彩。
- source_word: παῖς
  choice: 仆人
  rationale: 在向上帝祷告并称耶稣的语境中，“仆人”自然且与早期基督徒用语相合；原词也可表示孩子，故加注说明。
- source_word: πρόβατα τῆς νομῆς σου
  choice: 你草场上的羊
  rationale: 采用汉语中自然且具有经文传统回响的牧养意象，表达属于上帝牧场的群羊。
theological_decisions:
- issue: παῖς 用于耶稣时兼有“仆人”与“孩子”的词义可能
  choice: 正文译作“仆人”，并加脚注保留词义张力
  alternative: 孩子／儿子
  rationale: 本段的祷告语境及早期基督徒对上帝之受膏仆人的表达支持“仆人”，但希腊词本身并不排除亲子含义，不宜无注释地消除歧义。
- issue: Ἰησοῦς Χριστός 的表达
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: Χριστός 在此是受膏者称号；译作“弥赛亚”使普通读者更清楚其称号意义，同时不额外引入宗派性解释。
- issue: 唯有你是上帝与耶稣弥赛亚是你的仆人的并列表述
  choice: 按原文直接保留
  alternative: 通过增补解释来系统化二者关系
  rationale: 原文有意同时宣认独一的上帝并称耶稣为其仆人；译文不以补词消解其早期基督教神学表述中的张力。
translation_notes:
  register: 采用庄重而自然的现代汉语祷告体，以连续的祈求句呈现原文节奏；避免生硬直译，也不加入原文没有的神学说明。称谓和牧养意象保持经文式庄重感，同时确保普通现代读者易懂。
