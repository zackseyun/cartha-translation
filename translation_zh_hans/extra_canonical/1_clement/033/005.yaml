base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/005.yaml
  text: For thus God says, “Let us make man according to our image and according to our likeness.” And God made man; male and female he made them.
translation:
  language: zh_hans
  text: 因为上帝这样说：“我们要照着我们的形象，按着我们的样式造人。”上帝就造了人；他造他们为男和女。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπον
  choice: 人
  rationale: 此处指人类；用“人”既贴近原文单数形式，也符合所引《创世记》经文的庄重表达。
- source_word: κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν
  choice: 照着我们的形象，按着我们的样式
  rationale: 保留“形象”和“样式”两个并列概念及“我们的”，不将二者合并或作神学解释。
- source_word: ἄρσεν καὶ θῆλυ
  choice: 有男有女
  rationale: 以自然现代汉语表达原文“男性和女性”的两性对应，同时保留其整体指向。
- source_word: αὐτούς
  choice: 他们
  rationale: 保留原文复数代词，体现从集合意义的“人”转向男女众人的表述。
theological_decisions:
- issue: “我们”这一复数形式的理解
  choice: 直译为“我们”，不加解释
  alternative: 将其解释为上帝内部的对话、对天使说话或尊贵复数
  rationale: 原文本身没有说明复数的所指，应保留其真实歧义，避免引入特定教义解释。
- issue: “形象”与“样式”的关系
  choice: 分别保留两个词
  alternative: 合并为“照着我们的形象和样式”或视为同义重复
  rationale: 原文以两个介词结构并列，译文维持这种区分，不预先判定二者在神学上相同或不同。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”衔接上帝的话与创造行动；分号保留后半句对受造之人的进一步说明。
