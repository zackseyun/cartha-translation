  text: ἔχοντες οὖν τοῦτον τὸν ὑπογραμμὸν ἀόκνως προσέλθωμεν τῷ θελήματι αὐτοῦ· ἐξ ὅλης τῆς ἰσχύος ἡμῶν ἐργασώμεθα ἔργον δικαιοσύνης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/008.yaml
  text: Having[a], then, this pattern, let us draw near to his will without hesitation. With all our strength let us do the work of righteousness.
translation:
  language: zh_hans
  text: 所以，我们既有这榜样，就让我们毫不迟疑地投身于他的旨意[a]；让我们竭尽全力，从事公义的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“毫不迟疑地走近（或趋向）他的旨意”。这里也可按语义译作“投身于他的旨意”或“遵行他的旨意”；后者是解释性的译法。
    reason: προσέλθωμεν本义为“走近、趋向”，与“旨意”搭配时在汉语中需要较自然的表达；ἀόκνως强调不迟疑、不退缩。
lexical_decisions:
- source_word: ὑπογραμμός
  choice: 榜样
  rationale: 该词指供人仿效的范本或典范；“榜样”在现代汉语中自然，并保留劝勉人照样而行的含义。
- source_word: ἀόκνως
  choice: 毫不迟疑地
  rationale: 该副词主要表示不退缩、不犹豫或不拖延；此处译作“毫不迟疑地”，比“热切地”更贴近词源和语境。
- source_word: προσέλθωμεν τῷ θελήματι αὐτοῦ
  choice: 走向他的旨意
  rationale: 保留 προσέρχομαι“走近、趋向”的动态意象，同时避免直接增添原文没有明说的“遵行”；脚注说明可按汉语语义译得更明确。
- source_word: ἐξ ὅλης τῆς ἰσχύος ἡμῶν
  choice: 竭尽全力
  rationale: 自然表达“从我们全部的力量”，准确传达全力以赴之意。
- source_word: ἐργασώμεθα ἔργον δικαιοσύνης
  choice: 行公义的事
  rationale: 避免机械重复“做……工作”，以自然庄重的汉语表达从事符合公义之事；保留“公义”这一伦理及神学用语。
theological_decisions:
- issue: “走向他的旨意”是否等同于“遵行他的旨意”
  choice: 正文保留“走向”的趋近意象
  alternative: 毫不迟疑地遵行他的旨意／投身于他的旨意
  rationale: 原文以 προσέρχομαι 搭配“旨意”，表达较为独特，可能含有接近、投身或顺服之意。正文不把这种张力直接收窄为单一的“遵行”，脚注则提供自然的解释性译法。
- issue: “公义的事”的性质
  choice: 不增添称义、功德或得救条件等解释
  alternative: 行使人称义的工作／积累义行
  rationale: 原文只劝勉读者从事公义之工，并未在本句界定其与称义或救恩的系统关系。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“所以”“既有……就让我们……”清楚呈现推论关系；两个“让我们”保留原文共同劝勉的语气。正文中的脚注标记与脚注条目一致。
