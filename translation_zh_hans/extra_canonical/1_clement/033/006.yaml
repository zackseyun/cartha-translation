  text: ταῦτα οὖν πάντα τελειώσας ἐπῄνεσεν αὐτὰ καὶ ηὐλόγησεν καὶ εἶπεν· Αὐξάνεσθε καὶ πληθύνεσθε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/006.yaml
  text: So then, having completed all these things, he praised them and blessed them and said, “Be fruitful and multiply.”
translation:
  language: zh_hans
  text: 因此，他完成了这一切之后，就称许它们，赐福给它们，说：“要繁衍增多。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελειώσας
  choice: 完成了
  rationale: 以完成体分词表达先于主要动作发生的行为；“完成”既贴近词义，也符合现代汉语叙事。
- source_word: ἐπῄνεσεν
  choice: 称许
  rationale: 保留“赞许、认可”受造之物的含义；比“赞美”更自然地用于创造者对所造之物的肯定。
- source_word: ηὐλόγησεν
  choice: 赐福
  rationale: 在上帝向受造物施予福分的语境中，“赐福”比泛义的“祝福”更准确。
- source_word: Αὐξάνεσθε καὶ πληθύνεσθε
  choice: 要繁衍增多
  rationale: 两个命令分别表达生长繁衍与数量增加；“繁衍增多”自然简洁，并避免把 αὐξάνεσθε 过度限定为仅指植物结果实。
theological_decisions:
- issue: ἐπῄνεσεν αὐτά 所表达的上帝对受造物的评价
  choice: 称许它们
  alternative: 赞美它们
  rationale: “称许”保留主动肯定、认可之意，又避免现代汉语中“赞美”通常带有敬拜或颂扬对象的色彩。
- issue: 创世命令 Αὐξάνεσθε 的译法
  choice: 要繁衍
  alternative: 要生养
  rationale: 原文未在本句明说对象只限于人类；“繁衍”可涵盖各类有生命的受造物，较能保存上下文可能具有的宽泛指向。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文“完成—称许—赐福—说”的动作顺序，同时避免生硬直译。
