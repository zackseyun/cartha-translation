  yaml_path: translation/extra_canonical/1_clement/033/002.yaml
  text: For the Creator and Master of all himself rejoices in his works.
translation:
  language: zh_hans
  text: 因为万有的创造者和主宰自己因自己的作为而欣喜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργὸς
  choice: 创造万有……的那一位
  rationale: 此处指创造者；结合“τῶν ἁπάντων”，译为“创造万有”比音译或较生硬的“造物主”更直接自然。
- source_word: δεσπότης
  choice: 主宰万有
  rationale: 保留该词所表达的绝对权柄，同时避免现代汉语中“主人”可能引起的狭窄联想。
- source_word: ἐπὶ τοῖς ἔργοις αὐτοῦ
  choice: 因自己的作为
  rationale: ἐπί与与格在此表达欢喜所缘由或所基于的对象；“作为”既可涵盖创造之工，也不把含义限定得过窄。
- source_word: ἀγάλλεται
  choice: 欢喜
  rationale: 表达强烈、欣然的喜悦，语体庄重而自然。
- source_word: αὐτὸς
  choice: 亲自
  rationale: 保留希腊文强调代词的语气，突出创造并主宰万有者自身也因其作为欢喜。
theological_decisions:
- issue: “创造者”和“主宰”是否直接译作神圣称号
  choice: 采用描述式表达“创造万有、主宰万有的那一位”
  alternative: “造物主和万有的主宰”
  rationale: 描述式译法忠实呈现两个并列称谓及共同的“万有”范围，不额外加入原文未明说的专名或宗派性措辞。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语；通过“那一位，亲自”保留原文主语的强调，句式适合公共诵读。
