  terminology: “主宰”可恰当呈现 δεσπότης 的权柄意味，且不越过原文确定其具体指称；“善工”也适合本段庄重语域。将“丢弃爱”微调为“舍弃爱”，语气自然且仍保留 ἐγκαταλίπωμεν 的离弃意味。
