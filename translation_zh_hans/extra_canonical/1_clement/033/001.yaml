source:
  edition: Funk 1901 (normalized OCR)
  text: Τί οὖν ποιήσωμεν, ἀδελφοί; ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας καὶ ἐγκαταλίπωμεν τὴν ἀγάπην; μηδαμῶς τοῦτό ἐάσει ὁ δεσπότης ἐφ’ ἡμῖν γε γενηθῆναι, ἀλλὰ σπεύσωμεν μετὰ ἐκτενείας καὶ προθυμίας πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/001.yaml
  text: What then shall we do, brothers? Shall we cease from doing good and abandon love? May the Master never allow this to happen among us. Rather, let us hasten with earnestness and eagerness to accomplish every good work.
translation:
  language: zh_hans
  text: 那么，弟兄们，我们该怎么办呢？难道要停止行善[a]，舍弃爱吗？愿主宰绝不容许这事发生在我们中间。相反，让我们怀着热切和积极的心，赶紧去完成每一件善工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道要不再行善”。
    reason: 说明 ἀργέω ἀπό 的核心意思是停止、离开行善，而不是仅仅懒散地行善。
lexical_decisions:
- source_word: ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας
  choice: 停止行善
  rationale: ἀργέω 与 ἀπό 连用表示停止、离开某项行动；这里不是指仍在行善却变得懒散，而是停止行善。
- source_word: ἐγκαταλίπωμεν τὴν ἀγάπην
  choice: 丢弃爱
  rationale: ἐγκαταλείπω 表示抛下、离弃；直译保留第二个反问的力度。
- source_word: ὁ δεσπότης
  choice: 主宰
  rationale: δεσπότης 强调拥有权柄的主人；译作“主宰”既区别于通常对应 κύριος 的“主”，也保留其庄重意味。
- source_word: μετὰ ἐκτενείας καὶ προθυμίας
  choice: 满怀热忱，殷勤地
  rationale: ἐκτένεια 指持续而热切的投入，προθυμία 指甘心、积极的意愿；用两个自然的汉语表达保留并列含义。
- source_word: σπεύσωμεν ... ἐπιτελεῖν
  choice: 赶快完成
  rationale: σπεύδω 表示急切、迅速投入，ἐπιτελέω 表示完成、成就；合译保留行动的迫切感及完成之意。
- source_word: πᾶν ἔργον ἀγαθόν
  choice: 一切善工
  rationale: 保留“每一项/一切善的工作”的概括性；“善工”在庄重宗教语境中简洁自然。
theological_decisions:
- issue: δεσπότης 的称谓
  choice: 主宰
  alternative: 主
  rationale: 原文强调至高权柄，但没有明说具体所指；“主宰”保留这一语义及指称上的开放性，不擅自补作“上帝”或“基督”。
- issue: μηδαμῶς ... γενηθῆναι 的祈愿语气
  choice: 愿主宰绝不容这样的事发生在我们中间
  alternative: 主宰绝不会让这样的事发生在我们中间
  rationale: μηδαμῶς 配合祈愿性表达更像强烈愿望，而非单纯预言或保证；用“愿……绝不”保留劝勉中的祈愿语气。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。保留连续反问、强烈祈愿和转折劝勉的修辞结构；“弟兄们”依照古代群体称呼，不额外改写为解释性包容称谓。
