  rationale: 作最小限度的语言调整：将劝勉式察看表达改得更自然，将“得着妆饰”调整为更顺畅的“得了妆饰”，并以“随后”呈现分词与主句动词之间的时序，而不额外强化因果。其余关键词、主的反身动作及两句平行的装饰意象均予保留。
