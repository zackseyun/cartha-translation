base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/007.yaml
  text: Let us see that all the righteous were adorned with good works[a], and that the Lord himself also, having adorned himself with good works[b], rejoiced.
translation:
  language: zh_hans
  text: 让我们看一看：所有义人都因善行而得了妆饰；主自己也以善行妆饰了自己，随后欢喜了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: 我们来看
  rationale: 以劝勉式表达第一人称复数虚拟式，表示邀请读者一同察看、留意，而不是“确保”。
- source_word: ἐν ἔργοις ἀγαθοῖς
  choice: 因善行而
  rationale: 在首句中与被动动词连用，表达善行是义人所得妆饰的凭借；避免把善行仅理解为空间性的“在……之中”。
- source_word: ἐκοσμήθησαν
  choice: 得着妆饰
  rationale: 保留希腊语被动语态及“装饰、使荣美”的意象。
- source_word: ὁ κύριος
  choice: 主
  rationale: 采用早期基督教文本中自然且庄重的通行称谓，不擅自限定所指。
- source_word: κοσμήσας
  choice: 妆饰了
  rationale: 译出不定过去主动分词，并以“了……便……”体现妆饰先于欢喜的叙事关系。
- source_word: ἐχάρη
  choice: 欢喜了
  rationale: 直接表达 χαίρω 的喜乐含义，并保留不定过去时的事件性。
theological_decisions:
- issue: 义人、善行与妆饰之间的关系
  choice: 保留“义人因善行而得着妆饰”的陈述
  alternative: 解释为义人凭善行称义或得救
  rationale: 原文谈的是善行带来的妆饰或荣美，并未明确论述称义或得救的因果关系，因此不加入体系化教义结论。
- issue: 主以善行妆饰自己
  choice: 按原文保留这一强烈而不寻常的形象
  alternative: 弱化为“主也行了善事”
  rationale: 原文明确重复 κοσμέω 的词根并使用反身代词 ἑαυτόν；直保其修辞张力，不将其改写为一般性的行善陈述。
- issue: καὶ αὐτὸς δὲ 的附加语气
  choice: 主自己也
  alternative: 甚至主自己
  rationale: “也”自然表达主与前述众义人的附加关系，“自己”体现 αὐτός 的强调；不以“甚至”过度强化原文未必要求的递进意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“妆饰”保留原文重复出现的装饰意象；首句保留被动结构，次句保留主的反身主动结构。分号呈现两句的平行与推进关系。
