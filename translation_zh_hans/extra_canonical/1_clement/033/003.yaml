source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ παμμεγεθεστάτῳ αὐτοῦ κράτει οὐρανοὺς ἐστήριξεν καὶ τῇ ἀκαταλήπτῳ αὐτοῦ συνέσει διεκύβευσεν αὐτούς· τὴν τε γῆν διεχώρισεν ἀπὸ τοῦ περιέχοντος αὐτὴν ὕδατος καὶ ἔδρασεν ἐπὶ τὸν ἀσφαλῆ τοῦ ἰδίου βουλήματος θεμέλιον· τὰ τε ἐν αὐτῇ ζῷα φοιτώντα τῇ ἑαυτοῦ διατάξει ἐκέλευσεν εἶναι· τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ ζῷα προετοιμάσας ἐνέκλεισεν τῇ ἑαυτοῦ δυνάμει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/003.yaml
  text: For by his exceedingly great might he established the heavens[a], and by his incomprehensible understanding he ordered them. He also separated the earth from the water that surrounds it and fixed it upon the secure foundation of his own purpose. And the living creatures that move about on it he commanded to exist by his own ordinance. Having prepared the sea and the living creatures in it, he enclosed it by his own power.
translation:
  language: zh_hans
  text: 因为他以自己无比浩大的能力立定诸天，又以自己深不可测的智慧治理诸天。他把大地同环绕大地的水分开，并将大地安置在他自己旨意的稳固根基上。至于在地上活动的生物，他命令它们照着自己的安排生存。他预先备妥海洋和其中的生物，又以自己的大能加以围限[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“围限”后没有另行明说宾语；所省略的宾语可指海洋，也可承接“海洋和其中的生物”。
    reason: 保留末句希腊文宾语省略所产生的指代余地，避免武断限定为海洋或海洋及其中生物。
lexical_decisions:
- source_word: παμμεγεθεστάτῳ ... κράτει
  choice: 无比浩大的能力
  rationale: 保留最高级所表达的极强程度，并以现代汉语自然表达 κράτος 的力量、权能之意。
- source_word: ἐστήριξεν
  choice: 立定
  rationale: 表达使诸天稳固成立，符合该动词在此处的创造语境，不采用缺乏原文依据的“封闭”。
- source_word: ἀκαταλήπτῳ ... συνέσει
  choice: 深不可测的智慧
  rationale: ἀκατάληπτος 指无法完全领会或测透，σύνεσις 在此指理解力、智慧；此译简明而庄重。
- source_word: διεκύβευσεν
  choice: 治理
  rationale: 该词带有掌舵、引导并妥善管理的意象；“治理”在汉语中自然传达对诸天的有序统管，又不过度凸显隐喻。
- source_word: βουλήματος
  choice: 旨意
  rationale: 兼顾意愿、筹划和定意，适合此处论及创造秩序的语境。
- source_word: διατάξει
  choice: 安排
  rationale: 传达规定、部署或秩序之意；“照着自己的安排生存”比直译“条例”更符合创造语境。
- source_word: ἐνέκλεισεν
  choice: 圈定
  rationale: 表达以能力加以围限、设定边界，适合海洋语境，同时避免把动作狭义化为物理性的封锁。
theological_decisions:
- issue: 大地根基的表述是否应按宇宙结构作实体化解释
  choice: 自己旨意所立的稳固根基
  alternative: 大地下面实体性的稳固根基
  rationale: 原文将根基与上帝自己的旨意相连，重点在其定意的可靠稳固；不额外引入特定宇宙论。
- issue: 末句“圈定”的宾语
  choice: 用“其”保留指代空间，并加注说明
  alternative: 明确译作“将海洋圈定”或“将海洋和其中的生物封闭起来”
  rationale: ἐνέκλεισεν 后没有另行明说宾语，而前面同时出现海洋和其中的生物；正文不应无声消除这一句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保持创造叙述的节奏，以“立定、治理、安置、圈定”等词呈现秩序和权能；避免过度古雅，也不加入特定宗派解释。
