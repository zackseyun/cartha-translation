  to: 因为他以自己无比浩大的能力立定诸天，又以自己深不可测的智慧治理诸天。他把大地同环绕大地的水分开，并将大地安置在他自己旨意的稳固根基上。至于在地上活动的生物，他命令它们照着自己的安排生存。他预先备妥海洋和其中的生物，又以自己的大能加以围限[a]。
