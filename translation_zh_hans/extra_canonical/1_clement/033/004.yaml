  text: ἐπὶ πᾶσι τὸ ἐξοχώτατον καὶ παμμέγεθες κατὰ διάνοιαν, ἄνθρωπον, ταῖς ἱεραῖς καὶ ἀμιάντοις χερσὶν ἔπλασεν τῆς ἑαυτοῦ εἰκόνος χαρακτῆρα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/004.yaml
  text: Above all[a], with his holy and undefiled hands he formed man, the most excellent and exceedingly great work according to his mind, as the imprint of his own image.
translation:
  language: zh_hans
  text: 在万物之上，他用自己圣洁无玷的双手塑造了人；人是按着他心意所成、最卓越且无比伟大的杰作[a]，是他自己形象的印记。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在人悟性方面最卓越且极其伟大的受造者。”
    reason: κατὰ διάνοιαν可理解为指创造者的心意或构想，也可理解为描述人的悟性；正文依上下文采用前者，脚注保留替代理解。
lexical_decisions:
- source_word: ἐπὶ πᾶσι
  choice: 在万物之上
  rationale: 保留该短语“高于／胜过一切”的基本意象，并承接上下文中受造万物的范围。
- source_word: τὸ ἐξοχώτατον καὶ παμμέγεθες
  choice: 最卓越、无比伟大的杰作
  rationale: 两个中性形容词在此实体化，用来说明“人”是受造中的卓越成果；“无比伟大”体现 παμ- 的加强语气。
- source_word: κατὰ διάνοιαν
  choice: 依照他心意而成的
  rationale: κατά 表示依照，διάνοια 可指思想、心意或构想；结合上下文，将其归于创造者，同时避免缩窄为单纯的智力。
- source_word: ἔπλασεν
  choice: 塑造了
  rationale: 准确传达如陶匠塑形般的创造动作，也与“手”这一具体意象自然搭配。
- source_word: χαρακτῆρα
  choice: 印记
  rationale: 保留由原型留下的刻印、表征之意，不将其泛化为仅仅“相似”。
- source_word: τῆς ἑαυτοῦ εἰκόνος
  choice: 他自己形象的
  rationale: 明确反身代词 ἑαυτοῦ 的强调，并保留 εἰκών 的“形象”用语。
theological_decisions:
- issue: κατὰ διάνοιαν 修饰对象的歧义
  choice: 理解为人是依照上帝的心意而成的杰作
  alternative: 理解为人本身在悟性方面最卓越、极其伟大
  rationale: 中性实体化短语与上下文对创造者智慧、旨意和能力的强调，更支持将 διάνοια 归于创造者；但译文仍采用较宽的“心意”，不把它限定为某一系统神学概念。
- issue: χαρακτήρ 与 εἰκών 的关系
  choice: 译为“他自己形象的印记”
  alternative: 译为“具有他自己形象的样式”
  rationale: 直译保留“印记”与“形象”两个彼此关联但并不相同的概念，避免消解原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“圣洁无玷污的双手”保留原文具象表达；以分号整理较长的希腊语句法，使“人”与其同位说明清晰。
