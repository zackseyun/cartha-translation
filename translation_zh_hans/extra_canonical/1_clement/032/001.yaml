base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/001.yaml
  text: If anyone sincerely considers this point by point, he will recognize the greatness of the gifts given by him.
translation:
  language: zh_hans
  text: 人若真诚地逐一细想这一点，就会认识到他所赐的恩赐是何等伟大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰλικρινῶς
  choice: 真诚地
  rationale: 表达以纯正、诚实的态度思考，既贴近词义，也符合现代汉语习惯。
- source_word: καθ’ ἓν ἕκαστον
  choice: 逐项
  rationale: 此短语作方式状语，意为逐一、逐点，而不是“每一件事”这一宾语。
- source_word: κατανοήσῃ
  choice: 细想
  rationale: 兼顾仔细观察、思量和理解之意；在本句中用“细想”自然简洁。
- source_word: ἐπιγνώσεται
  choice: 会认识到
  rationale: 体现经过思考而确知、领会的结果。
- source_word: μεγαλεῖα
  choice: 何等伟大
  rationale: 传达其伟大、宏伟之处；与“恩惠”搭配时采用感叹式汉语更自然。
- source_word: δωρεῶν
  choice: 恩惠
  rationale: 表示白白赐予的礼物或恩赐；此处“恩惠”可自然涵盖这些赐予。
theological_decisions:
- issue: ὑπ’ αὐτοῦ中施予者的身份
  choice: 保留为“他”
  alternative: 明确译为“上帝”
  rationale: 本句代词本身没有明说所指，保留“他”可避免把上下文所需判断直接写入正文。
- issue: 关系代词所指
  choice: 译为“这一点”
  alternative: 译为“这一切”或省略
  rationale: 按Ὃ作为κατανοήσῃ的宾语处理，回指前文内容；“这一点”与条件句结构相合，也不把καθ’ ἓν ἕκαστον误作宾语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“逐项……细想”保留原文逐一审视的方式，“何等伟大”则自然呈现其赞叹语气。
