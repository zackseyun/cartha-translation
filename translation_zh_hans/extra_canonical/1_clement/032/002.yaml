source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξ αὐτοῦ γὰρ ἱερεῖς καὶ λευῖται πάντες οἱ λειτουργοῦντες τῷ θυσιαστηρίῳ τοῦ θεοῦ· ἐξ αὐτοῦ ὁ κύριος Ἰησοῦς τὸ κατὰ σάρκα· ἐξ αὐτοῦ βασιλεῖς καὶ ἄρχοντες καὶ ἡγούμενοι κατὰ τὸν Ἰούδαν· τὰ δὲ λοιπὰ σκῆπτρα αὐτοῦ οὐκ ἐν μικρᾷ δόξῃ ὑπάρχουσιν, ὡς ἐπαγγειλαμένου τοῦ θεοῦ, ὅτι ἔσται τὸ σπέρμα σου ὡς οἱ ἀστέρες τοῦ οὐρανοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/002.yaml
  text: For from him are priests and Levites[a], all who minister at the altar of God; from him is the Lord Jesus according to the flesh; from him are kings and rulers and leaders according to Judah; and his remaining scepters are in no small glory, just as God promised, saying, “Your seed will be as the stars of heaven.”
translation:
  language: zh_hans
  text: 因为祭司和利未人，就是所有在上帝的祭坛处供职的人，都是从他而出；主耶稣按肉身说也是从他而出；君王、统治者和领袖，按犹大一系说，也都是从他而出。至于他其余的权杖[a]，也享有极大的荣耀，正如上帝所应许的：“你的后裔必像天上的星辰。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权杖”在这里可能转喻其余各支派，或各支派中掌权的人。
    reason: 希腊文σκῆπτρα字面意为“权杖”，但其复数形式在本段谱系与支派语境中的具体所指存在歧义。
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: 从他而出
  rationale: 保留原文反复出现的谱系表达及代词所指，不在译文中擅自补明其身份。
- source_word: λειτουργοῦντες
  choice: 供职
  rationale: 在祭坛语境中自然表达礼仪性的服事，同时避免使用带有特定宗派色彩的术语。
- source_word: τὸ κατὰ σάρκα
  choice: 按肉身说
  rationale: 忠实保留基督论表述所限定的层面，不将其弱化为单纯的‘血统上’。
- source_word: κατὰ τὸν Ἰούδαν
  choice: 按犹大一系说
  rationale: 表达与犹大谱系或支派相关的限定，同时保留希腊文措辞的简略性。
- source_word: σκῆπτρα
  choice: 权杖
  rationale: 采用该词的直接意象；其复数在此可能转喻诸支派或执掌权柄者，故以脚注说明而不在正文中消解。
- source_word: οὐκ ἐν μικρᾷ δόξῃ
  choice: 享有非同小可的荣耀
  rationale: 以现代汉语的反意表达再现希腊文曲言强调，意为具有相当大的荣耀。
- source_word: σπέρμα
  choice: 后裔
  rationale: 此处是集合性的谱系用语，‘后裔’比字面的‘种子’更符合现代汉语，同时不限定单数或复数。
theological_decisions:
- issue: “按肉身”与耶稣的谱系关系
  choice: 主耶稣按肉身说也是从他而出
  alternative: 主耶稣在人性方面也是他的后裔
  rationale: 正文保留κατὰ σάρκα的传统且较为形式对应的说法，避免把原文所保留的基督论张力解释成单纯的人性或血缘陈述。
- issue: “其余的权杖”的指向
  choice: 正文保留“权杖”，脚注提示可能的转喻义
  alternative: 直接译作“其余各支派”
  rationale: σκῆπτρα的字面意义确为‘权杖’，但在上下文中可能代指支派或其掌权者；保留意象能避免过度裁定。
- issue: 反复出现的“他”所指
  choice: 保留代词“他”
  alternative: 补译为“雅各”
  rationale: 原文使用代词；虽然上下文很可能指雅各，但正文不应越过本节措辞直接消除指代关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；通过重复“从他而出”保留原文排比，以分号呈现长句层次。避免古奥措辞和宗派专用语，同时保留“按肉身”“权杖”等具有原文神学或修辞分量的表达。
