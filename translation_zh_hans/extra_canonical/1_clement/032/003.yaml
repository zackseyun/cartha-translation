  text: πάντες οὖν ἐδοξάσθησαν καὶ ἐμεγαλύνθησαν οὐ δι’ αὑτῶν ἢ τῶν ἔργων αὐτῶν ἢ τῆς δικαιοπραγίας ἧς κατειργάσαντο, ἀλλὰ διὰ τοῦ θελήματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/003.yaml
  text: Therefore all were glorified and magnified, not through themselves or through their works or through the righteous deeds that they did, but through his will.
translation:
  language: zh_hans
  text: 因此，他们全都得了荣耀，并被尊为大；这不是由于他们自己、他们的行为，或他们所行合乎义的行为，而是由于他的旨意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: 得了荣耀
  rationale: 采用自然的被动意义表达，保留“被赋予荣耀”的含义，同时避免生硬的“被荣耀”。
- source_word: ἐμεγαλύνθησαν
  choice: 被尊为大
  rationale: 保留与“得了荣耀”并列的被动形式及“被高举、被显为尊大”的语义。
- source_word: δικαιοπραγίας
  choice: 所行的义
  rationale: 该词指正直或合乎义的行为；此译简洁、庄重，并与后面的“行”构成自然表达。
- source_word: θελήματος
  choice: 旨意
  rationale: 在谈论上帝的意愿时，“旨意”是现代汉语中自然且庄重的对应词。
theological_decisions:
- issue: 荣耀与尊大的根据
  choice: 用“不是……而是……”完整保留原文对人的自身、行为、义行与上帝旨意之间的对比
  alternative: 将其解释性译为“不是靠功德，而是靠恩典”
  rationale: 原文明确说“他的旨意”，并未在本节使用“恩典”一词；不应加入原文没有明说的神学术语。
- issue: αὐτοῦ所指对象
  choice: 译作“他的”，保留代词形式
  alternative: 明确译作“上帝的”
  rationale: 上下文可指明其所指，但本节原文本身使用代词；保留代词可避免过度显化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号凸显结论与根据之间的转折；保留原文三个否定成分的层递结构。
