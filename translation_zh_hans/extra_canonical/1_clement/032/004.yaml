id: 1CLEM.32.4
reference: 1 Clement 32:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν, διὰ θελήματος αὐτοῦ ἐν Χριστῷ Ἰησοῦ κληθέντες, οὐ δι’ ἑαυτῶν δικαιούμεθα οὐδὲ διὰ τῆς ἡμετέρας σοφίας ἢ συνέσεως ἢ εὐσεβείας ἢ ἔργων ὧν κατειργασάμεθα ἐν ὁσιότητι καρδίας, ἀλλὰ διὰ τῆς πίστεως, δ’ ἧς πάντας τοὺς ἀπ’ αἰῶνος ὁ παντοκράτωρ θεὸς ἐδικαίωσεν· ᾧ ἔστω ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/004.yaml
  text: And so we also[a], having been called through his will in Christ Jesus, are not justified by ourselves, nor by our own wisdom or understanding or godliness or works that we have done in holiness of heart, but through faith, by which the Almighty God has justified all who have been from the beginning. To him be the glory forever and ever[b]. Amen.
translation:
  language: zh_hans
  text: 所以，我们也是按照他的旨意，在基督耶稣里蒙召的。我们得以称义，并不是靠自己，也不是靠自己的智慧、悟性、敬虔，或靠我们以圣洁的心所行的事，而是借着信；全能的上帝借着这信，使自古以来所有的人称义。愿荣耀归给他，直到永永远远。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ θελήματος αὐτοῦ
  choice: 按着他的旨意
  rationale: 表达蒙召出于上帝旨意这一施动依据；现代汉语中比直译为“借着他的旨意”更自然。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在基督耶稣里
  rationale: 保留早期基督教书信中固定而重要的联合性表达；Χριστός依上下文译作惯用称号“基督”。
- source_word: δικαιούμεθα / ἐδικαίωσεν
  choice: 得以称义／使……称义
  rationale: 保留同一词根的呼应，也保留其法庭性、关系性及神学张力，不改写为较笼统的“成为义人”。
- source_word: σοφίας ἢ συνέσεως
  choice: 智慧、悟性
  rationale: 以“智慧”对应σοφία，以“悟性”对应σύνεσις，呈现两者相近却不完全相同的含义。
- source_word: εὐσεβείας
  choice: 敬虔
  rationale: 指向对上帝的虔敬生活，采用现代汉语基督教文献中庄重而通行的表达。
- source_word: ἔργων ὧν κατειργασάμεθα
  choice: 我们……所行的事
  rationale: 自然表达已经实行出来的行为；不额外强化为功绩，也不削弱原文对“行为”的明确提及。
- source_word: ἐν ὁσιότητι καρδίας
  choice: 以圣洁的心
  rationale: 保留“心”的内在指向，并以自然汉语表达行为是在内心圣洁中做出的。
- source_word: διὰ τῆς πίστεως
  choice: 借着信
  rationale: 保留πίστις在此作为称义途径的表述；“信”比“信仰体系”更贴近此处的个人信靠含义，同时不擅自补出信的对象。
- source_word: τοὺς ἀπ’ αἰῶνος
  choice: 自古以来……众人
  rationale: 原短语带有省略性，指历世以来蒙上帝称义的人；译文避免生硬的“从永世以来的人”，也不把范围限定为某一特定群体。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 采用庄重、通行的汉语颂赞语，准确表达强化的永久时段。
theological_decisions:
- issue: 称义的依据与途径
  choice: 明确区分人的自身、智慧、悟性、敬虔和行为，与“借着信”之间的对照
  alternative: 将δικαιόω泛化为“得救”或“成为好人”
  rationale: 原文反复使用δικαιόω，并以οὐ…ἀλλά构成鲜明对照；应保留“称义”及其论证结构，而不替作者解决称义与行为之间更广泛的神学关系。
- issue: πίστις的含义
  choice: 译为“信”
  alternative: 译为“忠信”或明确写成“对基督的信心”
  rationale: 这里的语境较支持“信／信心”，但原文没有明说信的对象，也没有足够依据排除πίστις可能带有忠信色彩，因此正文采用较宽而自然的“信”。
- issue: “自古以来的众人”的范围
  choice: 译作“全能的上帝自古以来使众人称义，都是借着这信”
  alternative: 译作“上帝使从创世以来的每一个人都称义”
  rationale: πάντας τοὺς ἀπ’ αἰῶνος在语法上有所省略，语境指历世蒙称义者，而非宣告所有人生来或无条件地都已称义；译文保留广泛范围，但不导入普救论结论。
translation_notes:
  register: 采用现代、庄重而可朗读的书信体汉语。句式保留原文从蒙召到称义、再到颂赞的推进；将过长的希腊语句适度分句，并用分号维持“不是……而是……”与后续关系从句的紧密联系。
