revisions:
- from: 所以，我们也一样，是按着他的旨意在基督耶稣里蒙召的。我们得以称义，并不是靠自己，也不是靠自己的智慧、悟性、敬虔，或靠我们以圣洁的心所行的事，而是借着信；全能的上帝自古以来使众人称义，都是借着这信。愿荣耀归给他，直到永永远远。阿们。
  to: 所以，我们也是按照他的旨意，在基督耶稣里蒙召的。我们得以称义，并不是靠自己，也不是靠自己的智慧、悟性、敬虔，或靠我们以圣洁的心所行的事，而是借着信；全能的上帝借着这信，使自古以来所有的人称义。愿荣耀归给他，直到永永远远。阿们。
  rationale: 修订仅澄清末句的句法关系并略作现代汉语润饰：将“自古以来”移至其所限定的“所有的人”之前，并将“借着这信”置于上帝称义行动之前。此举保留原文对该群体范围的省略性与广泛表述，不加入任何特定教义解释。其余关键术语和原文的否定—转折结构均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:38:25Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了蒙召、不是靠人的自身条件或行为而称义、乃借着信，以及颂赞的论证与语气。末句“全能的上帝自古以来使众人称义”中“自古以来”在汉语句法上较容易修饰“使……称义”的动作；但原文ἀπ’ αἰῶνος直接限定“众人／所有的人”。调整语序可更清楚地反映原文，同时不替原文省略的人群范围作教义性限定。
  naturalness: 整体为自然、庄重的现代书面汉语。“按着”可改为更通行的“按照”；删去“也一样”可避免口语化的重复。“借着这信使自古以来所有的人称义”能更紧密、清楚地表达关系从句所说明的信的作用。
  terminology: “基督耶稣”“称义”“敬虔”“全能的上帝”“阿们”均恰当，并保留δικαιόω在前后两处的术语呼应。“悟性”可对应σύνεσις。“信”没有擅自补出其对象，处理审慎。无需沿用英文审计稿中与中文正文无对应位置的a、b脚注；尤其英文b注与该处锚点并不相符。
  issues:
  - severity: medium
    issue: 末句中“自古以来”的修饰对象不够明确。
    rationale: 希腊文τοὺς ἀπ’ αἰῶνος中的时间短语修饰直接宾语“所有的人”，不是主要修饰上帝“使……称义”的动作。中文宜通过语序明确其归属。
  - severity: low
    issue: “所以，我们也一样”略显重复、口语化。
    rationale: καὶ ἡμεῖς οὖν可自然译为“所以，我们也”，已同时体现推论和“我们也”的添加语气。
  revised_text: 所以，我们也是按照他的旨意，在基督耶稣里蒙召的。我们得以称义，并不是靠自己，也不是靠自己的智慧、悟性、敬虔，或靠我们以圣洁的心所行的事，而是借着信；全能的上帝借着这信，使自古以来所有的人称义。愿荣耀归给他，直到永永远远。阿们。
  revised_footnotes: []
