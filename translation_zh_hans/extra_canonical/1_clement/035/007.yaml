  text: λέγει γὰρ ἡ γραφή· Τί δὲ ἀπαγγέλλεις εἰπεῖν ὁ θεός· Ἱνατί σὺ διηγεῖ τὰ δικαιώματά μου, καὶ ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/007.yaml
  text: For the Scripture says, “But to the wicked God says, Why do you recount my statutes, and take up my covenant on your lips?
translation:
  language: zh_hans
  text: 因为经上说：“神却对恶人说[a]：‘你为什么述说我的律例，把我的约挂在嘴上？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据希腊文电子文本在引文开头显有识别讹误；按此处所引《诗篇》49:16（七十士译本编号；希伯来文本及多数现代译本编号为50:16）的可辨认原句，意思是“神却对恶人说”。
    reason: 说明源文本引文开头的明显OCR讹误及译文还原依据，避免把损坏字串误作正文翻译。
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: 因为经上说
  rationale: 保留引经公式及其现在时表达；“经上”是自然、庄重的现代汉语圣经用语。
- source_word: τῷ δὲ ἁμαρτωλῷ（按引文还原）
  choice: 神却对恶人说
  rationale: 所引《诗篇》原句指行为邪恶、背弃神训诲的人；译作“恶人”比“罪人”更贴合此处责问的语境，也避免把重点泛化为所有有罪的人。
- source_word: διηγῇ
  choice: 述说
  rationale: 表达逐一讲述、宣讲之意，并保持反问句的庄重语气。
- source_word: τὰ δικαιώματά μου
  choice: 我的律例
  rationale: δικαιώματα在此指神所颁定的规条、法令；“律例”准确且为普通读者熟悉。
- source_word: ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου
  choice: 口中提说我的约
  rationale: 保留“把约带到口上”的形象，同时用自然汉语表达仅在口头谈论神之约的意思。
theological_decisions:
- issue: ὁ θεός与引语对象的句法关系
  choice: 神却对恶人说
  alternative: 但恶人说神
  rationale: 现存电子录文的引文开头明显讹乱；依据可辨认的《诗篇》49:16（七十士译本编号）引文结构，神是说话者，恶人是受话者。
- issue: εἶπεν的时态呈现
  choice: 说
  alternative: 曾说
  rationale: 希腊语引经公式先用现在时“经上说”，引文中的不定过去时可自然译为汉语无形态时态的“说”；不额外加入“曾”，以保持经文在当前发声的引述效果。
- issue: “约”是否具体化
  choice: 我的约
  alternative: 我与你所立的约
  rationale: 原文只说“我的约”，没有明说立约对象或约的类型，因此不作神学性补充。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“述说”“律例”“约”保留经文语体，但句法按现代汉语调整；反问与“口中提说”的意象均予保留。
