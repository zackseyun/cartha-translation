  text: I will rebuke you and set it before your face.
translation:
  language: zh_hans
  text: 我要责备你，并把你置于你自己面前。†
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλέγξω
  choice: 我要责备
  rationale: 表达将来时和揭露、指责过错的语义，符合审判语境中的庄重口吻。
- source_word: παραστήσω
  choice: 摆在……面前
  rationale: 保留“使之呈现、置于眼前”的具体意象，并使现代汉语自然。
- source_word: κατὰ πρόσωπόν σου
  choice: 在你面前
  rationale: 按惯用汉语表达直译其当面呈现之意。
- source_word: σε（παραστήσω之后的文本形式）
  choice: 把这一切
  rationale: 现有希腊文本字面重复“你”，但此句源自《诗篇》49:21（七十士译本），常见文本在此为“把你的罪摆在你面前”；结合引文语境与英语审定层的隐含宾语 it，以“一切”指代先前所列之事，避免汉语中不通顺且易误解的“把你摆在你面前”。
theological_decisions:
- issue: παραστήσω的宾语在所给文本中是σε，但引文传统与语义期待指向被责备之事
  choice: 用“把这一切”明示语境中隐含的受事
  alternative: 把你摆在你面前
  rationale: 所给读法若机械直译，在汉语中语义反常；“这一切”不额外限定为“罪”，既反映引文所指的过犯，也保留现有文本与引文传统之间的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留原句简短、有力的审判宣告语气。
