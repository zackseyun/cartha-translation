id: 1CLEM.35.3
reference: 1 Clement 35:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: τίνα οὖν ἄρα ἐστὶν τὰ ἑτοιμασμένα τοῖς ὑπομένουσιν; ὁ δημιουργὸς καὶ πατὴρ τῶν αἰώνων ὁ πανάγιος αὐτὸς γινώσκει τὴν ποσότητα καὶ τὴν καλλονὴν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/003.yaml
  text: What then are the things prepared for those who patiently endure? The Creator and Father of the ages[a], the all-holy one himself[b], knows their measure and their beauty.
translation:
  language: zh_hans
  text: 那么，为那些恒心忍耐的人所预备的，究竟是什么呢？至圣的创造主、万世之父亲自知道这一切有多少、多么美好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομένουσιν
  choice: 恒心忍耐的人
  rationale: 该现在分词在此独立使用，指持续忍耐、坚守的人；原文没有“为他”之意，因此不增补宾语。
- source_word: δημιουργὸς
  choice: 创造主
  rationale: 表达创造万有者的身份，较“造物者”更符合庄重而自然的现代汉语宗教文体。
- source_word: πατὴρ τῶν αἰώνων
  choice: 万世之父
  rationale: 保留 αἰώνων 的复数及其可涵盖历世、万世的广度，不窄化为单一时代。
- source_word: ποσότητα
  choice: 有多少
  rationale: 原词首先表示数量、程度或广大；与后面的“美好”并列，用自然汉语表达为“有多少”。
- source_word: καλλονὴν
  choice: 多么美好
  rationale: 传达美丽、优美和美善的特质；在所预备的福分这一语境中，“美好”比单说外观的“美丽”更自然，同时不额外限定其性质。
theological_decisions:
- issue: 忍耐者是否明确是“为他”忍耐
  choice: 不加入“为他”
  alternative: 为他恒心忍耐的人
  rationale: 本节希腊文 τοῖς ὑπομένουσιν 没有宾语；加入“为他”会把下一节可能出现的内容提前带入本节。
- issue: τῶν αἰώνων 的范围
  choice: 万世
  alternative: 诸时代／永恒
  rationale: “万世”既保留复数所表达的历世范围，也避免直接把词义收窄为抽象的“永恒”。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。以“究竟是什么呢”保留 οὖν ἄρα 的推论性和修辞问句力度；末句调整为自然汉语语序，但保留“亲自”对 αὐτός 的强调。
