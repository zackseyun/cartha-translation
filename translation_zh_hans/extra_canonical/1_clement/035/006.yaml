  text: ταῦτα γὰρ οἱ πράσσοντες στυγητοὶ τῷ θεῷ ὑπάρχουσιν· οὐ μόνον δὲ οἱ πράσσοντες αὐτά, ἀλλὰ καὶ οἱ συνευδοκοῦντες αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/006.yaml
  text: For those who practice these things are hateful to God; and not only those who practice them, but also those who approve of them.
translation:
  language: zh_hans
  text: 因为行这些事的人是上帝所憎恶的；不但行这些事的人，连赞同他们的人也是上帝所憎恶的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράσσοντες
  choice: 做……事的人
  rationale: 保留持续或惯常实行这些行为的含义，同时采用自然的现代汉语表达。
- source_word: στυγητοὶ τῷ θεῷ
  choice: 上帝所憎恶的
  rationale: 准确表达与格施事者结构以及强烈的厌恶意味，不弱化为仅仅“不蒙喜悦”。
- source_word: συνευδοκοῦντες αὐτοῖς
  choice: 赞同他们的人
  rationale: 表达对行为者的认同和认可；“他们”按语法指做这些事的人。
theological_decisions:
- issue: 上帝对行恶者的态度
  choice: 译为“上帝所憎恶的”
  alternative: “上帝所厌恶的”
  rationale: 原文 στυγητοί 语气强烈，直译能保留经文的神学张力，而不另行解释这种憎恶的性质。
- issue: 赞同行恶者所负的责任
  choice: “连赞同他们的人也是如此”
  alternative: “连认可这些事的人也是如此”
  rationale: 原文 αὐτοῖς 的语法指向是人而非事情，因此保留“他们”；“也是如此”明确承接“上帝所憎恶的”，又避免不必要重复。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文“不但……连……也……”的递进结构，并以“如此”承接前述判断，使表达简洁清楚。
