  yaml_path: translation/extra_canonical/1_clement/035/009.yaml
  text: These things you did, and I kept silent; you supposed, lawless one, that I would be like you.
translation:
  language: zh_hans
  text: 这些事你都做了，我却静默不语；你这不法的人竟以为，我会和你一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα ἐποίησας
  choice: 这些事你都做了
  rationale: 直接保留指示代词和第二人称陈述；“都”自然表达复数概括，不额外限定具体行为。
- source_word: ἐσίγησα
  choice: 我却静默不语
  rationale: “静默不语”准确传达保持沉默；“却”体现前后行为的反差。
- source_word: ὑπέλαβες
  choice: 竟以为
  rationale: 表达这里的认定或设想；“竟”传达责问语气，而不改变命题内容。
- source_word: ἄνομε
  choice: 你这不法的人
  rationale: 保留形容词作呼语的用法，指违反律法或行事不法者；避免译成仅表示一般道德评价的“恶人”。
- source_word: ἔσομαι ὅμοιος σοι
  choice: 我会和你一样
  rationale: 自然而贴近原文地保留将来时及比较关系。
theological_decisions:
- issue: 神的沉默是否意味着认同
  choice: 按原文保留“我却静默不语”与“你……以为”之间的张力
  alternative: 解释性译为“我暂不惩罚，你便以为我认同你”
  rationale: 原文没有明说沉默的期限、原因或具体后果，也没有直接使用“认同”；不把解释写入正文。
- issue: ὅμοιος 所表达的相似范围
  choice: 译为“和你一样”
  alternative: 译为“也像你那样不法”
  rationale: 原文只说“相似/一样”，未明确限定相似的具体方面，应保留其概括性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你这不法的人”保留直接呼语和审判语气；全句分号对应原文两组紧密相连的陈述。
