- from: “献上赞美为祭的，必荣耀我；在那里有一条路，我要使他看见上帝的救恩。”
  to: “赞美之祭必荣耀我；在那里有一条路，我要借此向他显明上帝的救恩。”
  rationale: 修订恢复“赞美之祭”作为首句主语，并以“借此”明确关系代词与“路”的关联。仍逐字保留所给Funk文本中“在那里有一条路”的突兀、可能有文本张力的表达，不擅自采用诗篇通行文本的释义性读法。
