  yaml_path: translation/extra_canonical/1_clement/035/012.yaml
  text: A sacrifice of praise will glorify me, and there is the way by which I will show him the salvation of God.”
translation:
  language: zh_hans
  text: “赞美之祭必荣耀我；在那里有一条路，我要借此向他显明上帝的救恩。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία αἰνέσεως
  choice: 赞美为祭
  rationale: 保留‘祭’的献祭意象，同时用现代汉语清楚表达这是以赞美为内容的祭。
- source_word: δοξάσει με
  choice: 必荣耀我
  rationale: 按直陈将来时表达结果或应许，不额外补出原文未明说的主语身份。
- source_word: ἐκεῖ ὁδός
  choice: 在那里有一条路
  rationale: 尽量保留现存希腊文本简略且略显突兀的措辞，不依后世常见经文形式擅自改作‘行为正直’。
- source_word: δείξω αὐτῷ
  choice: 我要使他看见
  rationale: δείκνυμι可指展示、使人看见；此译法与后接‘救恩’自然衔接。
- source_word: τὸ σωτήριον τοῦ θεοῦ
  choice: 上帝的救恩
  rationale: σωτήριον在此作名词，指上帝所施行的拯救；‘救恩’兼顾庄重与通俗。
theological_decisions:
- issue: ἐκεῖ ὁδός的文本张力
  choice: 在那里有一条路
  alternative: 行为正直的人／在那里预备道路的人
  rationale: 所给Funk 1901文本明确为ἐκεῖ ὁδός；即使其表达可能反映引文传抄差异，也应保存该版本的真实歧义，而非按诗篇通行文本校正。
- issue: 救恩的归属
  choice: 上帝的救恩
  alternative: 上帝所赐的救恩
  rationale: 保留τοῦ θεοῦ属格的开放性，不把它限定为来源属格。
translation_notes:
  register: 采用现代、庄重而易懂的引文体。保留原文两分句的结构以及‘在那里有一条路’的异常表达，不以解释性增译消除文本张力。
