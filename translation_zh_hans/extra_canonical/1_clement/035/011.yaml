  yaml_path: translation/extra_canonical/1_clement/035/011.yaml
  text: Understand these things[a], then, you who forget God, lest he seize you like a lion, and there be no one to rescue.
translation:
  language: zh_hans
  text: 你们这些忘记上帝的人，要明白这些事，免得他像狮子一样抓住你们，无人搭救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνετε
  choice: 要明白
  rationale: 这是 συνίημι 的命令式，要求听者领会并认真看待前述之事；“要明白”自然、庄重，也保留劝诫语气。
- source_word: οἱ ἐπιλανθανόμενοι τοῦ θεοῦ
  choice: 你们这些忘记上帝的人
  rationale: 按希腊文现在分词及其属格宾语直译，保留对受众直接而严厉的称呼。
- source_word: ἁρπάσῃ
  choice: 把你们攫去
  rationale: 该动词表示猛然抓住、夺去；希腊文宾语省略，但由受话者可明确补足。“攫去”与狮子的比喻相称。
- source_word: ὁ ῥυόμενος
  choice: 搭救的人
  rationale: 该实词化分词指把人从危险中救出者；“搭救”符合具体的危难语境。
theological_decisions:
- issue: ἁρπάσῃ 的主语
  choice: 译作“他”，按紧邻的“上帝”理解
  alternative: 不明说主语，译为“免得有谁像狮子一样把你们攫去”
  rationale: 希腊文动词主语未明写，但最自然的语法承接是前面的“上帝”；保留“他”也维持原文严厉而有张力的警告，不另行弱化。
- issue: ἁρπάσῃ 的隐含宾语
  choice: 补出“你们”
  alternative: 译作“免得他像狮子一样攫取”
  rationale: 希腊文可从呼语对象补足宾语；现代汉语若完全省略，会显得突兀且含义不清，补出“你们”不改变原义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“所以”对应 δὴ 的承接和强调作用；句末“无人搭救”简洁地保留 καὶ μὴ ᾖ ὁ ῥυόμενος 的绝对警告。
