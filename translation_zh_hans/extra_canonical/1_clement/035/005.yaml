  to: 亲爱的诸位，这事怎样才能成就呢？若我们的心思坚定不移、忠信地归向上帝[a]，若我们寻求他所喜悦、所悦纳的事，若我们做合乎他无可指责之旨意的事，并且跟从真理的道路，从自己身上除去一切不义和邪恶、贪婪、纷争、恶毒和诡诈、窃窃私语和毁谤、恨恶上帝[b]、骄傲和狂妄、虚荣和不好客。
