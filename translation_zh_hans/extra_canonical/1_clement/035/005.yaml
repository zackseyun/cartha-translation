source:
  edition: Funk 1901 (normalized OCR)
  text: πῶς δὲ ἔσται τοῦτο, ἀγαπητοί; ἐὰν ἐστηργιμένῃ ἢ ἡ διάνοια ἡμῶν πιστῶς πρὸς τὸν θεόν, ἐὰν ἐκζητήσωμεν τὰ εὐάρεστα καὶ εὐπρόσδεκτα αὐτῷ, ἐὰν ἐπιτελέσωμεν τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ καὶ ἀκολουθήσωμεν τῇ ὁδῷ τῆς ἀληθείας, ἀπορρίψαντες ἀφ’ ἑαυτῶν πᾶσαν ἀδικίαν καὶ πονηρίαν, πλεονεξίαν, ἔρεις, κακοηθείας τε καὶ δόλους, ψιθυρισμούς τε καὶ καταλαλιάς, θεοστυγίαν, ὑπερηφανίαν τε καὶ ἀλαζονείαν, κενοδοξίαν τε καὶ ἀφιλοξενίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/005.yaml
  text: But how will this be[a], beloved? If our mind is firmly fixed on God in faithfulness, if we seek the things pleasing and acceptable to him, if we do the things that are fitting for his blameless will and follow the way of truth, having cast away from ourselves all unrighteousness and wickedness, greed, strife, malice and deceit, whisperings and slanders, hatred of God, pride and arrogance[c][b], vainglory and inhospitality.
translation:
  language: zh_hans
  text: 亲爱的诸位，这事怎样才能成就呢？若我们的心思坚定不移、忠信地归向上帝[a]，若我们寻求他所喜悦、所悦纳的事，若我们做合乎他无可指责之旨意的事，并且跟从真理的道路，从自己身上除去一切不义和邪恶、贪婪、纷争、恶毒和诡诈、窃窃私语和毁谤、恨恶上帝[b]、骄傲和狂妄、虚荣和不好客。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文也可理解为“我们的心思已经忠信地坚定归向上帝”。
    reason: 该形式可表达已然形成并持续的坚定状态；正文以自然汉语表达其状态意义，脚注保留较明显的完成意味。
  - marker: b
    text: “恨恶上帝”也可理解为“上帝所憎恶的”。
    reason: θεοστυγία 的复合构词在主客体关系上存在解释空间；保留脚注以免排除另一种可能。
lexical_decisions:
- source_word: διάνοια
  choice: 心思
  rationale: 指人的思想、内在意向；“心思”比单用“心”或“思想”更自然地涵盖二者。
- source_word: πιστῶς πρὸς τὸν θεόν
  choice: 忠信地……归向上帝
  rationale: 保留 πιστῶς 所表达的忠信、信实方式，同时以“归向”自然表达 πρὸς 的指向关系。
- source_word: τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ
  choice: 合乎他无可指责之旨意的事
  rationale: ἀνήκοντα 表示合宜、相称；βούλησις 在此伦理语境中指旨意或意愿。“无可指责”保留 ἀμώμῳ 的评价意味。
- source_word: κακοηθείας τε καὶ δόλους
  choice: 恶毒和诡诈
  rationale: κακοήθεια 指恶劣品性或恶意，“恶毒”简洁而不额外限定为习惯；δόλος 指欺骗性的诡诈。
- source_word: ψιθυρισμούς τε καὶ καταλαλιάς
  choice: 窃窃私语和毁谤
  rationale: 前者指暗中的议论或中伤，后者指公开或背后的诋毁；译文保留二者区别。
- source_word: κενοδοξίαν
  choice: 虚荣
  rationale: 字面为“空虚的荣耀”，在现代汉语中“虚荣”最自然地表达追逐空名的恶习。
- source_word: ἀφιλοξενίαν
  choice: 不接待客旅
  rationale: 具体表达缺乏好客、拒绝接待陌生人与旅客的含义，较“冷漠待客”更贴近否定形式。
theological_decisions:
- issue: θεοστυγία 的主客体关系
  choice: 恨恶上帝
  alternative: 上帝所憎恶的
  rationale: 该复合词通常可指对上帝的憎恨，但构词可能容许被动理解。正文采用较常见的主动义，并用脚注保留另一种解释。
- issue: πιστῶς 所修饰的关系
  choice: 描述人的心思归向上帝时所具有的忠信
  alternative: 理解为凭信心坚定倚靠上帝
  rationale: 希腊文副词首先说明归向或坚定的方式，未明确使用“信心”这一名词；因此避免把它专门化为某种教义表述。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“亲爱的弟兄姊妹”将呼语 ἀγαπητοί 按群体语境自然展开；连续使用“只要”呈现三个 ἐάν 条件句，并避免生硬照搬希腊语长句结构。恶行清单尽量保持原有次序和并列节奏。
