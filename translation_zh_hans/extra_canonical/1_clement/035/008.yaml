source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ δὲ ἐμίσησας παιδείαν καὶ ἐξέβαλες τοὺς λόγους μου εἰς τὰ ὀπίσω. εἰ ἐθεώρεις κλέπτην, συνέτρεχες αὐτῷ, καὶ μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις. τὸ στόμα σου ἐπλεόνασεν κακίαν, καὶ ἡ γλῶσσά σου περιέπλεκεν δολιότητα. καθήμενος κατὰ τοῦ ἀδελφοῦ σου κατελάλεις, καὶ κατὰ τοῦ υἱοῦ τῆς μητρός σου ἐτίθεις σκάνδαλον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/008.yaml
  text: Yet you hated discipline[a], and cast my words behind you. If you saw a thief, you ran with him, and you placed your share with adulterers. Your mouth overflowed with evil, and your tongue was weaving deceit. Sitting, you were slandering your brother[b], and against your mother's son you were laying a stumbling block.
translation:
  language: zh_hans
  text: 你却恨恶管教[a]，把我的话丢在身后。你若看见盗贼，就与他同流；又与奸夫同伙。你的口大放恶言；你的舌编织诡诈。你坐着时，毁谤自己的弟兄；又给你母亲的儿子设置绊脚石[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“教诲”或“训诲”；原词兼有教导、训练和纠正的含义。
    reason: 保留παιδεία的语义范围。
  - marker: b
    text: “绊脚石”也可译作“陷阱”；原词指使人跌倒或落入圈套之物。
    reason: 说明σκάνδαλον的具象含义及翻译可能。
lexical_decisions:
- source_word: παιδείαν
  choice: 管教
  rationale: 该词可涵盖教导、训练和纠正；“管教”在此与“恨恶”搭配自然，也保留责罚与训诲兼有的意味。
- source_word: συνέτρεχες αὐτῷ
  choice: 与他同流
  rationale: 字面为“与他一同奔跑”；语境指看见盗贼便加入、认同其行径。“同流”自然传达共同行恶之意，又不额外指定具体罪行。
- source_word: μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις
  choice: 与奸夫同伙
  rationale: μοιχοῦ是单数，直译为“把你的份放在一个奸夫那里”；这里表达与奸夫同站一边、共享一份，故译为“与奸夫同伙”，保留单数泛指。
- source_word: περιέπλεκεν δολιότητα
  choice: 编织诡诈
  rationale: 保留περιπλέκω所呈现的缠绕、编织意象；未将其弱化为一般的“说谎”。
- source_word: κατελάλεις
  choice: 毁谤
  rationale: 该词指在背后说人坏话、诋毁；“毁谤”符合庄重语体并清楚表达伤害名誉的言语。
- source_word: σκάνδαλον
  choice: 绊脚石
  rationale: 该词可指陷阱、诱因或使人跌倒之物；“绊脚石”保留原文的具象隐喻及其开放含义。
theological_decisions:
- issue: παιδείαν所指是教育还是惩戒
  choice: 正文译“管教”，脚注列“教诲”
  alternative: 教诲
  rationale: 原词兼具教导、塑造和纠正之意；不把它限定为纯粹惩罚或纯粹知识传授。
- issue: “同母的兄弟”与前句“弟兄”的关系
  choice: 按原文平行结构分别直译
  alternative: 将两者合并理解为同一个人
  rationale: 原文以“你的弟兄”和“你母亲的儿子”平行加强语气；译文不判定二者是否特指同一人，也不把亲属称谓灵意化。
- issue: σκάνδαλον的具体性质
  choice: 保留“绊脚石”隐喻
  alternative: 陷阱／罪名
  rationale: 原文没有明确说明是诱人犯罪、设计陷害，还是造成跌倒，因此不在正文中替作者消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“把我的话丢在身后”“编织诡诈”“绊脚石”等原文意象；动词多译为持续或惯常行为所适合的自然汉语表达。
