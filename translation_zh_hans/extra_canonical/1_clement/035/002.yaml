base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/002.yaml
  text: life in immortality, splendor in righteousness, truth in boldness, faith in confidence, self-control in holiness; and all these things fall under our understanding.
translation:
  language: zh_hans
  text: 不朽中的生命，公义中的光辉，坦然无惧中的真理，确信中的信心，圣洁中的节制；这一切都在我们心思所能领会之内。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθανασίᾳ
  choice: 不朽
  rationale: 指不受死亡辖制的状态；保留抽象名词形式，并与前面的“生命”构成原文的对应结构。
- source_word: λαμπρότης
  choice: 光辉
  rationale: 表达明亮、辉煌之意，比“荣耀”更直接对应此词的光耀意象，也避免额外引入神学术语色彩。
- source_word: δικαιοσύνῃ
  choice: 公义
  rationale: 在早期基督教语境中自然表达 righteousness，同时保留道德与关系层面的宽度。
- source_word: παρρησίᾳ
  choice: 坦然无惧
  rationale: 该词可指公开直言、放胆或坦然；此处用四字表达兼顾坦率与无惧，不把含义缩限为言语行为。
- source_word: πίστις
  choice: 信心
  rationale: 保留其“信、信靠、信实”语义范围中在此抽象德目列表里最自然的中文表达。
- source_word: πεποιθήσει
  choice: 确信
  rationale: 表示信赖所产生的把握和笃定；与“信心”相连而不将两词合并。
- source_word: ἐγκράτεια
  choice: 节制
  rationale: 指自我约束、自制；“节制”是简洁、庄重且通行的德目用语。
- source_word: ἁγιασμῷ
  choice: 圣洁
  rationale: 该词可表示成圣、分别为圣或圣洁状态；此处与其他抽象名词并列，用“圣洁”更自然，同时不强行判定过程性含义。
- source_word: διανοίᾳ
  choice: 心思
  rationale: 指思想、心智或理解能力；“心思”比单用“理解”更接近原文的心智主体。
- source_word: ὑπέπεπτεν
  choice: 原都为……所领会
  rationale: 在现代汉语中自然表达事物进入心智把握范围的意思；“原”体现希腊语过去时态的背景性，同时避免生硬直译为“落在……之下”。
theological_decisions:
- issue: ἁγιασμός应译为状态性的“圣洁”还是过程性的“成圣”
  choice: 圣洁
  alternative: 成圣
  rationale: 上下文是一组以ἐν连接的抽象德目或福分，并未明确突出过程；采用“圣洁”保留状态性读法，但不否认该希腊词也可含成圣过程。
- issue: 末句是否表示人能完全理解所列福分
  choice: 为我们的心思所领会
  alternative: 在我们的心思所能领会的范围内
  rationale: 原文只表明这些事落入或处于心智的把握之下，并未明说“完全”理解；译文不增加完全认知的主张，也不扩写“范围”这一解释性意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前五项保留原文重复的“X中的Y”平行结构，不为追求流畅而改写各项之间可能具有的神学关系；末句则避免不自然的希腊语空间隐喻直译。
