source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς οὖν ἀγωνιζώμεθα εὑρεθῆναι ἐν τῷ ἀριθμῷ τῶν ὑπομενόντων αὐτόν, ὅπως μεταλάβωμεν τῶν ἐπηγγελμένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/004.yaml
  text: Therefore let us strive to be found among the number of those who wait for him[a], so that we may share in the promised gifts.
translation:
  language: zh_hans
  text: 所以，我们要竭力使自己被列在等候他的人中，好让我们有分于所应许的恩赐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγωνιζώμεθα
  choice: 要竭力
  rationale: 该词表示奋力争取、努力；“竭力”既保留其强度，也符合现代汉语劝勉语气。
- source_word: εὑρεθῆναι ἐν τῷ ἀριθμῷ
  choice: 使自己被列在……的人中
  rationale: 保留不定过去时被动不定式“被发现／被算为”的语义，同时用自然汉语表达归入某一群体。
- source_word: τῶν ὑπομενόντων αὐτόν
  choice: 等候他的人
  rationale: ὑπομένω后接人称宾语，在此宜理解为等候、期待他，而非把他当作苦难来忍受。
- source_word: μεταλάβωμεν
  choice: 有分于
  rationale: 表达参与并领受之意，比单纯“得到”更能保留μεταλαμβάνω的共享意味。
- source_word: τῶν ἐπηγγελμένων δωρεῶν
  choice: 所应许的恩赐
  rationale: ἐπηγγελμένων为被动分词，指已经应许的；δωρεῶν指白白赐予的礼物，“恩赐”自然且贴合语境。
theological_decisions:
- issue: ὑπομενόντων αὐτόν所表达的人与神的关系
  choice: 等候他
  alternative: 忍耐他／为他恒忍
  rationale: 人称宾语αὐτόν指向所等候的那一位；译作“忍耐他”容易误示他本身是必须忍受的患难。这里采用“等候他”，不额外限定为某种宗派性的末世解释。
- issue: 应许之恩赐的具体内容
  choice: 保留为“所应许的恩赐”
  alternative: 明确解释为救恩、天国或永生
  rationale: 原文没有在本句逐项说明恩赐内容，因此不在译文中补充特定神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以”承接上文推论；“我们要……”呈现第一人称复数劝勉。“被列在……的人中”略带经文语体，但普通读者容易理解。
