  text: ἐπὶ δὲ καὶ περὶ Ἰὼβ οὕτως γέγραπται· Ἰὼβ δὲ ἦν δίκαιος καὶ ἄμεμπτος, ἀληθινός, θεοσεβής, ἀπεχόμενος ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/003.yaml
  text: 'And concerning Job it is thus written: “Now Job was righteous and blameless[a], true, God-fearing, abstaining from every evil.”'
translation:
  language: zh_hans
  text: 论到约伯，也有这样的记载：“约伯为人公义、无可指责，诚实、敬畏上帝，远离一切恶事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: 公义
  rationale: 表达合乎正义、为人正直的品格，并保留早期基督教文献常见的伦理与神学语感。
- source_word: ἄμεμπτος
  choice: 无可指责
  rationale: 指在行为和品格上找不到可责之处；比“完全”更贴近原词，也避免暗示绝对无罪。
- source_word: ἀληθινός
  choice: 诚实
  rationale: 此处与一系列品格形容词并列，主要指真实可靠、没有虚假；现代汉语用“诚实”自然清楚。
- source_word: θεοσεβής
  choice: 敬畏上帝
  rationale: 准确表达对上帝怀有敬畏并虔诚行事的含义。
- source_word: ἀπεχόμενος ἀπὸ παντὸς κακοῦ
  choice: 远离一切恶事
  rationale: ἀπέχομαι加ἀπό表示使自己不沾染、避开或禁戒；“远离”既传达持续克制，也符合现代汉语表达。
- source_word: οὕτως γέγραπται
  choice: 有这样的记载
  rationale: 保留“写着/记载着”的经文引述公式，同时使中文引介自然庄重。
theological_decisions:
- issue: ἄμεμπτος是否表达绝对无罪
  choice: 无可指责
  alternative: 完全
  rationale: 原词侧重没有可受责难之处，不必理解为本体或道德上的绝对完美，因此不作过度神学化处理。
- issue: θεοσεβής中的θεός如何译称
  choice: 上帝
  alternative: 神
  rationale: 两者在现代汉语基督教语境中均可成立；正文采用“上帝”，清楚表达所敬畏的对象，不加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文的并列品格描述，不增添原文未明说的解释。将句首ἐπὶ δὲ καὶ περὶ按引介约伯这一追加例证的功能译为“论到约伯，也……”。
