  text: But he himself accuses himself[a], saying, “No one is clean from defilement, not even if his life is one day.”
translation:
  language: zh_hans
  text: 但他自己却控告自己[a]，说：“没有人能脱离污秽而洁净，即使他的生命只有一天。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“指控自己”。
    reason: “控告”与“指控”都可表达κατηγορεῖ的控诉、诉讼性含义；保留自然的替代译法。
lexical_decisions:
- source_word: ἀλλ’
  choice: 但……却
  rationale: 保留转折语气，并使现代汉语表达自然。
- source_word: αὐτὸς ἑαυτοῦ κατηγορεῖ
  choice: 他却指控自己
  rationale: κατηγορεῖ 配合反身代词表示“指控自己”；“指控”也保留其诉讼色彩。αὐτός的强调通过“他……自己”及“却”体现。
- source_word: καθαρὸς ἀπὸ ῥύπου
  choice: 洁净、不受污秽
  rationale: 按希腊语“洁净、远离/免于污秽”的结构翻译，兼顾其礼仪与道德含义，不将其窄化。
- source_word: οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ
  choice: 即使他的生命只有一天
  rationale: 以自然汉语表达让步条件：哪怕寿命仅有一天，也不能免于污秽。
theological_decisions:
- issue: “污秽”的性质
  choice: 保留宽泛的“污秽”
  alternative: 译作“罪污”或“罪”
  rationale: ῥύπος本义为污秽；原文没有明确限定为罪，因此不在正文中加入解释性的神学限定。
- issue: 人的普遍不洁
  choice: 直译为“没有人是洁净、不受污秽的”
  alternative: 译作“人人都有罪”
  rationale: 保留原句关于洁净与污秽的意象及张力，不将其改写为系统神学命题。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“生命只有一天”比“活了一天”更贴近原文名词结构；引文保持简洁有力。
