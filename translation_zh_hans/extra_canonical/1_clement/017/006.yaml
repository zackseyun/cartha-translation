- source_word: ἀτμὶς
  choice: 一股蒸气
  rationale: 指从锅中升起的蒸气；用“一股”使现代汉语表达自然，并保留其短暂、轻微的意象。
- source_word: ἀπὸ χύτρας
  choice: 锅里冒出的
  rationale: ἀπό表示来源，χύτρα指烹煮用的锅；译成“锅里冒出的”比生硬的“来自锅的”更符合汉语习惯。
- source_word: Ἐγὼ δέ εἰμι
  choice: 我不过是
  rationale: δέ在此带轻微转折或强调；“不过是”自然呈现自谦语气，但不额外扩展比喻含义。
