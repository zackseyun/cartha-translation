source:
  edition: Funk 1901 (normalized OCR)
  text: Μωσῆς πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ἐκλήθη, καὶ διὰ τῆς ὑπηρεσίας αὐτοῦ ἐκρίνεν ὁ θεὸς Αἴγυπτον διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν· ἀλλὰ κἀκεῖνος δοξασθεὶς μεγάλως οὐκ ἐμεγαλοφρόνησεν, ἀλλ’ εἶπεν ἐπὶ τῆς βάτου χρηματισμοῦ αὐτῷ δεδομένου· Τίς εἰμι ἐγώ, ὅτι με πέμπεις; Ἐγὼ δέ εἰμι ἰσχνόφωνος καὶ βραδύγλωσσος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/005.yaml
  text: Moses was called faithful in all his house[a], and through his service God judged Egypt through their plagues and torments; yet even he, though greatly glorified, did not become arrogant, but said, when a divine message was given to him at the bush, “Who am I, that you send me? For I am weak-voiced and slow of tongue.”
translation:
  language: zh_hans
  text: 摩西在神的全家中被称为忠信；神借着他的服事，借着埃及人所受的灾击和苦难审判了埃及。然而，就连他虽大得荣耀，也没有因此自高，反而在荆棘丛那里领受神的晓谕时说：“我是谁，你竟差遣我？我声音微弱，口舌迟钝。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστὸς
  choice: 忠信
  rationale: 兼顾可靠、忠诚之意，也与摩西在神家中的受托身份相称。
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: 在神的全家中
  rationale: οἶκος可指家、家室；结合其所引经文传统，以“全家”保留家庭与家室的意象。代词所指按引文语境明确为神。
- source_word: ὑπηρεσίας
  choice: 服事
  rationale: 表示受命执行事务、履行职分；“服事”自然且保留宗教语境中的职事色彩。
- source_word: μαστίγων καὶ αἰκισμάτων
  choice: 种种灾祸和苦难
  rationale: μαστίγες在埃及叙事中指作为惩罚的灾击；αἰκίσματα指折磨、凌辱或痛苦遭遇。“灾祸和苦难”既符合语境，也避免过窄地理解为鞭打。
- source_word: μεγαλοφρονέω
  choice: 自高
  rationale: 表达因地位或荣耀而骄傲、自视甚高的负面含义，现代汉语简洁自然。
- source_word: χρηματισμοῦ
  choice: 神的晓谕
  rationale: 此处指来自神的启示性言语；“晓谕”庄重而易懂，避免将其窄化为预言或神谕体裁。
- source_word: ἰσχνόφωνος καὶ βραδύγλωσσος
  choice: 声音微弱，口舌迟钝
  rationale: 分别直译其发声无力与言语迟缓的含义，保留两个并列自述。
theological_decisions:
- issue: αὐτοῦ（“他的”）在“全家”中的指代
  choice: 译作“神的全家”
  alternative: 译作“他的全家”，保留代词形式
  rationale: 本句呼应民数记12:7及希伯来书3:2、5，所指是神的家；中文若仅说“他的全家”，容易误解为摩西自己的家庭。
- issue: 埃及所受灾击的施行者与媒介
  choice: “神借着他的服事，以种种灾祸和苦难审判了埃及”
  alternative: “摩西借着服事审判埃及”
  rationale: 希腊文明确以神为ἐκρίνεν的主语，摩西的服事及灾击是神实施审判的媒介。
- issue: 摩西得荣耀与谦卑的张力
  choice: 保留“虽大得荣耀，也没有因此自高”
  alternative: 弱化为“虽受尊重，仍然谦卑”
  rationale: 原文同时强调摩西确实大得荣耀，以及他没有由此骄傲；不将“荣耀”解释掉，也不把否定陈述改写成抽象美德。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文由摩西忠信、神借其服事审判埃及，再转入摩西虽得荣耀却不自高的推进。“荆棘丛”采用现代常用表达；引语维持简洁、有力度的自谦语气。
