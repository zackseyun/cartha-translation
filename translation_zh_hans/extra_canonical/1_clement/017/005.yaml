    rationale: 原文在“灾击和苦难”后有复数属格代词αὐτῶν，按紧邻的“埃及”自然指埃及人。现有“以种种灾祸和苦难”虽传达审判手段，却没有说明这些是埃及人所受的灾击与苦难，少了一项明示信息。
