revisions:
- from: 摩西在神的全家中被称为忠信；神借着他的服事，以种种灾祸和苦难审判了埃及。然而，就连他虽大得荣耀，也没有因此自高，反而在荆棘丛那里领受神的晓谕时说：“我是谁，你竟差遣我？我声音微弱，口舌迟钝。”
  to: 摩西在神的全家中被称为忠信；神借着他的服事，借着埃及人所受的灾击和苦难审判了埃及。然而，就连他虽大得荣耀，也没有因此自高，反而在荆棘丛那里领受神的晓谕时说：“我是谁，你竟差遣我？我声音微弱，口舌迟钝。”
