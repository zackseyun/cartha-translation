  text: ἐμαρτυρήθη μεγάλως Ἀβραὰμ καὶ φίλος προσηγορεύθη τοῦ θεοῦ, καὶ λέγει ἀτενίζων εἰς τὴν δόξαν τοῦ θεοῦ ταπεινοφρονῶν· Ἐγὼ δέ εἰμι γῆ καὶ σποδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/002.yaml
  text: Abraham received great testimony and was called the friend of God, and gazing intently on the glory of God, he said with humility, “But I am dust and ashes.”
translation:
  language: zh_hans
  text: 亚伯拉罕大受称许，并被称为上帝的朋友；他定睛注视上帝的荣耀，谦卑地说：“但我只是尘土和灰烬。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτυρήθη μεγάλως
  choice: 大大得了称许
  rationale: 保留被动语态和“得到有力见证、称许”的含义；在现代汉语中比直译为“大大被作见证”更自然。
- source_word: φίλος ... τοῦ θεοῦ
  choice: 上帝的朋友
  rationale: 直接保留属格关系及“朋友”这一称谓，不另行解释其神学含义。
- source_word: ἀτενίζων εἰς
  choice: 定睛仰望
  rationale: 表达持续、专注凝视之意；“仰望”与对象为上帝的荣耀相称，同时不削弱视觉意象。
- source_word: ταπεινοφρονῶν
  choice: 谦卑地
  rationale: 以自然简洁的副词结构表达怀有谦卑心态，不添加原文没有的心理解释。
- source_word: γῆ καὶ σποδός
  choice: 尘土和灰烬
  rationale: “尘土和灰烬”是创世记相关语句在汉语中的自然传统表达；γῆ 在此语境指卑微的尘土，而非一般意义的土地。
theological_decisions:
- issue: ἐμαρτυρήθη 的施事者未明说
  choice: 采用“得了称许”，不补出是谁称许
  alternative: 译作“上帝大大称许了他”
  rationale: 希腊文使用无人称施事的被动式；不补明施事者，可保存原文的开放性。
- issue: “上帝的朋友”作为称谓
  choice: 按原文直接保留
  alternative: 解释为“蒙上帝眷爱的朋友”或“与上帝亲近的人”
  rationale: 解释性改写会引入原文未明说的关系定义，并削弱称谓与经文传统的联系。
- issue: Ἐγὼ δέ 中 δέ 的语气
  choice: 译为“我不过是”
  alternative: 译为“但我是”
  rationale: 此处 δέ 在谦卑自陈中带轻微转折；“不过”在现代汉语中自然传达自谦和对比，而不制造过强的逻辑转折。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式避免生硬欧化；保留“定睛”“荣耀”“尘土和灰烬”等经文语域，同时使整句适合公众朗读。
