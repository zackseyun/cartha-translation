  naturalness: 修订后的“大受称许”“定睛注视”“但我只是尘土和灰烬”均为自然、庄重且适合公众诵读的现代书面汉语。
  terminology: 保留“上帝的朋友”“荣耀”“尘土和灰烬”等既有经文语域；不指定“称许”的施事者，也不为“朋友”加入解释性神学含义。
