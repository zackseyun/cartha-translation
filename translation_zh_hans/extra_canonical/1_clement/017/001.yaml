  text: Μιμηταὶ γενώμεθα κἀκείνων, οἵτινες ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς περιεπάτησαν κηρύσσοντες τὴν ἔλευσιν τοῦ Χριστοῦ· λέγομεν δὲ Ἠλίαν καὶ Ἐλισαιέ, ἔτι δὲ καὶ Ἰεζεκιὴλ, τοὺς προφήτας· πρὸς τούτοις καὶ τοὺς μεμαρτυρημένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/001.yaml
  text: Let us become imitators also of those who went about in goatskins and sheepskins, proclaiming the coming of the Christ. We mean Elijah and Elisha, and also Ezekiel, the prophets; and besides these, those who have been commended.
translation:
  language: zh_hans
  text: 我们也当效法那些披着山羊皮和绵羊皮、到处行走，宣告基督的来临的人。我们所说的，就是先知以利亚、以利沙和以西结；此外，还有那些受到称许的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些得了美好见证的人”。
    reason: 保留 μεμαρτυρημένους 与“见证”词族的字面联系，同时正文采用更符合此处正面评价含义的“受到称许”。
lexical_decisions:
- source_word: Μιμηταὶ γενώμεθα
  choice: 我们也要效法
  rationale: 以自然的现代汉语表达劝勉语气；γενώμεθα 字面为“让我们成为”，与 μιμηταί 合起来意为“让我们成为效法者”。
- source_word: ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς
  choice: 身披山羊皮和绵羊皮
  rationale: 保留两类兽皮的并列；“身披”比直译“在……中”更符合汉语衣着表达。μηλωτή 在此指羊皮衣，译作“绵羊皮”可与“山羊皮”清楚对应。
- source_word: περιεπάτησαν
  choice: 四处……的人
  rationale: 此处不是一般意义的“行走”，而是“到处走动、往来”，结合分词 κηρύσσοντες 译为“四处宣告”。
- source_word: κηρύσσοντες
  choice: 宣告
  rationale: 体现公开传扬、宣讲的含义，语体庄重而易懂。
- source_word: τὴν ἔλευσιν τοῦ Χριστοῦ
  choice: 基督来临
  rationale: ἔλευσις 指“来到、来临”；Χριστός 在本段按既定称号译为“基督”，不在正文中改译为“弥赛亚”。
- source_word: τοὺς μεμαρτυρημένους
  choice: 那些受到称许的人
  rationale: 完成时被动分词在此带有“得到好评、获得认可”的正面意义；“受到称许”既保留被动意味，也避免生硬地译成“得了见证”。
theological_decisions:
- issue: Χριστός 应译为“基督”还是“弥赛亚”
  choice: 基督
  alternative: 弥赛亚
  rationale: 原文明确使用 Χριστός；在本书成文语境中，“基督”是直接且惯常的对应，不必因提到旧约先知而改用词源性译法。
- issue: μεμαρτυρημένους 所指的称许来源
  choice: 不明说称许者是谁
  alternative: 受到上帝称许的人
  rationale: 希腊文使用神学被动的可能性存在，也可能泛指在经文传统中获得好评；译文保留原文未明说施事者的含混性。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“我们所说的，就是……”对应 λέγομεν δέ，用于引出具体人物；将“先知”置于三个人名之前，使汉语关系清晰，同时不改变三人同属所举先知的意思。
