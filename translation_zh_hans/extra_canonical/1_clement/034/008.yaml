  text: λέγει γάρ· Ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ὅσα ἡτοίμασεν τοῖς ὑπομένουσιν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/008.yaml
  text: For he says[a], “Eye has not seen, and ear has not heard, and it has not entered into the heart of man, the things that he prepared for those who wait for him.”
translation:
  language: zh_hans
  text: 因为他说：“眼睛未曾看见，耳朵未曾听见，人的心里也未曾想到[a]，他为那些耐心等候他的人所预备的一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“也未曾上到人的心中”；这是表示“未曾进入人的意念”的惯用说法。
    reason: 说明原文带有希伯来语色彩的字面意象，同时解释正文采用自然中文表达的依据。
lexical_decisions:
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: 人的心里也未曾想到
  rationale: 这是带有希伯来语色彩的惯用表达，意思是某事未曾进入人的意念；译为“心里未曾想到”既自然，又保留“心”的意象。
- source_word: ὅσα
  choice: 一切
  rationale: 概括他所预备的全部事物，使引文在中文中语法完整自然。
- source_word: τοῖς ὑπομένουσιν αὐτόν
  choice: 那些耐心等候他的人
  rationale: ὑπομένω 在此承接《以赛亚书》引文语境，表示坚持、耐心等候；此译兼顾等候和坚忍的含义。
theological_decisions:
- issue: ἡτοίμασεν 的省略主语
  choice: 保留为“他”
  alternative: 明确译为“上帝”
  rationale: 希腊文只用第三人称动词，主语须由上下文判断；不在译文中补明“上帝”，以免消除原文的指代形式。
- issue: λέγει 的主语和引文性质
  choice: 译为“他说”
  alternative: 译为“经上说”或“上帝说”
  rationale: 原文没有“经上”或“上帝”等名词；直译为“他说”可保留上下文中的指代关系，也不额外判定说话主体。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“未曾”保持引文的肃穆语气；句式尽量贴近希腊文的并列结构，同时以“一切”收束宾语，使中文清楚流畅。
