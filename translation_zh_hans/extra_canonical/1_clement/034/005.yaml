base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/005.yaml
  text: Let our boasting and our boldness be in him. Let us submit ourselves to his will. Let us consider the whole multitude of his angels, how they stand by and minister to his will.
translation:
  language: zh_hans
  text: 愿我们的夸耀和胆量都在于他。让我们顺服他的旨意。让我们留意他众天使的全体，看他们如何侍立在他面前，服事他的旨意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχημα
  choice: 夸耀
  rationale: 保留该词“所夸耀之事／夸口”的语义，同时用现代汉语自然表达其名词性含义。
- source_word: παρρησία
  choice: 坦然无惧
  rationale: 此词可指坦率、放胆或信心；在“在他里面”的语境中译为“坦然无惧”，兼顾勇气与无所畏惧的意味。
- source_word: ὑποτασσώμεθα
  choice: 让我们顺服
  rationale: 中态劝勉式带有主动使自己置于其下的意味；“顺服”简洁而准确。
- source_word: κατανοήσωμεν
  choice: 让我们思想
  rationale: 表达仔细观察、留意和思量，不仅是视觉上的“看”。
- source_word: λειτουργοῦσιν
  choice: 服事
  rationale: 在天使履行神圣职分的语境中，“服事”比一般的“服务”庄重且自然。
- source_word: παρεστῶτες
  choice: 侍立在他面前
  rationale: 分词表示站立在旁、随侍候命；补出“在他面前”使中文明确流畅，而不改变其侍立含义。
theological_decisions:
- issue: “服事他的旨意”（τῷ θελήματι αὐτοῦ λειτουργοῦσιν）的对象关系
  choice: 保留“服事他的旨意”
  alternative: 按他的旨意服事
  rationale: 希腊语与格“他的旨意”形式上可理解为服事所指向的对象，也可能带有依照旨意行事的意味。正文保留较形式对应且略具张力的表达，不静默改写为单一解释。
- issue: “在他里面”（ἐν αὐτῷ）所修饰的范围
  choice: 分别以“以他为夸耀，并在他里面坦然无惧”表达
  alternative: 我们当在他里面夸耀，并坦然无惧
  rationale: 希腊语可自然地让介词短语关联两个并列名词。中文为避免“在他里面夸耀”的生硬，以“以他为夸耀”表达前项，同时明确保留后项“在他里面”；语义仍指二者皆以他为根基。
translation_notes:
  register: 采用现代、庄重而可朗读的劝勉语体；三个劝勉句保持原文推进次序。“众天使的全体”保留 τὸ πᾶν πλῆθος 的整体性强调，避免仅译作泛泛的“许多天使”。
