  - severity: low
    issue: 相邻的同义表达造成累赘
    rationale: “同心合意地”与“一心一意”分别对应 ἐν ὁμονοίᾳ 和 τῇ συνειδήσει，但中文连续使用时重复感明显；以“在和睦中”与“同一心志”区分外在一致和内在共同意向。
  - severity: low
    issue: 英文审校轨迹中的脚注信息未保留
    rationale: ἐπὶ τὸ αὐτό 可指“聚集一处”或概括地“一同”；增设对应脚注可保留该处的翻译余地。
  revised_text: 因此，我们既在和睦中聚集一处[a]，就让我们以同一心志，如同出于一张口，恳切地向他呼求，好使我们有分于他伟大而荣耀的应许。
