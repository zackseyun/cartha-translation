source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν ἐν ὁμονοίᾳ ἐπὶ τὸ αὐτὸ συναχθέντες τῇ συνειδήσει, ὡς ἐξ ἑνὸς στόματος βοήσωμεν πρὸς αὐτὸν ἐκτενῶς εἰς τὸ μετόχους ἡμᾶς γενέσθαι τῶν μεγάλων καὶ ἐνδόξων ἐπαγγελιῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/007.yaml
  text: So then[a], let us also, having been gathered together in concord with one mind, cry out to him earnestly as from one mouth, so that we may become sharers in his great and glorious promises.
translation:
  language: zh_hans
  text: 因此，我们既在和睦中聚集一处[a]，就让我们以同一心志，如同出于一张口，恳切地向他呼求，好使我们有分于他伟大而荣耀的应许。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集一处”亦可译为“一同聚集”。
    reason: ἐπὶ τὸ αὐτό 是“在同一处／一同”的常用表达；脚注保留其不强调具体地点的可译性。
lexical_decisions:
- source_word: ἐν ὁμονοίᾳ
  choice: 同心合意地
  rationale: 表达和睦一致、齐心的状态，符合现代汉语习惯。
- source_word: ἐπὶ τὸ αὐτὸ συναχθέντες
  choice: 聚集在一起
  rationale: 该短语在此表示共同聚集；避免生硬地增添具体地点，同时保留 συναχθέντες 的聚集含义。
- source_word: τῇ συνειδήσει
  choice: 一心一意
  rationale: συνείδησις 此处与共同呼求的语境相连，更可能指共同的心志或意识；译法保留群体内在一致的含义，而不机械译作现代伦理意义较强的“良心”。
- source_word: ὡς ἐξ ἑνὸς στόματος
  choice: 仿佛出于一张口
  rationale: 保留原文形象，强调众人发出一致的呼声。
- source_word: βοήσωμεν πρὸς αὐτὸν ἐκτενῶς
  choice: 恳切地向他呼求
  rationale: βοάω 表示高声呼喊或呼求，ἐκτενῶς 表示热切、迫切；合译自然且保留力度。
- source_word: μετόχους ... γενέσθαι
  choice: 能有分于
  rationale: 准确表达成为参与者、分享者的含义，也适合应许这一宗教语境。
- source_word: ἐπαγγελιῶν
  choice: 应许
  rationale: 在犹太—基督教文献语境中通常指神所作的承诺，“应许”是准确且通行的中文表达。
theological_decisions:
- issue: 成为应许的分享者与人的呼求之间的关系
  choice: 好使我们能有分于
  alternative: 以致我们必得着
  rationale: 保留 εἰς τό 所表达的目的或结果关系以及 γενέσθαι 的开放语气，不把它强化为确定取得，也不额外说明功德或恩典机制。
- issue: τῇ συνειδήσει 的群体性含义
  choice: 一心一意
  alternative: 凭着同一个良心
  rationale: 上下文强调同心聚集、同声呼求；选择群体共同心志的表达，但不据此引入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“同心合意”“一心一意”略有语义重叠，但分别对应外在群体和睦与内在心志一致；保留“仿佛出于一张口”的原文意象。
