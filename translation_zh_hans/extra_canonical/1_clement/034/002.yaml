  text: δεῖν οὖν ἐστὶ προθύμους ἡμᾶς εἶναι εἰς ἀγαθοποιΐαν· ἐξ αὐτοῦ γάρ ἐστιν τὰ πάντα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/002.yaml
  text: Therefore we must be eager for doing good[a], for from him are all things.
translation:
  language: zh_hans
  text: 所以，我们必须热心行善，因为万有都出于他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖν ... ἐστὶ
  choice: 必须
  rationale: 表达非人称结构所表示的必要性；结合不定式主语，可自然译为“我们必须”。
- source_word: προθύμους
  choice: 热心
  rationale: 既体现甘愿、积极的态度，也符合现代汉语中与“行善”的自然搭配。
- source_word: εἰς ἀγαθοποιΐαν
  choice: 行善
  rationale: ἀγαθοποιΐα指做善事、善行；在此与表示倾向的εἰς连用，译作“热心行善”简洁自然。
- source_word: ἐξ αὐτοῦ
  choice: 出于他
  rationale: 保留ἐκ所表达的来源关系以及原文阳性单数代词；不擅自补明其所指。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 表达“一切事物、所有存在”的总体含义，也保留庄重的宗教文体。
theological_decisions:
- issue: αὐτοῦ所指的对象
  choice: 他
  alternative: 上帝
  rationale: 本句本身只用代词，并未明说所指；译文保留代词，以避免在局部经文中擅自消除指代上的依赖性。
- issue: “万有出于他”的来源含义
  choice: 直译为“万有都出于他”
  alternative: “一切都是他所赐的”
  rationale: 后者会把来源关系具体解释为赐予；原文只陈述万有源自他，因此保留其宽广而未细化的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“所以”承接上文推论，“热心行善”自然表达积极倾向；全句保持原文简洁有力的劝勉与理由结构。
