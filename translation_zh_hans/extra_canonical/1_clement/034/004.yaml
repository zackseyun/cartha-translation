base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/004.yaml
  text: Therefore he urges us, who believe in him with our whole heart, not to be idle or negligent in every good work.
translation:
  language: zh_hans
  text: 因此，他劝勉我们这些全心信靠他的人，在一切善工上不可懒惰，也不可松懈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτρέπεται
  choice: 劝勉
  rationale: 表达鼓励并敦促采取行动的语气，符合书信的庄重语体。
- source_word: πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ
  choice: 全心信靠他的人
  rationale: ἐπί与人称代词连用，在此表达把信心寄托于其上；“信靠”比单纯“相信”更能传达这种依靠关系。分词πιστεύοντας修饰“我们”，故译作“我们这些……的人”。
- source_word: ἀργούς
  choice: 懒散
  rationale: 保留“不劳作、无所作为”的含义，又符合现代汉语表达。
- source_word: παρειμένους
  choice: 松懈
  rationale: 该词可指软弱、懈怠或失去干劲；“松懈”自然地表达在善行上怠惰不振。
- source_word: ἐπὶ πᾶν ἔργον ἀγαθόν
  choice: 总要行各样善事
  rationale: 将介词短语按现代汉语习惯转化为行动表达；“各样”体现πᾶν涵盖一切善工的范围。
theological_decisions:
- issue: αὐτῷ所指对象
  choice: 保留为“他”
  alternative: 明确译作“神”或“基督”
  rationale: 本句本身只使用代词；为避免在缺少更广上下文时替原文消解指代，保留“他”。
- issue: 信靠与善行的关系
  choice: 保持“信靠者受劝勉行善”的句法关系
  alternative: 增译为善行是得救条件或必然证明
  rationale: 原文提出劝勉，却没有在本句中界定善行与救恩的系统神学关系，因此不作额外解释。
translation_notes:
  register: 采用现代、庄重而通顺的书信语体。“所以”承接上文；后半句用“不要……也不要……总要……”呈现原文的双重否定劝戒及其面向一切善工的范围。
