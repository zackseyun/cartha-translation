  text: λέγει γὰρ ἡ γραφή· Μύριαι μυριάδες παρειστήκεισαν αὐτῷ, καὶ χίλιαι χιλιάδες ἐλειτούργουν αὐτῷ, καὶ ἐκέκραγον· Ἅγιος, ἅγιος, ἅγιος κύριος σαβαώθ, πλήρης πᾶσα ἡ κτίσις τῆς δόξης αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/006.yaml
  text: For the Scripture says, “Myriads of myriads stood by him, and thousands of thousands ministered to him,” and they cried out, “Holy, holy, holy is the Lord Sabaoth; all creation is full of his glory.”
translation:
  language: zh_hans
  text: 因为经上说：“万万侍立在他面前，千千事奉他。”他们高声呼喊：“圣哉！圣哉！圣哉！万军之主；整个受造界都充满了他的荣耀。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这段引文结合了《但以理书》7:10和《以赛亚书》6:3的用语；“万军之主”中的“万军”，希腊文按希伯来语音译为“萨巴奥特”。
    reason: 交代引文来源及σαβαώθ的语言形式，帮助读者理解合并引文和译法。
lexical_decisions:
- source_word: Μύριαι μυριάδες
  choice: 万万
  rationale: 保留原文以重复数词表达极其庞大数量的修辞方式，不把它精确化为算术数字，也不增添原文没有的“天使”。
- source_word: παρειστήκεισαν αὐτῷ
  choice: 侍立在他面前
  rationale: παρίστημι在此描写众多侍从站立于上帝面前；“侍立”兼顾站立动作与尊崇语境。
- source_word: χίλιαι χιλιάδες ἐλειτούργουν αὐτῷ
  choice: 千千事奉他
  rationale: 以“千千”对应原文的重复数词，并用“事奉”表达λειτουργέω在神圣侍奉语境中的含义。
- source_word: ἐκέκραγον
  choice: 高声呼喊
  rationale: 表达未完成时所描绘的持续呼喊及κράζω的强烈声音。
- source_word: κύριος σαβαώθ
  choice: 万军之主
  rationale: σαβαώθ是希伯来语词的希腊字母音译，传统含义为“万军”；采用现代中文读者可理解且庄重的意译。
- source_word: πᾶσα ἡ κτίσις
  choice: 一切受造之物
  rationale: κτίσις在此是“受造界/一切受造之物”，范围比“全地”更广；保留革利免引文自身的措辞。
theological_decisions:
- issue: 是否明确侍立和事奉者是天使
  choice: 不增添“天使”
  alternative: 译作“万万天使”
  rationale: 上下文或引文背景可能指天上众军，但本句希腊文没有ἄγγελοι；不把隐含指称写成明说。
- issue: πᾶσα ἡ κτίσις的范围
  choice: 一切受造之物
  alternative: 全地
  rationale: 严格依照本句现存希腊文本的κτίσις，保留其宇宙性范围，不以《以赛亚书》6:3常见措辞替换。
translation_notes:
  register: 采用庄重而通顺的现代书面语。“圣哉”保留礼仪性呼喊的力度；“万万……千千……”维持原文平行、递进的节奏。引号和句读按现代简体中文规范处理。
