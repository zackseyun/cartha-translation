revisions:
- from: 因为经上说：“万万侍立在他面前，千千事奉他。”他们又高声呼喊：“圣哉！圣哉！圣哉！万军之主；一切受造之物都充满了他的荣耀。”[a]
  to: 因为经上说：“万万侍立在他面前，千千事奉他。”他们高声呼喊：“圣哉！圣哉！圣哉！万军之主；整个受造界都充满了他的荣耀。”[a]
  rationale: 删除“他们又”中原文未明示的“又”，并将末句改为“整个受造界都充满了他的荣耀”，以清楚表达κτίσις作为被荣耀充满的整体。其余用语忠实保留原文的数词重复、庄重颂赞语体和不明说侍奉者身份的特点。
