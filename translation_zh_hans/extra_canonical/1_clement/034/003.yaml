  text: προλέγει γὰρ ἡμῖν· Ἰδοὺ ὁ κύριος, καὶ ὁ μισθὸς αὐτοῦ πρὸ προσώπου αὐτοῦ, ἀποδοῦναι ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/003.yaml
  text: For he says beforehand to us[a], “Behold, the Lord, and his reward is before him, to repay each one according to his work.”
translation:
  language: zh_hans
  text: 因为他预先对我们说：“看哪，主；他的报偿在他面前，要按各人所行的报还各人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προλέγει
  choice: 预先……说
  rationale: 保留该动词“事先说、预告”的基本意义，不额外加入“警告”的语气。
- source_word: Ἰδοὺ ὁ κύριος
  choice: 看哪，主来了
  rationale: ἰδού用于引人注意；希腊语名词句直译为“看哪，主”，中文需补出符合来临语境的谓语“来了”。
- source_word: ὁ μισθὸς αὐτοῦ
  choice: 他的报赏
  rationale: μισθός可指工价、酬报或报偿；此处与按行为报还相连，用较中性的“报赏”，不预先限定为奖赏或惩罚。
- source_word: πρὸ προσώπου αὐτοῦ
  choice: 在他面前
  rationale: 贴近原文“在他面前／当面”的空间意象，同时中文自然。
- source_word: ἀποδοῦναι ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ
  choice: 要照各人所做的报还各人
  rationale: 保留ἀποδοῦναι“偿还、报还”及单数ἔργον概括个人行为的表达；中文以“所做的”自然传达。
theological_decisions:
- issue: 按行为报还与报赏的性质
  choice: 保留“报赏”与“照各人所做的报还各人”的张力
  alternative: 译为“赏赐”，使经文偏向正面奖赏；或译为“报应”，使其偏向审判惩罚
  rationale: 原文μισθός和ἀποδίδωμι本身未在此明确限定结果只为奖赏或惩罚，不宜替原文消除其审判语境中的开放性。
- issue: Ἰδοὺ ὁ κύριος是否明说“来”
  choice: 译作“主来了”
  alternative: 形式上直译为“看哪，主”
  rationale: 希腊语可用省略谓语的呈现句式；现代汉语若仅说“看哪，主”不完整。“来了”表达显现或临到的语用含义，但不扩展其神学细节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“预先对我们说”较“预先警告我们”更忠实于词义范围；引语保持经文式节奏，但避免生硬欧化结构。
