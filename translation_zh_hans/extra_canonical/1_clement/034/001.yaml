  rationale: 将“善良”改为“勤勉”，使其在劳动比喻中的对照功能在现代汉语里更清楚；将“不敢正视”调整为“不能直视”，避免把可由语境推知的羞惭或畏惧写成明示的心理状态。“饼”保留ἄρτος的具体意象及其可兼指日常食物、生计的开放性。
