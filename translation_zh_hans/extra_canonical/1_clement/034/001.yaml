  yaml_path: translation/extra_canonical/1_clement/034/001.yaml
  text: The good worker receives with boldness the bread of his labor, but the sluggish and negligent man cannot look his employer in the eye.
translation:
  language: zh_hans
  text: 勤勉的工人坦然领受自己劳动所换来的饼；懒惰而懈怠的人却不能直视自己的雇主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἐργάτης
  choice: 善良的工人
  rationale: 保留ἀγαθός对工人品格与表现的正面评价，不将其缩窄为单纯“能干”或“勤劳”。
- source_word: μετὰ παρρησίας
  choice: 坦然
  rationale: παρρησία在此表示有底气、无所畏惧地面对雇主并领取所得；“坦然”符合现代汉语语境，又不过度强化为权利术语。
- source_word: τὸν ἄρτον τοῦ ἔργου αὐτοῦ
  choice: 自己劳作所得的食物
  rationale: ἄρτος字面为“饼”，也可泛指食物或生计；属格短语表达由劳作而得，译文保留其报酬兼生计的意象。
- source_word: νωθρὸς καὶ παρειμένος
  choice: 懒散松懈的人
  rationale: νωθρός指迟钝、懒惰，παρειμένος指松弛、懈怠；并列翻译以保留两个近义形容词的累积力度。
- source_word: οὐκ ἀντοφθαλμεῖ
  choice: 不敢正视
  rationale: 动词字面表示直面、对视；上下文隐含因失职而没有底气，现代汉语“不敢正视”自然传达这种意味。
- source_word: ἐργοδότῃ
  choice: 雇主
  rationale: 该词指给予工作者或出工钱者；“雇主”较“老板”庄重，也比泛化的“主人”更准确。
theological_decisions:
- issue: 劳动所得与道德资格之间的关系
  choice: 译作“坦然领取自己劳作所得的食物”
  alternative: “理直气壮地领取他的工钱”
  rationale: 原文以ἄρτος而非明确的“工资”表述所得，并以παρρησία描述领取时的坦然；译文不额外推导功德、称义或特定报偿教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。分号呈现勤勉工人与懒散者的鲜明对照；不添加原文没有的身份、制度或神学限定。
