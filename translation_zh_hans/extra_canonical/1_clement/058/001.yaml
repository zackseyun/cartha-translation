source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑποταχθῶμεν οὖν τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι αὐτοῦ φυγόντες τὰς προειρημένας διὰ τῆς σοφίας τοῖς ἀπειθοῦσιν ἀπειλάς, ἵνα κατασκηνώσωμεν πεποιθότες ἐπὶ τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/001.yaml
  text: Let us therefore submit ourselves to his all-holy and glorious name, fleeing the threats previously spoken through wisdom against the disobedient, so that we may dwell, trusting in the most holy name of his majesty.
translation:
  language: zh_hans
  text: 所以，我们要顺服他至圣而荣耀的名，逃避借着智慧先前向悖逆之人所说的种种威吓，好叫我们得以居住[a]，并信靠他威严至圣的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “居住”也可译作“安顿下来”或“驻留”。
    reason: κατασκηνόω可指居住、安顿或驻留；此处不必然强调安全无虞。
lexical_decisions:
- source_word: Ὑποταχθῶμεν
  choice: 我们要顺服
  rationale: 该词是劝勉语气，表达共同接受权柄、使自己服从；用“我们要”自然传达希腊语第一人称复数劝勉式。
- source_word: φυγόντες
  choice: 逃避
  rationale: 保留分词所表达的伴随行动，也保留主动远离所述威吓的力度。
- source_word: τὰς ... ἀπειλάς
  choice: 种种威吓
  rationale: ἀπειλή可指威吓或警告；此处针对悖逆者，译作“威吓”较贴近原词力度，复数以“种种”体现。
- source_word: κατασκηνώσωμεν
  choice: 得以安居
  rationale: 该词本义涉及搭帐、驻留，语境中引申为居住、安顿；“安居”在现代汉语中自然，但不把“信靠”重复译成“安稳”。
- source_word: πεποιθότες ἐπὶ
  choice: 信靠
  rationale: 完成时分词直接支配介词短语，表示把信赖置于其名之上；译作“信靠”清楚保留这一句法关系。
- source_word: μεγαλωσύνης
  choice: 威严
  rationale: 这里指上帝崇高庄严的伟大属性；“威严”与“他的名”搭配自然，也保持庄重语域。
theological_decisions:
- issue: 顺服的对象是“他的名”
  choice: 保留“顺服他……的名”
  alternative: 意译为“顺服他”或“顺服他的权柄”
  rationale: 原文明确以“名”为间接宾语；“名”在此可能承载身份、权柄和启示等含义，直译可保留其神学张力，不擅自缩减为单一解释。
- issue: 智慧与威吓的施受关系
  choice: “智慧先前向悖逆之人所宣告的种种威吓”
  alternative: “先前借着智慧所说、针对悖逆者的威吓”
  rationale: 原文διὰ τῆς σοφίας可理解为“借着智慧”，而中文采用智慧为宣告主体的表达，既自然，又不改变威吓针对悖逆者这一关系。
- issue: 安居与信靠的关系
  choice: “得以安居，信靠……”
  alternative: “因信靠……而安然居住”
  rationale: 原文以κατασκηνώσωμεν为主要动词、πεποιθότες为伴随分词；正文维持“居住”与“信靠”两个要素，避免把分词完全改写成原因或把它重复译为“安稳”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“至圣而荣耀”“悖逆之人”“威严”等词保留早期基督教劝勉文体的肃穆感；句法适度调整以符合现代汉语，同时保留原文中“顺服其名”及“信靠其名”的重复与神学意涵。
