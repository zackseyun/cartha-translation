source:
  edition: Funk 1901 (normalized OCR)
  text: δέξασθε τὴν συμβουλὴν ἡμῶν, καὶ ἔσται ἀμεταμέλητα ὑμῖν. ζῇ γὰρ ὁ θεὸς καὶ ζῇ ὁ κύριος Ἰησοῦς Χριστὸς καὶ τὸ πνεῦμα τὸ ἅγιον, ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν, ὅτι ὁ ποιήσας ἐν ταπεινοφροσύνῃ μετ᾽ ἐκτενοῦς ἐπιεικείας ἀμεταμελήτως τὰ ὑπὸ τοῦ θεοῦ δεδομένα δικαιώματα καὶ προστάγματα· οὕτως ἐντεταγμένος καὶ ἐλλόγιμος ἔσται εἰς τὸν ἀριθμὸν τῶν σῳζομένων διὰ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐστὶν αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/002.yaml
  text: Accept our counsel[a], and you will have no cause for regret. For as God lives, and the Lord Jesus Messiah lives, and the Holy Spirit, and the faith and hope of the elect, so surely the one who in humility, with earnest gentleness, without regret carries out the righteous requirements and commandments given by God, this one will be enrolled and counted among the number of those being saved through Jesus Messiah, through whom be the glory to him forever and ever. Amen.
translation:
  language: zh_hans
  text: 你们要接受我们的劝告，这样就不会后悔。上帝活着，主耶稣弥赛亚活着，圣灵以及蒙拣选之人的信与盼望也都活着[a]：凡怀着谦卑，以恳切的温和，始终不反悔地遵行上帝所赐规条和命令的人，必被录名并算在那些借着耶稣弥赛亚正在得救的人中。愿荣耀借着他归于他，直到永永远远。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文只在“上帝”和“主耶稣弥赛亚”后明说“活着”；“圣灵”以及“蒙拣选之人的信与盼望”承接同一谓语。
    reason: 原文采用省略谓语的并列结构，而把“信与盼望”说成“活着”在中文中十分醒目，需说明其来源。
lexical_decisions:
- source_word: συμβουλή
  choice: 劝告
  rationale: 表示为对方益处而提出的劝勉或忠告；“劝告”比“建议”更符合本段庄重、带权威性的语气。
- source_word: ἀμεταμέλητα / ἀμεταμελήτως
  choice: 不会后悔 / 始终不反悔地
  rationale: 保留两个同源词之间的呼应；前者指接受劝告不会留下悔恨，后者指遵行时坚定而不回转。
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: 恒切的温厚
  rationale: ἐκτενής含持续、恳切之意，ἐπιείκεια含温和、宽厚、体谅之意；该译法兼顾两层含义。
- source_word: δικαιώματα καὶ προστάγματα
  choice: 规条和命令
  rationale: δικαιώματα在此指上帝所定的正当要求或条例，προστάγματα指明确吩咐；避免将前者误解为现代法律语境中的“权利”。
- source_word: ἐντεταγμένος καὶ ἐλλόγιμος
  choice: 被录名并算在
  rationale: 保留两个并列词的登记、计入含义及其修辞强化，而不合并为单一动词。
- source_word: τῶν σῳζομένων
  choice: 那些……正在得救的人
  rationale: 保留现在分词所表达的进行性，不擅自改成单纯过去或静态身份。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 按其称号意义翻译，表明耶稣是受膏者；同时保留现代中文读者熟悉且庄重的称谓形式。
theological_decisions:
- issue: 誓言公式中“圣灵、信与盼望”同“活着”的关系
  choice: 补出“也都活着”，并加注说明希腊文的省略结构
  alternative: 只译为“还有圣灵，以及蒙拣选之人的信与盼望”，不补谓语
  rationale: 希腊文仅在“上帝”和“主耶稣弥赛亚”后明说ζῇ，但后续并列主语自然承接同一谓语。补出谓语使中文句法完整，同时保留原文把信与盼望纳入誓言见证的醒目修辞。
- issue: 得救的时态体貌
  choice: 正在得救的人
  alternative: 得救的人
  rationale: σῳζομένων是现在分词；译出进行性可避免将原文默默处理为已经完成的状态，也不进一步界定其系统神学含义。
- issue: 末尾荣耀颂中αὐτῷ的所指
  choice: 荣耀借着他归于上帝
  alternative: 荣耀归于耶稣弥赛亚
  rationale: 邻近语法允许一定张力，但常见颂赞句式是荣耀借着基督归给上帝。译文明确采用这一较自然的关联，同时不引入额外教派性表述。
translation_notes:
  register: 采用现代、庄重而可诵读的书面普通话。保留原文誓言式排比、同源词呼应及“录名并算在”的双重表达；对希腊文在中文中不完整的省略谓语作最小限度补足，并以脚注交代。
