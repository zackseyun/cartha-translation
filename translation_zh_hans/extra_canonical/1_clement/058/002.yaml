  to: 你们要接受我们的劝告，这样就不会后悔。上帝活着，主耶稣弥赛亚活着，圣灵以及蒙拣选之人的信与盼望也都活着[a]：凡怀着谦卑，以恳切的温和，始终不反悔地遵行上帝所赐规条和命令的人，必被录名并算在那些借着耶稣弥赛亚正在得救的人中。愿荣耀借着他归于他，直到永永远远。阿们。
  rationale: 修订仅处理末句代词所指和一处中文搭配。末句保留原文“借着他……归于他”的重复指向，不把荣耀的对象改释为上帝；这避免以常见颂赞公式覆盖此处实际措辞。其余句法、进行性的“正在得救”、以及脚注所说明的并列省略均予保留。
