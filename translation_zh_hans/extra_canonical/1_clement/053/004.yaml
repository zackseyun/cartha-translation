  text: And Moses said, "If you will forgive their sin, forgive; but if not, blot me also out of the book of the living."
translation:
  language: zh_hans
  text: 摩西说：“绝不可，主啊！求你赦免这百姓的罪；不然，就把我也从活人册上涂去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: 绝不可
  rationale: 保留希腊文本明确而强烈的否定语气；虽英语修订层删去此语，现有希腊底本确实载有。
- source_word: ἄφες
  choice: 赦免
  rationale: 在罪的语境中自然表达“宽恕、免除”。
- source_word: τῷ λαῷ τούτῳ
  choice: 这百姓
  rationale: 按希腊语与现代汉语习惯表达受益对象；不机械译出与格形式。
- source_word: κἂν
  choice: 不然，就
  rationale: 此处连接两个替代性的请求，在上下文中自然体现“否则/即便如此”的转折推进；避免按英语咨询层补出底本没有的完整条件句。
- source_word: ἐξάλειψόν με
  choice: 把我……涂去
  rationale: 保留“擦除、涂抹掉”的形象，并用处置式使汉语流畅。
- source_word: ἐκ βίβλου ζώντων
  choice: 从活人册上
  rationale: 直译为“从活着之人的册子中”；“活人册”简洁、庄重，也保留其指称可能具有的文本传统背景。
theological_decisions:
- issue: Μηδαμῶς κύριε 是否保留
  choice: 保留为“绝不可，主啊”
  alternative: 依英语修订层删去，改成“如果你肯赦免……”
  rationale: 以提供的希腊原文为首要依据；该短语在本节底本中明确存在，不应因英语咨询层的改写而删除。
- issue: 将摩西的话理解为条件句还是两个替代请求
  choice: 译作先求赦免，继而说“不然”求自己被涂去
  alternative: 补成“如果你愿意赦免，就赦免；如果不愿意……”
  rationale: 希腊文本没有明示“如果你愿意”或“如果不愿意”；本译保留原句的紧凑与张力，不补足推定条件。
- issue: βίβλος ζώντων 的神学指向
  choice: 译为“活人册”而不加解释
  alternative: 译为“生命册”或在正文中界定其末世论含义
  rationale: “活人册”更直接对应 ζώντων，并避免把后期较固定的“生命册”术语及其特定神学含义反向套入本句。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。保留呼语“主啊”和“涂去”的原文意象；不添加原文未明说的条件成分。本节无需脚注，因此正文无脚注标记。
