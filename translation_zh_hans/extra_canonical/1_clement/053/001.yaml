  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/001.yaml
  text: For you know the holy Scriptures—and know them well, beloved—and you have pored over the oracles of God. Therefore we write these things for your remembrance.
translation:
  language: zh_hans
  text: 亲爱的，你们知道圣经，而且十分熟悉；你们也已经潜心查考上帝的圣言[a]。所以，我们写下这些事，是要提醒你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “潜心查考”原文有“俯身细察”之意；“圣言”也可译作“话语”或“神谕”。
    reason: 保留ἐγκύπτω的形象性本义，以及λόγια在“话语”与具有权威的“神谕”之间的词义幅度。
lexical_decisions:
- source_word: τὰς ἱερὰς γραφάς
  choice: 圣经
  rationale: 指神圣的经卷；“圣经”是现代汉语中自然、庄重且为普通读者熟悉的表达。
- source_word: ἐπίστασθε γὰρ καὶ καλῶς ἐπίστασθε
  choice: 你们知道……而且十分熟悉
  rationale: 保留原文动词的重复和递进强调，同时使汉语流畅。
- source_word: ἐγκεκύφατε
  choice: 潜心查考过
  rationale: 该词本义为“俯身细看”，用于经文时表示专注、深入地研读；“潜心查考”传达其语境义，完成体以“过”体现。
- source_word: τὰ λόγια τοῦ θεοῦ
  choice: 上帝的圣言
  rationale: λόγια在此指具有神圣权威的话语；“圣言”比普通的“话语”更能体现其庄严和权威，同时不把它简单等同于前面的“圣经”。
- source_word: πρὸς ἀνάμνησιν
  choice: 是要提醒你们
  rationale: 自然表达写作目的，即使读者重新记起已经知道的事。
theological_decisions:
- issue: τὰ λόγια τοῦ θεοῦ与τὰς ἱερὰς γραφάς的关系
  choice: 分别译为“圣经”和“上帝的圣言”
  alternative: 两者都译作“圣经”或“经上的话”
  rationale: 原文使用两个不同的名词短语。分别翻译可保留两者可能相指却不完全等同的张力，避免过度判定其范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲爱的各位”避免在原文仅有称呼“亲爱的”之处增添“弟兄姊妹”等身份限定；分号呈现原句的并列推进。
