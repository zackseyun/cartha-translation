  to: 主对他说：“我曾一再对你说：‘我看见了这百姓；看哪，他们是颈项刚硬的。任凭我毁灭他们，我要从天底下抹去他们的名；我要使你成为一个伟大、奇妙，并且比这民族大得多的民族。’”
  rationale: 修订仅消除不必要的语义增补并改善现代汉语表达。“大得多”在“大民族”的句法和语境内传达πολὺ μᾶλλον的比较力度，而不将其限定为“强盛”；不设脚注，因为此处不存在需以脚注处理的文本变体或不可在正文中自然保留的歧义。
