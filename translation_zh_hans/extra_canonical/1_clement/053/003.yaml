base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/003.yaml
  text: And the Lord said to him, “I have spoken to you once and twice, saying, ‘I have seen this people, and behold, it is stiff-necked. Leave me alone to destroy them, and I will blot out their name from under heaven; and I will make you into a nation great and marvelous and greater than this one.’”
translation:
  language: zh_hans
  text: 主对他说：“我曾一再对你说：‘我看见了这百姓；看哪，他们是颈项刚硬的。任凭我毁灭他们，我要从天底下抹去他们的名；我要使你成为一个伟大、奇妙，并且比这民族大得多的民族。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅπαξ καὶ δὶς
  choice: 一再
  rationale: 字面为“一次又两次”，在此是强调重复说过；译作“一再”符合现代汉语，同时保留反复申说之意。
- source_word: σκληροτράχηλος
  choice: 硬着颈项的
  rationale: 保留圣经传统中“颈项刚硬”的具体意象；用“硬着颈项”较贴近希腊文单数谓语形容词及引文语气。
- source_word: ἔασόν με
  choice: 由我吧，让我
  rationale: 既表达“不加拦阻、任凭我”的命令意味，也为后接不定式“灭绝”提供自然的现代汉语衔接。
- source_word: ἐξολεθρεῦσαι
  choice: 灭绝
  rationale: 表示彻底消灭，但原文没有独立的程度副词，因此不另加“彻底”等强化词。
- source_word: ἐξαλείψω
  choice: 抹去
  rationale: 保留擦除、除名的形象，并与后文“他们的名”自然搭配。
- source_word: ἔθνος
  choice: 民族
  rationale: 此处指由摩西而出的庞大族群；“民族”比“国家”更贴近谱系与群体含义。
- source_word: θαυμαστὸν
  choice: 奇妙的
  rationale: 保留“令人惊叹、非凡”的正面评价，不将其具体化为“强盛”或“荣耀”。
- source_word: πολὺ μᾶλλον ἢ τοῦτο
  choice: 比这百姓更为强盛
  rationale: 比较对象在语境中是当前百姓；希腊语表达省略了需由上下文补足的性质。用“强盛”使中文完整，但不添加英语修订中已删除的“远远”。
theological_decisions:
- issue: 神所说“由我吧”的拟人化张力
  choice: 按原文保留“由我吧，让我把他们灭绝”
  alternative: 弱化为“我要灭绝他们”
  rationale: 原文呈现神要求摩西不要拦阻的措辞，并为下一节摩西代求铺垫；不应在翻译中消解这一叙事与神学张力。
- issue: “一次又两次”的表达
  choice: 译为“一再”
  alternative: 直译“我曾一次、两次对你说”
  rationale: 该短语可能是强调反复申说的习语；“一再”自然且不把次数机械限定为两次。
- issue: 末句比较所指及性质
  choice: 将 τοῦτο 理解为“这百姓”，并以“强盛”补足中文比较
  alternative: 译为较含混的“远胜于这个”或“比这个更大”
  rationale: 中性代词依语境指前述百姓；πολὺ μᾶλλον 本身未明说比较维度。中文必须适度补足，选择与“大民族”语境相合的“强盛”，同时在记录中标明原文省略。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留引文层次和“看哪”等经文式修辞。没有脚注，因此正文不设脚注标记。
