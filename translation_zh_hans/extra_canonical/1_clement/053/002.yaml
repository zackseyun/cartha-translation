revisions:
- from: 因为摩西上了山，禁食并谦卑自己四十昼夜，神对他说：“摩西！摩西！赶快从这里下去，因为你从埃及地领出来的人民犯了不法之事。他们很快就偏离了我吩咐他们走的道路，为自己铸造了偶像。”
  to: 因为摩西上了山，在禁食和谦卑中度过了四十昼夜，神对他说：“摩西！摩西！从这里赶快下去，因为你从埃及地领出来的人民犯了不法之事。他们很快就偏离了我吩咐他们走的道路，为自己铸造了偶像。”
  rationale: 仅作安全的句法与语义范围调整：明确“四十昼夜”是摩西在禁食和谦卑状态中所度过的时段。其余译文保留原稿对急迫命令、不法行为、所命道路和复数铸像的忠实表达。
