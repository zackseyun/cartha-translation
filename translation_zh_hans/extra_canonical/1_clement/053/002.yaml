base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/002.yaml
  text: For when Moses had gone up the mountain and had spent forty days and forty nights in fasting and self-abasement, God said to him, “Moses, Moses, come down quickly from here, because your people, whom you brought out of the land of Egypt, have acted lawlessly. They have quickly turned aside from the way that I commanded them; they have made molten images for themselves.”
translation:
  language: zh_hans
  text: 因为摩西上了山，在禁食和谦卑中度过了四十昼夜，神对他说：“摩西！摩西！从这里赶快下去，因为你从埃及地领出来的人民犯了不法之事。他们很快就偏离了我吩咐他们走的道路，为自己铸造了偶像。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσαντος τεσσαράκοντα ἡμέρας καὶ τεσσαράκοντα νύκτας
  choice: 四十昼夜
  rationale: ποιέω在表示度过一段时间时宜按汉语习惯简洁表达；“四十昼夜”完整保留时长。
- source_word: ἐν νηστείᾳ καὶ ταπεινώσει
  choice: 禁食并谦卑自己
  rationale: νηστεία指禁食；ταπείνωσις可指卑微、谦卑或自我降卑。此处描述摩西的敬虔状态，用“谦卑自己”较自然，同时不额外限定为肉体苦行。
- source_word: τὸ τάχος
  choice: 赶快
  rationale: 表达立即、迅速行动的命令语气。
- source_word: ἠνόμησεν
  choice: 犯了不法之事
  rationale: 保留ἀνομέω与“不法、违背律法”相关的语义，不将其泛化为普通的“犯罪”。
- source_word: παρεβήσαν ... ἐκ τῆς ὁδοῦ
  choice: 偏离了……道路
  rationale: 按上下文表达离开神所命定之道；“偏离道路”在现代汉语中自然且保留原有比喻。
- source_word: χωνευτά
  choice: 铸造了偶像
  rationale: χωνευτά字面为熔铸之物或铸像；结合出埃及记金牛犊背景译作“铸造了偶像”，既说明制作方式，也传达其宗教性质，同时保留复数含义。
theological_decisions:
- issue: ταπείνωσις是内在谦卑还是苦行、自我降卑
  choice: 谦卑自己
  alternative: 刻苦己身／自我卑抑
  rationale: 原词可涵盖卑微、谦卑及降卑状态；“谦卑自己”在此最为通顺，又避免把文本解释成特定的苦修实践。
- issue: χωνευτά是否明确译为“偶像”
  choice: 铸造了偶像
  alternative: 铸像／熔铸之物
  rationale: 引文背景清楚涉及偶像崇拜；加上“偶像”能让普通读者准确理解，但不具体补成“金牛犊”，以保留本文复数形式。
- issue: “你的人民”是否调整为“你的百姓”
  choice: 你的人民
  alternative: 你的百姓
  rationale: λαός本义为人民、民众；采用现代通行的“人民”，避免因传统宗教措辞而削弱神对摩西所说“你的人民”这一带张力的表达。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留叙事引文的急迫语气与“你的人民”所含的修辞张力；不按出埃及记平行经文擅自补入“金牛犊”等细节。
