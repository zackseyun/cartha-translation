base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/005.yaml
  text: O great love! O unsurpassable perfection! A servant speaks boldly to his Lord, asks forgiveness for the multitude, or even asks to be blotted out with them.
translation:
  language: zh_hans
  text: 何等伟大的爱！何等无可超越的完美！这仆人放胆向主陈情，为众人祈求赦免，甚至求自己也与他们一同被涂去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ μεγάλης ἀγάπης
  choice: 何等伟大的爱！
  rationale: 保留感叹句的强烈赞叹语气；ἀγάπη在此指摩西为百姓代求所彰显的爱。
- source_word: τελειότητος ἀνυπερβλήτου
  choice: 无与伦比的完全
  rationale: τελειότης表示完满、完全的品格；ἀνυπέρβλητος意为无法超越，译法兼顾语义与庄重语体。
- source_word: παρρησιάζεται
  choice: 竟敢……坦然陈言
  rationale: 该词兼有勇敢、坦率和无所畏惧地发言之意；结合仆人面对主的语境，用“竟敢”体现身份张力，“坦然陈言”体现发言方式。
- source_word: θεράπων
  choice: 仆人
  rationale: 此处指服事主的人；“仆人”自然保留其从属身份，不额外引入职分含义。
- source_word: κύριον
  choice: 主
  rationale: 与θεράπων形成仆人与主人的对应关系；在本段语境中也明确指上帝。
- source_word: ἄφεσιν
  choice: 赦免
  rationale: 在罪的上下文中表示免除罪责，译为“赦免”最为准确。
- source_word: τῷ πλήθει
  choice: 为众人
  rationale: πλῆθος指群众或全体百姓；“众人”符合现代汉语，也避免机械译作“群众”。
- source_word: ἐξαλειφθῆναι
  choice: 被涂去
  rationale: 承接上文从生命册中除名的图像，保留原文“擦除、涂抹”的形象，而不直接释义为“灭亡”。
- source_word: ἀξιοῖ
  choice: 请求
  rationale: 此处表示提出要求或请求；译作“请求”符合摩西代求的语境，避免“自认为配得”等在此不适用的常见义项。
theological_decisions:
- issue: 摩西请求“与他们一同被涂去”的确切后果
  choice: 保留“被涂去”的原文意象
  alternative: 释义为“与他们一同灭亡”或“从生命册上除名”
  rationale: 本节自身未重述“生命册”，且ἐξαλείφω的形象具有解释空间；直译可与上一节相连，同时不替原文判定其全部神学含义。
- issue: παρρησιάζεται所表达的仆人与主之间的张力
  choice: 译为“竟敢向主坦然陈言”
  alternative: “放胆对主说话”
  rationale: “坦然陈言”保留无惧直言的意味，“竟敢”则呈现作者对仆人在主面前如此发言的惊叹，并不暗示不敬。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个“何等”保留希腊文重复感叹的修辞；后句维持“仆人—主”的身份对照和逐层加强的结构：坦然陈言、为众人求赦免、乃至请求与他们一同被涂去。
