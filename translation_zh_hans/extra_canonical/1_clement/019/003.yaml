base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/003.yaml
  text: Let us behold him in our mind, and let us look with the eyes of the soul into his patient purpose. Let us understand how free from anger he is toward all his creation.
translation:
  language: zh_hans
  text: 让我们在心中观看他，用心灵的眼睛注视他恒忍的心意。让我们明白，他对自己所造的一切毫不发怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ διάνοιαν
  choice: 在心中
  rationale: 表达以内在思想观照之意，符合现代汉语习惯，也保留与下文“心灵的眼睛”相呼应的内在观看意象。
- source_word: τοῖς ὄμμασιν τῆς ψυχῆς
  choice: 用心灵的眼睛
  rationale: 保留原文“灵魂之眼”的比喻，同时采用现代读者自然可懂的表达。
- source_word: τὸ μακρόθυμον αὐτοῦ βούλημα
  choice: 他恒久忍耐的旨意
  rationale: μακρόθυμον含长久忍耐、迟于发怒之意；βούλημα在此指意旨或意向，译作“旨意”可保留神学分量。
- source_word: νοήσωμεν
  choice: 让我们思想
  rationale: 表示理解、领会；“思想”既承接内在观照，也避免仅译作理性层面的“明白”。
- source_word: ἀόργητος
  choice: 不轻易发怒
  rationale: 该词可指不发怒、无怒；上下文强调上帝的恒忍，译作“不轻易发怒”以自然汉语传达克制怒气的含义，并避免把原文绝对化为毫无审判之怒。
- source_word: πᾶσαν τὴν κτίσιν αὐτοῦ
  choice: 自己所造的万物
  rationale: 比“所有受造物”更贴近日常现代汉语，同时完整涵盖整个受造界。
theological_decisions:
- issue: ἀόργητος是否表示上帝绝无愤怒
  choice: 译作“不轻易发怒”
  alternative: “不发怒”或“没有怒气”
  rationale: 原词本身可有“无怒”的强义，但与μακρόθυμος的恒忍语境相连时，也可强调不易动怒。所选译法保留上帝忍耐的重点，不把句子扩展为否认一切神圣愤怒或审判的教义命题。
- issue: βούλημα的意涵
  choice: “旨意”
  alternative: “意向”或“计划”
  rationale: “旨意”能体现所观照的是创造主恒忍的意愿与定意；同时不额外说明其具体施行方式，以保留原文概括性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以两个“让我们”保留原文共同劝勉的语气；保留“注视—心灵的眼睛—察看”的观照意象，并用“恒久忍耐”“不轻易发怒”呈现本节的语义呼应。
