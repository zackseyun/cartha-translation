base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/002.yaml
  text: Since, then, we have been deemed worthy of many great and glorious things, let us press on toward the goal of peace that has been handed down to us from the beginning, and let us fix our gaze on the Father and Creator of the whole world, and cling to his magnificent and surpassing gifts and benefits of peace.
translation:
  language: zh_hans
  text: 所以，我们既有分于许多伟大而荣耀的事，就当向着那从起初传给我们的和平目标奋力前行；让我们定睛仰望万有的父和创造主，紧紧连于他那宏大而超越的和平恩赐和福惠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετασχόντες
  choice: 既参与了
  rationale: 按所给希腊文本直译其“有分于、参与”之义，不采用英语修订层依据另一读法所作的“被认为配得”解释。
- source_word: πράξεων
  choice: 事
  rationale: 此词可指行为、事迹或事件；上下文未明确这些事由谁施行，因此用宽泛的“事”保留含义空间。
- source_word: ἐκτελέσωμεν ἐπὶ ... σκοπόν
  choice: 向着……目标奋力前行
  rationale: 表达朝目标推进并坚持到底的劝勉意味，同时保持现代汉语自然流畅。
- source_word: παραδεδομένον
  choice: 传给
  rationale: 保留传统被领受、传承下来的意义，不额外限定传递者。
- source_word: ἀτενίσωμεν
  choice: 定睛仰望
  rationale: 传达专注凝视之意；对象是“父和创造主”，故用“仰望”符合庄重自然的中文表达。
- source_word: πατέρα καὶ κτίστην τοῦ σύμπαντος κόσμου
  choice: 全世界的父和创造主
  rationale: 保留两个并列称号及其共同限定语，不将“父”扩展为原文未明说的特定关系。
- source_word: κολληθῶμεν
  choice: 紧紧依附
  rationale: 体现“黏合、紧密连结”的强烈程度，较单纯“珍视”更贴近原词。
- source_word: δωρεαῖς τῆς εἰρήνης εὐεργεσίαις τε
  choice: 和平恩赐与福泽
  rationale: 将两个并列名词分别译出；“和平”在句法上至少明确修饰“恩赐”，中文合并表达则自然涵盖整组来自上帝的赐予与善惠。
theological_decisions:
- issue: μετασχόντες 的主体与所参与之事
  choice: 译作“我们既参与了许多伟大而荣耀的事”
  alternative: “我们既蒙配得许多伟大而荣耀的事”
  rationale: 所提供的原文明确读作 μετασχόντες，而非英语修订说明所设想的 ἠξιώθημεν；因此以原文为先，也不把这些“事”擅自说成是“我们的功绩”。
- issue: “和平”的传承
  choice: “那从起初传给我们的和平目标”
  alternative: “起初就为我们设立的和平目标”
  rationale: παραδεδομένον 强调被传递、承接的传统，不宜弱化为仅仅“设立”，也不应补出原文未指明的传递主体。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。句式保留原文连续劝勉的推进感，以“所以……就当……；让我们……”呈现；避免古奥词汇，也不引入宗派性解释。
