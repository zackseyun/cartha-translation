revisions:
- from: 所以，我们既参与了许多伟大而荣耀的事，就当向着那从起初传给我们的和平目标奋力前行；让我们定睛仰望全世界的父和创造主，紧紧依附他那宏伟无比的和平恩赐与福泽。
  to: 所以，我们既有分于许多伟大而荣耀的事，就当向着那从起初传给我们的和平目标奋力前行；让我们定睛仰望万有的父和创造主，紧紧连于他那宏大而超越的和平恩赐和福惠。
  rationale: 修订仅处理范围和句法表达：“万有”对应整个受造宇宙；“紧紧连于”自然表达 κολληθῶμεν；“宏大而超越的”置于并列的“和平恩赐和福惠”之前，以体现其共同修饰。保留“有分于……事”，忠实反映所给底本的 μετασχόντες πράξεων，并不采纳英文审校记录所依据的异文性理解。
