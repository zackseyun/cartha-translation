id: 1CLEM.19.1
reference: 1 Clement 19:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: Τὴν τοσούτων οὖν καὶ τοιούτων οὕτως μεμαρτυρημένων τε ταπεινοφρόνων καὶ τὸ ὑποδεὲς διὰ τῆς ὑπακοῆς οὐ μόνον ἡμᾶς, ἀλλὰ καὶ τὰς πρὸ ἡμῶν γενεὰς βελτίους ἐποίησεν, τούς τε καταδεξαμένους τὰ λόγια αὐτοῦ ἐν ὁσίῳ καὶ ἀληθείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/001.yaml
  text: Therefore, the humility and submissiveness of so many and such great people, so well attested, through obedience has made not only us better, but also the generations before us—those who received his oracles in holiness and truth.
translation:
  language: zh_hans
  text: 因此，如此众多、如此蒙见证的谦卑者，他们的谦卑和甘居下位，借着顺从，不但使我们，也使我们以前的世代——那些在圣洁和真理中领受他神圣言语的人——变得更好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινοφρόνων / ταπεινοφροσύνη（依句法所表达的性质）
  choice: 谦卑之人／他们的谦卑
  rationale: 原文以形容谦卑者的表达引出其品格；中文适度补明“他们的谦卑”，使长句主干清楚，同时保留人与品格的联系。
- source_word: τὸ ὑποδεές
  choice: 顺服
  rationale: 指甘居下位、服从的态度；“顺服”比“卑下”更自然，也与随后“借着听从”形成原文所具有的语义关联。
- source_word: διὰ τῆς ὑπακοῆς
  choice: 借着听从
  rationale: ὑπακοή在此表示听从、服从；译作“听从”以避免与前面的“顺服”机械重复。
- source_word: βελτίους ἐποίησεν
  choice: 使……变得更好
  rationale: 保留比较级βελτίους的宽泛含义，不擅自限定为道德、属灵或行为层面的改善。
- source_word: τὰ λόγια αὐτοῦ
  choice: 他圣言
  rationale: λόγια指神圣的言语或启示；“圣言”自然庄重，并保留αὐτοῦ所指对象由上下文确定的空间。
- source_word: ἐν ὁσίῳ καὶ ἀληθείᾳ
  choice: 以圣洁和诚实
  rationale: ὅσιος在此为圣洁、虔敬；ἀλήθεια可指真实、真诚或真理。结合“领受”的态度译为“诚实”，但不扩展为教义性的“真理”。
theological_decisions:
- issue: αὐτοῦ（“他的”）的指称
  choice: 保留为“他”
  alternative: 明确译为“神”或“基督”
  rationale: 本节自身没有明说先行词；不以译文消除原文的指称含混。
- issue: “使……更好”的具体层面
  choice: 保持概括表达
  alternative: 译为“使……在品德上更好”或“使……更圣洁”
  rationale: 原文只用宽泛比较级，未限定改善的领域。
- issue: 前代与“领受圣言者”的关系
  choice: 以破折号将后者作为解释性同位语
  alternative: 将其译成前代中的一个限制性子集
  rationale: 原文宾格结构最自然地把“那些领受他圣言的人”解释为前述世代中的相关人群；破折号同时保留一定句法开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。因希腊原句结构紧密且主语成分复杂，中文通过复现“他们的谦卑和顺服”理清主干；保留“不但……也……”及末尾解释语，以呈现原文的递进和回顾语气。
