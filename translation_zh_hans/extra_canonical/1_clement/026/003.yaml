  text: And again[a], Job says, “And you will raise up this flesh of mine, which has borne all these things.”
translation:
  language: zh_hans
  text: 约伯又说：“你必使我这承受了这一切的肉身复活。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεις
  choice: 使……复起
  rationale: 保留及物结构和将来语气，表达使肉身重新起来；“复起”既贴近原文，也符合此处复活的语境。
- source_word: σάρκα μου ταύτην
  choice: 我这……肉身
  rationale: 体现 ταύτην 的指示和强调，并以现代汉语较自然的语序呈现“我的这肉身”。
- source_word: ἀναντλήσασαν
  choice: 承受了
  rationale: 该词在此表示经受、承担苦难；“承受”既保留负荷意味，也避免把语义过度限定为忍耐或战胜。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 简洁对应“所有这些事”，所指由上下文中的苦难确定。
theological_decisions:
- issue: ἀναστήσεις 是否明确译作“复活”
  choice: 使……复起
  alternative: 使……复活
  rationale: “复起”保留原词“使起来”的具体表达，同时在肉身复起的语境中自然传达复活含义，不额外强化术语化解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文第二人称“你”和将来肯定语气，不补明其所指；引语形式也按希腊文本保留。
