base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/002.yaml
  text: For somewhere he says, “And you will raise me up, and I will give thanks to you”; and, “I lay down and slept; I awoke, because you are with me.”
translation:
  language: zh_hans
  text: 因为他在某处说：“你必使我起来，我也要向你称谢。”又说：“我躺下睡着了；我醒了，因为你与我同在。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαναστήσεις
  choice: 使我起来
  rationale: 保留使役意味及“起来”的复起意象，不在正文中将其限定为普通起身或末日复活。
- source_word: ἐξομολογήσομαι
  choice: 向你称谢
  rationale: 此处可指公开承认、颂赞或感谢；按引文语境译为自然的“称谢”，同时保留对上帝发出的赞谢意味。
- source_word: Ἐκοιμήθην καὶ ὕπνωσα
  choice: 我躺下睡了
  rationale: 用现代汉语表达入睡的连续动作，避免生硬重复；“睡”也保留上下文可能借睡眠暗示死亡的张力。
- source_word: ἐξηγέρθην
  choice: 随后醒来
  rationale: 在睡眠语境中自然译作“醒来”，但不额外排除其与“兴起、复起”相关的语义呼应。
- source_word: μετ᾿ ἐμοῦ
  choice: 与我同在
  rationale: 准确表达陪伴与临在，比单纯“和我在一起”更符合庄重宗教语体。
theological_decisions:
- issue: 两段引文中的起来与醒来是否明确指身体复活
  choice: 保留“使我起来／醒来”的意象，不明说“复活”
  alternative: 译为“使我复活／我复活了”
  rationale: 希腊词可在本段复活论语境中被这样应用，但引文本身仍以起来和睡醒的语言表达；不宜把解释直接写入正文。
- issue: 引文主体的性别与身份
  choice: 省略汉语中不必要的第三人称主语
  alternative: 译作“他说”或“上帝说”
  rationale: λέγει的隐含主语可由上下文理解；原文未在本句明示身份，中文“有一处说”既自然也避免过度判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号区分两段引文，并用“又说”对应 καί，保留其并列引用结构。正文无脚注标记，因为本节无需另设脚注。
