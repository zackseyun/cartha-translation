source:
  edition: Funk 1901 (normalized OCR)
  text: Μέγα καὶ θαυμαστὸν οὖν νομίζομεν εἶναι, εἰ ὁ δημιουργὸς τῶν ἁπάντων ἀνάστασιν ποιήσεται τῶν ὁσίως αὐτῷ δουλευσάντων ἐν πεποιθήσει πίστεως ἀγαθῆς, ὅπου καὶ δι᾿ ὀρνέου δείκνυσιν ἡμῖν τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/001.yaml
  text: Therefore, do we consider it a great and marvelous thing if the Maker of all things will bring about the resurrection of those who have served him in holiness, in the confidence of good faith, when even through a bird he shows us the greatness of his promise?
translation:
  language: zh_hans
  text: 那么，万物的创造主若要使那些以圣洁侍奉他、怀着美好信心的笃定之人复活，我们还会认为这是什么伟大而奇妙的事吗？毕竟，他甚至借着一只鸟向我们显明了他应许的伟大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργὸς τῶν ἁπάντων
  choice: 万物的创造主
  rationale: 既保留“造作者”的本义，也采用现代中文宗教及一般语境中自然庄重的表达。
- source_word: ἀνάστασιν ποιήσεται
  choice: 将使……复活
  rationale: 直达希腊语“成就复活”的意思，比名词化的“施行复活”更符合现代汉语。
- source_word: ὁσίως αὐτῷ δουλευσάντων
  choice: 以圣洁侍奉他
  rationale: ὁσίως 表示合乎敬虔、圣洁的方式；δουλεύω 在此指对上帝的服侍。
- source_word: ἐν πεποιθήσει πίστεως ἀγαθῆς
  choice: 怀着美好信仰的确信
  rationale: 保留 πεποίθησις（确信、信赖）与 πίστις ἀγαθή（美好的信仰/信实）之间的属格关系，不将两者合并为单一概念。
- source_word: δι᾿ ὀρνέου
  choice: 借着一只鸟
  rationale: ὄρνεον 泛指鸟；本节未明说鸟的种类，因此不提前指定为后文传统中的凤凰。
- source_word: τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ
  choice: 他应许的伟大
  rationale: 保留原文“应许之伟大”的抽象表达，同时使中文自然。
theological_decisions:
- issue: 开头反问句的语气与逻辑
  choice: 译作“我们难道会认为这是伟大而奇妙的事吗？”
  alternative: “我们认为这是伟大而奇妙的事吗？”
  rationale: 希腊文以 εἰ 引出反问内容，语境意在说明普世创造主使敬虔者复活并非不可思议；加入“难道”自然传达反问力度，但不另行补入答案。
- issue: πίστεως ἀγαθῆς 的含义
  choice: 美好信仰
  alternative: 善意的信实／纯正的信心
  rationale: 该短语可涉及信心、信仰或信实；正文采用涵盖面较广的“信仰”，避免将其限定为某一教义术语。
- issue: 鸟作为应许的征兆
  choice: 保持泛称“一只鸟”
  alternative: 凤凰
  rationale: 本节原文本身仅说“鸟”；虽然后文谈及凤凰，此处不把上下文信息直接写进原句。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。第一句保留原文反问结构及其神学张力；第二句独立成句，以免中文长句过重。未设置脚注，因此正文无脚注标记。
