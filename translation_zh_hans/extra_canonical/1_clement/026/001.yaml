revisions:
- from: 那么，如果万物的创造主将使那些以圣洁侍奉他、怀着美好信仰的确信之人复活，我们难道会认为这是伟大而奇妙的事吗？他甚至借着一只鸟向我们显明他应许的伟大。
  to: 那么，万物的创造主若要使那些以圣洁侍奉他、怀着美好信心的笃定之人复活，我们还会认为这是什么伟大而奇妙的事吗？毕竟，他甚至借着一只鸟向我们显明了他应许的伟大。
