lexical_decisions:
- source_word: λειτουργοὶ
  choice: 仆役们
  rationale: 此词指履行受托职分、服事上帝的人；译作“仆役”既自然，又避免把具体职分限定为后世教会制度中的“圣职人员”。
- source_word: χάριτος τοῦ θεοῦ
  choice: 上帝恩典的
  rationale: 保留希腊文属格结构，表达这些仆役与上帝恩典之间的所属或服事关系，不进一步消解其语义张力。
- source_word: διὰ πνεύματος ἁγίου
  choice: 借着圣灵
  rationale: διά加属格通常表示媒介或施行者，“借着”准确传达他们是在圣灵的作用下说话。
- source_word: περὶ μετανοίας
  choice: 讲论了悔改
  rationale: περί表示所谈论的主题；μετάνοια在此采用通行且具有经文语体的“悔改”。
- source_word: ἐλάλησαν
  choice: 讲论了
  rationale: 采用过去时态含义，并与περί自然搭配；不额外指定听众或宣讲形式。
theological_decisions:
- issue: “上帝恩典的仆役”所指身份
  choice: 保留宽泛的“仆役们”
  alternative: “传讲上帝恩典的人”或“上帝恩典的执事们”
  rationale: 原文λειτουργοί可指承担神圣服事者，但此处没有明确限定某一教会职级；宽泛译法避免导入后世制度含义。
- issue: 圣灵与发言者的关系
  choice: 译为“借着圣灵”
  alternative: “在圣灵感动下”
  rationale: 原文明确使用媒介性介词结构，但未明说“感动”；直译可保留其神学力度而不添加心理过程。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留原句末尾逗号，以反映本节在上下文中可能继续展开。
