  text: πάντας οὖν τοὺς ἀγαπητοὺς αὐτοῦ βουλόμενος μετανοίας μετασχεῖν ἐστήριξεν τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/005.yaml
  text: Therefore[a], desiring all his beloved ones to share in repentance, he established it by his almighty will.
translation:
  language: zh_hans
  text: 所以，他愿意让所有他所爱的人都有份于悔改，就以他全能的旨意确立了这事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“确立了”的宾语没有明说；正文的“这事”是按上下文补出，指有关悔改的安排或宣告。按语法也可理解为“坚固了他们”。
    reason: 原文 ἐστήριξεν 为及物动词而宾语省略；脚注保留其指向的语法歧义，避免将上下文推断当作明说。
lexical_decisions:
- source_word: πάντας ... τοὺς ἀγαπητοὺς αὐτοῦ
  choice: 所有蒙他所爱的人
  rationale: 忠实表达“他所有蒙爱的人”，用“蒙他所爱”保持庄重而自然的现代汉语表达。
- source_word: μετανοίας μετασχεῖν
  choice: 有份于悔改
  rationale: μετέχω 表示参与、分享或有份；“有份于”保留其参与含义，也不把悔改弱化为仅仅获得一次机会。
- source_word: ἐστήριξεν
  choice: 使……坚定不移
  rationale: στηρίζω 的基本语义是使稳固、确立或坚固；此处结合省略的宾语，译为“使这事坚定不移”，既体现确认、确立之意，又符合汉语习惯。
- source_word: τῷ παντοκρατορικῷ βουλήματι αὐτοῦ
  choice: 以他全能的旨意
  rationale: παντοκρατορικός 表示全能、统御万有；βούλημα 指意愿、旨意或定意。“全能的旨意”简洁保留神圣权能与意志两层含义。
theological_decisions:
- issue: 悔改的参与范围
  choice: 所有蒙他所爱的人都有份于悔改
  alternative: 让所有他所爱的人获得悔改的机会
  rationale: 原文说“有份于悔改”，没有明说只是获得机会；正文保留这一较直接且带有神学张力的表达。
- issue: ἐστήριξεν 的省略宾语
  choice: 以“这事”概括前述关于悔改的意愿、宣告或安排
  alternative: 理解为“坚固了所有蒙爱的人”
  rationale: 原文没有明说宾语；上下文谈到神以誓言和应许宣告悔改，“这事”能自然回指前述内容，同时用脚注保留语法上的歧义。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“所以”承接上文；“便”呈现分词所表达的意愿与主句行动之间的自然联系。脚注明示原文宾语省略，避免把解释当作原文明说的内容。
