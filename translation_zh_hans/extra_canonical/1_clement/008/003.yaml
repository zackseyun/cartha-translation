revisions:
- from: “以色列家啊，要悔改，离开你们的不法。我曾对我百姓的儿女说：‘即使你们的罪从地上直达天上，即使比朱红更红，比麻布更黑，只要你们全心归向我，说：“父啊！”我就必垂听你们，把你们当作圣洁的子民。’”
  to: “以色列家啊，要悔改，离开你们的不法。我曾对我百姓的儿女说：‘即使你们的罪从地上直到天上，即使比朱红更红、比麻布更黑，而你们若全心归向我，并说：“父啊！”我就必像垂听圣洁的子民那样垂听你们。’”
  rationale: 修订不改变原文所呈现的强烈罪恶意象和归向的条件，只避免以“只要”将条件关系解释得过于确定；同时把末句恢复为中文可理解的比较表达，避免把“圣洁的子民”解释为无条件已确立的身份。无须脚注。
