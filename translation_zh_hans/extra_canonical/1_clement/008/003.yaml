reference: 1 Clement 8:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: Μετανοήσατε, οἶκος Ἰσραήλ, ἀπὸ τῆς ἀνομίας ὑμῶν· εἶπον τοῖς υἱοῖς τοῦ λαοῦ μου· Ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ καὶ ἐὰν ὦσιν πυρρότεραι κόκκου καὶ μελανώτεραι σάκκου, καὶ ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας καὶ εἴπητε· Πάτερ, ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/003.yaml
  text: “Repent, O house of Israel, of your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
translation:
  language: zh_hans
  text: “以色列家啊，要悔改，离开你们的不法。我曾对我百姓的儿女说：‘即使你们的罪从地上直到天上，即使比朱红更红、比麻布更黑，而你们若全心归向我，并说：“父啊！”我就必像垂听圣洁的子民那样垂听你们。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετανοήσατε
  choice: 要悔改
  rationale: 既保留转变心意与生命方向的核心含义，也采用现代中文宗教语境中自然、庄重的常用表达。
- source_word: οἶκος Ἰσραήλ
  choice: 以色列家
  rationale: 保留闪语式集体称谓及其经文色彩，不释作“以色列民族”。
- source_word: ἀπὸ τῆς ἀνομίας ὑμῶν
  choice: 离开你们的不法
  rationale: ἀπό在此与悔改连用，表达脱离；ἀνομία译为“不法”，保留其违反神法度的广义，不窄化为某一种罪。
- source_word: εἶπον
  choice: 我曾……说
  rationale: 按现存希腊文本保留第一人称过去时，而不依可能的引文来源改成命令式“你要说”。
- source_word: τοῖς υἱοῖς τοῦ λαοῦ μου
  choice: 我百姓的儿女
  rationale: 较形式地保留υἱοί的亲属意象，同时在泛指群体时用“儿女”，避免限定为男性。
- source_word: ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ
  choice: 从地上直达天上
  rationale: 自然呈现罪之广大程度；“直达”使中文完整，但不另行解释其具体性质。
- source_word: πυρρότεραι κόκκου
  choice: 比朱红更红
  rationale: κόκκος在染色语境指由胭脂虫所得的朱红色；以“朱红”保留颜色比较及经文意象。
- source_word: μελανώτεραι σάκκου
  choice: 比麻布更黑
  rationale: 保留比较结构及粗黑布料的意象；现代读者较易理解“麻布”，且不擅自加入哀悼含义。
- source_word: ἐπιστραφῆτε πρὸς με
  choice: 归向我
  rationale: 准确表达转回、转向的关系性动作，并与“悔改”形成原文中的呼应。
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: 全心
  rationale: 以自然简洁的现代汉语表达“从全部的心”，保留全然投入之意。
- source_word: ἐπακούσομαι ὑμῶν
  choice: 我就必垂听你们
  rationale: ἐπακούομαι含留意并回应祈求之意；“垂听”庄重自然，也保留神对人言说的语境。
- source_word: ὡς λαοῦ ἁγίου
  choice: 把你们当作圣洁的子民
  rationale: 将ὡς的比较或身份看待关系显明为中文，保留“作为／如同圣洁子民”的语义，而不直接断言身份已无条件确立。
theological_decisions:
- issue: 条件句是否译作让步句
  choice: 采用“即使……只要……”
  alternative: 直译为“如果……并且如果……并且你们归向……”
  rationale: 原文连续ἐάν条件在语用上强调罪无论多重，归回仍蒙垂听；中文“即使……只要……”自然呈现该张力，但没有把悔改条件删去。
- issue: ὡς λαοῦ ἁγίου所表达的身份关系
  choice: 译为“把你们当作圣洁的子民”
  alternative: 译为“像垂听圣洁的子民一样垂听你们”或“因为你们是圣洁的子民”
  rationale: 保留ὡς的“作为／如同”弹性，避免加入因果关系，也避免过度规定这里是身份恢复还是比较性的待遇。
- issue: 罪、悔改与神垂听之间的关系
  choice: 保留完整条件结构
  alternative: 将其释义为无条件赦免，或加入赦罪措辞
  rationale: 原文说“垂听”，没有明说“赦免”；译文不以系统神学术语替代原句。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留“以色列家”“朱红”“垂听”“圣洁的子民”等经文语汇，同时避免过度古雅。引号层级清楚；本节无需脚注。
