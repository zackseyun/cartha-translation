  text: καὶ αὐτὸς δὲ ὁ δεσπότης τῶν ἁπάντων περὶ μετανοίας ἐλάλησεν μετὰ ὅρκου· Ζῶ γὰρ ἐγώ, λέγει κύριος, οὐ βούλομαι τὸν θάνατον τοῦ ἁμαρτωλοῦ ὡς τὴν μετάνοιαν, προστιθεὶς καὶ γνώμην ἀγαθήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/002.yaml
  text: 'And the Master of all things himself also spoke concerning repentance with an oath: “For as I live,” says the Lord[b][a], “I do not desire the death of the sinner so much as his repentance,” adding also a good judgment:'
translation:
  language: zh_hans
  text: 万有的主宰自己也曾就悔改之事起誓说：“主说：‘我凭我的生命起誓：与其要罪人死亡，我更要他悔改。’”他又加上一句美善的劝言：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝言”或译“美善的判断”或“美善的宣告”。希腊文γνώμη可指意见、劝告、格言、判断或宣告；此处引出下一节的话语。
    reason: 保留γνώμη的真实词义幅度，并说明其在上下文中引出后续言语。
lexical_decisions:
- source_word: ὁ δεσπότης τῶν ἁπάντων
  choice: 万有的主宰
  rationale: δεσπότης表示拥有权柄的主人或主宰，τῶν ἁπάντων指一切、万有；此译庄重自然。
- source_word: περὶ μετανοίας
  choice: 指着悔改
  rationale: 与ἐλάλησεν连用，意为论及悔改；结合μετὰ ὅρκου，用“指着悔改起誓说”使现代汉语句法顺畅。
- source_word: μετὰ ὅρκου
  choice: 起誓说
  rationale: 明确保留“带着誓言、以誓言”的语义。
- source_word: Ζῶ γὰρ ἐγώ
  choice: 我指着我的永生起誓
  rationale: 希腊文直译为“我活着”，在先知性誓言公式中表达“我凭我的永生起誓”；如此译出其誓言功能，避免汉语误解。
- source_word: οὐ βούλομαι ... ὡς
  choice: 我所要的不是……而是……
  rationale: ὡς在比较结构中表达相较之下的偏好；此处自然呈现“不愿罪人死亡，愿其悔改”的对比，同时不扩展为绝对的系统性命题。
- source_word: γνώμην ἀγαθήν
  choice: 一句美善的劝言
  rationale: γνώμη在此引出下一节的言语，可指意见、格言或劝告；“劝言”贴合上下文，但该词也可能理解为“宣告”，故加注说明。
theological_decisions:
- issue: 神对罪人死亡与悔改的意愿之比较
  choice: 我所要的不是罪人死亡，而是他悔改
  alternative: 我不愿罪人死亡，倒愿他悔改
  rationale: 保留οὐ ... ὡς的比较张力，不将句子改写成超出原文的教义性断言。
- issue: “主宰”与引文中“主”的称谓
  choice: 分别译为“万有的主宰”和“主”
  alternative: 两处都译作“主”
  rationale: 保留δεσπότης与κύριος的词汇区别，同时维持两者均指向神的上下文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“万有的主宰”保留原文称号的权柄感；引文使用现代可懂的誓言表达。主文中的[a]与脚注对应。
