  text: ὁ ἰσχυρὸς ἐπιμελείσϑω τὸν ἀσϑενῆ, ὁ δὲ ἀσϑενὴς ἐντρεπέσϑω τὸν ἰσχυρόν· ὁ πλούσιος ἐπιχορηγείτω τῷ πτωχῷ, ὁ δὲ πτωχὸς εὐχαριστείτω τῷ ϑεῷ, ὅτι ἔδωκεν αὐτῷ, ᾧ οὐ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα· ὁ σοφὸς ἐνδεικνύσθω τὴν σοφίαν αὐτοῦ μὴ ἐν λόγοις, ἀλλʼ ἐν ἔργοις ἀγαθοῖς· ὁ ταπεινοφρονῶν μὴ ἑαυτῷ μαρτυρείτω, ἀλλʼ ἔατω ὑφʼ ἑτέρου ἑαυτὸν μαρτυρεῖσθαι· ὁ ἁγνὸς ἐν τῇ σαρκὶ μὴ ἀλαζονευέσθω, γινώσκων, ὅτι ἕτερός ἐστιν ὁ ἐπιχορηγῶν αὐτῷ τὴν ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/002.yaml
  text: Let the strong care for the weak[a], and let the weak respect the strong. Let the rich provide for the poor, and let the poor give thanks to God, because he has given him one through whom his need may be supplied. Let the wise show his wisdom not in words, but in good works. Let the humble-minded not testify concerning himself, but let him allow himself to be testified to by another. Let the one who is pure in the flesh not boast[b], knowing that it is another who supplies him with self-control.
translation:
  language: zh_hans
  text: 强者要照顾弱者，弱者也要敬重强者。富足的人要供给贫穷的人，贫穷的人要感谢上帝，因为上帝赐给他一个人，使他的缺乏可以借着这人得到补足。智慧人不要用言语，而要用善行显明自己的智慧。谦卑的人不要为自己作见证，却要让别人为他作见证。那在肉身上保持纯洁的人不可夸口[a]，因为他知道，赐给他节制能力的是另一位[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夸口”也可理解为“自负”或“炫耀”。
    reason: ἀλαζονεύεσθαι带有自夸、自负地炫示之意；正文选取简洁常用的“夸口”。
  - marker: b
    text: “另一位”在语境中指上帝；原文并未在这里直接说出“上帝”。
    reason: 保留ἕτερος的含蓄指称，同时帮助读者把握上下文。
lexical_decisions:
- source_word: ἐπιμελείσϑω
  choice: 要照顾
  rationale: 表达持续关怀和照料，符合该动词在此处对强者的劝勉。
- source_word: ἐντρεπέσϑω
  choice: 要敬重
  rationale: 该词可涉及尊重、顾念或因敬畏而有所顾忌；此处与强弱双方彼此应尽的责任并列，译作“敬重”自然且不把语义缩窄为惧怕。
- source_word: ἐπιχορηγείτω
  choice: 要供给
  rationale: 保留向有缺乏者提供所需之物的含义，并与末句同词形成呼应。
- source_word: ὑστέρημα
  choice: 缺乏
  rationale: 既可指匮乏状态，也可指所缺之物；“缺乏”保留这种宽度。
- source_word: ταπεινοφρονῶν
  choice: 谦卑的人
  rationale: 将分词自然名词化，表达具有谦卑心志的人。
- source_word: ἁγνὸς ἐν τῇ σαρκὶ
  choice: 在肉身上保持纯洁的人
  rationale: 保留“肉身”限定，避免擅自把纯洁具体化为某一种禁欲实践。
- source_word: ἐγκράτειαν
  choice: 节制能力
  rationale: ἐγκράτεια指自制、克制；加入“能力”使“赐给”在现代汉语中自然，并凸显这种自制并非出于自夸的资本。
theological_decisions:
- issue: 贫穷者所得帮助的终极来源
  choice: “上帝赐给他一个人，使他的缺乏可以借此得到补足”
  alternative: “上帝赐给他所需之物，补足他的缺乏”
  rationale: 希腊文ᾧ为阳性关系代词，最自然地指上帝所赐的某个人，即前述富足者；保留人的中介角色以及上帝为最终赐予者的张力。
- issue: “另一位”的指称
  choice: 保留“另一位”，并以脚注说明通常指上帝
  alternative: 正文直接译作“上帝”
  rationale: 原文ἕτερός只说“另一位”，语境强烈暗示上帝，却未明说；正文不应消除这种含蓄。
- issue: 肉身纯洁与恩赐
  choice: 表明节制能力由“另一位”赐予
  alternative: 将节制仅表述为个人修养
  rationale: 原文明示纯洁者不可自夸，因为其ἐγκράτεια是被供给的；译文保留恩赐与个人责任并存的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉体，以连续的“要／不可”呈现原文第三人称命令式。保留“上帝”“肉身”“作见证”“节制”等具有早期基督教语境的词汇，但避免生硬直译。
