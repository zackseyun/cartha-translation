  to: 强者要照顾弱者，弱者也要敬重强者。富足的人要供给贫穷的人，贫穷的人要感谢上帝，因为上帝赐给他一个人，使他的缺乏可以借着这人得到补足。智慧人不要用言语，而要用善行显明自己的智慧。谦卑的人不要为自己作见证，却要让别人为他作见证。那在肉身上保持纯洁的人不可夸口[a]，因为他知道，赐给他节制能力的是另一位[b]。
  rationale: 本次仅作安全的语义澄清与文体微调：以“借着这人”明确阳性关系代词的所指，并以更自然的汉语泛称表达原文的群体性劝勉。其余句法、神学含蓄和脚注锚点均予保留。
