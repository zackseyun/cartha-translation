base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/004.yaml
  text: Therefore, having all these things from him, we ought in every way to give thanks to him, to whom be the glory forever and ever. Amen.
translation:
  language: zh_hans
  text: 所以，我们既从他得着这一切，就应当在各方面感谢他。愿荣耀归于他，直到永永远远。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα οὖν πάντα
  choice: 所以……这一切
  rationale: οὖν承接上文并引出结论，译作“所以”自然清楚；ταῦτα πάντα译作“这一切”，保留其概括性。
- source_word: ἐξ αὐτοῦ ἔχοντες
  choice: 既然从他领受了
  rationale: 原文直义为“从他有/得着”；在此指一切皆源于他，“领受”符合现代汉语宗教语境，又未额外限定所领受之物的性质。
- source_word: κατὰ πάντα εὐχαριστεῖν αὐτῷ
  choice: 凡事感谢他
  rationale: κατὰ πάντα可表示“在一切方面/凡事”；“凡事感谢他”简洁自然，并保留范围的广泛性。
- source_word: ᾧ ἡ δόξα
  choice: 愿荣耀归给他
  rationale: 原文为省略动词的颂赞句。汉语用“愿……归给……”补足语气，忠实表达颂荣含义。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是表达无尽久远的惯用希腊语，译为庄重且通行的“直到永永远远”。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代汉语基督教文献中通行的音译。
theological_decisions:
- issue: “他”的指称
  choice: 保留代词“他”
  alternative: 明确译为“上帝”
  rationale: 原文仅用αὐτός及关系代词ᾧ，指称依赖上下文；不在本节擅自明确所指，以保留原文的衔接与含蓄。
- issue: 颂荣句的语气
  choice: 译作祈愿式“愿荣耀归给他”
  alternative: 陈述式“荣耀归给他”
  rationale: 原文省略系词，既可视为颂赞宣告，也可按祈愿式理解；汉语颂荣惯用“愿……归给……”，同时不改变荣耀归属的核心意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“领受”“荣耀”“阿们”保留早期基督教文献的礼仪与颂赞色彩；句式简洁，不增加原文未明说的神学限定。
