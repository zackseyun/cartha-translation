  text: ἀναλογισώμεθα οὖν, ἀδελφοί, ἐκ ποίας ὕλης ἐγενήθημεν, ποῖοι καὶ τίνες εἰσῆλθομεν εἰς τὸν κόσμον, ἐκ ποίου τάφου καὶ σκότους ὁ πλάσας ἡμᾶς καὶ δημιουργήσας εἰσήγαγεν εἰς τὸν κόσμον αὐτοῦ, προετοιμάσας τὰς εὐεργεσίας αὐτοῦ, πρὶν ἡμᾶς γεννηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/003.yaml
  text: Let us therefore consider[a], brothers, from what material we came to be, what kind of people and what sort we were when we entered into the world, from what grave and darkness the one who formed us and created us brought us into his world[b], having prepared his benefits before we were born.
translation:
  language: zh_hans
  text: 所以，弟兄们，让我们想一想：我们是由什么材料造出来的；我们进入世界时，是怎样的人、又是谁；那位塑造并创造我们的，曾从怎样的坟墓和黑暗中把我们带进他的世界，并且在我们出生以前就预备了他的恩惠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλογισώμεθα
  choice: 我们要思想
  rationale: 表达第一人称复数劝勉语气，并保留“认真思量、反省”的含义。
- source_word: ἐκ ποίας ὕλης ἐγενήθημεν
  choice: 我们是用什么材料造出来的
  rationale: ὕλη指构成某物的材料；用“材料”保留原文具体而谦卑的受造意象。
- source_word: ποῖοι καὶ τίνες
  choice: 是怎样、是什么样的人
  rationale: 保留两个疑问词形成的双重追问，同时采用现代汉语较自然的表达，不武断地区分为本质与身份。
- source_word: τάφου καὶ σκότους
  choice: 坟墓和黑暗
  rationale: 直译两个强烈意象，不将“坟墓”解释性改写为母腹、死亡或虚无。
- source_word: ὁ πλάσας ἡμᾶς καὶ δημιουργήσας
  choice: 那塑造并创造我们的主
  rationale: 分别体现πλάσσω的塑造意象和δημιουργέω的创造含义；汉语补出“主”使名词化分词所指自然清楚，但不增加具体位格判断。
- source_word: εὐεργεσίας
  choice: 恩惠
  rationale: 该词指施予人的益处、善惠或恩泽；“恩惠”比“礼物”更能保留施惠者所行善益的语感。
- source_word: προετοιμάσας
  choice: 已经预备了
  rationale: “预备”体现事先安排，“已经”配合出生以前，清楚传达先时关系。
theological_decisions:
- issue: “坟墓和黑暗”的所指
  choice: 保留原有比喻，不加解释
  alternative: 明确译成母腹、死亡状态或未受造状态
  rationale: 本句本身没有限定该意象的唯一指向；解释性翻译会消除原文张力。
- issue: 创造者的称谓
  choice: 译作“那塑造并创造我们的主”
  alternative: 明确译作“上帝”或“基督”
  rationale: 希腊文使用带冠词的分词短语而未在本句明说专名；避免加入超出本句的位格界定。
- issue: 人的起源与进入世界
  choice: 保留“造出来”“进入这世界”的并列表达
  alternative: 将整句系统化为某一种灵魂先存论、胚胎论或创造论表述
  rationale: 原文以修辞性追问强调人的卑微和创造者的恩惠，并未详述起源机制。
translation_notes:
  register: 采用庄重而通顺的现代标准书面汉语。“所以，弟兄们，我们要思想”保留劝勉口吻；分号呈现原文连续的三重思考内容。避免古奥措辞，也不把含混的受造与出生意象作教义化解释。
