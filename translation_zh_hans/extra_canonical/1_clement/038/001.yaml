  text: Συνξέσϑω οὖν ἡμῶν ὅλον τὸ σῶμα ἐν Χριστῷ Ἰησοῦ, καὶ ὑποτασσέσϑω ἕκαστος τῷ πλησίον αὐτοῦ, καϑὼς ἐτέϑη ἐν τῷ χαρίσματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/001.yaml
  text: Therefore let our whole body be preserved in Messiah Jesus, and let each one be subject to his neighbor, just as he was appointed in his gift.
translation:
  language: zh_hans
  text: 所以，愿我们的整个身体在基督耶稣里得蒙保全[a]；愿各人都顺服自己的邻舍，正如各人是在自己的恩赐中被安置的那样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得蒙保全”也可译作“得救”。所给希腊文本开头的 Συνξέσϑω 是 OCR 讹误；通行校订文本作 σωζέσθω。
    reason: 说明关键动词的文本校订及其“得救／保全”的语义范围。
  - marker: b
    text: 较直译：“正如他被安置在他的恩赐中那样。”原文没有明说所安排的具体位置、职分或安排者。
    reason: 保留 καθὼς ἐτέθη ἐν τῷ χαρίσματι αὐτοῦ 的比较结构、被动语态和语义含混性，避免增添“位置”等具体含义。
lexical_decisions:
- source_word: σωζέσθω（所给文本的 Συνξέσϑω 是 OCR 讹误）
  choice: 愿……得蒙保全
  rationale: σῴζω 在此可表示“拯救、保全、保存”。中间/被动命令式以“愿……得蒙保全”表达劝勉语气，并与已有的源文本校勘结论一致。
- source_word: ὅλον τὸ σῶμα
  choice: 我们整个身体
  rationale: 保留身体隐喻及 ἡμῶν 的群体归属，不将其解释性改写为“整个群体”或“教会”。
- source_word: ὑποτασσέσϑω
  choice: 愿……顺服
  rationale: 准确表达 ὑποτάσσω 的服从、置于其下之义，同时保留第三人称命令式的劝勉色彩。
- source_word: τῷ πλησίον αὐτοῦ
  choice: 自己的邻舍
  rationale: πλησίον 指身边的人、邻舍；“自己的”自然表达 αὐτοῦ 与各人的对应关系，并非强化为希腊语反身代词。
- source_word: χάρισμα
  choice: 所得恩赐
  rationale: 译作“恩赐”保留其由恩典赐予的宗教语义；补入“所得”使现代汉语通顺，但不扩大原义。
- source_word: καϑὼς ἐτέϑη
  choice: 照着……被安排的位置
  rationale: ἐτέθη 字面为“被安置、被安排”。加入“位置”显明汉语中隐含的安置结果，同时避免译成更强的制度性“任命”。
theological_decisions:
- issue: “身体”是实体身体还是群体隐喻
  choice: 保留“整个身体”，不在正文中解释
  alternative: 译为“整个群体”或“教会全体”
  rationale: 上下文可能借身体说明群体秩序，但原文仍使用 σῶμα；直保留可避免消除隐喻及其神学张力。
- issue: σωζέσθω 的语义
  choice: 译为“得蒙保全”
  alternative: 译为“得救”
  rationale: “得救”可能使读者只想到终末或属灵救恩；“得蒙保全”更适合身体与群体秩序的语境，同时脚注保留另一可能。
- issue: ἐτέθη ἐν τῷ χαρίσματι αὐτοῦ 所指的安排
  choice: 译作“在所得恩赐中被安排的位置”
  alternative: “照着他在自己的恩赐中被设立的情形”
  rationale: 原文没有明确说明安排者、职分或具体等级；正文保持被动表达，不把它具体化为神所任命的教会职务。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉体。“愿……；愿……”对应两个第三人称命令式，避免生硬的命令口吻。正文保留“身体”“邻舍”“恩赐”等原文核心意象和术语；仅在“被安排的位置”处作最低限度的汉语显化，并以脚注交代其直译与不确定性。
