  terminology: “纯良的人”恰当表达 ἄκακοι 的无恶、质朴无害之意。“行不法之事的人”可准确表达 παρανομοῦντες，且不把它缩窄为特定法律体系下的技术性“违法者”。“地上”及脚注妥善保留 γῆ 可指土地、地域或大地的开放范围。
