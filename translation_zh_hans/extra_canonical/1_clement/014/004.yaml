  text: γέγραπται γάρ· Χρηστοὶ ἔσονται οἰκήτορες γῆς, ἄκακοι δὲ ὑπολειφθήσονται ἐπ’ αὐτῆς· οἱ δὲ παρανομοῦντες ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/004.yaml
  text: 'For it is written: “The upright will inhabit the land[a], and the innocent will be left upon it; but those who act lawlessly will be destroyed from it.”'
translation:
  language: zh_hans
  text: 因为经上记着：“良善的人必居住在地上[a]，纯良的人必留在其上；行不法之事的人却必从地上被剪除。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地”也可译作“大地”或“土地”。
    reason: 希腊词γῆ依语境可指土地、某一地域或大地；原文在此保有一定歧义。
lexical_decisions:
- source_word: χρηστοί
  choice: 正直的人
  rationale: 该词可表示良善、有德；在这句智慧文学式的义人与恶人对比中，“正直的人”自然庄重，也与后面的“行不法之事的人”形成清楚对照。
- source_word: ἄκακοι
  choice: 纯良的人
  rationale: 原词指无恶、无害、无诡诈的人；“纯良”比偏司法含义的“无辜”更能保留其品格层面的意义。
- source_word: παρανομοῦντες
  choice: 行不法之事的人
  rationale: 保留现在分词所表达的行为特征，并直接反映其违反律法、行事不法的含义。
- source_word: ἐξολεθρευθήσονται
  choice: 必被除灭
  rationale: 该动词表示彻底毁灭、剪除；结合ἀπό所表达的从某处移除，“从其上被除灭”兼顾毁灭与清除的意味。
- source_word: γῆς
  choice: 地
  rationale: γῆ可指土地、地域或大地；此处沿用智慧文学中“居住在地上”的自然表达，同时以脚注保留范围上的歧义。
theological_decisions:
- issue: γῆ所指是应许之地、一般土地，还是大地
  choice: 正文译作“地”，不限定为某一特定地域
  alternative: 大地；那地
  rationale: 原文自身未明确限定其范围；采用“地”可保留这一开放性，避免把经句过早解释为特定土地应许或普世末世图景。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留引文的箴言式对仗，并以“必……却必……”呈现其鲜明对比。
