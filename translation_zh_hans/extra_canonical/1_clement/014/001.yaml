id: 1CLEM.14.1
reference: 1 Clement 14:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: Δίκαιον οὖν καὶ ὅσιον, ἄνδρες ἀδελφοί, ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ ἢ τοῖς ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ μυσεροῦ ζήλους ἀρχηγοῖς ἐξακολουθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/001.yaml
  text: It is right, then, and holy, brothers, for us to become obedient to God rather than to follow those who, in arrogance and disorder, are the instigators of hateful jealousy.
translation:
  language: zh_hans
  text: 所以，弟兄们，我们更应当顺服上帝，而不是追随那些在傲慢和混乱中煽起可憎嫉妒的人[a]；这样做才是正当而圣洁的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在可憎的嫉妒中带头的人”。
    reason: ἀρχηγός 既可指发起者、肇始者，也可指首领或带头者；其与属格 μυσεροῦ ζήλους 的关系存在译法差异。
lexical_decisions:
- source_word: Δίκαιον οὖν καὶ ὅσιον
  choice: 所以……才是正当而圣洁的
  rationale: 保留 οὖν 的承接推论作用，并以自然汉语句式表达两个并列的伦理判断；“圣洁”对应 ὅσιον 在此处合乎敬虔、神圣规范的含义。
- source_word: ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ
  choice: 我们更应当顺服上帝
  rationale: ὑπήκοος 与与格 τῷ θεῷ 表示对上帝服从；μᾶλλον…ἢ 构成“宁可／更要……而不……”的比较选择。
- source_word: ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ
  choice: 在傲慢和混乱中
  rationale: ἀλαζονεία 指自负、傲慢；ἀκαταστασία 可指动荡、失序或混乱。直译介词结构，以免武断限定它只修饰嫉妒的发起方式或人物的一般状态。
- source_word: μυσεροῦ ζήλους
  choice: 可憎的嫉妒
  rationale: μυσερός 表示可憎、令人厌恶；ζῆλος 在本段负面语境中指嫉妒或争竞热忱，此处采用简明的“嫉妒”。
- source_word: ἀρχηγοῖς
  choice: 煽起……的人
  rationale: ἀρχηγός 可指首领，也可指发起者、肇始者；与属格 μυσεροῦ ζήλους 连用时，“煽起可憎嫉妒的人”自然表达其作为始作或鼓动者的意义。
- source_word: ἐξακολουθεῖν
  choice: 追随
  rationale: 该动词表示跟从、尾随，常含持续跟随某人道路或行为的意味；“追随”符合此处劝诫语气。
theological_decisions:
- issue: 顺服上帝与追随作乱者之间的比较关系
  choice: 译为“更应当顺服上帝，而不是追随……”
  alternative: “顺服上帝，胜过追随……”
  rationale: 保留 μᾶλλον…ἢ 的比较和抉择力度，不把经文扩展成关于一切人间权威的系统性命题。
- issue: ἀρχηγός 与属格“嫉妒”的关系
  choice: 正文采用“煽起可憎嫉妒的人”
  alternative: “在可憎的嫉妒中带头的人”
  rationale: 前者更贴近“发起者、肇始者”的常见语义及属格所表示的关联，但以脚注保留“首领／带头者”的真实词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“弟兄们”对应 ἄνδρες ἀδελφοί，在古代共同体称呼中具有群体性；不另加现代性别说明，以避免正文膨胀。“这样做才是”调整希腊语判断句的位置，使中文逻辑清楚，同时未增加新的神学内容。
