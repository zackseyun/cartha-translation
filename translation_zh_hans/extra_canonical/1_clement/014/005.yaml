base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/005.yaml
  text: 'And again he says: “I saw the ungodly highly exalted and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not there, and I sought his place, and I did not find it. Keep innocence and observe uprightness, because there is a remnant for a peaceable man.”'
translation:
  language: zh_hans
  text: 他又说：“我看见恶人高高显赫，昂然挺立如黎巴嫩的香柏树；我经过时，看哪，他已不在了；我寻找他的所在，却没有找到。你要持守纯良，留心正直，因为平和的人必有余存[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “余存”所译的希腊词可指“留下来的事物”“剩余”或“余存”。在本句所引诗篇的传统中，也可理解为“后裔”或“未来”；因此本句也可译作：“因为平和的人有未来。”
    reason: 保留ἐγκατάλειμμα的基本“遗留／余存”义，并说明其在诗篇引文语境中可作后代或未来理解，避免正文无说明地固定为“后裔”。
lexical_decisions:
- source_word: ἀσεβῆ
  choice: 恶人
  rationale: 指不敬虔、违背正道的人；“恶人”符合所引诗篇在现代汉语中的自然表达。
- source_word: ὑπερυψούμενον καὶ ἐπαιρόμενον
  choice: 高高显赫，耸立
  rationale: 保留两个并列分词所表达的显达与高耸形象，同时使与香柏树的比喻自然衔接。
- source_word: φύλασσε ἀκακίαν
  choice: 持守纯良
  rationale: ἀκακία可指无恶、纯真或无害；“纯良”兼顾道德上的无恶与现代可读性。
- source_word: ἴδε εὐθύτητα
  choice: 留心正直
  rationale: ἴδε字面为“看”，在此是关注、察看正直之道；避免把它解释成单纯实行正直。
- source_word: ἐγκατάλειμμα
  choice: 后裔
  rationale: 该词字面可指留下之物、余存；在诗篇语境中可指人的未来延续或后代，但原词存在歧义，故加脚注说明。
- source_word: ἀνθρώπῳ εἰρηνικῷ
  choice: 和平的人
  rationale: 直译其与和平相契、促成和平的品格，不额外限定为某种宗派性的“使人和睦者”概念。
theological_decisions:
- issue: ἐγκατάλειμμα所指为何
  choice: 正文译作“后裔”，并以脚注保留“未来／余存”的可能
  alternative: “和平的人有未来”或“和平的人必有余存”
  rationale: 引文对应诗篇37:37一类文本传统，该词可被理解为留下来的后代，也可广义指结局、未来或余存。正文选择自然且有古代文本依据的“后裔”，但不应消除词义张力。
- issue: 命令语气的伦理对象
  choice: 译为“持守纯良，留心正直”
  alternative: “保持无辜，观看正直”
  rationale: 既保留两个命令，也不把“正直”擅自人格化或教义化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引文保留“看哪”的经文语体，但避免过度古雅；整体尽量贴近希腊文的并列结构和意象。
