  rationale: 修订仅提升στάσεις及末尾‘善’语组的语义准确性和现代汉语自然度。仍按所给πίπτουσιν译为这些人自己‘陷入’争竞和分裂，未增添‘把我们拖入’的宾语；‘以致’继续保留εἰς τό不定式可带目的或结果的开放性。
