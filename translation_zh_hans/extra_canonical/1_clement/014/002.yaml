source:
  edition: Funk 1901 (normalized OCR)
  text: βλάβην γὰρ οὐ τὴν τυχοῦσαν, μᾶλλον δὲ κίνδυνον ὑποίσομεν μέγαν, ἐὰν ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς τοῖς θελήμασιν τῶν ἀνθρώπων, οἵτινες ἔχουσιν πίπτουσιν εἰς ἔριν καὶ στάσεις, εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/002.yaml
  text: For we will incur no ordinary harm[a], but rather great danger, if we recklessly hand ourselves over to the desires of men who fall into strife and factions, so as to estrange us from what is good.
translation:
  language: zh_hans
  text: 因为，如果我们贸然把自己交给那些陷入争竞和分裂之人的意愿，以致他们使我们与那美好的事疏远，我们所要遭受的就不是一般的损害，而是极大的危险。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλάβην ... οὐ τὴν τυχοῦσαν
  choice: 不是一般的损害
  rationale: τὴν τυχοῦσαν 在否定结构中表示“寻常的、微不足道的”；译为“不是一般的损害”自然保留强调。
- source_word: κίνδυνον ὑποίσομεν μέγαν
  choice: 我们所要遭受的……是极大的危险
  rationale: ὑποίσομεν 有承受、招致之意；中文以“遭受……危险”表达其语义，并保留将损害递进为重大危险的对照。
- source_word: ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς
  choice: 我们贸然任凭自己……摆布
  rationale: ῥιψοκινδύνως 表示轻率冒险；ἐπιδῶμεν ἑαυτούς 表示把自己交付出去。“任凭自己受……摆布”符合现代汉语且显出主动屈从。
- source_word: τοῖς θελήμασιν τῶν ἀνθρώπων
  choice: 那些……之人的意愿
  rationale: θελήματα 可指意愿、欲求；“意愿”不额外赋予善恶性质，并与英文审校层的 desires 保持语义对应。
- source_word: πίπτουσιν εἰς ἔριν καὶ στάσεις
  choice: 陷入争竞和结党
  rationale: 按所给文本 πίπτουσιν 的不及物含义直译为“陷入”，不增添“把我们拖入”的宾语。ἔρις 是争斗、争竞；στάσεις 在群体语境中指派系纷争，译作“结党”。
- source_word: ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος
  choice: 使我们与美善疏远
  rationale: ἀπαλλοτριόω 表示使疏离、隔绝；τοῦ καλοῦ ἔχοντος 的文本形式较不寻常，核心仍指“美善之事/美善”，故不强行具体化。
theological_decisions:
- issue: τοῦ καλοῦ ἔχοντος 所指为何
  choice: 美善
  alternative: 那美好的事／持守美善者
  rationale: 该短语在所给文本中语法异常，可能涉及文本传抄或校勘问题。正文采用中性的“美善”，既通顺，也不把它限定为某项善行、某个人或特定神学概念。
- issue: εἰς τὸ ἀπαλλοτριῶσαι 的目的或结果色彩
  choice: 以致他们使我们……疏远
  alternative: 为要使我们……疏远
  rationale: εἰς τό 加不定式可表达趋向、目的或结果。“以致”保留其目的—结果之间的张力，避免断言这些人的明确主观企图。
translation_notes:
  register: 采用庄重而现代的书面普通话；句式调整为“如果……，所要遭受的……”以清楚呈现条件与递进对照。未设置脚注，因为正文已按所给希腊文本准确表达“不及物地陷入争竞和结党”，无需保留已被审校否定的旧异译。
