  text: Let us be kind to one another according to the compassion and gentleness of the One who made us[a].
translation:
  language: zh_hans
  text: 让我们照着创造我们的那一位的怜悯和温柔，彼此善待。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼此”原文按字面也可译作“我们自己”；复数反身代词在此类语境中可带有相互的意思。
    reason: 保留ἑαυτοῖς形式上的反身歧义，同时说明正文采用相互义的依据。
lexical_decisions:
- source_word: χρηστευσώμεθα
  choice: 我们要……以恩慈相待
  rationale: 该词为劝勉语气，表示主动善待、施以恩慈；译法自然表达共同体中的伦理劝勉。
- source_word: ἑαυτοῖς
  choice: 彼此
  rationale: 复数反身代词在希腊语中可有相互义；结合本段劝勉群体和睦的语境，指彼此相待，而非现代意义上的自我关怀。
- source_word: κατὰ
  choice: 效法……所显的
  rationale: 此处表示行为所依循的准则或典范；意译为“效法……所显的”，比机械译作“按照”更符合现代汉语。
- source_word: εὐσπλαγχνίαν
  choice: 怜悯
  rationale: 表达由衷的慈悲和体恤，译作“怜悯”庄重且易懂。
- source_word: γλυκύτητα
  choice: 温柔
  rationale: 本义涉及柔和、温良；在品格语境中译作“温柔”自然。
- source_word: τοῦ ποιήσαντος ἡμᾶς
  choice: 那位创造我们的主
  rationale: 分词结构直指创造我们的那一位，即上帝；“主”使中文指称自然，但由脚注说明原文仅作描述。
theological_decisions:
- issue: ἑαυτοῖς应理解为反身义还是相互义
  choice: 彼此
  alternative: 我们自己／对自己
  rationale: 希腊语复数反身代词常承载相互意义，而《革利免一书》此处的群体和睦语境支持相互义；脚注保留形式上可能的反身读法。
- issue: 是否明确补出“主”或“上帝”
  choice: 正文采用“那位创造我们的主”
  alternative: 那位创造我们的
  rationale: 原文用冠词化分词描述创造者，并未出现“主”或“上帝”这一名词。正文补“主”使汉语完整庄重，脚注交代较严格的直译，避免掩盖原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“以恩慈相待”传达主动善待之意；“怜悯与温柔”保留原文并列的品格词。
