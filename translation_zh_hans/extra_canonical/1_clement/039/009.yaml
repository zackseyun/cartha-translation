- from: 愿他们的儿子远离平安；愿他们在城门口被卑微人压碎[a]，无人搭救。因为你为他们所预备的，义人必吃；他们自己却不能脱离祸患。
  to: 愿他们的儿子远离安稳；愿他们在比他们卑微之人的门前受辱，无人搭救。因为他们所预备的，义人必吃；他们自己却不能从祸患中获救。
  rationale: 根据该处作为《约伯记》5:4–5 引文的已知文本，校正 OCR 造成的人称和句法错误，将“他们所预备的”置入正文。并将 κολαβρισθείησαν 译为“受辱”，避免无依据地强化为“压碎”；将 ἡσσόνων 的比较意义明确译出。原脚注只是在保留已纠正的 OCR 讹读，且锚点错位，故删除。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:25:15Z'
review_pass:
  verdict: revise
  source_fidelity: 应按《约伯记》5:4–5 所引的校勘文本处理此处明显的 OCR 讹误：应为“ἐκεῖνοι ἡτοίμασαν”（他们所预备的），而非所给 OCR 的“ἐκείνοις ἡτοίμασας”（你为他们所预备的）。此外，κολαβρισθείησαν 指受凌辱、虐待或羞辱，并非确指“压碎”。ἡσσόνων 是比较意义，即“比他们卑微/低微的人”。
  naturalness: 修订后保留祈愿式的庄重语气，采用现代书面汉语；“在比他们卑微之人的门前受辱”既自然，也保留原文的比较关系和公共羞辱场景。
  terminology: σωτηρίας 在此灾祸语境中译为“安稳”较贴切；ἐξαιρούμενος / ἐξαίρετοι 分别译为“搭救者”和“获救”，清楚保留同词根的救援含义；κακῶν 译为“祸患”。
  issues:
  - severity: high
    issue: 正文将讹误的 OCR 读法译作“你为他们所预备的”。
    rationale: 引文对应《约伯记》5:5，校勘读法为“他们所预备的”；审校记录也已明确确认该处所给希腊语为 OCR 错误。正文不应保留会破坏引文意义的讹读。
  - severity: medium
    issue: “被卑微人压碎”过度限定 κολαβρισθείησαν，且遗漏 ἡσσόνων 的比较含义。
    rationale: 该动词的核心是遭受羞辱、虐待或侮辱，未必是物理性“压碎”；ἡσσόνων 应表达为“比他们卑微之人”等比较结构。
  - severity: medium
    issue: 脚注锚点置于“压碎”之后，脚注内容却讨论下一分句的异文。
    rationale: 脚注锚点必须紧随其所说明的“他们所预备的”分句；但由于正文采用校勘后文本且无需在本短段保留该已解决的 OCR 问题，删除该脚注最清楚。
