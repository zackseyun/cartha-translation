source:
  edition: Funk 1901 (normalized OCR)
  text: πρόγένοιντο οἱ υἱοὶ αὐτῶν ἀπὸ σωτηρίας· κολαβρισθείησαν ἐπὶ θύραις ἡσόνων, καὶ οὐκ ἔσται ὁ ἐξαιρούμενος· ἃ γὰρ ἐκείνοις ἡτοίμασας, δίκαιοι ἕδονται, αὐτοὶ δὲ ἐκ κακῶν οὐκ ἐξαίρετοι ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/009.yaml
  text: May their sons be far from safety; may they be crushed at the gates by the lowly[a], and there will be no one to rescue them. For what you prepared for them, the righteous will eat, but they themselves will not be delivered from evils.
translation:
  language: zh_hans
  text: 愿他们的儿子远离安稳；愿他们在比他们卑微之人的门前受辱，无人搭救。因为他们所预备的，义人必吃；他们自己却不能从祸患中获救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρίας
  choice: 平安
  rationale: 此处表示安全、安稳的处境；“远离平安”既保留原文抽象表达，也符合《约伯记》引文语境。
- source_word: κολαβρισθείησαν
  choice: 被……压碎
  rationale: 该词形在传本文本中较罕见，语境指遭击溃、压碎；采用具象而有力度的译法。
- source_word: ἐπὶ θύραις
  choice: 在城门口
  rationale: 古代城门是公共活动和审判之处；中文补出“城”以清楚传达语境。
- source_word: ἡσόνων
  choice: 卑微人
  rationale: 按所给文本理解为地位较低、较弱小的人；避免译成带固定阶级意味的称谓。
- source_word: ἐξαιρούμενος / ἐξαίρετοι
  choice: 搭救 / 脱离
  rationale: 同一词根依句法分别自然译出施行拯救和从灾祸中获救的意义。
- source_word: κακῶν
  choice: 祸患
  rationale: 复数可泛指灾祸、苦难或恶事；“祸患”最贴合当前惩罚语境，同时不作过度神学化解释。
theological_decisions:
- issue: ἃ γὰρ ἐκείνοις ἡτοίμασας 的主语与受词
  choice: 因为你为他们所预备的
  alternative: 因为他们所预备的
  rationale: 所给希腊文本明确是第二人称单数 ἡτοίμασας，并有间接受词 ἐκείνοις，因此正文忠实保留“你为他们所预备的”。但《约伯记》5:5 的其他文本传统可支持“他们所预备的”，故以脚注说明异文，避免静默校改所给底本。
- issue: 惩罚语言的施行者
  choice: 保留被动式，不补明上帝或其他施行者
  alternative: 愿上帝使他们被压碎
  rationale: 原文使用被动语态，未明说施行者；译文不把神学推断写入正文。
translation_notes:
  register: 采用庄重、清晰的现代书面汉语，保留祈愿式和诗性平行结构。正文严格依据所给希腊文本，同时用脚注呈现《约伯记》引文的关键文本异读。
