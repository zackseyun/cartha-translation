  yaml_path: translation/extra_canonical/1_clement/039/008.yaml
  text: But I have seen fools taking root, yet immediately their dwelling was consumed.
translation:
  language: zh_hans
  text: 但我曾见愚妄人扎下根来，他们的居所却立刻被吞灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονας
  choice: 愚妄人
  rationale: 既表达缺乏智慧和判断，也保持古代智慧文学中较庄重的语气。
- source_word: ῥίζας βάλλοντας
  choice: 扎下根来
  rationale: 保留原文“生根”的意象，同时符合现代汉语习惯。
- source_word: δίαιτα
  choice: 居所
  rationale: 该词在此处可指生活所在之处；结合其所引《约伯记》传统及英语审校层，译作“居所”较贴切，同时不扩展为抽象的“生活方式”。
- source_word: ἐβρώθη
  choice: 被吞灭
  rationale: 原义带有“被吃掉、吞噬”的被动意象；“被吞灭”既保留该形象，也自然表达彻底毁灭。
theological_decisions:
- issue: 毁灭对象与方式
  choice: 他们的居所却立刻被吞灭
  alternative: 他们的生活立刻被吞噬
  rationale: δίαιτα存在一定语义幅度；正文采用语境上更具体的“居所”，但不说明毁灭者是谁，以保留原文被动式的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“但……却……”自然呈现δὲ与ἀλλά的转折层次；不添加原文未明说的施事者。
