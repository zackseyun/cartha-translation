  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: οὐρανοὺς δὲ οὐχὶ καθαρὴς ἐνώπιον αὐτοῦ· ἐὰ δὲ, οἱ κατοικοῦντες οἰκίας πηλίνας, ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν. ἔπαισεν αὐτοὺς σητὸς τρόπον, καὶ ἀπὸ πρωΐθεν ἕως ἑσπέρας οὐκ ἔτι εἰσίν· παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι ἀπώλοντο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/005.yaml
  text: Even the heavens are not clean before him; how much less those who dwell in houses of clay[a], from the same clay of which we ourselves also are made. He struck them like a moth, and from morning until evening they are no more; because they are unable to help themselves, they perished.
translation:
  language: zh_hans
  text: 连诸天在他面前也不洁净，何况那些住在泥土房屋里的人[a]；我们自己也是用同样的泥土造成的。他像衣蛾一样击打他们；从早晨到晚上，他们便不复存在。他们因无力自救而灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可按较贴近原文关系从句的方式理解为：“何况那些住在泥土房屋里的人；我们自己也同样出自构成这些房屋的泥土。”
    reason: 希腊文 ἐξ ὧν 后又有“出自同一泥土”的重复性表达；关系代词的衔接对象在汉语中不宜机械照搬。正文以自然汉语保留人住在泥土房屋中、人与其同出于泥土的意象。
lexical_decisions:
- source_word: οὐρανοὺς
  choice: 诸天
  rationale: 保留希腊文复数形式，也符合庄重的经文语体。
- source_word: οἰκίας πηλίνας
  choice: 泥土房屋
  rationale: 直译其意象，所指是人脆弱、属土的身体或居所，但正文不把隐喻明确化。
- source_word: σητὸς τρόπον
  choice: 像击打一只蛀虫那样
  rationale: σής 指蛀虫或衣蛾；保留原文较突兀的明喻及动词与宾语之间的张力。
- source_word: παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι
  choice: 因无力自救
  rationale: 自然表达原因关系，并准确传达不能帮助自己的含义。
- source_word: ἀπώλοντο
  choice: 灭亡
  rationale: 表达彻底毁灭或消逝，语体庄重而不过度神学化。
theological_decisions:
- issue: 泥土房屋的所指
  choice: 保留“泥土房屋”的比喻
  alternative: 译作“泥土造成的身体”
  rationale: 原文说的是房屋，虽隐喻肉身，但不宜在正文中消解其意象。
- issue: 击打者的主语
  choice: 译作“他”
  alternative: 改为“蛀虫击打他们”或使用无主句
  rationale: 希腊文ἔπαισεν为第三人称单数，近处最自然的指向是上帝；仍以代词呈现，不额外解释。
- issue: 诸天“不洁净”
  choice: 不洁净
  alternative: 不纯洁／算不得洁净
  rationale: 保留洁净范畴及其神学张力，不把它改释为道德败坏或受造缺陷。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“诸天”“泥土房屋”“从早晨到晚上”等原文意象；对原文略显突兀的“像蛀虫一样击打”不作顺滑化改写，以免消除文本张力。
