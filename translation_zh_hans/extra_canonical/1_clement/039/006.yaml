  yaml_path: translation/extra_canonical/1_clement/039/006.yaml
  text: He breathed on them, and they died because they lacked wisdom.
translation:
  language: zh_hans
  text: 他向他们吹气，他们因缺乏智慧而死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεφύσησεν αὐτοῖς
  choice: 他向他们吹了一口气
  rationale: ἐμφυσάω表示向某人吹气；此处采用自然的现代汉语表达，同时保留动作及其对象。
- source_word: ἐτελεύτησαν
  choice: 他们就……死了
  rationale: τελευτάω在此表示死亡；“就”自然地呈现前后事件的承接关系，但不额外界定其因果机制。
- source_word: παρὰ τὸ μὴ ἔχειν αὐτοὺς σοφίαν
  choice: 因没有智慧
  rationale: παρά加冠词化不定式在此表达原因；直译为“因为他们没有智慧”，压缩为“因没有智慧”更流畅且不损失意义。
theological_decisions:
- issue: 吹气者的身份
  choice: 保留代词“他”
  alternative: 明确写作“上帝”或其他身份
  rationale: 本节希腊文本仅用动词第三人称单数隐含主语；不在本句中补入原文未明说的身份。
- issue: 吹气与死亡之间的关系
  choice: 以“就”表达叙事承接，以“因”只连接死亡与缺少智慧
  alternative: 译成“他一吹气，他们便因而死亡”
  rationale: 原文明确用παρὰ τὸ说明缺少智慧是死亡的原因；不把吹气与死亡之间进一步解释成原文没有明说的神学机制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“吹了一口气”比生硬的“吹气于他们”更符合普通读者习惯；句式简洁，保留原文的因果结构与主语含蓄性。
