  yaml_path: translation/extra_canonical/1_clement/039/001.yaml
  text: Foolish and senseless and stupid and untaught men mock us and sneer at us, wanting to exalt themselves in their own thoughts.
translation:
  language: zh_hans
  text: 那些愚昧、无知、愚蠢、没有受过教育的人嘲笑我们，讥讽我们，想要在自己的心思意念中自高。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονες
  choice: 愚昧
  rationale: 表示缺乏明智与判断力，与后续近义词并列时保留其独立语义。
- source_word: ἀσύνετοι
  choice: 无知
  rationale: 侧重缺乏理解和悟性；用现代汉语中自然的表达呈现。
- source_word: μωροί
  choice: 愚蠢
  rationale: 保留原文较强、直接的贬义，并与“愚昧”形成近义叠加。
- source_word: ἀπαίδευτοι
  choice: 未受教化
  rationale: 原词指未经教育、训练或教养；“未受教化”既保留被动含义，也适合庄重文体。
- source_word: χλευάζουσιν
  choice: 嘲笑
  rationale: 准确表达以言语戏弄、奚落之意。
- source_word: μυκτηρίζουσιν
  choice: 讥讽
  rationale: 表达轻蔑地嗤笑、嘲弄，与“嘲笑”并列而不完全重复。
- source_word: ταῖς διανοίαις αὐτῶν
  choice: 凭自己的心思
  rationale: 与βουλόμενοι ἐπαίρεσθαι连读，理解为他们借着或在自己的思想意念中自高；“心思”保留内在思想层面的含义。
theological_decisions:
- issue: ἐπαίρεσθαι与ταῖς διανοίαις αὐτῶν的关系
  choice: 想要凭自己的心思抬高自己
  alternative: 想要在自己的意念中自高
  rationale: 希腊语与格短语可表达领域或凭借，语义略有开放性；正文采用自然且不作过度限定的“凭自己的心思”，同时保留自我抬高的核心含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文四个贬义形容词和两个嘲弄动词的累积修辞，不为追求简练而合并；无脚注标记。
