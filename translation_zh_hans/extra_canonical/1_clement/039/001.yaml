    issue: “未受教化”对ἀπαίδευτοι的表达偏移。
    rationale: 该词通常指未受教育、训练或缺乏学养；“教化”在现代汉语可指文明化或道德感化，范围较原文宽且色彩不同。
  - severity: medium
    issue: “凭自己的心思”将ταῖς διανοίαις αὐτῶν明确处理为工具性。
    rationale: 此处与格可理解为领域/状态，即在自己的意念中自高；译作“凭”会较强地限定为借助心思作为手段。采用“在自己的心思意念中”能较好保留原文的开放性。
  revised_text: 那些愚昧、无知、愚蠢、没有受过教育的人嘲笑我们，讥讽我们，想要在自己的心思意念中自高。
