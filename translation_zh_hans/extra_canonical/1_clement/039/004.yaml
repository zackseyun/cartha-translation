revisions:
- from: 那么，凡人在主面前岂会洁净？人岂会因自己的行为而无可指责？既然他不信任自己的仆役[a]，又认为他的天使有某种偏差。
  to: 那么，凡人在主面前岂能洁净？人岂能因自己的行为而无可指责，若主尚且不信任自己的仆人[a]，又对自己的天使构想某种乖谬之事？
  rationale: 修订明确后半句主语为“主”，以免中文代词错误回指“人”；以“若”保留εἰ的条件性修辞；并将末一分句改为“对自己的天使构想某种乖谬之事”，更贴近κατὰ…σκολιόν τι ἐπενόησεν，同时不具体化该乖谬之事的性质。
