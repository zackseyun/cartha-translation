  text: Τί γάρ; μὴ καθαρὸς ἔσται βροτὸς ἐναντί κυρίου; ἢ ἀπὸ τῶν ἔργων αὐτοῦ ἄμεμπτος ἀνήρ, εἰ κατὰ παίδων αὐτοῦ οὐ πιστεύει, κατὰ δὲ ἀγγέλων αὐτοῦ σκολιὸν τι ἐπενόησεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/004.yaml
  text: What then? Shall a mortal be clean before the Lord? Or shall a man be blameless because of his works[a], if he does not trust his children, and has conceived something crooked against his angels?
translation:
  language: zh_hans
  text: 那么，凡人在主面前岂能洁净？人岂能因自己的行为而无可指责，若主尚且不信任自己的仆人[a]，又对自己的天使构想某种乖谬之事？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”或译“儿女”；希腊词παῖς可有这两种意思。
    reason: 保留παίδων的词义歧义；正文按《约伯记》4:18的引文语境采用“仆人”。
lexical_decisions:
- source_word: βροτός
  choice: 凡人
  rationale: 表达必死、脆弱的人类身份，同时保持庄重而自然的现代汉语。
- source_word: καθαρός
  choice: 洁净
  rationale: 保留原文在主面前纯洁、清白的宗教与道德语义。
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: 因自己的行为
  rationale: ἀπό在此表示依据或缘由；“行为”比单指具体“工作”更符合语境。
- source_word: ἄμεμπτος
  choice: 无可指责
  rationale: 准确表达不受责难、无可非议之意。
- source_word: παίδων
  choice: 仆役
  rationale: παῖς可指儿女或仆役；与随后“天使”构成从属者的平行关系，并呼应《约伯记》4:18的语境，因此正文采用“仆役”。
- source_word: σκολιόν τι ἐπενόησεν
  choice: 认为……有某种偏差
  rationale: 以自然汉语传达“察觉或认定某种歪曲、偏差”的意思，不把含混的缺陷具体化为某一种罪过。
theological_decisions:
- issue: 后半句动作的主语
  choice: 用“他”承接“主”，使后半句述说主不信任仆役并认为天使有偏差
  alternative: 把“他”理解为前句的“人”，即人不信任自己的仆役
  rationale: 与《约伯记》4:18的引文背景及由天上受造者推及凡人的论证相符；汉语仍保留代词形式，没有额外加入“主自己”等解释性措辞。
- issue: εἰ的逻辑关系
  choice: 译作“既然”
  alternative: 译作“如果”
  rationale: 此处所述是支持前面两个反问的理由，而非提出真正未定的条件；“既然”使汉语论证关系清楚，同时不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前两句保留原文反问语气；后半句避免过度解释“偏差”的具体性质，也不加入宗派性神学术语。
