  yaml_path: translation/extra_canonical/1_clement/039/002.yaml
  text: For what can a mortal do? Or what strength has one born of earth?
translation:
  language: zh_hans
  text: 因为凡人能做什么呢？土生的人又有什么力量呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θνητός
  choice: 凡人
  rationale: 指必死的人；“凡人”自然、凝练，也保留与神圣能力相对的意味。
- source_word: δύναται
  choice: 能做什么
  rationale: 此处绝对用法表示能力或所能成就之事；译作“能做什么”符合汉语反问表达。
- source_word: ἰσχύς
  choice: 力量
  rationale: 表示体力、能力或强力；“力量”保留原文较宽泛的含义。
- source_word: γηγενοῦς
  choice: 土生的人
  rationale: 字面意为“由土地所生者”；保留原文的土地意象及人源于尘土的可能联想，不直接释为其他神学用语。
theological_decisions:
- issue: γηγενοῦς是否明确译成人由尘土受造
  choice: 土生的人
  alternative: 出于尘土的人
  rationale: 原词本身是“由地而生”的诗性称谓；正文保留简洁意象，不把可能的创世背景扩写成明说的受造论陈述。
translation_notes:
  register: 采用庄重而自然的现代书面汉语，以两个平行反问句再现希腊文结构；“凡人”与“土生的人”形成对应，并保留原文对人之有限性的强调。
