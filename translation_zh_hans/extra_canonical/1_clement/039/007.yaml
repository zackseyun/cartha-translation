revisions:
- from: 你尽管呼求吧，看有没有谁回应你；看你能否见到哪一位圣天使。因为愤怒能杀死愚妄人，嫉妒能置迷途之人于死地。
  to: 你且呼求吧，看是否有人会回应你，或是否会见到任何一位圣天使；因为愤怒杀死愚妄人，嫉妒置迷失的人于死地。
  rationale: 删去无原文依据的“尽管”，并将首句调整为保留两个εἴ条件分句及其“或”关系的现代书面汉语。“是否会见到”不把“见到”解释为能力；末句保留原有的平行、庄重语体，并以“迷失的人”避免补出迷失的施事者。
