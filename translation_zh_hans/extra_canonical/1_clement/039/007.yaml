  text: ἐπικάλεσαι δέ, εἴ τις σοι ὑπακούσεται, ἢ εἴ τινα ἁγίων ἀγγέλων ὄψῃ· καὶ γὰρ ἄφρονα ἀναιρεῖ ὀργή, πεπλανημένον δὲ θανατοῖ ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/007.yaml
  text: But call out[a], if anyone will answer you, or if you will see any of the holy angels; for anger kills the foolish man, and jealousy puts the one gone astray to death.
translation:
  language: zh_hans
  text: 你且呼求吧，看是否有人会回应你，或是否会见到任何一位圣天使；因为愤怒杀死愚妄人，嫉妒置迷失的人于死地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικάλεσαι
  choice: 呼求
  rationale: 该词是命令式，指向某一对象呼喊、求告；“呼求”既保留求援意味，也符合庄重语体。
- source_word: ὑπακούσεται
  choice: 回应你
  rationale: 本义涉及听从、听应；在“呼求”的语境中译作“回应你”最自然，也准确表达是否有人听见并作出响应。
- source_word: ἁγίων ἀγγέλων
  choice: 圣天使
  rationale: 直接保留“圣洁的天使”之意；现代汉语中“圣天使”简洁自然。
- source_word: ὄψῃ
  choice: 能否见到
  rationale: 该形式在条件问句中表达是否会看见；用“能否见到”使连续的修辞性挑战在汉语中清楚自然，而不额外解释所见的方式。
- source_word: ἄφρονα
  choice: 愚妄人
  rationale: 不只指智力不足，更指缺乏判断、行事愚昧的人；“愚妄人”保留其道德与智慧层面的含义。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 该词可指热心、妒忌或嫉恨；在与“愤怒”并列且导致死亡的负面语境中，“嫉妒”最合适。
- source_word: πεπλανημένον
  choice: 迷途之人
  rationale: 完成时被动分词描述已经偏离正路、陷入迷误的人；“迷途之人”保留状态性，也不擅自判定其偏离的原因。
theological_decisions:
- issue: 是否把“圣天使”解释为可供祈求的对象
  choice: 仅译为“见到哪一位圣天使”
  alternative: 译成“向哪一位圣天使求告”或“求助于哪一位圣天使”
  rationale: 希腊文本明确使用“见到”，并未明说向天使祈求；为避免引入文本没有说明的天使论或祈祷实践，保留原文措辞。
- issue: “迷途之人”的主动或被动含义
  choice: 使用不明确施事者的“迷途之人”
  alternative: “被诱入歧途的人”或“自行走迷的人”
  rationale: πεπλανημένον在形式上是被动，但可表达进入迷误状态；原文没有指出是谁或什么使其迷失，因此中文不补出施事者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。首句将两个εἴ条件分句处理为连续的修辞性察问，以避免生硬直译，同时保留“呼求—回应”和“见到圣天使”的结构。末句维持两组平行关系：“愤怒—愚妄人—杀死”与“嫉妒—迷途之人—置于死地”。
