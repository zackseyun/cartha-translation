base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/003.yaml
  text: 'It is written: “There was no form before my eyes[a], but I heard only a breath and a voice.”'
translation:
  language: zh_hans
  text: 经上记着：“我眼前没有任何形状，只听见微风和声音。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是引述经文的固定表达；希腊文没有表示“因为”的连词，因此不增添因果连接。
- source_word: μορφή
  choice: 形状
  rationale: 保留其可见外形、形态的基本意义，不具体化为人物或物体。
- source_word: πρὸ ὀφθαλμῶν μου
  choice: 我眼前
  rationale: 自然对应“在我的眼睛前面”，符合现代汉语习惯。
- source_word: ἀλλʼ ἢ
  choice: 只
  rationale: 在否定句之后表示“除……之外没有”，即“唯有、只是”，而非转折性的“反而”。
- source_word: αὔραν
  choice: 微风
  rationale: 该词通常指轻风、微风；“气息”虽有可能，但在此处不宜无根据地改作更具解释性的译法。
- source_word: φωνὴν
  choice: 声音
  rationale: 保留宽泛含义，不擅自限定为说话声。
- source_word: ἤκουον
  choice: 听见
  rationale: 希腊文为未完成过去时，但汉语以“听见”自然表达过去的感知；上下文本身未要求突出持续过程。
theological_decisions:
- issue: 不可见的显现与所听之物的性质
  choice: 保留“没有任何形状”与“微风和声音”的并列张力
  alternative: 将其解释为“看不见神，只听见神的气息和话语”
  rationale: 原文没有明确指出形状、微风或声音属于谁，也未直接出现“神”或“话语”；译文不补入神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“经上记着”保持引经语体；句式简洁，并保留原文感知经验中的含混性。
