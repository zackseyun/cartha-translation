  text: Πᾶσα δόξα καὶ πλατυσμὸς ἐδόθη ὑμῖν καὶ ἐτελέσθη τὸ γεγραμμένον· Ἔφαγεν καὶ ἔπιεν, καὶ ἐπλατύνθη καὶ ἐπαχύνθη, καὶ ἀπελάκτισεν ὁ ἠγαπημένος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/001.yaml
  text: 'All glory and abundance were given to you, and what is written was fulfilled: “He ate and drank, and grew broad and fat, and the beloved one kicked.”'
translation:
  language: zh_hans
  text: 一切荣耀和丰裕都赐给了你们，经上所记的便应验了：“他吃了又喝，身躯渐宽，变得肥胖；那蒙爱的就踢蹬反抗了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话化用《申命记》32:15。原文的“那蒙爱的”是“踢蹬反抗了”的主语；“踢蹬”保留牲畜踢踹的比喻，并在此语境中含有反抗之意。
    reason: 标明引文背景，并说明句末称谓的原文句法及比喻性动作。
lexical_decisions:
- source_word: δόξα
  choice: 荣耀
  rationale: 保留该词表示尊荣、显赫的常见含义，并与后文因丰裕而骄纵的语境形成张力。
- source_word: πλατυσμός
  choice: 丰裕
  rationale: 此处指宽裕、富足，而不是单纯的身体宽阔；“丰裕”自然地表达蒙赐的优厚境况。
- source_word: ἐπλατύνθη καὶ ἐπαχύνθη
  choice: 长得肥壮
  rationale: 两个动词共同描写因饱足而身躯宽厚肥胖的牲畜意象；合译为“长得肥壮”既自然，又保留形象。
- source_word: ἀπελάκτισεν
  choice: 踢跳反抗
  rationale: 既保留牲畜踢跳的具体比喻，也传达其在引文语境中的悖逆含义，避免现代汉语中仅写“踢”所产生的动作对象不明。
- source_word: ὁ ἠγαπημένος
  choice: 他本是蒙爱的
  rationale: 将名词化分词按其被动意义译出，并保留原文称谓与前句主语之间略显突兀的张力。
theological_decisions:
- issue: ὁ ἠγαπημένος作为称谓的指向
  choice: 他本是蒙爱的
  alternative: 那蒙爱的踢跳反抗了
  rationale: 不把该称谓具体解释为以色列、雅各或某一神学群体；中文仅显明其与前述主语同指，同时保留“蒙爱却反抗”的张力。
- issue: 申命记32:15引文与现存七十士译本措辞的关系
  choice: 按本节所引希腊文本直译
  alternative: 依照通行申命记中文译文改写为“耶书仑渐渐肥胖，就踢跳”
  rationale: 本节文本使用ὁ ἠγαπημένος而非直接写Ἰακώβ或Ἰσραήλ，且措辞有其自身形态；不以熟悉的正典译文覆盖现有原文证据。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“踢跳反抗”维持过度喂养的牲畜以脚踢拒的比喻，同时让普通读者明白其反抗意味；正文中的[a]与脚注严格对应。
