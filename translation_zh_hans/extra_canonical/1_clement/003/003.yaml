  text: οὕτως ἐπηγέρθησαν οἱ ἄτιμοι ἐπὶ τοὺς ἐντίμους, οἱ ἄδοξοι ἐπὶ τοὺς ἐνδόξους, οἱ ἄφρονες ἐπὶ τοὺς φρονίμους, οἱ νέοι ἐπὶ τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/003.yaml
  text: So the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders.
translation:
  language: zh_hans
  text: 就这样，不受尊重的人起来反对受尊重的人；默默无闻的人反对有声望的人；愚昧的人反对明智的人；年轻人反对年长的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄτιμοι / ἐντίμους
  choice: 卑贱的人 / 尊贵的人
  rationale: 保留原文关于社会地位与所受尊重的鲜明对照；“卑贱”在此描述不受尊重的处境，并非译者对其人格价值的判定。
- source_word: ἄδοξοι / ἐνδόξους
  choice: 默默无闻的人 / 享有声望的人
  rationale: δόξα 词组在此主要涉及名望和社会声誉；这样翻译既与上一组对照有所区别，也符合现代汉语表达。
- source_word: ἄφρονες / φρονίμους
  choice: 愚昧的人 / 明智的人
  rationale: 呈现缺乏判断力与有见识、审慎之间的对照，不额外加入道德或宗教含义。
- source_word: νέοι / πρεσβυτέρους
  choice: 年轻人 / 年长的人
  rationale: πρεσβύτεροι 在此与 νέοι 构成年龄对照，语境不足以确定是教会职分上的“长老”，故保留年龄含义。
- source_word: ἐπηγέρθησαν ἐπί
  choice: 起来反对
  rationale: 准确表达起而敌对、攻击的动态，同时保持原文未明确说明具体行动方式的开放性。
theological_decisions:
- issue: πρεσβυτέρους 是否指教会长老
  choice: 译作“年长的人”
  alternative: “长老”
  rationale: 本句由四组社会性对偶构成，νέοι 与 πρεσβύτεροι 最自然地表示年轻人与年长者；译成职分名称会加入原文在此处并未明确限定的教会制度含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以四组平行结构再现希腊文的修辞节奏。为避免“无荣耀/有荣耀”在汉语中产生不必要的神学联想，按此处社会声誉的语境译为“默默无闻/享有声望”。
