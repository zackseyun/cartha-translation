  to: 因此，公义与和平远远退去，因为人人都丢弃了对上帝的敬畏，在对他的信仰上变得眼光昏花[a]，既不遵行他诫命的规例，也不按合乎基督的方式行事，反倒各自顺着自己邪恶内心的欲望而行，抱持着不义、不敬虔的嫉妒；死亡也借着这种嫉妒进入了世界。
  rationale: 修订仅作两项安全调整：以“抱持着”补足ἀνειληφότας所含的主动承接意味；将“在信靠他的事上”调整为更自然的“在对他的信仰上”，并使脚注对属格与πίστις语义的说明更明确。其余表达忠实保留原文的修辞、关系与适度歧义。
