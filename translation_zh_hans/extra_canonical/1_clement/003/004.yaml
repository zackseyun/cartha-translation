id: 1CLEM.3.4
reference: 1 Clement 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο πόρρω ἀπέστη ἡ δικαιοσύνη καὶ εἰρήνη, ἐν τῷ ἀπολιπεῖν ἕκαστον τὸν φόβον τοῦ θεοῦ καὶ ἐν τῇ πίστει αὐτοῦ ἀμβλυωπῆσαι, μηδὲ ἐν τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ πορεύεσθαι μηδὲ πολιτεύεσθαι κατὰ τὸ καλῆκον τῷ Χριστῷ, ἀλλὰ ἕκαστον βαδίζειν κατὰ τὰς ἐπιθυμίας τῆς καρδίας αὐτοῦ τῆς πονηρᾶς, ζῆλον ἄδικον καὶ ἀσεβῆ ἀνειληφότας, δι' οὗ καὶ θάνατος εἰσῆλθεν εἰς τὸν κόσμον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/004.yaml
  text: Because of this[a], righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became dim-sighted in faith in him, neither walking in the ordinances of his commandments nor conducting himself in a manner fitting for Christ, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy[c][b], through which death also entered into the world.
translation:
  language: zh_hans
  text: 因此，公义与和平远远退去，因为人人都丢弃了对上帝的敬畏，在对他的信仰上变得眼光昏花[a]，既不遵行他诫命的规例，也不按合乎基督的方式行事，反倒各自顺着自己邪恶内心的欲望而行，抱持着不义、不敬虔的嫉妒；死亡也借着这种嫉妒进入了世界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在对他的信仰上”也可理解为“在他的信实上”；希腊语属格形式容许不同理解。
    reason: 保留ἐν τῇ πίστει αὐτοῦ的属格歧义；正文依上下文译为人对上帝的信仰，脚注提示πίστις可有“信实”之义。
lexical_decisions:
- source_word: πόρρω ἀπέστη
  choice: 远远退去
  rationale: 保留空间性隐喻及完成性的离开动作，同时符合现代汉语表达。
- source_word: τὰ νόμιμα τῶν προσταγμάτων αὐτοῦ
  choice: 他诫命的规例
  rationale: νόμιμα在此为名词化复数，指既定的规例、条例；与προστάγματα“诫命、命令”构成所属关系。
- source_word: ἀμβλυωπῆσαι
  choice: 眼光昏花
  rationale: 该词本义为视力迟钝、看不清；保留原文用于信仰状态的视觉隐喻。
- source_word: πολιτεύεσθαι
  choice: 行事
  rationale: 此处指生活为人、履行生活本分；“行事”自然简洁，也与前面的“遵行”有所区分。
- source_word: τὸ καλῆκον τῷ Χριστῷ
  choice: 合乎基督的方式
  rationale: 原文OCR的καλῆκον应对应通行文本的καθῆκον，意为适宜、合宜之事；Χριστός在本书信语境中译作“基督”。
- source_word: ζῆλον ἄδικον καὶ ἀσεβῆ
  choice: 不义、不敬虔的嫉妒
  rationale: ζῆλος可指热心、争竞或嫉妒；负面修饰语及下文死亡进入世界的典故支持“嫉妒”。
theological_decisions:
- issue: ἐν τῇ πίστει αὐτοῦ中属格αὐτοῦ的关系
  choice: 在信靠他的事上
  alternative: 在他的信仰（或信实）上
  rationale: 与前句“对上帝的敬畏”平行，语境最自然地指人对上帝的信靠；但希腊语属格形式本身可以作其他理解，故以脚注保留歧义。
- issue: δι’ οὗ的先行项
  choice: 借着这种嫉妒
  alternative: 借着它
  rationale: 关系代词最直接回指紧邻的ζῆλον“嫉妒”；明示先行项可避免中文指代不清，又不额外指定嫉妒者是谁。
- issue: κατὰ τὸ καθῆκον τῷ Χριστῷ的表达
  choice: 按合乎基督的方式行事
  alternative: 履行对基督当尽的本分
  rationale: 与格τῷ Χριστῷ可表达相对于基督而言合宜之事；正文采用较少过度解释的表达，不把它限定为特定宗教义务。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“公义与和平退去”“眼光昏花”等原文隐喻；句法按因果、否定并列和转折关系梳理，以便普通读者理解，同时不淡化原文对嫉妒与死亡的神学关联。
