  text: 挪亚宣讲悔改；那些听从的人得救了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκήρυξεν
  choice: 宣讲
  rationale: 表达公开传扬、宣告信息的意思，符合宗教语境，又比单纯的“讲”更庄重。
- source_word: μετάνοιαν
  choice: 悔改
  rationale: 准确传达心意与行为转变的宗教伦理含义，也是现代汉语中自然且通行的对应词。
- source_word: οἱ ὑπακούσαντες
  choice: 听从的人
  rationale: 保留ὑπακούω既听见又顺从的含义；“听从”在现代汉语中简洁自然。
- source_word: ἐσώθησαν
  choice: 得救了
  rationale: 采用被动意义自然汉译的惯用表达，保留获救而非自救的含义。
theological_decisions:
- issue: “听从”的对象在希腊文中没有明说
  choice: 不补出“他”或“这信息”
  alternative: 听从挪亚的人／听从这宣告的人
  rationale: 原文保留了对象的省略，译文也不作超出文本的限定，以避免不必要地消除其开放性。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；保持原句两个并列分句的紧凑结构。
