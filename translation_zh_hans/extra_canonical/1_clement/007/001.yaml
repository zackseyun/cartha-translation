  text: Ταῦτα, ἀγαπητοί, οὐ μόνον ὑμᾶς νουθετοῦντες ἐπεστέλλομεν, ἀλλὰ καὶ ἑαυτοὺς ὑπομιμνήσκοντες· ἐν γὰρ τῷ αὐτῷ ἐσμὲν σκάμματι, καὶ ὁ αὐτὸς ἡμῖν ἀγὼν ἐπίκειται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/001.yaml
  text: These things, beloved, we have written not only to admonish you, but also to remind ourselves; for we are in the same arena, and the same struggle lies before us.
translation:
  language: zh_hans
  text: 亲爱的各位，我们写这些话，不只是为了劝诫你们，也是为了提醒自己；因为我们同在一个竞技场上，同一场争战正临到我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 该复数称呼意为“蒙爱的人／亲爱的人”；结合致信群体，以现代汉语中自然且包容全体会众的称呼表达。
- source_word: νουθετοῦντες
  choice: 劝诫
  rationale: 兼顾劝勉与警戒之意，语气比单纯“提醒”更强，又不至于译成严厉斥责。
- source_word: σκάμματι
  choice: 赛场
  rationale: 该词本指挖出的场地，进而可指竞技场；下文有“竞赛”意象，译作“赛场”可保留整体比喻。
- source_word: ἀγὼν
  choice: 竞赛
  rationale: 可指竞技、争战或艰苦奋斗；在“赛场”语境中译作“竞赛”，保留体育竞技意象及其艰难意味。
- source_word: ἐπίκειται
  choice: 面前摆着
  rationale: 表达某事临到、摆在前面的含义，现代汉语自然，同时保留尚待面对的张力。
theological_decisions:
- issue: 作者与收信者是否处于共同的属灵处境
  choice: 我们同在一个赛场上，面前摆着同一场竞赛
  alternative: 我们处于同样的争战中，也面临同样的考验
  rationale: 原文使用连贯的竞技意象，且作者明确把自己包括在劝诫之内；直保这一共同处境，不将其限定为某一种具体神学意义。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语；保留原文从共同劝诫转入竞技比喻的结构。用“弟兄姊妹”明示复数会众，不使用古雅的“诸位蒙爱者”。
