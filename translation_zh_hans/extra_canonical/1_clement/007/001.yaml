review_pass:
  verdict: revise
  source_fidelity: 原文的并列分词说明写信既为劝诫收信人，也为提醒作者自身；译文基本传达此意。后半句的σκάμμα与ἀγών构成相关但不完全重复的竞技比喻：前者是竞技场地，后者是竞赛、角力或争战。草案“赛场／竞赛”虽可成立，但“面前摆着同一场竞赛”在现代汉语中不够自然，且弱化ἐπίκειται所表达的迫近、临到之意。
  naturalness: “亲爱的弟兄姊妹”是教会语境中常见称呼，但原文仅为“亲爱的／蒙爱的人”，没有明说亲属称谓；译为“亲爱的各位”更不增添原文未明示的关系称呼。将末句调整为“同一场争战正临到我们”，既自然，也保留竞技隐喻在伦理语境中可含的艰苦奋战意味。
  terminology: “劝诫”恰当对应νουθετοῦντες。“竞技场”对应σκάμμα较明确；“争战”对应ἀγών是此处自然、不过度限定的表达，并保留其可指竞赛或艰苦搏斗的张力。
  issues:
  - severity: low
    issue: 称呼“弟兄姊妹”增添了原文未明说的亲属称谓。
    rationale: ἀγαπητοί是对复数受众的“亲爱的／蒙爱的人”，可处于基督徒群体语境，但词面并不包含“弟兄姊妹”。
  - severity: medium
    issue: “面前摆着同一场竞赛”不够自然，且对ἐπίκειται的迫近意味表达偏弱。
    rationale: ἐπίκειται可指某事压在、临到某人；改作“正临到我们”更贴近原文且符合现代汉语。
  revised_text: 亲爱的各位，我们写这些话，不只是为了劝诫你们，也是为了提醒自己；因为我们同在一个竞技场上，同一场争战正临到我们。
