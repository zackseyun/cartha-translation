  text: διέλθωμεν εἰς τὰς γενεὰς πάσας καὶ καταμάθωμεν, ὅτι ἐν γενεᾷ καὶ γενεᾷ μετανοίας τόπον ἔδωκεν ὁ δεσπότης τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/005.yaml
  text: Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for repentance to those willing to turn to him.
translation:
  language: zh_hans
  text: 让我们考察所有世代，并仔细认识到：主在世世代代都给那些愿意归向他的人悔改的机会。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλθωμεν εἰς τὰς γενεὰς πάσας
  choice: 让我们逐一察看历代
  rationale: 保留共同劝勉语气和遍察各世代之意；“逐一察看”在现代汉语中比直译“经过所有世代”更自然，并与下文“仔细领会”衔接。
- source_word: καταμάθωμεν
  choice: 仔细领会
  rationale: 表达深入考察并认识的加强语气，不只表示一般的“知道”。
- source_word: ἐν γενεᾷ καὶ γενεᾷ
  choice: 世世代代
  rationale: 以自然的汉语叠用形式再现希腊语“在一代又一代中”的持续和普遍含义。
- source_word: ὁ δεσπότης
  choice: 主
  rationale: 在宗教语境中以庄重、通行的称谓表达具有主权的主人；避免生硬的“主人”及可能过度强化特定含义的扩译。
- source_word: μετανοίας τόπον ἔδωκεν
  choice: 给……悔改的机会
  rationale: τόπον在此为容许、余地或机会的惯用义；“悔改的机会”符合现代汉语，同时保留神所赐予的空间这一含义。
- source_word: τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν
  choice: 那些愿意归向他的人
  rationale: 保留“愿意”的主动意愿，并将ἐπιστρέφω译为“归向”；原文并未明确包含“重新”或“回”的成分，故不加“重新归回”。
theological_decisions:
- issue: “悔改的机会”与“悔改的余地”
  choice: 悔改的机会
  alternative: 悔改的余地
  rationale: 两者都可表达μετανοίας τόπον；“机会”对普通现代读者更清楚自然，同时不把句子解释为某一特定救恩论体系。
- issue: ἐπιστρέψαι是否译出“回转”之“回”
  choice: 归向他
  alternative: 回转归向他
  rationale: 原文表示转向他，不明确预设对象先前曾属于他；采用“归向”既符合宗教汉语，也保留这一开放性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句首保留共同劝勉式“让我们”，冒号呈现考察所得的结论；不添加原文没有的神学限定。
