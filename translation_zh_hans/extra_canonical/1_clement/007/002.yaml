source:
  edition: Funk 1901 (normalized OCR)
  text: διὸ ἀπολίπωμεν τὰς κενὰς καὶ ματαίας φροντίδας, καὶ ἔλθωμεν ἐπὶ τὸν εὐκλεῆ καὶ σεμνὸν τῆς παραδόσεως ἡμῶν κανόνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/002.yaml
  text: Therefore let us leave behind empty and futile concerns[a], and let us come to the glorious and venerable rule of our tradition.
translation:
  language: zh_hans
  text: 所以，我们要抛开那些空洞而徒劳的思虑，转向我们传统中那荣耀而可敬的准则。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φροντίδας
  choice: 思虑
  rationale: 该词可指牵挂、忧虑或所关注之事；“思虑”在此保留其广度，并与“空洞而徒劳”自然搭配。
- source_word: κανόνα
  choice: 准则
  rationale: κανών在此指用来规范、衡量的标准或规则；“准则”既准确又符合现代汉语表达。
- source_word: παραδόσεως ἡμῶν
  choice: 我们传统中
  rationale: παράδοσις指传递下来、承接而来的传统；属格结构表明该准则属于或体现于共同承受的传统，译文不额外限定其具体内容。
- source_word: εὐκλεῆ καὶ σεμνὸν
  choice: 荣耀而可敬
  rationale: εὐκλεής含荣耀、享有美名之意；σεμνός指值得敬重、令人肃然起敬，而不只是严肃。
theological_decisions:
- issue: “传统”与“准则”的关系
  choice: 译作“我们传统中……的准则”
  alternative: “我们所传承的……准则”
  rationale: 保留希腊文属格所容许的关系，不把“传统”与“准则”完全等同，也不预设其神学范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“抛开……转向……”对应两个劝勉式动词，保留共同自劝的语气；避免用“忧虑”把φροντίδες过度收窄，也避免用“庄严”削弱σεμνός所含的值得敬重之意。
