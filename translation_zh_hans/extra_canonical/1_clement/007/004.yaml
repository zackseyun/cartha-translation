  text: ἀτενίσωμεν εἰς τὸ αἷμα τοῦ Χριστοῦ καὶ γνῶμεν, ὡς ἔστιν τίμιον τῷ θεῷ καὶ πατρὶ αὐτοῦ, ὅτι διὰ τὴν ἡμετέραν σωτηρίαν ἐκχυθὲν παντὶ τῷ κόσμῳ μετανοίας χάριν διήνεγκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/004.yaml
  text: Let us fix our gaze on the blood of Messiah and understand how precious it is to his God and Father[a], because, having been poured out for our salvation, it brought the grace of repentance to the whole world.
translation:
  language: zh_hans
  text: 让我们定睛注视弥赛亚的血，并明白这血在他的上帝和父看来是何等宝贵；因为它为拯救我们而流出，把悔改的恩典带给了全世界。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: 让我们定睛仰望
  rationale: 表达持续、专注凝视之意；“仰望”在中文宗教语境中自然庄重，同时保留劝勉语气。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός本义为“受膏者”，此处按项目用语译作“弥赛亚”。
- source_word: τίμιον
  choice: 宝贵
  rationale: 既可表达价值珍贵，也能自然承接“在……看来”的评价结构。
- source_word: ἐκχυθὲν
  choice: 流出
  rationale: 用于血时自然，并忠实表达被倾倒、流出的被动分词。
- source_word: μετανοίας χάριν
  choice: 悔改的恩典
  rationale: 保留属格结构及χάρις的恩典含义，不将其缩减为仅仅“悔改的机会”。
- source_word: διήνεγκεν
  choice: 带来了
  rationale: 在本句中表达将某物带给、传及全世界的结果，符合现代汉语习惯。
theological_decisions:
- issue: τῷ θεῷ καὶ πατρὶ αὐτοῦ中父与上帝的关系
  choice: 他的上帝和父
  alternative: 上帝——他的父
  rationale: 单一冠词统摄两个并列名词，αὐτοῦ自然修饰整个并列短语；正文保留基督与“他的上帝和父”的关系，不将其弱化。脚注列出可将第二名词理解为同位说明的译法。
- issue: “悔改的恩典”是赐给谁
  choice: 给全世界带来了悔改的恩典
  alternative: 把悔改的恩典传遍全世界
  rationale: 希腊文παντὶ τῷ κόσμῳ为与格，可表示受益者或所及范围；正文采用自然的受益者表达，同时不把“全世界”解释为每一个个体必然悔改。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定睛仰望”保留劝勉和凝视的力度；以分号呈现观察与理由之间的关系。
