  terminology: “约拿”“尼尼微人”“上帝”“悔改”“恳求”“拯救”均合宜。“使上帝息怒”恰当地表达ἐξιλάσαντο τὸν θεόν的直接宾语结构，避免把它改写成抽象的“向上帝赎罪”。
