base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/007.yaml
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having repented of their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
translation:
  language: zh_hans
  text: 约拿向尼尼微人宣告毁灭；他们却为自己的罪悔改，借着恳求使上帝息怒[a]，因而得了拯救，虽原是上帝的外人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着恳求平息上帝的忿怒。”
    reason: ἐξιλάσαντο以“上帝”为直接宾语；此注保留“息怒”的较显性表达，而不改写为“向上帝赎罪”。
lexical_decisions:
- source_word: καταστροφήν
  choice: 毁灭
  rationale: 指约拿向尼尼微人宣告的覆灭或毁灭，既保留审判的严肃性，也符合现代汉语表达。
- source_word: μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν
  choice: 为自己的罪悔改
  rationale: ἐπί在此说明悔改所针对的罪；译文自然呈现分词所表达的先行行动。
- source_word: ἐξιλάσαντο τὸν θεόν
  choice: 使上帝息怒
  rationale: 动词以“上帝”为直接宾语，语义是借恳求平息上帝的忿怒、使上帝转意；此译法比“在上帝面前赎罪”更贴近希腊文句法，同时用脚注保留传统赎罪措辞。
- source_word: ἱκετεύσαντες
  choice: 借着恳求
  rationale: 分词表达他们使上帝息怒的方式；“恳求”准确体现谦卑迫切的祈求。
- source_word: σωτηρίαν
  choice: 拯救
  rationale: 在此指尼尼微人免遭所宣告的毁灭；保留该词也可能具有的较宽神学意味。
- source_word: ἀλλότριοι τοῦ θεοῦ
  choice: 与上帝无关的人
  rationale: ἀλλότριοι表示外人、局外人或不属上帝的人；此译文避免误解为上帝的陌生人，并保留他们原先处于上帝子民之外的含义。
theological_decisions:
- issue: 尼尼微人的恳求与上帝赦免之间的表述
  choice: 借着恳求使上帝息怒
  alternative: 借着恳求向上帝赎罪
  rationale: 原文将上帝置于ἐξιλάσαντο的直接宾语位置，强调他们的恳求使上帝息怒；不将此处系统化为某种特定赎罪教义，脚注保留另一种可能译法。
- issue: σωτηρία的范围
  choice: 得了拯救
  alternative: 得以存活／获救免遭毁灭
  rationale: 采用较宽的“拯救”以保留原词的神学张力，不把意义限定为仅仅免于当时的城毁，也不武断认定为永恒救恩。
- issue: ἀλλότριοι τοῦ θεοῦ的身份含义
  choice: 原是与上帝无关的人
  alternative: 原是上帝的外人／原不属于上帝
  rationale: 表达他们原先处于上帝子民范围之外，而不引入后世宗派关于盟约成员身份的细化定义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“约拿”“尼尼微人”“上帝”使用普通读者熟悉的名称；句式保留原文的审判、悔改、恳求和拯救之间的推进关系，同时避免过度古雅或宗派化术语。
