  yaml_path: translation/extra_canonical/1_clement/031/002.yaml
  text: For what reason was our father Abraham blessed? Was it not because he did righteousness and truth through faith?
translation:
  language: zh_hans
  text: 我们的先祖亚伯拉罕为什么蒙福呢？不正是因为他借着信，行了公义和真理吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος χάριν
  choice: 为什么
  rationale: 以自然的现代汉语表达“因何缘故”，保留设问语气。
- source_word: ὁ πατὴρ ἡμῶν Ἀβραάμ
  choice: 我们的先祖亚伯拉罕
  rationale: πατήρ直译为“父亲”，但在汉语圣经语域中称亚伯拉罕为“先祖”更自然，也准确表达群体祖先之意。
- source_word: ηὐλογήθη
  choice: 蒙福
  rationale: 保留被动意义，并采用现代汉语宗教文本中清楚、庄重的常用表达。
- source_word: δικαιοσύνην καὶ ἀλήθειαν ... ποιήσας
  choice: 行了公义和真理
  rationale: ποιέω在此表示实行、行出；“行了”既贴近原文的一次性分词形式，也比抽象的“实践”更符合经文语体。
- source_word: διὰ πίστεως
  choice: 借着信
  rationale: 保留διά加属格所表达的途径或媒介意义，不将其扩展为原因或功德。
theological_decisions:
- issue: 亚伯拉罕蒙福与借信而行公义、真理之间的关系
  choice: 以反问句并列呈现：“不正是因为他借着信，行了公义和真理吗？”
  alternative: 将其解释为单凭信称义，或解释为靠行为赚取福分
  rationale: 原文将蒙福与“借着信”所行的公义和真理联系起来，却未在此系统界定信与行为的关系；译文保留这一张力，不作教派化推论。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“不正是……吗”对应οὐχί所引导、期待肯定回答的反问；句中保留“借着信”的位置和工具性含义。
