  text: Κολληθῶμεν οὖν τῇ εὐλογίᾳ αὐτοῦ καὶ ἴδωμεν, τίνες αἱ ὁδοὶ τῆς εὐλογίας. ἀνατυλίξωμεν τὰ ἀπ’ ἀρχῆς γενόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/001.yaml
  text: Let us therefore cling to his blessing, and let us see what the ways of blessing are. Let us unfold the things that have happened from the beginning.
translation:
  language: zh_hans
  text: 所以，让我们紧紧依附于他的祝福，也来看看蒙福之道有哪些。让我们展开考察从起初所发生的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολληθῶμεν
  choice: 让我们紧紧持守
  rationale: 原词有“粘连、紧密依附”之意；此处以“紧紧持守”自然表达持续依附并珍视福分的劝勉语气。
- source_word: τῇ εὐλογίᾳ αὐτοῦ
  choice: 他的福分
  rationale: εὐλογία 在此与后文“蒙福的道路”相连，指上帝所赐之福；译作“福分”比单纯的“祝福”更适合被持守的语境。
- source_word: αἱ ὁδοὶ τῆς εὐλογίας
  choice: 蒙福的道路
  rationale: 属格可理解为通向或带来福分的道路；“蒙福的道路”保留其概括性，同时符合现代汉语表达。
- source_word: ἀνατυλίξωμεν
  choice: 让我们展开来看
  rationale: 原词本义涉及展开卷轴，引申为展开叙述或考察；加入“来看”使中文自然，并与前句“看看”形成考察往事的连贯语气。
- source_word: τὰ ἀπ’ ἀρχῆς γενόμενα
  choice: 从起初所发生的事
  rationale: 贴近希腊文结构，不把“起初”限定为某一特定历史节点，以保留原文范围的开放性。
theological_decisions:
- issue: “福分”与“蒙福的道路”的关系
  choice: 译作“持守他的福分”与“蒙福的道路”
  alternative: “依附于他的祝福”与“祝福之路”
  rationale: 前者在现代汉语中较自然，也保留福分来自“他”的神学指向；不进一步说明获得福分的机制，以免消解原文的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留三重劝勉式结构，并以“所以”承接上文；不添加原文未明说的历史人物、行为条件或教义解释。
