  text: Ἰσαὰκ μετὰ πεποιθήσεως γινώσκων τὸ μέλλον ἡδέως προσήγετο θυσία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/003.yaml
  text: Isaac[a], knowing with confidence what was to come, gladly offered himself as a sacrifice.
translation:
  language: zh_hans
  text: 以撒满怀确信，知道将要发生的事，便甘愿把自己献上为祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πεποιθήσεως
  choice: 满怀确信
  rationale: 表达坚定信赖和把握，明确修饰“知道”，同时保持庄重自然。
- source_word: γινώσκων τὸ μέλλον
  choice: 知道将要发生的事
  rationale: τὸ μέλλον指未来将临之事；用此译法比抽象的“未来”更符合现代汉语。
- source_word: ἡδέως
  choice: 甘愿
  rationale: 在献祭语境中表达欣然、自愿之意，较“高兴地”自然庄重。
- source_word: προσήγετο θυσία
  choice: 把自己献上为祭
  rationale: 中间/被动形式在此描写以撒作为祭物被带到近前或献上；结合ἡδέως，译文自然呈现其自愿参与，而不把具体动作过度限定为单纯“被领去”。
theological_decisions:
- issue: 以撒在献祭中的主动性
  choice: 甘愿把自己献上为祭
  alternative: 甘愿被带去献祭
  rationale: 原文προσήγετο可容纳被带到近前或被献上的意味，而ἡδέως强调甘愿。正文采用自然的中文表达其自愿性，但不引入原文之外的赎罪或预表解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；调整语序，使“满怀确信”明确修饰“知道”，避免误解为修饰将来的事。
