base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/004.yaml
  text: Jacob[a], with humility, departed from his land because of his brother and went to Laban and served, and to him was given the twelve-sceptered people of Israel.
translation:
  language: zh_hans
  text: 雅各存着谦卑的心，因他兄弟的缘故离开本地，到拉班那里去服侍；以色列的十二支派[a]被赐给了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十二支派”原文直译为“十二权杖”，是以“杖”指代“支派”的圣经用语。
    reason: 保留δωδεκάσκηπτρον的字面意象，同时说明正文为何采用惯用译法。
lexical_decisions:
- source_word: ταπεινοφροσύνης
  choice: 谦卑的心
  rationale: 表达谦卑的心态和品格，比单用“谦卑”更符合现代汉语习惯。
- source_word: δι’ ἀδελφὸν
  choice: 因他兄弟的缘故
  rationale: 保留原文仅说“兄弟”而未明说以扫或“哥哥”的措辞，也保留介词短语对具体缘由的简略表达。
- source_word: ἐδούλευσεν
  choice: 服役
  rationale: 传达为拉班劳作、作仆役的含义，同时不擅自补出希腊文未明说的宾语。
- source_word: τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ
  choice: 以色列的十二支派
  rationale: δωδεκάσκηπτρον字面关联“十二根权杖”，但σκῆπτρον承载希伯来语שֵׁבֶט兼指“杖”和“支派”的圣经用法；正文采用现代读者能自然理解的“十二支派”，脚注保留原词形象。
theological_decisions:
- issue: “十二权杖”与“十二支派”之间的双关形象
  choice: 正文译作“以色列的十二支派”，脚注说明字面形象
  alternative: 以色列那拥有十二权杖的民族
  rationale: 避免生硬的新造表达，却不抹去复合词δωδεκάσκηπτρον中的权杖意象及其可能具有的王权色彩。
- issue: “赐给了他”的施事者
  choice: 使用无施事者的被动句
  alternative: 上帝把……赐给了他
  rationale: 原文使用神圣被动语态，未明确说出施事者；译文不擅自补明，以保留原文含蓄。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“存着谦卑的心”体现人物行事的态度；分号使最后的结果句层次清楚。脚注标记置于相关短语所在句末。
