source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ Ἀνανίας καὶ Ἀζαρίας καὶ Μισαὴλ ὑπὸ τῶν θρησκευόντων τὴν μεγαλοπρεπῆ καὶ ἔνδοξον θρησκείαν τοῦ ὑψίστου κατείρχθησαν εἰς κάμινον πυρός, μηδὲ ταῦτα τοῦτο γένοιτο. τίνες οὖν οἱ ταῦτα δράσαντες; οἱ στυγητοὶ καὶ πάσης κακίας πλήρεις εἰς τοσοῦτο ἐξήρισαν θυμοῦ, ὥστε τοὺς ἐν ὁσίᾳ καὶ ἀμώμῳ προθέσει δουλεύοντας τῷ θεῷ εἰς αἰκίαν περιβαλεῖν, μὴ εἰδότες, ὅτι ὁ ὕψιστος ὑπέρμαχος καὶ ὑπερασπιστής ἐστιν τῶν ἐν καθαρᾷ συνειδήσει λατρευόντων τῷ παναρέτῳ ὀνόματι αὐτοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/007.yaml
  text: Or were Hananiah and Azariah and Mishael cast down into a furnace of fire by those who practiced the magnificent and glorious religion of the Most High? May this never be! Who then were the ones who did these things? The hateful[a], and those full of every evil, were stirred up to such a pitch of wrath that they subjected to abuse those who served God in a holy and blameless purpose, not knowing that the Most High is the champion and defender of those who worship his all-virtuous name with a pure conscience—to whom be the glory forever and ever. Amen.
translation:
  language: zh_hans
  text: 难道哈拿尼雅、亚撒利雅和米沙利，是被那些奉行至高者那崇高而荣耀之敬虔的人关进火窑里的吗？绝非如此！那么，做这些事的究竟是什么人呢？是那些可憎且充满各样邪恶的人。他们的怒火炽盛到如此地步，竟使那些本着圣洁、无可指责的心志服事上帝的人遭受凌辱。他们不知道，至高者是那些以清洁的良心敬拜他那全然美善之名之人的护卫者和辩护者。愿荣耀归于他，直到永永远远。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατείρχθησαν
  choice: 被……关进
  rationale: 该动词在此指被关闭、禁锢于火窑中；避免采用“扔下去”而混同于 κατάγω 一类动词，同时用自然汉语表达被动含义。
- source_word: θρησκευόντων τὴν μεγαλοπρεπῆ καὶ ἔνδοξον θρησκείαν
  choice: 敬奉……那威严而荣耀的宗教
  rationale: 保留 θρησκεύω 与 θρησκεία 的同根复现及反问中的讽刺张力；“敬奉”也能涵盖宗教实践。
- source_word: οἱ στυγητοὶ
  choice: 那些可憎……的人
  rationale: στυγητός 表示可憎、可恨；译为“可憎”保留道德评判而不额外指定他们被谁憎恨。
- source_word: ἐξήρισαν θυμοῦ
  choice: 怒气被激发到了如此地步
  rationale: 原句形式较异常，但语境明确描述怒气被激起、达到极点；此译保留程度结果关系。
- source_word: εἰς αἰκίαν περιβαλεῖν
  choice: 使……遭受凌辱
  rationale: αἰκία 可指虐待、侮辱或凌辱；“遭受凌辱”保留一定语义宽度，不限定为言语羞辱或肉体酷刑。
- source_word: ὑπέρμαχος καὶ ὑπερασπιστής
  choice: 护卫者和辩护者
  rationale: 分别体现为人争战保护与出面维护、辩护的双重意象，保留两个并列称谓。
- source_word: τῷ παναρέτῳ ὀνόματι
  choice: 他那全然美善之名
  rationale: παναρέτος 字面为具备一切德性；用于上帝之名时译作“全然美善”较自然，并避免生硬的“全德”。
theological_decisions:
- issue: 反问中迫害者是否真是至高者宗教的敬奉者
  choice: 按原文直译为“那些敬奉……宗教的人”，随后以“绝非如此”否定
  alternative: 将前句解释性改写为“真正敬奉……的人”或直接称迫害者为异教徒
  rationale: 原文刻意以反问制造道德与宗教身份之间的张力；译文不预先替作者消解这一张力。
- issue: “服事上帝”与“敬拜其名”的关系
  choice: 分别译出 δουλεύω 与 λατρεύω
  alternative: 两处都统一译为“敬拜”或“事奉”
  rationale: 保留原文不同动词：前者强调以仆人身份服事，后者强调宗教敬拜。
- issue: 颂荣句关系代词 ᾧ 的所指
  choice: 译为“愿荣耀归于他”，指至高者
  alternative: 理解为归于“他的名”
  rationale: 语法上最近的名词虽是“名”，但阳性关系代词与“至高者”相合，颂荣惯例也支持以至高者为所指。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。人名依常见圣经音译处理；保留原文连续反问、强烈否定和末尾颂荣的修辞节奏。无脚注，故正文不设脚注标记。
