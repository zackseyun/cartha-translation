  yaml_path: translation/extra_canonical/1_clement/045/002.yaml
  text: You have looked closely into the holy Scriptures[a], the true ones, those given through the Holy Spirit.
translation:
  language: zh_hans
  text: 你们曾仔细查考圣经[a]，就是那些真实的、借着圣灵赐下的经书。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们曾俯身细看圣经。”
    reason: 保留ἐγκύπτω“俯身察看”的具体形象；正文采用其在查阅文献语境中的自然含义。
lexical_decisions:
- source_word: ἐνεκύψατε
  choice: 曾仔细查考
  rationale: 该词本义可指俯身察看，但用于经书时表达认真察看、深入查考；译为“仔细查考”既自然，也保留专注研读的语气。
- source_word: τὰς ἱερὰς γραφάς
  choice: 圣经
  rationale: γράφαί在此指神圣经书；现代汉语用“圣经”简洁自然。后文以“经书”回指，以显明复数所指并避免误解为后世已定型的书名概念。
- source_word: τὰς ἀληθεῖς
  choice: 那真实的
  rationale: 保留原文独立的同位修饰语，不擅自补成“真实的话”或解释其与其他著作的对比。
- source_word: τὰς διὰ τοῦ πνεύματος τοῦ ἁγίου
  choice: 借着圣灵赐下的经书
  rationale: διά加属格表示媒介，译作“借着”；汉语需补出被修饰的“经书”。“赐下”使省略的传达概念自然呈现，但不具体限定默示机制。
theological_decisions:
- issue: 圣灵与经书形成或传达的关系
  choice: 借着圣灵赐下的
  alternative: 由圣灵所写的／受圣灵默示的
  rationale: 原文只明确表达“借着圣灵”，没有使用“写作”或“默示”的专门动词；采用较宽的表达，以保留原文对作用方式的开放性。
- issue: ἀληθεῖς所强调的真确性
  choice: 就是那真实的
  alternative: 就是绝无错误的圣经
  rationale: 原文称这些经书为“真实的”，但未在本句展开无误论等系统性定义，因此不加入超出文本的教义术语。
translation_notes:
  register: 采用庄重而现代的书面普通话。“你们曾仔细查考”呼应对收信人的既往认识；以“就是那真实的、借着圣灵赐下的经书”保留希腊文连续同位修饰的结构和强调。
