  text: τί γὰρ εἴπωμεν, ἀδελφοί; Δανιὴλ ὑπὸ τῶν φοβουμένων τὸν θεὸν ἐβλήθη εἰς λάκκον λεόντων;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/006.yaml
  text: For what shall we say, brothers? Was Daniel thrown into a den of lions by those who feared God?
translation:
  language: zh_hans
  text: 弟兄们，我们还能说什么呢？难道但以理是被敬畏上帝的人扔进狮子坑的吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留早期基督教群体中的亲属式称呼；此处复数可泛指共同体成员，但直译为“弟兄们”最贴近原文形式与当时用语。
- source_word: τῶν φοβουμένων τὸν θεόν
  choice: 敬畏上帝的人
  rationale: φοβέομαι 在此表达对上帝的敬畏与虔敬，不宜弱化为一般的“尊敬”；定冠词加分词译作“……的人”。
- source_word: λάκκον λεόντων
  choice: 狮子坑
  rationale: λάκκος 指坑穴；“狮子坑”是自然、清楚且符合相关叙事语境的现代汉语表达。
theological_decisions:
- issue: 原文反问句的否定含意
  choice: 以“难道……吗”保留反问形式
  alternative: 译成陈述句“但以理并不是被敬畏上帝的人扔进狮子坑的”
  rationale: 希腊文以问号明确构成反问；译文不把其隐含答案直接写出，以保留原文的修辞力度。
- issue: θεός 的汉译
  choice: 上帝
  alternative: 神
  rationale: 二者皆可表达希腊文 θεός；采用现代标准普通话中庄重且易懂的“上帝”，不加入宗派性解释。
translation_notes:
  register: 采用庄重、自然的现代汉语。“我们还能说什么呢”传达 τί γὰρ εἴπωμεν 在论证推进中的承接语气；第二句保留原文反问及其神学张力。
