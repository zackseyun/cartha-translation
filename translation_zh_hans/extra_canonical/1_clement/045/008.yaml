  text: οἱ δὲ ὑπομένοντες ἐν πεποιθήσει δόξαν καὶ τιμὴν ἐκληρονόμησαν, ἐπήρθησάν τε καὶ ἔγγραφοι ἐγένοντο ἀπὸ τοῦ θεοῦ ἐν τῷ μνημοσύνῳ αὐτῶν εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/008.yaml
  text: But those who endured in confidence inherited glory and honor[a], and were exalted, and were enrolled by God in their memorial forever and ever[b]. Amen.
translation:
  language: zh_hans
  text: 然而，那些在信靠中坚忍的人，承受了荣耀和尊贵，也被高举；上帝还把他们记入纪念录中[a]，直到永永远远。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纪念录”直译可作“他们的记念”。原文此处可指上帝对他们的记念，也可指使他们长久被记念的记念或记录。
    reason: 保留ἐν τῷ μνημοσύνῳ αὐτῶν中属格关系及μνημόσυνον所含“记念／纪念性记录”的语义范围，不将其限定为某一种名册。
lexical_decisions:
- source_word: ὑπομένοντες
  choice: 坚忍的人
  rationale: 该词是名词性现在分词，表示在患难中坚持、忍耐的人；结合上下文中的过去时叙事，用“坚忍的人”既保留其特质性表达，也不误解为单纯现在时。
- source_word: ἐν πεποιθήσει
  choice: 怀着信靠
  rationale: πεποίθησις表示确信、信赖；“信靠”在此自然表达倚靠上帝的笃定，同时不额外指定信靠的具体内容。
- source_word: ἐκληρονόμησαν
  choice: 承受了
  rationale: 保留κληρονομέω“继承、得为产业”的意象；“承受”适合荣耀和尊贵作宾语，也符合庄重文体。
- source_word: ἔγγραφοι ἐγένοντο
  choice: 记入
  rationale: 这一迂回结构意为成为有名在册、被登记；“记入”在现代汉语中自然，并保留正式记录的含义。
- source_word: μνημοσύνῳ
  choice: 纪念录
  rationale: 该词可指记念、纪念物或使人被记念的记录；结合“记入”，译作“纪念录”较通顺，同时以脚注说明原文结构的歧义。
theological_decisions:
- issue: “忍耐”的时间指向
  choice: 按上下文理解为先前经受考验并坚忍的人，但不在分词本身加入明确过去时标记
  alternative: 那些曾怀着信靠忍耐到底的人
  rationale: 现在分词的时间关系由三个不定过去时主句动词决定，语境指向前文人物已经历的事件；中文“坚忍的人”可自然置于过去叙事中，也避免加入原文没有的“到底”。
- issue: αὐτῶν在“记念”短语中的关系
  choice: 正文译为上帝把“他们”记入纪念录
  alternative: 上帝把他们列入对他们的记念中／上帝把他们记在他们的纪念中
  rationale: αὐτῶν既可形式上直译为“他们的”，也可理解为“对他们的记念”。正文以自然汉语表达受记念者是“他们”，脚注保留短语结构及语义范围，不把它限定为某种特定的天上名册。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“荣耀和尊贵”“被高举”“直到永永远远”“阿们”保留早期基督教劝勉文体的节奏；用分号区分承受、被高举与被记入三个并列结果，避免句子拖沓。
