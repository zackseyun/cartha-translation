  text: You know that nothing unjust or falsified has been written in them; you will not find righteous people cast off by holy men.
translation:
  language: zh_hans
  text: 你们知道，这些经卷中所写的没有任何不公正或伪造的内容；你们找不到义人被圣洁之人弃绝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστασθε
  choice: 你们知道
  rationale: 准确表达复数第二人称及确定认知，符合现代汉语自然用法。
- source_word: ἐν αὐταῖς
  choice: 这些经卷中
  rationale: 阴性复数代词承接上文所指的圣经文本；补出“经卷”使中文指代清楚，但不扩大所指范围。
- source_word: ἄδικον
  choice: 不公正
  rationale: 保留该词在道德与公义层面的宽泛含义。
- source_word: παρεπεποιημένον
  choice: 伪造的
  rationale: 该完成时被动分词表示经篡改、杜撰或伪造之物；“伪造”简洁地传达文本真实性受到破坏的含义。
- source_word: γέγραπται
  choice: 有……记载
  rationale: 对应“已经写下”，用中文经卷语境中的自然表达呈现完成时结果。
- source_word: ἀποβεβλημένους
  choice: 被……弃绝
  rationale: 保留被动及排斥、抛弃的强烈意味。
- source_word: ὁσίων ἀνδρῶν
  choice: 圣洁的人
  rationale: ὅσιος侧重虔敬、圣洁；ἀνδρῶν在此可泛指人，避免不必要地限定为男性。
theological_decisions:
- issue: “这些经卷”是否明确称为圣经
  choice: 这些经卷
  alternative: 其中／这些经文中
  rationale: 原文仅用阴性复数代词，所指依赖上文；译文适度补明为经卷，同时避免加入原句未明说的正典范围。
- issue: 义人与圣洁之人的关系
  choice: 义人被圣洁的人弃绝
  alternative: 义人被敬虔人赶走
  rationale: 严格保留原文两类人物及被动关系，不把“义”与“圣洁”合并，也不解释事件性质。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语；保留原文两个并列否定陈述及其道德张力，不作宗派化解释。
