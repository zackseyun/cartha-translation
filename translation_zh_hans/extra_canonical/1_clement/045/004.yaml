base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/004.yaml
  text: The righteous were persecuted[a], but by the lawless; they were imprisoned, but by the unholy; they were stoned by transgressors; they were killed by the vile and unjust through unbearable jealousy.
translation:
  language: zh_hans
  text: 义人受迫害，迫害他们的却是不法之人；他们被囚禁，囚禁他们的却是不敬虔的人；他们被犯法之人用石头击打[a]；他们因难以忍受的嫉妒，遭污秽而不义的人杀害。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本的动词形式按字面是主动的：“他们用石头击打了（人）”。但其后接“被／由犯法之人”的施事短语，并且全段都在叙述义人所受的伤害，因此正文按明显的被动意义翻译。
    reason: 原文动词的形态与后接施事介词短语不一致；脚注说明这一文本现象，同时正文依句法和上下文保留其被动含义。
lexical_decisions:
- source_word: δίκαιοι
  choice: 义人
  rationale: 指公义、正直的人；“义人”简洁庄重，也符合早期基督教文献的常用表达。
- source_word: ἀνόμων
  choice: 不法之徒
  rationale: 表示无视或违背律法的人；既保留法律意味，也包含道德谴责。
- source_word: ἀνοσίων
  choice: 不敬虔的人
  rationale: ἀνόσιος 指不圣洁、亵渎或不敬神；此处用“不敬虔”能自然传达其宗教与道德色彩。
- source_word: παρανόμων
  choice: 违法之徒
  rationale: 强调越过、违反律法，与前面的 ἀνόμων 近义但并不完全相同；“违法”较准确地表现主动违犯律法。
- source_word: μιαρῶν καὶ ἀδίκων
  choice: 卑污而不义的人
  rationale: μιαρός 在此表示道德上的污秽、可憎，“卑污”比单纯的礼仪性“不洁”更合语境；ἀδίκων 译为“不义”，保留与“义人”的对照。
- source_word: ζήλῳ ἀνεκτρίστῳ
  choice: 因难以容忍的嫉妒
  rationale: ζῆλος 可表示热忱、妒忌或争竞；在迫害和杀害的语境中，“嫉妒”最自然。ἀνεκτρίστῳ 表示无法忍受或难以容忍，译文保留其强烈程度。
theological_decisions:
- issue: ζῆλος 的语义取向
  choice: 嫉妒
  alternative: 狂热／争竞
  rationale: 该词本身有一定语义幅度，但此处描述恶人迫害并杀害义人的动机，负面的“嫉妒”最符合上下文；不将其解释为正面的宗教热忱。
- issue: μιαρός 是否作礼仪性“不洁”理解
  choice: 卑污
  alternative: 不洁／受玷污
  rationale: 上下文着重施害者的道德邪恶，并无明确礼仪洁净议题，因此采用道德性的表达，同时不引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。为保留原文反复的修辞结构，前两分句重复“迫害”和“囚禁”；末句将原因短语置于施事者之前，使中文流畅，同时不消解“嫉妒”作为杀害动机的含义。
