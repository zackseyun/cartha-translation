  naturalness: 原译整体通顺庄重，但“却也”在现代汉语中明确强化转折，较原文的并列连接多出解释性语气。“关乎救恩的事”可用“与救恩有关的事”表达得更自然。
  terminology: “弟兄们”和“救恩”均适合本书信的庄重教会文献语域；“热心于”可保留ζηλωταὶ的积极投入之义，而不预断其是否带反讽。
