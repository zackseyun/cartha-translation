  yaml_path: translation/extra_canonical/1_clement/045/001.yaml
  text: You are contentious, brothers, and zealous about the things that pertain to salvation.
translation:
  language: zh_hans
  text: 弟兄们，你们好争竞，也热心于与救恩有关的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φιλόνεικοί
  choice: 好争辩
  rationale: 该词指好争竞、爱争论；译作“好争辩”既保留责备意味，也与下文正面的“热心”形成张力。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 这是对群体的直接称呼；采用庄重而通行的教会文献用语。
- source_word: ζηλωταὶ
  choice: 热心
  rationale: 表达强烈关注和投入；这里所热心的对象是正面的，因此不译作带贬义的“嫉妒”。
- source_word: περὶ τῶν ἀνηκόντων εἰς σωτηρίαν
  choice: 于关乎救恩的事
  rationale: ἀνήκω在此表示与某事相称、相关或归属于其范围；“关乎救恩的事”自然地保留其较宽泛的关系含义。
theological_decisions:
- issue: 争辩与救恩热心之间的关系
  choice: 用“却也”保留反差而不消除两项并存的张力
  alternative: 直译为“并且”，或将整句理解为对争辩方式的完全肯定
  rationale: 希腊文以καί连接两项，但语义上前者通常带责备色彩，后者所指对象则为正面；“却也”使现代汉语读者看出这种修辞张力，同时不额外断定作者是否讽刺。
- issue: σωτηρίαν的范围
  choice: 救恩
  alternative: 得救
  rationale: 名词“救恩”对应σωτηρία，保留其可能涵盖拯救状态、过程及相关事务的宽度。
translation_notes:
  register: 采用现代、简洁而庄重的书信劝诫语体。语序调整为自然汉语，并以“却也”呈现原句中负面“好争辩”与正面“热心于救恩之事”并置所产生的张力。
