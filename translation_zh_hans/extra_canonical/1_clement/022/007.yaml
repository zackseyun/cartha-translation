  text: The righteous man cried out, and the Lord heard him and delivered him from all his afflictions.
translation:
  language: zh_hans
  text: 义人呼求，主听见了他，把他从一切患难中救出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκέκραξεν
  choice: 呼求
  rationale: 表达大声向上主求告之意；较“喊叫”更符合祷告语境，同时不额外补出宾语。
- source_word: ὁ δίκαιος
  choice: 义人
  rationale: 保留定冠词所指的典型性或特指性，也延续圣经汉语中对“义人”的常见表达。
- source_word: εἰσήκουσεν αὐτοῦ
  choice: 垂听他
  rationale: “垂听”自然体现上主听见并回应求告的语义；代词“他”保留原文。
- source_word: θλίψεων
  choice: 患难
  rationale: 涵盖压迫、困苦和苦难，符合该词复数形式在诗篇式语境中的宽泛含义。
- source_word: ἐῤῥύσατο
  choice: 救了
  rationale: 准确传达从危险或困境中解救出来的意思，简洁而自然。
theological_decisions:
- issue: 义人、呼求与蒙拯救之间的关系
  choice: 按原文并列叙述，不补入因果条件或救恩机制
  alternative: 译成“因为义人呼求，主便……”，明确设定因果关系
  rationale: 希腊文以 καί 连接事件，并未明说义是蒙垂听的功德依据；译文保留这种叙事张力。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语，并保留诗篇引文的凝练节奏。“主就垂听他”中的“就”体现事件承接，不意在加强原文未明说的神学因果。
