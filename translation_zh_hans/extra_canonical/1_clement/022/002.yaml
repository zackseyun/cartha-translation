  yaml_path: translation/extra_canonical/1_clement/022/002.yaml
  text: Who is the man who desires life, who loves to see good days?
translation:
  language: zh_hans
  text: 谁是那渴望生命、喜爱看见美好日子的人？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλων ζωὴν
  choice: 渴望生命
  rationale: 保留 θέλω 所表达的意愿和向往，并按原文不把 ζωή具体化为“长寿”或某种特定生活。
- source_word: ἀγαπῶν
  choice: 喜爱
  rationale: 译出分词与前一描述并列修饰“人”的作用；“喜爱”自然且不过度强化为神学术语。
- source_word: ἡμέρας ἰδεῖν ἀγαθάς
  choice: 看见美好日子
  rationale: 贴近原文“看见好日子”的意象；“美好日子”在现代汉语中自然，并保留其可指经历福乐时日的含义。
theological_decisions:
- issue: “生命”是否应解释为长寿或永生
  choice: 保留为“生命”
  alternative: 长寿；永生
  rationale: 本句本身没有限定 ζωή 的具体所指；保留原文开放性，避免提前作神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用“那……的人”整合两个希腊语分词结构，同时保留反问句式和诗性表达。
