  text: Keep your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: zh_hans
  text: 要使你的舌头远离恶事[a]，你的嘴唇不说诡诈的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“止住你的舌头。”
    reason: παῦσον可较直接地译为“止住”或“制止”；此处按上下文指使舌头远离恶。
lexical_decisions:
- source_word: παῦσον ... ἀπὸ κακοῦ
  choice: 要使……远离恶事
  rationale: παῦσον是停止、制止之意，与ἀπό构成使舌头离开恶的表达；译为“使……远离”既保留命令语气，也符合现代汉语习惯。
- source_word: γλῶσσάν
  choice: 舌头
  rationale: 保留原文以身体器官代指言语行为的形象。
- source_word: δόλον
  choice: 诡诈的话
  rationale: δόλος指欺骗、诡诈；结合λαλῆσαι的“说”，补出“的话”使汉语自然，同时保留其道德含义。
