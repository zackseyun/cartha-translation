  yaml_path: translation/extra_canonical/1_clement/022/006.yaml
  text: The eyes of the Lord are upon the righteous, and his ears are toward their petition; but the face of the Lord is against those who do evil, to wipe out their memory from the earth.
translation:
  language: zh_hans
  text: 主的眼目看顾义人，他的耳朵垂听他们的恳求；但主的脸面转而反对作恶的人，要从地上除灭他们的记念。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: 主的眼目看顾义人
  rationale: ἐπί在此表达关注、眷顾之意；“眼目看顾”既保留原文的身体意象，也符合庄重而自然的现代汉语。
- source_word: ὦτα αὐτοῦ πρὸς δέησιν αὐτῶν
  choice: 他的耳朵垂听他们的恳求
  rationale: πρός在此表示朝向并留意；δέησις指迫切的祈求，“垂听……恳求”传达神留心倾听的含义。
- source_word: πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά
  choice: 但主的脸敌对作恶的人
  rationale: 保留πρόσωπον“脸”的具体意象，并将ἐπί在此处的敌对含义明确表达出来；与前半句的眷顾形成对照。
- source_word: ἐξολεθρεῦσαι
  choice: 除灭
  rationale: 该动词语气强烈，意为彻底消除或毁灭；“除灭”保持原文力度。
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: 对他们的记念
  rationale: μνημόσυνον可指记忆、纪念或名声留存；“对他们的记念”保留其客观记忆与身后留名之间的语义张力。
theological_decisions:
- issue: “主的脸”所表达的神人关系
  choice: 保留“主的脸”并译为“敌对”
  alternative: 译作“主向作恶的人变脸”或“主反对作恶的人”
  rationale: 原文以拟人化的“脸”表达审判性的敌对；保留意象可避免把经文简化为抽象命题，同时“敌对”清楚呈现上下文含义。
- issue: “除灭记念”的范围
  choice: 不扩展为永恒刑罚或肉身毁灭
  alternative: 译成“把他们彻底毁灭”
  rationale: 原文直接宾语是“对他们的记念”，因此译文限定在记念从地上消失，不导入原文未明说的教义结论。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话，保留“眼目、耳朵、脸”等希腊原文的身体意象和诗性对仗；“垂听”“除灭”“记念”略带经文语体，但普通读者仍易理解。
