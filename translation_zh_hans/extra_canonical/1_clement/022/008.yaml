source:
  edition: Funk 1901 (normalized OCR)
  text: πολλαὶ αἱ θλίψεις τοῦ δικαίου, καὶ ἐκ πασῶν αὐτῶν ῥύσεται αὐτὸν ὁ κύριος. 9. εἶτα· Πολλαὶ αἱ μάστιγες τοῦ ἁμαρτωλοῦ, τοὺς δὲ ἐλπίζοντας ἐπὶ κύριον ἔλεος κυκλώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/008.yaml
  text: 'Many are the afflictions of the righteous[a], and from all of them the Lord will deliver him. Then: “Many are the blows of the sinner, but mercy will surround those who hope in the Lord.”'
translation:
  language: zh_hans
  text: 义人遭遇的苦难很多，但主必救他脱离这一切。接着又说：“罪人所受的鞭打很多，但慈爱必环绕信靠主的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψεις
  choice: 苦难
  rationale: 指义人所遭遇的困苦、患难；“苦难”自然庄重，并保留词义的广度。
- source_word: δικαίου
  choice: 义人
  rationale: 将单数名词实质化表达为“义人”，符合汉语宗教文献的自然用法。
- source_word: ῥύσεται
  choice: 必救……脱离
  rationale: 准确表达从危难中施行拯救的含义，并保留希腊语将来时的肯定语气。
- source_word: μάστιγες
  choice: 鞭打
  rationale: 保留本词具体的击打、鞭笞意象，不泛化为普通的“痛苦”或“灾祸”。
- source_word: ἁμαρτωλοῦ
  choice: 罪人
  rationale: 直接对应“犯罪的人”，用语简洁且为现代读者熟悉。
- source_word: ἐλπίζοντας ἐπὶ κύριον
  choice: 信靠主的人
  rationale: 这里的盼望以主为依托；“信靠”自然表达倚赖与期待，并不把含义缩减为仅仅相信。
- source_word: ἔλεος
  choice: 慈爱
  rationale: 兼顾怜悯、恩慈与信实眷顾的语义范围；在此环绕保护的语境中，“慈爱”较自然。
- source_word: κυκλώσει
  choice: 必环绕
  rationale: 保留原文环绕四周的空间意象和将来时语气。
theological_decisions:
- issue: 义人的单数与普遍陈述
  choice: 采用“义人……他”的单数表述
  alternative: 译作“义人们……他们”
  rationale: 原文 δικαίου 与 αὐτόν 均为单数；保留单数可呈现诗歌式的典型人物，同时汉语仍能自然理解为普遍真理。
- issue: ἔλεος 的神学语义
  choice: 译为“慈爱”
  alternative: 译为“怜悯”或“恩惠”
  rationale: 原文没有明确限定为单一教义范畴；“慈爱”可容纳怜悯与恩慈，并适合“环绕”的保护性意象。
- issue: 两段引文的衔接
  choice: 用“接着又说”引出第二段引文
  alternative: 仅译作“然后”或“接着”
  rationale: εἶτα 表示文献引用继续推进；“接着又说”在汉语中明确其引文功能，而不额外指定说话者或经卷名称。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。第一句按上下文作为连续引文处理，不另加起始引号；第二句由 εἶτα 引出，使用中文引号。
