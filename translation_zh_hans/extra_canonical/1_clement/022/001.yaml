base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/001.yaml
  text: 'And And faith in Christ confirms all these things. confirms all these things. For he himself, through the Holy Spirit, thus calls us: “Come, children, listen to me; I will teach you the fear of the Lord.'
translation:
  language: zh_hans
  text: 这一切都由在基督里的信[a]证实。因为他亲自借着圣灵这样召唤我们：“来吧，孩子们，听我说；我要教导你们敬畏主。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对基督的信心”。
    reason: 说明ἐν Χριστῷ πίστις可作较明确的对象性理解，同时保留正文较贴近原文结构、较宽泛的译法。
lexical_decisions:
- source_word: βεβαιοῖ
  choice: 加以证实
  rationale: 表达“确认、使之确立”的主动语义，同时与“这一切”自然搭配。
- source_word: ἡ ἐν Χριστῷ πίστις
  choice: 在基督里的信
  rationale: 保留希腊文ἐν Χριστῷ结构可能具有的范围或关联意味，不将其完全收窄为仅指向基督的主观信靠。
- source_word: προσκαλεῖται ἡμᾶς
  choice: 召唤我们
  rationale: 中间语态在这里带有召到自己跟前的意味；“召唤我们”比“向我们呼喊”更贴近其及物用法。
- source_word: φόβον κυρίου
  choice: 敬畏主
  rationale: 中文固定而自然的宗教表达，兼具畏惧与尊崇之意。
- source_word: τέκνα
  choice: 孩子们
  rationale: 保留亲切的称呼语气，符合引文中的教导场景。
theological_decisions:
- issue: ἡ ἐν Χριστῷ πίστις的关系含义
  choice: 在基督里的信
  alternative: 对基督的信心
  rationale: 原文ἐν结构可表示处于基督领域中的信，也可能在语境中近似信靠基督；正文保留较宽的原文张力，脚注提示较明确的关系性译法。
- issue: 基督借圣灵说话
  choice: 他亲自借着圣灵这样召唤我们
  alternative: 圣灵借着经文召唤我们
  rationale: 依照原文保留αὐτός与διὰ τοῦ πνεύματος τοῦ ἁγίου的主语及媒介关系，不额外界定其启示机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引文以自然口语命令式表达；“敬畏主”保留经典宗教用语。
