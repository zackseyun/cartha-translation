  text: ἀλλ’ ἡ πρόσκλισις ἐκείνη ἧσσον ἁμαρτίαν ὑμῖν προσήνεγκεν· προσεκλίθητε γὰρ ἀποστόλοις μεμαρτυρημένοις καὶ ἀνδρὶ δεδοκιμασμένῳ παρ’ αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/004.yaml
  text: But that partiality brought less sin upon you; for you inclined yourselves toward apostles who had been approved[a], and toward a man approved by them.
translation:
  language: zh_hans
  text: 但那次偏向使你们的罪较轻，因为你们曾偏向有确实见证的使徒，以及一位经他们验证而获认可的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόσκλισις
  choice: 偏向
  rationale: 指偏向某一方或某些人的倾向；结合下文同词根的 προσεκλίθητε，保留“偏向／倾向”的词语呼应，同时不把含义过度限定为党争。
- source_word: ἧσσον ἁμαρτίαν ὑμῖν προσήνεγκεν
  choice: 使你们所犯的罪较轻
  rationale: 按语境表达“给你们带来较少的罪责”；“较轻”在现代汉语中自然，也保留与其他情形相比较的意味。
- source_word: προσεκλίθητε
  choice: 你们所倾向的是
  rationale: 该不定过去时在此回指已经发生的行为；采用“倾向”保留与 πρόσκλισις 的词根联系。
- source_word: ἀποστόλοις μεμαρτυρημένοις
  choice: 有良好见证的使徒
  rationale: μεμαρτυρημένοις 表示受到肯定见证、声誉确立；“有良好见证”比单纯“获认可”更直接保留 μαρτυρέω 的见证语义。
- source_word: ἀνδρὶ δεδοκιμασμένῳ παρ’ αὐτοῖς
  choice: 一位经他们考验而蒙认可的人
  rationale: δεδοκιμασμένῳ 是 δοκιμάζω 的完成时被动态，兼有经过检验和被证实合格、认可的结果意味；“经……考验而蒙认可”保留这两个层面。
theological_decisions:
- issue: “罪较轻”的比较对象
  choice: 不在正文中补明比较对象
  alternative: 译作“比现在的纷争罪责较轻”
  rationale: 希腊文本只说 ἧσσον（较少／较轻），比较对象须由上下文推知；不宜在本节中擅自补足。
- issue: 使徒的身份与“那个人”的身份
  choice: 维持泛称，不指名具体人物
  alternative: 把使徒解释为彼得、保罗，并把那个人解释为亚波罗或其他人物
  rationale: 本句没有明确指名；译文应保存原文开放性，避免引入特定释经传统。
- issue: μεμαρτυρημένοις 与 δεδοκιμασμένῳ 的区别
  choice: 分别译为“有良好见证”和“经考验而蒙认可”
  alternative: 两者都译作“获认可”
  rationale: 二词语义相关但不相同；区分处理能保留原文中“受见证”与“经检验获认可”的不同侧重。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“那一次偏向”对应带指示词的 ἐκείνη，并与后文“倾向”形成可感知的词语呼应；整体尽量贴近希腊句法，同时避免生硬直译。
