  text: αἰσχρά, ἀγαπητοί, καὶ λίαν αἰσχρὰ καὶ ἀνάξια τῆς ἐν Χριστῷ ἀγωγῆς ἀκούεσθαι, τὴν βεβαιοτάτην καὶ ἀρχαίαν Κορνθίων ἐκκλησίαν δι’ ἓν ἢ δύο πρόσωπα στασιάζειν πρὸς τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/006.yaml
  text: It is shameful[a], beloved—very shameful and unworthy of conduct in Christ—that it should be heard that the very steadfast and ancient church of the Corinthians is in revolt against the elders because of one or two persons.
translation:
  language: zh_hans
  text: 亲爱的弟兄姊妹，这是可耻的，极其可耻，也与在基督里的行事为人不相称：竟听说哥林多那极其坚固而历史悠久的教会，因一两个人而起来反抗众长老。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 该阳性复数称呼在教会群体语境中泛指全体蒙爱者；采用现代汉语教会书信中自然且包容的称呼。
- source_word: τῆς ἐν Χριστῷ ἀγωγῆς
  choice: 在基督里的行事为人
  rationale: ἀγωγή指生活方式、品行或行为准则；“行事为人”既自然庄重，又保留ἐν Χριστῷ这一早期基督教惯用表达。
- source_word: βεβαιοτάτην
  choice: 极其坚固
  rationale: 保留最高级所表达的高度稳固、坚定之意，不把它改释为单纯的名望或忠诚。
- source_word: ἀρχαίαν
  choice: 历史悠久
  rationale: 此处描述教会建立已久；相较“古老”，“历史悠久”在现代汉语中更自然，也不暗示远古时代。
- source_word: στασιάζειν πρὸς τοὺς πρεσβυτέρους
  choice: 起来反抗众长老
  rationale: στασιάζειν表示结党、叛乱或发生派系冲突，πρός标明针对长老；“起来反抗”传达冲突的严重性，同时避免过度限定为政治叛乱。
theological_decisions:
- issue: ἐν Χριστῷ中Χριστός的译法
  choice: 在基督里
  alternative: 在弥赛亚里
  rationale: 在本书信及其保罗式语境中，该表达已是固定的早期基督教用语；译作“基督”最能传达原受众熟悉的称谓和表达，同时不否认其弥赛亚含义。
- issue: πρεσβύτεροι所指职分
  choice: 长老
  alternative: 年长者
  rationale: 上下文涉及哥林多教会中的群体领导者，译作“长老”较为准确；但不进一步导入后世宗派化的职制定义。
translation_notes:
  register: 采用现代、庄重而易懂的书信劝诫语体。保留原文由“可耻”到“极其可耻”的强调，并以冒号自然引出所听闻的丑事。
