source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡ ἀκοὴ οὐ μόνον εἰς ἡμᾶς ἐχώρησεν, ἀλλὰ καὶ εἰς τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν, ὥστε καὶ βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου διὰ τὴν ὑμετέραν ἀφροσύνην, ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/007.yaml
  text: And the report has reached not only us[a], but also those who are estranged from us, so that even blasphemies are brought upon the name of the Lord because of your foolishness[b], while you bring danger upon yourselves.
translation:
  language: zh_hans
  text: 这消息不但传到了我们这里，也传到了那些与我们疏远的人[a]那里，以致主的名甚至因你们的愚妄而遭到亵渎，而你们自己也给自己招来危险。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些与我们立场相异的人”。
    reason: 原词可表示疏离、背离或倾向另一方；上下文可能指信徒群体以外的人，但没有直接点明其身份。
lexical_decisions:
- source_word: ἡ ἀκοή
  choice: 这消息
  rationale: 字面义为“听闻、所听见的事”，在此指有关哥林多纷争的传闻；译为“这消息”符合现代汉语语境。
- source_word: ἐχώρησεν
  choice: 传到了
  rationale: 此处表示消息传播并抵达某处，“传到了”自然表达其完成体语义。
- source_word: τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν
  choice: 那些与我们疏远的人
  rationale: ἑτεροκλινής 有“倾向另一方、背离、相异”之意，与 ἀφ’ ἡμῶν 连用，指与基督徒群体疏离或站在不同立场的人；此译既符合上下文中的外部人士，也不把身份限定得超过原文。
- source_word: ὥστε καὶ
  choice: 以致……甚至
  rationale: ὥστε 引出结果，καί 在这里具有递进、加强作用，故保留“甚至”。
- source_word: βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου
  choice: 主的名……遭到亵渎
  rationale: 原文被动结构直指亵渎临到主名；汉语用“遭到亵渎”庄重自然，并保留受事焦点。
- source_word: ἀφροσύνην
  choice: 愚妄
  rationale: 不仅表示缺乏才智，也含不明智和道德失当之意；“愚妄”适合劝诫语体。
- source_word: ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι
  choice: 而你们自己也给自己招来危险
  rationale: ἐξεργάζομαι 表示造成、招致某种结果；重复“自己……给自己”再现反身代词的强调。
theological_decisions:
- issue: “与我们疏远的人”的身份
  choice: 不明确限定为非基督徒，只译出他们与“我们”疏离的关系
  alternative: 译作“外邦人”或“非基督徒”
  rationale: 上下文很可能指教会外的人，但原文本身使用关系性描述，而非明确的宗教身份称谓；保留这一开放度可避免过度解释。
- issue: 亵渎所针对的对象
  choice: 译为“主的名……遭到亵渎”
  alternative: 译为“人因此说亵渎主名的话”
  rationale: 原文以“主的名”为间接受事，强调信徒的行为使主名蒙受亵渎；采用被动表达可保存这一神学重心。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“不但……也……以致……甚至……”保留原文递进结构；末句用“给自己招来危险”使汉语自然，同时保留反身强调。
