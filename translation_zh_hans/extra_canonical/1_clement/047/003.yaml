  text: ἐπ’ ἀληθείας πνευματικῶς ἐπέστειλεν ὑμῖν περὶ ἑαυτοῦ τε καὶ Κηφᾶ τε καὶ Ἀπολλώ, διὰ τὸ καὶ τότε προσκλίσεις ὑμᾶς πεποιῆσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/003.yaml
  text: In truth, he wrote to you spiritually about himself and Cephas and Apollos, because even then you had made partialities.
translation:
  language: zh_hans
  text: 诚然，他曾从属灵的角度写信给你们，谈到他自己、矶法和亚波罗，因为早在那时，你们就已经各有所偏向[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “偏向”原文可指对某一方的倾斜或偏爱；在这里也可能包含依附不同领袖、形成派别的意思。
    reason: 保留προσκλίσεις从偏爱到党派倾向的语义范围。
lexical_decisions:
- source_word: πνευματικῶς
  choice: 以属灵的方式
  rationale: 保留副词的表达形式，指这封信具有属灵的性质或出于属灵的引导；不在正文中径直限定为“在圣灵里”。
- source_word: ἐπέστειλεν
  choice: 写信给
  rationale: 该动词在此指写信并寄予收信人；现代汉语用“写信给”自然清楚。
- source_word: Κηφᾶ
  choice: 矶法
  rationale: 采用现代中文圣经读者熟悉的闪语名字译法，并与“亚波罗”并列。
- source_word: προσκλίσεις
  choice: 各有所偏向
  rationale: 原词基本含义是倾向、偏向；此译法既符合哥林多群体分别依附不同人物的语境，又避免直接把语义收窄为已经组织化的“派系”。
- source_word: καὶ τότε
  choice: 早在那时……就
  rationale: 在自然现代汉语中表达“甚至在当时／当时已经”的强调意味。
theological_decisions:
- issue: πνευματικῶς是否明确指圣灵的直接默示
  choice: 以属灵的方式
  alternative: 在圣灵里／受圣灵感动
  rationale: 希腊副词可描述属灵的性质或方式，虽可能蕴含圣灵的引导，却未明确使用“圣灵”一词；正文保留这一开放性。
- issue: προσκλίσεις所指的是偏爱还是成形的党派
  choice: 各有所偏向
  alternative: 结党／形成派系
  rationale: 上下文涉及围绕保罗、矶法和亚波罗的群体倾向，但该词本身侧重倾斜、偏向。采用较宽的译法，以保留从偏爱到党派倾向之间的语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“事实上”对应强调语气；“论到”略带书面色彩但易于理解。“早在那时……就已经”清楚传达时间上的强调。
