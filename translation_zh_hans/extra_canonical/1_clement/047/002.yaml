  text: 在福音传扬之初，他首先给你们写了什么？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: 什么
  rationale: 保留直接疑问句的形式。
- source_word: πρῶτον
  choice: 首先
  rationale: 修饰“写”，表达所写内容或次序上的“第一”，不额外限定为某一封书信。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 保留复数第二人称，指向哥林多群体。
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: 在福音传扬之初
  rationale: εὐαγγέλιον 可指福音信息，也可在语境中指福音事业的开展；译作“福音传扬”使汉语自然，同时避免误解为某卷福音书的开头。
- source_word: ἔγραψεν
  choice: 写了
  rationale: 按简单过去时译出保罗从前写信的动作。
theological_decisions:
- issue: “福音之初”的所指
  choice: 在福音传扬之初
  alternative: 在福音开始的时候／在福音之初
  rationale: 上下文回顾哥林多教会早期与保罗的通信；此译法保留福音历史进程的含义，却不武断指定为某一事件或文献。
translation_notes:
  register: 采用庄重而自然的现代汉语问句。“他”承接上文所指的使徒保罗；本节自身不补出其名，以保留原文的衔接方式。
