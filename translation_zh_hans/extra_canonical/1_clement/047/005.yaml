  text: νυνὶ δὲ κατανοήσατε, τίνες ὑμᾶς διέστρεψαν καὶ τὸ σεμνὸν τῆς περιβοήτου φιλαδελφίας ὑμῶν ἐμείωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/005.yaml
  text: But now consider who led you astray and diminished the dignity of your renowned brotherly love[a][b].
translation:
  language: zh_hans
  text: 但如今，你们要仔细想想：究竟是哪些人使你们误入歧途[a]，又损害了你们那素有盛名[b]的弟兄之爱的尊严。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扭曲了你们”或“使你们败坏了”。
    reason: 希腊词διέστρεψαν可指使人偏离正道，也可带有扭曲、败坏之意；正文取其在此处语境中自然的“使人误入歧途”之义。
  - marker: b
    text: 也可译作：“广为传扬”。
    reason: περιβόητος字面带有“到处被人谈论”的意味；在此处修辞语境中指素有盛名、广为人知。
lexical_decisions:
- source_word: κατανοήσατε
  choice: 要仔细想想
  rationale: 该词表示认真留意、思量或审视；此处是劝诫语气，“要仔细想想”自然传达其命令意味。
- source_word: τίνες
  choice: 究竟是哪些人
  rationale: 希腊文疑问代词为复数，明确指向不止一位的肇事者；“哪些人”保留这一语法信息。
- source_word: διέστρεψαν
  choice: 使你们误入歧途
  rationale: 该词可指扭曲、败坏或使人偏离正道；结合群体受人煽动而纷争的语境，正文采用自然且不过度生硬的表达，并以脚注保留更直接的译法。
- source_word: τὸ σεμνὸν
  choice: 所具有的庄重
  rationale: 中性名词化结构指某事物庄严、可敬的特质；译为“所具有的庄重”既保留抽象性质，也使中文句法清楚。
- source_word: περιβοήτου
  choice: 声名远扬
  rationale: 该词表示广为人知、著名；“声名远扬”符合此处较高雅的修辞语体。
- source_word: φιλαδελφίας
  choice: 弟兄之爱
  rationale: 在早期基督徒群体语境中指信徒彼此之间如弟兄般的爱；“弟兄之爱”简洁保留其亲属隐喻。
- source_word: ἐμείωσαν
  choice: 贬损了
  rationale: 该动词意为使减少、降低；在“庄重”这一抽象宾语前，“贬损”自然表达使其尊严或可敬程度降低。
theological_decisions:
- issue: διέστρεψαν所表达的是外在误导还是内在败坏
  choice: 正文译为“使你们误入歧途”
  alternative: “扭曲了你们”或“败坏了你们”
  rationale: 原词容许“使偏离”与“扭曲、败坏”等色彩。上下文关注某些人造成的纷争，正文突出误导结果，但不将其限定为某种特定的道德或教义败坏。
- issue: φιλαδελφία的群体范围
  choice: 译为“弟兄之爱”
  alternative: “手足之爱”或“彼此相爱”
  rationale: 保留原文以家人关系描述共同体之爱的隐喻，同时不额外界定其制度性或宗派性范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面中文。以“究竟是哪些人”凸显原文复数疑问主体；句末稍作展开，以自然呈现τὸ σεμνὸν这一名词化结构。脚注保留关键词的真实语义幅度，不以特定宗派解释消解原文张力。
