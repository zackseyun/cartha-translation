  yaml_path: translation/extra_canonical/1_clement/047/001.yaml
  text: Take up the letter of the blessed Paul the apostle.
translation:
  language: zh_hans
  text: 请拿起蒙福的使徒保罗所写的那封信。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναλάβετε
  choice: 请拿起
  rationale: 保留命令语气及“取来、拿起”的具体动作感；加“请”使现代汉语表达庄重自然，而不削弱劝告力度。
- source_word: τὴν ἐπιστολὴν
  choice: 那封信
  rationale: 定冠词在语境中指向收信人熟知的特定书信，现代汉语用“那封信”自然体现这一特指。
- source_word: τοῦ μακαρίου
  choice: 蒙福的
  rationale: μακάριος可指有福、蒙福或受称颂者；“蒙福的”保留宗教语境中的尊敬意味，同时避免译成“已故的”而加入原文未明说的信息。
- source_word: Παύλου τοῦ ἀποστόλου
  choice: 使徒保罗
  rationale: 按现代汉语的自然称谓次序表达同位关系，准确保留保罗的使徒身份。
- source_word: τοῦ ἀποστόλου
  choice: 所写的
  rationale: 两个属格在汉语中若直译为“蒙福的使徒保罗的信”略显生硬；补出关系词“所写的”，清楚表达书信归属，不增加实质信息。
theological_decisions:
- issue: μακάριος是否暗示保罗已经去世
  choice: 译为“蒙福的”
  alternative: “已故的”或“可敬的”
  rationale: 原词本身并不必然明说死亡；译文保留其尊崇和蒙福含义，不把可能的历史语用推断写入正文。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。句式保持直接劝告的力度，并以“所写的”避免连续属格造成的欧化表达。
