  text: καὶ πάλιν λέγει· Θῦσον τῷ θεῷ θυσίαν αἰνέσεως καὶ ἀπόδος τῷ ὑψίστῳ τὰς εὐχάς σου· καὶ ἐπικαλέσαι με ἐν ἡμέρᾳ θλίψεώς σου, καὶ ἐξελοῦμαί σε, καὶ δοξάσεις με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/003.yaml
  text: And again he says, “Offer to God a sacrifice of praise, and pay your vows to the Most High; and call upon me in the day of your affliction, and I will deliver you, and you will glorify me.”
translation:
  language: zh_hans
  text: 他又说：“要把赞美的祭献给上帝，向至高者偿还你的誓愿；在你遭患难的日子呼求我，我必搭救你，你也必荣耀我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θῦσον ... θυσίαν αἰνέσεως
  choice: 把赞美的祭献给
  rationale: 保留原文“献祭—祭物”的同源表达及祭祀意象，同时使现代汉语自然流畅。
- source_word: ἀπόδος ... τὰς εὐχάς σου
  choice: 还你所许的愿
  rationale: εὐχάς 在此承接诗篇引文语境，指向向上帝所许的愿；“还愿”准确表达履行誓愿，而非泛指祷告。
- source_word: τῷ ὑψίστῳ
  choice: 至高者
  rationale: 采用庄重且通行的神圣称谓，并保留定冠称号的性质。
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: 在你遭患难的日子
  rationale: θλῖψις 可指困苦、压迫或患难；“遭患难”保持宽泛含义，避免限定为某一种苦难。
- source_word: ἐξελοῦμαί σε
  choice: 我必搭救你
  rationale: 表达从困境中救出的动作；“搭救”较“拯救”更直接体现处境性解救，也不额外限定为终末或属灵救恩。
- source_word: δοξάσεις με
  choice: 你也必荣耀我
  rationale: 保留将荣耀归给上帝的神学语义，以及直陈未来时的确定语气。
theological_decisions:
- issue: “赞美的祭”是字面祭物还是比喻性敬拜
  choice: 保留“赞美的祭”的原始祭祀意象
  alternative: 献上赞美作为祭物
  rationale: 原文以 θῦσον 与 θυσίαν 构成同源强化，译文不应替作者解释其字面与比喻层面的关系。
- issue: ἐξελοῦμαί 的救援范围
  choice: 译为处境中性的“搭救”
  alternative: 拯救
  rationale: 本句直接语境是“患难的日子”，因此避免让译词自动带入更专门的救恩论含义。
translation_notes:
  register: 采用现代、庄重、易懂的经文体。引语内用平行分句保持希腊文和诗篇引文的节奏；不增设脚注，因为正文可充分传达原文，且没有必须标示的文本异读或不可兼顾的歧义。
