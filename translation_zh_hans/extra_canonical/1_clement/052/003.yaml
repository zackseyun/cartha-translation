  to: 他又说：“要把赞美的祭献给上帝，向至高者偿还你的誓愿；在你遭患难的日子呼求我，我必搭救你，你也必荣耀我。”
  rationale: 仅作一处措辞调整，以改善“偿还誓愿”的现代汉语搭配，并更明确保留原文“向至高者偿还”的对象关系；其余译文无需改动。
