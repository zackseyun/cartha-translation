  text: φησὶ γὰρ ὁ ἐκλεκτὸς Δαυίδ· Ἐξομολογήσομαι τῷ κυρίῳ, καὶ ἀρέσει αὐτῷ ὑπὲρ μόσχον νέον κέρατα ἐκφέροντα καὶ ὁπλάς· ἰδέτωσαν πτωχοὶ καὶ εὐφρανθήτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/002.yaml
  text: For the chosen David says[a], “I will give thanks to the Lord, and it will please him more than a young bull with horns and hooves. Let the poor see and be glad.”
translation:
  language: zh_hans
  text: 因为蒙拣选的大卫说：“我要称谢主；这必比一头长出角和蹄的小公牛[a]更蒙他喜悦。愿贫穷的人看见，便欢喜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一头正在长出角和蹄的小公牛”。
    reason: ἐκφέροντα可指“长出、正在长出”；正文以较自然的定语表达，脚注保留其动态含义。
lexical_decisions:
- source_word: ὁ ἐκλεκτὸς Δαυίδ
  choice: 蒙拣选的大卫
  rationale: 保留定冠词加形容词所表达的称号性质，同时用现代汉语自然表达“被拣选”。
- source_word: Ἐξομολογήσομαι
  choice: 我要称谢
  rationale: 该词可指承认、称颂或感谢；在此诗篇语境中，以献祭作比较，译作“称谢”最切合，同时不限定为单纯的感恩。
- source_word: ἀρέσει αὐτῷ ὑπέρ
  choice: 这必比……更蒙他喜悦
  rationale: 准确表达比较结构，并以自然庄重的现代汉语呈现。
- source_word: μόσχον νέον
  choice: 幼牛
  rationale: 表达尚年轻的牛，避免“新牛”等生硬说法。
- source_word: κέρατα ἐκφέροντα καὶ ὁπλάς
  choice: 长出角和蹄的
  rationale: ἐκφέροντα在此指长出或生出；保留原文对幼牛发育特征的具体描写。
- source_word: πτωχοὶ
  choice: 贫穷的人
  rationale: 采用该词通常的社会经济含义，不擅自收窄为属灵谦卑者或扩大为泛指受苦者。
- source_word: ἰδέτωσαν … καὶ εὐφρανθήτωσαν
  choice: 愿……看见就欢喜
  rationale: 以“愿”体现两个第三人称命令式的祈愿、劝愿语气；“就”自然连接看见与欢喜。
theological_decisions:
- issue: 称谢与献祭的比较
  choice: 保留“比……更蒙他喜悦”的直接比较
  alternative: 解释为神拒绝或废除一切祭牲
  rationale: 原文只陈述称谢较幼牛更蒙悦纳，并未在此明确否定整个献祭制度，不应加入额外神学结论。
- issue: πτωχοὶ的身份
  choice: 译作“贫穷的人”
  alternative: 译作“谦卑的人”或“困苦人”
  rationale: “贫穷”是最直接的词义，也保留其可能兼具社会处境与宗教含义的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。引文保持诗歌式的简洁与祈愿语气；不沿用生硬的逐词结构，也不把原文的比较扩展成教义解释。
