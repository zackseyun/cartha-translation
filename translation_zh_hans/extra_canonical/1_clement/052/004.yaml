  text: 因为献给上帝的祭，就是破碎的心灵。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία
  choice: 祭
  rationale: 直译为献给上帝的祭物或祭献；此处用简洁的“祭”保留原文献祭意象。
- source_word: πνεῦμα
  choice: 心灵
  rationale: 此处指人的内在精神状态；“心灵”比单用“灵”更符合现代汉语，同时不把含义限定为情绪或思想。
- source_word: συντετριμμένον
  choice: 破碎的
  rationale: 保留该词由压碎、击碎引申出的痛悔与谦卑意象，不直接释义为“痛悔”，以避免消解原文隐喻。
theological_decisions:
- issue: 献祭意象与内在状态的关系
  choice: 保留“祭，就是破碎的心灵”的判断句式
  alternative: 译作“上帝所要的祭是痛悔的心”
  rationale: 原文直接把“祭”与“破碎的心灵”对应，并未明说“所要的”；保留这一张力，避免添加解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留原文简短的格言式结构及“破碎”的诗性隐喻。
