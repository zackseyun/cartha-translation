  yaml_path: translation/extra_canonical/1_clement/052/001.yaml
  text: The Master of all is without need, brothers; he needs nothing from anyone except that confession be made to him.
translation:
  language: zh_hans
  text: 弟兄们，万有的主一无所缺；他不需要从任何人得着任何东西，除了人向他承认[a]以外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承认”在此语境中可指向神承认自己的罪，即“认罪”；该希腊语词也可指“称谢”或“颂赞”。
    reason: ἐξομολογεῖσθαι 可用于公开承认、认罪，也可指向神称谢或颂赞。正文保留原文未明示宾语的表达，脚注说明本段上下文所支持的认罪含义及其词义范围。
lexical_decisions:
- source_word: Ἀπροσδεής
  choice: 一无所缺
  rationale: 表达“不依赖外物、毫无欠缺”的含义，并与下句“不需要”形成自然呼应。
- source_word: ὁ δεσπότης τῶν ἁπάντων
  choice: 万有的主
  rationale: δεσπότης 表示拥有权柄的主人或主宰；“万有的主”简洁保留其统辖一切的意味。
- source_word: οὐδενὸς οὐδὲν χρῄζει
  choice: 不需要任何人提供任何东西
  rationale: 同时呈现 οὐδενός（任何人）和 οὐδέν（任何东西）的双重表达，保留“他不从任何人那里需要任何东西”的关系性重点。
- source_word: ἐξομολογεῖσθαι αὐτῷ
  choice: 向他认罪
  rationale: 在本段劝人悔改并引用认罪诗篇的语境中，ἐξομολογεῖσθαι 主要指向神承认、坦白罪；脚注保留“称谢/颂赞”的词义可能。
theological_decisions:
- issue: 神“不需要”却又以 εἰ μή 引出人的回应
  choice: 保留“只要”所表达的例外式措辞
  alternative: 译作“他所要的只是”
  rationale: 原文在神全然无缺与人应当向他认罪之间形成张力；不把后半句解释为神因欠缺而有所需要。
- issue: ἐξομολογεῖσθαι 的含义
  choice: 正文译为“认罪”
  alternative: “称谢”或“颂赞”
  rationale: 上下文更支持认罪，但该动词可用于称谢或颂赞，因此以脚注保存真实词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“弟兄们”保留早期教会劝勉语气；“万有的主”避免生硬直译，同时保留 δεσπότης 的权柄色彩。
