  text: Many women[a], strengthened through the grace of God, accomplished many courageous deeds.
translation:
  language: zh_hans
  text: 许多妇女借着上帝的恩典得到力量，做出了许多英勇的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“许多有男子气概的事。”原词在词源上与“男子”相关；但在这里主要表示勇敢、英勇。
    reason: 保留ἀνδρεῖα在用于妇女时可能具有的词源色彩和修辞张力，同时明确其在本句中的主要语义。
lexical_decisions:
- source_word: ἐνδυναμωθεῖσαι
  choice: 得着力量
  rationale: 该词为被动分词，表示她们受到了加力；“得着力量”自然保留被动含义，并与后面的施事途径相配。
- source_word: διὰ τῆς χάριτος τοῦ θεοῦ
  choice: 借着上帝的恩典
  rationale: διά加属格表示媒介或途径；“借着”准确传达这一关系。
- source_word: ἐπετέλεσαν
  choice: 成就了
  rationale: 表达完成、实行并达成之意；“成就”兼具庄重与行动成果的意味。
- source_word: ἀνδρεῖα
  choice: 英勇的事
  rationale: 此处作实质性用法，主要指勇敢、英勇的行动；译法自然，并避免现代汉语“男子汉的事”可能引起的误解。
theological_decisions:
- issue: 力量与上帝恩典的关系
  choice: 借着上帝的恩典得着力量
  alternative: 靠上帝的恩典刚强起来
  rationale: 保留原文被动分词与διά所表达的媒介关系，不进一步界定恩典如何发挥作用。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式紧贴希腊文逻辑次序，同时避免生硬直译；“许多……许多……”保留原文的重复强调。
