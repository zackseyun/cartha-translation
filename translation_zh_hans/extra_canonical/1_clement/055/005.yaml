  text: παραδοῦσα οὖν ἑαυτὴν τῷ κινδύνῳ ἐξῆλθεν δι’ ἀγάπην τῆς πατρίδος καὶ τοῦ λαοῦ τοῦ ὄντος ἐν συγκλεισμῷ, καὶ παρέδωκεν κύριος Ὀλοφέρνην ἐν χειρὶ θηλείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/005.yaml
  text: So then[a], handing herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord handed Holofernes over into the hand of a woman.
translation:
  language: zh_hans
  text: 于是，她因爱祖国和被围困的人民，把自己交给危险，走了出去；主把何罗斐乃交在一名女子手中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοῦσα … παρέδωκεν
  choice: 把自己交于……把何罗斐乃交在……手中
  rationale: 原文在人的自我交付与主的交付之间重复使用同一动词 παραδίδωμι；中文保留“交”字的呼应，以呈现这一修辞和主题联系。
- source_word: κίνδυνος
  choice: 险境
  rationale: 指她主动面对的危险处境；“交于险境”既贴近原文，也保持庄重简洁。
- source_word: πατρίς
  choice: 祖国
  rationale: 在这里指她所属并所爱的本国或故土；“祖国”符合现代汉语语境。
- source_word: ἐν συγκλεισμῷ
  choice: 被围困
  rationale: 字面涉及被封闭、围住；结合叙事情境，指人民处于围城困境，“被围困”自然且准确。
- source_word: ἐν χειρὶ θηλείας
  choice: 在一个女子手中
  rationale: 保留闪语式“在……手中”的表达，并将 substantival feminine θηλείας 自然译作“一个女子”，不把它抽象化为“女性之手”。
- source_word: Ὀλοφέρνην
  choice: 何罗斐乃
  rationale: 按该人物希腊文名 Ὀλοφέρνης 音译，并在宾格形式下仍采用统一中文专名。
theological_decisions:
- issue: 主在事件中的行动与女子冒险行动之间的关系
  choice: 以分号并列两个分句，并保留“交”字重复
  alternative: 将后半句解释为对女子行为的奖赏或因果结果
  rationale: 原文用 καί 连接，却没有明确说明神学上的奖赏机制；译文保留并列及其内在张力，不额外补出因果解释。
- issue: κύριος 是否加定冠词式称谓
  choice: 主
  alternative: 上主／那位主
  rationale: 希腊文 κύριος 在此指神；“主”简洁、通行，也不引入特定宗派措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句法尽量贴近希腊文推进次序，并通过两次“交”保留原文刻意的词语回响；“因着”略带书面色彩，但在此能清楚表达 δι’ ἀγάπην 的动因。
