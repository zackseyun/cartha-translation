- from: 于是，她把自己交于险境，因着对祖国和被围困之人民的爱而走了出去；主也把何罗斐乃交在一个女子手中。
  to: 于是，她因爱祖国和被围困的人民，把自己交给危险，走了出去；主把何罗斐乃交在一名女子手中。
  rationale: 仅作现代汉语搭配和语体调整。“交给危险”与“交在一名女子手中”保留原文在人自我交付和主交付何罗斐乃之间的动词呼应；语序仍清楚表达她出去的动因是对祖国和被围困之民的爱。原文及英文审校轨迹中的替代译法脚注并非本节的源文释义脚注，草案亦无相应中文锚点，故无需增设脚注。
