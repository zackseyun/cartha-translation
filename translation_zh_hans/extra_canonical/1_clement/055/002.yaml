  text: We know of many among us who have handed themselves over to chains so that they might ransom others. Many handed themselves over into slavery, and after receiving the price for themselves, they fed others.
translation:
  language: zh_hans
  text: 我们知道，我们中间有许多人把自己置于锁链之下，为要赎救别人；许多人又把自己卖为奴隶，得到自己的身价后，供给别人食物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστάμεθα
  choice: 我们知道
  rationale: 直接表达确知，符合上下文中的共同见闻。
- source_word: παραδεδωκότας ἑαυτοὺς εἰς δεσμά
  choice: 曾把自己交出去受捆绑
  rationale: 保留主动自我交付和进入束缚状态两层意思；“受捆绑”较自然，也不把 δεσμά 过度限定为监牢。
- source_word: ὅπως ἑτέρους λυτρώσωνται
  choice: 为要赎出别人
  rationale: λυτρόομαι 表示付出代价使人脱离束缚；“赎出”保留赎价意象及行动结果。
- source_word: παρέδωκαν εἰς δουλείαν
  choice: 把自己卖为奴隶
  rationale: 原文直义为“把自己交付于奴役”；结合下文取得身价，“卖为奴隶”在现代汉语中清楚呈现所指情境。
- source_word: λαβόντες τὰς τιμὰς αὐτῶν
  choice: 收了自己的身价
  rationale: τιμή 在交易语境中指价钱；“身价”在卖身为奴的语境中表示其所得价款，同时避免添加原文没有明说的付款主体。
- source_word: ἑτέρους ἐψώμισαν
  choice: 用来供别人吃饭
  rationale: ψωμίζω 指给人食物、喂养；加入“用来”自然连接所得身价与供养他人的行动，未改变逻辑。
