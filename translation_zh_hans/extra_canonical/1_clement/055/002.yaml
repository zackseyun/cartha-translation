  - severity: low
    issue: “用来供别人吃饭”较口语化，且“供”不如“供给食物”直接对应 ψωμίζω。
    rationale: ψωμίζω 指给人食物、喂养。改作“得到自己的身价后，供给别人食物”保留先后关系和语义重点，不额外断定价款必然作为唯一资金来源。
  revised_text: 我们知道，我们中间有许多人把自己置于锁链之下，为要赎救别人；许多人又把自己卖为奴隶，得到自己的身价后，供给别人食物。
