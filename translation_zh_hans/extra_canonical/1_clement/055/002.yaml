revisions:
- from: 我们知道，在我们中间有许多人曾把自己交出去受捆绑，为要赎出别人；也有许多人把自己卖为奴隶，收了自己的身价，用来供别人吃饭。
  to: 我们知道，我们中间有许多人把自己置于锁链之下，为要赎救别人；许多人又把自己卖为奴隶，得到自己的身价后，供给别人食物。
  rationale: 修订仅改善现代汉语的自然度，并更明确反映 δεσμά 的“锁链”及 ψωμίζω 的“供给食物”。保留原文两次“许多人”的平行、主动自我交付、为他人得赎的目的，以及取得自身价款后供养他人的时序；未加入付款者、被囚者身份或教义性解释。
