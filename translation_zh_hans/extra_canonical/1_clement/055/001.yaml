  naturalness: 整体通顺庄重。“交出自己受死”略显生硬，改为“把自己交付于死”更符合现代书面汉语，同时保留原文主动投身死亡的力度。
  terminology: “神谕”“借着自己的血”“君王和领袖”均合宜；“外邦”在此是对ἐθνῶν的语境性、非现代国族化表达，且不把“例证”误说为“人”。
