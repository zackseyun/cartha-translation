  text: Ἵνα δὲ καὶ ὑποδείγματα ἐθνῶν ἐνέγκωμεν· πολλοὶ βασιλεῖς καὶ ἡγούμενοι, λοιμικοῦ τινος ἐνστάντος καιροῦ, χρησμοδοτηθέντες παρέδωκαν ἑαυτοὺς εἰς θάνατον, ἵνα ῥύσωνται διὰ τοῦ ἑαυτῶν αἵματος τοὺς πολίτας· πολλοὶ ἐξεχώρησαν ἰδίων πόλεων, ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/001.yaml
  text: 'And so, to bring forward examples even from the nations: many kings and rulers, when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death so that through their own blood they might rescue their citizens. Many departed from their own cities so that they might no longer be torn by faction.'
translation:
  language: zh_hans
  text: 再举一些出自外邦的例证：许多君王和领袖，在某种瘟疫危机临到时，领受神谕的指示，便把自己交付于死，为要借着自己的血拯救他们的城民。许多人离开各自的城，免得他们继续结党纷争。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθνῶν
  choice: 外族人
  rationale: 这里指犹太—基督徒群体以外的诸民族；译作“外族人”自然清楚，也避免现代“国家”概念。
- source_word: λοιμικοῦ τινος ἐνστάντος καιροῦ
  choice: 某场瘟疫危机临到时
  rationale: λοιμικός 指瘟疫性的灾难，καιρός 在此指危急时势；合译既保留疫病含义，也体现危机语境。
- source_word: χρησμοδοτηθέντες
  choice: 领受了神谕
  rationale: 该分词指得到神谕指示，不表示作者认可神谕的真实性。
- source_word: παρέδωκαν ἑαυτοὺς εἰς θάνατον
  choice: 交出自己受死
  rationale: 保留主动献身及走向死亡的力度，而不额外加入献祭等原文未明说的观念。
- source_word: τοὺς πολίτας
  choice: 本城的居民
  rationale: πολίτης 是城邦共同体的成员；语境下译为“本城的居民”比现代政治意味较强的“公民”更易理解。
- source_word: ἐξεχώρησαν ἰδίων πόλεων
  choice: 离开自己的城
  rationale: 忠实表达主动退出、离城，且不擅自说明流亡或放逐。
- source_word: ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον
  choice: 好让纷争不再加剧
  rationale: στασιάζω 可指结党争斗或发生内乱；原句主语存在语义上的含混，采用非特指施事者的中文表达，保留其开放性。
theological_decisions:
- issue: 异教神谕的地位
  choice: 直译为“领受了神谕”
  alternative: “得到神的指示”
  rationale: 避免把异教 oracle 神学化为真神的启示，也不加入贬义判断。
- issue: 以血施救的性质
  choice: “借着自己的血拯救本城的居民”
  alternative: “以自己的血赎回本城居民”
  rationale: ῥύσωνται 表示解救、救出，并不必然具有赎罪或代赎的专门神学含义，因此不用“赎回”。
- issue: 末句纷争的主体
  choice: 用“好让纷争不再加剧”保留含混
  alternative: “免得他们继续引起纷争”或“免得城中人继续纷争”
  rationale: 希腊文 στασιάζωσιν 的省略主语可按离城者理解，也可从事件结果理解；不应武断限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“君王和领袖”“交出自己受死”等措辞保留古代语境的分量；末句以自然中文保存希腊文主语上的含混。
