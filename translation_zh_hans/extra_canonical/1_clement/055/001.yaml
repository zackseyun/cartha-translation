  rationale: 修订“外族人的例子”以准确表达“来自列邦的例证”，并将“交出自己受死”调整为自然且忠实的“把自己交付于死”。末句以“各自的城”和复数代词对应原文复数形式；代词所指仍未被具体化，因此不引入原文没有说明的历史或解释性限定。
