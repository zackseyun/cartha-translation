  text: Ἰουδὶθ ἡ μακαρία, ἐν συγκλεισμῷ οὔσης τῆς πόλεως, ᾐτήσατο παρὰ τῶν πρεσβυτέρων ἐαθῆναι αὐτὴν ἐξελθεῖν εἰς τὴν παρεμβολὴν τῶν ἀλλοφύλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/004.yaml
  text: The blessed Judith[a], when the city was under siege, asked the elders to permit her to go out into the camp of the foreigners.
translation:
  language: zh_hans
  text: 蒙福的犹滴，在城被围困时，请求长老们准许她出去，进入外族人的营地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰουδὶθ
  choice: 犹滴
  rationale: 采用该人物在现代中文圣经传统中通行的译名。
- source_word: ἡ μακαρία
  choice: 蒙福的
  rationale: μακαρία表示蒙福、福乐或有福；“蒙福的”庄重自然，并保留称许意味。
- source_word: ἐν συγκλεισμῷ οὔσης τῆς πόλεως
  choice: 在城被围困时
  rationale: 按属格绝对结构表达背景；συγκλεισμός在此指城市受封锁、围困。
- source_word: ᾐτήσατο παρὰ τῶν πρεσβυτέρων
  choice: 请求长老们
  rationale: παρά加属格标明请求所向的对象；汉语直接说“请求长老们”最自然，不另加无必要的脚注。
- source_word: ἐαθῆναι αὐτὴν ἐξελθεῖν
  choice: 准许她出去
  rationale: 保留被准许离开的含义，并依汉语习惯将不定式结构处理为“请求……准许她……”。
- source_word: εἰς τὴν παρεμβολὴν τῶν ἀλλοφύλων
  choice: 进入外族人的营地
  rationale: παρεμβολή在军事语境中是营地；ἀλλόφυλοι字面为异族、外族之人，此处不特定译作某一民族。
