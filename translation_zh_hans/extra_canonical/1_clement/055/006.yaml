  - severity: medium
    issue: “自卑”在现代汉语中容易理解为自我否定或自卑感。
    rationale: ταπείνωσις与禁食并列时，指人在上帝面前有意谦卑、降卑自己；“降卑自己”更准确且避免现代语义歧义。
