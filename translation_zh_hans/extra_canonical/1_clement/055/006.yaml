source:
  edition: Funk 1901 (normalized OCR)
  text: οὐχ ἧττον καὶ ἡ τελεία κατὰ πίστιν Ἐσθὴρ κινδύνῳ ἑαυτὴν παρέβαλεν, ἵνα τὸ δωδεκάφυλον τοῦ Ἰσραὴλ μέλλον ἀπολέσθαι ῥύσηται· διὰ γὰρ τῆς νηστείας καὶ τῆς ταπεινώσεως ἠξίωσεν τὸν παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων· ὃς ἰδὼν τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς ἐρύσατο τὸν λαόν, ὧν χάριν ἐκινδύνευσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/006.yaml
  text: And no less also Esther[a], perfect according to faith, put herself in danger so that she might rescue the twelve-tribed people of Israel, who were about to perish. For through fasting and humiliation she entreated the all-seeing Master, God of the ages; and he, seeing the humility of her soul[c][b], rescued the people for whose sake she had faced danger.
translation:
  language: zh_hans
  text: 同样不逊色的，还有那位在信仰上完全的以斯帖；她曾置身险境，为要拯救行将灭亡的以色列十二支派。她借着禁食和降卑自己，恳求那鉴察一切的主——万世的上帝；他看见她内心的谦卑，就拯救了她为之冒险的百姓。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ τελεία κατὰ πίστιν
  choice: 那在信仰上完全的
  rationale: 保留 κατὰ πίστιν 的衡量关系，并以自然汉语表达以斯帖在信仰方面的完全。
- source_word: τὸ δωδεκάφυλον τοῦ Ἰσραὴλ
  choice: 以色列十二支派
  rationale: δωδεκάφυλον 是指以色列十二支派这一集体；此译法准确且比“十二支派的民族”自然。
- source_word: τῆς νηστείας καὶ τῆς ταπεινώσεως
  choice: 禁食和自卑
  rationale: ταπείνωσις 在禁食语境中指主动在上帝面前降卑自己，而非被动受辱。
- source_word: ἠξίωσεν
  choice: 恳求
  rationale: 此处在宾语为“主”时表示向其提出恳切请求；避免机械译作“使……配得”。
- source_word: τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς
  choice: 她内心的谦卑
  rationale: ψυχή 在此指人的内在生命或心灵状态；“内心”符合现代汉语，同时保留谦卑之意。
- source_word: παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων
  choice: 那鉴察一切的主、万世的上帝
  rationale: παντεπόπτης 强调无所不见；θεὸς τῶν αἰώνων 保留上帝统管历世历代的庄严称号。
theological_decisions:
- issue: “在信仰上完全”是否暗示绝对无罪
  choice: 按原文保留“完全”，并限定为“在信仰上”
  alternative: 信心坚定的
  rationale: 原文 τελεία 不宜弱化为仅仅“坚定”，而 κατὰ πίστιν 又限定了所论的层面，避免将其扩展为绝对无罪。
- issue: 以斯帖拯救百姓与上帝拯救百姓的关系
  choice: 前句保留以斯帖“为要拯救”，后句明确是上帝实际“拯救了”百姓
  alternative: 前后都译作以斯帖拯救百姓
  rationale: 原文先陈述以斯帖冒险的目的，后陈述上帝回应并施行拯救；两层行动不可混同。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“置身险境”“行将灭亡”保持书面尊严；“自卑”表达主动降卑，不采用现代汉语中偏向受辱感的“羞辱”。原文在此无须以脚注才能保存的实质歧义，因此不设脚注。
