  to: 同样不逊色的，还有那位在信仰上完全的以斯帖；她曾置身险境，为要拯救行将灭亡的以色列十二支派。她借着禁食和降卑自己，恳求那鉴察一切的主——万世的上帝；他看见她内心的谦卑，就拯救了她为之冒险的百姓。
