  yaml_path: translation/extra_canonical/1_clement/002/002.yaml
  text: Thus deep and rich peace had been given to all[a], and an insatiable desire for doing good, and a full outpouring of the Holy Spirit came upon all;
translation:
  language: zh_hans
  text: 这样，深厚而充裕的平安已经赐给了众人；众人对行善有不知满足的渴望，圣灵也丰盛地浇灌在众人身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνη βαθεῖα καὶ λιπαρά
  choice: 深厚而丰盛的和平
  rationale: βαθεῖα表示“深厚、深沉”，λιπαρά本指“肥美”，在此引申为“丰盛、充裕”；译文保留两个并列修饰语及其强烈语气。
- source_word: ἀκόρεστος πόθος εἰς ἀγαθοποιΐαν
  choice: 行善而永不满足的渴望
  rationale: ἀκόρεστος意为“不能满足的、无厌足的”，πόθος是强烈的渴望，εἰς指向行善这一目标；此译自然表达持续渴望更多行善之意。
- source_word: πλήρης πνεύματος ἁγίου ἐπέχυσις
  choice: 圣灵更丰丰富富地浇灌
  rationale: 将希腊文名词结构“圣灵的充分倾注”转为现代汉语较自然的动词结构，同时保留ἐπέχυσις的“浇灌”意象和πλήρης所表达的充盈程度。
theological_decisions:
- issue: πνεύματος ἁγίου是否应作专名化处理
  choice: 圣灵
  alternative: 圣洁的灵
  rationale: 在早期基督教语境中，该固定表达通常指圣灵；译作“圣灵”自然且符合上下文，但不进一步说明其作用方式。
- issue: 圣灵浇灌的范围
  choice: 在众人身上
  alternative: 在所有人身上
  rationale: ἐπὶ πάντας明确表达范围涵盖前述群体中的全体；“众人”既忠实又庄重，不将其扩大解释为全人类。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“已经赐给”体现ἐδέδοτο的过去完成意义；末句用“浇灌在……身上”保留原文意象，并以“丰丰富富地”自然传达“完全、充盈的倾注”。
