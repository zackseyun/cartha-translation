review_pass:
  verdict: revise
  source_fidelity: 首句准确传达ἐπὶ τοῖς παραπτώμασιν…ἐπενθεῖτε，即为邻舍的过犯而哀痛；“把他们的欠缺看作自己的”也恰当保留了τὰ ὑστερήματα αὐτῶν ἴδια ἐκρίνετε所表达的认作己有、共同承担之意，未擅自解释。末句“你们行善”可反映ἀγαθοποιοί。不过，“随时准备”给ἕτοιμοι加入了原文未明说的持续时间意味，“各样善事”则较容易表示不同种类，未充分体现πᾶν的逐一、全面范围。
  naturalness: 译文整体庄重、清楚，适合现代标准汉语。“为……悲痛”可以理解，但“为……哀痛”更为凝练自然，也较贴合ἐπενθεῖτε的悲悼语气。“准备好行一切善事”在现代汉语中顺畅，并准确衔接末句的两个并列描述。
  terminology: “过犯”“邻舍”“欠缺”均合适。“邻舍”保留原词所指身边之人、同伴的较广范围，优于仅指住处相邻者的“邻居”。“善事”可保留，不必将ἔργον译为带有特定教会术语色彩的“善工”。
  issues:
