base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/007.yaml
  text: You mourned over the trespasses of your neighbors; you considered their shortcomings to be your own. Doing good[a], ready for every good work.
translation:
  language: zh_hans
  text: 你们为邻舍的过犯哀痛，把他们的欠缺看作自己的。你们行善，准备好行一切善事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: 过犯
  rationale: 保留越界、犯错的道德含义，也符合庄重而通俗的现代汉语表达。
- source_word: τῶν πλησίον
  choice: 邻舍的
  rationale: 指身边之人或同伴；“邻舍”比单指居住相邻者的“邻居”更能涵盖原词范围。
- source_word: ὑστερήματα
  choice: 欠缺
  rationale: 原词可指不足、缺乏或短处；“欠缺”保留其宽泛性，不把含义限缩为物质需要或品格缺点。
- source_word: ἴδια ἐκρίνετε
  choice: 看作自己的
  rationale: ἐκρίνετε在此表示认定、视为；译文自然表达他们把别人的欠缺当成自己的。
- source_word: ἀγαθοποιοί
  choice: 你们行善
  rationale: 该词为主格复数的形容词性表达，意为行善者或行善的；汉语补出承接上文的主语，使独立分句完整，但不额外强化身份称谓。
- source_word: ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν
  choice: 随时准备做各样善事
  rationale: 自然表达“为每一件善工预备好”；“各样”在汉语中顺畅体现πᾶν的全面范围。
theological_decisions:
- issue: 把他人的欠缺视为自己的所表达的责任关系
  choice: 保持原文陈述，不解释为代罪、共同罪责或仅仅同情
  alternative: 译作“担当他们的欠缺”或“认为自己也有罪”
  rationale: 原文只说将其认作自己的，含有认同和共同承担的张力，但未明确界定其神学机制。
- issue: ἀγαθοποιοί是身份称谓还是行为描述
  choice: 译作行为描述“你们行善”
  alternative: 译作“你们是行善的人”或“你们乐善好施”
  rationale: 原文形式允许形容词性或名词性理解；行为式译法自然，并避免把善行缩窄为施舍。
translation_notes:
  register: 采用现代、庄重、易懂的简体中文。前两句保留未完成过去时所描写的持续或惯常表现，以一般过去语境中的陈述呈现；末句补出汉语必要的主语，但不添加原文没有的神学解释。
