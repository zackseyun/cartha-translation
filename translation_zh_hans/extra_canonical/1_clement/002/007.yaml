    issue: “随时准备”加入时间性意味
    rationale: ἕτοιμοι意为“预备好、准备好”，原文没有“随时”所含的持续即时性。
  - severity: low
    issue: “各样善事”对πᾶν的表达略弱
    rationale: πᾶν ἔργον ἀγαθόν是“每一件／一切善事”，而“各样”在汉语中主要可指类别多样。
  revised_text: 你们为邻舍的过犯哀痛，把他们的欠缺看作自己的。你们行善，准备好行一切善事。
  revised_footnotes: []
