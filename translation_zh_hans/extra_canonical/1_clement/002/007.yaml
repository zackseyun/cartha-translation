- from: 你们为邻舍的过犯悲痛，把他们的欠缺看作自己的。你们行善，随时准备做各样善事。
  to: 你们为邻舍的过犯哀痛，把他们的欠缺看作自己的。你们行善，准备好行一切善事。
  rationale: 仅作两处低风险的忠实性调整：以“哀痛”自然呈现为过犯悲悼的语气；以“准备好行一切善事”去除“随时”的额外时间含义，并更完整表达“每一件善事”的范围。保留“行善”作为ἀγαθοποιοί的自然行为性译法，也不为“把他们的欠缺看作自己的”添加任何神学阐释。
