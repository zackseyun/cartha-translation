source:
  edition: Funk 1901 (normalized OCR)
  text: μεστοί τε ὁσίας βουλῆς, ἐν ἀγαϑῇ προϑυμίᾳ μετ’ εὐσεβοῦς πεποιϑήσεως ἐξετείνατε τὰς χεῖρας ὑμῶν πρὸς τὸν παντοκράτορα ϑεόν, ἱκετεύοντες αὐτὸν ἵλεων γενέσϑαι, εἴ τι ἀκόντες ἡμάρτετε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/003.yaml
  text: And being full of holy purpose[a], with good zeal and devout confidence you stretched out your hands to God Almighty, imploring him to be merciful, if in anything you had sinned unintentionally.
translation:
  language: zh_hans
  text: 你们满怀圣洁的心志，带着美善的热忱和敬虔的信靠，向全能的上帝伸出双手，恳求他若你们在什么事上无意中[a]犯了罪，便施恩怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“非故意地”。这里指并非有意而犯，并非指受强迫犯罪。
    reason: 说明ἀκόντες在犯罪语境中指非故意的过犯，并避免将其理解为受强迫或单纯不情愿。
lexical_decisions:
- source_word: ὁσίας βουλῆς
  choice: 圣洁的意念
  rationale: βουλή在此指内在的意向、心志或谋念；“意念”既自然，也不把它过度具体化为计划或教义性“旨意”。
- source_word: ἀγαθῇ προθυμίᾳ
  choice: 美好的热忱
  rationale: προθυμία表达甘心、积极的热切态度；“热忱”符合语境，并保留ἀγαθῇ的正面评价。
- source_word: εὐσεβοῦς πεποιθήσεως
  choice: 敬虔的信靠
  rationale: πεποίθησις指信赖或确信，εὐσεβής赋予其敬神色彩；“敬虔的信靠”比单纯“信心”更完整。
- source_word: τὸν παντοκράτορα θεόν
  choice: 全能的上帝
  rationale: 直接传达παντοκράτωρ所表达的全权与全能，采用现代汉语中庄重而通行的称呼。
- source_word: ἵλεων γενέσθαι
  choice: 施恩怜悯
  rationale: 该表达意为变得宽宥、仁慈；“施恩怜悯”自然传达恳求上帝宽宥的意思，同时不在正文中额外明说“赦免”。
- source_word: ἀκόντες
  choice: 无意中
  rationale: 在犯罪语境中指非故意、非出于有意选择的过犯；“无意中”可避免被理解为受强迫而犯罪。
theological_decisions:
- issue: εἴ τι ἀκόντες ἡμάρτετε的条件性与非故意犯罪
  choice: 若在什么事上无意中犯了罪
  alternative: 你们无意中所犯的一切罪
  rationale: 保留εἴ的条件语气及τι的不确定性，不把原文改写成确定已经犯下的“一切罪”；同时把ἀκόντες理解为非故意或无意中的犯罪。
- issue: ἵλεων γενέσθαι是否明确译为赦罪
  choice: 施恩怜悯
  alternative: 赦免
  rationale: 原文直接说的是求上帝宽厚怜悯，而非使用明确表示“赦免”的动词；正文保留其较宽的含义。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“伸出双手”保留早期基督徒祷告姿态的具体形象；分号使希腊文连续分词结构在中文中更易读，同时保持动作之间的紧密联系。
