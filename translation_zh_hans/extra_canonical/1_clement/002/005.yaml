lexical_decisions:
- source_word: εἰλικρινεῖς
  choice: 真诚
  rationale: 表达纯正、诚挚而不虚假的品格，符合现代汉语自然表达。
- source_word: ἀκέραιοι
  choice: 正直
  rationale: 原词有纯全、无损、无掺杂之意；在品格语境中译为“正直”，既自然又避免与前词重复。
- source_word: ἀμνησίκακοι
  choice: 不记恨
  rationale: 该词指不记住别人所加的恶、不怀怨；“不记恨”准确而通俗，也保留人际伦理意味。
- source_word: εἰς ἀλλήλους
  choice: 彼此
  rationale: 简洁表达相互指向的关系，修饰“不记恨”。
