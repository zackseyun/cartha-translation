source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντες τε ἐταπεινοφρονεῖτε μηδὲν ἀλαζονευόμενοι, ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες, ἧδον διδόντες ἢ λαμβάνοντες· τοῖς ἐφοδίοις τοῦ Χριστοῦ ἀρκούμενοι καὶ προσέχοντες, τοὺς λόγους αὐτοῦ ἐπιμελῶς ἐνεστερνισμένοι ἦτε τοῖς σπλάγχνοις, καὶ τὰ παθήματα αὐτοῦ ἦν πρὸ ὀφϑαλμῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/001.yaml
  text: And all of you were humble-minded, boasting in nothing, submitting rather than demanding submission, taking more pleasure in giving than in receiving; content with the provisions of the Messiah, and paying close attention to his words, you had embraced them carefully in your hearts, and his sufferings were before your eyes.
translation:
  language: zh_hans
  text: 你们人人都存心谦卑，毫不自夸；宁愿顺服，不愿叫人顺服；施予比领受更令你们喜乐。你们以基督的供应为满足，专心留意他的话，把这些话仔细珍藏在心中[a]；他所受的苦难常在你们眼前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“内脏”或“肺腑”；古人常以此指人的内心和情感深处。
    reason: 说明σπλάγχνα的字面意象及正文采用“心中”的惯用意义。
lexical_decisions:
- source_word: ἐταπεινοφρονεῖτε
  choice: 存心谦卑
  rationale: 表达未完成时所描写的持续品格，也以现代汉语自然呈现“心思谦卑”的含义。
- source_word: ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες
  choice: 宁愿顺服，不愿叫人顺服
  rationale: 保留原文两个同根词的主动与被动对照，不额外限定顺服的对象或把后半句解释为“要求别人顺服”。
- source_word: ἧδον διδόντες ἢ λαμβάνοντες
  choice: 施予比领受更令你们喜乐
  rationale: 自然表达比较结构及“更乐意”的情感色彩，同时保留给予与领受的对照。
- source_word: τοῖς ἐφοδίοις τοῦ Χριστοῦ
  choice: 基督所赐的供应
  rationale: ἐφόδια可指旅途所需的给养或供应；此处采用涵盖面较广的“供应”，不把它具体化为物质或属灵恩赐。属格按来源理解为“基督所赐”，同时在决策中注明其可能歧义。
- source_word: ἐνεστερνισμένοι ... τοῖς σπλάγχνοις
  choice: 珍藏在心中
  rationale: σπλάγχνα字面指内脏，在此按古代惯用隐喻指人的内心；“珍藏在心中”既自然，又传达深入内化、珍视的语气。
- source_word: τὰ παθήματα αὐτοῦ
  choice: 他所受的苦难
  rationale: 保留复数集合意义，并明确这是基督亲身经历的苦难。
theological_decisions:
- issue: τοῦ Χριστοῦ的属格关系
  choice: 基督所赐的供应
  alternative: 关于基督的供应／基督的资粮
  rationale: 原文属格可表达来源、归属或关联；正文采用最顺畅且符合上下文的来源义，但不将“供应”进一步解释为某种特定圣礼、教义或物品。
- issue: “顺服”对照中的关系对象
  choice: 不说明顺服谁或叫谁顺服
  alternative: 顺服领袖而不要求下属顺服
  rationale: 原文没有指明对象；保留这一开放性，避免加入具体教会职分或权力结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人人都存心谦卑”“常在你们眼前”等措辞保留劝勉文体的肃穆感；分号呈现原文一连串并列对照，避免过度拆解。
