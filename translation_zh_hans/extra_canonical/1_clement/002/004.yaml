  text: ἦν ὑμῖν ἡμέρας τε καὶ νυκτὸς ὑπὲρ πάσης τῆς ἀδελφότητος, εἰς τὸ σώζεσϑαι μετ’ ἐλέους καὶ συνειδήσεως τὸν ἀριθμὸν τῶν ἐκλεκτῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/004.yaml
  text: Day and night you were concerned for the whole brotherhood[a], so that the number of his elect might be saved with mercy and conscientiousness.
translation:
  language: zh_hans
  text: 你们曾昼夜为全体弟兄竭力奋斗，好使他所拣选之人的数目可以在怜悯和良知中得救。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “在怜悯和良知中”也可理解为“带着怜悯和良知”；原文没有“美好”或“无愧”等修饰“良知”的词。
    reason: 保留介词短语的语义和句法歧义，避免把未明说的伦理评价写入正文。
lexical_decisions:
- source_word: ἀγών
  choice: 奋力
  rationale: 可靠的希腊文本句首作 ἀγὼν ἦν ὑμῖν，表达为此付出的艰苦努力或争战；“奋力”既保留强度，也比“争战”更符合本句关怀弟兄群体的语境。
- source_word: ἀδελφότης
  choice: 弟兄群体
  rationale: 指信徒组成的整体共同体，而不只是抽象的“弟兄情谊”。
- source_word: τὸν ἀριθμὸν τῶν ἐκλεκτῶν αὐτοῦ
  choice: 他选民的数目
  rationale: 贴近原文“他所拣选之人的数目”，不擅自把 ἀριθμός 解释成“全数”或“群体”。
- source_word: μετ’ ἐλέους καὶ συνειδήσεως
  choice: 在怜悯和良知中
  rationale: 保留介词结构及两个抽象名词的并列；原文没有明确说“无愧的”或“美好的”良心，因此不补入评价词。
theological_decisions:
- issue: “他选民”中“他”的所指
  choice: 保留“他”
  alternative: 明确译作“上帝的选民”
  rationale: 上下文通常会使读者理解为上帝，但本句原文仅用代词 αὐτοῦ；保留代词避免超出本句明说的内容。
- issue: “在怜悯和良知中”修饰谁以及如何修饰
  choice: 保留结构上的开放性
  alternative: 译成“因着怜悯，并存无愧的良心而得救”
  rationale: 希腊语 μετ’ ἐλέους καὶ συνειδήσεως 与“不定式得救”相连，但怜悯和良知各自的施事与具体关系并未完全说明；直译可保留这种张力。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“弟兄群体”兼顾早期教会共同体含义与当代可懂度；“奋力”体现 ἀγών 的强度而不过度军事化。正文保留“选民的数目”及“在怜悯和良知中”略显凝练的原文表达，并用脚注提示文本与解释上的不确定性。
