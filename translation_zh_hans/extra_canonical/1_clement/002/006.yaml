  yaml_path: translation/extra_canonical/1_clement/002/006.yaml
  text: Every faction and every schism was detestable to you.
translation:
  language: zh_hans
  text: 一切纷争和一切分裂，都是你们所厌恶的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα στάσις
  choice: 一切纷争
  rationale: στάσις在此指群体内部的争斗、结党或对立；译作“纷争”既涵盖内讧与党争，又避免将其过度限定为政治性的“叛乱”。
- source_word: πᾶν σχίσμα
  choice: 一切分裂
  rationale: σχίσμα指撕裂、分裂或派系裂痕；“分裂”在现代汉语中自然明确，并保留原文与στάσις并列而意义相近但不完全相同的表达。
- source_word: βδέλυκτον ἦν ὑμῖν
  choice: 都是你们所厌恶的
  rationale: βδελυκτός表达强烈憎恶、视为可憎之物；“所厌恶的”庄重而自然。系词未明说行为主体，因此保留“对你们而言是可憎的”这一关系，不增译为具体行动。
theological_decisions:
- issue: στάσις与σχίσμα之间的语义区分
  choice: 分别译为“纷争”和“分裂”
  alternative: 分别译为“结党”和“裂党”
  rationale: 原文并列两个相关概念：στάσις偏重争斗和对立状态，σχίσμα偏重由此形成的裂痕或分裂。所选译法保留这种张力，同时不将经文限定于正式派系或制度性分裂。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文两次πᾶς的强调，以两个“一切”对应；用“都是”使汉语句式自然，并体现两类现象均为读者所厌恶。
