  yaml_path: translation/extra_canonical/1_clement/002/008.yaml
  text: adorned with a venerable way of life[a], you conducted yourselves entirely in his fear; the commandments and the righteous requirements of the Lord had been written on the tablets of your hearts.
translation:
  language: zh_hans
  text: 你们以可敬的生活方式为妆饰，在敬畏他中凡事实行；[a]主的诫命和公义的法度都已写在你们的心版上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给希腊文的“人人”和重复的动词形式疑为OCR或文本讹误；通行校读作“凡事实行”（πάντα ἐτελεῖτε）。
    reason: 说明正文采用的通行校读，并标明该校读对句法和意义的影响。
lexical_decisions:
- source_word: σεβασμίῳ πολιτείᾳ
  choice: 可敬的品行
  rationale: πολιτεία在这里指生活方式、行为表现；σεβάσμιος表示庄重、值得尊敬。译作“可敬的品行”自然凝练，也保留其正式语气。
- source_word: κεκοσμημένοι
  choice: 以……为装饰
  rationale: 保留κοσμέω“装饰、妆点”的比喻，而不弱化为单纯的“具有”。
- source_word: ἐν φόβῳ αὐτοῦ
  choice: 在敬畏他之中
  rationale: φόβος在此语境指对上帝的敬畏；保留“他”，不在正文中补明指代对象。
- source_word: τὰ προστάγματα καὶ τὰ δικαιώματα
  choice: 诫命和公正的规条
  rationale: πρόσταγμα是命令、诫命；δικαίωμα可指合乎公义的规定或要求。用两个对应词保留原文并列，而不将二者合并。
- source_word: ἐπὶ τὰ πλάτη τῆς καρδίας ὑμῶν
  choice: 写在你们的心版上
  rationale: 按经文传统中的“心版”意象表达，既符合汉语习惯，也避免把πλάτη机械译成“宽阔处”。
theological_decisions:
- issue: “敬畏他”的指代
  choice: 保留代词“他”
  alternative: 明确译为“敬畏上帝”或“敬畏主”
  rationale: 原文使用αὐτοῦ而未在本句明说所指；保留代词可避免替作者消解篇章中的指代关系。
- issue: δικαιώματα的意义范围
  choice: 公正的规条
  alternative: 公义的要求
  rationale: 该词兼有法令、规条和正当要求的意味；正文选择较具体的“规条”，并以“公正的”保留其公义色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“以可敬的品行为装饰”和“心版”保留原文修辞；整体避免古奥虚词及宗派化措辞。
