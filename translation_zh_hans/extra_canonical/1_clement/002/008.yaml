review_pass:
  verdict: revise
  source_fidelity: 应按上下文及已说明的通行校读将该处读作 πάντα ἐτελεῖτε（“凡事实行／履行”），而不应将所给规范化OCR中的 πάντες ἐτελελεῖτε 当作正文的首选读法。草稿虽在脚注中指出问题，却在正文采用“你们人人……行事”，使主要译文未能反映较可靠且与英语审校轨迹一致的文本。其余部分基本忠实：σεβασμίῳ πολιτείᾳ、ἐν φόβῳ αὐτοῦ，以及“写在……心版上”的惯用意象均得到恰当表达。
  naturalness: “以可敬的品行为装饰”可理解，但“以……为装饰”比“以……为妆饰”更符合现代庄重书面语。“在敬畏他之中行事”略显生硬，改为“在敬畏他中凡事实行”更紧凑，也明确表达 πάντα 的宾语性范围。
  terminology: “诫命”和“心版”准确且符合正式宗教文本语体。“公义的法度”比“公正的规条”更自然地对应 δικαιώματα 的规范性、正当性含义，并保留其与“诫命”的并列。保留“他”，不自行将 αὐτοῦ 明定为“主”或“上帝”。
  issues:
