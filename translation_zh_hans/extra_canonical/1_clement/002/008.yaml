    issue: 正文优先采用了疑为OCR/文本错误的“你们人人……行事”。
    rationale: 该句标准读法为 πάντα ἐτελεῖτε，意为“你们凡事实行（或履行）”。草稿把这一读法置于脚注的“另有常见校读”，导致正文与可确证的上下文、英语审校轨迹及动词的正常形式不一致。
  - severity: low
    issue: “在敬畏他之中行事”的中文搭配稍显迂回，且未体现“凡事”的范围。
    rationale: 改作“在敬畏他中凡事实行”既保持庄重语体，也直接呈现 πάντα ἐτελεῖτε。
