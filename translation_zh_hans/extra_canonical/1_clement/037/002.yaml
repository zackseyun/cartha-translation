base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/002.yaml
  text: 'Let us consider those who serve as soldiers under our commanders: how orderly[a], how obedient, how submissively they carry out what is commanded.'
translation:
  language: zh_hans
  text: 让我们想想那些在我们指挥官麾下服役的人：他们怎样井然有序地、怎样听命地、怎样顺服地执行所吩咐的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσωμεν
  choice: 让我们想一想
  rationale: 表达劝勉式第一人称复数，并体现认真观察、思量之意；比单纯“看”更贴近语境。
- source_word: τοὺς στρατευομένους
  choice: 那些……当兵的人
  rationale: 保留其从军、服兵役的实际军事含义，同时采用现代汉语自然说法。
- source_word: τοῖς ἡγουμένοις ἡμῶν
  choice: 在我们的指挥官手下
  rationale: 军事语境中ἡγούμενοι指统领者；“指挥官”准确而自然，“手下”表达所属关系。
- source_word: εὐτάκτως
  choice: 有秩序
  rationale: 该词强调秩序井然、纪律有序；以“有秩序”保持与后续排比的简明结构。
- source_word: εἰκτικῶς
  choice: 服从
  rationale: 该副词含退让、听从、顺应之意；此处军事语境用“服从”最为清楚，并与较强的ὑποτεταγμένως有所区分。
- source_word: ὑποτεταγμένως
  choice: 顺服地
  rationale: 体现处于服属之下、以顺服姿态行事的含义，并保留副词功能。
- source_word: ἐπιτελοῦσιν τὰ διατασσόμενα
  choice: 执行所下达的命令
  rationale: 自然传达完成、实行被吩咐之事；“所下达的命令”符合军事语域。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的普通话。保留原文三个πῶς引出的修辞排比，以“多么……多么……多么……”再现强调效果；不增添神学解释。
