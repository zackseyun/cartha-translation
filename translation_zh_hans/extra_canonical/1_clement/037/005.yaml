source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν τὸ σῶμα ἡμῶν· ἡ κεφαλὴ δίχα τῶν ποδῶν οὐδέν ἐστιν, οὕτως οὐδὲ οἱ πόδες δίχα τῆς κεφαλῆς· τὰ δὲ ἐλάχιστα μέλη τοῦ σώματος ἡμῶν ἀναγκαῖα καὶ εὔχρηστά εἰσιν ὅλῳ τῷ σώματι· ἀλλὰ πάντα συνεπνεῖ καὶ ὑποταγῇ μιᾷ χρῆται εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/005.yaml
  text: 'Let us take our body as an example: the head is nothing without the feet; likewise the feet are nothing without the head. Even the smallest members of our body are necessary and useful to the whole body. But all breathe together and make use of one submission[a], so that the whole body may be preserved.'
translation:
  language: zh_hans
  text: 就拿我们的身体来说：头没有脚就算不了什么，脚没有头也同样算不了什么。我们身体上最微小的肢体，对整个身体也是不可缺少而且有用的。各肢体都一同呼吸，并以同一种顺服行事[a]，为要使整个身体得以保全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都实行一种顺服。”原文直译为“使用／实行一种顺服”；未说明顺服的对象。
    reason: 保留ὑποταγῇ μιᾷ χρῆται的字面结构及其关于顺服对象的含混，避免将其限定为某一种秩序或权威。
lexical_decisions:
- source_word: λάβωμεν τὸ σῶμα ἡμῶν
  choice: 就拿我们的身体来说
  rationale: λάβωμεν在此引入身体作为类比，采用现代汉语自然表达，同时保留第一人称复数。
- source_word: οὐδέν ἐστιν
  choice: 算不了什么
  rationale: 表达某肢体离开另一肢体便不能独立成其为有意义的整体，避免生硬直译为“什么也不是”。
- source_word: τὰ ἐλάχιστα μέλη
  choice: 最微小的肢体
  rationale: 保留最高级ἐλάχιστα及μέλη的身体意象。
- source_word: ἀναγκαῖα καὶ εὔχρηστα
  choice: 不可缺少而且有用
  rationale: 分别传达“必要的”与“有用、实用的”，用通顺现代汉语呈现。
- source_word: πάντα συνεπνεῖ
  choice: 各肢体都一同呼吸
  rationale: 保留συνεπνεῖ鲜明的共同呼吸意象，不将其泛化为“和谐合作”。
- source_word: ὑποταγῇ μιᾷ χρῆται
  choice: 服从同一秩序
  rationale: χράομαι与抽象名词连用可表示实行或体现；译文自然表达统一的顺服，同时以脚注保留较贴近字面的另一理解。
- source_word: εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα
  choice: 为要使整个身体得以保全
  rationale: 保留目的结构及被动意味；“保全”适合身体整体不受损害的语境。
theological_decisions:
- issue: ὑποταγή所指的顺服对象或结构
  choice: 服从同一秩序
  alternative: 共同实行一种顺服
  rationale: 原文没有明说顺服的具体对象。“同一秩序”在中文中能表达各肢体共同受约束，却不指定教会制度或某个权威；脚注保留抽象名词的较直译表达。
- issue: σώζεσθαι在此处的含义
  choice: 得以保全
  alternative: 得救
  rationale: 身体比喻的直接语境指整个身体得到保存、维系；译作“得救”容易不必要地引入专门的救恩论含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“身体—头—脚—肢体”“一同呼吸”等原文意象；末句避免机械直译，同时用脚注呈现ὑποταγή结构上的含混。
