  yaml_path: translation/extra_canonical/1_clement/037/004.yaml
  text: The great cannot exist without the small[a], nor the small without the great. There is a certain blending in all things, and in these there is usefulness.
translation:
  language: zh_hans
  text: 大者不能离开小者而存在，小者也不能离开大者。万物中都有某种调和；在这些事物[a]中也有益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些事物”可能指前句的“万物”，也可能特指前面所说的大者与小者。
    reason: 保留希腊语复数代词ἐν τούτοις的指代歧义，并避免误作单数。
lexical_decisions:
- source_word: οἱ μεγάλοι / οἱ μικροί
  choice: 大者／小者
  rationale: 保留原文以形容词名词化形成的对举，可泛指群体中地位、能力或规模有别的成员，不擅自限定为“大人物”和“小人物”。
- source_word: δίχα
  choice: 离开
  rationale: 在“不……而存在”的结构中自然表达“没有、脱离”的意思，同时保留双方彼此不可分离的关系。
- source_word: σύγκρασίς τις
  choice: 某种调和
  rationale: σύγκρασις指不同部分的混合、结合或协调；“调和”既能体现各部分结合，也适合上下文所强调的大小成员彼此配合。
- source_word: χρῆσις
  choice: 功用
  rationale: 此处表示用途、效用或实际作用；“功用”语言庄重而不生硬，且不把含义收窄为单纯的“益处”。
theological_decisions:
- issue: ἐν τούτοις的复数所指
  choice: 正文译作“在这些事物中”，并以脚注保留指代歧义
  alternative: 明确译为“在万物中”或“在大者与小者中”
  rationale: τοῦτοις是复数，可能回指紧邻的“万物”，也可能联系前述“大者与小者”；原文没有明确排除任一理解，因此不在正文中替作者裁定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“大者／小者”维持原文简洁而有格言色彩的平行结构；分号呈现后半句从普遍原则转向功用的推进。
