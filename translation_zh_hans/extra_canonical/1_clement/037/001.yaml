  text: Therefore let us serve as soldiers, brothers, with all earnestness under his blameless commands.
translation:
  language: zh_hans
  text: 所以，弟兄们，让我们以十足的热忱，在他无可指责的命令之下从军效力。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στρατευώμεθα
  choice: 让我们……从军效力
  rationale: 保留希腊文的军事意象及第一人称复数劝勉语气；“从军效力”在现代汉语中也自然表达服役、尽职之意。
- source_word: ἄνδρες ἀδελφοί
  choice: 弟兄们
  rationale: 这是对群体的郑重称呼；直译“弟兄男子们”不合现代汉语习惯，“弟兄们”已充分传达其呼语功能。
- source_word: μετὰ πάσης ἐκτενείας
  choice: 以十二分的热忱
  rationale: ἐκτένεια表示全力以赴、热切和专注；此译体现πάσης的加强作用，同时保持自然易懂。
- source_word: ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ
  choice: 在他无可指责的命令之下
  rationale: ἐν结合军事语境可表达在命令规范或统辖之下；ἄμωμος保留为“无可指责”，不擅自弱化为单纯“正确”。
theological_decisions:
- issue: 代词“他”的所指
  choice: 保留“他”而不明指
  alternative: 译作“上帝”或“基督”
  rationale: 本节希腊文本仅用αὐτοῦ；为保存上下文中的指代关系和原文可能具有的含混性，不补出具体称谓。
- issue: 军事隐喻的力度
  choice: 保留“从军效力”和“命令之下”
  alternative: 泛化为“服事”或“遵行”
  rationale: 原文以στρατεύομαι明确建立士兵服役的图景；泛化会消除作者的修辞意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留军事隐喻与共同劝勉语气，不增添宗派性解释。
