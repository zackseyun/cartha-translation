revisions:
- from: 并非人人都是总督、千夫长、百夫长、五十夫长，或依次担任其余各级职务；而是各人都在自己的队列中，执行王和领袖们所下达的命令。
  to: 并非人人都是总督、千夫长、百夫长、五十夫长，或其余依次排列的各级职官；相反，各人都在自己的编制中，完成王和领袖们所吩咐的事。
  rationale: 修订仅消除对τὸ καθεξῆς所增添的“依次担任”之意，并将τάγματι调整为较准确、自然的“编制”。保留原文的军事层级意象、王与领袖的广义称谓，以及“完成所吩咐之事”的语义。
