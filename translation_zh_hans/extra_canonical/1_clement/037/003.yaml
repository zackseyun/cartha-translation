id: 1CLEM.37.3
reference: 1 Clement 37:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: οὐ πάντες εἰσὶν ἔπαρχοι οὐδὲ χιλίαρχοι οὐδὲ ἑκατόνταρχοι οὐδὲ πεντηκόνταρχοι οὐδὲ τὸ καϑεξῆς, ἀλλ’ ἕκαστος ἐν τῷ ἰδίῳ τάγματι τὰ ἐπιτασσόμενα ὑπὸ τοῦ βασιλέως καὶ τῶν ἡγουμένων ἐπιτελεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/003.yaml
  text: Not all are prefects[a], nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.
translation:
  language: zh_hans
  text: 并非人人都是总督、千夫长、百夫长、五十夫长，或其余依次排列的各级职官；相反，各人都在自己的编制中，完成王和领袖们所吩咐的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαρχοι
  choice: 总督
  rationale: 该词指高阶长官；在此军事层级的类比中译作“总督”，既保留其高位官长之义，也避免将其过度具体化为某一种罗马军职。
- source_word: χιλίαρχοι
  choice: 千夫长
  rationale: 直译其统领千人的军职含义，并与后面的“百夫长、五十夫长”形成递降层级。
- source_word: ἑκατόνταρχοι
  choice: 百夫长
  rationale: 这是通行且准确的军职译名。
- source_word: πεντηκόνταρχοι
  choice: 五十夫长
  rationale: 按构词和上下文直译，清楚呈现军阶次序。
- source_word: τὸ καθεξῆς
  choice: 依次担任其余各级职务
  rationale: 该短语指按次序接续下去的其余层级；如此译法比生硬的“等等依次”更符合现代汉语，同时保留军阶排列的含义。
- source_word: τάγματι
  choice: 队列
  rationale: 该词可指编制、队伍、等级或所处位置；“队列”保留本段军事比喻，也能表达各人在所属秩序中的位置。
- source_word: βασιλέως
  choice: 王
  rationale: 按其通常意义直译，不擅自将其解释为特定历史君王或神学称号。
- source_word: ἡγουμένων
  choice: 领袖们
  rationale: 该分词泛指带领、主管的人；“领袖们”保留其广义，不强行限定为军事指挥官。
- source_word: ἐπιτελεῖ
  choice: 执行
  rationale: 准确表达完成、履行所受命令的意思，符合军事语境。
theological_decisions:
- issue: “王”是否特指上帝或基督
  choice: 正文保留“王”
  alternative: 译作“君王上帝”或“基督君王”
  rationale: 本句使用军事秩序作类比，但单凭此句不能排除世俗军队层面的直陈，也不足以明确其寓意所指；因此不在译文中加入原文没有的神学身份。
- issue: τάγματι 所表达的是军队编制还是更广泛的秩序与岗位
  choice: 译为“队列”
  alternative: 译为“等级”或“岗位”
  rationale: “队列”保留军事意象及个体在所属秩序中的位置，同时不把它收窄为纯粹社会等级或行政职位。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文由高至低列举军职的节奏，并以“依次担任其余各级职务”自然表达 τὸ καθεξῆς。无脚注，故正文不设脚注标记。
