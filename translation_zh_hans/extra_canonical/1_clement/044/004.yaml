  terminology: 以“供物”对应τὰ δῶρα，较“礼物”更能在不具体化物品的前提下保留礼仪献呈语境；以“监督职分”对应ἐπισκοπή，避免预设单一主教或后世固定教制。“逐出”对应ἀποβάλλω，脚注保留“从监督职分上撤除”的上下文读法。
