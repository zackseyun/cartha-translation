  text: ἁμαρτία γὰρ οὐ μικρὰ ἡμῖν ἔσται, ἐὰν τοὺς ἀμέμπτως καὶ ὁσίως προσενέγκοντας τὰ δῶρα τῆς ἐπισκοπῆς ἀποβάλωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/004.yaml
  text: For it will be no small sin for us if we cast out those who have offered the gifts of oversight blamelessly and devoutly[a].
translation:
  language: zh_hans
  text: 因为，如果我们把那些无可指责地、虔敬地献上监督职分的供物的人逐出，我们所犯的罪就不小。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把那些无可指责地、虔敬地献上供物的人从监督职分上撤除。”
    reason: 原文中“监督职分”可直接与“供物”相连；但按本段上下文，也可理解为被撤除者原先所任的职分。
lexical_decisions:
- source_word: ἁμαρτία ... οὐ μικρά
  choice: 不小的罪
  rationale: 保留原文的缓叙表达，不弱化其严肃性。
- source_word: ἀμέμπτως καὶ ὁσίως
  choice: 无可指责、虔敬地
  rationale: 分别表达行为无可非议和对神敬虔的含义，并保留两个副词共同修饰 προσενέγκοντας。
- source_word: προσενέγκοντας τὰ δῶρα
  choice: 献上……礼物
  rationale: προσφέρω 在敬拜语境中可指献呈供物；“献上礼物”既保留礼仪色彩，也不把所献之物过度具体化。
- source_word: τῆς ἐπισκοπῆς
  choice: 监督职分之
  rationale: ἐπισκοπή 在本段语境中指监督、照管的职分；采用较凝练的属格表达，以保留它与“礼物”之间在希腊文中的直接联系。
- source_word: ἀποβάλωμεν
  choice: 赶出去
  rationale: 表达 ἀποβάλλω 的排斥、逐出力度，同时避免在正文中先行断定它仅指撤销职务。
theological_decisions:
- issue: τὰ δῶρα τῆς ἐπισκοπῆς 的属格关系及 ἀποβάλωμεν 的作用范围
  choice: 正文译为“献上监督职分之礼物的人赶出去”
  alternative: “把那些无可指责、虔敬地献上礼物的人从监督职分上撤掉”
  rationale: 希腊文可以按表面词序把 τῆς ἐπισκοπῆς 与 τὰ δῶρα 相连，也可能结合上下文理解为将忠心献礼者从监督职分中撤除。正文保留较直接的语法关系，脚注列出符合上下文的另一种切分，避免消除真实歧义。
translation_notes:
  register: 采用庄重而现代的书面普通话。“监督职分”避免误解为现代行政监察岗位，也不预设后世特定教制称谓；脚注标记已在正文中标出。
