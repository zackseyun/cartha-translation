  yaml_path: translation/extra_canonical/1_clement/044/001.yaml
  text: And our apostles knew through our Lord Jesus Messiah that there would be strife over the name of the overseer’s office.
translation:
  language: zh_hans
  text: 我们的使徒借着我们的主耶稣基督得知，关于监督职分这一名称，将会有纷争。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 借着我们的主耶稣基督
  rationale: 保留διά加属格所表达的中介含义，并采用现代中文基督教文献中自然、庄重的称谓。
- source_word: ἔρις
  choice: 争执
  rationale: 此词指争竞、纷争；“争执”既保留冲突意味，又不额外限定其激烈程度。
- source_word: ἐπὶ τοῦ ὀνόματος
  choice: 为……的名义
  rationale: ἐπί加属格在此表示争议所围绕的对象；“名义”保留ὄνομα的字面成分及原文略显含混的表达，不径直改释为任命、头衔或职位归属。
- source_word: τῆς ἐπισκοπῆς
  choice: 监督职分
  rationale: ἐπισκοπή在此指监督、监管的职务或职分；译为“监督职分”避免直接套用后世宗派化的“主教职位”。
theological_decisions:
- issue: ἐπισκοπή是否应译成制度化的“主教职位”
  choice: 监督职分
  alternative: 主教职位
  rationale: 一世纪末语境中的制度形态及称谓不宜由译文预先判定；“监督职分”更贴近词义，也保留历史与教会治理层面的张力。
- issue: “借着主耶稣基督得知”所指的启示方式
  choice: 不具体说明方式
  alternative: 由主耶稣基督亲自预告／借着主的启示得知
  rationale: 原文只说明认知以基督为中介，并未交代是生前教导、预言、启示或其他方式，因此不作补充解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；尽量保持希腊文句法关系与“名义”一语的真实含混，同时避免把ἐπισκοπή宗派化或后世制度化。
