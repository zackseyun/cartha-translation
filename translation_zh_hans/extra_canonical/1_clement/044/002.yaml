source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ταύτην οὖν τὴν αἰτίαν πρόγνωσιν εἰληφότες τελείαν κατέστησαν τοὺς προειρημένους καὶ μεταξὺ ἐπινομὴν δεδώκασιν, ὅπως, ἐὰν κοιμηθῶσιν, διαδέξωνται ἕτεροι δεδοκιμασμένοι ἄνδρες τὴν λειτουργίαν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/002.yaml
  text: For this reason[a], then, having received complete foreknowledge, they appointed the men already mentioned, and afterward they gave a further provision, so that if they should fall asleep, other approved men might succeed to their ministry.
translation:
  language: zh_hans
  text: 正因这个缘故[a]，他们既已得到完全的预知，就设立了前面所说的那些人，随后又作出进一步安排：如果这些人安睡了，就由其他经过考验的人接替他们的职事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可译作“因此，就因这个缘故”。
    reason: 希腊文同时含有表示原因的短语和承接上文的语气词；正文采用较自然的汉语表达，注中保留其叠加语气。
lexical_decisions:
- source_word: πρόγνωσιν ... τελείαν
  choice: 完全的预知
  rationale: 保留“预知”及形容词“完全的”的明确表达，不把其对象或方式解释性地补入正文。
- source_word: κατέστησαν
  choice: 设立
  rationale: 表达将前述人员正式置于职任中的含义，也符合本段的教会职事语境。
- source_word: ἐπινομὴν
  choice: 进一步安排
  rationale: 该词在此指后来补充作出的规定或安排；采用中性措辞，避免把其具体制度形态说得过于确定。
- source_word: κοιμηθῶσιν
  choice: 安睡
  rationale: 保留原文以睡眠委婉指死亡的表达，而不直接改写为“去世”。
- source_word: δεδοκιμασμένοι
  choice: 经过考验的
  rationale: 体现这些人已经受过检验并获认可的完成状态。
- source_word: λειτουργίαν
  choice: 职事
  rationale: 兼顾履行公共或宗教服务职责的含义；不把它窄化为某一特定圣职或礼仪职分。
theological_decisions:
- issue: “完全的预知”的主体与范围
  choice: 按原文保留为“他们既已得到完全的预知”
  alternative: 解释为使徒从基督得到关于教会职分争议或继任问题的完整启示
  rationale: 原文没有明说预知的对象、来源或具体方式，因此不在译文中补入某种神学解释。
- issue: 职事继任的制度性质
  choice: 译作“由其他经过考验的人接替他们的职事”
  alternative: 译成某种特定教阶、按立制度或使徒统绪的技术表述
  rationale: 原文明确表达经认可者承接职事，但没有在本句中界定后来教派制度所赋予的全部含义。
translation_notes:
  register: 采用庄重而清楚的现代汉语。“安睡”保留原文委婉语，“职事”保持教会语境，同时避免导入特定宗派的职制术语。
