  text: ὁρῶμεν γάρ, ὅτι ἐνίους ὑμεῖς μετηγάγετε καλῶς πολιτευομένους ἐκ τῆς ἀμέμπτως αὐτοῖς τετιμημένης λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/006.yaml
  text: For we see that you have removed some who were conducting themselves well from the ministry that had been blamelessly honored by them[a].
translation:
  language: zh_hans
  text: 因为我们看见，你们把一些行事良好的人，从那受到他们无可指责地敬重的职分上撤了下来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从那在他们中间无可指责地受到尊重的职分上撤了下来。”
    reason: αὐτοῖς通常可理解为与被动分词τετιμημένης相连的施事与格（“受到他们敬重”）；此处也可较宽泛地理解为相关范围。脚注保留这一较少限定施事关系的可能性。
lexical_decisions:
- source_word: μετηγάγετε
  choice: 撤了下来
  rationale: 该动词本义为使人转离、移走；在本段有关解除职分的语境中，“从……职分上撤了下来”既直接又自然，且不额外引入正式罢免程序的含义。
- source_word: καλῶς πολιτευομένους
  choice: 一向品行端正的人
  rationale: πολιτεύομαι在此指人的行事为人或生活表现；“品行端正”简洁表达其良好操守，而不误解为政治活动。
- source_word: λειτουργίας
  choice: 职分
  rationale: 此处指群体中的事奉职责；“职分”比泛称“工作”更符合上下文，也不预先限定具体教会职位。
- source_word: ἀμέμπτως αὐτοῖς τετιμημένης
  choice: 他们始终以无可指责的方式尊重的
  rationale: τετιμημένης是τιμάω“尊重、看重”的完成时被动分词，αὐτοῖς可作施事与格；译文保留“尊重”及持续至今的完成时意味，并让ἀμέμπτως修饰这种尊重的方式。
theological_decisions:
- issue: λειτουργία是否译成特定圣职名称
  choice: 采用较宽泛的“职分”
  alternative: “圣职”或“教会职务”
  rationale: 希腊文本身没有在本句明确指定某一种职位；宽泛译法避免把后来的制度称谓带入文本。
- issue: αὐτοῖς与τετιμημένης的关系
  choice: 理解为施事与格，即这职分受到这些任职者的尊重
  alternative: 理解为“为他们所尊荣/交托给他们的职分”
  rationale: 完成时被动分词与施事与格的组合支持“由他们尊重”；同时用脚注提示另一种句法理解，不把真实歧义完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一向”“始终”略有语义重叠，但分别对应持续的良好品行与完成时分词所表达的既成且延续状态；整体保持原句的责备语气，不增加定罪性措辞。
