source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι οἱ προοδοιπορήσαντες πρεσβύτεροι, οἵτινες ἔγκαιρον καὶ τελείαν ἔχον τὴν ἀνάλυσιν· οὐ γὰρ εὐλαβοῦνται, μή τις αὐτοὺς μεταστήσῃ ἀπὸ τοῦ δεδομένου αὐτοῖς τόπου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/005.yaml
  text: Blessed are the elders who went on before[a], who had a timely and complete departure; for they do not fear lest someone remove them from the place given to them.
translation:
  language: zh_hans
  text: 那些已经先行而去的长老是有福的！他们的离去适时而圆满，因为他们不必担心有人会把他们从赐给他们的位置上撤下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “位置”也可理解为“职分”或“岗位”。
    reason: τόπος既可指地方或位置，也可在本段语境中指长老所承担的职分；脚注保留这一真实歧义。
lexical_decisions:
- source_word: προοδοιπορήσαντες
  choice: 已经先行而去
  rationale: 保留“走在前面、先行”的行旅意象，同时结合上下文自然表达这些长老已先于众人离去。
- source_word: ἀνάλυσιν
  choice: 离去
  rationale: 该词可指解脱、启程或离世；“离去”在中文中自然含蓄地指向死亡，又不把原词的意象限定得过死。
- source_word: ἔγκαιρον καὶ τελείαν
  choice: 适时而圆满
  rationale: 分别对应“在合宜的时候”和“完整、达到终点”，兼顾语义与庄重文体。
- source_word: εὐλαβοῦνται
  choice: 担心
  rationale: 此处指戒惧某事发生；在否定结构中译为“不必担心”最符合现代汉语。
- source_word: τοῦ δεδομένου αὐτοῖς τόπου
  choice: 赐给他们的位置
  rationale: δεδομένου是δίδωμι（给予）的完成时被动分词，应保留“赐给/给予”，不可与前文表示正式任命的καθίστημι混同；“位置”则保留空间位置与职分地位之间的可能双关。
- source_word: μεταστήσῃ
  choice: 撤下
  rationale: 表达使人离开原有位置，在本段涉及长老职分的语境中比单纯“移走”更自然，同时仍与“位置”相呼应。
theological_decisions:
- issue: “位置”是指一般所在之处，还是长老的职分
  choice: 正文保留“位置”，脚注说明也可理解为职分或岗位
  alternative: 直接译为“职分”或“职位”
  rationale: τόπος本义是地方、位置，但上下文谈论长老被不公正撤职，明显可引申为职位；保留较宽的译法可避免消除原文的语义张力。
- issue: ἀνάλυσις是否应明确译作“死亡”
  choice: 译为较含蓄的“离去”
  alternative: 译为“离世”或“死亡”
  rationale: 上下文确实指死亡，但原词本身带有解脱或启程的意象；“离去”既能让读者理解死亡所指，也保留原有表达空间。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“先行而去”“适时而圆满”保留原文的行旅和完成意象；避免使用过度宗派化的教会术语。
