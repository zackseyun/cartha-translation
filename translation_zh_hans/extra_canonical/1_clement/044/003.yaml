id: 1CLEM.44.3
reference: 1 Clement 44:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: τοὺς οὖν κατασταθέντας ὑπ᾽ ἐκείνων ἢ μεταξὺ ὑφ᾽ ἑτέρων ἐλλογίμων ἀνδρῶν συνευδοκησάσης τῆς ἐκκλησίας πάσης, καὶ λειτουργήσαντας ἀμέμπτως τῷ ποιμνίῳ τοῦ Χριστοῦ μετὰ ταπεινοφροσύνης, ἡσύχως καὶ ἀβαναύσως, μεμαρτυρημένους τε πολλοῖς χρόνοις ὑπὸ πάντων, τούτους οὐ δικαίως νομίζομεν ἀποβάλλεσθαι τῆς λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/003.yaml
  text: Therefore[a], those who were appointed by them, or afterward by other reputable men with the whole church consenting, and who have served the flock of the Messiah blamelessly, with humility, quietly, and unpretentiously, and who for a long time have been well attested by all—these we consider not to be justly removed from the ministry.
translation:
  language: zh_hans
  text: 所以，那些由他们委任，或后来由其他德高望重的人在全教会赞同下委任的人，曾谦卑、安静、朴实无华地服事基督的羊群，无可指责，并且长期得到众人的认可——我们认为，撤去这样的人所担任的服事职分[a]是不公正的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服事的职分”所译的希腊语也可较简洁地译作“服事”或“事奉”。这里的上下文既强调实际服事，也涉及受委任后可以被撤去的职分。
    reason: 保留 λειτουργία 在“服事行为”与“所任职分”之间的词义张力，避免把后世特定的教会职制读入原文。
lexical_decisions:
- source_word: κατασταθέντας
  choice: 委任
  rationale: 这里指使人担任教会中的服事职分；“委任”既体现正式安排，也不额外规定具体任职礼仪。
- source_word: ἐλλογίμων ἀνδρῶν
  choice: 德高望重的人
  rationale: ἐλλόγιμος 指受到尊重、享有良好声誉；此译符合现代汉语且保持庄重。
- source_word: συνευδοκησάσης τῆς ἐκκλησίας πάσης
  choice: 在全教会赞同下
  rationale: 直陈整个教会共同表示认可，不将其强化为投票、选举或一致表决等原文未明说的程序。
- source_word: λειτουργήσαντας
  choice: 服事
  rationale: 此处描写他们对基督羊群所作的事奉；用“服事”自然表达持续履行教会职责。
- source_word: ἀβαναύσως
  choice: 朴实无华地
  rationale: 该词表示行事不卑俗、不粗鄙，也不以外在排场自炫；“朴实无华”在现代汉语中比“不粗俗地”更自然，并与“谦卑、安静”协调。
- source_word: μεμαρτυρημένους
  choice: 得到众人的认可
  rationale: 保留“众人为他们作见证”的正面含义，同时以自然汉语表达其长期获得良好评价。
- source_word: ἀποβάλλεσθαι τῆς λειτουργίας
  choice: 从服事的职分上撤换下来
  rationale: ἀποβάλλεσθαι 表示被排除或罢免，λειτουργία 在此依上下文是所承担的教会服事；“撤换”不预设具体惩戒机制。
theological_decisions:
- issue: Χριστός 的称谓
  choice: 基督
  alternative: 弥赛亚
  rationale: 本文处于早期基督徒教会语境，“基督的羊群”是自然且传统的现代汉语表达；原文没有在此突出希伯来称号的解释功能。
- issue: λειτουργία 是一般服事还是正式职分
  choice: 服事的职分
  alternative: 事奉／圣职
  rationale: 上下文涉及委任和撤换，表明不只是泛指服务；但译作“圣职”可能导入后世制度和宗派含义，因此采用较中性的“服事的职分”。
- issue: οὐ δικαίως 的否定范围
  choice: 把这样的人……撤换下来是不公正的
  alternative: 这样的人不应被公正地撤换
  rationale: 原文意为作者判断这种罢免并不正当。汉语采用判断句可清楚传达否定范围，又不改变原文立场。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文先铺陈这些人的任职、品格和声誉，最后才作判断的修辞推进；破折号帮助读者把握这一较长句式。“全教会赞同”不扩写为特定选举制度，“服事的职分”也不绑定任何宗派职称。
