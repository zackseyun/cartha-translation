id: 1CLEM.61.2
reference: 1 Clement 61:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ γάρ, δέσποτα, ἐπουράνιε βασιλεῦ τῶν αἰώνων, δίδως τοῖς υἱοῖς τῶν ἀνθρώπων δόξαν καὶ τιμὴν καὶ ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων· σὺ, κύριε, διεύθυνον τὴν βουλὴν αὐτῶν κατὰ τὸ καλὸν καὶ εὐάρεστον ἐνώπιον σου, ὅπως διέποντες ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/002.yaml
  text: For you[a], Master, heavenly King of the ages, give glory and honor and authority to the sons of men over those who are on the earth. You, Lord, direct their counsel according to what is good and pleasing before you, so that, governing in peace and gentleness, and with godliness, the authority you have given them, they may obtain your favor.
translation:
  language: zh_hans
  text: 因为你——主宰、天上的万世之王——将荣耀、尊贵和对地上事物的权柄赐给世人。主啊，求你引导他们的谋划，使他们的谋划合乎在你眼中美好而蒙你喜悦的事；这样，他们便能以和平、温柔和敬虔运用你所赐给他们的权柄，从而蒙你恩待。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Funk 1901 版此处读作“蒙你恩待”（ἵλεώς σου）；题供的规范化 OCR 误作“得到你的神”（θεοῦ σου）。
    reason: 说明所给 OCR 在末句误识、会造成希腊文和语义不通；译文依据 Funk 1901 的实际读文。
lexical_decisions:
- source_word: δέσποτα
  choice: 主宰
  rationale: 表达对拥有绝对权柄者的直接称呼，并与后文 κύριε“主啊”有所区分。
- source_word: ἐπουράνιε βασιλεῦ τῶν αἰώνων
  choice: 天上的万世之王
  rationale: 保留“属天”与“历世历代之王”的双重称号；“万世”兼顾 αἰώνων 的时代性和庄严语体。
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: 世人
  rationale: 这是表示人类成员的闪语式表达；现代汉语用“世人”自然传达其意义，不限定性别。
- source_word: ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων
  choice: 权柄……使他们治理地上的人
  rationale: 属格最自然地表示管辖对象；ὑπαρχόντων 在此指地上的人，而不是泛指地上万物。
- source_word: διεύθυνον τὴν βουλὴν αὐτῶν
  choice: 求你引导他们的谋划
  rationale: διεύθυνον 是祈求语气明确的命令式；βουλή 可指谋议、计划或决策过程，“谋划”保留一定范围。
- source_word: εὐσεβῶς
  choice: 敬虔
  rationale: 表达在神面前恭敬、合宜地履行权柄，不额外加入宗派性含义。
- source_word: ἵλεώ σου τυγχάνωσιν
  choice: 蒙你恩待
  rationale: 按 Funk 1901 的实际希腊文读法表达“得着你的和悦/恩待”，比直译成抽象的“恩惠”更贴合关系性的用语。
theological_decisions:
- issue: 统治权柄的来源与使用
  choice: 明确权柄由神赐予，并祈求掌权者以和平、温柔和敬虔来运用
  alternative: 将经文处理为对世俗统治权的无条件认可
  rationale: 原文同时肯定权柄的赐予者，并以神眼中美好可喜悦之事约束其谋划和施政，不宜消除这种张力。
- issue: 末句是否表示获得神的恩待
  choice: 译为“蒙你恩待”
  alternative: 依所给 OCR 的 θεοῦ σου 直译为“得到你的神”
  rationale: 后者在希腊语和上下文中均不通；Funk 1901 的版本文字为 ἵλεώ σου，与古代祷告语言及英语咨询层的“your favor”一致。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留祷告中的直接称呼和祈求语气。“主宰”与“主啊”分别对应 δέσποτα 与 κύριε；句法适度拆分，以便普通读者理解，同时保留原文关于神所赐权柄及其道德约束的结构。
