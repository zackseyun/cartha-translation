  source_fidelity: 末句采用 Funk 1901 实际读文 ἵλεώς σου（“蒙你恩待／得你喜悦”）而未照规范化 OCR 的讹文 θεοῦ σου 直译，处理正确。可是 τῶν ἐπὶ τῆς γῆς ὑπαρχόντων 在语法上可指“地上的事物／存在于地上的一切”，并不明确限于“地上的人”；将其定为人会无根据地缩窄原文范围。修订保留该处的范围。
  naturalness: 原译整体庄重通顺，但“使之合乎你眼中美好、蒙你喜悦的事”搭配稍显生硬。“使他们的谋划合乎在你眼中美好而蒙你喜悦的事”更符合现代汉语，同时保留原文的开放表达。
  terminology: “主宰”对应 δέσποτα、“主啊”对应 κύριε，层次清楚；“天上的万世之王”“敬虔”“蒙你恩待”均恰当。“权柄”宜明确为对地上事物的权柄，避免将原文不明示的受管辖者限定为人。
