language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: Σύ, δέσποτα, ἔδωκας τὴν ἐξουσίαν τῆς βασιλείας αὐτοῖς διὰ τοῦ μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους σου, εἰς τὸ γινώσκοντας ἡμᾶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην δόξαν καὶ τιμὴν ὑποτάσσεσθαι αὐτοῖς, μηδὲν ἐναντιουμένους τῷ θελήματί σου· οἷς δός, κύριε, ὑγίειαν, εἰρήνην, ὁμόνοιαν, εὐστάθειαν, εἰς τὸ διέπειν αὐτοὺς τὴν ὑπὸ σοῦ δεδομένην αὐτοῖς ἡγεμονίαν ἀπροσκόπως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/001.yaml
  text: You, Master, gave them the authority of rule through your magnificent and indescribable might, so that, knowing the glory and honor given to them by you, we might submit ourselves to them, opposing your will in nothing. Grant to them, Lord, health, peace, concord, and stability, so that they may administer without offense the leadership you have given them.
translation:
  language: zh_hans
  text: 主宰啊，是你借着自己威严、无法言喻的大能，把统治的权柄赐给他们，使我们知道你所赐给他们的荣耀和尊贵，就顺服他们，凡事都不违背你的旨意。主啊，求你赐给他们健康、和平、和睦与安定，使他们能无可指摘地行使你所赐给他们的领导权。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: 主宰啊
  rationale: 保留该称呼所表达的最高主权，也采用适合祷告的庄重呼语。
- source_word: ἐξουσίαν τῆς βασιλείας
  choice: 统治的权柄
  rationale: ἐξουσία 表示获授的权力或权柄，βασιλεία 在这里指执政、统治，而非领土意义的“国度”。
- source_word: μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους
  choice: 威严、无法言喻的大能
  rationale: μεγαλοπρεπής 强调宏伟威严，ἀνεκδιήγητος 指无法充分述说，κράτος 指强大的力量或权能。
- source_word: ὑποτάσσεσθαι
  choice: 顺服
  rationale: 准确表达置身于权柄之下的态度，同时符合现代汉语宗教文本的庄重语域。
- source_word: ὁμόνοιαν
  choice: 和睦
  rationale: 该词指同心、协调一致；在与“和平”并列时，“和睦”既自然又避免简单重复。
- source_word: εὐστάθειαν
  choice: 安定
  rationale: 表达稳定、秩序稳固的状态，适合为执政者代求的上下文。
- source_word: διέπειν
  choice: 行使
  rationale: 此处指管理、治理或执行所授职权；与“领导权”搭配时，“行使”简洁自然。
- source_word: ἀπροσκόπως
  choice: 无可指摘地
  rationale: 该副词可表示不致绊倒、不造成冒犯或不受阻碍；“无可指摘地”保留伦理与公共施政层面的开放性。
theological_decisions:
- issue: 顺服执政者与顺服上帝旨意的关系
  choice: 译作“就顺服他们，凡事都不违背你的旨意”
  alternative: “顺服他们，毫不抗拒你的旨意”
  rationale: 原文把对执政者的顺服置于上帝授予权柄及其旨意之下；译文保留这种关联，不把它扩展为不受限制的政治服从，也不额外加入例外条款。
- issue: ἀπροσκόπως 的含义
  choice: “无可指摘地”
  alternative: “不受阻碍地”或“不致使人跌倒地”
  rationale: 原词存在“无绊碍、无冒犯、无过失”的语义张力；正文采用较能涵盖正当施政意味的表达，但不把它收窄为单纯效率或畅通无阻。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告体。以“主宰啊”与后文“主啊”区分原文 δέσποτα 和 κύριε；句法适度拆分，使普通读者易懂，同时保留原文从上帝授予权柄、信徒顺服到为执政者代求的逻辑结构。
