source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ μόνος δυνάμενος ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ μεθ’ ἡμῶν, σοὶ ἐξομολογούμεθα διὰ τοῦ ἀρχιερέως καὶ προστάτου τῶν ψυχῶν ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ σοι ἡ δόξα καὶ ἡ μεγαλωσύνη καὶ νῦν καὶ εἰς γενεὰν γενεῶν καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/003.yaml
  text: To you[a], who alone are able to do these and greater good things among us, we give thanks through the high priest and guardian of our souls, Jesus Christ, through whom be the glory and the majesty to you both now and from generation to generation and unto the ages of ages[b]. Amen.
translation:
  language: zh_hans
  text: 你是唯一能在我们中间[a]成就这些事和更多美善之事的那一位；我们借着我们灵魂的大祭司和守护者耶稣基督向你称谢。愿荣耀和威严借着他归于你，无论现在、世世代代，直到永永远远。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我们中间”也可理解为“与我们同在而成就”；原文强调“与我们同在、在我们当中”，未明确写成“为我们”。
    reason: 说明μεθ’ ἡμῶν的语义范围，避免把伴随或临在关系静默收窄为受益关系。
lexical_decisions:
- source_word: ποιῆσαι
  choice: 成就
  rationale: 在祷告语境中比普通的“做”更庄重自然，同时保留“使之实现、完成”的基本含义。
- source_word: περισσότερα ἀγαθὰ
  choice: 更多善事
  rationale: περισσότερα在此自然表示数量或程度上的“更多”；ἀγαθὰ为中性复数，指美善之事。此译不擅自限定具体内容。
- source_word: ἐξομολογούμεθα
  choice: 称谢
  rationale: 该词可指承认、颂赞或感谢；在向上帝发出的祷告和颂荣语境中，“称谢”兼顾感谢与公开颂赞的色彩。
- source_word: ἀρχιερέως
  choice: 大祭司
  rationale: 准确保留早期基督教对耶稣的祭司性称号。
- source_word: προστάτου
  choice: 守护者
  rationale: 该词含保护、扶助和维护之意；“守护者”适合与“我们灵魂的”搭配，又不额外引入制度性或法庭性的含义。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: 无冠词形式处于固定而庄严的祷告表达中，宜按姓名兼称号译作“耶稣基督”，不在正文中过度展开为“耶稣弥赛亚”。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 采用现代中文中自然庄重的颂荣表达，传达希腊语强化的永久性。
theological_decisions:
- issue: μεθ’ ἡμῶν所表达的上帝行动与“我们”的关系
  choice: 在我们中间
  alternative: 与我们同在而成就；为我们
  rationale: μετά加属格首先表达“与……同在、在……当中”；“在我们中间”最少解释性，并保留上帝临在及行动的开放含义。“为我们”虽合语境，却把伴随关系明确化为受益关系。
- issue: 颂荣句δι’ οὗ σοι ἡ δόξα καὶ ἡ μεγαλωσύνη的关系
  choice: 愿荣耀和威严借着他归于你
  alternative: 荣耀和威严借着他属于你
  rationale: 希腊文为省略系词的颂荣公式；“愿……归于你”自然表达祝愿式颂荣，同时清楚保留“借着他”指向耶稣基督，终极归向上帝的结构。
- issue: 耶稣基督作为“大祭司和守护者”的同位关系
  choice: 我们灵魂的大祭司和守护者耶稣基督
  alternative: 大祭司耶稣基督和我们灵魂的守护者
  rationale: 希腊文两个称号共同受“我们灵魂的”限定，并与“耶稣基督”同位；本译保持这两个称号并列而不拆分。
translation_notes:
  register: 采用现代、庄重而易懂的祷告与颂荣语体。“称谢”“大祭司”“永永远远”保留礼仪感；整体依照希腊文的连续思路展开，但用分号划分中文长句，以确保普通读者容易理解。脚注标记[a]已置于正文对应位置。
