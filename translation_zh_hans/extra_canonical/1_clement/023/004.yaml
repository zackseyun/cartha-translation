source:
  edition: Funk 1901 (normalized OCR)
  text: ὦ ἀνόητοι, συμβάλετε ἑαυτοὺς ξύλῳ· λάβετε ἄμπελον· πρῶτον μὲν φυλλορροεῖ, εἶτα βλαστὸς γίνεται, εἶτα φύλλον, εἶτα ἄνθος, καὶ μετὰ ταῦτα ὄμφαξ, εἶτα σταφυλὴ παρίστανται. ὁρᾶτε, ὅτι ἐν καιρῷ ὀλίγῳ εἰς πέπειρον καταντᾷ ὁ καρπὸς τοῦ ξύλου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/004.yaml
  text: 'You foolish ones[a], compare yourselves to a tree: take a vine. First it sheds its leaves, then a shoot appears, then a leaf, then a flower, and after these the unripe grape and then the full cluster appear. You see that in a short time the fruit of the tree comes to maturity.'
translation:
  language: zh_hans
  text: 你们这些愚昧的人啊，把自己同树木作比较吧。就拿葡萄树来说：它先落叶，然后萌芽，接着长叶，再开花；此后先出现未熟的葡萄，随后出现葡萄串。你们看，树上的果实在短时间内就成熟了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόητοι
  choice: 愚昧的人
  rationale: 表达缺乏领悟、没有明白事理之意；保留原文直接责备的语气，同时采用现代汉语自然说法。
- source_word: συμβάλετε ἑαυτοὺς ξύλῳ
  choice: 把自己同树木作比较
  rationale: συμβάλλω 在此表示比较；ξύλον 此处由下文葡萄树的生长过程具体说明，译作“树木”比字面的“木头”合乎语境。
- source_word: λάβετε ἄμπελον
  choice: 就拿葡萄树来说
  rationale: 保留以葡萄树为实例的命令语气，并使现代汉语表达自然。
- source_word: φυλλορροεῖ
  choice: 落叶
  rationale: 该动词指叶片脱落；简洁呈现葡萄树生长周期的起点。
- source_word: βλαστὸς γίνεται
  choice: 萌芽
  rationale: βλαστός 可指芽或嫩枝；此处位于长叶之前，译作“萌芽”最符合所列生长次序，同时不作过细限定。
- source_word: ὄμφαξ
  choice: 青葡萄
  rationale: 指尚未成熟、味酸的葡萄；“青葡萄”通俗而能表达未成熟状态。
- source_word: σταφυλή
  choice: 整串葡萄
  rationale: 在与单个未熟果实的进程对照中，指形成的葡萄串；“整串葡萄”清楚呈现成熟前后的形态推进。
- source_word: εἰς πέπειρον καταντᾷ
  choice: 就成熟了
  rationale: 表达果实达到成熟状态；“就”也传达短时间内迅速达成的语势。
theological_decisions:
- issue: 自然生长过程作为劝诫类比
  choice: 按原文保留从落叶到果实成熟的连续观察，不补明其神学所指
  alternative: 明确解释为预言、复活或末世应验的类比
  rationale: 本节本身只陈述自然现象；具体神学应用须由上下文显明，不宜在译文中提前限定。
- issue: ὄμφαξ 与 σταφυλή 同受复数动词 παρίστανται 支配
  choice: 译为“此后先出现青葡萄，继而结成整串葡萄”
  alternative: 拆成彼此无关的两个独立陈述，或删去先后层次
  rationale: 汉语没有对应的复数动词形式，但以同一连续句式保留两个主项及 εἶτα 所表达的次序。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留开头呼语的强烈劝诫语气，并用“就拿……来说”自然引入例证。全句依照希腊文的阶段顺序铺陈，避免从英语咨询文本引入与希腊文位置不相符的脚注。
