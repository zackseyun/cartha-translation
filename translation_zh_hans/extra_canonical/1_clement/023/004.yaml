revisions:
- from: 你们这些愚昧的人啊，把自己同树木作比较吧。就拿葡萄树来说：它先落叶，然后萌芽，接着长叶，再开花；此后先出现青葡萄，继而结成整串葡萄。你们看，树上的果实在短时间内就成熟了。
  to: 你们这些愚昧的人啊，把自己同树木作比较吧。就拿葡萄树来说：它先落叶，然后萌芽，接着长叶，再开花；此后先出现未熟的葡萄，随后出现葡萄串。你们看，树上的果实在短时间内就成熟了。
  rationale: 仅修正果实阶段的表述：以“先出现……随后出现……”对应ὄμφαξ、εἶτα σταφυλή及共同的复数动词παρίστανται；并将“青葡萄”改为“未熟的葡萄”，以准确表达其成熟度而避免颜色歧义。其余措辞保留原译的自然、庄重语体。
