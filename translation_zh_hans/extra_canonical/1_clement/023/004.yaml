    issue: “继而结成整串葡萄”未保留παρίστανται对两个果实阶段的共同谓语。
    rationale: 原文在ὄμφαξ之后以εἶτα引出σταφυλή，并以复数παρίστανται统摄二者，即二者相继“出现”。“结成”属于解释性改写，且“整串”增添原文未明说的“完整”含义。
  - severity: low
    issue: “青葡萄”可能有颜色或品种歧义。
    rationale: ὄμφαξ的重点是未成熟、酸涩的葡萄；“未熟的葡萄”更直接且不引入颜色联想。
