source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ οἰκτίρμων κατὰ πάντα καὶ εὐεργετικὸς πατὴρ ἔχει σπλάγχνα ἐπὶ τοὺς φοβουμένους αὐτόν, ἠπίως τε καὶ προσηνῶς τὰς χάριτας αὐτοῦ ἀποδίδοι τοῖς προσερχομένοις αὐτῷ ἁπλῇ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/001.yaml
  text: The compassionate and altogether beneficent Father has tender affections for those who fear him, and gently and kindly gives his gracious gifts to those who come to him with a single-minded heart.
translation:
  language: zh_hans
  text: 这位在各方面都满有怜悯、广施恩惠的父，对敬畏他的人满怀怜爱；他温和而亲切地将自己的各样恩惠赐给那些以单纯的心志亲近他的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ οἰκτίρμων κατὰ πάντα
  choice: 那在一切事上都满有怜悯的
  rationale: 保留 κατὰ πάντα 对怜悯性质的全面强调，同时采用自然的现代汉语表达。
- source_word: εὐεργετικὸς πατήρ
  choice: 广施恩惠的父
  rationale: εὐεργετικός 指乐于行善、施惠；“广施恩惠”既传达主动施益，也保持庄重语体。
- source_word: ἔχει σπλάγχνα ἐπί
  choice: 向……存着怜爱
  rationale: σπλάγχνα 字面指内脏，惯用来表达由衷的慈爱和怜悯；译作“存着怜爱”避免生硬直译。
- source_word: φοβουμένους αὐτόν
  choice: 敬畏他的人
  rationale: 保留 φοβέομαι 在宗教语境中兼具敬重与畏惧的含义。
- source_word: ἠπίως τε καὶ προσηνῶς
  choice: 温和而亲切地
  rationale: 分别体现 ἠπίως 的温柔和缓与 προσηνῶς 的和蔼友善。
- source_word: τὰς χάριτας αὐτοῦ
  choice: 自己的恩赐
  rationale: χάριτες 为复数，可指各样恩惠或恩赐；“恩赐”保留其出于恩典、具体赐予的意味。
- source_word: τοῖς προσερχομένοις αὐτῷ
  choice: 那些……亲近他的人
  rationale: προσέρχομαι 可指来到、趋近；“亲近”在此兼顾关系性和敬拜语境，但不限定为特定礼仪行动。
- source_word: ἁπλῇ διανοίᾳ
  choice: 以纯一心志
  rationale: ἁπλοῦς 在此强调不分心、不虚伪或不怀二意；“纯一”保留语义宽度，διανοία 译作“心志”较自然。
theological_decisions:
- issue: 父的身份是否明说为上帝
  choice: 保留原文称谓“父”，不增译“上帝”
  alternative: 译作“父上帝”
  rationale: 希腊文仅作 πατήρ；上下文虽显然具有神学指向，译文仍不补入原文未明说的名词。
- issue: ἁπλῇ διανοίᾳ 的道德与心理侧重
  choice: 译作“以纯一心志”
  alternative: 译作“怀着诚实无伪的心”或“一心一意”
  rationale: 原词可涵盖单纯、真诚、专一；采用较开放的表达，不把含义只限定为诚实或专注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留原句中“父”的神学称谓及其施恩行动，并以分号清楚呈现两个并列陈述。
