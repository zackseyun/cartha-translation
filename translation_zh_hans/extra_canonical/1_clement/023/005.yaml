source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπ’ ἀληθείας ταχὺ καὶ ἐξαίφνης τελειωθήσεται τὸ θέλημα αὐτοῦ, συνεπιμαρτυρούσης καὶ τῆς γραφῆς, ὅτι ταχὺ ἥξει καὶ οὐ χρονιεῖ, καὶ ἐξαίφνης ἥξει ὁ κύριος εἰς τὸν ναὸν αὐτοῦ, καὶ ὁ ἅγιος, ὃν ὑμεῖς προσδοκᾶτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/005.yaml
  text: Truly, his will shall be accomplished quickly and suddenly, as the Scripture also bears witness, saying, “Quickly he will come and will not delay,” and, “Suddenly the Lord will come to his temple, even the Holy One whom you expect.”
translation:
  language: zh_hans
  text: 他的旨意确实必迅速而突然地成就；圣经也作见证说：“他必迅速来到，绝不迟延”；又说：“主必突然来到自己的殿，就是你们所期待的那位圣者。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: 确实
  rationale: 表达“真实地、的确”的强调语气，以自然庄重的现代汉语呈现。
- source_word: τελειωθήσεται
  choice: 必……成就
  rationale: 被动形式表示其旨意将得到完成；“成就”保留庄重的经文语体，又不显生硬。
- source_word: τὸ θέλημα αὐτοῦ
  choice: 他的旨意
  rationale: “旨意”准确承载 θέλημα 在宗教语境中的意涵，同时保持指代，不擅自明确“他”是谁。
- source_word: συνεπιμαρτυρούσης
  choice: 也一同作证
  rationale: 保留 συν- 所含的共同佐证意味，说明圣经与前述断言相互印证。
- source_word: οὐ χρονιεῖ
  choice: 绝不迟延
  rationale: 以“绝不”传达 οὐ 的明确否定，并用“迟延”对应耽搁、延误。
- source_word: ὁ ἅγιος
  choice: 那位圣者
  rationale: 将带冠词的实体化形容词译为人物称号；“那位”使中文指称自然，并避免预先判定具体身份。
- source_word: προσδοκᾶτε
  choice: 期待
  rationale: 兼有等候与盼望之意；“期待”简明自然，不额外强化褒贬色彩。
theological_decisions:
- issue: ὁ ἅγιος与ὁ κύριος的关系
  choice: 译作“就是你们所期待的那位圣者”
  alternative: “以及你们所期待的那位圣者”
  rationale: καί 在此可有解释、同位作用；上下文与引文结构较自然地将“圣者”视为“主”的同位称号。用“就是”清楚呈现这一读法，但不添加更具体的基督论身份说明。
- issue: 引文中的主语身份
  choice: 保留“他”“主”“圣者”的原有称谓
  alternative: 明确译成“基督”或“神”
  rationale: 希腊文本没有在本节直接补出具体身份，故不以解释性称谓消除原文的指称空间。
- issue: 两段引文的边界
  choice: 以“又说”区分为两段引文
  alternative: 合并为一句连续引文
  rationale: 文本汇合了两处先知性经文措辞；分开标示可忠实呈现其复合引用方式，并符合句法转换。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“必”保留预言和确定性语气；分号整理长句层次。未添加原文没有的神学身份说明，也未设置无需解释的脚注。
