revisions:
- from: 他的旨意确实必迅速而突然地成就；圣经也一同作证说：“他必迅速来到，绝不迟延”；又说：“主必突然来到自己的殿，就是你们所期待的那位圣者。”
  to: 他的旨意确实必迅速而突然地成就；圣经也作见证说：“他必迅速来到，绝不迟延”；又说：“主必突然来到自己的殿，就是你们所期待的那位圣者。”
  rationale: 仅将“圣经也一同作证说”改为“圣经也作见证说”，以消除现代汉语中“一同”所可能引起的共同主体歧义。其余措辞保持不变，保留原文的预言语气、复合引文结构及有关“主／圣者”关系的解释空间。
