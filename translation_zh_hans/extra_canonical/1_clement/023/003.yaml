revisions:
- from: 愿这段经文所说的远离我们[a]。经上说：“三心二意、心里疑惑的人有祸了！他们说：‘这些话，我们在祖辈的日子就听过；看哪，如今我们已经老了，其中没有一件临到我们。’”
  to: 愿经文中的这番话不要应验在我们身上[a]。经上说：“三心二意、心里疑惑的人有祸了！他们说：‘这些事，我们在我们祖先的时代就听过；看哪，如今我们已经老了，这些事没有一件发生在我们身上。’”
  rationale: 修订仅处理首句的汉语句法问题，并使末句更自然明确。正文不把作者的祈愿误解为排斥经文本身，而表达该经文所警戒的处境不应临到“我们”；脚注保留原文形式所允许的直译。其余译法维持原稿对希腊文的忠实性及庄重的现代汉语语体。
