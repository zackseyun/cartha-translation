  text: πόρρω γενέσθω ἀφ’ ἡμῶν ἡ γραφὴ αὕτη, ὅπου λέγει· Ταλαίπωροί εἰσιν οἱ δίψυχοι, οἱ διατάζοντες τῇ ψυχῇ, οἱ λέγοντες· Ταῦτα ἠκούσαμεν καὶ ἐπὶ τῶν πατέρων ἡμῶν, καὶ ἰδοὺ, γηράσκομεν, καὶ οὐδὲν ἡμῖν τούτων συνέβηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/003.yaml
  text: Let this scripture be far from us[a], where it says, “Wretched are the double-minded, those who doubt in their soul, who say, ‘These things we heard even in the days of our fathers, and behold, we have grown old, and none of these things has happened to us.’”
translation:
  language: zh_hans
  text: 愿经文中的这番话不要应验在我们身上[a]。经上说：“三心二意、心里疑惑的人有祸了！他们说：‘这些事，我们在我们祖先的时代就听过；看哪，如今我们已经老了，这些事没有一件发生在我们身上。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿这段经文远离我们。”
    reason: 保留“这段经文”（ἡ γραφὴ αὕτη）作“远离”（γενέσθω）的语法主语这一形式对应译法；正文则按汉语习惯表达其语用含义。
lexical_decisions:
- source_word: πόρρω γενέσθω ἀφ’ ἡμῶν
  choice: 愿……远离我们
  rationale: 保留第三人称不定过去时命令式所表达的强烈祈愿，同时采用自然庄重的现代汉语。
- source_word: ἡ γραφὴ αὕτη
  choice: 这段经文所说的
  rationale: 结合下文引文理解为经文中的这番话，避免中文误解为作者希望圣经本身离开众人；脚注保留较为形式对应的译法。
- source_word: δίψυχοι
  choice: 三心二意
  rationale: 该词字面有“两个心魂”之意，指内心摇摆、不专一；“三心二意”是现代汉语中自然且贴切的表达。
- source_word: διατάζοντες τῇ ψυχῇ
  choice: 心里疑惑
  rationale: 此处文本用词较罕见，语境指内心怀疑或动摇；采用不把含义过度具体化的常用表达。
- source_word: ἐπὶ τῶν πατέρων ἡμῶν
  choice: 在祖辈的日子
  rationale: 表达“在我们先辈的时代”，保留时间含义，而非误译成仅仅从祖辈口中听见。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留提示注意的语气及庄重文体。
- source_word: συνέβηκεν
  choice: 临到
  rationale: 在此指所预告之事实际发生于他们身上；“临到”自然地保留事件发生和涉及人的双重含义。
theological_decisions:
- issue: “这段经文远离我们”的含义
  choice: 正文译作“愿这段经文所说的远离我们”
  alternative: “愿这段经文远离我们”
  rationale: 希腊文形式上以“这经文”为主语，但语用上是愿其中对怀疑者的描述或斥责不适用于群体。正文避免造成排斥经文本身的误解，脚注保存直译。
- issue: δίψυχοι与διατάζοντες的关系
  choice: 并列呈现为“三心二意、心里疑惑的人”
  alternative: 解释为同一特征：“三心二意，也就是心里疑惑的人”
  rationale: 原文以两个带冠词的描述相接，可能同位，也可能累加描述；中文不加入“也就是”，以保留其句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；引文保留“看哪”等略带经文色彩的提示语。标点和句序按现代汉语调整，不以生硬倒装模仿希腊语。
