  source_fidelity: 译文对引文的主要内容忠实：δίψυχοι译为“三心二意”，διατάζοντες τῇ ψυχῇ以“心里疑惑”表达其内心犹疑之意；ἐπὶ τῶν πατέρων ἡμῶν也正确理解为“在我们祖先的时代”。不过，正文首句“愿这段经文所说的远离我们”缺少明确中心语，且将ἡ γραφὴ αὕτη过度改写为悬空的“所说的”。应以自然汉语明确其语用含义，同时用脚注保留原文的形式表达。
  naturalness: 引文整体庄重流畅。“愿这段经文所说的远离我们”在现代汉语中不完整、不自然；“愿经文中的这番话不要应验在我们身上”既通顺，也准确传达此处祈愿该警戒不适用于“我们”的语用意思。“这些事没有一件发生在我们身上”比“其中没有一件临到我们”更直接自然。
  terminology: “经文”“三心二意”“心里疑惑”“看哪”均符合庄重的现代汉语经文语体。将“祖辈的日子”调整为“我们祖先的时代”，可更清楚对应πατέρων的先辈／祖先和ἐπί所表达的时代背景。
