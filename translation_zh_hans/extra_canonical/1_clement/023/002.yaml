  text: διὸ μὴ διψυχῶμεν, μηδὲ ἐνδυλλιεσθω ἡ ψυχὴ ἡμῶν ἐπὶ ταῖς ὑπερβαλλούσαις καὶ ἐνδόξοις δωρεαῖς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/002.yaml
  text: Therefore let us not be double-minded[a], nor let our soul be doubtful concerning his surpassing and glorious gifts.
translation:
  language: zh_hans
  text: 所以，我们不要三心二意[a]，我们的心也不要怀疑他那卓越而荣耀的恩赐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“心怀二意”。
    reason: διψυχέω含有内心分裂、意念摇摆的形象；正文采用自然成语，脚注保留较贴近词面构造的译法。
lexical_decisions:
- source_word: διψυχῶμεν
  choice: 三心二意
  rationale: 该词字面带有“心分两处”的意味，在此指意念摇摆、不坚定；“三心二意”是现代汉语中自然且易懂的对应表达。
- source_word: ἐνδυλλιεσθω（据语境及异文理解为 ἰνδαλλέσθω / ἐνδαλλέσθω）
  choice: 怀疑
  rationale: 此处动词表达迟疑、疑惑，而非再次陈述“内心分裂”；译作“怀疑”保留它与前一分句的区别。
- source_word: ὑπερβαλλούσαις
  choice: 超越一切
  rationale: 表达恩赐卓越、无可比拟的性质；用“超越一切”比音译式或生硬的“超越的”更符合现代汉语。
- source_word: ἐνδόξοις
  choice: 满有荣耀的
  rationale: 保留“荣耀”这一核心意义，同时以“满有”使定语在汉语中自然。
- source_word: δωρεαῖς
  choice: 恩赐
  rationale: 指由上帝慷慨赐下的礼物；“恩赐”准确体现其赐予性及宗教语境。
theological_decisions:
- issue: 对上帝恩赐的态度
  choice: 译为“怀疑他……的恩赐”
  alternative: 译为“因他……的恩赐而迟疑”
  rationale: 希腊文介词结构可表达针对或涉及这些恩赐；“怀疑……恩赐”自然地呈现告诫内容，又不额外断定怀疑的是恩赐的真实性、到来时间或价值。
- issue: ψυχή 的指称
  choice: 译为“我们的心”
  alternative: 译为“我们的灵魂”
  rationale: 此处 ψυχή 指人的内在意念与态度；现代汉语以“心”更自然，也与怀疑、摇摆的语境贴合，不引入有关灵魂构成的教义判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以”承接上文；两个并列劝诫保持原文结构。避免把后一个动词译成“内心分裂”，以免与“三心二意”形成不必要的同义重复。
