id: 1CLEM.9.1
reference: 1 Clement 9:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὸ ὑπακούσωμεν τῇ μεγαλοπρεπεῖ καὶ ἐνδόξῳ βουλήσει αὐτοῦ, καὶ ἱκέται γενόμενοι τοῦ ἐλέους καὶ τῆς χρηστότητος αὐτοῦ προσπέσωμεν καὶ ἐπιστρέψωμεν ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ, ἀπολιπόντες τὴν ματαιοπονίαν τήν τε ἔριν καὶ τὸ εἰς θάνατον ἄγον ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/001.yaml
  text: Therefore let us obey his majestic and glorious purpose, and, becoming suppliants for his mercy and kindness, let us fall before him and turn to his compassions, leaving behind fruitless toil, as well as strife and the jealousy that leads to death.
translation:
  language: zh_hans
  text: 所以，我们要顺从他庄严而荣耀的旨意；要成为恳求他怜悯和恩慈的人[a]，俯伏在他面前，转向他的慈悲，离弃虚妄的劳碌、纷争和那导致死亡的嫉妒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按原文属格直译：“作他怜悯和恩慈的恳求者”。语境中较自然地理解为恳求得到他的怜悯和恩慈。
    reason: 保留原文属格可作较字面表达的可能，同时说明正文采用的对象性理解。
lexical_decisions:
- source_word: βουλήσει
  choice: 旨意
  rationale: 此处指上帝庄严、荣耀的意愿或定意；“旨意”自然庄重，同时不把含义过度限定为计划。
- source_word: ἱκέται γενόμενοι
  choice: 成为恳求……的人
  rationale: 保留“成为恳求者”的表达，并用现代汉语清楚呈现其向上帝求告的含义。
- source_word: ἐλέους καὶ τῆς χρηστότητος
  choice: 怜悯和恩慈
  rationale: 分别表达 ἔλεος 的怜恤与 χρηστότης 的仁厚、慈善；属格在语境中自然理解为恳求的对象。
- source_word: προσπέσωμεν
  choice: 俯伏在他面前
  rationale: 该动词在恳求语境中表示伏到某人跟前；此译保留身体姿态与谦卑求告的意味。
- source_word: ἐπιστρέψωμεν ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ
  choice: 转向他的慈悲
  rationale: 按原文保留“转向”的动态意象，并以“慈悲”表达复数 οἰκτιρμοί 所指的深切怜悯。
- source_word: ματαιοπονίαν
  choice: 徒劳的作为
  rationale: 兼顾 μάταιος 的徒然与 πόνος/πονία 的劳作、作为之意，避免误解成一般性的辛勤劳动。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 与“纷争”及“导致死亡”的负面语境相符；该词也可指热忱，但此处显然为恶性的妒忌或争竞。
theological_decisions:
- issue: βουλήσει 指上帝的意愿、旨意还是计划
  choice: 旨意
  alternative: 计划／定意
  rationale: “旨意”保留意愿与定意之间的语义空间，不额外引入有关预定或具体计划的教义判断。
- issue: ἱκέται 后属格的关系
  choice: 按目的或对象译为“恳求他怜悯和恩慈的人”
  alternative: “他怜悯和恩慈的恳求者”
  rationale: 语境表明怜悯和恩慈是所求之物；正文采用自然汉语，脚注保留较贴近属格形式的另一种表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以“我们要……”维持共同劝勉语气。保留原句连续的行动次序，并以分号减轻长句负担。
