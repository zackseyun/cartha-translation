  language: zh_hans
  text: 让我们定睛注视那些在他威严的荣耀中完全地事奉的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: 让我们定睛注视
  rationale: 该词表示专注而持续地凝视；译文保留劝勉语气及专注观看的力度。
- source_word: τοὺς τελείως λειτουργήσαντας
  choice: 那些……尽心事奉的人
  rationale: λειτουργέω在此指履行服事；τελείως可表完全、充分或尽善地。译作“尽心事奉”既自然庄重，也避免让“完美事奉”产生绝对无罪的误解。
- source_word: τῇ μεγαλοπρεπεῖ δόξῃ αὐτοῦ
  choice: 在他宏伟的荣耀中
  rationale: 与格的具体关系存在一定弹性，可理解为服事所处或所关联的荣耀领域；采用“在……中”保留原文结构及其庄严意象，不擅自改成明确的受事关系。
theological_decisions:
- issue: 事奉与“他宏伟的荣耀”之间的关系
  choice: 在他宏伟的荣耀中尽心事奉
  alternative: 尽心事奉他宏伟的荣耀
  rationale: 原文与格可有多种语义关系；“在……中”不把“荣耀”直接定为事奉对象，更妥善保留语法和神学上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“宏伟的荣耀”保留μεγαλοπρεπής的崇高感；“尽心事奉”比“完美地事奉”更符合自然汉语，同时仍传达τελείως所强调的充分与完全。
