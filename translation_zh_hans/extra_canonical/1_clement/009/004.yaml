base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/004.yaml
  text: Noah[a], having been found faithful, through his ministry proclaimed regeneration to the world, and through him the Master preserved the animals that entered the ark in pairs.
translation:
  language: zh_hans
  text: 挪亚被证实为忠信；他借着自己的服事，向世界宣告了更新。主宰也借着他，保全了那些和睦地进入方舟的动物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和睦地”所据的通行校勘读法为 ὁμονοίᾳ，意为“同心、和睦地”；此处所列底本的 ὁμοίᾳ 很可能是 OCR 遗漏了νο。有些译法按方舟叙事背景译作“成对”，但希腊文没有“两两”的字样。
    reason: 说明底本文字的 OCR 问题及所采用读法，并避免将创世记背景中的“两两”作为未经标示的正文内容补入。
lexical_decisions:
- source_word: πιστὸς εὑρεθείς
  choice: 显明是忠信的
  rationale: 保留“被发现／证实为忠信”的被动含义，同时采用自然的现代汉语表达。
- source_word: λειτουργία
  choice: 服事
  rationale: 此处指挪亚承担的事奉或职分；“服事”比“礼仪”更符合上下文，又不把含义窄化为某种宗教仪式。
- source_word: παλιγγενεσία
  choice: 更新
  rationale: 该词可指再生、重生或重新形成；在洪水与世界的语境中，“更新”自然且能避免过度限定为个人属灵重生。
- source_word: δεσπότης
  choice: 主宰
  rationale: 体现该词所含的主权与权柄，比泛用的“主”更能区别其词义色彩。
- source_word: διέσωσεν
  choice: 保全了
  rationale: 表达使动物安然存留、脱离毁灭的意思，符合方舟语境。
- source_word: ἐν ὁμονοίᾳ
  choice: 同心
  rationale: 按可恢复的希腊文读法 ὁμονοίᾳ 直译为“同心、和睦”；不增添原文没有的“两两”或“成对”概念。
theological_decisions:
- issue: παλιγγενεσία是指个人重生还是受造世界的更新
  choice: 译作“更新”，保留其广义
  alternative: 重生／再生
  rationale: 上下文以洪水后的世界为背景，原文没有明确把该词限定为个人得救经历；“更新”保留其宇宙性及神学张力。
- issue: 挪亚与动物得以保存之间的施行者关系
  choice: “主宰也借着他，保全了……”
  alternative: “他保全了……”
  rationale: 严格保留原文：真正的行动主体是主宰，挪亚是主宰所借用的人。
- issue: ἐν ὁμονοίᾳ是否按创世记背景译为“成对”
  choice: 正文译“同心”并加注说明
  alternative: 成对／两两
  rationale: 现有希腊文证据支持“同心、和睦”；“成对”虽符合方舟叙事，却是从背景补入，而非该词本身的意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“显明是忠信的”“借着自己的服事”“保全”兼顾原文结构与中文流畅度；分号与第二句划清挪亚宣告更新、主宰保全动物这两个并列行动。
