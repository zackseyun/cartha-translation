  text: λάβωμεν Ἐνώχ, ὃς ἐν ὑπακοῇ δικαίως εὑρεθεὶς μετετέθη, καὶ οὐχ εὑρέθη αὐτοῦ θάνατος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/003.yaml
  text: Let us take Enoch[a], who, having been found righteous in obedience, was taken up, and his death was not found.
translation:
  language: zh_hans
  text: 让我们以以诺为例；他在顺服中显为义，就被接去[a]，他的死亡也没有被发现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被挪去”。
    reason: μετετέθη可较形式地译作“被迁移、被挪去”；正文采用更符合以诺叙事语境的“被接去”。
lexical_decisions:
- source_word: λάβωμεν
  choice: 我们来思想
  rationale: 字面为“让我们取/举出”，此处是引入以诺作为劝勉的榜样；“来思想”在现代汉语中自然庄重，并表达考察其事例之意。
- source_word: ἐν ὑπακοῇ δικαίως εὑρεθείς
  choice: 因顺服而被认定为义
  rationale: 保留ἐν ὑπακοῇ与δικαίως εὑρεθείς之间的关联，也保留“被发现/认定”的被动表达；避免改写成单纯的“顺服且公义”。
- source_word: μετετέθη
  choice: 被接去
  rationale: 在以诺传统中指他被超自然地挪离；“被接去”自然地呼应相关圣经语言，又不在正文中补出原文未明说的目的地“天上”。
- source_word: οὐχ εὑρέθη αὐτοῦ θάνατος
  choice: 人也没有见到他的死亡
  rationale: 尽量保留“他的死亡没有被发现”的异常表达，同时以汉语可理解的主动泛指句呈现；不直接断言“他没有死”，从而保留原文张力。
theological_decisions:
- issue: 以诺被挪移的目的地
  choice: 被接去
  alternative: 被接到天上
  rationale: 原文μετετέθη本身没有明说“天上”；正文保留这一省略，不把传统理解直接写入译文。
- issue: “被认定为义”与顺服的关系
  choice: 因顺服而被认定为义
  alternative: 在顺服中显为义
  rationale: ἐν可表达领域、处境或关联，也可能带工具/原因色彩；本译法顺应语境，但不引入特定宗派的称义体系。
- issue: 以诺是否经历死亡
  choice: 人也没有见到他的死亡
  alternative: 他没有死
  rationale: 原文说死亡“未被发现”，并非用直接否定死亡的措辞；译文保留这种含蓄和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我们来思想”承担劝勉式举例功能；“被接去”保持圣经语域，但避免补入原文未明说的信息。脚注标记[a]已置于正文对应词后。
