  - severity: medium
    issue: “人也没有见到他的死亡”把οὐχ εὑρέθη αὐτοῦ θάνατος改成了“未目睹”。
    rationale: εὑρέθη是“被发现、被找到”，而非“被看见”；保留“他的死亡没有被发现”既更忠实，也保有原文不直接说“他没有死”的表达张力。
  - severity: low
    issue: “我们来思想以诺”未充分体现λάβωμεν在此处“举以诺为例”的修辞功能。
    rationale: “让我们以以诺为例”是现代汉语中更直接、自然的劝勉性引介。
