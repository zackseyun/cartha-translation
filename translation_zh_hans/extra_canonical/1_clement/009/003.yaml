  rationale: 修订使ἐν ὑπακοῇ保留为较开放的“在顺服中”，以“显为义”传达εὑρεθείς δικαίως而不引入特定称义框架；并把末句恢复为“死亡没有被发现”，保留希腊文的非常规且含蓄的表述。正文仍以“被接去”处理μετετέθη，脚注保留形式较近的替代译法及正确锚点。
