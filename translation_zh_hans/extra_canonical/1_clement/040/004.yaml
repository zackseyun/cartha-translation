source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ οὖν τοῖς προστεταγμένοις καιροῖς ποιοῦντες τὰς προσφορὰς αὐτῶν εὐπρόσδεκτοί τε καὶ μακάριοί· τοῖς γὰρ νομίμοις τοῦ δεσπότου ἀκολουθοῦντες οὐ διαμαρτάνουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/004.yaml
  text: Therefore those who make their offerings at the appointed times are both acceptable and blessed[a]; for by following the lawful ordinances of the Master they do not go astray.
translation:
  language: zh_hans
  text: 所以，那些在指定的时间[a]献上供物的人，是蒙悦纳、有福的；因为他们遵循主的规例，就不致犯错。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“规定的时间”。
    reason: “指定的”和“规定的”都可表达προστεταγμένοις所指预先安排并具权威性的时间。
lexical_decisions:
- source_word: τοῖς προστεταγμένοις καιροῖς
  choice: 在指定的时间
  rationale: προστεταγμένοις 是完成时被动分词，表示时间已被指定或规定；“指定的时间”自然简洁，并保留权威安排之意。
- source_word: τὰς προσφορὰς αὐτῶν
  choice: 献上供物
  rationale: προσφορά 在本段礼仪语境中指所献之物；译为“供物”既明确，又不把含义限缩为某一种祭物。
- source_word: εὐπρόσδεκτοί τε καὶ μακάριοι
  choice: 蒙悦纳、有福的
  rationale: εὐπρόσδεκτος 表示受接纳、得悦纳；被动式中文“蒙悦纳”符合敬虔语境。μακάριος 译为常用而庄重的“有福”。
- source_word: τοῖς νομίμοις τοῦ δεσπότου
  choice: 主所定的规例
  rationale: νόμιμα 指合乎规定的条例或惯例；“所定的规例”传达其规范性。δεσπότης 在此为权威称谓，译作“主”自然且不额外限定所指。
- source_word: οὐ διαμαρτάνουσιν
  choice: 不会走偏
  rationale: διαμαρτάνω 表示偏离、出错；“走偏”承接“遵循”所形成的道路意象，同时不将其过度解释为某种特定罪行。
theological_decisions:
- issue: 按规定献供物与蒙悦纳、有福之间的关系
  choice: 依照原文直接并列陈述，不补入功德、因果或救恩机制
  alternative: 解释为献供物使人赚取神的悦纳或福分
  rationale: 原文称这样的人“蒙悦纳、有福”，但未界定更完整的神学机制；译文保留这一张力。
- issue: δεσπότης 的所指与语气
  choice: 译为“主”
  alternative: 译为“主人”或“主宰”
  rationale: “主”保留宗教文本中的权威称谓，也避免“主人”在现代汉语中可能产生的奴仆制联想；上下文可决定具体所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“供物”“蒙悦纳”“规例”保留礼仪和规范语域；句式尽量紧凑，并保持原文两分句之间的论证关系。
