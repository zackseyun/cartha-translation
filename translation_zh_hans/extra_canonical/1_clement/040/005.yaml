revisions:
- from: 因为大祭司有赐给他自己的职任，众祭司有指定给他们自己的位置，利未人也各有交付给他们的服事；平信徒则受平信徒的规条约束。
  to: 因为大祭司被赐予专属的礼仪职务，祭司被指定了专属的位置，利未人被赋予专属的服务职责；平民受平民的规条约束。
  rationale: 修订主要处理汉语语序和术语时代感，不改变原文的并列结构或制度性语气。“专属的”对应三次ἴδιος；“位置”保留τόπος可指所定地点、位置或范围的开放性；末句重复“平民”对应λαϊκός的名词与形容词形式。英文冠词脚注只涉及英语表达，对中文无须设置脚注。
