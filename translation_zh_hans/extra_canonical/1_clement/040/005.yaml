source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ ἀρχιερεῖ ἴδιαι λειτουργίαι δεδομέναι εἰσίν, καὶ τοῖς ἱερεῦσιν ἴδιος ὁ τόπος προστέτακται, καὶ λευΐταις ἴδιαι διακονίαι ἐπίκεινται· ὁ λαϊκὸς ἄνθρωπος τοῖς λαϊκοῖς προστάγμασιν δέδεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/005.yaml
  text: For to the high priest his own ministries have been given[a], and to the priests their own place has been assigned, and upon the Levites their own services are laid; the layman is bound by the lay ordinances.
translation:
  language: zh_hans
  text: 因为大祭司被赐予专属的礼仪职务，祭司被指定了专属的位置，利未人被赋予专属的服务职责；平民受平民的规条约束。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχιερεῖ
  choice: 大祭司
  rationale: 准确对应犹太礼仪语境中的“high priest”，也是现代中文通行称谓。
- source_word: λειτουργίαι
  choice: 职任
  rationale: 此处指大祭司受托履行的特定礼仪职责；译作“职任”既包含职责也保留制度性，避免现代“事工”可能带来的教会术语偏向。
- source_word: ἱερεῦσιν
  choice: 众祭司
  rationale: 复数名词，译为“众祭司”自然体现群体含义。
- source_word: τόπος
  choice: 位置
  rationale: 保留原词既可指指定地点、也可指所处位置或席位的宽度，不将其窄化为“职分”。
- source_word: λευΐταις
  choice: 利未人
  rationale: 采用现代中文圣经传统中通行的族群及礼仪群体名称。
- source_word: διακονίαι
  choice: 服事
  rationale: 表达受托承担的服务性职责，并与 λειτουργίαι 的“职任”作适度区分。
- source_word: λαϊκὸς ἄνθρωπος
  choice: 平信徒
  rationale: 在此祭司、利未人与非圣职人员的对照语境中，“平信徒”最自然；不译作泛义“普通人”，以免削弱礼仪身份对比。
- source_word: προστάγμασιν
  choice: 规条
  rationale: 体现命令、规定之义，同时适合本段关于秩序与职责界限的正式语境。
- source_word: δέδεται
  choice: 受……约束
  rationale: 准确传达完成时被动态“已被捆绑／约束”的持续效力，又避免中文直译“捆绑”造成不必要的负面色彩。
theological_decisions:
- issue: τόπος 是礼仪地点还是制度职分
  choice: 位置
  alternative: 职分／岗位
  rationale: 原文仅说“自己的 τόπος”，语义可涉及指定的位置、范围或席位；采用“位置”保留其开放性，不把它直接解释成教会职阶。
- issue: λαϊκός 的身份含义
  choice: 平信徒
  alternative: 俗人／普通人
  rationale: 上下文明确排列大祭司、祭司、利未人与 λαϊκός，属于礼仪秩序上的身份对照；“平信徒”清楚而不贬义，但不据此导入后世宗派性的圣职理论。
- issue: 各类职责是否含等级价值判断
  choice: 按原文并列陈述各自受指定的职责与规条
  alternative: 解释为某一类人在属灵价值上高于另一类
  rationale: 原文强调秩序、分工和约束，并未明说属灵价值高低，因此译文不添加等级评价。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文四重平行结构及分号转折；用“有赐给他自己的／有指定给他们自己的／各有交付给他们的”体现 ἴδιος 的反复强调，同时略作汉语化以避免生硬。原英文脚注“Or 'upon Levites'”源于英文冠词表达问题，对中文翻译没有实质影响，故不设脚注。
