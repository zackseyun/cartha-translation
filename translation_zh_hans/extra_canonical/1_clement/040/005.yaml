review_pass:
  verdict: revise
  source_fidelity: 译文整体保留了原文四项并列的礼仪秩序：大祭司的λειτουργίαι、祭司的τόπος、利未人的διακονίαι，以及λαϊκὸς ἄνθρωπος受λαϊκοῖς προστάγμασιν约束。惟“平信徒”容易把这里以以色列礼仪身份为背景的“非祭司／平民”提前具体化为后世教会内部的信徒类别；“服事”也略偏现代教会用语。
  naturalness: “有赐给他自己的职任”“有指定给他们自己的位置”“各有交付给他们的服事”均明显受原语语序影响，在现代汉语中不够顺畅。改为被动式和“专属的”可保留ἴδιος的强调，并使平行结构自然清楚。
  terminology: “大祭司”“祭司”“利未人”“规条”均可保留。“礼仪职务”较明确地表达λειτουργίαι在本处的礼仪语境；“服务职责”可表达διακονίαι而不导入特定宗派术语。将λαϊκὸς ἄνθρωπος译为“平民”较少时代错置，同时保留其与祭司体系相对的身份意义。
  issues:
  - severity: medium
    issue: “平信徒”具有过强的后世教会身份含义。
    rationale: λαϊκὸς ἄνθρωπος在此与大祭司、祭司、利未人并列，指礼仪体系中非祭司的平民；原文没有明示其为教会语境中的“信徒”。
  - severity: medium
    issue: 前三分句的“有赐给／有指定／交付给”语序不符合自然现代汉语。
    rationale: 原文的完成时被动可用“被赐予／被指定／加在……身上”自然表达，且仍保留既已设立、持续有效的意味。
  - severity: low
    issue: “服事”偏现代教会惯用语。
    rationale: διακονίαι在此指利未人所负的服务性职责；“服务职责”较为中性，并避免不必要的教会术语色彩。
  revised_text: 因为大祭司被赐予专属的礼仪职务，祭司被指定了专属的位置，利未人被赋予专属的服务职责；平民受平民的规条约束。
