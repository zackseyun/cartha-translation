  text: τὰς τε προσφορὰς καὶ λειτουργίας ἐπιτελεῖσθαι, καὶ οὐκ εἰκῇ ἢ ἀτάκτως ἐκέλευσεν γίνεσθαι, ἀλλʼ ὡρισμένοις καιροῖς καὶ ὥραις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/002.yaml
  text: He commanded that both the offerings and the services be performed[a], and not take place casually or disorderly, but at appointed times and hours.
translation:
  language: zh_hans
  text: 他吩咐，献上祭物和履行礼仪事务，不可随意或失序，而要在规定的时日和时辰进行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσφορὰς
  choice: 供物
  rationale: 指献上的礼物或祭献之物；“供物”简洁庄重，并保留礼仪语境。
- source_word: λειτουργίας
  choice: 礼仪
  rationale: 此处与“供物”并列，指依规定履行的宗教礼仪事务；译作“礼仪”比泛泛的“服事”更贴合上下文。
- source_word: ἐπιτελεῖσθαι
  choice: 按规矩举行
  rationale: 该词表示完成、施行；结合下文对秩序与时间的强调，用“举行”自然，“按规矩”明确其受命规范，但不添加具体制度内容。
- source_word: εἰκῇ
  choice: 随意
  rationale: 表示无目的、无安排或任意而行，与后文规定的时间形成对照。
- source_word: ἀτάκτως
  choice: 混乱
  rationale: 表示不按秩序、失序地进行；“混乱”以副词性方式自然衔接“不可”。
- source_word: ὡρισμένοις καιροῖς καὶ ὥραις
  choice: 规定的日期和时辰
  rationale: ὡρισμένοις意为划定、指定；καιροῖς在此指规定的时日，ὥραις指具体时辰，保留二者并列而不合并。
theological_decisions:
- issue: 命令的主语
  choice: 保留为“他”
  alternative: 明确译为“上帝”或“主”
  rationale: 希腊文本仅以动词第三人称单数表达主语，本节所指虽可由上下文辨认，但本句不直接命名；译文不擅自补明神名。
- issue: λειτουργίας的礼仪与职分含义
  choice: 译作“礼仪”
  alternative: “服事”“职事”或“事奉”
  rationale: 与供物、规定日期和时辰并列时，重点在所施行的敬拜礼仪；但不将其窄化为某一宗派的圣礼或教职制度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“供物—礼仪”及“日期—时辰”的并列结构，并突出随意、失序与规定时间之间的对比。
