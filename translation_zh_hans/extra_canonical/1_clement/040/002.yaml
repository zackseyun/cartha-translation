revisions:
- from: 他吩咐，供物和礼仪都要按规矩举行，不可随意或混乱，而要在规定的日期和时辰举行。
  to: 他吩咐，献上祭物和履行礼仪事务，不可随意或失序，而要在规定的时日和时辰进行。
  rationale: 修订以“献上祭物”和“履行礼仪事务”更自然地呈现προσφορά与λειτουργία在祭祀语境中的并列，并将秩序性限定保留在对应εἰκῇ或ἀτάκτως的分句中。“规定的时日和时辰”对应ὡρισμένοις καιροῖς καὶ ὥραις，避免将καιροί限定为具体日期。无需脚注。
