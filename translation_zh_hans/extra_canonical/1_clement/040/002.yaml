review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了命令、供物与礼仪事务的并列、不得任意或失序，以及指定时间的对比。不过，“按规矩”提前加入到ἐπιτελεῖσθαι中，虽与下文思想相合，却并非该动词本身所表达；“日期”也将καιροῖς较宽的“时日／时机”不必要地限定为日历日期。
  naturalness: 原句通顺庄重，但“供物和礼仪都要……举行”搭配略不均衡；以“献上供物和履行礼仪事务”分别对应两项，更自然且更贴近动词的施行义。
  terminology: προσφοραί在本段祭祀语境中译为“祭物”较“供物”更明确且避免现代汉语中“供物”的非特定宗教联想。λειτουργίαι译为“礼仪事务”保留其礼仪性服务／职事的广度，不将其限定为某一宗派礼仪。
  issues:
  - severity: medium
    issue: “按规矩”被置入“举行”中
    rationale: ἐπιτελεῖσθαι意为施行、完成；“不可随意或混乱”才说明施行方式。提前加入“按规矩”使译文略有重复并增添动词自身未明说的限定。
  - severity: low
    issue: “日期”过窄
    rationale: ὡρισμένοις καιροῖς指被指定的时日、时机或时期；紧接ὥραις（时辰）时，译作“规定的时日和时辰”保留原文并列及καιροί的较宽含义。
  - severity: low
    issue: “供物和礼仪……举行”搭配不够平行
    rationale: 供物通常“献上”，而礼仪事务通常“履行／施行”。分别表达可使汉语自然，同时不改变原文由同一动词统摄两项的意思。
  revised_text: 他吩咐，献上祭物和履行礼仪事务，不可随意或失序，而要在规定的时日和时辰进行。
