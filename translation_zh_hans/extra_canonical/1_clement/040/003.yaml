source:
  edition: Funk 1901 (normalized OCR)
  text: ποῦ τε καὶ διὰ τίνων ἐπιτελεῖσθαι θέλει, αὐτὸς ὥρισεν τῇ ὑπερτάτῃ αὐτοῦ βουλήσει, ἵνʼ ὁσίως πάντα γινόμενα ἐν εὐδοκήσει εὐπρόσδεκτα εἴη τῷ θελήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/003.yaml
  text: And where and through whom he wants them to be performed[a], he himself determined by his supreme will, so that all things, being done in holiness, might be acceptable to his will according to his good pleasure.
translation:
  language: zh_hans
  text: 至于他愿意这些事在何处、借着哪些人执行，他已经凭自己至高的旨意作了规定，为要使一切事都圣洁地成就，并按他的美意蒙他的旨意悦纳。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要使一切事都圣洁地、按他的美意成就，并蒙他的旨意悦纳。”希腊语“按他的美意”也可能修饰“成就”。
    reason: 保留ἐν εὐδοκήσει在句中修饰关系的真实歧义。
lexical_decisions:
- source_word: ποῦ τε καὶ διὰ τίνων
  choice: 在何处、借着哪些人
  rationale: 分别保留地点与执行者两个要素；διά加属格表示中介或施行者。
- source_word: ἐπιτελεῖσθαι
  choice: 执行
  rationale: 承接上下文所指的礼仪或规定之事，表达完成、施行之意，同时避免在本节内过度具体化。
- source_word: τῇ ὑπερτάτῃ αὐτοῦ βουλήσει
  choice: 凭自己至高的旨意
  rationale: ὑπερτάτῃ表示最高、至高；βουλήσει指意志或定意，此处译为“旨意”符合庄重语域。
- source_word: ὁσίως
  choice: 圣洁地
  rationale: 表达合乎神圣要求、虔敬而正当地行事。
- source_word: ἐν εὐδοκήσει
  choice: 按他的美意
  rationale: εὐδοκία可指美意、喜悦或认可；正文将其与蒙悦纳相连，但希腊语的修饰关系存在一定弹性。
- source_word: εὐπρόσδεκτα εἴη τῷ θελήματι αὐτοῦ
  choice: 蒙他的旨意悦纳
  rationale: 保留“为其旨意所接纳”的不寻常表达，不擅自改成“蒙神悦纳”。
theological_decisions:
- issue: “他的旨意”与“他的美意”的关系
  choice: 译作“并按他的美意蒙他的旨意悦纳”
  alternative: “使一切事都圣洁地、按他的美意成就，并蒙他的旨意悦纳”
  rationale: ἐν εὐδοκήσει既可能与γινόμενα联系，也可能与εὐπρόσδεκτα εἴη联系。正文采用较自然且与近期审订一致的后者理解，脚注保留前者。
- issue: 礼仪秩序是否具体指圣职体系
  choice: 保留“这些事”“哪些人”的一般表述
  alternative: 明确译作“礼仪”“祭司”
  rationale: 本节希腊文本本身没有使用这些更具体的名词，不应把上下文推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“作了规定”“蒙……悦纳”保留教会文献的正式语气；避免古奥句式，也不把未明说的礼仪或职分名称补入正文。
