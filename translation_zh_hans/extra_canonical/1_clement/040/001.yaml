  text: Προδήλων οὖν ἡμῖν ὄντων τούτων, καὶ ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως, πάντα τάξει ποιεῖν ὀφείλομεν, ὅσα ὁ δεσπότης ἐπιτελεῖν ἐκέλευσεν κατὰ καιροὺς τεταγμένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/001.yaml
  text: Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do in order everything that the Master commanded to be carried out at the appointed times. to be carried out at the appointed times.
translation:
  language: zh_hans
  text: 因此，既然这些事对我们是显明的，我们又已俯身细察神圣知识的深处，就应当按着秩序，实行主宰所吩咐在既定时节实行的一切事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προδήλων
  choice: 已经显明
  rationale: 表达事物清楚、明显、无须隐藏推求的含义，同时保持庄重自然。
- source_word: ἐγκεχυφότες
  choice: 深入察看了
  rationale: 该词有俯身细看、专注探究之意；译文兼顾其形象性与上下文中深入认识的含义。
- source_word: τὰ βάθη τῆς θείας γνώσεως
  choice: 神圣知识的深处
  rationale: 保留“深处”的空间隐喻，并避免把属格关系过度限定为“关于上帝的知识”。
- source_word: τάξει
  choice: 按秩序
  rationale: 将方式与格译为依照次序、有条理地，而不误解为表示目的的连接语。
- source_word: ὁ δεσπότης
  choice: 主宰
  rationale: 体现 δεσπότης 所含的权柄和主人身份，且不把它与较常见的 κύριος 完全抹平。
- source_word: κατὰ καιροὺς τεταγμένους
  choice: 在指定时节
  rationale: καιροί 指合宜或特定的时机、时节，τεταγμένους 表明这些时间已被安排指定。
theological_decisions:
- issue: “神圣知识”的属格和所指
  choice: 神圣知识的深处
  alternative: 关于上帝之知识的深处
  rationale: 原文 θείας 是形容词，译为“神圣知识”较贴近句法，也保留它可能指来自上帝或具有神圣性质之知识的开放性。
- issue: τάξει 与句中成分的关系
  choice: 理解为修饰“完成”的方式语，即“按秩序完成”
  alternative: 理解为“一切有秩序的事”或与后文形成其他紧密组合
  rationale: 与格 τάξει 最自然地表示行为方式；脚注说明可能的语序/辖域差异，避免把它误译成目的从句。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“深入察看”保留原文俯身探究的意象；“主宰”体现 δεσπότης 的权柄色彩。主句略作汉语化调整，但保留原文从显明之事、神圣知识到有序遵行命令的论证推进。
