  choice: 你坐在我的右边
  rationale: 按希腊文直译其位置与尊荣意象；现代汉语自然清楚。
- source_word: ἕως ἂν ϑῶ
  choice: 直到我使
  rationale: 保留时间界限表达及说话者主动使之成就的语义。
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: 成为你脚下的脚凳
  rationale: 保留原文的具体比喻；“脚下的脚凳”虽有语义复现，却准确传达希腊语完整措辞及征服意象。
