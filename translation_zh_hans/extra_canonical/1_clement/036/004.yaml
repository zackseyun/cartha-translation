base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/004.yaml
  text: 'But concerning his Son[a], the Master spoke thus:

    “You are my Son;

    today I have begotten you.

    Ask of me, and I will give you the nations as your inheritance,

    and the ends of the earth as your possession.”'
translation:
  language: zh_hans
  text: '至于他的儿子，主宰这样说：


    “你是我的儿子；

    我今日生了你。

    你向我求，

    我就把列国赐给你作产业，

    把地极赐给你作领地。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ δὲ τῷ υἱῷ αὐτοῦ
  choice: 至于他的儿子
  rationale: 用“至于”表达ἐπί加与格在此引出论题的作用；“他的儿子”忠实保留原文的所属关系。
- source_word: ὁ δεσπότης
  choice: 主宰
  rationale: δεσπότης强调拥有权柄的主人或统治者；译作“主宰”既区别于通常译作“主”的κύριος，也保留其权威意味。
- source_word: σήμερον γεγέννηκά σε
  choice: 我今日生了你
  rationale: γεγέννηκα是γεννάω的完成时；“生了你”保留原文的生育措辞及其神学张力，不改释为“立你”或其他解释性表达。
- source_word: ἔθνη
  choice: 列国
  rationale: 此处指各民族或万国；“列国”符合诗歌语体，并与作为产业的普世疆域相称。
- source_word: κληρονομία
  choice: 产业
  rationale: 保留继承所得之份的含义，也符合诗篇引文的庄重语域。
- source_word: κατάσχεσις
  choice: 领地
  rationale: 该词表示占有之物或所拥有的地域；结合“地极”，译作“领地”自然且与“产业”形成平行。
theological_decisions:
- issue: “今日生了你”的含义
  choice: 直译为“我今日生了你”
  alternative: “我今日立了你”或“我今日成了你的父”
  rationale: 原文明确使用γεννάω，不应在译文中预先判定这句话指永恒生出、登基、复活或其他事件；直译保留其解释空间和神学张力。
- issue: 引语的发言者及引介结构
  choice: “至于他的儿子，主宰这样说”
  alternative: “至于他的儿子，则这样记着：主宰说”
  rationale: 原文含有εἶπεν ὁ δεσπότης，必须明确保留“主宰说”；将其自然整合为汉语引介句，避免误读为无主语的“经上说”，同时不增加原文没有的“经上记着”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并以分行形式保留诗篇引文的平行结构。“产业”“地极”“主宰”略具经典色彩，但在现代语境中仍清楚自然。
