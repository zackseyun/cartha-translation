id: 1CLEM.36.1
reference: 1 Clement 36:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: Αὕτη ἡ ὁδός, ἀγαπητοί, ἐν ᾗ εὕρομεν τὸ σωτήριον ἡμῶν, Ἰησοῦν Χριστόν, τὸν ἀρχιερέα τῶν προσφορῶν ἡμῶν, τὸν προστάτην καὶ βοηθὸν τῆς ἀσθενείας ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/001.yaml
  text: 'This is the way, beloved, in which we found our salvation: Jesus Christ, the high priest of our offerings, the protector and helper of our weakness.'
translation:
  language: zh_hans
  text: 亲爱的，这就是我们找到救恩的道路：耶稣基督[a]。他是我们所献之物的大祭司，是在我们软弱中保护、帮助我们的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”也可译作“弥赛亚”。
    reason: 保留 Χριστός 作为受膏者称号的语义，同时正文依其在该语境中的固定称谓用法译为“基督”。
lexical_decisions:
- source_word: Αὕτη ἡ ὁδός, ... ἐν ᾗ
  choice: 这就是……的道路
  rationale: 保留原文“道路”的意象，并用现代汉语自然表达关系从句。
- source_word: τὸ σωτήριον ἡμῶν
  choice: 救恩
  rationale: σωτήριον 在此指上帝借基督带来的拯救；“救恩”准确、凝练，也符合庄重语体。
- source_word: Ἰησοῦν Χριστόν
  choice: 耶稣基督
  rationale: 此处无冠词，且在克莱孟的教会语境中更自然地构成固定称谓；不在正文中强化为“弥赛亚”。
- source_word: τὸν ἀρχιερέα τῶν προσφορῶν ἡμῶν
  choice: 我们所献之物的大祭司
  rationale: προσφορά 可指奉献、供物或献祭；采用较宽泛的“所献之物”，避免把原文范围过早限定为某一种祭。
- source_word: τὸν προστάτην καὶ βοηθὸν
  choice: 保护、帮助我们的那一位
  rationale: 分别传达 προστάτης 的护卫、支持作用和 βοηθός 的帮助作用，同时使汉语行文自然。
- source_word: τῆς ἀσθενείας ἡμῶν
  choice: 在我们软弱中
  rationale: 希腊语属格与两个称谓的确切关系可有表达弹性；此译自然传达基督面对人之软弱所施的保护与帮助。
theological_decisions:
- issue: Χριστός 是固定称谓还是显明译作“弥赛亚”
  choice: 正文译“基督”
  alternative: 耶稣弥赛亚
  rationale: 晚期第一世纪教会希腊语中“耶稣基督”已是惯常固定称谓；原文在此没有特别强调称号释义，但脚注保留其词源和称号层面的可能译法。
- issue: “大祭司”所关联的 προσφοραί
  choice: 保留为“我们所献之物”
  alternative: 我们的祭物／我们的奉献
  rationale: 避免将 προσφορά 仅限于礼仪祭物或一般捐献，保留该词可能涵盖的奉献与供献含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。将希腊文一个长句分为两句，以清楚呈现“耶稣基督”与随后两个同位称谓之间的关系；不增添宗派性解释。
