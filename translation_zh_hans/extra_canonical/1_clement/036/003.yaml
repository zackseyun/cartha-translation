  text: γέγραπται γὰρ οὕτως· ‘Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/003.yaml
  text: 'For it is written thus:

    “He makes his angels winds,

    and his ministers a flame of fire.”'
translation:
  language: zh_hans
  text: '因为经上这样写着：


    “他使自己的天使成为风，

    使自己的仆役成为火焰。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελοι
  choice: 天使
  rationale: 在所引诗篇的语境及早期基督教用法中，此词自然指天上的使者；译作“天使”清楚而庄重。
- source_word: πνεύματα
  choice: 风
  rationale: πνεῦμα可指“灵”或“风”；这里对应诗篇引文的希伯来语背景及平行的自然意象“火焰”，译作“风”，同时不否认希腊词本身存在“灵”的可能。
- source_word: λειτουργοί
  choice: 仆役
  rationale: 该词指执行服事者；“仆役”保留其服务、受差遣的含义，也与天上使者的语境相称。
- source_word: πυρὸς φλόγα
  choice: 火焰
  rationale: 直译为“火的焰”；现代汉语用“火焰”即可准确、自然地表达。
theological_decisions:
- issue: πνεύματα的多义性
  choice: 正文译为“风”
  alternative: “灵”
  rationale: 此句引自《诗篇》104:4（七十士译本103:4）；希伯来语背景和平行结构支持“风”，但希腊语πνεύματα也可理解为“灵”。不在正文中把两义混合。
- issue: ποιῶν的含义
  choice: “使……成为……”
  alternative: “造……”
  rationale: ποιέω在此结构中可表达任命、使之成为某种形态；“使……成为……”比“造”更能保留句法关系，也避免额外断定此句专论受造起源。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留引文的诗行格式和对仗结构。
