  yaml_path: translation/extra_canonical/1_clement/036/006.yaml
  text: Who then are the enemies? The wicked and those who set themselves against his will[a].
translation:
  language: zh_hans
  text: 那么，仇敌是谁呢？就是那些作恶、抗拒他旨意的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φαῦλοι
  choice: 作恶
  rationale: 在此道德语境中指邪恶、品行败坏；译作“作恶”自然易懂，又避免“卑劣”所带的额外情绪色彩。
- source_word: ἀντιτασσόμενοι
  choice: 抗拒
  rationale: 该词有列阵反对、抵挡之意；“抗拒”既保留主动对抗的力度，也符合现代汉语表达。
- source_word: τῷ θελήματι αὐτοῦ
  choice: 他旨意
  rationale: 直译为“他的旨意”，所指人物由上下文确定；“旨意”适合庄重的宗教语境。
theological_decisions:
- issue: 两个描述是否指两类人
  choice: 译为同一群人的并列特征：“那些作恶、抗拒他旨意的人”
  alternative: “恶人和那些抗拒他旨意的人”
  rationale: 希腊文只有一个冠词 οἱ，统摄 φαῦλοι 与 ἀντιτασσόμενοι，更自然地将二者理解为同一群人的两个相关描述，同时不排除修辞上的并列。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“那么……是谁呢？”保留原文设问语气；以“就是”自然引出答案。
