revisions:
- from: 借着他，我们定睛仰望诸天的高处；借着他，我们如同在镜中看见他那无瑕、至高的容颜；借着他，我们心中的眼睛得以开启；借着他，我们愚昧昏暗的心思萌发，进入光明；借着他，主愿意让我们尝到不朽的知识。他既是主威严所发的光辉，就远比天使尊贵，正如他所承受的名远比他们卓越。
  to: 借着他，我们定睛仰望诸天的高处；借着他，我们如同在镜中看见他那无瑕、至高的容颜；借着他，我们心中的眼睛得以开启；借着他，我们愚昧昏暗的心思向着光明萌发；借着他，主愿意让我们尝到不朽的知识。他既是主的威严的光辉，就比天使更伟大，正如他所承受的名比他们所承受的名更卓越。
  rationale: 修订仅处理三处：以“更伟大”避免将μείζων限定为“尊贵”；明确“名”与天使所承受之名的比较；将“进入光明”调整为“向着光明萌发”。其余措辞保留原稿的修辞节奏、庄重语域及对代词指向的克制。
