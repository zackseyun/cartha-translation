id: 1CLEM.36.2
reference: 1 Clement 36:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τούτου ἀτενίζομεν εἰς τὰ ὕψη τῶν οὐρανῶν, διὰ τούτου ἐνοπτριζόμεθα τὴν ἄμωμον καὶ ὑπερτάτην ὄψιν αὐτοῦ, διὰ τούτου ἠνεῴχθησαν ἡμῶν οἱ ὀφθαλμοὶ τῆς καρδίας, διὰ τούτου ἡ ἀσύνετος καὶ ἐσκοτωμένη διάνοια ἡμῶν ἀναθάλλει εἰς τὸ φῶς, διὰ τούτου ἠθέλησεν ὁ δεσπότης τῆς ἀϑανάτου γνώσεως ἡμᾶς γεύσασϑαι, ὃς ὢν ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ, τοσούτῳ μείζων ἐστὶν ἀγγέλων, ὅσῳ διαφορώτερον ὄνομα κεκληρονόμηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/002.yaml
  text: Through him we fix our gaze on the heights of the heavens; through him we behold as in a mirror his spotless and most exalted countenance; through him the eyes of our heart were opened; through him our foolish and darkened mind springs up into the light; through him the Master willed that we should taste of immortal knowledge—he who, being the radiance of his majesty, is by so much greater than the angels as he has inherited a more excellent name.
translation:
  language: zh_hans
  text: 借着他，我们定睛仰望诸天的高处；借着他，我们如同在镜中看见他那无瑕、至高的容颜；借着他，我们心中的眼睛得以开启；借着他，我们愚昧昏暗的心思向着光明萌发；借着他，主愿意让我们尝到不朽的知识。他既是主的威严的光辉，就比天使更伟大，正如他所承受的名比他们所承受的名更卓越。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τούτου
  choice: 借着他
  rationale: 保留反复出现的工具或中介含义，并在汉语中维持原文的排比结构。
- source_word: ἀτενίζομεν
  choice: 定睛仰望
  rationale: 表达持续、专注凝视之意；因宾语是“诸天的高处”，加入“仰”使汉语自然。
- source_word: ἐνοπτριζόμεθα
  choice: 如同在镜中看见
  rationale: 保留与镜子有关的意象，同时不强行判定该中间态动词在此是“映照”还是“观看”的全部语义范围。
- source_word: ὄψιν
  choice: 容颜
  rationale: 在此指可见的面貌或形象；“容颜”比“景象”更符合带有人称代词的语境。
- source_word: διάνοια
  choice: 心思
  rationale: 指理解、思想的官能；现代汉语“心思”既自然，也能与前句“心中的眼睛”衔接。
- source_word: ἀναθάλλει
  choice: 萌发
  rationale: 保留原词“重新抽芽、繁茂”的生命意象，而不简化为抽象的“苏醒”。
- source_word: δεσπότης
  choice: 主
  rationale: 表达拥有权柄的主人；“主”在庄重宗教语境中自然，且避免生硬的“主宰者”。
- source_word: γεύσασϑαι
  choice: 尝到
  rationale: 保留“品尝、经历”的隐喻，并与属格“知识”自然搭配。
- source_word: ἀϑανάτου γνώσεως
  choice: 不朽的知识
  rationale: 形式上保留形容词对“知识”的修饰，不将其解释性改写为“使人不死的知识”或“永生的知识”。
- source_word: ἀπαύγασμα
  choice: 所发的光辉
  rationale: 兼顾“放射出的光辉”之意，并保持与《希伯来书》传统措辞的关联。
- source_word: κεκληρονόμηκεν
  choice: 所承受
  rationale: 保留“继承、承受为产业”的语义，而不弱化为单纯“获得”。
theological_decisions:
- issue: αὐτοῦ在“容颜”与“威严”中的所指
  choice: 均译为“他／主”，不另行明确为“父”或“上帝”
  alternative: 明确译作“上帝的容颜／上帝的威严”
  rationale: 希腊文只用第三人称代词，语境虽可推知所指，却不宜在正文中加入原文没有的专名。
- issue: 基督与天使的比较
  choice: 译为“远比天使尊贵”
  alternative: 译为“比天使更大”
  rationale: μείζων字面为“更大”，此处与所承受之名的卓越相连，表达身份和地位的优越；“尊贵”在现代汉语中更自然，同时不引入本体论细化。
- issue: “不朽的知识”的性质
  choice: 保持“不朽的知识”这一开放表达
  alternative: 解释为“关于永生的知识”或“使人得永生的知识”
  rationale: 属格结构及形容词本身未明确说明这种知识是不朽、关乎不朽，还是带来不朽，因此不在翻译中消解张力。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留五次“借着他”的首语反复，以呈现原文修辞节奏；长句在“知识”后分句，避免汉语结构过度盘绕，同时保持后半部分对该人物的连续说明。
