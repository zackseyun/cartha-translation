  text: ἀπὸ τῆς ταλαιπωρίας τῶν πτωχῶν καὶ τοῦ στεναγμοῦ τῶν πενήτων νῦν ἀναστήσομαι, λέγει κύριος· θήσομαι ἐν σωτηρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/006.yaml
  text: ‘Because of the misery of the poor and because of the groaning of the needy, now I will arise,’ says the Lord. ‘I will set him in safety.’
translation:
  language: zh_hans
  text: “因穷人的困苦，因贫乏者的叹息，我现在要起来，”主说，“我要使他得享安全。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταλαιπωρίας
  choice: 困苦
  rationale: 表达苦难、悲惨的处境，既贴近原义，也符合现代汉语的庄重语体。
- source_word: πτωχῶν
  choice: 穷人
  rationale: 直接表达物质贫困者，保留与后文近义词并列的修辞。
- source_word: στεναγμοῦ
  choice: 叹息
  rationale: 对应因受苦而发出的呻吟或叹息；此处采用自然、庄重且不过度强化的译法。
- source_word: πενήτων
  choice: 贫乏者
  rationale: 与“穷人”形成近义变化，并体现生活资源匮乏、处境困窘的人。
- source_word: ἀναστήσομαι
  choice: 我要起来
  rationale: 保留神采取行动的形象性表达，不释义为“介入”或“施救”。
- source_word: θήσομαι ἐν σωτηρίῳ
  choice: 我要使他安然无恙
  rationale: 表达将某人置于安全、得救的境地；保留隐含的单数受益者，不擅自改成复数。
theological_decisions:
- issue: θήσομαι 的宾语在现存希腊文本中未明说
  choice: 以“他”补出单数受益者
  alternative: 译作“我要设立救援”或“我要置于安全之中”而不补宾语
  rationale: 上下文指向受压迫的贫困者，英语审校层也保留单数“him”；中文若完全省略宾语不自然，因此用“他”，同时不进一步确定具体所指。
- issue: σωτήριον 的语义范围
  choice: 安然无恙
  alternative: 救恩；安全之地；救援
  rationale: 此处语境侧重主起来保护困苦者，使其处于安全境地；避免把词义狭化为后世系统神学意义上的“救恩”。
translation_notes:
  register: 采用现代、庄重而易懂的引文语体；保留原文两组近义并列以及“起来”的形象表达。引号和标点按现代简体中文规范处理。
