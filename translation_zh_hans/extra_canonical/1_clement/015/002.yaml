  text: For somewhere it says, “This people honors me with their lips, but their heart is far from me.”
translation:
  language: zh_hans
  text: 因为有一处说：“这百姓用嘴唇尊敬我，心却远离我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ που
  choice: 因为经上有一处说
  rationale: που表示未明确指出出处的“某处”；结合引文语境，用“经上有一处说”自然传达作者是在援引经文。γάρ译作“因为”，保留与上文的论证关系。
- source_word: τοῖς χείλεσιν
  choice: 用嘴唇
  rationale: 保留原文具体意象，也符合现代汉语中的经文表达。
- source_word: τιμᾷ
  choice: 尊敬
  rationale: 准确表达以言语给予尊荣之意；相比“荣耀”，不额外强化礼仪或神学色彩。
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: 心却
  rationale: 希腊文以单数“心”配复数所有者，指这百姓共同或整体的内在状态；中文省去重复的“他们的”更自然，同时保留单数集合意味。
- source_word: πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ
  choice: 远离我
  rationale: 简洁表达空间隐喻所指的关系疏远，并保留原文“离开、相距甚远”的力度。
theological_decisions:
- issue: “心”是单数，而“百姓”具有集合意义
  choice: 保留“心”的单数形式
  alternative: 译作“他们的心”或“他们心里”
  rationale: 原文καρδία为单数，可能将群体视为一个整体；译文不将其擅自改为复数，也不具体化为个人心理。
- issue: 引文出处未明确标名
  choice: 译作“经上有一处说”
  alternative: 仅译作“有一处说”
  rationale: λέγει γάρ που本身不点明出处，但后接权威性经文引语；“经上”使现代读者清楚这是经文援引，同时“有一处”保留出处未指明的特点。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。句式简洁，保留“嘴唇—心”的鲜明对比；不用较古雅的“口尊”“心远”等压缩表达。
