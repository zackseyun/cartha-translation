base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/004.yaml
  text: And again it says, “They loved him with their mouth, and with their tongue they lied to him; but their heart was not upright with him, nor were they faithful in his covenant.”
translation:
  language: zh_hans
  text: 又有话说：“他们用口爱他，用舌头向他说谎；他们的心对他却不正直，也不忠于他的约。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν
  choice: 他们用口爱他
  rationale: 保留原文“爱”与“口”的直陈和反讽张力，不改写为较具解释性的“口头表示爱他”。
- source_word: τῇ γλώσσῃ αὐτῶν ἐψεύσαντο αὐτόν
  choice: 用舌头向他说谎
  rationale: 自然表达工具格“用舌头”，并将带宾语的 ἐψεύσαντο αὐτόν 译为“向他说谎”。
- source_word: οὐκ εὐθεῖα μετ᾽ αὐτοῦ
  choice: 对他却不正
  rationale: “正”对应 εὐθεῖα，保留心在与神的关系中不正直这一形象；“对他”自然传达 μετ᾽ αὐτοῦ。
- source_word: οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ
  choice: 也不忠于他的约
  rationale: ἐπιστώθησαν 在此表达忠信、可靠；“忠于他的约”以现代汉语清楚传达其关系性含义，同时避免额外加入“被证实为”等解释。
theological_decisions:
- issue: διαθήκη 的译法
  choice: 约
  alternative: 盟约
  rationale: “约”是简洁、通行且具有经文语域的对应词，不额外限定该约的类型或神学体系。
- issue: ἐπιστώθησαν 的语态与意义
  choice: 不忠于
  alternative: 未被证实为忠信／没有坚定持守
  rationale: 该形式虽可在字面上引出“被确立为忠信”等理解，但在此诗歌性平行结构中主要指他们对约不忠；译文不加入原文未明说的审判或验证场景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“用口爱他／用舌头说谎”的平行和反讽，并以分号呈现外在言语与内心不正之间的转折。
