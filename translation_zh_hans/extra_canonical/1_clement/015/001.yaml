  text: Therefore let us join ourselves to those who Therefore let us join ourselves to those who live in peace with godliness, and not to those who desire peace with hypocrisy..
translation:
  language: zh_hans
  text: 所以，让我们亲近那些以敬虔之心和平相处的人，不要亲近那些带着虚伪追求和平的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: 紧密相连
  rationale: 该词本义为“黏合、紧贴”，在此比喻坚定地依附、结交某一类人；“紧密相连”既保留力度，也符合现代汉语。
- source_word: εἰρηνεύουσιν
  choice: 促进和睦
  rationale: 可指和平相处、维持和平或促成和睦。结合劝勉语境，译作“促进和睦”自然，同时不把“敬虔”误当作和好的对象。
- source_word: εὐσεβείας
  choice: 敬虔
  rationale: 保留该词关于敬神、虔诚生活的宗教伦理内涵。
- source_word: ὑποκρίσεως
  choice: 虚伪地
  rationale: ὑπόκρισις在这里指伪善或假意；用副词结构表达和平愿望所带的虚假方式或性质。
- source_word: βουλομένοις εἰρήνην
  choice: 想求和睦
  rationale: 直译为“想要和平/和睦”；“想求和睦”保留意愿性，也与前半句实际促进和睦形成对照。
theological_decisions:
- issue: εὐσέβεια的宗教含义
  choice: 敬虔
  alternative: 虔诚／敬神
  rationale: “敬虔”在现代基督教汉语中清楚而庄重，也能涵盖对神的敬畏及由此而来的生活方式；经文本身没有要求进一步限定。
- issue: 和平与虚伪之间的张力
  choice: 保留“想求和睦”与“虚伪地”的并置
  alternative: 译成“假意求和”
  rationale: “假意求和”更流畅，却会较强地判定他们的和平愿望完全不真诚；正文保留希腊文中“愿望”与“虚伪相伴”的张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“为伍”与前面的“紧密相连”相呼应，并在汉语中自然补足第二分句省略的关系。
