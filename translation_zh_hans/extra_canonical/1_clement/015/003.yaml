  text: And again, “With their mouth they were blessing, but with their heart they were cursing.”
translation:
  language: zh_hans
  text: 又说：“他们用口祝福，心里却咒诅。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάλιν
  choice: 又说
  rationale: 这是引出另一处引文的惯用表达；译为“又说”在现代汉语中自然，也保留承接功能。
- source_word: Τῷ στόματι αὐτῶν
  choice: 他们用口
  rationale: 保留工具性的表达和“口”与“心”的鲜明对照。
- source_word: εὐλογοῦσαν
  choice: 祝福
  rationale: 准确表达未完成过去时所述的行为；汉语无需另行标出持续体。
- source_word: τῇ δὲ καρδίᾳ αὐτῶν
  choice: 心里却
  rationale: “却”对应 δὲ 的转折作用，“心里”是自然且忠实的现代汉语表达。
- source_word: κατηρῶντο
  choice: 咒诅
  rationale: 与“祝福”形成原文中的直接反义对照，并保留其强烈语义。
theological_decisions:
- issue: 外在言语与内心态度的对立
  choice: 按原文直译为“用口祝福，心里却咒诅”
  alternative: 解释为“嘴上说好话，心中却怀着恶意”
  rationale: 原文使用明确的“祝福／咒诅”宗教伦理词汇；不将其弱化为一般性的好话与恶意，以保留其神学和修辞张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。引号标明引文；保留“口／心”和“祝福／咒诅”两组对照。
