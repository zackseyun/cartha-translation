  text: I will speak boldly in him.’”[a]
translation:
  language: zh_hans
  text: “我要在其中坦然发言。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要为他放胆说话。”希腊文ἐν αὐτῷ字面为“在他／它里面”；其所指须由前文语境确定。
    reason: 保留ἐν αὐτῷ的指代及关系歧义，说明正文以“其中”作自然的语境性表达。
lexical_decisions:
- source_word: παρρησιάσομαι
  choice: 我要放胆说话
  rationale: 该动词表示坦然、无所畏惧地发言；“放胆说话”既保留勇敢直言的语义，也符合现代汉语表达。
- source_word: ἐν αὐτῷ
  choice: 为他
  rationale: 结合所引诗篇的上下文，代词指前文受欺压的困苦人；ἐν在这里可表达关涉对象，译为“为他”比直译“在他里面”自然且清楚，同时不把动作扩大解释为拯救或辩护。
theological_decisions:
- issue: ἐν αὐτῷ所指及其关系
  choice: 译作“为他”，理解为上帝针对困苦人而放胆发言
  alternative: 译作“在他里面”或“论到他”
  rationale: “在他里面”虽形式对应，但现代汉语中含义晦涩，并容易引出原文未必具有的神学联结意味；“论到他”较中性，却弱化了上下文中上帝站在受欺压者一边的关系。“为他”较能传达此处语境，同时脚注保留更贴近字面的可能译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。因本节是引文收尾，保留引号；脚注标记置于正文中。
