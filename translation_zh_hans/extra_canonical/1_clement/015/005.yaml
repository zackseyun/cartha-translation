    issue: 首句“不法、攻击义人”的语法关系略不明确。
    rationale: 希腊文 ἀνομίαν 是 λαλοῦντα 的内容／宾语，而 κατὰ τοῦ δικαίου 指向该不法言语所攻击的对象。改为“说出攻击义人的不法之言”可更直接呈现这一关系。
  - severity: low
    issue: 第二段“他们说”可能使“那些说……”看似脱离“愿主除灭”的并列宾语结构。
    rationale: 原文将“所有诡诈的嘴唇、夸口的舌头、那些说……的人”连续置于除灭的对象位置。以“以及那些说……的人”明确并列关系。
