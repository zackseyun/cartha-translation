revisions:
- from: 因此，愿诡诈的嘴唇都哑口无声，就是那些出言不法、攻击义人的嘴唇。又说：“愿主除灭一切诡诈的嘴唇和夸口的舌头；他们说：‘我们要高抬自己的舌头；我们的嘴唇由我们作主，谁能作我们的主呢？’”
  to: 因此，愿那些说出攻击义人的不法之言的诡诈嘴唇哑口无声。又说：“愿主除灭一切诡诈的嘴唇、夸口的舌头，以及那些说：‘我们要高抬我们的舌头；我们的嘴唇由我们作主，谁能作我们的主呢？’的人。”
  rationale: 作两处轻微句法调整：首句使“不法之言”与“攻击义人”的修饰关系明确；第二句恢复原文列举对象的并列结构。其余措辞、祈愿语气、引号层级及术语均可保留，故不需脚注。
