  text: διὰ τοῦτο ἄλαλα γενηθήτω τὰ χείλη τὰ δόλια τὰ λαλοῦντα κατὰ τοῦ δικαίου ἀνομίαν. καὶ πάλιν· Ἐξολεθρευθῆσαν κύριος πάντα τὰ χείλη τὰ δόλια, γλῶσσαν μεγαλοῤῥήμονα, τοὺς εἰπόντας· Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν, τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν· τίς ἡμῶν κύριός ἐστιν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/005.yaml
  text: Because of this, let the deceitful lips that speak lawlessness against the righteous become mute. And again, “May the Lord destroy all deceitful lips, the boastful tongue, those who say, ‘We will magnify our tongue; our lips are our own; who is lord over us?’”
translation:
  language: zh_hans
  text: 因此，愿那些说出攻击义人的不法之言的诡诈嘴唇哑口无声。又说：“愿主除灭一切诡诈的嘴唇、夸口的舌头，以及那些说：‘我们要高抬我们的舌头；我们的嘴唇由我们作主，谁能作我们的主呢？’的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλαλα γενηθήτω
  choice: 愿……哑口无声
  rationale: 保留第三人称命令式所表达的祈愿或宣告语气；“哑口无声”自然地传达不能说话之意。
- source_word: τὰ χείλη τὰ δόλια
  choice: 诡诈的嘴唇
  rationale: 保留原文以“嘴唇”代指言语者或其言语的诗歌意象，并准确表达 δόλια 的欺诈含义。
- source_word: λαλοῦντα κατὰ τοῦ δικαίου ἀνομίαν
  choice: 出言不法、攻击义人
  rationale: κατά 加属格表示敌对指向；ἀνομίαν 作所说的内容，译文既保留“不法”，也清楚呈现其针对义人的关系。
- source_word: Ἐξολεθρευθῆσαν
  choice: 愿……除灭
  rationale: 以祈愿式译法体现原文形态，同时不把诗句弱化为一般预测。
- source_word: γλῶσσαν μεγαλοῤῥήμονα
  choice: 夸口的舌头
  rationale: μεγαλορρήμων 指说大话、夸耀的言语；此译简洁自然，并保留“舌头”的意象。
- source_word: Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν
  choice: 我们要高抬自己的舌头
  rationale: μεγαλύνω 在此语境带有使之强大、夸大或高举的意味；“高抬”保留原文略显奇特的舌头意象及自恃语气。
- source_word: τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν
  choice: 我们的嘴唇由我们作主
  rationale: παρ᾽ ἡμῖν 表达嘴唇在自己掌控之下；此译比字面“在我们这里”更符合现代汉语，同时与下句“谁能作我们的主”形成呼应。
theological_decisions:
- issue: κύριος 在祈愿句与反问句中的所指及表达
  choice: 前句译“主”，后句译“谁能作我们的主呢”
  alternative: 前句译“耶和华”，后句译“谁是我们的主呢”
  rationale: 希腊文本使用 κύριος，未直接保留希伯来神名形式；统一使用“主”避免越过现有希腊证据。后句加入“能”自然呈现抗拒任何主权的挑衅语气，而不限定其仅为身份询问。
- issue: δικαίου 的单数含义
  choice: 义人
  alternative: 那义者
  rationale: 上下文为诗篇引文，单数可泛指义人；译作“义人”保留其一般性，不擅自将其专指基督或某一特定人物。
translation_notes:
  register: 采用庄重而易懂的现代书面汉语，保留诗篇式的“嘴唇”“舌头”等身体意象和祈愿语气。引号层级清楚；不另加脚注，因为译文可直接承载原文意义，且正文中无需脚注标记。
