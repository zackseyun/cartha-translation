base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/002.yaml
  text: 'For thus it is written:

    “When the Most High divided the nations,

    when he scattered the sons of Adam,

    he fixed the boundaries of the nations

    according to the number of the angels of God.

    And his people Jacob became the Lord’s portion,

    Israel the measuring-line of his inheritance.”'
translation:
  language: zh_hans
  text: '因为经上这样记着：


    “至高者划分列国时，

    当他使亚当的子孙分散时，

    他照着上帝的众天使的数目，

    划定了列国的疆界。


    而他的子民雅各成了主的份，

    以色列成了他产业的准绳。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεμέριζεν
  choice: 分配
  rationale: 表达至高者将列国划分、分派的动作，同时与后文“划定疆界”相衔接。
- source_word: διέσπειρεν
  choice: 使……分散
  rationale: 保留使役意味及人群散布各处的图景。
- source_word: υἱοὺς Ἀδάμ
  choice: 亚当的子孙
  rationale: 现代汉语中比直译“亚当的众子”自然，也能表达全人类后裔之意。
- source_word: ἀγγέλων θεοῦ
  choice: 上帝众天使
  rationale: 忠实依据本段希腊文本的“上帝的天使”，不以其他申命记文本传统中的异文替代。
- source_word: μερὶς κυρίου
  choice: 主的份
  rationale: 保留“所得之份、所分得部分”的产业性意象。
- source_word: σχοίνισμα κληρονομίας
  choice: 产业的准绳
  rationale: 保留 σχοίνισμα 原有的量地绳意象；“准绳”兼具绳索与划定所得份额的含义。
theological_decisions:
- issue: 申命记32:8所引文本的天上存在称谓
  choice: 上帝众天使
  alternative: 上帝的众子／以色列子孙
  rationale: 《革利免一书》现有希腊文本明确作 ἀγγέλων θεοῦ；译文按其实际引用的七十士译本形态处理，不混入其他文本传统。
- issue: 雅各与主之关系的产业隐喻
  choice: 成了主的份
  alternative: 归主所有
  rationale: 保留 μερίς 的分份隐喻及其与下一行“产业”之间的诗性呼应，避免把意象解释成单纯所有权。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，并按引文的诗行结构排版。保留“至高者”“主”“产业”“准绳”等经文体词语，但避免过度古雅。连接词“而”对应 καί，使最后两行与前文保持明确衔接。
