  text: Προσέλθωμεν οὖν αὐτῷ ἐν ὁσιότητι ψυχῆς, ἁγνὰς καὶ ἀμιάντους χεῖρας αἴροντες πρὸς αὐτόν, ἀγαπῶντες τὸν ἐπιεικῆ καὶ εὔσπλαγχνον πατέρα ἡμῶν, ὃς ἐκλογῆς μέρος ἡμᾶς ἐποίησεν ἑαυτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/001.yaml
  text: Therefore let us come near to him in holiness of soul, lifting pure and undefiled hands to him, loving our gentle and compassionate Father, who has made us a chosen portion for himself.
translation:
  language: zh_hans
  text: 所以，让我们以圣洁的心灵[a]亲近他，向他举起纯洁、毫无玷污的手，并爱我们温和而慈悲的父；他使我们成为归他自己、蒙拣选的一分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心灵”直译“魂”，这里指人的内在生命。
    reason: 说明 ψυχή 的字面意义及语境用法，避免读者误以为原文使用的是通常译作“心”的词。
lexical_decisions:
- source_word: ἐν ὁσιότητι ψυχῆς
  choice: 以圣洁的心
  rationale: ὁσιότης 指敬虔、圣洁的品格；ψυχή 在此指人的内在生命。译作“圣洁的心”符合现代汉语表达，同时保留内在圣洁之意。
- source_word: ἁγνὰς καὶ ἀμιάντους χεῖρας
  choice: 纯洁无玷污的手
  rationale: 两个形容词直接修饰“手”；“纯洁”表达 ἁγνός，“无玷污”表达 ἀμίαντος，并保留举手祷告所含的道德与礼仪意象。
- source_word: ἐπιεικῆ καὶ εὔσπλαγχνον
  choice: 温和慈悲
  rationale: ἐπιεικής 表示温良、宽厚，εὔσπλαγχνος 表示富有怜悯；“温和慈悲”自然简洁。
- source_word: ἐκλογῆς μέρος
  choice: 拣选的一份
  rationale: 直译这一不寻常的属格结构，保留其可能指“蒙拣选的群体中的一份”或“被选作归神之份”的语义张力。
theological_decisions:
- issue: ὃς ἐκλογῆς μέρος ἡμᾶς ἐποίησεν ἑαυτῷ 的含义
  choice: 使我们成为他为自己拣选的一份
  alternative: 使我们成为他所拣选的产业
  rationale: 原文说“拣选的一份”，并未明确使用“产业”一词；正文保留 μέρος 的“份”及 ἐκλογή 的“拣选”，避免把其含义限定为产业或选民群体。
- issue: ἀγαπῶντες 与前文劝勉的关系
  choice: 并爱我们的父
  alternative: 要爱我们温和慈悲的父
  rationale: 保留现在分词与“亲近”“举手”并列的劝勉功能，不把它改解为原因或结果。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“举起……的手”保留早期基督徒祷告姿态的具体意象；末句略显凝练，以保存希腊文“拣选的一份”本有的歧义。
