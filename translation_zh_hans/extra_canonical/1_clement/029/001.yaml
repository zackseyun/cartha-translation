    rationale: “归他自己、蒙拣选的一分”更清晰地保留“为他自己”和“拣选的一份”的原文结构，且不引入“产业”等额外解释。
  revised_text: 所以，让我们以圣洁的心灵[a]亲近他，向他举起纯洁、毫无玷污的手，并爱我们温和而慈悲的父；他使我们成为归他自己、蒙拣选的一分。
