revisions:
- from: 所以，让我们以圣洁的心[a]亲近他，向他举起纯洁无玷污的手，并爱我们的父；他温和慈悲，使我们成为他为自己拣选的一份。
  to: 所以，让我们以圣洁的心灵[a]亲近他，向他举起纯洁、毫无玷污的手，并爱我们温和而慈悲的父；他使我们成为归他自己、蒙拣选的一分。
  rationale: 修正父的定语与主句的句法关系，并使末句更清楚地对应希腊文“为他自己成为拣选的一分”，同时维持原文未明定其究竟指蒙选群体的一分还是归神之份的表达张力。
