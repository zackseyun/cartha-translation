base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/003.yaml
  text: 'And in another place he says:

    “Behold, the Lord takes for himself a nation from the midst of nations,

    as a man takes the firstfruits of his threshing floor;

    and from that nation the Holy of Holies shall come forth.”'
translation:
  language: zh_hans
  text: '他又在另一处说：


    “看哪，主从万族之中为自己取出一族，


    正如人从自己的禾场取初熟之物；


    那至圣之物[a]要从那一族中出来。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “至圣之物”：希腊文为固定的礼仪用语，直译近于“至圣之物中的至圣之物”；也可指“至圣所”。由于这里说它要“从那一族中出来”，有些理解将其视为指一位至圣者；正文保留原文未明定的指称。
    reason: 避免把中性复数的礼仪短语在正文中人格化，同时说明其固定用法及本句语境所引起的解释可能性。
lexical_decisions:
- source_word: ἔθνος ἐκ μέσου ἐθνῶν
  choice: 从万族之中……一族
  rationale: ἔθνος 在前后两处分别为单数和复数；译作“一族／万族”既保留对应关系，也比“一国／万国”更适合这里关于群体拣选的语境。
- source_word: λαμβάνει ἑαυτῷ
  choice: 为自己取出
  rationale: 保留 λαμβάνει 的“取、领受”意象及 ἑαυτῷ 的归属含义，不擅自改译为更具神学限定的“拣选”。
- source_word: ἀπαρχὴν αὐτοῦ τῆς ἅλω
  choice: 从自己的禾场取初熟之物
  rationale: ἀπαρχή 指首先取出、献上的初熟部分；“初熟之物”保留祭献色彩，ἅλως 则译为“禾场”。
- source_word: ἐξελεύσεται
  choice: 要……出来
  rationale: 按其基本动态意义翻译，并保留将来语气；不进一步解释为“出生”“兴起”或“显现”。
theological_decisions:
- issue: ἅγια ἁγίων 所指为何
  choice: 正文译作“至圣者”，并加注说明原文形式与其他可能理解
  alternative: “至圣之物”或“至圣所”
  rationale: 该短语是七十士译本传统中的礼仪用语，通常可指“至圣所”；但这里说其“从那一族中出来”，语境可能将它作为一位至圣者的称号。正文采用符合句意的称谓，同时以脚注保留希腊文中性复数形式所产生的真实歧义。
translation_notes:
  register: 采用庄重而自然的现代书面汉语，并按引文的诗行结构排版。“看哪”保留先知式引语语气；避免古奥词序和宗派化解释。
