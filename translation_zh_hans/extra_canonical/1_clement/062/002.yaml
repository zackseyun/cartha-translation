  to: 因为关于信心、悔改、真诚的爱、自制、明智和忍耐，我们已经逐一论及；我们提醒你们：应当在公义、真理和恒忍中，虔诚地蒙全能的上帝喜悦；要同心合意，不怀怨恨，在爱与和平中以恳切的温和行事。正如我们先前所提到的先辈，他们也蒙他喜悦，在关乎父、上帝和创造主，以及众人的事上存谦卑的心。
