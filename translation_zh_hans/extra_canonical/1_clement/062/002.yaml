id: 1CLEM.62.2
reference: 1 Clement 62:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Funk 1901 (normalized OCR)
  text: περὶ γὰρ πίστεως καὶ μετανοίας καὶ γνησίας ἀγάπης καὶ ἐγκρατείας καὶ σωφροσύνης καὶ ὑπομονῆς πάντα τόπον ἐψηλαφήσαμεν, ὑπομιμνήσκοντες δεῖν ὑμᾶς ἐν δικαιοσύνῃ καὶ ἀληθείᾳ καὶ μακροθυμίᾳ τῷ παντοκράτορι θεῷ ὁσίως εὐαρεστεῖν, ὁμονοοῦντας ἀμνησικάκως ἐν ἀγάπῃ καὶ εἰρήνῃ μετὰ ἐκτενοῦς ἐπιεικείας, καθὼς καὶ οἱ προδεδηλωμένοι πατέρες ἡμῶν εὐηρέστησαν ταπεινοφρονοῦντες τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/002.yaml
  text: For concerning faith and repentance and genuine love and self-control and sound-mindedness and endurance[a], we have touched on every point, reminding you that you ought to please Almighty God devoutly in righteousness and truth and longsuffering, being of one mind, free from resentment, in love and peace with earnest gentleness, just as also our fathers, who were spoken of before, were well-pleasing to him, humbling themselves before the Father and God and Creator and all people.
translation:
  language: zh_hans
  text: 因为关于信心、悔改、真诚的爱、自制、明智和忍耐，我们已经逐一论及；我们提醒你们：应当在公义、真理和恒忍中，虔诚地蒙全能的上帝喜悦；要同心合意，不怀怨恨，在爱与和平中以恳切的温和行事。正如我们先前所提到的先辈，他们也蒙他喜悦，在关乎父、上帝和创造主，以及众人的事上存谦卑的心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνησίας ἀγάπης
  choice: 真诚的爱
  rationale: γνήσιος 表示真实、纯正而非虚假的；“真诚的爱”自然清楚，并保留其伦理意味。
- source_word: ἐγκρατείας
  choice: 自制
  rationale: 指对欲望和行为的节制、自我约束；现代汉语“自制”简洁准确。
- source_word: σωφροσύνης
  choice: 明智
  rationale: 该词兼有心智健全、审慎和自守之意；此处以“明智”避免与前面的“自制”重复，同时保留理性审慎的重点。
- source_word: ὑπομονῆς
  choice: 忍耐
  rationale: 指在困境中坚持、承受；“忍耐”符合本段德目清单的语境。
- source_word: πάντα τόπον ἐψηλαφήσαμεν
  choice: 我们已经逐一论及
  rationale: 字面有“触及每一处”之意，是表示全面涉及各项论题的修辞说法；汉语译为“逐一论及”更自然。
- source_word: μακροθυμίᾳ
  choice: 恒忍
  rationale: 强调长久忍耐、迟于发怒；用“恒忍”与 ὑπομονή 的一般“忍耐”略作区分。
- source_word: ἀμνησικάκως
  choice: 不怀怨恨
  rationale: 意为不记恶、不存报复之心；“不怀怨恨”是自然且贴近原意的表达。
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: 恳切的温和
  rationale: ἐκτενής 表示热切、全心或持续，ἐπιείκεια 表示温和、宽厚；此译保留两者的组合，虽在汉语中略具张力。
- source_word: ταπεινοφρονοῦντες
  choice: 谦卑自己
  rationale: 表示持谦卑的心态或行事谦卑；“谦卑自己”适合其与关系对象连用的句法。
theological_decisions:
- issue: ὁσίως 与后续介词短语的关系
  choice: 在公义、真理和恒忍中虔诚地蒙全能的上帝喜悦
  alternative: 在圣洁、公义、真理和恒忍中蒙全能的上帝喜悦
  rationale: ὁσίως 是副词，修饰 εὐαρεστεῖν，故译为“虔诚地”；而 ἐν δικαιοσύνῃ... 是并列的处境或方式短语，不把 ὁσίως 并入德目清单。
- issue: εὐαρεστεῖν 的主客关系
  choice: 蒙全能的上帝喜悦
  alternative: 使全能的上帝喜悦
  rationale: 两种汉语都能表达“讨神喜悦”；选“蒙……喜悦”较庄重，也能与后文 εὐηρέστησαν 的“蒙他喜悦”形成呼应，不引入额外教义。
- issue: τὰ πρὸς τὸν πατέρα... καὶ πάντας ἀνθρώπους 的含义
  choice: 在父、上帝和创造主面前，也在众人面前谦卑自己
  alternative: 在关乎父、上帝、创造主和众人的事上存谦卑的心
  rationale: τὰ πρός 可表示“在与……的关系上/有关……的事”；正文采用关系性更自然的“在……面前”，同时不把“父、上帝和创造主”拆成不同对象。
- issue: 父、上帝和创造主的同位关系
  choice: 父、上帝和创造主
  alternative: 父上帝、创造主
  rationale: 保留原文三个带冠词称谓的累加结构，避免在译文中提前简化其修辞和同位关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留长句的劝勉推进结构，但用分号和句号划分层次；德目用常见词表达，避免宗派化术语。
