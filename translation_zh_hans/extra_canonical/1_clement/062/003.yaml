source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ταῦτα τοσούτῳ μᾶλλον ὑπενήγκαμεν, ἐπειδὴ σαφῶς ᾔδειμεν γράφειν ὑμᾶς ἀνδράσιν πιστοῖς καὶ ἐλλογιμωτάτοις καὶ ἐγκεχυφόσιν εἰς τὰ λόγια τῆς παιδείας τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/003.yaml
  text: And we have urged these things all the more[a], since we clearly knew that we were writing to faithful and highly esteemed men who have been deeply instructed in the sayings of God's instruction.
translation:
  language: zh_hans
  text: 我们格外提醒你们这些事[a]，因为我们清楚知道，我们是在写信给忠信、极受尊重、并且曾深入研读上帝训诲之言[b]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据文本此处的“带来／提出”是 OCR 误读；Funk 版应读作“提醒”，并与上一节的“提醒”相呼应。
    reason: 说明底本文字的 OCR 问题及据以翻译的校正读法。
  - marker: b
    text: “训诲”也可译作“教导”“训育”或“管教”。
    reason: 保留 παιδεία 所包含的教导、训练和管教等语义范围。
lexical_decisions:
- source_word: ὑπεμνήσαμεν（所给文本的 ὑπενήγκαμεν 为 OCR 误读）
  choice: 提醒你们
  rationale: 按 Funk 版的实际读法及与上一节 ὑπομιμνήσκοντες 的呼应，意为“使人想起、提醒”，而不是“催促”或“带来”。
- source_word: τοσούτῳ μᾶλλον
  choice: 更加
  rationale: 自然表达程度上的加强，同时保留与上下文之间的比较意味。
- source_word: πιστοῖς
  choice: 忠信
  rationale: 既可表达信实可靠，也不排除“有信仰”的含义，保留原词在此处的语义张力。
- source_word: ἐλλογιμωτάτοις
  choice: 极受尊重
  rationale: 最高级形式表示这些收信人声望卓著、备受敬重；采用现代中文中自然且庄重的说法。
- source_word: ἐγκεχυφόσιν（参照校正读法理解为 ἐγκεκυφόσιν）
  choice: 深入研读过
  rationale: 该词含俯身细察、专心探究之意；“深入研读”比单纯“受过教导”更贴近主动钻研的形象。
- source_word: τὰ λόγια τῆς παιδείας τοῦ θεοῦ
  choice: 上帝教诲之言
  rationale: λόγια 译为“言”以保留其庄重、权威的色彩；παιδεία 可涵盖教导、训练和管教，正文取较宽泛自然的“教诲”。
theological_decisions:
- issue: παιδεία 的含义范围
  choice: 教诲
  alternative: 管教／训育
  rationale: “教诲”在此能自然涵盖上帝的教导与塑造，不把原文限定为惩戒性的管教；脚注保留其他可能。
- issue: λόγια 是否专指圣经或神谕
  choice: 教诲之言
  alternative: 圣言／神谕
  rationale: 原文没有明确界定这些 λόγια 的文献范围，因此不直接增添“圣经”或更强的“神谕”概念。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“极受尊重”传达最高级称誉而不显古奥；“深入研读过”保留原文主动细察、深入探究的意味。所有脚注标记均已置入正文。
