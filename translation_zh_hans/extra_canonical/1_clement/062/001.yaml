source:
  edition: Funk 1901 (normalized OCR)
  text: Περὶ μὲν τῶν ἀνηκόντων τῇ θρησκείᾳ ἡμῶν καὶ τῶν ὠφελιμωτάτων εἰς ἐνάρετον βίον τοῖς θέλουσιν εὐσεβῶς καὶ δικαίως διευθύνειν, ἱκανῶς ἐπεστείλαμεν ὑμῖν, ἄνδρες ἀδελφοί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/001.yaml
  text: Concerning the matters that pertain to our religion, and that are most beneficial for a virtuous life to those who desire to order their way in piety and righteousness, we have written to you sufficiently, brothers.
translation:
  language: zh_hans
  text: 弟兄们，关于关乎我们信仰的事，以及那些对愿意敬虔而公义地引导自己生活的人、为过有德行的生活最有益的事，我们已经充分写信给你们了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἀνηκόντων τῇ θρησκείᾳ ἡμῶν
  choice: 那些属于我们信仰的事
  rationale: ἀνήκω表示“属于、关乎”；θρησκεία在此泛指共同的宗教信仰与实践，译为“信仰”比现代汉语中可能偏制度化的“宗教”更自然，同时不缩窄为单一礼仪含义。
- source_word: τῶν ὠφελιμωτάτων
  choice: 那些……最有助益的事
  rationale: 保留最高级含义，并使其与前一个并列属格结构对应。
- source_word: εἰς ἐνάρετον βίον
  choice: 对……生活……有助益
  rationale: 介词短语表明这些事有益于德性生活；在汉语中结合ὠφελιμωτάτων重组语序，以保持自然。
- source_word: τοῖς θέλουσιν
  choice: 对立志……的人
  rationale: θέλω既可指愿望，也可指意愿与决心；“立志”在此体现主动追求而不过度强化。
- source_word: εὐσεβῶς καὶ δικαίως
  choice: 以敬虔和正义
  rationale: 分别保留对神的敬虔与合乎正义的生活维度，不将二者合并。
- source_word: διευθύνειν
  choice: 端正生活
  rationale: 原词有引导、使正直、妥善安排之意；与βίον结合译作“端正生活”，简洁保留规范人生道路的意味。
- source_word: ἱκανῶς ἐπεστείλαμεν ὑμῖν
  choice: 我们已经充分写信告诉你们了
  rationale: ἐπιστέλλω指以书信传达，ἱκανῶς指充分、足够；译文明确书信行为而保持完成语气。
- source_word: ἄνδρες ἀδελφοί
  choice: 弟兄们
  rationale: 这是对群体的郑重称呼；现代汉语直接译为“弟兄们”自然且符合早期基督徒书信语域，无需机械呈现ἄνδρες。
theological_decisions:
- issue: θρησκεία的范围
  choice: 信仰
  alternative: 宗教；宗教礼仪
  rationale: 上下文谈及属于共同信仰并有益于德性生活的诸事，含义宽于礼仪；“信仰”既自然，也避免把该词限定为外在礼仪。
- issue: εὐσεβῶς καὶ δικαίως的关系
  choice: 敬虔和正义并列保留
  alternative: 虔诚正直地
  rationale: 并列译出可保存原文中两个副词各自的伦理与神学侧重，不将其融合成单一品格描述。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。将呼语“弟兄们”前置，符合现代汉语表达；不添加原文没有的篇章标记词。“那些……的事”略带正式色彩，用来清楚保留希腊文两组并列名词化结构。
