  text: Τίς οὖν ἐν ὑμῖν γενναῖος, τίς εὔσπλαγχνος, τίς πεπληροφορημένος ἀγάπης;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/001.yaml
  text: Who then among you is noble? Who is compassionate? Who is filled with love?
translation:
  language: zh_hans
  text: 那么，你们中间谁是高尚的？谁有怜悯之心？谁心中充满了爱？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναῖος
  choice: 高尚的
  rationale: 此处用于称许人的品格，译作“高尚的”自然庄重，也保留对勇毅、宽宏品性的概括意味。
- source_word: εὔσπλαγχνος
  choice: 有怜悯之心
  rationale: 该词本义涉及内心深处的慈悲，现代汉语用“有怜悯之心”清楚表达富有同情和慈悲的品格。
- source_word: πεπληροφορημένος ἀγάπης
  choice: 心中充满了爱
  rationale: 完成时被动分词与内容属格ἀγάπης搭配，意为被爱充满、满有爱；加入“心中”使汉语自然，但不改变内容关系。
theological_decisions:
- issue: πεπληροφορημένος ἀγάπης是“充满爱”还是“在爱中确信”
  choice: 心中充满了爱
  alternative: 在爱中满有确信
  rationale: 这里ἀγάπης是内容属格；该结构表达“充满爱”，而不是把爱视为确信所处的领域，故不采用后者。
translation_notes:
  register: 采用现代、庄重而易懂的设问句式；三个平行问句分别呈现原文的修辞节奏。“那么”承接οὖν，“你们中间”对应ἐν ὑμῖν。
