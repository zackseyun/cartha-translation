  to: 他应当这样说：“如果因我而有结党、争执和分裂，我就退出，离去，到你们愿意我去的地方，并照众人所吩咐的去做。只愿弥赛亚的羊群同受任命的长老[a]和睦相处。”
  rationale: 修订仅调整两个影响语义和语气的汉语表达：“退出”较准确对应ἐκχωρῶ，并与“离去”保留原文并列递进；“只愿”恢复εἰρηνευέτω所表达的愿望性祈使。其余关键词、群体权威范围及长老的已设立状态均保持原译的审慎处理。
