  text: εἰπάτω· Εἰ δι’ ἐμὲ στάσις καὶ ἔρις καὶ σχίσματα, ἐκχωρῶ, ἄπειμι, οὗ ἐὰν βούλησθε, καὶ ποιῶ τὰ προστασσόμενα ὑπὸ τοῦ πλήθους· μόνον τὸ ποίμνιον τοῦ Χριστοῦ εἰρηνευέτω μετὰ τῶν καθεσταμένων πρεσβυτέρων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/002.yaml
  text: Let him say[a], ‘If because of me there is faction and strife and divisions, I withdraw, I depart wherever you wish, and I will do what is commanded by the multitude. Only let the flock of Messiah live in peace with the appointed elders.’
translation:
  language: zh_hans
  text: 他应当这样说：“如果因我而有结党、争执和分裂，我就退出，离去，到你们愿意我去的地方，并照众人所吩咐的去做。只愿弥赛亚的羊群同受任命的长老[a]和睦相处。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受任命的长老”也可译作“已经设立的长老”。
    reason: καθεσταμένων是完成时被动分词，可侧重任命这一行动，也可侧重这些长老已经被设立的状态。
lexical_decisions:
- source_word: στάσις καὶ ἔρις καὶ σχίσματα
  choice: 结党、争执和分裂
  rationale: 分别保留群体中的派系对立、争吵和实际分裂这三个相关而不完全相同的概念。
- source_word: ἐκχωρῶ, ἄπειμι
  choice: 我就退让，离开
  rationale: 保留两个并列动词的递进意味：先退出争端或让出位置，继而离去。
- source_word: οὗ ἐὰν βούλησθε
  choice: 到你们愿意我去的地方
  rationale: 原文直译近于“无论你们愿意（我去）哪里”；补出汉语所需的宾语关系而不限定具体地点。
- source_word: τὸ πλῆθος
  choice: 众人
  rationale: 指共同体中的多数人或全体会众；“众人”保留范围上的一定开放性，避免过度制度化为特定组织。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός本义为“受膏者”，此处采用“弥赛亚”，既作为称号，又与项目既定用语保持一致。
- source_word: εἰρηνευέτω
  choice: 和睦相处
  rationale: 表达“处于和平中、保持和睦”的持续状态，比生硬的“和平吧”更符合现代汉语。
- source_word: καθεσταμένων πρεσβυτέρων
  choice: 受任命的长老
  rationale: καθίστημι的完成时被动分词表示这些长老已经被设立或任命；简洁译出其既成身份。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 原词是带定冠词的称号；“弥赛亚”明确呈现“受膏者”身份，同时不改变其所指。
- issue: πρεσβύτεροι的职分含义
  choice: 长老
  alternative: 年长者
  rationale: 上下文中的“受任命”表明这里较可能指共同体中被设立的带领者；译作“长老”合乎语境，但不进一步规定其后世教制含义。
- issue: τὸ πλῆθος所指的权威范围
  choice: 众人
  alternative: 会众／多数人
  rationale: 原文可指群体大众或多数成员；采用较宽泛的“众人”，不武断确定其正式决策结构。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文三个冲突名词及“退让，离开”两个动作的并列结构；引语语气自愿而坚决，不增添教制或宗派性解释。
