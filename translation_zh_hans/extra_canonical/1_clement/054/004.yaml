  text: ταῦτα οἱ πολιτευόμενοι τὴν ἀμεταμέλητον πολιτείαν τοῦ θεοῦ ἐποίησαν καὶ ποιήσουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/004.yaml
  text: These things those who live in God's unrepented way of life have done and will do[a].
translation:
  language: zh_hans
  text: 这些事，凡按上帝那无可悔憾的生活之道行事的人，都已经做过，将来也会做。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生活之道”也可译作“公民生活”；原文的“行事”和“生活之道”为同根词。
    reason: 保留πολιτεύομαι与πολιτεία的政治／公民语义背景及其同根修辞。
lexical_decisions:
- source_word: πολιτευόμενοι … πολιτείαν
  choice: 按……生活之道行事
  rationale: 动词与名词为同根词，语境中指人的生活方式和行为表现；这样译比严格政治意义上的“履行公民生活”更符合现代汉语，同时由脚注保留其公民生活意象。
- source_word: ἀμεταμέλητον
  choice: 无可悔憾的
  rationale: 该词意为“不致令人后悔、无需悔恨”，并非指“尚未悔改”的罪；“无可悔憾”既避免反转原意，也保留其正面评价。
- source_word: ἐποίησαν καὶ ποιήσουσιν
  choice: 已经做过，将来也会做
  rationale: 分别保留不定过去时与将来时所表达的既往行动和未来行动。
theological_decisions:
- issue: τοῦ θεοῦ与πολιτείαν的属格关系
  choice: 上帝那……的生活之道
  alternative: 为上帝而过的……生活
  rationale: 原文最直接地将“生活之道”与上帝相连，但属格的具体语义没有明说；正文保留这种关系，不把它限定为来源、归属或目的。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡……的人，都……”清楚呈现泛指主语；避免使用容易被理解为“未曾悔改”的“未悔改”。
