source:
  edition: Funk 1901 (normalized OCR)
  text: τοῦτο ὁ ποιήσας ἑαυτῷ μέγα κλέος ἐν Χριστῷ περιποιήσεται, καὶ πᾶς τόπος δέξεται αὐτόν. τοῦ γὰρ κυρίου ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/003.yaml
  text: The one who does this will obtain for himself great renown in Messiah[a], and every place will receive him. For the earth is the Lord’s, and its fullness.
translation:
  language: zh_hans
  text: 这样做的人[a]，必在弥赛亚里为自己赢得盛名，各处都会接纳他。因为大地和其中所充满的一切，都属于主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“做了这事的人”。
    reason: 希腊语ποιήσας是不定过去时分词，形式上可突出行动已经完成；正文则按劝勉语境采用较自然的概括表达。
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: 这样做的人
  rationale: 以自然的现代汉语表达带冠词的实体化不定过去时分词；正文顺应当前语境译为“这样做的人”，并用脚注保留其完成体色彩。
- source_word: μέγα κλέος
  choice: 盛名
  rationale: κλέος侧重声望、名誉或美名；“盛名”比泛泛的“荣耀”更贴近其语义，也符合上下文所说此人将广受接纳。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留介词ἐν的联合/领域表达，不改写成“从弥赛亚得来”等较窄解释；Χριστός按其称号意义译为“弥赛亚”。
- source_word: περιποιήσεται
  choice: 为自己赢得
  rationale: 体现中间语态及ἑαυτῷ所表达的自身受益含义，同时保持中文自然。
- source_word: πᾶς τόπος δέξεται αὐτόν
  choice: 各处都会接纳他
  rationale: 保留原文以“地方”为主语的概括性拟人表达；“接纳”涵盖欢迎、容纳之意。
- source_word: ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς
  choice: 大地和其中所充满的一切
  rationale: 贴近诗篇引文的措辞，πλήρωμα在此指充满大地的一切，而非抽象的“丰盛”。
theological_decisions:
- issue: ἐν Χριστῷ的关系含义
  choice: 在弥赛亚里
  alternative: 因弥赛亚 / 从弥赛亚得着
  rationale: 原文未明确介词ἐν在此仅表示原因、来源或工具，因此采用较宽且能保留神学张力的直译。
- issue: κυρίου的所指
  choice: 主
  alternative: 上帝
  rationale: 原文只用“主”，且此处引自诗篇式表述；不在译文中进一步指明所指，以免加入原文没有明说的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“盛名”“接纳”清楚易懂；末句保留诗篇引文的凝练格调。脚注标记已在正文相应位置出现。
