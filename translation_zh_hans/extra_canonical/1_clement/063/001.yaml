  text: Θεμιτὸν οὖν ἐστὶν τοῖς τοιούτοις καὶ τοσούτοις ὑποδείγμασιν προσεληλυθότας ὑποθεῖναι τὸν τράχηλον καὶ τὸν τῆς ὑπακατὰ τὸν προκείμενον ἡμῖν ἐν ἀληθείᾳ σκοπὸν δίχα παντὸς μώμου καταντήσωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/001.yaml
  text: Therefore it is fitting that, having come near to such and so many examples, we should bow the neck and, fulfilling the place of obedience, we should be quiet, so that having ceased from the vain sedition, we may reach the goal set before us in truth, without any blemish.
translation:
  language: zh_hans
  text: 因此，我们既已面对如此众多的榜样，就应当俯下颈项，履行顺服的本分[a]，安静下来，好叫我们止息这徒然的纷争，毫无瑕疵地达到那确实摆在我们面前的目标[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“填补顺服的位置”或“处在顺服的位置上”。
    reason: τὸν τῆς ὑπακοῆς τόπον ἀναπληρώσαντας字面涉及“填补／履行顺服的位置”，可指承担并完成顺服所要求的角色或本分。
  - marker: b
    text: 或译：“达到那摆在我们面前的真实目标。”
    reason: ἐν ἀληθείᾳ的具体句法关联可理解为“确实地”达到，也可较宽泛地与“目标”相关；脚注保留此歧义。
lexical_decisions:
- source_word: ὑποθεῖναι τὸν τράχηλον
  choice: 低头顺服
  rationale: 原意为“把颈项置于下面”，是甘愿降服的惯用形象；译作“低头顺服”既保留意象，又符合现代汉语。
- source_word: τὸν τῆς ὑπακοῆς τόπον ἀναπληρώσαντας
  choice: 尽到顺服的本分
  rationale: 直译近于“补满／履行顺服的位置（角色）”；“尽到……本分”自然表达承担并履行这一角色，同时以脚注保留较字面的理解。
- source_word: ἡσυχάσαι
  choice: 安静下来
  rationale: 在信中制止冲突的语境里，指停止搅扰、归于平静；不扩译为单纯沉默。
- source_word: ματαίας στάσεως
  choice: 徒然的纷争
  rationale: στάσις可指结党、内乱或叛争；此处针对教会内部冲突，“纷争”较自然且不过度限定其政治色彩。
- source_word: ἐν ἀληθείᾳ σκοπόν
  choice: 那真实……的目标
  rationale: 保留ἐν ἀληθείᾳ与“目标”的关联，同时避免擅自将其解释为某项具体教义内容。
- source_word: δίχα παντὸς μώμου
  choice: 毫无瑕疵地
  rationale: δίχα表示“没有、远离”，μῶμος表示瑕疵或可责之处；此译兼具道德与行为层面的开放性。
theological_decisions:
- issue: “顺服”的对象未在本句明说
  choice: 不补出上帝、长老或教会领袖等具体对象
  alternative: 译成“顺服上帝／领袖”
  rationale: 希腊文本只说“顺服的角色／本分”，具体对象须由上下文理解；补明会消除原文保留的开放性。
- issue: “真实的目标”所指为何
  choice: 保留为“那真实摆在我们面前的目标”
  alternative: 解释为“救恩”“和平”或“成圣”
  rationale: 本句没有明确定义σκοπός，故不以某一神学解释替代原文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“低头顺服—尽到本分—安静下来—止息纷争—达到目标”保留原句的劝勉推进。依据校勘所恢复的完整希腊文本翻译“安静下来……止息这场徒然的纷争”一段；所给Funk规范化OCR在此处有明显脱漏，不能按残缺字串硬译。
