  text: ἐπέμψαμεν δὲ ἄνδρας πιστοὺς καὶ σώφρονας ἀπὸ νεότητος ἀναστραφέντας ἕως γήρους ἀμέμπτως ἐν ἡμῖν, οἵτινες καὶ μάρτυρες ἔσονται μεταξὺ ὑμῶν καὶ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/003.yaml
  text: And we have sent faithful and prudent men, who from youth until old age have conducted themselves blamelessly among us; these will also be witnesses between you and us.
translation:
  language: zh_hans
  text: 我们已经派遣了忠信而审慎的人；他们自青年到老年，在我们中间的行事为人一直无可指责；他们也将作你们和我们之间的见证人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστούς
  choice: 忠信
  rationale: 兼顾“可信赖”与“忠诚”的含义，符合受差遣者长期品行可靠的语境。
- source_word: σώφρονας
  choice: 明智
  rationale: 该词可指审慎、自制、头脑健全；此处描述受托之人的成熟判断力，译作“明智”自然且不缩窄为单一德目。
- source_word: ἀναστραφέντας
  choice: 行事
  rationale: 在此指生活为人和行为表现；“行事”简洁、庄重，并与“无可指责”自然搭配。
- source_word: ἀμέμπτως
  choice: 无可指责
  rationale: 准确表达其行为没有可受责难之处，并不暗示绝对无罪或完美。
- source_word: μάρτυρες
  choice: 见证人
  rationale: 保留其作为双方之间事实见证者或担保性见证者的含义，不预先限定为法律意义上的证人。
- source_word: μεταξὺ ὑμῶν καὶ ἡμῶν
  choice: 在你们和我们之间
  rationale: 依照原文保留关系性与可能的调解、作证语境，不额外解释其具体职能。
theological_decisions:
- issue: ἀμέμπτως是否暗示道德完美
  choice: 译为“无可指责”
  alternative: “毫无过错”
  rationale: 原文强调可观察的生活品行不受责难，不宜强化为本体或绝对意义上的无罪。
- issue: μάρτυρες的具体角色
  choice: 保留为“见证人”
  alternative: “中间人”或“担保人”
  rationale: 原文确为“见证人”，其在双方之间的具体功能存在一定开放性，应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“从青年直到老年”紧贴年龄跨度；“一向行事”表达自青年至老年的持续表现。
