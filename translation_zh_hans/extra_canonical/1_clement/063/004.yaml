  text: τοῦτο δὲ ἐποιήσαμεν, ἵνα εἰδῆτε, ὅτι πᾶσα ἡμῶν φροντὶς καὶ γέγονεν καὶ ἔστιν εἰς τὸ ἐν τάχει ὑμᾶς εἰρηνεῦσαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/004.yaml
  text: And we have done this so that you may know that all our concern has been[a], and is, toward your being quickly at peace.
translation:
  language: zh_hans
  text: 我们这样做，是要让你们知道：我们所关切的一切，过去如此，现在也是，为的是你们能尽快和睦相处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尽快处于和平状态。”
    reason: εἰρηνεῦσαι 可指处于和平状态，也可在本书信的群体语境中指和睦相处；脚注保留这一语义幅度，且不暗示“恢复”和睦。
lexical_decisions:
- source_word: τοῦτο δὲ ἐποιήσαμεν
  choice: 我们这样做
  rationale: 自然表达指向前文的 τοῦτο，并保留不定过去时所述已经采取的行动。δέ 在此是轻微承接，中文无需机械译出“但”。
- source_word: πᾶσα ἡμῶν φροντίς
  choice: 我们全部的关切
  rationale: φροντίς 指所挂念、所关切之事；“全部的关切”保留 πᾶσα 的范围强调，同时符合庄重的现代汉语。
- source_word: καὶ γέγονεν καὶ ἔστιν
  choice: 过去和现在都是
  rationale: γέγονεν（完成时）与 ἔστιν（现在时）共同强调这种关切一向如此并持续至今；此译法简洁呈现时间延续。
- source_word: ἐν τάχει
  choice: 尽快
  rationale: 表达迅速、短期内实现之意，现代汉语自然清楚。
- source_word: εἰρηνεῦσαι
  choice: 和睦相处
  rationale: 主动不定式可指处于和平状态或和平共处；结合致哥林多人书信中群体纷争的语境，“和睦相处”既保留主动意味，也避免误译为被动的“恢复和平”。
theological_decisions:
- issue: εἰρηνεῦσαι 所表达的和平状态是否含有被动恢复之意
  choice: 和睦相处
  alternative: 恢复和睦／归于和平
  rationale: 希腊文是主动不定式，直接表达“处于和平、和平相处”；不把恢复状态或外力使其复和的含义写入正文。脚注保留较宽的语义可能。
- issue: εἰς τὸ 加不定式所表达的指向或目的
  choice: 要使你们
  alternative: 都在于你们
  rationale: 该结构可表示目标或指向；中文用“要使”自然传达全部关切所趋向的结果，但不额外说明和平由作者实现。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“过去和现在都是”保留希腊文完成时与现在时的并列强调；正文避免被动式“恢复和睦”，以符合 εἰρηνεῦσαι 的主动形式。脚注标记已置于正文对应句末。
