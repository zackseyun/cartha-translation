revisions:
- from: 因为，如果你们顺服我们藉着圣灵所写的这些话，除掉你们因嫉妒而生的不法怒气，照着我们在这封信中为和平与和睦所作的劝求去行，就会使我们欢喜雀跃。
  to: 因为，若你们顺服我们藉着圣灵所写的话，依照我们在这封信中就和平与和睦所作的恳劝，除去你们嫉妒所引起的不法怒气，就会使我们喜乐欢腾。
  rationale: 调整κατὰ τὴν ἔντευξιν的句法归属，使其直接限定“除去”，并将不自然的“劝求”改为“恳劝”。其余措辞保留草稿对原文条件结构、圣灵媒介、嫉妒与怒气的关联，以及双重喜乐表达的忠实处理。
