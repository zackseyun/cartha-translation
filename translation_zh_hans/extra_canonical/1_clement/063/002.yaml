  text: χαρὰν γὰρ καὶ ἀγαλλίασιν ἡμῖν παρέξετε, ἐὰν ὑπήκοοι γενήμενοι τοῖς ὑφʼ ἡμῶν γεγραμμένοις διὰ τοῦ ἁγίου πνεύματος ἐκκόψητε τὴν ἄθεμον τῆς ζήλους ὑμῶν ὀργὴν κατὰ τὴν ἔντευξιν, ἣν ἐποιησάμεθα περὶ εἰρήνης καὶ ὁμονοίας ἐν τῇδε τῇ ἐπιστολῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/002.yaml
  text: For you will give us joy and exultation if, becoming obedient to the things written by us through the Holy Spirit, you cut off the lawless anger of your jealousy, in accordance with the appeal that we made in this letter concerning peace and concord.
translation:
  language: zh_hans
  text: 因为，若你们顺服我们藉着圣灵所写的话，依照我们在这封信中就和平与和睦所作的恳劝，除去你们嫉妒所引起的不法怒气，就会使我们喜乐欢腾。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαρὰν καὶ ἀγαλλίασιν
  choice: 欢喜雀跃
  rationale: 保留两个近义词叠加所表达的强烈喜乐，同时采用自然的现代汉语表达。
- source_word: ὑπήκοοι γενήμενοι
  choice: 顺服
  rationale: 表达进入并持守听从所写劝诫的状态；汉语无需直译为“成为顺服的”。
- source_word: ἐκκόψητε
  choice: 除掉
  rationale: 原义带有砍除、彻底去除的力度；“除掉”自然且保留坚决意味。
- source_word: τὴν ἄθεμον ... ὀργὴν
  choice: 不法怒气
  rationale: ἄθεμος 指违背正道或法度；“不法”比“无法无天”更适合庄重书信语体。
- source_word: τῆς ζήλους ὑμῶν
  choice: 你们因嫉妒而生的
  rationale: 按语境将属格理解为怒气的来源或关联，使汉语清楚，同时保留 ζῆλος 在此处的负面含义。
- source_word: ἔντευξιν
  choice: 劝求
  rationale: 此处指为和平与和睦提出的恳切呼吁；“劝求”兼有劝告与请求之意。
- source_word: εἰρήνης καὶ ὁμονοίας
  choice: 和平与和睦
  rationale: 分别传达安宁和平与同心和谐，保留原文并列结构。
theological_decisions:
- issue: διὰ τοῦ ἁγίου πνεύματος 的施事与启示力度
  choice: 我们藉着圣灵所写的
  alternative: 圣灵藉着我们所写的
  rationale: 依照原文语序和介词结构直译为“我们藉着圣灵所写”，不将作者与圣灵的关系进一步系统化，也不削弱其明确的圣灵媒介表述。
- issue: 顺服的对象
  choice: 顺服我们藉着圣灵所写的这些话
  alternative: 顺服我们
  rationale: τοῖς ... γεγραμμένοις 明确以“所写的事/话”为顺服对象，避免把顺服扩大为对写信者个人或职位的笼统服从。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。调整汉语语序，把条件句置前、结果句置后，以避免冗长倒装；保留“圣灵”“不法怒气”“和平与和睦”等原文的伦理及神学张力。
