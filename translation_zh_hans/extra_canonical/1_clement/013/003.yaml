base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/003.yaml
  text: 'By this command and these injunctions let us strengthen ourselves to walk as those who are obedient to his holy words[a], being humble-minded. For the holy word says:'
translation:
  language: zh_hans
  text: 让我们借着这条命令和这些训示坚固自己，以便谦卑地顺从他那些合乎圣洁的话语而行[a]。因为圣言说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“顺从他的圣洁话语而行。”
    reason: “合乎圣洁”较精确地反映ἁγιοπρεπής的复合含义；“圣洁话语”则是更自然、概括性的译法。
lexical_decisions:
- source_word: ἐντολῇ
  choice: 命令
  rationale: 保留该词表示权威性命令、诫命的基本含义；此处未明确指摩西律法中的某一条诫命。
- source_word: παραγγέλμασι
  choice: 训示
  rationale: 表达带有权威的指示或嘱咐，并与前面的“命令”有所区分。
- source_word: στηρίξωμεν ἑαυτούς
  choice: 让我们……坚固自己
  rationale: 贴近劝勉式虚拟语气及反身结构，同时保持现代汉语的庄重感。
- source_word: πορεύεσθαι
  choice: 而行
  rationale: 在伦理劝勉语境中指生活行事，不仅是身体上的行走。
- source_word: ὑπηκόους ὄντας
  choice: 顺从……而行
  rationale: 自然表达“作为顺从者去行”的持续生活姿态。
- source_word: ἁγιοπρεπέσι λόγοις
  choice: 与圣洁相称的话
  rationale: ἁγιοπρεπής是复合形容词，意为符合圣洁、具有圣洁品格；避免拆成两个彼此独立的属性。
- source_word: ταπεινοφρονοῦντες
  choice: 存着谦卑的心
  rationale: 表达内在谦卑的心志，并与主要劝勉动作相连。
- source_word: ὁ ἅγιος λόγος
  choice: 圣言
  rationale: 此处引出权威性的经文引语；“圣言”简洁、庄重，也保留λόγος可指话语或经文的范围。
theological_decisions:
- issue: αὐτοῦ所指对象
  choice: 保留为“他”
  alternative: 明确译作“基督”或“上帝”
  rationale: 本节自身没有明确说出先行词，不应在译文中替作者消除指代上的语境依赖。
- issue: ἁγιοπρεπέσι λόγοις的性质
  choice: 与圣洁相称的话
  alternative: 圣洁的话
  rationale: 主要译法保留复合词“符合圣洁”的精确语义；更简洁的“圣洁的话”虽自然，却可能弱化“相称、合宜”的成分。
- issue: ὁ ἅγιος λόγος的身份
  choice: 圣言
  alternative: 圣经
  rationale: 作者确实即将引用权威话语，但希腊文没有直接使用γραφή；因此不把它明确化为后世术语“圣经”。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“让我们……坚固自己”保留原文共同劝勉的语气；调整分句次序，使“存着谦卑的心”与“顺从……而行”在汉语中关系清楚。脚注标记已置于相关短语之后。
