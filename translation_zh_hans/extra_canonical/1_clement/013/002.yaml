base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/002.yaml
  text: 'For thus he said: “Show mercy, so that you may receive mercy. Forgive, so that you may be forgiven. As you do, so it will be done to you. As you give, so it will be given to you. As you judge, so you will be judged. As you show kindness, so kindness will be shown to you. With the measure by which you measure, it will be measured to you.”'
translation:
  language: zh_hans
  text: 因为他这样说：“你们要施怜悯，使你们蒙怜悯；要饶恕，使你们得饶恕。你们怎样行，也必怎样向你们行；你们怎样给，也必怎样给你们；你们怎样判断，也必怎样受判断；你们怎样以恩慈待人，也必怎样得到善待；你们用什么量器量，也必用同样的量器量给你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεεῖτε / ἐλεηθῆτε
  choice: 怜悯人 / 蒙怜悯
  rationale: 保留主动命令与被动结果之间的对应，也使用现代汉语中自然且庄重的宗教伦理用语。
- source_word: ἀφίετε / ἀφεθῇ ὑμῖν
  choice: 饶恕人 / 得饶恕
  rationale: ἀφίημι在此语境指免除人的过犯；中文以“饶恕”准确表达，并保留后半句的被动意义。
- source_word: ὡς ποιεῖτε, οὕτω ποιηθήσεται ὑμῖν
  choice: 你们怎样待人，人也必怎样待你们
  rationale: 希腊文直译为“你们怎样做，也必照样向你们做”；补出语境隐含的“待人”，使中文自然，同时保留施行者未明确指明这一基本张力。
- source_word: χρηστεύεσθε / χρηστευθήσεται
  choice: 善待人 / 受善待
  rationale: 该动词表示以仁慈、良善待人；“善待”比生硬的“施行仁慈”更符合现代汉语，并保存主动与被动的对应。
- source_word: μέτρῳ μετρεῖτε
  choice: 用什么尺度衡量人
  rationale: 保留“尺度—衡量”的词根呼应；补出“人”以明确中文关系，而不限定具体所衡量的是行为、罪责还是价值。
theological_decisions:
- issue: 各被动式施行者是否明确为上帝
  choice: 保留被动表达，不明说上帝
  alternative: 译作“上帝也必怜悯／饶恕／判断你们”
  rationale: 原文连续使用神学语境中可能暗指上帝的被动式，但没有明说施行者；译文不应替原文消除这一含蓄性。
- issue: ποιηθήσεται ὑμῖν的施行主体
  choice: 采用泛指的“人也必怎样待你们”
  alternative: “上帝也必怎样待你们”或较生硬的“也必照样向你们行”
  rationale: 现代汉语需要较清楚的句法承载者；泛指“人”表达回报关系而不把原文未明说的主体专门认定为上帝。
- issue: 平行句是伦理后果还是得救条件
  choice: 按原文呈现因果／对应关系，不作教义解释
  alternative: 增译为得救条件或仅为一般社会规律
  rationale: 原文保留强烈的伦理与审判张力，译文不将其系统化为某一宗派立场。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以重复的“你们怎样……也必怎样……”再现希腊文排比和修辞力度。全节无须脚注标记。
