revisions:
- from: 因为他这样说过：“你们要怜悯人，好使你们蒙怜悯；要饶恕人，好使你们得饶恕。你们怎样待人，人也必怎样待你们；你们怎样给予，也必怎样给你们；你们怎样判断人，也必怎样受判断；你们怎样善待人，也必怎样受善待；你们用什么尺度衡量人，也必用同样的尺度衡量你们。”
  to: 因为他这样说：“你们要施怜悯，使你们蒙怜悯；要饶恕，使你们得饶恕。你们怎样行，也必怎样向你们行；你们怎样给，也必怎样给你们；你们怎样判断，也必怎样受判断；你们怎样以恩慈待人，也必怎样得到善待；你们用什么量器量，也必用同样的量器量给你们。”
  rationale: 修订删除原文没有的“人也”及末句的“人”，以不定指的“向你们行”“给你们”“得到善待”保留连续被动式可能具有的神学暗示与未明说施行者。保留“以恩慈待人”仅作为χρηστεύεσθε在汉语中所需的自然搭配，不指定回报的施行者。将末句改为“量器—量”，保留希腊文μέτρῳ／μετρεῖτε的词汇回环和可涵盖广义量度的意象。
