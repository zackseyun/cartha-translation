source:
  edition: Funk 1901 (normalized OCR)
  text: Ταπεινοφρονήσωμεν οὖν, ἀδελφοί, ἀποθέμενοι πᾶσαν ἀλαζονείαν καὶ τύφος καὶ ἀφροσύνην καὶ ὀργάς, καὶ ποιήσωμεν τὸ γεγραμμένον (λέγει γὰρ τὸ πνεῦμα τὸ ἅγιον· Μὴ καυχάσθω ὁ σοφὸς ἐν τῇ σοφίᾳ αὐτοῦ μηδὲ ὁ ἰσχυρὸς ἐν τῇ ἰσχύϊ αὐτοῦ μηδὲ ὁ πλούσιος ἐν τῷ πλούτῳ αὐτοῦ, ἀλλ’ ἢ ὁ καυχώμενος ἐν κυρίῳ καυχάσθω, τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην), μάλιστα μεμνημένοι τῶν λόγων τοῦ κυρίου Ἰησοῦ, οὓς ἐλάλησεν διδάσκων ἐπιείκειαν καὶ μακροθυμίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/001.yaml
  text: 'Let us therefore be humble, brothers, laying aside all arrogance and conceit and foolishness and fits of anger, and let us do what is written—for the Holy Spirit says: “Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord, to seek him and to do judgment and righteousness”—especially remembering the words of the Lord Jesus, which he spoke while teaching gentleness and patience.'
translation:
  language: zh_hans
  text: 所以，弟兄们，我们应当谦卑，除去一切狂妄、自负、愚昧和怒气，并遵行经上所写的；因为圣灵说：“智慧人不可凭自己的智慧夸口，强壮的人不可凭自己的力量夸口，富足的人也不可凭自己的财富夸口；夸口的，却要凭主夸口，寻求他，秉行公正和正义。”尤其要记得主耶稣的话，就是他教导温和与忍耐时所说的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταπεινοφρονήσωμεν
  choice: 我们应当谦卑
  rationale: 以劝勉式表达第一人称复数虚拟语气，保留共同受劝的语气；“谦卑”自然涵盖谦逊心态。
- source_word: ἀλαζονείαν καὶ τύφος
  choice: 狂妄、自负
  rationale: 分别表达夸大自恃与高傲自满，尽量保留两个近义词的并列，而不合并为单一概念。
- source_word: ὀργάς
  choice: 怒气
  rationale: 复数形式可指种种发怒表现；现代汉语以集合性的“怒气”表达最自然。
- source_word: ποιήσωμεν τὸ γεγραμμένον
  choice: 遵行经上所写的
  rationale: ποιεῖν 在此不是单指完成动作，而是把所写的教导付诸实行；“经上”明确其引文性质。
- source_word: καυχάομαι ἐν
  choice: 凭……夸口
  rationale: 表达夸口所倚仗或所归向的对象；用于“凭主夸口”也保留原文反常而富神学张力的措辞。
- source_word: ποιεῖν κρίμα καὶ δικαιοσύνην
  choice: 秉行公正和正义
  rationale: 保留 κρίμα 与 δικαιοσύνη 的双重表达，并以“秉行”体现实践公义，而非仅作判断。
- source_word: ἐπιείκειαν καὶ μακροθυμίαν
  choice: 温和与忍耐
  rationale: ἐπιείκεια 在此为温良宽厚，μακροθυμία 为面对挑衅或困境时长久忍耐；此译简明且符合现代庄重语体。
theological_decisions:
- issue: τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην 的引文归属
  choice: 将“寻求他，秉行公正和正义”保留在圣灵所说的引文之内
  alternative: 在“凭主夸口”后结束引文，把后半句视为革利免的说明
  rationale: 希腊文整体由“圣灵说”引出，且该短语属于革利免对经文引语的组合或改写；原文没有支持在其前结束直接引语的明确标志。
- issue: “凭主夸口”的对象
  choice: 保留“主”，不进一步指明为父神或耶稣
  alternative: 译作“以神为夸耀”或“以主耶稣为夸耀”
  rationale: κυρίῳ 本身没有进一步限定；保留“主”可避免替原文消解所指的开放性。
translation_notes:
  register: 采用现代标准普通话的庄重劝勉语体，句式清楚而不过度口语化。经文引语使用排比，保留原文反复出现的“夸口”；末句维持长句的逻辑层次，并将引文范围按希腊文证据处理。
