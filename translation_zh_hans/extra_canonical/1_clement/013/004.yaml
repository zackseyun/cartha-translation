  yaml_path: translation/extra_canonical/1_clement/013/004.yaml
  text: “Upon whom shall I look[a], except upon the one who is gentle and quiet and trembles at my words?”
translation:
  language: zh_hans
  text: “除了那温柔、安静、因我的话而战兢的人，我还会垂顾谁呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιβλέψω
  choice: 垂顾
  rationale: 表达带着关注与眷顾的“看顾”，也保留庄重的经文语体。
- source_word: πρᾶον
  choice: 温柔
  rationale: 准确传达温和、不强暴的品格，且为现代汉语读者熟悉。
- source_word: ἡσύχιον
  choice: 安静
  rationale: 保留原词沉静、安宁的基本意义，不扩展为顺服等解释。
- source_word: τρέμοντά μου τὰ λόγια
  choice: 因我的话而战兢
  rationale: 自然表达对所说之话心存敬畏而战兢；“我的话”保留复数 λόγια 的集合性意义。
theological_decisions:
- issue: 三个描述语所指的人数
  choice: 将“温柔、安静、因我的话而战兢”都用于同一个人
  alternative: 理解为“温柔安静的人”和“因我的话战兢的人”两类人
  rationale: 单一冠词 τὸν 统摄三个并列描述语，语法上最自然地指向同一人。
- issue: ἀλλ’ ἢ 的问句力度
  choice: 译作“岂不是……吗”
  alternative: 直译作“除了……以外，我还会垂顾谁呢”
  rationale: 中文反问形式自然呈现排他性的修辞效果，而不额外强化神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以“垂顾”保持引文的肃穆感，用单一中心名词“人”明确三个并列品格同属一人。
