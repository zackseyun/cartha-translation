source:
  edition: Funk 1901 (normalized OCR)
  text: Σὺ γὰρ τὴν ἀέναον τοῦ κόσμου σύστασιν διὰ τῶν ἐνεργουμένων ἐφανεροποίησας· σύ, κύριε, τὴν οἰκουμένην ἔκτισας, ὁ πιστὸς ἐν πάσαις ταῖς γενεαῖς, δίκαιος ἐν τοῖς κρίμασιν, θαυμαστὸς ἐν ἰσχύϊ καὶ μεγαλοπρεπείᾳ, ὁ σοφὸς ἐν τῷ κτίζειν καὶ συνετὸς ἐν τῷ τὰ γενόμενα ἑδράσαι, ὁ ἀγαθὸς ἐν τοῖς ὁρωμένοις καὶ πιστὸς ἐν τοῖς πεποιθόσιν ἐπὶ σέ, ἐλεῆμον καὶ οἰκτίρμον, ἄφες ἡμῖν τὰς ἀνομίας ἡμῶν καὶ τὰς ἀδικίας καὶ τὰ παραπτώματα καὶ πλημμελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/001.yaml
  text: For you have made manifest the everlasting order of the world through your workings. You, Lord, created the inhabited earth, faithful throughout all generations, righteous in your judgments, marvelous in might and majesty, wise in creating and understanding in establishing the things that have come to be, good in the things that are seen and faithful toward those who have put their trust in you. O merciful and compassionate one, forgive us our lawless deeds and our unrighteous acts and our trespasses and failings.
translation:
  language: zh_hans
  text: 因为你借着所成就的事，显明了世界永恒的秩序。主啊，你创造了有人居住的世界；你在万代之中信实，在审判中公义，在能力和威严上奇妙；你创造时有智慧，使已经形成之物得以稳固时有聪明；你在可见之物中显出良善，也信实地对待那些信靠你的人。满有怜悯和慈悲的主啊，求你赦免我们的不法、不义、过犯和罪愆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀέναον ... σύστασιν
  choice: 永恒的秩序
  rationale: σύστασις在此指世界持续存在的构成、秩序或体系；结合ἀέναον，译作“永恒的秩序”既自然，也保留宇宙秩序恒常延续之意。
- source_word: διὰ τῶν ἐνεργουμένων
  choice: 借着自己的作为
  rationale: 该中性复数分词指正在成就或运行的事；结合对上帝的称述，用“自己的作为”表达其施行和运作，同时避免过度具体化。
- source_word: οἰκουμένην
  choice: 人所居住的大地
  rationale: 本词本义为有人居住的世界或大地；此处译出“居住”的词义成分，并与后文创造万物的表述协调。
- source_word: ἑδράσαι
  choice: 使所造的坚定
  rationale: 该词意为奠定、稳固或使坚定；“使……坚定”保留其建立并维系受造物的含义。
- source_word: πλημμελείας
  choice: 罪愆
  rationale: 本词可指过失、差错或失当行为；与ἀνομίας、ἀδικίας、παραπτώματα并列时，用“罪愆”保持祷告文体，并与“过犯”有所区分。
theological_decisions:
- issue: πιστὸς ἐν τοῖς πεποιθόσιν ἐπὶ σέ所表达的关系
  choice: 也信实地对待那些信靠你的人
  alternative: 在信靠你的人中显为信实
  rationale: 希腊文介词结构可表达上帝在信靠他的人身上或对他们显出信实；正文采用自然的关系性表达，但不扩展为特定的盟约神学术语。
- issue: ἐλεῆμον καὶ οἰκτίρμον与祈求ἄφες的句法关系
  choice: 满有怜悯和慈悲的主啊，求你赦免
  alternative: 信靠你这位怜悯、慈悲的主。求你赦免
  rationale: 按词形和语流，这两个形容词作为呼语引出“赦免”的祈求最为妥当；中文补出“主啊”使呼语自然，但不改变所指。
translation_notes:
  register: 采用现代、庄重而易懂的祷告文体。保留原文层层铺陈的赞颂结构，以分号组织长句；避免生硬逐词对应，也不加入宗派性术语。
