source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ λογίσῃ πᾶσαν ἁμαρτίαν δούλων σου καὶ παιδισκῶν, ἀλλὰ καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας, καὶ κατεύθυνον τὰ διαβήματα ἡμῶν ἐν ὁσιότητι καρδίας πορεύεσθαι καὶ ποιεῖν τὰ καλὰ καὶ εὐάρεστα ἐνώπιόν σου καὶ ἐνώπιον τῶν ἀρχόντων ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/002.yaml
  text: Do not count every sin of your servants and maidservants[a], but cleanse us with the cleansing of your truth, and direct our steps to walk in holiness of heart and to do the things that are good and pleasing before you and before our rulers.
translation:
  language: zh_hans
  text: 求你不要追究你仆人和婢女的任何罪过[a]，却要借着你真理的洁净，使我们得洁净；引导我们的脚步，使我们存着圣洁的心行事，并做在你和我们的执政者面前美好、蒙悦纳的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“不要计算你仆人和婢女的每一项罪”；这里的否定词与“每一”连用，按受七十士译本影响的用法，意为“不要计算任何罪”。
    reason: 说明 μὴ…πᾶσαν 的字面形式与语境意义，避免中文“不是每一项”被误解为仍要计算某些罪。
lexical_decisions:
- source_word: μὴ λογίσῃ πᾶσαν ἁμαρτίαν
  choice: 不要追究……任何罪过
  rationale: 在祈祷及七十士译本影响的语境中，μὴ 与 πᾶσαν 连用自然表达“不要算任何罪”；“追究”传达 λογίζομαι 在此将罪记账、归算的含义，同时避免译成容易误解为只是不追究全部罪的“不要追究每一项罪”。
- source_word: δούλων σου καὶ παιδισκῶν
  choice: 你众仆人和婢女
  rationale: 保留阳性与阴性仆役的并列表达及礼仪语体；“仆人和婢女”比机械的“男奴隶和女奴隶”更符合本段向上帝祈祷的现代中文。
- source_word: καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας
  choice: 用你真理的洁净洁净我们
  rationale: 保留原文 καθάρισον/καθαρισμόν 的同根复沓及“你真理的洁净”这一较浓缩、可能兼具方式与性质含义的表达。
- source_word: κατεύθυνον τὰ διαβήματα ἡμῶν
  choice: 引导我们的脚步
  rationale: 以自然中文保留“使脚步走正、指引步履”的圣经式意象。
- source_word: ἐν ὁσιότητι καρδίας
  choice: 存着圣洁的心
  rationale: ὁσιότης 指向敬虔、合乎神圣要求的圣洁；此译法自然且不把它窄化为单纯道德正直。
- source_word: τὰ καλὰ καὶ εὐάρεστα
  choice: 看为美好、蒙悦纳的事
  rationale: 分别体现 καλά 的美好/善与 εὐάρεστα 的令人喜悦、蒙悦纳，避免将二者合并为一个概念。
- source_word: τῶν ἀρχόντων ἡμῶν
  choice: 我们的执政者
  rationale: ἀρχόντων 泛指掌权治理者；“执政者”保持政治权柄含义而不限定具体官职或政体。
theological_decisions:
- issue: μὴ λογίσῃ πᾶσαν 的否定范围
  choice: 不要追究任何罪过
  alternative: 不要追究每一项罪过／不要算所有的罪
  rationale: 虽 πᾶσαν 字面为“每一、所有”，但在受闪语和七十士译本影响的否定结构中，整体祈求最自然是“不要算任何罪”。直译“不要追究每一项”在现代中文中容易暗示仍可追究其中一些罪，造成非原意的神学含义。脚注说明字面结构。
- issue: 在人与上帝及执政者面前蒙悦纳
  choice: 保留“你和我们的执政者眼中”两个对象
  alternative: 只将“蒙悦纳”联系于上帝
  rationale: 原文同一 ἐνώπιον 结构明确并列上帝与执政者。译文保留这种张力，不将属灵顺服与社会评价拆开，也不暗示执政者拥有与上帝同等的终极权威。
translation_notes:
  register: 采用庄重而自然的现代标准汉语祈祷语体。“求你”补出希腊祈使句在中文祈祷中的礼貌语气；保留“洁净洁净我们”的同根复沓，以反映原文修辞。脚注标记已在正文中以 [a] 出现。
