source:
  edition: Funk 1901 (normalized OCR)
  text: ναί, δέσποτα, ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς εἰς ἀγαθὰ ἐν εἰρήνῃ, εἰς τὸ σκεπασθῆναι ἡμᾶς τῇ χειρί σου τῇ κραταιᾷ καὶ ῥυσθῆναι ἀπὸ πάσης ἁμαρτίας τῷ βραχίονί σου τῷ ὑψηλῷ, καὶ ῥῦσαι ἡμᾶς ἀπὸ τῶν μισούντων ἡμᾶς ἀδίκως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/003.yaml
  text: Yes, Master, make your face shine upon us for good in peace, so that we may be sheltered by your mighty hand and delivered from every sin by your exalted arm, and rescue us from those who hate us unjustly.
translation:
  language: zh_hans
  text: 是的，主宰啊，求你使你的面容为我们的益处、在平安中光照我们，使我们得蒙你大能的手庇护，并借你高举的膀臂脱离一切罪；也求你救我们脱离那些无故恨我们的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: 主宰
  rationale: 保留该词表示拥有绝对权柄之主的语义，并以庄重而自然的现代汉语称呼呈现。
- source_word: ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς
  choice: 使你的脸光照我们
  rationale: 保留闪族式圣经意象，而不改写成较抽象的“施恩”。
- source_word: εἰς ἀγαθὰ ἐν εἰρήνῃ
  choice: 使我们在平安中蒙福
  rationale: εἰς ἀγαθὰ 可指向益处、福祉；译为“蒙福”既自然，也保留结果性的表达。
- source_word: σκεπασθῆναι
  choice: 庇护
  rationale: 表达遮盖并保护的含义，符合祷告语体。
- source_word: τῇ χειρί σου τῇ κραταιᾷ
  choice: 用大能的手
  rationale: κραταιός 强调强有力；“大能的手”保留经文惯用意象。
- source_word: τῷ βραχίονί σου τῷ ὑψηλῷ
  choice: 用你高举的膀臂
  rationale: ὑψηλός 直指高、高举；保留拟人化的拯救意象，避免抽象化。
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: 脱离一切罪
  rationale: 按原文保留“罪”的直接含义，不将其窄化为刑罚、罪责或某类恶行。
- source_word: ἀδίκως
  choice: 无故
  rationale: 在“恨我们”的语境中自然表达“不公正地、没有正当理由地”。
theological_decisions:
- issue: “脱离一切罪”可能指罪本身、罪的权势或其后果
  choice: 保留“救我们脱离一切罪”
  alternative: 救我们脱离一切罪恶／罪的权势
  rationale: 原文仅用 ἁμαρτία，没有明确限定所指；直译可保留其神学张力与开放性。
- issue: “你的脸光照我们”的神人同形意象
  choice: 保留“脸”与“光照”的具体意象
  alternative: 求你恩待我们
  rationale: 原文采用圣经祷告传统中的面容意象；不应以解释性措辞取代。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语祷告语体。句法适度分节，以三个“求你”明确并列祈求，同时保留“手”“膀臂”“脸”等原文具体意象。
