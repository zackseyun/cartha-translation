source:
  edition: Funk 1901 (normalized OCR)
  text: δὸς ὁμόνοιαν καὶ εἰρήνην ἡμῖν τε καὶ πᾶσιν τοῖς κατοικοῦσιν τὴν γῆν, καθὼς ἔδωκας τοῖς πατράσιν ἡμῶν, ἐπικαλουμένων σε αὐτῶν ὁσίως ἐν πίστει καὶ ἀληθείᾳ, ὑπηκόους γινομένους τῷ παντοκράτορι καὶ παναρέτῳ ὀνόματί σου, τοῖς τε ἄρχουσιν καὶ ἡγουμένοις ἡμῶν ἐπὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/004.yaml
  text: Give harmony and peace to us and to all who dwell on the earth[a], just as you gave them to our fathers when they called upon you in holiness, in faith and truth, becoming obedient to your almighty and all-virtuous name, and to our rulers and leaders upon the earth.
translation:
  language: zh_hans
  text: 求你把同心与和平赐给我们，也赐给所有住在地上的人，正如你从前赐给我们的先祖；那时，他们在信心和真理中虔诚地呼求你。愿我们顺服你全能、至善的名，也顺服我们在地上的执政者和领袖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿我们顺服”所对应的希腊语是宾格复数分词，所指应是当前祈祷者，而不是前一句属格结构中的“先祖”；这一分词也可较直译为“我们顺服着”。
    reason: 说明原文句法转换及分词所指，避免把对“我们在地上的执政者”的顺服误归给先祖。
lexical_decisions:
- source_word: ὁμόνοιαν
  choice: 同心
  rationale: 此词在《革利免一书》中具有群体和睦、消除纷争的语境；“同心”既保留共同一致之意，也比生硬的“协调一致”更自然庄重。
- source_word: εἰρήνην
  choice: 和平
  rationale: 对应群体与社会层面的安宁，与“同心”并列自然。
- source_word: ὁσίως ἐν πίστει καὶ ἀληθείᾳ
  choice: 以圣洁、信心和真理
  rationale: 保留三个宗教伦理概念及其并列关系，不把ἐν过度具体化。
- source_word: παντοκράτορι καὶ παναρέτῳ ὀνόματί σου
  choice: 你全能、至善的名
  rationale: παντοκράτωρ表达全能或统管万有；παναρέτος指具备一切美德、全然美善。“至善”在中文中简洁地表达这一赞美称号。
- source_word: ἄρχουσιν καὶ ἡγουμένοις
  choice: 执政者和领袖
  rationale: 保留两个近义而有区别的称谓：前者偏向掌权执政者，后者偏向带领者。
theological_decisions:
- issue: ὑπηκόους γινομένους的所指与句法关系
  choice: 译作“愿我们顺服……”，使分词指向当前祈祷者，而非先祖
  alternative: 译作先祖“变得顺服”，或译成“使我们顺服”
  rationale: ὑπηκόους为宾格复数，不能与属格独立结构中的αὐτῶν（先祖）一致；其语义所指应回到祈求所涉及的“我们”等人。希腊分词本身没有明确表达使役关系，因此用“愿我们”保留祷告语气，避免增添“使”的因果或目的含义。
- issue: 对上帝之名与地上执政者的双重顺服
  choice: 保留并列结构：“顺服你……的名，也顺服……执政者和领袖”
  alternative: 把对执政者的顺服解释为从属于或受限于对上帝的顺服
  rationale: 原文以τε连接两个与格对象，并未明说二者关系或附加限制；译文不作教派性展开。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告文体。“求你……愿我们……”清楚呈现祈求语气；用分号划开关于先祖的比较性插句，再恢复到当前祈祷者，避免希腊语长句在中文中造成错误指代。
