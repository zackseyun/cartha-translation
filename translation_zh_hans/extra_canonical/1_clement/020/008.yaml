  text: The ocean, impassable to men, and the worlds beyond it are directed by the ordinances of the Master.
translation:
  language: zh_hans
  text: 人无法越过的海洋，以及海洋彼岸的诸世界，都受主宰的规令引导。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠκεανὸς ἀπέραντος ἀνθρώποις
  choice: 人无法越过的浩瀚海洋
  rationale: ἀπέραντος 可指无边无际或不可穿越；与 ἀνθρώποις 连用时，侧重海洋对人而言无法越过，同时保留其浩瀚之感。
- source_word: οἱ μετ᾽ αὐτὸν κόσμοι
  choice: 海洋彼岸的诸世界
  rationale: μετ᾽ αὐτόν 在此表示在海洋之后或彼岸；κόσμοι 用复数，译作“诸世界”，不把古代宇宙观具体化。
- source_word: ταγαῖς
  choice: 安排
  rationale: 原文很可能是 διαταγαῖς 的文本或OCR残形，意为命令、规定或有序安排；结合 διευθύνονται，译作“安排”自然体现秩序性，又避免过度收窄为司法性的“法令”。
- source_word: τοῦ δεσπότου
  choice: 主宰的
  rationale: δεσπότης 表示拥有权柄的主人或主宰；“主宰”保留庄重语体和统管万有的语境。
- source_word: διευθύνονται
  choice: 有序运行
  rationale: 该动词可指被引导、治理或使其循正道而行；在宇宙秩序语境中，“有序运行”比单纯“被指引”更自然，并保留被主宰安排所规范的含义。
theological_decisions:
- issue: “主宰”是否明确指上帝
  choice: 保留称号“主宰”，不在正文增添“上帝”
  alternative: 译作“上帝”或“主上帝”
  rationale: 原文使用 δεσπότης 这一称号而非 θεός；保留称号既符合原文，也不额外解释其所指。
- issue: “诸世界”的宇宙论含义
  choice: 直译为“诸世界”，保留开放性
  alternative: 解释为“彼岸的陆地”“天体”或“宇宙空间”
  rationale: κόσμοι 的具体所指存在解释空间；正文不应把它限定为某一种古代地理或宇宙观。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文由海洋、彼岸诸世界到主宰秩序的推进；“有序运行”使中文自然，同时表达受安排、引导和治理的被动意味。
