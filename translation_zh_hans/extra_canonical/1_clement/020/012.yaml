  text: to whom be the glory and the majesty forever and ever. Amen.
translation:
  language: zh_hans
  text: 愿荣耀和威严归于他，直到永永远远。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόξα
  choice: 荣耀
  rationale: “荣耀”是现代汉语宗教与庄重语境中对该词自然且准确的对应，保留赞颂意味。
- source_word: μεγαλωσύνη
  choice: 威荣
  rationale: 该词指崇高、尊威与伟大；“威荣”既与“荣耀”有所区分，也适合颂赞上帝的庄重语境。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 保留希腊语加强式的永恒表达，同时采用现代中文圣经语体中清楚自然的说法。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代简体中文基督教文本中通行的音译。
theological_decisions:
- issue: 关系代词ᾧ所指对象及颂赞归属
  choice: 译作“归于他”
  alternative: 译作“愿他得着”或明示前文对象的称谓
  rationale: 原文仅用关系代词承接上文；不补入具体称谓，以保留其篇章指向，同时用“愿……归于他”自然表达省略的祈愿语气。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。句式保留颂赞文的礼仪感，不额外补充原文未明说的神学称谓。
