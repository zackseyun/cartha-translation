- source_word: καιροὶ ἐαρινοὶ καὶ θερινοὶ καὶ μετοπωρινοὶ καὶ χειμερινοὶ
  choice: 春、夏、秋、冬各有其时
  rationale: καιροί在这里指一年中依次出现的时节；译为“各有其时”既体现复数及季节性，也符合现代汉语的自然表达。
- source_word: ἐν εἰρήνῃ
  choice: 和平
  rationale: 保留εἰρήνη的核心意象，描写四季交接时秩序井然、彼此无争。
- source_word: μεταπαραδιδόασιν ἀλλήλοις
  choice: 彼此……交替
  rationale: 该动词含有相互传递、轮流交接之意；“彼此交替”简洁传达四季依次让位于下一季。
