  text: Οἱ οὐρανοὶ τῇ διοικήσει αὐτοῦ σαλευόμενοι ἐν εἰρήνῃ ὑποτάσσονται αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/001.yaml
  text: The heavens, revolving by his governance, submit to him in peace.
translation:
  language: zh_hans
  text: 诸天在他的治理下运转，安然顺服他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “运转”也可译作“被摇动”。
    reason: σαλευόμενοι本义范围包括摇动、震动；正文依宇宙秩序语境采用“运转”，脚注保留其真实词义歧义。
lexical_decisions:
- source_word: Οἱ οὐρανοὶ
  choice: 诸天
  rationale: 保留复数形式，也符合古代宇宙论语境中的庄重表达。
- source_word: τῇ διοικήσει αὐτοῦ
  choice: 在他的治理下
  rationale: διοίκησις在此指掌管、安排或治理；这一表达自然传达诸天的运行受其统管。
- source_word: σαλευόμενοι
  choice: 运转
  rationale: σαλεύω通常可指摇动，但在此宇宙秩序与和平的语境中，分词更可能描写诸天有规律的运动；译作“运转”避免误导为剧烈震荡，同时以脚注保留词义歧义。
- source_word: ἐν εἰρήνῃ
  choice: 安然
  rationale: 将“在和平中”自然地表达为不受扰乱、和谐有序的状态，并修饰顺服的方式。
- source_word: ὑποτάσσονται αὐτῷ
  choice: 顺服他
  rationale: 准确表达ὑποτάσσω所含的归顺、服从之意，且不额外引入制度性或教派性含义。
theological_decisions:
- issue: 诸天的运动与对上帝的顺服之间的关系
  choice: 保留“运转”与“顺服”两个并列观念
  alternative: 把运行直接解释成顺服的具体表现
  rationale: 原文既用分词描写诸天的运动，又以主要动词说明它们顺服他；译文不将两者完全合并，以保留原句结构和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“诸天”保留早期基督教宇宙论语感；“安然顺服”比直译“在和平中顺服”更自然，同时不削弱原文所强调的和谐秩序。
