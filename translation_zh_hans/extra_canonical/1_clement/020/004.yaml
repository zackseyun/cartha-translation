source:
  edition: Funk 1901 (normalized OCR)
  text: γῆ κυοφοροῦσα κατὰ τὸ θέλημα αὐτοῦ τοῖς ἰδίοις καιροῖς τὴν πανπληθῆ ἀνθρώποις τε καὶ θηρίοις καὶ πᾶσι τοῖς οὖσιν ἐπ᾽ αὐτῆς ζῶσιν ἀνατέλλει τροφήν, μήτε διστατάσουσα μηδὲ ἀλλοιοῦσά τι τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/004.yaml
  text: The earth, bearing according to his will at its proper seasons abundant food for men and beasts and all living things upon it, brings it forth, neither wavering nor altering anything of what has been decreed by him.
translation:
  language: zh_hans
  text: 大地照着他的旨意孕育，在适当的时节，为人、兽类和一切在其上生活的生物生出丰盛的食物；它既不迟疑，也不改变他所定规的任何事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυοφοροῦσα
  choice: 孕育
  rationale: 原词本义为怀胎、孕育；此处以大地为主语，保留其生育意象，又不擅自补入“果实”。
- source_word: τοῖς ἰδίοις καιροῖς
  choice: 在适当的时节
  rationale: 表达各物所宜、所定的时节；现代汉语自然，并保留复数所涵盖的周期性。
- source_word: τὴν πανπληθῆ … τροφήν
  choice: 丰丰富富的食物
  rationale: πανπληθῆ 强调数量极其充足；叠词使普通读者易懂，同时保留丰盛感。
- source_word: ἀνατέλλει
  choice: 生出
  rationale: 该词可指使植物萌发、长出；以大地生出食物，符合此处意象和汉语搭配。
- source_word: διστατάσουσα
  choice: 迟疑
  rationale: 保留大地拟人化地毫不踌躇执行神旨意的表达。
- source_word: τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ
  choice: 他所定下的任何命令
  rationale: δεδογματισμένων 指已由他作出的规定或命定；“命令”承接上下文中受造界服从神所立秩序的语气。
theological_decisions:
- issue: αὐτοῦ所指及神的旨意与命定
  choice: 译作“他的旨意”及“他所定下的任何命令”
  alternative: “祂的旨意”及“祂所规定的一切”
  rationale: 上下文所指为神，但采用现代简体中文通行的人称代词“他”，不以专用代词额外加入原文没有的敬称层次；同时保留旨意与命定的神学表达。
- issue: 自然界行动的拟人化
  choice: 保留“孕育”“迟疑”“更改”等拟人表达
  alternative: 改写为自然规律性的说明
  rationale: 希腊原文有意描绘大地顺服神的命定，不应将其神学修辞消解为纯自然过程。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“大地”较“土地”更能承载宇宙秩序的语境；分号分开大地供应食物与其坚定遵行命令两层意思。
