- from: 大地按照他的旨意孕育，在适当的时节，为人、走兽和地上一切生物生出丰丰富富的食物；它既不迟疑，也不更改他所定下的任何命令。
  to: 大地照着他的旨意孕育，在适当的时节，为人、兽类和一切在其上生活的生物生出丰盛的食物；它既不迟疑，也不改变他所定规的任何事。
  rationale: 修订“丰丰富富的食物”和“任何命令”，使译文在庄重自然的现代汉语中更准确对应 πανπληθῆ 与 τῶν δεδογματισμένων；其余保留原稿对大地拟人化、按时供应及顺服神所定秩序的表达。
