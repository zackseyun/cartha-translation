revisions:
- from: 无边海洋的浩瀚水体，照着他的创造汇聚在各处水域中，并不越过四周为它划定的界限；他怎样吩咐，它就怎样遵行。
  to: 无边大海的水体，照着他的创造汇聚在各个聚水之处，并不越过四周为它划定的界限；他怎样吩咐，它就怎样遵行。
  rationale: 将“各处水域中”改为“各个聚水之处”，以保留συναγωγαί作为海水收聚之处的含义；删去“浩瀚”，避免与“无边”重复并使χύτος更直接地表示水的总体、水体。其余措辞维持原译对κατὰ τὴν δημιουργίαν αὐτοῦ、περιτεθειμένα…χείλη及οὕτως ποιεῖ的处理。英文审计轨迹中的“Or ‘The basin’”是英语既往译法说明，并非本中文修订所需的原文歧义注释，故不设置脚注。
