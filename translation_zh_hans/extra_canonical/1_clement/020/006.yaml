    rationale: ἀπείρου已表达无边无际；“浩瀚”虽不构成实质误译，却为χύτος额外加入了广阔的修饰。
  revised_text: 无边大海的水体，照着他的创造汇聚在各个聚水之处，并不越过四周为它划定的界限；他怎样吩咐，它就怎样遵行。
