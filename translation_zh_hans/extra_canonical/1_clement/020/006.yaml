  text: τὸ χύτος τῆς ἀπείρου θαλάσσης κατὰ τὴν δημιουργίαν αὐτοῦ συσταθὲν εἰς τὰς συναγωγὰς οὐ παρεκβαίνει τὰ περιτεθειμένα αὐτῇ χείλη, ἀλλὰ καθὼς διετάξεν αὐτῇ, οὕτως ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/006.yaml
  text: The mass of the boundless sea[a], gathered together according to his creation into its basins, does not pass beyond the bounds set around it, but as he commanded it, so it does.
translation:
  language: zh_hans
  text: 无边大海的水体，照着他的创造汇聚在各个聚水之处，并不越过四周为它划定的界限；他怎样吩咐，它就怎样遵行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ χύτος
  choice: 浩瀚水体
  rationale: χύτος在此指倾泻、铺展而成的大量水体，即海水的整体规模，不是盛水的“盆”；用“浩瀚水体”既对应其实体意义，也符合现代汉语。
- source_word: τῆς ἀπείρου θαλάσσης
  choice: 无边海洋的
  rationale: ἀπείρου意为无界限、无边际；“无边海洋”自然保留原文对海洋广大无际的描写。
- source_word: κατὰ τὴν δημιουργίαν αὐτοῦ
  choice: 照着他的创造
  rationale: κατά可表达依照、按照；δημιουργία指创造或创造安排。此译法贴近字面，并保留“创造”是行动还是秩序安排的张力。
- source_word: συσταθὲν εἰς τὰς συναγωγάς
  choice: 汇聚在各处水域中
  rationale: συσταθέν是被聚集、汇集；συναγωγαί在此指水聚集之处。译作“各处水域”比生硬的“集合处”自然，也避免误解为器皿。
- source_word: τὰ περιτεθειμένα αὐτῇ χείλη
  choice: 四周为它划定的界限
  rationale: χείλη字面为“唇、边缘”，结合περιτεθειμένα表示环绕设置的边界；“划定的界限”传达海水不得越过的边沿。
- source_word: διετάξεν
  choice: 吩咐
  rationale: διατάσσω可指命令、规定、安排；在受造界服从创造者的语境中，“吩咐”自然且保留权威意味。
- source_word: οὕτως ποιεῖ
  choice: 就怎样遵行
  rationale: 字面为“就怎样做”。汉语用“遵行”清楚体现海洋按所受命令行动，同时不增加具体行动内容。
theological_decisions:
- issue: “他的创造”中代词所指及创造者身份
  choice: 保留“他的”，不在正文补明身份
  alternative: 译作“上帝的创造”或“造物主的安排”
  rationale: 本句希腊文仅用αὐτοῦ“他的”，所指依赖上下文；直译可避免在本节内补入原文未明说的称谓。
- issue: 自然界对命令的回应是否拟人化
  choice: 译作“遵行”，保留拟人化表达
  alternative: 译作“照样运行”
  rationale: 原文以命令和行动描述海洋，明显带有修辞性拟人色彩；“遵行”忠实呈现受造界服从命令的主题。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文“并不……；怎样……就怎样……”的对照与节奏。“各处水域”用于表达海水汇聚之处，避免把χύτος误作容器，也避免宗教语境中“会众/聚会”的歧义。
