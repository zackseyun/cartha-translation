  text: ἥλιός τε καὶ σελήνη, ἀστέρων τε χοροὶ κατὰ τὴν διαταγὴν αὐτοῦ ἐν ὁμονοίᾳ δίχα πάσης παρεκβάσεως ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/003.yaml
  text: The sun and the moon and the choirs of stars[a], according to his ordinance, move in concord, without any deviation, along the courses assigned to them.
translation:
  language: zh_hans
  text: 太阳、月亮和众星的队列[a]，都照着他的安排，在同心一致中，毫无偏离地沿着为它们指定的轨道运行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众星的队列”直译可作“众星的合唱队”或“众星的舞队”；描绘群星有序地排列并协调运行。
    reason: 保留χοροί可指队列、合唱队或舞队的形象，同时正文采用自然的现代汉语。
lexical_decisions:
- source_word: χοροὶ
  choice: 群星
  rationale: 原义为“队列、合唱队或舞队”；在宇宙秩序的语境中，“群星”自然传达众星排列成队、协调运行的整体意象，脚注保留其形象性。
- source_word: διαταγὴν
  choice: 安排
  rationale: 表达神所制定的秩序或部署；“安排”在现代汉语中自然庄重，又不额外引入“命令”或“法令”的强制色彩。
- source_word: ἐν ὁμονοίᾳ
  choice: 同心一致
  rationale: 保留ὁμόνοια在《革利免一书》中“同心、和睦、一致”的重要修辞意义，而不只泛化为声音或运动上的“和谐”。
- source_word: δίχα πάσης παρεκβάσεως
  choice: 毫不偏离地
  rationale: 准确表达“没有任何越轨或偏离”，并与天体遵循既定秩序的语境相合。
- source_word: ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς
  choice: 循着为它们指定的轨道运行
  rationale: ἐξελίσσω含展开、推进之意，ὁρισμοί本指所定的界限或范围；结合天体语境，以“循着……轨道运行”自然表达沿指定范围推进，同时避免生硬直译为“展开界限”。
theological_decisions:
- issue: ὁμόνοια的修辞和神学分量
  choice: 同心一致
  alternative: 和谐
  rationale: “同心一致”保留本书以ὁμόνοια对照纷争、分裂的伦理与群体性张力；“和谐”虽顺口，却可能把它缩减为宇宙运动的协调。
- issue: 天体秩序的施行者
  choice: 照着他的安排
  alternative: 照着他的命令
  rationale: 希腊文强调天体依照属于“他”的既定秩序运行；“安排”既承认神圣主权，也不把διαταγή过度限定为口头命令。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式保持原文由天体主体、神圣安排、同心运行和毫无偏离构成的层次；“同心一致”有意保留全书核心修辞词ὁμόνοια的分量。
