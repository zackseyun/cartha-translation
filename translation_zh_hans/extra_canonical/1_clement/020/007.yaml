  yaml_path: translation/extra_canonical/1_clement/020/007.yaml
  text: For he said, “Thus far you shall come, and your waves shall be broken within you.”
translation:
  language: zh_hans
  text: 因为他说：“你只能到这里；你的波浪必在你里面碎裂。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕως ὧδε ἥξεις
  choice: 你只能到这里
  rationale: 直译为“你将到这里为止”；用“只能”自然表达界限和禁止越过之意，同时保留庄重语气。
- source_word: τὰ κύματά σου
  choice: 你的波浪
  rationale: 按原文保留第二人称所有格和海浪意象。
- source_word: ἐν σοὶ συντριβήσεται
  choice: 必在你里面碎裂
  rationale: 保留ἐν σοὶ较不寻常的空间表达，不擅自改成“在这里”或“在岸边”；συντριβήσεται译作“碎裂”，体现被粉碎、破碎之意。
theological_decisions:
- issue: 引文中说话者的指代
  choice: 因为他说
  alternative: 因为上帝说
  rationale: 原文只有εἶπεν γάρ，没有明说主语；保留“他”，避免把上下文所暗示的身份直接补入正文。
- issue: ἐν σοὶ的含义
  choice: 在你里面
  alternative: 在这里／在你身上
  rationale: 原文可能带有诗性或引文传统造成的张力；正文保留字面歧义，不替读者消解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号呈现两句之间紧密的并列关系；不添加原文没有的解释性成分。
