revisions:
- from: 风的定程，各按自己的时节，畅行无阻地完成各自的职分；长流不息的泉源，是为供人享用、使人健康而造的，也毫不枯竭地将乳房供给人类，维持生命。[a]各种最微小的生物，也都在和睦与和平中聚集。
  to: 风的运行，各按自己的时节，毫无阻碍地履行自己的职分；长流不息的泉源，为供人享用和保养健康而受造，从不匮乏，向人类供给乳房，以维持生命。[a]最微小的生物也在和睦与和平中聚集。
  rationale: 修订删除原文未表达的“各种”，并调整若干措辞以提高现代汉语的顺畅度和句法关系的清晰度。“最微小的生物”准确对应τὰ ἐλάχιστα τῶν ζῴων；“从不匮乏，向人类供给”适切表达δίχα ἐλλείψεως与παρέχονται。其余关键意象、并列结构及不明言施令者的受造秩序表述均予保留。
