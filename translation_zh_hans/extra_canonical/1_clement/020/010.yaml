source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνέμων σταθμοὶ κατὰ τὸν ἴδιον καιρὸν τὴν λειτουργίαν αὐτῶν ἀπροσκόπως ἐπιτελοῦσιν· ἀέναοί τε πηγαί, πρὸς ἀπόλαυσιν καὶ ὑγείαν δημιουργηθεῖσαι, δίχα ἐλλείψεως παρέχονται τοῖς πρὸς ζωὴν ἀνθρώποις μαζούς· τά τε ἐλάχιστα τῶν ζῴων τὰς συνελεύσεις αὐτῶν ἐν ὁμονοίᾳ καὶ εἰρήνῃ ποιοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/010.yaml
  text: The courses of the winds[a], each in its own season, fulfill their service without hindrance; and the ever-flowing springs, created for enjoyment and health, without fail provide their breasts for the life of men[b]. And the smallest of living creatures hold their gatherings in harmony and peace.
translation:
  language: zh_hans
  text: 风的运行，各按自己的时节，毫无阻碍地履行自己的职分；长流不息的泉源，为供人享用和保养健康而受造，从不匮乏，向人类供给乳房，以维持生命。[a]最微小的生物也在和睦与和平中聚集。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乳房”是原文的比喻：泉源被描写为母亲，以水哺育人的生命。
    reason: 说明并保留原文μαζούς的母体哺育隐喻，避免将其弱化为普通的供水表述。
lexical_decisions:
- source_word: ἀνέμων σταθμοὶ
  choice: 风的定程
  rationale: σταθμοί在此指风依秩序而有的固定行程或安排；“定程”既保留其受规定、各有时节的意味，也比直译为“站所”更符合现代汉语语境。
- source_word: ἀπροσκόπως
  choice: 畅行无阻地
  rationale: 该副词在此强调风履行职分时不受阻碍、运行顺畅；避免按词源硬译为“毫不绊跌”而造成不自然的拟人表达。
- source_word: λειτουργίαν
  choice: 职分
  rationale: 在宇宙秩序的语境中表示所承担并履行的职责或服务；“职分”保留受命履职的庄重色彩，而不限定为后世礼仪术语。
- source_word: ἀέναοί ... πηγαί
  choice: 长流不息的泉源
  rationale: 表达泉源持续涌流、不止息的性质，符合现代汉语习惯。
- source_word: μαζούς
  choice: 乳房
  rationale: 原文以母体哺育的鲜明隐喻描写泉源供养生命；保留“乳房”而不弱化为单纯的“水源”或“乳汁”。
- source_word: τὰς συνελεύσεις αὐτῶν ... ποιοῦνται
  choice: 在……中聚集
  rationale: συνελεύσεις指共同聚集；采用自然汉语动词结构，保留生物共同活动的图景而避免过强的人类会议色彩。
- source_word: ὁμονοίᾳ καὶ εἰρήνῃ
  choice: 和睦与和平
  rationale: 分别保留同心协调与和平安宁两个并列概念，不将二者合并为单一近义表达。
theological_decisions:
- issue: 自然秩序是否被译成明确的神学命令
  choice: 保留“定程”“职分”“而造的”等原文秩序与受造语言，不补出未明说的施令者
  alternative: 增译为“按照上帝所定的命令”
  rationale: 上下文确有受造秩序的神学意涵，但本句没有明说施令者；不宜在译文中替作者明确化。
- issue: 泉源哺育生命的母体隐喻
  choice: 保留“乳房”并以脚注说明
  alternative: 意译为“源源不断地供水养活人类”
  rationale: 原文μαζούς具有刻意而鲜明的哺育意象；保留可避免抹平修辞，同时脚注帮助现代读者理解。
translation_notes:
  register: 采用庄重而可读的现代标准普通话。以分号呈现三个并列的自然秩序例证；避免古奥句式，也不把τε强化为“甚至”。“毫不枯竭”对应δίχα ἐλλείψεως，兼顾泉水不缺乏、不止息的语境含义。
