  text: ταῦτα πάντα ὁ μέγας, διμιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐν εἰρήνῃ καὶ ὁμονοίᾳ προσέταξεν εἶναι, εὐεργετῶν τὰ πάντα, ὑπερεκπερισσῶς δὲ ἡμᾶς τοὺς προσπεφευγότας τοῖς οἰκτιρμοῖς αὐτοῦ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/011.yaml
  text: All these things the great Creator and Master of all has appointed to be in peace and harmony, doing good to all things, but exceedingly more to us who have fled for refuge to his mercies through our Lord Jesus Messiah,
translation:
  language: zh_hans
  text: 这一切，伟大的创造者、万有的主宰，都吩咐它们处于和平与和睦之中；他施恩给万有，尤其丰丰富富地施恩给我们这些借着我们的主耶稣弥赛亚投靠他的怜悯的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διμιουργὸς
  choice: 创造者
  rationale: 原文虽为异写形式，所指为“创造者”；采用现代汉语清楚、庄重的对应词。
- source_word: δεσπότης τῶν ἁπάντων
  choice: 万有的主宰
  rationale: 保留 δεσπότης 所表达的统辖权威，并以“万有”对应 τῶν ἁπάντων。
- source_word: ἐν εἰρήνῃ καὶ ὁμονοίᾳ
  choice: 在和平与和谐中
  rationale: 分别对应“和平”与“一致、和睦”；在描述受造秩序时，“和谐”自然且不把两词合并。
- source_word: προσέταξεν εἶναι
  choice: 命定……运行
  rationale: προσέταξεν 表示吩咐、规定；εἶναι 直译为“存在/处于”。结合前文宇宙秩序的语境，以“命定……运行”表达万物被安排处于和平和谐之中，避免生硬的“命令其存在”。
- source_word: εὐεργετῶν
  choice: 恩待
  rationale: 分词表示施惠、行善；“恩待”简洁地承接上文主语，也适合神施恩的语境。
- source_word: ὑπερεκπερισσῶς
  choice: 格外丰厚地
  rationale: 此加强副词表示远超过一般程度；与 εὐεργετῶν 连用时，“格外丰厚地恩待”比孤立的“极其更多”更自然。
- source_word: προσπεφευγότας
  choice: 投奔
  rationale: 该完成时分词含逃往某处寻求庇护之意；“投奔”保留避难、求庇护的意象。
- source_word: τοῖς οἰκτιρμοῖς αὐτοῦ
  choice: 他怜悯
  rationale: 复数形式可表示丰富或多方面的怜悯；汉语用集合意义的“怜悯”较自然。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός 是“受膏者”，在此为耶稣的称号；用“弥赛亚”保留称号意义，而非将其仅作音译专名。
theological_decisions:
- issue: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ 修饰范围
  choice: 将“借着我们的主耶稣弥赛亚”置于“投奔他怜悯”之前，使其主要修饰投奔/归向的途径。
  alternative: 也可理解为修饰上文“格外丰厚地恩待我们”，即神借着耶稣弥赛亚施恩。
  rationale: 希腊语介词短语位于整个分词结构之后，句法附着存在一定开放性。正文按最邻近成分处理，但不排除其与“恩待”相关。
- issue: ὑπερεκπερισσῶς δὲ ἡμᾶς 的比较关系
  choice: 译作“更格外丰厚地恩待我们”，呈现对万有普遍施惠与对“我们”特别施惠之间的加强对比。
  alternative: 可译作“尤其恩待我们”，弱化副词的高度强化色彩。
  rationale: ὑπερεκπερισσῶς 是强烈的程度副词，正文既保留 δὲ 的对比，也避免把神对万有的恩待解释为同质、可量化的机械比较。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。整句保留原文长句结构及神为主语的连续动作关系；“运行”用于表达受造秩序处于和平和谐中的持续状态。“投奔他怜悯”有意保留原文避难求庇护的生动意象。
