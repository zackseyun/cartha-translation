revisions:
- from: 深渊中不可测度之处，以及地下不可言说的领域，都受同样的法令约束。[a]
  to: 深渊中不可探究之处，以及地下世界不可言述的裁定，都受同样的命令约束。[a]
  rationale: 修订恢复κρίματα的“裁定／判定”义，避免将其无依据地转换为“领域”；同时将προστάξεσιν译为“命令”，并保留συνέχεται可有“维系”义的脚注替代译法。未补出命令的颁布者，也未把地下世界具体化为任何特定宗教传统的阴间体系。
