  text: ἀβύσσων τε ἀνεξιχνίαστα καὶ νερτέρων ἀνεκδιήγητα κρίματα τὰς αὐτὰς συνέχεται προστάξεσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/005.yaml
  text: The unsearchable depths of the abysses and the indescribable regions below are held together by the same ordinances[a].
translation:
  language: zh_hans
  text: 深渊中不可探究之处，以及地下世界不可言述的裁定，都受同样的命令约束。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都由同样的命令维系。”
    reason: συνέχεται可侧重受约束、限制，也可指被维系或保持在一起；正文按与προστάξεσιν连用及上下文的界限意象译为“受……约束”。
lexical_decisions:
- source_word: ἀβύσσων ... ἀνεξιχνίαστα
  choice: 深渊中不可测度之处
  rationale: 保留属格“深渊中／深渊的”与中性复数形容词名词化的表达，不把它收窄为可具体描绘的地理结构。
- source_word: νερτέρων ἀνεκδιήγητα κρίματα
  choice: 地下不可言说的领域
  rationale: νερτέρων指下方或地下之物；κρίματα在这里结合宇宙秩序的语境，可指划定的区域或范围。译作“领域”比通常的“审判”更符合并列结构，但原词的含义并不完全确定。
- source_word: προστάξεσιν
  choice: 法令
  rationale: 该词指命令、规定或所颁布的条例；“法令”既体现权威性，也适合支配宇宙秩序的上下文。
- source_word: συνέχεται
  choice: 受……约束
  rationale: 与表示命令或法令的与格连用时，可表达被管束、限制或维系在既定范围内；此译法符合上下文中受界限管辖的图景。
theological_decisions:
- issue: 法令的颁布者是否明说为上帝
  choice: 不在正文补出“上帝的”
  alternative: 都受上帝同样的法令约束
  rationale: 上下文可以推知这些法令出于上帝，但本句希腊文只说“同样的法令”；不明补主有者，可避免把语境推论写成明文。
- issue: συνέχεται表达限制还是内部凝聚
  choice: 正文采用“受……约束”
  alternative: 由……维系／结合在一起
  rationale: προστάξεσιν及邻近段落关于界限和服从的语境支持“约束”；同时该动词也可有“维系、保持在一起”的意味，故以脚注保留。
translation_notes:
  register: 采用庄重而现代的书面普通话。“不可测度”“不可言说”保留原文的修辞对称；用“地下”而非带有特定宗教体系色彩的专门术语，以保存νερτέρων的空间性与含混性。
