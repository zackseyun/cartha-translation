  text: Day and night complete the course appointed by him, hindering one another in nothing.
translation:
  language: zh_hans
  text: 白昼和黑夜都走完他所指定的路程，彼此毫不妨碍。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρα τε καὶ νὺξ
  choice: 白昼和黑夜
  rationale: 用现代汉语中自然而庄重的对应语，保留昼夜并列的结构。
- source_word: τὸν τεταγμένον ὑπ᾽ αὐτοῦ δρόμον
  choice: 他所指定的路程
  rationale: τεταγμένον 表示安排、指定；δρόμος 在此比喻昼夜各自运行的行程，译作“路程”可保留原文意象。
- source_word: ἀνύουσιν
  choice: 走完
  rationale: 该动词有完成、走完之意；与“路程”搭配自然，并准确表达持续完成既定运行。
- source_word: μηδὲν ἀλλήλαις ἐμποδίζοντα
  choice: 彼此毫不妨碍
  rationale: 简洁重现“在任何事上都不互相阻碍”的绝对否定语气；中文无需机械保留希腊语分词结构。
