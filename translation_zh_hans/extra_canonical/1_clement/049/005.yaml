source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγάπη κολλᾷ ἡμᾶς τῷ θεῷ, ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν, ἀγάπη πάντα ἀνέχεται, πάντα μακροθυμεῖ· οὐδὲν βάναυσον ἐν ἀγάπῃ, οὐδὲν ὑπερήφανον· ἀγάπη σχίσμα οὐκ ἔχει, ἀγάπη οὐ στασιάζει, ἀγάπη πάντα ποιεῖ ἐν ὁμονοίᾳ· ἐν τῇ ἀγάπῃ ἐτελειώθησαν πάντες ἐκλεκτοὶ τοῦ θεοῦ, δίχα ἀγάπης οὐδὲν εὐάρεστόν ἐστιν τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/005.yaml
  text: Love joins us to God; love covers a multitude of sins; love endures all things, is patient in all things. There is nothing coarse in love, nothing arrogant. Love has no schism; love does not stir up faction; love does all things in concord. In love all the elect of God were made complete; apart from love, nothing is pleasing to God.
translation:
  language: zh_hans
  text: 爱使我们与上帝紧密相连；爱遮盖许多罪；爱凡事包容，凡事恒久忍耐。爱中没有粗鄙，没有傲慢；爱不造成分裂，不挑起纷争；爱在同心中成就一切。上帝一切蒙拣选的人都在爱中得以完全；离了爱，没有什么能蒙上帝喜悦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: 爱
  rationale: 以现代汉语中自然而庄重的“爱”表达本段反复出现的核心概念，并保留原文的修辞重复。
- source_word: κολλᾷ
  choice: 使……紧密相连
  rationale: 该词有黏合、紧密联结之意；此译既传达关系的紧密，也避免不自然的字面表达。
- source_word: καλύπτει
  choice: 遮盖
  rationale: 保留原文及其经文回响中的形象性措辞，不将其解释为赦免、忽略或隐藏。
- source_word: ἀνέχεται
  choice: 包容
  rationale: 表达承受、容忍之义；与随后“恒久忍耐”区分，同时保持自然汉语。
- source_word: μακροθυμεῖ
  choice: 恒久忍耐
  rationale: 体现长期忍耐、不轻易发怒的语义，并保留πάντα所强调的全面性。
- source_word: βάναυσον
  choice: 粗鄙
  rationale: 该词在此指卑劣、粗俗或不体面的性质；“粗鄙”简洁涵盖其道德与举止层面。
- source_word: σχίσμα
  choice: 分裂
  rationale: 译出裂痕、分党之义，不使用可能带入后世制度含义的专门术语。
- source_word: στασιάζει
  choice: 挑起纷争
  rationale: 表达结党争斗、制造派系冲突的主动意味。
- source_word: ὁμονοίᾳ
  choice: 同心
  rationale: 该词指思想与意志的一致；“同心”符合本书劝勉群体和睦的语境。
- source_word: ἐτελειώθησαν
  choice: 得以完全
  rationale: 保留被动语态及达到完全、成全的神学张力，不具体限定为道德完善或终末完成。
- source_word: εὐάρεστόν
  choice: 蒙……喜悦
  rationale: 自然表达“为上帝所悦纳、所喜悦”，同时保留关系性的评价。
theological_decisions:
- issue: “爱遮盖许多罪”的作用
  choice: 直译为“遮盖许多罪”
  alternative: 解释为“使许多罪得赦免”或“宽容他人的许多过错”
  rationale: 原文未明确说明遮盖罪的主体机制或具体方式；保留比喻及其歧义，避免预先作出赎罪论或伦理层面的限定。
- issue: 蒙拣选者“在爱中得以完全”
  choice: 保留“得以完全”的被动和宽泛含义
  alternative: 译作“达到道德成熟”或“最终得救”
  rationale: ἐτελειώθησαν可指被成全、达到完全；上下文没有要求把它单一定义为伦理成熟或终末得救。
- issue: “离了爱，没有什么能蒙上帝喜悦”的绝对表述
  choice: 保留原文的绝对语气
  alternative: 弱化为“若没有爱，人的行为很难蒙上帝喜悦”
  rationale: 原文以οὐδὲν作明确的全称否定；译文不应削弱其神学与伦理力度。
translation_notes:
  register: 采用现代、庄重、易懂的书面普通话。保留“爱”的首语反复和多个平行分句，以再现原文的劝勉节奏；避免古奥词汇及宗派化术语。
