  text: 爱所引向的高度，是无法言述的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ὕψος
  choice: 高度
  rationale: 保留原文空间性意象及其抽象含义，不将其具体化为“境界”等解释性表达。
- source_word: εἰς ὃ ἀνάγει
  choice: 所引向的
  rationale: ἀνάγει含有带领、引向高处之意；“引向”既照应“高度”，也不增添原文未明说的宾语“我们”。
- source_word: ἡ ἀγάπη
  choice: 爱
  rationale: 此处用现代汉语自然、庄重的“爱”，不额外限定其对象或神学类别。
- source_word: ἀνεκδιήγητόν ἐστιν
  choice: 是无法言述的
  rationale: 表达其不可充分讲述、难以用言语说尽之意；“无法言述”较为凝练，并保留原文的绝对语气。
theological_decisions:
- issue: 爱的引领对象在原文中未明说
  choice: 不补出“我们”
  alternative: 爱把我们提升到的高度
  rationale: 希腊文关系结构只说“爱所引向的高度”，未明确指出被引领者；保留这一省略，避免无依据地限定对象。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留“高度”的原文意象，并以“引向”呈现动作关系。
