  yaml_path: translation/extra_canonical/1_clement/049/001.yaml
  text: Whoever has love in the Messiah, let him do the Messiah’s commandments.
translation:
  language: zh_hans
  text: 凡在基督里有爱的人，就当遵行基督的诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἔχων
  choice: 凡……有……的人
  rationale: 保留希腊语泛指单数结构的普遍适用意义，同时符合现代汉语表达。
- source_word: ἀγάπην
  choice: 爱
  rationale: 直接表达基督教文献中 ἀγάπη 的核心含义，不额外限定为某一种爱。
- source_word: ἐν Χριστῷ
  choice: 在基督里
  rationale: 保留介词短语的联合、领域或关系含义，不将其简化为“对基督”。
- source_word: ποιησάτω
  choice: 应当遵行
  rationale: 以劝勉性表达呈现第三人称命令式；与“诫命”搭配时，“遵行”比字面的“做”更自然。
- source_word: τὰ τοῦ Χριστοῦ παραγγέλματα
  choice: 基督的诫命
  rationale: 自然而准确地表达所属关系；παράγγελμα 在此指所吩咐的命令或训令。
theological_decisions:
- issue: ἐν Χριστῷ 修饰“有爱”时的含义
  choice: 在基督里有爱
  alternative: 爱基督
  rationale: 原文说的是 ἀγάπην ἐν Χριστῷ，并非以基督为直接宾语；译文保留其可能表示在基督里的爱或在与基督联合中所具有之爱的张力。
- issue: ποιησάτω 的语气
  choice: 应当遵行
  alternative: 就要遵行
  rationale: 第三人称命令式带有劝勉和要求；“应当”传达规范性而不过度强化为条件结果。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“凡……的人”保留格言式普遍劝勉；“在基督里”沿用汉语基督教文献中通行且能承载原文歧义的表达。
