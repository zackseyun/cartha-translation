  yaml_path: translation/extra_canonical/1_clement/049/002.yaml
  text: Who is able to describe the bond of God's love?[a]
translation:
  language: zh_hans
  text: 谁能述说上帝之爱的纽带呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“阐明”。
    reason: ἐξηγήσασθαι 既可表示述说、描述，也可表示解释、阐明。
lexical_decisions:
- source_word: δεσμὸν
  choice: 纽带
  rationale: 指把人联结在一起的约束或联系；“纽带”既保留原文比喻，也符合现代汉语表达。
- source_word: ἀγάπης τοῦ θεοῦ
  choice: 上帝之爱
  rationale: 保留属格结构本身可能包含的张力，可理解为源于上帝的爱，也可理解为对上帝的爱，不在正文中擅自限定。
- source_word: ἐξηγήσασθαι
  choice: 述说
  rationale: 该词可指解释、叙述或详加陈述；此处是赞叹式反问，且与下文有关言说与描述的修辞相呼应，“述说”较自然庄重。
theological_decisions:
- issue: τοῦ θεοῦ 的属格关系
  choice: 上帝之爱
  alternative: 上帝对人的爱／人对上帝的爱
  rationale: 希腊文未明确区分主格属格或宾格属格；采用不加展开的中文结构，以保留真实歧义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；以“呢”传达希腊文反问的赞叹语气。
