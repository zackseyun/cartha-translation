  text: ἐν ἀγάπῃ προσελάβετο ἡμᾶς ὁ δεσπότης· διὰ τὴν ἀγάπην, ἣν ἔσχεν πρὸς ἡμᾶς, τὸ αἷμα αὐτοῦ ἔδωκεν ὑπὲρ ἡμῶν Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν ἐν θελήματι θεοῦ, καὶ τὴν σάρκα ὑπὲρ τῆς σαρκὸς ἡμῶν καὶ τὴν ψυχὴν ὑπὲρ τῶν ψυχῶν ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/006.yaml
  text: In love the Master received us; because of the love that he had toward us[a], Jesus Messiah our Lord gave his blood for us by the will of God, and his flesh for our flesh and his life for our lives.
translation:
  language: zh_hans
  text: 主宰在爱中接纳了我们；因着他对我们的爱，我们的主耶稣弥赛亚照着上帝的旨意，为我们舍了自己的血，并舍了自己的肉身，为我们的肉身；又舍了自己的魂[a]，为我们的魂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “魂”也可译作“生命”。原文在此将“肉身”与“魂”并列：“舍了自己的肉身，为我们的肉身；又舍了自己的魂，为我们的魂。”
    reason: ψυχή可指“魂”或“生命”；正文采用“魂”以保留与σάρξ（肉身）的平行，脚注说明另一自然译法。
lexical_decisions:
- source_word: ἀγάπη
  choice: 爱
  rationale: 用现代汉语中自然而庄重的“爱”，并保留原文两次出现所形成的强调。
- source_word: ὁ δεσπότης
  choice: 主
  rationale: δεσπότης可指主人、主宰；此处指基督，用“主”最自然，也保留其权柄意味。
- source_word: προσελάβετο
  choice: 接纳了
  rationale: 该词有接到身边、接纳之意；“接纳”清楚表达关系性的收纳。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 将希腊称号Χριστός所表达的“受膏者”身份译为“弥赛亚”，避免仅作音译而淡化其称号性质。
- source_word: ἐν θελήματι θεοῦ
  choice: 照着上帝的旨意
  rationale: 表达行动符合并出于上帝旨意；“照着”比直译“在……旨意中”更合乎现代汉语。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: ὑπέρ在此明确含有为他人而牺牲的意义；不在此处额外限定为“代替”，以保留介词本身的语义幅度。
- source_word: σάρξ
  choice: 肉身
  rationale: 在与ψυχή平行的人论表达中，“肉身”比单说“肉”自然且庄重，同时保留身体层面的指向。
- source_word: ψυχή
  choice: 魂
  rationale: 原文刻意以“肉身/魂”构成平行，译作“魂”可保留这一修辞与人论张力；若译作“生命”，虽合乎该词语义范围，却会弱化原文的对应结构。
theological_decisions:
- issue: ὑπέρ在“肉身为肉身、魂为魂”中的代替意味
  choice: 以……代替……
  alternative: 为我们的肉身／为我们的魂
  rationale: 这两组高度对称的表达具有明显的替代性修辞；汉语若都只译“为”，关系不够清楚。不过前面的“为我们舍血”仍保留较宽的ὑπέρ表达。
- issue: ψυχή应译为“魂”还是“生命”
  choice: 魂
  alternative: 生命
  rationale: ψυχή可指生命或魂，但此处与σάρξ严格平行。译作“魂”保存“肉身对肉身、魂对魂”的对称和潜在人论含义，不替作者消解其神学张力。
- issue: “主”在本句中的指称
  choice: 将δεσπότης译为“主”，不另行注明其指称
  alternative: 译为“主宰”或明确补出“基督”
  rationale: 上下文随即点明耶稣弥赛亚；不补出原文没有的名词，可避免过度解释，同时让原句保持凝练。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语。保留原文“爱”的重复以及“肉身／魂”的对称；以分号呈现两个紧密相连的分句。正文脚注标记[a]置于相关译句之后。
