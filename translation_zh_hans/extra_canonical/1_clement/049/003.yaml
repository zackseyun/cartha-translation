  text: Who is sufficient to declare the majesty of his beauty?[a]
translation:
  language: zh_hans
  text: 谁足以尽述其美的宏伟呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宏伟”也可译作“威严”或“伟大”。
    reason: μεγαλεῖον可指宏伟、壮丽、威严或伟大；脚注保留其词义幅度。
lexical_decisions:
- source_word: μεγαλεῖον
  choice: 威严
  rationale: 该词表示伟大、宏伟或威荣；在这句庄重的修辞问句中，“威严”既保留崇高语气，也与后面的“荣美”自然搭配。
- source_word: καλλονῆς
  choice: 荣美
  rationale: 该词意为美丽、美好或华美；“荣美”兼顾外在美感与本句崇高、赞颂性的语域。
- source_word: ἀρκετὸς ἐξειπεῖν
  choice: 足以尽述
  rationale: ἀρκετός表达“足够、能够胜任”，ἐξειπεῖν表示充分说出或宣述；“足以尽述”自然传达无人能够完全言明的修辞力度。
- source_word: αὐτοῦ
  choice: 他
  rationale: 原文为阳性单数属格代词，直译为“他的”，不擅自改换其语法性别或明确其所指。
theological_decisions:
- issue: 阳性代词αὐτοῦ的所指
  choice: 保留为“他”
  alternative: 按上下文将所指解释为某一抽象对象，或改译为“它”
  rationale: 本节单句本身没有明说先行词；保留原文阳性形式，可避免在译文中加入未经本句明确的神学解释。
translation_notes:
  register: 采用庄重而自然的现代书面汉语。“谁足以……呢”保留希腊文修辞问句，“尽述”体现充分表达而非仅仅提及。
