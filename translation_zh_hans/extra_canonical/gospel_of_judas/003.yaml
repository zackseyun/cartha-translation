  text: 'The next morning, he appeared to his disciples. [And] they said to him, “Master, where did [you] go, and what did you do when you left us?”


    Jesus said to them, “I went to another great and holy generation.”


    His disciples said to him, “Lord, what great generation is better and holier than we are, that is not in these realms?”


    When Jesus heard this, he laughed. He said to them, “Why are you wondering in your hearts about the strong and holy generation? Truly I say to you, no one born [of] this realm will see that [generation]. No army of angels from the stars will rule over it, and no mortal-born person will be able to join it, because that generation does not come from […] that has become […] the generation of the people among [them] is from the generation of the great people […] the powerful authorities who […] nor the powers […] those by which you rule.”


    When his disciples heard these things, each of them was troubled in their spirit. They could not say anything.'
translation:
  language: zh_hans
  text: '第二天早晨，他向门徒显现。[于是]他们问他：“老师，你离开我们以后去了哪里？做了什么？”


    耶稣对他们说：“我去了另一个伟大而圣洁的族类[a]那里。”


    他的门徒问他：“主啊，有哪个伟大的族类比我们更好、更圣洁，却不在这些界域之中呢？”


    耶稣听见这话，就笑了。他对他们说：“你们为什么心里猜想那强大而圣洁的族类呢？我实在告诉你们，凡从这个界域[出生]的人，都看不见[那个族类]；来自群星的天使大军不能统治它；凡由必死之人生的人，也不能加入它。因为那个族类并非出自……已经成为……在[他们]中间之人的族类，出自伟大之人的族类……那些强大的掌权者，他们……也不是那些权势……就是你们借以统治的那些。”[b]


    门徒听见这些话，各人心里都很不安，一句话也说不出来。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族类”也可译作“世代”。这里似乎着重指具有共同来源或身份的一群，而不只是某一年代的人。
    reason: 保留 generation 的语义歧义。
  - marker: b
    text: 本句多处残缺；省略号表示抄本缺文，方括号表示据残存文字补出的内容。残缺部分的句法和各短语之间的关系不能确定。本译文暂据所提供的公共领域英文见证，尚待科普特语原文复核。
    reason: 明确交代抄本损坏、补字及当前译稿的证据限制。
lexical_decisions:
- source_word: generation
  choice: 族类
  rationale: 上下文所指并非单纯时间意义上的“世代”，而是一个具有共同来源或身份的群体；“族类”既保留群体与出身含义，也避免把它解释成普通年代。
- source_word: realms
  choice: 界域
  rationale: 采用较宽泛的空间—宇宙论用语，不预先判定这些领域的具体层级或性质。
- source_word: strong
  choice: 强大
  rationale: 保留该族类具有力量的直陈含义，不擅自改释为道德上的“刚强”。
- source_word: mortal birth / mortal-born person
  choice: 由必死之人生的人
  rationale: 保留“出生”与“必死者”两层意思，同时不把原文可能涉及的宇宙论人类分类具体化。
- source_word: powers / authorities
  choice: 权势／掌权者
  rationale: 保留见证译文中两个相近但有区别的权力称谓；因底本残缺，不将其统一为单一阶层。
theological_decisions:
- issue: “另一个伟大而圣洁的族类”的性质
  choice: 按原文直接称为“族类”，不说明其是天上群体、得救者或某一特定教义群体
  alternative: 解释为“天上的世代”或“蒙拣选的人”
  rationale: 现有见证并未在本段明确界定该群体，且科普特语原文复核尚待进行，应保留其神学张力。
- issue: “没有……会统治它／能够加入它”的关系
  choice: 分别保留统治与加入的陈述
  alternative: 将两者整合解释为该族类完全超越受造秩序
  rationale: 避免把叙事陈述扩展成系统化宇宙论结论。
- issue: 耶稣发笑的含义
  choice: 仅译“就笑了”
  alternative: 解释为讥讽、怜悯或启示性的笑
  rationale: 文本没有明确说明笑的情感或神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“老师”对应门徒的直接称呼，“主啊”保留随后称谓的变化。为忠实呈现残卷状态，正文保留方括号和省略号；残缺长句不作神学性补全。
