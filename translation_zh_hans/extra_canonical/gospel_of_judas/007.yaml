    issue: “在我名里[他们所领受的]洗礼”语序生硬，且方括号与“奉我的名”的关系不清。
    rationale: 英文见证的残缺/补复位置本有不确定性；中文应在不补足缺文的前提下，以可读语序保留这一关联。
  - severity: medium
    issue: “你最后的……和……[诸宝座]”漏译“of the realm”。
    rationale: 英文见证明确在“thrones”后保留“of the realm”；漏去会缩窄并损失宇宙论指涉。
  - severity: low
    issue: 云中声音未保留“[ . . . the]”中的冠词所对应的残缺/补复信息。
    rationale: 应以“[…那]”等方式保留该处残缺后接定指成分的状态，避免无依据地抹平。
  - severity: low
    issue: “客房”在此上下文不够自然。
    rationale: “guest room”可保守译作“客室”，既不进一步认定地点性质，也较适合祷告场景。
  revised_text: '耶稣说：“我实在告诉[你]，这[他们奉我的名所领受的]洗礼……将毁灭属地的亚当整个世代。明天，他们将折磨那承载着我的人。我实在[告诉]你，必没有凡人的手[落]在我身上。我实在[告诉]你，犹大，那些向萨克拉献祭的人……一切邪恶之事。但你所做的将超过他们所有人，因为你将献祭那承载着我的人。你的角已经高举，你的怒气已经燃起，你的星已经升起，你的心也已经[偏离]。我实在[告诉你]，你的最后……以及那……[诸境界的宝座]已经[被击败]，众王已经衰弱，天使的众世代已经悲伤，他们[所撒播]的邪恶……被毁灭，[那统治者]也被除灭。[然后]，亚当伟大世代的[果实]将被高举，因为在天、地和众天使之前，那个来自诸境界的世代就已存在。看，一切都已经告诉你了。抬起眼睛，看看那朵云：里面有光，周围有众星。那颗在前面引路的星，就是你的星。”


