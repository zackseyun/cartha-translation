  source_fidelity: 草稿总体保留了英文见证的重复、宇宙论措辞、代词张力及残缺标记；但“最后……和……[诸宝座]”遗漏了“of the realm”的指涉，云中声音也未完整保留“the”的残缺/补复位置。另有数处为求通顺而使残缺句的呈现不够一致。直接科普特文校勘尚待完成，以下仅据所给英文见证作保守修订。
  naturalness: 正文整体庄重、可读。“在我名里”不合现代汉语惯用表达；“客房祷告”易使地点显得像卧室，改为“客室”较自然。对“bear me”采用“承载着我的那人”，在保留刻意区分的同时较符合汉语。
  terminology: 保留“世代”“萨克拉”“角”“诸境界”等既定、非教义化处理。“经学家”可保留。对“the one/human who bears me”统一为“承载着我的那人”，避免将其释作肉身或耶稣本人。
  issues:
