lexical_decisions:
- source_word: the one who bears me / the human who bears me
  choice: 那承载我的人
  rationale: 保留“bear”在肉身承载、携带或代表方面的开放性，不直接释为“我的身体”，以免消解本文的神学张力。
- source_word: generation
  choice: 世代
  rationale: 该词在此既可能指族类、群体或代际，也具有本文宇宙论色彩；“世代”可较形式地维持重复及歧义。
- source_word: Saklas
  choice: 萨克拉
  rationale: 按专名音译，不把该宇宙论人物等同于其他传统中的命名或加以解释。
- source_word: horn
  choice: 角
  rationale: 保留原见证的象征意象，不擅自改译为“权势”或“力量”。
- source_word: realms
  choice: 诸境界
  rationale: 避免过度具体化为天界、永世或领域；“诸境界”保持宇宙论指涉的宽度。
- source_word: guest room
  choice: 客房
  rationale: 依所提供见证作直接而自然的翻译，不推定为圣殿内室或其他特定地点。
- source_word: scribes
  choice: 经学家
  rationale: 用现代读者容易理解的称谓，表达从事宗教经文与律法工作的人员，避免“文士”可能产生的一般文学职业联想。
- source_word: handed him over
  choice: 把耶稣交给了他们
  rationale: 中文补明代词所指以避免歧义；“交给”保留移交、出卖或背叛的叙事含义，不把解释写进正文。
theological_decisions:
- issue: “献祭那承载我的人”与耶稣、肉身之间的关系
  choice: 保留“承载我的人”的表达
  alternative: 译为“献上我的肉身”或“杀死我”
  rationale: 见证文本有意区分说话者与“承载”他的那个人；不以某一基督论体系消除这种区别。
- issue: “必没有凡人的手落在我身上”与随后被交出的张力
  choice: 逐句保留，不作调和性增补
  alternative: 解释为凡人只能触及肉身、不能触及真正的耶稣
  rationale: 原文的张力应由读者看见，译文不替文本完成教义解释。
- issue: 犹大之星及其升高是否表示赞许
  choice: 保持陈述性的“你的星”与“被高举”语言
  alternative: 明确译成犹大得救、得荣耀或受审判
  rationale: 段落同时含高举、怒气、偏离与献祭等复杂信号，不宜单向判定。
- issue: “伟大世代的果实”及其先存性
  choice: 保留宇宙论措辞
  alternative: 把“世代”解释为教会、选民或特定属灵族类
  rationale: 本文没有在这处充分界定其身份，译文不导入宗派性认同。
