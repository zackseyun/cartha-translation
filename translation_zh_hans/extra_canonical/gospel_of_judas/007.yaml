translation:
  language: zh_hans
  text: '耶稣说：“我实在告诉[你]，这在我名里[他们所领受的]洗礼……将毁灭属地的亚当整个世代。明天，他们将折磨那承载我的人。我实在[告诉]你，必没有凡人的手[落]在我身上。我实在[告诉]你，犹大，那些向萨克拉献祭的人……一切邪恶的事。但你所做的将超过他们所有人，因为你将献祭那承载我的人。你的角已经高举，你的怒气已经燃起，你的星已经升起，你的心也已经[偏离]。我实在[告诉你]，你最后的……和……[诸宝座]已经[被击败]，众王已经衰弱，天使的众世代已经悲伤，他们[所撒播]的邪恶……被毁灭，[那统治者]也被除灭。[然后]，亚当伟大世代的[果实]将被高举，因为在天、地和众天使出现以前，来自诸境界的那个世代就已存在。看，一切都已经告诉你了。抬起眼睛，看看那朵云：里面有光，周围有众星。那颗在前面引路的星，就是你的星。”


    于是犹大抬头，看见那朵发光的云，便进入云中。站在地上的人听见有声音从云中传来，说：“……伟大的[世代……]和……。”此后，犹大再也看不见耶稣了。


    随即，[犹太人]中起了一场骚动，比……更甚。他们的祭司长抱怨，因为他进了客房祷告。但有些经学家在那里严密监视，想趁他祷告时逮捕他；因为他们惧怕民众，民众都把他看作先知。


    他们走到犹大跟前，对他说：“你在这里做什么？你不是耶稣的门徒吗？”


    他便照他们的心意回答了。随后，犹大收下一些钱，把耶稣交给了他们。


    《犹大福音》[a]'
