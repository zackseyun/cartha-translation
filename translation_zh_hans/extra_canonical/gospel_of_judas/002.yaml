  text: 'One day Jesus was with his disciples in Judea. He found them sitting together, practicing their piety. When he [came up to] his disciples sitting together and praying over the bread, [he] laughed.


    The disciples said to him, “Master, why are you laughing at [our] prayer? What have we done? [This] is what is right.”


    He answered them, “I’m not laughing at you. You aren’t doing this because you want to, but because through this your God [will be] praised.”


    They said, “Master, you […] are the Son of our God!”


    Jesus said to them, “How do [you] know me? Truly [I] say to you, no generation of the people among you will know me.”


    When his disciples heard this, [they] began to grow angry and furious, and they began to curse him in their hearts.


    But when Jesus noticed their ignorance, [he said] to them, “Why are you letting your anger trouble you? Has your God within you and [his stars] become angry with your souls? If any of you is [strong enough] among humans to bring out the perfect Humanity, stand up and face me.”


    They all said, “We’re strong enough.” But their spirits weren’t brave enough to stand before [him]—except for Judas Iscariot. He was able to stand before him, but he couldn’t look him in the eye, so he looked away.


    Judas [said] to him, “I know who you are and where you’ve come from. You’ve come from the immortal realm of Barbelo, and I’m not worthy to utter the name of the one who’s sent you.”


    Then Jesus, knowing that he was thinking about what is exalted, said to him, “Come away from the others, and I’ll tell you the mysteries of the kingdom. Not so that you’ll go there, but you’ll grieve much because someone else will replace you to complete the twelve [elements] before their God.”


    Judas said to him, “When will you tell me these things, and when will the great day of light dawn for the generation […]?”


    But when he said these things, Jesus left him.'
translation:
  language: zh_hans
  text: '有一天，耶稣和门徒在犹太。他看见他们围坐在一起，操练虔敬。当他[走近]那些围坐着、为饼祷告的门徒时，[他]笑了。


    门徒对他说：“老师，你为什么嘲笑[我们的]祷告？我们做了什么？[这样做]才是对的。”


    他回答他们说：“我不是在笑你们。你们这样做，并不是出于自己的意愿，而是因为你们的神会借此[受到]赞美。”


    他们说：“老师，你……是我们神的儿子！”


    耶稣对他们说：“你们怎么会认识我？我实在告诉你们：你们中间之人的任何一个世代，都不会认识我。”[a]


    门徒听见这话，[就]开始恼怒，怒火中烧，并在心里咒骂他。


    耶稣看出他们的无知，[就对]他们说：“为什么任凭怒气搅扰你们？你们里面的神和[他的众星]，难道向你们的灵魂发怒了吗？你们当中若有人在人类中[足够刚强]，能使那完美的人性显现出来，[b]就站起来面对我。”


    他们都说：“我们足够刚强。”可是，他们的灵却没有勇气站在[他]面前——只有加略人犹大例外。他能够站在他面前，却不敢直视他的眼睛，于是把脸转开。


    犹大[对]他说：“我知道你是谁，也知道你从哪里来。你来自芭贝罗的不朽领域，[c]我不配说出那差你来者的名。”


    耶稣知道他正在思索崇高之事，就对他说：“离开其他人，到我这里来；我要把国度的奥秘告诉你。并不是说你会到那里去；相反，你会深感悲痛，因为会有另一个人取代你，在他们的神面前补足十二个[要素]。[d]”


    犹大对他说：“你什么时候会把这些事告诉我？那世代的光明大日又会在什么时候破晓……？”


    他说完这些话以后，耶稣就离开了他。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世代”也可理解为“人群”或“族类”；本句的修饰关系在现有见证中并不完全明确。
    reason: 保留 generation 与 “of the people among you” 的语义和句法歧义。
  - marker: b
    text: “那完美的人性”也可译作“那完美之人”或“完美的人类”；这里可能是本文特有的技术性表达。
    reason: 避免在尚未完成科普特语复核时过早确定其人类学或宇宙论含义。
  - marker: c
    text: “芭贝罗”是本文宇宙论中的专名；这里不以其他神学体系中的称号替换。
    reason: 帮助普通读者识别音译专名，同时避免导入宗派解释。
  - marker: d
    text: “要素”来自残缺处的补译；原处究竟指人、数目还是宇宙论成分，尚不确定。
    reason: 明确方括号补译的暂定性质。
lexical_decisions:
- source_word: practicing their piety
  choice: 操练虔敬
  rationale: 保留宗教实践的含义，不把它具体化为某一种礼仪或贬义的“装虔诚”。
- source_word: praying over the bread
  choice: 为饼祷告
  rationale: 保留介词关系的宽泛性，不擅自译成祝谢、祝圣或圣餐。
- source_word: Master
  choice: 老师
  rationale: 此处称谓可指教师或尊长；“老师”自然且不额外赋予宗派性头衔。
- source_word: perfect Humanity
  choice: 那完美的人性
  rationale: 大写形式可能具有技术性宇宙论含义；正文采用可读译法，同时以脚注保留“完美之人”等可能。
- source_word: Barbelo
  choice: 芭贝罗
  rationale: 按专名音译，不用解释性称号代替。
- source_word: realm
  choice: 领域
  rationale: 避免把相关宇宙论空间过度具体化为地点、天界或国度。
- source_word: generation
  choice: 世代
  rationale: 保留该词可指世代、人群或特定族类的歧义，不统一改成“族类”。
- source_word: elements
  choice: 要素
  rationale: 方括号表明补译不确定；选择中性词，不擅自认定为门徒、数目或星体。
theological_decisions:
- issue: “your God”与“our God”的指称
  choice: 分别译为“你们的神”和“我们的神”
  alternative: 统一译成“神”或“上帝”
  rationale: 原见证反复使用物主限定，可能承载文本内部的神学张力，不应淡化。
- issue: 耶稣的笑
  choice: 首处译“笑了”，门徒问话中译“嘲笑”
  alternative: 两处都译“笑”
  rationale: 叙述只陈述发笑，门徒的话则把它理解为针对祷告的嘲笑；这样保留叙述与人物理解之间的差别。
- issue: “the Son of our God”
  choice: 我们神的儿子
  alternative: 我们神的圣子
  rationale: 避免引入后期教义术语，同时忠实保留文本中的关系表达。
- issue: “your God within you and [his stars]”的句法
  choice: 你们里面的神和[他的众星]
  alternative: 你们的神在你们里面，并且[他的众星]……
  rationale: 现有英文见证句法本身含混；采用最直接的并列结构，不强行解决“在你们里面”修饰范围。
- issue: 犹大是否进入国度
  choice: 并不是说你会到那里去；相反，你会深感悲痛
  alternative: 你虽不能到那里，却会十分忧伤
  rationale: 保留原文突兀的否定和转折，不扩展为关于犹大最终命运的系统性结论。
- issue: “补足十二”所指
  choice: 补足十二个[要素]
  alternative: 补足十二门徒的数目
  rationale: 方括号显示补译且上下文可能具有宇宙论意义，故不把它确定为使徒名额。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留所有方括号与省略号，以反映抄本残损或补复；不把“饼”“国度”“世代”“十二”等词按后期教会传统提前解释。由于科普特语原文复核尚待完成，本稿是依据所给公共领域英文见证制作的来源敏感型暂定译稿。
