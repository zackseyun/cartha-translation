    [耶稣]回答说：“犹大，你的星把你引入了迷途。”又说：“凡由必死之人所生的，都不配进入你所看见的房屋，因为那地方是为圣洁的人保留的。在那里，太阳、月亮和白昼都不能掌权；圣洁的人却要永远与圣天使一同站立在那领域中。看，我已经把国度的奥秘告诉你，也教导了你群星的谬误，以及……被差遣到[高处]、在十二个领域之上。”[d]


    犹大说：“老师，我的种子并不辖制那些执政者，对吗？”[e]


    耶稣回答他说：“来，让我[告诉]你[有关那圣洁的一代。不是说你会到那里去]；你看见那国度和其中的整整一代人时，反而会极其悲伤。”


    犹大听见这话，就对他说：“你把我从那一代人中分别出来，这对我有什么好处呢？”


    耶稣回答说：“你将成为第十三个，并被其他各代人咒诅，却要辖制他们。末后的日子，他们将……到你这里，而你不会上升到那圣洁的一代。”[f]'
