review_pass:
  verdict: revise
  source_fidelity: 本稿总体忠实保留了英语见证中的方括号补文、缺文省略号、宇宙论术语及其不确定性，也没有将犹大的角色作教义化解释。但数处超出了见证可支持的表达：首段把残缺句重组为两个明确的“为了浇灌”目的句；“高山”弱化了 exalted；“十三号魔灵”将序数称谓现代化为编号；并且“被差到高处、管辖十二个领域”在缺文处加入了“管辖”，而英语见证只保留“sent [on high] over the twelve realms”的残损表达。
  naturalness: 中文整体庄重、可读，段落和引语清楚。修订使残缺首段的断裂更透明，避免“它来，不是为了……”造成不必要的顺畅句法；并将“重大异象”改为更自然的“宏大的异象”。其余保留必要的文献性生硬之处，以如实反映残卷。
  terminology: “灵／灵魂”“执政者／权能”“领域”“星”“圣洁的一代”等主要术语的区分适当。“第十三个魔鬼”比“十三号魔灵”更贴近 witness 的 thirteenth demon，也避免“号”所带的现代编号语感；“种子”保留在正文，以免预先限定为生物后裔。
  issues:
  - severity: high
    issue: 首段残损语句被补成明确的双重目的结构。
    rationale: “它来，不是为了[浇灌……井]，也不是为了浇灌这个领域中[果树……]”将 witness 中断裂的“it didn’t come to [water … the well] of the tree of [the fruit …] of this realm”重整并添加“也不是为了浇灌”。应保留其残损、关系未明的形态。
  - severity: medium
    issue: “高山”未充分表达 exalted mountain。
    rationale: “高山”主要指物理海拔；“崇高的山”较能保留 exalted 的尊崇／高举意味，而不将其解释为特定神圣地点。
  - severity: medium
    issue: “十三号魔灵”不够忠实且语体偏现代。
    rationale: thirteenth 是序数身份称谓，并非编号；“第十三个魔鬼”更直接对应见证。“魔鬼”的古代宗教语境不必弱化为“魔灵”。
  - severity: high
    issue: “管辖十二个领域”无见证依据。
    rationale: 英语见证在此为“and […] sent [on high] over the twelve realms”，主语、动词及其与“十二个领域”的关系均受缺文影响；“管辖”是额外释义，必须删去。
  - severity: low
    issue: “整整一代人”添加了强调。
    rationale: all its generation 可译为“其中所有那一代人”；“整整”不是见证所明示。
  revised_text: '耶稣[说]了这些话，就离开了，[带着]加略人犹大同行。他对他说：“崇高的山上的水[来自]……；它没有来到[浇灌……那井]，那树的[果实……]，属于这个领域……过了一段时间……；却来到浇灌上帝的乐园和那长存的[果实]，因为[它]不会败坏那一代人的[生活方式]，反而会[存留]直到永永远远。”[a]


    犹大对[他说：“请告诉]我，那一代人有什么样的果实？”


    耶稣说：“人类各代的灵魂都必死亡；然而，当这些人在国度中满了期限，灵离开他们时，他们的身体会死，灵魂却会活着，并被接上去。”


    犹大说：“其余各代人会怎样呢？”


    耶稣说：“人不可能在[磐石]上撒种，又收获它的果实。同样，人也[不可能在][污秽的]族类上撒种，连同会朽坏的智慧[以及]那造出必死之人的手，使他们的灵魂得以上升到上面的领域。[我实在]告诉你，[没有执政者]、天使[或]权能能够看见[这伟大]而圣洁的一代[将要看见的地方]。”[b]耶稣说完这话，就离开了。


    犹大说：“老师，你既听了他们众人，现在也请听我说，因为我看见了一个宏大的异象。”


    耶稣听见这话，就笑了，对他说：“你为什么这样激动，你这第十三个魔鬼？不过，说吧，我会容忍你。”[c]


    犹大对他说：“在异象中，我看见了自己。十二个门徒用石头打我，并[急速]追赶我。我也来到[我曾跟随]你的地方。我看见[那里有一座房屋]，我的眼睛无法[测量]它有多大。有尊贵的人环绕着它，那房屋有一个青翠的屋顶。房屋中央有[一群人……]。老师，请接我进去，让我和这些人在一起！”


    [耶稣]回答说：“犹大，你的星把你引入了迷途。”又说：“凡生于必死者的人，都不配进入你所看见的房屋，因为那地方是为圣洁的人保留的。在那里，太阳、月亮和白昼都不能掌权；圣洁的人却要永远与圣天使一同站立在那领域中。看，我已经把国度的奥秘告诉你，也教导了你群星的谬误，以及……被差到[高处]，在十二个领域之上。”[d]


    犹大说：“老师，我的种子并不辖制那些执政者，是吗？”[e]


    耶稣回答他说：“来，让我[告诉]你[有关那圣洁的一代。不是说你会到那里去]；但你看见那国度和其中所有那一代人时，会极其悲伤。”


    犹大听见这话，就对他说：“你把我从那一代人中分别出来，这对我有什么好处呢？”


    耶稣回答说：“你将成为第十三个，并被其他各代人咒诅，却要辖制他们。末后的日子，他们将……到你这里，而你不会上升到那圣洁的一代那里。”[f]'
