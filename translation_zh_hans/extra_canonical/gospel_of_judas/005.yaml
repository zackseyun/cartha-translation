  text: 'When Jesus [said] these things, he left, [taking] Judas Iscariot with him. He said to him, “The water on the exalted mountain is [from] […] it didn’t come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […], but it came to water God’s paradise and the enduring [fruit], because [it] will not corrupt that generation’s [way of life], but [it will exist] for all eternity.”


    Judas said to [him, “Tell] me, what kind of fruit does this generation have?”


    Jesus said, “The souls of every human generation will die. However, when these people have completed their time in the kingdom and the spirit leaves them, their bodies will die, but their souls will live and will be taken up.”


    Judas said, “What will the rest of the human generations do?”


    Jesus said, “It is not possible to sow on [rock] and harvest its fruit. In the same way, it is [not possible to sow on] the [defiled] race, together with perishable wisdom [and] the hand that created mortal humans so that their souls may ascend to the realms above. [Truly] I say to you, [no ruler], angel, [or] power will be able to see the [places] that [this great], holy generation [will see].” When Jesus said this, he left.


    Judas said, “Master, just as you have listened to all of them, now listen to me too, because I have seen a great vision.”


    But Jesus laughed when he heard this. He said to him, “Why are you so agitated, you thirteenth demon? But speak, and I will bear with you.”


    Judas said to him, “In the vision, I saw myself. The twelve disciples were stoning me and chasing [me rapidly]. I also came to the place where [I had followed] you. I saw [a house in this place], and my eyes could not [measure] its size. Great people surrounded it, and that house had a roof of greenery. In the middle of the house was [a crowd …]. Master, take me in with these people!”


    [Jesus] answered and said, “Your star has led you astray, Judas,” and, “No person of mortal birth is worthy to enter the house you have seen, because that place is reserved for those who are holy. Neither the sun nor the moon will rule there, nor the day, but those who are holy will always stand in the realm with the holy angels. Look, I have told you the mysteries of the kingdom, and I have taught you about the error of the stars and […] sent [on high] over the twelve realms.”


    Judas said, “Master, surely my seed does not dominate the rulers, does it?”


    Jesus answered and said to him, “Come, let me [tell] you [about the holy generation. Not so that you’ll go there], but you will grieve greatly when you see the kingdom and all its generation.”


    When Judas heard this, he said to him, “What good has it done me that you have separated me from that generation?”


    Jesus answered and said, “You will become the thirteenth, and you will be cursed by the other generations and will rule over them. In the last days they will […] to you, and you will not ascend to the holy generation.”'
translation:
  language: zh_hans
  text: '耶稣[说]完这些话，就离开了，[带着]加略人犹大同行。他对犹大说：“高山上的水[来自]……它来，不是为了[浇灌……井]，也不是为了浇灌这个领域中[果树……]，过了一段时间……；它来却是为了浇灌上帝的乐园和那长存的[果实]，因为[它]不会败坏那一代人的[生活方式]，而会[存留]直到永永远远。”[a]


    犹大对[他说：“请告诉]我，那一代人结出什么样的果实？”


    耶稣说：“人类各代的灵魂都必死亡。然而，这些人满了他们在国度中的期限，灵离开他们时，他们的身体会死，灵魂却会活着，并被接上去。”


    犹大说：“其余各代人会怎样呢？”


    耶稣说：“人不可能在[磐石]上撒种，又收获它的果实。同样，人也[不可能在][污秽的]族类上撒种；还有那会朽坏的智慧，[以及]造出必死之人的手，使他们的灵魂得以上升到上面的领域。[我实在]告诉你，[没有执政者]、天使[或]权能能够看见[这伟大]而圣洁的一代[将要看见的地方]。”[b]耶稣说完这话，就离开了。


    犹大说：“老师，你既听了他们所有人的话，现在也请听我说，因为我看见了一个重大的异象。”


    耶稣听见这话，却笑了，对他说：“你为什么这样激动，十三号魔灵？不过，说吧，我会容忍你。”[c]


    犹大对他说：“在异象中，我看见了自己。十二个门徒用石头打我，并[急速]追赶我。我也来到[我曾跟随]你的地方。我看见[那里有一座房屋]，我的眼睛无法[测量]它有多大。有尊贵的人环绕着它，那房屋有一个青翠的屋顶。房屋中央有[一群人……]。老师，请接我进去，让我和这些人在一起！”


    [耶稣]回答说：“犹大，你的星把你引入了迷途。凡由必死之人所生的，都不配进入你所看见的房屋，因为那地方是为圣洁的人保留的。在那里，太阳、月亮和白昼都不能掌权；圣洁的人却要永远与圣天使一同站立在那领域中。看，我已经把国度的奥秘告诉你，也教导了你群星的谬误，以及……被差到[高处]、管辖十二个领域。”[d]


    犹大说：“老师，我的后裔总不至于辖制那些执政者吧？”[e]


    耶稣回答他说：“来，让我[告诉]你[有关那圣洁的一代。不是说你会到那里去]；你看见那国度和其中的整整一代人时，反而会极其悲伤。”


    犹大听见这话，就对他说：“你把我从那一代人中分别出来，这对我有什么好处呢？”


    耶稣回答说：“你将成为第十三个，并被其他各代人咒诅，却要辖制他们。末后的日子，他们将……到你这里，而你不会上升到那圣洁的一代那里。”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段残缺严重。方括号表示残卷中补出的文字，省略号表示缺文；各短语之间的确切关系并不确定。
    reason: 提醒读者首段不能当作完整连续的句法来解读。
  - marker: b
    text: “族类”“智慧”“手”之间的句法关系因缺文而不清楚；“执政者”和“权能”在这里可能指宇宙性的灵界势力。
    reason: 保留残损句法与古代宇宙论术语的开放性。
  - marker: c
    text: “十三号魔灵”也可译作“第十三个魔鬼”；这称呼的确切含义，以及耶稣发笑的态度，文本没有说明。
    reason: 避免把嘲讽、认可或秘密身份等解释写入正文。
  - marker: d
    text: “尊贵的人”直译可作“伟大的人”。本句末尾有缺文，“被差到高处、管辖十二个领域”的主语和结构并不确定。
    reason: 说明词义及残损语法的不确定性。
  - marker: e
    text: “后裔”原意也可表达“种子”；问句可能期待否定回答，但其语气仍需结合残损上下文判断。
    reason: 保存 seed 的群体、后代和象征含义。
  - marker: f
    text: “他们将……到你这里”中间缺文，因此无法确定他们在末后日子将对犹大做什么。
    reason: 防止根据神学推测补足关键动作。
lexical_decisions:
- source_word: generation / race
  choice: 一代人／族类
  rationale: 按语境分别处理：指历代或特定群体时译“一代人”，在“defiled race”处译“族类”；避免一律译作“世代”而造成现代读者误解。
- source_word: spirit / soul
  choice: 灵／灵魂
  rationale: 保留见证文本对 spirit 与 soul 的区分，不将二者合并。
- source_word: realm(s)
  choice: 领域
  rationale: 用较中性的宇宙空间术语，避免擅自具体化为“天界”或其他体系。
- source_word: ruler(s)
  choice: 执政者
  rationale: 保留其可能指超人间宇宙权势的技术性含义，同时不在正文中替其身份作定论。
- source_word: power
  choice: 权能
  rationale: 与“执政者、天使”并列时保留位格化宇宙势力的可能性。
- source_word: demon
  choice: 魔灵
  rationale: 比现代口语“恶魔”更能保留古代灵体称谓的语感，也不额外解释其性质。
- source_word: seed
  choice: 后裔
  rationale: 在“我的 seed”处取群体或后代意义，但以脚注说明“种子／后裔”的歧义。
- source_word: star
  choice: 星
  rationale: 直译其宇宙论意象，不解释为命运、天使或个人本质。
- source_word: be taken up / ascend
  choice: 被接上去／上升
  rationale: 分别保留被动与主动措辞，以免抹平原见证文本的表达差别。
- source_word: great people
  choice: 尊贵的人
  rationale: “great”可能指伟大、显贵或重要；正文采用自然而不夸张的“尊贵”，脚注提示不确定性。
theological_decisions:
- issue: 身体、灵与灵魂的关系
  choice: 保留“灵离开—身体死亡—灵魂存活并被接上去”的逐项表述
  alternative: 把“灵”和“灵魂”统一译为同一词
  rationale: 文本本身显出三者之间的张力；译文不以某一后期神学体系加以调和。
- issue: 圣洁的一代与犹大的归属
  choice: 明确保留耶稣所说犹大不会到那里去
  alternative: 把犹大理解为获特别拣选、最终进入圣洁群体
  rationale: 现有见证文本在此直接否定犹大上升到圣洁的一代，不应因对全书的某种解释而弱化。
- issue: “将辖制他们”的对象与性质
  choice: 按现有句法译作犹大将辖制其他各代人
  alternative: 释为胜过他们、审判他们或成为其首领
  rationale: 原始科普特语复核尚未完成，现有英语见证的含义仍具张力，故不具体解释统治方式。
- issue: 群星的谬误
  choice: 直译为“群星的谬误”
  alternative: 解释为占星术、星辰统治或宿命论的错误
  rationale: 正文不导入特定诺斯替宇宙论重构。
- issue: 创造必死之人的“手”
  choice: 保留“手”的隐喻和句法断裂
  alternative: 直接认定为某位创造者或造物主
  rationale: 残损上下文不足以安全确定所指；译文应保留神学上的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。因科普特语原文复核尚待完成，本稿以所给公共领域英语见证为暂定依据；完整保留方括号和省略号所标示的补文与残缺，不以顺畅为由擅自填补。对“灵／灵魂”“一代人／族类”“执政者／权能”等术语保持区分，并尽量保留原有的宇宙论张力。
