  yaml_path: translation/extra_canonical/gospel_of_judas/001.yaml
  text: 'This is the secret message of judgment Jesus spoke with Judas Iscariot over a period of eight days, three days before he celebrated Passover.


    When he appeared on earth, he did signs and great wonders for the salvation of humanity. Some [walked] in the way of righteousness, but others walked in their transgression, so the twelve disciples were called. He started to tell them about the mysteries beyond the world and what would happen at the end. Often he didn''t reveal himself to his disciples, but you''d find him in their midst as a child.'
translation:
  language: zh_hans
  text: '这是耶稣在八天之中与加略人犹大谈论的隐秘审判信息；当时距他庆祝逾越节还有三天。[a]


    他显现在世上时，为拯救人类施行了神迹和大奇事。有些人行在正义之道上，另一些人却行在自己的过犯中，因此十二门徒蒙了召。[b] 他开始向他们讲述超越世界的奥秘，以及末后将要发生的事。他常常不向门徒显露自己，但人们会发现他像个孩子一样在他们中间。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文暂据所提供的公版英文见证起草；科普特文原文复核尚待完成。“隐秘审判信息”也可理解为“关于审判的隐秘信息”。
    reason: 说明底本限制，并保留标题短语的语法歧义。
  - marker: b
    text: “行”据见证文本方括号中的补足；方括号表示抄本残缺处的复原或不确定文字。
    reason: 如实标明文本复原状态。
  - marker: c
    text: “像个孩子一样”原意不够明确，可能涉及外在形象、显现方式或比喻；正文不作定论。
    reason: 保留古代文本中的真实歧义，避免神学性增补。
lexical_decisions:
- source_word: secret message of judgment
  choice: 隐秘审判信息
  rationale: 保留“secret”“message”“judgment”三个语义成分，不把“审判”预先解释为判决、论述或启示。
- source_word: spoke with
  choice: 与……谈论
  rationale: 表达双方会谈的语境，同时避免将其窄化为单向宣告。
- source_word: celebrated Passover
  choice: 庆祝逾越节
  rationale: 对应所给见证文本的措辞；不擅自改成“吃逾越节筵席”等更具体表达。
- source_word: appeared on earth
  choice: 显现在世上
  rationale: 保留“显现”的表现性含义，不将其简化为“来到世上”。
- source_word: signs and great wonders
  choice: 神迹和大奇事
  rationale: 采用现代中文宗教文献中通顺而庄重的固定表达。
- source_word: salvation of humanity
  choice: 拯救人类
  rationale: 自然表达目的关系，并保留普遍指向。
- source_word: mysteries beyond the world
  choice: 超越世界的奥秘
  rationale: 保留空间或境界上的开放含义，避免具体化为“天上的奥秘”。
- source_word: at the end
  choice: 末后
  rationale: 以简洁庄重的中文保留终末含义，不明确补入“世界末日”。
- source_word: as a child
  choice: 像个孩子一样
  rationale: 保留明喻及其不寻常意象，不解释其形貌或象征意义。
theological_decisions:
- issue: “judgment”与隐秘信息的关系
  choice: 隐秘审判信息
  alternative: 关于审判的隐秘信息
  rationale: 原见证文本的修饰关系可能有压缩和歧义；正文采用紧凑表达，不断言这是“审判性的信息”还是“有关审判的信息”。
- issue: 十二门徒蒙召的因果关系
  choice: 保留“因此”
  alternative: 弱化为“于是”或删去连接词
  rationale: 所给见证明确使用“so”；虽然逻辑关系并不完全清楚，仍应保留而不替作者消解张力。
- issue: 耶稣“不显露自己”
  choice: 不向门徒显露自己
  alternative: 不以本来面貌向门徒显现
  rationale: 不补入“本来面貌”等解释，保留显现方式或身份隐藏方面的歧义。
- issue: 像孩子一样出现在门徒中间
  choice: 按字面保留明喻
  alternative: 解释为以孩子形象显现或具有孩童般特质
  rationale: 见证文本不足以判定这是外形变化、异象还是象征描写。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“蒙了召”“末后”等词保留宗教文本语域，但避免过度古雅。由于科普特文复核尚待完成，本稿为基于指定公版英文见证的暂定译文；所有复原和关键歧义均以脚注标明。
