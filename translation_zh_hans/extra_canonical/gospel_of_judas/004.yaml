review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实保留了英语见证的段落、说话者、方括号补复及省略号所示残缺，也谨慎处理了众星、天使、世代等难解宇宙论语言。但个别译法引入了不必要的解释或现代宗派职分色彩：将“finish everything”译作“使一切达到终局”过度强化终末含义；“执事”容易被理解为特定教会职分；“present”译为“献上”比见证更明确地加入祭献动作；末段“我奉差遣，不是到”不合汉语句法。
  naturalness: 整体庄重、现代且可读。建议把“彼此谦卑”调整为较自然的“彼此自卑”，把“一个烤饼的人”改为“一个面包师”，并重写末段差遣句。残缺处仍应维持方括号和省略号，避免用流畅化掩盖文本的不完整。
  terminology: “老师”对应 Master 恰当；“神”与“主”保持区分亦可取。将 minister 统一译为“服事者”能保留宽泛职役意义，避免“执事”的宗派化联想。generations、stars、incorruptible 分别译为“世代”“众星”“不朽坏的”，可保留原见证的术语连贯性与歧义。
  issues:
  - severity: medium
    issue: “他们就是使一切达到终局的众星”
    rationale: 英语 witness 的“the stars that finish everything”可指完成一切，未必指使万物进入终局；“达到终局”增加了末世论解释。宜译为“完成一切的众星”，并保留脚注说明。
  - severity: medium
    issue: “执事”译 minister
    rationale: “执事”在现代中文中常指较确定的基督教会职分；见证的 minister 身份未定。译为“服事者”较能保留其泛指性。
  - severity: medium
    issue: “另一个人会献上……”译 present
    rationale: “present”本身可只是带来、呈上；此处虽处于献祭语境，仍不宜在该动词上额外确定为祭献。改为“带来”较稳妥。
  - severity: low
    issue: “我奉差遣，不是到……”
    rationale: 汉语搭配不完整，且未清楚表达“I was not sent to … but to …”的对比。应改为“我不是被差到……，而是被差到……”。
  - severity: low
    issue: “一个烤饼的人”
    rationale: 不符合现代汉语通常表达；“面包师”自然且不改变 baker 的职业含义。
  revised_text: '另一天，耶稣来到他们那里。他们对他说：“老师，我们在梦中看见了你，因为我们[昨夜做了很不寻常的梦]。”[a]


    耶稣却说：“你们为什么……把自己藏起来？”


    他们[说：“我们看见]一座宏伟的[殿宇，里面有一座宏伟的]祭坛，还有十二个人——我们认为他们是祭司——以及一个名字。一大群人正在祭坛旁等候，[直到]祭司[收完]供物。我们也一直等着。”


    [耶稣说：]“他们是什么样的？”


    他们说：“[有些人]禁食[两个]星期；另一些人献上自己的儿女为祭；还有人献上自己的妻子，同时彼此赞美，又彼此自卑。另一些人与男人同寝；另一些人杀人；还有一些人犯下许多罪，做出不法之事。[而且]站在祭坛[前]的人竟呼求你的[名]！他们献祭时，用自己的供物把[祭坛]堆满。”他们说完这些，[就]沉默了，因为心里不安。


    耶稣对他们说：“你们为什么不安？我实在告诉你们，站在那祭坛前的所有祭司都呼求我的名。[我再]告诉你们：人类各代已经把我的名写在众星各代的这座[殿宇]上。[他们]以我的名无耻地栽种了不结果子的树。”


    耶稣又对他们说：“你们就是在所见祭坛上收取供物的人。那就是你们所侍奉的神；你们就是所见的十二个人。你们看见被牵来献祭的牲畜，就是你们在那祭坛前引入迷途的群众。[你们的服事者][b]将站起来，以这种方式利用我的名；[那些]虔诚人的世代将忠于他。在他之后，另一个人会带来[淫乱的人]，另一个带来杀害儿女的人，另一个带来与男人同寝的人，以及禁食的人，并其余一切污秽、罪行和谬误。那些说‘我们与天使同等’的人——他们就是完成一切的众星。[c]有人对人类各代说：‘看哪，神已经从祭司手中收纳了你们的祭物。’即谬误的服事者。但发号施令的主，是统管万有的主。到了末日，他们必被判为有罪。”


    耶稣[对他们]说：“不要再[献牲畜为祭]。你们已经把[它们献在]祭坛之上，献在你们的星和天使之上；它们在那里已经完成了。[d]所以，要让它们与你们一同成为……，也要让它们[变得]清楚。”


    他的门徒[对他说]：“求你洁净我们，使我们脱离因天使的欺骗而犯下的[罪]。”


    耶稣对他们说：“这是不可能的……泉源也[不能]扑灭整个有人居住之世的烈火；一口[城里的]井也不能满足所有世代，只有那伟大而坚定的一位可以。[e]一盏灯不能照亮所有领域，只有第二个世代可以；一个面包师也不能喂饱[天]下所有受造之物。”


    [门徒听见]这些[话]，就对[他]说：“老师，求你帮助我们，救我们！”


    耶稣对他们说：“不要再与我争斗。你们每个人都有自己的星；[而……]众星中的……将……属于它的……。我不是被差到那会朽坏的世代，而是被差到那刚强、不朽坏的世代，因为没有任何仇敌统治[过]那个世代，众星中也没有一个统治过它。我实在告诉你们，火柱很快就会坠落，而那个世代不会被众星动摇。”'
