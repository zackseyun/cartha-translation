translation:
  language: zh_hans
  text: '另一天，耶稣来到他们那里。他们对他说：“老师，我们在梦中看见了你，因为昨夜我们做了很不寻常的[梦]。”[a]


    耶稣却说：“你们为什么……把自己藏起来？”


    他们[说：“我们看见]一座宏伟的[殿宇，里面有一座宏伟的]祭坛，还有十二个人——我们认为他们是祭司——以及一个名字。一大群人正在祭坛旁等候，[直到]祭司[收完]供物。我们也一直等着。”


    [耶稣说：]“他们是什么样的？”


    他们说：“[有些人]禁食[两个]星期；另一些人献上自己的儿女为祭；还有人献上自己的妻子，同时彼此赞美，又彼此谦卑。另一些人与男人同寝；另一些人杀人；还有一些人犯下许多罪，做出不法之事。[而且]站在祭坛[前]的人竟呼求你的[名]！他们献祭时，用自己的供物把[祭坛]堆满。”他们说完这些，[就]沉默了，因为心里不安。


    耶稣对他们说：“你们为什么不安？我实在告诉你们，站在那祭坛前的所有祭司都呼求我的名。[我再]告诉你们：人类各代已经把我的名写在众星各代的这座[殿宇]上。[他们]以我的名无耻地栽种了不结果子的树。”


    耶稣又对他们说：“你们就是在所见祭坛上收取供物的人。那就是你们所侍奉的神；你们就是所见的十二个人。你们看见被牵来献祭的牲畜，就是你们在那祭坛前引入迷途的群众。[你们的执事][b]将站起来，以这种方式利用我的名；[那些]虔诚人的世代将忠于他。在他之后，另一个人会献上[淫乱的人]，另一个献上杀害儿女的人，另一个献上与男人同寝的人，以及禁食的人，并其余一切污秽、罪行和谬误。那些说‘我们与天使同等’的人——他们就是使一切达到终局的众星。[c]有人对人类各代说：‘看哪，神已经从祭司手中收纳了你们的祭物。’这祭司就是谬误的执事。但发号施令的主，是统管万有的主。到了末日，他们必被判为有罪。”


    耶稣[对他们]说：“不要再[献牲畜为祭]。你们已经把[它们献在]祭坛之上，在你们的星和天使之上；它们在那里已经完成了。[d]所以，要让它们与你们一同成为……，也要让它们[变得]清楚。”


    他的门徒[对他说]：“求你洁净我们，使我们脱离因天使的欺骗而犯下的[罪]。”


    耶稣对他们说：“这是不可能的……泉源也[不能]扑灭整个有人居住之世的烈火；一口[城里的]井也不能满足所有世代，只有那伟大而坚定的一位可以。[e]一盏灯不能照亮所有领域，只有第二个世代可以；一个烤饼的人也不能喂饱[天]下所有受造之物。”


    [门徒听见]这些[话]，就对[他]说：“老师，求你帮助我们，救我们！”


    耶稣对他们说：“不要再与我争斗。你们每个人都有自己的星；[而……]众星中的……将……属于它的……。我奉差遣，不是到那会朽坏的世代，而是到那刚强、不朽坏的世代，因为没有任何仇敌统治[过]那个世代，众星中也没有一个统治过它。我实在告诉你们，火柱很快就会坠落，而那个世代不会被众星动摇。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号表示手稿残缺处的补复；省略号表示文字缺失或无法复原。本段直接科普特语复核尚待完成。
    reason: 明确文本状态及本稿证据层级，避免读者把补复文字视为完整保存的原文。
  - marker: b
    text: “执事”所译词也可泛指侍从、服事者或主持礼仪的人；此处具体身份不确定。
    reason: 保存职役称谓的词义范围，避免宗派化。
  - marker: c
    text: “使一切达到终局”也可能理解为“完成一切”；其确切含义及“众星”所指均不清楚。
    reason: 保留关键宇宙论句子的真实歧义。
  - marker: d
    text: 这一句多处残缺。“在……之上”和“已经完成”的语法关系并不确定。
    reason: 提醒读者该句不能据现有见证作过度确定的解释。
  - marker: e
    text: “那伟大而坚定的一位”可能承接“井”，也可能指另一实体或群体；现有见证不足以确定。
    reason: 公开指涉歧义，不在正文中静默解决。
lexical_decisions:
- source_word: Master
  choice: 老师
  rationale: 按所给见证译出对教导者的称呼，采用自然现代汉语；避免用“主”而与后文统管万有的“主”混同。
- source_word: great
  choice: 很不寻常的／宏伟的
  rationale: 同一英语词依语境分别处理：修饰梦时表达其非凡程度，修饰殿宇和祭坛时表达规模宏大；首处因底本残缺保留一定开放性。
- source_word: house
  choice: 殿宇
  rationale: 上下文出现祭坛、祭司和供物，宗教建筑义明显；“殿宇”比一般的“房屋”更合语境，但仍以方括号标明补复。
- source_word: minister
  choice: 执事
  rationale: 保留宗教职役色彩及其身份歧义，不具体化为某一宗派职分；后文“谬误的执事”与前文对应。
- source_word: generations
  choice: 世代／各代
  rationale: 保留作品反复使用的宇宙论与群体称谓，不擅自释为“族类”“种族”或“时代”。
- source_word: realms
  choice: 领域
  rationale: 保持空间或宇宙层级的含混，不具体化为“世界”“天界”或某种诺斯替宇宙结构。
- source_word: incorruptible
  choice: 不朽坏的
  rationale: 与“会朽坏的”形成明确对照，同时保留肉身、道德或宇宙论层面的多重可能。
- source_word: stars
  choice: 众星
  rationale: 直译其反复出现的宇宙论术语，不将其解释为命运、天体统治者或天使。
theological_decisions:
- issue: “That’s the God you serve”中God的指涉与评价
  choice: “那就是你们所侍奉的神”
  alternative: “那就是你们所服侍的上帝”或解释为“假神”
  rationale: 保留原见证尖锐而含混的指控，不以“假神”等解释性用语预先裁定其神学含义；用“神”也避免自动等同后文“统管万有的主”。
- issue: 众星、天使与各世代之间的宇宙论关系
  choice: 按表层称谓直译，不加体系化解释
  alternative: 将众星明确解释为天使、执政者或命运力量
  rationale: 现有材料仅为英语公共领域见证，科普特语复核尚待完成；不应导入特定诺斯替体系。
- issue: “the great, stable one”所指为何
  choice: “那伟大而坚定的一位”
  alternative: “那伟大而稳固的井／泉”或“那伟大坚定的世代”
  rationale: 语法指涉在见证中不明，采用人格化但不指名的表达，并用脚注提示歧义，不把它认定为基督、某一世代或宇宙实体。
- issue: “the second generation”
  choice: “第二个世代”
  alternative: “第二代”或解释成某一已命名的属灵族类
  rationale: 保留序数与“世代”这一全文术语的对应，不补入现有见证未提供的身份。
- issue: 献祭批判的对象
  choice: 维持耶稣对门徒、祭司和祭坛献祭的直接批判
  alternative: 将其泛化为仅批判异教献祭，或具体化为对某一历史教会礼仪的攻击
  rationale: 文本自身形成强烈反讽和指控，但没有足够证据支持宗派化或历史化限定。
- issue: “我奉差遣……到……世代”中使命对象
  choice: “不是到……而是到……”
  alternative: “不是为……而是为……”或“并非由……差遣”
  rationale: 依英语见证保留方向／对象关系，避免把使命目的或差遣来源说得比底本更明确。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。对献祭、罪行和性行为的描述保持直接，不以委婉语削弱文本冲击力，也不添加评注。所有方括号和省略号尽量对应见证中的残缺与补复信号；因直接科普特语审校尚待进行，本稿为基于公共领域英语见证并参考英语POB审计层的暂定出版草案。
