    耶稣又对他们说：“你们就是在所见祭坛上收取供物的人。那就是你们所侍奉的神；你们就是所见的十二个人。你们看见被牵来献祭的牲畜，就是你们在那祭坛前引入迷途的群众。[你们的执事][b]将站起来，以这种方式使用我的名；[那些]敬虔者的各世代将忠于他。在他之后，另一个人会献上[淫乱的人]，另一个献上杀害儿女的人，另一个献上与男人同寝的人，以及禁食的人，并其余一切污秽、罪行和谬误。那些说‘我们与天使同等’的人——他们就是使一切达到终局的众星。[c]有人对人类各代说：‘看哪，神已经从祭司手中收纳了你们的祭物。’也就是谬误的执事。但发号施令的主，是统管万有的主。到了末日，他们必被判为有罪。”


    耶稣[对他们]说：“不要再[献牲畜为祭]。你们已经把[它们献在]祭坛之上，在你们的众星和天使之上；它们已经在那里完成了。[d]所以，要让它们与你们一同成为……，也要让它们[变得]清楚。”


    他的门徒[对他说]：“求你洁净我们，使我们脱离因天使的欺骗而犯下的[罪]。”


    耶稣对他们说：“这是不可能的……泉源也[不能]扑灭整个有人居住之世的烈火；一口[城里的]井也不能满足所有世代，只有那伟大而坚定的一位可以。[e]一盏灯不能照亮所有领域，只有第二个世代可以；一个面包师也不能喂饱在[天]之下所有受造之物。”


    [门徒听见]这些[话]，就对[他]说：“老师，求你帮助我们，救我们！”


    耶稣对他们说：“不要再与我争斗。你们每个人都有自己的星；[而……]众星中的……将……属于它的……。我奉差遣，不是到那会朽坏的世代，而是到那刚强、不朽坏的世代，因为没有任何仇敌统治[过]那个世代，众星中也没有一个统治过它。我实在告诉你们，火柱很快就会坠落，而那个世代不会被众星动摇。”'
