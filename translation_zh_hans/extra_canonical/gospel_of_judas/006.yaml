translation:
  language: zh_hans
  text: '耶稣说：“[来吧]，我要把[无人能]看见的奥秘教给你。因为有一个伟大无边的领域，任何一代天使都未曾见过它的边际；[其中]有一位[伟大]而不可见的灵，任何[天使的]眼睛都未曾见过他，任何心灵都未曾领悟他，他也从未被任何名字称呼。[a]


    “那里出现了一朵发光的云。他（那灵）说：‘要有一位天使出现，侍立在我面前。’于是，一位伟大的天使——自生者、光明之神——从云中出现。因着他，又有四位天使从另一朵云中出现，侍立在天使自生者面前。[自生者]说：‘要有[一个领域]出现。’它便[照他所说的]出现了。他[造了]第一个发光体来统治它。他又说：‘要有众天使出现，服侍[它。’于是，无数万千的天使]出现了。他又说：‘[要有一个]光明的领域出现。’它便出现了。他造了第二个发光体来统治它，又造了无数万千的天使供职。其余的光明领域，他也是这样创造的。他立下统治者管理它们，并为它们造了无数万千的天使前来协助。


    “阿达玛斯在第一朵光明的云中；在所有被称为‘神’的当中，没有任何天使能看见那朵云。[阿达玛斯在]那里[生了塞特，是照着……的]形像，也照着[这位]天使的样式。他使塞特不朽的[族类]向十二个兼具两性的[发光体显现。随后]，他又照着那灵的旨意，使七十二个发光体在不朽的族类中显现。接着，这七十二个发光体也照着那灵的旨意，使三百六十个发光体在不朽的族类中显现，使每一个都有五个。十二个发光体的十二个领域构成它们的父；每个领域有六重天，因此，七十二个发光体共有七十二重天；每一个发光体又有[五层]穹苍，[总共]三百六十[层穹苍]。[它们]得了权柄，并有一支[庞大]而数目无尽的天使军队来尊崇、服侍它们；还有童贞之灵，也来尊崇和[服侍]所有领域、诸天及其穹苍。


    “这些不死者的群体，被父、七十二个发光体、自生者和他的七十二个领域称为‘科斯莫斯’——也就是‘必朽坏者’。[b]最初的人连同他不朽坏的能力，就在那里出现。在与他的族类一同显现的领域中，有知识之云，以及一位名叫[埃勒勒特……]的天使。此后，[埃勒勒特]说：‘要有十二位天使出现，[来]统治混沌和[阴间]。’看哪，云中出现了一位[天使]；他的脸闪耀着[火光]，他的形貌被血[玷污]。他名叫内布罗，意思是‘反叛者’；另有人称他为雅尔达巴沃特。另一位天使萨克拉斯也从云中出来。于是内布罗造了六位天使，萨克拉斯[也照样造了六位]，作他们的助手。他们在诸天中产生了十二位天使，每一位都在诸天中分得一份。


    “十二位统治者对十二位天使说：‘你们各自要[…]，让他们[…]族类[…五]位天使：


    “第一位[是雅奥特]，称为‘良善者’；


    “第二位是哈尔玛托特，[火之眼]；


    “[第三位]是加利拉；


    “第四位[是]约贝尔；


    “第五位是阿多奈奥斯。


    “这五位统治阴间，在混沌之上居首。


    “随后，萨克拉斯对他的天使说：‘我们要按着样式和形像造一个人。’他们便塑造了亚当和他的妻子夏娃；夏娃在云中被称为‘生命’。因为历代族类都以这个名字寻求他，而每个族类又用自己的名字称呼她。[c]萨克拉斯没有[吩咐……]生育，只有[…]在各族类中[…]这个[…]；那位[天使]对他说：‘你和你的儿女，生命都只有有限的时日。’”


    犹大问耶稣：“人能活[多久]？”


    耶稣说：“亚当和他的族类在他与其统治者一同领受国度的地方，寿命都是有限的；你为什么对此惊讶呢？”


    犹大问耶稣：“人的灵会死吗？”


    耶稣说：“事情是这样的：神吩咐米迦勒把灵借给人，使他们可以服役。后来，那伟大者吩咐加百列把灵赐给那没有君王的伟大族类——灵连同魂一起赐下。因此，[其余]的魂[…]光明[…那]混沌[…]寻求你们里面的[那]灵；你们使这灵从天使的世代而来，活在这肉身之中。[d]随后，神使知识临到亚当和与他同在的人，免得混沌和阴间的众王统治他们。”


    [于是]犹大问耶稣：“那么，那些族类将会做什么？”


    耶稣说：“我实在告诉你，这一切都由众星成全。萨克拉斯为自己所定的期限满了以后，他们的第一颗星将和那些族类一同出现，他们也会完成已经说过的事。随后，他们会奉我的名淫乱，杀害自己的儿女，并且[他们会……]邪恶和[…]诸领域，把各族类带来，献给萨克拉斯。[此]后，[…]会从[…]带来[以色列]十二支派；所有[族类]都会服侍萨克拉斯，奉我的名犯罪。你的星将[统治]第十三个领域。”于是耶稣[笑了]。


    [犹大]说：“老师，你为什么[笑我呢？”


    耶稣]回答[说]：“我不是笑[你，而是]笑众星的谬误，因为这六颗星与这五个战士一同走入歧途；它们和它们所造的一切都将被毁灭。”


    犹大又问耶稣：“那些奉你的名受洗的人将会怎样？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本稿依据所提供的公共领域英文见证起草；科普特语原文复核尚待进行。方括号表示抄本残缺处的补入或不确定复原，省略号表示文字缺失。
    reason: 交代文本基础及残损符号的编辑意义。
  - marker: b
    text: “科斯莫斯”音译自见证中的 cosmos；本句随即把它解释为“必朽坏者”。通常该词也可意为“宇宙”或“世界”。
    reason: 保留专门称号与文内词义解释之间的张力。
  - marker: c
    text: “历代族类都以这个名字寻求他”中的“他”，与随后指夏娃的“她”并不一致；译文依见证保留这一不确定性。
    reason: 提示代词异常，避免读者误以为译者疏漏。
  - marker: d
    text: 这一句抄本残缺严重，“其余的魂”“光明”“混沌”以及后半句之间的句法关系并不确定。
    reason: 防止对高度残损的灵、魂与肉身关系作过度确定的神学解读。
lexical_decisions:
- source_word: realm
  choice: 领域
  rationale: 原见证反复使用 realm 指宇宙论中的层级空间；“领域”较“国度”中性，可避免把各层世界一律理解为政治王国。
- source_word: Self-Begotten
  choice: 自生者
  rationale: 保留该称号“由自身而生”的技术性含义，不改写为带特定教义色彩的称谓。
- source_word: luminary
  choice: 发光体
  rationale: 使用涵盖天界光体与人格化存在的中性词，避免径直等同于现代天文学的恒星；文本另有 stars，译作“众星”。
- source_word: generation
  choice: 族类／世代
  rationale: 涉及塞特及人群身份时译“族类”；明确指连续时代或天使世代时译“世代”，按语境保留原词的语义宽度。
- source_word: incorruptible
  choice: 不朽坏的
  rationale: 兼顾“不腐败、不毁坏”的宇宙论意义，并与后文“必朽坏者”形成对照。
- source_word: Chaos
  choice: 混沌
