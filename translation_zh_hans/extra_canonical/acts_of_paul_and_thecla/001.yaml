    1:4 有一个人名叫阿尼色弗，听说保罗已经来到以哥念，便赶紧出去迎接他。他带着妻子莱克特拉和两个儿子西米亚、芝诺，要请保罗到家里去。


    1:5 原来，提多曾向他们描述过保罗的相貌。他们当时还没有见过保罗本人，只知道他的为人。


    1:6 他们沿着通往路司得的王道[a]前行，站在那里等候保罗，把每一个过路人的相貌同提多所作的描述比较。


    1:7 后来，他们看见一个人走来，正是保罗。他身材矮小，头秃了——或是剃过了头[b]；双腿弯曲，腿却秀美；眼窝深陷，鼻子弯曲。他满有恩典：有时显为人形，有时却有天使的面容。保罗看见阿尼色弗，就很欢喜。


    1:8 阿尼色弗说：“蒙福之上帝的仆人，愿你平安！”保罗回答：“愿上帝的恩典与你和你全家同在。”


    1:9 底马和黑摩其尼却心生嫉妒，装出十分虔诚的样子。底马说：“难道我们不也是蒙福之上帝的仆人吗？你为什么不向我们问安？”


    1:10 阿尼色弗回答：“因为我没有在你们身上看见公义的果子。不过，你们若是这样的人，也同样欢迎到我家来。”


    1:11 于是，保罗进了阿尼色弗的家，全家因此大大欢喜。他们专心祷告、擘饼，并听保罗宣讲上帝的话，论到节制[c]和复活。他这样说：


    1:12 “心里纯洁的人有福了，因为他们必看见上帝。


    1:13 保守肉身不受玷污的人有福了，因为他们必成为上帝的殿。


    1:14 有节制的人[d]有福了，因为上帝必向他们显现。


    1:15 舍弃世俗享乐的人有福了，因为他们必蒙上帝悦纳。


    1:16 有妻子却像没有妻子的人有福了，因为他们必成为上帝的天使。


    1:17 因上帝的话而战兢的人有福了，因为他们必得安慰。


    1:18 持守洗礼纯洁的人有福了，因为他们必在父、子、圣灵那里得平安[e]。


    1:19 追求耶稣基督的智慧[f]的人有福了，因为他们必称为至高者的儿子。


    1:20 遵守耶稣基督教导的人有福了，因为他们必住在永恒的光中。


    1:21 因爱基督而舍弃世上荣华的人有福了，因为他们必审判天使，坐在基督的右边，并且不受末后审判的苦楚。


    1:22 童贞之人的身体和灵魂有福了，因为他们蒙上帝悦纳，也不会失去童贞的赏赐。他们的父（天上的父）的话，必在他儿子的日子对他们的得救发生功效[g]；他们也必永远安息。”'
