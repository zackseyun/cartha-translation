translation:
  language: zh_hans
  text: '《保罗与特克拉行传》第二章


    2:1 保罗在阿尼色弗家中的教会里讲道时，有一位名叫特克拉的童女——她母亲名叫特奥克利娅，已经许配给一个名叫塔米里斯的人——坐在自家的一扇窗前。


    2:2 她从那里，借着保罗所在那所房子的窗户，昼夜聆听保罗的讲论，内容关乎上帝、爱、对基督的信，以及祷告。


    2:3 她不肯离开窗前，直到自己满怀极大的喜乐，折服于信仰的教导。


    2:4 后来，她看见许多妇女和童女进去见保罗，就热切盼望自己也能配得站在他面前，聆听基督的话；因为她还没有见过保罗本人，只听过他的讲论，仅此而已。


    2:5 无论怎样劝说，她都不肯离开窗前，她母亲便派人去叫塔米里斯来。塔米里斯满心欢喜地来了，以为现在就能娶她，于是问特奥克利娅：“我的特克拉在哪里？”


    2:6 特奥克利娅回答说：“塔米里斯，我有一件非常奇怪的事要告诉你。特克拉已经整整三天不肯离开窗前，甚至不吃不喝，只顾专心聆听某个外乡人巧妙而迷惑人的言论。塔米里斯，我实在诧异：她向来是个端庄的年轻女子，竟会任由自己被他说服。


    2:7 “那个人搅扰了整个以哥念城，也搅扰了你的特克拉。所有妇女和年轻男子都成群结队地到他那里领受他的教导。他除了讲论其他事情，还告诉他们：只有一位上帝，唯独他当受敬拜；我们也应当持守贞洁。[a]


    2:8 “可是，我女儿特克拉仿佛一张黏在窗上的蜘蛛网，被保罗的言论牢牢吸引，以惊人的热切和极大的喜悦侧耳聆听。这个年轻女子就这样因听他的话而受了迷惑。现在你去同她说话吧，因为她已经许配给你了。”


    2:9 塔米里斯便走过去，先向她问安，又小心不惊动她，说：“特克拉，我的未婚妻，你为什么这样愁闷地坐着？你究竟受了什么奇怪的影响？转过来看看塔米里斯，也该害羞吧。”[b]


    2:10 她母亲也同样对她说：“孩子，你为什么这样愁闷地坐着，像是惊呆了，一句话也不回答？”


    2:11 于是他们都痛哭起来：塔米里斯哭自己失去了未婚妻，特奥克利娅哭自己失去了女儿，婢女们哭自己失去了女主人；全家一片哀恸。


    2:12 然而，这一切丝毫不能打动特克拉，甚至不能使她转过身来理会他们；她仍专注于保罗的讲论。


    2:13 于是塔米里斯跑到街上，察看那些进到保罗那里又从他那里出来的人。他看见两个人正在激烈争辩，就问他们：


    2:14 “先生们，你们在这里做什么？里面那个与你们一伙的人是谁？他迷惑众人——无论年轻男子还是童女——的心，劝他们不要结婚，只要保持现状。


    2:15 “你们若把他的实情告诉我，我保证给你们一大笔钱；因为我是这城里的首要人物。”


    2:16 底马和黑摩其尼回答说：“我们无法确切告诉你他是什么人；但有一件事我们知道：他教导说，‘除非你们持守贞洁，不玷污自己的肉身，将来就不能复活。’他这样使年轻男子失去他们本要娶的妻子，也使童女失去她们本要嫁的丈夫。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “持守贞洁”也可理解为“过节制、守贞的生活”。此处所依据的英语见证用词为 chastity；希腊语及其他古代版本尚待核校。
    reason: 该词在本篇神学主题中关键，且可能涵盖贞洁、禁欲或不婚等相邻含义。
  - marker: b
    text: “也该害羞吧”所译原句含义不够明朗，可能是在催促特克拉因未婚夫在场而有所反应。古代原文传统仍待复核。
    reason: 避免把带有文化语境且见证含混的命令句解释得过于确定。
  - marker: c
    text: 本节关于复活、贞洁和肉身的话，是底马与黑摩其尼声称保罗所教导的内容；本段本身没有判定他们的转述是否准确。
    reason: 保留人物言论与叙述者立场之间的神学和叙事区别。
lexical_decisions:
- source_word: virgin
  choice: 童女
  rationale: 在叙事与禁欲主题中保留其明确的未婚、守贞含义，同时采用庄重且常见的宗教文体用语。
- source_word: charity
  choice: 爱
  rationale: 此处不宜缩窄为现代汉语的“慈善”；译作“爱”可保留基督教语境中较宽的伦理与神学意义。
- source_word: subdued to the doctrines of faith
  choice: 折服于信仰的教导
  rationale: 保留被教导深深制伏、说服的力度，又避免暗示强迫归信。
- source_word: chastity
  choice: 持守贞洁
  rationale: 兼顾性节制、守贞及本篇禁欲论述的语境，不直接扩大为特定制度性的独身教义。
- source_word: flesh
  choice: 肉身
  rationale: 保留古代宗教论述中身体性的表达，避免现代“肉体”可能附带的纯负面或情欲化色彩。
- source_word: chief person
  choice: 首要人物
  rationale: 原见证不能确定具体官职，故不擅自译成“城主”或某种行政头衔。
- source_word: intended wives / intended husbands
  choice: 本要娶的妻子／本要嫁的丈夫
  rationale: 将英语见证括号所说明的订婚或预定婚配关系自然融入中文，不误称已经成婚。
theological_decisions:
- issue: 独一上帝与贞洁教导的叙事归属
  choice: 保留为特奥克利娅对那外乡人教导的转述
  alternative: 将其直接表述为叙述者认可的教义宣告
  rationale: 说话者带有敌意，文本在此同时呈现她的指控和教导内容；翻译不应消除这一叙事张力。
- issue: 复活是否以守贞为条件
  choice: 明确置于底马和黑摩其尼对保罗教导的引述中
  alternative: 当作作品叙述者直接确立的普遍教义
  rationale: 该命题出自人物言论，其准确性在本段并未由叙述者裁定；保留引号可避免替文本预先解决神学争议。
- issue: “do not defile your flesh”的道德含义
  choice: 不玷污自己的肉身
  alternative: 不可有任何婚姻性关系
  rationale: 后者会把语义限定为一种特定解释；直译保留“玷污”所带的身体与礼仪、伦理张力。
- issue: “word of Christ”
  choice: 基督的话
  alternative: 基督的道
  rationale: “话”自然易懂，也保留既可指信息、教训，又可具有较浓神学意义的开放性。
