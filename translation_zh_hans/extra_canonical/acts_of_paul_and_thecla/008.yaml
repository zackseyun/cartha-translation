  footnotes:
  - marker: a
    text: “亵渎神明”也可译作“渎圣”。这里保留较宽泛的表达，因为直接的希腊语和其他古代译本校勘尚待完成。
    reason: 罪名的准确词形与宗教对象可能取决于源语及异文。
  - marker: b
    text: “被迁到幸福之境”依照现有英文见证的措辞翻译；它没有明确说明具体的死后状态。
    reason: 避免把含混的死后状态解释成某一宗派教义。
  - marker: c
    text: “再次”见于现有英文见证的括号中，其原始文本地位尚待希腊语和古代译本校勘确认。
    reason: 明确标示见证文本自身对该词的不确定处理。
lexical_decisions:
- source_word: chastity
  choice: 贞洁
  rationale: 在叙事语境中指特克拉免受性侵犯、持守身体贞洁；“贞洁”兼具准确性与庄重语体。
- source_word: governor
  choice: 总督
  rationale: 用通行的古代行政官称谓，避免含义过泛的“长官”。
- source_word: amphitheatre
  choice: 竞技场
  rationale: 普通现代读者容易理解，也符合野兽表演与公开刑罚的场景。
- source_word: den
  choice: 兽栏
  rationale: 此处是竞技场内关置猛兽的封闭空间；译作“兽栏”比通常指天然洞穴的“洞穴”更贴合场景。
- source_word: she-lion
  choice: 母狮
  rationale: 保留原见证文本明确表达的雌性信息。
- source_word: Sacrilege
  choice: 亵渎神明
  rationale: 表达对神圣事物的冒犯；鉴于直接希腊语核查尚未完成，不进一步限定为某一种具体宗教罪名。
- source_word: translated
  choice: 被迁到
  rationale: 保留从一种状态转移到另一种状态的意象，不直接释为“得救”或“升天”。
- source_word: royal family
  choice: 王族中人
  rationale: 自然而庄重地表达其与王室的身份关联，不擅自确定具体爵位。
- source_word: criminal
  choice: 罪犯
  rationale: 反映当局和群众对特克拉的司法称呼，并不表示叙述者认可判决。
theological_decisions:
- issue: 为死去的法尔科尼拉祷告及其死后状态
  choice: 直译为“为我祷告，使我可以被迁到幸福之境”
  alternative: 解释为炼狱、升天、得救或进入乐园
  rationale: 文本本身只呈现死者请求代祷和“迁到幸福之境”的愿望；保留其神学张力，不导入后世宗派体系。
- issue: 8:7 对耶稣基督的称呼与句法关系
  choice: “天地的主上帝啊，至高者的儿子耶稣基督”
  alternative: 把“耶稣基督”明确处理为与“主上帝”完全同位的单一呼语
  rationale: 供应见证的标点与句法可有不同理解；当前译法保持呼求中各称号的并置，不额外构造系统神学解释。
- issue: “亵渎神明”的对象
  choice: 使用不特指对象的“亵渎神明”
  alternative: 译为“亵渎上帝”或“渎圣”并指定具体宗教对象
  rationale: 案件处于异教城市司法环境，而源语核查待定；不应擅自把罪名的对象限定为基督教的上帝。
- issue: 特克拉的“贞洁”
  choice: 按身体免受侵犯和贞洁得保全来表达
  alternative: 扩展为终身独身誓愿或特定禁欲教义
  rationale: 本章直接语境强调她免受侵犯，译文不导入更完整的宗派性贞洁观。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文叙事体。对群众呼喊和祷告保留修辞力度，但避免过度文言化。专名暂按英语见证音译为“特克拉、特里菲娜、法尔科尼拉、亚历山大”。由于任务明确说明希腊语源文审查尚待进行，本稿属于依据公共领域英文见证并参考英文POB咨询层形成的暂定出版草案；所有涉及潜在源语歧义之处均从宽处理或以脚注标明。
