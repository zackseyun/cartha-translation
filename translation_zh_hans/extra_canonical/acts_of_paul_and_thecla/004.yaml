  - marker: c
    text: “对敬虔之道的认识”所对应的措辞也可译作“宗教知识”或“对信仰的认识”。
    reason: 英文见证的 religion 语义宽泛，且直接希腊文复核尚未完成。
lexical_decisions:
- source_word: governor
  choice: 总督
  rationale: 沿用见证文本对地方行政审判官的称呼，现代读者易懂，也不把具体官衔解释得过窄。
- source_word: matrimony is unlawful
  choice: 婚姻是不合法的
  rationale: 保留控告者的强烈法律性措辞，不缓和为单纯提倡独身。
- source_word: God of vengeance
  choice: 施行报应的上帝
  rationale: 既保留审判与惩治意味，也避免现代汉语“复仇的上帝”可能暗示出于私怨。
- source_word: creatures
  choice: 他所造的
  rationale: 自然表达受造者之意，同时保留创造者与受造物的关系。
- source_word: knowledge of religion
  choice: 对敬虔之道的认识
  rationale: “宗教知识”在现代汉语中容易仅指一般宗教学知识；此处语境指向对敬神生活或信仰之道的认识。
- source_word: great things of God
  choice: 上帝伟大的事
  rationale: 保留原短语的开放性，不擅自限定为神迹、奥秘或教义。
- source_word: conducted himself courageously
  choice: 勇敢自持
  rationale: 体现面对苦难时坚定勇敢的举止，而非仅描写主观感受。
theological_decisions:
- issue: 4:6“needs nothing except the salvation of his creatures”的逻辑张力
  choice: 他一无所缺，只要他所造的得救
  alternative: 他所需要的，无非是使受造者得救
  rationale: 保留“上帝无所缺乏”与“只要其受造者得救”并列的张力，不把后者改释为神自身有所需要。
- issue: 4:7基督的独特怜悯及世界得救的关系
  choice: 唯有他如此怜悯这受迷惑的世界，使世人不至被定罪
  alternative: 他独自怜悯受迷惑的世界，因此世界必不被定罪
  rationale: 保留目的或结果表达，不将文本强化成普救结论，也不削弱“唯有他”的独特性。
- issue: 4:7 faith 的对象未明说
  choice: 有信心
  alternative: 信靠基督
  rationale: 原见证此处只列举“faith”，未直接说明对象，故不替文本补定。
- issue: 4:12信心增长与亲吻锁链
  choice: 信心就越发增长，甚至亲吻他的锁链
  alternative: 她的信心大增，于是亲吻他的锁链
  rationale: 保留叙事中的因果关联和敬重受苦见证的动作，不赋予锁链本身圣物性质。
translation_notes:
  register: 采用现代、庄重而清楚的叙事和庭审语言。人名按常见圣经音译处理：Demas 为“底马”，Hermogenes 为“黑摩其尼”，Paul 为“保罗”；Thecla 译作“特克拉”，Thamyris 译作“塔米里斯”。由于提供材料明确注明希腊文源语复核尚待进行，本稿以所给公共领域英文见证为临时证据基础，对可能受传本、括号或旧译影响之处以脚注标明，不声称已完成直接原文校勘。
