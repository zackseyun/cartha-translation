review_pass:
  verdict: revise
  source_fidelity: 整体忠实地传达了所给英文见证的叙事、司法与异象内容，且妥善保留了5:7的“律法”、5:12主耶稣以保罗形貌显现，以及5:14十字记号等不宜过度解释之处。5:5的“wallowing”宜明确为在地上辗转翻滚；5:13的“stake”是刑柱（或木桩），不可弱化或替换为“柴堆前”。
  naturalness: 文字总体庄重、通顺，适合现代标准汉语。将“伏在地上”调整为“在地上辗转翻滚”，并将5:8末句改为“学会避开这种行径”，可更贴近原句且避免“学到教训”的额外惩戒性色彩。
  terminology: 人名、地名和核心称谓基本一致：特克拉、塔米里斯、特奥克利娅、保罗、主耶稣、以哥念人、总督、审判席均可保留。“术士”适切；“画了十字记号”及其限定性脚注可保留。“刑柱”比“柴堆前”准确对应stake，且不预断其具体构造。
  issues:
  - severity: medium
    issue: 5:5“lay wallowing on the ground”译为“伏在监牢的地上”
    rationale: “伏着”只表达俯卧，遗漏wallowing所含在地上翻滚、辗转的动作强度。
  - severity: high
    issue: 5:13“brought naked to the stake”译为“赤身被带到柴堆前”
    rationale: stake指执行火刑所用的柱、桩或刑柱；柴堆对应后文wood/straw与pile。译作“柴堆前”既省略刑柱，也改变了她被带到的对象。
  - severity: low
    issue: 5:8“that all women may learn from her to avoid such practices”译为“好让所有女人从她身上学到教训，不再做这样的事”
    rationale: “学到教训”带有原句未明说的惩戒性引申；宜直译为从她身上学会避开这种行径。
