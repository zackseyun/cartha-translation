lexical_decisions:
- source_word: porter / gatekeeper
  choice: 守门人
  rationale: 现代汉语自然明确，也不把其职责过度限定为监狱看守。
- source_word: strange man
  choice: 外乡人
  rationale: 此处主要表示陌生、外来者；“外乡人”比“怪人”更符合语境。
- source_word: governor
  choice: 总督
  rationale: 采用通俗而庄重的行政官称谓；在未完成希腊文核查前，不进一步指定官职。
- source_word: judgment seat
  choice: 审判席
  rationale: 保留司法场景和古代审判意象。
- source_word: magician
  choice: 术士
  rationale: 保留敌对人群对保罗施行法术的指控，同时避免现代舞台“魔术师”的联想。
- source_word: holy works of Christ
  choice: 基督神圣的作为
  rationale: 保留“works”可指行为、事工或功业的宽度，不擅自改成教义或神迹。
- source_word: theater
  choice: 剧场
  rationale: 指古代公共表演及刑罚场所，不采用现代感较强的“电影院”。
- source_word: preserved
  choice: 得以保全
  rationale: 表达从火刑中蒙保守存活，同时不额外添加后世救恩术语。
theological_decisions:
- issue: 主耶稣以保罗形貌显现
  choice: 译作“看见主耶稣显出保罗的形貌”
  alternative: 译作“看见保罗就是主耶稣”
  rationale: 原有见证描述的是形貌相似的异象，并未作身份等同；译文保留叙事张力。
- issue: 火刑中的神圣拯救
  choice: 按叙事直陈上帝怜悯并借地裂、雨和冰雹施救
  alternative: 将事件解释为象征或自然巧合
  rationale: 源文本以神圣介入来叙述事件，翻译不替文本作去神迹化解释。
- issue: 十字记号
  choice: 正文保留“画了十字记号”，并加来源限制脚注
  alternative: 改写为“作了祷告”或指定某种后世礼仪动作
  rationale: 既不删除见证中的基督教手势，也不把后期固定礼仪形式倒置进文本。
- issue: 以哥念人的律法
  choice: 保留“律法”并以脚注注明所指未定
  alternative: 直接解释为强制婚姻的成文法
  rationale: 现有英文见证不足以判定是法律、习俗还是婚约规范，应保存含混性。
translation_notes:
  register: 采用现代标准普通话简体中文，整体庄重而易懂。叙事使用短句推进，法庭与刑罚场景保留古代色彩。鉴于直接希腊文及古代译本审查尚未完成，本稿明确作为依据公共领域英文见证形成的审慎出版草案；对“律法”“十字记号”和异象措辞不作超出见证的确定解释。
