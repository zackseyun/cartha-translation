  register: 采用现代、庄重而易懂的叙事语体。专名按常见中文音译处理：Onesiphorus 作“阿尼色弗”，Thecla 作“特克拉”，Antioch 作“安提阿”，Iconium 作“以哥念”，Thamyris 作“塔米里斯”。鉴于所提供的直接 drafting basis 是公共领域英文见证，且希腊语源文复核尚待完成，本稿为审慎的暂定译文；未设置脚注，因此正文中无脚注标记。
