lexical_decisions:
- source_word: fish (sea-calves)
  choice: 海兽
  rationale: 旧英语见证的双重表述无法确定具体物种；正文采用自然且范围较宽的“海兽”，脚注保留“鱼（海犊）”及可能解释，避免虚假精确。
- source_word: amomus
  choice: 香果
  rationale: 这是古代芳香植物或香料名称，品种有争议；采用可读的传统泛称，并以脚注说明原词及不确定性。
- source_word: girdle / belt
  choice: 腰带／束上腰带
  rationale: 按各处句法分别作名词或动词化处理，保留其束身、装束意义，不额外赋予象征含义。
- source_word: way to eternal salvation
  choice: 通往永恒救恩的道路
  rationale: 保留“道路”意象及救恩的永恒指向，避免改写成抽象教义命题。
