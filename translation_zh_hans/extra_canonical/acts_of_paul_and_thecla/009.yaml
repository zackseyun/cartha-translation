  revised_text: '《保罗与特克拉行传》第九章


    9:1 随后，人们把特克拉从特里菲娜手中带走，剥去她的衣服，给她束上腰带，把她扔进指定与野兽搏斗的场地，又放出狮子和熊来攻击她。


    9:2 可是，其中最凶猛的一头母狮跑到特克拉面前，伏在她脚下。妇女们见状，便高声呼喊。


    9:3 接着，一头母熊凶猛地向她冲来；母狮却迎上去，把母熊撕成碎片。


    9:4 又有一头惯于吃人的雄狮向她奔来；那狮子是亚历山大的。母狮迎战雄狮，结果两头狮子彼此厮杀而死。


    9:5 妇女们越发忧伤，因为那头帮助特克拉的母狮死了。


    9:6 后来，人们又带出许多野兽。特克拉却站在那里，双手伸向天空祷告。祷告完毕，她转过身，看见一个水池，就说：“现在正是我受洗的时候。”


    9:7 于是她纵身跳进水里，说：“我的主耶稣基督啊，我奉你的名，在这最后的日子受洗。”妇女和众人看见了，就喊道：“不要跳进水里！”就连总督也喊了起来，因为想到那些海兽[a]可能会吞噬这样的美貌。


    9:8 尽管如此，特克拉仍奉我们的主耶稣基督的名，纵身跳进水里。


    9:9 那些海兽看见闪电和火，就都死了，尸体浮在水面上。又有一团火云环绕特克拉，使野兽不能靠近她，众人也看不见她赤裸的身体。


    9:10 然而，人们又放出别的野兽来攻击她。妇女们见状，发出极其悲痛的呼声；有些人撒甘松香，有些人撒桂皮，有些人撒香果[b]，还有些人撒香膏。人多，所用的香膏也多。于是，所有野兽都躺了下来，仿佛沉沉睡去，没有伤害特克拉。


    9:11 亚历山大便对总督说：“我有几头极其可怕的公牛。让我们把她绑在牛身上吧。”总督忧心忡忡地回答：“你认为合适，就照着做吧。”


    9:12 于是，他们用一根绳子缠住特克拉的腰和双脚，并用这根绳子把她系在公牛身上。他们把烧红的铁器贴在公牛的生殖器上，好让牛因受尽折磨而更加猛烈地拖拽特克拉，直到把她杀死。


    9:13 公牛随即四处狂奔，发出骇人的吼声；但特克拉周围的火焰烧断了系在牛身上的绳索。她站在场地中央，安然自若，仿佛从未被捆绑过。


    9:14 就在这时，坐在一张长凳上的特里菲娜昏厥过去，死了；全城因此陷入极大的忧虑。


    9:15 亚历山大自己也害怕起来，便恳求总督说：“求你怜悯我和这座城，释放这个与野兽搏斗的女人，免得你、我和全城都遭毁灭。


    9:16 因为凯撒若听说刚才发生的事，必定会立刻毁掉这座城；特里菲娜出身王族，又是他的亲属，如今竟死在自己的座位上。”


    9:17 总督便把特克拉从野兽中间叫到跟前，对她说：“你究竟是谁？你有什么情形，竟没有一头野兽肯伤害你？”


    9:18 特克拉回答：“我是永生上帝的仆人。至于我的情形，我是信奉他儿子耶稣基督的人；上帝喜悦他。因此，没有一头野兽能够伤害我。


    9:19 唯有他是通往永恒救恩的道路，也是永恒生命的根基。他是困苦之人的避难所、受苦之人的扶持，也是绝望之人的盼望和保障。总而言之，凡不信他的人都不能得生，反要承受永远的死亡。”


    9:20 总督听了这些话，就吩咐人把她的衣服拿来，对她说：“穿上你的衣服吧。”


    9:21 特克拉回答：“那位在我赤身置于野兽中间时给我穿上衣服的上帝，愿他在审判之日也给你的灵魂穿上救恩的衣袍。”于是，她接过衣服穿上。总督随即颁令说：“我把上帝的仆人特克拉释放给你们。”


    9:22 妇女们听见这话，便齐声高喊，同心赞美上帝说：“只有一位上帝，就是特克拉的上帝；只有这一位上帝救了特克拉！”


    9:23 她们的声音如此响亮，仿佛震动了全城。特里菲娜自己听见这个喜讯，也再次起来，随着人群跑去迎接特克拉。她抱住特克拉，说：“现在我相信死人必会复活；现在我确信我的女儿还活着。我的女儿特克拉，来跟我回家吧，我要把自己所有的一切都转给你。”[c]


    9:24 特克拉便跟特里菲娜回去，在她那里住了几天，教导她主的道。许多年轻女子因而归信，特里菲娜全家都充满了喜乐。


    9:25 可是，特克拉渴望见到保罗，便四处打听，也派人到各处寻找他。最后，她得知保罗在吕基亚的米拉，就带着许多年轻男女同行。她束上腰带，换穿男装，前往吕基亚的米拉找他。她在那里看见保罗正在宣讲上帝的道，就在人群中站到他身旁。


    [a] 原见证译作“鱼（海犊）”，所指可能是海豹一类海兽；确切动物名称仍待希腊文及其他古代译本校核。


    [b] “香果”对应 amomum，是一种古代芳香植物或香料，确切品种不明；旧见证将其解释为某种甘松香、“耶路撒冷草”或“女士玫瑰”。


    [c] 本章先叙述特里菲娜“死了”（9:14），后又说她“再次起来”。这里保留文本本身的叙事张力，不作调和。'
