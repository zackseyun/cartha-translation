review_pass:
  verdict: revise
  source_fidelity: 整体忠实于所供英文见证，且大体保留了方括号补足、山名异读及洗礼语句的歧义意识。但10:15将“gentlewomen”具体化为“贵族妇女”，并把“with her”的共同修道生活误作“独居”，均超出见证；10:6、10:10亦有轻微动作强化。
  naturalness: 文体庄重、现代且通顺。将“恰当地忍受”调整为更自然的“以合宜的方式忍受”；“叫母亲来”调整为更符合上下文的“叫住母亲”；并避免把到达洞穴译成“走进洞穴”。
  terminology: “光照”“上帝圣言”“殉道者”“污灵”等处理可保留。地名“达菲尼”宜按Daphine/Daphne改作“达芙妮”。“monastic life”宜译为“修道生活”，以避免制度化或独居的过度限定。
  issues:
  - severity: medium
    issue: 10:15“贵族妇女”过度限定gentlewomen。
    rationale: gentlewomen可指有身份、教养或体面的妇女，英文见证并未明确其为贵族。
  - severity: high
    issue: 10:15“独居修道的生活”与“with her”相抵触。
    rationale: 见证明确说许多人“with her”过修道生活；“独居”既添加了文本未明说的生活形态，也与共同生活的叙述不合。
  - severity: low
    issue: 10:6“俯伏”及10:10“走进”略强化原文动作。
    rationale: 原文分别仅说倒在/伏在地上，以及到那洞穴去；无需加入敬拜姿态或进入洞穴的动作。
  - severity: low
    issue: 10:8“叫母亲来”不够贴合上下文。
    rationale: 原文是呼唤或叫住母亲后向她说话，未必表示把母亲从别处叫来。
  - severity: low
    issue: 10:14“恰当地忍受”不合现代汉语习惯。
    rationale: “in a becoming manner”可译为“以合宜的方式忍受”，既保留评价语气也更自然。
