  text: '10:1 But Paul was greatly surprised when he saw her and the people with her, for he thought that some new trial was coming upon them.


    10:2 When Thecla realized this, she said to him, “I have been baptized, O Paul, for he who assists you in preaching has assisted me to baptize.”


    10:3 Then Paul took her and led her to the house of Hermes. Thecla told Paul everything that had happened to her in Antioch, so that Paul was exceedingly amazed, and all who heard were strengthened in the faith and prayed for Trifina’s happiness.


    10:4 Then Thecla arose and said to Paul, “I am going to Iconium.” Paul replied to her, “Go and teach the word of the Lord.”


    10:5 But Trifina had sent large sums of money to Paul, as well as clothing by the hands of Thecla, for the relief of the poor.


    10:6 So Thecla went to Iconium. When she came to the house of Onesiphorus, she fell to the floor where Paul had sat and preached. Mingling her tears with her prayers, she praised and glorified God with these words:


    10:7 “O Lord, the God of this house, in which I was first enlightened by you; O Jesus, Son of the living God, who were my helper before the governor, my helper in the fire, and my helper among the beasts—you alone are God forever and ever. Amen.”


    10:8 On her return, Thecla found Thamyris dead, but her mother still living. So she called her mother and said to her, “Theoclia, my mother, is it possible for you to be brought to believe that there is only one Lord God, who dwells in the heavens? If you desire great riches, God will give them to you through me. If you want your daughter again, here I am.”


    10:9 She presented these and many other things to her mother, [endeavouring] to persuade her [to her opinion]. But her mother, Theoclia, gave no credence to the things spoken by the martyr Thecla.


    10:10 When Thecla realized that she was speaking to no purpose, she marked her whole body with the sign [of the cross], left the house, and went to Daphine. When she arrived there, she went to the cave where she had found Paul with Onesiphorus, fell to the ground, and wept before God.


    10:11 After leaving there, she went to Seleucia and enlightened many in the knowledge of Christ.


    10:12 And a bright cloud guided her on her journey.


    10:13 After she arrived at Seleucia, she went to a place outside the city, about a furlong away, because she was afraid of the inhabitants, since they were worshipers of idols.


    10:14 And she was led [by the cloud] to a mountain called Calamon, or Rodeon. She remained there for many years and endured a great many grievous temptations from the devil. Through the assistance she received from Christ, she bore them in a fitting manner.


    10:15 At last, certain gentlewomen heard about the virgin Thecla and went to her. They were instructed by her in the oracles of God, and many of them abandoned this world and led a monastic life with her.


    10:16 In this way, a good report about Thecla spread everywhere, and she performed several [miraculous] cures. As a result, people from the whole city and the surrounding regions brought their sick to that mountain. Before they came as far as the door of the cave, they were instantly cured of whatever illness they had.


    10:17 The unclean spirits were cast out, making a noise. All received their sick restored to health and glorified God, who had bestowed such power on the virgin Thecla.


    10:18 Consequently, the physicians of Seleucia were no longer held in any regard and lost all the profit from their trade, because no one paid attention to them. At this they were filled with envy and began to devise what measures they might take against this servant of Christ.'
translation:
  language: zh_hans
  text: '10:1 保罗看见特克拉和同她一起的人，十分惊讶，因为他以为又有一场患难要临到他们。


    10:2 特克拉察觉了，就对他说：“保罗啊，我已经受了洗；因为那帮助你传道的，也帮助我施洗。”[a]


    10:3 于是保罗带着她，领她到赫尔墨斯家里。特克拉把自己在安提阿所遭遇的一切都告诉保罗，保罗听了极其惊奇；凡听见的人，信心都得了坚固，并为特里菲娜的福乐祷告。


    10:4 随后特克拉起身，对保罗说：“我要去以哥念。”保罗回答她：“去吧，教导主的道。”


    10:5 特里菲娜曾托特克拉把许多钱和衣物送给保罗，用来救济穷人。


    10:6 特克拉就去了以哥念。她来到阿尼色弗家，便俯伏在保罗曾坐着传道的地上，含泪祷告，用以下的话赞美、荣耀上帝：


    10:7 “主啊，这家的上帝啊，我在这里初次蒙你光照；永活上帝的儿子耶稣啊，你在总督面前帮助我，在火中帮助我，在野兽中也帮助我。唯有你是上帝，直到永永远远。阿们。”


    10:8 特克拉回去后，发现塔米里斯已经死了，母亲却还活着。于是她叫母亲来，对她说：“母亲特奥克利娅，你能相信天上只有一位主上帝吗？你若渴望丰厚的财富，上帝会借着我赐给你；你若想要女儿回来，我就在这里。”


    10:9 她把这些和许多别的话讲给母亲听，想要劝服她；但她母亲特奥克利娅并不相信殉道者特克拉所说的话。[b]


    10:10 特克拉见自己说了也没有用，就在全身画了那记号[c]，离开家，前往达菲尼。到了那里，她走进从前遇见保罗和阿尼色弗的那个洞穴，俯伏在地，在上帝面前哭泣。


    10:11 她离开那里以后，前往塞琉西亚，使许多人受到光照，认识了基督。


    10:12 有一朵明亮的云在路上引导她。


    10:13 她到了塞琉西亚以后，因为害怕当地居民——他们都是敬拜偶像的人——就去了城外约一斯塔迪昂远的地方。[d]


    10:14 她被引到一座名叫卡拉蒙、又名罗德翁的山上。[e] 她在那里住了许多年，经历魔鬼许多严酷的试探；她靠着从基督所得的帮助，恰当地忍受了这一切。


    10:15 后来，有些贵族妇女听说了童贞女特克拉，就到她那里，领受她关于上帝圣言的教导。其中许多人舍弃了世俗生活，与她一同过独居修道的生活。[f]


    10:16 这样，特克拉的美名传遍各处。她施行了多次医治，以致全城和邻近地区的人都把病人带到那座山上；他们还没有走到洞口，无论患什么病，立刻就得了医治。


    10:17 污灵呼喊着被赶出去；众人都接回了已经痊愈的病人，并荣耀上帝，因为他把这样的能力赐给童贞女特克拉。


    10:18 因此，塞琉西亚的医生不再受人重视，也失去了行医所得的一切收入，因为无人再理会他们。他们便满心嫉妒，开始盘算要怎样对付这位基督的仆人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帮助我施洗”也可理解为“帮助我受洗”。现存英文见证在主动与被动含义之间并不完全清楚。
    reason: 保留洗礼施行方式和行动主体的真实歧义。
  - marker: b
    text: 这里称特克拉为“殉道者”，可能是后来的荣誉称号；本段叙事此时并未说她已经死亡。
    reason: 说明称号与叙事时序之间的张力。
  - marker: c
    text: 所据见证在此补作“十字架的记号”；因直接希腊语校勘尚待完成，正文保留较宽泛的“那记号”。
    reason: 标示英文见证中的补足，不把未核实内容确立为原文。
  - marker: d
    text: 一斯塔迪昂是古代长度单位，约合185米；不同地区的实际长度略有差异。
    reason: 帮助普通读者理解古代距离。
  - marker: e
    text: “卡拉蒙”和“罗德翁”是所据见证保留的两个山名，可能反映异文或别名；此处不作统一。
    reason: 保留文本名称异读。
  - marker: f
    text: “独居修道的生活”译自所据英文见证的“monastic life”；此处未必指后来制度完备的修院生活。
    reason: 避免时代错置，同时传达禁欲、离世的生活方式。
lexical_decisions:
- source_word: enlightened
  choice: 蒙你光照／受到光照，认识了基督
  rationale: 保留早期基督教“光照”的宗教意象；10:11略加自然衔接，避免现代读者误解为一般启蒙。
- source_word: oracles of God
  choice: 上帝圣言
  rationale: 表达神圣启示之言，不采用现代汉语中容易令人想到占卜的“神谕”。
- source_word: furlong
  choice: 一斯塔迪昂
  rationale: 底层古代距离单位更可能是 stadion；采用音译并以脚注说明约值，避免以英制单位中转。
- source_word: martyr
  choice: 殉道者
  rationale: 保留见证者／殉道者这一传统称号，即便叙事此处尚未记载她死亡，也不替文本消解张力。
- source_word: sign
  choice: 那记号
  rationale: 正文所据见证以补入语指明十字架；正文避免把补足内容无标记地当作确定原文。
- source_word: monastic life
  choice: 独居修道的生活
  rationale: 传达离世、共同持守禁欲生活的意思，同时避免直接套用较晚期制度化修院术语。
theological_decisions:
- issue: 特克拉受洗的施行者与方式
  choice: “那帮助你传道的，也帮助我施洗”
  alternative: “那与你一同作工传道的，也与我一同作工，使我受洗”
  rationale: 保留见证文本在主动施洗、自我施洗与神助之间的语法张力，不明确指定施行者。
- issue: 耶稣与上帝称谓的关系
  choice: “唯有你是上帝”直接承接对耶稣的呼告
  alternative: 改为对父上帝的呼告
  rationale: 原见证的呼格和指代形成明确而富神学张力的表述，不调整措辞以符合某一后期教义解释。
- issue: 特克拉医治的能力来源
  choice: 上帝把能力赐给特克拉
  alternative: 特克拉凭自身能力医治
  rationale: 依照文本将能力明确归源于上帝，同时保留特克拉作为施行医治者的叙事角色。
- issue: “殉道者”称号的时间张力
  choice: 照译为“殉道者特克拉”
  alternative: 弱化为“见证人特克拉”
  rationale: 该词的传统用法可能是荣誉称号；保留见证文本，而不依据故事时序自行校正。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。人名按常见圣经汉译与希腊名音译处理；句式尽量自然，但保留古代叙事的重复、宗教称谓和未解决的神学张力。由于直接希腊语审校尚待完成，本稿明确以所供公共领域英文见证为临时依据，未把方括号中的补足无条件纳入正文。
