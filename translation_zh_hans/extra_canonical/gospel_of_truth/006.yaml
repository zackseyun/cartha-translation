- from: '因为这就是从上面降下的审判；它审判了所有人。它是一把出鞘的双刃剑，两边都能砍切。那在宣讲它的人心里的“道”显现了：它不只是一个声音，而是披上了身体。


    器皿中间起了大骚动：有些是空的，有些盛满了；有些得到供应，有些被倒空；有些洁净了，有些破碎了。各个境域都震动不安，因为它们既无秩序，也不稳固。


    “谬误”焦虑不安，不知道该做什么；它忧伤、哀号，又伤害自己，因为它一无所知。那毁灭它的“认识”临近了它，也临近了从它而出的一切；因为“谬误”是空虚的，里面什么也没有。


    “真理”来到他们中间，从“真理”而出的一切都认出了它。他们在“真理”中迎接父，带着一种完全的能力；这能力使他们与父连合。“真理”是父的口，圣灵是他的舌。凡与“真理”连合的人，也就与父的口连合，并要借着他的舌领受圣灵。[a]


    这就是父的启示，也是他向自己的世代所作的显现。他显明了自己里面隐藏的事，把它解释清楚；因为除父以外，谁还拥有任何事物呢？[b]'
