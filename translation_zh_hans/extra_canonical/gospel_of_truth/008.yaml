  source_fidelity: 整体准确保留了本段以睡眠和噩梦比喻无知、以光和醒来比喻认识的论述，并恰当没有把“灵”增译为“圣灵”。但若干处需要修订：父是“他们没有看见”的对象，不应写成似乎父本身“未曾被看见”；“那灵追上他们”过度落实为“追上”；以及末段单复数和指称需更贴近原文的刻意张力。
  naturalness: 译文整体庄重、顺畅，排比节奏也适合朗读。个别表达如“那未曾看见的父”“它其余的作为”“已经认识的人所行的”略显生硬或造成不必要歧义；修订后可更自然，同时不减弱原文抽象、修辞性的风格。
  terminology: “影子／幻影”“恐惧”“虚妄的空无”“对父的认识”“那灵”“子”等关键用语基本处理妥当。保留“好”与“有福”的词汇区别是必要的；脚注锚点和内容可保留并略作调整，以说明这一差异。
  issues:
  - severity: medium
    issue: “他们不认识那未曾看见的父”改变了关系从句的施事指向。
    rationale: 原文及英文审计轨迹是“他们不认识父，因为他们没有看见他”，即“他们”没有看见父；中文“未曾看见的父”容易理解为父本身未被任何人看见。
  - severity: medium
    issue: “那灵追上他们”将“ran after”译为已追及。
    rationale: 原文强调急切地追随／赶去、为使其得生命的动作，不必断定已经追上；“急忙赶去”较合适。
  - severity: medium
    issue: 末段“向……伸出手，使他站立起来”与前后代词和原文结构需要统一。
    rationale: 原文先以单数“躺在地上的人”描写，再转向群体接受父的认识和子的启示。中文宜在扶起动作中保留单数，并在随后清楚转回复数。
  - severity: low
    issue: “无知的人所行的，仿佛仍在沉睡；已经认识的人所行的，仿佛已经醒来”不够自然。
    rationale: 此处是以睡／醒描述两类人的状态或表现，并非特别强调“所行的”。简化为“无知的人仿佛在沉睡；已经认识的人仿佛已经醒来”更自然且不失原意。
  revised_text: '那么，他要他们怎样看自己呢？就是要他们想到：自己成了夜间的影子和幻影。


    当光照在他们所承受的恐惧上时，那恐惧就显明为虚无。他们不认识父，因为他们没有看见他。因为那里有恐惧、纷扰、动摇、分裂和疑惑；许多空洞的幻象在他们中间作祟，还有虚妄的空无——仿佛他们沉睡了，在梦中发现自己置身于种种噩梦中。


    他们或是奔向某处，或是无法逃离某个人；或是与人争斗，或是遭人殴打；或是从高处坠落，或是没有翅膀却在空中飞。有时，仿佛有人正在杀他们，其实并没有人追赶；又仿佛他们亲手杀死身边的人，身上沾满了那些人的血。在经历这一切的人醒来以前，他们什么也看不见，因为这一切本来就是虚无。


    那些把无知像睡眠一样抛开的人，也是如此：他们不把无知看作什么，也不把无知所产生的其他作为当作真实，反而像丢下夜里的梦一样把它们抛在身后。他们看重对父的认识，如同看重光。无知的人仿佛在沉睡；已经认识的人仿佛已经醒来。


    归回而醒来的人，真是好！[a]开启盲人眼睛的人有福了！


    那灵急忙赶去，为要使他们活过来。那灵向躺在地上的人伸出手，扶他站起来，因为他还没有起身。那灵赐给他们对父的认识和子的启示；因为他们看见了他，也听见了他，他便让他们尝到他，并把握那蒙爱的子。'
  revised_footnotes:
  - marker: a
    text: 或译：“归回而醒来的人是好的！”原文这里用“好”，下一句才使用“有福”一词。
    reason: 说明正文较自然的表达仍对应原文“好”，并保留本句与下一句不同原词的区别。
  revision_rationale: 修订仅处理可安全确认的语法关系、动作体和现代汉语自然度问题：明确“他们没有看见父”，将灵的动作译为“急忙赶去”而不预设已追及，维持扶起一人的单数表达后再转回群体，并改善睡／醒对照句。末句仍保留“尝到他”及“他”与“蒙爱的子”之间的指称张力，未作教义性解释。
