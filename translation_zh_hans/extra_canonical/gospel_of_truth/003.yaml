revisions:
- from: '父是那不可容纳者。他把万有[a]的圆满保存在自己里面；万有都在他里面，也都需要他。他把他们的圆满留在自己里面，并不是出于嫉妒——他和自己的肢体之间，哪会有什么嫉妒呢？若万有已经这样领受了圆满，他们就不能再到他那里去。他把他们的圆满保存在自己里面，为要赐给他们，使他们在安息中，带着那在圆满里合一的知识，归回到他那里。他创造了万有；万有都在他里面，也都需要他。


    他如同一位未被人认识的，渴望人认识他、爱他——因为万有所缺的，除了对父的认识，还会是什么呢？他成为一位向导，温和而从容。他来到教导人的地方，像教师一样宣讲圣言。那些自以为心里有智慧的人前来试探他；他却使他们哑口无言，因为他们里面空虚。他们恨他，因为他们并没有在真理中成为有智慧的人。


    他们之后，小孩子也都来到他那里；对父的认识属于他们。他们得着坚固，就领受有关父之言语的教导。他们认识了，也被认识；他们领受荣耀，也献上荣耀。在他们心里，那本属于活人、又是活着的书显明出来。这书写在父的意念和心智中，早在万有奠基以前，就在他那不可测透之中。这书无人有能力拿取，因为命定拿取它的人要被杀。若这书不显现，在那些受托承受救恩的人中，就不可能有任何一人显明出来。


    因此，那慈悲而信实的耶稣耐心忍受苦难，直到拿取了那书，因为他知道，自己的死就是许多人的生命。遗嘱[b]尚未开启时，已故家主的财产仍然隐藏；同样，万有之父还不可见时，万有也都隐藏，因为万有出于他，各个领域也都从他而来。


    因此，耶稣显明出来，

    披上那书，

    被钉在木头上，

    并在十字架上公布父的谕令。


    这是何等伟大的教导！

    他使自己降到死亡之中，

    却披上永恒的生命；

    他脱下必朽坏的破衣，

    披上不朽坏，

    这是无人能从他身上夺去的。


    他进入那些空虚而可怖的领域，从那些因遗忘而被剥夺一切的人中间经过；他自己就是知识和圆满，把心里的事宣告出来，教导那些将要领受教导的人。'
