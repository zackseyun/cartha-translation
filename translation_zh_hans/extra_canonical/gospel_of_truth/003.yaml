  naturalness: 整体庄重流畅，诗体分行也适合原文节奏。个别措辞可更自然且更贴近原文：如“父之言语”可作“父的话语”，“受托承受救恩”不够自然，“披上不朽坏”缺少宾语中心词，“他自己就是知识和圆满”会造成原文未必要求的系词断言。
  terminology: “万有”“圆满”“安息”“认识／知识”“遗嘱”及“不可朽坏”的术语方向基本可取。“圣言”带入较强的后世神学术语色彩；原文此处可中性译为“话语”。“活人的活书”应避免把两个“活”解释为“书属于活人、书又活着”，宜保留为“活者的活书”。
  issues:
  - severity: high
    issue: 开头遗漏“赐给他们安息和知识”及“在圆满中来到、教导万有”的内容。
    rationale: 科普特文明确有“给他们安息和知识”以及“在圆满中来到；他教导万有”。现稿以“使他们在安息中，带着……知识归回”替代，既遗漏动作，也重组了原句关系。
  - severity: medium
    issue: “圣言”将普通而具冠词的“话语／道”作了较具宗派色彩的定型解释。
    rationale: 本段可保留其庄重性而译作“话语”，不预设特定后世基督论含义。
  - severity: medium
    issue: “那本属于活人、又是活着的书”过度释义。
    rationale: “活者的活书”是重复的修辞性属格结构；译稿以“属于……又是……”说明其关系，超出原文。
  - severity: medium
    issue: 末段“他自己就是知识和圆满”及“把心里的事”过度限定。
    rationale: 原文以“作为／带着知识和圆满”描写其经过和宣讲，且“心中之事”未明定为耶稣自己的内心；应保留此开放性。
  - severity: low
    issue: “受托承受救恩”与“披上不朽坏”中文搭配不够自然。
    rationale: 前者可直译为“已经领受救恩的人”，后者宜作“披上不可朽坏之身／不朽坏性”，以完整表达抽象名词。
  revised_text: '父是那不可容纳者；他把他们的圆满保存在自己里面，赐给他们安息和知识。有一位在圆满中来到；他教导了万有。万有都在他里面，也都需要他。那从他而出的，原是那些无知的人；他愿意他们认识他，并爱他。因为，若不是父的知识，万有还需要什么呢？


    他成为一位安静从容的向导。他来到教导人的地方，像教师一样宣讲话语。那些自以为心里有智慧的人前来试探他；他却使他们哑口无言，因为他们是虚妄的。他们恨他，因为他们并不在真理中有智慧。


    在他们之后，小孩子也来到他那里；父的知识是他们的。他们得着坚固，便领受了关于父的话语的教导。他们认识了，也被认识；他们领受荣耀，也归荣耀于他。在他们心里，活者的活书显明出来；这书写在父的意念和心智中，早在万有奠基以前，就在他那不可测透之中。这书无人有能力拿取，因为拿取它的人注定要被杀。若这书不显现，在那些已经领受救恩的人中，就不可能有任何人显明出来。


    因此，那慈悲而信实的耶稣耐心忍受苦难，直到拿取了那书；因为他知道，他的死是许多人的生命。遗嘱[b]尚未开启时，已故家主的财产仍是隐藏的；同样，当万有之父不可见时，万有也都隐藏，因为万有出于他，各个领域也都从他而来。


    因此，耶稣显明出来，


    披上那书，


    被钉在木头上，


    并在十字架上公布父的法令。


    这是何等伟大的教导！


    他使自己降到死亡之中，


    披上永恒的生命；


    他脱下必朽坏的破衣，


    披上不可朽坏之身，


    这是无人能从他夺去的。


    他进入那些空虚的恐怖之境，从那些因遗忘而被剥夺的人中间经过，带着知识和圆满，宣讲心中之事，教导那些将要领受教导的人。'
  revised_footnotes:
  - marker: a
    text: “万有”也可译作“全体”或“整体”；在本书中常指存在的总体，而不只是普通意义的“一切”。
    reason: 说明反复出现的整体性术语，避免读者仅按数量词理解。
  - marker: b
    text: 原词也可译作“约”；但此处以家主死亡、财产和文书开启为喻，因此译作“遗嘱”。
    reason: 保留希腊借词的多义性及本段明确的法律继承语境。
  revision_rationale: 修订恢复开头被省略的两个关键动作，并将后续文句重新按原文的论述顺序组织。核心术语维持“万有、圆满、安息、知识、遗嘱”的一致性；同时将若干解释性强化还原为较开放的表述。脚注a原在首段“万有”后，但修订后的首个“万有”未附锚点；现应将其锚点置于“万有[a]”之后。
