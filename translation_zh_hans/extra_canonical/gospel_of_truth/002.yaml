revisions:
- from: '众人都在寻找那位他们由之而出的；他们也全都在他里面。他是那不能被容纳、不能被思议、超越一切思想的那一位。由于不认识父，苦恼和恐惧便产生了；苦恼浓重起来，如同雾一般，使谁也看不见。因此，谬误得了力量。它经营自己的事，却徒劳无功，因为它不认识真理。


    事情以迷惑人的方式发生了：谬误凭着能力，披上一种美丽，造出一个真理的替代品。但这并没有使那不能被容纳、不能被思议者蒙羞，因为苦恼、遗忘和欺骗的幻象算不得什么；真理却坚定长存，不改变，不受搅扰，超越美丽。因此，不必理会谬误，因为它没有根。


    这一切是在关乎父的迷雾中发生的，如今仍在发生：谬误在遗忘和恐惧中造作种种事物，好借着它们吸引那些处在中间的人[a]，把他们囚禁起来。


    谬误的遗忘并不是被启示出来的，也不是出于父的一个意念。遗忘不是从父而生，尽管它确实因他而生[b]。在他里面产生的是认识；这认识显明出来，为要使遗忘消散，使人认识父。遗忘之所以产生，是因为人不认识父；所以，父一旦被认识，遗忘就不再存在。'
