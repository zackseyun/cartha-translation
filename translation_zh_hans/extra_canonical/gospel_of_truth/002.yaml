  consult_excerpt: 'Since all searched for the one from whom they had come – all were within him, the uncontainable, inconceivable one who’s beyond every thought – (and) since ignorance of the Father caused anguish and terror, and the anguish grew thick like a fog, so that no one could see – Error was strengthened. It worked on its own matter in vain, not knowing the Truth.

    It happened in a deluding way, as it (Error) prepared with power, in beauty, a substitute for the Truth. Now this wasn’t humiliating for the uncontainable, inconceivable one, because the anguish and forgetfulness and delusion of deceit were like nothing, whereas the Truth is established, unchangeable, unperturbed, beyond beauty. Because of this, disregard Error, since it has no root.

    It happened in a fog concerning the Father. It happens (now) since it (Error) prepares works in forgetfulness and terror, so that with them it (Error) might attract those in the middle and imprison them.

    The forgetfulness of Error wasn’t revealed; it wasn’t a 18 [thought] from the Father. Forgetfulness didn’t come into being from the Father, though it did come into being because of him. What comes into being within him is the knowledge, which was revealed so that forgetfulness might be dissolved, and the Father might be known. Forgetfulness came into being because the Father was unknown, so when the Father comes to be known, forgetfulness won’t exist anymore.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/002.yaml
  text: 'Since all were searching for the One from whom they had come forth — and they were all within him, the uncontainable, inconceivable One beyond every thought — and since ignorance of the Father brought distress and dread, and the distress thickened like a fog so that no one could see, Error was strengthened. It worked at its own matter to no purpose, because it did not know the Truth.


    It came about in a delusive manner: Error arrayed, with power and with a certain beauty, a substitute for the Truth. Yet this did not disgrace the Uncontainable, the Inconceivable; for the distress and the Forgetfulness and the illusion of deceit are as nothing, while the Truth stands firm — unchanging, untroubled, beyond beauty. Because of this, disregard Error, for it has no root.


    It happened in a fog with respect to the Father; and it happens even now: Error prepares works in Forgetfulness and in fear, so that by means of them it might draw those who are in the middle and imprison them.


    The Forgetfulness of Error was not revealed; it was not a thought from the Father. Forgetfulness did not come into being from the Father — though it did come into being on account of him. What comes into being within him is the knowledge, which was manifested so that Forgetfulness might be dissolved and the Father might be known. Since Forgetfulness arose because the Father was unknown, once the Father comes to be known, Forgetfulness will no longer exist.'
translation:
  language: zh_hans
  text: '众人都在寻找那位他们由之而出的；他们也全都在他里面。他是那不能被容纳、不能被思议、超越一切思想的那一位。由于不认识父，苦恼和恐惧便产生了；苦恼浓重起来，如同雾一般，使谁也看不见。因此，谬误得了力量。它在自己的质料上徒然施作，因为它不认识真理。


    事情以迷惑人的方式发生了：谬误以能力和某种美的外观，预备了一个真理的替代品。但这并没有使那不能被容纳、不能被思议者蒙羞，因为苦恼、遗忘和欺骗的幻象算不得什么；真理却坚定长存，不改变，不受搅扰，超越美丽。因此，不必理会谬误，因为它没有根。


    这事是在关乎父的迷雾中发生的；如今仍在发生：谬误在遗忘和恐惧中造作种种作为，好借着它们吸引那些处在中间的人[a]，把他们囚禁起来。


    谬误的遗忘并不是被启示出来的，也不是出于父的一个意念。遗忘不是从父而生，尽管它确实因他而生[b]。在他里面产生的是知识；这知识显明出来，为要使遗忘消散，使人认识父。遗忘之所以产生，是因为人不认识父；所以，父一旦被认识，遗忘就不再存在。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “处在中间的人”可能是带有宇宙论意味的专门说法，也可较一般地理解为“处在其间的人”；原文没有在此进一步说明。
    reason: 保留所指对象的真实歧义，避免导入特定体系的固定解释。
  - marker: b
    text: “因他而生”不是说遗忘源自父，而是说遗忘因父未被认识而出现；下文随即作了这样的解释。
    reason: 说明源文刻意区分“从父而生”与“因父而生”，这是本段的重要神学张力。
lexical_decisions:
- source_word: ⲧⲡⲗⲁⲛⲏ
  choice: 谬误
  rationale: 保留其与“真理”对立的意义，并通过全文中“它”的拟人化用法呈现其实体化角色；“迷惑”用于描述其作用方式，而不取代术语本身。
- source_word: ⲁⲧⲙⲉⲉⲩⲉ
  choice: 遗忘
  rationale: 这是本段反复使用、近乎实体化的宇宙性状态；“遗忘”自然、清楚，也能与后来“消散”“不再存在”相衔接。
- source_word: ⲧⲙⲛⲧⲙⲏⲉ
  choice: 真理
  rationale: 作为与“谬误”对举的核心概念，采用现代汉语中庄重且通行的译法。
- source_word: ⲡⲓⲱⲧ
  choice: 父
  rationale: 保留原作对终极源头的亲属性称谓，不扩写为带有特定宗派色彩的名称。
