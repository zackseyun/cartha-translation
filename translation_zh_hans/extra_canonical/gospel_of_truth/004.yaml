  revised_text: '至于活人之名，它们都写在《活人之书》中。[a]


    他们领受关于自身的教导；他们从“子性”领受这教导，[b]使那听见的人可以回应、回转，并仰望那呼唤他名字的。他遵行那一位的旨意，跟随他，并说那些由他点名的人是属他的。每个人都知道自己从哪里蒙召；他遵行那一位的旨意，愿意讨他喜悦，并得享安息。每个人的名字成为自己的。


    既然万有的圆满在他里面，万有就必须上升到他那里，每个人也要领受属于自己的。他预先写下了它们，又在自己的意念和旨意中预备好，要赐给那些从他而出的人。[c]


    他预先按名所认识的人，到了末后便蒙呼唤。因此，有认识的人，就是父已说出其名字的人；名字尚未被说出的人，仍是无知的。若他的名字没有被呼唤，他又怎能听见呢？那直到末了仍无知的人，是“迷误”的产物，也必与“迷误”一同消散。[d]不然，这些可怜的人为什么没有名字？为什么没有声音？


    所以，人若有认识，他就是从上面来的。他一蒙呼唤，便听见，便回应；他转向那呼唤他的，上升到他那里，并知道自己是怎样蒙召的。他既有认识，就遵行那呼唤他的那一位的旨意，愿意讨他喜悦，并得享安息。他的名字成为自己的。这样有认识的人，知道自己从哪里来，又往哪里去。他好像一个醉过酒的人：他离开自己的醉态，回到自己那里，把属于自己的一切重新安置妥当。


    他使许多人从“迷误”中回转。他走在他们前面，到了他们曾离开的那些地方。他们之所以接受了“迷误”，是因那包围一切地方者的深邃；然而，没有什么能包围他。这实在是极大的奇事：他们原在父里面，却不认识他；他们能够自行出来，却不能领会并认识那一位——他们原在他里面。他把自己的旨意显明为认识，使之与一切从他而出的相契合。


    这就是《活着的书》的认识；[a]他在末后向诸世代将它显明，作为出于他的字母，显明这些字母既不是元音，也不是辅音，免得有人读了，便以为它们空洞无义。它们却是真理的字母：它们会说话，也认识自己。每一个字母都是一个完整的思想，如同一本完整的书；因为它们是由“合一”写下的字母。[e]父写下它们，为要使诸世代借着这些出于他的字母认识父。'
