- issue: 书名究竟是“活人之书”还是“活着的书”
  choice: 开头作《活人之书》，后文作“活着之书”，共用脚注说明
  alternative: 全篇统一作《生命册》或《活书》
  rationale: 科普特结构容许所属与性质两种理解；上下文一面谈活人名字写在书上，一面把书及其字母描述为会说话、能认识，因此保留两重读法。
- issue: “迷误”的本体地位
  choice: 以引号标示实体化倾向，但不称为神格或特定位格
  alternative: 普通名词“错误”或专名“谬误者”
  rationale: 本文让它使人受迷惑并与无知者一同消散，具有准人格化色彩；但原文不足以规定完整本体论。
- issue: “万有上升”与“各自领受所有”
  choice: 直译其上升与归属语言
  alternative: 解释为灵魂回归、得救或恢复本性
  rationale: 原文具有明显的回归与圆满意象，却未在此处完整界定其机制；译文保留神学张力，不补入后设体系。
