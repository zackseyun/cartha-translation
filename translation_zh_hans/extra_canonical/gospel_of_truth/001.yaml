base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/001.yaml
  text: The Gospel of Truth is joy for those who have received grace from the Father of Truth[a], so that they might know him through the power of the Word that came forth from the Pleroma—the one who is in the thought and the mind of the Father. He is called “Savior”; that is the name of the work he will do to save those who had become ignorant of the Father. And the name “Gospel” is the revelation of hope, the discovery for those who seek him.
translation:
  language: zh_hans
  text: 《真理的福音》给那些从真理之父领受恩典的人带来喜乐，使他们能借着那从普累若玛[a]而来的道之大能认识他；这道存在于父的意念和心思之中。他被称为“救主”；这个名称指明他将要成就的工作：拯救那些后来不认识父的人。“福音”这个名称则是希望的显明，是寻求他之人的发现。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “普累若玛”音译自希腊语，意为“圆满”或“充盈”；在本书中也可指神圣的圆满境域。
    reason: 该词兼具普通词义和术语含义，单纯意译或音译都会损失一层信息。
  - marker: b
    text: “是寻求他之人的发现”也可理解为“使寻求他的人发现他”；原文没有完全说明“发现”的主客关系。
    reason: 保留末句名词结构的真实歧义，避免在正文中替作者确定发现者与被发现者。
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: 福音
  rationale: 这是希腊语 εὐαγγέλιον 的科普特语借词；此处既是宣告，也作为名称受到解释，译作传统而自然的“福音”。
- source_word: ⲧⲙⲏⲉ
  choice: 真理
  rationale: 保留原文反复出现的核心词，并维持“真理的福音／真理之父”的呼应。
- source_word: ⲧϭⲁⲙ
  choice: 大能
  rationale: 表达使人得以认识父的有效能力；“大能”符合庄重宗教语体，同时不增加特定教义。
- source_word: ⲡⲥⲁϫⲉ
  choice: 道
  rationale: 原词通常意为“话语”，此处却从普累若玛而来，并存在于父的意念与心思中，带有位格化色彩；“道”既保留早期基督教语感，也避免直接音译为“逻各斯”。
- source_word: ⲡⲡⲗⲏⲣⲱⲙⲁ
  choice: 普累若玛
  rationale: 这是希腊语 πλήρωμα 的借词，在本书思想语境中具有术语性质；音译并以脚注说明“圆满／充盈”，比仅译“圆满”更能保留概念张力。
- source_word: ⲛⲟⲩⲥ
  choice: 心思
  rationale: 希腊语 νοῦς 的借词，可指心智或理智；与另一认知词并列时译作“意念和心思”，保留两个词的区分。
- source_word: ⲡⲥⲱⲧⲏⲣ
  choice: 救主
  rationale: 对应希腊语 σωτήρ 的标准称号，并与下文“拯救”的工作形成词义联系。
- source_word: ⲟⲩⲱⲛϩ ⲃⲁⲗ
  choice: 显明
  rationale: 该短语有开启、揭示之意；“显明”既自然又保留从隐藏到显露的动态。
- source_word: ⲕⲱⲧⲉ ⲛⲥⲱϥ
  choice: 寻求他
  rationale: 准确表达持续寻找的行动，也符合现代汉语宗教散文语体。
theological_decisions:
- issue: 位格化的“话语”如何处理
  choice: 道
  alternative: 话语；逻各斯
  rationale: 原文的语法与叙述赋予其明显的位格化色彩，但并未直接使用希腊语 Logos；译作“道”保留这种神学意味而不过度解释。
- issue: πλήρωμα 的呈现
  choice: 普累若玛，并以脚注释义
  alternative: 圆满；充盈
  rationale: 该词既有普通的“圆满”含义，也可能是特定神学术语；音译加释义能保存两层可能性。
- issue: “救主”之工作的动词
  choice: 拯救
  alternative: 救赎
  rationale: “拯救”直接呼应“救主”，且原文重点是使人脱离对父的无知；“救赎”可能额外引入代价或赎买的含义。
- issue: 末句“发现”的主客关系
  choice: 是寻求他之人的发现
  alternative: 使寻求他的人发现他；寻求他的人被发现
  rationale: 原文名词结构简练，关系存在一定含混；正文保留“发现”及其不完全确定的主客关系，不将其静默解释为某一方向。
- issue: “福音”前的名词
  choice: “福音”这个名称
  alternative: “福音”这个词
  rationale: 科普特文本明确使用“名／名称”，并与前句“救主”这一名称形成修辞呼应。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“真理的福音／真理之父”“救主／拯救”“名称／名称”等重复有意保留，以再现原文的词语呼应。对 OCR 中明显属于前一部作品的页首残文不作翻译；本段从抄本第16页《真理的福音》正文起首译至第17页相应结句。
