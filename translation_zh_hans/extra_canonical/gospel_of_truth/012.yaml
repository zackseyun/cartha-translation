- from: '这福音的话讲的是圆满的发现，是为那些等候从上而来的救恩之人说的。[a]他们等候的时候，所盼望的归于那些形象如光、其中毫无阴影的人。


    这样，当圆满来到时，质料的缺乏并不是出于父的无可度量；父来，是要给这缺乏一段时日。然而，没有人能说，那不朽者会以这种方式来到。父的深邃反而扩展增多，谬误的念头并不与他同在。谬误是坠落之物；当那将要回来、归回其所归之处者被寻见时，它很容易被扶正，因为这种归回称为“心意回转”。[b]


    因此，不朽吹出气息，追随那犯了罪的人，使他可以安息。因为为缺乏中的光所存留的是赦免——就是圆满之道。医者总是赶往有疾病的地方，因为这是他的意愿。有缺乏的人也不把缺乏隐藏起来，因为有人拥有他所需要的。照样，那毫无缺乏的圆满，从自身取出所需来填满缺乏，使他们可以领受恩典；因为他们缺乏的时候，恩典并不与他们同在。因此，在没有恩典之处就有了亏减；而当那亏减的恢复以后，他们所缺乏的便显明为圆满。这就是对真理之光的发现；这光照亮了他们，因为它永不改变。


    因此，他们在众人中间谈到弥赛亚：[c]“你们要寻求；那些受搅扰的人必归回，他也要用膏油膏抹他们。”这膏油就是父的怜悯；他必怜悯他们。那些蒙他膏抹的，就是已经达到完整的人，因为盛满的器皿才受膏抹。但一个器皿的膏油一旦消散，它便空了；造成缺乏的，是膏油漏出的地方，因为一股气息及其力量把膏油吸走了。然而，那毫无缺乏者的印记不会松脱，什么也不会从中倒空；它所缺少的，父——那位完整者——便用自己再把它充满。


    父是良善的；他认识自己所栽种的，因为是他把它们栽种在自己的乐园里。他的乐园就是他的安息之所。'
