    因此，不朽性呼出气息，追随那犯了罪的人，为要使他得安息。因为为缺乏中的光所存留的是赦免——即圆满之道。医者赶往有疾病的地方，因为这是他的意愿。有缺乏的人也不把缺乏隐藏起来，因为有人拥有他所需要的。照样，那毫无缺乏的圆满从自身供应，为要填补缺乏，使他们可以领受恩典；因为他们缺乏的时候，恩典并不与他们同在。因此，在没有恩典之处就有了亏减；而当所亏减的得以恢复，缺乏便显明为圆满。这就是真理之光的发现；这光照亮了他们，因为它永不改变。


    因此，他们在他们中间谈到弥赛亚：[c]“你们要寻求；那些受搅扰的人将得以归回，他也要用膏油膏抹他们。”这膏油就是父的怜悯；他必怜悯他们。那些蒙他膏抹的，就是已经达到完整的人，因为盛满的器皿才是受膏抹的。若某人的膏油一旦消散，他便被倒空了；造成缺乏的缘由，是膏油漏出的地方，因为一股气息及其力量把它吸走了。然而，对于那毫无缺乏者，封印不会被解除，什么也不会被倒空；父——那位完整者——会再次补足它所缺少的。


