revisions:
- from: '## 儿子的启示


    他显现的时候，把父——那不可容纳者——教给他们，又把意念中的事吹入他们里面，成就他的旨意。许多人领受了光，转向他；因为属物质的人如同外人，没有看见他的形态，也不认识他。他借着肉身的形态而来，没有什么能阻挡他的道路，因为不朽是无法捉住的。[a]


    他说出父心中的事，也讲说前所未有的事，并带出了完整的道。光从他口中说话，他的声音生出生命；他便把意念、悟性、怜悯、救恩和大能的灵赐给他们——这一切都源自父的无限与甘美。


    他使刑罚和鞭打止息，因为它们曾把那些需要怜悯的人引入谬误与囚禁之中。他以知识瓦解它们，使它们陷入混乱。


    于是，他成了：


    - 迷失之人的道路，

    - 无知之人的知识，

    - 寻求之人的寻见，

    - 动摇之人的力量，

    - 受玷污之人的纯洁。


    [a] “不朽是无法捉住的”也可理解为“不朽是无法制伏的”。科普特语在这里保留了“抓住、掌控”这一具体意象。'
  to: '## 儿子的启示


    他显现的时候，向他们讲说父——那不可容纳者——又把意念中的事吹入他们里面，成就他的旨意。许多人领受了光，转向他；因为属物质的人是外人，他们没有看见他的样式，也不认识他。他借着肉身的样式而来，没有什么能阻挡他的道路，因为不朽之性是不可把握的。[a]


    他说出父心中的事，也讲说前所未有的事，并发出了完整的道。光从他口中说话，他的声音生出生命；他便把意念、悟性、怜悯、救恩和大能的灵赐给他们——这一切都源自父的无限与甘美。


    他使刑罚和鞭打止息，因为它们曾把那些需要怜悯的人引入谬误与囚禁之中。他以知识瓦解它们，使它们陷入混乱。


    于是，他成了：


    - 迷失之人的道路，


    - 无知之人的知识，


    - 寻求之人的寻见，


    - 动摇之人的力量，


    - 受玷污之人的纯洁。


    [a] “不朽之性是不可把握的”也可理解为“不朽之性不可制伏”。科普特语保留了“抓住、掌控”的具体意象。'
