  verdict: revise
  source_fidelity: 草稿大体保留了“形态／名字”“存在／非存在”“根／果子”及永世（aeon）的关键对照，但数处将“come into being”一律处理为“形成”，模糊了原文在“获得形态”与“成为／存在”之间的区分。第二段首句把“不是虚无”译为“是虚无”，造成明显反义；末句的“必不再存在”则增添了原文没有的“再”。
  naturalness: 整体庄重可读，但“使他们生出”“将要愿意使他们形成的存在者”“从非存在中使他们确立”等表达生硬。“他们存在于……里面，如同一个后来才到的时节”需要重组为自然汉语，同时保留其比喻性和句法张力。
  terminology: 应保持“形态”专译 form，而将 come into being 译为“成为／得以存在”，避免术语网络混同。“那位存在者”可保留为称号；“非存在”“永世”“果子”也可保留。
  issues:
  - severity: high
    issue: 第二段首句将否定译反。
    rationale: 原文及英文审校轨迹说“不要说……是虚无／nothing；相反……”，草稿“不要说……是虚无”缺少“不是”，使意思相反。
  - severity: medium
    issue: “come into being”多处译为“形成”。
    rationale: 本段同时以“形态”对应 ⲙⲁⲉⲓⲧ，并以“成为／存在”表达进入存在；一律译为“形成”会抹去这一刻意的存在论区分。
  - severity: medium
    issue: 末句的“也必不再存在”添加了“再”。
    rationale: 原意是“那些全然不存在的，将不会存在”；“不再”暗示此前曾存在，与原文的悖论性表述不符。
  - severity: low
    issue: 脚注仅笼统说明困难，未呈现英文审校轨迹所保留的实质异读。
    rationale: 锚点[a]应说明该处断句／衔接的另一种读法，供读者辨识，而不只说明译者处理。
  revised_text: '因为他们还没有获得形态，也没有名字。父生出他们。随后[a]，他们借着他的知识获得形态；他们虽然确实在他里面，却不认识他。但父是完满的，知道在他里面的每一处。他若愿意，就显明他所愿意的任何一位，赐给他们形态，也赐给他们名字。他给他们命名，使他们得以成为；这些人在成为以前，并不认识那位造他们的。


    所以，不要说那些尚未成为的是虚无；相反，他们存在于那一位里面：他会在自己愿意的时候使他们成为；他们如同未来的一个时节。在一切显明以前，他知道自己将在适当的时候产生什么。然而，他尚未显明的果子还一无所知，也没有任何作为。


    此外，父里面的每一个永世，都出自“那位存在者”；他使他们从非存在中得以确立。因为没有根的，也没有果子。他们心里说：“我已经成为了。”可是，他们必自行消散。因此，那些根本不存在的，将不会存在。'
