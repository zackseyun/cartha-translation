  terminology: “父”“安息日”“救恩”“真理”“知识”“谬误”“日”“光”等术语前后一致。“谬误”既不将其过度实体化，也借脚注保留本书中可能的技术性、拟人化色彩；“完全的”也恰当保留了ϫⲏⲕ在本段的重复。
  issues: []
  revised_text: '他就是那牧人，留下那九十九只没有迷失的羊，去寻找那只走迷的羊。他找到它时，就为它欢喜，因为九十九是用左手表示的数；但那一只被找回时，计数便转到右手。这样，那需要“一”的——也就是整个右手——便把自己所需要的吸引过来，从左手取走，移到右手，于是数目就成了一百[a]。这是这些数目之声的记号；这就是父。


    他甚至在安息日也为那只被他发现掉进坑里的羊劳作。他把羊从坑里带上来，救了它的性命，好让你们从心里知道——你们既是内心知识的儿女——安息日究竟是什么：在这日，救恩不应闲着。这样，你们就可以讲说上方的那一日；那一日没有黑夜。你们也可以讲说那不落的光，因为它是完全的。


    所以，要从心里讲说，因为你们就是那完全的日，那永不止息的光住在你们里面。要向寻求真理的人讲说真理，也要向那些在谬误[b]中犯了罪的人讲说知识。'
