  footnotes:
  - marker: a
    text: 这一句的科普特语句法较为艰涩；“他”也可能回指“不法者所行的事”，而非清楚指明一个独立行动者。
    reason: 保留“不法者—义人”比较句及代词所具有的真实句法歧义。
  - marker: b
    text: “圣容”直译为“他的脸／面容”；这里可能指父显现或表达自己的方式。
    reason: 避免把“脸”只作身体意义理解，同时不把它固定为某一专门神学术语。
  - marker: c
    text: “质料”对应希腊语 hylē，既可指材料，也可在古代哲学语境中指未成形的物质本原。
    reason: 说明借词的技术性，又不预先限定其所属体系。
  - marker: d
    text: “造物”对应希腊语 plasma，意为“塑成之物、形成之物”；“赋有魂的”也可译作“有生命的”。
    reason: 交代关键借词及复合表述的可译范围。
  - marker: e
    text: 原文把“信”写成一个会“来”、会行动的主体，可能带有人格化意味。
    reason: 保留抽象概念与人格化实体之间的神学张力。
  - marker: f
    text: “充盈”对应希腊语 plērōma，意为“圆满、丰满、充满的整体”，在本文中带有专门的宇宙论意味。
    reason: 帮助普通读者理解技术术语而不直接采用生硬音译。
  - marker: g
    text: “道”对应希腊语 logos，也可译作“言语”“话语”或“理则”；这里可能具有位格化意味。末句所说的是道显明了“圆满的发现”。
    reason: 保留 Logos 的词义宽度和可能的人格化用法，并说明其与前句“圆满思想的合一”及末句宾语的句法关系。
