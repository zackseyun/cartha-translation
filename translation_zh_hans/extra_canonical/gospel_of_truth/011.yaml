- source_word: ϩⲩⲗⲏ
  choice: 质料
  rationale: 希腊语 hylē 的哲学性借词；“质料”比日常的“物质”更能保留古代形而上语境。
- source_word: ⲥⲱⲣⲁϩⲧ
  choice: 宁静
