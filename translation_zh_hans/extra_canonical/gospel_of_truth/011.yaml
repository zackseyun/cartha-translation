revisions:
- from: '### 遵行父的旨意


    要使跌倒之人的脚站稳，向患病的人伸出手；给饥饿的人食物，使疲乏的人得安歇；扶起那些愿意起来的人，唤醒沉睡的人——因为你们就是那已经出鞘的悟性。力量若是这样运用，就会越发强大。


    要留心自己，不要再留心那些已经从自己身上丢弃的事物。不要回头吃自己的呕吐物；不要被蛀虫蚕食，也不要被蠕虫吞噬，因为你们已经把它抖落了。不要成为魔鬼的住处，因为你们已经使他归于无有。不要像支柱一样，去撑住那些正在倒塌、使你们绊跌的障碍。那不法者算不得什么；他比义人更应受到严厉处置，因为他在别人中间行自己的事。[a]


    所以，你们要遵行父的旨意，因为你们是从他而来的。父是甘美的，他的旨意中有良善。他知道什么是属你们的，好让你们在其中得安歇。人凭果实认出什么是属你们的，因为父的儿女就是他的馨香；他们出于他圣容的恩典。[b]


    因此，父爱自己的馨香，并在各处将它显明。馨香与质料[c]混合时，父便把自己的馨香赐给光；又在自己的宁静中，使它超越一切形态和一切声音。闻到馨香的并不是耳朵，而是灵。灵闻到它，把它吸引到自己那里，并沉入父的馨香之中。随后，父遮护它，把它带回它原先所出的地方，也就是那已经冷却的起初馨香那里。


    它处在一个赋有魂的造物[d]之中，就像冷水渗入松散的土块。看见的人以为那不过是土；后来它又溶解开来，若有一口气把它吸引出来，它就变暖。因此，那些冷却的馨香出于分裂。


    正因如此，信[e]来了：它消解了分裂，带来了因爱而温暖的充盈[f]，使那寒冷不再回来，取而代之的是圆满思想的合一。这道[g]把它显明了。'
