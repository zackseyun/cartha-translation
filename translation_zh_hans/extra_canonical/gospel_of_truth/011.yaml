- source_word: ⲡⲗⲁⲥⲙⲁ
  choice: 造物
  rationale: 希腊语 plasma 指塑成之物、受造形体；“造物”保留形成或塑造的含义，不误译为“迷妄”。
- source_word: ⲡⲱϣ
  choice: 分裂
  rationale: 与后文的“合一”相对，保留文本内在的概念张力。
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: 充盈
  rationale: 表示圆满、充满的整体；采用可读的汉语术语，同时以脚注说明其技术性。
- source_word: ⲁⲅⲁⲡⲏ
  choice: 爱
  rationale: 希腊语 agapē 在此可直接译作“爱”；上下文已赋予其神学意味，无须在正文音译。
- source_word: ⲗⲟⲅⲟⲥ
  choice: 道
  rationale: 保留 Logos 兼具言说、理则及人格化媒介的含义；脚注提示其多义性。
theological_decisions:
- issue: “信来了”是人格化实体还是抽象信心
  choice: 正文作“信”，并以脚注保留可能的人格化读法
  alternative: 译作专名“信德”或“信仰者”
  rationale: 原句允许人格化理解，但仅凭大小写或后期体系不宜强行定为专名。
- issue: 充盈、质料、道等术语是否全部音译
  choice: 采用汉语概念词并加简明脚注
  alternative: 音译作“普累若玛、希勒、逻各斯”
  rationale: 汉译更适合普通现代读者；脚注仍保留希腊词及技术色彩，避免概念被日常化。
- issue: “父的儿女就是他的馨香”
  choice: 保留身份等同的强烈隐喻
  alternative: 弱化为“带有他的馨香”
  rationale: 原文不是单纯描述儿女拥有香气，而以馨香界定其与父的关系；不应削弱。
- issue: 灵与父在馨香段落中的代词指向
  choice: 按语义分别明确为“灵”与“父”
  alternative: 全用含混的“他”
  rationale: 中文连续使用“他”会造成非原文所需的阅读障碍；明确指称而不改变各动作之间的神学关系。
- issue: 不法者与义人的比较句
  choice: 保留“不法者更应受严厉处置”的比较，同时以脚注说明句法不稳
  alternative: 改成“不法者不比义人更应受严厉处置”
  rationale: 现存文本和通行释读支持前者，但 OCR 与句法均有困难，不宜掩盖不确定性。
