- source_word: ⲡⲗⲟⲅⲟⲥ (logos)
  choice: “道”
  rationale: 保留其作为人格化、技术性概念的分量，同时采用现代汉语读者熟悉的对应词；加引号以区别于普通言语。
- source_word: ⲛⲟⲩⲥ (nous)
  choice: “心智”
  rationale: 表达认知与发言的理性主体，比“理智”更自然，也不把它简化为一般思想活动。
- source_word: ⲭⲁⲣⲓⲥ (charis)
