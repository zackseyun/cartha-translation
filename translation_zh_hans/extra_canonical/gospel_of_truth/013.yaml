- source_word: ⲙⲉⲩⲉ / ⲙⲉⲉⲓⲛⲉ
  choice: 思想／默想
  rationale: 依语境分别表达作为容纳诸言语的“思想”和持续思量的“默想”；人格化处加引号。
- source_word: ⲟⲩⲱϣ
