  language: zh_hans
  text: '《真理的福音》——父的乐园


    这就是父思想中的圆满；以下是他默想的话语。每一句、他所有的话，都是他独一旨意的作为；它们在他话语向外的显现中成为言语。当它们仍在他思想的深处时，那首先出来的“道”便将它们显明出来，同时还有“心智”；心智在静默的恩典中说出那独一的话。“道”被称为“思想”，因为在它们显明以前，它们已经在“思想”里面。于是，到了那位愿意如此者所喜悦的时候，“道”首先出来了。[a]


    “旨意”是父安息于其中的。没有他，什么也不会发生；没有父的旨意，也不会有任何事发生。然而，他的旨意无法探究；他的踪迹就是“旨意”。没有人能认识他；他也不是可供人察看、让人把握的。相反，他一愿意，他所愿的便是如此——即使在神面前，那景象无论如何也不令他们喜悦；这就是父的旨意。[b]因为父知道他们所有人的开端和终局；到了他们的终局，他必亲自迎接他们。终局就是认识那隐藏者；这隐藏者就是父。开端从他而出，凡从他而出的，也都要归回他那里。他们被显明，是为着他之名的荣耀和喜乐。


    父的名就是子。是父首先给那从他而出的起了名；他仍旧是自己，并生了那一位为子。父把自己的名赐给了他。父周围的一切都属于他；名属于他，子也属于他。子是可被看见的，名却是看不见的，因为名本身就是那看不见者的奥秘；这奥秘由父传入那些已经完全被它充满的耳中。[c]父的名确实没有被说出，却借着子显明了。这样，名是伟大的。


    那么，除了名所属的那一位，以及“名的众子”，还有谁能说出他的名——那伟大的名呢？父的名安息在这些众子里面，他们也同样安息在他的名里面。父既不是受生的，便只有他亲自生出这名，作为自己的名；这发生在他产生诸永世以前，为要使父的名在它们之上作主；这就是真实的名。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “道”与“心智”分别对应科普特文中的希腊借词 logos 和 nous；本句对“道”“思想”及其所显明者之间的关系表达得十分浓缩。
    reason: 说明技术词，并保留原文在指代和实体关系上的歧义。
  - marker: b
    text: 这一句的科普特文句法艰涩，也可理解为：“但他一愿意，他所愿的就成为事实——即使在神面前，那景象丝毫不令他们喜悦。”
    reason: 原文关于“所愿之事”“喜悦”及“景象”的连接关系不够明确，列出主要可行读法。
  - marker: c
    text: “由父传入”也可译作“从父那里来到”；原文强调耳朵完全被这奥秘或这名充满。
    reason: 保留介词关系及“这奥秘／这名”之间的语义关联。
  - marker: d
    text: “诸永世”译自希腊借词 aiōn 的复数；这里既可能指诸时代，也可能指被人格化的宇宙层级或存在者。
    reason: 避免在正文中把含混的技术词限定为某一种宇宙论解释。
