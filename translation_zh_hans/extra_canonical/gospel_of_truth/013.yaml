- from: '《真理的福音》——父的乐园


    这就是父思想中的圆满；以下是他默想的话语。每一句、他所有的话，都是他独一旨意的作为，在他“话语”的显现中成为一体。当它们仍在他思想的深处时，那首先出来的“道”便将它们显明出来，同时还有“心智”；心智在静默的恩典中说出那独一的话。“道”被称为“思想”，因为在它们显明以前，它们已经在“思想”里面。于是，到了那位意愿者的旨意所喜悦的时候，“道”首先出来了。[a]


    “旨意”是父安息于其中的。没有他，什么也不会发生；没有父的旨意，也不会有任何事发生。然而，他的旨意无法探究；他的踪迹就是“旨意”。没有人能认识他；他也不是可供人察看、让人把握的。相反，他所愿的，就是他所喜悦的。我是说，即使在神面前，那景象无论如何也不令他们喜悦，父的旨意仍然如此。[b]因为父知道他们所有人的开端和终局；到了他们的终局，他必亲自迎接他们。终局就是认识那隐藏者；这隐藏者就是父。开端从他而出，凡从他而出的，也都要归回他那里。他们被显明，是为着他之名的荣耀和喜乐。


    父的名就是子。起初，是父给那从他而出的起了名；那从他而出的就是父自己，父又生他为子。父把自己的名赐给了他。父周围的一切都属于他；名属于他，子也属于他。父是可以被看见的，名却是看不见的，因为名本身就是那看不见者的奥秘；这奥秘由他传入那些已经完全被它充满的耳中。[c]父的名确实没有被说出，却借着子显明了。这样，名是伟大的。


    那么，除了名所属的那一位，以及“名的众子”，还有谁能说出他的名——那伟大的名呢？父的名安息在这些众子里面，他们也同样安息在他的名里面。父既不是受生的，便只有他亲自生出这名，作为自己的名；这发生在他产生诸永世以前，为要使父的名在它们之上作主；这就是真实的名。[d]'
