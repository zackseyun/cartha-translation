  rationale: 既可表达父的意愿，又能承载本段实体化的用法；人格化处加引号，避免以中文大小写强作本体论判断。
- source_word: ⲓⲭⲛⲟⲥ (ichnos)
  choice: 踪迹
  rationale: 保留原文关于不可见者留下可辨痕迹的空间隐喻。
- source_word: ⲥⲟⲟⲩⲛⲉ
  choice: 认识
  rationale: 在“终局就是……”的句式中，“认识”比名词化的“知识”更自然，同时保留救赎性认知的意味。
- source_word: ⲡⲉⲉⲓ ⲉⲑⲏⲡ
  choice: 那隐藏者
  rationale: 保留其作为父之称号的实体化表达，不释义为单纯的“隐秘之神”。
- source_word: ⲡⲣⲉⲛ
  choice: 名
  rationale: 本页反复将“名”作为可赐予、可安息于其中并居于诸永世之上的实体性概念，故统一直译。
- source_word: ⲁⲓⲱⲛ
  choice: 永世
  rationale: 保留希腊—科普特宗教语境中的技术含义，不窄化为时间长度或特定等级的灵体。
theological_decisions:
- issue: “旨意”的实体化程度
  choice: 保留“父安息于其中”“他的踪迹”等人格化表述，并以引号提示特殊用法
  alternative: 将其全部译为普通抽象名词“意愿”
  rationale: 原文有明显实体化张力，但中文不宜借大小写或附加术语把它确定为独立神格。
- issue: 道、思想与心智之间的关系
  choice: 依原文并列和称谓逐项保留，不解释三者是否同一实体
  alternative: 将三者合并为父的内在理性或解释为不同流出者
  rationale: 原文关系有意浓缩且存在歧义，译文不作教派化体系整理。
- issue: “父的名就是子”
  choice: 直接保留等同陈述
  alternative: 释义为“子彰显父的名”
  rationale: 后文虽谈借子显明，但开头陈述更强；弱化为功能关系会消解原文的神学张力。
- issue: “那从他而出的就是父自己”
  choice: 保留自反性的强表达
  alternative: 译作“那从他而出的属于父”
  rationale: 科普特文自反结构支持身份或自身性的表达；不应为避免父子关系的张力而软化。
- issue: 诸永世（aeons）的性质
  choice: 音义兼顾译为“诸永世”，不解释为时代或天界实体
  alternative: 诸世代／诸灵体
  rationale: 上下文不足以无歧义地决定其纯时间义或位格化宇宙论意义。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。对“道”“思想”“心智”“旨意”等实体化概念使用引号而不用生造专名；重复“名”“安息”“出来／归回”等关键词，以保存原文的冥想式回环。正文覆盖所给第37—38页全部范围；第38页后半根据可辨科普特文本的连续句法译出，而不受较短咨询节录范围限制。
