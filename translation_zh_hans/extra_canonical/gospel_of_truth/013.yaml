  naturalness: 原译文庄重、可朗读，术语引号的处理也一致。修订时将个别绕折句略作顺序调整，以保留冥想式句法而不使现代汉语失去主干。
  terminology: “道”（logos）、“心智”（nous）、“旨意”（ⲟⲩⲱϣ）、“那隐藏者”、 “名”和“诸永世”的处理基本恰当。将“子是可见的”与紧接的“名却不可见”并置，较能反映原文的对照。
  issues:
  - severity: high
    issue: “他所愿的，就是他所喜悦的”误译并遗漏关键谓语关系。
    rationale: 原文在“但／而是”之后表达的是：当他愿意时，他所愿的就是如此（或成为事实）；随后才有“即使那景象……不令他们喜悦”的让步语。草稿将其改成“所愿＝所喜悦”，并没有译出所愿之事发生的意思。
  - severity: high
    issue: 把“他仍旧是自己”译为“那从他而出的就是父自己”。
    rationale: 此处自反语对应的是命名并生子者在生子／流出时“仍旧是自己”的陈述，并非把从父而出者直接等同为父。草稿既改变句法主语，也强化为原文未明确断言的身份等同。
  - severity: high
    issue: “父是可以被看见的”指称错误。
    rationale: “名属于他，子也属于他；可以看见他；但名却不可见”的连续对照中，可见者是子；随后“名”被说明为不可见者的奥秘。
  - severity: medium
    issue: 脚注b所列替代读法未充分纠正正文的误译。
    rationale: 脚注虽提出“所愿的就成为事实”，但正文仍采用“所愿的，就是所喜悦的”。应使正文采用较贴合原文的读法，并将句法连接的余留歧义留在注中。
  - severity: low
    issue: “由他传入”不如“由父传入”清楚。
    rationale: 该句在上下文中将奥秘传入充满的耳朵者归于父；正文明确“父”可避免中文代词在“不可见者／名／父”之间游移。
