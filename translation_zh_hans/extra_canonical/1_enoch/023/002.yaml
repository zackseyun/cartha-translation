base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/002.yaml
  text: And I saw a fire that burned and flowed[a], and it did not rest or cease from its course by day or by night[c][b], but continued in the same way.
translation:
  language: zh_hans
  text: 我看见一团火，燃烧着，奔流着[a]；它昼夜不停地奔流，既不歇息，也不停止奔流[b]，却始终如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奔流着”也可译作“奔行着”。原词着重表现火不断运动，并与后文“奔流”一词相呼应。
    reason: lexical_alternative
  - marker: b
    text: “奔流”也可理解为“奔行”“行程”或“流动”，强调这火的运动从不中断。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我看见
  rationale: 保留第一人称异象见证的常见表达；现代汉语自然、清楚。
- source_word: እሳተ
  choice: 一道火
  rationale: 此处首次引入异象中的火；量词“道”既适合呈现火流的形象，也不把它解释为普通的一团火。
- source_word: ዘይነድድ
  choice: 燃烧着
  rationale: 保留关系结构所表达的持续、主动燃烧状态。
- source_word: ዘይረውፅ
  choice: 奔流着
  rationale: 该词与后文表示奔行、进程的名词同源，重点是火的运动；“奔流”兼顾奔跑与流动的意象，避免误译为单纯“熊熊燃烧”。
- source_word: እንዘ ኢያዓርፍ
  choice: 不停……不歇息
  rationale: 体现动作持续而毫无休止；“不歇息”保留原文拟人而鲜明的形象。
- source_word: ወኢይነትግ
  choice: 也不止住
  rationale: 与“不歇息”构成并列，表达不中断，而不擅自限定为火不熄灭。
- source_word: እምሩፀቱ
  choice: 它的奔流
  rationale: 保留与前文“奔流着”的词根呼应，并呈现火持续向前运动的意象；也可理解为行程、奔行或流动。
- source_word: መዐልተ ወሌሊተ
  choice: 昼夜不停
  rationale: 简洁自然地表达白昼与黑夜都不间断的持续状态。
- source_word: አላ ከማሁሙ
  choice: 而是始终如此
  rationale: 原文结语简短且语义略难确定；此译保留“照样如此”的意思，并按语境最低限度地表达延续性。
