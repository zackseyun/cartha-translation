  text: And from there I went to another place[a], toward the west[b], to the ends of the earth.
translation:
  language: zh_hans
  text: 我从那里前往另一处，朝着西方，直到地极。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: 从那里
  rationale: 这是表示离开先前地点的指示性短语；“从那里”自然、清楚，也保留了叙事衔接。
- source_word: ሖርኩ
  choice: 我……去
  rationale: 原词是第一人称的移动动词；用普通的“去”忠实保留简洁的异象行程叙述。
- source_word: ካልአ መካነ
  choice: 另一处
  rationale: 指不同于前述地点的另一个地方；“另一处”简洁而庄重。
- source_word: መንገለ ዓረብ
  choice: 向着西方
  rationale: መንገለ 表示朝向，ዓረብ 指西方、日落之处；因此译作“向着西方”，不沿用咨询层中误作“东方”的旧释。
- source_word: እስከ አጽናፈ ምድር
  choice: 直到地极
  rationale: 这是启示文学中的宇宙地理表达；“地极”既凝练，又保留到达大地尽头的意象。
theological_decisions:
- issue: 异象行程中的宇宙地理
  choice: 保留“地极”的启示文学意象
  alternative: 大地遥远的边界
  rationale: 本书相关段落使用宏阔的宇宙地理语言；直译这一意象可避免把异象场景缩减为普通的地方旅行。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。按吉兹语原文将方向译为“西方”；本节无需脚注，因为该词在此处的方向义明确，而咨询层中关于“东方”的说明源于先前误译。
