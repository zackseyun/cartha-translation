base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/004.yaml
  text: And at that time Raguel[a], one of the holy angels who was with me, answered me and said to me, “This course of fire which you saw toward the west[c][b], it is the fire that drives all the lights of heaven.”
translation:
  language: zh_hans
  text: 那时，与我同在的众圣天使中的一位拉贵尔[a]回答我，说：“你所看见的那道向西运行的火，就是驱动天上所有光体的火。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉贵尔”是该天使名字的音译，也可译作“拉古耳”。
    reason: name_transliteration
lexical_decisions:
- source_word: አውሥአኒ
  choice: 回答我
  rationale: 该动词表示回答、回应；此处是天使向以诺解释异象，译作“回答我”符合对话语境。
- source_word: ቅዱሳን መላእክት
  choice: 圣天使
  rationale: 保留启示文学中对天使的常见称谓，并采用自然、庄重的现代汉语。
- source_word: ዘርኢከ
  choice: 你所看见
  rationale: 分析为关系词ዘ与动词“看见”的第二人称阳性单数完成式组合；不采纳旧译所误解的“灵”。
- source_word: ሩጸተ
  choice: 运行
  rationale: 该词表示奔行、运行或行程；结合天体与火的宇宙图景，“运行”既自然，也保留运动含义。
- source_word: መንገለ ዐረብ
  choice: 向西
  rationale: 方向结构指向西方；用“向西”清楚表达异象中的方位，而不额外构造“西方火路”。
- source_word: እሳት
  choice: 火
  rationale: 直译为“火”，并依句法分别用于所见的火及驱动天上光体的火。
- source_word: ይሰድድ
  choice: 驱动
  rationale: 该动词含驱赶、促使前行之意；“驱动”适合描述火推动天上光体运行的宇宙作用。
- source_word: ብርሃናተ ሰማይ
  choice: 天上所有光体
  rationale: 指天空中的发光天体；“光体”比单纯“光”更明确地呈现可运行的天上发光者，同时避免限定为某一种星体。
theological_decisions:
- issue: 所见之物的性质
  choice: 译为“向西运行的火”
  alternative: “引人迷失的灵”或“风”
  rationale: ዘርኢከ应为“你所看见”，ሩጸተ表示运行或行程；原文在此描述宇宙性的火，而非明确的人格化灵体。这样处理避免凭旧有误读引入灵界或邪灵观念。
- issue: 火与天上光体的关系
  choice: 保留“火驱动天上所有光体”的表述
  alternative: 将“驱动”弱化为“伴随”或解释为某种自然机制
  rationale: 原文以主动、强力的动词描述火的作用；直译保留启示文学的宇宙图景，不以现代天文学或特定神学体系加以改写。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“运行”保留启示文学中的动态宇宙图景；“光体”兼顾可读性与原文对天上发光体的概括。原始转写可能含扫描讹误，因此依清楚可辨的吉兹语词形及最新校勘意见处理，不沿用英文咨询层中已被纠正的误释。
