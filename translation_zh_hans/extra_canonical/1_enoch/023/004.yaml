  to: 那时，与我同在的众圣天使中的一位拉贵尔[a]回答我，说：“你所看见的那道向西运行的火，就是驱动天上所有光体的火。”
  rationale: 修订仅处理汉语句法和表达精确度：以“你所看见的那道向西运行的火”补足定语结构，并以“道”保留火的运行路线／行程这一动态意象。其余关键语义、名称译法和脚注锚点均予保留。
