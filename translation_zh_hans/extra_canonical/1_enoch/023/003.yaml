  text: And I asked[a], saying[b], “What is this that has no rest?”
translation:
  language: zh_hans
  text: 我问道：“这[a]没有安歇[b]的是什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这个”或“这一位”；原文的指示词指向以诺刚刚看见的对象或现象。
    reason: lexical_alternative
  - marker: b
    text: “没有安歇”也可译作“没有休息”或“不得安歇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልኩ
  choice: 我便问
  rationale: 该词是“询问、发问”的第一人称单数完成式；“我便问”自然地承接异象叙事，也保留直接发问的语气。
- source_word: እንዘ እብል
  choice: 问道
  rationale: 这是引出直接引语的常见说话结构。现代汉语用“问道”可同时表达发问和说出下文，避免生硬重复为“我问，说”。
- source_word: ዝንቱ
  choice: 这个
  rationale: 指向以诺刚看见的现象。“这个”保留指示作用，又不像“这个东西”那样把所指过早限定为物体。
- source_word: ምንት ውእቱ
  choice: 是什么
  rationale: 疑问词与系词合成直接的身份或性质询问；“是什么”简明，并与前置的关系结构相配。
- source_word: ዘአልቦ ዕረፍተ
  choice: 没有安歇的
  rationale: 该关系结构表达“没有休息、安歇”。“没有安歇”保留持续不息的异象意象，同时不额外解释其原因或性质。
theological_decisions:
- issue: 应将ዕረፍተ译为“安歇”，还是解释为“平安”或“停止”
  choice: 安歇
  alternative: 休息；停息
  rationale: 原词直接表达休息或安歇，而上下文可能涉及持续活动的宇宙性或审判性现象。“安歇”保留原有意象与神学张力，不把它解释成内心平安或彻底停止。
- issue: 是否明确“这个”所指的是某种物体、人物或现象
  choice: 保留为“这个”
  alternative: 这个东西；这一位；这种现象
  rationale: 原文使用指示词，具体所指依赖前文。保留较开放的“这个”，可避免在本节中加入原文没有明说的分类。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“我便问道”符合自然汉语引语习惯；疑问句保留原文先指示、后询问其为何物的结构。
