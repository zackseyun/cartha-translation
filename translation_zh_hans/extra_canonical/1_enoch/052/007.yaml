base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/007.yaml
  text: And in those days they will not be saved by gold or by silver[b][a], nor will they be able to flee.
translation:
  language: zh_hans
  text: 在那些日子，他们不能靠金银得救[a]，也不能逃走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不能靠金银脱险。”原文动词可表示安然无恙、脱险或得救。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን፡ በእማንቱ፡ መዋዕል
  choice: 在那些日子
  rationale: 将常见的启示文学引介语与时间短语自然合并，既保留预言性的庄重语气，也避免生硬直译“事情将会如此”。
- source_word: ኢይድኅኑ
  choice: 不能……得救
  rationale: 该词为 ደኅነ 的基本词干，主要是不及物意义“安然无恙、脱险、得救”，不是使役词干所表达的“拯救”。结合上下文，用“不能……得救”准确保留其非主动、非使役含义。
- source_word: እበወርቅ፡ ወእበብሩር
  choice: 靠金银
  rationale: 介词表示手段；否定结构中的金与银在现代汉语里自然合称“金银”，“靠”清楚表达财富作为无效的解救手段。
- source_word: ወኢይክሉ፡ ጐይየ
  choice: 也不能逃走
  rationale: 保留能力动词与逃跑动作的具体意象；“也不能”承接前一否定分句，符合现代汉语并列方式。
theological_decisions:
- issue: 得救的性质
  choice: 审判来临时不能凭金银脱险
  alternative: 把“得救”理解为后世教义体系中特指的灵魂救恩，或译成主动的“救自己”
  rationale: 本节语境强调财富无法使人逃过临到的审判。译文保留“得救”的基本意义，同时由“靠金银”和“逃走”限定其本地语境，不引入后世宗派性的救恩解释。
- issue: 动词语态与施事者
  choice: 译作“得救”，不明说是谁实施拯救
  alternative: 译作“救自己”或“被拯救”
  rationale: 吉兹语基本词干是不及物的，可表达安然、脱险或得救；“得救”既符合词形，也不额外指定隐含施事者，从而保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的启示文学语体。“靠金银”自然表达手段关系；“逃走”保留原文具体而有力度的动作意象。
