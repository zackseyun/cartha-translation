base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/004.yaml
  text: And he said to me[a], “All these that you have seen will belong to the dominion of his Anointed One[c][b], so that he may command and be mighty upon the earth.”
translation:
  language: zh_hans
  text: 他对我说：“你所看见的这一切，都必归于他的受膏者的权柄之下[a]，好叫他在地上发号施令，并施展大能[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都将归于他的受膏者的统治权。”原文表明异象中所见的一切将归于、服从于，或服务于他的受膏者的统治权。
    reason: 句法与词义存在归属、服从或服务于统治权的表达空间。
  - marker: b
    text: “施展大能”也可译为“大有能力”“刚强”或“得胜”。
    reason: 该动词涵盖强盛、具有能力、占优势及有效施展力量等相近含义。
lexical_decisions:
- source_word: ወይቤለኒ
  choice: 他对我说
  rationale: 保留典型的启示叙事引语公式；现代汉语自然、庄重。
- source_word: እሉ ኵሎሙ ዘርኢከ
  choice: 你所看见的这一切
  rationale: 保留指示语、全称范围和第二人称所见的关系从句，明确回指异象中的事物。
- source_word: ለስልጣነ
  choice: 归在……的权柄之下
  rationale: ስልጣን可指权柄、统治权或权势；结合介词ለ及系词结构，用此表达呈现这些事物受其统治支配的关系，同时不把它具体化为领土所有权。
- source_word: መሲሑ
  choice: 他的受膏者
  rationale: 保留第三人称阳性单数领属后缀-u所表达的“他的”，并将称号译为“受膏者”，而非仅作音译。
- source_word: እሙንቱ ይከውኑ
  choice: 都必归在……之下
  rationale: 该结构字面上有“它们将成为／将是”之意；与前置介词短语合看，表示所见的一切将处于受膏者的权柄之下。
- source_word: ከመ ይእዝዝ
  choice: 使他可以……发号施令
  rationale: 保留目的或结果意味以及动词“命令、下令”的具体力度，避免笼统译成“统治”。
- source_word: ወይትኃየል
  choice: 并彰显大能
  rationale: 原词涉及刚强、有能力或得胜；此译在现代汉语中自然地表达有效施展力量，同时以脚注保留其他可能。
- source_word: ዲበ ምድር
  choice: 在地上
  rationale: 直接传达空间范围，符合现代汉语习惯，不额外推定是“治理全地”还是单纯“在地上施行”。
theological_decisions:
- issue: መሲሑ中的称号及领属后缀
  choice: 他的受膏者
  alternative: 弥赛亚／受膏者
  rationale: መሲሑ带第三人称阳性单数领属后缀，不能省略“他的”；“受膏者”直接翻译称号，也避免把后期基督教专名用法强加于本段。
- issue: 所见之物与受膏者权柄的关系
  choice: 归在他的受膏者的权柄之下
  alternative: 为他的受膏者掌权之用／属于他的受膏者的统治权
  rationale: 原文的介词短语与“成为／是”结构可表示归属、服从或服务于其统治；正文采用自然汉语表达受其权柄支配，并在脚注中保留较形式对应的译法。
- issue: ይትኃየል所表达的能力
  choice: 彰显大能
  alternative: 刚强／得胜／施展权能
  rationale: 词义重点在力量及其有效性；不将其限定为军事得胜，也不削弱为单纯具有静态能力。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“发号施令”保留君王命令的力度；“他的受膏者”严格保留原文领属成分，不擅自确定“他”的具体所指。
