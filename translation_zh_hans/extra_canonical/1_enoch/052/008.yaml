  text: And iron shall not be for war[a].
translation:
  language: zh_hans
  text: 铁也不再用于战争[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语原文极为简短，直译为“铁也将不为战争”。其意思很可能是：铁将不再被用于战争。
    reason: 说明原文的简略措辞及其可能的功能性含义。
lexical_decisions:
- source_word: ወኢይከውን
  choice: 也不再用于
  rationale: ወ连接上文，否定未完成式ይከውን在预言语境中具有将来含义。结合后面的目的短语，译作“也不再用于”可自然表达将来的功能性否定。
- source_word: ኃጺን
  choice: 铁
  rationale: 该名词直接指铁，无须扩展为泛称的金属或赋予额外的象征意义。
- source_word: ለፀብእ
  choice: 用于战争
  rationale: 介词ለ在这里表示用途或目的，ፀብእ指战争、争战；“用于战争”简洁地保留原句含义。
theological_decisions:
- issue: 简短句式中否定的范围
  choice: 铁不再具有战争用途
  alternative: 铁将不复存在
  rationale: 名词“铁”之后有ለ引出的战争用途短语，因此最自然的理解是否定铁的战争用途，而非断言铁本身不再存在。脚注同时说明原文的简略形式，以免掩盖其措辞上的张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“不再用于战争”比生硬的逐字表达“将不为战争”更易懂，同时以脚注保留原文的简练与一定程度的歧义。
