base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/005.yaml
  text: And that angel of peace answered[a], saying to me, 'Wait a little[c][b], and every hidden thing that the Lord of Spirits has enclosed will be revealed to you.'
translation:
  language: zh_hans
  text: 那位和平天使回答我说：“稍等片刻[a]，万灵之主所封藏[b]的一切隐秘之事，都必向你显明。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “稍等片刻”也可译作“耐心等候片刻”或“暂且停留”；原文命令式动词兼有等候、停留的意思。
    reason: lexical_alternative
  - marker: b
    text: “封藏”也可译作“关闭起来”或“隐藏起来”；该词强调这些隐秘在被显明以前仍由万灵之主封存、保守。
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: 回答
  rationale: 这是叙事中常见的“回答、回应”动词；译作“回答”能保留对话语境。
- source_word: እንዘ ይብለኒ
  choice: 对我说
  rationale: 与前面的“回答”共同构成“回答我说”这一闪语式表达；如此处理符合现代汉语，又不倒置原文的叙事关系。
- source_word: መልአከ ሰላም
  choice: 和平天使
  rationale: 保留属格称号的形式和《以诺一书》的特有称谓，不泛化为“温和的天使”。
- source_word: ጽናሕ ንስቲተ
  choice: 稍等片刻
  rationale: 命令式动词可指等候或停留，副词表示短暂时间；“稍等片刻”自然且保留时间意味。
- source_word: ይትከሠት
  choice: 必向你显明
  rationale: 该词表达揭露、显现；“显明”保留启示文学语体，并以“必”体现将来陈述。
- source_word: ኵሉ ዘኅቡእ
  choice: 一切隐秘之事
  rationale: 保留原文全面而不特指的含义；“隐秘之事”在现代中文中庄重而清楚。
- source_word: ዘከለለ
  choice: 所封藏的
  rationale: 该动词含围住、关闭、藏起之意；“封藏”既保留空间性意象，也表达这些隐秘仍在灵主掌管之下，而不额外引入“封印”的专门概念。
- source_word: እግዚአ መናፈስት
  choice: 灵主
  rationale: 将本书反复出现的神圣称号凝练译为“灵主”，保留“诸灵之主”的基本构造，并适合作为一致使用的专名式称号。
theological_decisions:
- issue: 神圣称号 እግዚአ መናፈስት 的表达
  choice: 灵主
  alternative: 诸灵之主
  rationale: “灵主”简洁保留本书特有称号，并与现代中文经文语体相称；“诸灵之主”更显明属格关系，故列为可替代译法，但正文不把“灵”具体解释为天使、人的灵或其他灵体，以保留原文张力。
- issue: 隐秘事物被神封藏与后来显明的关系
  choice: 灵主所封藏……必向你显明
  alternative: 灵主所隐藏……将向你揭示
  rationale: 正文保留隐藏与启示都出于神掌管的表述，不进一步说明显明的媒介、时间或对象范围。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“回答我说”保留原文的闪语式叙事习惯；引语则力求自然。“灵主”作为《以诺一书》的特色神圣称号宜全书一致使用。
