base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/006.yaml
  text: And those mountains that your eyes saw—the mountain of iron, and the mountain of copper, and the mountain of silver, and the mountain of gold, and the mountain of soft metal, and the mountain of lead—all these will be before the Chosen One like wax before the fire, and like water that runs down from above upon those mountains; and they will become weak before his feet.
translation:
  language: zh_hans
  text: 你眼睛所看见的那些山——铁山、铜山、银山、金山、软金属的山[a]和铅山——这一切在蒙拣选者[b]面前，都必像火前的蜡，又像从高处流下、落在那些山上的水；它们必在他脚前变得软弱无力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所指的具体金属并不确定；有学者认为可能是锡，也可能是另一种较软的金属。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“被选者”。这是《以诺一书·比喻篇》中的一个重要称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: አድባር
  choice: 山
  rationale: 复数名词指异象中巨大的山体；译作“山”保留启示性场景的规模。
- source_word: ኃጺን
  choice: 铁
  rationale: 明确的金属名称，按字面译出。
- source_word: ጸሪቅ
  choice: 铜
  rationale: 该词也可能指青铜等铜合金；“铜”范围较宽，且不过度限定其成分。
- source_word: ብሩር
  choice: 银
  rationale: 该贵金属的常规对应词。
- source_word: ወርቅ
  choice: 金
  rationale: 该贵金属的常规对应词。
- source_word: ነጠብጣብ
  choice: 软金属
  rationale: 此处具体指何种金属并不确定；用概括性译法保留原文的不确定性，不武断定为锡。
- source_word: ዐረር
  choice: 铅
  rationale: 这是金属序列中依据最充分的对应词，也符合较软金属的语境。
- source_word: ለኅሩይ
  choice: 蒙拣选者
  rationale: 该表达在《比喻篇》中具有称号性质；此译法既体现被拣选的含义，又不预先把称号与后期术语等同。
- source_word: መዓረ፡ ግራ፡
  choice: 蜡
  rationale: 比喻强调蜡在火前熔化、失去抵抗力；“蜡”自然且准确。
- source_word: ዘይወርድ፡ እምላዕሉ
  choice: 从高处流到
  rationale: 保留水由上向下流动的动态意象，也符合现代汉语表达。
- source_word: ድኩማነ
  choice: 软弱无力
  rationale: 表达力量和抵抗能力的丧失，而不强行解释为物理崩塌。
theological_decisions:
- issue: 《比喻篇》中ለኅሩይ的称号性译法
  choice: 蒙拣选者
  alternative: 被选者；蒙拣选的那一位
  rationale: 保留其在本段中的重要称号功能，同时避免引入原文没有明示的后期基督论表述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。金属山的排比结构尽量贴近原文；末句保留“在他脚前”的空间意象，并以“软弱无力”表达失去力量与抵抗能力。
