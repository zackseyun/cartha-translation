base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/003.yaml
  text: And I asked the angel who went with me[a], saying, “What are these things that I have seen in secret?”
translation:
  language: zh_hans
  text: 我问那与我同行的天使说：“我暗中所看见的这些是什么？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暗中”也可译作“在隐秘之处”或“秘密地”。吉兹语原文表达隐秘之意，但究竟是指看见的地点、看见的方式，还是所见之物本身的隐秘性质，并不完全确定。
    reason: 词义存在多种可能，需保留原文歧义。
lexical_decisions:
- source_word: ተስእልክዎ
  choice: 我问
  rationale: 该动词表示询问；现代汉语用“问”最自然，也符合庄重叙事语体。
- source_word: መልአክ
  choice: 天使
  rationale: 在启示文学语境中指天上的使者，译作“天使”比泛称“使者”更贴切。
- source_word: ዘምስሌየ የሐውር
  choice: 那与我同行的
  rationale: 保留关系从句和陪伴先见者行进的含义；“同行”在现代汉语中自然简洁。
- source_word: እንዘ እብል
  choice: 说
  rationale: 这是引出直接引语的常见结构；汉语以“问……说”保留原文的叙事形式。
- source_word: ምንት ውእቱ / እሙንቱ እሉ እለ
  choice: 这些是什么
  rationale: 后续指示形式指向多个先前所见之物；中文“这些是什么”既自然，也不必额外补入“东西”。
- source_word: በኅቡእ
  choice: 暗中
  rationale: 该表达涉及隐藏、隐秘之意；“暗中”可修饰看见的方式或处境，同时以脚注保留其他可能解释。
- source_word: ርኢኩ
  choice: 我所看见的
  rationale: 汉语关系结构不必明确区分简单过去与现在完成；“所看见的”保留所见与当前提问的直接关联。
theological_decisions:
- issue: 启示异象中 በኅቡእ 的指向
  choice: 正文译作“暗中”，脚注说明也可能指“在隐秘之处”或所见之物本身隐秘
  alternative: 秘密地；在隐秘之处；我所看见的隐秘之物
  rationale: 原表达明确涉及隐秘性，但它究竟修饰地点、看见的方式，还是所见事物的隐蔽性质，并不完全确定；正文保持简洁，脚注保存这一启示文学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“与我同行的天使”清楚标明解释异象者的身份；疑问句简洁自然。脚注标记置于整句之后，对“暗中”的范围歧义作说明。
