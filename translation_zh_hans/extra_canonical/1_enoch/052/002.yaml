base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/002.yaml
  text: 'There my eyes saw all the hidden things of heaven that are to come: a mountain of iron[a], and a mountain of copper, and a mountain of silver, and a mountain of gold, and a mountain of soft metal[b], and a mountain of lead.'
translation:
  language: zh_hans
  text: 在那里，我的双眼看见了天上一切未来的隐秘之物[a]：一座铁山、一座铜山、一座银山、一座金山、一座软金属山[b]和一座铅山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未来的”所译原文含义较难确定，也可理解为“当时在那里的”或“存在于天上的”。
    reason: alternative_reading
  - marker: b
    text: 这里的第五种金属名称不确定，可能指软质或混合金属；有些解释认为是锡或琥珀金（一种金银合金）。
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: 在那里
  rationale: 保留引入异象场景的方位意味；现代汉语自然明晰。
- source_word: ርእዩ አዕይንትየ
  choice: 我的双眼看见了
  rationale: 原文明确提到“我的眼睛”，不简化为“我看见”，以保留异象叙述的鲜明感。
- source_word: ኵሎ ኅቡኣተ ሰማይ
  choice: 天上一切……隐秘之物
  rationale: ኅቡኣተ指隐藏、隐蔽之物；译作“隐秘之物”既透明，又避免把它过度术语化为特定意义的“奥秘”。
- source_word: ዘይኩን ሀሎ
  choice: 将要显现的
  rationale: 依启示文学语境保留前瞻意味，同时用“显现”衔接先知所见之事；因原语结构难解，脚注列出静态理解。
- source_word: ደብረ
  choice: 一座……山
  rationale: 原文在每种材料前重复“山”；汉语用连续的“一座……山”尽量保留庄严的列举节奏。
- source_word: ኃጺን
  choice: 铁
  rationale: 该金属名称的通常对应词。
- source_word: ጸሪቅ
  choice: 铜
  rationale: 可指铜或铜合金；“铜”是较基础、不过度限定的材料名称。
- source_word: ብሩር
  choice: 银
  rationale: 该金属名称的通常对应词。
- source_word: ወርቅ
  choice: 金
  rationale: 该金属名称的通常对应词。
- source_word: ነጠብጣብ
  choice: 软金属
  rationale: 具体所指不确定，可能是某种软质或混合金属；采用非特指译法，避免未经充分证据便确定为锡或琥珀金。
- source_word: ዐረር
  choice: 铅
  rationale: 该金属名称的通常对应词，也符合此处金属序列。
theological_decisions:
- issue: “天上的隐秘之物”是指未来将出现的事物，还是现存于天上的隐秘事物
  choice: 采用前瞻性译法“将要显现的”
  alternative: “当时在那里的”或“存在于天上的”
  rationale: 下文呈现象征性的群山，并处于启示和审判的异象语境中，前瞻性理解较为贴切；但吉兹语措辞本身难解，因此不把静态理解排除，而在脚注中明确保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“我的双眼”以及逐项重复“一座……山”的异象笔调；对两处真实的原文不确定性以脚注呈现，不在正文中作过度具体化处理。
