base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/001.yaml
  text: And after those days[a], in that place where I had seen all the visions of what is hidden, for I had been snatched up by a whirlwind[c][b], and it had carried me westward—
translation:
  language: zh_hans
  text: 那些日子以后，在我曾看见一切关于隐秘之事的异象[c]的那地方——因为我曾被旋风卷起[b]，它把我带往西方——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节在原文中是承接下一节的未完句，意思延续到“在那里，我的眼睛看见……”。
    reason: syntax_note
  - marker: b
    text: 原文近似“被风的旋风卷起”，是强调风势猛烈的表达；也可译作“被暴风卷走”。
    reason: literal_and_lexical_alternative
  - marker: c
    text: 也可理解为“一切隐秘的异象”。原文此处的关系短语可指异象所关乎的隐秘之事，也可直接修饰“异象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ እማንቱ መዋዕል
  choice: 那些日子以后
  rationale: 保留时间承接公式和指示上的距离感，不泛化为“后来”。
- source_word: በውእቱ መካን
  choice: 在那地方
  rationale: 具体保留异象场景的空间指向。
- source_word: ርኢኩ ኵሎ ራእያተ ዘበኅቡእ
  choice: 我曾看见一切隐秘之事的异象
  rationale: 将关系短语理解为异象所关乎的隐藏之事，同时以脚注保留“隐秘的异象”这一句法可能。
- source_word: እስመ ተመሠጥኩ
  choice: 因为我曾被……卷起
  rationale: 明确译出因果连词እስመ，并以被动态表现突然而有力的带离，仍不判定这是肉身经历还是出神异象。
- source_word: በአውሎጋኒ ነፋስ
  choice: 被旋风卷起
  rationale: 用自然现代汉语表达强烈的风暴搬运意象；原文近似“风的旋风”的强化表达另见脚注。
- source_word: ወወሰደኒ ዓረበ
  choice: 它把我带到西方
  rationale: 把ዓረበ按方向理解，保留风将叙述者向西带去的运动。
theological_decisions:
- issue: 异象中的移送具有什么性质
  choice: 我曾被旋风卷起
  alternative: 我被风之灵带走／我被暴风攫去
  rationale: 原文强调强力的风载移送，但没有明确说明是肉身移动还是出神状态；译文保留这种张力，不作教义化判定。
- issue: 本节与下一节的句法衔接
  choice: 以破折号保留未完的场景铺陈
  alternative: 将本节整理为独立完整句
  rationale: እስመ引出的解释从句说明以诺如何到达该处，主要动作延续至下一节；不宜把本节改造成自足叙事。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“卷起”保留突然而强烈的动作；双破折号表现原文解释性插入以及本节向下一节延续的未完结构。
