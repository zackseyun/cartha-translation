base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/001.yaml
  text: And it came to pass after this that his name was lifted up during his lifetime before that Son of Man and before the Lord of Spirits[b][a], away from those who dwell on the dry ground.
translation:
  language: zh_hans
  text: 此后，以诺还活着的时候，他的名被提升到那位人子和万灵之主面前[a]，远离住在干地上的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的名被提升”。这表达也可能是指以诺本人尚在人世时，被提升到那位人子和万灵之主面前。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“远离住在地上的人”。原文更具体地说“干地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተለዓለ፡
  choice: 被提升
  rationale: 保留向上升举的空间意象，不预先限定为被接去或受尊崇。
- source_word: ስሙ፡
  choice: 他的名
  rationale: 按原文保留“名”的表达，使“名”与本人可能相互指代的含混不被抹平。
- source_word: ሕያው፡
  choice: 以诺还活着的时候
  rationale: 将其理解为事件发生时以诺仍然活着的时间说明；补出以诺以避免现代汉语中的代词歧义。
- source_word: በኀቤሁ፡ ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው፡
  choice: 到那位人子……面前
  rationale: 表达朝向并进入该人物面前的意味；“那位”保留指示成分，“人子”保留本段的庄重称号用法。
- source_word: እግዚአ፡ መናፍስት፡
  choice: 万灵之主
  rationale: 采用自然庄重的中文固定式表达，指统管诸灵者，并维持《以诺一书》中的称号性质。
- source_word: እምእለ፡ የኃድሩ፡ ዲበ፡ የብስ።
  choice: 离开了那些住在干地上的人
  rationale: 保留“干地”的具体宇宙图景，同时以“离开了”呈现与地上居民分离的关系。
theological_decisions:
- issue: “他的名被提升”是保留字面习语，还是直接解释为以诺本人被接去
  choice: 正文保留“他的名被提升”，并在注释中说明也可能指以诺本人被提升
  alternative: 他活着被接去；他的声名受到尊崇
  rationale: 原文明确说“他的名”，而“名”在相关语言习惯中可与本人紧密相连。直译能保留文本的特殊表达和有意的张力。
- issue: 如何处理“人子”称号
  choice: 那位人子
  alternative: 那个人子；那位属人的一位
  rationale: 该表达在《比喻篇》的异象语境中具有称号色彩；保留“那位”反映原文指示语，但不把后期神学含义额外带入。
- issue: 如何理解 ሕያው
  choice: 作为时间说明译为“以诺还活着的时候”
  alternative: 修饰“名”，译为“他活着的名”
  rationale: 时间性理解更符合此句叙事功能，也避免现代汉语中难以理解的“活着的名”；但不据此把“他的名”改写为“他本人”。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“此后”自然对应叙事公式；明说“以诺”以消除“他还活着时，他的名”可能造成的指代含混。正文和脚注标记一一对应。
