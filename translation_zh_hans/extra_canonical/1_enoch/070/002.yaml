- from: 这事以后，他的名在他有生之年[a]，从那些住在大地上的人中被高举到那位“人子”和诸灵之主那里。他乘着灵的车辇[b]被提上去，他的名便从他们中间消失了[c]。从那天起，我不再被算在他们中间[d]。他把我安置在两个方位之间，就是北方与西方之间；在那里，天使拿起绳索，要为我量出一个地方，给蒙拣选的人和义人。我在那里看见古代的先祖和义人；他们自古以来[e]就住在那地方。
  to: 这事以后，他的名在他仍活着的时候[a]，从那些住在地上的人中被高举到那位“人子”和诸灵之主那里。他乘着灵的车辇[b]被提上去；他的名便离开了他们中间[c]。从那天起，我不再被列在他们中间[d]。我被安置在两个灵之间，就是北方与西方之间；在那里，天使拿起绳索，要为我量出一个地方，给蒙拣选的人和义人。我在那里看见古代的先祖和义人；他们自古以来[e]就住在那地方。
  rationale: 修订恢复原文不可省略的“两个灵之间”，并以“北方与西方之间”作为其后的进一步定位。其余调整使“名离开他们中间”和“我不再被列在他们中间”更贴近原文的语义范围，同时保留有关上升、名的离开及时间范围的必要歧义。
