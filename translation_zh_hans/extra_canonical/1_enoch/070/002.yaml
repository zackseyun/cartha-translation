  yaml_path: translation/extra_canonical/1_enoch/070/002.yaml
  text: And he was lifted up on the chariot of the spirit[b][a], and his name vanished from among them.
translation:
  language: zh_hans
  text: 这事以后，他的名在他仍活着的时候[a]，从那些住在地上的人中被高举到那位“人子”和诸灵之主那里。他乘着灵的车辇[b]被提上去；他的名便离开了他们中间[c]。从那天起，我不再被列在他们中间[d]。我被安置在两个灵之间，就是北方与西方之间；在那里，天使拿起绳索，要为我量出一个地方，给蒙拣选的人和义人。我在那里看见古代的先祖和义人；他们自古以来[e]就住在那地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 该词本义为“活着的”。这里可理解为：他的名在他仍活着时被高举；原文简练的句法也容许较贴字面的理解。
    reason: syntactic_ambiguity
  - marker: b
    text: 原文直译为“灵的诸车辇”；“灵”为单数，“车辇”为复数。
    reason: formal_equivalence
  - marker: c
    text: 原文直译为“他的名从他们中间出去了”或“离开了他们中间”。
    reason: lexical_alternative
  - marker: d
    text: 或译：“我不再被带到他们中间。”原动词可有“牵引、带去”或“列入、算在”的意味。
    reason: lexical_ambiguity
  - marker: e
    text: 或译：“从永恒以来”或“从世代之初”。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ተለዐለ
  choice: 被高举／被提上去
  rationale: 该动词可表示上升、被举起或被提升。首处的主语是“他的名”，译作“被高举”较自然；第二处描写乘车辇而上，译作“被提上去”可保留空间运动及被动意味，又不判定这是肉身迁移、异象中的运送还是地位上的尊荣。
- source_word: ሕያው
  choice: 在他有生之年
  rationale: 该词本义为“活着的”。结合“他的名”理解为他的名在他仍活着时被高举；脚注保留较贴字面的另一种理解。
- source_word: ወልደ፡ ዕጓለ፡ እመሕያው
  choice: “人子”
  rationale: 这是本书反复出现的称号，直译为“人子”，并用引号表明其称号性质，不预先规定其身份。
- source_word: እግዚአ፡ መናፍስት
  choice: 诸灵之主
  rationale: 保留“主”与复数“诸灵”的结构，符合本书固定神圣称号的用法。
- source_word: ሠረገላተ፡ መንፈስ
  choice: 灵的车辇
  rationale: 原文“车辇”为复数，“灵”为单数属格。中文以可作集合称呼的“车辇”传达异象中的运载工具，避免“战车”额外引入战争含义。
- source_word: ወወፅአ፡ ስም፡ በማእከሎሙ
  choice: 他的名便从他们中间消失了
  rationale: 字面结构近于“他的名从他们中间出去”。按语境译为“消失”，同时在脚注交代字面表达，不把“名”擅自改成“本人”。
- source_word: ኢተስሕብኩ፡ በማእከሎሙ
  choice: 我不再被算在他们中间
  rationale: 此处动词可涉及牵引、列入或计算；“被算在……中间”最符合人物不再属于地上群体的语境，同时保留被动形式。
- source_word: መስዕ፡ ወዐረብ
  choice: 北方与西方
  rationale: 按两个方位词的通常含义翻译，不将其合并解释为“西北方”，以保存原文“两者之间”的表述。
- source_word: አሕባላተ
  choice: 绳索
  rationale: 直译测量所用的绳索，与随后“量出一个地方”相呼应。
- source_word: እምዓለም
  choice: 自古以来
  rationale: 该短语可表示“从世代之初”“自古”或“从永恒”。这里修饰居住的久远时间，译作自然且不过度形而上化的“自古以来”。
theological_decisions:
- issue: 以诺被提升的性质
  choice: 保留被动的向上运动，不说明是肉身迁移、异象运送还是尊荣提升
  alternative: 明确译成“升天”或仅作“得尊荣”
  rationale: 原文动词及车辇意象支持向上的移动，却没有在此明确界定其存在方式；译文因此保留神学张力。
- issue: “人子”的身份
  choice: 作为称号直译，不在正文中增添身份说明
  alternative: 直接认定为某一特定末世或基督论人物
  rationale: 本句只给出称号；翻译不应把后来的教义认定写入正文。
- issue: “他的名消失”与人物身份的关系
  choice: 保留“名”为语法主语
  alternative: 意译为“他从他们中间消失”
  rationale: 原文刻意说“名”离开或消失；保留这一措辞可避免抹平名字、身份与人物本身之间的启示性张力。
- issue: “自古以来”的时间范围
  choice: 使用不强制表达绝对永恒的时间说法
  alternative: 译为“从永恒以来”
  rationale: 源语短语可涵盖久远时代或永恒；上下文不足以强制采用形而上意义的“永恒”。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“诸灵之主”“人子”“蒙拣选的人”等保留本书的启示文学语域；避免生硬音译和教派化术语。源文所给内容明显长于英语咨询层，正文依完整高可信度吉兹文见证翻译，而不随英语层的截短范围。
