base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/005.yaml
  text: You have made all things[a], and authority over all is with you; and all things are uncovered and laid bare before you, and you see all things, and there is nothing that can hide itself from you.
translation:
  language: zh_hans
  text: 你造了万物，统管万有的权柄在你手中；万物在你面前都毫无遮蔽，显露无遗[a]。你看见一切，没有什么能向你隐藏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“万物在你面前都是揭开的、显明的。”两个近义表达并用，强化万物在上帝面前完全显露的画面。
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርከ
  choice: 你造了
  rationale: 该动词可指“做、造”。在以“万物”为宾语的宇宙性语境中，“造了”自然表达上帝的全面创造作为，同时不额外限定为某种关于创造方式的教义表述。
- source_word: ኵሎ
  choice: 万物／万有／一切
  rationale: 按不同句法位置分别采用现代汉语中最自然的对应词，同时保留原文反复强调总体性的修辞效果。
- source_word: ስልጣነ
  choice: 权柄
  rationale: 该词表示统治权、主权或能力；“权柄”兼具合法权威与治理之力的含义，适合祷告中对上帝普世统治的承认。
- source_word: ምስሌከ
  choice: 在你手中
  rationale: 原义为“与你同在／在你那里”，此处表示权柄归于上帝并由他掌握。“在你手中”是自然的现代汉语表达，未将其抽象化为教义术语。
- source_word: ክሡት
  choice: 毫无遮蔽
  rationale: 该词指揭开、暴露的状态；此译保留具体的无遮蔽意象，并与后一词形成强化性的并列表达。
- source_word: ግሁድ
  choice: 显露无遗
  rationale: 该词有明显、公开、显露之义。与“毫无遮蔽”并列，表现万物在上帝面前彻底暴露，而非仅笼统地说“被知道”。
- source_word: ትሬኢ
  choice: 你看见
  rationale: 直译为“你看见”，简明自然，并保留原文以视觉谓语表达上帝洞察一切的具体方式。
- source_word: ዘይትከሀል
  choice: 能
  rationale: 该表达表示能力或可能性；用“能”准确而自然地传达在上帝面前无法藏匿之意。
- source_word: ይትኀባእ
  choice: 向你隐藏
  rationale: 该形式带有自我隐藏或成为隐蔽的意味。“向你隐藏”在汉语中自然表达任何事物都不能躲避上帝的视察。
theological_decisions:
- issue: 是否用“全能、全知”等抽象教义术语概括本节
  choice: 保留“造、权柄、显露、看见、隐藏”等具体谓语和意象
  alternative: 你是全能全知的／万物都为你所知
  rationale: 本节确实蕴含上帝的普遍主权与无所不察，但吉兹语以具体而鲜明的表达呈现这些观念。译文不以较晚形成的抽象神学术语取代原文措辞。
- issue: “权柄与你同在”的所有关系如何表达
  choice: 统管万有的权柄在你手中
  alternative: 统管万有的权柄属于你／与你同在
  rationale: 原文可保留较字面的空间关系，也可按语境理解为掌有权柄。“在你手中”既自然，又维持权柄由上帝掌握的形象，没有把句意过度体系化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“万物”“万有”“权柄”适合古代祷告语境，又为普通读者所能理解；避免文言倒装及过度抽象的神学措辞。脚注标记置于其所解释的并列短语之后。
