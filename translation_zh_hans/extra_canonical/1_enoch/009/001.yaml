base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/001.yaml
  text: And then Michael[a], Uriel, Raphael, and Gabriel looked down from heaven and saw much blood being poured out upon the earth[b], and all the lawlessness being done upon the earth.
translation:
  language: zh_hans
  text: 那时，米迦勒、乌列、拉斐尔和加百列从天上俯视，看见许多血正流在地上[a]，又看见一切不法之事都在地上发生[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正流”也可译作“流淌”或“被倾倒”。吉兹语此处的动词较难确定；少数解释把它与“血发声呼喊”的意象联系起来。正文采用与“血”和“在地上”最直接相合的具体画面。
    reason: lexical_alternative
  - marker: b
    text: 原文两次使用“在地上”，这里保留这一重复，以突出大地是流血和不法之事发生的场域。
    reason: literary_emphasis
lexical_decisions:
- source_word: እሜሃ
  choice: 那时
  rationale: 作为时间推进语，引出新的场景；“那时”自然、庄重，也保留叙事顺序。
- source_word: ሐወጹ
  choice: 俯视
  rationale: 结合“从天上”，该动词表达由上向下察看；“俯视”简洁地保留了异象中的垂直视角。
- source_word: እምሰማይ
  choice: 从天上
  rationale: 直接保留众天使察看的起点和属天视角。
- source_word: ወርእዩ
  choice: 看见
  rationale: 采用自然的现代叙事用语，不额外增强原文语气。
- source_word: ብዙሐ ደመ
  choice: 许多血
  rationale: 保留原文具体而鲜明的“血”这一意象，不抽象化为“流血事件”。
- source_word: ዘይትከዓው
  choice: 倾流
  rationale: 与“血”和“在地上”连用时，“倾流”能保留血被大量倒出、流出的具体画面；词义存在一定困难，故在脚注列出相关解释。
- source_word: በዲበ ምድር
  choice: 在地上
  rationale: 两次照译重复的地点短语，保留原文对大地作为暴行与悖逆发生场域的强调。
- source_word: ኵሎ ዓመፃ
  choice: 一切不法之事
  rationale: 该词泛指邪恶、悖逆和越法行为；“不法之事”保留其道德及律法层面的广度，不局限于暴力。
- source_word: ዘይትገበር
  choice: 都行
  rationale: 以简洁的被动含义表达“被施行、被做出”，并与“不法之事”自然搭配。
theological_decisions:
- issue: 天使名字的译法
  choice: 米迦勒、乌列、拉斐尔、加百列
  alternative: 按吉兹语形式作更直接的音译
  rationale: 采用简体中文读者较熟悉且已约定俗成的圣经人名译法，同时不改变原文所列的四位天使。
- issue: 血的具体意象与解释性表达
  choice: 许多血倾流在地上
  alternative: 发生了大量流血之事；血在呼喊
  rationale: 正文保留异象中可见的具体景象，不将其抽象概括为“流血事件”，也不把较不确定的“呼喊”解释写入正文。
- issue: “不法”一词的范围
  choice: 一切不法之事
  alternative: 一切暴行；一切不义
  rationale: 原词的含义不限于肉体暴力；“不法之事”较能保持其广泛的道德与律法张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“俯视”体现从天而下的观看方向；“倾流”保留启示文学鲜明的血之意象；重复“在地上”以保存原文的修辞强调。
