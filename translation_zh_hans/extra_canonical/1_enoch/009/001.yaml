revisions:
- from: 那时，米迦勒、乌列、拉斐尔和加百列从天上俯视，看见许多血倾流在地上[a]，也看见一切不法之事都行在地上[b]。
  to: 那时，米迦勒、乌列、拉斐尔和加百列从天上俯视，看见许多血正流在地上[a]，又看见一切不法之事都在地上发生[b]。
  rationale: 修订仅处理现代汉语的搭配与句法。“正流在地上”比“倾流在地上”自然，仍保留原文的具体血之意象以及词义争议；“都在地上发生”替代不自然的“都行在地上”，并保持原文对地上作为罪恶发生之地的重复强调。人名、时间标记和“不法之事”均维持不变。
