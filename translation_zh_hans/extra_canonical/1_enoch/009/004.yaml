base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/004.yaml
  text: And they said to their Lord[a], the King, “For you are Lord of lords, God of gods, and King of kings, and the throne of your glory is through all the generations of eternity, and your name is holy and glorious through all eternity[d][c][b], and blessed.”
translation:
  language: zh_hans
  text: 他们对万王之主[b]说：“因为你是万主之主、万神之神、万王之王；你荣耀的宝座存到永世万代，你的名圣洁而当受赞美，直到永远，并且当受称颂。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本在“当受称颂”之后还加“并且得尊荣”或“并且荣耀”。
    reason: textual_variant
  - marker: b
    text: 这里的吉兹语句法较为紧缩；也有人理解为“他们对他们的主、那位王说”。
    reason: alternative_reading
lexical_decisions:
- source_word: ለእግዚኦሙ ለነገሥት
  choice: 对万王之主
  rationale: 按吉兹语前置代词性后缀的结构理解为“众王之主”，既保留“主”的神圣称号，也准确表达后接复数“众王”的属格关系。
- source_word: እስመ
  choice: 因为
  rationale: 保留原文引出颂赞理由的连接词，不将其省略。
- source_word: እግዚኦሙ ለአጋእዝት
  choice: 万主之主
  rationale: 保留原文最高级式的称号及其与“万神之神、万王之王”的排比。
- source_word: አምላኮሙ ለአማልክት
  choice: 万神之神
  rationale: 用现代中文中庄重而易懂的公式表达神超越一切称为神者的地位，不将其改写为泛泛的“至高神”。
- source_word: ንጉሦሙ ለነገሥት
  choice: 万王之王
  rationale: 维持三重称号的平行结构和颂赞语气。
- source_word: መንበረ ስብሐቲከ
  choice: 你荣耀的宝座
  rationale: 保留“宝座”这一具体的天启意象，同时以自然中文表达其与“荣耀”的关系。
- source_word: ውስተ ኵሉ ትውልደ ዓለም
  choice: 存到永世万代
  rationale: 此处ዓለም在颂赞公式中表示时代、永恒，而非空间意义的“世界”；译文同时保留“世代”和永恒的时间跨度。
- source_word: ስምከ ቅዱስ ወስቡሕ ውስተ ኵሉ ዓለም ወቡሩክ
  choice: 你的名圣洁而当受赞美，直到永远，并且当受称颂
  rationale: 依原文次序保留“圣洁—受赞美—直到永远—受称颂”的层次；将两个近义词分别译作“当受赞美”和“当受称颂”，避免把末项提前或合并。
theological_decisions:
- issue: 是否压缩三重神圣称号
  choice: 完整保留“万主之主、万神之神、万王之王”
  alternative: 概括为“至高的主和神”
  rationale: 原文的排比是天上颂赞的核心修辞，也表达神对一切权柄的至高地位；压缩会削弱其文学和神学张力。
- issue: 如何处理开头称呼的压缩句法
  choice: 正文译作“万王之主”
  alternative: “他们的主、那位王”
  rationale: 吉兹语更适合按前置代词性后缀结构理解为“众王之主”；但抄本文句压缩，且旧译存在不同断句，故以脚注保留另一种理解。
- issue: 是否纳入末尾括注词ወከቡድ
  choice: 不纳入正文，仅以异文脚注说明
  alternative: 在正文加入“并且尊荣”或“并且荣耀”
  rationale: 底本将该词置于方括号，表明文本不确定；正文采用较稳妥读法，同时公开记录可能的增文。
translation_notes:
  register: 采用现代、庄重而口语可懂的颂赞体。以“万主之主、万神之神、万王之王”保存原文排比；用“存到永世万代”和“直到永远”清楚表达时间意义，避免将ዓለም误解为空间性的“世界”。
