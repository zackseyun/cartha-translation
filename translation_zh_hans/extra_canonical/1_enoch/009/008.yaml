base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/008.yaml
  text: And they went to the daughters of men on the earth[a], and they lay with them, with those women[c][b], and they defiled themselves and revealed to them every sin.
translation:
  language: zh_hans
  text: 他们到地上的人类女子那里，与那些女子同寝，玷污了自己，又把一切罪恶揭示给她们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖሩ ኀበ
  choice: 他们到……那里
  rationale: 按通常的移动动词理解为“去、到”，由下句明确表达性关系；不在本句预先加入“进去”的性含义。
- source_word: አዋልደ ሰብእ
  choice: 人类女子
  rationale: 表达“人的女儿们”与天上存在的对比，同时采用现代汉语自然说法，避免把“人”误解为仅指男性。
- source_word: በዲበ ምድር
  choice: 地上的
  rationale: 保留原文的空间限定及天上与地上的宇宙性对照。
- source_word: ወስከቡ ምስሌሆን
  choice: 与……同寝
  rationale: 明确而庄重地表达性结合，并保持经文体语域。
- source_word: ምስለ እልኩ አንስት
  choice: 与那些女子
  rationale: 将重复语保留下来，视为对前述人类女子的复指和强调；不擅自译成“妻子”。
- source_word: ወረኵሱ
  choice: 玷污了自己
  rationale: 保留反身意义，也兼具道德与礼仪不洁的色彩。
- source_word: ወአግሀዱ ሎን
  choice: 又把……揭示给她们
  rationale: 该动词表示显明、披露；“揭示”符合守望者泄露禁忌知识的上下文，又不缩窄为正式教导。
- source_word: ኵሎ ኃጢአተ
  choice: 一切罪恶
  rationale: 保留原文概括性、全面性的谴责，不限定为某一类技艺或罪行。
theological_decisions:
- issue: 守望者所带来败坏的性质
  choice: 经文同时陈述不正当的性结合、自我玷污和对罪恶的揭示。
  alternative: 把末句仅限于法术、技术等具体秘传知识，或将整节败坏只理解为性行为。
  rationale: 吉兹文分别陈述同寝、玷污自己以及揭示“一切罪恶”；译文保留这些并列层面，不将广泛的道德指控缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“同寝”比口语化的“睡了”更适合经文语体；保留“那些女子”的复指，虽略显重复，却反映原文结构。英译所附脚注的位置与所述词项疑似错配，且不由现有吉兹正文支持，因此本稿不移植这些脚注。
