base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/003.yaml
  text: And now[a], to you, the holy ones of heaven, the souls of men make their plea, saying[b], ‘Bring our case before the Most High.’
translation:
  language: zh_hans
  text: 如今，天上的圣者啊，人类的灵魂向你们陈情，说：“请将我们的案件[a]呈到至高者面前。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “案件”也可译为“诉求”或“申诉”。原文带有司法语境，可指呈请审理的案件，也可含请求伸张正义之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 如今
  rationale: 保留时间兼话语转折的作用；现代汉语自然庄重，不额外强化语气。
- source_word: ለክሙ ለቅዱሳነ ሰማይ
  choice: 你们这些天上的圣者
  rationale: 将与格对象明确为受诉者，并保留“圣者”这一启示文学中对天上存在者的宽泛称谓，避免直接限定为某一类天使。
- source_word: ይስእዩ
  choice: 向你们陈情
  rationale: 体现恳求、申诉的动作及司法语境，也比直译为“请求”更能承接后文呈案的意象。
- source_word: ነፍሳተ ሰብእ
  choice: 人类的灵魂
  rationale: 保留原文“灵魂”的人论用语，同时用“人类”避免“男人们”的误解。
- source_word: እንዘ ይብሉ
  choice: 说
  rationale: 自然表达伴随性的引语导入，不增添原文没有的时态或语气。
- source_word: አብኡ ለነ ፍትሐ
  choice: 请把我们的案件呈到
  rationale: 将ፍትሐ理解为等待裁断的诉讼案件，而非已经作出的判决；“呈到”保留转呈天上法庭的方向感。
- source_word: ኀበ ልዑል
  choice: 至高者面前
  rationale: 既表达趋向至高者，也保留在神圣法庭前呈案的司法意象。
theological_decisions:
- issue: “天上的圣者”的身份
  choice: 保留为“天上的圣者”
  alternative: 译作“天使”或“天上的圣徒”
  rationale: 上下文支持天上存在者作为受诉对象，但原词本身较宽泛；不将其过早收窄为特定天使阶层，也不导入后来关于人类圣徒的观念。
- issue: ፍትሐ所指的司法含义
  choice: 案件
  alternative: 公义、申冤、审判
  rationale: 此处灵魂请求把诉求带到至高者面前，重点是待审的案情或申诉。“案件”保留法庭语域，并避免暗示判决已经作出；脚注说明其也可含求公断、伸张正义之意。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“陈情—案件—呈到……面前”共同维持原文的司法场景；不使用过度古雅的“尔等”“陈于”，也不把“圣者”解释性改写为“天使”。
