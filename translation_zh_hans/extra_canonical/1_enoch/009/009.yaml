base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/009.yaml
  text: and the women have borne giants[b][a], and by this the whole earth has been filled with blood.
translation:
  language: zh_hans
  text: 而那些女人[b]生下了巨人[a]，由此整个大地都充满了血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，“巨人”指守望者与人间女子非法结合所生的后裔；吉兹语在这里仅简短陈述其结果。
    reason: cross_reference
  - marker: b
    text: 或译：“女人们生下了巨人。”
    reason: previous_rendering
lexical_decisions:
- source_word: አንስት
  choice: 那些女人
  rationale: 复数名词意为“女人”；结合附着的主题标记及上文，译作“那些女人”以保留回指关系，同时不把她们明确说成“妻子”。
- source_word: ወለዳ
  choice: 生下了
  rationale: 直接表达“生育、产下”的完成性结果，符合本句叙事语境，也比“孕育”更具体。
- source_word: ረዓይተ
  choice: 巨人
  rationale: 在守望者与人间女子结合的上下文中，指所生的巨人后裔；沿用传统而清楚的称谓，不扩写为“怪物”。
- source_word: በዘ
  choice: 由此
  rationale: 简洁保留原文所表达的凭借、因果或结果联系，不把关系强化为单一、明确的逻辑解释。
- source_word: መልአት
  choice: 都充满了
  rationale: 表达已经达到充满状态的结果；“了”使现代汉语自然，并保留控诉中已经造成的后果。
- source_word: ኵላ ምድር
  choice: 整个大地
  rationale: 保留全域性的表达；本段具有广阔乃至宇宙性的视野，因此不缩小为某一片“土地”。
- source_word: ደመ
  choice: 血
  rationale: 直译具体名词“血”，保留启示文学中鲜明而严厉的意象，不解释性地改写为“流血之事”或“杀戮”。
theological_decisions:
- issue: 是否将巨人的身份及其来源直接写入正文
  choice: 正文只译作“巨人”，以脚注说明其上下文所指
  alternative: 译作“那些女人与守望者所生的巨人后裔”
  rationale: 原文表述简短，身份由上下文提供；正文不补入“守望者”或“不法结合”，可避免把解释混入经文。
- issue: 是否强化后半句的因果关系
  choice: 译作“由此，整个大地都充满了血”
  alternative: 译作“所以整个大地都因他们而充满了血”
  rationale: “由此”保留原文紧凑的因果、凭借或结果关系，同时不额外指定“他们”为唯一施事者。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那些女人”承接上文所说的人间女子；“由此”保持原句紧凑，并保留因果与结果之间一定的语义张力。所有脚注标记均置于相关词语之后。
