base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/006.yaml
  text: You see what Azazel has done[a]—how he has taught all unrighteousness upon the earth and revealed the hidden things of the world that are done in the heavens[c][b], which men learned.
translation:
  language: zh_hans
  text: 你看亚撒谢勒所做的事：他怎样在地上教导一切不义，又把世间隐秘的、在天上所行的事[a]揭露出来，而人也学会了这些事。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世间”所译的吉兹语也可指“世代”或“永恒”，因此本句也可理解为“这世代的隐秘”或“永恒的隐秘”。
    reason: lexical_alternative
  - marker: b
    text: 末句在文本传统中较难确定。现存吉兹语可译为“人知道了”或“人学会了”；另一种文本传统则作“人竭力学习”。
    reason: textual_variant
lexical_decisions:
- source_word: ርኢከ
  choice: 你看
  rationale: 按第二人称形式直译，保留众天使向天上受诉者陈情时的直接感与迫切感；“你已经看见”亦有可能，但语气略弱。
- source_word: ዘገብረ
  choice: 所做的事
  rationale: 关系结构指亚撒谢勒已经做成且仍影响当下的行为；汉语用“所做的事”自然承接后面的具体指控。
- source_word: አዛዝኤል
  choice: 亚撒谢勒
  rationale: 按专名音译；采用现代中文中较易辨读、并能与相关古代文献名称传统衔接的形式。
- source_word: ዘመሀረ
  choice: 他怎样……教导人
  rationale: 该动词表示教导或传授；补出受事者“人”，使现代汉语通顺，但不改变其向人类传授禁忌知识的指控。
- source_word: ኵሎ ዓመፃ
  choice: 一切不义
  rationale: 该词组涵盖广泛的道德悖逆，不宜缩窄为暴力或社会不公；“不义”保留其伦理和神学分量。
- source_word: በዲበ ምድር
  choice: 在地上
  rationale: 准确标明败坏发生于尘世领域；“在地上”比“在大地之上”更符合现代标准汉语。
- source_word: ወአግሀደ
  choice: 又……揭露出来
  rationale: 表达使隐藏之事显明；“揭露”兼具启示性语域和此处非法泄露的负面语感。
- source_word: ኅቡኣተ ዓለም
  choice: 世间隐秘的事
  rationale: ዓለም 可指世界、世代或永恒；正文采用“世间”以保留宽泛空间意义，脚注说明其他可能。
- source_word: እለ ይትገበሩ በሰማያት
  choice: 天上所行的
  rationale: 保留被动或非人称的“在天上被行／发生”之意；不把它具体解释为某类仪式或宇宙运行。
- source_word: አመረ ሰብእ
  choice: 而人也学会了这些事
  rationale: 按现存吉兹语见证理解为“人知道了／学会了”；不采用“竭力学习”，因为该动词本身没有“努力追求”的含义。
theological_decisions:
- issue: ዓመፃ 的道德范围
  choice: 一切不义
  alternative: 一切不公；一切无法无天之事；一切暴行
  rationale: 上下文指禁忌教导造成的全面道德败坏。“不义”既不局限于社会不公，也不缩窄为肉体暴力。
- issue: 天上隐秘之事的性质与句法范围
  choice: 天上所行的、世间隐秘的事
  alternative: 天上所行的永恒奥秘；在天上造成的世界隐秘
  rationale: 原文既把这些事称为隐藏之事，又说它们在天上被行或发生。译文维持这种张力，不将其教义化为特定的天使仪式、创造法则或正当启示。
- issue: 人类得知隐秘之事的程度
  choice: 人也学会了这些事
  alternative: 人知道了这些事；人竭力学习这些事
  rationale: 依据吉兹语当前可见文本，末句表示人知道或学会；“竭力学习”来自另一文本传统的理解，正文不予采用，但以脚注保留见证差异。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你看”保留陈情的直接语气；冒号和“他怎样”展开对亚撒谢勒行为的控诉。避免过度古雅，也不以特定宗派术语解释天上的隐秘之事。
