  yaml_path: translation/extra_canonical/1_enoch/009/002.yaml
  text: And they said among themselves[b][a], “The voice of their outcry has reached the gates of heaven.”
translation:
  language: zh_hans
  text: 他们彼此说：“他们呼喊的声音已经上升；大地向天门发出了呼喊。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的抄录形式及后半句的句法有疑难。此处将“呼喊了”理解为阴性单数动词，以“大地”为主语；另一种读法则将全句合并理解为：“他们从地上发出的呼喊声已经达到天门。”
    reason: textual_and_syntactic_ambiguity
lexical_decisions:
- source_word: ወይቤሉ
  choice: 他们……说
  rationale: 这是常见的叙事引语公式；结合动词的复数主语，译为自然的现代汉语。
- source_word: በበይናቲሆሙ
  choice: 彼此
  rationale: 表达群体成员相互之间的言说，比“在他们中间”更准确自然。
- source_word: ቃለ ጽራኃቲሆሙ
  choice: 他们呼喊的声音
  rationale: 保留“声音”与“呼喊”的组合，并传达受害者急切发声的意味。
- source_word: ዐረቀ
  choice: 已经上升
  rationale: 抄录形式可能对应意为“上升”的动词；按阳性单数动词与“声音”一致来理解，也保留呼声升达天上的空间意象。
- source_word: ጸርሐት ምድር
  choice: 大地已经……呼喊
  rationale: ጸርሐት可解析为阴性单数完成式动词，与阴性名词“地”一致，因此保留大地被拟人化而呼喊的独立分句。
- source_word: እስከ አንቀጸ ሰማይ
  choice: 向天门
  rationale: 保留具体的启示文学空间图景；“向”自然表达呼声一直达到天门的方向和终点。
theological_decisions:
- issue: 经文所说的是受害者的呼声，还是大地本身的呼喊？
  choice: 译作两个彼此关联的分句：人的呼喊声上升，大地也向天门呼喊。
  alternative: 将全句合并为“他们呼喊的声音已经达到天门”，或把“地”理解为呼声的来源。
  rationale: 原文表面上可将ጸርሐት解析为阴性动词，并以“地”为主语。这样既不抹去受害者的呼声，也保留因暴行而呼喊的大地这一拟人意象。
translation_notes:
  register: 采用庄重而清楚的现代普通话。“天门”保留古代宇宙图景，“大地……呼喊”保留原文鲜明的拟人表达；分号显示两个紧密相连但语法独立的动作。
