base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/007.yaml
  text: And Semyaza[c][b][a], to whom you gave authority to rule over those who are with him.
translation:
  language: zh_hans
  text: 还有示米亚撒——你曾赐给他权柄，让他管辖那些与他在一起的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些与他在一起的人”也可译作“那些与他一同聚集的人”或“与他有关联的人”。此处未明确说明这些人的身份。
    reason: lexical_alternative
  - marker: b
    text: “管辖”也可译作“治理”。该词表示施行受授的权柄；在这里不必特指审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: 示米亚撒
  rationale: 按格尔兹语人名音译，并采用适合现代普通话的汉字形式，不翻译其可能的词源含义。
- source_word: ዘአንተ ወሀብኮ
  choice: 就是你赐予……的
  rationale: 依照关系成分、第二人称主语和第三人称男性单数宾语后缀理解为上帝赐给示米亚撒权柄，避免把施予者和领受者倒置。
- source_word: ስልጣነ
  choice: 权柄
  rationale: 表达受托的治理权限，而非示米亚撒本有或至高的主权。
- source_word: ይኵንን
  choice: 让他管理
  rationale: 明确保留原文治理动词；“管理”在现代汉语中自然，也不把语义过度限定为审判。
- source_word: እለ ምስሌሁ ኅቡረ
  choice: 那些跟随他的众天使
  rationale: 结合本段语境，指与示米亚撒在一起、归其带领的群体；“众天使”是为中文清晰而作的语境性补足，并以脚注保留较直译的可能。
theological_decisions:
- issue: 示米亚撒权柄的性质
  choice: 上帝赐予他管理同伴的受托权柄
  alternative: 他在同伴中拥有权柄，或有权审判他们
  rationale: 句法和叙事语境表明上帝是赐予者、示米亚撒是领受者；译文保留“权柄”的受托性质，不将其写成示米亚撒固有的主权。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“还有”承接本节残句式的列举结构；用“就是……的”处理关系从句。因原始见证可靠度为中等，且相关短语存在文本与句法难点，脚注保留较直译的表达。
