base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/044/001.yaml
  text: 'And another thing I saw concerning the lightning: how some of the stars arise and become lightning[b][a], and they are not able to leave it.'
translation:
  language: zh_hans
  text: 我又看见了关于闪电的一件事：有些星如何升起，变成闪电[a]，并且不能离开它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“有些从星辰中升起，变成闪电。”原文介词既可能表示部分关系，也可能表示来源或分离。
    reason: 句法与介词用法存在歧义。
  - marker: b
    text: 末句含义不确定；也可理解为“不能停止”或“不能离去”。原文没有明说所离开的对象。
    reason: 词义及隐含宾语存在不确定性。
lexical_decisions:
- source_word: ካልእተ
  choice: 又……一件事
  rationale: 引出异象中的另一项内容；用现代汉语自然保留其承接作用。
- source_word: ርኢኩ
  choice: 我……看见
  rationale: 对应第一人称异象报告的常用表达，清楚而庄重。
- source_word: በእንተ መብረቅ
  choice: 关于闪电
  rationale: 保留原文说明所见内容的关系，并将复现的名词一致译为“闪电”。
- source_word: እፎ
  choice: 怎样
  rationale: 引出所见景象的方式或过程，不把句法简化为单纯的“即”。
- source_word: ይቀውሙ
  choice: 升起
  rationale: 该动词可指站立或起来；在星辰景象中译作“升起”自然，也避免“显得突出”的误解。
- source_word: እምከዋክብተ
  choice: 有些星
  rationale: 将 እም 理解为部分用法，即“星中的一些”，而非强行译成空间上的“从星辰中”。
- source_word: ወይከውኑ መብረቀ
  choice: 变成闪电
  rationale: 保留成为、转变的动态意象，不改释为静态身份。
- source_word: ወኢይክሉ ኃዲገ
  choice: 并且不能离开它
  rationale: 保留明确的不能与“离开、舍弃”之意；所离开的对象在原文中没有明说，中文以代词承接闪电状态，同时用脚注说明不确定性。
theological_decisions:
- issue: 星与闪电意象所指为何
  choice: 正文保留星升起并变成闪电的异象性宇宙图景，不把星明确解释为天使或灵体。
  alternative: 可将星理解为天使性存在，也可视为自然现象的异象描述。
  rationale: 本节本身没有明示星所代表的对象；直保意象可避免把特定神学解释写入译文。
- issue: 末句“不能离开”的对象与含义
  choice: 译为“不能离开它”，让“它”自然承接成为闪电的状态或闪电本身。
  alternative: 也可理解为“不能停止”或“不能离去”。
  rationale: 原文末语在语境中较难确定；正文采用较贴近“离开、舍弃”的译法，并以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留异象叙述的简洁与奇异感。脚注标记均置于正文相关位置。
