base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/002.yaml
  text: And when righteousness appears on the faces of the righteous[a], the chosen, whose deeds hang upon the Lord of Spirits, and light will appear to the righteous and to the chosen who dwell on the dry ground, where then is the dwelling of sinners[d][c][b], and where the resting place of those who denied the Lord of Spirits? It would have been better for them had they not been born.
translation:
  language: zh_hans
  text: 当正义显现在义人的脸上——就是那些蒙拣选的人；他们的行为悬系于万灵之主[a]——光也必向住在旱地上[b]的义人和蒙拣选的人显现。那时，罪人的住处在哪里？那些否认万灵之主之人的安歇之所又在哪里？他们若没有出生，倒更好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的行为悬系于万灵之主”原文含义不很明确，也可理解为他们的行为依靠万灵之主，或在他面前得以托住。
    reason: lexical_alternative
  - marker: b
    text: “旱地”是较直译的说法，可能指与宇宙水域相对、有人居住的陆地。
    reason: cultural_note
lexical_decisions:
- source_word: ያስተርኢ
  choice: 显现
  rationale: 此处两次出现的动词宜按 ast 词干理解为“显现、被看见”，而非使役性的“使……显现”。这样也让“正义”和“光”分别作主语。
- source_word: ጽድቅ
  choice: 正义
  rationale: 既保留道德正直，也涵盖末世中义人获得昭雪的含义；在现代汉语中较“公义”更少带特定宗派色彩。
- source_word: በገጾሙ
  choice: 在……的脸上
  rationale: 保留异象中具体可见的身体意象，不抽象化为“在他们面前”。
- source_word: ጻድቃን
  choice: 义人
  rationale: 这是现代中文宗教与文学语境中自然、稳定的对应词，并与“正义”保持词义关联。
- source_word: ኅሩያን
  choice: 蒙拣选的人
  rationale: 清楚表达其被拣选的身份，同时避免仅用名词“选民”可能附带的后世群体含义。
- source_word: ተግባሮሙ ስቁል በእግዚአ መናፍስት
  choice: 他们的行为悬系于万灵之主
  rationale: 保留“悬挂、悬系”的不寻常具体比喻，不擅自确定为“依靠”或“被托住”。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 简洁表达“诸灵之主”，符合庄重而自然的现代汉语，并保留以众灵为领域的称号。
- source_word: ብርሃን
  choice: 光
  rationale: 采用基本义，保留其异象性及神学张力，不额外强化为“荣光”。
- source_word: የኃድሩ ዲበ የብስ
  choice: 住在旱地上
  rationale: 保留与水域相对的具体宇宙图景；不将其笼统化为“住在地上”。
- source_word: መኃደሪ
  choice: 住处
  rationale: 自然对应居所，并与后文“安歇之所”形成平行。
- source_word: ምዕራፎሙ
  choice: 安歇之所
  rationale: 同时保留“休息”与“地点”的含义。
- source_word: ክሕድዎ
  choice: 否认
  rationale: 保留对万灵之主直接作出的宗教与司法性否认，不弱化为一般的“不接受”。
- source_word: እምኃየሶሙ ሶበ ኢተወልዱ
  choice: 他们若没有出生，倒更好
  rationale: 自然表达严厉的反事实审判语句，不额外借用其他经典中的固定措辞。
theological_decisions:
- issue: 义人行为与万灵之主关系的难解短语
  choice: 他们的行为悬系于万灵之主
  alternative: 他们的行为依靠万灵之主／他们的行为在万灵之主面前得以托住
  rationale: 吉兹语保留了“悬挂、悬系”的形象，其确切神学关系并不明确；正文不应将它单一定义为依赖、审判或神的扶持。
- issue: “旱地”的指涉
  choice: 保留“旱地”
  alternative: 大地／陆地／人居之地
  rationale: 该词很可能泛指与宇宙水域相对的人居陆地，但直译能保存启示文学的宇宙图景。
- issue: “光”在第二分句中的句法角色
  choice: 光也必……显现
  alternative: 他必向……显出光
  rationale: 名词“光”的形态支持其作主语，动词也更适合解作“显现”；因此不采用使役读法。
- issue: 审判问题与前述显现之间的衔接
  choice: 以句号分开显现陈述与两个反问
  alternative: 将全节连成一个以“当……时，哪里……”为主干的长句
  rationale: 原文连续连接词容许长句，但现代汉语分句能更清楚呈现异象陈述和审判反问，同时不改变逻辑次序。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“正义显现在……脸上”“行为悬系于……”刻意保留原文具体而略显陌生的异象语言；其余句法适度拆分，以免长句妨碍理解。所有脚注标记均置于正文相应位置。
