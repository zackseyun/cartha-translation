base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/001.yaml
  text: The first parable[a]. When the assembly of the righteous appears, and sinners are judged for their sins, and are driven away from the face of the earth[b],
translation:
  language: zh_hans
  text: 第一篇比喻[a]。当义人的会众显现，罪人因自己的罪受审判，并被赶离地上时，[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比喻”也可译作“譬喻”；这里是本部分第一篇论述的标题。
    reason: lexical_alternative
  - marker: b
    text: “地上”直译近于“旱地（或陆地）的表面”。本句以“当……时”开始，句意接续下一节。
    reason: lexical_and_syntactic_clarification
lexical_decisions:
- source_word: ምሳሌ
  choice: 比喻
  rationale: 此词在《比喻篇》中用作异象性论述的名称；“比喻”简明、庄重，也保留该词的传统语义范围。
- source_word: ቀዳማ፲
  choice: 第一个
  rationale: 这是序数词，标明本部分的第一篇论述；与“比喻”搭配自然。
- source_word: ሶበ
  choice: 当……时
  rationale: 保留时间从句的功能；本节句意延续至下一节，因此以逗号收束。
- source_word: ያስተርኢ
  choice: 显现
  rationale: 此处重在会众出现、成为可见，而非明确使用“启示”概念；“显现”也符合末世异象语体。
- source_word: ማኅበረ ጻድቃን
  choice: 义人的会众
  rationale: “会众”保留有组织的共同聚集之意，比宽泛的“人群”更贴近原文。
- source_word: ወይትኴነኑ
  choice: 受审判
  rationale: 保留司法行为本身，不将其提前具体化为“被定罪”；惩罚性的结果由后面的赶逐表达。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 原文为表示类别的复数名词；汉语“罪人”无需另加定指标记。
- source_word: በኃጢአቶሙ
  choice: 因自己的罪
  rationale: 介词短语在此说明受审判的根据；加入“自己的”自然表达原文物主后缀。
- source_word: ወእምገጸ የብስ
  choice: 从地面上
  rationale: 原文字面近于“从旱地／陆地的表面”；正文采用自然汉语“地面上”，脚注保留“旱地／陆地”的具体词义及“地上”的可能译法。
- source_word: ይትሀወዙ
  choice: 被赶逐
  rationale: 保留被动和惩罚性驱离的力度；“赶逐”较“离开”更符合审判场景。
theological_decisions:
- issue: 审判动词应译为中性的“受审判”，还是结果性的“被定罪”
  choice: 受审判
  alternative: 被定罪／被判罪
  rationale: 原文明确描写司法行动，却不要求在该动词本身中写明裁决结果；随后的赶逐已呈现惩罚后果，故不宜过度释义。
- issue: 义人会众的出现是否应表述为特殊的神学性“启示”
  choice: 显现
  alternative: 被显明／被启示
  rationale: 该动词在这里首先表示出现或成为可见；采用“显现”可保留末世语境，又不把另一种更明确的启示术语强加于原文。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。以“第一个比喻”作为独立标题句；正文保留原文时间从句尚未完结的结构，并以末尾逗号提示句意延续。所有脚注标记均置于正文相应位置。
