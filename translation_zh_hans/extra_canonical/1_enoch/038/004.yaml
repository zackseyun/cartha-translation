  to: 从今以后，那些掌控大地的人不再强大、崇高[a]，也不能得见圣者的面容[b]，因为万灵之主已使他的光显现在圣者、公义者和蒙拣选者的面上[c]。
  rationale: 修订直接呈现原文“掌控大地的人”与“强大、崇高”的主语—表语关系，避免将其误译为灭绝，也避免“权贵不再有权有势”的重复。并将“瞻望……的面”改为较自然的“得见……面容”，保留脚注对原文具体“面”及直接相见惯用语的说明。
