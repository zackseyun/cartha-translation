base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/004.yaml
  text: And from now on the mighty and exalted who possess the earth shall not be so[a], nor shall they be able to look on the face of the holy ones, because the Lord of Spirits has caused his light to appear on the face of the holy, the righteous[d][c][b], and the chosen.
translation:
  language: zh_hans
  text: 从今以后，那些掌控大地的人不再强大、崇高[a]，也不能得见圣者的面容[b]，因为万灵之主已使他的光显现在圣者、公义者和蒙拣选者的面上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的句法较贴近字面地说：“那些掌控大地的人不再强大、崇高。”这里更可能是指他们丧失权势和尊位，而非不复存在。
    reason: grammar_and_alternative_reading
  - marker: b
    text: 原文直译为“看见圣者的面”。这是直接相见或获准亲近的表达；译文以“得见……面容”保留其具体而庄严的意象。
    reason: cultural_note
  - marker: c
    text: 这句话也可能理解为主的光照在这些人的脸上，标志着圣者、公义者和蒙拣选者得到昭雪和尊荣。
    reason: alternative_reading
lexical_decisions:
- source_word: ዐዚዛነ ወእልዑላነ
  choice: 有权有势
  rationale: 这两个词作系词的表语，表示强大和地位崇高；合译为“有权有势”既符合现代汉语，又保留他们将丧失权势与尊位的含义。
- source_word: እለ ይእኅዝዋ ለምድር
  choice: 那些掌控大地的权贵
  rationale: 动词有抓住、持有之义，在这里指对大地拥有稳固控制；“掌控”比字面的“握住”自然，又不强化为未经文本明确表达的“夺取”。“权贵”依据前置的权势和崇高身份补明所指群体。
- source_word: ገጸ ቅዱሳን
  choice: 圣者的面
  rationale: 保留闪语式的单数“面”及直接相见、获准亲近的庄严意象，不简化为抽象的“同在”。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 作为《以诺一书》中固定的神圣称号，“万灵之主”在汉语中简洁庄重，并表达统摄众灵之意。
- source_word: አርአየ ብርሃኖ
  choice: 已使他的光显现
  rationale: 保留原文使役和显现的意象，不把它弱化为仅属认知层面的“启示”。
- source_word: በገጸ ቅዱሳን ጻድቃን ወኅሩያን
  choice: 在圣洁、公义、蒙拣选之人的面上
  rationale: 保留光显现在其面上的具体形象，并分别呈现圣洁、公义、蒙拣选三个重要身份描述。
theological_decisions:
- issue: 受审群体的身份及其结局
  choice: 掌控大地的权贵将失去权势和尊位
  alternative: 有权势、居高位并占有大地的人将不复存在
  rationale: 吉兹语中“强大”和“崇高”带表语形式，由“那些掌控大地的人”作主语，因此更可能指地位逆转，而非人的彻底消灭。译文不把该群体限定为君王或地主。
- issue: 万灵之主的光显现在何处及其意义
  choice: 光显现在圣洁、公义、蒙拣选之人的面上
  alternative: 光显现在他们面前，或从他们脸上反射出来
  rationale: 原文最直接支持光在他们面上的可见显现，带有尊荣和昭雪的启示文学意象；译文保留意象而不进一步教义化解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“权贵”“瞻望”“万灵之主”维持启示文学的肃穆语域；句法以自然汉语呈现，同时通过脚注保存开头表语结构和末句介词意象的歧义。
