base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/003.yaml
  text: When the hidden things of the righteous are revealed, sinners will be judged, and the wicked will be driven away from the face of the righteous and the chosen.
translation:
  language: zh_hans
  text: 当义人那些隐藏的事显露时[a]，罪人必受审判，恶人必被从义人和被拣选的人面前赶走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“义人的隐秘之事”。原文只表明这些事原先被隐藏，并未说明所指的是行为、身份、秘密，还是义人得以昭雪的根据。
    reason: lexical_alternative
  - marker: b
    text: 直译为“从义人和被拣选的人的面前”；这是审判场景中表示被逐出其临在的说法。
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: 当……时
  rationale: 该词引出时间从句；保留“当……时”的结构，也保留本章连续使用这一时间标记所形成的启示文学张力。
- source_word: ይትከሠት
  choice: 显露
  rationale: 该动词为被动意义，指原先隐而未现之事被揭示；“显露”自然、庄重，又不额外指定揭示的方式。
- source_word: ኅቡኣቲሆሙ፡ ለጻድቃን
  choice: 义人隐藏的事
  rationale: 原文指与义人相关或属于义人的“隐藏之物”；此译保留复数集合意义，不武断限定为秘密、行为、身份或蒙昭雪的根据。
- source_word: ይትኴነኑ
  choice: 必受审判
  rationale: 保留司法性的被动含义，不在正文中强化为已经宣告有罪的“定罪”。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 这是以诺传统审判语境中的常见道德类别，直译清楚，并与“义人”形成对照。
- source_word: ይትሀወዙ
  choice: 必……被赶走
  rationale: 该词含有被强行移除、驱逐之意；“被赶走”保留审判场景中的力度和空间意象。
- source_word: ረስዓን
  choice: 恶人
  rationale: 简洁表达与“义人”相对的道德类别，不额外引入“无法无天”等较窄含义。
- source_word: እምገጸ
  choice: 从……面前
  rationale: 原文字面为“从……的面/面前”，在汉语中“从……面前”既自然，也保留被排除于其临在之外的空间性审判意象。
- source_word: ወኅሩያን
  choice: 和蒙拣选者
  rationale: 该词指被拣选的人；“蒙拣选者”兼顾现代可懂性与神学类别，同时不说明拣选的具体机制。
theological_decisions:
- issue: 义人所隐藏之物的具体所指
  choice: 义人隐藏的事
  alternative: 义人的秘密；义人中隐藏的人
  rationale: 吉兹语没有明确说明所隐藏的是行为、身份、秘密还是义人得以昭雪的根据，因此采用较宽泛的表达以保留歧义。
- issue: 罪人所受司法行动的结果
  choice: 受审判
  alternative: 被定罪
  rationale: 原文清楚呈现司法审判，却未要求译文在此直接说出定罪结果；“受审判”避免过度诠释。
- issue: 末句排除公式的含义
  choice: 从义人和蒙拣选者面前被赶走
  alternative: 离开义人和蒙拣选者的临在；在义人和蒙拣选者面前蒙羞
  rationale: 原文重点是从得昭雪群体面前被驱逐，而不只是感到羞耻；正文保留其空间性和审判力度。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“当……时”保留原文时间从句；“必受审判”“蒙拣选者”维持启示文学语域，但避免古奥表达。
