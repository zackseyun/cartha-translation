base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/005.yaml
  text: And a word fell into my mouth because of it[a], and I lifted up a cry and said[d][c][b], “The earth is destroyed.”
translation:
  language: zh_hans
  text: 因这事[a]，有话临到我口中[b]；我就高声呼喊说：“大地毁灭了！”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从这事而来”或“于是”；原文可表示来源、原因或承接前事。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“一句话落入我口中”，是指一句话临到说话者、使他发出言语的习语。
    reason: cultural_note
  - marker: c
    text: 也可译作“灭亡了”；原文所用动词并非上一节表示“吞没”的那个词。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: 于是
  rationale: 该介词短语可表示来源、原因或承接前事。此处接续上一节异象，译作“于是”自然地保留结果或时序关系；其他可能见脚注。
- source_word: ወድቀ ነገር ውስተ አፉየ
  choice: 一句话落入我口中
  rationale: 尽量保留“话落入口中”的异象性表达，呈现话语临到说话者的意味，而不弱化为普通的“我说”。
- source_word: አንሣእኩ እጽራሕ
  choice: 我放声呼喊
  rationale: 原文由“举起”与“呼声/呼喊”构成；现代汉语用“放声呼喊”既自然，又保留提高声音、发出强烈喊声的力度。
- source_word: ተሐጕለት
  choice: 毁灭了
  rationale: 该动词较准确地表示毁灭或灭亡，不与上一节表示“吞没”的另一动词混同。完成体在异象惊呼中译为“毁灭了”。
- source_word: ምድር
  choice: 大地
  rationale: 异象语境具有广阔乃至宇宙性的尺度，故取“大地”，而不收窄为某一地区的“土地”。
theological_decisions:
- issue: 洪水异象中ምድር的范围
  choice: 大地
  alternative: 土地／这片地
  rationale: “大地”保留启示文学异象可能具有的普世范围，同时不额外加入超出原词本身的教义说明。
- issue: 末句所描绘的灾变性质
  choice: 毁灭了
  alternative: 被吞没了／灭亡了
  rationale: 根据该节实际使用的动词保留“毁灭、灭亡”义，避免因洪水背景而把它改译成上一节另一动词所表达的“吞没”，从而保存作者的词汇转换。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一句话落入我口中”刻意保留原文异象性习语；“放声呼喊”使汉语流畅，并传达原文举声呼喊的力度。
