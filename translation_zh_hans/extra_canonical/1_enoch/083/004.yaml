base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/004.yaml
  text: And when it fell upon the earth[a], I saw the earth being swallowed into a great abyss, and mountains were suspended upon mountains, and hills sank down upon hills[d][c][b], and tall trees were cut off from their trunks and were thrown down and sank into the abyss.
translation:
  language: zh_hans
  text: 它落到地上时，我看见大地被吞没在一个巨大的深渊[a]中；山悬在山上[b]，丘陵一座压着一座地沉陷；高大的树木被从树干处砍断[c]，抛掷下来，沉入深渊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深渊”也可译作“巨大的深处”或“巨大的裂谷”；原词指广阔而幽深之处。
    reason: lexical_alternative
  - marker: b
    text: “山悬在山上”依原文保留其奇异的异象表达；也有人理解为“山堆在山上”。
    reason: cultural_note
  - marker: c
    text: 原文指树木从树干或基部被砍断，并非明确说“连根拔起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቅ
  choice: 它落到
  rationale: 叙事性未完成式在异象回述中按已发生事件处理；“落到”简洁保留下降并触地的动作。
- source_word: ትትወሐጥ
  choice: 被吞入
  rationale: 保留被动及大地遭吞噬、淹没的强烈末世异象，不弱化为普通的覆盖。
- source_word: ቀላይ ዐቢይ
  choice: 一个巨大的深渊
  rationale: “深渊”能表达巨大深处或坑壑，并保留宇宙性灾变和审判意象。
- source_word: አድባር ዲበ አድባር ይስቀሉ
  choice: 山悬在山上
  rationale: 动词主要表达悬挂、悬置；不将这一刻意奇异的异象顺化为“堆叠”或“倒塌”。
- source_word: አውግር ዲበ አውግር ይሰጠሙ
  choice: 丘陵沉陷在丘陵上
  rationale: 保留沉下、陷落的含义及“在……上”的反常图景。
- source_word: ዕፀወ ነዋኃት
  choice: 高大的树木
  rationale: 形容词强调高度；此译法自然清楚，同时保存视觉形象。
- source_word: ይትገዘሙ እምጕንዶቲሆሙ
  choice: 从树干处被砍断
  rationale: ገዘመ 指砍、削断或截断，而非连根拔起；“从树干处”保留其基部或干身位置可能存在的范围弹性。
- source_word: ይትገደፉ
  choice: 被抛下
  rationale: 准确保留被投掷、抛落的被动态和灾变力度。
- source_word: ይሰጠሙ ውስተ ቀላይ
  choice: 沉入深渊
  rationale: 再次使用“深渊”，维持本节词汇及意象的一致性。
theological_decisions:
- issue: 宇宙灾变图景的性质
  choice: 正文按具体的异象图景翻译，呈现大地、群山、丘陵和树木的崩解。
  alternative: 在译文中直接把这些景象解释为政治动荡的象征，或概括成地震、洪水。
  rationale: 原文以具体而反常的宇宙性意象叙述梦境；译文应保存其张力，不预先规定象征解释。
translation_notes:
  register: 采用现代标准普通话与简体中文，语体庄重但通俗；使用分号呈现连续灾变场景，并保留“山悬在山上”等反常的启示文学意象。
