base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/008.yaml
  text: And now[a], my son, rise and make your petition to the Lord of glory, since you are faithful[b], that a remnant may remain upon the earth and that he may not wipe out the whole earth.
translation:
  language: zh_hans
  text: 现在，我儿，起来，向荣耀之主恳求吧；因为你是忠信的[a]，求他使余剩得以存留在地上[b]，也不毁灭全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信的”也可译作“相信的”或“可信赖的”；原词兼有信靠与坚定可靠的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文用两个同源词连说，近似“使余剩得以剩下”；这里译作“余剩得以存留”，以保留这种强调。该表达本身未明确限定余剩所指为何。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥእ
  choice: 起来
  rationale: 这是表示起身行动的命令式；“起来”在现代汉语中自然有力，也符合异象叙事中的急切劝告。
- source_word: አስተብቍዖ
  choice: 恳求
  rationale: 该动词含郑重、迫切地祈求之意；“恳求”既保留代求的力度，又比单用“祷告”更贴近请求这一语义。
- source_word: ለእግዚአ ስብሐት
  choice: 向荣耀之主
  rationale: 按属格结构直译为“荣耀之主”，保留启示文学中庄严的神圣称号，不改写成“荣耀的主”。
- source_word: መሃይምን
  choice: 忠信的
  rationale: 此词可涉及相信、可靠和持守信实；“忠信”在此既能表达信靠，也能表达因坚定可靠而适合代求，避免只限定为内在认知上的相信。
- source_word: ይትረፍ ትራፍ
  choice: 余民得以存留
  rationale: 原文以同源词叠用，强调在审判中仍有剩余者被留下；“余民……存留”在汉语中保留了这一词义呼应和末世审判背景。
- source_word: ወኢይደምስሳ ለኵላ ምድር
  choice: 也愿他不要毁灭全地
  rationale: 动词表示毁坏或消灭；“毁灭”庄重而自然，“全地”保留原文范围的整体性，同时不强行判定是土地、世界还是其居民。
theological_decisions:
- issue: መሃይምን 应侧重内在相信，还是忠诚可靠
  choice: 忠信的
  alternative: 相信的／可信靠的
  rationale: 上下文以此说明儿子为何适合在宇宙性审判临近时向神代求。“忠信”保留信靠与坚定可靠两方面的张力，不把含义缩减为纯粹的理性相信。
- issue: ይትረፍ ትራፍ 所指是抽象的剩余，还是幸存的人群
  choice: 余民得以存留
  alternative: 留下一些幸存者／留下余剩之物
  rationale: 同源词结构强调审判后仍有所存留；“余民”符合代求语境，但脚注说明原文表达本身较宽，避免将其对象绝对限定。
- issue: 毁灭行动的主语是否应明说为荣耀之主
  choice: 保留代词“他”
  alternative: 荣耀之主不要毁灭全地
  rationale: 原文以动词形态指向第三人称单数主语，语境自然承接“荣耀之主”；保留“他”既清楚，又不增添原文没有重复的称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“荣耀之主”保留正式的神圣称号；“恳求”体现迫切代求；两个“愿”使祈求内容层次清楚。标点将“因为你是忠信的”与后续愿望相连，同时不额外解释其因果关系。
