base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/006.yaml
  text: And Malyal my grandfather lifted me up while I was lying beside him[a], and he said to me, “Why do you cry out like this, my son[c][b], and why do you lament like this?”
translation:
  language: zh_hans
  text: 我的祖父玛勒雅勒[a]把我扶起来；当时我正躺在他身旁。他对我说：“我儿，你为什么这样喊叫，又为什么这样哀号[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛勒雅勒”是按吉兹语姓名形式音译；此人很可能就是《创世记》家谱中的玛勒列（Mahalalel）。
    reason: lexical_alternative
  - marker: b
    text: 原文用了两个不同的动词：前一个侧重大声喊叫，后一个侧重因悲哀而哭号。
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእያል
  choice: 玛勒雅勒
  rationale: 按所据吉兹语文本中的专名形式音译，不在正文中直接规范为较熟悉的《圣经》人名“玛勒列”；其可能的对应关系留待脚注说明。
- source_word: እምሔውየ
  choice: 我的祖父
  rationale: 此词应分析为表示“祖父”的名词加第一人称单数属格后缀，而不是“从我所在之处”之类的介词短语。
- source_word: አንሥአኒ
  choice: 把我扶起来
  rationale: 原动词表示使人起来、举起；在躺卧者被长辈扶起的具体场景中，“扶起来”自然且保留动作感。
- source_word: እንዘ እነ እስክብ ኀቤሁ
  choice: 当时我正躺在他身旁
  rationale: 保留与“扶起来”同时发生的躺卧状态和空间上的邻近关系，不额外加入原文未明说的“睡着”。
- source_word: ትጸርኅ
  choice: 喊叫
  rationale: 表达发出响亮呼声的动作，不预先限定其究竟是因惊恐、痛苦还是宣告。
- source_word: ወልድየ
  choice: 我儿
  rationale: 是长辈对晚辈亲切而庄重的直接称呼；“我儿”符合族长叙事的语域。
- source_word: ትአወዩ
  choice: 哀号
  rationale: 与前面的“喊叫”区别开来，兼顾悲痛和发声两层含义。
theological_decisions:
- issue: መላእያል的身份与姓名形式
  choice: 正文保留吉兹语见证所呈现的姓名形式，译作“玛勒雅勒”
  alternative: 直接规范为“玛勒列”（Mahalalel）
  rationale: 该人物很可能就是族长玛勒列，但为避免把传统身份认定无声地写进正文，正文采用音译，脚注说明可能的对应关系。
- issue: 两个哭喊动词之间的关系
  choice: 分别译为“喊叫”和“哀号”
  alternative: 将两者合并或都译作“哭”
  rationale: 原文并用两个相关但不完全相同的动词：前者突出大声呼喊，后者突出悲哀的哭号；分别翻译可保留其递进与张力。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“扶起来”贴合躺卧场景；分句处理避免长句拖沓。专名不静默规范化，两个情绪性动词也不合并，以保留源文细节。
