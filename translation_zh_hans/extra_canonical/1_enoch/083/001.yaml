base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/001.yaml
  text: And now[a], my son Methuselah, I will show you all my visions that I have seen before you; I will recount them.
translation:
  language: zh_hans
  text: 现在，我儿玛土撒拉，我要向你展示我所见的一切异象，并要在你面前把它们讲述出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用了两个不同的动词：先说“展示”，再说“讲述”，分别突出使人看见和用言语叙说。“在你面前”在原文中紧邻“讲述”这一动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 作为开启新一段话的转折标记；“现在”在现代汉语中自然、庄重，也不额外强化原文未必具有的语气。
- source_word: አርእየከ
  choice: 我要向你展示
  rationale: 保留使役性“使看见、展示”的含义和第二人称单数宾语；依上下文采用将来指向的表达。
- source_word: ወልድየ፡ ማቱሳላ
  choice: 我儿玛土撒拉
  rationale: 保留父子称谓和直接呼语；人名采用简体中文圣经传统中通行的译名。
- source_word: ኵሎ፡ ራእያትየ
  choice: 我的一切异象
  rationale: “异象”准确体现启示文学中所见景象的性质，比泛称“启示”更贴近原词。
- source_word: እለ፡ ርኢኩ
  choice: 我所见的
  rationale: 用现代汉语关系结构表达已经发生的观看，不强加完成体标记。
- source_word: በቅድሜከ
  choice: 在你面前
  rationale: 保留原文的空间或临在性表达，不将其明确改释为单纯的“对你”。
- source_word: እነግር
  choice: 把它们讲述出来
  rationale: 保留叙说、讲述之义，并与前面的“展示”形成两个彼此有别的披露动作。
theological_decisions:
- issue: “展示”与“讲述”两个动词之间的关系
  choice: 分别译出“展示”和“讲述”
  alternative: 合并为“告诉”或“使你知道”
  rationale: 原文使用两个不同的披露动词；分别保留可呈现异象既被显明、又被口头叙述的张力。
- issue: “在你面前”的句法归属
  choice: 正文按原词序将其与“我所见的”相连，并用脚注说明另一种可能
  alternative: 将其理解为修饰“讲述”，译作“我要在你面前讲述”
  rationale: 原文短语紧随“我所见的”之后，但也邻近末尾的“我讲述”；不应在缺乏更强证据时完全抹去句法歧义。
translation_notes:
  register: 采用现代、清楚而庄重的叙述语体。“我儿”保持亲切而郑重的父辈训诲口吻；“异象”维持启示文学语域。正文尽量贴近原文词序，同时以脚注保留介词短语的真实句法歧义。
