base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/009.yaml
  text: My son[a], from heaven all this will come upon the earth[c][b], and upon the earth there will be a great destruction.
translation:
  language: zh_hans
  text: 我儿啊，从天上，这一切都要临到地上[a]；地上必有一场大毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上”也可译作“大地”；这里与“天上”相对，较可能指整个世界，而非某一片土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወልድየ
  choice: 我儿啊
  rationale: 该词带第一人称所有格后缀，直译为“我的儿子”；在直接称呼中译作“我儿啊”自然庄重，也不把它解释为弥赛亚称号。
- source_word: እምሰማይ
  choice: 从天上
  rationale: 保留明确的离格和启示文学中的垂直空间意象。
- source_word: ይሄሉ
  choice: 要临到
  rationale: 此词是“存在、成为”一类动词的未完成式，并非“说”。结合“从天上……在地上”的结构，以“要临到”表达将从天而至、落在地上的意思，同时不虚构引语。
- source_word: ኵሉዝ
  choice: 这一切
  rationale: 既表达总体，也保留可能存在的指示意味；所指仍由前后异象决定。
- source_word: ዲበ ምድር
  choice: 临到地上／地上
  rationale: 首次出现配合动态语境译作“临到地上”，第二次在存在句中译作“地上”，使汉语自然并保留重复。
- source_word: ምድር
  choice: 地上
  rationale: 启示文学语境更倾向于整个大地，而非局部“土地”；“地上”也与“天上”形成对应。
- source_word: ይከውን
  choice: 必有
  rationale: 按存在句处理，准确连接后面的名词短语，并表达将来必然发生之事。
- source_word: ሐጕል
  choice: 毁灭
  rationale: 涵盖败坏、毁坏和灾变，不把审判意象限缩为军事废墟。
- source_word: ዐቢይ
  choice: 大
  rationale: 作为程度和规模的常用强化语，与“毁灭”搭配清楚自然。
theological_decisions:
- issue: “我儿”的身份
  choice: 保留为直接称呼“我儿啊”，不进一步说明其身份
  alternative: 译作“我的孩子”，或将其解释为弥赛亚性／象征性人物
  rationale: 本节本身不足以确定受称呼者的神学身份；直译亲属称谓可保留解释空间。
- issue: 灾难来自天上的表述
  choice: 译作“从天上，这一切都要临到地上”
  alternative: 将该句理解为“我儿要从天上说”，并构造直接引语
  rationale: ይሄሉ 属于“存在、成为”的动词，不是言说动词；因此不应增添说话行为或引语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我儿啊”保留直接呼语；分号呈现两个紧密相连的灾变陈述。未沿用旧译中由误认动词而产生的引语。
