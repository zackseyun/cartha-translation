base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/003.yaml
  text: I was lying down in the house of my grandfather Mahalalel[a], and I saw in a vision that the heaven was being cleansed and swept away[c][b], and it fell upon the earth.
translation:
  language: zh_hans
  text: 我正躺在祖父玛勒列的家中，便在异象里看见天穹崩塌[a]，被卷走，坠落在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所存转录在这里可能有讹误。按可能的底本词形和上下文，也可译作“被推倒”；若完全依照现有转录的表面词形，则可能被理解为“被洁净”。
    reason: textual_uncertainty
lexical_decisions:
- source_word: ስኩበ፡ ኮንኩ
  choice: 我正躺在
  rationale: 分词与“我曾是”构成迂回式，表示过去持续的背景状态；用“正躺在”避免误解为刚刚躺下这一瞬间的动作，也不强行译成“睡着”。
- source_word: በቤት፡ መላሕእል፡ እምሑውየ
  choice: 在祖父玛勒列的家中
  rationale: 保留具体的居所场景；按以诺谱系，此处亲属为祖父。人名采用现代中文读者较熟悉的“玛勒列”。
- source_word: ርኢኩ፡ በራእይ
  choice: 便在异象里看见
  rationale: “在异象里”表达看见的方式；“便”自然衔接持续背景与随后发生的看见，不改变事件关系。
- source_word: ሰማይ
  choice: 天穹
  rationale: 此处是宇宙性灾变异象，不只是日常气象中的天空；“天穹”既自然，又保留宏大的启示文学意象。
- source_word: ይትነጻጻ
  choice: 崩塌
  rationale: 所给转录很可能反映了词形讹误；依据可能的底本词形、古典译解及随后“坠落在地上”的语境，译作“崩塌”比“洁净”更连贯。因文本证据仍有不确定性，以脚注说明。
- source_word: ወይትሀየድ
  choice: 被卷走
  rationale: 该被动形式表达被夺去、带走；“被卷走”保留灾变中的强力移除意象，而不过度指定施动者。
- source_word: ወይወድቅ፡ ዲበ፡ ምድር
  choice: 坠落在地上
  rationale: 明确保留下落至大地的方向和结果；“坠落”符合天穹崩毁的灾变语境。
theological_decisions:
- issue: ሰማይ所指的范围
  choice: 译作“天穹”，指宇宙性的天
  alternative: 译作“天空”
  rationale: 全句描绘天坠向地的末世性异象；“天空”容易使意象显得仅属气象现象，而“天穹”不必额外引入特定宇宙论，也能保留原文张力。
- issue: 天穹发生的是崩毁还是洁净
  choice: 正文采用“崩塌”
  alternative: “被洁净”
  rationale: 可能的原始词形及“被卷走、坠落在地”的连续动作支持崩毁之意；同时不把这一选择解释为任何教义性判断，并在脚注中交代转录层面的歧义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“正躺在”交代异象出现前的持续状态；“天穹—崩塌—被卷走—坠落”保持简洁而强烈的启示文学画面。脚注标记[a]已置于正文相应词后。
