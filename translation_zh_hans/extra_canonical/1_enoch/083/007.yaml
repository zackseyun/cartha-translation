base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/007.yaml
  text: 'And I told him all the vision that I had seen[a], and he said to me, “Severe is the sight you have seen, my son, and mighty is the vision of your dream: it reveals all the hidden sin of the earth[f][e][d][c][b], and it is about to sink into the abyss and be destroyed with a great destruction.”'
translation:
  language: zh_hans
  text: 我把所看见的一切异象都告诉了他。他对我说：“我儿，你所看见的景象严峻；你梦中的异象大有威力，关乎地上一切罪恶的隐秘事[a]。它将要沉入深渊[b]，并以极大的毁灭被毁灭[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的句法和“隐秘／隐藏”一词的作用较难确定。可理解为这异象关乎地上一切罪恶的隐秘事；也可理解为它显明了地上一切隐藏的罪恶，或它隐藏了地上一切的罪恶。
    reason: lexical_alternative
  - marker: b
    text: “深渊”所译的词也可指“深处”或“海”。
    reason: lexical_alternative
  - marker: c
    text: 原文以“毁灭”词根构成同源结构，近似“以极大的毁灭被毁灭”，用以加强毁灭的意义。
    reason: source_idiom
lexical_decisions:
- source_word: ነገርክዎ
  choice: 告诉了他
  rationale: 表示以诺向对方述说梦中所见；现代汉语“告诉了他”自然、直接。
- source_word: ራእየ
  choice: 异象
  rationale: 在启示文学语境中指超自然的异象经历，而非普通视觉印象。
- source_word: ጽኑዐ
  choice: 令人震骇
  rationale: 原词含坚硬、严厉、可怕之意；此处形容灾难性的所见，译文传达其沉重可怖的效果，同时不将词义窄化为单纯的“可怕”。
- source_word: ርኢከ
  choice: 你所看见的景象
  rationale: 保留原文“看见”词根的具体性，并使汉语表达自然。
- source_word: ኃያለ
  choice: 大有威力
  rationale: 表达异象强大、势不可当的力量，而不赋予道德评价。
- source_word: ኅቡኣተ ኵሉ ኃጢአተ ምድር
  choice: 地上一切罪恶的隐秘之事
  rationale: 将困难形式按名词性表达理解为“隐秘之事”，贴近原文“隐藏/隐秘”的词根；不在正文中直接改写成“揭露”，以免过度解释。
- source_word: ትሰጠም
  choice: 将沉入
  rationale: 保留向下沉没、被淹没的审判意象。
- source_word: ቀላይት
  choice: 深渊
  rationale: 该词也可指深处或海；启示文学的宇宙性审判语境支持“深渊”。
- source_word: ተሐጕል ኅጕለ ዐቢየ
  choice: 遭受极大的毁灭
  rationale: 按“毁灭/灭亡”词根及同源宾语结构翻译，传达加强语气；不采用缺乏词源依据的“被黑暗包裹”。
theological_decisions:
- issue: 末尾两个动词的主语所指
  choice: 汉语正文省略末尾分句的明确主语
  alternative: 明确译作“大地将沉入深渊”，或“罪恶将沉入深渊”，或“异象所显示的一切将沉入深渊”
  rationale: 原文句法紧缩，动词所指可能关联大地、罪恶，或异象所显明的审判。汉语允许承前省略主语，可保存这种真实歧义而不作教义性裁断。
- issue: ኅቡኣተ 与地上罪恶的关系
  choice: 译作“关乎地上一切罪恶的隐秘之事”
  alternative: “显明地上一切隐藏的罪恶”或“隐藏了地上一切的罪恶”
  rationale: 原词以“隐藏/隐秘”为核心，但其句法功能和异象与罪恶之间的关系并不完全明朗；正文采用较贴近形式的名词性译法，并在脚注列出其他可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我儿”保留亲属称呼的庄重感；“令人震骇”“大有威力”维持启示文学的沉重语气。末句有意省略明确主语，以利用现代汉语的自然零主语结构保存原文歧义。
