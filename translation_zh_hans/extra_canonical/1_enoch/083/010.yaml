base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/010.yaml
  text: And after this I arose and prayed and entreated and asked[a], and I wrote down my prayer for the generations of the world; and I showed you everything[b], my son Methuselah.
translation:
  language: zh_hans
  text: 此后，我起来祷告、恳求、祈请，并把我的祷告写下来，留给世世代代[a]；我向你展示了这一切[b]，我儿玛土撒拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留给世世代代”也可译作“为世上的各代”或“留给永远的世代”；原文中的词可表示“世界”“时代”或长久延续。
    reason: lexical_alternative
  - marker: b
    text: 所据转写文本此处的动词字面上也可能读作“他向你展示了这一切”；有校勘意见认为应读作第一人称未完成式，即“我将向你展示这一切”。正文依上下文的一连串第一人称过去叙事译出。
    reason: textual_and_grammatical_ambiguity
lexical_decisions:
- source_word: እምኔሁ
  choice: 此后
  rationale: 在叙事中承接前文，表示先前异象之后的时间推进；简洁而庄重。
- source_word: ተንሣእኩ
  choice: 我起来
  rationale: 保留身体起身的动作，现代汉语自然清楚。
- source_word: ጸለይኩ ወአስተብቋዕኩ ወሰአልኩ
  choice: 我起来祷告，恳求祈求
  rationale: 保留原文连续叠加的祷告动作；以“恳求祈求”表达后两词相近而逐步加强的语气，同时避免过度古雅。
- source_word: ጸሎትየ ጸሐፍኩ
  choice: 把我的祷告写下来
  rationale: 既表达祷告的内容，也明确其被记录成文。
- source_word: ለትውልደ ዓለም
  choice: 留给世世代代
  rationale: 该短语可涉及世界、时代或永远延续的世代；正文采用自然且不限定终点的汉语，脚注保留其他可能理解。
- source_word: ኵሎ
  choice: 这一切
  rationale: 指前述异象及其内容；“这一切”比孤立的“万事”更符合叙事语境。
- source_word: አርአየከ
  choice: 我也把这一切指给你看了
  rationale: 依上下文及一连串第一人称叙述，将其理解为以诺向玛土撒拉展示全部内容；“指给你看”贴近使役“使看见”的意义。见脚注所述抄本文字和时态问题。
- source_word: ወልድየ ማቱሳላ
  choice: 我儿玛土撒拉
  rationale: 保留亲属称呼和直接呼语，采用中文圣经传统中通行的人名译法。
theological_decisions:
- issue: ለትውልደ ዓለም 的时间范围
  choice: 留给世世代代
  alternative: 为世上的各代；留给永远的世代；留给后世万代
  rationale: ዓለም 可表示世界、时代或长久延续，不能确定是泛指后世还是明确强调永远；正文不把它限定为某一种神学时间观，脚注说明其幅度。
- issue: አርአየከ 的人称与时态
  choice: 我也把这一切指给你看了
  alternative: 他把这一切指给你看了；我也要把这一切指给你看
  rationale: 所给文本的字面形态可被读作第三人称完成式，但上下文持续以以诺为第一人称，且校勘讨论涉及第一人称未完成式的可能读法。正文沿用第一人称过去叙事，脚注公开保留文本问题，不据此建立额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文祷告动词的累积感，但避免“哀求、求问”等可能造成不必要语义分化的词。脚注标记均置于相关短语之后。
