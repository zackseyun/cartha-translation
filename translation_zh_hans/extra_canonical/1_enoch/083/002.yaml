base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/002.yaml
  text: 'I saw two visions before I took a wife[a], and one of them was not like the other: the first when I was learning the book, and the second before I took your mother—I saw a mighty vision[d][c][b]; and concerning them I made supplication to the Lord.'
translation:
  language: zh_hans
  text: 我娶妻以前见过两个异象，二者彼此不同。第一个是我学习那本书[a]时所见的；第二个是我娶你母亲以前所见的——那是一个强烈的异象[b]。我就这些异象[c]向主恳求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “学习”也可译作“受教”。原文动词既可表示学习，也可表示受到教导。
    reason: lexical_alternative
  - marker: b
    text: “强烈的异象”也可译作“有力的异象”或“严峻的异象”；原词着重异象的强度或力量。
    reason: lexical_alternative
  - marker: c
    text: “就这些异象”也可理解为“因这些异象”，即这些异象促使以诺向主恳求。
    reason: lexical_alternative
lexical_decisions:
- source_word: ክልኤተ፡ ራእየ፡ ርኢኩ
  choice: 我……见过两个异象
  rationale: 直译为“我看见两个异象”；中文用“见过”自然表达过去的两次异象经历，并保留启示文学语体。
- source_word: እንበለ፡ እንሣእ፡ ብእሲተ
  choice: 我娶妻以前
  rationale: 原文是“取女子为妻”一类婚姻习语；现代汉语以“娶妻”准确、简洁地传达其时序和婚姻含义。
- source_word: ወአሐዱሂ፡ እምኔሆሙ፡ ኢይትማሰል፡ ምስለ፡ ካልኡ
  choice: 二者彼此不同
  rationale: 保留两个异象之间不相似的明确对比，同时采用自然的现代汉语。
- source_word: አመ፡ እትሜሀር፡ መጽሐፈ
  choice: 在我学习那书时
  rationale: 动词可指学习，也可指受教；正文采用自然的“学习”，并以脚注保留被教导的可能。“书”前用“那”保留原文定指感，不擅自说明是哪一卷书。
- source_word: እንበለ፡ እንሥእ፡ ለእምከ
  choice: 在我娶你母亲以前
  rationale: 保留对听者所说的“你母亲”和原文婚姻习语；“娶”符合现代汉语表达。
- source_word: ራእየ፡ ጽኑዐ
  choice: 一个强烈的异象
  rationale: ጽኑዐ 可表示强、有力、严峻或强度甚大；“强烈”能传达异象的力度，又不把它限定为可怕或灾难性的异象。
- source_word: ወበእንቲአሆሙ፡ አስተብቋዕክዎ፡ ለእግዚእ
  choice: 我为这些异象向主恳求
  rationale: 介词短语既可表示“为/关于”，也可能表示“因”；“恳求”体现该动词所含的迫切祈求之意，并保持庄重而易懂。
theological_decisions:
- issue: ለእግዚእ 的称谓
  choice: 向主
  alternative: 向主人／主宰
  rationale: 该词一般可指主人或主宰，但在以诺祈求的语境中指上帝；译作“主”既符合宗教语境，也不额外引入后期特定教义。
- issue: 第二个异象与“强烈的异象”的句法关系
  choice: 将“强烈的异象”理解为第二个异象，并用破折号复述说明
  alternative: 把“我见了一个强烈的异象”视为对两个异象的总结性陈述
  rationale: 原文语序略显松散；“第二个……我见了一个强烈的异象”最自然地把该描述连于第二个异象。破折号保留复述式结构，避免把句法关系表达得过度确定。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“异象”“恳求”“主”保留启示文学及祷告语境的分量；不用生硬的“取妻”或过度古雅的措辞。原文在“第一个／第二个”后的结构较松散，正文以分号和破折号厘清层次，同时通过脚注保存词义与因果关系上的真实歧义。
