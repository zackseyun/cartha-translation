base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/011.yaml
  text: And when I went out below and saw the heaven[a], and the sun rising in the east, and the moon setting in the west, and a few stars, and the whole earth, and everything as He had known it in the beginning, then I blessed the Lord of judgment and extolled Him, because He had brought forth the sun from the windows of the east, and it ascended and rose on the face of the heaven[c][b], and set out and followed the path which He showed it.
translation:
  language: zh_hans
  text: 当我出去，来到下方[a]，看见天空[b]、从东方升起的太阳、在西方落下的月亮、几颗星、全地和万物——一切都如他起初所知的那样——我就称颂审判之主，尊崇他，因为他使太阳从东方的窗户出来；太阳上升，在天空的表面升起[c]，又出发沿着他所指示的道路行进。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下方”也可译作“下面”“往下”或“低处”；在这个梦境中具体指哪里，并不明确。
    reason: lexical_alternative
  - marker: b
    text: 题面所引的吉兹语在此处被截断。按查尔斯版完整经文，动词所带的单数宾语后缀由紧接其后的“天空”加以说明；若只按截短文本直译，则可作“看见他”。
    reason: textual_and_syntactic_clarification
  - marker: c
    text: “天空的表面”也可译作“天面”。这里保留原文的空间意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: 我……时／于是（以整句结构表达）
  rationale: 该连词引出时间从句，并承接上文。汉语用前段叙事加“于是”连接主句，比逐字译作“而当……的时候”更自然，同时保留先后关系。
- source_word: ወፃእኩ
  choice: 我出去
  rationale: 第一人称单数完成式，表示从先前所在之处出来；不擅自指定出发地点。
- source_word: ታሕተ
  choice: 到了下方
  rationale: 保留“下、下方、下面”的空间意义，但不把梦境中的具体位置解释为某一特定领域。
- source_word: ወርኢክዎ
  choice: 看见天空
  rationale: 后缀形式表面上是阳性单数宾语，但据查尔斯版该词之后原有“天空”等续文，可理解为前指／复指宾语，后面的“天空”说明其所指；因此正文按完整句法译出，而不孤立地译成“看见他”。
- source_word: ሰማይ
  choice: 天空／天面
  rationale: 通常译作“天空”或“天”；后文涉及太阳在其表面上升时，以“天面”保留原有空间图景。
- source_word: እግዚአ፡ ኩነኔ
  choice: 审判之主
  rationale: 保留属格式称号及审判主题，不扩展为某一宗派性的神学称谓。
theological_decisions:
- issue: ወርኢክዎ 中宾语后缀的身份
  choice: 按后续名词“天空”理解为前指／复指宾语，正文译作“看见天空”。
  alternative: 若只依据题面所截取的短句，可直译为“我看见他”；但这会割裂查尔斯版完整经文的句法。
  rationale: 最新校勘说明题面吉兹语因解析而被截断，完整版本紧接着出现“天空”。翻译应优先恢复完整句法，同时用脚注交代形式上的问题。
- issue: “他起初所知道的”中“他”的所指
  choice: 保留代词“他”，不在正文中补成“上帝”或“主”。
  alternative: 依上下文明确译作“上帝起初所知道的”。
  rationale: 现有证据中的代词所指虽可能指向神，却不宜在正文中消除原文保留的指称张力。
- issue: 宇宙运行图景
  choice: 保留“东方的窗户”“天面”和受指示的道路等具象表达。
  alternative: 意译为太阳按既定轨道运行。
  rationale: 这些意象属于文本的启示文学宇宙图景；现代化改写会损失其文学与神学特征。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。长句按汉语节奏分成两句，但保留梦中所见、称颂及太阳运行的逻辑顺序。神称与宇宙意象采取较形式对应的译法；对截断文本及代词问题以脚注说明，不在正文中作过度确定的解释。
