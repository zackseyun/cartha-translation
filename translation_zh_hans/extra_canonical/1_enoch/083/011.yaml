revisions:
- from: 我出去，到了下方[a]，看见天空[b]、从东方升起的太阳、在西方落下的月亮和几颗星，也看见全地，以及万物都照着他起初所知道的样子存在；于是我称颂审判之主，尊崇他，因为他使太阳从东方的窗户出来。太阳上升，升到天面之上[c]，又启程沿着他所指示的道路运行。
  to: 当我出去，来到下方[a]，看见天空[b]、从东方升起的太阳、在西方落下的月亮、几颗星、全地和万物——一切都如他起初所知的那样——我就称颂审判之主，尊崇他，因为他使太阳从东方的窗户出来；太阳上升，在天空的表面升起[c]，又出发沿着他所指示的道路行进。
  rationale: 修订恢复并保留完整经文所见的宇宙图景与叙事逻辑，维持“他”的未明指称及“下方”的空间歧义。主要更正“天面之上”造成的空间关系偏移，删去“存在”的无据增补，并润饰开头和长句节奏。
