base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/016/001.yaml
  text: From the days of the slaughter and destruction and death of the giants[a], the spirits that have gone out from the souls of their flesh shall destroy without incurring judgment; thus they shall destroy until the day of the completion of the great judgment[d][c][b], when the great age shall be brought to its end.
translation:
  language: zh_hans
  text: 从巨人遭杀戮、毁灭和死亡的日子起[a]，那些从他们肉身的魂中出来的灵[b]，必肆行毁坏而不受审判；他们要这样毁坏，直到大审判完成之日，那时，这大时代将走到尽头[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头一句的传本文字较难；这里按上下文理解为：从巨人遭杀戮、毁灭和死亡之时起，这些灵便持续进行毁坏。
    reason: textual_variant
  - marker: b
    text: “从他们肉身的魂中出来的灵”直译自一个不寻常而艰涩的短语；在上下文中，很可能指与守望者后裔有关的离体之灵。
    reason: lexical_alternative
  - marker: c
    text: “大时代”也可译作“大世界”或“大世序”；原词兼有时代与世界的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: እመዋዕለ
  choice: 从……的日子起
  rationale: 保留时间起点的含义，比单纯译作“在……的日子”更准确。
- source_word: ቀትል ወሙስና ወሞተ ረዓይት
  choice: 巨人遭杀戮、毁灭和死亡
  rationale: 将ረዓይት按上下文及希腊旁证理解为“巨人”，并保留灾难性三联语。
- source_word: ወፅአ መናፍስት እምነፍሳት ሥጋሆሙ
  choice: 那些从他们肉身的魂中出来的灵
  rationale: 尽量保留原文不寻常的属格结构和“出来”的具体意象，不将其顺译为一般性的亡灵。
- source_word: ዘያማስን
  choice: 肆行毁坏／毁坏
  rationale: 该动词在此指持续造成破坏；首处用“肆行毁坏”使汉语自然，复现处用“毁坏”保留原文重复。
- source_word: ዘእንበለ ኵነኔ
  choice: 而不受审判
  rationale: 表达其毁坏活动在最终审判前未受到审判，同时不额外解释为无罪或免于定罪。
- source_word: እስከ ዕለተ ተፍጻሜት ኵነኔ ዐቢይ
  choice: 直到大审判完成之日
  rationale: 保留“完成”这一名词性末世意象，并采用自然庄重的现代汉语。
- source_word: አመ ዓለም ዐቢይ ይትፌጸም
  choice: 那时，这大世代将走到尽头
  rationale: ዓለም可指时代、世界或世序；正文取“世代”以表达一个世界时代达到终局，同时以脚注保留歧义。
theological_decisions:
- issue: 这些灵的身份与来源
  choice: 正文保留“从他们肉身的魂中出来的灵”这一宽而具体的表述
  alternative: 明确译为“巨人死后离开身体的灵”或泛指所有离体之魂
  rationale: 近处语境指向守望者后裔的死后之灵，但原文措辞艰涩；不在正文中把身份解释得比文本更明确。
- issue: “不受审判”的时间与性质
  choice: 指这些灵持续毁坏，直到最终的大审判
  alternative: 理解为这些灵永不被定罪，或其行为本身不构成罪
  rationale: 后句明确设定“大审判完成之日”为终点，因此正文避免导出永久免责的教义结论。
- issue: ዓለም的末世含义
  choice: 大世代
  alternative: 大世界／大世序／永恒
  rationale: 保留一个时代或世界秩序达到终局的末世意味，不暗示受造界必然被彻底消灭。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。“肆行毁坏”传达持续作恶的力度；关键的艰涩属格结构则有意保留，并以脚注说明。所有脚注标记均已置于正文。
