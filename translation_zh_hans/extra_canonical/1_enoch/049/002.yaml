base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/002.yaml
  text: For he is mighty in all the hidden things of righteousness[a], and lawlessness will pass away like a shadow and have no permanence; for the Chosen One stands before the Lord of Spirits, and his glory is forever and ever[d][c][b], and his power from generation to generation.
translation:
  language: zh_hans
  text: 因为他在公义的一切隐秘之事上大有能力[a]；不法必如影子消逝，不能长存[b]。因为蒙拣选者[c]站在万灵之主面前[d]；他的荣耀直到永永远远，他的能力直到世世代代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公义的一切隐藏之事”。原文可指隐藏的层面，也可指属于公义的隐秘事项。
    reason: lexical_alternative
  - marker: b
    text: 或译“不能继续存留”或“无立足之地”。原文从字面上否定不法能够站立或存留。
    reason: lexical_alternative
  - marker: c
    text: “蒙拣选者”是《比喻篇》中反复出现的称号，指与审判和为义人伸冤有关的尊荣人物。
    reason: cross_reference
  - marker: d
    text: 原文也可较形式化地译作“已经站立”；这里的动词形式可表达已经确立并持续至今的站立状态。
    reason: grammar
lexical_decisions:
- source_word: ኃያል
  choice: 大有能力
  rationale: 表达强大、有能力之意，既保留启示文学的庄重感，也不夸大为绝对全能。
- source_word: ኅቡአተ ጽድቅ
  choice: 公义的一切隐秘之事
  rationale: 保留“隐藏、隐秘”的复数含义及其与“公义”的所属关系，不擅自技术化为“奥秘”。
- source_word: ዓመፃ
  choice: 不法
  rationale: 在与“公义”的对照中表达广义的违逆正道和作恶，不将词义缩窄为暴力或社会不公。
- source_word: ጽላሎት የኃልፍ
  choice: 如影子消逝
  rationale: 保留原文简洁鲜明的影子比喻，并以将来语气配合审判语境。
- source_word: ምቅዋመ አልቦ
  choice: 不能长存
  rationale: 自然表达原文对站立、存留或持续的否定，同时不武断限定为司法意义上的“无立足之地”。
- source_word: ኅሩይ
  choice: 蒙拣选者
  rationale: 作为《比喻篇》中反复出现的人物称号处理；“蒙拣选者”庄重清楚，又不引入后来的基督论称谓。
- source_word: ቆመ
  choice: 站
  rationale: 姿态动词的完成式可表达持续的当前状态；“站”比“已经站过”更准确自然。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 保留以众灵为范围的独特神圣称号，并采用简洁、庄重的中文表达。
- source_word: ስብሐቲሁ
  choice: 他的荣耀
  rationale: “荣耀”符合圣经及启示文学语域，也与随后永恒性的表述自然衔接。
- source_word: ለዓለመ ዓለም
  choice: 直到永永远远
  rationale: 以常见而庄重的中文重叠表达传达永恒公式。
- source_word: ለትውልደ ትውልድ
  choice: 直到世世代代
  rationale: 保留逐代延续的原文结构和诗性平行。
theological_decisions:
- issue: ኅሩይ 是称号还是普通描述语
  choice: 译作称号“蒙拣选者”
  alternative: 译作描述性的“那蒙拣选的人”或“被选中的人”
  rationale: 该词在《以诺一书》的《比喻篇》中反复指向一位与审判和伸冤相关的尊荣人物；按称号翻译可保留篇章内功能，却不把后期教义身份直接写入经文。
- issue: ቆመ 的时体
  choice: 译作当前持续状态“站”
  alternative: 译作“已经站立”或“曾站立”
  rationale: 吉兹语姿态动词的完成式常具状态性；此处重点是蒙拣选者处于万灵之主面前，而非一个已经结束的动作。
- issue: ዓመፃ 在与 ጽድቅ 对照时的范围
  choice: 译作“不法”
  alternative: 译作“暴行”“邪恶”或“不义”
  rationale: “不法”能维持公义与悖逆正道之间的广义对照，避免只理解为肢体暴力或某一种不公。
- issue: ምቅዋመ አልቦ 是否含司法意象
  choice: 正文译作“不能长存”
  alternative: 译作“无立足之地”或“不能站立”
  rationale: 原表达字面否定站立或存留，可能带有审判场景的回响；正文采用自然且不排他的“不能长存”，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句法保持原文两组因果与并列结构，以分号和句号避免中文长句拖沓；保留“影子”“站在……面前”“永永远远”“世世代代”等启示文学意象与诗性平行。
