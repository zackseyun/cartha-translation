base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/004.yaml
  text: And he will judge the hidden things[a], and no one will be able to speak an empty word before him, for he is the Chosen One before the Lord of Spirits[c][b], according as he has willed.
translation:
  language: zh_hans
  text: 他要审判隐秘的事；在他面前，没有人能说虚妄之言[a]，因为他是在万灵之主面前蒙拣选的那一位，照着他的旨意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处吉兹语抄本文字较难。“虚妄之言”也可理解为“空话”或“谎言”。
    reason: textual_variant
lexical_decisions:
- source_word: ይኴንን
  choice: 要审判
  rationale: 该动词表示审判、裁决；结合上下文的将来指向，译作“要审判”，保留其司法性含义。
- source_word: ዘኅቡአተ
  choice: 隐秘的事
  rationale: 源自“隐藏、遮蔽”一类词根；“隐秘的事”既贴近原文，又保留启示文学中隐藏之事终被审判的意味。
- source_word: በከ፡ አልቦ፡ ዘይክል፡ ብሂለ፡ በቅድሜሁ
  choice: 在他面前，谁也不能说一句虚妄的话
  rationale: 抄本此处文字较难，但整体是否定人在他面前说空洞、虚妄或虚假之言的可能。“虚妄的话”兼顾字面上的空虚与道德上的虚假。
- source_word: ኅሩይ
  choice: 蒙选者
  rationale: 本词在《以诺一书》的比喻篇中用作末世人物的称号；“蒙选者”保留称号性质，又不引入后期教义表述。
- source_word: እግዚአ፡ መናፍስት
  choice: 万灵之主
  rationale: 这是《以诺一书》中反复出现的固定称号；“万灵之主”以自然而庄重的现代汉语表达复数“诸灵”的总体意义。
- source_word: በከመ፡ ውእቱ፡ ፈቀደ
  choice: 正如他所定意的
  rationale: 保留“照着他所愿、所定意”的意思，并维持原文第三人称所具有的指代张力，不擅自补明所指。
theological_decisions:
- issue: ኅሩይ 是称号还是普通形容语
  choice: 蒙选者
  alternative: 被选中的人；那蒙拣选的一位
  rationale: 在比喻篇的局部语境中，此词是反复出现的末世性称号。译为“蒙选者”可显出称号功能，但不把该人物直接等同于后期基督教的特定称谓。
- issue: 末句“他所定意的”中代词的指向
  choice: 保留“他”的含混性
  alternative: 明确译为“照着万灵之主的旨意”
  rationale: 原文只用第三人称代词；虽然语境可能指万灵之主，译文不应在正文中消除原有的指代空间。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“审判”“隐秘的事”“万灵之主”保持启示文学语域；避免生硬直译，也不以任何宗派性的专门术语解释“蒙选者”。
