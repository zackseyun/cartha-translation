base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/003.yaml
  text: And in him dwells the spirit of wisdom[a], and the spirit that gives understanding, and the spirit of instruction and might[d][c][b], and the spirit of those who sleep in righteousness.
translation:
  language: zh_hans
  text: 在他里面住着智慧之灵[a]、赐人领悟的灵[b]、训诲和能力之灵，以及那些在公义中睡着之人的灵[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住着”也可译作“常住”；原文动词有居住、停留之意，并表示持续的状态。
    reason: lexical_alternative
  - marker: b
    text: “赐人领悟的灵”也可译作“领悟之灵”；原文既可侧重这灵使人领悟的作用，也可描述其特质。
    reason: lexical_alternative
  - marker: c
    text: 直译为“那些在公义中睡着之人的灵”。这很可能指在公义中死去的人，但也可理解为“那些在公义中安息之人”。
    reason: alternative_reading
lexical_decisions:
- source_word: ቦቱ፡ የኃድር
  choice: 在他里面住着
  rationale: ቦቱ 表示“在他里面”，未完成式 የኃድር 表示持续居住或常在；用“住着”保留其现在、延续的状态，不改作过去时或“在他身上”。
- source_word: መንፈሰ
  choice: 灵
  rationale: 本节列举所赋予或内住的属灵特质，“灵”最符合语境，也保留其启示文学的庄重色彩。
- source_word: ጥበብ
  choice: 智慧
  rationale: 此处指道德与认知意义上的智慧，“智慧”是现代汉语中自然且准确的对应词。
- source_word: ዘያሌቡ
  choice: 赐人领悟的
  rationale: 该形式带有使役或产生效果的言语力量；译作“赐人领悟的”比单纯的“领悟之灵”更能保留其动态含义。
- source_word: ትምህርት
  choice: 教导
  rationale: 可指教训、教导或训诲；“教导”通顺明白，并适合与“能力”并列。
- source_word: ኃይል
  choice: 能力
  rationale: 此词可指力量、权能；“能力”在此既自然又保持较宽的语义范围，避免额外加入统治权柄的含义。
- source_word: እለ፡ ኖሙ፡ በጽድቅ
  choice: 那些在公义中安睡之人
  rationale: 直译保留“睡”的启示文学意象，并以“安睡”自然表达可能指向已死义人的含义，而不把这一指向明说成定论。
theological_decisions:
- issue: 末句“那些在公义中睡着之人的灵”的所指
  choice: 保留为“那些在公义中安睡之人的灵”
  alternative: 义人的灵；那些安息在公义中的人的灵
  rationale: 原文的“睡”在启示文学中可能指义人之死，却也可按“安息”理解。正文保留意象和所有格关系，不将其教义性地化约为某一种解释。
- issue: 灵与领悟之间的关系
  choice: 赐人领悟的灵
  alternative: 领悟之灵
  rationale: 原文表达可能描述此灵所产生的作用，也可能表示其特征；正文体现动词性，脚注保留性质性理解。
- issue: 灵居住的位置与时态
  choice: 在他里面住着
  alternative: 停留在他身上；住在他里面
  rationale: ቦቱ 指“在他里面”，未完成式表示当前或持续状态。这样既忠于语法，也避免沿用过去时“降在／停在他身上”的解释性措辞。
translation_notes:
  register: 采用现代、庄重而清楚的简体中文。保留原文连续列举“灵”的节奏，并保留末句关于“安睡”及其所指的启示文学张力。所有脚注标记均置于正文相关词句之后。
