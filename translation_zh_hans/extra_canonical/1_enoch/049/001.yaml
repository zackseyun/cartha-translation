base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/001.yaml
  text: For wisdom has been poured out like water[c][b][a], and glory will not fail before him forever and ever.
translation:
  language: zh_hans
  text: 因为智慧已如水倾泻而出[c]，荣耀在他面前永不消逝，直到永永远远[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的吉兹文没有说明“他”具体指谁；较广的上下文可能指向前文提到的一位尊高者，但本节本身并未点明。
    reason: alternative_reading
  - marker: b
    text: 或译：“荣耀在他面前永不终结。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“智慧如水涌流。”原文为完成体，也可着重表达已经形成的状态。
    reason: aspectual_alternative
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 保留解释前文、说明缘由的连接作用；现代汉语中自然庄重。
- source_word: ጥበብ
  choice: 智慧
  rationale: 采用该词在智慧文学和启示语境中的常用义，不作过度阐释。
- source_word: ክዕወ
  choice: 已经……倾注而出
  rationale: 按修订意见体现完成体或既成状态，并以“倾注而出”保留与水相配的充沛意象。
- source_word: ከመ ማይ
  choice: 如水
  rationale: 直译明喻，简洁保留原文意象。
- source_word: ወስብሐት
  choice: 荣耀
  rationale: 在天上尊荣的语境中最为贴切，同时不排除光辉、荣美等语义色彩。
- source_word: ኢትኃልቅ
  choice: 永不止息
  rationale: 表达不终止、不耗尽的持续意义，并与末尾永恒用语自然结合。
- source_word: ቅድሜሁ
  choice: 在他面前
  rationale: 保留原文空间与关系含义，不擅自指明代词所指。
- source_word: ለዓለመ ዓለም
  choice: 永不
  rationale: 与“不止息”合译为“永不止息”，以现代汉语自然表达原文强化的永久时限。
theological_decisions:
- issue: “在他面前”中“他”的所指
  choice: 正文保留“他”，不明确其先行词
  alternative: 译作“在万灵之主面前”或“在蒙拣选者／人子面前”
  rationale: 本节吉兹文只出现第三人称代词，没有明说所指；保留含混可避免按神学预期补足。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“已经……倾注而出”体现首个动词的完成体，与后半句持续不止的表达形成区别；代词所指保持原文含混。
