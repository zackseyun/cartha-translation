base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/009.yaml
  text: 'Woe to you[a], sinners, because of the words of your mouth and because of the deeds of your hands[b], which your wickedness has done: in the heat of a flame more burning than fire you shall burn.'
translation:
  language: zh_hans
  text: 祸哉，你们这些罪人！因你们口中的言语，也因你们手所做的事——这些都是你们的不敬虔所作的[a]：你们必在比火更灼热的烈焰中焚烧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些都是你们的不敬虔所作的”在原文中句法较难确定；它很可能同时概括前面的言语和行为，也可能只与紧邻的“手所做的事”相连。
    reason: syntactic_ambiguity
  - marker: b
    text: 或译：“你们必在炽烈的火焰中焚烧。”原文此处含有与“火”比较的表达，故正文按“比火更灼热”翻译；另一种理解将其视为加强火焰强度的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: 祸哉
  rationale: 保留启示文学宣告审判时强烈、庄重的警告语气，不弱化为单纯的哀叹。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 直接表达受审判者的道德身份，简明且符合现代汉语宗教文体。
- source_word: ዲበ
  choice: 因
  rationale: 本节中该词引出灾祸与审判的缘由，分别关联口中的言语和手上的行为。
- source_word: ነገረ አፉክሙ
  choice: 你们口中的言语
  rationale: 保留原文具体的身体意象，并与“你们手上的行为”构成平行。
- source_word: ተግባረ እዴክሙ
  choice: 你们手上的行为
  rationale: 既保留“手”的原文意象，又以“行为”自然表达实际所做之事。
- source_word: ርስዓኒክሙ
  choice: 你们的不敬虔
  rationale: 该词不只指一般邪恶，也带有对神不敬、悖逆的宗教道德色彩；“不敬虔”兼顾这一维度而不加入额外教义。
- source_word: በዋዕየ ላህብ እምእሳት
  choice: 在比火更灼热的烈焰中
  rationale: 保留እም所体现的比较意味，也传达原文层叠而强烈的火焰意象；汉语表达则避免不必要的生硬重复。
- source_word: ይውዒ
  choice: 你们必……焚烧
  rationale: 依据本节经校勘所支持的第二人称复数将来意义，直接保留对罪人的审判宣告；不扩译为“烧尽”。
theological_decisions:
- issue: 审判缘由应主要表达为一般道德邪恶，还是带有宗教意味的不敬虔
  choice: 你们的不敬虔
  alternative: 你们的邪恶
  rationale: 原词包含不敬神与邪恶相连的意味。“不敬虔”保留这种神学张力，同时不把它扩展为后来的特定教义概念。
- issue: 困难关系从句所概括的对象
  choice: 以“这一切”承接口中的言语和手上的行为
  alternative: 只把“你们的不敬虔所造成的”连接于手上的行为
  rationale: 原文句法不够明晰；此译法按较可能的理解，使该短语概括前述言语与行为，但用脚注保留另一种句法可能。
- issue: 火焰短语是否具有比较意义
  choice: 比火更灼热的烈焰
  alternative: 炽烈的火焰
  rationale: 保留እምእሳት可能具有的比较力，不把强烈而略显悖论的意象平化为一般的“火焰”。
translation_notes:
  register: 采用现代、庄重而易懂的审判宣告语体。“祸哉”保留启示文学色彩；口与手的平行意象予以保留。主句用破折号帮助读者把握困难的关系结构，并由脚注说明其不确定性。
