base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/007.yaml
  text: Woe to you[a], sinners, when you oppress the righteous on the day of fierce distress, and burn them with fire[b]; then you will be repaid according to your deeds.
translation:
  language: zh_hans
  text: 你们这些罪人有祸了！当你们在苦难极深的日子[b]欺压[a]义人、用火焚烧他们时，你们必照自己的行为受到报应。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欺压”也可译作“使……受苦”或“迫害”；原词表示严酷地对待义人，但未必限定暴力的具体形式。
    reason: lexical_alternative
  - marker: b
    text: “苦难极深的日子”较直译为“强烈苦难之日”；也可译作“极大患难之日”，但正文避免采用可能使人联想到后期固定末世术语的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ፡ ኃጥኣን
  choice: 你们这些罪人有祸了
  rationale: 保留先知性灾祸宣告的直接语气，并明确称呼对象为“罪人”，不将其弱化为一般的作恶者。
- source_word: ሶበ
  choice: 当……时
  rationale: 按上下文理解为时间连接词，引出罪人遭报应之前所行的暴行；同时不排除这些行为构成宣告灾祸的缘由。
- source_word: ታመኒድብዎሙ
  choice: 欺压
  rationale: 该词表示使人受苦、严酷对待；“欺压”可体现持续而强暴的压迫，又不把含义限定为某一种制度性或宗教性迫害。
- source_word: ጻድቃን
  choice: 义人
  rationale: 这是《以诺书》中具有伦理和末世色彩的重要群体称谓；“义人”简洁并能与全书用语保持一致。
- source_word: በዕለተ፡ ጻዕብ፡ ኃያል
  choice: 在苦难极其深重的日子
  rationale: 原文把“日子”与苦难及强烈程度相连；此译法保留其强度和末世氛围，却不使用可能带有后期技术含义的固定术语。
- source_word: ታነድድዎሙ፡ በእሳት
  choice: 用火焚烧他们
  rationale: 直陈原文具体而残酷的火烧意象，不作淡化。
- source_word: ወትትፈደዩ
  choice: 你们必……受到报应
  rationale: 表达被动或反身性的偿报含义；“受到报应”符合现代汉语，也保留审判意味而不擅自指明施行者。
- source_word: ከመ፡ ምግባራቲክሙ
  choice: 照自己的行为
  rationale: 保留行为与报偿相对应的公式；“行为”自然清楚，也不额外解释报应的具体方式。
theological_decisions:
- issue: 末句受报应者及施行报应者的认定
  choice: 延续第二人称，将罪人译为“你们必……受到报应”，但不明说谁施行报应
  alternative: 将末句处理为泛指、非人称的报偿陈述，或明确说是上帝施行报应
  rationale: 全节持续直接称呼罪人，因此末句继续以“你们”为主最符合修辞和语法脉络；原文并未在此明说施行者，所以不补入“上帝”，以保留原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“有祸了”保留灾祸宣告的力度；“焚烧”“受到报应”保持审判语境的严肃性。脚注标记紧随各自解释的词组，避免英文咨询层中标记与注释内容错位的问题。
