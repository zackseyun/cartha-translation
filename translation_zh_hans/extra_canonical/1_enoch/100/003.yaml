  yaml_path: translation/extra_canonical/1_enoch/100/003.yaml
  text: And a horse will walk up to its chest in the blood of sinners[d][c][b][a], and chariots will sink up to their tops.
translation:
  language: zh_hans
  text: 一匹马将在罪人的血中行走，血深至马的胸部[a]；战车也将下沉，直至没顶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “马的胸部”按吉兹语 እንግድዓሁ 直译；该词指马的胸部。这个意象与《启示录》14:20所说血达到“马的嚼环”相似，但本节原文并非“马辔”或“嚼环”。
    reason: lexical_clarification_and_cross_reference
lexical_decisions:
- source_word: የሐውር
  choice: 将……行走
  rationale: 按动词 ሐወረ 的限定形式理解，明确表达“将走／行走”；不弱化为静态的“处于”，也不采形容词性“白色”的疑难分析。
- source_word: ፈረስ
  choice: 马
  rationale: 原文为单数；中文“马”可自然表达类属或场景中的单匹马，无须擅自改为复数。
- source_word: እስከ እንግድዓሁ
  choice: 血深及胸
  rationale: እስከ 表示程度界限；እንግድዓሁ 指“它的胸／胸膛”。为使中文清楚，补出“血深”，同时保留达到胸部的夸张画面。
- source_word: ውስተ ደመ ኃጥኣን
  choice: 在罪人的血中
  rationale: 直译其处所关系与道德称谓；“罪人”保留原词的伦理和审判色彩。
- source_word: ሰረገላት
  choice: 战车
  rationale: 该词为“战车”的复数；现代汉语中“战车”本身不必另加复数标记。
- source_word: መልዕልታ
  choice: 顶
  rationale: 本义涉及高度或上部；在战车沉没的语境中，“顶”最清楚地表达淹没程度。
- source_word: ትሰጠም
  choice: 将下沉
  rationale: 在血液这一流体语境中译作“下沉”，自然呈现战车沉至顶部的意象，同时避免过度强调被动形式。
theological_decisions:
- issue: ኃጥኣን 的道德类别
  choice: 罪人
  alternative: 有罪的人；作恶者
  rationale: “罪人”直接保留末世审判语境中的道德含义，又不附加特定宗派的罪论解释。
- issue: 与《启示录》14:20的相似意象
  choice: 按本节吉兹语译为“胸”，不改成“嚼环／马辔”
  alternative: 参照《启示录》的“马嚼环”措辞
  rationale: 相似的血海审判意象不足以推翻本节 እንግድዓሁ 的解剖学意义；应避免以平行经文协调原文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“血深及胸”和“直没至顶”以简洁的程度表达重现两分句的平行结构；不依照《启示录》改写本节的独立措辞。
