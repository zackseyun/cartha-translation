base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/004.yaml
  text: In those days the angels will descend into the hidden places and gather together into one place all those who led others into sin[c][b][a]; and the Most High will arise on that day of judgment to execute great judgment in the midst of the sinners.
translation:
  language: zh_hans
  text: 在那些日子，众天使要降到隐秘之处[a]，把所有助长罪恶的人[b]聚集到一处；至高者要在那审判之日兴起，在罪人中施行大审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐秘之处”也可译作“秘密之处”或“藏匿之地”。
    reason: lexical_alternative
  - marker: b
    text: 这一短语的文本和含义都较难确定。手稿传统所见的读法可理解为“帮助、助长罪恶的人”；本题所给转录则写作近似“使罪降下的人”或“让罪下来的人”。另有人按意义译作“引人犯罪的人”。
    reason: textual_variant
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留以诺传统中反复出现的末世时间用语，并直译“日子”而不泛化为“时期”。
- source_word: መላእክት
  choice: 众天使
  rationale: 审判语境明确指超自然使者；“众”自然表达复数。
- source_word: ይወርዱ
  choice: 要降到
  rationale: 保留天使从天而降的垂直意象；“要”表达预告性的将来行动。
- source_word: ውስተ ምኅባእት
  choice: 到隐秘之处
  rationale: 既可指隐藏、秘密的地方；采用不额外限定具体地点的自然中文。
- source_word: ወይገብእዎሙ በአሐዱ መካን
  choice: 把……聚集到一处
  rationale: 同时体现收拢众人及把他们带往同一地点的意思。
- source_word: ለእሉ እለ ይወርደዋ／手稿传统所见 ይረድእዋ ለኃጢአት
  choice: 所有助长罪恶的人
  rationale: “助长罪恶”自然表达“帮助罪恶”的异常搭配，又不把对象泛化为所有罪人，也不武断加入原文未明说的“引诱别人”。抄本文本与所给转录之间的差异另见脚注。
- source_word: ወይትነሣእ ልዑል
  choice: 至高者要……兴起
  rationale: 将 ልዑል 作为神圣称号译为“至高者”，并保留动词“兴起”所表达的主动介入。
- source_word: በይእቲ ዕለት ኵነኔ
  choice: 在那审判之日
  rationale: 保留庄严的审判日公式及指示词“那”。
- source_word: ከመ ይግበር ኵነኔ ዐቢየ
  choice: 施行大审判
  rationale: “施行审判”是自然、庄重的现代中文司法表达，并保留“大”的强调。
- source_word: እማእከሎሙ ለኃጥኣን
  choice: 在罪人中
  rationale: 忠实保留“在……中间”的场景，不改写为仅仅“审判罪人”。
theological_decisions:
- issue: 天使所聚集之人的身份
  choice: 助长罪恶的人
  alternative: 引人犯罪的人；使罪降下的人；所有罪人
  rationale: 相关吉兹语句存在文本和句法困难。“助长罪恶”保留他们与罪恶发展之间的主动关联，却不将其简单等同于所有罪人，也不擅自确定他们必然是引诱他人犯罪者。
- issue: 神圣称号 ልዑል
  choice: 至高者
  alternative: 崇高者
  rationale: “至高者”是准确、通行且庄重的神圣称号，不额外引入后期神学身份判断。
- issue: 至高者在审判中的行动
  choice: 兴起……施行大审判
  alternative: 被高举……作出大审判
  rationale: 上下文描写神主动介入审判；保留“兴起”也避免把动词静态化为地位上的“被高举”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“在那些日子”“审判之日”“至高者”“施行大审判”保留启示文学的肃穆节奏；困难句用正文中的克制表达配合脚注，不在正文中消除真实歧义。
