base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/001.yaml
  text: And in those days[a], in one place, fathers together with their sons will be struck down[d][c][b], and brothers together with their companions will fall in death until a stream flows from their blood.
translation:
  language: zh_hans
  text: 在那些日子[a]，父亲和儿子将在一处一同被击倒[b]，弟兄和同伴也必一同倒毙，直到他们的血汇成一股溪流[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在那些日子”是启示文学常用的时间表达，指向所预告的灾难时期。
    reason: cultural_note
  - marker: b
    text: 现有埃塞俄比亚语转写在这里有疑难；所附校勘认为该词是误读，原词应为被动式，意为“被击倒”。若依现有转写，也可能理解为“彼此攻击”。
    reason: textual_variant
  - marker: c
    text: 原文的画面是流出的血汇聚成一股水流；“汇成一股溪流”保留了这种强烈的末世性夸张。
    reason: cultural_note
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: 在那些日子
  rationale: 保留启示文学中常见的时间公式，语气庄重而自然。
- source_word: በ፻መካን
  choice: 在一处
  rationale: 现有转写形式难解，但大意似为单数处所；采用克制的地点表达，不进一步推断具体场景。
- source_word: አበው፡ ምስለ፡ ውሉዶሙ
  choice: 父亲和儿子一同
  rationale: 保留明确的父子关系及共同遭难的含义，不泛化为“父母和孩子”。
- source_word: ይትኃድኡ（可能误读；校勘为ይትጐድኡ）
  choice: 被击倒
  rationale: 依据所附校勘意见及希腊语残片支持，按被动义处理；这也与后半句“倒毙”构成平行。
- source_word: አኀው፡ ምስለ፡ ቢጾሙ
  choice: 弟兄和同伴一同
  rationale: “弟兄”保留亲属称谓，“同伴”则涵盖伙伴、同侪等关系，避免缩窄为现代口语中的“朋友”。
- source_word: ይወድቁ፡ በሞት
  choice: 倒毙
  rationale: 以自然、凝练的现代汉语表达“倒下而死”，并维持末世审判图景的肃穆力度。
- source_word: እስከ፡ ይውኅዝ፡ ትክዚ፡ እምደመ፡ ዚአሆሙ
  choice: 直到他们的血流成河
  rationale: 以汉语惯用而鲜明的说法重现血液汇流成水流的夸张意象，不把它弱化为抽象的社会冲突。
theological_decisions:
- issue: 暴力行为是彼此相残，还是众人被击杀
  choice: 父亲和儿子“被击倒”，弟兄和同伴“倒毙”
  alternative: 父亲与儿子彼此攻击，弟兄与同伴彼此残杀
  rationale: 现有埃塞俄比亚语转写会令人想到相互行为，但所附校勘指出该词很可能是表示“击打”的被动式之误读，并有希腊语残片佐证。因此正文采用被动义，同时在脚注中保留文本问题。
- issue: 血流意象的性质
  choice: 保留具体而夸张的“血流成河”图景
  alternative: 将其抽象化为严重的内乱或社会崩溃
  rationale: 原文描绘的是大量流血的末世性景象；译文不判断这是严格写实还是修辞夸张，也不将其消解为抽象概念。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“必”体现预言语气；“倒毙”比直译为“倒在死亡中”更符合汉语，同时保留暴力场面的凝重感。句法按两个平行分句处理，避免把“弟兄和同伴”悬置为残缺成分。
