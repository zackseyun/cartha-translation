base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/002.yaml
  text: For a man will not withhold his hand from his sons[a], nor from the sons of his sons, to kill them; and the sinner will not withhold his hand from his honored brother[b]. From dawn until the sun sets they will slaughter one another.
translation:
  language: zh_hans
  text: 因为人必不向自己的儿女和儿女的儿女收手，要杀害他们；罪人也必不向自己尊贵的兄弟收手。从黎明直到太阳落下，他们必彼此残杀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይከልእ እዴሁ
  choice: 必不收手
  rationale: 保留“手”这一具体的暴力意象；“不收手”也是自然的现代汉语表达，传达不加克制之意。
- source_word: እምውሉዱ
  choice: 自己的儿女
  rationale: ውሉድ 可指儿女或子女，不必限定为男性后代；“自己的”明确亲属关系。
- source_word: ውሉደ ውሉዱ
  choice: 儿女的儿女
  rationale: 保留原文重复的亲属结构及其节奏，不直接简化为“孙辈”。
- source_word: ከመ ይቅትሎ
  choice: 甚至要杀害
  rationale: 表达不收手所指向的杀戮目的或结果；“甚至”使汉语衔接自然，但不削弱其暴力程度。
- source_word: ኃጥእ
  choice: 罪人
  rationale: 保留以单数代表某类人的道德称谓，符合以诺文学的审判语境。
- source_word: እኍሁ ክቡር
  choice: 自己尊贵的兄弟
  rationale: ክቡር 可表示受尊重、尊贵或高贵；“尊贵”保留个人荣誉与社会地位之间的可能张力。
- source_word: እምጎሕ እስከ ትዐርብ ፀሐይ
  choice: 从黎明直到太阳落下
  rationale: 既保留从破晓到日落的整日跨度，也保留原文鲜明的太阳意象。
- source_word: ይትቃተሉ
  choice: 必彼此残杀
  rationale: 以互相伤杀的表达体现动词的相互性和强烈程度，避免弱化为一般的“争斗”。
theological_decisions:
- issue: 本节所描绘暴力的范围
  choice: 保留儿女、后代与兄弟等具体亲属关系，呈现家庭和社会纽带在审判景象中的崩解。
  alternative: 将其泛化为战场冲突，或视作不含实际亲属关系的夸张格言。
  rationale: 原文连续使用明确的家庭称谓，重点正在于连至亲与受尊重的亲属也无法约束杀戮；不宜将其淡化为一般冲突。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用“不收手”保留原文关于手的具体习语，用“彼此残杀”维持末世审判场景的强度；亲属称谓保持重复，以保存原文的修辞推进。
