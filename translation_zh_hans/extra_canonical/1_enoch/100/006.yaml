base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/006.yaml
  text: And wise men will see[a], and all the children of the earth will understand every matter of this book[c][b], and they will know that their wealth cannot save them from the destruction of their sins.
translation:
  language: zh_hans
  text: 智慧人必看见[a]，地上所有的儿女也必领悟这书中的一切事，并且知道：他们的财富不能在他们因罪败亡时救他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必看见”前的词也可理解为“确实”；若把它当作名词性成分，则可译为“必看见真实（或真相）”。原文句法有疑难。
    reason: lexical_alternative
  - marker: b
    text: “在他们因罪败亡时”较直译可作“在他们罪的毁灭中”；这既可能指罪所带来的毁灭，也可能被理解为罪本身的毁灭。
    reason: source_ambiguity
lexical_decisions:
- source_word: እሙነ፡ ይሬእዩ፡ ሰብአ፡ ጠቢባን
  choice: 智慧人必看见
  rationale: 句中እሙነ的句法与词义有一定疑难，可作“确实”理解，也可能与“真实”有关。正文不擅自补出明确宾语“真相”，以保留原文的开放性。
- source_word: ውሉደ፡ ምድር
  choice: 地上所有的儿女
  rationale: 较直译地保留本书富有启示文学色彩的“地之儿女”表达，同时按现代汉语调整为“地上的儿女”。
- source_word: ይሌብዉ
  choice: 领悟
  rationale: 此词在上下文中表示留心、理解或领会；“领悟”既自然，又与下文“知道”形成递进。
- source_word: ኵሎ፡ ነገረ፡ ዛቲ፡ መጽሐፍ
  choice: 这书中的一切事
  rationale: ነገር可指事、话语或事项；“一切事”保留其宽泛含义，不把它限定为书中的字句。
- source_word: ብዕሎሙ
  choice: 他们的财富
  rationale: 该词在此指财物、财富，并充当“不能”的主语；因此明确译出，避免误作反身代词。
- source_word: አድኅኖቶሙ
  choice: 救他们
  rationale: 按财富不能施行拯救的句法处理；“救他们”简洁而符合审判语境。
- source_word: በመዳቀ፡ ኃጢአቶሙ
  choice: 在他们因罪败亡时
  rationale: መዳቀ表达倒下、压碎、毁灭或败亡，而非“否认”；中文以“因罪败亡”自然呈现罪与毁灭的关联，同时由脚注保留属格关系的歧义。
theological_decisions:
- issue: 财富与拯救的关系
  choice: 人的财富不能在因罪而来的败亡中救人
  alternative: 人不能靠否认、减轻或除去自己的罪而自救
  rationale: 原文明确出现“他们的财富”，且它是“不能”的主语；末语涉及毁灭、倾覆，而不是可靠地表示否认罪。因此正文强调财富无力施救，不引入自我开脱的神学解释。
- issue: 罪与毁灭之间的语义关系
  choice: 译作“因罪败亡”，表达罪所导致的败亡
  alternative: 直译为“在他们罪的毁灭中”，也可能被理解为罪本身遭毁灭
  rationale: 原文属格结构允许一定张力。正文采用在审判语境中较自然的理解，但以脚注保存较字面的形式，避免把歧义完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的汉语；保留“地上的儿女”这一启示文学意象。用“必”传达预告语气，以“领悟—知道”呈现认识上的递进。
