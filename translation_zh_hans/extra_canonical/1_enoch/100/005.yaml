base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/005.yaml
  text: And he will appoint guardians from among the holy angels over all the righteous and holy ones[a], and they will guard them like the pupil of an eye, until every evil and every sin comes to an end. And even if the righteous sleep a long sleep[c][b], they have nothing to fear.
translation:
  language: zh_hans
  text: 他要从圣天使中指派守护者，看顾所有义人和圣洁的人[a]；他们要如同保护眼中的瞳仁那样守护这些人[b]，直到一切邪恶和一切罪都告终。即使义人长眠[c]，他们也没有什么可惧怕的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：“他要指派守护者，看顾所有义人和圣洁的人；这些守护者来自圣天使。”
    reason: 说明原文介词短语修饰“守护者”，避免误以为义人和圣洁的人来自天使之中。
  - marker: b
    text: “眼中的瞳仁”指受到极其严密保护之物，意思近于较常见的“眼中的珍宝”。
    reason: 解释原文具体的护眼比喻及其习语意义。
  - marker: c
    text: “长眠”很可能指死亡或死者的状态，但原文本身保留了“睡眠”这一委婉说法。
    reason: 说明可能的死亡含义，同时不在正文中消除原文意象的含混性。
lexical_decisions:
- source_word: ዐቀብተ
  choice: 守护者
  rationale: 此词源于“守护、看守”的词根；译为“守护者”既表达其职分，也避免与《以诺书》中作为专称的“守望者”混淆。
- source_word: ይሁብ
  choice: 指派
  rationale: 字面义为“给予”，但与守护者及其看顾对象连用时，意为委派或安排。
- source_word: ጻድቃን ወቅዱሳን
  choice: 义人和圣洁的人
  rationale: 保留两个并列称谓，不把“圣洁的人”处理成带有后期教会色彩的专称。
- source_word: እመላእክት ቅዱሳን
  choice: 从圣天使中
  rationale: 介词表示来源；守护者出自圣天使，而不是说受保护的人属于天使。
- source_word: የዐቅብዎሙ
  choice: 他们要……保护他们
  rationale: 与前面的“守护者”保留同一词根形成的守护主题，并明确其保护作用。
- source_word: ከመ ብንተ ዐይን
  choice: 像保护眼中的瞳仁一样
  rationale: 原文直指眼睛中受到严密保护的部分；“瞳仁”自然、具体，也保留该比喻的鲜明性。
- source_word: እስከ ይዌድእ ኵሉ እኩየ ወኵሉ ኃጢአተ
  choice: 直到一切邪恶和一切罪都告终
  rationale: 动词表达完成、终结；此译法保留终局审判的结果，同时不在中文正文中强行补明未明说的施事者。
- source_word: እመኒ
  choice: 即使
  rationale: 表达让步关系：纵然出现后文所说的长眠，保护的应许仍然成立。
- source_word: ይነውሙ ንዋመ ነዋኅ
  choice: 长眠
  rationale: 用自然的中文保留“睡眠”这一委婉意象，不直接把它解释为死亡。
- source_word: አልቦ ዘይፈረሁ
  choice: 他们也没有什么可惧怕的
  rationale: 以现代中文自然表达不存在任何应当惧怕之人或事的意思。
theological_decisions:
- issue: 天使的守护应按字面保留，还是淡化为一般性的神圣眷顾
  choice: 正文明确保留圣天使中守护者的看顾
  alternative: 把天使语言理解并译成一般性的神圣保护
  rationale: 原文明确提到圣天使及守护者；译文应保留其启示文学世界观，而不将其非神话化。
- issue: “长眠”是否应直接译成死亡
  choice: 正文保留“长眠”
  alternative: 译作“死亡”或“在死亡中沉睡”
  rationale: 原文使用睡眠意象，可能指死亡或死者的状态，但没有直接使用“死”；保留委婉说法可维持原文的含混与神学张力。
- issue: 终结邪恶与罪的动词是否应补出明确主语
  choice: 译为“一切邪恶和一切罪都告终”
  alternative: 译为“直到他使一切邪恶和一切罪终结”
  rationale: 原文动词形式可使读者联想到一位施事者，但本节没有明说其身份；采用中文无显式施事者的表达，既保留终结之意，也不擅自把主语确定为上帝或另一位人物。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“指派守护者”“看顾”“长眠”等用语兼顾自然表达与启示文学语气；避免使用可能带入后期宗派含义的术语。
