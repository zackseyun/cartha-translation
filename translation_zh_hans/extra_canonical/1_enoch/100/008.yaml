base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/008.yaml
  text: 'Woe to you[a], hard of heart, who stay awake to devise evil: fear will come upon you[c][b], and there will be no one to help you.'
translation:
  language: zh_hans
  text: 你们这些心里刚硬、醒着[a]图谋恶事的人有祸了！恐惧必临到你们，[b]没有人会帮助你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “醒着”也可理解为“警觉”“专注守候”或“伺机而动”；这里指人刻意保持清醒，以便图谋恶事。
    reason: lexical_alternative
  - marker: b
    text: 或译：“恐惧必追上你们”或“恐惧必找到你们”。原文动词可表示“找到”“达到”或“追上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: 有祸了
  rationale: 这是宣告审判的祸哉格式；“有祸了”既保留谴责和警告的力度，也符合现代汉语表达。
- source_word: ግዙፋነ ልብ
  choice: 心里刚硬
  rationale: 该短语指内心顽梗、道德上麻木不化；“心里刚硬”自然清楚，又不把含义缩减为骄傲或勇敢。
- source_word: ትተግሁ
  choice: 警醒着
  rationale: 原词可指醒着、警觉或专注守候；这里的警醒以作恶为目的，译文保留这种刻意持续的状态，同时在脚注说明其他可能色彩。
- source_word: ከመ ትሰብውዎ ለእኩይ
  choice: 图谋恶事
  rationale: ከመ 引出目的，后面的表达不只是心中想到恶，而是有意筹划恶事；“图谋”准确传达其蓄意性。
- source_word: ፍርሀት
  choice: 恐惧
  rationale: 原名词可涵盖害怕、惊恐或恐怖；“恐惧”保持语义宽度，并让审判语境本身体现威胁的强度。
- source_word: ይረክብክሙ
  choice: 必临到你们
  rationale: 该动词基本义包括找到、达到、追上；“临到”在汉语审判宣告中自然，同时不武断限定恐惧如何追及他们。
- source_word: ወአልቦ ዘይረድአክሙ
  choice: 没有人会帮助你们
  rationale: 直截了当地表达无人援助、无法得救的结局，语言现代而庄重。
theological_decisions:
- issue: 这句祸哉宣告的性质
  choice: 对内心刚硬、蓄意作恶者发出的审判宣告
  alternative: 对罪人的一般哀叹，或仅是关于心理焦虑的警告
  rationale: 开头的祸哉用语、对受话者的道德刻画，以及末尾无人相助的宣告共同构成司法性的末世审判警告；译文不将其淡化为一般感叹或心理描述。
- issue: “恐惧临到”的所指
  choice: 保留为“恐惧”，不明确增补其来源或具体形式
  alternative: 明确译为上帝的刑罚、敌人的袭击或内心焦虑
  rationale: 原文只说恐惧将找到或追上他们，并未明说其来源；保留这种开放性可避免替文本消解其神学张力。
translation_notes:
  register: 采用现代、庄重而直接的审判宣告语体。“心里刚硬”“图谋恶事”“没有人会帮助你们”便于普通读者理解；脚注保留“警醒”和“临到”背后的词义幅度。
