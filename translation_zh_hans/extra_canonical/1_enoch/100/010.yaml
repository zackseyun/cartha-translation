base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/010.yaml
  text: And now[a], know that your deeds will be investigated by the angels in heaven, and by the sun and the moon and the stars, concerning your sins[b], because upon the earth you execute judgment upon the righteous.
translation:
  language: zh_hans
  text: 而如今，你们要知道[a]：天上的天使、太阳、月亮和众星必会查验你们的行为，查究你们的罪[b]；因为你们在地上审判义人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节现有提示所引的吉兹语主文本只保留了开头“而如今，你们要知道……”；正文其余部分依据同一节在查尔斯1906年版中所载的后续吉兹语文本补全。
    reason: textual_variant
  - marker: b
    text: 原文将天上的天使、太阳、月亮和众星并列为查验、查究的主体，但没有进一步说明它们各自怎样参与；“查验”也可译作“察验”或“搜查”。
    reason: translation_ambiguity
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 该词由连接成分与时间副词构成，用来转换话题并引出劝诫；现代汉语以“现在”自然表达，句首语气已含承接作用，无须生硬加上“而如今”。
- source_word: አእምሩ
  choice: 你们要知道
  rationale: 这是表示知道、明白的复数命令式；补出复数主语“你们”，并用“要知道”保留劝诫语气。
- source_word: ይትኀሠሥ
  choice: 必……被……察验
  rationale: 该被动式含搜查、查究、检验之意；“察验”既保留审查行为的严肃性，也避免过早将其限定为正式司法调查。
- source_word: ምግባሪክሙ
  choice: 你们的行为
  rationale: 该名词在此指人的作为、行径；“行为”比“工作”更符合罪与审判的语境。
- source_word: በእንተ፡ ኃጢአቲክሙ
  choice: 因你们的罪
  rationale: 介词短语表示相关缘由或事项；译作“因你们的罪”符合上下文，同时不把罪与行为简单视为同一概念。
- source_word: ትገብሩ፡ ኵነኔ
  choice: 审判
  rationale: 原文直指施行审判或定罪；采用“审判”保留其司法与神学张力，不弱化为一般的“欺压”。
- source_word: ጻድቀ፡ በጻድቃን
  choice: 义人
  rationale: 该处传本措辞略显重复或不整齐，但核心所指是义人；正文用自然汉语表达，不另行增补原文未明说的对象或方式。
theological_decisions:
- issue: 天使与天体在察验中的角色
  choice: 按原文并列为行为受到察验时涉及的主体，不解释其是否具有独立审判权
  alternative: 将太阳、月亮和众星仅解释为见证者，或把所有察验权只归给天使
  rationale: 原文把天使、太阳、月亮和众星并列，却没有系统说明各自角色；译文保留这种启示文学中的张力，不导入额外的天使论或宇宙论。
- issue: 恶人在地上“审判义人”
  choice: 直译为“审判义人”
  alternative: 解释性改写为“迫害义人”或“冤枉义人”
  rationale: 原文使用审判、定罪领域的词，可能带有不义裁断之意；直译可保留恶人僭行审判与将来受察验之间的反讽。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“你们要知道”保留复数命令式的劝诫力度；“察验”与“审判”维持启示文学的司法语域。标点把开头引介语、将来的察验及其原因分层呈现，同时避免把天体角色解释得超过原文。
