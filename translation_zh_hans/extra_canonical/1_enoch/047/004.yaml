base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/004.yaml
  text: And the hearts of the holy ones shall be filled with joy[a], because the number of the righteous has drawn near, and the prayer of the righteous has been heard[c][b], and the blood of the righteous has been avenged before the Lord of Spirits.
translation:
  language: zh_hans
  text: 圣者的心必充满喜乐，因为义人的数目已经临近[a]，义人的祷告已蒙垂听，义人的血已在万灵之主面前被追讨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “数目”也可理解为“数算”或“核算”；该词在某些理解中可带有司法性的“清算”意味。
    reason: lexical_alternative
  - marker: b
    text: 原文有“被寻求、被索取、被追究”的意思；这里指义人所流的血被追讨，含有为他们伸冤并向流血者追究责任的意味。也可按语境译作“已经得到伸冤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ልቦሙ ለቅዱሳን
  choice: 圣者的心
  rationale: 保留原文“心”的具体圣经意象，并将复数所有关系按现代汉语自然表达；“圣者”比“圣徒”较少带入后世教会称谓。
- source_word: ትመልእ ፍሥሐ
  choice: 必充满喜乐
  rationale: 准确表达被喜乐充满的将来意味，语言庄重而自然。
- source_word: ኍልቈ ለጻድቅ
  choice: 义人的数目
  rationale: ኍልቈ 的基本义是数目、计数；正文保留这一直接意义，不擅自补出“足数”或特定末世时间表。
- source_word: ቀርበ
  choice: 已经临近
  rationale: 体现完成式所表达的临近状态，同时保留启示文学中的迫近感。
- source_word: ጻድቅ / ጻድቃን
  choice: 义人
  rationale: 采用现代汉语圣经语域中稳定、清楚的对应词，并一致处理单数形式的集合意义与复数形式。
- source_word: ጸሎቶሙ ለጻድቃን ተሰምዐ
  choice: 义人的祷告已蒙垂听
  rationale: 保留原文单数集合名词“祷告”，并以“蒙垂听”自然表达被听见且得到神关注的含义。
- source_word: ደሙ ለጻድቅ
  choice: 义人的血
  rationale: 上下文指向义人群体所流的血；中文集合表达既保留单数构式，也避免无根据地限定为某一位义人。
- source_word: ተፈቅደ
  choice: 受到追讨
  rationale: 该词在此处有“被寻求、被索取、被追究”的司法意味；与流血搭配时，“受到追讨”既贴近原文，也传达为所流之血追究责任的含义，而不直接把动词缩减为结果性的“已报仇”。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 这是《以诺一书》中固定而独特的神圣称号；“万灵之主”在汉语中凝练庄重，并表明其统摄众灵的称号性质。
theological_decisions:
- issue: “义人的数目已经临近”的含义
  choice: 正文直译为义人的数目临近，容许读者理解为预定总数接近完成。
  alternative: 也可能指义人的数算、核算或审断已经临近。
  rationale: 原词首先表示数目或计数，但其司法性延伸义并非不可能；正文不补入“足数”，注释保留歧义。
- issue: 义人的血“受到追讨”的力度
  choice: 表达神已将所流之血置于追究和索偿之下，暗示伸冤将至。
  alternative: 可按语境结果译为“已经得到伸冤”或“已经报了仇”。
  rationale: 原动词更直接表示寻求、索取或追究；“追讨”保留司法行动及其未完全明说的结果，避免将经文明确化为报仇已经完成。
translation_notes:
  register: 采用现代、庄重而易懂的汉语圣经语体。句式保留原文三个并列分句的推进感；对“数目临近”和“血被追讨”两处真实歧义以脚注说明，不在正文中加入特定宗派性的末世论或赎罪论解释。
