base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/003.yaml
  text: In those days I saw the Head of Days[a], as he sat on the throne of his glory, and the books of the living were opened before him; and all his host, which is in the heights of heaven[e][d][c][b], and his council stood before him.
translation:
  language: zh_hans
  text: 那些日子，我看见“诸日之首”[a]坐在他荣耀的宝座上；活人的诸书卷[b]在他面前展开；他一切在天之高处的天军和他的朝廷[c]，都站在他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诸日之首”直译原文称号；也可理解为“万古之首”。这里没有直接改用较为人熟知的“亘古常在者”。
    reason: lexical_alternative
  - marker: b
    text: 原文为复数，较直译是“活人的诸书卷”；也有人按传统译作“生命册”或“生命诸册”。
    reason: lexical_alternative
  - marker: c
    text: 译作“朝廷”的词本有“圈子、环绕”之意，也可译作“环绕他的会众”或“他的议会”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: 那些日子
  rationale: 保留启示文学中反复出现的时间套语及“日”的意象，不泛化为“那时”。
- source_word: ለርእሰ መዋዕል
  choice: 诸日之首
  rationale: 贴近“首／头”与复数“日”的构词，避免直接套用《但以理书》传统称号而抹平本节自身措辞。
- source_word: ሶበ ነበረ መንበረ ስብሐቲሁ
  choice: 坐在他荣耀的宝座上
  rationale: ነበረ在此为主动的“坐／就座”，宝座是其所坐之处，而不是被设立的主语。
- source_word: መጻሕፍተ ሕያዋን
  choice: 活人的书卷
  rationale: 保留“书卷”的复数集合意义和“活人的”属格表达，不协调成较熟悉的单数“生命册”。
- source_word: በቅድሜሁ ተከሥቱ
  choice: 在他面前展开
  rationale: 在天上审判的书卷场景中，“展开”自然地表达书卷被打开、显露。
- source_word: ኵሉ ኃይሉ
  choice: 他的一切天军
  rationale: 该词可指力量或军队；在天上朝廷场景中，集合性的“天军”比抽象的“能力”更合语境。
- source_word: ዘመልዕልተ ሰማያት
  choice: 在天之高处
  rationale: 保留原文高远的空间意象，而不将其具体化为分层的“最高天”。
- source_word: አውደ ዚአሁ
  choice: 他的天上朝廷
  rationale: 该词本义涉及环绕、圈子；在宝座异象中，“朝廷”表达围绕君王侍立的天上群体，同时不限定为议事机构。
- source_word: ይቀውሙ በቅድሜሁ
  choice: 都站在他面前
  rationale: 保留朝廷侍立和等候的姿态，并以“都”统摄并列的天军与朝廷。
theological_decisions:
- issue: 神圣称号ርእሰ መዋዕል的译法
  choice: 诸日之首
  alternative: 亘古常在者／万古之上者
  rationale: 选择透明对应埃塞俄比亚文本构词的译名，保存其独特表达，不因与《但以理书》的关联而直接采用传统汉译称号。
- issue: መጻሕፍተ ሕያዋን与“生命册”传统用语的关系
  choice: 活人的书卷
  alternative: 生命册
  rationale: 原文是复数“书卷”加“活人的”，应保留这一形式；译作“生命册”会过早将其与其他经文中的固定单数术语等同。
- issue: አውደ ዚአሁ所指的天上群体
  choice: 他的天上朝廷
  alternative: 他的议会／环绕他的众人
  rationale: “朝廷”兼顾宝座审判场景与环绕之人的空间含义，但不进一步断定他们拥有何种议事职能。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“诸日之首”刻意保留异象称号的陌生感；其余句法适度汉语化，以分号呈现宝座、书卷和天上朝廷三个连续画面。
