base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/001.yaml
  text: And in those days[c][b][a], the prayer of the righteous and the blood of the righteous ascended from the earth before the Lord of Spirits.
translation:
  language: zh_hans
  text: 在那些日子，义人的祷告和义人之血[a]从地上升到诸灵之主面前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义人之血”也可理解为“那位义人的血”。原文在“血”之后用的是单数形式，但这里可能是代表性或集合性单数，与前面的“义人的祷告”彼此平行。
    reason: lexical_alternative
  - marker: b
    text: 原文的“升到”是完成式，且只出现一次；其形式与“祷告”相应，随后“血”作为并列成分接续。译文用同一个谓语统摄两者。
    reason: grammar
lexical_decisions:
- source_word: በውእቱ፡ መዋዕል
  choice: 在那些日子
  rationale: 保留以诺传统中反复出现的异象时间标记；现代汉语自然、庄重。
- source_word: ዐርገት
  choice: 升到
  rationale: 该动词是完成式，表示向上而去；译作“升到”既体现已发生的动作，也与“面前”自然衔接，不误译为将来时。
- source_word: ጸሎተ፡ ጻድቃን
  choice: 义人的祷告
  rationale: ጻድቃን为复数群体称谓；“义人”保留其启示文学中的伦理和神学意味，“祷告”则比“祈求”涵盖面更广。
- source_word: ደሙ፡ ጻድቅ
  choice: 义人之血
  rationale: ጻድቅ形式上为单数，但可能是代表性或集合性单数，并与前面的复数“义人”平行；汉语“义人之血”可自然保留单数与集合意义之间的张力。
- source_word: እምነ፡ ምድር
  choice: 从地上
  rationale: “地”在此具有宇宙性的天地对照意味；“从地上”符合现代汉语表达，也避免“土地”可能带来的地域性理解。
- source_word: ቅድመ
  choice: 面前
  rationale: 表达进入某位尊者临在之中的意思；在汉语中比直译为“之前”更准确自然。
- source_word: እግዚአ፡ መናፍስት
  choice: 诸灵之主
  rationale: 按原文保留“灵”的复数和这一固定神圣称号；“诸灵”不额外断定是所有的灵，较“万灵”更克制。
theological_decisions:
- issue: “血”之后的ጻድቅ应理解为单数“那义人的”，还是集合意义的“义人的”
  choice: 义人之血
  alternative: 那位义人的血／义人们的血
  rationale: 原词形式上是单数，但与前句复数的“义人”形成平行，很可能是代表性或集合性用法。中文“义人之血”不强行指定一个个体，也不把原文明确改成复数，因而保留文本的真实含混。
- issue: 单数完成式动词如何与两个并列名词短语对应
  choice: 将“祷告”和“血”作为并列主语，共用“升到”
  alternative: 义人的祷告升上去，而义人之血从地上来到诸灵之主面前
  rationale: 原文动词只出现一次，形式上与阴性单数的“祷告”相应，随后以“和”连接“血”。中文用一个谓语统摄并列主语，既保留压缩的平行结构，又避免擅自补出第二个不同的动作。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在那些日子”保留启示文学的固定语感；“诸灵之主”作为神圣称号保持凝练，不加入原文没有的冠词、解释或宗派性称谓。
