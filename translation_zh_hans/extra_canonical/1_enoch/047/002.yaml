base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/002.yaml
  text: In those days the holy ones who dwell in the heights of heaven shall unite with one voice[a], and they shall plead and pray and praise and give thanks and bless the name of the Lord of Spirits, on account of the blood of the righteous that has been poured out, and that the prayer of the righteous may not be in vain before the Lord of Spirits, that judgment may be executed for them[d][c][b], and that patience may not be theirs forever.
translation:
  language: zh_hans
  text: 在那些日子，住在天之高处的众圣者[a]必同声合一；他们必恳求、祷告、赞美、称谢，并颂赞诸灵之主的名，为着所倾流的义人之血；又祈求义人的祷告在诸灵之主面前不至落空[b]，祈求审判为他们施行[c]，并祈求他们不必永远忍耐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣者”也可译作“圣徒”。他们被描述为住在天之高处；这里可能指天使、天上的义人，或兼指两者。
    reason: lexical_alternative
  - marker: b
    text: 此处埃塞俄比亚语见证中的动词词形不确定。按上下文，意思可能是义人的祷告不致徒然、无效或得不到回应。
    reason: textual_variant
  - marker: c
    text: “审判”也可译作“公义”或“裁决”；这里既可强调司法判决，也可强调为义人伸张公义。
    reason: lexical_alternative
lexical_decisions:
- source_word: የኃብሩ
  choice: 联合起来
  rationale: 表达聚集、结合之意，并与“同声”相配，保留共同参与和一致发声的双重意味。
- source_word: ቅዱሳን
  choice: 众圣者
  rationale: 保留启示文学中“圣洁者”的宽泛称谓，不将其限定为天使或已升天的义人。
- source_word: የኃድሩ
  choice: 住在
  rationale: 自然表达持续居住，符合现代汉语，同时不削弱天上场景。
- source_word: በመልዕልተ ሰማያት
  choice: 在天之高处
  rationale: 保留原文的空间高度意象，又避免过度规定具体的多层天宇结构。
- source_word: በ፩ቃል
  choice: 同声
  rationale: 原义可作“以一个声音／一句话”；此处群体祈求的语境中，“同声”最自然。
- source_word: ያስተበቍዑ
  choice: 恳求
  rationale: 传达迫切求告，并与后面的“祷告”保持近义词叠用。
- source_word: ይጼልዩ
  choice: 祷告
  rationale: 直接对应祈祷行为，保留原文连续列举的礼仪性节奏。
- source_word: ይሴብሑ
  choice: 赞美
  rationale: 采用常见的颂赞用语。
- source_word: የአኵቱ
  choice: 感谢
  rationale: 与相邻的“赞美”区分，表达感恩或称谢。
- source_word: ይባርኩ
  choice: 颂赞
  rationale: 在以神的名为宾语时，现代汉语“颂赞……的名”比直译“祝福……的名”更自然，同时保留敬拜意味。
- source_word: እግዚአ መናፍስት
  choice: 诸灵之主
  rationale: 保留《以诺一书》比喻篇中庄严而固定的神圣称号。
- source_word: ትጸራዕ
  choice: 落空
  rationale: 该词形在此见证中不确定；结合语境，表达义人的祷告不徒然、不致无效。
- source_word: ኵነኔ
  choice: 审判
  rationale: 保留末世性司法行动的语感；“为他们施行”同时表现这是为义人伸冤。
- source_word: ትዕግሥት
  choice: 忍耐等候
  rationale: 单说“忍耐”在汉语中可能被听成永久拥有某种美德；加入“等候”显明这里指义人等待伸冤的延宕。
theological_decisions:
- issue: 天上场景中ቅዱሳን的身份
  choice: 译作“众圣者”，不进一步限定。
  alternative: 圣徒；天使
  rationale: 他们住在天之高处，但原文没有明确说明是天使、天上的义人，还是兼指两者，故保留开放性。
- issue: 义人祷告所面对的结果
  choice: 译作“不至落空”。
  alternative: 不被噤声；不止息；不被拒绝
  rationale: 词形存在困难，而上下文关乎流血义人得到伸冤；“不至落空”表达祷告不会徒然或得不到回应，同时以脚注说明不确定性。
- issue: ኵነኔ在伸冤语境中的含义
  choice: 译作“审判”。
  alternative: 公义；裁决
  rationale: “审判”保留启示文学中的法庭与末世行动意象，“为他们施行”则显明其伸冤方向。
- issue: 末句ትዕግሥት的所指
  choice: 译作“使他们不必永远忍耐等候”。
  alternative: 使忍耐不永远属于他们；使宽容不永远临到他们
  rationale: 代词最自然地回指义人，语境是他们等待神施行审判；但原文措辞简约，译文避免把等待的期限发展成更具体的教义。
- issue: 三个ከመ目的／内容分句的关系
  choice: 以“又求……使……使……”呈现平行祈求。
  alternative: 将第一项理解为原因：“因为义人的祷告……”
  rationale: 虚词ከመ配合虚拟式在这里更适合表达祈求内容或目的，而不是原因；译文保留连续的伸冤请求。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留“诸灵之主”等启示文学称号和原文连续动词的礼仪节奏；对圣者身份、困难词形及“审判／公义”的张力不作教派化限定。
