base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/007.yaml
  text: And because of this I have not appointed wives for you[b][a], for the dwelling of the spiritual ones of heaven is in heaven.
translation:
  language: zh_hans
  text: 正因如此，我没有为你们安排妻子；因为天上的属灵者[a]的居所是在天上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的灵”或“属天的属灵存在者”。吉兹语原词组可有几种彼此相近的理解。
    reason: lexical_alternative
  - marker: b
    text: 原文刻意重复“天上”：这些存在者属于天上，他们的居所也在天上。
    reason: cultural_note
lexical_decisions:
- source_word: ወበእንተዝ
  choice: 正因如此
  rationale: 保留短语承接上文并引出原因的作用；“正因如此”比单纯的“关于此事”更能体现因果语气。
- source_word: ኢረሰይኩ
  choice: 我没有……安排
  rationale: 此处动词有设立、指定或分配之意；“安排”适合未给这些存在者配给婚姻伴侣的语境，也避免误解为物质性的“创造”。
- source_word: ለክሙ
  choice: 为你们
  rationale: 体现与格所表达的受益者或接受者关系，并与汉语“为……安排”自然搭配。
- source_word: አንስቲያ
  choice: 妻子
  rationale: 上下文涉及婚姻或配偶的安排，“妻子”比宽泛的“女人”更准确；但“女人”在词汇层面仍是可能译法。
- source_word: እስመ
  choice: 因为
  rationale: 明确引入后一分句作为前述陈述的理由。
- source_word: መንፈሳውያነ
  choice: 属灵者
  rationale: 保留原文形容词名词化的表达，指以属灵性质为特征的存在者，而不直接限定为“灵”或某一后期天使论类别。
- source_word: ሰማይ
  choice: 天上的
  rationale: 表达所属或领域关系，同时与后面的“在天上”形成原文刻意的重复。
- source_word: ውስተ፡ ሰማይ
  choice: 在天上
  rationale: 直接呈现处所含义，并保留全节两次出现“天上”的语言效果。
- source_word: መሓድሪሆሙ
  choice: 他们的居所
  rationale: “居所”准确表达居住之处，语体庄重而不古奥；补出“他们的”使汉语指代清楚。
theological_decisions:
- issue: 如何理解并翻译 መንፈሳውያነ ሰማይ
  choice: 天上的属灵者
  alternative: 天上的灵；属天的属灵存在者
  rationale: 原文似为形容词名词化结构，而非单纯使用“灵”这一名词。“属灵者”保留其类别与性质上的开放性，不把它预先等同于某种后期天使论术语。
- issue: 将 አንስቲያ 译为“妻子”还是“女人”
  choice: 妻子
  alternative: 女人
  rationale: 本节所说的是没有给这些存在者安排婚姻伴侣；“妻子”更能体现配偶关系，但不否认该词本身也可泛指女人。
- issue: 是否保留“天上……天上”的重复
  choice: 保留为“天上的……在天上”
  alternative: 简化为“属天者以天为居所”
  rationale: 重复强调这些存在者所属的领域及其正当居所；删减虽较简练，却会削弱原文的修辞和神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“正因如此”承接上下文；分号区分结论与理由。“属灵者”略带经卷语体，但仍属现代宗教汉语的常用表达，并能保存原文的含混性。
