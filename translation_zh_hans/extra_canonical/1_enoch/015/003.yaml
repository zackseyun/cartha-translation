base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/003.yaml
  text: Why did you abandon the high[a], holy, eternal heaven, and lie with women, and defile yourselves with the daughters of men, and take wives for yourselves, and do as the children of the earth do[b], and beget giant sons?
translation:
  language: zh_hans
  text: 你们为什么离弃那至高、圣洁、永恒的天，去与女人同寝，又与人的女儿交合，玷污自己，为自己娶妻，像地上的子民那样行事[a]，并生下巨人般的儿子[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地上的子民”与来自天上的守望者形成对照，指属地的凡人；不宜仅淡化为一般的“人”。
    reason: cultural_note
  - marker: b
    text: 原文末语指这次结合所生的异常后代；也可译作“巨人儿子”或“成为巨人的儿子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃደግሙ
  choice: 离弃
  rationale: 保留该动词强烈的责斥意味，比中性的“离开”更能表达抛下原属领域之意。
- source_word: ሰማየ ልዑለ ወቅዱሰ ዘለዓለም
  choice: 那至高、圣洁、永恒的天
  rationale: 按原文连续修饰“天”的结构译出三重属性，同时使现代汉语自然庄重。
- source_word: ሰከብክሙ
  choice: 与女人同寝
  rationale: 直接表达性结合而不流于粗俗，符合责斥语境和庄重文体。
- source_word: እዋለደ ሰብእ
  choice: 人的女儿
  rationale: 保留天上守望者与人类女子之间的对照，不加入后世教义术语。
- source_word: ረኩስክሙ
  choice: 玷污自己
  rationale: 明确保留原文兼有道德与洁净观念的负面判断，不弱化为中性的结合。
- source_word: አንስተ
  choice: 妻
  rationale: 与“为自己娶”构成自然的婚娶表达，比泛称“女人”更切合句法。
- source_word: ከመ ውሉደ ምድር ገበርክሙ
  choice: 像地上的子民那样行
  rationale: 保留天上存在与地上人类之间的对照；“子民”在此泛指属地的人，不限定性别。
- source_word: ውሉደ ረዓይተ
  choice: 巨人般的儿子
  rationale: 保留异常后代为男性子嗣且具有巨人性质的具体意象，同时以“般”反映该短语可理解为“巨人儿子”或“成为巨人的儿子”的语义张力。
theological_decisions:
- issue: 守望者与女人结合的道德性质
  choice: 译为“玷污自己”
  alternative: 较中性地译为“与女人结合”或只强调跨越界限
  rationale: 原文明确使用表示污秽、玷污的动词，因此应保留经文本身的道德和洁净判断。
- issue: “地上的子民”所表达的身份对照
  choice: 保留天上存在与地上人类的对照
  alternative: 简化为“像人一样”
  rationale: 简化会削弱本节关于所属领域的末世文学意象；译文应保留这一对照而不进一步界定其本体论。
- issue: 异常后代的性质
  choice: 正文译作“巨人般的儿子”
  alternative: “巨人儿子”或“成为巨人的儿子”
  rationale: 原短语指向异常而巨大的后代，但具体修饰关系存在一定张力；正文采用自然而不过度断定的表达，并在脚注列出替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以连续形容词保留末世文学的崇高语调，以一连串动词保持责问的推进感；避免古奥文言和宗派化术语。
