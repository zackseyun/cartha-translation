revisions:
- from: 你们为什么离弃那至高、圣洁、永恒的天，去与女人同寝，又因人的女儿玷污自己，为自己娶妻，像地上的子民那样行[a]，并生下巨人般的儿子[b]呢？
  to: 你们为什么离弃那至高、圣洁、永恒的天，去与女人同寝，又与人的女儿交合，玷污自己，为自己娶妻，像地上的子民那样行事[a]，并生下巨人般的儿子[b]呢？
