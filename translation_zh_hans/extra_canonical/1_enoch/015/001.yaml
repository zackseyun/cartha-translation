base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/001.yaml
  text: 'And he answered me and said to me[a], and I heard: “Do not fear, Enoch, righteous man and scribe of righteousness. Come near here and hear my word.”'
translation:
  language: zh_hans
  text: 他回答我，对我说；我听见了[a]：“不要害怕，以诺，你这义人、公义的文士。到这里来，听我的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文在这里似乎重复了“听”这个动词，可直译为“我听见，我听见”。正文为使汉语顺畅而将重复压缩。
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ፡ ወይቤለኒ
  choice: 他回答我，对我说
  rationale: 保留原文“回答”与“说”的双重叙事公式，既体现对话关系，也不抹平闪语式重复。
- source_word: ወሰምኩ፡ ሰማዕኩ
  choice: 我听见了
  rationale: 抄本文本似乎重复“听”这一动词；正文以自然汉语压缩表达，并用脚注说明原文现象，不补入原文没有的“声音”。
- source_word: አትፍራህ
  choice: 不要害怕
  rationale: 采用现代汉语中庄重而自然的直接禁令。
- source_word: ብእሲ፡ ጻድቅ
  choice: 你这义人
  rationale: “义人”准确表达其道德身份；加入指称性的“你这”使呼语在现代汉语中自然清楚。
- source_word: ጻሓፊ፡ ጽድቅ
  choice: 公义的书记
  rationale: “书记”保留书写、记录启示的正式职分，“公义的”维持属格关系，又避免把它弱化为一般的“作者”。
- source_word: ቅረብ፡ ዝየ
  choice: 到这里来
  rationale: 同时表达趋近的命令和地点指示，符合自然现代汉语。
- source_word: ወስማዕ፡ ቃልየ
  choice: 听我的话
  rationale: 保留“话”的单数整体概念，并符合启示性言说的汉语表达。
theological_decisions:
- issue: 以诺的道德与书写身份如何并列表达
  choice: 你这义人、公义的书记
  alternative: 正直的人、正义的书写者
  rationale: 译文同时保留以诺的道德资格和记录启示的职分，不将其中任何一项淡化，也不引入特定宗派解释。
