base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/005.yaml
  text: Therefore I gave them women[a], so that they might beget children by them and offspring might be born to them[b], so that thus no work on the earth might be lacking to them.
translation:
  language: zh_hans
  text: 因此，我赐给他们妇人[a]，使他们可以在她们身上撒种，使儿女由她们生下；如此，他们在地上就不致缺少该做的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在她们身上撒种”是直译；吉兹文保留了以撒种比喻生育的说法。
    reason: lexical_alternative
  - marker: b
    text: 末句原文艰涩。“该做的事”译自可指工作、事务或行为的词；也可理解为借着生育，地上的生命和活动得以按所定的方式延续。
    reason: textual_variant
lexical_decisions:
- source_word: በእንተዝ
  choice: 因此
  rationale: 承接上文灵体与地上受造物的对比，引出神如此安排的原因。
- source_word: ወሀብክዎሙ አንስቲያ
  choice: 我赐给他们女人
  rationale: 保留第一人称神谕语气；አንስቲያ 泛指女人，译作“妻子”会加入原词未明说的婚姻身份。
- source_word: ከመ ይዝርኡ ላዕሌሆን
  choice: 使他们可以在她们身上播种
  rationale: 保留吉兹文以播种表达生育的隐喻，并较贴近介词“在……之上”的字面形式；脚注说明其生育含义。
- source_word: ወይትወለዱ ውሉደ በላዕሌሆን
  choice: 并由她们生出儿女来
  rationale: “儿女”自然表达后裔而不限定性别；“由她们”保留女性作为生育媒介或来源的关系。
- source_word: ከመ ከማሁ
  choice: 这样
  rationale: 以自然现代汉语表达方式或结果关系，避免生硬重复“使得如此”。
- source_word: ኢይትኀጐ ግብር በላዕሌሆን በዲበ ምድር
  choice: 他们在地上的作为就不至缺少
  rationale: ግብር 可指行为、工作或事务；“作为”保留其宽泛意义。末句语义和代词关系较难确定，因此不把它明确解释成生命延续，并以脚注提示。
theological_decisions:
- issue: 赐下女人的目的
  choice: 经文把生育呈现为地上受造物所受的安排
  alternative: 将本句仅限于婚姻制度，或视为守望者堕落之后的惩罚性让步
  rationale: 本节直接提到播种与生子，并与上下文中守望者越过受造界限形成对照；译文不额外限定婚姻制度，也不加入惩罚性解释。
- issue: 末句“作为不至缺少”的含义
  choice: 保留“作为”的宽泛和含混表达
  alternative: 明确解释为地上生命及活动借生育延续
  rationale: 该解释符合语境，但原句本身艰涩；正文不应把一种推断写成唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赐给”“不至缺少”保持经文语体；正文保留播种隐喻和末句的歧义，脚注提供必要说明。
