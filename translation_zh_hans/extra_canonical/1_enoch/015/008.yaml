base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/008.yaml
  text: And now[a], the giants who were born from spirits and flesh will be called evil spirits upon the earth[b], and on the earth will be their dwelling.
translation:
  language: zh_hans
  text: 如今，那些由灵与肉身所生的巨人[a]，在地上要称为邪灵；地上[b]将是他们的居所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里依上下文译作“巨人”，指守望者与人类女子所生的后裔；就词义而言，也可较宽泛地译作“后裔”。
    reason: lexical_alternative
  - marker: b
    text: 原文两次提到“地”，这里保留这一重复，以强调这些邪灵属于地上的领域，而非天上的领域。
    reason: cultural_note
lexical_decisions:
- source_word: ረዓይት
  choice: 巨人
  rationale: 依本章语境，此词指守望者与人类女子所生的混合后裔；译作“巨人”既明确所指，也保留启示文学中的骇人色彩。词义层面也可能较泛地理解为“后裔”。
- source_word: ተወልዱ
  choice: 所生
  rationale: 忠实表达被动的出生或生育关系，同时符合现代汉语表达。
- source_word: እመናፍስት ወሥጋ
  choice: 由灵与肉身所生
  rationale: 保留原文对“灵”与“肉身”的直接并列，凸显这些巨人的双重来源，不额外解释“灵”的身份。
- source_word: መንፈሳት እኩያን
  choice: 邪灵
  rationale: “邪”直接表达原文“恶、邪恶”的含义；不译作“污灵”，以免引入原文并未要求的后期术语。
- source_word: ይሰመዩ
  choice: 要称为
  rationale: 保留被动命名公式及其分类意味。
- source_word: በዲበ ምድር
  choice: 在地上
  rationale: 表达其活动或归属的领域，语言自然而庄重。
- source_word: ወውስተ ምድር ይከውን መሓድሪሆሙ
  choice: 地上将是他们的居所
  rationale: 保留原文第二次出现的“地”，不将重复合并；“居所”准确传达栖居之处。
theological_decisions:
- issue: 这些后来被称为邪灵者的身份
  choice: 按上下文译为守望者与人类女子所生的“巨人”
  alternative: 较宽泛地译作“后裔”
  rationale: 15章紧接着说明这些混合后裔及其灵在地上的存在。译作“巨人”使上下文所指清楚，但脚注保留词义较宽泛的可能，且不进一步套入后来的鬼魔论体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“灵与肉身”的鲜明对举以及“地上”的重复；用分号呈现命名与居所两个紧密相连的分句。
