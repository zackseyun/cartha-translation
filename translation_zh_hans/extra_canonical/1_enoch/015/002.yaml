base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/002.yaml
  text: 'And go[a], say to the watchers of heaven who have sent you to petition on their behalf: ''You ought to petition on behalf of men[b], and not men on your behalf.'''
translation:
  language: zh_hans
  text: 你去告诉那些差你来替他们祈求的天上守望者：“本来应当是你们为人类祈求，而不是人类为你们祈求。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሑር
  choice: 你去
  rationale: 这是对以诺发出的行动命令；“你去”在现代汉语中自然明确。
- source_word: በሎሙ
  choice: 告诉
  rationale: 表达向复数对象传话，比直译为“对他们说”更符合现代汉语，同时保留直接引语的功能。
- source_word: ለትጉሃነ ሰማይ
  choice: 天上守望者
  rationale: “守望者”保留《守望者之书》中这一类天上存在的专称，不将其泛化为“天使”。
- source_word: እለ ፈነዉከ
  choice: 那些差你来的
  rationale: 关系从句指明这些守望者曾差遣以诺；“差你来”也交代了他当前所承担的使命。
- source_word: ትስአል በእንቲአሆሙ
  choice: 替他们祈求
  rationale: 原动词基本义为请求；在向上天正式求情的语境中，“祈求”自然贴切，又不像“代祷”那样引入较强的后期宗教术语。
- source_word: አንትሙ መፍትው ትስአሉ
  choice: 本来应当是你们……祈求
  rationale: “本来应当”传达合宜性与义务，并凸显守望者颠倒应有次序所受到的责备。
- source_word: በእንተ ሰብእ
  choice: 为人类
  rationale: ሰብእ在这里集合性地指全体人类；“人类”避免被误解为只指男性。
- source_word: ወአኮ ሰብእ በእንቲአክሙ
  choice: 而不是人类为你们祈求
  rationale: 重复“人类”和“祈求”，清楚保留原文中天上守望者与人类角色倒置的鲜明对比。
theological_decisions:
- issue: 天上存在的称号
  choice: 天上守望者
  alternative: 天使；天上的警醒者
  rationale: “守望者”是本叙事具有纲领意义的专称；译作“天使”会抹平原文的文学与神学类别。
- issue: 有关替人祈求之责备的力度
  choice: 本来应当是你们为人类祈求，而不是人类为你们祈求
  alternative: 你们应该替人请求，不该让人替你们请求；你们理当为人代求，而非由人为你们代求
  rationale: 此译保留原文对于合宜次序遭到颠倒的责备，但不据此建立超出本节的天使论或代祷体系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“天上守望者”保留启示文学专称；用“祈求”呈现正式求情的语境，用“人类”准确表达集合意义。句式通过“本来应当是……而不是……”强化原文的角色倒置，同时避免过度解释。
