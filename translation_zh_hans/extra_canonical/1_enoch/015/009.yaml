base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/009.yaml
  text: And evil spirits came out from their flesh[a], because they were created from above; and from the holy Watchers was their beginning and first foundation[d][c][b]. They shall be evil spirits.
translation:
  language: zh_hans
  text: 邪恶的灵魂从他们的肉身中出来[a]，因为他们是从上界受造的；他们的起源和最初的根基都出于圣洁的守望者[b]。他们就是邪灵[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邪恶的灵魂”也可译作“邪恶的灵”；原文说他们从“肉身”出来，保留了鲜明的身体意象。
    reason: lexical_alternative
  - marker: b
    text: “圣洁的守望者”也可较直译为“圣者，就是守望者”；在本书语境中，这是对天上守望者的称呼。
    reason: lexical_alternative
  - marker: c
    text: 末句也可按将来或定名的意味译作：“他们将成为邪灵”或“他们被称为邪灵。”
    reason: alternative_reading
lexical_decisions:
- source_word: ነፍሳት፡ እኩያን
  choice: 邪恶的灵魂
  rationale: 该短语是绝对态名词加形容词，意为“邪恶的灵魂／灵”，并非“恶人的灵魂”。译作“邪恶的灵魂”既反映语法，也与末尾的“邪灵”（መንፈሰ እኩየ）保留用词差异。
- source_word: ወጽኡ፡ እምሥጋሆሙ
  choice: 从他们的肉身中出来
  rationale: 直译其离开肉身的具体意象；“肉身”比笼统的“身体”更贴近ሥጋ。
- source_word: እመልዕልት
  choice: 从上界
  rationale: 表达来自上方、天上领域的宇宙观意涵，但不进一步断定其完整的天使身份。
- source_word: ተፈጥሩ
  choice: 受造
  rationale: 保留被动语态及受造物身份，语言庄重而符合宗教文本语域。
- source_word: እምቅዱሳን፡ ትጉሃን
  choice: 出于神圣的守望者
  rationale: 结合《以诺一书》的上下文，将ትጉሃን作为“守望者”的专称；同时以脚注保留同位式理解。
- source_word: ቀዳሚቶሙ፡ ወቀዳሚ፡ መሰረት
  choice: 他们的起始和最初根基
  rationale: 保留原文关于起源与根基的重复和凝重表达，不将两者合并简化。
- source_word: መንፈሰ፡ እኩየ
  choice: 邪灵
  rationale: 作为结尾的定名或断言，采用自然且符合上下文的“邪灵”；传本文字的数可能呈单数或集合形式，汉语“邪灵”本身不强制标示单复数。
theological_decisions:
- issue: 死后离开肉身者的身份
  choice: 指守望者与女子所生后代离开肉身后的灵魂，最终被称为邪灵
  alternative: 泛指恶人的灵魂
  rationale: 本节的上界来源及神圣守望者根基都指向紧邻上下文中的混合后代，而非一般人类罪人；同时不把开头误译成所有格“恶人的灵魂”。
- issue: “从上界”的含义
  choice: 表示其起源中具有上界成分
  alternative: 表示他们具有完整的天使身份或得到道德上的认可
  rationale: 译文保留其宇宙论来源，却不把来源等同于身份或道德评价。
- issue: 末句的语法功能
  choice: 按定名式断言译为“他们就是邪灵”
  alternative: 译作将来式“他们将成为邪灵”
  rationale: 传本文字本身简略，未明确标出汉语所需的时态；采用无时态断言可保留其作为名称或身份判定的张力，脚注说明另一种读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“肉身”“受造”“守望者”等词保留启示文学的语域；分号划分起源说明，末句独立成句，以呈现原文结尾的定名力度。
