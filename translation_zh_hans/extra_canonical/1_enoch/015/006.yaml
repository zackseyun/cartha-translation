  naturalness: 修订后采用庄重而自然的现代书面普通话。“过着永恒而不死的生命”既明确“生命”是受修饰的中心词，也保留原文以“活着”与“生命”并置所强调的生命状态。
  terminology: “属灵的存在”可保留原文较宽泛的类别描述，不把它定死为技术性的“灵”。“永恒而不死的生命”保留“生命”及直接的“不死”表达，避免仅概括为“不朽”。
