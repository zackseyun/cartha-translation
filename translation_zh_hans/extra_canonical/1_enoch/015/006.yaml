  to: 但你们从前是属灵的存在[a]，过着永恒而不死的生命，历经世上一切世代[b]。
  rationale: 将“起初”改为“从前”，以保留原文对受话者先前状态的时间对比；以“过着永恒而不死的生命”重建原文“活着……生命”的关系，并以“历经世上一切世代”自然表达其跨越一切世代的持续性。脚注保留“属灵的存在”的替代译法，以及末语中“世界／时代”的语义张力。
