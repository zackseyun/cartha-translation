base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/006.yaml
  text: But you, formerly, were spiritual beings, living an eternal life that does not die throughout all the generations of the world.
translation:
  language: zh_hans
  text: 但你们从前是属灵的存在[a]，过着永恒而不死的生命，历经世上一切世代[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灵”或“属灵者”。
    reason: lexical_alternative
  - marker: b
    text: “世上”所译原词也可指“时代”；整句末语也可理解为“贯穿一切世代，直到永远”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ቀዳሚ
  choice: 起初
  rationale: 表达先前、原初的状态，并与上下文中后来败坏的处境形成时间对比；不把它限定为更具体的宇宙论时点。
- source_word: ኮንክሙ
  choice: 是
  rationale: 按系词理解，描述这些受话者原有的状态，而非强调他们后来“变成”了什么。
- source_word: መንፈሳውያነ
  choice: 属灵的存在
  rationale: 保留形容性和存在类别的双重意味，比单译“灵”更能呈现原文的表述，同时避免引入过度精密的后期术语。
- source_word: ሕያዋነ ሕይወት ዘለዓለም
  choice: 活着……永恒生命
  rationale: 尽量保留“活着生命”这一同源宾语结构及明确的“生命”名词；中文为可读性将修饰语“永恒”置于“生命”前。
- source_word: ዘኢይመውት
  choice: 不死的
  rationale: 保留原文直接的死亡用语，使该关系从句继续强化“永恒生命”，而不抽象化为“不会消逝”。
- source_word: ለኵሉ ትውልደ ዓለም
  choice: 直到世世代代
  rationale: 自然表达贯穿一切世代的持续性；“世世代代”也容纳ዓለም可指世界或时代的语义张力。
theological_decisions:
- issue: 守望者原初状态应译为“灵”还是较宽泛的描述
  choice: 属灵的存在
  alternative: 灵；属灵者
  rationale: 原文强调他们在娶妻生子以前的存在状态。“属灵的存在”保存本体层面的对比，同时不以较晚的技术性分类替原文消除张力。
- issue: 永恒生命与“不死”的关系
  choice: 将“不死的”理解为修饰“永恒生命”
  alternative: 理解为这些属灵存在本身不死
  rationale: 原文关系形式紧接“永恒生命”，宜保留这一语法连接；中文措辞不进一步界定这种不死性的形上性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“属灵的存在”用于保存原文类别描述；“活着不死的永恒生命”刻意保留原文同源结构的痕迹，虽略带庄重的异质感，却仍可理解。所有脚注标记均置于正文对应位置。
