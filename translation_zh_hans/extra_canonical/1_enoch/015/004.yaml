base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/004.yaml
  text: But you were holy[a], spiritual beings, living eternal life. But you defiled yourselves with women, and by the blood of flesh you fathered children, and you desired the blood of men, and you did as they do[c][b], producing flesh and blood—those who die and perish.
translation:
  language: zh_hans
  text: 但你们本是圣洁的，是属灵的，享有永恒的生命；你们却因女人玷污了自己[a]，借着肉身的血生儿育女[b]，又贪恋人的血，并且像世人一样生出血肉之躯，就是那些会死亡、归于灭亡的。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处吉兹语传本的介词短语有讹误。有些校读作“以女人的血玷污了自己”；正文采用“因女人玷污了自己”。两种读法都强调这些属灵者因与女人结合而陷入污秽。
    reason: textual_variant
  - marker: b
    text: “儿女”是根据“生、生育”一词补出的宾语；原文着重说他们借着与肉身相连的“血”进入有形有血的生育。
    reason: implicit_object
  - marker: c
    text: “像世人一样生出血肉之躯”也可较形式地译为：“像他们所做的那样行，造出肉和血。”末句还可译作“那些死亡并被毁灭的”；原词明确表达凡人的死亡与败亡。
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: ቅዱሳን፡ መንፈሳውያን
  choice: 圣洁的，是属灵的
  rationale: 保留两个并列述语，既指出守望者原有的圣洁，也突出其非血肉的存在形态；不额外加入原文没有的类别名称。
- source_word: ሕያዋነ፡ ሕይወት፡ ዘለዓለም
  choice: 享有永恒的生命
  rationale: 原文以“活着／生命”的同根表达强调永恒生命；中文采用庄重而自然的说法，避免生硬重复。
- source_word: †በደቡ፡† አንስት፡ ረኩስክሙ
  choice: 因女人玷污了自己
  rationale: 传本首词有讹误标记；正文采用无需校改即可表达上下文基本意义的译法，并在脚注交代校读为“女人的血”的可能。
- source_word: በደመ፡ ሥጋ፡ አውለድክሙ
  choice: 借着血肉之血生了儿女
  rationale: 保留原文刻意突出的“血”与“肉”意象；“儿女”是由“生育”自然蕴含的宾语，脚注明确其为补足。
- source_word: በደመ፡ ሰብእ፡ ፈተውክሙ
  choice: 贪恋人的血
  rationale: 明确保留“人”和“血”；“贪恋”传达强烈而越界的欲求，同时不把对象改成原文此处未明说的“血肉”。
- source_word: ወገበርክሙ፡ ከመ፡ እሙንቱ፡ ይገብሩ፡ ሥጋ፡ ወደመ
  choice: 并且像世人一样生出血肉之躯
  rationale: 原文重复“作／造”并紧接“肉和血”；结合前面的生育语境译作“生出”，使中文连贯，同时保留这是对凡人行为方式的仿效。
- source_word: እለ፡ እሙንቱ፡ ይመውቱ፡ ወይትሐጐሉ
  choice: 他们终必死亡、归于灭亡
  rationale: 保留死亡与灭亡两个并列概念及其庄严的审判色彩；“他们”承接前句的世人及所生的血肉生命。
theological_decisions:
- issue: 如何呈现属灵存在者越入凡人血肉生育方式的对比
  choice: 保留“属灵”“永恒的生命”与“血、肉、死亡、灭亡”的强烈对照
  alternative: 直接概括为“不死者变得像必死的人”
  rationale: 原文的神学张力借反复出现的血肉意象表达；概括成“不死／必死”虽顺畅，却会削弱文本自身的修辞和受造界限被跨越的主题。
- issue: “像他们一样作”所指为何
  choice: 按生育语境理解为“像世人一样生出血肉之躯”
  alternative: 较形式地译为“像他们所做的那样行，造出肉和血”
  rationale: 动词本身宽泛，后接“肉和血”；正文给出符合上下文的自然中文，脚注保留较形式的句法可能，不将其发展为特定教派教义。
- issue: 末句的指代范围
  choice: 使“他们”自然指向凡人及血肉生命，不进一步限定
  alternative: 明确限定为“所生的儿女”或“全体人类”
  rationale: 原文关系结构的指向并非完全无歧义，因此中文不把它收窄为单一对象。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文保留“血”“肉”“死亡”“灭亡”的重复和对照，不以抽象神学术语取代原文意象；对传本讹误、补足宾语和末句句法均以脚注透明说明。
