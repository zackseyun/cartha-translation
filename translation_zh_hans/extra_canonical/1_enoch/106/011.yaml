  yaml_path: translation/extra_canonical/1_enoch/106/011.yaml
  text: And he rose up in the hands of the midwife[a], and he opened his mouth and blessed the Lord of heaven.
translation:
  language: zh_hans
  text: 他在接生的妇人[a]手中站了起来，张开了嘴，称颂天上的主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“接生的妇人”的词，字面上与“生产、生育的妇人”有关，也可理解为“产妇”；但在这个出生场景中，她正用手接住孩子，因此更可能指协助生产、接抱婴儿的妇人。
    reason: 保留原词所容许的词义歧义，并说明上下文为何倾向“接生的妇人”。
lexical_decisions:
- source_word: ተንሥአ
  choice: 站了起来
  rationale: 该动词表示起身或站起。这里的主语是刚出生的挪亚，“站了起来”保留了这一动作鲜明而惊人的意味，也不额外解释其性质。
- source_word: ውስተ እዴሃ
  choice: 在……的手中
  rationale: 原文由表示“在、里面”的介词与“她的双手”构成；汉语用“在……的手中”既贴近原文，也自然交代婴儿当时所在的位置。
- source_word: መውላዲት
  choice: 接生妇
  rationale: 该词在词形上与生产、生育有关，本身可有不同理解；但在这一分娩场景中，结合“她的手”，最自然是指接住并照料新生儿的妇人。脚注保留其字面歧义。
- source_word: ፈትሐ አፉሁ
  choice: 张开口
  rationale: 原文明确写“张开他的口”。保留这一表达，比简化为“说话”更能呈现新生儿立即开口的奇异场景。
- source_word: ባረኮ
  choice: 称颂
  rationale: 该动词基本义为“祝福、称颂”。当对象是神时，现代汉语以“称颂”较为自然，既表达尊崇赞美，又避免“祝福主”可能造成的误解。
- source_word: እግዚአ ሰማይ
  choice: 天上的主
  rationale: 该短语是属格结构，意为“天之主”。“天上的主”在现代汉语中庄重自然，并保留神圣主权称号。
theological_decisions:
- issue: 神圣称号的译法
  choice: 天上的主
  alternative: 天之主；诸天的主
  rationale: 将称号按意义翻译为“主”，不作音译。原文“天”在形式上为单数，因此不扩展为“诸天”；“天上的主”比“天之主”更符合普通现代汉语，同时不改变其神学含义。
- issue: 向神使用 ባረኮ 的表达
  choice: 称颂
  alternative: 祝福；赞美
  rationale: “祝福”更贴近该词的一般对应词，但汉语中“祝福主”容易被理解为人向神赐福；“称颂”能自然表达对神发出的祝颂，又不把意义缩窄为一般性的“赞美”。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“站了起来—张开口—称颂”保留原文连续动作的简洁和奇异感；不加入“立即”“神奇地”等解释性词语。
