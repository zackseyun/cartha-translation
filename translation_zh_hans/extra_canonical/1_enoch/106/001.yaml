base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/001.yaml
  text: And after some days my son Methuselah took a wife for his son Lamech[a], and she conceived by him and bore a son.
translation:
  language: zh_hans
  text: 过了一些日子，我儿玛土撒拉为他的儿子拉麦娶了一位妻子[a]；她怀了拉麦的孩子，生下一个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “过了一些日子”也可较宽泛地理解为“过了一段时间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ መዋዕል
  choice: 过了一些日子
  rationale: 保留原文按“日子”表达时间推移的习语，同时符合现代汉语叙事习惯；此语也可较宽泛地指“过了一段时间”，故以脚注说明。
- source_word: ነሥአ
  choice: 娶了
  rationale: 该动词基本义可指拿取、领受；在为儿子安排婚配的语境中，译作“为……娶了”自然且能保留玛土撒拉作为主语。
- source_word: ብእሲተ
  choice: 一个妻子
  rationale: 该词也可泛指女人，但在“为他的儿子……娶”的结构中，婚姻义明确，译作“妻子”最合语境。
- source_word: ወፀንሰት
  choice: 她……怀了孕
  rationale: 准确传达受孕之意，并采用普通现代读者易懂的表达。
- source_word: እምኔሁ
  choice: 从拉麦
  rationale: 原文代词意为“从他”；汉语若仅译“从他怀孕”略显生硬且指代可能不清，因此复现“拉麦”以明确父亲身份，同时不增加原文之外的信息。
- source_word: ወወለደት ወልደ
  choice: 生下一个儿子
  rationale: 紧凑、自然地对应原文“生了一个儿子”，适合庄重的叙事语体。
theological_decisions:
- issue: 开篇婚配安排中的施事者
  choice: 玛土撒拉为他的儿子拉麦娶了一个妻子
  alternative: 玛土撒拉的儿子拉麦娶了一个妻子；玛土撒拉为拉麦领受了一个女人
  rationale: 吉兹语句法最自然地以玛土撒拉为动词主语，并以“他的儿子拉麦”为受益对象。此译法保留家族长辈安排婚配的叙事含义，不借后来的传统消解句法关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“我儿玛土撒拉”保留第一人称家谱叙述；分号呈现受孕与生产相连而又推进的事件。主文中的[a]与脚注对应。
