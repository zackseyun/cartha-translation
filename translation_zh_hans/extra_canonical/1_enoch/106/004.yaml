base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/004.yaml
  text: And Lamech his father was afraid of him[b][a], and he fled and came to his father Methuselah.
translation:
  language: zh_hans
  text: 他的父亲拉麦害怕他[a][b]，便逃走，来到自己的父亲玛土撒拉那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“他”按前文最自然地指刚出生的孩子。
    reason: cross_reference
  - marker: b
    text: 直译：“拉麦——他的父亲——害怕他。”
    reason: source_structure
lexical_decisions:
- source_word: ፈረሀ
  choice: 害怕
  rationale: 该动词直接表达惧怕；“害怕”自然、准确，不额外加入恐惧程度或起始体意义。
- source_word: እምኔሁ
  choice: 害怕他
  rationale: 该介词形式标明惧怕所针对或由之而起的对象；现代汉语以“害怕他”最为自然，同时保留代词的简略性。
- source_word: ጐየ
  choice: 逃走
  rationale: 该动词表示迅速离开，且上下文表明行动由恐惧引发；“逃走”比中性的“走了”更准确。
- source_word: መጽአ ኀበ
  choice: 来到……那里
  rationale: 动作动词与介词连用，表示到达某人所在之处；此译法符合现代汉语叙事习惯。
- source_word: አቡሁ
  choice: 他的父亲／自己的父亲
  rationale: 两处均为第三人称单数阳性领属形式。首处与“拉麦”同位，译作“他的父亲拉麦”；末处依汉语回指习惯译作“自己的父亲”，所指为拉麦的父亲。
- source_word: ማቱሳላ
  choice: 玛土撒拉
  rationale: 采用现代中文圣经语境中通行的人名译法，准确对应玛土撒拉。
theological_decisions:
- issue: 拉麦所惧怕的“他”指谁
  choice: 正文保留代词“他”，脚注说明按紧接的上下文最自然地指新生的孩子。
  alternative: 在正文中明确译成“这个孩子”。
  rationale: 原文仅使用代词；上下文虽强烈指向新生儿，正文仍不应把语境判断写成原文明说的名词。
- issue: “他的父亲”与“拉麦”的关系
  choice: 译作“他的父亲拉麦”，保留同位关系及叙事强调。
  alternative: 仅译“拉麦”。
  rationale: 原文在“拉麦”后明确有“他的父亲”，不可省略；这突出连孩子的亲生父亲也因他害怕。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他的父亲拉麦”保留原文同位语的强调；“便”连接恐惧与逃离，但不添加超出叙事次序的因果说明。
