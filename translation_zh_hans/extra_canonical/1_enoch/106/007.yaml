base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/007.yaml
  text: And now[a], my father, I am here asking you and petitioning you, that you should go to Henok our father and hear from him the truth[b], for his dwelling is with the angels.
translation:
  language: zh_hans
  text: 现在，父亲，我在这里恳求你，又向你请求：请你到我们的父亲赫诺克[a][b]那里去，从他那里听取真相，因为他的居所与众天使同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赫诺克”音译自吉兹语 Hēnok，即通常译作“以诺”的名字。
    reason: 说明音译形式与读者熟悉的传统译名之间的对应关系。
  - marker: b
    text: “我们的父亲”在这里也可理解为“我们的祖先”。
    reason: 保留原文亲属兼尊称用语的语义范围，避免在正文中单一化处理。
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 作为承接上文的时间性话语标记；现代汉语中“现在”自然地保留了转折和推进作用。
- source_word: ሀለውኩ
  choice: 我在这里
  rationale: 保留原文表示当下在场或存在的独立成分，不将其视为可省略的赘语。
- source_word: አስተበቍዐከ ወእስእል
  choice: 我在这里恳求你，又向你请求
  rationale: 原文并列两个求告动词以加强语气；译文保留重复所形成的恳切感，同时采用现代汉语表达。
- source_word: ከመ ትሖር ኀበ
  choice: 请你到……那里去
  rationale: 该从句说明请求的具体内容；“到……那里去”准确表达前往某人所在之处。
- source_word: ሄኖክ
  choice: 赫诺克
  rationale: 依据吉兹语 Hēnok 音译，而不直接以汉语传统译名“以诺”替代；脚注交代通行名称。
- source_word: አቡነ
  choice: 我们的父亲
  rationale: 直译亲属兼尊称用语，避免在正文中径自解释为“祖先”；脚注提示语境中的可能含义。
- source_word: ትስማዕ እምኀቤሁ አማነ
  choice: 从他那里听到真相
  rationale: 保留原文具体的听闻动词、信息来源以及“真相／实情”的重点。
- source_word: ውእቱ ምስለ መላእክት ምኅዳሩ
  choice: 他的居所与众天使同在
  rationale: 保留原文以名词“居所”构成的表达和启示文学意象，不将其简化为一般性的“他与天使住在一起”。
theological_decisions:
- issue: 赫诺克与天使的关系如何表达
  choice: 他的居所与众天使同在
  alternative: 他与众天使同住
  rationale: 吉兹语采用以“居所／住处”为核心的名词性结构。正文保留这种结构，呈现其非同寻常的天上居所，同时不进一步界定其性质或机制。
- issue: “我们的父亲”的身份含义
  choice: 正文保留“我们的父亲”
  alternative: 我们的祖先
  rationale: 原文可作为亲属称谓或尊称。直译可保存其措辞及潜在张力，脚注则说明在谱系语境中也可理解为“我们的祖先”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“恳求……又……请求”有意保留原文的修辞性复叠；“居所与众天使同在”保留启示文学的名词性意象。
