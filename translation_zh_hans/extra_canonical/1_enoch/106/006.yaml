base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/006.yaml
  text: And it seems to me that he is not from me, but from the angels; and I fear that a wonder might be done in his days upon the earth.
translation:
  language: zh_hans
  text: 我看，他并不是出于我，而是出于天使；我害怕在他的日子里，地上会发生一件奇事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奇事”也可译作“异事”或“异兆”；原词指非同寻常、令人惊异或不安的事件。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይመስለኒ
  choice: 我看
  rationale: 保留说话者主观判断的语气，不把他的推测写成叙述者确认的事实；在现代汉语中简洁自然。
- source_word: አኮኑ እምኔየ
  choice: 他并不是出于我
  rationale: 按来源或血缘理解介词短语，保留拉麦对孩子身世的疑虑；“并不是”与后面的“而是”构成清楚对照。
- source_word: እመላእክት
  choice: 出于天使
  rationale: 直译其来源含义，不淡化为泛泛的超自然出身，也不擅自断定具体的非法生育情形。
- source_word: እፈረሀ
  choice: 我害怕
  rationale: 采用现在时，符合未完成式以及拉麦正在说话时的恐惧。
- source_word: ኢይትገበር
  choice: 会发生
  rationale: 在“害怕”引出的从句中，以自然汉语表达被动或非人称事件的发生，同时保留尚未实现的不确定性。
- source_word: መንክር
  choice: 一件奇事
  rationale: 表达异乎寻常、令人惊异甚至不安的事件，又不预先规定其善恶性质。
- source_word: በመዋዕሊሁ
  choice: 在他的日子里
  rationale: 保留原文与这孩子相关的时间表达，不将其过度具体化为“成年后”或单纯“有生之年”。
- source_word: ዲበ ምድር
  choice: 地上
  rationale: 符合本段宇宙性语境，并以自然、庄重的现代汉语表达。
theological_decisions:
- issue: 拉麦所猜测的孩子来源
  choice: 写成拉麦当前的主观判断：孩子不是出于他，而是出于天使
  alternative: 把天使血统写成叙述者确认的客观事实，或仅视为对异常外貌的夸张反应
  rationale: “我看”限定了整项判断的认识地位。译文保留其令人不安的神学张力，却不把拉麦的恐惧提升为经文叙述者的明确裁断。
- issue: 将要发生之“奇事”的确定程度与性质
  choice: 译作“我害怕……会发生一件奇事”
  alternative: 译成确定必然发生的神迹，或明确的灾祸、凶兆
  rationale: 恐惧结构指向尚未发生的可能事件；原词说明其非同寻常，却没有明确判定为善、恶、神迹或灾难。
translation_notes:
  register: 采用现代、庄重而易懂的直述语体。“我看”保留主观推断，“在他的日子里”保留启示文学的时间措辞；全句避免古奥化，也不将拉麦的猜测改写成确定教义。
