base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/010.yaml
  text: 'And now[a], my father, hear me: a son has been born to Lamech my son, and his appearance and form are not like the form of a human being. His color is whiter than snow and redder than the blossom of a rose, and the hair of his head is whiter than white wool. And his eyes are like the rays of the sun[c][b]; and he opened his eyes and lit up the whole house.'
translation:
  language: zh_hans
  text: 现在，我父亲，请听我说：我儿拉麦生了一个儿子；他的容貌和形体不像人的形体。他的肤色比雪更白，比红花[a]更红；他头上的头发比白羊毛更白。他的眼睛如同太阳的光芒[b]；他睁开眼睛，照亮了整座屋子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红花”所对应的原词指一种花朵，传统上也有译作“玫瑰花”的；具体花种不能确定。
    reason: lexical_alternative
  - marker: b
    text: “太阳的光芒”所对应的吉兹语短语较难确定，也可理解为太阳的光束或光轮；这里明确的重点是太阳般的明亮。
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምዐኒ
  choice: 请听我说
  rationale: 保留命令式和第一人称宾语所表达的恳切呼告；现代汉语中自然庄重。
- source_word: ተወልደ
  choice: 生了一个儿子
  rationale: 完成体表示孩子已经出生，且这一事实与当下报告直接相关；汉语无需另加完成时标记。
- source_word: ዘአምሳሉ ወፍጥረቱ
  choice: 他的容貌和形体
  rationale: 前者关乎样貌、形象，后者关乎受造或形成的形态；此处上下文集中描写可见的身体特征。
- source_word: ኢኮነ ከመ ፍጥረተ ሰብእ
  choice: 不像人的形体
  rationale: 直接保留新生儿外形异于常人的惊人描述，不据此推断其本体并非人类。
- source_word: ኅብሩ
  choice: 他的肤色
  rationale: 上下文随即以雪与红花作颜色比较，译作“肤色”比笼统的“颜色”更自然，同时不引入额外解释。
- source_word: ይጸዐዳ እምአስኃትያ
  choice: 比雪更白
  rationale: 准确保留比较结构和鲜明的白色意象。
- source_word: ይቀይሕ እምጽጌ ረዳ
  choice: 比红花更红
  rationale: 保留花朵与红色的比较，但不把植物种类不确定的词强行定为玫瑰。
- source_word: ጸጕረ ርእሱ
  choice: 他头上的头发
  rationale: 以自然汉语保留原文明确的身体部位细节。
- source_word: እምፀምር ጸዐዳ
  choice: 比白羊毛更白
  rationale: 保留比较结构以及原文对白色的重复强调。
- source_word: ከመ እግረን ለፀሐይ
  choice: 如同太阳的光芒
  rationale: 该短语词义困难，但语境清楚指向太阳般的明亮；此译保留意象而不武断限定为日轮或特定光学现象。
- source_word: ከሠተ አዕይንቲሁ
  choice: 他一睁开眼睛
  rationale: 表达睁眼后照亮屋子的连续动作；“一……就……”在汉语中自然呈现紧接发生的叙事关系。
- source_word: አበርሀ ኵሎ ቤተ
  choice: 照亮了整座屋子
  rationale: 直接呈现光充满全屋的结果，不增添超自然机制的说明。
theological_decisions:
- issue: 孩子与普通人不同的程度
  choice: 他的容貌和形体不像人的形体
  alternative: 他的容貌和形体不像人类受造之物
  rationale: 原文强调可见形态的异常，却未明确断言孩子在本体上不是人；主文保留这种张力，不作教义性定论。
- issue: 眼睛的太阳意象
  choice: 如同太阳的光芒
  alternative: 如同太阳的光轮
  rationale: 原短语难解，确定的是强烈的太阳光辉意象；选择较宽泛的表达，以免把不确定词义固定为特定形状。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我儿拉麦”保留父子关系链；颜色和身体描写尽量直译。仅在连续动作处使用自然汉语结构，未消解孩子身份与形态所形成的神学张力。
