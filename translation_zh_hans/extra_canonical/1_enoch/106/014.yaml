base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/014.yaml
  text: And they will commit sin[a], and they will transgress the ordinance; and they will join themselves with women and commit sin with them, and they will take wives from among them[c][b], and they will beget children.
translation:
  language: zh_hans
  text: 他们必犯罪，违犯定规；他们必与女人结合[a]，同她们犯罪，并从她们中娶妻，生育儿女[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结合”原指联合、相合；在本节语境中是被判为有罪的结合，但该词本身并非明确的性交用语。
    reason: lexical_alternative
  - marker: b
    text: 本节所据的机器转录在句末存在误识；经复核 Charles 1906 版，末句应为“并从她们中娶妻，生育儿女”，而不是重复的“从她们”。
    reason: textual_variant
lexical_decisions:
- source_word: ይገብሩ፡ ኀጢአተ
  choice: 犯罪
  rationale: 动词与“罪”连用，构成“行罪、犯罪”的惯用表达；现代汉语以“犯罪”最自然，并保留其道德含义。
- source_word: የኀልፉ፡ ሥርዐተ
  choice: 违犯定规
  rationale: 该组合指越过或违反既定规范；“定规”保留制度、秩序或法令的宽泛含义，避免具体化为摩西律法。
- source_word: ተደመሩ
  choice: 结合
  rationale: 原词表示联合、相合；“结合”保留其较宽泛的措辞，不把原文直接扩写成明确的性行为。
- source_word: አንስት
  choice: 女人
  rationale: 这是普通的集合称谓；译作“女人”而非“妻子”，避免提前加入婚姻关系。
- source_word: አውሰቡ
  choice: 娶妻
  rationale: 按校勘修订及词典证据，此词在这里表示娶妻或结婚，不应译作“分离”。
- source_word: ወይወልዱ፡ ውሉደ
  choice: 生儿育女
  rationale: 依据对 Charles 1906 实际文本的复核，句末应读作“生育儿女”；采用自然的现代汉语表达。
theological_decisions:
- issue: 与女人所发生之越界关系的性质
  choice: 译作“与女人结合……同她们犯罪”
  alternative: 明确译作发生性关系，或仅译作娶妻
  rationale: 上下文明确将这种结合判定为罪，但“结合”一词本身比明确的性行为用语更宽泛；译文既保留道德判断，也不超出原词的明示程度。
- issue: 句末疑难读文
  choice: 采用经查核的读文“并从她们中娶妻，生儿育女”
  alternative: 按转录文本直译为“从她们、从她们”，或译作“与她们分离”
  rationale: 最新校勘指出转录本末尾是视觉误识，Charles 1906 实际读文为“他们将生育儿女”；同时 አውሰቡ 表示娶妻。采用经复核读文，另以脚注交代转录差异。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“定规”保持启示文学与审判语境，又不把原文过度限定为某一具体律法；分号呈现原句的递进结构。
