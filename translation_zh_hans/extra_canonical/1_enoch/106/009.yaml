base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/009.yaml
  text: And he answered me and said[a], “Because of a great trouble I have come to you[c][b], and because of a marvelous vision I have drawn near.”
translation:
  language: zh_hans
  text: 他回答我说：“我因极大的忧虑[a]来到你这里；又因一个奇异的异象，上前来[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧虑”也可译作“焦急”“困扰”或“急迫”。这里的原词不是“公义”。
    reason: lexical_alternative
  - marker: b
    text: “上前来”也可译作“靠近前来”或“来到近前”。原文所用的动词有“靠近、接近”的意思，与前面的“来到你这里”在意义上有所重叠。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአውሥአኒ፡ ወይቤ
  choice: 他回答我说
  rationale: 保留答话动词及第一人称宾语，也照原文保留“回答……说”的叙事句式。
- source_word: በእንተ
  choice: 因
  rationale: 此处两次引出说话者前来和走近的缘由；译作“因”比仅表示话题的“关于”更符合句流。
- source_word: ጻህቅ፡ ዐቢይ
  choice: 极大的忧虑
  rationale: ጻህቅ在此指忧急、焦虑或困扰，不是“公义”；以“忧虑”表达内在不安，同时不把它具体化为某种外在灾祸。ዐቢይ用“极大的”表达程度。
- source_word: መጻእኩ፡ ኀቤከ
  choice: 我……来到你这里
  rationale: 直接表达“来”与指向第二人称的介词短语，符合现代汉语。
- source_word: ራእይ፡ ዐፁብ
  choice: 一个奇异的异象
  rationale: “异象”保留启示文学语境；“奇异”传达令人惊奇、非同寻常之意，而不预断其吉凶。
- source_word: ቀረብኩ
  choice: 走近前来
  rationale: 原动词表示靠近、接近；此译保留它与前一句“来到”之间近义而不完全相同的表达。
theological_decisions:
- issue: ጻህቅ的含义
  choice: 忧虑
  alternative: 困苦；焦急；紧迫之事；公义
  rationale: 该词应与表示忧急、焦虑或急迫的词根相联系，而不应与“公义”一词混同。译作“忧虑”避免凭空引入“公义之事”或“大义人”等神学化解释。
- issue: 异象的性质
  choice: 奇异的异象
  alternative: 惊人的异象；奇妙的异象
  rationale: 原文只强调异象非同寻常，并未明说它是可喜、可怕或神圣的；“奇异”保留这种开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文两个并列缘由以及“来到／走近”的轻微重复；用分号使中文层次清楚，不补出原文未明说的对象、目的或神学身份。
