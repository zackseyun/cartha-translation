  to: 他父亲拉麦害怕起来，就逃到我这里；他不相信这孩子是他的亲生孩子，反倒认为他的样貌出自天上的天使[a]。看哪，我到你这里来，是要请你把真相[b]告诉我。
  rationale: 仅作两项安全的编辑性修订：将脚注 a 锚定至其所解释的短语，并把不甚自然的“自己所生的”改为“他的亲生孩子”。其余译法保留：采用经校订支持的否定读法；不将样貌的描述扩展为天使身份或天使生育；并以“真相”处理本处求问语境，同时在脚注中保留 ጽድቀ 的“公义／正理”等可能义项。
