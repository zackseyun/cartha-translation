base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/012.yaml
  text: And his father Lamech was afraid[a], and he fled to me, and he did not believe that he was from him, but that his likeness was like the angels of heaven. And behold[b], I have come to you so that you may make righteousness known to me.
translation:
  language: zh_hans
  text: 他父亲拉麦害怕起来，就逃到我这里；他不相信这孩子是他的亲生孩子，反倒认为他的样貌出自天上的天使[a]。看哪，我到你这里来，是要请你把真相[b]告诉我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的样貌出自天上的天使”也可译作“他有天上天使的样貌”或“他像天上的天使”。原文说的是“他的样貌”，并未明说这孩子就是天使或由天使所生。
    reason: 保留“样貌”与来源介词所形成的歧义，避免把天使血统的推论写入正文。
  - marker: b
    text: “真相”或译“公义”“正理”或“正确的解释”。原词兼有道德、司法和真实之意；本处语境似指拉麦所求的真实解释。
    reason: 说明 ጽድቀ 的词义范围，并交代语境性选择。
lexical_decisions:
- source_word: ፈርሀ
  choice: 害怕起来
  rationale: 直接表达恐惧，并以“起来”自然呈现叙事中突发的反应，不额外强化程度。
- source_word: ጐየ
  choice: 逃到
  rationale: 上下文是拉麦因孩子异常的样貌而惊惧，译作“逃到”保留动作的急迫感；“跑到”亦有词义可能，但语气较弱。
- source_word: ኀቤየ
  choice: 我这里
  rationale: 表示朝说话者而来的方向；现代汉语用“到我这里”自然清楚。
- source_word: ኢአምነ
  choice: 不相信
  rationale: 依经校订所反映的否定读法理解；本题转录的 ወአአምነ 很可能漏录否定成分 ኢ。否定修饰“相信”，而非擅自移入后面的从句。
- source_word: እምኔሁ
  choice: 自己所生的
  rationale: 原词表示“从他而来”。在父子关系的语境中，“自己所生的”以自然汉语保留血缘来源之意，同时不直接断言其他父系来源。
- source_word: አምሳሉ እመላእክተ ሰማይ
  choice: 他的样貌出自天上的天使
  rationale: 保留 አምሳሉ 的名词及第三人称后缀“他的样貌”，也保留 እም- 的来源表达；不将其直接改写成孩子“就是天使”或“由天使所生”。因这种来源说法在汉语中仍有歧义，脚注列出较偏比较义的译法。
- source_word: ናሁ
  choice: 看哪
  rationale: 保留引起注意的庄重叙事标记，同时符合经籍体裁的现代中文表达。
- source_word: መጻእኩ ኀቤከ
  choice: 我到你这里来
  rationale: 准确表达第一人称已来到受话者这里；不必以生硬的完成体标记强行对应。
- source_word: ታይድዐኒ
  choice: 请你……告诉我
  rationale: 原动词有“使我知道”之意；在请求解释的语境中，“请你告诉我”是自然且准确的现代汉语。
- source_word: ጽድቀ
  choice: 真相
  rationale: 该词可指公义、正理或真实；此处拉麦前来询问孩子身世，语境较支持“真相”，脚注保留其道德—司法词义。
theological_decisions:
- issue: 本节是否断言孩子由天使所生
  choice: 译为拉麦认为“他的样貌出自天上的天使”，保留关于样貌及来源的原文措辞
  alternative: 他有天上天使的样貌；他像天上的天使
  rationale: 吉兹语以“他的样貌”为中心，并未直接说孩子是天使或由天使生育。正文不应把《守望者》传统可能引出的推论写成明确断言，同时也不应抹去来源介词带来的张力。
- issue: ጽድቀ 在请求中的含义
  choice: 真相
  alternative: 公义；正理；正确的解释
  rationale: 语境是拉麦寻求对孩子身世的真实说明，故正文采用“真相”；但该词本身具有道德和司法意味，不能无声地排除，故以脚注保留。
- issue: “相信”前否定成分的文本问题
  choice: 采用“他不相信”
  alternative: 他相信这孩子不是自己所生的
  rationale: 通行读法及句法校订支持 ወኢአምነ（“他不相信”）；所给转录可能因 OCR 漏失 ኢ。两种汉语表述在整体意思上接近，但正文依较可靠的校订读法，不把否定悄然移进从句。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留古代启示文学的提示语气；其余句法尽量现代化。用“这孩子”明确代词所指，用“自己所生的”自然表达来源关系，但避免增添天使父系等原文未明说的内容。
