base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/013.yaml
  text: And I[a], Enoch, answered and said to him, “The Lord will do a new thing on the earth; and this I have already seen in a vision, and I have made it known to you[e][d][c][b], because in the generation of Jared my father they transgressed the word of my Lord from the heights of heaven.”
translation:
  language: zh_hans
  text: 我以诺回答他，说：“主必在地上行一件新事[a]。这事我已经在异象中看见，也已经告诉了你，因为在我父亲雅列的世代，他们违背了我主从天的高处而来的话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“主必更新”或“主必使之焕然一新”。原文的动词和宾语都含有“新、更新”的意思。
    reason: lexical_alternative
  - marker: b
    text: 末句也可理解为：“他们违背了那位在天的高处的我主的话。”原文句法较难确定，“从天的高处”既可能修饰“话”，也可能修饰“我主”。
    reason: alternative_reading
lexical_decisions:
- source_word: አውሣእኩ … ወእቤሎ
  choice: 回答他，对他说
  rationale: 保留闪语叙事中“回答—说”的双重引语公式，同时使现代汉语自然通顺。
- source_word: ይኄድስ እግዚእ ኀዳሳተ
  choice: 主必……行一件新事
  rationale: 动词与宾语都源于“新、更新”的语义领域；译作“行一件新事”既自然，也不把它限定为更新大地或重新创造。
- source_word: ዲበ ምድር
  choice: 在地上
  rationale: 准确表达空间范围，采用现代汉语常用而庄重的说法。
- source_word: ወዳእኩ ርኢኩ በራእይ
  choice: 这事我已经在异象中看见
  rationale: 表达先前已经完成的看见，并保留启示文学中的异象方式。
- source_word: ወአይዳዕኩከ
  choice: 也已经告诉了你
  rationale: 该使役形式意为“使你知道”；“告诉了你”比生硬的“使你知道”更符合现代汉语，同时保留传达启示的含义。
- source_word: በትውልዱ ለአያሬድ አቡየ
  choice: 在我父亲雅列的世代
  rationale: 保留原文的谱系和世代框架；人名按通行圣经译名作“雅列”。
- source_word: አኅለፉ ነገረ
  choice: 违背了……的话
  rationale: 动词本义涉及越过、逾越；与“话”连用时，“违背”准确表达其违规含义，同时不将“话”窄化为某一条命令。
- source_word: እመልዕልተ ሰማይ
  choice: 从天之高处
  rationale: 表达“从天的高处、上部而来”的垂直意象，避免误译为位于天之外或天之上。
theological_decisions:
- issue: 主所要施行之事的性质
  choice: 主必在地上行一件新事
  alternative: 主必更新大地；主必在地上造出新事物
  rationale: 原文明确涉及“新、更新”，却未单独规定这是全面更新大地、重新创造，还是多项新事；正文采用较宽泛的表达，并以脚注保留其他可能。
- issue: 雅列世代所违背之事
  choice: 他们违背了我主……所发的话
  alternative: 他们违背了我主的命令；他们离弃了我主的话
  rationale: “话”保留原词的宽广语义，不把经文自行限定为守望者叛乱中的某一具体命令。
- issue: 末尾空间短语的修饰对象
  choice: 将“从天之高处”理解为修饰“话”
  alternative: 将其理解为修饰“我主”，即“那位在天之高处的我主”
  rationale: 吉兹语句法容许两种连接方式。正文选取语序较顺的一种，脚注明示另一种，以保留原文的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“回答他，对他说”有意保留原文的闪语式复叠；其余表达避免不必要的古奥措辞。所有脚注标记均置于正文相应位置。
