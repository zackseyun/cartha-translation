base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/003.yaml
  text: And at that time[a], he rose from the hands of the midwife[b], and he opened his mouth and spoke to the Lord of righteousness.
translation:
  language: zh_hans
  text: 那时，他从接生婆[a]的手中起身，张开嘴，向公义之主[b]说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从她手中”；原文同时说明这名女子是协助生产的人，因此正文译作“接生婆”。
    reason: lexical_alternative
  - marker: b
    text: 或译“公正之主”。原词既可指道德上的义，也可指司法上的公正。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶቤሃ
  choice: 那时
  rationale: 作为承接叙事的时间连接语，简洁自然，并保留原文庄重的叙事节奏。
- source_word: ተንሥአ
  choice: 起身
  rationale: 原词表示起来、起身；不译作“站起来”，以免把原文没有明确说明的姿势具体化。
- source_word: እምእዴሃ ለመውለዲት
  choice: 从接生婆的手中
  rationale: እምእዴሃ直译为“从她手中”，而ለመውለዲት说明这名女子是协助生产的人；“接生婆”在现代汉语中清楚而贴合语境。
- source_word: ወከሠተ አፉሁ
  choice: 张开口
  rationale: 保留原文“打开他的口”的鲜明动作次序，也与随后说话的叙述自然衔接。
- source_word: ተወተናገረ
  choice: 说话
  rationale: 采用直接、朴素的说法，不额外强化为宣告或预言。
- source_word: ለእግዚአ ጽድቅ
  choice: 向公义之主
  rationale: እግዚአ在宗教语境中宜译为“主”；ጽድቅ兼有道德上的义与司法上的公正之意，“公义”较能保留其神学分量，脚注提示另一种侧重。
theological_decisions:
- issue: 神圣称号中ጽድቅ的译法
  choice: 公义
  alternative: 公正
  rationale: “公义”较能体现该词在以诺传统中的道德与神学内涵，同时不排除司法公正的意味；脚注保留“公正”这一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起身”保留新生儿动作的惊异感，却不擅自解释为完全站立；句中按原文次序呈现起身、张口和说话三个动作。
