base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/008.yaml
  text: And when Methuselah heard the words of his son[a], he came to me at the ends of the earth, because he had heard that I was there. And he cried out, and I heard his voice, and I came to him and said to him, “Behold, I am here, my son. Why have you come to me?”
translation:
  language: zh_hans
  text: 玛土撒拉听见他儿子的话，就来到地极，到我这里来，因为他听说我在那里。他高声呼喊，我听见他的声音，便来到他那里，对他说：“看哪，我在这里，我儿。你为什么到我这里来？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚语末句若直译，近似“因为你到我这里来”，文意较为费解。按上下文，这里很可能是在询问来意：“你为什么到我这里来？”
    reason: textual_variant
lexical_decisions:
- source_word: ሰምዐ
  choice: 听见
  rationale: 基本的听觉动词；两处均译作“听见”，自然保留叙事次序。
- source_word: ነገረ ወልዱ
  choice: 他儿子的话
  rationale: ነገር 可指话、事情或消息；此处用“话”既具体，也符合现代汉语。
- source_word: ኀቤየ
  choice: 到我这里
  rationale: 体现叙事中朝向说话者的移动，比单纯的“向我”更自然。
- source_word: ውስተ አጽናፈ ምድር
  choice: 地极
  rationale: 保留原文末端、边界的启示文学地理意象，不将其淡化为一般的远方。
- source_word: እስመ ሰምዐ ከመ ህየ ሀለውኩ
  choice: 因为他听说我在那里
  rationale: ህየ 指地点“那里”，ሀለውኩ 表示“我在那里/存在”；整句说明玛土撒拉前来的缘由。
- source_word: ጸርኀ
  choice: 高声呼喊
  rationale: 表达大声召唤的鲜明动作，同时保持庄重语体。
- source_word: ቃሎ
  choice: 他的声音
  rationale: 该词也可指“话”，但在“呼喊—听见”的语境中译作“声音”最贴切。
- source_word: ናሁ ሀለውኩ
  choice: 看哪，我在这里
  rationale: “看哪”保留提示词的庄重感，“我在这里”则用自然现代汉语表达临在。
- source_word: ወልድየ
  choice: 我儿
  rationale: 保留直接的父子称呼；“我儿”比“我的儿子”更适合作呼语。
- source_word: እስመ መጻእከ ኀቤየ
  choice: 你为什么到我这里来？
  rationale: 传世埃塞俄比亚语若逐字按“因为”翻译，句法和语境均显突兀；结合召唤后的对话，最可能是询问来意。以脚注说明原文困难，避免掩盖歧义。
theological_decisions:
- issue: 宇宙地理方位语
  choice: 地极
  alternative: 遥远之地；大地的尽头
  rationale: 保留启示文学中的宇宙边界意象，不把以诺所在之处解释成普通的偏远地区，也不作教义性协调。
- issue: 末句的疑问性质
  choice: 你为什么到我这里来？
  alternative: 因为你到我这里来
  rationale: 正文采用最符合对话语境的目的问句，但脚注明示埃塞俄比亚语传本字面形式，以保留文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“地极”“看哪”“我儿”保留启示文学和古代直引语的肃穆感，其余句式力求自然流畅。
