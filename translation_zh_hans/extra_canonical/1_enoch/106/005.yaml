base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/005.yaml
  text: And he said to him[a], “I have begotten a strange son, and he is not like a human being; rather, he is like the children of the angels of heaven. And his nature is different, and he is not like us; and his eyes are like the rays of the sun[c][b], and his face is glorious.”
translation:
  language: zh_hans
  text: 他对他说：“我生了一个奇异的儿子[a]。他不像人，倒像天上的众天使的儿女[b]。他的本性与众不同，也不像我们；他的眼睛如同太阳的光芒[c]，面容荣美。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个异乎寻常的儿子”。原词强调这孩子明显不同于常态。
    reason: lexical_alternative
  - marker: b
    text: 直译为“天上的众天使的儿女”。这里保留拉麦令人震惊的比较，没有将其淡化为仅仅“像天使”。
    reason: lexical_alternative
  - marker: c
    text: 原句把他的眼睛比作太阳发出的光；也可译作“太阳的光线”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለድኩ
  choice: 我生了
  rationale: 该第一人称形式可指生育或生子。说话者是拉麦；“我生了”在现代汉语中自然保留其父亲身份与亲生关系，不必强化为较生硬的“我生育了”。
- source_word: ውሉጠ
  choice: 奇异的
  rationale: 此词强调孩子明显异于常态；“奇异”既保留拉麦的惊疑，也不预先断定这种异常是美好还是可怕。
- source_word: አኮኑ ከመ ሰብእ
  choice: 他不像人
  rationale: 原文把这孩子与普通人类相对照；“不像人”简洁自然，所指是人类身份或样态，并非特指男性。
- source_word: ወይመስል
  choice: 倒像
  rationale: 承接前面的否定并引出强烈对照；“倒像”自然呈现“不是……反而像……”的修辞推进。
- source_word: ደቂቀ መላእክተ ሰማይ
  choice: 天上众天使的儿女
  rationale: 保留原文明确的亲属性表达，不把它弱化成泛泛的“像天使”。“儿女”可概括后代，避免无根据地限定为男性。
- source_word: ፍጥረቱ ካልእት
  choice: 他的本性与众不同
  rationale: ፍጥረቱ 可涉及受造的形态、构成或本性；“本性”在上下文中清楚表达这孩子在性质或存在样态上的不同，同时保留一定语义张力。
- source_word: አዕይንቲሁ ከመ አገሪሁ ለፀሐይ
  choice: 他的眼睛如同太阳的光芒
  rationale: 此处以太阳发出的光作比；“太阳的光芒”既符合现代汉语，也保留鲜明的启示文学意象。
- source_word: ገጹ ስቡሕ
  choice: 面容荣美
  rationale: ስቡሕ 可表达荣耀、华美或辉煌；“荣美”兼顾视觉上的灿烂与尊荣意味，不把含义缩减为单纯漂亮。
theological_decisions:
- issue: 是否把“天上众天使的儿女”弱化为仅仅具有天使般的外貌
  choice: 正文保留亲属性表达“天上众天使的儿女”
  alternative: 天上的天使；像天使一样
  rationale: 吉兹语明确使用“儿女／后代”的表达，叙事语境又涉及拉麦对孩子异常身世的惊疑。保留原句可维持其神学张力，而不替读者判定真实血统或仅是外貌相似。
- issue: “不像人”是否应译成“不像男人”
  choice: 不像人
  alternative: 不像男人
  rationale: 这里对照的是普通人类与这名异常的孩子，并非针对男性性别；采用泛指人类的表达可避免不必要的性别收窄。
- issue: 如何理解孩子“本性”不同
  choice: 保留为“本性与众不同”，不进一步说明其物种或来源
  alternative: 他的身体构造不同；他属于另一种受造之物
  rationale: 原词可涵盖形态、构成和本性。经文没有在本节明说这种差异的精确性质，因此不应借译文解决其存在论身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以短句和分号呈现拉麦逐层加重的惊疑；保留“儿女”“本性”“荣美”等关键表达的启示文学色彩，同时避免古奥或宗派化措辞。
