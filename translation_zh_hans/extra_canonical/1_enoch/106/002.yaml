base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/002.yaml
  text: And his body was white like snow[a], and red like the blooming of a rose; and the hair of his head was like white wool, and his locks were beautiful. And his eyes were beautiful; and when he opened his eyes, he lit up the whole house like the sun[c][b], and the whole house became exceedingly bright.
translation:
  language: zh_hans
  text: 他的身体洁白如雪，红如盛开的玫瑰[a]；他头上的头发如白羊毛；他的发绺很美丽。他的眼睛很美丽[b]；他一睁开眼睛，就如同太阳照亮整座房子[c]，整座房子都变得极其明亮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盛开的玫瑰”原文以玫瑰的花朵比喻红色；也可译作“玫瑰花朵”。
    reason: lexical_alternative
  - marker: b
    text: 这里关于眼睛的语句在埃塞俄比亚文本中较难断句。“他的眼睛很美丽”符合现存文本的一种读法；也有可能应在“他的眼睛”之后直接接“他睁开眼睛时”。
    reason: textual_difficulty
  - marker: c
    text: 原文的形象是：他睁眼后，如太阳一般照亮整座房子；译文保留了这一具体而超常的描写。
    reason: imagery_clarification
lexical_decisions:
- source_word: ሥጋሁ
  choice: 他的身体
  rationale: 本节描写整体可见的外貌，用“身体”比“肉身”自然，也避免无根据的神学含义。
- source_word: ጻዕዳ ከመ አስሐትያ
  choice: 洁白如雪
  rationale: 保留以雪喻白的直接视觉意象；“洁白”符合现代汉语搭配，但不额外强化为发光。
- source_word: ቀይሕ ከመ ጽጌ ረዳ
  choice: 红润如盛开的玫瑰
  rationale: 保留红色及花朵盛开的比喻；“红润”用于人的外貌较自然，又没有把形象抽象化。
- source_word: ጸጕረ ርእሱ ከመ ፀምር ጻዕዳ
  choice: 他头上的发丝如洁白的羊毛
  rationale: 保留“头上的发”和“白羊毛”的完整比较及启示文学色彩。
- source_word: ተወድምድማሁ ሠናይ
  choice: 一绺绺头发十分美丽
  rationale: 将容易遗漏的“发绺”明确译出，并依照形态和希腊文片段的旁证，把“美丽”首先用于发绺。
- source_word: አዕይንቲሁ
  choice: 他的眼睛也很美丽
  rationale: 按现存埃塞俄比亚文本的连续读法补成通顺句子，同时以脚注保留该处句法和文本上的困难。
- source_word: ከሠተ አዕይንቲሁ
  choice: 他一睁开眼睛
  rationale: 语境中指睁眼；直译为“揭开眼睛”不合现代汉语。
- source_word: አብርሀ ኵሎ ቤተ ከመ ፀሐይ
  choice: 使整座房子像太阳一样明亮
  rationale: 保留眼睛使房屋发光的具体、超常意象，以及与太阳的明喻。
- source_word: ወፈድፋደ በርሀ ኵሉ ቤት
  choice: 整座房子都变得极其光亮
  rationale: 保留程度副词和全称表达，不把重复的光明描写删减掉。
theological_decisions:
- issue: 是否把异常出生的光辉描写淡化为一般的俊美或荣耀
  choice: 保留雪、玫瑰、白羊毛、太阳和照亮整座房子的具体意象
  alternative: 概括为孩子容貌非凡、充满荣耀
  rationale: 原文以强烈、具体的启示文学图像表现这个孩子的异常特征；译文不应将其抽象化或按某种教义预先解释。
- issue: 眼睛发光是客观叙述还是象征性修辞
  choice: 按叙事表层译为睁眼便使房子明亮
  alternative: 解释为属灵洞察、神性或纯粹的文学夸张
  rationale: 原文没有明说该异象的教义含义，故保留其超常性及解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留启示文学中醒目的身体色彩和发光意象；用“一绺绺头发”明确译出此前容易遗漏的“发绺”。标点按中文阅读习惯安排，并以脚注提示眼睛一语的文本困难。
