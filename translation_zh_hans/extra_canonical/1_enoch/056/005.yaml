base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/005.yaml
  text: And in those days the angels will return and turn their heads toward the east[a], toward the people of Parthia and Media. They will stir up the kings, and a spirit of turmoil will come upon them; it will unsettle them from their thrones, and they will go out like lions from their lairs[c][b], and like hungry wolves in the midst of their pasture.
translation:
  language: zh_hans
  text: 在那些日子，天使将返回，并把头转向东方，朝着帕提亚人和米底亚人。他们将煽动众王[a]；动乱之灵[b]必临到众王，使他们离开自己的王位。他们将出动，如狮子从巢穴出来，又如在自己牧场中间的饥饿的狼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处的对象词在现有吉兹文转写中难以确定；译作“众王”主要根据下文“他们的王位”以及相关文本传统。
    reason: textual_variant
  - marker: b
    text: 也可译作“混乱的灵”。这里可能指一种造成动乱的力量或状态，未必特指有位格的灵体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበአማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留启示文学中常见的复数时间公式，表达自然而庄重。
- source_word: ይገብኡ መላእክት
  choice: 天使将返回
  rationale: 所给底本为动词ገብአ的基本词干未完成式，意为“返回”，不采用其他抄本所支持的“聚集”。
- source_word: ወይወድዩ አርእስቲሆሙ
  choice: 把头转向
  rationale: 保留“头”的具体身体意象，同时符合现代汉语表达。
- source_word: ለምሥራቅ
  choice: 向东方
  rationale: 保留明确的地理方向。
- source_word: ለኀበ ሰብአ ጳርቴ ወሙዴ
  choice: 朝着帕提亚人和米底亚人
  rationale: 以现代汉语常用的族名形式表达原文“帕提亚与米底亚的人民”。
- source_word: የሐውክዎሙ
  choice: 煽动
  rationale: 该词根可表示扰乱、激动或使陷入混乱；语境涉及君王被驱离王位，“煽动”兼顾使役意味和战争氛围。
- source_word: ለዝንቱ
  choice: 众王
  rationale: 所给转写在此处文本困难；依据后文复数代词及“王位”的语境，正文采用很可能的君王所指，并以脚注说明。
- source_word: መንፈሰ ሀውክ
  choice: 动乱之灵
  rationale: 既保留“灵”的原文措辞，也不把它限定为有位格的邪灵或纯粹抽象的心理状态。
- source_word: እመንበረሆሙ
  choice: 离开自己的王位
  rationale: 在君王语境中，መንበር宜译为“王位”，而非泛指“座位”。
- source_word: ከመ አናብስት እምስካባቲሆሙ
  choice: 如狮子从巢穴出来
  rationale: 保留凶猛动物离巢出动的鲜明比喻。
- source_word: ከመ አዝእብት ርኁባን
  choice: 如饥饿的狼
  rationale: 直接保留“狼”与“饥饿”的意象，语言简明有力。
- source_word: ማእከለ መርዔት ዚአሆሙ
  choice: 进入自己的牧场之中
  rationale: 保留“牧场”这一地点意象，不擅自将其具体化为“羊群”。
theological_decisions:
- issue: መንፈሰ ሀውክ是有位格的属灵存在，还是非人格化的混乱力量
  choice: 动乱之灵
  alternative: 混乱之气／混乱的灵
  rationale: “之灵”保留原文的属灵用语及其本体论上的开放性，不将其明确解释为邪灵，也不彻底抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留启示文学的紧迫感与动物比喻；专名使用通行译法“帕提亚人”“米底亚人”。正文所有脚注标记均已对应列出。
