base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/006.yaml
  text: And they shall go up and tread upon the land of his chosen ones[b][a], and the land of his chosen ones shall become before them a trampled place and a beaten path.
translation:
  language: zh_hans
  text: 他们必上去，踏过他所拣选的子民的土地[b]；他所拣选的子民的土地必在他们面前变成遭践踏之地和被踩踏的路径[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语此处措辞较难确定。末尾两个表达很可能彼此加强，描绘土地遭人反复踩踏，变得如同路径一般。
    reason: textual_variant
  - marker: b
    text: 或译：“他们必上来，行军经过他所拣选的子民的土地。”这里的两个动词既可描写登上、行走，也可能带有军事进军的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: የዓርግዋ
  choice: 他们必上去
  rationale: 该动词表示向上移动，也可在军事语境中表达进军；“上去”保留具体方向而不额外解释。
- source_word: ይከይድዋ
  choice: 踏过
  rationale: 词根涉及行走、经过或踩踏；“踏过”既自然，又与后文遭践踏之地的意象相呼应。
- source_word: ምድረ
  choice: 土地
  rationale: 此处指选民所属的地域，并非宇宙意义上的全地；“土地”准确而自然。
- source_word: ኅሩያነ
  choice: 选民
  rationale: 这是《以诺一书》中具有标志性的群体称谓；“选民”简明、庄重，也不引入额外宗派含义。
- source_word: ዚአሁ
  choice: 他（的）
  rationale: 原文仅用第三人称单数所属形式；保留“他”，不擅自明确其所指。
- source_word: በቅድሜሆሙ
  choice: 在他们面前
  rationale: 保留原文空间和情境意味，呈现土地暴露在进犯者面前的画面。
- source_word: ምካይደ
  choice: 遭践踏之地
  rationale: 该名词似与前面的行走、踩踏动词同源；如此译法保留词语呼应及土地受蹂躏的意象。
- source_word: አሰረ
  choice: 踩出来的路
  rationale: 该词可能表示小路、路径或足迹形成的道路；“踩出来的路”与前面的反复践踏意象衔接，并避免把它过度正式化为大道。
theological_decisions:
- issue: “他选民”中“他”的所指
  choice: 保留代词“他”，不明确指认
  alternative: 译作“上帝的选民”或“主的选民”
  rationale: 吉兹语原文只有代词，本节没有明说先行词；补出“上帝”或“主”会超出本节文本证据。
translation_notes:
