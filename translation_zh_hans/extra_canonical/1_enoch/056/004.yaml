base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/004.yaml
  text: And in those days that valley will be filled with the chosen and with their beloved ones[a], and the days of their lives will be ended[f][e][d][c][b], and the days of their wandering will no longer be counted from then on.
translation:
  language: zh_hans
  text: 在那些日子，那山谷必充满蒙拣选的人和他们所爱的人[a]；他们一生的日子必告终，而他们迷失的日子[b]，从那时起不再计算[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们所爱的人”也可译作“他们亲爱的人”。原文似指蒙拣选者所亲爱或与他们关系密切的人，但具体关系并不明确。
    reason: lexical_alternative
  - marker: b
    text: “迷失”也可译作“错误”“偏离”或“走迷”。
    reason: lexical_alternative
  - marker: c
    text: “不再计算”也可理解为“不再数算”或“不再算入”；埃塞俄比亚文结句的确切语气略有不确定。
    reason: alternative_reading
lexical_decisions:
- source_word: እሜሃ
  choice: 在那些日子
  rationale: 保留启示文学常见的时间公式及“日子”的复数表达。
- source_word: ውእቱ ቈላ
  choice: 那山谷
  rationale: ቈላ 在此具体指山谷，也与上文的地形语境相衔接。
- source_word: ሕሩያን
  choice: 蒙拣选的人
  rationale: 保留该词在《比喻篇》中的群体称谓意味，同时使用现代中文自然表达。
- source_word: ፍቁራነ ዚአሆሙ
  choice: 他们所爱的人
  rationale: 贴近属格结构及关系含义，不进一步限定这些人与蒙拣选者的具体关系。
- source_word: ይትዌዳእ
  choice: 必告终
  rationale: 该动词来自“完成、终结”的词根，应与后面的“不再计算”分作两个谓语，避免漏译。
- source_word: ዕለተ ሕይወቶሙ
  choice: 他们一生的日子
  rationale: 既保留“日子”的原文意象，也符合现代汉语表达。
- source_word: ዕለተ ስሕተቶሙ
  choice: 他们迷失的日子
  rationale: ስሕተት 可指迷失、偏离或错误；“迷失”保留道德与属灵层面的开放性。
- source_word: እምይእዜ ኢትትኌለቍ
  choice: 从那时起不再计算
  rationale: 按计数、算入的意义理解结句，同时以脚注保留“算入、数算”等可能语感。
theological_decisions:
- issue: ሕሩያን 的称谓
  choice: 蒙拣选的人
  alternative: 选民／被拣选者
  rationale: “蒙拣选的人”保留被动与群体称谓的分量，又不预设后世宗派性的拣选论框架。
- issue: ስሕተት 的道德含义
  choice: 迷失
  alternative: 错误／偏离／犯罪
  rationale: 原词语义可涵盖走迷、犯错与偏离；正文不将其收窄为特定罪论用语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留启示文学的时间公式、重复的“日子”意象，以及原文两个彼此有别的谓语：“告终”与“不再计算”。
