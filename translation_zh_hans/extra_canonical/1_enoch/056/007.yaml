base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/007.yaml
  text: And the city of my righteous ones shall be a hindrance to their horses[a]; and they will stir up slaughter among themselves, and their right hand will be strong against them. And a man will not know his brother, nor a son his father or his mother, until the number of the corpses from their death is complete[d][c][b], and their punishment will not be in vain.
translation:
  language: zh_hans
  text: 我义人之城必成为他们马匹的阻碍[a]；他们必在彼此之间挑起杀戮，他们的右手必强盛，敌对他们。人将不认得自己的弟兄，儿子也不认得自己的父母[b]，直到因他们死亡而有的尸首数目满了[c]；他们所受的惩罚必不落空。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“障碍”或“陷阱”；原词可指拦阻或使之受困的事物。
    reason: lexical_alternative
  - marker: b
    text: “不认得”直译可作“不知道”；这里也可能含有“认不出”的意思。
    reason: lexical_alternative
  - marker: c
    text: “尸首数目”这一分句在吉兹语文本中句法艰涩；正文尽量照原文呈现，没有将其意义进一步明确化。
    reason: textual_difficulty
lexical_decisions:
- source_word: ሀገረ፡ ጻድቃነ፡ ዚአየ
  choice: 我义人之城
  rationale: “ሀገረ”在此取具体的“城”，“ጻድቃነ”指义人，并保留“ዚአየ”的第一人称所属意味。这样的译法维持末世异象中属神之城的具体形象，不泛化为“地区”。
- source_word: ማዕቀፈ
  choice: 阻碍
  rationale: 该词表示拦阻、阻挡或使之受困之物。“阻碍”既适合军马行进的语境，又不武断地把它具体化为某种陷阱。
- source_word: አፍራሲሆሙ
  choice: 他们的马匹
  rationale: 直译为“他们的马匹”，保留原文的军事图像；译作“骑兵”会增加解释成分。
- source_word: ያነሥኡ፡ በበ፡ ቢይናቲሆሙ፡ ቀትለ
  choice: 他们必在彼此之间挑起杀戮
  rationale: “ያነሥኡ”在此为及物表达，以“ቀትለ”（杀戮）为宾语；相互性短语表明杀戮发生在他们彼此之间。
- source_word: ትጸንዕ፡ የማኖሙ፡ ዲቤሆሙ
  choice: 他们的右手必强有力地攻击他们
  rationale: 保留“右手”作为力量与作战能力的形象，也保留末尾代词指向略显紧张的原文表达，避免擅自明确为“攻击自己”或某一外敌。
- source_word: ኢያእምር፡ ብእሲ፡ ለአኁሁ
  choice: 人将不认得自己的弟兄
  rationale: 动词可表示“知道”或“认出”。在亲属关系崩解的语境中，“认得”是自然且贴合语义的现代汉语。
- source_word: ኢወልድ፡ ለአቡሁ፡ ወለእሙ
  choice: 儿子也不认得自己的父母
  rationale: 原文省略了承接前句的动词，汉语中补出“不认得”以清楚表达；“父母”自然地涵盖父亲和母亲。
- source_word: ኍልቈ፡ አብድነት፡ እሞቶሙ
  choice: 他们死亡所留下的尸首数目满了
  rationale: 该短语文本和句法均较困难。译文保留“数目”“尸首”“死亡”三重意象，不将其过度润饰成较确定的解释。
- source_word: መቅሰፍቶሙ፡ ኢትኩን፡ በከ
  choice: 他们所受的惩罚必不落空
  rationale: “መቅሰፍቶሙ”可指惩罚、鞭打或责罚；“惩罚”在本段审判语境中最为自然。“不落空”表达其并非徒然、必有效验。
theological_decisions:
- issue: “我义人”中的第一人称所属关系
  choice: 保留“我义人之城”
  alternative: “义人之城”或“他的义人之城”
  rationale: 所给吉兹语见证带有第一人称所属意味。保留这一点可呈现说话者与义人的关系，又不额外指定说话者身份或引入后期教义措辞。
- issue: 冲突的性质
  choice: 译为他们“在彼此之间挑起杀戮”
  alternative: 译作外敌对他们施行杀戮，或仅笼统译为混乱
  rationale: 相互性短语明确指向内部残杀；随后亲属间互不相认的描写也强化了这一图景。译文保留这种审判中的自相残杀意象。
- issue: “右手……攻击他们”的指向
  choice: 保留代词的张力，不在正文中明确改成“攻击自己”
  alternative: 明确译为“他们彼此攻击”或“他们攻击外敌”
  rationale: 原文的代词关系并不完全明朗。保留较直译的表达，可避免在神学或叙事层面擅自确定攻击对象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留末世审判场景的强烈图像。句式适度接近原文的并列推进，同时避免古奥文言。对文本困难处以脚注说明，不在正文中强行消解歧义。
