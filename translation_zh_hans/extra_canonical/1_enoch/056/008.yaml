base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/008.yaml
  text: And in those days Sheol will open its mouth[a], and they will sink down into it; and destruction will pursue them[c][b]; Sheol will swallow up the sinners from before the face of the chosen ones.
translation:
  language: zh_hans
  text: 在那些日子，阴间要张开它的口[a]，他们要沉入其中；毁灭要追赶他们；阴间要从蒙拣选者面前[b]吞没罪人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指亡者所在的领域；原文将它拟人化，描写它张口吞人，并非特指后期教义中的“地狱”。
    reason: lexical_alternative
  - marker: b
    text: “从蒙拣选者面前”是较直译的说法，意思是使罪人从他们面前、从他们所在之处消失。
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留以诺文学中反复出现的末世时间公式，庄重而自然。
- source_word: ሲኦል አፉሃ
  choice: 阴间……它的口
  rationale: “阴间”保留古代亡者领域的概念，不引入“地狱”的后期教义含义；“张开它的口”保持拟人化意象。
- source_word: ወይስጠሙ ውስቴታ
  choice: 他们要沉入其中
  rationale: 传达向下沉落、进入阴间的灾变图景，不额外解释为被吞噬。
- source_word: ወትትሎሙ ኀጕሎን
  choice: 毁灭要追赶他们
  rationale: 按现存吉兹语句法，将“毁灭”视为主语，并译出“跟随、追随”的动词；“追赶”在审判语境中自然且有力度。
- source_word: ሲኦል ይውሕጦሙ
  choice: 阴间要……吞灭
  rationale: 保留阴间如巨口吞噬人的强烈拟人化意象；“吞灭”兼具吞下与毁灭之意。
- source_word: ለኃጥኣን
  choice: 罪人
  rationale: 直接对应指称犯罪之人的名词，避免扩大为较泛的“恶人”。
- source_word: እምቅድመ ገጸ ኅሩያን
  choice: 从蒙拣选者面前
  rationale: 保留原文“从……面前”的具体惯用表达；“蒙拣选者”清楚表达被选择的人，同时避免生硬的术语化表达。
theological_decisions:
- issue: ሲኦል 的译法
  choice: 阴间
  alternative: 地狱；坟墓；示奥尔
  rationale: 上下文把它描绘成张口吞人的拟人化宇宙领域。“阴间”在现代汉语圣经语域中可理解，又不强加后期关于“地狱”的特定教义。
- issue: ኅሩያን 的译法
  choice: 蒙拣选者
  alternative: 选民；被选中的人
  rationale: 依本书语境表达“被选择的人”，不将其过度协调到后期神学体系；同时保持庄重、可读。
- issue: 毁灭与阴间的关系
  choice: 分作连续的两个分句：毁灭追赶他们；阴间吞灭罪人
  alternative: 将“毁灭”与“阴间”读作同位结构
  rationale: 现存吉兹语中有明确的“追随／跟随他们”动词，宜在正文中译出其动作，不以现代校勘或旧译消除该动词。
translation_notes:
  register: 采用现代、庄重而清楚的简体中文；保留末世文学的强烈拟人化图景和“从……面前”的古老表达。分号呈现连续的审判动作，避免把吉兹语中“毁灭要追赶他们”的动词结构弱化为名词性插语。
