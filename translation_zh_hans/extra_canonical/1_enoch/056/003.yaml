base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/003.yaml
  text: And he said to me[a], 'To their chosen ones and to their beloved ones[c][b], so that they may be cast into the chasm of the abyss of the valley.'
translation:
  language: zh_hans
  text: 他对我说：“到他们所拣选的人和他们所爱的人那里去，好把他们投入山谷深渊的裂口[b]。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的表述承接上文关于去向的问题，可理解为“到他们所拣选的人和他们所爱的人那里去”。但“他们”以及这两类人的确切所指，仅凭本节不能确定。
    reason: referent_ambiguity
  - marker: b
    text: “裂口”也可译作“裂缝”或“豁口”。原文描绘山谷深渊的险恶地貌，具体形态并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: 他对我说
  rationale: 这是异象叙事中引出解释的常用表达；译法自然，并保留直接言说的语气。
- source_word: ለሕሩያነ፡ ዚአሆሙ
  choice: 到他们所拣选的人那里
  rationale: 将ለ按承接上文去向问题的方向义译为“到……那里”；ዚአሆሙ按第三人称复数领属成分处理为“他们的”，不误作指示语“这些是”。“所拣选的人”既保留领属关系，也避免使用宗派色彩较浓的固定称谓。
- source_word: ወለፍቁራኒሆሙ
  choice: 和他们所爱的人那里
  rationale: 保留与前项平行的领属结构；“所爱的人”庄重而通俗，不擅自判定这些人是亲属、同盟者还是其他依附者。
- source_word: ከመ፡ ይትወደዩ
  choice: 使他们被投入
  rationale: 保留目的或结果意味及被动语态，不擅自补明执行者；“投入”符合惩罚性的空间移动意象。
- source_word: ውስተ፡ ንቅዐተ
  choice: 投入……裂口
  rationale: ንቅዐተ可指裂缝、裂口或豁口；“裂口”保持地貌意象，也不把它过早解释为一般性的“坑”。
- source_word: ማዕምቅ
  choice: 深渊
  rationale: 表达深不可测、带有末世审判色彩的深处，同时符合现代汉语的庄重语域。
- source_word: ዘቈላ
  choice: 谷中
  rationale: 以“谷”表达地形，并将连续属格关系自然整理为“谷中深渊的裂口”，避免生硬的多重“的”结构。
theological_decisions:
- issue: “他们所拣选的人”和“他们所爱的人”的所指
  choice: 保留第三人称领属表达，不说明“他们”是谁，也不把这些人认定为义人、统治者或特定受审群体。
  alternative: 可解释为权势者的同党，或被指定接受惩罚的人。
  rationale: 本节单独看无法明确这些称谓的对象；保留所指含混可避免将某种神学解释写入正文。
- issue: 被投入深渊者的身份
  choice: 沿用原文复数代词“他们”，不补写明确名词。
  alternative: 可明确译成“使那些被拣选、被爱的人被投入”。
  rationale: 原文代词与前文参与者之间可能存在指代张力，直译代词更能保存这种不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留异象话语略显突兀的句法关系与代词歧义，同时用“谷中深渊的裂口”自然表达原文连续的地貌属格结构。
