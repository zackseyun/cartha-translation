base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/002.yaml
  text: And I asked the angel of peace who went with me, saying, “To whom are they going, these who hold the scourges?”
translation:
  language: zh_hans
  text: 我问那位与我同行的和平天使，说：“这些手持刑具的，要往谁那里去？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刑具”也可译作“刑鞭”或“施罚的器具”；原词既可指惩罚，也可指施行惩罚所用的工具。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: 我问
  rationale: 该动词直接引出以诺向同行天使所提的问题；“我问”自然简洁，符合现代汉语叙事。
- source_word: መልአክ ሰላም
  choice: 和平天使
  rationale: 保留属格性称号的含义，而不弱化为泛指“温和的天使”；“和平天使”也是自然、庄重的中文表达。
- source_word: ዘየሐውር ምስሌየ
  choice: 与我同行的
  rationale: 关系从句指明这位天使在异象旅程中陪同以诺；“同行”既保留动态意象，也符合现代汉语。
- source_word: እንዘ እብል
  choice: 说
  rationale: 这是引入直接引语的惯用结构；中文用“说”简洁自然，并保留原文叙事结构。
- source_word: ለመኑ የሐውሩ
  choice: 要往谁那里去
  rationale: ለመኑ 在此是“向谁/往谁那里”，而 የሐውሩ 明确表达“去、前往”；译文保留询问目的地或对象的含义，不误作询问身份。
- source_word: እሉ እለ
  choice: 这些……的
  rationale: 指示词与关系结构指向异象中眼前可见的一群；中文前置为“这些手持……的”，自然保留近指作用。
- source_word: ይአኅዙ
  choice: 手持
  rationale: 该词可指持有、抓住或携带；结合具体器具，“手持”形象而不过度说明其是否正准备使用。
- source_word: መቅሠፍተ
  choice: 刑具
  rationale: 该词可指惩罚本身或施罚的器具；因这些对象可被“持有”，语境偏向具体工具。“刑具”保留施行惩罚的含义，又不限定为某一种鞭具。
theological_decisions:
- issue: መቅሠፍተ 应译为抽象的惩罚，还是具体的施罚器具
  choice: 具体译为“刑具”
  alternative: “惩罚”或更具体的“刑鞭”
  rationale: “手持”的直接句法语境支持具体器具义；但原词并未明确限定器具种类，因此不用较窄的“刑鞭”，并以脚注保留词义范围。
- issue: 问题是在询问这些持刑具者的身份，还是他们所去的对象
  choice: 译为询问他们“要往谁那里去”
  alternative: “这些手持刑具的是谁？”
  rationale: 原文包含表示“去、前往”的动词 የሐውሩ，且 ለመኑ 表示“向谁/为谁”；因此应保留目的地或目标对象的询问，不将其改成身份问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“与我同行的和平天使”保留以诺文学中的称号与异象旅程意象；问句按汉语习惯重组，但完整保留“这些人”“手持器具”以及“往谁那里去”等原文要素。
