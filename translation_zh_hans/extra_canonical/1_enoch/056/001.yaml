base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/001.yaml
  text: And there I saw the angels of punishment going about[c][b][a], and they were holding scourges and chains of iron and bronze.
translation:
  language: zh_hans
  text: 我在异象中看见那里有施行惩罚的天使四处走动[a]；他们手里拿着鞭子和铁、铜制的锁链[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在异象中”对应原文中一个解释有争议的词；该词也曾被分析为“队伍”或“军队”。
    reason: lexical_alternative
  - marker: b
    text: 刑具名称及金属词的搭配较难确定。也可理解为“刑具和铁、铜锁链”，或让“铁和铜”共同修饰两种刑具；“铜”也可译作“青铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ በህየ
  choice: 我在那里看见
  rationale: 保留异象叙事中第一人称见证与地点副词，采用自然、庄重的现代汉语。
- source_word: ትዕይንታተ
  choice: 不另译为“异象”或“军队”
  rationale: 此词在本句中的确切功能存在争议；现有审校记录彼此冲突。为避免把不确定的“异象”或“军队”强加进正文，以脚注说明异文理解。
- source_word: መላእክት፡ መቅሠፍት
  choice: 惩罚的天使
  rationale: 按属格结构表达执行惩罚的天使，保留司法性和启示文学色彩，不引入后期 demonological 分类。
- source_word: እንዘ፡ የሐውሩ
  choice: 四处行走
  rationale: 表达场景中持续的移动，又不具体限定其方式或目的。
- source_word: ወይአሕዙ
  choice: 他们手里拿着
  rationale: 以持续状态描写天使持有刑罚器具，符合现代汉语叙事。
- source_word: መቅሠፍተ
  choice: 鞭子
  rationale: 依最新审校所确认的器具次序，译作施罚用的鞭子；该词仍有“刑具”等较宽泛可能。
- source_word: መማግረ
  choice: 锁链
  rationale: 按审校后的词项辨识译为锁链，与前项“鞭子”并列。
- source_word: ሐጺን፡ ውብርት
  choice: 铁和铜所制的
  rationale: 将两种金属共同修饰紧邻的“锁链”，保留原文结构可能性；ውብርት 可指铜、青铜或铜合金。
theological_decisions:
- issue: 天使的性质
  choice: 执行惩罚的天使
  alternative: 毁灭的天使；降灾的天使
  rationale: “惩罚的天使”保留原句的审判功能，却不把这些形象解释为邪灵或特定等级的天使。
- issue: 刑具及金属修饰语的关系
  choice: 鞭子，以及铁和铜所制的锁链
  alternative: 铁鞭和铜链；铁与铜制的鞭子和锁链
  rationale: 按词序，金属名称紧随“锁链”，故正文优先让其修饰锁链；同时以脚注保留句法与器具词义的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留启示文学的直接视觉叙述；对词义和修饰关系的真实不确定性不作过度断定，而置于脚注。
