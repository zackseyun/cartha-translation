base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/001.yaml
  text: And from there I went toward the south[a], to the ends of the earth; and there I saw three open portals of heaven, and from there come out the south wind, and dew, and rain[c][b], and wind.
translation:
  language: zh_hans
  text: 我从那里往南方去，到了地极；在那里，我看见天上有三个敞开的门户[a]，南风、露水、雨和风从那里出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上三个敞开的门户”反映异象中的宇宙地理观：天空被描绘为有门户，各种气象现象从其中出来。
    reason: cultural_note
lexical_decisions:
- source_word: እምህየ፡ ሖርኩ
  choice: 此后，我……去
  rationale: 保留常见的叙事转折和第一人称行动报告；“此后”在现代中文中自然，也承接前段异象行程。
- source_word: መንገለ፡ አዜብ
  choice: 往南方
  rationale: 此处表示行进方向；“往南方”简洁自然，不额外限定为某一具体地点。
- source_word: በአጽናፈ፡ ምድር
  choice: 直到地极
  rationale: 保留启示文学中的宇宙地理意象，不将其弱化为普通的遥远地区。
- source_word: ሠለስተ፡ ኆዋኅወ፡ ሰማይ፡ ርኁዋተ
  choice: 天上三个敞开的门户
  rationale: “门户”保留天空被描绘为具有结构性出口的异象图景；“敞开的”明确对应门户处于开启状态。
- source_word: ወይወፅእ፡ እምህየ
  choice: 都从那里出来
  rationale: 按描述性、习惯性的现在意义表达这些气象现象由门户发出；“都”自然统摄后面的并列项目。
- source_word: አዜብ
  choice: 南风
  rationale: 该词在此位于气象现象列表中，译作“南风”比单译“南方”更符合语境。
- source_word: ጠል
  choice: 露水
  rationale: 该词通常明确指露水，并与古代宇宙论中由天上门户分发的其他气象现象并列；不译作较宽泛的“雾”。
- source_word: ዝናም
  choice: 雨
  rationale: 采用直接、通行的气象用语。
- source_word: ነፋስ
  choice: 风
  rationale: 在气象列表中明确取自然界之风的意义，而非“灵”。
theological_decisions:
- issue: 天体建筑式意象
  choice: 天上三个敞开的门户
  alternative: 天上的三个窗口／三个开口
  rationale: 保留原文所呈现的异象宇宙结构，不将其抽象化，也不借用可能带有其他经文固定联想的措辞。
- issue: 露水作为独立气象项目
  choice: 露水
  alternative: 雾
  rationale: 原词及本书相关宇宙气象分类支持“露水”；如此可保留南风、露水、雨、风彼此并列的古代气象观。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“地极”和“门户”保留启示文学的宏阔意象；并列气象项目按原文次序呈现。
