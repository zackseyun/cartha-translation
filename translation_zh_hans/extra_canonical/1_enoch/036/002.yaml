    issue: “我看见这一切，就称颂上帝”增添并泛化了原文未在该分句明说的受词。
    rationale: 原文在“我看见后便颂赞”之后才明确说“我时时颂赞荣耀之主”。译为“上帝”既预先补足受词，也没有保留“荣耀之主”的称号。
  - severity: low
    issue: “雨水”不如“雨”贴合气象列表。
    rationale: 此处与露和风并列的是降雨，现代汉语“雨水”也常指收集或形成的水，故以“雨”更准确。
