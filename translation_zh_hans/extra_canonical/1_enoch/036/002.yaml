base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/002.yaml
  text: And from there I went toward the east to the ends of heaven[a], and I saw three open portals of heaven toward the east[b], and above them small portals.
translation:
  language: zh_hans
  text: '我从那里往南而去，到了地的尽头；在那里，我看见天上有三道敞开的门，南风、露、雨和风都从那里出来。


    我又从那里往日出之地而去，到了天的尽头；在那里，我看见朝向日出之地有三道敞开的天门，上方还有一些小门。天上的星辰各从这些小门中的一道经过，沿着为它们显明的路径向西行进。


    我看见后，便颂赞；我也时时颂赞荣耀之主。他施行伟大而荣耀的奇事，为要向他的天使和世人的灵魂显明他作为的伟大，使他们颂扬他的作为和他一切的作为，看见他大能的作为，颂扬他双手所做的伟大之工，并且永永远远称颂他。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዜብ
  choice: 南／南风
  rationale: 该词在方位语境中表示“南方”，在从天门出来的事物列表中可指“南风”。按各自语境分别译为“南”和“南风”，保留原文同词复现。
- source_word: ጽባሕ
  choice: 日出之地
  rationale: 字面涉及晨光、日出，在方位语境中指东方；译作“日出之地”既自然，又保留异象文本的具体意象。
- source_word: ኀዋኅወ፡ ሰማይ
  choice: 天上的门
  rationale: 直译为“天的门／天门”。“天上的门”在现代汉语中清楚表达这些门属于天界结构，避免让“天门”误成固定专名。
- source_word: ጠል፡ ወዝናም፡ ወነፋስ
  choice: 露水、雨水和风
  rationale: 依次保留气象名词，不把它们解释成象征物。
- source_word: ነፍሳተ፡ ሰብእ
  choice: 世人的灵魂
  rationale: 形式上是“人的灵魂”复数。译文保留“灵魂”，不改释为“人类”，以免消除原文在人与灵魂之间的措辞张力。
- source_word: እግዚአ፡ ስብሐት
  choice: 荣耀之主
  rationale: 按属格结构译为“荣耀之主”，保持颂赞称号，不额外指定其神学内涵。
theological_decisions:
- issue: “他的天使和世人的灵魂”是显明作为的对象
  choice: 保留“天使”和“世人的灵魂”两个并列对象
  alternative: 概括为“天使和人类”
  rationale: 原文明确使用“人的灵魂”，概括为“人类”会使其人观措辞趋于单一。
- issue: 末段连续颂赞句的主语
  choice: 以“他们”承接天使和世人的灵魂
  alternative: 将部分动词理解为泛指众受造者或转回第一人称
  rationale: 原文目的从句中的复数动词最自然地回指前述两类对象；但不进一步说明他们颂赞的方式或身份。
translation_notes:
  register: 采用庄重而现代的叙事语体。以“我从那里……”维持异象游历的连续节奏；“日出之地”保留古代宇宙图景，同时用“向西运行”等现代常用表达确保可读性。所给吉兹语材料明显长于英语咨询层，因此正文依据完整吉兹语材料翻译，不沿用英语层已过时的残篇脚注。
