base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/002.yaml
  text: 'And because of them people go astray concerning them[a], for these lights render service at the stations of the world in righteousness: one in the first portal, and one in the third portal of heaven, and one in the fourth portal, and one in the sixth portal[e][d][c][b]; and the careful ordering of the world is completed in three hundred and sixty-four stations of the world.'
translation:
  language: zh_hans
  text: 因它们，人对它们产生了误解[a]；因为这些光体按公义变换它们在世界中的驻位[b]：第一道天门有一个，第三道天门有两个，第四道天门有两个，第六道天门有两个[c]。世界的精密秩序在三百六十四个世界驻位中完成[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可理解为：“人因这些光体而迷失”，或“人对这些光体的推算出了差错。”原文的两个介词短语关系紧密，既可强调误解的原因，也可强调误解的对象。
    reason: lexical_alternative
  - marker: b
    text: “变换它们在世界中的驻位”也可译作“更换各自的驻位”或“在世界的各驻位间交替”。原文没有完全说明发生变换的是光体的位置，还是它们的轮次。
    reason: source_ambiguity
  - marker: c
    text: 所据吉兹语文本为：第一道天门一个，第三、第四和第六道天门各两个。部分既有译文将后面三个数字也处理为“一个”。
    reason: textual_rendering
  - marker: d
    text: 末句较难确定。它很可能指以诺天文体系中一年三百六十四日的精密编排；但原文更直译为世界的精密秩序在三百六十四个“驻位”中完成。
    reason: alternative_reading
lexical_decisions:
- source_word: ወበእንቲአሆሙ ... ሰብእ ቦሙ
  choice: 因它们，人对它们产生了误解
  rationale: 前一介词短语按因果关系处理，后一带代词的介词短语则表示人所误解的对象。中文避免译成“在人群中”或“在光体中”，以免误成空间关系，同时用脚注保留句法歧义。
- source_word: እሙንቱ ብርሃናት
  choice: 这些光体
  rationale: 上下文所指是天上的发光体。“光体”比单说“光”更能指明实体，又不额外指定为太阳、月亮或星辰。
- source_word: በጽድቅ
  choice: 按公义
  rationale: 保留ጽድቅ的公义、正直语义，不把宇宙秩序中的神学色彩完全化约为“准确地”或“有规律地”。
- source_word: ይትቀየዩ
  choice: 变换
  rationale: 该动词表示改变、交替或转换；“变换”适合光体在不同位置间运行的语境，但不强行规定究竟是光体自身、位置还是轮次发生改变。
- source_word: መንበረ ዓለም
  choice: 世界的驻位
  rationale: መንበር本义为座位、所在或驻处；在天文段落中译作“驻位”，兼顾具体位置与编排中的固定站位，并保留与末句同一短语的呼应。
- source_word: ኆኅት
  choice: 天门
  rationale: 该词为门或门户；本段所说是天上的出入口。“天门”既自然，也保留启示文学的空间意象。
- source_word: ይትፌጸም ጥንቃቄ ዓለም
  choice: 世界的精密秩序……完成
  rationale: ጥንቃቄ含谨慎、精确、周密之意；结合天文历法语境译为“精密秩序”，既表达精确性，也不直接把原文改写成“历年计算”。
- source_word: ፻፷ወ፬ ... መንበረ ዓለም
  choice: 三百六十四个世界驻位
  rationale: 照原文保留364及重复出现的“世界驻位”，不在正文直接释为364日。
theological_decisions:
- issue: 天文运行中的በጽድቅ
  choice: 按公义
  alternative: 正确地；按适当秩序
  rationale: 原文以通常表示公义、正直的词描绘宇宙运行。正文保留道德—宇宙秩序之间的张力，不将其纯机械化。
- issue: 364的含义
  choice: 三百六十四个世界驻位
  alternative: 一年三百六十四日；三百六十四个计算单位
  rationale: 以诺天文传统支持364日历年的理解，但本句字面使用“驻位”而非明确的“日”。因此正文从原文，脚注说明历法解释。
- issue: 各天门前的数目
  choice: 第一道一个，第三、第四、第六道各两个
  alternative: 四道天门各一个
  rationale: 所给吉兹语文本在第三、第四和第六道门前明确有数字፪（二），虽英语咨询层正文写作“一”，仍以原文数字为准。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“光体”“驻位”略带天文技术色彩，以配合本段内容；“按公义”刻意保留原文把宇宙规律与公义并置的表达。数字依吉兹语底本处理，不追随英语咨询层正文的简化。
