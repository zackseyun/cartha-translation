base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/006.yaml
  text: When the twelve other portals in heaven[a], at the ends of the earth, are opened[c][b], from which the sun and the moon and the stars come out.
translation:
  language: zh_hans
  text: 当天上、在大地尽头的十二道门户[a]打开时，太阳、月亮和众星从这些门户中出来。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门户”也可译作“门口”或“孔道”，指天体结构中的出入口。
    reason: lexical_alternative
  - marker: b
    text: “大地尽头”反映古代宇宙观的图景，并非现代科学意义上的描述。
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: 当……时
  rationale: 此处引出时间从句，按其通常的时间连词义处理，不译成表示叙事推进的“然后”。
- source_word: ይትረኃዉ
  choice: 打开
  rationale: 该形式表示“被打开／开启”；汉语中以“门户打开”自然表达其被动含义。
- source_word: ፲ሥሩ ወካልእ
  choice: 十二
  rationale: 在此数字结构中表示“十和二”，即十二；不译作“另外十二”。
- source_word: ኃዋላወ
  choice: 门户
  rationale: 指天体结构中供日月星辰出入的孔道或门口；“门户”既保留具体宇宙建筑意象，也避免“开口打开”的生硬重复。
- source_word: በሰማይ
  choice: 天上
  rationale: 保留启示文学的宇宙空间意象，同时符合现代汉语表达。
- source_word: ዲበ አጽናፈ ምድር
  choice: 位于大地尽头
  rationale: 忠实保留古代宇宙观中的大地边界意象，不将其现代化为方位或地平线。
- source_word: እለ እምኔሆሙ ይወፅእ
  choice: 都从那里出来
  rationale: 关系结构说明日月众星从这些门户出来；“那里”自然回指十二道门户。
- source_word: ፀሐይ ወወርኅ ወከዋክብት
  choice: 太阳、月亮和众星
  rationale: 保留三个并列天体类别；“众星”简洁体现复数。
theological_decisions:
- issue: 天上门户与大地尽头的宇宙观语言
  choice: 保留“天上”“大地尽头”“门户”的具体意象
  alternative: 将其解释性改写为天空中的方位、地平线或天文区域
  rationale: 本节描绘具有具体结构的古代宇宙图景。译文不把它改造成现代科学描述，也不替文本消解其启示文学张力。
- issue: 十二道门户是否为“另外十二道”
  choice: 译作“十二道”
  alternative: 译作“另外十二道”
  rationale: 该表达在这里是“十和二”的数词组合；译入“另外”会加入原句并未明确表达的附加关系。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。句式保留原文“当……时”的时间关系，同时将地点成分调整为自然汉语语序。所有具体宇宙意象均予保留，不作现代化解释。
