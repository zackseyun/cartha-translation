base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/001.yaml
  text: And the leaders of the heads of thousands[a], who are over all creation and over all the stars, together with those four that are added and do not separate from their service[e][d][c][b], according to the reckoning of the year—and these render service on the four days that are not counted in the reckoning of the year.
translation:
  language: zh_hans
  text: 那些千夫长的首领[a]，就是管理一切受造之物和众星的；他们连同那四个被加上的[b]，都不脱离按年历计算所定的职分；他们在那不计入年历计算的四天里执行职分[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可理解为“他们的首领，就是千夫长”。这里的称谓描写有等级的天上职官。
    reason: 原文中领属关系和同位关系的句法较为压缩，存在不同断句可能。
  - marker: b
    text: “被加上的”也可译作“被接合的”或“附加的”，指它们被纳入或附属于一年的有序体系。
    reason: ይትዌሰኩ兼有加上、接合之意；关系词表明此语修饰“那四个”。
  - marker: c
    text: “执行职分”所译的动词含义不易确定，也可理解为“服役”“轮换”或“发生转换”。
    reason: 保存困难动词ይትቀየዩ的词义不确定性，避免在正文中确定为轮流。
  - marker: d
    text: “不计入年历计算的四天”指《天文书》三百六十四日历法中与一年四个转折点相关的附加日。正文没有明确说明前面的“那四个”只是这些日子，还是也包括管理它们的天上职官。
    reason: 提供必要的历法背景，同时保留所指对象的含混。
lexical_decisions:
- source_word: መራሕያኒሆሙ ለአርእስተ አእላፍ
  choice: 那些统领千夫长的首领
  rationale: መራሕያኒሆሙ 表示“他们的首领／引导者”，አርእስተ አእላፍ 直译为“千人的头领”。译文保留原文的层级结构，同时使用现代汉语可理解的“千夫长”。
- source_word: ዲበ ኵሉ ፍጥረት
  choice: 管理一切受造之物
  rationale: 介词 ዲበ 在这里表达居于其上或管辖；ፍጥረት 可指受造物或整个受造秩序。“管理一切受造之物”符合宇宙职官语境。
- source_word: ዲበ ኵሉ ከዋክብት
  choice: 管理……众星
  rationale: 忠实表达对所有星辰的管辖，并与前一分句共用“管理”，使汉语自然简洁。
- source_word: ምስለ እሉ ፬ እለ ይትዌሰኩ
  choice: 连同那四个被加上的
  rationale: 保留关系词 እለ，使“被加上的”明确修饰“那四个”，而不把“加上”误作全句主要谓语；“四个”不补出具体所指，以保存原文起初的含混。
- source_word: ኢይትሌለዩ እምነ ምግባሮሙ
  choice: 都不离开他们……所承担的职分
  rationale: ምግባር 可指工作、行为、职责或职能；在天体秩序语境中，“职分”兼顾职责与被安排的运行功能。
- source_word: በከመ ሐሳበ ዓመት
  choice: 按照年历计算
  rationale: ሐሳብ 在此是计算、核算之意，整句属于历法术语；“年历计算”比日常的“数算一年”更准确。
- source_word: ይትቀየዩ
  choice: 轮流履职
  rationale: 该动词较难确定，可含改变、交替或轮换之意；结合前文的职分与四日，“轮流履职”传达交替执行功能的可能含义，同时在脚注保留其他解释。
- source_word: ፬ መዋዐለ እለ ኢይትኃሰቡ በሐሳበ ዓመት
  choice: 那不计入年历计算的四天
  rationale: 直陈这四天不列入所说的年度核算；不在正文进一步解释其历法机制。
theological_decisions:
- issue: “那四个”究竟指四天、相关天体职官，还是两者兼有
  choice: 正文先译作不指明类别的“那四个”，末句再按原文说“不计入年历计算的四天”
  alternative: 直接把前面的“那四个”译成“四天”，或译成“四位天使／主管者”
  rationale: 原文首次提到“这四个”时没有名词，后文才出现“四天”。《天文书》的表达又可能把历法单位与其天上管理者相联，因此不宜在译文中提前消除这种张力。
- issue: 困难动词 ይትቀየዩ 的功能意义
  choice: 译为“轮流履职”并加注说明
  alternative: 译为“服役”“改变”或“交替”
  rationale: 词根可表达改变或轮换；上下文强调被指定的职分。“轮流履职”较能同时反映交替性和职能性，但其不确定性须由脚注公开。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“受造之物”“职分”保留古代宗教宇宙秩序的语感，但避免过度古雅；以“年历计算”呈现技术性历法语境。句法尽量跟随吉兹语的关系结构，同时用分号划分两项陈述。
