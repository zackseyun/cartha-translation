base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/004.yaml
  text: Likewise[a], Uriel showed me twelve openings in the circuit of the chariots of the sun in the sky, from which the rays of the sun go out[b], and from which warmth comes forth upon the earth when they are opened in the seasons appointed for them.
translation:
  language: zh_hans
  text: 同样，乌列给我看太阳战车在天空中环行的轨道上的十二个开口；太阳的光芒从这些开口射出[a]，热也从这些开口发出，来到地上；这些开口在为它们指定的时节被开启。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光芒”所对应的吉兹语形式较难确定，字面可能是“太阳的脚”；在这里可能引申为太阳射出的光束。
    reason: lexical_alternative
lexical_decisions:
- source_word: ፲ሥሩ ወካልእ（校勘作፲ወ፪ ኆኃውተ）
  choice: 十二个开口
  rationale: 现存转写显然受OCR讹误影响；结合校勘意见和本章天文语境，应读作“十二个开口／门户”，而不是“另一条律例”。
- source_word: ኃዋላወ / በአውደ（据校勘）
  choice: 运行的轨道上
  rationale: 表达太阳战车环行的范围或轨道，同时避免把具体的宇宙图景抽象化。
- source_word: ሰረገላት ፀሐይ
  choice: 太阳战车
  rationale: 保留原文具体而庄严的启示文学意象。
- source_word: እገሪሃ ለፀሐይ
  choice: 太阳的光芒
  rationale: 字面形式可能是“太阳的脚”，但在太阳发射物的语境中指光束或光芒；正文采用自然中文，脚注保留词义难点。
- source_word: ሞቅ
  choice: 热气
  rationale: 指由太阳开口发出并临到地上的热；“热气”比“温暖”更保留实体性，又不夸大强度。
- source_word: ሶበ ይትረኃዉ
  choice: 这些开口就会开启
  rationale: 明确复指十二个开口，保留原文的被开启或开启状态。
- source_word: በአዝማን እለ እሙራን ሎሙ
  choice: 到了为它们指定的时节
  rationale: 保留时间秩序已被规定的含义，但不额外指明规定者。
theological_decisions:
- issue: 天体运行机制的性质
  choice: 保留太阳战车、轨道和开口等具体宇宙图景
  alternative: 将其解释为现代意义上的日照、季节和气候现象
  rationale: 本节以启示文学的具体天体结构描述有秩序的宇宙；译文不应将其现代化或抽象化。
- issue: 指定时节的施动者
  choice: 使用“为它们指定的时节”，不明说由谁指定
  alternative: 译作“上帝为它们指定的时节”
  rationale: 原文表达时节已被规定，却未在本句明示施动者；译文保留这种含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留启示文学的宇宙意象。以分号梳理连续关系，避免英语式长句。
