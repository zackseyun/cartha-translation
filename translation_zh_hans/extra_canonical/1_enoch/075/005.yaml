  text: and for the winds[a], and for the spirit of dew[c][b], when the openings are opened in heaven at the ends.
translation:
  language: zh_hans
  text: 也为风[a]，也为露的灵[b]；当天的边缘处，孔口开启时[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”也可译作“众灵”；在本段宇宙气象的语境中，译作“风”较合适。
    reason: lexical_alternative
  - marker: b
    text: “露的灵”原文含义较难确定，也可理解为“露的气息”或带来露水的风。
    reason: lexical_alternative
  - marker: c
    text: 从“当天的边缘处……”起的分句在现存底本中有文本疑点。“孔口”也可译作“开口”“窗口”或“通气口”。
    reason: textual_variant
lexical_decisions:
- source_word: ነፋሳት
  choice: 风
  rationale: 本段描写宇宙中的气象现象及其通道；译作“风”比“灵”更符合这里的语境。
- source_word: መንፈሰ ጠል
  choice: 露的灵
  rationale: 原文搭配罕见，可指“露的气息”或带来露水的风；正文保留其陌生意象，不将它简化为普通气象用语。
- source_word: ሶበ
  choice: 当……时
  rationale: 作为时间连词，引出孔口开启之时的情形。
- source_word: ይትረኃዉ
  choice: 开启
  rationale: 保留被动含义，不补出开启者；汉语“孔口开启”自然且不失原意。
- source_word: ርኅወተ
  choice: 孔口
  rationale: 泛指天上的开口或通气口；“孔口”既能表达实体开口，也避免具体化为“窗”或“门”。
- source_word: በሰማይ
  choice: 天上
  rationale: 原文为单数“天／天空”，译作现代汉语自然的“天上”，不误增复数。
- source_word: አጽናፈ
  choice: 边缘
  rationale: 指天的尽头、边界或极处；结合“孔口”，译为“边缘”在汉语中更清楚。
theological_decisions:
- issue: 是否把“露的灵”消解为普通天气现象
  choice: 正文保留“露的灵”
  alternative: 露风；露的气息；露水
  rationale: 本节具有天启文学的宇宙论意象。保留这一异常表达，既呈现原文张力，也不把宇宙性的施行者或力量擅自改写成现代气象术语。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“露的灵”这一不寻常的宇宙论表达；用“天上”体现原文单数，不加入原文没有的“它们的”。所有脚注标记均置于正文相应位置。
