revisions:
- from: 至于征兆、时节、年和日[a]，乌列——就是荣耀之主所立、永远管理天上以及世间一切天体的那位天使——向我指明了它们怎样在天穹之上掌权，又显现在地上，并成为白昼和黑夜的引导者：太阳、月亮、众星，以及一切服役的力量[c]，都在天上的各辆战车[d]中循环运行。
  to: 至于征兆、时节、年和日[a]，乌列——就是荣耀之主所立、永远管理天上以及世间一切天体的那位天使——向我指明了它们怎样在天穹之上掌权，怎样从地上可以看见，并成为白昼和黑夜的引导者：太阳、月亮、众星，以及一切供职的力量[c]，都在天上的一切战车[d]中循环运行。
  rationale: 修改仅澄清“被看见”的观察地点，避免译文暗示天体出现在地面；并微调不确定术语的中文搭配。其余句法、神名、宇宙论和战车意象均维持原稿的忠实表达。
