base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/003.yaml
  text: For concerning the signs and the seasons and the years and the days[a], Uriel, the angel whom the Lord of glory appointed forever over all the luminaries of heaven in heaven and in the world, showed me how they rule over the face of heaven and are seen upon the earth[e][d][c][b], and become guides for day and for night—the sun and the moon and the stars and all the ministering powers that make their circuit in all the chariots of heaven.
translation:
  language: zh_hans
  text: 至于征兆、时节、年和日[a]，乌列——就是荣耀之主所立、永远管理天上以及世间一切天体的那位天使——向我指明了它们怎样在天穹之上掌权，怎样从地上可以看见，并成为白昼和黑夜的引导者：太阳、月亮、众星，以及一切供职的力量[c]，都在天上的一切战车[d]中循环运行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时节”也可译作“指定的时期”，这里可能特指历法中划定的时间段。
    reason: lexical_alternative
  - marker: c
    text: “供职的力量”原义不确定，可能指与天体相伴的天上侍从、秩序或职能。
    reason: lexical_alternative
  - marker: d
    text: “天上的战车”也可能意指天体按秩序运行的路径；正文保留原文的战车意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርት
  choice: 征兆
  rationale: 在天文历法语境中指可观察、用于计时的天象标志；“征兆”保留其标志性而不必解释为凶兆。
- source_word: አዝማን
  choice: 时节
  rationale: 指宇宙秩序中划定的时间或固定时段；“时节”自然，并保留历法含义。
- source_word: መዋዕል
  choice: 日
  rationale: 与“征兆、时节、年”并列时，直译为“日”最符合时间单位的次序。
- source_word: አርአየኒ
  choice: 向我指明了
  rationale: 既表达使观看、展示的含义，也适合异象叙述的庄重语体。
- source_word: እግዚአ ስብሐት
  choice: 荣耀之主
  rationale: 保留原文属格结构与神圣称号的庄严感。
- source_word: ብርሃናት ሰማይ
  choice: 天体
  rationale: 此处指有秩序运行的天上发光体；现代汉语“天体”清楚自然，又适合天文语境。
- source_word: በሰማይ ወበዓለም
  choice: 天上以及世间
  rationale: 贴近原文对天上领域与世界领域的并列，同时不把其宇宙观过度现代化。
- source_word: ይምልኩ
  choice: 掌权
  rationale: 保留原文治理、统辖的拟人化语言，不改写为纯粹机械性的天文运动。
- source_word: ገጸ ሰማይ
  choice: 天穹之上
  rationale: 以自然汉语表达“天的表面/面貌”这一可见天空的意象；主文不采用生硬的“天的脸面”。
- source_word: መራሕያነ
  choice: 引导者
  rationale: 表达这些天体为昼夜提供指引和秩序的作用，同时不强化为政治性的统治者。
- source_word: ቅንየታት
  choice: 服役的力量
  rationale: 原词在本处含义不确定，可能指侍从性的天上秩序、实体或职能；此译保留其宇宙性与不确定性。
- source_word: የአውዱ
  choice: 循环运行
  rationale: 表达环行、周行之意，符合天体按既定路径运行的上下文。
- source_word: ሰረገላት ሰማይ
  choice: 天上的各辆战车
  rationale: 保留原文启示文学中的战车意象，不直接消解为“轨道”。
- source_word: ለዓለም
  choice: 永远
  rationale: 明确译出乌列受立职分的持续期限，避免遗漏原文。
theological_decisions:
- issue: 是否将天体的作用改写为非人格化的现代天文学语言
  choice: 保留“掌权”与“引导者”的人格化、治理性语言
  alternative: 译作“在天空运行并标示昼夜”
  rationale: 原文以治理和引导描绘宇宙秩序；保留这种表达可忠实呈现启示文学的世界观，而不以现代自然主义语言取代它。
- issue: 如何处理“天上的战车”
  choice: 在主文中保留战车意象
  alternative: 解释为“天上的轨道”或“运行路径”
  rationale: 原文明确使用战车图像。其功能或可指天体运行的路径，但不应在主文中消除这一启示文学意象。
- issue: “永远”修饰何者
  choice: 将“永远”理解为乌列受荣耀之主设立、管理众天体之职分的持续性
  alternative: 将其与后续天体或宇宙领域宽泛相连
  rationale: 原文词序最自然地把ለዓለም与设立乌列的从句相连；同时以破折号结构避免断言超出句法所支持的细节。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。句首“至于……”贴近原文主题前置结构；用插入语说明乌列身份，以维持长句关系。保留“掌权”“引导者”“战车”等启示文学措辞，同时以“天穹”“天体”“循环运行”确保普通读者能够理解。所有实际采用的脚注标记均已置于正文。
