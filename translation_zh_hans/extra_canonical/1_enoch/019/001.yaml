base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/001.yaml
  text: And Uriel said to me[a], “Here shall stand the angels who joined themselves with women; and their spirits, having taken on many forms, defile humankind and lead them astray so that they sacrifice to demons as to gods, until the day of the great judgment[d][c][b], on which they will be judged until they are finished.”
translation:
  language: zh_hans
  text: 乌列对我说：“这里将站着那些与女人结合的天使；他们的灵[a]化作多种形态[b]，已经玷污世人，又不断引他们走入歧途，使他们把鬼魔当作神明献祭，直到大审判的日子来到。到那日，他们将受审判，直到他们的终局完成[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的灵”也可理解为“由他们而出的灵”。原文并未明确说明这是堕落者自身的灵，还是与其后裔有关的灵。
    reason: alternative_reading
  - marker: b
    text: 原文短语较难，也可译作“成为许多显现”或“以多种样貌出现”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“直到他们得以完成”或“直到他们的终局完成”。原文强调审判彻底成就，但其确切含义并不明朗。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተደሚሮሙ
  choice: 与……结合
  rationale: 该词表示联合、结合；此处保留与女人联合的直接含义，不额外加入原文未明说的细节。
- source_word: ይቀውሙ
  choice: 将站着
  rationale: 保留异象场景中的站立状态及未然语气，也维持原文庄严的场景感。
- source_word: መናፍስቲሆሙ
  choice: 他们的灵
  rationale: 按字面保留所有格和复数所表达的集合意义，不擅自判定这些灵究竟属于堕落天使、其后裔，还是与其相关的邪灵。
- source_word: ብዙኃ ራእየ ከዊኖሙ
  choice: 化作多种形态
  rationale: 该难解短语涉及“成为”和“形貌／显现”；此译自然地表达多样显现，同时不把它限定为幻象或肉身变化。
- source_word: አርኰስዎሙ
  choice: 已经玷污
  rationale: “玷污”保留道德与礼仪不洁的双重色彩；“已经”反映完成式，与随后持续性的动词形成区别。
- source_word: ያስሕትዎሙ
  choice: 不断引他们走入歧途
  rationale: 体现使役意义，并用“不断”传达未完成式所示的持续行动。
- source_word: ይሡዑ
  choice: 献祭
  rationale: 原词具体指献祭，比泛译为“敬拜”更准确。
- source_word: አጋንንት
  choice: 鬼魔
  rationale: 这是现代中文宗教语境中对邪恶灵体清楚而庄重的对应词。
- source_word: ከመ አማልክት
  choice: 把鬼魔当作神明
  rationale: 清楚表达鬼魔受到本应归给神明的祭祀尊荣，而不暗示它们真实具有神性。
- source_word: ዕለተ ዐባይ ኵነኔ
  choice: 大审判的日子
  rationale: 贴近原文词序和末世审判公式，同时保持自然中文。
- source_word: ይትኴነኑ
  choice: 将受审判
  rationale: 保留被动司法含义，不把“审判”提前解释成特定刑罚。
- source_word: እስከ ይትፈጸሙ
  choice: 直到他们的结局完全实现
  rationale: 表达完成、终结之意，同时避免武断规定最终刑罚的具体性质或持续方式。
theological_decisions:
- issue: “他们的灵”所指为何
  choice: 按字面译作“他们的灵”
  alternative: “由他们而出的灵”或“他们后裔的灵”
  rationale: 原文没有明确界定所指；直译能保留以诺传统中有关这些灵体身份的真实张力。
- issue: 鬼魔与神明的关系
  choice: 译作“把鬼魔当作神明献祭”
  alternative: “向鬼魔如同向诸神献祭”
  rationale: 此处表达的是人给予鬼魔如同给予神明的祭祀，并非认定鬼魔本身就是神。
- issue: 末句的终局含义
  choice: 译作“直到他们的结局完全实现”
  alternative: “直到他们被灭尽”或“直到他们的刑罚完成”
  rationale: 原文强调完成或终结，却未明确规定其本体论意义；所选译文不预断灭绝、刑罚期限等教义问题。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“鬼魔”“献祭”“审判”等词保留启示文学的宗教语域；句法适度分层，以清楚呈现完成式的既成玷污与未完成式的持续迷惑之间的时态变化。
