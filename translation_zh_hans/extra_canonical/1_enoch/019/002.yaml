base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/002.yaml
  text: And their wives[a], the angels who went astray[c][b], will become like peaceful ones.
translation:
  language: zh_hans
  text: 而那些偏离正道的天使的妻子[a]，将变得像平安者一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女人”。原词既可泛指女人，也可特指妻子。
    reason: lexical_alternative
  - marker: b
    text: “平安者”所指较难确定。这一复数形式可理解为“安宁的人／平安的人”，也可能是指她们将处于平安的状态。
    reason: alternative_reading
lexical_decisions:
- source_word: አንስትያሆሙኒ
  choice: 妻子……也
  rationale: 该词以“女人／妻子”为词干，带复数领属后缀，并含附加成分“也”。上下文涉及与迷失正道的天使结合的女子，因此正文采用自然的“妻子”，同时以脚注保留“女人”这一较宽泛的词义。
- source_word: ለስሑታን፡ መላእክት
  choice: 迷失正道的天使的
  rationale: 将这一短语理解为修饰“妻子／女人”的领属结构；ስሑታን 表示偏离、迷失者，መላእክት 在本段明确指天使。此译法避免把“天使”误接为比较对象。
- source_word: ተከመ
  choice: 像……一样
  rationale: 该比较成分表达相似或所处状态相仿，而非本体身份完全等同。
- source_word: ሰላማዊያት
  choice: 平安者
  rationale: 该复数形容词源自“平安”，可作名词性称谓。译作“平安者”保留原文不寻常而庄重的表达，不擅自明确其究竟指某类存在还是一种平安状态。
- source_word: ይከውና
  choice: 必变得
  rationale: 该动词表示成为或进入某种状态；“必变得”既体现将来意义，也保留变化过程。
theological_decisions:
- issue: 女子变化的性质
  choice: 译为“变得像平安者一样”，表达比较性的变化
  alternative: 变成天使；与天使一同安居；进入平安状态
  rationale: 原文有明确的比较成分，不能据此断定这些女子在本体上变成天使；“平安者”的所指也不够明确，因此正文保留比较及其张力。
- issue: “天使”在句中的句法归属
  choice: 将“迷失正道的天使”视为这些妻子的所属者
  alternative: 把“天使”作为她们将要变得相像的对象
  rationale: ለስሑታን መላእክት 构成领属说明，较自然地限定前面的“妻子／女人”；比较对象则由后面的“平安者”表达。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“迷失正道”保留原词兼具方向偏离与道德失误的意味；“平安者”刻意保留原文的异常表达和解释空间。
