base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/003.yaml
  text: And I[a], Enoch, alone saw the vision, the ends of all things[b]; and no human being will see as I have seen.
translation:
  language: zh_hans
  text: 唯有我以诺看见了这异象——万有的尽头[a]；世人中没有人能像我这样看见。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“万有的边界”或“万物的极处”。原文可指最远的界限，也可能带有宇宙性或终极性的意味。
    reason: 保留አጽናፈ ኵሉ在空间边界与终极尽头之间的语义张力。
  - marker: b
    text: 也可译作“世人中没有谁会像我这样看见”。原文动词形式可作一般性陈述，也可带将来意味。
    reason: 说明时态和体貌上的真实歧义，避免正文把它单一定为将来预言。
lexical_decisions:
- source_word: አርአያ
  choice: 异象
  rationale: 该词可指所见的景象、形象或显现；在本段启示文学语境中，“异象”既自然，又保留其启示性的意味。
- source_word: ባሕቲትየ
  choice: 独自
  rationale: 突出以诺是唯一看见这异象的人；“独自”简洁地保留其排他性。
- source_word: አጽናፈ ኵሉ
  choice: 万有的尽头
  rationale: አጽናፍ可指边界、极处或尽头，ኵሉ表示一切、万有；此译保留空间与宇宙性意味，也不排除终极性的联想。
- source_word: አልቦ ዘይሬኢ እምሰብእ
  choice: 世人中没有谁……看见过
  rationale: 按短语结构表达“人类中没有一个看见者”；避免把ሰብእ不必要地限定为男性，并以自然汉语呈现否定的普遍范围。
- source_word: ከመ አነ ርኢኩ
  choice: 像我这样看见过
  rationale: 保留比较关系和以诺亲身见证的完成性，不额外规定后来是否还会有人看见。
- source_word: ሄኖክ
  choice: 以诺
  rationale: 采用现代中文圣经传统中通行的人名译法，便于读者识别；原文音译更接近“赫诺克”。
theological_decisions:
- issue: 以诺所见异象的范围
  choice: 译作“万有的尽头”，呈现遍及宇宙极处的宏阔异象
  alternative: “大地的边缘”或“万事的结局”
  rationale: 原文措辞宽广，可带空间、宇宙或终极意味；不宜将其缩限为地理边缘，也不宜只解释为时间上的结局。
- issue: 无人能有同样看见的时态
  choice: “没有谁像我这样看见过”
  alternative: “没有人会像我这样看见”
  rationale: 关系动词形式容许一般性或将来性理解；正文采用自然且较少强加时间限定的汉语，脚注说明另一种可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我以诺”保留原文自我指认的紧凑结构；“就是”显明“这异象”与“万有的尽头”之间可能的同位关系，同时不作超出原文的教义解释。
