revisions:
- from: 我以诺独自看见了这异象，就是万有的尽头[a]；世人中没有谁像我这样看见过。[b]
  to: 唯有我以诺看见了这异象——万有的尽头[a]；世人中没有人能像我这样看见。[b]
  rationale: 修订以“唯有”明确原文所强调的以诺独有的观看／领受，避免“独自”造成场景性误读；以“没有人能……看见”保留原文一般性和潜在将来性的歧义；并用破折号替代“就是”，以较少解释性的方式呈现“异象”与“万有的尽头”的关联。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:52:06Z'
