base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/020.yaml
  text: And the spirit of the dew has its dwelling at the ends of heaven[a], and it is joined with the storehouses of the rain; and its course is in winter and in summer, and its clouds and the clouds of the mist are joined together[d][c][b], and one gives to another.
translation:
  language: zh_hans
  text: 露水之灵的居所在天的尽头；它与雨的仓库相连。它在冬季和夏季运行[a]；它的云与雾霭之云相连，一者给另一者[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “运行”也可译作“行程”“路径”或“循环轨迹”；原词在这里的确切侧重点不能确定。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“这一个给那一个”或“彼此给予”。此句可能指露水、雨和云之间的相互交换或接续传递。
    reason: lexical_alternative
lexical_decisions:
- source_word: መንፈሰ ጠል
  choice: 露水之灵
  rationale: መንፈስ可指灵、风或气息；此处处于描写天上自然力量的启示文学语境，译作“灵”能保留拟人化的宇宙意象，而不把它简化成普通气象现象。ጠል明确指露水。
- source_word: ማኅደሩ
  choice: 它的居所
  rationale: 该词在此更适合译作居所、住处，与后文表示仓库或宝库的መዛግብት有所区别，保留原文有意的用词变化。
- source_word: በአጽናፈ ሰማይ
  choice: 在天的尽头
  rationale: 保留古代宇宙观中天之边际的图景；“尽头”自然、庄重，也不将其现代空间化。
- source_word: ድኁግ ውእቱ ምስለ መዛግብተ ዝናም
  choice: 它与雨的仓库相连
  rationale: ድኁግ表达连接或结合，መዛግት则是复数的仓库、宝库；译文保留天上储藏自然现象的启示文学意象。
- source_word: ምሕዋረ ዚአሃ
  choice: 它的行程
  rationale: 该词可表示行走、路径或运行轨迹；“行程”既贴近字面，也保留具体所指未定的空间。
- source_word: በክረምት ወበሐጋይ
  choice: 贯穿冬季和夏季
  rationale: 原文并列两个季节；此译表达其行程与两季均有关，不改写成特定地区的雨季和旱季。
- source_word: ደመና ጊሜ
  choice: 雾霭的云
  rationale: ጊሜ的确切气象含义不完全确定，可指雾、霭或薄雾；“雾霭”保留朦胧的大气意象。
- source_word: ኅቡር ውእቱ
  choice: 连在一起
  rationale: 该表达表示联合、结合；简明呈现两类云相连的关系。
- source_word: አሐዱ ለአሐዱ ይሁብ
  choice: 一个给予另一个
  rationale: 尽量直译原文的不定指表达，不擅自确定给予之物，也不强行判定是单向传递还是彼此交换。
theological_decisions:
- issue: መንፈሰ应理解为非人格的气象力量，还是拟人化的宇宙之“灵”
  choice: 译作拟人化的“露水之灵”
  alternative: “露水之风”或“露水之气”
  rationale: 上下文列举天上的仓库和宇宙力量，采用“灵”可保留启示文学的拟人化张力，同时不赋予该词后来的系统神学含义。
- issue: 末句是否明确表达彼此交换
  choice: 保留“一个给予另一个”的开放表述
  alternative: 译作“彼此给予”或“这一个给予那一个”
  rationale: 原文可表达相互给予，也可能表达依次传递；正文不将这种关系解释得过于确定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留“露水之灵”“天的尽头”“雨的仓库”等古代启示文学宇宙意象。正文通过短句和分号呈现原文并列结构，并以脚注保存“行程”、雾霭及末句关系上的真实歧义。
