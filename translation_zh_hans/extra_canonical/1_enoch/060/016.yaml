base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/016.yaml
  text: And the spirit of the sea is male and strong[a], and according to the might of its strength he holds it back with a rein[c][b], and thus it is driven out and scattered among all the mountains of the earth.
translation:
  language: zh_hans
  text: 海的灵[a]是男性，且强壮有力；他照着海本身力量的威势，用缰绳把海勒住[b][c]；海就这样被驱出，散布在大地上一切山岭之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“海风”。吉兹语መንፈስ也可指“风”或“气息”；此处的拟人化语境较支持“灵”。
    reason: lexical_alternative
  - marker: b
    text: “海本身力量的威势”：直译近于“它的力量之威力”。这里的阴性词尾应指“海”；也有旧译将其理解为海之灵“他自己的力量”。
    reason: textual_grammar_note
  - marker: c
    text: 这幅图像似乎描写海的力量先被缰绳约束，随后又被驱出，散布到群山之间；所指可能是水雾、浪花或风暴云，但吉兹语见证并未清楚说明具体过程。
    reason: cultural_note
lexical_decisions:
- source_word: መንፈሰ፡ ባሕር
  choice: 海的灵
  rationale: መንፈስ可指灵、风或气息；此处宇宙力量被人格化，因此正文采用“灵”，同时以脚注保留“风”的可能。
- source_word: ተባዕታይ
  choice: 男性的
  rationale: 原词明确标示雄性或男性；“男性的”既保留人格化及性别意象，又比用于动物的“雄性”更适合此处的灵体。
- source_word: ዕኑፅ
  choice: 强有力
  rationale: 表达强健、有力之意，并与下文关于力量的强化措辞相呼应，而不过度增译为“凶猛”。
- source_word: ኃይለ፡ ጽንዐታ
  choice: 海本身力量的威势
  rationale: 两个力量语汇构成强化表达；ጽንዐታ带阴性后缀，所指应为语法上作阴性的“海”，故明确译作“海本身”，避免中文代词指向含混。
- source_word: በአንቍ፡ ይገብእ
  choice: 用缰绳把海勒住
  rationale: አንቍ指缰绳或笼头，动词在此表达收拢、约束；“勒住”自然保留以驾驭牲畜比喻控制强大力量的图像。
- source_word: ትትነጻእ
  choice: 被放出
  rationale: 该形式可表示出去、获释或被推出；“被放出”保留先约束、后向外释放的顺序，又不把动作机制说得过实。
- source_word: ትዘራእ
  choice: 散布
  rationale: 原义可为“撒种”，此处用于海在群山间的扩散；“散布”保留广泛播散的意象，同时符合现代汉语。
- source_word: በአሉ፡ አድባረ፡ ምድር
  choice: 在地上所有的山间
  rationale: 保留全地、群山的宇宙性范围；“山间”自然表达其散布于诸山之中的空间关系。
theological_decisions:
- issue: 宇宙力量的人格化
  choice: 把“海的灵”保留为男性且有行动能力的主体
  alternative: 译成非人格化的“海风”，并淡化性别
  rationale: 原文明确称其为男性，并以阳性动词描述其行动；保留人格化能忠实呈现异象文学的宇宙图景，而不将其简化为普通气象描写。
- issue: “其力量”所指对象
  choice: 理解为海本身的力量
  alternative: 理解为海之灵自身的力量
  rationale: ጽንዐታ的阴性后缀与后续阴性动词共同指向语法上作阴性的“海”，而海之灵在本句中明确为阳性；正文据此译明，脚注仍记录另一种传统理解。
- issue: 海受约束后又被放出的图像
  choice: 保留“勒住—放出—散布”的张力
  alternative: 具体解释为水雾、浪花或风暴云越过群山
  rationale: 仅存的吉兹语见证没有清楚说明具体自然机制，因此不在正文中补入某一种气象解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“海的灵”“用缰绳把海勒住”保留异象文学鲜明的拟人图像；以分号呈现原句三段递进结构。正文明确区分阳性的海之灵与阴性所指的海，同时通过脚注保留词义及图像上的真实歧义。
