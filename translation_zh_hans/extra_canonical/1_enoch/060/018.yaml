base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/018.yaml
  text: And the spirit of the hail departed by the force of his might[a], and its spirit is by itself; and what goes up from it is like smoke[f][e][d][c][b], and its name is Frost.
translation:
  language: zh_hans
  text: 冰雹之灵凭着它的威力离去[a]；其中的灵独自存在[b]。从它升上去的东西如烟；它名叫“霜”[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它的”也可译作“他的”；这里的力量可能属于冰雹之灵，也可能属于所描写的气象力量。
    reason: pronoun_ambiguity
  - marker: b
    text: “独自存在”直译可作“独自在那里”或“自成一体”；原词强调单独、独自，不一定是在作抽象分类。
    reason: lexical_alternative
  - marker: c
    text: 末句的代词也可按拟人化方式译作“他名叫‘霜’”；其所指可能是刚才升起的烟状之物，也可能是前述的灵。
    reason: referent_ambiguity
lexical_decisions:
- source_word: መንፈሰ
  choice: 灵
  rationale: 原词可指灵、风或气息；本段把宇宙和气象力量描写为有秩序的能动者，译作“灵”最能保留启示文学的拟人色彩。
- source_word: ሐመዳ
  choice: 冰雹
  rationale: 上下文列举受管理的气象现象；“冰雹”比“霜”或“冰”更准确地表达一种降落的破坏性天气现象。
- source_word: ሐደገ
  choice: 离去
  rationale: 该动词表达离开或出去；“离去”保留运动意象，同时不武断判定是从某处出来还是受差遣而去。
- source_word: በእንተ ኃይለ ዚአሁ
  choice: 凭着它的威力
  rationale: 短语表示力量所构成的动因或凭借；“凭着……威力”自然保留施力意味，而中性代词避免过度人格化。
- source_word: ቦቱ ባሕቲቱ
  choice: 它里面的灵独自存在
  rationale: ቦቱ 表示“在它里面”，ባሕቲቱ 的基本意思是“独自、单独”；此译法保留空间关系及独处意味，不改写成较抽象的“有别”。
- source_word: ዘየዐርግ እምኔሁ
  choice: 从它升上去的
  rationale: 忠实保留向上升起以及从先行对象发出的意象，并保留代词所指的轻微含混。
- source_word: ከመ ጢስ
  choice: 仿佛烟雾
  rationale: 原文明用烟作比；“烟雾”在现代汉语中自然且视觉鲜明，不将其弱化为普通水汽。
- source_word: ስሙ ደይክ
  choice: 它名叫“霜”
  rationale: 保留原文命名公式和气象力量的拟人化表达；“霜”与所据文本及当前校订层的 Frost 相符。
theological_decisions:
- issue: 是否把气象之“灵”消解为纯粹自然过程
  choice: 保留“灵”及命名的拟人化语言
  alternative: 译作冰雹的风、气流或一般天气现象
  rationale: 《以诺一书》的启示文学世界将宇宙与气象力量描绘成受管理的能动存在；保留原有张力，避免按现代气象观将其扁平化。
- issue: 力量所属者的代词如何表达
  choice: 用“它”指向冰雹之灵或该现象，并在脚注说明歧义
  alternative: 用“他”，明确将其理解为男性人格存在
  rationale: 吉兹语形式可按人格化对象译为“他”，也可按气象现象译为“它”；正文不强行确定其人格程度。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句法尽量贴近吉兹语的并列推进，同时用分号和句号理清层次；保留“灵”、上升如烟及命名公式所形成的启示文学图景。
