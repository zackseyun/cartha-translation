base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/013.yaml
  text: And the thunder[a], according to their places of striking, and for every division that is divided by the lightning, so that it may flash—and their restraint[d][c][b], so that they may hear quickly.
translation:
  language: zh_hans
  text: 雷声[a]，各按其落击之处；闪电所划分的每一个部分[b]，使闪电闪耀；以及它们的约束[c]，使它们迅速听见[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各按其落击之处”所对应的吉兹语较难，也可理解为“各在其坠落之地”；这里的名词具体指落下或击中的地方。
    reason: lexical_alternative
  - marker: b
    text: 原文使用同根词，近似直译为“每一个被划分的部分”；这种重复可能强调风暴现象各有分定的范围。
    reason: lexical_alternative
  - marker: c
    text: “约束”也可译作“忍耐”“克制”或“节制”。此处究竟指风暴力量受到控制，还是指延迟释放，并不明确。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“使它们迅速听见”。闪语中的“听”也可包含响应或服从之意；因此“迅速听从”可作另一种理解，但正文保留较字面的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጐድጓድ
  choice: 雷声
  rationale: 该名词指雷或雷鸣；“雷声”在现代汉语中自然，并保留风暴意象。
- source_word: በበመዳቃቲሆሙ
  choice: 各按其落击之处
  rationale: 重叠介词带有逐一分配之意；መዳቃ 指落下、击落之处，故不采用较抽象的“位置”。
- source_word: ኵሉ ክፍለ ዘይትከፈል
  choice: 所划分的每一个部分
  rationale: 保留词根重复所表达的“部分—划分”结构，同时使中文可读。
- source_word: በመብረቅ
  choice: 闪电所
  rationale: 将介词理解为工具或施事关系，即各部分由闪电划分；不把关系解释得更具体。
- source_word: ከመ ይበርቅ
  choice: 使它闪耀
  rationale: 动词与闪电、发光相关；“闪耀”既保留闪光意象，也不过度限定瞬时方式。
- source_word: ትዕግሥቶሙ
  choice: 它们的节制
  rationale: 该词可指忍耐、克制或约束；在宇宙力量受控的语境中，“节制”最能保留其含混性。
- source_word: ፍጡነ ይስምዑ
  choice: 使它们迅速听从
  rationale: ይስምዑ 字面为“听”，但闪电雷声作为复数主体时，汉语“听从”自然呈现闪语中听见与响应之间的语义联系；脚注保留字面可能。
theological_decisions:
- issue: 是否把末句明确解释为自然力量服从神的命令
  choice: 保留“节制”和“听从”的简短表述，不补出命令者或神圣命令
  alternative: 意译为“它们受约束，立即服从上帝的命令”
  rationale: 原文没有明说命令者；补出上帝及其命令会消除文本本有的语法和神学张力。
- issue: 是否把整节顺成一幅秩序井然的风暴图景
  choice: 保留原文并列而略显断裂的结构
  alternative: 改写为“雷声和闪电都按指定的范围有序运行”
  rationale: 原文句法艰涩，过度顺译会掩盖“每一个部分”“节制”等难点。
translation_notes:
  register: 采用庄重而现代的简体中文。以分号呈现原文并列、断裂的目录式结构；不补出未明说的主宰者，也不把艰涩的气象描写改写成教义性陈述。
