    text: 或译“带着忍耐”或“在忍耐中”。此语在上下文中较难确定，也可能描述雷声按秩序受到约束。
    reason: lexical_alternative
  - marker: b
    text: 译作“灵”的吉兹语词也可指“气息”或“风”。本句可能指神圣的作用，也可能指使雷与闪电一同运行的动力。
    reason: lexical_alternative
  - marker: c
    text: “二者并非同一”所据的底本文字较难确定。大意似乎是：雷与闪电彼此有别，却一同运行，并不分离。
    reason: textual_variant
  - marker: d
    text: 也可译作：“因为安歇之所已经赐给雷。”原词为复数。
    reason: previous_rendering
  revision_rationale: 修订明确“安歇之所”的复数／集合性，并将不自然的“使它的声音有所忍耐”改为“它的声音也在忍耐中发出”。后者仍是谨慎的句法重组，脚注明确保留该短语的困难和“受约束”这一可能性，未将其定为唯一解释。“并非同一”避免“一体”可能引入的额外本体论含义；脚注锚点亦按正文所涉短语重新顺序配置。
