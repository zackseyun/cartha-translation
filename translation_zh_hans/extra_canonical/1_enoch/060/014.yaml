base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/014.yaml
  text: For resting places have been given to the thunder with patience for the sound of its voice[a]; and the thunder and the lightning are not separated, and though they are not one[d][c][b], by the Spirit the two of them go together and are not separated.
translation:
  language: zh_hans
  text: 因为雷已得了安歇之处[d]，使它的声音有所忍耐[a]；雷与闪电并不分离，虽然二者并非一体[c]，却藉着灵[b]一同运行，彼此不分离。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带着忍耐”“在忍耐中”。此语在上下文中较难确定，也可能描述雷声按秩序受到约束。
    reason: lexical_alternative
  - marker: b
    text: 译作“灵”的吉兹语词也可指“气息”或“风”。本句可能指神圣的作用，也可能指使雷与闪电一同运行的动力。
    reason: lexical_alternative
  - marker: c
    text: “二者并非一体”所据的底本文字较难确定。大意似乎是：雷与闪电彼此有别，却一同运行，并不分离。
    reason: textual_variant
  - marker: d
    text: 也可译作：“因为安歇之处已经赐给雷。”
    reason: previous_rendering
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 保留原文引出解释或原因的连接作用，承接上文自然。
- source_word: ለነጐድጓድ ምዕረፋተ
  choice: 雷已得了安歇之处
  rationale: 将与格所指的“雷”和复数意义的“安歇之处”自然地译入现代汉语，同时保留启示文学中自然力量有指定居所的宇宙图景。
- source_word: በትዕግሥት ለቃለ ዚአሁ
  choice: 使它的声音有所忍耐
  rationale: 原短语在此处语义和句法均不甚明朗；译文保留“声音”与“忍耐／克制”的联系，而不具体断定是等候、容忍还是受约束。
- source_word: ወኢይትሌለዩ
  choice: 并不分离／彼此不分离
  rationale: 原文首尾重复同一表达；汉语也保留这一修辞性重复，仅按句位略作自然调整。
- source_word: እነጐድጓድ ወእመብረቅ
  choice: 雷与闪电
  rationale: 准确呈现两个并列、彼此协调的自然现象。
- source_word: ወእም፪ኒ
  choice: 虽然二者并非一体
  rationale: 底本此处难解，但与下文“二者”相配，显然强调雷与闪电既有区别又不可分离；“并非一体”保存这种张力。
- source_word: በመንፈስ
  choice: 藉着灵
  rationale: መንፈስ可指灵、气息或风；正文采用不加专名化限定的“灵”，既保留超自然施动者的可能，也避免明确认定为某一特定神学位格。
- source_word: ክልኤሆሙ የሐውሩ
  choice: 一同运行
  rationale: 明确保留“两者”共同前行或运行的意思，符合本段宇宙秩序的语境。
theological_decisions:
- issue: በመንፈስ在宇宙现象描述中是否特指神的灵
  choice: 藉着灵
  alternative: 藉着气息／风
  rationale: 原词语义范围较宽，正文不将其明确等同于某一特定神学位格；脚注交代“灵、气息、风”的开放性。
- issue: 雷与闪电“并非一体”却“不分离”的关系
  choice: 保留二者有别而同行的张力
  alternative: 将其解释为同一种现象的两个层面
  rationale: 原文同时强调区别与不可分离，译文不以自然哲学或教义体系消解这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“安歇之处”保留启示文学的具象宇宙图景；“有所忍耐”刻意维持原句的陌生感与不确定性。正文中的脚注标记均按[a]至[d]显明列出。
