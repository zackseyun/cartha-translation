base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/001.yaml
  text: In the five-hundredth year, in the seventh month, on the fourteenth day of the month, in the life of Henok, in that parable I saw that the heaven of heavens was shaken with a great shaking, and the host of the Most High, and the angels, thousands of thousands and ten thousand times ten thousand, were stirred in a great turmoil.
translation:
  language: zh_hans
  text: 在以诺在世的第五百年、第七月、当月十四日，在那则比喻中，我看见诸天之天[a]大大震动；至高者的天军[b]，以及千千万万、万万千千的天使，都陷入极大的骚动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“最高的天”。吉兹语直译为“诸天之天”，是一种表示至高天界的最高级说法。
    reason: lexical_alternative
  - marker: b
    text: “至高者的天军”也可理解为“至高者的能力”或“至高者的权能”；但下文随即提到无数天使，因此正文采用集合性的“天军”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በዓመት ፭ምእት ... በሕይወተ ሄኖክ
  choice: 在以诺一生的第五百年
  rationale: 保留原文以“生命／一生”界定年代的庄重表述，同时按现代汉语重组语序，使日期引言自然清楚。
- source_word: በወርኅ ሳብዕ። አመ ዐሡሩ ወረቡዑ ለወርኅ
  choice: 第七月、当月十四日
  rationale: 准确传达月份与日期；“当月”避免汉语中连续重复“月”的笨重感。
- source_word: በውእቱ አምሳል
  choice: 在那则比喻中
  rationale: “比喻”保留本书该部分的术语关联，不将其泛化为“异象”。
- source_word: ሰማየ ሰማያት
  choice: 诸天之天
  rationale: 保存原文以属格表达最高级的独特宇宙意象；汉语“诸天之天”庄重且可理解。
- source_word: ታድለቀልቅ ... ይልቅልቅ ዐቢይ
  choice: 大大震动
  rationale: 以汉语叠加强调再现原文强烈、巨大的震动，避免生硬直译为“震动一个大震动”。
- source_word: ኀይሉ ልዑል
  choice: 至高者的天军
  rationale: 后接数量极多的天使，语境较支持集合性的天上军旅；脚注保留“能力／权能”的抽象读法。
- source_word: መላእክት አእላፈ አእላፍ ወትእልፊተ ትእልፊት
  choice: 千千万万、万万千千的天使
  rationale: 保留原文层叠、重复的巨大数目修辞，并采用自然而庄严的现代汉语。
- source_word: ትሀውኩ ሁከተ ዐቢየ
  choice: 都陷入极大的骚动
  rationale: 传达动词与名词共同加强的混乱、扰动之感，同时保持汉语流畅。
theological_decisions:
- issue: ኀይሉ ልዑል 是指抽象的神圣能力，还是属于至高者的天上军队
  choice: 至高者的天军
  alternative: 至高者的能力／权能
  rationale: 紧接着出现无数天使，集合性的“天军”更符合当前异象场景；但原词可指力量或能力，因此以脚注保存歧义。
- issue: 如何表达 ሰማየ ሰማያት
  choice: 诸天之天
  alternative: 最高的天
  rationale: 直译保存原文独特的最高级结构和末世异象意象，不在正文中将其平滑处理。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。日期结构略作汉语化调整；“诸天之天”与层叠数目用语则刻意保留启示文学的宏阔感和原文修辞。
