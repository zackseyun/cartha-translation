base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/002.yaml
  text: And the Head of Days was sitting on the throne of his glory[a], and the angels and the righteous were standing around him.
translation:
  language: zh_hans
  text: 岁月之首[a]坐在他荣耀的宝座上，众天使和义人都站在他周围。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亘古常在者”。吉兹语这一称号在正文中较按字面译作“岁月之首”，以保留本段自身的措辞，而不直接套用《但以理书》中人们熟悉的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: 岁月之首
  rationale: 按字面保留“首”与“岁月”的独特称号意象，不直接套用《但以理书》中更为人熟知的传统称呼；“岁月”在现代汉语中也比“日子之首”更像庄重称号。
- source_word: መንበረ ስብሐቲሁ
  choice: 他荣耀的宝座
  rationale: 既保留宝座和荣耀的具体意象，也采用自然、庄重的现代汉语结构。
- source_word: ይነብር
  choice: 坐在
  rationale: 异象中的语境描写登座的姿态；与后文“站在”相对，清楚保留场景构图。
- source_word: መላእክት
  choice: 众天使
  rationale: 在天上宫廷的启示文学语境中，指天使而非一般使者；“众”自然表达群体。
- source_word: ጻድቃን
  choice: 义人
  rationale: 指以公义为身份特征的一群人；“义人”是简明、庄重且通行的现代中文表达。
- source_word: አውዶ
  choice: 在他周围
  rationale: 表达环绕宝座上那一位的空间关系，并自然补明原文语境中的所指。
- source_word: ይቆውሙ
  choice: 站在
  rationale: 保留侍立者的姿态，并与“坐在”形成对应；“都”体现众天使和义人共同处于该状态。
theological_decisions:
- issue: 神圣称号 ርእሰ መዋዕል 与《但以理书》传统称谓的关系
  choice: 岁月之首
  alternative: 亘古常在者；日子之首
  rationale: 正文采取较贴近吉兹语构词的译法，以保留《以诺一书》此处独特措辞，避免未经文本要求便与熟悉的《但以理书》用语完全协调；传统对应称谓留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的启示文学语体。“岁月之首”刻意保留陌生而凝练的称号感；其余句法力求自然，以“坐在……宝座上”与“站在他周围”呈现天上宫廷的静态场景。
