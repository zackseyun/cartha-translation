base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/012.yaml
  text: And the treasuries of the spirits[a], and how the spirits are divided, and how they are weighed out, and the portals of the spirits are reckoned, each according to the power of the spirit, and their powers for the light of the moon, and according to the power of righteousness[c][b], and the divisions of the stars by their names—every division shall be apportioned.
translation:
  language: zh_hans
  text: 灵的宝库，灵如何被分开、如何被称量，灵的门户如何被数算，各按灵的能力；以及它们与月光有关的能力，并按公义的能力；众星按各自名字的区分——每一部分都将被分配。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节在仅存的吉兹语见证中有若干分句在文本和句法上都很困难。“被称量”和“被数算”也可较宽泛地理解为“被衡量”和“被计算”。
    reason: textual_variant
  - marker: b
    text: “灵”也可译作“风”或“气息”；吉兹语原词兼有这些含义，本节可能有意让灵界力量与大气力量彼此重叠。
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: 宝库
  rationale: 表示储存之处或储备；“宝库”既保留启示文学的庄重感，也符合天上资源受储藏、管理的意象。
- source_word: መንፈሳት
  choice: 灵
  rationale: 该词也可指风或气息；正文译作“灵”，以保留宇宙力量与有灵存在之间的含混，不将其限定为普通气象现象。
- source_word: ወአፎ
  choice: 以及……怎样
  rationale: 此处አፎ是疑问副词“怎样”，并与后续分句构成一连串间接问句，不应理解为“云”。
- source_word: ይትካፈሉ
  choice: 被分开
  rationale: 保留被动或自反色彩，表达这些灵依照秩序被划分。
- source_word: ይደሉ
  choice: 被称量
  rationale: 词义和句法均较困难；“称量”保留精确衡量与分配的宇宙秩序意象，同时在脚注说明其他可能。
- source_word: ይኄለቁ
  choice: 被数算
  rationale: 表达计算、计数或核定；“数算”兼具自然可懂性和庄重语体。
- source_word: አናቅፅ
  choice: 门户
  rationale: 为“门、门户”的复数形式；在《以诺一书》的宇宙图景中，“门户”是关键空间意象，不宜译成“内室”。
- source_word: በበኀይለ መንፈስ
  choice: 按各灵的能力
  rationale: 重叠介词በበ具有逐一、分配性的意义，译作“按各……”，并保留መንፈስ可指灵或风的歧义。
- source_word: ለብርሃነ ወርኅ
  choice: 为月光
  rationale: 简洁呈现“为月亮的光”的属格关系，并保持宇宙论语境。
- source_word: ኀይለ ጽድቅ
  choice: 公义的能力
  rationale: “公义”保留神学和道德秩序的含义，也不排除正义、公正的层面。
- source_word: ክፍላተ ከዋክብት በበ ስሞሙ
  choice: 众星怎样按各自的名字被划分
  rationale: 呈现星辰依各自名称分类、划分的秩序；加入“各自”反映分配结构。
- source_word: ኵሉ ክፍለ ይትከፈል
  choice: 每一部分都要被分配
  rationale: 保留全称与被动结构，并与全节反复出现的划分、配置主题呼应。
theological_decisions:
- issue: መንፈሳት应译作“灵”还是“风”
  choice: 灵
  alternative: 风；气息
  rationale: 启示文学语境有意使自然力量带有灵界或人格化色彩；“灵”更能保留这种张力，脚注则提示气象性的可能。
- issue: ጽድቅ应译作“公义”还是“正义”
  choice: 公义
  alternative: 正义；公正
  rationale: 此处涉及宇宙秩序而非单纯司法场景；“公义”保留较宽广的神学内涵，也容纳正当秩序之意。
- issue: “月光的能力”与“公义的能力”之间的句法关系
  choice: 维持并列而不补出明确施事或因果关系
  alternative: 把二者解释为灵之能力的具体来源或用途
  rationale: 原文连接关系紧密但句法晦涩；不宜通过增译把其中的宇宙论关系确定化。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留原文长串并列与间接问句的异象式节奏，但用分号划分层次。正文不采用旧译所误读的“云”，并将አናቅፅ准确译为“门户”。所有脚注标记均置于正文末尾相应于整节难点的位置。
