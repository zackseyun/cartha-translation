base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/008.yaml
  text: And the name of the male was Behemoth[a], who occupies with his breast an unseen wilderness named Dundayin, east of the garden, where the chosen and the righteous dwell, where my great-grandfather was taken up, the seventh from Adam[e][d][c][b], the first of men whom the Lord of Spirits made.
translation:
  language: zh_hans
  text: 第二个名叫贝希摩斯[d]；它用胸膛占据一片看不见的荒野[a]，名叫顿达因，位于园子的东边[b]。蒙拣选者和义人住在那里；我的曾祖父在那里被接去。他是从亚当数起的第七位[c]；亚当是诸灵之主所造的第一人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看不见的荒野”也可理解为“隐藏的荒野”或“难以到达的荒野”；原文的确切语感不完全确定。
    reason: textual_variant
  - marker: b
    text: 原文直译为“园子”，这里没有明确写“伊甸”。
    reason: lexical_alternative
  - marker: c
    text: “从亚当数起的第七位”指以诺。本段第一人称说话者是诺亚，故以诺被称为“我的曾祖父”。
    reason: cross_reference
  - marker: d
    text: 原文此处说“第二个”。结合上文两兽的对举，这第二个指贝希摩斯；有些译法据上下文称其为“雄兽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ለተ ባዕታይ
  choice: 那雄兽
  rationale: 结合上文雌性巨兽与本节贝希摩斯的对应关系，将 ባዕታይ 按“雄性”理解；补出“兽”以使现代汉语自然，但用脚注保留“第二个”的可能读法。
- source_word: ስሙ ብሔሞት
  choice: 名叫贝希摩斯
  rationale: 保留专名的音译，并采用自然的中文命名句式。
- source_word: ዘይአኅዝ
  choice: 占据
  rationale: 该动词有持有、占有或占据某处之意；此处描述空间位置，“占据”最合语境。
- source_word: በእንግ ድዓሁ
  choice: 用胸膛
  rationale: 保留原文具体而奇异的身体意象，不泛化为“身体”。
- source_word: በበድው ዘኢያስተርኢ
  choice: 一片看不见的荒野
  rationale: ዘኢያስተርኢ 字面指“不被看见／不可见”；正文保留这一异象性描述，并在脚注说明也可能含隐藏或难以到达之意。
- source_word: ዱንዳይን
  choice: 顿达因
  rationale: 作为地名音译，不赋予未经证实的词义。
- source_word: በምሥራቀ ገነት
  choice: 位于园子的东边
  rationale: ገነት 直译为“园子”；不径自具体化为“伊甸园”。
- source_word: በኀበ ይነብሩ ኅሩያን ወጻድቃን
  choice: 蒙拣选的人和义人住在那里
  rationale: 分别保留末世文学中的“蒙拣选者”和“义人”两个群体称谓。
- source_word: ተመጠወ
  choice: 被接去
  rationale: 表达从世间被移走、被带走的意思，同时保留被动和超自然语气，不采用宗派性的专门术语。
- source_word: እምኄውየ
  choice: 我的曾祖父
  rationale: 依本段叙述者与以诺的家谱关系采用具体亲属称谓；脚注说明这里所指为以诺。
- source_word: ሳብዕ እምአዳም
  choice: 从亚当数起的第七位
  rationale: 按家谱次序直译，既清楚又保留传统表述。
- source_word: ቀዳሚሆሙ ለሰብእ ዘገብረ እግዚአ መናፍስት
  choice: 亚当是诸灵之主所造的人中第一位
  rationale: 该短语在句法和常识上说明亚当是最先受造的人；中文明确补出“亚当”，避免误读为以诺是第一个受造的人。
theological_decisions:
- issue: “从亚当数起的第七位”所指为何人
  choice: 指被接去的以诺
  alternative: 把相邻短语宽泛地理解为另一位祖先，或不明确其身份
  rationale: 以诺在家谱中通常被称为从亚当数起第七位；正文按这一局部语境翻译，脚注仅作身份说明，不引入额外教义。
- issue: “所造的人中第一位”修饰谁
  choice: 指亚当
  alternative: 形式上紧接前文而误读为指被接去的祖先以诺
  rationale: 原文的连续同位结构容易产生表面歧义，但“第一位受造的人”自然指亚当；用分号和补名使中文可读，同时不扩展其神学含义。
- issue: 荒野是否“不可见”
  choice: 正文作“看不见的荒野”
  alternative: 荒凉的荒野；无法进入的荒野；隐秘的荒野
  rationale: 原词组明确含否定和显现／可见语义；保留“看不见”最贴近原文，其他可能语感列入脚注。
- issue: “园子”是否就是伊甸园
  choice: 仅译“园子”
  alternative: 伊甸园；乐园
  rationale: 原文没有在此明确出现“伊甸”之名，故不把可能的指涉直接写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“用胸膛占据”“看不见的荒野”等启示文学的奇异意象；专名按音译处理。通过分句厘清复杂家谱关系，但对“园子”的身份和荒野形容词的语义范围保持克制，并以脚注保存歧义。
