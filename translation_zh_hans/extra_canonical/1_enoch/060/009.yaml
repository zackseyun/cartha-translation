base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/009.yaml
  text: And I asked another angel that he should show me the power of those monsters[a], how they were separated on one day and were cast[d][c][b], one into the depths of the sea and one onto the dry land of the wilderness.
translation:
  language: zh_hans
  text: 我问另一位天使，请他向我展示那些巨兽[a]的威力[b]，以及它们如何在同一天被分开，又如何被抛掷：一只被投进海的深处，另一只被投到旷野的干地上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 上下文更具体地说明了这两只宇宙巨兽的身份，但本节本身只称它们为“那些巨兽”。
    reason: cross_reference
  - marker: b
    text: 或译“力量”；此词的核心意思是能力或力量，在这里也可能包含这些生物所具有的强大特性或力量表现。
    reason: lexical_alternative
  - marker: c
    text: 末句措辞较难，原文似乎以海与干燥的旷野地带相对，较直译可作“在干地上，在荒野中”。
    reason: textual_difficulty
lexical_decisions:
- source_word: ተስእእክዎ
  choice: 我又问
  rationale: 该动词引出以诺向天使提出的请求；译作“问”自然直接，并以“又”承接叙事。
- source_word: ካልእ መልአክ
  choice: 另一位天使
  rationale: 忠实保留叙事中转向另一位天使向导的意思。
- source_word: ያርእየኒ
  choice: 请他让我看
  rationale: 表达请求的内容，同时保持汉语自然，不把它强化为命令。
- source_word: ኃይሎሙ
  choice: 威力
  rationale: 该词核心义为力量、能力；“威力”适合这些宇宙巨兽的语境，同时保留其可能指力量表现的幅度。
- source_word: እሉክ ዐናብርት
  choice: 那些巨兽
  rationale: 远指复数词应译为“那些”；“巨兽”既保留末世异象中庞大可畏的色彩，又比“怪物”略显庄重。
- source_word: ተሌለዩ
  choice: 被分开
  rationale: 保留被动意义，表明它们受到外在力量的分隔，而非自行分离。
- source_word: በአሐቲ ዕለት
  choice: 在同一天
  rationale: 直译为“一天”亦可；此处“同一天”清楚表达两兽在一个共同日期被分开的关系，而不进一步界定时间性质。
- source_word: ተወድዩ
  choice: 被抛下
  rationale: 该复数被动动词统摄两只巨兽，表示二者都被强力安置到各自所在之处。
- source_word: በልጕተ ባሕር
  choice: 进了海的深处
  rationale: 保留海中深处的空间意象，且不引入“无底坑”等后期技术性宇宙观术语。
- source_word: በየብስ በድው
  choice: 到了旷野的干地
  rationale: 同时呈现干地与荒野两个要素，并与海的深处形成鲜明对照。
theological_decisions:
- issue: 两只巨兽的身份
  choice: 正文仅称“那些巨兽”
  alternative: 依上下文直接写作“利维坦和贝希摩斯”
  rationale: 本节自身没有写出二者的名字；不把邻近经文的明确身份倒填进本节，以保留局部措辞。
- issue: 分开并被抛下的施事者
  choice: 保留无施事者的被动表达
  alternative: 明确写成“上帝把它们分开并抛下”
  rationale: 原文使用被动形式而未明说施事者；即使语境可能暗示神的安排，译文也不应擅自补明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用“一只……另一只……”明确复数动词分别落在两只巨兽身上；不在正文点名邻近经文中的专名，也不补出被动动作的施事者。
