base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/003.yaml
  text: And as for me[a], a great trembling seized me, and fear took hold of me; and my loins were broken, and my kidneys were loosened[d][c][b], and I fell on my face.
translation:
  language: zh_hans
  text: 至于我，一阵强烈的战栗攫住了我，恐惧也抓住了我；我的腰胯折断了，我的双肾也松弛了[a]；我就俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“我的双肾被解开（或松开）”。在古代闪语传统中的身体表达里，肾可以代表人的内在自我或深层情感；本句也可译作“我的内脏都松弛了”。
    reason: 文化说明与词义备选
lexical_decisions:
- source_word: ረዓድ ዐቢይ
  choice: 大战栗
  rationale: 保留ዐቢይ“大的、强烈的”与ረዓድ所表达的剧烈身体颤抖，不将其仅解释为心理上的“惊恐”。
- source_word: ነሥአኒ
  choice: 攫住了我
  rationale: 在“战栗”为主语的语境中，此处表示战栗突然临到并控制说话者；“攫住”保留其强烈而具体的动态。
- source_word: ፍርሃት አሐዘኒ
  choice: 恐惧也抓住了我
  rationale: 保留“恐惧抓住人”的具体拟人表达，而不弱化为普通的“我害怕了”。
- source_word: ሐቌየ ተቀጽዐ
  choice: 我的腰胯折损
  rationale: ሐቌየ指腰、胯一带，ተቀጽዐ有被折断、压碎或损坏之意。“折损”既反映被动破坏的力度，也避免现代汉语“腰胯折断”可能造成的纯骨骼医学化理解。
- source_word: ኵልያትየ ተፈትሑ
  choice: 双肾松弛
  rationale: ኵልያትየ明确指“我的肾”；ተፈትሑ含解开、松开之义。正文保留古代身体意象，并用脚注说明其文化含义及可译方式。
- source_word: ወወደቁ በገጽየ
  choice: 我便俯伏在地
  rationale: 结合全节第一人称反应序列，理解为以诺本人面朝下倒伏。“俯伏在地”自然表达脸朝地的倒下或伏地姿态。
theological_decisions:
- issue: 是否在正文保留“肾”这一古代身体—情感意象
  choice: 保留“双肾”
  alternative: 译作“内心”或“内脏”
  rationale: 原文使用具体的肾脏意象；直接换成“心”会把古代的人体观念现代化，并缩窄或改写原有图像。正文保留其陌生感，脚注辅助理解。
- issue: “双肾松弛”是生理描写还是内在恐惧的象征
  choice: 不在正文中作单一解释
  alternative: 明确意译为“我内心消融”
  rationale: 原文可同时唤起身体崩解与深层情绪失控的感受；译文保存这种张力，不替读者限定为纯生理或纯心理现象。
translation_notes:
  register: 采用现代、庄重而可懂的叙述语体。以“大战栗”“攫住”“俯伏”等词保留异象场景的强烈身体反应；不以“心都化了”等现代惯用语取代原文具体而陌生的身体意象。
