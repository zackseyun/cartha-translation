base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/017.yaml
  text: And the spirit of the hoarfrost is its own angel[c][b][a], and the spirit of the hail is a good angel.
translation:
  language: zh_hans
  text: 霜的灵就是霜的天使[a]；冰雹的灵则是一位良善的天使。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直地译作“霜的灵就是它的天使”。这里表达霜之灵与霜的天使相同，并非另指一位有名字的天使。
    reason: lexical_alternative
lexical_decisions:
- source_word: መንፈሰ
  choice: ……的灵
  rationale: 该词在两处引出人格化的气象力量；译作“灵”既贴近原文，也保留启示文学中的人格化意象。
- source_word: አስሐትያ
  choice: 霜
  rationale: 此词在这里是气象名词，指霜或白霜，并非天使的专名；“霜”是自然、易懂的现代汉语表达。
- source_word: መልአክ
  choice: 天使
  rationale: 本节描述超自然的气象管理者；“天使”比一般性的“使者”更符合上下文。
- source_word: ዚአሁ ውእቱ
  choice: 就是它自己的
  rationale: 该短语字面上含“它的……是”之意；结合“天使”译为“就是它自己的天使”，保留霜之灵与其天使相等同的表述，而不改写成命名公式。
- source_word: በረድ
  choice: 冰雹
  rationale: 采用该词通常的气象意义，与本段列举各种自然现象的语境一致。
- source_word: ኄር
  choice: 善良的
  rationale: 这是意为“好、善”的形容词，并非专名；“善良的天使”直接传达其修饰关系。
theological_decisions:
- issue: 霜的灵与其天使之间是同一关系，还是天使被另行命名
  choice: 译为“霜的灵就是它自己的天使”
  alternative: “霜的灵有它自己的天使”或把相关词音译为天使名
  rationale: 原文的系词结构表达“是”，并未说“有”或“名叫”；这样翻译保留灵与天使相等同的张力，不另行补入命名观念。
- issue: ኄር 是性质描述还是天使专名
  choice: 理解为形容词“善良的”
  alternative: 音译为专名“赫尔”
  rationale: 该词是常见的“好、善”之义，句法上修饰“天使”；译作性质描述避免凭空创造专名。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“霜”“冰雹”便于一般读者理解；保留“灵就是……天使”的不寻常结构，以免消解原文的启示文学张力。
