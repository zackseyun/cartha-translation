base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/004.yaml
  text: And Michael sent another angel from among the holy ones[a], and he lifted me up. And when he lifted me up, my spirit entered in[c][b], for I was not able to endure the sight of that power and its shaking and the quaking of heaven.
translation:
  language: zh_hans
  text: 米迦勒从众圣者中差遣了另一位天使；他把我扶起来。他把我扶起来时，我的灵便回来了[a]，因为我承受不住那大能的景象、它的震荡和天的震颤[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“我的灵回来了”；也可理解为“我恢复了知觉”。
    reason: lexical_alternative
  - marker: b
    text: 原文结构紧凑；也可译作：“因为我承受不住看见那大能，也承受不住它的震荡和天的震颤。”
    reason: alternative_reading
lexical_decisions:
- source_word: ፈነወ
  choice: 差来
  rationale: 该动词表示差遣；结合米迦勒差遣天使到以诺身边的叙事视角，“差来”自然简洁。
- source_word: ካልአ መልአከ
  choice: 另一位天使
  rationale: 表示有别于米迦勒的另一位天使；不必限定为按次序的“第二位”。
- source_word: እምቅዱሳን
  choice: 从众圣者中
  rationale: 保留“从一群圣者当中”的来源关系；在本段天上异象语境中，所指自然是天上的圣者，而非后世术语意义上的人间圣徒。
- source_word: አንሥአኒ
  choice: 把我扶起来
  rationale: 该词表示使人起来或抬起；上文语境涉及以诺倒下后被扶起，“扶起来”比单纯的“举起”更符合叙事，同时保留身体动作。
- source_word: መንፈስየ ገብአት
  choice: 我的灵便回来了
  rationale: ገብአ 的基本义为“返回、回来”，此处可自然表示以诺被扶起后恢复过来；“灵回来”保留原文表达，不进一步释为“恢复意识”。
- source_word: ኢክህልኩ ተዓግሦ
  choice: 我承受不住
  rationale: 准确表达无力忍受或承受，且符合现代汉语叙述。
- source_word: ራእየ ዝኩ ኃይል
  choice: 那大能显现时
  rationale: ራእየ 涉及所见或显现，ኃይል 表示力量、大能；此译避免把抽象的“大能”直接说成可见物，同时不明确其主体。
- source_word: ሀውከ
  choice: 震荡
  rationale: 该词可指扰动、骚乱或震动；与随后的天之震颤相连时，“震荡”兼顾物理震动与剧烈扰动。
- source_word: አንቀልቅለ ሰማይ
  choice: 天的震颤
  rationale: 保留宇宙性动荡的启示文学意象，表达庄重而易懂。
theological_decisions:
- issue: “众圣者”的身份
  choice: 保留“众圣者”，由语境指向天上的圣者群体
  alternative: 译为“众天使”或“圣徒”
  rationale: 原文称其为“圣者”，虽语境很可能指天上存在，却不宜直接把上位概念缩窄为“天使”，也应避免“圣徒”带来的后期教会术语联想。
- issue: “我的灵回来了”的含义
  choice: 按 ገብአ 的“回来”义直译，并保留“灵”的说法
  alternative: “我苏醒过来”或“我的灵进入了”
  rationale: “回来”有较强词汇依据，也契合从昏倒状态恢复的上下文；但正文不把它完全解释为生理或意识层面的苏醒。“进入”容易混同另一表示“进入”的动词。
- issue: “大能”的所指
  choice: 不指明其属于谁，也不将其人格化
  alternative: “那位大能者”或“上帝的大能”
  rationale: 原文结构压缩且所指未完全明说；保留“大能”的开放性，避免加入原文没有明示的神学归属。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“众圣者”“大能”等保留启示文学色彩；避免用“圣徒”及明确的宗派性解释。正文中的两个脚注标记均与脚注对应。
