  to: 雾气的灵不与它们一同相连，在它们的库房里；它自己的库房却是独自分开的。因为它的运行在那里满有荣光：无论在光明中，还是在黑暗中；无论在冬季，还是在夏季，都是如此；它的库房是一位天使。[a]
  rationale: 修订以“相连”对应“被联合”，避免“聚在”的额外动作含义；重组第二分句，明确“独自分开”修饰库房；以“在那里满有荣光”较自然地保留原文处所性。末句的突兀认同表达、雾气人格化、库房意象和冬夏对举均予保留。
