    rationale: 可用“它的运行在那里满有荣光”保留ቦ的处所性而使汉语更通顺。
  - severity: low
    issue: 脚注的“相认同”不自然。
    rationale: 现代标准汉语宜说“被视为与……相同一”，同时须继续说明原文未明说是天使看守。
