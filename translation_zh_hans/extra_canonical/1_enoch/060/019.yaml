base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/019.yaml
  text: And the spirit of the mist is not joined with them in their storehouses[a], but its own storehouse is by itself; for its course is glorious in it, both in light and in darkness, and in winter and in summer[c][b], and its storehouse is an angel.
translation:
  language: zh_hans
  text: 雾气的灵不与它们一同相连，在它们的库房里；它自己的库房却是独自分开的。因为它的运行在那里满有荣光：无论在光明中，还是在黑暗中；无论在冬季，还是在夏季，都是如此；它的库房是一位天使。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句含义难解。吉兹语直译为“它的库房是一位天使”，可能是指某位天使被视为与雾气的指定库房相同一，或亲自充当其库房；原文并未明说只是由天使看守。
    reason: textual_difficulty
lexical_decisions:
- source_word: መንፈሰ፡ ጊሜ
  choice: 雾气的灵
  rationale: መንፈስ可指“灵、风、气息”，而ጊሜ在此指雾或雾气。保留“灵”可呈现本段启示文学中的宇宙人格化意象，不将其简化为普通气象现象。
- source_word: ኢይትኃበር፡ ምስሌሆሙ፡ ውስተ፡ መዛግብቲሆሙ
  choice: 不与它们一同聚在它们的库房里
  rationale: 动词表示联合、聚合；ምስሌሆሙ与ውስተ መዛግብቲሆሙ分别对应“与它们一同”和“在它们的库房里”，两层关系均予保留。
- source_word: መዝገበ፡ ቦቱ፡ ባሕቲቱ
  choice: 它有自己的库房，独自分开
  rationale: 以自然中文表达其另有库房且独立分开的强调意味；“自己的”和“独自分开”共同传达ባሕቲቱ所突出的分离性。
- source_word: ምሕዋረ፡ ዚአሁ፡ ስብሐት፡ ቦ
  choice: 它的运行在其中大有荣光
  rationale: ምሕዋር指行程、运行或轨迹；ስብሐት表示荣光、辉煌，ቦ保留为处所性的“在其中”。
- source_word: በብርሃን፡ ወበጽልመት፡ ወበክረምት፡ ወበንጋይ
  choice: 无论在光明中、黑暗中，冬季或夏季
  rationale: 前三项分别为光明、黑暗和冬季。末词据可靠校勘视为ሐጋይ“夏季”的讹写，与“冬季”构成惯常对举。
- source_word: መዝገበ፡ ዚአሃ፡ መልአክ፡ ውእቱ
  choice: 它的库房是一位天使
  rationale: 按现存吉兹语句法直译这句突兀的认同表达，不擅自改成“由天使看守”或“有天使掌管”。
theological_decisions:
- issue: 是否将“雾气的灵”去人格化为自然力量
  choice: 保留“雾气的灵”这一人格化宇宙实体
  alternative: 雾气之风／雾气的力量
  rationale: 上下文涉及宇宙库房和天使性管理，保留“灵”更忠实于启示文学的世界图景，也避免以现代自然主义解释取代原文。
- issue: 如何处理“它的库房是一位天使”这一困难末句
  choice: 在正文保留直接认同式表达，并加注说明
  alternative: 它的库房由一位天使看守／一位天使掌管它的库房
  rationale: 原文最直接的句法确实将库房与天使相认同。解释性改写虽较顺畅，却会消除原文真实存在的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“库房”保留启示文学中储藏自然力量的具体宇宙意象；以分号和短句呈现原文层层递进的结构。正文仅在确有文本困难的末句加注，且脚注标记[a]已在正文出现。
