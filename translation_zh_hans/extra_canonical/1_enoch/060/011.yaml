base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/011.yaml
  text: And another angel[a], who went with me and showed me what is hidden, told me what is first and what is last in heaven, in the height, and beneath the earth in the depth, and at the ends of heaven[c][b], and at the foundations of heaven.
translation:
  language: zh_hans
  text: 另有一位天使，就是那与我同行、把隐秘之事[b]指给我看的，向我讲述了在天上、高处、地下深处、天之尽头和天之根基处最先和最后的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最先和最后的事”也可译作“最先与最后”。这里按上下文理解为天使所揭示之事的范围，而不把它译成称号。
    reason: lexical_alternative
  - marker: b
    text: 现存转写在“隐秘之事”和“地”两处可能有讹误；本译文依校订所恢复的读法，译作“隐秘之事”及“地下深处”。
    reason: textual_variant
lexical_decisions:
- source_word: ወይቤለኒ
  choice: 对我讲述了
  rationale: 这是全句的主要言说动词，并统摄后面的“最先和最后的事”；译为“讲述了”比单纯“说”更能在中文中清楚表达其宾语关系。
- source_word: መልአክ ካልእ
  choice: 另有一位天使
  rationale: ካልእ 表示另一位、另外一位，并不必然表示次序上的“第二位”。
- source_word: ዘምስሌየ የሐውር
  choice: 那与我同行
  rationale: 保留陪伴及行进的含义，同时符合现代汉语叙事习惯。
- source_word: ወዘኅቡእ ያርእየኒ（据校订恢复）
  choice: 把隐秘之事指给我看
  rationale: 依最新校订，此处传抄文本的 ወዘበኀቤኡ 应恢复为表示“隐秘之事”的词组；“指给我看”保留使先见者看见的启示功能。
- source_word: ቀዳሜ ወድኃሬ
  choice: 最先和最后的事
  rationale: 在本节宇宙范围的列举中作描述性表达，不将其处理为神圣称号；同时保留“最先/最后”可能兼有界限与总体性的含义。
- source_word: በሰማየ
  choice: 天上
  rationale: 按处所义翻译；单数的宇宙空间意象在汉语中自然表达为“天上”。
- source_word: በውስተ ላዕሉ
  choice: 高处
  rationale: 保留上方宇宙区域的空间意象及庄重语体。
- source_word: ወበታሕተ ምድር በመዓምቅ（据校订恢复）
  choice: 地下深处
  rationale: 依最新校订，将疑似讹误的 ደብለ 恢复为 ምድር“地”；中文合译为“地下深处”，清楚保留“地之下”与“深处”两层空间信息。
- source_word: በአጽናፈ ሰማይ
  choice: 天之尽头
  rationale: 保留天穹边际或极处的古代宇宙图景，用语自然而庄重。
- source_word: በመሠረተ ሰማይ
  choice: 天之根基
  rationale: 直译其宇宙建筑意象，不将它抽象化或现代化。
theological_decisions:
- issue: ቀዳሜ ወድኃሬ 是否应译成称号性的“首先者和末后者”
  choice: 最先和最后的事
  alternative: 首先者和末后者；最先与最后
  rationale: 上下文是在列举天、地深处、天之尽头与根基等受启示的范围，并未明确构成神的自称；描述性译法既贴合句法，也避免引入后期称号用法。
- issue: 宇宙空间术语应否按现代宇宙观解释
  choice: 保留“天之尽头”“天之根基”等具象说法
  alternative: 宇宙边界；天空的底部
  rationale: 这些表达属于启示文学的古代宇宙图景；直保意象可避免以现代科学概念消解原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“另有一位天使”保持异象叙事风格；通过“也就是”整理原文密集的空间列举，使主句结构清晰，同时保留“天之尽头”“天之根基”等启示文学意象。
