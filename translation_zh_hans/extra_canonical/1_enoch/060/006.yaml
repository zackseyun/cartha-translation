base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/006.yaml
  text: And when the day and the power and the punishment and the judgment come, which the Lord of Spirits has prepared for those who do not bow down to the righteous law, and for those who deny the righteous judgment, and for those who take his name in vain—that day has been prepared for the chosen as a covenant, and for sinners as an inquiry.
translation:
  language: zh_hans
  text: 当那日子、权能、刑罚和审判来到时——万灵之主已为那些不向公义之主下拜的人、那些否认公义之主的人，以及那些妄称他名的人预备了这一切——那日子也已预备好：为蒙拣选的人作誓约[a]，为罪人作追究[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓约”也可译作“誓言”或“盟约”。
    reason: 原词መሐላ的语义范围包括誓言以及由誓言确立的约。
  - marker: b
    text: “追究”也可译作“查问”或“审查”。
    reason: 原词ሐተታ既可表示询查，也可在审判语境中带有问责意味。
lexical_decisions:
- source_word: እግዚአ፡ መንፈሳት
  choice: 万灵之主
  rationale: 按构词直译为“诸灵之主”，采用较自然庄重且能涵盖复数含义的“万灵之主”。
- source_word: እግዚ፡ ጽድቅ
  choice: 公义之主
  rationale: 原文表层最自然地读作“公义之主”。英语咨询文本分别译作“公义之律”和“公义的审判”，但这种区分在现有吉兹语文本中不明显，故不据此改写。
- source_word: ይሰግዱ
  choice: 下拜
  rationale: 保留俯伏、敬拜的具体动作，不弱化为一般性的“遵守”。
- source_word: ይነሥኡ፡ ስሞ፡ በከ
  choice: 妄称他名
  rationale: 该短语涉及“取用/举起他的名”及方式上的虚妄，汉语“妄称他名”简洁保留宗教和司法语感。
- source_word: መሐላ
  choice: 誓约
  rationale: 该词首先有“誓言、起誓”之意；“誓约”兼顾其盟约性，又避免直接把词义收窄为制度化的“约”。
- source_word: ሐተታ
  choice: 追究
  rationale: 该词可指查问、审查或追究；上下文关乎审判与罪人，选“追究”兼具调查和问责意味，同时不直接等同于定罪。
theological_decisions:
- issue: “እግዚ፡ ጽድቅ”的所指
  choice: 两处均译“公义之主”
  alternative: 分别译为“公义之律”和“公义的审判”
  rationale: 依现有原文证据优先保持相同短语的一致性；不以神学协调或英语修订层替原文制造两个不同宾语。
- issue: 蒙拣选者所得之“መሐላ”
  choice: 誓约
  alternative: 盟约／誓言
  rationale: 保留“誓言”与“盟约”之间的语义张力，不明确指定立约双方或具体盟约制度。
- issue: 罪人所受之“ሐተታ”
  choice: 追究
  alternative: 查问／审讯／审判
  rationale: 避免把尚可理解为调查、查问的词直接强化为终局审判，同时维持本节明显的司法色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以破折号标明长句中修饰关系，保留“日子、权能、刑罚和审判”并列而不擅自合并；“蒙拣选的人”延续宗教文献中通行且普通读者可理解的表达。
