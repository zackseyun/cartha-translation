base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/015.yaml
  text: For when the lightning flashes[a], the thunder gives its voice, and the spirit rests at its appointed time, and it divides equally among them; for the treasury of their times is of sand, and the two of them are restrained with a bridle and turned back by the power of the spirit[d][c][b], and they are driven on likewise according to the many regions of the earth.
translation:
  language: zh_hans
  text: 因为闪电一闪，雷霆便发出声音；灵[a]在它的时候止息，并在它们中间均等地分配[b]。因为它们时辰的宝库乃是沙[c]；二者都被缰绳勒住，又凭着灵的力量而被转回；它们也同样按着大地的许多区域被驱赶向前[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“风”或“气息”；本节处于风暴景象之中，原词兼有这些含义。本节后文的“灵”同样如此。
    reason: lexical_alternative
  - marker: b
    text: 这一分句的确切句法不明；也可较谨慎地译作“并在它们中间分配”。
    reason: alternative_reading
  - marker: c
    text: 直译为“它们时辰的宝库乃是沙”。这幅图像的含义不明，但原词是“沙”，不宜改译为“固定的”或“已经定准”。
    reason: textual_difficulty
  - marker: d
    text: 末句的表达较难；“大地的许多区域”也可理解为大地的许多方域。
    reason: textual_difficulty
lexical_decisions:
- source_word: ይበርቅ መብረቅ
  choice: 闪电一闪
  rationale: 保留同根动词与名词形成的鲜明动态意象，同时使用自然的现代汉语表达。
- source_word: ነጐድጓድ ቃሎ ይሁብ
  choice: 雷霆便发出声音
  rationale: 保留原文“雷霆给出其声音”的拟人化表达，而不简化为“打雷”。
- source_word: መንፈስ
  choice: 灵
  rationale: 该词可指灵、风或气息；主文选“灵”以保留其施动性及启示文学色彩，同时在脚注注明气象语境中的“风”义。
- source_word: በጊዜሃ ያዐርፍ
  choice: 到了它的时候就止息
  rationale: 贴近“在它的时候止息”，避免用“指定”过度明说时间由谁设定。
- source_word: ዐሩየ ይከፍል ማእከሎሙ
  choice: 在它们中间均等分配
  rationale: 保留分配及均等的可能含义；因句法与修饰语义不完全确定，另在脚注列出较谨慎的译法。
- source_word: መዝገበ ጊዜያቲሆሙ ዘኆጻ ውእቱ
  choice: 它们时辰的宝库是沙的
  rationale: 按词面保留“宝库”“时辰”和“沙”的具体意象，不沿用把ዘኆጻ误解为“固定”的旧译。
- source_word: ፪፪እምኔሆሙ በአጓም ይትነኃዙ
  choice: 二者都被缰绳勒住
  rationale: 表达二者受缰绳约束的图像，并保留二者这一数量信息。
- source_word: ወይትመየጡ በኃይለ መንፈስ
  choice: 又因灵的力量而转回
  rationale: 准确表达被转回及其动力来源；“灵”与本节前一处保持一致。
- source_word: ወይትነጸኡ
  choice: 被驱赶向前
  rationale: 该词在此表示驱动或推进，不取形近词所可能产生的“洁净”义。
- source_word: ብዙኃ አድዋስ ምድር
  choice: 大地的许多区域
  rationale: አድዋስ在此宜指区域或方域，不译为“居所”。
theological_decisions:
- issue: መንፈስ应译为气象性的“风”还是较广义的“灵”
  choice: 灵
  alternative: 风；气息
  rationale: 上下文属于风暴与宇宙秩序的描写，故“风”确有根据；但该词在本句中具有止息、分配和施展力量的能动性。主文采用“灵”，脚注保留“风”，不消解原文的多义张力。
- issue: 是否把时辰解释为由上帝预定
  choice: 译作“到了它的时候”
  alternative: 到了指定的时候
  rationale: 原文表达所属的时间，却未在本句明确指出设定者；因此避免在主文中补入更明确的神学因果。
- issue: “宝库是沙的”是否应解释为时辰被固定或可数
  choice: 保留沙的意象
  alternative: 它们的时辰已经定准
  rationale: 源词支持“沙”，不宜以宇宙秩序的神学概念改写难句；其可能寓意留给读者，不在译文中确定。
translation_notes:
  register: 采用庄重而可读的现代标准汉语，保留雷霆发声、时辰之宝库、缰绳约束等启示文学意象。对源文中的含混句法和气象—属灵双关不作武断解释；分号用于呈现原句连续而层叠的结构。
