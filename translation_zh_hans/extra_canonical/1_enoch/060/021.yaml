base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/021.yaml
  text: And when the spirit of the rain is stirred from its storehouse[a], the angels come and open the storehouse and bring it out. And when it is scattered upon all the dry ground, it is joined with the water that is upon the dry ground; and whenever it is joined with the water upon the dry ground . [d][c][b]. .
translation:
  language: zh_hans
  text: 当雨的灵从它的库房中被激起时，天使就来打开库房，把它带出来。它被撒在所有旱地上时，就与旱地上的水汇合；每当它与旱地上的水汇合时……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹文重复了“与旱地上的水汇合”的短语；末句未完，且含义较难。它也可能表示：雨与旱地上的水汇合后，便一直留在那里。
    reason: textual_variant
lexical_decisions:
- source_word: መንፈሱ ለዝናም
  choice: 雨的灵
  rationale: 保留መንፈስ可指“灵、风、气息”的多义性，并忠实呈现本段将自然现象人格化的启示文学图景，不将其简化为普通气象用语。
- source_word: ይትኃወስ
  choice: 被搅动
  rationale: 表达原词所含的移动、扰动或发动之意，也与雨的灵从天上库房开始活动的意象相称。
- source_word: መዝገበ
  choice: 库房
  rationale: 保留储藏自然力量之天上仓库的具体意象；现代汉语自然易懂。
- source_word: ይመጽኡ መላእክት
  choice: 天使就来
  rationale: 保留原文明确的天使主体及其管理库房的行动。
- source_word: ያርኅዉ
  choice: 打开
  rationale: 准确表达开启库房，不增添原文没有明说的“解锁”等细节。
- source_word: ያወጽእዎ
  choice: 把它带出来
  rationale: 体现使役意味，同时在汉语中自然地指向从库房释放出来的雨之灵。
- source_word: ይዘራእ
  choice: 散布
  rationale: 原词基本意象是播撒、撒开；“散布”既保留其分散性，也适合雨遍及旱地的语境。
- source_word: የብስ
  choice: 旱地
  rationale: 突出与水相对的干地，较“地面”更能保存原文对比。
- source_word: ይትኃበር ምስለ ማይ
  choice: 与……水汇合
  rationale: 自然表达被动或反身的结合、混合过程，不具体断定其物理机制。
- source_word: በኵሉ ጊዜ
  choice: 时时
  rationale: 简洁表达“在一切时候、持续地”的时间含义，并保持庄重流畅。
theological_decisions:
- issue: 是否把雨的作用去人格化为普通天气现象
  choice: 保留“雨的灵”以及天使开启库房、将其带出的叙述
  alternative: 译作“雨云从蓄水处释放”或“雨从库房降下”
  rationale: 原文呈现由天上力量与天使管理自然现象的启示文学宇宙观；译文应保存这一张力，而不以现代气象解释取代它。
- issue: 末句重复及其意义
  choice: 按现存吉兹文保留汇合之句的重复，并将በኵሉ ጊዜ直译为“时时”
  alternative: 理解为雨与地表水汇合后“始终留在那里”
  rationale: 原文确实重复“与旱地上的水汇合”的结构；不在正文中补入并未明说的“停留”，将另一种可能解释置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留启示文学中的“雨的灵”“库房”和天使管理自然力量等具体意象；末句虽在汉语中略显重复，仍依原文保留，并用脚注说明其不确定性。
