base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/005.yaml
  text: And Michael said to me[a], “Why are you troubled by such a vision? Until today the day of his mercy has lasted[c][b], and he has been merciful and slow to wrath toward those who dwell upon the dry land.”
translation:
  language: zh_hans
  text: 米迦勒对我说：“你为什么因这样的异象而不安？直到今日，他施怜悯的日子仍在延续；他一直怜悯那些住在旱地上的，并且不轻易发怒。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不轻易发怒”直译可作“远离愤怒”。“旱地”在本章语境中可能特指陆地，与周围的海洋意象形成对照。
    reason: lexical_and_contextual_note
lexical_decisions:
- source_word: ወይቤለኒ፡ ሚካኤል
  choice: 米迦勒对我说
  rationale: 按叙事引语自然表达，并音译人名。
- source_word: ምንተ፡ ርእየ፡ ዘከመዝ፡ ተሀውከ
  choice: 你为什么因这样的异象而不安
  rationale: 将ርእየ识别为“异象”的宾格形式，而非“你看见”的动词；以现代汉语表达其因异象而受扰的问句。
- source_word: እስከ፡ ዮም፡ ሀለወት፡ ዕለተ፡ ምሕረቱ
  choice: 直到今日，他施怜悯的日子仍在延续
  rationale: 保留“日子”、第三人称领属关系及持续至今的时间意味。
- source_word: ወሀሎ፡ መሓሪ
  choice: 他一直怜悯
  rationale: 表现持续的怜悯行动，并与前句的时间延续相呼应。
- source_word: ወርኁቀ፡ መዓት
  choice: 并且不轻易发怒
  rationale: 原文直义近于“远离愤怒”；采用自然而庄重的汉语习语，同时在脚注保留直译可能。
- source_word: ላዕለ፡ እለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: 那些住在旱地上的
  rationale: 保留የብስ较具体的“旱地”含义，以维持本章陆地与海洋意象的对照。
theological_decisions:
- issue: “他的怜悯”中代词的指称
  choice: 在汉语中译作“他施怜悯的日子”，保留未在本节重新点名的男性单数主体
  alternative: 译作不带领属关系的“怜悯之日”
  rationale: 原文具有第三人称领属成分；上下文指向上帝，但正文不擅自补出“上帝”，从而保留原文的隐含指称。
- issue: 怜悯与忿怒之间的张力
  choice: 并列保留持续施怜悯与不轻易发怒
  alternative: 解释为审判已被取消或仅仅延期
  rationale: 原文同时陈述怜悯和与忿怒保持距离，不应进一步系统化为某种特定的审判理论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。问句依据最新语法复核，将ርእየ译为名词“异象”。“旱地”虽不如“地上”常见，却更准确地保存本章的具体空间对照。
