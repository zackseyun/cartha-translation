  text: And he said to me[a], “You, son of man[c][b], here you desire to understand what is hidden.”
translation:
  language: zh_hans
  text: 他对我说：“你，人子啊，在这里想要明白隐藏的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤለኒ
  choice: 他对我说
  rationale: 这是吉兹语常见的叙事引语格式；译作“他对我说”自然、庄重，并保留直接对话的场景。
- source_word: አንተ
  choice: 你这
  rationale: 独立的第二人称代词带有强调作用；与后面的称呼合译为“你这人子”，可在现代汉语中体现直呼和强调。
- source_word: ወልደ ሰብእ
  choice: 人子
  rationale: 直译保留闪语式表达和启示文学语域；本节中它是对见异象者的称呼，不必然指《比喻篇》别处那位崇高的“人子”。
- source_word: በዝየ
  choice: 在这里
  rationale: 保留原文的指示和地点意味，也可能关联眼前的异象处境。
- source_word: ትፈቅድ
  choice: 想要
  rationale: 原词表达意愿或愿望；“想要”是自然的现代汉语，又不把它狭义理解为许可。
- source_word: ታእምር
  choice: 明白
  rationale: 这里侧重对启示内容的认知和领会；“明白”比单纯的“知道”更能体现这一点。
- source_word: ዘኅቡእ
  choice: 那隐藏的事
  rationale: 保留所指内容被遮蔽、隐而未显的含义，同时避免直接采用可能带有技术性神学意味的“奥秘”。
theological_decisions:
- issue: 《比喻篇》中ወልደ ሰብእ的译法
  choice: 人子
  alternative: 凡人；世人之子
  rationale: 本节该词组用于称呼以诺，而非必然作为崇高人物的专称。保留“人子”可维持原文措辞及其神学张力，再由语境和脚注说明其功能，而不在正文中预先消解歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。通过“你这人子……你想要……”的结构尽量保留原文独立代词所带的强调；不使用过度古雅的“汝”或“隐藏之物”。
