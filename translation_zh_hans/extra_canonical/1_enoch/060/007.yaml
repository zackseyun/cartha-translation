base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/007.yaml
  text: 'And on that day the two monsters were separated[a]: a female monster whose name is Lewyatan, to dwell in the abyss of the sea[d][c][b], above the springs of the waters.'
translation:
  language: zh_hans
  text: 在那一天，两个巨兽被分开了：其中一个是雌性巨兽，名叫利维亚坦[a]，住在海的深渊里[b]，位于众水的泉源之上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利维亚坦”对应吉兹语音形“莱瓦亚坦”（ሌዋያታን），即通常所称的“利维坦”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“海的深处”。原词指深处或深渊般的区域。
    reason: lexical_alternative
  - marker: c
    text: 这里按原文保留“众水的泉源”这一古代宇宙图景，描述她的居所与水源之间的位置关系，并非现代地理说明。
    reason: cultural_note
lexical_decisions:
- source_word: ተካፈሉ
  choice: 被分开了
  rationale: 该词是第三人称复数完成式，表示已经发生的分离；用“被分开了”保留其被动含义和过去时态，不改作将来事件。
- source_word: በይእቲ ዕለት
  choice: 在那一天
  rationale: 这是启示文学常见的时间表达；“在那一天”既自然，也保留庄重的预言语体。
- source_word: ክልኤቱ ዐናብርት
  choice: 两个巨兽
  rationale: 语境所指并非普通野兽，而是具有宇宙性和神异色彩的巨大生物；“巨兽”既保留其异乎寻常的尺度，又避免“怪物”可能带来的贬义。
- source_word: ዐንበሪ አንስትያዊት
  choice: 其中一个是雌性巨兽
  rationale: 原文明确指出两个巨兽中的一个为雌性，并保留了表示巨兽的名词；中文加“其中一个”使同位结构清楚，同时不省略其类别。
- source_word: ዘስማ ሌዋያታን
  choice: 名叫利维亚坦
  rationale: 采用现代中文读者较熟悉的传统音译，同时以脚注说明该名对应原文形式，避免把专名意译或赋予额外教义含义。
- source_word: ከመ ትኅድር
  choice: 住在
  rationale: 该结构表达其被指定的居所或目的；“住在”是自然、庄重而不过分古雅的现代汉语。
- source_word: በልጕተ ባሕር
  choice: 在海的深渊里
  rationale: 名词表示深处或深渊区域；“海的深渊”保留启示文学的宇宙地理意象，也可理解为“海的深处”。
- source_word: መልዕልተ አነቅዕተ ማያት
  choice: 位于众水的泉源之上
  rationale: 直译其相对于众水泉源的位置，保留古代宇宙图景，不将其改写为现代地理描述。
theological_decisions:
- issue: 启示文学中神异生物称谓的处理
  choice: 巨兽
  alternative: 怪物；野兽；巨大生物
  rationale: “巨兽”能够传达其原始、宏大和超常的性质，同时避免把经文中的形象过度妖魔化，或淡化为普通动物。
- issue: 分离事件的时间指向
  choice: 被分开了
  alternative: 将被分开
  rationale: 吉兹语动词为完成式，正文据此呈现已发生的行动；不因“在那一天”的启示文学表达而擅自改成将来时。
- issue: 海的深渊与众水泉源的宇宙图景
  choice: 按空间关系直译
  alternative: 改写为现代海洋地理描述
  rationale: 原文保留古代宇宙观中的海渊和水源意象；翻译不判断其物理机制，也不将其寓意化。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“巨兽”保持启示文学的宏大和神异色彩；句法以冒号引出对雌性巨兽的说明，并将位置短语处理为自然中文。所有脚注标记均置于正文相应位置。
