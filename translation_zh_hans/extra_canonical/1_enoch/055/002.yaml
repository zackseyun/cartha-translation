base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/002.yaml
  text: And he swore by his great name that from this time onward he would not do thus to all who dwell upon the dry land[a]; and I will set a sign in the heavens, and it will be a pledge of faithfulness between me and them forever, for as long as the days of heaven are upon the earth[c][b]; and this is by my command.
translation:
  language: zh_hans
  text: 他凭自己的大名起誓：从今以后，他不再这样对待所有住在干地上的人。我必在天上设立一个记号[a]；这记号要在我与他们之间，永远作为信实的凭据[b]，只要天的日子还在地上。这事出于我的命令[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“天上的记号”很可能呼应洪水之后所立的记号，但本节没有明确说这记号是什么。
    reason: cross_reference
  - marker: b
    text: 译作“信实的凭据”的词，也可较宽泛地理解为“信实”或“信赖”；按上下文，也带有立约保证的意味。
    reason: lexical_alternative
  - marker: c
    text: “出于我的命令”也可译作“依照我的定例”或“这是我的法令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐለ
  choice: 起誓
  rationale: 该动词明确表示宣誓；“起誓”简洁自然，也保留庄严语气。
- source_word: በስሙ ዐቢይ
  choice: 指着自己的大名
  rationale: 保留凭名起誓的公式；“大名”贴近原文，又不额外解释其神学含义。
- source_word: እምይእዜ
  choice: 从今以后
  rationale: 准确表达由当前时点延伸至未来的时间含义，符合现代汉语。
- source_word: ኢይገብር ከመዝ
  choice: 不再这样对待
  rationale: 保留“这样”的语境指向，不擅自说明所指的灾难；加入“对待”使其与后面的对象衔接自然。
- source_word: ለኵሎሙ እለ ይነብሩ ዲበ የብስ
  choice: 所有住在旱地上的人
  rationale: የብስ 特指干地、旱地，而非笼统的“大地”；译文保留洪水语境中的陆地意象。
- source_word: ትእምርተ
  choice: 一个记号
  rationale: 可指可见的标记或征兆；“记号”自然且不把它明确说成彩虹。
- source_word: እወዲ በሰማያት
  choice: 我必在天上设立
  rationale: “设立”适合与“记号”搭配，并保留宣告性的将来语气。
- source_word: ማእከሌየ ወማእከሌሆሙ
  choice: 在我与他们之间
  rationale: 这是自然的关系性表达，也保留原文双方之间的含义。
- source_word: ሃይማኖተ
  choice: 信实的凭据
  rationale: 该词可表示信、信实或可信性；结合起誓和记号的上下文，“信实的凭据”传达保证意味，却不直接改译为原文未明说的“约”。
- source_word: እስከ ለዓለም መጠነ መዋዕለ ሰማይ ዲበ ምድር
  choice: 永远……直到天的岁月在地上终结
  rationale: 保留原文富有末世色彩的时间公式及其张力，而不将整句简化为单一的“永远”。
- source_word: ዝ በትእዛዝየ ውእቱ
  choice: 这事出于我的命令
  rationale: 表达神圣授权的结束语；既可读作命令，也保留法令、定例的语义空间。
theological_decisions:
- issue: 是否把天上的记号明确译成彩虹
  choice: 正文只译作“一个记号”
  alternative: 天上的彩虹／云中的弓
  rationale: 本节虽然明显呼应洪水记号传统，但吉兹文本没有说出彩虹；不应借熟悉的《创世记》措辞补足原文。
- issue: 是否把 ሃይማኖተ 直接译为“约”
  choice: 译作“信实的凭据”
  alternative: 约／信实／信赖
  rationale: 该词本身主要涉及信、信实和可信性。上下文确有立约意味，但正文避免把这种含义明确化为原文未使用的“约”。
- issue: 时间公式中“永远”与“天的岁月”的关系
  choice: 保留“永远……直到天的岁月在地上终结”的张力
  alternative: 只译作“直到永远”
  rationale: 原文同时包含永恒措辞和“天的岁月在地上”的诗性期限；不将二者压平，有助于保存启示文学的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留第一人称神谕与第三人称叙述之间的转换，因为吉兹文本本身如此；不以统一人称来消除文本张力。正文避免古奥文言，也不把洪水背景中未明说的“彩虹”或“约”直接补入。
