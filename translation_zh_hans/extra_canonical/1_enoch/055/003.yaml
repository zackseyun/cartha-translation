base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/003.yaml
  text: When I desired to deliver them into the hand of the angels on the day of tribulation and pain[a], I will cause my punishment and my wrath to abide upon them, says God[d][c][b], the Lord of spirits.
translation:
  language: zh_hans
  text: “当我想要在患难和痛苦之日[a]把他们交在众天使手中[b]时，我必使我的惩罚和烈怒留在他们身上[c]，”上帝[d]——万灵之主——说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难和痛苦”也可译作“困苦和苦楚”或“灾难和折磨”。原文两个词共同强调审判之日的严重苦难。
    reason: lexical_note
  - marker: b
    text: 直译为“交在众天使的手中”；“在……手中”是表示被交给对方掌管或处置的司法性说法。
    reason: cultural_note
  - marker: c
    text: 原文在“我的惩罚和烈怒”之前的衔接较难确定。也可理解为：“要在患难和痛苦之日把他们交在众天使手中，那时我必使我的惩罚和烈怒留在他们身上。”
    reason: textual_variant
  - marker: d
    text: 此处原文先用通常表示“上帝”的词，随后称他为“万灵之主”。旧译也有作“主——万灵之主——说”的。
    reason: translation_note
lexical_decisions:
- source_word: ፈቀድኩ
  choice: 我定意
  rationale: 该动词表达意愿或意图；“定意”保留第一人称的意志与决心，又不将其强化为正式颁布的命令。
- source_word: አጽንዖሙ
  choice: 把他们交在……手中
  rationale: 结合后面的“在众天使手中”，这里表示把人交由另一方掌管或处置，具有审判语境中的移交意味。
- source_word: በእደ መላእክት
  choice: 在众天使手中
  rationale: 保留原文“手中”的圣经式司法意象，而不直接释为“权下”。
- source_word: በዕለተ ምንዳቤ ወሕማም
  choice: 在患难和痛苦之日
  rationale: 分别传达外在困厄与亲身苦楚，并保持启示文学庄重而强烈的语域。
- source_word: መቅሠፍተየ
  choice: 我的惩罚
  rationale: 该词可指击打、鞭笞或惩治；“惩罚”最适合此处审判语境，同时避免把具体方式说得过死。
- source_word: መዐትየ
  choice: 我的烈怒
  rationale: 表达上帝施行审判时的强烈愤怒；“烈怒”符合庄重的启示文学语体。
- source_word: አኃድር ዲቤሆሙ
  choice: 使……留在他们身上
  rationale: 使役动词与介词结构带有使某物安住、停留于其上的含义；此译保留审判持续压在他们身上的意象。
- source_word: እግዚአብሔር እግዚአ መናፈስት
  choice: 上帝——万灵之主
  rationale: 前一词是吉兹语中通常表示“上帝”的称谓，后一结构是“万灵之主”；区分二者，避免误译成重复的“主、万灵之主”。
theological_decisions:
- issue: 上帝的审判与天使执行之间的关系
  choice: 上帝把受审判者交在天使手中，同时使自己的惩罚和烈怒留在他们身上。
  alternative: 把天使本身理解为惩罚，或把患难痛苦与上帝的烈怒完全分开。
  rationale: 原文先说交在天使手中，随后又以第一人称说“我的惩罚和我的烈怒”，既保留天使的执行作用，也保留上帝直接的审判行动，不将二者合并。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交在……手中”与“留在……身上”适度保留原文的司法及持续审判意象；破折号标明“万灵之主”是对“上帝”的同位称号。
