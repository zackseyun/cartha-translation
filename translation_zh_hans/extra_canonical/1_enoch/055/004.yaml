lexical_decisions:
- source_word: ነገሥት
  choice: 众王
  rationale: 这是“王”的复数形式；结合无定冠词及后续第二人称复数动词，按呼格理解，译为直接称呼的“众王”。
- source_word: ኃያላን
  choice: 权贵
  rationale: 该词可指强有力者；在审判性的政治社会语境中，“权贵”比单纯的“强壮者”更自然，也保留其有权势之人的含义。
- source_word: እለ
  choice: ……的
  rationale: 关系标记，引出修饰前面“众王和权贵”的从句；汉语用前置定语结构表达。
- source_word: ትኃድሩ
  choice: 住着
  rationale: 这是第二人称复数未完成体，支持呼格直称；词义可涵盖居住、住宿或扎营。原文未保留明确地点，故采用较不具体的“住着”。
theological_decisions:
- issue: 现存短句残缺或有所省略
  choice: 仅翻译现存语句，不在正文补出地点或后续审判内容。
  alternative: 住在那里的众王和权贵啊；扎营的众王和权贵啊
  rationale: 所给吉兹语句本身不像完整句子，且地点没有明说。正文保持这种悬而未决的状态，并以脚注说明可能含义，避免把推测写成经文。
- issue: 第二人称呼格还是第三人称描述
  choice: 按第二人称直接呼告翻译为“……啊”。
  alternative: 那些住着的王和权贵
  rationale: ትኃድሩ 是第二人称复数形式，而非第三人称；名词前也没有定冠词，故直接呼告更符合语法证据。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“啊”明确表现原文的直接呼告；“住着”刻意保留未说明地点所造成的悬缺感。所有脚注标记均置于正文。
