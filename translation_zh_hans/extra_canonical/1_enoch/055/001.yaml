base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/001.yaml
  text: And after this the Head of Days relented and said[a], “In vain I have destroyed all those who dwell on the dry land.”
translation:
  language: zh_hans
  text: 此后，“岁月之首”后悔了[a]，说：“我毁灭了所有住在旱地上的人，竟是徒然。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“回心转意了”或“改变了心意”。吉兹语动词可表示后悔、回转或改变心意；用于神时，未必含有中文“后悔”常带的道德过错意味。
    reason: 说明神学上敏感动词的语义范围，并保留原文歧义。
lexical_decisions:
- source_word: እምድኅረዝ
  choice: 此后
  rationale: 保留启示文学叙事中的时间推进，同时符合现代汉语表达。
- source_word: ነሥሐ
  choice: 后悔了
  rationale: 该动词可表示后悔、回心或改变心意；正文采用较直接的“后悔”，保留神学张力，并以脚注列出语气较弱的可能译法。
- source_word: ርእሰ መዋዕል
  choice: 亘古之首
  rationale: 按构词保留“首”与“日子/岁月”的独特称号意象；“亘古”使其在中文中成为庄重且可理解的称号，而不径直等同于其他经典称谓。
- source_word: ሕኵፖልክዎሙ
  choice: 我毁灭了
  rationale: 直接表达针对复数对象的毁灭行动，力度符合审判语境，又不额外增添方式。
- source_word: ለኵሎሙ ለእለ ይነብሩ
  choice: 所有住……的人
  rationale: 同时保留全称范围和持续居住的含义。
- source_word: ውስተ የብስ
  choice: 在旱地上
  rationale: “旱地”比泛称“地”更具体，并可保留洪水与审判语境中的陆地意象。
- source_word: በከ
  choice: 竟是徒然
  rationale: 依现有校勘与译本证据按“徒然”理解；以“竟是”使感叹和反思语气在现代汉语中自然呈现。
theological_decisions:
- issue: 当ነሥሐ以“亘古之首”为主语时，是否弱化其后悔或转意的意味
  choice: 正文译作“后悔了”
  alternative: “回心转意了”或“改变了心意”
  rationale: 原文使用了带有后悔、回转或改变心意意味的拟人化表达。正文不以教义性释义消解这种张力，脚注则说明其语义范围，避免把中文“后悔”的道德含义视为唯一可能。
- issue: 是否将ርእሰ መዋዕል协调为较熟悉的经典称号
  choice: 亘古之首
  alternative: 岁月之首；亘古者
  rationale: 保留本段比喻书中特有称号的构词形象，不将它无依据地同化为另一固定称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亘古之首”保留独特启示文学称号；引语调整为自然汉语语序，但不削弱原文关于神后悔或转意的张力。
