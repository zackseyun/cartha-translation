base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/010.yaml
  text: And so it was made for sinners[a], when they die and are buried in the earth[c][b], and judgment has not come upon them during their lifetime.
translation:
  language: zh_hans
  text: 同样，这也是为罪人设立的[a]：他们死后被埋在地里，而在他们有生之年，审判并未临到他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设立”也可译作“创造”或“造成”。原文没有重述其主语；“这”是根据上文所说为死者分隔的处所补出的。
    reason: lexical_alternative
  - marker: b
    text: 本句的句法衔接较为简略，也可理解为：“同样，这也是为罪人设立的——就是为那些死后被埋在地里、生前却未受审判的人。”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: በከመ፡ ከማሁ
  choice: 照样
  rationale: 这一组比较、承接成分回指上文所述为死者分隔的处所；“照样”自然保留对应关系，且不把逻辑说得过满。
- source_word: ተፈጥረ
  choice: 设立
  rationale: 该被动完成式可指“被造”“形成”或“设定”。上下文谈的是为亡者安排的处所，因此“设立”既表达既成安排，也避免无根据地强化为关于物质创造的断言。
- source_word: ለኃጥኣን
  choice: 为罪人
  rationale: 直接保留与审判语境相符的宗教伦理用语，并表达该安排所针对的人。
- source_word: ሶበ፡ ይመውቱ፡ ወይትቀበሩ
  choice: 他们死后被埋
  rationale: “死后”在汉语中清楚引出死亡与埋葬的时间情形；“被埋”保留原文埋葬动词的被动意义。
- source_word: ውስተ፡ ምድር
  choice: 在地里
  rationale: 符合埋葬语境，也保留进入土地之中的具体意象。
- source_word: ወኵነኔ፡ ኢኮነ፡ በላዕሌሆሙ
  choice: 而审判……并未临到他们
  rationale: 保留审判作为临到人的事件这一表达，不擅自改成“定罪”，以免缩窄词义。
- source_word: በሕይወቶሙ
  choice: 在他们有生之年
  rationale: 明确与死后状态形成对照，且是庄重、自然的现代汉语。
theological_decisions:
- issue: 本句所说罪人死后的处境性质
  choice: 译为某种为罪人设立的安排，适用于生前未受审判而死并被埋葬的人。
  alternative: 可理解为“这个地方是为罪人创造的”，或只强调他们死亡埋葬的事实，而不明确指一个特定处所。
  rationale: 原文主语省略，须由上文所述死者分隔的处所补足；译文用“这”承接上下文，却不进一步断言其最终结局是毁灭、永刑或获释。
- issue: “审判”与“定罪”的关系
  choice: 保留“审判”。
  alternative: 译作“定罪”或“刑罚”。
  rationale: 原词可带司法裁断含义，但本节没有明确把裁断结果限定为定罪；保留“审判”可避免预先解决这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“照样”承接上文，“这”补足汉语所需主语；用冒号标明后文描述适用对象，避免误读为该处所在罪人死亡时才被设立。
