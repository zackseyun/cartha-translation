base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/002.yaml
  text: And there were four hollow places in it[a], deep and wide and very smooth; three of them were dark, and one was bright, and water was springing up in its midst. And I said, “How smooth these hollow places are[c][b], and deep and dark to look at.”
translation:
  language: zh_hans
  text: 其中有四个洞穴[a]，又深又宽，而且非常光滑；三个是黑暗的，一个是明亮的，其中中央有水涌出[b]。我说：“这些洞穴多么光滑[c]，又深邃，望去又是多么黑暗！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的吉兹文有几处难解，尤其是对洞穴“光滑”的描写；这也可能表示洞壁陡直，或平滑如经打磨一般。
    reason: lexical_alternative
  - marker: b
    text: 也有人把这句话理解为：明亮的那个洞穴中央有一股泉水或水流。正文保留代词所指的不确定性。
    reason: alternative_reading
  - marker: c
    text: 此处传本文字不易确定；也可译作“多么深邃而非常光滑”。
    reason: textual_difficulty
lexical_decisions:
- source_word: አርባዕቱ፡ መካናት
  choice: 四个洞穴
  rationale: መካናት本可泛指“地方”，但上下文描写山岩内部的凹空之处；“洞穴”在现代汉语中自然，也保留其空间形态。
- source_word: ዕሙቀ፡ ወርኂበ፡ ወልሙጸ፡ ጥቀ
  choice: 又深又宽，而且非常光滑
  rationale: 逐一保留“深、宽、光滑”三个不同特征，并将ጥቀ理解为加强“光滑”的程度，避免遗漏ርኂበ“宽”。
- source_word: ጸልማት / ብርህት
  choice: 黑暗的 / 明亮的
  rationale: 用直接而对称的现代汉语呈现视觉上的明暗对照。
- source_word: ነቅዐ፡ ማይ
  choice: 有水……涌出
  rationale: 该短语表示水发出或涌流，不只是静态存在；“涌出”保留动态意象。
- source_word: በማእከላ
  choice: 从其中
  rationale: 保留代词指向的含混性，不在正文中武断限定水必定来自明亮洞穴的中央。
- source_word: ልሙጽ፡ ዘያንኩረኵር
  choice: 多么光滑
  rationale: 传本文字困难；依重复出现的ልሙጽ保留“光滑”这一主要视觉印象，以感叹句自然表达。
- source_word: ዕሙቅ፡ ወጽልመት፡ ለነጽሮ
  choice: 又深邃，望去一片黑暗
  rationale: 保留深度、黑暗和视觉观察三项要素，同时采用自然庄重的汉语语序。
theological_decisions:
- issue: 描述之后的说话者公式
  choice: 我说
  alternative: 我看见；不标明言说而直接作感叹
  rationale: 依所传吉兹文本及异象叙事结构保留第一人称回应，不把先知的言语反应压缩成纯客观描写。
- issue: 水所在之处的指向
  choice: 保留“其中”的含混性
  alternative: 明确译作“从那个明亮洞穴中央涌出”
  rationale: 句法所指可能被理解为明亮洞穴，也可能泛指整体内部；正文不替原文消除这种不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语言。“洞穴”比泛泛的“地方”更符合山岩内部凹空的场景；正文完整保留“深、宽、非常光滑”，并以脚注说明“光滑”及水源位置的疑难。所有脚注标记均已置于正文。
