base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/001.yaml
  text: And from there I went to another place[a], and he showed me in the west a great and high mountain[b], and a hard rock.
translation:
  language: zh_hans
  text: 从那里，我又去了另一个地方；他让我看见西方有一座又大又高的山[a]，还有一块坚硬的岩石[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文同时保留“大”与“高”两种描述，也可译作“一座宏伟而高耸的山”。
    reason: lexical_alternative
  - marker: b
    text: “坚硬的岩石”也可译作“坚固的岩石”或“坚实的岩石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: 从那里
  rationale: 保留从前一异象地点出发的空间过渡；现代汉语自然简洁。
- source_word: ሖርኩ
  choice: 我……去
  rationale: 按第一人称移动动词直译，不额外加入“旅行”或“跋涉”等语气。
- source_word: ካልአ መካነ
  choice: 另一个地方
  rationale: 表达与上一场景不同的地点；“另一个”比“第二个”更符合此处叙事功能。
- source_word: ወአርአየኒ
  choice: 他让我看见
  rationale: 保留使役性的“使我看见／给我看”含义，也符合异象游历的叙述方式。
- source_word: በምዕራብ
  choice: 西方
  rationale: 按方位处所理解；“西方有”在现代汉语中自然，并不把它过度限定为移动方向。
- source_word: ደብረ ዐቢየ ወነዋኅ
  choice: 一座又大又高的山
  rationale: 分别保留“大”与“高”两项性质，不将二者缩减为单一形容词。
- source_word: ኵኵሐ ጽኑዐ
  choice: 一块坚硬的岩石
  rationale: “岩石”呈现地貌意象，“坚硬”保留ጽኑዐ所表达的坚固、结实之感；量词使汉语表达完整自然。
theological_decisions:
- issue: 是否将使以诺看见异象者明确译作天使
  choice: 只译作“他”，不明说其身份
  alternative: 译作“那天使”或“我的向导”
  rationale: 吉兹语动词只含第三人称阳性主语；上下文或可表明他是天使向导，但本节本身没有点名，因此不把上下文推断写进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我又往……去”延续异象游历的直接叙事节奏；分号区分移动与所见。“他”保留原文未明确身份的指称，“又大又高”则清楚保存并列的双重描写。
