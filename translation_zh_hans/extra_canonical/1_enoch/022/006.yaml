base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/006.yaml
  text: At that time I asked Raphael[a], the angel who was with me, and I said to him[c][b], “This spirit whose voice reaches thus and accuses—to whom does it belong?”
translation:
  language: zh_hans
  text: 那时，我问那与我同在的天使拉斐尔，说：“这个灵的声音这样传来，发出控诉——这是谁的灵？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句较直译为“他属于谁？”是在询问这个灵的身份；下一节说明这是亚伯的灵。末尾的动词也可理解为“申诉”或“恳切求告”，但在上下文中带有针对该隐的指控意味。
    reason: 说明归属式问法、下文指向及末尾动词的词义幅度。
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: 那时
  rationale: 这是叙事中常见的时间衔接语，简洁自然，也保留启示文学的庄重语气。
- source_word: ተስእልክዎ
  choice: 我问
  rationale: 直接表达以诺向解释异象的天使提出问题。
- source_word: ለሩፋኤል፡ መልአክ፡ እንዘ፡ ሀሎ፡ ምስሌየ
  choice: 与我同在的天使拉斐尔
  rationale: 中文采用自然的定语次序，同时完整保留拉斐尔的身份及其与叙述者同在的信息。
- source_word: ዝመንፈስ
  choice: 这个灵
  rationale: መንፈስ通常指“灵”；本章虽涉及死者所在之处，但译作“灵”更贴近词形，也不额外规定灵魂论含义。
- source_word: ዘከመዝ፡ ቃሉ፡ ይበጽሕ
  choice: 他的声音这样传来
  rationale: ቃል在此指可听见的呼声；ይበጽሕ含抵达、传到之意，“传来”符合现代汉语表达。
- source_word: ወይሰኪ
  choice: 并且控诉
  rationale: 该动词在上下文中具有申诉、指控的司法意味；亚伯的灵针对该隐发出呼声，因此“控诉”既保留司法色彩，也与本段重复用语相协调。
- source_word: ዘመኑ፡ ውእቱ
  choice: 他是谁的灵
  rationale: 按归属关系理解为询问该灵属于谁，即询问其身份；中文如此表达比直译“他属于谁”更能避免误解为所有权。
theological_decisions:
- issue: 在阴间异象中，መንፈስ应译作“灵”还是“魂”
  choice: 灵
  alternative: 魂
  rationale: 原词通常对应“灵”，且经文本身没有细分后世神学中的灵、魂范畴；采用“灵”可保留其开放性。
- issue: 末尾动词表达祈求、申诉还是指控
  choice: 控诉
  alternative: 申诉；恳求
  rationale: 紧接的下文将其认定为亚伯的灵，其呼声针对该隐，带有明显的司法指控意味；“控诉”比一般的“恳求”更贴合语境，同时不展开控诉的具体内容。
- issue: 末句是在询问归属还是身份
  choice: 以“他是谁的灵”表达借归属询问身份
  alternative: “他属于谁？”
  rationale: 原文保留归属式问法，但现代汉语若直说“属于谁”容易产生所有权意味；正文自然地传达身份问题，脚注说明原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“控诉”保留本段的司法氛围；破折号表现先描述呼声、后追问身份的句法转折。所有脚注标记均已置于正文。
