base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/011.yaml
  text: Here their souls are set apart in this great affliction until the great day of judgment and punishment and affliction for those who curse forever; and vengeance on their souls. There he will bind them forever.
translation:
  language: zh_hans
  text: 在这里，他们的灵魂在这极大的苦难中被隔开，直到那审判、惩罚、临到那些永远受咒诅之人的苦难[a]，以及临到他们灵魂的报应的大日。那里，他要永远捆绑他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远受咒诅之人”也可理解为“永远咒诅人的人”；原文动词可能按被动或主动理解，但被动义较符合审判的语境。
    reason: lexical_alternative
  - marker: b
    text: 有一文本见证在本节末尾另有括注：“这事从世界以前就是如此。”这句话的文本不确定，因此未列入正文。
    reason: textual_variant
lexical_decisions:
- source_word: ይትፈለጠ
  choice: 被分别出来
  rationale: 直译其被动或反身的分离之意，既保留空间上的区隔，也不把这种状态解释为单纯安置或最终定罪。
- source_word: ነፍሳቲሆሙ
  choice: 他们的灵魂
  rationale: 上下文涉及死者在等候审判之处的状态，“灵魂”最贴合这里所指的离身之人。
- source_word: ዐቢይ ጻዕር
  choice: 极大的苦难
  rationale: 该词可指痛苦、患难或折磨；“苦难”保留真实受苦的含义，同时不过度界定其程度或性质。
- source_word: ኵነኔ
  choice: 审判
  rationale: 采用宽广而清楚的司法用语，并与随后表示惩罚的词相区分。
- source_word: መቅሠፍት
  choice: 惩罚
  rationale: 虽可指击打或灾殃，但在末世司法语境中译为“惩罚”最能表达刑罚后果。
- source_word: ይረግሙ
  choice: 受咒诅
  rationale: 形态本身可能容许主动或被动理解；此处按审判语境采用被动义，同时以脚注保留主动义。
- source_word: በቀል
  choice: 报应
  rationale: 原文是与审判、惩罚、苦难并列的名词性表达，不另加动词或主语；“报应”传达其报复性、司法性的后果。
- source_word: ይእስሮሙ
  choice: 他要捆绑他们
  rationale: 保留具体而有力的末世图像，也保留原文未明说身份的单数施事者。
- source_word: እስከ ለዓለም
  choice: 永远
  rationale: 是自然的现代汉语表达，也保留该惯用语所传达的持久和终局意味。
theological_decisions:
- issue: 这些灵魂在最终审判以前，是仅被分隔安置，还是已经处于惩罚性的痛苦中
  choice: 同时保留“被分别出来”和“在这极大的苦难中”两层意思。
  alternative: 译成中性的“被分隔安置”，或强化为“已经受极大折磨”。
  rationale: 吉兹文把分离用语与苦难用语并置；译文不把这种张力化约为纯粹拘留或已经完全实现的终局刑罚。
- issue: “受咒诅／咒诅”的语态
  choice: 正文采用“永远受咒诅的人”。
  alternative: “永远咒诅的人”。
  rationale: 该动词在此存在语态歧义；被动义较契合审判语境，但主动义仍以脚注明确保留。
- issue: “他要捆绑他们”中施事者的身份
  choice: 保留未指明身份的“他”。
  alternative: 改成“上帝要捆绑他们”或无主被动句“他们要被捆绑”。
  rationale: 原文支持单数施事者，却未在本节明说其身份；不补入明确的神圣称谓，也不抹去语法上的施事者。
- issue: “报应”与后一句“在那里”的句法关系
  choice: 把“他们的灵魂也必遭报应”作为大日所含事项，再以“在那里”开始捆绑句。
  alternative: “他要在那里为他们的灵魂施行报应，并捆绑他们”。
  rationale: 原文的“报应”是名词性成分，与前面的审判、惩罚和苦难并列；地点副词只属于随后“捆绑他们”的分句。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“极大的苦难”“审判、惩罚的大日”“遭报应”等表达保持启示文学的肃穆感；避免古奥虚词和教派化术语。所有脚注标记均置于正文相应位置。
