base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/012.yaml
  text: And thus a division has been made for the souls of those who make their complaint[d][c][b][a], who make known their destruction when they were slain in the days of the sinners.
translation:
  language: zh_hans
  text: 这样，便为那些申诉，并显明自己所遭毁灭——就是在罪人的日子被杀一事——的灵魂划分出一处。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “申诉”也可译作“哀号”、“呼喊”或“控诉”；原词兼有悲叹、抱怨和抗议的意味。
    reason: lexical_alternative
  - marker: b
    text: “所遭毁灭”也可译作“他们的败亡”或“他们所遭的暴死”；这里可能特指他们被杀一事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተፈልጠ
  choice: 划分出一处
  rationale: 该被动形式表达分开、划定；结合本章阴间各处被分别设置的空间语境，用“划分出一处”自然地保留空间及审判意味，而不作过度说明。
- source_word: ለነፍሰ
  choice: 为……之人的灵魂
  rationale: 介词具有受益或指派意味；后续关系从句要求按复数群体理解。
- source_word: እለ ይስክዩ
  choice: 那些申诉之人
  rationale: 该动词可表达哀号、抱怨或控诉；“申诉”兼顾悲鸣与寻求公断的意味，不把它限定为正式法律控告。
- source_word: እለ ያርእዩ
  choice: 他们显明
  rationale: 该动词意为使人看见、显示或使人知道；“显明”保留披露意味，也不强行解释为法庭作证。
- source_word: በእንተ ሕጉለት
  choice: 所遭的毁灭
  rationale: 原短语可指毁灭、败亡或暴力造成的死亡；正文保留较宽泛的“毁灭”，具体的暴力死亡意味由下句“被杀”限定。
- source_word: አመ ተቀትሉ
  choice: 被杀时
  rationale: 准确表达被动受杀；现代汉语“被杀”清楚自然，不额外引入“谋杀”的法律判断。
- source_word: በመዋዕለ ኃጥኣን
  choice: 在罪人的日子
  rationale: 保留原文的时间表达和以“罪人”标志时代的启示文学色彩。
theological_decisions:
- issue: 这些灵魂是在一般哀号，还是为无辜流血提出控诉
  choice: 正文译作“申诉”
  alternative: 哀号；呼喊；控诉
  rationale: 本章语境涉及被杀者的血发声。“申诉”既可包含痛苦呼求，也带有要求伸冤的意味，从而保留哀恸与司法控诉之间的张力。
- issue: “显明自己所遭的毁灭”是否应明确解释为为暴死作证
  choice: 不在正文中加入“作证”或“惨死”等解释
  alternative: 为自己所遭的惨死作证
  rationale: 原文具有披露和展示意味，但未必专指正式作证；正文维持其开放性，并由“被杀”呈现暴力死亡的语境。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“划分出一处”呼应本章为亡者灵魂分别设置所在之处的空间语境；“罪人的日子”保留以诺文学的启示性措辞。脚注标记均置于正文相关陈述之后。
