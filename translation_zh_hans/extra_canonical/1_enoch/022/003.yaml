base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/003.yaml
  text: 'And at that time Raphael[a], one of the holy angels who was with me, answered and said to me, “These hollow places were made so that the spirits, the souls of the dead, might be gathered into them[c][b]. For this purpose they were created here: that they might gather all the souls of the children of men.”'
translation:
  language: zh_hans
  text: 那时，一位与我同在的圣天使拉斐尔回答我说：“这些美好的地方[a]被造出来，为要让诸灵，即死者的灵魂[b]，聚集在其中。它们在这里受造，正是为了这个目的：为要汇集世人所有的灵魂。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存吉兹语作“这些美好的地方”或“这些美丽的地方”。现存希腊文本作“这些空穴”；后者符合本章上下文对凹陷处所的描写，可能反映另一文本读法。
    reason: textual_variant
  - marker: b
    text: 原文同时使用“灵”和“灵魂”两个词；这里将“死者的灵魂”理解为对“诸灵”的同位说明，也可理解为两个紧密相连而未作明确区分的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: 回答
  rationale: 该动词在叙事对话中通常引出回应；与后面的“说”并用，保留原文“回答……说”的结构。
- source_word: ቅዱሳን መላእክት
  choice: 圣天使
  rationale: 保留启示文学中的固定称谓及其庄重、神圣意味。
- source_word: ዝመካናት ሰናያት
  choice: 这些空穴[a]
  rationale: 现存吉兹语字面可指“这些美好／美丽的地方”，但希腊文本作“空穴、凹陷处”，且符合本章上下文。正文采用“空穴”，脚注保留吉兹语见证的真实异文。
- source_word: ይትጋብኡ ዲቤሆን
  choice: 聚集在其中
  rationale: 以自然中文表达灵魂被收聚到指定处所之中，同时不把该处所过度具体化为建筑。
- source_word: መናፍስት ለነፍሶሙ ለምዉታን
  choice: 诸灵，也就是死者的灵魂
  rationale: 同时保留“灵”与“灵魂”两个词，并以同位关系表达其最可能的句法联系，不将二者解释成截然不同的类别。
- source_word: ሎቱ ዝንቱ
  choice: 正是为了这个目的
  rationale: 按上下文表达目的，中文清楚自然。
- source_word: ተፈጥሩ
  choice: 受造
  rationale: 保留明确的创造／形成含义和启示文学的庄重语体。
- source_word: ኵሎ ነፍሰ ውሉደ ሰብእ
  choice: 世人所有的灵魂
  rationale: 准确传达“人的众子／人类子孙”的整体范围，同时避免现代中文中生硬或可能误解为仅指后代的措辞。
theological_decisions:
- issue: “诸灵”与“死者的灵魂”的关系
  choice: 译作同位结构：“诸灵，也就是死者的灵魂”
  alternative: 将二者视为不同类别，或合并为单一词语“死者的灵”
  rationale: 吉兹语并列使用“灵”和“灵魂”两种词汇。正文保留二者，并以脚注说明句法上的可能关系，避免把文本的人论术语过度系统化。
- issue: “人的众子”的范围
  choice: 译作“世人所有的灵魂”
  alternative: 直译为“人类众子的所有灵魂”
  rationale: 该古代表达泛指全体人类；所选译法保留普遍范围，又符合现代标准汉语。
- issue: “美丽的地方”与“空穴”的文本差异
  choice: 正文采用“空穴”，脚注注明吉兹语字面读法
  alternative: 正文依现存吉兹语译作“美好的地方”或“美丽的地方”
  rationale: 希腊见证与本章前文的地形描写支持“空穴”；但吉兹语确实保存“美好／美丽”的读法，因此不静默消除异文。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“空穴”承接地下凹陷处的异象意象；“受造”保留启示文学语体，但其余句法尽量自然，避免古奥。
