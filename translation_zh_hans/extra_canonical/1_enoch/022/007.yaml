base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/007.yaml
  text: And he answered me and said to me[a], “This is the spirit that came out from Abel, whom Qayin his brother killed; and it makes accusation against him until his seed is destroyed from before the face of the earth[d][c][b], and his seed is blotted out from among the seed of men.”
translation:
  language: zh_hans
  text: 他回答我，对我说[a]：“这是从亚伯出来的灵；亚伯被他兄弟该隐杀害。这灵不断控告该隐[b]，直到该隐的后裔从地面上被除灭[c]，他的后裔从人类的后裔中被抹去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对我说”在这一见证文本中置于方括号内，可能反映文本传承上的异文；正文保留这几个字。
    reason: textual_variant
  - marker: b
    text: “控告”含司法意味：亚伯的灵持续提出控诉、呼求审判，并非只是在叙说冤情。
    reason: lexical_alternative
  - marker: c
    text: 原文三次使用同一个表示“种子、后裔”的词。正文均译作“后裔”，以保留血脉和族系的重点。
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ / ወይቤለኒ
  choice: 他回答我，对我说
  rationale: 保留原文两个引语动词及第一人称宾语；中文虽略显复沓，却能反映传承文本的双重表达。
- source_word: መንፈስ
  choice: 灵
  rationale: 异象与阴间语境所指是亚伯死后的灵性存在，不宜弱化为“气息”或仅作“声音”。
- source_word: ዘወጽአ እምአቤል
  choice: 从亚伯出来
  rationale: 贴近原文“出来、发出”的具体意象，不将其解释为单纯的声音或灵魂离体学说。
- source_word: ዘቀተሎ ቃየን እኁሁ
  choice: 亚伯就是被他兄弟该隐杀害的那一位
  rationale: 清楚呈现关系从句及兄弟关系，并采用现代中文通行人名“该隐”。
- source_word: ይሰኪ ኪያሁ
  choice: 不断控告该隐
  rationale: “控告”保留司法性的含义；“不断”表达未完成体及持续到某时为止的语势，并明确代词所指以免中文歧义。
- source_word: ይትኀጐል ዘርኡ
  choice: 他的后裔……被除灭
  rationale: ዘር 在此指血脉后代；中文“后裔”比直译“种子”自然，同时保留族系审判的含义。
- source_word: እምቅድመ ገጸ ለምድር
  choice: 从地面上
  rationale: 以自然而庄重的现代中文表达闪语式“从地的面前”，避免生硬的“从大地面前”。
- source_word: ይማስን ዘርኡ
  choice: 他的后裔……被抹去
  rationale: 与前句构成近义递进，保留“抹除、消灭”的强烈审判语气。
- source_word: እምዘርአ ሰብእ
  choice: 从人类的后裔中
  rationale: 保留原文再次出现的后裔用语和“从……中”的范围意义。
theological_decisions:
- issue: 如何表达亚伯死后的存在
  choice: 灵
  alternative: 灵魂、声音、幽魂
  rationale: 原文明确使用 መንፈስ；译作“灵”既忠实于词义，也不进一步规定具体的人论体系。
- issue: 如何表达对该隐血脉的审判
  choice: 他的后裔……被除灭；他的后裔……被抹去
  alternative: 他的子孙灭亡；他的家系断绝
  rationale: 保留两次 ዘር 的重复与平行递进，不把群体性、谱系性的审判缩减为泛指死亡。
- issue: 控告的主体与对象
  choice: 这灵不断控告该隐
  alternative: 它控告他；它向他申诉
  rationale: 原文代词在上下文中指亚伯的灵控告该隐；中文若连续使用“他/它”容易混淆，因此明确名称，但不增添控告内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留双重引语公式和末句平行结构；对闪语式表达作适度汉语化。人名采用简体中文读者熟悉的“亚伯、该隐”，不以音译形式制造不必要隔阂。
