base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/013.yaml
  text: And thus it has been made for the souls of the people who are not righteous[a], but sinners, who are complete in transgression, and they will be with the lawless like them[d][c][b]. But as for their souls...
translation:
  language: zh_hans
  text: 如此，这是为那些不是义人、而是罪人者的灵魂所设立的[a]；他们罪恶满盈，将与那些和他们一样的不法之徒同在[b]。至于他们的灵魂……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “设立”也可译作“造”或“预备”。本章谈及为死者划定的处所，因此正文采用“设立”；本节本身未明说所设立的对象。
    reason: lexical_alternative
  - marker: b
    text: 这句原文含义不很明确；也可能意为“他们将与不法之徒同在”，或“他们将像不法之徒一样”，也可能兼有两层意思。
    reason: alternative_reading
lexical_decisions:
- source_word: ተፈጥረ
  choice: 设立
  rationale: 该动词可指“创造、造成、预备、设立”。本章语境谈为亡者划定的处所，因此译作“设立”较自然，同时以脚注保留其他可能。
- source_word: ለነፍሶሙ ለሰብእ
  choice: 为……人的灵魂
  rationale: 前置词结构表示这处所是为这些人的灵魂而设；“人”在此为泛指，不限定性别。
- source_word: ኢኮኑ ጻድቃነ አላ ኃጥኣነ
  choice: 不义、反倒犯罪
  rationale: 直接保留“义人/罪人”的以诺传统道德对比；“反倒”体现否定后转折。
- source_word: ፍጹማነ እበሳ
  choice: 恶贯满盈
  rationale: 原文意为在过犯上达到完全或充满；此成语在现代汉语中自然有力，表达罪恶满盈而不引入具体刑罚观。
- source_word: አባሲያን
  choice: 不法之徒
  rationale: 保留其不敬虔、违法背逆的司法与启示文学色彩，并与前面的“犯罪”有所区分。
- source_word: ይከውኑ ከማሆሙ
  choice: 要与和他们一样的……在一起
  rationale: 这句措辞压缩，可能兼有“与……同在”和“像他们一样”之意；正文以关系性表述兼容二者，脚注说明歧义。
- source_word: ወነፍሶሙሰ
  choice: 至于他们的灵魂……
  rationale: 后缀 -ሰ 在此作话题化或转折成分，引出下节续句，不宜理解为附加性的“他们的灵魂也”。
theological_decisions:
- issue: 动词所述是创造灵魂，还是为邪恶者的灵魂指定处所
  choice: 按上下文译为给灵魂设立处所
  alternative: 这地方被造好或预备好；或灵魂本身被创造
  rationale: 本章上下文描述亡者所分配的不同洞穴或处所；“这地方”作为汉语中必要的语境补足，避免把句子误读为邪恶灵魂受造论。脚注仍保留动词本身较宽的词义。
- issue: 末句表示与不法者同处，还是变得像他们
  choice: 使用可同时容纳同处与相似关系的表达
  alternative: 他们将成为和不法者一样；他们将与不法者同在
  rationale: 吉兹语表达简约且存在解释困难，不将其具体化为灭亡、刑罚或本体变化。
- issue: 残句 ወነፍሶሙሰ 的句法功能
  choice: 作为引出下一节的未完话题：“至于他们的灵魂……”
  alternative: “他们的灵魂也”并入前句
  rationale: 话题化或转折性读法更符合 -ሰ 的语法作用，也保留原文跨节未完的结构。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“不义”“犯罪”“不法之徒”保留启示文学的道德与司法语域；末尾省略号显示句意延续至下一节。所有脚注标记均置于正文相应位置。
