    rationale: 原文以“非义人，乃罪人”构成重要的类别性和道德性对照。“犯罪之人”偏向行为描述，且“反倒犯罪”在现代汉语中不如“而是罪人”准确自然。
  - severity: low
    issue: 脚注a的“造好”表述不够自然，且未充分说明词义范围
    rationale: 可用“造、预备或设立”简洁呈现动词的主要可能；正文选择“设立”仍应说明是顺应本章上下文，而非断言本节明确说的是某一处所。
