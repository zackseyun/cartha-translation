  to: 如此，这是为那些不是义人、而是罪人者的灵魂所设立的[a]；他们罪恶满盈，将与那些和他们一样的不法之徒同在[b]。至于他们的灵魂……
  rationale: 修订移除了本节未明载的“这地方”，以较中性的“这是为……所设立的”保留上下文所指而不将其正文化。又恢复“不是义人、而是罪人”的原文对照，采用“罪恶满盈”表达罪过达到充满的强化意义。末句仍保留“同在”和“像他们一样”的压缩歧义，并维持“至于他们的灵魂……”作为引向下一节的未完话题。
