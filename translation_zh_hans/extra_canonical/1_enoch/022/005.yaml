base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/005.yaml
  text: And I saw the spirits of the children of men who were dead[b][a], and their voice reached to heaven and cried out.
translation:
  language: zh_hans
  text: 我看见已死之人的灵；他们的呼声上达于天，并且哀告[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“申诉”“控告”或“求告”。末尾动词含义较难确定，可能指因受屈而提出申诉，而不只是一般的呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: 我看见
  rationale: 采用自然、直接的第一人称异象叙述，保留原文报告体。
- source_word: መናፍስተ
  choice: 灵
  rationale: 对应“灵”的基本含义，不以较具解释性的“灵魂”限定其人观。
- source_word: ውሉደ ሰብእ
  choice: 人
  rationale: 原为闪语式“人的儿女”，此处泛指人类；译作“人”在现代汉语中自然，也避免误解为特定亲子关系。
- source_word: እንዘ ሙታን ውእቶሙ
  choice: 已死之人
  rationale: 清楚表达这些灵所属之人处于死亡状态，不进一步推演中间状态的教义。
- source_word: ቃሎሙ
  choice: 他们的呼声
  rationale: 字面可作“他们的声音”，但结合上达于天及末尾动词，译作“呼声”更符合语境，同时不预先限定为控告或祈祷。
- source_word: ይበጽሕ እስከ ሰማይ
  choice: 上达于天
  rationale: 保留声音向上抵达天上的末世异象意象，并采用庄重而通顺的现代汉语。
- source_word: ወይስኪ
  choice: 哀告
  rationale: 该动词可涉及申诉、控告或求告；“哀告”兼有因受苦而呼求伸冤的意味，并可与相邻经节同一动词保持一致译法。
theological_decisions:
- issue: 死者向天发声的性质
  choice: 描写死者之灵的呼声上达于天并哀告
  alternative: 仅说声音上达于天；或明确译为控告、申诉、祈求
  rationale: 原文把“灵”“声音上达于天”和含申诉意味的末尾动词连在一起，显出求伸冤的司法背景；但不宜据此解决关于死后状态的更广泛教义问题，也不应把言语行为过度限定为控告或祈祷。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙述。“上达于天”保留垂直意象；“哀告”保留申诉与呼求之间的语义张力。主文脚注标记[a]与脚注对应。
