base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/009.yaml
  text: And he answered me and said to me[a], “These three have been made so that the spirits of the dead might be separated. And thus a division has been made for the spirits of the righteous, where there is a spring of water[e][d][c][b], with light above it.”
translation:
  language: zh_hans
  text: 他回答我说：“这三区隔被设立，是为了使死者的灵得以分开。义人的灵也这样被分别出来；那里有一眼泉水[a]，其上有光[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个水的泉源”或“一处水源”。这里描写义人之灵所分得的区域中有水源。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“在它上面有光”。“它”可能指泉水，也可能泛指义人之灵所在的区域。
    reason: alternative_reading
lexical_decisions:
- source_word: ፫ትገብሩ
  choice: 造出这三个地方
  rationale: 原文明确含有数词“三”和“造、作”的被动形式。结合上文所述的阴间凹穴，用“地方”补明语境，但不把该词本身直接释为“三个分区”。
- source_word: ይትፈለጠ / ተፈልጠ
  choice: 彼此分开 / 被分别出来
  rationale: 两个动词同根，译文以“分开／分别”保留有意的词根重复，同时用自然汉语区分目的式与完成式。
- source_word: መንፈሶሙ ለምዉታን
  choice: 死者的灵
  rationale: “灵”直接对应 መንፈስ，也符合本段异象中死者在阴间的表述；不改译为可能带来不同人论联想的“灵魂”。
- source_word: ጻድቃን
  choice: 义人
  rationale: “义人”是现代汉语宗教与古典伦理语境中自然、庄重且准确的对应词。
- source_word: ነቅዐ ማይ
  choice: 一道水泉
  rationale: 该短语指水的泉源；“水泉”保留具体意象，“一道”使现代汉语表达自然。
- source_word: በላዕሌሁ ብርሃን
  choice: 上面有光
  rationale: 保留原文简短而具异象色彩的空间描写，不擅自判定光究竟在水泉之上还是整个义人所在之处上方。
theological_decisions:
- issue: 阴间中死者的人论称谓
  choice: 死者的灵
  alternative: 死者的灵魂
  rationale: 依原文采用“灵”，避免用后来的体系化人论替文本作出额外界定。
- issue: 义人所在之处的性质
  choice: 义人的灵被分别出来，那里有水泉和光
  alternative: 义人本身构成第三个分区
  rationale: 译文保留空间性的末世异象，也不把句法进一步定型为“义人就是第三分区”。
- issue: 光所修饰的对象
  choice: 上面有光
  alternative: 水泉上方有光；义人所在之处上方有光
  rationale: 原文代词所指及短促句法存在一定含混，正文不予强行消解，并以脚注说明。
translation_notes:
  register: 采用现代标准书面汉语，语气庄重而易懂。保留原文两次出现的“分别”概念和简洁的异象意象；正文中的所有脚注标记均与脚注对应。
