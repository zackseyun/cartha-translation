base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/008.yaml
  text: 'And at that time I asked concerning him and concerning the judgment of all: for what reason were they separated[c][b][a], one from another?'
translation:
  language: zh_hans
  text: 那时，我问及他，也问及众人的审判：“他们为何彼此分开？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: 那时
  rationale: 自然地保留叙事中的时间承接，也符合异象文学庄重而简洁的语体。
- source_word: ተስእልኩ
  choice: 我问
  rationale: 准确表达第一人称询问动作；后接“问到”可自然引出询问的事项。
- source_word: በእንቲአሁ
  choice: 问到他
  rationale: 后缀为第三人称阳性单数，应保留“他”而非改作复数；其所指可由上文确定。
- source_word: በእንተ
  choice: 也问到
  rationale: 体现原文重复使用介词来引出第二项询问内容，同时使现代汉语行文流畅。
- source_word: ኵነኔ
  choice: 审判
  rationale: 保留宽泛的司法含义，不预先缩窄为“惩罚”或“定罪”。
- source_word: ኵሉ
  choice: 众人的
  rationale: 与“审判”连用，表达涉及所有人的广泛范围。
- source_word: በእንተ፡ ምንት
  choice: 为什么
  rationale: 以自然现代汉语表达对原因的询问，不损失原文语义。
- source_word: ተፈልጡ
  choice: 分开
  rationale: 被动含义在汉语“他们为什么分开”中可由语境自然体现，涵盖空间上及司法安排上的区分。
- source_word: ፩እምነ፡ ፩
  choice: 彼此
  rationale: 是“一个与另一个分开”的自然汉语对等表达，清楚传达相互分隔。
theological_decisions:
- issue: “众人的审判”的范围
  choice: 众人的审判
  alternative: 众人的惩罚；众人的判决
  rationale: 原词具有较宽的司法语义，可包含但不限于惩罚；译作“审判”能保留死者不同归宿及其司法依据之间的神学张力。
- issue: 单数代词的所指
  choice: 他
  alternative: 他们；它
  rationale: 吉兹语后缀是第三人称阳性单数，与相关希腊文证据一致；译文保留单数，不把其所指解释成各群体或各处所。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“问到他，也问到……”兼顾原文两个介词短语的并列结构和汉语自然度；直接引语使原因问句清楚，但不增添原文没有的解释。
