base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/004.yaml
  text: And these places were made for them to dwell in until the day of their judgment[a], and until their appointed time, and that appointed time is long[c][b], until the time of the great judgment upon them.
translation:
  language: zh_hans
  text: 这些地方是为他们造的，供他们居住，直到他们受审判的日子[a]，直到为他们所定的期限[b]；那期限很长[c]，直到大审判临到他们的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文中译作“是为他们造的”的词（†ገብሩ†）在所据文本中标为存疑。本句大意是：这些地方被造或被指定为他们居住之处，直至审判。
    reason: textual_variant
  - marker: b
    text: “期限”所译的词也可指“年龄”“一生”或“一段时期”；这里指大审判以前为他们划定的时段。
    reason: lexical_alternative
  - marker: c
    text: “很长”直译可作“很大”。这里修饰“期限”，可能强调持续时间漫长，但原词也保留“大”的意味。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: መካናት
  choice: 地方
  rationale: 该词可指地点或居所；“地方”既贴近原词的宽泛含义，也符合本章异象中的空间描写。
- source_word: ይነብርዎሙ
  choice: 供他们居住
  rationale: 该动词兼有居住、停留之意；此处表达持续安置于这些地方，译作“居住”自然明确。
- source_word: እስከ፡ ዕለተ፡ ኵነኔሆሙ
  choice: 直到他们受审判的日子
  rationale: ኵነኔ 表示审判或司法裁决；“审判”保留司法和末世语域，不预先限定为定罪。
- source_word: አመ፡ ዕድሜሆሙ
  choice: 直到为他们所定的期限
  rationale: ዕድሜ 可指年龄、一生或一段期限；在此末世时间框架中，“所定的期限”最自然地表达获分配的固定时段。
- source_word: ወዕድሜ፡ [ውእቱ፡ ዘየዓቢ፡]
  choice: 那期限很长
  rationale: የዓቢ 的基本义是“大”，修饰期限或时段时可表达时间长久；正文采用自然的“很长”，脚注保留“很大”的字面可能。
- source_word: ኵነኔ፡ ዐቢይ፡ በላዕሌሆሙ
  choice: 大审判临到他们
  rationale: “大审判”保留末世性的高潮，በላዕሌሆሙ 表示审判加在他们身上；汉语用“临到他们”自然传达这一指向。
- source_word: †ገብሩ†
  choice: 是为他们造的
  rationale: 该形式在所据文本中标为存疑，但可理解为“他们造了”，并以无施事者的被动意义表达；译文采用“是为他们造的”，同时以脚注说明文本问题。
theological_decisions:
- issue: 应将 ኵነኔ 译为“审判”还是更具负面定论的“定罪”
  choice: 审判
  alternative: 定罪；判决
  rationale: 上下文虽属末世司法场景，但原词本身不必限定为有罪判决；“审判”保留原文的神学张力。
- issue: 是否把最终的大审判解释为明确的刑罚执行
  choice: 大审判临到他们
  alternative: 大刑罚降在他们身上
  rationale: 原文说的是“大审判”在他们之上，并未在本节单独说明判决内容；因此不把它进一步具体化为刑罚。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“供他们居住”避免生硬重复，“所定的期限”呈现末世时间安排；不使用带有特定宗派色彩的术语。所有脚注标记均置于正文相应位置。
