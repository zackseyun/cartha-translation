  text: And I saw other hidden faces in that place[a].
translation:
  language: zh_hans
  text: 我又在那地方看见了别的隐藏的面孔[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“面容”；吉兹语原词直译为“面孔”，在异象语境中也可能指所见的人物。
    reason: 词义存在具体图像与所指人物之间的歧义，正文保留直译，脚注说明可能含义。
lexical_decisions:
- source_word: ካልአ
  choice: 别的
  rationale: 该词表示在先前所见之外另有一些；与后面的复数名词搭配时，“别的”自然且准确。
- source_word: ገጻተ
  choice: 面孔
  rationale: 基本义为“脸、面孔”。保留具体的异象图景，避免直接解释为“人”或“存在者”。
- source_word: ርኢኩ
  choice: 我……看见了
  rationale: 直陈异象中的观看经历；“看见了”符合现代汉语，也不带不必要的古雅色彩。
- source_word: በውእቱ መካን
  choice: 在那地方
  rationale: 回指此前异象中的地点；“那地方”简明自然，并保留原文的空间指向。
- source_word: ኅቡኣተ
  choice: 隐藏的
  rationale: 表达被遮蔽、未显露的状态，保留启示文学的神秘意味，不额外说明隐藏的方式或原因。
theological_decisions:
- issue: 应将ገጻተ具体译为“面孔”，还是解释为“人／存在者”
  choice: 面孔
  alternative: 人；面容
  rationale: 本节极为简短且属于异象叙述，宜保留原文具体而含混的视觉形象。译作“人”会消解这种启示文学意象；“面容”虽可行，但“面孔”更直接对应基本词义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我又”承接前文，“隐藏的面孔”刻意保留原文略显陌生的异象表达，不将其顺译为“隐藏的人”。
