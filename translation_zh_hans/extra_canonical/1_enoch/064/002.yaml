base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/064/002.yaml
  text: And I heard the voice of the angel saying[a], 'These are the angels who came down upon the earth and revealed what was hidden to the children of men[b], and led the children of men astray so that they committed sin.'
translation:
  language: zh_hans
  text: 我听见一位天使说：“这些就是降到地上的天使；他们把隐藏的事揭示给世人[a]，又使世人走入歧途，以致他们犯罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”直译为“人的子孙”，是《以诺书》中泛指人类的说法。
    reason: cultural_note
lexical_decisions:
- source_word: ሰማዕኩ
  choice: 我听见
  rationale: 第一人称完成式，直接表达以诺在异象叙事中的听觉感知。
- source_word: ቃሎ ለመልአክ
  choice: 那位天使的声音
  rationale: ቃል可指“话语”或“声音”；与“听见”连用时译作“声音”最符合现场语境。定指“那位”按该构造的语境功能自然呈现。
- source_word: እንዘ ይብል
  choice: 说
  rationale: 这是引入直接引语的常见叙事结构；简洁译作“说”符合现代汉语。
- source_word: እሉ ውእቶሙ
  choice: 这些就是
  rationale: 保留原文指示兼辨认的语气。
- source_word: መላእክት እለ ወረዱ ዲበ ምድር
  choice: 降到地上的天使
  rationale: 保留天使从上而降的启示文学意象，同时采用自然的现代汉语表达。
- source_word: ወዘበኅቡእ ከሠቱ
  choice: 把隐藏的事揭示
  rationale: 兼顾“被隐藏”与“揭开、显露”的语义对照，不具体限定所揭示内容的性质。
- source_word: ለውሉደ ሰብእ
  choice: 给世人
  rationale: 字面为“人的子孙/人之子女”，在此泛指全人类；“世人”既自然凝练，也保留群体性指称。
- source_word: ወአስሐትዎሙ
  choice: 引诱……走入歧途
  rationale: 该动词表示使人错误、受骗或偏离；此译兼顾诱导过程与道德偏离的结果。
- source_word: ከመ ይግበሩ ኃጢአተ
  choice: 使他们犯罪
  rationale: 原结构可表达目的或结果；“使他们犯罪”保留前后因果关系，而不额外规定其为单纯意图还是最终结果。
theological_decisions:
- issue: 作恶天使的身份
  choice: 仅译作“降到地上的天使”
  alternative: “守望者”或“堕落天使”
  rationale: 吉兹语本节明说“天使”，并未使用“守望者”等称号；不以更广传统替换本节措辞。
- issue: 所揭示隐藏内容的性质
  choice: 译作“隐藏的事”
  alternative: “秘密知识”“奥秘”或具体的禁术
  rationale: 本节没有明确说明内容为何，故保留其开放性，不借上下文或后世解释将其具体化。
- issue: 目的与结果的关系
  choice: 译作“使他们犯罪”
  alternative: “为了叫他们犯罪”或“以致他们犯罪”
  rationale: ከመ结构在此可有目的或结果色彩；采用可涵盖因果与促成意味的汉语，避免过度判定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“降到地上”保留启示文学的空间意象；“隐藏的事”维持原文未具体说明的含混性。主文中的脚注标记[a]与脚注完全对应。
