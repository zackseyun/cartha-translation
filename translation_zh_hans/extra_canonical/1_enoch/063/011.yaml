base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/011.yaml
  text: And after this[a], their faces will be filled with darkness and shame before that Son of Man, and they will be driven away from before his face[c][b], and a sword will abide before his face in their midst.
translation:
  language: zh_hans
  text: 此后，在那位人子[b]面前，他们的脸必布满黑暗和羞耻；他们必从他面前被赶走；一把剑必留在他们中间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本任务所给的转录文本在末句“在他们中间”之前还有“在他面前”；但 Charles 1906 的校本文本及其他主要文本见证没有这几个词，它们很可能是从上一分句误重复而来。若按所给转录直译，则作：“一把剑必在他面前、在他们中间存留。”
    reason: textual_variant
  - marker: b
    text: “人子”在《以诺一书》的《比喻篇》中是对那位末世人物的固定称呼；这里保留本书自身的称谓，不以新约后来的用法反向解释。
    reason: cross_reference
lexical_decisions:
- source_word: ይመልእ ገጾሙ
  choice: 他们脸上必布满
  rationale: 按结果状态理解该动词结构，以“脸上必布满”自然表达“他们的脸将被……充满”，同时保留鲜明的面容意象。
- source_word: ጽልመተ ወኃፍረተ
  choice: 黑暗和羞耻
  rationale: 直译两个并列名词，不限定“黑暗”究竟是外在景象、内在感受还是象征。
- source_word: በቅድመ
  choice: 站在……面前
  rationale: 此处用“站在……面前”使现代汉语顺畅，并保留受审者暴露在审判者面前的空间关系；后句同一介词则译为“从他面前”。
- source_word: ዝኩ ወልደ እጓለ እመሕያው
  choice: 那位人子
  rationale: “那位”对应指示成分，并表明这里指上下文中已经确立的特定末世人物；“人子”保留本书用语。
- source_word: ይሰደዱ
  choice: 要……被赶走
  rationale: 保留被动和审判语境，避免改成主动逃离。
- source_word: ሰይፍ
  choice: 一把剑
  rationale: 原词未明确指向一把已知的剑，故采用不定表达。
- source_word: የኃድር
  choice: 必留
  rationale: 表达持续停留或存留，而非一次性的挥击。
- source_word: ማእከሎሙ
  choice: 在他们中间
  rationale: 保留空间意象，也不进一步断定剑与受审者之间的具体关系。
theological_decisions:
- issue: “人子”是称号还是泛指普通人
  choice: 译作“那位人子”
  alternative: “那个人”或“那位人类之子”
  rationale: 《比喻篇》的上下文把该短语用于一个特定的末世人物；采用传统且可识别的“人子”，但不借此加入后期基督教教义解释。
- issue: 末句是否含“在他面前”
  choice: 正文采用“有一把剑必留在他们中间”
  alternative: “有一把剑必在他面前、在他们中间存留”
  rationale: 所据 Charles 1906 的可靠正文及其他文本见证在末句仅有“在他们中间”；提示所给转录中的“在他面前”很可能是由上一分句重复而来，因此正文不纳入该短语，并以脚注交代。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“必”“要”体现预告和审判语气；分号划分两个相连的审判场景。正文优先依据经校核的吉兹语文本证据，并用脚注保存转录异文。
