base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/005.yaml
  text: And they said[a], “Who has given us rest[c][b], that we should praise and thank and believe before your glory?”
translation:
  language: zh_hans
  text: 他们说：“谁曾赐给我们安歇[a]，使我们能在你的荣耀面前赞美他、感谢他[b]，并且相信呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安歇”也可译作“喘息”或“暂得解脱”；这里指在审判之下得到片刻缓解。
    reason: lexical_alternative
  - marker: b
    text: 原文“赞美”和“感谢”两个动词都带“他”这一第三人称阳性单数宾语，但句末却说“你的荣耀”；译文保留了这种人称转换。
    reason: textual_grammar
lexical_decisions:
- source_word: መኑ
  choice: 谁
  rationale: 疑问代词引出反问；现代汉语用“谁”最直接自然。
- source_word: ወሀበነ
  choice: 曾赐给我们
  rationale: 该动词表示“给予、赐予”；“曾”配合反问，传达说话者追问是否有谁赐下过这种安歇，而不改变原文的完成性语气。
- source_word: ዕረፍተ
  choice: 安歇
  rationale: 该名词可指休息、安息或暂得喘息。“安歇”既保留庄重语体，也与受审判者得不到片刻缓解的语境形成鲜明对照。
- source_word: ከመ
  choice: 使我们能
  rationale: 表达目的或结果；“使我们能”在汉语中自然地连接所赐的安歇与后面的赞美、感谢和相信。
- source_word: ንሰብሖ
  choice: 赞美他
  rationale: 动词意为赞美或荣耀，并带第三人称阳性单数宾语后缀；因此明译“他”。
- source_word: ወናአኵቶ
  choice: 感谢他
  rationale: 动词表示感谢、称谢，也带第三人称阳性单数宾语后缀；“感谢他”准确保留其语法信息。
- source_word: ወንእመን
  choice: 并且相信
  rationale: 此处是አምነ的基本词干，通常表示相信、信赖；原文没有明说所信的对象，因此汉译也不补出宾语。
- source_word: ቅድመ
  choice: 在……面前
  rationale: 比逐字的“在……之前”更符合这里处于神圣荣耀临在中的空间及审判语境。
- source_word: ስብሐቲከ
  choice: 你的荣耀
  rationale: 该词属于荣耀、荣光、光辉的语义范围；“你的荣耀”保留第二人称称呼及启示文学中的临在意象。
theological_decisions:
- issue: 审判之下问句的语气
  choice: 保留为绝望的反问：说话者并未得到安歇，不能在荣耀面前赞美、感谢并相信。
  alternative: 把它理解为单纯询问是谁赐下了敬拜所需的闲暇。
  rationale: 本章语境是受审判的君王和权势者哀叹毫无解脱；译文保留问句，不把其中的审判张力改写成解释性陈述。
- issue: “赞美他、感谢他”与“你的荣耀”之间的人称转换
  choice: 按原文保留第三人称宾语“他”和第二人称所有格“你的”。
  alternative: 为使指称统一，全部译成第二人称“赞美你、感谢你”，或省略“他”。
  rationale: 前两个动词所带的第三人称阳性单数宾语后缀与末尾第二人称形式构成真实的语法人称张力；不应在翻译中擅自统一。
- issue: ወንእመን的含义
  choice: 译为“并且相信”，不补明相信的对象。
  alternative: 译为“承认”或“宣认”。
  rationale: 该形式更直接对应“相信、信赖”的基本词干，也呼应本章相关语句；同时不补宾语，以免替原文解决信仰对象未明的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。问句保持哀叹和反问色彩；并列的“赞美、感谢、相信”保留原文三重节奏。对原文明确的宾语后缀予以明译，同时用脚注说明其与第二人称称呼之间未经调和的人称张力。
