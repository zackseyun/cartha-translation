base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/008.yaml
  text: And on the day of our distress and our affliction[a], he will not save us, and we shall find no rest to believe that our Lord is faithful in all his works and in his judgments and his righteousness[c][b], and his judgments show no partiality.
translation:
  language: zh_hans
  text: 在我们困苦、患难的日子，他必不拯救我们；我们也找不到安息，也不能相信[a]，因为我们的主在他一切的作为、审判和公义上都是信实的[c]；他的审判都不徇情面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “找不到安息，也不能相信”在吉兹文中的句法较难确定。也可理解为“找不到可以信靠的安息”或“没有可供盼望的喘息”。
    reason: alternative_reading
  - marker: b
    text: 末句直译涉及“不抬举脸面”的说法，这是指审判时不偏袒人、不徇情面。
    reason: lexical_alternative
  - marker: c
    text: 本句的标点和并列关系也可理解为：“我们的主在他一切的作为和审判上都是信实的；他的公义和审判不徇情面。”
    reason: syntactic_alternative
lexical_decisions:
- source_word: በዕለተ ስራሕነ ወምንዳቤነ
  choice: 在我们困苦、患难的日子
  rationale: 保留“日子”的末世审判语感，并将两个苦难名词分别译为“困苦”和“患难”，避免无根据地明确为刑罚。
- source_word: ኢያድኅነነ
  choice: 他必不拯救我们
  rationale: 该动词表示拯救或解救；“拯救”简洁庄重，也符合审判语境。
- source_word: ኢንረክብ ዕረፍተ
  choice: 我们也找不到安息
  rationale: 直译“找不到安息”，保留其存在性和审判性的分量。
- source_word: ንእመን
  choice: 来相信
  rationale: 原文在此处的句法困难；正文保留“相信”的不顺畅连接，不擅自改写为过去时“我们曾信靠”。
- source_word: መሃይምን
  choice: 信实的
  rationale: 表达主在作为与审判中的可靠、忠信，语体庄重而易懂。
- source_word: ምግባሩ
  choice: 他的作为
  rationale: 涵盖广泛的行动，符合神学与审判语境。
- source_word: ኵነኔሁ
  choice: 他的审判
  rationale: 此词在本节出现两次；末句谓语为复数，中文以“审判都”自然体现其复数或分布意义。
- source_word: ጽድቁ
  choice: 他的公义
  rationale: 明确保留原文列举中的第三项，不将其并入“审判”或遗漏。
- source_word: ገጹ … ኢይነሥኡ
  choice: 不徇情面
  rationale: 原文直译涉及“不抬举脸面”的司法习语；中文“不徇情面”自然传达不偏袒、不看情面的含义。
theological_decisions:
- issue: 困难短语 ኢንረክብ ዕረፍተ ንእመን 的含义
  choice: 我们也找不到安息来相信
  alternative: 我们找不到可以信靠的安息；我们没有可供盼望的喘息；我们找不到安息，也不相信
  rationale: 吉兹文的句法含混，且此处缺乏充分的外部文本校勘依据。正文保留最贴近字面的可行表达，脚注列出较通顺的理解，不把“相信”擅改为过去时。
- issue: 末句审判公式的含义
  choice: 他的审判都不徇情面
  alternative: 他的审判是公义的，不抬举人的脸面
  rationale: 译出司法习语的实际意义，同时以“都”反映复数谓语所支持的分布性或复数理解。
- issue: 作为、审判、公义三项的句法关系
  choice: 在他一切的作为、审判和公义上都是信实的
  alternative: 在他一切的作为和审判上都是信实的；他的公义和审判不徇情面
  rationale: 将 ጽድቁ 明确保留为列举的第三项，同时用脚注承认标点和句法切分仍有另一可能。
translation_notes:
  register: 采用现代、庄重而可诵读的简体中文。“找不到安息来相信”刻意保留原文的句法张力，并以脚注帮助普通读者；其余部分避免生硬逐词对应，以自然司法用语表达原文习语。
