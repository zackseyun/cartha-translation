base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/007.yaml
  text: For before him we did not believe[a], and we did not praise the name of the Lord of Spirits[a][b], [and we did not praise our Lord,] and our hope was in the scepter of our kingdom and in our glory.
translation:
  language: zh_hans
  text: 因为我们在他面前并未信靠，也未赞美万灵之主的名[a]，[也未赞美我们的主，][b]；我们的盼望却在于我们国度的权杖[c]和自己的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所供转录在“信靠”和“赞美”处呈肯定形式，但校勘记录认为这是转录时漏失吉兹语否定前缀 ኢ 所致；据此译作“并未信靠……也未赞美”。若按所供转录的表面形式，则可译作“信靠……也赞美”。
    reason: textual_variant
  - marker: b
    text: 方括号内“也未赞美我们的主”这一分句在所供见证中的文本地位不确定，可能是异文或后来的增补。
    reason: textual_variant
  - marker: c
    text: “权杖”所译的词也可指“杖”或“棍”；这里与“国度”连用，采用象征王权的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 承接上下文，说明这些君王哀叹和认罪的缘由；“因为”自然保留其因果、解释作用。
- source_word: በቅድሜሁ
  choice: 在他面前
  rationale: 保留原文的空间与关系含义，也契合审判场景；不将其弱化为泛指的“对他”。
- source_word: ኢአመነ（校勘读法；所供转录作 አአመነ）
  choice: 并不相信
  rationale: 校勘意见指出所供转录漏失否定前缀 ኢ；本章语境中，君王承认自己未曾相信上主，随后又承认把盼望寄托于自己的王权和荣耀。
- source_word: ወኢሰባሕነ ለስሙ（校勘读法）
  choice: 也不赞美……的名
  rationale: “赞美……的名”直接保留闪语式敬虔表达，并与下一分句的同一动词保持一致。
- source_word: እግዚአ መናፈስት
  choice: 万灵之主
  rationale: 这是《以诺一书》中反复出现的神圣称号；“万灵之主”在现代汉语中庄重自然，并表达诸灵之主的含义。
- source_word: ወኢሰባሕናሁ ለእግዚእነ（校勘读法；该分句在见证中带方括号）
  choice: '[也不赞美我们的主，]'
  rationale: 保留该分句，同时用方括号如实显示其文本地位不确定，不擅自删去或并入正文。
- source_word: ወተስፋነ ኮነ ዲበ
  choice: 我们所盼望的，却是
  rationale: 表达盼望所寄托的对象；“却”显明与前面未相信、未赞美上主之间的对照，但不额外解释其动机。
- source_word: በትረ መንግሥትነ
  choice: 我们国度的权杖
  rationale: በትር 可指杖、棍或权杖；与“国度”连用时，王权象征最为贴切，也保留具体的君王意象。
- source_word: ስብሐቲነ
  choice: 自己的荣耀
  rationale: 可表示荣耀、光彩或尊荣；此处“荣耀”恰当地呈现君王对自身地位的倚恃。“自己的”避免连续两个“我们的”造成生硬，同时不改变所指。
theological_decisions:
- issue: 动词应取肯定还是否定读法
  choice: 采用否定读法：“并不相信……也不赞美”
  alternative: 采用所供转录表面的肯定读法：“相信……赞美”
  rationale: 所附校勘记录指出转录过程中把否定前缀 ኢ 误识为 አ；否定读法也与本章受审君王承认自己倚靠王权和荣耀的语境一致。脚注公开说明这一文本问题，而不把校勘结果伪装成无争议读法。
- issue: 是否把“相信”解释为某种特定教义意义上的信心
  choice: 直译为“相信”
  alternative: 译为“归信”“有得救的信心”或“信靠”
  rationale: 原动词本身可涉及相信或信赖，但本节没有界定其系统神学含义；采用一般性的“相信”，保留原文张力。
- issue: 如何处理君王盼望的对象
  choice: 保留“国度的权杖”和“自己的荣耀”这两个具体意象
  alternative: 概括为“自己的权力和地位”
  rationale: 具体意象构成对世俗王权的启示文学批判；若抽象化，会损失原文的王权象征和修辞力度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“万灵之主”作为全书反复出现的称号保持凝练；分号区分对上主的失职与对自身王权、荣耀的倚恃。“却”只标明原句内在对照，不扩写审判含义。所有文本不确定性均以正文标记和脚注呈现。
