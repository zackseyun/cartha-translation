base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/001.yaml
  text: In those days the mighty ones and the kings who possess the dry land shall beg the angels of punishment[a], into whose hands they have been delivered, that they might give them a little respite, so that they may fall down and worship before the Lord of Spirits[c][b], and confess their sins before him.
translation:
  language: zh_hans
  text: 在那些日子，掌控陆地[a]的权势者和君王将恳求施行惩罚的天使——他们已被交在这些天使手中[b]——给他们片刻喘息[c]，使自己得以俯伏敬拜万灵之主，并在他面前承认自己的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“掌控土地／大地”。原文直指“干地、陆地”，在这里很可能含有统治地上疆域的意思。
    reason: lexical_alternative
  - marker: b
    text: 本句在现存埃塞俄比亚文本中较难确定；大意似乎是这些被定罪的统治者已被交给天使看管。
    reason: textual_variant
  - marker: c
    text: “片刻喘息”指短暂而有限的缓解，并不表示他们可免受审判。
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留启示文学中反复出现的复数时间套语，表达自然而庄重。
- source_word: ዓዚዛን
  choice: 权势者
  rationale: 与“君王”并列时，指其他有权有势的人；既保留其社会政治意味，也不擅自限定具体官阶。
- source_word: ነገሥት
  choice: 君王
  rationale: 直接保留王权称号，并与“权势者”形成原文的并列结构。
- source_word: እለ ይእኅዝዋ ለየብስ
  choice: 掌控陆地
  rationale: “陆地”保留与海相对的具体空间意象；“掌控”同时传达持有、占有及统治的语义可能。
- source_word: እመላእክት መቅሠፍት
  choice: 施行惩罚的天使
  rationale: 清楚表达属格结构在审判语境中的功能，避免“刑罚天使”在现代汉语中的生硬感。
- source_word: በኀበ ሀለዉ ምጥዋነ
  choice: 他们已经被交在这些天使手中
  rationale: 该句在埃塞俄比亚文本中较难确定；此译文按审判语境表达受刑者已落入天使监管之下，同时以脚注保留文本困难。
- source_word: ከመ የሀቦሙ ዕረፍተ ንስቲተ
  choice: 给自己片刻喘息
  rationale: “片刻”表达时间短暂，“喘息”表达有限缓解；不暗示获释或刑罚终止。
- source_word: ከመ ይደቁ ወይስግዱ
  choice: 俯伏敬拜
  rationale: 以简洁而有身体感的表达传达两个并列动词所强调的降服姿态。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 作为《以诺一书》中固定的神圣称号，采用凝练、庄重且不附加后期教义解释的译法。
- source_word: ወይትአመኑ ኃጢአቶሙ
  choice: 承认自己的罪
  rationale: 传达在审判者面前公开认罪的含义，同时不预断这种承认是否出于真诚悔改。
theological_decisions:
- issue: 君王与权势者的请求是否表示真诚悔改
  choice: 只陈述他们请求短暂缓解，以便俯伏敬拜并承认罪恶，不说明其悔改是否真诚或蒙接纳。
  alternative: 将其明确解释为真诚悔改，或明确解释为审判压力下被迫认罪。
  rationale: 原文报告他们所求和打算采取的行动，却没有交代内心转变或上帝是否接纳，因此保留经文本身的张力。
translation_notes:
  register: 采用现代标准汉语，语气庄重而清楚。“权势者”“君王”“万灵之主”保留启示文学的正式色彩；将过长的原文句式分为两句，以免代词关系含混。所有脚注标记均紧接其所说明的词句。
