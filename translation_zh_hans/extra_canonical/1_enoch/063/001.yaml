  to: 在那些日子，掌控陆地[a]的权势者和君王将恳求施行惩罚的天使——他们已被交在这些天使手中[b]——给他们片刻喘息[c]，使自己得以俯伏敬拜万灵之主，并在他面前承认自己的罪。
  rationale: 修订只调整句法和指代，不改变经文含义。将“给他们片刻喘息”恢复为“恳求”的直接内容，避免重复；以破折号保留难句作为插入说明，并保留文本困难脚注。以“使自己得以”明确俯伏、敬拜和认罪的主体是受审判的统治者，同时不判断其认罪是否真诚或是否蒙接纳。
