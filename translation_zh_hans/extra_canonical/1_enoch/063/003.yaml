base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/003.yaml
  text: And your power is blessed in every hidden thing throughout all generations[a], and your glory forever and ever. Deep are all your hidden things, and they are without number[c][b]; and your righteousness is beyond reckoning.
translation:
  language: zh_hans
  text: 你的能力在一切隐秘之事中发光，世世代代如此[a]；你的荣耀存到永永远远。你一切隐秘之事都深不可测，数不胜数；你的公义也无法估量[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切隐秘之事”也可译作“一切隐藏之物”；这里不是“你隐秘的能力”，而是“你的能力在一切隐秘之事中发光”。
    reason: 句法与词义说明
  - marker: b
    text: “公义”也可译作“正义”。
    reason: 词义备选
lexical_decisions:
- source_word: ይበርህ
  choice: 发光
  rationale: 该词是በርሀ“发光、明亮”的未完成式，而非“赐福”的动词；译作“发光”保留颂赞语境中的光辉意象。
- source_word: በኵሉ ኅቡእ ኃይልክ
  choice: 你的能力在一切隐秘之事中
  rationale: 按句法将ኃይልክ作主语“你的能力”，将በኵሉ ኅቡእ作范围短语“一切隐秘之事中”，避免误解为“你隐秘的能力”。
- source_word: ለትውልደ ትውልድ
  choice: 世世代代如此
  rationale: 自然表达持续贯穿历代的时间范围。
- source_word: ስብሐቲከ
  choice: 你的荣耀
  rationale: 颂赞语境中指神的荣耀或光辉；“荣耀”兼顾庄重与通俗。
- source_word: ለዓለመ ዓለም
  choice: 直到永永远远
  rationale: 以现代中文中庄重而熟悉的表达传达加强的永久意义。
- source_word: ዕሙቅ ውእቱ ኵሉ ኅቡኣት ዚአከ
  choice: 你一切隐秘之事都深不可测
  rationale: “深”在此表示深奥难测；补出“不可测”使中文自然，同时不把“隐秘之事”具体解释为奥秘或作为。
- source_word: ወኍልቈ አልቦሙ
  choice: 数不胜数
  rationale: 准确传达“没有数目、不可计数”的习语意义。
- source_word: ጽድቅ ዚአከ
  choice: 你的公义
  rationale: 在颂赞神之属性的语境中，“公义”较“正义”更能兼含正直与公平，后者仍属可能译法。
- source_word: ኃሳበ አልቦ
  choice: 无法估量
  rationale: 原语直指无法计算或核算；“无法估量”保留不可计量之意，也符合中文诗性语体。
theological_decisions:
- issue: 开篇动词应译为“发光”还是“蒙福／当受称颂”
  choice: 发光
  alternative: 蒙福；当受称颂
  rationale: 原文ይበርህ源自“发光、明亮”的词根；采用“发光”以原文形态和句法为先，不沿用由相近转写造成的祝福义。
- issue: 是否把ኅቡእ／ኅቡኣት解释为“秘密”或“奥秘”
  choice: 隐秘之事
  alternative: 秘密；奥秘
  rationale: 原文保持宽泛的“隐藏之物／事”；直译可保留它究竟指神的计划、作为还是知识的开放性。
- issue: ጽድቅ应译为“公义”还是“正义”
  choice: 公义
  alternative: 正义
  rationale: 本节赞颂的是神的品格，并非只描述一项审判行为；“公义”较贴合语境，同时脚注保留司法色彩较强的译法。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。以“发光”纠正将开篇动词误作“蒙福”的旧解；保留“隐秘之事”的宽泛性，不擅自具体化为某类神学奥秘。
