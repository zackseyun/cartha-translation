base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/010.yaml
  text: Now they will say to them[a], ‘Our soul has had its fill of unjust gain[d][c][b], but it does not keep us from going down from the midst of it into the burden of Sheol.’
translation:
  language: zh_hans
  text: 现在，他们要对他们说[a]：“我们的灵魂因不义之财[b]而饱足，但这财物并不能阻止我们从其中下到阴间[c]的重压之中[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词带有“对他们”的复数宾语后缀。按本章上下文，这些人很可能是在对执行惩罚的天使说话。
    reason: 语法与指代说明
  - marker: b
    text: “不义之财”所据的吉兹语短语在文本和词义上都较难确定，也可理解为“藉恶行所得的财富”或较广义的“不义财富”。
    reason: 词义异文
  - marker: c
    text: “阴间”指古代犹太思想中的死者领域，不宜直接等同于后期观念中的“地狱”，也不只是坟墓。
    reason: 文化与神学术语说明
  - marker: d
    text: 或译“阴间的重量（沉重）”。原文保留一种受压迫般下降的意象。
    reason: 词义异译
lexical_decisions:
- source_word: ይእዜ
  choice: 现在
  rationale: 作为时间性话语标记，引出受审者此刻的醒悟和陈述；“现在”简洁地保留了场景的戏剧性转折。
- source_word: ይብልዎሙ
  choice: 他们要对他们说
  rationale: 动词未完成时适合表达预告性的将来话语，宾语后缀 -ዎሙ 明确表示“对他们”；译文保留这一指向，而不在正文中擅自确定所指。
- source_word: ትጸግብ ነፍስነ
  choice: 我们的灵魂……饱足
  rationale: 原文以单数“灵魂”配合复数领属，表达群体共同的内在生命；“饱足”保留吃饱、餍足的意象及其反讽意味。
- source_word: እምጥየየ ዐመፃ
  choice: 因不义之财
  rationale: 该短语在词义和文本上均有困难，似乎指以不义手段取得的财富或收益；“不义之财”兼顾物质含义与道德判断，又不限定具体取得方式。
- source_word: ወኢትከልእ
  choice: 但这财物并不能阻止我们
  rationale: 原词表示拦阻或防止。中文补出“这财物”承接前句，使指代自然，同时保留财富无力免除审判的含义。
- source_word: ወረደተነ
  choice: 我们……下坠
  rationale: 保留“下降、下去”的动态意象；“下坠”比单纯“下去”更能传达走向地下死者领域的沉重感。
- source_word: እምልባ
  choice: 从其中
  rationale: 该介词短语含义不够确定，可能指从财富或现有处境的内部出去；采用透明而不作过度解释的译法。
- source_word: ለክበደ ሲኦል
  choice: 进入阴间的重压之下
  rationale: 保留“重量、沉重、重负”的具体压迫意象，并用“进入……之下”自然表达下降的方向。
- source_word: ሲኦል
  choice: 阴间
  rationale: “阴间”在现代中文圣经语境中可表达古代犹太观念中的死者领域，比“地狱”较少引入后期刑罚教义，也比“坟墓”更能保留其宇宙空间意味。
theological_decisions:
- issue: 死者领域术语的译法
  choice: 阴间
  alternative: 示奥勒／地狱／坟墓
  rationale: 本段属于古代犹太启示文学。“阴间”既保留死者领域的含义，又避免把原词缩减为实体坟墓或等同于后期神学中的“地狱”；脚注补明其范围。
- issue: 不义财富能否免除审判
  choice: 保留财富“不能阻止”下降的表述
  alternative: 解释为财富本身导致他们下降
  rationale: 原句强调财富无法拦阻其下降，并未明确说财富是下降的直接原因；译文不替原文消解这一神学张力。
- issue: “他们”所指
  choice: 正文保留代词，脚注说明上下文可能所指
  alternative: 正文直接译作“惩罚的天使”
  rationale: 原动词明确有复数宾语，却未在本节内部明说其身份；保留代词可避免把上下文推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文尽量保存原句的重复代词、集体单数“灵魂”、下降方向和“重压”意象；对不确定的指代与罕见词组不在正文中过度释义，而以脚注交代。
