base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/004.yaml
  text: Now we know that we ought to praise and bless the Lord of the kings[b][a], and the one who reigns over all the kings.
translation:
  language: zh_hans
  text: 现在我们知道，我们理当赞美并称颂[a]众王之主[b]，以及那位统治所有君王的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“让我们赞美并称颂。”吉兹文的动词形式可以带劝勉或虚拟语气。
    reason: lexical_alternative
  - marker: b
    text: 原文直称“众王之主”，并非传统上压缩表达的“万王之王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜ
  choice: 现在
  rationale: 作为时间副词，标示说话者此刻才有的认识，也保留话语的转折。
- source_word: አእመርነ
  choice: 我们知道
  rationale: 第一人称复数形式表达已经获得的认识；现代汉语“我们知道”自然，并可由“现在”传达新近醒悟之意。
- source_word: ከመ
  choice: （不单独译出）
  rationale: 该词引出所认识的内容；汉语以“知道”直接带宾语分句最自然，无须硬译“即”。
- source_word: ንሰብሖ ወንባርኮ
  choice: 我们理当赞美并称颂
  rationale: 这些第一人称复数动词可带意愿式或虚拟式意味；“理当”在审判与悔悟语境中突出如今承认的本分，同时以脚注保留劝勉式读法。
- source_word: ለእግዚኦሙ ለነገሥት
  choice: 众王之主
  rationale: 直译其主权称号，并保留“主”与“王”的区别；不压缩成传统称号“万王之王”。“众王”在汉语中自然指这一整类君王。
- source_word: ወለዘ ይነግሥ ዲበ ኵሎሙ ነገሥት
  choice: 就是那位统治所有君王的
  rationale: 关系结构及现在时态强调持续施行的普遍统治。“统治”保留对地上君王的支配意象；“就是”自然呈现后半句与前一称号的同位关系。
theological_decisions:
- issue: 是否将王权称号译成后世熟悉的固定公式
  choice: 众王之主，就是那位统治所有君王的
  alternative: 万王之王
  rationale: 吉兹文先称“众王之主”，随后另以关系从句说明他统治所有君王。保留两部分，既避免引入原文没有的固定公式，也保存其层递式宣告。
- issue: 第一人称复数动词的语气
  choice: 我们理当赞美并称颂
  alternative: 让我们赞美并称颂；我们将要赞美并称颂
  rationale: 审判语境中的说话者承认自己如今才明白何为应尽之分。“理当”保留义务意味，但原文也可能带劝勉或意愿色彩，故以脚注标明。
- issue: 后半句与“众王之主”的句法关系
  choice: 以“就是”呈现同位说明
  alternative: 以“并且”连接为两个并列对象
  rationale: 两种理解在语义上接近；汉语若直译“并且那位”容易误读为两个受赞美者。“就是”保留同一位主的双重描述，而不削弱原文两部分的结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“理当”表达醒悟后的义务感；“称颂”与“赞美”形成自然的宗教文体搭配。脚注标记依英文咨询层的次序置为[b][a]：前者紧随王权称号，后者说明此前动词短语的语气。
