  rationale: 仅作安全的文体和语义细化：将“是当受称颂的”改为“是蒙福的”，以更自然地呈现原文的宣告性祝颂；将“也是智慧之主”改为“是智慧之主”，使各称号保持一致的排比反复。其余译文及脚注均可保留。
