base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/002.yaml
  text: And they will bless and praise the Lord of spirits, and they will say, “Blessed is the Lord of spirits, and the Lord of the kings, and the Lord of the mighty, and the Lord of the rich, and the Lord of glory, and the Lord of wisdom.”
translation:
  language: zh_hans
  text: 他们要称颂、赞美万灵之主，并且说：“万灵之主是蒙福的；他是众王之主，是有权势者之主，是富有者之主，是荣耀之主，是智慧之主。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“众王、有权势者、富有者、荣耀、智慧”各项前都重复“主”，形成庄严的颂赞节奏；译文保留这一反复结构。
    reason: cultural_note
  - marker: b
    text: “富有者”也可理解为拥有财富或产业的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይባርክዎ ወይሴብሕዎ
  choice: 称颂、赞美
  rationale: 两个并列动词分别表达祝颂与赞美；保留并行结构，并以现代中文自然表达。
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 这是《以诺一书》中反复出现的神圣称号。“万灵”自然传达诸灵的广泛范围，“之主”保留庄严而稳定的称号形式。
- source_word: ቡሩክ ውእቱ
  choice: 是当受称颂的
  rationale: 按述谓句理解为宣告，而不是愿望式的“愿……受称颂”；中文补出“当受”以表达祝颂语的自然语义。
- source_word: እግዚኦሙ ለነገሥት
  choice: 众王之主
  rationale: 表达对众王的主权，并保持后续“……之主”的反复句式。
- source_word: ዐዚዛን
  choice: 有权势者
  rationale: 语境指有力量或权势的人；比单纯的“强壮者”更符合审判场景中的社会政治含义。
- source_word: ብዑላን
  choice: 富有者
  rationale: 本词可指拥有财富或产业的人；“富有者”既清楚，也避免过度口语化。
- source_word: እግዚአ ስብሐት
  choice: 荣耀之主
  rationale: ስብሐት 可涵盖荣耀、光辉和赞美；此处“荣耀”最适合末世异象的庄严语域。
- source_word: እግዚአ ጥበብ
  choice: 智慧之主
  rationale: ጥበብ 广义指智慧；这一译法简洁，并保留抽象名词称号的结构。
theological_decisions:
- issue: 如何翻译反复出现的神圣称号 እግዚአ መንፈሳት
  choice: 万灵之主
  alternative: 诸灵之主／灵界之主
  rationale: “万灵之主”既保留其宇宙性范围和固定称号性质，也不把“灵”限定为某一类灵体。
- issue: ቡሩክ ውእቱ 是祝愿还是宣告
  choice: 万灵之主是当受称颂的
  alternative: 愿万灵之主受称颂
  rationale: 原句更自然地表示述谓性宣告；采用“是当受称颂的”以避免擅自改成祈愿句。
- issue: 各类掌权者及抽象属性与“主”的关系
  choice: 保留每项“……之主”的反复结构
  alternative: 压缩为“众王、有权势者、富有者、荣耀和智慧的主”
  rationale: 原文逐项重复“主”，突出神对每一类对象的主权，并形成庄严的颂赞节奏；不把它系统化解释为不同性质的主权。
translation_notes:
  register: 采用现代、庄严而易懂的书面汉语。“称颂、赞美”保留原文并列；引语中用分号区分总宣告与随后逐项展开的称号，并以“是／也是”使中文连贯，同时保存原文的重复和礼仪性节奏。
