base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/009.yaml
  text: And we pass away from before his face because of our deeds[c][b][a], and all our sins are counted in righteousness.
translation:
  language: zh_hans
  text: 因我们的所作所为，我们从他面前离去[a]；我们一切的罪都按公义被数算[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“我们从他的脸前离去”；也可理解为“我们离开他的同在”。
    reason: lexical_alternative
  - marker: b
    text: “按公义被数算”也可译作“被公正地数算”或“在公义中被记入账中”。原文带有司法核算的意味，但“公义”在句中的确切关系并不完全明确。
    reason: alternative_reading
lexical_decisions:
- source_word: ወነኀልፍ
  choice: 我们……离去
  rationale: 该动词可表示经过、离开或消逝；与“从他面前”连用时，译作“离去”最自然，也避免直接断定为肉身死亡。
- source_word: እምገጹ
  choice: 从他面前
  rationale: 字面为“从他的脸面前”，保留闪族式的具体临在意象，同时符合现代汉语表达。
- source_word: በእንተ ምግባሪነ
  choice: 因我们的所作所为
  rationale: 该短语表示原因；“所作所为”自然地涵盖行为、作为和行径，并适合此处认罪式语境。
- source_word: ወኵሉ ኃጢአትነ
  choice: 我们一切的罪
  rationale: 直接保留“所有、全部”的总括意味。
- source_word: በጽድቅ
  choice: 按公义
  rationale: 既可表达以公义为衡量标准，也不完全排除“公正地”的方式含义，适合司法语境。
- source_word: ትኈለቍ
  choice: 被数算
  rationale: 该词表示计算、清点或记账；“数算”保留审判中的核算意象，而不擅自改译为定罪或惩罚。
theological_decisions:
- issue: 是否将“从他面前”抽象化为“离开他的同在”
  choice: 从他面前离去
  alternative: 离开他的同在
  rationale: 保留原文具体而强烈的“面前”意象，不把末世审判场景抽象化。
- issue: 罪与公义之间司法性短语的确切关系
  choice: 我们一切的罪都按公义被数算
  alternative: 我们一切的罪都被公正地数算／都在公义中被数算
  rationale: 原文具有司法和核算色彩，但“公义”究竟强调标准、领域还是方式并不完全明确；正文采用自然的“按公义”，并以脚注保存其他可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“所作所为”保留认罪语气；“从他面前”保存原文具体意象；分号体现两个紧密相关的审判陈述。
