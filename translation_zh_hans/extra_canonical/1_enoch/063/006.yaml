base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/006.yaml
  text: Now we desire a little rest[a], but we do not find it; we are driven away, and we cannot seize it, and the light has passed away from before us[c][b], and darkness will be our dwelling forever and ever.
translation:
  language: zh_hans
  text: 如今，我们渴望得到片刻安息，却得不到；我们被驱逐，也抓不住它[a]。光已从我们面前消逝，黑暗将永永远远成为我们的居所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抓不住它”原文简短，也可译作“无法把握它”或“无法持守它”；“它”很可能承接前面所说的安息，也可能泛指他们再也得不到的安稳。
    reason: lexical_alternative
  - marker: b
    text: 译作“居所”的词较难确定，也可译作“住处”；这里的意思是，黑暗将成为他们永久的归宿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜኒ
  choice: 如今
  rationale: 作为时间性话语标记，引出受审者当下的哀叹；“如今”自然、庄重，也保留与先前处境的对照。
- source_word: ንስቲተ፡ ዕረፍተ፡ ንትሜነይ
  choice: 我们渴望得到片刻安息
  rationale: 按词形将ንስቲተ理解为修饰“安息”的“一点、少许”，将ንትሜነይ理解为复数第一人称“我们渴望”，避免误解为“我们为自己寻求”。“片刻安息”也呼应本章前文所求的短暂喘息。
- source_word: ወኢንረክብ
  choice: 却得不到
  rationale: 该动词可表示找到、获得或达到；在“渴望得到安息”之后译作“得不到”最合乎现代汉语，同时保留未能获得的含义。
- source_word: ንሰደድ
  choice: 我们被赶逐
  rationale: 采用被动意义，表现审判场景中的驱逐，而非自主漂泊；“赶逐”比“放逐”少一层制度化含义。
- source_word: ወኢንእኅዝ
  choice: 也抓不住它
  rationale: 保留“抓住、把持”的具体动作感；宾语在原文中简约含混，很可能承接所求的安息，故以代词表达而不进一步解释。
- source_word: ወብርሃን፡ እምቅድሜነ፡ ኀለፈ
  choice: 光已从我们面前消逝
  rationale: 保留“从我们面前”的空间意象，并以“消逝”传达光已经离去、不可挽回的庄严语气。
- source_word: ወጽልመት፡ ምኅባሪነ
  choice: 黑暗将……成为我们的居所
  rationale: 困难词ምኅባሪነ在此按居处、住处理解；不把意象缩减为单纯的内心绝望，也不武断限定为纯物理黑暗。
- source_word: ለዓለመ፡ ዓለም
  choice: 永永远远
  rationale: 采用现代中文宗教与庄严叙事中自然的固定表达，传达持续无尽的时间意义。
theological_decisions:
- issue: 失去的“光”与作为居所的“黑暗”具有什么性质
  choice: 保留为审判中的末世性、宇宙性意象，不限定为单一层面的含义。
  alternative: 仅指内心绝望，或仅指实际的物理黑暗。
  rationale: 上下文是受审者的哀叹；光与黑暗可能兼具道德、处境和末世审判的意味。直保留意象最能维护原文的神学张力。
- issue: “抓不住它”的所指
  choice: 以“它”保留简约承接，倾向指前述安息而不在正文中明说。
  alternative: 明确补译为“抓不住安息”或理解为无法获得安全。
  rationale: 原句措辞简短，所指并非完全明示；使用代词既使中文可读，也避免过度释义。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。“片刻安息”准确表达“一点安息”，避免把形容词误作“寻求”；分号和句号划分哀求、驱逐与光暗逆转三个层次。措辞力求普通读者易懂，同时保留原文审判诗歌的凝重感和意象张力。
