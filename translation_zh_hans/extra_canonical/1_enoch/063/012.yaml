base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/012.yaml
  text: 'Thus said the Lord of Spirits: "This is the ordinance and the judgment for the mighty."[a][b][c]'
translation:
  language: zh_hans
  text: 万灵之主这样说：“这就是为有权势者所定的条例和审判。”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传本文本的 ይቤ 通常意为“他说”。本译文据此将开头译作引述公式“这样说”；但这一行文字较为紧缩，也有人把它理解为连接性的表达。
    reason: textual_variant
  - marker: b
    text: “为有权势者”也可译作“针对有权势者”；介词在此可表示关系，也可在审判语境中表示所针对的对象。
    reason: lexical_alternative
  - marker: c
    text: 另一种理解是：“因为这就是万灵之主的条例和审判。”这种读法把“万灵之主”看作“条例和审判”的所属者，而不是“说”的主语。
    reason: previous_rendering
lexical_decisions:
- source_word: ከመዝ ይቤ
  choice: 这样说
  rationale: 按传本文本保留引述公式；ከመዝ 表示“如此、这样”，ይቤ 通常表示“他说”。
- source_word: እግዚአ መናፈስት
  choice: 万灵之主
  rationale: 这是《以诺一书》特有且反复出现的神圣称号；“万灵之主”在现代汉语中庄重自然，并表达对众灵的统辖，而不引入后期宗派术语。
- source_word: ዝውእቱ
  choice: 这就是
  rationale: 保留指示兼系词的作用，指向上下文所述的司法裁定。
- source_word: ሥርዓቱ
  choice: 所定的条例
  rationale: 该词可指秩序、规章或法定安排；“条例”保留正式、司法性的语气，“所定的”使现代汉语表达自然。
- source_word: ወኵነኔሁ
  choice: 和审判
  rationale: 保留第二个司法用语的宽泛含义，不收窄为“判刑”，也不强化为“定罪”。词尾在此可起定指作用，故不另译为“他的”。
- source_word: ለዐዚዛን
  choice: 为有权势者
  rationale: 指上下文中受审的强权人物；“有权势者”比“强者”更清楚地传达其社会政治地位。介词 ለ- 的关系方向仍有“为”或“针对”的歧义。
theological_decisions:
- issue: 以诺传统中的神圣称号
  choice: 万灵之主
  alternative: 诸灵之主
  rationale: 保留原文独特的末世启示文学称号；“万灵之主”庄重且易懂，不将其替换为其他神名或后期固定教义用语。
- issue: 审判与有权势者之间的关系
  choice: 为有权势者所定
  alternative: 针对有权势者
  rationale: 主文保留 ለ- 较宽的关系义，同时用脚注说明在审判语境中可能含有敌对、针对之意，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而清晰的简体中文。“万灵之主”维持以诺文献的启示文学语域；“条例和审判”保留原文两个并列的司法名词。主文采用直接引语，并以脚注保存句法和介词上的真实歧义。
