base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/003/001.yaml
  text: Observe and see all the trees[a], how they appear withered, and all their leaves stripped off—except fourteen trees, which do not lose their leaves, but remain from the old until the new comes[c][b], through two and three winters.
translation:
  language: zh_hans
  text: 你们要仔细察看所有的树：它们怎样显得枯萎，叶子全都脱落了；但有十四棵树例外，它们并不落叶，却从“旧的”一直存留到“新的”来临[a]，历经两个和三个冬季[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旧的”和“新的”在原文中没有明说所指，可能是指旧季节或旧年过去，新的季节或年份来到。
    reason: cultural_note
  - marker: b
    text: “两个和三个冬季”是较难确定的说法，也可能意为“两个或三个冬季”，或泛指更新以前接连经历的冬季。
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ፡ ወርእዩ
  choice: 你们要仔细察看
  rationale: 两个复数命令式共同发出观察、辨察的召唤；结合语境，ጠይቁ在此取“仔细观察、考察”义，而不译作“询问”。合译可避免现代汉语中“观察并看”生硬重复，同时保留强调。
- source_word: ኵሎ፡ ዕፀወ
  choice: 所有的树
  rationale: 忠实表达集合性复数，且符合现代汉语的自然说法。
- source_word: እፎ፡ ያስተርእዩ፡ ከመ፡ ይቡስ
  choice: 它们怎样显得枯萎
  rationale: እፎ取“怎样、如何”而非“是否”；“显得枯萎”保留可见外观与干枯状态两层意思。
- source_word: ወኵሉ፡ አቍጽሊሆሙ፡ ንጉፍ
  choice: 叶子全都脱落了
  rationale: 以具体的“叶子”对应叶片或叶丛；“脱落”自然表达树叶被除去、树木变秃的景象，而不额外指定外力。
- source_word: ዘእንበለ፡ ፲ወ፬ ዕፀወ
  choice: 但有十四棵树例外
  rationale: 清楚保留原文的例外结构和明确数目。
- source_word: ዘኢይትነገፉ
  choice: 它们并不落叶
  rationale: 与前文叶子脱落形成直接呼应，也符合现代汉语描述常绿树木的惯用表达。
- source_word: እላ፡ ይጸንሑ
  choice: 而是……延续
  rationale: 表达这些例外树木持续保持原状，并自然衔接后面的时间范围。
- source_word: እምብሉይ፡ እስከ፡ ይመጽእ፡ ኃዲስ
  choice: 从旧的延续到新的来临
  rationale: 保留“旧的／新的”省略其所指的表达，不在正文中武断补成季节或年份。
- source_word: እምክልኤ፡ ወእም፡ ፫ ክረምት
  choice: 历经两个和三个冬季
  rationale: 贴近原文不寻常的并列数词表达；不在正文中强行判定为“两个或三个冬季”。
theological_decisions:
- issue: 是否在正文中把树木和季节意象解释为象征
  choice: 保留为对树木与冬季的直接描述
  alternative: 将树木解释为不同类别的人、属灵群体或宇宙秩序
  rationale: 原文本身要求读者观察受造界，并未在本节明说这些树象征什么；译文不加入宗派性或寓意化解释。
- issue: “旧的”与“新的”具体指什么
  choice: 正文保留省略，以脚注提示可能指旧季节或旧年与新季节或新年
  alternative: 在正文直接译为“从旧年直到新年来临”或“从旧季直到新季来临”
  rationale: 源文的形容词名词化但所指未明，保留这种含混可避免过度释义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“仔细察看”保留命令和观察意味；正文有意保留“旧的／新的”及“两个和三个冬季”的难解之处，并以脚注说明主要可能性。所有脚注标记均置于相关正文之后。
