base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/001.yaml
  text: And in those days I will open the storehouses of blessing that are in heaven[a], so that I may bring them down upon the earth, upon their work and upon their labor[g][f][e][d][c][b], for the children of men.
translation:
  language: zh_hans
  text: 在那些日子，我要打开天上福分的宝库[a]，使福分降到地上，临到世人的工作和劳苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宝库”也可译作“库房”或“府库”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: 在那些日子
  rationale: 这是以诺文学常见的末世时间表达；按原文保留“那些日子”的形式。
- source_word: እፈትሕ
  choice: 我要打开
  rationale: 第一人称单数未完成式在此表示将来；“打开”也自然搭配后面的宝库。
- source_word: መዛግብተ
  choice: 宝库
  rationale: 该词指储藏之处或府库；“宝库”既保留具体的天上储藏意象，也适合与福分搭配。
- source_word: በረከት
  choice: 福分
  rationale: 原文为单数抽象名词，可作集合意义；“福分”在现代汉语中自然，并避免把它仅理解为祝福的话语。
- source_word: በሰማይ
  choice: 天上
  rationale: 原文为单数“天”；此处指天界，译作“天上”自然简洁。
- source_word: አውርዶሙ
  choice: 使福分降到
  rationale: 原词是“下降”的使役形式，并带复数宾语后缀。汉语不宜机械译成“使它们降下”，故依据集合意义的“福分”明确宾语，同时保留使役和下降方向。
- source_word: ግብሮሙ
  choice: 世人的工作
  rationale: ግብር可指工作、行为或劳作；在与后面的“劳苦”并列时，“工作”较能保持两词差别。
- source_word: ፃማሆሙ
  choice: 世人的劳苦
  rationale: ፃማ意为劳苦、辛劳或努力，不是“后裔”或“种子”；“劳苦”准确保留其艰辛意味。
- source_word: ለውሉደ፡ ሰብእ
  choice: 世人
  rationale: 字面为“人的儿女”，是传统习语；“世人”在现代汉语中自然地表达全体人类，不暗示仅指男性。
theological_decisions:
- issue: 第一人称说话者的身份
  choice: 保留“我”，不在正文中补出身份
  alternative: 明确译成“上帝要……”或说明是天使说话
  rationale: 上下文很可能指至高者发言，但本节本身没有说出称号；不补名可避免把上下文判断写进正文。
- issue: “福分”的单复数
  choice: 用单数集合意义的“福分”
  alternative: 译作“各样福分”或“诸福”
  rationale: 原文名词为单数，但后续动词带复数宾语后缀，显示它可以集合性地涵盖多重恩惠；汉语的“福分”可自然承担这种张力。
- issue: “人的儿女”这一习语
  choice: 译作“世人”
  alternative: 较直译为“人的儿女”或“人类的子孙”
  rationale: “世人”准确传达习语所指的人类整体，又不让现代读者误以为只谈血缘后代。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。保留“那些日子”“降到地上”等启示文学意象；用“工作和劳苦”维持原文两个近义词的并列，不误译为“后裔”。
