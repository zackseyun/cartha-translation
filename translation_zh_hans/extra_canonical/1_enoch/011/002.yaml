base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/002.yaml
  text: And peace and truth shall be partners throughout all the days of the world and throughout all the generations of the world[a][b][c][d].
translation:
  language: zh_hans
  text: 和平与真理必相伴，直到世间一切的日子，并直到世间一切的世代。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日子”所译原词在某些语境中也可指时期或运行历程；在这里按其通常的复数义译为“日子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰላም
  choice: 和平
  rationale: 常用义为和平、安宁；与“正直”并列，表达蒙福时代中和谐而合宜的秩序。
- source_word: ርትዕ
  choice: 正直
  rationale: 可指真理、正确或正直；此处与“和平”并列，用“正直”较自然，也保留道德与秩序层面的含义。
- source_word: ሱቱፋነ ይከውኑ
  choice: 必相伴
  rationale: 按 ሱቱፋነ 与存在动词的表面结构理解为共同、有分或相伴；同时承认该组合也可能被理解为“必增多／必丰盛”。
- source_word: በኵሉ መዋዕለ ዓለም
  choice: 贯穿世上一切的日子
  rationale: መዋዕል 在此宜按复数“日子”处理；በኵሉ 表达遍及全部时段。
- source_word: በኵሉ ትውልደ ዓለም
  choice: 贯穿世上一切的世代
  rationale: 保留原文与前一短语平行的全面时间范围，并以现代汉语可懂的方式表达历代延续。
theological_decisions:
- issue: 祝福延续的范围
  choice: 保留“世上一切的日子”和“世上一切的世代”所表达的广泛、持续范围
  alternative: 限定为单一的末世时代
  rationale: 原文两次使用全面性的表达，强调跨越时间与世代；译文不额外规定具体的末世时间表。
- issue: 和平与正直之间的关系
  choice: 译为二者“必相伴”
  alternative: 译为二者“必增多／必丰盛”
  rationale: “相伴”较直接保留共同存在的句法可能性，不把这两个抽象名词改写成彼此的伙伴；异译在脚注中保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“贯穿……也贯穿……”保留原文的平行结构和全面范围；脚注仅说明真实的词义歧义，不引入宗派性解释。
