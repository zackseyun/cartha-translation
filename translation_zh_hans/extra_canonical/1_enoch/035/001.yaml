base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/035/001.yaml
  text: And from there I went toward the west[a], to the ends of the earth, and there I saw three open portals of heaven, like what I had seen in the east[d][c][b], corresponding to their portals and corresponding to their outlets.
translation:
  language: zh_hans
  text: 从那里，我往西方去，直到地极；我在那里看见天上三道敞开的门，正如我先前在东方所看见的；这些门及其出口都与东方所见的相应。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “相应”也可理解为“在尺度上相称”或“按相同的安排设置”。原文没有明确说明所指的是大小、数目还是排列；此处是说西方所见的门和出口与东方所见的相应。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእምህየ፡ ሖርኩ
  choice: 从那里，我……去
  rationale: 保留异象旅程中反复出现的叙事过渡和第一人称移动表达，使用自然的现代汉语。
- source_word: መንገለ፡ ዐረብ
  choice: 往西方
  rationale: ዐረብ 在此指日落所在的西方；上下文章节也依次描写各方位，不应译作“南方”。
- source_word: በአጽናፈ፡ ምድር
  choice: 直到地极
  rationale: 保留启示文学中的宇宙地理意象；“地极”简洁、庄重，也不将异象现代化。
- source_word: ሠለስተ፡ ኆዋኅወ፡ ሰማይ፡ ርኁዋተ
  choice: 天上三道敞开的门
  rationale: ኆዋኅ 指天界结构中的门或开口；“门”保留建筑性意象，“敞开的”对应其开放状态。
- source_word: በከመ፡ ርኢኩ፡ በምሥራቅ
  choice: 正如我先前在东方所看见的
  rationale: 清楚表达与此前东方异象的比较关系；“先前”仅显明原文语境中已有的时间先后。
- source_word: በአምጣነ፡ ኆዋኅው፡ ወበአምጣነ፡ ሞፃእቱ
  choice: 这些门及其出口都彼此相应
  rationale: בአምጣነ 可表示按尺度、安排或对应关系；译作“彼此相应”保留其含混性，避免断定具体是尺寸还是排列。
theological_decisions:
- issue: 宇宙地理与天界建筑意象
  choice: 保留“地极”和“天上的门”作为异象中的具体图景
  alternative: 意译为“遥远的西方”和“天空中的开口”
  rationale: 原文呈现结构化的宇宙异象；直保其图景可避免按现代宇宙观加以消解。
- issue: 门与出口“相应”的确切方式
  choice: 不具体说明是尺寸、数目还是排列相同
  alternative: 明确译为“大小相同”或“排列一致”
  rationale: 原文的 בአምጣነ 允许尺度或对应关系等理解，译文应保留这种真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一道门”符合汉语量词习惯；分号划分所见异象与其比较说明。
