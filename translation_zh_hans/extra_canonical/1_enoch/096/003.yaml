base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/003.yaml
  text: But you[a], do not fear—you who have suffered—for healing will come to you, and a bright light will shine for you[b], and you will hear the voice of rest from heaven.
translation:
  language: zh_hans
  text: 但你们这些受苦的人[a]，不要惧怕；医治必临到你们，明亮的光必为你们照耀；你们必听见从天上传来的安息之声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们这些身处患难的人。”原文所指可包括疼痛、苦难或困厄，不一定只指身体疾病。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“安息的声音／话语”。这里贴近原文保留“安息”，没有意译为“平安”或“安慰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: 不要惧怕
  rationale: 这是对复数听众的否定命令；“不要惧怕”简洁有力，也保留启示文学庄重的语气。
- source_word: እለ ሐመምክሙ
  choice: 你们这些受苦的人
  rationale: 该短语指经历痛苦或患难的人；“受苦”既可涵盖身体疼痛，也不把含义局限于身体疾病。
- source_word: ፈውስ
  choice: 医治
  rationale: 该名词可指医治、痊愈或恢复；“医治”在中文中可兼具身体与更广泛的复原含义。
- source_word: ይከውነክሙ
  choice: 必有……临到你们
  rationale: 该动词基本义宽泛，可表示成为、存在或发生。与“医治”搭配时译作“必有医治临到你们”，自然表达所应许之恢复的来到，同时未把它具体化为单纯的治病。
- source_word: ብርሃነ ብሩህ
  choice: 明亮的光
  rationale: 原文以“光”及其同源修饰语加强亮光意象；“明亮的光”保留强调，又符合现代汉语表达。
- source_word: ያበርህ ለክሙ
  choice: 必为你们照耀
  rationale: 保留发光、照明的意象和与格所表达的受益关系，不另行解释为引导或拯救。
- source_word: ቃለ ዕረፍት
  choice: 安息的声音
  rationale: 短语直指“安息的声音／话语”。正文采用“声音”以呼应后面的“听见”，并保留“安息”，避免解释性地改成“平安”或“安慰”。
- source_word: እምሰማይ
  choice: 从天上
  rationale: 准确表达声音的来源；现代汉语用“天上”自然且保留启示性的空间意象。
theological_decisions:
- issue: 是否把 ቃለ ዕረፍት 解释为较熟悉的神学用语
  choice: 安息的声音
  alternative: 平安之声；安慰的话
  rationale: 原文首先表达的是“安息／歇息”，而非泛化的平安或安慰。保留“安息”使应许的解除劳苦与患难之意保持开放，不以较晚或较熟悉的宗教措辞加以调和。
- issue: 医治所指的是身体痊愈还是更广泛的恢复
  choice: 保留“医治”的宽广含义
  alternative: 痊愈；救治；复兴
  rationale: 上下文向受苦者宣告恢复，但本节没有限定为身体疾病，也没有明确界定为某一种属灵复兴；因此采用可兼容多层含义的“医治”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文连续的应许结构；“但你们”与前文形成转折，“必”体现未来应许的确定语气。
