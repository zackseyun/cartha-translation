base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/001.yaml
  text: Hope[a], you righteous, for the sinners will swiftly be destroyed from before you, and authority over them will be yours[c][b], according to your desire.
translation:
  language: zh_hans
  text: 义人哪，要怀着盼望[a]！因为罪人必迅速从你们面前被除灭[b]；你们将拥有管辖他们的权柄[c]，照你们所愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们这些义人，要有盼望”。原文是直接对义人发出的复数命令。
    reason: lexical_alternative
  - marker: b
    text: 直译为“从你们面前”，保留罪人被从义人眼前除去的空间意象。
    reason: lexical_alternative
  - marker: c
    text: “管辖他们的权柄”表达启示文学中地位逆转的图景：义人将对受审判的罪人拥有权柄。
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: 要怀着盼望
  rationale: 这是复数祈使语，出自表示盼望、信赖的词根。译文保留直接劝勉的语气，同时采用自然的现代汉语表达。
- source_word: ጻድቃን
  choice: 义人哪
  rationale: 此处是对复数对象的直接称呼；“哪”明确体现呼语功能，并保持庄重语体。
- source_word: ፍጡነ
  choice: 很快
  rationale: 该词作副词修饰罪人遭毁灭一事，强调行动迅速；“很快”比“迅速地”更自然，又不必限定为单纯的“很快将要发生”。
- source_word: ይትሀጐሉ
  choice: 会……被除灭
  rationale: 该动词在审判语境中表示毁灭、消亡。被动表达保留罪人遭受审判的意味，而不具体说明毁灭的方式。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 这是实体化复数名词，指与义人相对、面临审判的一类人；汉语“罪人”无需另加复数标记。
- source_word: እምቅድሜክሙ
  choice: 从你们面前
  rationale: 保留原文具体的空间意象，描绘罪人从义人面前被除去，而不将其抽象化为一般性的败亡。
- source_word: ሥልጣን
  choice: 权柄
  rationale: 该词表示统治或支配的权力。“权柄”适合庄重的启示文学语体，也比单纯的“能力”更能体现治理权。
- source_word: ይከውን ለክሙ ዲቤሆሙ
  choice: 辖制他们的权柄必归你们
  rationale: 此结构表达义人将拥有在罪人之上的权柄。译文同时保留权柄的归属及其支配对象，未额外说明授予者或实施方式。
- source_word: በከመ ፈቀድክሙ
  choice: 正如你们所愿
  rationale: 该短语表示事情与义人所愿望或意欲的相符。“所愿”保持正式而自然，也不把“愿望”解释成更具体的行动方案。
theological_decisions:
- issue: 义人将来与受审判罪人之间的关系
  choice: 保留义人将拥有辖制罪人之权柄的直接表述
  alternative: 将其弱化为义人仅得到道德上的胜利或公开昭雪
  rationale: 原文明确使用“权柄”并带有“在他们之上”的关系，呈现启示文学中地位逆转的图景。译文不将其削弱为内心安慰，也不具体界定这种辖制如何实行。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“义人哪”体现直接呼告；分号连接罪人被除灭与义人得权柄两幅彼此关联的审判图景。译文保留原文关于义人权柄及其愿望的张力，不解释权柄的来源、范围或具体施行方式。
