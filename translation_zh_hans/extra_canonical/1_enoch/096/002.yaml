base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/002.yaml
  text: And on the day of the judgment of sinners[a], your children will rise up and be lifted up like eagles, and your nest will be higher than the vultures. You will go up and enter the clefts of the earth and the fissures of the rock forever, like coneys before the lawless[f][e][d][c][b]; and the sirens will groan over you and weep.
translation:
  language: zh_hans
  text: 2 到了罪人受惩治的日子，你们的儿女必兴起，被高举，如同鹰；你们的巢[a]必高过兀鹰。你们必上去，进入地的裂缝和磐石的罅隙，永远藏身，如同岩狸躲避无法无天之徒[b]；塞壬[c]必因你们哀号哭泣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巢”所译的原文词语含义较难确定，也可能指荫蔽处、遮蔽之所或居处；此处按前文鹰的意象暂译为“巢”。
    reason: textual_variant
  - marker: b
    text: “岩狸”指蹄兔一类栖居岩间的小动物；传统译名包括“沙番”或“石獾”。原文直译为“从无法无天之徒面前”，在此处表示躲避。
    reason: lexical_and_idiomatic_note
  - marker: c
    text: “塞壬”是源自希腊语的借词；在古代译经传统中，可指在荒凉之地哀鸣的神异生物，不一定等同于后来传说中的海妖。
    reason: cultural_note
lexical_decisions:
- source_word: ምንዳቤሆሙ
  choice: 罪人受惩治
  rationale: 该词可指苦难、困厄或带惩罚意味的患难；本节处于审判语境，用“受惩治”保留司法意味，又不把它限定为某种正式判决。
- source_word: ይትሌዐሉ / ይትነሥኡ
  choice: 必兴起，被高举
  rationale: 分别译出两个并列动词，保留原文强调性的平行结构，以及末世性升高的意象。
- source_word: አንስርት
  choice: 鹰
  rationale: 采用该词的通常意义，并保留高飞、尊荣的比喻。
- source_word: እጐለ ዚአክሙ
  choice: 你们的儿女
  rationale: 按第二人称复数所属关系理解；现代汉语中“儿女”自然地表达后代，并符合上下文对群体的劝慰。
- source_word: ፈደፋደ
  choice: 兀鹰
  rationale: 与前面的“鹰”区别开来，保留原文两种猛禽意象的对照。
- source_word: ምጽላልክሙ
  choice: 你们的巢
  rationale: 该词形和含义较难确定，可能指荫蔽处或居所；结合鹰的比喻译为“巢”，使意象连贯，同时承认文本不确定性。
- source_word: ንደብታተ ምድር
  choice: 地的裂缝
  rationale: 保留地面裂开之处的空间意象，措辞简明而具体。
- source_word: ንቅዓታተ ኰኵሕ
  choice: 磐石的罅隙
  rationale: 表达岩石中的开口或裂隙，与前一短语形成自然平行。
- source_word: ጊሔ
  choice: 岩狸
  rationale: 此处很可能指栖居岩间的蹄兔类动物；“岩狸”比传统的“野兔”更接近所指动物，又能让普通读者理解其藏身岩隙的习性。
- source_word: እምቅድመ ዓማፅያን
  choice: 躲避无法无天之徒
  rationale: 复合介词含“从……面前”之意，在藏入裂隙的语境中表示躲避；“无法无天之徒”传达暴逆、不法者的道德与审判色彩。
- source_word: ጼደናት
  choice: 塞壬
  rationale: 这是源自希腊语 σειρῆνες 的借词，指旷野中哀鸣的神异生物，不应误解为“义妇”。采用音译，并以脚注说明其古代语境。
theological_decisions:
- issue: 第二人称复数所指及本节的审判对比
  choice: 理解为对受压迫群体说话：罪人受惩治之日，他们的儿女将被高举，但他们仍有进入岩隙躲避不法者的经历。
  alternative: 因中间数个词语和意象的文本困难，第二人称对象及各动作之间的逻辑关系也可能较为含混。
  rationale: 上下文显然把罪人与受话群体相对照，但本节同时并置高举、藏匿和哀哭，不宜用后来的教义体系消除这种张力。
- issue: 末句“塞壬必因你们哀号哭泣”的意义
  choice: 保留原文神异旷野生物为受话者哀哭的意象，不解释其具体神学身份。
  alternative: 可将其泛化为旷野哀鸣的生物，或依较早误读理解为某类妇女。
  rationale: 词源和古代译经用法支持“塞壬”；音译并加说明既忠于词形，也避免把希腊神话中后期的固定形象强加于此。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“兴起／被高举”的平行、“鹰／兀鹰”的鸟类意象及“裂缝／罅隙”的对应。原文中“巢”及若干句法关系存在困难，正文选择最连贯的读法，但不把不确定处扩展成教义解释。
