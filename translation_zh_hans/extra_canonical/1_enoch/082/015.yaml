base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/015.yaml
  text: At the beginning of the year[a], first rises and rules Melkiyal, whose name is called Tam'ade'eni and the sun; and all the days of his dominion, while he rules[c][b], are ninety-one days.
translation:
  language: zh_hans
  text: 年初，麦勒基雅勒首先升起并掌权；他的名字叫塔玛德埃尼和“太阳”[a]。他掌权的日子一共九十一天[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔玛德埃尼”可能是专名或历法上的技术称号，确切含义不明，因此按原文音译。“太阳”在这里似乎也是麦勒基雅勒的名称或称号。
    reason: textual_variant
  - marker: b
    text: 本节把一年开头的这一段时期人格化为麦勒基雅勒掌权的时段，共九十一天。
    reason: cultural_note
lexical_decisions:
- source_word: በቅድመ፡ ዓመት
  choice: 年初
  rationale: 按时间义理解为“一年开始之时”，用简洁自然的现代汉语表达。
- source_word: ቀዳማዊ፡ ይሠርቅ፡ ወይመልክ
  choice: 首先升起并掌权
  rationale: 将序数词理解为修饰“升起”，并保留两个并列动词及其宇宙秩序中的人格化统治意象。
- source_word: ምልኪያል
  choice: 麦勒基雅勒
  rationale: 作为专名音译，不作词源性翻译。
- source_word: ዘይሠመይ፡ ስሞ
  choice: 他的名字叫
  rationale: 自然地保留原文明确的命名公式。
- source_word: ተመአደኒ
  choice: 塔玛德埃尼
  rationale: 该词可能是专名或技术称号，意义不确定，故采用音译而不作推测性翻译。
- source_word: ፀሐይ
  choice: “太阳”
  rationale: 按修订所据句法，将其纳入命名从句，视作附加名称或称号；引号显示其称号功能。
- source_word: ኵሎሙ፡ መዋዕለ፡ ዘበስልጣኑ፡ ዚአሁ
  choice: 他权下的全部日数
  rationale: 兼顾“全部日子”与“属于其权柄/统治”的关系，避免误解为人的寿数。
- source_word: እለ፡ ይመልክ
  choice: 他掌权期间
  rationale: 将关系从句表达为时间范围，同时保留原文重复的掌权语言。
- source_word: ፺ወ፩ዕለት
  choice: 九十一天
  rationale: 直接表达原文数值与时间单位。
theological_decisions:
- issue: 历法秩序的人格化
  choice: 保留“掌权”和“权下”的统治措辞
  alternative: 译作“主持”“标志着”或“主管这一季节”
  rationale: 原文以有名的天界角色和所分配的权柄描绘宇宙秩序；保留此意象，但不引入更晚期或宗派性的天使论。
- issue: “太阳”与命名从句的关系
  choice: 将“太阳”处理为麦勒基雅勒的附加名称或称号
  alternative: 把“太阳”与后面的“全部日数”并列
  rationale: 原文连接结构及相关平行文支持其属于命名公式；另一种断句会造成“太阳和日数共九十一天”的语义困难。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“麦勒基雅勒”“塔玛德埃尼”按吉兹语形式音译；句式略作汉语化，以清楚呈现主语、命名从句及九十一天的统治时段，同时保留原文的宇宙掌权意象与命名处的不确定性。
