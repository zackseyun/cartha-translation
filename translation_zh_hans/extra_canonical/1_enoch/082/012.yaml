base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/012.yaml
  text: 'And these are the heads of a thousand: between leader and leader[a], six are added after the station[e][d][c][b]; and their leaders make the distinction.'
translation:
  language: zh_hans
  text: 这些是千人长[a]：在一个领袖与另一个领袖之间[b]，在固定位置之后加上六个[c]；他们的领袖作出区分[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千人长”直译为“一千之首”；也可译作“统领一千者”。这里似乎是用于天体运行体系的技术称号。
    reason: lexical_alternative
  - marker: b
    text: 本节的吉兹语文本和句法较难。“在一个领袖与另一个领袖之间”也可较生硬地直译为“在领袖和领袖之间”。
    reason: textual_variant
  - marker: c
    text: “固定位置”也可译作“站立之处”或“驻留处”。原文只说“六个”，没有说明所指的是日、单位还是其他事物。
    reason: lexical_alternative
  - marker: d
    text: “作出区分”也可译作“把它们分开”或“辨明它们”；原文没有明确说出被区分的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙንቱ
  choice: 这些
  rationale: 复数指示词，引出眼前所论述的对象；现代汉语用“这些”自然明确。
- source_word: አርእስት፡ ፲፻
  choice: 千人长
  rationale: 该短语直译为“一千之首”，与古代行政或军事编制中的“千人长”称号相合；这里沿用于天体运行体系中的领袖。
- source_word: ማእከለ፡ መራኂ፡ ወመራኂ
  choice: 在一个领袖与另一个领袖之间
  rationale: 重复名词并以连词连接，构成“在甲与甲之间”的表达；如此翻译既合语法，也保留技术性次序。
- source_word: ይትዌሰኩ፡ ፮
  choice: 又加上六个
  rationale: 动词表示增添；原文未明说被增添之物，译文也不补定其为日、单位或其他对象。
- source_word: በድኅረ፡ ምቅዋም
  choice: 驻位之后
  rationale: 名词含站立、位置或固定处之意；“驻位”保留其具体形象与天文技术语感，又不强定为某一种历法术语。
- source_word: መራሕያኒሆሙ
  choice: 他们的领袖
  rationale: 与前文表示引领、带领的词根一致，译作“领袖”以保持用词连贯。
- source_word: ይፈልጡ
  choice: 作出区分
  rationale: 该动词可指分开、辨别或区分；“作出区分”保留动作的技术性，同时不擅自指定被区分的对象。
theological_decisions:
- issue: 是否把本节解释性地改写为历法中的闰日或年周期划分
  choice: 保留“千人长”“领袖”“加上六个”“作出区分”等略显晦涩的技术表述
  alternative: 直接释义为在一年中加入六个闰日或补充单位
  rationale: 吉兹语句法及所指对象均有不确定之处。明确说成闰日会把可能的历法解释写进正文，因此不作此补充。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。鉴于本节属于技术性天文论述且原文含混，正文保持简短、结构化和适度陌生的表达，不以流畅为由补入具体历法解释。
