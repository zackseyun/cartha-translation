base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/003.yaml
  text: And those who understand shall not sleep[a], but shall listen with their ears so as to learn this wisdom[d][c][b]; and it will be sweeter to them than good food is to those who eat.
translation:
  language: zh_hans
  text: 那些有悟性的人必不沉睡，却要用耳朵如饥似渴地聆听[a]，为要学习这智慧；这智慧带给他们的喜悦，胜过佳肴带给食用者的喜悦。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“用耳朵渴求”，形容热切、专注地聆听；也可译作“侧耳倾听”。
    reason: lexical_alternative
  - marker: b
    text: 原句作平行比较：智慧使有悟性的人喜悦，正如佳肴使食用者喜悦，而前者更胜一筹。因有饮食意象，也可较形象地译作“比佳肴更甘美”。
    reason: translation_clarity
lexical_decisions:
- source_word: ኢይነውሙ
  choice: 必不沉睡
  rationale: 保留“睡眠”的具体意象；上下文中也自然传达不懈怠、保持警醒之意，而不把比喻直接改写成抽象劝诫。
- source_word: እለ ይሌብዉ
  choice: 那些有悟性的人
  rationale: 表达具有理解力、辨识力的人，符合智慧文学语境，也比“聪明人”更侧重领悟。
- source_word: ይጸምኡ በእዝናሆሙ
  choice: 用耳朵如饥似渴地聆听
  rationale: 按该句中的正面动作理解为以耳“渴求”、热切倾听，不把前一动词的否定错误延伸至此；译文兼顾原文的“耳朵”和“渴求”意象及现代汉语的自然度。
- source_word: ከመ ይትመሀርዋ
  choice: 好学习
  rationale: 简洁表达目的关系，即借着热切聆听来领受、学习这智慧。
- source_word: ለዛ ጥበብ
  choice: 这智慧
  rationale: 保留指示词，指向前文所传授的智慧。
- source_word: ትደልዎሙ
  choice: 必使他们喜悦
  rationale: 该动词主要表示合宜、可喜悦或令人满意，而非字面“甘甜”；如此也能与后半句佳肴带给食用者的喜悦形成平行。
- source_word: እመበልዕት ሠናያት
  choice: 胜过佳肴
  rationale: “佳肴”自然、凝练地表达优美可口的食物，并保留具体饮食意象。
- source_word: ለእለ ይበልዑ
  choice: 使享用的人喜悦
  rationale: 按句法保留两组对象之间的比较：智慧使有悟性的人喜悦，佳肴使吃的人喜悦；不把“吃”的宾语误解为智慧。
theological_decisions:
- issue: 沉睡与以耳渴求的比喻力量
  choice: 保留“沉睡”“耳朵”和热切渴求的身体意象，将其呈现为对启示性智慧的警醒领受。
  alternative: 意译为“明智的人会保持警醒，专心听讲”。
  rationale: 较直观的意象保留了启示文学和智慧文学的质感，又没有把“沉睡”解释成某一特定教义概念。
- issue: 智慧与食物的比较关系
  choice: 译作智慧使人喜悦，胜过佳肴使食用者喜悦。
  alternative: 译作智慧对人比佳肴更甘甜。
  rationale: 原动词更直接表示令人喜悦、合意；保留双方平行的施受关系，避免因食物语境而把动词限定为味觉上的“甘甜”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必不……却要……”保留劝勉兼预期的语气；“如饥似渴地聆听”使罕见的耳朵渴求意象在中文中可懂，同时用脚注交代其较直译形式。末句刻意保留原文的平行比较，不将智慧说成被吃下的对象。
