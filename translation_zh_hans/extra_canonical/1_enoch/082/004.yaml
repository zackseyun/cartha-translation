base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/004.yaml
  text: Blessed are all the righteous who walk in the path of righteousness and have no sin like sinners[a], in the whole count of all their days, while the sun goes on its course in heaven, entering and going out through the gates for thirty days, together with the heads of the thousands of the order of the stars, and with the four that are added, which divide the four parts of the year[c][b], which lead them and enter with them on four days.
translation:
  language: zh_hans
  text: 凡行在正义之路上、在他们一切日子的总数中没有罪、不像罪人那样的义人，都是有福的[a]。太阳在天上运行，经由诸门进入和出去，历时三十日；又有众星之秩序中千人的首领[b]，以及所加上的四个附加单位[c]。这四个单位划分一年为四个部分；它们引领那些首领，并在四个日子与他们一同进入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文将“没有罪”与“像罪人”相连，句法关系可有不同理解。译文保留强烈的无罪陈述及其与罪人的比较，未据此作出后期教义判断。
    reason: theological_ambiguity
  - marker: b
    text: 此短语的数字和句法较难。也可理解为“众星之秩序中各千队的首领”或“众星的千人首领”；译文保留“首领”“千”及“秩序”的层级意象。
    reason: lexical_alternative
  - marker: c
    text: 现有吉兹文转录此处的数字似乎为“十”，但紧接着说“一年的四个部分”和“四个日子”。因此正文依传统且合乎上下文的理解译为“四个附加单位”；数字仍有文本问题。
    reason: textual_variant
lexical_decisions:
- source_word: ብፁዓን
  choice: 有福的
  rationale: 保留祝福宣告的庄重语气和启示文学色彩；比“快乐”更贴近原词的宗教伦理意味。
- source_word: ጻድቃን
  choice: 义人
  rationale: 采用现代中文圣经语域中自然且稳定的对应词，保留其伦理与神学分量。
- source_word: የሐውሩ / የኀውር
  choice: 行在／运行
  rationale: 对人用“行在”保留道德道路的隐喻，对太阳用“运行”表达天体运动，同时维持两者之间的结构呼应。
- source_word: በፍኖተ ጽድቅ
  choice: 在正义之路上
  rationale: 自然呈现原文的道路隐喻，并保留“正义”这一关键词。
- source_word: አልቦሙ ኃጢአት ከመ ኃጥኣን
  choice: 不像罪人那样有罪
  rationale: 既不削弱“没有罪”的强烈陈述，也明确保留比较短语，避免替原文解决其有关义人无罪的神学张力。
- source_word: በኍልቈ ኵሉ መዋዕሊሆሙ
  choice: 在自己一生全部的数算中
  rationale: 保留ኍልቈ的计数意味，以配合本书天文历法段落的技术性语汇；“一生”自然表达“他们所有的日子”。
- source_word: በአናቅጽ ይበውእ ወይወጽእ ሠላሳ ዕለተ
  choice: 经由各门出入，每门三十天
  rationale: 保留太阳门的宇宙图景；“每门”是按上下文补出的最简关系说明，使中文可读而不过度扩写。
- source_word: አርእስተ ፲፻ዘሥርዓቶሙ ለከዋክብት
  choice: 众星秩序中各千队的首领
  rationale: 保留“首领”“千”和“秩序”的层级、数目及组织意象，同时用“千队”使中文语法成立。
- source_word: ምስለ ፲ እለ ይትዌሰኩ
  choice: 以及所加的四位
  rationale: 传世读法和紧接着的“四个部分”支持四个附加单位；但底本文本所见数字疑为“十”，故在脚注公开说明。
- source_word: እለ ይጼልዩ ማእከለ ፬ክፍለ ዓመት
  choice: 这四位划分一年的四个部分
  rationale: 将动词按历法语境译为“划分”，并保留一年四分的明确结构。
theological_decisions:
- issue: 义人是否被描述为绝对无罪
  choice: 译作“不像罪人那样有罪”，保留强烈的伦理陈述和比较结构。
  alternative: 可理解为义人完全无罪，或修辞性地指他们不像罪人那样活在罪中。
  rationale: 原文同时有“没有罪”和“像罪人”的成分；译文不将其系统化为任何后期教义结论。
- issue: 附加历法单位的身份与数目
  choice: 正文采用“四位”，理解为划分一年四部分的四个附加单位。
  alternative: 依当前转录字面读作“所加的十位”，或泛指额外的星辰首领。
  rationale: 下文连续出现一年四部分及四个日子，强烈支持“四”；但源文数字问题真实存在，故以脚注保留异文。
- issue: “四位”是日子还是人格化的领袖
  choice: 正文保留人格化量词“位”，末句仍说它们在四个日子进入。
  alternative: 直接译为“四个附加日”。
  rationale: 这样既呈现历法功能，又不抹去原文中这些单位“引领”“进入”的人格化张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。首句保留祝福宣告和“道路—运行”的呼应；后半句适度分句，以免原文漫长关系从句在中文中失去层次。技术性历法意象如“各门”“三十天”“四个部分”均予保留，不以现代天文学概念改写。
