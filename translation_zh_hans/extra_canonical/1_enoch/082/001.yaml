base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/001.yaml
  text: And now[a], my son Methuselah, I tell you all these things, and I write them down for you, and I have revealed them all to you, and I have given you their books concerning all these things. Keep, my son, the book from the hand of your father[c][b], so that you may give it to the generations of the world.
translation:
  language: zh_hans
  text: 现在，我儿玛土撒拉，我把这一切都告诉你，也为你写下来；这一切我都已向你显明，并把这一切的书卷都交给了你。我儿，你要妥善保存从你父亲手中得来的书卷[a]，好让你把它传给世世代代[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“你父亲手中的书”或“你父亲之手的书”；这可理解为从父亲手中亲自交付、传下来的书卷。
    reason: lexical_alternative
  - marker: b
    text: “世世代代”也可译作“世上的各代”或“直到永远的世代”。
    reason: lexical_alternative
  - marker: c
    text: “好让你把它传给”也有人按并列命令理解为“并要把它传给”。
    reason: previous_rendering
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 这是转换话题并引出劝诫的表达；译作“现在”自然简洁，保留当下郑重嘱咐的语气。
- source_word: ወልድየ፡ ማቱሳላ
  choice: 我儿玛土撒拉
  rationale: 保留父亲对儿子的直接称呼，并采用中文传统中通行的人名译法。
- source_word: ኵሎሙ፡ እሉንተ
  choice: 这一切
  rationale: 概括前文所启示的全部事项，中文表达自然且不增添所指内容。
- source_word: ወእጽሕፍ፡ ለከ
  choice: 也为你写下来
  rationale: 明确口述内容被记录成文，符合源语“写”的基本意义。
- source_word: ወኵሎሙ፡ ከሠትኩ፡ ለከ
  choice: 这一切我都已向你显明
  rationale: ከሠተ有揭开、使人知道之意；“显明”既适合启示文学语境，又不过度强化专门神学含义。
- source_word: ወወሀብኩከ፡ መጻሕፍቲሆሙ፡ ለእሉ፡ ኵሎሙ
  choice: 并把有关这一切的书卷交给了你
  rationale: 源语结构较压缩，其中复数书卷带有与前述诸事相对应的关系；译文以“有关这一切”表达这种关系，而不生硬直译代词。
- source_word: ዕቀብ
  choice: 妥善保存
  rationale: 该命令兼有保留、守护之义；“妥善保存”在现代中文中清楚表达保存并防止失落的要求。
- source_word: መጽሐፈ፡ እዴሁ፡ ለአቡከ
  choice: 你父亲亲手传给你的书卷
  rationale: 字面为“你父亲手中的／你父亲之手的书”；此译呈现亲手交付或传承的习语意义，另以脚注保留较直译的可能。
- source_word: ወከመ፡ ትሀብ
  choice: 好让你把它传给
  rationale: ከመ加虚拟式构成目的从句，因此译作“好让”，不处理为并列命令；“传给”也符合书卷代代交付的语境。
- source_word: ለትውልደ፡ ዓለም
  choice: 世世代代的人
  rationale: 该短语可兼指世上的各代或延续至久远的世代；正文以自然中文表达持续传承，同时用脚注保存其他可能。
theological_decisions:
- issue: 书卷传承对象与时间范围（ለትውልደ፡ ዓለም）
  choice: 世世代代的人
  alternative: 世上的各代／直到永远的世代
  rationale: 源语中的“世界／时代”词可涉及空间上的世人，也可涉及时间上延续的世代。正文不将其限定为单纯的地域普世性或严格的永恒概念，脚注保留其张力。
- issue: 保存书卷与传递书卷之间的句法关系
  choice: 目的关系：“好让你……”
  alternative: 并列命令：“并要把它……”
  rationale: ከመ后接虚拟式更自然地引出目的，表明保存书卷是为了继续传递；异读式的并列理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙述与劝诫语体。“我儿”保留父子嘱托的郑重感；“书卷”契合古代文献语境。“妥善保存”及“传给”用现代汉语清楚表达守护与传承。正文所有脚注标记均已出现。
