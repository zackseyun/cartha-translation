base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/018.yaml
  text: The second leader after him is Helemmelek[c][b][a], whose name they call the Sun.
translation:
  language: zh_hans
  text: 在他之后的第二位首领是赫勒厄梅莱克[a]；人们称他的名字为“太阳”[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赫勒厄梅莱克”音译自吉兹文 ሄልእምሜሌክ，可转写为 Hēlʾəmmēlēk；其确切读音仍有不确定之处。
    reason: lexical_alternative
  - marker: b
    text: 原文的称名句式较为直译是“人们称他的名字为太阳”；也可较顺地译作“人们称他为太阳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: 第二位
  rationale: 本节处于依次列举众首领的语境中，采用序数表达比“另一位”更能体现次序。
- source_word: መራሒ
  choice: 首领
  rationale: 该词在《天文书》的宇宙秩序中指带领或统管运行者；“首领”保留其领导含义而不额外限定品级。
- source_word: ዘድኅሬሁ
  choice: 接在他之后
  rationale: 此关系短语表示名单中的承接次序；该译法在现代汉语中自然，也保留“在他之后”的空间—次序意象。
- source_word: ሄልእምሜሌክ
  choice: 赫勒埃姆梅莱克
  rationale: 作为专名按吉兹文音译，不赋予臆测性的词源意义；脚注注明较精确的拉丁字母转写及元音不确定性。
- source_word: ዘይጼውዕዎ ስሞ
  choice: 人们称他的名字为
  rationale: 保留第三人称复数主动式所表达的不定施事“人们”，同时明确译出原文中的“他的名字”，不简化为“他叫”。
- source_word: ፀሐየ
  choice: “太阳”
  rationale: 此处是结构化宇宙名录中的称名；引号体现其名称性质，又避免汉语中不必要的拟人化或神格化。
theological_decisions:
- issue: 末尾的“太阳”应作普通名词还是正式的天体称名
  choice: 作为称名译作“太阳”，加引号
  alternative: 仅作普通名词“太阳”，不加引号
  rationale: 上下文正在列举天体秩序中的首领及其名称。引号显示这是所称之名，但不把太阳解释为神祇或独立人格。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“接在他之后”保留原文的承接关系；分号使首领身份与称名公式层次分明。专名使用汉字音译，并以脚注保留源文转写。
