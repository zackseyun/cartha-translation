base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/011.yaml
  text: And their four leaders enter first, those who divide the four parts of the year; and after them the twelve leaders of the orders, those who divide the months; and the three hundred and sixty-four heads of thousands, the ones who distinguish the days; and the four that are added with them, the leaders who distinguish the four divisions of the years.
translation:
  language: zh_hans
  text: 他们的四位首领首先进入，就是划分一年四个部分的；在他们之后，是各班次的十二位首领，就是划分月份的；还有三百六十四位千人首领[a]，就是标定日子的[b]；以及与他们一同加上的四位，就是划分各年四个部分的首领[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“千的首领”或“千人首领”（即“千人单位的首领”）；此处并未明确说明这些首领的具体本体或职分性质。
    reason: lexical_alternative
  - marker: b
    text: “标定”也可译作“分辨”“标出”或“确定”。这里指在历法中把各日区分、标示出来。
    reason: lexical_alternative
  - marker: c
    text: “各年四个部分”也可理解为“一年的四季（或四个季度）”。末句的句法也可能译作：“就是划分一年四个部分之首领的那四位。”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ፬መራሕያኒሆሙ፡ ይበውኡ፡ ቀዳሚ
  choice: 他们的四位首领首先进入
  rationale: 保留“他们的”、数目“四”、领导者称谓以及进入次序；“首领”适合本节宇宙秩序中的层级语境。
- source_word: እለ፡ ይሌልዩ፡ ፬ክፍለ፡ ዓመት
  choice: 就是划分一年四个部分的
  rationale: 按字面保留“一年的四个部分”，不在正文中直接解释为四季或季度。
- source_word: ፲ወ፪ መራሕያን፡ ዘሥርዓታት
  choice: 各班次的十二位首领
  rationale: “班次”表达ሥርዓታት所含的有序编排与轮班意味，比抽象的“秩序”更自然，同时不把这些职分具体认定为天使。
- source_word: እለ፡ ይሌልይዎሙ፡ ለአውራኅ
  choice: 就是划分月份的
  rationale: 延续前句“划分”的历法用语，并将带宾语标记的“月份”自然译为直接宾语。
- source_word: ፲፻ወ፷፬ አርእስት፡ ፲፻
  choice: 三百六十四位千夫长
  rationale: 据转录文本将አርእስት与随后数词“千”连读为“千的首领/千夫长”；正文采用自然称谓，脚注说明其字面结构及文本不确定性。
- source_word: እለ፡ ይፈልጥዎሙ፡ ለመዋዕል
  choice: 就是标定日子的
  rationale: 该动词可指分辨、标出或确定；历法语境中“标定”兼顾辨别与界定，不夸大为绝对决定。
- source_word: ወለ፬ እለ፡ ይትዌሰኩ፡ ምስሌሆሙ
  choice: 以及与他们一同加上的四位
  rationale: 保留这是附加于前述群体的四位，不进一步说明其本体身份。
- source_word: እለ፡ ይፈልጡ፡ መራሕያን፡ ፬ መክፈልተ፡ ዓመታት
  choice: 就是划分各年四个部分的首领
  rationale: 按主要句法理解，将“首领”视为附加的四位之同位称谓，并保留源文“年”的复数意味为“各年”；脚注交代另一种句法可能。
theological_decisions:
- issue: 这些宇宙职分者的本体身份
  choice: 只称为“首领”和“千夫长”，不在正文中明确称其为天使
  alternative: 将其明说为天使，或完全解释为抽象的历法单位
  rationale: 本节描述其层级和历法功能，却没有在本句明确界定其本体；保留启示文学中的开放性。
- issue: 末句中“首领”的句法归属
  choice: 理解为与附加的四位同位，即“这四位……是首领”
  alternative: 理解为这四位所划分或辨识的对象，即“划分四个部分之首领的那些”
  rationale: 同位理解与本节前面反复出现的“首领……就是划分……”结构平行，也符合经审核英文层的最终恢复文本；但吉兹文词序容许另一分析，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现源文连续列举的层级结构；重复“就是划分”以保留原文的平行句式。避免用“四季”直接消解“年之四部分”的字面开放性，也不擅自把这些职分者称作天使。
