base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/017.yaml
  text: 'And these are the names of the leaders who are under them: Berkael[a], Zelbesael, and another who is added, the head of a thousand, whose name is Helyaseph[c][b]. And the days of the dominion of this one are completed.'
translation:
  language: zh_hans
  text: 以下是隶属于他们的领袖的名字：贝尔卡埃尔、泽尔贝萨埃尔，以及另一位被增列的千人之首，名叫赫利亚塞夫。[a] 这一位掌权的日子已届满。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “另一位被增列的千人之首”在吉兹文中的句法较为生硬，也可理解为名单中另行增列了一位具有等级的官长；其名为赫利亚塞夫。
    reason: textual_variant
  - marker: b
    text: “掌权”也可译作“执掌权柄”或“统治”；原词可指权柄、统治权或受托的权力。
    reason: lexical_alternative
lexical_decisions:
- source_word: አስማቲሆሙ ለመራሕያነ እለ መትሕቴሆሙ
  choice: 在他们之下的领袖的名字
  rationale: 保留原文的命名公式和上下级关系；“领袖”不把这些人物明确解释为天使或军事长官。
- source_word: ብርክኤል
  choice: 贝尔卡埃尔
  rationale: 按吉兹文形式保守音译，不翻译人名。
- source_word: ዜልብስኤል
  choice: 泽尔贝萨埃尔
  rationale: 按吉兹文形式保守音译；原名的确切元音不能完全确定。
- source_word: ዘይትዌሰክ
  choice: 被增列的
  rationale: 表达被加上、列入这一名单或等级的含义，同时以自然汉语呈现。
- source_word: ርእሰ ፲፻
  choice: 千人之首
  rationale: 贴近字面“千人的头领”，保留等级称号而不擅自采用特定军事术语。
- source_word: ስሙ ሂሉያሴፍ
  choice: 名叫赫利亚塞夫
  rationale: 明确译出ስሙ“他的名字”，并保守音译该专名。
- source_word: ተፈጸመ መዋዕለ ስልጣኑ ለዝ
  choice: 这一位掌权的日子就此届满
  rationale: “届满”体现完成之意和历法语境；“掌权”涵盖权柄、统治或受托权力，且“这一位”保留原文指示语的指向。
theological_decisions:
- issue: 这些等级称号所指对象的性质
  choice: 采用“领袖”“千人之首”等层级性用语，不在正文中明确称其为天使。
  alternative: 译作“天使首领”，或明确限定为纯粹的天体职官。
  rationale: 本节呈现宇宙秩序中的具名等级，但此处原文本身没有明确界定其本体性质；因此保留解释空间。
- issue: “掌权的日子届满”的时间意味
  choice: 以“届满”表达周期性完成，不限定为一次性的历史终结。
  alternative: 译作“他统治的日子已经结束”。
  rationale: 上下文属于历法性的周期描述；原文完成式可表示达到规定终点，但不必暗示永久终止。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。人名依吉兹文保守音译；层级称号尽量直译，同时避免引入经文未明说的天使论或军事制度。
