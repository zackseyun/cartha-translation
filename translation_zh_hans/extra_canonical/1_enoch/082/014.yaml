base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/014.yaml
  text: And the names of those who lead them are Adnarel[a], Iyasusael, and Elomeel. These three follow after the leaders of the orders, and there are two that follow after the leaders of the orders, which follow after all the leaders of the fixed stations[c][b], who divide the four parts of the year.
translation:
  language: zh_hans
  text: 带领它们的那些首领名叫阿德纳勒、伊亚苏萨勒和埃洛梅勒。这三位跟在各班次的首领之后；又有一位跟在三位班次首领之后[a]；这些首领又跟在那些固定位置的首领之后，而后者划分一年的四个部分[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据校订本文作“一位……三位”。所提供的电子转录误作“两位……七十位”，是埃塞俄比亚数字符号识别错误。
    reason: textual_variant
  - marker: b
    text: 原文中连续出现多个“跟在……之后”的关系从句，各组首领之间的具体层级不完全明确；译文保留这种连锁结构。“一年的四个部分”也可译作“一年的四个分区”。
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ይመርሃዎሙ
  choice: 带领它们
  rationale: 保留该动词表示引领、统领的基本含义，也符合天体按秩序运行的语境。
- source_word: ይተልዉ
  choice: 跟在……之后
  rationale: 原文重复使用这一动词来表达先后次序；译文也重复保留，以呈现有序行列的结构。
- source_word: መራሕያነ
  choice: 首领
  rationale: 此词源于“带领”的词根；“首领”既体现层级，也不把这些存在解释成仅仅提供指引者。
- source_word: ሥርዓታት
  choice: 班次
  rationale: 这里指有组织的秩序或编排；在天文历法语境中，“班次”比抽象的“秩序”更自然，同时仍保留群组依次运行之意。
- source_word: ምቅዋማት
  choice: 固定位置
  rationale: 该名词表示站立之处、确立的位置；译作“固定位置”符合天文语境，又保留稳定定位的意象。
- source_word: ይፈልጡ
  choice: 划分
  rationale: 此处表示分开或分配，与宾语“一年的四个部分”搭配自然。
- source_word: አርባዕተ ክፍለ ለዓመት
  choice: 一年的四个部分
  rationale: 按字面表达历法上的四重划分，不径直采用可能带入现代概念的“四季”或“四个季度”。
theological_decisions:
- issue: 三个名称所指存在的性质
  choice: 按天界首领的专名音译，不翻成称号
  alternative: 将名称解释并翻译为描述性称号，或因疑为讹文而改订名称
  rationale: 上下文把这些词作为一组专名列出；音译能避免加入原文没有明说的身份或神学解释。
- issue: 中间数词的文本问题
  choice: 采用查尔斯1906年校订本文的“一位”和“三位”
  alternative: 依所提供的转录文本译为“两位”和“七十位”
  rationale: 所提供的转录中፪与፸属于字符识别错误；查尔斯校订本文实际为፩与፫。采用“一”和“三”恢复版本读法，并以脚注公开说明。
- issue: 多重关系从句的层级
  choice: 保留“跟在……之后”的连续结构，仅用“这些首领”“后者”维持基本衔接
  alternative: 把所有群体重写成完全明确的天界行政层级
  rationale: 吉兹语的连续关系从句存在指代张力；不宜用解释性改写消除原文未完全澄清的层级关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。专名按吉兹语形式作近似音译；天文秩序术语避免过度现代化。分号用来呈现原文连续而复杂的序列，同时不把其含混关系强行拆解。
