base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/013.yaml
  text: 'And these are the names of the leaders who divide the four parts of the year[a], who are appointed: Milkiel, Helemmelek, Meleyal[b], and Narel.'
translation:
  language: zh_hans
  text: 以下是被任命、负责划分一年四个部分[a]的首领的名字：米尔基埃尔、赫勒姆梅莱克、梅莱亚尔[b]和纳雷尔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一年的四个分区”；吉兹语直译为“一年的四个部分”。
    reason: lexical_alternative
  - marker: b
    text: 第二和第三个名字在所据文本中较难确定；这里按吉兹语形式保守音译，没有改成推测的、更常见的拼法。
    reason: textual_variant
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: 名字如下
  rationale: 将“他们的名字”按现代汉语的列名句式自然表达，同时保留原文的介绍公式。
- source_word: መራሕያያን
  choice: 首领
  rationale: 该词源于“带领、引导”，在本书天文语境中指掌管历法分区的具名宇宙职员；“首领”体现其权柄，又不额外断定其具体天使等级。
- source_word: ይፈልጡ
  choice: 划分
  rationale: 原词表示分开、分割；以一年四个部分为宾语时，“划分”符合历法语境。
- source_word: ፬መክፈልተ ዓመት
  choice: 一年四个部分
  rationale: 贴近原文“四个部分／分区”，避免用“四季”或“四季度”过度解释。
- source_word: ሥሩዓን
  choice: 被任命
  rationale: 该被动形式可表示被安排、设立或委任；“被任命”适合这些宇宙职员所承担的职责。
- source_word: ሚልኪኤል
  choice: 米勒基埃尔
  rationale: 依所据吉兹语形式作保守音译，不按较熟悉的闪语名字形式加以规范化。
- source_word: ህልእምሜሌክ
  choice: 赫勒姆梅莱克
  rationale: 此名在所据文本中较难确定，采用接近吉兹语字形且适合汉语阅读的保守音译。
- source_word: ሜሌአየል
  choice: 梅莱亚尔
  rationale: 依吉兹语形式保守音译；其中元音组合存在不确定性，故在脚注说明。
- source_word: ናሬል
  choice: 纳雷尔
  rationale: 按所据吉兹语形式直接音译。
theological_decisions:
- issue: 这些具名者的性质
  choice: 称为掌管历法分区的“首领”
  alternative: 人格化的天文标志；掌管季节的天使长官
  rationale: 《天文书》的语境把这类具名者描绘为宇宙秩序中的职员；译文保留“首领”这一宽泛称谓，不把后期天使论或特定等级带入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句子调整为汉语自然的列名结构；保留“一年四个部分”的陌生表达，以反映原文历法措辞。专名均用简体中文音译，并以脚注提示文本不确定性。
