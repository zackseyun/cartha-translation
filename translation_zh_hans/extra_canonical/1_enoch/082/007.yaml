base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/007.yaml
  text: And the matter is true[a], and the reckoning is exact; for Uriel showed me the luminaries, and the paths, and the appointed times, and the years, and the days, and breathed on me—Uriel[f][e][d][c][b], to whom the Lord of all creation of the world gave command concerning the host of heaven.
translation:
  language: zh_hans
  text: 这事是真实的[a]，推算也很精确；因为乌列把众光体、月份[b]、节期[c]、年岁[d]和日子指给我看，并向我吹了一口气。这位乌列，曾受全世界一切受造物之主就天上众军[e]所下的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这事是真实的”也可译为“这记述是真实的”；原文强调所述历法资料的可靠性。
    reason: lexical_alternative
  - marker: b
    text: 原词在此历法列表中宜译作“月份”；也可理解为“路径”或“运行轨道”。
    reason: lexical_alternative
  - marker: c
    text: “节期”也可译作“节庆”或“规定的时日”。
    reason: lexical_alternative
  - marker: d
    text: 此处原词或抄本文字较难确定；也有人理解为“季节”或年度性的划分。
    reason: textual_variant
  - marker: e
    text: “天上众军”可指有秩序的天上群体；在本书语境中，也可能包括受规律支配的天体。
    reason: cultural_note
lexical_decisions:
- source_word: አማን
  choice: 确实是真的
  rationale: 按其断言义译出“真实、确实”，不采用较早的指示性理解“这就是”。
- source_word: ጥንቁቅ ሐሳቡ ዘልኩዕ
  choice: 计算也精确无误
  rationale: 在历法语境中，ጥንቁቅ ሐሳቡ 表示审慎、精确的计算；ዘልኩዕ 的具体句法或词义不够确定，正文不强行增添“规定的”，以免过译。
- source_word: ብርሃናት
  choice: 众光体
  rationale: 指按秩序运行的天上发光体；“众光体”兼顾天文语境、庄重语体和现代可懂性。
- source_word: አውራኅ
  choice: 月份
  rationale: 字形 አውራኅ 在此历法列举中宜理解为“月份”，而非“路径”；这也与后面的节期、年岁、日子相协调。
- source_word: በዓላት
  choice: 节期
  rationale: 该词可指节庆或规定的时日；“节期”保留宗教历法色彩，同时不局限于欢庆活动。
- source_word: ክረማት
  choice: 年岁
  rationale: 抄本文字及其解释有一定困难；在历法单位的并列中采用“年岁”，并以脚注保留“季节”的可能。
- source_word: መዋዕል
  choice: 日子
  rationale: 在月份、节期、年岁之后，译为具体的“日子”最符合历法语境。
- source_word: አርአየኒ
  choice: 指给我看
  rationale: 保留异象启示中直接使人看见的动作感，比抽象的“启示”更贴近原文。
- source_word: ነፍሐ ዲቤየ
  choice: 向我吹气
  rationale: 直译其具体而奇特的动作意象，不解释为“教导”或“默示”，从而避免消解原文的启示性张力。
- source_word: ዘአዘዘ ሎቱ
  choice: 奉……的命令
  rationale: 表达乌列领受神圣命令与职分的关系，中文句法自然。
- source_word: እግዚእ ኵሉ ፍጥረት ዓለም
  choice: 世界一切受造物之主
  rationale: 保留原文较为厚重的宇宙性主权表述，同时调整为可读的现代汉语。
- source_word: ለሐይለ ሰማይ
  choice: 掌管天上众军
  rationale: 介词短语表明命令所关涉的领域；以“掌管”自然呈现所授命令的职权指向。“天上众军”保留其可指天上有秩序群体的宽度。
theological_decisions:
- issue: 神圣主权称号 እግዚእ 的译法
  choice: 主
  alternative: 主人
  rationale: “主”符合汉语宗教文献的庄重语域，并表达宇宙性权柄，不引入额外宗派含义。
- issue: 是否解释乌列“吹气”的动作
  choice: 保留“向我吹气”的具体形象
  alternative: 译为“教导我”或“使我受默示”
  rationale: 原文没有明确说明吹气的神学机制；直译可保存异象叙事的奇异性及解释空间。
- issue: “天上众军”的所指
  choice: 采用宽泛的“天上众军”
  alternative: 明确译作“众星”或“天使军队”
  rationale: 原文可涵盖有秩序的天上群体，在本书天文语境中或包括天体；不应武断限定为天使或星辰。
translation_notes:
  register: 采用现代、庄重而清楚的简体中文。以分句和关系从句疏理原文较长的结构；保留“吹气”和“天上众军”等启示文学意象，不以解释性神学术语替代。
