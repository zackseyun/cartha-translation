base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/002.yaml
  text: Wisdom I have given to you[a], and to your children, and to those who shall be your children, so that they may give this wisdom, which is beyond their understanding[c][b], to their children throughout the generations.
translation:
  language: zh_hans
  text: 智慧，我已经赐给你、你的儿女，以及将来要作你后裔的人[a]，好使他们把这智慧传给自己的儿女，世世代代存在他们心中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 括号内这句话在所依据的吉兹语文本中带有编者方括号，可能泛指“你未来的后裔”。
    reason: textual_variant
  - marker: b
    text: 直译作“在他们的心思之上”。此短语也可理解为“在他们心思中”或“超越他们的理解”；原文的介词关系存在歧义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ጥበበ
  choice: 智慧
  rationale: 该词表示智慧、理解或才智；本节讲述一种被赐下并代代传承的内容，因此“智慧”最贴切，也保留了原文庄重而宽泛的含义。句首前置“智慧”对应原文的强调语序。
- source_word: ወሀብኩ
  choice: 我已经赐给
  rationale: 完成体可译为“给了”或“已经给”；“已经赐给”既体现已完成的行动及其当前效力，也符合启示性训诲的语体。
- source_word: ወለውሉድከ
  choice: 你的儿女
  rationale: 原词可指儿女、后代或子孙；此处先说直接儿女，随后扩展到后来的人，故采用自然且不限定性别的“儿女”。
- source_word: '[ወለእለ፡ ይከውኑ፡ ለከ፡ ውሉደ፡]'
  choice: 以及将要成为你儿女的人
  rationale: 紧贴括号内短语的关系结构，同时以脚注说明其可能泛指未来后裔；不把文本上带括号的不确定成分无声地确定化。
- source_word: ከመ፡ የሀቡ
  choice: 使他们……传给
  rationale: ከመ 引出目的；动词本义为“给”。汉语在代际语境中用“传给”更自然，并清楚表达把所领受的智慧交给下一代。
- source_word: ለትውልዳት
  choice: 世世代代
  rationale: 该复数表达连续的世代；“世世代代”是自然、庄重且易懂的现代汉语。
- source_word: ዲበ፡ ሕሊናሆሙ
  choice: 超越他们理解的
  rationale: ዲበ 可表示“在……之上、超过”，ሕሊና 可指心思、思想或理解力；主文采用“超越他们理解的”，但脚注明示也可能按空间隐喻译作“在他们心思中／置于他们心思之上”，以保留原表达的歧义。
theological_decisions:
- issue: 所传承之恩赐的性质
  choice: 保留宽泛的“智慧”，不在正文中限定为天文学或历法知识
  alternative: 明确译作天文历法方面的启示或一般实用知识
  rationale: 本书当前语境可能使“智慧”包括天文、历法方面的启示，但本节本身使用宽泛词语；译文让上下文界定其具体内容，避免加入经文未明说的教义性限定。
- issue: 智慧与人的理解之间的关系
  choice: 正文译为“超越他们理解的智慧”，并以脚注保留“在他们心思中”等可能
  alternative: 断然译为智慧被放在他们心中，或仅作字面化的“在他们思想之上”
  rationale: 介词短语既可能表达高于、超越，也可能延续“在……之上”的空间隐喻。正文选取较通顺的超越义，但不把另一种理解排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以句首“智慧”保留原文的强调，不加原文没有的句首连词；用“传给”自然表达代际交付，同时通过脚注保留文本和词义上的真实不确定性。
