base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/008.yaml
  text: And they have authority by night and by day in heaven[a], so that they may give light upon humankind—the sun and the moon and the stars and all the powers of heaven[b], which return in their courses.
translation:
  language: zh_hans
  text: 他在天上昼夜掌权[a]，使太阳、月亮、星辰和天上的一切权能照耀世人；它们都循着各自的轨道周而复始。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可理解为：“他在天上掌管黑夜和白昼。”介词结构可能指他掌权的时间，也可能指其管辖的范围。
    reason: syntactic_ambiguity
  - marker: b
    text: “轨道”也可译作“路径”或“周期”；原文表达天体转回并按各自路线反复运行。
    reason: lexical_alternative
lexical_decisions:
- source_word: ስልጣነ፡ ቦቱ
  choice: 他……掌管
  rationale: ቦቱ 含第三人称阳性单数后缀，字面近于“权柄在他”，结合上文最自然地指乌列拥有管辖权；用“掌管”自然表达这一宇宙治理含义。
- source_word: በሌሊት፡ ወበመዓልት
  choice: 黑夜和白昼
  rationale: 保留原文成对的时间范畴；与“掌管”连用时，无须重复介词也能自然表达其管辖范围。
- source_word: ውስተ፡ ሰማይ
  choice: 在天上
  rationale: 本段描述宇宙天体秩序，“天上”既自然又保留其超越普通气象天空的语域。
- source_word: ከመ፡ ያርኡ፡ ብርሃነ፡ ዲበ፡ ሰብእ
  choice: 使……照耀世人
  rationale: ከመ 表目的或结果，动词与“光”连用可自然译为“照耀”；“世人”保留集合性人类所指。
- source_word: ፀሐየ፡ ወወርኀ፡ ወከዋክብተ
  choice: 太阳、月亮、星辰
  rationale: 直接呈现所列天体；“星辰”较“星星”更符合庄重的天文书语域。
- source_word: ኵሎሙ፡ ስልጣናት፡ ሰማይ
  choice: 天上的一切权能
  rationale: “权能”可兼容天体力量、宇宙职能或具有位格的天上掌权者，不强行消除原文歧义。
- source_word: እለ፡ ይትመየጡ፡ በዓስቢሆሙ
  choice: 循着各自的轨道周而复始
  rationale: 动词表达转回、返回，末语指路径、运行路线或周期；此译兼顾循环运动与既定运行路线。
theological_decisions:
- issue: ስልጣነ ቦቱ 的主语是单数的乌列，还是后文复数天体
  choice: 采用“他……掌管”，让第三人称阳性单数指向上文的乌列
  alternative: “它们有权柄”，以太阳、月亮、星辰等为主语
  rationale: ቦቱ 的形态支持阳性单数所指；后文复数形式则自然以列举的发光体为主语。这样既尊重语法，也保留句中主语转换。
- issue: “天上的一切权能”是否专指有位格的天使统治者
  choice: 保留“权能”这一可兼容位格与非位格力量的表达
  alternative: 译为“天上的一切掌权者”或“天上的一切力量”
  rationale: 本节侧重有秩序的天体运行，原文却不明确排除有位格的天上权能；不宜在译文中预先判定。
- issue: 乌列掌管的对象究竟是昼夜、天体，还是其运行秩序
  choice: 正文采用语法上自然但范围仍较开放的“在天上掌管黑夜和白昼”
  alternative: “他在天上昼夜掌权”
  rationale: 介词短语可能表示管辖对象，也可能表示掌权的时间；以脚注保存这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“掌管”比名词化的“有权柄”自然；“星辰”“权能”“周而复始”维持《天文书》的宇宙性语域。脚注标记均已置于正文。
