base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/010.yaml
  text: 'And these are the names of those who lead them: those who keep watch and go in at their appointed times, those who lead them in their stations and in their orders and in their times and in their months and in their authorities and in their positions.'
translation:
  language: zh_hans
  text: 这些是带领它们之人的名字：他们守望，并在各自的时节进入；他们在各自的站位、次序、时间、月份、权柄和位置中带领它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርኅዎሙ
  choice: 带领它们
  rationale: 该动词表示引导、带领；宾语复数指向本段语境中受管理的天体或时序单位，保留代词而不在正文中补明。
- source_word: የዐቅቡ
  choice: 守望
  rationale: 保留动词“看守、警醒守望”的基本意义及其职司色彩。
- source_word: ይበውኡ
  choice: 进入
  rationale: 按其通常空间义直译为“进入”，不擅自解释为“开始任职”或“出现”。
- source_word: በአዝማነ፡ ዚአሆሙ
  choice: 在各自指定的时节
  rationale: አዝማን表示时节、时期；属格结构表示属于他们的时节。“指定的”以自然汉语表达其按所定时序进入的含义。
- source_word: በመካናቲሆሙ
  choice: 按各自的所在
  rationale: መካን可指地方、位置或站位；“所在”避免过度具体化为固定岗哨。
- source_word: በሥርዓታቲሆሙ
  choice: 次序
  rationale: 该词可指秩序、安排或条例；此处与时间、月份等并列，译作“次序”最贴合宇宙运行语境。
- source_word: በስልጣናቲሆሙ
  choice: 权柄
  rationale: 保留ስልጣን的权力、管辖权含义，不弱化为单纯“职责”。
- source_word: በምቅዋማቲሆሙ
  choice: 位置
  rationale: 该词有站立之处、所处位置之意；与前面的መካን语义接近，原文的并列重复应予保留。
theological_decisions:
- issue: 带领者与被带领对象的身份
  choice: 使用“那些人”和“它们”，不在正文中明确其本体身份
  alternative: 将其解释为天使带领星辰或历法单位
  rationale: 本节本身仅用关系从句和代词，明确身份需依赖更大上下文；保留原文指代关系可避免加入未经本句明说的天使论或宇宙论解释。
- issue: “权柄”的性质
  choice: 保留为“权柄”
  alternative: 译作“管辖范围”或“职权”
  rationale: 原词既可表示权力也可表示辖权；“权柄”保留其人格性和神学张力，同时没有断言这些带领者拥有独立主权。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以冒号和分号呈现原句的层级关系，避免连续关系从句造成汉语歧义；保留原文两次“带领它们”及末尾各项并列，不合并近义词。
