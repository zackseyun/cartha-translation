base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/005.yaml
  text: Because of them, people go astray and do not reckon them in the reckoning of all the world; for people err concerning them and do not know them exactly.
translation:
  language: zh_hans
  text: 人因它们而走入歧途，在全世界的计算中[a]没有把它们算在内；因为人对它们判断有误，也没有准确地认识它们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在全世界的计算中”所对应的吉兹语较难理解，也可译作“在全世界的思量中”。在本书的天文历法语境中，译作“计算”较为可能。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“因为它们使人走入歧途，人也没有准确地认识它们。”“准确地”也可译作“仔细地”或“精确地”。
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: በእንቲአሆሙ
  choice: 因它们
  rationale: 该介词短语在此最自然地表达原因或缘由；保留复数代词，不擅自限定其所指。
- source_word: ይጌግዩ
  choice: 走入歧途
  rationale: 兼顾该动词“犯错”与“偏离正路”的意象，也适合本段关于历法偏差的语境。
- source_word: ኢየኀስብዎሙ
  choice: 没有……把它们算在内
  rationale: 在天文历法语境中采用“计算、计入”的含义，同时用自然现代汉语表达。
- source_word: ተበሐሳቤ ኵሉ ዓለም
  choice: 按全世界的历法计算
  rationale: ሐሳብ 在《天文书》中常有历法计算的技术含义；“全世界”保留原文广泛、整体性的范围，但该短语本身较难，另以脚注说明。
- source_word: ይጌግይዎሙ
  choice: 对它们有所误判
  rationale: 此处形态和句法可理解为对这些对象发生错误；该译法与前句重复词根呼应，又不强行断定是它们主动使人迷失。
- source_word: ኢያእምርዎሙ
  choice: 不……认识它们
  rationale: 保留“知道、认识”的宽泛语义，不缩窄为辨认或理解。
- source_word: ጥንቁቀ
  choice: 准确地
  rationale: 在历法知识语境中突出周密、精确之意；“准确地认识”比“确切地知道”更自然。
theological_decisions:
- issue: 反复出现的复数代词所指
  choice: 正文保留“它们”
  alternative: 明确译作天体、规定的时节、天上的律例或历法分期
  rationale: 上下文可能指天体及其运行时序，但本节本身没有明说；保留代词可避免超出原文消除歧义。
- issue: ይጌግይዎሙ 的施事关系
  choice: 译为“人对它们有所误判”
  alternative: “它们使人走入歧途”
  rationale: 传本和句法允许不同理解；正文采用与英语审校层相符的非使役理解，同时以脚注保留使役读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“历法计算”显明上下文的天文历法主题；复数代词一律保留为“它们”，不在正文中擅自补出具体所指。脚注标记均置于相关句末。
