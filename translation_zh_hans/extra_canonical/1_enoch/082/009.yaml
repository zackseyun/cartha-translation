base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/009.yaml
  text: And this is the order of the stars[a], those that set in their places, and in their times, and in their festivals[b], and in their months.
translation:
  language: zh_hans
  text: 这就是众星的秩序：它们在各自的位置、时节、节期和月份落下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዓተ
  choice: 秩序
  rationale: 此词在《天文书》中指天体运行的有序安排；“秩序”既保留结构性和规律性，也避免过强的法律色彩。
- source_word: ከዋክብት
  choice: 众星
  rationale: 原词明确指星辰；译作“众星”自然、具体，不扩大为泛指一切天体。
- source_word: የዐርቡ
  choice: 落下
  rationale: 该动词本可指进入、下行；在星体运行的语境中，最自然地指星辰落下或没入地平线。“落下”保留原文的动作意象，未额外补入“地平线”。
- source_word: በመካናቲሆሙ
  choice: 各按自己的位置
  rationale: 原文复数名词连所属后缀，表示它们各自的位置或所定站位；“各按自己的位置”符合现代汉语，并体现分配、对应之意。
- source_word: በአዝማኒሆሙ
  choice: 时节
  rationale: 此词可指时间或所定时期；“时节”简洁地保留周期与历法语感，又不把“所定”这一含义明说得过满。
- source_word: በበዓላቲሆሙ
  choice: 节期
  rationale: 原词通常指节庆或节期。在本书的历法语境中，“节期”保留宗教与历法的双重色彩，也避免让人误以为星辰本身在庆祝。
- source_word: በአውራኂሆሙ
  choice: 月份
  rationale: 原词指月份；不增译为“阴历月份”，以免超出本节明说的范围。
theological_decisions:
- issue: 是否把历法用语处理成纯世俗时间概念
  choice: 保留“节期”，并与“时节”和“月份”并列
  alternative: 把相关词统译为“季节”或“时期”等一般时间概念
  rationale: 原文把星辰秩序与节期、月份相连，带有宗教历法意味。保留“节期”可显明这一层面，而不替文本判定具体历制。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以冒号展开“秩序”的具体内容；用“各按”整合连续介词结构，使汉语自然，同时保留位置、时节、节期、月份四项并列。
