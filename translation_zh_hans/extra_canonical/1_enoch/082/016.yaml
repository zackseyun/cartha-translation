base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/016.yaml
  text: 'And these are the signs of the days that appear on the earth in the days of his dominion: heat and warmth and calm[a]; and all the trees bear fruit, and leaves come forth on all the trees, and the harvest of wheat, and the blossom of the rose, and every flower that comes forth in the field[f][e][d][c][b]; but the trees of winter dry up.'
translation:
  language: zh_hans
  text: 这些是时日的征兆：在他掌权的日子[b]，它们显现在地上[a]：汗水、炎热[f]与和煦[c]；所有树木都结果，所有树木都长出叶子；小麦成熟可收，蔷薇开花[e]，田野[d]里的各种花也都开放；冬季的树木却枯干。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们被显明在地上”；原文动词兼有“使人看见、显明”和“显现”的意味。
    reason: lexical_alternative
  - marker: b
    text: “他”很可能指上下文正在谈论、按时管辖的光体，但本节没有明说所指。
    reason: cross_reference
  - marker: c
    text: 译作“和煦”的原词含义不很确定，也可能表示温和、舒适的气候状况。
    reason: lexical_alternative
  - marker: d
    text: 译作“田野”的词也可指旷野、野地或开阔之地；这里的植物图景较支持“田野”。
    reason: lexical_alternative
  - marker: e
    text: “蔷薇”是传统辨认；原词也可能泛指某种开花植物。
    reason: lexical_alternative
  - marker: f
    text: 前两项也可译作“暑热、温暖”；第一个原词可指“汗”，也可引申指“热”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርተ መዋዕለ
  choice: 时日的征兆
  rationale: 保留“征兆”这一可观察标志的含义，也保留“日子／时日”的具体时间表达；上下文使其带有季节性意味。
- source_word: ያስተርእዩ
  choice: 显现在
  rationale: 该动词含“使看见、显明”的语义；译作“显现在”既自然，也保留被看见或呈现出来的意味。
- source_word: ስልጣኑ
  choice: 他掌权
  rationale: 原词指权柄、统治或管辖；动词化为“掌权”符合现代汉语，同时不擅自指明代词所指。
- source_word: ሀፍ
  choice: 汗水
  rationale: 该词首先可指“汗”，并可引申为热；在季节征兆的列举中保留具体可见的“汗水”，避免与下一词都译成温度概念。
- source_word: ሞቅ
  choice: 炎热
  rationale: 该词表示热或温暖；与“汗水”并列时译作“炎热”，呈现外在气候状况。
- source_word: ዛሕን
  choice: 和煦
  rationale: 此词在本处语义不十分确定，可能指温和、宜人的气候状态；“和煦”保持气候语境而不过度限定。
- source_word: ይፈርዩ
  choice: 结果
  rationale: 直接表达树木产生果实，简洁自然。
- source_word: ቈጽል ይወጽእ
  choice: 长出叶子
  rationale: 原文为叶子“出来”；现代汉语以“长出叶子”自然表达植物萌发，同时保存具体意象。
- source_word: ማእረረ ስርናይ
  choice: 小麦成熟可收
  rationale: 该短语涉及小麦的收成或成熟收割阶段；此译兼顾农作物成熟与收获的意义。
- source_word: ጽጌ ረዳ
  choice: 蔷薇开花
  rationale: 传统上将植物名认作蔷薇或玫瑰，但确切品种不明；正文采用较宽泛的“蔷薇”，并以脚注说明。
- source_word: ገዳም
  choice: 田野
  rationale: 该词也可指旷野或野地；此处与花木和小麦并列，译作“田野”较合语境。
- source_word: ዕፀወ ክረምት ይየብሱ
  choice: 冬季的树木却枯干
  rationale: 依原文保留“冬季的树木”这一略带压缩性的表达，并用“却”呈现与前述繁茂景象的对照。
theological_decisions:
- issue: “他掌权的日子”中“他”的所指
  choice: 保留第三人称代词，不在正文中指明对象
  alternative: 明确译为“太阳掌权的日子”或“该光体掌权的日子”
  rationale: 周围天文历法语境可能提示某一光体，但本节本身没有明说；保留代词可避免把推断写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以分号保持原文连续列举的节奏。对植物名、气候词和代词所指的真实不确定性均以脚注保留；不把周围宇宙论语境中的可能对象直接补入正文。
