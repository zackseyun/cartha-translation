base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/006.yaml
  text: 'For they belong to the reckoning of the year[a], and they are truly fixed forever: one in the first gate, one in the third gate, one in the fourth, and one in the sixth[b]; and the year is completed in three hundred and sixty-four days.'
translation:
  language: zh_hans
  text: 因为它们归入年度计算[a]，并且确实是永远固定的：在第一道门有一个，在第三道门有一个，在第四道门有一个，在第六道门有一个[b]；这一年的日数便满了三百六十四天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里反复出现的“一个……一个……一个……一个”，指以诺历法中分配在太阳运行四个季度里的四个附加日；该历法每年共三百六十四天。
    reason: cultural_note
  - marker: b
    text: 现存转写文本在“第四”和“第六”之后没有再次写出“门”，但上下文的排列清楚表明两处都承接同一个名词。
    reason: textual_variant
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 承接上文并说明理由，保留原文的因果连接作用。
- source_word: ሀለዉ፡ በሐሳበ፡ ዓመት
  choice: 它们属于一年的计算
  rationale: 按历法语境理解为纳入年度计算，而非仅仅“存在”；“计算”在现代汉语中清楚自然。
- source_word: ወአማን፡ ልኩዓን፡ እሙንቱ፡ ለዓለም
  choice: 并且确实永远固定
  rationale: “确实”保留强调语气，“固定”表达按尺度设定并恒久不变的秩序，同时避免加入宗派性的“命定”含义。
- source_word: አሐቲ
  choice: 一个
  rationale: 四次按分配方式重复，保留原文整齐而计量化的结构；所指由脚注说明。
- source_word: ኆኅት
  choice: 门
  rationale: 直译天体运行图式中的“门”，保留《天文书》的启示文学意象，不改写为现代天文学术语。
- source_word: ወይትፌጸም፡ ዓመተ፡ መዋዕል
  choice: 这样，一年就在……天中完成
  rationale: 保留年度周期达到完整数目的含义；“这样”使其与前述四个附加日的分配自然衔接。
- source_word: ፫፻ወ፷ወረቡዕ
  choice: 三百六十四
  rationale: 准确转写吉兹文数值，并采用现代中文数字表达。
theological_decisions:
- issue: 经文对天体与历法秩序的陈述性质
  choice: 保留其关于受设立、恒久而可靠的宇宙秩序之断言
  alternative: 将其弱化为纯粹的观测说明，或明确解释为神直接命定的教义陈述
  rationale: “确实”“永远固定”“完成”等措辞呈现稳定且规范性的创造秩序；译文既不削弱这一力度，也不补入原文未明说的施动者。
- issue: 四次“一个”的指代
  choice: 正文保留代词式的“一个”，由脚注说明是四个附加日
  alternative: 在正文中直接写成“一个附加日”
  rationale: 原文自身没有在本句明确重复“日”，保留省略可维持原有指代关系及一定程度的歧义，同时脚注保障可理解性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“门”这一启示文学和古代宇宙观术语，并以重复句式呈现历法条目的节奏。正文中的所有脚注标记均与脚注对应。
