  rationale: 修订仅处理汉语句法和年度日数的表达：“归入年度计算”对应历法上的隶属关系；“确实是永远固定的”保留原文的强调与恒久性；四次“在……门有一个”保存重复及省略的指代；“日数便满了三百六十四天”准确表达年度完成的数目。脚注标记和内容均保留，并继续将“门”的补足限定为基于上下文的文本判断。
