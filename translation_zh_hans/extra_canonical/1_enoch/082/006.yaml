  naturalness: “第一道门一个”虽可勉强理解，但不合现代汉语常规的处所—存在表达；重复“在……门有一个”既自然，也忠实保留原文的计量性重复。“确实永远固定”缺少明确的系词衔接，改为“确实是永远固定的”更通顺庄重。
  terminology: “门”恰当保留《以诺一书》天文宇宙图式，不应现代化为天文术语。“年度计算”“永远固定”“日数”均适合此处历法语境。脚注b应继续明确这只是现存转写文本的省略，不把补足当作原文无争议的明载。
