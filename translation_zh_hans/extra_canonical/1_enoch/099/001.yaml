base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/001.yaml
  text: 'Woe to you who do wickedness[a], and who praise and honor the word of falsehood: you will perish[b], and no good life will be yours.'
translation:
  language: zh_hans
  text: 你们这些作恶、称颂并尊崇虚假之言[a]的人有祸了！你们必灭亡[b]，美好的生命也不属于你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚假之言”也可译作“虚假的事”或“虚假言论”。原文名词为单数形式。
    reason: lexical_alternative
  - marker: b
    text: “灭亡”也可译作“被毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: 你们……有祸了
  rationale: 保留先知式、审判性的祸哉宣告；现代汉语中用后置结构可使长定语更清楚自然。
- source_word: እለ፡ ትገብሩ፡ ርሰናናተ
  choice: 这些作恶……的人
  rationale: 表达持续或主动行恶的含义，同时避免把该名词过度限定为某一种具体罪行。
- source_word: ወበነገረ፡ ሐሰት
  choice: 虚假之言
  rationale: ነገረ 是单数构造形，可指“言语、事情、言论”；“虚假之言”保留单数集合性及语义幅度。
- source_word: ትሴብሑ፡ ወታከብሩ
  choice: 称颂并尊崇
  rationale: 保留两个并列动词所表达的公开赞许与抬高；“称颂、尊崇”与经文庄重语域相称。
- source_word: ተሐጕልክሙ
  choice: 你们必灭亡
  rationale: 直接表达将临到受话者的毁灭或败亡，也符合汉语审判宣告的自然措辞。
- source_word: ወአልብክሙ፡ ሕይወተ፡ ሠናይተ
  choice: 美好的生命也不属于你们
  rationale: 保留原句否定拥有“美好生命”的表达，不将其缩减为今世顺遂，也不明确限定为某套来世教义。
theological_decisions:
- issue: “美好的生命”所指的范围
  choice: 保留为“美好的生命”，含有伦理及末世性的福乐意味
  alternative: 仅指今世的幸福生活；或明确指完全丧失生命
  rationale: 上下文的祸哉宣告赋予“生命”审判与末世色彩，但本节本身没有进一步界定，因此不宜把张力消解为今世财富或系统化的来世论。
- issue: “虚假之言”的对象
  choice: 保留其可指虚假言论或虚假之事的开放性
  alternative: 明确译为谎话、谎言体系或某一特定错误教义
  rationale: 原词 ነገር 的语义范围包括言语、事情和言论；经文并未指明某一教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“有祸了”传达先知式审判语气；保留并列动词与“美好的生命”的神学张力，避免加入宗派性解释。
