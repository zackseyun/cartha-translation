base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/009.yaml
  text: They will forget and be afraid[a], because they did all their works in falsehood, and they worshiped a stone[d][c][b], and they will perish in an instant.
translation:
  language: zh_hans
  text: 他们必因这些事变得邪恶[a]，并且惧怕，因为他们所做的一切都是虚假的；他们还向一块石头下拜[b]，并必在顷刻之间灭亡[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “变得邪恶”也可理解为“不敬虔”；另有译法作“忘记”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“向一块石头下拜”，以具体形象指向偶像崇拜。
    reason: cultural_note
  - marker: c
    text: “在顷刻之间”也可译作“突然”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ቦሙ፡ ይረሰዑ
  choice: 他们必因这些事变得邪恶
  rationale: ቦሙ 表示“因它们／借着它们”；在这一搭配中，ይረሰዑ 较适合按“变得邪恶、不敬虔”理解，而不是孤立地译作“忘记”。“这些事”承接上下文，同时避免凭空指定具体所指。
- source_word: ወይፈርሁ
  choice: 并且惧怕
  rationale: 保留该动词普通而直接的“害怕、惧怕”含义，不额外强化为“惊恐万状”。
- source_word: ኵሎ፡ ገብሮሙ፡ በሐሰት፡ ገብሩ
  choice: 他们所做的一切都是虚假的
  rationale: 以自然汉语表达“他们在虚假中做了自己一切的行为”，保留对其全部行为的道德判断。
- source_word: ወሰገዱ፡ ለአብን
  choice: 他们还向一块石头下拜
  rationale: 原文宾语为单数“石头”。“向……下拜”既保留具体动作，也让偶像崇拜的语境自然显明，而不把“石头”直接改写成复数偶像。
- source_word: ወይትሐጐሉ
  choice: 并必……灭亡
  rationale: 该动词表示灭亡、毁坏；“灭亡”保留结局的确定性，而不限定毁灭的具体方式。
- source_word: በምዕር
  choice: 在顷刻之间
  rationale: 按表示短促时间的副词性用法处理，即“顷刻间、突然”，而不译为“羞耻中”。
theological_decisions:
- issue: ይረሰዑ 在本句中是“忘记”还是“变得邪恶”
  choice: 译作“变得邪恶”
  alternative: “他们必忘记”
  rationale: 句首 ቦሙ 与该动词连用，更支持“因这些事而变得邪恶／不敬虔”的理解；若译“忘记”，不仅宾语缺省，ቦሙ 与后文的衔接也较生硬。脚注保留另一种词义分析。
- issue: 单数“石头”的偶像崇拜意象
  choice: 保留“向一块石头下拜”
  alternative: “敬拜石像”或“敬拜偶像”
  rationale: 原文刻意使用具体的单数“石头”；保留这一形象可传达其讽刺与谴责力量，又不把解释直接写入正文。
- issue: 末句所指是突然灭亡还是蒙羞灭亡
  choice: “在顷刻之间灭亡”
  alternative: “在羞辱中灭亡”
  rationale: በምዕር 在此较可靠地表示“顷刻间／突然”；因此不把“羞耻、羞辱”的神学含义加入正文。
translation_notes:
  register: 采用现代、庄重而清楚的审判宣告语体。“虚假的”保留原文的道德力度；“下拜”比泛化的“信奉”更贴近动作；分号划分罪行与结局，使长句在普通话中易于诵读。
