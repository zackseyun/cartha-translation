  yaml_path: translation/extra_canonical/1_enoch/099/011.yaml
  text: Woe to you who spread evil to your neighbors[c][b][a], for by your neighbors you will be slain.
translation:
  language: zh_hans
  text: 你们向邻舍散布邪恶的人有祸了！因为你们必被邻舍杀害。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向邻舍”也可译作“与同伴一起”或“借着同伴”；这里的介词关系有歧义。
    reason: lexical_alternative
  - marker: b
    text: 第二处“邻舍”也可译作“同伴”。源文在两分句中使用相关词语，形成恶行与报应之间的对应。
    reason: lexical_alternative
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: 你们……有祸了
  rationale: 保留先知性审判宣告的力度，并采用自然、庄重的现代汉语句式。
- source_word: እለ፡ ትሰፍሕዋ፡ ለእኩይ
  choice: 这些……扩散恶事的人
  rationale: 动词含扩展、铺开或使之蔓延之意；“扩散恶事”保留其具体意象，而不弱化成泛泛的“作恶”。
- source_word: በቢጽክሙ
  choice: 向邻舍
  rationale: 结合最新校审，将介词短语理解为恶事所针对的人；“邻舍”兼具邻人、同伴的语义范围。
- source_word: እስመ
  choice: 因为
  rationale: 明确引出灾祸宣告的因由和相应报应。
- source_word: በቢጸል
  choice: 被同伴
  rationale: 按所给吉兹文本理解为由同伴或邻人施行；保留与前句相关的人际报应关系，同时不把不确定的所有格补入正文。
- source_word: ትትቀተሉ
  choice: 必……杀死
  rationale: 以被动结构表达将来的审判结果；“必”传达审判语境中的确定性。
theological_decisions:
- issue: 报应公式的性质
  choice: 恶事临到邻舍的人，自己也必被同伴杀死
  alternative: 作恶者将在阴间被杀
  rationale: 现有转写读作 በቢጸል，而非 በሲኦል；因此正文不采纳“在阴间”的校改。前后涉及邻舍或同伴，仍呈现以其人之道还治其人之身的审判意味，但不虚构完全相同词形的修辞重复。
- issue: 第一处介词短语的关系
  choice: 向邻舍
  alternative: 与同伴一起／借着同伴
  rationale: 介词可容纳不同关系；结合最新校审，在正文采用受事或指向性理解，同时在脚注保留伴随或工具性的可能。
translation_notes:
  register: 采用现代、庄重而易懂的审判宣告语体。“邻舍”略带经文语感，但普通读者仍能理解；第二分句用“同伴”避免汉语中机械重复，同时脚注说明词义范围与文本争议。
