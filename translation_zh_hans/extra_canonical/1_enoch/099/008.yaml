base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/008.yaml
  text: And they will become senseless because of the madness of their heart[c][b][a], and their eyes will grow dark through the fear of their heart and through the visions of their dreams.
translation:
  language: zh_hans
  text: 他们必因心里的疯狂而失去理智，眼睛也必因心中的恐惧和梦中的异象而昏暗。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “昏暗”也可译作“变得昏暗”。这意象可能指视线模糊、因恐惧而目光失神，或比喻辨识能力丧失。
    reason: lexical_alternative
  - marker: b
    text: “梦中的异象”保留原文兼有的“看见／异象”和“梦”两层含义，不把它简化为“梦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትረሰዑ
  choice: 失去理智
  rationale: 该形式源于“忘记”义词根，在此被动／反身用法中指神志迷失、变得无知觉或失去理智；与下文“心里的疯狂”相呼应，不译作“惊恐”。
- source_word: እበደ
  choice: 疯狂
  rationale: 表达严重的失常、癫狂或愚妄；“疯狂”保留本节审判语境中的强烈程度。
- source_word: ልቦሙ
  choice: 他们的心／心里／心中
  rationale: 闪语语境中的“心”兼含思想、意志和情感；保留“心”的意象，同时按现代汉语句法调整虚词。
- source_word: ይጼለሉ
  choice: 昏暗
  rationale: 保留眼睛变暗、视线模糊的具体意象，又不将其限定为实际失明。
- source_word: አዕይንቲሆሙ
  choice: 眼睛
  rationale: 保留原文具体的身体意象，不抽象化为“视力”或“认知”。
- source_word: በፍርሃተ ልቦሙ
  choice: 因心中的恐惧
  rationale: 介词可表达原因或媒介；此处“因”在现代汉语中自然地保留因果关系，并保留重复的“心”意象。
- source_word: በርእየ ሕልሞሙ
  choice: 因梦中的异象
  rationale: 兼顾“看见／异象”与“梦”两层词义，避免仅简化为“梦”。
theological_decisions:
- issue: 苦难的性质及梦中异象的来源
  choice: 将失去理智、眼睛昏暗、内心恐惧和梦中异象呈现为彼此相关的审判性苦况，但不说明异象的具体来源。
  alternative: 明确断定异象是上帝直接赐下的审判启示，或仅是罪疚心理产生的梦。
  rationale: 吉兹语只陈述这些状态及其联系，并未交代梦中异象究竟来自神圣启示、心理恐惧，还是二者兼有，因此保留原文的神学开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“失去理智”准确传达首个动词，并与“心里的疯狂”形成语义呼应；两个脚注标记均已置于正文中。
