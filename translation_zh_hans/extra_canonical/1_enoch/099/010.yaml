base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/010.yaml
  text: And in those days[a], blessed are all those who accept the word of wisdom, and understand it, and do it, and follow the way of the Most High, and walk in the way of his righteousness, and do not act wickedly with those who act wickedly[d][c][b]; for they shall be saved.
translation:
  language: zh_hans
  text: 在那些日子，凡接受智慧之言[a]、领悟它并付诸实行，遵行至高者的道路，行在他的义路上，又不与作恶的人一同作恶的，都是有福的；因为他们必蒙拯救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “智慧之言”也可译作“智慧的信息”或“有关智慧的事”；原词可表示“言语、事情、信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: 有福的
  rationale: 保留智慧文学和末世语境中蒙神眷顾的庄重含义，不仅指主观快乐。
- source_word: ይትሜጠዉ
  choice: 接受
  rationale: 在“智慧之言”这一宾语前，表达领受并接纳的意思，且不作过度发挥。
- source_word: ነገረ ጥበብ
  choice: 智慧之言
  rationale: ነገር 可指言语、事情或信息；“智慧之言”保留原文单数结构和庄重语体。
- source_word: ያእምርዎን
  choice: 领悟它
  rationale: 接受—领悟—实行的递进关系表明这里不只是知道，而是实际理解。
- source_word: ይገብርዎን
  choice: 付诸实行
  rationale: 明确保留原文在“领悟”之后的“实行”动作，同时使现代汉语自然。
- source_word: ለፍኖተ ልዑል
  choice: 遵行至高者的道路
  rationale: ለ 在此引出 ገብረ 的宾语；结合“道路”的伦理意象，以“遵行”表达实践、持守这条道路，而不误作方位介词。
- source_word: የሐውሩ በፍኖተ ጽድቅ ዚአሁ
  choice: 行在他的义路上
  rationale: 保留“行走在道路上”的伦理隐喻；“义路”自然凝练，并保留 ጽድቅ 的神学分量。
- source_word: ኢይረሰዑ ... እለ ይረሰዑ
  choice: 不与作恶的人一同作恶
  rationale: 该动词表示行恶或不敬虔；重复“作恶”保留原文的词根呼应和主动行为色彩。
- source_word: ይድኅኑ
  choice: 必蒙拯救
  rationale: 表达将来的救拔，适合末世语境，同时不把具体救恩机制读入经文。
theological_decisions:
- issue: 末句 ይድኅኑ 所指救拔的性质
  choice: 必蒙拯救
  alternative: 必得解救／必能逃脱
  rationale: 原文可泛指获救、被解救；“蒙拯救”保留末世性的神学力度，却不界定具体方式。
- issue: 重复动词 ይረሰዑ 的伦理与审判色彩
  choice: 与作恶的人一同作恶
  alternative: 与败坏的人一同败坏／与迷失的人一同迷失
  rationale: 词根首先指行恶或不敬虔，宜保留其行为意义；它与最终审判或灭亡的关联由上下文呈现，不在译文中预先等同。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“有福的”“至高者”“义路”“蒙拯救”维持启示文学和智慧文学语域；并列结构尽量保留原文层层推进的节奏。
