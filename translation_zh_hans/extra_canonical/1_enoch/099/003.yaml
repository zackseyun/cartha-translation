base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/003.yaml
  text: In those days[a], you righteous, prepare yourselves to raise your prayers as a memorial, and place them as a testimony before the angels[c][b], that they may place the sin of sinners before the Most High as a memorial.
translation:
  language: zh_hans
  text: 在那些日子，你们这些义人，当预备好，把你们的祷告献上，作为纪念；并把它们作为证词，呈到众天使面前[a]，好让众天使把罪人的罪呈到至高者面前，作为纪念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两个相关动词的传抄或转录形式残缺；这里依上下文译作“呈到……面前”。也可能理解为“宣读”或“诵读”。
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留以诺传统中反复出现的末世时间用语及“日子”的具体意象。
- source_word: ተደለዉ ጻድቃን
  choice: 你们这些义人要预备好
  rationale: 按第二人称复数命令式理解动词，并把“义人”处理为呼语；不采用早先误作第三人称被动式的译法。
- source_word: ከመ ትንሥኡ ጸሎታቲከሙ
  choice: 把你们的祷告献上
  rationale: 动词是第二人称复数主动形式，以义人为主语；“献上”自然表达祷告向上升达的敬拜与天庭意象。
- source_word: በተዝካር
  choice: 作为纪念
  rationale: 保留在天庭中使案件被记念、被提起的司法性含义，同时不把它窄化为单纯控告。
- source_word: ሰማዕተ
  choice: 证词
  rationale: 此处是“见证、证词”，而真正的“天使”见于随后明确的 መላእክት；因此不把本词误译为“天使”。
- source_word: በቅድመ መላእክት
  choice: 呈在众天使面前
  rationale: 明确译出原文中的“在天使面前”，保持天庭场景。
- source_word: አንብ...ሙ / ያንብ...ሙ
  choice: 把这些祷告……呈在／把……呈在
  rationale: 抄本转录在两个相关动词处受损；依句法和近期校勘，将其理解为“放置、呈上”，但以脚注保留文本不确定性。
- source_word: ለኃጢአተ ኃጥኣን
  choice: 罪人的罪
  rationale: 直接保留原文“罪／罪人的”结构，不擅自加入“控告”或复数化。
- source_word: በቅድመ ልዑል
  choice: 在至高者面前
  rationale: “至高者”保留以诺书常见的庄严神称号；“在……面前”体现天庭呈案的场景。
theological_decisions:
- issue: 义人的祷告在天庭中的作用
  choice: 祷告作为“纪念”和“证词”被呈上，并使罪人的罪在至高者面前被记念。
  alternative: 把经文明确译成义人的祷告直接控告罪人。
  rationale: 上下文具有司法色彩，但原文本身使用“纪念”和“证词”，未明说“控告”；译文保留其审判张力而不强化为特定神学解释。
- issue: 天使在句中的角色
  choice: 众天使承接前面的祷告或证词，并把罪人的罪呈到至高者面前。
  alternative: 由义人自己完成全部呈献动作，或把“证词”本身译作天使。
  rationale: 近期语法校正指出原文另有明确的“众天使”，且后续复数主语最自然地回指他们；脚注同时承认受损动词造成的文本不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们这些义人”清楚表达呼语；两次“作为纪念”有意保留原文重复和天庭司法意象。唯一脚注标记已置于正文相关短语之后。
