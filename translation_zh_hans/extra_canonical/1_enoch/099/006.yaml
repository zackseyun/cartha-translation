translation:
  language: zh_hans
  text: 我再一次向你们起誓，罪人哪：罪[a]已经为那血流不止之日预备好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“刑罚（或审判）已经为那血流不止之日预备好了。”吉兹语原文作“罪”，但这里也可能以“罪”概括地指罪所招致的后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወካዕበ
  choice: 我再次
  rationale: 连接词与重复副词合用；“再次”保留反复宣告的节奏，汉语中无需机械译出句首“并且”。
- source_word: እኔ እምሕል ለክሙ
  choice: 我向你们起誓
  rationale: 动词表达郑重的誓言式断言；“起誓”比“告诉”更能保留先知性宣告的力度。
- source_word: ለኃጥኣን
  choice: 罪人哪
  rationale: 按直接呼语处理；“哪”自然地标明呼格，同时保持庄重语体。
- source_word: ለዕለተ ደም
  choice: 为那……流血……之日
  rationale: 字面为“为了血之日”；“流血之日”在现代汉语中自然表达暴力流血，也保留末世性意象。
- source_word: ዘአየሀድአ
  choice: 不止
  rationale: 以关系性短语“流血不止”对应“不停止”，避免把其所修饰的对象过度限定为“日”或抽象的“血”。
- source_word: ተደለወት
  choice: 已经……预备好了
  rationale: 保留被动完成意义，表示事物预先备妥；不明说预备者，以免补入原文未明示的施事。
- source_word: ኃጢአት
  choice: 罪
  rationale: 首先保留吉兹语名词的直接词义；其是否借代罪的刑罚或审判，则在脚注中说明。
theological_decisions:
- issue: ኃጢአት应译作“罪”本身，还是罪所招致的司法后果
  choice: 正文保留“罪”
  alternative: “刑罚”或“对罪的审判”已经预备好了
  rationale: 原词通常意为“罪”。此处措辞浓缩，可能以“罪”借代其后果；正文不替原文消解张力，脚注列出司法性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“罪人哪”保留直接呼告；“流血不止之日”兼顾原文关系结构与汉语自然度。脚注标记[a]已置于正文“罪”之后，对应真正发生词义歧义的位置。
