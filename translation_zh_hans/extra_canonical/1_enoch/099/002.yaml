base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/002.yaml
  text: Woe to those who pervert the word of righteousness and the eternal ordinance[a], and reckon themselves not to be sinners[c][b]; they shall be trampled upon the earth.
translation:
  language: zh_hans
  text: 那些歪曲正义之言和永存法度，又自以为不是罪人的人有祸了！[a]他们必在地上被践踏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪人”一词在所据埃塞俄比亚语文本中带有文本不确定性。整句也可较直译为“把自己看作那些不是罪人的人”；这里按其反身结构译为“自以为不是罪人”。
    reason: textual_variant
lexical_decisions:
- source_word: አሌ
  choice: 有祸了
  rationale: 保留先知性祸哉宣告及审判语气；在现代汉语中比单纯的“可悲”更能传达原文力度。
- source_word: ይዌልጥዎሙ
  choice: 歪曲
  rationale: 该动词表示改变、使偏离正直形态；此处宾语涉及正义与法度，“歪曲”兼顾道德和司法语境。
- source_word: ለነገረ ርትዕ
  choice: 正义之言
  rationale: ነገር 可指话语、事情或信息；“正义之言”保留话语及其内容两方面，也符合庄重文体。
- source_word: ሥርዐተ እንተ ለዓለም የኃልዉ
  choice: 永存法度
  rationale: ሥርዐት 可指秩序、规则或法令；“法度”兼有规范与秩序意味，“永存”表达其持续到永远。
- source_word: ወይሬስዩ ርእሶሙ ዘአኮኑ [ኃጥኣነ]
  choice: 又自以为不是罪人
  rationale: 将反身结构理解为“把自己看作、认为自己是”，避免误译为身体动作；同时保留其自我判断的意味。
- source_word: ይትከየዱ
  choice: 必被践踏
  rationale: 保留被动审判意象及具体的践踏画面，不弱化为抽象的“受惩罚”。
theological_decisions:
- issue: 祸哉宣告的性质
  choice: 译作针对歪曲正义与法度者的审判性宣告
  alternative: 仅译为对其境况的哀叹或一般伦理劝告
  rationale: 本节处于连续的祸哉宣告中，且结尾明确出现被践踏的惩罚意象，因此应保留司法—末世审判色彩。
- issue: “不是罪人”从句的理解
  choice: 译作这些人“自以为不是罪人”
  alternative: 译作他们事实上“原不是罪人”，或将该困难从句省略
  rationale: 反身结构支持自我认定的理解；这种译法也保留经文对自义的指控，而不把其无罪状态当成叙述者的肯定。因“罪人”一词在底本中有文本不确定性，另以脚注说明。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“正义之言”“法度”保留启示文学的肃穆感，但避免过度古雅；“有祸了”传达祸哉公式，“被践踏”保留具体的审判意象。
