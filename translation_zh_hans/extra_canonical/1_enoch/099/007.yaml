base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/007.yaml
  text: And those who bow down to stone[a], and those who make images of gold and silver and wood and clay[d][c][b], and those who bow down to evil spirits and demons and to every idol without understanding—they will find no help at all from them.
translation:
  language: zh_hans
  text: 那些向石头下拜的人[a]、制造金像、银像、木像和陶土像的人[b]，以及那些向邪灵[c]、鬼魔和各样偶像下拜、却不明白的人——他们必得不到这些所拜对象的丝毫帮助。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向石头下拜”；这里的单数可能泛指石制的敬拜对象。
    reason: lexical_alternative
  - marker: b
    text: 原文“像”是单数，随后逐项列出金、银、木和陶土；也可理解为“制造一个金的、银的、木的或陶土的像”。中文用“金像、银像、木像和陶土像”表达不同材质的类别。
    reason: source_form
  - marker: c
    text: “邪灵”也可较直译为“邪恶的灵魂”或“恶人的灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሰግዱ
  choice: 下拜
  rationale: 兼顾俯伏动作与敬拜含义，不在每处都过度限定为礼仪性的“崇拜”。
- source_word: ለአብን
  choice: 向石头
  rationale: 保留原文直接使用的材料名词；单数在此可泛指石制的敬拜对象。
- source_word: ይገብሩ ምስለ
  choice: 制造……像
  rationale: 将ምስለ理解为“像”的单数宾格，而非介词“与”；中文以统称性的“像”自然表达后列不同材料所制的形像。
- source_word: ዘወርቅ ወዘብሩር ወዘዕፅ ወዘልሕኵት
  choice: 金的、银的、木的和陶土的
  rationale: 逐项保留材料列表及原文反复出现的所属关系，同时采用自然的现代汉语。末项译为“陶土”，既保留材质意义，也避免把它过窄地限定为成品陶器。
- source_word: ነፍሳት እኩያት
  choice: 邪灵
  rationale: 在向超自然对象下拜并与鬼魔并列的语境中，“邪灵”较通顺；脚注保留“邪恶的灵魂”这一更字面的可能。
- source_word: አጋንንት
  choice: 鬼魔
  rationale: 现代中文宗教与启示文学语境中对恶性超自然存在的明确、庄重表达。
- source_word: ጣዖት
  choice: 偶像
  rationale: 直接表达供祭拜的形像或对象，符合本节论偶像崇拜的语境。
- source_word: ኢበተምሃር
  choice: 却不明白
  rationale: 保留否定认知或受教状态的含混性；“却”使其与下拜行为的关系在中文中清楚而不强行限定为“未受教”。
- source_word: ወኵሎ ረድኤተ ኢይረክቡ እምኔሆሙ
  choice: 必从这些对象得不到丝毫帮助
  rationale: 体现ይረክቡ“找到、得到”的语义和ኵሎ所加强的全然否定；“这些对象”涵盖前述石头、形像、邪灵、鬼魔和偶像。
theological_decisions:
- issue: 开头的敬拜对象应译为材料本身还是明确补作偶像
  choice: 石头
  alternative: 石像／石制偶像
  rationale: 原文直接使用“石头”这一名词。保留这一突兀表达，可显出敬拜物质之物的讽刺意味，也避免在原文尚未明确说“偶像”处先行增补。
- issue: ነፍሳት እኩያት所指的是邪灵还是恶人的灵魂
  choice: 邪灵
  alternative: 邪恶的灵魂／恶人的灵魂
  rationale: 其与“鬼魔”并列且处在偶像崇拜语境中，因此正文采用超自然含义较合上下文；但原词可指“灵魂”，故在脚注中保留另一读法，不消除神学张力。
- issue: “不明白”修饰谁或何种状态
  choice: 理解为下拜者缺乏明白或辨识
  alternative: 未受教导
  rationale: 原文否定形式可能涉及理解、学习或受教。正文采用较宽泛的认知性表达，避免把原因限定为未曾接受教导。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文反复出现的“那些……的人”结构和材料清单；结尾用“丝毫帮助”表达全然无助。所有脚注标记均置于正文相应位置。
