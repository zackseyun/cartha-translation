review_pass:
  verdict: revise
  source_fidelity: “腹中的胎儿”将原文较宽泛的“后代／子女从她们而坠落（或失落）”限定为子宫内的胎儿，超出了现有埃塞俄比亚文本及其不确定性所能稳妥支持的范围。应保留其与生育相关、却未明定为流产的含混性。其余主要处理，包括“还在哺乳时”，符合ጠበወ在此处“哺乳／喂奶”的词义，而非“观看”。
  naturalness: 整体庄重、通顺，适合启示文学语境。“腹中的胎儿也必从她们身上坠落”虽可理解，却因加入“腹中”而过度解释；改为“她们的后代也必从她们身上坠落”更贴近原文且仍自然。
  terminology: “在那些日子”“哺乳”“丢弃”“遗弃”“怜悯”均合乎现代中文的庄重经文语体。“所爱的骨肉”可表达亲属关系，但原文的“所爱的人”并不必然专指血亲；改为“所爱的人”可保留原词范围及本节的情感力度。
  issues:
  - severity: medium
    issue: 将“后代／子女”译为“腹中的胎儿”
    rationale: 原文仅以“从她们”连接后代的坠落或失落，虽处于怀孕和哺乳的语境中，却未明确说“腹中”或“胎儿”。该译法把含混而可怖的图景具体化为流产，缩窄了原文。
  - severity: low
    issue: “所爱的骨肉”将“所爱的人”限为血亲
    rationale: 上下文确实聚焦家庭关系，但该名词本身可涵盖所爱、亲爱之人；不宜由译文进一步排除较宽的指涉。
