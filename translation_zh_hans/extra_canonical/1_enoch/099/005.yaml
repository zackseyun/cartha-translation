base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/005.yaml
  text: And in those days those who are pregnant will go out and cast away their children[a], and they will abandon them; and their offspring will slip from them. And while nursing, they will cast away their children and will not return to them[e][d][c][b], and they will have no mercy on their beloved ones.
translation:
  language: zh_hans
  text: 在那些日子，怀孕的妇人必出去，丢弃自己的孩子[a]；她们必遗弃孩子，腹中的胎儿也必从她们身上坠落。她们还在哺乳时，就必丢弃自己的孩子，不再回到他们身边[b]，也不怜悯自己所爱的骨肉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句开头几个动词的传本和词义较难确定；也可理解为“怀孕的妇人必生产，并抓取自己的孩子”，或“必把自己的孩子带出去”。这里依全节反复出现的遗弃意象译出。
    reason: textual_variant
  - marker: b
    text: 本节反复提到怀孕、胎儿、哺乳、孩子和所爱之人，借家庭中本应有的怜爱彻底崩坏，描绘审判时期的惨状。
    reason: literary_note
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留启示文学中常见的时间公式，语气庄重而自然。
- source_word: እለ ይጼንሱ
  choice: 怀孕的妇人
  rationale: 动词基本义可指怀孕、受孕或生产；结合后文胎儿从她们身上坠落，译作“怀孕的妇人”最能维持上下文连贯，同时不把动作过早限定为分娩。
- source_word: ይወፅኡ
  choice: 必出去
  rationale: 按动词常见义直译为“出去”，不因上下文的暴力色彩而擅自改作“抓住”。
- source_word: ይመሥጡ ደቂቆሙ
  choice: 丢弃自己的孩子
  rationale: 此处词形和文本传承存在困难；依本节反复出现的遗弃意象作审慎处理，并用脚注保留不确定性。
- source_word: ይገድፍዎሙ
  choice: 必遗弃孩子／必丢弃自己的孩子
  rationale: 该动词表达撇下、遗弃；首次译作“遗弃”，再次译作“丢弃”，既保留重复，也使中文不显机械。
- source_word: ይደህፁ ውሉዶሙ
  choice: 腹中的胎儿也必从她们身上坠落
  rationale: 依句法中的“从她们”及生育语境，采用流产或胎儿脱落的图景；避免未经充分依据强化为主动击杀。
- source_word: እንዘ ይጠብዉ
  choice: 还在哺乳时
  rationale: ጠበወ在此指吸乳、哺乳，不是“观看”；中文按母亲作为主语自然表达为“哺乳”。
- source_word: ኢይገብኡ ኀቤሆሙ
  choice: 不再回到他们身边
  rationale: 保留空间性的“回到……那里”，同时自然呈现遗弃之后不再返回的关系断裂。
- source_word: ኢይምሕርዎሙ ለፍቁራኒሆሙ
  choice: 不怜悯自己所爱的骨肉
  rationale: “怜悯”保留审判语域；“所爱的骨肉”兼顾亲爱之人与本节明确的亲子语境。
theological_decisions:
- issue: 本节是泛指社会暴力，还是突出审判中亲情的崩坏
  choice: 译文突出母亲遗弃孩子以及天然亲情崩坏的可怖景象。
  alternative: 将其泛化为末世中的一般暴力，或明确解释为饥荒导致的弃婴。
  rationale: 怀孕、胎儿、哺乳、孩子和所爱之人等词汇连续出现，焦点显然在家庭慈爱崩坏；但原文没有明说饥荒等成因，因此不补入解释。
- issue: 胎儿“坠落”是自然流产还是主动杀害
  choice: 采用“从她们身上坠落”，保留事件的可怕结果而不明确指定施害方式。
  alternative: 译作“她们必击杀自己的婴孩”或“她们必使自己流产”。
  rationale: 该短语的词义和句法容许较强烈的暴力理解，但现有来源置信度有限；较开放的译法可保存原文张力，避免过度定论。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留启示文学的“在那些日子”和连续的“必”句式；对埃塞俄比亚文本中不稳定的动词不作武断统一，并以脚注呈现主要备选理解。
