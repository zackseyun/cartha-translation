review_pass:
  verdict: revise
  source_fidelity: 需修订。草稿把 ይጼንሱ 所指的生育动作预先处理为“怀孕”，又把 ውሉዶሙ 限定为“腹中的胎儿”；后者并非原文所明说。宜保留“生产／所生的孩子”与“从她们身上坠落”的连贯图像。开头动词链确有文本和词义困难，但译文应避免将“出去、带走（或夺取）、遗弃”的多个动作压缩为单一“丢弃”。
  naturalness: 修订后的中文保持现代汉语的清楚与庄重。“那些生产的妇人”“所爱的人”比“怀孕的妇人”“所爱的骨肉”更贴近原文，且不额外限定关系或生理阶段。
  terminology: “哺乳”正确反映 እንዘ ይጠብዉ，不能译为“观看”。“所爱的人”对应“所爱者／亲爱者”，不把原文较宽的称谓限定为“骨肉”。保留“必”以传达启示性审判段落的语气。
  issues:
  - severity: high
    issue: “腹中的胎儿”过度限定 ውሉዶሙ。
    rationale: 该词指后代、所生的孩子，不必然指尚在腹中的胎儿；“腹中”是译文添加的信息。
  - severity: medium
    issue: 开头将生育动词译成“怀孕”，并将后续动词链压缩。
    rationale: 按所给原文与审校记录，首个动词至少应保留为生产／生育的可能；“出去”和其后的带走、夺取类动作也不应完全消失。由于文本困难，以脚注说明即可。
  - severity: medium
    issue: “自己所爱的骨肉”将“所爱者”限缩为血亲。
    rationale: 上下文确实集中于孩子，却仍应保留原文称谓的广度，不把解释性结论写入正文。
  revised_text: 在那些日子，那些生产的妇人必出去，带走自己的孩子，并遗弃他们[a]；她们所生的孩子必从她们身上坠落[b]。她们还在哺乳时，就必丢弃自己的孩子，不再回到他们身边，也不怜悯自己所爱的人。
  revised_footnotes:
  - marker: a
    text: 本句开头的动词链在埃塞俄比亚文本中较难确定。也可理解为“那些生产的妇人必出去，夺取自己的孩子”，或“必把自己的孩子带出去”。本译文保留“出去、带走、遗弃”的连续动作，而不确定其具体方式。
    reason: textual_variant
  - marker: b
    text: 直译可作“她们的后代必从她们身上坠落”。该表达可能描绘婴孩脱离母亲的惨状；原文并未明确说明这是流产、死亡或其他情形。
    reason: translation_note
  revision_rationale: 修订撤除“腹中”及“骨肉”等原文未明说的限定，恢复首句生育及连续动作的基本轮廓，并以脚注保留疑难动词和“坠落”图像的歧义。保留“还在哺乳时”，因为该词义已有明确审校支持。
