  text: In those days nations shall be thrown into confusion, and the clans of the nations shall rise up on the day of destruction.
translation:
  language: zh_hans
  text: 在那些日子，列国必陷入混乱；列国的各宗族[a]必在毁灭之日[b]起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国的各亲族”或“列国的各部族”。原词可指亲属、宗族或彼此有血缘关系的群体。
    reason: lexical_alternative
  - marker: b
    text: 或译“杀戮之日”或“败亡之日”；原词可按不同语势理解为毁灭、杀戮或败亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留复数“日子”及启示文学中常见的时间公式，措辞庄重而自然。
- source_word: ይትሀወኩ
  choice: 必陷入混乱
  rationale: 表达受扰动、陷入失序的语义；汉语用“陷入混乱”自然地传达其近似被动的力量。
- source_word: አሕዛብ
  choice: 列国
  rationale: 本节描写审判背景下众国的动荡；“列国”保留集体和政治性含义，也避免引入经文未明说的“外邦人”神学对比。
- source_word: ወይትነሥኡ
  choice: 必……起来
  rationale: 保留“起身、兴起”的基本动作及其不祥意味，不进一步限定为叛乱、集结或出战。
- source_word: አዝማደ አሕዛብ
  choice: 列国的各宗族
  rationale: አዝማድ可指亲族、宗族或有血缘关联的群体；“各宗族”适合表达列国内部的亲族群体，同时保留词义范围。
- source_word: በዕለት እንተ ሐጕል
  choice: 在毁灭之日
  rationale: 该短语指向高潮性的灾难或审判之日；“毁灭”比“杀戮”范围更宽，未将灾祸限定为屠杀。
theological_decisions:
- issue: 审判预言中አሕዛብ的范围
  choice: 译为“列国”，按集体性的诸国理解
  alternative: 万民；外邦人
  rationale: 上下文呈现国际性的末世动荡，并未明确建立犹太人与外邦人的神学对照。
- issue: 各宗族“起来”的具体性质
  choice: 保留为“起来”
  alternative: 叛乱；起来争战；集结
  rationale: 原词表示起身或兴起，却未明确说明军事行动或反叛，因此不消除原文的歧义。
- issue: ሐጕል所指灾难的强度与形式
  choice: 译为“毁灭”
  alternative: 杀戮；败亡
  rationale: 原词可表达毁灭、败亡，语势也可能偏向杀戮；正文采用涵盖面较广的“毁灭”，脚注保留较强的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“列国”符合启示文学语域；分号清楚呈现两个并列预言。“起来”刻意不补入“争战”“叛乱”等解释性成分。
