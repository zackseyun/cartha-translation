base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/012.yaml
  text: Woe to you who make the measure of sin and deceit[a], and who cause bitterness upon the earth[c][b], for by it they will be destroyed.
translation:
  language: zh_hans
  text: 祸哉！你们把量器弄得充满罪恶和欺诈[a]，又在地上造成苦楚[b]；他们必因此灭亡。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把量器弄得充满罪恶和欺诈”原文较难理解；也可能指制造或使用欺诈的量器，即以不诚实的度量衡骗人。“量器”也可理解为“尺度、标准”。
    reason: lexical_alternative
  - marker: b
    text: 这里依据经核查的文本读作“造成苦楚（或苦涩）”。现有转录文本在此可能有讹误；若按该转录形式理解，曾有人译作“煽动、散布”前述恶事。
    reason: textual_variant
  - marker: c
    text: 原文先称“你们”，末句却说“他们必……灭亡”；“他们”可能泛指上述作恶的人。也可依语境译作“你们必因此灭亡”。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: 祸哉，你们这些……的人
  rationale: 这是先知性谴责的固定句式；“祸哉”保留审判语气，同时符合庄重的现代汉语表达。
- source_word: ትገብርዋ፡ ለመስፈርት፡ ኃጢአት፡ ወሐሱት
  choice: 使量器成为罪恶和欺诈
  rationale: 保留“量器/尺度”这一具体意象，并按经校勘的读法将后项理解为“罪恶和虚假、欺诈”。该短语可能涉及不诚实的度量衡，但原文句法生硬，因此不在正文中把这一解释绝对化。
- source_word: ታምርሩ፡ ዲበ፡ ምድር
  choice: 在地上造成苦楚
  rationale: 采用经核查的 Charles 1906 读法 ታምርሩ，而非转录中的疑似讹字 ተያእምሩ；该动词与“苦、苦涩”相关，在此译为造成苦楚。
- source_word: እስመ፡ ቦቱ፡ ይትዌደኡ
  choice: 因为他们必因此灭亡
  rationale: ቦቱ 可表达工具或原因，译作“因此”；末尾动词保留灭亡、毁灭的审判意味，并维持原文从第二人称转到第三人称的变化。
theological_decisions:
- issue: 是否把“量器”消解为泛指的罪行
  choice: 保留“量器”这一意象
  alternative: 译为“行罪恶和欺诈”或明确译成“使用欺诈的度量衡”
  rationale: 原文明确含有“量器/尺度”一词。保留该词既反映可能的商业欺诈背景，也避免把尚有歧义的表达过度解释。
- issue: 末句的灭亡是由罪恶本身所致，还是泛指上帝的审判
  choice: 译为“因此灭亡”
  alternative: 译为“必受审判而灭亡”
  rationale: 原句只明确给出因果或工具关系，没有在本节直接说出审判的施行者，因此不补入“上帝”或“受审判”。
- issue: 末句人称变化
  choice: 保留“你们”到“他们”的转换
  alternative: 统一译为“你们必因此灭亡”
  rationale: 现有吉兹语文本的末句是第三人称复数。虽然它可能泛指这类作恶者，也可能反映文本传承中的人称不一致，但译文不宜擅自统一。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“祸哉”承载启示文学的审判语气；正文尽量贴近吉兹语意象，同时通过脚注说明量器短语、文本讹误及人称变化，不把商业欺诈或神学因果解释写死。
