base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/001.yaml
  text: The second vision of wisdom that Enoch son of Jared[a], son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam[c][b], saw.
translation:
  language: zh_hans
  text: 以诺所见的第二个[a]异象，就是以诺所见的智慧异象；以诺是雅列的儿子，雅列是玛勒列的儿子，玛勒列是该南的儿子，该南是以挪士的儿子，以挪士是塞特的儿子，塞特是亚当的儿子。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第二个”也可译作“另一个”。原词既可表示次序，也可表示另一个同类事物。
    reason: lexical_alternative
  - marker: b
    text: 原文逐代重复“……的儿子”；译文保留了完整的谱系关系。
    reason: cultural_note
lexical_decisions:
- source_word: ራእይ / ራእየ
  choice: 异象
  rationale: 该词在启示性语境中指人所看见的超自然景象；“异象”既保留启示文学色彩，也比“显现”更贴合上下文。原文两次使用该词，正文也保留重复。
- source_word: ካልእ
  choice: 第二个
  rationale: 该词可表示“另一个”或“第二个”。本句作为新异象单元的标题，可能带有次序含义，因此正文采用“第二个”，并以脚注保留“另一个”的可能。
- source_word: ጥበብ
  choice: 智慧
  rationale: 直译该词的通常含义，并保留“智慧的异象”这一独特表述，不将其泛化为普通启示。
- source_word: ዘርእየ
  choice: 所见的
  rationale: 原文的关系结构把异象与观看者联系起来；现代汉语用“所见的”自然且庄重。原文两次出现这一结构，译文也分别表达。
- source_word: ወልደ
  choice: ……的儿子
  rationale: 原文在每一代都明确重复父子关系，故不笼统译为“后裔”，而以完整的父子链条呈现。
- source_word: ሄኖክ / ያሬድ / መላልኤል / ቃይናን / ሄኖስ / ሴት / አዳም
  choice: 以诺／雅列／玛勒列／该南／以挪士／塞特／亚当
  rationale: 采用现代简体中文圣经传统中通行、易识别的人名形式，同时维持原文所列谱系的顺序。
theological_decisions:
- issue: 标题中重复的“异象”和“所见”
  choice: 保留两个“异象”及两次观看表述，以“就是”标明同位说明关系
  alternative: 合并为“以诺所见的第二个智慧异象”
  rationale: 吉兹语原文分别出现ራእይ与ራእየ，也两次出现ዘርእየ。合并虽较流畅，却会抹去标题刻意的重复和同位结构。
- issue: ካልእ在标题中的含义
  choice: 正文译作“第二个”，脚注注明“另一个”
  alternative: 正文译作“另一个”
  rationale: 标题语境可能标示异象材料的次序，但该词本身并不排除“另一个”的意思，因此不应隐去词义上的歧义。
- issue: 谱系的完整呈现
  choice: 保留直至亚当的全部父子关系
  alternative: 压缩为“亚当的后裔以诺”或省略中间世代
  rationale: 完整谱系是标题将以诺置于太古历史中的文学方式；压缩会损失原文信息。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为兼顾原文重复与中文可读性，以“就是”连接两个同位的“异象”短语，并将连续的属格式谱系展开为清楚的父子句链。
