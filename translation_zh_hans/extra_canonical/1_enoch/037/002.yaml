base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/002.yaml
  text: 'And this is the beginning of the word of wisdom that I lifted up to speak and say to those who dwell on the dry land: Hear[a], you former ones, and see, you latter ones[d][c][b], the holy words that I speak before the Lord of Spirits.'
translation:
  language: zh_hans
  text: 这是我向住在干地上的人[a]扬声宣讲[d]的智慧之言的开端：先前的人哪，请听；后来的人哪，请看[b]我在万灵之主面前[c]所说的神圣话语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“住在地上的人。”吉兹语直译为“住在干地上的人”。
    reason: lexical_alternative
  - marker: b
    text: “先前的人”和“后来的人”很可能泛指较早与较后的世代。
    reason: cultural_note
  - marker: c
    text: 或译：“在万灵之主的临在中。”
    reason: lexical_alternative
  - marker: d
    text: “宣讲”所据短语中有一个表示“说”的词由版本编者置于方括号内，表明其文本形式并不完全确定；无论是否采纳该词，公开宣说的基本意思不变。
    reason: textual_variant
lexical_decisions:
- source_word: ወዝ፡ ርእሱ
  choice: 这是……的开端
  rationale: “ርእስ”本义为“头”，在这里惯用地表示一段言论的起头；译作“开端”既自然，也保留其篇章结构作用。
- source_word: ነገረ፡ ጥበብ
  choice: 智慧之言
  rationale: “ነገር”可指言语、事情或论说；“智慧之言”保留原文的单数形式和庄重语体，又不过度扩展为完整的“论述”。
- source_word: ዘአንሣእኩ
  choice: 扬声
  rationale: 原动词有“举起、扬起”之意；结合宣讲语境译作“扬声”，在现代汉语中自然地保留郑重发言、公开宣告的力量。
- source_word: እትናገር፡ [እብል]
  choice: 宣讲
  rationale: 原文为“说/宣说”一类动词，并可能有编者补出的近义动词；“宣讲”凝练表达其加强的宣告意味，补文情况另作脚注。
- source_word: ለእለ፡ ይነድሩ፡ ውስተ፡ የብስ
  choice: 向住在旱地上的人
  rationale: “የብስ”具体指干地、旱地。正文保留这一地貌意象，不直接泛化成“世上的人”。
- source_word: ስምዑ፡ ቀደምት
  choice: 先前的人哪，要听
  rationale: 保留命令式和呼语，也与下句“后来的人哪，要看”构成平行。
- source_word: ወርእዩ፡ ደኃርያን
  choice: 后来的人哪，要看
  rationale: 直译“看”的命令式，并保留“先前/后来”的时间对照；其具体所指可能是前后世代。
- source_word: ነገረ፡ ቅዱሰ፡ እለ፡ እትናገር
  choice: 我……所说的圣言
  rationale: “ቅዱሰ”在语法上作形容词修饰“言语”，复数关系词也支持将整体理解为复数的“圣言”，而不是“圣者之言”。汉语“圣言”可自然统摄集合性的多句话语。
- source_word: ቅድመ፡ እግዚአ፡ መንፈሳት
  choice: 在万灵之主面前
  rationale: 这是《以诺一书》中重要的神圣称号。“万灵之主”以简洁、庄重的汉语表达“诸灵之主”，并保留“面前”所表示的临在或见证场景。
theological_decisions:
- issue: “圣”是修饰言语，还是指“圣者”
  choice: 译作“圣言”，即“圣洁的话语”
  alternative: “圣者之言”
  rationale: 吉兹语的形态配合以及复数关系词支持形容词修饰“言语”的读法。此处不把“圣者”作为额外的神圣称号引入正文。
- issue: “住在旱地上的人”的范围
  choice: 正文保留具体的“旱地”意象
  alternative: 直接译为“住在世上的人”或“世人”
  rationale: 语境可能泛指全体地上居民，但原文使用的是具体的干地意象；保留该意象可避免把潜在的语义幅度提前收窄。
- issue: “先前的人”与“后来的人”所指
  choice: 保留宽泛的时间性称呼
  alternative: 明确解释成“过去和未来的世代”
  rationale: 前后世代是很可能的理解，但原文本身没有进一步界定；正文不把推论写成唯一解释。
- issue: “万灵之主”前的介词关系
  choice: “在万灵之主面前”
  alternative: “当着万灵之主”或“在万灵之主的临在中”
  rationale: “面前”既可表达空间性的临在，也可表达在其见证之下说话，保留原文可能具有的神学张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。以“扬声宣讲”传达原文“举起”言语的宣告色彩，避免生硬直译为“举起智慧之言”；以“先前的人哪……后来的人哪……”保留先知式呼告和平行结构。神圣称号统一译作“万灵之主”，不引入特定宗派术语。
