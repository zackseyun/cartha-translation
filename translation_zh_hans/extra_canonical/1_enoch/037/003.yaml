base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/003.yaml
  text: It is better to speak to the former ones[b][a], but even from the latter ones we will not withhold the beginning of wisdom.
translation:
  language: zh_hans
  text: 向先前的人说，固然更好[a]；但对于后来的人，我们也不会隐瞒智慧的开端[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直地表达为：“对先前的人说更好。”这里的“先前的人”与下文“后来的人”相对，具体所指并不明确。
    reason: linguistic_ambiguity
  - marker: b
    text: “开端”原文直译为“头”，也可理解为“首要部分”或“源头”。本节传抄文本的句法较难，早期译法曾将全句理解为：“这是第一个比喻的开端；此后不会再有另一个智慧的开端。”但按现存词形，更可能是正文所译。
    reason: textual_variant
lexical_decisions:
- source_word: እሉ፡ ቀዳሚ
  choice: 先前的人
  rationale: 将指示语与表示“在先、先前”的词合并按语境处理，指与“后来的人”相对的一群人；中文用“先前的人”保留这种时间上的对照。
- source_word: ይኄይስ
  choice: 更好
  rationale: 该词源于表示“好、较好”的词根，在这里构成比较判断；不可译作“比喻”。
- source_word: ብሂል
  choice: 说
  rationale: 这里是“说、讲述”的动词性形式，与“更好”连用，意为“说……更好”；不取“开端”之义。
- source_word: ወደኃርያንሂ
  choice: 但对于后来的人，也
  rationale: “后来的人”与“先前的人”形成对照；附加成分有“也、甚至”的强调意味。中文以“但……也”自然表达转折兼递进。
- source_word: ኢንከልእ
  choice: 我们不会隐瞒
  rationale: 按ከልአ“拦阻、扣留、不给予”的第一人称复数否定式理解；“隐瞒”适合以智慧为宾语的中文语境，同时保留“不扣留”的核心含义。
- source_word: ርእሳ ለጥበብ
  choice: 智慧的开端
  rationale: ርእስ本义为“头”，可引申为“开端、首要部分”；属格结构直译为“智慧的开端”，不进一步解释其具体所指。
theological_decisions:
- issue: 本节是否是在宣布“第一个比喻的开端”
  choice: 理解为“向先前的人说更好”
  alternative: “这是第一个比喻的开端”
  rationale: 逐词形态支持ይኄይስ为“更好”、ብሂል为“说”，而“比喻”通常应由另一词表达。因此正文采用人与人之间的时间对照，不沿用把本节当作篇章标题的旧解。
- issue: “智慧的开端”的含义
  choice: 保留字面而开放的表达
  alternative: “智慧的首要内容”或“智慧的源头”
  rationale: “头”可指开端、首要部分或源头。上下文不足以唯一确定，故正文用“开端”，脚注说明其他可能，不将其限定为某一教义概念。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“固然更好；但……也……”清楚呈现前后两组人的对照；对“智慧的开端”则有意保留原文的含混性。
