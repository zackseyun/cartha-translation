  yaml_path: translation/extra_canonical/1_enoch/037/004.yaml
  text: Until now[a], it had not been given to me before the Lord of Spirits[b], what I have received.
translation:
  language: zh_hans
  text: 直到如今[a]，我所领受的，此前未曾从万灵之主面前赐给我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到如今”也可译作“直到此时”。这里标明在所述领受之前尚未获赐；现今的情形则由上下文判断。
    reason: temporal_nuance
  - marker: b
    text: 本句原文结构艰涩。末尾动词可指“拿起、接受、领受”，也可能引申为开始讲说；原文没有明说其宾语。也可按不同句法理解译作：“直到如今，在万灵之主面前，我所拿起的尚未赐给我。”后一译法将介词短语理解为处所，未保留“从……面前”的来源意味。
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: እስከ፡ ይእዜ
  choice: 直到如今
  rationale: 保留时间界限，表明此前尚未获赐；“如今”兼具自然、庄重的现代汉语语感。
- source_word: ኢተውህበኒ
  choice: 还没有……赐给我
  rationale: 按被动形式及第一人称受事后缀翻译；“赐”体现所赐之物来自神圣权威。
- source_word: እምቅድመ
  choice: 从……面前
  rationale: 兼顾介词所表达的来源与“在某者面前”的宫廷、临在意象，避免只译作“在……面前”而丢失来源意味。
- source_word: እግዚአ፡ መንፈሳት
  choice: 万灵之主
  rationale: 作为《以诺一书》中反复出现的神圣称号，“万灵之主”在中文中简洁庄重，也自然表达“众灵之主”的集合意义。
- source_word: ዘነሣእኩ
  choice: 我所领受的
  rationale: ነሣእ可表示拿取、接受或领受；与前面的“赐给”形成自然对应，但原文未明说所领受之物，故不补作“比喻”或“启示”。
theological_decisions:
- issue: 末句动词及其省略宾语的理解
  choice: 译作“我所领受的”，但不补明所领受的具体内容
  alternative: “我所拿起的”；“我所宣讲的”；“我开始的比喻”
  rationale: “领受”符合该动词可有的接受义，并与“赐给”构成语义呼应；然而吉兹文没有明确宾语，不宜把它具体化为比喻、话语或启示。
- issue: እምቅድመ所表达的关系
  choice: 保留来源与临在双重色彩，译作“从万灵之主面前”
  alternative: “在万灵之主面前”；“由万灵之主赐下”
  rationale: 原表达既可指从某者面前而来，也带有处于其临在中的意味；主译文保留这种不完全顺滑但真实存在的张力。
translation_notes:
  register: 采用现代、庄重而可读的经文体。“万灵之主”保留本书特有的神圣称号；句中以逗号呈现原文后置关系从句的张力，同时借脚注交代语序和末动词的歧义。
