  yaml_path: translation/extra_canonical/1_enoch/050/001.yaml
  text: And in those days a change shall come for the holy ones and the chosen ones[a][b].
translation:
  language: zh_hans
  text: 在那些日子，圣洁的人和蒙拣选的人将迎来转变[a]；日子的光[b]必住在他们身上，荣耀和尊荣必归给圣洁的人。患难之日来临时，灾祸必为罪人积存起来；义人必奉万灵之主的名得胜。他必使其他人看见[c]，好让他们悔改，丢弃自己双手所做的事。他们在万灵之主面前必得尊荣，也必因他的名得救。万灵之主必怜悯他们，因为他的怜悯浩大。他的审判公正；在他的荣耀面前，不义在他的审判中站立不住。不在他面前悔改的，必灭亡。万灵之主说：“从今以后，我不再怜悯他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转变”也可译作“转向”或“逆转”。这里可能指圣洁者和蒙拣选者处境的改变。
    reason: 说明关键名词ሚጠት的词义范围，并与后文表示“怜悯”的词区分。
  - marker: b
    text: 直译为“日子的光”。原文这一表达较为罕见，其具体含义未加说明。
    reason: 保留原文不寻常的表达，同时避免把它确定为称号或作解释性改译。
  - marker: c
    text: 原文只说“他”，没有明确指出是万灵之主还是前句所提到的一方。
    reason: 保留单数代词所指的真实歧义；原文也未明说“看见”的宾语。
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留以诺文献反复出现的末世时间公式，并以现代汉语自然表达。
- source_word: ሚጠት
  choice: 转变
  rationale: 该词源于“转向、改变”的词根，指转变或局势逆转，并非“怜悯”；“转变”既忠于词义，也保留究竟如何转变的开放性。
- source_word: ለቅዱሳን ወለኅሩያን
  choice: 圣洁的人和蒙拣选的人
  rationale: 分别保留“圣洁”与“被拣选”这两个以诺传统中的群体称谓；使用“人”避免“圣徒”可能带入的后期教会制度联想。
- source_word: ብርሃነ መዋዕል
  choice: 日子的光
  rationale: 原文表达独特且可能具有称号意味；不擅自改成“永恒之光”或其他解释性说法。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: “万灵之主”庄重、简明，并能稳定呈现本书这一反复出现的神圣称号。
- source_word: ይመውኡ
  choice: 得胜
  rationale: 动词在此表示胜过或战胜；“得胜”符合审判与伸冤的语境。
- source_word: ይድኅኑ
  choice: 得救
  rationale: 保留原文从危险或审判中获救的广义，不进一步限定其救恩机制。
- source_word: ምሕረቱ
  choice: 他的怜悯
  rationale: 此处才是明确表示怜悯、慈悲的词，与开头表示“转变”的ሚጠት严格区分。
- source_word: ዐመፃ
  choice: 不义
  rationale: 该词涵盖邪恶、违法与不义；“不义”最适合与公正审判形成对照。
theological_decisions:
- issue: 开头的ሚጠት是否应译为“怜悯”
  choice: 转变
  alternative: 怜悯／慈悲
  rationale: 原词意为改变、转向或逆转；本节后文另用ምሕረት表达“怜悯”。区分两词可避免把局势的逆转提前解释成单一的神学概念。
- issue: “他必使其余的人看见”中“他”的所指
  choice: 保留代词“他”
  alternative: 明确译为“万灵之主”或“义人”
  rationale: 原文在复数的“义人”之后转为单数动词，所指可能回到万灵之主，但句法仍留有张力；正文不擅自补明。
- issue: “因他的名得救”的救恩含义
  choice: 按原文直译，不补充方式或条件
  alternative: 解释为特定宗派意义上的属灵救恩
  rationale: 经文将得救与万灵之主的名相连，却未在本句界定完整机制；译文保留这一神学张力。
- issue: “他们必得尊荣”是否加入否定
  choice: 肯定句：他们……必得尊荣
  alternative: 他们不得尊荣
  rationale: 所给吉兹语正文没有否定词，因此依原文作肯定表达，不沿用可能基于异文或旧版的否定译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。重复保留“万灵之主”“圣洁的人”“蒙拣选的人”等核心称谓，以维持以诺文献的语汇连贯性；同时避免古奥虚词和后期宗派术语。所给吉兹语材料包含传统分节中超过50:1首句的完整神谕，因此译稿按所给原文全部呈现。
