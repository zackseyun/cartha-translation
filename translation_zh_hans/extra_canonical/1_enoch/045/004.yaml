base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/004.yaml
  text: On that day I will cause my Chosen One to dwell among them[c][b][a], and I will transform heaven and make it a blessing and a light forever.
translation:
  language: zh_hans
  text: 在那日，我要使我所拣选的那一位住在他们当中[a][b]；我要改变天，使它永远成为福分和光明。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在他们中间。”
    reason: lexical_alternative
  - marker: b
    text: “我所拣选的那一位”也可译作“我的被拣选者”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使它成为永远的福分和光明。”原文“永远”在句法上是表示持续时间的短语。
    reason: previous_rendering
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: 在那日
  rationale: 保留启示文学中庄重的时间公式，也符合现代汉语经文语体。
- source_word: አነብር
  choice: 我要使……住
  rationale: 该使役动词兼有安置、使居住之意；此译法保留直接宾语与地点结构，不把含义缩窄为单纯设立。
- source_word: ማእከሎሙ
  choice: 在他们中间
  rationale: 直接表达“在他们当中、中央”的空间含义，比仅译“与他们同住”更贴近原文。
- source_word: ለኅሩየ ዚአየ
  choice: 我所拣选的那一位
  rationale: 把称号透明地译出，既保持其特指性，又不套用后期神学称号。
- source_word: ወእዌልጦ
  choice: 我要改变
  rationale: 原词表示改变、转变；“改变”自然且不额外规定变化的方式。
- source_word: ለሰማይ
  choice: 天
  rationale: 在宇宙更新的启示文学语境中指天界，而非仅仅可见的天空。
- source_word: ወእገብራ
  choice: 使它……成为
  rationale: 宾语代词回指“天”；用“成为”自然表达原文使之成为什么的结构。
- source_word: በረከተ ወብርሃነ
  choice: 福分和光明
  rationale: 保留两个名词及其赐福、发光的具体意象，不改写为抽象的“蒙福而明亮”。
- source_word: ለዓለም
  choice: 永远
  rationale: 按原文介词短语的状语功能表达持续时间，不把它形容词化为“永恒的”。
theological_decisions:
- issue: “我所拣选的那一位”的身份与称号
  choice: 我所拣选的那一位
  alternative: 我的选民；我的受膏者
  rationale: 原文是单数、特指的被拣选者；译文不将其集体化，也不补入原文没有的“受膏者”称号。
- issue: 天被改变的宇宙性意象
  choice: 我要改变天，使它永远成为福分和光明
  alternative: 我要使天永远蒙福、明亮
  rationale: 保留天本身受到改变并成为“福分和光明”的强烈启示文学图景，不将其弱化为性质上的改善。
- issue: 末句名词与时间状语的关系
  choice: 福分和光明……永远
  alternative: 永恒的福分和光明
  rationale: “永远”依照原文句法作时间状语；同时承认其具体修饰范围在汉语中可理解为整个结果状态持续不止。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“在那日”保留启示文学色彩；“我所拣选的那一位”避免生硬的“选者”，也不预先锁定其后期教义身份。正文中的脚注按语义所在位置排列。
