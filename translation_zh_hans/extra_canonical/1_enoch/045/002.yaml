base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/002.yaml
  text: And they will not ascend to heaven, nor will they arrive on earth; thus it shall be the portion of the sinners who denied the name of the Lord of Spirits, who are thus kept for the day of affliction and tribulation.
translation:
  language: zh_hans
  text: 他们不会升到天上[a]，也不会来到地上；这将是那些否认万灵之主之名的罪人的份；他们就这样被留到患难与困苦之日[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头两句在吉兹语中意思不易确定。按语法，“他们”是两个动词的主语，“天上”和“地上”表示方向；整体可能描绘罪人无论在天上还是地上都无处可逃。
    reason: textual_variant
  - marker: b
    text: “患难与困苦”也可译作“压迫与愁苦”；两个并列词共同加强将临审判的严厉意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርጉ
  choice: 升到
  rationale: 该复数动词表示向上而行、升上；与方向宾语“天上”搭配，直译为“升到”自然且符合语法。
- source_word: ይበጽሑ
  choice: 到达
  rationale: 该词通常表示抵达、达到；保留原文与前句平行而略显费解的空间意象。
- source_word: ክፍለ
  choice: 份
  rationale: 表示分配所得的份额或结局；“份”简洁庄重，并保留审判语境中的分配意味。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 直接表达原文在审判语境中的道德类别。
- source_word: ክሕዱ
  choice: 否认
  rationale: 准确表达对神圣之名的否定、拒认，而不加入后期宗派性的表述。
- source_word: ስሞ ለእግዚአ መናፍስት
  choice: 万灵之主之名
  rationale: 保留《以诺一书》中这一固定神圣称号及“名”的神学分量；“万灵”在中文中比“诸灵”更自然庄重。
- source_word: ይትዐቀቡ
  choice: 被留到
  rationale: 被动态表示他们被保留至将来的审判之日；不明说施事者，符合原文。
- source_word: ዕለተ ስራሕ ወምንዳቤ
  choice: 患难与困苦之日
  rationale: 以两个并列名词传达末世审判中加重的苦难意象，同时保持现代中文可读性。
theological_decisions:
- issue: 天地分句的主语与含义
  choice: 以复数的“他们”为主语：不能升到天上，也不能到达地上
  alternative: 天不接纳他们，地也达不到他们；或泛指天地间再无容身之处
  rationale: 吉兹语两个动词均为第三人称复数，“天”和“地”为方向宾语，因此以“他们”为主语最合语法；但其宇宙空间意象仍不寻常，故以脚注说明解释上的困难，不将其改写成明确的教义结论。
- issue: 被保留之目的
  choice: 被留到患难与困苦之日
  alternative: 被留待惩罚或审判
  rationale: 原文没有在此明说“惩罚”或“审判”，所以保留较具体的苦难措辞及隐含施事者，避免补入原文未明言的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“万灵之主”保留本书特色称号；分号呈现前后因果与宣判关系。脚注标记置于相关整节末尾，正文中的[a]、[b]与脚注完全对应。
