base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/003.yaml
  text: On that day my Chosen One will sit on the throne of glory[a], and he will choose their works and their resting places without number[d][c][b]; and their souls will grow strong within them when they see my Chosen Ones and those who have called on my glorious name.
translation:
  language: zh_hans
  text: 那日，我所拣选的那一位必坐在荣耀的宝座上；他必甄别他们的行为，而他们的安歇之处将不计其数[a]。他们看见我所拣选的众人[b]和那些以我荣耀的名为避难所的人[c]时，他们的灵魂必在他们里面刚强起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一句的句法和动词含义较难确定。正文按一种可行的断句，理解为他甄别他们的行为，而他们的安歇之处不计其数。也可理解为：“他必拣选他们的行为和他们的安歇之处”；动词可指选择、甄别或决定，“安歇之处”也可译作“住处”或“驻留之地”。
    reason: lexical_and_syntactic_ambiguity
  - marker: b
    text: 原文先以单数说“我所拣选的那一位”，这里却转为复数“我所拣选的众人”。这可能是在区分坐宝座者与同他相关的群体，但文本本身并未解释这一转换。
    reason: textual_difficulty
  - marker: c
    text: 原文动词主要有“逃往、投奔、寻求庇护”之意。因此正文直译其以神之名为避难所的意象；也有译本作“呼求……之名”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: 那日
  rationale: 保留启示文学常见的时间公式，简洁而庄重。
- source_word: ይነብር ዲበ መንበረ ስብሐት
  choice: 必坐在荣耀的宝座上
  rationale: 在“宝座”语境中，动词自然表示就座；“荣耀的宝座”保留原文名词结构。
- source_word: ኅሩየየ
  choice: 我所拣选的那一位
  rationale: 保留第一人称所属及单数称号，不将其释为“弥赛亚”等其他称号。
- source_word: የኀሪ
  choice: 必甄别
  rationale: 原动词可表示选择、挑选；在对行为的语境中，“甄别”较自然，同时不强行译成“审判”或“察验”。
- source_word: ምግባሪሆሙ
  choice: 他们的行为
  rationale: “行为”是现代汉语中自然的审判语境用词，兼顾行动与品行，不额外限定道德性质。
- source_word: ምዕራፎሙ ኍልቈ አልቦ
  choice: 他们的安歇之处多得无数
  rationale: 依照可行句法，将“无数”修饰安歇之处；同时以脚注保留整段句法及词义的不确定性。
- source_word: ነፍሶሙ በማእከሎሙ ትጸንዕ
  choice: 他们的灵魂必在他们里面刚强起来
  rationale: 保留“灵魂”、内在位置及变得坚固有力的意象。
- source_word: ለኅሩያነ ዚአየ
  choice: 我所拣选的众人
  rationale: 明确保留原文从单数称号转为复数群体的变化。
- source_word: እለ ሰከዩ ስምየ ስቡሐ
  choice: 那些投奔我荣耀之名的人
  rationale: ሰከዩ 更具体地指逃往或寻求庇护；“投奔……之名”保留以神名为避难所的形象，避免套用“呼求”这一泛化的圣经惯用语。
theological_decisions:
- issue: 单数称号“我所拣选的那一位”的身份
  choice: 原样保留这一称号
  alternative: 译作“弥赛亚”“人子”或其他协调后的称号
  rationale: 本节自身使用“所拣选的”这一称号；不借其他段落预先判定其身份。
- issue: 单数“我所拣选的那一位”与复数“我所拣选的众人”的转换
  choice: 在正文中保留单复数区别，并加注说明
  alternative: 将两处统一为单数或复数
  rationale: 现有吉兹语文本确有单复数转换；保留它可避免无根据的协调，并维持其神学张力。
- issue: 以荣耀之名为避难所的意象
  choice: 译作“投奔我荣耀之名”
  alternative: “呼求我荣耀之名”
  rationale: 所用动词主要表达逃往、投奔或寻求庇护；此译法保留原文独特意象，不将其同化为一般的祈求公式。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“必”传达预言语气；“那一位”使单数称号清楚可辨。“甄别”略带正式色彩，但能在不直接引入“审判”的情况下表达选择、区分之意。正文保留原文的句法困难与单复数张力，借脚注说明其他可行理解。
