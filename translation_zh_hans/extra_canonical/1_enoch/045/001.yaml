base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/001.yaml
  text: And this is the second parable concerning those who deny the name of the dwelling of the holy ones and of the Lord of Spirits[a][b][c].
translation:
  language: zh_hans
  text: 这是第二个比喻，论到那些否认众圣者居所和万灵之主的名的人。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语在“否认……名”之后的结构艰涩。“名”在原文中为单数；这里按压缩的属格结构译作“众圣者居所和万灵之主的名”。也可能理解为“众圣者和万灵之主的居所之名”，或作其他句法分析。
    reason: textual_variant
  - marker: b
    text: “众圣者”可能指天上的圣洁者、义人群体，或有意兼指二者。
    reason: lexical_alternative
  - marker: c
    text: “第二个”也可译作“另一个”；本书把这些比喻编排为有次序的三个，因此正文采用“第二个”。
    reason: previous_rendering
lexical_decisions:
- source_word: ወዝ
  choice: 这是
  rationale: 连接上文并引出新的篇章单元；现代汉语用“这是”自然表达指示兼判断语气。
- source_word: ካልእ ምሳሌ
  choice: 第二个比喻
  rationale: ካልእ 可指“另一个”或“第二个”；鉴于本书明确安排第一、第二、第三个比喻，此处采用序数表达，同时在脚注保留另一可能。
- source_word: ዲበ
  choice: 论到
  rationale: 此处介词引出比喻的主题，并非表示空间位置；“论到”庄重而清楚。
- source_word: እለ ይክሕዱ
  choice: 那些否认……的人
  rationale: 关系词与未完成体动词合起来表示一类人；“否认”保留拒绝、背弃的力度，而不限定为口头行为。
- source_word: ስሞ
  choice: ……之名
  rationale: 按其基本义译作“名”；不将其解释性改写为权柄、威荣或声誉。
- source_word: ለማኅደረ ቅዱሳን
  choice: 众圣者居所之名
  rationale: ማኅደር 通常指居所或住处。原文在“名”之后的属格结构艰涩，正文尽量保留其压缩结构，并以脚注说明其他分析。
- source_word: ቅዱሳን
  choice: 众圣者
  rationale: 该词在以诺传统中可能指天上的圣洁者，也可能指义人群体；“众圣者”比“圣徒”较少预设特定教会用法。
- source_word: ወእግዚአ መናፍስት
  choice: 和万灵之主之名
  rationale: 这是《比喻篇》中常见的神圣称号。汉语补出与前面的“之名”并列，以避免误读为居所同时属于众圣者和万灵之主；此补足仍属对艰涩句法的一种理解，故脚注保留其他可能。
theological_decisions:
- issue: “众圣者”的所指
  choice: 保留为“众圣者”，不明确限定
  alternative: 天上的圣洁者；义人群体；两者有意重叠
  rationale: 本节本身没有限定其所指，启示文学语境也允许这些概念重叠，因此不替原文消除张力。
- issue: “否认……名”之后属格结构的句法关系
  choice: 理解为并列否认“众圣者居所之名”和“万灵之主之名”
  alternative: “众圣者和万灵之主的居所之名”；“众圣者居所中万灵之主的名”；“众圣者借以居住的名”
  rationale: 吉兹语结构高度压缩，又缺少可供校验的希腊文或昆兰平行文本。正文采用较易懂且仍贴近词序的分析，同时以脚注明示不确定性，避免把一种解释包装成定论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“比喻”沿用启示文学篇章名称；以“万灵之主”表达固定神圣称号。正文对原文艰涩属格结构作最低限度的汉语补足，并通过脚注保存真实歧义。
