base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/005.yaml
  text: And I will transform the dry land and make it a blessing[a], and I will cause my chosen ones to dwell in it[c][b]; but those who commit sin and transgression shall not set foot in it.
translation:
  language: zh_hans
  text: 我要改变干地[a]，使它成为祝福；我要使我所拣选的人住在其上；但那些犯下罪和过犯的人必不得踏足其上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “干地”也可译作“旱地”或“陆地”。此词指干燥的地面或陆地；在本段与“天”的更新相连的语境中，也可能具有较广阔的大地范围。
    reason: 保留የብስ的词义范围及其在宇宙更新语境中的可能尺度。
  - marker: b
    text: “不得踏足其上”所译的动词，字面意思是“不得走到其中／其上”。正文按语境表达他们被排除在这更新之地以外。
    reason: 说明源文使用“去、行走”一类动词，并保留方位表达的弹性。
lexical_decisions:
- source_word: እዌልጦ
  choice: 我要改变
  rationale: 该动词表示状态的改变；“改变”自然庄重，也保留末世性更新的力度，而不额外加入源文未明说的方式。
- source_word: ለየብስ
  choice: 旱地
  rationale: የብስ可指干地、旱地，并在上文“天”的背景下可能具有大地层面的范围；“旱地”既保留干燥意象，也不限定为某一小块土地。
- source_word: እገብራ በበረከት
  choice: 使它成为福地
  rationale: 源文直译近于“使它成为祝福”。中文用“福地”自然表达土地从荒旱转为蒙福之地，同时在脚注保留更贴近形式的译法。
- source_word: ሕሩያነ ዚአየ
  choice: 我所拣选的人
  rationale: 保留“属我的／我所拣选”的关系及本书中的启示文学范畴，不套用后来的教派性称谓。
- source_word: አነብሮሙ ውስቴታ
  choice: 我要使……住在其中
  rationale: 保留使役意义，表明说话者主动安置这些人；“住在其中”符合现代汉语土地居住的表达。
- source_word: ኃጢአተ ወጌጋየ
  choice: 作恶犯罪
  rationale: 源文以两个道德过犯词并列。中文采用双重表达，保留加强语气，避免压缩成单一概念。
- source_word: ኢይከይዱ ውስቴታ
  choice: 必不能踏足其上
  rationale: 原动词基本义为去、行走；语境表达被排除在更新之地以外。“不能踏足”自然传达禁止进入，同时脚注说明字面意义。
theological_decisions:
- issue: “我所拣选的人”的身份
  choice: 译作“我所拣选的人”，不进一步界定其群体身份
  alternative: 选民／圣徒
  rationale: 源词表达被拣选者，但本节没有将其等同于某一后来的宗教群体；保留本书自身的启示文学用语和张力。
- issue: 土地应理解为局部旱地还是宇宙更新中的大地
  choice: 正文译作具体的“旱地”，同时不限定其地理范围
  alternative: 大地／荒野
  rationale: 该词有干地、旱地之义，而与前节“天”的更新相连时也可能具有宇宙尺度。译文保留具体意象，不把它明确窄化为沙漠，也不直接抽象化为全地。
- issue: “成为祝福”的性质
  choice: 译作“成为福地”
  alternative: 使它成为祝福／使它蒙福
  rationale: “福地”保留土地更新并成为蒙福居所的图景；脚注保存源文较为直接、可能更宽泛的“成为祝福”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“我要……；我要……；但……”保留原文并列结构和审判对照；避免“选民”等可能带有固定教义联想的简称。
