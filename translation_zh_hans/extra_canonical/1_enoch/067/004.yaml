base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/004.yaml
  text: And they bound those angels who had shown lawlessness in that burning valley which my grandfather Enoch had previously shown me in the west[d][c][b][a], by the mountains of gold and silver and iron and soft metal and lead.
translation:
  language: zh_hans
  text: 他们要将那些曾显露不法之事的天使囚禁在那燃烧的山谷中；那山谷在西方[a]，在金山、银山、铁山、软金属山[b]和铅山旁，是我祖父以诺先前指给我看的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向着西方”；这个词也可指“在晚上”，但下文的地点标志更支持方位含义。
    reason: lexical_alternative
  - marker: b
    text: 这里所列的这种金属具体为何并不确定，也可能指“锡”“琥珀金（金银合金）”或另一种经冶炼的柔软金属。
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐጽዎሙ
  choice: 他们要把……关在
  rationale: 该形式宜按未完成体理解，并结合未来审判语境译出将来意义；动词核心义为关闭、圈禁，比过去时的“捆绑了”更贴合形态与上下文。
- source_word: እሙንቱ መላእክት
  choice: 那些……天使
  rationale: 此处所指是受审判的超自然存在，译作“天使”明确且符合启示文学语境。
- source_word: እለ አርአይዋ ለዓመፃ
  choice: 显明悖逆的
  rationale: 保留“使……显现、显明”的动词意味，不擅自具体化为“传授”或简化为“犯了”；“悖逆”兼具道德与司法色彩。
- source_word: ቈላ እንተ ትነድድ
  choice: 燃烧的山谷
  rationale: 自然传达持续燃烧的地貌和审判意象。
- source_word: እንተ አርአየኒ ቀዳሚ እምሔውየ ሄኖክ
  choice: 是我祖父以诺先前指给我看的
  rationale: 明确保留“我祖父以诺”为主动句主语，也符合本段由挪亚发言的叙事背景；“先前”传达ቀዳሚ的回指作用。
- source_word: በዓረብ
  choice: 在西方
  rationale: 后续连续出现地理标志，因此空间义比“在晚上”更合适；脚注保留方向性译法。
- source_word: አድባረ ወርቅ ወብሩር ወሐፂን
  choice: 金山、银山、铁山
  rationale: 原文为复数构造形式并列多种金属之山；中文逐项译出，保存异象的宏大地貌。
- source_word: ነጠብጣብ
  choice: 软金属
  rationale: 具体所指金属不确定，正文采用审慎的泛称，避免无根据地确定为锡或琥珀金。
- source_word: ናእስ
  choice: 铅
  rationale: 该词在金属清单中通常理解为铅，且与本句排列相合。
theological_decisions:
- issue: 天使罪行的性质
  choice: 天使“显明悖逆”
  alternative: 天使犯了悖逆之罪／传授了悖逆
  rationale: 原文强调“显明、使之可见”，不能确定只是亲自犯罪还是向人传授，因此保留其神学张力。
- issue: 审判行动的时态与性质
  choice: 他们要把天使关在山谷里
  alternative: 他们捆绑了那些天使
  rationale: 未完成体结合未来审判语境支持将来性的圈禁；此译法不把动作提前处理为已经完成。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。重组较长的吉兹语关系从句，以分号和回指“那山谷”澄清地点、异象与以诺作主语的关系；保留金属山的逐项并列和原文的不确定性。
