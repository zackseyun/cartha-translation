base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/007.yaml
  text: And through its valleys come rivers of fire, where those angels shall be judged who led astray those who dwell upon the dry land.
translation:
  language: zh_hans
  text: 火河流经那地的山谷[a]；那些使住在旱地上的人误入歧途的天使，要在那里受审判[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流经”也可译作“来到”或“流过”。原文采用未完成式，可描写异象中正在发生或将要发生的景象。
    reason: verbal_aspect
  - marker: b
    text: “旱地”直译保留原文与水域相对的具体说法；这里可能泛指住在地上的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእነተ፡ ቈላት፡ ዚአሃ
  choice: 从那地的山谷中
  rationale: 结合本章上下文及最新校勘，将ቈላት理解为“山谷”（复数），ዚአሃ指回前述之地；介词结构表达火河经过或出自这些山谷。
- source_word: አፍላገ፡ እሳት
  choice: 火河
  rationale: 保留“火之河流”的启示文学意象；汉语用“火河”简洁、鲜明，并保有复数河流的集合意义。
- source_word: ይመጽኡ
  choice: 涌出
  rationale: 未完成式在异象叙述中可作描述性现在或将来；“涌出”与河流搭配自然，也保留“出来、来到”的动态，不改作过去时。
- source_word: ኀበ፡ ይትኴነኑ
  choice: 要在那里受审判
  rationale: 保留处所关系和被动司法含义；不将“审判”提前收窄为“定罪”。
- source_word: እልኩቱ፡ መላእክት
  choice: 那些天使
  rationale: 在《以诺一书》的异象语境中译为“天使”比泛称“使者”准确，并保留指示语气。
- source_word: አስሐትዎሙ
  choice: 使……误入歧途
  rationale: 体现使役意义，即这些天使使别人走错道路；措辞自然且保留道德分量。
- source_word: ለእለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: 住在旱地上的人
  rationale: 近直译保留“旱地”的具体宇宙地理意象，同时以“人”明确汉语所需的名词中心。
theological_decisions:
- issue: 受审天使的具体身份
  choice: 仅称为“那些使住在旱地上的人误入歧途的天使”
  alternative: 明确称其为《创世记》六章传统中的守望者
  rationale: 本节本身只说明他们是误导地上居民的天使；不在正文中加入更具体的传统身份，以保留文本自身的范围。
- issue: 审判是否等同定罪
  choice: 译作“受审判”
  alternative: 译作“被定罪”
  rationale: 原文的司法性被动表达清楚，但本词本身不必然把裁决结果明说为定罪，因此不消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。主句以“火河”起首，使异象画面清晰；保留“旱地”而不一律泛化为“大地”。所有脚注标记均置于正文相应位置。
