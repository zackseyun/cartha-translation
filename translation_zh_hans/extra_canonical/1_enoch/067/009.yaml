  to: 他们肉身的灼烧极其剧烈；照样，他们的灵也将永远改变[a]，因为在万灵之主面前，没有人能说虚妄的话。
  rationale: 将程度表达由感叹式调整为陈述式，并将“永永远远”的语义明确关联于灵的改变，避免误读为变化动作无止境地反复发生。脚注保留原文困难处及较字面的另一种句法理解，不把改变的性质解释为净化、毁灭或其他特定状态。
