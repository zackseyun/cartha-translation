base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/009.yaml
  text: And as the burning of their bodies is very great[a], so a change comes upon them in spirit forever and ever[c][b], because before the Lord of Spirits there is none who speaks a vain word.
translation:
  language: zh_hans
  text: 他们肉身的灼烧极其剧烈；照样，他们的灵也将永远改变[a]，因为在万灵之主面前，没有人能说虚妄的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一行的吉兹文较难。后半句也可较直译为：“照样，他们有灵的改变，直到永永远远。”
    reason: alternative_reading
lexical_decisions:
- source_word: ውዕየ
  choice: 灼烧
  rationale: 该词指燃烧或炽热；“灼烧”保留末世审判场景中具体而强烈的身体受苦意象。
- source_word: ሥጋሆሙ
  choice: 他们的肉身
  rationale: 原义为“他们的肉体”；“肉身”既保留身体性，也符合庄重而自然的现代汉语。
- source_word: ተውላጠ
  choice: 发生改变
  rationale: 该形式表达变化或改变的结果；此译法不将其过度解释为彻底的“转化”。
- source_word: ለመንፈስ
  choice: 他们的灵也
  rationale: 前置词短语可指变化涉及的层面或对象；结合上下文，以“灵”与前面的“肉身”形成对应，同时脚注保留更直译的结构。
- source_word: ለዓለመ ዓለም
  choice: 直到永永远远
  rationale: 这是表示无尽久远的加强式惯用语；此译法保持庄严力度。
- source_word: እግዚአ መንፈሳት
  choice: 万灵之主
  rationale: 这是《以诺一书》中固定的神圣称号；“万灵之主”自然简洁，并保留称号性。
- source_word: ዘይነግር ነገረ በከ
  choice: 能说虚妄的话
  rationale: በከ 在此意为“徒然、虚空”，故整句是“说虚妄的话”，而不是“说攻击他们的话”；“能”自然表达“没有人……”所含的绝对否定语气。
theological_decisions:
- issue: 肉身的灼烧与灵的改变之间的关系
  choice: 以“照样”保留两者的对应关系，不说明这种改变是净化、毁灭或其他特定状态
  alternative: 将灵的改变明确解释为刑罚中的彻底转化
  rationale: 原文只陈述肉身灼烧与灵之改变的对应，并未界定改变的性质；译文应保留这种神学张力。
- issue: 末句是否具有针对某些人的司法或敌对含义
  choice: 译为“没有人能说虚妄的话”
  alternative: “没有人能说攻击他们的话”或“没有人能控告他们”
  rationale: 原文 በከ 表示“徒然、虚妄”，不带第三人称复数宾语后缀；因此不应引入未由原文支持的“攻击他们”或正式控告含义。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“肉身—灵”保留原文对照；“灼烧”维持启示文学的具体意象。仅设置一条确有必要的异读脚注，并在正文中标出[a]。
