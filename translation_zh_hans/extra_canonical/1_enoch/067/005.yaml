  text: And I saw that valley in which there was a great convulsion and a convulsion of waters[a].
translation:
  language: zh_hans
  text: 我看见那山谷，谷中有一场大震荡，又有一场众水的震荡[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谷中有一场大动荡，又有一场众水的动荡。”原文两次使用同一个词；该词可指骚动、动荡或剧烈的震荡。
    reason: 保留原词的语义范围，并说明译文刻意再现原文同一名词的重复。
lexical_decisions:
- source_word: ወርኢክዋ
  choice: 我看见
  rationale: 保留异象叙事中“看见”的基本意义；句首连接词按现代汉语叙事习惯融入上下文，不机械译作“并且”。
- source_word: ለይእቲ ቈላ
  choice: 那山谷
  rationale: ቈላ指低地或谷状洼地；“山谷”自然、清楚，也符合本段审判景观。
- source_word: እንተ ሀውከ ዓቢይ ባቲ
  choice: 其中有剧烈的震荡
  rationale: ሀውከ可指骚动、动荡或剧烈扰动；“震荡”既保留具体而强烈的末世异象，又不擅自限定为地震。ዓቢይ以“剧烈”表达其加强作用。
- source_word: ወሀውከ ማያት
  choice: 众水也在震荡
  rationale: 重复“震荡”以保留原文同词复现的修辞效果；ማያት为复数，以“众水”呈现其复数和宇宙性意象。
theological_decisions:
- issue: 山谷中扰动的性质
  choice: 译为具体、强烈的物理性“震荡”
  alternative: 大骚乱；大动荡；剧烈翻腾
  rationale: 上下文是审判性的异象场景，原词容许物理性扰动；“震荡”保留末世图景的力度，同时不额外断定其必为地震或特定自然现象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“众水”略带经文语体，用来表达原文复数；避免把含义过度具体化为“地震”或“洪水”事件。
