base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/012.yaml
  text: And I heard Michael answering and saying[a], “This judgment by which the angels are judged is a testimony against the kings and the mighty[b], those who possess the dry land.”
translation:
  language: zh_hans
  text: 我听见米迦勒回答说：“天使所受的这审判，是针对那些占有干地的君王和权贵的见证[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见证”也可译作“证言”。原文名词在司法语境中可指见证或证言。
    reason: lexical_alternative
  - marker: b
    text: “干地”直译为与水域相对的陆地；这里也可能指人类居住并受统治的陆地，并不一定泛指整个宇宙。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕክዎ፡ ለሚካኤል
  choice: 我听见米迦勒
  rationale: 保留第一人称叙事和听见的对象；人名按现代中文圣经惯用形式译作“米迦勒”。
- source_word: ያውሥእ፡ ወይብል
  choice: 回答说
  rationale: 原文是“回答”和“说”的成对言说公式；中文以“回答说”自然地保留两层表达。
- source_word: ኵነኔ፡ ዛቲ
  choice: 这审判
  rationale: 指向前文所述的特定审判；“审判”兼可表达司法行动及其裁决，不预先限定为“定罪”。
- source_word: እንተ፡ ይትኴነኑ፡ መላእክት
  choice: 天使所受的
  rationale: 保留原文被动意义，表示天使是这审判的承受者；避免用“被定罪”过度明确审判结果。
- source_word: ሰማዕተ
  choice: 见证
  rationale: 该词在司法语境中可指“见证”或“证言”；选用“见证”以保留其可指证据或作证者的语义张力，并以脚注说明。
- source_word: ለነገሥት፡ ወለዐዚዛን
  choice: 控告君王和权贵
  rationale: 介词结构在此最自然地表示见证所针对的人；“权贵”兼顾权势与社会政治地位，符合启示文学语体。
- source_word: እለ፡ ይእኅዝዋ፡ ለየብስ
  choice: 那些掌控旱地的人
  rationale: 动词有持有、占有或掌握之意；“掌控”自然表达地上统治者的支配关系，而“旱地”保留与水域相对的具体原文意象。
theological_decisions:
- issue: “见证”短语的指向范围
  choice: 天使所受的审判成为控告地上君王和权贵的见证
  alternative: 天使自己是向君王和权贵作证的见证者
  rationale: 句法较自然地把“见证”作为“这审判”的表语，并把后续介词短语理解为见证所针对的人；脚注保留“证言”等词义可能，不把司法意象收窄为某一教义解释。
- issue: “旱地”的范围
  choice: 保留具体的“旱地”意象，同时用“掌控”表达人间统治
  alternative: 直接译作“全地”或“世界”
  rationale: 原词首先指与水域相对的干地，也可在语境中泛指人所居住和统治的陆地；不将其扩大为完全宇宙性的“世界”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“回答说”保留启示文学的叙事公式；用“权贵”呈现有权势的统治阶层；正文保留“旱地”的古老具体意象，并通过脚注说明其可能范围。
