base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/008.yaml
  text: And in those days those waters will be for the kings and the mighty and the exalted[a], and for those who dwell on the dry ground, for the healing of the body and for the punishment of the spirit; and their spirit will be full of pleasure, so that their bodies may be judged, because they have denied the Lord of Spirits, and they see their judgment every day[d][c][b], yet they do not believe in his name.
translation:
  language: zh_hans
  text: 在那些日子，那些水要供君王、权势者和高位者使用，也要供住在干地上的人使用，用来医治身体[a]，惩罚灵[b]；他们的灵要充满欢愉[c]，好使他们的身体受到审判，因为他们否认了众灵之主。他们天天目睹自己的审判，却仍不信他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里分别使用“身体”和“灵”；译文保留这一区分，因为本节把身体的医治和灵的惩罚并列起来。
    reason: lexical_alternative
  - marker: b
    text: “惩罚灵”也有人理解为“管教灵”或“纠正灵”，但原词可以带有惩罚、折磨的严厉意味，且上下文谈到审判。
    reason: lexical_alternative
  - marker: c
    text: “充满欢愉”这一分句在文本和语境上都很难解释。吉兹语词面可表示“欢愉”“愉悦”或类似的正面感受，但这与周围的惩罚和审判语言形成明显张力。
    reason: textual_variant
lexical_decisions:
- source_word: ወይከውኑ፡ እልኩ፡ ማያት፡ በአማንቱ፡ መዋዕል
  choice: 在那些日子，那些水要……使用
  rationale: 保留异象叙事中“在那些日子”的末世性时间公式，并按复数形式译作“那些水”；“要供……使用”自然表达原文表示归属或用途的结构。
- source_word: ለነገሥት፡ ወለዐዚዛን፡ ወለልዑላን
  choice: 君王、权势者和高位者
  rationale: 保留原文三个并列群体，不将其合并为泛称；“权势者”和“高位者”分别传达强有力者与居高位者的含义。
- source_word: ወለእለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: 住在干地上的人
  rationale: “干地”直接保留与前文“水”相对的具体意象，避免笼统译成“世上的人”。
- source_word: ለፈውሰ፡ ሥጋ
  choice: 用来医治身体
  rationale: ፈውስ 表示医治或疗愈；此处 ሥጋ 指身体层面，译作“身体”比“肉体”更自然，也不额外引入道德含义。
- source_word: ወለአዝነ፡ መንፈስ
  choice: 惩罚灵
  rationale: አዝነ 在此可指惩罚、折磨；结合审判语境译作“惩罚”，不以“管教”或“纠正”弱化其严厉程度。
- source_word: ወትውኔተ፡ ይመልእ፡ መንፈሶሙ
  choice: 他们的灵要充满欢愉
  rationale: 关键名词在此语境中含义困难，但可支持“欢愉、愉悦”这一正面词义。正文保留这种突兀张力，不擅自改成负面含义，并以脚注说明。
- source_word: ከመ፡ ይትኰነኑ፡ ሥጋሆሙ
  choice: 好使他们的身体受到审判
  rationale: 保留目的或结果关系以及被动审判含义；“受到审判”不预先把词义收窄为“被定罪”。
- source_word: እስመ፡ ክሕድዎ፡ ለእግዚአ፡ መንፈሳት
  choice: 因为他们否认了众灵之主
  rationale: “否认”表达强烈的拒绝与背弃；“众灵之主”按本书称号直译，不作教义性改写。
- source_word: ወይሬእዩ፡ ኵነኔሆሙ፡ እንተ፡ ኵሉ፡ ዕለት
  choice: 他们天天目睹自己的审判
  rationale: “目睹”保留亲眼看见之意，“天天”自然表达逐日持续的时间短语；“审判”保留司法性范围而不直接限定为刑罚。
- source_word: ወኢየአምኑ፡ በስሙ
  choice: 却仍不信他的名
  rationale: “却仍”清楚呈现他们虽目睹审判仍不相信的逆接关系；“信他的名”保留原文宗教表达。
theological_decisions:
- issue: 这些水究竟带来医治还是惩罚
  choice: 同时保留“医治身体”与“惩罚灵”，并让下文审判语言维持两者之间的张力。
  alternative: 把医治理解为反讽，或将整句统一改译为纯粹的毁灭与折磨。
  rationale: 原文确实把医治、惩罚和审判并置；译文不应为求体系一致而抹去这种张力。
- issue: “他们的灵要充满欢愉”在审判语境中的含义
  choice: 正文采用词面上可成立的正面译法“充满欢愉”，并标明文本和语境上的困难。
  alternative: 译作“充满纵欲”“充满痛苦”，或假定原文讹误后作推测性改写。
  rationale: 现有吉兹语文本支持欢愉、愉悦一类含义，但这与上下文不易协调；保留难点比未经充分依据地改成负面词更透明。
- issue: 身体与灵的关系
  choice: 分别译出“身体”和“灵”，不把两者合并为单一的人格或纯粹比喻。
  alternative: 将两者意译为人的外在和内在层面，或统一译作整个人。
  rationale: 本节有意将身体的医治、灵的惩罚及身体受审判并列，译文应保留这一结构，而不据某种人论预先加以调和。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留启示文学的时间公式、并列节奏及“众灵之主”这一固定称号；对原文中医治、欢愉、惩罚和审判之间的张力不作教派化调和。
