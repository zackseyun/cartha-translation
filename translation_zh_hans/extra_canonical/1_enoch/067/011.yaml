base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/011.yaml
  text: And the waters themselves will be changed in those days[a], for when those angels are judged in those waters, these springs of water will change, and when the angels ascend[c][b], that water of the springs will change and grow cold.
translation:
  language: zh_hans
  text: 那些水本身在那些日子要发生变化[a]；因为当那些天使在那些水中受审判时，这些水泉就会变化[c]；当那些天使上升时[b]，泉中的水也会变化，变冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节中段的吉兹语措辞较难。早期译法曾据末句“变冷”把有关水泉的词语理解为“那些水泉的热度”，但现存文本较直白地说水泉本身发生变化。
    reason: lexical_alternative
  - marker: b
    text: “当天使上升时”按原文直译；在上下文中，这可能指受审判的天使相对于水泉或炽热水域向上而行，但具体图景并不确定。
    reason: alternative_reading
  - marker: c
    text: 另一种基于旧有解释的译法是：“当那些天使在那些水中受审判时，那些水泉的热度就会改变。”此译法把有关词语理解为“热度”，而非水泉本身。
    reason: previous_rendering
lexical_decisions:
- source_word: ኪያሁ
  choice: 本身
  rationale: 作强调成分，突出发生变化的是“那些水本身”。
- source_word: ማያት
  choice: 水
  rationale: 汉语中“水”通常作集合名词；配合“那些”保留原文所指的多处水体。
- source_word: ተውላጠ
  choice: 要发生变化
  rationale: 保留状态变化及将来意义，不强化为彻底变形。
- source_word: ይትኴነኑ
  choice: 受审判
  rationale: 保留司法语义，不预先解释为定罪或受罚。
- source_word: ዐያኖሙ … አንቅዐተ ማያት
  choice: 这些水泉
  rationale: 按现存吉兹语的泉源意象翻译，不把 ዐያኖሙ 推断为“热度”；以简洁汉语表达其与水泉短语的紧密关系。
- source_word: የዐርጉ
  choice: 上升
  rationale: 直译向上的动作，同时不确定其具体空间图景。
- source_word: ይቈርሩ
  choice: 渐渐变冷
  rationale: 表达变冷的结果，并以“渐渐”自然呈现起始变化意味。
theological_decisions:
- issue: 天使所受审判的性质
  choice: 受审判
  alternative: 被定罪／受惩罚
  rationale: 原词明确属于司法语域，但本节没有在该动词中明说判决结果。
- issue: 天使的行动与水发生变化之间的关系
  choice: 保留审判、上升与水变化的并列关联
  alternative: 把水明确解释为刑罚工具或象征反应
  rationale: 经文把这些事件联系起来，却没有说明其机制，故不作体系化解释。
- issue: “上升”的具体所指
  choice: 按字面译为“上升”
  alternative: 从水泉中出来／升到某一地点
  rationale: 原文的向上动作明确，但出发点、终点和场景关系并不明确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号划分长句层次；保留末世异象中水、泉、审判与上升之间未被解释的张力。所有脚注标记均置于正文相应位置。
