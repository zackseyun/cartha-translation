  rationale: 修订避免将困难的来源短语过度规整为明确的并列施事，保留“他们”的指代及其“骚动”的不透明性；同时纠正末句添加的“所在”关系，并以“结合”替代不适用于气味的“汇合”。脚注标记均有对应条目，且替代句明确说明其对“他们的骚动”的处理困难。
