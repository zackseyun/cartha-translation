base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/006.yaml
  text: And when all this happened[a], from that fiery stream and their convulsion in that place, a smell of sulfur was produced and joined with those waters[c][b]; and that valley of the angels who led astray burns beneath that land.
translation:
  language: zh_hans
  text: 这一切发生时[a]，从那道火流和他们在那地方的骚动中，生出了硫磺的气味[c]；这气味与那些水结合[b]。那些使人迷失的天使的山谷，正在那片土地下面燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“硫磺”也可用较传统的说法译作“硫黄”。
    reason: lexical_alternative
  - marker: b
    text: 本节吉兹语有几处难解；“与那些水结合”也可理解为“与那些水混合”。
    reason: alternative_reading
  - marker: c
    text: 本句也可译作：“这一切发生时，这一切从那道火流而来；在那地方，生出了硫磺的气味。”这种读法对“他们的骚动”一语的处理较为困难。
    reason: alternative_syntax
lexical_decisions:
- source_word: ነጠብጣብ እሳት
  choice: 火流
  rationale: 原词组带有火滴落、流淌的意象；“火流”在中文中简洁自然，并适合此处地下燃烧的异象场景。
- source_word: ሀውኮሙ
  choice: 他们……的震动
  rationale: 按最新源文校订，将该词理解为“他们的震动、骚动”；“震动”既保留强烈的运动感，也避免把它误并入硫磺气味。
- source_word: መካን
  choice: 地方
  rationale: 采用宽泛而自然的地点用语，不把异象中的具体地貌解释得过细。
- source_word: ተወልደ
  choice: 产生了
  rationale: 字面有“生出”之意；描述气味出现时，“产生了”更符合现代汉语，同时保留其从该处发出的关系。
- source_word: ጼና ተይ
  choice: 硫磺的气味
  rationale: 用现代常见的“硫磺”表达相关物质，并保留原文的嗅觉成分，而非仅译作“硫磺”。
- source_word: ተኃብረ ምስለ እልኩ ማያት
  choice: 与那些水汇合
  rationale: 该动词表达连接或结合；“汇合”能保留与水相接的图景，又不武断限定为完全混合。
- source_word: ቈላ
  choice: 山谷
  rationale: 在《以诺一书》的地貌语境中指谷地或低洼处；“山谷”清楚、自然。
- source_word: እንተ መላእክት እለ አስሐቱ
  choice: 那使人迷失的众天使所在的山谷
  rationale: 主动关系从句表明天使是引人入歧途者；补出“使人”以使中文完整，但不限定受迷惑者的具体身份。
- source_word: ትነድድ መትሕተ ይእቲ ምድር
  choice: 正在那片土地下面燃烧
  rationale: 表达持续的地下燃烧；“那片土地”指局部地域，避免理解为整个世界。
theological_decisions:
- issue: 受罚天使的身份及其动作方向
  choice: 使人迷失的众天使
  alternative: 迷失了的众天使／欺骗的众天使
  rationale: 主动形式最自然地把天使描写为使别者走入歧途的行动者；译文保留当地段的以诺传统措辞，不以较晚的邪灵观念加以协调。
- issue: 硫磺气味与水的关系
  choice: 这气味与那些水汇合
  alternative: 这气味与那些水混合
  rationale: 源语可表示连接、结合，也可能指实际混合；正文用较开放的“汇合”，脚注保留“混合”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留异象叙述的地貌和感官意象；对源文句法的困难不作过度平整，并以脚注呈现可行异读。正文中的脚注标记均已对应列出。
