base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/001.yaml
  text: And in those days the word of the Lord came to me[a], and he said to me, “Noah, your portion has come up before me—a portion without blame[b], a portion of love and uprightness.”
translation:
  language: zh_hans
  text: 在那些日子，主的话临到我[a]，他对我说：“挪亚，你的分已经升到我面前——一份无可指责、带着爱与正直的份。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译可作“主的话来到我这里”。这里采用汉语常见的启示用语“临到我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበእማንቱ፡ መዋዕል
  choice: 在那些日子
  rationale: 保留以诺传统中反复出现的末世性时间公式，也符合现代汉语庄重叙事的表达。
- source_word: ቃለ፡ እግዚአብሔር
  choice: 主的话
  rationale: 这是先知性启示的固定表达；译作“主的话”既简洁，又保留正式的启示意味。
- source_word: ኀቤየ
  choice: 临到我
  rationale: 结合“主的话”采用汉语中自然的启示公式；原词本身表示朝向说话者，脚注提示其较直译的空间表达。
- source_word: ክፍልከ
  choice: 你的分
  rationale: “分”可涵盖所分得的份额、命定的位置或所得的产业，不把本句限定为单一神学概念。
- source_word: ዐርገ፡ ኀቤየ
  choice: 已经升到我面前
  rationale: 保留动词明确的向上运动意象及进入神面前的场景。
- source_word: ዘአልቦቱ፡ ሒስ
  choice: 无可指责
  rationale: 表达没有过失可供指控的司法或声誉意味，同时避免直接断言绝对无罪。
- source_word: ፍቅር
  choice: 爱
  rationale: 保留原文名词的基本义，不将其教派化或抽象化。
- source_word: ወርትዕ
  choice: 正直
  rationale: 传达伦理上的端正与正直，也避免在此处过早限定为系统神学意义上的“称义”或“义”。
theological_decisions:
- issue: 如何理解挪亚的“分”升到神面前
  choice: 你的分已经升到我面前
  alternative: 你的份额已经升到我这里；你的命分已经呈到我面前
  rationale: 原文可指所分得的份、命定的位置或人在神面前的状况。正文保留“分”及上升意象，不替读者确定其唯一所指。
- issue: “无可指责”是否表示绝对道德完美
  choice: 无可指责
  alternative: 无可非议；无瑕疵
  rationale: 原短语强烈肯定挪亚，却可能侧重没有可供控告或责难之处；此译法避免把它静默扩大为绝对无罪。
- issue: “爱与正直”与“分”的语法关系
  choice: 是充满爱与正直的分
  alternative: 是爱与正直的分；是蒙爱且正直的分
  rationale: 原文以名词并列，关系较为凝练。汉语正文用“充满”使句子自然，但不把“爱”明确限定为挪亚爱神、神爱挪亚或一种抽象品格。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。保留“那些日子”“主的话”“升到我面前”等启示文学意象；用“分”维持原文在份额、命定位置与属灵状况之间的开放性。
