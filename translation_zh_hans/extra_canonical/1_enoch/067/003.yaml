base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/003.yaml
  text: And I will establish your offspring before me forever and ever[a], and I will make those who dwell with you fruitful. It shall not be barren upon the face of the dry ground[c][b], but it shall be blessed and multiplied on the dry ground in the name of the Lord.
translation:
  language: zh_hans
  text: 我要使你的后裔永永远远坚立在我面前，也要使那些与你同住的人繁衍。你的后裔在旱地上必不致不育[a]，反而要奉主的名，在旱地上蒙福增多。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必不致不育”依据语境所作的校订。现存吉兹语形式带有疑难标记，按字面似为“必不商议”；两种读法字形非常接近，而“不育”与下文“蒙福增多”的对照更为连贯。
    reason: textual_variant
  - marker: b
    text: “旱地”直译原文的具体表达，也可泛指“土地”或“大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: አጸንዖ
  choice: 使……坚立
  rationale: 该动词有使之坚固、确立之意；“坚立”既贴近原义，也适合此处关于后裔长久存续的庄重应许语境。
- source_word: ዘርእከ
  choice: 你的后裔
  rationale: 原词是集合性单数，可指种子或子孙；“后裔”在现代汉语中自然，并保留谱系含义。
- source_word: በቅድሜየ
  choice: 在我面前
  rationale: 保留原文的空间及关系性表达，不额外加入盟约等未明说的概念。
- source_word: ለዓለመ ዓለም
  choice: 永永远远
  rationale: 以汉语常用的叠加强调形式表达原文“世世代代／直到永远”的强化永恒公式。
- source_word: አዘርኦሙ
  choice: 使……繁衍
  rationale: 该词根可有播撒、散布之意；结合后文不绝育、蒙福和增多的语境，“繁衍”较自然，但不把它解释成负面的驱散。
- source_word: እለ ያኃድሩ ምስሌከ
  choice: 那些与你同住的人
  rationale: 直接表达共同居住或与之同在的意思，清楚而庄重。
- source_word: †ኢይመክር
  choice: 必不绝育
  rationale: 抄本形式按字面似为“必不商议”，但有疑难符号，且上下文紧接蒙福与增多；正文采用仅一字母之差、语境高度吻合的校订读法“绝育／不结果”，并以脚注公开说明。
- source_word: ገጸ የብስ
  choice: 旱地之上
  rationale: 原义近于“旱地的表面”；汉语用“旱地之上”保留具体意象，又避免生硬的“旱地之面”。
- source_word: ይትባረክ
  choice: 蒙福
  rationale: 该形式可有被动或反身色彩；在此与“增多”并列，“蒙福”最自然，也不强行指定施事方式。
- source_word: ይትባዛሕ
  choice: 增多
  rationale: 准确表达数量增长、繁多之意，并与后裔主题呼应。
- source_word: በስሙ ለእግዚአ
  choice: 奉主的名
  rationale: 介词短语可表凭借、关联或范围；“奉主的名”是自然庄重的汉语，同时保留与主之名相关的作用含义。
theological_decisions:
- issue: 是否将应许明确译成盟约术语
  choice: 译作“使你的后裔永永远远坚立在我面前”
  alternative: 译作“与自己的后裔立永远的约”
  rationale: 原文虽有强烈的永久应许色彩，却未明说“约”；因此保留其神学分量，不增添特定范畴。
- issue: 疑难词†ኢይመክር应按抄本字面还是按语境校订
  choice: 正文采用“必不绝育”，脚注保留抄本字面读法
  alternative: 正文直译为“必不商议”
  rationale: 现存形式带疑难标记，字面读法在句法和语境中十分突兀；近似字形的校订与后文“蒙福增多”直接形成对照。不过，由于校订并非无争议，必须在脚注中说明。
- issue: 单数动词的所指
  choice: 以“你的后裔”为单数集合性先行词
  alternative: 以“那些与你同住的人”为复数先行词
  rationale: 后续动词为第三人称阳性单数，更自然地回指集合性单数“你的后裔”；汉语第二句明说主语以避免误连。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“在我面前”“永永远远”“奉主的名”等经文语体，但避免古奥句法。因原文后续动词为单数，第二句补出“你的后裔”作为主语，以清楚呈现其回指关系。
