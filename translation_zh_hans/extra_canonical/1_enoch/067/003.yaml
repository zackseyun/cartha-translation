    issue: “绝育”含义不当且搭配生硬
    rationale: “绝育”多指对人或动物实施绝育，容易引入原文没有的人为行为。此处校订读法所需表达的是不育、荒芜的否定；“不致不育”更贴近且较自然。
  - severity: low
    issue: 同一“dry ground”译法不统一
    rationale: 正文先作“旱地之上”，后作“旱地上”。两者均可，但统一为“旱地上”更流畅。
