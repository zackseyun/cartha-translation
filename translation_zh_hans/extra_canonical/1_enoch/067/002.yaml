base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/002.yaml
  text: And now the angels are making a wooden structure[a]; and when the angels have finished that, I will place my hand upon it and guard it, and from it there will come the seed of life, and a transformation will occur[e][d][c][b], so that the dry ground may not remain barren.
translation:
  language: zh_hans
  text: 如今，天使正在建造一座木制构筑物[a]；天使完成之后，我要把双手放在它上面，守护它[b]。生命的种子将从中而出[c]，并且将发生一种转变[d]，使干地不再荒芜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用的是与“木、树、木料”相关的词；这里也可理解为“木料”“木制器具”或“树木”。本章上下文常使人联想到挪亚的方舟，但本节并未直接写出“方舟”。
    reason: lexical_alternative
  - marker: b
    text: 原文这一分句较难，直译近于“我要把我的双手放在它上面，并守护它”。另有理解为：“众天使要把我的双手放在它上面，并看守它。”
    reason: textual_variant
  - marker: c
    text: “生命的种子”依原文直译；它可能指带来生命的后裔、繁衍的能力或重新恢复的生机。
    reason: lexical_alternative
  - marker: d
    text: 原文此处含义不很确定，也可译为“将有一种转变出现”或“新的生长将显现”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብሩ
  choice: 正在建造
  rationale: 未完成体在异象叙事中可表达正在进行或即将进行的动作；“正在建造”保留场景的即时感。
- source_word: መላእክት
  choice: 众天使
  rationale: 《以诺一书》的异象语境指向天上的使者，而非普通人间信使。
- source_word: ዕፀወ
  choice: 一座木制构筑物
  rationale: 该词属于“木、树、木料”的词汇范围；结合上下文及随后阴性单数代词所指，译作单一的木制构筑物较合适，同时以脚注保留“木料、木制器具、树木”等可能性。
- source_word: ወድኡ
  choice: 造完
  rationale: 该动词表示完成；结合前面的建造动作，现代汉语以“造完”表达最自然。
- source_word: እወዲ እዴየ ዲቤሃ
  choice: 我要把双手放在它上面
  rationale: 短语明确包含第一人称动作、“我的双手”和“在它上面”；直译保留其不寻常意象，不擅自解释其象征意义。
- source_word: እዐቅባ
  choice: 守护它
  rationale: 该动词有看守、护卫、保存之意；“守护”兼具主动看守与保护的含义。
- source_word: ዘርአ ሕይወት
  choice: 生命的种子
  rationale: 依原文保留“种子—生命”的具体比喻，不限定为后裔、繁殖能力或复苏。
- source_word: ተወላጥ ይባእ
  choice: 会发生变化
  rationale: 此难解短语指向随后出现或到来的改变；译文采用克制而自然的说法，不擅自具体化为萌芽或农业复苏。
- source_word: የብስ ዕራቆ
  choice: 干地不再荒芜
  rationale: 两个词共同呈现干旱、裸露或不结果实的土地形象；“干地……荒芜”在汉语中自然，并与本节的生命和繁衍意象相连。
theological_decisions:
- issue: 本节究竟描写实际的土地复苏，还是象征性的生命更新
  choice: 保留“木制构筑物”“生命的种子”“干地”等具体异象，不把全节限定为普通农业或纯粹象征。
  alternative: 可解释为洪水后实际的生育和土地复苏，也可解释为复活或新创造的象征。
  rationale: 原文的异象语言容许多层含义，却没有明确要求单一解释；译文因此保留其神学张力。
- issue: 把双手放在构筑物上的主语
  choice: 按语法表层译为第一人称“我”。
  alternative: 有旧译将众天使延续为主语，理解为“天使要把我的双手放在其上”。
  rationale: 动词形式与“我的双手”较直接支持第一人称表达，但原句传承和句法均较困难，故在脚注交代另一理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“木制构筑物”避免过早直接写成“方舟”；“生命的种子”保留原文意象；对句法和词义确有困难之处以脚注明示，不在正文中消除歧义。
