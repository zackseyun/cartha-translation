base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/013.yaml
  text: For these waters of judgment are for the healing of the flesh of the kings and for the lust of their flesh[b][a]; and because of this they do not see and do not believe that those waters will change and become a fire that burns forever and ever.
translation:
  language: zh_hans
  text: 因为这些审判之水[a]是为医治众王的肉体，也供他们肉体的情欲所用；正因如此，众王看不见，也不相信那些水会改变，成为永永远远燃烧的火。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判之水”也可理解为“审判的众水”；汉语以集合名词“水”表达，同时保留“这些”所指的复数意象。
    reason: lexical_alternative
  - marker: b
    text: 现存的逐节转录在跨页处只保留了本节开头“因为这些审判之水”；此处依据同一版本下一页所载的本节续文补全。若仅按截断片段，可译作：“因为这些是审判之水。”
    reason: source_truncation
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 引出解释或根据；“因为”在现代汉语中自然地保留原词的因果、说明作用。
- source_word: እሉ
  choice: 这些
  rationale: 保留复数指示意义，并指向异象场景中眼前所说的水。
- source_word: ማየ
  choice: 水
  rationale: 汉语“水”通常以集合名词表达，既可对应单数也可对应复数；用“这些……之水”保留具体的异象意象。
- source_word: ኵነኔ
  choice: 审判
  rationale: 保留司法和末世性语义的宽度，不把含义限定为“定罪”或“刑罚”。
- source_word: ለፈውሰ
  choice: 为医治
  rationale: 保留目的或用途关系，不将其改写为已经发生的医治。
- source_word: ሥጋሆሙ
  choice: 他们的肉体
  rationale: 直译“他们的肉体”，保留本节反复出现的身体性措辞。
- source_word: ፍትወተ
  choice: 情欲
  rationale: 该词可指欲望、贪恋或肉欲；上下文与“肉体”连用，译作“情欲”既自然又保留负面张力。
theological_decisions:
- issue: 末尾司法名词应表达广义的司法行动还是惩罚结果
  choice: 审判
  alternative: 定罪；刑罚
  rationale: “审判”保留神圣司法行动及其惩罚后果之间的张力，不预先把词义缩窄。
- issue: 审判之水与医治、情欲之间看似矛盾的关系
  choice: 按原句保留“为医治……也为……情欲”
  alternative: 解释为虚假的医治、纵欲的工具或惩罚性的医治
  rationale: 原句把这些概念并置，却没有明确解释其关系；正文不替作者消解这种启示文学中的张力。
- issue: 水变为永远燃烧之火的表述
  choice: 将会改变，成为永永远远燃烧的火
  alternative: 象征永刑；变成永不熄灭的火
  rationale: 保留异象本身的转变语言和时间强度，不额外判定其象征机制或系统神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“审判之水”“永永远远”等措辞保留启示文学的肃穆感；不对“医治”与“情欲”的反常并置作释义性改写。
