base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/002.yaml
  text: And I looked at the tablets of heaven[a], and I read all that was written, and I understood it all; and I read the book of all the deeds of humankind and of all the children of flesh upon the earth[d][c][b], to the generations of eternity.
translation:
  language: zh_hans
  text: 我观看天上的书版[a]，读了所写的一切，也全都明白了；我又读了那卷书，书中记载着人类的一切行为，以及地上一切血肉之子[b]，直到永恒的世代[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书版”指写有文字的板片；也可译作“天上的版册”。
    reason: cultural_note
  - marker: b
    text: “血肉之子”是闪族语言风格的表达，指处于属地、必朽状态的人。
    reason: cultural_note
  - marker: c
    text: 也可译作“直到万世万代”或“直至永远的世代”。原文语气宏阔，并不只是狭义的年代标记。
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: 我观看
  rationale: 采用庄重而自然的异象叙述用语，表达有意识地观看，不强化为凝视或考察。
- source_word: በፀፍፀፈ ሰማይ
  choice: 天上的书版
  rationale: 保留天上实体书写板片的具体意象；“书版”比单说“书”更贴近原文，同时借脚注避免与现代出版版本混淆。
- source_word: አንበብኩ ኵሎ ዘጽሑፍ
  choice: 读了所写的一切
  rationale: 既保留“一切”的总括意味，也呈现“所写”的被动性质。
- source_word: አእመርኩ ኵሎ
  choice: 也全都明白了
  rationale: 该动词在此指认识、领会；“明白”自然体现阅读之后的理解。
- source_word: አንበብክዋ ለመጽሐፈ
  choice: 我又读了那卷……的书
  rationale: 保留原文重复的“读”以及明确的书卷对象；“那卷”符合古代书卷语境。
- source_word: ኵሉ ምግባሮሙ ለሰብእ
  choice: 人类……一切行为
  rationale: ምግባር 可指行为、作为；“人类”在普遍语境中避免把 ሰብእ 不必要地限于男性。
- source_word: ውሉደ ሥጋ
  choice: 血肉之子
  rationale: 直译保留启示文学中关于受造、属地且必朽之人的鲜明表达，不将其平化为“凡人”。
- source_word: ዘዲበ ምድር
  choice: 地上
  rationale: 原文是无动词的关系结构；不补入“现在”或“将来”，以免增添原文未明说的时态限制。
- source_word: እስከ ትውልደ ዓለም
  choice: 直至永恒的世代
  rationale: 保留原语宏阔的世代性和永恒性，不简单压缩为“永远”。
theological_decisions:
- issue: “血肉之子”所表达的人论意象
  choice: 保留“血肉之子”
  alternative: 凡人；血肉之躯的人；世人
  rationale: 这一表达凸显人在天上记录面前属地、受造且必朽的处境；保留原有意象，但用脚注说明其所指，不附加特定宗派解释。
- issue: 地上之人的时间范围
  choice: 只译“地上”，不补系词和时态
  alternative: 现今在地上的；将要在地上的
  rationale: 原文无明示时态；让后面的永恒世代自然扩展范围，可保留现在与未来均可能包含在内的开放性。
- issue: 结尾短语的修饰范围
  choice: 按原有次序置于全句末尾
  alternative: 明确改写为“历世历代所有人的行为”
  rationale: 原文结尾可广泛限定书中记录及其世代范围；不把它狭窄地锁定为只修饰某一个成分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留异象文学中的“书版”“血肉之子”和“永恒的世代”等具体、宏阔意象；通过脚注解释不够日常的表达，而不在正文中将其平化或作教义化阐释。
