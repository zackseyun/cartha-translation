  source_fidelity: 首半节“观看天上的书版……读了所写的一切……全都明白了”忠实且保留异象叙述的重复。后半节草稿把“人类”和“地上所有血肉之子”并列后共同归入“一切行为”，使原文中“人类的一切行为”与“地上一切血肉之子”的并列关系不够清楚，也造成两个高度重叠的人类称谓共同作“行为”所属者的语义不顺。修订将二者按原文并列呈现，不判定末尾时间短语的狭窄修饰范围。
