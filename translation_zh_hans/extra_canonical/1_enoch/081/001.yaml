base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/001.yaml
  text: And he said to me[a], “Look, Enoch, at the tablets of heaven, and read what is written on them, and understand everything[c][b], one by one.”
translation:
  language: zh_hans
  text: 他对我说：“以诺，你看天上的书版，读上面所写的，并要逐一明白一切。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逐一明白一切”也可译作“把每一件事都明白”。原文以“一个、一个”的重复形式强调逐项、无一遗漏。
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጽር
  choice: 看
  rationale: 这是表示观看的命令式；“看”直接自然，也保留了异象叙事中的指示语气。
- source_word: ዘፀፍፀፈ ሰማይ
  choice: 天上的书版
  rationale: 保留具体的书写载体意象，并以“书版”表明这是可供阅读的版片，避免泛化成“书”或抽象的“记录”。
- source_word: አንብብ
  choice: 读
  rationale: 对应直接的命令式；上下文没有充分依据限定为“朗读”。
- source_word: ዘጽሑፍ ዲቤሆሙ
  choice: 上面所写的
  rationale: 自然承接复数的“书版”，准确表达写在其上的内容。
- source_word: እእምር
  choice: 明白
  rationale: 在先看、再读的语境中，表示理解所读内容，而不只是获知事实。
- source_word: ኵሎ አሐደ አሐደ
  choice: 逐一明白一切
  rationale: “逐一”保留重复“一个、一个”的分配性力量，“一切”则保留整体范围；中文表达自然而庄重。
theological_decisions:
- issue: 天上存有书面记录的启示文学意象
  choice: 天上的书版
  alternative: 天上的书卷；天上的记录
  rationale: 原文呈现具体、可观看并阅读的天上书写载体。保留“书版”可避免把异象意象抽象化，也不额外引入“书卷”这一不同形制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“书版”略带古典色彩，但有助于保存启示文学中具体的天上书写载体意象；句末用“逐一明白一切”重现原文的分配性强调。
