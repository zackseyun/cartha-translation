base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/003.yaml
  text: And at that time I blessed the Great Lord, the King of Glory forever, because he has made all the works of the world; and I praised the Lord for his patience, and I blessed him on account of the children of Adam.
translation:
  language: zh_hans
  text: 那时，我称颂伟大的主、永远的荣耀之王，因为他造了世上的一切工作；我因主的忍耐[a]赞美他，也就亚当的子孙[b]称颂他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忍耐”也可译作“宽容”或“恒久忍受”；原词可指在承受中保持克制，并非只是被动等待。
    reason: lexical_alternative
  - marker: b
    text: “亚当的子孙”是原文对人类的具体称呼，保留了人与亚当的关联。“就”不限定原文介词的关系；也可理解为“关于”“因着”或“为着”亚当的子孙。
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: እምሶቤሃ
  choice: 那时
  rationale: 简明保留叙事中的时间衔接，也符合异象叙事的庄重语体。
- source_word: ባረክዎ
  choice: 我称颂
  rationale: “称颂”既保留向上帝祝颂的含义，又比现代汉语中容易误解为赐福的“祝福”自然准确。
- source_word: እግዚአ ዐቢይ
  choice: 伟大的主
  rationale: 按称号直译，不将“伟大”解释性强化为“大能”。
- source_word: ንጉሠ ስብሐት ለዓለም
  choice: 永远的荣耀之王
  rationale: 保留“荣耀之王”的结构和永久性的修饰；不改写成较具解释性的统治表述。
- source_word: በከመ ገብረ ኵሎ ግብረ ዓለም
  choice: 因为他造了世上的一切工作
  rationale: 保留原文“造”与“工作”的表达，不把它概括成“万物”或扩展为“宇宙”。
- source_word: ሰባሕኩ
  choice: 我赞美
  rationale: 与前后译作“称颂”的祝颂动词有所区别，反映原文使用了不同词语。
- source_word: ትዕግሥቱ
  choice: 他的忍耐
  rationale: “忍耐”是现代汉语中自然且宽广的对应词；脚注提示其中也可含克制、宽容忍受之意。
- source_word: ዲበ ውሉደ አዳም
  choice: 因亚当的子孙
  rationale: 保留亚当谱系的具体说法；介词译为“因”以形成自然汉语，同时用脚注承认原文关系词的弹性。
theological_decisions:
- issue: ውሉደ አዳም 的人类学表达
  choice: 亚当的子孙
  alternative: 人类；世人；亚当的儿女
  rationale: 保留原文与亚当相连的血统和人类整体意涵，同时避免把它缩减为仅指男性。
- issue: 称颂上帝与亚当子孙之间的关系
  choice: 因亚当的子孙称颂他
  alternative: 论到亚当的子孙称颂他；为亚当的子孙称颂他
  rationale: 原介词可表达“在……之上、关于、由于”等关系；正文采用较顺畅但不过度扩展的“因”，脚注保留其他可能，避免断定究竟是缘由、主题还是受益关系。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“称颂”用于向上帝发出的祝颂，“赞美”则保留另一原文动词的区别。整体尽量维持原句的赞颂节奏，并用脚注保存“忍耐”和介词关系的语义余地。
