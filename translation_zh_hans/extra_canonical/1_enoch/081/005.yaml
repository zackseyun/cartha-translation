base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/005.yaml
  text: And those seven holy ones brought me near and set me on the earth before the door of my house[a], and they said to me, “Make everything known to Methuselah your son, and show all your children that no flesh is righteous before the Lord[b], for he is the one who created them.”
translation:
  language: zh_hans
  text: 那七位圣洁者把我带近，安置在地上、在我家的门前[a]。他们对我说：“你要把这一切告诉你的儿子玛土撒拉，也要向你所有的儿女说明：凡有血肉的，在主面前没有一个是义的[b]，因为正是他创造了他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在我家的入口前”。原词既可指门，也可指入口处。
    reason: lexical_alternative
  - marker: b
    text: “凡有血肉的”保留原文具体的“血肉”说法，泛指有血肉的受造者，或处于肉身状态的人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅረቡኒ
  choice: 把我带到近处
  rationale: 保留使人接近、来到近处的方向意味，同时不擅自补出接近的对象。
- source_word: ፯ ቅዱሳን
  choice: 七位圣洁者
  rationale: 指启示文学语境中的天上圣洁存在；避免“圣徒”可能带来的后世教会称谓色彩。
- source_word: አንበሩኒ
  choice: 将我安置
  rationale: 原词可指使人坐下或把人安放在某处；“安置”适合从天上被带回地上的场景，又不把姿势说得过死。
- source_word: በቅድመ ኆኅተ ቤትየ
  choice: 在我家门前
  rationale: 直接保留空间关系和“门”的具体意象；入口区域这一可能含义在脚注说明。
- source_word: አይድዕ ኵሎ
  choice: 把这一切告诉
  rationale: 以自然现代汉语表达使人知道全部内容的使动命令语气。
- source_word: አርኢ ለኵሎሙ ውሉድከ
  choice: 指示你所有的儿女
  rationale: 保留“使看见、指明”的意味；“儿女”涵盖后代，不把范围限于男性。
- source_word: ከመ ኢ ይጸድቅ ኵሉ ዘሥጋ
  choice: 凡属血肉的，在主面前都不是义的
  rationale: 以全称否定表达原文，保留“血肉”这一具体的圣经—启示文学用语，并避免改写成后期系统神学术语。
- source_word: በቅድመ እግዚአ
  choice: 在主面前
  rationale: 准确而自然地表达处于主的临在和审视之下。
- source_word: እስመ ውእቱ ፈጠሮሙ
  choice: 因为正是他创造了他们
  rationale: “正是他”保留独立代词所带的强调。
theological_decisions:
- issue: “血肉”与“为义”的宣告范围
  choice: 保留为关于一切属血肉者在主面前都不是义的普遍陈述
  alternative: 将其限定为礼仪不洁、必死性，或采用后期保罗式“称义”术语解释
  rationale: 原文直接陈述一切血肉在主面前不为义，并以创造者与受造者的关系作为理由；译文保留这种张力，不把它归入后来的特定教义框架。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣洁者”“血肉”“在主面前”等表达保留启示文学色彩；句法适度现代化，但不消除原文的神学张力与指代强调。
