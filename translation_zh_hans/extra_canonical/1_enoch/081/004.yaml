base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/004.yaml
  text: 'And from it And from it I said: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.'
translation:
  language: zh_hans
  text: 于是我说：“那死时正直良善的人有福了！没有任何记载不义的书卷写在他身上，也找不到审判之日。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头也可较直译为“我由此说”或“我从那里说”。“写在他身上”对应原文的“写在他之上”；末句较直译为“也找不到审判之日”。原文没有明说这是否指完全不受审判，或是不遭定罪性的审判。
    reason: 说明开头连接语、“写在其上”的记录意象，以及末句简略措辞所保留的解释空间。
lexical_decisions:
- source_word: ብፁዕ (bəṣuʿ)
  choice: 有福了
  rationale: 表达受福、蒙福的宣告，符合现代汉语宗教文学的庄重语体，也不把它弱化为一般的“快乐”。
- source_word: ዘይመውት፡ ጻድቅ፡ ወኄር (za-yəmawwət ṣādiq wa-ḫēr)
  choice: 在正直和良善中死去的人
  rationale: 原文可理解为此人死时是正直而良善的；用“在……中死去”保留其状态性，避免改写成仅描述一生或死亡方式。
- source_word: መጽሐፈ፡ ዐመፃ (maṣḥafa ʿamaṣā)
  choice: 记载不义的册卷
  rationale: መጽሐፍ 指书、册卷或记录，ዐመፃ 指不义、悖逆或恶行；结合天上记录的语境译作“记载不义的册卷”，既自然又不过度具体化。
- source_word: ኢተጽሕፈ፡ ዲቤሁ (ʾi-tatsəḥfa dibēhu)
  choice: 没有……写在他名下
  rationale: 字面意象是“没有写在他之上/关于他”；汉语“写在他名下”自然表达归于此人的记录，同时保留账册式意象。
- source_word: ዕለተ፡ ኵነኔ (ʿəlata kwənanē)
  choice: 审判他的日子
  rationale: 词组本义为“审判之日”；加上语境中所指的人作宾语，使汉语通顺，但不说明审判的具体性质或终局。
theological_decisions:
- issue: “没有审判之日”是否意味着义人完全不受任何普遍审判
  choice: 也不会有审判他的日子
  alternative: 也找不到审判之日
  rationale: 原句断言对这人找不到审判之日，但没有系统说明普遍审判与定罪性审判的关系。译文保持针对个人的表述，不替文本建立教义体系。
- issue: “册卷”记载的是人的不义，还是册卷本身属于不义
  choice: 记载不义的册卷
  alternative: 不义的册卷
  rationale: 属格结构本身简短；结合本节关于个人记录和审判的语境，理解为记录不义较自然，同时保留“册卷”的司法意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“有福了”“册卷”“审判之日”等启示文学意象；忽略英文咨询文本中明显的机械重复，主要依据所给吉兹语文本翻译。
