  text: For one year we will leave you with your son[a], until a further command[b], so that...
translation:
  language: zh_hans
  text: 我们要让你和你儿子同住一年[a]，直到另有命令，好让……[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是第一人称复数“我们要让你留下”，不是“我要让你留下”；这里译作“让你和你儿子同住”，表达暂时留在儿子身边的意思。
    reason: source_grammar
  - marker: b
    text: 现存引文止于表示目的或结果的连词“好让／使得”，句子并未完结，因此用省略号保留原文的残缺状态。
    reason: textual_difficulty
lexical_decisions:
- source_word: ዓመተ፡ አሐደ፡
  choice: 一年
  rationale: 这是直接的时间表达；在汉语中置于“同住”之后自然清楚。
- source_word: ነኅድገከ፡
  choice: 我们要让你……同住
  rationale: 该动词为第一人称复数未完成式，应保留复数主语“我们”；在此语境中表示让以诺暂时留下，而非遗弃。
- source_word: በኀበ፡ ወልድከ፡
  choice: 和你儿子同住
  rationale: 介词短语表达临近或相伴；结合“让你留下”的语义，译为“和你儿子同住”比生硬的“在你儿子那里”更自然，且不添加受照管之意。
- source_word: እስከ፡ ካዕበ፡ ትእዛዝ፡
  choice: 直到另有命令
  rationale: ካዕበ含再次、进一步之意；“另有命令”自然表达等候下一道权威指令，不虚构“来到”等原文未见的谓语。
- source_word: ከመ፡
  choice: 好让……
  rationale: ከመ是引出目的或结果从句的连词；现存引文在此截断，因此以省略号保留未完成句法，不补造后文。
theological_decisions:
- issue: 命令的权威性质
  choice: 命令
  alternative: 吩咐；指示
  rationale: “命令”保留启示性场景中指令的权威力度，同时不越过文本去指明发令者。
- issue: 复数说话者
  choice: 我们
  alternative: 我
  rationale: 动词形态是第一人称复数；保留“我们”既忠于语法，也不在本节内擅自明确这些说话者的身份。
- issue: 残缺目的从句
  choice: 好让……
  alternative: 使得……
  rationale: 保留ከመ引出的目的或结果关系及文本的中断状态，避免用神学推断补足缺失内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同住”自然呈现留在儿子身边的含义；“另有命令”保持权威语气。“好让……”刻意保留底本在ከመ处中断的句法，不依英语旧译补出谓语。
