base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/002.yaml
  text: And there I saw the hidden chambers of the thunder[a], and how, when it crashes in the height of heaven, its sound is heard; and he showed me the dwellings of the dry land, and the sound of the thunder, whether for peace and blessing or for a curse[c][b], according to the word of the Lord of Spirits.
translation:
  language: zh_hans
  text: 我在那里看见了雷霆的隐秘库室；雷霆在天之高处轰鸣时，它的声音就被听见。他又指给我看旱地上的居所[a]，以及雷霆的声音[b]；这声音或是为着平安与祝福，或是为着咒诅，都是照着万灵之主的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旱地上的居所”原文在文本和词义上都较难确定；也可理解为“大地上有人居住的地方”。
    reason: lexical_alternative
  - marker: b
    text: 有一见证在这里的括号内重复了“以及雷霆的声音”；这句话可能属于原文，也可能是抄写时增添的重复。译文将其保留。
    reason: textual_variant
lexical_decisions:
- source_word: ኅቡኣተ
  choice: 隐秘的库房
  rationale: 该复数形式可指隐藏之物或隐藏之处；在雷霆被贮藏于隐秘所在的启示文学图景中，以具有处所和储藏意味的“隐秘的库房”表达，比抽象的“奥秘”更贴切。
- source_word: ነጐድጓድ
  choice: 雷霆
  rationale: 原词通常指雷声或雷霆；本节着重其声音及其作用，“雷霆”既保留庄严力度，也能自然充当轰鸣的主体。
- source_word: ይደቅቅ
  choice: 轰鸣
  rationale: 该动词有击打、压碎、破裂之意；用于雷霆时，“轰鸣”自然传达强烈的听觉冲击，而不把它弱化为一般的“发声”。
- source_word: መልዕልተ ሰማይ
  choice: 天之高处
  rationale: 这是表达“天的高处”的结构；译文保留其垂直宇宙图景，不添加原文没有明确表达的来源介词“从”。
- source_word: ተመመንደርት የብስ
  choice: 旱地上的居所
  rationale: 此短语在词义和文本上均较困难，似指与旱地或陆地相关的居住处；此译法保留具体意象，并以脚注说明也可能泛指大地上有人居住之处。
- source_word: አስተአርአየኒ
  choice: 他又指给我看
  rationale: 使役动词直接表示“他使我看见／指给我看”；保留有位格的引导者，同时不擅自确定其身份。
- source_word: ለሰላም ወለበረከት
  choice: 带来平安与祝福
  rationale: 介词短语可表达目的或结果；“带来”使现代汉语自然，同时保留雷霆与平安、祝福之间关系的开放性。
- source_word: ለረገም
  choice: 带来咒诅
  rationale: 原词指咒诅；与前面的平安和祝福构成司法性、结果性的对照。
- source_word: በቃለ እግዚአ መናፍስት
  choice: 照着万灵之主的话
  rationale: 介词结构可表示依照或凭借；“照着……的话”保留神圣言语既是命令又是准则的含义。“万灵之主”作为《以诺一书》的固定称号，简洁而庄重。
theological_decisions:
- issue: 雷霆带来福祉或刑罚的功能
  choice: 译作雷霆的声音或带来平安与祝福，或带来咒诅，且这一切受万灵之主的话支配。
  alternative: 雷声只是宣告不同结果，或不同雷声分别预示平安、祝福与咒诅。
  rationale: 原句把雷霆的声音、平安与祝福、咒诅以及主的话并列关联，但没有明确界定其关系究竟是造成、宣告还是预示；译文用“带来”表达结果关联，同时以“或”保留其宇宙性与审判性的张力。
- issue: እግዚአ መናፍስት 的称号
  choice: 万灵之主
  alternative: 诸灵之主
  rationale: 两者都可表达“众灵的主”；“万灵之主”在现代汉语中更凝练、庄严，并适合作为全书一致使用的固定称号，不限定这些“灵”的具体类别。
- issue: 指示异象者的身份
  choice: 保留“他”，不说明是谁。
  alternative: 改作被动句“我又蒙指示”。
  rationale: 原文动词包含阳性单数施事者，但本节没有明确其身份；译文保留语法信息而不作神学推断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“雷霆”“天之高处”“万灵之主”维持启示文学的宏阔语域；避免文言化过重。“隐秘的库房”保留宇宙库藏意象；破折号帮助普通读者辨明雷霆声音与平安、祝福、咒诅之间的并列关系。所有脚注标记均已在正文中出现。
