base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/003.yaml
  text: And after this all the hidden things of the lights and of the lightnings were shown to me[c][b][a]; they flash for blessing and for abundance.
translation:
  language: zh_hans
  text: 此后，光和闪电的一切隐秘之事[a][b]都向我显明了；它们为带来福分和丰足而闪耀[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐秘之事”也可译作“秘密”或“奥秘”；原文直译是“它们一切隐藏的事”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“光”在异象语境中可能特指天上的发光体。
    reason: cultural_note
  - marker: c
    text: “它们”所指未完全明确，最可能承接“光和闪电”；也有人可能理解为前述隐秘现象。“为带来”表达原文介词所含的目的意味。
    reason: ambiguity_note
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: 此后
  rationale: 作为异象叙事中的时间衔接语，简洁自然地保留事件的先后次序。
- source_word: ትርእየ ሊተ（据语法应理解为 ተርእየ ሊተ）
  choice: 都显给我看了
  rationale: 按被动或反身形态理解为“向我显现／被显给我看”，而非第二人称“你要指给我看”；这里采用自然的现代汉语被动含义表达。
- source_word: ኵሉ ኅቡኣቲሆሙ
  choice: 一切隐秘之事
  rationale: 保留“隐藏之物／隐秘之事”的宽泛含义，不直接将其术语化为“奥秘”；所属代词与后面的“光和闪电”构成前指关系。
- source_word: ለብርሃናት
  choice: 光
  rationale: 原词直义为“光”，在宇宙异象语境中也可能指天上的发光体；正文保留较宽的表达，并以脚注说明。
- source_word: ወለመባርቅት
  choice: 和闪电
  rationale: 保留复数所表达的闪电现象；汉语通常不以形态标示“闪电”的复数。
- source_word: ወለበረከት
  choice: 为带来福分
  rationale: 介词在此更适合表达目的，即闪耀是为了赐下或带来福分，而非把“福分”列为另一类隐秘之事。
- source_word: ወለጽጋብ
  choice: 和丰足
  rationale: 与“福分”平行，表达闪耀所带来的丰盛、充足，避免“繁荣”可能带入的现代经济含义。
- source_word: ይበርቁ
  choice: 它们……闪耀
  rationale: 该动词具有发光、闪现之义；“闪耀”兼顾光与闪电的意象，并以“它们”保留复数主语所指的开放性。
theological_decisions:
- issue: “隐秘之事”是否应译为启示文学中的专门术语“奥秘”
  choice: 隐秘之事
  alternative: 奥秘／秘密
  rationale: 吉兹语直接表达的是被隐藏之物；正文保留较宽泛的意义，不预先断定这是一个技术性的启示文学范畴。
- issue: “福分”和“丰足”与句中动词的关系
  choice: 理解为闪耀的目的或结果趋向：“为带来福分和丰足”
  alternative: 理解为与“光、闪电”并列的所属成分：“福分和丰足的隐秘之事”
  rationale: 介词结构与“闪耀”结合、且与上下文的宇宙现象用语相称；但不把福分与丰足解释为任何特定教义机制。
- issue: “它们”的具体所指
  choice: 保留代词，不明确限定
  alternative: 明确译作“光和闪电”或“这些隐秘之事”
  rationale: 源文复数动词的主语可由语境联系到光和闪电，但句法邻近也留下张力；中文代词可保留这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“显给我看”保留异象被揭示的被动意味；“光”不擅自收窄为“星辰”，“它们”则保留原句主语指向上的含混。
