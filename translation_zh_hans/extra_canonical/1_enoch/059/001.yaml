base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/001.yaml
  text: In those days my eyes saw the secrets of the lightnings and the lights[a], and their courses, and they flash forth for blessing and for curse[d][c][b], as the Lord of Spirits has willed.
translation:
  language: zh_hans
  text: 那些日子，我亲眼看见闪电和众光的奥秘[a]，以及它们的运行[b]；它们按万灵之主的旨意，为施福和降祸而闪耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奥秘”也可译作“隐藏之事”。吉兹语本身并不明确表示“隐秘库房”。
    reason: lexical_alternative
  - marker: b
    text: “运行”所据的是本题提供的转写文本。审校资料指出，查尔斯和迪尔曼的印本在此可能实为 ወኵነኔሆሙ，意为“它们的审判”；若采此读法，本句可译作“以及它们的审判”。
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: 那些日子
  rationale: 保留以诺传统中反复出现的末世异象时间套语，语体庄重而自然。
- source_word: ርእያ አዕይንትየ
  choice: 我亲眼看见
  rationale: 原文明确提到“我的眼睛”；汉语用“亲眼看见”既保留感官强调，也避免生硬直译。
- source_word: ኅቡኣተ
  choice: 奥秘
  rationale: 该词本义为秘密、隐藏之事；此处指有关宇宙现象的隐秘知识，不译作原文未明确表达的“库房”。
- source_word: መባርቅት
  choice: 闪电
  rationale: 直接表达气象或宇宙性的闪电现象；现代汉语中无需用形态复数。
- source_word: ብርሃናት
  choice: 众光
  rationale: 保留广义发光天象，不擅自限定为星辰；“众”传达原文复数。
- source_word: አክኒሆሙ
  choice: 它们的运行
  rationale: 按所提供转写本保留其受规管的行程或运行这一语义，同时以脚注说明印本异文／OCR问题可能支持“审判”。
- source_word: ወይበርቁ
  choice: 它们……闪耀
  rationale: 兼顾闪电发出的闪光与其他众光的照耀，避免只适用于单一现象的过窄措辞。
- source_word: ለበረከት ወለመረገም
  choice: 或施福，或降祸
  rationale: 自然表达这些天象产生祝福与咒诅两种相反作用，并保留审判张力。
- source_word: በከመ ፈቀደ
  choice: 按……的旨意
  rationale: 表达其活动符合神圣意志，不把经文弱化为纯自然过程。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 作为固定神圣称号处理；“万灵之主”庄重、简洁，并在汉语中具有称号感。
theological_decisions:
- issue: 天象是中性的自然现象，还是受神旨意治理、带来福祸的媒介
  choice: 译为它们按万灵之主的旨意“或施福，或降祸”
  alternative: 可将福与祸仅理解为这些现象带来的结果，而不强调其执行神圣旨意
  rationale: 原文将闪耀、福祸和万灵之主的意愿直接相连；译文保留神圣治理与审判含义，但不进一步说明其机制。
- issue: 争议词应理解为“运行”还是“审判”
  choice: 正文依所给原文转写译作“运行”
  alternative: 若据审校所指出的印本文字 ወኵነኔሆሙ，则应译作“它们的审判”
  rationale: 用户提供的原文证据与后续校勘意见冲突；正文不无声改写所给底本，脚注明确保留关键文本异读及其神学影响。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我亲眼看见”保存异象叙述的现场感；“众光”不把广义发光天象窄化为星辰。正文中的脚注标记[a]、[b]与脚注逐一对应。
