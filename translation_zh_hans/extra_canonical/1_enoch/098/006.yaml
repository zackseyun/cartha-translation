base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/006.yaml
  text: I have sworn to you[a], sinners, by the Great Holy One, that all your evil deeds are revealed in the heavens[b], and none of your deeds of violence are covered or hidden.
translation:
  language: zh_hans
  text: 我凭那位伟大的圣者向你们这些罪人起誓：你们一切邪恶的行为都显露在诸天之中；你们的强暴行为，没有一件被遮盖或隐藏。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐልኩ
  choice: 我……起誓
  rationale: 该第一人称完成式来自动词“起誓”，在警告语境中具有庄严、郑重的效力；汉语以“我……起誓”自然表达。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 这是审判言辞中对作恶者的常用称谓，“罪人”直接、清楚，也符合庄重语体。
- source_word: በቅዱስ ዐቢይ
  choice: 凭那位伟大的圣者
  rationale: 介词引出起誓所凭的对象；保留“伟大”与“圣者”两个要素，并用“那位”清楚表明这是对上帝的尊称，而不套用后期固定教义术语。
- source_word: ኵሉ ግብርክሙ እኩይ
  choice: 你们一切邪恶的行为
  rationale: ግብር指行为、作为，እኩይ说明其道德上的邪恶；此译具体且符合现代汉语。
- source_word: ክሡት ውእቱ በሰማያት
  choice: 都显露在诸天之中
  rationale: 谓语表达敞开、显明之意；“诸天”保留原文复数及启示文学的宇宙图景。
- source_word: ግብረ ግፍዕ
  choice: 强暴的行为
  rationale: ግፍዕ可指强暴、压迫或不义；“强暴的行为”保留其具体的社会性恶行和谴责力度。
- source_word: ወአልብክሙ ክዱነ ወእኁቡአ
  choice: 没有一件能被遮盖或隐藏
  rationale: ወአልብክሙ是否定存在表达，后面两个词分别表达被覆盖、被藏匿；译文准确保留“无一例外”的否定，并与前句“显露”形成对照。
theological_decisions:
- issue: 起誓公式及神圣称号
  choice: 凭那位伟大的圣者
  alternative: 凭伟大而圣洁的那一位
  rationale: 原文将“伟大”与“圣”构成庄严称号。采用“伟大的圣者”保留其称号性质，但不把它系统化为后世的固定神学用语。
- issue: 天上的显露与恶行不可隐藏
  choice: 邪恶行为显露在诸天之中，强暴行为没有一件能被遮盖或隐藏
  alternative: 把末句理解为恶行在天上被写下并记录
  rationale: 原文中的否定存在式及“遮盖／隐藏”支持不可隐匿的读法。这样也保留了前后关于“显露”与“遮藏”的修辞对照，不引入原文并未明确表达的天上簿册意象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话；以分号呈现两个彼此呼应的判断。“诸天”保留原文复数和启示文学色彩，“强暴”则保留审判言辞的力度。
