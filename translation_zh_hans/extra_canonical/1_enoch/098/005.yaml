base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/005.yaml
  text: And barrenness was not given to a woman[a]; rather[c][b], because of the work of her hands she dies childless.
translation:
  language: zh_hans
  text: 妇人所得的并非不育[a]；相反[c]，她因自己双手所做的事[b]而无儿女地死去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不育并没有给妇人。”原文把“不育”与后面实际临到的死亡相对照。
    reason: lexical_alternative
  - marker: b
    text: “自己双手所做的事”是指她所做的行为。
    reason: cultural_note
  - marker: c
    text: 本句也可断作：“不育并没有给妇人；相反，她因自己双手所做的事而死。”
    reason: previous_rendering
lexical_decisions:
- source_word: ምክነት
  choice: 不能生育
  rationale: 该名词指不育或无子女；“不能生育”在现代汉语中自然，并保留具体的生育含义。
- source_word: ለብእሲት
  choice: 给妇人
  rationale: 介词结构表示给予或分派的对象；原文没有明确的定指标记，故用泛指的“妇人”，不限定为某一特定女子。
- source_word: ኢተውህበት
  choice: 并不是命定给她的
  rationale: 原词是“给予”的被动式。“给她”保留基本意象；“命定”在中文中补足此处分派命运的语感，但脚注保留直译可能。
- source_word: አላ
  choice: 相反
  rationale: 表达强烈转折，将不能生育与因行为而无子女地死去相对照。
- source_word: በእንተ
  choice: 因
  rationale: 明确表达原因，简洁符合现代汉语。
- source_word: ግብረ እዴሃ
  choice: 自己双手所做的事
  rationale: 既保留“双手”的具体意象，也让现代读者清楚这是指她的行为。
- source_word: ትመውት
  choice: 死时
  rationale: 原文未完成式在格言性语境中可表达一般结果；结合句末“没有儿女”，译作“死时”能自然表达她最终无子而死，同时不强行限定为单纯将来时。
- source_word: ዘእንበለ ውሉድ
  choice: 没有儿女
  rationale: 直指“没有孩子/后代”；置于“死时”之后，是自然、庄重的现代汉语表达。
theological_decisions:
- issue: 妇人所受审判的性质
  choice: 经文否定不能生育是命定给妇人的，并把她最终无儿女而死与她自己的行为联系起来。
  alternative: 也可理解为：她所得的份不是不育，而是死亡；“双手所做的事”也可能特指某类恶行，而非泛指一切行为。
  rationale: 原文以否定的“未被给予”和强转折词相接，随后用原因短语说明死亡；译文保留行为、死亡和无子之间的张力，不进一步指定其行为类别，也不建立文本未明说的教义因果体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“妇人”保持经文语体但作泛指；用“死时没有儿女”避免生硬的“无子而死”，并保留格言式陈述。所有脚注标记均置于正文相关位置。
