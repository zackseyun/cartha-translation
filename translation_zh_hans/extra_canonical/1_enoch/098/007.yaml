base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/007.yaml
  text: And do not imagine in your spirit[a], and do not say in your heart[c][b], that you do not know and do not see that every sin is written in heaven every day before the Most High.
translation:
  language: zh_hans
  text: 你们不要在你们的灵里以为，也不要在心里说：你们不知道，也看不见，每一件罪都写在天上，日日都在至高者面前。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们不知道，也看不见”中的动词按原文形式为第二人称复数。这里按间接陈述译出；也可理解为“不要在心里说：‘你们不知道，也看不见……’”。
    reason: grammar_and_syntax
  - marker: b
    text: “日日都在至高者面前”也可译作“天天写在天上，呈在至高者面前”。原文可表达每日的书写，也可强调这记录日复一日存留在至高者面前。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢታምስሉ በመንፈስክሙ
  choice: 你们心里不要以为
  rationale: 原文直译近于“不要在你们的灵里设想”。现代汉语用“心里以为”自然表达内在揣想，同时避免与下句“心中说”完全重复；“你们”保留复数指向。
- source_word: ወኢትበሉ በልብክሙ
  choice: 也不要在心中说
  rationale: 保留“心”这一圣经式内在人格用语，也表达并非只指公开发言，而是内心自语。
- source_word: እስመ
  choice: 引出冒号后的话语内容
  rationale: 此处可作内容连接语，也可能带有“因为”的因果色彩。结合“不要说”及其后的第二人称动词，译作引出所说内容最顺畅，但不改写动词人称。
- source_word: ኢታእምሩ ወኢትሬእዩ
  choice: 你们不知道，也看不见
  rationale: 两个动词均按吉兹语第二人称复数处理，不改成第一人称“我们”；“看不见”保留具体的视觉措辞及其道德感知意味。
- source_word: ኵሉ ኃጢአት
  choice: 每一项罪
  rationale: 单数集合结构带逐项分配意味；“每一项罪”突出每一罪行都在记录之中。
- source_word: በሰማይ ይጸሐፍ
  choice: 写在天上
  rationale: 保留“写”的具体末世审判簿册意象，不弱化为泛泛的“神都知道”。
- source_word: ሀሎ በኵሉ ዕለት
  choice: 天天……呈在
  rationale: ሀሎ（存在、处于）与“每一天”相连，不仅可指每日书写，也可指记录日日存留；正文用“天天……呈在”兼顾持续存在的意味。
- source_word: በቅድሜሁ ለልዑል
  choice: 呈在至高者面前
  rationale: “至高者”保留神圣称号；“呈在……面前”兼顾空间临在和审判记录陈列于神前的图景。
theological_decisions:
- issue: 天上罪行记录的意象
  choice: 明确译出罪被写在天上并呈于至高者面前
  alternative: 抽象译为“至高者知道一切罪”
  rationale: 原文明确使用“写”及“在天上”的措辞，应保留其具体的启示文学记录与审判意象。
- issue: “不知道、看不见”的人称与话语层次
  choice: 保留第二人称复数，作为受责者内心所说的话
  alternative: 依语义改作第一人称引语“我们不知道，也没有看见”或译成间接陈述
  rationale: 吉兹语动词形态指向第二人称复数。虽然直接引语中的第二人称在现代汉语略显反常，却忠实保留原文的人称张力；脚注说明另一种句法理解。
- issue: “天天”修饰书写还是持续存留
  choice: 正文以“天天写在天上，呈在……”表达连续记录并存于神前
  alternative: “日复一日存留在至高者面前”
  rationale: 原文中存在动词使“每天”可能侧重记录持续呈于神前，不宜只限定为每天发生一次书写行为。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“心”“天上”“至高者”等启示文学和圣经传统用语；通过引号呈现内心言说，同时以脚注交代原文第二人称造成的句法张力。所有脚注标记均已置于正文。
