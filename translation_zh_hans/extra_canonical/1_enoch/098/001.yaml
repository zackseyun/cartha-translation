base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/001.yaml
  text: And now I swear to you[a], to the wise and to the foolish[b], that you will see much upon the earth.
translation:
  language: zh_hans
  text: 现在，我向你们——有智慧的人和愚昧的人——起誓[b]：你们将在地上看见许多事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“很多”。原词强调听众将在地上目睹之事的丰富或众多。
    reason: lexical_alternative
  - marker: b
    text: 原文此处的连接词也可理解为“因为”；正文将后句处理为起誓所断言的内容。
    reason: syntactic_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 引出新的劝诫段落；现代汉语中“现在”自然简洁，而句首承接关系可由上下文体现。
- source_word: እኔ፡ እምሕል
  choice: 我……起誓
  rationale: 保留显明的第一人称及动词“宣誓、起誓”的具体含义，体现本段庄严的誓言语气，不弱化为一般的“宣告”。
- source_word: ለክሙ፡ ለጠቢባን፡ ወለአብዳን
  choice: 向你们，就是向智慧人和愚昧人
  rationale: 把后面的两类人理解为对“你们”的同位说明，保留智慧与愚昧之间平衡而鲜明的对照。
- source_word: እስመ
  choice: 冒号所引出的誓言内容
  rationale: 该连接词通常可表达原因，但在誓言句式中也可引出所断言的内容。正文以冒号避免在“因为”和“所起誓的内容”之间作过度确定，并用脚注保留另一种句法理解。
- source_word: ብዙኅ
  choice: 许多事
  rationale: 该词表达数量或程度上的丰富；汉语“看见许多事”比“看见许多”完整自然，同时不具体限定这些事物的性质。
- source_word: ትሬእዩ
  choice: 你们将……看见
  rationale: 按警告语境表达将来意义；“将”清楚而不过分古雅。
- source_word: ዲበ፡ ምድር
  choice: 在地上
  rationale: 保留宽广的空间范围，不缩窄为某一特定地域；“在地上”是现代汉语自然表达。
theological_decisions:
- issue: “智慧人和愚昧人”所指对象的范围
  choice: 直接保留对两类听众的并列称呼
  alternative: 将其限定为以色列内部的两类人，或理解为主要针对恶人的反讽称呼
  rationale: 本节本身没有进一步限定范围。直译这组对照可保留普遍性与具体历史对象之间的张力，让后文语境自行说明。
- issue: 誓言后分句与前句的逻辑关系
  choice: 正文用冒号将其呈现为誓言所断言的内容
  alternative: 将እስመ明确译为“因为”，使后句成为起誓或发言的原因
  rationale: 原文连接词有因果色彩，但此处位于誓言公式之后，句法关系存在张力。冒号能形成通顺汉语，同时脚注保留明确的因果读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“起誓”保留原文反复出现的郑重誓言语气；“智慧人和愚昧人”形成整齐的智慧传统式对照。正文不采用文言色彩较重的“于地上”“愚顽者”等表达。
