base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/008.yaml
  text: From now on[b][a], know that all your violence that you commit is being written down every day until the day of your judgment.
translation:
  language: zh_hans
  text: 从今以后，你们要知道：你们所行的一切暴行[a]，天天都被记录下来[b]，直到审判你们的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“压迫恶行”；原词可指带有暴力和不公性质的压迫，并不限于身体暴力。
    reason: lexical_alternative
  - marker: b
    text: 这里的措辞使人想到末世文学中的主题：人的行为被记录下来，为审判之日作准备。
    reason: cross_reference
lexical_decisions:
- source_word: እምይእዜ
  choice: 从今以后
  rationale: 保留向未来延伸的时间标记，并以自然、庄重的现代汉语表达警告的紧迫性。
- source_word: ታእምሩ
  choice: 你们要知道
  rationale: 按复数命令语气处理，保留直接告诫的力度。
- source_word: ግፍዕክሙ
  choice: 你们……的一切暴行
  rationale: 该词指暴力、不公与压迫性的恶行；“暴行”保留其严重性，又不局限于单纯的身体暴力。
- source_word: ዘትገፍዑ
  choice: 所行的
  rationale: 关系动词与前面的名词同根；汉语用“所行的”自然承接，避免生硬重复，同时仍指实施暴行或压迫。
- source_word: ይጸሐፍ
  choice: 都被记录下来
  rationale: 保留被动及持续记载的意味，也呈现末世文学中行为被载入记录的图景。
- source_word: በኵሉ ዕለት
  choice: 天天
  rationale: 简洁自然地表达“每一天、日复一日”的持续性。
- source_word: እስከ ዕለተ ኵነኔክሙ
  choice: 直到审判你们的日子
  rationale: 保留“审判之日”的含义，同时让“你们”作为受审对象清楚可见；不预先把审判解释为定罪。
theological_decisions:
- issue: 行为被记录与末日审判
  choice: 正文保留暴行持续被记录，直至受审之日的末世性图景。
  alternative: 可理解为仅仅比喻恶行不会被遗忘，或指人间的法律记录。
  rationale: 被动式“被记录下来”与“审判你们的日子”相连，符合末世文学中为最终审判保存行为记录的意象；正文不额外明说记录者或记录所在，以免超出原文。
- issue: 审判是否预设定罪
  choice: 译作“审判你们的日子”。
  alternative: 译作“你们被定罪的日子”。
  rationale: 原词可以处在审判、判决或定罪的语义范围内；此处采用较宽的“审判”，保存结果尚未在措辞中被完全明说的张力。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“从今以后……你们要知道”保留警告语气；“天天都被记录下来”呈现持续性。脚注标记按内容就近放置，先出现[b]再出现[a]，与所注释的短语对应。
