base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/003.yaml
  text: Therefore they have no instruction or wisdom[a]; and because of this they will perish together with their possessions, and with all their glory and their honor. And in shame, and in slaughter, and in great destitution[c][b], their spirits will be cast into the furnace of fire.
translation:
  language: zh_hans
  text: 因此，他们没有教诲，也没有智慧[a]；正因如此，他们必与自己的财物一同灭亡，也与他们一切的荣耀和尊荣一同灭亡。他们的灵必在羞辱、杀戮和极大的困苦中[b]被投入火炉之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教诲”也可译作“教导”或“训诲”。“教诲”和“智慧”很可能合起来表示智慧传统中的一个整体观念，不一定是两个截然分开的项目。
    reason: lexical_alternative
  - marker: b
    text: 译作“极大的困苦”的原文含义较难确定，也可理解为“极度贫乏”“极大的悲惨”或“极大的患难”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ትምህርት
  choice: 教诲
  rationale: 指人所领受的教导或训诲；“教诲”既符合智慧传统的语境，也不使人联想到学校教育。
- source_word: ጥበብ
  choice: 智慧
  rationale: 此处是道德与实践层面的智慧，而非技术性的才干。
- source_word: ይትሐጐሉ
  choice: 必……灭亡
  rationale: 保留未来审判的语气，同时不把灭亡的具体方式解释得过窄。
- source_word: ኅቡረ ምስለ
  choice: 与……一同
  rationale: 突出他们与财物共同遭遇败亡的命运。
- source_word: ንዋያቲሆሙ
  choice: 自己的财物
  rationale: 泛指其物质所有，较“财富”更不局限于金钱。
- source_word: ስብሐቶሙ
  choice: 他们一切的荣耀
  rationale: 保留庄重语域，也显出世俗显赫在审判中归于消逝的反讽。
- source_word: ክብሮሙ
  choice: 尊荣
  rationale: 与“荣耀”相区别，侧重社会身份、声望和受人尊重的地位。
- source_word: በጽእለት
  choice: 在羞辱……中
  rationale: 表达审判伴随的公开蒙羞状态。
- source_word: በቅትል
  choice: 在……杀戮……中
  rationale: 保留原文连续堆叠审判名词的强烈效果，不额外指定施行者。
- source_word: በንዴት ዐቢይ
  choice: 在……极大的困苦中
  rationale: 原词组含义不易确定；“困苦”可涵盖贫乏、悲惨和患难，避免武断限定为纯物质贫困。
- source_word: ትትወደይ መንፈሶሙ
  choice: 他们的灵必……被投入
  rationale: 保留原文以“他们的灵”为明确受事者及被强行交付审判的意象。
- source_word: እቶነ እሳት
  choice: 火炉
  rationale: 自然简洁地再现由火限定的炉窑意象；不借用后期固定神学措辞。
theological_decisions:
- issue: 末句究竟表示灭绝，还是死后受到惩罚性的处置
  choice: 他们的灵必被投入火炉
  alternative: 他们自己必在火中被毁灭
  rationale: 原文明确以“他们的灵”为宾语，因此保留末世审判及死后处置的意象，但不进一步界定该刑罚的持续时间或最终性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文从现今“没有教诲和智慧”到将来“必灭亡”的因果与时态差别，并保留“荣耀／尊荣”的并列及末句连续列举审判处境的修辞。
