base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/004.yaml
  text: 'I swear to you[a], sinners: as a mountain has not become a servant, and a hill does not become a maidservant of a woman, so sin was not sent upon the earth; rather, men created it from themselves[c][b], and those who do it will come under a great curse.'
translation:
  language: zh_hans
  text: 我向你们这些罪人起誓：[a]山不会成为奴仆，丘陵也不会成为妇人的婢女；同样，罪也不是被差到地上来的，而是人自己造出来的。[b]犯罪的人必受大咒诅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里关于山和丘陵的比喻，吉兹语原文较难确定。大意似乎是：正如山或丘陵不会沦为奴仆或婢女，罪也不是强加给受造界的事物。
    reason: textual_variant
  - marker: b
    text: “人自己”译自吉兹语的反身表达，意思是人出于自身或自行造出罪，并非字面所说“从自己的头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐልኩ
  choice: 我……起誓
  rationale: 保留动词郑重起誓、断言的语气，同时符合现代汉语表达。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 保留本段祸哉宣告中道德与审判层面的称谓。
- source_word: ደብር
  choice: 山
  rationale: 直接保留具体的地貌意象。
- source_word: ገብረ
  choice: 成为奴仆
  rationale: 此处文本困难；采用表示受奴役身份的较强措辞，不弱化为一般性的服侍。
- source_word: ወእማገር፡ ለብእሲት
  choice: 丘陵也不会成为妇人的婢女
  rationale: 依平行结构呈现阴性奴役意象；“婢女”自然、庄重，也保留其社会身份含义。
- source_word: ኃጢአትኒ፡ ኢተፈነወት፡ ዲበ፡ ምድር
  choice: 罪也不是被差到地上来的
  rationale: 保留被动式“被差来”，凸显罪并非作为外来力量被派到世上，同时不进一步推演教义。
- source_word: አላ፡ ሰብእ፡ እምርእሶሙ፡ ፈጠርዋ
  choice: 而是人自己造出来的
  rationale: እምርእሶሙ 是反身习语，宜译为“自己／从自身”，不按字面误译为“从自己的头脑”；“人”在此作泛指。
- source_word: ለመርገም፡ ዐቢይ፡ ይከውኑ
  choice: 必遭受极重的咒诅
  rationale: 以自然汉语表达落在作恶者身上的重大咒诅与审判。
theological_decisions:
- issue: 本节所述罪的来源
  choice: 罪不是被差到地上，而是人自己造出来的
  alternative: 将本句较弱地理解为仅否认罪是受造界的天然组成部分
  rationale: 原文以“不是被差来”与“人自己造出”形成鲜明对照，强调人的能动责任；译文保留这一张力，但不扩展为完整的罪恶起源论。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“奴仆／婢女”保留原文强烈的受奴役意象；“被差到地上”保留启示文学语域及原文被动结构。主文中的[a]、[b]均与脚注对应。
