base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/002.yaml
  text: For you men love adornment on yourselves more than women[a], and companionship more than a virgin; in kingship and in greatness and in authority and in silver and gold and purple[d][c][b], and in splendor and in food they will be poured out like water.
translation:
  language: zh_hans
  text: 因为你们男人比女人更爱装扮自己，穿彩衣比少女更甚；在王权、尊贵、权势、金银、紫色衣料、华美和饮食上，这一切都必像水一样倾泻而去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 末句也可理解为：人把这些奢华之物像水一样挥霍；或这些荣华本身将如水流逝。
    reason: alternative_reading
lexical_decisions:
- source_word: ሥነ፡ ትወድዩ፡ ላዕሌክሙ
  choice: 爱把自己装饰得华美
  rationale: 按修订所指出的词义和句法，将ሥነ理解为美饰、装饰，将ትወድዩ理解为“你们爱”，并保留ላዕሌክሙ“在自己身上”的反身含义。
- source_word: አንትሙ፡ ዕደው
  choice: 你们这些男人
  rationale: 将ዕደው识别为“男人”，与前面的第二人称复数代词合译，避免误作“行为”。
- source_word: ፈድፋደ፡ እምአንስት
  choice: 比女人更
  rationale: 将ፈድፋደ እም-按比较结构处理为“胜过、比……更”，而非“来自……的过度”。
- source_word: ኅብረ፡ ፈድፋደ፡ እምድንግል
  choice: 爱结伴胜过少女
  rationale: 将ኅብረ按“相伴、结伴”处理，并延续比较结构；原文关系和具体所指并不完全明朗，故用脚注保留另一词义可能。
- source_word: በመንንግሥት፡ ወበዕበይ፡ ወበሥልጣን
  choice: 在王权、尊贵、权势……上
  rationale: 保留连续介词结构及王权、显赫和统治能力的语义层次，以自然汉语列举。
- source_word: ወብሩር፡ ወወርቅ፡ ወሜላት
  choice: 金银、紫色衣料
  rationale: 金银直译；将表示紫色之物的词落实为昂贵的紫色衣料，符合古代奢华清单的文化语境。
- source_word: ወክብር
  choice: 华美
  rationale: 该词可指荣耀、尊荣或显赫；在物质奢华清单中取可见的华美、排场之义，同时不作教派化解释。
- source_word: ከመ፡ ማይ፡ ይትከዐዉ
  choice: 这一切都必如水倾泻而去
  rationale: 保留如水倾泻的被动或中动态意象；以“这一切”承接前列诸项，但不强行判定是挥霍这些财富，还是财富本身消散。
theological_decisions:
- issue: 本节主要谴责男性装饰、社交亲密，还是更广泛的奢华放纵
  choice: 译文同时保留男性在装饰与结伴方面的比较，以及王权、财富、衣饰和饮食的奢华清单。
  alternative: 可将本节集中理解为对男性过度装饰及华服的批评。
  rationale: 原文先出现与女人、少女的比较，随后扩展至权势和物质享受；不宜把责备缩减为单一的性伦理或服饰规范。
- issue: 末句所说如水倾泻的主语及寓意
  choice: 用“这一切都必如水倾泻而去”，使前述奢华之物成为概括性主语。
  alternative: 也可理解为人把财富像水一样挥霍倾倒。
  rationale: 原文意象容许“奢侈品被挥霍”和“繁华消散”两种理解，正文不将其完全定死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们这些男人”明确呼语对象；“王权、尊贵、权势”保持警告文学的列举节奏。对ኅብረ及末句的歧义以脚注呈现，不在正文中武断消解。
