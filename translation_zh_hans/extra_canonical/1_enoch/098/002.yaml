    text: 末句也可理解为：人把这些奢华之物像水一样挥霍；或这些荣华本身将如水流逝。
    reason: alternative_reading
  - marker: b
    text: “紫色衣料”指用昂贵紫色染料染成的布匹，是古代财富、地位和奢华的标志。
    reason: cultural_note
  revision_rationale: 按原文优先原则，恢复本节服饰奢华的平行比较：“装饰”相对于女人，“彩衣”相对于少女。删去将ኅብረ释为“结伴”的正文和脚注，因其在本节不如“彩衣”合乎词义、平行句法及上下文的奢华清单。末句及物质清单维持原有的审慎表达与歧义说明。
