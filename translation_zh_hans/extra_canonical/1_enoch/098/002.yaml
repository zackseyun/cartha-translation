revisions:
- from: 因为你们这些男人爱把自己装饰得比女人更华美，也爱结伴胜过少女[a]；在王权、尊贵、权势、金银、紫色衣料[b]、华美和饮食上，这一切都必如水倾泻而去[c]。
  to: 因为你们男人比女人更爱装扮自己，穿彩衣比少女更甚；在王权、尊贵、权势、金银、紫色衣料、华美和饮食上，这一切都必像水一样倾泻而去[c]。
  rationale: 按原文优先原则，恢复本节服饰奢华的平行比较：“装饰”相对于女人，“彩衣”相对于少女。删去将ኅብረ释为“结伴”的正文和脚注，因其在本节不如“彩衣”合乎词义、平行句法及上下文的奢华清单。末句及物质清单维持原有的审慎表达与歧义说明。
