base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/010.yaml
  text: And now know that you are prepared for the day of destruction[a], and do not hope that you sinners will live; rather, you will depart and die, for you do not know any ransom[d][c][b], because you have been made ready for it.
translation:
  language: zh_hans
  text: 现在你们要知道：你们已经为毁灭之日[a]预备好了。你们这些罪人，不要指望能活下去；相反，你们必离去而死，因为你们不知道有任何赎价[b]，而你们已经为那日被预备好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杀戮之日”。这里的词可指审判中的毁灭、败亡，也可能带有更强烈的“杀戮”之意。
    reason: lexical_alternative
  - marker: b
    text: “赎价”指使人获释的代价，也可泛指脱离将临审判的途径；本句的意思是，你们不知道有任何这样的脱身办法。
    reason: cultural_note
lexical_decisions:
- source_word: ወይእዜኒ አእምሩ
  choice: 现在你们要知道
  rationale: 保留时间转折和复数命令语气，以自然的现代汉语引出严肃警告。
- source_word: ድልዋን
  choice: 已经……预备好了
  rationale: 表达已经被预备、就绪的状态，同时不擅自判定这是任命还是一般意义上的准备。
- source_word: ለዕለተ ሐጕል
  choice: 为毁灭之日
  rationale: “毁灭”涵盖审判语境中的败亡与灾灭；更具体的“杀戮”保留于脚注。
- source_word: ከመ ትሕየዉ ኃጥኣን
  choice: 你们这些罪人……自己还能活下去
  rationale: ትሕየዉ是第二人称复数；“罪人”是对受话者的称呼或同位语，不应译为第三人称“罪人会活着”。
- source_word: አላ ትሐውሩ ወትመውቱ
  choice: 相反，你们必离去、死亡
  rationale: 保留原文先离去、后死亡的并列次序及庄严警告语气。
- source_word: ቤዛ
  choice: 赎价
  rationale: 保留用代价换取释放的具体隐喻，不将其解释性地改译为“救赎”或“解救”。
- source_word: ተደለውክሙ
  choice: 你们已经为那日准备好了
  rationale: 保留被动含义，并以“那日”补明承接上文的隐含对象；措辞与前面的ድልዋን略作区分。
theological_decisions:
- issue: 审判警告中“ቤዛ”的含义
  choice: 译作“赎价”
  alternative: “解救”或“救赎”
  rationale: 原文可能指使人从将临审判中获释的代价或途径。“赎价”保留法律与释放的隐喻，也不把经文提前纳入后期教义术语。
- issue: 罪人能否存活这一分句的人称
  choice: 译作“你们这些罪人……自己还能活下去”
  alternative: “罪人还能活下去”
  rationale: 动词形态是第二人称复数；这样处理忠实显示警告直接针对在场的罪人。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留启示文学审判宣告的力度；第二人称复数贯穿全句，并保留“赎价”的具体隐喻与可能张力。
