base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/009.yaml
  text: Woe to you[a], fools, for you will perish in your folly, and you oppress the wise[c][b], and good will not come upon you.
translation:
  language: zh_hans
  text: 你们这些愚昧人有祸了！你们必因自己的愚妄而灭亡；你们得罪智慧人[a]，美好的事也必临不到你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们恶待智慧人”或“你们冒犯智慧人”。原词表示向他们行恶或得罪他们，并未限定具体方式。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“好处必找不到你们”或“福祉必达不到你们”。原文所说的“美好”含义较宽。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: 你们……有祸了
  rationale: 保留先知性谴责和审判宣告的力度；现代汉语用倒装结构自然表达。
- source_word: አብዳን
  choice: 愚昧人
  rationale: 这里不是普通智力不足，而是带有道德与属灵意味的智慧文学用语；“愚昧人”比口语性的辱骂更合宜。
- source_word: ትትሐጐሉ
  choice: 必……灭亡
  rationale: 该动词在此表示毁灭、丧亡，并非“信靠”；未来意义由“必”明确表达。
- source_word: በአቢድክሙ
  choice: 因自己的愚妄
  rationale: 名词指愚妄、疯狂或无知；介词在语境中自然表达导致灭亡的原因。
- source_word: ለጠበብን
  choice: 智慧人
  rationale: 指有智慧的人，而非抽象的“智慧”；保持与“愚昧人”的鲜明对照。
- source_word: ትረሰዕዎሙ
  choice: 得罪
  rationale: 该词在这里具有向某人行恶、冒犯或侵犯之意；“得罪”保留其宽泛性，不把行为过度限定为压迫、遗忘或驱逐。
- source_word: ሠናይት
  choice: 美好的事
  rationale: 原词意义宽广，可包括好处、福祉或顺遂；采用概括性译法，避免擅自缩窄为财富或特定形式的福分。
- source_word: ኢይረክበክሙ
  choice: 必临不到你们
  rationale: 动词基本义可为找到、达到、临到；以“临不到”自然表达美好之事无法抵达他们。
theological_decisions:
- issue: 灭亡的原因
  choice: 必因自己的愚妄而灭亡
  alternative: 因愚妄而受惩罚
  rationale: 原文直接陈述灭亡，并把它与愚妄相连；译文不额外说明其机制，也不将其改写成较弱的惩罚。
- issue: 对智慧人的恶行性质
  choice: 得罪智慧人
  alternative: 压迫智慧人／忘记智慧人
  rationale: 原词可表达向人行恶或冒犯；“得罪”保留道德过犯的广度，不把它限定为某一种社会行为，也避免采用与该词形近但语境不合的“忘记”。
- issue: 末句中“美好”的范围
  choice: 美好的事也必临不到你们
  alternative: 福分／亨通必不临到你们
  rationale: 原文范围较宽，可能涵盖福祉、善果或顺遂；译文保留这一开放性，不将其归入特定的报应论或物质繁荣观。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有祸了”保留启示文学的宣告语气；分号呈现愚妄、恶待智慧人和美好不临到之间紧密但未被过度解释的关系。
