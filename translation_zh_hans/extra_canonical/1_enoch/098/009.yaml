review_pass:
  verdict: revise
  source_fidelity: 草稿正确地将前半句译为因自身愚妄而灭亡，也准确保留末句“美好/好处”不临到他们的宽泛含义。但“得罪智慧人”并非此处动词最直接、稳妥的对应。按所给吉兹文本，ትረሰዕዎሙ 属于“忘记、忽视、置之不理”一类意义；应避免将其具体化为“得罪”或英语审计轨迹中的“压迫”。
  naturalness: “你们这些愚昧人有祸了”庄重自然。“美好的事也必临不到你们”可懂，但“好事必不临到你们”更简洁自然，且不缩窄原文所指的广泛“善/好处”。
  terminology: “愚昧人”“愚妄”“智慧人”恰当地保留智慧文学中的道德性对照。“忘记智慧人”保留原文的具体措辞；脚注可说明“漠视／不理会”这一语境化理解。英语 POB 文本及其较晚审计所作“oppress”的处理不应主导中文译文，因为它与所给吉兹动词及前一条审订记录所确认的“forget”不一致。
  issues:
  - severity: high
    issue: “得罪智慧人”误释 ትረሰዕዎሙ。
    rationale: 该动词的基本意义是“忘记”；在此语境可引申为忽视或不理会，但不是“得罪”、冒犯或压迫。现有脚注及词汇决定同样把词义说成“行恶／得罪”，需要一并更正。
  - severity: medium
    issue: 脚注 a 的备选义及理由与源文动词不符。
    rationale: “恶待”“冒犯”将原文未明确的敌对行为加入正文解释。脚注应以“漠视”“不理会”等为可行的语境性表达，并说明其基本义为“忘记”。
  revised_text: 你们这些愚昧人有祸了！你们必因自己的愚妄而灭亡，又忘记智慧人[a]；好事必不临到你们[b]。
  revised_footnotes:
  - marker: a
    text: 或译：“你们漠视智慧人”或“你们不理会智慧人”。原词基本义为“忘记”，在此可带有忽视、置之不理的意思。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“好事必找不到你们”或“福祉必达不到你们”。原文所说的“好”含义较宽。
    reason: lexical_alternative
  revision_rationale: 将第三分句改为“又忘记智慧人”，以忠实对应吉兹语动词，同时用脚注保留“漠视／不理会”的语境化可能。将“美好的事也必临不到”微调为“好事必不临到”，使现代汉语更凝练，且仍保留原文“善、好处、福祉”等开放范围。
