base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/004.yaml
  text: And the God of eternity[a], from there, will tread upon Mount Sinai; he will appear with his host[d][c][b], and he will appear in the strength of his might from heaven.
translation:
  language: zh_hans
  text: 永恒的上帝[a]要从那里踏上[b]西奈山；他要与自己的军旅一同显现[c]，又要从天上以强盛的大能显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永恒的上帝”也可译作“世界的上帝”或“世代的上帝”；ዓለም可表示“永恒、世界、时代”。
    reason: lexical_alternative
  - marker: b
    text: “踏上”所译的动词也可较中性地译作“前往”或“行到”；这里采用“踏上”，以保留神显场景中庄严有力的行进意象。
    reason: lexical_alternative
  - marker: c
    text: 这里的ትዕይንት可指“营地、军旅、军队”，希腊语见证也有“营垒／军旅”。早期译法曾将其理解为“显现”或“形象”，但这很可能是与另一个表示“看见、显现”的词混淆。
    reason: textual_variant
lexical_decisions:
- source_word: ወእምላከ ዓለም
  choice: 永恒的上帝
  rationale: 将ወ理解为“并且”，将አምላክ ዓለም理解为神圣称号。“永恒的上帝”在现代汉语中自然庄重，同时保留“永恒”这一主要语义。
- source_word: እምህየ
  choice: 从那里
  rationale: 保留带介词的指示副词，并使其回指上文所述之处。
- source_word: ይከይድ ዲበ
  choice: 踏上
  rationale: 该动词本可泛指行走、前往；与表示在某物之上的介词连用时，译作“踏上”可传达神显场景中有分量的行进意象。
- source_word: ሲና ደብር
  choice: 西奈山
  rationale: 专名与“山”的标准现代汉语组合。
- source_word: ያስተርኢ
  choice: 显现
  rationale: 该使役形可表达“使自己被看见、出现”；在神显语境中，“显现”准确而庄重。原文两次使用此词，译文也予以重复。
- source_word: በትዕይንቱ
  choice: 与自己的军旅一同
  rationale: 按ትዕይንት“营地、军旅、军队”理解，并将后缀译为“自己的”；介词በ在此表达伴随。此读法也与希腊语παρεμβολή的“营垒、军旅”意象相合。
- source_word: በኃይለ ጽንዑ
  choice: 以强盛的大能
  rationale: 以自然汉语保留“力量”与“强固、强盛”构成的强调表达，避免生硬直译为“他威力的力量”。
- source_word: እምሰማይ
  choice: 从天上
  rationale: 直接表达显现的天上来源；此处无需强行译成复数“诸天”。
theological_decisions:
- issue: 神圣称号አምላክ ዓለም的范围
  choice: 永恒的上帝
  alternative: 世界的上帝／世代的上帝
  rationale: ዓለም可指永恒、世界或时代；在此神显称号中，持续时间的含义较为贴切，但以脚注保留其他真实可能，且不引入原文没有的专名。
- issue: በትዕይንቱ所呈现的神显图景
  choice: 与自己的军旅一同显现
  alternative: 在他的显现中显现／以他的形象显现
  rationale: 现有词汇证据支持“营地、军旅、军队”，且与希腊见证的“营垒／军旅”一致；不过早期译法曾按“显现、形象”处理，故在脚注中说明，不把文本史上的分歧悄然抹去。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文两次“显现”的平行结构；不把“军旅”进一步限定为“天军”，以免加入该词本身未明说的内容。
