base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/002.yaml
  text: 'And Enoch answered and said: "A righteous man[a], whose eyes were opened by God, saw a holy vision in the heavens, which the angels showed me; and from them I heard everything, and I understood what I saw—but not for this generation[d][c][b], but for a distant one that is to come."'
translation:
  language: zh_hans
  text: 以诺回答说：“一位义人[a]，他的眼目被上帝开启，看见了诸天中的一个圣洁异象；众天使把这异象指给我看。我从他们那里听见了一切，也明白了我所看见的；但这不是为这个世代，而是为将要来到的遥远世代[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一句的结构较为突兀，也可理解为：“义人以诺回答说——他的眼目被上帝开启——‘我看见……’”但现译依原文动词的人称，保留“他看见”与随后“指给我看”之间的转换。
    reason: textual_variant
  - marker: b
    text: 也可译作：“而是为那将要来到的、遥远的一代。”末句可以指一个遥远的未来世代，也可能具有集合性的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ ወይቤ
  choice: 回答说
  rationale: 保留闪语叙事中“回答并说”的引语格式，同时以自然的现代汉语表达。
- source_word: ብእሲ ጻድቅ
  choice: 有一个义人
  rationale: 既保留人物品格所含的道德与神学意味，也体现原文无定冠词式的指称。
- source_word: ዘእምኀበ እግዚአብሔር [እንዘ] አዕይንቲሁ ክሡታት
  choice: 他的眼睛蒙上帝开启
  rationale: “开启”体现ክሡታት所含的打开、揭开的意思；“蒙”自然地标明上帝是使动者。
- source_word: ራእየ ቅዱሰ
  choice: 一个神圣异象
  rationale: 句法上更自然地由“神圣”修饰“异象”，不擅自解释为“圣者的异象”。
- source_word: ዘበሰማያት
  choice: 诸天中的
  rationale: 保留原文复数以及闪语和启示文学常见的宇宙观表达。
- source_word: ዘአርአዩኒ መላእክት
  choice: 是众天使指给我看的
  rationale: 保留视觉性的“给我看”，也保留“众天使”作为启示中介。
- source_word: ወሰማዕኩ እምኀቤሆሙ ኵሎ
  choice: 我从他们那里听见了一切
  rationale: 保留“一切”的总体性，并清楚指明信息来自众天使。
- source_word: ወአእመርኩ አነ ዘእሬኢ
  choice: 也明白了我所看见的
  rationale: 动词表达理解或认识，不仅是感知；此点契合启示文学中异象与领悟并列的特点。
- source_word: ወአኮ ለዛ ትውልድ አላ ለዘ ይመጽእ ርኁቃት
  choice: 这不是为现今这个世代，而是为将来那遥远的世代
  rationale: 保留“这个世代”与遥远、将来之世代的对比，也维持原文指向单一世代的可能性。
theological_decisions:
- issue: ራእየ ቅዱሰ是“神圣异象”还是“圣者的异象”
  choice: 神圣异象
  alternative: 圣者的异象
  rationale: 原文句法更自然地让形容词修饰“异象”；另一译法会加入原文并不要求的特定神学称号。
- issue: 启示所指的未来对象是一个世代还是多个世代
  choice: 将来那遥远的世代
  alternative: 将来遥远的世世代代
  rationale: 保留原文单数“世代”的主要读法，同时借脚注说明末句在集合性理解上的空间。
- issue: 第三人称“他看见”与随后第一人称“给我看”的转换
  choice: 照原文保留人称转换
  alternative: 统一译为“我看见”
  rationale: 原文明确由第三人称转入第一人称；这一突变可能具有刻意的神谕修辞色彩，不宜为流畅而抹平。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“诸天”“世代”等启示文学用语。正文不消除原文从第三人称转到第一人称的突变，并用脚注交代句法异读。
