base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/009.yaml
  text: And behold[a], he comes with myriads of holy ones, to execute judgment upon them, and to destroy the wicked[c][b], and to rebuke all flesh for everything that the sinful and wicked have done and spoken against him.
translation:
  language: zh_hans
  text: 看哪，他带着千千万万的圣者来临[a]，要向他们施行审判，除灭恶人，并因罪人和恶人一切敌对他的所作所言，斥责凡有血肉的[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千千万万”也可译作“万万”（即无数个一万）；吉兹语短语表示极其庞大的队伍，并可能沿用传统的数量说法。
    reason: lexical_alternative
  - marker: b
    text: “凡有血肉的”是指全人类的传统表达；正文保留了原文具体的说法。
    reason: cultural_note
  - marker: c
    text: 《犹大书》14—15节呼应了本节；这里的译文以吉兹语见证为依据，并未迁就后来的新约措辞。
    reason: cross_reference
lexical_decisions:
- source_word: ወናሁ
  choice: 看哪
  rationale: 保留启示文学中引人注目、指向异象的语气，比单纯译作“看”更庄重自然。
- source_word: መጽአ
  choice: 他……来临
  rationale: 采用生动的现在性表达，保留预言异象的临场感，不把时态限定为已经来到或将要来到。
- source_word: በትእልፊተ ቅዱሳን
  choice: 带着千千万万的圣者
  rationale: “千千万万”既保留传统数量表达和浩大群体之意，又符合现代汉语；“圣者”不预先限定为天使或人类圣徒。
- source_word: ይግበር ፍትሐ
  choice: 施行审判
  rationale: 体现审判行动，而非仅指抽象的公义。
- source_word: ላዕሌሆሙ
  choice: 向他们
  rationale: 保留介词所表达的审判指向，同时避免过度界定代词所指。
- source_word: ይሕጕሎሙ ለረሲዓን
  choice: 除灭恶人
  rationale: 保留该动词在末世审判语境中的强烈惩罚意味。
- source_word: ይዘልፍ ኵሎ ዘሥጋ
  choice: 斥责凡有血肉的
  rationale: “斥责”保留公开责罪的意味；“凡有血肉的”保存原文具体的传统表达。
- source_word: ኵሉ ዘገብሩ ወረሰዩ
  choice: 所做的一切，以及他们所说的一切
  rationale: 依最新校订，将并列内容理解为行为与言语，并在汉语中清楚保留两项指控。
- source_word: ኃጥኣን ወረሲዓን
  choice: 罪人和恶人
  rationale: 分别保留两个道德称谓及其强调性的并列。
- source_word: ላዕሌሁ
  choice: 敌对他
  rationale: 将单数代词保留为“他”，自然指向来临的审判者，却不增添原文未明说的神圣称号。
theological_decisions:
- issue: 来临者的身份
  choice: 正文只用“他”，不补出“主”或“上帝”。
  alternative: 译作“主来临”或“上帝来临”。
  rationale: 所给吉兹文本的主语为隐含的第三人称单数；上下文虽可使读者联想到神圣审判者，但翻译不应加入原文未明说的称号。
- issue: “圣者”的所指
  choice: 译作“圣者”。
  alternative: 译作“圣徒”或“天使”。
  rationale: 启示文学语境很可能指天上的随从，但原词本身没有在此明确限定其身份，因此保留歧义。
- issue: 审判对象“他们”的所指
  choice: 保留代词“他们”。
  alternative: 直接明确为“世人”或“恶人”。
  rationale: 原文使用代词，紧接着又提到恶人与凡有血肉的；不应在正文中替原文消除潜在的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“看哪”“施行审判”等维持启示文学语体，同时避免生僻古语；保留“他”“圣者”和“他们”等原文未完全说明的指称，不以教派性解释加以限定。
