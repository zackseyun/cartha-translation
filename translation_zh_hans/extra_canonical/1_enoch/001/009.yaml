- from: 看哪，他带着千千万万的圣者来临[a]，要向他们施行审判，除灭恶人，并因罪人和恶人所做的一切，以及他们所说的一切敌对他的话，斥责凡有血肉的[b][c]。
  to: 看哪，他带着千千万万的圣者来临[a]，要向他们施行审判，除灭恶人，并因罪人和恶人一切敌对他的所作所言，斥责凡有血肉的[b][c]。
  rationale: 仅作安全的汉语句法与脚注澄清：以“所作所言”准确、自然地保留行为和言语的并列，并使“敌对他”覆盖二者；未改变主语、审判对象、圣者所指或审判性质等原文保留的歧义。
