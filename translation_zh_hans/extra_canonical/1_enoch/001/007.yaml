base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/007.yaml
  text: And the earth shall be rent asunder[a], and everything that is in the earth shall be destroyed[c][b], and judgment shall come upon all.
translation:
  language: zh_hans
  text: 大地必裂开[a]，大地中的一切[b]都必毁灭，审判[c]必临到万有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大地必震动。”不过，“裂开”也得到古希腊文旁证的支持。
    reason: textual_lexical_alternative
  - marker: b
    text: 或译：“地上的一切。”格厄兹文直译为“在大地中的一切”。
    reason: lexical_alternative
  - marker: c
    text: “审判”一词也可理解为“公正”或“正义”；这里的句式更像是指将要临到万有的裁决。
    reason: lexical_theological_alternative
lexical_decisions:
- source_word: ትሠጠጥ
  choice: 必裂开
  rationale: 此处为被动形式；结合该词“撕裂、裂开”的词义及希腊文旁证，译为“裂开”最能保留大地开裂的末世性图景。鉴于词形辨识及词典解释存在分歧，在脚注中保留“震动”的可能。
- source_word: ምድር
  choice: 大地
  rationale: 上下文描述普世性的宇宙审判，“大地”比地方性的“土地”更合适，也符合现代汉语的庄重语体。
- source_word: ኵሉ ዘውስተ ምድር
  choice: 地里的一切
  rationale: 依格厄兹文直译为“大地里面的一切”，不擅自改成通常所说的“地上的一切”；后者作为自然但较平滑的理解列入脚注。
- source_word: ይትሐጐል
  choice: 都必毁灭
  rationale: 该动词表示灭亡、败坏或遭毁灭；“毁灭”清楚呈现审判所带来的彻底结局。
- source_word: ፍትሕ
  choice: 审判
  rationale: 该名词可指公正、正义，也可在司法语境中指审判。这里与“临到万有”连用，较像将要发生的裁决行动，因此正文译作“审判”，同时在脚注保留其他语义。
- source_word: ላዕለ ኵሉ
  choice: 必临到万有
  rationale: ላዕለ 表示“在……之上、临到”，ኵሉ 表示“一切”。“临到万有”既保留普遍范围，也避免把对象过早限定为仅指人类。
theological_decisions:
- issue: ፍትሕ 是指道德属性“公正／正义”，还是末世性的司法行动“审判”
  choice: 审判
  alternative: 公正；正义
  rationale: “必临到万有”的动态句法更支持一次普遍的司法裁决，但该词自身的公义语义不应被抹去，故以脚注说明。
- issue: 审判所临到的对象是否仅为人类
  choice: 万有
  alternative: 众人；所有人
  rationale: 原文只说“所有／一切”，没有明确限定为人；“万有”保留其可能涵盖整个受造界的广度，也不排除其中的人类对象。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“大地必裂开”保留鲜明的启示文学意象；“地里的一切”刻意保存原文略显异常的空间表达；“万有”比“众人”范围更宽，以维持原文“所有／一切”的歧义。
