  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/003.yaml
  text: 'Concerning the Chosen Ones I said, and I uttered a parable concerning them: The Holy and Great One will go forth from his dwelling.'
translation:
  language: zh_hans
  text: 论到蒙拣选的人，我说，并为他们说了一个比喻：那圣洁而伟大者将从他的居所出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያን
  choice: 蒙拣选的人
  rationale: 该词为“被选中的人”之意；译作“蒙拣选的人”既保留被动含义，也符合现代汉语宗教文献的庄重语体。
- source_word: እቤ
  choice: 我这样说
  rationale: 直译为“我说”；加入“这样”使句子在汉语中自然地引出后续内容，而不增添实质意义。
- source_word: አውሣእኩ
  choice: 说了
  rationale: 此处与“比喻”搭配，表达“发出、讲述”；译作“说了”简洁自然，并避免把该动作过度解释为宣告或预言。
- source_word: ምስለ
  choice: 比喻
  rationale: 依句法与传统语境取“比喻、譬喻”义；这里不预先限定其具体文学体裁。
- source_word: ቅዱስ ወዐቢይ
  choice: 那圣洁而伟大者
  rationale: 保留两个并列称谓及其人格化指向；“那”使定指在现代汉语中清楚，但不额外确定其身份。
- source_word: ይወፅእ
  choice: 将……出来
  rationale: 表达未然的“出去、出来”；结合“从他的居所”译为“将从……出来”，保留未来指向。
- source_word: እማኅደሩ
  choice: 从他的居所
  rationale: 保留来源介词、“居所”及第三人称单数所属关系，不具体化为天、圣所或宫殿。
theological_decisions:
- issue: “圣洁而伟大者”的身份
  choice: 保留称谓，不在正文中明确等同于上帝或其他人物
  alternative: 译作“圣洁伟大的上帝”或“那位至圣至大者”
  rationale: 原文使用称谓而未在本节直接说明身份；保留这种指称方式可避免加入原文未明说的神学判断。
- issue: “蒙拣选的人”的范围与数目
  choice: 采用集合性的“人”，不限定为单数个体或特定群体名称
  alternative: “选民”或“蒙拣选者”
  rationale: 原词为复数，指一群被选择者；“蒙拣选的人”既显明复数集合，也不预设后来的教义性身份。
- issue: 时态与末世指向
  choice: 用“将”表达未来动作
  alternative: “出来”或“必出来”
  rationale: “将”清楚呈现未然意义；避免用“必”额外强化确定性或预言语气。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文两段并列陈述以及冒号后的宣告结构；不增加原文没有的身份说明或处所解释。
