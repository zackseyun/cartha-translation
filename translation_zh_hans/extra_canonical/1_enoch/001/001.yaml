base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/001.yaml
  text: The words of the blessing of Henok[a], with which he blessed the chosen and the righteous who will be present on the day of affliction[c][b], for the removal of all the wicked and godless.
translation:
  language: zh_hans
  text: 以诺[a]祝福之言：他用这话祝福那些将在患难之日[b]、为除去一切恶人和不敬神的人而届时在场的蒙拣选者和义人。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以诺”是汉语中通行的名称；吉兹语文本的名称形式为 Henok（赫诺克）。
    reason: lexical_alternative
  - marker: b
    text: “患难之日”也可译作“困苦之日”或“灾难之日”；原词本身并非“审判”的专门用语。
    reason: lexical_alternative
  - marker: c
    text: “届时在场”也可理解为“届时存在”；原文未必指经过筛选后“存留”。末尾并列“恶人”与“不敬神的人”，分别突出邪恶与不敬虔。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ቃለ ፡ በረከት
  choice: 祝福的话
  rationale: 保留单数“话”的标题式表达，也自然传达祝福之言，而不扩写为“信息”。
- source_word: ዘሄኖክ
  choice: 以诺
  rationale: 采用现代汉语圣经及相关文献中通行的人名形式，便于普通读者辨识；脚注说明其吉兹语形式。
- source_word: በከመ ፡ ባረከ
  choice: 他用这话祝福
  rationale: 明确表达原文关系结构的工具或内容含义，即以方才所说的祝福之言来祝福。
- source_word: ኅሩያነ ፡ ወጻድቃነ
  choice: 蒙拣选者和义人
  rationale: 保留两个并列称谓，不把它们合并为一个群体标签；“蒙拣选者”也避免“选民”可能带来的额外群体限定。
- source_word: እለ ፡ ሀለዉ ፡ ይኩኑ
  choice: 那些将……存留的
  rationale: 此结构可指将来仍存在、留在场或存留的人；“存留”在上下文中自然，但不排除“在场”的理解。
- source_word: በዕለተ ፡ ምንዳቤ
  choice: 在患难之日
  rationale: 表达严重困苦的日子，同时避免把它技术化为某一特定末世论术语或直接译成“审判之日”。
- source_word: ለአሰስሎ
  choice: 都要被除去
  rationale: 传达除掉、移除的目的或结果；中文分句表达比名词化的“为要除去”更流畅。
- source_word: ኵሎ ፡ እኩያነ ፡ ወረሲዓነ
  choice: 一切恶人和不敬神的人
  rationale: 保留末尾两个受谴责类别的区别：前者着重邪恶，后者着重不敬虔或不敬神。
theological_decisions:
- issue: 受祝福群体的称谓关系
  choice: 蒙拣选者和义人
  alternative: 蒙拣选的义人
  rationale: 原文以连词并列两个名称或描述；译文保留这种并列关系，不把二者无根据地合并。
- issue: በዕለተ ምንዳቤ 的末世性含义
  choice: 患难之日
  alternative: 灾难之日；审判之日
  rationale: 词语本身指困苦、患难；上下文虽涉及除去恶人，却不足以把该短语直接改译为“审判之日”。
- issue: “存留”与“在场”的歧义
  choice: 存留
  alternative: 在场；仍然存在
  rationale: 在恶人被除去的语境中，“存留”较自然，但原文结构也可能仅指届时在那里或存在，故以脚注保留这一歧义。
- issue: 末尾两个受审判类别
  choice: 恶人和不敬神的人
  alternative: 邪恶而不敬神的人
  rationale: 并列形式较可能区分两个称谓；译文不将其压缩为一个复合描述，也不把“不敬神”泛化为“罪人”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现题记性质，并将原文末尾的目的结构处理为自然的中文分句。关键称谓保持区分，脚注仅用于人名形式、词义范围及真实歧义。
