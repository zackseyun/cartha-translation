  rationale: 修订消除了“存留”所引入的额外筛选意味，并恢复“为除去”的目的性表达。中文句法仍保留该短语的原有依附范围不完全明确之处，不将其解释为某一特定末世论或审判公式。脚注同步澄清人名形式和真实的语义歧义。
