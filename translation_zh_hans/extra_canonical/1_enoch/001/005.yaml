base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/005.yaml
  text: And all will fear[a], and the vigilant ones will tremble[c][b]; and fear and great trembling will seize them as far as the ends of the earth.
translation:
  language: zh_hans
  text: 一切都必惧怕；守望者[a]必战栗；恐惧和极大的战栗必攫住他们，直达大地的尽头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守望者”译自一个与“警醒、守望”相关的词；在《以诺一书》中，这个词通常是对一类天上存在的惯用称谓。
    reason: terminology_and_referential_note
  - marker: b
    text: “直达大地的尽头”是表示范围遍及全地、直到最遥远之处的说法。
    reason: cultural_note
lexical_decisions:
- source_word: ይፈርሁ
  choice: 必惧怕
  rationale: 该动词为第三人称复数未完成式；在预言性的显现语境中用“必”表达将来和必然结果。
- source_word: ኵሉ
  choice: 众者
  rationale: 保留原文概括性的全称表达，不擅自限定为人类、天使或其他受造物。
- source_word: ይደለቀለቁ
  choice: 必战栗
  rationale: 重叠词形带有加强意味；“战栗”自然表达因神圣显现而剧烈发抖。
- source_word: ትጉሃን
  choice: 警醒者
  rationale: 此词源于警醒、警觉之义，在《以诺一书》传统中也可作为“守望者”的称谓；正文采用兼顾字面含义的“警醒者”，并以脚注说明。
- source_word: ይነሥኦሙ
  choice: 必攫住他们
  rationale: 保留“抓住、占据”的强烈意象，同时符合恐惧等情绪控制人的惯用表达。
- source_word: ፍርሃት
  choice: 恐惧
  rationale: 该词是表示惧怕、恐惧的常用名词。
- source_word: ወረዓድ ዓቢይ
  choice: 剧烈的震颤
  rationale: 将表示颤抖的名词与“大”这一强化形容词合译，形成自然、庄重的现代汉语。
- source_word: እስከ አጽናፈ ምድር
  choice: 直至大地的尽头
  rationale: 按范围终点直译，保留其表示遍及最远边界的末世性表达。
theological_decisions:
- issue: ትጉሃን所指的身份
  choice: 正文译作“警醒者”，脚注提示亦可称“守望者”
  alternative: 直接译作“守望者”，明确指认特定的天使群体
  rationale: 该词既具有“警醒、警觉”的词源意义，又在以诺传统中用作特定群体的称谓。正文不完全消除这两层含义之间的张力，避免在此节单凭译名过度确定其身份。
- issue: “众者”的范围
  choice: 保留不加限定的“众者”
  alternative: 译作“众人”或“一切受造物”
  rationale: 原文只有全称词，没有明确限定其类别；保留开放范围可避免加入原文未明说的对象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“众者”略带经文语体，用来保留原文未限定对象的全称表达；“攫住”保留情绪突然强烈控制人的意象。
