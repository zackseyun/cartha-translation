base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/006.yaml
  text: And the lofty mountains will quake, and the high hills will be brought low; they will melt like wax before the blaze.
translation:
  language: zh_hans
  text: 巍峨的群山必震动[a]，高耸的丘陵必被降低[b]；它们必如蜡在火焰前熔化[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必战栗”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“必降卑”或“必变低”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“如蜡在烈焰面前熔化”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይደነግፁ (yǝdänägǝṣu)
  choice: 必震动
  rationale: 原词在此为复数主语所支配的不及物动词；“震动”既保留大地战栗的末世异象力度，也避免无根据地改成被动表达。
- source_word: አድባር (ʾadbar)
  choice: 群山
  rationale: 该词通常指山岳；结合复数动词以及与“丘陵”的平行结构，译作“群山”自然准确。
- source_word: ነዋኀን / ነዋኃት (newaḥn / newaḥat)
  choice: 巍峨的／高耸的
  rationale: 两种性别形式分别修饰山岳和丘陵，基本意义是高、高耸；中文按搭配分别译为“巍峨的”和“高耸的”，保留地势之高而不引入“骄傲”的人格化含义。
- source_word: ይቴሐቱ (yǝtēḥatu)
  choice: 必被降低
  rationale: 采用被动表达，忠实呈现被降下、变低的意义，并与前面的“高耸”形成鲜明反转。
- source_word: አውግር (ʾawgr)
  choice: 丘陵
  rationale: “丘陵”是合乎现代汉语的地貌名称，也能与“群山”构成原文的平行。
- source_word: ይትመሰዉ (yǝtmäsäw)
  choice: 必……熔化
  rationale: 原词的基本义为融化、熔解；“熔化”与蜡和火焰的具体意象搭配贴切。
- source_word: መዓረ (mäʿärä)
  choice: 蜡
  rationale: 直接采用基本词义；无需增译为更具体的“蜂蜡”。
- source_word: ግራ (gǝra)
  choice: 在……前
  rationale: 保留“在……面前／之前”的空间关系，中文简洁自然。
- source_word: እም ላህብ (ʾǝm lāhb)
  choice: 在火焰前
  rationale: lāhb具体指火焰或烈焰；“火焰”比泛称“火”更贴近词义，也清楚保留蜡受热熔化的比喻。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“必”承载预言式将来语气；“群山—丘陵”保留原文的地貌平行，“震动—被降低—熔化”维持逐步加强的神显异象。代词“它们”不强行限定只指丘陵，保留其可能统指前述山岳与丘陵的空间。
