base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/008.yaml
  text: And he will make peace for the righteous[a], and he will guard the chosen ones; and favor will be upon them, and they will all be God's, and they will prosper and be blessed[c][b], and the light of God will shine upon them.
translation:
  language: zh_hans
  text: 他必赐平安给义人[a]，并护卫蒙拣选的人；恩惠必临到他们；他们都必属上帝，必兴盛、蒙福[b]；上帝的光必照耀他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头在所据传本中措辞略显不整，但整体意思清楚表明上帝向义人施恩，赐他们平安。
    reason: textual_variant
  - marker: b
    text: “兴盛”也可理解为“顺遂”或“昌盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰላመ ይገብር ለጻድቃን
  choice: 赐平安给义人
  rationale: 该结构表达为义人带来或赐下平安；这样既保留主动施予的含义，也避免“与义人和好”所暗示的先前敌对关系。
- source_word: የዓቅቦሙ
  choice: 看守
  rationale: 此处具有保护、保守之意；“看守”保持具体的护卫意味，又不过度引申。
- source_word: ሕሩያን
  choice: 蒙拣选的人
  rationale: 保留以诺传统中这一重要身份称谓，并与前面的“义人”区别开来，不把两个称呼合并。
- source_word: ሣህል
  choice: 恩惠
  rationale: 此词表示临到他们的慈爱眷顾；“恩惠”能自然配合“临到”，且不局限为怜悯或某一特定教义术语。
- source_word: ዘአምላክ
  choice: 属上帝
  rationale: 属格结构最自然地表示归属；“属上帝”简洁地保留这种身份关系，不增添原文未明说的名词。
- source_word: ይሴርሑ
  choice: 兴盛
  rationale: 该动词大致表示顺遂、昌盛或境况良好；“兴盛”保留积极发展的含义，但不限定为物质富足。
- source_word: ይትባረኩ
  choice: 蒙福
  rationale: 以自然的中文被动表达对应原文形式，并保留祝福语汇的庄重感。
- source_word: ይበርህ ሎሙ ብርሃነ አምላክ
  choice: 上帝的光必照耀他们
  rationale: 保留神圣光明临到他们的启示文学意象，中文自然而庄重。
theological_decisions:
- issue: 如何处理“义人”与“蒙拣选的人”这两个群体称谓
  choice: 分别保留两个平行称谓
  alternative: 将二者合并为同一个群体称呼，或把后者译作带有较强后世教义色彩的术语
  rationale: 原文连续使用两个不同称谓。分别保留可呈现其修辞层次，也避免用后来的体系化含义取代文本自身的表达。
- issue: ዘአምላክ所表达的关系
  choice: 他们都必属上帝
  alternative: 他们都必敬虔；他们都必成为上帝的子民
  rationale: 原文最自然地表达归属，而非单指道德品质；加入“子民”则会补入原文未明确出现的名词。
- issue: 上帝向义人所行之事的性质
  choice: 赐平安给义人
  alternative: 与义人和好
  rationale: 介词结构指向为义人建立或赐下平安，不应暗示上帝与义人此前处于敌对、如今才和解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“赐平安给”比直译为“为……制造平安”更自然；句中保留“义人”“蒙拣选的人”“属上帝”等彼此有别的表达，以维持原文的神学张力与身份层次。
