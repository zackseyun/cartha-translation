base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/008.yaml
  text: In those days the faces of the kings of the earth and the mighty who possess the dry land shall be humbled[a], because of the works of their hands; for on the day of their distress and affliction[d][c][b], they will not save themselves.
translation:
  language: zh_hans
  text: 那些日子，地上的君王和占有陆地[b]的权势者都将面容低垂[a]，因为他们手所做的事[c]；到了他们困厄和患难的那一天，他们不能救自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“成为脸面低垂的”。这可表示羞愧、受辱或意气消沉；传本文句较为紧缩，也有人译作“他们的脸将被降卑”。
    reason: alternative_reading
  - marker: b
    text: 原文此词字面是“干地”或“旱地”，在这里可指与水域相对的陆地，也可泛指人所居住、统治的土地或大地。
    reason: lexical_alternative
  - marker: c
    text: “手所做的事”泛指他们的行为，也可能令人联想到人手所造的偶像或自建的权势，但原文没有把含义限定于此。
    reason: cultural_note
lexical_decisions:
- source_word: በዝንቱ መዋዕል
  choice: 那些日子
  rationale: 保留启示文学中常见的时间套语，既自然又具有末世语境的庄重感。
- source_word: ክኑ ትሑታነ ገጽ
  choice: 都将垂下脸来
  rationale: 结合校勘所指出的动词残缺，按“他们将成为脸面低垂”理解；中文以“垂下脸来”保留“脸”的具体意象及羞辱、沮丧的语感，而不另加原文未明说的致使者。
- source_word: ነገሥተ ምድር
  choice: 地上的君王
  rationale: 这是启示文学中指世上统治者的惯用表达，也保留其广阔范围。
- source_word: ጽኑዓን
  choice: 权势者
  rationale: 此处与君王并列，主要指有权有势的人；“权势者”比单纯的“强壮者”更符合社会政治语境。
- source_word: እለ ይእኅዝዋ ለየብስ
  choice: 掌管旱地的
  rationale: 动词可指持有、占有或掌握；“掌管”适合统治者语境，“旱地”则保留名词的具体字面意象。
- source_word: በእንተ ምግባረ እደዊሆሙ
  choice: 因为他们手所做的事
  rationale: 保留圣经式“手所做的”表达及其道德含义，同时不把它限定为偶像或某一种罪行。
- source_word: በዕለተ ጻዕቆሙ ወጻሕቦሙ
  choice: 到了他们困厄和患难的那一天
  rationale: 保留单数“那一天”以及两个近义苦难名词形成的加强语气。
- source_word: ኢይድኅኑ ርእሶሙ
  choice: 他们不能救自己
  rationale: 清楚表达显明的反身对象，不引入后来的教义术语。
theological_decisions:
- issue: “脸面低垂”与君王、权势者之间的句法关系
  choice: 把“地上的君王和权势者”视为主语，把“垂下脸来”视为他们在审判中所呈现的状态。
  alternative: 可按传本文字的压缩结构译成“脸面卑下的人将蒙羞——地上的君王和权势者”，或把“他们的脸将被降卑”理解为被动表达。
  rationale: 上下文紧接他们因自己所做之事受困而不能自救，且校勘显示 ክኑ 很可能是“他们将成为”一词的残缺形式，因此以君王和权势者为明确主语最连贯；脚注仍保留句法与措辞上的不确定性。
- issue: “手所做的事”是否特指偶像
  choice: 正文采用宽泛表达，不明说是偶像。
  alternative: 译为“他们手造的偶像”或专指他们建立的权力。
  rationale: 该惯用语可能唤起偶像崇拜或人为权势的联想，但吉兹文在本节并未把含义限定于此。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“垂下脸来”保留原文的身体意象和羞耻语境；“权势者”与“君王”形成自然并列。标点按中文长句节奏处理，以分号连接罪因与不能自救的审判结果。
