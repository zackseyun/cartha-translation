base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/009.yaml
  text: And into the hands of my chosen ones I will deliver them[a], and like straw in the fire, so they will burn before the face of the holy ones; and like lead in water, they will sink before the face of the righteous[e][d][c][b], and no trace will be found for them.
translation:
  language: zh_hans
  text: 我要把他们交在我所拣选的人手中[a]；他们要在圣者面前像火中的干草一样燃烧，又要在义人面前像水中的铅一样沉没；再也找不到他们的踪迹[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“交在我所拣选的人手中”，这里可能含有把他们交给这些人掌权或施行审判的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文也可较直译为“再也找不到属于他们的踪迹”，意思是他们全然消失，没有留下任何痕迹或余迹。
    reason: lexical_alternative
lexical_decisions:
- source_word: ውስተ፡ እዴሆሙ፡ ለኅሩያን፡ ዚአየ፡ እወድዮሙ
  choice: 我要把他们交在我所拣选的人手中
  rationale: 按修订后的形态分析，ዚአየ 是“我的”，እወድዮሙ 是第一人称单数未完成式“我要交出／交付他们”。中文保留“手中”的具体意象，同时自然表达交付与权柄的含义。
- source_word: ኅሩያን
  choice: 所拣选的人
  rationale: 保留启示文学中的群体称谓及“被拣选”的被动含义，不采用可能带入后期教义术语色彩的表达。
- source_word: ከመ፡ ሣዕር፡ ውስተ፡ እሳት፡ ከመዝ፡ ይውዕዩ
  choice: 他们要像火中的干草那样燃烧
  rationale: ከመ…ከመዝ 构成“像……那样”的对应结构；未完成式按末世审判语境译为将来。ሣዕር 可指草、干草或残茬，此处用“干草”清楚呈现迅速焚烧的比喻。
- source_word: እምቅድመ፡ ገጸ፡ ቅዱሳን
  choice: 在圣者面前
  rationale: 将字面“从圣者的面前”按汉语习惯译作“在圣者面前”，保留庄严的临在与审判图景；不强行判定圣者是天使还是人。
- source_word: ዐረር፡ ውስተ፡ ማይ፡ ይሠጠሙ
  choice: 像水中的铅那样沉没
  rationale: ዐረር 最适合解作“铅”，以重金属入水下沉的鲜明形象表达毁灭；未完成式译为将来。
- source_word: ጻድቃን
  choice: 义人
  rationale: 这是以公义为特征、最终得申雪之群体的常用称谓；“义人”简洁、庄重且符合现代汉语宗教文学语域。
- source_word: ወኢይትረከብ፡ ሎሙ፡ አሰር
  choice: 他们将不留任何踪迹
  rationale: 原句直译近于“找不到属于他们的踪迹”。中文以结果式表达其完全消失的意思，同时保留“踪迹”这一核心意象。
theological_decisions:
- issue: 开头的“手中”应否直接解释为审判权柄
  choice: 译作“交在我所拣选的人手中”，保留手的意象
  alternative: 译作“交给我所拣选的人处置”或“置于我所拣选之人的权下”
  rationale: 原文使用具体的“手”语汇，语境虽暗示被交付到他们的权柄之下，却没有把权柄抽象明说；正文不替原文消除这一张力。
- issue: “圣者”与“义人”的身份及彼此关系
  choice: 保留为两个平行而有区别的称谓
  alternative: 把两者视为同一群体，或明确把“圣者”定为天使、“义人”定为忠信的人
  rationale: 原文平行使用两个名称，却未在本节明确界定其身份；译文不作超出文本的本体论判定。
- issue: 各未完成式的时间意义
  choice: 按将来的末世审判译为“要／将”
  alternative: 按异象叙述译成过去时“燃烧了、沉没了”
  rationale: 三个谓语均为未完成式，且上下文指向将临的审判；将来表达既符合语法，也避免误作已经发生的异象事件。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。用“所拣选的人”“圣者”“义人”保存启示文学的群体称谓；句式保持两组比喻的平行结构，但避免过度古雅。
