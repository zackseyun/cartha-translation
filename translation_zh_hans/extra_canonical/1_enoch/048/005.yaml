base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/005.yaml
  text: And all who dwell upon the dry land shall fall down and bow before him[a], and they shall praise and bless and sing to the Lord of Spirits.
translation:
  language: zh_hans
  text: 凡住在陆地上的人[a]，都要俯伏，并在他面前下拜；他们要赞美他，称颂他，并向诸灵之主歌唱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“地上的人”。原文较直译为“住在干地（陆地）上的人”。
    reason: 说明የብስ既可具体指与水域相对的干地、陆地，也可在语境中泛指大地。
lexical_decisions:
- source_word: ይወድቁ
  choice: 俯伏
  rationale: 该动词描写倒下或伏地的动作；结合敬拜场景译作“俯伏”，既保留身体姿态，也不把它单纯抽象化为敬意。
- source_word: ይሰግዱ
  choice: 下拜
  rationale: 该词常指躬身、伏地致敬。“下拜”保留可见的身体动作，并避免在正文中直接用较具解释性的“敬拜”。
- source_word: ቅድሜሁ
  choice: 在他面前
  rationale: 按空间意义直译，清楚保留单数男性指代及异象场景中的临在感。
- source_word: ኵሎሙ
  choice: 凡……都
  rationale: 以现代汉语的周遍结构表达原文“所有”的普遍范围，自然且完整。
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: 住在陆地上的人
  rationale: የብስ具体指干地或陆地。“陆地”比“地上”更贴近字面，同时在现代汉语中比可能令人联想到干旱地区的“旱地”更自然。
- source_word: ይሴብሕዎ
  choice: 赞美他
  rationale: 保留动词的颂赞意义，也明确保留原文所带的第三人称单数宾语后缀。
- source_word: ይባርክዎ
  choice: 称颂他
  rationale: 此处是对受颂者发出的祝颂；“称颂”较自然地表达向尊荣对象所作的祝福和颂扬，并保留宾语后缀。
- source_word: ይዜምሩ
  choice: 歌唱
  rationale: 该词表示以歌声颂扬；“歌唱”简洁、庄重，也符合末句明确带出的对象。
- source_word: ለእግዚአ መናፈስት
  choice: 向诸灵之主
  rationale: 保留《以诺一书》中反复出现的神圣称号；“诸灵”准确体现复数而不额外加入“所有”的含义，“向”则表达原文介词所标示的歌唱对象。
theological_decisions:
- issue: 前半句“他”与末句“诸灵之主”的所指关系
  choice: 保留“他”的代词形式，并在末句明确译作“向诸灵之主歌唱”，不将两者直接合并或区分为同一对象或不同对象。
  alternative: 可把全节所有代词与“诸灵之主”理解为同一位；也可把前面的“他”理解为上下文中的受高举者，而把末句的歌唱对象理解为神。
  rationale: 吉兹文先使用单数宾语后缀，末尾又明说“诸灵之主”。紧密并置本身形成神学张力；译文应保存其语法层次，不替原文消解所指关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“俯伏……下拜”保留两个连续身体动作；分号区分臣服动作与颂赞行动。“诸灵之主”作为固定称号处理。
