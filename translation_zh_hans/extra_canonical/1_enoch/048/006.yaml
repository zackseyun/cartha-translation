base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/006.yaml
  text: For this reason[a], he was chosen and hidden before him before the world was created[c][b], and forever.
translation:
  language: zh_hans
  text: 因此，他在世界受造以前[b]，在他面前[a]蒙拣选、被隐藏，直到永远[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他面前”也可译作“在他临在之中”。这里的“他”最自然是指上帝，但原文只用代词。
    reason: lexical_alternative
  - marker: b
    text: “世界”所对应的词也可表示“世代”；这里按创造语境译作“世界”。
    reason: lexical_alternative
  - marker: c
    text: “直到永远”也可较直译为“直到永世”或“直到那世代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በእንተዝ
  choice: 因此
  rationale: 表达本句承接前文、说明缘由的功能；现代汉语自然简洁，又不削弱因果意味。
- source_word: ኮነ
  choice: 蒙拣选、被隐藏
  rationale: 此处动词与后面的两个谓语性词语共同构成状态表达。汉语不必另译“成为”，以免句子生硬。
- source_word: ኅሩየ
  choice: 蒙拣选
  rationale: 准确表达被选定、被分别出来之意；“蒙”保留被动意味，但不加入超出原文的后期教义术语。
- source_word: ወኅቡአ
  choice: 被隐藏
  rationale: 保留与“蒙拣选”并列的被动状态，也符合启示文学中人物被保留、尚未显明的意象。
- source_word: በቅድሜሁ
  choice: 在他面前
  rationale: 保留原文的空间—关系表达及代词指向；所指最自然地理解为上帝，但正文不明说。
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: 在世界受造以前
  rationale: 清楚表达先于创造的时间关系。“世界”在此最符合上下文，同时以脚注保留“世代”的词义可能。
- source_word: ወእስከ ለዓለም
  choice: 直到永远
  rationale: 自然表达持续至无尽之时的意思，同时保留原文“直到”的时间延展感。
theological_decisions:
- issue: 是否用明确的后期基督论术语表达这位人物在创造以前的存在
  choice: 保留“在世界受造以前……蒙拣选、被隐藏”的启示文学表述
  alternative: 译成“从永恒中被预定”或“预先与上帝同在”
  rationale: 原文明确提出创造以前的拣选与隐藏，却没有使用这些后期系统神学措辞；直译其时间与关系结构，可保留经文本身的神学张力。
- issue: “他面前”所指是否在正文中明确为上帝
  choice: 正文保留代词“他”，脚注说明最自然的所指
  alternative: 直接译作“在上帝面前”
  rationale: 上下文很可能指上帝，但原文使用代词；保留代词可避免把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“在他面前”有意保留原文的关系性措辞和代词歧义；句序调整为汉语较自然的时间状语前置，但不改变创造以前、拣选与隐藏、持续到永远这三层信息。
