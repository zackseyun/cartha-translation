base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/001.yaml
  text: In that place I saw the spring of righteousness[a], which is inexhaustible, and around it were many springs of wisdom. And all the thirsty drank from them and were filled with wisdom[f][e][d][c][b], and their dwelling was with the righteous and the holy and the chosen.
translation:
  language: zh_hans
  text: 在那里，我看见正义之泉，永不枯竭；许多智慧之泉环绕着它[a]。所有口渴的人都从这些泉中饮水，被智慧充满；他们的居所是在义人、圣者和蒙拣选者当中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “环绕着它”一处的埃塞俄比亚文本较难，且相关形式似有重复；大意很可能是许多智慧之泉围绕着正义之泉。
    reason: textual_variant
lexical_decisions:
- source_word: መካን
  choice: 地方
  rationale: 这是常见的地点用语；结合异象叙事，以“在那里”起句最符合现代汉语表达，又不把地点具体化。
- source_word: ነቅዐ / አንቅዕተ
  choice: 泉 / 泉
  rationale: 原文单数与复数相互呼应，并有口渴者饮水的后文；统一译作“泉”，保留鲜明的水源意象。
- source_word: ጽድቅ
  choice: 正义
  rationale: 此词兼有公义、正直与正当秩序的语义；“正义之泉”在现代汉语中自然庄重，也避免将含义限缩为个人品德。
- source_word: ዘኢይትኄለቍ
  choice: 永不枯竭
  rationale: 该表达指不可计量、无穷尽；用于泉水时，“永不枯竭”既贴合语境，又保留其无尽丰盛之意。
- source_word: አውዳ፡ የአውዳ
  choice: 环绕着它
  rationale: 文本此处形式较难，但含有围绕之空间关系和较主动的表达；“环绕着它”比单纯的“在它周围”更能呈现原文动势。
- source_word: ጥበብ
  choice: 智慧
  rationale: 这是该词在智慧传统中的标准对应词，并保留智慧如水、能使人充满的异象性表达。
- source_word: ጽሙኣን
  choice: 口渴的人
  rationale: 直译其具体形象，不在正文中预先把口渴解释为属灵渴慕。
- source_word: ይሰትዩ
  choice: 饮水
  rationale: 明确表达从泉中喝水的动作，符合现代汉语搭配，并保留原文的异象意象。
- source_word: ይትመልኡ
  choice: 充满了
  rationale: 保留被智慧充满的结果意义，而不弱化为仅仅获得或学习智慧。
- source_word: ማኅደሪሆሙ
  choice: 他们的居所
  rationale: 表达稳定居住、同住的含义，适合末世性群体图景，语体庄重而易懂。
- source_word: ጻድቃን
  choice: 义人
  rationale: 这是现代中文宗教及古典叙事中自然的群体称谓，并与“正义”保持词义关联。
- source_word: ቅዱሳን
  choice: 圣者
  rationale: 原词为复数群体称谓；“圣者”保留其名词性质，同时不像“圣徒”那样容易带入后期教会制度色彩。
- source_word: ኅሩያን
  choice: 蒙拣选者
  rationale: 保留被选择的被动含义及群体称谓，不进一步规定拣选的方式或教义体系。
theological_decisions:
- issue: 末尾三个群体称谓如何处理
  choice: 义人、圣者和蒙拣选者
  alternative: 正直的人、圣洁的人和被选中的人；义人、圣徒和选民
  rationale: 原文将三个复数称谓并列。译文保留三项并列及其末世性群体意味，同时避免使用可能附带后期宗派或教会制度含义的“圣徒”“选民”。
- issue: 是否在正文中解释水的象征意义
  choice: 保留泉、口渴、饮水和充满等异象意象
  alternative: 直接译为人寻求并获得正义和智慧
  rationale: 原文刻意以可见、可饮的泉水描绘正义与智慧；正文不应把这一张力化约为抽象教义说明。
- issue: ጽድቅ译为“正义”还是“公义”
  choice: 正义
  alternative: 公义
  rationale: 两者均可表达原词的道德与司法内涵；“正义”是普通现代读者更直接理解的标准汉语，也不会额外强化特定神学术语传统。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“在那里，我看见……”保持异象报告的简洁节奏；用分号呈现正义之泉与环绕它的智慧之泉之间的紧密关系。正文仅保留一则确有必要的文本说明，避免把可由正文自然传达的词义另作冗余脚注。
