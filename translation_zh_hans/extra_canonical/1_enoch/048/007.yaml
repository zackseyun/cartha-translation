base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/007.yaml
  text: And the wisdom of the Lord of Spirits has revealed him to the holy and to the righteous[a]; for they have kept the portion of the righteous, because they hated and despised this world of unrighteousness, and they hated all its works and its ways in the name of the Lord of Spirits. For by his name they are saved[d][c][b], and by his good pleasure their life came to be.
translation:
  language: zh_hans
  text: 万灵之主的智慧向圣洁者和义人[a]显明了他；因为他们持守了义人的分[b]，因为他们恨恶并轻看这个不义的世界，也奉万灵之主的名恨恶这世界一切的行为和道路。因为他们因他的名得救[c]，他们的生命也因他的美意得以存在[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣洁的人和义人”。原文的群体称谓可指分别为圣的人们。
    reason: lexical_alternative
  - marker: b
    text: “义人的分”也可理解为义人所得的份额、所分得之物或产业。
    reason: lexical_alternative
  - marker: c
    text: 或译“他们将因他的名得救”或“他们因他的名蒙拯救”。原文可以表达一般性的拯救，也可能含有末世指向。
    reason: temporal_ambiguity
  - marker: d
    text: 或译“他们的生命因他的旨意得以确立”。本句强调他们的生命取决于万灵之主的意愿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ከሠተ
  choice: 显明了
  rationale: 该动词在此为主动，意为“揭示、显明”；主语是“万灵之主的智慧”，宾语“他”由动词中的宾语成分表达。
- source_word: ቅዱሳን
  choice: 圣洁的人
  rationale: 指分别为圣的一群人；此译法避免“圣徒”可能带入的后期教会称谓，同时保持群体含义。
- source_word: ጻድቃን
  choice: 义人
  rationale: 这是以诺传统中的重要伦理与末世类别；“义人”自然、庄重，并可与“不义”形成对应。
- source_word: ጥበቡ ለእግዚአ መናፍስት
  choice: 万灵之主的智慧
  rationale: ጥበቡ 为句子主语，后接属格关系；不可省略“万灵之主的”。
- source_word: ዐቀቡ
  choice: 持守了
  rationale: 兼顾“守住、保存”的含义，并体现已经发生而持续有效的忠贞行动。
- source_word: ክፍሎሙ ለጻድቃን
  choice: 义人的分
  rationale: “分”可指所得的份、份额或产业，不将语义过早限定为“命运”或“基业”。
- source_word: ዘዓመፃ
  choice: 不义的
  rationale: 表达世界在道德上的邪恶，并与“义人”形成词义上的呼应。
- source_word: ምግባሮ ወፍናዊሁ
  choice: 行为和道路
  rationale: 保留原文并列的修辞丰满度；“道路”也保存道德路径的意象。
- source_word: በስሙ ለእግዚአ መናፍስት
  choice: 奉万灵之主的名
  rationale: “奉……的名”在现代汉语宗教语体中自然，并保留凭其权柄、归属或忠诚而行的开放含义。
- source_word: ይድኅኑ
  choice: 得救
  rationale: 可表达当前或一般性的蒙拯救事实，不强行限定为纯粹未来事件。
- source_word: በፈቃዱ
  choice: 因他的美意
  rationale: 既表达神的意愿，也保留其出于悦纳和旨意的积极色彩。
- source_word: ኮነ ሕይወቶሙ
  choice: 他们的生命……有了
  rationale: 贴近“他们的生命成为／产生”的措辞，避免擅自具体化为“被确立”或“得以延续”。
theological_decisions:
- issue: “得救”是现在、将来，还是一般性的拯救
  choice: 他们因他的名得救
  alternative: 他们将因他的名得救；他们因他的名蒙拯救
  rationale: 原文形式容许一般性或现在性的陈述；采用无显式时态的汉语“得救”，可以自然保留现在事实与末世盼望之间的张力。
- issue: “义人的分”具体指什么
  choice: 义人的分
  alternative: 义人的份额；义人的产业；义人的命分
  rationale: 原短语可能指义人的份额、所分得之物或归属；主文使用较透明的“分”，不把它限定为产业或命运。
- issue: 生命与神旨意的关系
  choice: 他们的生命也因他的美意而有了
  alternative: 他们的生命因他的旨意得以确立
  rationale: 保留生命取决于万灵之主意愿的神学重点，同时不过度解释原文的“成为”为“确立”。
- issue: 智慧所显明的对象
  choice: 显明了他
  alternative: 把他启示出来
  rationale: 原文动词包含阳性单数宾语，语境所指对象在本节内未重述；保留“他”，不擅自添加身份称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万灵之主”保持全书神名的一致性；“圣洁的人”“义人”“不义的世界”清楚呈现原文伦理对照。句法大体跟随原文，但通过“也”等连接词使汉语流畅。
