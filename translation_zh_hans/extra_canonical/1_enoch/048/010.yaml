base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/010.yaml
  text: And on the day of their affliction[b][a], rest shall come upon the earth.
translation:
  language: zh_hans
  text: 在他们受苦的日子，安息必临到地上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必临到地上”也可译作“必在地上出现”或“必在地上”。原文动词可表示“成为”或“存在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለተ
  choice: 在……的日子
  rationale: 保留原文明确的时间标记及其启示文学语气，同时符合现代汉语表达。
- source_word: ጻሕበ
  choice: 受苦
  rationale: 该词表示压力、困苦或患难；“受苦”自然易懂，又不把它处理成带有特定末世论含义的术语。
- source_word: ዚአሆሙ
  choice: 他们
  rationale: 按属格代词理解，承接上文所指群体；与“受苦”结合译为“他们受苦”。
- source_word: ዕረፍት
  choice: 安息
  rationale: 保留停止劳苦、得享休息的核心意义，也维持其对象和性质未被说明的开放性。
- source_word: ትከውን
  choice: 必临到
  rationale: 原词含“成为、出现、存在”之意；“必临到”在汉语中自然地表达未来发生，同时不把事件解释得过细。
- source_word: ዲበ ምድር
  choice: 到地上
  rationale: 结合“临到”译出广及大地的空间范围；不收窄为某一地区或土地。
theological_decisions:
- issue: “安息”的范围及性质
  choice: 译作未限定受益者和具体性质、临到地上的“安息”
  alternative: 专指义人的解脱、审判后的止息，或遍及某地的和平
  rationale: 本节十分简短，并未明说谁获得安息，也未界定安息是解脱、和平还是审判后的止息，因此正文保留这种神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“受苦”避免把原词技术化为特定的末世论术语；“安息”保留启示文学中简洁、强烈的对照。
