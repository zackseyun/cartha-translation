base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/004.yaml
  text: He will be a staff for the righteous[a], so that they may lean on him and not fall; and he will be the light of the nations[c][b], and he will be hope for those who are troubled in heart.
translation:
  language: zh_hans
  text: 他必作义人的杖，使他们倚靠他而不跌倒；他必作万族之光[a]，也必成为心里受苦之人的盼望[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照亮万族的光”或“给万族的光”。原文是“万族之光”这一紧凑结构，关系可有不同理解。
    reason: lexical_alternative
  - marker: b
    text: 直译：“那些在心里受苦（或患病）的人。”这里主要指内心的痛苦，但原词也可表示患病。
    reason: lexical_alternative
lexical_decisions:
- source_word: በትረ
  choice: 杖
  rationale: 此词可指杖或棍；下文说人倚靠它而不跌倒，因此“杖”最贴合具体的扶持意象，也避免“权杖”所带来的额外王权含义。
- source_word: ለጻድቃን
  choice: 义人
  rationale: 这是指一类人的称谓；“义人”是现代汉语圣经及启示文学语境中自然、庄重的表达。
- source_word: ይትመረጐዙ
  choice: 倚靠他
  rationale: 与“杖”和“不跌倒”连用，既保留身体倚杖的图景，也自然传达比喻性的扶持。
- source_word: ወኢይደቁ
  choice: 而不跌倒
  rationale: “跌倒”直接延续倚杖得扶持的意象；比“绊倒”更符合上下文。
- source_word: ብርሃነ አሕዛብ
  choice: 万族之光
  rationale: 原文为紧凑的属格结构，直译为“列族/万族之光”。“万族”保留普世、群体性的范围，并避免“外邦人”可能引入的后期犹太人与非犹太人对比。
- source_word: ተስፋ
  choice: 盼望
  rationale: “盼望”自然表达此处末世性和安慰性的力量。
- source_word: ለእለ የሐምሙ በልቦሙ
  choice: 心里受苦之人
  rationale: 动词可表示受苦或患病；与“心里”连用时主要指内在痛苦。“受苦”保留词义范围而不将其局限为身体疾病。
theological_decisions:
- issue: 本节反复出现的 ውእቱ 所指为何
  choice: 全节用阳性单数“他”指称
  alternative: 反复译作较中性的“这一位”，或省略部分主语
  rationale: 原文使用指示代词兼人称代词形式；紧邻上下文所指是一位单数、具人格的被拣选者/人子形象。译作“他”使现代汉语清楚自然，但不加入后期教义称号。
- issue: ብርሃነ አሕዛብ 的关系
  choice: 译作“万族之光”
  alternative: 译作“照亮万族的光”或“给万族的光”
  rationale: 保留原文属格结构及其可能的语义张力，不明确限定这光与万族之间是所属、受益还是照耀关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“杖—倚靠—跌倒”连续保留原文的具体比喻；分号呈现本节并列的三重宣告。
