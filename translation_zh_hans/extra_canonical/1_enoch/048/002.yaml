base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/002.yaml
  text: And at that hour that Son of Man was named in the presence of the Lord of Spirits[b][a], and his name was before the Head of Days.
translation:
  language: zh_hans
  text: 就在那时，那位人子在诸灵之主面前被命名[a]；他的名在万日之首[b]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被称为”。这个被动动词既可表示称呼，也可表示命名；正文采用“被命名”，因为下一句再次提到“他的名”。
    reason: lexical_alternative
  - marker: b
    text: “万日之首”是本书《比喻篇》中特有的神圣称号，原文直译近于“诸日之首”。这里保留“首”与“日”的意象，没有改用较熟悉的传统称谓。
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ሰዓት
  choice: 就在那时
  rationale: 保留庄严的启示性时间标记，同时采用现代汉语自然表达；“时”仍传达原文较明确的时间点。
- source_word: ተጸውዐ
  choice: 被命名
  rationale: 此处被动形式可指被称呼或被命名；下句紧接“他的名”，故正文采用“被命名”，同时以脚注保留另一可能。
- source_word: ወልደ ሰብእ ዝኩ
  choice: 那位人子
  rationale: 远指成分指向异象中已经在视野内的特定人物；“那位”比单用“那”更符合现代汉语，也保留其称号式用法。
- source_word: በኀበ እግዚአ መናፈስት
  choice: 在诸灵之主面前
  rationale: 体现天上君王临在与宫廷场景；“诸灵之主”直译复数结构，避免缩减为泛称。
- source_word: ስሙ
  choice: 他的名
  rationale: 保留原文对“名”的重复，因为这一重复与前句“被命名”在语义和主题上彼此呼应。
- source_word: መቅድመ
  choice: 在……面前
  rationale: 保留空间性和临在意味，不扩写为明确的时间性先存论断，从而维持原文的开放性。
- source_word: ርእሰ መዋዕል
  choice: 亘古之首
  rationale: 保留“首”这一独特神圣称号的核心意象；“亘古”表达众日与久远岁月的庄严感，比生硬的“诸日之首”更适合现代中文。
theological_decisions:
- issue: ወልደ ሰብእ 在此是泛指普通人，还是特定人物的称号
  choice: 那位人子
  alternative: 那个人／那位人的儿子
  rationale: 《比喻篇》的局部语境把此人物呈现为特定、受高举的末世人物；译作“那位人子”体现这种称号性，但不借此加入后期教义解释。
- issue: “他的名在亘古之首面前”是否明确宣告先存
  choice: 保留“在……面前”的紧凑表述
  alternative: 他的名早已在亘古之首面前／他在亘古之首以前已被命名
  rationale: 原文可能使人联想到天上的先在或优先地位，但句法本身简练且含义开放；不加入“早已”“以前”等词，以免把暗示强化为确定教义。
- issue: 神圣称号 ርእሰ መዋዕል 是否改用传统对应称号
  choice: 亘古之首
  alternative: 亘古常在者／万古之先
  rationale: 采用保留“首”意象的独特称号，避免以较熟悉的传统称谓抹平《以诺一书》本身的表达。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。“就在那时”自然传达启示文学的时间标记；分号维持两个并列陈述的紧密关系。所有脚注标记均置于正文相应词语之后。
