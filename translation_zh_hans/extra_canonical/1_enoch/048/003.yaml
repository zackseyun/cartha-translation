base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/003.yaml
  text: And before the sun and the signs were created[a], before the stars of heaven were made[c][b], his name was called before the Lord of Spirits.
translation:
  language: zh_hans
  text: 在太阳和征兆[a]受造以前，在天上的星辰被造以前，他的名就已在诸灵之主面前[b]被称呼了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “征兆”也可译作“记号”或“标志”。原文把“太阳和征兆”并列为第一个“受造”分句的主语，随后另说天上的星辰被造。
    reason: 说明词义范围及原文分句结构，避免把“征兆”误接为“星辰的征兆”。
  - marker: b
    text: 也可译作“在诸灵之主前”。原文介词可作一般的“在……前”理解，也可带有在尊者面前的宫廷临在意味。
    reason: 保留原文介词的空间及宫廷临在语义范围，不误引为时间上的先后。
lexical_decisions:
- source_word: ዘእንበለ / እንበለ
  choice: 在……以前
  rationale: 两个结构均引出时间从句，表示“在……以前”；保留原文两重的前创造时间层次。
- source_word: ትትፈጠር
  choice: 受造
  rationale: 这是被动的创造用语；“受造”简洁庄重，并明确太阳和征兆是创造行为的承受者。
- source_word: ፀሐይ
  choice: 太阳
  rationale: 直接对应宇宙天体名称。
- source_word: ታእምር
  choice: 征兆
  rationale: 该词可指征兆、记号或标志；“征兆”既保留天象语境，也不把其功能限定为现代天文学意义上的标记。
- source_word: ይትገበሩ
  choice: 被造
  rationale: 被动表达与前一分句的创造用语平行；中文避免机械重复“被制作”。
- source_word: ከዋክብተ ሰማይ
  choice: 天上的星辰
  rationale: 自然地保留“天／天空的星辰”这一属格关系，并维持庄重语体。
- source_word: ስሙ
  choice: 他的名
  rationale: 原文为阳性单数领属形式；不在本节中补入“蒙拣选者”或“人子”等解释性称号。
- source_word: ተጸውዐ
  choice: 被称呼
  rationale: 保留被动语态及“称名／宣称”之间的语义开放性，避免直接译成“被命名”或“被宣告”而收窄含义。
- source_word: በቅድመ
  choice: 在……面前
  rationale: 此处接“诸灵之主”，采用空间及宫廷临在意义比再次译作单纯时间性的“以前”更清楚；脚注保留“在……以前”的可能性。
- source_word: እግዚአ መናፈስት
  choice: 诸灵之主
  rationale: 作为《以诺一书·比喻篇》中反复出现的庄严称号，“诸灵之主”简洁，并自然表达复数“灵”。
theological_decisions:
- issue: “他的名”所指人物的身份
  choice: 仅保留“他的”，不在正文中加上人物称号
  alternative: 明确译为“蒙拣选者”或“人子”的名
  rationale: 上下文虽指向受尊崇的人物，本节自身却只使用阳性代词；保持隐含指代可避免把上下文解释写入正文。
- issue: 其名“被称呼”的时间及意义
  choice: 以“就已”突出其发生在天体受造以前，但不解释为完整的先存论命题
  alternative: 直陈该人物在创世以前已经实际存在
  rationale: 本节明确断言其名在创造以前被称呼，却没有在此直接说明该人物以何种方式存在；译文保留这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“受造”“诸灵之主”维持古代启示文学的语感；句法保留两个平行的“在……以前”分句，同时避免按英语旧译误把“征兆”并入“天上星辰”的短语。
