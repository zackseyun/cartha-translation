base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/002.yaml
  text: Know that the Most High remembers your destruction[c][b][a], and the angels of heaven rejoice over your destruction.
translation:
  language: zh_hans
  text: 你们要知道，至高者记得你们的毁灭[a]，天上的众天使也因你们的毁灭而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭”也可译作“败亡”或“倾覆”；原文在本节两次使用同一名词。
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙረ፡ ይከውን፡ ለክሙ
  choice: 你们要知道
  rationale: 该短语整体表达“让你们知道／你们当确知”的意思。译作“你们要知道”既自然直接，也保留审判宣告的郑重语气，不把 ይከውን 单独误解为某事“临到”听众。
- source_word: ልዑል
  choice: 至高者
  rationale: 这是启示文学中用于上帝的尊称；“至高者”是现代中文里庄重、清楚且通行的对应表达。
- source_word: ይዜከር
  choice: 记得
  rationale: 保留原文动词的直陈形式及现在时态所传达的确定性；上下文中的“记得”含有不忽略并将施行审判之意，但译文不额外明说。
- source_word: ሐጕልክሙ / ሐጕለ፡ ዚአክሙ
  choice: 你们的毁灭
  rationale: 该名词可指毁灭、败亡或倾覆。“毁灭”符合上下文的严厉程度，并能自然地用于原文两次重复之处，而不限定毁灭的具体方式。
- source_word: ይትፌሥሑ
  choice: 欢喜
  rationale: 原词明确表示喜乐。“欢喜”自然而庄重，保留其强烈含义，不弱化为“赞同”或“见证”。
- source_word: መላእክተ፡ ሰማይ
  choice: 天上的众天使
  rationale: 清楚保留“天／天上”与“天使”的属格关系及启示文学意象；“众”符合复数含义。
- source_word: ዲበ፡ ሐጕለ፡ ዚአክሙ
  choice: 因你们的毁灭
  rationale: 介词在此表示天使欢喜所关涉或所基于的事情。“因”在中文中自然，并保留天使针对听众毁灭而欢喜的直白、严峻表述。
theological_decisions:
- issue: 天上的众天使是否因恶人的毁灭而欢喜
  choice: 保留原文的直白含义：天上的众天使因听众的毁灭而欢喜。
  alternative: 将其缓和为天使只是“见证”或“认可”这场毁灭，或明确解释为他们仅因上帝的公义得彰显而欢喜。
  rationale: 吉兹文的喜乐动词明确，介词短语直接关联听众的毁灭。译文不为减轻现代读者的不适而弱化，也不加入原文未明说的神学解释，从而保留启示文学有意形成的张力。
- issue: “至高者记得”是否应解释为已经决定或即将施行审判
  choice: 保留“记得”的表达。
  alternative: 意译为“至高者必追讨”或“至高者已经定意毁灭你们”。
  rationale: 上下文虽明显带有审判意味，原文却使用“记得”。直译可保留神圣记念与审判执行之间的含蓄联系，避免把推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要知道”传达原文开头固定表达的郑重警告；两次保留“你们的毁灭”，以再现原文刻意的重复。
