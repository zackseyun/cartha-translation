base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/009.yaml
  text: And now let us do what we planned[a], for we have gathered silver, and we have filled our storehouses like water[d][c][b], and many are the laborers of our houses.
translation:
  language: zh_hans
  text: 现在，让我们去做我们所谋划的事[a]吧！因为我们积聚了银子，把我们的库房装得像水一样满[b]；我们家的农工也很多[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们所想的”或“我们所设计的”。原词既可指思想，也可指谋划。
    reason: lexical_alternative
  - marker: b
    text: “像水一样”是原文的直译，可能用来形容数量丰富或满溢，但这里保留原文的比喻。
    reason: cultural_note
  - marker: c
    text: “农工”原词主要指耕种者或农业劳动者；“我们家的”直译为“我们的房屋”，在这里也可能指家户或产业。
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግበር
  choice: 让我们实行
  rationale: 第一人称复数形式在此适合作劝勉语，表现富人彼此怂恿，要把计谋付诸行动。
- source_word: ዘኀለይነ
  choice: 所谋划的
  rationale: 原词兼有思想与谋划之意；上下文涉及有意而为的行动，故正文译作“所谋划的”，并以脚注保留较宽泛的可能。
- source_word: ብሩረ
  choice: 银子
  rationale: 保留原文具体的贵金属意象，不泛化为“钱财”。
- source_word: አስተጋባእነ
  choice: 积聚了
  rationale: 表达收集并累积财富的动作，也自然传达说话者夸耀财力的口吻。
- source_word: መዛግቲነ
  choice: 库房
  rationale: 该复数名词指储藏财物之处；汉语可用集合性名词“库房”，既自然又保留实体空间的意象。
- source_word: ከመ ማይ
  choice: 像水一样满
  rationale: 保留原文略显奇特的明喻，不将其直接解释为“满溢”或“极其丰足”。
- source_word: ሐራስተ
  choice: 劳工
  rationale: 该词可能特指耕作者或更广义的农业劳工；正文采用范围较宽的“劳工”，脚注说明其农业含义。
- source_word: አብያቲነ
  choice: 我们的家业中
  rationale: 字面为“我们的房屋”；在富有地主的语境中可涵盖家庭、产业或庄园。“家业”在现代汉语中兼顾所属产业与家户含义，又不武断限定为庄园。
theological_decisions:
- issue: 灾祸宣告语境中富人的口吻
  choice: 译为带有自我鼓动意味的夸耀之语
  alternative: 译作不带明显语气的普通意向陈述
  rationale: 第一人称复数的劝勉形式以及上下文对恶富者的谴责，共同形成傲慢、自恃的语气；感叹号仅显明原句的劝勉力度，不添加道德评语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。用“实行所谋划的”表现行动意图，用“积聚了银子”保留财富意象；“像水一样满”刻意保存原文不寻常的比喻。末句避免生硬的“我们房屋的农夫”，以“我们家业中的劳工”传达基本关系，同时用脚注保留“房屋／家户／产业”和“耕作者／劳工”的词义张力。
