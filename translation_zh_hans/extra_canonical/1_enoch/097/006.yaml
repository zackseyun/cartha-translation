base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/006.yaml
  text: And all the words of your lawlessness shall be read out before the Great Holy One[a], and your faces shall be put to shame[c][b], and every deed that is founded in lawlessness shall be rejected.
translation:
  language: zh_hans
  text: 有关你们悖逆之事的一切言词，都要在至大圣者面前被宣读[a]；你们的脸必蒙羞；一切以悖逆为根基的行为，都要被弃绝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “言词”也可译作“事情”“事项”或“罪状”；原词含义较宽。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作：“一切在悖逆中作出的行为，都要被丢弃。”原文动词似有“坚立、奠定”的意味，但确切含义不易断定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነበብ
  choice: 被宣读
  rationale: 该被动式在审判语境中带有公开读出、宣示的意味；“被宣读”既保留读出的动作，也体现公开审理的色彩。
- source_word: ኵሉ ነገረ
  choice: 一切……言词
  rationale: ነገር 可指言词、事情或事项；因其与“被宣读”搭配，“言词”最贴合本句意象，同时以脚注保留较宽泛的可能。
- source_word: ዓመፃክሙ
  choice: 你们……悖逆
  rationale: 此词可涵盖不法、强暴、不义及反叛性的恶；“悖逆”保留其针对神圣秩序的反抗意味，又不局限于肢体暴力。
- source_word: ቅድመ ዐቢይ ቅዱስ
  choice: 在至大圣者面前
  rationale: 按原文次序呈现这一神圣称号，不补入原文没有的并列连词；“至大圣者”在现代中文中庄重而可懂。
- source_word: ይትኀፈር ገጽክሙ
  choice: 你们必当面蒙羞
  rationale: 原文直涉及“你们的脸”与受羞辱；“当面蒙羞”自然保留脸面公开受辱的意象，又不加入原文没有的“遮盖”隐喻。
- source_word: ይገደፍ
  choice: 被弃绝
  rationale: 该词有丢弃、撇弃之意；在审判语境中，“被弃绝”兼具动作与裁决色彩，而不强化为毁灭。
- source_word: ተግባረ
  choice: 行为
  rationale: 指具体的作为或行径；“行为”在现代中文伦理与审判语境中清楚自然。
- source_word: ዘጸንዐ በዓመፃ
  choice: 以悖逆为根基的
  rationale: 动词含坚立、确立、稳固之意；“以……为根基”保留其强于泛泛“行在悖逆中”的结构性意味。
theological_decisions:
- issue: 神圣称号 ዐቢይ ቅዱስ 的译法
  choice: 至大圣者
  alternative: 伟大而圣洁者
  rationale: 原文没有连接“大”与“圣”的并列连词，故采用紧凑的称号式表达，既贴近原文顺序，也保留启示文学审判场景中的尊称语气。
- issue: ዓመፃ 的道德—司法含义
  choice: 悖逆
  alternative: 不法／强暴／不义
  rationale: 该词义域较宽，兼有违法、不义、暴行和反叛色彩；本节重在神前审判，“悖逆”较能承载其反抗神圣秩序的力度，但不把它限定为某一种罪行。
translation_notes:
  register: 采用现代、庄重而清楚的审判语体；句式保留原文三重并列结构。以“宣读”“蒙羞”“弃绝”呈现公开审判的推进，同时避免加入“脸被羞耻遮盖”等原文没有的隐喻。
