base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/003.yaml
  text: What will you do[a], you sinners, and where will you flee on that day of judgment[b], when you hear the voice of the prayer of the righteous?
translation:
  language: zh_hans
  text: 罪人哪，在那审判之日，当你们听见义人祷告的声音[a]时，你们将怎么办？又要逃到哪里去？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“声响”或“话语”。吉兹语原词的含义范围包括声音、声响和话语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንተ፡ ትገብሩ
  choice: 你们将怎么办
  rationale: 疑问词与未完成式复数动词在本段灾祸与审判语境中具有将来指向；“将怎么办”保留迫近审判所带来的诘问语气。
- source_word: ኃጥኣን
  choice: 罪人哪
  rationale: 原文是直接称呼；用“哪”自然地呈现庄重而正面的先知性斥责。
- source_word: አይቴ፡ ትጐይዩ
  choice: 要逃到哪里去
  rationale: 该动词表示急速行动；审判语境中的“逃”准确传达企图躲避灾祸的意味。
- source_word: በይእቲ፡ ዕለት፡ እንተ፡ ጽነፄ
  choice: 在那审判之日
  rationale: 把时间短语自然译出，并以“审判”表达该名词在此处惩罚性清算的司法—末世意味，同时不细化为定罪或刑罚。
- source_word: ሶበ፡ ትሰምዑ
  choice: 当你们听见……时
  rationale: 保留时间从句及其将来语境，在现代汉语中无需另加显式将来标记。
- source_word: ቃለ፡ ጸሎቶሙ፡ ለጻድቃን
  choice: 义人祷告的声音
  rationale: ቃለ 可指声音、声响或话语；与“祷告”连用时，“声音”既自然，又保留祷告作为有声呼求而被听见的意象。“义人”对应原文实词化复数。
theological_decisions:
- issue: 审判场景中义人祷告的含义
  choice: 罪人听见义人的祷告之声，这是审判之日处境逆转的一部分。
  alternative: 罪人听见义人本身的呼喊，或该短语泛指义人的控诉与见证。
  rationale: 原文明确出现“祷告”，因此按字面保留义人向天呼求公义的图景，不把它解释成特定的控告公式或后来的神学表达。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“罪人哪”保留直接呼告；调整时间成分的位置，使长句符合汉语表达习惯，同时维持原文两个连续诘问的力度。
