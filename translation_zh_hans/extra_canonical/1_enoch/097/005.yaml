base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/005.yaml
  text: And in those days the prayers of the holy ones will reach the Lord[b][a], and the days of your judgment will come upon you.
translation:
  language: zh_hans
  text: 在那些日子，圣者[a]的祈祷必上达于主；你们受审判的日子也必临到你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣徒”。原文直译为“圣者”；这里较可能指忠信的义人，但也可能有更广的含义。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾在这一文本见证中较难确定；大意可能是说，受话者遭受清算或惩罚的日子即将来到。
    reason: textual_variant
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留启示文学中常见的时间公式及“日子”的反复意象，不泛化为“那时”。
- source_word: ትበጽኅ ጸሎቶሙ
  choice: 祈祷必上达
  rationale: 动词表示到达某一目的地；“上达”在现代庄重汉语中自然呈现祈祷抵达主面前的意象。
- source_word: ለቅዱሳን
  choice: 圣者的
  rationale: “圣者”较直接地保留原词含义，也避免“圣徒”可能带入的后期教会专称；其所指仍可包括义人或更广义的圣者。
- source_word: ኀበ እግዚእ
  choice: 于主
  rationale: 结合“上达”表达朝向主的方向，简洁而庄重。
- source_word: ይበጽሕ መዋዕለ ኵነክሙ
  choice: 你们受审判的日子也必临到你们
  rationale: 末句抄本措辞困难；按本章对恶人的警告语境，以“受审判”表达将临的司法性清算，同时不具体限定为毁灭或刑罚。
theological_decisions:
- issue: ቅዱሳን 所指的身份
  choice: 正文译作“圣者”，保留可指受苦义人或忠信者的开放性
  alternative: 明确译作“圣徒”、天使，或兼指天上与地上的圣者
  rationale: 上下文较可能指祈求蒙垂听的义人，但原词本身并未在此明确排除其他圣者，故不在正文中消除歧义。
- issue: 末句所指的灾罚性质
  choice: 译作“受审判的日子”
  alternative: “毁灭的日子”或“受惩罚的日子”
  rationale: 本段的祸哉语境显示这是针对受话恶人的不利清算；“审判”保留司法与启示文学色彩，又不把结果过度具体化。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“必上达于主”保留祈祷抵达主那里的空间意象；“临到你们”保持警告的迫近感。脚注标记均置于对应正文之后。
