base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/008.yaml
  text: Woe to you who acquire silver and gold not by righteousness[a], and say, ‘We have become rich with wealth, and we have acquired possessions[c][b], and we have acquired everything we desired.’
translation:
  language: zh_hans
  text: 你们这些以不正义的手段取得金银的人有祸了！[a] 你们说：“我们靠财富富足了，也有了财物，并且得到了我们所想要的一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们这些取得金银却不合正义的人有祸了！”这句话既可着重指取得财富的方式，也可较宽泛地指这种所得不合正义。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: 有祸了
  rationale: 保留先知性谴责和审判宣告的力度；现代中文圣经语体中自然、庄重。
- source_word: ታጠርዩ / አጥረይነ
  choice: 取得／得到了
  rationale: 两处同源动词均用“得”义表达，以保留原文首尾呼应；同时按中文时态和搭配分别处理为“取得”与“得到了”。
- source_word: ብሩረ ወወርቀ
  choice: 金银
  rationale: 准确保留两种贵金属，并采用自然的现代汉语固定次序。
- source_word: ዘአኮ በጽድቅ
  choice: 不用正义的手段
  rationale: 表达财富取得方式不合正义，同时保留ጽድቅ的伦理内涵，不弱化为泛泛的“不正当地”。
- source_word: ብዕልነ ብዕለ
  choice: 我们靠财富富足了
  rationale: 保留“财富／富足”的词根重复和达到富足状态的夸耀语气。
- source_word: ወኮነ ለነ ንዋይ
  choice: 也有了财物
  rationale: 完整译出先前曾被遗漏的独立分句，按原文表达财物归他们所有。
- source_word: ኵሎ ዘፈቀድነ
  choice: 我们所想要的一切
  rationale: 保留夸口中的全称范围和欲求含义，中文清楚自然。
theological_decisions:
- issue: 谴责不合ጽድቅ的财富获取
  choice: 正义
  alternative: 正直／公义
  rationale: 此处直接涉及取得财富的方式，“正义”较清楚地传达社会伦理层面，同时不排除更广的道德含义；脚注保留另一种句法理解。
translation_notes:
  register: 采用现代、庄重而通俗的审判宣告语体。保留原文三重夸耀：因财富而富足、有了财物、得到所欲的一切；避免遗漏中间分句，也不把三句合并。
