base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/007.yaml
  text: Woe to you[a], sinners, who are in the midst of the sea and upon the dry land[b], whose memory is evil against you.
translation:
  language: zh_hans
  text: 你们这些身在海中和旱地上的罪人有祸了！[a]关于你们的记念，对你们是恶的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海中”和“旱地上”的并列很可能是涵盖性的说法，表示无论罪人身处何处，都逃不过这宣告。
    reason: cultural_note
  - marker: b
    text: 末句原文难解；“记念”可指关于他们的记忆、所留的纪念或名声。此句也可理解为“关于你们的记念是恶的”“你们留下的是恶名”，或“恶的记念附着于你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: 你们……有祸了
  rationale: 保留先知性、启示文学式的审判宣告；比“可悲啊”更能传达谴责与灾祸临近的语气。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 直接保留原文对受审判群体的道德称谓，不作弱化或扩写。
- source_word: ማእከለ፡ ባሕር፡ ወዲበ፡ የብስ
  choice: 无论身在海中，还是在旱地上
  rationale: 保留“海中—旱地上”的空间对举，同时用现代汉语自然呈现其涵盖各处的修辞效果。
- source_word: ዝክርሙ
  choice: 对你们的记念
  rationale: “记念”可涵盖对某人的记忆、名声或留存的纪念，较能保留原词在记忆与纪念记录之间的歧义。
- source_word: እኩይ
  choice: 恶的
  rationale: 采用直接而庄重的道德判断用语，与审判语境相称。
- source_word: ዴቤክሙ
  choice: 对你们
  rationale: 该词形及句法困难；译为“对你们”保留不利于受话者的指向，却不进一步断定是“控告你们”还是“附着于你们”。
theological_decisions:
- issue: 末句“记念”与受审判者之间的关系
  choice: 对你们的记念都是恶的
  alternative: 你们留下的是恶名／恶的记念附着于你们／关于你们的记念是恶的
  rationale: 吉兹语末句在词汇和句法上均有困难。正文保留“记念”及其不利指向，不把它明确解释为名誉、审判记录或某种附着之物，从而保存原文的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“有祸了”保留启示文学的审判语气；末句略带陌生感，是为保存原文真实的词义与句法歧义。
