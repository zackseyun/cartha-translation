base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/001.yaml
  text: Trust[a], you righteous, for sinners will become a disgrace[b], and they will perish on the day of iniquity.
translation:
  language: zh_hans
  text: 义人哪，你们要信靠[a]，因为罪人必受羞辱，并将在不义之日灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“相信”“要有信心”。原文没有明说信靠的对象。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ተአመኑ
  choice: 要信靠
  rationale: 这是复数命令式，可表达相信、倚赖或坚定信心；“信靠”保留其信仰与信心两方面的含义，同时不补出原文未明说的对象。
- source_word: ጻድቃን
  choice: 义人哪
  rationale: 保留复数呼语的直接劝勉语气，并采用现代中文宗教与伦理语境中自然、庄重的表达。
- source_word: ለጽእለት ይከውኑ
  choice: 必蒙羞
  rationale: 原短语表达罪人将落入羞耻、受人蔑视的结局；“必蒙羞”在中文中自然地传达这种审判性结果，避免生硬直译为“成为羞辱”。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 保留本节中与“义人”相对的道德和末世审判称谓。
- source_word: ወይትሐጕሉ
  choice: 并要……灭亡
  rationale: 该词源于表示毁灭、灭亡的词根；结合下一节相关名词的用法，应译为“灭亡”，而非“被交出去”。
- source_word: በዕለተ ዓመፃ
  choice: 在不义之日
  rationale: ዓመፃ 在这里指不义、悖逆或不法；“不义之日”保留原文的末世性表述，又不把含义缩窄为肉体暴力。
theological_decisions:
- issue: 开头的命令是一般性的振作，还是明确以神为对象的信靠
  choice: 要信靠
  alternative: 要相信；要有信心；要刚强
  rationale: 原文没有明说信靠的对象。“要信靠”既适合审判语境中的宗教信心，也保留对象未明的张力，不擅自补入“神”。
- issue: 罪人的结局是被交付审判，还是灭亡
  choice: 灭亡
  alternative: 被交出去；被降卑
  rationale: 词形及相邻经文中的同根词支持“灭亡／被毁灭”；此处依词汇证据直译，不另行构造司法交付的神学意象。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“义人哪”保留呼语力度；全句维持劝勉与审判并置的启示文学语气。
