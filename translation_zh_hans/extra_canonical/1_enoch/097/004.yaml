base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/004.yaml
  text: 'And you will become like them[d][c][b][a], against whom this word will be a witness: ‘You have become companions of sinners.’'
translation:
  language: zh_hans
  text: 而你们必变得像他们；这话必成为控告他们的见证[a]：“你们已经成了罪人的同伴。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这话必成为反对他们的见证。”原文此处“他们”与随后引语中的“你们”之间的人称关系并不完全明确。
    reason: textual_ambiguity
  - marker: b
    text: “罪人的同伴”也可译作“与罪人为伴的人”或“罪人的伙伴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ትከውኑ
  choice: 必变得
  rationale: 该复数动词表达将来成为某种状态；“必变得”既保留将来意味，也传达进入某种状态的警告语气。
- source_word: ከማሆሙ
  choice: 像他们
  rationale: 自然、简洁地表达比较关系，不额外界定“他们”的身份。
- source_word: ሰማዕተ ይከውን
  choice: 必作证
  rationale: 将ሰማዕተ按“见证、证词”理解，而非“被听见”；与ይከውን连用，表达“将成为见证”。
- source_word: ዴቤሆሙ
  choice: 控告他们
  rationale: 该介词结构在作证语境中可表达不利于、针对某人；“控告”呈现其司法性力量，但以脚注保留较宽的“作证反对”表达。
- source_word: ዝንቱ ነገር
  choice: 这话
  rationale: ነገር可指话、言论或事情；此处作为见证内容，“这话”在中文中简洁自然。
- source_word: ሱቱፋነ
  choice: 同伴
  rationale: 表达共同参与或结伴关联，保留道德上的连带意味，而不引入技术性神学概念。
- source_word: ኮንክሙ
  choice: 你们已经成了
  rationale: 完成式形态强调已进入并处于该状态；“已经成了”也与前句“必变得”形成呼应。
- source_word: ለኃጥኣን
  choice: 罪人的
  rationale: 在“同伴”之后采用领属式中文最顺畅；也可能理解为“与罪人为伴”，故以脚注说明。
theological_decisions:
- issue: 警告的性质
  choice: 听众将变得与受控告者相像，而这话以他们成为罪人同伴这一事实作证控告
  alternative: 只是在断言听众本身已是罪人，或是不强调关联关系的纯司法宣告
  rationale: 经文同时突出“变得像他们”、见证控告和与罪人结伴；译文保留道德关联与审判语气，不扩展成经文本身未陈述的完整教义。
- issue: “他们”与“你们”的指称张力
  choice: 保留原文第三人称“他们”以及引语中的第二人称“你们”
  alternative: 将二者统一为同一人称，使句法更顺滑
  rationale: 原文表面的人称转换可能源于引述结构或文本困难；不宜在正文中擅自消除这一真实歧义。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“必作证控告”保留原文的司法语气；分号使警告、见证和引语之间的关系清楚，同时不消除原文的人称张力。
