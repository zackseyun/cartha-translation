base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/001.yaml
  text: And now[a], my son, I have shown you everything[b], and the order of all the stars of heaven has been completed.
translation:
  language: zh_hans
  text: 如今，我儿，我已将一切指示给你；天上所有星辰的秩序也已完成。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里也可理解为：“天上所有星辰的秩序，至此已经讲述完毕”；或译：“天上所有星辰的秩序已经成全。”原文既可让人想到这番启示已经讲完，也可指天体秩序本身得以完成。
    reason: 保留“完成”所指对象的歧义
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 如今
  rationale: 作为承接并转入总结的语篇标记，简洁自然地保留“现在/此刻”的意思。
- source_word: ወልድየ
  choice: 我儿
  rationale: 保留启示性教导中的父子称谓；比“我的儿子”更符合庄重而自然的汉语直接称呼。
- source_word: ኵሎ
  choice: 一切
  rationale: 作“指给你看”的宾语，表达所启示内容的完整性，同时避免生硬的“所有事物”。
- source_word: አርአይኩከ
  choice: 我已把……指给你看了
  rationale: 准确表达“使你看见、展示给你”的启示语境；“已……了”体现此处的总结意味。
- source_word: ተፈጸመት
  choice: 已完成
  rationale: 保留原文的完成式和被动/状态色彩，不直接改写为“我已讲完”，从而不消除究竟是讲述完成还是天体规序得以成全的歧义。
- source_word: ሥርዓተ
  choice: 规序
  rationale: 兼具秩序、安排和既定规则之意，适合本书天文段落的语境，也比单用“秩序”更能传达有规则的体系。
- source_word: ኵሉ ከዋክብተ ሰማያት
  choice: 天上所有星辰
  rationale: 让“所有”明确修饰“星辰”，避免把同一个全称词重复译成“全部规序”和“所有星辰”。
theological_decisions:
- issue: 末句是指有关星辰规序的启示已经讲完，还是指星辰规序本身已经完成
  choice: 正文保留“规序也已完成”的原文结构
  alternative: “天上所有星辰的规序，我也已讲述完毕”或“天上所有星辰的规序也已成全”
  rationale: 上文“我已把一切都指给你看了”支持讲述告一段落的理解，但原文没有明说“讲述”。直译式表达并以脚注说明，可保留原文真实的语义张力，而不把它单一化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我儿”保留智慧教导式称呼；“规序”用于呈现天体有规则的秩序体系。分号体现前后两句紧密相连的总结关系。
