base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/004.yaml
  text: And the waning that is done in the first gate in its season until one hundred and seventy-seven days are completed—by the reckoning of weeks, twenty-five and two days.
translation:
  language: zh_hans
  text: 在它的时节，月亮在第一道门内逐渐亏缺，直到一百七十七天满了；按周计算，就是二十五周零两天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታሕጻጼት
  choice: 逐渐亏缺
  rationale: 该词在本段天文语境中指月亮的亏减；译作“逐渐亏缺”既保留过程性，也符合现代汉语表达。
- source_word: ቀዳሚት
  choice: 第一道门
  rationale: 原文为序数“第一”，结合《以诺一书》天文篇中天体出入之“门”的术语语境补出量词“道”。
- source_word: በዘመኑ ዚአሁ
  choice: 在它的时节
  rationale: 贴近原文“在它自己的时节/时期”，保留代词所指可能涉及该门或这一运行阶段的轻微含混。
- source_word: እስከ ይትፌጸም መዋዕል ፻ወ፸ወ፯
  choice: 直到一百七十七天满了
  rationale: 直译完成式表达，用自然汉语呈现该时段达到总数。
- source_word: በ፶፬ ሥርዓተ ሰንበት *፳ወ፭ ወ፶፮ ክልኤቱ መዋዕል
  choice: 按周计算，就是二十五周零两天
  rationale: 传抄文本中的数字行存在明显复杂性，但上下文及一百七十七天的算术对应为二十五周加两天；正文采用可理解且与总数一致的读法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的天文叙述语体。“月亮”依据上下文明确补出，避免汉语中无主语造成晦涩；“逐渐亏缺”比机械的“亏缺被做成”自然，同时不引入神学解释。
