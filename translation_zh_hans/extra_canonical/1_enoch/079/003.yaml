base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/003.yaml
  text: And the moon wanes[a], which takes place through the sixth gate; for in this sixth gate its light is completed[c][b], and from it comes the beginning of the waning.
translation:
  language: zh_hans
  text: 月亮渐亏[a]，这过程经由第六道门发生；因为它的光在这第六道门中达到圆满，由此开始亏缺[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“月亮经由第六道门渐亏。”原文的表达带有按既定过程运行的意味，不只是对所见月相的描述。
    reason: lexical_alternative
  - marker: b
    text: “开始亏缺”直译为“亏减之首”，意思是月亮亏减的开端。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሐጸጸ ወርኅ
  choice: 月亮渐亏
  rationale: ሐጸጸ是表示减少、亏缺的简单动词；“渐亏”自然表达月相由盈转亏的过程，又不把它改写成现代天文学术语。
- source_word: ዘይትገበር በሳድስት ኆኅት
  choice: 这过程是经由第六道门发生的
  rationale: ይትገበር在这里表示某事发生或成就；介词በ与“门”连用，保留天体经由门户运行的宇宙图景。
- source_word: ይትፌጸም ብርሃኑ ዚአሁ
  choice: 它的光……达到圆满
  rationale: ይትፌጸም表示完成或达到完满程度；“达到圆满”既对应光的完成，也契合月亮盈满的语境。
- source_word: እምኔሁ
  choice: 从那里
  rationale: 该词意为“从它／从那里”，在本句中最自然地回指刚提到的第六道门，同时保留空间性的门户意象。
- source_word: ርእሰ ታሕጻጼት
  choice: 开始亏减
  rationale: 字面为“亏减之首”；“开始亏减”用现代汉语准确表达起点或开端之意。
theological_decisions:
- issue: 是否将门户和程序性的天体运行语言改写为现代月相说明
  choice: 保留“经由第六道门发生”以及光在门中“达到圆满”的启示文学图景
  alternative: 仅意译为月亮盈满之后开始亏缺
  rationale: 原文以门户和有秩序的过程描写天体运行；保留这些意象可避免用现代宇宙观取代文本自身的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“渐亏”“达到圆满”“开始亏减”保持本节月相过程的连续性；“第六道门”保留原文启示文学的宇宙门户意象。
