base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/002.yaml
  text: And he showed me all their ordinances—those for every day and every season[a], and for every year, and for its going out and its command[c][b], in every month and every sabbath.
translation:
  language: zh_hans
  text: 他又把它们的一切定例指给我看：关于每日、每个有权柄的时节[a]、每年，以及它的出行和它的命令[b]，也关于每月和每个安息日[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有权柄的时节”所对应的原文结构较难，亦可理解为“每个受权柄支配的时期”。转录中夹入的数字是版面行号，不是“三百六十五”。
    reason: textual_variant
  - marker: b
    text: 原文直译作“它的出行和它的命令”；两个“它”都是单数，但具体指什么并不完全明确。“命令”也可理解为给它规定的秩序。
    reason: ambiguity
  - marker: c
    text: “安息日”在这里也可能泛指“一周”；正文保留原词较直接的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአርአየኒ
  choice: 他又……指给我看
  rationale: 动词表示使人看见、展示；用现代汉语常见的异象叙述表达，不强化为专门的“启示”术语。抄本转录中动词前的፴是行号30，不属于正文。
- source_word: ኵሎ ሥርዓቶሙ ለእሉ
  choice: 这一切的全部定例
  rationale: ሥርዓት在天文历法语境中指固定的秩序、规程或定例；“定例”兼顾规定性与宇宙运行秩序。ለእሉ所指对象承接上文，因此译为“这一切的”。
- source_word: በኵሉ ዕለት
  choice: 每日的
  rationale: 保留逐项列举的时间范围，同时使中文句式简洁自然。
- source_word: በኵሉ ዘመን ዘበሥልጣን
  choice: 每个掌权时节的
  rationale: ዘመን可指时间、时期或时节，ሥልጣን表示权柄、统辖。译文保留“时节”与“掌权”的搭配，不擅自补出具体天数。转录中的፴፭是行号35，并非数字365。
- source_word: በኵሉ ዓመት
  choice: 每年的
  rationale: 直接表达逐年适用的历法范围，并与前面的“每日的”“每个……时节的”形成并列。
- source_word: ወበሙጻኡ
  choice: 以及它的出行
  rationale: 词根本义为出去、出现；第三人称阳性单数后缀译作“它的”。“出行”保留天体升起、显现或运行出去等可能含义。
- source_word: ወበትእዛዙ
  choice: 和它所受的命令
  rationale: ትእዛዝ可指命令或规定，后缀为第三人称阳性单数。“所受的命令”使中文可懂，并保留天体依命运行的权威意味；正文没有把它弱化为纯粹自然规律。
- source_word: በኵሉ ወርኅ
  choice: 遍及每月
  rationale: 表达这些定例或命令在各月中的适用范围；“遍及”帮助中文连接后置的时间短语。
- source_word: በኵሉ ሰንበት
  choice: 每个安息日
  rationale: ሰንበት字面为安息日，也可能在历法列举中泛指一周；正文保留其宗教和历法色彩，另以脚注说明。转录中的፵是行号40。
theological_decisions:
- issue: ሰንበት应译作“安息日”还是“一周”
  choice: 安息日
  alternative: 每周／每一周
  rationale: 原词明确保有安息日含义，而历法语境又容许“周”的理解。正文采用较贴近词面的“安息日”，脚注保存另一可能，避免消除宗教与历法之间的张力。
- issue: 是否把转录中的፴፭解释为365
  choice: 视为页边行号35，不译入正文
  alternative: 三百六十五／在三百六十五的权下
  rationale: 同一段转录在动词前有፴、在末项前有፵，显示这些数字依次是Charles版的行号30、35、40；把፴፭当作正文会误造365，也与以诺一书天文历法部分的364日结构产生严重冲突。
- issue: “它所受的命令”所指对象
  choice: 保留单数代词“它”，不明说具体先行词
  alternative: 众天体所受的命令／这一年的规定
  rationale: 两个相关名词的后缀均为第三人称阳性单数，但其具体所指在句法上不完全明确。译文保留单数和指代张力，不替原文确定为太阳、年份或全体天体。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以冒号呈现原文的历法项目清单。重复结构适度压缩为汉语定语并列，但保留“每日—时节—每年—每月—安息日”的层次。对转录行号、单数后缀和困难的权柄短语采取透明处理，不依据旧英文层擅自补入365。
