base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/031.yaml
  text: And after that[a], those three clothed in white who had taken me by the hand, who had brought me up before, and the hand of that ram holding me[c][b], brought me up and set me down in the midst of those sheep before the judgment took place.
translation:
  language: zh_hans
  text: 此后[a]，那三个身穿白衣、曾拉着我的手并先前带我上去的，和那只正拉着我的公绵羊的手[b]，一同把我带上去，安置在那些羊中间[c]；那时审判尚未发生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “此后”按时间性惯用语翻译；这里不是“从他们中间”的意思。
    reason: textual_variant
  - marker: b
    text: 抄本转写中的词形可能源于视觉讹误；校勘后可读作“公绵羊”。原文将“那三个白衣者”与“那只公绵羊的手”并列为带领者，句法较为生硬；此处保留这一张力，不把象征形象的身份具体化。
    reason: textual_variant
  - marker: c
    text: “那些羊”延续本异象以动物代表人群的象征叙述；正文保留原有形象，不直接说明其所指。
    reason: cultural_note
lexical_decisions:
- source_word: ወእምኔሁ
  choice: 此后
  rationale: 按时间性惯用语理解为“此后、在那以后”，不译成“从他们中间”。
- source_word: እልኩ ፫እለ ይለብሱ ጸዓዳወ
  choice: 那三个身穿白衣的
  rationale: 保留数词所指对象未明的特点，不擅自补作“人”或“天使”；衣着动词与白色合译为自然的现代汉语。
- source_word: አኃዙኒ በእዴየ
  choice: 拉住我的手
  rationale: 表达牵引和引导，避免“抓住”可能带来的强暴色彩。
- source_word: እለ ቀደሙ አዕረጉኒ
  choice: 曾……把我带上去
  rationale: 将ቀደሙ理解为先前、此前；重复的上升动词保留为“带上去”。
- source_word: እዴሁ ለውእቱ ዴቤላ እንዘ ትእኅዘኒ
  choice: 那只公绵羊那只仍拉着我的手
  rationale: 依据校勘所指出的OCR讹误，将ይቤላ还原理解为ዴቤላ“公绵羊”；同时保留原文笨拙而有歧义的“手”作并列施事的结构。
- source_word: አዕረጉኒ ወአንበሩኒ
  choice: 把我带上去，安置
  rationale: 分别呈现上升与安置两个动作；“安置”兼容使坐下或放置之义。
- source_word: ማእከሎሙ ለዝኩ አባግዕት
  choice: 在那些羊群中间
  rationale: 保留《动物异象》的羊群意象，不在正文中解释其象征对象。
- source_word: እንበለ ትኩን ኵነኔ
  choice: 那时审判尚未开始
  rationale: 按“审判发生以前”的时间意义表达，避免把它扩展成特定教义公式。
theological_decisions:
- issue: 三个白衣者的身份
  choice: 仅译为“那三个身穿白衣的”
  alternative: 三个天使；三个男人
  rationale: 所给吉兹语没有明确指出其类别，因此不作神学身份判定。
- issue: 公绵羊的身份与作用
  choice: 保留为象征形象“那只公绵羊”，不解释其所代表者
  alternative: 在正文中认定为某一历史人物或末世人物
  rationale: 动物异象中的象征指向不应在本节正文中被强行锁定；原文只呈现其拉着以诺的手。
- issue: 末句的时间关系
  choice: 译作“那时审判尚未开始”
  alternative: 直到审判来到；在审判以前
  rationale: 呈现审判即将发生的叙事时序，同时不引入后世系统神学措辞。
- issue: 并列施事的语法张力
  choice: 保留“三个白衣者”与“公绵羊的手”共同作为带领者的生硬结构
  alternative: 改写成公绵羊单独带领，或把“手”从并列结构中删除
  rationale: 原文句法困难，不应借流畅化而悄然消除其歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文刻意保留原文并列结构的一定生硬感，以呈现文本传承和句法上的真实困难；不补入“天使”等身份说明，也不解开羊群与公绵羊的象征所指。
