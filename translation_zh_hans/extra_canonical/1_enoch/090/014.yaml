base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/014.yaml
  text: And I saw until that man came[a], the one who had written down the names of the shepherds, and he brought them up before the Lord of the sheep; and he helped him and rescued him[c][b], and he showed him everything concerning the downfall of his helper.
translation:
  language: zh_hans
  text: 我观看，直到那个人[b]来了，就是那位曾记下众牧人名字的人；他把他们带到群羊之主面前。他帮助那只公绵羊，救了它，又把那只公绵羊的援助者降临的全过程指给它看[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句在现存埃塞俄比亚文本中艰涩。“降临”也可译为“下降”；短语的具体句法关系并不完全确定。此处按较直接的理解，译为那只公绵羊的援助者降临的全过程。
    reason: textual_variant
  - marker: b
    text: 这人是本异象审判场景中先前记下众牧人名字的记录者；原文仍称他为“人”。
    reason: cross_reference
lexical_decisions:
- source_word: ብእሲ
  choice: 人
  rationale: 该词通常指男性或男人；异象语境虽暗示他是天上的执行者，正文仍保留原文具体而未加解释的称呼。
- source_word: ዘጸሐፈ፡ አስማቲሆሙ፡ ለኖሎት
  choice: 曾记下众牧人名字的人
  rationale: 用“曾”体现这是先前完成、用来辨认此人的行动；“记下”保留记录和审判场景的意味。
- source_word: ያዐርግ፡ ቅድሜሁ፡ ለእግዚአ፡ አባግዕ
  choice: 把他们带到群羊之主面前
  rationale: 动词本有带上去之意，此处重在把名单所涉及的牧人呈到审判者面前；“群羊之主”保留异象中反复出现的神圣称号。
- source_word: ረዳኦ፡ ወአድኃኖ
  choice: 帮助……救了
  rationale: 分别表达援助与解救两个相连却不同的动作，不把二者合并为单一神学术语。
- source_word: ይቤላ
  choice: 公绵羊
  rationale: 该名词指公羊；明译可避免把它误当成“为此目的”等短语，也与上下文中的领袖形象衔接。
- source_word: ኵሎ፡ መራደ፡ ለረዳኢቱ
  choice: 有关……援助者败落的一切
  rationale: 依现有传本和最近校订采取“败落”读法，但该短语语义与句法均不稳，因此正文保持较宽泛的“有关……的一切”，并在脚注列出可能的“降临/介入”理解。
theological_decisions:
- issue: “那个人”的身份和地位
  choice: 正文只称“那个人”
  alternative: 那位天使；那位天上的书记
  rationale: 原文用“人”，虽然异象整体表明他是天上的记录者，正文不进一步界定其本体身份。
- issue: 群羊之主这一称号
  choice: 群羊之主
  alternative: 羊群的主人
  rationale: 该称号在动物异象中指向神；“主”既自然，也保留其庄重和神学分量。
- issue: 公绵羊与代词的所指
  choice: 明确译出“那只公绵羊”
  alternative: 只用“他/它”
  rationale: 末尾的 ይቤላ 明指公羊。明确译出可减少连续阳性代词造成的混淆，同时不进一步断定公羊象征的历史人物。
- issue: 末句所述事件
  choice: 援助者的败落
  alternative: 援助者的降临、下降或介入
  rationale: 传本文句艰涩，不能确定所指究竟是败落还是援助者的下降/介入；正文采用经校订的读法，脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“群羊之主”作为异象中的固定称号保留；以“公绵羊”区别于泛称的羊群。末句不强行消除传本文本的歧义，而用脚注明示另一种主要读法。
