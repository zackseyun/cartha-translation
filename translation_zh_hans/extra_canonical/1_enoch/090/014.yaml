  naturalness: 现有译文总体庄重通顺，但“把有关那只公绵羊的援助者败落的一切都指给它看”在现代汉语中生硬，且“援助者败落”语义不清。改为“把那只公绵羊的援助者降临的全过程指给它看”较自然，同时保留异象叙事的正式语体。
  terminology: “群羊之主”“牧人”“公绵羊”均可保留。“人”不宜在正文改作“天使”或“天上的记录者”。脚注可说明其在异象中先前的记录行为，但不应把这一解释当作正文所明说的身份。
