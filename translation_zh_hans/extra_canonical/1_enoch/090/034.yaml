base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/034.yaml
  text: And I saw until they laid aside that sword which had been given to the sheep[a], and they brought it into the house and sealed it before the face of the Lord; and all the sheep were summoned into that house[e][d][c][b], and it did not contain them.
translation:
  language: zh_hans
  text: 我观看，直到他们把赐给群羊的那把剑放下，又把剑带进那座房子，在主面前封存起来[a]。所有的羊都被召进那座房子[b]，房子却容纳不下它们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在主面前”直译为“在主的面容之前”，意思是在主的临在中。
    reason: lexical_alternative
  - marker: b
    text: 这里原文只说“房子”；在这异象中，它可能令人联想到圣殿或末世中上帝子民的居所。
    reason: cultural_note
  - marker: c
    text: 原文末句的主语没有明说，按最近的先行词理解为那座房子；直译为“它没有容纳它们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሰከብዎ
  choice: 放下
  rationale: 该动词本义为使之躺下、将之放置；以剑为宾语时，“放下”既贴近字面，也不额外断定这是永久弃绝武器。
- source_word: ሰይፍ ዘተውህበ ለአባግዕ
  choice: 赐给群羊的那把剑
  rationale: 保留具体的“剑”和被动赐予关系；“群羊”兼顾复数群体与异象中持续的动物意象。
- source_word: አግብእዎ ውስተ ቤት
  choice: 把剑带进那座房子
  rationale: 动词表达带入；重复“剑”以消除汉语代词可能指向群羊的歧义，不加入原文没有明确表达的“带回”。
- source_word: ኀተማ እምቅድመ ገጹ ለእግዚእ
  choice: 在主面前封存起来
  rationale: “在主面前”自然传达“在主的面容之前”这一闪语式临在表达；“封存起来”说明剑被封闭保管，又不扩展其象征意义。
- source_word: ተጸውዑ
  choice: 都被召进
  rationale: 保留被动与正式召集的语气，并按上下文自然表达进入房子。
- source_word: ወኢያገምሮሙ
  choice: 房子却容纳不下它们
  rationale: 直接表达动词“容纳”的否定含义；明说“房子”以澄清主语，但不改变其最自然的近接先行词。
theological_decisions:
- issue: 异象中“房子”的象征所指
  choice: 那座房子
  alternative: 圣殿／上帝子民末后的居所
  rationale: 原文只说“房子”。正文保留异象本身，不把可能的圣殿或末世意义直接写入译文。
- issue: ለእግዚእ 的称号译法
  choice: 主
  alternative: 主人／主宰
  rationale: 译出称号而非音译；“主”符合庄严的异象语境，同时不引入后期特定的基督论认定。
- issue: 末句主语及含义
  choice: 房子却容纳不下它们
  alternative: 它不足以容纳它们
  rationale: 最近的先行词是房子，且动词直接表示容纳；明确主语有助于现代汉语理解，但仍以脚注承认句法上的隐含。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以短句缓解原文连续并列结构的负担；保留“剑、群羊、房子”等启示文学意象，不在正文中解码象征。所有脚注标记均置于相关正文位置。
