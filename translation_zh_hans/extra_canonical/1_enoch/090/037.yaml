base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/037.yaml
  text: And I saw that a white bull was born[a], and its horns were great[c][b]; and all the beasts of the field and all the birds of heaven feared it and entreated it at all times.
translation:
  language: zh_hans
  text: 我看见一头白公牛[a]出生了；它的角很大；田野的一切走兽和天空的一切飞鸟都惧怕它，并且时时向它恳求[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 白公牛是《动物启示录》中的象征形象；本译文保留这一形象，不在正文中指明它所代表的身份。
    reason: cultural_note
  - marker: b
    text: “恳求”也可译作“央求”或“祈求”；原词表达谦卑而强烈的请求。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተወልደ
  choice: 诞生了
  rationale: 该词是被动出生用语；汉语用“诞生了”自然地表达异象中这头公牛的出生，又不增添其来历或身份。
- source_word: ላህም ጻዕዳ
  choice: 一头白公牛
  rationale: 保留雄性牛与白色的具体意象；其后提到角，也支持译作“公牛”而非泛称“牛”。
- source_word: አቅርንቲሁ ዐበይት
  choice: 它的角很大
  rationale: 直译角的形体与显著性，不把“大”解释为军事能力或王权。
- source_word: አራዊተ ገዳም
  choice: 田野的一切走兽
  rationale: 保留原文的野外动物类别，并采用现代中文圣经语体中清楚而庄重的表达。
- source_word: አዕዋፈ ሰማይ
  choice: 天空的一切飞鸟
  rationale: “天空”准确传达ሰማይ在此处所指的空中领域；“飞鸟”符合现代汉语表达。
- source_word: ይፈርህዎ
  choice: 都惧怕它
  rationale: 保留所有动物对这头白公牛所怀的普遍恐惧。
- source_word: ያስተበቍዕዎ
  choice: 向它恳求
  rationale: 该动词表示恳求、央求或祈求；“恳求”保留其强烈而谦卑的请求意味，同时避免在正文中预先判定这是敬拜行为。
- source_word: በኵሉ ጊዜ
  choice: 时时
  rationale: 简洁传达“在一切时候、不断”的持续和反复意味。
theological_decisions:
- issue: 是否在正文中明确白公牛所象征的身份
  choice: 只保留“白公牛”的异象形象，不指明其所代表的人物。
  alternative: 将其解释性地译作人类君王、弥赛亚人物，或在正文中添加身份说明。
  rationale: 《动物启示录》借动物形象传达异象；原文本节没有直接揭示这头白公牛的身份，因此译文不应替读者消除这一解释张力。
- issue: “向它恳求”是否必然表示宗教敬拜
  choice: 采用可涵盖央求、请愿与祈求的“恳求”，不在正文中定性为敬拜。
  alternative: 译作“向它祷告”或较弱的“求它施恩”。
  rationale: 原词的语气强于一般求助，但单凭本节不足以断定其行为的礼仪或敬拜性质；“恳求”兼顾词义力度与原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我看见”维持异象报告的节奏；“走兽”“飞鸟”保留启示文学的动物分类和经文色彩，但避免生僻古语。
