base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/007.yaml
  text: And they cried out to them[a], but they did not heed their words; rather, they were exceedingly deaf[c][b], and their eyes were exceedingly blinded.
translation:
  language: zh_hans
  text: 那些羊羔向羊群高声呼喊[a]，羊群却不理会羊羔的话；羊群反而极其耳聋，眼睛也极其昏瞎[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文此处连续使用第三人称复数形式；依照上下文，呼喊者是新生的羊羔，被呼喊者是羊群。译文为避免汉语代词指代不清而明确写出。
    reason: 代词所指
  - marker: b
    text: 原文在“耳聋”和“眼睛昏瞎”两处都使用“极其”这一强化词。译文保留具体的感官意象，不把它直接改写成属灵解释。
    reason: 词义与意象说明
lexical_decisions:
- source_word: አስርኅዎሙ
  choice: 它们向它们高声呼喊
  rationale: 该形式以第三人称复数为主语，并带第三人称复数宾语后缀；译文保留原文的代词指称和高声呼喊之意，不误作第一人称。
- source_word: ኢያጽምኡ ነገሮሙ
  choice: 它们却不理会它们的话
  rationale: 听觉动词在此语境中不只表示声音未被听见，也含有不肯听从、不予理会的意味；“不理会”保留其可归责性，又不强化为明确的“不服从”。
- source_word: ፈድፋደ
  choice: 极其
  rationale: 原文两次使用这一强化副词，分别修饰耳聋和眼睛昏瞎；重复译出，以保留异象语言的强调力度。
- source_word: ተጸመሙ
  choice: 变得极其耳聋
  rationale: 该词表示成为耳聋或听觉闭塞；“变得耳聋”体现其动态形式，同时保持具体的感官意象。
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: 眼睛也极其昏瞎
  rationale: 原文描写眼睛陷入昏暗、失去视力。“昏瞎”兼顾昏暗与看不见的强烈意象，又不擅自说明是谁使其失明。
- source_word: ተወንየሉ
  choice: 反而
  rationale: 承接前面的否定，表达转折和递进：它们不理会呼喊者的话，反而显出极深的耳聋眼瞎。
theological_decisions:
- issue: 耳聋和眼瞎是生理状态，还是道德与属灵的麻木
  choice: 正文保留耳聋、眼瞎的具体感官语言，不在正文中将其直接解释为属灵刚硬。
  alternative: 它们心里刚硬，既不听从，也看不见。
  rationale: 《动物启示录》的异象常借身体感官描写道德和属灵状况，但原文本身仍使用具体意象；保留这一张力可避免把象征意义固定为单一神学解释。
- issue: 连续出现的第三人称复数代词应否在正文中明确为羊羔与羊群
  choice: 正文照原文保留“它们……它们”的代词结构，并以脚注说明语境中的所指。
  alternative: 那些羊羔向羊群高声呼喊，羊群却不理会羊羔的话。
  rationale: 明确名词可提升可读性，却会把上下文判断直接写进正文；脚注既帮助理解，也保留原文指称形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“高声呼喊”保留异象中的急切感；“不理会”比单纯“没听见”更能表达语境中的拒绝意味，又不强释为“不服从”。动物意象中的代词统一用“它们”。
