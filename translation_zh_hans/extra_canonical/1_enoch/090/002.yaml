base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/002.yaml
  text: And after that I saw in my vision all the birds of heaven coming—eagles[a], vultures, kites, and ravens—and the eagles led all the birds. And they began to devour those sheep[c][b], and to peck out their eyes and devour their flesh.
translation:
  language: zh_hans
  text: 此后，我在异象中看见天上的飞鸟都来了——有鹰、秃鹫、鸢和乌鸦[a]；鹰率领着所有的飞鸟。它们开始吞吃那些羊[b]，啄出它们的眼睛，又吞吃它们的肉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些鸟名在现代动物分类上的对应并不完全确定；其中有些也可译作其他猛禽名称，“乌鸦”也可译作“渡鸦”。
    reason: lexical_alternative
  - marker: b
    text: “开始吞吃”也可理解为“抓住它们，把它们吞吃了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ በራእየየ
  choice: 我在异象中看见
  rationale: 保留第一人称的异象叙述和原文所有格含义，现代汉语自然庄重。
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: 天上的飞鸟都
  rationale: “天上的飞鸟”保留启示文学语域；用“都”自然表达整体范围。
- source_word: አንስርት
  choice: 鹰
  rationale: 该词在埃塞俄比亚语圣经用法中通常指鹰；虽可泛指大型猛禽，正文采用较常见的对应词。
- source_word: አውስት
  choice: 秃鹫
  rationale: 在猛禽名单和吞食意象中，“秃鹫”最切合食腐猛禽的语义。
- source_word: ሆባይ
  choice: 鸢
  rationale: 可能指一种较小的猛禽；“鸢”较为谨慎，没有过度限定为鹰或隼。
- source_word: ቋዓት
  choice: 乌鸦
  rationale: 指鸦科鸟类；现代汉语用“乌鸦”自然易懂，并由脚注保留分类上的不确定性。
- source_word: ወአንስርት ይመረሕዎሙ ለኵሎሙ አዕዋፍ
  choice: 鹰率领着所有的飞鸟
  rationale: 将第二次出现的“鹰”解析为动词的明确主语，而不是鸟类名单中的第五项；“率领”表达带领、引导之义。
- source_word: አኃዙ ይብልዕዎሙ
  choice: 它们开始吞吃
  rationale: 按起始性结构理解，既表达行动开始，也保留攻击的凶猛；另一种“抓住并吞吃”的理解列入脚注。
- source_word: ዝኩ አባግዕ
  choice: 那些羊
  rationale: 指向异象叙事前文已经出现的羊，保留指示词的回指作用。
- source_word: ይክረዩ አዕይንቲሆሙ
  choice: 啄出它们的眼睛
  rationale: 攻击者是飞鸟，“啄出”比一般性的“挖出”更具体地保留鸟类动作意象。
- source_word: ይበልዕዎሙ ለሥጋሆሙ
  choice: 吞吃它们的肉
  rationale: 保留重复的吞吃意象及原文直观、惨烈的身体描写。
theological_decisions:
- issue: 动物启示录的象征意涵
  choice: 正文直译为“飞鸟”和“羊”，不直接指认其所象征的历史群体。
  alternative: 在正文中解释为特定国家、民族或统治者。
  rationale: 原文以动物构成寓意性异象；翻译应保存意象及其解释空间，不把某一种历史解释写进经文。
- issue: 攻击动作序列的理解
  choice: 采用起始性理解：“开始吞吃”。
  alternative: 理解为两个连续动作：“抓住并吞吃”。
  rationale: 埃塞俄比亚语动词组合容许两种句法理解；正文选取较符合叙事起势的读法，并以脚注保存另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留启示文学的动物意象和暴力画面，不加入历史身份解释；鸟类名称尽量简洁，并以脚注说明分类上的不确定性。
