base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/011.yaml
  text: And with that[a], all those eagles and vultures and ravens and kites kept snatching away the sheep even until now, and swooping down upon them and devouring them; but the sheep remained silent[e][d][c][b], and the rams lamented and cried out.
translation:
  language: zh_hans
  text: 于是，所有那些鹰、兀鹫、乌鸦和鸢[a]不断攫走羊群，直到如今；又向它们俯冲，并吞吃它们。羊群却默不作声，公绵羊则哀号呼喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些鸟名均按不同种类的猛禽或食腐鸟翻译，以保留异象中具体的动物意象；其中个别鸟种的确切对应仍不完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: አንስርት
  choice: 鹰
  rationale: 按猛禽的具体名称翻译；因下文另有兀鹫类名称，这里用“鹰”以保留异象中鸟类清单的区分。
- source_word: አውስት
  choice: 兀鹫
  rationale: 译作与“鹰”有别的食腐猛禽，保留原文具体而鲜明的动物意象。
- source_word: ቋዓት
  choice: 乌鸦
  rationale: 依最新词汇校勘，将此词识别为乌鸦类，并遵守原文列举次序。
- source_word: ሆባይ
  choice: 鸢
  rationale: 依最新词汇校勘，将此词识别为鸢类；“鸢”是现代中文中简洁而准确的猛禽名称。
- source_word: ይመስጥዎሙ
  choice: 还在不断攫走
  rationale: 动词表示强行夺取或掳走；结合未完成体和“直到如今”，用“不断”呈现持续动作。
- source_word: ይሰርሩ ዲቤሆሙ
  choice: 向它们俯冲
  rationale: ሰረረ 在猛禽攻击的语境中表示飞行或扑下，搭配“在它们之上”宜译为“向它们俯冲”，不译作“践踏”。
- source_word: ይበልዕዎሙ
  choice: 把它们吞吃
  rationale: 保留捕食行为的暴烈和具体性，同时使用普通现代读者易懂的表达。
- source_word: ያረምሙ
  choice: 默不作声
  rationale: 准确表达羊群沉默无声的状态。
- source_word: ይቤላት የአወይዉ ወይጸርኁ
  choice: 公绵羊则哀号呼喊
  rationale: 将ይቤላት识别为“公绵羊”的复数名词，使哀号呼喊的主语与前句沉默的羊群有别；两个声音动词分别译为“哀号”“呼喊”。
theological_decisions:
- issue: 羊群沉默与随后哀号呼喊者的关系
  choice: 明确区分“羊群”与“公绵羊”，后者是哀号呼喊的主语
  alternative: 把后半句仍理解为羊群在哀号呼喊，形成沉默与呼喊的张力
  rationale: 原文中的ይቤላት是“公绵羊”的复数名词，而非让步连接成分；因此这里不存在必须保留的自相张力。准确标明主语可避免由误析产生的神学或修辞解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“攫走、俯冲、吞吃”形成连贯的捕食画面；“默不作声”与“哀号呼喊”清楚区分羊群和公绵羊。鸟名使用常见或可由语境理解的现代名称，不加入宗派性解释。
