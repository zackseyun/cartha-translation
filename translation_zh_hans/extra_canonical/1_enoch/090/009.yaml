base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/009.yaml
  text: And I saw until horns came out for those lambs[a], and the ravens cast down their horns. And I saw until one great horn sprouted on one of those sheep[c][b], and their eyes were opened.
translation:
  language: zh_hans
  text: 我观看，直到那些羊羔长出了角[a]；乌鸦使它们的角坠落。我又观看，直到那些羊中有一只长出了一只大角[b]，它们的眼睛开了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“那些羊羔长出了角”。这是异象中的象征性画面；“角”通常象征力量或统治权。
    reason: lexical_alternative
  - marker: b
    text: 本节没有说明这只“大角”代表谁，因此正文不作历史人物的认定。
    reason: theological_ambiguity
  - marker: c
    text: 直译为“它们的眼睛开了”；这可能表示恢复看见、知觉或认识，但原文没有进一步说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: መኃስእ
  choice: 羊羔
  rationale: 该词在本段动物异象的上下文中指羊的幼崽；译作“羊羔”既符合词义，也维持异象中羊群的动物象征，不采用早先的“鹿”。
- source_word: አቅርንት / ቀርን
  choice: 角
  rationale: 原文使用表示“角”的词。即使长在羊羔身上，这也是异象中力量或统治权的象征，应保留原有意象，不作动物学上的改写。
- source_word: ቋንት
  choice: 乌鸦
  rationale: 该鸟名指鸦科鸟类；“乌鸦”是现代汉语自然且明确的表达，也符合本异象中敌对鸟类的形象。
- source_word: ያወድቅዎሙ
  choice: 击落
  rationale: 动词具有使之落下的使役意义。“击落”保留动作的力度，同时不额外说明具体方式。
- source_word: በቈለ
  choice: 长出
  rationale: 该词含萌生、长出的有机生长意象；“长出”用于角最自然，也忠实保留异象的动态画面。
- source_word: ፩ ቀርን ዓቢይ
  choice: 一只大角
  rationale: 保留原文明确的数词“一”和形容词“大”，呈现这只角独特而显著的地位。
- source_word: አባግዕ
  choice: 绵羊
  rationale: 原词直接指羊。此处用“绵羊”与前面的“羊羔”形成亲属类别上的清楚对应，并避免将集合概念“羊群”强加给原文。
- source_word: ተከሥተ አዕይንቲሆሙ
  choice: 它们的眼睛也开了
  rationale: 近直译保留被动或状态变化的表达及启示性意味，不进一步解释为属灵觉醒、恢复认知或获得视力。
theological_decisions:
- issue: 羊羔长角的非自然画面是否应按动物学常识改写
  choice: 保留“羊羔长出了角”
  alternative: 改译为鹿长出鹿角，或弱化长角的画面
  rationale: 这是象征性的动物异象，“角”在异象中承载力量与领袖权柄的意象；翻译不应为追求自然史上的精确而改变原文的动物类别或象征系统。
- issue: 新长出的大角所指的历史人物
  choice: 正文只描述异象，不指名解释
  alternative: 在正文中明确认定为犹大·马加比或另一位领袖
  rationale: 本节仅呈现象征画面，没有在句内解释其历史身份。译文应保存这种开放性，把具体历史认定留给注释或释经。
- issue: “它们的眼睛开了”的含义
  choice: 保留原文具象表达
  alternative: 解释为它们恢复了洞察力、觉醒了或获得属灵看见
  rationale: 原文容许知觉恢复、认知觉醒或异象性启明等理解；直译可保存这些可能性，不将其中一种解释写入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我观看，直到……”保留异象叙事反复推进的句式；用“却”和“又”使汉语衔接自然，但不改变事件关系。代词“它们”保留末句复数所指的开放性。
