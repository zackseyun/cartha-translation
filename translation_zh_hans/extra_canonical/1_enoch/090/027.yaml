base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/027.yaml
  text: And I saw those sheep while they were burning[a], and their bones were burning.
translation:
  language: zh_hans
  text: 我看见那些羊正在燃烧[a]，它们的骨头也在燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语对羊和它们的骨头两次使用“燃烧”一词，加强了异象的严酷程度；译文保留这一重复。
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢክዎሙ
  choice: 我看见
  rationale: 第一人称异象叙述中的看见动词带宾语后缀；中文把宾语落实为后面的“那些羊”，表达自然，也不作古雅化处理。
- source_word: እልኩ አባግዕ
  choice: 那些羊
  rationale: 保留指示词的指向性，并延续《动物启示录》中以羊象征相关群体的核心意象，不改写为抽象的人群称谓。
- source_word: እንዘ ይውዕዩ
  choice: 正在燃烧
  rationale: እንዘ结构表示所见情景中同时进行的动作；“正在”保留持续状态，而“燃烧”不擅自判定是自燃还是被焚烧。
- source_word: አዕፅምቲሆሙ
  choice: 它们的骨头
  rationale: 采用自然、具体的解剖用语，保留审判异象的严酷画面。
- source_word: ይውዕዩ
  choice: 在燃烧
  rationale: 原文对羊和骨头重复同一动词；中文也重复“燃烧”，以保存原文的强化效果。
theological_decisions:
- issue: 是否把燃烧的审判意象弱化为一般性的毁灭
  choice: 保留明确的“燃烧”意象
  alternative: 译作“被毁灭”或“被烧尽”
  rationale: 原文的力度来自“燃烧”一词的重复，甚至把它用于骨头；泛化为“毁灭”会削弱末世异象的具体性。
- issue: 燃烧应理解为主动状态还是被动受刑
  choice: 采用语态较中性的“正在燃烧／在燃烧”
  alternative: 译作“正在被焚烧”
  rationale: 吉兹语形式在此不必强行落实为中文被动句；中性表达保留火焚场景，也避免加入原文未明确标出的施事关系。
translation_notes:
  register: 采用现代、庄重而直白的异象叙述。“正在燃烧……也在燃烧”在中文中略显重复，但这是有意保留原文的修辞强化；不用“焚毁”“烧尽”等会额外限定结果或语态的词。
