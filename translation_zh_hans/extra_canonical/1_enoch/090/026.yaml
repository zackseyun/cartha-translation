base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/026.yaml
  text: And I saw at that time that a similar deep abyss was opened in the middle of the earth[a], full of fire; and they brought those blinded sheep, and all of them were judged and were found to be sinners, and they were cast into that deep abyss of fire, and they burned[f][e][d][c][b]. And this abyss came to be at the right side of that house.
translation:
  language: zh_hans
  text: 那时，我看见地的中央开了一个同样的深渊[a]，里面充满了火。他们把那些瞎了眼的羊带来[b]；这些羊全都受了审判，并被判定为罪人[c]，随后被扔进那充满火的深渊里，并在那里燃烧。这个深渊位于那座房屋的右边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深渊”也可译作“深坑”。原词表示极深之处；这里采用“深渊”，以保留启示文学的异象色彩。
    reason: lexical_alternative
  - marker: b
    text: “瞎了眼的羊”延续本书“动物启示录”的象征图景；异象中的羊代表人，并非普通动物。也可译作“盲羊”或“被弄瞎的羊”。
    reason: cultural_note
  - marker: c
    text: 原文直译可作“受了审判，成了罪人”。在这里的司法语境中，这句话也可理解为审判显明或判定他们有罪，而不是说他们到这时才开始犯罪。
    reason: alternative_reading
lexical_decisions:
- source_word: ተርኅወ
  choice: 开了
  rationale: 保留被动开启的异象画面；汉语用“开了”自然简洁，不说明开启者或具体方式。
- source_word: ማዕምቅ
  choice: 深渊
  rationale: 该词指极深之处；“深渊”兼顾词义和启示文学的庄严意象。
- source_word: ምሉዕ እሳተ
  choice: 充满了火
  rationale: 直接保留原文具体意象，不把集合意义的“火”细化为“火焰”。
- source_word: አምጽእዎሙ
  choice: 他们把……带来
  rationale: 表达使其来到的动作，同时像原文一样不明确交代行动者身份。
- source_word: እልኩ አባግዕ ጽዑላነ
  choice: 那些被弄瞎的羊
  rationale: 体现可能具有结果意义的状态，并保留《动物启示录》的象征形象，不直接解释所指。
- source_word: ተኰነኑ
  choice: 受了审判
  rationale: 保留司法语义，不提前将该动词本身收窄为“定罪”；后句再说明判定结果。
- source_word: ወኮኑ ኃጥኣነ
  choice: 并被判定为罪人
  rationale: 在审判语境中表达“被认定为”的宣告意义，避免让读者误以为审判使他们开始犯罪。
- source_word: ተወድዩ
  choice: 被扔进
  rationale: 保留被动与强制投入的动作；现代汉语自然清楚。
- source_word: ወውዕዩ
  choice: 焚烧
  rationale: 紧凑表达火中燃烧的结果；不增添“烧尽”等原文未明说的含义。
- source_word: በየማኑ ለዝኩ ቤት
  choice: 位于那座殿的右边
  rationale: 保留具体空间关系及远指“那”；“殿”切合异象中该建筑的语境。
theological_decisions:
- issue: 羊是单纯失明，还是在寓意中处于先前造成的盲目状态
  choice: 那些被弄瞎的羊
  alternative: 那些瞎眼的羊
  rationale: 结果式表达保留其状态可能由先前事件造成的叙事联系，但不解释这种失明的神学原因。
- issue: “受审判并成为罪人”这一司法序列的含义
  choice: 受了审判，并被判定为罪人
  alternative: 受了审判，成了罪人
  rationale: 司法上下文支持宣告或认定的含义；此译法避免暗示审判本身使他们犯罪，同时仍保留审判与罪人身份两个连续成分。
- issue: “房屋”的语境性所指
  choice: 那座殿
  alternative: 那座房屋
  rationale: 异象语境中的建筑具有圣殿指向，“殿”在现代汉语中较自然；但不进一步指定其神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留异象叙事的简洁推进、司法语汇和“这个深渊／那座殿”的近指与远指对照；不解释羊的具体历史或教派性所指。所有脚注标记均已置于正文相应位置。
