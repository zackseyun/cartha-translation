base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/029.yaml
  text: And I saw until the Lord of the sheep brought a new house[a], greater and loftier than the first, and set it up in the place of the first, which had been folded up; and all its pillars were new, and its ornaments were new and greater than those of the first old one that he had taken away[b], and all the sheep were within it.
translation:
  language: zh_hans
  text: 我又观看，直到群羊的主带来一座新房子[b]，比先前那座更大、更高，并把它立在那座已经被折叠起来[a]的旧房子的原处。新房子的柱子全是新的，装饰也是新的，比他所移走的先前那座旧房子的装饰更宏伟；所有的羊都在其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “折叠起来”所译的吉兹语动词含义较难确定，也可译作“卷起来”或“包裹起来”。
    reason: lexical_alternative
  - marker: b
    text: “房子”在异象中很可能象征复兴或末世的圣所；这里仍保留原文的象征形象。
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: 群羊的主
  rationale: 保留“主”的庄重称谓及《动物启示录》中以羊群象征群体的持续意象。
- source_word: ቤት ኀዲስ
  choice: 一座新房子
  rationale: 原词本义为“房子”；虽可能象征末世圣所，但正文不直接释作“圣殿”，以保留异象本身的象征表达。
- source_word: ዓቢይ ... ልዑል
  choice: 更大、更高
  rationale: 分别传达规模与高度的比较，现代中文自然清楚，也不把“高”过度解释为属灵尊荣。
- source_word: አቀሞ ውስተ መካነ ቀዳማዊት
  choice: 把它立在……原处
  rationale: 表达安置、建立以及在原有地点替换旧房子的含义。
- source_word: እንተ ትጠብለለት
  choice: 已经被折叠起来
  rationale: 保留原文不同寻常的具体图像，不擅自改为“拆毁”；其他可能译法在脚注交代。
- source_word: አዕማዲ
  choice: 柱子
  rationale: 采用普通而准确的建筑用语。
- source_word: ስና
  choice: 装饰
  rationale: 该词确切所指略有不确定；“装饰”可涵盖建筑的装饰性构件，又不窄化为陈设。
- source_word: አውፅአ
  choice: 移走
  rationale: 在新旧房子更替的语境中，清楚表达旧房子被挪去，同时避免强化为摧毁。
- source_word: ማእከላ
  choice: 在其中
  rationale: 自然地表达所有羊都处于新房子内部。
theological_decisions:
- issue: 是否把“房子”解释性地译成“圣殿”
  choice: 房子
  alternative: 圣殿／圣所
  rationale: 异象很可能指向复兴或末世的圣所，但原文采用动物寓言中的“房子”意象；正文保留意象，脚注提示可能指涉。
- issue: 如何表达旧房子在 እንተ ትጠብለለት 中的状态
  choice: 已经被折叠起来
  alternative: 被卷起来／被包裹起来／被拆毁
  rationale: 原文动词含义困难，可能指折叠、卷起或包裹；不采用解释性更强的“拆毁”，以保留词义不确定性和异象张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我又观看，直到……”保留异象反复推进的句式；适度分句，以免原文长串并列在中文中显得滞重。脚注标记均置于与其内容直接相关的位置。
