base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/033.yaml
  text: And all those that had been scattered and dispersed[a], and all the beasts of the field and all the birds of heaven, were gathered into that house; and the Lord of the sheep rejoiced with great joy[c][b], because they had all become good and had entered into his house.
translation:
  language: zh_hans
  text: 凡曾灭亡和流散的[a]，连同田野的一切走兽和天上的一切飞鸟，都被聚集到那座房屋里；羊群的主大大欢喜，因为它们都已变得良善，并进入了他的房屋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灭亡”也可理解为“失丧”。这里与“流散”并列的两个动词可能分别描写遭毁灭和被分散者；本译文保留二者的区别。
    reason: lexical_alternative
  - marker: b
    text: “那座房屋”和后面的“他的房屋”承接本异象中复兴居所的象征；原文没有在此直接称其为“圣殿”。
    reason: cultural_note
lexical_decisions:
- source_word: ተሐጕሉ
  choice: 曾经灭亡
  rationale: 该词源于表示毁灭、灭亡或失丧的词根；与下一个表示流散的动词区分开来，可保留本段可能涉及死亡后复归的叙事张力，而不将两个动词合并为同义重复。
- source_word: ተዘርዘሩ
  choice: 流散
  rationale: 表达分散各处的状态，与前面的“灭亡”并列；“流散”自然且适合群体离散后重新聚集的语境。
- source_word: አራዊተ ገዳም
  choice: 田野的一切走兽
  rationale: 保留陆地野兽的意象，又采用现代中文读者熟悉的经文表达；不把ገዳም过度限定为沙漠。
- source_word: አዕዋፈ ሰማይ
  choice: 天上的一切飞鸟
  rationale: 贴近原文的空间意象，并保持庄重、自然的中文语体。
- source_word: ተጋብኡ በውእቱ ቤት
  choice: 都聚集到那座房屋里
  rationale: 聚集动词的被动或结果意义得到保留，施事者仍未明说；结合后文“进了他的房屋”，介词短语按方向理解。
- source_word: እግዚኦሙ ለአባግዕ
  choice: 羊群的主
  rationale: 保留《动物启示录》中反复出现的象征性神圣称号，不将其弱化为普通的“主人”。
- source_word: ተፈሥሐ ዐቢየ ፍሥሐ
  choice: 大大欢喜
  rationale: 以自然的现代汉语再现同根名词与动词所构成的强烈喜乐，避免生硬直译为“以大喜乐欢喜”。
- source_word: ኄራነ
  choice: 成为良善
  rationale: 保留该词宽泛的善好与复原含义，不擅自收窄为技术性的“称义”或特定道德称号。
- source_word: ገብኡ ውስተ ቤቱ
  choice: 进了他的房屋
  rationale: 表达已经进入的完成性结果；“他的”自然回指羊群的主。
theological_decisions:
- issue: ተሐጕሉ所表达的是灭亡、失丧，还是散开
  choice: 译作“灭亡”，并在注释中保留“失丧”的可能
  alternative: 散开；被驱散
  rationale: 该词与随后明确表示分散的ተዘርዘሩ并列，更可能指灭亡或失丧。如此处理避免抹去异象中可能存在的死者复归意象，同时不在正文中直接加上“复活”等解释性术语。
- issue: “羊群的主”的所指
  choice: 保留异象中的象征性称号“羊群的主”
  alternative: 它们的主人；羊群的主人
  rationale: 该短语在动物异象中承担神圣称号的功能；保留原有象征比改写成一般性称谓更忠实。
- issue: ኄራነ所表达的复原性质
  choice: 译作“成为良善”
  alternative: 成为义人；变得正直；变好了
  rationale: “良善”保留道德转变和恢复完好两方面的可能，不把原文过早解释为特定的教义范畴。
- issue: 房屋意象
  choice: 正文保留“那座房屋”与“他的房屋”
  alternative: 圣殿；复兴后的居所
  rationale: 原文只说“房屋”；注释提示其异象功能，但正文不直接将象征确定为圣殿，以保留解释空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留动物异象中的“羊群的主”“走兽”“飞鸟”和“房屋”等核心意象；避免以教义术语解释“灭亡者”的归来或将“房屋”直接定名为圣殿。
