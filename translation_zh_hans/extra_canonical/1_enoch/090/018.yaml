base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/018.yaml
  text: And I saw until the Lord of the sheep came to them, and he took in his hand the staff of wrath and struck the earth; and the earth split open, and all the beasts and all the birds of heaven fell away from among those sheep and sank into the earth, and it covered over them.
translation:
  language: zh_hans
  text: 我看见，直到群羊之主来到它们那里。他手中拿着震怒之杖[c]，击打大地；大地裂开[a]，所有的野兽和天上的飞鸟[b]都从那些羊中间坠落，沉入地里，地又把它们覆盖起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大地被劈开。”原文此句较难确定；下文说众兽和飞鸟沉入地中，表明地面应当裂开或开启。
    reason: lexical_alternative
  - marker: b
    text: “野兽”和“天上的飞鸟”延续本异象的动物象征，所指不只是普通动物，也代表与群羊敌对的势力。
    reason: cultural_note
  - marker: c
    text: 也可按语境译作“他震怒的杖”；原文直译为“震怒之杖”，没有明示“他的”。
    reason: textual_nuance
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: 群羊之主
  rationale: 保留动物启示录中羊群的象征图景，同时以“主”表达统治和归属关系，不预先引入后来的基督论认定。
- source_word: በትር መዓተ
  choice: 震怒之杖
  rationale: “杖”呼应牧羊图景；“震怒”保留审判意味。原文没有第三人称所有格后缀，因此正文不增添“他的”。
- source_word: ዘበጣ ለምድር
  choice: 击打大地
  rationale: 直接表达强力击打，语言现代而庄重，并保留审判行动的力度。
- source_word: ተሰጠተ ምድር
  choice: 大地裂开
  rationale: 该词句有一定疑难；下文说众兽和飞鸟沉入地中，地又覆在它们上面，故“裂开”最符合叙事进程。
- source_word: ወድቁ እምዝኩ አባግዕ
  choice: 从那些羊中间坠落
  rationale: 兼顾向下坠落与从羊群中分离两层意思，不将其简化为仅仅“倒在羊面前”。
- source_word: ተሰጥሙ በምድር
  choice: 沉入地里
  rationale: 与随后大地覆盖它们的动作自然衔接，同时不确定究竟是主动下沉还是被大地吞没。
- source_word: ከደነት ዲቤሆሙ
  choice: 地就覆在它们上面
  rationale: 阴性单数动词自然回指“大地”；此译保留覆盖、封闭的鲜明意象，而不过度解释为埋葬。
theological_decisions:
- issue: 动物寓言中的神圣称号
  choice: 群羊之主
  alternative: 群羊的主人
  rationale: “主”既保留原词的尊崇和主权意味，又维持寓言内部的羊群意象，不把身份进一步作教派化界定。
- issue: 施行审判的器具
  choice: 震怒之杖
  alternative: 他震怒的杖
  rationale: “杖”延续牧者意象，“震怒”表达司法性审判；因原文未带“他的”这一所有格后缀，正文采用较严格的无所有格表达，但脚注保留按语境补足的可能。
- issue: 大地发生的变化
  choice: 大地裂开
  alternative: 大地被劈开；大地震动
  rationale: 原句形式和词义存在难点；下文所述沉入与覆盖支持地面开启或裂开的理解，但不进一步说明裂开的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“我观看着，直到……”略微保留原文连续观看的句法；正文避免古奥的“忿怒”“权杖”等词，也避免把象征对象作超出本节的具体神学认定。
