    rationale: 原文的“直到”确实体现异象持续至某事件，但现代汉语以“我看见，直到……”表达这一推进更顺畅，无须增添“ 一直”。
  - severity: low
    issue: 脚注的替代说明含有不必要的推断。
    rationale: “因它们临近而逃走”把逃跑的具体原因限定为“临近”，而原文仅表达从羊群面前逃离。应以“从羊群面前逃走／在羊群面前逃窜”说明即可。
