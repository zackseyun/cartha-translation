base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/019.yaml
  text: And I saw until a great sword was given to the sheep[a], and the sheep went out against all the beasts of the field to kill them; and all the beasts and the birds of heaven fled from before their face.
translation:
  language: zh_hans
  text: 我看见，直到有一把大剑赐给羊群；羊群出来，迎战田野的一切野兽，要杀死它们。所有的野兽和天上的飞鸟都从羊群面前逃走了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从羊群面前逃走”直译原文的闪语式表达；按现代汉语可理解为“在羊群面前逃窜”或“从羊群面前逃离”。
    reason: 说明原文习语，同时避免把逃走的原因增译为“因它们临近”。
lexical_decisions:
- source_word: ርኢኩ እስከ ተውህበ
  choice: 我一直观看，直到……赐给
  rationale: 保留异象叙事中持续观看直至关键事件发生的时间进程；“一直观看”比单说“我看见”更清楚地表达እስከ所引出的延续关系。
- source_word: ለአባግዕ
  choice: 赐给羊群
  rationale: 按与格译为“给”；“羊群”既自然表达复数羊，又保留《动物启示录》的动物象征，不在正文中直接解码为某一群体。
- source_word: ሰይፍ ዐቢይ
  choice: 一把大剑
  rationale: “大剑”保留“大”可能兼指尺寸、威力或象征意义的张力；避免用“巨剑”将含义限定为体积，也避免“大刀”改变武器类别。
- source_word: ወወፅኡ አባግዕ ዲበ ኵሉ አራዊተ ገዳም
  choice: 羊群就出去攻击田野的一切野兽
  rationale: “出去攻击”自然表达羊群出动并针对敌对野兽的动作；“田野的一切野兽”保留原文的动物及场域意象。
- source_word: ከመ ይቅትልዎሙ
  choice: 要杀死它们
  rationale: 简明表达目的，不淡化审判场景中的暴力，也不采用较古雅的“屠戮”。
- source_word: አዕዋፈ ሰማይ
  choice: 天上的飞鸟
  rationale: “天上的飞鸟”符合现代汉语中的庄重经文语体，并保留原文的天地空间意象。
- source_word: ነፍጹ እምቅድመ ገጾሙ
  choice: 都从它们面前逃走了
  rationale: 保留闪语式“从……面前”所具有的具体画面，同时在汉语中仍然通顺；代词指向前文的羊群。
theological_decisions:
- issue: 是否在正文中解明动物象征
  choice: 照原文保留“羊群”“野兽”和“飞鸟”
  alternative: 解释性地译为以色列、敌对列国及其盟友
  rationale: 本段属于持续展开的动物异象；翻译应保留异象本身的象征语言，不把可能的历史或神学指涉直接写入正文。
- issue: 大剑的赐予者是否明说
  choice: 采用被动式“赐给”，不补出施予者
  alternative: 补译为“上帝赐给”或“有人赐给”
  rationale: 原文使用被动表达而未明说施予者；正文不应擅自消除这一含蓄性。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体；保留异象的动物意象、被动表达及“从……面前”的具体措辞，避免古奥词汇和解释性增译。
