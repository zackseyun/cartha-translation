base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/015.yaml
  text: And I watched until the Lord of the sheep came to them in wrath[a], and all who saw him fled[c][b], and they all fell into the shadow before his face.
translation:
  language: zh_hans
  text: 我一直观看，直到羊群的主带着震怒来到它们那里。凡看见他的都逃走了；它们全都从他面前跌入阴影之中[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴影”直译自吉兹语；这里可能暗示幽暗的败亡之地，但原文并未进一步说明。
    reason: lexical_alternative
  - marker: b
    text: “从他面前”直译自吉兹语复合介词；也可按其惯用法理解为“从他的临在中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: 我一直观看
  rationale: 在异象叙事中，该动词在“直到”结构里表示持续观看；“一直观看”比单纯的“看见”更能体现这一过程。
- source_word: እስከ መጽአ
  choice: 直到……来到
  rationale: 保留原文从持续观看推进到决定性来临的时间结构。
- source_word: እግዚአ አባግዕ
  choice: 羊群的主
  rationale: 既保留动物启示录中的羊群意象，也表达这位主宰者的权威；不引入后期的基督论称谓。
- source_word: በመዓት
  choice: 带着震怒
  rationale: 表达来临时的方式及审判色彩；“震怒”庄重而有力度，“带着”则符合现代汉语。
- source_word: እለ ርእይዎ ኵሎሙ
  choice: 凡看见他的
  rationale: 自然呈现原文概括性的关系结构，并保留“所有”的总体含义。
- source_word: ነፍጹ
  choice: 逃散了
  rationale: 兼顾突然逃跑与四散的语义，比口语化的“跑掉了”更符合审判异象的语体。
- source_word: ወወድቁ ኵሎሙ
  choice: 它们全都……坠入
  rationale: 保留原文重复强调的“全都”；“坠入”自然表达向某处跌落的方向。
- source_word: ውስተ ጽላሎት
  choice: 阴影之中
  rationale: 按字面保留“阴影”意象，不将其窄化解释为“黑暗”“阴间”或特定刑罚之地。
- source_word: እምቅድመ ገጹ
  choice: 从他面前
  rationale: 明确保留复合介词中的离格“从”，同时以自然汉语传达从其面前或临在中退离的含义。
theological_decisions:
- issue: “羊群的主”的身份
  choice: 保留为具有神圣审判权威的“羊群的主”
  alternative: 译作较一般性的“羊群的主人”
  rationale: 在《动物启示录》的整体寓意中，该称号指向统管羊群并施行审判的超越者。译作“主”能保留其神学分量，同时不加入后期基督论认定。
- issue: “阴影”的性质
  choice: 保留未加解释的空间意象“阴影之中”
  alternative: 解释为“黑暗之地”、死亡领域或特定惩罚处所
  rationale: 原词本身允许不祥的含义，但不足以确定某一特定末世论地点；直译可保存原文的含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。以“它们”承接寓言中的动物群体，以“他”指羊群的主；保留“震怒”“阴影”“从他面前”等审判性意象，同时避免把含混意象教义化。
