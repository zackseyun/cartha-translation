base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/035.yaml
  text: And the eyes of them all were opened[a], and they saw well[b], and there was not one among them that did not see.
translation:
  language: zh_hans
  text: 他们众人的眼睛都开了，都看得清楚[a]；他们中间没有一个看不见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们看见美好的事物。”原文也可理解为所看见的对象，而不是说明他们看得怎样。
    reason: lexical_alternative
lexical_decisions:
- source_word: አዕይን
  choice: 眼睛
  rationale: 采用具体的身体意象，符合《动物启示录》的异象叙事，也避免将其预先解释为抽象的“悟性”或“属灵眼光”。
- source_word: ተከሥታ
  choice: 开了
  rationale: 此处表示眼睛被打开；汉语用“眼睛都开了”自然地保留被动结果和恢复视觉的意象。
- source_word: ሠናየ
  choice: 看得清楚
  rationale: 该词的宾格形式可作副词，意为“好好地、良好地”；结合先前失明的叙事背景，“看得清楚”较贴切地表达视觉恢复，同时以脚注保留名词性理解。
- source_word: ዘኢይሬኢ አልቦ
  choice: 没有一个看不见的
  rationale: 贴近原文强调性的双重否定结构，不将其进一步解释为“没有一个瞎眼的”。
- source_word: በማእከሎሙ
  choice: 他们中间
  rationale: 既保留“在他们当中”的空间与群体意味，也符合现代汉语表达。
theological_decisions:
- issue: 异象中视觉恢复的性质
  choice: 保留眼睛张开并能看清楚的具体异象意象，不在正文中明说这是属灵启蒙。
  alternative: 译作“他们都有了属灵的悟性”或“他们的心眼开了”。
  rationale: 原文在象征性叙事内部描写视觉恢复；直译其意象可让读者自行体会其神学含义，避免消解象征的张力。
- issue: ሠናየ 是副词还是所见对象
  choice: 正文按副词译为“看得清楚”。
  alternative: 按名词性用法译为“看见美好的事物”。
  rationale: 宾格形式可作副词，且上下文强调从失明到恢复视觉；不过名词性理解在语法和词义上仍有可能，因此列入脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“眼睛都开了—看得清楚—没有一个看不见”保留原文递进和强调性的重复；脚注标记置于产生歧义的“看得清楚”之后。
