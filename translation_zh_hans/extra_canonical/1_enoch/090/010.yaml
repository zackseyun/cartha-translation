base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/010.yaml
  text: And it looked at them[a], [and their eyes were opened,] and it cried out to the sheep and said to them[c][b], “Look!” and they all ran to it.
translation:
  language: zh_hans
  text: 它看着它们，[它们的眼睛开了][a]；它向众羊大声呼喊，公羊们看见了它；它们全都跑向它。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它们的眼睛开了”在所据埃塞俄比亚文底本中置于方括号内，表明这句话的文本归属或稳定性存疑；本译文予以保留并照样加括号。
    reason: textual_variant
  - marker: b
    text: “跑向它”也可译作“跑向他”；后一译法把这个单数形象理解为人格化的带领者。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርእየ ቦሙ
  choice: 它看着它们
  rationale: 将ወርእየ按第三人称单数理解，而非第一人称异象叙述公式；ቦሙ在这里表示动作所指向的复数对象。
- source_word: ወተፈትሐ አዕይንቲሆሙ
  choice: '[它们的眼睛开了]'
  rationale: 保留“眼睛开启”的被动含义，并以方括号反映所提供底本对该短语的存疑标记。
- source_word: ወጸርኀ ሎሙ ለአባግዕ
  choice: 它向众羊大声呼喊
  rationale: ጸርኀ表示强烈发声；“众羊”保留异象中的动物意象，避免抽象化为一般群体。
- source_word: ወይቤላት ርእይዎ
  choice: 对它们说：“看！”
  rationale: 按言说动词及带宾语后缀的复数命令式理解，译出简短而急切的观看命令；中文用复数“它们”与前面的众羊自然衔接。
- source_word: ወሮጹ ኵሎሙ ኀቤሁ
  choice: 它们便全都朝它跑去
  rationale: 保留“跑”的具体动作和“全都”的总括意义；主文用“它”维持动物异象的表层表达。
theological_decisions:
- issue: 是否把异象中的单数动物形象人格化
  choice: 主文使用“它”
  alternative: “他”
  rationale: 原文的代词本身不要求在中文中预先确定该形象是动物象征还是人格化领袖；“它”保留当前异象画面，“他”作为可能理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大声呼喊”传达动作的急迫感；代词统一采用动物异象所需的“它／它们”，同时以脚注保留人格化理解。方括号属于正文的文本批判标记，并配有[a]说明。
