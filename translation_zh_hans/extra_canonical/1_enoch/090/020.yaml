base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/020.yaml
  text: And I saw until a throne was set up in the pleasant land[a], and the Lord of the sheep sat upon it[b]; and he took all the sealed books and opened those books before the Lord of the sheep.
translation:
  language: zh_hans
  text: 我观看，直到一座宝座被设立在那佳美之地[a]，羊群的主坐在其上[b]。他取来所有封着印的书卷，并在羊群的主面前打开那些书卷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“佳美之地”的吉兹语词在这个文本见证中的含义不确定；它可能指一片特别蒙眷顾的土地，而不是泛指整个大地。
    reason: lexical_alternative
  - marker: b
    text: 本节两次称“羊群的主”：他既是坐在宝座上的那一位，也是书卷在其面前被打开的那一位。译文保留这一重复，没有将其改顺。
    reason: textual_variant
lexical_decisions:
- source_word: መንበር
  choice: 宝座
  rationale: 在这场启示性的审判景象中，此词指具有王权和审判意味的座位；译作“宝座”比一般的“座位”更能保留原有意象。
- source_word: ተሐንጸ
  choice: 设立起来
  rationale: 原文为被动形式，表示宝座被建起、安置或预备；“设立起来”既符合异象语境，也不把含义局限为实际施工建造。
- source_word: ሐዋዝ
  choice: 那佳美之地
  rationale: 此词在本见证中的含义不确定；结合《动物启示录》的土地意象，可能指一片蒙眷顾、佳美的特定土地，而非泛指全地。“佳美之地”保留具体地域感及其褒义色彩。
- source_word: እግዚአ አባግዕ
  choice: 羊群的主
  rationale: 这是《动物启示录》中反复出现的称号；“主”同时保留其权威意味和庄严的启示文学语体。
- source_word: መጻሕፍተ ኅትማተ
  choice: 封印的书卷
  rationale: 原短语指带有封印的书，可能是天上的记录。“封印的书卷”直接保留封印意象，并以“书卷”贴合古代文献形态。
- source_word: ፈትሖን
  choice: 打开
  rationale: 动词本身通常表示“打开”，而非专指“揭开封印”；前文已有“封印的书卷”，故此处直译为“打开”，不额外强化动作。
theological_decisions:
- issue: 坐宝座者与书卷在其面前被打开者的身份
  choice: 依照吉兹文保留两次“羊群的主”：羊群的主坐在宝座上，书卷也在羊群的主面前被打开。
  alternative: 校改其中一处，使另一位天上人物坐宝座，或使书卷在不同的对象面前被打开。
  rationale: 传世文本的重复虽略显突兀，却仍可理解，无须暗中协调或校改；这也可能有意强调羊群的主既是登宝座的审判者，也是接受记录呈验者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我一直观看，直到……”保留异象叙述中持续观看直至新场景出现的结构；“取来”自然表达书卷被拿到审判场景中，同时不另行指定其来源。所有不确定性均由脚注明示，正文不作超出原文的神学协调。
