base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/004.yaml
  text: And I saw until those sheep were devoured by the dogs and by the eagles and by the kites[a], and they left them no flesh at all, nor skin, nor sinew, until only their bones stood there; and even their bones fell upon the earth[e][d][c][b], and the sheep became few.
translation:
  language: zh_hans
  text: 我看着，只见那些羊被狗、鹰和鸢[a]吞吃。它们没有给羊留下丝毫的肉，也没有留下皮或筋，直到只剩下骨头立在那里；后来，连它们的骨头也倒在地上，羊就所剩无几了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“鸢”的词，也可能泛指鹰隼一类的猛禽。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተበልዑ
  choice: 被……吞吃
  rationale: 被动形式描述猛兽和猛禽的捕食；“吞吃”既保留暴烈感，也符合现代汉语的异象叙事。
- source_word: አክልብት
  choice: 狗
  rationale: 采用普通、直接的动物名称，不把象征意象解释为具体民族或军队。
- source_word: አንስርት
  choice: 鹰
  rationale: 这是该词的传统且较稳妥的对应词；古代猛禽名称的范围可能重叠，但正文不宜无据改作其他鸟类。
- source_word: ሆባይ
  choice: 鸢
  rationale: 指与前项有别的一种猛禽；“鸢”是现代汉语中对 kite 的准确名称，但物种范围仍有不确定性，故加注。
- source_word: ኢኃደጉ ሎሙ ሥጋ ግሙራ
  choice: 没有给羊留下丝毫的肉
  rationale: 按最新校审，ግሙራ在否定结构中加强完全否定，表达“一点肉也没有留下”，而非“完整的肉”。
- source_word: ማእሰ
  choice: 皮
  rationale: 在羊被吞吃的图景中，“皮”自然、明白，也与“肉、筋”构成递进式的彻底剥夺。
- source_word: ሥርወ
  choice: 筋
  rationale: 可指筋腱一类组织；“筋”比“肌腱”更适合庄重而通俗的经文语体。
- source_word: ቆሙ ባሕቲቶ አዕፅምቲሆሙ
  choice: 只剩下骨头立在那里
  rationale: 保留原文“骨头站立”的强烈视觉形象，不将其完全平化为“只剩骨头”。
- source_word: ወአዕፅምቲሆሙሰ ወደቁ ዲበ ምድር
  choice: 后来，连它们的骨头也倒在地上
  rationale: “连……也”体现附着词-ሰ在此处的对比或高潮焦点：先是骨头立着，继而连骨头都倒下；“后来”使异象中的进程在汉语中清楚。
- source_word: ወንእሱ አባግዕ
  choice: 羊就所剩无几了
  rationale: 准确表达羊群数量锐减；比直译“羊变少了”更自然，同时保留灾难后的简短总结。
theological_decisions:
- issue: 动物意象具有象征意义，但叙述本身采用字面动物名称
  choice: 正文保留羊、狗、鹰和鸢等动物名称，不在译文中解码其象征对象。
  alternative: 直接译作列国、领袖或军队攻击以色列。
  rationale: 《动物启示录》借持续的动物象征展开异象；翻译应保存异象自身的表达方式，避免把某一种历史或神学解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短句呈现异象的残酷推进；保留“骨头立在那里”这一略显突兀但有意为之的原文图像。脚注仅说明猛禽名称的不确定性，不重复已在正文准确表达的完全否定。
