base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/008.yaml
  text: And I saw in the vision that ravens flew down upon those lambs[b][a], and they seized one of those lambs and dashed the sheep to pieces and devoured them.
translation:
  language: zh_hans
  text: 我在异象中看见，乌鸦飞扑向那些羔羊[a]；它们抓住其中一只羔羊，又把那些羊撕得粉碎，吞吃了它们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “飞扑向”也可理解为“冲向”或“袭击”；这里按乌鸦的形象译出飞行动作。
    reason: lexical_alternative
  - marker: b
    text: 原文先说乌鸦抓住“一只羔羊”，随后却用复数说它们把“羊”撕碎并吞吃；译文保留这一数的变化。原文用于羔羊和羊的词也有所不同，但所指范围可能重叠。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወርኢኩ፡ በራእይ
  choice: 我在异象中看见
  rationale: 保留第一人称异象叙事的惯用格式；“看见”自然清楚，也不增加原文没有的解释。
- source_word: ቋዓተ
  choice: 乌鸦
  rationale: 保留动物启示录中特定的鸟类意象；相比泛称“黑鸟”，“乌鸦”更具体。
- source_word: ከመ፡ ሰረሩ፡ ዲበ
  choice: 飞扑到……身上
  rationale: 兼顾从上而来的鸟类动作和敌意；也保留该动词可泛指猛冲、袭来的语义空间，并以脚注说明。
- source_word: እልክቱ፡ መዓስእ
  choice: 那些羔羊
  rationale: 用“羔羊”体现此处与后文羊群用词的差异，同时保持中文顺畅。
- source_word: ወአኀዝዎ፡ ለአሐዱ፡ እምዝኩ፡ መዓስእ
  choice: 它们抓住其中一只羔羊
  rationale: 准确表达从那些羔羊中抓住一个个体的意思；“抓住”直接而有暴力色彩。
- source_word: ወቀጥቀጥዎሙ፡ ለአባግዕ
  choice: 又把羊群撕碎
  rationale: 重叠动词表示强烈的毁坏动作；“撕碎”符合猛禽袭击羊群的画面。“羊群”兼顾复数所指，并避免中文误解为仅同一只羔羊。
- source_word: ወበልዕዎሙ
  choice: 吞吃了它们
  rationale: “吞吃”保留掠食场面的强烈和具体性，且为现代中文读者易懂。
theological_decisions:
- issue: 动物象征是否应在译文中直接解释
  choice: 保留乌鸦、羔羊和羊群等具体动物形象
  alternative: 直接译作敌对民族或领袖攻击以色列
  rationale: 本段借持续的动物意象传达启示；正文应保留异象表层，不把可能的象征解释写入翻译。
- issue: 单数羔羊与后续复数羊群之间的指称张力
  choice: 按现存吉兹语文本保留从“一只羔羊”转向复数“羊群／它们”的变化
  alternative: 将后半句统一理解为只撕碎并吞吃先前被抓的那一只羔羊
  rationale: 原文后两个动词及“羊”均为复数形式，不宜为求叙事整齐而擅自改成单数；脚注提示这一变化。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“飞扑”“撕碎”“吞吃”维持异象的强烈画面；不在正文中解释动物所象征的历史群体。所有脚注标记均置于正文。
