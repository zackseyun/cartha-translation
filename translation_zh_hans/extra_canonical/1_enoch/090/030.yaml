base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/030.yaml
  text: And I saw all the sheep that were left[a], and every beast that was upon the earth, and all the birds of heaven, falling down and bowing to those sheep, and making petition to them[b], and obeying them in every word.
translation:
  language: zh_hans
  text: 我看见所有剩下的羊；地上的一切走兽和天上的一切飞鸟都俯伏下来，向那些羊下拜，恳求它们，并听从它们的一切话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从”所译的动词本义是“听”；在这里俯伏、恳求的语境中，也可理解为“留心听取”或“服从”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ ለኵሎሙ አባግዕ እለ ተርፉ
  choice: 我看见所有剩下的羊
  rationale: 保留异象叙事的第一人称，并按格标记把“所有剩下的羊”处理为“我看见”的宾语；“剩下的”保留审判之后余民的含义，不具体限定其性质。
- source_word: ኵሉ እንስሳ ዘዲበ ምድር ወኵሉ አዕዋፈ ሰማይ
  choice: 地上的一切走兽和天上的一切飞鸟
  rationale: 用“走兽”和“飞鸟”维持动物异象及圣经式语域；二者在句法上共同作后续动词的主语。
- source_word: ይወድቁ ወይሰግዱ ለእልኩ አባግዕ
  choice: 都俯伏下来，向那些羊下拜
  rationale: 保留两个表示身体降服的动作，同时避免使用“敬拜”，以免把经文未明确界定的宗教含义强加于羊群。
- source_word: ያስተበቍዕዎሙ
  choice: 恳求它们
  rationale: 简明表达向对方祈求、求情或求恩的动作，并与俯伏下拜的臣服姿态相称。
- source_word: ይሰምዕዎሙ በኵሉ ቃል
  choice: 听从它们的一切话
  rationale: 动词本义为“听”，在俯伏、下拜和恳求的语境中也含有留心听取并服从之意；“一切话”保留原文具体措辞。
theological_decisions:
- issue: 走兽和飞鸟对羊的举动是否应明确译为“敬拜”
  choice: 译作“俯伏下来，向那些羊下拜……听从”
  alternative: 译作“敬拜那些羊”
  rationale: 原文描写全面降服，却没有必要把动作直接定性为只归于神的敬拜；现译保留末世性尊崇与臣服的张力。
- issue: 走兽和飞鸟是“我看见”的并列宾语，还是后续动作的主语
  choice: 将“剩下的羊”作为“我看见”的宾语，将走兽和飞鸟作为“俯伏、下拜、恳求、听从”的主语
  alternative: 把羊、走兽和飞鸟都列作“我看见”的宾语，再以分词描述场景
  rationale: “所有的羊”有与动词宾语后缀相应的宾语标记，而走兽和飞鸟没有该标记；后两者自然支配复数未完成式动词。分号使这一句法关系在中文中清楚可见。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一切走兽”“天上的一切飞鸟”“俯伏下来”等表达保留启示文学的高雅语体，但避免生硬古语。分号用于显明原文句法：先看见余下的羊，随后走兽和飞鸟向这些羊表示臣服。
