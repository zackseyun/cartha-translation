base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/021.yaml
  text: And the Lord of the sheep called those seven first white ones and commanded that they bring before him[a], beginning with the first star that went before those stars whose private parts were like those of horses, that first one which went out before them[e][d][c][b]; and they brought them before him.
translation:
  language: zh_hans
  text: 羊的主召来那七个最初的白色之人[a]，吩咐他们把那些星带到他面前，先从那颗走在那些星前头、下体如同马的下体的第一颗星开始——就是那颗在那些星前面出来的第一颗星[c][b]。于是，他们把那些星带到他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文明确称他们为“人”；这里的“白色”属于异象中的形貌或象征标记，不是现代种族称谓，也未明说是衣服的颜色。
    reason: translation_clarity
  - marker: b
    text: 这里的“星”在异象中象征天上的生灵；正文保留“星”的图像。马的比喻则有意呈现羞耻、兽性化的性图像。
    reason: cultural_note
  - marker: c
    text: “就是那颗在那些星前面出来的第一颗星”所在语句在这一埃塞俄比亚语见证中有文字困难；它可能只是再次说明前述领头的第一颗星，而不是另指一个对象。
    reason: textual_variant
lexical_decisions:
- source_word: እግዚአ ሰብኡ
  choice: 羊的主
  rationale: 保留“动物启示录”中的异象称谓及其崇高语体；这里指异象中羊群的主。
- source_word: ሰብአ ፯ጸዓድወ ቀዳማዊያን
  choice: 最先的那七个白色的人
  rationale: ሰብአ 明说“人”，不可省略；“白色的人”保留异象中的颜色标记，又避免用现代汉语中容易带有种族含义的“白人”。
- source_word: ያምጽኡ ቅድሜሁ
  choice: 把那些星带到他面前
  rationale: 体现审判场景中把受审者带到主面前的程序性动作；宾语依后文所指明的众星补出，使汉语清楚自然。
- source_word: እምክቡበ ቀዳማዊ ዘይቀድም እምነ ዝኩ ከዋክብት
  choice: 从走在那些星前头的第一颗星开始
  rationale: 将 እም 按起始次序理解为“从……开始”，并保留“第一”与“走在前头”的双重先行含义。
- source_word: ከዋክብት
  choice: 星
  rationale: 保留启示文学的象征图像，不在正文中直接解释为天使或天上的生灵。
- source_word: ኃፍረቶሙ ከመ ኃፍረተ አፍራስ
  choice: 下体如同马的下体
  rationale: 源文有意使用羞耻而具性意味的身体图像；“下体”在现代汉语中明确而不流于临床化。
- source_word: ዘወፅአ ቅድመ
  choice: 在他们前面出来的那一颗
  rationale: 保留“出来”与“在前面”的动作和先后含义，同时用量词“颗”承接前面的“第一颗星”。
- source_word: ወአምጽእዎሙ ለእሎሙ ቅድሜሁ
  choice: 于是，他们把那些星带到他面前
  rationale: 保留源文对命令执行过程的重复陈述，并明确复数宾语为前述众星。
theological_decisions:
- issue: 是否在正文中把“星”直接解释为天使
  choice: 正文保留“星”
  alternative: 译作“天使”或“天上的生灵”
  rationale: 这一段以异象符号叙事；保留“星”可避免把图像过早化解为解释。
- issue: 如何表达七位受召者的人形与白色特征
  choice: 译作“最先的那七个白色的人”
  alternative: 译作“最先的那七个白者”或“七个最先的白衣人”
  rationale: 源文明确含“人”，而“白衣”会无根据地把身体或形貌的白色改成衣着；采用略带异象色彩的表达，以保留原文的特殊性。
- issue: 如何处理带有性意味的羞耻图像
  choice: 译作“下体如同马的下体”
  alternative: 弱化为“身体像马”或采用更临床化的“生殖器”
  rationale: 原文故意呈现兽性且羞耻的性图像；既不应淡化，也无需用现代医学术语强化。
- issue: 如何理解第一颗星与后面括号内“最先出来者”的关系
  choice: 视为对同一颗领头之星的重述，同时保留文本上的不确定性
  alternative: 理解为另一个独立人物或另一颗星
  rationale: 上下文和重复的“第一／在前”较支持同一指称，但传本中的括号语句文字困难，故不把这一判断绝对化。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。保留异象叙事中“羊的主”“白色的人”“星”等不寻常图像；对重复的司法程序用语不作删减。为避免“白人”的现代种族含义，译作“白色的人”，并以脚注说明。
