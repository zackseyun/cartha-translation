base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/038.yaml
  text: And I saw until all their kinds were transformed[a], and they all became white cattle; and the first among them became a wild ox, and that wild ox became a great beast[d][c][b], and it had great black horns on its head.
translation:
  language: zh_hans
  text: 我观看，直到他们的种类全都改变了[a]，他们也全都变成白牛；他们中间最先的那一头变成野牛[b]，那头野牛又变成一头巨兽，头上长着硕大的黑角。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “种类”也可理解为“族类”或“家族”；这里按动物异象的语境译作“种类”。
    reason: lexical_alternative
  - marker: b
    text: 吉兹语抄本此处读作ነገር，即“话、事”，并带有表示文本可疑的符号。正文“野牛”是依据连续的动物意象及可能的早期传抄或翻译混淆所作的校订性译法；若照现存吉兹语直译，则为：“最先的那一个成了一个‘话’，那个‘话’又成了一头巨兽。”
    reason: textual_variant
  - marker: c
    text: 用户所给的吉兹语转录在“它有……”处中断；末句依据查尔斯1906年版紧接其后的文字补足。
    reason: source_truncation
lexical_decisions:
- source_word: ተወለጠ
  choice: 改变了
  rationale: 这里描写异象中动物的形态或状态发生变化，并非指再次出生；“改变了”自然且不过度解释。
- source_word: አዝማዲሆሙ
  choice: 他们的种类
  rationale: 在动物寓言的语境中，此词指这些受造物所属的类别；“种类”保留了动物分类和象征性的双重意味。
- source_word: አልህምተ ጻዕዳ
  choice: 白牛
  rationale: 原文为集体性的牛类意象，不明确限定性别或年龄；“白牛”简洁保留这一形象。
- source_word: ቀዳማዊ … ማእከሎሙ
  choice: 他们中间最先的那一头
  rationale: 既表达其在群体之中，也保留“第一、最先”的含义，而不擅自解释为地位最高者。
- source_word: †ነገር
  choice: 野牛
  rationale: 现存吉兹语读作“话／事”，且编者以疑误符号标出；这在连续的动物象征中明显难解。依据可能的早期传抄或翻译混淆，并结合上下文，正文采用“野牛”，同时以脚注保留吉兹语见证。
- source_word: አርዌ ዐቢየ
  choice: 一头巨兽
  rationale: 该词组指体形或威势巨大的兽类；“巨兽”符合庄重的启示文学语体。
- source_word: አቅርንት ጸሊም ዐቢይ ዲበ ርእሱ
  choice: 头上长着硕大的黑角
  rationale: 按查尔斯版在所给截断行之后的续文补足；译文保留角为复数所表达的整体形象，不强行指定数目。
theological_decisions:
- issue: 异象中两次出现的疑难词ነገር应如何处理
  choice: 正文依动物寓言的连续意象译作“野牛”，并在脚注说明吉兹语实际读法
  alternative: 直译为“话／事”：最先的那一个成了一个“话”，那个“话”又成了巨兽
  rationale: 吉兹语见证本身已用疑误符号标记该词；若机械译成“话”，会破坏本段严格延续的动物意象。采用“野牛”反映较可能的早期文本含义，但脚注明示推定性质，以免把文本问题隐藏起来。
- issue: 是否把“最先的”解释为特定弥赛亚身份或历史人物
  choice: 只保留次序或首位含义，不点明身份
  alternative: 在正文中解释为某一特定救赎人物
  rationale: 本节的词句本身只说明“最先的／第一的”，不足以要求某一宗派或特定历史身份的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“白牛”“野牛”“巨兽”“黑角”维持动物异象鲜明而紧凑的画面；不把象征对象直接解释为任何特定人物。疑难读法和截断续文均在脚注公开说明。
