base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/028.yaml
  text: And I stood watching until that old house was folded up[a]; and they carried out all the pillars, and all the beams and ornaments of that house were folded up with it[c][b], and they carried it out and set it down in one place in the south of the land.
translation:
  language: zh_hans
  text: 我站着观看，直到那座旧房子被卷起来[a]。他们把所有柱子搬了出去；那座房子的一切栽植之物和梁木，也同它一起被卷起来[b]。他们又把它搬出去，安放在大地的南方[c]一个地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卷起来”也可译作“包裹起来”或“拆收起来”。这里描绘旧建筑被整体收起移走，并非只说它遭到毁坏。
    reason: lexical_alternative
  - marker: b
    text: “栽植之物”或作“植物”“栽种之物”。原文把它们与房子的梁木并列，并说二者同房子一起被卷起来。
    reason: lexical_alternative
  - marker: c
    text: 直译“在大地的右手边”。在古代以东方为前方的方位表达中，右边通常就是南方。
    reason: lexical_alternative
lexical_decisions:
- source_word: ቆምኩ አርእይ
  choice: 我站着观看
  rationale: 保留异象叙事中持续站立观看的意味；“观看”比单纯“看见”更能表达动作的延续。
- source_word: ተጠወም / ተጠውሙ
  choice: 被卷拢起来
  rationale: 该动词重复用于旧房子及其组成部分，意象是将其卷起、裹起或收拢，而非单纯毁坏；“卷拢起来”既具体又保留异象的奇特张力。
- source_word: ቤት ብሉይ
  choice: 旧房子
  rationale: 直译“旧的房子”，不径自解释为“旧圣殿”，让圣殿象征由上下文呈现。
- source_word: አውፅእዎሙ / አውፅእዎ
  choice: 搬了出去 / 把它搬出去
  rationale: 该使役动词表示带出、移出；在柱子和整座房子被处理的场景中，“搬出去”自然且具体。
- source_word: አዕማድ
  choice: 柱子
  rationale: 明确的建筑用语，现代汉语自然清楚。
- source_word: አትክልት
  choice: 栽植之物
  rationale: 本义涉及植物、栽种之物；采用较宽的表达，既不将其误作建筑装饰，也容纳房子周围栽植物的可能。
- source_word: ሤስ
  choice: 梁木
  rationale: 按建筑语境理解为木制结构构件；“梁木”比泛称“木料”更贴合与柱子并列的画面。
- source_word: ምስሌሁ
  choice: 同它一起
  rationale: 明确梁木和栽植之物与旧房子一同被卷拢。
- source_word: ወወደይዎ
  choice: 安放
  rationale: 表示搬出后将其放置在某处；“安放”庄重自然，又不暗示摔下或遗弃。
- source_word: በ፪መካን
  choice: 在……一个地方
  rationale: 表达单一、特定的安置地点，不额外推断其性质。
- source_word: በየማነ ምድር
  choice: 大地南边
  rationale: 原文直称“大地的右手边”；按面向东方的古代方位表达通常指南方，正文采用自然方位，直译保留于脚注。
theological_decisions:
- issue: “旧房子”是否应明确译为圣殿
  choice: 旧房子
  alternative: 旧圣殿 / 从前的圣殿
  rationale: 原文使用普通的“房子”一词。虽然上下文具有圣殿象征，正文不替原文把象征解释坐实，以保留其神学与文学张力。
- issue: 旧房子的结局是否应译成“拆毁”
  choice: 被卷拢起来
  alternative: 被拆除 / 被毁坏
  rationale: 原文动词呈现收卷、包裹或撤去的特殊意象；译成“拆毁”会过早将异象简化为毁灭性判断。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“旧房子”与“卷拢起来”刻意保留异象的具体奇特感，不用“圣殿”或“毁灭”等解释性较强的词。分成三句以理清原文连续并列结构，同时保留观看、搬出、卷拢、安放的动作次序。
