  rationale: 作轻微修订以提升现代标准汉语的自然度，并更紧贴原文反复出现的“各自的时候”。保留“这样”的指示意义、牧人的寓言形象、交接到手中的具体意象及原文交接句的歧义说明；未对牧人的象征身份作解释性定论。
