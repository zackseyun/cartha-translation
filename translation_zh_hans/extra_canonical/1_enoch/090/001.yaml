base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/001.yaml
  text: And I saw until the time when thirty-seven shepherds were pasturing in this way[a], and they all completed their periods, each in its time, like the former ones; and others received them into their hands, to pasture them in their times[c][b], each shepherd in its time.
translation:
  language: zh_hans
  text: 我看见，直到三十七个牧人这样牧放羊群的时候[a]。他们都像先前的牧人一样，各自到了自己的时候，就完成了任期；随后，另一些牧人把羊群接到他们手中，好在各自的时候牧放它们[b]——每个牧人都按自己的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可断作：“我看见，直到那时；三十七个牧人正这样牧放羊群。”吉兹语表达较为紧缩，但“这样”明确指向异象中先前所述的牧放方式。
    reason: 句法歧义与语义保留
  - marker: b
    text: 交接一语在吉兹语中较为紧缩。这里按上下文将所接收的对象理解为羊群：一批牧人完成自己的时候后，另一批依次接手牧放。反复出现的“时候”强调每批牧放都有其限定的时段。
    reason: 原文主宾关系紧缩及时间语汇重复
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我观看
  rationale: 保留异象叙事的第一人称观看公式；“观看”比单纯的“看见”更适合其持续观察直至某一时点的语境。
- source_word: እስከ ዘመን ዘከመዝ
  choice: 直到……这样……的时候
  rationale: 既表达 እስከ ዘመን 的时间推进，也保留 ከመዝ“这样、以这种方式”的指示意味，不将其简化为单纯的“那时”。
- source_word: ይርዕዩ
  choice: 牧放羊群
  rationale: 保留动物启示录中的牧羊图景；补出语境中隐含的“羊群”，使现代汉语自然，同时不把牧人解释为天使或统治者。
- source_word: ፴ወ፯ ኖላዊያን
  choice: 三十七个牧人
  rationale: 按原文数字直译，并保留象征性称谓“牧人”。
- source_word: ፈጸሙ ኵሎሙ በበጊዜሆሙ
  choice: 他们都……各自在自己的期限内完成了任期
  rationale: ፈጸሙ 表示完成，反复出现的 ጊዜ 指各自所分配的时段；“任期”明示汉语中必要的隐含宾语，但不额外说明任命者。
- source_word: ከመ ቀዳማዊያን
  choice: 像先前那些牧人一样
  rationale: 明确其回指前文的牧人，使汉语指代清楚。
- source_word: በዐዳን ተመጠውዎሙ ውስተ እደዊሆሙ
  choice: 另一些牧人把羊群接到自己手中
  rationale: 保留“到手中”的交接意象；原文主宾关系较紧缩，按随后“牧放它们”的目的从句，将复数宾语理解为羊群，并以脚注说明歧义。
- source_word: ከመ ይርዐይዎሙ በበጊዜሆሙ
  choice: 好在各自的期限内牧放它们
  rationale: 以目的结构译出 ከመ，并保留牧放的具体比喻及逐批轮替的时间安排。
- source_word: ኵሉ ኖላዊ በጊዜሁ
  choice: 每个牧人都有自己的期限
  rationale: 保留总结性的逐一分配表达，强调每个牧人各有其时，而非无限期履职。
theological_decisions:
- issue: “牧人”的象征身份
  choice: 正文只译作“牧人”，不作身份解释
  alternative: 天使、统治者、监督者
  rationale: 本节以寓言形象呈现这些角色；原文在此没有直接解开其象征身份，因此译文保留这一神学与文学张力。
- issue: 各牧人所得时间的性质
  choice: 译作“期限／任期”，强调有限且依次轮替的时段
  alternative: 将其解释为明确由上帝预定的任期
  rationale: 原文反复强调各有其时，但本句没有明说是谁分配这些时段；译文呈现其限度与次序，不补入未明说的施事者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“牧放羊群”“接到自己手中”保留寓言的具体图景；“期限／任期”使反复的时间用语清楚可读。避免把牧人的象征身份教派化或过度解释。
