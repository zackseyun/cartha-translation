base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/022.yaml
  text: And he said to that man who was writing before him[a], who was one of those seven white ones, and he said to him, “Take those seventy shepherds to whom I delivered the sheep; and they, taking them[c][b], killed many more than I commanded them.”
translation:
  language: zh_hans
  text: 他对那在他面前书写的人说——那人是那七位白色者中的一位——又对他说：“把那七十个牧人带来；我曾把羊群交给他们，他们却把羊带走，杀的羊远比我吩咐他们杀的多。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲ
  choice: 人
  rationale: 该词通常指男性人物；此处保留异象中拟人化的天上书记形象，但现代汉语用“人”已足够自然。
- source_word: ዘይጽሕፍ
  choice: 书写
  rationale: 关系式动词具有进行中的意味；“在他面前书写”既保留动作，也符合叙事场景。
- source_word: በቅድሜሁ
  choice: 在他面前
  rationale: 保留原文空间性和审判庭般的场景，比单纯“在他前面”更自然庄重。
- source_word: ፯እምነ ዝኩ ፯ጻዕዳው
  choice: 那七位白衣者中的一位
  rationale: “白衣者”自然传达白色标志，又不把这些天上人物直接解释为天使。
- source_word: ንሥኦሙ
  choice: 把……带来
  rationale: 此命令出现在审判场景中，含带走或拘提之意；“带来”在汉语中自然，并避免过度指定拘捕方式。
- source_word: ፸ኖሎት
  choice: 七十个牧人
  rationale: 保留《动物异象》的牧养象征，不解释为天使或统治者。
- source_word: መጠውክዎሙ
  choice: 交给他们
  rationale: 表达把羊交入其管理之下；上下文已经显出托付含义，无须加解释性词语。
- source_word: አባግዐተ
  choice: 羊群
  rationale: 汉语中“羊群”作整体受托对象自然，同时仍保留贯穿异象的羊之意象。
- source_word: ነሢኦሙ ቀተሉ
  choice: 他们却把羊带走，杀死
  rationale: 保留分词加限定动词的动作次序；依近接先行词将代词理解为羊，并以“却”显出受托与滥杀之间的反差。
- source_word: ብዙኃነ እምዘ አዘዝክዎሙ
  choice: 杀死的数目远超过我所吩咐他们的
  rationale: 明确表达他们越过所领受命令的数量界限，同时不改写成完全没有得到杀戮授权。
theological_decisions:
- issue: “七十个牧人”的身份
  choice: 正文保留象征性称谓“七十个牧人”
  alternative: 七十位天使／七十个统治者
  rationale: 原文有意采用启示文学的牧养意象；直接释为天使或统治者会消除其象征张力。
- issue: 牧人施行杀戮与命令的关系
  choice: 译作他们所杀的数目超过所受吩咐
  alternative: 他们在完全没有命令的情况下杀戮／他们所杀超过为他们预定的数目
  rationale: 吉兹语最自然地表示越过真实命令所设的限度，既承认委派，又保留受托者滥用权柄的神学张力。
- issue: 重复的引语框架
  choice: 保留“说……又对他说”
  alternative: 合并为一次“说”
  rationale: 原文在插入身份说明后以第二个ወይቤሎ恢复主句；保留重复可呈现启示文学叙事的原貌。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“白衣者”保留颜色象征；破折号标示插入的身份说明，同时保留原文恢复引语时重复的“又对他说”。本节无需脚注。
