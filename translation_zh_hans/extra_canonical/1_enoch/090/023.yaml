base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/023.yaml
  text: And behold[a], I saw all the prisoners, and they all stood before him.
translation:
  language: zh_hans
  text: 看哪，我看见所有被囚的人[a]；他们全都站在他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被囚的人”也可译作“被捆绑的人”或“俘虏”。吉兹文着重于他们受到拘束的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወናሁ
  choice: 看哪
  rationale: 保留异象叙事中引人注意的指示性套语及启示文学的庄重语气；在现代中文中比单纯译作“于是”更能传达原文力度。
- source_word: ኵሎሙ
  choice: 所有／全都
  rationale: 原文在本节重复该词。分别译作“所有”和“全都”，既保留两次总括性的强调，也使中文自然流畅。
- source_word: እሱራነ
  choice: 被囚的人
  rationale: 该词指受捆绑、拘禁的人。“被囚的人”准确表达其受拘束的状态，同时不在正文中进一步判定其具体身份。
- source_word: ርኢኩ
  choice: 我看见
  rationale: 直译第一人称异象报告，符合上下文的叙事顺序。
- source_word: ወቆሙ
  choice: 他们……站
  rationale: 原动词可指站立或起来；在审判性的场景中，“站在他面前”最自然，也不额外断定他们是起身后站立还是本来站着。
- source_word: ቅድሜሁ
  choice: 在他面前
  rationale: 忠实表达处于某人面前或其临在中的意思，并保留原文未在本节明说该人物身份的特点。
theological_decisions:
- issue: 受拘禁群体的身份与措辞
  choice: 正文译作“被囚的人”，不指明他们是星、牧人还是犯罪的天使。
  alternative: “被捆绑的人”或“俘虏”
  rationale: 本节的吉兹文仅按其受拘禁状态称呼他们；具体所指应由上下文提供，不宜在译文中消除这种含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“看哪”保留启示文学语体；分号呈现看见与站立两个紧密相连的分句。脚注标记置于“看哪”之后，以遵循所给咨询层的位置，但脚注内容实际说明本节“被囚的人”的词义选择。
