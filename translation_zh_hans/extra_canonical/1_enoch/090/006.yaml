base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/006.yaml
  text: And behold[a], lambs were born from those white sheep, and their eyes began to be opened, and they saw[b], and they cried out to the sheep.
translation:
  language: zh_hans
  text: 看哪，从那些白羊[a]中生出了羊羔；它们开始睁开眼睛、看见，并向羊群呼喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这些白羊”。原文的指示词可理解为近指或远指。
    reason: 保留原文指示词近指／远指的词汇歧义。
lexical_decisions:
- source_word: ነዋ
  choice: 看哪
  rationale: 保留异象叙事中指示、唤起注意的语气，同时符合现代中文庄重文体。
- source_word: መንስኣት
  choice: 羊羔
  rationale: 上下文持续使用羊的象征意象；译作“羊羔”比泛称“幼崽”更能保留具体形象。
- source_word: ተወልዱ
  choice: 生出了
  rationale: 表达出生这一基本意义，并自然承接“从那些白羊中”。
- source_word: እምዝኩ አባግዕት ጻዓዳ
  choice: 从那些白羊中
  rationale: 保留回指性的指示词以及具有象征意义的白色。
- source_word: አኃዙ
  choice: 开始
  rationale: 该动词引出后续一系列未完成式动词，表示动作的起始。
- source_word: አዕይንቲሆሙ ይከሠቱ
  choice: 睁开眼睛
  rationale: 以自然中文表达眼睛开启的意象，并置于“开始”之后。
- source_word: ወይርእዩ
  choice: 看见
  rationale: 与“睁开眼睛”并列，保留从眼睛开启到获得视觉的语义推进。
- source_word: ወይጸርኁ
  choice: 呼喊
  rationale: 表达高声发出的呼声，不额外限定为羊的咩叫。
- source_word: ኀበ አባግዕ
  choice: 向羊群
  rationale: 介词在此最自然地表示呼喊的方向；“羊群”在中文中可清楚指向其余的羊。
theological_decisions:
- issue: 象征性启示文学中的动物意象
  choice: 白羊、羊羔、羊群
  alternative: 白色的那些、幼崽、群体
  rationale: 保留《动物启示录》贯穿始终的具体动物意象，不将象征对象抽象化。
- issue: “开始”所支配的动作范围
  choice: 它们开始睁开眼睛、看见，并向羊群呼喊
  alternative: 它们的眼睛开始被打开；它们看见了，并向羊群呼喊
  rationale: 原文的三个未完成式动词在句法上可共同依附于表示起始的አኃዙ；中文以并列结构保留这一依附关系，避免擅自改成三个完成事件。
translation_notes:
  register: 采用现代、庄重而清楚的简体中文。“看哪”保留异象叙事色彩；主体代词用“它们”，符合动物指称。标点使三个受“开始”支配的动作保持并列。
