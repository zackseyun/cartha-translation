base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/013.yaml
  text: And I saw until the shepherds and the eagles and the vultures and the kites came[a], and they cried out to the ravens to break the horn of that ram; and they fought and battled with him, and he fought with them[c][b], and cried out that his help might come.
translation:
  language: zh_hans
  text: 我一直观看，直到牧人、鹰、秃鹫和鸢都来了。他们向乌鸦呼喊，要它们折断那只公绵羊[a]的角。他们与它交战搏斗，它也与他们交战，并呼喊，求援助临到它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公山羊”。这里的词指有角的雄性羊，具体种类可能有歧义。
    reason: lexical_alternative
  - marker: b
    text: 或译“求它的援助者前来”。原词既可指“援助”，也可指“援助者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: 牧人
  rationale: 本词通常指牧羊人；在《动物启示录》中也是具有特定象征作用的形象。译作“牧人”既自然，也不把象征预先解释为某类历史人物。
- source_word: አንስርት፡ ወዝኩ፡ አውስት፡ ወሀባይ
  choice: 鹰、秃鹫和鸢
  rationale: 按最新校勘所确认的句法，将这三个猛禽名称作为前来者的并列名单；不把后文作为呼喊对象的“乌鸦”误列其中。汉语并列中不机械译出指示成分，以免造成某一种鸟被特别指示的错觉。
- source_word: ቋዓት
  choice: 乌鸦
  rationale: 该词在本句中由介词标示为呼喊的对象，而非前来者名单的一部分；“乌鸦”准确保留动物异象的意象。
- source_word: ይቀትቅጥዎ
  choice: 折断
  rationale: 动词表示猛烈击碎或打断；“折断”与“角”搭配自然，并保留实际破坏的力度。
- source_word: ይቤላ
  choice: 公绵羊
  rationale: 上下文所指为有角的雄性羊；正文采用“公绵羊”以与本异象常见的公羊意象一致，同时以脚注保留“公山羊”的词义可能。
- source_word: ረዳኢቱ
  choice: 援助
  rationale: 该名词可指抽象的帮助，也可指施助者。正文用“援助”保留呼求救助的直接意义，并在脚注注明另一种理解。
theological_decisions:
- issue: 动物启示录中攻击者及公绵羊的身份
  choice: 保留“牧人、鹰、秃鹫、鸢、乌鸦、公绵羊”等异象形象，不在正文中加入历史身份解释。
  alternative: 把这些形象直接译成某些统治者、民族或敌人。
  rationale: 原文以动物和牧人的象征系统叙述事件；直译意象可保留文本本身的多义性，避免把某一种历史或神学解释写入经文。
- issue: 末句所呼求的是“援助”还是“援助者”
  choice: 正文译作“援助”，脚注保留“援助者”。
  alternative: 正文直接译作“援助者”。
  rationale: 源词可作抽象或人格化理解；正文不将其强行人格化，脚注则明确保存另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我一直观看，直到……”保留原文异象叙述中延续观看的句式；“交战搏斗”保留相邻两个争战动词的强化效果。动物统一用“它”，避免在正文中预先把象征对象人格化。
