base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/012.yaml
  text: And those ravens fought and battled with him[a], and they wanted to remove his horn[c][b], but they did not prevail against him.
translation:
  language: zh_hans
  text: 那些乌鸦与他争战[a]，同他搏斗；它们想除掉他的角[b][c]，却不能胜过他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他”也可按敌对语境译作“攻击他”或“与他为敌”；原文介词字面意为“与、同”。
    reason: lexical_alternative
  - marker: b
    text: “角”是异象中的象征性形象，因此保留直译，不在正文中解释为“力量”或“权势”。
    reason: cultural_note
  - marker: c
    text: “除掉”也可译作“移去”；早期译法有“击倒”或“使……倒下”。
    reason: previous_rendering
lexical_decisions:
- source_word: እልኩ
  choice: 那些乌鸦
  rationale: 按《动物启示录》的具体象征意象译作“乌鸦”，不泛化为“鸟”，也不把象征意义直接写进正文。
- source_word: ቋዓት፡ ይትጋደሉ፡ ወይትባአሱ
  choice: 争战……搏斗
  rationale: 原文连续使用冲突性表达，译文保留重复加强的效果，同时采用现代汉语中自然、庄重的措辞。
- source_word: ምስሌሁ
  choice: 与他／同他
  rationale: 该介词字面有“与、同”之意；上下文已清楚表明这是敌对交战，故正文不必改写为纯解释性的“攻击他”。
- source_word: ፈቀዱ
  choice: 想
  rationale: 表达意愿或企图，不把语气加强为已经作出确定安排。
- source_word: ያእትቱ
  choice: 除掉
  rationale: 依据该使役动词“移去、拿走、除去”的词义，译作“除掉”比习语化的“击倒”更贴近此处针对角的动作。
- source_word: ቀርኖ
  choice: 他的角
  rationale: 保留异象中的具体“角”意象，不解释性改译为“能力”“权势”或“统治”。
- source_word: አእህሉዎ
  choice: 不能胜过他
  rationale: 传达乌鸦未能实现其敌对企图；“胜过”既符合争战语境，也保持结语简洁。
theological_decisions:
- issue: 是否在正文中解释“角”的象征意义
  choice: 保留字面的“角”
  alternative: 译作“他的力量”“他的权势”或“他的统治”
  rationale: 本段以持续的动物与角的意象表达启示内容；正文若直接给出象征解释，会消除原文刻意保留的象征张力。
- issue: “与他”是否应解释为“攻击他”
  choice: 正文保留“与他／同他”，由争战动词呈现敌对关系
  alternative: 直接译作“攻击他”或“与他为敌”
  rationale: 这样既贴近介词的字面关系，也不掩盖上下文明确的敌意。
translation_notes:
  register: 采用现代标准书面汉语，句式简洁而庄重。“争战……搏斗”保留原文的重复加强；以“它们”指代乌鸦，符合现代汉语动物叙事习惯。所有脚注标记均置于相关正文词组之后。
