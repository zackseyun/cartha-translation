base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/005.yaml
  text: And I saw until the time when twenty-three were shepherding[a], and they completed, in their respective times[c][b], fifty-eight times.
translation:
  language: zh_hans
  text: 我看见，直到二十三位牧人正在牧养时；他们按各自的时期，共完成了五十八个时期。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“他们各按自己的时候完成了五十八个时候”。这里的“时期”可能指被数算或指定的时段；其具体长度和历史所指并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我看见
  rationale: 采用异象叙事中的常见表达，直接保留第一人称所见的报告形式。
- source_word: እስከ ዘመን
  choice: 直到……的时候
  rationale: 表达异象进程所达到的时间界限，并使现代汉语句子自然。
- source_word: ይሬዐዩ
  choice: 牧养
  rationale: 该词含咽音字母ዐ，来自“放牧、牧养”的词根，并非“看见”的词根；动物启示录的上下文也指向牧人的活动。
- source_word: ፳ወ፫
  choice: 二十三个
  rationale: 直接译出吉兹数字；按上下文补出量词“个”并承接“牧人”。
- source_word: ወፈጸሙ
  choice: 他们……完成了
  rationale: 保留“使之完毕、完成”的基本含义，不另行解释这些时期的历史所指。
- source_word: በበጊዜሆሙ
  choice: 各在自己的时期内
  rationale: 重叠介词具有分配意味，表示各自依次所得或所属的时期。
- source_word: ፶ወ፰ጊዜያተ
  choice: 五十八个时期
  rationale: ጊዜ可指时间、时候或时期；此处处于象征性计数语境，用“时期”比汉语“次数”自然，同时不把它具体化为年数或任期。
theological_decisions:
- issue: 动物启示录中数字单位的性质
  choice: 译作“五十八个时期”
  alternative: 五十八次；五十八个任期；五十八年
  rationale: 原文给出时间单位，却没有在本节明确其长度或历史对应；因此保留概括性的“时期”，不把它解释为年、牧养任期或其他特定年代单位。
- issue: 二十三与牧人之间的句法关系
  choice: 译作“二十三个牧人牧养的时候”
  alternative: 牧养到第二十三个的时候
  rationale: 原文的数词结构较为压缩；依据本段“牧人”的连续语境补明名词，同时不在正文中进一步断定这是人数还是序列编号。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“牧人牧养”刻意保留原文及上下文中的牧人意象；用分号划分所见的时间节点与完成时期的陈述。
