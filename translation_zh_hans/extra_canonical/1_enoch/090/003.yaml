base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/003.yaml
  text: And the sheep cried out because their flesh was being devoured by the birds[b][a], and I looked and lamented in my sleep over that shepherd who was shepherding the sheep.
translation:
  language: zh_hans
  text: 羊群呼喊，因为它们的肉正被飞鸟吞吃[a]；我在睡梦中看着，并为那牧放羊群的牧人哀号[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“飞鸟”，没有明确说“猛禽”；它们正在吞吃羊的肉，已经表明这里具有捕食的意味。
    reason: lexical_alternative
  - marker: b
    text: “哀号”也可译作“哀叹”或“哭号”；原词可以表达出声的悲痛。
    reason: lexical_alternative
lexical_decisions:
- source_word: አባግዕ
  choice: 羊群
  rationale: 该复数名词指羊；译作“羊群”既自然，又保留《动物启示录》的具体动物意象，不直接解释为人群。
- source_word: ጸርኁ
  choice: 呼喊
  rationale: 表达出声的痛苦呼叫；“呼喊”比单纯“哭泣”更贴近动作本身，也不限定为礼仪性的哀哭。
- source_word: ይትበልዑ ሥጋሆሙ
  choice: 它们的肉正被……吞吃
  rationale: 保留未完成、被动的过程感以及“肉”的强烈身体意象；“吞吃”体现异象中的暴力捕食。
- source_word: እምነ አዕዋፍ
  choice: 被飞鸟
  rationale: 在被动结构中表达施事者；原文只说“鸟”，故不在正文中增译为“猛禽”。
- source_word: ነጸርኩ
  choice: 我……看见这一切
  rationale: 这是常见的异象观察动词；补出“一切”使现代汉语衔接自然，但不增添新的异象内容。
- source_word: አውየውኩ
  choice: 哀号
  rationale: 表达先见者带有声音的悲痛反应，并与羊群先前的“呼喊”有所区分；脚注保留较弱的“哀叹”译法。
- source_word: በንዋምየ
  choice: 在睡梦中
  rationale: 兼顾字面的“在我的睡眠中”和本段梦境异象的语境；比单说“梦中”更保留睡眠含义。
- source_word: ኖላዊ
  choice: 牧人
  rationale: 保留贯穿本异象的牧羊象征；现代汉语中“牧人”庄重自然。
- source_word: ዘይርዕዮሙ ለአባግዕ
  choice: 牧放羊群的
  rationale: 关系从句描述牧人的实际职责；“牧放”保留牲畜意象，同时避免重复为“牧养羊群的牧人”所造成的拗口。
theological_decisions:
- issue: 是否在正文中直接解释动物象征所指的历史人物或群体
  choice: 保留羊群、飞鸟和牧人的异象形象
  alternative: 将其直接译成人民、敌人和统治者
  rationale: 原文以动物异象表达意义；正文应保存其象征张力，不把解释代替翻译。
- issue: “飞鸟”是否应明确译为“猛禽”
  choice: 正文译“飞鸟”，脚注说明捕食含义
  alternative: 正文译“猛禽”或“食肉鸟”
  rationale: 吞吃羊肉的语境显然具有捕食意味，但原词本身泛指鸟；不应把语境推断写成词义明示。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。保留“肉”“飞鸟”“牧人”等具体异象词汇；以“正在……吞吃”呈现持续受害的过程，并用“哀号”保持启示文学场景的强烈情感。
