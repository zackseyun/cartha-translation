base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/025.yaml
  text: And those shepherds were judged and were found to be sinners[c][b][a], and they were cast into that abyss of fire.
translation:
  language: zh_hans
  text: 那些牧人受了审判，被认定为罪人[a]，并被投入那火的深渊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被认定为罪人”也可较直译为“成了罪人”；在这里的审判语境中，这句话带有被判明有罪的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: 那些
  rationale: 此处是连接词加指示语，意为“而那些”，不是“我看见”；中文承接上文时用“那些”自然且准确。
- source_word: ኖላዊያን（转写文本作 ሮ*ኖላዊያን）
  choice: 牧人
  rationale: 可辨识的吉兹语词义为“牧人”，语境指前文受审的牧人；转写中的星号反映文本/OCR异常，不应据此改作“象”。
- source_word: ተኰነኑ
  choice: 受了审判
  rationale: 保留司法场景中的被动意义，而不预先把审判具体化为定罪或判刑。
- source_word: ወኮኑ ኃጥኣነ
  choice: 被认定为罪人
  rationale: 字面结构近于“成为罪人”，但在审判语境中表达被判明或认定为罪人；此译兼顾道德称谓与司法语气。
- source_word: ወተወድዩ እሙንቱ
  choice: 并被投入
  rationale: 表达被动、强制进入的动作；中文不必重复独立代词“他们”。
- source_word: ውስተ'ዛ ማዕምቀ እሳት
  choice: 那火的深渊
  rationale: 保留指示语、深渊及火的意象；不增添原文没有的“极深”，也不将其解释性地译成“地狱”。
theological_decisions:
- issue: 受审者的身份
  choice: 译作“那些牧人”
  alternative: 那些象；那些兽
  rationale: 现存词形的核心可辨识为“牧人”，且与本章七十位牧人的审判场景吻合。保留叙事中的象征称谓，不以历史或神学解释替换。
- issue: ኃጥኣነ 的道德与司法含义
  choice: 译作“被认定为罪人”
  alternative: 成了罪人；被判有罪
  rationale: “罪人”保留原词的道德—宗教力度，“被认定为”则呈现审判语境；避免只译“有罪”而抹去原文称谓，也避免“成了”被误解为此刻才开始犯罪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“火的深渊”保留启示文学意象；不沿用英文资料中已被校正的“象”或“我看见”。
