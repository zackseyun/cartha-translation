base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/016.yaml
  text: And all the eagles and the vultures and the ravens and the kites gathered together and came with them, with all the wild sheep; and they all came together and helped one another so as to break the horn of that ram.
translation:
  language: zh_hans
  text: 所有的鹰、秃鹫、乌鸦和鸢都聚集起来，连同所有野羊一同前来；它们全都聚集在一起，彼此相助，要折断那只公绵羊的角。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንስርት
  choice: 鹰
  rationale: 按动物异象中的鸟类名称直译，采用现代汉语常用名称。
- source_word: ዓውስት
  choice: 秃鹫
  rationale: 该词指食腐猛禽；“秃鹫”比泛称“鹫”更便于普通读者理解。
- source_word: ቋዓት
  choice: 乌鸦
  rationale: 保留原文列举的鸟类类别。
- source_word: ሀባይ
  choice: 鸢
  rationale: 依该鸟名在此处的传统词义译作一种猛禽“鸢”，不将其泛化为鹰。
- source_word: አባግዕ ገዳም
  choice: 野羊
  rationale: 字面涉及旷野或野地中的羊；用简明的“野羊”保留其与一般羊群有所区别的表达。
- source_word: ይቀትቅጥዎ
  choice: 折断
  rationale: 该动词表达击碎、打破；角是具体对象，汉语用“折断”自然，同时不强化为彻底粉碎。
- source_word: ቀርነ
  choice: 角
  rationale: 直译异象中的关键意象，不解释为权势或王权。
theological_decisions:
- issue: 异象中动物与角的象征意义
  choice: 保留动物和角的形象，不在正文中解释其历史或神学所指
  alternative: 将角意译为权势，或直接点明各动物代表的群体
  rationale: 原文在本节以异象叙述呈现，直接释义会消除其象征张力并引入特定解释。
- issue: “彼此相助”的阵营关系
  choice: 按原文表述为全体聚集并彼此相助
  alternative: 明确说众鸟和野羊联合对抗公绵羊
  rationale: 保持原句的代词范围与叙事张力，不额外判定各类动物的具体政治或神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。鸟类名称逐项保留，句法略作拆分以避免汉语歧义；“公绵羊”用于区别一般的羊，并与异象中的“角”自然衔接。
