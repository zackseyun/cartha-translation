base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/024.yaml
  text: And judgment took place first upon the stars[a], and they were judged and were found to be sinners, and they went to the place of judgment; and they cast them into an abyss, full of fire and flaming[c][b], and full of pillars of fire.
translation:
  language: zh_hans
  text: 审判首先临到那些星辰[a]；它们受了审判，被判定为罪人，便到了审判之地；他们把它们扔进深渊，那里充满烈火和火焰，又布满火柱。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些星辰”在这个异象中被人格化，代表天上的存在。结合上下文的审判次序，正文译为审判首先临到星辰。
    reason: cultural_note
  - marker: b
    text: 原文反复使用“审判”一词，并逐层铺陈“烈火、火焰、火柱”的景象；译文保留这种重复和累积效果。
    reason: literary_note
lexical_decisions:
- source_word: ኵነኔ
  choice: 审判
  rationale: 保留正式的司法与末世意涵，并与本节同根词的反复相呼应，不预先将程序收窄为“定罪”。
- source_word: ቅድመ እምከዋክብት
  choice: 首先临到那些星辰
  rationale: 结合本段异象中先审判星辰、继而审判牧人的叙事次序，将ቅድመ理解为“首先”，并以“临到”明确星辰是审判对象；脚注保留其可能的空间性读法。
- source_word: ተኰነኑ
  choice: 受了审判
  rationale: 延续审判词根的重复，使审判程序与随后被认定为罪人的结论保持区分。
- source_word: ኃጥኣነ
  choice: 被判定为罪人
  rationale: 既保留“罪人”的道德宗教色彩，也以“被判定”自然连接司法语境。
- source_word: ሖሩ መካነ ኵነኔ
  choice: 到了审判之地
  rationale: 保存原文具体的空间移动和重复的审判用语；在中文中“到了”比机械直译“走到”更自然。
- source_word: ወደይዎሙ
  choice: 人把它们扔进
  rationale: 表达强制投入惩罚之处的动作；原文主语未明，中文以泛指“人”避免擅自指明执行者。
- source_word: ውስተ ዕሙቅ
  choice: 深渊
  rationale: 传达幽深的惩罚性处所及启示文学意象，同时不直接套用后期教义术语。
- source_word: ምሉእ እሳት ወይላህብ
  choice: 充满烈火和火焰
  rationale: 保留原文叠加的火焰意象，而不将两个成分压缩为单一表达。
- source_word: አዕማደ እሳት
  choice: 火柱
  rationale: 简洁、鲜明地再现柱状火焰的异象图景。
theological_decisions:
- issue: 审判用语应表达司法过程还是直接表达定罪结果
  choice: 依次译作“审判”“受了审判”“被判定为罪人”
  alternative: 通篇译作“定罪”“被定罪”
  rationale: 原文先反复使用审判词根，再另述其为罪人；分开表达可保留程序与裁定之间的张力。
- issue: 如何称呼最终的惩罚处所
  choice: 保留“深渊、烈火、火焰、火柱”的具体异象
  alternative: 概括译作“地狱”或“地狱之火”
  rationale: 原文提供的是具体启示文学图景，并未使用后期体系化的处所名称，不宜以教义标签替代。
- issue: 星辰在首句中是审判对象还是审判现场的见证者
  choice: 正文按叙事次序译为审判首先临到星辰
  alternative: 译为“审判在星辰面前进行”
  rationale: 上下文支持星辰是第一批受审者；但介词结构具有“在……面前”的字面可能，因此在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“星辰”保持异象体色彩；“审判之地”“深渊”“火柱”保存原文的司法与启示文学意象。避免使用“地狱”等会把具体图景教义化的词。
