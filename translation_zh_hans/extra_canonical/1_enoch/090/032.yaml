  text: And those sheep all became white, and their hair became thick and pure.
translation:
  language: zh_hans
  text: 那些羊全都变白了，它们的毛又浓密又洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዕ
  choice: 羊
  rationale: 该词为“羊”的复数；上下文以羊象征群体，正文保留异象本身的形象，不在译文中解释所指。
- source_word: ጻዕዳ
  choice: 白
  rationale: 直接表达颜色“白”，并保留其在异象中可能兼具的象征意义。
- source_word: ጸጕረ
  choice: 毛
  rationale: 原词泛指毛发；用于羊时译作“毛”自然，也避免将其过度限定为经过加工意义较强的“羊毛”。
- source_word: ዐቢየ
  choice: 浓密
  rationale: 字面核心义为“大、增多”；修饰羊毛时，“浓密”符合汉语习惯，并与英语审校层的 thick 相合。
- source_word: ንጹሐ
  choice: 洁净
  rationale: 兼顾“干净、纯净”的语义；“洁净”在异象文体中庄重自然，又不强行判定其仅指外观或道德状态。
theological_decisions:
- issue: 羊变白及毛洁净的象征含义
  choice: 只翻译异象图景，不在正文中明说其代表道德洁净、得救或末世更新
  alternative: 将象征义直接译入正文，如“都成为纯洁的人”
  rationale: 原文保留象征性和解释空间；直接释义会消除其文学张力，并引入超出本节措辞的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那些羊全都变白了”对应状态变化；后半句用“又浓密又洁净”保持简洁、流畅的并列结构。
