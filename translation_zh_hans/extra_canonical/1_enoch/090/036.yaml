  text: And I saw that that house became great and broad and exceedingly full[a][b][c].
translation:
  language: zh_hans
  text: 我看见，那座房屋变得又大又宽阔，而且满满的[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在《动物启示录》的象征语境中，“房屋”可能指圣所或圣殿；但本节的吉兹语原文只说“房屋”。
    reason: cross_reference
  - marker: b
    text: “满满的”所译的词语表示“满”的程度极高，也可译作“非常满”；原文没有明说其中充满什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我看见
  rationale: 保留第一人称异象叙事的惯用句式；中文不必机械添加句首“于是”。
- source_word: ከመ ኮነ
  choice: 变得
  rationale: 表达状态的变化，而非静态的“是”。
- source_word: ውእቱ ቤት
  choice: 那座房屋
  rationale: 译出指示成分；ቤት 本身是“房屋”，不在正文中直接限定为圣殿。
- source_word: ዐቢየ
  choice: 高大
  rationale: 在房屋意象中自然表达其宏大，同时保留“大”的空间意味。
- source_word: ወርኂበ
  choice: 宽阔
  rationale: 准确传达宽广、宽敞之意，并与“高大”形成自然并列。
- source_word: ወምሉአ ፈድፋደ
  choice: 并且极其充盈
  rationale: 按句法将 ምሉአ 视为与“高大、宽阔”并列的表语形容词，并将 ፈድፋደ 理解为加强程度的副词“极其”，避免误译成抽象名词“丰盛”。
theological_decisions:
- issue: 是否把 ቤት 明译为“圣殿”或“圣所”
  choice: 房屋
  alternative: 圣殿／圣所
  rationale: 《动物启示录》的象征语境可能指向圣殿或圣所，但吉兹语正文只写“房屋”；正文保留其本义，象征性辨识置于脚注。
- issue: 是否补出房屋中所充满的对象
  choice: 不补出对象
  alternative: 充满羊群／充满其中的人
  rationale: 本节未明说充满什么；即使上下文可能提供所指，正文仍保留原文的省略和开放性。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“又高大又宽阔”使并列结构符合自然汉语；“充盈”较“满”庄重，也能保留宾语未明的原文结构。
