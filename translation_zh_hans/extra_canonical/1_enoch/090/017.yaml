base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/017.yaml
  text: And I saw until that man[a], who was writing a book by the word of the Lord, opened that book of destruction which those twelve shepherds had wrought[e][d][c][b], and he showed before the Lord of the sheep that they had destroyed much more than those before them.
translation:
  language: zh_hans
  text: 我观看，直到那按主的话写书的人[a]打开了那卷毁灭之书，就是关于那十二个牧人所造成的毁灭[b]；他在群羊之主[c]面前表明：他们所毁灭的，比他们以前的那些牧人所毁灭的多得多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我观看，直到那按主的话写书的人……打开”；“人”在异象中可能指一位具有人形的天上书记，但本节没有直接称他为天使。
    reason: cultural_note
  - marker: b
    text: 这句话的吉兹语结构较难，也可较直译为“那卷十二个牧人所毁坏的毁灭之书”。正文依上下文理解为书卷所涉及的是十二个牧人造成的毁灭。
    reason: textual_variant
  - marker: c
    text: “群羊之主”是本异象在动物意象中使用的称号，故不以一般性的“神”或“主”代替。
    reason: cultural_note
lexical_decisions:
- source_word: ወርኢክዎ ... እስከ
  choice: 我观看，直到
  rationale: 保留本章反复出现的异象叙事格式“我观看，直到……”，虽在现代汉语中略显特殊，却能体现原文的公式性和持续观看的意味。
- source_word: ብእሲ
  choice: 人
  rationale: 原词通常指“人”或“男子”。这里可能是具有人形的天上书记，但译作“人”可避免把原文没有明说的身份写进正文。
- source_word: ዘይጽሕፍ መጽሐፈ
  choice: 写书的人
  rationale: 保留写作和书卷的具体意象；上下文表明这是正在进行或具有特征性的行动。
- source_word: በቃለ እግዚአ
  choice: 奉主的话
  rationale: 介词短语可表示凭借、授权或遵照；“奉主的话”在中文中自然地表达由主的话语授权，同时不把它窄化为单纯命令。
- source_word: ፈትሖ ለውእቱ መጽሐፈ
  choice: 打开了那卷……书
  rationale: 动词的直接意义是“打开”；不译作“揭开封印”，以免加入原文未明说的封印意象。
- source_word: መጽሐፈ ሐጕል
  choice: 毁灭之书
  rationale: 名词表示毁灭、败坏或灭亡；“毁灭之书”保留审判场景的庄严语气，又不引入后世特定的神学术语。
- source_word: ዘአሕጐሉ እልኩ ፲ወ፪የአቱ ይኃርያን
  choice: 关于那十二个牧人所造成的毁灭
  rationale: 原文关系结构生硬，可能在语法上与“书”或“毁灭”相连。正文按语境理解为书中涉及十二个牧人造成的毁灭，并用脚注保留较直译的可能。
- source_word: አርአዩ
  choice: 他……指明
  rationale: 单数动词承接前述写书的人；“指明”兼顾“展示、使看见”的意义及审判场景中的举证意味。
- source_word: ፈድፋደ እምቅድሜሆሙ
  choice: 远比他们以前的那些牧人……更多
  rationale: እምቅድሜሆሙ 直译为“比他们以前的那些”，最自然地指先前的牧人；不添入“所命定的限额”等原文没有明说的概念。
- source_word: ቅድመ እግዚአ አባግዕ
  choice: 在群羊之主面前
  rationale: 保留动物异象中对神的特有称号及“在……面前”的呈示、审判语气。
theological_decisions:
- issue: 写书之人的身份
  choice: 正文只称其为“人”
  alternative: 天使；书记天使；那个人影
  rationale: 吉兹语用的是“人”，异象中的天上存在虽可能以人形出现，正文却未在本节明确称其为天使。
- issue: 十二个牧人毁灭得“更多”的比较对象
  choice: 他们以前的那些牧人
  alternative: 超过交付给他们的限度；超过先前所命令的
  rationale: 原文短语字面指“比他们以前的那些”，与七十牧人的先后序列吻合；“命令”或“限额”在本短语中没有明文依据。
- issue: “毁灭之书”与十二个牧人所行之事的关系
  choice: 理解为记载或涉及十二个牧人所造成毁灭的书
  alternative: 十二个牧人所毁坏的那卷书
  rationale: 原文关系从句存在结构歧义。上下文较支持书卷记载其毁灭行为，但不应无说明地排除关系从句直接修饰“书”的读法，因此以脚注保存另一可能。
- issue: “群羊之主”的指称
  choice: 保留异象内部的称号
  alternative: 主；神
  rationale: 该称号属于动物启示录的象征体系，直接换成一般神名会削弱原文意象。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。“我观看，直到……”刻意保留本章异象公式；“毁灭之书”“群羊之主”保留象征世界的具体措辞。末句避免补入“受命限额”，按字面比较十二个牧人与其前任的毁灭程度。
