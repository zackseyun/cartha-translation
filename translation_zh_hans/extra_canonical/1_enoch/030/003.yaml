base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/003.yaml
  text: And by the edges of those valleys I saw fragrant cinnamon[c][b][a], and beyond them I went toward the east.
translation:
  language: zh_hans
  text: 我在那些山谷的边缘看见了芬芳的肉桂[a]；越过那里，我便向东方走去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉桂”也可理解为肉桂类的芳香香料植物。
    reason: lexical_alternative
  - marker: b
    text: “越过那里”所对应的原文也可理解为“在它们之外”或“经过它们”；“向东方走去”直译可作“向东方接近”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ክንፈሩ ለቈላት
  choice: 那些山谷的边缘
  rationale: ክንፈር在此地形语境中指边、沿或边缘；ቈላት指山谷。译作“山谷的边缘”既贴近原文，也符合现代汉语。
- source_word: ቀናንሞስ ዘመዓዛ
  choice: 芬芳的肉桂
  rationale: ቀናንሞስ是指肉桂一类香料植物的借词，ዘመዓዛ说明其香气；用具体植物名保留异象中的感官意象。
- source_word: ዲበ እልንቱ
  choice: 越过那里
  rationale: 该介词结构可表示在其上、其外或越过所指地点；结合后续行进动作，译作“越过那里”自然，同时以脚注保留空间关系上的歧义。
- source_word: ቀረብኩ መንገለ ጽባሕ
  choice: 我便向东方走去
  rationale: ቀረብኩ本义含接近、趋近之意，መንገለ表示朝向，ጽባሕ在地理语境中指东方。整句译作自然的行进表达，不把动作误解为已经抵达。
theological_decisions:
- issue: 异象地貌中芳香植物名称的处理
  choice: 肉桂
  alternative: 桂皮、芳香植物
  rationale: 原词指向一种具体的肉桂类香料。保留具体名称能维护启示文学鲜明的视觉与嗅觉意象，而不将其泛化。
- issue: 向东方行进的完成程度
  choice: 向东方走去
  alternative: 走近东方／接近东方
  rationale: 原文有趋近、朝向的动态，但未明确表示抵达；“走去”保留行进而避免添加终点已达的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“芬芳的肉桂”保留异象的感官细节；分号清楚呈现看见植物与继续东行两个连续动作。
