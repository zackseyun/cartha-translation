base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/001.yaml
  text: And above them[a], above those mountains of the east, not far away, I saw another place, a valley of waters[c][b], as though it were inexhaustible.
translation:
  language: zh_hans
  text: 在它们上方[a]——在东方那些山岭之上[b]——离得不远，我看见另一处地方：一处有众水的山谷，仿佛永不枯竭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它们”回指上文异象中的景物；原文没有在本节重新明确其所指。
    reason: 指代歧义
  - marker: b
    text: 底本文字在“山岭”一词处较难确定；这里依校勘理解为“东方那些山岭”，也有可能读作较笼统的“那些山岭”。
    reason: 文本异文
  - marker: c
    text: 末句原文较难确定，也可译作“仿佛无法被排干”或“仿佛流不尽”。
    reason: 词义选择
lexical_decisions:
- source_word: ላዕሌሁ / ላዕለ
  choice: 在……上方／在……之上
  rationale: 保留重复的空间方位表达，呈现异象中层叠的地理景象。
- source_word: እሙንቱ
  choice: 它们／那些
  rationale: 保留对上文景物的复数回指；在“那些山岭”中则自然表达指示作用，不擅自限定具体所指。
- source_word: ተደብረ ጽባሕ
  choice: 东方那些山岭
  rationale: 依据校勘说明，将疑似受讹写影响的形式理解为“山岭”的复数结构，并把ጽባሕ按“东方”处理，而非误作“我看见”。
- source_word: አኮ ርሑቀ
  choice: 离得不远
  rationale: 以自然现代汉语表达相对接近的空间关系，并保留其在看见另一地点之前的叙述位置。
- source_word: ወርኢኩ
  choice: 我看见
  rationale: 准确呈现第一人称异象报告公式，不额外强化为“看哪”或“我定睛观看”。
- source_word: መካነ ካልአ
  choice: 另一处地方
  rationale: 既保留地点意义，也体现异象行程转向另一个区域。
- source_word: ቈላ ማያት
  choice: 一处水谷
  rationale: 简洁保留“谷地”与“众水”的组合意象，不把它具体化为溪流、河道或其他未经明说的水体。
- source_word: ከመ ዘኢይትዌጸእ
  choice: 仿佛永不枯竭
  rationale: 表达否定性的“不耗尽／不流尽”含义，同时以“仿佛”保留异象描述的印象性和原句的语义不确定性。
theological_decisions:
- issue: 异象地理应按具体景观呈现，而不在正文中寓意化
  choice: 译作实际所见的“另一处地方……一处水谷”
  alternative: 把谷地直接解释为某种属灵象征，或泛化为“有水的地方”
  rationale: 原文以具体地貌描绘启示性的宇宙地理；译文保留这种启示文学张力，不代替文本作神学解码。
translation_notes:
  register: 采用现代、庄重而清晰的叙述语体。“水谷”略具异象文学色彩，用来紧凑保留原文“谷地＋众水”的结构；其余句法按现代汉语调整，同时保留重复的上方方位和具体地貌。
