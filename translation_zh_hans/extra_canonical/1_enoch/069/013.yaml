base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/013.yaml
  text: This is the secret of Kasbeel[a], the chief of the oath which he showed to the holy ones when he dwelt in glory on high[d][c][b], and its name is Biqa.
translation:
  language: zh_hans
  text: 这是关于卡斯贝勒的秘密[a]：他是那誓言的首领；他在至高的荣耀中居住时，曾将这誓言指示给众圣者[b]。其名为比卡[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秘密”所对应的吉兹语词在本节中的确切含义与句法关系仍有讨论；有学者将其与“数算、数目”相关的词义联系起来。但按本节语境，正文采用“秘密”。
    reason: lexical_alternative
  - marker: b
    text: “众圣者”在这一异象语境中很可能指天上的圣者，但原文只说“圣者们”，正文不进一步限定。
    reason: cultural_note
  - marker: c
    text: “其”所指并不完全明确，可能指前述誓言或与之相关的名称；也有人理解为指卡斯贝勒，即“他的名字是比卡”。
    reason: alternative_reading
lexical_decisions:
- source_word: ጐልቁ
  choice: 数目
  rationale: 该词源于“数算、编号”的词根，基本义为“数目、总数”；尽管上下文含义不易确定，仍不据语境改译为“秘密”或“第三个名字”。
- source_word: ካስብኤል
  choice: 卡斯贝勒
  rationale: 按吉兹语形式音译人名，不赋予推测性的词义。
- source_word: ርእሰ ማሐላ
  choice: 誓言的首领
  rationale: ርእሰ 本义为“头、首”，与“誓言”连用时保留其居首或统领的含义，不扩展为秘传称号。
- source_word: ዘአርአዩ
  choice: 将这誓言指示给
  rationale: 该使役动词表达“使看见、指示”；“指示”兼顾原文的展示意味和启示语境。
- source_word: ለቅዱሳን
  choice: 给众圣者
  rationale: 直译为“圣者们”，保留其可能指天上众圣者的末世异象用语，而不在正文中明确限定为天使。
- source_word: ሶበ ኆደሩ
  choice: 居住时
  rationale: 按时间从句处理；动词可有停留、居住之意，这里采用自然而庄重的“居住”。
- source_word: በልዑል በስብሐት
  choice: 在至高的荣耀中
  rationale: 保留“至高”与“荣耀”两个要素；原文介词结构可表达处于崇高荣耀之中。
- source_word: ወስሙ ቢቃ
  choice: 它的名字是比卡
  rationale: 代词的先行词并不完全明确；正文采用中性的“它”，避免武断判定是誓言、数目、名称或卡斯贝勒本人。
theological_decisions:
- issue: “众圣者”的身份
  choice: 正文保留“众圣者”
  alternative: 明确译作“众天使”或“圣徒”
  rationale: 异象的天上语境使天上存在者较为可能，但原文没有在此明说，故不消除其指涉上的张力。
- issue: “誓言”的性质
  choice: 按字面译作“誓言”
  alternative: “咒誓”“祈使秘语”或“与名字相连的神秘公式”
  rationale: 原词通常指誓言；扩大为神秘公式会超出本节直接证据。
- issue: 末句代词的指向
  choice: 用“它”保留非人格指向及歧义
  alternative: “他的名字是比卡”
  rationale: 语法与上下文不能完全排除指向卡斯贝勒，但较近的概念可能是所启示的誓言或相关名称，故以脚注说明。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。正文尽量贴近吉兹语句法，同时适度分句以免关系从句过长；对“数目”、众圣者身份及末句代词均保留原文的不确定性。
