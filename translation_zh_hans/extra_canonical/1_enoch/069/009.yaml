base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/009.yaml
  text: And he taught humankind writing with ink and paper[a], and because of this many have gone astray from eternity to eternity[c][b], even to this day.
translation:
  language: zh_hans
  text: 他教人类用墨和纸书写[a]；因此，许多人从永世到永世都走入歧途，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给埃塞俄比亚文转写在此处似有讹误；按经审校的读法，这句话是“教他们用墨和纸书写”。“纸”也可泛指纸草等书写材料。
    reason: textual_variant
lexical_decisions:
- source_word: መሀሮሙ（校勘所据；所给转写作አበወዎሙ）
  choice: 他教人类
  rationale: 依据审校所指出的较可靠读法，动词意为“教导”；受词按集体意义译为“人类”，并由上文承接单数主语。
- source_word: በቀለም፡ ወበክርታስ（校勘所据；所给转写残损）
  choice: 用墨和纸书写
  rationale: 保留写作所用的两种具体媒介；“纸”自然易懂，也可涵盖古代纸草或书写材料，具体材质在脚注说明。
- source_word: ብዙኃን፡ እለ፡ ይስሕቱ
  choice: 许多人……一直误入歧途
  rationale: 译出“许多人”和偏离正道的持续状态；“误入歧途”同时保留认知与道德层面的含义。
- source_word: እምዓለም፡ ወእስከ፡ ለዓለም
  choice: 从永世到永世
  rationale: 尽量保留ዓለም的重复和启示文学的庄重节奏，不将其简化为普通的“永远”。
- source_word: ወእስከ፡ ዛቲ፡ ዕለት
  choice: 直到今日
  rationale: 这是自然、庄重的现代汉语时间表达，并与前面的持续语气相配。
theological_decisions:
- issue: 传给人类之事的性质
  choice: 教人类使用墨和纸书写
  alternative: 把苦毒和欺骗的书写板交给人类
  rationale: 所给埃塞俄比亚文转写似有严重讹误；依据审校恢复的读法，应是对书写技术的教导。脚注仍说明文本困难，避免假装校勘毫无疑问。
- issue: “从永世到永世”的时间含义
  choice: 保留原有重复结构
  alternative: 世世代代／永远
  rationale: 原表达可能是启示文学中的公式化永恒用语，也可理解为“从一个时代到另一个时代”；正文保留张力，脚注列出另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“书写”比“写作”更贴近文字技术；用分号分开教导行为及其后果。正文中的脚注标记[a]、[b]均与脚注对应。
