base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/020.yaml
  text: And by that oath the sun and the moon complete their courses[d][c][b][a], and they do not transgress their command forever.
translation:
  language: zh_hans
  text: 借着那誓言，太阳和月亮走完各自的行程[a]，永不违背所受的命令[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行程”也可译作“运行”或“轨道”；原词指日月规律性的运动。
    reason: lexical_alternative
  - marker: b
    text: “永不违背所受的命令”也可译作“永不偏离所受的命令”或“不违越为它们所定的命令，直到永远”。末尾的盖兹语短语在否定句中通常表示“永不”，但也带有绵延久远的时间意味。
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ ማሐላ
  choice: 借着那誓言
  rationale: 介词连同指示词在这里自然表示凭借或途径；“誓言”保留原文庄严、约束性的末世文学色彩。
- source_word: ፀሐይ ወወርኅ
  choice: 太阳和月亮
  rationale: 直接译出这对天体；它们在句中被描写成遵行既定秩序的行动者。
- source_word: ይፌጽሙ
  choice: 完成
  rationale: 该动词表示使某事达到完成；与天体的规律运动搭配时，“完成”既贴近原义，也不把它过度解释成单纯的道德顺服。
- source_word: ምሕዋሮሙ
  choice: 各自的运行
  rationale: 该词在此指日月规律性的行程或循环运动。“运行”是现代汉语描述天体运动的自然说法；“各自”明确复数领属关系。
- source_word: ወኢየሐልፉ እምትእዛዞሙ
  choice: 不偏离给它们的命令
  rationale: 动词与介词的组合有离开、越出之意。“偏离”保留界限意象；“给它们的命令”表明这命令是加于日月的，而非由日月发出的。
- source_word: እምዓለም
  choice: 永不
  rationale: 此短语与否定动词连用时可构成“绝不、永不”的时间性绝对表达；置于动词前符合自然现代汉语。
theological_decisions:
- issue: 应否把本节完全改写为中性的天文学语言
  choice: 保留“誓言”和“命令”，同时用“偏离”表达越出所定界限
  alternative: 译作“依照那规定，太阳和月亮循着周期运转，从不脱离既定秩序”
  rationale: 原文明确使用誓言、命令以及越出或偏离的语言，把受造界的规律运动呈现为受约束、遵守所定秩序。保留这些词可维持原文的法理性张力，又不引入后来的宗派教义。
- issue: 末尾时间短语表示“永不”还是“从亘古／直到永远”
  choice: 正文采用与否定动词连用的习语义“永不”
  alternative: 按较字面的时间表达译作“不偏离……直到永远”或“从亘古就不偏离……”
  rationale: 在否定结构中，“永不”最符合该短语的盖兹语惯用功能和现代汉语表达；脚注保留较字面的可能理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“借着那誓言”保留原文的末世文学语调；“完成各自的运行”避免生硬的“完成它们的轨道”；“永不偏离”兼顾原动词的界限含义和否定时间短语的习语功能。所有脚注标记均已置于正文相应位置。
