base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/001.yaml
  text: And after this judgment[a], they will terrify them and oppress them[d][c][b], because they showed this to those who dwell upon the dry land.
translation:
  language: zh_hans
  text: 这审判以后[a]，他们必令他们惊恐，并压迫他们，因为他们把这事[c]显明给那些住在旱地上的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这定罪以后”或“这判决以后”。这里的“这”修饰“审判”，不是泛指“这些事”。
    reason: lexical_alternative
  - marker: b
    text: “旱地”较为直译，可能保留与海或水域相对的宇宙图景；也可泛译为“地上”。
    reason: lexical_alternative
  - marker: c
    text: “这事”所指为何，本节没有明说，可能回指前文所揭示的内容。
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረ ዝ ኵነኔ
  choice: 这审判以后
  rationale: 将“这”与“审判”连读，符合短语结构，也避免误把单数的“审判”当作随后两个复数动词的主语。
- source_word: ያደነገፅዎሙ
  choice: 必使他们惊恐
  rationale: 保留使役意义和末世审判语境中的强烈恐惧感；动词的复数主语以“他们”表达。
- source_word: ያምዕፅዎሙ
  choice: 并压迫他们
  rationale: 按词根在此处所含的压迫、施暴或不义对待之义翻译，不采用“赶走”，并保留行为具体方式上的宽度。
- source_word: እስመ
  choice: 因为
  rationale: 清楚表达后句是前述行动的原因。
- source_word: ዘንተ አርአዩ
  choice: 他们把这事指给了
  rationale: 贴近“使看见、展示”的基本意义，同时以“这事”保留原文未明说的指代内容。
- source_word: ለእለ የኀድሩ
  choice: 那些住……的人
  rationale: 自然表达居住者这一分词结构，并保持庄重而易懂的现代汉语。
- source_word: ዲበ የብስ
  choice: 在旱地上
  rationale: 保留“旱地”相对于海或水域的具体宇宙图景，不笼统化为“地上”或“世人”。
theological_decisions:
- issue: ኵነኔ在启示文学语境中的含义与句法归属
  choice: 这审判以后
  alternative: 这些事以后；此后，审判……
  rationale: 原文把“这”限定于“审判”，指向特定的审判事件；后面的两个动词具有复数主语，故不把“审判”处理为动词主语。
- issue: 两个“他们”群体的身份
  choice: 保留代词，不补明身份
  alternative: 按上下文补作特定天使、审判者或受刑者
  rationale: 本节自身未明确指出两个复数代词各自所指；直译保留原文的指代张力，避免引入解释性身份。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“他们……他们”的重复虽在汉语中略显含混，却忠实保留吉兹语中复数主语与复数宾语均未在本节明说所指的情况。
