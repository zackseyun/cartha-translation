base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/019.yaml
  text: And by that oath the depths were made firm[c][b][a], and they stand and do not move from their place from eternity to eternity.
translation:
  language: zh_hans
  text: 深渊藉着那誓言得以坚固；从永世到永世，它们站立，不从各自的位置挪动。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深渊”在原文中形式上为单数，但后面的“站立”“不挪动”和“它们的位置”均为复数；因此也可译作“诸深渊”或“深处”。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ማሐላ
  choice: 誓言
  rationale: 此处指上下文中具有约束力的誓言；“誓言”保留其庄严和法律意味。
- source_word: ቀላይ
  choice: 深渊
  rationale: 该词在此是主语，指深处或深渊；后续复数动词和代词表明它被视为复合或复数的宇宙领域，因此中文先用集合性名词“深渊”，再以“它们”承接。
- source_word: ፀንዐት
  choice: 使……坚固
  rationale: 该动词表达变得稳固、被确立的结果；结合工具性语境译为“那誓言使深渊坚固”。
- source_word: ወቆሙ
  choice: 它们站立
  rationale: 保留“站立”的具体宇宙意象，不将其抽象化为单纯的“稳定”。
- source_word: ወኢይትሐወሱ
  choice: 不动
  rationale: 未完成体表达持续状态，故用现在持续意义的“不动”，而非过去时“没有被移动”。
- source_word: እመካኖሙ
  choice: 不离开自己的位置
  rationale: 原文直义为“不从它们的位置移动”；汉语以“不离开自己的位置”自然表达固定在各自所在之处。
- source_word: እምዓለም ወእስከ ለዓለም
  choice: 永永远远
  rationale: 这是强调无尽延续的套语；“永永远远”庄重、自然，并保留重复加强的语气。
theological_decisions:
- issue: 本节描述的是誓言本身的坚定，还是由誓言确立的宇宙实体
  choice: 把“深渊”视为由誓言使之坚固、固定不动的宇宙领域
  alternative: 把誓言本身理解为坚固并永远屹立
  rationale: 原文明确有名词ቀላይ作相关主语，随后又有复数动词及“它们的位置”，较自然地指向被固定的宇宙现实，而非誓言自身。
- issue: 单数形式的“深渊”与后续复数语法之间的张力
  choice: 正文保留集合性单数“深渊”，后以复数“它们”承接，并用脚注提示
  alternative: 直接译作“诸深渊”或“深处”以统一复数
  rationale: 这样既反映名词表面的单数形式，又不抹平后续复数动词和代词所呈现的真实语法张力。
translation_notes:
  register: 采用现代、庄重而清楚的中文。“站立不动”保留启示文学中的宇宙图景；“永永远远”自然传达原文“从永世直到永世”的强调结构。
