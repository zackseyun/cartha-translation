base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/003.yaml
  text: And these are the chiefs of their angels[a], and their names, and the commanders of their hundreds, and the commanders of their fifties[c][b], and the commanders of their tens.
translation:
  language: zh_hans
  text: 这些是他们的天使的首领和他们的名字，以及他们的百人长、他们的五十人长和他们的十人长。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “百人长、五十人长和十人长”表示按人数划分的等级或编队，并非单纯列出人数总数。
    reason: cultural_note
  - marker: b
    text: 原文在“百人长”“五十人长”“十人长”各项中都重复“他们的”；“他们”具体指谁，要由上下文判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ
  choice: 这些
  rationale: 复数指示词，用来引出紧接着的名录；“这些”符合本节的列举功能。
- source_word: አርእስተ
  choice: 首领
  rationale: 字面为“头”，在此指居领导地位者；“首领”自然且保留等级含义。
- source_word: መላእክቲሆሙ
  choice: 他们众天使
  rationale: 在《以诺一书》的语境中通常指天使而非人间使者；保留所属关系，其所指由上下文确定。
- source_word: አስማቲሆሙ
  choice: 他们的名字
  rationale: 忠实保留复数名词及所属后缀，表明下文是名录。
- source_word: መኰንነ
  choice: 人长
  rationale: 该官职词在百、五十、十的递降编制中反复出现；结合数字译作“百人长、五十人长、十人长”，简明呈现统领相应单位者。
- source_word: ምእት
  choice: 百
  rationale: 作为编制单位与五十、十平行，合入汉语习见称谓“百人长”。
- source_word: ኀምሳ
  choice: 五十
  rationale: 作为编制单位，译入“五十人长”，保留原文层级。
- source_word: ዐሠርተ
  choice: 十
  rationale: 作为编制单位，译入“十人长”，保留原文递降结构。
- source_word: ዚአሆሙ
  choice: 他们的
  rationale: 原文在每一等级后重复所属表达；中文在并列结构中以首个“他们的”统摄三项，以避免生硬重复，同时用脚注说明原文形式。
theological_decisions:
- issue: 是否以明确的军事或行政等级术语翻译数字序列
  choice: 他们的百人长、五十人长和十人长
  alternative: 他们各百人、五十人和十人的统领
  rationale: 原文呈现有组织的权柄层级。“百人长、五十人长、十人长”既透明自然，又不引入后世教会职分；同时不把这些数字误解为简单总数。
- issue: 所属语“他们的”的句法归属
  choice: 理解为修饰各级统领职衔
  alternative: 理解为“他们的百人编队、五十人编队和十人编队”的统领
  rationale: 吉兹语独立所属形式可与整个职衔结构相连；正文采用自然汉语表达，并在脚注中保留其所指依赖上下文这一点。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“众天使”避免把“他们的天使”误读为单数；数字等级采用汉语熟悉的“百人长、五十人长、十人长”。正文保留名录式节奏，但省去汉语中不自然的重复连词。
