base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/008.yaml
  text: And the fourth—his name was Penemue—this one showed the children of men the bitter and the sweet[b][a], and he showed them all the secrets of their wisdom.
translation:
  language: zh_hans
  text: 第四位名叫佩尼穆埃；他向世人显明苦的和甜的[a]，又向他们显明他们智慧的一切隐秘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦的和甜的”也可译作“苦与甜”。这组词既可按字面理解，也可能泛指性质相反或带有道德意味的知识；原文没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: ራብዕ
  choice: 第四位
  rationale: 这是名单中引出下一位的序数；用“位”自然地指称有位格者。
- source_word: ስሙ ፔኔሙኤ
  choice: 名叫佩尼穆埃
  rationale: 保留叙事中的命名格式；专名按音译处理，不赋予未经文本说明的含义。
- source_word: ዝንቱ
  choice: 他
  rationale: 该指示词回指刚提到的人物；现代汉语用“他”即可保留指向，同时避免生硬的“这一位”。
- source_word: አርአየ
  choice: 指给……看
  rationale: 基本义是“使看见、显示”；此译保留具体的展示意味，也与后半句同根动词的重复相呼应。
- source_word: ለውሉደ ሰብእ
  choice: 世人
  rationale: 原文直译为“人的儿女”；“世人”在现代汉语中自然、庄重，并保留泛指人类的意义。
- source_word: መሪረ ወመዓርፂረ
  choice: 苦的和甜的
  rationale: 按校勘意见将两个形容词视为名词化用法，保留“苦—甜”的直接对举，不改写为“善—恶”。
- source_word: ወአርአዮሙ
  choice: 又把……指给他们看
  rationale: 重复前面的“指给……看”，显出原文动词复现及句式节奏。
- source_word: ኵሎ ኅቡኣተ ጥበቦሙ
  choice: 他们智慧的一切隐秘
  rationale: 保留“他们”的代词后缀及“一切”的完整范围；“隐秘”兼顾“隐藏之事”与启示文学语域。
theological_decisions:
- issue: “苦的和甜的”的含义
  choice: 保留字面的苦甜对举
  alternative: 苦与甜；善与恶；苦甜之事
  rationale: 原文没有明确把这组词道德化。“苦的和甜的”既贴近名词化形容词形式，也容许读者理解为味觉、经验或带有道德意味的知识。
- issue: ኅቡኣተ ጥበቦሙ 中代词后缀的归属
  choice: 他们智慧的一切隐秘
  alternative: 智慧的一切隐秘；智慧中一切隐藏的事
  rationale: 保留原文第三人称复数后缀，不把它消解为泛称；其具体所指仍由上下文判断。
translation_notes:
  register: 采用自然而庄重的现代标准汉语。“世人”避免直译“人的儿女”所造成的欧化感；全句重复“指给……看”，以保存原文的节奏和措辞联系。
