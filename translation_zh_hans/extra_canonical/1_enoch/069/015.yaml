base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/015.yaml
  text: And this is the power of this oath, for it is mighty and firm; and he placed this oath, Aka'e, into the hand of Mika'el.
translation:
  language: zh_hans
  text: 这就是这誓言的力量，因为它强大而坚固；他把这誓言——阿卡厄——交在米迦勒手中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在米迦勒手中”直译保留了原文“手”的说法；这里可表示把这誓言托付给米迦勒，或置于他的权柄之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃይሉ
  choice: 力量
  rationale: 该词表示力量、能力；此处指誓言所具有的效力与威力。“力量”既直接，也不把含义局限为体力。
- source_word: ማሐላ
  choice: 誓言
  rationale: 上下文所论的是特定的誓言；“誓言”是最直接、稳定的译法，不额外加入“咒诅”等原文本节未明说的含义。
- source_word: ኃያል
  choice: 大有能力
  rationale: 该形容词在此述说誓言具有强大的效力。“大有能力”在现代汉语中庄重自然，并保留启示文学的力度。
- source_word: ፅኑዕ
  choice: 坚定不移
  rationale: 该词表示坚固、稳固、不可动摇；“坚定不移”能自然表达誓言已确立且可靠的意味。
- source_word: አንበሮ
  choice: 交在
  rationale: 原义为放置、安放。结合“手中”这一结构，“交在”既保留具体意象，也自然传达托付之意。
- source_word: አካእ
  choice: 阿卡厄
  rationale: 按吉兹语形式音译为誓言之名，不遗漏这一专名，也不对其含义作无根据的解释。
- source_word: በእዴሁ ለሚካኤል
  choice: 在米迦勒手中
  rationale: 保留原文“手”的具体意象；汉语“交在某人手中”也可自然表示托付或置于其掌管之下。米迦勒采用现代中文读者熟悉的传统译名。
theological_decisions:
- issue: “手中”这一表达应按具体意象翻译，还是直接解释为权柄或掌管
  choice: 交在米迦勒手中
  alternative: 交由米迦勒掌管
  rationale: 原文明确使用“手”的意象。正文保留这一形象，同时汉语表达本身可以承载托付或授权之意，避免把隐含关系解释得过于确定。
- issue: አካእ在句中的功能
  choice: 将“阿卡厄”作为该誓言的名称，以破折号标示同位关系
  alternative: 将其视为其他句法成分或省略不译
  rationale: 原文在“这誓言”与“在米迦勒手中”之间明确出现该词；保留为专名最能反映现有文本证据，同时标点只说明其同位关系，不进一步推断其神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这誓言的力量就是如此”贴近原文指示结构；以分号保留原句两部分的庄严推进。专名“阿卡厄”按吉兹语音译，“米迦勒”采用通行中文形式。
