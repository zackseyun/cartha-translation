base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/021.yaml
  text: And by that oath the stars complete their courses[a], and their names are called[c][b], and they answer from age to age and forever.
translation:
  language: zh_hans
  text: 众星凭着那誓言走完各自的轨道；它们的名字被呼唤[a]，它们便回应他，世世代代，直到永远。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一分句十分简练，也可理解为“它们呼唤自己的名字”；这里依上下文译作非人称被动：“它们的名字被呼唤”。
    reason: textual_variant
  - marker: b
    text: 直译近于“从世代，直到世代”；这是表达长久延续的庄重用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ
  choice: 誓言
  rationale: 此词在本章反复出现，意为“誓言”；介词结构 በውእቱ ማሐላ 表示“凭着那誓言”，而不是“在其中”或“轨道”。
- source_word: ከዋክብት
  choice: 众星
  rationale: 采用普通而具体的“星辰”义；“众星”自然保留启示文学中的宇宙意象。
- source_word: ይፌጽሙ ምሕዋሪሆሙ
  choice: 走完各自的轨道
  rationale: 动词表示完成，名词表示运行、行程或环行；此译兼顾天体运行的意象和现代汉语的自然表达。
- source_word: አስማቲሆሙ ይጼውዑ
  choice: 它们的名字被呼唤
  rationale: 原文形式压缩；按语境作非人称被动理解，避免强加一个未明说的呼唤者，同时保留众星按名受召的拟人化图景。
- source_word: ያወሥእዎ
  choice: 它们便回应他
  rationale: 词尾 -ዎ 是第三人称阳性单数宾语后缀，宜明确译出“他”；主语依上下文为众星。
- source_word: እምዓለም ወእስከ ለዓለም
  choice: 世世代代，直到永远
  rationale: 保留原文由“世代／时代”构成的持续性套语及其庄重重复，避免过度哲学化。
theological_decisions:
- issue: 众星的回应是纯粹天文学描写，还是人格化的天上顺服
  choice: 保留众星受召并回应“他”的人格化描写
  alternative: 把整句处理为不具人格色彩的天体规律说明，或把回应者明确解释为与星辰相联的天使
  rationale: 原文既叙述星辰运行，也使用按名呼唤和回应的语言。译文不把启示文学的张力简化为现代天文学，也不擅自认定回应者是天使。
- issue: “他”的身份
  choice: 依语法译出阳性单数宾语“他”，但不在正文中指明身份
  alternative: 省略宾语，或直接译作“主／上帝”
  rationale: 动词词尾支持“他”，但本节自身没有明说其身份；保留代词可忠实呈现语法而不补入解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凭着那誓言”承接本章反复出现的誓言主题；分号呈现原文连续而紧密的诗性分句。正文中的“他”保留原文语法所显示但身份未明的对象。
