base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/024.yaml
  text: All these will believe and give thanks before the Lord of Spirits[a], and they will bless with all their power, and their food will be in all thanksgiving[c][b]; and they will give thanks and bless and exalt the name of the Lord of Spirits forever and ever.
translation:
  language: zh_hans
  text: 所有这些人都要相信，并在众灵之主面前献上感谢；他们要尽其全力颂赞；他们的食物必在一切感恩之中[a]；他们要感谢、颂赞并高举众灵之主的名，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处直译为“他们的食物必在一切感恩中”。该介词短语十分凝练，也可理解为“他们的食物伴随着一切感谢”。
    reason: 原文介词短语与“食物”的确切关系存在歧义；脚注保留替代理解，正文不作过度解释。
lexical_decisions:
- source_word: ያአምኑ
  choice: 相信
  rationale: 该动词表示相信、信赖；译作“相信”直接自然，也不额外引入后期教义术语。
- source_word: የአኵቱ / ወየአኵቱ
  choice: 献上感谢／感谢
  rationale: 其语义可与赞美重叠，但本节邻近名词አኰቴት（感谢、感恩）支持“感谢”之义；首次译作“献上感谢”以符合汉语礼敬语境。
- source_word: በቅድመ
  choice: 在……面前
  rationale: 保留原文空间与礼仪性的表达，在现代汉语中也自然。
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: 众灵之主
  rationale: 这是《以诺一书·比喻篇》中反复出现的神圣称号；“众灵之主”保留其称号性质和启示文学色彩。
- source_word: ይሴብሑ / ወይሴብሑ
  choice: 颂赞
  rationale: 该词可表示祝颂或赞美；“颂赞”既有庄重礼仪色彩，也与“感谢”和“高举”保持词义区分。
- source_word: በኵሉ ኃይሎሙ
  choice: 尽其全力
  rationale: 表达他们全部的力量或能力；此译简洁自然，并保留全然投入的含义。
- source_word: ሲሳዮሙ
  choice: 他们的食物
  rationale: ሲሳይ在此指食物或养分，并非财富；阴性系词ይእቲ也支持将此处读作独立名词句。
- source_word: በኵሉ አኰቴት
  choice: 尽是感恩
  rationale: 原文结构凝练，可理解为“在一切感恩中”或“带着一切感谢”；结合独立名词句，正文以自然汉语表达其意象，同时脚注保留结构上的歧义。
- source_word: ያሌዕሉ
  choice: 高举
  rationale: 该动词有举起、尊崇之义；“高举……的名”保留原文的垂直意象，又符合庄重现代汉语。
- source_word: ለዓለመ ዓለም
  choice: 直到永永远远
  rationale: 这是永恒时段公式的自然汉语对应，保留庄严的礼仪节奏。
theological_decisions:
- issue: 是否以明确的后期基督教教义术语翻译ያአምኑ
  choice: 相信
  alternative: 信靠／有信心
  rationale: 原文描述敬拜者末后的回应；“相信”保留普通词义，不把后期关于救恩信心的专门表述带入本节。
- issue: 如何处理神圣称号እግዚአ መንፈሳት
  choice: 众灵之主
  alternative: 诸灵的主
  rationale: 该表达在《比喻篇》中具有固定称号的功能；“众灵之主”较能保持其凝练、庄严和启示文学语感。
- issue: 食物与感恩的关系
  choice: 他们的食物也必尽是感恩
  alternative: 他们的食物必在一切感恩中／他们以感恩为食
  rationale: 正文保留“食物”这一启示文学意象，并按阴性系词将其处理为独立分句；不将隐喻进一步解释为天使实际以感恩维生。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“众灵之主”“食物”“高举”等启示文学与礼仪意象；以分号呈现原文连续而层递的颂赞节奏。
