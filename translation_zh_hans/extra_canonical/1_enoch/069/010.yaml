base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/010.yaml
  text: 'For men were not born for this: to strengthen their faith with pen and ink[a][b][c].'
translation:
  language: zh_hans
  text: 因为人并不是为此而生：用笔墨[a]坚固自己的信心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “笔墨”所译原文直说“用笔和胆汁之水”。这两个词在此很可能合指书写所用的笔和墨水；不过“胆汁之水”的确切意象或来源并不完全确定。
    reason: cultural_note
  - marker: b
    text: “信心”也可译作“信仰”“信赖”“信用”或“信实”；原词在这里是否专指宗教信仰，并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 承接上文，引出理由；保留原词的因果连接作用。
- source_word: ኢተወልዱ ሰብእ
  choice: 人并不是……而生
  rationale: ሰብእ泛指人类，并非只指男性；被动否定形式自然译作“不是……而生”。
- source_word: በዘ ከመዝ
  choice: 为此
  rationale: 简洁保留目的关系，不把所指内容解释得过满。
- source_word: በቀለም ወበማየ ሐመት
  choice: 用笔墨
  rationale: 按书写语境将两个具体表达合译为自然的现代汉语“笔墨”；同时以脚注保留“胆汁之水”的字面形象及其不确定性。
- source_word: ያጽንዑ
  choice: 坚固
  rationale: 保留“使之稳固、加强”的使役意义，也与后面的“信心”搭配自然。
- source_word: ሃይማኖቶሙ
  choice: 自己的信心
  rationale: 该词可表示信仰、信赖或信实；“信心”避免过早限定为制度性宗教，同时保留内在相信的含义。“自己的”自然表达第三人称复数领属。
theological_decisions:
- issue: “笔墨”所指的是普通书写工具，还是带有苦毒、毒物等象征意义
  choice: 正文采用“笔墨”，不把它解释成某种教义性或仪式性媒介
  alternative: 直译为“用笔和胆汁之水”，或理解为借有毒、苦涩的书写教训坚固信仰
  rationale: 书写语境支持“笔墨”的惯用理解，但“胆汁之水”的字面形象确实存在，因此在脚注中保留，而不在正文中武断消解。
- issue: ሃይማኖቶሙ表示宗教信仰，还是信用、忠信或信赖
  choice: 译作“自己的信心”
  alternative: 可译作“自己的信仰”“自己的信用”或“自己的信实”
  rationale: 原词语义范围较宽；“信心”在中文中既可有宗教含义，也可泛指信赖与确信，较能保存原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人”按集合意义指人类，不限于男性；冒号保留原句由目的说明展开的结构。
