base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/016.yaml
  text: And these are the hidden things of this oath [a]. . . and it is made firm by his oath, and heaven was suspended before the world was created[d][c][b], and by it forever.
translation:
  language: zh_hans
  text: 这些就是这誓言的隐秘之事[a]……它借着他的誓言而坚立；天在世界受造以前就被悬挂，并且直到永远借着它得以悬挂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处埃塞俄比亚语传本艰涩；原始校本文在“这誓言”之后标有缺文省略号，表示文本可能残损或传抄不明。也可译作“这些就是这誓言隐藏的事”。
    reason: textual_variant
  - marker: b
    text: 直译近于“并且直到永远，借着它”。“它”很可能指前文的誓言，但语法上所指并不完全明确；正文按上下文将其与天的“悬挂”相连，未断定代词所指。
    reason: alternative_reading
lexical_decisions:
- source_word: እሉንቱ እሙንቱ
  choice: 这些就是
  rationale: 保留复数指示词与系词结构，以自然的现代汉语引出下文。
- source_word: ኅቡኣቲሁ ለዝ ማሐላ
  choice: 这誓言所隐藏的事
  rationale: 保留“隐藏、隐蔽”的启示文学意味；后缀与“这誓言”相联系，但不把它窄化为抽象教义或誓言的具体措辞。
- source_word: ፅኑዕ
  choice: 坚立
  rationale: 表达稳固、确立的结果状态，也符合庄重的誓言语境。
- source_word: በመሐላሁ
  choice: 因他的誓言
  rationale: 将介词理解为工具或凭借，表示使其坚立的凭据或力量；保留第三人称阳性单数所属形式。
- source_word: ሰማይ ተሰቅለ
  choice: 天就已悬起
  rationale: 保留动词“悬挂、悬起”的鲜明宇宙图景，不弱化为一般的“建立”。
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: 在世界受造以前
  rationale: 按时间从句处理；此处 ዓለም 在宇宙论语境中译为“世界”最自然。
- source_word: ወእስከ ለዓለም ቦቱ
  choice: 并且永远由它维系
  rationale: ቦቱ 由介词 በ 与第三人称阳性单数后缀构成，可表“借着它、由它”；结合上下文，以“维系”补足中文关系，同时保留代词所指的潜在含混。
theological_decisions:
- issue: 誓言所隐藏之事的性质
  choice: 译作“这誓言所隐藏的事”，指向与誓言相关的隐秘现实而不进一步界定
  alternative: “这誓言的秘密”或“誓言中隐秘的话语”
  rationale: 上下文涉及誓言的能力与宇宙秩序；较宽泛的表达能保留启示文学的具体感及语义开放性。
- issue: 天的宇宙论形象
  choice: 保留“天悬起”的图景
  alternative: “天被建立”或“天被固定”
  rationale: 源语动词具有悬挂意象，应保存其异质而鲜明的宇宙论表达。
- issue: 末尾代词的所指
  choice: 保留“它”，不在正文中明确判定为誓言
  alternative: 直接译作“永远由这誓言维系”
  rationale: 语境很可能指誓言，但源文本使用代词，且传本句法有困难；不宜把可能解释写成唯一结论。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留源文的省略、悬天意象和末尾代词含混；分号用于梳理残缺句法，但不试图重构缺失内容。
