revisions:
- from: 在那里，雷声和闪电的光芒被存留；在那里，冰雹的库房、白霜的库房、雾的库房，以及雨露的库房都被保存着。
  to: 在那里，雷声和闪电的光芒存放着；那里又有冰雹的库房、白霜的库房、雾的库房，以及雨和露的库房。
  rationale: 修订仅改善现代标准汉语的搭配与并列结构，并更明示“雨”和“露”为两个项目；保留原文两次“在那里”、雷声与闪电之光的平行，以及反复的天上库房意象。
