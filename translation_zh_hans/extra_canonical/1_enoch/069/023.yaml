base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/023.yaml
  text: And there are kept the sound of the thunder and the light of the lightning[a], and there are kept the storehouses of the hail and the storehouses of the hoarfrost, and the storehouses of the mist[b], and the storehouses of the rain and the dew.
translation:
  language: zh_hans
  text: 在那里，雷声和闪电的光芒存放着；那里又有冰雹的库房、白霜的库房、雾的库房，以及雨和露的库房。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በህየ
  choice: 在那里
  rationale: 保留地点副词及其重复所形成的异象空间感。
- source_word: ይትዓቀቡ / ይትዓቀብ
  choice: 被存留／被保存着
  rationale: 采用宽泛的被动表达，兼顾保管、储存之意；依汉语搭配略作变化。
- source_word: ቃሉ ለነጐድጓድ
  choice: 雷声
  rationale: ቃል可指声音或嗓音；在气象语境中，“雷声”自然准确，并未将其扁平化为纯技术描述。
- source_word: ብርሃኑ ለመብረቅ
  choice: 闪电的光芒
  rationale: 保留“光／光辉”的明示成分及与雷声的平行结构。
- source_word: መዛግብተ
  choice: 库房
  rationale: 保留天上贮藏自然力量的具体启示文学意象，也符合现代汉语表达。
- source_word: በረድ
  choice: 冰雹
  rationale: 该气象词义明确。
- source_word: አስሐትያ
  choice: 白霜
  rationale: 依词义和最新校勘意见译作白霜／霜，而不误作雾；“白霜”较清楚地区别于下一项。
- source_word: ጊሜ
  choice: 雾
  rationale: 此处可指雾、云雾；译作“雾”与白霜有别，并保持气象现象的排列。
- source_word: ዝናም ወጠል
  choice: 雨露
  rationale: 分别对应雨和露；合称“雨露”既自然，又仍清楚包含两项。
theological_decisions:
- issue: 是否将天上库房的气象意象现代化或非神话化
  choice: 保留“库房”及雷声、闪电光芒被存留的具体宇宙意象
  alternative: 改写为雷电、冰雹、霜雾和雨露在那里形成或发出
  rationale: 原文属于启示文学的异象描写；直陈其宇宙库房意象，不将其转化为现代气象机制，也不额外赋予教派性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留两次“在那里”和反复出现的“库房”意象，同时避免逐词硬译造成生涩。原文最后一个“库房”统摄雨与露，故译为“雨露的库房”。
