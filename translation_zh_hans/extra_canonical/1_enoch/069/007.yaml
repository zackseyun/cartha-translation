base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/007.yaml
  text: And from his hand they went out against those who dwell upon the dry ground[b][a], from that day and unto the age of ages.
translation:
  language: zh_hans
  text: 它们从他手中出来，向那些住在干地上的人[a]出击；从那日起，直到万世万代。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些住在地上的人。”原文更直译为“那些住在干地上的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文动词为第三人称阳性单数，可直译作“它出来”；这里按上一节“死亡的兵器”这一集合性先行词译作“它们出来”。
    reason: grammatical_anaphora
lexical_decisions:
- source_word: እምነ እዴሁ
  choice: 从他手中
  rationale: 保留原文具体的空间意象；“手”在语境中也可暗含施行能力，但不宜在正文中抽象化。
- source_word: ወፅአ
  choice: 它们……出来
  rationale: 原形为第三人称阳性单数，但承接上一节的集合性先行词“死亡的兵器”；吉兹语可对集合或无生命复数使用单数动词，汉语按所指译作复数“它们”，并保留出来的动态意象。
- source_word: ዲቤሆሙ
  choice: 攻击
  rationale: 该介词形式本可表示“在……之上、临到”，但此处具有敌对或审判方向，译作“攻击”能自然表达针对性的行动。
- source_word: ለእለ የኃድሩ ዲበ የብስ
  choice: 那些住在干地上的人
  rationale: 保留የብስ“干地、旱地”的具体宇宙图景，不直接泛化为“地上”；同时用现代汉语自然表达居住者。
- source_word: እምይእቲ ዕለት
  choice: 从那日起
  rationale: 准确标明持续状态或行动的起点，简洁而庄重。
- source_word: እስከ ለዓለመ ዓለም
  choice: 直到万世之世
  rationale: 保留原文叠加“世代/时代”的强调结构及启示文学语体，而非完全平化为“永远”。
theological_decisions:
- issue: የብስ应译为具体的“干地”还是概括的“地上/大地”
  choice: 干地
  alternative: 地上；大地
  rationale: 现有吉兹语文本明确使用“干地”这一具体词语，可能带有海陆或不同领域相对的宇宙论意象；在证据有限时保留其张力，不作泛化。
- issue: 单数动词ወፅአ的主语指代
  choice: 按上一节集合性先行词译为“它们”
  alternative: 它
  rationale: 语法形式虽为单数，但语义上很可能回指上一节“死亡的兵器”。正文采用复数以维持篇章指代；脚注交代原文单数形式，保留语法上的歧义。
- issue: 末尾永恒公式的表达
  choice: 直到万世之世
  alternative: 直到永永远远；直到永恒
  rationale: 选择较贴近原文“世之世”结构的表达，保留启示文学的庄重与时间层叠感，同时不加入特定宗派解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。保留“手”“干地”“万世之世”等启示文学意象；以脚注呈现“地上”的词义选择及单数动词与复数先行词之间的真实张力。
