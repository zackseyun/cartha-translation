base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/014.yaml
  text: This one asked Mikael to show him the hidden name[a], so that they might remember it in the oath, and so that they might tremble before that name and oath[d][c][b], those who revealed to the children of men all that is hidden.
translation:
  language: zh_hans
  text: 这位请米迦勒向他显明那隐藏的名[a][d]，好让他们在誓言中记念它[b]，并因那名和誓言而战栗——他们就是那些把一切隐藏之事显给世人的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“秘密的名”。原文形容词意为隐藏、隐蔽，不一定是后期神秘传统中的专门术语。
    reason: lexical_alternative
  - marker: b
    text: “在誓言中记念它”也可能包含起誓时提说或援引这个名的意思，而不只是心里记得。
    reason: lexical_alternative
  - marker: c
    text: 末句很可能是在说明谁要战栗，即那些把隐藏之事显给世人的；不过原文句法紧凑，也可能有别的主语衔接方式。
    reason: alternative_reading
  - marker: d
    text: 原文是第三人称结构，近似“要他向他显明”；两个“他”具体指谁，要由上下文判断。也有人把整句处理成直接命令：“给他看。”
    reason: grammar_ambiguity
lexical_decisions:
- source_word: ዝንቱ
  choice: 这位
  rationale: 保留指回上文人物的指示语力量，比单用“他”更贴近原文。
- source_word: ይቤሎ ለሚካኤል ያርእዮ
  choice: 对米迦勒说，要他……显给他
  rationale: ይቤሎ 是“对……说”；ያርእዮ 是第三人称祈使/虚拟形式并带第三人称宾语后缀，不宜译成直接引语中的命令式。“要他……”既反映间接要求，也不把语气限定为单纯请求。
- source_word: ስመ ኅቡአ
  choice: 那隐藏的名
  rationale: 直译“名”与“隐藏的”；避免未经文本支持而赋予“秘密之名”固定的神秘术语含义。
- source_word: ከመ ይዝክርዎ በመሐላ
  choice: 好让他们在誓言中记念它
  rationale: 保留动词“记得、提念”的宽泛语义；在起誓语境中可包含提说或援引该名，但正文不强行收窄。
- source_word: መሐላ
  choice: 誓言
  rationale: 采用基本义“誓言”；其令人畏惧的效力由上下文表达，不擅自译作“咒诅”。
- source_word: ከመ ይርዓዱ እምውእቱ ስም ወማሐላ
  choice: 也让他们因那名和誓言而战栗
  rationale: “战栗”体现强烈而具身体感的惧怕；“因”对应 እም 所表达的来源或缘由关系。
- source_word: እለ አርአዩ ለውሉደ ሰብእ ኵሎ ዘበኅቡእ
  choice: 那些把一切隐藏之事显给世人的
  rationale: 将“人的子孙”自然译为现代汉语“世人”，同时保留显露隐藏之事的核心意思，不额外注明这些人的身份。
theological_decisions:
- issue: “记念”与“战栗”的复数主语是谁
  choice: 正文将其理解为末尾所说那些向世人显露隐藏之事者
  alternative: 复数主语也可能泛指听见或使用该誓言的人；压缩的句法也可能容许中途转换主语
  rationale: 末尾的关系从句最自然地说明前面复数主语的身份，并符合上下文中对泄露隐秘知识者的审判语境；脚注仍说明句法并非毫无歧义。
- issue: 隐藏之名的性质
  choice: 仅译作“隐藏的名”
  alternative: “秘密的名”或把它理解为专门的神秘称号
  rationale: 原文表达隐藏、隐蔽，并未要求读者采用后期神秘传统中的技术性解释。
- issue: 誓言中“记念”该名的行为
  choice: 保留“记念”这一宽泛表达
  alternative: 明确译为“援引、呼求该名”
  rationale: 语境可能涉及起誓时援引该名，但原文动词本身仍有记得、提念的意义，不应在正文中消除这层张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这位”保留原文醒目的指示语；“米迦勒”按吉兹语姓名形式音译；用“显给”呼应本节反复出现的“显露”，但整体句式避免仿古。破折号帮助现代读者辨认末尾关系从句最可能说明的主语，相关歧义则留在脚注中。
