base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/018.yaml
  text: And by that oath the sea was created[a], and as its foundation for the time of wrath he set sand for it[c][b], and it does not pass beyond it from the creation of the world and forever.
translation:
  language: zh_hans
  text: 海因那誓言而受造；他又为海设下沙土，作它在愤怒之时的根基；自世界受造之初直到永远，海从不越过它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማሐላ
  choice: 誓言
  rationale: 本段谈论藉誓言确立宇宙秩序；译作“誓言”最符合语境，也不引入“咒诅”的负面含义。
- source_word: ተፈጥረት
  choice: 受造
  rationale: 保留被动的创造用语及其宇宙论色彩；“受造”在现代汉语宗教文体中简洁而庄重。
- source_word: ባሕር
  choice: 海
  rationale: 这里指作为宇宙要素的海；汉语无需另加冠词即可表达确定所指。
- source_word: መሠረታ
  choice: 它的根基
  rationale: 该词通常指根基或基础；上下文也含稳定、限定海的意味，但正文保留具体的“根基”意象。
- source_word: ለጊዜ መዓት
  choice: 在震怒之时
  rationale: 保留“时候”与“震怒”的末世性语感，同时以脚注说明也可泛指审判之时。
- source_word: አንበረ ላቲ ኆፃ
  choice: 他为海设下沙土
  rationale: 动词有安放、设立之意，名词指沙土；此译保持动作和海岸界限的具体图像。
- source_word: ወኢትኅልፍ
  choice: 海都不越过这界限
  rationale: 动词表示越过或逾越；结合沙土作为海的限制，以“界限”自然表达其语境功能，并在脚注交代原文指代并不完全明确。
- source_word: እምፍጥረተ ዓለም ወእስከ ለዓለም
  choice: 从世界受造之初直到永远
  rationale: 准确呈现由世界受造开始、延续至永远的时间跨度。
theological_decisions:
- issue: 海的沙土应理解为普通海岸，还是神圣宇宙秩序下设立的界限
  choice: 保留“设下沙土”“根基”“震怒之时”和“不越过这界限”等多重意象
  alternative: 意译为“他规定海岸，海永不越界”，或删去难解的震怒短语
  rationale: 原文同时具有创造秩序、具体沙土和震怒／审判的末世色彩；不把它简化为纯自然现象，也不将其发展成特定教义。
- issue: “震怒之时”与“根基／设下沙土”的关系
  choice: 译为“作它在震怒之时的根基”
  alternative: 译为“他在震怒之时设下沙土”，或“为审判的时候设下沙土”
  rationale: 原文短语结构艰涩，所修饰的成分并不完全确定；正文采用一种语法通顺且贴近词序的理解，并用脚注保留替代解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“誓言—受造—震怒—直到永远”的启示文学语域；以“海”为主语避免连续代词含混，同时用脚注说明原文在时间短语和越界对象上的歧义。
