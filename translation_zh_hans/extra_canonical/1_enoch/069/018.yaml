revisions:
- from: 海也因那誓言而受造。他为海设下沙土，作它在震怒之时[a]的根基[b]；从世界受造之初直到永远，海都不越过这界限[c]。
  to: 海因那誓言而受造；他又为海设下沙土，作它在愤怒之时的根基；自世界受造之初直到永远，海从不越过它。
  rationale: 修订不改变对困难短语的一种可行理解，但以“它”而非“这界限”避免将原文未明说的受词定为单一解释；同时改善中文句法与衔接。脚注保留“愤怒／审判”及根基、边界之间的文本不确定性。
