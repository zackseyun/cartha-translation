base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/026.yaml
  text: And there was great joy among them[a], and they blessed and praised and exalted because the name of that Son of Man had been revealed to them.
translation:
  language: zh_hans
  text: 他们中间便有了极大的喜乐；他们祝颂、赞美并尊崇，因为那位“人子”[a]的名已经向他们显明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处译作“人子”的吉兹语称号在形式上较难确定。更直译可作“人类之子”，或较不可能作“活人之子”；但在《比喻篇》中，它是一个指向受尊崇人物的特定称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮኖሙ
  choice: 他们中间便有了
  rationale: 该形式引出随之产生的状态；译作“他们中间便有了”既自然，也保留结果性的语气。
- source_word: ፍሥሐ ዓቢይ
  choice: 极大的喜乐
  rationale: 词组表示强烈、欢庆性的喜悦；“极大的喜乐”简洁庄重。
- source_word: ባረኩ ወሰብሑ ወአልዐሉ
  choice: 祝颂、赞美并尊崇
  rationale: 保留三个动词及其顺序，不把具有礼仪感的排比压缩为单一动作。
- source_word: በእንተ ዘተከሥተ ሎሙ
  choice: 因为……已经向他们显明
  rationale: 该从句说明喜乐与颂赞的原因；被动表达体现启示或揭示的含义。
- source_word: ስሙ
  choice: ……的名
  rationale: 上下文使该名词具有确定性；“名”保留身份与权柄被揭示的意味，而不只表示称呼。
- source_word: ለውእቱ ወልደ እጓለ እመሕያው
  choice: 那位“人子”
  rationale: 该短语在《比喻篇》中作为受尊崇人物的称号使用。“人子”保留既有的启示文学表达；“那位”反映指示成分，并标明特定所指。
theological_decisions:
- issue: 称号 ወልደ እጓለ እመሕያው 的译法
  choice: 那位“人子”
  alternative: 那位人类之子；那位活人之子
  rationale: 原文形式较难确定，但在《比喻篇》的局部语境中显然用作受尊崇人物的特定称号。译作“人子”保留本书的启示文学用法，同时以脚注呈现形式上的歧义，不借后来的教义体系替本文作进一步界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祝颂、赞美并尊崇”保留原文三重排比的礼仪色彩；以引号标示“人子”为称号，并用脚注保留原文的词形歧义。
