base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/005.yaml
  text: And the second[a], whose name was Asbe'el—this one taught the evil counsel to the holy sons of God[c][b], and led them astray so that they defiled their bodies with the daughters of men.
translation:
  language: zh_hans
  text: 第二位，名叫阿斯贝埃勒。他把邪恶的计谋教给圣天使的众子[a]，又引他们误入歧途，使他们与世人的女儿交合，玷污自己的身体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天使的圣子”。吉兹语短语的修饰关系不明确，本段又没有希腊语或昆兰文本可供校核。
    reason: alternative_reading
  - marker: b
    text: 直译“自己的肉体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: 第二个
  rationale: 该词既可表示“另一个”，也可表示“第二个”；上下文按第一、第三、第四依次列举，因此这里采用序数“第二个”。
- source_word: አስብኤል
  choice: 阿斯贝埃勒
  rationale: 按吉兹语形式音译人名，不赋予未经正文说明的词义。
- source_word: አመርሙ
  choice: 教给
  rationale: 在此表达使人知晓、传授的使役或教导含义；“教给”符合现代汉语，并保留其主动灌输恶谋的意味。
- source_word: ምክረ እኩየ
  choice: 邪恶的计谋
  rationale: 既保留“谋议、计策”的具体含义，也体现其道德性质；比笼统的“恶事”更贴近原文。
- source_word: ለደቂቀ መላእክት ቅዱሳን
  choice: 给圣天使的众子
  rationale: 保留“众子”“天使”“圣”三个词汇成分；主文将“圣”理解为修饰“天使”，同时以脚注说明原文修饰关系不明确。
- source_word: አስሐቶሙ
  choice: 引他们误入歧途
  rationale: 兼顾使人受迷惑和导致道德偏离两层意思。
- source_word: ከመ ያማስኑ
  choice: 以致他们……玷污
  rationale: 自然表达原文可含目的或结果的结构；上下文更适合以结果来呈现，但不额外解释行为细节。
- source_word: ሥጋሆሙ
  choice: 自己的身体
  rationale: 原义为“他们的肉体”；此处指身体受到玷污，现代汉语用“身体”清楚自然，较直译见脚注。
- source_word: በአዋልደ ሰብእ
  choice: 同世人的女儿
  rationale: 介词在此结合语境表达与人类女子发生关系；“世人的女儿”保留传统意象，又不把“人”限于男性。
theological_decisions:
- issue: ለደቂቀ መላእክት ቅዱሳን 中“圣”的修饰对象
  choice: 圣天使的众子
  alternative: 天使的圣子；圣洁的天使之子
  rationale: 吉兹语词序允许“圣”与“天使”或“众子”相联，而本段缺乏希腊语或昆兰平行文本可供校核。主文采用较自然的句法理解，脚注保留另一种可能，避免把不确定的天使论关系说死。
- issue: ሥጋ 应译为“肉体”还是“身体”
  choice: 身体
  alternative: 肉体
  rationale: 语境强调身体被玷污，“身体”对现代普通读者更直接；脚注保留字面译法“肉体”，以便追踪原文意象。
- issue: ከመ 从句表示目的还是结果
  choice: 以致
  alternative: 为要；好让
  rationale: 上下文叙述恶谋及其后果，结果式中文较顺；原结构仍可能带目的色彩，故不进一步扩写其动机。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第二个”承接本章的编号次序；人名依吉兹语音译。句子避免古奥文言，也不补入原文未明说的教派性天使论解释。
