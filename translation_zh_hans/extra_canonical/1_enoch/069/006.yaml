base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/006.yaml
  text: And the third was named Gadreel[a]; this is the one who showed all the blows of death to the children of men, and he led Eve astray[c][b], and he showed the weapons of death to the sons of men—the shield and the breastplate and the sword for slaughter—and all the weapons of death to the children of men.
translation:
  language: zh_hans
  text: 第三位名叫加德列[a]；就是他向世人展示了死亡的各种打击[b]，又把夏娃引入迷途；也是他向世人展示了死亡的器具——盾牌、胸甲和用于杀戮的剑——又向世人展示了一切死亡的器具[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 音译也可作“加德勒”或“加德里尔”。
    reason: transliteration_alternative
  - marker: b
    text: 或译“死亡的一切打击”。原文表达也可泛指致人死亡的攻击或创伤。
    reason: lexical_alternative
  - marker: c
    text: 本句在具体清单之后再次概括为“一切死亡的器具”。此处吉兹语见证的措辞有文本困难，译文保留这一重复，不予合并或删略。
    reason: lexical_and_textual_difficulty
lexical_decisions:
- source_word: ሣልስ፡ ስሙ፡ ጋድርኤል
  choice: 第三位名叫加德勒
  rationale: 按序数和命名公式直译，并以接近吉兹语形式的“加德勒”音译人名。
- source_word: ኵሎ፡ ዝብጠተ፡ ሞት
  choice: 一切死亡的打击
  rationale: 保留“死亡”这一名词及其与后文的反复呼应；“打击”也保留其可指攻击、击打或创伤的宽泛性。
- source_word: ለውሉደ፡ ሰብእ / ለደቂቀ፡ ሰብእ
  choice: 给世人
  rationale: 两个近义集合称谓都泛指人类；现代汉语用“世人”自然庄重，又不造成并非原意的群体区别。
- source_word: አስሐታ፡ ለሔዋን
  choice: 把夏娃引入迷途
  rationale: 表达主动使人偏离正路的含义，同时不把词义收窄为单纯言语欺骗。
- source_word: ንዋየ፡ ሞት
  choice: 致死的器具
  rationale: “器具”可统摄后列的盾牌、护甲和刀剑，比“武器”更能容纳防具；“致死”在汉语中自然表达与死亡相关、用于造成死亡之意。
- source_word: ወለታ፡ ወድርዐ፡ ወሰይፈ፡ ለቀተል
  choice: 盾牌、胸甲和杀戮用的刀剑
  rationale: 依次呈现防御装备、身体护甲和用于杀戮的剑，并保留末语的目的含义。
theological_decisions:
- issue: 如何表述加德勒与夏娃受迷惑的关系
  choice: 又把夏娃引入迷途
  alternative: 又欺骗了夏娃
  rationale: 吉兹语文本直接把这件事归于加德勒；译文照录该归属，不为迁就其他传统而消解其中的神学张力。
- issue: 如何处理死亡器具清单后的重复总结
  choice: 保留清单后的“以及一切致死的器具”
  alternative: 视为重复而删去
  rationale: 现有见证虽有文本困难，却明确保有这一总结；保留它可避免未经充分依据替原文删改。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。以分号和破折号理清长句结构；保留“死亡”意象，但在“死亡的打击”与“致死的器具”之间采用符合现代汉语习惯的不同结构。
