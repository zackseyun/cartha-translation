  to: 第三位名叫加德列[a]；就是他向世人展示了死亡的各种打击[b]，又把夏娃引入迷途；也是他向世人展示了死亡的器具——盾牌、胸甲和用于杀戮的剑——又向世人展示了一切死亡的器具[c]。
  rationale: 修订恢复原文末尾“向世人”的受事，并以“死亡的器具”一致翻译两处重复的“器具＋死亡”构式，保留全节对“死亡”的反复强调。同步将“指给……看”调整为庄重自然的“向……展示”，将“刀剑”收回为原文单数“剑”，并更新人名音译及相关脚注锚点。
