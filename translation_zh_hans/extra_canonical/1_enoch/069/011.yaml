base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/011.yaml
  text: For human beings were not created except to be like the angels[a], so that they might remain pure and righteous; and death, which destroys everything, would not have touched them. But through this knowledge they are being destroyed[d][c][b], and through this power it is consuming me.
translation:
  language: zh_hans
  text: 因为人类受造，是要像天使一样[a]，使他们常保纯洁和公义；那毁灭一切的死亡，本不会触及他们。然而，他们因这知识而正走向毁灭[b][c]；这力量也正在吞噬我[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“因为没有一个人受造，不是要像天使一样，好使他们……”原文的“人”可作集合名词理解。
    reason: previous_rendering
  - marker: b
    text: “因这知识而正走向毁灭”一句含义较难确定；也可译作“因这种认识，他们灭亡了”。
    reason: lexical_alternative
  - marker: c
    text: 《比喻篇》这一段目前缺少可有效参校的希腊文或昆兰文本，因此对不确定的措辞采取谨慎译法。
    reason: textual_variant
  - marker: d
    text: 末句形象鲜明而且带有个人色彩；“吞噬”也可译作“吃掉”或“吞吃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢተፈጥረ ሰብእ ዘእንበለ
  choice: 人类受造，无非是
  rationale: 保留被动的创造用语及限制语气；以“人类”表达集合意义，避免单复数冲突。
- source_word: ከመ መላእክት
  choice: 像天使一样
  rationale: 明确表达比较而非身份等同，保留人类与天使的区别。
- source_word: ይንበሩ ንጹሓነ ወጻድቃነ
  choice: 常保纯洁和公义
  rationale: 动词在此表示持续处于某种状态；“纯洁和公义”保留其道德与宗教分量。
- source_word: ሞት ዘኵሉ ያማሥን
  choice: 那毁灭一切的死亡
  rationale: 保留死亡被拟人化及其普遍毁灭性的末世语气。
- source_word: እመ ኢገሰሶሙ
  choice: 本不会触及他们
  rationale: 按上下文表达反事实结果，并保留死亡与人发生接触的意象。
- source_word: አእምሮቶሙ
  choice: 这知识
  rationale: 该词也可指“认识”或“理解”；“知识”较贴合此处因果陈述，同时借脚注保留不确定性。
- source_word: ይትሐጐሉ
  choice: 走向毁灭
  rationale: 表达遭毁坏或灭亡的意义，同时用自然的现代汉语呈现原文中间态或反身意味。
- source_word: ኃይል
  choice: 力量
  rationale: 保留词义的宽泛性，不具体判定这力量的性质或来源。
- source_word: ይበልዓኒ
  choice: 正在吞噬我
  rationale: 保留原动词鲜明、切身的吞吃意象。
theological_decisions:
- issue: 人类受造目的与天使的关系
  choice: 人类受造是要“像天使一样”，即在纯洁和公义方面相似
  alternative: 人类受造时就是天使，或此处仅指某一类义人
  rationale: 比较结构支持相似而非身份等同；译文保留崇高的人论，也不抹去人类与天使的区分。
- issue: 知识与毁灭之间的因果关系
  choice: 保留“因这知识而走向毁灭”的直接表述
  alternative: 因这种理解而灭亡；因这种思想而受迷惑
  rationale: 此处缺乏有效的希腊文或昆兰平行文本校勘依据，因此紧贴吉兹文，不擅自解释所指为何种知识。
- issue: 死亡未触及人类的反事实陈述
  choice: 译作“本不会触及他们”
  alternative: 不会接近他们；不会临到他们
  rationale: 上下文将死亡与人类原本应有的纯洁、公义状态形成张力；译文不进一步建立超出本节的教义体系。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“受造”“公义”保留经卷语体的凝练感；其余句法尽量自然。“然而”呈现理想状态与实际毁灭之间的转折。“走向毁灭”避免生硬的被动句，同时不把毁灭机制解释得过细。所有脚注标记均已置入正文。
