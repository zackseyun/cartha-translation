  text: And he sat upon the throne of his glory[a].
translation:
  language: zh_hans
  text: 他坐在自己荣耀的宝座上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“坐”的动词，也可泛指“在”或“停留”；因本句所说的是宝座，且语境呈现登座的景象，所以译作“坐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ነበረ
  choice: 坐
  rationale: 该动词本义范围可包括“是、停留、居住”；与“在……上”和“宝座”连用时，按“坐”理解最自然，也保留异象中的登座画面。
- source_word: ዲበ
  choice: 在……上
  rationale: 这是表示空间位置的介词；现代汉语用“在……上”准确自然。
- source_word: መንበረ
  choice: 宝座
  rationale: 该词也可泛指座位，但在此异象与王权、审判语境中，“宝座”更贴切。
- source_word: ስብሐቲሁ
  choice: 自己的荣耀
  rationale: 该词表示荣耀、光辉或威荣，并带第三人称阳性单数领属后缀；译作“自己的荣耀”既保留领属关系，也使中文所指清楚。
theological_decisions:
- issue: 将该句理解为单纯位于宝座上，还是坐在宝座上
  choice: 他坐在自己荣耀的宝座上
  alternative: 他在自己荣耀的宝座上／他留在自己荣耀的宝座上
  rationale: 原动词本身具有较宽的语义范围，但与宝座搭配时，坐姿及登座意象更符合句法和异象语境；脚注保留较宽泛的可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“自己”明确“荣耀”属于主语，并避免中文里“他的”可能造成的指代含混；保留“荣耀的宝座”这一闪族式领属结构及其神学张力。
