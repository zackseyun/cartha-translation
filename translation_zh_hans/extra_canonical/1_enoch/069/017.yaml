base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/017.yaml
  text: And the earth was founded upon the waters[a], and from the hidden places of the mountains living waters come forth[e][d][c][b], from the creation of the world and forever.
translation:
  language: zh_hans
  text: 大地奠立在水上；活水从群山的隐秘之处涌出[a]，自世界受造之初，直到永远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活水”按原文直译；可指新鲜的水、流动的水或赐生命的水，正文保留其意象的开放性。
    reason: lexical_alternative
  - marker: b
    text: 直译为“从世界的创造，直到永远”。这是时间性的表达，指自世界受造开始并延续至永远；其时间范围的精确侧重点不在正文中进一步限定。
    reason: alternative_reading
lexical_decisions:
- source_word: ተሳረረት
  choice: 奠立
  rationale: 该词源于表示“奠基、建立”的动词；这里是被动式，描绘大地被奠立在水上的宇宙图景，不应译作“撕裂”。
- source_word: ዲበ ማይ
  choice: 在水上
  rationale: ዲበ 表示“在……上、于……之上”；中文用“在水上”既贴近原文，也自然保留其宇宙论意象。
- source_word: ኅቡኣተ አድባር
  choice: 群山隐秘之处
  rationale: 直译为“山岳的隐秘之处”，指山中的隐蔽处所或深处；“群山隐秘之处”简洁而有庄重感。
- source_word: ኅሑያን ማያት
  choice: 佳美的水
  rationale: 现有转录 ኅሑያን 疑有识读问题；查理本所依据的读法很可能是 ኅሩያን，意为“上好的、精选的、佳美的”。因此正文采用符合该版本传统和语境的“佳美的水”，并以脚注说明转录歧义。
- source_word: ይመፅኡ
  choice: 涌出
  rationale: 该未完成式表示持续或惯常发生的动作；“涌出”自然呈现水从山中出来的动态，且不误译为过去时。
- source_word: እምፍጥረተ ዓለም
  choice: 从世界受造之初
  rationale: 保留该短语的时间含义；加“之初”使现代汉语清楚表达自世界创造开始的时间跨度。
- source_word: ወእስከ ለዓለም
  choice: 直到永远
  rationale: 贴近“直至永世”的公式化表达，庄重而易懂，并与前面的“从……之初”构成完整时段。
theological_decisions:
- issue: 大地与水的宇宙论／启示文学意象
  choice: 保留“大地奠立在水上”的具体图景
  alternative: 将其解释为土地被水分开，或把水纯粹象征化
  rationale: 原文呈现的是具体而诗性的宇宙图景；译文不应将其改写成现代自然描述，也不应擅自赋予宗派性象征意义。
- issue: 山中之水的性质
  choice: 正文译作“佳美的水”，脚注保留文本歧义
  alternative: 译作“活水”
  rationale: 所给转录的词形异常，而该版本相关证据支持“精选的／佳美的”读法；由于证据并非毫无疑问，脚注明确交代另一种可能，不把歧义伪装成定论。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“奠立”“隐秘之处”“直到永远”保留启示文学的肃穆感；用“涌出”表达未完成式的持续动态。未补入当前吉兹文节句中没有明示的“借着它”等成分。
