base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/002.yaml
  text: 'And these are the names of those angels[a], and these are their names: the first of them was Semyaza, the second Artaqifa, the third Armen, the fourth Kokabel, the fifth Turiel, the sixth Rumyal, the seventh Daniyal, the eighth Neqael, the ninth Baraqel, the tenth Azazel, the eleventh Armaros, the twelfth Batariel, the thirteenth Basasael, the fourteenth Hananel, the fifteenth Turiel, the sixteenth Simipesiel, the seventeenth Yeterel, the eighteenth Tumael, the nineteenth Turiel, the twentieth Teremael[d][c][b], and the twenty-first Te''azazel.'
translation:
  language: zh_hans
  text: 看哪，那些天使的名字如下；这就是他们的名字：第一位是塞米亚扎，第二位阿尔塔基法，第三位阿尔门，第四位科卡贝勒，第五位图里埃勒，第六位鲁米亚勒，第七位达尼亚勒，第八位内卡埃勒，第九位巴拉凯勒，第十位阿撒泽勒，第十一位阿尔马罗斯，第十二位巴塔里埃勒，第十三位巴萨萨埃勒，第十四位哈纳内勒，第十五位图里埃勒，第十六位西米佩西埃勒，第十七位耶特雷勒，第十八位图马埃勒，第十九位图里埃勒，第二十位特雷马埃勒，[a][b][c]第二十一位特阿撒泽勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节若干名字的词形并不确定；此处尽量贴近现存吉兹语形式音译，没有统一成其他版本或传统中较熟悉的拼法。
    reason: textual_variant
  - marker: b
    text: “图里埃勒”在吉兹语名单中重复出现，且拼写略有差异；译文保留这种重复，没有擅自校改。
    reason: textual_variant
  - marker: c
    text: 其他版本或译本对名单中一些名字有不同的音译，这通常反映对吉兹语词形辨认和转写的不确定。
    reason: alternative_reading
lexical_decisions:
- source_word: ወነዋ
  choice: 看哪
  rationale: 保留启示文学中引人注意的提示语，不将其省略或弱化为普通系词。
- source_word: አስማቲሆሙ፡ ለእሉክ፡ መላእክት
  choice: 那些天使的名字
  rationale: 按属有关系自然表达，并保留指示词的回指作用。
- source_word: ወዝንቱ፡ ውእቱ፡ አስማቲሆሙ
  choice: 这就是他们的名字
  rationale: 保留原文第二个名单引介句，不与前句合并。
- source_word: ቀዳማዊ፡ ዚአሆሙ
  choice: 第一位是
  rationale: 以现代汉语自然表达分项次序和其中第一人的含义。
- source_word: ጡሩኤል / ጡርኤል
  choice: 图里埃勒
  rationale: 对略有拼写差异而重复出现的名字采用统一音译，同时保留名单中的三次出现。
- source_word: ስምያዛ
  choice: 塞米亚扎
  rationale: 依吉兹语可见形式音译，不强行协调为其他传统中较熟悉的拼法。
- source_word: አዛዝኤል
  choice: 阿撒泽勒
  rationale: 采用中文中清楚且接近源词音节的音译；不把名字解释性翻译。
theological_decisions:
- issue: 是否把天使名字统一为其他以诺传统或后期传统中较熟悉的形式
  choice: 尽量依照本节吉兹语见证音译
  alternative: 将达尼亚勒、鲁米亚勒、科卡贝勒等协调为更常见的名字形式
  rationale: 本段主要依赖吉兹语传本；贴近现存词形可避免掩盖文本的不确定性，也不引入后期传统。
- issue: 是否删改名单中重复出现的图里埃勒
  choice: 保留三次重复
  alternative: 把重复视为抄写错误并删去或改名
  rationale: 在缺乏更强文本依据时，不应默默校改正式名单；译文忠实呈现传本的重复。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文双重引介名单的修辞结构；专名按吉兹语形式作一致、可读的简体中文音译。脚注集中置于名单末段，且所有标记均在正文出现。
