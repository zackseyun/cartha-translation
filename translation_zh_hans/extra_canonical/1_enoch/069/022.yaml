base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/022.yaml
  text: And likewise heaven[a], the spirits of the winds, and all the spirits[d][c][b], and their paths from all the gatherings of spirits.
translation:
  language: zh_hans
  text: 同样，天、风的灵[a]、所有的灵，以及它们从各个灵群[b]而来的路径[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风的灵”所对应的两个词都属于“气息、风、灵”的语义范围；这一短语也可较直译为“风之风”。
    reason: lexical_alternative
  - marker: b
    text: “灵群”也可译作“灵的各个群体”“各个集合”或“各个会集”。
    reason: lexical_alternative
  - marker: c
    text: “路径”也可译作“道路”“行程”或“运行轨迹”。本句原文是较难理解的无动词列举，所表达的从属关系并不完全明确。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ሰማይ
  choice: 天
  rationale: 原文为单数，在此指宇宙性的天界；“天”比“天空”更符合启示文学语境，也不擅自改为复数。
- source_word: ነፋሳቲሆሙ ለነፋሳት
  choice: 风的灵
  rationale: 按前置代词式属格结构理解，保留两个同属气息、风、灵语义域的词项之间的关系；结合宇宙现象的上下文，将后一项译作“风”，前一项译作“灵”。不补入原文没有的“接纳”等动词。
- source_word: መንፈሳት
  choice: 灵
  rationale: 该词在本句重复出现，译作“灵”可保持宇宙论和启示文学色彩，并避免擅自限定为人的“灵魂”或纯粹自然界的“风”。
- source_word: ወፍናዋቲሆሙ
  choice: 它们……的路径
  rationale: 该词形较难确定，可能指道路、行程或运行轨迹；“路径”既保留空间和运动意象，又不过度技术化。
- source_word: እምኵሉ ኅብራት መንፈሳት
  choice: 从各个灵群而来
  rationale: ኅብራት 表示群聚、集合或结群；“灵群”简洁地保留其集合意义，而不预断这些群体是军旅、阶级还是正式会众。
theological_decisions:
- issue: 是否把两组气息／灵相关词都解释为人的灵魂
  choice: 将 ነፋሳቲሆሙ ለነፋሳት 译作“风的灵”，将 መንፈሳት 译作“灵”
  alternative: 把相关词统译为“灵魂”，或统译为“风”
  rationale: 本节列举宇宙性事物，原文又使用不同但语义相邻的词。区别译法可保留其词汇张力，并避免把后期身心二分观念强加于文本。
- issue: 是否为无动词的列举补出“天接纳了”
  choice: 保留列举结构，以“还有”承接，不补“接纳”
  alternative: 译作“天接纳了它们的灵”
  rationale: 吉兹语文本没有表示“接纳”的动词；补入该动作会把宇宙事物清单改成有关灵魂归宿的陈述，从而引入原文未明说的神学含义。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“同样，还有”使汉语能够自然承接上下文，同时保留原文无动词的列举性质；不使用带有特定宗派色彩的术语。
