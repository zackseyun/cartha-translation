base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/012.yaml
  text: 'And the fifth was named Kasdeya[a]. This is the one who showed the children of men all the evil blows of spirits and of demons, and the blows in the womb, so that the embryo miscarries, and the blow upon the soul: the bite of the serpent[f][e][d][c][b], and the blow that comes at noon—the son of the serpent whose name is Taba''et.'
translation:
  language: zh_hans
  text: 第五个名叫卡斯德亚。他向人类子孙显示了诸灵和鬼魔的一切邪恶打击，以及加在母腹中胎儿身上、使其流产的打击；又显示了对魂的打击[a]：蛇的咬伤，以及正午发生的打击——名叫塔巴埃特的蛇之子[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对魂的打击”在这一文本见证中不确定；也可理解为“对生命的打击”。
    reason: textual_variant
  - marker: b
    text: “塔巴埃特”为音译；其吉兹语形式也可转写为 Taba'et、Tabaet 等。
    reason: name_transliteration
  - marker: c
    text: 末句结构含混。它可能把名叫塔巴埃特的“蛇之子”与正午之害联系起来，也可能是在另行指出一个灵界存在。
    reason: alternative_reading
lexical_decisions:
- source_word: ኃምስ፡ ስሙ፡ ካስድያእ
  choice: 第五个名叫卡斯德亚
  rationale: 保留名单中的序数与命名句式；专名按吉兹语形式音译。
- source_word: ዘአርአዩ፡ ለውሉደ፡ ሰብእ
  choice: 指给人类子孙看的
  rationale: 动词本义偏向“使看见、显示”，不擅自强化为正式“教导”；“人类子孙”保留启示文学表达，同时比“人的儿子们”更符合现代汉语。
- source_word: ኵሎ፡ ዝብጠታተ፡ እኩየ
  choice: 一切邪恶击打
  rationale: 反复出现的名词含击打、打击或加害之意；译作“击打”可保留具体而诡异的意象及原文重复。
- source_word: ዘነፍሳት፡ ወዘአጋንንት
  choice: 诸灵和群魔
  rationale: 保留两类灵界存在的并列，不把二者合并或泛化。
- source_word: ዝብጠታተ፡ ባእባአ፡ ማሕፀን፡ ከመ፡ ይደቅ
  choice: 使胎儿流产的子宫内击打
  rationale: 以通顺汉语表达妊娠中所受伤害及其流产结果，同时在脚注说明结构难解。
- source_word: '[ዝብጠተ፡ ነፍስ፡]'
  choice: 对魂的击打
  rationale: 保留此处单数“击打”和“魂”的宗教语义；方括号所示文本不确定性另作脚注。
- source_word: ንስክተ፡ አርዌ
  choice: 蛇的咬伤
  rationale: 采用最直接的蛇类伤害意象，不改释为抽象邪术。
- source_word: ዘይከውን፡ በቀትር
  choice: 正午发生的击打
  rationale: 直译时间限定，保留正午在启示文学中可能具有的凶险意味。
- source_word: ወልዳ፡ ለአርዌ፡ ዘስሙ፡ ተባዕት
  choice: 那蛇之子名叫塔巴埃特
  rationale: 保留压缩的身份说明与专名，不确定其与“正午击打”的确切句法关系。
theological_decisions:
- issue: 卡斯德亚所显示之伤害的性质
  choice: 保留为与诸灵、群魔、流产、魂、蛇咬及正午有关的一系列邪恶击打
  alternative: 将其解释为普通武器、一般身体创伤，或明确的邪术口诀
  rationale: 上下文的灵界称谓和反复的击打语言指向超自然或邪魔性的伤害；译文不把这些意象自然化，也不超出原文断定它们是咒语。
- issue: “蛇之子名叫塔巴埃特”与前句的关系
  choice: 用破折号使其暂时附接于“正午发生的击打”，同时以脚注保留不确定性
  alternative: 把塔巴埃特明确认定为独立的魔灵，或认定为那条蛇本身
  rationale: 原句句法紧缩，可能是在说明正午之害，也可能另指一个存在；正文维持连贯，但不把某一种解释绝对化。
- issue: “对魂的击打”的文本地位
  choice: 纳入正文并标注文本不确定
  alternative: 删去该短语，或改译为“对生命的击打”
  rationale: 所给见证以方括号标出该语，虽不稳却有合理可读性；保留“魂”可避免提前解决其究竟指生命还是灵魂的张力。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。“击打”虽较不寻常，但有意保留原文反复出现的具体词汇和启示文学的诡异感；专名使用易读音译。正文未把灵界伤害解释成特定宗派体系中的魔法或鬼魔分类。
