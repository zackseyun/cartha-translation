base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/025.yaml
  text: And over them this oath became strong[a], and they are kept by it; and their paths are kept[c][b], and their courses do not perish.
translation:
  language: zh_hans
  text: 这誓言在它们之上变得坚固[a]，它们借着这誓言被守住；它们的路径也被守住，它们的运行不会消逝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “变得坚固”也可译作“变得有力”或“得以坚立”。这里指这誓言牢固并发挥效力。
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲቤሆሙ
  choice: 在它们之上
  rationale: ግዕዝ语介词表达“在……之上、凌驾于……”；此处保留誓言对相关对象所具有的约束或统摄意味，不弱化为“在它们中间”。
- source_word: ጸንዐ
  choice: 坚立
  rationale: 该动词表示变得坚固、确立或有力。“坚立”既体现誓言的牢固效力，又不把它限定为现代法律意义上的执行。
- source_word: ዝማሐላ
  choice: 这誓言
  rationale: ዝ带有指示作用，故译作“这”；ማሐላ直接译为“誓言”。
- source_word: ይትዓቀቡ
  choice: 被守住／受到守护
  rationale: 未完成体被动或反身形式表示持续受到看守、保存或约束。两处依中文搭配分别译为“被守住”和“受到守护”，同时保留保护与约束之间的含混。
- source_word: ቦቱ
  choice: 因此
  rationale: 指回誓言，表示凭借它或借着它。中文“因此”在这里自然表达“由这誓言所成就”的工具性关系，但不解释其具体机制。
- source_word: ፍናዊሆሙ
  choice: 它们的路径
  rationale: 该词指道路、路径或行进之道；“路径”保留有秩序运动的意象。
- source_word: ምሕዋራቲሆሙ
  choice: 它们的运行轨道
  rationale: 复数词可指运行、周行或循环路线。在宇宙性语境中，“运行轨道”表达有序运动，同时未限定为某种具体天文学体系。
- source_word: ኢይማስን
  choice: 不会消失
  rationale: 否定动词可表示不消亡、不失效或不毁坏。“不会消失”与路径、运行轨道的延续相配，也保留其持久不废的含义。
theological_decisions:
- issue: 本节是在描述道德顺服、誓言的约束力，还是誓言之下的宇宙秩序
  choice: 译文保留多重可能：这誓言凌驾于相关对象之上，使它们持续被守住，其路径与运行轨道也维持不废。
  alternative: 可理解为誓言约束天使服从，也可理解为誓言维系宇宙诸要素的固定运行，或同时兼有两者。
  rationale: “被守住”带有保护或约束的可能，而“路径”和“运行轨道”又指向有序运动。原文没有要求只取伦理、法律或宇宙论中的一种，故不替读者消解这种张力。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。“它们”避免预先断定所指是具人格的天使还是宇宙要素；分号呈现原句各分句间紧密而递进的关系。所有脚注标记均置于正文对应位置。
