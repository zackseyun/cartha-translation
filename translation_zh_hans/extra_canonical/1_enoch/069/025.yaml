  timestamp: '2026-07-14T09:53:16Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确地保留了“这誓言”“在它们之上”、持续性的被动“被守住”以及末句不消亡的意思。不过，“因此”主要表达因果，未充分表达ቦቱ“借着它／藉着它”的工具性关系；“运行轨道”则较明确地限定为天体轨道，超过原文可指行程、周行或循环运行的开放性。两处重复的被动动词宜在中文中也尽量一致呈现。
  naturalness: 原文庄重可读，但“这誓言在它们之上坚立”搭配略显生硬，“它们也因此被守住”指代和关系较不清晰。改为“变得坚固”及“借着这誓言”更自然、明确。
  terminology: “誓言”“路径”恰当。“它们”审慎地不预断对象是有位格者还是宇宙要素，应保留。“运行”比“运行轨道”更不限定具体宇宙论或天文学意义。
  issues:
  - severity: medium
    issue: “因此”弱化了ቦቱ的工具性。
    rationale: 该词回指“这誓言”，主要是“借着它／藉着它／由它”而非单纯“所以”。中文应明确誓言是使其被守住的媒介或凭借。
  - severity: medium
    issue: “运行轨道”将ምሕዋራቲሆሙ过度具体化。
    rationale: 该词可指行程、周行、循环或有序运行；“轨道”尤其容易限定为天体的物理轨道。译作“运行”可保留宇宙性与较一般的有序运动两种可能。
  - severity: low
    issue: 两处重复的被动动词译法不一致。
    rationale: 原文疑似重复同一被动形式；正文用“被守住”重复呈现，更能保留这一显著而略有难度的结构。
  revised_text: 这誓言在它们之上变得坚固[a]，它们借着这誓言被守住；它们的路径也被守住，它们的运行不会消逝。
  revised_footnotes:
