revisions:
- from: 这誓言在它们之上坚立[a]，它们也因此被守住；它们的路径受到守护[b]，它们的运行轨道不会消失。
  to: 这誓言在它们之上变得坚固[a]，它们借着这誓言被守住；它们的路径也被守住，它们的运行不会消逝。
  rationale: 修订以“借着这誓言”恢复原文的工具性关系，以“变得坚固”更直接对应动词的变化状态，并将“运行轨道”改为较不具体的“运行”。同时重复“被守住”，以保留原文重复被动形式及其保护／约束的双重可能。脚注b对应原文中第二次出现的困难重复结构，故在正文“路径也被守住”后加注。
