base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/004.yaml
  text: And the name of the first was Yeqon[a]; this is the one who led all the children of the angels astray, and brought them down upon the dry land[d][c][b], and led them astray through the daughters of men.
translation:
  language: zh_hans
  text: 第一个名叫耶昆[a]；就是他使天使的儿女[b]全都误入歧途，又使他们降到干地上[c]，并借着世人的女儿使他们误入歧途。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶昆”是吉兹语名字ይቁን的音译；不同转写系统中的拼写可能略有不同。
    reason: 专名音译存在不确定性。
  - marker: b
    text: 原文直译为“天使的儿女”。这也可能泛指天使群体或天军，但原文保留了亲属称谓。
    reason: 保留不寻常措辞及其所指的解释空间。
  - marker: c
    text: “干地”也可译作“地上”或“陆地”；原文具体指与天上相对的干地、地上领域。
    reason: 说明空间词语的可译范围。
lexical_decisions:
- source_word: ወስሙ፡ ለቀዳማዊ፡ ይቁን
  choice: 第一个名叫耶昆
  rationale: 按名单式命名公式译出；专名采用贴近吉兹语形式的音译，不赋予词义。
- source_word: ዝውእቱ
  choice: 就是他
  rationale: 保留指示词加系词所形成的强调性确认，同时使现代汉语自然。
- source_word: ዘአስሐተ / ወአስሐቶሙ
  choice: 使……误入歧途（两次）
  rationale: 两处动词同根，重复同一译法以保留原文的修辞呼应和道德含义。
- source_word: ደቂቀ፡ መላእክት
  choice: 天使的众儿女
  rationale: 保留原文亲属称谓“儿女/子女”，不直接简化为“天使”；“众”配合后面的全称词。
- source_word: ወአውረዶሙ
  choice: 又把他们带下来
  rationale: 原词为“下降”的使役形式；“带下来”保留向下运动，不额外断定是强行抛下还是诱导降下。
- source_word: ዲበ፡ የብስ
  choice: 到了旱地
  rationale: 保留具体的干地意象及从上而下到达地上领域的空间关系；汉语用“到了”避免生硬。
- source_word: በአዋልደ፡ ሰብእ
  choice: 借着世人的女儿
  rationale: 将በ理解为手段，明确耶昆仍是使其误入歧途的施事者；“世人”自然表达与天使相对的人类。
theological_decisions:
- issue: “天使的儿女”所指为何
  choice: 正文保留亲属结构“天使的众儿女”
  alternative: 天使；天军；属天者的子孙
  rationale: 吉兹语措辞本身异常且具有解释张力，直接平整为“天使”会掩盖文本特征。
- issue: 两次迷惑动词的力度与关系
  choice: 两次均译为“使……误入歧途”
  alternative: 欺骗……诱惑；迷惑……引诱
  rationale: 原文重复同一词根；统一译法避免凭空引入两个不同动作或不同程度。
- issue: 世人的女儿在句中的语义角色
  choice: 译为手段“借着世人的女儿”
  alternative: 被世人的女儿；因世人的女儿
  rationale: 介词በ在此最合适理解为手段，不应使汉语读者误以为这些女子是主动迷惑天使的施事者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留名单体的简洁陈述、两次“误入歧途”的重复，以及“天使的众儿女”这一不寻常表达；不以宗派解释代替原文。
