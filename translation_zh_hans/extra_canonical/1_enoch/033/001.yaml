base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/001.yaml
  text: And from there I went to the ends of the earth[a], and there I saw great beasts, and they differed from one another; and the birds also differed in their appearance and their forms[c][b], and their voices also differed one from another.
translation:
  language: zh_hans
  text: 我从那里走到大地的尽头，看见那里有巨大的野兽，彼此各不相同。鸟的外貌[a]和形态[b]也各不相同，它们的声音也彼此不同。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“脸”或“面”；这里按鸟类彼此可见的差别译作“外貌”。
    reason: lexical_alternative
  - marker: b
    text: 译作“形态”的原词在此转录见证中的词形或确切含义不十分确定，也可能指外形、体态或构造。
    reason: textual_variant
lexical_decisions:
- source_word: እምህየ፡ ሖርኩ
  choice: 我从那里走
  rationale: 保留异象叙事中从一处继续前行的顺序感；用现代汉语的平实表达，不额外强化为“旅行”或“远征”。
- source_word: አጽናፈ፡ ምድር
  choice: 大地的尽头
  rationale: 这是启示文学中的宇宙地理意象；“大地的尽头”自然庄重，也不把它弱化成一般意义上的遥远地区或边境。
- source_word: አራዊተ፡ ዐበይተ
  choice: 巨大的野兽
  rationale: 该短语指体形巨大的野生兽类；“野兽”保留原文的类别和异象语气。
- source_word: ይትዌለጥ፡ ፩እምካልኡ
  choice: 彼此各不相同
  rationale: 表达个体或种类之间相互有别，并在野兽与鸟的描述中尽量保留原文反复出现的“不同”。
- source_word: ገጾሙ
  choice: 外貌
  rationale: 字面可指“脸、面”，但这里列举鸟类可见的差异，用“外貌”更符合现代汉语，同时以脚注保留较直译的可能。
- source_word: ስኖሙ
  choice: 形态
  rationale: 该词在所据转录见证中的词形或含义存在一定不确定性，语境上可能指外形、体态或构造；“形态”保持概括，不擅自具体化为“身体的形状”。
- source_word: ቃሎሙሂ
  choice: 它们的声音也
  rationale: 保留“声音”的字面意义以及附加成分“也”，体现原文进一步指出听觉上的差异。
theological_decisions:
- issue: “大地的尽头”应按宇宙图景还是普通地理边界理解
  choice: 大地的尽头
  alternative: 大地的边界
  rationale: 原文处于启示文学的异象行程中，宜保存其宇宙地理意象，不在译文中将其解释为普通国界，也不对古代宇宙观作教义化裁断。
- issue: 是否把鸟的“面”直译为“脸”
  choice: 外貌
  alternative: 脸面
  rationale: 上下文比较鸟类的多种可见及可听特征，“外貌”在现代汉语中更自然；脚注说明字面含义，以保留原文的具体性与歧义。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。首句保留异象行程的推进；后两句保留原文反复陈述“彼此不同”的节奏，并避免把含义不确定的身体特征过度具体化。
