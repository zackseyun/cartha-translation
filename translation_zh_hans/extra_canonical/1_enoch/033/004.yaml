base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/004.yaml
  text: He showed me everything[a], and wrote it down for me; and again he wrote down for me their names, and their commands[c][b], and their companies.
translation:
  language: zh_hans
  text: 他把一切都指给我看，并为我写下来；又为我写下它们的名字、命令[a]和群组[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“它们的定规”或“为它们所定的秩序”。原词可指命令、规定或权威设定的秩序。
    reason: lexical_alternative
  - marker: b
    text: 或译“它们的编组”或“它们的集合”。这里可能指异象中按秩序划分的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ
  choice: 一切
  rationale: 作“指给我看”的宾语，保留原词涵盖全部的语气；现代汉语中简洁自然。
- source_word: አርአየኒ
  choice: 他把……指给我看
  rationale: 直接表达使观看者看见的动作，符合异象叙事，也避免用“启示”加入额外解释。
- source_word: ጸሐፈ ሊተ
  choice: 为我记录下来／为我写下
  rationale: 原文短语重复出现；汉语分别用近义表达，既保留记录行为及“为我”的关系，也使句子自然。
- source_word: ወዓዲ
  choice: 又
  rationale: 表示进一步或再次发生的书写行为，简洁保留原文的递进重复。
- source_word: አስማቲሆሙ
  choice: 它们的名字
  rationale: 忠实保留复数及第三人称复数领属关系；上下文所指可能是天体或相关实体，故采用中性的“它们”。
- source_word: ትእዛዞሙ
  choice: 所受的命令
  rationale: 基本义为命令、训令或规定；“所受的命令”在汉语中说明这些命令属于相关实体而非由它们发出，同时不把宇宙秩序的可能含义定死。
- source_word: ማኅበራቲሆሙ
  choice: 各自的群组
  rationale: 表达有组织的集合或编组，同时避免“军旅”“天军”等源文没有明确要求的强化意象。
theological_decisions:
- issue: 末句是否应明确解释为天使或天体的等级编制
  choice: 采用中性的“它们”与“群组”，不明确指定为天使、天军或星体阶级
  alternative: 译作“它们的天军／队伍”或明确说“众星的编队”
  rationale: 上下文支持宇宙或天上实体的有序分组，但本节本身没有明说其本体；保留指称的开放性可避免把异象意象过度系统化。
- issue: ትእዛዞሙ 在本节应译为“命令”还是“法则／定规”
  choice: 正文用“所受的命令”，脚注注明“定规／所定的秩序”
  alternative: 正文直接译为“法则”或“定规”
  rationale: “命令”较贴近词的核心权威性含义；宇宙运行规范的语境义则通过脚注保留，不把词义提前收窄为自然法则。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。分号保留两个书写动作之间的层次；“指给我看”维持异象的视觉性。所有脚注标记均置于正文相应词语之后。
