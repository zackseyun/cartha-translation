base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/003.yaml
  text: And I saw the portals from which the stars of heaven come out[a], and I wrote down all their outlets, each one by itself, according to their number and their names, by their order and their activity and their times and their months, as Uriel, the holy angel who was with me[c][b], showed me.
translation:
  language: zh_hans
  text: 我看见天上的星辰如何出来，并数点了它们从中出来的门户。我把它们所有的出口逐一记录下来，按它们的数目、名称、次序、运行、时节和月份记载；这正如与我同在的圣天使乌列所指示我的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አፎ
  choice: 怎样
  rationale: 此处按副词理解为“怎样、如何”，而非“口”。这样也与后文对星辰出行规律的详细记录相呼应；“从何处”仍是语境上可能的译法，列入脚注。
- source_word: ይወጽኡ / ይወፅኡ
  choice: 出来
  rationale: 保留星辰从宇宙门径中实际出来的异象性图景，并用自然现代汉语表达两个同源语境中的动作。
- source_word: ከዋክብተ ሰማይ
  choice: 天上的星辰
  rationale: 直接保留其宇宙性和庄重语域；“星辰”比口语“星星”更符合启示文学文体。
- source_word: ወኍለቁ
  choice: 也数了
  rationale: 按第一人称动词“我数了、我清点了”理解，使其支配后面的复数宾语“门”；这比把它处理为地点名词更符合该句句法及现有词汇审查。
- source_word: ኀዋኅወ
  choice: 门
  rationale: 该词指门、门户，是《以诺一书》宇宙图景中的具体结构，不宜泛化为“地方”。
- source_word: ጸሐፍኩ ኵሎ ሙፃኣቲሆሙ
  choice: 我把它们一切出行之处都记录下来
  rationale: 既表达“写下、记录”，也保留由“出去”构成的名词所含的地点或路径意味，不把它仅仅抽象化为运动。
- source_word: ለለ፩፩
  choice: 一一记下
  rationale: 自然表达分配性含义，即逐一记录，而不是笼统概述。
- source_word: በኍልቆሙ ወእስማቲሆሙ
  choice: 它们的数目、名称
  rationale: 直接呈现星辰受清点和命名的有序性。
- source_word: በደርጎሙ
  choice: 次序
  rationale: 可涵盖排列、等级或顺序；在此天文目录语境中，“次序”自然且不过度限定。
- source_word: ወምገባሮሙ
  choice: 运行
  rationale: 原词可指作为、活动或功用；在星辰语境中译为“运行”最自然，同时仍保留其动态功能。
- source_word: ወጊዜሆሙ ወአውራኂሆሙ
  choice: 时节和月份
  rationale: “时节”兼顾时间和周期意味，“月份”则直接保留历法层面的陈述。
- source_word: ኡርኤል
  choice: 乌列
  rationale: 采用现代汉语中简洁、常见的音译形式。
theological_decisions:
- issue: 星辰从天上门户出行的宇宙图景
  choice: 保留星辰“出来”、经过“门”以及具有出行之处的具体异象语言
  alternative: 将其现代化为星辰在地平线上升起或一般性的天文观测
  rationale: 经文呈现的是被天使指示的启示性宇宙结构。译文不应以现代天文学解释取代原文图景，也不应判定其仅为比喻。
- issue: 乌列的角色
  choice: 译为向以诺“指示”这些受记录的秩序
  alternative: 强化为乌列创造、控制或颁定星辰秩序
  rationale: 原文只说明乌列展示或指示，以诺则观看并记录；译文不添加有关天使权能的教义推断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“星辰”“时节”“指示”维持启示文学的尊严感；句法则分为两句，避免原文长串并列在汉语中显得滞重。保留“门”“出来”“出行之处”等具体宇宙意象，不改写为现代天文学术语。
