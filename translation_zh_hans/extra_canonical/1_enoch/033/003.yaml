revisions:
- from: 我看见天上的星辰怎样出来[a]，也数了它们出来所经过的门[b]。我把它们一切出行之处都记录下来，一一记下它们的数目、名称、次序、运行、时节和月份，正如与我同在的圣天使乌列向我所指示的。
  to: 我看见天上的星辰如何出来，并数点了它们从中出来的门户。我把它们所有的出口逐一记录下来，按它们的数目、名称、次序、运行、时节和月份记载；这正如与我同在的圣天使乌列所指示我的。
  rationale: 保留原文的“如何出来—数点门户—记录出口”的连续异象图景，并将门户明确译为星辰“从中出来”的门户。这样既避免把门户泛化为地点，也不采纳与该句动词和宾语结构不符的省略性处理。
