base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/002.yaml
  text: And to the east of these beasts I saw the ends of the earth[a], where the heaven rests[d][c][b], and the open gates of heaven.
translation:
  language: zh_hans
  text: 在这些兽的东边，我看见了大地的尽头[a]，就是天停驻之处[b]，以及敞开的天门[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地的边界”。原文指世界最远的界限。
    reason: lexical_alternative
  - marker: b
    text: 这里保留了古代宇宙图景：天在世界边缘有停驻之处。
    reason: cultural_note
  - marker: c
    text: “天门”也可译作“天的门户”或“天的开口”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽባሖሙ ለእሉ አርዌ
  choice: 在这些兽的东边
  rationale: 按词句明确保留方位“东边”和所指对象“这些兽”，不泛化为“在这些以外”。
- source_word: አጽናፈ ምድር
  choice: 大地的尽头
  rationale: 这是表示世界边界的宇宙地理用语；“大地的尽头”自然、庄重，并保留古代启示文学的具体图景。
- source_word: በኀበ ሰማይ የዐርፍ
  choice: 天停驻在那里
  rationale: 动词表达歇息、停驻；此译保留天在大地边缘停驻的具体宇宙观意象，避免现代化为“天地相接”。
- source_word: ኀዋኅወ ሰማይ ርኁዋተ
  choice: 敞开的天门
  rationale: 该名词可指门、门户或开口；“天门”在现代中文中简洁自然，也适合启示文学的天界建筑意象。“敞开的”体现其开放状态。
theological_decisions:
- issue: 天停驻在大地尽头的古代宇宙观图景
  choice: 保留“天停驻在那里”的具体表述
  alternative: 天在那里与大地相接／天际所在之处
  rationale: 经文描绘的是异象中的宇宙地理，不宜将其改写成现代地平线观念或抽象比喻。译文保留其古代启示文学中的张力，而不判断该图景应如何与现代宇宙观协调。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号理清“看见”所带的两个并列对象，但不改变原文异象的连续性；保留“大地的尽头”“天停驻”“天门”等具体宇宙建筑意象。
