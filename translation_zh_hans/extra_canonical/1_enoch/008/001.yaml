base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/008/001.yaml
  text: 'And Azazel taught men to make swords[a], and knives, and shields, and breastplates; and he showed them what was behind them and their works: bracelets, and ornaments, and the painting of the eyes, and the beautifying of the eyelids, and every kind of costly stone[b], and all coloring tinctures.'
translation:
  language: zh_hans
  text: 亚撒兹勒教人制造刀剑、短刀、盾牌和胸甲；他又把“在它们后面的事物”[a]和制作这些东西的方法指给人看，还教人制作手镯和饰物、描画眼睛、美化眼睑，以及使用各种宝石和各色染料。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在它们后面的事物”所据的吉兹语短语（ዘእምድኅሬሆሙ）在底本中带有校勘符号，文字或传抄可能有问题。这里保留其晦涩性；有些译本依据上下文将它解释为金属或相关材料。
    reason: textual_variant
  - marker: b
    text: 眼部描画指古代以颜料涂饰眼周、眼睑等美容做法。所给转录文本的末尾也不十分稳定；“各色染料”采用了本节传统分句所保存的理解。
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: መሀሮሙ፡ ለሰብእ
  choice: 教人
  rationale: 该短语表示向人传授知识；“人”在现代汉语中可泛指人类，也避免把所指范围不必要地限定为男性。
- source_word: ገቢረ፡ አሰይፍት
  choice: 制造刀剑
  rationale: ገቢረ强调制作或工艺，并非仅指持有武器；“刀剑”自然地表达复数兵刃而不过度细分形制。
- source_word: መጣብኅት
  choice: 短刀
  rationale: 原词指切割用的刀具或兵刃；“短刀”既与前面的刀剑有所区分，又不武断地限定为某一种军用匕首。
- source_word: ወወልታ፡ ወድርዐ፡ አንግድዓ
  choice: 盾牌和胸甲
  rationale: 依次表达防御用盾和护胸甲胄，采用普通现代读者容易理解的名称。
- source_word: ዘእምድኅሬሆሙ
  choice: “在它们后面的事物”
  rationale: 底本文字受到校勘符号标示，含义晦涩；采用接近字面的表达并加引号、脚注，不以“金属”等推测性读法替换现存措辞。
- source_word: ወምግባሮሙ
  choice: 制作这些东西的方法
  rationale: 该词可指工作、制作或工艺；结合前列器物，译为制作方法较通顺，同时保留其与前文器物的关联。
- source_word: እውቃፋተ፡ ወስርጐ
  choice: 手镯和饰物
  rationale: 前者是戴在手腕或手臂上的装饰品，后者为宽泛的装饰物总称。
- source_word: ወተጽሕሎተ፡ ወአስንዮተ፡ ቀርንብ
  choice: 描画眼睛、美化眼睑
  rationale: 这里描述具体的眼部化妆和修饰做法，不宜抽象化为一般的“美丽”。
- source_word: ወእብነ፡ እምኵሉ፡ እብን
  choice: 各种宝石
  rationale: 字面反复提到“石”，而装饰品与化妆品的语境支持“各种宝石”；不采用强调经济价值的“昂贵宝石”。
- source_word: ወእብነ（末项，依英语校勘层所反映的传统分句）
  choice: 各色染料
  rationale: 传统释读将末项理解为用于着色的材料；中文用“各色染料”简洁呈现，但因当前转录行末存在不稳定之处，在脚注中提示文本问题。
theological_decisions:
- issue: 是否把亚撒兹勒所传授的技艺明说成邪恶、用于战争或诱惑
  choice: 只译出“教”和“指给人看”，让武器与装饰技艺的清单及《守望者之书》的上下文承担负面意味。
  alternative: 增译“邪恶的技艺”“用于战争”或“用于诱惑”。
  rationale: 本节本身没有使用这样的道德形容词；增译会提前消解叙事所保留的神学张力。
- issue: 是否把晦涩短语解释为金属及其加工术
  choice: 保留近乎字面的“在它们后面的事物”，并以脚注说明不确定性。
  alternative: 译作“金属及其加工方法”。
  rationale: 所给吉兹语见证明确以校勘符号标出该短语；现有证据不足以把一种顺畅的校勘解释直接写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。武器和装饰品使用通行名称；难解处不强行润色为确定意义。引号仅用于提醒读者该短语本身异常，并与脚注[a]相配。
