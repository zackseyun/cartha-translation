    reason: textual_variant
  - marker: b
    text: “眼部描画”和“眼睑的修饰”指古代以颜料涂饰眼周、眼睑等的美容做法。所给转录文本的末尾也不十分稳定；“各色染料”采用本节传统分句所保存的理解。
    reason: textual_and_cultural_note
  revision_rationale: 删除原文未明说的“教人制作”和“使用”，使“指示给他们”支配后续清单；以“在其后面的事物”避免为受校勘标示短语预断指代，并保留原有文本与文化说明。
