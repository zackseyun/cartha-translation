review_pass:
  verdict: revise
  source_fidelity: 修订稿应保留带校勘符号的吉兹语短语之不确定性，但现译“在它们后面的事物”无根据地把代词限定为前列器物；字面上更宜保留为“他们身后的事物”。此外，原文在“他向他们展示”之后连续列举内容；现有“还教人制作……以及使用……”把展示改成新的制作与使用 instruction，且使句法关系过度明确。
  naturalness: 原译整体通顺，但“把……和制作这些东西的方法指给人看，还教人制作……”的并列层次不够清楚。以冒号引出展示的清单，既更自然，也更贴近原文的列举形式。
  terminology: “亚撒兹勒”“刀剑、短刀、盾牌和胸甲”“手镯和饰物”均可保留。“描画眼睛、美化眼睑”准确呈现眼部化妆。将[b]紧接“各种宝石”，使其与关于化妆及宝石的说明对应；“各色染料”仍须以脚注说明其来自传统分句的理解，不能伪装为当前不稳定转录行的无争议直译。
  issues:
  - severity: medium
    issue: 难解代词被译为“它们”
    rationale: 校勘符号所标出的短语含义和指代都不稳；“它们”将其限定为武器等器物，而原文形式及英语审计轨迹均不支持作此确定。应保留为“他们身后的事物”，并由脚注说明不确定性。
  - severity: medium
    issue: “展示”后的清单被改写成“教人制作／使用”
    rationale: 原文在“他向他们展示”后列举手镯、饰物、眼部化妆、宝石等；增加“制作”“使用”会把未明确的动作写实，并改变句法组织。
  - severity: low
    issue: '[b]脚注锚点位于“各色染料”之后，脚注内容却主要涉及眼部化妆和宝石'
    rationale: 应把[b]置于“各种宝石”后，并在脚注中分别简要交代化妆语义与末项“染料”的传统分句依据。
  revised_text: 亚撒兹勒教人制造刀剑、短刀、盾牌和胸甲；他又向他们展示“他们身后的事物”[a]及其制作：手镯、饰物、描画眼睛、美化眼睑、各种宝石[b]，以及各色染料。
  revised_footnotes:
  - marker: a
    text: “他们身后的事物”所据的吉兹语短语（ዘእምድኅሬሆሙ）在底本中带有校勘符号，文字或传抄可能有问题。这里保留其晦涩性，不把它确定解释为金属、材料或其他事物。
    reason: textual_variant
  - marker: b
    text: “描画眼睛”和“美化眼睑”指以颜料涂饰眼周、眼睑等的古代美容做法。所给转录文本的末尾也不十分稳定；“各色染料”采用本节传统分句所保存的理解。
    reason: textual_and_cultural_note
  revision_rationale: 修订将难解短语的指代维持在最低限度，不采用“金属”等推测性校勘；恢复“展示”统领后续清单的句法，避免增添制作或使用的动作；并校正[b]的脚注锚点及其说明范围。
