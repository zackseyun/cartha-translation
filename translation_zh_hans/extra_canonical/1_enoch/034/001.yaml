  text: And from there I went toward the north[a], to the ends of the earth[c][b], and there I saw a great wonder.
translation:
  language: zh_hans
  text: 我从那里往北方走，来到地极；在那里，我看见了一个大奇观。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: 从那里
  rationale: 自然表达从前一异象地点出发的叙事衔接。
- source_word: ሖርኩ
  choice: 我……走
  rationale: 采用朴素的移动动词，符合原文简洁的行程报告体。
- source_word: መንገለ መስዕ
  choice: 往北
  rationale: መንገለ 表方向，መስዕ 指北方；据词义直译，避免旧译误作南方。
- source_word: በአጽናፈ ምድር
  choice: 直到地极
  rationale: 保留启示文学中的宇宙地理意象，同时以现代汉语自然表达行程所至。
- source_word: ርኢኩ
  choice: 我看见
  rationale: 准确传达常见的异象叙述动词，不使用古雅而生硬的措辞。
- source_word: ምሕረ ዐቢየ（校作 መንክረ ዐቢየ）
  choice: 一个壮观的奇景
  rationale: 所给转写中的 ምሕረ 很可能是将 መንክረ“奇事、奇观”误识后的结果；结合校勘信息译作“壮观的奇景”，而不采用缺乏词汇依据的“安歇之地”。
theological_decisions:
- issue: 末端名词所描写的是奇观还是安歇之地
  choice: 奇景
  alternative: 安歇之地；极大的安息
  rationale: 校勘证据支持原词为 መንክረ“奇观、奇事”；因此不把本节解释成某种死者或末世安息处，也不额外规定奇景的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“地极”保留启示文学的宏阔意象；“壮观的奇景”自然传达 መንክረ ዐቢየ，未添加奇景内容。
