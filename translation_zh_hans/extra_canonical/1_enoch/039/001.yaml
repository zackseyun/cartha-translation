base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/001.yaml
  text: And it will happen in those days that the chosen and holy ones will descend from the high heaven[d][c][b][a], and their offspring will become one with the children of men.
translation:
  language: zh_hans
  text: 在那些日子，必有蒙拣选而圣洁的儿女从高天[b]降下；他们的后裔将与世人合而为一[c]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蒙拣选而圣洁的子嗣。”原词表示儿女或后代；这里的“蒙拣选”“圣洁”在语法上修饰该词。
    reason: lexical_alternative
  - marker: b
    text: “从高天”表明他们来自天上，但本节本身并未进一步说明他们的身份。
    reason: cultural_note
  - marker: c
    text: 直译：“他们的种将与世人的儿女成为一。”这里可能指某种联合或混合，但原文没有说明其具体方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን፡ በዝኩ፡ መዋዕል
  choice: 那时
  rationale: 以自然、庄重的汉语表达末世性时间公式；中文无需逐字补出“事情将发生”。
- source_word: ደቂቅ፡ ኅሩያን፡ ወቅዱሳን
  choice: 蒙拣选而圣洁的子嗣
  rationale: ደቂቅ 为绝对式，后面的复数形容词修饰它，宜保留其亲子、后代含义，不改写成独立的“蒙拣选者和圣者”。“子嗣”兼顾庄重语体与性别包容。
- source_word: ይወርዱ
  choice: 将……降下
  rationale: 保留从天而降的垂直空间意象。
- source_word: እምልዑል፡ ሰማይ
  choice: 从高天
  rationale: 保留单数“天”和其崇高位置，不扩展为特定层级的“最高天”。
- source_word: ዘርኦሙ
  choice: 他们的后裔
  rationale: 表达血统或繁衍意义，同时避免现代汉语“种子”的字面歧义。
- source_word: አሐደ፡ ይከውን፡ ምስለ፡ ውሉደ፡ ሰብእ
  choice: 将与世人合而为一
  rationale: 保留“成为一体/合一”的措辞，不擅自明确为婚配或性结合。
- source_word: ውሉደ፡ ሰብእ
  choice: 世人
  rationale: 自然表达“人的儿女/人类”，并维持天上群体与人类之间的对照。
theological_decisions:
- issue: 下降者的身份
  choice: 译作“蒙拣选而圣洁的子嗣”，不指明其究竟属于天使、人类义人或另一类天上群体。
  alternative: 译作“蒙拣选者和圣者”，把 ደቂቅ 弱化或视为对群体的泛称。
  rationale: 原文 ደቂቅ 为绝对式，且 ኅሩያን、ቅዱሳን 与其在数上呼应，语法上较自然地构成“蒙拣选而圣洁的子嗣”；但经文本身没有进一步界定其本体身份。
- issue: “与世人合而为一”的性质
  choice: 保持为未具体说明的联合或混合。
  alternative: 明确译成婚配、交合或与人类混杂。
  rationale: 守望者传统可能使读者联想到性结合，但本节用语本身只说“成为一”，不应在正文中强化其机制。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“子嗣”略带典雅色彩，用以承载原文的亲子/后代含义；整体保留启示文学的高天、降下与合一意象，并避免以宗派性解释填补身份及结合方式上的含混。
