  text: And my eyes saw in that place[a][him], and they blessed him.
translation:
  language: zh_hans
  text: 我的双眼在那地方看见了许多事[a]，我就称颂了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据转写在这里有讹误标记；依通行校读，可译作“许多”。若严格照现有讹误转写，此处含义不能确定。
    reason: textual_variant
lexical_decisions:
- source_word: ወ*ትንዳየ
  choice: 许多事
  rationale: 所给转写在此带有星号，显示文本或识读有讹误。结合查理斯与迪尔曼所据的通行校读，宜还原为含“许多”之意的 ብዙኀ；汉语以“许多事”承接“看见”，自然表达不定量的所见内容。
- source_word: ርእዩ አዕይንትየ
  choice: 我的双眼……看见了
  rationale: ርእዩ 是“看见”的复数形式，与复数名词 አዕይንትየ“我的双眼”一致。保留“眼睛”为语法主语，也保存异象叙述的具体形象。
- source_word: በውእቱ መካን
  choice: 在那地方
  rationale: 该短语由介词、指示成分和“地方”构成；“在那地方”准确、简洁，并符合现代汉语。
- source_word: ወባረክዎ
  choice: 我就称颂了他
  rationale: 该形式含第三人称阳性单数宾语“他”；在此叙事语境中，动作者是以诺。בחר用“称颂”比泛义的“祝福”更适合人向尊贵或神圣对象发出的颂赞，同时不增添对象身份。
theological_decisions:
- issue: 末句动作者是否为以诺
  choice: 我就称颂了他
  alternative: 他们就称颂了他
  rationale: “我的双眼”是前句“看见”的复数主语，但不宜机械地延续为“称颂”的主语。该动词形式及第一人称异象叙述更支持以诺本人为动作者；同时不把宾语“他”具体认定为某一位，以免超出本句。
- issue: “他”的身份
  choice: 保留未指明的“他”
  alternative: 明确译为“上主”或某位天上人物
  rationale: 阳性单数宾语由词形表达，但这条短句本身没有明说其身份；因此保留指代张力，不以神学推断补明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我的双眼”保留原文复数意象；“许多事”使汉语宾语完整。脚注只说明影响译文的文本校读，不把不确定的指代对象神学化。
