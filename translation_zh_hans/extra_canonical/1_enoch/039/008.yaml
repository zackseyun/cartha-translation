base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/008.yaml
  text: There I desired to dwell[a], and my spirit longed for that dwelling place; there my portion was before[c][b], for thus it was established for me before the Lord of Spirits.
translation:
  language: zh_hans
  text: 我愿在那里居住[a]，我的灵也爱慕那住处；我的份早已在那里[b]，因为这事已在万灵之主[c]面前为我确立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我在那里渴望居住。”
    reason: 原词可表达意愿或愿望；“渴望”更突出情感强度。
  - marker: b
    text: 原文这一短语十分紧凑，也可译作：“那里先前成了我的份。”或“我的份预先就在那里。”
    reason: “是／成为”、“在那里”和“在先”的关系存在句法与时态上的含混，不宜直接补出“被分配”。
  - marker: c
    text: “万灵之主”是《比喻篇》中反复出现的神圣称号，应按本书自身的用语理解，不宜与后期固定公式相调和。
    reason: 保留英语审校轨迹中对此特有神圣称号的说明。
lexical_decisions:
- source_word: ህየ
  choice: 在那里
  rationale: 保留指向异象中地点的方位副词，不进一步限定具体位置。
- source_word: ፈቀድኩ አኅድር
  choice: 我……愿意居住
  rationale: 表达定居于该处的愿望；“居住”比“停留”更符合持续栖居之意。
- source_word: ወፈተወት መንፈስየ
  choice: 我的灵也爱慕
  rationale: 既保留内在倾向和喜爱，也避免把情感强度过度确定为单一的“渴望”。
- source_word: ለውእቱ ማኅደር
  choice: 那住处
  rationale: 简明保留具体的居所意象，并与前面的“居住”自然呼应。
- source_word: በህየ ኮነ ክፍለየ ቅድመ
  choice: 我的份早已在那里
  rationale: 按紧凑的原文次序理解为“我的份在那里、在先”，不把简单的系词ኮነ扩展成原文未明说的“分配”。
- source_word: እስመ ከመዝ ጸንዐ በእንቲአየ
  choice: 因为这事已……为我确立
  rationale: ጸንዐ含坚固、确定之意；“这事”承接前述份额在那里的事实，同时保留表达的概括性。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 保留《比喻篇》中反复出现的神圣称号；“万灵”在现代汉语中自然表达众灵而不引入后期公式。
theological_decisions:
- issue: 以诺的“份”是否明确表示被分配的天上居所
  choice: 译为“我的份早已在那里”，表达预先存在或确定的份额，但不明说分配动作。
  alternative: “那里早已给我分定了份”或“那里先前成了我的份”。
  rationale: 原文ኮነ是“是／成为”，没有明确的被动分配动词；后半句“为我确立”支持预先确定的含义，却不宜据此改写前半句。
- issue: “在……面前”所表达的神学关系
  choice: 保留“在万灵之主面前”，不改成“由万灵之主”。
  alternative: “万灵之主为我确立”。
  rationale: 原文明确使用“在……面前”的表达；改作施事者会消除原有的语法和神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“爱慕那住处”保留异象叙述的感情色彩；“份”保留份额、所得与归属的开放含义；神圣称号统一译作“万灵之主”。
