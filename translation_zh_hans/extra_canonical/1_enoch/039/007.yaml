base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/007.yaml
  text: And I saw the dwelling-place beneath the wings of the Lord of Spirits[a]; and all the righteous and the chosen shone before him like the light of fire, and their mouths were filled with blessing, and their lips praised the name of the Lord of Spirits. And righteousness does not fail before him[c][b], and uprightness does not fail before him.
translation:
  language: zh_hans
  text: 我看见了诸灵之主翅膀下的居所[a]；所有义人和蒙拣选的人都在他面前发光，如同火焰的光辉。他们口中充满祝福，嘴唇赞美诸灵之主的名。公义在他面前永不止息[b]，正直在他面前也永不止息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “翅膀下”按原文直译，保留异象中遮蔽与亲近的象征；也可理解为处在诸灵之主的庇护之下。
    reason: cultural_note
  - marker: b
    text: “永不止息”也可译作“不消逝”“不灭亡”或“没有尽头”。原文在“公义”和“正直”两句中重复使用同一动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: ማኅደረ መትሕተ አክናፈ
  choice: 翅膀下的居所
  rationale: 保留具体的空间关系和异象意象；“居所”自然而庄重，不把“翅膀”解释性改写为“庇护”。
- source_word: እግዚአ መናፍስት
  choice: 诸灵之主
  rationale: 这是《以诺一书》中反复出现的称号；“诸灵之主”既贴近原文，也符合现代汉语宗教文体。
- source_word: ጻድቃን ወኄሩያን
  choice: 所有义人和蒙拣选的人
  rationale: 将两个并列的人群类别分别表达，避免把后者误读成修饰“义人”的形容语；“蒙拣选的人”保留被选择之意而不过度引入后世术语。
- source_word: ይትሰሐዩ ከመ ብርሃነ እሳት
  choice: 发光，如同火焰的光辉
  rationale: 保留发光的动作及原文不寻常的火光明喻，同时使中文表达流畅。
- source_word: አፉሆሙ ይመልእ በረከተ
  choice: 他们口中充满祝福
  rationale: 原文所指是“祝福”，不泛化为“赞美”；与下句“嘴唇赞美”保持诗性平行。
- source_word: ከናፍሪሆሙ ይሴብሑ
  choice: 嘴唇赞美
  rationale: 保留“嘴唇”这一身体意象，与前面的“口中”构成平行。
- source_word: ጽድቅ
  choice: 公义
  rationale: 此处是拟人化地存于上主面前的抽象德性；“公义”兼具伦理和宗教语境中的自然度。
- source_word: ርትዕ
  choice: 正直
  rationale: 与“公义”并列，表达端正、正当的伦理品质；避免将其限定为“真理”。
- source_word: ኢየኃልቅ
  choice: 永不止息
  rationale: 该重复动词可涵盖不终止、不消逝、不灭亡等意思；“永不止息”突出持续性，同时脚注保留其他可能。
theological_decisions:
- issue: ኄሩያን在启示文学语境中的译法
  choice: 蒙拣选的人
  alternative: 选民；被选中的人
  rationale: “蒙拣选的人”保留原文作为一类人的称谓，又避免“选民”可能附带的特定群体或后世系统神学含义。
- issue: 末尾两句重复否定动词的含义
  choice: 公义在他面前永不止息，正直在他面前也永不止息
  alternative: 不消逝；不灭亡；没有尽头
  rationale: 原文重复同一动词，强调公义与正直在上主面前的恒存；正文采用自然的“永不止息”，脚注保留词义幅度，不将其限定为单一形而上命题。
- issue: “翅膀下”的异象意象
  choice: 直译为“翅膀下”
  alternative: 在……的庇护下
  rationale: 不把具象异象预先解释为抽象的保护，使遮蔽、亲近或庇护等象征可能仍保持开放。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“口中／嘴唇”“公义／正直”两组平行结构，并保留“翅膀下”的异象性表达。脚注标记依正文出现顺序排列。
