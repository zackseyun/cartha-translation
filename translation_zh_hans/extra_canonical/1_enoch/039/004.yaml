base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/004.yaml
  text: 'And there I saw another vision: the dwelling places of the holy ones[a], and the resting places of the righteous.'
translation:
  language: zh_hans
  text: 我在那里又看见一个异象：众圣者[a]的居所，以及义人的安歇之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣者”也可译作“圣徒”；这里可能指天使、忠信者或蒙昭雪的上帝子民，原文并未明确限定。
    reason: theological_ambiguity
  - marker: b
    text: “安歇之处”所译的词更具体地可指床、卧榻或睡卧之处。这里按异象中蒙福居所的语境译得较宽。
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: 在那里
  rationale: 作地点副词，标明异象发生的场景；“在那里”自然、清楚。
- source_word: ርኢኩ
  choice: 我看见
  rationale: 直译第一人称异象叙事用语，保持朴素直接。
- source_word: ራእየ ካልአ
  choice: 又看见一个异象
  rationale: ካልአ 可表示“另一个”或“第二个”；结合汉语叙事，以“又……一个”自然表达进一步的异象启示，同时不刻意强调严格编号。
- source_word: ማኅደሪሆሙ
  choice: 居所
  rationale: 该词指居住、栖居之处；“居所”庄重而通俗，并保留复数集合意义。
- source_word: ለቅዱሳን
  choice: 众圣者的
  rationale: 以领属关系连接前面的“居所”；“圣者”不预先限定为天使、圣徒或蒙昭雪的上帝子民，保留以诺传统中的开放性。
- source_word: ወምስካባቲሆሙ
  choice: 以及……安歇之处
  rationale: 该词源于躺卧、床榻或睡卧之处；正文用“安歇之处”符合蒙福居所的异象语境，脚注保留更具体的床榻意象。
- source_word: ለጻድቃን
  choice: 义人
  rationale: 准确表达具有伦理与末世论色彩的“正直者、义者”；“义人”是现代中文宗教文献中清楚而凝练的对应词。
theological_decisions:
- issue: ቅዱሳን 所指是天使、忠信者，还是蒙昭雪的上帝子民
  choice: 众圣者
  alternative: 众圣徒
  rationale: “众圣者”保留该词在启示文学中的指称弹性，避免用“圣徒”过早引入后期教会语境。
- issue: ለ- 短语表达领属还是受益关系
  choice: 众圣者的居所、义人安歇之处
  alternative: 为众圣者预备的居所、为义人预备的安歇之处
  rationale: 原文没有明说“预备”；采用领属表达较为贴近句法，也不额外补入施事或预备观念。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“众圣者”保留启示文学中的身份歧义；“安歇之处”保持诗性，同时由脚注说明原词具体的床榻、睡卧意象。
