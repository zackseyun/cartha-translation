base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/005.yaml
  text: There my eyes saw their dwelling places with the angels of righteousness, and their resting places with the holy ones; and they were asking and pleading and praying on behalf of the children of men, and righteousness was flowing before them like water, and mercy like dew upon the earth. So it is among them forever and ever.
translation:
  language: zh_hans
  text: 在那里，我的双眼看见了他们与公义天使同住的居所[d]，也看见了他们与众圣者同在的安歇之处[a][b]；他们为世人祈求、恳求、祷告。公义如水在他们面前涌流，怜悯如甘露降在地上。这情形在他们中间永永远远如此。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的床榻”。原词可指躺卧、休息之处；正文用“安歇之处”，以免把天上异象过度具体化为某种家具。
    reason: lexical_alternative
  - marker: b
    text: “众圣者”可能指天上的圣洁存在、天上群体中的义人，或兼指两者；原文没有限定得更窄。
    reason: alternative_reading
  - marker: c
    text: 末句也可理解为：“这情形必在他们中间存到永永远远。”正文将其译作对当前状态的总结，但上下文也容许将来的意味。
    reason: alternative_reading
  - marker: d
    text: 也可按较符合一般汉语语序的方式译作：“在那里，我亲眼看见了他们的居所。”正文保留原文以“我的双眼”为主语的特殊句法。
    reason: previous_rendering
lexical_decisions:
- source_word: በህየ
  choice: 在那里
  rationale: 这是引出异象场景的方位指示语；“在那里”自然、清楚，并保留叙述语气。
- source_word: ርእያ አዕይንትየ
  choice: 我的双眼看见了
  rationale: 原文以“我的双眼”为动词的明确主语，而非“我用双眼”这一工具结构；此译法保留其特殊而强调的异象句法。
- source_word: ማኅደሮሙ
  choice: 他们……同住的居所
  rationale: 该词表示居住、停留之处；“居所”庄重而易懂，适合天上异象的语境。
- source_word: መላእክተ ጽድቅ
  choice: 公义天使
  rationale: 保留“天使”与“公义”的属格关系所表达的性质，同时用现代汉语自然表达；“公义”也与本节后文同一词根的意象呼应。
- source_word: ምስካቢሆሙ
  choice: 安歇之处
  rationale: 该词可指躺卧或休息之地；“安歇之处”保留休憩含义，又不把异象过度具体化为床榻。
- source_word: ቅዱሳን
  choice: 众圣者
  rationale: “圣者”可指天上的圣洁存在、进入天上群体的义人，或兼指两者，较“圣徒”更少带入后世特定传统。
- source_word: ይስእሉ ወያስተበቍዑ ወይጼልዩ
  choice: 祈求、恳求、祷告
  rationale: 逐一呈现三个并列动词，保留原文层层加强的代求语势。
- source_word: በእንተ ውሉደ ሰብእ
  choice: 为世人的儿女
  rationale: 保留“人的儿女”这一群体称谓及代求关系，同时避免“人子”在汉语宗教语境中可能引起的单数专称联想。
- source_word: ጽድቅ ከመ ማይ ይውሕዝ ቅድሜሆሙ
  choice: 公义如水在他们面前涌流
  rationale: 保留水流的具体意象及“在他们面前”的空间表达；“公义”兼具道德与宇宙秩序意味。
- source_word: ምሕረት ከመ ጠል ውስተ ምድር
  choice: 怜悯如甘露降在地上
  rationale: “怜悯”准确表达慈悲恩待；补出符合汉语习惯的“降”，使甘露临到大地的意象自然清晰。
- source_word: ከመዝ ውእቱ ማእከሎሙ ለዓለመ ዓለም
  choice: 这情形在他们中间永永远远如此
  rationale: 作为对异象中恒久状态的总结，保留“在他们中间”和加强式的永久表达；正文采用现状总结，脚注说明可能的将来意味。
theological_decisions:
- issue: 代求者及天上群体的身份
  choice: 用复数“他们”承接天上群体，但不进一步界定其仅为天使或已逝义人
  alternative: 明确译作只有天使代求，或明确译作已逝义人代求
  rationale: 原文将居所、义天使、安歇之处和圣者并列关联，但代词的确切所指并未完全限定；保留这种含混可避免引入后世天使论或圣徒代求教义。
- issue: ቅዱሳን所指的“圣者”
  choice: 保留可涵盖天上圣洁存在或义人群体的称呼
  alternative: 译为“天使”或带有固定教会身份意味的“圣徒”
  rationale: 原文没有迫使读者把该群体收窄为某一类存在，因此译文不作教义性限定。
- issue: ጽድቅ的译法
  choice: 公义
  alternative: 正义
  rationale: 本节该词既用于天使的称谓，也用于如水涌流的宇宙性图景；“公义”较能兼顾道德、关系与秩序层面的含义。
- issue: 末句的时态意味
  choice: 正文译为对恒久现状的总结
  alternative: “这情形必在他们中间存到永永远远”
  rationale: 该句可按异象中的现状理解，也可能受上下文影响而含将来意味；正文不强化将来时，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而可诵读的书面汉语。保留异象叙事的重复、三个代求动词的累积，以及“公义如水”“怜悯如甘露”的诗性平行；对天上群体身份和末句时态不作超出原文的教义性判定。
