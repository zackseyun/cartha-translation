base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/009.yaml
  text: In those days I praised and exalted the name of the Lord of Spirits with blessing and with praise[a], because he has strengthened me with blessing and with praise[b], according to the will of the Lord of Spirits.
translation:
  language: zh_hans
  text: 那些日子，我以祝颂和赞美赞颂，并高举万灵之主的名；因为他照着万灵之主的旨意，以祝颂和赞美使我坚立。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以祝颂和赞美使我坚立”也可译作“使我在祝颂和赞美中坚立”。“使我坚立”还可译作“使我坚固”或“使我得以建立”。
    reason: 保留使役动词及介词短语在方式、范围等方面的词义歧义。
lexical_decisions:
- source_word: በውእቱን መዋዕል
  choice: 那些日子
  rationale: 保留以诺传统中庄重而反复出现的末世性时间用语。
- source_word: ሰባሕኩ
  choice: 我……赞颂
  rationale: 直接表达第一人称已完成的赞美行动，并与后文“赞美”保持礼仪语域。
- source_word: ወአልዐልኩ ስሞ
  choice: 并高举……的名
  rationale: 保留尊崇神名的具体圣经式表达，不泛化为一般的敬拜。
- source_word: ለእግዚአ መናፍስት
  choice: 万灵之主
  rationale: 作为《以诺一书》的特征性神圣称号处理；“万灵”自然表达众灵的总体，同时保持称号性。
- source_word: በረከተ ወስብሐተ
  choice: 以祝颂和赞美
  rationale: 这里主要指颂赞行为，而非所得的物质福分；“以”保留方式或凭借关系。
- source_word: እስመ
  choice: 因为
  rationale: 清楚保留因果关系。
- source_word: አጽንዐኒ
  choice: 使我坚立
  rationale: 该使役动词可表示使坚固、使站稳或建立；“使我坚立”兼顾词义，并保留与相邻语境中“坚立/确立”概念的潜在联系。
- source_word: በበረከት ወስብሐት
  choice: 以祝颂和赞美
  rationale: 与前一短语一致，保存原文有意的重复；介词关系仍有“在……中”的可能。
- source_word: በከመ ፈቃዱ
  choice: 照着……的旨意
  rationale: 表达与神的意愿相符，不加入“美意”等后期神学色彩。
theological_decisions:
- issue: 重复出现的“祝颂和赞美”所表达的关系
  choice: 译作“以祝颂和赞美”，主要理解为赞颂及使人坚立的方式或媒介
  alternative: 可理解为“在祝颂和赞美中”，指以诺被安置或坚立于一种颂赞的状态或领域
  rationale: 吉兹语介词 በ 可承载方式、媒介或范围等意义；正文采用自然的方式表达，脚注保留范围性解释，不把歧义完全消除。
- issue: 使役动词 አጽንዐኒ 的神学与语境含义
  choice: 使我坚立
  alternative: 使我坚固；建立我
  rationale: 该词强调神使以诺稳固，而不只是给予情绪上的鼓励；“坚立”也避免过度判定是制度性“建立”还是一般性“加强”。
- issue: 神圣称号 እግዚአ መናፍስት
  choice: 万灵之主
  alternative: 众灵之主；诸灵之主
  rationale: 保留其固定称号性质，不将其改写为后来的宗派性称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“万灵之主”作为固定神圣称号；保留“祝颂和赞美”的重复，以呈现原文的礼仪节奏。
