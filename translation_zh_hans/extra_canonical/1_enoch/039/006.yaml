base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/006.yaml
  text: And in that place my eyes saw the Chosen One of righteousness and of faith[a], and righteousness shall be in his days[c][b]; and the righteous and the chosen will be without number before him forever and ever.
translation:
  language: zh_hans
  text: 在那里，我亲眼看见了公义与信仰的那位蒙拣选者[a]；在他的日子里，公义必存；在他面前，义人和蒙拣选的人将数不胜数，直到永永远远。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信仰”也可译作“忠信”。吉兹语这个词可指信仰、忠诚或坚定。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们在他面前没有数目。”
    reason: lexical_alternative
lexical_decisions:
- source_word: መካን
  choice: 那里
  rationale: 承接异象中的空间场景；现代汉语用“在那里”比“在那地方”更自然，同时未具体化为区域或居所。
- source_word: ኀሩየ
  choice: 蒙拣选者
  rationale: 按名词性称号处理，保留本段所指独特人物的称号功能；不进一步认定其身份。
- source_word: ለጽድቅ
  choice: 公义的
  rationale: 按属格性质理解，表示这位人物以公义为特征；与后文“公义”保持词汇呼应。
- source_word: ዘሃይማኖት
  choice: 信仰的
  rationale: 该词可指信仰、忠信或坚定；正文采用词义较透明的“信仰”，并用脚注保留“忠信”的可能。
- source_word: ይከውን
  choice: 必存
  rationale: 该动词基本义为“是、存在、成为”。“必存”在汉语中既自然又保留其朴素存在义，不增添“得胜、盛行”的解释。
- source_word: በመዋዕሊሁ
  choice: 在他的日子
  rationale: 保留原文简洁的时间表达及其庄重、末世性语体。
- source_word: ኄራያን
  choice: 蒙拣选的人
  rationale: 与单数称号“蒙拣选者”维持词根呼应，同时清楚表达复数群体。
- source_word: ኈልቈ አልቦሙ
  choice: 必多得无数
  rationale: 自然表达人数不可计数，并保留原文“没有数目”的意象；脚注给出直译。
- source_word: ቅድሜሁ
  choice: 在他面前
  rationale: 保留人物临在前的关系和庄严场景，不弱化为泛指的“与他同在”。
- source_word: ለዓለመ ዓለም
  choice: 直到永永远远
  rationale: 采用现代中文宗教及庄重文体中通行的永恒时长表达。
theological_decisions:
- issue: ኀሩየ应作称号还是普通描述语
  choice: 作为称号译为“那位……蒙拣选者”
  alternative: “被拣选的那一位”或普通形容语“蒙拣选的”
  rationale: 本书《比喻篇》中该词指向一位独特、尊崇的人物。按称号翻译可反映文学功能，但不借此导入后期教义身份认定。
- issue: ሃይማኖት在组合短语中的含义
  choice: 正文译“信仰”，脚注注明也可译“忠信”
  alternative: 直接译为“忠信”或“可信可靠”
  rationale: 该词兼有主观信仰与品格忠信等义。原句结构紧缩，现有源文证据不足以排除任一含义，因此保留歧义。
- issue: 第二个ጽድቅ与ይከውን的表达
  choice: 译为“公义必存”
  alternative: “公义必盛行”或“公义必得胜”
  rationale: ይከውን是“是、存在、成为”的常用动词。“必存”保留原文基本陈述，不额外加入压倒敌对力量的动态含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保持异象叙述的肃穆感；“公义必存”有意贴近吉兹语“必是／必存在”，避免采用解释性更强的“必盛行”。所有脚注标记均已置于正文相应位置。
