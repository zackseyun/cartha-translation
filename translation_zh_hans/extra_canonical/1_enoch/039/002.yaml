base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/002.yaml
  text: And in those days Enoch received books of zeal and wrath[a], and books of tumult and confusion; and mercy shall not be upon them, says the Lord of Spirits.
translation:
  language: zh_hans
  text: 在那些日子，以诺领受了热忱与烈怒的书卷，以及骚乱与混乱的书卷[a]。诸灵之主说：“他们必得不到怜悯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处吉兹语见证的措辞较难确定。译作“骚乱与混乱”的一对词，也可能较宽泛地指动荡、呼喊或失序。
    reason: textual_variant
lexical_decisions:
- source_word: መዋዕል
  choice: 日子
  rationale: 保留启示文学中“在那些日子”的时间套语，不将其过度限定为某一时期。
- source_word: ነሥአ
  choice: 领受了
  rationale: 本义可作“拿、取”，但以诺在此是书卷的接受者；“领受”既符合语境，也保留启示从上而来的庄重意味。
- source_word: መጻሕፍተ
  choice: 书卷
  rationale: 该词可指书或文献；“书卷”符合古代文本语境，同时不具体断定其物质形态。
- source_word: ቅንአት
  choice: 热忱
  rationale: 该词可表示热忱、嫉妒或妒忌；在与烈怒并列的审判语境中，“热忱”保留其强烈情感和神圣审判色彩，又不缩窄为人的嫉妒。
- source_word: መዐት
  choice: 烈怒
  rationale: 表达强烈而带审判性的愤怒，比一般的“愤怒”更符合启示文学语气。
- source_word: ጐጕአ
  choice: 骚乱
  rationale: 见证文本中的词形较难确定，其语义可能涉及喧嚷、动荡或扰乱；“骚乱”保持宽泛，不作过度解释。
- source_word: ሀውክ
  choice: 混乱
  rationale: 可表达失序、扰乱或惊惶；“混乱”自然地呈现整体失序，并保留原词的不确定幅度。
- source_word: ምሕረት
  choice: 怜悯
  rationale: 这是表达神圣怜恤的常用词，与前文审判性的热忱和烈怒形成鲜明对照。
- source_word: ኢይከውን ላዕሌሆሙ
  choice: 他们必得不到怜悯
  rationale: 原文较直译为“怜悯必不在他们之上”；中文采用自然的否定结果表达，同时保留将来审判的确定语气。
- source_word: እግዚአ መናፈስት
  choice: 主宰诸灵者
  rationale: 保留反复出现的神圣称号及其庄严感；“诸灵”反映复数形式，“主宰……者”在现代中文中比生硬的“诸灵之主”更顺畅。
theological_decisions:
- issue: 这些“书卷”的性质与分组
  choice: 按重复出现的መጻሕፍተ译为两组书卷，内容分别与热忱和烈怒、骚乱和混乱有关。
  alternative: 也可将整串词理解为同一组文献的复合描述；疑难词还可能指哀号、呼喊或动荡。
  rationale: 原文重复“书卷”支持分组处理，但中间词形和语义不够确定，因此以“关于”表达关联，不武断规定这些书卷究竟承载、宣告还是造成这些事。
- issue: “他们”的所指
  choice: 理解为上下文中受审判的人，而不是书卷。
  alternative: 若只按最近先行词松散衔接，形式上或可指前述事物，但语义不通顺。
  rationale: “怜悯必不在他们之上”是针对人的审判宣告；译文保留代词，不擅自在正文中补明具体群体。
- issue: 说话者称号的理解
  choice: 将እግዚአ መናፈስት作为神圣称号译为“主宰诸灵者”。
  alternative: 可较形式化地译为“诸灵之主”或“众灵的主”。
  rationale: 所选译法兼顾原文复数“灵”和现代中文的自然庄重，不进一步界定“诸灵”的类别。
translation_notes:
  register: 采用现代、庄重而易懂的启示文学语体。“在那些日子”保留末世性套语；“书卷”维持古代文献氛围；直接引语使结尾的神谕宣告在中文中清晰自然。脚注标记[a]已置于相关疑难短语之后。
