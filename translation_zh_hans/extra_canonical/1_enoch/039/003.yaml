base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/003.yaml
  text: And in those days a whirlwind of winds carried me away from the face of the earth and set me down at the end of the heavens[a].
translation:
  language: zh_hans
  text: 那些日子，一阵旋风把我从大地上卷走，将我安置在诸天的尽头[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诸天的边界”。吉兹语原词可指异象宇宙的外缘或最远处。
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕል
  choice: 日子
  rationale: 采用“那些日子”这一启示文学中庄重而自然的叙事表达，保留原文的时间公式。
- source_word: መሠጠኒ
  choice: 把我……卷走
  rationale: 原动词表示外力使说话者离开原处；结合旋风这一主语，以“卷走”自然传达强力搬移，但不额外限定为向上升腾。
- source_word: ዐውሎ ነፋሳት
  choice: 一阵旋风
  rationale: 原短语含风暴与风的强化意象；现代汉语用“一阵旋风”既有力度，也避免生硬直译为“风的旋风”。
- source_word: እምገጸ ሰምድር
  choice: 从大地上
  rationale: 该闪语式表达字面含“大地的面”；“从大地上”以自然汉语保留其表面、地上之意。
- source_word: አንበረኒ
  choice: 将我安置
  rationale: 在异象中的迁移场景里，该词表示把人置于目的地；“安置”准确且保持庄重语体。
- source_word: ጽንፈ ሰማያት
  choice: 诸天的尽头
  rationale: 该名词可指尽头、极处或边界；此译保留异象宇宙中的空间图景，并以脚注注明另一种同样可能的表达。
theological_decisions:
- issue: 异象迁移中的宇宙空间图景
  choice: 诸天的尽头
  alternative: 诸天的边界
  rationale: 保留原文把诸天描绘为具有极处或边界的空间意象，不将其淡化为笼统的属灵经历；同时不武断判定这是终点还是外缘。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“卷走”呼应旋风造成的强力移动；“诸天”保留原文复数形式及启示文学色彩。
