base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/001.yaml
  text: And in those days Uriel the angel answered me and said to me[a], “Behold, I have shown you everything, Enoch, and I have revealed everything to you, that you may look upon this sun and this moon and those who lead the stars of heaven[c][b], and all those who turn them—their works and their times and their risings.”
translation:
  language: zh_hans
  text: 在那些日子，天使乌列回答我，对我说：“看哪，以诺，我已经把一切都指给你看，也把一切都向你揭示了，好让你观看这太阳、这月亮、那些引领天上众星的，以及所有使众星转动者——他们的工作、时节和西沉[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西沉”所依据的词语基本意象是“进入”。在本书的天文图景中，天体从东方门户出来而升起，又进入西方门户而落下；因此这里也可译作“进入”或“落下”，不是“升起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: 回答我
  rationale: 该动词通常有“回答、回应”之意；即使本节没有明说先前的问题，也保留原文的对话衔接。
- source_word: ነዋ
  choice: 看哪
  rationale: 这是唤起注意的语气词；“看哪”既保留庄重的启示文学语气，也为现代汉语读者所熟悉。
- source_word: አርአይኩከ
  choice: 我已经把一切都指给你看
  rationale: 原词带使役和视觉意味；“指给你看”自然地表达“使你看见、展示给你”。
- source_word: ከሠትኩ ለከ
  choice: 把一切都向你揭示了
  rationale: 表达揭开、显明之意；“揭示”适合启示文学语域，又不缩窄为单纯的解释。
- source_word: ትርአዮ
  choice: 好让你观看
  rationale: 保留目的或结果意味；“观看”比单纯“看见”更能体现以诺受引导观察天象。
- source_word: ይመርኅዎሙ
  choice: 引领天上众星
  rationale: 该动词指带领、引导；译文保留原文以有位格的行动者引导众星的图景。
- source_word: ይመይጥዎሙ
  choice: 使众星转动
  rationale: 该词涉及转动或使之运动；补出“众星”以消除汉语中代词指向不清，同时不引入现代轨道理论。
- source_word: ግብሮሙ
  choice: 他们的工作
  rationale: 原词可指工作、作为或运行职能；“工作”保留宽泛意义，也适用于这些宇宙秩序中的行动者。
- source_word: አዝማኖሙ
  choice: 时节
  rationale: 该词可指时间或季节；“时节”兼顾周期性和指定的时间，而不额外加入“预定”观念。
- source_word: ሙባኢሆሙ
  choice: 西沉
  rationale: 该名词源于“进入”，在《以诺一书》的天文门户图景中指天体进入西方门户，因而是落下或西沉，不是升起。
theological_decisions:
- issue: 引领并转动众星者的身份
  choice: 保留有位格的表达：“那些引领……的”与“所有使……转动的”
  alternative: 改写为支配众星的自然规律或无位格的天体运动
  rationale: 吉兹语采用指人的关系结构，天文书的启示图景也以受委任的行动者维持宇宙秩序；译文不把他们进一步界定为某一特定阶级，也不将其现代化为自然定律。
- issue: “他们的工作、时节和西沉”的指代范围
  choice: 保留复数代词“他们”，不在正文中明确限定它只指行动者或只指天体
  alternative: 统一解释为天体的运行、周期和西沉
  rationale: 原文连续使用复数附着代词，邻近先行项包括有位格的引领者与被引领的众星；中文保留这种张力，不作超出文本的消歧。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“看哪”保留启示文学的呼告语气；“回答我，对我说”保留原文略显重复的叙事公式。破折号呈现末后三项与前文的总结或同位关系，同时不强行消除其指代含混。
