  text: And the moon will alter its order[c][b][a], and it will not appear in its season.
translation:
  language: zh_hans
  text: 月亮[a]也将改变自己的秩序[b]，不在自己的时节显现[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “月亮”原文也可译作“月份”；这里的天体语境较支持“月亮”。
    reason: lexical_alternative
  - marker: b
    text: “秩序”也可理解为“规制”或“既定安排”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“不在自己的时候被看见。”原文可侧重它未按正常时节出现或不可见。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኅ
  choice: 月亮
  rationale: 该词既可指“月亮”，也可指“月份”；本段谈论天体的可见活动，因此取“月亮”。
- source_word: ይዌልጥ
  choice: 将改变
  rationale: 原词表示改变、变得不同；此译保留偏离既有常规的含义，不进一步推断原因。
- source_word: ሥርዓቶ
  choice: 自己的运行秩序
  rationale: 该词可指秩序、规制或既定安排；结合月亮的语境，以“运行秩序”表达天体原有的规则，同时保持现代汉语自然。
- source_word: ወኢይትረአይ
  choice: 不……显现
  rationale: 原词关乎被看见或可见；“显现”适合描述天体出现，也保留视觉层面的意义。
- source_word: በዘመኑ ዚአሁ
  choice: 在自己的时节
  rationale: 直译为“在它自己的时候／时节”。采用“时节”保留周期性，并与上下文的重复措辞一致，不增添原文没有明说的“指定”。
theological_decisions:
- issue: 本节应仅描述天文异常，还是暗示既定宇宙秩序受到扰乱
  choice: 保留“改变自己的运行秩序”与“不在自己的时节显现”这两层表述
  alternative: 将其限定为月相变化，或解释为月份计算发生变化
  rationale: 原文同时提到月亮的秩序和它显现的时节，足以呈现自然规律受扰的张力，却没有明说原因或作神学解释，因此不替作者消解这种张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“运行秩序”比单说“秩序”更符合汉语天文语境；“自己的时节”保留原文回指和周期意味。所有脚注标记均置于正文相应词句之后。
