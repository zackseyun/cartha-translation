base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/002.yaml
  text: And in the days of the sinners the years shall be shortened, and their seed shall be late upon their land and in their fields; and all the works that are on the earth shall change and shall not appear in their times, and the rain shall be withheld, and heaven shall hold back.
translation:
  language: zh_hans
  text: 在罪人的日子，年岁将缩短；他们的种子[a]在自己的土地和田间将迟延。地上的一切作为[b]都将改变，不按各自的时节出现；雨水将被截住，天也将停住[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “种子”也可指“后裔”；但本节提到土地、田间、时节和雨水，因此也可能指所播的种子或农作物。
    reason: lexical_alternative
  - marker: b
    text: “作为”原文也可较宽泛地理解为“工作”“所作之物”或“地上的一切事物”。这里描绘的是宇宙秩序和农时失常：本应按季节出现的，不再按时出现。
    reason: lexical_and_cultural_note
  - marker: c
    text: 末句字面近于“天将停住”或“天将站住”。它与前句“雨水将被截住”相连，描绘天空与降雨秩序的失常；原文没有明说施事者。
    reason: textual_clarification
lexical_decisions:
- source_word: መዋዕለ፡ ኃጥኣን
  choice: 罪人的日子
  rationale: 保留原文常见的末世性时间表达“在……的日子”，并以“罪人”传达审判语域。
- source_word: ክረማት
  choice: 年岁
  rationale: 此处指年度周期；“年岁将要缩短”既贴近原文，也符合上下文中时序紊乱的主题。
- source_word: ዘርአ፡ ዚአሆሙ
  choice: 他们的种子
  rationale: “种子”在中文中仍可兼指播种之物及后裔，能够保留原词在农业语境中的真实歧义。
- source_word: ዳኃራዊ
  choice: 迟延
  rationale: 表达晚到、延后的含义，比单说“晚”更自然地与种子在土地和田间的状态搭配。
- source_word: ምድረሙ፡ ወበወፍሮሙ
  choice: 在自己的土地和田间
  rationale: “土地”和“田间”保留原文的农业场景及平行结构。
- source_word: ኵሉ፡ ግብር፡ ዘዲበ፡ ምድር
  choice: 地上的一切出产
  rationale: ግብር 可指工作、作为或产物；本节紧接种子、田地和雨水，“出产”较自然，但脚注保留更宽泛的可能。
- source_word: ይትመየጥ፡ ወኢያስተርኢ፡ ለአዝማኖሙ
  choice: 都将改变，不按各自的时节出现
  rationale: 保留“改变”“出现”和复数的“它们的时节”，呈现万物不依正常时序显现的图景。
- source_word: ዝናም፡ ይትከላእ
  choice: 雨水将被截住
  rationale: 以被动表达雨被抑止、扣留，不额外指明施事者。
- source_word: ሰማይ፡ ታቀውም
  choice: 天空也将闭塞不降雨
  rationale: 末句字面近于“天空将停住／站住”；结合前句雨被截住，采用自然中文呈现其结果，同时以脚注注明字面表达。
theological_decisions:
- issue: “他们的种子”究竟指后裔还是农作物的种子
  choice: 正文保留“他们的种子”
  alternative: 他们的后裔；他们所种的庄稼
  rationale: 土地、田间、时节和雨水使农业含义较突出，但原词也可指后裔；不在正文中消解这一歧义。
- issue: “地上的一切工作／出产”的范围
  choice: 依农业上下文译作“地上的一切出产”，并用脚注保留宽泛义
  alternative: 地上的一切工作；地上所发生的一切事
  rationale: 兼顾段落意象和原词较宽的语义范围，避免把它专断地限定为人的行为或道德功业。
- issue: 天空“闭塞”的施事与神学含义
  choice: 不明说是上帝使天空闭塞
  alternative: 上帝将止住天空；天空将停住
  rationale: 原句没有明示施事者，译文不补入神学主体，以保存原文的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以分号和句号梳理原文连串并列句；保留“罪人的日子”“年岁缩短”等启示文学语感。所有脚注标记均置于相关正文之后。
