base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/003.yaml
  text: And in those times the fruit of the earth will be delayed[a], and it will not sprout in its season[d][c][b]; and the fruit of the trees will be withheld in its season.
translation:
  language: zh_hans
  text: 在那些时候，土地的出产必迟延[a]，且不在它的时节萌发[b]；树木的果实也必在其本有的时节受阻[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必来得迟。”原文强调土地的出产晚于正常时节。
    reason: lexical_alternative
  - marker: b
    text: 直译：“不在它的时节萌发。”
    reason: formal_equivalent
  - marker: c
    text: 或译：“树木的果实必在它自己的时节被扣留。”原文强调果实在其特定、应有的时令受到拦阻。
    reason: lexical_alternative
lexical_decisions:
- source_word: አዝማን
  choice: 时候
  rationale: 这是复数时间词；“那些时候”保留宽泛的末世性时段，不将其收窄为具体日子或农时。
- source_word: ፍሬ፡ ምድር
  choice: 地里的出产
  rationale: 原义近于“地的果实”；现代汉语用“地里的出产”既保留农业意象，也自然涵盖土地所产之物。
- source_word: ደሓራዊ፡ ይከውን
  choice: 必姗姗来迟
  rationale: 表达晚到、误期之意；这一措辞突出相对于正常节令的迟延，同时避免暗示必有外在主体故意使其延迟。
- source_word: ወኢይበቍል
  choice: 不……发芽
  rationale: 该动词指萌发、长出嫩芽；“发芽”是清楚自然的农业用语。
- source_word: በዘመኑ
  choice: 按时
  rationale: 直义为“在它的时节”；“按时”简洁表达在应有季节发生之意，所指仍是前面的单数集合名词“出产”。
- source_word: ፍሬ፡ ዕፅ
  choice: 树木的果实
  rationale: ዕፅ 可指树、木或植物；在结果的农业语境中，“树木”最清楚。
- source_word: ይትከላእ
  choice: 受阻
  rationale: 该词为被阻挡、受拦阻或被扣留之意；“受阻”保留了果实未能如期出现的被动意味，又不额外指定施事者。
- source_word: በዘመኑ፡ ዚአሁ
  choice: 在本应结果的时候
  rationale: 原文带第三人称阳性单数及强调性所有表达，近于“在它自己的时节”；汉语这样处理可自然凸显果实特定、应有的时令。
theological_decisions:
- issue: 审判征兆的性质
  choice: 按字面保留农作时序与生育失常的末世图景
  alternative: 将其仅理解为普通歉收，或改写成脱离农业语境的道德隐喻
  rationale: 本段以受扰乱的季节和秩序作为具体的启示性征兆；译文不把农业意象抽象化，也不额外断定造成迟延或阻碍的具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句用“姗姗来迟”传达误期，后两分句以“不按时”和“本应……的时候”强化正常农业节律被打乱的意象；未加入具体神学施事者。
