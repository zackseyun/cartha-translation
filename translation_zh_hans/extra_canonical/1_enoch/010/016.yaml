base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/016.yaml
  text: Destroy all violence from the face of the earth[a], and every evil deed shall come to an end; and the plant of righteousness and uprightness shall appear[b], and it shall become a blessing.
translation:
  language: zh_hans
  text: 要从大地表面除尽一切暴行；一切恶行都必止息；公义和正直的栽植[a]必显现，并且要成为福分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公义和正直的植株”。原文名词既可指所栽之物，也可指栽植的行为或结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሕጕል
  choice: 要……除灭
  rationale: 该词是阳性单数命令式，承接上下文中对天使的直接吩咐；用“要……除灭”保留命令语气及主动施事，不误作被动将来时。
- source_word: ኵሎ ግፍዓ
  choice: 一切暴行
  rationale: ግፍዓ涵盖暴力、欺压和不义；“暴行”既保留其社会与道德力度，也符合审判和洁净大地的语境。
- source_word: እምገጸ ምድር
  choice: 从大地表面
  rationale: 原文直译为“从大地的面”；“从大地表面”在现代汉语中自然，同时保存闪语式空间意象。
- source_word: ኵሉ ምግባረ እኩይ
  choice: 一切恶行
  rationale: 该短语具有总括意味；“一切恶行”简洁自然，并保留行为层面的道德含义。
- source_word: ይኅልቅ
  choice: 都必止息
  rationale: 此动词可指终结、消逝或灭亡；以“恶行”为主语时，“止息”准确表达其不再延续，且不赋予其不必要的拟人色彩。
- source_word: ያስተርኢ
  choice: 必显现
  rationale: 原词表示显露、可见或被彰显；“显现”兼具可见性与启示文学的庄重语体。
- source_word: ተክለ
  choice: 栽植
  rationale: 该名词可指所栽之物，也可指栽种这一行为或结果。“栽植”在中文中保留农业意象，并有意容纳原词的词义张力。
- source_word: ጽድቅ ወርትዕ
  choice: 公义和正直
  rationale: ጽድቅ通常指公义；ርትዕ含正直、端正之意。此译保留伦理内涵，不加入后期教义限定。
- source_word: ይከውን ለበረከት
  choice: 要成为福分
  rationale: 原结构可直译为“成为/作为福分”；此译符合现代汉语，也保留结果性和祝福意涵。
theological_decisions:
- issue: “公义和正直的栽植”这一农业意象的含义
  choice: 保留具体而开放的农业意象，不将其抽象化为“公义必兴盛”。
  alternative: 公义和正直的植株；公义和正直的栽种
  rationale: 原文名词既可理解为所栽之物，也可理解为栽植行为或其结果。正文采用“栽植”保存这种张力，脚注列明另一可能，不把异象语言化约为一般性陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。开头保留命令语气；“大地表面”“显现”“福分”维持启示文学的肃穆质感。正文中的脚注标记[a]与脚注完全对应。
