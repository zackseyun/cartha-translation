base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/015.yaml
  text: And destroy these spirits of the bastards and the children of the Watchers, because they have oppressed humankind.
translation:
  language: zh_hans
  text: 要消灭这些私生后裔的灵[a]和守望者的子孙，因为他们欺压了人类。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些私生后裔的灵”也可理解为“这些非法所生后代的灵”。此处用词严厉，可能特指守望者所生的非法混血后裔；后面的“守望者的子孙”也可能是对他们的同位说明。
    reason: lexical_alternative_and_ambiguity
  - marker: b
    text: “欺压了”也可译作“以暴力对待了”或“虐待了”。原文动词所表达的伤害比一般的“亏负”更强。
    reason: lexical_alternative
lexical_decisions:
- source_word: አኅጕሎሙ
  choice: 要消灭
  rationale: 按上下文作命令或祈使义，保留审判命令的严厉程度，而不具体限定消灭的方式。
- source_word: መናፍስተ
  choice: 灵
  rationale: 在本书的启示文学语境中，指属灵存在或离身之灵，不宜泛化为“灵魂”。
- source_word: ተውኔት
  choice: 私生后裔
  rationale: 该词带有对非法或混杂所生后代的严厉贬称；“私生后裔”既保留法律与血统上的非正当含义，又比现代汉语辱骂性的说法更适合经文体。
- source_word: ውሉዶሙ
  choice: 子孙
  rationale: 表达后代、所生者的集合意义；在当前短语中自然承接“守望者”。
- source_word: ትጉሃን
  choice: 守望者
  rationale: 这是《以诺一书》本段对特定天使群体的固定称号，宜保留术语及其篇内联系。
- source_word: ገፍዕዎሙ
  choice: 欺压了
  rationale: 该动词含压迫、虐待乃至施暴之意；“欺压”比“亏负”更能传达上下文中的暴力伤害，同时不过度限定为某一种具体暴行。
- source_word: ሰብእ
  choice: 人类
  rationale: 原词在此为集合义，涵盖全体人，不应译成仅指男性的“男人”。
theological_decisions:
- issue: 受审判者是私生后裔的灵，还是与守望者子孙并列或同位的一群
  choice: 正文保留“私生后裔的灵”和“守望者的子孙”两个成分，不把二者合并解释。
  alternative: 可把后半理解为同位说明，即“私生后裔的灵，也就是守望者的子孙”；也可能反映关于巨人死后之灵的压缩传统。
  rationale: 吉兹语句法与本书更广语境容许不同关联方式。正文沿用并列式表达，脚注说明同位式可能，以保留其神学张力而不强行裁定。
translation_notes:
  register: 采用现代、庄重而清楚的简体中文。“要消灭”保持命令力度；“私生后裔”保留原词的严厉性，但避免使用主要作为现代辱骂语的表达。正文不擅自消解“灵”与“守望者的子孙”之间可能的并列或同位关系。
