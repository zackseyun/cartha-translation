base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/002.yaml
  text: Go to Noah and say to him in my name[a], 'Hide yourself!' And reveal to him the end that is coming; for the whole earth will be destroyed, and a flood is about to come upon all the earth[c][b], and it will destroy whatever is in it.
translation:
  language: zh_hans
  text: 你去见挪亚，奉我的名对他说[a]：“你要躲藏起来！”又要把即将临到的结局告诉他；因为全地必被毁灭，一场洪水即将临到全地[b]，毁灭其中的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你去见挪亚”所对应的词语在所据格厄兹文本中置于括号内，反映其传本状态。
    reason: textual_variant
  - marker: b
    text: 直译可作“一场水的洪流”；此处按现代汉语习惯译作“一场洪水”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሖር፡ ለኖኅ፡ ወ
  choice: 你去见挪亚
  rationale: 保留句首差遣命令“去”，并以自然汉语表达前往挪亚那里；括号反映该短语在所据文本中的传本状态。
- source_word: በሎ
  choice: 对他说
  rationale: 按直接引语的引介语处理，不增添原文没有的语气。
- source_word: በስመ፡ ዚአየ
  choice: 奉我的名
  rationale: 这是自然、庄重的汉语授权公式，保留受差遣者凭说话者权柄传话的含义。
- source_word: ኅባእ፡ ርእሰከ
  choice: 你要躲藏起来
  rationale: 保留反身命令及紧迫感；“躲藏起来”比“遮盖自己”更符合此处语境。
- source_word: አግህድ፡ ሎቱ
  choice: 把……告诉他
  rationale: 表达向挪亚揭示信息之意；在现代汉语中比“向他启示”更自然，同时不削弱披露未知之事的含义。
- source_word: ፍጻሜ፡ ዘይመጽእ
  choice: 即将临到的结局
  rationale: ፍጻሜ可指终结、完成；结合洪水审判的近距离语境译作“结局”，不把它技术化为末世最终终局。
- source_word: ይትኃጐል፡ ምድር፡ ኵሉ
  choice: 全地必被毁灭
  rationale: 保留被动毁灭的判断及范围的全面性。
- source_word: ማየ፡ አይኅ
  choice: 一场洪水
  rationale: 该组合直指洪水灾变；汉语“洪水”本已包含水的意象，避免不自然的“洪水之水”。
- source_word: ሀሎ፡ ዲበ፡ ኵሉ፡ ምድር
  choice: 即将临到全地
  rationale: 保留事件迫近并覆盖全地的含义。
- source_word: ያኀጕል፡ ዘሀሎ፡ ውስቴታ
  choice: 毁灭其中的一切
  rationale: 自然表达“毁灭在其中所有之物”的总括范围，不擅自限定为人类、动物或其他类别。
theological_decisions:
- issue: “结局”的范围
  choice: 按眼前洪水审判所带来的毁灭性结局来表达
  alternative: “终局”或“最终的终结”
  rationale: 上下文直接谈全地将遭洪水毁灭；译文保留其启示文学的庄严感，但不引入后来体系化的末世论含义。
- issue: “又要把……告诉他”的主语
  choice: 仍以受差遣去见挪亚者为主语，“他”指挪亚
  alternative: 把这句纳入对挪亚的直接命令，使挪亚成为“告诉”的主语
  rationale: 格厄兹语的命令链及代词关系支持前者；直接引语在“你要躲藏起来”之后结束，可避免“告诉他”指代无着。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以两个命令句清楚区分对受差遣者的吩咐和传给挪亚的直接话语；避免宗派化术语，并保留“结局”在此处的语义张力。
