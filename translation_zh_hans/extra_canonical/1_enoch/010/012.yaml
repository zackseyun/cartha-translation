revisions:
- from: 当他们所有的儿子彼此残杀之后，当他们看见自己所爱之人的毁灭时，就把他们捆绑七十代，囚在大地的山岭之下[a]，直到他们受审判和终结[b]的日子，直到那直到永永远远的审判执行完毕[c]。
  to: 当他们所有的儿子彼此残杀、当他们看见所爱之人遭毁灭时，要把他们捆绑，囚在大地的山岭之下[a]七十代，直到他们受审判和终结[b]的日子，直到那永世的审判完成[c]。
  rationale: 修正末句的句法及永恒审判公式的表达，并将“捆绑”调整为明确的命令语气。其余内容、指代、时间期限和脚注锚点均予保留；“终结”继续以脚注保存其可指完成或终局的语义余地。
