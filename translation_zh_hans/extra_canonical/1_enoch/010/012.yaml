  source_fidelity: 译文总体忠实保留了儿子彼此残杀、看见所爱者毁灭、捆绑七十代、地下拘禁、审判与终局及永恒审判完成等要素。惟末句“那直到永永远远的审判”在汉语中句法不成立，也未能准确表达源文中“永恒／万世的审判”这一限定语；应改为“那永世的审判”。
  naturalness: 除末句外，整体庄重且可读。“囚在大地的山岭之下七十代”能自然表达拘禁期限。将命令式明确为“要把他们捆绑”更符合源文对天使所发命令，也避免“就把他们捆绑”缺少施事者的问题。
  terminology: “彼此残杀”“捆绑”“受审判”“终结”均适切。“终结”保留源词所含终局／完成的开放性；脚注可继续说明替代义。以“永世的审判”表达强化的永恒公式，既自然又不将其神学含义过度具体化。
