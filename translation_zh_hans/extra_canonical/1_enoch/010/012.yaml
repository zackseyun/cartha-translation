base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/012.yaml
  text: And when all their sons have slain one another[a], and when they have seen the destruction of their beloved ones, bind them for seventy generations beneath the hills of the earth, until the day of their judgment and of their consummation[c][b], until the judgment that is for all eternity is completed.
translation:
  language: zh_hans
  text: 当他们所有的儿子彼此残杀、当他们看见所爱之人遭毁灭时，要把他们捆绑，囚在大地的山岭之下[a]七十代，直到他们受审判和终结[b]的日子，直到那永世的审判完成[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山岭”也可译作“群山”。
    reason: lexical_alternative
  - marker: b
    text: “终结”也可理解为“完成”或“最终结局”。
    reason: lexical_alternative
  - marker: c
    text: 末句采用强调永恒的表达，较直译可作“永恒之世的审判”或“万世的审判”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትራገዙ
  choice: 彼此残杀
  rationale: 该复数形式在本章巨人互相毁灭的语境中表示相互施加致命暴力；“彼此残杀”比“彼此争斗”更符合上下文，同时保留互相行动的含义。
- source_word: ሐጕሎሙ
  choice: 毁灭
  rationale: 此词表示毁灭、败亡或倾覆；译作“毁灭”既保留强烈的审判色彩，也不限定具体毁灭方式。
- source_word: ለፍቁራኒሆሙ
  choice: 自己所爱之人
  rationale: 源词出自“爱”的词根；此译自然、庄重，并保留他们亲眼看见所爱者毁灭的情感力度。
- source_word: እሰሮሙ
  choice: 把他们捆绑
  rationale: 源文是命令性的表达，具体指捆绑；这样也与《以诺一书》中守望者受拘禁的形象一致。
- source_word: ለ፸ ትውልድ
  choice: 七十代
  rationale: 直译这一启示文学中的期限表达，不将其解释为具体年数。
- source_word: በመትሕተ አውግርተ ምድር
  choice: 囚在大地的山岭之下
  rationale: “在……之下”保留地下拘禁的空间意象；相关名词可指山岭或群山，正文采用自然且不过度强化规模的“山岭”。“囚在”补明捆绑所形成的拘禁状态。
- source_word: ዕለተ ኵነኔሆሙ
  choice: 他们受审判的日子
  rationale: 保留司法和末世审判含义，不预先收窄为定罪或判刑。
- source_word: ተፍጻሜቶሙ
  choice: 他们的终结
  rationale: 源词可表示完成、终局或终结；“终结”在现代汉语中庄重自然，同时不将其武断解释为毁灭或最终刑罚。
- source_word: ኵነኔ ዘለዓለመ ዓለም
  choice: 那直到永永远远的审判
  rationale: 以“永永远远”反映源文强化的永恒公式，避免仅译作普通的“永远”而削弱其力度。
theological_decisions:
- issue: 众子是在彼此争斗，还是彼此杀戮
  choice: 彼此残杀
  alternative: 彼此争斗／彼此毁灭
  rationale: 本章描述守望者后裔以暴力彼此毁灭，致命性的译法最符合近距离语境；但不添加源文没有说明的杀戮方式。
- issue: “他们的终结”具体指什么
  choice: 保留为“终结”
  alternative: 最终刑罚／毁灭／完成
  rationale: 源词兼具完成与终局的语义，正文不判定它专指灭绝、刑罚还是审判程序的完成，从而保留末世论张力。
- issue: 末句永恒审判公式的范围
  choice: 译作“那直到永永远远的审判”
  alternative: 永恒的审判／万世的审判
  rationale: 源文使用强化的时代—永恒表达；译文保留其强调性，而不另行界定审判的对象或性质。
translation_notes:
  register: 采用现代、庄重而可读的普通话。“彼此残杀”“捆绑”“受审判”保留启示文学的强烈意象；以“终结”和脚注保存源词的多义性。正文所有脚注标记均已对应出现。
