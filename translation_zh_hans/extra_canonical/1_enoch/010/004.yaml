base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/004.yaml
  text: And again the Lord said to Raphael[a], “Bind Azazel by his hands and his feet, and cast him into the darkness; and open the desert that is in Dudael[b], and cast him there.”
translation:
  language: zh_hans
  text: 主又对拉斐尔说：“把阿撒兹勒的手脚捆住，将他扔进黑暗里；把杜达埃勒[a]那里的旷野劈开[b]，再把他扔到那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杜达埃勒”为地名音译；本节把它描述为阿撒兹勒受拘禁之旷野所在的地点。
    reason: cultural_note
  - marker: b
    text: “劈开旷野”所对应的原文较难确定，也可理解为把旷野打开；有些解释认为这是要在那里开出或预备一个坑穴。译文保留原文较具体的说法，不把“坑”直接写入正文。
    reason: textual_variant
lexical_decisions:
- source_word: ካዕበ
  choice: 又
  rationale: 表示叙事中再次发言，简洁保留原文的接续和重复。
- source_word: እግዚእ
  choice: 主
  rationale: 这里用作神的尊称；“主”符合庄重而自然的现代汉语表达。
- source_word: እሰሮ
  choice: 捆住
  rationale: 保留具体的束缚动作，不将其抽象化为“囚禁”。
- source_word: በእዴሁ ወእግሩ
  choice: 他的手脚
  rationale: 明确保留原文所指的双手和双脚；汉语“把……的手脚捆住”自然且具体。
- source_word: ወድዮ
  choice: 将他扔进／再把他扔到
  rationale: 保留两次命令中强制抛掷、移置的动作及原文的重复。
- source_word: ውስተ ጽልመት
  choice: 进黑暗里
  rationale: 既可表示黑暗的处所，也不排除惩罚状态，保留启示文学意象。
- source_word: ወአብቅዋ ለገዳም
  choice: 把……旷野劈开
  rationale: 直译其开启或裂开的强烈动作，并保留“旷野”这一明确宾语，不擅自增添“坑”等细节。
- source_word: እንተ ሀለወት በዱዳኤል
  choice: 杜达埃勒那里的
  rationale: 将关系从句自然地处理为地点修饰语，并把杜达埃勒保留为音译地名。
- source_word: ህየ
  choice: 那里
  rationale: 自然指回刚提到并被劈开的旷野地点。
theological_decisions:
- issue: 阿撒兹勒所受惩罚的性质
  choice: 保留捆住手脚、扔进黑暗和放逐到旷野的具体刑罚图景
  alternative: 概括译为囚禁，或解释为纯粹象征性的属灵黑暗
  rationale: 原文连续使用身体部位、束缚、黑暗、旷野和抛掷等具体表达；译文不将这些启示文学意象抽象化，也不限定其是否另有象征意义。
- issue: 旷野被“劈开”的含义
  choice: 保留具体而略显突兀的“劈开旷野”
  alternative: 解释性译作“在旷野挖坑”或弱化为“预备旷野”
  rationale: 原文措辞有解释难度；保留其张力可避免把可能暗示的坑穴或裂口当作明说的内容。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留命令句的力度、两次“扔”的重复和启示文学中具体的审判图景；人名、地名按常见汉语音译方式处理。
