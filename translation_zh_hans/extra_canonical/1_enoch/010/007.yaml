base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/007.yaml
  text: And heal the earth which the angels have corrupted[a], and make known the healing of the earth, so that they may heal the earth, and all the children of men may not perish through all the secrets that the Watchers have disclosed[f] and taught to their sons.
translation:
  language: zh_hans
  text: 医治那被天使败坏的大地，并宣告大地的医治[a]，使他们可以医治大地，好叫所有世人不致因守望者所披露[b]、又教给自己儿子的一切秘密[c]而灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告大地的医治”一句在文字和句法上较难确定；吉兹文也可较直译为“大地的生命”或“大地的复原”。
    reason: textual_variant
  - marker: b
    text: 吉兹文现存字面读作“所杀的”（ዘቀተሉ），很可能反映底层希腊文本中“击杀”与“指示、披露”两词的传抄混淆；此处按上下文译作“所披露”。
    reason: textual_variant
  - marker: c
    text: 这里的“秘密”是指本段中守望者非法披露的隐秘知识，并非必然指正当启示的神圣奥秘。
    reason: cultural_note
lexical_decisions:
- source_word: አሕይዋ
  choice: 使……复原
  rationale: 该动词可指“使活、恢复、医治”。这里是对遭败坏之大地的命令，用“使……复原”兼顾生命恢复与医治意象。
- source_word: አማሰኑ
  choice: 败坏
  rationale: 表达天使对大地造成的道德性与整体性破坏，同时不把含义收窄为礼仪上的玷污。
- source_word: ሕይወታ ለምድር
  choice: 大地如何得以复苏
  rationale: 名词本义与“生命”相关，也可在上下文中表示恢复或医治；此译保留生命意象，并以脚注说明歧义。
- source_word: አይድዕ
  choice: 使人知道
  rationale: 保留使役性的“使……知道／使……明白”，又不武断指定未明说的受事者。
- source_word: ይሕይ(ው)ዋ ለምድር
  choice: 让他们医治大地
  rationale: 底本明确再次出现“地”，故不采用希腊异文所反映的“灾害”；复数主语的具体所指在本句中仍有含混，译文予以保留。
- source_word: ኢይትሐጐሉ
  choice: 不致……灭亡
  rationale: 符合审判与毁灭语境，庄重而为现代读者易懂。
- source_word: በምሥጢር ኵሉ
  choice: 因……一切秘密
  rationale: 指本段守望者非法传授的隐秘知识；不将其过度限定为巫术，也不与正当启示的奥秘混同。
- source_word: ትጉሃን
  choice: 守望者
  rationale: 采用《以诺一书》中这类天使的固定称号，保留其启示文学色彩。
- source_word: ዘቀተሉ
  choice: 所披露
  rationale: 吉兹文现存字面读法为“所杀的”，但在句法和语境中不通；据底层希腊文传抄混淆恢复为“披露”，并明确加注。
- source_word: መሀሩ ለውሉዶሙ
  choice: 教给自己儿子
  rationale: 直译亲属用语，保留“儿子”而不泛化为“后代”或“人类”。
theological_decisions:
- issue: 大地复原的性质
  choice: 保留大地本身得到复原、复苏和医治的宇宙性图景
  alternative: 仅指人类社会的道德改革，或仅译作“大地存活”
  rationale: 原文反复以“大地”为直接对象；败坏与医治的对应关系支持实际而广泛的复原意象，但“生命／医治”的词义张力通过脚注保留。
- issue: 秘密的披露者
  choice: 将秘密直接归于守望者的披露和教导
  alternative: 泛指在人间流传的隐秘知识
  rationale: 末句明言守望者披露并教导这些秘密，因此不削弱其直接责任。
- issue: “他们”的指代
  choice: 保留复数代词“他们”，不在正文中指定具体群体
  alternative: 解释为人类、义人或奉命施行医治者
  rationale: 现存吉兹文的复数形式与上下文关系并不完全清楚；补出特定身份会消除原文的真实含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“大地”维持启示文学的宇宙性语域；“守望者”为全书术语。正文不引入希腊异文“灾害”，而以脚注交代真正影响理解的文字问题。所有脚注标记均已置于正文。
