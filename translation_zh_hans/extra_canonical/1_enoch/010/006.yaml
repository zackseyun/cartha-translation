base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/006.yaml
  text: And on the great day of judgment he shall be sent away into the fire[a][b].
translation:
  language: zh_hans
  text: 在审判的大日，他必被送入火中[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹文的主语是阳性单数，即“他必被送入”，承接上下文中所指的那一位。
    reason: cross_reference
  - marker: b
    text: “审判的大日”在这里是末世审判的固定表达；其中“审判”若按较窄的司法含义，也可译作“判决”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለት
  choice: 在……日
  rationale: 介词与“日”连用，表示行动发生的时间；现代汉语中用“在……日”自然明确。
- source_word: ዓባይ
  choice: 大
  rationale: 保留末世审判用语的庄严和强调意味，不额外引申为能力或范围。
- source_word: ኵነኔ
  choice: 审判
  rationale: 这里所指较宽，既可涵盖司法审理，也可包括判决；“审判”比单译“定罪”或“判决”更能保留这种范围。
- source_word: ይትፈኖ
  choice: 他必被送入
  rationale: 该形式为单数被动，表达他将被遣送或交付；结合表示趋向的介词，译作“被送入”既保留被动和移动，也不擅自强化为“被扔进”。
- source_word: ውስተ
  choice: 入……中
  rationale: 与表示遣送的动词连用时，标明朝向某处并进入其中。
- source_word: ዋዕይ
  choice: 火
  rationale: 原文使用具体的“火”这一意象，应保留其鲜明的末世审判图景，不抽象化为“惩罚”。
theological_decisions:
- issue: 应将目的地抽象译作惩罚，还是保留具体的末世意象
  choice: 火中
  alternative: 惩罚中；烈焰中
  rationale: 吉兹文使用表示“火”的具体名词；保留这一意象可避免把原文的末世图景淡化为泛指的刑罚。
- issue: “审判”应理解为整个审判事件还是狭义判决
  choice: 审判
  alternative: 判决；定罪
  rationale: 原词在此可指司法性的审判，也可能侧重所宣告的判决；正文采用范围较宽的“审判”，脚注保留较窄译法的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“审判的大日”保留原文定语关系和末世语体；“被送入”避免加入原文没有明说的“投掷”动作。
