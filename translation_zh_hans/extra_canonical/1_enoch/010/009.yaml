base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/009.yaml
  text: And to Gabriel the Lord said[a], “Go against the bastards and the reprobates, and against the children of fornication; destroy the children of fornication and the children of the Watchers from among humankind. Send them out against one another, and let them perish in battle[d][c][b]; for length of days shall not be theirs.”
translation:
  language: zh_hans
  text: 主对加百列说：“去攻击那些私生子[a]、被弃绝者[b]，以及淫乱所生的子孙。要从人类中消灭淫乱所生的子孙和守望者的子孙[c]；使他们彼此交战[d]，让他们在争战中灭亡[e]，因为他们必不得长寿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“非婚所生的”。原词是对不正当结合所生后代的严厉称呼。
    reason: lexical_alternative
  - marker: b
    text: “被弃绝者”所对应的原词含义不十分确定；也可理解为“被排斥者”。
    reason: lexical_uncertainty
  - marker: c
    text: “守望者的子孙”一句原文传本较难，所据文本作ለውሉደ፡ ትጉሃን；本译依本段守望者叙事的上下文处理。
    reason: textual_variant
  - marker: d
    text: 有括号标示的异文增添一个可译作“派出他们”的动词；无论采用与否，彼此冲突的基本意思明确。
    reason: textual_variant
  - marker: e
    text: 末句动词直译为“灭亡”或“被毁灭”；上下文暗示他们因彼此争战而灭亡，但动词本身并非主动的“互相消灭”。
    reason: grammar
lexical_decisions:
- source_word: ወለገብርኤል፡ ይቤሎ፡ እግዚእ፡
  choice: 主对加百列说
  rationale: 按现代汉语自然语序表达，同时保留እግዚእ在此审判场景中的神圣称谓“主”。
- source_word: ሑር፡ ዲቤሆሙ፡
  choice: 去攻击
  rationale: 这里不是单纯前往，而是奉命敌对性地临到审判对象；“攻击”保留其惩罚意味。
- source_word: ለመንዝራን፡
  choice: 那些私生的
  rationale: 该词严厉指称不正当结合所生的后代；此译保留贬斥色彩，又比现代汉语辱骂语更适合庄重经文体。
- source_word: ወለማኑናን፡
  choice: 被弃绝的
  rationale: 词义较难确定；在审判语境中表达遭排斥、被定为当受审判者，同时避免加入特定教义术语。
- source_word: ወዲበ፡ ውሉደ፡ ዘማ፡
  choice: 以及淫乱所生的
  rationale: 保留ዘማ所含的性越轨和谱系意味，以自然汉语呈现，不将其弱化为泛称的“罪人”。
- source_word: ወአኅጕሎሙ፡
  choice: 消灭
  rationale: 该动词力度强，适合此处彻底审判的语境。
- source_word: ለውሉደ፡ ትጉሃን፡ እምሰብእ፡
  choice: 从人类中消灭……守望者的子孙
  rationale: 依上下文将较难的ትጉሃን理解为“守望者”，并保留《以诺一书》的本地称谓；“从人类中”修饰除灭行动，符合句法走向。
- source_word: ወአውፅኦሙ፡ [ወፈንዎሙ፡] በበይናቲሆሙ፡
  choice: 使他们彼此攻打
  rationale: 清楚表达他们被驱使互相敌对的意思；括号内异文可能增添“派出”一类动词，但不改变彼此冲突的基本意义。
- source_word: እሙንቱ፡ ወስሊሆሙ፡ በቀትል፡ ይትሐጐሉ፡
  choice: 让他们在争战中灭亡
  rationale: ይትሐጐሉ是被动或不及物意义的“灭亡”，因此不译成主动的“互相消灭”；相互毁灭的关系已由上句表达。
- source_word: እስመ፡ ኑሐ፡ መዋዕል፡ አልቦሙ።
  choice: 因为他们必不得长寿
  rationale: 自然、庄重地传达“长久的日子不属于他们”这一审判宣告。
theological_decisions:
- issue: 本节受审判者的身份
  choice: 理解为与守望者和人类非法结合有关的后代，而非泛指全人类。
  alternative: 只指巨人，或泛指所有犯罪的人。
  rationale: “私生的”“淫乱所生的”“守望者的子孙”这一连串称呼，在守望者叙事中共同指向非法结合所生的后代；译文不额外以“巨人”替换原有称谓。
- issue: 带有强烈道德谴责的谱系用语
  choice: 正文保留“私生的”“淫乱所生的”等尖锐表达。
  alternative: 一律缓和为“不正当结合所生的后代”。
  rationale: 本节属于末世审判宣告，原文措辞本就严厉；但汉译避免采用纯粹辱骂性的俚语。
- issue: 相互残杀与动词语态
  choice: 先译“使他们彼此攻打”，再译“在争战中灭亡”。
  alternative: 合并译为“让他们在争战中互相消灭”。
  rationale: 上下文确有相互冲突，但末一动词本身为被动或不及物意义；分开表达可兼顾叙事情境与原文语态。
translation_notes:
  register: 采用现代、庄重而清楚的简体中文。审判命令使用短句以保持力度；保留“守望者”这一《以诺一书》的专门称谓。对原文严厉的谱系标签不作神学性淡化，同时借脚注说明替代译法和文本不确定性。
