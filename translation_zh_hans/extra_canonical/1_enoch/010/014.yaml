base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/014.yaml
  text: And when he burns and perishes[c][b][a], from now on they shall be bound together with them until the completion of the generations of generations.
translation:
  language: zh_hans
  text: 当他燃烧并灭亡时[a]，从今以后，他们将与那些人一同被捆绑，直到世世代代终结之时[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “燃烧并灭亡”所指的主语在本节单独看来并不明确；原文动词为第三人称阳性单数。早先的译法曾将这里理解为“起来”及“他们的儿子”，但按现有词形分析，更可能是“他燃烧并灭亡”。
    reason: textual_variant
  - marker: b
    text: “世世代代”对应原文重复的“世代之世代”，强调漫长连续的世代；这里仍保留“直到……终结”的期限表达，没有直接改译为“永远”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: 当……时
  rationale: 保留时间从句的连接作用，引出审判过程的下一阶段。
- source_word: ይውዒ
  choice: 他焚烧
  rationale: 按所给校审意见，视为源自动词“燃烧”，而非“起来”；用“焚烧”保留其主动形式，但主语所指仍由上下文决定。
- source_word: ወይማስን
  choice: 而灭亡
  rationale: 按动词“毁灭、灭亡”理解，与前一动词并列，不误解为“他们的儿子”。
- source_word: እምይእዜ
  choice: 从那时起
  rationale: 表达自该事件以后开始的时间意义；在“当……时”的结构中，“从那时起”比“从现在起”更自然。
- source_word: ምስሌሆሙ
  choice: 同那些人一起
  rationale: 表示共同受罚；用“那些人”避免连续两个“他们”造成中文指代混乱，同时不擅自明确其身份。
- source_word: ኅቡረ
  choice: 一起
  rationale: 保留集体、共同被捆绑的意义。
- source_word: ይትአሰሩ
  choice: 要……被捆绑
  rationale: 保留审判语境中的束缚意象，不扩大解释为“监禁”。
- source_word: እስከ
  choice: 直到
  rationale: 准确表达拘束持续至某一终点。
- source_word: ተፍጻሜተ
  choice: 终结之时
  rationale: 表达达到既定终点的意义，现代中文比直译“完成”更自然，同时不额外引入末世论术语。
- source_word: ትውልደ፡ ትውልድ
  choice: 世世代代
  rationale: 以自然而庄重的中文复叠习语再现原文重复结构及漫长世代延续之意。
theological_decisions:
- issue: 惩罚持续的期限与范围
  choice: 译作持续“直到世世代代终结之时”的共同捆绑
  alternative: 永远监禁；只捆绑到最后审判
  rationale: 原文兼有“直到”的终止表达和重复的世代习语；保留这种时间张力，不把它直接等同于抽象的无尽永恒，也不限定为某一后期教义框架。
- issue: 焚烧并灭亡者的身份
  choice: 保留第三人称单数“他”
  alternative: 明确为某个前文人物、群体或其后裔
  rationale: 本节所给文本只呈现阳性单数动词，孤立经文不足以无歧义地确定所指，因此不在译文中补明身份。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。保留“捆绑”的具体审判意象和原文的时间张力；通过“那些人”缓解中文代词歧义，但不擅自认定各代词的具体对象。
