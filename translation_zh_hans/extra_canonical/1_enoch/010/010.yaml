base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/010.yaml
  text: And these things that they ask of you shall not be granted to their fathers on their behalf[a]; for they hope to live an everlasting life[d][c][b], and each one of them will live five hundred years.
translation:
  language: zh_hans
  text: 他们向你所求的这些事，不会因着他们的缘故而准许给他们的父辈[b]；因为他们盼望活到永远，他们每一个人将活五百年[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “五百年”直译为“五百个冬季”；“冬季”在这里是计算年岁的说法。
    reason: cultural_note
  - marker: b
    text: “因着他们的缘故”中的“他们”所指较为含混，也可能指父辈或他们的后代；后面的话的主语也可相应理解为后代。
    reason: alternative_reading
lexical_decisions:
- source_word: ዘይስእሉከ
  choice: 他们向你所求的这些事
  rationale: 将关系成分理解为“他们向你所求的事”，其中第二人称后缀表示请求所指向的对象；避免旧译“询问有关你的事”。
- source_word: ኢይከውኑ ለአበዊሆሙ
  choice: 不会为他们的父辈……而获准
  rationale: ከውነ 与介词 ለ 连用，在这里表示某事不为某人实现或获准；上下文所指是代求不会惠及父辈，而不是后代“不会变得像父辈”。
- source_word: በእንቲአሆሙ
  choice: 因着他们的缘故
  rationale: 保留原文压缩的代词指向及原因、缘故之意，不在正文中武断限定“他们”具体指谁。
- source_word: ይሴፈዉ
  choice: 指望
  rationale: 该词表示盼望、期待，并非“被剪除”；“指望”在审判语境中也能自然传达其愿望未必实现。
- source_word: ይኅየዉ ሕይወተ ዘለዓለም
  choice: 活到永远
  rationale: 原意为“活永恒的生命”；此译自然明白，并避免把它固定化为后期神学术语“得永生”。
- source_word: አሐዱ አሐዱ እምኔሆሙ
  choice: 他们每一个人
  rationale: 重复的“一个、一个”具有逐一分配的作用，译为“每一个人”保留强调。
- source_word: ኃምስተ ምእተ ክረምተ
  choice: 五百年
  rationale: 字面为“五百个冬季”，在此是以冬季计年的习语；正文采用现代汉语通常说法，字面形象收入脚注。
theological_decisions:
- issue: 父辈的请求、后代的代求与寿命宣告之间的关系
  choice: 将本节理解为：他们向受命者提出的请求，不会因后代的缘故而为其父辈获准；父辈虽指望永远活着，实际寿命却被限定为五百年。
  alternative: 也可把“他们的缘故”所指理解为父辈，或把后半句的主语理解为后代，从而形成父辈受拒、后代获准长寿的对照。
  rationale: 原文代词连续出现且主语省略，指代关系较为压缩。正文顺承“父辈”理解后半句，同时用脚注承认另一种指代可能，不把审判与怜悯的张力强行消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“获准”补出该结构在语境中的含义；“却只能”呈现“指望永远活着”与“五百年”之间的明显反差，但不加入原文没有的毁灭措辞。所有脚注标记均置于相关正文之后。
