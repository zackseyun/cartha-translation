base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/008.yaml
  text: And the whole earth has been corrupted by the teaching of the works of Azazel[c][b][a]; and to him ascribe all sin.
translation:
  language: zh_hans
  text: 全地都因阿撒泻勒所传授的作为[a]而败坏；并要把一切罪都记在他身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因阿撒泻勒的作为所带来的教导。”原文短语同时含有“教导”和“作为、实践”两个概念；其具体句法关系较为紧凑。
    reason: lexical_alternative
  - marker: b
    text: 直译可作：“并要针对他写下一切罪。”这是审判场景中的司法性说法，表示把一切罪责记录在他名下。
    reason: alternative_reading
lexical_decisions:
- source_word: ማሰነት
  choice: 败坏了
  rationale: 该动词表示受损、腐化或败坏；这里兼具道德与遍及全地的审判意味。“败坏了”自然且保留原文力度。
- source_word: ኵላ ምድር
  choice: 全地
  rationale: 本段为普世性的末世审判语境，宜理解为整个大地，而非某一局部地区。
- source_word: በትምህርተ ግብሩ
  choice: 因……所教的恶行
  rationale: 原短语同时包含“教导”和“行为、实践”两个概念。此译表达阿撒泻勒把具体的败坏行为传授给人，同时避免生硬的“行为的教导”。
- source_word: ለአዛዝኤል
  choice: 阿撒泻勒所……
  rationale: 该关系把行为及其教导归于阿撒泻勒；汉语以“阿撒泻勒所教的”自然表达这种所属和来源关系。
- source_word: ወላዕሌሁ
  choice: 要……记在他身上
  rationale: ላዕሌሁ 的基本方向是“在他之上、针对他”，在司法语境中表示将罪责记在或归在他身上；并保留词首连接词“而/并”的承接作用。
- source_word: ጸሐፍ
  choice: 记
  rationale: 这是审判宣告中的命令，指正式写下或登记；“记在……身上”在现代汉语中既自然，又保留司法记账般的意象。
- source_word: ኵሎ ኃጢአተ
  choice: 一切罪
  rationale: 保留原文全面、概括性的罪责归属，不限定为某一种罪。
theological_decisions:
- issue: 末句是把一切罪正式记录在阿撒泻勒名下，还是泛指归罪于他
  choice: 要把一切罪都记在他身上
  alternative: 要把一切罪都写下来，作为对他的指控
  rationale: 审判语境及“在他之上、针对他”的介词结构支持司法性的罪责登记；译文保留“记”的书写意象，又不把原文缩减为单纯的抽象“归罪”。
- issue: “教导”与“行为”的关系
  choice: 阿撒泻勒所教的恶行
  alternative: 阿撒泻勒行为的教导／关于他行为的教训
  rationale: 原文紧密结合“教导”与“行为”，具体句法关系略有压缩。正文采用自然汉语表达他传授具体恶行，脚注保留较贴近形式的另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“败坏”“一切罪”保留末世审判的力度；“所教的恶行”使压缩的吉兹语结构在汉语中顺畅，脚注则保存其词汇与句法张力。专名采用汉语传统文献中常见的“阿撒泻勒”。
