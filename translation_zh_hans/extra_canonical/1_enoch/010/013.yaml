  rationale: 修订仅调整汉语句法和永久性表达：保留原文未说明身份的双方复数代词，以及“带下去”的方向；将原文并列的痛苦与监禁处分别译为“受痛苦”和“囚在拘禁之所”，使中文自然且不额外界定惩罚性质或执行者。脚注锚点仍准确附于“火的深渊”和“拘禁之所”。
