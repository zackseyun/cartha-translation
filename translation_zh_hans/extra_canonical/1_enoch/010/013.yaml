  naturalness: “他们要把他们”虽可理解，但在现代汉语中连续使用同形代词不够清楚；改作“他们要把这些人带下去”会擅自限定受事者，故仍保留代词。通过将“痛苦”处理为“受痛苦”、将拘禁处处理为“囚在……之所”，可在不补充身份的前提下使句子自然。
  terminology: “火的深渊”恰当保留空间性启示文学意象，避免加入“地狱”等后起固定术语。“拘禁之所”准确传达“拘禁之屋/监牢”的具体意象。“永远被关在那里”比“直到永远”更符合现代汉语，并表达 ለዓለም 在此处的持续性。
