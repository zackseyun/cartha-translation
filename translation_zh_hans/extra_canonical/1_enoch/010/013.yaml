base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/013.yaml
  text: And in those days they will lead them down into the abyss of fire[a], and into torment and the prison-house[b]; and there they will be shut up forever.
translation:
  language: zh_hans
  text: 在那些日子，他们要把他们带下去，进入火的深渊[a]，受痛苦，并囚在拘禁之所[b]；他们将永远被关在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火的深渊”直译可理解为“火的低处”或“火的深处”；原文的确切空间意象可能是“火焰深处”或“烈火深渊”。
    reason: lexical_alternative
  - marker: b
    text: “拘禁之所”原文直译为“拘禁之屋”，保留了这幅审判图景中的监禁意象。
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕል
  choice: 到那时
  rationale: 该词指“日子、时期”；在末世性时间表达中译为“到那时”，既自然，也保留“那些日子”的语义功能。
- source_word: ይወስድዎሙ
  choice: 他们要把他们带下
  rationale: 保留复数施事者与复数受事者，不擅自指明双方身份；“带下”也体现后接低处的空间方向。
- source_word: መትሕተ እሳት
  choice: 火的深渊
  rationale: 原短语指与火相关的低处或深处；此译保留启示文学的空间意象，避免直接套用后来的固定神学术语“地狱”。
- source_word: በጻዕር
  choice: 进入痛苦
  rationale: 该名词可指苦难、折磨或痛楚；“痛苦”保留其宽度，不把惩罚方式解释得过于具体。
- source_word: ቤት ሞቅሕ
  choice: 囚禁之所
  rationale: 字面为“拘禁之屋”；“囚禁之所”在现代汉语中庄重自然，同时保留具体的监禁意象。
- source_word: ይትዓፀዉ
  choice: 要被关在那里
  rationale: 表达被关闭、拘禁的被动意义，并与前面的“囚禁之所”自然衔接。
- source_word: ለዓለም
  choice: 直到永远
  rationale: 在审判语境中通常表示无尽的持续；“直到永远”符合现代汉语经文语体，并保留原文强烈的终局性。
theological_decisions:
- issue: 是否用固定神学术语指称火中的惩罚之地
  choice: 火的深渊
  alternative: 地狱；火坑；火的深处
  rationale: 吉兹语使用空间性、意象性的说法，并非明确采用后世固定术语；译文因此保留原有启示文学图景。
- issue: 惩罚持续时间的表达
  choice: 直到永远
  alternative: 直到世代；永世
  rationale: ለዓለም 本身可涉及“世代/永远”的语义范围，但在此终局审判与持续囚禁的语境中，“直到永远”最为自然；不在正文中削弱其力度。
translation_notes:
  register: 采用现代、庄重而清楚的简体中文。“他们要把他们”虽有代词重复，但忠实保留原文未明说的复数施事者和受事者，避免擅自补出身份。分号呈现地点、痛苦与永久拘禁之间的推进。
