base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/005.yaml
  text: And heap jagged and sharp stones upon him[a], and cover him with darkness; and there he shall remain forever[c][b]. And cover his face so that he may not see light.
translation:
  language: zh_hans
  text: 要把粗糙而尖锐的石头堆在他身上[a]，用黑暗遮盖他；他要永远留在那里[b]。又要蒙住他的脸，使他看不见光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “粗糙”和“尖锐”是对同一批石头的两个并列描述；也可译作“粗砺而锋利的石头”。
    reason: lexical_alternative
  - marker: b
    text: “永远”直译原文的持续性用语；本句强调他被长久禁闭，不在此处说明这一时限与后续审判场景之间的关系。
    reason: ambiguity
lexical_decisions:
- source_word: ደይ
  choice: 堆在
  rationale: 此处是惩罚性禁闭的命令；“堆在他身上”自然表达把石头层层加在其上的具体动作，又不扩大为明确的埋葬。
- source_word: እብነ ጠያያተ ወበሊሓተ
  choice: 嶙峋尖利的石头
  rationale: 原文一个“石头”由两个并列形容词修饰；“嶙峋尖利”保留粗砺不平与锋利的双重意味，也避免译成两类不同的石头。[a]
- source_word: ክድኖ
  choice: 遮盖／蒙住
  rationale: 同一动词在原文中重复出现；汉语因宾语不同分别以“用黑暗遮盖”和“蒙住他的脸”自然表达，核心的遮蔽意义保持一致。
- source_word: ጽልመተ
  choice: 黑暗
  rationale: 采用直接、庄重的对应语，保留启示文学中具体而强烈的审判图景。
- source_word: ይኅድር ለዓለም
  choice: 他要永远留在那里
  rationale: 在禁闭语境中，“留在那里”比中性的“居住”更贴切；“永远”保留持续时间的强烈表述。
- source_word: ለገጹ
  choice: 他的脸
  rationale: 按字面理解为遮住被惩罚者的脸，并与下句看不见光直接衔接。
- source_word: ከመ ኢይርአይ ብርሃነ
  choice: 使他看不见光
  rationale: 保留目的或结果关系以及“看不见光”的鲜明意象，不加入后期神学解释。
theological_decisions:
- issue: 惩罚意象是具体禁闭还是抽象苦难
  choice: 保留石头、黑暗、蒙脸和不见光等具体的禁闭意象
  alternative: 概括为受苦或一般性的囚禁
  rationale: 原文连续使用具体命令，形成近似掩埋的严厉审判画面；译文不将其淡化为抽象惩罚，也不进一步断言为死亡或正式埋葬。
- issue: “永远”的范围
  choice: 直译为“永远”，不在正文中限定其长短或终点
  alternative: 解释为“长久”或限定到末日审判之时
  rationale: ለዓለም 本身给出强烈而开放的持续性表达；本节不宜以外部体系消解它与后续叙事可能存在的张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事命令体。“要……；……要……”保持原文连续命令及其审判力度；以“蒙住他的脸”配合现代汉语习惯，同时保留遮蔽与不见光之间的逻辑联系。
