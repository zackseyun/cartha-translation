base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/011.yaml
  text: And to Michael the Lord said[a], “Go, bind Shemihazah and the others with him[c][b], who joined themselves with women so as to defile themselves with them in their uncleanness.”
translation:
  language: zh_hans
  text: 主对米迦勒说：“去，把舍米哈扎和其他与他在一起的人都捆绑起来[a]；他们与女人结合，以致在她们的不洁中与她们一同玷污自己。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “捆绑”所依据的命令动词在现存转录文本中较难辨认；本章上下文及较广的文本见证支持这一译法。
    reason: textual_variant
lexical_decisions:
- source_word: ለሚካኤል
  choice: 对米迦勒
  rationale: 采用现代中文读者熟悉的圣经人名形式“米迦勒”，介词前缀按汉语引语结构译为“对”。
- source_word: ይቤ እግዚእ
  choice: 主……说
  rationale: 明确保留原文的主语“主”，并用自然的汉语引语句式表达。
- source_word: ሑር †አይድዕ†
  choice: 去，把……捆绑起来
  rationale: 抄本文字在命令动词处有困难；依据本章审判语境及较广的文本见证，采用“捆绑”，同时以脚注说明不确定性。
- source_word: ለስምያዛ
  choice: 舍米哈扎
  rationale: 按闪族名称 Shemihazah 的常见学术形式音译，兼顾来源透明度和中文可读性。
- source_word: ወለካልኣን እለ ምስሌሁ
  choice: 和那些与他同伙的
  rationale: 保留“其他与他同在者”的集体含义；“同伙”自然简洁，也符合共同参与越界行为的语境，但不额外规定其等级。
- source_word: እለ ሐብሩ ምስለ አንስት
  choice: 他们与女人结合
  rationale: “结合”保留主动联合的含义及相关性意味，同时避免加入原文没有明说的细节。
- source_word: ከመ ይማስኑ
  choice: 以致……陷入……不洁之中
  rationale: ከመ 在此可表达目的或结果；“以致”自然地保留结果意味，而“不洁”维持道德与礼仪层面的张力。
- source_word: ምስሌሆን በርኵሶ ዚአሆን
  choice: 和她们一同陷入她们的不洁之中
  rationale: 明确保留“与她们”和“她们的不洁”，不添加原文没有的“所有/一切”。
theological_decisions:
- issue: 与女人结合所造成的污秽属于何种性质
  choice: 译作“不洁”，不进一步界定其性质
  alternative: 明确译为性败坏、单纯礼仪污秽或一般邪恶
  rationale: 原文把守望者与女人的结合和污秽联系起来，但未在本节把它限定为某一后来的教义范畴；因此保留道德与礼仪含义并存的张力。
- issue: ከመ 所表达的是目的还是结果
  choice: 以“以致”呈现结果意味
  alternative: 译为“为了使自己受玷污”，强调目的
  rationale: 原文连接词容许目的或结果色彩；结合上下文，中文用“以致”较自然，同时不把这些存在刻意追求污秽设定为唯一解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留“主”“不洁”等宗教语汇，但避免古奥句法；人名使用简体中文常见音译。
