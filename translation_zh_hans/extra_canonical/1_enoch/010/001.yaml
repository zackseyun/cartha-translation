base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/001.yaml
  text: 'Then the Most High[a], the Great and Holy One, spoke and sent Uriel to the son of Lamech[b], and said to him:'
translation:
  language: zh_hans
  text: 那时，至高者——伟大而圣洁的那一位——说话，差遣乌列[a]到拉麦的儿子[b]那里，对他说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处的埃塞俄比亚语转录似有轻微讹误；“乌列”是据残存字形及紧接着的受命语境所作的可靠判断。
    reason: textual_variant
  - marker: b
    text: 本节只称受命者为“拉麦的儿子”；从上下文可知，他就是挪亚。
    reason: cross_reference
lexical_decisions:
- source_word: አሜሃ
  choice: 那时
  rationale: 作为叙事承接语，既可表示事件推进，也不把时间关系限定得过细。
- source_word: ልዑል
  choice: 至高者
  rationale: 这是表达崇高、至高之意的神圣称号；“至高者”在现代汉语中庄重而自然。
- source_word: ዓቢይ፡ ወቅዱስ
  choice: 伟大而圣洁的那一位
  rationale: 保留原文并列叠加的神圣称谓，同时用“那一位”使汉语结构完整，不把两个称谓压缩成单一名称。
- source_word: ተናገረ
  choice: 开口说话
  rationale: 原义为“说话”；此处用“开口说话”自然引出随后所传达的命令，又保留独立言说动作。
- source_word: ወፈነወ
  choice: 差遣
  rationale: 此动词不只是一般的“送去”，而含有受命执行任务的语境；“差遣”适合天使奉命行动的庄重叙事。
- source_word: አሰርየ፡ ልዩር
  choice: 乌列
  rationale: 现存转录在此似有讹乱，但结合字形痕迹和紧接着的天使使命，最可能是专名“乌列”；专名采用通行音译。
- source_word: ኀበ
  choice: 到……那里
  rationale: 表示差遣的方向或目的地；在汉语中以“到……那里”清楚体现其关系。
- source_word: ወልደ፡ ላሜክ
  choice: 拉麦的儿子
  rationale: 直译亲子称谓，不在正文中提前补出上下文所指的“挪亚”。
- source_word: ወይቤሎ
  choice: 对他说
  rationale: 保留动词所带的第三人称男性宾语，使后续引语的听者明确。
theological_decisions:
- issue: 多个神圣称谓的表达
  choice: 至高者——伟大而圣洁的那一位——
  alternative: 至高、伟大而圣洁者
  rationale: 原文叠加“至高”“伟大”“圣洁”等称谓。采用同位说明结构，既保留这些称谓各自的分量，也避免把它们改写为一个固定的教义性名称。
- issue: 拉麦之子的身份
  choice: 正文仅译作“拉麦的儿子”
  alternative: 在正文中直接译作“挪亚”
  rationale: 本节原文没有明说姓名；虽然后文语境清楚指向挪亚，正文仍保留原文的间接称呼，并在脚注中说明。
- issue: 受差遣者姓名的文本状态
  choice: 正文作“乌列”，并加文本说明
  alternative: 不确定地音译现有讹乱字形，或补作“天使乌列”
  rationale: 转录文本此处疑有讹误，但上下文强烈支持“乌列”。正文采用最有根据的读法，同时以脚注公开其文本不确定性；原文此处也没有必要增补“天使”一词。
translation_notes:
  register: 采用现代、庄重而可朗读的叙事语体。“那时”自然推进情节；破折号标示同位的神圣称谓，避免汉语误读为数位对象。句末冒号保留后续直接引语的开启。
