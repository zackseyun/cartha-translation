base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/003.yaml
  text: And now instruct him[c][b][a], that he may flee and preserve his seed for all the generations forever.
translation:
  language: zh_hans
  text: 现在，你要指示他，好叫他逃走，他的后裔[a]得以世世代代永远存留。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的种子”，这里指他的后裔或子孙。
    reason: lexical_alternative
  - marker: b
    text: 所给转录在这里作 ይገበር，字面可作“作、成就”；但有校勘证据支持读作 ይተርፍ，意为“存留”，希腊语文本“将存留”亦可作旁证。正文依此读法译为“得以……存留”。
    reason: textual_variant
lexical_decisions:
- source_word: መሀሮ
  choice: 指示他
  rationale: 此处是向天使下达使命，要求把有关逃生的事告诉那人。“指示”兼顾教导与告知，不额外限定为“警告”。
- source_word: ይጐይዝ
  choice: 使他逃走
  rationale: 上下文涉及迫近的审判和脱离危险；“逃走”比单纯的“离开”更能体现紧迫性。
- source_word: ዘርኡ
  choice: 他的后裔
  rationale: 该词直译为“他的种子”，在这里是谱系用语。现代汉语用“后裔”自然清楚，并保留血脉延续之意。
- source_word: ይተርፍ（校勘所据读法；所给转录作 ይገበር）
  choice: 存留
  rationale: “他的后裔”在格上宜作主语；校勘所据读法意为“留下、存留”，也与希腊语旁证 μενεῖ 相符。译文因此不采用把“后裔”当作宾语的“保全他的后裔”。
- source_word: ለኵሎሙ ትውልድ ለዓለም
  choice: 世世代代永远
  rationale: 以自然而庄重的汉语表达“所有世代”与“永远”叠加的延续意味，不削弱原文的强调。
theological_decisions:
- issue: 本句是说主动保全那人的后裔，还是说他的后裔将继续存留
  choice: 使他的后裔……存留
  alternative: 保全他的后裔
  rationale: 名词形式支持“他的后裔”作主语，而校勘证据支持不及物的“存留”。这样既表达洪水审判中的血脉延续，也不把原文改写成一个明确的主动保全动作。
- issue: “存留”是否仅指生物性的生存
  choice: 保留原文宽度，不加限定
  alternative: 使他的家族血脉得以繁衍
  rationale: 上下文确实关乎审判后人类谱系的延续，但原句没有明确区分单纯生存、家系延续或更广的神学含义，因此不在正文中收窄。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“世世代代永远”保留原文累加强调；“后裔”避免“种子”在现代汉语中的误解。因底本转录可信度为中等，正文依较强的语法与文本旁证采用“存留”，并在脚注中透明说明异文问题。
