base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/003.yaml
  text: As he created and gave to humankind to understand the word of knowledge[a], so also he created me and gave me reproof for the Watchers[c][b], the sons of heaven.
translation:
  language: zh_hans
  text: 正如他创造人类，并赐给他们明白知识之言的能力；他也创造了我，并赐我能责备他们的使命——那些警醒者、天之子。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “警醒者”传统上常译作“守望者”；原词与清醒、警觉有关，在本书中指那群属天的存在。
    reason: lexical_alternative
  - marker: b
    text: 本句埃塞俄比亚文的转写和语法有疑难；这里按“他也创造了我，并赐我能责备他们的使命”理解。另一种较字面的处理是：“他也创造了我，并赐给我针对那些警醒者的责备。”
    reason: textual_variant
lexical_decisions:
- source_word: ቃለ አእምሮ
  choice: 知识之言
  rationale: ቃል意为“言语、话”，አእምሮ指“知识、认识、理解”；保留“言”这一具体意象，同时让前面的“明白”表达其认知作用。
- source_word: ሰብእ
  choice: 人类
  rationale: 此处为集合性称谓，现代汉语用“人类”自然且不造成仅指男性的误解。
- source_word: እዝልፎሙ
  choice: 去责备他们
  rationale: 结合修订所指出的一人称使命结构，将该形式理解为指向复数对象的“责备他们”，比把它名词化为“责备”更能说明后接“警醒者、天之子”的句法关系。
- source_word: ትጉሃን
  choice: 警醒者
  rationale: 该词本义与清醒、警觉有关；“警醒者”既保留词义，也可在注释中说明传统专名“守望者”。
- source_word: ውሉደ ሰማይ
  choice: 天之子
  rationale: 直译其亲属与属天意象，不将其进一步教义化为某一特定天使类别。
theological_decisions:
- issue: ትጉሃን ውሉደ ሰማይ所指的属天群体
  choice: 译作描述性的“那些警醒者、天之子”
  alternative: “守望者，就是天之子”或“警醒的属天者”
  rationale: 上下文很可能指《守望者之书》中的守望者，但正文保留原词“警醒”的语义，不把传统技术性称号当作唯一可能的词义。
- issue: 以诺所得使命的性质
  choice: “派我去责备他们”
  alternative: “赐给我针对守望者的责备”
  rationale: 第一种译法较好地反映修订材料所辨识的一人称结构及复数宾语，但抄本转写处存在困难，故以脚注保留较名词化的可能读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赐他们明白……的能力”补足汉语所需的表达关系；破折号保留末尾同位语的强调，并以脚注公开文本与句法上的不确定性。
