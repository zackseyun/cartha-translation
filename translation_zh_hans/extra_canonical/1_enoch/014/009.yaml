base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/009.yaml
  text: And I went in until I drew near to a wall built of stones of hail[a], and a tongue of fire surrounded it[e][d][c][b], and it began to make me afraid.
translation:
  language: zh_hans
  text: 我走了进去，直到临近一道用冰雹之石筑成的墙[a]；一条火舌环绕着它[b]，它开始使我感到害怕[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冰雹之石”是较为直译的说法，也可理解为“冰雹”或“冰石”。此处所指为“墙”，但相关词在本见证中也可较宽泛地指建筑物或构筑物。
    reason: lexical_alternative
  - marker: b
    text: 原文是单数，即“一条火舌”；有些译法作复数“火舌”。
    reason: grammatical_number
  - marker: c
    text: 现存转录见证的末句较难确定；这里依其上下文译作“它开始使我感到害怕”。
    reason: textual_difficulty
lexical_decisions:
- source_word: ወቦእኩ
  choice: 我走了进去
  rationale: 该动词表示进入或走入；译文既保留以诺在异象中的移动，也符合现代汉语表达。
- source_word: እስከ፡ እቀርብ
  choice: 直到临近
  rationale: 这一组合表示持续前行，直至接近某物；“临近”简洁而庄重。
- source_word: ጥቅም
  choice: 一道……墙
  rationale: 虽然该词本身可泛指建成之物，但本处参照希腊文 τεῖχος 及语境，译作“墙”较为具体；量词“一道”符合现代汉语习惯。
- source_word: ዘሕንጽት
  choice: 筑成的
  rationale: 关系动词说明墙是由随后所述材料建造而成；“筑成”与“墙”自然搭配。
- source_word: በእእባነ፡ በረድ
  choice: 用冰雹之石
  rationale: 按字面保留“冰雹之石”的奇异意象，不将其直接平顺化为普通的“冰雹”或“冰块”。
- source_word: ልሳነ፡ እሳት
  choice: 一条火舌
  rationale: 原文名词为单数，且动词也为单数；译作“一条火舌”保留具体的异象意象，并与下一节的指称衔接。
- source_word: የዓውዳ
  choice: 环绕着它
  rationale: 该动词表达围绕、环绕之意；此译法清楚保留空间关系。
- source_word: ወጠነ፡ ያፍርሀኒ
  choice: 它便开始使我害怕
  rationale: 按现有吉兹文见证，将前一词理解为“开始”，后一词保留使役意义“使我害怕”；同时以脚注说明文本困难。
theological_decisions:
- issue: 异象中建筑与火焰意象的保留
  choice: 冰雹之石筑成的墙；一条火舌环绕着它
  alternative: 冰雹筑成的房屋；火焰围绕着它
  rationale: 原文刻意使用奇异而具体的末世异象语言。译文不把“冰雹之石”普通化，也不把单数“火舌”泛化为火焰，从而避免消解其神秘性与上下文联系。
- issue: 末句施事的不确定性
  choice: 它便开始使我害怕
  alternative: 其根基使我害怕
  rationale: 现有转录文本支持“开始……使我害怕”的分析，而“其根基”缺乏该见证中的直接词汇依据；不过因文本状态不稳，脚注明示其困难，不将所选理解说成毫无疑问。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我走了进去”“直到临近”保持异象行进的节奏；“冰雹之石”和“一条火舌”则有意保留原文陌生、奇异的启示文学质感。所有脚注标记均置于正文相应词组之后。
