  yaml_path: translation/extra_canonical/1_enoch/014/014.yaml
  text: And as I shook and trembled[a], I fell on my face and saw in the vision.
translation:
  language: zh_hans
  text: 我惊惶战抖时，便面伏于地，并在异象中看见了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንዘ
  choice: 正……
  rationale: 引出与后续动作同时发生的情状，保留持续性，同时符合现代汉语叙事习惯。
- source_word: እትሀወክ
  choice: 惊惶
  rationale: 表达内在受扰、惊慌不安；与后一动词并列，避免把两个近义动词合并为一个笼统的“害怕”。
- source_word: እርዕድ
  choice: 战抖
  rationale: 保留身体震颤的具体反应，并与“惊惶”共同加强异象场景中的强烈震撼。
- source_word: ወድቁ
  choice: 俯伏在地
  rationale: 动词本义为“倒下、落下”；结合“在我脸上”的惯用表达，汉语译作“俯伏在地”能自然呈现面伏于地的姿态，又不额外解释为主动敬拜。
- source_word: በገጽየ
  choice: 俯伏在地
  rationale: 字面为“在我的脸上”，与“倒下”连用表示面伏于地；不硬译作不自然的“倒在我的脸上”。
- source_word: እሬኢ
  choice: 看见了
  rationale: 采用普通、直接的视觉动词，避免古雅化。
- source_word: በራእይ
  choice: 在异象中
  rationale: 保留异象性观看的语境；汉语无需强行表达冠词的确定性。
theological_decisions:
- issue: 两个恐惧反应动词应译为内在情绪，还是身体化反应
  choice: 保留为“惊惶战抖”两个相联而有区别的反应
  alternative: “心里不安，十分害怕”或仅译“战抖”
  rationale: 原文用两个近义动词加强以诺在启示场景中的强烈反应；“惊惶”侧重内在扰动，“战抖”侧重身体震颤，既保留张力，也不把两者压缩成抽象的恐惧。
- issue: 俯伏是否明确表示主动敬拜
  choice: 只呈现俯伏姿态，不明说敬拜
  alternative: “我便俯伏敬拜”
  rationale: 原文表明倒下并面伏于地，却未在本句明确说明其行为意图；不应加入特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“惊惶战抖”保留原文双动词的加强效果；“俯伏在地”自然传达面伏于地的姿态；句末“在异象中看见了”保留原文略带悬接感的异象叙述。
