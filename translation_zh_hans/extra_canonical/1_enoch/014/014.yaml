  rationale: 修订仅改善汉语连接与脚注措辞。“惊惶战抖”继续分别呈现受扰和震颤；“面伏于地”保留倒下并以脸伏地的姿态；“在异象中看见了”保留原文未说明看见对象的悬接表达。脚注标记[a]应继续置于“战抖”后。
