base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/018.yaml
  text: And I looked and saw within it a lofty throne[a]; and its appearance was like crystal, and its wheels like the shining sun[d][c][b], and the voice of the cherubim.
translation:
  language: zh_hans
  text: 我观看，看见其中有一座高耸的宝座；它的形貌如水晶[a]，它的轮子如发光的太阳[b]，还有基路伯的声音[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“水晶”的词也可能指冰、霜或明亮的晶体；这里的意象重在耀眼、透明的光泽。
    reason: lexical_alternative
  - marker: b
    text: 此词本身也可表示“圆圈”“周缘”或“环绕之物”；这里依宝座异象的语境以及希腊文、亚兰文见证译作“轮子”。
    reason: lexical_alternative
  - marker: c
    text: 原文末尾只是简短地说“以及基路伯的声音”，没有说明这声音与宝座或轮子的具体关系。
    reason: source_ambiguity
lexical_decisions:
- source_word: ነጸርኩ / ርኢኩ
  choice: 我观看，见
  rationale: 保留原文两个相连的视觉动词，呈现异象叙述庄重而层递的语气，同时避免使用过于古奥的措辞。
- source_word: ውስቴቱ
  choice: 其中
  rationale: 承接上文所述的建筑或空间，简洁表达“在它里面”。
- source_word: መንበረ ልዑለ
  choice: 一座高高的宝座
  rationale: “宝座”表达መንበር的王权座位含义；“高高的”兼顾空间上的高耸和庄严感，却不把它解释成特定神学称号。
- source_word: ራእዩ
  choice: 它的形貌
  rationale: 指宝座可见的外观；“形貌”比“景象”更明确地落在所见对象上，又保留异象文体。
- source_word: አስሐትያ
  choice: 水晶
  rationale: 该词可能指冰、霜或明亮透明的晶体；“水晶”最自然地传达此处耀眼、通透的视觉效果，并以脚注保留词义范围。
- source_word: ክበቡ
  choice: 它的轮子
  rationale: 该词本身可涉及圆圈、周缘或轮子；在宝座异象中，希腊文和亚兰文见证支持理解为宝座的轮子。汉语采用复数概念的“轮子”，同时在脚注交代词义歧义。
- source_word: ፀሐይ ዘያበርህ
  choice: 发光的太阳
  rationale: 保留关系结构中太阳“发光、照耀”的明说内容，而不只译作“太阳”。
- source_word: ቃለ ኪሩቤን
  choice: 基路伯的声音
  rationale: ቃል可指声音或声响；“声音”保留原文庄严的听觉成分。“基路伯”采用现代中文宗教文献中通行的名称，不额外说明声音的性质或来源。
theological_decisions:
- issue: 宝座修饰语的理解
  choice: 高高的宝座
  alternative: 崇高的宝座／高大的宝座
  rationale: 原短语既可表现高度，也带有尊荣意味；正文首先保留异象中的空间视觉，不将其固定解释为神学头衔。
- issue: 宝座周围构件的理解
  choice: 轮子
  alternative: 周缘／环绕之物
  rationale: 原词有圆形、周缘和轮子的词义空间；相关古代文本见证支持“轮子”。采用这一读法仍不进一步说明其象征意义，以免导入特定的宝座战车神学体系。
- issue: 末尾短语的句法关系
  choice: 还有基路伯的声音
  alternative: 基路伯的响声／并有基路伯的声音
  rationale: 原文末语极其简略，没有明说声音如何发出或与轮子怎样关联；译文保留其附加式、略显突兀的异象表达，不补成完整的因果或动作句。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留异象叙述中视觉动词的叠加、连续的比喻和末尾突出的听觉短语；不把简略句法补写成带有特定教义解释的完整叙述。
