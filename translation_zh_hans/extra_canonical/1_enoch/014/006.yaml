  to: 在这事以前，你们必已看见你们所爱的儿子遭毁灭；你们也不能以他们为己有[a]，但他们必在你们眼前倒在刀剑之下。[b]
  rationale: 修订“因为”为“但”，以恢复原文的转折关系；删除没有明确文本依据的“再”。将较生硬的“享有他们”改为“以他们为己有”，使正文仍贴近埃塞俄比亚文本表面的拥有语义，同时借脚注如实呈现损坏文本及希腊见证所支持的“享乐／益处”读法。
