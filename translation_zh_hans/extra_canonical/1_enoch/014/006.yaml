  source_fidelity: 首尾的时间、见证儿子毁灭、以及“在你们面前倒在刀剑之下”的基本意思均得到保留。可是正文将原文的转折关系译为“因为”，误作因果关系；原文此处应保留“但/而”的转折。疑难的埃塞俄比亚文本与希腊见证之间的张力，宜由脚注说明，不应在正文中加入无明确依据的“再”。
  naturalness: “享有他们”在现代汉语中略显生硬，且容易令人误解为物权意义。用“以他们为己有”较自然地保留埃塞俄比亚文本表面的“拥有”表达；脚注可说明希腊见证所支持的“因他们得享乐或益处”。“倒在刀剑之下”既自然又保留“跌倒/倒下”的意象。
  terminology: “所爱的儿子”“毁灭”“刀剑”庄重而清楚，适合本段审判宣告的文体。“儿子”保留阳性复数所指，未将守望者后裔的上下文推断强加进正文。
