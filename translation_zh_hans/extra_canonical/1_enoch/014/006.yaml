base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/006.yaml
  text: And before this[a], you will have seen the destruction of your beloved sons, and you will not have them for yourselves[c][b], but they will fall before you by the sword.
translation:
  language: zh_hans
  text: 在这事以前，你们必已看见你们所爱的儿子遭毁灭；你们也不能以他们为己有[a]，但他们必在你们眼前倒在刀剑之下。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处埃塞俄比亚文本有校勘疑难，字面可能与“财物、所有”有关；现存希腊文本则作“不能从他们得到享乐（或益处）”。因此也可译作：“你们也不能因他们得享乐。”
    reason: textual_variant
  - marker: b
    text: “必已看见”也可较简单地译作“必看见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምቅድመ ዝንቱ
  choice: 在这事以前
  rationale: 按时间意义直译，保留预言中事件的先后次序；“这事”也自然承接上文。
- source_word: ርኢክሙ
  choice: 你们必已看见
  rationale: 该完成式在预言语境中可表达将来完成的动作；“必已看见”保留这一时态层次，同时脚注说明较简单的将来时理解。
- source_word: ሐጕለ
  choice: 遭毁灭
  rationale: 该词表示毁坏、败亡；与本节随后“倒在刀下”的暴力审判相称，又不额外限定毁灭的具体方式。
- source_word: ውሉድክሙ ፍቁራን
  choice: 自己所爱之子
  rationale: ውሉድ可指儿女或后裔，但阳性复数修饰语及守望者后裔的近距离语境支持译作“子”；“所爱”准确表达亲爱、蒙爱的含义。
- source_word: አልብክሙ †ጥራያኒሆሙ†
  choice: 你们也不能再享有他们
  rationale: 埃塞俄比亚文本此处有校勘疑难，表面可能涉及财物或所有；现存希腊见证则指向从他们所得的享受、益处。“享有他们”有意保留拥有与享受之间的语义张力，并避免误译为儿子们的物质财宝。
- source_word: ይወድቁ ቅድሜክሙ በሰይፍ
  choice: 他们必在你们眼前倒在刀下
  rationale: 保留“倒下”的审判意象、“在你们面前”的亲眼见证，以及刀剑作为致死手段的意义。
theological_decisions:
- issue: “自己所爱之子”的所指
  choice: 按上下文理解为受审判的守望者之子，但正文不加解释性称号
  alternative: 泛指人类父亲的儿子，或广义的子孙后裔
  rationale: 本章及相邻审判宣告直接针对守望者及其非法结合所生的后裔；不过正文只保留原文的“你们……之子”，不把上下文推断写成明说。
- issue: “不能再享有他们”的含义
  choice: 保留失去儿子以及不能从他们得到喜乐或益处的双重可能
  alternative: 明确译作“得不到他们的财宝”或“不能因他们而喜乐”
  rationale: 埃塞俄比亚文本被标为疑难，而希腊见证支持“享受/益处”；采用含义较宽的“享有”，不武断消除文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“遭毁灭”“倒在刀下”保留启示文学审判宣告的力度；“享有他们”略带庄重色彩，用来承载疑难文本中“拥有”与“从中得享受或益处”的开放性。
