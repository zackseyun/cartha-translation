    rationale: “再”不是原文明确表达；“享有他们”在中文中不够自然，也未清楚标出此处埃塞俄比亚文本损坏、希腊见证指向享乐或益处的文本问题。正文宜保留较宽的“以他们为己有”，并在脚注交代异文。
