base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/007.yaml
  text: And your petition on their behalf will not be granted; nor on your own behalf; and you yourselves, while you weep and make supplication, will not speak a single word from the book that I wrote.
translation:
  language: zh_hans
  text: 你们为他们所作的祈求不会蒙准[a]，为你们自己所作的也不会蒙准；你们自己在哭泣恳求时，也不会说出我所写的书中的一个字[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不会实现。”吉兹语直译为“不会有（不会成）”；在祈求的语境中，很可能指不会蒙准。
    reason: 保留 ኢይከውን 的字面宽度及语境性解释。
  - marker: b
    text: 末句含义较难确定，可能表示他们不能呈上、复述或使用以诺所写的书；原文没有说明这是由于禁止、无能，还是祈求终归无效。
    reason: 保留末句关于说出书中文字之实际含义的歧义，且不将该书的性质断定为祈求书。
lexical_decisions:
- source_word: ስእለትክሙ
  choice: 你们……所作的祈求
  rationale: 该名词指请求、恳求；“祈求”既符合代求语境，也比单纯“请求”更能体现向上帝陈情的意味。
- source_word: በእንቲአሆሙ
  choice: 为他们
  rationale: 表达代表他人、替他人代求的关系；现代汉语用“为他们”自然明确。
- source_word: ኢይከውን
  choice: 不会蒙准
  rationale: 字面为“不会成/不会存在”；与“祈求”连用时，语境义是不会实现或获准。“蒙准”保留正式陈情的语气，同时以脚注注明字面可能。
- source_word: በእንቲአክሙ
  choice: 为你们自己所作的也不会蒙准
  rationale: 此短语与前面的“为他们”平行，仍受“你们所作的祈求”和“不会蒙准”支配，不把它误接到后句。
- source_word: አንትሙሂ
  choice: 你们自己
  rationale: 体现代词及附着成分的强调作用，突出听者本人。
- source_word: እንዘ ትበክዩ ወታስተበቍዑ
  choice: 虽哭泣恳求
  rationale: እንዘ 引出伴随情状；结合主句否定，汉语以“虽……却……”自然表现哭泣恳求与不能发言之间的张力。
- source_word: ወኢትተናገሩ
  choice: 却不能说出
  rationale: 原文直接否定说话行为；“不能”表达预告中的无能或不获许可，但不进一步断定原因。
- source_word: ወኢምንተ ቃለ
  choice: 一个字
  rationale: 在否定句中强调连最少的话也说不出；“一个字”是自然汉语，并可指书中任何一句话或言辞单位。
- source_word: እምውስተ መጽሐፍ ዘጻሐፍኩ
  choice: 我所写的书中的
  rationale: 明确保留“书/文书”和第一人称关系从句，指以诺写成的文书。
theological_decisions:
- issue: 末句究竟表示守望者被禁止宣读以诺的书，还是无法借此书获得帮助
  choice: 译作“不能说出……一个字”，只保留对其说话行为的否定
  alternative: “不蒙准许说出……一个字”或“不能凭这书得到任何答复”
  rationale: 吉兹文表层直接否定他们“说”，并未明说这是禁令、徒劳，还是被排除在陈诉之外，因此不在正文中解决这一神学与叙事张力。
- issue: 祈求“不会有”是指不获准还是不发生
  choice: 正文采用“不会蒙准”
  alternative: “不会实现”或“不会成就”
  rationale: 代求和陈情语境支持“不获准”，但原文用语较宽，故用脚注保留字面与另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“蒙准”“恳求”保持陈情和代求语域；用分号呈现两个平行的代求对象，再以“虽……却……”清楚表达伴随情状与主句否定。所有脚注标记均已置入正文。
