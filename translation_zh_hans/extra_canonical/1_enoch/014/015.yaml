base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/015.yaml
  text: And behold[a], another house, greater than that one, and every doorway stood open before me[c][b]; and it was built with tongues of fire.
translation:
  language: zh_hans
  text: 看哪，另有一座房屋，比那一座更宏大；每一道门都在我面前敞开着[a]。这房屋是用火舌建成的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有的门都在我面前敞开着。”原文既可按逐一的方式表达为“每一道门”，也可整体表达为“所有的门”。
    reason: lexical_alternative
  - marker: b
    text: “火舌”保留了原文具体的形象，可能指舌状的火焰或建筑上如火的突出部分；有些译本意译为“火焰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ናሁ
  choice: 看哪
  rationale: 保留异象叙事中引人注目的指示语气，而不弱化为普通的叙事连接词。
- source_word: ካልእ ቤት
  choice: 另有一座房屋
  rationale: 紧贴“另一座房屋”的建筑意象，同时不擅自将其明确解释为宫殿或圣殿。
- source_word: ዘየዓቢ እምዝክቱ
  choice: 比那一座更宏大
  rationale: “宏大”兼顾规模和威仪；“那一座”准确反映远指形式，并回指先前所见的房屋。
- source_word: ኵሉ ኆኅተ
  choice: 每一道门
  rationale: 保留量词的逐一、分配意味；“道”是现代汉语中与“门”自然搭配的量词。
- source_word: ርኁት በቅድሜየ
  choice: 都在我面前敞开着
  rationale: 用持续状态“敞开着”呈现门已处于开启状态，并保留异象见证者的第一人称空间视角。
- source_word: ሕኑጽ በልሳናተ እሳት
  choice: 是用火舌建成的
  rationale: 保留建筑动词和“火舌”这一具体而奇特的启示文学意象，不将其泛化为普通火焰。
theological_decisions:
- issue: 异象中建筑的性质
  choice: 房屋
  alternative: 宫殿；圣殿
  rationale: 原文使用通常表示“房屋”的词。上下文或可使人联想到天上的宫殿或圣殿，但正文不预先判定其神学身份。
- issue: 比较所表达的范围
  choice: 更宏大
  alternative: 更大
  rationale: 原词既可涉及大小，也可带有卓越、威严之意；“宏大”保留这层张力，不把比较仅限于物理尺寸。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留启示文学的异象语气；句式略有分拆，以免多个并列成分造成汉语拖沓，同时维持原文的观察次序。
