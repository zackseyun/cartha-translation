base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/017.yaml
  text: And its floor was of fire[a], and above it were lightnings and the path of the stars[b], and its ceiling was blazing fire.
translation:
  language: zh_hans
  text: 它的地面是火焰；在它上方，有闪电和众星运行的轨道[a]；它的顶棚[b]是熊熊燃烧的火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众星运行的轨道”也可译作“众星的路径”或“众星的行程”，指众星在天上有秩序的运行。
    reason: lexical_alternative
  - marker: b
    text: “顶棚”也可译作“屋顶”；若更侧重宇宙图景，也可能理解为“穹顶”或“穹苍”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ምድሩሰ
  choice: 它的地面
  rationale: 该词本义为“地、地面”；在天上殿宇的建筑语境中译作“地面”，既自然，也不额外限定为铺砌的地板或根基。
- source_word: ዘእሳት
  choice: 是火焰
  rationale: 保留属格结构所表达的火之质料意象；中文用“是火焰”简洁而有力度。
- source_word: መልዕልቴሁ
  choice: 在它上方
  rationale: 准确表达空间上的“在其上、在其上方”，并承接异象中的方位描写。
- source_word: መበርቅት
  choice: 闪电
  rationale: 此复数概念在现代汉语中通常以集合名词“闪电”表达，无须生硬标出复数。
- source_word: ምርዋፀ ከዋክብት
  choice: 众星运行的轨道
  rationale: ምርዋፀ 可指路径、行程或运行轨迹；“运行的轨道”既呈现星体有序移动，也保留可理解为空间路径的意象。
- source_word: ጠፈሩኒ
  choice: 它的顶棚
  rationale: 在室内建筑图景中，“顶棚”比“苍穹”更贴切，同时以脚注保留“屋顶”或宇宙穹顶的可能。
- source_word: እሳት ዘይነድድ
  choice: 熊熊燃烧的火
  rationale: 原文直义为“燃烧的火”；此译保留重复的火焰意象，并以自然现代汉语传达其炽烈程度。
theological_decisions:
- issue: 天上建筑意象与宇宙意象之间的张力
  choice: 主体采用建筑用语“地面、顶棚”，同时保留“闪电、众星运行的轨道”等宇宙现象。
  alternative: 将ጠፈር译为“苍穹”或“穹苍”，使整句更偏向宇宙结构；或译作“屋顶”，使图景更偏向具体建筑。
  rationale: 原文将天上殿宇与宇宙现象交织在一起；译文不应把异象单一化为普通建筑或纯粹宇宙景观。
translation_notes:
  register: 采用现代、庄重而清晰的普通话；句式保持异象描写的并列节奏，以分号区分地面、上方和顶棚三层空间。
