base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/002.yaml
  text: I saw in my sleep what I now speak with a tongue of flesh and with my spirit[a], which the Great One has given to men as a mouth[c][b], so that they might speak with it and understand in the heart.
translation:
  language: zh_hans
  text: 我在睡梦中所看见的，如今用血肉的舌头和我的气息[a]说出来。这气息是至大者赐给世人作为口的[b]，使他们可以借此说话，并在心中领悟[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”也可译作“灵”；原词兼有这两种含义。这里提到舌头和说话，因此正文采用“气息”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“至大者赐给世人作为口的”，措辞较为生硬。也有人把整句理解为至大者赐给世人说话的能力；但现存吉兹文本明确有“口”一词。
    reason: textual_and_syntactic_note
  - marker: c
    text: 这里的“心”是人内在思考和理解的所在，不只是情感。
    reason: cultural_note
lexical_decisions:
- source_word: ርኢኩ በንዋምየ
  choice: 我在睡梦中看见了
  rationale: 保留看见异象的陈述，也不把 ንዋም 过度限定为梦的内容；“睡梦中”自然涵盖睡眠与梦境状态。
- source_word: ይእዜ እነግር
  choice: 如今……讲述出来
  rationale: 表达从先前所见转到当下叙述的关系；“讲述”比单纯“说”更符合复述异象的语境。
- source_word: በልሳን ዘሥጋ
  choice: 用血肉的舌头
  rationale: 较形式地保留原文鲜明的人体意象及启示文学语感。
- source_word: ወበመንፈስየ
  choice: 和我的气息
  rationale: መንፈስ 可指气息或灵；此处与舌头、说话并列，“气息”较贴合发声语境，同时以脚注保留“灵”的可能。
- source_word: ዓቢይ
  choice: 至大者
  rationale: 保留原文的神圣称号，不直接改写为“上帝”，并维持庄重的启示文学语域。
- source_word: ዘወሀበ ዓቢይ አፈ ለሰብእ
  choice: 这气息是至大者赐给世人作为口的
  rationale: 明确译出容易遗漏的 አፈ“口”，并依现存吉兹语法将其理解为“赐给世人作为口”；原文措辞生硬，脚注说明句法问题。
- source_word: ይትናገሩ ቦቱ
  choice: 使他们可以借此说话
  rationale: 将其表达为目的或结果，并用“借此”对应工具性关系。
- source_word: ወይለብዉ በልብ
  choice: 并在心里领悟
  rationale: 保留古代“心”作为内在理解中心的观念，不将其缩减为情绪。
theological_decisions:
- issue: መንፈስ 在本节人体与言语语境中的含义
  choice: 气息
  alternative: 灵
  rationale: 与“血肉的舌头”和“说话”相连时，“气息”较符合发声所凭借的生命气息；但该词确可指“灵”，故不在正文中消除其歧义，而以脚注保留。
- issue: 神圣称号 ዓቢይ 的译法
  choice: 至大者
  alternative: 伟大者；上帝
  rationale: “至大者”自然而庄重，也保留称号本身，不用较笼统的神名替代。
- issue: 关系从句 ዘወሀበ ዓቢይ አፈ ለሰብእ 的依附与“口”的功能
  choice: 把“这气息”作为关系从句的先行成分，并明确译出“作为口”
  alternative: 将关系从句较宽泛地理解为至大者赐给世人的言语能力；或省略“口”
  rationale: 现存吉兹文本明确有 አፈ“口”，不可无声省略；但句法和意象不同寻常，因此正文保留其张力，脚注提示另一种较宽泛理解。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“血肉的舌头”“至大者”“在心里领悟”保留启示文学的古老意象；对现存吉兹文本中不寻常的“赐给世人作为口”不作顺滑化删改，而以正文与脚注共同保存其句法张力。
