base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/008.yaml
  text: 'And a vision showed me thus: behold[a], in the vision the clouds were calling me, and the mist was calling me; and the course of the stars and the lightnings were driving me and urging me on, and in the vision the winds were making me fly, and carrying me off[c][b], and lifting me upward into heaven.'
translation:
  language: zh_hans
  text: 异象这样展示给我[a]：看哪，在异象中，云彩呼唤我，雾气也呼唤我；星辰的运行[b]和闪电驱策我，催我前行；在异象中，诸风[c]使我飞起来，把我卷走，又将我向上举入天上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“异象如此向我显现。”原句的使役结构直译较为紧凑；此译法更顺畅，但会弱化“给我看”的使役意味。
    reason: 原句的使役结构直译较为紧凑；此译法更顺畅，但会弱化“给我看”的使役意味。
  - marker: b
    text: 或译：“星辰的奔行”或“星辰的轨道”；原文着重描绘星辰的运动，而不是静止的星辰。
    reason: 相关名词兼有奔跑、运行或路径方面的含义，宜保留词义范围。
  - marker: c
    text: “诸风”也可译作“诸灵”；但紧接云彩、雾气和闪电的语境较支持“风”。
    reason: 该词可指风或灵；正文按局部语境取气象义，同时在脚注保存另一种可能。
lexical_decisions:
- source_word: ራእይ
  choice: 异象
  rationale: 在启示文学语境中，“异象”是自然且准确的常用译法；原文两次出现，译文也保持重复，以保留整节的异象框架。
- source_word: አስተአርአየኒ
  choice: 显给我看
  rationale: 该词是“看”的使役形式；“显给我看”既保留“使我看见／给我看”的视觉与启示意味，也避免单译为“显现”而淡化使役关系。
- source_word: ደመናት
  choice: 云彩
  rationale: 采用基本义，不额外强化为“暴风云”；“云彩”在现代汉语中庄重而易懂。
- source_word: ይጼውዑኒ / ይጼውዐኒ
  choice: 呼唤我
  rationale: 原文对云彩和雾气重复同一动词；译文保留两次“呼唤我”，呈现反复的召唤声势，而不把它过度解释为正式命令。
- source_word: ጊሜ
  choice: 雾气
  rationale: 该词在此指雾或云雾，且原文为单数；汉语集合名词“雾气”自然地保留这一意象。
- source_word: ሩጸተ ከዋክብት
  choice: 星辰的运行
  rationale: 名词带有奔跑、运动或行程之意；“运行”保留星辰动态移动的图景，同时符合现代汉语对天体运动的表达。
- source_word: መበርቅት
  choice: 闪电
  rationale: 汉语“闪电”本身可统称多次或多道电光，无须勉强标出复数，也能与星辰形成并列的宇宙力量。
- source_word: ይንጐዑኒ
  choice: 驱策我
  rationale: 表达强力推动之意；“驱策”比普通的“推动”更能呈现异象中压倒性的动势，又不过分具体化。
- source_word: ወተያድህቁኒ
  choice: 催我前行
  rationale: 与“驱策我”连用，保留第二个推进动词的加强作用，并避免两个近义动词在汉语中显得机械重复。
- source_word: ነፋሳት
  choice: 诸风
  rationale: 上下文依次出现云彩、雾气、星辰和闪电，因此采用气象义“风”；“诸”也反映原文复数，并维持庄重语体。
- source_word: ያበርሩኒ
  choice: 使我飞起来
  rationale: 明确保留使役与飞行含义，不将其弱化为一般性的运送。
- source_word: ያንጉጹኒ
  choice: 把我卷走
  rationale: 表现被强力带离的动作；在风的语境中“卷走”生动自然，但未加入原文没有的目的地。
- source_word: ላዕለ ውስተ ሰማይ
  choice: 向上举入天上
  rationale: “向上”对应上升方向，“举入天上”对应进入天界，尽量保留原文两个方向性成分及全节的高潮。
theological_decisions:
- issue: ነፋሳት应译为“风”还是“灵”
  choice: 诸风
  alternative: 诸灵
  rationale: 本节集中描写云彩、雾气、星辰和闪电等气象与宇宙力量，“风”最贴合直接语境；脚注保留“灵”的可能，以免消除该词本有的语义张力，也不额外引入人格化或天使论解释。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。保留“呼唤我”的重复和一连串推进、飞升动词，以呈现原文累积的节奏与异象张力；“看哪”保留启示文学中的突显语气。
