base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/001.yaml
  text: This is the book of the words of righteousness and of the reproof of the vigilant ones who are from eternity[c][b][a], just as the Holy and Great One commanded in that vision.
translation:
  language: zh_hans
  text: 这是一部公义之言，以及对那些自永世而来的警醒者[a][b]的责备之书，正如[c]那位圣洁而伟大者在那异象中所吩咐的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“守望者”；吉兹语原词指警醒、守望者。
    reason: lexical_alternative
  - marker: b
    text: “自永世而来”也可理解为“来自远古”或“自古以来”，侧重其古远的起源，而不一定表示绝对永恒。
    reason: lexical_alternative
  - marker: c
    text: 或译“如同”。
    reason: translation_alternative
lexical_decisions:
- source_word: መጽሐፈ
  choice: 书
  rationale: 该词直接指书卷或书面文献；本节具有标题性质，译作“书”自然且庄重。
- source_word: ቃለ ጽድቅ
  choice: 义言
  rationale: ቃል虽为单数形式，却可作集合意义；“义言”简洁保留“言语”与“义”的伦理和神学分量。
- source_word: ዘለፋ
  choice: 斥责
  rationale: 该词表示责备、谴责；“斥责”既保留正式警戒语气，也符合现代汉语。
- source_word: ትጉሃን
  choice: 警醒者
  rationale: 该词本义为醒着、警觉或守望的人；“警醒者”贴近吉兹语表层意义，同时由脚注注明传统技术性译名“守望者”。
- source_word: እለ እምዓለም
  choice: 那些源自永世的
  rationale: 该短语可指来自永世，也可表示自古以来；正文保留高远而未完全界定的时间含义，脚注说明古远起源的可能解释。
- source_word: አዘዘ
  choice: 吩咐
  rationale: 该动词明确表示命令；“吩咐”在神圣启示语境中自然庄重，又不削弱权威性。
- source_word: ቅዱስ ወዓቢይ
  choice: 那位圣洁而伟大者
  rationale: 两个形容词共同构成神圣称号；补出“那位……者”使现代汉语通顺，并保留称号的整体性。
- source_word: በይእቲ ራእይ
  choice: 在那异象中
  rationale: 介词既可能带处所意味，也可能带工具意味；“在那异象中”较少解释性，并适合启示叙事框架。
- source_word: በከመ
  choice: 正如
  rationale: 该连词表示“如同、照着”；“正如”在现代汉语中自然，并保留比较或依循的语气。
theological_decisions:
- issue: ትጉሃን所指对象的身份
  choice: 译作“警醒者”，按上下文指《守望者之书》中的天上存在。
  alternative: 守望者；醒着的人；警觉者
  rationale: 本书局部语境强烈支持这是特定的天上群体，而非泛指勤勉的人；正文贴近词面，脚注保留传统技术性名称。
- issue: እለ እምዓለም的时间含义
  choice: 译作“源自永世”，不进一步断定这些存在具有绝对永恒性。
  alternative: 自古以来；来自远古；永恒的
  rationale: 原短语可强调永世，也可强调极其古远的起源；译文与脚注共同保留这种本体论和时间上的张力。
- issue: ቅዱስ ወዓቢይ的称号结构
  choice: 将两项合译为同一位的称号：“那位圣洁而伟大者”。
  alternative: 圣者和伟大者；圣洁者、伟大者
  rationale: 语法和语境较自然地指向同一神圣主体；合译不额外引入特定宗派称谓。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语，并保留本节作为启示文学题记的凝练感。“义言”“警醒者”“异象”等用语维持经文语域，但避免不必要的古奥句法。
