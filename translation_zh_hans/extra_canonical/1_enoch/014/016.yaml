base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/016.yaml
  text: And in every respect it excelled in splendor and glory and greatness[d][c][b][a], so that I am unable to tell you about its splendor and about its greatness.
translation:
  language: zh_hans
  text: 它在光辉、荣耀和伟大上都卓越非凡[a]，以致我无法向你们述说它的光辉和伟大。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卓越非凡”也可译作“极其丰盛”或“满溢出来”；这里的动词强调卓越或丰盛到非同寻常的程度。
    reason: lexical_alternative
  - marker: b
    text: “它的”很可能指异象中眼前的天上建筑，但也可能含蓄地包括其中神圣临在的荣光；原文没有明确说明所指。
    reason: alternative_reading
lexical_decisions:
- source_word: በኵሉ
  choice: 在各方面
  rationale: 该短语表示“在一切方面、在各方面”，而非空间意义上的“在四周”。
- source_word: ይፈደፍድ
  choice: 超乎一切
  rationale: 重叠动词在此表达卓越、超越或极其丰盛；结合异象语境，译为“超乎一切”既保留强烈程度，也与“在各方面”自然衔接。
- source_word: በስብሐት
  choice: 以光辉
  rationale: 在宝座异象中指显现出来的灿烂光华，而非口头的赞美；“光辉”也可与后面的“荣耀”区分。
- source_word: በክብር
  choice: 荣耀
  rationale: 保留其尊荣、威荣与显赫的核心意义，并避免与“光辉”合并。
- source_word: በዕበይ
  choice: 伟大
  rationale: 对应宏大、崇高或伟大，并保留末句同词复现的结构。
- source_word: እስከ ኢይክል
  choice: 以致我无法
  rationale: 该结构表示程度所导致的结果；依据现有校勘判断，动词为第一人称“我无法”，不是“你们的眼睛不能”。
- source_word: ዜንዎተክሙ
  choice: 向你们述说
  rationale: 按句法及希腊文旁证理解为“向你们详述/说尽”；“述说”适合庄重的异象叙事，同时保留不能充分表达之意。
- source_word: በእንተ ስብሐቲሁ ወበእንተ ዕበዩ
  choice: 它的光辉和伟大
  rationale: 第三人称后缀保持为“它的”，不把所指明确改成神或天上的建筑，以保留原文指涉上的开放性。
theological_decisions:
- issue: “它的光辉和伟大”中第三人称后缀的所指
  choice: 正文保留未明确指称的“它”
  alternative: 明确译为天上建筑的光辉和伟大，或神临在的光辉和伟大
  rationale: 原文仅使用第三人称后缀，没有重述先行词；上下文可能指眼前的天上建筑，也可能使建筑的荣光与神圣临在的荣光彼此交叠，因此不在正文中作教义化限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“光辉、荣耀和伟大”分别对应三个并列词，并在后半句复现“光辉”和“伟大”。保留第二人称复数“你们”，避免将原文改写成单数听者。
