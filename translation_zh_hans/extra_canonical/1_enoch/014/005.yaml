base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/005.yaml
  text: And from now on you shall not ascend into heaven for all eternity[b][a], and on the earth it has been declared that you shall be bound for all the days of eternity.
translation:
  language: zh_hans
  text: 从今以后，你们不得升入天上，直到永世[a]；在地上已经宣告[b]：你们必被捆绑，在永世的一切日子里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文用两个彼此重叠、措辞却不同的期限表达：一处用于禁止升天，另一处用于被捆绑的判决。译文保留这种区别，没有都合并成同一个“永远”。
    reason: lexical_alternative
  - marker: b
    text: “已经宣告”在原文中没有明说宣告者；上下文暗示这是来自属天权威的司法判决。
    reason: cultural_note
lexical_decisions:
- source_word: እምይእዜ
  choice: 从今以后
  rationale: 准确表达判决自此生效的时间起点，现代汉语自然且保留庄严语气。
- source_word: ኢትዓርጉ
  choice: 你们不得升入
  rationale: 在审判宣告中兼具禁止与确定结果的意味；“不得”比单纯命令更能体现司法判语。
- source_word: ውስተ ሰማይ
  choice: 升入天上
  rationale: 上下文形成天上与地上的宇宙性对照，不宜弱化为普通的天空。
- source_word: እስከ ኵሉ ዓለም
  choice: 永远
  rationale: 以自然简洁的现代汉语表达无限延续的期限；并由脚注说明原文两处期限公式并不相同。
- source_word: ወውስተ ምድር ተነግረ
  choice: 在地上已经宣告
  rationale: 保留原文被动式所隐去的宣告者，不擅自补出神或其他权威主体。
- source_word: ይእስርክሙ
  choice: 你们必被捆绑
  rationale: 保留守望者受审叙事中的具体捆绑意象，不将其解释性地改写为监禁或囚禁。
- source_word: በኵሉ መዋዕለ ዓለም
  choice: 直到永世的所有日子
  rationale: 较为直译地保留“所有日子”的反复和司法宣判的节奏，并与前一期限公式作出措辞区分。
theological_decisions:
- issue: 应将刑罚概括为囚禁，还是保留启示文学中的具体意象
  choice: 你们必被捆绑
  alternative: 你们必被囚禁／拘禁
  rationale: 原文使用捆绑这一具体刑罚意象；保留它可避免把文本自身的象征图景抽象化。
- issue: 是否明确补出宣告审判的主体
  choice: 保留无主被动表达“已经宣告”
  alternative: 神已经宣告／天上已经下令
  rationale: 原文没有明说施事者；虽然语境暗示属天的审判权威，译文仍应保留这一含蓄性。
translation_notes:
  register: 采用庄严而清楚的现代标准汉语。“不得”“必被”体现审判宣告的力度；分号划分两项相连的判决。脚注标记均置于所解释的短语之后。
