base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/011.yaml
  text: Its ceiling was like the path of the stars and the lightnings[a], and among them were fiery cherubim[c][b], and their heaven was water.
translation:
  language: zh_hans
  text: 它的顶棚如同众星运行的轨迹和闪电[a]；其间有火焰般的基路伯，它们的天是水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众星运行的轨迹”也可译作“众星的行程”或较直译的“众星的奔行”；“闪电”也可理解为一道道闪光。
    reason: lexical_alternative
  - marker: b
    text: “它们的天是水”原文含义艰深。“它们”可能指火焰般的基路伯，也可能与前述天象有关；这句话也可能指异象建筑上方那片如水的天域。译文保留原文的所属形式和突兀意象。
    reason: alternative_reading
lexical_decisions:
- source_word: ጠፈሩ
  choice: 它的顶棚
  rationale: 指异象中建筑物上方的覆盖部分；“顶棚”既符合建筑语境，也不把意象过早宇宙化为“穹苍”。
- source_word: ሩጸተ
  choice: 运行的轨迹
  rationale: 该词含奔行、运行或行程之意；与众星连用时，“运行的轨迹”自然地保留动态和可见路径两层含义。
- source_word: ከዋክብት
  choice: 众星
  rationale: 准确表达复数星体，并符合庄重的异象叙述语体。
- source_word: መበርቅት
  choice: 闪电
  rationale: 指闪电或其闪光；现代汉语通常以集合性的“闪电”表达，不必生硬标出复数。
- source_word: ማእከሎሙ
  choice: 其间
  rationale: 保留基路伯位于前述星辰轨迹与闪电之中的空间关系，同时使中文简洁自然。
- source_word: ኪሩቤን
  choice: 基路伯
  rationale: 采用现代中文圣经传统中辨识度高的音译，保留这类天上活物的专名性质。
- source_word: ዘእሳት
  choice: 火焰般的
  rationale: 属格结构直指火；译为“火焰般的”保留其火性形象，又不武断断定基路伯由火构成。
- source_word: ሰማዮሙ
  choice: 它们的天
  rationale: 保留原文不寻常的复数所属形式，不擅自改成“它们上方的天”或消除所指含混。
- source_word: ማይ
  choice: 水
  rationale: 按原文直译为物质名词“水”，不增补“众水”或“如水”，以保留异象的突兀表达。
theological_decisions:
- issue: ሰማዮሙ 的所属对象及“天是水”这一异象如何理解
  choice: 它们的天是水
  alternative: 它们上方的天是水；那天空如水一般
  rationale: 原文具有明确的所属形式，却未无歧义地交代先行对象；直译既保留语法上的奇异，也不把“是水”弱化为比喻性的“如水”。
- issue: 火与基路伯的关系
  choice: 火焰般的基路伯
  alternative: 火的基路伯；由火构成的基路伯
  rationale: ዘእሳት 可表示与火相关的性质，但仅凭本句不宜断定其本体由火构成；采用描述性译法保留开放性。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙述语体。以分号呈现原句两个主要图景；保留“它们的天是水”的陌生感，不作教义化解释。所有脚注标记均置于正文对应位置。
