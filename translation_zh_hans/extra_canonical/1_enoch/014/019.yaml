  text: And from beneath the throne came forth[a][b].
translation:
  language: zh_hans
  text: 又从宝座下面出来了[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语本节是一个很短的分句，没有明说从宝座下面出来的是什么；下文接续说明这一异象。这里保留原文未尽的表达，不补出具体事物。
    reason: lexical_alternative
  - marker: b
    text: 或译：“又从他的宝座下面出来了。”词尾-u既可理解为回指前文宝座的定指标记，也可按第三人称阳性单数所有格理解。
    reason: previous_rendering
lexical_decisions:
- source_word: እምታሕተ
  choice: 从……下面
  rationale: 该介词形式兼有离格“从”和空间方位“下面、底下”之意；“从……下面”自然地保留了异象中的空间图景。
- source_word: መንበሩ
  choice: 宝座
  rationale: መንበር可指座位或宝座；在天上宝座的异象语境中译作“宝座”最贴切。词尾-u在此可作回指前文已提及之宝座的定指用法，因此正文不译为所有格。
- source_word: ይወፅእ
  choice: 出来了
  rationale: 该动词意为出去、出来。现代汉语“出来了”简洁自然，并允许主语或出来之物保持省略，符合原句的未完足表达。
theological_decisions:
- issue: መንበሩ词尾-u是定指还是第三人称阳性单数所有格
  choice: 正文译为“宝座”，将-u理解为回指前文宝座的定指标记
  alternative: 译为“他的宝座”
  rationale: 古典吉兹语第三人称阳性单数词尾可承担定指、回指功能；而本节之前已经提到高大的宝座，宝座上的那一位到后文才进一步显明。正文采用“宝座”可避免过早明确所有者，同时在脚注保留所有格分析。
- issue: 从宝座下出来之物未明说
  choice: 不在正文补出主语或宾语
  alternative: 按下文意象补出具体事物
  rationale: 吉兹语本节是极短的分句，没有明说出来的是什么；保留省略可维持原文的悬念与异象推进。
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“又”承接前文；汉语可自然省略主语，因此“从宝座下面出来了”既忠实保留原句的开放性，也不显得生硬。
