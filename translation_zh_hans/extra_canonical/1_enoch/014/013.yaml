base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/013.yaml
  text: And I went into that house[a], and it was hot like fire and cold like ice, and there was no delight of life within it; fear covered me, and trembling seized me.
translation:
  language: zh_hans
  text: 我进了那座房屋；里面热如火，冷如冰，毫无生命的愉悦[a]。恐惧笼罩着我，战栗攫住了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命的愉悦”所据的吉兹语短语含义不易确定；也可能指其中没有使生命舒畅的美好，或更广泛地说，那里毫无活着的安适。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወቦእኩ
  choice: 我进入
  rationale: 直译第一人称单数的进入动作，简洁自然，也保留异象中空间推进的感觉。
- source_word: ውእቱ ቤት
  choice: 那座殿
  rationale: 指示词回指前文所见建筑；在宝座异象语境中，“殿”比日常的“房子”庄重且自然，但脚注保留“房屋”的可能。
- source_word: ምውቅ
  choice: 热
  rationale: 以基本形容词配合“如火”，避免重复强化，并保留原文简明的对举。
- source_word: ቈሪር
  choice: 冷
  rationale: 与“热”构成清楚对举，并由“如冰”加强其程度。
- source_word: በረድ
  choice: 冰
  rationale: 该词也可涉及冰雹，但在冷热两极的比喻中，“冰”最贴切。
- source_word: ወኢምንተ ፍግዐ ሕይወት አልቦቱ ውስቴቱ
  choice: 其中毫无生命的愉悦
  rationale: 原短语语义困难；此译保留“生命”与“愉悦”的异常结合，不将其简化为“没有生命”或“毫无舒适”。
- source_word: ፍርሃት ከደነኒ
  choice: 恐惧笼罩着我
  rationale: 保留动词“覆盖、包围”的具体意象，而不只译作抽象的“使我不胜恐惧”。
- source_word: ወረዓድ አኃዘኒ
  choice: 战栗攫住了我
  rationale: 同时保留身体颤抖和“抓住、控制”的强烈动态意象。
theological_decisions:
- issue: 殿内所缺之物的困难短语应如何表达
  choice: 其中毫无生命的愉悦
  alternative: 其中毫无生活的乐趣；其中没有任何有生命之物；其中毫无使生命舒畅之物
  rationale: 该短语似乎否定一种与生命相关、使人愉悦或舒畅的性质，却不宜武断地解释为单纯“没有生命”。异象本身兼具炽热、严寒与畏惧，保留这种陌生而紧张的措辞更符合原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“热如火，冷如冰”保存简洁、悖论式的异象意象；末句以“笼罩、攫住”保留原文强烈的身体感。
