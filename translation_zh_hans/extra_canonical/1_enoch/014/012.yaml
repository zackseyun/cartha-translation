  text: and a fire was burning all around the walls[d][c][b][a], and beneath them was a blaze of fire.
translation:
  language: zh_hans
  text: 墙的四围有火燃烧，其下[a]烈火熊熊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有校勘将这里的吉兹语读作“它的门”，并有希腊语文本支持，可译为：“它的门都在火中燃烧。”
    reason: textual_variant
lexical_decisions:
- source_word: እሳት
  choice: 火／烈火
  rationale: 该词在本节重复出现；首处译作“火”，末处依汉语表达译作“烈火”，既保留重复的火焰意象，也使句子自然有力。
- source_word: ዘይነድድ
  choice: 燃烧
  rationale: 这是修饰“火”的动词形式，表达异象中持续燃烧的状态。
- source_word: በአውደ
  choice: 四围
  rationale: 准确表达环绕四周的空间关系，同时符合庄重而自然的现代汉语。
- source_word: አረፍት
  choice: 墙
  rationale: 按吉兹语词形及本章近邻语境理解为“墙”，不采用早先将其弱化为代词“它”的处理。
- source_word: ጥሕቱ
  choice: 其下
  rationale: 依所给吉兹语文本保留“在其下面”的空间意义；“其”不强行限定所指是墙体本身还是前文整座建筑。
- source_word: ይውዒ በእሳት
  choice: 烈火熊熊
  rationale: 传达火正在炽烈燃烧的动态景象，避免生硬重复“以火燃烧”。
theological_decisions:
- issue: 火所环绕的对象是否应笼统译为建筑物
  choice: 明确译作“墙”
  alternative: 译作“它”或“那建筑物”
  rationale: 吉兹语አረፍት在此具体指墙；明确翻译并非增加建筑细节，而是恢复原文词义。
- issue: 后半句应按抄本文本译为“其下烈火熊熊”，还是据校勘译为“门在火中燃烧”
  choice: 正文依所给吉兹语文本译作“其下烈火熊熊”，并以脚注交代异文
  alternative: 门都在火中燃烧
  rationale: 所给底本文字为ወጥሕቱ，支持“其下”；但希腊语见证及一种吉兹语校勘支持“门”，故不应悄然消除文本张力。
translation_notes:
  register: 采用简洁、庄重的异象叙述。“四围”保留经卷语感但仍属现代汉语；“烈火熊熊”增强画面感而不添加原文没有的神学解释。
