base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/010.yaml
  text: And I went into the tongue of fire[a], and I drew near to a great house built of hailstones; and the roof of that house was like a mosaic of hailstones[c][b], and its floor was hail.
translation:
  language: zh_hans
  text: 我走进火舌之中[a]，又走近一座用冰雹石建成的大屋；那屋的结构表面[b]仿佛是由冰雹石铺砌的镶嵌图案[c]，地面则是冰雹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火舌”也可理解为舌状的火焰；这里保留原文“舌头”的具体比喻。
    reason: lexical_note
  - marker: b
    text: 此处所指的建筑部位在所据文本中不确定；可指屋顶、天花板、墙面，或房屋的其他结构表面。
    reason: textual_variant
  - marker: c
    text: 这里描写的是石板铺砌或镶嵌而成的图案，并不一定是现代所说的玻璃马赛克。
    reason: cultural_note
lexical_decisions:
- source_word: ልሳነ እሳት
  choice: 火舌
  rationale: ልሳን 的本义是“舌头”；“火舌”既保留异象中具体而奇特的形象，也能让现代汉语读者自然联想到舌状火焰。
- source_word: ቤት ዓቢይ
  choice: 一座大屋
  rationale: ቤት 泛指房屋，ዓቢይ 表示大；不擅自具体化为殿、宫或圣殿。
- source_word: ዘኅኑጽ በእእባነ በረድ
  choice: 用冰雹石建成
  rationale: 保留原文“冰雹之石”的惊异物质意象；“冰雹石”比单说“冰块”更贴近 እእባን 与 በረድ 的组合。
- source_word: አረፍተ ውእቱ ቤት
  choice: 那屋的顶部
  rationale: 该词形及其建筑部位所指存在文本和词义困难；依当前校订层采用上部覆盖结构，但用较宽泛的“顶部”避免过度断定为屋顶外面或室内天花板。
- source_word: ከመ ጸፍጸፈ ሳሌዳት
  choice: 仿佛……铺成的镶嵌图案
  rationale: 表达石板排列、铺砌或镶嵌所形成的图案，不把所比较的构件误说成现代意义上的“马赛克地板”。
- source_word: በእእባን ዘእምበረድ
  choice: 用冰雹石
  rationale: 与前面的建材意象保持一致，不弱化为“冰晶”或“晶石”。
- source_word: ምድረ በረድ
  choice: 地面则是冰雹
  rationale: 在屋内语境中，ምድር 译为“地面”自然；保留谓语“是冰雹”的突兀异象感，不改写为较常规的“冰铺地面”。
theological_decisions:
- issue: 是否将异象中的建筑规范化为圣殿或宫殿
  choice: 保留“大屋”及冰雹石建筑的奇异描写
  alternative: 按更广语境译作“圣殿”“殿宇”或“宫殿”
  rationale: 本节自身只称其为“大屋”，不要求加入具有特定宗教含义的建筑名称；保留原文张力可避免引入宗派性或后设解释。
- issue: 如何处理房屋上部构件的词义不确定性
  choice: 正文译作“顶部”，并以脚注说明也可能理解为墙面等结构表面
  alternative: 明确译作“屋顶”“天花板”或“墙壁”
  rationale: 源词在所据文本中的形态和建筑所指并不稳固；采用较宽泛表达，并公开保留其他可能，避免静默消除歧义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。以“我走进……又走近……”维持异象行进的节奏；保留“火舌”“冰雹石”“地面则是冰雹”等陌生意象，不将其合理化为普通冰建筑。正文对疑难建筑术语采用较宽泛的“顶部”，脚注明示歧义。
