base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/004.yaml
  text: 'I wrote down your petition[a], and in my vision it was shown thus: that your petition will not be granted to you for all the days of eternity, and the sentence against you has been completed[c][b], and it will not be granted to you.'
translation:
  language: zh_hans
  text: 我把你们的请求写了下来；在我所见的异象中，显明了这样的话：你们的请求永世都不会蒙准[a]；针对你们的判决已经定案[b]，你们的请求不会蒙准。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永世”直译近于“永恒（或世代）的一切日子”，是强调无尽延续的说法。
    reason: lexical_alternative
  - marker: b
    text: “针对你们的判决已经定案”也可译作“审判已经在你们身上完成”。这里表达的是针对守望者的裁决已经确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ስእለትክሙ
  choice: 你们的请求
  rationale: 该词指向上位者提出的恳求或请求；“请求”在现代汉语中自然清楚，也保留此处申诉的正式语气。
- source_word: ጻሐፍኩ
  choice: 我把……写了下来
  rationale: 直译为“我写了”；“写了下来”明确表达记录请求的动作，并未增添原文内容。
- source_word: በራእየየ
  choice: 在异象中
  rationale: 该形式表示异象性的看见；此译保留启示文学语境，又符合现代汉语表达。
- source_word: ያስተርኢ
  choice: 有这样的启示
  rationale: 原句采用非明确施事者的显明或展示表达；“有这样的启示”保持施事者未明，不强行补出主语。
- source_word: ኢትከውነክሙ
  choice: 不会蒙准
  rationale: 字面较接近“不会为你们成就”；上下文所指是守望者的请求被拒，“蒙准”简洁地传达司法性的否决。
- source_word: መዋዕለ ዓለም
  choice: 永世
  rationale: 该短语字面为“永恒／世代的一切日子”，是强调无尽延续的公式；正文以“永世”自然表达，字面形态在脚注说明。
- source_word: ፍጽምት
  choice: 判决已经定下
  rationale: 该词具有完成、确定的语义；在审判语境中译作“判决已经定下”，既表达最终确定，也避免生硬的“判决已经完成”。
- source_word: ላዕሌክሙ
  choice: 对你们
  rationale: 字面为“在你们之上”，在司法语境中表示针对你们；“对你们的判决”是自然且准确的汉语。
- source_word: ወኢይከውነ ክሙ
  choice: 你们的请求不会蒙准
  rationale: 末句重复先前的拒绝；补明“你们的请求”使中文所指清楚，同时保留原文强调性的重复。
theological_decisions:
- issue: 如何表达守望者请求遭拒
  choice: 你们的请求不会蒙准
  alternative: 你们的祷告不会被垂听／这事不会为你们成就
  rationale: 上下文呈现的是对申诉的司法性拒绝。“蒙准”保留裁决意味，且不引入“祷告未被垂听”这一更具特定宗教惯用色彩的表述。
- issue: 判决条款中完成性词语的意义
  choice: 对你们的判决已经定下
  alternative: 审判已经在你们身上完成／你们的结局已经来到
  rationale: 此处指针对守望者的裁决已成为定案，而非泛指宇宙终局。“定下”自然表达其确定与不可逆性，同时保留审判语境。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留原文启示文学的司法语气及末尾重复。鉴于所给吉兹语转写中的“ወአነኒ”很可能是OCR讹误，依校勘说明及与希腊语 κρίσις 相符的读法，将该处处理为“判决”；不以脚注展开技术性OCR问题，以免干扰普通读者。
