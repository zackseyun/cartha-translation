base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/051/001.yaml
  text: And in those days the earth will give back from its womb[c][b][a], and Sheol will give back what it has received, .
translation:
  language: zh_hans
  text: '在那些日子，大地要交还其腹中所藏的[a]，阴间[b]要交还它所领受的，灭亡之境[c]要交还它所欠的。那位蒙拣选者要从他们中间拣选义人和圣者，因为他们得救的日子已经临近。


    在那些日子，那位蒙拣选者要坐在他的宝座上；智慧的一切奥秘都要从他口所出的谋略中显明，因为万灵之主已把这些奥秘赐给他，并使他得荣耀。


    在那些日子，群山要像公绵羊一样欢跃，丘陵要像吃饱奶的羊羔一样跳跃；他们全都要成为天上的天使。他们的脸要因喜乐而发光，因为在那些日子，那位蒙拣选者已经兴起；大地要欢喜，义人要居住其上，蒙拣选的人要在其中行走往来。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “腹中所藏的”也可理解为“受托保管的东西”。原词的形式和上下文可使人联想到大地腹中存留死者，也可突出受托保管、最终交还的意象。
    reason: lexical_ambiguity
  - marker: b
    text: “阴间”指古代犹太观念中亡者所在的领域，不宜径直等同于后世所说的地狱。
    reason: cultural_note
  - marker: c
    text: “灭亡之境”所译的词也可译作“毁灭”或“失丧之地”；这里与大地和阴间并列，并被拟人化为需要交还所欠之物的一方。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留启示文学中反复出现的时间公式及其庄严节奏。
- source_word: ታገብእ / ያገብእ
  choice: 要交还
  rationale: 上下文把大地、阴间和灭亡之境描写为暂时保有所交付之物者；“交还”也保留三个平行分句的复沓。
- source_word: ማሕፀንታ
  choice: 腹中所藏的
  rationale: 正文保留“腹中”的具体意象，同时用“所藏的”表达其中存留并将被交还之物；脚注说明“腹中”与“受托保管之物”之间的词义辨析。
- source_word: ሲኦል
  choice: 阴间
  rationale: “阴间”是现代中文对古代亡者领域较自然的称呼；脚注防止读者将其直接等同于后世的地狱观念。
- source_word: ሀጕል
  choice: 灭亡之境
  rationale: 该词与大地、阴间平行，语境中近于“灭亡”或“毁灭之地”；采用“灭亡之境”以保留其拟人化领域的性质。
- source_word: ኅሩይ
  choice: 那位蒙拣选者
  rationale: 以称号形式译出“被拣选者”，不预先断定其更具体的身份。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 既保留“诸灵之主”的称号结构，又以自然而庄重的现代中文表达其统辖性。
- source_word: ኵሎ ኅሊናተ ጥበብ
  choice: 智慧的一切奥秘
  rationale: 相关名词可指思想、意念、谋略或隐秘内容；在从口中涌流的智慧语境中，“奥秘”较通顺，但不将其缩减为一般知识。
theological_decisions:
- issue: 复活图景中大地、阴间与灭亡之境的关系
  choice: 保留三个彼此平行、都要交还所存之物的领域
  alternative: 把三者合并解释为坟墓或地狱
  rationale: 原文刻意并列这些领域；译文不把它们统一成后世单一的末世地点，以保留古代启示文学的概念张力。
- issue: “蒙拣选者”的身份
  choice: 保留称号“那位蒙拣选者”
  alternative: 直接译作弥赛亚、基督或人子
  rationale: 本句本身没有明说更具体的身份；保持原称号，避免把特定教义认定写入正文。
- issue: “他们都要成为天上的天使”的先行词
  choice: 按现有句法保留“他们”，不在正文中明确指定所指
  alternative: 明确译成义人、蒙拣选的人或在场众人
  rationale: 原文复数主语的具体所指并不完全明朗，译文保留这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。三个“要交还”维持原文排比；“在那些日子”反复出现，以保存启示文学的韵律。代词性别尽量不按语法阴性机械译作“她”，避免在中文中额外强化大地或阴间的人格性别。所给吉兹语文本实际包含多个连续段落，译稿按完整来源全部呈现，并以分段帮助阅读。
