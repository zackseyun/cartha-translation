base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/005.yaml
  text: And he said to me[a], “These are being prepared for the host of Azazʾel, so that they may take them and cast them into the lowest part of the place of judgment; and they will cover their jaws with rough stones[e][d][c][b], just as the Lord of Spirits commanded.”
translation:
  language: zh_hans
  text: 他对我说[a]：“这些正为阿撒兹勒的一伙预备着，好把他们捉住，扔进审判之地的最深处[b]；又要用粗糙的石头盖住他们的下颚[c]，正如万灵之主所吩咐的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿撒兹勒的一伙”一语的吉兹文文本颇为困难，也可理解为“阿撒兹勒的作为”，或“属于阿撒兹勒的人”。
    reason: 文本疑难与词义替代
  - marker: b
    text: 直译可作“在一切审判之下”或“在每一种审判之下”。此处较可能指向一个具体的审判／刑罚场所，故译为“审判之地的最深处”；不用“地狱”，以免引入后期神学术语。
    reason: 词义替代与旧译保留
  - marker: c
    text: 现有转录表面上可读作“他们的天使”，但很可能把字形相近的“他们的下颚（或颚部）”误录了。本译文采用后者；复数主动动词也支持把“粗糙的石头”理解为遮盖所用的材料。
    reason: 校勘说明与句法依据
lexical_decisions:
- source_word: ይዴለዉ
  choice: 正……预备
  rationale: 表达为特定审判用途而准备的状态，既保留目的性，也符合现代汉语。
- source_word: ለትዕይንተ አዛዜኤል
  choice: 为阿撒兹勒的众党
  rationale: 该处文本困难；结合后文复数代词，暂按与阿撒兹勒相关的群体理解。“众党”保留集体含义而不强加军事色彩。
- source_word: አዛዜኤል
  choice: 阿撒兹勒
  rationale: 按闪语名称的通行汉语音译处理，并与相关古代犹太文献用名保持可辨识性。
- source_word: ይትመጠውዎሙ
  choice: 把众党抓住
  rationale: 动词表示拿住或攫取；在拘捕并投入刑罚之地的语境中，“抓住”自然且具有力度。
- source_word: ወይደይዎሙ
  choice: 扔进
  rationale: 保留强制投掷和向下投入的惩罚意象，同时使用普通现代读者易懂的措辞。
- source_word: መትሕተ ኵሉ ደይን
  choice: 审判之地的最深处
  rationale: 依最新校勘判断，将短语理解为空间性的下降及审判场所，而非抽象的“在一切审判之下”；避免译作“地狱”而引入后期神学概念。
- source_word: አእባኒ ጠያያነ
  choice: 粗砺的石头
  rationale: 名词为“石头”，修饰语表示粗糙、不平整；“粗砺”兼具具体感与庄重语体。
- source_word: ይክድኑ
  choice: 封住
  rationale: 基本义为遮盖、掩住；与石头及嘴颊搭配时，“封住”能自然表现惩罚性的堵塞，同时不具体规定实施方式。
- source_word: መላትሒሆሙ（据校勘；转录作 መላእክቲሆሙ）
  choice: 众党的嘴颊
  rationale: 采纳最新复核所指出的OCR误识：原词应指“他们的嘴颊/颚部”，而非“他们的天使”；这也与《以诺一书》10:4的刑罚意象相应。为避免汉语代词指向含混，重复译出“众党”。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 这是《比喻篇》中固定的神圣称号；“万灵之主”自然、庄重，并保留其独特文献用语。
theological_decisions:
- issue: 与阿撒兹勒相关者的身份
  choice: 阿撒兹勒的众党，即与他相关的一个群体
  alternative: 阿撒兹勒的作为/事工；属于阿撒兹勒的人
  rationale: 该词形及传本文本均有困难。后续复数受词更支持群体解释，但不进一步界定其成员或性质；以脚注保留其他可能。
- issue: 惩罚地点的性质
  choice: 审判之地的最深处
  alternative: 在一切审判之下；地狱的最深处
  rationale: 空间词和上下文支持具体的审判场所及向下投入的图景；不用“地狱”，以免把后期体系化概念带入以诺文献的宇宙地理。
- issue: 有争议词形是“天使”还是“嘴颊”
  choice: 按校勘读作“他们的嘴颊”
  alternative: 按现有转录表面形式译作“他们的天使/使者”
  rationale: 语法上动词为复数主动，粗砺石头是遮盖材料；字形复核也表明转录很可能把“嘴颊”误识成“天使”。该读法使句法和惩罚意象均更连贯，但以脚注公开文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“众党”避免把相关群体过度军事化；“审判之地”保留以诺文献特有的刑罚空间，不替换为带有后期教义色彩的“地狱”。所有脚注标记均已置于正文。
