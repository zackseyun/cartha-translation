  text: And they will be joined together[a][b][c].
translation:
  language: zh_hans
  text: 并且它们将合在一起。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句吉兹语极为简短；动词也可译作“将被联合起来”或“将汇合”。
    reason: lexical_alternative
  - marker: b
    text: 《以诺一书》第54章属于“比喻篇”，缺少其他部分有时可用的昆兰文献和希腊语文本参照，因此这里对吉兹语措辞应格外谨慎。
    reason: textual_variant
lexical_decisions:
- source_word: ወ
  choice: 并且
  rationale: 前缀连词通常表示“和、并且”；现有短句不足以支持更强的时间或因果关系。
- source_word: ይዴመሩ
  choice: 它们将合在一起
  rationale: 此词形宜从表示“连接、联合、加在一起”的词根理解，并以未完成体的被动或反身复数表达将来的动作。“合在一起”既符合上下文中诸水汇合的意象，也避免旧译“被量度”所依据的词义误判。
theological_decisions:
- issue: 如何翻译《以诺一书·比喻篇》中孤立且极短的吉兹语句
  choice: 将其译为“并且它们将合在一起”，保留复数指代及未完成体所含的将来意义。
  alternative: 并且它们将被联合起来；并且它们将汇合。
  rationale: “合在一起”自然地传达被动或反身复数含义，同时不把所指对象或联合方式说得过于具体。由于现有见证极短，正文保持克制，并用脚注说明文本控制方面的限制。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“它们”保留原文复数指代，不根据上下文擅自补明对象；“将合在一起”兼顾吉兹语未完成体和被动或反身语态。
