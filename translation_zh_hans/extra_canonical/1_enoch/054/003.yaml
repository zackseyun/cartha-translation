base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/003.yaml
  text: And there my eyes saw their instruments[d][c][b][a], as they were making iron chains without measure.
translation:
  language: zh_hans
  text: 在那里，我亲眼看见他们的器具[a]；他们正在制作这些器具[b]——重量无法衡量[c]的铁链。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器具”也可译为“工具”或“用具”；按上下文，也可能指用于束缚的器具。
    reason: lexical_alternative
  - marker: b
    text: 原文动词带“它们”的复数宾语成分，此处回指“器具”。整句也可理解为：“我看见他们怎样用器具制造铁链。”
    reason: syntactic_ambiguity
  - marker: c
    text: 原词组可直译为“没有可称量之处”，意为重量无法衡量；也可能较宽泛地理解为“不可计量”或“没有限度”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበህየ
  choice: 在那里
  rationale: 保留异象叙述中承接前景的地点表达，现代汉语自然简洁。
- source_word: ርእያ አዕይንትየ
  choice: 我亲眼看见
  rationale: 原文明确提到“我的眼睛”；译为“我亲眼看见”，既保留视觉强调，也符合现代汉语表达。
- source_word: ዘመባዕዕቲሆሙ
  choice: 他们的器具
  rationale: 保留第三人称复数领属后缀“他们的”，并以较宽泛的“器具”传达工具、用具或刑具的可能含义，不在正文中提前限定用途。
- source_word: እንዘ ይገብርዎሙ
  choice: 他们正在制造它们
  rationale: “正在”体现伴随结构所表达的持续动作，“它们”则保留动词上的第三人称复数宾语后缀。
- source_word: መአስርተ ሐጺን
  choice: 铁链
  rationale: 直译材质与捆绑器物的具体意象；“铁链”在现代汉语中清楚而有力度。
- source_word: ዘአልቦ መደለውተ
  choice: 重量无法衡量
  rationale: 按与称量、重量有关的词义理解，并以“无法衡量”表达无可计量的程度；脚注保留较宽泛的“没有尺度/不可计量”可能。
theological_decisions:
- issue: 异象中所制造物件的性质
  choice: 译为具体的铁链，但不在正文中说明其审判用途
  alternative: 泛译为惩罚工具，或解释为象征性的捆绑
  rationale: 原文呈现器具、制造、铁与链等具体物质意象，却未在本节明说其用途；因此保留末世异象的具体性及解释张力。
- issue: “器具”与“铁链”的句法关系
  choice: 用破折号将“铁链”作为对所制造之物的补充说明
  alternative: 译成“我看见他们怎样用器具制造铁链”
  rationale: 原文动词带复数宾语后缀，较自然地回指前面的复数物件；但句法略显紧缩，故以标点呈现同位或补充说明，同时用脚注交代另一种理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我亲眼看见”保留启示文学的见证语气；“器具”避免过早解释为刑具；破折号体现原文紧缩的同位关系，并让读者感受到铁链意象的突现。
