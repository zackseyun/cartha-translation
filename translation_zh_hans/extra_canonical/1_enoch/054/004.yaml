base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/004.yaml
  text: And I asked the angel of peace who went with me[a], saying[b], “These chains of the instruments—for whom are they being prepared?”
translation:
  language: zh_hans
  text: 我问那与我同行的和平天使，说：“这些器具[a]的锁链，是为谁预备的？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器具”所据的原文词语在此见证中不确定，其与“锁链”的关系也未能确定；也可能指与惩罚有关的器械或装置，或可仅译作“这些锁链”。
    reason: textual_variant
lexical_decisions:
- source_word: ተስእእክዎ
  choice: 我问
  rationale: 该动词引出以诺向同行天使提出的问题；“我问”自然、直接，不增添质询等额外语气。
- source_word: መልአከ ሰላም
  choice: 和平天使
  rationale: 保留以诺传统中近似称号的表达，指在异象中担任引导者的天使；不弱化为仅描述性情的“温和的天使”。
- source_word: ዘየሐውር ምስሌየ
  choice: 那与我同行的
  rationale: 准确表达关系从句及陪同行进的叙事场景，现代汉语亦自然。
- source_word: እሉ እስረተ
  choice: 这些……锁链
  rationale: 指异象中可见的具体拘束物。“锁链”比抽象的“束缚”更符合审判场景，同时保留指示词“这些”。
- source_word: መበልዕት
  choice: 刑具
  rationale: 抄本中的词形及其与“锁链”的关系不够确定；结合惩罚场景译作“刑具”，但以脚注明确其也可泛指器具或装置。
- source_word: ለመኑ ይዴለዉ
  choice: 是为谁预备的
  rationale: 保留询问对象及预先备妥的被动、预期意味，符合末世审判语境。
theological_decisions:
- issue: 异象中惩罚之物的性质
  choice: 具体译为“这些刑具的锁链”
  alternative: 这些惩罚的锁链；这些为审判而设的束缚
  rationale: 原文指向异象中可见的物件，而不是抽象的惩罚或审判概念；保留具体意象，也不把用途解释得超出文本。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“和平天使”保留称号感；问句简洁直接。由于底本中括注词语不确定，将提示标在争议短语之后，避免把不确定性隐藏在正文中。
