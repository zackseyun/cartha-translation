base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/006.yaml
  text: And Michael and Gabriel and Raphael and Phanuel—they will seize them on that great day and cast them into the burning furnace on that day[a], so that the Lord of Spirits may take vengeance on them for their lawlessness[c][b], because they became servants of Satan and led astray those who dwell upon the dry land.
translation:
  language: zh_hans
  text: 米迦勒、加百列、拉斐尔和法努伊勒，要在那大日擒住他们[a]，并在那日把他们投入燃烧的火炉中，好让万灵之主因他们的不法向他们施行报应；因为他们成了撒但的仆役[b]，又使那些住在旱地上的人走迷了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “擒住”也可译作“抓住”。吉兹语动词含有强力制伏的意味，但在这一主要仅存吉兹语文本的段落中，确切语气不易确定。
    reason: lexical_alternative
  - marker: b
    text: 译作“撒但的仆役”的短语在文本和词义上较难确定；也可能译作“撒但的奴隶”，较不可能是“撒但的使者”。
    reason: textual_variant
  - marker: c
    text: 直译为“住在旱地上的人”。这可能泛指地上的居民；这里保留较具体的说法，因为《比喻篇》此处实际上主要仅由吉兹语传本保存。
    reason: lexical_alternative
lexical_decisions:
- source_word: ያፀንዕዎሙ
  choice: 擒住他们
  rationale: 该动词表示强有力地抓住受审判者。“擒住”保留司法拘捕和强制意味，又不像“捆绑”那样加入原文未明说的动作。
- source_word: ዕለት ዐባይ
  choice: 那大日
  rationale: 保留启示文学中凝练而庄重的惯用表达，不扩写为“审判大日”。
- source_word: እቶን ዘይነድድ
  choice: 燃烧的火炉
  rationale: 忠实保留原文具体而强烈的火炉意象，现代中文也自然易懂。
- source_word: ይወድይዎሙ
  choice: 把他们投入
  rationale: 体现惩罚性地丢入火炉的动作，同时保持庄重，避免过于口语化。
- source_word: ይትበቀል
  choice: 施行报应
  rationale: 表达报偿性、惩罚性的公义行动，不将其淡化为笼统的“惩罚”或“审判”。
- source_word: በዓመፃሆሙ
  choice: 因他们的不法
  rationale: “不法”保留该词在道德和审判语境中的越轨、悖逆分量。
- source_word: ላእከ ሰሰይጣን
  choice: 撒但的仆役
  rationale: 此处最自然地表示归属并服事撒但；“仆役”既保留从属关系，也不武断限定为奴隶身份或技术意义上的使者。
- source_word: አስኀትዎሙ
  choice: 使……走迷了
  rationale: 既表达使人犯错，也保留“偏离道路”的方向性隐喻。
- source_word: እለ የኀድሩ ዲበ የብስ
  choice: 那些住在旱地上的人
  rationale: 依原文保留“旱地”这一具体宇宙图景，不将其直接概括为“地上的居民”。
theological_decisions:
- issue: 是否弱化火炉和报应的审判语言
  choice: 明确保留燃烧的火炉与施行报应
  alternative: 概括译作惩罚或审判
  rationale: 本节属于启示文学的审判话语；保留尖锐意象和报偿性语言，避免消解原文的神学张力。
- issue: 如何表达受审者与撒但的关系
  choice: 他们成了撒但的仆役
  alternative: 他们成了撒但的奴隶／使者
  rationale: “仆役”能表达效忠和服事关系，又不把词义过度限定为财产式奴役或特定天使职分。
translation_notes:
  register: 采用现代、庄重而清楚的普通话书面语。人名使用常见圣经式音译；“万灵之主”“那大日”等措辞保留启示文学色彩。句法按中文调整，但不弱化原文的审判意象，也不消除“撒但的仆役”和“旱地”等处的真实歧义。
