base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/007.yaml
  text: And in those days the punishment from the Lord of Spirits will come[b][a], and all the storehouses of the waters that are above the heavens [and the fountains that are beneath the heavens] and those beneath the earth will be opened.
translation:
  language: zh_hans
  text: 在那些日子，万灵之主的惩罚将要临到；诸天之上的一切水库[b]、[诸天之下的泉源][a]，以及地底下的泉源，都将开启。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号内的“诸天之下的泉源”见于现有文本，但可能因传抄扰动而与后面的“地底下的泉源”形成重复。这里保留该短语，并标明其文本状态。
    reason: textual_variant
  - marker: b
    text: “水库”反映古代宇宙图景：诸天之上的水仿佛储存在库中，可在施行审判时开启。
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕል
  choice: 那些日子
  rationale: 与指示语合用，构成常见的启示文学时间表达；保留其复数形式和庄重语气。
- source_word: መቅሠፍቱ
  choice: 惩罚
  rationale: 该词表示带有刑罚性质的灾祸；“惩罚”清楚保留审判意味，又不限定具体施罚方式。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 保留《以诺一书·比喻篇》中这一独特称号；“万灵”在现代汉语中自然庄重，也表达众灵的整体意义。
- source_word: ታርሑ
  choice: 都将开启
  rationale: 被开启的是宇宙性的水库与泉源；“开启”既适合水库意象，也不额外断定水流释放的具体方式。
- source_word: መዛግብተ
  choice: 水库
  rationale: 原词指储藏之所；“水库”简洁呈现水被储存在天上仓库中的古代宇宙图景。
- source_word: ማያት
  choice: 水
  rationale: 汉语通常以不可数的“水”自然表达原文复数所指的众水。
- source_word: ዘመልዕልተ ሰማያት
  choice: 诸天之上
  rationale: 直译其空间关系，并以“诸天”反映原文复数，保留分层宇宙观。
- source_word: አንቅዕተ
  choice: 泉源
  rationale: 该词指泉、源头；“泉源”兼具可读性与庄重感，适合与天上水库并列。
- source_word: መትሕተ ምድር
  choice: 地底下
  rationale: 直接表达位于大地以下的空间位置，现代汉语自然清楚。
theological_decisions:
- issue: 将临之惩罚的性质
  choice: 保留以天上水库和地下泉源开启为内容的具体宇宙性审判图景。
  alternative: 将其泛化为一般性的惩罚，或把水库与泉源纯粹解释为比喻。
  rationale: 原文明确提及诸天之上的水和地下泉源，因此译文不应淡化其具体的启示文学意象，也不应断言其只是象征。
- issue: 括号内“诸天之下的泉源”是否属于正文
  choice: 按现有证据保留该短语，并用方括号标明其文本状态。
  alternative: 视为重复或讹误而从正文删去，只译诸天之上的水库和地底下的泉源。
  rationale: 所给吉兹语见证确有此短语，但它与随后“地底下的泉源”形成可疑的近似重复；保留方括号可同时呈现见证与文本疑难，不擅自裁决。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万灵之主”“诸天”“泉源”维持启示文学的崇高语域；句法以分号清楚区分惩罚临到与宇宙水源开启两个相连事件。
