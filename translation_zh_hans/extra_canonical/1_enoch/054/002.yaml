base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/002.yaml
  text: And they shall bring the kings and the mighty[a], and cast them into that deep valley.
translation:
  language: zh_hans
  text: 他们[a]要把君王和有权势的人带来，扔进那深谷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节没有明说“他们”是谁；这个复数主语可能指异象中先前提到的执行者，也可能是天使侍从。
    reason: 说明未明示主语的可能所指，同时保留原文歧义。
lexical_decisions:
- source_word: እምጽእዎሙ
  choice: 把……带来
  rationale: 该复数动词形式表示“带来”或“领来”；用“把”字结构自然承接随后明说的宾语，同时不补出原文未明示的主语身份。
- source_word: ለነገሥት
  choice: 那些君王
  rationale: 该词通常指君王或统治者；“那些”既表达语境中的特指，也与本句指向先前异象人物的语气相合。
- source_word: ወለኃያላን
  choice: 和权贵
  rationale: 此处既有强大、有权势之意，也处于君王受审的社会政治语境中；“权贵”在现代汉语中自然庄重，并保留其权势意味。
- source_word: ይውድ ይዎሙ
  choice: 扔进
  rationale: 该表达含有强力投入审判之地的动作；“扔进”清楚有力，又不过度增添“猛掷”等戏剧性色彩。
- source_word: ውስተ
  choice: 进
  rationale: 此处表示朝某处内部的运动，与“扔”合译为“扔进”。
- source_word: ዝኩ
  choice: 那
  rationale: 指向异象中先前已经展示的地点，保留原文指示词的回指作用。
- source_word: ዕሙቅ
  choice: 幽深的
  rationale: 基本意义为深；“幽深”适合形容山谷，语言自然而庄重，不将其解释为神话性的“深渊”。
- source_word: ቈላ
  choice: 山谷
  rationale: 指低洼的谷地；“山谷”是现代汉语中最自然、具象的对应词，也保留可见审判场所的意象。
theological_decisions:
- issue: 执行带来并扔入山谷这一行动者的身份
  choice: 仅译为“他们”，不明确说成天使
  alternative: 译作“天使要……”或“侍从要……”
  rationale: 吉兹文使用复数动词形式，却未在本节明说主语。上下文或许暗示天使一类的异象执行者，但本译文保留本节自身的含混，不以解释代替翻译。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他们要……带来，扔进……”保留末世审判场景的力度；不用文言式“投于”或带特定宗派色彩的称谓。脚注标记[a]置于相关名词短语之后，但脚注内容说明的是本句未明示的复数主语。
