base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/001.yaml
  text: And I looked and turned to another part of the earth[b][a], and I saw there a deep valley with burning fire.
translation:
  language: zh_hans
  text: 我观看，转向大地的另一方[a]，看见那里有一处有火燃烧的深谷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“大地的另一张脸”，是指大地的另一处、另一方或另一面。
    reason: lexical_alternative
  - marker: b
    text: 也可译为：“那里有一处深谷，火在其中燃烧。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: 我观看
  rationale: 保留异象叙事中主动凝视的动作，并与下文表示实际看见的“我看见”相区别。
- source_word: ተመየጥኩ
  choice: 又转向
  rationale: 在异象行进的语境中，表示观看者改变朝向或注意方向；“转向”简洁且保留动作意象。
- source_word: ካልአ ገጸ ምድር
  choice: 大地的另一面
  rationale: 较直接地保留原文“地的另一张脸／另一面”的空间意象；现代汉语中亦可自然理解为大地的另一处或另一方。
- source_word: ርኢኩ
  choice: 我看见
  rationale: 作为主要的视觉感知动词，译为“看见”清楚自然，并与前面的“观看”形成原文所具有的动词区别。
- source_word: ህየ
  choice: 那里
  rationale: 准确表达指向刚刚转而观看之地点的方位副词。
- source_word: ቈላ ዕሙቀ
  choice: 一道深谷
  rationale: “深谷”保留地形及其幽深、险峻的意象；量词“道”符合现代汉语对狭长谷地的常见表达，又不过度限定具体地貌。
- source_word: እንዘ ትነድድ እሳት
  choice: 火正在燃烧
  rationale: 按分词性结构译成进行中的动作，直接呈现火燃烧的景象，同时保留它究竟修饰地点还是独立描述现场的句法张力。
