base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/002.yaml
  text: And its circuit is like the circuit of heaven[a], and its chariots, by which it goes out, are driven by the wind[c][b]; and light is given to it by measure.
translation:
  language: zh_hans
  text: 它的环行如同天穹的环行；它借着自己的战车出来，风吹动这些战车[a]；光按一定的尺度赐给它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句在埃塞俄比亚文本中句法较难。也可理解为：“它的战车载着它出来，随风而行”，或“它的战车驶向风所吹之处”。
    reason: textual_variant
  - marker: b
    text: “按一定的尺度”也可译作“按着份量”或“按固定的尺度”，强调光是依照规定、有秩序地赐下的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ክበቡ
  choice: 它的环行
  rationale: 该词既可指环周形态，也可指环绕运行；“环行”保留空间与运动两方面的含义，又避免引入现代“轨道”概念。
- source_word: ከመ ክበበ ሰማይ
  choice: 如同天穹的环行
  rationale: 保留原文明确的比较结构；“天穹”符合本段宇宙异象的语域，也呈现“天”的可环周意象。
- source_word: ሰረገላተ ዚአሁ
  choice: 自己的战车
  rationale: 保留复数战车的启示文学图像，不将其淡化为一般的交通工具或现代机械。
- source_word: በኀበ ይጼዓን ነፋስ ትነፍስ
  choice: 它借着自己的战车出来，风吹动这些战车
  rationale: 尽量对应“借着／在其中”“出来”及“风吹”等词项，同时以自然汉语呈现；因埃塞俄比亚文本句法困难，用脚注保留其他可能理解。
- source_word: በመስፈርት
  choice: 按着定量
  rationale: 表达依照尺度、规定或比例的意思，突出光的分配受秩序约束。
- source_word: ይትወሀብ ሎቱ ብርሃን
  choice: 光……赐给它
  rationale: 保留原文被动表达，不改写为光由它自身产生。
theological_decisions:
- issue: 是否以现代天文学术语描写发光天体的运行
  choice: 保留“环行”和“战车”的宇宙异象意象
  alternative: 译作“轨道”和“运载工具”
  rationale: 原文采用启示文学的宇宙图景；不应以现代机械或天文学概念消解其意象。
- issue: 光是否被描写为该天体自身固有
  choice: 译作“光按着定量赐给它”
  alternative: 译作“它按一定程度发光”
  rationale: 原文使用被动式“赐给它”，翻译保留受赐之意，但不进一步说明赐予者或建立超出本句的教义结论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“天穹”“战车”保留古代启示文学色彩；句式略带经文韵律，但避免生硬仿古。所有脚注标记均已置于正文。
