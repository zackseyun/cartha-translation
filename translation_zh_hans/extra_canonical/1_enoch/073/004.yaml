base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/004.yaml
  text: And in this way it rises[a], and its front, which is toward the east, comes out on the thirtieth morning, and on that day it becomes visible, and it shall be for you the head of the month, on the thirtieth day with the sun[e][d][c][b], in the gate from which the sun comes out.
translation:
  language: zh_hans
  text: 它就这样隐没[a]；它朝向东方的前端，在第三十个清晨出来；那一天，它显现，并在第三十日与太阳一同，在太阳出来的那道门中，成为你们的月首[b]。[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它就这样升起。”此处动词也可理解为“隐藏、隐没”或“退隐”；按本节天体显隐的语境，正文采用“隐没”。
    reason: lexical_alternative
  - marker: b
    text: “月首”直译为“月之头”，指一个月的开端，也可译作“月初”。
    reason: lexical_alternative
  - marker: c
    text: “门”是本书《天文书》部分反复使用的图景：天体按秩序从天空的各道门出入。
    reason: cultural_note
  - marker: d
    text: 末句也可断作：“它在第三十日与太阳一同成为你们的月首，地点就在太阳出来的那道门中。”原文中时间、伴随和地点短语的修饰关系较为紧凑。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ይሠርቅ
  choice: 升起
  rationale: 此处描写月亮在天门中的运行和显现；按其东方运动的语境译作“升起”最为顺畅，同时以脚注保留“隐没”的异读可能。
- source_word: ርእሱ
  choice: 前端
  rationale: 原义为“它的头”；在方位描写中指朝东的领先部分。译作“前端”既保留空间形象，又比“头”更符合现代汉语。
- source_word: ዘመንገለ ጽባሕ
  choice: 朝向东方
  rationale: 字面与“清晨”方向有关，在这里表示日出所在的东方。
- source_word: በሠላሳ ጽባሕ
  choice: 在第三十个清晨
  rationale: 按时间状语理解，指周期中的第三十个清晨；不擅自改写成现代天文学术语。
- source_word: ያስተርኢ
  choice: 显现出来
  rationale: 该使役形有“使之可见、显示”之意；在月相语境中用不及物表达“显现出来”较自然。
- source_word: ርእሰ ወርኅ
  choice: 月首
  rationale: 直译为“月之首”，是表示月份开端的具体历法用语；“月首”保留原文形象，并以脚注说明。
- source_word: ሠላሳ ዕለት
  choice: 在第三十日
  rationale: 虽然形式上是基数词“第三十/三十”加“日”，但本节与前面的“第三十个清晨”平行，作序数日期理解更合乎历法语境。
- source_word: ምስለ ፀሐይ
  choice: 与太阳一同
  rationale: 保留月亮与太阳在该日的伴随或并列关系，不进一步解释其天文学含义。
- source_word: በኆኅት
  choice: 位于……那道门中
  rationale: 保留《天文书》中天体经由天门运行的宇宙图景；介词在此可表达“在门中”，也可能强调“经由门”。
- source_word: እንተ ይወፅእ ፀሐይ
  choice: 太阳出来的
  rationale: 关系从句限定该天门，以太阳从其中出来为识别特征，保留原文具体的运动形象。
theological_decisions:
- issue: 是否用现代天文学语言规范化本节的宇宙图景
  choice: 保留“前端”“月首”“门”和太阳“出来”等具体意象
  alternative: 译成“新月”“东方地平线”或“日出点”等现代术语
  rationale: 本节以启示文学自身的天门体系描述月亮和太阳；现代化改写会抹平其古代宇宙观和历法语言。
- issue: 如何处理末句各时间、伴随和地点成分的句法关系
  choice: 将“在第三十日”与“它与太阳一同位于……门中”连读
  alternative: 把“第三十日”直接解释成“一个月共有三十天”，或把全部成分都紧接“月首”
  rationale: 原文成分排列紧密，修饰范围并非完全明晰；正文采用最合语境的日期读法，同时用脚注保留可能的不同断句。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“它”承接本段所述月亮，避免额外加入性别；“月首”和“天门”保留古代历法与宇宙图景，并借脚注帮助普通读者理解。
