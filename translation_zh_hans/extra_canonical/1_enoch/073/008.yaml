  text: And on that day it rises with exactly seven parts[b][a], and it comes out.
translation:
  language: zh_hans
  text: 在那一天，它升起时正好有七份[a]，并显现出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “七份”指按份数计算的月亮亮光；也可译作“七个部分”。
    reason: lexical_clarification
lexical_decisions:
- source_word: ይሠርቅ
  choice: 升起
  rationale: 该动词用于天体时表示“升起”，符合本段月亮运行的语境。
- source_word: በይእቲ ዕለት
  choice: 在那一天
  rationale: 介词、指示词与“日”组成明确的时间状语。
- source_word: ሳብዐተ እደ
  choice: 七份
  rationale: ሳብዐተ 是“七”，እደ 在此表示若干份或部分，指月亮可见光的份数；不误解为“第七天”。
- source_word: ጥንቁቀ
  choice: 正好
  rationale: 表达精确、恰好的意思，以自然现代汉语保留计量语气。
- source_word: ይወፅእ
  choice: 显现出来
  rationale: 基本义为“出来、出去”；在天体升出的语境中，“显现出来”比“出去”自然，同时保留其出现场景。
theological_decisions:
- issue: 阳性单数动词所指对象及汉语代词
  choice: 用“它”指本段语境中的月亮
  alternative: 用“他”强化天体人格化，或省略主语
  rationale: 吉兹语动词虽为阳性单数，但语法性别不必在汉语中译成人的性别；“它”既清楚指向天体，也不额外加强人格化。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。以所给吉兹语词形及最新校勘意见为主要依据；因源文本置信度为中等，避免将“份”进一步解释成未经本节明说的具体比例。
