base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/003.yaml
  text: And in every month its going out and its returning vary[a], and its days are like the days of the sun; and when its light is full[c][b], it is a seventh part of the light of the sun.
translation:
  language: zh_hans
  text: 每个月，它的出行和返回都会变化[a]；它的日数如同太阳的日数。当它的光圆满明亮时[b]，其亮度为太阳光的七分之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出行”和“返回”可能是描述天体运行周期的天文用语，也可理解为“升起”和“落下”；但吉兹语本身并未明确限定为后二者。
    reason: lexical_alternative
  - marker: b
    text: 或译：“当它的光清澈而圆满时。”这里所说的是月光达到完全明亮的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሙፃኢሁ
  choice: 它的出行
  rationale: 该词基本义为出去、出行；在天文语境中可能指天体升出，但译作“出行”可避免把含义过早限定为“升起”。
- source_word: ምብዋኢሁ
  choice: 它的返回
  rationale: 与“出行”成对，表示返回或进入；“落下”虽有可能，但“返回”更能保留原文的形式对应和含义宽度。
- source_word: ይትዌለጥ
  choice: 都会变化
  rationale: 动词表示改变或有所不同；“变化”自然地传达按月变动的观察性、历法性含义。
- source_word: መዋዕሊሁ
  choice: 它的日数
  rationale: 直译为“它的日子”；结合周期语境，“日数”比“日子”更清楚，同时未加入“规定”等原文没有明说的概念。
- source_word: ከመ መዋዕለ ፀሐይ
  choice: 如同太阳的日数
  rationale: ከመ 表示“如同、像”；保留比较关系，不强行解释为严格相等或依照太阳计算。
- source_word: ይፄሪ
  choice: 完全明亮
  rationale: 依该词在本节月光语境中的“清澈、明亮、纯净”义，并参考其用于月光均匀而圆满的词典证据，译为“完全明亮”；不采用会颠倒天文意义的“变暗”。
- source_word: ሳብዓደ እደ
  choice: 七分之一
  rationale: 该短语表达第七份或七分之一；现代汉语以“七分之一”最自然准确。
- source_word: እምብርሃነ ፀሐይ
  choice: 太阳之光的
  rationale: 介词可表达来源或比较；与“七分之一”连用时译成所属结构，清楚呈现月光与太阳之光的比例关系。
