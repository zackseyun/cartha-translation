base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/006.yaml
  text: And on the day it takes up a seventh part of half of its light[c][b][a], and its light becomes one and a half seventh parts.
translation:
  language: zh_hans
  text: 在那一天，月亮从自身一半的光亮中取得七分之一[a]；它的光亮便成为七分之一再加半个七分之一[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的字面表达涉及“七手”；在这里的天文计量语境中，它表示一个七等分的单位，即七分之一，而不是七个完整份额。
    reason: 说明字面习语及其计量意义，避免误解为七个完整份额。
  - marker: b
    text: 末尾的数字表达十分紧缩，字面近于“七分单位，一个和一半”。正文将其理解为一个半的七分之一单位，即三十四分之三；由于原文措辞简略，此处的数值关系仍有解释上的困难。
    reason: 保留原文数字结构的困难，并说明正文所采用的天文计量理解；不提供会被误解为“七分之一加二分之一”的替代译法。
lexical_decisions:
- source_word: በዕለተ
  choice: 在那一天
  rationale: 保留具体的历日语感，并以现代汉语自然表达时间状语。
- source_word: ትነሥእ
  choice: 取得
  rationale: 此处只译作一个谓语，按语境取“接受、取得”之义，不重复译为“升起并取得”。
- source_word: ሳብዐተ እደ
  choice: 七分之一
  rationale: 该计量表达在此天文语境中指一个七等分单位，而不是“七份”；这样也符合月光逐步增加的计算脉络。
- source_word: መንፈቀ ብርሃኑ
  choice: 自己一半的光亮
  rationale: 将“半”与“它的光”保持紧密关系，同时使中文句法清楚。
- source_word: ብርሃኑ
  choice: 它的光亮
  rationale: 阳性后缀不支持英语咨询层曾采用的阴性拟人化；中文用中性的“它”，并重复“光亮”以保留原文措辞。
- source_word: ይከውን
  choice: 便成为
  rationale: 表达结果状态以及光亮计量上的变化。
- source_word: ሳብዐተ እደ አሐተ ወመንፈቃ
  choice: 七分之一又半个七分之一
  rationale: 按一个半的七等分单位理解，使数值关系明确，同时借脚注保留原文结构的难点。
theological_decisions:
- issue: 天体的拟人化与代词性别
  choice: 用中性的“它”指月亮
  alternative: 用“她”保留拟人化表达
  rationale: 本节词形中的阳性所有格后缀不支持阴性代词；现代汉语以“它”称天体既自然，也避免从上下文擅自加入女性拟人化。
- issue: 月光增长的分数关系
  choice: 将末句理解为一个半的七分之一单位
  alternative: 直译为“七份、一又一半”或理解为“七分之一加二分之一”
  rationale: 原文数字表达紧缩且有歧义；正文采用符合本段月相递增计算的理解，但以脚注明示措辞难点，不把推定伪装成绝对确定。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“月亮”明确承接上下文所指的发光体；避免英语早期译法造成的双重谓语和阴性拟人化。分数表达优先清楚，但通过脚注保留吉兹文数字短语的困难。
