  yaml_path: translation/extra_canonical/1_enoch/073/001.yaml
  text: And after this law I saw another law for the lesser light[b][a], whose name is the moon.
translation:
  language: zh_hans
  text: 在这法则之后，我看见另一条关于较小之光的法则[a]；这光名叫月亮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法则”在本节两处也可译作“命令”、“定例”或“秩序”；原词可指权威所规定的安排或指令。
    reason: 保留ትእዛዝ在宇宙秩序与权威命令之间的词义幅度，并说明本节两次重复均采用“法则”。
lexical_decisions:
- source_word: ወድኅሬሁ፡ ለዝ
  choice: 这……之后
  rationale: 按时间次序承接前文关于太阳运行的安排；简洁保留异象叙述的过渡语气。
- source_word: ትእዛዝ
  choice: 法则
  rationale: 本词在本节出现两次，均译作“法则”，保留原文重复；在《天文书》的语境中，它指支配天体运行的规定或秩序，不宜仅理解为一次口头命令。
- source_word: ርኢኩ
  choice: 我……看见
  rationale: 直接呈现第一人称异象报告，语言自然清楚。
- source_word: ካልአ
  choice: 另一
  rationale: 表示继前述法则之后又有一个相应的法则；不强行限定为编号意义上的“第二”。
- source_word: ለብርሃን፡ ንኡስ
  choice: 关于那较小的光
  rationale: 保留相对于太阳而言的大小对比及天体之“光”的意象；“关于”自然表达该法则所涉及的对象。
- source_word: ዘስሙ
  choice: 它名叫
  rationale: 忠实表达关系结构所引出的名称说明，同时符合现代汉语习惯。
- source_word: ወርኅ
  choice: 月亮
  rationale: 采用现代汉语对月球天体最自然、通俗的称呼。
theological_decisions:
- issue: 《天文书》中ትእዛዝ所表达的宇宙秩序性质
  choice: 法则
  alternative: 命令；定例；秩序
  rationale: “法则”能表达天体持续、周期性运行所遵循的规定，同时保留背后的权威性；正文不把它具体解释成自然律、口头神谕或礼仪法规，以免消解原词的语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“法则”的重复和“较小的光”的宇宙意象；句式略作汉语化处理，但不补入原文没有明说的施令者或神学解释。
