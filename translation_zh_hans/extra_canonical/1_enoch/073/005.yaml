base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/005.yaml
  text: And its distant half is one seventh part[a], and all its disk is empty, without light[c][b], except for a seventh part of it—a fourteenth part of its light.
translation:
  language: zh_hans
  text: 它远处的那一半是七分之一[a]；它的整个圆面都是空的，没有光[c][b]，只有其中的七分之一——也就是它光的十四分之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的数字说法较难。“份”所对应的词字面是“手”，在这里用作天体运行计量中的单位或部分。
    reason: lexical_alternative
  - marker: b
    text: 本节以《天文书》特有的示意性方式描述月亮受光与无光的部分，不宜按现代科学术语来理解。
    reason: cultural_note
  - marker: c
    text: 或可较字面地译作：“一个的七份；它的整个圆面都没有光，只有它的七份——它光的十四份。”不过，本章把月光按十四份计算的脉络支持正文的分数译法。
    reason: previous_rendering
lexical_decisions:
- source_word: መንፈቀ
  choice: 那一半
  rationale: 该词表示一半或分开的一部分；在月体计量语境中译为“一半”，既保留数量含义，也不以现代天文学过度解释。
- source_word: ርኁቅ
  choice: 较远的
  rationale: 保留原文的空间方位感；“较远的”比单说“远的”更自然地修饰月体的一半。
- source_word: ሳብዐተ እደ አሐደ
  choice: 七分之一
  rationale: 按此处格尔兹语分数表达及本章将月光分为十四份的计量框架理解；同时以脚注说明原文字面构造及其难度。
- source_word: ኵሉ ክበበ ዚአሁ
  choice: 它的整个圆面
  rationale: ክበብ本指圆形、圆周或圆体；“圆面”自然适用于可见天体，又不强加现代科学术语。
- source_word: ባክ ዘአልቦ ብርሃነ
  choice: 都是空的，没有光
  rationale: 分别保留“空”和“无光”的双重表述，避免把两个相邻的缺失概念压缩为一个。
- source_word: ዘእንበለ
  choice: 只有
  rationale: 以现代汉语自然表达原文的排除义，即“除……以外”。
- source_word: ሳብዐተ እዴሁ
  choice: 其中的七分之一
  rationale: 依同一分数句法处理，并明确所指为该圆面的一部分。
- source_word: ዐሠርተ ራብዐተ እደ ብርሃኑ
  choice: 它光的十四分之一
  rationale: 按月光十四等份的计量体系译作分数，不误译为“十四份光”，同时保留原文重复而技术性的计量风格。
theological_decisions:
- issue: 天体描述的性质
  choice: 保留为技术性、启示文学式的天体计量陈述
  alternative: 概述为月亮正在盈亏，或按现代月相知识改写数字
  rationale: 《天文书》以重复的份数语言描述天体周期；保留这种计量修辞，既尊重原文宇宙观，也不引入现代科学解释。
- issue: 困难数字表达的处理
  choice: 正文采用符合本章数学脉络的分数读法，并用脚注保存字面歧义
  alternative: 在正文直译为“一个的七份”“它的七份”“它光的十四份”
  rationale: 格尔兹语此处的“手／份”构造可作分数理解，且十四等份的上下文支持该读法；但抄本措辞本身艰涩，因此不应在注释中掩盖另一种字面理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“圆面”兼顾天体可见形态与古代宇宙论语境；保留原句的重复计量结构。脚注标记依所给英文审校层的顺序置于相关短语之后，且全部在正文出现。
