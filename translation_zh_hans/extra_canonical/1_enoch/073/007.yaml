  yaml_path: translation/extra_canonical/1_enoch/073/007.yaml
  text: And it sets with the sun[a]; and when the sun rises, the moon rises with it and takes half a portion of light. And on that night, at the beginning of its morning, before the day[c][b], the moon sets with the sun and is dark through that night—seven parts and a half.
translation:
  language: zh_hans
  text: 它与太阳一同落下；当太阳升起时，月亮也同它一起升起[a]，并领受半份光[b]。在那一夜，在它清晨之初、白昼尚未来到时[c]，月亮与太阳一同落下；它在那一夜中黑暗了七份半。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节中间一段的吉兹语句法较难。译文依原有次序保留太阳与月亮一同升落的说法，没有改写成现代天文学解释。
    reason: textual_variant
  - marker: b
    text: 本章反复用若干“份”来计算月亮的光。“半份光”很可能属于同一套分量计算方式。
    reason: cultural_note
  - marker: c
    text: 此处时间短语的吉兹语句法较难。也可按不同断句理解为“在白昼之前，月亮落下”；译文保留其时间次序，未作现代天文学解释。
    reason: textual_variant
lexical_decisions:
- source_word: የዓርብ
  choice: 落下
  rationale: 此处描述天体运行，与“升起”相对；“落下”既自然，也保留原文具体的运动意象。
- source_word: ይሠርቅ
  choice: 升起
  rationale: 该词先后用于太阳和月亮，在天文语境中译为“升起”最为贴切。
- source_word: ምስሌሁ
  choice: 与它一同
  rationale: 所指为太阳这一发光天体；现代汉语用无生命代词“它”，不把原文语法性别解释为人格化。
- source_word: ይነሥእ
  choice: 取得
  rationale: 原文表达月亮获得一定量的光；“取得”保留动作性，又不引入现代天文学的反射机制。
- source_word: መንፈቀ እደ ብርሃን
  choice: 半份光
  rationale: 短语含“半”及份额、部分之意；“半份光”简洁保留量度意象，并与本章按“份”计算月光的体系相连。
- source_word: በርእሰ ጽባሐ ዚአሁ
  choice: 它的清晨刚开始
  rationale: 字面意象为“在它清晨的头端”；译文以现代汉语表达时间起点，同时保留代词指向可能存在的含混。
- source_word: በቅድመ ዕለቱ ለወርኅ
  choice: 尚未到白昼时
  rationale: 该处句法较难，可理解为“在白昼之前”，也可能把所属关系明确为“月亮的白昼之前”；正文不强行加入不自然的所有格，脚注保留另一分析。
- source_word: ይጸልም
  choice: 暗去
  rationale: 该动词表示变暗或处于黑暗；“暗去”兼顾过程与状态，而不解释为现代意义上的月相或食。
- source_word: ፯ሳብዓተ እደ ወንፍቃ
  choice: 七份半
  rationale: 结尾使用本章计算月亮明暗的单位。“七份半”以自然汉语保留计数方式。
theological_decisions:
- issue: 是否以现代天文学解释异象性的天体描述
  choice: 保留太阳、月亮升落及光按“份”计量的具体说法
  alternative: 在正文中改写为月相、合相或月食等现代天文学现象
  rationale: 《天文书》以自身的宇宙秩序语言呈现启示；翻译应保存这种前现代、异象性的表达，不以现代科学术语消解其张力。
- issue: “白昼”与“月亮”的句法所属关系
  choice: 正文译作“尚未到白昼时”，脚注说明也可理解为“月亮的白昼之前”
  alternative: 正文直接确定为“在月亮的白昼之前”
  rationale: 原文中代词后缀及随后出现的“月亮”容许所属结构的分析，但句法和语序并非毫无疑义；因此保留含混较为稳妥。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“落下／升起”“取得”“暗去”保留原文朴素具体的天体运动语言；不使用“月相”“反射”“月食”等会替原文作科学解释的术语。
