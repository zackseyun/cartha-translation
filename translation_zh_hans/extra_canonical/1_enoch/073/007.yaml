  to: 它与太阳一同落下；当太阳升起时，月亮也同它一起升起[a]，并领受半份光[b]。在那一夜，在它清晨之初、白昼尚未来到时[c]，月亮与太阳一同落下；它在那一夜中黑暗了七份半。
