base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/001.yaml
  text: The book written by Hanok—[Hanok indeed wrote every sign of wisdom[a], praised among all people and a judge of all the earth]—for all my children who will dwell on the dry land[d][c][b], and for the generations to come who practice righteousness and peace.
translation:
  language: zh_hans
  text: 以诺所写的书——[以诺确实写下了智慧的一切表征；他在众人中受赞美，又是全地的审判者][a]——是写给我所有将住在干地上的儿女[b]，也写给后来的世代[c]，就是那些践行公义与和平的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号内的句子在现存埃塞俄比亚语文本的这一行中可能不稳定；这里保留它，并采取审慎而较直译的表达。
    reason: textual_variant
  - marker: b
    text: “干地”直译原文，也可较宽泛地理解为“陆地”或“地上”。
    reason: lexical_alternative
  - marker: c
    text: 底本文字在“后来的世代”一处可能有转录讹误。若按未经校正的词形理解，曾有人译出“蒙拣选的人”；这里依据校勘意见译作时间意义上的“后来”。
    reason: textual_variant
lexical_decisions:
- source_word: ዘተጽሕፈ፡ እምሄኖክ፡ መጽሐፍ
  choice: 以诺所写的书
  rationale: 保留被动关系式引出的题记性质，同时依照现代汉语语序表达为简洁的书名式开头。
- source_word: ትእምርተ፡ ጥበብ
  choice: 智慧的一切征兆
  rationale: “征兆”保留该词所含的记号、表征之意，也维持启示文学的庄重语感；前面的“ኵሉ”按整体范围译作“一切”。
- source_word: እምኵሉ፡ ሰብእ፡ ስቡሕ
  choice: 在众人中受赞美
  rationale: 采用不把介词作用过度限定为明确施事者的表达，既传达普遍受赞誉之意，也保留原句关系上的一定含混。
- source_word: መኰንነ፡ ኵሉ፡ ምድር
  choice: 全地的审判者
  rationale: 名词可指掌权者、官长或审判者；此处选择“审判者”，与全地范围相配，并避免改写成单纯的统治动作。
- source_word: ለኵሎሙ፡ ውሉድየ
  choice: 写给我所有……的儿女
  rationale: 保留第一人称所属关系和家族式称呼；“儿女”在现代汉语中自然涵盖后代，而不局限于男性。
- source_word: የኃድሩ፡ ዲበ፡ የብስ
  choice: 将住在旱地上
  rationale: “旱地”直译具体的陆地、干地意象，不擅自平滑为较泛的“世界”；关系从句按句法连接“我的儿女”。
- source_word: ለትውልድ፡ ይኃርያን
  choice: 也写给后来的世代
  rationale: 依据校勘所提示的未来、后来之义处理文本中疑受转录影响的词形，不重复译出“蒙拣选者”。
- source_word: ይገብሩ፡ ርተዐ፡ ወሰላመ
  choice: 践行公义与和平
  rationale: 动词表达实际施行，故用“践行”；“公义与和平”保留两个伦理和宗教分量较重的并列概念。
theological_decisions:
- issue: 可疑词形ይኃርያን是否应译成带有拣选含义的称号
  choice: 后来的世代
  alternative: 蒙拣选的人／选民
  rationale: 现有校勘意见认为该形式是转录错误，应指后来或未来。正文不加入“蒙拣选者”，以免凭不稳文本引入额外的拣选神学；脚注说明这种文本问题。
- issue: መኰንነ的身份含义
  choice: 审判者
  alternative: 统治全地的人／全地的官长
  rationale: 该词兼具官长、治理者与审判者的语义范围。“审判者”符合启示文学语境，但不进一步说明其神学身份，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。破折号和方括号保留题记内部疑似插入语的层次；末句用“就是”自然连接后世代与其伦理特征，同时不把这种关系提升为教义定义。
