base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/003.yaml
  text: And the righteous one shall rise from sleep[a], and he shall arise and walk in the path of righteousness[d][c][b]; and all his path and his course shall be in goodness and in everlasting kindness.
translation:
  language: zh_hans
  text: 义人必从睡眠中起来[a]，他必起身，行在正义的道路上[b]；他所走的一切道路和他的行程，都必在良善和永恒的恩慈中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从睡眠中起来”既可按睡眠意象理解，也可能比喻进入更新的生命；本节本身没有明确限定。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“行在正义的诸路上”。
    reason: lexical_alternative
  - marker: c
    text: “恩慈”也可译作“怜悯”“宽仁”或“恩惠”；原词兼有慈悯、温和与施恩的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነሣእ
  choice: 起来／起身
  rationale: 原词连续出现两次，可表示“起来”或“被兴起”。译文保留主动而不将其明确化为复活术语，并以“起来……起身”再现重复。
- source_word: ጻድቅ
  choice: 义人
  rationale: 保留原文单数、个体化的指称，不预设弥赛亚性或群体性解释。
- source_word: እምንዋም
  choice: 从睡眠中
  rationale: እም 表示来源，ንዋም 指睡眠或沉睡；直译保留其可能是实指也可能是比喻的开放性。
- source_word: የኃልፍ
  choice: 行
  rationale: 该词可表示经过、前行；与“道路”搭配时译作“行”自然地保留伦理道路的意象。
- source_word: በፍኖተ ጽድቅ
  choice: 在正义的道路上
  rationale: 保留“道路—正义”的意象；此处形态可容许对单复数的不同理解，正文采用现代汉语较自然的单数集合表达。
- source_word: ኵሉ ፍኖቱ
  choice: 他所走的一切道路
  rationale: 原文直近为“他全部的道路”；补入“所走”使汉语通顺，同时保存路径意象及整体范围。
- source_word: ምሕዋሩ
  choice: 他的行程
  rationale: 该名词可指行进、行程或行为方式；“行程”与前面的道路意象相连，又避免过早将其纯粹道德化为“品行”。
- source_word: በኂሩት
  choice: 在良善中
  rationale: 原词表示良善、善行或惠益；“良善”保留其较宽的道德和善惠语义。
- source_word: በሣህል ዘለዓለም
  choice: 在永恒的恩慈中
  rationale: ሣህል 的语义包括怜悯、宽仁、温和与恩惠；“恩慈”较自然地涵盖慈悯与仁厚，而不限定为法庭式的“怜悯”。
theological_decisions:
- issue: 本节是否明确教导死人复活
  choice: 正文保留“从睡眠中起来”的意象，不明说死亡或复活。
  alternative: 将其明确译为身体复活，或解释为道德、属灵上的觉醒。
  rationale: 吉兹语只有睡眠与起来的措辞，本节未出现“死亡”等进一步限定；保留歧义可避免替原文解决神学张力。
- issue: 单数“义人”的身份
  choice: 译作个体性的“义人”，不进一步标明身份。
  alternative: 解释为弥赛亚人物，或集体性的义人群体。
  rationale: 原文为单数，但仅凭本句不足以确定其专指对象，因此不导入特定教派或解释传统。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“义人”“正义”“良善”“恩慈”保持智慧文学和启示文学的伦理语域；句式保留原文“起来／起身”的修辞重复，同时以汉语标点理清层次。
