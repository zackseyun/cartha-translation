base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/002.yaml
  text: Do not let your spirit be grieved because of the times[a], for the Holy and Great One has appointed days for all.
translation:
  language: zh_hans
  text: 你们的心灵不要因这些时代而忧伤，因为圣洁而伟大的那一位已为一切[a]定下了日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为一切”也可理解为“为所有人”。吉兹语末尾的短语含义宽泛，既可能泛指一切事物，也可能指所有人。
    reason: lexical_alternative
lexical_decisions:
- source_word: አትሕዝኑ፡ መንፈስክሙ
  choice: 不要……心灵忧伤
  rationale: 否定命令与“你们的灵”构成内在情感表达；汉语用“心灵忧伤”自然庄重，也保留了“灵”的内在含义。
- source_word: በአዝማን
  choice: 因这些时代
  rationale: 介词短语在此最自然地表示忧伤的缘由；“时代”保留复数时间概念及启示文学中动荡时期的意味。
- source_word: መዋዕለ
  choice: 日子
  rationale: 该词本义为“日子”，虽可延伸指时期，直译在汉语中仍通顺，并保留原文具体意象。
- source_word: ወሀበ
  choice: 定下了
  rationale: 基本义是“给”，与“日子”连用时含有赐予、分配或安排之意；“定下”表达神所规定的时间，同时不作过度阐释。
- source_word: ቅዱስ፡ ወዐቢይ
  choice: 那圣洁而伟大者
  rationale: 将并列形容语作为同一位神圣对象的尊称处理；措辞庄重而符合现代汉语。
- source_word: ለኵሉ
  choice: 为一切
  rationale: 原语范围宽泛，未明说“一切事物”或“所有人”；“一切”最能保留这种未决性。
theological_decisions:
- issue: “为一切”的指涉范围
  choice: 为一切
  alternative: 为所有人；为一切事物
  rationale: 原文可涵盖万事，也可指所有人。正文不补出“事物”或“人”，以免把神所定日子的范围单方面限定，并在脚注说明两种可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“心灵忧伤”保留内在属灵语感；“那圣洁而伟大者”维持启示文学的尊称风格。脚注标记置于与其所释短语相邻的句末。
