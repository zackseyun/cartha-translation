base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/002.yaml
  text: And I saw the balances of righteousness[a], how they are weighed according to their lights, the width of their places, and the day of their appearing; and their revolution brings forth lightning, and their revolution is according to the number of the angels[e][d][c][b], and they keep faith with one another.
translation:
  language: zh_hans
  text: 我又看见公义的天平[a]，看见它们怎样按各自的光被称量，也看见各自所在之处的宽度和它们显现的日子；它们的运转产生闪电；它们的运转依照众天使的数目[b]，它们彼此守信[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头的异象语句较难理解。“天平”也可理解为“秤”；这里似乎把公义的衡量与天上的光、位置和运行联系起来。
    reason: textual_difficulty
  - marker: b
    text: “依照众天使的数目”也可译作“按天使的计数”；原文没有明说是谁在计数。
    reason: lexical_alternative
  - marker: c
    text: “彼此守信”的主语可能是前述运行的天上实体，也可能是众天使；原文没有明确消除这种歧义。
    reason: alternative_reading
lexical_decisions:
- source_word: መዳልወ፡ ጽድቅ
  choice: 公义的天平
  rationale: 按修订后的词义将መዳልወ译为“天平”，并保留ጽድቅ的属格式表达，避免重新解释为“公义的发光体”。
- source_word: ይደለው
  choice: 被称量
  rationale: 该动词表示称量；采用被动式，以贴合原文形态及天平意象。
- source_word: በብርሃናቲሆሙ
  choice: 按各自的光
  rationale: 保留“光”的复数和分配性含义；“各自”使中文中的复数指向更清楚。
- source_word: ሰረኃበ፡ መካናቲሆሙ
  choice: 各自所在之处的宽度
  rationale: 依据校勘所指出的OCR问题，将关键词理解为“宽度”，而非“安歇”；መካናቲሆሙ简洁译作“各自所在之处”。
- source_word: ዕለተ፡ ክነቶሙ
  choice: 它们显现的日子
  rationale: 将ዕለተ译作“日子”，将ክነቶሙ按“显现”理解，不与后面的“运转”混同。
- source_word: ሚጠቶሙ
  choice: 它们的运转
  rationale: 该词在本节两次出现，指转动、回转或运行；统一译为“运转”，体现天体运动，同时区别于“时节”。
- source_word: መብረቅ፡ ይወልድ
  choice: 产生闪电
  rationale: 直译其生发意象；现代中文用“产生”比“生出”更自然，但仍保留因果关系。
- source_word: በኍልቈ፡ መላእክት
  choice: 依照众天使的数目
  rationale: 原文是介词短语，并无“被计算”的动词，因此不补入额外动作；宇宙异象语境下将መላእክት译为“天使”。
- source_word: ሃይማኖቶሙ፡ የዓቅቡ፡ በበይናቲሆሙ
  choice: 彼此守信
  rationale: 保留忠信、可靠及相互协调的语义，不把主语武断限定为天使或天体。
theological_decisions:
- issue: “公义的天平”的所指
  choice: 保留为异象中的“公义的天平”，不将其解释为星体、天使或义人。
  alternative: 理解为“公义的发光体”或象征义人的天体。
  rationale: 修订后的原文词义支持“天平”；但异象中天平与光、位置及运转的关系仍不透明，译文不替读者消解这种张力。
- issue: 末句“彼此守信”的主语
  choice: 沿用最近的复数实体“它们”，并以“彼此守信”保留指称含混。
  alternative: 明确译成“众天使彼此守信”或“众天体彼此协调”。
  rationale: 原文语法及上下文容许不同所指；不应添加一个原文没有明确指定的神学主体。
- issue: 天使数目与宇宙运转的关系
  choice: 译为“运转依照众天使的数目”。
  alternative: 译为“运转由天使计算”或“天使按数目管理运转”。
  rationale: 原文只有“依照/按……数目”的关系，没有明确陈述计算者或管理者，故避免引入天使治理宇宙的额外主张。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“称量”“显现”“运转”“守信”保留异象文体的凝练感；用冒号和分号梳理原文密集并列结构。所有不确定处以脚注说明，不在正文中强行解释。
