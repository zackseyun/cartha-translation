base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/004.yaml
  text: 'And he said to me[d][c][b][a], “The Lord of Spirits has shown you their names: these are the names of the holy ones who dwell upon the dry ground and believe in the name of the Lord of Spirits forever and ever.”'
translation:
  language: zh_hans
  text: 他对我说：“万灵之主已经把它们所象征的意义[a]指示给你；这些是住在干地上[b]、并且永永远远信靠[c]万灵之主之名的圣者的名字。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“它们的比喻”或“它们的象征”。这里所指的很可能是异象中所见之物所象征的意义。该吉兹语短语的具体句法仍有难处；有些译法较宽泛地作“关于它们”。
    reason: alternative_reading
  - marker: b
    text: “干地”也可译作“陆地”或“地上”；直译保留了它与天上景象可能形成的对照。
    reason: lexical_alternative
  - marker: c
    text: “信靠”也可译作“相信”或“信奉”。原词兼有相信和倚靠的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስለ ዘዚአሆሙ
  choice: 他们的形象
  rationale: 将ምስለ理解为名词“形象、相似之物”的关联形式，而非介词“与……同在”。这符合异象中可被“显给你看”的对象，也避免把原文下一分句才明确出现的“名字”提前重复；因词形和句法仍有争议，以脚注保留其他可能。
- source_word: እግዚአ መንፈሳት
  choice: 万灵之主
  rationale: 这是《以诺一书》中固定的神圣称号。“万灵之主”简洁庄重，并能自然表达其统摄众灵的含义。
- source_word: አርአየከ
  choice: 已经把……显给你看
  rationale: 保留使役性的“使看见、显明”意味及已经发生的启示语境。
- source_word: እሉ እሙንቱ አስማቲሆሙ ለቅዱሳን
  choice: 这些就是那些圣者的名字
  rationale: 将代词后缀与后置名词理解为闪语常见的预指结构，即“圣者的名字”；“这些就是”保留原文指示词与代词的强调作用。
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: 他们住在干地上
  rationale: የብስ具体指干燥的地面或陆地。“干地”保留其具体意象，以及地上居住者与天上景象之间可能存在的对照。
- source_word: ወየአምኑ በስሙ
  choice: 并且……信靠……的名
  rationale: 该动词兼有相信与倚靠之义；“信靠”在现代汉语中自然地涵盖认信和信赖，同时保留“名”的原文表达。
- source_word: ለዓለመ ዓለም
  choice: 永永远远
  rationale: 采用庄重而通行的汉语永恒时限表达，体现原文叠加强调。
theological_decisions:
- issue: 住在干地上的“圣者”是谁
  choice: 译文按修饰语将他们呈现为住在地上并信靠上主之名的圣者
  alternative: 天上的圣者，或有意兼指天上与地上的圣者
  rationale: “住在干地上”和“信靠……的名”最自然地指向地上的忠信者；但译文不额外加入“人类”等限定，以免排除启示文学语境中可能保留的张力。
- issue: 异象所显的是“形象”还是“名字”
  choice: 形象
  alternative: 关于他们；他们的比喻；他们的名字
  rationale: 原文在下一分句明确使用“名字”一词，而前面的ምስለ更可解释为“形象、相似之物”的形式。译作“形象”既避免无依据地重复“名字”，也与“显给你看”的视觉语境相合；文本歧义另以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他对我说”保持异象叙事的直接性；“万灵之主”“圣者”“永永远远”维持启示文学的崇高语域。对首句有争议的词形不作教义化消解，而在正文选择最贴近视觉语境的“形象”，并以脚注保留其他读法。
