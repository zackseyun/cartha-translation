base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/001.yaml
  text: And I saw other lightnings and the stars of heaven[a], and I saw how he calls them all by their respective names[d][c][b], and they hear him.
translation:
  language: zh_hans
  text: 我又看见其他闪电和天上的众星；我看见他怎样按各自的名字逐一呼唤它们，它们也听见他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听见他”在这里也可能含有听命、顺从的意思。
    reason: 说明原词基本义与语境中可能蕴含的回应、服从之义，同时不在正文中消除歧义。
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我又看见
  rationale: 保留异象叙事中重复出现的“我看见”句式；“又”自然承接前文，并体现词首连接成分。
- source_word: ካልአ መባርቅተ
  choice: 别的闪电
  rationale: 将ካልአ视为修饰复数名词መባርቅተ的形容词；闪语破碎复数可搭配单数形式的形容词，因此不另断为“另一件事”。
- source_word: ወከዋክብተ ሰማይ
  choice: 和天上的众星
  rationale: 准确表达“天之星”，以“众星”保留复数和庄重的启示文学语体。
- source_word: ከመ ይጼውዖሙ
  choice: 他怎样……呼唤它们
  rationale: 在“我看见”之后用“怎样”表达观察其行动的结构；保留未明说身份的阳性单数主语“他”。
- source_word: ለኵሎሙ በበአስማቲሆሙ
  choice: 逐一按名
  rationale: “逐一”体现重复介词በበ-的分配意义，也涵盖“全都”的总体范围；汉语简洁自然。
- source_word: ወይሰምዕዎ
  choice: 它们也听见他
  rationale: 坚持动词“听见”的基本义，不在正文中直接强化为“顺从”；略带拟人色彩的表述符合本节的宇宙异象。
theological_decisions:
- issue: 众星和闪电是仅仅听见呼唤，还是作为受神权柄支配的天上存在而顺从
  choice: 它们也听见他
  alternative: 它们也听从他
  rationale: 原词的基本义是“听见”，语境可能包含回应或服从，但不宜把这种含义直接定死；译文保留天体拟人化及其神学张力。
- issue: 呼唤者的身份是否应在译文中明确为上帝
  choice: 保留代词“他”
  alternative: 上帝呼唤它们
  rationale: 本节原文只使用第三人称单数动词形式，没有在本句明说主语身份；译文不补入解释性称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我又看见……我看见……”保留启示文学的重复节奏；“逐一按名”表达分配意义，避免生硬的“按它们各自的名字”。
