  yaml_path: translation/extra_canonical/1_enoch/043/003.yaml
  text: And I asked the angel who went with me[a], who showed me what was hidden, “What are these?”
translation:
  language: zh_hans
  text: 我问那位与我同行、向我显明隐藏之事[a]的天使：“这些是什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“隐秘之事”或“隐藏的事物”。吉兹语原词指在异象显明以前一直被遮蔽的实情。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: 我问
  rationale: 该动词源自“询问、求问”之义；下文紧接直接问句，因此译为“我问”最自然。
- source_word: መልአክ
  choice: 天使
  rationale: 在此启示文学语境中，这位同行者负责展示并解释异象，显然是属天的使者；“天使”比泛称“使者”更贴合语境。
- source_word: ዘየሐውር ምስሌየ
  choice: 那位与我同行
  rationale: 保留关系从句所表达的陪同行动，同时采用自然、庄重的现代汉语。
- source_word: ዘአርአየኒ
  choice: 把……指给我看
  rationale: 原词意为“使我看见、给我看”；“指给我看”既保留视觉性，也符合异象中天使引导观看的情境。
- source_word: ኅቡእ
  choice: 隐藏之事
  rationale: 原词指被隐藏、尚未显明的事物或实情；此译保留启示文学中隐而后显的意象，并不把它限定为某种专门的秘密知识。
- source_word: ምንት እሙንቱ እሉ
  choice: 这些是什么？
  rationale: 指示语最自然地回指异象中刚看到的事物或现象；经文本身不足以确定所指为有位格者，因此不译成“这些是谁”。
theological_decisions:
- issue: 启示文学中被揭示之对象的表达
  choice: 隐藏之事
  alternative: 隐秘之事；隐藏的事物
  rationale: “隐藏之事”保留属天现实先被遮蔽、后在异象中显明的张力，同时避免加入技术化的神秘知识含义。
- issue: 问句所指是事物还是有位格者
  choice: 这些是什么？
  alternative: 这些是谁？
  rationale: 原文的疑问表达可依所指对象理解，但本节自身未明确表明所见者具有位格；采用更自然的事物性问法，同时不进一步界定其本质。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“那位与我同行、把……指给我看的天使”保留原文连续关系从句的结构和辨识功能；脚注标记置于其实际说明的“隐藏之事”之后。
