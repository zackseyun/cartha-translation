base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/002.yaml
  text: And there I saw a holy mountain[a], and beneath the mountain water from the east, and its flow toward the north.
translation:
  language: zh_hans
  text: 我在那里看见一座圣山；山下有从东方来的水[a]，其水流向北方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的结构为“水，从东方”；下一分句说明这水流向北方。
    reason: 说明原文“水＋从东方”的表达结构，以及后句所指的水流方向，避免将“从东方”误解为另一处水源或属格表达。
lexical_decisions:
- source_word: ደብረ
  choice: 山
  rationale: 该词通常指山或高地；此处译作“山”，既符合异象中的地貌，也自然简明。
- source_word: ቅዱሰ
  choice: 圣
  rationale: 该形容词表示分别为圣、具有神圣性质；“圣山”保留了原文的神学分量。
- source_word: መትሕተ ደብር
  choice: 山下
  rationale: 这是直接的空间表达；“山下”比“在山的下面”更凝练自然。
- source_word: ማይ
  choice: 水
  rationale: 原词本义为“水”；虽然后文显示它在流动，但不在此处擅自具体化为“河”或“溪”。
- source_word: እመንገለ ጽባሕ
  choice: 从东方而来
  rationale: 原短语表示从东方或日出方向而来；此译法清楚保留其方向含义。
- source_word: ውሕዘቱ
  choice: 水流
  rationale: 该词指这水的流动或流向；“水流”在现代汉语中自然，并避免另行增添“河流”这一实体。
- source_word: መንገለ ሰሜን
  choice: 朝向北方
  rationale: 该方向短语表示向北；与前面的“水流”连用，准确表达其运动方向。
theological_decisions:
- issue: 是否以明确具有神学色彩的词语翻译ቅዱሰ
  choice: 圣山
  alternative: 神圣的山
  rationale: 以诺异象地理中的圣洁是场景意义的一部分；“圣山”简洁庄重，也比一般性的表述更好地保留原文力度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“有”和“而来”是为汉语语法与连贯性所作的最低限度补足；分号呈现异象地点与山下水流之间的结构关系。
