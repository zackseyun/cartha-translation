base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/003.yaml
  text: And I saw another mountain toward the east[a], higher than this one; and between them was a deep ravine, but not wide[d][c][b], and water was flowing in it toward the mountain.
translation:
  language: zh_hans
  text: 我又看见，在东方[a]有另一座山，比这座更高[b]；两山之间有一道深而不宽的峡谷，谷中有水流向那座山[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东方”原文也可按其字面意象译作“朝向黎明之处”或“日出方向”。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“更高”的词也可表示“更长”“更广大”或“更延展”。
    reason: lexical_alternative
  - marker: c
    text: 末句较难确定。原文最直接的意思是：峡谷中有水，水正向山移动。
    reason: textual_difficulty
lexical_decisions:
- source_word: መንገለ ጽባሕ
  choice: 在东方
  rationale: ጽባሕ本义与清晨、黎明及东方有关；此处作方位语，译作“在东方”最贴近原文，也避免无根据地具体化为“东北方”。
- source_word: ካልአ ደብረ
  choice: 另一座山
  rationale: ካልአ表示另一个或第二个；“另一座山”自然地承接异象中先前提到的山。
- source_word: ዘይነውኅ እምዝ
  choice: 比这座更高
  rationale: 该词可指更长、更广大或更高；用于比较山体时，“更高”最合乎上下文，但脚注保留其他可能。
- source_word: ማእከሎሙ
  choice: 两山之间
  rationale: 复数代词指前述两座山；明确译为“两山之间”符合现代汉语表达。
- source_word: ቈላ ዕሙቀ
  choice: 一道深……的峡谷
  rationale: 该组合描写低陷而深的地形；“峡谷”能自然表达此处具体而险峻的异象景观。
- source_word: አልቦ ርሐበ
  choice: 不宽
  rationale: 原文直译为“没有宽度”；“不宽”简洁且保留原文的否定表达，而不强化为“狭窄”。
- source_word: ቦቱኒ ማይ
  choice: 谷中有水
  rationale: 该短语把水定位在峡谷之中；此译保留其处所意义。
- source_word: የሐውር መንገለ ደብር
  choice: 流向那座山
  rationale: 动词基本义为行走、移动；以水为主语时译作“流”最自然，方向短语“向山”则照原文保留。
theological_decisions:
- issue: 异象地貌应保持具体，还是在正文中作象征性解释
  choice: 保留山、峡谷和水等具体异象景物
  alternative: 在译文中将这些地貌直接释为象征，或泛化为某个地方
  rationale: 原文以具体地貌构成异象场景；翻译不预先断定其象征意义，以免把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“我又看见”保持异象叙述的连续性；“深而不宽”贴近原文的并列和否定结构。所有不确定性均以脚注保留，不在正文中作过度解释。
