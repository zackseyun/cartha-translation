  text: And to the west of this was another[b][a],
translation:
  language: zh_hans
  text: 在这以西，另有一个[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文十分简略，只说“另一个”，没有明说所指的是山、地方，还是异象中的其他事物。
    reason: alternative_reading
  - marker: b
    text: 旧译或作：“西边的路是给这另一个的。”但这里的“መንገለ”按本章上下文更宜理解为方位介词，即“在……一边／朝向……”。
    reason: previous_rendering
lexical_decisions:
- source_word: መንገለ፡ ዐረቡ
  choice: 在……以西
  rationale: 此处መንገለ在上下文中作方位介词，与ዐረቡ合起来表示“在……以西”，不是名词“道路”；这样也符合该异象地貌描写中的空间关系。
- source_word: ለዝ
  choice: 这
  rationale: 介词与指示词共同表达相对方位，即“在这（所指之物）以西”；中文用“这”保留原文简略的指称。
- source_word: ካልእ
  choice: 又有一个
  rationale: 该词表示“另一个”，并在句中独立使用。译文不补出“山”等名词，以保留吉兹文未明说所指对象的省略。
theological_decisions:
- issue: 异象描述中“另一个”所指为何
  choice: 保留“又有一个”，不补明名词
  alternative: 又有一座山／另有一处
  rationale: 现存吉兹文片段只说“另一个”，没有明示其所指。虽然上下文可能暗示某种地貌，正文仍不应替原文消除歧义。
translation_notes:
  register: 采用自然而庄重的现代标准汉语。“在这以西”明确呈现相对方位；“又有一个”保留原文的省略和悬念，不依据上下文擅自补出“山”。脚注标记按英文咨询层次序置于相关短语之后。
