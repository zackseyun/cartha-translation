base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/001.yaml
  text: And from there I went to the middle of the earth[a], and I saw a blessed place, shaded[c][b], in which there were trees with abiding and sprouting branches from a tree that had been cut down.
translation:
  language: zh_hans
  text: 从那里，我走到大地中央[a]；我看见一个蒙福、有树荫遮蔽的地方，那里有树木，枝条长存并从一棵被砍下的树上萌发[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地中央”也可译作“大地中心”或“地的中间”。这里保留异象旅程中的地理表达，不确定它是否指某个可定位的普通地区。
    reason: lexical_alternative
  - marker: b
    text: 本节的植物描写在埃塞俄比亚文中较难确定。末句大概描写枝条从一棵已被砍下的树上重新萌发，但树木、枝条与被砍之树之间的确切句法关系并不完全清楚。
    reason: textual_variant
  - marker: c
    text: 另可理解为：“那里有树木，带着长存并萌发的枝条。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ማእከለ ምድር
  choice: 大地中央
  rationale: 保留异象旅程中的宇宙地理意味；“大地”比局部性的“土地”更贴合语境。
- source_word: መካነ ቡሩከ
  choice: 一个蒙福的地方
  rationale: 自然表达该地点带有福分的性质，同时不把它进一步认定为乐园或伊甸。
- source_word: ጥሉለ
  choice: 荫蔽
  rationale: 按括号内读法表达有树荫遮蔽的景象；原文传抄与句法均有不确定性，故另加注说明。
- source_word: ዕፀወ / አዕፁቀ
  choice: 树木／枝条
  rationale: 分别保留原文明确出现的树木与枝条两个植物意象，不将二者合并或遗漏。
- source_word: ዘይነብር ወይሠርፅ
  choice: 长存，并……萌发
  rationale: 前一动词表达持续、存留，后一动词表达抽芽或生长；译文保留持续生命与新生的双重意象。
- source_word: እምዕፅ ዘተመተረ
  choice: 从一棵被砍下的树上
  rationale: 直译枝条与被砍之树的来源关系，同时不额外解释其象征意义。
theological_decisions:
- issue: 本节是普通地貌描写，还是具有象征意义的神圣地理
  choice: 保留“大地中央”“蒙福的地方”等具体异象地理，不在正文中作寓意解释。
  alternative: 直接把该地认定为乐园或伊甸，或淡化为一般肥沃地区。
  rationale: 经文本身带有神圣意味，却没有在本节给该地命名；译文应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“蒙福”保留宗教语感但不过度解释；“荫蔽”“萌发”维持具体而富有生命力的异象画面。脚注标记均置于正文相应位置。
