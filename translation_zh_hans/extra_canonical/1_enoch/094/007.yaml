base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/007.yaml
  text: Woe to those who build their houses by sin, for they will be torn down from all their foundations; [and they will fall by the sword;] and those who acquire gold and silver will quickly be destroyed in judgment.
translation:
  language: zh_hans
  text: 祸哉，那些以罪恶建造房屋的人！他们的房屋必连同一切根基被拔除；[他们也必倒在刀下；][a] 那些积聚金银的人，必在审判中迅速灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们也必倒在刀下”在所据版本中以方括号标出，表明这句话的文本归属存在不确定性。
    reason: 保留底本明确标示的校勘不确定性，不把有疑问的短句无提示地纳入正文。
lexical_decisions:
- source_word: በኃጢአት
  choice: 以罪恶
  rationale: 介词短语表示建造房屋所凭借或采用的不义手段；“以罪恶”既贴近原文，也保留其道德指控的概括性。
- source_word: እምኵሉ፡ መሠረቶሙ፡ ይትነሠቱ
  choice: 他们的房屋必连根基全被拔除
  rationale: 原文意象是从全部根基处被拔起或拆毁；译为“连根基全被拔除”保留彻底毁灭的画面，并在中文中明确承接前面的房屋。
- source_word: ያጠርይዎ፡ ለወርቅ፡ ወለብሩር
  choice: 积聚金银
  rationale: 动词指取得、聚敛或积蓄财物；“积聚”自然传达持续聚财之意，不额外断定财富本身的来源。
- source_word: በጽነኔ
  choice: 在审判中
  rationale: 依此处语境及校勘传统，理解为审判或定罪的处境；避免另加原文未明说的“不义”。
- source_word: ፍጡነ፡ ይትሐጐሉ
  choice: 必迅速灭亡
  rationale: 保留副词“迅速”及被毁灭、消亡的强烈结果意义。
theological_decisions:
- issue: 罪恶与建造房屋的关系
  choice: 以罪恶建造房屋
  alternative: 在罪中建造房屋
  rationale: “以罪恶”较清楚地表达罪是其建业置产的手段，同时不把经文收窄为某一种具体经济罪行。
- issue: 金银与审判的关系
  choice: 那些积聚金银的人，必在审判中迅速灭亡
  alternative: 那些以不义积聚金银的人必迅速灭亡
  rationale: 原文当前证据支持“审判”这一表达；不把“不义”直接并入积聚金银的行为，以免替经文消除其句法与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的警告体。“祸哉”保留先知性宣告语气；“连根基全被拔除”传达原文彻底倾覆的具体意象。正文中的方括号及脚注共同呈现底本的文本疑义。
