base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/004.yaml
  text: But seek and choose for yourselves righteousness and a good life[a], and walk in the paths of peace[c][b], so that you may live and prosper.
translation:
  language: zh_hans
  text: 但你们要寻求，并为自己选择正义和美善的生活[a]；行在平安的道路上[b]，好使你们存活并兴盛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本处埃塞俄比亚文的词序与切分略有疑难；“美善的生活”也可理解为“良善的生命”或“美好的生活”。
    reason: textual_variant
  - marker: b
    text: 或译：“行在和平之道上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: እላ
  choice: 但
  rationale: 依最新校勘判断，此处很可能是አላ（“但、却”）的转写或OCR异文，用作转折连词。
- source_word: ፍቅዱ
  choice: 寻求
  rationale: 这是ፈቀደ的复数祈使形式，在此表示主动追求或渴求；译作“寻求”可避免误解为“爱”。
- source_word: ወኀረዩ ለክሙ
  choice: 为自己选择
  rationale: 保留选择行为及ለክሙ的受益、反身意味。
- source_word: ጽድቀ
  choice: 正义
  rationale: 此词表示伦理和宗教意义上的正直、公义；现代汉语正文采用“正义”，既自然又保留其道德广度。
- source_word: ወሕይወተ ኄራተ
  choice: 和美善的生活
  rationale: 按词组理解为“美好的／美善的生活”；“美善”比单纯“美好”更能显出伦理色彩。
- source_word: ወሖሩ
  choice: 行
  rationale: 保留以道路喻生活行为的圣经式表达，同时“行在”符合现代庄重汉语。
- source_word: በፍኖዋተ ሰላም
  choice: 在平安的道路上
  rationale: 保留复数道路意象；“平安”兼具和平、安宁与福祉的语义。
- source_word: ወተሐደዉ
  choice: 好使你们存活
  rationale: 按结果或目的关系理解，并保留“活着／存活”的基本意义。
- source_word: ወትደለዉ
  choice: 并兴盛
  rationale: 表达顺遂、昌盛的智慧文学结果，而不局限于物质致富。
theological_decisions:
- issue: ጽድቀ应译为“正义”还是“公义”
  choice: 正义
  alternative: 公义
  rationale: 原词可涵盖伦理正直和公正；“正义”对普通现代读者更直接，也不预先套入特定宗派术语。
- issue: 结尾是并列命令还是目的／结果
  choice: 好使你们存活并兴盛
  alternative: 你们就要存活并兴盛
  rationale: 源文连续连接词允许并列或结果性理解；上下文的劝勉结构支持目的／结果译法，但不把兴盛限定为物质福分。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“行在……道路上”保留智慧文学的行为隐喻；正文不沿用英语咨询层中已被校正的“爱正义”读法。
