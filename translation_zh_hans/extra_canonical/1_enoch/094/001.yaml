base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/001.yaml
  text: 'And now I say to you[a], my children: love righteousness and walk in it; for the paths of righteousness are worthy and acceptable[c][b], but the paths of iniquity will quickly be destroyed and vanish.'
translation:
  language: zh_hans
  text: 现在，我对你们说，我的孩子们：要爱慕公义，行在其中；因为公义的道路是合宜且蒙认可的[a]，不义的道路却将迅速被毁灭并消失[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “合宜且蒙认可”所据的吉兹语措辞较难确定；也可理解为“配得且被接纳”或“适当且蒙认可”。原文保留两个评价成分，且未说明认可者是谁。
    reason: lexical_alternative
  - marker: b
    text: “不义”也可译作“不法”或“恶行”；这里与“公义”构成两条道德道路的对照，不一定只指某一种具体罪行。
    reason: lexical_alternative
lexical_decisions:
- source_word: እብለክሙ
  choice: 我对你们说
  rationale: 保留直接告诫的言说公式，语气自然而庄重。
- source_word: ደቂቅየ
  choice: 我的孩子们
  rationale: 体现亲属式、教诲式称呼，又不把听众限定为男性。
- source_word: አፍቅርዋ ለጽድቅ
  choice: 要爱慕正义
  rationale: “爱慕”比单纯“爱”更符合对道德品格的劝勉；“正义”在现代汉语中可涵盖正直、公义的伦理意义。
- source_word: ወባቲ ሖሩ
  choice: 并行在其中
  rationale: 保留“行走”这一伦理道路隐喻，代词回指正义。
- source_word: ፍኖዋተ ጽድቅ
  choice: 正义的道路
  rationale: 保留具体的道路意象，并与下文“不义的道路”形成鲜明对照。
- source_word: ይደሉ ወይትወከፍ
  choice: 是合宜而蒙悦纳的
  rationale: 保留两个并列评价：前者表达适宜、配得，后者表达被接受或认可；不将二者合并。
- source_word: ፍኖዋተ ዓመፃ
  choice: 不义的道路
  rationale: 该词在本节与ጽድቅ构成直接的道德反义关系；译作“不义”亦避免与下一节表示暴力或压迫的用词混同。
- source_word: ፍጡነ
  choice: 迅速
  rationale: 准确传达速度和警告的紧迫感，且符合庄重书面语。
- source_word: ይትሐጐላ ወየሐፅፃ
  choice: 必迅速毁灭、消失
  rationale: 保留两个递进或强化性的动词，分别表达败亡与不复存在。
theological_decisions:
- issue: ጽድቅ在智慧劝诫中的译法
  choice: 正义
  alternative: 公义；正直
  rationale: 此处既指应当爱慕的道德品质，也形成可行走的伦理道路。“正义”是普通现代读者易懂且覆盖面较广的表达；不把它缩窄为纯法律意义。
- issue: 正义道路的双重评价
  choice: 合宜而蒙悦纳
  alternative: 配得而被接纳；适当而蒙认可
  rationale: 原文措辞略显困难，但明显包含两个评价成分。译文保留其并列结构和“被接纳”的被动含义，不明确指定悦纳者是谁。
- issue: ዓመፃ的道德含义
  choice: 不义
  alternative: 不法；恶行；暴虐
  rationale: 在本节的平行对照中，它是“正义”的直接反面。选择“不义”保留宽泛的罪恶、不公含义，同时不将其专门化为暴力行为。
translation_notes:
  register: 采用现代、庄重且易懂的劝诫体。“我的孩子们”保留父辈或教师式口吻；“行在其中”保留古代智慧传统中的道路隐喻，但整体句法按现代汉语组织。
