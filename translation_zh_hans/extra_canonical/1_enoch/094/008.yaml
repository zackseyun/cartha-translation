base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/008.yaml
  text: Woe to you[a], rich ones, for you have trusted in your riches, and from your riches you will depart[b], because you did not remember the Most High in the days of your riches.
translation:
  language: zh_hans
  text: 你们这些富有的人有祸了！因为你们倚靠自己的财富，必离开自己的财富[a]；因为在你们富有的日子，你们没有记念至高者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“从你们的财富中出去”；可能指财富被剥夺，也可能更广泛地指人在审判中离开并留下财富。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: 你们……有祸了
  rationale: 保留先知性审判宣告的语气；现代汉语中“有祸了”既自然，也比单纯的“哀哉”更清楚。
- source_word: አብዕልት
  choice: 富足的人
  rationale: 这是对富有者的复数直接称呼；“富足的人”兼顾词义和庄重语体。
- source_word: ብዕልክሙ
  choice: 自己的财富／你们富足
  rationale: 该词在本节反复出现，基本义为财富、富足。按汉语搭配分别译作“自己的财富”和“你们富足”，同时尽量保留反复所形成的修辞关联。
- source_word: ተወከልክሙ
  choice: 倚靠
  rationale: 表达把信赖与安全寄托于财富，保留道德和神学上的责备意味。
- source_word: እምነ፡ ብዕልክሙ፡ ትወፅኡ
  choice: 必离开自己的财富
  rationale: 原文直陈“从你们的财富出去／离开”；此译保留空间性的分离意象，又符合现代汉语表达。
- source_word: ለልዑል
  choice: 至高者
  rationale: 犹太启示文学中常见的神圣称号，简洁而庄重。
- source_word: ኢተዘከርክምዎ
  choice: 没有记念
  rationale: 准确传达“没有记起、没有铭记”的伦理指控；“记念”适合庄重宗教文本。
- source_word: በመዋዕለ፡ ብዕልክሙ
  choice: 在你们富足的日子
  rationale: 保留原文“日子”的时间表达，并指出这是他们处于富足境况的时期。
theological_decisions:
- issue: “从财富出去／离开财富”的具体含义
  choice: 译作“必离开自己的财富”，不说明离开的具体方式
  alternative: 译作“必被夺去财富”，或“必死去，留下财富”
  rationale: 吉兹语措辞简短而有意象，可能指财富被剥夺，也可能指人在审判中离开并留下财富。正文不把这种张力限定为死亡、没收或流放。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“财富／富足”的词根呼应，并以感叹句呈现直接的审判宣告。
