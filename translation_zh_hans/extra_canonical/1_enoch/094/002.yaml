base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/002.yaml
  text: And to wise men from a generation[a], the paths of violence and death will be revealed[b], and they will keep far from them and will not follow them.
translation:
  language: zh_hans
  text: 暴力与死亡的道路将向某一代中的某些人[a]显明；他们必远离这些道路，也不沿着这些道路而行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “某些人”也可理解为“为人所知的人”；传统上亦有译作“智慧人”的。原词的形式及其与“人”和“代”的搭配容许不同理解；“某一代”保留原文单数“代”，不表示“世世代代”。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ለሰብእ፡ እሙራን
  choice: 某些人
  rationale: እሙራን可作“已知的、特定的”，与“人”连用时可表达“某些人”。此译比“智慧人”更贴近该词的被动分词形式，同时用脚注保留词义争议。
- source_word: እምትውልድ
  choice: 这一代中的
  rationale: 原文是单数“代”，并无明确的迭代表达，因此不扩译为“世世代代”。介词关系在本句中略显含混；“这一代中的”使现代汉语通顺而不增加跨世代之意。
- source_word: ይትከሠት
  choice: 将看清
  rationale: 该动词表示显露、显明。结合接受者与后续主动远离的语境，“将看清”自然表达道路向他们显明，但不说明启示的施动者。
- source_word: ፍኖዋተ
  choice: 道路
  rationale: 保留原文复数道路/路径的具体意象及其道德隐喻，不抽象改写为“行为”。
- source_word: ግፍዕ
  choice: 暴行
  rationale: 该词涵盖暴力、不义和压迫；“暴行”在此既凝练又保留其强烈的道德色彩。
- source_word: ሞት
  choice: 死亡
  rationale: 采用直接义，不扩释为毁灭或通向死亡的结局。
- source_word: ይርኅቁ፡ እምኔሆሙ
  choice: 远离这些道路
  rationale: 原文意为从它们那里远离；明确代词所指为前述道路，可避免汉语歧义。
- source_word: ኢይትለውዎሙ
  choice: 不跟随它们
  rationale: 直译“跟随”，并保持沿着道路而行的比喻。
theological_decisions:
- issue: 道德道路的具体意象与抽象伦理释义
  choice: 保留“暴行与死亡的道路”
  alternative: 暴力和致死的行为；通向死亡的不义之道
  rationale: 原文以复数“道路”构成鲜明的智慧文学意象；不把“死亡”解释成道路的结果，也不把意象消解成抽象行为。
- issue: 道路如何向人显明
  choice: 译作“将看清”，不明说施动者
  alternative: 将向他们启示；将被显明
  rationale: 原文动词表达显露，但未明确是谁使之显露。译文避免擅自加入上帝或其他施动者，从而保留语法和神学上的开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这一代中的某些人”保留单数“代”，避免原文并未明说的“世世代代”；分号呈现显明、远离与不跟随之间的推进关系。
