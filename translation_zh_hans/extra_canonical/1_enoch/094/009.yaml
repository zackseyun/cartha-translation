base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/009.yaml
  text: You have committed reproach and violence[a], and you have made yourselves ready for the day of the shedding of blood, and for the day of darkness[c][b], and for the day of the great judgment.
translation:
  language: zh_hans
  text: 你们犯下了侮辱和暴行[a]，又使自己准备好，面对流血之日[b]、黑暗之日和大审判之日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侮辱”也可译作“羞辱”或“毁谤”。
    reason: lexical_alternative
  - marker: b
    text: “流血之日”也可译作“血被倾倒之日”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርክምዋ፡ ለጽርፈት፡ ወለዓመፃ
  choice: 你们行了辱骂和暴行
  rationale: 按最新语法审定，将动词中的阴性单数宾语后缀理解为预指后面由 ለ 标示的宾语；因此这里是“行了／犯了”，并非“为……预备了它”。“辱骂”保留言语攻击之意，“暴行”则体现暴力与不义。
- source_word: ወድልዋነ፡ ኮንክሙ
  choice: 又使自己预备迎接
  rationale: 该结构表示成为预备妥当；中文以反身表达传达第二人称复数主体使自己处于预备状态。“迎接”使后续三个审判之日与动词自然衔接，但不说明这种预备是主动期待还是因恶行而注定面对。
- source_word: ለዕለተ፡ ክዕወት፡ ደም
  choice: 流血之日
  rationale: 简洁保留血被流出的动态含义；也可理解为“血被倾倒之日”。
- source_word: ወለዕለተ፡ ጽልመት
  choice: 黑暗之日
  rationale: 直接保留启示文学中的黑暗意象及反复出现的“……之日”句式。
- source_word: ወለዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: 以及大审判之日
  rationale: ኵነኔ 可指审判、判决或定罪；“大审判”最能保持庄严的末世语境，同时不预先限定为宣判还是定罪。
theological_decisions:
- issue: 末尾三个“日”是一般历史灾祸，还是末世性审判
  choice: 保留为一组审判性的日子，并以“大审判之日”收束
  alternative: 将其泛化为历史中的灾难和刑罚
  rationale: 原文重复“……之日”，并将流血、黑暗和大审判并列，具有鲜明的启示文学审判色彩，不宜淡化为一般后果。
- issue: “预备”是否表示甘愿期待审判
  choice: 仅说“使自己预备迎接”，保留其因自身行为而处于将面对审判之状态的张力
  alternative: 译成“你们期待”或“你们注定遭受”
  rationale: 原文表达预备或成为适合，却未明确说明其主观愿望；也不应在正文中额外加入宿命性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“……之日”的重复保留启示文学节奏；正文避免古奥词汇，也不引入特定宗派的末世论解释。
