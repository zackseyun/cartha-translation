base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/003.yaml
  text: 'And now I say to you[a], the righteous: do not walk in the paths of evil, nor in the paths of death, and do not draw near to them[b], lest you be destroyed.'
translation:
  language: zh_hans
  text: 现在，我要对你们这些义人说：不要行在邪恶的道路[a]上，也不要行在死亡的道路上；不要亲近他们[b]，免得你们灭亡[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “道路”也可译作“路径”；这里以行路比喻人的生活方向和行为方式。
    reason: lexical_alternative
  - marker: b
    text: “他们”最自然地指走在邪恶和死亡之路上的人；也可作较宽泛的理解，指与这些道路相关的人或事。
    reason: referential_ambiguity
  - marker: c
    text: “灭亡”也可译作“被毁灭”或“丧亡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 这是引出新一段劝诫的时间性话语标记；“现在”在现代汉语中自然，也保留了转折推进的作用。
- source_word: እብል ለክሙ ለጻድቃን
  choice: 我要对你们这些义人说
  rationale: 保留第一人称直接发言及对“义人”群体的称呼；“你们这些义人”明确呈现同位关系。
- source_word: ኢትሖሩ
  choice: 不要行在
  rationale: 该动词与“道路”搭配，构成生活道路的伦理隐喻；“行在”比单纯的“去”更能保留原文意象。
- source_word: በፍኖዋተ
  choice: 在……的道路上
  rationale: 原文为复数，指道路或路径；汉语以“道路”表达智慧劝诫中人生方向的隐喻，同时不失具体意象。
- source_word: እኩይ
  choice: 邪恶
  rationale: 上下文所说的是伦理意义上的恶；采用抽象名词，不将其擅自人格化为“恶者”。
- source_word: ሞት
  choice: 死亡
  rationale: 直译为“死亡”，保留原文鲜明而严肃的生命与死亡对照，不弱化为一般性的危险。
- source_word: ኢትቅረቡ ኀቤሆሙ
  choice: 不要靠近这些
  rationale: “这些”保留复数回指，却不在正文中强行限定它只指道路或只指与恶道相关的人，从而保留原文可能的指涉张力。
- source_word: ከመ ኢትትሐጐሉ
  choice: 免得你们灭亡
  rationale: 该结构表达应当避免的结果；“灭亡”兼具毁灭、丧亡之意，适合本段审判性的警告，也不限定为纯粹肉体死亡。
theological_decisions:
- issue: “不要靠近他们／它们”中复数代词的指代
  choice: 正文译作“不要靠近这些”，保留宽泛回指
  alternative: 明确译作“不要靠近这些道路”，或理解为“不要靠近走这些道路的人”
  rationale: 原文复数代词紧接“邪恶的道路”和“死亡的道路”，语法上可回指这些道路；但劝诫也可能包含不要亲近与这些道路相连的人或事。正文不擅自收窄，脚注说明两种理解。
- issue: 末句警告的性质
  choice: 译作“免得你们灭亡”
  alternative: “免得你们被毁灭”或“免得你们消逝”
  rationale: 原文可表达毁灭、丧亡或被除灭；“灭亡”保留末世审判语境中的严重性，却不武断指定毁灭的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“行在……道路上”保留原文的伦理道路意象；分号呈现两层并列警告。正文使用“这些”有意保留复数代词的指代弹性。
