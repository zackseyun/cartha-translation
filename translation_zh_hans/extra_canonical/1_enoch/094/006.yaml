base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/006.yaml
  text: Woe to those who build up unrighteousness and oppression[a], and who lay the foundation of deceit, for they will be swiftly overthrown[b], and they will have no peace.
translation:
  language: zh_hans
  text: 那些建造不义和欺压、又为诡诈奠定根基的人有祸了！[a]他们必迅速倾覆，[b]不得平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为诡诈奠定根基”一语的具体句法略有不确定；也可理解为“以诡诈为根基”。原文仍延续前面的建筑意象，并明确与诡诈或欺骗相连。
    reason: lexical_alternative
  - marker: b
    text: “倾覆”也可译作“拔除”或“推翻”；这里按上下文保留建筑物倒塌的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: 有祸了
  rationale: 这是宣告审判的祸患语；“有祸了”既保留先知性谴责的力度，也符合现代汉语宗教文体。
- source_word: የሐንጽዋ
  choice: 建造
  rationale: 保留原文明确的建筑意象，并与后面的“奠定根基”和“倾覆”相呼应。
- source_word: ለዓመፃ
  choice: 不义
  rationale: 涵盖道德悖逆与司法不公的广泛含义，不把词义限缩为单一的社会罪行。
- source_word: ወለግፍዕ
  choice: 和欺压
  rationale: 表达以强力压迫、侵害他人的社会性恶行，并与“不义”自然并列。
- source_word: ወይሣርርዋ ለጕሕሉት
  choice: 又为诡诈奠定根基
  rationale: 将ጕሕሉት按抽象名词“诡诈”处理，同时保留动词所呈现的奠基意象；不改写成形容词性的“虚假根基”。
- source_word: ፍጡነ
  choice: 迅速
  rationale: 直接表达行动很快发生，语言庄重而通俗。
- source_word: ይትነሠቱ
  choice: 倾覆
  rationale: 在本节连续的建筑意象中，“倾覆”既表达审判性的毁灭，也与前面的建造和奠基形成修辞呼应；该词的具体图像仍有解释空间。
- source_word: ወአልቦሙ ሰላመ
  choice: 不得平安
  rationale: 简洁保留原文“他们没有平安”的终局性审判宣告。
theological_decisions:
- issue: 是否把建造、奠基和倾覆的意象改写为抽象的作恶与受罚
  choice: 贯穿全节保留建筑意象
  alternative: 译为“那些行不义、欺压和诡诈的人必迅速灭亡”
  rationale: 原文以相互关联的建筑用语塑造审判图景；保留这些意象可呈现其启示文学张力，而不额外加入特定教义解释。
- issue: 诡诈与“根基”之间的语法关系
  choice: 译作“为诡诈奠定根基”
  alternative: 译作“奠定虚假的根基”或“以诡诈为根基”
  rationale: ጕሕሉት是表示诡诈、欺骗的名词；所选译法保留其名词性质，也不把原文尚存的不确定性过度解释为材质或方式。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“建造不义和欺压”有意保留原文较强的隐喻性，不将其平滑改写为普通的“行不义、施欺压”；句末“不得平安”保持审判宣告的凝练力度。
