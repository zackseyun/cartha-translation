base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/005.yaml
  text: And command them in the thought of your hearts[a], and do not let my words be blotted out from your hearts; for I know that sinners will tempt men to practice evil wisdom, and no place will be found for it[f][e][d][c][b], and no temptation will diminish.
translation:
  language: zh_hans
  text: 你们要从心里嘱咐他们[a]，不要让我的话从你们心里被抹去；因为我知道，罪人会引诱人行邪恶的智慧，而这种智慧将无处可容[b]，任何试探也不会使它减弱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“要在你们内心的意念中嘱咐他们”；也可理解为“要按你们心中的意念嘱咐他们”。“他们”所指对象在本节中未明说。
    reason: 原文把“嘱咐”与“心中的思想／意念”结合，且复数代词的具体所指未明。
  - marker: b
    text: “无处可容”直译为“找不到任何地方给它”；“地方”也可能指余地或机会。
    reason: 保留“地方”一词可能具有实际或比喻意义的歧义。
  - marker: c
    text: 末句原文含义不确定。መከራ也可译为“考验”或“苦难”；全句也可能意为“任何苦难都不会将它除去（或缩短）”。正文中的“它”是依上下文补出的。
    reason: 原文末句在名词词义、动词含义及省略宾语方面均有不确定性。
lexical_decisions:
- source_word: ትእዛዙ
  choice: 郑重吩咐
  rationale: 该复数命令式出自“命令、嘱咐”一类词义，保留劝诫语气的力度；“郑重”使现代汉语表达较为自然，同时不弱化为单纯“教导”。
- source_word: በሐሊና ልብክሙ
  choice: 在心中
  rationale: 原文把“思想、意念”与“心”并置，指内在的思量与定意。正文采用自然汉语“在心中”，脚注保留较直译的可能。
- source_word: ኢይደምስስ ነገርየ እምልብክሙ
  choice: 不要让我的话从你们心里被抹去
  rationale: 保留动词“擦除、涂抹掉”的鲜明意象，并表达不可从内心记忆中失落之意。
- source_word: ያሜክሮዎሙ ኃጥኣን ለሰብእ
  choice: 罪人会引诱人
  rationale: 动词在此源于“试探、诱惑、引诱”的词干，不译作“教导”；“引诱”准确呈现罪人使他人走向恶行的主动作用。
- source_word: ይግበሩ ጥበበ እኩየ
  choice: 行邪恶的智慧
  rationale: 保留“智慧”这一关键词及其反讽张力，不将其平化为一般的恶行；“行”对应实行、施行。
- source_word: ኵሉ መካን ኢይትረከብ ላቲ
  choice: 这种智慧将无处可容
  rationale: “地方”既可指实际地点，也可指余地、容身之处。此译在现代汉语中较自然，同时保留“找不到地方”的意象。
- source_word: ኵሉ መከራ አያሐፅፅ
  choice: 任何试探也不会使它减弱
  rationale: መከራ可指试探、考验或苦难；采用“试探”以保留它与前文“引诱”的词根呼应。末句动词语义和宾语均不十分确定，正文依上下文补出“它”，并以脚注说明。
theological_decisions:
- issue: ጥበበ እኩየ所指是一般恶行，还是被败坏、颠倒的智慧
  choice: 邪恶的智慧
  alternative: 邪恶的诡计／恶行
  rationale: 直译“智慧”保留智慧传统中的反讽：罪人所推广的是一种道德上颠倒的“智慧”，而非仅仅泛指作恶。
- issue: 末句中被“减弱”的对象
  choice: 依上下文理解为“邪恶的智慧”
  alternative: 不补宾语，或理解为试探／苦难本身不会减轻
  rationale: 现代汉语需要较明确的宾语才能顺畅成句，但原文末句简略且语义困难，因此只在正文中作最低限度补足，并在脚注中保留其他解释。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。“心中／心里”保留原文以内心为思想和决意所在的表达；“邪恶的智慧”有意保留原文不寻常的神学与智慧文学张力。所有不宜在正文中强行消除的语义困难均以脚注标明。
