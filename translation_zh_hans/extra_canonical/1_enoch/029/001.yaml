base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/029/001.yaml
  text: And from there I went into another place[a], away from the wilderness[c][b]; and I drew near to the east of this mountain.
translation:
  language: zh_hans
  text: 从那里，我前往另一处，离开荒野[a]；我走近这座山的东边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒野”也可译作“旷野”或“荒漠”。
    reason: lexical_alternative
  - marker: b
    text: “东边”原文直指清晨或日出的方向。也可译作“我走近这座山东边的地方”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ወእምህየኒ
  choice: 从那里，我又
  rationale: 既保留“从那里”的空间承接，也用“又”自然表达叙事继续推进。
- source_word: ሖርኩ
  choice: 往……去
  rationale: 采用朴素的移动用语，不额外加入“旅行”等源文未明确表达的色彩。
- source_word: ውስተ መካን ካልእ
  choice: 往另一处
  rationale: 自然表达进入或前往另一个地点，同时不把异象中的地域具体化。
- source_word: እምነ መደባራ
  choice: 离开了荒野
  rationale: 表达从荒僻地区离去；“荒野”兼顾现代可懂度与经文叙事语感。
- source_word: መንገለ ጽባሕ
  choice: 东边
  rationale: 该短语本指清晨、日出所在的方向，在这里即东方。
- source_word: ለደብር ዝንቱ ቀረብኩ
  choice: 我来到这座山的东边
  rationale: 按句法将“这座山”理解为限定“东边”，即山的东侧；“来到”自然传达靠近、抵达其附近的动作，又不把山本身误作唯一直接目标。
