  rationale: 本节只描写异象中的芳香植物，并未明说其礼仪或神学象征，故不加入宗派性或推论性的解释。
- issue: ተኵነኔ 是否按字面争议译作“审判”
  choice: 正文采用“香”，脚注保留“审判”的见证读法
