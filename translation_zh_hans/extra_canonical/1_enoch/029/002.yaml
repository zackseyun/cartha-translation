    reason: textual_variant
  - marker: b
    text: 原文结尾艰涩，似乎只是接着说“还有树木”，句意未完整展开；因此这里保留其突兀、未完的语气。
    reason: alternative_reading
  - marker: c
    text: 原文此处有一个以方括号标示、词形不确定的词，可能是形容香气的程度或性质，如“悦人”“香甜”或“浓郁”。正文不据此强定一种解释。
    reason: textual_variant
