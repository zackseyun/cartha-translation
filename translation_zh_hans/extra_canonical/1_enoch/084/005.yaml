  source_fidelity: 译文准确保留了“现在”、对同一位受呼告者的三个称谓、两个并列的恳求动词，以及第一人称祷告。“成全”较容易表示实现祈求内容，然而原文动词及英文审校轨迹所保留的重点是使祷告得以确立／坚立；宜避免将此处明确限缩为祷告已经蒙应允、获得实现。
