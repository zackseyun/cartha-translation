base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/005.yaml
  text: And now, O God and Lord and great King, I beseech and ask that you establish my prayer for me.
translation:
  language: zh_hans
  text: 现在，神啊、主啊、伟大的王啊，我恳求并祈求你为我坚立我的祷告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 表示话语推进，现代汉语用“现在”自然传达；连词“而/并且”在此可不明译。
- source_word: አምላክ፡ ወእግዚእ፡ ወንጉሥ፡ ዐቢይ
  choice: 神啊，主啊，伟大的王啊
  rationale: 保留三个并列呼语及“伟大”的修饰关系，以庄重而自然的现代汉语表达。
- source_word: አስተበቍዕ፡ ወእስእል
  choice: 我恳求、祈求
  rationale: 保留原文两个近义祈求动词的叠加强调，不将其压缩为单一动词。
- source_word: ታቅም
  choice: 成全
  rationale: 该动词有使之成立、确立之意；在祷告语境中，“成全”既自然，又不预先限定具体实现方式。
- source_word: ሊተ፡ ስእለተየ
  choice: 为我……我的祷告
  rationale: 同时保留与格“为我”和第一人称所有关系“我的”，虽有轻微重复，却反映原文的双重表达。
theological_decisions:
- issue: 神圣称谓的关系
  choice: 将“神”“主”“伟大的王”并列为同一受呼告者的三个称谓
  alternative: 将其理解为多个受呼告对象
  rationale: 原文连续呼格结构与单数第二人称动词支持同一对象的连续称谓。
- issue: 祷告被“确立”的含义
  choice: 译作“成全我的祷告”
  alternative: “使我的祷告坚定”或“确认我的祷告”
  rationale: 原文措辞可涉及使之成立或确立；“成全”保留祈求蒙实现的语境意义，同时避免加入具体教义机制。
translation_notes:
  register: 采用现代、庄重的祈祷体。三个呼语均加“啊”，两个祈求动词并列保留原文的强调；不添加原文没有的专名或宗派性称呼。
