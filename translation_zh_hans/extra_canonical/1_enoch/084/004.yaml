base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/004.yaml
  text: And now the angels of your heavens have transgressed[c][b][a], and your wrath is upon the flesh of men until the great day of judgment.
translation:
  language: zh_hans
  text: 如今，你诸天的天使已经犯了罪[c]；你的烈怒临到世人的血肉之躯[b]，直到审判的大日[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据转写的末尾词形可能受OCR讹误影响；校勘读法意为“审判”，因此译作“审判的大日”。
    reason: textual_variant
  - marker: b
    text: “世人的血肉之躯”保留原文的血肉意象；这里很可能集合性地指处于必死状态的人类。
    reason: lexical_alternative
  - marker: c
    text: 所据转写在此可能有OCR误读。校勘后的词形意为“他们犯罪”或“他们越轨”；若只按现有转写的表面词形，则曾被理解为“愿你诸天的天使祈求”，但这不符合较可靠的校勘读法。
    reason: textual_variant
lexical_decisions:
- source_word: መላእክተ፡ ሰማያቲከ
  choice: 你诸天的天使
  rationale: “天使”符合启示文学中天上众灵的语境；保留复数“诸天”和第二人称所属关系。
- source_word: ይጼብቡ（校勘为 ይጌግዩ）
  choice: 已经犯了罪
  rationale: 传本校勘表明所给转写很可能源于OCR误读；校正后的动词意为“犯罪、越轨”，且是陈述语气，不是祈愿或代求。中文用完成体表达先前发生且与当前审判相关的行为。
- source_word: ዲበ፡ ሥጋ፡ ሰብእ
  choice: 临到世人的血肉之躯
  rationale: 保留“肉身/血肉”的源语意象，同时以“世人”表达单数集合名词所指的人类；“血肉之躯”在现代汉语中自然且庄重。
- source_word: ትከውን፡ መዐትከ
  choice: 你的烈怒临到
  rationale: 按校勘后的句法理解为陈述，而非“愿你的烈怒……”。“烈怒”符合审判语境，也保留强烈程度。
- source_word: እስከ፡ ዕለት፡ ዐባይ
  choice: 直到……大日
  rationale: 直译启示文学中的时间表达，保留其庄严和末世色彩。
- source_word: እንተ፡ ጽጌ（校勘末词为 ኵነኔ）
  choice: 审判的大日
  rationale: 所给末词疑为OCR讹误；校勘读法意为“审判”，故自然译作“审判的大日”。
theological_decisions:
- issue: “世人的血肉之躯”所指的审判范围
  choice: 按集合意义理解为处于必死肉身状态的人类，同时保留“血肉”意象
  alternative: 特指某一个人，或泛指更广义的一切有血肉者
  rationale: 启示文学语境更支持人类整体，但译文不将“血肉”简化为抽象的“人类”，以免消除原文的人论张力。
- issue: 天使的行为是犯罪还是代求
  choice: 采用“已经犯了罪”的陈述读法
  alternative: “愿你诸天的天使祈求”之祈愿读法
  rationale: 现有校勘信息指出底本文字存在严重OCR误读；校正后的动词明确表示犯罪，并与洪水及审判语境相合。脚注保留转写文本表面可能造成的另一读法。
- issue: 烈怒的语气
  choice: 陈述上帝的烈怒已经临到
  alternative: 祈求上帝使烈怒临到
  rationale: 校勘后的句法及上下文支持直陈，而不是祈愿；译文不额外解释烈怒与末日之间的具体持续方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诸天”“烈怒”“大日”保留启示文学语域；“血肉之躯”兼顾源语形象与中文自然度。脚注标记均置于相关短语之后。
