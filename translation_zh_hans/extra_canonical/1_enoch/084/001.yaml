base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/001.yaml
  text: And I lifted up my hands in righteousness[a], and I blessed the Holy and Great One; and I spoke with the spirit of my mouth and with the tongue of flesh, which God has made for the children of the flesh of men, so that they might speak with it; and he gave them spirit and tongue and mouth[b], so that they might speak by them.
translation:
  language: zh_hans
  text: 我凭着公义举起双手，称颂那圣洁而伟大者；我用口中的气息[a]和血肉的舌头说话。这舌头是上帝为人的血肉所生的子孙[b]造的，使他们可以用它说话。他又赐给他们气息、舌头和口，使他们可以借此说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”也可译作“灵”；原词可指气息、灵或风。这里因上下文列举说话所需的能力和器官，译作“气息”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“人的血肉的子孙”。这种刻意重复的说法强调人具有血肉、是受造之物。
    reason: cultural_note
lexical_decisions:
- source_word: አልዐልኩ እደዋየ
  choice: 我举起双手
  rationale: 表示祷告时举手的身体动作；“双手”自然传达原文的复数含义。
- source_word: በጽድቅ
  choice: 凭公义
  rationale: 保留介词结构及祷告行为所带的道德性质，同时符合现代汉语表达。
- source_word: ባረክዎ ለቅዱስ ወለዓቢይ
  choice: 称颂那圣洁而伟大者
  rationale: 两个形容词共同构成对上帝的尊称；“称颂”比现代汉语中的“祝福上帝”更自然。
- source_word: ነገርኩ በመንፈስ አፉየ
  choice: 我用口中的气息说话
  rationale: 上下文列举说话所需的受造能力和器官，因此将多义词መንፈስ译作“气息”，并以脚注保留“灵”的可能。
- source_word: በልስነ ሥጋ
  choice: 用血肉的舌头
  rationale: 保留原文具体而具身体性的意象，不淡化为泛称“人的舌头”。
- source_word: ውሉደ ሥጋ ሰብእ
  choice: 具有人的血肉的子孙
  rationale: 尽量保留原文刻意重复的血肉与人类受造性，同时避免生硬到不可理解。
- source_word: ከመ ይትናገሩ ባቲ
  choice: 使他们可以用它说话
  rationale: 阴性单数代词最自然地回指“舌头”。
- source_word: ወወሀቦሙ መንፈሰ ወልሳነ ወአፈ
  choice: 他又赐给他们气息、舌头和口
  rationale: 保留说话能力与器官的三项并列，并将መንፈስ按语境译为“气息”。
- source_word: ከመ ይትናገሩ ቦቱ
  choice: 使他们可以借此说话
  rationale: “借此”可自然统摄前面的气息、舌头和口，并保留工具性。
theological_decisions:
- issue: መንፈስ应译为“气息”还是“灵”
  choice: 气息
  alternative: 灵
  rationale: 本节聚焦上帝所赐的人类说话能力，并将该词与舌头、口并列；“气息”较符合直接语境，但脚注保留原词可表示“灵”的歧义。
- issue: 是否保留经文具身体性的表述
  choice: 保留“血肉的舌头”和“具有人的血肉的子孙”
  alternative: 意译为“人的舌头”和“人类”
  rationale: 原文反复强调血肉，凸显人的受造与具身性质；不宜在正文中将这一修辞磨平。
- issue: 对神圣对象的称谓
  choice: 那圣洁而伟大者
  alternative: 圣者和伟大者
  rationale: 语法上两个形容词较自然地共同修饰同一位神圣对象；译文不将其拆成两个对象，也不引入后期教义称号。
translation_notes:
  register: 采用庄重而现代的普通话。“称颂”用于人对上帝的赞美；以分句和短句理清原文较长的并列结构，同时保留“血肉”“气息、舌头和口”等具体意象。
