base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/002.yaml
  text: Blessed are you[a], O Lord, great King and mighty in your greatness, Lord of all the creation of heaven, King of kings and God of all the world. And your kingship and your kingdom and your greatness endure forever and ever, and your authority is for all generations of generations. And all the heavens are your throne forever[d][c][b], and the whole earth is the footstool of your feet forever and ever.
translation:
  language: zh_hans
  text: 主啊，你是当受称颂的！你是伟大的王；你在伟大中大有能力。你是天上一切受造物的主，是万王之王，是全世界的上帝。你的王权[a]、国度和伟大永远长存；你的权柄存到世世代代。诸天永远是你的宝座[c]，全地永永远远是你脚下的脚凳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王权”所对应的词在现有转录文本中较难确定；也可理解为“威严”“主权”或“荣耀”。
    reason: textual_variant
  - marker: c
    text: 参《以赛亚书》66:1的宝座与脚凳意象；这里同样以宇宙性的君王图像描绘上帝的统治，但措辞不必完全相同。
    reason: cross_reference
lexical_decisions:
- source_word: ቡሩክ
  choice: 你是当受称颂的
  rationale: 这是直接向上帝发出的祝颂语。译为“当受称颂”既保留祷告式颂赞的力量，也符合现代汉语庄重语体。
- source_word: ንጉሥ ዐቢይ ወኃያል በዕበየ ዚአከ
  choice: 你是伟大的王，以你的伟大彰显大能
  rationale: 保留“伟大的王”“大能”和“你的伟大”三个要素，并以自然汉语表达介词结构所含的方式或状态意味。
- source_word: ኵሉ ፍጥረት ሰማይ
  choice: 天上一切受造物
  rationale: 原文依次为“一切—受造物—天/天上”，可理解为一切属天的受造物；此译法贴近原文，同时比生硬的“天的一切创造”更清楚。
- source_word: ንጉሠ ነገሥት
  choice: 万王之王
  rationale: 保留原文王中之王的最高级王权称号，并采用汉语中自然、庄重的固定表达。
- source_word: አምላከ ኵሉ ዓለም
  choice: 全世界的上帝
  rationale: 此处 ዓለም 在宇宙王权语境中最自然地指世界或世界秩序，故不译作“永世”。
- source_word: መላኵትከ ወመንግሥትከ ወዕበይከ
  choice: 你的王权、国度和伟大
  rationale: 首词文本形态略有困难，但与“国度”“伟大”并列时，译作“王权”最能保持君王语境，也避免与后两项混同。
- source_word: ይነብር
  choice: 长存
  rationale: 该动词本可表示居住、停留或存留；用于王权、国度和伟大时，“长存”准确表达持续不息。
- source_word: ለዓለም ወለዓለመ ዓለም
  choice: 永远／永永远远
  rationale: 采用现代汉语惯用的永恒公式，并在末句用叠加强调对应原文强化形式。
- source_word: ስልጣንከ
  choice: 你的权柄
  rationale: 明确译出此前容易被遗漏的名词，保留其作为独立分句主语的地位。
- source_word: ኵሎሙ ሰማያት መንበርከ
  choice: 诸天永远是你的宝座
  rationale: 保留“诸天”为宝座的具体宇宙君王意象，不将其抽象化为一般统治语言。
- source_word: ኵላ ምድር መካይደ እገሪከ
  choice: 全地……是你脚下的脚凳
  rationale: 直译宝座与脚凳相配的王权图像；“脚下的脚凳”在汉语中比“你双脚的脚凳”自然，同时未改变意象。
theological_decisions:
- issue: 上帝的宇宙王权及宝座—脚凳意象
  choice: 保留诸天为宝座、全地为脚凳的直接宇宙王权图像
  alternative: 将其概括为上帝统管天地，或把诸天专门解释为圣殿
  rationale: 原文使用具体的启示文学王权意象；翻译不应将其抽象化，也不应加入原文未明确指定的神学解释。
- issue: መላኵትከ 的困难读法
  choice: 王权
  alternative: 威严、主权、荣耀
  rationale: 抄本转录中的词形有一定困难；结合“国度”和“伟大”的并列结构，“王权”最切合上下文，但其不确定性应在注释中说明。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告体。保留原文反复出现的王权、伟大、永恒和世代语言，不用古奥虚词，也不把启示文学的宇宙图像改写成抽象教义。正文只设置一条确有帮助的互文注；所有正文标记与注释一一对应。
