base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/003.yaml
  text: For you have made all things[a], and over all things you rule; and no deed is too hard for you, and not even a single wisdom passes beyond the throne of your dwelling, nor turns away from before your face. And you know all things, and see, and hear, and there is nothing hidden from you[d][c][b], for you see all things.
translation:
  language: zh_hans
  text: 因为是你造了这一切[a]，你统管万有；没有一件事对你来说太难。甚至没有一种智慧越过你居所的宝座，也不从你面前转离[b]。你知道万有，看见一切，听见一切；没有什么能向你隐藏，因为你看见万有。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“因为是你做了／造了”，没有明说宾语；“这一切”按上下文补出。
    reason: supplied_context
  - marker: b
    text: 这一句在吉兹文中含义艰深。“一种智慧”也可能指某个明智的意念、计划或关乎智慧的事；这里保留原文异常的说法，没有限定其所指。
    reason: lexical_ambiguity
  - marker: c
    text: “因为你看见万有”在现有底本中以括号标出，可能是部分文本见证所保存的结句；它重复了本节关于上帝洞察万有的主题。
    reason: textual_variant
lexical_decisions:
- source_word: ገበርከ
  choice: 是你造了这一切
  rationale: 该动词本义为“做、造”，原文此处没有明说宾语；结合上下文补出“这一切”，既使现代汉语完整自然，也不把它处理成固定的技术性创造术语。
- source_word: ለኵሉ አንተ ትመልክ
  choice: 你统管万有
  rationale: ትመልክ 表示君王般的治理；“统管”保留主权含义，ለኵሉ 则译为涵盖一切的“万有”。
- source_word: ኢይጸንዐከ ግብር
  choice: 没有一件事对你来说太难
  rationale: ጸንዐ 与宾语后缀连用可表示“对某人太难”，此处以自然汉语保留其强调上帝能力的圣经式习语。
- source_word: ወአሐቲ ጥበብ
  choice: 甚至没有哪怕一种智慧
  rationale: 原文近于“一个／一种智慧”，表达生硬且所指不明；译文有意保留“智慧”，不擅自释为思想、计划或谋略。
- source_word: እምንባራተ ምንባሪከ
  choice: 你居所的宝座
  rationale: 保留原文由相关词根构成的王权与居所双重意象，不简化成单纯的“同在”或“住所”。
- source_word: ኢትትመየጥ ኢእምገጽከ
  choice: 也不从你面前转离
  rationale: 保留原文具象的方位及“面前”意象；“转离”也避免过早判定该动词仅指离开或改变。
- source_word: ዘይትኀባእ
  choice: 能向你隐藏
  rationale: “隐藏”直接对应原词，并在汉语中清楚表达没有任何事物能避开上帝的洞察。
theological_decisions:
- issue: 上帝的主权、能力与全知
  choice: 明确译出上帝统管万有、无事对他太难，也没有什么能向他隐藏
  alternative: 把这些话弱化为一般性的颂赞，或把其范围限于人的行为与谋略
  rationale: 本节连续使用总体性词语，并以“你看见万有”收束；强烈而全面的表述来自原文本身，不宜削弱。
- issue: “一种智慧”与宝座这一难句的含义
  choice: 较贴近原文保留“一种智慧”“越过”“居所的宝座”和“从你面前转离”
  alternative: 意译为“没有明智的计划能逃过你的鉴察”或“没有任何奥秘在你的居所之外”
  rationale: 原句在语义和句法上都较晦涩；正文保留其陌生感并用脚注说明，比选择某一种解释更能诚实呈现文本。
- issue: 首句未明说宾语
  choice: 按上下文译作“是你造了这一切”，并以脚注披露原文结构
  alternative: 绝对地译作“因为是你造的”，或根据上一节译作“因为是你造了它们”
  rationale: 现代汉语通常需要明确宾语；“这一切”是最小幅度的语境补足，但不应掩盖原文没有明说宾语这一事实。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语。“万有”“宝座”“从你面前”等词保持祷告与天上宫廷的崇高语域；对中间难句不作流畅化的神学改写，而以正文保留张力、脚注交代歧义。
