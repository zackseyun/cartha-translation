base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/010.yaml
  text: 'And Uriel showed me another law: when light is transferred into the moon[c][b][a], and from where it is transferred from the sun.'
translation:
  language: zh_hans
  text: 乌列又向我展示了另一条规律[a]：光何时传入月亮[b]，以及这光是从太阳的哪个方向传来的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“另一种秩序”“另一条规则”。原词可指宇宙中有序的法则或固定安排。
    reason: lexical_alternative
  - marker: b
    text: 原文表述较为紧缩；按上下文，这条规律涉及月亮在何时接受光，以及这光来自太阳。
    reason: alternative_reading
  - marker: c
    text: 原词也可指“何处”或“哪一边”；此处的方位说法保留原文可能涉及光从太阳一侧传来的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእት
  choice: 另一条
  rationale: 表示同一系列中另有一项；“另一条”自然地保留了递进和列举意味。
- source_word: ሥርዓተ
  choice: 定律
  rationale: 此词可指秩序、规则或固定安排；在天体运行的语境中，“定律”既庄重，又能表达宇宙中有规律的安排。
- source_word: አርአየኒ
  choice: 向我展示了
  rationale: 直接表达异象叙述中的“使我看见、给我看”，不额外加入“启示”等神学色彩。
- source_word: ሶበ
  choice: 何时
  rationale: 保留原文的时间性连接词“当、何时”，不把它未经说明地改释为“怎样”。
- source_word: ይትወደይ
  choice: 传入／传来
  rationale: 该被动或反身形式表示光从一个天体移至另一个天体；中文按目的地和来源分别自然表达为“传入”和“传来”。
- source_word: ብርሃን
  choice: 光
  rationale: 采用最基本、最少解释性的字义，指天体之光。
- source_word: ውስተ፡ ወርኅ
  choice: 传入月亮
  rationale: 介词具有朝向内部的方向意味；“传入月亮”保留光移向月亮的图像。
- source_word: እምኀበ
  choice: 从……的何处
  rationale: 保留其来源或方位意味，也保留措辞本身可能指“何处、哪一边或哪个方向”的开放性。
- source_word: እምፀሐይ
  choice: 从太阳
  rationale: 明确太阳是光传来的来源，与原文的介词结构相符。
theological_decisions:
- issue: 月光的性质
  choice: 经文描述光从太阳传入月亮，暗示月光来自太阳。
  alternative: 经文只描述月亮与太阳之光的关系，并未断言月光是派生的；或现存吉兹文本保留了已不完全清楚的技术性天文学表述。
  rationale: “光”“传入月亮”和“从太阳传来”的组合强烈指向由太阳而来的月光，但译文不添加后世科学说明或象征性神学解释。
- issue: 时间还是方式
  choice: 正文把ሶበ译为“何时”，保留原文的时间表达。
  alternative: 依上下文意译为“怎样”，把整句理解为月亮如何接受太阳之光。
  rationale: 原词首先支持“当、何时”；虽然整句话可能概括光传递的运行规则，但不应在正文中悄然消除时间性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。“定律”适合天文篇章的宇宙秩序语境；句法略保留原文的紧缩感，并用脚注说明可能的理解，而不在正文中将“何时”改成“怎样”。
