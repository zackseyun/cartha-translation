base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/005.yaml
  text: And they set[a], and they enter the western portals, and make their circuit by the north[b], and by the eastern portals they come out upon the face of the sky.
translation:
  language: zh_hans
  text: 它们西沉[a]，进入西边的门户；又绕行北方[b]，从东边的门户出来，来到天空的表面上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里反复出现的“门户”意象，反映《天文书》所描绘的天空结构：天体经由固定的开口运行。
    reason: cultural_note
  - marker: b
    text: 译作“绕行北方”的原文十分简略，也可理解为绕过北边或沿着北侧运行。
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርቡ
  choice: 落下
  rationale: 该动词在天文语境中指天体西沉；“落下”保留动作本义，也自然表达天体落下，避免补入原文未明说的主语名称。
- source_word: ይበውኡ
  choice: 进入
  rationale: 直接表达由门户进去的动作，并与后文“出来”构成对应。
- source_word: ኆዋኅወ
  choice: 门户
  rationale: 保留《天文书》中天空具有固定出入口的宇宙建筑意象；比普通的“门”更庄重，也不把它具体化为“窗户”。
- source_word: ምዕራብ
  choice: 西边的
  rationale: 与“门户”搭配，清楚保留方位意义，符合现代汉语表达。
- source_word: የአውዱ
  choice: 绕行
  rationale: 该词表示环绕、转行；“绕行”简洁地保留天体有秩序地循环运行的含义。
- source_word: እንተ መስዕ
  choice: 北方
  rationale: 在“绕行北方”中将其理解为所经的方向或一侧；原文措辞简略，具体是绕过、沿着还是经由北侧并不完全确定。
- source_word: እንተ ኆዋኅወ ምሥራቅ
  choice: 从东边的门户
  rationale: 结合随后“出来”的动词，用“从”自然表达由东边门户出离，同时与前面的西边门户形成平行。
- source_word: ይወፅኡ
  choice: 出来
  rationale: 准确对应出离动作，并与“进入”形成清楚的反义对应。
- source_word: ዲበ ገጸ ሰማይ
  choice: 显在天空之上
  rationale: 保留“在天空表面之上”的空间图景，同时用“显在”使天体从门户出来后出现在天幕上的意思在现代汉语中通顺；不将其弱化为一般性的“在天空中”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文以复数代词指称天体的方式，以及西边门户、北方、东边门户和天空表面的空间图景；对简略的北方路线从句不作过度确定。
