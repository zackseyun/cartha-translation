base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/003.yaml
  text: These are the two great luminaries[a]; their disks are like the disk of heaven[b], and the size of the disks of the two of them is equal.
translation:
  language: zh_hans
  text: 这两个大光体的圆面如同天的圆面[b]，两个圆面的大小相等。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句较难确定。吉兹文似乎是说，属于两个光体的圆面（或环周）在度量上“相等”或“相同”。较直译可作：“它们的环周之度量，对两者是相同的。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“它们的环周如同天的环周，而两个环周的度量相等。”
    reason: previous_rendering
lexical_decisions:
- source_word: ብርሃናት
  choice: 光体
  rationale: 此词在《天文书》中指发光的天体；“光体”既保留宇宙论语境，也比单说“光”更具体。
- source_word: ዐበይት
  choice: 大
  rationale: 修饰两个天上光体时，“大”自然、庄重，不额外引入“大能”之意。
- source_word: ክበቦሙ / ክበበ
  choice: 它们的圆面／天的圆面
  rationale: 该词可指圆、圆周、圆面或环行。正文依上下文采用“圆面”，表达两个光体可见的圆形外观；脚注保留“环周”的可能。
- source_word: ከመ ክበበ ሰማይ
  choice: 如同天的圆面
  rationale: ከመ 在这里自然理解为比较词“如同”；同时保留原文重复使用同一词根所形成的对应。
- source_word: ወእምጣነ
  choice: 大小
  rationale: 原词表示度量、尺度或范围；“大小”符合现代汉语，但脚注说明更直译的“度量”。
- source_word: ለክልኤሆሙ ዕሩይ
  choice: 两个……相等
  rationale: 句末语表达二者在度量上相等或相同；译作“相等”通顺且不增加解释。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“大光体”保留古代宇宙论语感；“圆面”避免现代科学术语“轨道”，同时以脚注保存“环周／圆周”的词义可能。脚注标记均置于正文相应位置。
