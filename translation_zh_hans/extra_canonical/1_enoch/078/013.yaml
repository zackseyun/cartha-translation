base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/013.yaml
  text: 'It is completed with exactness: by day the sun goes down in the west[a], and from the east the moon rises by night and gives light all night, until the sun rises before it[c][b], and the moon is seen before the sun.'
translation:
  language: zh_hans
  text: 这事准确地完成了：白昼，太阳在西方落下；夜间，月亮从东方升起[a]，整夜发光，直到太阳在它前面升起[b]，而月亮显现在太阳前面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的句序容许主语延后出现；这里把“月亮”理解为“升起”和“发光”的主语。若把前面的“太阳”当作主语，便会成为“太阳夜间从东方升起”。
    reason: textual_variant
  - marker: b
    text: 这里译作“升起”的动词词形在文本传承上不甚确定；按上下文，也可理解为太阳“出现”。“在它前面”则可能表示时间先后，也可能表示空间位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትፌጸም
  choice: 完成了
  rationale: 该被动／反身形式表示完成或成就；在天体运行的语境中译作“完成了”，避免加入过强的预言色彩。
- source_word: ጥንቀቀ
  choice: 准确地
  rationale: 表达谨慎、精确之意；这里描述天体运行的规律和精确性。
- source_word: በዕለት
  choice: 白昼
  rationale: 与后面的“夜间”构成对照；原文没有指示词，因此不译作“那一天”。
- source_word: ይወርድ
  choice: 降到
  rationale: 保留“下降”的具体意象，同时符合现代汉语描述太阳西沉的表达。
- source_word: ዐረብ
  choice: 西方
  rationale: 此处与“东方”相对，方向意义明确。
- source_word: ምሥራቅ
  choice: 东方
  rationale: 指天体升起的东方方位。
- source_word: የዐርግ
  choice: 升起
  rationale: 本义为上升；按吉兹语延后主语的句法，主语取后出的“月亮”，而非“太阳”。
- source_word: ያበርህ
  choice: 发光
  rationale: 该形式带有使之明亮、放光的意味；“发光”自然并保留其具体含义。
- source_word: በኵሉ ሌሊት
  choice: 整夜
  rationale: 简洁自然地表达“整个夜晚”。
- source_word: ይሠርቅ
  choice: 升起
  rationale: 词形在传抄上有困难，但结合主语“太阳”和上下文，表示太阳出现或升起最为合适。
- source_word: በቅድሜሁ
  choice: 在它前面
  rationale: 保留原文可能兼具时间先后和空间位置的“在……之前／前面”含义。
- source_word: ይትረአይ
  choice: 显现
  rationale: 原词表示被看见或成为可见；“显现”兼顾被动可见性和自然汉语。
- source_word: በቅድመ ፀሐይ
  choice: 在太阳前面
  rationale: 直译方位／先后表达，不将其强行解释为单纯的时间先后。
theological_decisions:
- issue: 是否把本节调整为符合通常天文叙述的顺畅说法
  choice: 保留“太阳在月亮前面升起”和“月亮显现在太阳前面”的张力
  alternative: 概括改写为日落、月光与日出的常规次序
  rationale: 原文的天体方位和先后表述具有歧义与不寻常之处；译文不以推定的天文学逻辑取代现存文本。
- issue: የዐርግ的主语归属
  choice: 以延后出现的“月亮”为主语
  alternative: 以此前的“太阳”为主语，译成太阳在夜间从东方升起
  rationale: 吉兹语可以在一串动词之后放置主语；将“月亮”视为共同主语，也与“夜间”“整夜发光”的语境吻合。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号呈现昼夜对照；保留原文天体运行描述中的重复、方位感和歧义，不作天文学上的和谐化处理。
