- source_word: አርያሬስ
  choice: 阿里亚雷斯
  rationale: 按吉兹语见证音译专名，不作词源性解释。
- source_word: ካልእ
  choice: 第二个
  rationale: 在两项列举中表示第二项，而非泛指“另一个”。
- source_word: ቶማስ
  choice: 托马斯
  rationale: 按吉兹语形式音译；此处作为太阳的专名，不借此认定与其他同形人名有关。
theological_decisions:
- issue: 是否把两个太阳名称意译或套用熟悉的解释
