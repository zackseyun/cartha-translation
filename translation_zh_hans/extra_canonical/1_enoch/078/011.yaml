base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/011.yaml
  text: And throughout the time when the moon is waning[a], it diminishes its light before the sun until fourteen days [its light is completed]; and when it is extinguished[d][c][b], all its light is completed in the sky.
translation:
  language: zh_hans
  text: 在月亮亏缺期间，它将自己的光移置在太阳面前[a]，直到十四日[它的光告终][b]；当月亮熄灭时[c]，它的光在天空中就全然告终。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在太阳面前”是较直译的说法，也可能意为“在太阳所在之处”或“相对于太阳”。“移置”对应的动词也可理解为“放置、投放、转移”；原文所指的具体天文机制并不明确。
    reason: lexical_alternative
  - marker: b
    text: 方括号内的原文传本或文本辨读存疑；其中“它的光”是“告终”的主语，不是说“十四日结束”。
    reason: textual_variant
  - marker: c
    text: “熄灭”保留原文对月亮无光状态的鲜明描写；也可理解为“变暗”，另有“落下”的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ፡ ዘመነ፡
  choice: 整个期间
  rationale: 表示所述月相过程的全部时段，而非某一时刻。
- source_word: ዘተነሡር፡ ወርኅ፡
  choice: 月亮亏缺
  rationale: 按月相语境表达月亮由盈转亏、光面逐渐缩小的阶段。
- source_word: ብርሃነ፡ ዚአሃ፡
  choice: 它的光
  rationale: 直指月亮自身的光，不额外引入拟人化。
- source_word: ትወዲ፡
  choice: 渐渐减少
  rationale: 结合月亮亏缺的直接语境，表达月光逐步减损；该词的词源分析也可能容许“放置、转移”一类理解，因此不把相关宇宙观细节扩写进正文。
- source_word: በቅድመ፡ ፀሐይ፡
  choice: 在太阳面前
  rationale: 保留原文空间性表达及其可能表示“在太阳所在之处／相对于太阳”的歧义。
- source_word: እስከ፡ ፲ወ፬መዋዕል፡
  choice: 直到第十四天
  rationale: 自然表达亏缺过程延续十四日；不把后面的完成动词误接到“十四天”上。
- source_word: '[ይትፌጸም፡ ብርሃና፡]'
  choice: '[它的光便告终]'
  rationale: 明确保留括号内校勘存疑的词句，并使“它的光”作为完成／终结的主语。
- source_word: ወሶበ፡ ይውዒ፡
  choice: 当月亮熄灭时
  rationale: 保留发光体仿佛被熄灭的鲜明宇宙意象，同时明确省略主语为月亮。
- source_word: ኵሉ፡ ይትፌጸም፡ ብርሃኑ፡
  choice: 它……的光就全然告终
  rationale: 保留原文“全部”与“完成／终结”的措辞，表达月光完全消失。
- source_word: ውስተ፡ ሰማይ።
  choice: 在天空中
  rationale: 此处属于天象描述，“天空”比带有神学色彩的“天上”更贴合语境。
theological_decisions:
- issue: 月亮最终无光的状态应采用普通天文学措辞，还是保留启示文学的发光体意象
  choice: 当月亮熄灭时
  alternative: 当月亮变暗时／当月亮落下时
  rationale: 原文采用具体而鲜明的宇宙意象；译作“熄灭”不将其改写成现代科学说明，也不附加宗派性解释。
- issue: ትወዲ 是表达光的减少，还是光的放置／转移
  choice: 渐渐减少
  alternative: 把它的光转移／投放在太阳面前
  rationale: 本节明说月亮处于亏缺期，且后文走向完全无光，因此正文采用语境上连贯的“减少”；鉴于词形分析存在争议，脚注保留“转移”这一可能。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。以“亏缺”“告终”维持《天文书》的规整、古雅语气，同时用“整个期间”“第十四天”等自然表达确保可读性；方括号用于如实标示原文校勘不确定处。
