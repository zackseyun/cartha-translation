  terminology: “圆盘”“七份光”“按着定量”“第七份”总体保持古代天文学图式的庄重、可读语域，且没有现代化文本。建议将“按着定量”微调为“按一定量度”，这是更自然的现代标准汉语，同时保留μεasure/度量的含义。
