base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/004.yaml
  text: In the disk of the sun there are seven portions of light which are added to it beyond the moon[e][d][c][b][a], and in measure they are added until the seventh portion of the sun is completed.
translation:
  language: zh_hans
  text: 太阳的圆盘中有七份光，超出月亮而加在其上[a]；这些份额按一定量度增加，直到太阳的第七份完成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚语原句句法艰涩。这里似乎是说，太阳的光比月亮多七个按量计算的份额；相关措辞也可理解为“从月亮加到其上”或“超出月亮”。末句的动词还可译为“直到太阳的第七份经过”或“被超过”。
    reason: textual_variant
lexical_decisions:
- source_word: በክበበ ፀሐይ
  choice: 太阳的圆盘中
  rationale: ክበብ可指圆、圆周或圆盘；此处谈光的份量存在并增加于太阳之中，译作“圆盘”比现代意义的“轨道”更合语境。
- source_word: ሰብዓቱ ክፍለ ብርሃን
  choice: 七份光
  rationale: 保留ክፍል的数量、分份意味，并以简洁自然的现代汉语表达本段图式化的宇宙描述。
- source_word: ዘይትዌሰክ ቦቱ እምወርኅ
  choice: 比月亮多加在其上
  rationale: ይትዌሰክ表示增加或添加；እም既可表示来源，也可表示比较。这里依上下文采用比较义，但以脚注保留原文句法的不确定性。
- source_word: መስፈርት
  choice: 按着定量
  rationale: 该词指尺度、度量或标准；“按着定量”传达有秩序、可计量的增加，而不引入现代科学术语。
- source_word: ትትወደይ
  choice: 增加
  rationale: 结合前面的添加用语，取光量递增之义；汉语不机械重复“加上”，使句子自然而仍保留图式化进程。
- source_word: እስከ የሐልፍ ሳብዕ ክፍለ ፀሐይ
  choice: 直到太阳的第七份完成
  rationale: ሳብዕ是序数“第七”；የሐልፍ本可有经过、越过或超越之义，但在此递增量度的语境中，“完成”较通顺，同时脚注注明其他可能。
theological_decisions:
- issue: 经文的宇宙观陈述应如何呈现
  choice: 按古代启示文学中对天体光度与量度的图式化描述直译，不现代化，也不寓意化。
  alternative: 将其改写为现代天文学陈述，或视为纯粹象征。
  rationale: 原文以份量和定量描述日月，应保留其古代宇宙观语域及内在张力，不替文本解决与现代科学框架的关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“圆盘”保留古代天体作为圆形发光体的图像；“份”“定量”保留本章反复出现的计量式表达。正文只设一条综合脚注，避免脚注堆叠，同时明确呈现原文真正的句法和词义歧义。
