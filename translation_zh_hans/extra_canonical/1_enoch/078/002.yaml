base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/002.yaml
  text: 'And the moon has four names: the first is Asonya[a], the second Abla, the third Benase[b], and the fourth Erae.'
translation:
  language: zh_hans
  text: 月亮有四个名字：第一个叫阿索尼亚[a]，第二个叫阿布拉，第三个叫贝纳塞[b]，第四个叫埃拉厄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语“ወርኅ”既可指“月亮”，也可指“月份”。这里说它有四个名字，因此正文译作“月亮”。
    reason: lexical_alternative
  - marker: b
    text: 这里的四个名字均按埃塞俄比亚语文本音译；它们若源自更早的名称，其原始形式和确切读音已不能确定。
    reason: cultural_note
lexical_decisions:
- source_word: ወርኅ
  choice: 月亮
  rationale: 该词可指“月亮”或“月份”；这里四个专名归属于一个发光天体，因此按上下文译为“月亮”。
- source_word: አርባዕተ አስማተ ቦቱ
  choice: 有四个名字
  rationale: ቦቱ以“对它、属于它”的结构表达领属关系，现代汉语自然译作“有”。
- source_word: ፩ ስሙ…ወካልእ…ወሣልስ…ወራብዕ
  choice: 第一个叫……第二个叫……第三个叫……第四个叫
  rationale: 保留原文依次列举的结构，并以自然现代汉语表达名称。
- source_word: አሶንያ
  choice: 阿松雅
  rationale: 按吉兹语字形音译，保留其中的y音。
- source_word: አብላ
  choice: 阿布拉
  rationale: 依吉兹语形式作保守音译；原文辅音组合的实际元音不完全明确。
- source_word: ብናሴ
  choice: 贝纳塞
  rationale: 依埃塞俄比亚语形式作便于普通读者读出的保守音译；确切古代读音不确定。
- source_word: ኤራእ
  choice: 埃拉厄
  rationale: 依吉兹语字形作保守音译，并用“厄”近似体现末尾喉音字母；确切读音不确定。
theological_decisions:
- issue: ወርኅ应译作“月亮”还是“月份”
  choice: 月亮
  alternative: 月份
  rationale: 同一个吉兹语词兼有天体和历法单位两义，但本节把四个专名赋予所指对象，而上下文属于天体运行论述，故“月亮”更符合直接语境；脚注仍保留“月份”这一词义可能性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。专名使用便于简体中文读者辨读的音译，不擅自解释其含义；列举格式贴近原文，同时避免生硬直译。
