base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/012.yaml
  text: On the first day she is called the new moon[d][c][b][a], because on that day light rises upon her.
translation:
  language: zh_hans
  text: 第一天，她被称为“新月”[a][b]，因为那一天，光开始显现在她身上[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里指月初月亮开始渐盈的阶段。
    reason: cultural_note
  - marker: b
    text: “新月”也可译作“渐盈者”或“升起者”。
    reason: lexical_alternative
  - marker: c
    text: 直译可作“光在她上面升起”；也可译作“光显现在她身上”。原文描绘亮光开始临到月亮上。
    reason: lexical_alternative
  - marker: d
    text: “她”指月亮；原文使用阴性形式。
    reason: source_texture
lexical_decisions:
- source_word: በቀዳሚት፡ ዕለት
  choice: 第一天
  rationale: 这是月相次序中的时间短语；简洁译为“第一天”，符合现代汉语表达。
- source_word: ሠርቀ
  choice: 新月
  rationale: 该词在本段历法和月相语境中是指月初的新月，也保留了“升起、渐盈”的词义背景。
- source_word: ትሠመይ
  choice: 她被称为
  rationale: 动词为阴性形式，所指是月亮；用“她”保留原文的语法性别及轻微拟人色彩。
- source_word: እስመ
  choice: 因为
  rationale: 明确引出后一分句对这一名称的解释。
- source_word: ይትነሣእ፡ ላዕሌሃ፡ ብርሃን
  choice: 光在她上面升起
  rationale: 保留“光”无定冠词的性质，并尽量呈现光升到月亮之上的动态、空间意象；脚注列出更侧重显现结果的自然译法。
theological_decisions:
- issue: 对月亮使用阴性指称
  choice: 使用“她”
  alternative: 使用“它”
  rationale: 吉兹语的动词和代词形式为阴性，天文书的行文也赋予天体鲜明的拟人色彩；保留“她”忠实呈现原文，而不赋予额外神学含义。
- issue: “光升起”与“光显现”的关系
  choice: 正文保留“升起”的动态意象
  alternative: 译为“光显现在她上面”
  rationale: 原文动词含起身、升起之意，但在月相语境中也可理解为亮光开始显现；正文不把这层张力静默化解，另以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“她被称为”保留命名句式及月亮的拟人色彩；“光在她上面升起”略带异象式空间感，脚注补足现代读者所需的月相含义。
