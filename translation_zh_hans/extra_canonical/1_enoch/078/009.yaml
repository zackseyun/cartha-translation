  text: And in certain months[a], the month has twenty-nine days[c][b], and once twenty-eight.
translation:
  language: zh_hans
  text: 在某些月份，一个月有二十九天，有一次则是二十八天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有吉兹文转录末尾读作“五星期”，但这很可能是OCR把“二十八”误认所致；按历法语境及近期源文复核，此处译作“二十八天”。
    reason: textual_variant
lexical_decisions:
- source_word: አውራኅ፡ እሙራን
  choice: 某些月份
  rationale: 按经复核的词法理解，አውራኅ 是“月份”的复数，እሙራን 表示“某些、特定的”；合译为自然的现代汉语“某些月份”。
- source_word: ይከውን
  choice: 有
  rationale: 此处为历法陈述，汉语用“有”表达月份所含日数，比直译为“将是”自然，同时不改变命题内容。
- source_word: ፳ወ፱መዋዕል፡ ለወርኅ
  choice: 一个月有二十九天
  rationale: 数字与“日”明确；介词结构在汉语中顺译为一个月所含的日数。
- source_word: ወቦ፡ አመ
  choice: 有一次则是
  rationale: 保留附加的个别情形，并用“则”清楚呈现与二十九天的对照。
- source_word: ፭ወሳሙን
  choice: 二十八天
  rationale: 现存转录作“五星期”在语境中困难；最新源文复核判断这是数字二十八的OCR误识，且与本节月长计算相合。因底本转录置信度仅为中等，另以脚注说明。
