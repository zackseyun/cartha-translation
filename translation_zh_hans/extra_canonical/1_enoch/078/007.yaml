base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/007.yaml
  text: And fifteen parts of light are added within it until the fifteenth day[a]; and its light is completed as a sign of the year, and it becomes fifteen parts[c][b], and the moon comes into being by half of a seventh part.
translation:
  language: zh_hans
  text: 其中加添了十五份光，直到第十五日；它的光就完满，作为一年的标志。它共有十五份[a]，月亮则以七分之一的一半为增量而形成[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十五份”指月光的十五个计量单位，而不只是历月的第十五日；这是本章计算月光的术语。
    reason: cultural_note
  - marker: b
    text: 末句的埃塞俄比亚文句法较难。“七分之一的一半”即十四分之一，似指月光每日增加的份额；也有人把本句理解为“月份在第七份达到一半”。
    reason: textual_variant
lexical_decisions:
- source_word: ፲ትኅምስት ብርሃን
  choice: 十五份光
  rationale: 数词意为“十五”；本章按份计量月光，故补出量词“份”，保留其技术性计数方式。
- source_word: ይትወደደ ውስቴታ
  choice: 加在其中
  rationale: 该动词在这里描述月光逐份增加；用“加在其中”既保留被加添的具体意象，也照应前文所述的月亮。
- source_word: እስከ ዐሡር ወኃሙስ
  choice: 直到第十五日
  rationale: 字面为“直到十和五”；在月相渐盈的语境中，补出“日”可自然表达时间节点。
- source_word: ይትፈጸም ብርሃነ ዚአሁ
  choice: 它的光就完满
  rationale: 动词表示达到完整、圆满；“完满”适合描述月光达到全部计量。
- source_word: ለትእምርተ ዓመት
  choice: 作为一年的标志
  rationale: 保持原文的历法功能，不将“标志”解释为预兆或寓意象征。
- source_word: ወይከውን ለ፲፲ትኅምስት
  choice: 它共有十五份
  rationale: 原文句法和数字写法略显困难，但语境看来重申月光达到十五份；“份”由本章计量语境补足。
- source_word: ወርኅ
  choice: 月亮
  rationale: 该词可指“月”或“月份”；此处以月相及其每日光量增幅为论题，译作“月亮”更符合直接所指。
- source_word: በመንፈቀ ሳብዕ እደ
  choice: 以七分之一的一半为增量
  rationale: 将介词理解为方式或增量，并把“半”视为与“七分之一”构成属格关系，即每日增加十四分之一；“为增量”是为现代汉语清晰而作的语境性明示。
theological_decisions:
- issue: 月光完满的历法作用
  choice: 作为一年的标志
  alternative: 作为一年的预兆／表记
  rationale: 《天文书》的上下文主要叙述天体所体现的历法秩序；“标志”保留宇宙论意义，同时不引入寓意化或预兆性的解释。
- issue: 末句的天文计量
  choice: 月亮以七分之一的一半为增量而形成
  alternative: 月份在第七份达到一半
  rationale: 前一种理解与上下文按每日十四分之一计算月光增减相符，也保留原文“以／凭”的方式含义；但因原句传本与句法困难，另加脚注提示。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“光”“标志”“份”等原文核心词汇；对末句只作足以呈现天文计量的有限明示，并以脚注保存另一种可能理解。
