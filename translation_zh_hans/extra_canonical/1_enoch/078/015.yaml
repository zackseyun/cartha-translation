  text: And it makes three months of thirty days[a], and in its season[d][c][b], when its waning occurs.
translation:
  language: zh_hans
  text: 它使三个月各有三十天；在它的时节，当它出现亏缺时[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时节”也可译作“时期”或“所定的时节”。末句原文难解；“出现亏缺”是按天文语境作出的暂定理解，也可能指“它的推算完成”或“它的安排完成”。
    reason: lexical_alternative_and_textual_uncertainty
lexical_decisions:
- source_word: ሠለስተ፡ ወርኀ
  choice: 三个月
  rationale: 数词“ሠለስተ”与“月”连用，表示“三个月”；在句中作单数动词“使”的宾语，而非主语。
- source_word: ይገብር
  choice: 它使……有
  rationale: 该动词为第三人称阳性单数，基本义为“做、使成”。依历法语境译作“它使三个月各有三十天”，既保留单数主语，也使汉语表达清楚。
- source_word: ፴መዋዕለ
  choice: 三十天
  rationale: 由数字“三十”和“日”的复数形式构成，明确指每个月的日数。汉语补出“各有”以显明数值关系。
- source_word: በአዝማነ፡ ዚአሁ
  choice: 到了它的时节
  rationale: “አዝማን”可指时间、时期或所定的时节；这里采用自然且略带历法色彩的“时节”，并以注释保留其他可能。
- source_word: ሶበ
  choice: 当……时
  rationale: 这是引出时间从句的连词，可自然译为“当……时”。
- source_word: ታኀጻጺተ፡ ዚአሁ
  choice: 它的亏缺发生
  rationale: 该难解形式在天文语境中可理解为亏减、亏缺；译文不把它扩展成更具体的月相说明，并在注释中保留“推算完成”的另一种分析。
theological_decisions:
- issue: 天文历法段落末尾难解短语的处理
  choice: 译作“当它的亏缺发生时”
  alternative: “当它的推算完成时”或“当它的安排完成时”
  rationale: 原文在词形和句法上均有难度。正文采用与天体盈亏语境相合的读法，但不将所指明确限定为月亮；注释保留历法计算方面的可能解释，以免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“各有”是为表达历法数值关系而作的必要补足；分号保留原句两个历法陈述之间略显断裂的结构，不将难解末句过度顺译。
