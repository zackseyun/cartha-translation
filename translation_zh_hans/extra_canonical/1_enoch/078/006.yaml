base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/006.yaml
  text: And when the moon rises[a], it appears in the sky as half of a seventh part[c][b], [and all the light is in it,] and it completes its light as fourteen parts.
translation:
  language: zh_hans
  text: 月亮升起时，它在天空中显现为七分之一的一半[a]；[其中有全部的光，][b]它的光便达到十四份[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“七分之一的一半”。这是本书按若干“份”计算月光的示意性说法，不是现代科学描述。
    reason: cultural_note
  - marker: b
    text: 方括号内的吉兹语分句在现存文本中句法突兀，意为“其中有全部的光”；这里将它独立保留，不与下一分句合并。
    reason: textual_variant
  - marker: c
    text: “十四份”是本段计算月亮光度所用的总份数；末句也可直译为“它使自己的光完成为十四份”。
    reason: translation_alternative
lexical_decisions:
- source_word: ይትነሣእ
  choice: 升起
  rationale: 在天体运行的语境中，指月亮上升并出现；“升起”是现代汉语自然且准确的表达。
- source_word: ወርኅ
  choice: 月亮
  rationale: 本节描述可见的天体及其光，故此处指“月亮”，而非“月份”。
- source_word: ያስተርኢ በሰማይ
  choice: 显在天空中
  rationale: 保留原文“使自己可见／显现”的观察性语气，同时使汉语简洁庄重。
- source_word: መንፈቀ ሳብዕተ እደ
  choice: 七分之一的一半
  rationale: 按原文的分数结构直译，保留《天文书》以份数计算月光的技术性表述，不改写为现代天文学术语。
- source_word: ብርሃን
  choice: 光
  rationale: 本章量化描述月亮可见的光，“光”比“光辉”或“亮度”更直接，也与重复用语相称。
- source_word: ብርሃን ይከውን ቦቱ ኵሉ
  choice: 其中有全部的光
  rationale: 将括号内见证文本作为独立分句译出，不把它与随后“使自己的光达到……”的完成过程合并。
- source_word: ከመ ዐሡር ወረቡዕ
  choice: 达到十四份
  rationale: 原文明确给出十四；结合上下文所用的计量单位，以“份”补足汉语所需的量词，并保留其示意性的计算体系。
- source_word: ይፈጽም ብርሃኖ
  choice: 它使自己的光达到
  rationale: 保留动词的使之完成、达到完满之意，同时不直接解释为现代意义上的“满月”。
theological_decisions:
- issue: 应否把月光的数字体系意译为通常所说的月相
  choice: 保留“七分之一的一半”和“十四份”的数字计算方式
  alternative: 意译为月亮初现、逐渐盈满或达到满月
  rationale: 本段属于《天文书》的示意性宇宙论描述。保留原有数字措辞，可避免用现代天文学或后来的解释替代文本本身。
- issue: 括号内“其中有全部的光”与末句完成月光之间的张力
  choice: 将两句分别译出，并保留方括号
  alternative: 合并为“它全部的光达到十四份”
  rationale: 原文见证把这两项作为不同分句；分别翻译既保存文本上的困难，也不擅自消除“光已全在其中”与“光仍达到完成”之间的张力。
translation_notes:
  register: 采用现代标准汉语，语气庄重而易懂。用“份”保存本章的计量体系；保留方括号以反映见证文本状态，并避免把古代宇宙论措辞现代化。
