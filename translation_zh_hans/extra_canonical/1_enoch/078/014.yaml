base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/014.yaml
  text: From where the light comes to the moon, from there again it wanes until all the light is finished, and the days of the month pass, and its disk remains empty, without light.
translation:
  language: zh_hans
  text: 月亮从哪里得到光，就从那里再次渐亏，直到光全都消尽；月中的日子过去，它的圆面仍是空的，毫无光亮[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圆面”也可译作“圆盘”或“圆形”；这里指月亮可见的圆形外观，在无光时显得空暗。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኀበ ... እምህየ
  choice: 从哪里……也就从那里
  rationale: 保留原文关系词与指示词相呼应的结构，表明月亮从受光的同一方位开始渐亏。
- source_word: ይመጽእ ብርሃን ለወርኅ
  choice: 月亮……得到光
  rationale: 按月亮作为受光者的语境自然表达方向或接受关系，同时不引入现代反射光理论。
- source_word: ካዕበ የሐፅፅ
  choice: 再次渐亏
  rationale: “渐亏”是现代汉语描述月相逐步减损的通行说法；“再次”保留循环次序。
- source_word: እስከ ይትዌዳእ ኵሉ ብርሃን
  choice: 直到光全都消尽
  rationale: 表达渐亏过程达到终点，兼顾原文完成义与汉语自然度。
- source_word: ወየኀልፍ መዋዕለ ወርኅ
  choice: 一个月的日子过去
  rationale: 此处ወርኅ兼可指“月亮”或“月份”；上下文描述月相周期，采用时间义“一个月”。
- source_word: ክበቡ
  choice: 它的圆面
  rationale: 指月亮可见的圆形外观；“圆面”比“圆盘”更自然，也不增加实体宇宙论含义。
- source_word: ባክ ዘእንበለ ብርሃን
  choice: 空无一物，没有光
  rationale: 保留“空”与“没有光”的双重陈述及其鲜明视觉意象。
theological_decisions:
- issue: 月光描述的性质
  choice: 按观察性的天文／异象描述翻译月亮得光与失光的循环
  alternative: 解释为象征性或天使性的力量，或改写为现代科学所说的太阳光反射
  rationale: 原文陈述宇宙秩序中的可见过程，并未说明其物理机制；译文既不寓意化，也不以现代科学解释替代原有图景。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“从哪里……也就从那里”保留原文关键的关联结构；整体保持古代天文异象叙述，不作现代科学化改写。
