revisions:
- from: 月亮从哪里得到光，也就从那里再次渐亏，直到光全都消尽；一个月的日子过去，它的圆面便空无一物[a]，没有光。
  to: 月亮从哪里得到光，就从那里再次渐亏，直到光全都消尽；月中的日子过去，它的圆面仍是空的，毫无光亮[a]。
  rationale: 修订仅消除两处汉语表达与语义范围的问题：“月中的日子过去”避免把原文泛指的月内日子误读为完整一个月的时长；“仍是空的，毫无光亮”以自然汉语保留原文“空”及“没有光”的双重表述。其余关键结构和天文异象性表述均维持不变。
