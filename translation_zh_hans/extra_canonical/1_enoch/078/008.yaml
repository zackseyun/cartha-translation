base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/008.yaml
  text: And in its waning[a], on the first day it diminishes to fourteen parts of its light, and on the second it diminishes to thirteen parts of light, and on the third it diminishes to twelve, and on the fourth to eleven parts, and on the fifth it diminishes to ten parts, and on the sixth it diminishes to nine parts, and on the seventh it diminishes to eight parts, and on the eighth it diminishes to seven, and on the ninth it diminishes to six, and on the tenth it diminishes to five, and on the eleventh it diminishes to four, and on the twelfth it diminishes to three, and on the thirteenth it diminishes to two, and on the fourteenth it diminishes to half of a seventh part of all its light[d][c][b]; and on the fifteenth day that which remains from the whole is consumed.
translation:
  language: zh_hans
  text: 在它亏缺的时候，第一天，它的光减至十四份；第二天减至十三份；第三天减至十二份；第四天减至十一份；第五天减至十份；第六天减至九份；第七天减至八份；第八天减至七份；第九天减至六份；第十天减至五份；第十一天减至四份；第十二天减至三份；第十三天减至两份；第十四天，它减至全部光的七分之一的一半[a]；到了第十五天，全部所剩的光便消耗殆尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “七分之一的一半”直译自吉兹语；这一分数表达在数学上略显不寻常，译文予以保留。
    reason: lexical_alternative
lexical_decisions:
- source_word: በሕጸጸ፡ ዚአሁ
  choice: 在它亏缺的时候
  rationale: 名词结构表示月光渐次减少的阶段；“亏缺”符合现代汉语天文语境，也保留“减少、亏损”的基本意义。
- source_word: የኀጽጽ
  choice: 减至
  rationale: 反复出现的动词配合数值，表示光量减少到某一剩余份数，而不是减去该份数；“减至”能准确维持十四、十三、十二等递减序列。
- source_word: እደ / ክፍለ
  choice: 份
  rationale: 两词在本节均用于可计量的光之分部；统一译为“份”简明自然，也不把原文过度技术化。
- source_word: ብርሃኑ / ብርሃን
  choice: 它的光／光
  rationale: 直译可见且可计量的月光，不额外增添“辉耀”等诗性色彩。
- source_word: መንፈቀ፡ ሳብዐቱ
  choice: 七分之一的一半
  rationale: 忠实保留原文在数学上略显别扭的分数表达，不擅自校正或平滑为其他数值。
- source_word: ይትዌዳእ
  choice: 消耗殆尽
  rationale: 该动词来自“完成、耗尽、消耗”的词根，在月亏第十五日的语境中表示余光被耗尽，并非“显现”。
- source_word: ዘተረፈ፡ እምኵሉ
  choice: 全部所剩的光
  rationale: 表达在整个递减过程之后剩余的光量；补出语境中明确的“光”，使现代汉语自然清楚。
theological_decisions:
- issue: 本节数字序列的性质
  choice: 按月光盈亏的观测性、天文性计量来翻译，并完整保留逐日数字。
  alternative: 把数字视为象征，或概括为月光逐渐减少。
  rationale: 上下文属于天文秩序的描述，原文以反复句式逐日列举剩余光份；不应寓意化或概括化。
- issue: 第十四日分数的解释
  choice: 保留“七分之一的一半”的表层表达。
  alternative: 将其校正或顺译为更符合预期月相计算的数值。
  rationale: 原文确实保存了这一不寻常的分数，译文应保留文本张力，而不以推测替换现存读法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以分号呈现逐日递减的公式化序列，反复使用“减至”以表明数字是剩余光量而非被减去的量；末句译作“消耗殆尽”，符合原动词及月亏语境。
