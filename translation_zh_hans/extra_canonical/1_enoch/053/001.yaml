base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/001.yaml
  text: There my eyes saw a valley whose mouths were open and deep; and all who dwell on the dry land and the sea and the islands will bring gifts and offerings and presents to it, yet that deep valley will not be filled.
translation:
  language: zh_hans
  text: 在那里，我亲眼看见一处山谷，它的谷口敞开而深邃[a]。凡住在干地、海上和岛屿上的人，都要把礼物、供物和赠品带到那里[b]；然而，那深谷不会被填满。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 描述这个谷及其“口”的吉兹语句式较难确定。这里理解为谷有敞开而深邃的谷口；也可译作“一个谷口敞开而深邃的山谷”。
    reason: textual_variant
  - marker: b
    text: 这里三个词的意思彼此相近，译作“礼物、供物和赠品”；在本段语境中，它们也可能泛指从世界各地送来的贡物。
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: 在那里
  rationale: 保留指示场景的方位副词，承接异象中的地点。
- source_word: ርእያ አዕይንትየ
  choice: 我亲眼看见
  rationale: 原文直译近于“我的眼睛看见”；汉语用“亲眼看见”既自然，又保留视觉见证的强调。
- source_word: ቈላ
  choice: 谷／深谷
  rationale: 该词指谷地或谷状深壑；正文先译“谷”，末句按原文修饰语译作“深谷”，避免过早限定为峡谷。
- source_word: ርኁወ ወዕሙቀ አፈዊሁ
  choice: 它的谷口又敞开又幽深
  rationale: 保留“口”的地形隐喻，并让并列的“敞开”和“幽深”共同描述谷口；“谷口”比单说“口”更符合现代汉语。
- source_word: የኃድሩ
  choice: 住
  rationale: 普通而庄重的居住动词，适合涵盖各地域居民。
- source_word: ዲበ የብስ ወባሕር ወደሰያት
  choice: 在旱地、海上和众岛屿
  rationale: 保留旱地、海与岛屿的三重地域列举；“旱地”明确与海相对。
- source_word: አምኃ ወአስካዓ ወጋዳ
  choice: 礼物、供物和赠品
  rationale: 用三个意义相近但不完全相同的名词，保留原文的累积效果；因词义边界不确定，不强行赋予严格祭仪分类。
- source_word: ይመጽኡ ሎቱ
  choice: 把……带到那里
  rationale: 动词本义为“来”，但与前列物品连用时，汉语自然表达为把物品带到该处。
- source_word: ወዝኩስ ዕሙቅ ቈላ ኢይመልእ
  choice: 然而，那个深谷仍不会被填满
  rationale: 保留转折、深谷意象以及未被填满的将来／未完成语气；“仍”凸显尽管众物被带来却不能填满。
theological_decisions:
- issue: 各地居民带来的物品及其去向
  choice: 将具体的礼物、供物和赠品带到谷那里
  alternative: 居民只是来到谷前；或这些物品象征敬意行为
  rationale: 原文在地域列举之后罗列三个物品名词，再接趋向表达。按具体贡物理解最直接，也能保留审判异象的突兀张力，而不作寓意化解释。
- issue: 谷口意象的理解
  choice: 保留拟人化的“谷口”，并以“敞开、幽深”描述
  alternative: 意译为谷中多个开阔而深的入口
  rationale: 原文语法和意象存在一定困难；正文尽量贴近“口”的隐喻，不把它确定为洞穴、裂口或其他特定地貌。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“我亲眼看见”保留异象见证的强调；“谷口”保留原文地形拟人意象。标点将异象所见、万民送物与深谷不满三层推进清楚呈现。
