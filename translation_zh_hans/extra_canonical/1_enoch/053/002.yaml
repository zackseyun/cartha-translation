review_pass:
  verdict: revise
  source_fidelity: 正文将首句的“我的锁链”改作“不法之事”，并把“渴求/饥渴”解释为“助长”，均未能优先反映所给吉兹文本及其词汇审校。鉴于该行句法确有困难，修订以“锁链”的具体意象为正文，并用脚注说明句法及意象的不确定性。后半节保留“从诸灵之主面前”“从他的地上被拔除”及末句否定式，较贴近源文而不预断最终审判的形态。
  naturalness: 修订后的汉语保持庄重、现代且可读；首半节的反常意象仍按原文保留，不以意译抹平。
  terminology: “诸灵之主”是适切且应保留的以诺书称号。“锁链”“罪人”“拔除”和“永永远远不再存留”分别保留刑罚、道德类别、从地上除去及永久性排除的关键表达。
  issues:
  - severity: high
    issue: 首句将“我的锁链”改译为“他们不法之事”。
    rationale: 所给词汇审校将 ጌጋየ 判为带第一人称后缀的“我的锁链”。即使此行存在文本和句法困难，不能在正文中无标记地改为另一套“不法行为”的分析。
  - severity: medium
    issue: “助长”弱化并改变了“渴求／饥渴”的动词意象。
    rationale: ዘይጻምዉ 的基本义为“饥渴、渴求”。应保留这一异常但明确的食欲意象，或在脚注中说明句法歧义。
  - severity: low
    issue: 脚注 c 所列的“整体译法”与修订正文重合，且原锚点堆置在“被拔除”之后，关联不够清楚。
    rationale: 修订后以单一首句脚注说明困难读法，并将末句和“拔除”的说明分别置于对应词语之后。
  revised_text: 我的锁链要由他们亲手制成[a]；凡渴求这些锁链的罪人都要吃下它们。罪人必从诸灵之主面前被除灭，也必从他的地上被拔除[b]；他们永永远远不再存留[c]。
  revised_footnotes:
  - marker: a
