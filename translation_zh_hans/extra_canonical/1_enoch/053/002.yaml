base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/002.yaml
  text: And their hands commit lawless deeds[a], and all who support their lawless deeds the sinners devour. And the sinners shall be destroyed from before the Lord of Spirits, and from the face of his earth they shall be uprooted[d][c][b], and they shall not remain forever and ever.
translation:
  language: zh_hans
  text: 他们的手施行不法之事[a]；凡助长他们不法之事的人，罪人都吞吃他们。罪人必从诸灵之主面前被除灭，也必从他的地面被拔除[b][c][d]；他们永永远远不再存留。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本行的埃塞俄比亚文十分难解。另可按较具体的锁链意象译作：“我的锁链要成为他们手中的镣铐；凡渴求它们的罪人都要吃下它们。”这可能表示审判的刑具反倒成了罪人自己的分。
    reason: lexical_alternative
  - marker: b
    text: 末句更直译为“他们永永远远不再存留”；底本中否定词本身也带有校勘上的不确定性。另可理解为“他们必永永远远灭亡”。
    reason: textual_variant
  - marker: c
    text: 本节前半另有整体译法：“我的锁链要成为他们手中的镣铐；凡渴求它们的罪人都要吃下它们。罪人必被赶逐……”
    reason: previous_rendering
  - marker: d
    text: “被拔除”也可译为“被放逐”或“被移除”；“拔除”保留了从地面连根除去的图像。
    reason: lexical_alternative
lexical_decisions:
- source_word: ጌጋየ
  choice: 不法之事
  rationale: 该词形及本行句法十分困难，可指过错、恶行；另有将其理解为“我的锁链”的传统。正文依上下文采用“不法之事”，脚注保留具体的锁链意象。
- source_word: እደዊሆሙ
  choice: 他们的手
  rationale: 直译身体部位及其复数代词后缀，也保留“手”作为行为主体的源文表达。
- source_word: ይገብሩ
  choice: 施行
  rationale: 基本义为“做、制造”。与“不法之事”搭配时译作“施行”，自然且未削弱其主动责任。
- source_word: ዘይጻምዉ
  choice: 助长
  rationale: 原词通常带有饥渴、渴望之意，但本行结构晦涩。正文按“不法之事”的理解译为“助长”，脚注另存“渴求锁链”的直译可能。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 这是以诺书审判场景中常见的道德称谓，指作为一类受审判的人。
- source_word: ይበልዑ
  choice: 吞吃
  rationale: 保留“吃”的具体强烈意象，不将其抽象化为“伤害”或“毁灭”。
- source_word: እምገጸ ለእግዚአ መነፈሳት
  choice: 从诸灵之主面前
  rationale: 贴近“从……的面/面前”这一驱逐出神圣临在的以诺书惯用语。
- source_word: ይትሐጐሉ
  choice: 被除灭
  rationale: 表达被迫消失、遭毁坏的审判结果，但不进一步界定其形而上的性质。
- source_word: እምገጸ ምድረ ዚአሁ
  choice: 从他的地面
  rationale: 保留源文“他的地之面”的空间性表达，同时使现代汉语顺畅。
- source_word: ይትቀወሙ（疑为ይትነቀሉ的讹读）
  choice: 被拔除
  rationale: 据校勘判断，传抄或识别出的词形很可能误读了意为“拔除”的动词；“被拔除”也符合从地面移除的审判图像。
- source_word: ወ[ኢ]ያነልቁ ለዓለመ ዓለም
  choice: 他们永永远远不再存留
  rationale: 按带否定词的较直译读法处理，以“不再存留”保留永久排除与彻底灭亡之间的神学张力。
theological_decisions:
- issue: 末句所说最终审判的性质
  choice: 译为“永永远远不再存留”
  alternative: “永永远远灭亡”或仅指永远被逐离地面
  rationale: 源文末尾有文本和句法不确定性。正文表达审判的不可逆性，却不武断界定这是本体性的消灭，还是永久的排除。
- issue: 首句锁链意象与不法行为之间的歧义
  choice: 正文采用“不法之事”的连贯读法
  alternative: “我的锁链要成为他们手中的镣铐；凡渴求它们的罪人都要吃下它们”
  rationale: 词形可与过错、恶行相关，而既有校读又保存了“锁链”的具体理解。因源文困难，不在正文中混合两种互不相同的句法分析，改由脚注明示另一可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“诸灵之主”保留《以诺一书》的特有神圣称号；“吞吃”“拔除”等具体动词保存启示文学的强烈意象。正文不强行消解首句与末句的文本困难，并以脚注呈现主要替代读法。
