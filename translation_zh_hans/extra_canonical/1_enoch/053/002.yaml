    reason: lexical_alternative
  - marker: b
    text: “被拔除”也可译为“被放逐”或“被移除”。所给底本文字疑有讹读；“拔除”保留了从地上连根除去的图像。
    reason: textual_variant
  - marker: c
    text: 更直译为“他们永永远远不再存留”。底本中的否定词本身也带有校勘上的不确定性；也可理解为“他们必永永远远灭亡”。
    reason: textual_variant
  revision_rationale: 修订恢复首句中第一人称“我的”及锁链意象，恢复“渴求—吃下”的具体动词，同时不试图消除其令人费解的启示文学图像。后半节采用较稳妥的驱逐／除去表达；末句保留“并不存留”的否定式，以免将永久排除直接解释为特定的形而上灭绝。脚注已重组，使每一脚注与其所说明的正文词语相邻且不重复。
