base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/003.yaml
  text: For I saw all the angels of punishment lodging there and preparing all the instruments of Satan[a][b][c].
translation:
  language: zh_hans
  text: 因为我看见所有施行惩罚的天使都住在那里，预备撒但的一切器具[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给的吉兹语转写在“预备”之后似乎残缺；“撒但的一切器具”据完整校勘文本所保存的续文补入。
    reason: textual_variant
  - marker: b
    text: “住在那里”也可译作“驻留在那里”或“在那里安营”；原词主要表示停留或住在某处。
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 承接上文并引出解释，保留原词的因果连接作用；现代汉语中“因为”比单用“因”更自然。
- source_word: ርኢክዎሙ ለኵሎሙ
  choice: 我看见所有……
  rationale: 保留第一人称异象叙述和范围完整的“所有”；宾语由后面的天使短语明确。
- source_word: መላእክተ መቅሠፍት
  choice: 施行惩罚的天使
  rationale: 原文为属格结构，可指与惩罚相关或执行惩罚的天使；此译自然地表达其审判职能，同时不采用带特定宗派色彩的术语。
- source_word: እንዘ የኃድሩ
  choice: 都住在那里
  rationale: 该动词表达停留、居住或驻留；“住在那里”通顺而不强行断定永久居住。
- source_word: ወያስተዴ
  choice: 预备
  rationale: 现有转写在此处似有截断，但该词形表达预备或安排；“预备”既庄重又保留宽泛含义。
- source_word: ኵሎ ንዋየ ሰይጣን
  choice: 撒但的一切器具
  rationale: 据完整校勘文本所保存的续文翻译；“一切”对应量词ኵሎ，“器具”保留ንዋይ可指器械、用具或物件的宽泛意义。
theological_decisions:
- issue: 天使所预备之物在所给转写行中缺失
  choice: 在正文译作“撒但的一切器具”，并以脚注说明文本状况
  alternative: 正文止于“预备”，不补出宾语
  rationale: 所给Charles转写似在动词之后残缺，而完整校勘文本保存了“撒但的一切器具”。将其纳入正文可恢复完整句意，但脚注明示其并非直接见于本题所给的残缺行，避免掩盖文本证据的层次。
- issue: “撒但的器具”是所属关系还是供其使用的器械
  choice: 保留属格表达“撒但的……器具”
  alternative: 译作“为撒但预备的器械”
  rationale: 原文属格本身未明确器具是撒但所有、与撒但相关，还是为其用途而设；直译属格可保留这一神学与语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“施行惩罚的天使”避免生硬的名词堆叠；“器具”有意保持宽泛，不擅自具体化为锁链、刑具或武器。
