base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/001.yaml
  text: And he said to me[a], “Enoch, why do you ask about the fragrance of this tree, and inquire so that you may know?”
translation:
  language: zh_hans
  text: 他对我说：“以诺，你为什么询问这棵树的香气[a]，又探问，为要知道呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香气”也可译作“气味”；原词可泛指闻到的气味，此处按异象场景译作“香气”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይቤለኒ
  choice: 他对我说
  rationale: 保留叙事中引出直接引语的常用表达，准确体现“对我说”。
- source_word: ሄኖክ
  choice: 以诺
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ምንተ ትስእል
  choice: 你为什么问
  rationale: 字面结构以“什么”为基础，但结合后文所说明的询问对象和目的，按语境译为“为什么问”更符合现代汉语，同时保留说话者对以诺询问动机的探问。
- source_word: በእንተ መዓዛሁ ለዝ ዕፅ
  choice: 这棵树的香气
  rationale: መዓዛ可指气味或香气；此处描写奇异之树，译作“香气”自然庄重。ዕፅ在语境中具体指树。
- source_word: ወትጠየቅ
  choice: 又求问
  rationale: 与前面的“问”区分开来，并保留原文两个询问动词并列所形成的重复表达。
- source_word: ከመ ታእር
  choice: 想要知道
  rationale: 表达原文的目的关系和认知意味；在问句中比“以便你知道”更自然。
theological_decisions:
- issue: 说话者回应以诺时的语气
  choice: 带有温和追问意味，而非严厉斥责
  alternative: 将其理解为对不当好奇心的严厉责备，或单纯要求澄清问题
  rationale: 原文重复使用询问动词并加上目的表达，较可能是在追问以诺为何想知道，或引导他继续领受启示；译文不额外加入责备语气，以保留其开放性。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。保留原文两个询问动词的重复，并以“呢”呈现直接问话的语气；不强化为责备，也不削弱其中对询问动机的追问。
