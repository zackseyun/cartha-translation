base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/004.yaml
  text: And this fragrant tree—no flesh has authority to touch it until the great judgment[a], when all will be avenged and brought to completion forever[d][c][b]; then it will be given to the righteous and the humble.
translation:
  language: zh_hans
  text: 这棵芳香的树，凡属血肉的都无权触碰，直到大审判的时候[a]，就是一切都受报，并永远得以成全的时候[b]。那棵树要赐给义人和谦卑的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“没有血肉有权”。这里的“血肉”指必死的人，并非把血肉当作一种物质来说。
    reason: lexical_alternative
  - marker: b
    text: 大审判之后的这个分句较难。原文可理解为“一切都受报，并永远得以成全”；动词的语态和“成全”所指并不完全明确。“一切”也可能指所有人、万事，或整个审判的事。
    reason: textual_variant
lexical_decisions:
- source_word: ዕፀ መዓዛ
  choice: 芳香的树
  rationale: 保留具体的树木意象和以香气为特征的含义，现代汉语自然清楚。
- source_word: አልሐዱ
  choice: 触碰
  rationale: 表达实际接触，同时不擅自限定为摘取或食用。
- source_word: ዘሥጋ
  choice: 凡属血肉的
  rationale: 保留“血肉”的末世性人类学意象，并用“凡属”表明所指是有血肉的必死者，而非血肉这种物质。
- source_word: ሥልጣነ
  choice: 无权
  rationale: 这里强调获准接近的权利或权限，不只是客观能力。
- source_word: ኵነኔ
  choice: 审判
  rationale: 符合末世大审判的语境，也比“定罪”保留更宽的语义。
- source_word: ይትቤቀል
  choice: 他要向一切施行报应
  rationale: 保留动词的报复、追讨或惩治意味，也保留原文未明说身份的单数主语。
- source_word: ኵሎ
  choice: 一切
  rationale: 不提前限定为所有人或所有事物，保留原文对象范围的宽泛性。
- source_word: ይፌጽም
  choice: 使一切成全
  rationale: 传达完成、使之达到终局的意义；补出“一切”使中文可读，同时不把所完成的事项过度具体化。
- source_word: ለዓለም
  choice: 永远
  rationale: 以自然庄重的现代汉语表达持续至永恒。
- source_word: ጻድቃን
  choice: 义人
  rationale: 这是末世文学中的关键身份称谓，简洁且沿用广泛。
- source_word: ትሑታን
  choice: 谦卑的人
  rationale: 准确表达低微、谦卑之意，避免误译为“圣洁的人”。
- source_word: ይትወሀብ
  choice: 要赐给
  rationale: 保留将来被动和作为恩赐授予的含义；中文以无显明施事的“要赐给”自然表达。
- source_word: ዝኩ
  choice: 那棵树
  rationale: 按指示代词“那、那一个”理解，并明确回指前述芳香的树，不译作原文没有的时间副词“然后”。
theological_decisions:
- issue: 禁令中“血肉”的所指
  choice: 凡属血肉的必死者都无权触碰这棵树
  alternative: 任何有身体的受造物都不能胜过它；或任何人都不可吃树上的果子
  rationale: 原文保留“血肉”一语，但语境表明它是对必死之人的称呼；“触碰”不额外引入食用的含义。
- issue: 报应分句的主语
  choice: 保留未明示身份的单数“他”
  alternative: 译为无人称被动“报应将临到一切”；或直接补明“上帝”
  rationale: 原文动词可承载隐含的单数主语。中文用“他”保留这一语法力度，同时不超出经文明确说出施事者的程度。
- issue: 审判之后树的归属
  choice: 明确“那棵树”将赐给义人和谦卑的人
  alternative: 译作带时间含义的“然后它将被赐下”
  rationale: ዝኩ 是回指性的指示形式，不宜据此加入“然后”；直指那棵树也消除中文代词可能造成的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留“血肉”“施行报应”“成全”等启示文学色彩；以“那棵树”准确回指，避免把指示代词误读为时间连接词。
