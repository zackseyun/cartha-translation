base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/002.yaml
  text: At that time I[a], Enoch, answered him, saying, “I desire to know about everything[b], but especially about this tree.”
translation:
  language: zh_hans
  text: 那时，我以诺回答他说：“我想知道这一切，尤其想知道这棵树。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语末尾的措辞略难确定；也可理解为：“关于这一切，我尤其想进一步了解这棵树。”
    reason: textual_variant
lexical_decisions:
- source_word: አውሣእክዎ
  choice: 回答他
  rationale: 该动词表示“回答”，并带有第三人称阳性单数宾语后缀，因此明确译出“他”。
- source_word: እንዘ፡ እብል
  choice: 说
  rationale: 这是引出直接引语的结构；现代汉语用“说”自然简洁，也保留叙事语气。
- source_word: በእንተ፡ ኵሉ
  choice: 这一切
  rationale: 介词短语所指范围广，承接此前异象中所见之事；“这一切”比抽象的“一切事物”更符合上下文。
- source_word: እፈቅድ፡ ኣእምር
  choice: 我想知道
  rationale: 前一词表达意愿，后一词表达认识或知道；合译为“想知道”准确而符合现代汉语。
- source_word: ወፈድፋደሰ
  choice: 尤其
  rationale: 该形式加强并突出后面的对象；“尤其”自然呈现从“这一切”转到“这棵树”的强调关系。
- source_word: በእንተዝ፡ ዕፅ
  choice: 这棵树
  rationale: 在异象景观的语境中，ዕፅ 指树；指示成分译为“这棵”。
theological_decisions:
- issue: 以诺的请求是泛指全部异象，还是只要求进一步认识这棵树
  choice: 我想知道这一切，尤其想知道这棵树
  alternative: 关于这一切，我想更进一步知道这棵树
  rationale: 原文先提“这一切”，随后以加强语突出“这棵树”。正文保留整体求知与特别关注树之间的张力，不把请求缩减为单纯对树的好奇；脚注同时说明另一种可能的句法理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“回答他说”明确保留原文动词中的男性单数宾语；引语以“这一切……尤其……这棵树”呈现原文由广到专的强调结构。
