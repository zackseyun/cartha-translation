  text: From its fruit life shall be given to the chosen ones[a], and it shall be planted toward the north[b], upon...
translation:
  language: zh_hans
  text: 生命将借着它的果子赐给蒙拣选的人[a]；它将被栽种到北方，在……之上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙拣选的人”是《以诺一书》中的重要群体称谓；也可译作“被拣选的人”。此处不将其含义限定为后世神学术语的技术性用法。
    reason: key_term
  - marker: b
    text: 本题所提供的吉兹文本在介词“在……之上”之后中断，原应接续的宾语未收入本节文本。因此译文以省略号保留这一未完成的结构，不擅自补足地点。
    reason: textual_variant
lexical_decisions:
- source_word: ፍሬ
  choice: 果子
  rationale: 保留异象中树木及其果实的具体意象；“果子”比“出产”更直接自然。
- source_word: ይትወሀብ
  choice: 要赐给
  rationale: 体现该动词的被动、将来含义，同时保持庄重的应许语气；整句以“生命要……赐给”表达原文被动结构。
- source_word: ኅሩያን
  choice: 蒙拣选的人
  rationale: 保留《以诺一书》中这一末世群体称谓，又避免采用可能带入后世特定教义体系的术语。
- source_word: ሐይወት
  choice: 生命
  rationale: 原词直接表示“生命”；上下文或含末世性的丰盛生命，但译文不增补“永生”等原文未明说的内容。
- source_word: መንገለ መስዕ
  choice: 朝北
  rationale: 保留介词所表达的方向性；在现代汉语中“朝北”比“向着北方”更简洁自然。
- source_word: ይተከል
  choice: 将……栽种
  rationale: 保留被动、将来意义以及树木的意象，不擅自明确为“移栽”。
- source_word: ዲበ
  choice: 在……之上
  rationale: 该词是需要宾语的介词，可表示“在、在……之上”；所给见证在此中断，因此以省略号保留未完句法，不误译为独立副词“上方”。
theological_decisions:
- issue: ኅሩያን所指群体的身份
  choice: 译作“蒙拣选的人”，作为获得末世生命的群体称谓
  alternative: 译作“选民”或笼统译作“义人”
  rationale: “蒙拣选的人”既保留原文的拣选观念，也不把后世系统神学中更技术化的含义强加于此。
- issue: 所应许之“生命”的性质
  choice: 正文仅译“生命”
  alternative: 扩译为“永生”、医治或复兴
  rationale: 上下文暗示这生命超越普通生存，可能具有末世意义，但本节所存原文只写“生命”，故保留其开放性。
- issue: 残句所指的栽种地点
  choice: 保留“在……之上”的未完成结构
  alternative: 依据其他版本补作“在圣所之上”或把ዲበ译成“上方”
  rationale: 所给吉兹文在介词之后截断，不能仅凭补足推测把宾语写入正文；省略号忠实呈现见证现状。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“生命要从它的果子赐给……”略带原文式庄重感，以保留被动结构和果子作为生命来源的关系；末尾用“在……之上”明确呈现未带宾语的介词结构，并以省略号标示来源文本的截断。
