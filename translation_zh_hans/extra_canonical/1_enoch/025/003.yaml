base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/003.yaml
  text: And he answered me[a], saying, “This high mountain that you have seen, whose summit is like the throne of the Lord, is his throne, where the Holy and Great One, the Lord of Glory, the Eternal King[c][b], will dwell when he comes down to visit the earth with goodness.”
translation:
  language: zh_hans
  text: 他回答我说：“你所看见的这座高山，山顶仿佛主的宝座；这山就是他的宝座。至圣至大者、荣耀之主、永恒之王，降临以恩惠眷顾大地时，要住在那里。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以恩惠眷顾大地”也可理解为“为善而察看大地”或“在良善中眷顾大地”。原文强调这次神圣眷临带有良善、施恩的性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: 回答
  rationale: 保留异象对话中的应答语气，现代汉语自然简明。
- source_word: ደብር ዘርኢከ ነዋኅ
  choice: 你所看见的这座高山
  rationale: 准确表达山岳、第二人称所见及其高耸特征。
- source_word: ዘርእሱ ይመስል መንበረ ለእግዚአ
  choice: 山顶仿佛主的宝座
  rationale: 将“头／顶”按山岳语境译作“山顶”，并保留明喻及神圣王权意象。
- source_word: መንበሩ ውእቱ
  choice: 这山就是他的宝座
  rationale: 保留原文明确的身份判断和“宝座”一词的重复，不弱化为泛指的地点。
- source_word: ኀበ ይነብር
  choice: 要住在那里
  rationale: 源动词主要表示居住、停留；用未来表达与后面的降临时间从句协调。
- source_word: ቅዱስ ወዐቢይ
  choice: 至圣至大者
  rationale: 作为独立的神圣称号处理，并以庄重而自然的中文表达其至高属性。
- source_word: እግዚአ ስብሐት
  choice: 荣耀之主
  rationale: 保留“荣耀”及“主”的圣经式称号关联，同时符合现代中文宗教文体。
- source_word: ንጉሥ ዘለዓለም
  choice: 永恒之王
  rationale: 简洁保留王权称号和永存含义。
- source_word: የኀውጻ ለምድር በሠናይ
  choice: 以恩惠眷顾大地
  rationale: “眷顾”涵盖巡视、探访之义，“以恩惠”保留 በሠናይ 的善意或良善方式，避免仅译成空间上的下降。
theological_decisions:
- issue: 高山、山顶与神的宝座之间的关系
  choice: 译为“山顶仿佛主的宝座；这山就是他的宝座”
  alternative: 可将前句理解为整座山仿佛主的宝座，或把后句弱化为神坐席所在之处
  rationale: 原文先有相似比较，继而明确说“它是他的宝座”；译文保留两层陈述及其张力，不将二者合并。
- issue: 神在宝座处的动作
  choice: 要住在那里
  alternative: 要坐在那里
  rationale: ይነብር 更直接表示居住或停留；宝座语境虽可引出“坐”的联想，但不应以联想取代词义。
- issue: 降临眷顾大地的性质
  choice: 降临以恩惠眷顾大地
  alternative: 降临察看大地是否良善；降临在良善中探访大地
  rationale: 原文末语可涉及为善、以良善或带来福惠的眷临。正文表达其施恩性质，脚注保留语义范围，不把它限定为纯粹审察或移动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“至圣至大者、荣耀之主、永恒之王”按同位称号排列，保留以诺文学的崇高语调；用分号和句号清楚呈现“仿佛宝座”与“就是他的宝座”的递进关系。
