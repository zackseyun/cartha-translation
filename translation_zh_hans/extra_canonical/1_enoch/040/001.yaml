base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/001.yaml
  text: And after that I saw thousands of thousands and ten thousands of ten thousands[a], whose number and count were without end[e][d][c][b], standing before the Lord of Spirits.
translation:
  language: zh_hans
  text: 此后，我看见数以百万、亿万计的人[a]；他们的数目和数算都没有穷尽，侍立在万灵之主面前。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文依次数说“千的千”和“万的万”，即百万和一亿，表示不可胜数的庞大群体。
    reason: lexical_clarification
  - marker: b
    text: 参但以理书7:10，其中也有无数侍立者站在神面前的异象。
    reason: cross_reference
lexical_decisions:
- source_word: ወርኢኩ፡ እምድኅረዝ
  choice: 此后，我看见
  rationale: 保留异象叙事的承接关系，同时用自然的现代汉语表达“在那以后”。
- source_word: አእላፈ፡ አእላፍ
  choice: 千千万万
  rationale: 对应“千的千”，以汉语熟悉的叠数形式传达极其庞大的群体，并保留启示文学的庄严感。
- source_word: ትእልፊተ፡ ትእልፊት
  choice: 万万万万
  rationale: 原词表示“一万”，重复结构直译为“万的万”；采用“万万万万”与前句平行，避免借用源自希腊语的数量术语。
- source_word: '*ኍልቈ፡ ወኃሳበ፡ አልቦሙ'
  choice: 他们的数目无法计数
  rationale: OCR所示首词虽带不确定标记，但可辨为与“数目”相关的形式；连同“计数”和否定存在式，整体自然表达为“数目无法计数”，既反映两个计数概念，又不作过度猜测。
- source_word: እለ፡ ይቀውሙ
  choice: 他们站
  rationale: 关系代词与复数未完成体在此说明这群人的姿态；汉语拆为独立分句更清楚自然。
- source_word: ቅድመ፡ እግዚአ፡ መናፍስት
  choice: 在万灵之主面前
  rationale: “面前”保留天庭场景中的空间与朝见意味；“万灵之主”作为固定神圣称号，简洁庄重，也不强行判定吉兹语中未明示的定指层级。
theological_decisions:
- issue: “灵之主”称号的所指与形式
  choice: 万灵之主
  alternative: 众灵之主／灵之主
  rationale: 上下文中该词组是至高者的固定尊称。“万灵之主”在现代汉语中自然、庄严，表达统管众灵之意，却不额外引入某一宗派的神学称谓。
- issue: 站立者的身份
  choice: 仅译作“他们”，不具体说明是天使、圣者或其他天上群体
  alternative: 众天使／天军
  rationale: 本节只给出庞大数量及其站在主面前的姿态，并未在此明确界定身份；保留这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“千千万万、万万万万”刻意保留原文平行叠数；分号使不可计数的说明和侍立姿态层次清楚。所有脚注标记均置于正文相应位置。
