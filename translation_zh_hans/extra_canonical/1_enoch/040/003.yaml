base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/003.yaml
  text: And I heard the voices of those four beings as they gave praise before the Lord of glory[a][b][c].
translation:
  language: zh_hans
  text: 我听见那四位[a]的声音；他们在荣耀之主[b]面前颂赞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“那四张脸”或“那四个面容”。这里很可能是承接上文，以“面容”称呼那四位天上形象，并非指四张孤立的脸；也可译作“那四位天上形象”。
    reason: 保留原文“面容”的字面意象及其对上文的照应，同时使正文在现代汉语中自然明确。
  - marker: b
    text: “荣耀之主”也可译作“光辉之主”。
    reason: 保留 ስብሐት 的另一词义。
lexical_decisions:
- source_word: ወሰማዕኩ
  choice: 我听见
  rationale: 直译第一人称完成式，保留异象叙述的简洁语气。
- source_word: ቃሎሙ
  choice: 他们的声音
  rationale: ቃል 可指声音、话语或声响；此处描写天上颂赞，以“声音”最符合听觉场景，同时不擅自补出颂词内容。
- source_word: እልኩ ገጽ አርባዕቱ
  choice: 那四位“面容”
  rationale: ገጽ 的本义是“脸、面容”，并承接上文的四个天上形象。用量词“位”表明所指是有位格的天上形象，以引号和脚注保留原文独特的“面容”称谓，避免译成仿佛四张脱离身体的脸。
- source_word: እንዘ ይሴብሑ
  choice: 他们正在……颂赞
  rationale: እንዘ 加动词表示与“听见”同时进行的动作；“正在”清楚表达进行中的颂赞。
- source_word: ቅድመ
  choice: 在……面前
  rationale: 保留“在某者面前、在其临在中”的宫廷和敬拜场景。
- source_word: እግዚአ ስብሐት
  choice: 荣耀之主
  rationale: 按构词直译这一神圣称号，语言庄重，也与现代汉语圣经语体自然衔接。
theological_decisions:
- issue: ገጽ 应按字面译作“面容”，还是按语境明译为天上活物或形象
  choice: 那四位“面容”
  alternative: 那四位天上形象／那四个活物
  rationale: 原词明确是“脸、面容”，且可能与上文形成刻意的词汇照应；正文保留该异象性称谓，不把这些形象直接认定为某一特定类别。量词“位”和脚注则帮助现代读者理解这里不是指四张孤立的脸。
- issue: ስብሐት 表示“荣耀”还是“光辉”
  choice: 荣耀
  alternative: 光辉
  rationale: 两者在此均有词义根据。“荣耀”更适合作为神圣称号，同时脚注保留“光辉”的可能性，不将意象限定为单一含义。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙述语体。“颂赞”保留敬拜场景的肃穆感；分号清楚区分“听见声音”与同时发生的颂赞动作。对罕见称谓“面容”使用引号并加注，使正文既忠于原文意象，又不致让普通读者误解。
