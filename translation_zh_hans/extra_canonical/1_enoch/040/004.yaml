base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/004.yaml
  text: The voice of the first blesses the Lord of Spirits forever and ever[a][b].
translation:
  language: zh_hans
  text: 第一位的声音[a][b]称颂万灵之主，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“话语”或“发声”。原词既可指所说的话，也可指发出的声音；这里按异象中依次听见天上声音的场景译作“声音”。
    reason: lexical_alternative
  - marker: b
    text: 有译本作“第一个声音”。但原文的语法更直接地表示“第一位的声音”，所指可能是前文四位临在者中的第一位。
    reason: grammar_and_previous_rendering
lexical_decisions:
- source_word: ቃለ
  choice: 声音
  rationale: 该词在此为构造形式，意为“……的声音／话语”。异象场景强调以诺所听见的天上发声，因此译作“声音”，同时在脚注保留“话语”的可能。
- source_word: ቀዳማዊ
  choice: 第一位
  rationale: 该词在这里由前面的构造形式所支配，指前文四位临在者中的第一位；译作“第一位”比“第一个声音”更能保留原文语法关系。
- source_word: ይባርኮ
  choice: 称颂
  rationale: 动词意为“祝福、颂赞”。宾语为上帝时，现代汉语通常用“称颂”，既自然又保留敬拜语境。
- source_word: ለእግዚአ መናፍስት
  choice: 万灵之主
  rationale: 这是《以诺一书》中具有称号性质的神圣称谓。“万灵之主”在汉语中庄重自然，并表达对诸灵的统治权；“诸灵之主”亦属可能。
- source_word: ለዓለመ ዓለም
  choice: 直到永永远远
  rationale: 原文以重复方式加强无尽久远之意；“直到永永远远”保留这种强调，也符合庄重的颂赞语体。
theological_decisions:
- issue: 神圣称号 ለእግዚአ መናፍስት 的译法
  choice: 万灵之主
  alternative: 诸灵之主／众灵之主
  rationale: 采用称号式表达，保留其宇宙性统治意味，不把“灵”限定为某一类灵体；“万”在此表示众多、全体，并非对原文作精确数字化解释。
- issue: “第一位”与“声音”的关系
  choice: 第一位的声音
  alternative: 第一个声音
  rationale: 原文 ቃለ 是构造形式，较直接地表示“第一位的声音”，并与前文所见的临在者相连；不将其简化为声音本身的排序。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“称颂”比对上帝说“祝福”更符合现代汉语习惯；保留“第一位的声音”这一略带异象色彩的结构，以反映吉兹文构造关系。
