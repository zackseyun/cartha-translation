base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/002.yaml
  text: And on the four sides of the Lord of Spirits I saw four other faces[a], different from those who do not sleep. And I learned their names[c][b], for the angel who came with me made their names known to me and showed me all the hidden things.
translation:
  language: zh_hans
  text: 我看见众灵之主的四边有另外四张脸[a]，与那些不睡的不同。我得知了他们的名字，因为那位与我同行的天使使我知道他们的名字，又把一切隐藏的事[b]显明给我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “四张脸”也可译作“四副面容”；原文使用的是具体的“脸”一词。此句开头“四边”所对应的词也可指“四翼”，因此全句也可译作：“我看见，在众灵之主的四翼旁，有另外四张脸……”
    reason: 保留“脸”的具体视觉意象，并交代“四边／四翼”的词义歧义，而不加入超出原文的身份解释。
  - marker: b
    text: “隐藏的事”也可译作“隐秘的事”，是启示文学中指天上奥秘的常见说法。
    reason: 提供语境相符的词义替代，不在正文中额外术语化。
lexical_decisions:
- source_word: በአርባዕቱ ክነፊሁ
  choice: 在……的四边
  rationale: ክነፍ可指“翅膀”，也可空间性地指边缘、侧边；此处描述众灵之主周围的位置，译作“四边”可避免无根据地断定众灵之主有翅膀，同时保留“四方环绕”的图景。
- source_word: ለእግዚአ መናፍስት
  choice: 众灵之主
  rationale: 这是《以诺一书》中反复出现的神圣称号；“众灵之主”自然、庄重，也不限定所指仅为某一类灵。
- source_word: አርባዕተ ገጸ ካልአ
  choice: 另外四张脸
  rationale: ገጽ的直接意义是“脸、面容”。译为“脸”保留异象的可见意象，不抽象化为“临在者”或“存在者”；下文提到他们的名字，表明这些脸代表有位格的天上存在。
- source_word: እምነ እለ ኢይነውሙ
  choice: 与那些不睡觉的不同
  rationale: 将关系从句“那些不睡觉的”与前述对象相连，既保留原文对比，也避免误读为这四张脸本身不睡觉。
- source_word: አእመርኩ
  choice: 我得知了
  rationale: 表达由不知道到知道的过程，符合随后天使告知名字的叙事关系。
- source_word: ዘአይድዐኒ አስማቲሆሙ
  choice: 使我知道他们的名字
  rationale: 保留使役含义，并以自然的现代汉语表达天使启示名字这一动作。
- source_word: ኅቡኣተ
  choice: 隐藏的事
  rationale: 直译其“被隐藏、隐秘”的含义，在启示文学语境中可指获准揭示的天上奥秘，但正文不额外加入技术性神学概念。
theological_decisions:
- issue: 神圣称号እግዚአ መናፍስት的翻译
  choice: 众灵之主
  alternative: 诸灵之主／灵之主
  rationale: “众灵之主”作为称号清楚庄重，并保留复数“灵”的范围开放性，不武断判定是所有灵还是特定的天上诸灵。
- issue: 四边与翅膀的意象
  choice: 在众灵之主的四边
  alternative: 在众灵之主的四翼旁
  rationale: ክነፍ兼有“翼”和“边、侧”之义；此处采用空间义，不据此赋予众灵之主翅膀。异文可能性在脚注中保留。
- issue: “不睡觉的”所修饰的对象
  choice: 指先前提到的“那些”存在者
  alternative: 指新见到的四张脸
  rationale: 原文关系结构更自然地把“不睡觉的”归于“那些”；译文维持此句法关系，不进一步解释其身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我看见”保留异象见证的重复句式；“众灵之主”作为固定神圣称号；“四张脸”刻意保留原文具体而略显奇异的异象语言。所有脚注标记均已置于正文对应位置。
