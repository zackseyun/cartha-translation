revisions:
- from: 我从那里往东走，进入荒野的山岭中。我看见一片旷野，孤零零的，却长满了树木和植物。水从上方涌流下来，汇成一股浩大的水流，朝西北方向奔流；云气和露水便从四面升腾。[a]
  to: 我从那里往东走，来到荒野山岭的中央。我看见一片荒野，孤零零的，满是树木。从这地方有水涌出；其上显出许多水流，向北、向西流去。水和露水又从四面升起。[a]
  rationale: 修订保留全节的地貌与水文意象，并按原文依次表达东行、荒野中的山岭、孤寂而多树的荒野、水的涌出、向北和向西的水流，以及水和露水的升起。删除无原文根据的“云气”，不把两方向压缩为“西北”，并以脚注处理末段真实的句法歧义。
