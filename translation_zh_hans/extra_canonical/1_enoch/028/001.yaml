  text: And from there I went on a journey..[a][b].
translation:
  language: zh_hans
  text: 我从那里往东走，来到荒野山岭的中央。我看见一片荒野，孤零零的，满是树木。从这地方有水涌出；其上显出许多水流，向北、向西流去。水和露水又从四面升起。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的吉兹语句法十分凝缩。“从四面”“从那里／从这地方”与“水和露水”的具体修饰关系并不完全确定；也可译为：“水和露水从那里从四面升起。”
    reason: 保留末段介词短语的附着关系及指示词所指的不确定性，避免把原文的“水”增译为“云气”。
lexical_decisions:
- source_word: መንገለ፡ ጽባሕ
  choice: 往东
  rationale: መንገለ在这里是表示方向的介词，ጽባሕ在此指东方；合译为“往东”，不把መንገለ误作“道路”。
- source_word: ደብረ፡ መድበራ
  choice: 荒野的山岭
  rationale: ደብር表示山、山地或山岭，መድበር表示荒野、沙漠；采用自然的中文属格结构，同时保留地貌关系。
- source_word: ገዳመ፡ ባሕቲቶ
  choice: 一片旷野，孤零零的
  rationale: ገዳም指荒野或无人之地，ባሕቲቶ强调独自、孤立；译文保留这片地方偏僻孤绝的画面。
- source_word: ምሉእ፡ ዕፀወ
  choice: 长满了树木和植物
  rationale: ምሉእ意为充满，ዕፅ及其形态可泛指树木、草木或植物。中文用“树木和植物”表达植被繁茂，并与荒野的反差相呼应。
- source_word: ማይ፡ ይፈለፍል
  choice: 水……涌流下来
  rationale: 动词表示涌出、喷出或奔流。结合በላዕሉ“在其上方”，译为水从上方涌流下来。
- source_word: አስራብ
  choice: 水流
  rationale: 语境指大量奔流的水道或急流；“水流”避免过度限定为天然河川，同时符合后文流向。
- source_word: መንገለ፡ መስዕ፡ መንገለ፡ ዐረብ
  choice: 朝西北方向
  rationale: 两个方向短语分别指北方和西方，合起来表示西北方向。
- source_word: ማይ፡ ወጠል
  choice: 云气和露水
  rationale: 末句传统理解涉及因水势产生并上升的云雾与露气；按上下文以“云气和露水”呈现，同时用脚注说明原文结构的不确定性。
