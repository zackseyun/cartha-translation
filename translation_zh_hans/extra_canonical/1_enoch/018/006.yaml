base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/006.yaml
  text: And I went on toward the south[a], and I saw a place burning day and night[b], where there were seven mountains of precious stone—three toward the east and three toward the south.
translation:
  language: zh_hans
  text: 我继续往南走去，看见一个地方昼夜燃烧；那里有七座由珍贵石头构成的山[a]：三座朝东，三座朝南。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存吉兹语文本先说有七座山，随后只说三座朝东、三座朝南；本节没有说明第七座山的方位。“珍贵石头”也可译作“贵重的石头”或“华美的石头”。
    reason: 原文在山的总数与所列方位之间留有未说明之处；同时说明ክቡር的词义范围。
lexical_decisions:
- source_word: ሐለፍኩ
  choice: 我继续……走去
  rationale: 表达异象行程的延续，既保留“经过、前行”的动态，也符合现代汉语叙事习惯。
- source_word: መንገለ አዜብ
  choice: 往南
  rationale: መንገለ表示朝向，አዜብ在此为“南方”；“往南”自然地保留方向性。
- source_word: ወርኢኩ መካነ
  choice: 看见一个地方
  rationale: 按原文引入新的异象地点，不额外限定其性质或确指性。
- source_word: ዘይነድድ መዐልተ ወሌሊተ
  choice: 昼夜燃烧
  rationale: 保留持续燃烧的鲜明图景；“昼夜”简洁体现日夜不断。
- source_word: ኀበ ሰብዓቱ አድባር
  choice: 那里有七座……山
  rationale: 将ኀበ理解为地点关系，以通顺汉语呈现该处与七座山的关联。
- source_word: ዘእምእብን ክቡር
  choice: 由珍贵石头构成的
  rationale: እብን意为石头，ክቡር可指贵重、尊贵或华美；“珍贵石头”贴合矿石意象，同时不武断指定具体宝石种类。
- source_word: ፫መንገለ ጽባሕ
  choice: 三座朝东
  rationale: 在方位并列中，ጽባሕ宜译为“东”；“朝东”保留方向关系。
- source_word: ወ፫መንገለ አዜብ
  choice: 三座朝南
  rationale: 与前一分句保持平行，并忠实保留传世文本所列的南方方位。
theological_decisions:
- issue: 燃烧之地与珍贵石山的宇宙地理意象
  choice: 按异象中的具体景物直译
  alternative: 将其概括为火焰区域，或在正文中解释为天界建筑或象征
  rationale: 原文描绘景象而未加解释；译文应保留其启示文学的具体性与可能的象征张力。
- issue: 七座山与所列方位合计不一致
  choice: 正文照录“七座”，并保留“三座朝东，三座朝南”，以脚注说明
  alternative: 在正文中推断或补出第七座山的方位
  rationale: 现存本节没有交代第七座山的方位；不应凭推测补足或消解文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“珍贵石头”避免使用容易被理解为已加工珠宝的“宝石”，也保留原词可指贵重或华美之石的宽度。
