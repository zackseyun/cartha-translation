base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/005.yaml
  text: I saw the winds upon the earth[a], which bear the clouds; I saw the paths of the angels[d][c][b]; I saw at the end of the earth the firm support of the heaven above.
translation:
  language: zh_hans
  text: 我看见地上的风托着云彩[a]；我看见天使的路径；我在大地尽头看见上方天空的坚固支撑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头这一分句的埃塞俄比亚文在句法上有难处，也可较直译为“地面之上的风承载着云彩”。希腊文见证明确支持“风在地上，承载云彩”这一理解。
    reason: textual_variant
  - marker: b
    text: 或译：“上方天空的根基。”原词可指坚固、稳固，也可指提供支撑的力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: 我看见
  rationale: 保留异象叙事中三次重复的报告公式，并不添加原文没有的连词，以呈现简短有力的节奏。
- source_word: ነፋሳተ
  choice: 风
  rationale: 本节依次描绘风、云、天使的路径和天空的支撑，宇宙景象的语境支持物理意义“风”，而非“灵”。
- source_word: ዘዲበ ምድር
  choice: 地上的
  rationale: 介词短语修饰“风”，意为在地上或地面之上的风；不把“地”误作后面动词“托着”的宾语。
- source_word: ዘይጸውር
  choice: 托着
  rationale: 该动词有承载、托住之意；“托着”既保留宇宙承托的图像，也符合现代汉语表达。
- source_word: በደመናት
  choice: 云彩
  rationale: 结合句法及希腊文见证，将云彩理解为风所承载之物；汉语采用自然的“云彩”。
- source_word: ፍናወ
  choice: 路径
  rationale: 该词指道路、路线或行程；“路径”保留天使在宇宙空间中运行的具体意象。
- source_word: መላእክት
  choice: 天使
  rationale: 在《以诺一书》的异象语境中指天上的使者，“天使”最为清楚自然。
- source_word: ውስተ ጽንፈ ምድር
  choice: 在地极
  rationale: 指大地最远的边界；“地极”简洁、庄重，并保留古代宇宙图景。
- source_word: ጽንዐ
  choice: 坚固支撑
  rationale: 该名词可表示坚固、稳定或承托力量；此译法保留支撑天空的形象，又不把它过早限定为建筑意义上的根基。
- source_word: ዘሰማይ መልዕልተ
  choice: 上方天空的
  rationale: 明确表达垂直的宇宙方位；“天空”在此比可能被理解为神祇称谓的“上天”更清楚。
theological_decisions:
- issue: ነፋሳተ应译为“风”还是“灵”
  choice: 风
  alternative: 灵
  rationale: 本节列举宇宙中的可见现象和结构；译作“风”符合风承载云彩的上下文，也避免无根据地引入灵界或邪灵含义。
- issue: ጽንዐ是否应具体译为建筑性的“根基”
  choice: 坚固支撑
  alternative: 根基
  rationale: 原词既可指稳固性，也可指支撑力量；正文保留较宽的意义，脚注列出“根基”这一可能译法。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。三次“我看见”之间不用“又”或“并且”，以保留埃塞俄比亚文无连词反复所形成的异象式顿挫。宇宙结构用语尽量具体，但不把古代图景现代化或体系化。
