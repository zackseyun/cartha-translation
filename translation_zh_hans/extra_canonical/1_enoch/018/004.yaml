base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/004.yaml
  text: And I saw the winds that turn the sky and cause the disk of the sun and all the stars to set[a][b].
translation:
  language: zh_hans
  text: 我看见那些使天空转动、使日轮和众星落下的风[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译法将这里理解为“使日轮和众星临近”；但吉兹语动词 ያዐርቡ 更可能意为使太阳和星辰下沉或落下。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我看见
  rationale: 保留第一人称异象叙事的常用公式；汉语无需机械补出句首连接词，也能自然承接上下文。
- source_word: ነፋሳተ
  choice: 风
  rationale: 本节描写影响天空与天体运行的宇宙力量，具体义“风”最合适；译作“灵”会在原句没有明确依据时引入人格化理解。
- source_word: እለ ይመይጥዋ ለሰማይ
  choice: 那些使天空转动
  rationale: 该动词含移动、转动之意；“使天空转动”既保留宇宙运动的图景，也避免加入过于技术化的天文学表述。
- source_word: ወእለ ያዐርቡ
  choice: 使……落下
  rationale: ያዐርቡ 是 ዐረበ（用于日月星辰下沉、落下）的使役式，宜理解为“使之落下”，而非与“临近”词根混淆。
- source_word: ለክበበ ፀሐይ
  choice: 日轮
  rationale: ክበበ 可指圆形物或环绕之物；“日轮”自然、凝练地保留太阳圆盘的古代宇宙图景，而不强加现代天文学含义。
- source_word: ወኵሎ ከዋክብተ
  choice: 和众星
  rationale: 原文为集合性表达，“众星”准确而符合庄重的现代汉语文体。
theological_decisions:
- issue: ነፋሳተ 应理解为非人格化的宇宙之风，还是人格化的灵或天使性存在
  choice: 宇宙之风
  alternative: 灵；风灵
  rationale: 在以诺的宇宙巡游语境中，本句直接描写支配天空、太阳和众星运行的力量。译作“风”保留启示文学的宇宙图景，也不把原文未明说的人格性强加进去。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“日轮”保留古代宇宙图景；句法简洁，避免把“风”人格化，也不以现代天文学解释异象。
