base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/008.yaml
  text: And the middle one reached to heaven[a], like the throne of the Lord, which was of crystal stone[d][c][b], and the top of the throne was of sapphire stone.
translation:
  language: zh_hans
  text: 中间的那一座向上直达天上[a]，仿佛主的宝座；那宝座由水晶石[b]制成，宝座的顶部[c]则由蓝宝石制成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其中央向上延伸到天上。”原文可以指居中的那一座，也可以指该结构的中央部分。
    reason: alternative_reading
  - marker: b
    text: “水晶石”所对应的原文石料名称含义不十分确定，可能泛指一种明亮、晶莹或贵重的石料。
    reason: lexical_alternative
  - marker: c
    text: “宝座的顶部”原文较难确定，也可能较宽泛地指宝座或与宝座相连之结构的上部或顶端。
    reason: alternative_reading
lexical_decisions:
- source_word: ማእከላይሰ
  choice: 中间的那一座
  rationale: 该形式指居中者或中央部分。结合本段异象中诸结构的语境，用“那一座”自然承接，但不进一步断定其具体所指；脚注保留“其中央”的可能。
- source_word: ይጐድእ እስከ ሰማይ
  choice: 向上直达天上
  rationale: 动词表达向上延伸，እስከ 标示所达到的界限；“向上直达天上”兼顾方向和高度范围。
- source_word: ከመ መንበረ ለእግዚአብሔር
  choice: 仿佛主的宝座
  rationale: ከመ 表示比拟而非同一；“仿佛”保留异象中的比较关系。
- source_word: እምእብነ ፑክ
  choice: 由水晶石制成
  rationale: ፑክ 所指石料不确定，传统上常理解为明亮或晶莹的宝石材料；正文采用简明的“水晶石”，脚注注明不确定性。
- source_word: ይማሑ ለመንበሩ
  choice: 宝座的顶部
  rationale: 此难解短语大概指宝座或相关结构的上部、顶端；正文采用最连贯的空间表达，同时以脚注保留较宽泛的理解。
- source_word: እምእብነ ሰንፔር
  choice: 由蓝宝石制成
  rationale: ሰንፔር 通常对应蓝宝石；中文不重复“石”字，以免形成不自然的“蓝宝石石”，而材料含义仍清楚。
theological_decisions:
- issue: እግዚአብሔር 的译法
  choice: 主
  alternative: 上帝；主上帝
  rationale: 此处是敬称，译作“主”既简洁庄重，也不添加原文没有的称谓成分。
- issue: 异象中的结构与主之宝座的关系
  choice: 仿佛主的宝座
  alternative: 就是主的宝座
  rationale: 原文以 ከመ 引出比较，因此保留相似关系，不把所见结构直接等同于主的宝座。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“向上直达天上”保留异象的垂直动势；分号区分比拟与材料描写。所有不确定处均通过脚注明示，未引入“根基”等原文没有的建筑细节。
