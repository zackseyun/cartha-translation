base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/001.yaml
  text: And I saw the storehouses of all the winds[b][a], and I saw how with them he adorned all creation and the foundations of the earth.
translation:
  language: zh_hans
  text: 我看见了众风的库房[a]，也看见了他怎样用这些风装点[b]一切受造之物和大地的根基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宝库”。这里描绘的是存放众风的天上处所。
    reason: lexical_alternative
  - marker: b
    text: 这个动词也可能有“安排”或“奠定”的意思，不仅指“装点”。
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: 库房
  rationale: 该词可指宝库或储藏处；在此宇宙异象中，“库房”保留风被收存于天上处所的具体图景，又避免“宝库”可能带来的财物联想。
- source_word: ኵሉ ነፋሳት
  choice: 众风
  rationale: ነፋሳት也可指灵或气息，但上下文描写宇宙结构和天象，因此以“风”最为贴切；“众风”兼顾整体范围与庄重语体。
- source_word: ከመ
  choice: 怎样
  rationale: 此词引出以诺所见的内容或方式；“怎样”自然表达他看见这些风如何参与宇宙的构成。
- source_word: ቦሙ
  choice: 用这些风
  rationale: 该形式回指众风，具有工具或伴随意味；“用这些风”清楚表达其作为施行方式，同时不排除“借着这些风”的理解。
- source_word: አሰርገወ
  choice: 装点
  rationale: 该动词主要具有装饰、使之美丽的意味；“装点”保留鲜明的宇宙图景，同时通过脚注说明其也可能包含安排或奠定之意。
- source_word: ኵሎ ፍጥረተ
  choice: 一切受造之物
  rationale: 此处范围遍及宇宙；“一切受造之物”既体现集合性的整体范围，也明确保留“受造”的语义。
- source_word: መሰረታቲሃ ለምድር
  choice: 大地的根基
  rationale: 保留原文具体的建筑性宇宙图像；“大地的根基”是现代汉语中自然而庄重的表达。
theological_decisions:
- issue: ነፋሳት应译为“风”还是“灵”
  choice: 风
  alternative: 灵；气息
  rationale: 本节处于关于世界结构的宇宙性异象中，“风的库房”最符合就近语境，也避免无依据地加入天使论含义。
- issue: አሰርገወ表示装饰还是建立、安排
  choice: 装点
  alternative: 安排；奠定；使之美丽
  rationale: 吉兹语见证支持装饰或使之美丽的鲜明含义；但因其宾语包括大地的根基，动词也可能兼有秩序安排或奠立之意，故在脚注中保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“众风的库房”保留启示文学的具体宇宙图景；“装点”保留原文的生动性，并以脚注呈现动词可能兼有的构建与秩序含义。
