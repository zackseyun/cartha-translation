base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/003.yaml
  text: And I saw how the winds support the heights of heaven[a], and they stand between heaven and earth; these are the pillars of heaven.
translation:
  language: zh_hans
  text: 我看见诸风怎样托住天的高处[a]；它们立在天地之间，这些就是天柱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处的吉兹语动词含义不易确定，也可理解为“伸展”“铺展”或类似的动作。
    reason: 保留关键动词的词义不确定性，避免把宇宙图景解释得过于固定。
lexical_decisions:
- source_word: ነፋሳት
  choice: 诸风
  rationale: 在这段宇宙异象中，该复数词最自然地指作为宇宙力量的风；译作“诸风”保留庄严语体，也不额外引入灵体或天使的含义。
- source_word: ይረብብዋ
  choice: 托住
  rationale: 该动词词义较难确定，可涉及伸展、铺展或支撑之类的动作；结合末句“天柱”的结构意象，正文采用自然而不过度具体的“托住”，并以脚注保留歧义。
- source_word: አዕልና ሰማይ
  choice: 天的高处
  rationale: 此处与末句明确表示“柱子”的አዕማደ有别，故不将两者都译作“天柱”；“天的高处”保留原文在本句中的区分。
- source_word: ይቀውሙ
  choice: 立
  rationale: 直译其站立、矗立的视觉形象，适合描述位于天地之间的宇宙支撑物。
- source_word: ማእከለ ሰማይ ወምድር
  choice: 在天地之间
  rationale: 以现代汉语自然表达其空间关系，同时保留古代宇宙图景。
- source_word: እሙንቱ ውእቶሙ
  choice: 这些就是
  rationale: 体现原文带强调意味的指认和解释功能。
- source_word: አዕማደ ሰማይ
  choice: 天柱
  rationale: 准确呈现支撑天穹的柱状宇宙结构；“天柱”简洁、庄重且为现代读者易懂。
theological_decisions:
- issue: 将ነፋሳት理解为“风”还是“灵”
  choice: 诸风
  alternative: 诸灵；风／灵
  rationale: 上下文描述受造世界的宇宙结构，“风”与其中的物理图景更协调；如此处理也避免加入原文并未明确要求的天使论解释。
- issue: “它们”的具体所指
  choice: 保留代词，不在正文中明确改写其先行词
  alternative: 明确译作“那些支撑物”或“诸风”
  rationale: 原文由前句转入末句的指认关系可能带有一定含混；保留“它们”可避免替原文消除这种张力，同时末句仍提供“天柱”的解释。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“诸风”“天地”“天柱”保持异象文学的凝练感；分号对应原文由所见景象转向解释性指认的结构。
