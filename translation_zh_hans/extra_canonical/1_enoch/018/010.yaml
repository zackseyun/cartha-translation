  text: And there I saw a place beyond the great earth[b][a]; there they gather together.
translation:
  language: zh_hans
  text: 我在那里看见那广大的大地之外有一处地方[a][b]；他们在那里聚集。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “之外”也可译作“另一边”或“彼岸”。
    reason: previous_rendering
  - marker: b
    text: 吉兹语此处的文本和词义有疑难；另有理解为“广大大地尽头的一处地方”。
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我看见
  rationale: 保留异象叙事中常见的所见报告句式，现代汉语自然明确。
- source_word: ህየ
  choice: 在那里
  rationale: 原文在本节两次使用这一方位副词；重复译出，以保留异象行程的空间感。
- source_word: መካነ
  choice: 一处地方
  rationale: 此处名词没有明确的定指标记，宜理解为异象中首次引入的一处新地点。
- source_word: ማዕዶተ
  choice: 之外
  rationale: 该词较可能表示“另一边、越过、在……之外”，与希腊语 πέραν 的语义相合；不过抄本读法有疑难，故以脚注保留“尽头”一解。
- source_word: ዐቢይ ምድር
  choice: 广大大地
  rationale: 保留“大”这一修饰语及异象宇宙地理中的“大地”意象，不将其缩小为普通地区。
- source_word: ይትጋብኡ
  choice: 他们聚集
  rationale: 反身或中动态意义较为可能；汉语“聚集”自然表达共同会合，同时不擅自补明原文省略的主语所指。
theological_decisions:
- issue: 有关大地边界的宇宙地理意象
  choice: 广大大地之外
  alternative: 广大大地尽头的一处地方
  rationale: “之外”更符合 ማዕዶተ 可能表示“另一边、越过”的词义，也保留具体的启示文学空间图景；脚注注明传统的“尽头”理解，以免消除文本疑难。
- issue: 末句省略主语的所指
  choice: 他们在那里聚集
  alternative: 在那里聚集起来
  rationale: 原文没有在本节明确重述主语，因此不按上下文推定并补入“诸天”“群星”或其他实体，以保留指代上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留原文两次“在那里”的空间指示，并保留末句主语未明的特点；不把启示文学中的宇宙地理改写为抽象概念。
