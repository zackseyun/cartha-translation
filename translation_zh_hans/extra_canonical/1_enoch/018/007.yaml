base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/007.yaml
  text: And those toward the east were of colored stone, and one was of pearl stone, and one of healing stone; and those toward the south were of red stone.
translation:
  language: zh_hans
  text: 朝东的那些是彩色石头，其中一块是珍珠石，另一块是药石；朝南的那些是红色石头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽባሕ
  choice: 东
  rationale: 在方位语境中指东方；以“朝东”自然表达其所指方向。
- source_word: እብነ ሕብር
  choice: 彩色石头
  rationale: ሕብር可指颜色或综合色彩；原文未说明具体色泽，保留概括性。
- source_word: እብነ ባሕርይ
  choice: 珍珠石
  rationale: 依该词在此版本及古代宝石名传统中的理解译为“珍珠石”；保留“石”以对应反复出现的እብነ。
- source_word: እብነ ፈውስ
  choice: 药石
  rationale: ፈውስ意为医治、疗愈或药物；“药石”既简洁又保留该石具有医治功用或名称源于医治的含混性。
- source_word: አዜብ
  choice: 南
  rationale: 方位名，译作“南”。
- source_word: እብነ ቀይሕ
  choice: 红色石头
  rationale: ቀይሕ表示红色，直译以保持与前文各类石头的平行结构。
