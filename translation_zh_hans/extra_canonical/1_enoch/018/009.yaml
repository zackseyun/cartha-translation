translation:
  language: zh_hans
  text: 我看见一团燃烧着的火，位于众山之内[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文本的后半句较难理解，也可能反映了压缩或讹误的传本。这里按较可能的句法，将它理解为继续说明这团火位于众山之内。
    reason: textual_variant
  - marker: b
    text: 或译：“我看见一团燃烧着的火，以及在众山之内的东西。”
    reason: alternative_syntax
lexical_decisions:
- source_word: እሳተ
  choice: 火
  rationale: 不定单数名词；汉语无须加量词，保留异象中简明而未限定其来源或作用的“火”。
- source_word: ዘይነድድ
  choice: 燃烧
  rationale: 关系动词形式描述火正在燃烧；用“燃烧”自然表达持续状态，不额外强化为“熊熊燃烧”。
- source_word: ርኢኩ
  choice: 我看见
  rationale: 第一人称异象见证公式；“我看见”平实、庄重，也能保留反复出现的叙述风格。
- source_word: ወዘሀሎ
  choice: 在
  rationale: 按较有力的语法分析，将其理解为第二个修饰“火”的关系成分，表示火所处的位置；但该读法及传本文本仍有困难，故以脚注保留另一种可能。
- source_word: ውስተ ኵሉ አድባር
  choice: 众山之中
  rationale: ውስተ 表示内部或其中的位置，ኵሉ 与复数名词形成整体意义；“众山之中”保留宇宙异象中的山内/山中意象，同时符合现代庄重汉语。
theological_decisions:
- issue: 山中之火的异象性质
  choice: 保留为火在众山之中的具体末世异象，不作寓意化解释。
  alternative: 将其概括为上帝审判，或自然主义地解释为火山、地下之火。
  rationale: 上下文呈现的是异象地貌；译文应传达先见者所见的景象，而不替读者判定其象征意义或自然成因。
- issue: 火与后半分句的句法关系
  choice: 将后半分句理解为说明同一团火位于众山之中。
  alternative: 将其理解为另一个并列宾语：“以及众山之内的东西”。
  rationale: ወዘሀሎ 较可能是与前一关系成分平行、继续修饰“火”的关系分句；但埃塞俄比亚文本表达艰涩，故不把另一种分析从注释中删除。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。“众山之中”既易懂，又比“所有山里面”更符合异象文学的文体；不增添“审判”“地狱”或“火山”等解释性词语。
