base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/002.yaml
  text: And I saw the cornerstones of the earth[c][b][a], and I saw the four winds that bear up the earth and the firmament of heaven.
translation:
  language: zh_hans
  text: 我看见了大地的角石[a]，又看见托住大地和天穹[c]的四方之风[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大地角落的石头”。原文措辞具有建筑意味，在异象中可能指大地根基性的边极。
    reason: lexical_alternative
  - marker: b
    text: 译作“风”的词在某些语境中也可有“灵”或“气息”的含义；这里因宇宙景象和“四方”的观念，译作“风”较合适。
    reason: lexical_alternative
  - marker: c
    text: “天穹”保留了古代宇宙图景中结构稳固、如穹顶般的天空意象。
    reason: cultural_note
lexical_decisions:
- source_word: እብነ ማእዘንተ ምድር
  choice: 大地的房角石
  rationale: 原文由“石头”和“角、房角”构成，带有建筑性意象；译作“房角石”既自然，也保留异象中大地根基或边极的具体图景。
- source_word: ምድር
  choice: 大地
  rationale: 本节是宇宙性异象，指整个地界而非某一片土地；“大地”符合现代汉语的庄重叙述。
- source_word: አርባዕተ ነፋሳተ
  choice: 四方之风
  rationale: ነፋሳተ 可指风、气息或灵，但“四”与宇宙方位的语境更支持“风”；“四方之风”以自然汉语表达四风，同时不增添原文没有的“天上的”。
- source_word: ይጸውርዋ
  choice: 托住
  rationale: 该动词表示承载、支撑；“托住”保留宇宙结构被承托的鲜明动态意象。
- source_word: ወጽንዐ ሰማይ
  choice: 天穹
  rationale: 该短语指天空的稳固结构或穹苍；“天穹”比单译“天”更能保留古代宇宙图景，在现代中文中也较易理解。
theological_decisions:
- issue: 古代宇宙结构的异象语言
  choice: 保留“大地的房角石”“托住”“天穹”等具体意象
  alternative: 弱化为“大地的尽头”或“治理世界的力量”等抽象表达
  rationale: 原文呈现建筑式、结构性的宇宙异象。翻译不应把它现代化或去神话化，也不应断言这是现代物理描述，而应让文本本身的异象张力保持可见。
- issue: ነፋሳተ 在“风”与“灵”之间的语义范围
  choice: 正文译作“四方之风”
  alternative: 译作“四个灵”或“四股气息”
  rationale: 四数与宇宙承托的语境倾向于方位之风，但以脚注保留该词在其他语境中可能涉及“灵”或“气息”的语义重叠。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“房角石”保留建筑性宇宙意象；“四方之风”较“四风”更自然，也显出方位观念；“天穹”避免过度古雅的“穹苍”，同时不把原文扁平化为普通的“天空”。
