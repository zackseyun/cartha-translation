revisions:
- from: 那时，与我同在的圣天使之一乌列回答我，对我说：“这受咒诅的山谷，是为那些永远受咒诅的人预备的。凡用口说不当的话攻击主，又论到他的荣耀而说出骇人的话[a]的人，都要聚集在这里。他们要被召集到这里[b]；这里将是审判他们的地方。”
  to: 那时，与我同在的圣天使之一乌列回答我说：“这受咒诅的山谷，是给那些永远受咒诅的人[a]的。凡用口说不当的话攻击主，又论到他的荣耀而说出狂妄的话[b]的人，都要聚集在这里。他们要被召集到这里；这里将是他们受审判的地方。”
  rationale: 删除“预备的”，使首句不添加原文未明示的动作；将重复的“回答我，对我说”调整为自然的“回答我说”；以“狂妄的话”更好地表达关于主荣耀所说之不敬、僭越言语，并通过脚注保留原词的严酷、惊异等可能语义。末句改为“他们受审判的地方”，忠实表达地点与审判的关系，不额外强化施事。原草稿的使役说明脚注保留，但其锚点应移至“被召集”处，故标为[c]。
