base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/002.yaml
  text: At that time Uriel[a], one of the holy angels who was with me, answered me and said to me, “This accursed valley is for those who are accursed forever. Here all those will be gathered who speak with their mouths improper words against the Lord, and who utter harsh things concerning his glory. Here they will be gathered[b], and here will be their place of judgment.”
translation:
  language: zh_hans
  text: 那时，与我同在的圣天使之一乌列回答我说：“这受咒诅的山谷，是给那些永远受咒诅的人[a]的。凡用口说不当的话攻击主，又论到他的荣耀而说出狂妄的话[b]的人，都要聚集在这里。他们要被召集到这里；这里将是他们受审判的地方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“给那些受咒诅直到永远的人”。
    reason: lexical_alternative
  - marker: b
    text: “狂妄的话”也可译作“严厉的话”“惊人的话”或“令人震骇的话”；原词强调这些话严酷、惊人或悖逆的性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: 回答我
  rationale: 保留该动词回应、作答的常用义，并符合以诺与引导他的天使之间的对话情境。
- source_word: ቅዱሳን መላእክት
  choice: 圣天使
  rationale: 这是启示文学中自然且庄重的称谓，既贴近原文，也符合现代汉语表达。
- source_word: ዛቈላ
  choice: 山谷
  rationale: 该地形词可指谷地、沟谷；上下文没有必要进一步限定为峡谷，故采用涵盖面较宽的“山谷”。
- source_word: ርጉምት / ለርጉማን
  choice: 受咒诅的／受咒诅的人
  rationale: 保留地点和其中之人同受咒诅的词语呼应，以及本段庄严的审判语气。
- source_word: እስከ ለዓለም
  choice: 永远
  rationale: 清楚表达咒诅延续至永恒的时间范围。
- source_word: ይትጋብኡ
  choice: 要聚集
  rationale: 中间或被动语态在汉语中可自然表达为“聚集”，保留被聚拢接受审判的含义而不强定施事者。
- source_word: በአፉሆሙ
  choice: 用口
  rationale: 保留原文具体提到口作为说话工具的身体意象。
- source_word: ላዕለ እግዚአብሔር
  choice: 攻击主
  rationale: 在敌对言语的语境中，该介词短语带有反对、针对之意；“攻击主”比仅说“论到主”更能传达敌意。
- source_word: ቃለ ዘኢይደሉ
  choice: 不当的话
  rationale: 原短语指不合宜、不正当的言语；此译不把罪行过度限定为某个后来的专门术语。
- source_word: ስብሐቲ ዚአሁ
  choice: 他的荣耀
  rationale: 在此处最自然地指主的荣耀或威荣；“荣耀”透明地保留常见的圣经语域。
- source_word: ይትናገሩ ዕፁብተ
  choice: 说出骇人的话
  rationale: ዕፁብተ 可带惊人、骇异、严重或狂妄的语气；“骇人的话”保留强烈程度，同时不武断限定为“亵渎”。
- source_word: ያስተጋብእዎሙ
  choice: 他们要被召集到这里
  rationale: 该形式带使役色彩，即有人把他们召集起来；汉语被动式保留这一点，同时不补出原文未明说的召集者。
- source_word: ዝየ ምኵናኒሆሙ
  choice: 这里将是审判他们的地方
  rationale: 重复的“这里”突出审判的地点性；此译同时保留异象地理和司法结局。
theological_decisions:
- issue: 受审者言语罪行的性质
  choice: 译为对主说不当、敌对的话，并论到他的荣耀说出骇人的话，不限定为专门意义上的“亵渎罪”。
  alternative: 直接译作“亵渎主及其荣耀”。
  rationale: 原文描述言语不合宜、敌对且骇人，但没有使用必须对应后世技术性罪名的措辞；宽一些的表达能保留原文张力。
- issue: 末句中山谷与审判的关系
  choice: 山谷是受咒诅者被召集并受审判的地点。
  alternative: 山谷本身就是他们的定罪，或末句只抽象地指审判。
  rationale: 原文反复使用“这里”，明确突出地点；因此同时保留场所与审判行动。
- issue: 召集者的身份
  choice: 采用不明说施事者的被动表达。
  alternative: 补作“天使要召集他们”或“上帝要召集他们”。
  rationale: 使役形式表明他们被人召集，但本节没有明示施事者，不宜以神学推断补足。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“圣天使”“受咒诅”“荣耀”“审判”等启示文学和司法语汇；避免古奥句式，也不将言语罪行收窄为后世特定教义术语。
