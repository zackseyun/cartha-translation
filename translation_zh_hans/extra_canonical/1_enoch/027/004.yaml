base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/004.yaml
  text: In the days of their judgment they will bless him for the mercy[b][a], according as he has apportioned to them.
translation:
  language: zh_hans
  text: 在他们受审判的日子，他们要因着怜悯称颂他，照着他分给他们的份额。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句没有明说“他分给他们”的是什么；译文的“份额”仅为使汉语通顺。它可指所量给他们的一份怜悯、福分，或其他所分配的份。
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕለ
  choice: 日子
  rationale: 保留复数时间名词及其启示文学中的时间标记，不泛化为“时候”。
- source_word: ኵነኔሆሙ
  choice: 他们受审判
  rationale: 该词指司法性的裁决或审判；这一译法不把含义收窄为定罪或惩罚，并能容纳本节正面的结果。
- source_word: ይባርክዎ
  choice: 他们要称颂他
  rationale: 按形态应分析为第三人称复数主语加第三人称阳性单数宾语，即“他们……他”；在以人为主语、上帝为宾语时，“称颂”比“祝福”更符合现代汉语习惯。
- source_word: በምሕረት
  choice: 因……怜悯
  rationale: 结合“他们称颂他”的句法，介词短语自然表示称颂的缘由；保留“怜悯”这一名词及其神学分量。
- source_word: በከመ
  choice: 照
  rationale: 表达尺度或方式关系，简洁而自然地对应“按照／正如”。
- source_word: ከፈሎሙ
  choice: 所分给他们的
  rationale: 该动词有分配、划分或指定份额之意；中文将隐含宾语依上下文与“怜悯”衔接，但脚注说明原文并未明说所分之物。
theological_decisions:
- issue: 本节所说的是惩罚性定罪，还是可包含向义人施怜悯的司法时刻
  choice: 译作“受审判”，让后文的怜悯说明这群人在审判中所得的正面结果。
  alternative: 译作“被定罪”或“受惩罚”。
  rationale: 原词本身范围较广；收窄为惩罚会超出文本，并与紧接着的称颂和怜悯形成不必要的冲突。
- issue: 称颂者与受称颂者的身份
  choice: 按吉兹语形态译作“他们要……他”。
  alternative: “他要以怜悯赐福他们”。
  rationale: ይባርክዎ 的主语为第三人称复数，宾语后缀为第三人称阳性单数；因此不应倒置为“他赐福他们”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“称颂他”准确表达以人为主语、以上帝为宾语的“祝福”；句式尽量紧凑，同时以脚注保留末句宾语省略所造成的歧义。
