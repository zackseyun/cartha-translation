base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/003.yaml
  text: In the latter days this will become for them a spectacle of righteous judgment in the presence of the righteous forever[a]; all the days here the wise will bless the Lord of glory[d][c][b], the eternal King.
translation:
  language: zh_hans
  text: 在末后的日子，这将成为他们的公义审判之景象[b]，在义人面前直到永远[a]；在这里的一切日子里，智慧人[c]都要称颂荣耀之主——永恒的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到永远”中的“永远”在这一文本见证中有疑问，原文以方括号标出；它可能修饰“在义人面前”，也可能反映异文。
    reason: textual_variant
  - marker: b
    text: “景象”也可译作“标记”“显象”或“范例”；这里着重于审判公开显明、可被看见的一面。
    reason: lexical_alternative
  - marker: c
    text: “智慧人”所据词形的解释有分歧；也有人按另一词根分析为“蒙怜悯的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በዳኃሪ መዋዕል
  choice: 在末后的日子
  rationale: 保留该短语面向终末或未来的启示文学语气，而不弱化为一般的“后来”。
- source_word: አርአያ
  choice: 景象
  rationale: 该词可指所见之物、显象、标记或范例；“景象”在此保留审判公开可见的一面，又不把它限定为单纯的警戒性“榜样”。
- source_word: ኵነኔ ዘበ ጽድቅ
  choice: 公义审判
  rationale: 简洁保留审判与公义之间的修饰关系，不另行解释审判的对象或方式。
- source_word: በቅድመ ጻድቃን
  choice: 在义人面前
  rationale: 直译其空间性和公开性，也符合审判场景。
- source_word: ለዓለም
  choice: 存到永远
  rationale: 按上下文将其与义人面前的审判景象相连；因原见证将此词括起，另以脚注说明文本及句法归属的不确定性。
- source_word: ኵሎ መዋዕለ ዝየ
  choice: 在这里的每一天
  rationale: 将ዝየ按空间副词“这里”处理，不误解为“这个时代”；汉语以“每一天”自然表达“所有日子”。
- source_word: ምሑራን
  choice: 智慧人
  rationale: 依本项目最新复核采用启示文学—智慧传统中的“智慧人”；由于词形也曾被按“蒙怜悯者”分析，以脚注保留这一词汇分歧。
- source_word: ለእግዚአ ስብሐት
  choice: 荣耀之主
  rationale: 直接保留“主”与“荣耀”构成的尊称，不与其他经文称号过度协调。
- source_word: ንጉሥ ዘለዓለም
  choice: 永恒的王
  rationale: 自然表达王权与永恒属性，并与前一神圣称号保持同位关系。
theological_decisions:
- issue: 两个神圣称号的关系
  choice: 荣耀之主——永恒的王
  alternative: 荣耀的主，直到永远的王
  rationale: 将两者作为同位称号呈现，既保留原文的崇高语体，也不借用后期固定公式来改写本节。
- issue: “永远”的句法归属
  choice: 与“在义人面前”的审判景象相连
  alternative: 与后半句称颂的持续时间相连，或视为异文成分
  rationale: 此连接最顺应现有词序和见证，但括号显示文本不稳，因此不将该解释说成确定无疑。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“末后的日子”“公义审判”“荣耀之主”“永恒的王”保留启示文学的崇高语域；“在这里的每一天”则忠实保留原文的空间指向。所有脚注标记均已置于正文相应位置。
