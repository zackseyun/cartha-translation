base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/001.yaml
  text: At that time I said[a], “For what reason is this blessed land, all of it full of trees[b], and this accursed valley in their midst?”
translation:
  language: zh_hans
  text: 那时我说：“为什么这片土地蒙福，遍地长满树木[a]，而这受咒诅的山谷却在它们中间呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处表示树木或繁茂草木的词组在现有文本见证中较难确定；大意是整片土地遍布树木或植物。
    reason: textual_variant
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: 那时
  rationale: 这是异象叙事中常见的时间衔接语；“那时”简洁自然，也保留庄重的叙事语气。
- source_word: እቤ
  choice: 我说
  rationale: 原词是引出言语的表达；虽然后文构成疑问，译作“我说”比“我问”更贴近原文。
- source_word: በእንተ፡ ምንት
  choice: 为什么
  rationale: 该短语询问原因或目的；现代汉语用“为什么”清楚自然。
- source_word: ዛቲ፡ ምድር፡ ቡርክት
  choice: 这片土地为什么蒙福
  rationale: ምድር在此指异象中的一片地域；ቡርክት译作“蒙福”，与后面的“受咒诅”形成明确的神圣—审判对照。
- source_word: ወኵለንታሃ፡ ምልእት
  choice: 而且遍地长满
  rationale: 保留前置连词所体现的并列结构，并用“遍地长满”自然表达整个地域充满植物的景象。
- source_word: ዕፀወ፡ ወዛ፡ ቈላ
  choice: 树木
  rationale: 该词组似乎泛指树木或繁盛的草木，但现有文本见证较难确定；正文采用较稳妥的核心意象“树木”，并以脚注说明。
- source_word: ርጉምት
  choice: 受咒诅的
  rationale: 保留原文带有审判意味的强烈价值判断，并与“蒙福”构成对应。
- source_word: ማእከሎሙ
  choice: 在它们中间
  rationale: 原文使用复数代词后缀，最直接的先行对象是前述树木；“在它们中间”保留这一语法指向，不将空间关系改写得过于确定。
theological_decisions:
- issue: 蒙福之地与受咒诅山谷之间的对照
  choice: 译作“蒙福”与“受咒诅”
  alternative: 肥沃与荒芜；蒙眷顾与被诅咒
  rationale: 原文呈现的是具有道德和神圣意味的末世审判对照，而不只是土地肥沃程度的差别；这组译法保留其神学张力。
- issue: 山谷与周围景观的空间关系
  choice: 保留“在它们中间”的复数指代
  alternative: 在其中；在这片土地中间
  rationale: 原文后缀为复数，可能回指树木；不改成单数的“土地”，可避免替原文消除真实的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“而且……而……却……”既呈现原文的并列推进，也使蒙福之地与受咒诅山谷的反差在汉语中清楚可感。
