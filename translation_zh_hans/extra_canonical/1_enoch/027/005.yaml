base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/005.yaml
  text: At that time I blessed the Lord of glory[b][a], and I spoke and sang praise as is fitting for his majesty.
translation:
  language: zh_hans
  text: 那时，我称颂荣耀之主，谈论[a]并歌颂他，正如与他的威严相称。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谈论”所译短语在现存转写中词形和句法不甚确定；也可理解为“向他说话”。另有校勘认为原文可能是“述说他的荣耀”。
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: 那时
  rationale: 这是常见的时间表达，简洁自然，也保留叙事推进的语气。
- source_word: ባረክዎ
  choice: 我称颂
  rationale: 该动词本义为“祝福”；用于人向上帝发出的颂赞时，现代汉语以“称颂”最自然，并避免“祝福主”可能造成的误解。
- source_word: ለእግዚአ፡ ስብሐት
  choice: 荣耀之主
  rationale: 保留“主”这一神圣称号，并将 ስብሐት 的荣耀、光辉之义凝练表达出来。
- source_word: ተሎቱ፡ ነገርኩ
  choice: 述说他
  rationale: 现有转写在此处词形和句法不够确定；“述说他”保留“说及他”的基本方向，又不过度增补“他的荣耀”等宾语。
- source_word: ዘመርኩ
  choice: 歌颂他
  rationale: 该动词指歌唱、吟唱；在敬拜语境中译为“歌颂”自然，并与前面的“述说”形成并列。
- source_word: በከመ፡ ይደሉ፡ ለዕበዩ
  choice: 正如他的威严所配得的
  rationale: 该短语表达与其伟大、尊荣相称之意；“所配得的”保留合宜性，“威严”适合颂赞语境。
theological_decisions:
- issue: 神圣称号 እግዚአ 的译法
  choice: 主
  alternative: 主人
  rationale: 在对上帝的颂赞中，“主”是现代汉语最自然、庄重且通行的称号；“主人”会带入较强的社会关系色彩。
- issue: 疑难短语 ተሎቱ፡ ነገርኩ 的理解
  choice: 述说他
  alternative: 向他说话；宣扬他的荣耀
  rationale: 所给吉兹文见证的词形存在疑难，且后期校订意见彼此不一；正文采用较少释义的表达，并以脚注保存其他可能，不把不确定的宾语直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“称颂—述说—歌颂”保留原句的礼拜性节奏；对疑难读法不在正文中武断定夺，而以脚注交代。
