base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/005.yaml
  text: And all the cattle feared them and were terrified by them[b][a], and they began to bite with their teeth and to devour and to gore with their horns.
translation:
  language: zh_hans
  text: 所有的牛都惧怕它们，在它们面前惊恐万分[a]；那些兽便开始用牙齿撕咬、吞吃，又用角顶撞[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“都因它们而惊恐万分”。原文较直译为“从它们面前／在它们面前”。
    reason: translation_alternative
  - marker: b
    text: 原文在此只以动词的复数形式标示主语，并未再次明说名词。依上下文，“那些兽”指前一节所述、使牛惧怕的新生之兽。
    reason: referent_ambiguity
lexical_decisions:
- source_word: ኵሎሙ፡ አልህምት
  choice: 所有的牛
  rationale: 量词涵盖整个群体；አልህምት在此指牛类。译作“牛”既保留异象中的动物形象，也不擅自指明性别或象征所指。
- source_word: ፈርህዎሙ፡ ወደንገፁ
  choice: 惧怕它们……惊恐万分
  rationale: 原文连用两个表示恐惧的动词，后者语气更强；译文保留由惧怕到惊恐的递进。
- source_word: እምኔሆሙ
  choice: 在它们面前
  rationale: 原词具有“从它们面前／在它们面前”的空间与临在色彩；此译尽量贴近形式，同时脚注注明自然汉语中的因果性译法。
- source_word: አሐዙ
  choice: 便开始
  rationale: 该动词在这里构成起始表达，表示后续攻击动作开始发生。
- source_word: ይኔክሱ፡ በስኒሆሙ
  choice: 用牙齿撕咬
  rationale: 保留原文明确写出的工具“牙齿”；“撕咬”自然且呈现动物攻击的强烈画面。
- source_word: ይውሕጡ
  choice: 吞吃
  rationale: 兼顾“吞下”和“吃尽”的语义，比泛泛的“消灭”更能保持动物意象。
- source_word: ይወግኡ፡ በአቅርንቲሆሙ
  choice: 用角顶撞
  rationale: 后接“用它们的角”，因此将一般性的击打具体译为牛角等所作的顶撞，保留原文具体意象。
theological_decisions:
- issue: 是否把异象中的动物直接解释为其象征的人类群体
  choice: 正文保留“牛、牙齿、角”等动物意象
  alternative: 直接译出这些动物所象征的人物或群体
  rationale: 本段以持续的动物象征来叙事，而经文本身没有在本节明说象征所指；解释性替换会消除原有的启示文学张力。
- issue: “它们便开始”所指的是牛，还是前文使牛害怕的那些兽
  choice: 保留代词“它们”，并以脚注说明上下文较可能的所指
  alternative: 在正文明确译为“那些兽便开始”或“牛便开始”
  rationale: 吉兹语动词只标示第三人称复数，并未在本句重新明说名词主语。上下文倾向前文新生的那些兽发动攻击，但正文不宜把语法上隐含的所指变成明说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文恐惧动词的递进和牙齿、角等具体动物形象；不在正文中解释动物的象征对象。
