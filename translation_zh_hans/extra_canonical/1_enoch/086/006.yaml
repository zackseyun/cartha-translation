base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/006.yaml
  text: And they began again to devour those cattle[a], and behold[c][b], all the children of the earth began [to tremble and flee].
translation:
  language: zh_hans
  text: 于是，它们又开始吞吃那些牛[a]。看哪，地上所有的儿女[b]都开始〔战栗逃跑〕[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的አልህምት指“牛”或“牛类”；这里保留动物异象，不把它解释为其可能象征的人群。
    reason: lexical_alternative
  - marker: b
    text: 直译“地的所有儿女”。这是启示文学式表达，故未简化为“地上所有的人”或“居民”。
    reason: cultural_note
  - marker: c
    text: 所提供的吉兹语转写在“都开始”处截断。方括号内的“战栗逃跑”依据校勘资料所指出的完整结尾补出。
    reason: textual_note
lexical_decisions:
- source_word: አሐዙ፡ እንከ፡ ይብልዕዎሙ
  choice: 又开始吞吃
  rationale: አሐዙ接后续动词表示“开始”，እንከ在此承接并推进异象中的行动，可自然译作“又”；ይብልዕዎሙ带有吞食、吞噬之意，动物暴力场景中译作“吞吃”既准确又自然。
- source_word: እልኩ፡ አልህምት
  choice: 那些牛群
  rationale: እልኩ具有指示意义；አልህምት指牛或牛类，不是“大象”。“牛群”保留动物异象的具体形象。
- source_word: ነዋ
  choice: 看哪
  rationale: 此词是引人注意的感叹语，宜译作“看哪”，不应解释为“战栗”。
- source_word: ኵሎሙ፡ ውሉደ፡ ምድር
  choice: 地上所有的儿女
  rationale: 直译其启示文学表达“地的众子/儿女”，不先行化约为“地上的居民”。现代汉语中调整语序为“地上所有的儿女”。
- source_word: ይርዐዱ ወይርወጹ（据完整文本补足；所给转写缺失）
  choice: 战栗逃跑
  rationale: 所给转写在第二个አሐዙ“开始”处截断；据校勘说明所保存的完整结尾为“战栗并逃跑”。因本提示中的原文行未载这些词，正文以方括号标明补足。
theological_decisions:
- issue: 是否在译文中解释动物异象的象征对象
  choice: 保留“牛群”的具体异象形象
  alternative: 将牛群直接解释为某些民族、统治者或群体
  rationale: 本段以动物形象传达启示性异象；翻译应呈现异象本身，不在正文中替作者解码。
- issue: “地上的儿女”的启示文学张力
  choice: 采用较直译的“地上所有的儿女”
  alternative: 地上所有的人／地上所有的居民
  rationale: 原语表达具有诗性和启示文学色彩；保留“儿女”可避免把其范围或象征意义过早限定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“吞吃”保留动物袭击的力度；“看哪”保留异象叙述的提示语气；以方括号明确区分现存转写与据完整文本补出的内容。
