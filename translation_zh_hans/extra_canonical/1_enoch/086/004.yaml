- from: 我注视着他们，看见了：看哪，他们全都像马一样伸出下体[a]，开始爬到母牛身上；母牛全都怀了孕，生下大象、骆驼和驴[b]。
  to: 我注视他们，看见：看哪，他们全都像马一样伸出自己的生殖器[a]，开始骑到母牛身上；母牛全都怀孕，生下大象、骆驼和驴[b]。
  rationale: 修订仅处理现代汉语的准确性和自然性：以“生殖器”明确原文所指，并以“骑到……身上”更贴切地传达交配语境中的上乘动作。保留母牛为怀孕和生产的主体，且不在正文加入象征意义的解释。
