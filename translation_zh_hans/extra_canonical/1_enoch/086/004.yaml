base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/004.yaml
  text: 'And I looked at them and saw: behold[a], they all let out their private parts like horses, and they began to mount the cows; and they all conceived and gave birth to elephants, camels[c][b], and donkeys.'
translation:
  language: zh_hans
  text: 我注视他们，看见：看哪，他们全都像马一样伸出自己的生殖器[a]，开始骑到母牛身上；母牛全都怀孕，生下大象、骆驼和驴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸出自己的生殖器”所译的吉兹语在此明确涉及雄性的生殖器官；译文保留其向外伸出的动作意味。
    reason: lexical_alternative
  - marker: b
    text: 这三类动物是异象中异常交配所生的后代，属于《动物启示录》的象征画面，不是一般的动物学叙述。
    reason: cultural_note
lexical_decisions:
- source_word: ወነጸርክዎሙ
  choice: 我注视着他们
  rationale: 保留异象叙事中持续观看的意味；“注视”比单纯“看”更能体现观察对象，同时仍属现代自然用语。
- source_word: ወርኢኩ ወነዋ
  choice: 看见了：看哪
  rationale: 保留原文重复的观看公式及提示词，使启示文学的叙事节奏清楚可见。
- source_word: አውፁኡ ንፍረታቲሆሙ
  choice: 伸出下体
  rationale: 使役、趋向性的动词与雄性生殖器官的语境相结合，所表达的不只是静态显露；“下体”明确而不过分医学化。
- source_word: ከመ አፍራስ
  choice: 像马一样
  rationale: 直译比较意象，不解释其象征含义。
- source_word: ወአሐዙ ይዐረጉ
  choice: 开始爬到……身上
  rationale: 原义为“开始上到……上面”；此译保留动物交配的具体动作，又不以解释性的“交配”取代异象画面。
- source_word: ዲበ አንስት አልህምት
  choice: 母牛身上
  rationale: አልህምት 指母牛或雌性牛类，并非大象；“母牛”在现代汉语中简洁明确。
- source_word: ወጸንሳ ኵሎነ ወወለዳ
  choice: 母牛全都怀了孕，生下
  rationale: 动词为阴性复数形式，承接母牛；汉语补出“母牛”，避免把怀孕误解为前述雄性主体。
- source_word: ነጌያተ ወአገማሰ ወአእዳገ
  choice: 大象、骆驼和驴
  rationale: 按原文次序列出异象中所生的三类动物；采用现代通行名称。
theological_decisions:
- issue: 动物异象中的性描写应有多明确
  choice: 明确译作“伸出下体……爬到母牛身上”
  alternative: 笼统译为“与母牛交配”，或用更含混的委婉说法
  rationale: 原文刻意呈现越界繁衍的强烈画面。保留身体动作和动物意象，既不淡化冲击力，也不额外加入某一教义解释。
- issue: 怀孕和生产的语法主体
  choice: 明确为母牛
  alternative: 沿用含混代词“他们全都怀了孕”
  rationale: 原文相应动词的阴性复数形态承接母牛；汉语若不补明主体，容易产生雄性个体怀孕的误读。
- issue: 所生动物名单的象征意义
  choice: 正文只译动物名称，象征性质放入脚注
  alternative: 在正文中直接解释为巨人或其类别
  rationale: 本节属于动物异象，但原文在此只呈现动物画面；不应在正文中把象征解释替换为所指对象。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留启示文学的提示公式；性描写不回避原文，却避免使用生硬的医学术语。通过重复“母牛”澄清阴性复数动词的所指。
