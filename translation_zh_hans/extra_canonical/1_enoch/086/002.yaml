base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/002.yaml
  text: And after that I saw large and black cattle[a], and behold, all of them changed their stalls and their pastures and their calves[c][b], and they began to live with one another.
translation:
  language: zh_hans
  text: 此后，我看见了又大又黑的牛[a]；看哪，它们全都改变了自己的棚圈、草场和牛犊[b]，并开始彼此同住[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“黑”，不是泛指“深色”；此处保留异象中明确的颜色描写。
    reason: lexical_alternative
  - marker: b
    text: “改变了自己的棚圈、草场和牛犊”在原文中含义较难确定：同一个动词统摄地点与后代，也可较宽泛地理解为“改变了自己的住处、放牧之地和幼畜”。
    reason: textual_variant
  - marker: c
    text: 也可译作“便住在一起”或“彼此同住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: አልህምተ
  choice: 牛
  rationale: 在《动物启示录》的异象体系中，此词指牛类；用“牛”可保留集体性的动物意象，又不限定性别。
- source_word: ዐቢያነ
  choice: 又大
  rationale: 此形容词主要描写体形或外观，用“又大”具体、自然，并与颜色描写并列。
- source_word: ጸሊማነ
  choice: 又黑
  rationale: 此词指黑色；上下文以动物颜色形成象征性对照，因此译作“黑”比“深色”更准确。
- source_word: ወለጡ
  choice: 改变了
  rationale: 原动词表达改变或变更；由于其后并列棚圈、草场和牛犊等语义不同的宾语，保留较宽泛的“改变”而不强行缩窄。
- source_word: ምዕያኖሙ
  choice: 自己的棚圈
  rationale: 在牛群异象中，宜保留畜牧场景；“棚圈”也比仅指室内隔间的“牛棚”略宽。
- source_word: ምርጓዮሙ
  choice: 草场
  rationale: 指放牧或觅食之地；“草场”简洁自然，并保留畜牧意象。
- source_word: አጥዐጥሆሙ
  choice: 牛犊
  rationale: 该词指后代或幼畜；在明确的牛类意象中译作“牛犊”最贴切。
- source_word: አሐዙ ተየሐይዉ ፩ ለካልኡ
  choice: 开始彼此共同生活
  rationale: 既表达起始意义，也保留相互共同生活的含义；不进一步解释其象征所指。
theological_decisions:
- issue: 是否在译文中直接说明这些动物所象征的人群
  choice: 正文保留牛群的异象形象
  alternative: 按象征意义直接译成人类群体
  rationale: 本段以动物形象传达启示；直接揭示象征所指会把翻译变成解释，并消除原文的异象张力。
- issue: 颜色词是否弱化为“深色”
  choice: 译作“黑”
  alternative: 译作“深色”
  rationale: 原词具有明确的黑色义，而且本书异象中的颜色对照具有叙事和象征作用；“黑”既符合词义，也不额外解释象征。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留异象叙事中的提示语气；“棚圈、草场、牛犊”维持全段一致的畜牧意象。所有不确定之处均以脚注说明，正文不解释动物象征。
