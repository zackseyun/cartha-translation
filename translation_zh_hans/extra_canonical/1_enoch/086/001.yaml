base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/001.yaml
  text: And again I looked with my eyes while I was sleeping[a], and I saw heaven above, and behold, one star fell from heaven[c][b], and it arose and ate and grazed in the midst of those cattle.
translation:
  language: zh_hans
  text: 我又在睡梦中亲眼观看；我看见上面的天。看哪，有一颗星从天上坠落[a]；它起来了，在那些牛群中间吃食、牧食[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 在这段动物异象中，“星”通常象征天上的存在；但本节原文仍称它为“星”。
    reason: cross_reference
  - marker: b
    text: 原文接连使用“吃”和“牧食／进食”两个动词；译文分别译作“吃食、牧食”，以保留异象中的动物形象，而不添加原文未明说的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: 又
  rationale: 标示异象叙述进入新的阶段，同时保留原文反复推进的节奏。
- source_word: ርኢኩ በአዕይንትየ
  choice: 亲眼观看
  rationale: 保留“看”与“我的眼睛”的表达重点，又使现代汉语自然。
- source_word: እንዘ እነውም
  choice: 在睡梦中
  rationale: 清楚交代异象发生于睡眠之中，避免让“睡着时”显得仅是普通观察。
- source_word: ሰማየ መልዕልተ
  choice: 上面的天
  rationale: 保留空间上的“在上”之意，不加入额外的宇宙论解释。
- source_word: ነዋ
  choice: 看哪
  rationale: 保留启示文学中引人注意的指示语气，庄重而易懂。
- source_word: ኮከብ አሐዱ
  choice: 一颗星
  rationale: 保留明确的单数与异象本身的星辰意象，不直接解释为天使。
- source_word: ወድቀ እምሰማይ
  choice: 从天上坠落
  rationale: 准确表达向下落的动作，并保留画面的突兀与不祥意味。
- source_word: ወይትሌዐል
  choice: 它站了起来
  rationale: 原词可表示起来、升起；在坠落之后译作“站了起来”最能呈现动作次序，同时不强定为被提升。
- source_word: ወይበልዕ
  choice: 吃食
  rationale: 采用普通的进食动词，不以“吞吃”等较强措辞扩大原意。
- source_word: ወይትረዐይ
  choice: 啃草
  rationale: 与前面的“吃食”区分，并保留牛类在草场进食的动物意象。
- source_word: ማእከለ እልከቱ አልህምት
  choice: 在那些牛群中间
  rationale: አልህምት 指牛类的复数集合，并非特指牛犊；“牛群”符合中文习惯，也保留群体意象。
theological_decisions:
- issue: 是否把异象中的“星”直接译成天使或属天存在
  choice: 正文保留“一颗星”
  alternative: 一位天使；一个属天的存在
  rationale: 以诺传统中星常象征属天存在，但本节呈现的是梦中异象的星。译文保存象征本身，不把解释写入正文。
- issue: 如何理解星坠落后“起来”的动作
  choice: 译作“站了起来”
  alternative: 升了起来；被举起
  rationale: 原动词容许不止一种动作理解；结合先坠落、后进入牛群活动的次序，“站了起来”自然，但不暗示神学上的升高或被动高举。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“亲眼观看……看见”保留原文重复的视觉节奏；“看哪”维持启示文学语感。标点将长串并列动作适度分句，以增强中文可读性而不改变事件顺序。
