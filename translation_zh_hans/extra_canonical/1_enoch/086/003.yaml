base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/003.yaml
  text: And again I saw in the vision[a], and I looked up to heaven; and behold, I saw many stars. They came down and were cast from heaven to that first star, and among those calves they became bulls[d][c][b], and they pastured with them.
translation:
  language: zh_hans
  text: 我又在异象中看见：我抬头望天，看哪，有许多星[a]降下来，又从天上被抛到那第一颗星[b]那里。它们在那些小母牛[c]中间变成了公牛，并与它们一同吃草[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “星”在这类异象中可能象征天上的众灵，但原文保留的是“星”的形象。
    reason: lexical_alternative
  - marker: b
    text: “那第一颗星”很可能指异象前文已经出现的那颗星；也可按其回指作用译作“那先前的星”。
    reason: cross_reference
  - marker: c
    text: 原词指幼牛；依这里与“公牛”的对照，也可译作“母牛犊”或“小母牛”。
    reason: lexical_alternative
  - marker: d
    text: “一同吃草”也可译作“一同牧食”。此处动词源于“吃草、牧放”，不宜理解为“被看见”。
    reason: alternative_reading
lexical_decisions:
- source_word: ወካዕበ፡ ርኢኩ፡ በራእይ
  choice: 我又在异象中看见
  rationale: 保留叙事承接语和异象框架，同时采用自然、庄重的现代汉语。
- source_word: ነጸርክዎ፡ ለሰማይ
  choice: 我抬头望天
  rationale: 表达朝向天空观看的动作；“抬头望天”比逐字式表达更符合汉语习惯。
- source_word: ነዋ
  choice: 看哪
  rationale: 保留启示文学中引人注意的指示语气。
- source_word: ከዋክብተ፡ ብዙኃነ
  choice: 许多星
  rationale: 直译其复数意象，不在正文中解释为天使或其他属灵存在。
- source_word: ወረዱ፡ ወተገደፉ፡ እምሰማይ
  choice: 降下来，从天上被抛到
  rationale: 区分主动的下降与随后被动的抛掷，保留原文动作次序及被施加力量的语态。
- source_word: በኀበ፡ ዝኩ፡ ኮከብ፡ ቀዳማዊ
  choice: 到先前那颗星那里
  rationale: ቀዳማዊ 可指“第一”或语境中的“先前”；这里承接前文已经出现的那颗星，“先前那颗星”在汉语中更清楚，同时脚注保留“第一颗”的可能。
- source_word: ማእከለ፡ እልኩ፡ ጣዕዋ
  choice: 在那些小母牛中间
  rationale: ጣዕዋ 指幼牛，并在此动物异象的性别对照中宜理解为小母牛，而不是笼统的牛或公牛。
- source_word: አልህምት፡ ኮኑ
  choice: 变成了公牛
  rationale: 依该词的牛类含义及与小母牛的对照译为“公牛”；不采用缺乏词汇依据的“马”。
- source_word: ወምስሌሆሙ፡ ይትረዓዩ
  choice: 并与它们一同吃草
  rationale: 将动词按“牧放、吃草”的词根理解，而非近形词“看见”；兼顾动物图景和句法。
theological_decisions:
- issue: 异象中“星”的身份
  choice: 正文保留“星”的意象，不直接译作天使或守望者。
  alternative: 天使；以星象征的天上众灵
  rationale: 原文明确使用“星”；虽可能象征天上存在，翻译不应替读者消解启示文学的象征张力。
- issue: 众星离开天上的方式
  choice: 译作“降下来，从天上被抛到”。
  alternative: 从天上坠落；从天上被扔下来
  rationale: 原文连续使用下降和被动抛掷两个动作，正文保留二者，不将其简化为自然坠落。
- issue: 变成公牛的象征意义
  choice: 仅呈现动物形象及性别对照，不在正文中说明其交合或神学身份。
  alternative: 明确解释为守望者化作雄性牲畜，与母牛交合
  rationale: 上下文可能支持这种象征解释，但本节本身只陈述变成公牛并共同吃草，翻译不补入未明说的行为。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。“看哪”保留启示文学的突显效果；其余句式力求清楚自然。代词“它们”延续星的表层意象，并让其进入牛群意象时的转化保持原文的突兀感。
