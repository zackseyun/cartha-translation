  source_fidelity: 草稿正确保留了“此后／又”、众多战车、车中乘坐者、乘风而来，以及从东、西至南方的方位图景。“一大队战车”与英文审校轨迹的“host of chariots”相符。可是末句把复数代词明确限定为“这些战车”，超出了原文及英文审校轨迹中未明定的“they”；在紧邻“有人乘坐其中”的语境下，这一限定尤其不稳妥。
