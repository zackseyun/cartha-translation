base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/001.yaml
  text: And after that I saw another host of chariots, and men riding in them; and they were coming upon the winds from the east and from the west, as far as the south.
translation:
  language: zh_hans
  text: 此后，我又看见一大队战车，有人乘坐在其中；他们从东方和西方乘风而来，直至南方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ካልእተ፡ ትዕይንተ፡ ሠረገላት
  choice: 又……一大队战车
  rationale: 此处词组在传本和译释上有一定困难；结合经审校的英文咨询层所保留的“host of chariots”，译作“一大队战车”，表达数量众多、成队出现的景象，避免误译成“另一个异象”。
- source_word: ይጼዐኑ፡ ሰብእ፡ ውስቴቶሙ
  choice: 有人乘坐其中
  rationale: 按吉兹语所表达的人在车中乘坐之意直译，中文自然且不额外规定这些人的身份。
- source_word: ይመጽኡ፡ ዲበ፡ ነፋሳት
  choice: 乘风而来
  rationale: 保留介词“在／于……之上”所呈现的超自然图景，同时以自然的现代汉语表达，未弱化为仅仅“随风而来”。
- source_word: እምስራቅ፡ ወእምዕራብ፡ እስከ፡ መንፈቀ፡ ዕለት
  choice: 从东方和西方而来，直至南方
  rationale: “日中方向”在方位用语中指向南方；保留“从东、西……直至南方”的原文空间关系，不将其改写为更明确但属解释性的路线描述。
theological_decisions:
- issue: 乘风而来的主体
  choice: 这些战车乘风而来
  alternative: 他们乘风而来
  rationale: 源语动词的主语可依上下文理解为战车及其中的人；中文明确为“这些战车”可自然承接前句，但不对乘车者赋予天使、军队等神学身份。
- issue: 车队的性质
  choice: 一大队战车
  alternative: 另一个战车异象
  rationale: 采用审校资料所支持的群体性理解，同时不把该景象解释为特定末世阵营或审判军队。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“此后”“直至”保持经文叙事的 dignified register；不使用生僻古汉语，也不增添原文未明说的人物身份或神学解释。
