base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/002.yaml
  text: And the sound of their chariots was heard[a]; and when this turmoil came to be, the holy ones in heaven took notice, and the pillars of the earth were shaken from their foundations[e][d][c][b], and it was heard from one end of heaven to the other in one day.
translation:
  language: zh_hans
  text: 他们战车的声响传来[a]；这场骚动发生时，天上的众圣者察觉了，地柱从根基上震动[b]；这声音在一天之内，从天的一端到另一端都能听见[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文将两个表示声音的词连用以加强语气；也可译作“他们战车发出的声响”。
    reason: lexical_alternative
  - marker: b
    text: “根基”所译的词也可指“位置”或“座处”，因此也可译作“地柱从原处震动”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“从天的各端直到其端”，是指遍及整个天空的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተሰምዐ / ተሰምዓ
  choice: 传来／传到
  rationale: 原文使用被动的听觉表达。汉语若机械译作“被听见”较生硬，故按上下文分别译为“传来”和“传到”，保留声音可闻、传播的意象。
- source_word: ቃለ ድምፀ ሰረገላቲሆሙ
  choice: 他们战车的轰响
  rationale: ቃለ ድምፀ 是叠加强调声音的表达；“轰响”既适合战车，也自然传达强烈声响，而不把战车拟人化为有“声音/嗓音”。
- source_word: ዝሀውክ
  choice: 这场骚动
  rationale: 该词指扰动、混乱或喧嚷；“骚动”兼顾事件性的动荡和声音背景，又不把具体性质说死。
- source_word: ቅዱሳን
  choice: 众圣者
  rationale: 保留“圣者”这一称谓，不在正文直接解释为天使；“天上的”提示其在本节中的天界身份。
- source_word: አእመሩ
  choice: 察觉了
  rationale: 该动词可表示知道、觉察或领会；此处是对宇宙骚动的感知，“察觉”最贴合语境。
- source_word: ዐምደ ምድር
  choice: 地柱
  rationale: 保留古代宇宙图景中的支柱意象，不作现代化或去神话化解释。
- source_word: ተሐውሰ እመንበሩ
  choice: 从根基上震动
  rationale: እመንበሩ 可指从其座位、位置或基部；与地柱搭配时，“根基”最为通顺，同时脚注保留另一可能。
- source_word: እምአጽናፈ ሰማይ እስከ አጽናፍ
  choice: 从天这端传到天那端
  rationale: 以自然汉语表达原文首尾皆用“边端”的全幅空间习语。
- source_word: በአሐቲ ዕለት
  choice: 在一天之内
  rationale: 直译时间范围，表达声音在一日内遍及整个天空。
theological_decisions:
- issue: “众圣者”的身份
  choice: 正文保留“众圣者”，并以“天上的”交代其所在
  alternative: 直接译为“众天使”或理解为人间圣徒
  rationale: 上下文很可能指天界圣者，但原词本身并非专指天使。保留称谓可避免过度确定其身份。
- issue: 地柱意象的性质
  choice: 按宇宙建筑意象直译为“地柱”
  alternative: 意译为“大地的根基”或视为纯粹比喻
  rationale: 原文明确使用“柱”，直译能保存启示文学的宇宙震动图景，不替文本判定其物理或象征性质。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。分号维持原文连续推进的异象叙事；“轰响”“骚动”“震动”形成听觉与宇宙震荡的连贯层次。所有脚注标记均置于相应正文之后。
