base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/003.yaml
  text: And all of them shall fall down and worship the Lord of Spirits[a]. And this is the end of the second parable.
translation:
  language: zh_hans
  text: 他们全都要俯伏，敬拜万灵之主。这就是第二个比喻[a]的结束。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第二个比喻”也可译作“另一个比喻”或“别的比喻”；原词既可表示次序上的“第二”，也可表示“另一个／别的”。
    reason: 保留ካልእ在此处可能具有的非次序性词义，并避免将“other”误作现代汉语指示语“那个”。
lexical_decisions:
- source_word: ይወድቁ
  choice: 俯伏
  rationale: 该动词本义涉及落下、倒下；在敬拜语境中，“俯伏”既保留身体动作，又自然表达敬畏之意，而不把它仅仅弱化为一般的“低头”。
- source_word: ኵሎሙ
  choice: 他们全都
  rationale: 保留原文代词后缀所指的群体及其总括性，并以现代汉语自然承接上文。
- source_word: ይሰግዱ
  choice: 敬拜
  rationale: 此词在“万灵之主”面前具有明确的尊崇、礼拜意味；前面的“俯伏”已经呈现身体动作，因此这里译作“敬拜”可避免重复而保留宗教语义。
- source_word: ለእግዚአ መናፍስት
  choice: 万灵之主
  rationale: 这是《以诺一书》中具有特色的神圣称号；“万灵之主”简洁、庄重，并保留复数属格所表达的统摄范围。
- source_word: ዝንቱ ውእቱ
  choice: 这就是
  rationale: 以自然的现代汉语表达原文直接的判断、指认结构。
- source_word: ተፍጻሜተ
  choice: 结束
  rationale: 此处是篇章收束语，“结束”清楚自然，也准确表达完成、终结之意。
- source_word: ካልእ ምሳሌ
  choice: 第二个比喻
  rationale: 在《比喻篇》的篇章结构中，ካልእ最可能具有次序意义，指“第二个”；但该词也可表示“另一个”或“那个”，故在脚注中保留歧义。
theological_decisions:
- issue: 神圣称号ለእግዚአ መናፍስት的译法
  choice: 万灵之主
  alternative: 诸灵之主
  rationale: 将其作为本书特有称号保留下来，不以其他传统中的神名或后期教义用语替换；“万灵”在现代汉语中庄重且易懂。
- issue: 结尾公式中ካልእ的含义
  choice: 第二个比喻
  alternative: 另一个比喻／那个比喻
  rationale: 篇章位置支持次序义，但词本身并非只能如此理解，因此正文采用最符合结构的译法，同时用脚注保留真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“俯伏，敬拜”分别呈现身体动作与宗教尊崇；“万灵之主”按神圣称号处理。脚注标记置于实际存在词义分歧的“第二个比喻”之后。
