base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/003.yaml
  text: 'And the fourth wind[a], whose name is the North, is divided into three parts: one part for a dwelling for humankind, and another is over the seas of water of water, and over the abysses, and over the forests, and over the rivers, and over darkness, and over mist[g][f][e][d][c][b]; and the third part is in the garden of righteousness.'
translation:
  language: zh_hans
  text: 第四风，名为“梅斯”[a]，分为三部分：其中一部分供人居住；另一部分则在水海[b]、山谷、荒野、河流、黑暗和雾气[c]之上；第三部分在正义之园[d]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “梅斯”音译自吉兹语名称መስዕ；其确切含义不明。传统译本有时将它解释为“北方”。
    reason: lexical_alternative
  - marker: b
    text: “水海”较贴近原文“水之海”的重复说法，也可自然理解为“海洋”。
    reason: lexical_alternative
  - marker: c
    text: 译作“雾气”的词含义不十分确定，也可能指雾、云、霭一类的大气水汽。
    reason: lexical_alternative
  - marker: d
    text: “正义之园”可能使人联想到伊甸园或乐园，但原文没有明确作出这种认定。
    reason: cross_reference
lexical_decisions:
- source_word: ራብዕ ነፋስ
  choice: 第四风
  rationale: 按上下文中的编号次序直译；ነፋስ在此指宇宙秩序中的风，而非“灵”或“气息”。
- source_word: ዘስሙ መስዕ
  choice: 名叫“梅斯尔”
  rationale: 原文明确给出名称መስዕ；将其按音译处理，不依后期译本改作方位名“北”。
- source_word: ይትከፈል ሠለስተ ክፍለ
  choice: 分为三部分
  rationale: 保留被动分配为三个部分的结构，同时符合现代汉语表达。
- source_word: ማኅደር ለሰብእ
  choice: 供人居住
  rationale: ማኅደር指居所、住处；译作“供人居住”自然表达其用途，并保留集体性的人类指称。
- source_word: አብሕርት ማይ
  choice: 水海
  rationale: 原文是带有重复意味的“水之海”；正文用较凝练的“水海”保留这一异常措辞，并以脚注说明。
- source_word: ቀላያት
  choice: 山谷
  rationale: 该词可指低洼地、谷地或沟壑；“山谷”是现代汉语中自然且不过度限定地貌的译法。
- source_word: ፆም
  choice: 荒野
  rationale: 指荒凉、干旱或无人之地；“荒野”兼顾地理范围与庄重语体。
- source_word: አፍላግ
  choice: 河流
  rationale: 该词通常指河流或水道；此处采用最清楚的一般译法。
- source_word: ጽልመት
  choice: 黑暗
  rationale: 直译并保留风所辖范围超越普通地理区域的宇宙性意象。
- source_word: ጊሜ
  choice: 雾气
  rationale: 该词指某种大气中的水汽现象，但具体是雾、云还是霭并不确定；“雾气”较自然且保留宽泛性。
- source_word: ገነት ጽድቅ
  choice: 正义之园
  rationale: 按原文组合直译，不在正文中直接等同于伊甸园或乐园。
theological_decisions:
- issue: “正义之园”的具体所指
  choice: 保留为“正义之园”这一独特圣境或乐园性地点
  alternative: 直接译作“伊甸园”或“乐园”
  rationale: 原文没有明确要求将其认定为伊甸园或后期意义上的乐园；直译可保存其可能的伊甸意蕴，同时避免替文本作神学定论。
- issue: 第四风名称与“北方”的关系
  choice: 正文音译专名መስዕ为“梅斯尔”
  alternative: 译作“北风”或“名叫北方”
  rationale: 吉兹文本将መስዕ置于“其名”的结构中，宜视为名称并音译；其与北方的传统对应不应取代原文中的专名。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留原文三分结构，以分号清楚区分三部分；对专名、异常重复和不确定的大气术语设置脚注，不把英文咨询层中彼此冲突的“北方”和专名读法混合进正文。
