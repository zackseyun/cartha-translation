base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/006.yaml
  text: And the two of them come from the west as far as the sea[d][c][b][a], and they pour out their waters into the Erythraean Sea in the east.
translation:
  language: zh_hans
  text: 二者从西方来到海边，将各自的水倾入东方的厄立特拉海。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厄立特拉海”是古代地理名称，可指红海，也可能泛指古人所说的更广阔海域；这里不一定与现代地图上的单一海域完全对应。
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤቱ፡ ክልኤ፡
  choice: 他们二者
  rationale: 重复的数词突出所指的一对；“他们二者”在中文中明确而庄重。
- source_word: ይመጽኡ፡
  choice: 来到
  rationale: 采用普通的移动动词，并与河流行至海边的语境自然衔接。
- source_word: እመስዕ፡
  choice: 从西方
  rationale: 依据本节最新的词义复核，将该方位词译作“西方”，不沿用早先的“正午／南方”或“北方”。
- source_word: እስከ፡ ባሕር፡
  choice: 来到海边
  rationale: እስከ 表示所达到的界限或终点；中文用“来到海边”自然表达抵达海域。
- source_word: ወይከዕዉ፡ ማዮሙ፡
  choice: 把自己的水倾入
  rationale: 保留动词“倾倒、倾注”的动态意象，同时符合中文描述河水入海的表达。
- source_word: በባሕረ፡ ኤርትራ፡ እምሥራቅ።
  choice: 东方的厄立特里亚海
  rationale: 正文保留原文明确出现的海名，并将末尾方位词理解为对其东方位置的说明；不以现代地理名称强行限定。
