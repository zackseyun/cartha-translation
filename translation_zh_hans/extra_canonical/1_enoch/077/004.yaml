base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/004.yaml
  text: I saw seven high mountains[a], which are higher than all the mountains that are on the earth; and from them frost comes forth[d][c][b], and days and seasons and years pass.
translation:
  language: zh_hans
  text: 我看见七座高山，它们比地上所有的山都高；霜从其中发出，日子、时节[a]和年岁流逝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时节”也可译为“时期”或“时日”；原词可泛指指定的时间或周期。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰብዓተ አድባረ ነዋኃነ
  choice: 七座高山
  rationale: 保留确切数目；አድባር指山或高地，ነዋኃነ在与其他山比较高度的语境中自然译作“高”。
- source_word: ርኢኩ
  choice: 我看见
  rationale: 这是第一人称异象叙述的常用表达；原文此处没有表示“又／并且”的连词，因此不增译“又”。
- source_word: እለ ይነውሑ እምኵሉ አድባር እለ ውስተ ምድር
  choice: 它们比地上所有的山都高
  rationale: 明确表达原文的高度比较，同时以现代汉语自然呈现“在地上”的范围。
- source_word: ወእምኔሆሙ ይወፅእ
  choice: 霜从它们那里涌出
  rationale: ይወፅእ表示出来、发出；“涌出”保留异象中事物由群山发出的动态意象。
- source_word: አሰሐትያ
  choice: 霜
  rationale: 在本段气象语境中最可能指霜或冰冷凝结物；“霜”简洁自然，也不把词义过度具体化为某一种霜。
- source_word: ወየኀልፍ
  choice: 也流逝
  rationale: 该动词与时间名词连用时表示经过、消逝；“流逝”在现代汉语中清楚表达时间推移，不暗示毁灭。
- source_word: መዋዕለ ወዘመን ወዓመት
  choice: 日子、节期和年岁
  rationale: 保留三个并列的时间单位；ዘመን可泛指时期，也可依历法语境理解为节期。
theological_decisions:
- issue: 高山与霜及时间运行之间的宇宙论关系
  choice: 并列呈现霜由群山涌出以及日子、节期、年岁流逝，不说明其运行机制
  alternative: 把群山解释为实际地理山脉，或明确解释为掌管气候和历法的天界区域
  rationale: 原文把异象地理、气象现象和时间推移相邻陈述，却没有解释彼此如何关联；译文保留这种张力，不将其固定为字面地理或象征体系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我看见”保留异象叙述语气；不增添原文没有的句首连词。分号呈现原文从观山转向霜与时间的结构，同时避免把后半句解释成完整的宇宙运行机制。
