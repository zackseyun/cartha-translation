  yaml_path: translation/extra_canonical/1_enoch/077/007.yaml
  text: And the four remaining ones go out by the north side to their own sea—two of them to the Eritrean Sea[d][c][b][a], and two to the Great Sea.
translation:
  language: zh_hans
  text: 其余四条从北边流出，直到各自的海[a]：其中两条通往厄立特里亚海[b][d]，两条通往大海[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到各自的海”也可译作“流向各自的海”；原文介词既可表示所到之处，也可表示延伸的界限。
    reason: lexical_alternative
  - marker: b
    text: “厄立特里亚海”依据埃塞俄比亚文本中的古代地名音译；该名称也常译作“厄立特里亚海（Erythraean Sea）”，其所指范围可能涵盖或邻近今称红海的地区。
    reason: cultural_note
  - marker: c
    text: “大海”是古代传统地理称谓，通常指地中海。
    reason: cultural_note
  - marker: d
    text: 原文在“两条……两条……”附近出现括号所标示的重复，可能源于抄写扰动，也可能用于强调二分结构；正文按可辨识的整体意思翻译。
    reason: textual_variant
lexical_decisions:
- source_word: እለ ተርፉ
  choice: 其余
  rationale: 承接上下文中的数目划分，表示先前分组之后剩下的部分；与“四条”连用，在现代汉语中自然且保留其图式性。
- source_word: አርባዕቱ
  choice: 四条
  rationale: 原文明确保留数字“四”；量词“条”按上下文所指的水流采用，使中文自然，但不在名词层面补入原文未明说的对象。
- source_word: ይወፅኡ
  choice: 流出
  rationale: 基本义为“出去、出来”。本节语境涉及通向诸海的水流，译作“流出”可自然表达运动，又不改变方向意象。
- source_word: በገቦ መስዕ
  choice: 从北边
  rationale: 表达北方一侧或北部区域；“从北边”简明保留空间方位，不强行把它术语化为特定天文分区。
- source_word: እስከ ባሕረ ዚአሆሙ
  choice: 直到各自的海域
  rationale: እስከ 可表示到达或延伸的界限；“直到”保留这种范围义，ዚአሆሙ 则以“各自的”表达所属关系。
- source_word: ባሕረ ኤርትራ
  choice: 厄立特里亚海
  rationale: 按古代地名音译，避免直接等同于范围可能较窄的现代“红海”；具体地理背景放入脚注。
- source_word: ባሕር ዓቢይ
  choice: 大海
  rationale: 保留古代传统称谓，不在正文直接改成“地中海”，以免把很可能的所指提升为毫无歧义的明说。
theological_decisions:
- issue: 《天文书》中的宇宙—地理语言
  choice: 照原文保留方位、分流结构和海名
  alternative: 改用现代地理名称，或概括译成“海洋”
  rationale: 本节属于结构化的宇宙地理描述。保留其古代名称和方向意象，既尊重启示文学的世界图景，也避免用现代地理体系消解原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“其余四条”承接上下文中的水流分组；“厄立特里亚海”和“大海”保留古代地理称谓，并以脚注说明，而不把现代等同名称写入正文。所有脚注标记均置于相关词句之后。
