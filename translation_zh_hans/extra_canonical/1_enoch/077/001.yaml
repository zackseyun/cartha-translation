base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/001.yaml
  text: And they call the first wind the eastern one, because it is the first; and they call the second the south, because the Most High descends there, and there especially the Blessed One descends forever.
translation:
  language: zh_hans
  text: 他们称第一种风为东方之风[a]，因为它是第一；又称第二种风为南方之风，因为至高者在那里降临，而永远受称颂者尤其在那里降临[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东方”原是一个与清晨、黎明相关的词，在这里用来表示日出之方。
    reason: lexical_alternative
  - marker: b
    text: 本节后半句的措辞和句法较难确定。原文似乎说，南方如此得名，是因为“至高者在那里降临”；其后又有一个加强语气的词，因此这里译作“尤其”。
    reason: textual_variant
  - marker: c
    text: “永远受称颂者”也可理解为：“他降临，永远受称颂”，或“受称颂者永远降临”。
    reason: previous_rendering
lexical_decisions:
- source_word: ይጼውዕዎ
  choice: 他们称……为
  rationale: 保留主动、非特指主语的命名表达，符合本段宇宙志说明的语气。
- source_word: ለነፋስ
  choice: 风
  rationale: 采用基本义“风”，不把宇宙方位意象解释性改写为“区域”。
- source_word: ቀዳማዊ
  choice: 第一／居首
  rationale: 前者表达序数，后者保留原文解释命名时对“第一”的重复，同时使现代汉语自然。
- source_word: ለጽባሓዊ
  choice: 东方之风
  rationale: 该词与清晨、黎明相关，在此表示东方；译作“东方之风”既交代方位，也保留它与“风”的关系。
- source_word: ለካልእ
  choice: 第二道风
  rationale: 上下文是在依次列举，因此取序数义“第二”，而非泛指“另一”。
- source_word: አዜብ
  choice: 南方之风
  rationale: 该词表示南方或南部方位；结合前文的风，译为“南方之风”以维持平行结构。
- source_word: ልዑል
  choice: 至高者
  rationale: 保留神圣称号及庄重语体，不另加特定宗派解释。
- source_word: ህየ
  choice: 在那里
  rationale: 按原文保留地点副词，并在两个平行分句中重复呈现。
- source_word: ይወርድ
  choice: 降临
  rationale: 原义为“下降、下来”；“降临”保留垂直运动和神显色彩，而不将其改释为降下祝福或热气。
- source_word: ወፈድፋደ
  choice: 尤其
  rationale: 此处词形和句法较难，似有加强语气的作用；“尤其”表达强调，但不强行限定为数量上的“更多”。
- source_word: ቡሩክ፡ ለዓለም
  choice: 永远受称颂者
  rationale: 将其按实词化的神圣称号处理，与前句“至高者”形成平行；同时以脚注保留将其理解为述谓语或把“永远”连接于动词的可能。
theological_decisions:
- issue: “至高者在那里降临”应按神显性的下降理解，还是弱化为从南方降下祝福、热气等自然现象
  choice: 正文保留“至高者在那里降临”
  alternative: 至高者在那里降下祝福／热气；至高者从那里降临
  rationale: 原文明确使用神圣称号和“下降”动词。保留其宇宙论与神显张力，不用气象化释义取代文本。
- issue: “永远受称颂者”与“至高者”的关系
  choice: 保留两个平行称号，不在译文中明说两者是否为同一指称
  alternative: 用代词合并为同一主体，或解释为两个不同主体
  rationale: 原文的平行结构可以暗示同一神圣主体，却没有必要在翻译中消除其形式上的双重称谓。
- issue: ቡሩክ፡ ለዓለም 的句法归属
  choice: 正文译作实词化称号“永远受称颂者”
  alternative: 他降临，永远受称颂；受称颂者永远降临
  rationale: 其位置可支持把“受称颂”视为第二个动词的主语，并与“至高者”平行；但“永远”的连接范围仍有歧义，故在脚注中保留其他读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“第一道风／第二道风”保留宇宙志的列举方式；“东方之风／南方之风”比单说“东方／南方”更清楚地维持原文的风之意象。后半句刻意保留地点重复、神圣称号的平行以及句法歧义，不作气象化或宗派化解释。
