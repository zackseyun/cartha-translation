base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/005.yaml
  text: And I saw seven rivers upon the earth[a], greater than all the rivers[b]; and one of them comes from the west and pours its waters into the Great Sea.
translation:
  language: zh_hans
  text: 我看见地上有七条河，比所有河流都大；其中一条从西方流来，把水注入大海[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大海”也可能是特定的地理名称，通常被理解为地中海；原文也可理解为描述性的“广大的海”。
    reason: 保留原文在地理专名与普通描述之间的词义歧义。
lexical_decisions:
- source_word: ፯ አፍላገ
  choice: 七条河
  rationale: 原文以数字“七”修饰“河流”的复数形式；“七条河”准确保留数目，也符合现代汉语量词习惯。
- source_word: ዲበ ምድር
  choice: 地上
  rationale: 这是直接的方位表达；“地上”简洁自然，并适合异象叙述的语境。
- source_word: ርኢኩ
  choice: 我又看见
  rationale: 该词是第一人称完成式“我看见”；“又”承接本章连续的异象观察，属于自然的汉语篇章衔接。
- source_word: ዓበይተ እምኵሎሙ አፍላገ
  choice: 比所有河流都大
  rationale: 比较结构表示这些河在大小或规模上超过其余河流；“大”保留宽泛含义，不限定为水量、宽度或力量。
- source_word: አሐዱ እምኔሆሙ
  choice: 其中一条
  rationale: 准确表达从七条河中取其一的部分关系，并采用汉语河流的常用量词。
- source_word: ይመጽእ እምዓረብ
  choice: 从西方流来
  rationale: 原文直义为“从西方来”；因主语是河流，译作“流来”自然地表达河道或水流的来源，同时不改变方向信息。
- source_word: ውስተ ባሕር ዐቢይ
  choice: 注入大海
  rationale: 介词短语表示进入“大的海”；“大海”既可作为特定海域的称呼，也可作描述性表达，正文不以专名号消除这种歧义。
- source_word: ይከዑ ማዮ
  choice: 把水注入
  rationale: 动词描写河水倾入或汇入海中；“注入”在现代汉语中自然清楚，并保留具体的水文意象。
theological_decisions:
- issue: “大海”是特定地理名称还是泛指广大的海
  choice: 正文译作“大海”，不加专名号
  alternative: 译作特指的“那大海”或明确解释为地中海
  rationale: 原文“海＋大”既可能是古代地理用语中的特定称呼，也可按字面理解为“大海”。正文保留两可性，脚注说明可能的专名用法，不把地中海的识别直接写入经文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我又看见”维持异象报告的叙事语气；分号对应原文从七河总述转向其中一河的结构。正文避免古奥措辞，也不把“大海”的具体所指武断地固定下来。
