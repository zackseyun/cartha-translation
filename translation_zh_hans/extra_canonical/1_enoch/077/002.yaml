base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/002.yaml
  text: And the wind from the west is named Hegulā[b][a], because there all the lights of heaven fade and go down.
translation:
  language: zh_hans
  text: 从西方来的风名叫赫古拉[a]，因为天上的一切光体都在那里渐渐减弱，并降下去。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赫古拉”为音译，也可转写作“赫古啦”或“哈古拉”。
    reason: proper_name_transliteration
  - marker: b
    text: “渐渐减弱”也可译作“渐亏”或“衰减”；“降下去”在这里很可能是指天上的光体在西方落下、沉没。
    reason: lexical_and_contextual_alternative
lexical_decisions:
- source_word: ነፋስ
  choice: 风
  rationale: 本段论述方位之风，因此取通常的气象含义“风”，不译作“灵”。
- source_word: እምዕራብ
  choice: 从西方来的
  rationale: 介词እም表示来源；此译明确保留风来自西方的意思。
- source_word: ስሙ
  choice: 名叫
  rationale: 这是引出该风专名的命名表达；“名叫”自然、简洁。
- source_word: ኀጕላ
  choice: 赫古拉
  rationale: 这是西风的专名，采用音译，不擅自赋予词义。
- source_word: በህየ
  choice: 在那里
  rationale: 该副词回指前述西方区域。
- source_word: የሐፅፁ
  choice: 渐渐减弱
  rationale: 该动词表示减少、衰减；此译既符合天体光度渐弱的语境，也避免误译为“被涂抹”或断言其彻底熄灭。
- source_word: ኵሉ ብርሃናት ሰማይ
  choice: 天上的一切光体
  rationale: “光体”既可指发光的天体，又保留原文较宽泛的“光”之意，比单译“星辰”涵盖面更广。
- source_word: ወይወርዱ
  choice: 并降下去
  rationale: 保留动词“下降”的具体意象，不在正文中直接收窄为天文学术语“落下”或“西沉”。
theological_decisions:
- issue: 应采用技术性的天文学表述，还是保留启示文学的宇宙图景
  choice: 天上的一切光体……渐渐减弱，并降下去
  alternative: 天上的一切天体……渐亏并西沉
  rationale: 原文处于《天文书》的语境，却仍以可见的减弱和下降描绘天象。正文保留这种具象表达，脚注说明其很可能指西沉，不把古代宇宙图景改写成现代天文学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从西方来的风”贴近原文的来源结构；“光体”略带宇宙论色彩，但仍能为一般读者理解。句末脚注保留“下降”与“西沉”之间的语义张力。
