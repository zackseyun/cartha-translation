  text: And they shall not again sin[c][b][a], and they shall not be condemned all the days of their life.
translation:
  language: zh_hans
  text: 他们不再犯罪[a]，并且在他们一生的日子里都不被定罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们以后不再犯罪。”原文含有重复、继续的意味。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在他们生命的一切日子里。”原文以单数“生命”配复数“他们”，属习语表达。
    reason: literal_rendering
lexical_decisions:
- source_word: ወኢይደግሙ፡ አብሶ
  choice: 他们不再犯罪
  rationale: 否定未完成式与表示重复、继续的词义结合，意为不再重复犯罪。译作“不再犯罪”既保留反复之意，也符合现代汉语表达，并与上下文中的相同短语保持一致。
- source_word: ወኢይትኴነኑ
  choice: 都不被定罪
  rationale: 该词在这里具有被动、司法性的含义；“被定罪”比宽泛的“受惩罚”更准确地保留裁决意味。
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወቶሙ
  choice: 一生的年日
  rationale: 这是闪语式的时间表达，直指他们生命中的全部日子。“一生的年日”在中文中自然而庄重，同时保留原文意象。
theological_decisions:
- issue: 本句是在应许道德上的改变，还是仅指不再有招致惩罚的行为
  choice: 将前半句译为不再犯罪，后半句译为不被定罪，分别保留行为与司法裁决两层意思。
  alternative: 可将前半句弱化为“不再作恶”，或把后半句理解为“不再受惩罚”。
  rationale: 原文并列犯罪行为与被定罪的结果；不把二者合并，能够保留其伦理与司法之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不再犯罪”简洁呈现原文的重复意味；“一生的年日”保留原文的闪语式表达，但不至于生硬。
