base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/005.yaml
  text: And because of this[a], you will curse your days, and you will shorten the years of your life; and the years of your destruction will increase in an eternal curse[b], and there will be no mercy for you.
translation:
  language: zh_hans
  text: 正因如此，你们必咒诅自己的年日，也必减损自己的寿数；你们败亡的年日必在永远的咒诅中增多[a]，你们必得不到怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们败亡的年日必……增多”原文较难理解。“败亡”也可译作“毁灭”“衰败”或“消亡”。
    reason: textual_and_lexical_difficulty
lexical_decisions:
- source_word: ወበእንተዝ
  choice: 正因如此
  rationale: 保留连接词明确的因果作用，同时以自然、庄重的现代汉语引出审判后果。
- source_word: መዋዕሊክሙ ትረግሙ
  choice: 你们必咒诅自己的年日
  rationale: 将动词按第二人称复数主动式处理，表达受审判者哀叹并咒诅自己的日子，而非被别人咒诅。
- source_word: ዓመታት ሕይወትክሙ ትኃጕሉ
  choice: 也必折损自己的寿年
  rationale: 动词按第二人称复数主动式翻译，与前句平行；“折损”兼顾毁坏、损失及使寿命缩短的语义，又避免误把“年岁”当作主语。
- source_word: ዓመታት ኀጕልክሙ
  choice: 你们败亡的年日
  rationale: 相关名词可指毁灭、衰败或灭亡；“败亡”保留审判语境及原文与前一动词的词根呼应。
- source_word: ይበዝኅ
  choice: 必……增多
  rationale: 体现变多、增加的基本意义，并保留原句中“败亡的年日增多”这一较为艰涩而悖论式的表达。
- source_word: በርገመት ዘለዓለም
  choice: 在永远的咒诅中
  rationale: 保留介词结构和末世审判语境中的持久、终局意味，不额外引入后期教义术语。
- source_word: ወኢይከውነክሙ ሣህል
  choice: 你们必得不到怜悯
  rationale: 以自然现代汉语表达“对你们不会有怜悯”的存在否定，同时保持断然语气。
theological_decisions:
- issue: 本节说的是自我咒诅，还是被他人咒诅
  choice: 你们咒诅自己的年日
  alternative: 你们的年日必受咒诅
  rationale: 吉兹语动词最宜按第二人称复数主动式理解；译文因此保留受审判者在哀痛中咒诅自身年日的图景。
- issue: ትኃጕሉ 的主语和语态
  choice: 你们必折损自己的寿年
  alternative: 你们的寿年必消逝
  rationale: 该形式是第二人称复数主动式，希腊语见证亦支持主动含义；因此不可把“寿年”改作主语，但“折损”仍保留词义可能涵盖毁坏、丧失和缩短的张力。
- issue: ዘለዓለም 在咒诅公式中的力度
  choice: 永远的咒诅
  alternative: 长久的咒诅
  rationale: 在此启示文学审判语境中，该词组表达持续而终局的意味；“永远”直接而庄重，又不对其形上含义作额外发挥。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“年日”“寿年”“咒诅”“怜悯”维持启示文学的审判语域；避免过度古雅，也不将原文艰涩处擅自解释得更明确。
