base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/006.yaml
  text: In those days you will give your names to an everlasting curse for all the righteous[a], and the sinners will curse you[d][c][b]; and for you there will be a joining together with sinners.
translation:
  language: zh_hans
  text: 那些日子，你们必把自己的名字交给众义人，作为永远的咒诅[a]；罪人必咒诅你们[b]；……[c]你们将与罪人同列[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话很可能是说，他们的名字将成为人发出咒诅时所援引的用语或范例，表示公开的羞辱和审判。
    reason: lexical_alternative
  - marker: b
    text: 也有译法作“罪人必借着你们发咒”。现存吉兹语的句法则较直接地表示“罪人必咒诅你们”。
    reason: textual_or_grammatical_alternative
  - marker: c
    text: 现存底本文字在此有缺损或难以辨明之处，故以省略号标示。
    reason: textual_gap
  - marker: d
    text: 也可理解为“你们将被算在罪人中间”或“你们将与罪人相联”。原文可指归类、联合或共同结局。
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ መዋዕል
  choice: 那些日子
  rationale: 保留复数时间表达及启示文学的预言语体；较“那时”更贴近原文形式。
- source_word: ትሁቡ ስመ ዚአክሙ
  choice: 你们的名字必交给
  rationale: 按被动、将来意义处理动词，以“名字”为承受动作的对象；“交给”既自然，也保留被置于某种用途或结局之下的意味。
- source_word: በርገመት ዘለዓለም ለኵሉ ጻድቃን
  choice: 交给众义人，作为永远的咒诅
  rationale: 保留“永远的咒诅”与“众义人”之间略有张力的介词关系，同时用汉语句法表明这些名字将成为咒诅用语。
- source_word: ወኪያክሙ ይረግሙ ኃጥኣን
  choice: 罪人必咒诅你们
  rationale: 将独立宾格代词ኪያክሙ理解为动词的直接宾语，以ኃጥኣን“罪人”为复数主语；不采用受其他文本传统影响的工具格读法“借着你们咒诅”。
- source_word: ወለክሙ ተኅቡረ ምስለ ኃጥኣን
  choice: 你们将与罪人归在一起
  rationale: “归在一起”自然地表达联合、归类或共同结局，又不把原文限定为社交往来、主动结盟或严格的法律判定。
theological_decisions:
- issue: 恶人的名字与永远咒诅之间的关系
  choice: 译为名字被交给众义人“作为永远的咒诅”
  alternative: 众义人直接永远咒诅他们；或他们的名字被交付给咒诅
  rationale: 上下文很可能描绘其名字成为咒诅时所引用的话柄，表现公开羞辱与审判；正文保留原文意象，不把隐含的使用方式完全解释进译文。
- issue: 谁咒诅谁
  choice: 罪人必咒诅你们
  alternative: 罪人必借着你们发咒；或罪人必以你们为咒诅的范例
  rationale: 现存吉兹语中第二人称复数独立代词为宾格，最直接的句法是“罪人”作主语、“你们”作宾语；但脚注记录另一文本传统或介词化理解所产生的异读。
- issue: 与罪人归在一起的含义
  choice: 保留为共同归属或共同结局
  alternative: 主动与罪人结交；被依法算作罪人；与罪人一同受审判
  rationale: 审判语境使共同命运很可能是言外之意，但名词性表达本身只明确联合或归在一起，故不在正文中进一步限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“咒诅”保留启示文学与审判语境的肃穆色彩；“众义人”简洁对应全体义人。“归在一起”刻意保留末句在结伴、归类和共同命运之间的含混。底本中的缺文不作臆补，以省略号和脚注公开标示。
