base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/002.yaml
  text: And his works are before him for every year that shall be[a], and all his works are subject to him and do not change; but as God has ordained[b], so everything is done.
translation:
  language: zh_hans
  text: 在将来的每一年，他的作为都在他面前[a]；他一切的作为都服从他[b]，并不改变。上帝怎样规定，一切就怎样成就。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在以后每一个年岁中”。原文所指是未来年岁的持续运行。
    reason: lexical_alternative
  - marker: b
    text: “服从他”也可译作“服事他”“顺服他”或“按他的安排运行”，强调万物遵循上帝所定的秩序。
    reason: lexical_alternative
lexical_decisions:
- source_word: ምግባሩ
  choice: 他的作为
  rationale: 该词可指行为、工作或所作之事；“作为”既保留两处重复，也适合本节所述受造秩序的语境，且不像“行为”那样容易带出道德评判。
- source_word: ቅድሜሁ
  choice: 在他面前
  rationale: 保留原文的空间与关系意象，表达一切都处于上帝面前，而不增添“监察”等原文未明说的含义。
- source_word: ለለ ዓመት ዘይከውን
  choice: 在每一个将临的年岁中
  rationale: 原短语指向未来持续展开的各个年岁；此译法在现代汉语中自然，也保留其面向未来的意味。
- source_word: ይትቀነይ ሎቱ
  choice: 都听命于他
  rationale: 该表达可涵盖服事、顺服或受其安排支配；“听命于他”兼顾人格性关系与受造秩序依从上帝安排的含义。
- source_word: ኢይትመየጥ
  choice: 并不改变
  rationale: 直陈受造秩序的稳定不变，不将其窄化为仅仅“不偏离”。
- source_word: ሠርዐ አምላክ
  choice: 上帝怎样规定
  rationale: 动词含设定、安排、制定之意；“规定”适合固定秩序的语境，又避免把语义过度收窄为口头“命令”。
- source_word: ይትገበር ኵሉ
  choice: 一切就怎样成就
  rationale: 保留概括性的被动/成事含义；“成就”比“被做”自然，同时不额外强化原文未明确表达的神学体系。
theological_decisions:
- issue: 两处第三人称所属后缀“他的作为”所指为何
  choice: 按上下文理解为上帝的作为，即受造界中由他设立的秩序与运行。
  alternative: 语法上也可能回指近处语境中的某个受造实体或天体。
  rationale: 末句明确提到上帝，而全节描述年岁、稳定秩序及对其安排的服从，因此以上帝为所指最合乎本节语境；译文不另行扩展为特定教派的护理观。
- issue: 受造秩序与上帝的关系如何表达
  choice: 译作“听命于他”，保留主动服从与有序受制两方面的张力。
  alternative: 可译作“服事他”“顺服他”或“受他支配”。
  rationale: 原词的语义范围并不只指机械性的支配，也可表示服事或顺服；正文采用兼具自然度与开放性的表达，并在脚注保留其他可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“年岁”保留古代启示文学的端庄语感；句式依照原文层层推进，但以分号和短句避免生硬。上帝的称谓统一作“上帝”。
