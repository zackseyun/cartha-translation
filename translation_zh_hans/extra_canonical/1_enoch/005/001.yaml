base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/001.yaml
  text: Observe how the trees are covered with green leaves and bear fruit[c][b][a], and understand concerning everything that the Ever-Living One has made all these things.
translation:
  language: zh_hans
  text: 你们看看树木怎样披上绿叶，结出果实；也要明白：永活者创造了这一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的吉兹语传本文字在人称和句法上有困难；按上下文及古代旁证，本句的意思是“永活者创造了这一切”。
    reason: textual_variant
lexical_decisions:
- source_word: ጠይቁ እፎ
  choice: 你们要看……怎样
  rationale: 将复数命令与表示方式的疑问成分合并为自然的汉语劝勉，保留“观察如何”的修辞作用。
- source_word: ዕፀው
  choice: 树木
  rationale: 指作为一个类别的树，现代汉语无需另加定冠表达。
- source_word: በሐመልማለ አቍጽል ይትከደኑ
  choice: 披上绿叶
  rationale: 该短语描写树木被绿色叶子覆盖；“披上”既保留衣被意象，又符合现代汉语。
- source_word: ወይፈሪዩ
  choice: 结出果实
  rationale: 准确表达树木结果，具体而自然。
- source_word: ወለበዉ በእንተ ኵሉ ወአእምሩ በከመ
  choice: 也要由这一切明白
  rationale: 按复数命令理解，劝读者从所观察的万物领悟；合并近义命令，避免汉语累赘而不改变劝诫力量。
- source_word: ገበርክሙ ለአሉንቱ ኵሎሙ
  choice: 创造了这一切
  rationale: 传本文字的人称形态困难；依据上下文及旁证表达创造者完成这一切，同时以脚注说明文本问题。
- source_word: ዘሕያው ለዓለም
  choice: 那位永活者
  rationale: 将其理解为指向上帝的称谓，即“永远活着的那一位”；不直接加入“上帝”，以免超出原文措辞。
theological_decisions:
- issue: 末尾短语是指永活者，还是泛指永远活着的生命
  choice: 那位永活者
  alternative: 永远活着的生命／活到永远者
  rationale: 语法、上下文和现有校勘判断更支持把它理解为创造万物的主体；“那位永活者”保留称谓形式，不额外导入宗派性表述。
- issue: 困难动词形式中的创造主体
  choice: 那位永活者创造了这一切
  alternative: 你们造了这一切／这一切被造
  rationale: 传本形式表面上有人称困难，但上下文要求创造者为“永活者”；正文按最可能原意翻译，并公开注明传本文字的不确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“披上绿叶”保留原文覆盖或穿戴的形象；“由这一切明白”使观察受造秩序并由此领悟的逻辑清楚。正文保留一个脚注标记，以交代真实的传本文本困难。
