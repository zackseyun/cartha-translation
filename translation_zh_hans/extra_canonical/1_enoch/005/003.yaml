  text: 你们看，海洋和河流怎样一同完成它们的工作。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርእዩ
  choice: 你们看
  rationale: 这是复数命令式；用“你们看”保留向众人发出的直接观察呼召。
- source_word: እፎ
  choice: 怎样
  rationale: 在此引出受观察之事的方式，译作“怎样”符合上下文的观察语气。
- source_word: አብሕርት
  choice: 海洋
  rationale: 此词是“海”的复数形式；现代汉语用“海洋”自然表达其集合意义，也避免误解为树木。
- source_word: ወአፍላግ
  choice: 和河流
  rationale: 此词指河流，为“河”的复数形式；与前面的海洋并列，构成水域意象。
- source_word: ኅቡረ
  choice: 一同
  rationale: 表达共同、协同进行的副词意义。
- source_word: ይፌጽሙ
  choice: 完成
  rationale: 保留使工作达到完满或终点的基本含义，不额外解释其具体方式。
- source_word: ግብሮሙ
  choice: 它们的工作
  rationale: 直译所属关系，指海洋和河流各自受造秩序中的活动；“工作”保持中性，不赋予额外道德含义。
