base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/007.yaml
  text: And for the chosen there shall be light and joy and peace[a], and they shall inherit the earth. But for you, the wicked[b], there shall be a curse.
translation:
  language: zh_hans
  text: 蒙拣选的人必有光明、喜乐与平安，他们必承受大地[a]；但你们这些恶人必受咒诅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”。吉兹语 ምድር 两义皆可；这里较广的启示文学语境支持译作“大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕሩያን
  choice: 蒙拣选的人
  rationale: 该复数词指被选择的一群人；此译自然、庄重，并保留以诺传统中的群体称谓，而不额外引入后世教义限定。
- source_word: ብርሃን
  choice: 光明
  rationale: 基本义为“光”；“光明”在现代汉语中适合与“喜乐、平安”并列，也保留祝福中的意象。
- source_word: ፍሥሐ
  choice: 喜乐
  rationale: 表达欢喜、快乐；“喜乐”简洁庄重，适合祝福语境。
- source_word: ሰላም
  choice: 平安
  rationale: 可涵盖和平、安宁与完好；“平安”是最自然且含义较宽的对应词。
- source_word: ይወርስዋ ለምድር
  choice: 他们必承受大地
  rationale: 动词含继承、取得产业之意，ምድር可指大地或土地；“承受大地”保留产业性语言与较广的末世范围。
- source_word: ረሲዓን
  choice: 恶人
  rationale: 这是对与义人或蒙拣选者相对之人的道德称谓；“恶人”准确、凝练，并保留审判语气。
- source_word: ርገመት
  choice: 咒诅
  rationale: 该名词指咒诅或受咒诅的状态；结合“为你们将有”的句式，译为“必受咒诅”符合现代汉语表达。
theological_decisions:
- issue: ምድር 的范围
  choice: 大地
  alternative: 土地
  rationale: 该词既可指土地，也可指整个大地；本书较广的宇宙性审判语境支持“大地”，但以脚注保留较窄的词义可能。
- issue: ሕሩያን 的群体称谓
  choice: 蒙拣选的人
  alternative: 选民
  rationale: “蒙拣选的人”贴近词面，并避免“选民”可能带入的特定民族或后世系统神学含义。
- issue: 首句与后句的对比结构
  choice: 首句顺承，后句用“但”转折
  alternative: 两句都用“但”
  rationale: 原文首句由普通连接词 ወ 引入，而第二部分的 ወለክሙሰ 含明确对比语气；译文据此只在后半句使用“但”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“光明、喜乐与平安”保留原文三项并列；“必承受大地”保留应许与产业意象。原文直接称呼复数的“你们”，故保留“你们这些恶人”。
