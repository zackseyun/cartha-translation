base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/004.yaml
  text: But you have not endured[a], and you have not done the command of the Lord; rather, you have transgressed and spoken proud and harsh words with your unclean mouths against his greatness. Because of the hardness of your heart[d][c][b], you will have no peace.
translation:
  language: zh_hans
  text: 但你们没有忍耐，也没有遵行主的命令；反倒背离了，以你们不洁的口说狂傲、刻薄的话，诋毁他的伟大[a]。因你们心里刚硬，必不得平安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的伟大”也可译作“他的威严”；原词指神崇高尊贵的地位，此处难以进一步确定其确切侧重。
    reason: lexical_alternative
  - marker: b
    text: 这里的“平安”不只是内心平静，也可能包括福祉、安稳和有利的结局；全句带有审判宣告的意味。
    reason: cultural_note
lexical_decisions:
- source_word: አተዓገሥክሙ
  choice: 你们没有忍耐
  rationale: 该动词表示承受、恒忍；“忍耐”既保留持续坚守的道德含义，也符合现代汉语的经文语体。
- source_word: ትእዛዘ እግዚእ
  choice: 主的命令
  rationale: 原文为单数“命令”，故不扩展为“诫命”或复数；“主”准确传达神圣称号。
- source_word: ተዓደውክሙ
  choice: 偏离正道
  rationale: 该词在这里指道德和信仰上的越界、偏离，不只是空间意义上的离开；此译法保留这一层面而不限定为某种特定教义概念。
- source_word: ሐመይክሙ
  choice: 说出……话，攻击
  rationale: 该动词可含诋毁、非议、说恶言之意；以“说出……话，攻击”在汉语中自然表达其敌对指向，避免弱化为中性的“说”。
- source_word: ዓበይተ ወድሩካተ ቃላተ
  choice: 狂傲、刻薄的话
  rationale: “狂傲”体现越分自大的言辞，“刻薄”体现言语的严厉、冒犯性；二者保持并列修饰结构。
- source_word: በአፈ ርኵሳት ዘዚአክሙ
  choice: 用你们不洁的口
  rationale: “不洁”保留该词兼具道德和礼仪污秽的传统语义，不窄化为单纯“肮脏”。
- source_word: በላዕለ ዕበዩ ዚአሁ
  choice: 攻击他的伟大
  rationale: 介词短语表示言语针对神的伟大；“伟大”是对原词最直接的表达，同时保留可理解为“威严”的余地。
- source_word: ይቡሳነ ልብ
  choice: 你们心里刚硬
  rationale: 保留圣经语汇中顽梗、道德麻木的意象，同时比生硬的名词短语更符合现代汉语。
- source_word: ኢትከውኑክሙ ሰላም
  choice: 必不得平安
  rationale: 这是审判性的宣告；“平安”可兼指安宁、福祉和有利结局，保留原文的宽广含义。
theological_decisions:
- issue: 末句的“平安”是内心安宁还是审判语境中的整体福祉
  choice: 必不得平安
  alternative: 你们必无福祉
  rationale: 保留“平安”可同时涵盖内在安宁、整体福祉及审判中的有利结局，不把原文的神学张力缩减为单一意思。
- issue: “他的伟大”是否应具体化为“他的威严”或“他的荣耀”
  choice: 他的伟大
  alternative: 他的威严
  rationale: 原词首先表达崇高、伟大；直译为“伟大”不额外引入“荣耀”等更专门的神学术语，并以脚注说明可能的语义色彩。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句式保留原文从“不忍耐、不遵命”转向“偏离、恶言”，最后落在审判宣告上的递进；避免文言化，也不引入特定宗派术语。
