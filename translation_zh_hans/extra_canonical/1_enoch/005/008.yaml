base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/008.yaml
  text: And then wisdom will be given to the chosen[a], and all these will live and will not again sin, whether through ungodliness or through pride[b]; but those who possess wisdom will be humble.
translation:
  language: zh_hans
  text: 那时，智慧必赐给蒙拣选的人[a]；他们都必存活，不再犯罪，也不再有不敬虔或骄傲的行为；那些有智慧的人却必谦卑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“选民”。
    reason: lexical_alternative
  - marker: b
    text: 末句也可理解为：“他们必谦卑，因为智慧属于他们。”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: እሜሃ
  choice: 那时
  rationale: 表示承接前文事件的时间推进；“那时”自然地保留启示文学中的将来次序。
- source_word: ይትወሀቦሙ
  choice: 必赐给
  rationale: 保留被动与将来意味，表明智慧是领受的恩赐，并非自行获得。
- source_word: ለሕሩያን
  choice: 蒙拣选的人
  rationale: 表达被选择的群体，同时避免仅用“选民”可能带入的后期体系性含义。
- source_word: ጥበብ
  choice: 智慧
  rationale: 在此指引向正直生活的道德与属灵智慧，而非技术性才能。
- source_word: ኵሎሙ እሉንቱ
  choice: 他们都
  rationale: 按汉语自然表达承接刚提到的群体，也保留全体范围。
- source_word: የሐይዉ
  choice: 必存活
  rationale: 保留原文简明的“活”之意；不擅自限定为永生或仅仅幸存。
- source_word: ወኢይደግሙ አብሶ
  choice: 不再……犯罪
  rationale: 准确表达否定、再次与犯罪三个要素，保留其终止既往罪行的强烈语气。
- source_word: እበረሲዕ
  choice: 因不敬虔
  rationale: 兼顾宗教与道德层面的悖逆，比泛称“邪恶”更贴近词义。
- source_word: እበኅዕቢት
  choice: 或骄傲
  rationale: 简洁表达傲慢的性情，并与后文“谦卑”形成明确对照。
- source_word: አላ
  choice: 却
  rationale: 标明从不敬虔、骄傲转向智慧与谦卑的强烈对比。
- source_word: ይገንዩ
  choice: 必谦卑
  rationale: 表达与骄傲相反的低微、谦逊状态，现代汉语自然庄重。
- source_word: ዘቦሙ ጥበበ
  choice: 有智慧的人
  rationale: 按相对结构理解为“拥有智慧者”，并保留智慧与谦卑之间的联系。
theological_decisions:
- issue: ሕሩያን 的群体称谓
  choice: 蒙拣选的人
  alternative: 选民
  rationale: 经文确实指被拣选的群体，但“蒙拣选的人”更透明，也较少引入后来的系统神学负载。
- issue: 领受智慧之后的道德转变
  choice: 保留“不再……犯罪”的广义陈述，并随后列出不敬虔与骄傲
  alternative: 将其收窄为只是不再犯不敬虔与骄傲这两类罪
  rationale: 原文先作概括性陈述，再以两个名词说明相关罪恶；译文不把其绝对语气弱化，也不额外解释其实现方式。
- issue: 末句的句法关系
  choice: 有智慧的人却必谦卑
  alternative: 他们必谦卑，因为智慧属于他们
  rationale: 相对结构可指“拥有智慧的人”，但也可能带有因智慧而谦卑的关系；正文采用较直接的群体描述，脚注保留另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“必”体现预言性的将来语气；避免生硬直译，也不把“存活”扩展解释为特定的末世生命观。
