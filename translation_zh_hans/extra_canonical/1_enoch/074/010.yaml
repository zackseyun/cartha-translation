base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/010.yaml
  text: And five days are added[a], and for the sun it reaches thirty days; and all the days that accrue to it for one of those five years, when completed[c][b], amount to three hundred and sixty-four days.
translation:
  language: zh_hans
  text: 又加上五天[a]，太阳的日数便达到三十天；这样，在那五年中的每一年结束时，归于该年的全部日数共计三百六十四天。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处埃塞俄比亚文传本字面形式可读作“五年”，但句法颇为拗口；按上下文和全年的三百六十四日总数，这里应是为年度计算补上的“五天”。
    reason: textual_variant
  - marker: b
    text: 参看《天文书》整体的历法安排：一年按三百六十四天计算，而不是采用纯粹的阴历年。
    reason: cross_reference
  - marker: c
    text: 本句的数字和语法可能在传抄或转写中受损。较直译的另一种译法是：“又加上五天，太阳便达到三十天；在那五年中的一年完成时，归于该年的全部日数共计三百六十四天。”
    reason: previous_rendering
lexical_decisions:
- source_word: ይትዌሰክ፡ ኃምስቱ፡ ዓመት
  choice: 又加上五天
  rationale: 传本字面含“年”的形式，但经文的历法语境和三百六十四日的总数表明，此处所指是补足计算的五天。正文采用语境所要求的意义，并以脚注说明文本困难。
- source_word: ለፀሐይ፡ ሠላሳ፡ መዋዕለ
  choice: 太阳的日数便达到三十天
  rationale: 保留“太阳”这一观测框架，并把“达到三十日”译成自然的现代汉语；原句具体所指略显含混。
- source_word: ኵሎሙ፡ መዋዕለ፡ ይበጽሕዎ፡ ለዓመት
  choice: 归于该年的全部日数共计
  rationale: ይበጽሕ表达达到、合计之意；“共计”准确传达数值汇总，同时保留日数归于一年的关系。
- source_word: ፭እምእሉኩ፡ ፭ዓመት፡ ተመሊኦሙ
  choice: 在那五年中的每一年结束时
  rationale: 现有转写疑有数字识读问题；校勘说明支持“那五年中的一年”。结合动词“完成、满了”，译为每一年结束时，使多年度框架和年度总数之间的关系清楚，但在脚注保留不确定性。
- source_word: ፻፷ወ፰ወረቡዐ፡ መዋዕለ
  choice: 三百六十四天
  rationale: 该数值明确，也是本段历法体系的核心年度总数。
theological_decisions:
- issue: 所加的“五”究竟指五天还是五年
  choice: 正文译作“五天”，视为使一年达到三百六十四天的补充日
  alternative: 严格依现存转写译作“五年”，理解为五年同步周期
  rationale: 原文传抄或转写在此明显困难。紧接的年度总数要求五个补充日，但后半句又似保留五年周期。正文按历法语境译“五天”，并在脚注明示字面形式与另一可能，避免掩盖真实歧义。
- issue: 五年周期与三百六十四日年度总数的关系
  choice: 理解为五年周期中的每一年完成时，各有三百六十四天
  alternative: 理解为五年全部完成后总计三百六十四天
  rationale: 三百六十四天显然是年总数，不可能是五年总和；因此将“完成”联系到五年中的一个年度，同时以脚注交代数字文本可能有误。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文尽量保留原文的太阳历框架和五年周期，不使用“闰余日”等偏专业术语；文本歧义与疑似数字讹误放入脚注说明。
