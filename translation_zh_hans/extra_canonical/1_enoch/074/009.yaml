  text: 'Thus I saw their workings: how the moon rises and the sun sets in those days[a][b].'
translation:
  language: zh_hans
  text: 于是我看见了它们的运行：在那些日子，月亮如何升起，太阳如何落下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከመዝ
  choice: 就这样
  rationale: 承接前文并引出异象中的观察，兼顾总结性和自然的现代汉语表达。
- source_word: ርኢኩ
  choice: 我看见
  rationale: 直接表达第一人称异象经验，不额外强化为“观看”或“目睹”。
- source_word: ምግባሮሙ
  choice: 它们的运行
  rationale: 此处语境涉及天体规律；“运行”比泛指行为的“作为”更准确，也自然涵盖月亮升起和太阳落下。
- source_word: በከመ
  choice: 怎样
  rationale: 引出所观察到的具体运行方式，保留原文解释性的结构。
- source_word: ይሠርቅ
  choice: 升起
  rationale: 这里是表示天体升起的 ሠረቀ，而不是表示偷窃的近形动词；与后句太阳“落下”构成清楚的平行。
- source_word: አውራኅ
  choice: 月亮
  rationale: 该词是“月亮／月份”的复数形式；在天文语境及与太阳的对举中指月亮。汉语以集合性单数“月亮”表达更自然。
- source_word: የዓርብ
  choice: 落下
  rationale: 表示太阳西沉；“落下”保留动作的具体性，且与“升起”平行。
- source_word: ፀሐይ
  choice: 太阳
  rationale: 该词直接指太阳。
- source_word: በእማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留原文时间指示，也符合以诺文献反复出现的庄重叙事措辞。
