base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/007.yaml
  text: And when the sun goes out from the fourth gate[a], it goes out for seven days, until it goes out from the fifth; and again it returns for seven days through the fourth gate, and completes all its light[c][b], and it withdraws and enters through the first gate for eight days.
translation:
  language: zh_hans
  text: 太阳从第四道门出来，为期七天，直到它从第五处[a]出来；随后，它又经第四道门返回，为期七天[c]，完成其全部的光[b]；它便退去，经第一道门进入，为期八天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“第五”之后没有再次明说“门”；按上下文，所指几乎肯定是“第五道门”。
    reason: lexical_alternative
  - marker: b
    text: “完成其全部的光”贴近吉兹语的表达，可能是说太阳在这个运行阶段达到其光的完整份量。
    reason: cultural_note
  - marker: c
    text: “经第四道门”也可译作“在第四道门中”或“向第四道门返回”；这里的介词可表达位置、途径或方向，本译文依本段太阳穿行各门的图景取“经”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ፀሐይ
  choice: 太阳
  rationale: 在《天文书》的语境中明确指作为天体的太阳，现代汉语无需另加限定。
- source_word: ይወፅእ
  choice: 出来
  rationale: 保留原文反复出现的运动用语，并与后文“进入”形成对应。
- source_word: እምራብዕት ኆኅት
  choice: 从第四道门
  rationale: ኆኅት表示门、入口；直译为“门”可保留本段具体的宇宙构造意象。
- source_word: ሰቡዐ መዋዕለ
  choice: 连续七天
  rationale: 表达太阳在这一阶段持续七日的时间长度；“连续”使现代汉语的周期叙述更清楚。
- source_word: እስከ ይወፅእ እምነ ኃምስት
  choice: 直到从第五处出来
  rationale: 原文在“第五”之后没有明说“门”；正文保留这一省略，并用脚注说明其所指几乎肯定是第五道门。
- source_word: ካዕበ
  choice: 又
  rationale: 简洁标示太阳运行方向的再次转换。
- source_word: ይገብእ
  choice: 返回
  rationale: 在循环运行的上下文中表示回转、归返，比泛泛的“去”或“来”更准确。
- source_word: በኆኅት ራብዕ
  choice: 经过第四道门
  rationale: 介词በ可表示在、借着或经过；结合天体穿行门户的图景，译为“经过”既自然，也不误作单纯抵达该门。
- source_word: ይፌጽም ኵሎ ብርሃኖ
  choice: 使自己的光达到完全
  rationale: 尽量保留“完成其全部光”的独特表达，同时以现代汉语传达光达到完整程度之意，不进一步解释其天文学机制。
- source_word: ይደንን
  choice: 退去
  rationale: 符合光完成之后、进入另一道门之前的退隐运动，同时避免过度确定为“隐藏”或“落下”。
- source_word: ይበውእ በቀዳሚት ኆኅት
  choice: 从第一道门进入
  rationale: 与前面的“从……门出来”相对应，并保留门户意象。
- source_word: ስሙነ መዋዕለ
  choice: 连续八天
  rationale: 表示最后这一阶段历时八日；补出“连续”符合汉语的周期叙述。
theological_decisions:
- issue: 太阳穿行宇宙门户的意象
  choice: 保留字面的“门”及太阳出入、返回的运动描写
  alternative: 译作“入口”“方位”，或改写为现代天文学中的地平线位置
  rationale: 本段以具体门户描绘启示文学中的宇宙秩序。照原文保留这一图景，既不将其现代化，也不额外赋予宗派性解释。
- issue: “使自己的光达到完全”的含义
  choice: 保留原文较为技术性且含蓄的说法
  alternative: 明确释为“达到最强亮度”或“完成其发光周期”
  rationale: 原文可指此阶段中光的份量达到完全，但没有明确说明其物理机制；正文不消除这一含混性，脚注仅提示可能含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文反复的“出来”“进入”和具体的“门”意象，以呈现其程式化天文叙述；在不改写宇宙观的前提下，用“连续七天／八天”使时间关系自然明确。
