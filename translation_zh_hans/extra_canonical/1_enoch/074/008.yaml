  text: And again[a], it returns for seven days to the fourth gate[c][b], from which the sun comes out.
translation:
  language: zh_hans
  text: 它又回到第四道门，历时七天[a]；太阳从这道门出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的介词短语也可译为“在第四道门”或“经由第四道门”；其确切空间关系可有不同理解。本译文译为“回到第四道门”，未将其限定为“穿过”该门。
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: 又
  rationale: 表示这一连串天体运行中的再次或继续，保留原文反复叙述的风格。
- source_word: ይገብእ
  choice: 回到
  rationale: 按此处词形及太阳周期运行的语境，取“返回、回去”之义，不采用“进入”。
- source_word: ሰቡዐ መዋዕለ
  choice: 历时七天
  rationale: 明确表达持续七天，同时保持历法叙述的精确性。
- source_word: በራብዕት ኆኅት
  choice: 到第四道门
  rationale: 介词短语在这里可表示与第四道门相关的趋向或位置；译作“到”与“回到”自然衔接，也避免断定必然是穿门而过。
- source_word: እንተ እምኔሃ
  choice: 就是从这道门
  rationale: 关系表达回指刚提到的第四道门；汉语重复“这道门”比直译关系代词更清楚。
- source_word: ይወፅእ ፀሐይ
  choice: 太阳……出来
  rationale: 保留太阳从天门出来的具体空间意象，语言自然直白。
