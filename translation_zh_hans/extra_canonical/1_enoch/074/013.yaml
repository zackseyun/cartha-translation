base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/013.yaml
  text: For three years there are one thousand ninety-two days[a], and for five years, one thousand eight hundred twenty days and eight; thus for eight years there are two thousand nine hundred twelve days, and ten and two days.
translation:
  language: zh_hans
  text: 三年共有一千零九十二日[a]；五年共有一千八百二十日，另加八日；这样，八年共有二千九百一十二日，以及十日和二日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一吉兹文本行的数字关系较难确定，且所据文本由OCR转录恢复。本节似乎在合计三年、五年和八年的日数，但末尾可能保存了拆分的数字，或次序不顺的表述。若作顺畅处理，可译为：“三年一千零九十二日；五年一千八百二十八日；这样，八年二千九百一十二日。”
    reason: textual_variant
lexical_decisions:
- source_word: ለ፫ዓም
  choice: 三年共有
  rationale: 介词ለ与时间词组在本段天文历算语境中表示相应年数的合计；译为“三年共有”符合现代汉语计算表达。
- source_word: መዋዕለ
  choice: 日
  rationale: መዋዕል在此是历法计算中的日数单位。
- source_word: ፲፻ወ፺ወክልኤ
  choice: 一千零九十二
  rationale: 按吉兹数字的加合结构理解为1000＋90＋2。
- source_word: ወለ፭ዓመት
  choice: 五年共有
  rationale: 延续前一分句按年数计算总日数的结构。
- source_word: ፲ወ፰፻፳መዋዕለ፡ ወ፰
  choice: 一千八百二十日，另加八日
  rationale: 底本文字把“日”置于末尾的“和八”之前。译文保留这种拆分的加合表达，不暗中整合为“一千八百二十八日”。
- source_word: ከመ፡ ይኩን
  choice: 这样……共有
  rationale: 在上下文中引出前述计算所得的结果，而非表示目的。
- source_word: ለ፰ዓመት
  choice: 八年共有
  rationale: 与三年、五年的时间跨度总数保持一致。
- source_word: ፪ወ፱፻፲፪
  choice: 二千九百一十二
  rationale: 按加合数字读为2000＋900＋12。
- source_word: ወዓሡር፡ ወስኑይ፡ መዋዕለ
  choice: 以及十日和二日
  rationale: 原文似乎把最后的十二再次拆开表述。尽管数值关系显得费解，仍保留其显式加合形式，以呈现现存文本的困难。
theological_decisions:
- issue: 基于OCR恢复的吉兹文本中历法算术的疑难
  choice: 保留三年、五年和八年的日数序列，并保留末尾拆分、重复般的数字措辞，不将其默默整理成顺畅的现代算式。
  alternative: 将全句规范化为“三年1092日，五年1828日，因此八年2912日”，并删除末尾“十日和二日”。
  rationale: 此处并非教义争点，而是文本透明度问题。《天文书》的数字本应精确；现有吉兹文行文与算术关系存在困难，因此译文应让读者看见问题，而不是以推测性的校订掩盖它。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“共有”明确历算关系；“另加”“以及”既使中文可读，又保留原文数字拆分的突兀感。脚注标记[a]已置于正文相应位置。
