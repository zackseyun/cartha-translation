base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/014.yaml
  text: As for the moon alone[c][b][a], its days come to one thousand and sixty-two days for three years and for five years.
translation:
  language: zh_hans
  text: 单就月亮而言[c]，它三年的日数共计一千零六十二天[b]，以及五年的……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据吉兹文在“以及五年的”之后似乎残缺；这一行可能遗漏了数字或其他文字。
    reason: textual_variant
  - marker: b
    text: 本节属于《天文书》的历法计算；“日数共计”指累计的日数达到这一总额。
    reason: cultural_note
  - marker: c
    text: ወርኅ 也可译作“月份”。若按这一词义，本句开头可译为：“就单独一个月份而言”。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ለወርኅ
  choice: 就月亮而言
  rationale: ወርኅ 可指“月”或“月份”；此处一千零六十二天正好相当于三个各三百五十四天的阴历年，天文历法语境更支持“月亮”。
- source_word: ለባሕቲቱ
  choice: 单就……而言
  rationale: 保留“单独、仅就其本身”的限制意味，同时使现代汉语表达自然。
- source_word: ይበጽሕ
  choice: 共计
  rationale: 该动词在数字计算中表示“达到、合计为”；“共计”准确传达数量总和。
- source_word: መዋዕሊሁ
  choice: 它……的日数
  rationale: 该词为“日子”的复数形式，并带第三人称单数所属后缀；此处指月亮在所述年限内累计的日数。
- source_word: ለ፫ዓም
  choice: 三年的
  rationale: 按历法计算关系译为“三年的”，与后面的日数总额顺畅衔接。
- source_word: ፲፻ ወ፷ወ፪ መዋዕለ
  choice: 一千零六十二天
  rationale: 吉兹数字依次表示一千、六十和二，后接“天”，故总数为一千零六十二天。
- source_word: ወለ፭ ዓም
  choice: 五年的则……
  rationale: 现存行文只有“以及五年的”，未见相应总数；用省略号公开呈现残缺，不擅自补入数字。
theological_decisions:
- issue: 天文历法陈述的末句似有残缺或讹误
  choice: 正文保留“五年的”这一残句，并以省略号标明其未完
  alternative: 据其他版本校补五年对应的日数，或将句子润饰成完整的一般性历法陈述
  rationale: 所给吉兹文见证未保存五年所对应的数值。与其作无依据的补足，不如透明保留文本状态；这里不存在需要借教义消解的困难。
- issue: ወርኅ 应译“月亮”还是“月份”
  choice: 月亮
  alternative: 月份
  rationale: 该段讨论月体运行及其历法日数，而一千零六十二天等于三个三百五十四天的阴历年，因此“月亮”最符合上下文；脚注仍保留词义上的另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“单就……而言”保留原文的限制语气；以中文数字书写总数。末尾省略号不是对缺文的猜补，而是直观标示现存句意未完，并由脚注说明。
