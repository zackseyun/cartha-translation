  text: And in certain months it changes its settings[a], and in certain months it travels its course[d][c][b], one by one.
translation:
  language: zh_hans
  text: 在某些月份，它变换自己的落处[a]；在某些月份，它沿着自己的路线运行，一个接一个地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “落处”也可译作“落点”或“落下之处”。原词为复数；在本段天文语境中，可能指天体在不同月份落下之处的变化。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“一，一”，可能表示各个位置、路线或阶段依次分别进行；所指对象并不完全明确。
    reason: textual_ambiguity
lexical_decisions:
- source_word: አውራኅ
  choice: 月份
  rationale: 此词在这里是“月”的复数，并与介词构成“在……月份”的时间短语；不采用旧释“路径”。
- source_word: እመራት
  choice: 某些
  rationale: 与“月份”连用，表示若干特定或指定的月份；译作“某些”最符合现代汉语。
- source_word: ይዌልጥ
  choice: 变换
  rationale: 该动词表示改变、变换，而不是下降；用“变换”保留主动改变位置的动态含义。
- source_word: ምዕራባተ
  choice: 西落的位置
  rationale: 这是与西落、落下相关的复数名词，在天文语境中指不同的落点或落下方位；“西落的位置”比单译“落下”更清楚，同时不把它误作副词“向西”。
- source_word: የሐውር
  choice: 行进
  rationale: 保留一般性的有序运动含义，不额外指定运动主体或方式。
- source_word: ምሕዋሪሁ
  choice: 自己的运行路线
  rationale: 该词在本段天文语境中指天体循行的路线或行程；“运行路线”自然且保留固定轨迹的意象。
- source_word: አሐዱ አሐዱ
  choice: 逐一如此
  rationale: 原文重复“一”，具有逐项、依次的分配意味；汉语用“逐一”表达，并以“如此”使句末自然，同时保留所逐指对象并不完全明确的张力。
