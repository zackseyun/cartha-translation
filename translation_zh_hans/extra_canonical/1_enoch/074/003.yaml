base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/003.yaml
  text: In fifteen parts it completes all its light in the east[b][a], and in fifteen parts it completes all its darkness in the west.
translation:
  language: zh_hans
  text: 它在东方以十五份完成全部的光[a]；又在西方以十五份完成全部的黑暗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有转录中的数字似有OCR讹误；按本章月相以十四或十五份计算的上下文，此处应为“十五份”，而非“五十七天”或“六十七份”。后半句重复同一数目。
    reason: textual_variant
lexical_decisions:
- source_word: በ፭*፷፯ እደ
  choice: 分十五份
  rationale: 现存转录的数字看来受OCR讹误影响；本章月相按十四或十五份计算，እደ在此指“份、部分”（本义“手”），不是“日”。译文依上下文所支持的“十五份”，并以脚注说明文本问题。
- source_word: ይፌጽም
  choice: 完成
  rationale: 该动词在句中宜按主动完成式理解；两小句保持相同措辞，以保存原文公式化的平行结构。
- source_word: ኵሎ ብርሃኖ
  choice: 它全部的光
  rationale: 保留ኵሎ的整体性及ብርሃኖ所带的第三人称所属关系。
- source_word: በሠርቅ
  choice: 在东方
  rationale: 按方位处所义翻译，与下句“在西方”形成对称。
- source_word: ኵሎ ጽልመተ
  choice: 它全部的黑暗
  rationale: 直译为“黑暗”，保存原文光与暗的鲜明对举，不释义为月相的增亏。
- source_word: በምዕራብ
  choice: 在西方
  rationale: 按处所义翻译，并保留东西方向的平行结构。
theological_decisions:
- issue: 是否把完成光明与黑暗的公式释义为月亮达到满月或完全亏缺
  choice: 保留“完成它全部的光／黑暗”的意象
  alternative: 在东方达到最明亮／在西方完全变暗
  rationale: 释义虽可能使天文现象更易懂，却超出吉兹语见证，并会削弱本段程式化、度量式的启示文学语言。
- issue: 数字和计量单位的讹误
  choice: 正文采用“十五份”，并加文本脚注
  alternative: 按现有OCR字面译作“六十七份”或旧译“五十七天”
  rationale: 月相上下文及最新校勘判断共同支持፲፭“十五”和እደ“份”；但由于所给底本转录置信度仅为中等，仍明确披露文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留两小句严格对称的结构和“光／黑暗”的具体意象；不把天文公式过度解释为特定月相术语。
