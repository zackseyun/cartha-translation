base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/005.yaml
  text: For two months it sets with the sun in these two middle portals[c][b][a], in the third and in the fourth portal.
translation:
  language: zh_hans
  text: 它连续两个月与太阳一同落下，经过这两道中间的门，即第三门和第四门。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门”也可译作“门户”或“开口”。原文所说的两道中间的门，随后具体说明为第三门和第四门。
    reason: lexical_alternative
lexical_decisions:
- source_word: በክልኤ ወርኅ
  choice: 有两个月
  rationale: ክልኤ 是基数“两”，不是序数“第二”；介词 በ 在这里表达持续时段，故译为“有两个月”。
- source_word: የዓርብ
  choice: 它……落下
  rationale: 这是动词 ዐረበ“落下、落（日）”的未完成式第三人称阳性单数，并非“第四日”。主语依上下文所指的月亮，以“它”保留原句的代词式衔接。
- source_word: ምስለ ፀሐይ
  choice: 与太阳一同
  rationale: ምስለ 表示“与、同”；此处描述天体运行相伴，译作“与太阳一同”自然且不扩大含义。
- source_word: በእሉ ክልኤ ኆዋኅው እለ ማእከል
  choice: 经过这两个中央的门
  rationale: በ 可按运行路径译为“经过”；ኆዋኅው 是“门”的复数，እለ ማእከል 指其位于中央。
- source_word: በሣልስት ወበራብዕት ኆኅት
  choice: 就是第三门和第四门
  rationale: 两个序数明确标示编号之门；“就是”呈现后置同位说明，使中文关系清楚，同时不另添天文学解释。
theological_decisions:
- issue: 天上开口的性质
  choice: 保留具体的“门”这一宇宙建筑意象
  alternative: 开口；门户
  rationale: ኆኅት/ኆዋኅው 的基本意义是门或门户。保留启示文学的具体意象，不将其抽象化为现代天文学术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“落下”保留原文动词及其与太阳共同运行的表达；“它”按上下文承接月亮，但不在本节中擅自补明名词。
