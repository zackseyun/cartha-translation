base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/006.yaml
  text: For seven days it goes out and turns about[a], and it returns again through the gate from which the sun goes out; and it completes all its light, and it withdraws from the sun[d][c][b], and it enters for eight days through the sixth gate from which the sun goes out.
translation:
  language: zh_hans
  text: 它出去并绕行七天，又从太阳出去的那道门回来；它使自己的全部光辉达到圆满，又离开太阳，并经由太阳出去的第六道门进入，历时八天。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的主语没有明说；按上下文很可能是月亮，因此正文仍用“它”，不直接补出“月亮”。
    reason: alternative_reading
  - marker: b
    text: “使自己的全部光辉达到圆满”对应原文较技术性的“完成全部的光”。这可能指该天体的光达到完整的程度，但原文并未明确说“满月”。
    reason: cultural_note
lexical_decisions:
- source_word: ይወፅእ
  choice: 出去
  rationale: 这是表示向外运动的基本动词；译作“出去”与本节反复出现的天体运行表述一致，不额外推定运动主体。
- source_word: ሰብዓተ መዋዕለ
  choice: 七天
  rationale: 作时间长度理解；现代汉语无需另加介词，也能自然表达持续时间。
- source_word: የአውድ
  choice: 环行一周
  rationale: 该动词表示绕行、转一圈；此译法保留天体运行的动态意象。
- source_word: ይገብእ ካዕበ
  choice: 又……回来
  rationale: 结合“又”及出去、绕行、再入的次序，译为“回来”最符合此处运动轨迹。
- source_word: በኆኅት
  choice: 从……门
  rationale: ኆኅት 指门或门户；“门”既准确，也符合《天文书》中天体出入门户的宇宙图景。
- source_word: ወይፌጽም ኵሎ ብርሃኖ
  choice: 它使自己的光完全
  rationale: 贴近“完成其全部的光”的过程性措辞，避免直接解释成“满月”或“达到最大亮度”。
- source_word: ወይፀንን እምፀሐይ
  choice: 又离开太阳
  rationale: 原语表达与太阳分离或移开的动作；“离开”自然且不强加具体天文学解释。
- source_word: ስሙነ መዋዕለ
  choice: 八天
  rationale: 与前面的“七天”同样按持续时间处理。
- source_word: በሳድስት ኆኅት
  choice: 从……第六道门
  rationale: 保留门户编号体系，并与本节前一处 ኆኅት 的译法一致。
theological_decisions:
- issue: 运动主体的身份
  choice: 正文使用“它”，不明说是月亮。
  alternative: 根据上下文补作“月亮”。
  rationale: 上下文很可能指月亮，但本节连续使用第三人称动词，未重述名词；保留代词可忠实呈现原文的隐含主语与歧义。
- issue: “使自己的光完全”的含义
  choice: 保留原文较技术性而未充分解释的表达。
  alternative: 解释为“达到满月”或“发出全部光辉”。
  rationale: 该句可能描述光达到完整程度，但原文没有明确说“满月”；不在正文中消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号保留原文连续天体运动步骤；“门”用于呈现以编号门户描述日月运行的宇宙图景。
