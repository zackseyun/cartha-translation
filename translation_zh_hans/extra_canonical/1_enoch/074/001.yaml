base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/001.yaml
  text: 'And I saw for it another course and regulation: by that regulation it makes its course of the months[a][b][c].'
translation:
  language: zh_hans
  text: 我看见它另有一条运行路径和一项定规[a]；它按照那定规进行月度的运行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定规”也可译作“规定”“法令”或“命令”；原词可指具有权威性的规定或安排。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“它的各月之运行”。此处也可理解为“它每月的循环”；“月”的复数与月亮的周期密切相关。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ካልአ
  choice: 另有一条／一项
  rationale: 表示在先前所述之外又有一个项目；按汉语中“轨道”和“定规”各自搭配量词，使句子自然。
- source_word: ምሕዋረ
  choice: 运行轨道／运行
  rationale: 该词指有秩序的行程、路径或循环；在天文语境中，“运行轨道”保留其宇宙运行的技术意味，同时避免套用过度现代化的术语。后一次出现时译作“运行”，以符合汉语表达。
- source_word: ትእዛዘ
  choice: 定规
  rationale: 这里不是一般的口头命令，而是支配天体运行的固定安排；“定规”既保留权威性，也适合宇宙秩序的语境。
- source_word: ርኢኩ
  choice: 我又看见
  rationale: 保留异象叙述中第一人称观察的表达；“又”承接ካልአ所表示的新增项目。
- source_word: ሎቱ
  choice: 它
  rationale: 指向上文所述的天体或宇宙对象。中文以“它另有”自然表达原文“为它／属于它”的关系，同时不擅自明确具体所指。
- source_word: በውእቱ ትእዛዝ
  choice: 按照那定规
  rationale: 介词短语表示运行所遵循的支配准则；“按照”比工具性的“借着”更符合现代汉语。
- source_word: ይገብር
  choice: 完成
  rationale: 保留“实行、作成”的主动语义，表达该对象依定规进行其运行，而不弱化成单纯的状态动词。
- source_word: ምሕዋሮ ዘአውራኅ
  choice: 完成各月的运行
  rationale: አውራኅ是“月”的复数，并非“风”；该短语可直理解为“它的各月之运行”，中文译文以“各月的运行”表达，并在脚注中保留“每月循环”的可能理解。
theological_decisions:
- issue: 宇宙秩序用语的性质
  choice: 将ትእዛዝ译为支配天体运行的“定规”
  alternative: 译作直接向天体发出的“命令”，或较抽象的“秩序”
  rationale: 上下文描述受固定法则支配的宇宙运行。“定规”既不把它简化为道德命令，也不排除其背后的权威性，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“定规”和“运行”的重复，以反映原文有意强调受规定支配的周期运动；对代词“它”不作超出本节的具体化。
