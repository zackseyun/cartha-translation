base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/011.yaml
  text: And their excess for the sun and the stars comes to six days[a]; in five years, at six each, it amounts for them to thirty days[c][b], and the moon falls behind the sun and the stars by thirty days.
translation:
  language: zh_hans
  text: 太阳和众星所多出的天数为六天[a]；五年中，每年六天，合计为三十天[b]。月亮的历算比太阳和众星少三十天[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的历算表达十分简略。这里的意思看来是：太阳和众星每年比月亮的计算多出六天。
    reason: cultural_note
  - marker: b
    text: 原文直译近于：“五年中，各按六，给它们达到三十天。”译文按六乘五的计算关系表达。
    reason: textual_clarity
  - marker: c
    text: 译作“月亮”的吉兹语词也可指“月份”；在历法语境中，两种含义彼此关联。
    reason: lexical_alternative
lexical_decisions:
- source_word: ምብጻሒሆሙ
  choice: 超出量
  rationale: 该词源于“到达、达到、完成”的词根；在这里指太阳和众星相对于月亮历法所累积的额外天数。译作“超出量”既符合上下文中的历算含义，也避免将其误解为天体运行的终点。
- source_word: ስሱ
  choice: 六
  rationale: 基数词“六”，在本节的计算中重复出现。
- source_word: መዋዕለ
  choice: 天
  rationale: 该词为“日、天”的复数形式；本节以天数计算历法差额。
- source_word: በበስሱ
  choice: 每年六天
  rationale: 原文是带分配意味的“各按六”；结合前面的“五年”，自然理解为五年中每年六天。译文补出“每年”，使计算关系清楚，同时以脚注保留原文的压缩表达。
- source_word: ይበጽሖሙ
  choice: 合计达到
  rationale: 仍源于“到达、达到”的词根；此处表示每次六天的数额累积至三十天。
- source_word: የሐፀፁ
  choice: 少
  rationale: 该动词表示“短少、不足、少于”，不是“被拿走”。“比……少”准确表达月亮相对于太阳和众星少三十天。
- source_word: ወርኅ
  choice: 月亮
  rationale: 该词既可指“月亮”，也可指“月份”。上下文将其与太阳和众星并列对比，因此正文采用“月亮”，并在脚注注明另一可能。
theological_decisions:
- issue: 本节的天文历算句法高度压缩，计算关系可能显得含混
  choice: 将分配结构译为“五年之内，每年六天，合计达到三十天”，同时用脚注说明原文措辞
  alternative: 逐词译作“五年中，各按六，给它们达到三十天”，或不明确说明每年的累积关系
  rationale: 原文的“五年”“各按六”“三十天”共同构成六乘五的计算。正文适度明示这一关系，有助于现代读者理解；脚注则保留原文的压缩性，避免把解释冒充毫无歧义的字面形式。
- issue: 月亮与太阳、众星之间三十天差额的性质
  choice: 译作“月亮比太阳和众星少三十天”
  alternative: 译作“三十天从太阳和众星中被扣除，归于月亮”
  rationale: 原文动词的基本意义是“短少、不足”，故表达比较差额，而不引入“扣除”或“转归”的额外观念。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“超出量”“合计达到”保留天文历算语气；以分号呈现六天与五年累计三十天之间的关系。避免使用过度技术化的现代历法术语，也不将古代天文陈述改写成现代科学解释。
