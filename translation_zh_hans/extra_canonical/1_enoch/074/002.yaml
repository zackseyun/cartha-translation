base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/002.yaml
  text: And all that Uriel[a], the holy angel who is their leader, showed me—I wrote down their positions as he showed them to me, and I wrote down their paths as they are[e][d][c][b], and I saw their lights until fifteen days were completed.
translation:
  language: zh_hans
  text: 圣天使乌列——就是统领它们的那一位——向我所展示的一切，我都记下来了：我照他向我展示的记下它们的位置，也按它们实际的情形记下它们的路径，并记下它们光辉的显现，直到十五天期满。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末尾的句法较为紧缩；“直到十五天期满”与“它们光辉的显现”之间的具体关系未明，可能指这种显现延续到十五天期满，或指对其所作的记录涵盖至该时段期满。
    reason: 保留原文时间短语的句法附着范围及语义关系的含混性。
lexical_decisions:
- source_word: ኵሎዘ
  choice: 凡……的……都
  rationale: 保留关系结构所表达的整体范围，同时使中文句法自然。
- source_word: አርአየኒ
  choice: 向我展示
  rationale: 该使役动词具有使人看见、展示之意；避免用“启示”增添原文未必明示的神学色彩。
- source_word: መልአክ ቅዱስ
  choice: 圣天使
  rationale: 采用现代中文宗教文献中自然、庄重的对应表达。
- source_word: መራሒሆሙ
  choice: 统领它们的那一位
  rationale: 表达引导或主管之意，并保留复数代词所指对象未明说的特点。
- source_word: ምንባሪሆሙ
  choice: 它们的位置
  rationale: 在天文语境中指各天体所处的规定位置；“位置”比“居所”更清楚，也不过度技术化。
- source_word: አውራኂሆሙ
  choice: 它们的月份
  rationale: 此词形宜按“月”的复数及领属后缀理解，而非改作“路径”；译为“月份”保留本段历法语境。
- source_word: በከመ ሀለዉ
  choice: 按其实际情形
  rationale: 表达记录与这些对象现有状态相符，较逐字的“照它们所是的”更符合现代汉语。
- source_word: ርእየ ብርሃኖሙ
  choice: 它们光辉的显现
  rationale: 将ርእየ理解为处于属格结构中的名词“显现／景象”，而不是第一人称动词“我看见”；ብርሃኖሙ则保留光亮、光辉的意象。
- source_word: እስከ ተፈጸመ ዐሡር ወኀሙስ መዋዕለ
  choice: 直到十五天期满
  rationale: 忠实表达一个十五日时段达到完成；“期满”在中文中简洁自然。
theological_decisions:
- issue: 反复出现的“它们”所指为何
  choice: 正文保留代词“它们”，由天文书上下文指向相关天体或光体
  alternative: 明说为“众天体”，或理解为与天体相关的天使群体
  rationale: 上下文中的位置、月份和光辉自然指向天体，但本节本身没有明确补出名词；保留代词可避免消除原文的指称张力。
- issue: 末句是以诺“看见”，还是“光辉的显现”
  choice: 译作名词短语“它们光辉的显现”
  alternative: 译作“我看见它们的光，直到十五天期满”
  rationale: ርእየ更适合分析为构造状态中的名词，而第一人称完成式通常应为另一词形；因此不在正文中补出第一人称观察动作。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留重复的“记下”以反映原文结构；不把代词擅自扩展为某一类天使或天体。乌列按传统常见音译处理。
