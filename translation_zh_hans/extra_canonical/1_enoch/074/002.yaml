- from: 凡圣天使乌列——就是统领它们的那一位——向我展示的，我都记了下来。我照他向我展示的，记下它们的位置，也按其实际情形记下它们的月份，以及它们光辉的显现，直到十五天期满。[a]
  to: 圣天使乌列——就是统领它们的那一位——向我所展示的一切，我都记下来了：我照他向我展示的记下它们的位置，也按它们实际的情形记下它们的路径，并记下它们光辉的显现，直到十五天期满。[a]
