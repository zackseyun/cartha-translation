  source_fidelity: 草稿正确地将ርእየ理解为名词性构造结构，译出“它们光辉的显现”，没有随英语审校轨迹中“我看见”的误析而改动；这较贴合吉兹文本。可是አውራኂሆሙ在此应为“它们的路径／运行路线”，并非“它们的月份”。“月份”既不合该词的通常词义，也会与紧接的“光辉”及天体运行描写的并列关系不协调。
  naturalness: “凡……向我展示的，我都记了下来”可以理解，但以“向我所展示的一切”起句更自然。末尾若不重复“记下”，中文会不易看出“光辉的显现”也是前面“记下”的并列宾语；补出该动词可使结构清楚，同时不增添原文意义。
  terminology: “圣天使”“乌列”“位置”“光辉的显现”均可保留。“统领它们的那一位”忠实但稍显迂回；保留可维持原文未明说“它们”所指的状态。将“月份”改为“路径”符合አውራኂሆሙ及本段天体运行语境。
