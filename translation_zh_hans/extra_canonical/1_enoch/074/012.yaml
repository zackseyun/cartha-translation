base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/012.yaml
  text: And the sun and the stars bring in all the years exactly[a]; according to their stations forever, they do not advance or fall behind by a single day, but they complete the year in righteousness, exactly[d][c][b], in three hundred and sixty-four days.
translation:
  language: zh_hans
  text: 太阳和众星都准确地使每一年到来[a]；它们永远各按自己的位置运行，既不提前，也不落后一天；而是按公义准确无误地使一年更替，历三百六十四天[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “准确地”也可译作“精确地”；原词强调天体在历法计算上的谨慎与准确。
    reason: lexical_alternative
  - marker: b
    text: “使一年更替”也可较直译为“转换一年”或“改变一年”；在此指年度周期按既定秩序运行、交替。
    reason: lexical_alternative
lexical_decisions:
- source_word: ያመጽእሙ፡ ለዓመታት
  choice: 带来所有的年岁
  rationale: 保留使年岁来到的具体历法意象；在现代汉语中以“带来”表达使动含义，而不弱化为单纯的“标示”。
- source_word: ጥንቁቃት / ጥንቁቀ
  choice: 准确地
  rationale: 该词强调谨慎、精确；本节论及天体与历法秩序，“准确地”自然地传达其副词作用。
- source_word: ከመ፡ ምንባሪሆሙ፡ ለዓለም
  choice: 它们永远各按自己的位置运行
  rationale: 明确保留ምንባሪሆሙ“它们的位置、驻所”以及ከመ“按照”的含义；补入“运行”使汉语完整，但不把“位置”抽象化为单纯的永恒秩序。
- source_word: ኢይበድሩ፡ ወኢይጐንዱ፡ አሐተ፡ ዕለተ
  choice: 不提前，也不落后一天
  rationale: 以自然对称的现代汉语表达历法上不早不迟的偏差，并保留“一天”这一最小误差单位。
- source_word: ይዌልጡ፡ ዓመተ
  choice: 使一年完成
  rationale: 该动词字面可涉及改变、转换或交替；在年度周期的语境中指使年转完、完成其周期。正文采用自然的“使一年完成”，并以脚注保留“转换一年”的词汇可能性。
- source_word: በጽድቅ
  choice: 按公义
  rationale: 保留ጽድቅ的道德和神学分量，不将其完全降格为技术性的“正确地”；“按公义”也能表达合乎正当秩序。
- source_word: ፫፻ወ፷ወረቡዕ፡ መዋዕለ
  choice: 三百六十四天
  rationale: 完整清楚地译出《天文书》历法体系中的关键数字。
theological_decisions:
- issue: በጽድቅ应译作纯技术性的历法准确，还是保留其道德—神学意味
  choice: 按公义
  alternative: 正确地；合宜地
  rationale: 本段把宇宙秩序描述为正当而有规范性的秩序。“按公义”既可指正确无误，也保留原词的神学张力。
- issue: ይዌልጡ፡ ዓመተ是“改变一年”还是“完成一年”
  choice: 使一年完成
  alternative: 转换一年；使一年交替
  rationale: 原动词具有改变、转换的词汇色彩，但在固定的三百六十四日年度周期中，语境指年度的转完或告成。正文采用可懂的语境义，脚注保留较直译的可能。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。分号区分天体带来年岁与其不偏离既定位置的说明；保留“公义”的神学质感，同时避免生硬的逐词翻译。所有脚注标记均已置于正文。
