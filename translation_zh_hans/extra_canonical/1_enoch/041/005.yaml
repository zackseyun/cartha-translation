base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/005.yaml
  text: And I saw the storehouses of the sun and of the moon[a], where they come out and where they go in, and their glorious return; and one is more honored than the other. And their course is blessed, and they do not overstep their course, and they do not add to it, and they do not take away from their course[d][c][b]; and they keep faith with one another by an oath.
translation:
  language: zh_hans
  text: 我看见太阳和月亮的库房[a]，也看见它们从哪里出来、往哪里进去，以及它们荣耀的归返；又看见其中一个如何比另一个更尊贵[b]。它们的运行是蒙福的；它们不越过自己的轨道，也不增加或减少自己的行程；它们彼此以誓言守信[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宝库”。这里描绘天上的处所，太阳和月亮从其中出来，又回到其中。
    reason: lexical_alternative
  - marker: b
    text: 本句原文较难；“其中一个如何比另一个更尊贵”可能指太阳和月亮在光辉或位阶上的差别。
    reason: alternative_reading
  - marker: c
    text: “彼此以誓言守信”以盟约性的语言描述天体遵守既定秩序，不只是说它们机械而有规律地运行。
    reason: cultural_note
lexical_decisions:
- source_word: መዛግብተ
  choice: 库房
  rationale: 原词可指宝库、贮藏处；此处是日月从其中出入的天上处所。“库房”保留具体的宇宙图景，又避免过强的财宝含义。
- source_word: ይወፅኡ / ይገብኡ
  choice: 出来／进去
  rationale: 两词是基本的运动用语。译作“出来／进去”，保留日月从天上库房出入的异象意象，不把它们窄化为“升起／落下”。
- source_word: ግብኦቶሙ
  choice: 归程
  rationale: 该词属于进入、返回的语义范围；在前文“出来／进去”之后，“归程”自然表达其循环回返，同时保留行进的意味。
- source_word: ስቡሕ
  choice: 荣耀的
  rationale: 该形容词含荣耀、赞美或辉煌之意。“荣耀的”符合经文庄重语体，也呈现天体运行的威荣。
- source_word: አፎ ይከብር አሐዱ ለካልኡ
  choice: 一个怎样比另一个更尊贵
  rationale: 保留አፎ“怎样”的间接疑问色彩以及比较意义，不进一步断定所比较的是光辉、外观还是等级。
- source_word: ምሕዋሮሙ
  choice: 运行／行程／轨道
  rationale: 原词可指运动、路径或巡行。依上下文分别采用自然的汉语搭配；“轨道”在此指规定的路线，并非刻意引入现代天文学意义。
- source_word: ብፁዕ
  choice: 蒙福的
  rationale: 原词通常意为“有福、蒙福”。保留神学色彩，表明宇宙秩序不只是机械规律。
- source_word: ኢየኃልፉ ምሕዋረ
  choice: 不越过自己的轨道
  rationale: 表达不跨越所定界限的意思，兼具空间路径和服从秩序的含义。
- source_word: ኢይዌስኩ ወኢያኃጽጹ
  choice: 不增加或减少自己的行程
  rationale: 成对动词表示既不增添也不减损；译文保留两面的否定，而以简洁汉语连接。
- source_word: ሃይማኖተ የዐቅቡ
  choice: 持守忠信
  rationale: 此处重点是忠诚、信实，而非后世意义上的教义信仰。“持守忠信”兼顾原文宗教与盟约色彩。
- source_word: በመሐላ
  choice: 以誓言
  rationale: 原词指起誓或誓言；“以誓言”保留工具性和庄严性。
theological_decisions:
- issue: 日月的运行应译为纯天文学规律，还是保留盟约与道德语言
  choice: 保留“蒙福”“以誓言持守忠信”等明确带有神学色彩的表达。
  alternative: 译为“规律”“遵守彼此的约定”等较中性的秩序语言。
  rationale: 吉兹语使用带宗教分量的词汇，启示文学也常把受造界描绘为顺服所定秩序；若完全机械化处理，会削弱原文的神学张力。
- issue: 日月之间“一个比另一个更尊贵”的具体所指
  choice: 保留笼统比较，并译出“怎样”的疑问色彩。
  alternative: 明确解释为太阳在光辉、外观或等级上胜过月亮。
  rationale: 原句语法和具体比较范围均有困难；不应把可能的光辉或等级比较固定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留启示文学的具体宇宙意象和拟人化盟约语言；不用“升起／落下”或纯科学术语来消解原文图景。
