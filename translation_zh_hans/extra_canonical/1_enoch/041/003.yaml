base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/003.yaml
  text: And there my eyes saw the hidden treasuries of the lightning and the thunder[a], and the hidden treasuries of the winds—how they are divided so that they may blow upon the earth—and the hidden treasuries of the clouds and the dew; and there I saw from where they come in that place[e][d][c][b], and from there they water the dust of the earth.
translation:
  language: zh_hans
  text: 在那里，我的眼睛看见了闪电和雷霆的隐秘库房[a]，又看见了风的隐秘库房，以及风的口怎样被分开[b]，使风吹到地上；还看见了云和露水的隐秘库房。我又看见它们在那地方从何处而来[c]；地上的尘土便从那里得到滋润[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐秘库房”也可译作“隐藏之物”或“隐秘之处”；这里保留自然力量被收藏、储备的宇宙图景。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“它们的口怎样被分开”，指风的出口或开口。
    reason: lexical_alternative
  - marker: c
    text: “它们”所指可能是紧接上文的云和露水，也可能包括前面列举的各种气象现象。
    reason: referent_ambiguity
  - marker: d
    text: 原文末句也可理解为“它们从那里滋润地上的尘土”。动词可表达“得饱足、被充满”，而本句的数与句法关系并不完全明朗。
    reason: alternative_reading
lexical_decisions:
- source_word: ኅቡኣተ
  choice: 隐秘库房
  rationale: 该词可指隐藏、保留之物或所在；在本节宇宙异象的语境中，“隐秘库房”既保留隐藏之意，也呈现自然力量被储存的图景。
- source_word: መብረቅት ወነጐድጓድ
  choice: 闪电和雷霆
  rationale: 按气象现象理解；“雷霆”与庄重的异象文体相称，同时不把复数形式生硬地逐一表达。
- source_word: ነፋሳት
  choice: 风
  rationale: 虽然该词在别处也可能表示“灵”，但这里与闪电、雷、云、露水并列，并明确说吹到地上，因此采用气象意义。
- source_word: አፎ ይትከፈሉ
  choice: 风口怎样被分开
  rationale: 保留“口”的具体拟人图像，同时用现代汉语可理解的“风口”表达风的出口或开口；被动式反映原文“被分开”。
- source_word: ከመ ይንፍሑ ዲበ ምድር
  choice: 使风吹到地上
  rationale: 表达原文的目的或结果关系，并以自然现代汉语呈现。
- source_word: ደመናት ወጠል
  choice: 云和露水
  rationale: 采用直接、通行的气象词语，保留两者并列。
- source_word: እምኀበ ይመጽእ
  choice: 从何处而来
  rationale: 原动词基本义为“来”；中文无需另加“出来”，并保留主语所指可能涵盖前述多种现象的开放性。
- source_word: ይፀግቡ ጸበለ ምድር
  choice: 地上的尘土便从那里得到滋润
  rationale: G-stem动词倾向于“得饱足、被充满”的不及物意义；在云和露水的语境中译作“得到滋润”较自然，同时以脚注保留句法和主动读法的不确定性。
theological_decisions:
- issue: ነፋሳት应译为“风”还是“灵”
  choice: 风
  alternative: 灵
  rationale: 本节罗列的是雷电、云、露水等宇宙气象现象，且紧接“吹到地上”，局部语境明确支持“风”；不因该词在其他语境中的神学用法而改译。
- issue: 末句应作主动滋润还是尘土得到滋润
  choice: 地上的尘土从那里得到滋润
  alternative: 它们从那里滋润地上的尘土
  rationale: 原文动词形态更适合不及物的“得饱足、被充满”，但数的一致和句法存在难点，因此正文采用较有形态依据的读法，脚注保留主动理解。
translation_notes:
  register: 采用现代、庄重而清楚的异象叙事语体。“我亲眼看见”自然表达“我的眼睛看见”，避免机械直译；分号梳理长串并列结构。正文保留“隐秘库房”和“风口”等具体宇宙图像，不将其解释为现代气象机制。
