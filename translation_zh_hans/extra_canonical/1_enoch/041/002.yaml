base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/002.yaml
  text: There I saw the dwelling places of the sinners and the dwelling places of the holy ones[a]; and there my eyes saw all the sinners being driven away from there—those who deny the name of the Lord of Spirits—and they were being dragged off[d][c][b], and they could not stand because of the punishment that goes out from the Lord of Spirits.
translation:
  language: zh_hans
  text: 在那里，我看见罪人的住处和圣者的住处[a][b]；在那里，我亲眼看见所有罪人都被从那里赶走——就是那些否认万灵之主之名的人。他们被拖走，因那从万灵之主那里发出的惩罚而站立不住[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住处”也可译作“居所”。吉兹语对罪人和圣者重复使用同一个名词，突出了异象中分别属于两者的地方。
    reason: lexical_alternative
  - marker: b
    text: “圣者”可指成圣的人、天上的圣洁存在，或兼指二者；吉兹语在这里没有明确限定。
    reason: alternative_reading
  - marker: c
    text: “站立不住”也可理解为“不能存留”或“无处立足”；原文表达的是他们在万灵之主所发出的惩罚之下无法站立或承受。
    reason: lexical_alternative
lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: 住处
  rationale: 该词指居住之所；译作“住处”既保留异象中的空间意象，也自然呈现原文对罪人和圣者所用同一名词的重复。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 这是标准的道德称谓，并与本节的“圣者”形成鲜明对照。
- source_word: ቅዱሳን
  choice: 圣者
  rationale: 此词可指成圣的人、天上的圣洁存在，或兼指二者；“圣者”比“圣徒”更少带入后世教会语境，也不限定所指。
- source_word: ይሰደዱ
  choice: 被……赶走
  rationale: 被动未完成式表达受强制驱离；“赶走”保留动作感和审判意味。
- source_word: ይክሕድዎ ለስመ
  choice: 否认……之名
  rationale: 原文明确包含“名”，故不将其淡化为一般意义上的不信或拒绝。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 这是《以诺一书》中固定的神圣称号；“万灵之主”在现代中文中庄重自然，并保留其独特性。
- source_word: ይስሐቡ
  choice: 被拖走
  rationale: 该动词有拉、拖之意；“被拖走”保留惩罚场景中强烈而具体的画面。
- source_word: ቀዊመ አልቦሙ
  choice: 站立不住
  rationale: 该短语字面上表示“没有站立”，在此可指无法站立、承受或继续存留；“站立不住”保留身体和审判层面的双重意味。
- source_word: መቅሠፍት
  choice: 惩罚
  rationale: 该词可表示打击、灾祸或刑罚；在此审判语境中，“惩罚”最能概括其司法性，同时不限定惩罚的具体形式。
- source_word: ትወጽእ እምእግዚአ መናፍስት
  choice: 从万灵之主那里发出的
  rationale: 保留原文“出来、发出”的动态意象，并清楚说明惩罚的来源。
theological_decisions:
- issue: “圣者”的身份
  choice: 采用宽泛的“圣者”，不明确限定为人或天使。
  alternative: 圣徒；天使；圣洁的义人
  rationale: 吉兹语在此没有明确所指；保留宽泛称谓可避免消解原文的神学含混性。
- issue: “否认万灵之主之名”的含义
  choice: 保留对神圣之“名”的否认。
  alternative: 不承认万灵之主；拒绝万灵之主
  rationale: 原文明确提及“名”，其中包含权柄与身份的意味，不宜改写为泛泛的不信。
- issue: 罪人在惩罚下的状态
  choice: 译为“站立不住”，同时保留无法承受或存留的可能含义。
  alternative: 无法站立；不能存留；无立足之地
  rationale: 原文习语兼具身体姿态与在审判中不能维持的含义，不宜只固定为法律或空间意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我亲眼看见”自然表达“我的眼睛看见”的强调；保留“万灵之主”这一以诺传统中的固定称号，并用破折号清楚标示被赶走之人的同位说明。
