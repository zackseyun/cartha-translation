base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/004.yaml
  text: And there I saw the storehouses of the lightning[a], and from them are apportioned the wind from the storehouse of hail, and the wind from the storehouse of mist[d][c][b], and the cloud and its cloud remain over the earth from before the world.
translation:
  language: zh_hans
  text: 在那里，我看见了闪电的库房；从这些库房中，冰雹库房的风和雾气[a]库房的风被分发出来；那属于云的，以及它的云[b]，自世界以前就停留在大地之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雾气”所译的吉兹语词在此抄本中含义不确定，也可能指霜、白霜或类似的气象现象。
    reason: lexical_alternative
  - marker: b
    text: “那属于云的，以及它的云”在埃塞俄比亚文本中句法生硬，所指也不明确；这里保留其重复和含混，没有将它润饰成更明确的关系。
    reason: textual_difficulty
lexical_decisions:
- source_word: መዛግብተ
  choice: 库房
  rationale: 该复数名词指储存之处或储备室；“库房”具体、自然，也保留天上气象储库的启示文学意象。
- source_word: ፀዳዋነ
  choice: 闪电
  rationale: 在气象语境中最自然地指闪电；汉语用集合性单数即可表达。
- source_word: ይትከፈሉ
  choice: 被分发出来
  rationale: 保留被动含义及有秩序地分配、发放之意，而不只是物理上的分开。
- source_word: ነፋስ
  choice: 风
  rationale: 上下文都是冰雹、雾气、云等气象现象，因此采用气象义，不译作“灵”。
- source_word: በረድ
  choice: 冰雹
  rationale: 直接对应这一常见气象词，表意明确。
- source_word: ጊሜ
  choice: 雾气
  rationale: 原词所指气象现象并不确定；“雾气”与随后的云相衔接，但霜、白霜等解释仍有可能，故加注。
- source_word: ዘደመና / ወደመና ዚአሁ
  choice: 那属于云的，以及它的云
  rationale: 前一短语中的关系／指示成分ዘ予以保留，后一短语直译为“它的云”；不擅自消除原文重复而含混的结构。
- source_word: የኀድር
  choice: 停留
  rationale: 表达居留、持续存在之意；“停留”在现代汉语中自然，同时保留延续性。
- source_word: እምቅድመ ዓለም
  choice: 自世界以前
  rationale: 保留原语的原初时间意味，不强行判定是创造之前、某一世代之前，还是后期神学意义上的永恒。
theological_decisions:
- issue: 宇宙论语境中的原初时间短语
  choice: 自世界以前
  alternative: 自世代以前；世界尚未有以前就
  rationale: 采用较贴近原文且保留歧义的表达，不把经文限定为特定的创造论或永恒论命题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“库房”保留具体的宇宙气象图景；分号帮助读者辨认并列结构。对末段生硬的吉兹语表达采取偏形式对应的译法，以保存真实歧义。
