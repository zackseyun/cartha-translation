base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/001.yaml
  text: And after this I saw all the hidden things of the heavens[a], and how the kingdom is divided[c][b], and how the deeds of human beings are weighed in the balance.
translation:
  language: zh_hans
  text: 此后，我看见了诸天一切隐藏的事[a]，又看见国度如何被划分[b]，以及人的行为如何在天平上被称量[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诸天一切的秘密。”原词可指普通人视线或知识所不能及的隐藏之事。
    reason: lexical_alternative
  - marker: b
    text: “国度如何被划分”一句含义较难确定，也可能指天上领域如何被安排或分配。
    reason: alternative_reading
  - marker: c
    text: 原文以天平称量人的行为，带有判断或评定的意味。
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: 此后
  rationale: 作为异象叙事中的时间衔接语，简洁自然地保留前后次序。
- source_word: ርኢኩ
  choice: 我看见了
  rationale: 直接保留第一人称异象报告的表达，不采用文言或古雅措辞。
- source_word: ኵሎ ኅቡኣቲሁ ለሰማያት
  choice: 诸天一切隐藏的事
  rationale: “隐藏的事”保留具体复数意义，也避免将其过度神学化为“奥秘”；“诸天”反映原文的复数形式。
- source_word: መንግሥተ
  choice: 国度
  rationale: 该词可指国、王权或统治；“国度”在此较好地保留宇宙性和政治性的双重色彩。
- source_word: እፎ
  choice: 如何
  rationale: 自然引出以诺所见内容，并统摄后面的两个分句。
- source_word: ትትካፈል
  choice: 被划分
  rationale: 保留被动及划分、分配的基本意义，不武断指定具体的宇宙秩序。
- source_word: ትገበረ ሰብእ
  choice: 人的行为
  rationale: 原句所指是人所做之事；“人的行为”在现代汉语中自然，又不局限于某一种行为。
- source_word: በመዳልው
  choice: 在天平上
  rationale: 明确保留称量器具的具体意象，避免弱化成抽象的“衡量”。
- source_word: ይደለው
  choice: 被称量
  rationale: 与天平意象相配，保留审察或判断的暗示，但不直接把它解释成末日审判。
theological_decisions:
- issue: “国度如何被划分”这一难解短语的含义
  choice: 将其译为一个国度被划分或分配
  alternative: 天上的国度按不同等次分配，或统治领域被区分为若干部分
  rationale: 吉兹语表述简略且含义不确定；直译“被划分”可保留原文的宇宙秩序意象，同时不补入未经明说的天界等级体系。
- issue: 称量人的行为是否明确指末日审判
  choice: 保留天平称量的判断意象，但正文不明说“审判”
  alternative: 将其解释性地译为人的行为如何受到审判或评定
  rationale: 原文的称量意象暗示评估与判断，却没有在本节中明确写出末日审判；因此保留意象和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“诸天”保留启示文学语境及原文复数；“国度”“被划分”刻意保留难解之处；全句以重复“看见”增强汉语结构的清晰度，但不增加新的神学内容。
