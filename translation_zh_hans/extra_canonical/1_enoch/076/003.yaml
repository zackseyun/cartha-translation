base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/003.yaml
  text: And the first three are toward the east[a], and three toward the north, and three after these, on the left, toward the south[c][b], and three toward the west.
translation:
  language: zh_hans
  text: 最先的三个朝向东方，三个朝向北方；在这些之后，三个在左边[a][b]，朝向南方；另有三个朝向西方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代方位表述常设想人面向东方；按这种习惯，左边通常对应北方，而右边对应南方。本句却将“左边”与“南方”并列，译文保留这一张力。
    reason: cultural_note
  - marker: b
    text: 现有底本文字“在这些之后，在左边”置于方括号中，表明这一段的文本传承存在不确定性；正文仍按所给见证译出。
    reason: textual_variant
lexical_decisions:
- source_word: ቀዳማያት
  choice: 最先的
  rationale: 该词在此明确修饰前三个项目，保留“最先、在前”的次序含义，不将其改作方位词。
- source_word: መንገለ
  choice: 朝向
  rationale: 此词在各方位之前反复出现，表示所朝的方向；“朝向”在现代汉语中自然且准确。
- source_word: ጽባሕ
  choice: 东方
  rationale: 该词本与早晨、日出相关，在本段方位目录中指东方。
- source_word: መስዕ
  choice: 北方
  rationale: 依此处吉兹语词义译作北方，不因随后“左边”与“南方”的张力而调换方位。
- source_word: በድኅረ እሉ
  choice: 在这些之后
  rationale: 直译其承接和排列作用，表示下一组三个接续前述项目。
- source_word: በፀጋም
  choice: 在左边
  rationale: 原文明确保留相对身体方位“左边”，故不以现代罗盘方位替换。
- source_word: አዜብ
  choice: 南方
  rationale: 依此处吉兹语词义译作南方，保留它与“左边”并列所形成的文本张力。
- source_word: ዓረብ
  choice: 西方
  rationale: 该词本与傍晚、日落相关，在此方位语境中指西方。
theological_decisions:
- issue: 是否为消除“左边”与“南方”的方位张力而改换北、南
  choice: 按原文同时保留“在左边”和“朝向南方”
  alternative: 按面向东方的古代定向习惯，将“左边”与北方对应，或调换原文的北、南方位
  rationale: 现有吉兹语文本先写北方，随后把“左边”与南方并列。译文不应暗中校正或调换方位，而应保留现存文本的张力，并以脚注说明。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。重复“朝向”以保留原文列举结构；使用分号划分四组，避免把“在左边”误读为对“北方”的解释。
