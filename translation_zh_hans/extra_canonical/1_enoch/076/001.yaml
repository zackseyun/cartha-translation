base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/001.yaml
  text: And at the ends of the earth I saw twelve portals[a], and all of them were open for all the winds[b], from which the winds go out and blow upon the earth.
translation:
  language: zh_hans
  text: 我在地极看见十二道门[a]；这些门全都向各样的风敞开[b]。风从这些门出来，吹在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门”也可译作“门户”或“开口”；原词在这里描绘风出入的宇宙通道。
    reason: lexical_alternative
  - marker: b
    text: 转录文本此处疑有讹误；按校勘后的读法，意为“这些门全都敞开”，而不是“这些门在四周敞开”。
    reason: textual_variant
lexical_decisions:
- source_word: አጽናፈ ምድር
  choice: 地极
  rationale: 指大地或世界的边缘、尽头；“地极”简洁庄重，并保留异象中的宇宙地理图景。
- source_word: ርኢኩ
  choice: 我……看见
  rationale: 直接表达第一人称异象叙述公式，符合现代汉语。
- source_word: ፲፪ ኆኃተ
  choice: 十二道门
  rationale: 该词可指门、门户或开口；“门”保留建筑性宇宙意象，在中文中也比“入口”更自然。
- source_word: ወእልኩ ኆኃው ርኅዋተ
  choice: 这些门全都……敞开
  rationale: 依据校勘说明，将疑似误录的ኃዋላው理解为ኆኃው，即“门”的复数形式；全句表示这些门都处于敞开状态，而不是“环绕敞开”。
- source_word: ለኵሎሙ ነፋሳት
  choice: 向各样的风
  rationale: 语境为风的宇宙出口，故将ነፋሳት译为“风”；介词关系用“向……敞开”自然呈现。
- source_word: እለ እምኔሆሙ ይወፅኡ ነፋሳት
  choice: 风从这些门出来
  rationale: 明确保留风由这些门发出的空间关系，同时避免中文关系从句指代含混。
- source_word: ወይነፍሱ ዲበ ምድር
  choice: 吹在地上
  rationale: 按气象语境表达风在大地上吹动的动作，不引入“呼吸”等可能造成拟人化的含义。
theological_decisions:
- issue: ነፋሳት应译为“风”还是“灵”
  choice: 风
  alternative: 灵
  rationale: 本节描述地极的门以及风从门中出来、吹在地上的宇宙气象现象，直接语境明确支持“风”；不因该词可能具有气息或灵的语义范围而引入人格化解释。
- issue: 疑似讹文ኃዋላው的理解
  choice: 按校勘作ኆኃው，译为“这些门全都”
  alternative: 按现存转录理解为“周围／四周”
  rationale: 所提供的最新校勘指出该字串是“门”的标准复数形式被误录；这也使“这些门全都敞开”的句法连贯。不过因底本文本置信度为中等，脚注保留校勘信息。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“地极”保留启示文学的宇宙图景；分成两句以消除中文关系从句的歧义，同时保留原文动作次序。
