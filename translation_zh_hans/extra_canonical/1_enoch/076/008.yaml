base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/008.yaml
  text: And through the middle opening[a], which is beside it, there come out from it a pleasant fragrance, and dew, and rain, and peace[c][b], and life.
translation:
  language: zh_hans
  text: 从那在它旁边的中间开口中出来的，是芬芳[a]、露水、雨、平安[b]和生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“美好的香气”或“悦人的气味”。原文由“气味、香气”一词和“美好、悦人”一词组成。
    reason: lexical_alternative
  - marker: b
    text: “平安”也可包含安康、福祉和完整的意思，不仅指没有冲突。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: 开口
  rationale: 该词指开口、孔口或窗口；“开口”既符合宇宙构造的空间意象，又不把它过度具体化为建筑物的窗或门。
- source_word: እንተ ኃቤሃ ማእከላዊት
  choice: 那在它旁边的中间开口
  rationale: 按语法，阴性形容词“中间的”修饰“开口”，而带阴性单数后缀的方位短语表示“在它旁边”。这样译出“中间开口”本身位于先前所述对象旁边，而非另一个位于中间开口旁边的开口。
- source_word: ይወፅእ እምኔሃ
  choice: 从……出来的有
  rationale: 原动词表示出去或出来；此表达自然地统摄后面并列的多项事物，同时保留它们从该开口发出的图景。
- source_word: መዐዛ ሠናይ
  choice: 芬芳
  rationale: 名词表示气味或香气，形容词表示美好、悦人；“芬芳”简洁地传达悦人的香气。
- source_word: ጤለ
  choice: 露水
  rationale: 在此气象语境中，“露水”是最合适的通常词义，也与雨水并列自然。
- source_word: ዝናም
  choice: 雨水
  rationale: 该词通常指雨；“雨水”在并列名词中自然清楚。
- source_word: ሰላም
  choice: 平安
  rationale: 该词不仅可指没有冲突，也可涵盖安康、完整和福祉；“平安”保留其宽广的宗教与宇宙秩序意味。
- source_word: ሕይወት
  choice: 生命
  rationale: 直译为“生命”，保留并列祝福在结尾处的高潮。
theological_decisions:
- issue: 是否把ሰላም在气象福分的语境中收窄为物质丰裕
  choice: 平安
  alternative: 福祉、安康或兴盛
  rationale: 原词的范围比物质兴盛更广。“平安”保留整体完满与和谐的意味，脚注则提示其语义宽度，避免把经文限定为单纯的农业繁荣。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从……出来的有……”既保持原文一项动词统摄整串名词的结构，也避免用“涌出”搭配“芬芳”所产生的不自然感。代词“它”保留原文的回指关系，不擅自补明其所指。
