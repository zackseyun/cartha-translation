base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/006.yaml
  text: And through the second middle gate abundance comes out[a], and from it come rain and fruit and peace and dew; and through the third gate, which is toward the south[c][b], frost comes out and dryness.
translation:
  language: zh_hans
  text: 丰盛从第二道居中的门中出来[a]；雨水、果实、平安和露水也从那里出来。严霜和干燥[b]从第三道朝南的门中出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“丰盛”的吉兹语词也可指“宽广”或“充裕”。它与随后“雨水、果实、平安和露水”的列举相连，语意略显突兀，故保留较宽的译法。
    reason: textual_variant
  - marker: b
    text: 或译“干旱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: 门
  rationale: 本词在《天文书》的宇宙图景中指风与各种气象从中出来的天上门户；译作“门”可保留原文的具体意象。
- source_word: ማእከላዊት
  choice: 中
  rationale: 表示一组门中位于中央的一道；“中门”简洁自然，并保留空间关系。
- source_word: ርኅብ
  choice: 丰盛
  rationale: 该词可涉及宽广、充裕之意；结合随后列出的雨水、果实、平安与露水，译作“丰盛”最符合上下文，同时以脚注保留词义上的不确定性。
- source_word: ዝናም
  choice: 雨水
  rationale: 为普通气象词；“雨水”在现代汉语中自然，也适合农业语境。
- source_word: ፍሬ
  choice: 果实
  rationale: 保留原词具体的“果实”含义，不擅自强化为“收成”。
- source_word: ሠላም
  choice: 平安
  rationale: 原词也可涵盖安康、福祉；“平安”保留其基本而宽泛的意义。
- source_word: ጤለ
  choice: 露水
  rationale: 准确表达原文所指的露，且与雨水、果实构成自然的农业景象。
- source_word: መንገለ መስዕ
  choice: 朝南
  rationale: 该短语表示方向；“朝南”简明地保留门的方位。
- source_word: ቍር
  choice: 严霜
  rationale: 在气候现象的语境中译作“严霜”比泛指“寒冷”更具体，也与干旱形成并列。
- source_word: የብስ
  choice: 干旱
  rationale: 原词表示干燥、旱象；此处列举从门出来的气候现象，“干旱”较“干燥”更自然，脚注保留较直译的选择。
theological_decisions:
- issue: 是否保留天上门户的宇宙图景
  choice: 将ኆኅት译作“门”，并重复使用“出来”
  alternative: 译作“出口”，并意译为“带来”或“产生”
  rationale: 本段描绘风霜雨露从天上各门出来的结构化宇宙。保留“门”和“出来”可忠实呈现其启示文学意象，而不将其改写成一般气象说明。
- issue: 如何处理ርኅብ的语义张力
  choice: 正文译作“丰盛”，脚注注明也可理解为“宽广”或“充裕”
  alternative: 直译作“宽广”，或依近形词解释为“饥荒”
  rationale: 所提供的吉兹语形式支持宽广、充裕这一语义范围，而下文列举的雨水、果实、平安和露水也偏向正面结果；但不宜隐藏该词在传本辨读和语义上的困难。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法保留原文两组门户及“出来”的重复，以维持启示文学的宇宙空间感；标点略作调整，使并列关系在中文中清楚。
