base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/009.yaml
  text: And through the third opening[a], toward the west, there come out from it dew and rain[b], and frost and destruction.
translation:
  language: zh_hans
  text: 从朝向西方的第三个开口，出来的是露水、雨水、霜[a]和毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “霜”所对应的词也有学者理解为“蝗虫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት ኆኅት
  choice: 第三个开口
  rationale: ሣልስት是序数“第三”，ኆኅት在《天文书》的宇宙图景中指天上的孔口；“开口”既保留具体意象，又不额外限定为门或窗。
- source_word: መንገለ ምዕራብ
  choice: 朝向西方
  rationale: 自然表达该开口的方位，同时保留原文的方向性。
- source_word: ጤለ
  choice: 露水
  rationale: 该词在本章相邻经文中也表示露水；此处译作“露水”比“雾”更贴近其常见词义。
- source_word: ዝናም
  choice: 雨水
  rationale: 这是表示雨的普通词；与“露水”并列时，“雨水”在现代汉语中清楚自然。
- source_word: አናጽዕ
  choice: 霜
  rationale: 依照本节经校订后的读法，并顾及其与露水、雨水并列的语境，正文译作“霜”；由于另有“蝗虫”的词义判断，保留脚注说明。
- source_word: ደምሳሴ
  choice: 毁灭
  rationale: 该词源于表示毁坏、摧毁的词根，应译作“毁灭”或“毁坏”，不可按气象序列推定为雪。
- source_word: ይወፅእ እምኔሃ
  choice: 出来的是
  rationale: 保留各种事物从天上开口出来的具体意象，同时以自然汉语引出后面的并列成分。
theological_decisions:
- issue: 本节同时列出滋润之物与破坏性之物
  choice: 保留“露水、雨水、霜和毁灭”的张力
  alternative: 把所有项目统一解释为气象现象
  rationale: 原文末项明确表达毁灭；不应为了整齐的气象列表而将其弱化或改译，从而遮蔽祝福与灾害并列的启示文学图景。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“朝向西方的第三个开口”保持原文空间关系；句式避免生硬逐词对应，同时保留天上事物从开口出来的异象性描写。
