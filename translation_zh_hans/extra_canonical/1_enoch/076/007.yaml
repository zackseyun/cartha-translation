base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/007.yaml
  text: And after these winds[a], by the way of the south they go out through two gates; through the first gate, which inclines toward the east[c][b], there comes out a wind of death.
translation:
  language: zh_hans
  text: 在这些风之后，有风从南方经由两道门出来；从其中第一道朝东方倾斜的门出来的，是死亡之风。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死亡之风”也可译作“致命的风”；这里采用较贴近原文形式的译法，以保留其宇宙性和不祥的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ እሉ ነፋሳት
  choice: 在这些风之后
  rationale: 按时间顺序承接前文所述诸风；保留指示语与本段有序列举的结构。
- source_word: በመንገለ አዜብ
  choice: 南方的风
  rationale: መንገለ 表示方向或方位。结合复数动词和本章按方位论风的语境，将省略的主语关系自然表达为“南方的风”，避免生硬直译为“沿着南方的道路”。
- source_word: በ፪ኆኅት
  choice: 从两道门
  rationale: ኆኅት 可指开口、窗或门；在宇宙建筑意象中译作“门”自然、庄重，并与上下文中风由出口吹出的图景相合。
- source_word: በቀዳሚት ኆኅት እምኔሆን
  choice: 从第一道门
  rationale: 表达两道门中的第一道；中文无需重复“其中”，即可保留部分关系并使行文简洁。
- source_word: እንተ ታጸንኑ ለመንገለ ምሥራቅ
  choice: 就是朝东方倾斜的那一道门
  rationale: 阴性单数关系词修饰“第一道门”；ታጸንኑ 按方向上的倾斜或偏向理解，避免误作修饰复数门的“位于东方”。
- source_word: ነፋስ ሞት
  choice: 死亡之风
  rationale: 保留原文名词组合的强烈末世性和宇宙性意象，不弱化为一般形容词“致命的”。
theological_decisions:
- issue: 是否把 ነፋስ ሞት 意译为普通气象描述
  choice: 死亡之风
  alternative: 致命的风
  rationale: 原文把风按其宇宙功能加以分类；“死亡之风”保留其鲜明而 ominous 的启示文学意象，不额外界定死亡如何发生。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“门”呈现宇宙结构中的出口意象；通过“就是……那一道门”清楚标明关系从句修饰单数的“第一道门”。
