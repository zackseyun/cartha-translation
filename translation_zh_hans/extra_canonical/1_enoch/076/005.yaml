base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/005.yaml
  text: And the first wind goes out from those gates[a], whose name is the east wind, through the first gate that is toward the east; and turning toward the south, from it come forth desolation, drought, death[c][b], and destruction.
translation:
  language: zh_hans
  text: 第一股风从那些门出来[a]，名叫东风；它从朝东的第一道门出来，转向南方。从这门出来的，是荒凉、干旱、死亡[b]和毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些门”承接上文所述的风门。
    reason: referential_clarity
  - marker: b
    text: 原文作“死亡”。有些旧译因灾害清单的气候语境将此处理解为“炎热”或“灼热”，但现存吉兹语词形明确支持“死亡”。
    reason: textual_translation_history
lexical_decisions:
- source_word: ወይወፅእ
  choice: 出来
  rationale: 保留风从门中发出的运动意象，也符合现代汉语的自然表达。
- source_word: ቀዳማይ ነፋስ
  choice: 第一股风
  rationale: “第一”保留目录式次序；量词“股”使汉语自然，同时不削弱其作为风的实体意象。
- source_word: እምእልክቱ ኃዋሳው
  choice: 从那些门
  rationale: 保留复数和指示含义，并与本段宇宙图景中的“门”一致。
- source_word: ዘስሙ ጽባሓይ
  choice: 名叫东风
  rationale: 保留命名公式，并将方向名明确表达为风名。
- source_word: በቀዳሚት ኆኅት
  choice: 从第一道门
  rationale: “门”准确保留开口或门户的图景；“道”是现代汉语中合宜的门之量词。
- source_word: እንተ መንገለ ጽባሕ
  choice: 朝东的
  rationale: መንገለ 表示朝向；如此译法既准确又避免生硬的“在东方的路上”。
- source_word: ታጸንኑ ለአዜብ
  choice: 转向南方
  rationale: 该短语有偏转、倾向南方之意；正文采用自然的“转向”，并以脚注保留其解释上的难度。
- source_word: እምኔሃ
  choice: 从这门
  rationale: 阴性单数形式回指前述“门”；明确译出所指对象，比含混的“从那里”更贴近原文。
- source_word: ድምሳሴ
  choice: 荒凉
  rationale: 保留启示文学中土地遭灾、沦为荒芜的严重语气。
- source_word: ናብስት
  choice: 干旱
  rationale: 在有害之风及其后果的语境中，这是自然且具体的汉语表达。
- source_word: ሞት
  choice: 死亡
  rationale: 该词通常明确表示“死亡”；不因上下文中的气候灾害而改译为“炎热”。
- source_word: ሐጕል
  choice: 毁灭
  rationale: 保留末项广泛而强烈的破坏含义，与末世性灾祸语域相符。
theological_decisions:
- issue: 应将灾害清单理解为普通气象现象，还是具有凶险意味的宇宙性灾祸
  choice: 保留“荒凉、干旱、死亡和毁灭”的灾难性排列
  alternative: 将其弱化为一般天气影响，或为求气象一致而把“死亡”改作“炎热”
  rationale: 原文的 ሞት 表示“死亡”，而本书的宇宙秩序能够包含带来死亡与毁灭的风；译文不应为追求现代气象逻辑而消解其启示文学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“门”“东风”及灾祸清单的启示文学意象；以分号和短句减轻原文长串结构在汉语中的生硬感。
