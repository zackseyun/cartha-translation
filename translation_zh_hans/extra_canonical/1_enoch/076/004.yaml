base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/004.yaml
  text: Through four of them come forth winds of blessing and peace[a], and from those eight come forth winds of scourging; when they are sent out, they bring ruin upon all the earth and the water on it, and upon all who dwell on it[c][b], and upon everything that is in the water and on the dry land.
translation:
  language: zh_hans
  text: 有四个门，福乐与平安之风从其中吹出[a]；另有八个门，惩罚之风[b]从其中吹出。这些风一被放出，就摧毁全地和地上的水[c]，以及所有住在地上的，并水中和旱地上的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处“四”据本章所述十二个门的结构校正：四个门发出福乐与平安之风，八个门发出惩治之风。现有吉兹文转录作“三”，很可能将数字“四”误识为“三”。
    reason: textual_note
  - marker: b
    text: “惩罚之风”也可译作“灾祸之风”或“鞭笞之风”；原词含击打、惩治和毁灭性灾害的意思。
    reason: lexical_alternative
  - marker: c
    text: “地上的水”紧随原文措辞，也可理解为与大地相连或分布其上的诸水。
    reason: cultural_note
lexical_decisions:
- source_word: በ፬እምኔሆሙ（据校勘修正；转录作 በ፫እምኔሆሙ）
  choice: 有四个门……从其中
  rationale: 现有转录的数字“三”很可能是对吉兹数字“四”的误读；本章十二门分为四个带来福乐的门和八个带来惩罚的门。介词 በ 表示风经由这些门而出。为使中文指称清楚，按上下文补出“门”。
- source_word: ይወፅኡ
  choice: 吹出
  rationale: 本义为“出来、发出”；主语是宇宙性的风，译作“吹出”既自然又保留动态画面。
- source_word: ነፋሳት
  choice: 风
  rationale: 本章描述各方位门户所发出的气象力量，并非人格化的灵体。
- source_word: በረከት ወሰላም
  choice: 福乐与平安
  rationale: “福乐”保留赐福、 благ惠之意，又比单独的“祝福”更适合修饰风所带来的状态；“平安”对应完整、安宁的含义。
- source_word: እምእልኩ ሰማንቱ
  choice: 另有八个门……从其中
  rationale: 原文直译近于“从那八个”；根据前文门户的枚举补出“门”，并以“另有”清楚呈现四与八的分组。
- source_word: መቅሠፍት
  choice: 惩罚
  rationale: 该词可指击打、灾祸或惩治。正文用“惩罚”保留审判性质，脚注列出更具象的可能译法。
- source_word: ሶበ ይትፈነዉ
  choice: 一被放出
  rationale: 保留被动语态所暗示的外在施动者，而不擅自指明是谁差遣或释放这些风。
- source_word: ይደመስስዋ
  choice: 摧毁
  rationale: 该动词表达彻底破坏；“摧毁”直接而有力，符合启示文学语气。
- source_word: ለኵላ ምድር ወማይ ዘዲቤሃ
  choice: 全地和地上的水
  rationale: 贴近原文“全地及其上的水”，保留此处宇宙观表达，不将“水”解释为特定海域。
- source_word: ኵሉ እለ የኃድሩ ዲቤሃ
  choice: 住在地上的一切生灵
  rationale: 原文为“所有住在其上的”；中文补出“一切生灵”，避免误解为仅指人，同时保持所指范围的开放性。
- source_word: ኵሉ ዘሀሎ ውስተ ማይ ወዲበ የብስ
  choice: 水中和旱地上的一切
  rationale: 保留水与旱地构成的总括性对举，并避免重复添加原文未明确限定的类别。
theological_decisions:
- issue: ነፋሳት 应译为“风”还是“灵”
  choice: 风
  alternative: 灵
  rationale: 门户、方位以及福乐或毁灭作用的语境属于本书天文—气象宇宙观；译作“灵”会不必要地人格化这些力量。
- issue: መቅሠፍት 是否应弱化为一般灾害
  choice: 惩罚之风
  alternative: 灾祸之风；鞭打之风；瘟疫之风
  rationale: 该词含击打和惩治色彩。“惩罚”保留审判张力，但不把它限定为某一种灾害。
- issue: 被释放的风背后的施动者是否应明确
  choice: 保留“一被放出”的被动表达
  alternative: 上帝一放出这些风；天使一放出这些风
  rationale: 原文暗示风受到释放，却未在本节明确指出施动者；不应把可能的神学解释写入正文。
- issue: 首句数字采用转录的“三”还是校勘所得的“四”
  choice: 四
  alternative: 三
  rationale: 本章结构明确涉及十二门，其中四门带来福乐、八门带来惩罚；转录中的 ፫ 很可能是 ፬ 的识别错误。脚注保存抄录差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号和短句保持启示文学的节奏；适度补出两处“门”以明确代词所指，不补明释放风的主体。正文中的所有脚注标记均紧邻相关词句。
