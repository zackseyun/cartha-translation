base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/002.yaml
  text: Three of them are open at the face of heaven[a], and three in the west, and three at the right of heaven[c][b], and three at the left.
translation:
  language: zh_hans
  text: 其中三道敞开在天的正面[a]，三道在西边，三道在天的右边[b]，三道在左边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正面”直译与“脸、面”有关；在古代的朝向观念中，这里也可能指前方，即东方。
    reason: 说明原文的身体方位意象及可能的基本方位含义。
  - marker: b
    text: “右边”和下文的“左边”也可能分别表示南方和北方，取决于这里所采用的朝向。
    reason: 保留方位解释上的真实歧义，不在正文中将其固定为南、北。
lexical_decisions:
- source_word: ፫እም ኔሆሙ
  choice: 其中三道
  rationale: 数词和代词构成部分关系，回指上文所说的一组门户。中文用“其中”表达这一回指；量词“道”与门户相配。
- source_word: ርኅዋት
  choice: 敞开
  rationale: 这里是对门户状态的描述，表示它们处于开启状态；“敞开”比抽象名词“开口”更符合句法和语境。
- source_word: በገጸ ሰማይ
  choice: 在天的正面
  rationale: ገጽ本义为“脸、面”，在空间表达中可指“前面、正面”。“天的正面”既保留拟人化的宇宙图景，也比生硬的“天的脸上”更符合现代汉语。
- source_word: በምዕራብ
  choice: 在西边
  rationale: 直接表达明确的方位，同时使整句的方位列举简洁自然。
- source_word: በየማነ ሰማይ
  choice: 在天的右边
  rationale: 按原文保留“天的右边”这一具象空间说法，不直接解释为南方。
- source_word: በፀጋም
  choice: 在左边
  rationale: 与前面的“右边”形成对称；“天的”可由并列结构自然承接。原文的左、右也可能对应基本方位，但正文不替作者作出解释。
theological_decisions:
- issue: 是否把天的“正面、右边、左边”统一改写为东、南、北等基本方位
  choice: 正文保留原文的身体方位意象
  alternative: 译作“东边、南边、北边”
  rationale: 原文以“面、右、左”描绘宇宙空间。虽然这些词在特定朝向体系中可能分别对应东、南、北，但原句没有把这种解释完全明说；保留意象可避免消除其宇宙观表达和方向上的解释空间。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“天的正面、右边、左边”保留启示文学中具象的宇宙空间语言，同时用脚注交代这些表达可能对应的基本方位。
