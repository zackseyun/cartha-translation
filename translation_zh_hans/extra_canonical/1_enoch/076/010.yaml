base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/010.yaml
  text: And after these[a], winds from the south—whose name is Sea[e][d][c][b], and which come out from the seventh opening that is toward the east—dew comes forth from it.
translation:
  language: zh_hans
  text: 这些以后，南方的风——其名为“海”，并从朝向东方的七个出口出来[a]——露水从那里出来。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其名为‘海’，并从……出来”这一小句在埃塞俄比亚文传本中颇难解，可能反映异文或扩充；本译因所据见证载有此句而予以保留。
    reason: textual_variant
  - marker: b
    text: 所据文本在此附近另有一处带方括号的短语，可能意为“朝向西方”，但其位置和归属不确定，因此未译入正文。
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረ እሉ
  choice: 这些以后
  rationale: 表达顺序推进，也保留“这些”所指对象未明说的原文特点。
- source_word: ነፋሳት
  choice: 风
  rationale: 本段处于方位与气象现象的语境，因此取“风”，不取“灵”。
- source_word: ዘመንገለ መስዕ
  choice: 从南方来的
  rationale: 按方位来源理解，使现代汉语自然，同时保留南方这一明确方位。
- source_word: ዘስሙ ባሕር
  choice: 其名为“海”
  rationale: 直译古代宇宙论中的命名语，不将其解释为“海风”。
- source_word: እም፯ኆኅት
  choice: 从第七个出口
  rationale: 数字形式可理解为序数“第七”；ኆኅት在此指宇宙结构中风所经的开口，以“出口”表达其出入功能。
- source_word: እንተ መንገለ ምሥራቅ
  choice: 朝向东方的
  rationale: 保留原文的方向关系，不进一步构拟空间布局。
- source_word: ይወፅእ እምኔሃ ጤለ
  choice: 露水便从那出口出来
  rationale: 按语法以“露水”为主语；阴性单数后缀指向阴性名词“出口”，且原文没有“如同”的介词。
theological_decisions:
- issue: 南风的宇宙论名称
  choice: 保留“其名为‘海’”
  alternative: 译作“海风”或删去此语
  rationale: 直译能保存启示文学中不寻常的宇宙论命名，也避免用解释性译法消除文本张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“出口”延续本章宇宙门户的具体意象；破折号标示插入性说明。正文只保留对读者确有帮助的文本批判脚注，并确保脚注标记均在正文出现。
