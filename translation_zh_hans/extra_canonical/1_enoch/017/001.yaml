base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/001.yaml
  text: And they took me into a place where those who were there were like burning fire[a], and whenever they wished, they appeared like men.
translation:
  language: zh_hans
  text: 他们把我带到一个地方；那里有一些存在者，仿佛燃烧的火，每逢他们愿意，就显现为人的样子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就使自己显为人的样子。”原文动词可以表示使自身可见、显露出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: 他们把我带到
  rationale: 该动词可表示拿、带或携带；“把我带到”自然地表达异象中的移动，又不限定具体方式。
- source_word: ውስተ አሐዱ መካን
  choice: 到一个地方
  rationale: 原文直译近于“进入一个地方”。现代汉语用“到一个地方”自然清楚，并保留其不定指意义。
- source_word: ኀበ እለ ሀለዉ ህየ
  choice: 那里的人
  rationale: 本句指该处的存在者。译作“那里的人”简洁自然，但不进一步断定他们是天使、灵或守望者。
- source_word: ከመ እሳት ዘይነድድ
  choice: 仿佛燃烧的火
  rationale: 保留原文明确的比拟以及“火燃烧”的复叠式强烈意象。
- source_word: ወሶበ ይፈቅዱ
  choice: 每逢他们愿意
  rationale: 兼顾意愿和可重复发生的时间条件，语体庄重而自然。
- source_word: ያስተርእዩ
  choice: 显现
  rationale: 该形式含使自身可见、显露出来的意味；“显现”比单纯“看起来”更能保留这一主动呈现的语义。
- source_word: ከመ ሰብእ
  choice: 为人的样子
  rationale: 表达其显现所取的人类形态，并与前面的火焰形貌形成对照；不把复数名词过度限定为男性。
theological_decisions:
- issue: 火焰般存在者的身份
  choice: 仅称“那里的人”，不在正文中说明其类别
  alternative: 天使、诸灵或守望者
  rationale: 本节只描写其所在和形貌，并未明确命名其身份；不以较广语境中的可能判断取代本节措辞。
- issue: 显现为人的含义
  choice: 译为“显现为人的样子”
  alternative: “看起来像人”或“让人看见他们如同人”
  rationale: 原文可能强调主动使自身可见。所选译法保留这种意味，同时不判定这是本体变化、外貌变化还是异象中的呈现。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“仿佛燃烧的火”保留原文强烈而略带复叠的异象语言；“人的样子”避免把原文泛指人类的词不必要地限定为男性。
