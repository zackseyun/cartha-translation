    issue: “那里的人”将未命名的存在者限定为人类。
    rationale: 原文的“那些在那里者”没有名词性身份标记；紧接着说他们可显现为人的样子，表明不宜在前句预先称其为“人”。这也与草案所述不认定其为天使、灵或守望者的翻译原则不一致。
