review_pass:
  verdict: revise
  source_fidelity: “那里的人”在现代汉语中通常指人类居民，而原文仅以关系代词指称“在那里者”，且下文特别说他们可显现为人的样子；现译会不当地预设其为人类。应以不界定其类别的措辞处理。其余内容忠实保留了被带往某处、火焰般的形貌、依其意愿而显现，以及人形的比较。
  naturalness: “一些存在者”虽比“那里的人”略正式，但在异象叙事中自然、清楚，并能避免把未命名者译成人类。“仿佛燃烧的火”“每逢他们愿意，就显现为人的样子”均符合现代庄重叙事语体。
  terminology: 不应以“人”称呼未被原文定名的火焰般存在者；“人的样子”则适当传达其所显现的人类形态。脚注准确说明“显现”所可能包含的使自身可见之义。
  issues:
