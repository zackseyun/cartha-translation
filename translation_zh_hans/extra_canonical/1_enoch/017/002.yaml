base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/002.yaml
  text: And they took me to a place of whirlwind[b][a], and to a mountain whose summit reached to heaven.
translation:
  language: zh_hans
  text: 他们带我到一处旋风之地[a]，又带我到一座山[b]；那山的顶峰直达天上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“风暴之地”或“暴风之地”。原词描绘猛烈的空气扰动。
    reason: lexical_alternative
  - marker: b
    text: 这里两次译作“到”的原文介词也可表示“进入”；因此也可译作“进入一处旋风之地，又进入一座山”。
    reason: source_ambiguity
  - marker: c
    text: “天上”也可译作“天空”。原词在此异象语境中可兼有天空和天界的意味。
    reason: theological_lexical_ambiguity
lexical_decisions:
- source_word: ወወሰዱኒ
  choice: 他们带我到
  rationale: 该动词可表示“带、领、带走”；“带我到”自然地表达异象中的移动，同时不限定是引领还是搬运。
- source_word: መካን
  choice: 一处……之地
  rationale: 原词是宽泛的地点用语。“一处……之地”既清楚自然，也保留异象叙事的庄重感。
- source_word: ዘዐውሎ
  choice: 旋风之地
  rationale: 该词传达猛烈的空气扰动；“旋风”比泛称“风暴”更能保留原文鲜明的动态意象，同时在脚注中保留其他可能译法。
- source_word: ደብር
  choice: 山
  rationale: 在异象性的地貌描写中，“山”是准确、简明而自然的现代汉语表达。
- source_word: ዘክተማ ርእሱ
  choice: 那山的顶峰
  rationale: 原文以“头、顶部”指山顶；“顶峰”符合现代汉语习惯，并保留高耸的宇宙性图景。
- source_word: ይበጽሕ እስከ ሰማይ
  choice: 直达天上
  rationale: 该短语表示向上延伸直到天；“直达天上”简洁有力，保留山峰高及于天的异象意象。
- source_word: ውስተ
  choice: 到
  rationale: 与移动动词连用时，该介词可表示“到”或“进入”。在“山”之前译作“到”较自然，也避免误使读者以为人物进入山体内部；其歧义在脚注中保留。
theological_decisions:
- issue: 异象升天语境中 ሰማይ 的译法
  choice: 天上
  alternative: 天空
  rationale: 该词既可指天空，也可指天界。此处的异象语境突出山峰抵达天的边界；“天上”保留这种宇宙性和启示文学色彩，却不加入后期教义细节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“旋风之地”保留启示文学的鲜明意象；分号使两个目的地与随后对山峰的说明层次清楚。未把“天上”解释为特定教义中的天界层次，并以脚注保留介词及 ሰማይ 的真实歧义。
