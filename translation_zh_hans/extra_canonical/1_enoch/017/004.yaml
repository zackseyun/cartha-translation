base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/004.yaml
  text: And they took me as far as the living waters[a], and as far as the fire of the west[c][b], which receives every setting of the sun.
translation:
  language: zh_hans
  text: 他们带我到了活水[a][b]，又到了西方之火；这火接纳太阳每次的落下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活水”之后，所据吉兹语文本另有一个用方括号标出的不确定词，按字面可能意为“说话的”，也可能是讹文；正文未予译出。
    reason: textual_variant
  - marker: b
    text: “活水”也可理解为“有生命的水”或“赐生命的水”；原文直接把这些水形容为“活的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: 他们带我
  rationale: ነሥአ 可表示拿、带、运送；异象旅程的语境强调以诺被带往各处，而不强行判定是搀领还是抬运。
- source_word: እስከ
  choice: 一直来到……那里
  rationale: 重复的 እስከ 表示所到的界限或目的地；这一译法在现代汉语中自然地保留“直到、远至”的空间感。
- source_word: ማያት ሕያዋን
  choice: 活水
  rationale: 原文是“水”与“活的”构成的名词—形容词短语，直译为“活水”比“生命之水”更符合吉兹语语法；同时不在正文中限定它究竟是有生命的水还是赐生命的水。
- source_word: '[ዘይትናገር]'
  choice: 正文不译
  rationale: 此词在所据文本中以方括号标为不确定，按字面可能是“说话的”，但与上下文衔接困难；将问题留在脚注中，避免把疑似讹文强行写入正文。
- source_word: እሳት ዐረብ
  choice: 西方之火
  rationale: ዐረብ 在这里最适合理解为西方或日落之地。“西方之火”保留异象中的宇宙地理意象，也采用庄重而易懂的表达。
- source_word: ዘውእቱ ይነሥእ ኵሎ ዕርበተ ፀሐይ
  choice: 这火承接太阳每一次的沉落
  rationale: 关系从句描绘西方之火接纳太阳落下的过程。“承接”保留 ይነሥእ 的接取意味，“沉落”则比单纯的“日落”更能呈现动态的异象画面。
theological_decisions:
- issue: 如何处理以诺异象中的宇宙景象
  choice: 把“活水”和“西方之火”保留为具体的异象地点与景象
  alternative: 在正文中将它们解释为属灵象征，或改写成普通自然现象
  rationale: 本段呈现启示性的宇宙旅程。译文应保留其具体而陌生的意象，不替作者确定象征含义，也不将其淡化为现代自然描述。
- issue: “活水”的语义张力
  choice: 正文译作“活水”，不限定为“有生命的水”或“赐生命的水”
  alternative: 生命之水；赐生命的水；有生命的水
  rationale: 原文形容水是“活的”，但具体所指可以有不同理解；简洁的“活水”既符合语法，也保留这种开放性。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“西方之火”和“承接太阳每一次的沉落”刻意保留启示文学中具体而奇异的宇宙图景；避免使用解释性较强的宗派术语。
