base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/005.yaml
  text: And I came to a river of fire[a], whose fire flowed like water, and it emptied into the great sea toward the west.
translation:
  language: zh_hans
  text: 我来到一条火河，河中的火像水一样流淌，并向西[a]注入大海。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句直译近似“朝着ʿarab的方向”。这里译作“向西”，因为该表达可以指西方；也有人可能将它理解为地理名称，如阿拉伯。
    reason: 保留መንገለ ዐረብ在方位“西方”与地理名称“阿拉伯”之间的词义可能性。
lexical_decisions:
- source_word: መጻእኩ
  choice: 我来到
  rationale: 采用简洁的第一人称叙事表达，符合异象旅程的行文，也不额外限定行动方式。
- source_word: ፈለገ እሳት
  choice: 一条火河
  rationale: 保留原文直观而奇异的末世异象；“河”也与后文流动并注入大海的描写相合。
- source_word: ዘይውሕዝ እሳቱ ከመ ማይ
  choice: 河中的火像水一样流淌
  rationale: 明确所属关系，并原样保留火如水流动的明喻，不将其解释为象征。
- source_word: ይትከዐው
  choice: 注入
  rationale: 表达水流倾泻、汇入更大水体之意，现代汉语简洁自然。
- source_word: ባሕር ዐቢይ
  choice: 大海
  rationale: 保留传统地理称谓的庄重感；无需强化为“海洋”。
- source_word: መንገለ ዐረብ
  choice: 向西
  rationale: 该短语可指西方或日落方向，且与流入大海的地理语境相合；其可能的阿拉伯地理含义留在脚注说明。
theological_decisions:
- issue: 火河应作为象征解释，还是作为异象中的所见景象来翻译
  choice: 按异象中的所见景象直译为“火河”，并保留火像水一样流淌的描写。
  alternative: 将其解释性译作审判、刑罚或毁灭的象征。
  rationale: 原文描述的是异象旅程中的奇异地貌；翻译不应替读者预先判定其象征意义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“火河”“大海”保留异象语言的凝练和气势；句法自然，不淡化原文的奇异意象。
