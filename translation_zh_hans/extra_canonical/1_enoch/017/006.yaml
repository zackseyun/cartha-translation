base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/006.yaml
  text: And I saw great rivers[a], and I reached as far as the great darkness[c][b], and I went to where no flesh walks.
translation:
  language: zh_hans
  text: 我看见大河，又到了那极大的黑暗之处，并走到凡有血肉的都不行走的地方。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 转录文本末一动词有字符识别疑问；校勘认为其开头应为否定词 ኢ，而非 አ。希腊文本也作“凡有血肉的都不行走”。“凡有血肉的”可指人类，也可泛指有血肉的生灵。
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我看见了
  rationale: 这是异象叙事中常见的“看见”动词；用现代汉语直译，并保留第一人称见闻的推进。
- source_word: ዐበይተ አፍላገ
  choice: 几条大河
  rationale: አፍላገ 是“河流”的复数形式，ዐበይተ 表示宏大；汉语加入量词，使复数自然显明。
- source_word: ወእስከ ዐቢይ ጽልመት በጻሕኩ
  choice: 又到了那大黑暗之处
  rationale: እስከ 表示所达范围或终点，በጻሕኩ 表示抵达；“大黑暗”保留异象地理的强烈而未加解释的意象。
- source_word: ወሖርኩ ኀበ
  choice: 并走到……之地
  rationale: 保留原文另一个行进动词及目的地结构，也维持叙事中重复推进的节奏。
- source_word: ኵሉ ሥጋ
  choice: 凡有血肉的
  rationale: 这是传统闪语式总称，可涵盖人类，也可能广指有血肉的生灵；此译比单说“世人”更能保留范围上的含混。
- source_word: ኢያንሶሱ（转录作 (አ)ያንሶሱ）
  choice: 都不行走
  rationale: 现有转录字符有疑，但校勘意见所指出的否定前缀与希腊旁证 οὐ περιπατεῖ 相符，因此按否定的“行走”译出；汉语用“凡……都不……”保留接近原文的表述。
theological_decisions:
- issue: “凡有血肉的”究竟专指人类，还是包括一切有血肉的生灵
  choice: 凡有血肉的
  alternative: 无人／没有任何生灵
  rationale: 原文的 ኵሉ ሥጋ 是范围宽广的传统表达；不将它缩窄为“人”，也不明确扩展为“一切生灵”，以保留其神学与指称张力。
- issue: 末句是否带否定意义
  choice: 都不行走
  alternative: 都在那里游荡
  rationale: 所给吉兹文转录本身有 OCR 不确定性，而最新校勘指出原字应为带否定前缀的 ኢያንሶሱ；希腊见证“凡有血肉的都不行走”也支持否定读法。采用否定读法，避免把不可进入之地反译为众生游荡之地。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“大黑暗”刻意保留原文浓重而具体的宇宙地理意象；末句稍具经文式节奏，以保存“凡有血肉的”这一传统表达的广度。
