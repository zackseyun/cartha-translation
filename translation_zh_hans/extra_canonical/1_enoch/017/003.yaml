base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/003.yaml
  text: And I saw the places of the lights and of the thunder[a], in the extremities, in the depth, where there was a bow of fire, and arrows and their quiver, and a sword of fire[d][c][b], and all the lightnings.
translation:
  language: zh_hans
  text: 我又看见光和雷霆的所在[a]，在诸尽头，在深处；那里有火之弓、箭和它们的箭囊，又有火之剑，以及一切闪电。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所在”也可译作“库房”。原文把“在诸尽头”和“在深处”写成两个相继的方位短语；它们的确切空间关系并不十分清楚。
    reason: 说明词义选择并保留原文空间表达的含混性。
lexical_decisions:
- source_word: መካናተ
  choice: 所在
  rationale: 此词首先表示地方、处所；上下文虽可能暗示储藏宇宙现象之处，但原词本身未必明确等于“库房”，故正文采用较中性而自然的“所在”。
- source_word: ብርሃናት
  choice: 众光
  rationale: 保留复数和广义发光现象之意，并避免与本节末尾明确出现的“闪电”混同。
- source_word: ነጐድጓድ
  choice: 雷霆
  rationale: 指雷声或雷这一现象；“雷霆”适合异象文体，又不改变其基本意义。
- source_word: ውስተ አጽናፍ
  choice: 在诸尽头
  rationale: 按原文保留独立的空间短语以及“边端、尽头”的复数意味，不与后面的“深处”合并。
- source_word: ኀበ ዕመቃ
  choice: 在深处
  rationale: 保留为第二个独立的方位短语；ኀበ可表示向着或在某处，中文据语境自然译作“在”。
- source_word: ቀሥተ እሳት
  choice: 火弓
  rationale: 直译为“火之弓”；简洁保留武器意象，不将其泛化为风暴现象。
- source_word: ሐጾ ወምጕንጻቲሆሙ
  choice: 箭和盛箭的箭囊
  rationale: 保留弓、箭、箭囊的连续武器意象，并把附着于箭囊的领属关系在中文中说清楚。
- source_word: ሰይፈ እሳት
  choice: 火剑
  rationale: 准确而凝练地保留“火之剑”的末世异象意象。
- source_word: መበርቅት ኵሉ
  choice: 一切闪电
  rationale: 体现“全部”的总括意义；现代汉语通常不需用复数形式表达多次闪电。
theological_decisions:
- issue: 这些宇宙处所的性质
  choice: 正文译作较中性的“所在”
  alternative: 译作“库房”，明确理解为储藏众光、雷霆及闪电的宇宙库藏
  rationale: 武器与气象现象的列举确实可能暗示天上的储藏处，但መካናተ本身也可泛指地方。为避免把一种解释写进正文，采用“所在”，并以脚注交代“库房”的可能译法。
- issue: 空间结构
  choice: 将“在诸尽头”与“在深处”分别保留
  alternative: 合并译作“在最遥远的深处”
  rationale: 原文含两个相继而又有区别的方位表达；分别翻译可保存异象中复杂且略显含混的宇宙空间描写。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。以“我又看见了”承接异象叙事；保留弓、箭、箭囊、剑等鲜明武器意象，不将其解释性改写为一般风暴描写。
