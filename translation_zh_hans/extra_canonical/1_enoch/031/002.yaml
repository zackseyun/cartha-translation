base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/002.yaml
  text: And upon that mountain I saw another mountain[a], and within it were trees; and those trees were full and strong[c][b], like almond trees.
translation:
  language: zh_hans
  text: 我在那座山上又看见一座山[a]，山中有树木；那些树木繁茂而粗壮，像扁桃树一样。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在那座山上又看见一座山”按原文保留。这里的空间关系并不清楚，也可理解为在那座山那里或其区域内看见另一座山。
    reason: textual_ambiguity
  - marker: b
    text: “扁桃树”所译原词也可泛指杏仁或坚果类植物；比较的重点究竟在树种、果实形态，还是树木的繁茂粗壮，并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲበ፡ ውእቱ፡ ደብር
  choice: 在那座山上
  rationale: 保留空间介词与所指对象，也保留异象叙述中略显奇特的地理关系，不擅自改成“附近”或“越过”。
- source_word: ደብረ፡ ካልአ
  choice: 另一座山
  rationale: ካልአ表示另一个或第二个；叙事中译作“另一座”自然且不强行规定编号。
- source_word: ውስቴቱ
  choice: 山中
  rationale: 该词带第三人称单数后缀，回指所见之山，基本义为“在其中”；“山中”在现代汉语中自然，同时保留树木位于山内或山间的空间含混。
- source_word: ዕፀወ / ዕፀው
  choice: 树木
  rationale: 此处所描写的是可见的木本植物，且同一词根重复出现；统一译作“树木”比无根据地区分为“树木”和“植物”更稳妥。
- source_word: እልኩ
  choice: 那些
  rationale: 按指示代词复数理解，修饰后面的“树木”；不采用缺乏词形支持的“我闻到芬芳”一解。
- source_word: ምሉኣን
  choice: 繁茂
  rationale: 基本意义为“充满、丰满、丰盛”。用于树木时，“繁茂”能自然表达生长丰满、枝叶丰盛，同时避免生硬的“充满”。
- source_word: ዘከመ፡ ከርካዕ
  choice: 像扁桃树一样
  rationale: 将ከርካዕ按扁桃或杏仁类树木理解；“扁桃树”比“杏树”更能避免与普通杏树混同。比较范围在原文中并非完全明确，正文保留其可同时关联“繁茂而粗壮”的可能。
- source_word: ጽኑዕተ
  choice: 粗壮
  rationale: 该词表达坚实、强健或硬实。用于树木时，“粗壮”是自然的现代汉语，并保留其强健坚实的形象。
