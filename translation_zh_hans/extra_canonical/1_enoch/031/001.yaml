base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/001.yaml
  text: And I saw other mountains[a], in which there were trees, and from them there came out something like nectar[c][b], whose name was serera and galbanum.
translation:
  language: zh_hans
  text: 我又看见别的山岭[a]，其中有树木；从那里流出一种像甘露般的汁液[b]，名叫“塞雷拉”[c]和“加尔巴努姆”[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“别的山岭”为复数，随后“在它们之中”也使用复数后缀；有些早期译法作“另一座山”。
    reason: textual_grammar
  - marker: b
    text: “甘露”所对应的原词含义并不确定，也可能指甜美的香料、芳香树胶或类似的渗出物。
    reason: lexical_alternative
  - marker: c
    text: “塞雷拉”是音译；这种芳香物或植物的确切种类尚不能确定。
    reason: lexical_alternative
  - marker: d
    text: “加尔巴努姆”是一种芳香树脂，见于古代焚香传统；原词也可音译作“凯尔贝内”。
    reason: cultural_note
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我又看见
  rationale: 保留第一人称异象叙事的常用句式；“又”自然承接前文的连续观看。
- source_word: ካልአነ አደባረ
  choice: 别的山岭
  rationale: 两个词在此均为复数，故译作复数意义的“别的山岭”，不按早期译本处理成单数。
- source_word: ዘቦ ውስቴቶሙ ዕፀወ
  choice: 其中有树木
  rationale: 既反映复数代词“在它们之中”，也采用自然简洁的现代汉语表达。
- source_word: ወይወፅእ እምኔሁ
  choice: 从那里流出
  rationale: 原文前有复数山岭，随后却使用单数代词后缀；“从那里”避免武断指定流出物究竟来自某一座山、诸山或其中树木，同时保留空间图景。
- source_word: ከመ ኔቄጥር
  choice: 一种仿佛甘露的汁液
  rationale: “仿佛”保留比较含义；补出“一种……汁液”使汉语自然，并维持某种具体流出物的意象，而不将其抽象化为香气。
- source_word: ሰረራ
  choice: 塞雷拉
  rationale: 植物或香料的确切鉴定不明，采用音译以免作出未经证实的植物学判断。
- source_word: ከልበኔ
  choice: 格蓬香
  rationale: 该词通常可与古代焚香传统中的 galbanum 对应；采用较具信息性的通行汉语名称，并以脚注说明仍可音译。
theological_decisions:
- issue: 是否把芳香物质的异象改写为泛指的“香气”
  choice: 保留具体流出物：“流出一种仿佛甘露的汁液”
  alternative: 散发出香气；产出香料
  rationale: 原文描绘某物从那里出来，并以一种甜美或芳香物质作比；具体的流出物更能保留异象中的自然奇景，也不额外赋予宗派性解释。
- issue: 单数流出来源与前文复数山岭之间的张力
  choice: 译作“从那里流出”
  alternative: 从那些山岭流出；从其中一座山流出；从那些树木流出
  rationale: 原文“别的山岭”和“在它们之中”为复数，而“从它”带单数后缀。采用不标明数目的汉语处所表达，保存这种语法张力，不擅自确定所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“山岭”兼顾复数群山的景象与汉语自然度；专名加引号以帮助普通读者识别。“从那里”有意保留原文数的一致性问题及指代歧义。
