  text: And when they crush that fruit[c][b][a], it is better than every fragrance.
translation:
  language: zh_hans
  text: 他们把那果子压碎时，它胜过一切香气。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “压碎”据校勘恢复的读法；现存转录文本也可能理解为“拿起”。
    reason: textual_variant
  - marker: b
    text: 末句也可译作“它比一切香料更好”；原文可能特指果子的香味胜过其他香气，而非泛指整体品质。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሔስዎ（据校勘恢复；转录作 ተይነሥእዎ）
  choice: 把……压碎
  rationale: 现有转录疑有OCR讹误；校勘所恢复的动词指揉搓或碾压。结合芳香树木的上下文，译作“压碎”可自然表达借此释放果实香气的动作，同时不采用转录文本可能产生的“拿起”之义而不加说明。
- source_word: ፍሬ
  choice: 果子
  rationale: 该词通常指果实或出产；本节语境明确涉及树木，故译作现代汉语自然的“果子”。
- source_word: ይኄይስ
  choice: 胜过
  rationale: 该未完成式在此表达一般或当下状态；与 እም 构成比较，译为“胜过”比“更好”更凝练，也保留比较关系。
- source_word: እምኵሉ አፈው
  choice: 胜过一切香气
  rationale: 末语虽存在文本困难，但大概是在香味层面作比较。“一切香气”保留复数或集合意义，也符合本章芳香植物的语境。
