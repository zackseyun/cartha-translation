base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/042.yaml
  text: And dogs and foxes and wild boars of the field began to devour those sheep[b][a], until the Lord of the sheep raised up from among them one ram to lead them.
translation:
  language: zh_hans
  text: 狗、狐狸[a]和田野的野猪开始吞吃那些羊，直到羊群的主从羊群中兴起一只公绵羊[b]，来带领它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“狐狸”的动物名称也可能具有较宽泛的犬科食腐、捕食动物含义，因而也可译作“豺”。
    reason: lexical_alternative
  - marker: b
    text: 此处传本或文本辨读较为困难，括号内的异文似乎涉及“另一只羊”。全句的基本意思仍清楚：羊群的主从羊群中兴起一只雄羊作领袖。
    reason: textual_variant
lexical_decisions:
- source_word: አኃዙ
  choice: 开始
  rationale: 此处与后面的“吞吃”连用，表达动作的开始；译作“开始”比字面的“抓住”更符合叙事句法。
- source_word: አክላብ
  choice: 狗
  rationale: 采用普通、宽泛的动物名称，不增添“猎犬”等原文没有的具体含义。
- source_word: ቈናጽል
  choice: 狐狸
  rationale: 该词指狐类食腐或捕食动物，传统上常译作“狐狸”；但也可能涵盖“豺”，故加注保留词义范围。
- source_word: ሐራዊያ ሐቅል
  choice: 田野的野猪
  rationale: 保留原文中野生猪类及田野／旷野环境的完整意象。
- source_word: ይብልዕዎሙ
  choice: 吞吃
  rationale: 比普通的“吃”更能表现捕食和毁灭的暴烈情景。
- source_word: ዝኩ አባግዕ
  choice: 那些羊
  rationale: 保留指示词对前文已出现之特定羊群的指向。
- source_word: እስከ አንሥአ
  choice: 直到……兴起
  rationale: “兴起”自然表达一位领袖被带出并承担使命，同时避免把动作过度解释为正式任命。
- source_word: እግዚአ አባግዕ
  choice: 羊群的主
  rationale: 保留动物启示录中反复出现的神圣称号及权威含义；“羊群”在现代汉语中比“众羊”自然。
- source_word: ፩እምኔሆሙ
  choice: 从它们中间……一只
  rationale: 明确保留这位领袖出自羊群内部这一叙事要点。
- source_word: ሐርጌ
  choice: 公绵羊
  rationale: 准确标明雄性羊，并与泛指羊群的“羊”相区别；现代普通读者也容易理解。
- source_word: ዘይመርሖሙ
  choice: 来带领它们
  rationale: 直接呈现引领、带领之义，不引入原文未明说的“牧养”等附加意象。
theological_decisions:
- issue: 寓言中的神圣称号
  choice: 羊群的主
  alternative: 羊群的主人
  rationale: “主”既保留所有权和权威，也维持这一反复称号的神学分量；“主人”会使语气更偏日常所有关系。
- issue: 领袖被兴起的表述
  choice: 兴起一只公绵羊
  alternative: 立一只公绵羊
  rationale: “兴起”保留原动词“举起／使起来”的幅度，不把神圣介入限定为制度性的任命。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吞吃”维持异象的暴烈感；“羊群的主”保留反复称号；对犬科动物名称及“一只公绵羊”附近的文本疑难分别加注，不在正文中武断消除歧义。
