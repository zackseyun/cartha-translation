base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/061.yaml
  text: And he called to another and said to him[a], “Take note and see all that the shepherds are doing to these sheep[c][b]; for they are destroying among them more than I commanded them.”
translation:
  language: zh_hans
  text: 他召来另一位，对他说：“你要留心察看牧人对这些羊所做的一切；因为他们从羊群中毁灭的羊，比我所吩咐他们毁灭的多得多。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለካልእ
  choice: 另一位
  rationale: ካልእ意为“另一个、另一位”；此处不明说其身份，中文也不作过度限定。
- source_word: ለቡ ወርኢ
  choice: 你要留心察看
  rationale: 前一词涉及用心、留意，后一词是看见、察看；合译既保留双重命令，也符合现代汉语。
- source_word: ኖሎት
  choice: 牧人
  rationale: 保持《动物启示录》中羊群与牧人的寓意图景，避免采用带特定教会职分色彩的称谓。
- source_word: ዲበ እሉ አባግዕ
  choice: 对这些羊
  rationale: ዲበ本有“在……上、向着”等范围；上下文虽显示行为有害，但正文不把敌对意味额外写入介词。
- source_word: ያሐጕሉ
  choice: 毁灭
  rationale: 该动词表达使之败亡、毁坏；“毁灭”保留其强度，又不缩窄为单指宰杀。
- source_word: እምውስተቶሙ
  choice: 从羊群中
  rationale: እም与ውስተ组合具有“从他们中间”的离格、部分意义；明确补出“羊群”可避免中文代词指向含混。
- source_word: ፈድፋደ እምዘ አዘዝክዎሙ
  choice: 远超过我所吩咐他们的
  rationale: 保留比较关系和命令结构，表明牧人越过了所领受的限度。
theological_decisions:
- issue: 牧人罪责的性质
  choice: 牧人所得的命令容许有限度的毁灭，但他们的行为远超命令
  alternative: 牧人只是失职，或本句仅表示数量差异而无道德责备
  rationale: 毁灭动词与“超过我所吩咐”的比较结构共同表明有罪的越界；同时不消除命令本身似乎包含某种毁灭权限这一神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“另一位”保留人物身份的不确定性；“留心察看”兼顾内心注意与亲眼观察；“从羊群中毁灭的”刻意保留原文略显紧缩的部分结构，以表达从群体中除灭成员的含义。
