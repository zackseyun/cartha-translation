base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/006.yaml
  text: And that vessel floated upon the water[a], and all the bulls and elephants and camels and donkeys were swallowed up into the earth; and all the beasts—I could not see them—and they were not able to come out[e][d][c][b], but perished and sank into the depths.
translation:
  language: zh_hans
  text: 那根竖木浮在水上[a]；所有的公牛、大象、骆驼和驴都陷入地中，所有走兽也是如此——我无法看见它们[b]——它们无法出来，终于灭亡，沉入深处[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竖木”所译的埃塞俄比亚语词也可指梁或桅杆；这个异象中究竟是哪一种物件，并不完全确定。
    reason: lexical_alternative
  - marker: b
    text: 现存转写文本在这里似有讹误；按校正后的读法，意思是“我无法看见它们”，而不是“飞鸟看见它们”。
    reason: textual_variant
  - marker: c
    text: “深处”也可译作“深水中”“海中”或“深渊中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: መሥቀር
  choice: 竖木
  rationale: 此词可指直立的木料或梁；在洪水异象中也可能被理解为船上的桅杆。译作“竖木”保留具体形象，同时不把不确定的物件直接认定为船只。
- source_word: ይጼቢ
  choice: 浮在
  rationale: 结合介词短语“在水面上”，此处按漂浮或浮行理解；这样也与随后众兽沉没的叙事形成对照。
- source_word: አልህምት
  choice: 公牛
  rationale: 《动物启示录》中牛类形象具有明确的叙事功能；“公牛”比泛称“牲畜”更具体。
- source_word: ኅሠጥሙ
  choice: 陷入
  rationale: 该动词描写被吞没、沉下的动作；因目的地是“地中”，译作“陷入”自然且不过度扩展。
- source_word: እንስሳ
  choice: 走兽
  rationale: 此处继续列举动物，译作“走兽”既涵盖其余陆生兽类，也避免与前面具体动物名称重复。
- source_word: ስእኑ ወጺአ
  choice: 无法出来
  rationale: 直译其无能力从所陷之处出来的意思，保留受困与灭亡之间的因果张力。
- source_word: ተኃጐሉ
  choice: 灭亡
  rationale: 该词表示毁灭、丧亡；“灭亡”符合灾难性异象的庄重语体。
- source_word: ቀላይ
  choice: 深水
  rationale: 该词可指深处、深水或海域；“深水”保留水灾场景，又不把它明确解释为具有后期教义含义的“无底坑”。
theological_decisions:
- issue: 末句所指是普通深水、海，还是带有宇宙论意味的深渊
  choice: 深水之中
  alternative: 深渊中／海中
  rationale: 原词和异象语境容许较强的末世审判色彩，但不足以确定为专门的宇宙论“深渊”。正文采用中性的“深水”，并以脚注保留其他可能。
- issue: 异象开头的物件是否明确是船或桅杆
  choice: 竖木
  alternative: 桅杆／船
  rationale: 原词首先指向直立木件，而上下文可能使人联想到桅杆；不直接译成“船”，以免把物件身份确定得超过原文证据。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。以破折号标示“我再也看不见它们了”这一插入的第一人称观察，使长串并列关系清晰；避免使用带有特定后期教义色彩的术语。
