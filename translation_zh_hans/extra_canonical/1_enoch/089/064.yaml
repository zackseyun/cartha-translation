base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/064.yaml
  text: And let them not know[a], and do not show them, and do not rebuke them; but write down all the destruction of the shepherds, each one in its time[c][b], and bring all of it up before me.
translation:
  language: zh_hans
  text: 不要让他们知道，也不要让他们看见，也不要责备他们[a]；却要把众牧人的一切毁坏之事[b]，按各自的时候一一记录下来[c]，并把这一切带上来，呈到我面前[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这三个否定动词宜理解为命令或禁止：“不要让他们知道……不要……”。后两个动词是第二人称阳性单数形式，并非“我没有让他们看见／责备他们”。
    reason: grammar
  - marker: b
    text: 原文直译近于“众牧人的一切毁坏（或毁灭）”。上下文可理解为众牧人所造成的毁坏，但原短语本身的属格关系较为简略。
    reason: lexical_ambiguity
  - marker: c
    text: 原文在“各自的时候”之后带有逐一分配的表达，传本文字略显生硬；这里译作“一一”，表示逐个、逐项记录。
    reason: textual_difficulty
  - marker: d
    text: “带上来”所译的动词有“使上升、带上去”之意；也可译作“把这一切呈到我面前”。正文保留向天上呈交记录的空间意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኢያእምሩ
  choice: 不要让他们知道
  rationale: 第三人称复数否定祈愿式表达禁止或阻止之意，宜译为“不要让他们知道”，而非直陈式“他们不知道”。
- source_word: ወኢታርእዮሙ
  choice: 也不要指给他们看
  rationale: 动词意为“使看见、指示”，其第二人称阳性单数形式表明这是对受命者说的话。
- source_word: ወኢትዝለፎሙ
  choice: 也不要责备他们
  rationale: 该词有责斥、斥责之意；“责备”自然且保留审判语境，不把语气过度强化。
- source_word: አላ፡ ጸሐፍ
  choice: 只要……记录下来
  rationale: 转折词与命令式构成从“不干预”转向“记录”的命令；“记录下来”体现书面存案的意味。
- source_word: ኵሎ፡ ሐጕለ፡ ኖላዊያን
  choice: 众牧人的一切毁坏之事
  rationale: “毁坏”保留ሐጕለ的毁灭、败坏语义；较宽松的属格表达不武断判定是牧人所行的毁坏还是临到牧人的毁灭，具体关系交由上下文与脚注说明。
- source_word: በጊዜሁ፡ ለለ፡ ፩፩
  choice: 按各自的时候一一
  rationale: 兼顾时间限定和逐一分配的力量；原文传本措辞略显生硬，中文以“一一”表达逐项核算。
- source_word: ወአዐርግ፡ ኵሎ፡ ኀቤየ
  choice: 并把这一切带上来，呈到我面前
  rationale: “带上来”保留使之上升的空间意象，“呈到我面前”则清楚表达向天上说话者提交记录。
theological_decisions:
- issue: 对牧人的暂不干预
  choice: 将前三个动词译作否定祈愿式命令：不让牧人知道，也不向他们显示或责备他们，转而命令把一切记录下来。
  alternative: 译作过去时直陈句：“他们不知道，我也没有指给他们看，也没有责备他们。”
  rationale: 动词的人称和语气支持命令式理解。这一译法保留经文中延后干预、先行存案的张力，不替文本解释其神学理由。
- issue: “牧人的毁坏”之属格关系
  choice: 正文采用“众牧人的一切毁坏之事”，保留原文关系的简约性。
  alternative: 明确译成“众牧人所造成的一切毁坏”，或“众牧人遭受的一切毁灭”。
  rationale: 上下文倾向于牧人造成的毁坏，但该短语本身没有显明标出施事或受事关系，故不在正文中过度消歧。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“牧人”延续异象中的象征称谓；使用“指给他们看”“记录下来”“呈到我面前”等普通读者易懂的表达，同时保留命令语气、逐项记账和向上呈交的异象图景。
