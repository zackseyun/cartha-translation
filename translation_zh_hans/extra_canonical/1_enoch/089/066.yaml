base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/066.yaml
  text: And the lions and the leopards devoured and swallowed up most of those sheep[a], and the wild boars of the desert ate with them[c][b], and they burned that tower and tore down that house.
translation:
  language: zh_hans
  text: 狮子和豹子吞吃了那些羊中的大多数，把它们咽了下去；旷野的野猪也同它们一起吃。它们焚烧了那座塔，又拆毁了那所房屋。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”在这个异象中很可能象征圣所或圣殿；正文保留原有的建筑形象。
    reason: cultural_note
lexical_decisions:
- source_word: በልዑ፡ ወውሕጡ
  choice: 吞吃……把它们咽了下去
  rationale: 保留两个相连而有递进意味的动词：先吞吃，再咽下，呈现彻底毁灭的捕食意象。
- source_word: መብዝሕቶሙ፡ ለዝኩ፡ አባግዐ
  choice: 那些羊中的大多数
  rationale: 将多数范围明确落在羊群之中，并保留异象中的具体动物形象。
- source_word: አናብስት
  choice: 狮子
  rationale: 该词通常指狮子，无须泛化为猛兽。
- source_word: አነምርት
  choice: 豹子
  rationale: 指豹类大型猫科动物；“豹子”是现代汉语中自然且不作过度细分的表达。
- source_word: ሐራዊያ፡ ገዳም
  choice: 旷野的野猪
  rationale: 兼顾野生猪类和荒野地域两个要素；“旷野”比“沙漠”更能保留未开垦荒地的宽泛意义。
- source_word: በልዑ፡ ምስሌሆሙ
  choice: 也同它们一起吃
  rationale: 原文另起一个带独立动词的分句，主语为野猪；如此翻译避免把野猪并入前一句“吞吃并咽下”的主语。
- source_word: አውዐይዎ፡ ለዝኩ፡ ማኅፈድ
  choice: 焚烧了那座塔
  rationale: 直译建筑物遭火烧的动作，并保留“塔”的异象意象。
- source_word: ከረይዎ፡ ለዝኩ፡ ቤት
  choice: 拆毁了那所房屋
  rationale: “拆毁”自然表达破坏、推倒建筑物；“房屋”保留原词的表层意象，不直接解释为圣殿。
theological_decisions:
- issue: 是否把 ቤት 解释性译为“圣殿”
  choice: 房屋
  alternative: 圣殿／圣所
  rationale: 异象以建筑意象承载象征意义。正文保留“房屋”，不把其可能所指的圣殿直接写入译文，以保存象征层次和解释空间。
- issue: 是否把豹类动物与特定历史政权直接等同
  choice: 仅译作“豹子”
  alternative: 在正文中解释为希腊人／马其顿人
  rationale: 正文应保留异象本身的动物形象，不将一种历史解读写进翻译。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。以分号和句号标明原文两组捕食动作及随后毁坏建筑的层次；避免把“野猪”误作前两个动词的共同主语。
