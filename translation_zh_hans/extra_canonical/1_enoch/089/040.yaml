base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/040.yaml
  text: And I saw the sheep until they entered into a good place[a], and into a pleasant and glorious land; and I saw until the sheep were satisfied[c][b], and that house was in their midst in the pleasant land.
translation:
  language: zh_hans
  text: 我看见羊，直到它们进入一个美好的地方，进入一片宜人而荣美的土地；我又看见羊，直到它们都吃饱了。那座房子[a]就在它们中间，位于那片宜人的土地上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房子”在这个异象的象征图景中，可能指圣所或圣殿。
    reason: lexical_alternative
  - marker: b
    text: 原文在本节末尾再次使用“宜人的土地”这一说法，强调这片土地蒙福、令人喜悦的景象。
    reason: repetition
lexical_decisions:
- source_word: አባግዕ
  choice: 羊
  rationale: 保留《动物启示录》持续使用的动物意象，不将其解释性地改译为“百姓”或“以色列人”。
- source_word: መካን ሠናይ
  choice: 一个美好的地方
  rationale: 按词义保留“地方”与“美好”，表达自然，同时不对地点作过度阐释。
- source_word: ምድር ኃዋዝ
  choice: 宜人的土地
  rationale: 将ኃዋዝ作为修饰“土地”的形容性成分处理，并在本节末尾重复同一译法，以反映原文复现。
- source_word: ስብሕት
  choice: 荣美
  rationale: 该词在此为阴性形式，与“土地”一致，宜理解为形容词；“荣美”兼具荣耀、华美之意，适合异象语体。
- source_word: ጸግቡ
  choice: 吃饱了
  rationale: 原动词表示饱足、得到满足；主语是羊，现代汉语用“吃饱了”自然具体，同时保留供应充足的图景。
- source_word: ቤት
  choice: 房子
  rationale: 原文直称“房子”；正文保留异象本身的象征措辞，不直接解释为圣所或圣殿。
- source_word: ማእከሎሙ
  choice: 在它们中间
  rationale: 兼顾空间上的居中及群体中的临在，且符合现代汉语表达。
- source_word: እስከ
  choice: 直到
  rationale: 两处均保留原文“我看着……直到……”的延续结构，不把异象叙述简化为单纯的完成事件。
theological_decisions:
- issue: 是否在正文中把“房子”明确译为“圣殿”
  choice: 正文保留“房子”
  alternative: 直接译作“圣殿”或“圣所”
  rationale: 在异象语境中，这座房子可能象征圣所或圣殿，但原文使用一般词“房子”。保留该词可避免把象征直接等同于解释，并维持原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“我看着……直到……”的异象叙事结构及“羊”“房子”等象征意象；将修饰“土地”的两个词译为并列形容语“宜人而荣美”，不名词化为“喜悦和荣耀”。脚注标记均已置于正文。
