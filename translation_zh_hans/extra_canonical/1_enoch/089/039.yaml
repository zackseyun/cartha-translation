base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/039.yaml
  text: And I saw until they grew quiet from the outcry for that sheep[a], and they crossed that stream of water. And the other two sheep, which were leading them, stood in place of those who had lain down[e][d][c][b], and they led them.
translation:
  language: zh_hans
  text: 我观看，直到他们渐渐安静下来，不再为那只羊呼号[a]。他们渡过了那道水流[b]。另外两只羊，就是一直带领他们的那两只，站在那些已经躺下的羊的位置上[c]，继续带领他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为那只羊呼号”也可理解为“因那只羊所发的呼号”；原文中介词关系及“羊”的数目所指存在一定歧义。
    reason: lexical_alternative
  - marker: b
    text: “水流”也可译作“河道”或“河流”；原文强调的是流动的水体，未必限定其规模。
    reason: lexical_alternative
  - marker: c
    text: 直译为“站在那些已经躺下者的位置上”。“躺下”在异象的历史寓意中可能指死亡，但正文保留原文较含蓄的说法。
    reason: ambiguity
lexical_decisions:
- source_word: አርመሙ
  choice: 渐渐平息
  rationale: 该动词表示变得安静、止息；“渐渐平息”保留过程意味，也符合前文喧嚷转静的叙事变化。
- source_word: እምጽራኁ
  choice: 呼号
  rationale: 该词可指呼喊、喧嚷或哀号。“呼号”既保留强烈的集体呼喊，也不把情绪过早限定为单纯哀悼。
- source_word: በግዕ
  choice: 羊
  rationale: 保留《动物启示录》的具体动物意象，不在正文中将其解释为某个民族或历史人物。
- source_word: ውሒዘ ማይ
  choice: 水流
  rationale: 原短语泛指流动的水体；“水流”贴近字面，又不武断限定为河流或急流。
- source_word: ካልኤሆሙ
  choice: 另外两只
  rationale: 体现与先前领袖相区别的另一组羊，并保留原文数目。
- source_word: ይመርሕዎሙ
  choice: 一直带领他们
  rationale: 表达关系分句中持续带领的动作；“一直”使现代汉语叙事自然，但不增加身份解释。
- source_word: ተክሎሙ
  choice: 在……的位置上
  rationale: 按“代替、在其位置上”的介词性结构理解，而非误释为“安置、栽下”的动词。
- source_word: ለእለ ሰከቡ
  choice: 那些已经躺下的羊
  rationale: 保留“躺下、倒卧”的表层意象，不直接译成“死去”，以免消除异象语言本身的含蓄。
- source_word: መርሕዎሙ
  choice: 继续带领他们
  rationale: 保留末尾重复的带领动作；“继续”清楚表达两只羊接替后承担领导的叙事顺序。
theological_decisions:
- issue: 是否在译文中解码动物象征
  choice: 保留“羊”及其行动，不加入历史人物或民族名称
  alternative: 将羊直接译释为以色列人、摩西、约书亚等
  rationale: 本段属于持续性的动物异象；正文应保存异象本身的修辞和神学张力，把历史对应留给注释或评述。
- issue: “已经躺下”是否明确译为死亡
  choice: 保留“已经躺下”的含蓄表达
  alternative: 译作“已经死去”或“已经倒毙”
  rationale: 上下文可能暗指死亡，但原词通常表示躺下或倒卧；不在正文中把潜在寓意提升为明说。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。保留异象中反复出现的“羊”和“带领”意象；分句适度拆开，以免原文连续并列结构在中文中显得滞重。
