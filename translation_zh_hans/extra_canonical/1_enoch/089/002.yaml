base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/002.yaml
  text: And again I lifted up my eyes toward heaven[a], and I saw a lofty roof, and seven streams upon it[c][b]; and those streams flowed into an enclosure with much water.
translation:
  language: zh_hans
  text: 我又举目望天，看见一个高耸的顶盖[a]，上面有七道水流；那些水流流入一个有大量水的围场[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“顶盖”的词也可指屋顶、覆盖物或上部构造；异象中具体是什么构造，不能确定。
    reason: lexical_alternative
  - marker: b
    text: “围场”也可译作“院落”或“围起来的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: 又
  rationale: 承接异象叙事，表达动作再次发生，同时符合现代汉语行文习惯。
- source_word: አልዓልኩ አዕይንትየ
  choice: 我举目
  rationale: 保留“抬起眼睛”的异象叙事惯用语，不弱化为单纯的“看”。
- source_word: መንገለ ሰማይ
  choice: 望天
  rationale: 以自然汉语表达原文朝向天空的方向性。
- source_word: ናሕሰ ልዑለ
  choice: 一个高耸的顶盖
  rationale: ናሕሰ可能指屋顶、覆盖物或上部构造；“顶盖”保留覆盖物的基本形象，“高耸”对应高度描述，又避免擅自确定具体建筑类型。
- source_word: ወ፯አስራብ ዲቤሁ
  choice: 上面有七道水流
  rationale: “道”适合修饰水流；“上面”保留其与顶盖之间的方位关系。
- source_word: እልኩ አስራብ
  choice: 那些水流
  rationale: 保留回指前述七道水流的指示意味。
- source_word: ይውሕዙ
  choice: 流入
  rationale: 既表达水的流动，又结合后面的空间短语呈现其流向。
- source_word: በዐጸድ
  choice: 流入一个围场
  rationale: ዐጸድ可指院落、围场或围起来的地方；“围场”保留封闭空间的形象，并便于与后文对同一地点的回指保持一致。
- source_word: ማየ ብዙሐ
  choice: 带着大量的水
  rationale: 直接表达水量丰沛，同时保留“大量的水”与水流动作之间的联系。
theological_decisions: []
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“举目望天”保留异象叙事的节奏；分号呈现连续看见与水流运动两个层次。未把“顶盖”具体化为某类建筑，也未赋予异象元素额外的神学解释。
