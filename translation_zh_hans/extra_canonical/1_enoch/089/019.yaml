base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/019.yaml
  text: And from it I saw the wolves[a], and they became exceedingly strong against the sheep with all their power[c][b], and the sheep cried out.
translation:
  language: zh_hans
  text: 我从那里[a]看见那些狼；它们变得极其强大，以全部力量攻击羊群；羊群便呼喊起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从他那里”或“从它那里”；原文代词后缀的所指须由上下文判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: 从那里
  rationale: እም与第三人称单数后缀构成“从他／它／那里”。汉语正文采用较自然且不过度人格化的“从那里”，并以脚注保留所指对象的歧义。
- source_word: ርኢክዎሙ
  choice: 我看见
  rationale: 符合异象叙事中第一人称观看的常用表达；宾语复数由“那些狼”体现。
- source_word: አዝእብት
  choice: 那些狼
  rationale: 该词是“狼”的复数，而非泛指野兽；保留《动物启示录》的具体动物意象。
- source_word: አፎ
  choice: —
  rationale: 此处按关联副词理解为“如何／怎样”，用来引出狼变得强大的情形；现代汉语无需机械译出，改由后续陈述句自然表达。
- source_word: ጸንዑ ፈድፋደ
  choice: 势力变得极其强大
  rationale: ጸንዑ表示变强、强盛，ፈድፋደ在此作程度强化，意为“极其”，不另译成“增多”。补出“势力”使现代汉语自然，并避免让“狼的身体变强”成为唯一理解。
- source_word: ዲበ አባግዕ
  choice: 攻击羊群
  rationale: ዲበ本可表示“在……上／向着……”，在狼与羊的敌对语境中具有针对、压迫之意；译为“攻击”使关系明确，同时保留动物图景。
- source_word: በኵሉ ኃይሎሙ
  choice: 竭尽全力
  rationale: 准确传达“以它们全部的力量”，也是自然、庄重的现代汉语。
- source_word: አባግዕ ጸርኁ
  choice: 羊群就呼喊起来
  rationale: 保留羊的集体意象；ጸርኁ表示高声呼喊，但未明确是哀号、报警还是求救，故不进一步限定。
theological_decisions:
- issue: 《动物启示录》中的象征性动物意象
  choice: 正文保留“狼”和“羊群”，不直接解释为具体民族、统治者或以色列。
  alternative: 将动物直接释译为攻击以色列的民族或领袖。
  rationale: 本节首先叙述异象所见；保留具体图像可避免把有争议的象征解释写入译文。
- issue: 羊群呼喊的性质
  choice: 译作“呼喊起来”，不说明其呼喊对象或目的。
  alternative: 译作“哀号”“求救”或“向上帝呼求”。
  rationale: 原动词只明确发出响亮呼声；将其限定为哀悼或祈求会超出本句证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。分号呈现“看见”与所见情景之间的层次；“竭尽全力攻击羊群，势力变得极其强大”保留敌对方向、全力施压及程度强化，同时不把象征意象解释成人类群体。
