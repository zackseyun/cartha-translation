base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/030.yaml
  text: And among them I saw the Lord of the sheep[a], standing before them; and they saw that he was great and fearsome and mighty[b], and all those sheep saw him and were afraid before him.
translation:
  language: zh_hans
  text: 我在他们中间看见羊群之主[a]站在他们面前；他的形貌宏伟、可畏而强大[b]。那些羊全都看见了他，因他的面容而惧怕[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊群之主”也可译作“羊群的主人”；在本异象中，这一称号指统管羊群的神圣角色。
    reason: lexical_alternative
  - marker: b
    text: “宏伟”所译的词既可表示形体高大，也可表示地位尊大。
    reason: genuine_ambiguity
  - marker: c
    text: “面容”也可理解为“临在”；原文是说，他们因他的面容或临在而惧怕，并非单纯表示“在他面前”。
    reason: grammar_and_lexical_alternative
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: 羊群之主
  rationale: “እግዚአ”可指主人、主宰；在动物异象中，这一称号指向统管羊群的神圣角色。“羊群之主”既保留其权威意味，也保留异象中的动物意象。
- source_word: ዘቆመ ቅድሜሆሙ
  choice: 站在他们面前
  rationale: 按关系结构和方位词直译，保持异象场景的鲜明与庄重。
- source_word: ራእዩ
  choice: 他的形貌
  rationale: 这里宜理解为由“看见”词根形成并带第三人称后缀的名词，即所见的外貌、形态，而非复数动词“他们看见”。
- source_word: ዐቢይ ወግሩም ወኃያል
  choice: 宏伟、可畏而强大
  rationale: 依次保留“大/伟大”、令人敬畏或恐惧、强有力的含义；“宏伟”在现代汉语中可兼顾形貌规模与尊荣感，不把含义限死为身体高大。
- source_word: ኵሎሙ ዝኩ አባግዕ
  choice: 那些羊全都
  rationale: 保留指示成分“那些”和全称成分“全都”，指向异象中已经出现的羊群。
- source_word: ፈርሁ እምገጹ
  choice: 因他的面容而惧怕
  rationale: “እም”在此标示惧怕所由或所指，并非方位性的“在……面前”；“ገጽ”本义为脸、面容，也可延伸指临在。正文保留具体的“面容”意象，脚注说明其语义范围。
theological_decisions:
- issue: “羊群之主”应作一般主人称号还是神圣称号
  choice: 羊群之主
  alternative: 羊群的主人／羊群的所有者
  rationale: 在《动物启示录》的异象脉络中，此角色是羊群的神圣统治者。“主”保留称号的神学分量，但没有在正文中直接增译“上帝”，因而仍让异象本身表达其身份。
- issue: 如何表达羊群惧怕的对象
  choice: 因他的面容而惧怕
  alternative: 惧怕他的临在／在他面前惧怕
  rationale: 吉兹语介词“እም”不宜误作方位词“在……面前”；但“ገጽ”兼有“面容”和“临在”的可能。正文保留具体意象，脚注呈现替代理解，避免消除语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留动物异象的“羊群”意象，并以“形貌”“可畏”等词维持启示文学的肃穆感；不直接增译角色身份，也不把“宏伟”和“面容”的多义性在正文中完全消解。
