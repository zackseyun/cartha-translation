base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/026.yaml
  text: And when they saw the Lord of the sheep, And when they saw the Lord of the sheep, they turned back so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves. so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves.
translation:
  language: zh_hans
  text: 他们看见羊群的主，就进去[a]，为要从他面前逃跑。那条水道[b]的水汇聚起来，照着它的本性变得湍急；水道里充满了水，水势上涨，直到淹没那些狼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们进入”，但没有说明进入何处。
    reason: 地点宾语在原文中省略；正文用“进去”保留这一未明之处。
  - marker: b
    text: 或译“水沟”“河槽”；此词可能指遇水暴涨的水流通道。
    reason: 原词所指地形范围较宽，不宜在正文中过度限定。
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕት
  choice: 羊群的主
  rationale: 保留所有者、统治者与羊群之间的关系，也维持动物启示录中神圣人物的庄重称谓；不把寓意直接改写成解释性称呼。
- source_word: ገብኡ
  choice: 进到里面
  rationale: 该动词的基本义为“进入”。原文没有说明进入何处，因此中文保留地点未明的特点，不依英语修订稿改成“转身”或单纯“逃跑”。
- source_word: ከመ ይጕየዩ እምቅድመ ገጹ
  choice: 要从他面前逃跑
  rationale: “从他面前”保留闪语式的临在表达及审判场景的力度；“要”自然表达目的关系。
- source_word: ዝኩ ዐይገ ማይ
  choice: 那条水道
  rationale: 该短语可指溪流、水沟或洪水经过的河槽。“水道”既简洁，又不把具体地貌限定得过死。
- source_word: ተጋብአ
  choice: 聚集起来
  rationale: 保留水势汇聚、继而暴涨的动态意象。
- source_word: ከመ ፍጥረቱ ፍጡነ
  choice: 按其本性变得湍急
  rationale: 原句措辞略显特殊，似指水道依其天然特性而迅疾；译文保留“按其本性”，避免过度解释。
- source_word: መልአ ማይ
  choice: 水充满其中
  rationale: 以自然中文表达水道被水充满，同时避免把水道与水完全等同。
- source_word: ተላዐለ እስከ ከደኖሙ ለእልኩ አዝእብት
  choice: 涨了起来，直到淹没那些狼
  rationale: ከደኖሙ 是“遮盖”动词带第三人称阳性复数宾语后缀，后接明确宾语“那些狼”；因此按其语法译为水淹没狼，不另造“狼的遮蔽物”这一歧义。
theological_decisions:
- issue: 动物寓言中神圣统治者的称谓
  choice: 羊群的主
  alternative: 羊群的主人
  rationale: “主”兼顾所有权、统治权与神学分量，同时仍处于动物寓言的意象之内；“主人”虽可行，却会稍微削弱此处庄严的启示文学语域。
- issue: 审判场景中的“面前”惯用语
  choice: 从他面前逃跑
  alternative: 逃离他
  rationale: 原文明确使用“从他面前”的表达。保留该意象可传达神圣临在所引起的恐惧，而不把它淡化为一般性的逃离。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“羊群的主”“从他面前”等启示文学意象；对地点省略和水道名称的词义范围用脚注说明。句式避免英语咨询层中的意外重复，并以吉兹语语法为优先。
