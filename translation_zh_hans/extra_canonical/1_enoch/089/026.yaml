revisions:
- from: 他们看见羊群的主，就进到里面[a]，要从他面前逃跑。那条水道[b]聚集起来，按其本性变得湍急；水充满其中，涨了起来，直到淹没那些狼。
  to: 他们看见羊群的主，就进去[a]，为要从他面前逃跑。那条水道[b]的水汇聚起来，照着它的本性变得湍急；水道里充满了水，水势上涨，直到淹没那些狼。
  rationale: 修订仅改善现代标准汉语的表达和句法衔接。“进去”保留原文的进入动作及未明地点；对水道的描述以“水道的水汇聚起来”和“水道里充满了水”使汉语更顺畅，未将其具体化为某一种地貌，也未改变其后迅疾、上涨和淹没狼的情节。
