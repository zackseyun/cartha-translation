base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/045.yaml
  text: And the Lord of the sheep sent a sheep to another sheep[a], and raised him up so that he might become a ram and might lead the sheep in place of that ram[c][b], which had abandoned his glory.
translation:
  language: zh_hans
  text: 羊群的主差一只羊到另一只羊那里，又把他[a]高举起来，使他成为一只公绵羊，代替那只公绵羊[b]带领众羊；那只公绵羊已经离弃了自己的荣耀[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”通常理解为前面所说的“另一只羊”，但原文在这里仅用单数代词，并未再次明说所指。
    reason: 指代含混
  - marker: b
    text: 原文在此“公绵羊”之后还有一个置于方括号内的“羊”字，可能是后加的说明或存在文本问题；正文未将这个重复词另行译出。
    reason: 文本异文
  - marker: c
    text: “荣耀”也可理解为“尊荣”“威仪”或“光彩”；这里很可能侧重那只公绵羊原有的地位与尊严。
    reason: 词义选择
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: 羊群的主
  rationale: 保留异象中“主”与“羊”的具体关系；用“羊群”表达复数群体，同时不把神圣称谓弱化为一般的“主人”或“管理者”。
- source_word: በግዕ
  choice: 羊
  rationale: 该词在此指普通的羊，不宜为强化与后文“公绵羊”的对比而译作“羊羔”；这样也保持与上下文动物寓言的连续性。
- source_word: ፈነዎ
  choice: 差……到……那里
  rationale: “差”自然表达受权派遣，也符合庄重的叙事语体。
- source_word: አንሥአ
  choice: 高举起来
  rationale: 保留原词兼有抬升与提升地位的形象，不直接解释为“任命”。
- source_word: ከመ ይኩን ሐርጌ
  choice: 使他成为一只公绵羊
  rationale: 明确表达身份或地位的转变，并保留动物异象的具体意象。
- source_word: ይመርሖሙ ለአባግዕ
  choice: 带领众羊
  rationale: 采用中性而自然的“带领”，不把政治和牧养两方面的象征意义限定为其中一种。
- source_word: ህየንተ ዝኩ ሐርጌ
  choice: 代替那只公绵羊
  rationale: 准确表达接替、取代原有领袖的位置。
- source_word: ዘሐደገ ስብሐቲሁ
  choice: 已经离弃了自己的荣耀
  rationale: “离弃”保留动作的主动意味；“荣耀”兼具尊荣、地位和光彩的可能内涵。
theological_decisions:
- issue: 被高举者的身份与代词所指
  choice: 正文保留“他”，并用脚注说明其通常理解为第二只羊
  alternative: 直接译为“又把另一只羊高举起来”或理解为第一只羊
  rationale: 原文使用阳性单数代词，并未在该分句重新点明对象；译文不应无提示地消除这一语法上的含混。
- issue: 领袖形象的表达
  choice: 保留“羊”成为“公绵羊”的动物意象
  alternative: 意译为“领袖”或“君王”
  rationale: 动物启示录以持续的动物象征传达意义；直译意象可避免把具体历史或神学身份直接写入正文。
- issue: “荣耀”的含义
  choice: 正文译作“荣耀”
  alternative: 尊荣、威仪或光彩
  rationale: “荣耀”能保留启示文学中较宽广的神学和象征张力，脚注则交代其也可能侧重地位与尊荣。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“羊—公绵羊”的异象意象，不将其直接解释为具体人物或政治职分；句末另起分句处理关系从句，使中文自然，同时仍清楚指向被取代的公绵羊。
