  text: And the water began to descend into them until the earth was laid bare[a]; and that vessel rested upon the earth, and darkness was removed[d][c][b], and light came to be.
translation:
  language: zh_hans
  text: 水开始流入那些深坑，直到大地显露出来；那艘船停在地上，黑暗被除去，光出现了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译作“有了光”。这里由黑暗转向光明，可能令人联想到创造或复兴，但译文没有刻意套用《创世记》的固定措辞。
    reason: cross_reference
lexical_decisions:
- source_word: ወአንዘ፡ ማይ፡ ይረድ
  choice: 水开始……退去
  rationale: 据校勘意见，ወአንዘ 很可能是 ወአኀዘ（“开始”）的讹写，与未完成式 ይረድ 构成起始表达。“退去”在洪水消退的语境中自然体现向下流动；同时不把英文咨询层的“descend”机械译作“下降”。
- source_word: ውስቴቶሙ
  choice: 往那些深坑里
  rationale: 代词复数承接上一节所开的其他深坑；为使本节单独阅读时指代清楚，将所指对象补明。“里”保留向内部流入的空间意义。
- source_word: ተከሥተ፡ ምድር
  choice: 大地显露出来
  rationale: 表达大地因水退而重新暴露的被动结果，中文自然且不增加受事者。
- source_word: ውእቱ፡ መስቀር
  choice: 那艘船
  rationale: 本句语境要求一个停在地上的先行所述对象；英文审核层作“that vessel”。尽管所给词形与其脚注资料存在明显错位，此处依叙事连续性译为“那艘船”。
- source_word: ተገኅሰት፡ ጽልመት
  choice: 黑暗被除去
  rationale: 保留被动的除去、驱散之意，不具体断定黑暗以何种方式消失。
- source_word: ኮነ፡ ብርሃን
  choice: 光就出现了
  rationale: ኮነ 表示成为或出现。此译法自然保留光开始存在的意义，又避免直接套用《创世记》的固定中文句式。
theological_decisions:
- issue: 末句是否采用《创世记》式固定措辞
  choice: 光就出现了
  alternative: 于是有了光
  rationale: 经文意象可能呼应创造或复兴，但格仪兹文只使用普通的“成为／出现”动词；因此保留互文回响而不作公式化协调。
- issue: 水流入对象是否明示为深坑
  choice: 那些深坑
  alternative: 它们里面
  rationale: 复数代词在上下文中承接前一节的深坑。明示先行词是为现代中文清晰度服务，并未改变异象中的所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“大地”“显露”“被除去”保留异象文学的肃穆感；“往那些深坑里退去”则使洪水消退及代词所指在中文中清楚。所给英文脚注 a 关于“abyss”的说明与当前主文标记位置及本节句法不一致，故未照搬；改以脚注记录末句真实存在的翻译与互文问题。
