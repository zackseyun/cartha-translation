base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/047.yaml
  text: And the first ram pursued that later ram[a], and that later ram rose up and fled from before his face[c][b]; and I saw until those dogs brought down the first ram.
translation:
  language: zh_hans
  text: 第一头公绵羊追赶后来的那头[a]公绵羊；后来的那头公绵羊起来，从它面前逃走了[b]。我一直观看，直到那些狗把第一头公绵羊击倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后来”也可译作“随后”或“后一个”；原词强调它与第一头公绵羊之间的次序。
    reason: lexical_alternative
  - marker: b
    text: “从它面前”原文直译为“从它脸前”，是闪语式说法，意思是从它跟前退逃。
    reason: idiom
lexical_decisions:
- source_word: ሐርጌ
  choice: 公绵羊
  rationale: 该词虽可因语境指野猪或公绵羊，但在《动物启示录》本段连续的象征体系中指带领羊群的公绵羊；译作“公绵羊”也与上下文中两位领袖的形象一致。
- source_word: ቀዳማዊ
  choice: 先出现的
  rationale: 表示与后一个形象相对的次序；“先出现的”比单说“第一头”更自然，同时不强加身份解释。
- source_word: ዳሓራዊ / ዳሕራዊ
  choice: 后来那头
  rationale: 与“先出现的”构成顺序对照，保留“后来、随后”的含义，而不武断译成“最后”或严格编号的“第二”。
- source_word: ሰደዶ
  choice: 追赶
  rationale: 表达主动追逐，符合异象叙事中一只动物追迫另一只动物的动态。
- source_word: ተንሥአ
  choice: 起来
  rationale: 保留“起来、起身”的动作，并自然衔接随后的逃走。
- source_word: ነፍጸ
  choice: 逃走
  rationale: 语境是受追赶者从对方面前退逃；“逃走”明白自然，又不额外加入是否成功脱险的含义。
- source_word: እምቅድመ ገጹ
  choice: 从它面前
  rationale: 原文直译为“从它脸前”；正文采用现代汉语自然说法，同时脚注说明其闪语式字面表达。
- source_word: አክላብ
  choice: 狗
  rationale: 该复数名词直接指狗；没有必要具体化为猎犬。
- source_word: አውደቅዎ
  choice: 扑倒
  rationale: 使役动词表示使之倒下；在狗攻击公绵羊的动物场景中，“扑倒”自然保留暴力动作，又不预先断定死亡。
theological_decisions:
- issue: 政治性末世异象中的动物象征
  choice: 正文保留“公绵羊”和“狗”的动物形象，不直接替换为历史人物、君王或民族。
  alternative: 在正文中把动物直接解释为扫罗、大卫或其他历史行动者。
  rationale: 异象以持续的动物象征展开；翻译应保存文本自身的修辞和可能的张力，把具体历史辨认留给注释或评注。
- issue: ሐርጌ 在本节究竟指公绵羊还是野猪
  choice: 按本段动物象征的上下文译作“公绵羊”。
  alternative: 按该词另一词义译作“野猪”。
  rationale: 该词存在词义分支，但本节所说的是先后带领羊群的同类动物；上下文支持“公绵羊”，而非本章另有表达的野猪形象。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。以“先出现的／后来那头”自然呈现次序对照；保留异象中的动物意象，不在正文中解码历史身份。所有脚注标记均置于正文对应处。
