base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/067.yaml
  text: And I grieved greatly because of the tower[a], for that house of the sheep had been torn down[e][d][c][b]; and from among them I was not able to see whether those sheep entered that house.
translation:
  language: zh_hans
  text: 我因那围栏[a]而极其悲伤，因为那羊的房屋已经被拆毁[b]；我无法看出那些羊是否进入了那房屋[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “围栏”也可译作“圈”或“羊圈”。原文在此使用“围栏”，随后又称其为“羊的房屋”；正文保留这两种意象。
    reason: lexical_alternative
  - marker: b
    text: “被拆毁”所译的动词也可理解为“被挖毁”“被夷平”或“被移除”。
    reason: lexical_alternative
  - marker: c
    text: 末句的结构较难确定；也可能是说，见异象者根本看不见那些羊，或看不见那些进入房屋的羊。
    reason: alternative_reading
lexical_decisions:
- source_word: ወሐዘንኩ፡ ብዙኃ፡ ጥቀ
  choice: 我……极其悲伤
  rationale: 保留第一人称异象叙述，并用“极其”体现双重强化语气。
- source_word: ማኅፈድ
  choice: 围栏
  rationale: 该词指供牲畜使用的围合之处；“围栏”既自然，又不把意象过早限定为“羊圈”，并与下文“羊群的房屋”形成对应。
- source_word: ተከርየ
  choice: 已经被拆毁
  rationale: 此被动动词用于建筑时可表示被挖毁、夷平或拆除；“被拆毁”在现代汉语中自然，并保留建筑遭破坏的具体意象。
- source_word: ቤት ዘአባግዐ
  choice: 羊群的房屋
  rationale: 直译属格结构，保留动物启示录中“房屋”的建筑意象，不将其与“围栏”合并为单一的“羊圈”。
- source_word: ኢክህልኩ ርእዮቶሙ
  choice: 我……无法看见
  rationale: 同时表达能力上的不能与视觉上的看见，符合异象叙述。
- source_word: ለእልኩ አባግዕ
  choice: 那些羊
  rationale: 保留指示语气，指回异象中的特定羊群。
- source_word: ይበውኡ ኀበ ዝኩ ቤት
  choice: 是否进入了那房屋
  rationale: “进入”准确表达向内运动，“那房屋”保留原文指示成分；以“是否”呈现句末从句的一种自然句法理解。
theological_decisions:
- issue: 羊群所在结构应统一译作“羊圈”，还是保留两种意象
  choice: 分别译作“围栏”和“羊群的房屋”
  alternative: 将两者都归并为“羊圈”
  rationale: 原文先后使用不同词语。保留两种相关但不完全相同的意象，可避免把启示文学的象征结构解释得过于确定。
- issue: 羊群房屋所受破坏的性质
  choice: 已经被拆毁
  alternative: 已经被挖毁／被夷平／被移除
  rationale: 建筑语境支持拆除、夷毁之义；“拆毁”兼顾原文的具体破坏感和现代汉语的自然表达。
- issue: 末句的句法范围
  choice: 无法看见那些羊是否进入那房屋
  alternative: 根本无法看见那些羊；或无法看见那些进入房屋的羊
  rationale: 原文末句结构存在困难。正文采用上下文中较连贯的疑问从句理解，但以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“极其悲伤”保留强烈哀痛；“围栏”与“羊群的房屋”刻意不统一，以保存原文的启示文学意象。
