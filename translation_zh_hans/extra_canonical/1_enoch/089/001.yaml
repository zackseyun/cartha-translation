base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/001.yaml
  text: And one of those four went to that white bull and taught him a mystery[a], while he was not trembling; and that bull was born and became a man, and built for himself a great vessel and dwelt upon it. And three bulls were with him on that vessel[c][b], and they were covered over above them.
translation:
  language: zh_hans
  text: 那四位中的一位走到那头白公牛那里，向它传授了一个奥秘；当时它没有战抖。[a]那头公牛出生，成了人；它为自己建造了一艘大船，并住在船上。另有三头公牛和它一同在那艘船上；[b]它们上方有遮盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本作“当它正在战抖时”；但现有吉兹语文本含否定词，直译为“当它没有战抖时”。
    reason: textual_variant
  - marker: b
    text: 这艘“大船”可对应洪水叙事中的船，但本异象仍以动物象征来讲述；因此正文没有直接称其为“方舟”，也没有点明人物姓名。
    reason: cross_reference
lexical_decisions:
- source_word: ፬ሖረ
  choice: 走到……那里
  rationale: 保留朝向白公牛移动的方向感，不额外限定为靠近或来到。
- source_word: ላህም ጸዓዳ
  choice: 白公牛
  rationale: 该词指牛类；上下文中的象征人物为男性，故用“公牛”，同时保留动物异象的表达。
- source_word: መሀሮ ምሥጢረ
  choice: 把一个奥秘教给它
  rationale: 兼顾动词的教导意味与名词所指的隐秘知识；不将其过度解释为单纯启示。
- source_word: እንዘ ኢይርዕድ
  choice: 那时它并没有战抖
  rationale: 现有吉兹语文本明确含否定词ኢ，故保留否定；“战抖”对应因惧怕而颤抖的动词含义。
- source_word: ተወልደ ወኮነ ሰብአ
  choice: 出生后变成了人
  rationale: 明确保留从动物形象转变为人的异象性变化，并使现代汉语语序自然。
- source_word: መስቀረ ዐቢየ
  choice: 一艘大船
  rationale: 语境表明是洪水中的大型舟船；不用“方舟”，以免在正文中提前消解象征图像。
- source_word: ነበረ ዲቤሃ
  choice: 住在船上
  rationale: 介词具有“在……上”的空间意义；“住”自然传达持续居留。
- source_word: ፫አላህምት
  choice: 三头公牛
  rationale: 延续本段牛类象征，并与所代表的男性人物相符。
- source_word: ተከድኑ ላዕሌሆሙ
  choice: 它们上方都被遮盖起来
  rationale: 保留被动结构和上方覆盖的空间关系，也保留异象叙述略显奇特的质感。
theological_decisions:
- issue: 是否在译文中直接点明该人物是挪亚，并把船称为方舟
  choice: 保留公牛变成人及建造大船的异象图像，不在正文中点名挪亚
  alternative: 直接译作挪亚建造方舟
  rationale: 本节明显影射洪水叙事，但原文以动物异象呈现；译文不应把象征叙述改写成直接的历史身份说明。
- issue: 白色牛类及另外三头牛的性别表达
  choice: 译为“白公牛”和“三头公牛”
  alternative: 译为“白母牛／小母牛”和“三头母牛”
  rationale: 吉兹语词项本身可泛指牛类，但此处象征男性人物；用公牛避免造成与叙事身份相冲突的女性性别含义，同时不在正文中点明人物姓名。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“奥秘”保留启示文学色彩；动物一律用量词“头”。末句略保留原文陌生的异象质感，不改写成更具体的船舱或船顶结构。
