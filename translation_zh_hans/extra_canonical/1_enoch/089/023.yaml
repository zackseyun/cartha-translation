base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/023.yaml
  text: And the wolves began to pursue those sheep until they overtook them at a spring of water[a][b].
translation:
  language: zh_hans
  text: 狼群开始追赶那些羊，直到在一处水泉旁追上了它们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水泉”也可译作“水池”；原文指一处有水的地点，具体形态并不完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: አዝእብት
  choice: 狼群
  rationale: 该词在动物异象中指狼；保留具体动物形象，不将其直接解释为某一历史群体。
- source_word: አሐዙ ይትልውዎሙ
  choice: 开始追赶
  rationale: አሐዙ 在后接动作时可表达起始，ይትልውዎሙ 在此语境中是带敌意的尾随或追逐；“开始追赶”自然保留两层意思。
- source_word: ዝኩ አባግዕት
  choice: 那些羊
  rationale: 保留指示词，明确所指是异象叙事中先前出现的那群羊。
- source_word: እስክ ተረክብዎሙ
  choice: 直到……追上了它们
  rationale: ረከበ 的基本义为找到、到达或追上；追逐语境中“追上”最贴切，不采用缺乏词义依据的“赶入”。
- source_word: በአሐቲ ዐይገ ማይ
  choice: 在一处水泉旁
  rationale: በ 在此表示所在位置，宜译“在……旁”，而非表示趋向的“进入”；ዐይገ ማይ 可指水泉一类的水域地点。
theological_decisions:
- issue: 动物异象的象征表达
  choice: 正文按字面译作狼和羊
  alternative: 直接解释为埃及人和以色列人
  rationale: 原文以持续的动物意象叙事；翻译应保留意象及其张力，不在正文中把象征对象解释出来。
- issue: 追赶结束时羊群与水域的关系
  choice: 狼在水泉旁追上羊群
  alternative: 狼把羊群赶进水中
  rationale: 动词表示“追上”，介词在此表示地点；译为“赶进水中”既超出词义，也会提前改变后续叙事的次序。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“狼群”使复数意义在汉语中自然明确；“追赶……追上”保留原文动作的连续推进。
