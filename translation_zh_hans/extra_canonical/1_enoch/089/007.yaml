base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/007.yaml
  text: And again I saw in the vision, until all the streams withdrew from that lofty roof, and the fissures of the earth were leveled, and other abysses were opened.
translation:
  language: zh_hans
  text: 我又在异象中看见，直到所有水流都从那高耸的顶盖退去；地上的裂缝被填平，另有深渊敞开。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕራብት
  choice: 水流
  rationale: 依英语校勘层及洪水退去的语境处理为复数“水流”；该词在当前来源中的确切形态与词义仍有文本层面的不确定性，故不具体化为溪流或沟壑。
- source_word: ናሕስ
  choice: 顶盖
  rationale: 按其在动物启示录洪水图景中的空间意象译为“顶盖”，既保留覆盖于上的形象，也避免现代建筑意味过强的“屋顶”。
- source_word: ልዑል
  choice: 高耸的
  rationale: 保留“高、高起”的基本意义，并以自然汉语修饰“顶盖”。
- source_word: ዐረዩ
  choice: 被填平
  rationale: 在裂缝这一宾语搭配中表达变平、平复之意；比笼统的“消失”更贴近所描绘的地貌变化。
- source_word: መዓምቃት
  choice: 深渊
  rationale: 保留“深处、深渊”的强烈宇宙性意象，与洪水叙事中的地下水域相称。
- source_word: ተፈትሑ
  choice: 敞开
  rationale: 采用被动/不及物结果表达，忠实呈现“被打开、开启”，不补出施事者。
theological_decisions:
- issue: “高耸的顶盖”所指对象
  choice: 不明说是天穹、方舟或其他具体对象
  alternative: 译作“高高的天穹”或“高大的方舟顶”
  rationale: 原文意象本身并未在本节明确辨认对象；保留“顶盖”可避免把一种解释写入正文。
- issue: 深渊开启的施事者
  choice: 使用“敞开”，不注明是谁开启
  alternative: “上帝开启了另一些深渊”
  rationale: 原文为被动形式，没有明示施事者；不宜凭神学推断补入。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“我又在异象中观看”保留先知异象公式；分号呈现三个连续但彼此分明的景象。未设置脚注，因此正文无脚注标记。
