base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/010.yaml
  text: 'And they began to bring forth the beasts of the field and the birds[a]; and from among them there came forth every kind of the nations: lions, leopards, wolves, dogs, hyenas, wild boars, foxes, swine, falcons, vultures, kites, eagles, and ravens[c][b]; and in their midst a white bull was born.'
translation:
  language: zh_hans
  text: 它们开始生出田野的走兽和飞鸟；从它们中间出现了各类民族[a]：狮子、豹子、狼、狗、鬣狗、野猪、狐狸、野兔、家猪、隼、秃鹫、鸢、鹰和乌鸦[b]；在它们中间，一头白公牛出生了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各类民族”原文较难理解，也可译作“各种民族”或较笼统的“各种类别”；但原文确有“民族、列国”一词。
    reason: lexical_alternative
  - marker: b
    text: 本节若干动物名称的具体物种不能完全确定：“鬣狗”和“狐狸”也可能分别译作“胡狼”；“隼”也可理解为“鹰隼”，“乌鸦”也可泛指鸦类。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሐዙ፡ ይለዱ
  choice: 开始生出
  rationale: 保留“开始”所表达的动作起点，也保留生育、产生的含义；不把这些象征性动物一概限定为生物学意义上的母兽。
- source_word: አራዊተ፡ ገዳም፡ ወአዕዋፈ
  choice: 田野的走兽和飞鸟
  rationale: “田野的走兽”保留原文庄重的圣经式表达；“飞鸟”对应一般性的鸟类称呼，不增添原文没有的“天空”。
- source_word: ዘእምኵሉ፡ ኅብር፡ አሕዛብ
  choice: 各色各样的民族
  rationale: 短语结构较难确定；“各色各样”传达类别或种类的多样性，“民族”则明确保留原文确有的አሕዛብ（民族、列国），不把整句弱化成单纯的动物分类。
- source_word: አጽባዕት
  choice: 鬣狗
  rationale: 这是可能的传统物种辨识，但也可能指胡狼；正文采用较常见的“鬣狗”，脚注保留不确定性。
- source_word: ሐራዊ፡ ገዳም
  choice: 野猪
  rationale: 该复合表达指野生的猪或公猪；“野猪”简洁自然，并与后面的家猪相区别。
- source_word: ቂናጽል
  choice: 狐狸
  rationale: 物种辨识并不完全确定，也可能是胡狼；正文采用常见译法，脚注说明异译。
- source_word: ገሐያት
  choice: 野兔
  rationale: 该词应指兔或野兔；采用“野兔”以符合兽类清单的语境，并纠正旧译“松鼠”。
- source_word: ላህም፡ ጸዓዳ
  choice: 一头白公牛
  rationale: 直译动物的性别和颜色；“公牛”也延续本段动物异象的象征性叙事用语。
theological_decisions:
- issue: 兽类清单与民族的象征关系
  choice: 在正文中明确译出“民族”
  alternative: 只译作“各种动物”或“各类”
  rationale: 原文含有አሕዛብ（民族、列国）；以“民族”呈现，可保留《动物启示录》中动物与人类群体之间的象征张力，却不进一步指定每种动物究竟对应哪个民族。
- issue: 白公牛的身份
  choice: 仅按原文译为“白公牛”
  alternative: 在正文中解释为某一特定人物或群体
  rationale: 本节本身没有明说其身份；正文不引入解释传统，以免把异象保有的含混性提前消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；动物名称尽量使用普通读者熟悉的现代汉语词汇。分号保留原文从生育、民族兽群清单到白公牛出生的三段推进。
