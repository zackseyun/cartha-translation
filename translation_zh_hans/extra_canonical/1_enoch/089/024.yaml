base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/024.yaml
  text: And that pool of water was split[a], and the water stood on this side and on that side before their faces; and their Lord, while he was leading them[e][d][c][b], stood between them and the wolves.
translation:
  language: zh_hans
  text: 那水池分开了，水在他们面前两边立住；他们的主[a]领着他们时，站在他们和群狼之间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的主”可指异象中羊群的领袖，也可能有意与上帝的引导相重叠；原文没有把这一层寓意完全说明。
    reason: theological_ambiguity
lexical_decisions:
- source_word: ዐይገ፡ ማይ
  choice: 水池
  rationale: 按本段反复出现的具体水体意象译为“水池”，并与经审定的上下文用语保持一致；不笼统译作“水”。
- source_word: ተሠጠ
  choice: 分开了
  rationale: 该动词表示被分开、裂开；“分开了”自然清楚，也保留出埃及式异象画面。
- source_word: ቆመ፡ ማይ
  choice: 水……立住
  rationale: 保留原文“站立”的具象表达，表现水被维持在原处，而不弱化为仅仅“停下”。
- source_word: እምዝየ፡ ወእምዝየ
  choice: 一边一边地
  rationale: 表达水分立两侧的空间关系；中文简洁而不额外规定左右方向。
- source_word: በቅድመ፡ ገጾሙ
  choice: 在他们面前
  rationale: 原义为“在他们的脸面前”；现代汉语用“在他们面前”自然传达同一空间关系。
- source_word: እግዚኦሙ
  choice: 他们的主
  rationale: 保留权柄称谓，同时不以专名或“上主”等措辞预先判定其在寓言层面的确切身份。
- source_word: እንዘ፡ ይመራሖሙ
  choice: 领着他们时
  rationale: 表达动作同时发生及引领的持续状态，符合该分词式结构。
- source_word: ቆመ፡ ማእከሎሙ፡ ወማእከለ፡ አዝእብት
  choice: 站在他们和群狼之间
  rationale: 第二个“站”以“他们的主”为主语；“在……之间”准确呈现隔开羊群与狼群的关系。
theological_decisions:
- issue: “他们的主”的所指及大小写所承载的解释
  choice: 正文译作“他们的主”，不直接替换为“主上帝”或其他明确神名，并加注保留歧义
  alternative: 明确译作“主”并认定直接指上帝，或译作“主人”并仅指羊群的领袖
  rationale: 句法上“他们的主”是第二个“站”的主语，但其寓言所指可理解为羊群领袖，也可能与神圣引导有意重叠。中文无大小写区别，因此以脚注明示这一真实张力，避免擅自定论。
- issue: 第二个“站”的主语
  choice: 以“他们的主”为主语
  alternative: 以水为主语，理解为水立在羊群与狼群之间
  rationale: 原文在第二个ወቆመ之前明列ወእግዚኦሙ，最自然的句法是“他们的主……站在……之间”；这也避免把该名词误接为“在……面前”的宾语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“水……立住”略带异象性的陌生感，是为保留原文重复使用“站立”一词的画面。脚注标记已置于正文相应位置。
