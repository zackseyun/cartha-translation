base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/009.yaml
  text: And that white bull[a], which had become a man, went out from that enclosure, and with him came three bulls. And one of those three bulls was white, resembling that white bull, and one of them was red like blood, and one was black[c][b]; and that white bull departed from among them.
translation:
  language: zh_hans
  text: 那只已经变成人的白公牛，从那艘船[a]里出来；三只公牛也和它一同出来。那三只公牛中，一只是白色的，样子像那只公牛；一只红得像血，另一只是黑色的。后来，那只白公牛离开了它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄录文本此处的末词作 መስቀር，词形可疑；很可能是 መርከብ（“船、舟”）的误读。前文洪水和船停在地上的叙述也支持“船”这一读法。
    reason: textual_variant
lexical_decisions:
- source_word: ላህም
  choice: 公牛
  rationale: 此词指雄性牛；“公牛”既保留异象中反复出现的动物形象，也比泛称“牛”更具体。
- source_word: ጸዐዳ
  choice: 白色的
  rationale: 直译颜色词，保留异象中白、红、黑三色的象征性对照。
- source_word: ዘኮነ ብእሴ
  choice: 已经变成人的
  rationale: 保留“成为、变成”的转变含义，并用“已经”体现相对于本节后续动作的先行状态。
- source_word: ወጽአ እምዝኩ መስቀር
  choice: 从那艘船里出来
  rationale: 抄录本末词词形可疑，但很可能是“船、舟”（መርከብ）的误读；前文洪水及船停在地上的语境也支持此义。正文采用自然且不过度解释人物身份的“那艘船”，并以脚注说明文本问题。
- source_word: ፪አልህምት
  choice: 三只公牛
  rationale: 依句法、叙事和经校订的读法，此处是随它出来的三只公牛；量词“只”符合现代汉语动物计数习惯。
- source_word: ጸዐዳ ይመስሎ ለዝኩ ላህም
  choice: 一只是白色的，样子像那只公牛
  rationale: 明确让“白色的”修饰三只公牛中的第一只，同时保留它与先前那只公牛相像的独立陈述，避免把颜色误转移到比较对象上。
- source_word: ቀይሕ ከመ ደም
  choice: 红得像血
  rationale: 保留原文明确的明喻及鲜明的末世异象色彩。
- source_word: ጸሊም
  choice: 黑色的
  rationale: 直接表达基本颜色义，与白色和血红色形成清楚对照。
- source_word: ኀለፈ እምኔሆሙ
  choice: 离开了它们
  rationale: 该动词可表示经过、离去，也可能在某些语境中指逝去；此处采用不明说死亡的“离开”，保留叙事所表达的分离而不增添解释。
theological_decisions:
- issue: 变成人的白公牛及三只公牛的身份
  choice: 正文只保留异象本身的动物与人物转换形象，不点明其历史人物身份。
  alternative: 将白公牛直接解释为挪亚，并把三只公牛解释为他的三个儿子。
  rationale: 这些身份可由《动物启示录》的上下文推断，但原节以象征形象叙述；译文不应把释义取代异象本身。
- issue: 白公牛“离开”是否明确表示死亡
  choice: 译作“离开了它们”，不明确判定为死亡。
  alternative: 译作“在它们中间去世了”或“从它们中间消逝了”。
  rationale: 原动词语义范围包括经过、离去，并可延伸为逝去；本节本身没有把死亡含义完全说透，故保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以“公牛”维持整段异象的动物意象；用“它”指称仍以公牛形象出现的主体，不因其曾变成人便擅自改用人物称谓。分号用于清楚区分出船、三色公牛和最后离开的连续画面。
