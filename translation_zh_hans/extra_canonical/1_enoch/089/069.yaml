base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/069.yaml
  text: And beyond their prescribed measure they kept killing and destroying[d][c][b][a], and I was weeping and crying out because of those sheep.
translation:
  language: zh_hans
  text: 他们超出所规定的限度[a]，不断杀戮、毁灭；而我因那些羊不断哭泣、呼号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所规定的限度”也可译作“所定的数额”或“所定的秩序”；原词可指秩序、规定、法则或既定额度。
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈድፋደ እምሥርዓቶሙ
  choice: 越过所规定的限度
  rationale: ፈድፋደ 与 እም 连用表达超越、过量；ሥርዓት 具有秩序、规定、法则或定额的含义。译作“越过所规定的限度”既保留权威规定的意味，也不把语义缩窄为单纯的数目。
- source_word: ይቀትል
  choice: 不断杀戮
  rationale: 未完成体在异象叙事中可表达持续或反复的行动；“不断”传达其延续性，“杀戮”符合此处暴力语境。
- source_word: ያሐጕል
  choice: 毁灭
  rationale: 该词形的文本见证及具体语义不够确定，但显然指向破坏、使之败亡；“毁灭”保留其广泛的破坏性而不过度具体化。
- source_word: ወአነ፡ እንዘ፡ እብኪ፡ ወአዐውዩ
  choice: 我则……不断哭泣呼号
  rationale: 此处 እንዘ（抄录作 እንዝኩ）与未完成体动词构成持续性表达，并无“睡觉”一词。“哭泣呼号”同时保留流泪与出声哀号。
- source_word: አባግዕ
  choice: 羊
  rationale: 保留《动物启示录》的异象意象，不在正文中将其解释为以色列、犹大或某一群人。
theological_decisions:
- issue: 是否在正文中把“羊”明释为以色列或犹大
  choice: 保留“羊”的异象意象
  alternative: 译作“那些人”或“以色列”
  rationale: 原文以动物形象承载启示性象征；翻译应保留该象征及其解释空间，而不把诠释直接写入正文。
- issue: 牧人所越过的是单纯数额还是带权威性的规定
  choice: 译作“所规定的限度”
  alternative: 译作“数目”或“次序”
  rationale: ሥርዓት 的语义包含秩序、法则、规定及定额；上下文虽可能涉及获准杀死的数量，却仍有违反既定命令的意味，因此不宜只译成“数目”。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“不断……不断……”呈现未完成体的持续或反复意味；用分号清楚区分施暴者的行动与异象观看者的哀哭。脚注标记已置于正文。
