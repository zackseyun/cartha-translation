base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/059.yaml
  text: And he summoned seventy shepherds and gave over those sheep to them, that they might pasture them. And he said to the shepherds and to their companions, “From now on, each of you shall pasture the sheep, and do all that I command you.”
translation:
  language: zh_hans
  text: 他召来七十个牧人，把那些羊交给他们，让他们牧养。他对牧人和他们的同伴[a]说：“从今以后，你们七十人都要牧养这些羊[b]，并要照我所吩咐你们的一切去做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同伴”所指不很确定；原词可能指与这些牧人相联或随同他们的对象。
    reason: lexical_alternative
  - marker: b
    text: 原文在这里再次明确说“七十”，即“你们七十人都”；这也可理解为强调其中每一个人。
    reason: textual_explicitness
lexical_decisions:
- source_word: ጸውዐ
  choice: 召来
  rationale: 表达正式召集和委任的语境，比一般的“叫”更庄重，又不添加原文没有的礼仪意味。
- source_word: ኖላዊያነ
  choice: 牧人
  rationale: 保留《动物启示录》中持续使用的异象意象，不将其直接解释为统治者、天使或其他对象。
- source_word: ገደፎሙ ሎሙ
  choice: 把……交给他们
  rationale: 体现照管权与责任的移交；现代汉语自然，也不把这一动作过度解释为信托或弃置。
- source_word: አባግዕ
  choice: 羊
  rationale: 保留具体的动物形象，不抽象化为“羊群”，也不解释其象征对象。
- source_word: ከመ ይርዐይዎሙ
  choice: 让他们牧养
  rationale: “牧养”自然表达牧人照料羊的行动，并与后文重复的同一动词保持一致。
- source_word: ለጸማዶሙ
  choice: 和他们的同伴
  rationale: 该词指与牧人相联或随同他们的人；译作“同伴”保留关系含义及所指的不确定性。
- source_word: ኵሉ ፯፯ እምኔክሙ
  choice: 你们七十人都
  rationale: 原文在先前已提七十个牧人之后，又在讲话中明确重复“七十”并带有整体、分配意味；正文保留这一重复，以免略去文本信息。
- source_word: እምይእዜ
  choice: 从今以后
  rationale: 清楚标明委任从此刻开始，符合现代庄重叙事语体。
- source_word: ኵሎ ዘአአዝዘክሙ አነ ግበሩ
  choice: 并要照我所吩咐你们的一切去做
  rationale: 保留直接命令及说话者的权威；“照……一切去做”在汉语中顺畅，并完整表达“所有我命令你们的事”。
theological_decisions:
- issue: 是否将牧人和羊的异象意象直接解释为其可能象征的人物或群体
  choice: 正文保留“牧人”和“羊”的动物异象
  alternative: 解释性译作统治者／天使与人民／以色列
  rationale: 本段属于持续展开的异象叙事；直接替换为推定所指会消除原文的象征层次，并把有争议的解释写入正文。
- issue: 讲话对象与“七十人”的范围是否完全等同
  choice: 保留原文先提“牧人和他们的同伴”、随后说“你们七十人都”的张力
  alternative: 将“同伴”明确并入七十个牧人，或将全句简化为“你们每个人”
  rationale: 原文的称呼结构与数字范围并非完全透明；译文不应擅自判定同伴的身份或人数关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“召来”“交给”“牧养”“吩咐”等词保持异象叙事的严肃感；正文保留数字重复和称呼范围上的不确定性。
