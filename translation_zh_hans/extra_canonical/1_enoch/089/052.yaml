base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/052.yaml
  text: And one of them escaped and was not killed[a]; and it cried out over the sheep, and they wanted to kill it, but the Lord of the sheep saved it from among the sheep[c][b], and brought it up to me and set it down.
translation:
  language: zh_hans
  text: 其中一只逃脱了，没有被杀；它跳起来，向羊群呼喊[a]。他们想杀它，但群羊之主把它从羊群中救出来，带到我这里，把它放下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向羊群呼喊”也可译作“在羊群上方呼喊”或“为羊群呼喊”；这里的吉兹语介词有多种可能含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ድኅነ
  choice: 逃脱了
  rationale: 与后面的“没有被杀”连用时，表示它从袭击中幸存、脱身；这样也与后文群羊之主明确施行的“救出”有所区分。
- source_word: ኢተቀትለ
  choice: 没有被杀
  rationale: 直接保留否定被动语态，现代汉语清楚自然。
- source_word: ቀነጸ
  choice: 跳起来
  rationale: 原词表达突然向上的动作；此译保留异象叙事中鲜明的动物意象。
- source_word: ጸርኀ
  choice: 呼喊
  rationale: 表达强烈而急迫的发声，但不额外限定为哀号、警告或演说。
- source_word: ዲበ አባግዕ
  choice: 向羊群呼喊
  rationale: 介词可表达朝向、位于上方或涉及某对象；正文采用符合现代汉语叙事的方向义，其他可能见脚注。
- source_word: ፈቀዱ ይቅትልዎ
  choice: 他们想要杀死它
  rationale: 准确表达意愿或企图，措辞直接自然。
- source_word: እግዚአ አባግዕ
  choice: 群羊之主
  rationale: 这是《动物启示录》中指称上帝的反复称号；“主”保留其敬畏和神学分量，“群羊”保留异象意象。
- source_word: አድኃኖ
  choice: 救出了它
  rationale: 主语明确是群羊之主，译为“救出”既体现实际搭救，也不削弱其神学含义。
- source_word: እምኔሆሙ ለአባግዕት
  choice: 从羊群中
  rationale: 按吉兹语前指代词后接名词说明所指的结构理解，即“从它们——羊群——中”；避免误译为“为羊群从他们那里”。
- source_word: አዕረጎ ኀቤየ
  choice: 把它带到我这里来
  rationale: 保留朝向异象观看者的移动；汉语中不强加上下方位，以免将观看者的空间位置解释得过死。
- source_word: አንበሮ
  choice: 安置在我面前
  rationale: 上下文表示把它带来后放置妥当；“在我面前”自然体现叙述者亲眼所见的场景。
theological_decisions:
- issue: 动物异象中神圣称号的译法
  choice: 群羊之主
  alternative: 羊群的主人
  rationale: 该称号在异象中是对上帝的敬称。“群羊之主”既保留神圣和庄重语域，也不把称号降格为普通所有者或管理者。
- issue: 从谁手中获救
  choice: 从羊群中救出了它
  alternative: 为羊群从他们那里救出了它
  rationale: 将代词后接的“羊群”视为对先行代词所指的补充说明，符合吉兹语句法及袭击者的上下文；不把“为羊群”发展成未经文本确定的代求或使命神学。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以“它”指异象中的动物，以“他们”保留攻击者在原文中的复数表达；保留“群羊之主”这一反复出现的象征性神圣称号。
