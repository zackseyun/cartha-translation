base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/050.yaml
  text: And that house became great and broad, and it was built for those sheep; and a lofty and great tower was built upon the house for the Lord of the sheep. And that house was low, but the tower was raised up and became lofty; and the Lord of the sheep stood upon that tower, and they set a full table before him.
translation:
  language: zh_hans
  text: 那座房屋变得又大又宽，是为那些羊建造的；房屋上又为群羊的主建了一座又高又大的塔。那座房屋很低，塔却被高高升起，变得高耸；群羊的主站在那塔上，他们在他面前摆上一张满满的桌子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤት
  choice: 殿宇
  rationale: 本词通常可指“房屋”，但在此异象中是为群羊建造、上有高塔并在主前设席的神圣建筑；译作“殿宇”既符合语境，也避免直接添加原文没有的专名。
- source_word: ዐቢየ፡ ወርኅበ
  choice: 宏伟宽广
  rationale: 分别传达“大”和“宽阔”的并列描述，使汉语自然而不合并其意象。
- source_word: ማኅፈድ
  choice: 塔
  rationale: 依该段建筑语境及传统词义译为“塔”；其位于殿宇之上，并被描述为高大、升起。
- source_word: ነዋኅ፡ ወዐቢይ
  choice: 高大巍峨
  rationale: 保留“高/高耸”与“大”两重含义；“巍峨”表现建筑的耸立感，不额外赋予神学意义。
- source_word: እግዚአ፡ አባግዕ
  choice: 群羊的主
  rationale: 按构词直译为“羊的主”；用“群羊”使现代汉语顺畅，并维持动物异象的称谓。
- source_word: ማእደ፡ ምልእተ
  choice: 满桌的食物
  rationale: 字面为“满的桌席/桌子”；汉语中译为“满桌的食物”清楚表达摆设丰盛，同时不具体限定祭品或筵席性质。
theological_decisions:
- issue: “殿宇”和“塔”的历史或神学所指
  choice: 保留异象中的建筑意象，不在正文点明其对应对象
  alternative: 直接译作“圣殿”“祭坛”或解释为某一具体历史建筑
  rationale: 原文在本节只使用建筑及羊群异象语言；明确历史对应会超出本节措辞，并消除原有象征张力。
- issue: 末句摆桌者的身份
  choice: 译为“众羊”
  alternative: 使用无明确主语的“有人”或笼统的“他们”
  rationale: 原文动词为复数，最近可理解的群体是羊；但其主体并非专名。译作“众羊”使中文可读，同时仍置于异象框架内。
- issue: “满桌”是否为祭献或宴席
  choice: 不定性为祭物或宴席
  alternative: 译作“献上丰盛祭物”或“摆设筵席”
  rationale: 原文只说把满桌之物置于他面前，未明确其礼仪性质；正文保留这种开放性。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体；保留重复的“殿宇”“塔”和“群羊的主”，以维持原文异象结构及平行对照。
