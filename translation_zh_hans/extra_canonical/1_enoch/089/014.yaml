base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/014.yaml
  text: And the Lord brought the twelve sheep so that they might dwell with it and graze with it among the wolves[c][b][a]; and they multiplied and became many flocks of sheep.
translation:
  language: zh_hans
  text: 主把十二只羊带来，使它们与它同住，在群狼中与它一同吃草[a][b][c]；它们繁衍增多，成了许多羊群。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节中段的吉兹语文本较难；这里的译法保留羊群异象的画面，也可较直译为“在群狼中与它一同吃草”。
    reason: textual_variant
  - marker: b
    text: 末句的文本传承不甚确定，看来是说十二只羊增多，形成了许多羊群或羊的群体。
    reason: alternative_reading
  - marker: c
    text: 或译：“与它同住，并与它一同吃草。”
    reason: previous_rendering
lexical_decisions:
- source_word: እግዚአ
  choice: 主
  rationale: 既保留这位掌管羊群者的权威和神圣分量，也不把异象中的象征身份进一步明说为“上帝”或“主人”。
- source_word: አምጽኦሙ
  choice: 把……带来
  rationale: 表达使十二只羊来到此处的主动行为，符合现代汉语表达。
- source_word: ፲ወ፪ አባግዕ
  choice: 十二只羊
  rationale: 数字明确；用不标明性别的“羊”延续动物启示录的象征意象。
- source_word: ከመ ይኅደሩ ምስሌሁ
  choice: 使它们与它同住
  rationale: ከመ 在此表达目的；“它”保留阳性单数后缀，并按上下文指向前文那一只羊，而不误接为“主”。
- source_word: ይትረዐዩ ምስሌሁ
  choice: 与它一同吃草
  rationale: 采用与羊相关的进食、放牧意象；“吃草”比把该词抽象化为“生活”更贴近异象画面。
- source_word: ማእከለ አዝእብት
  choice: 在群狼中
  rationale: 保留空间意义及羊处于狼群中的危险张力。
- source_word: በዝኁ
  choice: 繁衍增多
  rationale: 表达数量增长，并以自然的现代汉语保留经文式的繁衍意味。
- source_word: ኮኑ መራዕየ ብዙኃተ ዘአባግዕ
  choice: 成了许多羊群
  rationale: 末句传本较难，但整体似指羊增多并形成众多群体；此译保留集合意义和牧养意象。
theological_decisions:
- issue: 动物异象中“主”的身份
  choice: 译作“主”，正文不进一步界定
  alternative: “羊群的主人”或“上帝”
  rationale: “主”兼具权威和神学分量，同时保留启示文学借动物与牧养图景间接呈现身份的方式。
- issue: 两处阳性单数代词的所指
  choice: 译作“它”，理解为前文的一只羊
  alternative: 译作“他”，理解为主
  rationale: 吉兹语后缀本身为阳性单数，但上下文和经审核的句法判断支持其回指前节的单只羊；中文用“它”可避免误读为十二只羊与主一同吃草，同时不在正文补入原文没有的名词。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“它们”指十二只羊，“它”指前文的单只羊；正文维持动物异象，不直接解释其历史或神学对应。分号划分带来十二只羊与其后繁衍增多两个连续动作。
