base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/063.yaml
  text: And read out before me by number how many they destroy[a], and how many they hand over to destruction, so that this may be a testimony for me against them, that I may know all the deeds of the shepherds, and assess them, and see what they do—whether they abide by my command that I commanded them[c][b], or not.
translation:
  language: zh_hans
  text: 你要按数目在我面前宣读：他们毁灭了多少，又把多少交给毁灭[a]。这样，这份证词便可为我指证他们[b]，使我知道这些牧人的一切行为，考核他们，并察看他们所做的——他们是否遵守我的命令，就是我吩咐他们的命令，还是没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的埃塞俄比亚文本较难。“按数目”的重复措辞表明，这里是在逐项核算牧人毁灭了多少，又交出了多少使其遭毁灭。
    reason: textual_difficulty
  - marker: b
    text: “指证他们”所译短语字面为“在他们之上”，在这里可能表示这份证词落在他们身上，成为对他们不利的证据。
    reason: lexical_alternative
lexical_decisions:
- source_word: አንበብ፡ ቅድሜየ
  choice: 你要……在我面前宣读
  rationale: አንበብ在此按命令式理解；ቅድሜየ带第一人称单数后缀，意为“在我面前”。“宣读”保留出声读出及正式呈报的语气。
- source_word: ወበኍልቈ፡ … ሚመጠነ
  choice: 按数目……多少
  rationale: 保留本节反复出现的计数、核算意象，同时采用现代汉语自然的问数量表达。
- source_word: የኃጕሉ
  choice: 毁灭了
  rationale: 该动词在《动物启示录》中指造成毁灭或死亡；“毁灭”保留其广义暴力含义，不限定具体手段。
- source_word: ይሚጥዉ፡ ለኃጕል
  choice: 把多少交给毁灭
  rationale: 保留“交出/交付”与“毁灭”两个语义成分，也维持原文略显严峻而不寻常的措辞。
- source_word: ስምዐ፡ ዲቤሆሙ
  choice: 证词……指证他们
  rationale: ስምዐ具有见证、证词之义；ዲቤሆሙ字面为“在他们之上”，语境中带司法上的不利或控告作用，正文以“指证”自然表达。
- source_word: ግብሮሙ፡ ለኖላዊያን
  choice: 这些牧人的一切行为
  rationale: “牧人”维持异象中的固定象征形象；“行为”适合受审查的行动总称。
- source_word: እመጥኖሙ
  choice: 考核他们
  rationale: 词根有计量、核算之意；在审判语境中，“考核”既保留衡量意味，也避免把对象过早限定为纯粹数字。
- source_word: በትእዛዝየ፡ ዘአዘዝክዎሙ
  choice: 遵守我的命令，就是我吩咐他们的命令
  rationale: 有意保留“命令/吩咐”的重复，以突出牧人受托的权柄以及审查他们的标准。
- source_word: እመ፡ አልቦ
  choice: 还是没有
  rationale: 简洁保留“是否……还是没有”的二分检验。
theological_decisions:
- issue: 记录在审判中的作用
  choice: 译作正式宣读的计数与用来指证牧人的证词
  alternative: 仅视为一般性的信息汇报
  rationale: 宣读、数目、证词、行为、考核与命令等词汇共同构成监督和问责场景；此译法保留启示文学中的司法张力，而不附加特定宗派解释。
- issue: 命令的发言者与受命者
  choice: 主向记录者发出“在我面前宣读”的命令，并以“我的命令”审查牧人
  alternative: 先知以第一人称说自己在另一位面前宣读
  rationale: ቅድሜየ明确带第一人称单数后缀，后文“我的命令”也支持同一发言者持续说话。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留异象中的“牧人”、反复的计数语言和“命令/吩咐”的刻意重复；用破折号呈现末尾的审查性说明。
