base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/044.yaml
  text: And that sheep[a], whose eyes had been opened, saw that ram in the midst of the sheep, which had abandoned its glory, and it began to gore those sheep and trample them[d][c][b], and it went about without restraint.
translation:
  language: zh_hans
  text: 那只眼睛被开启的羊，看见羊群中那只离弃了自己荣耀[a]的公绵羊。那公绵羊便开始用角顶撞那些羊，践踏它们，并且毫无体统地四处行走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“尊荣”或“光彩”；异象没有明说它具体象征什么。
    reason: lexical_alternative
  - marker: b
    text: 原文末语也可表达“不得体地”或“毫无尊严地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: 羊
  rationale: 在“动物启示录”持续使用的羊群意象中，此处指羊群中的一个个体；“羊”比“羔羊”更中性，也不额外引入年龄含义。
- source_word: ዘተፈትሐ አዕይንቲሁ
  choice: 眼睛被开启的
  rationale: 保留原文的被动意味，暗示它获得了看见或领悟的能力，而不改写成主动“睁开眼睛”。
- source_word: ሐርጌ
  choice: 公绵羊
  rationale: 该词指雄性的羊；“公绵羊”在现代汉语中清楚自然，并保留动物异象的具体形象。
- source_word: ዘማእከለ አባግዕ
  choice: 羊群中
  rationale: 简洁呈现其位于众羊之间的场景，不增加解释。
- source_word: ዘሐደገ ስብሐተ
  choice: 离弃了自己荣耀的
  rationale: ስብሐት可涵盖荣耀、尊荣或光彩；正文采用宽泛的“荣耀”，不限定其象征所指。
- source_word: አሐዘ ይጉድኦሙ
  choice: 开始用角顶撞那些羊
  rationale: አሐዘ标明动作开始；结合公绵羊的形象，以“用角顶撞”具体表达攻击动作，同时避免抽象化为“毁灭”。
- source_word: ወኬዶሙ
  choice: 践踏它们
  rationale: 此动词延续公绵羊对羊群的暴力行为；“践踏”与动物场景协调，也保留强烈动作感。
- source_word: ዘእንበለ ተደላ
  choice: 毫无体统地
  rationale: ተደላ与合宜、得体、体面相关，因此译为“毫无体统”，而非表示无人阻挡的“毫无约束”。
theological_decisions:
- issue: 公绵羊所离弃的“荣耀”具体指什么
  choice: 正文直译为“荣耀”，不说明其象征对象
  alternative: 尊荣、光彩、王者尊严或力量
  rationale: 原词语义宽泛，异象语境又具有象征性；保留“荣耀”可避免把它武断地限定为王权、力量或身份。
- issue: 末句是在描述无人阻拦，还是行为有失体统
  choice: 译作“毫无体统地四处行走”
  alternative: 毫无约束地横行；无人阻挡地走动
  rationale: ተደላ更直接涉及合宜、体面或得体，故正文保留对行为失当的评价，不把它改释为缺少外在阻拦。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“眼睛被开启”有意保留原文被动结构；“公绵羊”保持动物异象的具体性。末句用“毫无体统地四处行走”，既贴近“行走”的字面动作，也自然表达其行为失当。
