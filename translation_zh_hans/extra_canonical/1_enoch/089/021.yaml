base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/021.yaml
  text: And I saw the sheep until they came out from the wolves[a]; and the eyes of the wolves were blinded[b], and those wolves went out following the sheep with all their power.
translation:
  language: zh_hans
  text: 我看见那些羊，直到它们从狼群中出来；狼的眼睛被蒙蔽了[a]，那些狼就竭尽全力地跟着羊群出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“狼的眼睛失明了。”原文可指眼睛变暗、受遮蔽或失去视力。
    reason: lexical_ambiguity
  - marker: b
    text: “跟着”也可译作“跟随”；在狼与羊的场景中，可能含有“追赶”的意味。原文明确以“那些狼”为行动者，并包含“出来”的动作。
    reason: contextual_ambiguity
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: 我看着那些羊
  rationale: 保留第一人称异象叙述，并以“看着”表达持续观察；宾语由紧随其后的“羊”补足。
- source_word: ለአባግዕ
  choice: 那些羊／羊群
  rationale: “羊”是动物启示录中延续性的象征形象；首次用“那些羊”保留指示感，后文用“羊群”使汉语自然。
- source_word: እስከ ወፁኡ እምአዝእብት
  choice: 直到它们从狼群中出来
  rationale: 保留“直到”结构及从狼所在范围中出来的空间图景；“狼群”符合现代汉语表达。
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: 狼的眼睛昏暗了
  rationale: 该 t 词干形式为不及物／被动意义，眼睛是主语；“昏暗了”保留“变暗”与“失去视力”之间的语义幅度，不误译为狼主动弄瞎别人的眼睛。
- source_word: ወወፁኡ እንዘ ይትልውዎሙ
  choice: 便……跟在羊群后面
  rationale: 直译“出去，同时跟随它们”；中文以“跟在……后面”自然表达伴随移动，避免擅自强化为“追杀”。
- source_word: ዝኩ አዝእብት
  choice: 那些狼
  rationale: 保留显式主语和指示词，明确末句行动者是狼。
- source_word: በኵሉ ኃይሎሙ
  choice: 使出全部力量
  rationale: 表达其动用全部力量，保留原句追随行动的强烈程度，同时符合现代汉语习惯。
theological_decisions:
- issue: 眼睛昏暗的异象应否解释成欺骗或误导
  choice: 保留具体图像“狼的眼睛昏暗了”
  alternative: 译成“狼受了迷惑”或“狼被误导了”
  rationale: 原文以眼睛变暗／失明的具体异象表达意义；不将启示文学图像提前化约为抽象的属灵解释。
- issue: 末句“跟随”是否应强化为敌意追赶
  choice: 正文译作“跟在羊群后面”
  alternative: 译作“追赶羊群”
  rationale: 源词本义是跟随，语境可能含敌意追逐，但正文采用较直接的表达，并以脚注说明语境可能性。
- issue: 眼睛状态的程度
  choice: 译作“昏暗了”
  alternative: 译作“失明了”
  rationale: 源词可表达变暗、被遮蔽或失明；“昏暗了”较能保存词义幅度，脚注列出“失明了”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；保留动物启示录的具体意象和原文的语义张力。
