base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/037.yaml
  text: And I watched until that sheep lay down—the one that had met that sheep which led them—and I watched until all the great and small sheep were stirred up in their place[d][c][b][a], and they entered into the pasture and came near the stream of water.
translation:
  language: zh_hans
  text: 我观看，直到那只羊躺下，就是那只曾与那只带领它们的羊相遇的羊；我又观看，直到所有大羊都灭亡了，小羊则起来接替它们[a]。这些小羊进入草场，走近水流。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接替它们”直译可作“在它们的位置上”或“代替它们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰከበ
  choice: 躺下
  rationale: 该动词是主动形式，基本义为“躺下”或“睡下”；在异象语境中可能婉指死亡，但正文不将这一含义明说。
- source_word: በግዕ
  choice: 羊
  rationale: 保留《动物启示录》一贯的动物意象，不细化为公羊或羊羔。
- source_word: ዘተረክበ
  choice: 曾遇见
  rationale: 自然表达先前发生的相遇，同时不加入额外解释。
- source_word: ዘመርሖሙ
  choice: 带领他们
  rationale: 准确保留引导、率领之意，避免解释性较强的“牧养”。
- source_word: ተኃጕሉ
  choice: 都灭亡了
  rationale: 按词根及清楚的分句结构理解为“灭亡、毁灭”，而非“被驱赶”或“被激动”。
- source_word: ዐቢያን ... ወንኡሳን
  choice: 大羊……小羊
  rationale: 形容词复数在羊群意象中分别指“大羊”和“小羊”，并由后续动词分成两个对照分句。
- source_word: ተንሥኡ
  choice: 起来
  rationale: 译出原文明确出现而旧稿遗漏的动词“起来、兴起”。
- source_word: ህየንቴሆሙ
  choice: 接替它们
  rationale: 此处与小羊“起来”相连，替代义“在它们的位置上、接替它们”最符合句法；脚注保留较字面的表达。
- source_word: መርዔት
  choice: 草场
  rationale: 指牲畜吃草之地；“草场”在现代汉语中自然并保留异象画面。
- source_word: ፈለገ ማይ
  choice: 水流
  rationale: 概括水道、溪流之意，不武断限定其规模。
theological_decisions:
- issue: 第一只羊“躺下”是否明确表示死亡
  choice: 正文译作“躺下”
  alternative: 死去／被杀
  rationale: 原文主动动词可在此语境中婉指死亡，但本身仍保有“躺下”的形象；不在翻译中提前消除其象征张力。
- issue: 大羊与小羊的关系
  choice: 分译为“大羊都灭亡了，小羊则起来接替它们”
  alternative: “所有大羊和小羊都被激动起来”
  rationale: 原文句法包含两个动词和两组对照主体：大羊与“灭亡”相连，小羊与“起来”相连；如此翻译不依赖特定教派解释。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“躺下”保留原文可能婉指死亡的含混性；“都灭亡了……则起来”清楚呈现吉兹语的对照分句。
