base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/004.yaml
  text: And water[a], and darkness, and mist increased upon it; and I looked at the height of that water, and that water rose above that enclosure[d][c][b], and it poured over the enclosure and stood upon the earth.
translation:
  language: zh_hans
  text: 水、黑暗和雾气[a]在它上面增多了。我看见那水的高度；那水涨到那围场[b]之上，又漫过围场，停留在地面上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雾气”也可译作“浓雾”；原词指与水和黑暗相伴、遮蔽视线的水汽。
    reason: lexical_alternative
  - marker: b
    text: “围场”也可译作“圈”或“有围栏的院场”；在本书的动物异象中，可能特指圈养动物的场所。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近于“立在地上”，这里按水的状态译作“停留在地面上”。
    reason: idiom_note
lexical_decisions:
- source_word: ወበዝን（校读为 ወበዝኀ）
  choice: 不断加增
  rationale: 抄录文本很可能存在字形误读；校读后的动词意为“增多、加剧”。用“不断加增”既表达水量上升，也容纳黑暗与雾气加重的共同谓语。
- source_word: ዲቤሁ
  choice: 在它上面
  rationale: 保留带第三人称单数后缀的方位表达，不擅自明确其所指。
- source_word: ማይ
  choice: 水
  rationale: 原文反复使用单数名词；汉语“水”可作物质名词，无须解释性地译成“洪水”。
- source_word: ጽልመት
  choice: 黑暗
  rationale: 直接传达视觉异象中幽暗、 ominous 的景象，不添加额外解释。
- source_word: ጊሜ
  choice: 雾气
  rationale: 该词在水与黑暗的气象性语境中指造成遮蔽的水汽；“雾气”自然且庄重。
- source_word: ወአሬኢ
  choice: 我看见
  rationale: 符合第一人称异象叙述，也可自然引出所见对象“那水的高度”。
- source_word: መልዕልተ ለዝኩ ማይ
  choice: 那水的高度
  rationale: 保留原文关于上部或垂直高度的意象，不将其具体化为水面线。
- source_word: ተላዐለ
  choice: 涨过了
  rationale: 动词表示上升、高过；用于水时，“涨过了”准确而符合现代汉语习惯。
- source_word: ዐጸድ
  choice: 围场
  rationale: 该词指有边界围护的场地；“围场”适合动物异象的语境，却不像“羊圈”那样过度限定象征所指。
- source_word: ይከዑ
  choice: 倾泻在……上
  rationale: 传达水猛烈漫流、倾倒到围场之上的动作，同时避免把介词关系过度具体化。
- source_word: ቆመ
  choice: 停留
  rationale: 原义为站立、停住或存留；水不能按汉语习惯说“站在地上”，故用“停留”保留其积存不退的意味。
theological_decisions:
- issue: 是否在正文中明确译作洪水
  choice: 保留“水”
  alternative: 洪水；洪流
  rationale: 上下文具有明显的洪灾意象，但吉兹文反复使用普通名词“水”。保留其措辞，可让读者从异象本身辨认象征，而不由译者预先定性。
- issue: 是否把 ዐጸድ 明确译成“羊圈”
  choice: 围场
  alternative: 羊圈；院子；围栏
  rationale: 动物启示录的语境使“羊圈”成为可能，但本节词语本身只要求一个围起来的场地。“围场”保留象征的开放性。
- issue: 如何处理水“站在”地上的闪族式表达
  choice: 停留在地面上
  alternative: 立在地上；积在地上
  rationale: “停留”保有水持续存在的图景；“积在”虽更自然，却更明确地解释了其物理状态，而“立在”在现代汉语中容易显得误译。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。句式简洁，保留异象报告的重复与突兀感；“水”不解释为“洪水”，“围场”不窄化为“羊圈”。首句以“不断加增”反映校勘所支持的动词，并使水、黑暗、雾气共享谓语。
