base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/035.yaml
  text: And that ram took other sheep with him[a], and came upon those sheep that had gone astray; and he began to kill them. And the sheep were afraid before him, and that ram made those sheep that had gone astray return[b], and they went back into their folds.
translation:
  language: zh_hans
  text: 那只公羊带着别的羊[a]，来到那些走迷了的羊那里，开始杀他们[b]。群羊在他面前都害怕；那只公羊使那些走迷了的羊回转，他们便回到自己的羊圈里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别的羊”原文为复数；旧译有作“另一只羊”的。
    reason: 说明复数语法，并记录先前单数译法。
  - marker: b
    text: “开始杀他们”也可较直译为“抓住他们，要杀他们”；原文结构着重暴力行动的发动。
    reason: 保留原文起始结构与目的结构之间的词法歧义。
lexical_decisions:
- source_word: በግዕ
  choice: 公羊
  rationale: 在《动物异象》中，此处指具有带领作用的雄性羊；译作“公羊”可保留它与一般群羊之间的叙事区别。
- source_word: ነሥአ ምስሌሁ ባዕደ አባግዐ
  choice: 带着别的羊
  rationale: አባግዐ 为复数，故译作“别的羊”，不采用旧有的单数理解“另一只羊”；“带着”自然表达同行关系。
- source_word: ቦአ ዲበ
  choice: 来到……那里
  rationale: 表达朝向并抵达一群羊，既保留逼近之意，又不额外解释为军事攻击。
- source_word: እለ ስሕቱ
  choice: 那些走迷了的羊
  rationale: 兼顾羊群实际迷失与寓意上偏离正道的双重意味。
- source_word: አኀዘ ይቅትሎሙ
  choice: 开始杀他们
  rationale: 该结构可表达动作的开始，同时保留原文明确的杀戮用语；“他们”承接拟人化的寓言对象。
- source_word: ፈርሁ እምገጹ
  choice: 在他面前都害怕
  rationale: 保留“在其面前/面对其临在”的原文意象；“都”自然体现复数群体的共同反应，不表示超出该群体的绝对全称。
- source_word: አግብኦሙ
  choice: 使……回转
  rationale: 保留使役意义，表明公羊促使走迷的羊返回，而非仅仅陪同。
- source_word: አዕጻዲሆሙ
  choice: 自己的羊圈
  rationale: “羊圈”是现代汉语中自然且准确的牧养用语，也保留动物异象的图景。
theological_decisions:
- issue: 公羊对走迷之羊所施的暴力
  choice: 正文保留“杀”的明确措辞
  alternative: 弱化为“惩罚”或“击打”
  rationale: 原文使用杀戮动词；弱化会削减末世异象中审判场景的严厉程度。
- issue: “走迷”的寓意张力
  choice: 采用兼具实际迷路和道德偏离意味的“走迷”
  alternative: 明确译作“犯罪”或单纯译作“走失”
  rationale: 原文容许动物图景与宗教寓意同时存在，不宜在译文中只锁定其中一层。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留动物异象中的“公羊、群羊、羊圈”等图景，不把寓意对象直接写入正文。所有脚注标记均置于相关正文位置。
