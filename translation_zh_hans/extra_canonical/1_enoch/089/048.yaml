base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/048.yaml
  text: And afterward that ram arose and led the sheep[a]; and that ram fathered many sheep and lay down. And a little sheep became a ram in its place[d][c][b], and it became ruler and leader of those sheep.
translation:
  language: zh_hans
  text: 那只后来的公绵羊起来，带领众羊；那只公绵羊生了许多羊，便躺下了[a]。有一只小羊[b]接替它，成了公绵羊，作了那些羊的统治者和领袖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “躺下了”在这个异象中很可能是指这只公绵羊死去；正文保留原文的形象说法。
    reason: lexical_alternative
  - marker: b
    text: “小羊”也可理解为“年幼的羊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳሓራዊ
  choice: 后来
  rationale: 该词在此与“公绵羊”相连，可表“后来的／后一只”。汉语用“后来那只”既自然，也保留与先前公绵羊的次序对比，而不把它处理成单纯句间副词。
- source_word: ሐርጌ
  choice: 公绵羊
  rationale: 明确保留雄性羊及其领袖形象，比泛称“羊”更能呈现动物启示录中的象征区分。
- source_word: ተንሥአ
  choice: 起来
  rationale: 直译其起身、兴起之意；在异象叙事中既自然，又不额外解释其历史含义。
- source_word: መርሖሙ
  choice: 带领
  rationale: 保留引导羊群与政治领导之间的双重可能。
- source_word: አባግዕ
  choice: 众羊／羊
  rationale: 保留具体动物意象，不抽象化为“民众”或历史群体。首处用“众羊”符合汉语集合表达，后文按语境用“羊”。
- source_word: ወሊደ
  choice: 生了
  rationale: 表达明确的生育关系；现代汉语自然，不采用古雅的“生出”或带特定畜牧色彩的词。
- source_word: ብዙኃነ
  choice: 许多
  rationale: 准确、简明地表达数量。
- source_word: ሰከበ
  choice: 躺下了
  rationale: 保留异象的字面动作；其可能表示死亡的惯用含义放入脚注，不在正文中直接释义。
- source_word: በግዕ ንኡስ
  choice: 一只小羊
  rationale: “小”可涉及体形或年幼，正文维持这种含混性，并以脚注提示另一可能。
- source_word: ህየንቴሁ
  choice: 接替它
  rationale: 该词表示取代、处在其位置。汉语“接替它”自然地呈现继任关系，但不把象征直接解释为王朝或政治继承。
- source_word: መኰንነ
  choice: 统治者
  rationale: 表达掌权者的宽泛意义，不引入“王”“总督”等更具体、可能过度解释的称号。
- source_word: መራሔ
  choice: 领袖
  rationale: 保留其领导身份，并与前面的动词“带领”形成自然呼应；不强加原词此处未明确使用的“牧人”称谓。
theological_decisions:
- issue: 是否把羊接替公绵羊的异象直接解释为历史或王权继承
  choice: 有一只小羊接替它，成了公绵羊
  alternative: 有一只年幼的羊作为它的继承者，成为公绵羊
  rationale: 经文以动物成长与角色替换来表达继承。正文保留其启示文学意象，不点明具体历史人物或制度。
- issue: “躺下”是否应直接译为死亡
  choice: 躺下了
  alternative: 死了
  rationale: 该表达在异象语境中很可能暗指死亡，但字面图像仍有独立价值；正文保留图像，脚注说明其可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留动物启示录的具体形象和继承张力；不将公绵羊、众羊或统治者直接替换为历史人物与政治术语。原文首个复数“羊”之后括注的 ንኡስ 与复数名词不协调，视为文本插入而不译；后一个单数短语“በግዕ ንኡስ”则译为“一只小羊”。
