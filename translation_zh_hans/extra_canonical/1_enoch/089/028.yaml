base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/028.yaml
  text: But the sheep passed from that water and went out into a wilderness where there was no water or grass[a]; and they began to open their eyes and to see. And I saw the Lord of the sheep shepherding them and giving them water and grass[d][c][b], and that sheep going and leading them.
translation:
  language: zh_hans
  text: 那些羊离开那片水域，进入旷野，那里没有水，也没有草；它们便开始睁开眼睛，并观看。[a]我看见群羊之主牧养它们，赐给它们水和草；[b]又看见那只羊一面前行，一面带领它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开始睁开眼睛，并观看”在异象中可能表示觉醒或重新获得洞察；正文仍保留羊睁眼观看的具体图像。
    reason: lexical_alternative
  - marker: b
    text: “草”也可译作“草场”或“牧草”；原词指可供羊群食用的草料。
    reason: lexical_alternative
lexical_decisions:
- source_word: አባግዕሰ
  choice: 那些羊
  rationale: 保留附着成分所带的回指意味，指向异象中先前出现的羊群。
- source_word: ኃለፉ እምዝኩ ማይ
  choice: 离开那片水域
  rationale: 表达从先前有水之处离去的方向意义，同时不强行限定为渡河。
- source_word: ውስተ በድው
  choice: 进入旷野
  rationale: “旷野”自然保留圣经—启示文学语感，又不把场景窄化为沙漠。
- source_word: ኀበ አልቦ ማየ ወሣዕረ
  choice: 那里没有水，也没有草
  rationale: 直接呈现羊群所面对的匮乏；“草”通俗而具体。
- source_word: አኃዙ ይክሥቱ አዕይንቲሆሙ ወይሬእዩ
  choice: 便开始睁开眼睛，看见了
  rationale: 保留睁眼和看见的异象性图像，不将其解释性改写为“醒悟”或“明白”。
- source_word: እግዚኦሙ ለአባግዕ
  choice: 群羊之主
  rationale: 作为异象内的固定称号，既保留“主”与羊群的关系，也不在正文中直接替换为解释性的“上帝”。
- source_word: ይርዕዮሙ
  choice: 牧养它们
  rationale: 保留主动照料、引领和供养羊群的牧者意象，比单纯“喂养”更完整。
- source_word: ይሁቦሙ ማየ ወሣዕረ
  choice: 赐给它们水和草
  rationale: 与前文无水无草形成直接反转；“赐给”自然传达主所给予的供应。
- source_word: ዝኩ በግዕ
  choice: 那只羊
  rationale: 保留指示词，指向异象中已经出现的一只特定的羊。
- source_word: እንዘ የሐውር ወይመራሖሙ
  choice: 一面前行，一面带领它们
  rationale: 用并行的持续动作表达እንዘ加未完成式的伴随情状，并维持与“我看见”相连的宾语补足结构。
theological_decisions:
- issue: “群羊之主”的身份
  choice: 正文译作“群羊之主”，不作解释性扩展
  alternative: 上帝，以色列的牧者；羊群的主人
  rationale: 该称号在动物启示异象中指向神圣角色，但翻译应保存异象自身的象征体系，不以释义取代原有比喻。
- issue: 羊睁眼并看见的含义
  choice: 保留“开始睁开眼睛，看见了”的具象措辞
  alternative: 它们醒悟了；它们开始明白
  rationale: 这句话可能象征觉醒或重新获得洞察，但原文通过羊的身体动作呈现；正文保留字面异象与象征意义之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“那些羊”“群羊之主”“那只羊”维持动物启示异象的连续性；末句处理为“我看见”的第二组宾语内容，避免改成脱离主句的独立叙述。
