base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/034.yaml
  text: And when they saw him[a], they were afraid and trembled before his face[b], and they desired to return to their own folds.
translation:
  language: zh_hans
  text: 他们看见他时，就害怕，在他面前战兢[a]，并想回到各自的羊圈里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“从他面前（脸前）”。这里指他们在他面前因恐惧而战兢。
    reason: lexical_alternative
  - marker: b
    text: “羊圈”指羊群栖身的围栏；这里保留异象中的动物意象。
    reason: cultural_note
lexical_decisions:
- source_word: ርእይዎ
  choice: 看见他
  rationale: 该动词是普通的“看见”，宾语后缀表示“他”；采用自然、直接的现代汉语。
- source_word: ፈርሁ
  choice: 害怕
  rationale: 直接表达惧怕，不削弱原文的情绪力度。
- source_word: ወርዕዱ
  choice: 战兢
  rationale: 原词在“害怕”之外进一步描写因恐惧而发抖；“战兢”兼具身体反应和庄重的异象叙事语体。
- source_word: እምቅድመ ገጹ
  choice: 在他面前
  rationale: 原文直译近于“从/在他的面前（脸前）”；汉语用“在他面前”自然地保留身处其面前的强烈临在感。
- source_word: ወፈቀዱ
  choice: 想
  rationale: 该词表示愿意、想要；“想”在现代汉语中清楚自然，又不额外强化意愿程度。
- source_word: ከመ ይግብኡ
  choice: 回到
  rationale: 动词可含进入或返回之意；上下文指回到先前所属之处，故译为“回到”，同时不展开原文未明说的动作细节。
- source_word: ለአዕጻዲ ዚአሆሙ
  choice: 自己的圈里
  rationale: 该短语指属于它们的动物围圈。“圈”保留《动物启示录》持续使用的动物意象，也比泛化为“家”更贴近原文。
theological_decisions:
- issue: 是否把动物意象泛化为普通人的归处
  choice: 保留“圈”
  alternative: 自己的家里／自己的地方／自己的围栏里
  rationale: 本段以动物象征展开异象；译成“家”会抹平其文学和神学意象。“圈”既保留象征，也符合现代汉语。
- issue: 是否明确“他”所指的人物
  choice: 保留代词“他”
  alternative: 在译文中补出具体身份或称谓
  rationale: 本节本身只用宾语代词；不依据解释传统补明身份，以保留原文在单节层面的指代方式。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“害怕……战兢”保留原文两个递进的恐惧动词；“圈”维持全书本段的动物象征，不将其解释性改写为“家”。
