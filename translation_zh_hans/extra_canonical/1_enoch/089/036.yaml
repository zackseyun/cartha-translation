base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/036.yaml
  text: And I saw in the vision until that sheep became a man[a], and built a house for the Lord of the sheep[c][b], and he placed all the sheep in that house.
translation:
  language: zh_hans
  text: 我在异象中看见，直到那只羊变成了一个人[a]。他为群羊的主建了一座房子[b]，把所有的羊都安置在那座房子里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 羊“变成了一个人”是异象中的象征性转变；原文没有在这里指明这个人物是谁。
    reason: cultural_note
  - marker: b
    text: “房子”在这里很可能带有圣所或圣殿的意味，但原文用的就是一般的“房子”一词。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使所有的羊都站在那座房子里。”原词也可表示设置或安置。
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: 羊
  rationale: 本段持续使用动物象征；“羊”既保留群羊意象，也不额外限定为羔羊或公羊。
- source_word: ኮነ ብእሴ
  choice: 变成了一个人
  rationale: 动词与名词的组合自然表达异象中的转变；这一译法保留从羊到人的突兀象征变化。
- source_word: ሐነጸ ቤተ
  choice: 建了一座房子
  rationale: 原文直说“建房子”。上下文虽可能含圣所或圣殿意味，正文不将这种解释直接写入。
- source_word: ለእግዚአ አባግዕ
  choice: 为群羊的主
  rationale: “主”符合 እግዚአ 的尊称意味和本文庄重语体；用“群羊”自然表达复数并凸显整体羊群。
- source_word: አቀሞሙ
  choice: 把所有的羊都安置
  rationale: 该使役动词可表示使站立、设置或安置；在把羊置于房子里的语境中，“安置”自然，同时不排除原有的站立意象。
- source_word: በውእቱ ቤት
  choice: 在那座房子里
  rationale: 保留指示词“那”，维持异象叙述中的指向关系。
theological_decisions:
- issue: 应将 ቤተ 译作“房子”还是解释为“圣殿”
  choice: 房子
  alternative: 圣殿；圣所
  rationale: 原文的直接用词是“房子”。它为群羊之主而建，显然可能带有圣所或圣殿意味，但正文应保留源文意象，将可能的宗教含义置于脚注。
- issue: 变成人的那只羊究竟是谁
  choice: 不在译文中指明身份
  alternative: 摩西；代表摩西或以色列礼仪领袖的人物
  rationale: 本节只呈现象征性的形态转变，并未明说人物身份；译文不应以解释取代原文的含混。
- issue: አቀሞሙ 是强调“使站立”还是一般性的“安置”
  choice: 安置
  alternative: 使所有的羊站立；把所有的羊立在那里
  rationale: 该词的使役形态保有“使站立”的字面图像，也可在语境中表示设置、安放。正文采用自然的“安置”，脚注保留较字面的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“我在异象中观看，直到……”保留原文持续观看至事件发生的结构；用“群羊的主”维持动物异象及神学张力，不解释人物身份，也不把“房子”直接释为“圣殿”。
