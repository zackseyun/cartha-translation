base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/022.yaml
  text: And the Lord of the sheep went with them as he led them[a], and all his sheep followed him[b]; and his face was glorious and splendid and terrible to behold.
translation:
  language: zh_hans
  text: 羊群的主与他们同行，一面引领他们；他的羊全都跟随他。他的面容满有荣耀、尊贵，令人望而生畏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “令人望而生畏”指因威严而产生敬畏与惧意，并非说他的面容邪恶或丑陋。
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: 羊群的主
  rationale: 保留属格关系、尊崇语气及异象中持续的羊群意象；不增添原文没有明说的“牧人”。
- source_word: ሖረ ምስሌሆሙ
  choice: 与他们同行
  rationale: 表达伴随而行的动作，现代汉语自然，又不额外限定行进方向。
- source_word: እንዘ ይመራሖሙ
  choice: 一面引领他们
  rationale: “一面”体现同时进行的分词结构；“引领”兼顾庄重语体和带领羊群的语境。
- source_word: ኵሎሙ አባግዒሁ
  choice: 他所有的羊
  rationale: 明确保留全称、所有关系和具体的动物形象。
- source_word: ተለውዎ
  choice: 都跟随他
  rationale: 准确表达在领行者之后行进的关系，并与羊群场景自然衔接。
- source_word: ገጹ
  choice: 他的面容
  rationale: 保留具体而拟人化的异象细节；“面容”比“脸”更符合庄重语体。
- source_word: ስቡሕ
  choice: 荣耀
  rationale: 在描述主的面容时兼具荣光与尊荣之意，并与后一个形容词有所区分。
- source_word: ክቡር
  choice: 尊贵
  rationale: 保留“有分量、受尊崇”的语义，不将其单纯收窄为视觉上的华美。
- source_word: ግሩም ለርእይ
  choice: 令人望而生畏
  rationale: 传达观看时产生的敬畏与惧意；避免被理解为道德上的可怕或邪恶。
theological_decisions:
- issue: 动物启示录中领行者的身份与称谓
  choice: 译作“羊群的主”，并照原文保留羊的意象
  alternative: 译作“他们的主人”或“羊群的牧人”
  rationale: 原文将这位至高领行者置于整段动物象征体系内；“羊群的主”既保留神学分量，也不把异象直接解释成其象征对象，或增添“牧人”这一未明说的称谓。
- issue: 对ግሩም所含惧意的理解
  choice: 译作“令人望而生畏”
  alternative: 译作“看起来可怕”或“令人惊叹”
  rationale: 此处表达面对神圣显现时充满敬畏的震慑感，并非对该人物作道德上的负面评价；译文保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句法保留原文先叙行动、后述面容的推进；“荣耀、尊贵”并列呈现两个相近但不完全相同的形容词，避免合并其意义。
