base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/033.yaml
  text: And the Lord of the sheep was exceedingly angry with them[a], and that sheep knew it, and came down from the summit of the rock, and came to the sheep[c][b], and found the greater part of them with their eyes blinded, and those who had gone astray.
translation:
  language: zh_hans
  text: 羊群的主向他们大发烈怒；那只羊知道了这事，便从磐石顶上下来，来到羊群那里，看见其中大多数的眼目昏暗[a]，也已走迷了路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “昏暗”也可译作“被蒙蔽”或“失明”；原词描绘眼目变暗、受遮蔽，不一定表示完全丧失视力。
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: 羊群的主
  rationale: 保留异象中“主”的崇高称谓及羊的象征意象；用“羊群”使现代汉语表达自然。
- source_word: ተምዐዐ ዲቤሆሙ መዐተ ዐቢየ
  choice: 向他们大发烈怒
  rationale: 以“大发烈怒”传达同源怒词叠加强调的强烈程度，同时保持庄重、流畅。
- source_word: አእመረ ዝኩ በግዕ
  choice: 那只羊知道了这事
  rationale: 按主语无标记的语法关系，以“那只羊”为动词主语；“这事”指主对他们发怒，亦与上文叙事形成对照。
- source_word: ወወረደ እምነ ድማኅ ለኵኵሕ
  choice: 便从磐石顶上下来
  rationale: 明确译出“顶、峰”而不增添“高大”等原文没有的修饰；动词主语延续为“那只羊”。
- source_word: ኀበ አባግዕት
  choice: 来到羊群那里
  rationale: 保留动物异象的字面意象，以自然汉语表达方向和目的地。
- source_word: ዘመብዝኅቶሙ
  choice: 他们大多数
  rationale: 准确表达较大部分或多数，语体自然。
- source_word: ዘጽሉለ አዕይንቲሆሙ
  choice: 眼目昏暗
  rationale: “昏暗”保留视力受遮蔽、变暗的图像，不武断强化为完全失明；“眼目”适合庄重异象文体。
- source_word: እለ ስሕቱ
  choice: 已经走迷了路
  rationale: 同时保留羊走失的字面画面和道德偏离的象征含义。
theological_decisions:
- issue: እግዚኦሙ 应译作“主”还是较弱的“主人”
  choice: 主
  alternative: 主人
  rationale: 该羊群之主在动物启示录中具有神圣统治者和审判者的角色；“主”保留这种身份，但不引入后期基督论称谓。
- issue: “知道”并从磐石顶下来者的身份
  choice: 那只羊
  alternative: 羊群的主或未明说的代理者
  rationale: ዝኩ በግዕ 在句中最自然地作 አእመረ 的主语，后续动词也由同一主语承接；不把它误解为宾语。
- issue: 末句中昏暗与迷路的关系
  choice: 大多数羊既眼目昏暗，也已经迷路
  alternative: 眼目昏暗者与迷路者是两个并列群体
  rationale: 关系结构在形式上可能显得并列，但上下文和连续描述更自然地指向同一多数群体；汉译保持紧凑，同时不补入原因关系。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。保留“羊群的主”“磐石顶”“眼目”等象征性措辞，不把羊直接解释为人，也不补入特定宗派释义。
