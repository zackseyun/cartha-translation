base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/032.yaml
  text: And that sheep that led them returned and went up upon that rock[a]; and the sheep, while their eyes were blinded, went astray from the path that he had shown them[b], but that sheep did not know it.
translation:
  language: zh_hans
  text: 那只带领它们的羊回来了，登上了那块岩石[a]。当众羊的眼睛昏暗时[b]，它们便偏离了它曾指给它们的那条路；那只羊却不知道这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那处高地”或“那座峭岩”；原词可指岩石形成的高处，不一定只是一块石头。
    reason: lexical_alternative
  - marker: b
    text: 或译“眼睛正被蒙蔽时”。原文既可着重描写眼睛昏暗的状态，也可能含有持续被蒙蔽的意味。
    reason: source_ambiguity
lexical_decisions:
- source_word: ገብአ
  choice: 回来
  rationale: 该动词可表示“来、进入、返回”；按叙事情境，这只领路的羊在带领群羊后折返，译作“回来”最合适。
- source_word: በግዕ / አባግዕ
  choice: 羊 / 众羊
  rationale: 异象持续采用羊的意象，原文未明确标示性别或年龄；单数译“羊”，复数用“众羊”清楚区分。
- source_word: ዘይመርሖሙ
  choice: 带领它们的
  rationale: 保留原文具体的引路动作，并以关系结构指明这只羊的角色。
- source_word: ዐርገ
  choice: 登上
  rationale: 表达向上移动，与后面的岩石高处相配，现代汉语简洁自然。
- source_word: ድማኅ
  choice: 岩峰
  rationale: 该词可指岩石、峭岩或岩石高地；“岩峰”兼顾岩石质地和高处意象，避免让读者只想到一块普通石头。
- source_word: ይጸልሉ አዕይንቲሆሙ
  choice: 眼睛昏暗
  rationale: 表达视力受阻的持续状态，不强行指定使其失明的外在行动者；相关语态歧义收入脚注。
- source_word: ይስሕቱ እምፍኖት
  choice: 偏离了……路
  rationale: 既保留实际离开路线的画面，也保留其道德和象征意味。
- source_word: እንተ አርአዮሙ
  choice: 它指给它们的
  rationale: 使役性的“显示、指示”由前述单数领路之羊发出；“指给”符合引路语境。
- source_word: ኢያእመረ
  choice: 却不知道这事
  rationale: 忠实表达缺乏知情或察觉，不将其强化为疏忽、漠视等带有责备意味的行为。
theological_decisions:
- issue: 领路之羊的无知是否应解释为失职或漠不关心
  choice: 译作“那只羊却不知道这事”
  alternative: “那只羊却没有留意”或“那只羊并不理会”
  rationale: 吉兹文直接表达“不知道”，并未明确断定它出于疏忽或故意漠视；保留单纯的不知，可维持原文的悲剧性张力而不额外加重道德判断。
- issue: 众羊眼睛昏暗的状态是否暗示当时正有外力使它们失明
  choice: 正文译作状态性的“眼睛昏暗时”
  alternative: “眼睛正被蒙蔽时”
  rationale: 原结构可理解为伴随性的持续状态；正文不明确指定施动者，脚注保留被动过程的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“它们”用于动物群体，保持异象的动物意象；分为两句以免汉语长句拖沓。“却”突出领路之羊不知群羊迷失的叙事反差。
