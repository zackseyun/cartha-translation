base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/055.yaml
  text: And he gave them over into the hand of the lions and the leopards and the wolves and the hyenas[a], and into the hand of the foxes, and to all the wild beasts[e][d][c][b]; and those beasts of the field began to tear apart those sheep.
translation:
  language: zh_hans
  text: 他把它们交在狮子、豹、狼和鬣狗[a]手中，又交在狐狸[b]手中，也交给一切野兽；那些荒野的走兽便开始撕裂那些羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所指的动物并不完全确定，也可译作“豺”。
    reason: lexical_alternative
  - marker: b
    text: “狐狸”所译的古代动物名称也可能包括豺一类的犬科动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐደጎሙ
  choice: 他把它们交在……手中
  rationale: 该动词可表示离弃、留下或交出；在这里与“在……手中”连用，译作“交在……手中”既保留主动交付的意味，也不把审判意涵解释得过满。
- source_word: ውስተ እደ
  choice: 在……手中
  rationale: 保留表示落入他者权势之下的原文惯用意象，而不抽象化为“权下”。
- source_word: አናብስት
  choice: 狮子
  rationale: 此处列举具体猛兽，“狮子”符合该词通常含义及《动物启示录》的语境。
- source_word: አንምርት
  choice: 豹
  rationale: 该词与闪语中的“豹”同源；译作“豹”比“老虎”更符合古代近东的动物背景。
- source_word: አዝእብት
  choice: 狼
  rationale: 这是猛兽列表中含义明确的动物名称。
- source_word: አጽዕብት
  choice: 鬣狗
  rationale: 常被理解为鬣狗，但动物种类并非完全确定，故以脚注保留“豺”的可能。
- source_word: ቈናጽል
  choice: 狐狸
  rationale: 通常译作狐狸；古代动物名称的范围也可能涵盖豺，故加注说明。
- source_word: ኵሉ አራዊት
  choice: 一切野兽
  rationale: 原文由逐一列名转为涵盖全部野兽，译文保留这一扩展。
- source_word: ዝኩ አራዊተ ገዳም
  choice: 那些荒野的走兽
  rationale: 区别于前面的“一切野兽”，并保留“荒野/旷野之兽”的限定及指示词。
- source_word: አሐዙ
  choice: 便开始
  rationale: 与后续动词连用时表示动作开始；“便开始”自然呈现叙事推进。
- source_word: ይምሥጥዎሙ
  choice: 撕裂
  rationale: 该词描写猛兽猛烈撕扯的动作；“撕裂”比泛化的“毁灭”更贴近具体意象。
- source_word: እልኩ አባግዕ
  choice: 那些羊
  rationale: 保留指示词；“羊”也是本段动物寓言中既定的形象。
theological_decisions:
- issue: 审判意象中的行动主体
  choice: 他把它们交在猛兽手中
  alternative: 他把它们留在猛兽手中／他离弃它们，任凭猛兽处置
  rationale: 原文既可含“留下、离弃”，也可含“交出”的意味。正文采用“交在……手中”保存主动交付及司法性意象，但不在正文中解释猛兽所象征的民族或权势。
translation_notes:
  register: 采用庄重而自然的现代汉语。保留“交在……手中”的启示文学意象，并以“一切野兽”与“那些荒野的走兽”反映原文两个不同短语；不把动物寓意直接解释进正文。
