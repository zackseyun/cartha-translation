- from: 狼群开始使它们害怕，并欺压它们[a]，直到灭掉它们的幼崽，又把幼崽抛进水量充沛的河流里[b]。那些羊因自己的幼崽而呼喊，在它们的主面前哀号[c]。
  to: 狼群开始惧怕并欺压它们[a]，直到毁灭了它们的小羊，又把它们的小羊抛进一条水量充沛的水道中[b]。那些羊开始因自己的小羊而呼喊，并在它们的主面前哀号[c]。
  rationale: 修订恢复原文“狼群惧怕羊”的反常但应保留的表述，补出羊开始呼喊的起始义，并以“小羊”和“水道”提升汉语自然度及词义覆盖范围。脚注标记均紧邻其所说明的主文，且保留原有替代义与“主／主人”的歧义。
