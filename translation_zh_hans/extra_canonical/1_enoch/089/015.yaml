base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/015.yaml
  text: And the wolves began to terrify them and to oppress them[a], until they destroyed their little ones and cast their little ones into a stream of much water[c][b]. And those sheep began to cry out because of their little ones and to lament before their Lord.
translation:
  language: zh_hans
  text: 狼群开始惧怕并欺压它们[a]，直到毁灭了它们的小羊，又把它们的小羊抛进一条水量充沛的水道中[b]。那些羊开始因自己的小羊而呼喊，并在它们的主面前哀号[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欺压”也可译作“攻击”；原词可表示强力压迫或敌对袭击。
    reason: lexical_alternative
  - marker: b
    text: “一条水量充沛的水道”也可译作“水量很大的溪流”“河流”或“水势浩大的急流”。
    reason: lexical_alternative
  - marker: c
    text: “在它们的主面前”也可理解为“向它们的主人”；异象上下文较支持这里指神。
    reason: alternative_reading
lexical_decisions:
- source_word: አዝእብት
  choice: 狼群
  rationale: 保留动物启示录异象中的动物形象；用“狼群”自然表达复数群体。
- source_word: ይፈርህዎሙ
  choice: 使它们害怕
  rationale: 按语境取使役义，主语是狼群，受词是羊；既忠实保留“惧怕”语义，也避免译成狼害怕羊这一不合上下文的意思。
- source_word: አጠቅዎሙ
  choice: 欺压它们
  rationale: 该动词可指强力压迫或攻击；“欺压”适合持续性的敌对暴行，同时在脚注保留“攻击”的可能。
- source_word: እስከ ያኅልቅ
  choice: 直到灭掉
  rationale: 表达暴行达到毁灭性结果；“灭掉”有完全除灭的力度，且符合现代叙事语言。
- source_word: ደቂቆሙ
  choice: 它们的幼崽
  rationale: 在羊群寓言中，“幼崽”兼顾后代含义和动物意象；避免直接人化为“孩子”。
- source_word: ወገደፉ
  choice: 抛进
  rationale: 后接水流，表示强力投掷；“抛进”简洁、鲜明而不失庄重。
- source_word: በውኂዘ ማይ ብዙኅ
  choice: 水量充沛的河流里
  rationale: 该词组指水量丰沛的水道；“河流”在中文中自然，但原词也可能指溪流或急流，故脚注保留范围。
- source_word: እልኩ አባግዕ
  choice: 那些羊
  rationale: 保留指示词，明确回指异象中先前提到的羊群。
- source_word: ይጸርኁ
  choice: 呼喊
  rationale: 表达强烈而悲痛的发声，也可带有向主求告的意味。
- source_word: በእንተ ደቂቆሙ
  choice: 因自己的幼崽
  rationale: 介词短语在此最自然地说明呼喊的缘由，即幼崽所遭遇的灾难。
- source_word: ይስክዩ
  choice: 哀号
  rationale: 体现悲痛中的出声哀诉，比单纯“抱怨”更符合上下文。
- source_word: ኀበ እግዚኦሙ
  choice: 在它们的主面前
  rationale: 保留趋向或临在的表达，并以“主”呈现异象中向神发出的哀诉；脚注说明“主人”的可能。
theological_decisions:
- issue: እግዚኦሙ 在羊群寓言中应译为“主”还是“主人”
  choice: 它们的主
  alternative: 它们的主人
  rationale: 动物寓言本身容许“主人”，但《梦幻异象》的语境表明羊群向神圣的群羊监管者哀诉。“主”保留神学力度，同时以脚注承认寓言层面的词义张力。
- issue: ይፈርህዎሙ 的主体与使役关系
  choice: 狼群使羊害怕
  alternative: 狼群害怕羊
  rationale: 形态与语境支持使役理解；这也与后续欺压、毁灭幼崽的行动连贯。不过译文仍保留“害怕”这一核心概念，而不改写为较宽泛的“恐吓”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留动物寓言中的“狼群、羊、幼崽”等意象，不直接把它们解释为历史人物；句式紧凑，保持暴行与哀诉之间的推进。所有脚注标记均置于对应主文之后。
