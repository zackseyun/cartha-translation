base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/058.yaml
  text: And he kept still as he watched[a], and he rejoiced because they were devoured and swallowed up and carried off[c][b]; and he abandoned them into the hand of all the beasts for food.
translation:
  language: zh_hans
  text: 他默然观看，因它们被吞吃、被吞下、被攫走而欢喜；他把它们撇下，交在一切野兽手中作食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”是字面保留的习语，意思是落入对方的权势或控制之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: አርመመ እንዘ ይሬኢ
  choice: 静静地观看
  rationale: 将“保持安静”和同时进行的“观看”自然结合，保留叙事中的冷眼旁观之意，不把沉默限缩为不说话。
- source_word: ተፈሥሐ
  choice: 欢喜
  rationale: 直接表达喜悦，语体庄重而不古奥。
- source_word: ተበልዑ
  choice: 被吞吃
  rationale: 保留猛兽捕食的暴烈图景，比一般的“被吃”更有力度。
- source_word: ተውሕጡ
  choice: 被吞下
  rationale: 与前一动词构成累积递进，同时避免在中文中完全重复。
- source_word: ተሀይዱ
  choice: 被掳走
  rationale: 按该动词被强行带走、攫走的具体含义翻译，不泛化为“被毁灭”。
- source_word: ኃደጎሙ
  choice: 撇下它们
  rationale: 表达弃置、任其遭受危险；既保留审判的严厉，也不额外套入固定神学术语。
- source_word: ውስተ እዴ ኵሎሙ አራዊት
  choice: 交在一切野兽手中
  rationale: 保留“手中”这一表示权势或控制的闪族式意象，并以“交在”使现代中文通顺。
- source_word: ለመብልዕ
  choice: 作为食物
  rationale: 简洁保留目的或结果，并延续动物吞食的图景。
theological_decisions:
- issue: 弃置行为应理解为主动交付审判，还是撤回保护、任其受害
  choice: 他撇下它们，交在一切野兽手中
  alternative: 他把它们交给一切野兽
  rationale: 原文既有弃置，也有落入野兽权势之下的表达；译文保留这两层张力，不将其单纯解释为主动处刑或被动离开。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言；保留三个被动动词形成的累积图景。“它们”依本段动物异象的语境处理。脚注标记置于整句末尾，说明“手中”的习语含义。
