    issue: “被掳走”带有俘虏或劫掠人的现代语义。
    rationale: Ge'ez ተሀይዱ 表示被强行带走、攫走或叼走；在此野兽吞食的连续图景中，“被攫走”更准确，且不引入俘虏情节。
  - severity: low
    issue: 首句可更明确保留“沉默／安静”与“欢喜的原因”的句法关系。
    rationale: “默然观看，因……而欢喜”既保留同时观看和保持安静，也避免“见……就欢喜”稍偏口语化的即时因果语感。
