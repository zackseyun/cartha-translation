  rationale: 将“被掳走”改为“被攫走”，以准确表达动物性、强制性的带走而不带入俘虏含义；微调句法，使“默然观看”和“因……而欢喜”的关系更清楚。其余保留原译的弃置、交在野兽手中及供作食物等层次，并保留脚注锚点。
