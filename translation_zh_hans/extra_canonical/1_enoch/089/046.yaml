base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/046.yaml
  text: And he went to it and spoke to it alone[a], and raised up that ram, and made it ruler and leader of the sheep; and through all this[c][b], the dogs were afflicting the sheep.
translation:
  language: zh_hans
  text: 他走到它那里，单独对它说话[a]，又使那只公绵羊兴起，立它作羊群的统治者和领袖。在这一切过程中，狗一直欺压羊群。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “单独对它说话”也可理解为“只对它说话”；这里的“它”按上下文指那只公绵羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሖረ፡ ኀቤሁ
  choice: 他走到它那里
  rationale: 保留叙事中的趋向动作及动物异象的指称方式；吉兹语代词在语法上也可译作“他”，但汉语以“它”指异象中的公绵羊较自然。
- source_word: ወተናገረ፡ ለባሕቲቱ
  choice: 单独对它说话
  rationale: ለባሕቲቱ 表示“只对它／单独对它”，不将其误解为“对那只公绵羊”这一宾语名词短语。
- source_word: ወአንሥአ፡ ለውእቱ፡ ሐርጌ
  choice: 又兴起那只公绵羊
  rationale: 此处 ሐርጌ 按上下文指“公绵羊”，前置的 ለ 标示确定宾语；“兴起”保留 አንሥአ 的使其起来、抬举之意，又不提前等同于下一句的正式任命。
- source_word: ወገብረ፡ መኰንነ፡ ወመራሔ፡ ለአባግዕ
  choice: 立它作羊群的统治者和领袖
  rationale: 保留“统治者”和“领袖”两个并列的权柄与带领称谓；“立……作”符合现代汉语的任命语境。
- source_word: ወበኵሉዝ
  choice: 在这一切事发生的过程中
  rationale: 将该短语理解为时间或伴随情境，即“在这一切之中／与此同时”，不误作修饰后面“狗”的“所有”。
- source_word: አክላብ፡ ያጸህቅዎሙ፡ ለአባግዕ
  choice: 狗一直欺压羊群
  rationale: 动词表示持续施压、苦害或欺压；“一直欺压”既体现未完成式的延续性，也保留其强度，不具体化为“赶走”。
theological_decisions:
- issue: 是否把公绵羊及狗的动物异象直接解释为历史人物或政治势力
  choice: 保留公绵羊、羊群和狗的异象形象
  alternative: 在正文中直接换成所象征的人物或群体
  rationale: 原文以持续的动物异象表达历史与权柄；译文不应在正文中代替作者完成解释，也不应引入特定宗派或解释传统。
- issue: 如何处理“兴起”与“立作统治者和领袖”的关系
  choice: 保留为两个相接但不合并的动作
  alternative: 合并译作“立那只公绵羊作统治者和领袖”
  rationale: 原文先用“兴起／使起来”，再明确说“立作统治者和领袖”；保留两步可避免压平原文的修辞与潜在神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。动物统一用“它”指称，以维持异象层面；“统治者和领袖”“欺压”等词清楚易懂，同时保留原文的权柄语言和压迫力度。
