base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/065.yaml
  text: And I saw until those shepherds pastured in their season, and they began to kill and destroy much more than they had been commanded, and they abandoned those sheep into the hand of the lions.
translation:
  language: zh_hans
  text: 我观看，直到那些牧人在他们的时期牧放羊群[a]；他们开始杀戮、毁灭，远远超过了所领受的命令[b]，又把那些羊交弃在狮子手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在他们的时候”。此语指牧人活动的限定或指定时期。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“远超过他们的命令”，意为他们的杀戮和毁灭越过了所领受命令的限度。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: 牧人
  rationale: 保留《动物启示录》中以牧人象征受委任监管者的核心意象；“牧者”容易引入现代宗教职分含义。
- source_word: ይርዐዩ
  choice: 牧放羊群
  rationale: 该动词属于放牧语义场；补出语境中隐含的羊群，使现代汉语自然，同时不改变异象意象。
- source_word: በጊዜሁ
  choice: 按他们所定的时期
  rationale: 表达牧人活动有特定或划定时段；“所定”体现限定性，但不明说由谁制定。
- source_word: ወአኃዙ
  choice: 他们开始
  rationale: 在后续动词前起始动功能，译作“开始”最清楚自然。
- source_word: ይቅትሉ
  choice: 杀戮
  rationale: 直接表达夺取生命，并与后面的“毁灭”形成有力而庄重的并列。
- source_word: ያሕጕሉ
  choice: 毁灭
  rationale: 保留与“杀戮”并列所加强的破坏力度，同时不夸译为彻底灭绝。
- source_word: ብዙኃ እምትእዛዞሙ
  choice: 远远超过了所领受的命令
  rationale: 依最新语法审定，将该结构理解为程度比较，即其杀戮毁灭大大越过命令所划定的限度，而非把“许多”当作直接宾语。
- source_word: ኃደጉ
  choice: 丢在
  rationale: 表达牧人失责地将羊留给狮子；中文比“遗弃于”自然，又保留责难意味。
- source_word: ዝኩ አባግዐ
  choice: 那些羊
  rationale: 保留指示意义，回指异象中由这些牧人负责的特定羊群。
- source_word: ውስተ እደ አናብስት
  choice: 在狮子手中
  rationale: 保留“在……手中”这一表示落入权势控制的圣经式习语，并保持狮子的具体动物象征。
theological_decisions:
- issue: 牧人的暴行是否超出了所获授权
  choice: 译为“远远超过了所领受的命令”
  alternative: 按他们的命令行事；或只在受害数量上超过命令
  rationale: ግዕዝ语的比较结构最自然地表示其行为越过命令规定的限度。译文既保留他们曾受委任的事实，也保留他们滥用受托权柄而应负责任的张力，不进一步界定发令者或授权性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“牧人、羊、狮子”保持异象内部的动物象征；分号呈现观看过程与牧人罪行之间的推进。所有脚注标记均已置于正文相应位置。
