base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/051.yaml
  text: And again I saw those sheep[a], how they went astray and walked in many paths, and they abandoned that house of their Lord. And the Lord of the sheep called some from among the sheep and sent them to the sheep[c][b], but the sheep began to kill them.
translation:
  language: zh_hans
  text: 我又看见那些羊怎样走迷，走上许多条道路，并离弃了它们之主的那座房屋[a]。羊的主从羊群中召出一些羊，差遣它们到羊群那里；羊群却开始杀害它们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”也可译作“殿”；原词可泛指房屋，在这异象的语境中可能指向圣殿。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作：“羊群抓住它们，要杀害它们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ ካዕበ ለዝኩ አባግዕ ካዕበ
  choice: 我又看见那些羊怎样再次
  rationale: 保留原文两次出现的“再次”，同时把重复分置于“看见”和“走迷”的叙述中，使中文较自然；“那些羊”保留指回异象中既有群体的指示作用。
- source_word: ከመ ስሕቱ
  choice: 走迷了
  rationale: 兼顾羊偏离道路的具体意象与宗教、道德上的迷失含义；不武断译成被动的“被引入歧途”。
- source_word: ወሖሩ በብዙሕ ፍናዋት
  choice: 行在许多条路上
  rationale: 保留多条道路这一具体图像，不将其抽象化为单纯的悖逆。
- source_word: ወሐደጉ ዝኩ ቤተ ዚአሆሙ
  choice: 离弃了它们的那座殿
  rationale: ሐደገ 在此强于普通的离开；ቤት 可指房屋或圣殿，异象语境倾向圣殿，中文用“殿”保留祭祀性意涵。
- source_word: ወእግዚኦሙ ለአባግዕ
  choice: 羊的主
  rationale: እግዚእ 可指主人或主；在动物启示录中该形象代表统管羊群的上帝，译“主”兼具神学分量与所有权含义。
- source_word: ጸውዐ እምውስተቶሙ ለአባግዕ
  choice: 从羊群中召出一些羊
  rationale: 明确受召者本身也是羊，并表达他们从群体内部被拣选出来；“一些”是汉语为表达未定数量所需的自然补足。
- source_word: ወለአኮሙ ኀበ አባግዕ
  choice: 差它们到众羊那里
  rationale: “差”适合受委派执行使命的语境，又不额外说明其具体职分。
- source_word: ወአባግዕ አኃዙ ይቅትልዎሙ
  choice: 众羊却开始杀害它们
  rationale: 压缩结构可能表示开始杀害，也可能表示抓住以便杀害；正文采用起始义，并以脚注保存另一种具体理解。
theological_decisions:
- issue: 羊群寓言中 እግዚእ 的称谓
  choice: 主
  alternative: 主人
  rationale: 此角色在异象中代表上帝，译作“主”保留神学分量；脚注同时说明该词也可作日常所有权意义的“主人”，避免抹去牧群隐喻。
- issue: ቤት 在此处所指
  choice: 殿
  alternative: 房屋
  rationale: 在《动物启示录》的历史寓意中，这座建筑带有圣殿指向；但原词本身可泛指房屋，故以脚注保留词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文；保留羊群、道路和殿的异象意象。代词用“它们”指羊及受差遣者，避免提前把象征对象直接解释成人。
