  source_fidelity: 草稿大体保留了羊群、走迷、多条道路、从群体中召出并差遣、以及羊群杀害受差者的异象结构。但将“那座房屋”正文定译为“殿”，且省略“它们之主”的所属关系，超过了原文此处的明确程度；“再次”置入“走迷”也把反复的异象引语公式误作走迷动作的重复。
  naturalness: 整体庄重通顺，但“我又看见那些羊怎样再次走迷了”在现代汉语中略显生硬，也不准确地修饰“走迷”。“走上许多条道路”较自然，并保留原有具象意象。
  terminology: “羊的主”可保留，既对应原词的“主／主人”范围，也适合异象文体。“房屋”应置于正文；“殿”宜作为可能的语境性解释置于脚注，避免将原词的较宽词义直接窄化。脚注a原锚点标在“羊”后，却说明“殿”，须移至相关词语之后。
