    rationale: 原文对应“那座房屋／它们之主的房屋”。该建筑在整体异象中可能具有圣殿指向，但本节词语本身并未要求正文直接译为“殿”；同时其所属者是羊的主，不能省去。
  - severity: medium
    issue: “再次”被译作修饰“走迷”。
    rationale: 反复出现的“又／再次”属于异象叙述公式；依英文审校记录，中文不必机械重复两次，但也不应把它转移为羊再次走迷的断言。
  - severity: low
