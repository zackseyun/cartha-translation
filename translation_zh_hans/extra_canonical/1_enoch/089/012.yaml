base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/012.yaml
  text: And that bull which was born from him begot a black wild boar and a white sheep[a]; and that wild boar produced many boars[c][b], and that sheep produced twelve sheep.
translation:
  language: zh_hans
  text: 那头由他所生的公牛，生了一头黑色的野猪和一只白羊[a]。那头野猪生了许多野猪[b]，那只羊生了十二只羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节延续异象中的象征性谱系。译文保留公牛、野猪和羊的形象，不在正文中以其可能代表的人物或族群取代它们。
    reason: cultural_note
  - marker: b
    text: “许多野猪”按上下文理解为前述野猪所生的同类后代；原文在这里使用复数动物称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወውእቱ፡ ላህም፡ ዘተወልደ፡ እምኔሁ
  choice: 那头由他所生的公牛
  rationale: ውእቱ及关系动词形式为阳性，语境也要求这头牛为生育后代的雄性，因此译作“公牛”，不译作“母牛”或“小母牛”。“由他所生”保留原文的谱系表达。
- source_word: ወለደ
  choice: 生了
  rationale: 该动词表示生育、产生后代。现代汉语用“生了”自然简洁，也保留异象中动物谱系的叙述方式。
- source_word: ሐራዊያ፡ ገዳም፡ ጸሊመ
  choice: 一头黑色的野猪
  rationale: 该动物词指野生猪类；“黑色”在原文中明说，并可能具有象征作用，故完整保留。
- source_word: ወበግዐ፡ ጸዐዳ
  choice: 一只白羊
  rationale: 原词属于羊类称谓，此处未必需要在汉语中限定为公羊、母羊或羔羊；“白羊”既保留颜色意象，也避免过度具体化。
- source_word: አሕርወ፡ ብዙኃነ
  choice: 许多野猪
  rationale: 按上下文理解为与前述野猪相应的复数后代；译文重复“野猪”，以维持动物象征的连贯性。
- source_word: ዐሠርተ፡ ወክልኤተ፡ አባግዐ
  choice: 十二只羊
  rationale: 数词直译为“十和二”，即十二；复数名词泛指羊，不强调幼龄，故不译作“十二只羔羊”。
theological_decisions:
- issue: 《动物启示录》中动物形象所代表的历史人物或族群
  choice: 正文照原文保留公牛、野猪和羊等动物意象
  alternative: 在正文中直接改写为相关祖先、民族或族群的名称
  rationale: 本段借持续的动物异象表达谱系和历史。直接代入解释会消除启示文学有意保留的象征张力，因此正文不替读者确定其历史所指。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。量词依现代汉语习惯分别使用“头”和“只”；句式保持简洁，以呈现异象中连续、谱系式的叙述。所有象征性色彩与动物类别均在正文中明确保留。
