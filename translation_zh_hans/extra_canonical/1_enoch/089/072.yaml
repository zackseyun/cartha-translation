base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/072.yaml
  text: And again I saw the shepherds pasturing for twelve hours, and behold, three of those sheep returned, and they arrived and entered, and they began to build up all that had fallen down of that house.
translation:
  language: zh_hans
  text: 我又看见牧人牧放了十二个时辰。看哪，那些羊中有三只回来了；它们来到并进入，开始重建那座房屋所有倒塌的部分。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现提供的吉兹语转录至“开始建造一切……”为止；“那座房屋”及其“倒塌的部分”是依据本节经校核的英译层和上下文补足。
    reason: 明确标示所给吉兹语转录的可见文本在此中断，避免将补足内容误当作该转录中完整可见的文字。
lexical_decisions:
- source_word: ወእምኔሁ
  choice: 我又
  rationale: 承接异象叙述，按此处语境表达再次看见；避免生硬直译连接成分。
- source_word: ይርዐዩ፡ ኖሎት፡ ፲ወ፪ሰዓተ
  choice: 牧人放牧了十二个时辰
  rationale: 保留“牧人”“放牧”和“十二时辰”的意象及时间表述，不将其历史寓意直接写入正文。
- source_word: ፫ እምዝኩ፡ አባግዕ፡ ገብኡ
  choice: 那些羊中有三只回来了
  rationale: ገብኡ本可表示“进入”或“回来”；因下文另有“进入”，此处译作“回来”更能保留动作次序并避免重复。
- source_word: ወመጽኡ፡ ወቦኡ
  choice: 它们来到并进入
  rationale: 依次保留两个并列动作，不擅自说明进入何处。
- source_word: ወአኀዙ፡ እንዘ፡ ሐንጹ
  choice: 开始重建
  rationale: 表达“开始建造”的未完成动作；结合倒塌之物的语境，用“重建”较自然。
theological_decisions:
- issue: 十二个时辰及三个羊的历史或神学所指
  choice: 正文只保留异象中的数字和形象
  alternative: 直接解释为特定历史时期或人物
  rationale: 原文在本节未明说其对应对象；不把某一解释传统写进译文。
- issue: “回来”与“进入”的关系
  choice: 将前一动词译作“回来”，后一动词译作“进入”
  alternative: 两处都译作“进入”
  rationale: 该词具有语义弹性，而后文明确出现“进入”；当前译法保持叙事顺序，但不进一步界定返回地点。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留异象叙事的提示语气；“十二个时辰”保留古代时间意象，不现代化为具体小时数。
