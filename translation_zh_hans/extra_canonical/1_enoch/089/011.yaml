  rationale: 修订不改变异象的动物意象、谱系关系或野驴繁增的陈述。它改善了现代汉语流畅度，并更准确地处理原文“与它同在”这一代词关系的争议：正文不以中文代词强行指定先行词，脚注则明确说明问题所在。
