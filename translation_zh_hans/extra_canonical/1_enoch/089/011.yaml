base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/011.yaml
  text: And they began to gore one another[a]; and that white bull which was born in their midst begot a wild ass and a white bull with it[c][b], and the wild asses multiplied.
translation:
  language: zh_hans
  text: 它们开始彼此用角冲撞[a]。那头生在它们中间的白公牛生了一头野驴和一头白公牛；两者同在[b]。野驴也增多了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处原文的传本和转录较难确定；动词看来是说这些动物彼此进行猛烈动作。译作“用角冲撞”，是为保留牛类互相冲撞的形象；也可译作“彼此攻击”。
    reason: textual_variant
  - marker: b
    text: 原文此处的单数代词在句法上可能指向前文不同的雄性动物，具体所指并不完全明确。正文译作“两者同在”，保留野驴与白公牛之间的关联，而不在正文中强行判定该代词的先行词。
    reason: referential_ambiguity
lexical_decisions:
- source_word: ይትናሰኩ
  choice: 开始彼此用角相抵
  rationale: 该复数形式在动物异象的语境中表示相互的暴力动作；译文保留牛类用角攻击的具体形象，同时以脚注说明文本困难。
- source_word: ላህም ጸዓዳ
  choice: 白公牛
  rationale: ላህም 可泛指牛类；此处是单数，并在谱系叙事中作主动生育者，译作“公牛”自然且不预先破解象征。ጸዓዳ 的颜色象征应直译为“白”。
- source_word: ዘተወልደ ማእከሎሙ
  choice: 生在它们中间的
  rationale: 保留关系从句的被动出生含义，并准确修饰前面的白公牛。
- source_word: ወለደ
  choice: 生了
  rationale: 这是本句主要的主动谓语，表示该白公牛产生后代；现代汉语用“生了”简洁自然。
- source_word: አድገ ገዳም
  choice: 一头野驴
  rationale: 该词组在此为单数，指旷野中的驴，即“野驴”，不应因邻近的牛类意象而改译为牛犊。
- source_word: ላህመ ጸዓዳ ምስሌሁ
  choice: 一头白公牛与它同在
  rationale: 逐项保留另一头白色牛类及“与它同在”的关系；代词所指在句法上可能有歧义，因此不在正文中强行解释。
- source_word: በዝኁ አእዱገ ገዳም
  choice: 野驴也增多了
  rationale: በዝኁ 表示变多、繁衍；复数 አእዱገ ገዳም 明确指野驴群。
theological_decisions:
- issue: 动物异象是否应在译文中直接解码为历史人物或族群
  choice: 保留“白公牛”“野驴”等具体动物形象
  alternative: 在正文中直接写出亚伯拉罕、以实玛利、以撒或相应族群
  rationale: 原文以持续的动物象征讲述谱系；翻译应保存异象表层及其神学张力，不把解释直接写进正文。
- issue: “与它同在”的代词具体指向
  choice: 保留中性而略带歧义的“与它同在”
  alternative: 明确解释为白公牛与野驴一同出生，或与父牛同在
  rationale: 原文 ምስሌሁ 的具体所指并非完全无歧义；正文不宜擅自消除这种句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留启示文学具体的动物意象，不在正文中加入人物身份解释；量词统一用“头”，并以“公牛”表达此处谱系中雄性牛类的角色。
