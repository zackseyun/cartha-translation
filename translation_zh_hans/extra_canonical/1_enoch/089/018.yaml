base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/018.yaml
  text: And one sheep went to the wolves at the word of the Lord[a], and another sheep met him and went with him. And the two of them went together and entered into the assembly of those wolves, and they spoke to them and made them hear[d][c][b], that from then on they should not ravage the sheep.
translation:
  language: zh_hans
  text: 有一只羊奉主的话[a]，往狼群那里去；另一只羊遇见了它，便与它同行。两只羊一同前去，进入那些狼的集会中，对它们说话，并警告它们[b]，从那时起不可再蹂躏群羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遵照主的命令”。原文可指因主所说的话或命令而采取行动。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“使它们听见，临到（或针对）它们”；此处结合后面的禁令，意为郑重警告它们。
    reason: idiom_clarification
lexical_decisions:
- source_word: በግዕ
  choice: 羊
  rationale: 《动物启示录》持续使用动物象征；“羊”保留其泛称和象征性，不额外限定性别或年龄。
- source_word: አዝእብት
  choice: 狼
  rationale: 该词的通常含义为“狼”，也符合本段捕食者与羊对立的意象。
- source_word: በቃለ እግዚእ
  choice: 奉主的话
  rationale: 既保留“话”的形式，也自然表达这只羊因神圣话语或命令而行动；脚注说明“命令”的可能含义。
- source_word: ተረክቦ
  choice: 遇见了它
  rationale: 上下文先写相遇，后写同行；“遇见”不会把后续的结伴含义提前并入本动词。
- source_word: ኅቡረ
  choice: 一同
  rationale: 直接表达两只羊联合行动。
- source_word: ማኅበሮሙ
  choice: 集会
  rationale: 保留有组织的聚集之意，同时避免“会众”可能带入的后期宗教团体色彩。
- source_word: ወተናገርዎሙ
  choice: 对它们说话
  rationale: 按叙事次序直译普通的言说动作。
- source_word: ወአስምዑ ዲቤሆሙ
  choice: 警告它们
  rationale: 该使役结构与方位介词连用，在此禁令语境中具有使对方听取、向对方作警告的语用含义；中文若硬译为“使它们听见”会掩盖针对性的告诫意味。
- source_word: ከመ እምይእዜ
  choice: 从那时起
  rationale: 明确标示此后持续生效的时间起点。
- source_word: ኢይግሥሥዎሙ
  choice: 不可再蹂躏
  rationale: “蹂躏”保留狼对羊施加的捕食性暴力，比笼统的“伤害”更贴合意象；“不可”表达警告内容中的禁止。
- source_word: አባግዕት
  choice: 群羊
  rationale: 保留复数羊的动物意象，并使现代汉语表达自然。
theological_decisions:
- issue: 启示异象语境中 እግዚእ 的译法
  choice: 主
  alternative: 主人
  rationale: 这里指差遣羊、赋予其使命的神圣权威；“主”保留敬称及神学分量，而不把它弱化为普通所有者。
- issue: 警告内容的情态
  choice: 不可再蹂躏
  alternative: 不再蹂躏／不应再蹂躏
  rationale: 原文处于告诫或禁令内容中；“不可”自然传达禁止，同时不把它改写成对未来结果的绝对预言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“羊—狼”的连续象征和原文的动作顺序；动物代词统一用“它／它们”。“奉主的话”兼顾形式对应与现代汉语习惯，“警告”则按完整习语和语境翻译，避免生硬直译。
