revisions:
- from: 有一只羊奉主的话[a]到狼那里去；另一只羊遇见了它，便与它同行。两只羊一同前去，进入那些狼的集会中，对它们说话，并警告它们[b]，从那时起不可再蹂躏群羊。
  to: 有一只羊奉主的话[a]，往狼群那里去；另一只羊遇见了它，便与它同行。两只羊一同前去，进入那些狼的集会中，对它们说话，并警告它们[b]，从那时起不可再蹂躏群羊。
