  text: And that sheep went up onto the summit of that lofty rock, and the Lord of the sheep sent him to them.
translation:
  language: zh_hans
  text: 那只羊登上那座高耸的岩石的顶端，羊群的主派他到他们那里去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በግዕ
  choice: 羊
  rationale: 按本章持续使用的羊群异象意象直译，保留其象征性，不在正文中明说所指人物。
- source_word: ድማኃ፡ ለዝኩ፡ ኰኵሕ፡ ነዋሕ
  choice: 那座高耸岩石的顶端
  rationale: 将表示顶部或顶端的词与“那座高耸的岩石”自然组合，既对应源文空间关系，也与本节英语审校层的 summit 和 lofty 相符。
- source_word: እግዚኦሙ፡ ለአባግዕ
  choice: 羊群的主
  rationale: 直译属格结构；用“羊群”表达复数集合，避免误解为若干位彼此独立的主人。
- source_word: ፈነዎ፡ ኀቤሆሙ
  choice: 把他差到他们那里
  rationale: 保留源文阳性单数受词和复数指向对象，不替读者消解“他”与“他们”的象征所指；“差”体现受命派遣。
theological_decisions:
- issue: 异象中羊、羊群之主及代词的象征身份
  choice: 保留动物意象与代词，不在正文中解释其历史或神学身份
  alternative: 直接以摩西、上帝或以色列人等名称替换
  rationale: 源文以异象性称谓和代词叙述；直接点明身份会将解释写入译文，并消除原有的文学张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“高耸岩石”比“高岩石”更自然，也保留源文所强调的高度；“把他差到他们那里”略带经文语感，但在现代汉语中仍清楚可懂。
