base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/060.yaml
  text: “And I will hand them over to you by number[a], and I will tell you which of them are to be destroyed[c][b], and those you shall destroy.” And he handed over to them those sheep.
translation:
  language: zh_hans
  text: “我要按数目把它们交给你们[a]，也要告诉你们，其中哪些该被毁灭[b]；你们要毁灭那些羊。”他就把那些羊交给了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按数目”也可理解为“逐一”或“照数”；原文强调交付与数目相对应。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“将被毁灭”。原文此处未明说毁灭行动的施事者；随后则命令受话者执行毁灭。
    reason: ambiguity
lexical_decisions:
- source_word: አሜጥወክሙ
  choice: 我要把它们交给你们
  rationale: 该动词是第一人称单数，带第二人称复数受词，源自“交付、交给”之义；不译作“告诉你们”，因为后面的እነግረክሙ才是“告诉你们”。依上下文补出复数受词“它们”。
- source_word: በኍልቍ
  choice: 按数目
  rationale: 这里表示依照数目或计数交付，不是“实在地”。“按数目”既贴近原文，也保留可能是逐一清点的含义。
- source_word: እነግረክሙ
  choice: 也要告诉你们
  rationale: 该词明确表达告知，保持第一人称对第二人称复数的直接讲话，并以“也”连接前一动作。
- source_word: ዘይትኃጐል
  choice: 哪些该被毁灭
  rationale: 关系结构指向羊群中将被毁灭或应受毁灭的对象；被动表达保留原文没有明说施事者的形式。
- source_word: እምኔሆሙ
  choice: 其中
  rationale: 原义为“从它们之中”，现代汉语用“其中”自然表达从整个群体中加以区分。
- source_word: አኅጕሉ
  choice: 你们就要毁灭那些
  rationale: 这是复数命令式“毁灭”，不是“聚集”。补出主语“你们”，并用“那些”回指先前被指定为应毁灭的羊。
- source_word: መጠወ ሎሙ
  choice: 他把……交给了他们
  rationale: 这是第三人称阳性单数主动式，而非被动式；“交给”准确表达向复数对象的移交。
- source_word: ዝኩ አባግዐ
  choice: 那些羊
  rationale: 结合名词的集合或复数指向，译为“那些羊”，与本段动物异象的叙述对象一致。
theological_decisions:
- issue: 谁决定并执行羊的毁灭
  choice: 保留“该被毁灭”的被动表达，同时明确受命者要执行毁灭
  alternative: 译为“我要毁灭哪些”或直接说明神是毁灭者
  rationale: 原文没有在关系从句中明确被动动作的施事者，却在随后用命令式要求受话者执行；译文不额外指定幕后决定者，以保留审判叙事中的张力。
- issue: 末句交付动作的语态
  choice: 他把那些羊交给了他们
  alternative: 那些羊被交给了他们／托付给了他们
  rationale: 原文动词是主动第三人称单数；采用主动式可避免把“交付”解释成较中性的“托付”，也不额外说明交付的最终目的。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引号表明本句前半继续上一节的直接引语；“于是”清楚标示随后转回叙述。代词“它们”用于羊群，“那些羊”则在末句恢复明确名词，避免汉语指代含混。
