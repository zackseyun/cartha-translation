base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/053.yaml
  text: And he sent many other sheep to those sheep[d][c][b][a], that they might hear and cry out over them.
translation:
  language: zh_hans
  text: 他差遣许多别的羊到那些羊那里，好叫它们宣告[a]，并就那些羊呼喊[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告”字面可作“使人听见”；原文使用“听”的因使形式，也可译作“传告”。
    reason: lexical_alternative
  - marker: b
    text: “就那些羊呼喊”也可理解为“为那些羊呼喊”“向那些羊呼喊”，或“反对那些羊呼喊”。原文介词关系有歧义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልኣነ አባግዕ ብዙኃነ
  choice: 许多别的羊
  rationale: 保留复数数量和异于前一群体的含义，也维持《动物启示录》的羊群意象。
- source_word: ፈነወ
  choice: 他又差遣
  rationale: 该词为第三人称阳性单数完成式，故译作“他差遣”，而非“我差遣”；“又”自然承接叙事。
- source_word: ኀቤሆሙ ለዝኩ አባግዕ
  choice: 到那些羊那里
  rationale: 明确表达朝向前述羊群的方向和受遣对象。
- source_word: ያስምዑ
  choice: 使它们宣告
  rationale: 该形式是“听”之因使词干的虚拟式，字面有“使人听见”之意；现代汉语用“宣告”表达其使人听见、传告的功能，同时以脚注保留直译。
- source_word: የአውይዉ
  choice: 呼喊
  rationale: 表达大声喊叫，但不擅自限定为哀号、抗议或警告。
- source_word: ዲቤሆሙ
  choice: 为那些羊
  rationale: 介词关系可指在其上、关于或针对；此处采用较自然且不带敌对预设的“为”，并在脚注列明其他可能。
theological_decisions:
- issue: “别的羊”的象征身份
  choice: 在正文中保留“别的羊”的异象意象，不解释其历史身份。
  alternative: 直接解释为先知、忠信领袖或以色列中的改革群体。
  rationale: 原文以动物象征叙事，并未在本节明说所指；直译可避免把某种解释写入正文。
- issue: 受遣之羊所执行的行动
  choice: 将因使式译为“宣告”，但不补出宣告的内容或把羊直接称为先知。
  alternative: 译作“作见证”，或弱化为“听见”。
  rationale: “作见证”可能引入原文未明确表达的神学术语，而“听见”未体现因使词干；“宣告”较好保留“使人听见”的语义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留羊的启示文学意象及原文在呼喊对象或缘由上的歧义。
