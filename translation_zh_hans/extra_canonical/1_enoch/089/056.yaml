base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/056.yaml
  text: And I saw that he abandoned that house of theirs and their tower and all their beloved ones into the hand of the lions[a], so that they might tear them apart, and into the hands of all the wild beasts[c][b], so that they might devour them.
translation:
  language: zh_hans
  text: 我看见他撇弃了他们的房屋和塔[a]，把他们全都交在狮子手中[b]，让狮子撕裂他们；又交在一切野兽手中，让野兽吞吃他们。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”和“塔”保留异象本身的说法；正文没有把它们直接解释为圣殿、羊圈或群体。
    reason: cultural_note
  - marker: b
    text: “交在……手中”是惯用语，意思是交由对方控制或处置。
    reason: lexical_alternative
  - marker: c
    text: 原文后半句的语序也可理解为：“把他们全都交在狮子手中，让它们撕裂并吞吃他们，又交在一切野兽手中。”
    reason: textual_ambiguity
lexical_decisions:
- source_word: ሐደጎ
  choice: 撇弃了
  rationale: 该动词有“离开、弃置”之意；“撇弃”既保留审判语境中的力度，也符合庄重而通顺的现代汉语。
- source_word: ቤተ
  choice: 房屋
  rationale: 采用基本义“房屋”，不在正文中将异象意象直接解释为圣殿、羊圈或群体。
- source_word: ማኅፈዶሙ
  choice: 他们的塔
  rationale: 该词在此指与房屋相连的防护性建筑；“塔”保留异象中的具体建筑意象。
- source_word: ወደዮሙ
  choice: 把他们全都交在
  rationale: 动词连同复数宾语后缀表达将他们交出或置于某方权下。原文没有独立表示“所爱之人”的词，因此不采用英语咨询层中的“all their beloved ones”。
- source_word: ዲበ እደ / ውስተ እደዊሆሙ
  choice: 在……手中
  rationale: 保留闪语式“手中”惯用语，表示落入对方的控制或权势之下；在现代汉语圣经语体中仍清楚自然。
- source_word: አናብስት
  choice: 狮子
  rationale: 采用该名词通常的具体动物义，不把动物启示录中的象征直接解码。
- source_word: ይምሥጥዎሙ
  choice: 撕裂他们
  rationale: 与后面的“吞吃”构成猛烈的捕食图景；“撕裂”保留原文暴力强度而不过度增译。
- source_word: ይብልዕዎሙ
  choice: 吞吃他们
  rationale: 该动词基本义为吃、吞食；“吞吃”切合野兽施行毁灭的语境。
- source_word: አራዊት
  choice: 一切野兽
  rationale: “野兽”保留威胁色彩，并与异象中的家畜类动物相区别。
theological_decisions:
- issue: 是否在正文中把“房屋”和“塔”解释为圣殿、羊圈或共同体
  choice: 保留“房屋”和“塔”的异象原貌
  alternative: 按象征所指译作“圣殿”“羊圈”或“共同体”
  rationale: 原文陈述的是具体异象；直接解码会消除启示文学有意保留的象征张力。
- issue: 是否把“在……手中”完全意译为“受……支配”
  choice: 译作“交在……手中”
  alternative: 译作“交给……”或“置于……权下”
  rationale: 这一表达既能传达被交付于敌对势力的含义，也保留原文的圣经—启示文学语感。
- issue: 狮子与一切野兽分别对应哪个目的从句
  choice: 为使汉语关系清楚，将“撕裂”与狮子相连，将“吞吃”与一切野兽相连
  alternative: 严格依照原文线性次序，使两个目的从句之后才出现“一切野兽手中”
  rationale: 原文次序可理解为交错结构；正文采用关系清楚的重排，同时用脚注保存另一种句法理解，避免把真实歧义静默消除。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。保留启示文学的具体动物与建筑意象；“撇弃”“交在……手中”“吞吃”等用语维持经文语体，但避免生硬仿古。
