base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/025.yaml
  text: And those wolves again showed themselves to the sheep[a], and they went into the midst of that stream of water[d][c][b]; and those wolves followed the sheep and ran after them into that stream of water.
translation:
  language: zh_hans
  text: 那些狼又追赶羊群[a]。羊群走进那道水流的中央；那些狼跟着羊群，追赶它们，也进入那道水流[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有埃塞俄比亚文转录在此处似有OCR或转录讹误，因而可见近于“使羊群看见”的读法。依据查尔斯版所见读法及上下文，此处译作“那些狼又追赶羊群”。
    reason: textual_variant
  - marker: b
    text: 末句在“那些狼”和“那道水流”附近有重复，句法也不甚整齐；译文保留狼跟随、追赶羊群并进入水中的基本结构。
    reason: textual_variant
lexical_decisions:
- source_word: ወ*ጓዲሆሙ፡ ዝኩ፡ አዝእት
  choice: 那些狼又
  rationale: 传抄文本首词疑有讹误，可能本为表示“又、再次”的形式；结合句法与叙事重复，译出“又”，同时不据此把后面的使役视觉动词改成“追赶”。
- source_word: አርእይዎሙ፡ ለአባግዕ
  choice: 显现在羊群面前
  rationale: 原词形通常涉及“使看见、让……看见”，但此处宾语关系和传本文字均较困难；“显现在……面前”保留视觉语义，又比生硬的“使羊看见”更符合现代汉语，并以脚注保留其他可能。
- source_word: አባግዕ
  choice: 羊群
  rationale: 保留动物异象中的具体意象；中文以“羊群”自然表达复数群体，未替换为其历史所指。
- source_word: ማእከለ፡ ዝኩ፡ ዐይገ፡ ማይ
  choice: 那道水流的中央
  rationale: 保留“中央/当中”的空间意义，并将水道或流动水体译作不限定规模的“水流”。
- source_word: ተለውዎሙ፡ ለአባግዕ
  choice: 跟着羊群
  rationale: ተለወ的基本意义为“跟随”，语境可含追逐意味；后文已有“追赶”，故此处采用“跟着”以保留动作层次。
- source_word: ወረጹ፡ ድኅሬሆሙ
  choice: 追赶它们
  rationale: 直译其奔跑在后、追随在后的动态意义，以简洁现代汉语表现追逐场面。
theological_decisions:
- issue: 动物启示录的象征意象
  choice: 正文保留“狼”“羊群”“水流”等具体形象
  alternative: 直接译成埃及人、以色列人和红海等历史所指
  rationale: 异象本身以动物和景物承载历史象征；翻译不应把解释直接代入正文，以免消解启示文学的多层表达。
- issue: 首句究竟描述显现还是追赶
  choice: 按现存所给词形保留视觉语义，译为“显现在羊群面前”
  alternative: 依据校勘推测，将首句译为“那些狼又追赶羊群”
  rationale: 最新校勘意见彼此冲突，且提供的原文确实呈现使役“看见”词形。正文优先反映现有文字证据，脚注说明传本与校勘的不确定性，不武断解决。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“显现在……面前”保留原文视觉动词的张力；“水流”避免过度确定为河、急流或海。所有象征形象均原样保留，不将历史解释写入正文。
