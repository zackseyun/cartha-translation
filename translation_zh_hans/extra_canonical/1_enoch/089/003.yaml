base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/003.yaml
  text: And again I saw[a], and behold, springs were opened upon the earth in that great enclosure, and that water was bubbling up and rising over the earth, and that enclosure appeared[e][d][c][b], until all its land was covered with water.
translation:
  language: zh_hans
  text: 我又看见，看哪，在那大片围地中，地上的泉源[a]都打开了。水正涌出并在地上上涨时，那片围地可看见[b]，直到那片围地的全境都被水淹没[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “泉源”也可译作“泉眼”或“水源”。
    reason: lexical_alternative
  - marker: b
    text: 这一分句的句法较难，也可译作“那片围地显现出来”或“那片围地被看见”。也可理解为：水上涨时，围地尚可看见，直到完全被淹。
    reason: alternative_reading
  - marker: c
    text: “那片围地的全境”也可理解为“全地”，取决于此处代词后缀所指的对象。
    reason: alternative_reading
lexical_decisions:
- source_word: አንቅዕታት
  choice: 泉源
  rationale: 该复数名词指从地下出水的天然水源；“泉源”既符合洪水异象的语境，也不使人误以为是人工喷泉。
- source_word: ተርሕዉ
  choice: 都打开了
  rationale: 保留原文被动意义，描写泉源被开启；“都”自然体现复数主语，并使现代汉语通顺。
- source_word: ዐጸድ ዐቢይ
  choice: 大围地
  rationale: 该词表示有边界或围起来的地域。“围地”保留空间受界定的意象，同时避免擅自具体化为田野、庭院或园子。
- source_word: ወአንዘ
  choice: 当……时
  rationale: 按时间从句处理，连接水涌出、上涨与围地仍可看见的景象；不加入原文没有的“开始”。
- source_word: ይፈልሕ
  choice: 不断涌出
  rationale: 表现水从地下向外、向上冒出的动态，又不误作字面上的沸腾。
- source_word: ይትነሣእ
  choice: 在地面上涨
  rationale: 与“涌出”并列，表达水势升高；“上涨”是现代汉语描写水位升高的自然用语。
- source_word: ተአርአየ ለውእቱ ዐጸድ
  choice: 那片围地仍可看见
  rationale: 原句在句法上较难。“可看见”贴近被动或中间态的视觉意义；“仍”依据随后的“直到”表达其在完全被淹前尚且可见的时间关系，但不把这一解释绝对化，故加脚注说明。
- source_word: ኵሉ ምድሩ
  choice: 其中所有土地
  rationale: 将代词后缀理解为回指围地，表达该围地内部的全部地面；脚注同时保留“全地”的可能读法。
theological_decisions:
- issue: 洪水异象所覆盖的范围
  choice: 正文写作“其中所有土地”，以围地为直接所指。
  alternative: “全地”，即把洪水明确理解为覆盖整个大地。
  rationale: 原文既使用可指“地”或“土地”的词，又带有可能回指围地的代词形式。正文采用较近的局部指代，同时以脚注保留普遍范围的理解，不替读者消除原文的张力。
- issue: 水上涨时围地是否依然可见
  choice: 正文写作“仍可看见”，使时间从句与“直到”形成连贯关系。
  alternative: “那片围地显现出来”或“那片围地被看见”。
  rationale: 原动词容许“显现”或“被看见”，但上下文也可能表示围地一直可见，直到被水完全覆盖。脚注保留较直译的方案。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留异象叙述的提示语；“围地”虽不是最高频日常词，却能准确保留原文有边界地域的意象。句子按原文时间关系分为两句，以免汉语主干过长，同时不改变事件次序。
