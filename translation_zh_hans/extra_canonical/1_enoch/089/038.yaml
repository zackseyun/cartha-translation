base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/038.yaml
  text: And that sheep who was leading them[a], who had become a man, was separated from them and lay down[c][b]; and all the sheep sought him and cried out over him with a great cry.
translation:
  language: zh_hans
  text: 那只一直带领它们、已经变成人的羊，同它们分开了，躺下了[a][b]；所有的羊都寻找它，为它放声大哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “躺下”在这个异象中很可能表示这位领头者死去，但原文仍用“躺下”的形象来表达。
    reason: lexical_alternative
  - marker: b
    text: 这只羊“变成人”是梦中异象里的象征性变化，叙述并未因此脱离寓意层面。
    reason: cultural_note
lexical_decisions:
- source_word: ወዝኩ በግዕ
  choice: 那只……羊
  rationale: ዝኩ是指示词“那”，并非“我看见”；以“那只羊”承接异象中已知的象征角色。
- source_word: ዘይመርሖሙ
  choice: 一直带领它们
  rationale: 保留关系从句及未完成体所表达的持续带领角色。
- source_word: ዘኮነ ብእሴ
  choice: 已经变成人
  rationale: 表达异象内部已经发生的象征性变化，不将其改写为脱离寓意层面的现实事件。
- source_word: ተሌለየ እምኔሆሙ
  choice: 离开了它们
  rationale: 自然表达与群羊分离；原文未说明行动者或原因，因此不译作“被带走”。
- source_word: ወሰከበ
  choice: 躺下了
  rationale: 保留动词“躺下”的基本形象；上下文可能暗示死亡，但正文不直接替读者作出解释。
- source_word: ኃሠሥዎ
  choice: 寻找它
  rationale: 直接传达群羊搜寻那只羊的动作。
- source_word: ወጸርኁ ዲቤሁ ጽራኀ ዐቢየ
  choice: 为它放声大哭
  rationale: 以自然庄重的现代汉语传达针对它发出的巨大哀哭，同时保留强烈情感。
theological_decisions:
- issue: “躺下”是否应明确解释为死亡
  choice: 正文保留“躺下了”
  alternative: 译作“死了”或“睡去了”
  rationale: 原文借异象形象表达事件，很可能暗示领袖之死，但并未明说；保留字面形象可避免消解启示文学的含混和张力。
- issue: 羊变成人的性质
  choice: 按梦中异象的象征变化直译
  alternative: 将其解释为现实身份变化
  rationale: 这句话仍处于动物异象的寓意叙事中，不宜把象征变化改写成教义解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；维持动物异象的象征称谓，并依原文顺序先说“带领它们”，再说“变成人”。所有代词均按“羊”的语法指称译作“它”。
