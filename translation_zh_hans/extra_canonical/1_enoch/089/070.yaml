base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/070.yaml
  text: And thus in the vision I saw that the one who wrote wrote down every one that was destroyed by those shepherds[a], day by day, and he brought up and laid down and showed that whole book to the Lord of the sheep, all that they had done, and all that each one of them had made away with[d][c][b], and all that they had given over to destruction.
translation:
  language: zh_hans
  text: 我在异象中看见，那位记录者逐日记下那些牧人所毁灭的每一只羊[a]；他把整卷书带上去，放在群羊之主面前，并把书中所记的一切给群羊之主看：他们所做的一切、他们各自所除去的一切[b]，以及他们交付毁灭的一切。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的句法也可理解为：“他每天记下那些牧人中每一个遭毁灭的牧人。”正文按动物寓言的上下文，理解为牧人毁灭群羊中的个体。
    reason: 句法歧义
  - marker: b
    text: “除去”所译的埃塞俄比亚文词形较难确定，也可能指“移走”“使消失”或“撇在一旁”；经文没有明确说明具体方式。
    reason: 词义选择
  - marker: c
    text: 逐日书写并把整卷书呈到群羊之主面前，构成天上存案和审判问责的图景。
    reason: 文学与神学意象
lexical_decisions:
- source_word: ወከመዝ፡ በራእይ፡ ርኢክዎ
  choice: 我在异象中看见
  rationale: 保留异象叙事的报告语气；“看见”自然、庄重，不作古语化处理。
- source_word: ለዝኩ፡ ዘይጽሕፍ
  choice: 那位记录者
  rationale: 原文按其书写职能指称此人；译作“记录者”既简洁，又不额外断定其具体天使职分。
- source_word: እፎ፡ ይጽሕፍ
  choice: 记了下来
  rationale: 体现实际登记、成文的动作，并保留天上案卷的意象；汉语不机械重复“写的人写下”。
- source_word: ዘይትሐጐል
  choice: 所毁灭的
  rationale: 该词表达毁灭或灭亡；这里采用被动含义，同时不具体限定死亡、失踪等方式。
- source_word: እምነ፡ ዝኩ፡ ኖላዊያን
  choice: 那些牧人……所
  rationale: 结合关系从句译为施事结构，表达这些牧人造成毁灭；正文保持通顺，另以脚注保留句法上的另一种理解。
- source_word: በኵሉ፡ ዕለት
  choice: 每天
  rationale: 表达逐日持续、逐项记录的意思，现代汉语自然清楚。
- source_word: ያዓርግ
  choice: 把……带上去
  rationale: 按使役形态处理为“使上去／带上去”，而非仅译作记录者自己“上去”。
- source_word: ያዓርፍ
  choice: 放在……面前
  rationale: 保留把案卷安放、呈到神圣审判者面前的具体动作，不直接抽象化为“汇报”。
- source_word: ያርኢ፡ ኵሎ፡ ኪያሁ፡ መጽሐፈ
  choice: 把整卷书……给他看
  rationale: 明确译出“书”，并传达展示整份记录的动作。
- source_word: ለእግዚአ፡ አባግዕ
  choice: 群羊之主
  rationale: 直译动物寓言中的称号，保留羊群及其主人的核心意象。
- source_word: ኵሎ፡ ዘገብሩ
  choice: 他们所做的一切
  rationale: 忠实表达对牧人全部行为的记录。
- source_word: ኵሎ፡ ዘአእተተ፡ ፷፻፡ እምኔሆሙ
  choice: 他们各自所除去的一切
  rationale: 该词形和数词所表达的分配关系较难；“各自”反映逐一追责，“除去”则保留移走、使消失等宽泛可能，不擅自限定为杀害。
- source_word: ኵሎ፡ ዘመጠዉ፡ ለሐጕል
  choice: 他们交付毁灭的一切
  rationale: 保留“交付／给出”与“毁灭”的搭配及审判语气，不把对象范围过早限定为人或羊。
theological_decisions:
- issue: 记录者的身份
  choice: 仅称“那位记录者”
  alternative: 明确称为天使、天上书记或以诺本人
  rationale: 经文只以书写、带上并呈示案卷的行为辨认此人物；不越过文本为其确定更具体身份。
- issue: “群羊之主”的所指
  choice: 保留寓言称号“群羊之主”
  alternative: 直接释译为“上帝”或视为梦中普通主人
  rationale: 在动物启示录语境中此称号指向神圣的羊群主人和审判者，但正文应保留原有寓言形象，不将其扁平化。
- issue: 天上案卷与审判意象
  choice: 具体保留记录、带上、放置和展示整卷书的动作
  alternative: 概括成向上帝汇报牧人的行为
  rationale: 原文的连续动作构成天上法庭和问责场景；直观保留这些动作可避免把神学张力化约为普通汇报。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留动物寓言中的“牧人”“群羊之主”和天上案卷意象；适度调整原文重复，使汉语自然，但以脚注保存关键句法及词义歧义。
