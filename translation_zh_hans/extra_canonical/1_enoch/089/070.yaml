  to: 我在异象中看见，那位记录者逐日记下那些牧人所毁灭的每一只羊[a]；他把整卷书带上去，放在群羊之主面前，并把书中所记的一切给群羊之主看：他们所做的一切、他们各自所除去的一切[b]，以及他们交付毁灭的一切。[c]
  rationale: 修订仅解决正文的汉语指称不全和代词轻微含混，不改变主要译法或神学意象。补出的“羊”由动物寓言的近处语境限定；脚注明确保留原文第一分句可能指向“牧人中遭毁灭者”的争议性句法，避免将该理解从文本传统中抹去。
