base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/027.yaml
  text: And I saw until all the wolves that followed those sheep perished and were drowned[a][b].
translation:
  language: zh_hans
  text: 我一直观看，直到所有跟在那些羊后面的狼[a]都灭亡，并被淹死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跟在……后面”也可按这里的敌对语境译作“追赶”。
    reason: lexical_ambiguity
  - marker: b
    text: 原文用了两个动词，依次表达“灭亡”和“被淹没（或沉没）”，因此这里没有把二者合并成一个动作。
    reason: source_clarity
lexical_decisions:
- source_word: ወርኢኩ እስከ
  choice: 我一直观看，直到
  rationale: 保留异象叙事中“观看，直到某事发生”的延续结构；用“一直观看”使现代汉语自然，同时不削弱原文的第一人称见证。
- source_word: ኵሎሙ አዝእብት
  choice: 所有……的狼
  rationale: አዝእብት特指“狼”，并延续《动物启示录》的象征图景，不泛化为“野兽”，也不直接解释其历史所指。
- source_word: እለ ተለውዎሙ
  choice: 跟在那些羊后面的
  rationale: 该短语表示狼跟随羊而行；此处措辞保留“跟随”与敌意语境下“追赶”之间的语义张力，避免把动作误译为“离开”或“背弃”。
- source_word: ተሐጕሉ
  choice: 灭亡
  rationale: 将第一个结局动词译为“灭亡”，与随后表示淹没的动词区分开来。
- source_word: ወተሠጥሙ
  choice: 并被淹死
  rationale: 该动词表示沉没或溺亡；“被淹死”清楚呈现水中毁灭的画面，同时保留与前一动词并列的结构。
theological_decisions:
- issue: 是否在正文中点明狼与羊的历史或神学所指
  choice: 保留“狼”和“羊”的动物意象
  alternative: 直接译成埃及人、以色列人或其他历史群体
  rationale: 本段以持续的动物象征讲述异象。正文应保存其文学形式及解释空间，不把一种象征解读写进译文。
- issue: 狼的动作应译为中性的“跟随”还是带敌意的“追赶”
  choice: 正文采用“跟在……后面”，脚注说明也可理解为“追赶”
  alternative: 直接译作“追赶那些羊”
  rationale: 原词本身侧重跟随、随后而行，而上下文中的狼又明显具有敌意；本译法同时保留词义和语境张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我一直观看，直到”保留异象叙事的推进方式；“跟在那些羊后面的狼”避免生硬的逐词翻译，并借脚注呈现“跟随／追赶”的语境歧义。
