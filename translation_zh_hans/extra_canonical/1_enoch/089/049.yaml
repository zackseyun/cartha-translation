base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/049.yaml
  text: And those sheep grew and multiplied[a], and all those dogs and foxes and wild boars of the field feared and fled from them. And that ram gored and killed all the beasts, and those beasts were no longer able again to be in the midst of the sheep[e][d][c][b], and they did not seize anything from them.
translation:
  language: zh_hans
  text: 那些羊增多，数目繁盛起来；所有的狗、狐狸[a]和旷野的野猪[b]都惧怕它们，从它们面前逃走了。那只公羊用角猛撞[c]，杀死了所有的野兽；那些野兽再也不能再次在羊群中间，也不再从它们那里掠走任何东西[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狐狸”也可译作“胡狼”；所指狐类动物的具体种类不能确定。
    reason: lexical_alternative
  - marker: b
    text: “旷野的野猪”也可译作“荒野中的野生猪群”。
    reason: lexical_alternative
  - marker: c
    text: 原词也可较宽泛地译作“击打”；因主语是公羊，这里按语境译为“用角猛撞”。
    reason: lexical_alternative
  - marker: d
    text: 末句强调这些野兽不再能从羊群中抢夺任何东西。
    reason: clarification
lexical_decisions:
- source_word: ልህቁ / በዝኁ
  choice: 渐渐增多，数目繁盛
  rationale: 两个近义动词并列，加强羊群增长、兴盛之意；中文保留双重表达，同时避免生硬重复。
- source_word: አባግዕ
  choice: 羊／羊群
  rationale: 首次保留具体的“羊”这一异象形象；在表示群体内部时用自然的集合表达“羊群”。
- source_word: አክላብ
  choice: 狗
  rationale: 按字面保留动物意象，不将其解释为历史群体。
- source_word: ቈናጽል
  choice: 狐狸
  rationale: 该词指狐类食腐或捕食动物，但具体物种不确定；正文采用通顺的“狐狸”，脚注注明“胡狼”的可能。
- source_word: ሐራዊያ ገዳም
  choice: 旷野的野猪
  rationale: 保留野生猪类与荒野环境的双重含义，现代汉语自然清楚。
- source_word: ፈርሁ ወነፍጹ እምኔሁ
  choice: 都惧怕它们，从它们面前逃走了
  rationale: 分别表达内在恐惧和外在逃离，保留原文两个动作。
- source_word: ሐርጌ
  choice: 公羊
  rationale: 指作为领袖形象的雄羊；“公羊”在现代普通话中准确而自然。
- source_word: ጐድአ
  choice: 用角猛撞
  rationale: 动词本义可泛指击打，但主语是公羊，语境中译作以角猛撞最能保存具体的动物动作；脚注保留较宽泛译法。
- source_word: አራዊተ / አራዊት
  choice: 野兽
  rationale: 比泛称“动物”更能体现这些敌对、未驯服的兽类，同时保留启示性异象的语感。
- source_word: አክህሉ ዳግመ ... ማእከለ አባግዕ
  choice: 再也不能回到羊群中间
  rationale: “再也不能”表达能力的终止，“回到”体现ዳግመ的再次之意；句式符合现代汉语。
- source_word: ምንትኒ ገሙራ ኢመሠጡ እምኔሆሙ
  choice: 也不能从它们那里掠走任何东西
  rationale: 强调掠夺行为彻底停止；“掠走”比普通的“拿走”更符合猛兽袭击羊群的语境。
theological_decisions:
- issue: 是否在正文中解释动物寓意所指的民族或阵营
  choice: 正文只保留动物异象，不作历史身份解码
  alternative: 将羊、公羊和敌对野兽直接译成其可能象征的人群或势力
  rationale: 原文以连续的动物异象传达意义；直接解码会消除文本本身的象征张力，并引入有争议的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文反复、具体的动物意象，同时用“再也不能回到”和“掠走”使汉语关系清楚。所有脚注标记均放在相关词句之后。
