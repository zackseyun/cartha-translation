base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/062.yaml
  text: 'And all the excess and destruction that was done by the shepherds[a], the scribe wrote down: how many they destroyed by my command, and how many they destroyed of their own accord[e][d][c][b]; all the destruction of those seventy shepherds was recorded against them.'
translation:
  language: zh_hans
  text: 牧人所行的一切过度之事和毁坏[a]，书吏都记录下来：他们奉我的命令毁坏了多少，又自行毁坏了多少[b]；那七十个牧人所造成的一切毁坏，都被记在他们的账上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“毁坏”的同一词根在本节多次出现，也可包含“暴力除去、使之败亡”的意思；“过度之事”所对应的词亦较难确定，可能着重于越过所定限度。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“在他们自己的头上”。这里译作“自行”，但该说法也可能强调责任归在他们自己身上；也可译作“由自己负责”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽጋበ
  choice: 过度之事
  rationale: 此词在这里与“毁坏”并列，较可能指牧人越过限度的行为。译作“过度之事”保留其抽象性，也不将它与后面的毁坏混为一谈。
- source_word: ሐጕለ / ያሐጕሉ / ያሐጕሎሙ
  choice: 毁坏
  rationale: 同一词根在本节反复出现，语义涉及毁灭、使之败亡或暴力除去；统一译作“毁坏”，既维持原文重复，也避免无根据地区分不同动作。
- source_word: በኖሎት
  choice: 牧人所行的
  rationale: ኖሎት 是“牧人”的复数形式，前置词 በ 表示行为的施事；因此应译为“由牧人所行”，而不是“象”。
- source_word: ጻሐፍ
  choice: 书记都记录下来／都被记下
  rationale: 此词与书写、记录有关；按汉语句法，在前句明确“书记”为施事，在末句采用被动表达天上账册中的记录。
- source_word: ሚመጠነ
  choice: 多少
  rationale: 重复形式引出数量核算，译作“多少”自然地体现逐项计数与追责。
- source_word: በትእዛዝየ
  choice: 奉我的命令
  rationale: 保留第一人称领属和命令的权威语气，不额外指明说话者的神学身份。
- source_word: በርእሶሙ
  choice: 由自己负责
  rationale: 字面为“在／按他们自己的头上”，在此语境中指责任归于他们自身；“由自己负责”比“出于自己的意愿”更能保留责任层面的含义。
- source_word: ፯፯ ኖላዊ
  choice: 那七十个牧人
  rationale: 保留异象中的固定象征称谓与明确数字。
- source_word: ዲቤሆሙ
  choice: 记在他们的账上
  rationale: 该介词形式可表示“在他们之上”或“针对他们”；结合记录审判的语境，汉语“记在他们的账上”既自然，也表达记录归责于他们。
theological_decisions:
- issue: 命令与牧人自身责任之间的区分
  choice: 把第一类毁坏表述为“奉我的命令”，第二类表述为“由自己负责”。
  alternative: 把第二句译为“毁坏临到他们自己头上的有多少”，或将两类毁坏都理解为奉命而行。
  rationale: 原文将 በትእዛዝየ（奉我的命令）与 በርእሶሙ（在／按他们自己的头上）对举，显示两种不同的责任归属。译文保留神圣命令与牧人越权受责之间的张力，而不进一步断定其意志状态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留“牧人”“七十”等异象意象。通过重复“毁坏”呈现原文词根复现；用“书记”“记在账上”清楚传达审判记录的场景。
