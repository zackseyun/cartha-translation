base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/013.yaml
  text: And when those twelve sheep had grown, they handed over one of them to the donkeys, and those donkeys in turn handed over that sheep to the wolves, and that sheep grew up in the midst of the wolves.
translation:
  language: zh_hans
  text: 那十二只羊长大以后，就把其中一只交给了驴群；驴群又把那只羊交给了狼群。那只羊便在狼群中长大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቁ
  choice: 长大
  rationale: 该动词在本节首尾重复，译作“长大”既符合成长语境，也保留原文的首尾呼应。
- source_word: ፲ወ፪አባግዕ
  choice: 十二只羊
  rationale: 直接保留原文数目和动物意象；中文以量词“只”自然表达。
- source_word: መጦውዎ
  choice: 交给
  rationale: 原文两次使用同一动词，表示把那只羊转交给另一群动物；两处统一译法以保留重复结构。
- source_word: አእዱግ
  choice: 驴群
  rationale: 复数名词指多头驴；用“驴群”既表达复数，也使动物寓言的群体关系清楚自然。
- source_word: አዝእብት
  choice: 狼群
  rationale: 复数名词指群狼；译作“狼群”可自然呈现那只羊所处的群体环境。
- source_word: ማእከለ
  choice: 在……中
  rationale: 对应“在……中间、当中”，不额外解释其寓意。
theological_decisions:
- issue: 动物寓言所指的历史人物与群体
  choice: 正文仅保留羊、驴、狼等原始意象，不作身份明示
  alternative: 在正文中将各动物直接解释为特定人物或民族
  rationale: 本节采用象征性叙述，原文本身没有在此处明说各动物的对应身份；直译意象可避免把某一解释传统写入正文。
- issue: 第二次转交的衔接关系
  choice: 以“又”表达再次转交
  alternative: 译作“转而”“依次”或加入更强的因果、顺序说明
  rationale: 原文ካዕበ表示“又、再次”；“又”保留其简洁含义，不强化原文未明说的逻辑关系。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。以分号和句号梳理连续动作，同时保留“交给……又交给……”及“长大……长大”的重复。原文中的数字29—36属于版面或校勘标记，不进入经文正文。
