base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/071.yaml
  text: And the book was read before the Lord of the sheep[a], and he took the book from his hand and read it, and sealed it[c][b], and set it down.
translation:
  language: zh_hans
  text: 书在群羊之主面前被读[a]。他便从其手中[b]接过书来，读了，将它封缄[c]，然后放下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存转录作 ተነበ，可能是 ተነበበ（“被读”）的缺写形式。因此这里译作“被读”；旧译“被打开”不符合该动词较可靠的还原。
    reason: 文本与词形说明
  - marker: b
    text: 原文只说“从其手中”，没有再次明说这只手属于谁。
    reason: 代词所指含混
  - marker: c
    text: 或译：“把它封了起来。”原词指封缄文书，带有加印封缄的意味。
    reason: 词义说明
lexical_decisions:
- source_word: መጽሐፍ
  choice: 书
  rationale: 这是指书面记录的常用词；译作“书”自然，也不武断限定其形制为卷轴。
- source_word: ተነበ
  choice: 被宣读
  rationale: 现有转录可能缺写一个音节，按 ተነበበ 理解为“被读”。后文再次出现“读”，表明这里有意叙述先在群羊之主面前宣读，随后由他亲自阅读。
- source_word: በቅድመ
  choice: 在……面前
  rationale: 准确表达临在于某位权威者面前的意思，也符合异象中审察记录的场景。
- source_word: እግዚአ አባግዕ
  choice: 群羊之主
  rationale: 保留动物启示录贯穿始终的群羊意象，并以“主”体现这一称号的权威和庄重。
- source_word: ነሥአ
  choice: 接过
  rationale: 此处表示从另一位持有者手中取得书；“接过”比单纯“拿起”更能体现来源。
- source_word: እምእዱ
  choice: 从其手中
  rationale: 直译手中的具体意象，同时以“其”保留原文未明确说明所指对象的代词歧义。
- source_word: አንበበ
  choice: 亲自读了
  rationale: 基本义为“读”。加入“亲自”是为了用自然汉语显明叙事中的主语转换及前后两次阅读，但不改变动作本身。
- source_word: ኀተማ
  choice: 封上印
  rationale: 保留给文书加封印的具体动作及其司法、认证意味，不将其抽象化为“批准”。
- source_word: አንበረ
  choice: 放下
  rationale: 表示把书安放下来；“放下”简洁自然，并承接阅读、封印之后的动作次序。
theological_decisions:
- issue: 动物启示录中 እግዚአ አባግዕ 的称号
  choice: 群羊之主
  alternative: 群羊的主人
  rationale: “群羊之主”既保留神圣权威和启示文学的庄重语体，也不抹去原文的动物象征。
- issue: 前后两次“读”的重复
  choice: 保留为先“被宣读”、后“亲自读了”
  alternative: 把第一处译为“被打开”
  rationale: 第一处动词按完整形式应为“被读”，后文则明确说群羊之主取书阅读；重复反映两阶段动作，不应因行文看似重复而改成“打开”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“群羊之主”保留启示文学称号；“从其手中”略带书面色彩，是为避免擅自确定代词所指。句子分为两句，使先在主前宣读、后由主接过阅读的动作层次清楚。
