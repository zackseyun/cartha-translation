    reason: textual_variant
  revision_rationale: 将不定的“有人”改为“羊群”，以保留原文复数动词及其在上下文中最自然的指向；狼仍明确为受击打者。保留关于末词校勘读法的脚注，并将“停止”按紧邻的“羊群安静下来”具体表达为“不再呼喊”。
