base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/020.yaml
  text: And the Lord of the sheep came to them[a], and while they were striking those wolves, and the wolves were crying out, the sheep became silent[c][b], and from that time they cried out no more.
translation:
  language: zh_hans
  text: 羊群的主来到它们那里。当羊群击打那些狼、狼哀号时，羊群就安静下来；从那时起不再呼喊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据转写的末词看似可读作“他们呼喊”，但校勘读法为“他们停止”。这里按上下文译作“不再呼喊”；代词所指也可能受文本传抄问题影响。
    reason: textual_variant
lexical_decisions:
- source_word: እግዚኦሙ
  choice: 羊群的主
  rationale: 原词直译为“它们的主”；在本段动物异象中，所指为羊群的主。译作“羊群的主”既明确所属关系，也保留异象的象征框架。
- source_word: መጽአ ኀቤሆሙ
  choice: 来到它们那里
  rationale: 保留移动及趋向意义，并以现代汉语自然表达。
- source_word: አባግዕ
  choice: 羊群
  rationale: 该词指羊；汉语用“羊群”可自然表达复数集合，同时维持异象中反复出现的羊之意象。
- source_word: ይዝብጥዎሙ ለእልኩ አዝእብት
  choice: 有人击打那些狼
  rationale: 介词ለ在此标示宾语，因此“那些狼”是受击打者，不应译成狼践踏羊。动词的施事者在现存句法中不够明确，故用“有人”保留不确定性。
- source_word: አዝእብት እንዘ የአውይዉ
  choice: 狼就哀号
  rationale: 动词表示高声呼喊；“哀号”符合狼受击打时发声的语境，又不把它限定为普通动物性的“嚎叫”。
- source_word: አባግዕ አርመሙ
  choice: 羊群安静下来
  rationale: 表达由发声转为沉默的状态变化。
- source_word: ወእምሶቤሃ አፀርኁ
  choice: 从那时起不再呼喊
  rationale: 所给转写末词可被读作“呼喊”，但校勘所依据的读法为አጸርዑ（“停止”）。结合前句“安静下来”，译出所停止的动作为“不再呼喊”，并以脚注说明文本问题。
theological_decisions:
- issue: 动物异象中“羊群的主”的身份
  choice: 保留称号“羊群的主”，按异象语境指向上帝
  alternative: 译作较含混的“它们的主人”
  rationale: 上下文以羊象征受治理的群体，并以其主作为神圣统治者；此译明确异象内部的关系，却不加入后期教义称谓。
- issue: 击打狼者的身份
  choice: 译作不定施事“有人”
  alternative: 明确译为“他们”或“主和随从击打”
  rationale: 原文动词为复数，而紧邻的“主”为单数，施事者并未在本句清楚说明；不将其神学化或补出原文没有的角色。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。短句呈现异象动作的推进；用“有人”及脚注保留施事者不明的句法张力，并明确标注末词的校勘问题。
