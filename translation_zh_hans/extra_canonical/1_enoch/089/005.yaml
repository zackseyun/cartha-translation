base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/005.yaml
  text: And all the cattle in that enclosure were gathered together[a], until I saw them sink, and be swallowed up[d][c][b], and be destroyed in that water.
translation:
  language: zh_hans
  text: 那围场[a]里所有的牲畜都聚集起来，直到我看见它们沉下去，被吞没，并在那水中灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “围场”也可译作“田地”或“牧场”；原词可指耕作或放牧用的开阔场地。这里按本章上下文译作“围场”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ
  choice: 所有的
  rationale: 保留总括范围，同时符合现代汉语的自然表达。
- source_word: አላህምት
  choice: 牲畜
  rationale: 保留《动物启示录》的群畜意象，不在正文中将象征直接解释为人群；也避免较窄的“牛群”。
- source_word: ዐጸድ
  choice: 围场
  rationale: 本章前后语境把该处描绘成一个进水的封闭场地；“围场”能维持空间上的连续性，同时脚注保留“田地、牧场”的词义可能。
- source_word: ተጋብኡ
  choice: 都聚集起来
  rationale: 表达群体汇聚的动作，并以“都”与前面的总括词相呼应。
- source_word: እስክነ ርኢክዎሙ
  choice: 直到我看见它们
  rationale: 保留动词中的第三人称复数宾语，并让后续三个动词共同作为所见内容。
- source_word: ይሠጠሙ
  choice: 沉下去
  rationale: 直接呈现沉入水中的动态画面。
- source_word: ይትወንጡ
  choice: 被吞没
  rationale: 保留中被动含义和灾难场景的强烈意象。
- source_word: ይትኃጐሉ
  choice: 灭亡
  rationale: 作为三连动词的高潮，表达最终毁灭，又不采用语气过强的“彻底消灭”。
- source_word: ማይ
  choice: 水
  rationale: 对应原文单数名词，不擅自扩译为“洪水”。
theological_decisions:
- issue: 异象中的动物象征
  choice: 正文直译为“牲畜”
  alternative: 人群／人民
  rationale: 原文借动物持续承载象征意义；译文应保留象征载体，而不在正文中预先解码。
- issue: 连续三个毁灭动词的关系
  choice: 分别译作“沉下去、被吞没、灭亡”
  alternative: 合并为“淹死”或“被水毁灭”
  rationale: 保留原文递进而密集的三重描写及其神学张力，不把异象的细节压缩成单一结论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“直到我看见它们……”保留异象叙事的现场感；三个并列动词不予合并，以维持原文的节奏和强度。
