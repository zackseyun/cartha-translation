base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/043.yaml
  text: And that ram began to gore on this side and on that side those dogs and foxes and wild boars[c][b][a], until he had destroyed them all.
translation:
  language: zh_hans
  text: 那只公绵羊开始从这边、从那边[b]抵撞那些狗、狐狸[a]和野猪，直到把它们全都消灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狐狸”也可能泛指胡狼等野生犬科动物。
    reason: lexical_alternative
  - marker: b
    text: 直译为“从这边、从那边”，保留原文的重复表达；可理解为向两边或四处攻击。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ፡ ሐርጌ
  choice: 那只公绵羊
  rationale: 依照吉兹语当前校勘判断，ወዝኩ表示“而/那”，不增补原文没有的“我看见”；ሐርጌ在本段动物异象的上下文中指公绵羊，而非“角”。
- source_word: አኃዘ፡ ይወግእ
  choice: 开始……抵撞
  rationale: 保留动作的起始义，并以“抵撞”呈现公绵羊用角冲击的具体动物形象，避免泛化为“作战”。
- source_word: እምዝየ፡ ወእምዝየ
  choice: 从这边到那边
  rationale: 保留原文重复而有方向感的表达；其语用上可指向两边或四处攻击。
- source_word: ዝኩ፡ አክላብ
  choice: 那些狗
  rationale: 保留指示成分“那些”和动物寓象，不在正文中解释其历史所指。
- source_word: ቈናጽል
  choice: 狐狸
  rationale: “狐狸”是可行的通常译法，但吉兹语动物名称可能泛指狐、胡狼一类野生犬科动物，因此加注说明。
- source_word: ሐራዊያ፡ ገዳም
  choice: 野猪
  rationale: 自然而具体地表达荒野中的野生猪类，并保留异象的动物意象。
- source_word: እስከ፡ ለኵሎሙ፡ አኅጐሎሙ
  choice: 直到把它们全都消灭
  rationale: 表达行动持续到敌对动物全部被除灭的完成结果，力度与原文相称。
theological_decisions:
- issue: 是否在正文中把动物象征解释为特定历史民族或群体
  choice: 保留公绵羊、狗、狐狸和野猪的字面异象
  alternative: 在译文中直接写出其可能代表的历史人物、民族或政治势力
  rationale: 本节属于动物异象；翻译应保存寓象及其张力，不把有争议的历史辨识写进经文正文。
- issue: 把公绵羊的动作译为一般战争还是具体抵撞
  choice: 译作“抵撞”
  alternative: 译作“作战”或“交战”
  rationale: “抵撞”保留公绵羊行为的具象性，同时仍让读者看出其争战含义，不预先消解异象语言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公绵羊”明确动物类别；“抵撞”简洁地保持其用角攻击的异象画面。所有注释标记均置于正文相应位置。
