base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/054.yaml
  text: And after that I saw when they abandoned the house of the Lord and his tower[a], and they all went astray, and their eyes were blinded. And I saw the Lord of the sheep bring about a great slaughter among them in their pasture[f][e][d][c][b], until those sheep cried out because of that slaughter and abandoned his place.
translation:
  language: zh_hans
  text: 此后，我看见他们离弃了主的殿和他的塔楼[a]；他们全都走入歧途，眼睛也失明了。我又看见羊群之主在他们的牧场中使他们遭受大规模杀戮，直到那些羊招来那场杀戮，并背弃了他的居所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔楼”也可理解为“羊圈”或“围栏”；这幅图像可能属于异象中象征性的圣所建筑群。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾的原文较难理解。也有人译作：“直到那些羊因那场杀戮而呼喊，并离弃了他的居所”；末一动词还可能理解为“交出了他的居所”。
    reason: textual_and_lexical_difficulty
lexical_decisions:
- source_word: ኃደጉ
  choice: 离弃
  rationale: 表达带有责任意味的离开，比中性的“离开”更符合审判语境。
- source_word: ቤተ ለእግዚአ
  choice: 主的殿
  rationale: 在动物异象中指象征性的圣所；“殿”在现代汉语中自然地传达圣所含义，同时不脱离“房屋”的意象。
- source_word: ማኅፈዶ
  choice: 他的塔楼
  rationale: 保留异象中与羊群及圣所建筑群相关的防护性建筑意象；其他可能含义列入脚注。
- source_word: ስሕቱ
  choice: 走入歧途
  rationale: 兼顾羊群走失的空间意象与道德偏离的含义。
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: 眼睛也失明了
  rationale: 保留原文被动、强烈的失去视力意象。
- source_word: እግዚአ አባግዕ
  choice: 羊群之主
  rationale: 作为《动物启示录》反复出现的尊称，既保持庄重，也保留羊群寓意。
- source_word: ገብረ ቀትለ ብዙኃ
  choice: 使他们遭受一场大杀戮
  rationale: 保留羊群之主在审判中的主动作用，不将其弱化为单纯许可。
- source_word: በመራዕይሆሙ
  choice: 在他们的牧场中
  rationale: 符合羊群异象中的放牧场景，也忠实表达牧场或草场之意。
- source_word: ይጼውዕዎ ... ለዝኩ ቀትል
  choice: 招来那场杀戮
  rationale: 动词带第三人称阳性单数宾语后缀，而“那场杀戮”受宾格标记，较自然地理解为羊把那场杀戮召来，而非仅因杀戮哀号。
- source_word: አግብኡ መካኖ
  choice: 出卖了他的居所
  rationale: 将使役形式理解为交出或出卖；鉴于文本及词义存在困难，在脚注中保留另一种传统理解。
theological_decisions:
- issue: 杀戮的施行者
  choice: 羊群之主使他们遭受一场大杀戮
  alternative: 羊群之主容许他们中间发生一场大杀戮
  rationale: 吉兹语将羊群之主写成主动施行审判者；译文保留这一神学张力，不把主动作用弱化为许可。
- issue: 羊群对杀戮的关系
  choice: 那些羊招来那场杀戮
  alternative: 那些羊因那场杀戮而呼喊
  rationale: 宾语后缀及宾格结构支持“召来杀戮”，但句法历来有不同理解，因此以脚注说明另一读法。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言；以“殿”“羊群之主”“牧场”等词维持动物异象与圣所象征的双重意象。脚注标记均置于正文对应位置。
