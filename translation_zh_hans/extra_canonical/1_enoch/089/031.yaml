base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/031.yaml
  text: And all those feared and trembled before him[a], and they followed after that ram that was with them [that was in their midst][c][b], because it was not able to stand before our Lord and look at him.
translation:
  language: zh_hans
  text: 他们全都惧怕，在他面前战抖，并跟随那只与他们同在的公绵羊[a]——[那只在他们中间的][b]——；因为它不能站在我们的主面前，也不能仰望他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跟随”所据的吉兹语短语含义困难，也可理解为“在后面呼喊”或“为那只公绵羊呼求”。
    reason: lexical_alternative
  - marker: b
    text: “那只在他们中间的”在所据底本中以方括号标出，可能是次生增文或存疑读法。
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎሙ እልኩ
  choice: 他们全都
  rationale: 该短语总括前文所指的群体；用自然的现代汉语保留其回指和全称意义，不采用生硬的“所有那些被说到的”。
- source_word: ይፈርሁ ወይርዐዱ
  choice: 惧怕战抖
  rationale: 两个并列动词分别表达恐惧及身体颤抖，译文不将这一加强式表达合并简化。
- source_word: እምኔሁ
  choice: 因他而
  rationale: 介词短语可表达来源、缘由或相对关系；此处“因他而”自然呈现恐惧由该人物引起，同时避免把空间意义解释得过死。
- source_word: ወደርኁ ድኅሬሁ ለዝኩ በግዕ
  choice: 并向那只……公绵羊呼求
  rationale: 该处词法和句法困难，语境显示众者向那只公绵羊发出求告；主文采用“呼求”，并以脚注保留“在后面呼喊、跟随”等可能性。
- source_word: በግዕ
  choice: 公绵羊
  rationale: 动物启示录中的物种和性别意象具有叙事作用；“公绵羊”比泛称“羊”更能保存该象征层面的区别。
- source_word: ምስሌሆሙ
  choice: 与他们同在
  rationale: 忠实表达该公绵羊与群体相伴的关系；后接的存疑短语进一步说明它在他们中间。
- source_word: ዘሀሎ ማእከሎሙ
  choice: 就是在他们中间的
  rationale: 该短语在所给底本中带方括号，主文照样以方括号保存，不将其无声删除或确认为原始读法。
- source_word: እስመ ኢንክል ቀዊመ
  choice: 我们不能站
  rationale: 动词形式宜理解为第一人称复数，承接群体向公绵羊发出的陈述；因此不依照英语咨询层将主语改成单数的“它”。
- source_word: ቅድመ እግዚእነ
  choice: 在我们的主面前
  rationale: 保留原文第一人称复数领属成分“我们的”，并用“主”维持异象审判场景中的尊称，不进一步指明其身份。
- source_word: ወአነጽሮቶ
  choice: 也不能仰望他
  rationale: 该动词表示观看、注视；“仰望”在此既符合面对威严者的场景，又保持现代庄重语体。
theological_decisions:
- issue: “我们的主”的所指
  choice: 保留“我们的主”
  alternative: 上帝／羊群之主／天上的君王
  rationale: 原文使用领属式尊称，译文不以解释性神名替换，从而保留异象叙事本身的象征张力。
- issue: 末句“不能站立并观看”的主语
  choice: 理解为发言群体的第一人称复数“我们”
  alternative: 理解为那只公绵羊：“它不能站立并观看”
  rationale: 原文动词形态支持第一人称复数，且前面的呼求自然引出群体的直接陈述；这一选择以吉兹语证据为先，不跟随英语咨询文本的单数处理。
- issue: 是否明确补出直接引语
  choice: 以“说：”引出直接引语
  alternative: 作为间接原因从句：“因为我们不能……”
  rationale: “我们不能”表明话语视角已经转入群体发言；补出汉语所需的引语框架可清楚呈现人称转换，而不增加实质神学内容。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“惧怕战抖”的双重表达、动物异象中的“公绵羊”以及“我们的主”这一未被进一步解释的称谓。方括号直接呈现底本文本疑点；脚注标记均已置于正文相应位置。
