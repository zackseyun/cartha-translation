base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/016.yaml
  text: And a sheep that had been rescued from the wolves fled and passed into the wild asses of the wilderness[a], and I saw the sheep as they lamented and cried out and petitioned their Lord with all their strength, until that Lord of the sheep came down at the voice of the sheep from his lofty dwelling[d][c][b], and he came to them and saw them.
translation:
  language: zh_hans
  text: 有一只羊从狼群中获救后，便逃走，进入旷野的野驴中间[a]。我看见众羊哀号、呼喊，竭尽全力向它们的主恳求，直到那位羊群之主因众羊的呼声，从他高处的居所下来[b]；他来到它们那里，看见了它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进入旷野的野驴中间”在原文中的句法较难确定；这话很可能是说那只羊进入异象中另一群动物所在之处或它们中间，而不只是来到某种旷野地带。
    reason: textual_variant
  - marker: b
    text: “居所”也可译作“厅堂”或“宫室”。原词指厅堂、内室或宫殿一类的处所；这里带有“他的”之意，并由“高处的”修饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ፡ ዘድኅነ፡ እምነ፡ አዝእብት
  choice: 有一只羊从群狼口中获救后
  rationale: 原文以单数名词和单数动词指这一只羊，随后才转为复数的“众羊”；因此保留单复数对比。“获救”也准确表达已经脱离群狼之害。
- source_word: ነፈፀ
  choice: 逃走
  rationale: 表达迅速离开危险的动作，简明自然，又不额外限定逃跑方式。
- source_word: ኀለፈ፡ ውስተ፡ አእዱገ፡ ገዳም
  choice: 进入旷野的野驴中间
  rationale: 保留原文的移动方向和异象中的动物群体意象；“中间”使现代汉语通顺，但不把这一难句简化为纯粹的地理描写。
- source_word: የአወይዉ፡ ወይጸርኁ
  choice: 哀号、呼喊
  rationale: 两个动词都涉及发声，前者侧重悲痛，后者侧重急切高声呼求；并列译出以保留原文的强化效果。
- source_word: ወይስእልዎ፡ ለእግዚኦሙ፡ በኵሉ፡ ኃይሎሙ
  choice: 竭尽全力向它们的主恳求
  rationale: “恳求”体现困境中的迫切请求，“竭尽全力”自然传达全力而为的强调。
- source_word: እግዚአ፡ አባግዕ
  choice: 羊群之主
  rationale: 保留《动物启示录》中反复出现的神圣称号及羊群意象；“主”在神圣语境中既庄重又不引入额外教派解释。
- source_word: ወረደ፡ ዝኩ፡ እግዚአ፡ አባግዕ፡ ኀበ፡ ቃሎሙ፡ ለአባግዕ
  choice: 那位羊群之主因众羊的呼声……下来
  rationale: 将压缩的句法理解为羊群之主回应众羊的呼声，同时保留“下来”的垂直空间意象。
- source_word: እምጽርኁ፡ ልዑል
  choice: 从他高处的居所
  rationale: ጽርሕ 指厅堂、宫室或居所，带第三人称阳性单数后缀；ልዑል 表示高或崇高。“高处的居所”兼顾词义范围、天上降临的场景与自然汉语。
- source_word: ወበጽኀ፡ ኀቤሆሙ፡ ወርእዮሙ
  choice: 他来到它们那里，看见了它们
  rationale: 按原文顺序保留“来到”与“看见”两个连续动作，不把后者解释为更具体的鉴察或拯救行动。
theological_decisions:
- issue: 异象中神圣称号的译法
  choice: 羊群之主
  alternative: 羊群的主人
  rationale: “羊群之主”保留原文称号的庄重性与神圣主权含义，同时维持动物异象的象征张力，不明说各动物所代表的历史人物或群体。
- issue: 羊群之主下来的原因与来源
  choice: 因众羊的呼声，从他高处的居所下来
  alternative: 在众羊的呼声中，从他崇高的宫室下来
  rationale: 原文句法较紧凑；正文表达对呼声的回应，并把“高处的居所”视为下降的起点，但不进一步解释这一居所的本体或性质。
translation_notes:
  register: 采用现代、庄重而清楚的叙事体。以“一只羊”对“众羊”保留原文鲜明的单复数转换；动物称谓保持异象性质，不在正文中加入历史人物辨识。代词依照动物表层叙事译作“它们”，神圣主体译作“他”。
