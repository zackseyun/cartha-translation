base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/017.yaml
  text: And he called that sheep which had escaped from the wolves[a], and spoke with him about the wolves, so that he might hear concerning them[d][c][b], that they might not oppress the sheep.
translation:
  language: zh_hans
  text: 他召来那只从狼群中逃脱的羊[a]，与它谈论那些狼，使它听见关于那些狼的事[b]，免得那些狼残害群羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从狼群中逃脱”所据原文曾被理解为“在群羊中犯了罪”；此处按“逃脱”以及“狼”的词形翻译。
    reason: textual_or_lexical_clarification
  - marker: b
    text: 原文直译近于“使它听见关于它们／针对它们的话”，句法不甚明确；也可能指使它听取针对那些狼的控告。
    reason: alternative_reading
lexical_decisions:
- source_word: ጸውዖ
  choice: 召来
  rationale: 该动词的基本义是“呼叫、召唤”；“召来”符合叙事语境，也不额外限定权威色彩。
- source_word: በግዕ
  choice: 羊
  rationale: 原词指单数的羊；在《动物启示录》的象征体系中译作“羊”较稳妥，不将其过度具体化为“公羊”。
- source_word: ዘተኃጥአ እምአዝእብት
  choice: 从狼群中逃脱的
  rationale: 结合修订所指出的词形与后接“狼”一词，此处应理解为从狼那里逃脱或脱身，而不是“在羊中犯了罪”。
- source_word: ተናገሮ በእንተ አዝእብት
  choice: 与它谈论那些狼
  rationale: 保留“对它/与它说话”和“关于狼”的句法关系，中文表达自然。
- source_word: ከመ ይስምዕ ዲቤሆሙ
  choice: 好使它听见有关它们的事
  rationale: 原结构在句法上较难，“在它们之上/针对它们听见”可能表示听见有关狼的事或听取对它们的指控；正文采用较中性的关系表达，并以脚注保留歧义。
- source_word: ኢይግስስዎሙ
  choice: 免得它们残害
  rationale: 在狼与羊的动物意象中，该动词表示侵害、蹂躏或毁伤；“残害”保留暴力意味而不过分细化动作。
- source_word: አባግዕ
  choice: 群羊
  rationale: 复数名词指众羊；“群羊”既体现复数整体，又保持本段反复出现的动物象征。
theological_decisions:
- issue: 被召之羊是“逃脱”还是“犯罪”
  choice: 从狼群中逃脱的羊
  alternative: 在群羊中犯了罪的羊
  rationale: 词形与紧接的 አዝእብት（狼）支持“逃脱于狼”的理解；不应因常见的“犯罪”词根而引入此处未必存在的道德定性。
- issue: “听见在它们之上”的关系
  choice: 听见有关它们的事
  alternative: 听取对它们的指控／听见攻击它们的话
  rationale: 介词结构可能带有针对、关于或在其上的意味。正文采用不过度释义的中性表达，脚注说明可能的控诉色彩，以保留文本张力。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言；以“它”指代动物角色，保留异象中的动物意象。正文避免把含混的听闻关系直接解释为“警告”或“作证”，并通过脚注交代主要歧义。
