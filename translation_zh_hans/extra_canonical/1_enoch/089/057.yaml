base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/057.yaml
  text: And I began to cry out with all my strength[a], and I called to the Lord of the sheep and showed him concerning the sheep[b], that they were being devoured by all the wild beasts.
translation:
  language: zh_hans
  text: 我便开始竭尽全力呼喊，又向群羊之主呼求，并将群羊的事呈明给他，因为它们正被所有的野兽[a]吞吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“田野中的群兽”或“旷野中的群兽”。原文可指野外或荒野中的兽类；这里描绘的是猛兽袭击羊群。
    reason: 保留አራዊተ ገዳም中地点词的词义范围，同时说明正文采用“野兽”以自然呈现捕食意象。
lexical_decisions:
- source_word: አኃዝኩ እጽራሕ
  choice: 我便开始……呼喊
  rationale: 前一动词与后接动词构成起始表达，重点是动作开始；“呼喊”兼顾声音之大与悲痛求告之意。
- source_word: በኵሉ ኃይልየ
  choice: 竭尽全力
  rationale: 自然传达“以我的全部力量”的强烈程度和完整性。
- source_word: አጸውዖ
  choice: 呼求
  rationale: 表示有明确对象的呼唤，也与前面的泛指“呼喊”保持动词层次上的区别。
- source_word: ለእግዚአ አባግዕ
  choice: 向群羊之主
  rationale: “主”保留该称号的权柄与庄重语体；“群羊”使复数集合意象在现代汉语中自然清楚。
- source_word: አርእዮ በእንተ አባግዕት
  choice: 把群羊的事指给他看
  rationale: 保留使役性的“使看见、指示”意象，同时表达向他呈明群羊处境的语境意义。
- source_word: ተበልዑ
  choice: 正被……吞吃
  rationale: 进行式“正被”反映受害过程，“吞吃”保留猛兽捕食的暴烈画面。
- source_word: እምኵሎሙ አራዊተ ገዳም
  choice: 被所有的野兽
  rationale: “野兽”清楚表达非驯养的掠食动物；脚注保留ገዳም可指田野、旷野或荒野的空间色彩。
theological_decisions:
- issue: 羊群寓言中的神圣称号
  choice: 群羊之主
  alternative: 群羊的主人
  rationale: 此称号在动物启示异象中指向拥有并统管羊群者；“主”比“主人”更庄重，也不把意象缩减为普通的人间所有权关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“竭尽全力呼喊”传达情绪强度；“群羊之主”维持全段的寓言称号，不在正文中直接解释其神学所指。
