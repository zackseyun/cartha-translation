revisions:
- from: 牧人和他们的同伴把那些羊交给旷野的一切野兽，让它们吞吃。它们全都各按其时、照着数目被交出去——其中六十个[a]；至于其余的，书上记下了[b]它们当中有多少被毁灭。
  to: 牧人和他们的同伴把那些羊交给旷野的一切野兽，让它们吞吃。它们全都各按其时、照着数目被交出去——其中六十只[a]；至于其余的，书上记载了[b]它们中有多少被毁灭。
