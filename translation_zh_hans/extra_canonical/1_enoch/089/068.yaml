base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/068.yaml
  text: And the shepherds and their companions handed over those sheep to all the wild beasts of the desert[a], so that they might devour them; and all of them, each in its time, was delivered over by number—sixty from among them—while the record of the others was written down in the book[d][c][b], how many were destroyed from among them.
translation:
  language: zh_hans
  text: 牧人和他们的同伴把那些羊交给旷野的一切野兽，让它们吞吃。它们全都各按其时、照着数目被交出去——其中六十只[a]；至于其余的，书上记载了[b]它们中有多少被毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一数字及其周围的计数语句在现存见证中较难确定。当前文本似可读作“六十”，但数字可能已经讹误。此处清楚的重点是：它们是按数被交出去的。
    reason: textual_variant
  - marker: b
    text: 直译为“写在书上”。这延续了异象中按数点算并留下记录的主题。
    reason: lexical_and_literary_clarification
lexical_decisions:
- source_word: ኖላዊያን
  choice: 牧人
  rationale: 保留《动物异象》中贯穿始终的牧羊象征，不在正文中把他们直接解释为天使、君王或其他监督者。
- source_word: ጸማዶሙ
  choice: 他们的同伴
  rationale: 表达与牧人联合、同行的一群行动者，同时不超出原文界定其具体身份。
- source_word: መጠውዎሙ / ይትሜጠው
  choice: 交给／被交出去
  rationale: 两处动词都保留转交到别者权下的意味，并以主动、被动形式对应原文语势。
- source_word: እእኩ አባግዕ
  choice: 那些羊
  rationale: 直接保留异象中以羊象征一群人的动物意象。
- source_word: አራዊተ ገዳም
  choice: 旷野的一切野兽
  rationale: “旷野”兼顾荒僻之地与野兽栖息地的意象；“野兽”保留捕食性的威胁。
- source_word: ከመ ይብልዕዎሙ
  choice: 让它们吞吃
  rationale: 以目的或结果表达原文从句，并用“吞吃”呈现捕食与毁灭的力度。
- source_word: በጊዜሁ
  choice: 各按其时
  rationale: 保留逐一分配或依次发生的时间意味，但不额外加入“命定”等解释。
- source_word: በኍልቍ
  choice: 照着数目
  rationale: 表达按数计算、点算的含义，与全节的记账和审判意象相符。
- source_word: ፷፻ እምኔሆሙ
  choice: 其中六十个
  rationale: 依当前见证及校审层所采用的“六十”译出，同时用脚注明确数字文本可能损坏或辨读不稳。
- source_word: ለካልኡ በመጽሐፍ ይጸሐፍ
  choice: 至于其余的，书上记下了
  rationale: 保留“其余者”与“写在书上”两个要素，并使汉语句法自然。
- source_word: ሚመጠነ ያሐጕል እምኔሆሙ
  choice: 它们当中有多少被毁灭
  rationale: 保留损失人数受到统计的意思；“毁灭”比“失去”更切合上下文的暴力场景。
theological_decisions:
- issue: “牧人”的身份
  choice: 正文只称“牧人”，维持异象本身的象征形象。
  alternative: 直接译解为天使监督者，或受命施行审判的外邦统治者。
  rationale: 原文在此没有明说象征所指；直接解释会把有意保留的启示文学张力缩减为单一历史或神学判断。
- issue: 交付、计数与书面记录之间的关系
  choice: 保留羊被交付、按数点算并记入书中的并列叙述。
  alternative: 明确解释为上帝批准并监察的司法审判。
  rationale: 这些意象可以含有审判与问责意味，但本节没有直接说明行动主体背后的神学机制，译文不替原文作定论。
- issue: 代词所指
  choice: 后半节使用“它们”，不明说究竟回指羊还是其他复数对象。
  alternative: 明确改为“那些羊”。
  rationale: 当前吉兹语见证的句法与残损读文使所指不够稳定；保留代词可避免把真实的不确定性悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“牧人、羊、旷野、野兽、吞吃”维持启示文学的具体动物意象；“各按其时、照着数目”略具经文节奏，但避免古奥措辞。由于底本文本可信度为中等且计数段疑有讹损，正文从简，关键不确定性置于脚注。
