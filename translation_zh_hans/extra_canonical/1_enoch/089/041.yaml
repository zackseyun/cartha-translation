base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/041.yaml
  text: And sometimes their eyes were opened[a], and sometimes they were blinded, until another sheep arose and led them and brought them all in[c][b], and their eyes were opened.
translation:
  language: zh_hans
  text: 有时，它们的眼睛被打开[a]；有时，它们却失明了。直到另一只羊兴起，带领它们，把它们全都带进来[b]，它们的眼睛便被打开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眼睛被打开”在这个异象中可能象征觉醒、认识或辨别力的恢复，但原文没有进一步说明。
    reason: cultural_note
  - marker: b
    text: “带进来”所译的动词也可按语境理解为“聚集起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ቦ፡ ሰበ ... ወቦ፡ ሶበ
  choice: 有时……有时……
  rationale: 将异写形式ሰበ与ሶበ按时间副词理解；重复结构表达交替发生的情形，而不是“两群人”。
- source_word: ይትከሠታ፡ አዕይንቲሆሙ
  choice: 它们的眼睛被打开
  rationale: 保留“眼睛打开”的异象意象及未完成式所描写的状态，不将其解释为悔改、觉悟或纯粹恢复视力。
- source_word: ይጼልሙ
  choice: 失明了
  rationale: 此处与眼睛被打开形成鲜明对照；译作“失明”自然清楚，同时保留被动或状态变化的意味。
- source_word: ተንሥአ፡ ካልእ፡ በግዕ
  choice: 另一只羊兴起
  rationale: 按字面保留动物异象；“兴起”比“站起来”更符合异象中领袖相继出现的语境，又不明确指定其性别。
- source_word: መርሖሙ
  choice: 带领它们
  rationale: 采用直接的领导用语，不额外加入“牧养”等原文未明说的含义。
- source_word: አግብኦሙ፡ ለኵሎሙ
  choice: 把它们全都领回来
  rationale: 按ገብአ词根的回返义理解其使役形式，表达使它们返回；“领回来”也与前面的“带领”衔接自然。
- source_word: ተከሥታ፡ አዕይንቲሆሙ
  choice: 它们的眼睛便被打开了
  rationale: 重复开眼意象，并以“便”标示叙事结果，不把象征意义具体化。
theological_decisions:
- issue: 异象中“眼睛被打开”的含义
  choice: 保留字面的异象表述，不指定其象征悔改、认识、属灵启明或政治复兴。
  alternative: 意译为“它们明白了”或“它们恢复了属灵的眼光”。
  rationale: 本段以动物和视觉意象承载象征意义，而原文没有在此解释该意象；直译可保存其神学张力和多义性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留动物异象的字面形象，以“它们”指代羊群；句式用“有时……有时……”准确呈现交替结构。
