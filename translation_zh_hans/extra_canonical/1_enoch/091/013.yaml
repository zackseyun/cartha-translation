base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/013.yaml
  text: And at its completion[a], houses shall be chosen because of their righteousness[c][b], and the house of the great King shall be built in glory forever.
translation:
  language: zh_hans
  text: 在它完成时[a]，房屋将因他们的公义而被拣选[b]；伟大君王的居所[c]将在荣耀中被建造，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上下文中的阶段或时期；也可译作“在它终结时”。
    reason: 保留原文代词所指须由上下文确定，以及“完成／终结”的词义范围。
  - marker: b
    text: 也可按另一种句法关系理解为：“为他们在公义中拣选房屋。”
    reason: 保留“公义”和代词同前句的句法关联歧义，不改变所给文本中“拣选”的读法。
  - marker: c
    text: 原义为“房屋、家”；可带有王宫或圣所的联想。“伟大君王”在这里的末世语境中很可能指上帝。
    reason: 说明建筑词的语义范围及称号的可能所指，而不把解释写入正文。
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: 在它结束时
  rationale: 以时间短语表达该阶段走到终点；“它”保留原文所指对象依赖上下文的特点，不添明为某一周或时代。
- source_word: ይመረዩ
  choice: 将……蒙拣选
  rationale: 按所提供的吉兹文保留被动的“选择、拣选”义，不采纳基于推测性校勘的“获得”。
- source_word: አብያተ
  choice: 各家
  rationale: 保留复数“房屋/家”的具体意象，同时让中文可以兼指住宅、家户或家族，不抽象改写为“义人”。
- source_word: እምጽድቅ ዚአሆሙ
  choice: 因他们的公义
  rationale: 结合介词和所有代词，表达这些家蒙拣选的依据是“他们的公义”；但短语的句法关联仍存在异读，故以脚注说明。
- source_word: ወይትሐነጽ
  choice: 将在……建成
  rationale: 保留建造意象和被动语态；“建成”也与开头的“结束/完成”形成自然呼应。
- source_word: ቤት ንጉሥ ዐቢይ
  choice: 伟大君王的殿宇
  rationale: “殿宇”保留“房屋”的建筑意象，并在中文中兼具王宫和圣殿的可能回响；不在正文直接释为上帝。
- source_word: በስብሐት
  choice: 在荣耀中
  rationale: 保持介词结构及“荣耀、光辉”的庄重语域。
- source_word: እስከ ለዓለም
  choice: 存到永远
  rationale: 自然表达持续至永恒的含义，并与“建成”顺畅衔接。
theological_decisions:
- issue: “伟大君王”的身份
  choice: 保留“伟大君王”这一称号，并在脚注说明其在末世语境中很可能指上帝
  alternative: 正文直接译作“上帝的殿宇”，或把它理解为理想时代的一位地上君王
  rationale: 原文只给出王室称号；保留称号可呈现很强但未被明说的神圣指向，避免把推断写进正文。
- issue: “各家蒙拣选”的意象
  choice: 保留具体的“各家”及被拣选的表述
  alternative: 改写为“义人将蒙拣选”或“义人将得到住所”
  rationale: 原文明确出现复数“家/房屋”，下半句又谈君王的殿宇；保留建筑和家户意象可避免释义性扁平化。
- issue: “因他们的公义”的句法关系
  choice: 将其理解为各家蒙拣选的依据
  alternative: “为他们在公义中拣选各家”
  rationale: 所给英语审校层与近期定稿支持因果理解，但吉兹语短语的连接方式容许另一种分析，因此以脚注保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“各家”比单纯“房屋”更能保留住所与家户的双重可能；“殿宇”则使王宫与圣殿的回响并存。所有解释性限定均置于脚注，正文不替原文消除歧义。
