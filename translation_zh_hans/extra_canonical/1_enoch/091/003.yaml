base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/003.yaml
  text: 'And he spoke to them all[a], to all the children of righteousness, and said, “Hear, children of Enoch, every word of your father, and listen to the upright words of my mouth; for I speak to you and tell you[c][b], beloved ones: love righteousness and walk in it.”'
translation:
  language: zh_hans
  text: 他对他们众人，就是所有公义之子，说：“以诺的儿女啊，要听你们父亲所说的一切，也要留心我口中正直的话[a]；因为我要使你们听见，并向你们述说[b]。亲爱的人哪，要爱公义，行在其中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句吉兹文的句法较难；也可译作：“要正确地听我口中的话。”
    reason: lexical_alternative
  - marker: b
    text: 较直译为：“因为我要使你们听见，并向你们述说。”前一动词也可能带有“劝诫”或“作证”的意味。
    reason: source_ambiguity
lexical_decisions:
- source_word: ውሉደ ጽድቅ
  choice: 正义之子
  rationale: 保留原文的构词关系及《以诺书》中带有群体身份意味的称呼；“正义的儿女”亦可，但较易被理解为一般性的品格描述。
- source_word: ደቂቀ ሄኖክ
  choice: 以诺的儿女
  rationale: “儿女”自然涵盖后代或受教群体，也适合直接呼语；人名采用现代中文圣经传统中通行的“以诺”。
- source_word: ኵሎ ነገረ አቡክሙ
  choice: 你们父亲的一切话
  rationale: 既保留“父亲”与“一切”的明确表达，也符合中文劝诫语境。
- source_word: አጽምኡ
  choice: 留心
  rationale: 这是与“听”平行的第二个命令语；译作“留心”可自然表达专注听从，避免机械重复。
- source_word: ርርትዐ ቃለ አፉየ
  choice: 我口中正直的话
  rationale: 主文按“正直”修饰“话”处理，同时以脚注保留“正确地听”的副词性理解，未消除原文句法上的困难。
- source_word: አሰምዕ…ወእነግረክሙ
  choice: 我要对你们宣讲，向你们述说
  rationale: 前一动词为“使听见”的使役形式，并可能带宣告、劝诫或作证的语气；“宣讲”比单纯“说”更能体现其力度，又以脚注保留较直译的表达。
- source_word: ፍቁራን
  choice: 亲爱的人哪
  rationale: 表达呼格中的郑重与亲爱，同时避免“蒙爱者”引入原文未明说的施爱主体。
- source_word: ርትዕ
  choice: 正义
  rationale: 此处指应当热爱并践行的伦理道路；“正义”在现代汉语中清楚自然，并与本节前面的群体称谓保持词汇呼应。
- source_word: ባቲ ሑሩ
  choice: 行在其中
  rationale: 保留原文以“行走”表达生活实践的伦理隐喻，并使代词明确回指“正义”。
theological_decisions:
- issue: ጽድቅ／ርትዕ应译作“正义”“公义”还是“正直”
  choice: 在群体称谓及末句译作“正义”
  alternative: 公义；正直
  rationale: 这里的词指一种伦理品质和生活道路，并非仅指司法公正；“正义”是现代普通读者易懂的表达，也不预先套入后世特定教义体系。困难短语中则按其修饰“话”的可能性译作“正直”。
- issue: “我口中正直的话”中ርርትዐ的句法归属
  choice: 理解为修饰“话”
  alternative: 理解为副词：“要正确地听我口中的话”
  rationale: 原文形式和句法较困难，两种分析均有可能；主文采用较顺畅且符合闪语表达习惯的读法，脚注明确保留另一读法。
- issue: አሰምዕ的使役及劝诫色彩
  choice: 译作“宣讲”
  alternative: 使你们听见；劝诫你们；向你们作证
  rationale: 使役词形直指“使听见”，但在庄重训诲中可能具有宣告、劝诫或见证的语用力量。“宣讲”保留郑重力度而不锁定为某一种神学行为，脚注列出主要可能。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。保留“正义之子”“行在其中”等具有以诺传统和圣经风格的身份及道路意象；对原文真正不确定之处用脚注说明，不在正文中武断消解。
