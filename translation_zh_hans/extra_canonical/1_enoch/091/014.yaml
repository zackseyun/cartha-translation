base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/014.yaml
  text: And after this[a], in the ninth week, the righteous judgment will be revealed to the whole world, and all the deeds of the wicked will depart from all the earth; and the world will be written down for destruction[d][c][b], and all people will look to the path of uprightness.
translation:
  language: zh_hans
  text: 此后，在第九个“七期”[a]，公义的审判要向全世界显明；恶人的一切行为都要从全地除去；世界要被记下，归于毁灭[b]；所有人都要注目于正直之路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“七期”是本章象征性历史架构中的一个时代，并非普通的七日一周或某个安息日；原词也可直译为“第九周”。
    reason: cultural_note
  - marker: b
    text: 这句话在吉兹语中较难理解。正文依据现存阿拉姆语残片所保留的句法翻译；单按吉兹语，也可能理解为“要为时代的毁灭而写下”，或与“永远的毁灭”有关。
    reason: textual_variant
lexical_decisions:
- source_word: በሰንበት ታስዕ
  choice: 在第九个“七期”
  rationale: 本段属于“七期启示”的象征性历史架构，所指并非普通七日的一周或安息日，而是按七为单位划分的时代；采用“七期”并加注，兼顾语境与普通读者的理解。
- source_word: ኵነኔ ጽድቅ
  choice: 公义的审判
  rationale: 保留审判与公义之间的修饰关系及末世审判色彩，中文自然庄重。
- source_word: ትትከሠት
  choice: 要……显明
  rationale: 表达被动或反身的显现意义，不额外指定显明者。
- source_word: ለኵሉ ዓለም
  choice: 向全世界
  rationale: 此处指审判显明所面向的整个世界；“向”准确传达方向关系。
- source_word: ተግባረ ረሲዓን
  choice: 恶人的一切行为
  rationale: 保留具体的行为层面，不将其抽象化为“邪恶”；中文中“恶人”简洁且符合庄重文体。
- source_word: ይወፅእ እምዲበ ኵሉ ምድር
  choice: 都要从全地除去
  rationale: 原动词本义为出去、离开；在恶行不再存留于地上的语境中，“除去”清楚表达结果，但不扩展为对恶人本身的毁灭。
- source_word: ይጽሐፍ ለሐጕለ ዓለም
  choice: 世界要被记下，归于毁灭
  rationale: 依据保存原始句法的阿拉姆语证据，将“世界”视为被动动词的主语，并保留“写下／记下”的启示文学意象；“归于毁灭”表达目的或判定，同时以脚注说明吉兹语本身的困难。
- source_word: ይኔጽሩ ለፍኖተ ርትዕ
  choice: 都要注目于正直之路
  rationale: 动词可指观看、留意或守望；“注目于”保留方向性而不强行解释为顺服。“路”采用单数，符合吉兹语形态及阿拉姆语证据。
theological_decisions:
- issue: “世界要被记下，归于毁灭”这一困难短句的句法与含义
  choice: 以“世界”为被记下的主语，毁灭为其所归定的结局
  alternative: “这事要为时代的毁灭而写下”或“要被记下，遭受永远的毁灭”
  rationale: 吉兹语传本的结构有歧义，但4Q212的阿拉姆语证据明确支持“世界”作主语。正文采用较有原始证据支持的读法，脚注仍交代吉兹语可能产生的其他理解，不把“世界／时代”或“毁灭／永远毁灭”的神学含义过度确定化。
- issue: 众人对正直之路的反应强度
  choice: 注目于
  alternative: 遵行、持守或归向正直之路
  rationale: 原动词可表示观看、留意或守望；译作“注目于”保留原文张力，避免把视觉和方向性措辞直接提升为明确的悔改或顺服。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号保留原句连续展开的启示文学节奏；“七期”用引号提示其专门象征意义。“被记下”刻意保留原文不寻常的书写意象，不擅自释为判决、名册或天上的记录。
