base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/001.yaml
  text: And now[a], my son Methuselah, call all your brothers to me, and gather to me all the children of your mother; for a word calls me, and a spirit of uprightness is poured out upon me[d][c][b], so that I may show you everything that will come upon you forever.
translation:
  language: zh_hans
  text: 如今，我儿玛土撒拉，把你所有的弟兄都叫到我这里来，也把你母亲所有的儿女都召集到我这里；因为有话语在呼唤我，又有灵倾注在我身上[a]，使我可以把将要临到你们的一切都指示给你们，直到永远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可理解为较明确、较具位格性的“那灵”；原文并未明确要求译作“圣灵”。这里的动词意为“浇灌”或“倾注”，不是“正直”。
    reason: lexical_and_theological_ambiguity
  - marker: b
    text: “直到永远”也可理解为“直到永世”“历世历代”，或指向将来的世代；原文末尾时间短语的具体修饰范围并不完全明确。
    reason: syntactic_and_lexical_ambiguity
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 作为话语转折，简洁自然地表达“而今、现在”，不额外强化语气。
- source_word: ወልድየ ማቱሳላ
  choice: 我儿玛土撒拉
  rationale: 保留父亲对儿子的直接称呼，并采用现代中文中通行的圣经人名译法。
- source_word: ጸውዕ ሊተ ኵሎ አኃዊከ
  choice: 把你所有的弟兄都叫到我这里来
  rationale: 既保留具体的兄弟亲属关系，也自然表达召到以诺面前的动作。
- source_word: አስተጋብእ ሊተ ኵሎ ደቂቀ እምከ
  choice: 把你母亲所有的儿女都召集到我这里
  rationale: ደቂቅ在此指儿女或后代，不宜限缩为男性“儿子”；“召集”也保留了比单纯呼叫更强的聚集含义。
- source_word: እስመ ቃል ይጼውዐኒ
  choice: 因为有话语在召唤我
  rationale: 原文没有明说话语的来源；译作“有话语”保留启示性及其未明确之处。
- source_word: ወመንፈስ ትክዕወት ላዕሌየ
  choice: 又有灵浇灌在我身上
  rationale: 将ትክዕወት按动词“被倾倒、被浇灌”理解，而不误作“正直”；中文保留“灵”究竟是一般性的灵还是神圣之灵的开放性。
- source_word: ከመ አርእክሙ
  choice: 使我可以……指示给你们
  rationale: 表达目的从句，并以庄重而可懂的“指示”传达显明、使看见之意。
- source_word: ኵሎ ዘይበጽሐክሙ
  choice: 要临到你们的一切
  rationale: 保留事情来到、临及受众的预言语感，避免平化为“发生的事”。
- source_word: እስከ ለዓለም
  choice: 直到永远
  rationale: 直译其延续至永远或久远世代的时间表达，同时以脚注说明可能的理解范围。
theological_decisions:
- issue: መንፈስ是否应明确译为位格化、神圣的“圣灵”
  choice: 有灵浇灌在我身上
  alternative: 那灵浇灌在我身上／圣灵浇灌在我身上
  rationale: 原文在此并未提供足够依据把该词明确限定为专名“圣灵”；正文不加教义性限定，并在脚注保留较位格化的理解。
- issue: ትክዕወት是描述“正直”还是表达“浇灌”
  choice: 浇灌
  alternative: 正直之灵在我身上
  rationale: 该词在句中应按阴性单数动词形式理解，表示灵被倾倒或浇灌；“正直”并非这里的词义。
- issue: 末尾时间短语的范围
  choice: 把“直到永远”连接于将临到他们的事
  alternative: 为后世显明这一切／将永远临到你们的一切
  rationale: 原文语序允许时间短语带有较宽的末世性范围；正文采用最直接的邻近修饰，同时以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“我儿”保留族长式称呼；“弟兄”“儿女”“话语”“浇灌”“临到”维持经文的预言性语感，但避免生硬古语。所有脚注标记均置于正文相应位置。
