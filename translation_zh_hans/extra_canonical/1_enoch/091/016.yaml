base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/016.yaml
  text: And the first heaven shall depart and pass away[a], and a new heaven shall appear[b], and all the powers of the heavens shall shine sevenfold forever.
translation:
  language: zh_hans
  text: 先前的天必离去、消逝，新的天必显现；诸天的一切力量[a]必发出七倍的光辉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“诸天的天军”。这里的吉兹语可指力量、权能或天军，所涵盖的可能既有天体，也有天上的众生。
    reason: lexical_alternative
  - marker: b
    text: 结尾短语的释读仍有困难，通常理解为“七倍”或“七倍地更加明亮”。现存埃塞俄比亚语文本在此处不够清楚。
    reason: textual_variant
lexical_decisions:
- source_word: ሰማይ፡ ቀዳማይ፡
  choice: 先前的天
  rationale: ቀዳማይ可表示次序上的“首先”或时间上的“先前”。译作“先前的天”既与后文“新的天”形成对照，也避免“第一重天”所暗示的分层宇宙观。
- source_word: ይወፅእ፡ ወየኃልፍ፡
  choice: 必离去、消逝
  rationale: 两个动词分别带有出去、离开以及经过、逝去之意。并列翻译保留原文的动作递进，同时不武断地解释为彻底毁灭。
- source_word: ሰማይ፡ ሐዲስ፡ ይትረአይ፡
  choice: 新的天必显现
  rationale: ሐዲስ意为“新的”，ይትረአይ可指“被看见、显现”。“显现”自然地保留异象和启示语气，又不把“新”解释成特定意义上的更新或替换。
- source_word: ኵሉ፡ ኃይለ፡ ሰማያት፡
  choice: 诸天的一切力量
  rationale: ኃይለ可指力量、权能或军旅。此处可能涵盖天体、天上势力或天军；“力量”保留其范围，不将所指限定为天使或星辰。
- source_word: ያበርህ፡
  choice: 发出……光辉
  rationale: 该动词表示照耀或发光。“发出光辉”符合现代汉语，也保留鲜明的宇宙性图景。
- source_word: ሰብዓተ፡ ምእዕቢተ።
  choice: 永远发出七倍的光辉
  rationale: ሰብዓተ明确含有“七”之意，整个短语则传抄和释读困难。正文采用“七倍”表达光辉增强，并依见证所提供的理解保留“永远”，同时以脚注说明不确定性。
theological_decisions:
- issue: 本节所描绘的是旧宇宙被替换，还是现有宇宙得到更新
  choice: 正文只陈述先前的天离去、新的天显现
  alternative: 明确译成旧宇宙彻底毁灭，或现有宇宙经过更新转化
  rationale: 吉兹语呈现的是异象中的先后与对照，并未给出系统性的宇宙论说明；译文因此不替原文消解这层神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”保留预言语气；分号呈现旧天离去、新天显现与诸天发光之间的结构转折。脚注标记均放在其实际说明的词组之后。
