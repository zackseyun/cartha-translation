base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/006.yaml
  text: And lawlessness will again increase[a], and it will be brought to completion upon the earth[c][b]; and every work of lawlessness and violence and sin will again take hold.
translation:
  language: zh_hans
  text: 不法之事必再次出现[a]，并必在地上达到极点[b]；一切不法、暴虐和罪恶的行为，都必再度得势[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“不法之事必再被重复”或“不法之事必再度发生”。原文以动词和“再次”一词共同强调其重现。
    reason: lexical_alternative
  - marker: b
    text: 或译“并必在地上完成”或“应验”。这里是在阴暗的意义上说，不法之事达到其完全的程度。
    reason: lexical_alternative
  - marker: c
    text: 原文动词有“抓住、占据、控制”之意，描绘各种恶行重新取得支配力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: ትደገም ካዕበ
  choice: 必再次出现
  rationale: 动词含“重复、再现”之意，ካዕበ 又明确表示“再次”。译作“再次出现”既保留复发之意，也避免把原文不确定的变化方向具体化为“增加”。
- source_word: ዓመፃ
  choice: 不法
  rationale: 本节随后另列ግፍዕ（暴虐）和አበሳ（罪恶），故用“不法”保留三个恶行术语之间的区别。
- source_word: ትትፈጸም
  choice: 必……发展到极点
  rationale: 原词为“完成、达到完全”的被动形式；在恶事作主语的语境中，“发展到极点”自然表达其达到满盈程度的阴暗含义，同时以脚注保留“完成／应验”的形式歧义。
- source_word: ዲበ ምድር
  choice: 在地上
  rationale: 按末世性语境取广义的“地上”，而不局限为某一片土地。
- source_word: ኵሉ ግብረ
  choice: 一切……的行为
  rationale: 保留ኵሉ的总括意义，并以现代汉语自然表达“每一种行为／一切行为”。
- source_word: ግፍዕ
  choice: 暴虐
  rationale: 该词兼有暴力、压迫和不公之义；“暴虐”既体现强暴，也保留其社会压迫色彩。
- source_word: አበሳ
  choice: 罪恶
  rationale: 该词可指罪、过犯或罪责；“罪恶”在此最适合作为对行为类别的概括。
- source_word: ትትአኀዝ
  choice: 必再度得势
  rationale: 原义涉及“抓住、占据、控制”。以恶行作主语时，“得势”是自然的汉语表达，并由脚注说明原有的攫取意象。
theological_decisions:
- issue: 开篇是否译为不法“增加”
  choice: 译作“不法之事必再次出现”
  alternative: “不法之事必再次增加”或“不法之事必再度发生”
  rationale: 原文明确表达重复、再现，却未明确表达数量或程度增长；因此不把“增加”写入正文，以免过度释义。
- issue: 如何处理“不法、暴虐、罪恶”三个并列词
  choice: 保留为三个彼此有别的恶行类别
  alternative: 合并译作“种种邪恶”
  rationale: 原文以三个并列名词形成累积性的谴责；分别翻译能保留修辞力度和语义张力。
- issue: 恶事“完成”的含义
  choice: 正文译为“发展到极点”，脚注保留“完成／应验”
  alternative: 直译为“在地上完成”
  rationale: 上下文呈现恶事达到满盈程度的负面图景，但原动词本身仍有“完成、应验”的宽泛含义，不将其固定为某一特定神学公式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不法之事”“发展到极点”“再度得势”适合末世性宣告的语体，同时避免生硬照搬被动结构。正文保留三个恶行术语的并列累积，不加入宗派性解释。
