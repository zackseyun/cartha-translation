base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/004.yaml
  text: And do not draw near to righteousness with a double heart[a], nor join yourselves with those who are of a double heart; but walk in righteousness, my children, and it will lead you on a good path[d][c][b], and righteousness will be your companion.
translation:
  language: zh_hans
  text: 不要怀着二心寻求正直，也不要与二心的人结交[a]；我的孩子们，你们要行在公义中，公义必引导你们走上美善的道路[b]，也必与你们相伴[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “也不要与二心的人结交”这一分句在所供吉兹文文本中置于方括号内，可能代表异文或后来的扩充；这里保留在正文中。
    reason: textual_variant
  - marker: b
    text: 直译“在一条好的道路上”；这里的“道路”为单数。
    reason: lexical_alternative
  - marker: c
    text: 或译“公义必与你们联合”或“必作你们的同伴”；原词含有共同参与、伙伴关系或相伴之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትቅረቡ
  choice: 不要……亲近
  rationale: 保留原文以空间动作表达道德取向的意象，也自然传达否定命令。
- source_word: ርትዕ
  choice: 正直
  rationale: 此词侧重端正、纯正，与后文反复出现的ጽድቅ“公义”适度区分，避免抹平原文用词变化。
- source_word: በክልኤ ልብ
  choice: 怀着二心／二心的人
  rationale: 保留“两颗心”所形成的具体闪族语式意象；“二心”在现代汉语中可懂，表达忠诚分裂和内里虚伪。
- source_word: ኢትኅበሩ ምስለ እለ በክልኤ ልብ
  choice: 也不要与二心的人结交
  rationale: 自然表达原文联合、交往的社会性含义；该分句在所供文本中带方括号，正文保留并以脚注说明。
- source_word: ሑሩ በጽድቅ
  choice: 要行在公义中
  rationale: “行”延续伦理道路的隐喻，“在公义中”保留名词结构。
- source_word: ደቂቅየ
  choice: 我的孩子们
  rationale: 符合长者训诲的亲属称呼，现代汉语自然，也不无根据地限定为男性。
- source_word: ትመርሐክሙ
  choice: 公义必引导你们
  rationale: 原文阴性动词的主语最可能回指相应的抽象名词；汉语明示“公义”可避免代词所指含混，同时保持人格化引导的形象。
- source_word: በፍኖት ኄርት
  choice: 走上美善的道路
  rationale: 按单数理解为“一条好路”；“美善”兼顾道德意义，且不把随后独立的ጽድቅ误并入此短语。
- source_word: ወጽድቅ ይከውን ለክሙ ሱታፌ
  choice: 也必与你们相伴
  rationale: 承接前句明示的“公义”为主语，以“相伴”自然表达联合、伙伴关系的语义。
theological_decisions:
- issue: 如何表达内在忠诚分裂的习语
  choice: 二心
  alternative: 三心二意／心怀两意
  rationale: “二心”保留原文“心”的宗教伦理和人格意象，不把它化约为现代心理术语，也不过度解释其具体表现。
- issue: 是否纳入方括号中的分句
  choice: 纳入正文并加脚注
  alternative: 视为后加文字而省略
  rationale: 所供吉兹文见证包含此句，且它与前句构成自然的平行劝诫；因其文本地位存在疑问，透明标注比静默删除更稳妥。
- issue: 后半句中引导者的所指
  choice: 以“公义”作引导和陪伴的主体
  alternative: 以未明说的“道路”或一般性的“它”作主体
  rationale: 原文语法容许抽象名词作为阴性主体，后句又明确说公义成为同伴；译文采用连贯读法，但不附加教派性人格化解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“二心”“行在公义中”等表达保留原文伦理意象；以“正直”译ርትዕ、以“公义”译ጽድቅ，呈现词汇差异。所有脚注标记均置于相关正文之后。
