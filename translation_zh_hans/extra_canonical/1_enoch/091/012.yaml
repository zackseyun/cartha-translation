base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/012.yaml
  text: And after this there shall be another week[a], the eighth, of righteousness; and a sword shall be given to it, so that righteous judgment may be carried out against the oppressors[b], and sinners shall be delivered into the hands of the righteous.
translation:
  language: zh_hans
  text: 此后，还会有另一个周[a]，就是第八周，一个公义的周；一把剑将赐给它，为要对欺压人的人施行公义的审判；罪人将被交在义人手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“另一个周，就是第八周”。这里的“周”指历史的象征性时期，不是普通日历中的一星期。
    reason: lexical_alternative
  - marker: b
    text: “交在……手中”是惯用语，表示被交由对方掌控或处置。
    reason: cultural_note
lexical_decisions:
- source_word: ካልእት
  choice: 另一个
  rationale: 表示象征性历史时期的接续；译作“另一个”既自然，也不使人误以为这是字面意义上的第二周。
- source_word: ሳምንት ሰንበት
  choice: 第八个七年期
  rationale: 原文兼有“周”和“第八”的含义。在《周之启示》的语境中，它指编号的象征性时期；“七年期”保留七重结构，又避免现代读者将其理解成普通的一星期。
- source_word: እንተ ጽድቅ
  choice: 公义的时期
  rationale: 该属格结构说明这一时期的性质；重复“时期”使现代汉语清楚自然，同时保留“公义”这一主题词。
- source_word: ይትወሀብ ላቲ ሰይፍ
  choice: 刀剑要赐给它
  rationale: 阴性代词回指前述时期。保留原文“刀剑”的审判意象，不将其解释性改写为权柄或胜利。
- source_word: ከመ ይትገበር ኵነኔ ጽድቅ
  choice: 好……施行公义的审判
  rationale: “好”表达目的关系；“施行”体现审判被执行，“公义的审判”兼顾司法与道德含义。
- source_word: እምእለ ይገፍዑ
  choice: 向欺压人的
  rationale: 该动词含暴力侵害、欺压之意；此译法明确指出审判所针对的一类人。
- source_word: ይትሜጠዉ ኃጥኣን በእደዊሆሙ ለጻድቃን
  choice: 罪人也要被交在义人的手中
  rationale: 保留原文具体的“在手中”惯用意象，表达罪人被交由义人掌控，而不额外规定其具体处置方式。
theological_decisions:
- issue: ጽድቅ与ኵነኔ ጽድቅ应保留“公义”用语，还是简化为一般的“正义”或“公平”
  choice: 分别译作“公义的时期”和“公义的审判”
  alternative: “正义的时期”和“公平的审判”
  rationale: 原文以同一核心词贯穿时期的性质及其中施行的审判。保留“公义”能维持这种主题呼应，也不把末世性的道德秩序缩减为社会或司法层面的公平。
- issue: 刀剑意象的性质
  choice: 保留“刀剑要赐给它”这一末世审判意象
  alternative: 译作“审判的权柄要赐给它”或“胜利要赐给它”
  rationale: 原文明说“刀剑”。译文不预先断定它是字面武器还是象征，也不以解释取代原有意象。
- issue: 义人在审判中的角色
  choice: 保留“罪人被交在义人的手中”
  alternative: 明确译为“义人要刑罚罪人”
  rationale: 原文表达交付和权力转移，却没有详述义人随后怎样处置罪人；保留这一张力可避免加入经文未明说的教义判断。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。正文用“七年期”帮助普通读者理解象征性的七重时期，并以脚注保留原文“周”的直译；保留“刀剑”“手中”等具体的启示文学意象。
