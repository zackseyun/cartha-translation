base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/011.yaml
  text: And from it shall be cut off the roots of oppression[a], and sinners shall be delivered up to the sword. From the blasphemers they shall be cut off in every place[d][c][b], and those who devise violence and those who commit blasphemy shall be destroyed by the sword.
translation:
  language: zh_hans
  text: 不义的根必从其中被剪除[a]；罪人必被交给刀剑。亵渎者必从各处被剪除[b]；谋划暴行的和出言亵渎的，都必遭杀戮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的埃塞俄比亚文传本在词形和切分上有困难。这里依上下文和传统读法译作“不义的根”；也有读法理解为“十个不义（或压迫）的时期／周”。
    reason: textual_variant
  - marker: b
    text: 本句的埃塞俄比亚文句法衔接不甚清楚；也可理解为：“亵渎者，以及谋划暴行和出言亵渎的人，必在各处被剪除，并被交付杀戮。”
    reason: textual_variant
lexical_decisions:
- source_word: ይትገዘሙ
  choice: 被剪除
  rationale: 保留被动语态和末世审判中“剪除、除灭”的强烈意象，又不把具体方式说得过死。
- source_word: አሥራወ ዓመፃ
  choice: 不义的根
  rationale: 依本节传统语境及句法将አሥራወ理解为“根”的复数关联形式；ዓመፃ涵盖不义、强暴和压迫，此处用“不义”较能保留其宽广的道德含义。抄本文字亦可能引起另一种切分，故加注说明。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 这是以诺传统审判语境中的常用道德—宗教称谓，“罪人”准确且庄重。
- source_word: ይትሐጐሉ
  choice: 必被交在……之下／必死于
  rationale: 该动词可表达被交付、归于毁灭或灭亡；前一处保留司法性的“被交”，后一处结合በመጥባሕት的杀戮工具含义译为“死于”，使现代汉语自然，同时不削弱审判意味。
- source_word: በሰይፍ
  choice: 在刀剑之下
  rationale: 保留刀剑作为审判工具的意象，并与“被交”构成自然的现代汉语。
- source_word: ጽሩፋን / ጽርፈት
  choice: 亵渎者／出言亵渎
  rationale: 用同一词根“亵渎”再现原文两个相关词的词汇联系；“出言亵渎”也显出后者涉及辱骂、亵慢之言。
- source_word: በኵሉ መካን
  choice: 从各处
  rationale: 原文直义为“在每一处”。结合“剪除”译作“从各处被剪除”，既保留范围的全面性，也符合汉语搭配。
- source_word: ይሔልይዋ ለግፍዕ
  choice: 谋划暴行
  rationale: 动词强调思量、设计，ግፍዕ可指强暴或压迫；“谋划暴行”保留蓄意性和社会暴力色彩。
- source_word: በመጥባሕት
  choice: 死于刀剑
  rationale: 该词指刀具、宰杀或杀戮手段；此处译出“刀剑”意象，避免弱化为抽象的“毁灭”。
theological_decisions:
- issue: ዓመፃ应译作宽泛的“不义”，还是较具体的“压迫／暴行”
  choice: 首处译“不义”，后处相关但不同的ግፍዕ译“暴行”
  alternative: 压迫；强暴
  rationale: 首处所指是遭彻底拔除的罪恶根源，“不义”保留较广的道德范围；后处描述人所谋划的行为，“暴行”更能体现具体暴力。这样不把两个源词强行合并。
- issue: 重复的审判动词是否都直接译成“杀灭”
  choice: 依各自介词短语分别译为“被交在刀剑之下”和“死于刀剑”
  alternative: 两处均译“被杀灭”或“被交付”
  rationale: 原词兼有被交付与灭亡的语义张力。首处保留司法性的被交付，末处则让杀戮工具明确结果，避免人为消除原文张力。
- issue: 亵渎是纯粹宗教术语还是一般辱骂
  choice: 亵渎者／出言亵渎
  alternative: 辱骂者／行辱骂的
  rationale: 相关词可涵盖辱骂、毁谤和亵慢；在末世审判语境中“亵渎”较贴切，但用“出言”提示其言语行为面向，避免过度限定为某一宗派定义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，保留“根、剪除、刀剑”等末世审判意象。以分号呈现并列审判宣告，并用脚注诚实标示埃塞俄比亚文本的切分与句法困难。
