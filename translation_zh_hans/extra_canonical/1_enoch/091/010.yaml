base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/010.yaml
  text: And the righteous one shall arise from their sleep[b][a], and wisdom shall arise and be given to them.
translation:
  language: zh_hans
  text: 那义人必从他的沉睡中起来；智慧也必兴起，并被赐给他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትነሣእ
  choice: 必……起来／必兴起
  rationale: 该动词可表达起身、起来或兴起。用于“义人”时译作“起来”，与“沉睡”自然搭配；用于“智慧”时译作“兴起”，保留启示文学的庄重语气和拟人表达。
- source_word: ጻድቅ
  choice: 那义人
  rationale: 原文为单数；“那义人”明确保留单数和一定的特指意味，同时不判定其究竟是某一特定人物，还是群体的代表。
- source_word: እምነዋሙ
  choice: 从他们的沉睡中
  rationale: 按“从”加“睡眠”及复数领属后缀理解。译文保留原文中单数“义人”与复数“他们”并置的张力，不擅自统一人称和数。
- source_word: ጥበብ
  choice: 智慧
  rationale: 在此启示文学语境中，主要指道德与启示层面的智慧；“智慧”也能保留原文的拟人意味。
- source_word: ይትወሀብ ሎሙ
  choice: 赐给他们
  rationale: 被动动词与复数间接宾语表示智慧被给予他们。“赐给”符合庄重语体，但不明说施予者是谁。
theological_decisions:
- issue: ጻድቅ应理解为个体还是集体
  choice: 按单数译为“那义人”
  alternative: “义人们”或作为集合概念的“义人”
  rationale: 原文形式为单数。保留单数可容纳特定人物、代表性人物或群体代表等可能性，而不强行作弥赛亚式或纯集体式解释。
- issue: 单数“义人”与复数“他们的沉睡／赐给他们”的关系
  choice: 照原文保留数的不一致
  alternative: 将其协调为“从他的沉睡中”或把“义人”改成复数
  rationale: 现有原文证据呈现单数主体与复数代词。直接协调会消除文本本身的语法或指代张力，因此在正文与脚注中如实保留。
- issue: 智慧的兴起与被赐予是否暗示特定施予者
  choice: 采用无施事的被动表达“赐给他们”
  alternative: 补出“上帝要把智慧赐给他们”
  rationale: 原文没有明说施予者；不应因神学语境而补入名称。
translation_notes:
  register: 采用现代、庄重而易懂的启示文学语体。“必”传达预告色彩；“起来／兴起”依搭配稍作区分，同时保留同一原文动词的语义联系。“沉睡”比单纯“睡眠”更符合汉语经文语感，但不把它明确解释为死亡。
