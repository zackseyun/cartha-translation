base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/015.yaml
  text: And after this[a], in the tenth week, in the seventh part, there shall be the eternal judgment [and it shall be executed by the watchers of the eternal heaven][b], a great judgment that will be exacted in the midst of the angels.
translation:
  language: zh_hans
  text: 此后[a]，在第十个七期的第七个部分，将有永恒的审判；〔这审判将由永恒之天的守望者执行〕[b]。这是一场大审判，要在众天使中间施行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “此后”也可译作“这些事以后”。
    reason: translation_alternative
  - marker: b
    text: “这审判将由永恒之天的守望者执行”在所据文本中置于方括号内，表明这句话的文本传承存在不确定性。
    reason: textual_variant
lexical_decisions:
- source_word: ወእምድኅረ ዝ
  choice: 此后
  rationale: 这是引入末世异象下一阶段的时间连接语；简洁自然，也可涵盖“这些事以后”的语感。
- source_word: በሰንበት ዓሥርት ፯እደ
  choice: 在第十个七期的第七部分
  rationale: 原文明确包含“第十”与“第七部分”。在“七期启示”的象征性结构中，以“七期”表达编号的周期，避免让现代读者误解为普通的一周。
- source_word: ኵነኔ እንተ ለዓለም
  choice: 永远的审判
  rationale: ኵነኔ 表示审判、判决；እንተ ለዓለም 表示持久、永远的性质。
- source_word: ወትትገበር እምትጉሃነ ሰማይ ዘለዓለም
  choice: 这审判将由永恒天上的守望者执行
  rationale: 按括号内传本措辞保留被动执行关系；“守望者”是以诺传统中天上存在的常用称谓。因该短句具有文本不确定性，正文用方括号标示。
- source_word: ዐቢይ
  choice: 大
  rationale: 直译其程度与规模含义，不引入“七倍”等来源不足的解释。
- source_word: ዘይትቤቀል
  choice: 要……施行
  rationale: 结合最新校订所指出的被动语义，译作审判被施行，避免额外加入“报仇”的解释。
- source_word: እማእከሎሙ ለመላእክት
  choice: 在众天使中间
  rationale: 直接保留传本文字的空间或群体范围表达，不改写成与受造万物有关的另一传统读法。
theological_decisions:
- issue: 审判与天使的关系
  choice: 译作审判“在众天使中间施行”
  alternative: 译作审判“向众天使追讨报应”
  rationale: 原文可带惩罚或追讨色彩，但其句法和语义并不足以要求明确译成“报仇”。采用较中性的审判措辞，保留审判对象或发生范围的张力。
- issue: 括号内守望者短句的文本地位
  choice: 保留在正文方括号内，并以脚注说明
  alternative: 直接删去，或不加标示地纳入正文
  rationale: 所给原文将该短句置于方括号，显示其传本文本地位不稳；保留并明确标示，比武断采纳或删除更能呈现原始证据。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“七期”承接《七期启示》的象征性周期，避免把此处误读为日历上的普通一周。方括号及脚注忠实呈现传本文本的不确定性。
