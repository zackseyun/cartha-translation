review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留开头 ወእመኒ 引导的时间／条件从句、两组罪恶的递增、从天而降的刑罚，以及圣主在震怒与刑罚中出来施行审判。将“无视律法”改为“不法”，更直接对应 ዕልወት（lawlessness），也避免把抽象罪恶名词译成动作性短语。
  naturalness: “圣洁的主必在震怒和惩罚中出来”虽可理解，但现代汉语较生硬，且“出来”未充分承载神圣审判者出临的庄重语气。改为“必带着震怒和刑罚而来”更自然，同时保留原文的震怒、刑罚与出临。
  terminology: “不法”“污秽”“刑罚”“审判”在现代庄重汉语中搭配自然，并保留原文罪恶、礼仪／道德不洁和司法惩治的不同侧面。“圣洁的主”保留为非后期教义化的神圣称号。
  issues:
  - severity: medium
    issue: “无视律法”与罪恶清单的名词并列不够协调，且较“lawlessness”更偏主动描述。
    rationale: ዕልወት在此与罪、悖逆、污秽并列，译为“不法”既更简洁，也更贴近其抽象的违法／不法状态。
  - severity: low
    issue: “在震怒和惩罚中出来”不够自然。
    rationale: 原文的“出来／出临”在审判语境中可用“带着……而来”自然表达；“刑罚”亦比“大惩罚”后的重复“惩罚”更有庄重的司法语域。
  revised_text: 当罪、悖逆、亵渎和暴行在一切行为中日益增多，不法、恶行和污秽也日益增多时[b]，严厉的刑罚[a]必从天上临到他们所有人；圣洁的主必带着震怒和刑罚而来，在地上施行审判。
  revised_footnotes:
