review_pass:
  verdict: revise
  source_fidelity: 开头“当……时”准确保留 ወእመኒ 引出的时间／条件性从句；罪恶清单、天上而来的大惩罚，以及圣洁的主在震怒和惩罚中出来施行审判，均与吉兹文及英文审计轨迹相符。惟“无视律法”是动宾短语，置于一组抽象名词中不够平行，也较“lawlessness”多加了主观意志的色彩；宜改为“不法”。
  naturalness: 整体庄重通顺。将“不法”与“罪、悖逆、亵渎、暴行、恶行、污秽”并列，可使罪恶清单的句法更整齐、语体更凝练。“圣洁的主必在震怒和惩罚中出来”虽稍带直译痕迹，但仍属可接受的经文庄重语体，保留以贴近原文的两个介词短语。
  terminology: “罪”“悖逆”“亵渎”“暴行”“污秽”“审判”均恰当。“不法”是 ዕልወት／lawlessness 更直接、且不预设特定律法体系的对应。保留“大惩罚”及其脚注，以维持原词可指惩罚性灾祸或鞭罚的语义范围。
  issues:
  - severity: medium
    issue: “无视律法”不够忠实且破坏并列结构
    rationale: 原词及英文审计轨迹的“lawlessness”指不法／无法状态或行为，并不必然明示有意识地“无视”律法。“无视律法”作为动宾短语也与其余名词性恶行项目不平行。改作“不法”可保留概念范围并改善现代汉语表达。
  - severity: low
    issue: 脚注 b 的锚点应紧邻其所说明的开头句法
    rationale: 该脚注说明“当……时”的替代理解，置于句末不利于读者识别其对应对象。将标记移至“时”后，不改变经文意义。
  revised_text: 当罪、悖逆、亵渎和暴行在一切行为中日益增多，无视律法、恶行和污秽也日益增多时，必有大惩罚[a]从天上临到他们众人；圣洁的主必在震怒和惩罚中出来，在地上施行审判。[b]
  revised_footnotes:
  - marker: a
    text: 或译“必有大灾祸”或“必有严厉的鞭罚”；原词既可泛指惩罚，也可指作为惩罚而临到的灾害或打击。
    reason: lexical_alternative
  - marker: b
    text: 本句开头也可译作：“罪、悖逆、亵渎和暴行必在一切行为中增多，无视律法、恶行和污秽也必增多；于是，大惩罚必从天上临到……”
    reason: syntactic_alternative
  revision_rationale: 应将“无视律法”改为“不法”，并将脚注 b 移至“时”后；其余文本和脚注内容可保留。
