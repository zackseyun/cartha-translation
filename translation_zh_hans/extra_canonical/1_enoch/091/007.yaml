    reason: syntactic_alternative
  revision_rationale: 修订仅改善词义对应、名词清单的平行性和现代汉语的行文。“不法”直接对应“lawlessness”；“严厉的刑罚”自然表达“大惩罚”的审判性质；“带着震怒和刑罚而来”保留圣主出临的意思而避免生硬表达。脚注 a 仍保留刑罚性灾害／鞭罚的词汇可能；脚注 b 保留审计轨迹所记录的并列预言式替代译法，并将锚点移至相关从句末。
