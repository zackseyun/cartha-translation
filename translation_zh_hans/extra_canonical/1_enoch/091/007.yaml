base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/007.yaml
  text: And when sin and transgression and blasphemy and violence increase in every deed, and lawlessness and wrongdoing and uncleanness increase, a great punishment will come from heaven upon them all, and the Holy Lord will come forth in wrath and in punishment, to execute judgment upon the earth.
translation:
  language: zh_hans
  text: 当罪、悖逆、亵渎和暴行在一切行为中日益增多，不法、恶行和污秽也日益增多时[b]，严厉的刑罚[a]必从天上临到他们所有人；圣洁的主必带着震怒和刑罚而来，在地上施行审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大灾祸”或“严厉的鞭罚”；原词既可泛指刑罚，也可指作为刑罚而临到的灾害或打击。
    reason: lexical_alternative
  - marker: b
    text: 本句开头也可译作：“罪、悖逆、亵渎和暴行必在一切行为中增多，不法、恶行和污秽也必增多；于是，严厉的刑罚必从天上临到……”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ወእመኒ
  choice: 当……时
  rationale: 保留原文引出条件兼时间从句的结构，并使后面的天罚成为主句；在现代汉语中比直译为“如果”更贴合此处预告性的末世语境。
- source_word: ትልህቅ / ትለህቅ
  choice: 日益增多
  rationale: 重复动词表示邪恶不断加剧；“日益增多”自然地传达增长和升级。
- source_word: ኃጢአት
  choice: 罪
  rationale: 保留其明确的道德与宗教含义。
- source_word: ዓመፃ
  choice: 悖逆
  rationale: 体现违反正道和反叛的意味，并与后文较宽泛的“恶行”相区别。
- source_word: ጽርፈት
  choice: 亵渎
  rationale: 在恶德清单中可指带有不敬性质的辱骂言语；“亵渎”保留其指向神圣者的可能性。
- source_word: ግፍዕ
  choice: 暴行
  rationale: 兼顾暴力和压迫性不义的含义，且适合与其他抽象罪恶并列。
- source_word: በኵሉ ተግባር
  choice: 在一切行为中
  rationale: 保留原文的周遍意味，表明败坏渗入各种行为。
- source_word: ዕልወት
  choice: 无视律法
  rationale: 传达不法和蔑视规范的含义，同时避免把词义限定为特定宗教制度下的“背道”。
- source_word: አበሳ
  choice: 恶行
  rationale: 作为宽泛的道德罪过用语，与前面的“罪”和“悖逆”保持一定区分。
- source_word: ርኵስ
  choice: 污秽
  rationale: 保留道德与礼仪层面的双重可能含义，且符合庄重的经文语体。
- source_word: መቅሠፍት ዐቢይ
  choice: 大惩罚
  rationale: 上下文以震怒和审判为中心，惩罚义最为贴切；脚注保留“灾祸”或“鞭罚”等具体刑罚性苦难的可能。
- source_word: ይከውን እምሰማይ ዲበ እሉ ኵሎሙ
  choice: 从天上临到他们众人
  rationale: 用自然汉语表达惩罚的天上来源和涉及所有相关者的范围。
- source_word: እግዚእ ቅዱስ
  choice: 圣洁的主
  rationale: 保留主权与圣洁两个要素，不将其强行套入其他固定称号。
- source_word: በመዓት ወበመቅሠፍት
  choice: 在震怒和惩罚中
  rationale: 尽量保留两个介词短语的并列形式及其审判语气，不将惩罚解释成单一具体方式。
- source_word: ይግበር ኵነኔ ዲበ ምድር
  choice: 在地上施行审判
  rationale: 准确表达执行司法性判决的动作和地点。
theological_decisions:
- issue: 神圣称号 እግዚእ ቅዱስ 的表达
  choice: 圣洁的主
  alternative: 主，那圣者
  rationale: 原文可理解为紧密的称号，也可作同位表达；正文采用自然而庄重的紧密结构，不借用后期固定神学称谓。
- issue: መቅሠፍት 的含义
  choice: 惩罚
  alternative: 灾祸／鞭罚
  rationale: 本节结尾明说施行审判，因此正文突出惩罚性质；同时以脚注保留该词可指刑罚性灾害或打击的语义张力。
- issue: 开头 ወእመኒ 的句法关系
  choice: 当……时
  alternative: 如果……，那么……；或将各项理解为连续的预言陈述
  rationale: 保留原文的从属结构以及邪恶增长与天上惩罚之间的时间兼条件关系；脚注说明另一种较并列的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。罪恶清单尽量保持各词之间的差别；句法保留开头的时间兼条件从句，并以分号清楚连接天罚与圣主出来施行审判两个动作。所有脚注标记均置于正文相应位置。
