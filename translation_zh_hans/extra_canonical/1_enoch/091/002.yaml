base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/002.yaml
  text: And after this[a], Methuselah went and called all his brothers to him[b], and gathered his kindred.
translation:
  language: zh_hans
  text: 这事以后[a]，玛土撒拉去把他的所有弟兄都叫到他那里，并召集了他的亲族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这事以后”也可译作“随后”或“从此”。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: 这事以后
  rationale: 该介词形式本有“由此、从此”之意，在叙事中用作时间承接；译作“这事以后”自然清楚，同时以脚注保留“随后”等可能。
- source_word: ሖረ
  choice: 去
  rationale: 这是普通的移动动词；“去”简洁地保留叙事动作，不增添“离开”或正式“前往”的意味。
- source_word: ማቱሳላ
  choice: 玛土撒拉
  rationale: 采用现代简体中文圣经传统中 Methuselah 的通行译名，便于辨认。
- source_word: ጸውዖሙ
  choice: 叫
  rationale: 原词可指呼叫或召来；“叫到他那里”既自然，又不额外赋予正式传召或社交邀请的色彩。
- source_word: ለኵሎሙ አኃዊሁ
  choice: 他的所有弟兄
  rationale: 忠实表达全称与亲属关系；“弟兄”适合庄重的古代家族叙事，也不将其泛化为属灵群体。
- source_word: ኀቤሁ
  choice: 到他那里
  rationale: 表达朝向他、来到他跟前的空间关系，比单纯“给他”更准确自然。
- source_word: አስተጋብኦሙ
  choice: 召集
  rationale: 该使役性动词表示使众人聚集；“召集”准确、简洁，并与前面的“叫”有所区分。
- source_word: አዝማዲ ዚአሁ
  choice: 他的亲族
  rationale: 指有血缘或宗族关系的人；“亲族”比“家人”范围更宽，也比“亲属”略具古代家族叙事的庄重感。
theological_decisions:
- issue: 亲属称谓的范围
  choice: 按字面译作玛土撒拉的“弟兄”和“亲族”
  alternative: 将“弟兄”理解为宗族成员或更广泛的同伴
  rationale: 本节措辞和遗训式家族语境都支持实际亲属关系；没有充分依据将其属灵化或宗派化。
- issue: 第二分句是否含“到他自己那里”
  choice: 只译“召集了他的亲族”，不补“到他那里”
  alternative: 译作“把他的亲族召集到自己那里”
  rationale: “到他那里”对应前一分句中的 ኀቤሁ；后一宾语短语仅为“他的亲族”，不应把前面的方位成分重复带入。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留古代家族叙事中的“弟兄、亲族”，但避免文言化；句法清楚区分“叫弟兄到他那里”与“召集亲族”两个并列动作。
