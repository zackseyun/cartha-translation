base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/005.yaml
  text: For I know that violence will endure upon the earth[a], and a great scourge will be carried out upon the earth; and all lawlessness will be brought to completion and be cut off from its roots[c][b], and every structure will pass away.
translation:
  language: zh_hans
  text: 因为我知道，强暴必在地上持续；一场大灾罚[a]也必在地上施行；一切悖逆都将达到满度[b]，并从根上被砍除；一切建造之物都要消逝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大灾罚”也可译作“大灾祸”“大瘟疫”或“大惩罚”；原词可指带有惩治意味的灾难或击打，并不专指疾病。
    reason: lexical_alternative
  - marker: b
    text: “达到满度”也可理解为“完成”或“达到极点”；意思可能是悖逆在审判临到前发展至充分程度，并非说它得到认可。
    reason: alternative_reading
  - marker: c
    text: “建造之物”也可译作“建筑”或“所建造的一切”；原词可具体指建筑，也可作较宽泛的建造物理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ፡ አእምር
  choice: 因为我知道
  rationale: 保留因果连接词及第一人称的确定语气；现代汉语自然且庄重。
- source_word: ይጸንዕ፡ ሀላዌ፡ ግፍዕ
  choice: 强暴必……持续
  rationale: 该表达指强暴、不义的存在持续或坚立；“持续”不暗示认可，“强暴”兼具暴力与压迫性不义的意味。
- source_word: መቅሠፍት፡ ዐቢይ
  choice: 大灾罚
  rationale: 原词可指瘟疫、击打、灾祸或惩罚；“灾罚”同时保留灾难性与惩治色彩，不限于疾病。
- source_word: ትትፈጸም
  choice: 施行
  rationale: 用于“大灾罚”时表达灾罚被执行、实现的被动意义。
- source_word: ኵላ፡ ዓመፃ
  choice: 一切悖逆
  rationale: 原词涵盖叛逆、违法与不义；“悖逆”保留其道德和反叛色彩。
- source_word: ትትፈጸም
  choice: 达到尽头
  rationale: 同一动词用于悖逆时可表示完成、达到满度；此译保留恶达到终局而后被除灭的张力。
- source_word: ትትገዘም፡ እምሥረዊሃ
  choice: 从根上被砍除
  rationale: 保留从根部砍断、彻底清除的形象及审判的终极性。
- source_word: ኵሉ፡ ሕንጻ
  choice: 一切建筑
  rationale: 该名词通常指建筑或建造之物；正文采用具体义，同时以脚注保留较宽泛的可能。
- source_word: የኃልፍ
  choice: 都要消逝
  rationale: 表达过去、消失或不复存在，适合庄重的审判语境，同时不限定为毁坏的具体方式。
theological_decisions:
- issue: 恶是持续存在、达到满度，还是立即被毁灭
  choice: 按动词次序译为强暴持续、悖逆达到尽头，继而从根上被砍除。
  alternative: 把整句顺译为恶立即终止并被消灭。
  rationale: 吉兹语的动词次序呈现持续、完成、根除的推进；此译不把末世审判的张力提前消解。
- issue: “达到尽头”是否意味着悖逆得到认可或成全
  choice: 保留“达到尽头”的完成含义，但不赋予肯定色彩。
  alternative: 译为“一切悖逆都将终止”。
  rationale: 后接“从根上被砍除”明确其受审判的结局；较直译的表达可保留恶达到满度的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“强暴”“灾罚”“悖逆”维持启示文学的审判语气；句式保留原文从持续、施行到完成、根除、消逝的层递结构。
