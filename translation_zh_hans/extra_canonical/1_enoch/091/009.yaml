base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/009.yaml
  text: And all will be given over with the nations[a], and the towers will be burned with fire; and they will be removed from all the earth, and they will be cast into the judgment of fire[d][c][b], and they will perish in wrath and in mighty judgment forever.
translation:
  language: zh_hans
  text: 一切偶像必与列国一同被抛弃[a]，高塔[b]必被火焚烧；他们必从全地被清除，被投入火的审判中[c]；他们必在震怒和大能的审判中灭亡，直到永远[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里依据Charles 1906文本的校正读法译为“偶像……被抛弃”。现有转录中相近字形疑因识别错误而成了“都必被交出”。“与列国一同”也可理解为“在列国中”。
    reason: textual_variant
  - marker: b
    text: 这里依据校正读法译作“高塔”，与Charles的传统译法相合；该词也可能指“庙宇”或“神庙”。现有转录的词形可能有识别错误。
    reason: lexical_alternative
  - marker: c
    text: 后文复数代词“他们”的确切所指并不完全明确，可能指列国之民，也可能承接前面受清除的对象。正文保留原文的指代张力。
    reason: referential_ambiguity
  - marker: d
    text: “直到永远”强调这场末世审判的持久和终局性质；本节本身并未进一步界定后世神学体系所讨论的受罚方式。
    reason: cultural_note
lexical_decisions:
- source_word: ጣዖት፡ ይትገደፍ（校正读法；转录文本作 ይትወሀብ）
  choice: 偶像都必……被抛弃
  rationale: Charles 1906的可靠校正读法包含“偶像”，动词表示丢弃、抛弃；如此也与本节清除偶像崇拜之物的审判语境相合。
- source_word: ምስለ፡ አሕዛብ
  choice: 与列国一同
  rationale: ምስለ通常表示“与……同”；አሕዛብ在此译作“列国”，既保留群体范围，也避免把后期宗教语境中的“外邦人”含义强加于原文。
- source_word: ማኅፈድ（校正读法；转录文本作 ማኅፈሪ）
  choice: 庙宇
  rationale: 校正后的词在偶像受审的语境中宜理解为庙宇或神庙；正文采用自然的“庙宇”，并在脚注保留“高塔”的可能性。
- source_word: በእሳት፡ ትነድድ
  choice: 必被火焚烧
  rationale: 保留火焚的末世审判意象，并采用符合现代汉语习惯的被动表达。
- source_word: ወይወፅእዎሙ፡ እምኵሉ፡ ምድር
  choice: 他们必从全地被除去
  rationale: 该形式带复数宾语后缀，语义为使之出去、除去；“全地”保留其宇宙性或广域性，而不缩窄为某一片土地。
- source_word: በኵነኔ፡ እሳት
  choice: 被投入火的审判中
  rationale: 保留“审判”与“火”的属格式组合，不完全意译成单纯的“火刑”，从而维持原文的司法性和启示文学节奏。
- source_word: ወይትሐጐሉ፡ በመዓት
  choice: 在震怒……中灭亡
  rationale: “灭亡”表达毁灭而不额外限定其具体机制；“震怒”符合庄重的审判语域。
- source_word: በኵነኔ፡ ኃያል
  choice: 在……大能的审判中
  rationale: 直译形容审判具有力量或威势，避免擅自改成仅表示严厉程度的“严酷审判”。
- source_word: እንተ፡ ለዓለም
  choice: 直到永远
  rationale: 传达持续、终局性的末世意味，同时不借译文界定后世系统神学对永刑方式的具体解释。
theological_decisions:
- issue: 受审群体的指代范围
  choice: 正文保留“他们”，不把后半节明确改写为“列国的人”或“敬拜偶像的人”。
  alternative: 可按上下文把代词解释为列国之民，或将宾语理解为偶像和庙宇等受审对象。
  rationale: 原文在偶像、列国和庙宇之后使用复数形式，具体回指并不完全清楚；保留代词能避免消除真实歧义。
- issue: “直到永远”与惩罚性质
  choice: 直译为“直到永远”，保留终局而持久的审判措辞。
  alternative: 可理解为属于末世时代的长久终局性，而不据此单独建立关于永恒有意识受苦的完整教义。
  rationale: 本节明确叠加火、震怒、审判、灭亡和永远等语言，但没有详细说明受罚状态的机制；译文不应超出文本作系统化断定。
translation_notes:
  register: 采用现代、庄重而易懂的启示文学语体。句式保留原文连续推进的审判节奏，但用分号和并列结构避免汉语生硬。文本校勘优先于有明显OCR问题的逐字转录，同时以脚注公开关键校正及尚存歧义。
