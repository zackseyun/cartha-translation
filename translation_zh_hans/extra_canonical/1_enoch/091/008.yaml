  text: In those days[a], violence shall be cut off from its roots[d][c][b], and iniquity together with deceit from under heaven.
translation:
  language: zh_hans
  text: 在那些日子[a]，强暴必从根上被剪除[b]；不义和诡诈必从天下被除去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些日子”指异象上下文所说的特定时期。
    reason: cross_reference
  - marker: b
    text: “被剪除”所译的动词也可理解为“被截断”或“终止”。
    reason: lexical_alternative
  - marker: c
    text: 原文后半句没有重复写出谓语；译文按前句承接为“被除去”。“诡诈”一词的文本和词义尚不完全确定，也可能指欺骗或奸猾。
    reason: textual_and_syntactic_note
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: 在那些日子
  rationale: 按常见指示性时间短语整体理解，避免误析为“在其中，日子……”。上下文仍可说明这些日子属于异象所述的特定时期。
- source_word: ትትገዘም
  choice: 必……被铲除
  rationale: 该动词有砍断、截断、终止之意；与“从根上”合用时，“铲除”在中文中自然保留彻底根除的形象。
- source_word: ግፍዕ
  choice: 暴行
  rationale: 可指暴力、压迫或不义；此处采用具体而有力的“暴行”，并与后面的“עመፃ／不义”区分。
- source_word: እምነ፡ ሥረዊሃ
  choice: 从根上
  rationale: 保留从根源彻底除灭的空间隐喻；中文单数式表达更自然。
- source_word: ዓመፃ
  choice: 不义
  rationale: 该词表达悖逆、违法或不义；“不义”可与前面的“暴行”形成相关但不重复的罪恶用语。
- source_word: ምስለ፡ ጕሕሉት
  choice: 连同诡诈
  rationale: ምስለ 表示伴随，后一词可能指诡诈或欺骗；据现有中等可信度文本采用“诡诈”，同时以脚注保留不确定性。
- source_word: እምታሕተ፡ ሰማይ
  choice: 从天下
  rationale: 直译为“从天之下”；“从天下”是简洁、庄重且自然的中文宇宙性表达。
theological_decisions:
- issue: 清除罪恶的范围
  choice: 将“从天下”理解为罪恶从天之下被清除，呈现广阔的末世审判图景。
  alternative: 仅指某一地区或社会中的改革。
  rationale: 原文末尾的“从天之下”扩大了陈述范围，但译文不额外规定其具体宇宙论机制。
- issue: 第二分句省略谓语
  choice: 为自然中文补出“也必……消失”，表明它承接前句的清除动作。
  alternative: 形式上保留省略：“不义连同诡诈也从天下。”
  rationale: 原文只有一个明确动词，后半句可承接其语义；中文若完全省略会残缺，因此补出语义相关而不过度具体的谓语，并用脚注说明。
translation_notes:
  register: 采用现代、庄重而清楚的简体中文。“从根上被铲除”保留原文强烈的根除意象；“从天下消失”使省略谓语的后半句在中文中完整，同时不把原文含混处解释得过细。
