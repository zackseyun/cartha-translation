base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/002.yaml
  text: Blessed are you[a], O righteous and chosen ones, for your portion is glorious.
translation:
  language: zh_hans
  text: 你们这些义人和蒙拣选的人有福了，因为你们所得的份额[a]满有荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所分得的一份”或“所得的产业”。原词指分配所得的一份，也可带有类似继承产业的意味。
    reason: 保留 ክፍል 的词义范围及其分配、承受产业的意象。
lexical_decisions:
- source_word: ብፁዓን
  choice: 有福了
  rationale: 保留祝福宣告的语气和庄重色彩；“快乐”不足以表达此处末世性福分。
- source_word: አንትሙ
  choice: 你们
  rationale: 准确表达第二人称复数的直接称呼，并自然融入汉语祝福句式。
- source_word: ጻድቃን
  choice: 义人
  rationale: 采用圣经及启示文学中通行的对应词，保留与恶人的对照。
- source_word: ወኅሩያን
  choice: 蒙拣选的人
  rationale: 表达其复数、实词化的“被选择者”含义，同时避免仅用形容词造成指称不明。
- source_word: እስመ
  choice: 因为
  rationale: 明确引出前述祝福的根据，符合现代汉语表达。
- source_word: ስቡሕ
  choice: 满有荣耀
  rationale: 在修饰“所得的分”时比生硬的“是荣耀的”更自然，同时保留荣耀、光辉之义。
- source_word: ክፍልክሙ
  choice: 你们所得的分
  rationale: 保留所分得之份额或类似产业的意象，不把词义收窄为偶然抽签所得。
theological_decisions:
- issue: 如何翻译比喻篇中对 ወኅሩያን 的群体称谓
  choice: 蒙拣选的人
  alternative: 选民；被选中的人
  rationale: “蒙拣选的人”保留圣约及末世语境中的分量，却不进一步限定拣选的方式或导入后期系统神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语；以“有福了”呈现祝福宣告，以“义人”和“蒙拣选的人”保持启示文学中的关键群体称谓。脚注标记紧随其实际说明的“分”，而不沿用英文咨询层中疑似错置于“you”之后的标记位置。
