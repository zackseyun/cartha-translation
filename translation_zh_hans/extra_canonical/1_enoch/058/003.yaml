base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/003.yaml
  text: And the righteous shall be in the light of the sun[a], and the chosen in the light of eternal life; and there shall be no end to the days of their life[b], and the holy ones shall have days without number.
translation:
  language: zh_hans
  text: 义人必在日光中，蒙拣选的人必在永生的光中；他们一生的年日必没有尽头，圣者的年日也无从数算。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጻድቃን
  choice: 义人
  rationale: 对应指以公义为特征的人，采用现代中文宗教与文学语境中自然、明确的常用称谓。
- source_word: በብርሃነ ፀሐይ
  choice: 在日光中
  rationale: 保留介词结构及异象性的光明意象，不将其弱化为单纯的明亮。
- source_word: ኅሩያን
  choice: 蒙拣选的人
  rationale: 表达被拣选这一群体身份，同时避免“选民”可能附带的特定民族或教派含义。
- source_word: በብርሃነ ሕይወት ዘለዓለም
  choice: 在永生的光中
  rationale: 保留“光”与“永恒生命”结合的启示文学意象，而不简化为仅仅“永远活着”。
- source_word: ማኅለቆተ አልቦቱ
  choice: 必没有尽头
  rationale: 自然表达原文绝对否定终点或限度的含义。
- source_word: መዋዕለ ሕይወቶሙ
  choice: 他们一生的年日
  rationale: 保留原文“生命的日子”这一时间意象；“一生的年日”在现代中文中庄重且易懂。
- source_word: ቅዱሳን
  choice: 圣者
  rationale: 保留广义的神圣群体称谓，避免“圣徒”可能引入后期教会制度色彩。
- source_word: ኍልቈ መዋዕለ አልቦሙ
  choice: 年日也多得无法数算
  rationale: 传达“年日无数”的闪族式表达，避免逐字译法被误解为没有任何日子，同时保留不可计数、没有限量之意。
theological_decisions:
- issue: 如何翻译 ኅሩያን 所指的被选择群体
  choice: 蒙拣选的人
  alternative: 选民
  rationale: “蒙拣选的人”忠实表达被动的拣选身份，又不预先限定其民族范围或引入特定教义体系。
- issue: 如何表达圣者年日不可计数的末句
  choice: 圣者的年日也多得无法数算
  alternative: 圣者的年日也没有数目
  rationale: 前者自然传达原文习语所强调的无尽、不可计数，避免后者在现代中文中显得生硬或产生歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留“日光”“永生的光”“年日”等启示文学意象和两组平行结构，不加入原文未明说的施事者或教派性解释。
