  text: And after this it will be said to the holy ones in heaven[c][b][a],
translation:
  language: zh_hans
  text: 此后，将对天上的圣者说： [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“将被说”；原文采用无人称的被动表达，没有说明说话者是谁。
    reason: lexical_alternative
  - marker: b
    text: “圣者”可能指天上的众生，也可能指身在天上的义人；本句没有明确限定。
    reason: alternative_reading
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: 此后
  rationale: 该复合时间短语承接异象的下一阶段；“此后”简洁自然，并保留叙事上的先后联系。
- source_word: ይትበሀል
  choice: 必有话……说
  rationale: 该词是“说”的无人称被动式；这样译既体现将来意味，也不擅自补出说话者。
- source_word: ለቅዱሳን
  choice: 对……圣者
  rationale: 介词在被动表达中自然译为“对”；“圣者”保留词语的宽泛所指，不预先限定为天使或在天上的义人。
- source_word: በሰማይ
  choice: 天上的
  rationale: 原文为单数“天”；汉语以“天上的”修饰“圣者”自然凝练，也没有扩展成复数诸天。
theological_decisions:
- issue: “圣者”的身份
  choice: 保留“圣者”这一宽泛称呼，不判定其具体身份
  alternative: 天使；在天上的义人；蒙拣选者或圣徒
  rationale: 以诺传统中的该词既可指天上众生，也可指成圣的人；本短句本身不足以确定，应保留其神学张力。
- issue: 说话者的身份
  choice: 采用无人称表达，不补明主语
  alternative: 译作“他必对……说”或“有人必对……说”
  rationale: 原文使用被动式而未指明说话者；补出“他”或“有人”会增加原文没有的信息。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必有话……说”避免生硬的“将被说”，同时保留原文的无人称被动语气；脚注标记均置于正文对应位置。
