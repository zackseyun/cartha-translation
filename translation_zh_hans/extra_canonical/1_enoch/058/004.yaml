base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/004.yaml
  text: And they will seek the light and find righteousness with the Lord of Spirits[c][b][a]. Peace be to the righteous in the name of the Lord of Eternity.
translation:
  language: zh_hans
  text: 他们必寻求光，并在诸灵之主那里找到公义[a]。愿平安在永恒之主的名中临到义人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “找到公义”也可译作“获得公义”；原词可兼有这两种意思。
    reason: lexical_alternative
  - marker: b
    text: “永恒之主”原文也可理解为“时代之主”或“世界之主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: የኃሥሡ
  choice: 必寻求
  rationale: 该复数动词表示“寻求、搜寻”；结合异象性语境，以“必”表达将来趋向，同时保留庄重语气。
- source_word: ለብርሃን
  choice: 光
  rationale: 宾语标记表明“光”是寻求的对象；保留启示文学中的光明意象，不将其解释性改写为引导或救恩。
- source_word: ይረክቡ
  choice: 找到
  rationale: 此动词可指“找到”或“获得”；“寻求……找到……”在汉语中自然呼应，也保留原句的平行关系。
- source_word: ጽድቀ
  choice: 公义
  rationale: 此处与后文“义人”相呼应，采用兼具道德和盟约意味的常用译法“公义”。
- source_word: በኀበ
  choice: 在……那里
  rationale: 该介词可表示与某位格的接近、同在或来源；“在……那里”保留空间与关系层面的开放性，不强行判定为“从……而来”。
- source_word: እግዚአ መናፍስት
  choice: 诸灵之主
  rationale: 这是《以诺一书》中固定的神圣称号；“诸灵之主”自然、庄重，并体现其宇宙性范围。
- source_word: ሰላም ለጻድቃን
  choice: 愿平安……临到义人
  rationale: 该短语具有祝福或宣告功能；此译法在现代汉语中清楚传达祈愿和祝福语气。
- source_word: በስመ
  choice: 在……的名里
  rationale: 较透明地保留“在……名中”的公式性表达，避免将其过度解释为凭借、代理或权柄。
- source_word: እግዚአ ዓለም
  choice: 永恒之主
  rationale: ዓለም可指时代、世界或永恒；结合该神圣称号的宇宙和永恒内涵，正文采用自然且不具时代限制意味的“永恒之主”。
theological_decisions:
- issue: 公义是在诸灵之主那里“找到”还是“获得”
  choice: 找到公义
  alternative: 获得公义
  rationale: 原动词兼有“找到”和“获得”的可能；正文以“找到”呼应“寻求”，脚注保留另一种语义，避免对公义的来源或领受方式作额外教义判断。
- issue: 末尾神圣称号 እግዚአ ዓለም 的译法
  choice: 永恒之主
  alternative: 时代之主；世界之主
  rationale: ዓለም具有“时代、世界、永恒”等语义。正文采用“永恒之主”，既符合称号的宏阔范围，也避免现代汉语“时代之主”可能造成只统管某一时期的误解；脚注保留原词的多义性。
- issue: 平安语句的功能
  choice: 按祝福语译为“愿平安……临到义人”
  alternative: 按陈述译为“平安归于义人”
  rationale: 无动词结构容许祝福或宣告两种理解；正文采用自然的祝福语式，但不把它发展为特定宗派的神学公式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“光”“公义”“诸灵之主”等启示文学和神学意象；句式略带祝福体色彩，但避免古奥表达。
