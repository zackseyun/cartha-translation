base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/001.yaml
  text: And I began to speak the third parable concerning the righteous and concerning the chosen[a].
translation:
  language: zh_hans
  text: 我开始讲第三个比喻，论到义人和蒙拣选的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比喻”也可译作“譬喻”；此处原词可指以比拟方式表达的论述，并用作这一大段的标题。
    reason: lexical_alternative
lexical_decisions:
- source_word: አኀዝኩ እበል
  choice: 我开始讲
  rationale: 前一动词可表示“抓住、着手、开始”，接后面的“说”时宜按起始义理解；“开始讲”自然地引出一段较长的论述。
- source_word: ሣልሰ ምሳሌ
  choice: 第三个比喻
  rationale: ሣልሰ 表示“第三”，ምሳሌ 可指比喻、譬喻或相似性论述。正文采用现代读者容易理解的“比喻”，脚注保留“譬喻”这一可能译法。
- source_word: በእንተ ጻድቃን
  choice: 论到义人
  rationale: በእንተ 在此标明论述主题，意为“关于、论到”；ጻድቃን 是复数群体称谓，译作“义人”以保留其启示文学用语。
- source_word: ወበእንተ ኅሩያን
  choice: 和蒙拣选的人
  rationale: ኅሩያን 指被选择的一群人。“蒙拣选的人”既保留被选择的语义，也避免只用“选民”而引入过强的后世体系化含义。
theological_decisions:
- issue: 群体称谓 ኅሩያን 的译法
  choice: 蒙拣选的人
  alternative: 选民；被选中的人
  rationale: 该词是本书反复出现的身份称谓。所选译法保留其被拣选的含义，同时不预先限定其在后世教义体系中的具体所指。
- issue: 文学标签 ምሳሌ 的译法
  choice: 比喻
  alternative: 譬喻；相似之论
  rationale: 原词语义范围包括比喻、箴言及相似性论述。此处是第三大段论述的标题；“比喻”最为自然，脚注则提示其文学标签也可译作“譬喻”。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“我开始讲”避免生硬直译；“论到”保持标题式、启示文学式语气；“义人”和“蒙拣选的人”保留两个并列群体称谓，不将二者擅自合并。
