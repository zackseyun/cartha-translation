revisions:
- from: 我朝那个方向[a]走去，看见七座壮丽的山，一座与一座各不相同；山上的石头华美秀丽，诸山全都气象壮丽辉煌，面貌秀美[b]。其中三座朝向东方，一座叠在一座之上；三座朝向北方，也是一座叠在一座之上。其间有幽深曲折的沟壑[c]，一道与另一道互不相近。
  to: 我朝那个方向[a]走去，看见七座壮丽的山，一座与一座各不相同；山上的石头华美秀丽，诸山的外观全都壮丽辉煌，面貌秀美[b]。其中三座在东方，一座叠在一座之上；三座在北方，也是一座叠在一座之上。又有幽深曲折的沟壑[c]，一道与另一道互不相近。
  rationale: 修正方位表达，避免把山的所在地误解为山体的朝向；删除“其间”以免在沟壑位置上增添原文未明说的信息；并将“气象”改为“外观”，使视觉描写更贴近原文。其余措辞及全部脚注锚点均予保留。
  reviewer_model: gpt-5.6-terra
