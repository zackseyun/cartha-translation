base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/002.yaml
  text: And I went in that direction and saw seven glorious mountains[a], each one differing from the other; and their stones were glorious and beautiful, and all of them were glorious and splendid in appearance, and fair in face. Three were toward the east, one set upon another, and three toward the north, one set upon another, with deep and winding ravines[d][c][b], no one coming near to another.
translation:
  language: zh_hans
  text: 我朝那个方向[a]走去，看见七座壮丽的山，一座与一座各不相同；山上的石头华美秀丽，诸山的外观全都壮丽辉煌，面貌秀美[b]。其中三座在东方，一座叠在一座之上；三座在北方，也是一座叠在一座之上。又有幽深曲折的沟壑[c]，一道与另一道互不相近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我沿着自己的路走去。”原文方位短语可有两种理解。
    reason: translation_ambiguity
  - marker: b
    text: 原文直述诸山的“脸／面”秀美，带有近似拟人化的视觉意象。
    reason: cultural_note
  - marker: c
    text: 末句的阴性形式很可能回指这些沟壑，意为各道沟壑彼此不相近；原文所描绘的具体地形关系仍较难确定。
    reason: textual_difficulty
lexical_decisions:
- source_word: ሖርኩ፡ መንገሌሁ
  choice: 我朝那个方向走去
  rationale: 保留异象行程的叙事推进；方位短语在此可理解为“朝那个方向”，也可能指“沿着我的路”。
- source_word: ሰብዐተ፡ አድባረ፡ ክቡራነ
  choice: 七座壮丽的山
  rationale: አድባር指山；ክቡራነ兼有尊贵、荣耀和宏伟之意，“壮丽”适合描写异象中的山势，又不引入神学判断。
- source_word: ወኵሉ፡ ፩እምነ፡ ፩እንዘ፡ ይትዌለጥ
  choice: 一座与一座各不相同
  rationale: 表达诸山彼此有别，避免把差异限定为单纯的空间分隔。
- source_word: ወእእባኒ፡ ክቡራነ፡ ወሠናያነ
  choice: 山上的石头华美秀丽
  rationale: 直承“石头”的复数意象，并以“华美秀丽”传达荣耀与美好这两个并列修饰语。
- source_word: ወኵሉ፡ ክቡር፡ ወስቡሕ፡ ራእዮሙ
  choice: 诸山全都气象壮丽辉煌
  rationale: 将“所见的样子／外观”自然译作“气象”，保留视觉上的庄严和光彩。
- source_word: ወሠናይ፡ ገጾሙ
  choice: 面貌秀美
  rationale: ገጽ本义为“脸、面”，原文近似拟人化地描绘群山；译文保留“面貌”，不将意象完全平化为一般的“外观”。
- source_word: ጽኑዓን፡ ፩ዲበ፡ ፩
  choice: 一座叠在一座之上
  rationale: 呈现诸山上下层叠或稳固相承的布局；“叠在”较自然，同时不暗示人为建造。
- source_word: ቈላት፡ ዕሙቅ፡ ወጠዋያት
  choice: 幽深曲折的沟壑
  rationale: ዕሙቅ表示深，ጠዋያት表示弯曲、蜿蜒；按复数地貌名词译为“沟壑”，不误作额外的一条山谷。
- source_word: አሐቲ፡ ለአሐቲ፡ ኢይትቃረባ
  choice: 一道与另一道互不相近
  rationale: 阴性单数形式最自然地回指前面的沟壑；以量词“道”明确所指，同时保留各沟壑彼此不相近的陈述。
