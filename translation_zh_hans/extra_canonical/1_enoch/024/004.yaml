  text: And among them was a tree whose fragrance I had never smelled[a][b].
translation:
  language: zh_hans
  text: 其中有一棵树，它的香气是我从未闻过的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚语转录的末词可能因OCR而讹误；校正后意为“我闻过”。希腊语旁证也作“我从未闻过”。旧有的“香气如同没药”读法缺乏可靠的原文依据。
    reason: textual_variant
lexical_decisions:
- source_word: ወሀሎ
  choice: 有
  rationale: 该形式表示存在；与前面的连接词合起来译入“其中有”，使叙述自然连贯。
- source_word: እምውስቴቶሙ
  choice: 其中
  rationale: 表示位于先前所述诸树之中；“其中”简洁保留空间关系。
- source_word: ዕፅ
  choice: 一棵树
  rationale: 在异象中的树林语境里，具体指树木，而非泛指木材或植物。
- source_word: ዘአልቦ ገሙራ
  choice: 从未
  rationale: 否定结构表达“从来没有、绝不曾”的意思；这里按副词性惯用表达处理，而不把ገሙራ误解为香料名称。
- source_word: አመ
  choice: 曾／过（融入“从未闻过”）
  rationale: 在此与否定结构和嗅闻动词共同构成时间意义；汉语以“从未……过”自然表达。
- source_word: ጼወኒ（疑为ጼኖኩ）
  choice: 我闻过
  rationale: 现存转录很可能有OCR讹误；校正后的ጼኖኩ意为“我闻过”，且与希腊语旁证“我从未闻过”相合。
- source_word: 隐含的嗅闻对象
  choice: 香气
  rationale: 汉语通常不说“闻一棵树”来描述其独特气味，因此明示语境中隐含的对象“香气”，既自然又不改变陈述重点。
theological_decisions:
- issue: 这棵树的独特之处
  choice: 它的香气是以诺从未闻过的
  alternative: 我从未闻过这样的一棵树
  rationale: 嗅闻动词表明重点在树的气味；将隐含宾语译为“香气”符合现代汉语，也保留异象的感官描写。
- issue: 末词是否指“没药”
  choice: 不译作“没药”
  alternative: 它的香气如同没药
  rationale: “没药”读法源于有问题的转录和词义误判；将末词校正为“我闻过”后，整句与希腊语旁证吻合，文本中没有可靠的没药比较。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“其中有一棵树”承接前文群树；“它的香气是我从未闻过的”以自然汉语明示嗅闻对象，同时避免把有问题的OCR读法误译为“没药”。
