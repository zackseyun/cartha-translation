base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/003.yaml
  text: And the seventh mountain was in the midst of these[a], and its height surpassed them all, resembling the seat of a throne[c][b], and fragrant trees encircled it.
translation:
  language: zh_hans
  text: 第七座山在这些山中间；它高过其余各山[a]，形状仿佛宝座的座位[b]，芳香的树木环绕着它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文本这一短语的传本形式含混，字面上的数与指代也不整齐；希腊文见证作“它在高度上超过它们”。方括号中的“全都”在文本上也不确定。
    reason: textual_variant
  - marker: b
    text: 原文连续使用“座位”和“宝座”两个词，因此译作“宝座的座位”；也可较简洁地理解为“宝座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕ ደብር
  choice: 第七座山
  rationale: 按异象中群山的次序译出序数；“座”为现代汉语中山的自然量词。
- source_word: ማእከሎሙ ለእሎንቱ
  choice: 在这些山中间
  rationale: 保留指示成分“这些”，并明确所指为前文诸山，使汉语自然清楚。
- source_word: ኖኆሙ ዘይትማሰሉ [ኵሎሙ]
  choice: 它高过其余各山
  rationale: 埃塞俄比亚文本此处传抄有困难；结合语境及希腊文见证所保存的“在高度上超过它们”，译出第七座山高于其他山的意思，并以脚注交代文本问题。
- source_word: መንበረ አትራኖስ
  choice: 宝座的座位
  rationale: 分别保留“座位”和“宝座”两个词，没有将双重表达简化为单独的“宝座”。
- source_word: የአውድዎ
  choice: 环绕着它
  rationale: 准确表达围在四周的空间关系，符合现代汉语习惯。
- source_word: ዕጸወ መዓዛ
  choice: 芳香的树木
  rationale: 该结构指以香气为特征的树木；“芳香的树木”自然且保留感官意象。
theological_decisions: []
