base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/001.yaml
  text: And from there I went to another place of the earth[a], and he showed me a mountain of fire that blazed day and night.
translation:
  language: zh_hans
  text: 我从那里到了地上的另一处；他让我看见一座昼夜燃烧的火焰之山。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他让我看见”的主语在吉兹文中没有明说；按上下文，很可能是引导以诺的天使。
    reason: 说明隐含主语及其上下文所指，同时不在正文中消除原文的含混。
lexical_decisions:
- source_word: እምህየ
  choice: 从那里
  rationale: 标明异象旅程从前一地点继续展开；现代汉语自然，也保留空间上的衔接。
- source_word: ሖርኩ
  choice: 我……去
  rationale: 对应第一人称的简单移动动词，保持异象叙事直接简洁的语气。
- source_word: ካልአ መካነ ምድር
  choice: 地上的另一处
  rationale: 保留“地/大地”与“另一处”的宇宙地理意味，同时采用自然的现代汉语表达。
- source_word: አርአየኒ
  choice: 他让我看见
  rationale: 准确表达使役性的“使我看见”；保留原文未明说身份的第三人称单数主语。
- source_word: ደብረ እሳት
  choice: 一座火山
  rationale: 按构造义取“一座由火构成或充满火的山”；中文“火山”简洁而有力，但可能被现代读者理解为地质学意义，因此以语境中的“昼夜燃烧”限定其异象形象。
- source_word: ዘያንበለብል
  choice: 燃烧
  rationale: 表达持续的火焰活动，不额外加入“猛烈”等原文未必明确要求的程度。
- source_word: መዐልተ ወሌሊተ
  choice: 昼夜
  rationale: 凝练地保留“白日和黑夜”的固定时间对举，表达持续不断。
theological_decisions:
- issue: “他让我看见”的隐含主语
  choice: 正文保留“他”，不明确写成“天使”
  alternative: 那天使让我看见；我的向导让我看见
  rationale: 上下文很可能指以诺的天使向导，但本节自身没有明说其身份；保留“他”可避免把上下文推断写入正文。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。句式保持异象行旅叙事的简洁推进；“昼夜燃烧”呈现持续而鲜明的末世异象。
