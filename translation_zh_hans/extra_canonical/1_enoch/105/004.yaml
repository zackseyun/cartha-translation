  text: Hope[a], and do not abandon your hope, for great joy will be yours[b], like the angels of heaven.
translation:
  language: zh_hans
  text: 你们要心存盼望，不要丢弃你们的盼望，因为你们将有极大的喜乐，如同天上的众天使。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如同天上的众天使”明确表示比较，但原文没有说明所比较的究竟是他们的喜乐、蒙福的状态，还是所得的天上赏赐。
    reason: preserve_ambiguity
lexical_decisions:
- source_word: ተስፈዉ
  choice: 要心存盼望
  rationale: 这是表示“盼望、信赖”的复数命令式；译作“要心存盼望”既保留直接劝勉的语气，也不添加原文未明说的盼望对象。
- source_word: ወኢትኅድጉ
  choice: 不要丢弃
  rationale: 否定命令式表达离弃、舍弃之意；“不要丢弃”在现代汉语中自然，又保留原文较强的劝诫力度。
- source_word: ተስፋክሙ
  choice: 你们的盼望
  rationale: 后缀明确指复数听众；重复“盼望”一词，保留原文的修辞呼应。
- source_word: እስመ
  choice: 因为
  rationale: 引出前述劝勉的理由；“因为”清楚、自然。
- source_word: ትከዉኑ ለክሙ
  choice: 你们将有
  rationale: 按语境表达将来临到听众或归给听众的福分；“你们将有”比逐字式的“将为你们”更符合现代汉语，同时不改变其受益或领受的含义。
- source_word: ፍሥሓ ዐቢይ
  choice: 极大的喜乐
  rationale: 保留名词与形容词的组合；“极大的喜乐”体现强度，也保持庄重的祝福语气。
- source_word: ከመ መላእክተ ሰማይ
  choice: 如同天上的众天使
  rationale: 明确保留原文的比较结构与天上意象；不把这种相似解释为变成天使。
theological_decisions:
- issue: 与天使比较的具体所指
  choice: 保留“如同天上的众天使”这一比较，让它在句法上主要承接“有极大的喜乐”，但不进一步界定相似之处。
  alternative: 译成“与天上的众天使一同喜乐”，或“变得像天上的众天使”。
  rationale: 原文仅使用简单的比较结构，没有明确说义人会变成天使，也没有明确使用“一同”的措辞；因此应保留其神学张力与一定程度的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心存盼望／你们的盼望”保留原文关键词的重复；“众天使”自然体现集合性的复数含义。脚注标记置于比较语之后，避免误附于句首命令。
