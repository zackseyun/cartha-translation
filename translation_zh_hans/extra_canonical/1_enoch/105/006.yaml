base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/006.yaml
  text: And now[a], righteous ones, do not fear when you see sinners growing strong and prospering in their ways. Do not become their companions, but keep far from their violence[b]; for you shall be companions of the good ones of heaven.
translation:
  language: zh_hans
  text: 现在，义人啊，当你们看见罪人日益强盛，在自己的道路上亨通时，不要惧怕。不要与他们为伴，却要远离他们的暴行；因为你们将与天上的良善者为伴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 保留话语转折与当下劝勉的语气；句首用“现在”符合现代汉语。
- source_word: ኢትፍርሁ
  choice: 不要惧怕
  rationale: 这是向义人发出的否定命令；“不要惧怕”庄重、直接。
- source_word: ጻድቃን
  choice: 义人
  rationale: 保留以名词指称末世伦理群体的用法，也维持其与“罪人”的鲜明对照。
- source_word: ይጸንዑ
  choice: 日益强盛
  rationale: 该动词表达坚固或强大；这里描述罪人表面可见的势力增长，不额外解释其性质。
- source_word: ይደልዉ ፍኖቶሙ
  choice: 在自己的道路上亨通
  rationale: “道路”保留行为和生活方式的路径隐喻；“亨通”表达进展顺利或成功。
- source_word: ሱቱፋነ
  choice: 为伴
  rationale: 同一词在本节出现两次，分别涉及罪人与天上的良善者；两处统一译为“为伴”，保留刻意的平行对照。
- source_word: ግፍዐ
  choice: 暴行
  rationale: 该词可指暴力、不义或压迫；“暴行”既保留强烈伦理色彩，也适合与要求远离的命令搭配。
- source_word: ኄራነ ሰማይ
  choice: 天上的良善者
  rationale: ኄራነ 是“良善者”的复数领属形式，并非“军旅/天军”；此译准确保留地上罪人与天上良善者之间的伦理对照，同时不把该群体限定为天使。
theological_decisions:
- issue: 结尾所说天上群体的身份
  choice: 天上的良善者
  alternative: 天使；天上的众军
  rationale: 原文称他们为“天上的良善者”，没有明言其具体类别。译文保留群体身份的开放性，不将其狭义化为天使，也不误译为天军。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。以“义人啊”明确呼语，以“罪人—良善者”和两次“为伴”保留原文的伦理及结构对照。无需脚注；英语咨询层中关于“天军”的脚注源于已纠正的词义误判，不应带入中文正文。
