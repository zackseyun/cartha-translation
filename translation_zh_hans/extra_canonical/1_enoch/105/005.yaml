base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/005.yaml
  text: What will you have to do? You will not have to hide on the day of the great judgment[a], and you will not be found as sinners[c][b]; and everlasting judgment will be upon you for all the generations of the world.
translation:
  language: zh_hans
  text: 你们还有什么可做的呢？在大审判的日子，你们不必躲藏，也不会被发现是罪人；永远的审判必远离你们[a]，历世历代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必远离你们”较直译为“必从你们而来／而去”或“必与你们分离”。原文介词的基本意思是“从”，此处的具体句法关系有争议；结合本章安慰义人的语境，可理解为永远的审判远离他们。也有人理解为审判“临到你们”，但这较难与该介词通常的方向及上下文协调。
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንተ፡ ሀለወክሙ፡ ትግበሩ
  choice: 你们还有什么可做呢？
  rationale: 原文是疑问词、存在表达和“做”组成的简短反问；译文保留其修辞语气，并用自然的现代汉语表达。
- source_word: አኮ፡ ትትኀብኡ
  choice: 你们不必躲藏
  rationale: 该动词形式可作被动或反身理解。结合本章安慰义人的语境，译作“不必躲藏”较合适，同时不把它处理成单纯的被隐藏状态。
- source_word: በዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: 在大审判的日子
  rationale: 直接保留启示文学中庄严的审判日用语。
- source_word: ወኢትትረከቡ፡ ከመ፡ ኃጥኣን
  choice: 也不会被看作罪人
  rationale: 原文直译近于“也不会被发现为罪人”。“被看作”在汉语司法和评断语境中较自然，同时保留否定式，不因上下文困难而擅自改写。
- source_word: ኵነኔ፡ እንተ፡ ለዓለም
  choice: 永远的审判
  rationale: 保留“审判”及其永久性，不强化为特定教义术语“永刑”或“定罪”。
- source_word: ትከዉን፡ እምኔክሙ
  choice: 必远离你们
  rationale: እምኔክሙ 的基本方向是“从你们”；结合前后安慰义人的语境，理解为审判与他们分离，即“远离你们”。由于该短语仍有句法争议，脚注注明较直的译法。
- source_word: ለእሉ፡ ትዉልደ፡ ዓለም
  choice: 直到世世代代
  rationale: 该表达表示跨越各世代的持久范围；汉语“直到世世代代”自然且保留时间延续性。
theological_decisions:
- issue: 本节整体是安慰义人还是警告罪人
  choice: 按上下文理解为对义人的安慰：他们不必躲藏，永远的审判将远离他们。
  alternative: 把末句理解为审判临到他们，从而形成警告语气。
  rationale: እምኔክሙ 通常表达“从你们”，而本章相邻经文以安慰义人为主；译作“远离你们”既符合介词方向，也避免把安慰反转为刑罚威胁。
- issue: “不会被看作罪人”的困难否定式
  choice: 照现存吉兹文保留否定。
  alternative: 据上下文或推定校改译成“你们必被发现是罪人”或“只会被发现是罪人”。
  rationale: 现存文本明确带否定成分。即使句法或传抄史可能存在问题，也不应在正文中无说明地改动。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“大审判的日子”“永远的审判”保留启示文学的肃穆色彩；正文不擅自修正困难的否定句，并以脚注交代末句的词义争议。
