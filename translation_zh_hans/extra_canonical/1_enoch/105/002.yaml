base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/002.yaml
  text: Hope[a], for formerly you were put to shame by evil and by affliction; but now you will shine like the light of heaven, you will shine and be seen[c][b], and the portals of heaven will be opened for you.
translation:
  language: zh_hans
  text: 你们要怀着盼望，因为从前你们在邪恶和患难中蒙羞[a]；如今你们必如天上的光一样照耀，必发光，并被看见；天上的门户也必为你们敞开[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“因邪恶和苦难而蒙羞”。原文简洁地把蒙羞与邪恶、患难相连，却没有说明“邪恶”是指恶人、恶行，还是恶劣的处境。
    reason: lexical_alternative
  - marker: b
    text: “天上的门户”是宇宙性的意象。原文没有说明门户敞开后，是有福分从中降下，还是义人将由此进入天上。
    reason: cultural_and_theological_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: 你们要怀着盼望
  rationale: 这是对复数对象的直接劝勉；此译法在现代汉语中自然、庄重，并保留命令语气。
- source_word: ቀዳሚ
  choice: 从前
  rationale: 清楚表达过去与如今之间的时间对照。
- source_word: ኃሠርክሙ
  choice: 你们……蒙羞
  rationale: 保留被动受辱及日后获得昭雪的意味，不把它收窄为单纯的内心羞愧。
- source_word: በእኩይ ወበምራኅ
  choice: 在邪恶和患难中
  rationale: 两个带介词的词组可表示原因、媒介或处境；用“在……中”避免断定邪恶究竟指恶人、恶行还是恶劣境遇。
- source_word: ትበርሁ
  choice: 照耀／发光
  rationale: 原文重复同一动词。汉语先以“照耀”配合比喻，再以“发光”重申，既保留重复的强调，也使行文自然。
- source_word: ብርሃነ ሰማይ
  choice: 天上的光
  rationale: 直接保留属格关系和宇宙性的光明意象。
- source_word: ትትረአዩ
  choice: 被人看见
  rationale: 保留可能的被动含义；“人”在这里是不定泛指，并不限定看见者是谁。
- source_word: ኆኅተ ሰማይ
  choice: 天上的门户
  rationale: ኆኅት 的基本意象是门、门口或门户；“门户”也符合《以诺一书》的宇宙结构意象，避免误译为“窗户”。
- source_word: ይትረኀዉ ለክሙ
  choice: 必为你们敞开
  rationale: 保留被动表达以及“为你们”的受益含义，同时不明说开启者是谁。
theological_decisions:
- issue: 天上门户敞开的具体含义
  choice: 保留“天上的门户必为你们敞开”的意象
  alternative: 解释为福分从天倾下，或义人将进入天上
  rationale: 原文只说明门户将为他们开启，并未说明有什么从中降下，也未明确说他们将由此升入天上；直译可保留末世昭雪与天上通达的张力。
- issue: “邪恶”与蒙羞的关系
  choice: 译为“在邪恶和患难中蒙羞”
  alternative: 译为“因恶行和苦难蒙羞”或“被恶人和患难羞辱”
  rationale: 原文介词结构没有明确邪恶是施事、原因还是所处环境，也没有明说是他们自己的恶行，因此不作神学或道德归因。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“从前／如今”的转折、光明动词的重复，以及末句未加解释的天上门户意象；避免宗派化措辞和超出原文的施事者说明。
