base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/010.yaml
  text: 'And now I know this mystery: that many sinners will alter the word of righteousness and pervert it[a], and speak evil words and lie, and they will devise great fabrications[d][c][b], and they will write books concerning their own words.'
translation:
  language: zh_hans
  text: 现在我知道这个奥秘：许多罪人将篡改公义之言，并将它歪曲[a]；他们要说邪恶的话，撒谎，捏造重大的谎言[b]，并就自己的言论写书。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处原文读法较难；也可译作“他们偏离正道”，即仍以“许多罪人”为主语。
    reason: alternative_reading
  - marker: b
    text: 直译可作“造出重大的造物（或作品）”。该表达也可指重大的发明、创作或捏造；在此处关于恶言和谎言的语境中，译作“重大的谎言”较为合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: አአምር
  choice: 我知道
  rationale: 该动词表示“知道、明白”；与“现在”连用时，现代汉语用“我知道”自然简洁，也不额外限定体貌。
- source_word: ምሥጢር
  choice: 奥秘
  rationale: 在启示文学语境中，“奥秘”既表达隐藏之事，也暗示其如今被揭示，比一般的“秘密”更合适。
- source_word: ነገረ ርትዕ
  choice: 公义之言
  rationale: ነገር 可指言语、事情或信息；与 ርትዕ 组合时，译作“公义之言”既保留紧凑的属格结构，也不把它过早解释成某一种特定教义。
- source_word: ይመይጡ
  choice: 将篡改
  rationale: 按近期校勘所确认的主动复数句法，此词以“许多罪人”为主语，以“公义之言”为宾语，意为改动、歪曲；“篡改”准确传达蓄意改变的负面含义。
- source_word: የዐልዉ
  choice: 使它偏离正道
  rationale: 此处读法困难；结合前面的宾语“公义之言”和后续关于恶言、谎言的语境，译为对该言语的进一步歪曲较为连贯，同时以脚注保留“罪人自己偏离正道”的可能。
- source_word: ነገራተ እኩያተ
  choice: 邪恶的话
  rationale: 后接“撒谎”及写书，语境突出言语内容，因此译作“邪恶的话”比泛指“恶事”更贴切。
- source_word: ይሐስዉ
  choice: 撒谎
  rationale: 直接、自然地保留原文尖锐的道德指控。
- source_word: ይፈጥሩ ፍጥረተ ዐቢየተ
  choice: 编造惊人的虚构之事
  rationale: 词根本义是形成、制作；在恶言、谎言和著书的负面语境中，“编造……虚构之事”体现人为捏造。“惊人的”保留 ዐቢየተ“大的、重大的”之强调，却避免不自然的“大虚构”。
- source_word: መጻሕፍተ ይጽሐፉ ዲበ ነገራቲሆሙ
  choice: 把自己的言论写成书
  rationale: 该句指他们将自己的话语形成书面作品。此译自然地表达书籍与其虚假言论的从属关系，并避免把写书本身说成邪恶。
theological_decisions:
- issue: 公义之言是被忽视，还是被罪人主动改动
  choice: 许多罪人将篡改公义之言
  alternative: 公义之言将被忽视
  rationale: 现有句法证据支持主动复数动词，“许多罪人”是主语，“公义之言”是宾语；因此不采用被动的“被忽视”。
- issue: 困难动词 የዐልዉ 是继续描述对信息的歪曲，还是描述罪人偏离正道
  choice: 使它偏离正道
  alternative: 他们自己偏离正道
  rationale: 上下文可支持“歪曲它”的连贯理解，但词形及传本有不确定性，因此正文采用语境上顺畅的译法，并在脚注中明确保留另一种读法。
- issue: 末句是否谴责写书本身
  choice: 谴责的是把罪人自己的虚假言论写成书
  alternative: 笼统谴责著书行为
  rationale: 句法把书籍与前述恶言、谎言及他们自己的言论相连，不能据此推断写书本身受到谴责。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“篡改”“公义之言”“奥秘”保留启示文学的严肃语体；调整并简化脚注次序，正文中的[a]、[b]均有对应注释。
