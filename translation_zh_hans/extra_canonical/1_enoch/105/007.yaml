review_pass:
  verdict: revise
  source_fidelity: 需修订。吉兹语中“你们这些罪人”是“说”的主语；引语内首个否定动词为第二人称复数主动式，应译为“你们不查究/搜寻”，不宜在正文改作“我们不受查究”。第二个否定动词及末句的“写”均为第三人称复数；末句的ሀለዉ为助动词，表达持续进行，不是“看哪”。
  naturalness: 修订后使用“查究”“记录”保持庄重、清楚的现代书面语。引语中的“你们／他们”虽在语境上存在指代未明之处，但应按原文保留，避免以被动式消除原有的人称差异。
  terminology: “罪人”“罪”“查究”“记录”均合适；“查究”保留搜寻、调查及司法追究的可能含义。“记录”保留书写册录的意象，且不擅自确定记录者身份。
  issues:
  - severity: high
    issue: 引语首个否定动词被译作“我们不受查究”。
    rationale: 原文ኢትኅሥሡ为第二人称复数主动式，直接对应“你们不查究／不搜寻”，不是第一人称复数被动式。脚注可以说明语境及传承句法有难处，但正文不应以意译改变明确词形。
  - severity: high
    issue: 引语第二分句与末句被统一改为被动句。
    rationale: 原文的“写”在两处均为第三人称复数，末句由ሀለዉ构成进行性表达。被动译法虽然流畅，却抹去了原文未说明的第三人称行动者及引语中“你们／他们”的人称对照。
  - severity: medium
    issue: 脚注a将第二人称主动式作为可选理解，而把被动式置于正文。
    rationale: 应反转处理：第二人称主动式是词形所示的译法；可在注中说明其所指对象及与“我们的罪”并列所产生的语境困难。
  - severity: medium
    issue: 脚注b称原文“直陈‘他们正在记录……’”，但正文采用被动而未充分保留该语法信息。
    rationale: 应使正文与脚注一致，直接译出未指明身份的“他们”。
  revised_text: 因为你们这些罪人说：“你们不查究，他们也不记录我们一切的罪。”——他们每天都在记录你们一切的罪。
  revised_footnotes:
  - marker: a
    text: “你们不查究”按原文第二人称复数主动式直译；“查究”也可译作“搜寻”或“调查”。引语中“你们”的所指未明，而下句说“我们的罪”，使传承句法显得突兀。
    reason: textual_variant
  - marker: b
    text: “他们”对应原文第三人称复数，未说明是谁；末句的表达带有“正在记录”的持续意味。
    reason: grammatical_clarity
  revision_rationale: 修订依原文显明的人称和语态：外层为“你们这些罪人说”，引语先用第二人称复数“你们不查究”，继以第三人称复数“他们不记录我们的罪”，末句则以第三人称复数进行式反驳“他们每天都在记录你们一切的罪”。这保留了文本中指代不明及人称转换的困难，而不以被动式或补足行动者来消除它。
