base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/007.yaml
  text: And because you sinners say[a], ‘We are not sought out[d][c][b], and all our sins are not written down’—all your sins are being written down every day.
translation:
  language: zh_hans
  text: 因为你们这些罪人说：“我们不受查究[a]，我们一切的罪也没有被记录下来。”然而，你们一切的罪每天都在被记录[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话的传本文本在句法上较难。“不受查究”也可按动词的第二人称复数形式理解为“你们不查究”；“查究”也可译作“搜寻”或“调查”。
    reason: textual_variant
  - marker: b
    text: 原文直陈“他们正在记录你们一切的罪”，却没有说明“他们”是谁；正文用被动句保留这种未指明的状态。
    reason: grammatical_clarity
lexical_decisions:
- source_word: ወእስመ
  choice: 因为
  rationale: 引出下文对罪人说法的反驳，保留原文的因果衔接。
- source_word: ትብሉ፡ አንትሙ፡ ኃጥኣን
  choice: 你们这些罪人说
  rationale: 将第二人称复数代词和“罪人”理解为“说”的主语及同位语，符合吉兹语显明的句法。
- source_word: ኢትኅሥሡ
  choice: 我们不受查究
  rationale: 按上下文采用被动、司法性的理解；“查究”既包含搜寻，也包含调查追究，适合审判语境。引入“我们”是为使引语与随后原文的“我们的罪”在现代汉语中自然连贯。
- source_word: ኢይጽሐፉ፡ ኵሎ፡ ኃጢአትነ
  choice: 我们一切的罪也没有被记录下来
  rationale: 保留写下罪行的司法和天上册录意象；被动表达不擅自指明记录者。
- source_word: ይጽሐፉ፡ ሀለዉ
  choice: 都在被记录
  rationale: 把未完成式与ሀለዉ构成的迂说结构译为持续进行，而不把ሀለዉ误作“看哪”；汉语被动式保留原文未明说记录者这一点。
- source_word: በኵሉ፡ ዕለት
  choice: 每天
  rationale: 自然表达逐日、持续发生的含义。
theological_decisions:
- issue: 罪行记录的性质
  choice: 保留罪行持续被写下的启示文学意象
  alternative: 将其泛化为上帝知道人的罪
  rationale: 原文重复使用“写/记录”，审判语境支持册录意象；译文不进一步规定记录者或记录机制。
- issue: 查究者与记录者的身份
  choice: 用被动句保持不明确
  alternative: 明确译为上帝或天使查究并记录
  rationale: 本节没有明说行动者，不应加入特定天使论或审判机制。
- issue: 引语中首个否定动词的人称与语态
  choice: 正文按罪人自称未受查究来译
  alternative: 按词形译作“你们不查究”
  rationale: 传本文本可引发句法争议；正文选择与“我们的罪”及整句反驳关系更连贯的被动理解，同时用脚注保留较直译的另一可能。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“查究”保留司法意味，“记录下来”保留罪行被写入册中的具体意象；以“然而”明确罪人的说法与随后宣告之间的反转。
