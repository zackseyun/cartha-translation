review_pass:
  verdict: revise
  source_fidelity: 草稿将引语中的首个否定动词处理为“我们不受查究”，并将两处第三人称复数主动“写/记录”改为被动，未能反映现有吉兹语传本文字的显性人称与语态。按所给文本，‘你们这些罪人’是‘说’的主语；引语内首动词可直译为第二人称复数‘你们不查究’，随后为第三人称复数‘他们不记录我们一切的罪’。末句亦是未指明主体的第三人称复数持续动作。
  naturalness: 修订文本保留原句刻意而略显突兀的人称转换，但以破折号和‘可是’清楚标示反驳。‘查究’和‘记录’均为现代庄重书面语，适合审判与册录语境。
  terminology: ‘罪人’、‘罪’和‘记录’均恰当。以‘他们’对应未明指的第三人称复数，不擅自认定为上帝、天使或其他主体；脚注说明其所指未明。
  issues:
  - severity: high
    issue: 引语首句改作‘我们不受查究’
    rationale: 所给吉兹语的否定动词为第二人称复数形式；将其改成第一人称复数被动，改变了传本文字的人称和语态。人称转换虽造成语义上的困难，仍应在正文保留，并以脚注解释。
  - severity: high
    issue: 两处第三人称复数主动‘写/记录’均改为被动
    rationale: 原文的‘他们不记录’及‘他们正在记录’均保留未指明的第三人称复数行动者。汉语可用‘他们’，并以脚注避免擅自确定其身份。
  - severity: medium
    issue: 脚注a将第二人称主动理解仅列作备选，正文却采用被动解释
    rationale: 在目前所给传本文字及审校记录下，第二人称复数主动是应优先保留的直译；可承认整段人称转换和指代关系存在困难。
  revised_text: 因为你们这些罪人说：“你们不查究[a]，他们也不记录我们一切的罪[b]。”可是，他们每天都在记录你们一切的罪[b]。
  revised_footnotes:
