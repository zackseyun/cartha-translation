    reason: textual_variant
  - marker: b
    text: 原文两处均用未指明的第三人称复数：“他们不记录／他们正在记录”。经文没有说明“他们”是谁，因此译文不将其确定为上帝、天使或其他主体。
    reason: grammatical_clarity
  revision_rationale: 修订以所给吉兹语词形为优先：将‘你们这些罪人’置于引语外，保留引语中第二人称复数的‘你们不查究’，并将两处第三人称复数的记录动作译为‘他们……记录’。这会保留传本文字中不寻常的人称转换，而非以流畅化重构消除它。脚注仅说明语法和指代困难，不添加神学性行动者。
