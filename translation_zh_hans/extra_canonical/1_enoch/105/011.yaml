base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/011.yaml
  text: And when they write all the words truthfully in their languages[a], and neither alter nor omit anything from my words[d][c][b], but write down everything truthfully—all the former things—
translation:
  language: zh_hans
  text: 当他们用自己的语言[a]如实写下一切话语，既不更改，也不从我的话语中删去任何内容，而是把一切都如实写下——先前的一切[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在他们的舌头上”；这里按书写语境译作“用自己的语言”。
    reason: lexical_alternative
  - marker: b
    text: 原文末语十分简略，直译近于“先前的一切”；按书写语境也可理解为“先前所写的一切”。
    reason: alternative_reading
lexical_decisions:
- source_word: ወሶበሰ፡
  choice: 当……时／当……（以“当”引出）
  rationale: 该词引出时间从句，并带有承接意味。汉语以“当”自然保留未完结的从句结构；本节原文自身似为悬接句，因此不擅自补出主句。
- source_word: ኵሎ፡ ነገራተ፡
  choice: 这一切话语
  rationale: ነገር 可指事情、言语或话语；后文“从我的话语中”以及反复出现的书写动词表明，此处主要指需要传写的话语。原词组没有第一人称后缀，故不译作“我的一切话语”。
- source_word: ይጽሐፉ፡
  choice: 他们……写下
  rationale: 此处是主动形式，以隐含的复数主语“他们”承接后面的“不更改”和“不删去”，避免误译为被动。
- source_word: በርትዕ፡
  choice: 如实
  rationale: 该词兼有正直、正确、准确之意；“如实”既体现真确，也符合忠实传写的语境。
- source_word: ዲበ፡ ልሳናቲሆሙ፡
  choice: 用自己的语言
  rationale: 字面为“在／于他们的舌头上”；在书写与传递文本的语境中，“语言”是自然含义。“用”符合现代汉语表达，同时由脚注保留字面意象。
- source_word: ወኢይዌልጡ፡
  choice: 既不更改
  rationale: 该动词表示改变，也可能含歪曲之意；“更改”在文本传抄语境中准确而不过度强化。
- source_word: ወኢየሐጽጹ፡ እምነገራቲየ፡
  choice: 也不从我的话语中删去任何内容
  rationale: 动词具有削减、减去之意；“删去任何内容”自然呈现抄写中不得减损原话的要求，并明确保留第一人称后缀“我的”。
- source_word: አላ፡ ኵሎ፡ በርትዕ፡ ይጽሐፉ፡
  choice: 而是把一切都如实写下
  rationale: 保留原文由否定转为肯定的对照，也保留对“如实写下”的重复强调。
- source_word: ኵሎ፡ ዘቀዳሚ፡
  choice: 先前的一切事
  rationale: 原短语压缩，直指“先前的／在先的一切”。不补入原文没有明说的“所写”，从而保留其开放性。
theological_decisions:
- issue: 本节所强调的忠实性质
  choice: 主要理解为对以不同语言传写以诺话语的忠实要求，包括不得更改或删减。
  alternative: 也可较宽泛地理解为道德意义上的如实表达，或把“舌头”理解为口头宣讲。
  rationale: 反复出现的“写”以及“更改”“删去”等词共同支持文本传写的语境；但“如实”仍保留了真诚、正直的语义色彩。
- issue: 末尾短语“ኵሎ፡ ዘቀዳሚ፡”的范围
  choice: 译作“先前的一切事”，不明确补出“所写”。
  alternative: 可按上下文理解为“先前所写的一切”。
  rationale: 原文只明确说“先前的／在先的一切”，语法高度压缩。直译式表达避免把上下文推断提升为原文明说的内容。
- issue: 句子未完结的结构
  choice: 保留由“当”引出的悬接结构，并以破折号收尾。
  alternative: 可从相邻经节补足主句，使之成为完整陈述。
  rationale: 所提供的本节原文以时间从句起始，却没有明确主句；单节翻译不宜凭推测补足，以保留文本边界及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“话语”比单纯的“话”更适合经卷传写语境；“如实写下”兼顾准确性与道德上的真实。保留原文的重复、末尾压缩表达及未完结句法，不替原文消除歧义。
