base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/008.yaml
  text: And now[a], I show you that light and darkness, day and night[b], see all your sins.
translation:
  language: zh_hans
  text: 如今，我向你们显明[a]：光明与黑暗、白昼与黑夜，都看见你们一切的罪。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我向你们显明”也可译作“我使你们知道”。原文的连接词在这里最可能引出所显示的内容；也有人将它理解为“因为”。
    reason: translation_ambiguity
  - marker: b
    text: 本句把光明与黑暗、白昼与黑夜描写为看见一切罪的见证者；这也可能含有“无论公开或隐秘、无论何时”的意味。
    reason: cultural_note
lexical_decisions:
- source_word: ወይ እዜኒ
  choice: 现在
  rationale: 作为承接上文的时间与话语标记，译作“现在”简洁自然；句首语气由中文行文体现。
- source_word: አነ አርእየክሙ
  choice: 我指给你们看
  rationale: 保留使役性的视觉意象，即“使你们看见、向你们显示”，比抽象的“告诉你们”更贴近启示文学语境。
- source_word: እስመ
  choice: ：
  rationale: 在“指给你们看”之后理解为引出宾语内容的连接成分，相当于“即/就是”，中文用冒号自然表达，同时不强行加入因果关系。
- source_word: ብርሃን ወጽልመት
  choice: 光明与黑暗
  rationale: 直译这一对相反概念，保留涵盖一切情境的对举以及宇宙见证者的拟人意象。
- source_word: ዕለት ወሌሊት
  choice: 白昼与黑夜
  rationale: 保留第二组对举；“白昼”与“黑夜”节奏匀称，语体庄重而易懂。
- source_word: ይሬእዩ
  choice: 都看见
  rationale: 按复数主语译为“看见”，保留原文把光暗、昼夜描写成能观看的见证者这一张力；“都”也使多个并列主语与谓语关系清楚。
- source_word: ኵሎ ኃጢአትክሙ
  choice: 你们所有的罪
  rationale: 保留第二人称复数及全称意义；“罪”是现代宗教汉语中自然、直接的表达，不把具体过犯弱化为笼统的“不好行为”。
theological_decisions:
- issue: 光明、黑暗、白昼、黑夜是主动见证者，还是仅表示公开与隐秘、随时随地
  choice: 保留其作为语法主语“看见”众罪的拟人化宇宙见证意象
  alternative: 意译为“你们无论公开或暗中、白昼或夜间所犯的罪，都显露无遗”
  rationale: 原文中“看见”的主语最自然地是前面的四个并列名词。启示文学常以受造界作见证；正文不应把这一意象化约为纯粹的时间或环境状语。脚注提示其可能蕴含的整体性意义。
- issue: እስመ 在本句中表示宾语从句还是因果说明
  choice: 按宾语内容理解，以冒号引出所显示的事
  alternative: 译作“因为”，形成“我指给你们看，因为……”
  rationale: 它紧随“我指给你们看”之后，在感知、显示类动词后可作陈述性连接词。中文冒号既清楚连接内容，也避免使用不自然的“看见……这一事实”。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“光明与黑暗、白昼与黑夜”保留原文平行对举；“都看见”使拟人化主语清楚。正文避免解释性扩写，把语法歧义及意象的可能含义放入脚注。
