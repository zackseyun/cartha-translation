  yaml_path: translation/extra_canonical/1_enoch/105/001.yaml
  text: The glory of the Great One[b][a], and your names shall be written before the glory of the Great One.
translation:
  language: zh_hans
  text: 那位伟大者的荣耀[a][b]，你们的名字必被写在那位伟大者的荣耀面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文首尾两次出现“那位伟大者的荣耀”。这里保留重复，以呈现这项应许庄严的语气。
    reason: lexical_alternative
  - marker: b
    text: 旧译或作：“他的荣耀是伟大的；你们的名字必写在那位伟大者的荣耀面前。”但原文更宜理解为领属结构：“那位伟大者的荣耀”。
    reason: previous_rendering
lexical_decisions:
- source_word: ስብሐቲሁ
  choice: 他的荣耀／荣耀
  rationale: 该词可指荣耀、赞美或光辉；本节说名字写在其“面前”，语境更指向神圣的威荣与临在，因此译作“荣耀”。在格尔兹语领属结构中，代词成分不另译为“他的”，而自然地合译为“那位伟大者的荣耀”。
- source_word: ለዐቢይ
  choice: 那位伟大者的
  rationale: 介词与实体化形容词在此构成领属关系，并把“伟大者”用作敬称。“那位伟大者”既保留称号性质，也比单说“伟大者”更符合现代汉语。
- source_word: ወእስማቲከሙ
  choice: 你们的名字
  rationale: 原文的“名字”和第二人称后缀均为复数所指，故保留群体性称呼。中文“你们的名字”已自然表达这一点。
- source_word: ይጸሐፍ
  choice: 必写
  rationale: 该动词意为“写”。此处带有应许和保证的语气，用“必写”表达将来性与确定性，同时不额外引入“刻写”等含义。
- source_word: በቅድመ
  choice: 在……面前
  rationale: 该介词表示“在前面”或“在……临在中”。“在……面前”简洁庄重，并保留空间性与临在意味。
theological_decisions:
- issue: 重复出现的 ስብሐቲሁ 是否译为“荣耀”“赞美”或“光辉”
  choice: 荣耀
  alternative: 赞美；光辉
  rationale: 名字被写在其“面前”的图景更适合指神圣威荣或临在，而非单指赞美行为；“荣耀”也能保留启示文学意象的开放性。
- issue: 句首短语应理解为领属结构还是判断句
  choice: 领属结构：“那位伟大者的荣耀”
  alternative: 判断句：“他的荣耀是伟大的”
  rationale: ስብሐቲሁ ለዐቢይ 是带预指代词的格尔兹语领属结构，后面的同一短语也支持一致译法。译文保留其名词短语形态，不把它改写为判断句。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那位伟大者”作为神圣称号，避免加入特定宗派称谓。句首保留原文未展开的名词短语及其与下句的松散衔接；这可能承接上文，不擅自补入谓语。所有脚注标记均置于相关短语之后。
