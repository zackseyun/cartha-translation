base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/003.yaml
  text: And as for your cry[a], cry out, and he will make it appear to you[e][d][c][b]; for all your affliction will be sought out from the angels and from all those who helped those who plundered you.
translation:
  language: zh_hans
  text: 至于你们的呼喊，你们要呼喊；他必向你们显明[a]。因为你们所受的一切苦难，必向天使[b]和所有帮助那些抢掠你们之人的人追查[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他必向你们显明”也可译作“他必让你们看见”或“这事必向你们显明”。原文在本节没有明确指出“他”是谁。
    reason: lexical_alternative
  - marker: b
    text: “天使”也可译作“使者”；此词在某些语境中也可指首领或统治者。这里按《以诺一书》通常的用法译为“天使”。
    reason: alternative_reading
  - marker: c
    text: 末句的句法不够明确。也可理解为“向所有协助抢掠你们的人追查”，或把“那些抢掠你们的人”看作对前面一组人的进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: ወጽራኅ / ጽርኁ
  choice: 呼喊／只管呼喊
  rationale: 原词具有大声呼求、喊出的语气；译作“呼喊”保留迫切感，不擅自增添“求审判”等原文未明说的内容。
- source_word: ወያስተርኢ ለክሙ
  choice: 他就会向你们显明
  rationale: 该动词带有使某事被看见、显现的使役意义；“显明”既自然，也保留启示性的语气。
- source_word: ኵሉ ምንዳቤክሙ
  choice: 你们所受的一切苦难
  rationale: 名词可指困苦、患难或受压迫的处境；“所受的一切苦难”涵盖较广，不把含义局限于某一种迫害。
- source_word: መላእክት
  choice: 天使
  rationale: 该词通常指天上的使者；《以诺一书》的启示与审判语境支持“天使”。虽有“使者”乃至“首领”的可能，此处不因地上抢掠的语境而改写其通常含义。
- source_word: ይትኃሠሥ
  choice: 追查出来
  rationale: 原词含搜寻、查究之意，并带被动或反身色彩；“追查出来”保留审查苦难及其责任来源的司法意味。
- source_word: እለ አርደእዎሙ
  choice: 帮助……之人的人
  rationale: አርደእዎሙ 来自“帮助、协助”的词根，并非“压迫”；宾语复数后缀与后续“那些抢掠你们的人”相衔接。
- source_word: ለእለ የሀይዱክሙ
  choice: 那些抢掠你们之人
  rationale: 该动词指抢夺、掳掠或夺去，不是“使人走迷”；“抢掠”准确保留其暴力与财物受夺的含义。
theological_decisions:
- issue: መላእክት 应理解为天上的天使、一般使者，还是统治者
  choice: 天使
  alternative: 使者；首领／统治者
  rationale: 此词最常见的含义是“天使／使者”，而《以诺一书》的宇宙性审判背景尤其支持天上存在的理解。脚注保留其他词义可能，避免把语境上的推断写成定论。
- issue: 显明动作的主语是否明确
  choice: 正文用“他”，但不指明其身份
  alternative: 译成无明确施事者的“这事就会向你们显明”
  rationale: 动词形式支持第三人称阳性单数施事者，但本节未明确说明“他”是谁；因此保留代词而不补作“上帝”“主”或“天使”。
- issue: 末句中“帮助者”与“抢掠者”的关系
  choice: 帮助那些抢掠你们的人
  alternative: 所有帮助他们的人，也就是那些抢掠你们的人；所有协助抢掠你们的人
  rationale: 原文的复数宾语后缀及后续关系结构使句法较为拗口。正文采用最直接的层级关系，同时用脚注承认同位或合并理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“只管呼喊”传达命令与鼓励的力度；“追查出来”保留末世审判式的查究语气。未补入“求审判”、上帝的名号或其他原文没有明说的神学解释。
