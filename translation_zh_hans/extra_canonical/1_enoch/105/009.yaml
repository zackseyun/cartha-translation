base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/009.yaml
  text: Do not be wicked in your hearts[a], and do not lie, and do not alter the word of uprightness, and do not declare false the word of the Great Holy One, and do not account your idols as anything; for all your falsehood and all your uncleanness are not for righteousness[f][e][d][c][b], but for great sin.
translation:
  language: zh_hans
  text: 你们心里不可走迷[a]，不要说谎，也不要篡改正直之言[b]；不可断言那伟大而神圣的话是虚假的[c]，也不要以为你们的偶像算得了什么[d]。因为你们一切的虚假和一切的污秽，都不属于公义，而属于大罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “走迷”也可译作“犯错”或“偏离正道”。原文着重于人在心里偏离、走错；不必直接具体化为“行邪恶”。
    reason: lexical_alternative
  - marker: b
    text: “篡改”也可译作“歪曲”或“败坏”；“正直之言”也可能理解为“公义的话”或“正确的事”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“那神圣而伟大的话”。这里的动词是使动形式，意思是“宣称为假”或“斥为虚假”，不同于前面的“说谎”。若将两个形容词理解为指向一位人物，也可能译作“至大圣者的话”，但原文未明确标示这一属格关系。
    reason: source_ambiguity
  - marker: d
    text: 这一短语较难确定。原文动词有“计算、认为、看作”的意思，也可译作“不要看重你们的偶像”；正文表达的是不要把偶像当成算得了什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትርሥዑ፡ በልብክሙ
  choice: 你们心里不要行邪恶
  rationale: 保留“在你们心里”的内在道德指向，并以自然的现代汉语表达偏离正道、作恶的含义；脚注保留“不要走迷”的可能性。
- source_word: ወኢተሐስዉ
  choice: 不要说谎
  rationale: 基本词干表示说假话；“不要说谎”直接、清楚，并与后面的使动形形成区别。
- source_word: ወአትሚጥዋ፡ ለነገረ፡ ርትዕ
  choice: 不要篡改正直之言
  rationale: 动词含改变、扭曲或败坏之意；“篡改”兼顾具体的改动与负面的歪曲。“正直”保留伦理含义，并与末句的“公义”区分。
- source_word: ወኢታሐስውዋ፡ ለነገረ፡ ቅዱስ፡ ዐቢይ
  choice: 不可断言至大圣者的话是虚假的
  rationale: 此处使动形不同于前面的普通“说谎”，有“宣称为假、斥为虚假”之意；译文明确警告不可把圣者的话断为虚假。
- source_word: ወኢትሕስብዋ፡ ለጣዖትክሙ
  choice: 不要以为你们的偶像算得了什么
  rationale: 保留动词“计算、看作、认为”的认知性含义，也表达偶像毫无真实地位；避免增添原文未明说的“信靠”或“敬拜”。
- source_word: ኵሉ፡ ሐሰትክሙ፡ ወኵሉ፡ ርኩስነክሙ
  choice: 你们一切的虚假和一切的污秽
  rationale: 保留两个带总括性的名词及重复的“一切”，呈现庄重的谴责语气。
- source_word: አኮነት፡ ... ለጽድቅ፡ አላ፡ ለኃጢአት፡ ዐቢይ
  choice: 都不属于公义，而属于大罪
  rationale: 贴近原文“不为公义、却为大罪”的归属或趋向对比，不把关系过度解释为结果或因果。
theological_decisions:
- issue: 偶像一语是否应译成“不要信靠你们的偶像”
  choice: 不要以为你们的偶像算得了什么
  alternative: 不要信靠你们的偶像；不要看重你们的偶像
  rationale: 原文动词主要表达估量、认定或看作；采用认知性的译法，既显出偶像的虚妄，又不把“信靠”这一较完整的神学概念加入正文。
- issue: ነገረ፡ ቅዱስ፡ ዐቢይ 的句法归属
  choice: 至大圣者的话
  alternative: 伟大而神圣的话；至圣至大的话语
  rationale: 上下文可将两个形容词理解为修饰省略的“那一位”，因而形成“至大圣者的话”；但也可能直接修饰“话”，故在脚注中保留此真实歧义。
- issue: 末句是道德归属还是结果陈述
  choice: 不属于公义，而属于大罪
  alternative: 不能导向公义，反而导向大罪
  rationale: 原文介词结构本身较为简练，既可表达归属，也可暗示趋向；正文保留较形式对应的归属对比，避免把隐含关系明确化为结果论断。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留连续禁令的劝诫节奏，同时用分号和句号避免汉语中过度冗长；“至大圣者”“正直之言”“公义”“大罪”等词保持经文体的尊严，但不使用生僻古语。
