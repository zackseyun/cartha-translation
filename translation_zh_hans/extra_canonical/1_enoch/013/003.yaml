base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/003.yaml
  text: Then I went and spoke to them all together[a], and they all feared, and fear and trembling seized them.
translation:
  language: zh_hans
  text: 于是我去向聚集在一起的众人说话；他们全都害怕[a]，恐惧和战栗攫住了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连续使用恐惧词语：他们先“害怕”，随后“恐惧和战栗”又攫住他们。
    reason: 说明原文刻意叠加恐惧用语，避免读者误以为中文重复。
lexical_decisions:
- source_word: እሜሃ
  choice: 于是
  rationale: 表达叙事中紧接前文的时间与顺序推进，不额外限定具体时点。
- source_word: ሐዊርየ
  choice: 我去
  rationale: 按表示行走、前往的第一人称动词直译，并保持自然叙事语气。
- source_word: ነገርክዎሙ
  choice: 对他们说了话
  rationale: 保留“说、告诉”的基本义及复数受词；此处不擅自补出话语内容。
- source_word: ለኵሎሙ ኅቡረ
  choice: 对聚在一起的他们众人
  rationale: 同时保留“所有人”和“共同聚集”的意义，避免把ኅቡረ仅处理成含义不清的“共同地”。
- source_word: ወእሙንቱ ኵሎሙ
  choice: 他们全都
  rationale: 保留原文再次强调全体的重复，不因汉语简洁而删减。
- source_word: ፈርሁ
  choice: 害怕起来
  rationale: 呈现简单的恐惧动词，并以“起来”自然表达他们听后进入恐惧状态。
- source_word: ፍርሃት
  choice: 恐惧
  rationale: 保留与前一恐惧动词的词义复现，同时使汉语表达庄重自然。
- source_word: ነሥአሙ
  choice: 攫住了他们
  rationale: 体现该动词“抓住、占据”的强烈动态，而非弱化为普通的情绪发生。
- source_word: ወረዓድ
  choice: 和战栗
  rationale: 保留因恐惧而身体发抖的意象，并与“恐惧”组成递进式并列。
theological_decisions:
- issue: 守望者反应的强度与性质
  choice: 保留“害怕起来”以及“恐惧和战栗攫住了他们”的叠加表达
  alternative: 压缩为“他们非常害怕”
  rationale: 原文先用恐惧动词，继而以“恐惧”和“战栗”两个名词加强反应；保留这种累积可忠实呈现审判语境中的强烈惊惧，而不作教义化解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“攫住”保留原文情绪仿佛外力抓住人的力度；分号清楚区分以诺的行动与众人的反应。
