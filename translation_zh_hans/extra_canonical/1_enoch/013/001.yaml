base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/001.yaml
  text: 'And Enoch went and said to Azazel[a], “You shall have no peace; a great sentence has gone out against you: you will be bound.”'
translation:
  language: zh_hans
  text: 以诺前去，对阿撒泻勒说：“你必不得平安；一项重大的判决[a]已经针对你发出：你必被捆绑。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “判决”也可译作“审判”或“裁定”。原词具有司法含义，并引出随后所说的捆绑刑罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃሊፎ
  choice: 前去
  rationale: 该动词表示以诺在开口前有所行动或移动。“前去”自然地保留叙事次序，又不额外指定方向。
- source_word: ይቤሎ
  choice: 对……说
  rationale: 采用普通而直接的言说表达，不增添原文没有明确表示的宣告语气。
- source_word: አዛዝኤል
  choice: 阿撒兹勒
  rationale: 按专名音译，并采用现代中文中较易辨识的形式。
- source_word: ኢይከውከ ሰላም
  choice: 你必不得平安
  rationale: 保留审判宣告中否定平安、福祉和有利结局的庄严语气。
- source_word: ዓቢይ ኵነኔ
  choice: 严厉的判决
  rationale: ኵነኔ具有司法性，可指判决、审判或裁定；结合随后捆绑的刑罚后果，“严厉的判决”在现代汉语中自然地表达ዓቢይ的加强作用。
- source_word: ወጽአ ላዕሌከ
  choice: 已经发出，临到你身上
  rationale: 既保留判决“发出”的动态意象，也表达其针对阿撒兹勒、落在他身上的含义。
- source_word: ይእስርከ
  choice: 你必被捆绑起来
  rationale: 清楚呈现捆绑或囚禁的惩罚图景；采用被动句，与判决临到受审者的上下文相合。
theological_decisions:
- issue: 审判宣告中“平安”公式的力度
  choice: 你必不得平安
  alternative: “平安必不属于你”或“你不会有平安”
  rationale: 这不是一般问候，而是对受定罪者否定福祉的审判宣告；所选译法保留启示文学的庄严力度，同时不引入后来的特定教义措辞。
- issue: ኵነኔ的法律含义
  choice: 判决
  alternative: “审判”或“裁定”
  rationale: 下文直接提到捆绑这一刑罚后果，因此“判决”较能体现已经作出的司法决定；但原词也容许较宽泛的“审判”，故在脚注中保留这一可能。
- issue: 末句施事者与句法关系
  choice: 你必被捆绑起来
  alternative: “要把你捆绑起来”或“为要捆绑你”
  rationale: 原句明确表达捆绑阿撒兹勒，却未必需要在中文中补出具体施事者。被动表达保留这一开放性，也自然承接已经发出的判决。
translation_notes:
  register: 采用庄严但通顺的现代标准汉语。“必不得平安”和“临到你身上”保留启示文学审判宣告的力度；避免古奥文言，也不补出原文未明确指明的捆绑施事者。
