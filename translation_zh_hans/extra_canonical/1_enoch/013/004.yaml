base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/004.yaml
  text: And they asked me to write for them a petition of remembrance[a], so that there might be forgiveness for them[c][b], and that I might bring it up
translation:
  language: zh_hans
  text: 他们请求我替他们写一份纪念性的祈求文[a]，使他们得蒙赦免，并把它呈上去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“纪念祷告”或“为求蒙记念而写的呈文”。原文短语兼有“记念”和“祈求”之意。
    reason: lexical_alternative
  - marker: b
    text: 也可译“把它带上去”。原文在本节末尾未明说宾语，汉译的“它”承接前述祈求文；该未完结的短语延续到下文。
    reason: textual_variant
lexical_decisions:
- source_word: ተስእሉኒ
  choice: 他们求我
  rationale: 该动词表示请求、恳求；“求我”比“问我”更符合守望者向以诺求助的语境，同时不过度加强语气。
- source_word: እጽሐፍ
  choice: 写
  rationale: 在请求结构中自然表达“让我写／要我写”，保留书面制作的明确含义。
- source_word: ተዝካረ ስእለት
  choice: 一份求情的纪念文
  rationale: ተዝካረ含纪念、使人记念之意，ስእለት指恳求或祈求。“求情的纪念文”兼顾两项语义，并体现这是一份拟呈交的书面请求。
- source_word: ይኩኖሙ ኅድገተ
  choice: 他们可以得到赦免
  rationale: ኅድገተ可指释放、宽免或赦免；在受审判者请求开释的语境中，“得到赦免”自然且不预断请求是否获准。
- source_word: አዕርግ
  choice: 我把它呈上去
  rationale: 此处为使役词干，意为使之上升、带上去或献上，而非单纯“我上去”。“呈上去”既保留向上递交的意象，也符合向天上呈交文书的语境。
theological_decisions:
- issue: 守望者所求文书的性质
  choice: 求情的纪念文
  alternative: 纪念祈祷／供记念的书面恳求
  rationale: 原短语同时包含“记念”和“恳求”，译文保留其天上法庭式的呈文色彩，但不把它限定为后世特定礼仪或宗派概念。
- issue: 赦免的确定性
  choice: 好使他们可以得到赦免
  alternative: 好使他们得到赦免
  rationale: 目的结构表达守望者的愿望而非神已经应允；“可以”保留结果尚未确定的张力。
- issue: 以诺的动作
  choice: 把它呈上去
  alternative: 上去／把它带上去
  rationale: 使役词形支持“使之上去、呈上去”；不采用“上去”，以免把及物动作误解为以诺本人升天。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“求情的纪念文”略带正式文书色彩，以对应天上呈诉的场景；句末补出汉语所需的宾语“它”，指前述文书。
