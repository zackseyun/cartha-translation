base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/002.yaml
  text: And no mercy or petition will be granted to you[a], because of the violence that you have taught[c][b], and because of all the works of blasphemy and violence and sin that you have shown to humankind.
translation:
  language: zh_hans
  text: 你必得不到怜悯，你的祈求也不会蒙应允[a]，因为你教人行强暴，又把一切亵渎、强暴和罪恶的事显给世人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据转写文本首词作“ሣሕት”，很可能是OCR误读；校勘应为“ሣህል”，意为“怜悯”或“宽宥”。因此这里不是“祈求、恳求”这一对近义词。
    reason: textual_variant
  - marker: b
    text: “显给”也可译作“揭示给”或“使……知道”；在上下文中，可能特指守望者把禁忌知识传给人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣህል（所据转写本误作 ሣሕት）
  choice: 怜悯
  rationale: 依最新校勘，转写本此处是OCR误读；原词应指“怜悯、宽宥”，而不是与下词近义的“祈求”。
- source_word: ስእለት
  choice: 祈求
  rationale: 表示恳切的请求或代求；“祈求”既自然，也保留本节宗教与审判语境。
- source_word: ኢይከውከ
  choice: 必得不到……也不会蒙应允
  rationale: 该否定未完成式与受益对象结合，表达怜悯不会临到、祈求不会生效；按两个并列名词分别作自然汉语表达。
- source_word: ዘመሀርከ
  choice: 你教人行
  rationale: 保留“教导”的核心含义，并以“行强暴”构成自然汉语，突出守望者把败坏传给人类。
- source_word: ግፍዐ / ወግፍዕ
  choice: 强暴
  rationale: 该词兼有暴力、欺压和不义之意；“强暴”适合审判语境，并保留两次出现的词语呼应。
- source_word: ምግባረ
  choice: ……的事
  rationale: 原义为行为、作为；现代汉语中以“一切……的事”承接后列罪名，比直译“一切行为”更自然。
- source_word: ጽርፈት
  choice: 亵渎
  rationale: 该词可指辱骂、冒犯或不敬；“亵渎”保留其宗教审判色彩，同时不把对象补明。
- source_word: ወሓጢአት
  choice: 罪恶
  rationale: 表达广义的罪与过犯；“罪恶”在并列指控中自然庄重。
- source_word: ዘአርአይከ
  choice: 显给
  rationale: 原动词可指使人看见、显示或揭示；正文采用较中性的“显给”，脚注保留“揭示、使……知道”的可能。
- source_word: ለሰብእ
  choice: 世人
  rationale: 所指为人类，并非特指男性；“世人”简洁、庄重且符合现代汉语。
theological_decisions:
- issue: 末句所指罪行的性质
  choice: 译作把亵渎、强暴和罪恶的事“显给世人”，并与前面的“教人”相连，呈现向人类传播败坏的含义。
  alternative: 也可理解为在世人面前展示或实行这些恶事，不一定专指传授隐秘知识。
  rationale: 上下文关注守望者向人类传授禁忌知识，但动词本身只要求“显示、使看见”，故正文保留较宽泛措辞，不把“显给”完全解释成“启示秘术”。
- issue: 怜悯与祈求被拒绝的关系
  choice: 分别译为“得不到怜悯”和“祈求不蒙应允”。
  alternative: 可较形式化地译为“怜悯或祈求都不会临到你”。
  rationale: 原文并列两个不同概念；按汉语习惯分别搭配动词，既保留区别，也清楚表达审判中宽宥与申诉均告无效。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。原文动词与代词为第二人称阳性单数，故用“你”，符合上下文对亚撒谢勒的直接宣告；不擅自改作复数“你们”。
