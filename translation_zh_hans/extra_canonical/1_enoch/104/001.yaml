base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/104/001.yaml
  text: I swear to you that in heaven the angels remember you for good before the glory of the Great One[a][b][c].
translation:
  language: zh_hans
  text: 我向你们起誓：在天上，众天使在那伟大者的荣耀面前，为着你们的益处而记念你们[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给吉兹语转录在“在……面前”之后中断；“那伟大者的荣耀”依据保存较完整的对应文本补出。
    reason: textual_variant
  - marker: b
    text: “为着你们的益处而记念你们”也可译作“以善意记念你们”。
    reason: alternative_reading
lexical_decisions:
- source_word: እምሕል፡ ለክሙ፡
  choice: 我向你们起誓
  rationale: 该短语是直接向复数听众说出的起誓公式；不译作“不要以为”，因为原文并非禁止式劝告。
- source_word: በሰማይ፡
  choice: 在天上
  rationale: 按其通常的地点义直译，修饰众天使的记念。
- source_word: ይዜከሩ፡ መላእክት፡
  choice: 众天使记念
  rationale: 动词为复数，主语明确是“天使”；“记念”既保留原词的记忆含义，也适合天上审判与蒙眷顾的语境，不擅自改成“写下”。
- source_word: በእንቲአክሙ፡ ለሠናይ፡
  choice: 记念你们，使你们得福
  rationale: 字面意义接近“为着你们、向着善处”。此译自然表达天使以有利、赐福的方式记念他们，同时脚注保留“以善意记念”的可能表达。
- source_word: በቅድመ፡
  choice: 在……面前
  rationale: 该词引出“在……面前”；所给吉兹语转录在此处中断，宾语依据保存更完整的对应文本和通行校勘补为“那伟大者的荣耀”。
theological_decisions:
- issue: 天上的记念是否应明确解释为司法记录
  choice: 保留“众天使记念你们”的具体意象，不增译为写入天上案卷
  alternative: 你们的名字已被记录在天上的审判册中
  rationale: 原文明确说天使“记念”，而非“书写”；上下文或可赋予司法色彩，但本节不应把这种推论写进正文。
- issue: “为善”所表达的结果
  choice: 使你们得福
  alternative: 以善意记念你们／记念你们的善行
  rationale: 原短语可表示有利于受众的记念，却未明确限定为记念其善行；正文采用自然而不狭窄的结果表达，脚注提示另一种译法。
- issue: “那伟大者”所指
  choice: 保留尊称“那伟大者”
  alternative: 上帝／至大者
  rationale: 不把启示文学中的神圣尊称替换成更具解释性的神名，以保留原有修辞和神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我向你们起誓”保留郑重宣告的语气；“记念”比口语化的“记得”更符合启示文学语域，又不把原文过度解释成书面记录。正文中的[a][b]与脚注完全对应。
