base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/008.yaml
  text: And I saw angels beyond number[a], thousands of thousands and ten thousand times ten thousand, surrounding that house; and Mikael and Rufael and Gabrʾel and Fanʾuel[b], and the holy angels who are above the heavens, were going in and coming out of that house.
translation:
  language: zh_hans
  text: 我看见无数的天使[a]，数以千计的千，数以万计的万，环绕着那座房屋；米卡埃尔、鲁法埃尔、加布埃尔、法努埃尔[b]，以及在诸天之上的圣天使，都在那座房屋里进进出出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “数以千计的千，数以万计的万”直译吉兹语的巨大数目公式，意指无法计数的天上群体；它保留了原文两组重复数词的结构。
    reason: cultural_note
  - marker: b
    text: 这些名字按本节吉兹语形式音译。较常见的中文译名分别是米迦勒、拉斐尔、加百列和法努伊勒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我又看见
  rationale: 保留异象叙事的承接语气；现代汉语以“又”自然表达句首连接词。
- source_word: መላእክተ
  choice: 天使
  rationale: 语境明确指天上的灵体，而非一般意义的使者。
- source_word: እለ፡ ኢይትኌለቍ
  choice: 无数的
  rationale: 准确表达“无法数算”，简洁自然，并与后面的巨大数字套语相衔接。
- source_word: አእላፈ፡ አእላፍ
  choice: 千千万万
  rationale: 对应“成千的成千”，以自然庄重的汉语保留重复累积的力量。
- source_word: ወትእልፊተ፡ ትእልፊት
  choice: 万万亿亿
  rationale: 源文为“一万乘一万”式的巨大数字套语；此译保留成对叠加的启示文学修辞，而不换成别处经文的固定措辞。
- source_word: የአውድዎ፡ ለውእቱ፡ ቤት
  choice: 环绕着那座房屋
  rationale: 呈现众天使围绕该建筑物的视觉场景。
- source_word: ቤት
  choice: 房屋
  rationale: 源词直指“房屋”；不解释为“宫殿”或“圣殿”，以免过度限定异象。
- source_word: ሚካኤል፡ ወሩፋኤል፡ ወገብርኤል፡ ወፋኑኤል
  choice: 米迦勒、鲁法勒、加布勒、法努勒
  rationale: 依吉兹语词形音译，同时采用便于现代汉语读者辨读的人名形式；其中非惯常形式以脚注说明。
- source_word: መላእክተ፡ ቅዱሳን
  choice: 圣天使
  rationale: 自然表达修饰结构，并保留这一群体的圣洁属性。
- source_word: እለ፡ መልዕልተ፡ ሰማያት
  choice: 那些在诸天之上的
  rationale: 保留源文的空间宇宙图景，不将其解释为某一特定层级的天。
- source_word: ይበውኡ፡ ወይወፅኡ
  choice: 进进出出
  rationale: 成对动词描绘持续或反复的出入行动；叠词形式是自然现代汉语。
theological_decisions:
- issue: 是否把巨大数字套语改写成其他圣经文本中更熟悉的固定表达
  choice: 千千万万，万万亿亿
  alternative: 千千，万万；千千万万，亿亿万万
  rationale: 紧贴吉兹语的两组重复数词，保留启示文学的夸张效果，同时避免倒用《但以理书》或《启示录》的传统汉译措辞。
- issue: 是否把“房屋”解释为宫殿或圣殿
  choice: 房屋
  alternative: 宫殿；圣殿；居所
  rationale: 源文只说“房屋”。即使异象中的建筑具有神圣居所或天庭功能，也不在正文中替作者作进一步界定。
- issue: “在诸天之上”的关系从句修饰对象
  choice: 修饰“圣天使”
  alternative: 修饰“那座房屋”
  rationale: 源文次序与关系代词最自然地把该短语连于“圣天使”；保持这一句法关系，避免把房屋明确定位在诸天之上。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“那座房屋”保持异象意象的具体性；“进进出出”自然呈现持续反复的行动。所有脚注标记均已置于正文相应位置。
