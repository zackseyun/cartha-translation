  - severity: high
    issue: 巨大数词译作“千千万万，万万亿亿”
    rationale: 这没有准确对应“千的千，万的万”的两重重复公式；尤其“万万亿亿”在现代汉语中可被理解为远超“一万乘一万”的数值，属于实质性失准。
  - severity: medium
    issue: 人名音译不完整：鲁法勒、加布勒、法努勒
    rationale: 这些形式省略了吉兹语名字中可辨识的元音和词尾，且“法努勒”尤其未充分反映 Fanʾuel。应采用较完整且可读的源语音译，并在注中说明常见汉译。
  - severity: low
    issue: “我又看见”添加“又”
    rationale: 句首连接词可以在汉语中译作“又”，但本节动词本身仅为“我看见”；为避免在孤立经节中增加未明说的重复含义，正文宜作“我看见”。
  revised_text: 我看见无数的天使[a]，数以千计的千，数以万计的万，环绕着那座房屋；米卡埃尔、鲁法埃尔、加布埃尔、法努埃尔[b]，以及在诸天之上的圣天使，都在那座房屋里进进出出。
