  to: 我看见无数的天使[a]，数以千计的千，数以万计的万，环绕着那座房屋；米卡埃尔、鲁法埃尔、加布埃尔、法努埃尔[b]，以及在诸天之上的圣天使，都在那座房屋里进进出出。
  rationale: 修正巨大数词公式，使其明确对应原文“千的千、万的万”，而不引入“万万亿亿”所暗示的错误数量级；补足人名音译以更忠实反映吉兹语形式。其余句法保留原文关系：“在诸天之上”修饰“圣天使”，而“进进出出”描绘其反复出入那座房屋。
