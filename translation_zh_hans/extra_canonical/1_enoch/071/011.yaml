base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/011.yaml
  text: And I fell on my face[a], and all my flesh melted away, and my spirit was transformed; and I cried out with a loud voice ... in the spirit of power[e][d][c][b], and I blessed and praised and exalted him.
translation:
  language: zh_hans
  text: 我便脸朝下倒伏在地[a]，全身的血肉都消融了；我的灵改变了[b]。我大声呼喊……[c]在大能之灵中，称颂、赞美并尊崇他[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“倒在我的脸上”，指脸朝下倒伏；原文没有明确说明这是主动俯伏，还是不由自主地倒下。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的灵被转化了”或“我的灵离去了”。这里的吉兹文动词含义不十分确定。
    reason: lexical_alternative
  - marker: c
    text: 本节在“我大声呼喊”之后似有缺文或文本损坏，故正文以省略号标示。
    reason: textual_variant
  - marker: d
    text: “在大能之灵中”也可译为“靠着大能之灵”或“借着大能之灵”。这句话既可能描述以诺当时内在的状态，也可能指使他得力发声的媒介。末尾三个动词在原文没有明示宾语；这里按上下文补出“他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወወደቁ በገጽየ
  choice: 我就俯伏在地
  rationale: 该短语具体描写脸朝下倒伏的姿态。“俯伏在地”是自然庄重的现代汉语，同时不强行判定这是主动敬拜还是因异象而倒下。
- source_word: ኵሉ ሥጋየ ተመስወ
  choice: 全身的血肉仿佛消融了
  rationale: 保留“血肉”的具象和人论色彩，并以“仿佛消融”传达异象中身体瓦解般的强烈感受，避免使读者误解为普通意义上的肉体液化。
- source_word: መንፈስየ ተወለጠ
  choice: 我的灵也改变了
  rationale: 原动词确切含义有困难。“改变”比“转化”更克制，既表达内在变化，又不把变化的性质解释得过细。
- source_word: ጸራኅኩ በቃል ዓቢይ
  choice: 我大声呼喊
  rationale: 这是该闪语式表达在现代汉语中的自然对应，传达声音洪亮，而不采用生硬的“以大声音”。
- source_word: በመንፈሰ ኃይል
  choice: 带着大能的灵
  rationale: 保留“灵”与“大能”的结合及其歧义；中文仍可理解为以诺内在的状态，也可能指使他说话的能力或媒介。
- source_word: ወባረኩ ወሰብሕኩ ወአልዓልኩ
  choice: 又称颂、赞美、尊崇他
  rationale: 用三个并列敬拜动词保留原文的递进与礼仪语气；“他”是汉语为表达自然所补出的宾语，原文并无显式宾语。
theological_decisions:
- issue: 异象中“血肉”的人论意味
  choice: 译作“全身的血肉仿佛消融了”
  alternative: 译作“我的整个身体都瘫软了”
  rationale: 原文明确使用“肉/血肉”一词；保留这一意象更能呈现人在压倒性异象面前的身体性反应，同时“仿佛”避免把异象语言过度实体化。
- issue: 描述“我的灵”的疑难动词
  choice: 译作“我的灵也改变了”并加注
  alternative: 译作“我的灵被转化了”或“我的灵离去了”
  rationale: “改变”保留变化的事实，却不预断这是属灵转化、情绪改变还是灵魂离体。
- issue: “带着大能的灵”所指的主体或媒介
  choice: 在正文保留模糊表达
  alternative: 明确译为“靠着大能之灵”或“我的灵充满力量”
  rationale: 原介词结构可能描述以诺的内在状态，也可能表示使他发声的能力或媒介；不应在翻译中替读者解决这一神学和句法张力。
- issue: 末尾三个敬拜动词的宾语
  choice: 正文补出“他”
  alternative: 不补宾语：“又称颂、赞美、尊崇”
  rationale: 吉兹文未明说宾语，但上下文显然指向受颂赞者；现代汉语中的“尊崇”通常需要宾语，补出“他”可使句子自然，并不引入特定身份解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。以“俯伏在地”“大声呼喊”避免翻译腔；以“血肉”“灵”“称颂、赞美、尊崇”保留启示文学与敬拜语言的力度。正文中的省略号严格反映现存见证在此处的明显缺口，而非修辞停顿。
