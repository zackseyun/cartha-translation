base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/010.yaml
  text: And with them was the Head of Days[a], and his head was like white and pure wool[c][b], and his garment cannot be described.
translation:
  language: zh_hans
  text: 与他们同在的是“岁月之首”[a]。他的头如洁白纯净的羊毛；他的衣服无法形容[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亘古常在者”。传统译名反映了这个称号与《但以理书》的可能呼应；这里的吉兹语较直译为“岁月之首”。
    reason: lexical_alternative
  - marker: b
    text: “无法形容”也可理解为“无法解释”或“无法阐明”。这里可能是说，那衣服超出寻常言语所能表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስሌሆሙ
  choice: 与他们同在
  rationale: 按介词 ምስለ 的通常含义译作“与……同在”，保留陪伴、同处的关系，不改译为“在他们中间”。
- source_word: ርእሰ መዋዕል
  choice: 岁月之首
  rationale: 直译该称号，以“岁月”表达 መዋዕል 的复数和时间意味，并以“之首”保留 ርእሰ 的本义；不直接套用受《但以理书》传统影响的称号。
- source_word: ፀምር
  choice: 羊毛
  rationale: ከመ 引出比喻，对比对象自然是羊毛，而不是头发；“羊毛”也保留具体的视觉意象。
- source_word: ጻዕዳ ወንጹሕ
  choice: 洁白纯净
  rationale: 分别保留“白”和“纯净”的双重修饰，同时使现代汉语表达自然庄重。
- source_word: ልብሱ
  choice: 他的衣服
  rationale: 采用不限定具体款式的普通称谓，避免无根据地具体化为“长袍”。
- source_word: ዘኢይትረጐም
  choice: 无法形容
  rationale: 该词可涉及解释、阐释或转述；在异象语境中，译作“无法形容”最自然，同时以脚注保留“无法解释”的可能性。
theological_decisions:
- issue: 是否将 ርእሰ መዋዕል 译为传统称号“亘古常在者”
  choice: 岁月之首
  alternative: 亘古常在者
  rationale: 正文优先忠实呈现吉兹语见证本身，不自动与《但以理书》7章或后来的译名协调；传统对应关系在脚注中说明。
- issue: 末句是描述不可言说，还是指不可解释
  choice: 无法形容
  alternative: 无法解释／阐明
  rationale: 异象中衣服的语境较支持“超出言语描述”，但原词的解释、阐释意味不应被抹去，因此列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“岁月之首”刻意保留陌生而崇高的称号形式；分为两句以避免连用多个“而”造成生硬。所有脚注标记均置于正文对应位置。
