base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/007.yaml
  text: And around it were the seraphim and the cherubim and the ophannim[b][a], and these are those who do not sleep and who keep watch over the throne of his glory.
translation:
  language: zh_hans
  text: 在它周围[b]有撒拉弗、基路伯和俄法宁[a]；这些都不睡觉，并守望着他荣耀的宝座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俄法宁”是一个天上群体名称的音译，其名称的本义与“轮”有关。
    reason: lexical_alternative
  - marker: b
    text: 原文有指向前文所述对象的“它”；若从较简略的表达，也可译作“周围有”。
    reason: previous_rendering
lexical_decisions:
- source_word: ወአውዶ
  choice: 在它周围有
  rationale: 保留原词中的第三人称阳性单数后缀“它”，并以自然汉语交代这些天上活物环绕前文所述对象的位置。
- source_word: ሱራፌን
  choice: 撒拉弗
  rationale: 采用传统音译，保留启示文学中这一类天上活物的专名性质，不解释为“燃烧者”。
- source_word: ኪሩቤን
  choice: 基路伯
  rationale: 采用现代中文宗教文献中通行的传统音译，保持其作为特定天上活物类别的含义。
- source_word: አፋኒን
  choice: 俄法宁
  rationale: 按名称音译，以维持与撒拉弗、基路伯并列的天上群体类别；其与“轮”有关的本义置于脚注说明。
- source_word: እሙንቱ
  choice: 他们就是那些
  rationale: 保留指示兼确认的强调作用，同时使后接关系分句的中文自然清楚。
- source_word: እለ ኢይነውሙ
  choice: 不睡觉
  rationale: 直接表达否定的“睡觉”，不擅自强化为“永不睡觉”，也不另加经文式措辞。
- source_word: የዐቅቡ
  choice: 守望
  rationale: 兼顾警醒注视与看守之意，适合宝座异象的语境。
- source_word: መንበረ ስብሐተ ዚአሁ
  choice: 他荣耀的宝座
  rationale: 保留“宝座—他的荣耀”的属格关系，不将其弱化为一般性的“华美宝座”。
theological_decisions:
- issue: 宝座异象中三类天上活物的名称
  choice: 将三者分别译作“撒拉弗、基路伯、俄法宁”
  alternative: 把“俄法宁”直译为“轮”，或将三者统称为天使
  rationale: 原文把三者作为彼此并列而有区别的群体列出；保留名称可避免抹平启示文学的具体异象，同时用脚注交代“俄法宁”与“轮”的词源联系。
- issue: 这些活物与荣耀宝座的关系
  choice: 译为“守望他荣耀宝座的”
  alternative: 译为“守卫他荣耀的宝座”
  rationale: “守望”保留原词兼有警醒察看与护守的语义张力，不把其职能单向限定为防御性的守卫。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留启示文学中的传统名称与“荣耀宝座”的凝练表达，同时避免生硬照搬外语语序。
