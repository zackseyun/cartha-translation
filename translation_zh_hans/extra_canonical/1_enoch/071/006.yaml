base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/006.yaml
  text: And my spirit saw the enclosure that surrounded that house of fire[a], and from its four sides were rivers full of living fire[d][c][b], and they surrounded that house.
translation:
  language: zh_hans
  text: 我的灵看见环绕那火的房屋的围界[a]，又看见从它四边而出的河流[c]，河中充满活火[b]；这些河流环绕着那房屋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “围界”所译的词与本节两次“环绕”同根，原文借重复突出房屋被包围的景象；也可译作“环形界域”或“围绕之物”，但原文未明确说是“墙”。
    reason: lexical_alternative
  - marker: b
    text: “活火”是对原文罕见表达的直译，可能指有生命的火、活跃的火，或极具生命力的火，并非普通火焰的常规说法。
    reason: lexical_alternative
  - marker: c
    text: “四边”所译的词也可指“四方”“四端”或“四角”；原文未必专指几何意义上的四个角。
    reason: alternative_reading
lexical_decisions:
- source_word: መንፈስየ
  choice: 我的灵
  rationale: 原文以“我的灵”为看见异象的主体；直译保留启示文学的感知方式，不改写为普通肉眼观看。
- source_word: አውዶ / ዘየአውዶ
  choice: 环绕……的围环
  rationale: 同根词一作名词、一作动词，强调包围与环绕。用“围环”避免添加原文没有明确表达的“墙”，同时尽量保留重复。
- source_word: ቤተ እሳት
  choice: 火之房屋
  rationale: 保留原文属格结构和突兀鲜明的异象意象；“火屋”虽简洁，却较易被理解为建筑名称。
- source_word: እምአርባዕቱ አጽናፊሁ
  choice: 从它四边
  rationale: 该词可指边界、尽头或方位；“四边”在建筑语境中自然，也不如“四角”那样过度具体。
- source_word: አፍላገ
  choice: 河流
  rationale: 复数形式指流动的水道；“河流”符合异象的宏大尺度。
- source_word: ምሉኣነ እሳተ ሕያው
  choice: 其中充满活火
  rationale: “活火”直译不寻常的原文表达，保留火具有生命、活力或强烈动态的可能含义，而不将其简化为“烈火”。
- source_word: የአውድዎ
  choice: 这些河流环绕着
  rationale: 末句再次使用环绕词根；明确主语为前述河流，使现代汉语连贯，并保留反复出现的包围意象。
theological_decisions:
- issue: 异象感知的性质
  choice: 我的灵看见
  alternative: 我在灵里看见；我的魂看见
  rationale: 原文明确以“灵”为感知主体。此译法保留异象性表达，不把它化约为普通视觉经验。
- issue: “活火”的性质
  choice: 活火
  alternative: 烈火；燃烧的火
  rationale: 原文的“活”可能表示有生命、活跃或充满生命力；保留其含混性，不对这一异象意象作教义化解释。
- issue: 河流与主句的句法关系
  choice: 又看见……河流
  alternative: 从它四边有河流
  rationale: “河流”在原文中具有宾格形态，可能作为“看见”的第二个宾语。正文依此处理，同时通过自然汉语补出“流出的”和“其中”，但不改变河流环绕房屋的核心图景。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“我的灵看见”“火之房屋”“活火”等启示文学的陌生感；用“围环”避免把未明说的建筑细节译成“墙”。依据格位线索，将“河流”处理为“看见”的第二宾语，并以分号清楚衔接末句。所有脚注标记均置于相关正文词语之后。
