base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/004.yaml
  text: And he showed me all the hidden things of the ends of heaven[a], and all the storehouses of the stars and the lights[c][b], from where they all come forth before the face of the holy ones.
translation:
  language: zh_hans
  text: 他让我看见天的尽头的一切隐藏之事，以及众星和众光体的一切库藏；它们全都从那里出来，来到众圣者面前。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众光体”也可译作“众光”。原文将它们与众星并列，可能泛指其他发光的天体。
    reason: lexical_alternative
  - marker: b
    text: “来到众圣者面前”保留原文“在众圣者面前”的空间表达，也可理解为“在众圣者面前出现”。原文没有明确说明“众圣者”是天使还是义人。
    reason: ambiguity
lexical_decisions:
- source_word: አርአየኒ
  choice: 让我看见
  rationale: 这是使役形式，直译为“使我看见”；“让我看见”既自然，也保留异象叙事中由对方展示的含义。
- source_word: ኵሎ ኅቡኣተ
  choice: 一切隐藏之事
  rationale: 保留末世异象中隐秘事物被揭示的语气，又不把范围过度限定为玄奥的“秘密”。
- source_word: አጽናፈ ሰማይ
  choice: 天涯
  rationale: 该词组描绘天的尽头或边界；“天涯”简洁自然，同时保留宇宙空间意象。
- source_word: መዛግብተ
  choice: 库藏
  rationale: 原词可指宝库、仓库或储藏处；“库藏”适合天上诸光体由其中出来的启示文学图景。
- source_word: ከዋክብት ወብርሃናት
  choice: 众星和众光体
  rationale: 原文区分星辰与较广义的发光天体；“光体”比单说“光”更明确指向天体，同时不把它们限定为某一种类。
- source_word: ኵሎሙ
  choice: 它们全都
  rationale: 明确保留原文复数总括代词的强调，表示前述星辰和光体无一例外。
- source_word: እምኀበ ወፅኡ
  choice: 从那里出来
  rationale: 表达运动的来源；现代汉语自然，也保留诸天体从库藏中出行的宇宙图景。
- source_word: ለገጸ ቅዱሳን
  choice: 来到众圣者面前
  rationale: 保留“面前”这一闪语式空间表达，并用“来到”衔接运动方向；“众圣者”不预先判定其专指天使还是义人。
theological_decisions:
- issue: “众圣者”的身份
  choice: 众圣者
  alternative: 众天使；圣徒；分别为圣者
  rationale: 在以诺传统中，此称谓可指天上的圣洁者，有时也可指义人。此处语境虽较可能指天上存在，原文本身却未进一步限定，因此保留较宽泛的称呼。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留启示文学的宇宙意象及“众圣者”身份上的真实歧义。所有脚注标记均置于正文相关句末。
