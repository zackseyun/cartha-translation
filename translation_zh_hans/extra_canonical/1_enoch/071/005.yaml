  rationale: 修订仅改善现代标准汉语的自然度与脚注锚点覆盖范围：“天上的天”保留原文的重复式天界称谓；“雹石砌成的建筑物”避免同根重复，并保持异象中由冰雹/冰石构成建筑的奇异意象。开头仍以“被遮藏”谨慎表达校勘资料所提示的隐藏/遮蔽语义，不把异象性质或升天方式教义化。
