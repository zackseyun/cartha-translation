  source_fidelity: 译文保留了“我的灵”、天界位置、光的中心、由雹（冰雹）之石构成的物体，以及石中活火之舌的基本意象。对开头动词采用“被遮藏”是审慎的，避免将其释义为普通的“被提”。但“诸天之天”在现代汉语中略显生硬；“天上的天”同样保留原文的叠加式崇高称谓，且更符合汉语圣经语体。
  naturalness: 原文总体庄重可读，但“用冰雹之石筑成的建筑”存在“筑成—建筑”的同根重复，“冰雹之石”也不如“雹石”自然。“在那光的中央”和“由雹石砌成的建筑物”更流畅，同时不减弱原文陌生的异象意象。
  terminology: “灵”“天上的天”“活火”均适合庄重的经文语体。“舌焰”可保留火舌的形象；不应把它泛化为普通“火焰”。脚注应同时说明开头动词的可译范围及“筑成之物”的句法不确定性。
