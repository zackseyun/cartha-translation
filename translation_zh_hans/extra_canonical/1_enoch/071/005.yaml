base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/005.yaml
  text: And my spirit was covered in the heaven of heavens[a], and I saw there, in the midst of that light, something built of stones of hail[c][b], and in the midst of those stones were tongues of living fire.
translation:
  language: zh_hans
  text: 我的灵被遮藏在天上的天[a]；我在那里看见，在那光的中央，有一座由雹石砌成的建筑物[b]；在那些石头中间，有活火的舌焰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被遮藏”也可译为“被隐藏”或“被遮蔽”。原文明确说“我的灵”，却没有说明这是否涉及以诺的肉身升天，还是灵里的异象经历。
    reason: lexical_and_theological_ambiguity
  - marker: b
    text: 这一句的埃塞俄比亚文句法较难。“建筑物”也可译作“筑成之物”；“雹石”亦可理解为“冰雹之石”或“冰石”。
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: ከበቶ፡ መንፈስየ
  choice: 我的灵被遮藏
  rationale: 按最新校勘所指出的 k-b-t“隐藏、遮蔽”词根理解，并保留被动形式；“遮藏”兼顾隐藏与覆盖的语义，不将其泛化为普通的“被提”。
- source_word: ውስተ፡ ሰማየ፡ ሰማያት
  choice: 在诸天之天
  rationale: 保留闪语式叠加表达及介词所示的位置关系，不直接化约为“最高天”。
- source_word: ማእከለ፡ ዝኩ፡ ብርሃን
  choice: 在那光中
  rationale: 保留指示词和对象位于光中的空间意象，同时采用自然简洁的现代汉语。
- source_word: ከመ፡ ቦቱ፡ ዘይትነደቅ
  choice: 有一座……筑成的建筑
  rationale: 原句句法较难，但显然涉及被建造之物；译作“建筑”比不自然的“某个被建造的东西”更通顺，同时以脚注说明不确定性。
- source_word: እምእብነ፡ አስሐትያ
  choice: 用冰雹之石
  rationale: 保留原文具体而奇异的末世异象，不擅自改成宝石或一般冰块。
- source_word: ልሳናተ፡ እሳት፡ ሕያው
  choice: 活火的舌焰
  rationale: “舌焰”自然呈现火舌形态，“活火”保留原文赋予火焰的鲜活、能动质感。
theological_decisions:
- issue: 以诺升入天界的性质
  choice: 我的灵被遮藏在诸天之天
  alternative: 我的灵被提到诸天之天
  rationale: 原文明确以“我的灵”为主语；译文既不改成以诺肉身升天，也不将经历缩减为单纯的心理活动，并依词根保留“遮藏”的独特说法。
- issue: 光中所见之物的性质
  choice: 一座……建筑
  alternative: 某个筑成之物
  rationale: 上下文支持建筑或构造物，但原句有文本和句法困难；正文采用可读译法，脚注保留不确定性，不进一步判定其为宫殿、房屋或圣殿。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。“诸天之天”刻意保留原文的崇高习语；“冰雹之石”和“活火的舌焰”保留异象语言的陌生感，不作理性化改写。
