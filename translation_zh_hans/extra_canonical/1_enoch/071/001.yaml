base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/001.yaml
  text: 'And after this it happened: my spirit was taken up[a], and it ascended into the heavens; and I saw the sons of the holy angels walking upon a flame of fire, and their garments were white[d][c][b], and their faces shone like snow.'
translation:
  language: zh_hans
  text: 此后，我的灵被提起[a]，升入诸天；我看见圣天使的众子[b]行走在火焰之上。他们的衣服洁白[c]，面容明亮如雪[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被提起”也可译作“被举起”或“被带走”；这里指异象中的迁移。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“圣天使的众子”。这一称呼很不寻常，也可能泛指与圣天使相关的天使性存在；正文保留原有表达。
    reason: lexical_alternative
  - marker: c
    text: 有些文本在“洁白”之后另有一个存疑的括注词，可理解为“他们的披风”。因其语序和文本状态不确定，正文未强行补入。
    reason: textual_variant
  - marker: d
    text: “雪”所译的词也可指冰雹；这里的比喻强调耀眼的洁白与明亮。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: 此后
  rationale: 作为异象叙事的承接语，简洁自然，并保留事件的先后次序。
- source_word: ትትከበት መንፈስየ
  choice: 我的灵被提起
  rationale: 保留原文近似被动的异象迁移含义，不将其弱化为内在感受。
- source_word: ተዐርገ ውስተ ሰማያት
  choice: 升入诸天
  rationale: 保留“天”的复数观念，也与启示文学的庄重语体相称。
- source_word: ለውሉዶሙ ለመላእክት ቅዱሳን
  choice: 圣天使的众子
  rationale: 原文的亲属表达虽然不寻常，却不宜直接归并为“圣天使”；“众子”兼顾复数与庄重语体。
- source_word: ይከይዱ ዲበ ላህበ እሳት
  choice: 行走在火焰之上
  rationale: 保留具体的行走图景、介词“在……之上”以及原文单数“火焰”。
- source_word: አልባሶሙ ጻዓዳ
  choice: 他们的衣服洁白
  rationale: “衣服”自然且不额外限定为礼服或长袍；“洁白”符合异象描写的庄重感。
- source_word: '[ወዐጸፎሙ]'
  choice: 正文不单独译出
  rationale: 该括注词形可理解为“他们的披风”，但在现有语序中形成残缺附加成分，且文本本身标示存疑，故以脚注透明说明而不强行补足。
- source_word: ብሩሃን ገጾሙ ከመ በረድ
  choice: 面容明亮如雪
  rationale: “明亮”直接表达ብሩሃን的光辉含义；此处በረድ按洁白明亮的比喻译作“雪”，同时在脚注保留“冰雹”的词义可能。
theological_decisions:
- issue: “圣天使的众子”的身份
  choice: 保留原文的亲属性表达“圣天使的众子”
  alternative: 圣天使；属天的后裔
  rationale: 原文措辞虽不寻常，却并非不可理解；不应为消除神学张力而将其协调成“圣天使”。
- issue: 灵被提起与主动升天的关系
  choice: 先译“被提起”，再译“升入诸天”
  alternative: 我的灵被带到天上
  rationale: 保留原文先被动迁移、继而上升的两个相连动作，不预先判定施动者或异象机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留启示文学中的“诸天”“被提起”等表达。句法略作汉语化处理，但不消解“圣天使的众子”这一真实歧义，也不把存疑的“披风”词形强行纳入正文。
