base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/003.yaml
  text: And the angel Mika'el[a], one of the chief angels, took hold of my right hand and raised me up, and brought me out to all the hidden things; and he showed me all the hidden things of mercy[c][b], and he showed me all the hidden things of righteousness.
translation:
  language: zh_hans
  text: 天使米迦勒，就是众天使中的一位首领[a]，握住我的右手，把我举起来，带我出来，到一切隐秘之事那里[b]；他向我显明一切关乎怜悯的隐秘之事，也向我显明一切关乎公义的隐秘之事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众天使中的一位首领”直译可作“众天使的首领之一”；也可译作“天使长”，但原文未必使用一个固定的技术性位阶称号。
    reason: lexical_alternative
  - marker: b
    text: “隐秘之事”也可译作“秘密”。原文在本节反复使用表示隐藏、隐蔽之事的同一词语，正文保留了这种重复。
    reason: lexical_alternative
  - marker: c
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ፡ ሚካኤል
  choice: 天使米迦勒
  rationale: መልአከ 在此明确指天上的使者；人名按现代中文圣经传统译作“米迦勒”，既易辨认，也不改变其语义。
- source_word: ፩እምአርእስተ፡ መላእክት
  choice: 众天使中的一位首领
  rationale: 原文直指“天使的首领／为首者之一”。此译保留等级含义，却不贸然采用已技术化的“天使长”。
- source_word: አኃዘኒ፡ እዴየ፡ ዘየማን
  choice: 拉住我的右手
  rationale: 动词表示抓住、握住；“拉住”自然地传达具体动作，ዘየማን 明确限定为右手。
- source_word: አንሥአኒ
  choice: 把我扶起来
  rationale: 原词有举起、使起来之意；结合拉住右手的动作，“扶起来”是自然中文，同时不额外断定这是升天或复活。
- source_word: አውፅአኒ
  choice: 带我出来
  rationale: 该词为“出去”的使役形式，表示使以诺出去；“带我出来”保留移动过程。
- source_word: ኀበ፡ ኵሉ፡ ኅቡአት
  choice: 到了所有隐秘之事那里
  rationale: ኅቡአት 指隐藏、隐蔽的事物；译作“隐秘之事”既保留启示文学色彩，也便于在本节三次重复，以再现原文的平行结构。
- source_word: ኅቡአተ፡ ምሕረት
  choice: 一切关乎怜悯的隐秘之事
  rationale: 构造关系把隐秘之事与怜悯相连。“关乎怜悯”在中文中比生硬的“怜悯的隐秘之事”自然，同时不增添“宝藏”等原文未明说的意象。
- source_word: ኅቡአተ፡ ጽድቅ
  choice: 一切关乎公义的隐秘之事
  rationale: ጽድቅ 可涵盖公义、正义；此处与怜悯并列，正文采用传统且范围较宽的“公义”，并在脚注保留“正义”的可能。
theological_decisions:
- issue: 天使位阶是否采用技术性称谓“天使长”
  choice: 众天使中的一位首领
  alternative: 众天使长中的一位；天使中为首的一位
  rationale: 吉兹语措辞较直白地表达“天使的首领之一”，未必要求后来固定化的位阶术语；按意义翻译可避免过度确定。
- issue: ጽድቅ 译作“公义”还是“正义”
  choice: 公义
  alternative: 正义
  rationale: 两者都在该词的语义范围内。与“怜悯”并列并置于启示文学语境时，“公义”较能兼顾道德正直与公正审判；脚注保留“正义”。
- issue: “把我扶起来”是否指超自然升举
  choice: 不在译文中限定其性质
  alternative: 把我举起来；使我升起
  rationale: 原动词本身表示举起或使起来，但本节没有充分说明动作的神学性质；采用具体而中性的中文，避免将其解释为升天或复活。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文连续的“拉住—扶起—带出—显明”动作链，以及“隐秘之事”的刻意重复和平行句式。避免用过度技术化的“天使长”，也不把“隐秘之事”解释性扩写为“宝藏”或特定奥秘。
