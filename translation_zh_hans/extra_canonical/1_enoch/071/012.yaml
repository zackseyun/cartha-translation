base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/012.yaml
  text: And those blessings that went out from my mouth became acceptable before that Head of Days[a][b][c].
translation:
  language: zh_hans
  text: 那些从我口中发出的祝福，在那位“岁月之首”面前蒙了悦纳[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那位‘岁月之首’面前成了可喜悦的。”这里的词也可表示“令人喜悦”或“受到欣然接纳”。
    reason: lexical_alternative
  - marker: b
    text: “岁月之首”是此处吉兹语所用的称号。这里保留本段独特的措辞，不将它直接改成《但以理书》中较为人熟悉的称号“亘古常在者”。
    reason: cross_reference
lexical_decisions:
- source_word: በረከት
  choice: 祝福
  rationale: 该词指祝福或祝福之言；上下文“从我口中发出”已清楚表明其言语性质。原文的指示词、关系词及相关动词均为复数，因此译作“那些……祝福”。
- source_word: ወፅኣ እምነ አፉየ
  choice: 从我口中发出
  rationale: 保留原文具体而富有异象色彩的表达，不简化为“我所说的”。
- source_word: ሥሙረተ
  choice: 蒙了悦纳
  rationale: 表达这些祝福获得认可、被欣然接纳的意思，同时保留“成为／得到悦纳”的谓语力度，避免仅译成主观情绪上的“使……喜悦”。
- source_word: ቅድመ
  choice: 在……面前
  rationale: 自然表达原文的空间及宫廷性关系，也保留置身尊贵者临在中的意象。
- source_word: ዝኩ ርእሰ መዋዕል
  choice: 那位“岁月之首”
  rationale: “那位”反映指示词ዝኩ；“岁月之首”按吉兹语称号本身翻译，既保持《以诺一书》的独特措辞，又不默默套用《但以理书》中更熟悉的称号。加引号标明这是专有称号。
theological_decisions:
- issue: 神圣称号ርእሰ መዋዕል的译法
  choice: 岁月之首
  alternative: 亘古常在者；日子之首
  rationale: 从吉兹语现有文本直接翻译，保留“首”与“岁月／日子”的构词意象，不与《但以理书》的传统译名强行协调。“岁月”在现代汉语中比“日子”更自然地表达长久年代，同时仍保留称号的独特性。
- issue: 祝福为单数还是复数
  choice: 那些祝福
  alternative: 那祝福
  rationale: 尽管名词形式本身可能造成旧译分歧，但指示词、关系词以及两个相关动词均为复数，故正文应明确译为复数。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“从我口中发出”保留异象文学的具体意象；“蒙了悦纳”自然传达获准、受纳之义。“岁月之首”以引号标示特殊称号，并避免与其他经文传统过度协调。
