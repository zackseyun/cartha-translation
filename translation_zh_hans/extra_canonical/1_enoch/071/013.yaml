base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/013.yaml
  text: And that Head of Days came with Michael and Raphael and Gabriel and Phanuel[c][b][a], and thousands and ten thousands of angels who have no number.
translation:
  language: zh_hans
  text: 那位“众日之首”[a]来了；与他同来的有米迦勒、拉斐尔、加百列和法努耳[b]，以及成千上万、数目无可计算的天使。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众日之首”直译自吉兹语称号，也常依照《但以理书》的传统措辞译作“亘古常在者”或“亘古者”。这里保留原文“首”与“日子”的意象。
    reason: lexical_alternative
  - marker: b
    text: 这些名字按现代中文通行形式音译；所据吉兹语的语音形式约为米卡埃尔、鲁法埃尔、加布尔埃尔和法努埃尔。
    reason: cultural_note
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: 众日之首
  rationale: 按吉兹语“首／头”与“日子”的构词直译其称号性意象；“众日”比生硬的“日子之首”更合乎现代汉语，同时避免直接套用《但以理书》传统译语而造成过度协调。
- source_word: መጽአ
  choice: 来了
  rationale: 采用普通的移动动词，保持异象叙事的推进，不额外赋予“降临”等神学色彩。
- source_word: ምስለ
  choice: 与他同来的有
  rationale: 明确表达陪同关系，并使随后的人名和天使群体在现代汉语中衔接自然。
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: 米迦勒、拉斐尔、加百列和法努耳
  rationale: 采用现代中文读者较易识别且通行的音译；“法努耳”仍紧贴所据吉兹语名称的语音形式。
- source_word: አእላፍ ወትእልፊተ
  choice: 成千上万
  rationale: 保留“千”与“万”递进并列所表达的庞大数量，在现代汉语中自然凝练；下文“数目无可计算”进一步保留其启示文学式的不可胜数。
- source_word: መላእክት
  choice: 天使
  rationale: 在天上异象及四位具名天使的语境中，“天使”比泛称“使者”更准确自然。
- source_word: እለ አልቦሙ ኍልቈ
  choice: 数目无可计算
  rationale: 贴近原文“没有数目”的强烈表达，同时避免中文“没有数目”可能造成的误解。
theological_decisions:
- issue: 神圣称号 ርእሰ መዋዕል 的译法
  choice: 众日之首
  alternative: 亘古常在者／亘古者
  rationale: 原文在此明确使用“首”与“日子”构成的称号。译作“众日之首”保留其独特意象及与《但以理书》传统称号之间的张力，不把两者未经说明地等同。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。分号呈现“那位称号人物来到”与随行者名单之间的层次；避免古奥文言，也不以熟悉的《但以理书》术语取代吉兹语本身的独特称号。
