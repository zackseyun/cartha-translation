base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/009.yaml
  text: And there came out from that house Mikael and Rufael and Gabr'el and Fanuel, and many holy angels without number.
translation:
  language: zh_hans
  text: 从那座房屋里出来的是米卡埃尔、鲁法埃尔、加布尔埃尔和法努埃尔[a]，以及许多不计其数的圣天使。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些名字按吉兹语形式音译；传统汉语圣经译名通常作“米迦勒、拉斐尔、加百列、法内力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወወፅኡ
  choice: 出来的，有
  rationale: 该复数动词表示从某处出去或出来；结合后置的多个主语，译为“出来的，有”既保留叙事方向，也符合现代汉语表达。
- source_word: እምኔ ውእቱ ቤት
  choice: 从那座殿里
  rationale: እምኔ表示来源，ውእቱ指向前文已提及的特定处所，ቤት可指房屋、居所或殿宇；本段天上异象的语境适合译作“那座殿”，但词义本身也容许“房屋”。
- source_word: ሚካኤል；ሩፋኤል；ገብርኤል；ፋኑኤል
  choice: 米卡埃尔、鲁法埃尔、加布尔埃尔、法努埃尔
  rationale: 依次按照吉兹语形式音译，不直接替换为汉语圣经传统中较熟悉的米迦勒、拉斐尔、加百列和法内利。
- source_word: ብዙኃን ቅዱሳን መላእክት
  choice: 许多……圣天使
  rationale: ብዙኃን表示“许多”，ቅዱሳን在此直接修饰መላእክት；“圣天使”清楚保留其神圣、分别为圣的含义。
- source_word: እለ አልቦሙ ኍልቈ
  choice: 不可胜数的
  rationale: 原文关系从句直译近于“他们没有数目”；“不可胜数”以自然而庄重的汉语表达无法计数之意。
theological_decisions:
- issue: 天使语境中ቅዱሳን的处理
  choice: 圣天使
  alternative: 圣者般的天使；那些圣洁的天使
  rationale: 此处该词直接限定“天使”，译作“圣天使”最简洁清楚，也不把它转化为后世教会语境中的“圣徒”。
- issue: ቤት在天上异象中的所指
  choice: 殿
  alternative: 房屋；居所
  rationale: 保留该词可泛指房屋或居所的事实，同时依据前文天上建筑的异象语境采用较庄重的“殿”，不进一步断定其特定礼仪或神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“出来的，有……”承接原文先述动作、后列主语的结构；人名坚持源语导向的音译，并以脚注交代传统译名。
