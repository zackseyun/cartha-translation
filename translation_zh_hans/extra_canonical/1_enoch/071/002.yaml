base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/002.yaml
  text: And I saw two rivers of fire[a], and the light of that fire shone like hyacinth[b], and I fell on my face before the Lord of Spirits.
translation:
  language: zh_hans
  text: 我看见两条火河；那火的光辉[b]如风信子石[a]一般闪耀。我就俯伏在万灵之主面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风信子石”指古代一种宝石，传统上也音译作“雅斤石”；其所对应的现代矿物并不确定。
    reason: lexical_alternative
  - marker: b
    text: 原文“那火的光辉”结构较紧缩，也可较宽泛地理解为“那火焰般的光芒”。
    reason: alternative_reading
lexical_decisions:
- source_word: ክልኤተ፡ አፍላገ፡ እሳት
  choice: 两条火河
  rationale: 直译为“两条火的河流”；“两条火河”在现代汉语中简洁自然，也保留异象中强烈的末世意象。
- source_word: ብርሃነ፡ ዝኩ፡ እሳት
  choice: 那火的光辉
  rationale: 保留指示词“那”和“火”的重复；“光辉”比单用“光”更能自然表达可见的明亮照耀，同时不把略显紧缩的原文结构解释得过死。
- source_word: ያክንት
  choice: 风信子石
  rationale: 该词传统上指一种称为 hyacinth/jacinth 的宝石，但确切矿物难以确定；正文采用传统宝石名称，脚注注明不确定性。
- source_word: ያበርህ
  choice: 闪耀
  rationale: 表达发光、照耀之意，并与宝石般的光辉相配，语言简洁而有画面感。
- source_word: ወወደቁ፡ በገጽየ
  choice: 我便面伏于地，倒在……面前
  rationale: 既保留“倒下”的动作，也明确“面伏于地”的身体姿态，避免仅译作抽象的敬拜行为。
- source_word: እግዚአ፡ መንፈሳት
  choice: 万灵之主
  rationale: 这是《以诺一书·比喻篇》中反复出现的神圣称号；“万灵之主”在汉语中庄重、凝练，并体现复数“诸灵”的总体含义。
theological_decisions:
- issue: 神圣称号 እግዚአ መንፈሳት 的译法
  choice: 万灵之主
  alternative: 诸灵之主／灵之主
  rationale: 将其作为反复出现的固定称号处理，而非普通描述。“万灵”是自然的集合性表达，但不进一步界定这些“灵”具体指天使、人灵或其他灵界存在。
- issue: 宝石比喻的具体所指
  choice: 如风信子石一般闪耀
  alternative: 如宝石一般闪耀／如雅斤石一般闪耀
  rationale: 原词很可能是传统所谓 hyacinth/jacinth 的宝石，但古代宝石名称与现代矿物分类并不完全对应。正文保留传统名称，脚注呈现词义范围，不武断指定颜色或现代矿种。
translation_notes:
  register: 采用现代、庄重而清晰的异象叙事语体。“两条火河”保留原文的震撼意象；“面伏于地，倒在……面前”保存具体姿态；神圣称号统一译为“万灵之主”。所有不确定之处均以脚注说明，而未在正文中擅自消解。
