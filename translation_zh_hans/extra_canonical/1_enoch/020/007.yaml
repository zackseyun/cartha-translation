base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/007.yaml
  text: Gabriʾel[a], one of the holy angels, who is over Paradise and the serpents and the cherubim.
translation:
  language: zh_hans
  text: 加百列，是圣天使中的一位，掌管乐园、蛇类[a]和基路伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“蛇类”的吉兹语词在文本传承中词义较难确定；传统上多理解为蛇或蛇形生灵，但仍存在一定不确定性。
    reason: 词汇异读与语义不确定性
lexical_decisions:
- source_word: ገብርኤል
  choice: 加百列
  rationale: 采用现代汉语圣经传统中通行的人名译法，既便于辨识，也对应吉兹语音译名。
- source_word: ፩እምነ
  choice: ……中的一位
  rationale: 直接表达从一个群体中选出一员的关系，符合现代汉语习惯。
- source_word: መላእክት ቅዱሳን
  choice: 圣天使
  rationale: 保留以诺传统中对天上使者的庄重称谓。
- source_word: ዘዲበ
  choice: 掌管
  rationale: 该结构表示对某领域负有权柄或职责；“掌管”比单纯的“在……之上”更自然，同时不额外说明权柄性质。
- source_word: ገነት
  choice: 乐园
  rationale: 此处在天使及其所辖领域的清单中，较可能指宇宙性的乐园境域，而非普通园子；“乐园”保留其启示文学色彩。
- source_word: አክይስት
  choice: 蛇类
  rationale: 该词在埃塞俄比亚文本传承中词义存在困难；传统语境多理解为蛇或蛇形存在。“蛇类”既保留传统理解，也避免断言其仅指普通动物。
- source_word: ኪሩቤን
  choice: 基路伯
  rationale: 采用现代汉语圣经传统中通行的音译称谓；原词为复数，但汉语类名本身通常不另加复数标记。
theological_decisions:
- issue: ገነት应译作普通园子，还是具有宇宙与神学意味的境域
  choice: 乐园
  alternative: 园子；伊甸园
  rationale: 在本章列举天使及其职责范围的语境中，该词最自然地指乐园境域。“乐园”保留启示文学的神学意涵，又不把它进一步限定为伊甸园。
- issue: አክይስት所指是否可确定为普通的蛇
  choice: 蛇类，并加注说明不确定性
  alternative: 蛇；蛇形生灵
  rationale: 文本传承中的词义并不完全确定。正文保留传统的蛇类解释，脚注则明确提示词汇困难，避免把存在争议的所指教义化或过度具体化。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“掌管”体现职责关系；“乐园”和“基路伯”保留启示文学语域。脚注标记已在正文“蛇类”之后呈现。
