  text: And these are the names of the holy angels who keep watch[a].
translation:
  language: zh_hans
  text: 这些是那些守望的圣天使的名字[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守望”也可译作“警醒”“警觉”或“看守”。在《以诺一书》的较广语境中，此语与天上的“守望者”这一观念有所重叠；但本节本身以动词描述这些天使，并未将其明确作为固定称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝንቱ
  choice: 这些是
  rationale: 连词与指示词构成列举或辨明身份的引介语；下文“名字”为复数，因此译作“这些是”最合句法。
- source_word: አስማቲሆሙ
  choice: 名字
  rationale: 原文直译为“他们的名字”；汉语以“那些……的名字”自然表达同一所属关系。
- source_word: ለእለ
  choice: 那些……的
  rationale: 该关系成分把“名字”与后面的描述相连；译为“那些……的”既保留关系，也符合现代汉语表达。
- source_word: ይተግሁ
  choice: 警醒
  rationale: 该动词表达清醒、警觉或守望。这里用“警醒”保留其描述性，不把它强化为固定称号“守望者”。
- source_word: ቅዱሳን
  choice: 圣
  rationale: 简洁保留“神圣、分别为圣”的含义，并符合汉语宗教文献的庄重语体。
- source_word: መላእክት
  choice: 天使
  rationale: 本段所指显然是天上的灵体，译作“天使”比泛称“使者”更准确。
theological_decisions:
- issue: 是否把警醒的天使译成固定称号“守望者”
  choice: 那些警醒的圣天使
  alternative: 圣天使守望者／那些守望的圣天使
  rationale: 原文在此使用动词描述这些天使警醒、警觉，并不必然采用固定的群体称号。译文保留描述性，以免受《以诺一书》其他段落的术语影响而过度统一。
translation_notes:
  register: 采用现代、庄重而易懂的标准汉语。“这些是……的名字”保留原文列举引介的结构；“警醒”避免把描述性动词直接术语化。
