base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/003.yaml
  text: Raphael[a], one of the holy angels, who is over the spirits of men.
translation:
  language: zh_hans
  text: 拉斐尔，是圣天使中的一位，掌管人的灵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的灵”也可译作“人类的灵”。这里的“人”是集合性称呼，不一定专指男性。
    reason: 说明集合性人类称谓的范围，并保留一种更明确的中文表达。
lexical_decisions:
- source_word: ሩፋኤል
  choice: 拉斐尔
  rationale: 按现代中文圣经及相关文献中通行的音译处理人名，不按名字可能具有的含义意译。
- source_word: ፩እምነ
  choice: ……中的一位
  rationale: 保留数词与部分介词所表达的群体归属关系，同时符合自然中文表达。
- source_word: ቅዱሳን፡ መላእክት
  choice: 圣天使
  rationale: 直接表达受分别为圣的天上使者，保持启示文学庄重而简洁的语体。
- source_word: ዘ
  choice: （掌管……的）
  rationale: 该关系标记引出拉斐尔所负责的范围；中文以谓语结构自然呈现，不另译关系代词。
- source_word: መናፍስተ
  choice: 灵
  rationale: 采用最直接的对应词，并保留其可指灵而未明确限定为死者灵魂的宽泛含义。
- source_word: ሰብእ
  choice: 人
  rationale: 此词在这里泛指人类，并非必然仅指男性；“人”在现代中文中简洁且可作集合性表达。
- source_word: ዘመናፍስተ፡ ሰብእ
  choice: 掌管人的灵
  rationale: 以“掌管”表达对某一领域负有权柄或职责的关系；不增添原文没有说明的对象状态或具体职能。
theological_decisions:
- issue: 拉斐尔职责范围的界定
  choice: 译为掌管人的灵，保留对人类之灵具有管理职责的宽泛表述。
  alternative: 将其限定为掌管死者的灵魂，或解释为掌管人的医治、内在生命。
  rationale: 吉兹语原文只说“人的灵”，没有在本节限定为死者，也没有明说医治职能；因此不从拉斐尔名字的含义或后期传统引入额外解释。
translation_notes:
  register: 采用现代、庄重、简洁的中文，保持天使名录式句法。以“掌管”自然表达原文简练的管辖关系，同时不补入死者、医治等原文未明说的信息。
