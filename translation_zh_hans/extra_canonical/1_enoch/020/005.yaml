base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/005.yaml
  text: Mikael[a], one of the holy angels[b], who is set over the good of mankind and over the people.
translation:
  language: zh_hans
  text: 米迦勒，是圣天使中的一位，受命掌管人类的福祉，也掌管众民。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据吉兹语转写在此处疑有识读讹误，后半句的句法也不十分确定；也可理解为米迦勒掌管“人类中的善者”，或掌管“众民的良好秩序”。
    reason: textual_and_alternative_reading
lexical_decisions:
- source_word: ሚካኤል
  choice: 米迦勒
  rationale: 采用现代中文圣经及犹太—基督教文献中通行的译名，既便于辨认，也对应吉兹语音形。
- source_word: ፩እምነ መላእክት ቅዱሳን
  choice: 圣天使中的一位
  rationale: 自然表达其属于圣天使群体，同时保留“其中一位”的结构。
- source_word: ተሰይመ（据校勘恢复；所给转写疑误作 ትእዛዚ）
  choice: 受命掌管
  rationale: 表达“被设立／委派管理”的被动含义；上下文是在列举天使受托管辖的领域。
- source_word: ሠናይቱ ለሰብእ
  choice: 人类的福祉
  rationale: 将“人的善／好处”译为自然而不过度具体化的中文；“人类”体现集合意义。
- source_word: ዲበ ሕዝብ
  choice: 也掌管众民
  rationale: 按校勘所提示的并列关系理解为另一管辖范围；“众民”保留 ሕዝብ 可指人民、民众或民族群体的宽泛性。
theological_decisions:
- issue: 米迦勒受托领域的性质
  choice: 掌管人类的福祉，也掌管众民
  alternative: 掌管人类中的善者；或掌管众民的良好秩序
  rationale: 校勘信息表明转写文本在动词及连接成分上可能有严重讹误；主译文采用恢复后的句法，但脚注保留“善”的具体所指及短语关系上的真实歧义，避免将其限定为某种特定教义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“福祉”比“善事”或“善良”更自然地表达对人类有益之事，同时以脚注保留原文可能指善者或良好秩序的歧义。
