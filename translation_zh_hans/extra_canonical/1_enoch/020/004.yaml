base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/004.yaml
  text: Raguel[a], one of the holy angels[b], who takes vengeance on the world and on the luminaries.
translation:
  language: zh_hans
  text: 拉贵耳是圣天使中的一位，惩罚世界和众光体。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众光体”指天上的发光体，很可能包括太阳、月亮和星辰。原文动词带有司法性、报偿性的惩罚意味；也可理解为“为世界和众光体伸冤”。
    reason: 说明“众光体”的宇宙意象，并保留该动词在受事关系上可能有的另一种理解。
lexical_decisions:
- source_word: ራጉኤል
  choice: 拉贵耳
  rationale: 按人名音译；“拉贵耳”既贴近常见的 Raguel 形式，也符合现代汉语圣经人名的庄重音译习惯。
- source_word: ፩እምነ
  choice: ……中的一位
  rationale: 保留原文表示群体成员身份的部分结构，同时使汉语表达自然。
- source_word: መላእክት ቅዱሳን
  choice: 圣天使
  rationale: 直接保留“圣”这一修饰语及天使称谓，符合以诺文献的惯用表达。
- source_word: ዘይትቤቀሎ
  choice: 施行报应
  rationale: 该动词具有司法性、惩罚性的报偿含义；“施行报应”比一般的“惩罚”更能体现其审判力度，又避免现代汉语中私人复仇的偏向。
- source_word: ለዓለም
  choice: 向世界
  rationale: 此处审判对象具有宇宙性的范围；译作“世界”比“地”更能传达这一层面，同时不排除受造秩序的含义。
- source_word: ለብርሃናት
  choice: 众光体
  rationale: 复数名词在启示文学语境中指天上的发光体；“众光体”保留其宇宙意象，且比普通的“众光”更清楚。
theological_decisions:
- issue: 拉贵耳惩罚职分的范围
  choice: 将“世界”和“众光体”并列为同一动词的两个对象
  alternative: 将此句理解为拉贵耳一般性地监管世界与天上光体，或惩罚涉及光体的过犯
  rationale: 吉兹语句法最自然地让两个介词结构共同受司法性动词支配。译文保留这种突兀而有张力的启示文学表述，不将它弱化为一般监管。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“施行报应”呈现启示文学中的司法惩罚色彩；脚注同时保留“为……伸冤”的可能理解。
