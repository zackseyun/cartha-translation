base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/006.yaml
  text: Saraqael[a], one of the holy angels[b], who is over the spirits of the children of men who sin.
translation:
  language: zh_hans
  text: 撒拉凯尔[a]，圣天使中的一位，掌管犯罪之人的灵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒拉凯尔”也有译作“撒列尔”的传统。此处依所据吉兹语形式音译。
    reason: proper_name_variant
  - marker: b
    text: 所据文本中间一段的转录有OCR不稳之处；较可恢复的读法为“世人（直译“人类之子”）的灵”。末尾动词说明这些世人犯罪，故主文译为“犯罪之人的灵”。
    reason: textual_variant
lexical_decisions:
- source_word: ሰራቃኤል
  choice: 撒拉凯尔
  rationale: 按吉兹语形式音译人名，并与 Saraqael 相对应。
- source_word: ፩እምነ መላእክት ቅዱሳን
  choice: 圣天使中的一位
  rationale: 保留表示整体中一员的部分结构，并以自然庄重的现代汉语表达“holy angels”。
- source_word: ዘዲበ
  choice: 掌管
  rationale: 该词组表示居于其上、负有监管之责；“掌管”简洁地保留权柄和职责的含义。
- source_word: መናፍስት
  choice: 灵
  rationale: 保留原文明确的复数类称；汉语在此以“……之人的灵”自然表达复数集合。
- source_word: 'እጓለ እመሕያው / OCR: [እስለ እመሕያው]'
  choice: 人
  rationale: 所给转录中段很可能是 OCR 误读；可恢复的吉兹语惯用语意为“世人／人类之子”。中文主文用“人”避免生硬直译，同时脚注交代文本问题。
- source_word: ዘመናፍስት ያኃጥኡ
  choice: 犯罪之人的灵
  rationale: 将关系从句理解为限定人类，即“犯罪之人的灵”；不增添原文未明确支持的“在灵里”。
theological_decisions:
- issue: 撒拉凯尔所掌管者的身份
  choice: 犯罪之人的灵
  alternative: 犯罪的灵；在人灵里犯罪之人的灵
  rationale: 较可恢复的文本及平行证据指向“世人／人类之子的灵”，而末尾动词表达犯罪。译文保留这些灵与犯罪者的关联，不进一步断定其处境或性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“掌管”体现天使的监管职责；“犯罪之人的灵”避免不自然的“人子们的灵”，并用脚注保留文本与句法上的不确定性。
