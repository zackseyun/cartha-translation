  text: Uriel[a], one of the holy angels[b], who is over the world and over Tartarus.
translation:
  language: zh_hans
  text: 乌列是圣天使中的一位，掌管世界和塔耳塔罗斯[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末一个词的文本形式较难确定。这里译作“塔耳塔罗斯”，指囚禁叛逆天上生灵的幽冥领域；也可能泛指“深渊”，甚至可按字面理解为“恐惧”或“战栗”。
    reason: textual_variant
  - marker: b
    text: 也可断句为：“乌列是圣天使中的一位；他掌管世界和塔耳塔罗斯。”
    reason: previous_rendering
lexical_decisions:
- source_word: ኡርኤል
  choice: 乌列
  rationale: 采用现代中文中对 Uriel 的通行圣经人名译法；专名音译，不赋予额外词义。
- source_word: ፩እመላእክት ቅዱሳን
  choice: 圣天使中的一位
  rationale: 数词与介词结构表示属于某一群体；“天使”符合本章天上使者名单的语境，“圣”保留其固定的启示文学称谓。
- source_word: እሰመ
  choice: 掌管
  rationale: 本句说明乌列受托负责的领域；“掌管”自然表达管辖职责，同时避免用“被任命”补入原文未明说的任命动作。
- source_word: ዘዓለም
  choice: 世界
  rationale: 该词也可涉及“世代”或“永恒”，但在列举天使管辖领域的宇宙论语境中，“世界”最为贴切。
- source_word: ወዘተረዓድ
  choice: 和塔耳塔罗斯
  rationale: 末词的见证形式较困难；结合本章给诸天使分配具体领域的格式，以音译保留作为叛逆灵体囚禁之域的神话地名，不将其弱化为抽象的“恐惧”或“战栗”。
theological_decisions:
- issue: 乌列的第二个管辖领域应译为具体的幽冥地域，还是一般性的深渊或抽象情绪
  choice: 塔耳塔罗斯
  alternative: 深渊；恐惧／战栗
  rationale: 具体的幽冥囚禁之域最符合本章天使各有宇宙管辖范围的结构，也保留第二圣殿时期启示文学的宇宙观；因词形见证存在困难，其他可能性在脚注中公开说明。
- issue: 后半句与“乌列”的句法关系
  choice: 作为说明乌列职责的连续描述：“掌管……”
  alternative: 断为独立分句：“他掌管……”
  rationale: 连续描述更贴合本章名单中反复出现的关系从句格式；中文无需生硬复制关系代词，但脚注保留另一种断句可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“乌列”为通行人名译法；“塔耳塔罗斯”保留古代启示文学中的专名性质，并由脚注解释。主句保持名单式的简洁结构，不增添特定宗派解释。
