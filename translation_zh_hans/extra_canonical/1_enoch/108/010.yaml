review_pass:
  verdict: revise
  source_fidelity: 草稿将 ዐሰዮሙ ለአርእስቲሆሙ 译为“他也把报偿归到他们自己头上”，既无可靠的“报偿”依据，又把与前句相连的第一人称动词改成第三人称；这超出了该艰涩短语所容许的解释。宜保留第一人称，并以“为他们的首领记下了他们”作克制处理，脚注说明“首领／头”及动词的困难。其余主要语义（在书卷中述说、爱天胜过在世生命、受恶人压迫、听见辱骂和毁谤、蒙羞、称颂我）均可成立。
  naturalness: 原文整体庄重流畅。“他也把报偿归到他们自己头上”在现代汉语中不自然，且“他们自己头上”把原文的“他们的头／首领”消解为反身意义。修订后句法仍保留原文的刻意难解性，但正文可读。
  terminology: “书卷”“福分”“称颂”适合本段语域；“天”应保留，不宜擅译为“天堂”或“上帝”。“辱骂和毁谤”“蒙受羞辱”恰当。关于末句第一人称，应保留“我”，脚注不应把“称颂上帝”表述成正文所支持的释义，只能列为推测性处理。
  issues:
  - severity: high
    issue: 将艰涩的第一人称短语译作“他也把报偿归到他们自己头上”
    rationale: 原文紧接“我已述说”的动词应维持第一人称；“报偿”及“他们自己头上”均非该短语的稳妥直译。原文的“他们的头”通常可指首领，动词可有安置、记下或设立等可能，须保留歧义。
  - severity: medium
    issue: 脚注a的正文对应词义失准
    rationale: 脚注承认“头”可指首领及另一种句法分析，但正文却采用“报偿归到他们自己头上”，使脚注与正文的词义基础不一致。
  revised_text: 我已在书卷中述说他们一切的福分，也为他们的首领记下了他们[a]；因为这些人显明是爱天胜过爱自己在世上的生命[b]。他们虽被恶人践踏，又从恶人口中听见辱骂和毁谤，并且蒙受羞辱，却仍称颂我[c]。
  revised_footnotes:
  - marker: a
    text: 本句原文艰涩。末语字面为“他们的头”，可指“他们的首领”；动词也可理解为“安置、设立”。因此本译作“为他们的首领记下了他们”，但另一种可能的译法是“我为他们的首领设立了他们”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“胜过他们在世上的气息”；这里以“生命”表达“气息”代指生命的用法。
    reason: lexical_alternative
  - marker: c
    text: 原文作“称颂我”。这里依现存文本保留第一人称；这可能是一处难解或讹误的读法，有人推测原文或许原指上帝。
    reason: textual_variant
  revision_rationale: 修订仅处理首句第二分句的重大语义与人称问题：删除无依据的“报偿”及反身性的“自己头上”，恢复第一人称，并以“记下”暂译该困难动词；脚注明确保留“首领／头”及“安置、设立”等替代分析。其余译文不作不必要改动。
