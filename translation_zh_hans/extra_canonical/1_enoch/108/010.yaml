review_pass:
  verdict: revise
  source_fidelity: 需要修订。草案将 ዐሰዮሙ ለአርእስቲሆሙ 译为“他也把报偿归到他们自己头上”，不仅将原文第一人称改成第三人称，也加入了原文在此难以确证的“报偿”概念。应保留该短语关于“首领／头”的困难和不确定性。其余主要内容基本忠实：保留了“天”“在世上的生命”“被践踏”“辱骂和毁谤”“蒙受羞辱”及末尾第一人称宾语。
  naturalness: 原译整体庄重通顺，但“把报偿归到他们自己头上”在现代汉语中既不自然，也会使读者误解为明确的报应／奖赏陈述。修订后仍保留原文的句法难点，并以脚注说明。
  terminology: “书卷”“福分”“天”“称颂”符合本段庄重的启示文学语域。“辱骂和毁谤”及“蒙受羞辱”适切。末句保留“我”，不替换为“上帝”。
  issues:
  - severity: high
    issue: 将困难短语译为“他也把报偿归到他们自己头上”
    rationale: 原文动词为第一人称；现有英文学术审计亦将其视为与“首领／头”有关的艰涩短语，而非可确定的“报偿”。译文的“他”和“报偿”均缺乏稳固文本依据。
  - severity: medium
    issue: 脚注 a 对正文的说明建立在“报偿”解释上
    rationale: 该注释须改为说明“首领／头”的字面词义及整句句法不确定性，避免把一种未证实的解释当作正文依据。
  - severity: low
    issue: “却仍称颂我”强化了让步语气
    rationale: 原文末尾为“在／当……称颂我时”的分词结构；可用“并在称颂我时”更贴近其与受辱动作的连接，同时仍保持自然汉语。
  revised_text: 我已在书卷中述说他们一切的福分；我也为他们的首领安排了他们[a]，因为人发现他们爱天胜过爱自己在世上的生命[b]。他们被恶人践踏时，从他们那里听见辱骂和毁谤，并在称颂我时蒙受羞辱[c]。
  revised_footnotes:
  - marker: a
    text: 本句原文艰涩。“首领”一词字面为“头”；动词可有安排、安置或记下等理解。也可译为“我把他们安置给他们的首领”，但原文的确切句法关系不确定。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“胜过他们在世上的气息”；这里以“生命”表达“气息”代指生命的用法。
    reason: lexical_alternative
  - marker: c
    text: 原文作“称颂我”。这里依现存文本保留第一人称；这也可能是一处难解或讹误的读法，有人会理解为称颂上帝。
    reason: textual_variant
  revision_rationale: 修订撤除了原文无法可靠支持的“他”“报偿”及“归到……头上”的解释，并恢复第一人称。对“首领／头”短语采用最克制的正文表述，脚注透明说明其词义和句法困难。末句维持现存文本的“我”，并以较中性的连接方式呈现其与受辱的关系。
