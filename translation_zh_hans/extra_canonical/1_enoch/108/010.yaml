base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/010.yaml
  text: And I have spoken of all their blessings in the books, and he has rewarded them themselves, because these are found to love heaven more than their life in the world; and while they are trodden down by evil men, they hear from them abuse and reviling and are put to shame while blessing me.
translation:
  language: zh_hans
  text: 我已在书卷中述说他们所有的福分；他也把报偿归到他们自己头上[a]，因为这些人显明是爱天胜过爱自己在世上的生命[b]。他们虽被恶人践踏，又从恶人口中听见辱骂和毁谤，并且蒙受羞辱，却仍称颂我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句原文艰涩。“头上”是字面表达，也可理解为报偿临到他们自身；另一种分析是：“我为他们的首领设立（或记下）这些。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“胜过他们在世上的气息”；这里以“生命”表达“气息”代指生命的用法。
    reason: lexical_alternative
  - marker: c
    text: 原文作“称颂我”。这里依现存文本保留第一人称；这也可能是一处难解或讹误的读法，有人会理解为称颂上帝。
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎ በረከቶሙ
  choice: 他们所有的福分
  rationale: በረከት 可指“福分、祝福”；采用具体的“福分”，保留末世文学中应许之福的意味。
- source_word: ነገርኩ በመጻሕፍት
  choice: 我已在书卷中述说
  rationale: 保留第一人称及复数“书卷”，也保留本段对书面见证的自指。
- source_word: ዐሰዮሙ ለአርእስቲሆሙ
  choice: 他也把报偿归到他们自己头上
  rationale: ዐሰየ 可表达报偿，አርእስት 字面为“头”；译文保留“归到头上”的具体说法，同时以脚注说明该短语的语法和词义存在困难。
- source_word: ተረክቡ
  choice: 显明是
  rationale: 该被动式可译为“被发现、显明”；“显明是”符合现代汉语，又不过度断定其方式。
- source_word: ያፈቅርዎ ለሰማይ
  choice: 爱天
  rationale: 直译其对象“天”，不扩写为某种特定的神学概念或灵性境界。
- source_word: እምእስትንፋሶሙ ዘበዓለም
  choice: 胜过爱自己在世上的生命
  rationale: እስትንፋስ 字面为“气息”，在此以气息代指生命；补出第二个“爱”使比较关系在汉语中清楚。
- source_word: ይትከየዱ
  choice: 被恶人践踏
  rationale: 采用保留身体意象的“践踏”，同时可自然表达受压迫、受欺凌。
- source_word: ትዕይርተ ወጽርፈተ
  choice: 辱骂和毁谤
  rationale: 保留两个并列的敌对言语名词，不把后者限定为专门针对上帝的“亵渎”。
- source_word: ኀሥሡ
  choice: 蒙受羞辱
  rationale: 按校勘所指向的 ኀስረ 词根理解为“受辱、蒙羞”，而非“忍受”。
- source_word: እንዘ ይባርኩኒ
  choice: 却仍称颂我
  rationale: 保留原文第一人称宾语“我”；“仍”表达他们在受迫害时持续称颂的让步关系。
theological_decisions:
- issue: “称颂我”中第一人称的指代
  choice: 保留第一人称“我”，不在正文中改为“上帝”
  alternative: 将“我”理解为间接指向上帝，或认为原文有讹误而译作“称颂上帝”
  rationale: 本节的直接话语主体为第一人称，现存文本明确带第一人称宾语。虽然语意异常，仍应保留其张力，并在脚注中说明。
- issue: 报偿者及“头上”短语的理解
  choice: 译作“他也把报偿归到他们自己头上”
  alternative: 译作“我为他们的首领设立了这些”或“我把这些记给他们的首领”
  rationale: 该处词形和句法困难；正文采用“报偿”及字面的“头上”，但不把“他”明确认定为某一神学角色，避免超出文本。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“书卷、福分、称颂”维持古代启示文学的语域；其余句法尽量明晰。对“归到头上”和“称颂我”等真正困难之处不在正文中擅自消解，而以脚注呈现替代分析。
