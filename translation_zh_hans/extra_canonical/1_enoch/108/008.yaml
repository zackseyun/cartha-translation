base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/008.yaml
  text: those who love God[a], and did not love gold or silver or any of the good things that are in the world[b], but gave their bodies to affliction.
translation:
  language: zh_hans
  text: 那些爱上帝、不爱金银，也不爱世上任何美好之物[a]，却把自己的身体[b]交给苦难的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一短语在现存文本中略显生硬，大意似乎广泛指世上可喜爱、可欲求的各种美物或财物。
    reason: textual_variant
  - marker: b
    text: 原词也可译作“肉身”；这里译作“身体”，仍强调他们亲身承受苦难。
    reason: lexical_alternative
lexical_decisions:
- source_word: እለ ያፈቅርዎ ለአምላክ
  choice: 那些爱上帝……的人
  rationale: 复数关系词引出所描述的一群人；用“那些……的人”保留原文关系结构，并以一般现在时表达其恒常特征。
- source_word: ወኢወርቀ ወኢብሩረ አፍቀሩ
  choice: 不爱金银
  rationale: 沿用前句“爱”的词汇，保留爱上帝与不爱财富之间鲜明的修辞对照；“金银”也自然涵盖财富之意。
- source_word: ወኢኵሎ ሠናየ ዘውስተ ዓለም
  choice: 也不爱世上任何美好之物
  rationale: 按上下文补出受前一动词支配的“不爱”，以“任何”表达否定句中的广泛范围，同时不把含义缩限为某一种财物。
- source_word: አላ
  choice: 却
  rationale: 表达强烈转折，使不贪恋世上美物与承受苦难形成对照。
- source_word: ወሀቡ ሥጋሆሙ
  choice: 把自己的身体交给
  rationale: “身体”比“肉身”更符合现代汉语，同时保留实际、具身的受苦含义；“交给”直接反映“给出、交付”的动作。
- source_word: ለጻዕር
  choice: 苦难
  rationale: 该词可指困苦、劳苦或患难；“苦难”范围较宽，不武断限定为劳动、禁欲或受迫害。
theological_decisions:
- issue: 本节是在描述单纯贫穷，还是出于爱上帝而有意不贪恋财富并承受苦难
  choice: 保留经文所呈现的主动忠诚与舍己：他们不爱世上财物，却将身体交给苦难
  alternative: 只描述他们没有财富，或仅作一般性的反贪婪声明
  rationale: 原文重复使用“爱”，把爱上帝与不爱金银及世上美物相对照；末句的“交给”又带有主动承受的意味。不过译文不进一步断定苦难具体属于禁欲、迫害还是劳苦。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“美好之物”保留原文较宽泛的措辞；“把自己的身体交给苦难”则有意保留原句略为强烈、具体的表达，不将其解释性改写成某一种特定的宗教操练。
