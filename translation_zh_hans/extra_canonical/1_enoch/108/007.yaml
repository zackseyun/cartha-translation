base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/007.yaml
  text: For there are writings and records concerning them in heaven above[a], so that the angels may read them and know what will come upon the sinners, and upon the humble in spirit, and upon those who afflicted their bodies and received recompense from God[d][c][b], and those who were put to shame by evil men.
translation:
  language: zh_hans
  text: 因为在天上高处，存有关于他们的文书和记录[a]，使众天使得以阅读，并知道将有什么临到罪人、谦卑的灵[b]、那些使自己的肉身受苦并从上帝那里得了报偿的人，以及那些受恶人羞辱的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “文书和记录”所对应的两个词合在一起不易确定；第二个词也可有别的理解，甚至可能与“邪恶”一词有关。因下句说天使阅读，故这里按天上的书面记录来译。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“谦卑的灵”，即“灵”受“谦卑”修饰；也有人按所指译作“心灵谦卑的人”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“被恶人责骂的人”或“遭恶人鄙视的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 保留解释前文缘由的连接作用；在现代汉语中自然、明确。
- source_word: ጽሑፋን ወእኩያን
  choice: 文书和记录
  rationale: 前者泛指书写之物，后者词义有困难；下文说天使诵读，因此按天上书面档案的语境处理，同时以脚注保留疑义。
- source_word: ላዕለ በሰማይ
  choice: 在上面的天上
  rationale: 尽量保存原文同时具有“上面”与“天上”的空间表达及启示文学语体，虽略显重复，却未将其中一项省去。
- source_word: ከመ ይንብብዎሙ መላእክት
  choice: 让众天使可以诵读
  rationale: 表达目的，并保留天使阅读这些书面材料的意象。
- source_word: ዘሀሎ ይብጽሖሙ
  choice: 将有什么临到
  rationale: 保留将来临到各类人的命运或结局之意，不具体限定为赏赐或刑罚。
- source_word: ለመናፍስት ትኁታን
  choice: 谦卑的灵
  rationale: 按名词加形容词的语法结构直译，保留“灵”作为实体名词，避免改写为性情描述“心灵谦卑的人”。
- source_word: እለ አሕመሙ ሥጋሆሙ
  choice: 那些使自己肉身受苦的人
  rationale: 保留肉身受苦或克己的强烈措辞，不预先限定为某种后期禁欲实践。
- source_word: ወተፈድዩ በኀበ አምላክ
  choice: 并从上帝那里得了报偿
  rationale: 体现偿还、报偿的司法色彩；结合并列的受苦义人理解为正面的报偿。
- source_word: እለ ኀሥሡ እምእኩያን ሰብእ
  choice: 那些受恶人羞辱的人
  rationale: 按上下文表达遭恶人羞辱或鄙视的人，并在脚注列出相近译法。
theological_decisions:
- issue: 天上书写之物的性质
  choice: 译作天上的“文书和记录”，供天使诵读以知晓各类人的结局
  alternative: 第二个名词也可能与“邪恶”有关，或整句更特指审判册、纪念册
  rationale: 紧接着的天使“诵读”最支持书面记录的理解；但词义困难仍以脚注说明，不把启示文学意象化约为普通信息。
- issue: “谦卑的灵”的语法与所指
  choice: 保留实体性的“谦卑的灵”
  alternative: “心灵谦卑的人”或“谦卑的心灵”
  rationale: 原文是复数名词“灵”受复数形容词“谦卑”修饰；直译保留它与末世灵界语境可能存在的联系及原文张力。
- issue: 上帝给予肉身受苦者的报偿
  choice: 按正面的报偿或伸冤理解
  alternative: 中性的报应，或对特定禁欲苦修的奖赏
  rationale: 这些人与谦卑者及受恶人羞辱者并列，语境倾向于受苦者从上帝得到伸冤；译文不进一步确立禁欲主义教义。
translation_notes:
  register: 采用现代、庄重而可读的启示文学语体。“诵读”比“阅读”略庄重，也符合公开或天上册籍被读出的意象；“肉身”保留原文与普通“身体”略有区别的宗教语感。主句较长，以并列结构保留原文各类对象之间的关系。
