base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/009.yaml
  text: those who[a], from the time they came to be, did not desire the food that is on the earth, but regarded their souls as a passing breath, and kept this, and the Lord tested them greatly, and their spirits were found pure[c][b], so that they might bless his name.
translation:
  language: zh_hans
  text: 他们自有生以来，就不贪恋地上的食物，反而把自己的性命看作一口转瞬即逝的气息[a]，并且持守这一点。主大大考验了他们，发现他们的灵是纯洁的，好让他们称颂他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”所译的吉兹语词也可指“灵”或“风”；这里的比喻着重于它转瞬即逝。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምአመ ኮኑ
  choice: 自有生以来
  rationale: 直译其时间起点，同时采用现代汉语中自然、庄重的表达。
- source_word: ኢፈተዉ
  choice: 不贪恋
  rationale: 原词表示喜爱、渴望或以之为乐；“不贪恋”保留内在欲求受到克制的含义，而不只是外在拒绝。
- source_word: መብልዕተ ዘውስተ ምድር
  choice: 地上的食物
  rationale: 保留原文具体的食物意象和空间对照，不泛化为“世俗享乐”。
- source_word: ረሰዩ ነፍሳቶሙ ከመ
  choice: 把自己的性命看作
  rationale: ረሰዩ在此与ከመ连用，表示“使之如同”或“看作”，并非“舍弃”；ነፍስ可指魂或性命，此处涉及短暂无常的尘世生命，故译“性命”。
- source_word: መንፈስ እንተ ተሐልፍ
  choice: 一口转瞬即逝的气息
  rationale: መንፈስ可指灵、风或气息；比喻的重点是短暂易逝，“气息”在现代汉语中最能传达这一意象。
- source_word: ዐቀቡ
  choice: 持守这一点
  rationale: 该词可表示看守、遵守或持守；“持守”保留其持续忠于某种操守的含义，又不擅自把所指限定为命令或制度。
- source_word: ብዙኃ አመከሮሙ
  choice: 大大考验了他们
  rationale: 上下文侧重检验与证实；“大大”对应程度很深，同时保留经受严峻考验的语气。
- source_word: ተረክቡ መንፈሳቲሆሙ ንጹሕተ
  choice: 发现他们的灵是纯洁的
  rationale: 在考验之后“被发现为纯洁”呈现检验所得的结果；汉语主动表达更自然，意义仍保持不变。
- source_word: ከመ ይባርክዎ ለስሙ
  choice: 好让他们称颂他的名
  rationale: 保留ከመ加未完成式可能表达的目的或结果意味；“称颂他的名”是自然且庄重的汉语宗教表达。
theological_decisions:
- issue: 地上食物与克己的关系
  choice: 保留对地上食物的具体不贪恋，以及把性命视为短暂气息的强烈克己意象。
  alternative: 将整句泛化为拒绝世俗享乐，或解释为禁食至死、殉道。
  rationale: 原文明确提到食物和性命的短暂，却没有说明某种后世禁欲制度，也没有明说他们主动舍命；译文不把这些可能解释写入正文。
- issue: ነፍስ与መንፈስ的关系
  choice: 前者译“性命”，后者译“灵”。
  alternative: 前者译“魂”，并把比喻中的መንፈስ译作“灵”或“风”。
  rationale: “性命”能表达ነፍስ在此处可能指尘世生命的用法，并与后文受检验而纯洁的“灵”形成原文已有的词汇区别；同时不据此建立身体、魂、灵的教义体系。
- issue: 考验后纯洁的含义
  choice: 表达为主考验他们，并发现他们的灵纯洁。
  alternative: 解释为主借严厉管教使他们变得纯洁。
  rationale: 原文的叙事次序更自然地指向纯洁经考验而得到证实，不足以断言考验是洁净他们的手段。
translation_notes:
  register: 采用现代标准汉语，语气庄重但避免古奥。“自有生以来”“地上的食物”“称颂他的名”保留经文风格；以“性命”而非较技术化的“魂”呈现此处语义，并避免把经文强行解释为特定禁欲传统。
