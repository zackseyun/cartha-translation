base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/011.yaml
  text: And now I will summon the spirits of the good ones from the generation of light, and I will transform those who were born in darkness[c][b][a], who in their flesh were not repaid with honor as their faith deserved.
translation:
  language: zh_hans
  text: 现在，我将召唤出自光明世代的良善之人的灵，并要使那些生在黑暗中的人改变[a]；他们在肉身之中，未曾得到与其信心相称的尊荣。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……改变”的原文较难确定；也可能含有“使……发光”或“照亮”的意象。
    reason: lexical_alternative
  - marker: b
    text: “信心”也可译作“忠信”，即坚定持守、忠诚不渝。
    reason: lexical_alternative
lexical_decisions:
- source_word: እጼውዕ
  choice: 我要召来
  rationale: 该动词表示呼唤、召集；“召来”既保留庄严的末世语气，也避免“祈求”可能带来的礼仪含义。未完成式按上下文译作将来。
- source_word: መናፍስቲሆሙ ለኄራን
  choice: 那些良善之人的灵
  rationale: 将预指代词后缀与 la- 属格结构整体理解为“良善之人的灵”，而非“他们的灵——那些良善的人”。“灵”保留原文在人论上的含混性。
- source_word: እምትውልድ እንተ ብርሃን
  choice: 光明世代中
  rationale: 保留光明与黑暗相对的启示文学意象；“世代”自然表达群体归属，也不把该词过度限定为血统。
- source_word: እዊልጥ
  choice: 使……改变
  rationale: 词形及确切意象较难确定。“改变”保留状态逆转的基本意义，同时以脚注列出“使……发光／照亮”的可能理解。
- source_word: ተወልዱ በጽልመት
  choice: 生在黑暗中
  rationale: 直接保留与“光明世代”相对的象征性表达。
- source_word: በሥጋሆሙ
  choice: 在肉身中
  rationale: “肉身”贴近原词，并保留其指向今世具身生活的可能性。
- source_word: ኢተፈደዩ ክብር
  choice: 未曾……蒙受尊荣
  rationale: 原语带有报偿或偿付意味；中文以“按……所当得的蒙受尊荣”在自然表达中保留应得报偿的含义。
- source_word: ከመ ይደሉ ለሃይማኖቶሙ
  choice: 按其信心所当得的
  rationale: 表达与其信心相称、所应得的意义；ሃይማኖት 也可指忠信，故在脚注保留该可能。
theological_decisions:
- issue: ሃይማኖት 在伦理—启示文学语境中的含义
  choice: 信心
  alternative: 忠信
  rationale: “信心”保留信靠或信念的通常意义，但该词也可强调持守与忠诚，因此脚注注明“忠信”，不将争议静默消除。
- issue: “生在黑暗中的人”与“良善之人”的关系
  choice: 不在译文中明确判定是否为同一群体
  alternative: 把他们明确视为同一群体、经历末世性的翻转
  rationale: 句法允许紧密相连的翻转图景，但也可能被读作另一个群体。中文维持原有连接而不补入解释性同位语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“光明世代”“生在黑暗中”保留启示文学的象征张力；句式略作分节，以免长串关系从句妨碍理解。
