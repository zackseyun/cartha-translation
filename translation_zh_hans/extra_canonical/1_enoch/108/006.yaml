base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/006.yaml
  text: 'And he said to me, “This is the place that you see: here the spirits of sinners and blasphemers and those who do evil will be cast, and those who twist everything that the Lord has spoken by the mouth of the prophets—all the things that are to be done.”'
translation:
  language: zh_hans
  text: 他对我说：“你所看见的就是这地方；罪人、亵渎者和作恶者的灵魂要被投在这里，那些歪曲主借众先知之口所说的一切、就是一切将要成就之事的人，也要被投在这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መካን
  choice: 地方
  rationale: 直译为“地方、处所”，符合此处指受刑之地的语境。
- source_word: መናፍስተ፡ ኃጥኣን፡ ወጽኁፋን
  choice: 罪人、亵渎者……的灵
  rationale: 保留原文以“灵”为中心、后接两类人的结构；ጽኁፋን 在此按传统语境理解为亵渎者。
- source_word: ይትወደዩ
  choice: 要被扔
  rationale: 保留被动语态及审判、投入某处的力度。
- source_word: ይመይጡ
  choice: 歪曲
  rationale: 表达对先知话语的扭曲或篡改，不将含义收窄为单纯否认。
- source_word: በኣፈ፡ ነቢያት
  choice: 借众先知之口
  rationale: 贴近闪语式表达，同时是自然庄重的现代汉语。
- source_word: ኵሉ፡ ይትገበር
  choice: 这一切都必成就
  rationale: 原文被动式可指“全都被实行/成就”；结合预言语境，以“成就”传达将实际发生之意。
theological_decisions:
- issue: 主所说之话与先知的关系
  choice: 主借众先知之口所说
  alternative: 主在众先知口中所说
  rationale: 保留主为话语源头、先知为传达媒介的原文结构，不引入更具体的启示理论。
- issue: 末句所指范围
  choice: 这一切都必成就
  alternative: 一切应当实行的事
  rationale: እለ ሀለዉ ኵሉ ይትገበር 的句法和指向略有不确定；正文依预言语境理解为前述话语全部成就，同时不扩展具体事件内容。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“亵渎者”“歪曲”“成就”保留审判与预言语境；用分号和破折号呈现原句层次，避免中文长句关系含混。
