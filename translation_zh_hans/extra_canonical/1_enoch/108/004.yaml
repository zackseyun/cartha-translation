base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/004.yaml
  text: And there I saw something like an invisible cloud[a], for because of its depth I was unable to look upon it; and I saw a flame of fire burning gloriously[d][c][b], and something like glorious mountains was circling and moving this way and that way.
translation:
  language: zh_hans
  text: 我在那里看见仿佛有一团看不见的云[a]；因为它深不可测，我无法望见它[c]。我又看见一道火焰，灿然燃烧；还有一些仿佛荣美群山的东西正在盘旋，来回动荡[b][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一段的抄本文字颇难确定。相关短语也可能表示向上观看，越过云的范围或可见形态。
    reason: textual_variant
  - marker: b
    text: “来回动荡”也可译作“来回摇动”；原文表示向交替方向反复运动。
    reason: lexical_alternative
  - marker: c
    text: 另一种译法是：“因为我能够从它的深处向上观看，越过它的范围或可见形态。”
    reason: previous_rendering
  - marker: d
    text: 另一种句法理解是：“它被仿佛荣美群山的东西环绕，并且不断来回动荡。”
    reason: previous_rendering
lexical_decisions:
- source_word: ርኢኩ በህየ
  choice: 我在那里看见
  rationale: 保留第一人称异象叙述和地点指示，采用现代汉语中自然而庄重的表达。
- source_word: ከመ ደመና ዘኢይትረአይ
  choice: 仿佛有一团看不见的云
  rationale: “仿佛”表达ከመ的比拟性质；“看不见的云”保留异象中既被看见、又被称为不可见的悖论，不擅自消解。
- source_word: እምዕሙቁ
  choice: 因为它深不可测
  rationale: 源词指深处或深度；结合观看受阻的语境，以“深不可测”自然表达其深邃，同时避免把异象具体化为普通地貌。
- source_word: ላህበ እሳት
  choice: 一道火焰
  rationale: 以简洁的现代汉语表达闪现于异象中的火焰；“一道”符合汉语对光焰的常用量词。
- source_word: እንዘ ይነድድ ስቡሕ
  choice: 灿然燃烧
  rationale: 兼顾持续燃烧与荣光、华美之意；“灿然”庄重而不古奥。
- source_word: ከመ አድባር ስቡሓን
  choice: 一些仿佛荣美群山的东西
  rationale: 保留比拟和异象对象未被明确命名的模糊性；“群山”反映复数山岳意象，“荣美”对应荣耀、华美的语义。
- source_word: ይትከበቡ
  choice: 在环绕运行
  rationale: 按第三人称复数理解，使其指向如荣美群山的异象实体；不增添其所环绕的具体宾语。
- source_word: ይትሀወኩ ለፌ ወለፌ
  choice: 来回动荡
  rationale: 表达反复向不同方向运动的动态；脚注保留“摇动”的词义可能。
theological_decisions:
- issue: 如何表达被看见却又“看不见”的云状异象
  choice: 仿佛有一团看不见的云
  alternative: 仿佛有一团无法看见的云雾
  rationale: 保留启示文学意象本身的张力，不把“看不见”解释成仅仅昏暗、隐约或被遮蔽。
- issue: 深度与观看能力之间的文本难题
  choice: 因为它深不可测，我无法看清它
  alternative: 我从它的深处得以看见它上方、超出其范围之处
  rationale: 正文采用经审校咨询文本的主要理解，但源文此处形式与句法不稳定，因此用脚注明示相反方向的旧译可能，不把疑难伪装成确定结论。
- issue: 复数运动动词的指向
  choice: 由“仿佛荣美群山的东西”作复数主体
  alternative: 火焰被仿佛荣美群山的东西环绕，并且来回摇动
  rationale: 源文两个运动动词为第三人称复数，更适合指向山岳般的异象实体；同时不武断补出它们所环绕的对象。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。句式清楚而保留启示文学的奇异感；避免文言化词序，也不以解释性措辞消除源文在不可见之云、观看能力及运动主体上的真实歧义。
