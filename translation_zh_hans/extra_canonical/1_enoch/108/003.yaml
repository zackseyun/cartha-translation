base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/003.yaml
  text: But you[a], wait until sin passes away; for their names will be blotted out from the book of life and from the books of the holy ones, and their offspring will be destroyed forever. And their spirits will be slain, and they will cry out and lament in a desolate place that is unseen, and in burning fire[d][c][b]; for there is no earth there.
translation:
  language: zh_hans
  text: 但你们要等候，直到罪恶消逝；因为他们的名字必从生命册和众圣者的册卷中被涂去，他们的后裔必永远灭亡。他们的灵必被杀；他们必在一个荒凉、看不见的地方[a]，在燃烧的火中呼号哀哭；因为那里没有大地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不可见的地方”。原词表示“不显现、看不见”。
    reason: lexical_alternative
  - marker: b
    text: “那里没有大地”按原文直译；这一异象中的图景含义并不明确，也可把“大地”理解为“土地”或“地面”。
    reason: cultural_note
lexical_decisions:
- source_word: ጽንሑ
  choice: 要等候
  rationale: 这是复数命令式，源自动词“等候、等待”，也承接上一节的重复用语；不译作“站稳”或“坚守”。
- source_word: ተሐልፍ ኃጢአት
  choice: 直到罪恶消逝
  rationale: 保留“罪恶过去、消逝”的启示文学意象，而不收窄为个人罪得赦免。
- source_word: ይደመስስ
  choice: 必……被涂去
  rationale: 宾语是记在天上册卷中的名字，“涂去”自然保留书写与审判的语境。
- source_word: እመጽሐፈ ሕይወት
  choice: 从生命册
  rationale: “生命册”是现代中文中清楚而庄重的启示文学用语。
- source_word: እመጻሕፍተ ቅዱሳን
  choice: 从众圣者的册卷中
  rationale: 保留原文复数“册卷”，并用“众圣者”避免把该词限定为后世教会制度中的“圣徒”；属格关系仍保持开放。
- source_word: ዘርኦሙ ይትሐጐል ለዓለም
  choice: 他们的后裔必永远灭亡
  rationale: “后裔”清楚表达血脉延续，“永远灭亡”保留审判宣告的严厉程度。
- source_word: መንፈሳቲሆሙ ይትቀተሉ
  choice: 他们的灵必被杀
  rationale: 按原文保留复数概念“灵”，不改作“灵魂”；“被杀”保留原文突兀而强烈的暴力意象。
- source_word: ይጸርኁ ወየአውይዉ
  choice: 呼号哀哭
  rationale: 以并列的现代汉语表达痛苦的喊叫与悲鸣，保持力度而不过度渲染。
- source_word: በመካነ ባድው
  choice: 在一个荒凉……的地方
  rationale: 表达空旷、荒废的惩罚之地，中文自然且具画面感。
- source_word: ዘኢያስተርኢ
  choice: 看不见的
  rationale: 该形式表达“不显现、不可见”；依据形态与最新校订，不采用“不能被显示”。
- source_word: በእሳተ ነዱ
  choice: 在燃烧的火中
  rationale: 保留原文加强式的火焰意象，不刻意消除其重复感。
- source_word: ኢሀሎ ህየ ምድር
  choice: 因为那里没有大地
  rationale: 直译这一异常的宇宙性图像，不擅自缩窄为“没有地面”或“没有土地”。
theological_decisions:
- issue: 名字被除去的天上册卷有何性质
  choice: 译作“生命册”和“众圣者的册卷”，呈现审判与归属的天上记录意象。
  alternative: 复数册卷也可能指属于众圣者的记录，或较宽泛的神圣文献。
  rationale: 原文同时保留单数的生命册与复数的圣者册卷；译文不把二者合并，也不进一步规定这些册卷的确切功能。
- issue: “他们的灵必被杀”与随后呼号哀哭之间的张力
  choice: 照原文并置“被杀”与“呼号哀哭”，不加解释。
  alternative: 可理解为彻底毁灭的比喻，或死后仍有意识受罚的图景。
  rationale: 经文本身将杀灭、哀哭、荒凉之地和火并列；翻译应保留其启示文学张力，不把它系统化为后世某一种来世论。
- issue: “众圣者的册卷”的属格关系
  choice: 保留“众圣者的册卷”这一可有多重理解的结构。
  alternative: 可解释为记录众圣者的册卷，或众圣者所拥有的册卷。
  rationale: 原文没有明确消除属格歧义，中文也不应擅自补足为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留启示文学中“生命册”“众圣者”“灵被杀”“没有大地”等异质而紧张的意象；标点略作汉语化处理，使长句层次清楚。
