base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/015.yaml
  text: And the sinners will cry out and see them while they shine[a], and they themselves will go to where the days and the times have been written down for them[e][d][c][b]. The vision of the hidden things of Enoch.
translation:
  language: zh_hans
  text: 罪人必呼喊，看见他们辉耀[a]；他们自己则要前往那为他们写定日子和时期的地方[b]。《以诺的隐秘之事的异象》[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的吉兹语动词较难确定。正文按上下文译作“辉耀”；也有可能表示躁动、纷乱或四处游荡。若取后一义，主语可能是罪人，即“罪人在游荡时看见他们”。
    reason: lexical_alternative
  - marker: b
    text: “写定”保留了启示文学中日期与时期被预先记在册上的意象；原文没有说明这些日子和时期具体指什么。
    reason: cultural_note
  - marker: c
    text: 末句原文是一个独立的名词短语，可能是本书或本段的卷末题署，也可直译为“以诺的隐秘之事的异象”。
    reason: literary_structure
lexical_decisions:
- source_word: ወይጸርኁ
  choice: 必呼喊
  rationale: 该动词表示大声呼叫，也可带哀号意味；“呼喊”保留末世审判场景的强烈语气，而不过度限定为哀悼。
- source_word: ወይሬእይዎሙ ኃጥኣን
  choice: 罪人……看见他们
  rationale: 宾语后缀明确指“他们”；将“罪人”置于汉语分句开头，使主宾关系清楚自然。
- source_word: እንዘ ይትወሐውሑ
  choice: 他们辉耀
  rationale: 此词形语义困难；按上下文译作发光、辉耀，可与罪人“看见他们”衔接，但其他词义分析可能指躁动、游荡，因此以脚注保留不确定性。
- source_word: ወየሐውሩ እሙንቱሂ
  choice: 他们自己则要前往
  rationale: 常用移动动词译作“前往”；强调代词及附加语气用“自己则”表达，使这些罪人与前文所见之人形成区分，同时不将区分绝对化。
- source_word: በኀበ
  choice: 前往那……的地方
  rationale: 该结构表达朝向某一目的地；汉语以“前往那……的地方”自然保留方向性。
- source_word: ተጽሕፉ ሎሙ መዋዕለ ወእዝማን
  choice: 为他们写定日子和时期
  rationale: 被动书写动词加与格含有预先记录之意；“写定”既保留天上册卷的书写意象，也传达日期与时期已经确定。
- source_word: ራእየ ኅቡኣት ዘሄኖክ
  choice: 《以诺的隐秘之事的异象》
  rationale: 原文是独立名词短语，没有“在……中”的介词，也没有“看见”的关系动词；按结语或题署处理最贴近现存吉兹语句法。
theological_decisions:
- issue: “为他们写定日子和时期”是否表示预定的审判时限
  choice: 保留“写定”的记录与确定双重意味
  alternative: 译作“为他们记录了日子和时期”
  rationale: 启示文学常以册卷记录审判期限，但原句本身没有进一步说明写定者、具体事件或其教义机制，因此不作扩展。
- issue: 末尾短语与前句的关系
  choice: 作为独立的结语或题署
  alternative: 将其并入前句，译作“在以诺所见隐秘之事的异象中”
  rationale: 吉兹语原文缺少表示“在……中”的介词和“所见”的动词；独立处理避免补入原文没有的句法关系，同时脚注说明其文体功能仍可能是卷末题署。
- issue: “他们辉耀”的主语
  choice: 按紧邻宾语理解为罪人所看见的那些人
  alternative: 理解为罪人自己躁动或四处游荡
  rationale: 词形及代词衔接存在真实困难；正文采用较符合当前语境的读法，脚注明确保留另一种可能，不据此建立额外的末世论区分。
translation_notes:
  register: 采用庄重而现代的书面普通话。“必……则要……”呈现预告语气；“辉耀”“写定”“异象”保持启示文学色彩，但避免古奥句式。书名号用于标示末尾可能独立存在的题署。
