  yaml_path: translation/extra_canonical/1_enoch/108/014.yaml
  text: And they will see those who were born in darkness cast into darkness[e][d][c][b][a], while the righteous shine.
translation:
  language: zh_hans
  text: 他们将看见那些生在黑暗中的人被投入黑暗，而义人却发出光辉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይሬ እይዎሙ
  choice: 他们将看见
  rationale: 按现有分词与经校订的理解，将主句作第三人称复数将来时；相较“我看见”，这也与后接未完成式所形成的未来场景一致。
- source_word: ለእለ ተወልዱ በጽልመት
  choice: 那些生在黑暗中的人
  rationale: 保留关系结构以及“在黑暗中出生”的被动含义，同时采用自然的现代汉语表达。
- source_word: ይትወደዩ በጽልመት
  choice: 被投入黑暗
  rationale: ይትወደዩ 来自表示“放、投、掷”的 ወደየ，其被动未完成式在这里表示“被投入”；介词 በ 随该运动语义表达趋向。
- source_word: እንዘ ይትወሐውሑ
  choice: 却发出光辉
  rationale: እንዘ 引出与主句同时发生的情状；动词为未完成式，其时间由未来主句决定。“发出光辉”保留与黑暗的鲜明对照。
- source_word: ጻድቃን
  choice: 义人
  rationale: “义人”是简洁、庄重且通行的圣经汉语用语，准确指称公义之人。
theological_decisions:
- issue: “生在黑暗中的人”所受处置的性质
  choice: 被投入黑暗
  alternative: 在黑暗中受爱／被留在黑暗中
  rationale: 源词的词根与形态支持“被投、被掷”，而非“受爱”；因此译出审判性的动作，但不进一步解释黑暗的性质或最终结局。
- issue: 义人发光的语态与时间
  choice: 却发出光辉
  alternative: 却被照亮／当时正在发光
  rationale: 源文未完成式可表达持续或正在发生的发光状态，且时间受未来主句支配；正文用不限定具体使动者的自然汉语，避免过度确定语态。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“而……却……”清楚呈现黑暗与光明的对照；不加脚注，因为经校订的词源分析已排除“受爱”的旧解，正文没有必须另注的实质歧义。
