base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/012.yaml
  text: And I will bring out into bright light those who loved my holy name[c][b][a], and I will seat each one on the throne of his glory.
translation:
  language: zh_hans
  text: 我要领出那些爱我圣名的人，使他们进入明亮的光中[a]；我要让他们逐一坐在他荣耀的宝座上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要把那些爱我圣名的人带到明亮的光中。”原文动词本有“领出”或“使出来”之意；其后的介词短语也可理解为这行动所指向的处所。
    reason: lexical_alternative
  - marker: b
    text: 原文的“他”可就近回指“逐一”所指的每一人，意为各人自己的荣耀之座；也有人理解为指神或上下文中的另一位受尊崇者，或将该短语概括为“荣耀的宝座”。
    reason: alternative_reading
lexical_decisions:
- source_word: እወፅኦሙ
  choice: 我要把……领入
  rationale: 该使役动词表示使一群人出来或前行；结合后面的光明意象，译作“领入”能自然表达从原先处境进入光中的动作。
- source_word: በብሩህ ብርሃን
  choice: 明亮的光中
  rationale: 原文以同源词叠加强化光明；“明亮的光”保留这种强调，同时避免过度诗化。介词在此可随运动动词理解为进入的目标。
- source_word: ለእለ አፍቀርዎ ለስምየ ቅዱስ
  choice: 那些爱我圣名的人
  rationale: ለእለ 最可能标明由动词中前置宾语代词所预指的直接宾语；“爱我圣名”保留对神圣之名的敬爱含义。
- source_word: አነብር
  choice: 我要让他们……坐在
  rationale: 在宝座语境中，该动词适合解作使人坐下或安置就座，而不是泛指居住。
- source_word: አሐደ አሐደ
  choice: 各自
  rationale: 重复形式表达逐一分配的意思；“各自”简洁自然，也表明每个人分别被安置。
- source_word: መንበረ ክብር ዚአሁ
  choice: 他荣耀的宝座
  rationale: 按原文属格结构直译，保留定指的“宝座”及第三人称单数代词，不将其弱化为形容词性的“荣耀宝座”。
theological_decisions:
- issue: 末句“他荣耀”的代词所指
  choice: 主文保留“他”，按就近关系可指前面的每一个人
  alternative: 也可能被理解为指神或上下文中的另一位受尊崇者；或概括译成“荣耀的宝座”
  rationale: 原文使用第三人称单数形式，而说话者用第一人称自称，因此就近回指“各人”在语法上较自然；但代词所指仍有解释空间，故不在主文中擅自改成“我的”或明确写出某一身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“圣名”“宝座”保留启示文学的宗教意象；用“领入”和“各自坐在”使句法适合普通现代读者，同时保留原文代词指向的含混。
