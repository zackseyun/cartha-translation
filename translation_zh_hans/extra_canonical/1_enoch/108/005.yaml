base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/005.yaml
  text: And I asked the two holy angels who were with me[a], and I said to him, “What is this glorious thing? For it is not heaven, but only a burning flame of fire[c][b], and the sound of weeping and crying out and lamentation and grievous pain.”
translation:
  language: zh_hans
  text: 我问那两个和我在一起的圣天使，又对他说[a]：“这荣耀之物[b]是什么？因为这不是天，而只是一团燃烧的火焰[c]，还有哭泣、呼喊、哀号的声音，以及剧烈的痛苦。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语此处作“对他说”，虽然前面提到的是“两位圣天使”。这可能表示以诺对其中一位代表说话，也可能是文本上的不规则之处。
    reason: textual_variant
  - marker: b
    text: “荣耀之物”也可译作“这荣耀之处”或“这光辉景象”。本节尚未明确指出所见对象，故正文保留较宽泛的表达。
    reason: lexical_alternative
  - marker: c
    text: 或译：“只是一道燃烧着的火焰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: 我问
  rationale: 直接表达以诺向天使发问，符合现代汉语叙事习惯。
- source_word: ፪አመላእክት ቅዱሳን
  choice: 那两个圣天使
  rationale: 保留原文明确的数词“两个”和启示文学中常见的“圣天使”称谓。
- source_word: እለ ምስሌየ
  choice: 和我在一起的
  rationale: 自然地说明两位天使是陪同以诺的引导者，不额外添加原文没有的动作。
- source_word: እቤሎ
  choice: 又对他说
  rationale: 忠实保留吉兹语单数宾语，尽管前文提到两位天使；不擅自改为复数。
- source_word: ምንት ውእቱ ዝስቡሕ
  choice: 这荣耀之物是什么
  rationale: “荣耀之物”保留所指尚未明确的宽泛性，也传达与荣耀、光辉相关的语义；脚注列出较自然的替代译法。
- source_word: አኮኑ ሰማየ
  choice: 这不是天
  rationale: 保留异象中眼前景象与“天”的直接对比。
- source_word: ላህበ እሳት ባሕቲቱ ዘይነድድ
  choice: 只是一团燃烧的火焰
  rationale: 分别体现“火焰”、“只”和“燃烧”的累积意象，同时使中文通顺自然。
- source_word: ቃለ ብካይ
  choice: 哭泣……的声音
  rationale: ቃለ在此听觉语境中译为“声音”，并统摄后续哭号词列。
- source_word: ጽራሕ
  choice: 呼喊
  rationale: 保留强烈发声之意，同时避免把声调过度限定为“尖叫”。
- source_word: አውያት
  choice: 哀号
  rationale: 与“哭泣”“呼喊”区分，保留原文层层累加的哀痛声音。
- source_word: ሕማም ኀያል
  choice: 剧烈的痛苦
  rationale: 表达痛苦或苦难的强烈程度，语体庄重而易懂。
theological_decisions:
- issue: 是否把具体异象概括为一般性的刑罚或折磨
  choice: 保留火焰、哭泣、呼喊、哀号和痛苦等具体感官意象
  alternative: 概括译为“刑罚”或“折磨”
  rationale: 原文以累积的视觉和听觉形象营造审判氛围；概括会削弱启示文学的张力，并加入本节未明确说出的解释。
- issue: 两位天使与单数受话者之间的不一致
  choice: 正文保留“两个……又对他说”
  alternative: 协调为“对他们说”
  rationale: 现存吉兹语的受话者形式为单数，可能指其中一位作为发言者，也可能是文本不规则；译文不应无声地消除这一张力。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。“圣天使”“火焰”“哀号”等词保留启示文学色彩；句法尽量自然，同时保留原文单复数张力和重复累积的感官描写。
