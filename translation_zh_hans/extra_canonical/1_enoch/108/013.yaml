base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/013.yaml
  text: And they will shine in times without number[a], for the righteousness belongs to God[f][e][d][c][b]; for he will give faith to the faithful in the dwelling of the paths of uprightness.
translation:
  language: zh_hans
  text: 他们必在数不尽的时代中欢喜[a]，因为上帝的审判是公义的[b]；他必在正直道路的居所中[d]，把信心赐给忠信的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在数不尽的时代中”也可译作“直到不可计数的时期”。“欢喜”另有流传译法作“发光”。
    reason: lexical_alternative
  - marker: b
    text: 正文据校勘将转写本的አነኒሁ改读为ኵነኔሁ，意为“他的审判”。若依现有转写文字勉强解释，也可译作“因为公义属于上帝”。
    reason: textual_variant
  - marker: c
    text: “信心”也可译作“信实”或“坚贞”。“忠信的人”与“信心”在吉兹语中形成同根呼应。
    reason: lexical_alternative
  - marker: d
    text: “正直道路的居所”保留原文把蒙福之境描绘为一个以正直的道路为特征之居所的具体意象；原文“道路”为复数。
    reason: cultural_note
lexical_decisions:
- source_word: ይትወሐውሑ
  choice: 欢喜
  rationale: 按该词在此处的反身、喜乐语义译为“欢喜”，符合末世蒙福的语境；“发光”是流传译法所反映的另一种理解，列入脚注以保留歧义。
- source_word: በእዝማን ዘአልቦ ኍልቈ
  choice: 在无数的世代中
  rationale: 直译其“不可计数的时期/世代”之意，同时用现代汉语自然表达持续无尽的时间。
- source_word: ጽድቅ ኵነኔሁ ለአምላክ
  choice: 上帝的审判是公义的
  rationale: 据校勘所指出的字形讹误，将转写本的አነኒሁ校作ኵነኔሁ（“他的审判”）；整句因而指上帝审判的公义，而非“公义属于上帝”。
- source_word: ለመሃይምናን
  choice: 给忠信的人
  rationale: 该词源于“相信、信靠”的词根，表示信徒或忠信者，并与下文“信心/信实”构成同根呼应，不宜译作“智慧人”。
- source_word: ሃይማኖተ
  choice: 信心
  rationale: 该名词可指信心、信仰或信实；正文采用自然且直接的“信心”，脚注保留“信实、坚贞”的可能。
- source_word: በማኅደረ ፍናዋተ ርትዕ
  choice: 在正直之路的居所中
  rationale: 保留原文“居所”与复数“道路”的具体意象，不将其抽象化为单纯的道德状态。
theological_decisions:
- issue: 上帝所赐之物的含义
  choice: 把信心赐给忠信的人
  alternative: 把信实（或坚贞）赐给忠信的人
  rationale: ሃይማኖት兼有信心与忠信的语义。正文保留“信心”，同时以脚注呈现伦理坚忍的可能含义，避免预先消解神学张力。
- issue: 上帝与公义之关系
  choice: 上帝的审判是公义的
  alternative: 公义属于上帝
  rationale: 现有转写本中的አነኒሁ很可能是ኵነኔሁ（“他的审判”）的字形误读；据此校勘后的句法与语义更为连贯，但脚注明确记录底本文字及另一译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无数的世代”“正直之路的居所”保留启示文学的时间尺度与空间意象；借助脚注说明词义和校勘问题，正文不堆叠解释。
