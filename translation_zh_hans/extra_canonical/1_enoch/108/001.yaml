base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/001.yaml
  text: Another book that Enoch wrote for his son Methuselah[a], and for those who will come after him and keep the ordinance in the latter days.
translation:
  language: zh_hans
  text: 另有一部书，是以诺写给他儿子玛土撒拉，也写给那些将在他之后来到、并在末后的日子遵守规例[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“秩序”“规则”“定规”或“规定的道路”。吉兹语原词可指应当遵循的既定规范、次序或模式。
    reason: 保留 ሥርዐተ 的词义幅度，避免把它限定为单一法律条例。
lexical_decisions:
- source_word: ካልእ
  choice: 另有
  rationale: 表示在前文之外又有一部著作，不强行限定为严格编号的“第二部”。
- source_word: መጽሐፍ
  choice: 一卷书
  rationale: 保留“书、著作”的通常意义；“一卷书”符合古代文献题记的语体，又不武断断定具体载体。
- source_word: ዘጸሐፈ
  choice: 是……写的
  rationale: 按关系结构修饰“书”，直接表达“写作”，不扩译为“编纂”。
- source_word: ለወልዱ ማቱሳላ
  choice: 为他儿子玛土撒拉
  rationale: 介词可表示给予或受益对象；“为”自然呈现本书面向玛土撒拉而写。
- source_word: ለእለ ይመጽኡ እምድኅሬሁ
  choice: 为那些要在他之后来到……的人
  rationale: 保留未来指向和原文单数代词“他”，不擅自把所指明定为某一代人，也不消除代词可能存在的指称张力。
- source_word: የዓቅቡ
  choice: 遵守
  rationale: 该动词可指保守、看守或遵行；与规范性名词搭配时，“遵守”是自然且准确的现代汉语。
- source_word: ሥርዐተ
  choice: 规例
  rationale: 该词可表示秩序、规则、定规或规定的方式；“规例”保留其规范性，同时不把它窄化为单项法令。
- source_word: በደኃሪ መዋዕል
  choice: 在末后的日子
  rationale: 保留启示文学语境中的末世色彩，也维持原文“日子”的表达。
theological_decisions:
- issue: 时间短语是否应作强烈末世论表达
  choice: 在末后的日子
  alternative: 在后来的日子／在日子的末了
  rationale: 《以诺一书》的启示文学语境使该短语带有末时意味；此译法保留这种张力，却不套入后来的特定末世论体系。
- issue: “在他之后”中单数代词的所指
  choice: 保留“他”，不在正文中明确其所指
  alternative: 在玛土撒拉之后／在以诺之后
  rationale: 原文使用单数代词，而语法和上下文可能让读者追问它指以诺还是玛土撒拉；译文不替原文消解这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“另有一卷书”呈现题记性质；句法尽量贴近原文层次，同时避免生硬直译。脚注标记置于其实际说明的“规例”之后。
