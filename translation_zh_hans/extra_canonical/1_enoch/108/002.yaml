base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/002.yaml
  text: You who have done good[a], wait for those days until those who do evil are brought to an end[c][b], and the power of the sinners comes to an end.
translation:
  language: zh_hans
  text: 你们这些行善的人，要耐心等候那些日子来到[a]，直到作恶的人被带到终局[b]，罪人的势力也归于终局[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耐心等候”也可译作“坚忍持守”或“忍耐”；这里指一直坚持到恶人的结局临到。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被终结”。原文所说的是作恶者本身被带到终局，并非只是他们停止作恶。
    reason: previous_rendering
  - marker: c
    text: 本句重复使用“完成、终结”这一词：作恶者及罪人的势力都达到终局。
    reason: cross_reference
lexical_decisions:
- source_word: እለ ገበርክሙ ሠናየ
  choice: 你们这些行善的人
  rationale: 关系结构加完成式动词指向以行善为特征的一群人；译文自然简洁，并与后文“作恶的人”形成鲜明对应。
- source_word: ትጸንሑ
  choice: 耐心等候
  rationale: 该词兼有停留、坚持、忍耐和等候之意；结合末世性的时间表达，“耐心等候”保留面向未来的期待，也包含坚忍意味。
- source_word: ለእሉ መዋዕል
  choice: 为那些日子
  rationale: 介词的具体关系略有弹性，而መዋዕል可指日子或时期；直译为“为那些日子”，由随后“直到”从句界定等候期限。
- source_word: እስከ ይትፌጸሙ እለ ይገብሩ እኩየ
  choice: 直到作恶的人被除灭
  rationale: 被动或反身形态表达这些人自身达到终局，而不是他们停止作恶；“被除灭”明确传达审判语境中的终结，避免误读。
- source_word: ወይትፌጸም ኃይሎሙ ለመአብሳን
  choice: 罪人的势力也归于终结
  rationale: ኃይል可指力量、权势或势力；此处“势力”较自然地表达罪人所拥有或施展的力量，并保留同一“终结”词根的重复。
theological_decisions:
- issue: መአብሳን应译为“罪人”还是“恶人”
  choice: 罪人
  alternative: 恶人；作恶的人
  rationale: 该名词带有罪与罪责的宗教伦理色彩；采用“罪人”既保留这一语域，也避免与前面的动词性表达“作恶的人”完全合并。
- issue: 作恶者达到终局的力度
  choice: 被除灭
  alternative: 告终；被终结
  rationale: 原文被动形式以作恶者本人为主语，指他们被带到终局。“被除灭”符合审判语境，但脚注保留较形式对应的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耐心等候”兼顾等候与坚忍；“被除灭”保留末世审判的力度；“归于终结”使结句自然，同时显出原文重复的终结意象。
