base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/002.yaml
  text: And again I lifted up my eyes to heaven[a], and I saw in a vision—and behold, there came out from heaven beings in the likeness of white men; and four came out from that place[d][c][b], and three with them.
translation:
  language: zh_hans
  text: 我再次举目望天，在异象中看见：看哪，有形貌如同白色人形的存在从天而出；又有四位从那地方出来，还有三位与他们一起[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“形貌仿佛洁白的人”。原文以“形貌、样式”的比较来描写他们，并未在这里直接说明他们属于哪一类天上存在。
    reason: lexical_alternative
  - marker: b
    text: 原文末句十分简略，直译近于：“四位从那地方出来，三位与他们一起。”大概是说共有七位，但正文保留原有句式，不加以整平。
    reason: textual_ambiguity
lexical_decisions:
- source_word: አንሣእኩ፡ አዕይንትየ፡ ካዕበ፡ ውስተ፡ ሰማየ
  choice: 我再次举目望天
  rationale: 保留“举起双眼”的异象文学惯用语及“再次”的推进作用；“举目望天”符合现代汉语表达。
- source_word: ወርኢኩ፡ በራእይ
  choice: 在异象中看见
  rationale: 明确保留异象这一观看方式，同时不增加原文没有明确表达的特指含义。
- source_word: ወነዋ
  choice: 看哪
  rationale: 保留原文引人注意、增强现场感的感叹语，也维持庄重的启示文学语体。
- source_word: ወፁኡ፡ እምሰማይ
  choice: 有几位从天而出
  rationale: 动词为复数，表示从天上出现或出来；汉语补出不定的人称量词，使句子自然，但不把这些形体直接定名为天使。
- source_word: ከመ፡ እምሳለ፡ ሰብእ፡ ጸዓዳ
  choice: 形貌如同白色的人
  rationale: “形貌如同”保留እምሳለ所表达的形态、相似性和异象中的距离感；“白色的人”忠实保留ጸዓዳ的颜色描写，不擅自解释为衣服洁白或道德纯洁。
- source_word: ፬ወፁኡ፡ እምውእቱ፡ መካን
  choice: 又有四位从那地方出来
  rationale: 保留明确数目、重复的出来动作，以及“那地方”的指示性和空间感。
- source_word: ፫ºምስሌሆሙ
  choice: 另有三位与他们同在
  rationale: 尽量保留原文简短而突兀的“有三位与他们一起”，不明说这三位究竟陪同、跟随还是同时出现。
theological_decisions:
- issue: 白色人形者的身份
  choice: 仅按外观译作“形貌如同白色的人”，不在正文中称其为天使
  alternative: 天使形状如人，身穿白衣
  rationale: 本节只说明其来自天上并具有人形般的白色外观，没有在此处明称其类别；描述性译法可避免把上下文解释或特定神学认定写入正文。
- issue: 四位与三位之间的数量关系
  choice: 保留“四位……另有三位与他们同在”的突兀结构
  alternative: 共有七位从天而来
  rationale: 原文大概指向总数七位，但句法本身分别陈述四位和三位；正文不替原文进行算总或重构群体关系。
translation_notes:
  register: 采用现代、庄重而可读的启示文学语体。“看哪”保留异象叙事的突现感；“举目望天”自然传达原文惯用语。避免使用过度古雅的“爰有”“厥处”等词，也不把这些形体预先解释为天使。
