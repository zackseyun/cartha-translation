base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/001.yaml
  text: And again I saw them[a], and behold, they were butting one another and devouring one another[c][b], and the earth began to cry out.
translation:
  language: zh_hans
  text: 我又看见它们；它们开始彼此抵撞[a]、彼此吞吃[b]，大地也开始呼喊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抵撞”也可译作“顶撞”“刺击”或“击打”。这里保留动物争斗的意象，但原词并不只限于某一种攻击方式。
    reason: lexical_alternative
  - marker: b
    text: “吞吃”也可译作“吞下”或“吞噬”；原词也可含“吞没”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወካዕበ፡ ርኢክዎሙ
  choice: 我又看见它们
  rationale: 保留异象叙事中“又……看见”的承接结构，并以现代汉语自然表达第一人称所见。
- source_word: ወአኃዙ፡ እንዘ፡ ይወግኡ（转录文本作 ወአንዘ፡ እንዘ፡ ይወግኡ）
  choice: 它们开始彼此抵撞
  rationale: 结合校勘所指出的转录误读，将句式理解为“开始”加未完成体动词；“抵撞”保留动物争斗的画面，又不把攻击方式过度限定为用角顶撞。
- source_word: ለካልኡ
  choice: 彼此
  rationale: 准确表达相互施加动作的关系，且符合简洁的现代汉语。
- source_word: ወይውሑጦ፡ ለካልኡ
  choice: 彼此吞吃
  rationale: 原动词可指吞下、吞没或吞噬；“吞吃”既保留直接的吞咽含义，也符合本段凶暴的动物意象。
- source_word: ወምድር፡ አኃዘት፡ ትጽራኅ（转录文本作 ወምድር፡ አንዘት፡ ትጽራኅ）
  choice: 大地也开始呼喊
  rationale: 保留“大地”为主动呼喊者的拟人化表达，并按校勘后的起始体形式译出“开始”；“也”自然衔接两个相继并列的起始动作。
theological_decisions:
- issue: 暴力发生时大地的拟人化反应
  choice: 保留“大地也开始呼喊”
  alternative: 地上传来呼喊声；大地陷入喧嚷
  rationale: 原文把大地本身作为呼喊的主体。这一宇宙性的拟人意象不应被弱化为普通环境描写。
- issue: 动物相互攻击的具体方式
  choice: 译作“抵撞”，并以脚注保留较宽泛的可能性
  alternative: 彼此顶撞；彼此刺击；彼此击打
  rationale: 上下文属于动物异象，但该动词本身可泛指猛烈攻击；正文维持动物争斗画面，同时避免断定它们必定以角攻击。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。分号区分“看见”的引介与异象内容；两个“开始”反映经校勘恢复的起始体结构。正文不加入转录文本中疑由OCR造成的重复成分，也不增添原文缺乏明确依据的“看哪”。
