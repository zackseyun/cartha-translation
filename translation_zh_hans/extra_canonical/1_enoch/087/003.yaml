base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/003.yaml
  text: And those three who came out afterward seized me by my hand[a], and they lifted me up from the offspring of the earth and brought me up onto a high place, and showed me a lofty tower above the earth[d][c][b], and all the hills became low.
translation:
  language: zh_hans
  text: 后来出来的那三位抓住我的手，把我从大地所生的族类中[a]提起来，带我上到一处高地，又让我看见一座高耸于大地之上的塔[b]；所有山冈都变低了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从大地所生的族类中”也可译作“从大地的后裔中”或较宽泛的“从地上的居民中”；原文比单纯的“从地上”更明确地含有出生、世代的意味。
    reason: lexical_alternative
  - marker: b
    text: 译作“塔”的原词含义较难确定，也可能泛指一座高大的建筑物或构筑物。
    reason: lexical_alternative
  - marker: c
    text: “山冈”也可译作“群山”；“都变低了”也可译作“都被降低了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ፫እለ ወጽኡ ድኅረ
  choice: 后来出来的那三位
  rationale: 将እለ理解为关系代词，使“后来出来的”修饰“那三位”；既保留回指，也不擅自说明这三位的本质。
- source_word: አሐዙኒ በእዴየ
  choice: 抓住我的手
  rationale: 动词表达抓住、握住；按该词形保留单数“我的手”，并维持异象动作的具体感。
- source_word: እምትውልደ ምድር
  choice: 从地所生的众类中
  rationale: 保留“出生／世代”与“大地”的组合，不把它简化成纯空间性的“从地上”；“众类”使中文能够自然表达群体所指，同时不限定为某一类人或生物。
- source_word: አንሥኡኒ … አልዐሉኒ
  choice: 提起来，带我上到
  rationale: 用两个相连而不重复的上升动作，再现先被提离、后被带到高处的动态。
- source_word: መካን ነዋኅ
  choice: 一处高地
  rationale: 简明表达高起之处，并避免把它解释为祭祀意义上的“邱坛”。
- source_word: ማኅፈደ ነዋኅ
  choice: 一座高耸于大地之上的塔
  rationale: 困难名词暂译为“塔”，修饰语译为“高耸”，保留建筑物及垂直高度的异象画面；其他可能性列入脚注。
- source_word: ሕፁፀ ኵሉ አውግር
  choice: 所有山冈都变低了
  rationale: 按地貌变化理解为实际降低，而非道德意义的降卑；አውግር可指丘陵或山岳，正文采用较不过度强化尺度的“山冈”。
theological_decisions:
- issue: 以诺被从“地所生的众类”中提起的含义
  choice: 保留出生／世代意象，不把短语仅处理为空间上的“从地上”。
  alternative: 从地上；从地上的居民中
  rationale: 原文含有与出生、世代相关的词，可能同时涉及以诺与地上受造者的分离以及空间上的升起。正文保留这一张力，不将其限定为单纯位置变化或特定人类学判断。
- issue: 三位形象的身份
  choice: 称为“那三位”，不补出“天使”“人”或其他身份。
  alternative: 那三个天使；那三个人
  rationale: 本节用回指方式提到三位异象形象，但自身并未明确命名其本质；译文不作超出本节措辞的神学认定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句子保留异象叙事连续上升的节奏，以“提起来—带我上到—让我看见”呈现动作推进；避免古奥虚词、宗派术语及对异象人物身份的额外解释。
