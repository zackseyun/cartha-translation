base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/004.yaml
  text: And they said to me[a], “Remain here until you see everything that will come upon those elephants and camels and donkeys, and upon the stars and upon the cattle[c][b], and all of them.”
translation:
  language: zh_hans
  text: 他们对我说：“你留在这里，直到你看见一切将要临到那些象、骆驼和驴、星辰、牛群，以及所有这些的事。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文反复使用“临到”，但没有说明究竟有什么事将临到这些对象；上下文可能暗示审判，本文不在译文中明说。
    reason: preserve_ambiguity
lexical_decisions:
- source_word: ይቤሉኒ
  choice: 他们对我说
  rationale: 保留常见叙事言说公式及明确的第一人称间接受词。
- source_word: ንበር ዝየ
  choice: 你留在这里
  rationale: 命令语气表示停留、住下；“留在这里”在现代汉语中自然且保持庄重。
- source_word: እስከ ትሬኢ ኵሎ ዘይመጽእ
  choice: 直到你看见将要……的一切事
  rationale: 保留命令持续的时限、异象的总体范围和未来指向。
- source_word: ዲበ
  choice: 临到
  rationale: 重复介词表示这些对象将受到某事影响；“临到”保留其开放性，不擅自说明是审判或灾祸。
- source_word: እልኩ ነጌያት
  choice: 那些象
  rationale: “那些”体现指示意味，指向异象中已经出现的动物。
- source_word: አግማል
  choice: 骆驼
  rationale: 按动物名称直译，保留动物启示录的意象。
- source_word: አእዱግ
  choice: 驴
  rationale: 采用清楚自然的现代汉语动物名称。
- source_word: ከዋክብት
  choice: 星辰
  rationale: 保留异象中的宇宙意象，不在正文中解释为天使或其他势力。
- source_word: አልህምታት
  choice: 牛群
  rationale: 该词在此指牛类或牛群，并非绵羊；“牛群”也与复数形式相称。
- source_word: ወኵሎሙ
  choice: 并临到它们全体
  rationale: 明确承接前面的“临到”，同时保留结尾概括所有所列对象的强调语气。
theological_decisions:
- issue: 是否把将临之事明确译为惩罚或审判
  choice: 将要临到……的一切事
  alternative: 将要临到……的一切审判
  rationale: 原文没有直接说明所临到的是审判；译文保留异象语句的含混和神学张力。
- issue: 是否在正文中解码动物和星辰的象征意义
  choice: 保留象、骆驼、驴、星辰和牛群
  alternative: 直接改译为相应的历史群体或属灵存在
  rationale: 本节呈现的是异象符号，而不是符号解释；直译可避免把特定诠释写进正文。
- issue: አልህምታት所指的动物
  choice: 牛群
  alternative: 绵羊／羊群
  rationale: 词形证据支持牛类；译作绵羊会混淆《动物启示录》中具有意义的动物区分。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“星辰”略带典雅色彩，适合启示文学；其余动物名使用日常标准称谓。为避免中文末句“和它们全体”所指含混，补出源于重复介词结构的“并临到”。
