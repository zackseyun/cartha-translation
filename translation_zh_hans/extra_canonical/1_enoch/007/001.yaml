base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/007/001.yaml
  text: And all the others with them took wives for themselves[a], and each chose one for himself.
translation:
  language: zh_hans
  text: 其余与他们同在的人都为自己娶了妻子[a]，各自选了一名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为自己娶了女子。”吉兹语这个名词也可泛指女子，但在这一结构中通常含有“妻子”的意思。
    reason: 保留原词在“女子”与“妻子”之间的词义范围。
lexical_decisions:
- source_word: ባዕዳን
  choice: 其余的人
  rationale: 结合上下文，指先前提及之群体中的其余成员，而非泛指“陌生人”；中文正文以“其余所有……的”自然表达整体所指。
- source_word: ኵሉ
  choice: 所有／都
  rationale: 保留原文全面、无一例外的强调；用“所有……也都”符合现代汉语表达。
- source_word: ምስሌሆሙ
  choice: 与他们同在的
  rationale: 直接表达陪同、结伴的关系，并把其余成员与此前提到的人联系起来。
- source_word: ነሥኡ ሎሙ አንስተ
  choice: 为自己娶了妻子
  rationale: 该结构在此语境中表达把女子纳为妻；“为自己”保留ሎሙ的反身含义，同时脚注保留“女子”这一词义可能。
- source_word: ኃረዩ
  choice: 选了
  rationale: 表达有意选择的动作，简洁自然。
- source_word: ለለ ርእሱ አሐተ
  choice: 各自选了一个
  rationale: “各自”保留逐一、反身的分配意义，“一个”保留数词所强调的每人一名。
theological_decisions:
- issue: አንስተ应译为“妻子”还是“女子”
  choice: 妻子
  alternative: 女子
  rationale: 此处的搭配通常具有娶为妻的含义；译作“妻子”描述这些行动者所建立或声称的关系形式，并不表示叙述者认可这种结合。脚注保留该名词较宽泛的“女子”义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首“其余所有与他们同在的”紧贴原文群体结构；“也都”强化全体共同参与；末句用“各自”自然呈现分配与反身意义。
