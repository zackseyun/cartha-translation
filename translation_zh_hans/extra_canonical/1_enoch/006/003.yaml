base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/003.yaml
  text: And Semyaza[a], who was their leader, said to them, “I fear that you may not be willing to do this deed[b], and I alone will become liable for a great sin.”
translation:
  language: zh_hans
  text: 森美亚撒——他们的首领——对他们说：“我怕你们不愿意做这件事，而只有我一人为这大罪承担罪责[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “承担罪责”也可译作“付出代价”或“被追究责任”；原词兼有负责和承受惩罚的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: 森美亚撒
  rationale: 按吉兹语见证音译人名，并采用便于现代汉语读者诵读的形式。
- source_word: መልአኮሙ
  choice: 他们的首领
  rationale: 该词字面与“天使／使者”相关，但本处说明森美亚撒在这群守望者中的带头身份；译作“首领”更清楚，同时以脚注保留字面可能。
- source_word: እፈርህ
  choice: 我怕
  rationale: 直接表达第一人称的惧怕和顾虑，语气自然。
- source_word: ኢትፍቅዱ
  choice: 你们不愿意
  rationale: 原词侧重意愿或同意，而非能力；放在“我怕”之后自然表达所担心的可能。
- source_word: ይትገበር ዝንቱ ግብር
  choice: 做这件事
  rationale: 忠实传达“实行这行为”的意义，并避免汉语中“做这件行为”的生硬重复。
- source_word: ባሕቲትየ
  choice: 只有我一人
  rationale: 突出若其余的人退缩，责任将由森美亚撒独自承担。
- source_word: ፈዳዪ
  choice: 承担罪责
  rationale: 保留该词承担后果、负有责任的法律—道德意味，又符合现代汉语表达。
- source_word: ለኃጢአት ዐባይ
  choice: 为这大罪
  rationale: 保留“大罪”的严重道德分量；“这”按上下文指他们正谋划的事。
theological_decisions:
- issue: 如何表达森美亚撒与其他守望者的关系
  choice: 他们的首领
  alternative: 他们的天使／他们的使者
  rationale: 上下文着重其带头角色；功能性译法避免把本句误解为另行界定其本体身份，同时脚注保留原词的字面范围。
- issue: 如何表达森美亚撒对大罪的后果
  choice: 承担罪责
  alternative: 付出代价／被追究责任
  rationale: 原词兼有负责与承受惩罚的意味；正文不把后果具体化，以保留其法律—道德张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我怕……而最后……”传达说话者对同伴可能退缩的忧虑；正文简洁直白，脚注保留关键词的字面与语义歧义。
