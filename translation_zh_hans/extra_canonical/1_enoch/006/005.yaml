  yaml_path: translation/extra_canonical/1_enoch/006/005.yaml
  text: Then they all swore together and bound one another with a curse concerning it[a][b][c].
translation:
  language: zh_hans
  text: 于是，他们全都一同起誓，并为这事以咒诅彼此约束[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以咒诅彼此约束”指他们以带有咒诅后果的誓约相互约束。
    reason: lexical_clarification
  - marker: b
    text: 或译：“并为这事使彼此受咒诅约束。”
    reason: translation_alternative
lexical_decisions:
- source_word: አሜሃ
  choice: 于是
  rationale: 作为叙事承接词，引出众人随后的共同举动；“于是”自然保留事件的先后推进。
- source_word: መሐሉ
  choice: 起誓
  rationale: 该动词意为起誓、宣誓，并非一般的说话；译文明确保留誓言场景。
- source_word: ኵሎሙ ኅቡረ
  choice: 全都一同
  rationale: 分别保留“全体参与”和“共同进行”的双重强调，凸显他们一致卷入此事。
- source_word: ወአውገዙ
  choice: 又……以咒诅相约
  rationale: 使役形在此具有以咒诅约束或使誓约带上咒诅后果的含义；此译既保留咒诅的力度，也表达共同承担约束。
- source_word: በበይናቲሆሙ
  choice: 彼此
  rationale: 表达相互关系，表明这种带有咒诅的约束是在他们之间共同确立的。
- source_word: ቦቱ
  choice: 为这事
  rationale: 指回上文正在商议的计划，但不把代词所指过度具体化。
theological_decisions:
- issue: 是否在正文中明确咒诅性质的誓约约束
  choice: 彼此以咒诅相约
  alternative: 彼此约束；彼此咒诅
  rationale: 原文同时陈述“起誓”和带咒诅性质的相互约束。正文保留两层动作，避免把后者弱化为普通承诺，也避免径直译成彼此施加敌意咒诅。
- issue: 相互约束的受事关系
  choice: 彼此……相约
  alternative: 各自约束自己；彼此以咒诅约束
  rationale: 原文的相互表达突出群体成员之间的共同约束。“相约”在现代汉语中较自然，同时脚注说明其更强的誓约约束力。
translation_notes:
  register: 采用庄重而通顺的现代书面汉语。“全都一同”有意保留原文对全体参与和共同行动的重复强调；“以咒诅相约”避免使用过于教派化的术语，同时呈现这项誓约所带的严厉、自我约束性质。
