  yaml_path: translation/extra_canonical/1_enoch/006/006.yaml
  text: And all of them were two hundred[a], and they came down onto Ardis[b], which is the summit of Mount Hermon.
translation:
  language: zh_hans
  text: 他们一共有二百人，都下到阿尔迪斯[a]，就是黑门山的峰顶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿尔迪斯”是按吉兹语形式音译的地名；其拉丁字母转写及确切读音尚不确定。原文将此地认定为黑门山的峰顶。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ
  choice: 他们共有
  rationale: 既表达代词后缀所指的全体，也使“二百人”的人数陈述符合现代汉语习惯。
- source_word: ክልኤ ምእት
  choice: 二百人
  rationale: 按原文直译数目，并补出量词“人”，使中文自然清楚。
- source_word: ወወረዱ
  choice: 并下到
  rationale: 保留动词所表达的向下移动，同时避免加入原文未明说的出发点。
- source_word: ውስተ
  choice: 到
  rationale: 在山地地点语境中表示抵达该处；中文用“到”比“进入”自然。
- source_word: አርዲስ
  choice: 阿尔迪斯
  rationale: 将地名按其吉兹语形式音译，不擅自赋予词义；具体读音仍有不确定性。
- source_word: ዝውእቱ ድማኁ ለደብረ አርሞን
  choice: 就是黑门山的峰顶
  rationale: 将关系从句理解为把阿尔迪斯认定为黑门山的最高处；“峰顶”自然且保留地形信息。
theological_decisions:
- issue: 守望者向下移动的表达
  choice: 并下到
  alternative: 并降到
  rationale: “下到”清楚保留垂直移动和叙事画面，却不因“降”而额外强化超自然或神学色彩。
- issue: 阿尔迪斯与黑门山峰顶的关系
  choice: 就是黑门山的峰顶
  alternative: 即黑门山的高处
  rationale: 原文关系从句具有认定作用；译文保留这种同位关系，不将阿尔迪斯解释成另一座山或更宽泛地区。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“共有二百人”准确传达全体人数；“下到”保留原文的方向性；地名采用简体中文常见音译形式。
