base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/004.yaml
  text: And they all answered him and said[a], "Let us all swear an oath, and let us all bind one another with a curse, so that we do not turn back from this plan[b], but carry out this deed."
translation:
  language: zh_hans
  text: 他们都回答他说[a]：“让我们大家都起誓，并彼此以咒诅相互约束，好叫我们不从这项计划中退缩，而是把这件事实行出来[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先说“回答”，又说“说”，保留了闪语叙事中常见的叠用表达。
    reason: lexical_alternative
  - marker: b
    text: 原文末句有重复，传本文字大意为“这项计划……这件事／行动”；译文保留从谋划转向实行的意思。
    reason: textual_variant
lexical_decisions:
- source_word: አውሥኡ
  choice: 回答
  rationale: 这是引出众人共同发言的叙事动词；“回答”保留正式的对话语气。
- source_word: መሐላ፡ ንምሐል
  choice: 起誓
  rationale: 名词与同根动词构成“以誓言起誓”式的强调表达；中文用“起誓”自然传达庄严立誓之意，并在脚注说明原文的叠加强调。
- source_word: ናውግዝ፡ ኵልነ፡ በበይናቲነ
  choice: 彼此以咒诅约束自己
  rationale: 这里不是一般的咒骂，而是众人借咒诅互相施加约束、共同承担违誓后果；译文保留其相互性和司法性的分量。
- source_word: ከመ፡ ኢንምጠ
  choice: 免得我们……退缩
  rationale: 该语境所强调的是不从已经议定的行动中后退，而不只是笼统地“不失败”或“不放弃”；“退缩”保留其意志性和方向感。
- source_word: ለዛቲ፡ ምክር
  choice: 从这项计谋中
  rationale: ምክር 可指商议、谋划或计划；此处指他们共同议定的方案。“计谋”符合上下文，同时不额外加入宗派性解释。
- source_word: ንግብራ፡ ለዛቲ፡ [ምክር፡] ግብር
  choice: 实行这件事
  rationale: 原文末尾有重复且传本文字略显不整齐；译文表达从谋议转入行动的意思，同时用脚注保留文本现象。
theological_decisions:
- issue: 守望者彼此立誓的性质
  choice: 以咒诅强化的自我约束性共同誓约
  alternative: 普通承诺，或不具立约约束力的一般咒诅
  rationale: “誓言”与“咒诅”的并列显示，这不只是随意表示同意，而是众人以违誓之咒彼此约束的庄严同谋；译文保留其道德与审判层面的沉重感，不把它淡化成一般承诺。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“彼此以咒诅约束自己”保留誓约公式的严肃性；“退缩”体现从既定方案中后撤的意味。所有脚注标记均已置于正文。
