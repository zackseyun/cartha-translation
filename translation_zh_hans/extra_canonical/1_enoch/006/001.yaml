base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/001.yaml
  text: And it came to pass[a], when the children of men had multiplied in those days, daughters were born to them, beautiful and comely.
translation:
  language: zh_hans
  text: 那些日子，人的子孙[a]日渐增多；有美丽秀雅的女儿为他们出生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人的儿子”。此格厄兹语表达是对人类的惯用称谓，并为下文与守望者的对照作铺垫。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮነ
  choice: （融入叙事起句，不另译“事情发生了”）
  rationale: 这是开启新段落的叙事公式。汉语直接以“那些日子”起句更自然庄重，也不损失事件展开之意。
- source_word: እምዘ በዝኁ
  choice: 日渐增多
  rationale: 既表达人数增长，也自然承接该时段中的背景情形。
- source_word: ውሉደ ሰብእ
  choice: 人的子孙
  rationale: 保留原文以人类后裔为整体的惯用表达，并为下文与守望者形成对照；不把它缩窄为仅指男性。
- source_word: በእማንቱ መዋዕል
  choice: 那些日子
  rationale: 保留启示文学中常见的时间公式，语体庄重而易懂。
- source_word: ተወልዳ ሎሙ አዋልድ
  choice: 他们生了……女儿
  rationale: 用现代汉语自然表达“女儿为他们而生”的含义，同时保留女儿这一亲属称谓，为下一节作铺垫。
- source_word: ሠናያት
  choice: 美丽
  rationale: 准确表达外貌美好，现代汉语自然明白。
- source_word: ወላሕያት
  choice: 秀雅
  rationale: 与“美丽”组成双重描写，不将原文两个并列形容词压缩为一个；“秀雅”也保留较庄重的文学色彩。
theological_decisions:
- issue: 人类称谓与下文天上存在的对照
  choice: 人的子孙
  alternative: 世人；人的儿子
  rationale: “人的子孙”保留传统的人类整体称谓及其与守望者的文学对照，又避免让现代读者误以为这里只谈男性。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。原文叙事公式不作生硬直译；两个描述女儿容貌的形容词分别译为“美丽、秀雅”，以保留修辞上的叠加。
