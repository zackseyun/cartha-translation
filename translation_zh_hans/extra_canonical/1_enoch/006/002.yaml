- from: 天上的众子，就是那些天使，看见了她们，就贪恋她们。[a]他们彼此说：“来吧，我们从世人的女儿中为自己挑选妻子，并为自己生儿育女。”[b]
  to: 那些天使，就是天上的众子，看见了她们，便渴望她们。[a]他们彼此说：“来吧，我们从世人的女子中为自己挑选妻子，并为自己繁衍后代。”[b]
  rationale: 修订使译文更紧贴吉兹语的语义强度与范围：保留天使与天上众子的双重称谓，避免以“贪恋”作额外道德定性，以“女子”而非“女儿”自然表达语境所限的女性对象，并以“繁衍后代”传达末句的生出后代之意。脚注保留代词指涉及“人的子女／后代”的字面信息。
