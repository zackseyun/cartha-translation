base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/002.yaml
  text: And the angels[a], the sons of heaven, saw them and desired them. And they said among themselves, “Come, let us choose for ourselves wives from the children of men[d][c][b], and let us beget children for ourselves.”
translation:
  language: zh_hans
  text: 那些天使，就是天上的众子，看见了她们，便渴望她们。[a]他们彼此说：“来吧，我们从世人的女子中为自己挑选妻子，并为自己繁衍后代。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她们”回指上一节所说的女子；本节原文只用代词，并未再次说“女子”。
    reason: cross_reference
  - marker: b
    text: “世人的女子”按“挑选妻子”的语境译出；原文较字面的说法是“人的子女”或“人的后代”。末句原意为“为自己生出／产生后代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርእዩ ኪያሆን
  choice: 看见了她们
  rationale: 保留原文代词宾语；“她们”回指上一节的女子，不在正文中重复补明。
- source_word: መላእክት ውሉደ ሰማያት
  choice: 天上的众子，就是那些天使
  rationale: 同时保留“天使”和“天上的众子”两个称谓，并以同位结构清楚表明二者指同一群体。
- source_word: ወፈተውዎን
  choice: 就贪恋她们
  rationale: 该动词表示强烈欲求，语境涉及择妻和生育；“贪恋”既传达不正当欲望，也不把原文扩张为更露骨的措辞。
- source_word: በበይናቲሆሙ
  choice: 彼此说
  rationale: 以自然现代汉语表达群体内部相互商议。
- source_word: ንዑ
  choice: 来吧
  rationale: 保留直接的劝诱、号召语气。
- source_word: ንሕረይ ለነ አንስተ
  choice: 为自己挑选妻子
  rationale: “挑选”贴近选择义；在随后生育的婚配语境中，“妻子”比泛称“女子”更准确。
- source_word: እምውሉደ ሰብእ
  choice: 从世人的女儿中
  rationale: 原文直译为“从人的众子女中”；汉语须结合择妻语境显明所指为女性，同时“世人”与“天上的众子”形成对照。
- source_word: ወንለድ ለነ ውሉደ
  choice: 并为自己生儿育女
  rationale: 自然表达“为自己生育后代”的意思；此处是男性说话者，汉语“生儿育女”仍可表示繁衍后代，并不专指分娩。
theological_decisions:
- issue: 这些存在同时被称为天使和天上的众子
  choice: 保留两个称谓，以同位结构相连
  alternative: 只译“天使”、只译“天上的众子”，或合并为“天上的天使”
  rationale: 吉兹语明确保留两种称谓；不将其删减或融合，可保存经文本身对这些超自然存在的表述。
- issue: 欲望动词是否明确译成性欲
  choice: 译作“贪恋她们”
  alternative: “渴望她们”“垂涎她们”或“爱上她们”
  rationale: 上下文清楚指向越界结合，但原动词本身只要求强烈欲望；“贪恋”保留道德张力，而不作更具体的心理解释。
- issue: “人的众子女”在择妻语境中的性别表达
  choice: 正文译作“世人的女儿”
  alternative: 较形式化地译作“世人的子女”，另加说明
  rationale: 妻子的直接宾语范围在语境中是女性；译作“女儿”使现代汉语明确通顺，同时脚注交代原文较宽泛的字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“天上的众子”保留启示文学的高雅称谓；语序调整为自然汉语，避免原文动词—宾语—主语顺序造成施事误解。
