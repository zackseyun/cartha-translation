  source_fidelity: 需修订。“贪恋”比吉兹语及英文审校轨迹所保留的“desire”更明确地加入贬义和不正当欲望的判断；宜译为“渴望”。“世人的女儿”可由择妻语境推知，但把原文较宽泛的“人的子女／后代”直接限缩为“女儿”，且“女儿”在现代汉语中容易带出年龄或亲属关系；以“世人的女子”较自然。末句“生儿育女”虽可表达繁衍，常带家庭生活及男女双方共同养育的联想；“繁衍后代”更贴近此处由说话者主动求得后代的意思。
  naturalness: 修订后的语序和引语在现代标准汉语中自然、庄重。“那些天使，就是天上的众子”既保留两个称谓，也避免将“天上的众子”置前而弱化原文先说“天使”的次序。
