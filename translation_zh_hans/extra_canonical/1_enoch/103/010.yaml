base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/010.yaml
  text: And we were destroyed, and there was no one to help us with a word; and we found nothing. We were tormented and destroyed, and we had no hope of seeing life from day to day.
translation:
  language: zh_hans
  text: 我们被毁灭了[a]，没有人以言语相助[b]；我们一无所得[c]。我们受折磨，又被毁灭；我们毫无希望能日复一日地活下去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被毁灭了”也可译作“灭亡了”或“被毁坏了”；同一动词在本节后半再次出现。
    reason: lexical_alternative
  - marker: b
    text: “以言语相助”可能指无人哪怕以言语、请求或声援来帮助他们；原词也可较宽泛地理解为“在任何事情上”。
    reason: cultural_note
  - marker: c
    text: “我们一无所得”这一分句的句法较难确定；也可译作“我们什么也没有找到”，或理解为“我们丝毫没有得到解救”。
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕልነ
  choice: 遭了毁灭／遭毁灭
  rationale: 该动词在本节重复出现，含有毁坏、灭亡的强烈意味；保留两次“毁灭”，不削弱哀歌式的反复。
- source_word: አልቦ፡ ዘይረድአነ
  choice: 没有人……帮助我们
  rationale: አልቦ 在此由表示施助者的关系从句限定，宜取人的意义；“帮助我们”自然传达援助之意。
- source_word: በነገር
  choice: 用一句话
  rationale: ነገር 可指话语、言辞，也有事情等较广含义；上下文可理解为甚至无人以言语、求情或声援相助，正文保留具体的“话”而以脚注说明。
- source_word: ወኢበምንትኒ፡ ኢረከብነ
  choice: 我们什么也没有得到
  rationale: 该句句法有难处；ኢ…ኒ 表否定，ረከበ 可指找到或得到。此处采用通顺而不过度补足对象的“什么也没有得到”。
- source_word: ተጸዐርነ
  choice: 受尽折磨
  rationale: 该词涵盖受苦、受压和受折磨；在与毁灭并列的强烈哀叹中，“受尽折磨”保留其力度。
- source_word: ኢተስፈውነ
  choice: 不再指望
  rationale: 否定形式表达希望的缺失；“不再指望”符合现代汉语的绝望语气。
- source_word: ከመ፡ ንርአይ፡ ሕይወተ፡ ዕለት፡ እምዕለት
  choice: 还能日复一日地活下去
  rationale: 原文直译近于“看见生命，一日又一日”，语境所指是继续存活；译文自然表达此义，同时在脚注保留原有意象。
theological_decisions:
- issue: 是否将反复的毁灭和绝望措辞归并为一般性的受苦陈述
  choice: 保留两次“毁灭”以及明确失去希望的语气
  alternative: 合并重复，只笼统译为困苦、悲惨或受难
  rationale: 原文借重复加强末世性哀歌的力度；保留这种张力，避免把严厉的毁灭语言淡化为一般困境。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文反复和绝望的哀歌语势；对“用一句话”与“什么也没有得到”等真有歧义之处不在正文中武断消解，而以脚注交代。
