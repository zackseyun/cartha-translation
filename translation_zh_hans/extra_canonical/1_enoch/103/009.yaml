base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/009.yaml
  text: Do not say[a], you righteous and good who are in life, “In the days of our affliction we toiled hard, and we saw every trouble, and we encountered many evils, and we were oppressed and made few[d][c][b], and our spirit became small.”
translation:
  language: zh_hans
  text: 不要论到那些活在世上的义人和善人说[a][c]：“在我们受苦的日子里，我们辛勤劳碌，经历了各种患难，又遭遇许多祸患；我们受人欺压，人数也减少了[d]，我们的灵也变得微小了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我们受苦的日子……辛勤劳碌”所据文字较难确定；整体意思是诉说沉重的苦难和劳作。
    reason: textual_variant
  - marker: b
    text: 直译为“我们的灵变得微小了”；这可表示内在受到削弱，也可能含有灰心、软弱或失去勇气的意思。
    reason: lexical_alternative
  - marker: c
    text: 也可译作：“你们这些活在世上的义人和善人，不要说……”。原句可理解为论到这些人说，也可理解为直接对他们说。
    reason: syntactic_ambiguity
  - marker: d
    text: “人数也减少了”直译近于“我们被使成为少数”。另有旧译将相邻语句理解为“我们被毁坏了”，但“受人欺压”更符合该动词的意义。
    reason: previous_rendering
lexical_decisions:
- source_word: ኢትበልዎሙ፡ ለጻድቃን፡ ወኄራን
  choice: 不要论到那些……义人和善人说
  rationale: 否定命令式带复数主语；后接成分既可能表示“论到”，也可能表示“对……”。正文采用较贴近前缀和上下文的“论到”，并以脚注保留呼语式理解。
- source_word: እለ፡ ሀለዉ፡ ውስተ፡ ሕይወት
  choice: 那些活在世上的
  rationale: 按现代汉语自然表达“在生命中”的习语，指目前活着的人；不把它解释为来世生命或特定的属灵状态。
- source_word: በመዋዕለ፡ ሥራሕነ፡ ዳማ፡ ጻመውነ
  choice: 在我们受苦的日子里，我们辛勤劳碌
  rationale: 底本文字在此较难确定，但整体显然描写困苦中的艰辛劳作；译文保留“受苦”与“劳碌”两个层面，避免把困难读法说得过于精确。
- source_word: ወኵሎ፡ ሥራኀ፡ ርኢነ
  choice: 经历了各种患难
  rationale: 原文直译近于“看见一切患难”；汉语以“经历”自然传达闪语式“看见”的经验义。
- source_word: ወእኩያተ፡ ብዙኃተ፡ ረከብነ
  choice: 又遭遇许多祸患
  rationale: 保留“遇见许多恶事”的强烈苦难语气；“祸患”在此比抽象的“邪恶”更符合所遭遇之事。
- source_word: ወተወጻዕነ
  choice: 我们受人欺压
  rationale: 该动词表示遭受压迫、不公或暴力；加入“人”使被动受害关系在现代汉语中清楚，但不指明施害者。
- source_word: ወውኅድነ
  choice: 人数也减少了
  rationale: 直译为“我们变少了／被使成为少数”；“人数减少”保留群体数量缩减的具体含义。
- source_word: ወንእስት፡ መንፈስነ
  choice: 我们的灵也变得微小了
  rationale: 有意保留“灵变小”的形象，没有直接解释成灰心、软弱或丧胆，以保存原文的开放性。
theological_decisions:
- issue: “活在世上的义人和善人”的身份与处境
  choice: 理解为目前仍活着并正在受苦的人
  alternative: 指来世得生命的人，或在属灵意义上拥有真生命的人
  rationale: 本节引述的是现实苦难中的哀诉，局部语境较支持现世生命；译文不加入末世得救或特定属灵身份的解释。
- issue: “灵变得微小”的含义
  choice: 保留原文身体尺度式的隐喻
  alternative: 明确译作“灰心”“软弱”或“失去勇气”
  rationale: 这些心理状态都可能包含在隐喻中，但原文没有只确定其中一种，因此不在正文中消除其神学与人性经验上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。苦难清单以并列短句保留书信式哀诉的节奏；不把“灵变得微小”改写为单一心理诊断，也不把“活在世上”神学化。
