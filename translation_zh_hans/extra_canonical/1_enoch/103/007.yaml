base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/007.yaml
  text: Know that they will bring your souls down to Sheol[e][d][c][b][a], and their recompense will be evil and great.
translation:
  language: zh_hans
  text: 要知道，他必使你们的灵魂[a]降到示奥尔[b][c]；这些灵魂必悲惨不堪，所受的患难必极大。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵魂”也可译作“灵”。
    reason: lexical_alternative
  - marker: b
    text: “示奥尔”是犹太传统中死者所在之境的名称，不宜简单等同于“坟墓”或后世所说的“地狱”。
    reason: cultural_note
  - marker: c
    text: “他必使……降到”也可理解为“他们必使……降到”。
    reason: textual_or_grammatical_alternative
  - marker: d
    text: 本句也可译作：“这些灵魂必处境悲惨，它们的患难必极大。”
    reason: syntactic_clarification
lexical_decisions:
- source_word: ታእምርዎሙ፡ እስመ
  choice: 要知道
  rationale: 认识动词所带的复数宾语后缀可视为预指后面的内容从句；译成自然汉语“要知道”，避免生硬地译作“要认识他们，因为”。
- source_word: ለሲኦል
  choice: 到示奥尔
  rationale: 保留犹太传统中死者所在之境的专名，不将其窄化为普通的“坟墓”；同时用音译保留启示文学的历史语境。
- source_word: ያወርዶዎሙ
  choice: 他必使……降到
  rationale: 动词表达向下运动及使动意义；主语形式按第三人称阳性单数处理，宾语后缀指复数的“灵魂”。由于传本和既有译法也有复数主语理解，脚注保留该可能。
- source_word: ለመናፍስቲክሙ
  choice: 你们的灵魂
  rationale: 该词可指“灵魂”或“灵”；在死后降入示奥尔的语境中，“灵魂”较自然，但脚注保留“灵”。
- source_word: እኩያተ ይከውና
  choice: 它们必陷入苦境
  rationale: 形容词复数与第三人称阴性复数动词共同述说前面的“灵魂”；用“陷入苦境”表达其恶劣、悲惨的状态，同时避免误解为灵魂在道德上变得邪恶。
- source_word: ምንዳቤሆሙ
  choice: 所受的患难
  rationale: 该名词在此指患难、困苦或苦痛，并非报偿；结合所属后缀译为“所受的患难”。
- source_word: ዐቢየ
  choice: 极其深重
  rationale: 末尾形容词强调患难之大；“极其深重”在现代汉语中自然地保留其收束性的强调。
theological_decisions:
- issue: 是否把ሲኦል意译为坟墓或阴间
  choice: 示奥尔
  alternative: 阴间；坟墓
  rationale: 音译能保留第二圣殿时期犹太启示文学关于死者之境的概念，不把它简化为埋葬地点，也不直接套入后世对“地狱”的理解。
- issue: መናፍስት应译为“灵魂”还是“灵”
  choice: 灵魂
  alternative: 灵
  rationale: 上下文涉及死后下降，汉语“灵魂”较易理解；原词的语义幅度则在脚注中说明。
- issue: እኩያተ ይከውና描述道德邪恶还是悲惨处境
  choice: 它们必陷入苦境
  alternative: 它们必成为恶的；它们必悲惨不堪
  rationale: 让该短语描述灵魂所处的恶劣、悲惨状态，既与后面的“大患难”衔接，也避免无根据地断定灵魂发生道德性质的转变。
- issue: ምንዳቤሆሙ是“患难”还是“报应”
  choice: 所受的患难
  alternative: 他们的困苦；他们的报应
  rationale: 词典与句法证据支持“患难、困苦”；采用“报应”会把上下文中的审判结果误当作该名词本身的固定词义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“示奥尔”保留古代犹太启示文学术语，并以脚注解释；后半句不沿用“报偿/报应”的旧解，而按词义和阴性复数一致关系译出灵魂的悲惨处境及其重大患难。
