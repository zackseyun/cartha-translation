base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/004.yaml
  text: And your spirits will live[a], you who died in righteousness, and they will rejoice and be glad, and their spirits will not perish, and their remembrance will be before the face of the Great One for all the generations of eternity. And now[e][d][c][b], do not fear their humiliation.
translation:
  language: zh_hans
  text: 你们这些在义中死去的人，你们的灵必存活[a]；他们必欢喜快乐，他们的灵必不灭；在那至大者面前，直到永世的一切世代，都有他们的记念[b]。如今，不要惧怕他们的羞辱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文句法也可理解为：“你们的灵必存活——就是你们这些在义中死去的人。”
    reason: 保留“你们的灵”与“在义中死去的人”之间句法关系的歧义。
  - marker: b
    text: 原文直译近于“他们的记念在那至大者面前，直到永世的一切世代”；“面前”是表示临在或天上法庭场景的惯用语。
    reason: 说明启示文学中的临在公式及时间表达，并保留原文以“记念”为主语的表达。
  - marker: c
    text: “羞辱”也可译作“耻辱”或“责难”。
    reason: 保留末尾名词的词义幅度，不改变其与“惧怕”的直接关系。
lexical_decisions:
- source_word: የሐይዉ መንፈስክሙ
  choice: 你们的灵必存活
  rationale: 保留“灵”的末世性和人论含义，同时以“存活”自然表达死后仍有生命的应许；原文数的关系和句法略有不确定，另见脚注[a]。
- source_word: ለእለ ሞትክሙ በጽድቅ
  choice: 你们这些在义中死去的人
  rationale: 把受话者明确为在义中死去的人，并保留名词“义”，不弱化为单纯“无辜”或仅表示死亡方式。
- source_word: ይትፌሥሑ ወይትሐሠዩ
  choice: 欢喜快乐
  rationale: 以两个相近而不同的词保留原文喜乐动词的并列加强。
- source_word: ወኢይትሐጐሉ መንፈሳቲሆሙ
  choice: 他们的灵必不灭
  rationale: “不灭”简洁地保留否定将来式及末世性的力度，不进一步规定灵魂性质。
- source_word: ወእቲዝካሮሙ
  choice: 他们必……永被记念
  rationale: 将“记念”理解为持续在至大者面前蒙记念，而非仅指人的心理记忆。
- source_word: እምቅድመ ገጸ ለዐቢይ
  choice: 在那至大者面前
  rationale: “面前”自然传达原文“在……面前/脸前”的临在与天庭语汇；保留“至大者”这一神圣称号，不直接改写为“上帝”。
- source_word: ለኵሉ ትውልደ ዓለም
  choice: 直到万世万代
  rationale: 结合该末世公式的时间含义，表达跨越一切世代的永久性，同时避免生硬直译为“世界的各代”。
- source_word: ኢትፍርህዎ ለኀሣሮሙ
  choice: 不要因他们所受的羞辱而惧怕
  rationale: “羞辱”涵盖受辱、耻辱和责难的语义；加入“所受的”使现代汉语关系清楚，但不消除词义范围，另见脚注[c]。
theological_decisions:
- issue: 死后存在的人论用语
  choice: 灵
  alternative: 魂；气息
  rationale: 原词መንፈስ可指灵或气息；本节谈到死后存活、欢喜与不灭，“灵”最能保留原文语汇，又不导入后期关于灵魂本体的精细教义。
- issue: 神圣称号ለዐቢይ
  choice: 那至大者
  alternative: 伟大者；上帝
  rationale: 原文使用称号而非一般的“上帝”名词；译作“那至大者”保留《以诺一书》的启示文学语体和称号特征。
- issue: 义人之“记念”的持续时间
  choice: 永被记念，直到万世万代
  alternative: 在世界的一切世代中被记念
  rationale: 此处ዓለም在相关末世公式中具有“世代、永世”的时间含义；译文表达永久性，但不额外界定这种记念的具体救恩机制。
- issue: 末句羞辱的指向
  choice: 他们所受的羞辱
  alternative: 他们的羞耻；他们的责难
  rationale: 保留第三人称复数指向及受辱语义；上下文具体所指仍有一定含混，译文不把“他们”擅自明确为恶人或义人。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“在义中”“灵”“至大者”等保留启示文学和神学关键词；用“欢喜快乐”“万世万代”使并列与永久性表达符合自然汉语。所有脚注标记均置于相关正文位置。
