base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/006.yaml
  text: And now they have died in prosperity and in wealth and they did not see distress and slaughter in their lifetime[a]; and they died in honor[c][b], and judgment was not executed against them in their lifetime.
translation:
  language: zh_hans
  text: 如今，他们已经在安逸富足中死去；一生没有遭遇患难和杀戮[a]。他们死时备受尊荣[b]，一生也没有审判临到他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 转录文本此处作“他们看见了”，但据校勘应读作“他们没有看见”；“患难和杀戮”是其宾语。因此也可译为“一生没有见过患难和杀戮”。
    reason: textual_variant
  - marker: b
    text: “备受尊荣”也可译为“在荣耀中”或“体面地”。这里主要指他们死时仍享有尊崇，而不是神圣的荣耀。
    reason: lexical_alternative
  - marker: c
    text: 这里说的是他们在世期间没有审判临到他们，并没有否定日后的审判。
    reason: theological_clarification
lexical_decisions:
- source_word: ሠናይ
  choice: 安逸
  rationale: 此处与“富足”并列，所指是顺遂优渥的生活境况，而不是道德意义上的“良善”。
- source_word: ብዕል
  choice: 富足
  rationale: 表示财富或丰裕；与“安逸”搭配，既体现物质充裕，也符合现代汉语表达。
- source_word: ምንዳቤ
  choice: 患难
  rationale: 表示困苦、灾难或折磨；“患难”庄重自然，并与下文暴力性的“杀戮”有别。
- source_word: ቀትለ
  choice: 杀戮
  rationale: 保留该词所含的暴力和灾难色彩，不弱化为一般的“死亡”。
- source_word: ስብሐት
  choice: 备受尊荣
  rationale: 语境所指是他们死时仍享有荣耀、体面或社会尊崇，而非专属于神的荣耀。
- source_word: ኵነኔ
  choice: 审判
  rationale: 保留宽泛的司法性含义，不预先限定为判刑或刑罚。
- source_word: ኢትገብረ ሎሙ
  choice: 未受审判
  rationale: 以自然汉语表达审判并未施行在他们身上；语境中的“一生”限定了这一陈述。
theological_decisions:
- issue: 本节是否表示恶人永远逃脱审判，还是只说他们生前未受审判
  choice: 译作“一生也未受审判”，将否定明确限定于现世生命期间。
  alternative: “他们从未受到审判”，可能被理解为连终极审判也不存在。
  rationale: 原文重复“在他们的一生中”，只陈述其生前未遭审判，并未否定日后的审判；译文保留这种末世张力，不作额外解释。
- issue: 转录文本中አርአዩ的读法及句法
  choice: 按校勘所指的否定读法理解为“没有遭遇”，并将“患难和杀戮”作为动词宾语。
  alternative: 按现有转录字面译成“他们看见了”，或将“患难”理解为死亡时的处境。
  rationale: 上下文、直接宾语结构及已记录的文本校勘共同支持否定读法；否则会与前后的安逸富足及未受审判难以衔接。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“安逸富足”呈现顺遂与财富并存的处境；“死时备受尊荣”避免生硬直译，同时保留社会尊崇之意。脚注标记全部置于相关主句之后。
