base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/002.yaml
  text: For I know the mystery[a], and I have read the tablets of heaven, and I have seen the holy writings[c][b], and I found written in them and understood concerning them.
translation:
  language: zh_hans
  text: 因为我知道那奥秘，也读过天上的书版[a]，看见过那神圣的记载；我还发现其中有所记载，并明白了有关它们的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的书版”是启示文学中天上记录或法令的形象，不必理解为现代形式的书籍。
    reason: cultural_note
  - marker: b
    text: 原文末尾的“它们”所指并不完全明确，可能与天上的书版或其中所记之事有关。
    reason: ambiguity_note
lexical_decisions:
- source_word: ምሥጢረ
  choice: 那奥秘
  rationale: 该词指隐藏而经启示显明的知识；“奥秘”既符合启示文学语境，也保留庄重语体。定指“那”反映原文宾语的特指意味。
- source_word: ፀፍፀፈ ሰማይ
  choice: 天上的书版
  rationale: 该短语描绘天上保存记录或命令的版册。“书版”保留古代具体意象，同时避免让现代读者误以为普通书籍。
- source_word: ጽሕፈተ ቅድስተ
  choice: 那神圣的文字
  rationale: ጽሕፈተ 与形容词 ቅድስተ 均为阴性单数形式，应理解为“神圣的文字／记载”，而非“圣者的文字”。此译也与现存希腊文 τὴν γραφὴν τὴν ἁγίαν 相符。
- source_word: ውስቴቶሙ
  choice: 其中
  rationale: 采用自然的处所表达；复数代词最可能回指前文“天上的书版”，但中文“其中”不必过度限定其先行词。
- source_word: አኩዐ
  choice: 明白了
  rationale: 该动词在此表示领会、理解所读或所见之内容；“明白了”体现由阅读、发现进而领悟的语义推进。
- source_word: በእንቲአሆሙ
  choice: 有关它们的事
  rationale: 保留原文复数代词及“关于、涉及”的关系，不擅自指定“它们”究竟指书版、所记之事或其他对象。
theological_decisions:
- issue: ጽሕፈተ ቅድስተ 的语法与所指
  choice: 译为“那神圣的文字”
  alternative: “圣者的文字”或“圣者的记载”
  rationale: 原文是阴性单数名词加阴性单数形容词，并非表示“圣者”的复数属格结构；因此不应借此引入天使或圣徒等身份判断。
- issue: 末尾复数代词的先行词
  choice: 保留为“它们”，并用脚注说明歧义
  alternative: 明确译作“有关那些书版的事”或“有关所记之事”
  rationale: 上下文容许不同回指关系；正文不替原文消除这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“书版”保存古代启示文学的具体意象；以“那神圣的文字”反映原文单数语法；末句保留代词含混，不作教义化解释。
