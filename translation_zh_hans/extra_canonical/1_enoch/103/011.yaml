base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/011.yaml
  text: We hoped to become the head[a], and we became the tail; we toiled, but we did not gain mastery over our labor; and we became food for sinners and for the lawless[c][b], and they laid their yoke heavily upon us.
translation:
  language: zh_hans
  text: 我们曾盼望成为头，结果却成了尾；我们辛苦劳作，却不能支配自己劳作的所得[a]；我们成了罪人和不法之人的食物[b]，他们把他们的轭沉重地加在我们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末语所指不十分确定；也可译作“却不能支配我们的劳作”，或理解为“我们的工价／劳作的成果”。前面的劳作短语在源文中以两个相连的词加强语气。
    reason: lexical_alternative
  - marker: b
    text: “食物”保留源文的具体比喻，表示他们沦为罪人和不法之人吞噬、掠夺的对象，如同猎物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ንሴፎ
  choice: 我们曾盼望
  rationale: 表达群体原有的期待和愿望；“盼望”符合哀歌语境，也保留尚未实现的意味。
- source_word: ንኩን ርእሰ፡ ወኮነ ዘነበ
  choice: 成为头，却成了尾
  rationale: 保留“头／尾”的具体对照和谚语式逆转，不将其解释性改写为“领袖／末位者”。
- source_word: ጻመውነ፡ እንዘ፡ ንትጌበር
  choice: 我们辛苦劳作
  rationale: 两个劳作表达在源文中相连；中文用“辛苦劳作”自然地合并其强化效果，避免生硬重复，也不加入源文没有的否定或被动含义。
- source_word: ወኢሠለጥነ፡ ዲበ፡ ዳማነ
  choice: 却不能掌管自己劳作所得
  rationale: “掌管”反映拥有权力或支配权的含义；结合上下文，将末词理解为劳动或劳动所得，同时以脚注保留其词义和句法上的不确定性。
- source_word: መብልዕተ
  choice: 食物
  rationale: 保留源文具体而强烈的吞食隐喻；“猎物”虽更直白，却属于解释性表达。
- source_word: ለኃጥኣን፡ ወለዓማፅያን
  choice: 罪人和悖逆者
  rationale: 前者直译为“罪人”；后者含反抗、悖逆或不守法之意，“悖逆者”在庄重现代中文中较自然，又不限定为某种成文法律概念。
- source_word: አክበዱ፡ ላዕሌነ፡ አርዑተ፡ ዚአሆሙ
  choice: 他们把自己的轭重重地压在我们身上
  rationale: 保留“轭”这一压迫与辖制的具体意象；“重重地压”传达使轭沉重的动词力度。
theological_decisions:
- issue: 是否解释“头／尾”的社会地位含义
  choice: 保留“成为头，却成了尾”的身体意象
  alternative: 成为首领，却沦为末位
  rationale: 源文以具体意象表现期待破灭和地位逆转；直留意象能保存其诗性与经文传统中的张力，避免过度社会学化。
- issue: 如何处理末句的压迫意象
  choice: 保留“轭”并译为“把自己的轭重重地压在我们身上”
  alternative: 他们残酷地压迫我们
  rationale: “轭”不仅说明受苦，也呈现被辖制的具体形象；抽象改写会削弱修辞和神学语境中的压迫意象。
- issue: 如何处理劳动短语的文本与句法难点
  choice: 正文译作“辛苦劳作，却不能掌管自己劳作所得”，脚注说明其他理解
  alternative: 我们劳苦，却不能支配我们的劳作
  rationale: 近年的源文复核指出 እንዘ ንትጌበር 不含否定，也并非第三人称被动；因此不采用“事情没有为我们成就”。对 ዳማነ 的所指则保持审慎，以脚注呈现真实歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。保留“头／尾”“食物”“轭”等核心具体意象；劳动分句以自然中文表达源文的重复强化，同时通过脚注保留关键词义及句法的不确定性。
