review_pass:
  verdict: revise
  source_fidelity: 必须修订。“እምሕል”在本节由“凭……的荣耀／凭他的伟大”引出的庄严公式中应译为“起誓”，而非“知晓（这奥秘）”。原文并没有“奥秘”一词。英语 POB 审计链在此将该动词误作“know (this mystery)”，但这与本节的誓言句式及重复出现的动词不符。
  naturalness: 原译“我为你们知晓这奥秘”不符合自然现代汉语，而且建立在对核心动词的错误理解上。改为两次“向你们起誓”既自然庄重，也保留原文的重复和郑重节奏。
  terminology: “义人”适切。“那位伟大、尊贵、在统治上大有权能者”将并列尊称归于同一位，避免把“国度”误作另一独立实体；不增译“上帝”。“统治”可用脚注保留“王权／国度”等词义范围。
  issues:
  - severity: high
    issue: 核心动词被译作“知晓这奥秘”
    rationale: 本节的两次እምሕል均处于以神圣荣耀与伟大为凭据的誓言公式中，宜译“起誓”。“奥秘”并非原文词语，加入后改变了本节言语行为及内容。
  - severity: medium
    issue: 脚注a保留了错误的“知道／奥秘”分析
    rationale: 脚注与正文同样误将誓言动词解释为认知或启示性知识，须改为说明其誓言性质。
  - severity: low
    issue: “我为你们知晓”不自然
    rationale: 即使按原草案的理解，“为你们知晓”在现代普通话中也不自然；“向你们起誓”准确且通顺。
  revised_text: 如今，义人啊，我凭那位伟大、尊贵、在统治上大有权能者的荣耀[b]，向你们起誓[a]；我也凭他的伟大向你们起誓。
  revised_footnotes:
  - marker: a
    text: 此处重复的动词在以荣耀和伟大为凭据的庄严公式中意为“起誓”。
    reason: lexical_alternative
  - marker: b
    text: “统治”也可译作“王权”或“国度”。该短语的句法较为紧凑；此处按较可能的理解，将“伟大、尊贵、在统治上大有权能”都归于同一位。
    reason: lexical_and_syntactic_alternative
  revision_rationale: 依格伊文本身的誓言公式修正核心动词，删除原文没有的“奥秘”，并以自然庄重的现代汉语保留两次“向你们起誓”。保留原草案对尊称结构的较佳处理，并以脚注说明“统治／王权／国度”的语义范围及紧凑句法。
