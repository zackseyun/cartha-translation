  naturalness: 现稿“我为你们知晓这奥秘”在现代汉语中不自然；改为“向你们起誓”既准确也庄重流畅。
  terminology: “义人”适切。“那位在统治上伟大、尊贵而有权能者”保留尊称性质及“统治／王权”的限定，不擅自补出神名。
  issues:
