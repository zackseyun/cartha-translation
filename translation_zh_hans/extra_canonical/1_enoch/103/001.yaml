base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/001.yaml
  text: And now I know this mystery for you[a], O righteous ones, by the glory of the Great and Honored and Mighty One in dominion[c][b], and by his greatness I know it for you.
translation:
  language: zh_hans
  text: 现在，义人啊，我为你们知晓这奥秘[a]：我凭那位在统治中伟大、尊贵而有权能者的荣耀[b]，也凭他的伟大，为你们知晓这奥秘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文措辞简略且较难确定；这里的动词也可能只表示“知道”，不一定明确含有“奥秘”一词。
    reason: lexical_alternative
  - marker: b
    text: “统治”也可译作“王权”或“国度”。原句也曾被理解为：“凭那伟大者的荣耀，凭那尊贵而有权能的国度，也凭伟大……”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: 现在
  rationale: 作为转入新宣告的时间标记；现代汉语中不必机械添加“而”。
- source_word: እምሕል
  choice: 知晓这奥秘
  rationale: 按以诺文学的启示语境表达获知隐秘之事，同时用脚注保留仅作“知道”的可能；重复译出以反映原文。
- source_word: ለክሙ
  choice: 为你们
  rationale: 保留介词所表达的受益或关联意义，也维持两次出现的对应。
- source_word: ጻድቃን
  choice: 义人
  rationale: 自然、庄重地表达复数实体性群体称谓；汉语“义人”本身可作集合性复数。
- source_word: በስብሐቱ
  choice: 凭……的荣耀
  rationale: 将介词理解为工具或凭据，适合庄严宣告的结构，又不进一步解释誓言或启示机制。
- source_word: ለዐቢይ፡ ወለክቡር፡ ወዕዙዘ፡ መንግሥት
  choice: 那位在统治中伟大、尊贵而有权能者
  rationale: 依修订所指出的句法，把并列性质共同归于神圣人物，并将መንግሥት表达为统治领域；不直接增译“上帝”。
- source_word: ወበዕበዩ
  choice: 也凭他的伟大
  rationale: 保留重复的工具性介词结构及“伟大”这一抽象名词，不改写为较具解释性的“威严”。
theological_decisions:
- issue: 动词表示一般知道，还是获知启示性的奥秘
  choice: 正文译为“知晓这奥秘”
  alternative: 仅译“知道”或“我为你们知道”
  rationale: 以诺文学语境支持启示奥秘的含义，但原文措辞压缩且词义存在争议，因此以脚注明示另一可能。
- issue: “伟大者”的所指
  choice: 以“那位……者”保留神圣尊称，不明确增译“上帝”
  alternative: 直接译作“上帝”或把相关词组理解为独立的“尊贵而有权能的国度”
  rationale: 语境很可能指神，近期语法复核也支持诸形容词共同描述同一位；但原文使用尊称而非明确神名，正文不越过这一界限。
- issue: መንግሥት的意义和句法归属
  choice: 译作“在统治中”，修饰“有权能”
  alternative: 译作“国度”，并视为独立名词短语
  rationale: 此处按较可信的句法复核理解为“在统治／王权上有权能”；脚注保留“国度、王权、统治”的词义幅度。
translation_notes:
  register: 采用现代、庄重而可读的普通话。保留原文首尾动词及“为你们”的重复，以呈现郑重宣告的节奏；用“那位……者”承载尊称，避免导入原文没有明说的神名。所有脚注标记均已置于正文。
