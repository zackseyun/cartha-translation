    issue: 将እምሕል译为“知晓这奥秘”
    rationale: 该动词在本句的重复及句法结构表明其为“我起誓”；原文未出现“奥秘”。此误译改变整节的言语行为，并导致正文与脚注均添加了原文所无的启示性内容。
  - severity: medium
