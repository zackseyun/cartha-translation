base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/003.yaml
  text: For every good thing and joy and glory have been prepared and written down for the spirits of those who died in righteousness[a]; and much good will be given to you as the fruit of your labor[c][b], and your portion will abound beyond the portion of the living.
translation:
  language: zh_hans
  text: 因为，一切美善、喜乐和荣耀，都已为那些在公义中死去之人的灵预备并记下[a]；许多美善也必赐给你们，作为你们劳苦的果实[b]；你们所得的份必远超过活人所得的份[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“记录下来”。这里可能让人想到为那些在公义中死去之人所保存的天上记录。
    reason: lexical_alternative
  - marker: b
    text: 直译“你们劳苦的果实”；这一说法保留了劳作日后结出收成的意象。
    reason: lexical_alternative
  - marker: c
    text: 或译“你们的份将多于活人的份”。
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 承接上文并说明理由，保留原词的因果或解释性连接作用。
- source_word: ኵሉ ሠናይ
  choice: 一切美善
  rationale: 保留表达的广泛涵盖性，又避免将其具体化为原文未明说的“福分”。
- source_word: ፍሥሓ
  choice: 喜乐
  rationale: 自然、庄重，并与“美善”和“荣耀”构成并列。
- source_word: ክብር
  choice: 荣耀
  rationale: 适合末世赏赐的语境，也保留该词兼具尊荣与光辉的分量。
- source_word: ተደለወ
  choice: 预备好
  rationale: 表达被动且已完成的预备，同时保持将来赏赐已经备妥的意味。
- source_word: ተጽሕፈ
  choice: 记下
  rationale: 保留书写或登记的具体意象，但不擅自补入“天上的册子”等解释。
- source_word: ለመንፈሳቲሆሙ
  choice: 那些……之人的灵
  rationale: 直译其核心人类学用语为“灵”，不改作可能带入其他神学预设的“灵魂”。
- source_word: ለእለ ሞቱ በጽድቅ
  choice: 那些在公义中死去之人
  rationale: 保留“在公义中”这一名词性表达，不简化为纯粹描述死亡方式的“义人之死”。
- source_word: ይትወሀብ ለክሙ
  choice: 必赐给你们
  rationale: 清楚呈现将来被动的应许语气。
- source_word: ተክለ ጻማክሙ
  choice: 作为你们劳苦的果实
  rationale: 保留劳苦结出果实的农业意象，并表达所赐美善与劳苦果实之间的对应关系。
- source_word: ክፍልክሙ
  choice: 你们所得的份
  rationale: 以现代汉语自然表达所分得的份额，同时保留产业或赏赐的语感。
- source_word: ፈድፋደ እምክፍለ ሕያዋን
  choice: 必远超过活人所得的份
  rationale: 明确保留比较和超越之意；“活人”不额外解释为某一特定群体。
theological_decisions:
- issue: 死者的人类学称谓
  choice: 灵
  alternative: 灵魂
  rationale: 吉兹语直接对应“灵”；采用“灵魂”可能引入原文并未要求的后期神学含义。
- issue: 所写记录的性质
  choice: 记下
  alternative: 记在天上的册子中
  rationale: 原文可能唤起天上名册或记录的意象，但本节只明确说“写下”，因此正文不扩展其所在或形式。
- issue: “活人”的所指
  choice: 活人
  alternative: 现今仍活着的人
  rationale: 保留原文简洁且可能具有末世张力的称呼，不在正文中限定具体时间或群体。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“美善—喜乐—荣耀”保留原文三项并列；分号呈现应许的两个主要层次。所有脚注标记均置于其所说明的正文短语之后。
