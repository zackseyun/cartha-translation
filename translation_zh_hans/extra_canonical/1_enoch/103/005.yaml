base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/005.yaml
  text: Woe to you[a], dead sinners, when you die in the wealth of your sins, and those like you say about you, ‘Blessed are these sinners[d][c][b]; they have seen all their days.’
translation:
  language: zh_hans
  text: 你们这些死去的罪人有祸了！当你们死在你们罪恶的财富中[a]，那些和你们一样的人就谈论你们说：“这些罪人是有福的；他们看尽了自己一生的日子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存转写中这一短语可能含有OCR误读；依据校正读法，可译为“在你们罪恶的财富中”。若按未校正的困难读法理解，也可译作“在你们的罪中”。
    reason: textual_variant
  - marker: b
    text: 直译为“他们看见了自己所有的日子”，可能指他们活着看尽一生，因寿数满足而被同类视为有福。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: 你们……有祸了
  rationale: 保留先知性谴责和审判宣告的语气；“有祸了”比单纯表示哀叹的“可悲啊”更符合上下文。
- source_word: ምውታን፡ ኃጥኣን
  choice: 死去的罪人
  rationale: 明确译出修饰“罪人”的“死去的”，并保留它与下文“当你们死……”之间原文刻意形成的重复。
- source_word: ሶበ፡ ትመውቱ
  choice: 当你们死……
  rationale: 按时间从句处理，保留警告的直接性。
- source_word: በብዕለ፡ ኃጢአትክሙ（据校正读法）
  choice: 在罪恶的财富中
  rationale: 现有转写的በብዕሲ很可能是OCR误读；校正读法በብዕለ指向“财富”，也与随后对罪人富足生活的反讽相连。译文保留“财富”与“罪恶”之间不寻常而富张力的组合。
- source_word: ወይብሉ፡ ዲቤክሙ
  choice: 就论到你们说
  rationale: 表达这些话是关于死去罪人的评价；措辞庄重而自然。
- source_word: እለ፡ ከማክሙ
  choice: 那些和你们一样的人
  rationale: 保留比较含义，指与受斥责者同类或品性相同的人。
- source_word: ብፁዓን፡ እሙንቱ
  choice: 这些罪人是有福的
  rationale: 保留类似祝福宣告的表达及其反讽，不改写成普通的“幸运”。
- source_word: ኵሎ፡ መዋዕሎሙ፡ ርእዩ
  choice: 他们看尽了自己一生的日子
  rationale: 尽量保留“看见所有日子”的原文意象，同时用“看尽”使现代汉语可读；其含义可能是活满一生。
theological_decisions:
- issue: 如何呈现同类罪人对死者的评价
  choice: 保留“这些罪人是有福的”这一反讽式祝福语
  alternative: 直接解释为“这些罪人真幸运，享尽了天年”
  rationale: 本节让神圣的“有祸”与人的“有福”判断彼此冲突。直译这种张力，避免替读者预先消解其讽刺和审判意味。
- issue: 是否消除“死去的罪人”与“当你们死”之间的重复
  choice: 保留重复
  alternative: 只译作“罪人哪，当你们死时”
  rationale: 原文明确出现“死去的”及“你们死”两个死亡表达；保留重复有助于呈现其修辞力度，也不应仅因汉语略显突兀而删减。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留启示文学中“有祸”与“有福”的对照，也保留原文关于死亡的刻意重复和“罪恶的财富”这一不寻常表达；仅在“看尽了自己一生的日子”处作最低限度的汉语顺畅化。
