  rationale: 修订仅补足校正读法中“你们”的属格，并将一个略生硬的连接表达调整为自然的现代书面汉语。保留“死去的罪人／当你们死”的重复、“罪恶的财富”的张力、反讽性的“有福”，以及“看尽日子”的字面意象和相应脚注。
