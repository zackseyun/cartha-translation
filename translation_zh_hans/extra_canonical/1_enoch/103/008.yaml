base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/008.yaml
  text: And into darkness and into a snare and into a blazing fire your spirits shall enter[a], into the great judgment; and the great judgment shall be for all the generations of eternity. Woe to you[e][d][c][b], for you have no peace.
translation:
  language: zh_hans
  text: 你们的灵[b]必进入黑暗、罗网[a]和燃烧的火焰，也进入大审判[c]；这大审判必临到永世的所有世代[d]。你们有祸了！因为你们没有平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗网”原文为单数，也可译作“网罗”或“陷阱”；这一形象可指无法逃脱的审判。
    reason: lexical_alternative
  - marker: b
    text: 原文名词“灵”为单数，但“你们的”指复数受话者；这里没有进一步说明身体、灵与死后状态的关系。
    reason: grammatical_note
  - marker: c
    text: 原文介词带有“向着、到达”的方向意味，因此译作“进入大审判”；也可理解为“到大审判那里”。
    reason: alternative_reading
  - marker: d
    text: “永世的所有世代”原文较难理解，可能强调这审判长久的效力、记忆或涵盖范围。
    reason: textual_ambiguity
lexical_decisions:
- source_word: በጽልመት
  choice: 进入黑暗
  rationale: 介词置于“进入”这一运动动词的范围内，表达进入某种领域或境况，而非仅仅身处黑暗。
- source_word: በመርበብት
  choice: 进入罗网
  rationale: 原词为单数，具有捕捉、困住的具体意象；“罗网”在现代汉语中庄重自然，也保留其可能的比喻意味。
- source_word: በላህብ ዘይነድድ
  choice: 进入燃烧的火焰
  rationale: 保留“火焰”及其“燃烧”的关系从句结构，不把意象弱化为一般的火。
- source_word: ኀበ ኵነኔ ዐባይ
  choice: 也进入大审判
  rationale: ኀበ具有朝向、到达的方向性；用“进入”承接前面的并列目的地，并以“也”使中文句法清楚。
- source_word: ትበውእ መንፈስክሙ
  choice: 你们的灵必进入
  rationale: 名词“灵”为单数，领属后缀指复数受话者；中文“你们的灵”同时保留这两点，不改释为“灵魂”或“你们自己”。
- source_word: ኵነኔ ዐባይ
  choice: 大审判
  rationale: “审判”保留司法行动、裁决及其后果的宽广语义，不缩窄为“定罪”或“刑罚”。
- source_word: ለኵሉ ትውልደ ዓለም
  choice: 临到永世的所有世代
  rationale: 保留“所有世代”与“永世”的双重表达，同时用“临到”使汉语可读，并呈现审判所涉及的范围。
- source_word: ኴሌ ለክሙ
  choice: 你们有祸了
  rationale: 采用现代汉语读者熟悉的先知性警告语式，保留原文强烈的宣告口吻。
- source_word: እስመ አልብክሙ ሰላመ
  choice: 因为你们没有平安
  rationale: 直接保留因果关系和“平安”的缺失，不将其解释成单纯的心理不安。
theological_decisions:
- issue: 审判语境中“你们的灵”的含义
  choice: 保留“你们的灵”
  alternative: 你们的灵魂；你们自己
  rationale: 原文明确使用单数“灵”配复数领属后缀。译文不借此断定完整的人论、死后状态或身体与灵的关系。
- issue: ኵነኔ的语义范围
  choice: 审判
  alternative: 定罪；判决；刑罚
  rationale: 上下文虽明显带有惩罚性，“审判”仍最能保留原词兼有审理、裁决和执行后果的宽度。
- issue: 大审判与“永世的所有世代”的关系
  choice: 译作“大审判必临到永世的所有世代”
  alternative: 大审判必存到永远；大审判是为永世的所有世代
  rationale: 原句关系不够明确，可能侧重审判的长久效力、持续记忆或涵盖范围；正文避免把它限定为某一种系统性的末世论解释。
translation_notes:
  register: 采用庄重而可理解的现代标准普通话。保留末世审判意象和原文并列推进的节奏；避免使用宗派化术语，也不把“灵”解释成完整的人论命题。
