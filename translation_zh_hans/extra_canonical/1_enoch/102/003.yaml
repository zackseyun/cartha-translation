base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/003.yaml
  text: And all the angels will carry out their commands[a], and they will seek to hide themselves from before the Great Glory; and the children of the earth will tremble and be thrown into confusion. But you sinners are accursed forever[d][c][b], and there will be no peace for you.
translation:
  language: zh_hans
  text: 所有天使都将执行他们的命令，也试图躲避“大荣耀”而藏匿自己[a]；地上的儿女[b]将战栗，陷入慌乱。至于你们这些罪人，你们永远受咒诅，必得不到平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从……面前”是闪语式表达，意为躲避某一位的临在。“大荣耀”在这里很可能是对神圣临在的敬称；原文没有直接说“神”。
    reason: lexical_alternative
  - marker: b
    text: “地上的儿女”是原文的直译，可广指地上的居民，尤其指审判之下的人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእክት
  choice: 天使
  rationale: 本节是天启文学的宇宙性审判场景，所指为天上的灵体，而非人间使者。
- source_word: ይፌጽሙ ትእዛዞሙ
  choice: 执行他们的命令
  rationale: 动词表示完成、履行或执行；“执行”自然保留命令的权威性。汉语“命令”本身不强制标明单复数，也避免在形态证据存在争议时过度限定。
- source_word: ይፈቅዱ ከመ ይትኀብኡ
  choice: 想……藏起来
  rationale: 前一动词可指愿望、意愿，接反身性的“藏匿”时，译作“想……藏起来”既自然，也不把意愿强化为明确成功的行动。
- source_word: እምቅድመ ዐቢይ ስብሐት
  choice: 从“大荣耀”面前
  rationale: “从……面前”保留闪语式临在表达；“大荣耀”保留原文以荣耀指称神圣临在的敬称，而不直接改写为“神”。
- source_word: ደቂቀ ምድር
  choice: 地上的儿女
  rationale: 保留原文生动的亲属性表达，不将其直接平化为“地上的居民”；脚注说明其广义所指。
- source_word: ይርዕዱ ወይትሀወኩ
  choice: 将战栗，陷入慌乱
  rationale: 前者描写因恐惧而身体发抖，后者表示骚动、困惑或失序；此译保持两个连续反应。
- source_word: ርጉማን ለዓለም
  choice: 永远受咒诅
  rationale: 保留庄严而持续的审判宣告，不弱化为一般性的责备。
- source_word: ወአልብክሙ ሰላመ
  choice: 必得不到平安
  rationale: 对应“你们没有平安”的判语；“必”传达此处面向罪人的确定性宣告，而不扩展“平安”的含义。
theological_decisions:
- issue: “大荣耀”的所指
  choice: 保留为带敬称性质的“大荣耀”
  alternative: 直接译作“神”或理解为抽象的宏大荣光
  rationale: 在《以诺一书》的天启语境中，这一表达可作为神圣临在或神本身的敬称；原文却未在此直接使用神名，因此正文保留其转喻和敬畏色彩，不将所指完全明说。
- issue: 天使隐藏自己的行动状态
  choice: 译为“想……藏起来”
  alternative: 译为“设法躲藏”或暗示已经成功藏匿
  rationale: 原文表达愿望或意图，未必说明行动成功；保留这一张力可避免削弱“大荣耀”无可逃避的威严。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。保留“大荣耀”和“地上的儿女”等天启文学意象；用引号标示“大荣耀”的称号性质，因为简体中文不能用英文式大写表达专名化。
