base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/001.yaml
  text: In those days[a], if a fierce fire descends upon you, where will you flee, and where will you be delivered? And when he lifts up his voice against you[d][c][b], will you not be shaken and fear?
translation:
  language: zh_hans
  text: 在那些日子，若有惊人的烈火[a]降在你们身上，你们能逃到哪里？又能在哪里获救？当他向你们扬声[b]时，你们岂不震动惧怕吗？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊人的”也可译作“非凡的”或“可怕的”；这里兼有令人惊异、令人畏惧的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文是主动表达，直译近于“他向你们发出他的声音”；在本句的审判语境中，这声音带有敌对或定罪的意味。
    reason: lexical_alternative
  - marker: c
    text: 这是反问，意思是：你们必定会震动惧怕。
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: 在那些日子
  rationale: 保留启示文学中常见的时间公式及庄重语体。
- source_word: ዕፁብ፡ እሳት
  choice: 惊人的烈火
  rationale: ዕፁብ 可指非凡、惊异或可怕；“惊人的”保留其语义张力，“烈火”则自然传达审判语境中的毁灭性。
- source_word: ወረደ፡ ዴቤክሙ
  choice: 降在你们身上
  rationale: 直陈火从上而降并临到复数受话者，保留鲜明的审判图景。
- source_word: በአይቴ፡ ትነፍፁ
  choice: 你们能逃到哪里
  rationale: 以现代汉语自然表达地点疑问和逃离动作，同时保留反问力度。
- source_word: በአይቴ፡ ትድኅኑ
  choice: 又能在哪里获救
  rationale: 准确表达解救、脱险的语义；在此首先是审判中的获救，不额外加入后期教义含义。
- source_word: ይወዲ፡ ቃሎ፡ ዴቤክሙ
  choice: 当他向你们扬声时
  rationale: 按主动及物结构和“发出/扬起声音”的习语处理，并保留“他”的阳性单数主语及针对受话者的方向。
- source_word: አኮ፡ ትትመሀከዉ፡ ወትፈርሁ
  choice: 你们岂不震动惧怕吗
  rationale: 保留期待肯定回答的否定反问；“震动惧怕”维持原文紧凑并列和启示文学的强烈语气。
theological_decisions:
- issue: “扬声”的主体及其话语是否应明确解释为神的司法判词
  choice: 正文保留“他向你们扬声”，不进一步点明主体或改写为“宣判”
  alternative: 译作“他的判词临到你们”或“神向你们发出判词”
  rationale: 原文的阳性单数形式支持“他”，语境也具有审判意味，但本句本身没有明说主体身份；保留声音意象可避免把隐含的司法意义变成明说的教义解释。
- issue: 末句反问的确定性
  choice: 保留“岂不……吗”的反问形式
  alternative: 改为陈述句“你们必震动惧怕”
  rationale: 反问确实预期肯定回答，但保留原有修辞形式更能传达警告的直接力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保持启示文学的警告感和连续反问；用“你们”体现原文复数受话者。对词义不确定处以脚注呈现，不在正文中消除“惊异/可怕”以及“声音/审判宣告”之间的张力。
