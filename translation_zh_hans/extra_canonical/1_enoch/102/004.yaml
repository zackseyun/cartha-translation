base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/004.yaml
  text: Do not fear[a], you souls of the righteous, and hope, you who have died in righteousness.
translation:
  language: zh_hans
  text: 你们这些义人的灵魂[a]，不要惧怕；你们这些在义中死去的人，要心怀盼望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“义人的灵”。吉兹语这个词依上下文可指灵魂、生命、自身或灵。
    reason: lexical_alternative
lexical_decisions:
- source_word: አትፍርሁ
  choice: 不要惧怕
  rationale: 这是复数否定命令式；译文保留直接劝勉的语气，并采用庄重而通行的现代汉语。
- source_word: አንትሙ
  choice: 你们
  rationale: 原文显式使用第二人称复数代词，汉语以“你们”保留复数呼语。
- source_word: ነፍሰ ጻድቃን
  choice: 义人的灵魂
  rationale: ነፍስ 可指灵魂、生命、自身或灵；鉴于此处向死去的义人发出劝勉，“灵魂”较贴合语境，同时不把该词严格限定为某种灵魂论术语。
- source_word: ወተስፈዉ
  choice: 要心怀盼望
  rationale: 该词在此表达命令或劝勉。直译“要盼望”在现代汉语中略显生硬，“要心怀盼望”自然地保留了劝勉力度和“盼望”这一名词性概念。
- source_word: እለ ሞትክሙ
  choice: 你们这些……死去的人
  rationale: 关系词与带第二人称复数成分的“死”构成对受众的进一步称呼；译为呼语式关系结构，以对应原文的直接对象。
- source_word: በጽድቅ
  choice: 在义中
  rationale: 保留介词短语及“义”的名词形式，不将其简化为“正直地”，从而维持原文在行为方式、生命状态或正义领域之间的语义张力。
theological_decisions:
- issue: 对死去义人的人论称谓
  choice: 义人的灵魂
  alternative: 义人的灵
  rationale: 经文把已经死去的义人当作可受劝勉的对象。“灵魂”能表达死后身份的延续，但脚注保留“灵”的可能，避免把吉兹语 ነፍስ 强行限定为精密的灵魂与灵之区分。
- issue: “在义中死去”的含义范围
  choice: 在义中死去
  alternative: 正直地死去
  rationale: “在义中”保留原文名词性介词结构，可涉及义的状态、生活取向或死亡时所处的正义关系；不把它单一解释为死亡方式。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“不要惧怕”与“要心怀盼望”形成平行劝勉；通过重复“你们这些”澄清两组表达指向同一批受众。
