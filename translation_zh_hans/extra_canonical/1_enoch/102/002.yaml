base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/002.yaml
  text: And all the luminaries shall be shaken with great fear[b][a], and the whole earth shall be shaken and tremble and quake.
translation:
  language: zh_hans
  text: 所有天上的光体[a]都必在极大的恐惧中震动；整个大地也必震动、颤抖，并且惊惶不已[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原词也可译作“众光”或“所有发光之物”；这里按宇宙审判的场景理解为天上的光体。
    reason: lexical_alternative
  - marker: b
    text: 这一末词的现有转录可能有误。若按可能的校复词形，意思是“惊恐、惊惶”；若依现有转录及其传统理解，也可译作“剧烈震动”。
    reason: textual_uncertainty
lexical_decisions:
- source_word: ኵሎሙ ብርሃናት
  choice: 所有天上的光体
  rationale: ብርሃናት本义为“光、发光之物”，在宇宙性审判的语境中最可能指天体；“天上的光体”既传达这一所指，也不把它限定为某一种天体。
- source_word: ይትመሀከዉ / ትትመሀከው
  choice: 震动
  rationale: 同一动词先用于天上光体，后用于大地；两处同译为“震动”，保留原文的重复和平行结构。
- source_word: በፍርሀት ዐቢይ
  choice: 在极大的恐惧中
  rationale: 保留介词短语在方式、状态或伴随情形之间的语义张力，不强行判定震动究竟是由恐惧引起，还是与恐惧同时发生。
- source_word: ኵላ ምድር
  choice: 整个大地
  rationale: 本节描写普世性的宇宙震荡，因此将ምድር译为“大地”，而非局部性的“土地”。
- source_word: ትርዕድ
  choice: 颤抖
  rationale: 用不同于“震动”的词表达第二个动作，保留原文逐步加强的动荡意象。
- source_word: ወትኜጕድ（转录可能有误；或应校作ወትደነግፅ）
  choice: 并且惊惶不已
  rationale: 现有转录的末词形态可疑；若按已提出的校复词形，动词表示惊恐、惊惶。此译也保留大地被人格化、与前文“恐惧”相呼应的效果，并以脚注交代文本不确定性。
theological_decisions:
- issue: ብርሃናት是指天体、一般的光，还是天使性的“发光者”
  choice: 天上的光体
  alternative: 众光；发光者
  rationale: 与“整个大地”并列以及宇宙震荡的场景较支持天体之意，但脚注保留该词更宽泛的词义，不将其解释为天使。
- issue: 末句是物理性的震动，还是人格化的惊恐
  choice: 惊惶不已
  alternative: 剧烈震动
  rationale: 来源转录的末词疑有识别讹误；可能的校复词形支持“惊恐”。正文据此呈现大地人格化的恐惧，同时用脚注保留按现有转录理解为物理震动的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“震动—颤抖—惊惶”的递进，以及天体与大地之间的平行；分号帮助读者看清两部分结构。
