base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/005.yaml
  text: And do not grieve if your soul has gone down into Sheol in sorrow[a], and your flesh did not fare according to your goodness during your life; but wait for the day of the judgment of sinners[c][b], and for the day of curse and punishment.
translation:
  language: zh_hans
  text: 即使你们的灵魂忧伤地下到阴间[a]，你们的肉身在世时没有获得与你们的良善相称的待遇[b]，也不要悲伤；却要耐心等候罪人受审判的日子，以及咒诅和刑罚的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“阴间”指古代犹太启示文学观念中死者所在的领域，不一定等同于后来基督教观念中的“地狱”。
    reason: cultural_note
  - marker: b
    text: 原文“获得／领受”的具体对象没有明说。这里的“待遇”是依上下文作出的谨慎表达，可能指他们在世时没有得到与其良善相称的回报。也可译作：“你们的肉身在世时没有得到你们的良善所应得的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: አት ኅዘኑ
  choice: 不要悲伤
  rationale: 这是对复数听众的否定命令；“悲伤”自然保留其情感力度，并与下文“带着忧伤”形成呼应。
- source_word: ወረደት ነፍስክሙ ውስተ ሲኦል
  choice: 你们的魂……下到阴间
  rationale: “下到”保留原文明确的下降意象；“魂”对应ነፍስ，“阴间”则采用现代中文可理解的传统用语，同时借脚注限定其古代犹太语境。
- source_word: በሐዘን
  choice: 带着忧伤
  rationale: 将忧伤理解为伴随魂下到阴间的状态，也与句中的“不要悲伤”保持词义呼应。
- source_word: ኢረከበ ሥጋክሙ በሕይወትክሙ
  choice: 你们的肉身在有生之年没有……有所领受
  rationale: 保留“肉身”这一具体且具有神学分量的表达；“有所领受”在中文中容许宾语不明说，既通顺，也不擅自补入“奖赏”。
- source_word: በከመ ኂሩትክሙ
  choice: 按你们的良善
  rationale: 保留原文宽泛的“良善”，不将其收窄为功德、善行或仁慈，也不在正文中明确加入报偿观念。
- source_word: አላ ጽንሑ
  choice: 只要坚忍等候
  rationale: 兼顾动词所含的坚持、忍耐之意及其后等待某一日子的时间指向，比单用“等候”更充分。
- source_word: ለዕለተ እንተ ኵነኔ ኃጥኣን
  choice: 罪人受审判的日子
  rationale: 清楚表达罪人是审判所针对的对象，并保留启示文学中庄严的“日子”公式。
- source_word: መርገም ወመቅሠፍት
  choice: 咒诅和刑罚
  rationale: 以简洁的并列词组呈现恶人将面对的结局；“刑罚”保留司法与惩治意味，而不限定具体受苦方式。
theological_decisions:
- issue: ሲኦል所指的死者领域
  choice: 译作“阴间”，并以脚注说明其古代犹太语境
  alternative: 音译作“示奥尔”，或译作“坟墓”“地狱”
  rationale: “阴间”对普通中文读者自然易懂，又能表达死者所在的领域；脚注防止把它直接等同于后期基督教观念中的“地狱”。
- issue: 肉身“没有领受”的隐含宾语
  choice: 正文作“没有按你们的良善有所领受”，不补明宾语
  alternative: 明确译作“没有得到应有的报偿”或“没有得到奖赏”
  rationale: 上下文很可能指义人在世时未按其良善获得相称回报，但原文未明说所领受之物；正文保留这一开放性，脚注再说明可能含义。
- issue: 对未来伸冤与审判的表达
  choice: 保留“罪人受审判的日子”及“咒诅和刑罚的日子”
  alternative: 概括为“上帝施行公义的日子”
  rationale: 原文具体点出罪人、咒诅和刑罚；不将其抽象化，也不额外补入原句未明说的主语。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“魂”“肉身”“阴间”等词保留原文的人论与启示文学意象；句法略作调整，使开头的让步条件与“不要悲伤”在中文中连贯。
