  to: 即使你们的灵魂忧伤地下到阴间[a]，你们的肉身在世时没有获得与你们的良善相称的待遇[b]，也不要悲伤；却要耐心等候罪人受审判的日子，以及咒诅和刑罚的日子。
  rationale: 修订使中文句法更自然，并将原文中无明示宾语的“领受”处理为语境所指的“相称待遇”。脚注明确说明该词并非原文明确写出的对象，以免把“回报”当作唯一可能的字面宾语。其余关键术语和末世审判意象均予保留。
