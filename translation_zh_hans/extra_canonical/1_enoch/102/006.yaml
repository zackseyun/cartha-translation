  text: And when you die[a], the sinners will say concerning you[b],
translation:
  language: zh_hans
  text: 你们死的时候，罪人会谈论你们[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谈论你们”所对应的原文，字面有“在你们之上”的意味；在言说的语境中可指“关于你们”。按敌对语境，也可能理解为“针对你们说”或“出言攻击你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: ……的时候
  rationale: 带连接词的时间表达，意为“当……时”；本句承接上文，不必在中文中生硬加上“并且”。
- source_word: ትመውቱ
  choice: 你们死
  rationale: 第二人称复数，源自动词“死”；置于“……的时候”结构中，以现代汉语现在形式表达将来的时间情境。
- source_word: ይብሉ
  choice: 说
  rationale: 该动词的基本义是“说”。这里引出后续话语，译作“说”比“出言攻击”更能保留其引语框架功能。
- source_word: ላዕሌክሙ
  choice: 谈到你们
  rationale: 该介词短语字面有“在你们之上”的意味，在言说语境中可指“关于你们”。“谈到你们”自然地保留话题义，同时不排除上下文中的敌意。
- source_word: ኃጥኣን
  choice: 罪人
  rationale: 这是以道德身份指称的一类人；中文“罪人”简洁、自然，并与以诺传统中的审判语境相符。
theological_decisions:
- issue: 罪人言说的性质
  choice: 罪人会谈到你们，说
  alternative: 罪人会出言攻击你们
  rationale: 原文介词的意义较宽，可表示“关于”，也可能在敌对语境中带有“针对”的意味。正文采用话题义，以保留该句引出后续直接话语的结构；脚注提示可能的敌意，不把语义张力提前定死。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“说”后的冒号表明本句引出下文话语；避免把原文宽泛的介词短语直接限定为敌意攻击。
