base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/001.yaml
  text: And there I saw one who had a head of days[a], and his head was like white wool; and with him was another, whose face was like the appearance of a man, and his face was full of grace[c][b], like one of the holy angels.
translation:
  language: zh_hans
  text: 我在那里看见一位，有着“岁月之首”[a]，他的头如白羊毛；又有另一位与他同在，他的脸如同人的形貌[c]，他的脸满有恩典[b]，如同圣天使中的一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亘古常在者”。吉兹语更直译为“岁月之首”，正文保留了这一表达。
    reason: lexical_alternative
  - marker: b
    text: “满有恩典”是对吉兹语的直接翻译，不应视为借用了后来的新约措辞。
    reason: cross_reference
  - marker: c
    text: 也可译作“他的脸有人的形貌”。正文译出原文明确的比较词“如同”。
    reason: previous_rendering
lexical_decisions:
- source_word: በህየ፡ ርኢኩ
  choice: 我在那里看见
  rationale: 以简明的异象叙述表达地点副词和第一人称所见，不增添原文没有的动作。
- source_word: ዘሎቱ፡ ርእሰ፡ መዋዕል
  choice: 一位具有“岁月之首”的
  rationale: 尽量透明地保留吉兹语“日子／岁月之首”这一醒目而不寻常的说法，不在正文中直接套用《但以理书》的传统称号。引号帮助现代读者识别这是特殊表达，而不是普通身体描写。
- source_word: ወርእሱ፡ ከመ፡ ፀምር፡ ጻዕዳ
  choice: 他的头如白羊毛
  rationale: 原文说“头”而未明确说“头发”；保留“头”，同时用“如”呈现比较结构。
- source_word: ወምስሌሁ፡ ካልእ
  choice: 另有一位与他同在
  rationale: 自然表达第二位形象的出现及陪伴关系，不预先赋予其称号或身份。
- source_word: ዘገጹ፡ ከመ፡ ርእየተ፡ ሰብእ
  choice: 他的脸如同人的形貌
  rationale: 明确译出ከመ“如同”，保留本节多个比较句的平行结构，也不将这位形象直接解释为“人子”。
- source_word: ወምሉእ፡ ጸጋ፡ ገጹ
  choice: 他的脸满有恩典
  rationale: 直接呈现ጸጋ所含的恩典、恩惠之义，并保留其修饰脸面的独特表达。
- source_word: ከመ፡ ፩እመላእክት፡ ቅዱሳን
  choice: 仿佛一位圣天使
  rationale: 传达“一位／一个属于圣天使之列者”的分举含义，并再次译出比较词。
theological_decisions:
- issue: 是否把ርእሰ መዋዕል直接译成《但以理书》的传统称号
  choice: 岁月之首
  alternative: 亘古常在者
  rationale: 吉兹语在此字面为“岁月之首”；正文保留其特殊意象，脚注提供熟悉的传统对应，避免无声地协调经文。
- issue: 是否在本节把第二位形象直接认定为“人子”
  choice: 另有一位……他的脸如同人的形貌
  alternative: 人子
  rationale: 本节只按外貌引入第二位形象，尚未在这里使用称号；描述性翻译保留身份逐步显明所形成的神学张力。
- issue: ጸጋ是否因后期经文用语而改译得较弱
  choice: 恩典
  alternative: 恩惠；恩美
  rationale: “恩典”直接表达该词的核心语义；不因其在后期基督教文本中较为熟悉而回避，但以脚注说明此译法来自本节吉兹语自身。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“岁月之首”的陌生意象及三个比较结构；不使用古奥的“观之”“其面”等文言形式，也不在正文中提前确定第二位形象的神学身份。所有脚注标记均已置于正文相应位置。
