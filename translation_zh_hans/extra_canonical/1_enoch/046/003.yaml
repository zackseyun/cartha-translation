base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/003.yaml
  text: And he answered me and said to me[a], “This is the Son of Man, to whom righteousness belongs, and righteousness dwells with him; and he will reveal all the treasuries of what is hidden, because the Lord of Spirits has chosen him[c][b], and his lot has prevailed before the Lord of Spirits forever in uprightness.”
translation:
  language: zh_hans
  text: 他回答我，对我说：“这位就是人子，公义属于他，公义也与他同住；他要显明一切隐藏之物的宝库[a]，因为万灵之主拣选了他；他的份[b]在万灵之主面前永远在正直中得胜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“隐藏之物的库房”。这里的图像是隐而未显的事物被收藏在宝库中，不只是泛指抽象的“秘密”。
    reason: lexical_alternative
  - marker: b
    text: “他的份”也可理解为“他所得的分”或“他所定的地位”；本句格阿兹语艰涩，也有人理解为与他相关之人的份。末尾也可理解为“永远以正直得胜”。
    reason: alternative_reading
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: 那人子
  rationale: 这是格阿兹语中“人子”的固定表达；在本异象中指向一位正在被辨明的特定人物。用“那人子”体现其特指和称号色彩，同时不把后期教义内容带入本节。
- source_word: ዘሎቱ ኮነ ጽድቅ
  choice: 公义属于他
  rationale: 该结构表达归属或具有，而不只是以形容词断言他是公义的；此译保留原文的关系意味。
- source_word: ወጽድቅ ምስሌሁ ኃደረ
  choice: 公义也与他同住
  rationale: 动词有居住、停留之意；“与他同住”保留了原文把公义近似人格化的异象语言，也保留与上一分句的重复加强。
- source_word: መዛግብተ ዘኅቡእ
  choice: 隐藏之物的宝库
  rationale: 名词可指宝库或库房，描绘隐秘之物被储存在天上，而不只是抽象的“秘密”。
- source_word: ይከሥት
  choice: 他要显明
  rationale: 在此处未来意义符合这位人物将承担的启示职分；“显明”兼顾揭开和使之可见的含义。
- source_word: እግዚአ መንፈሳት
  choice: 万灵之主
  rationale: 这是《以诺一书》中反复出现的神圣称号；“万灵之主”是自然、庄重的现代汉语表达。
- source_word: ኀረዮ ኃርየ
  choice: 拣选了他
  rationale: 原文以同源形式加强“选择”的动作。汉语不宜机械重复，故用“拣选了他”传达其意义和庄重语体。
- source_word: ዘክፍሉ ሞአ
  choice: 他的份得胜
  rationale: 该难句似指分给他的份、所得的分或所定的地位取得胜利。“份”保留分配意象，“得胜”对应动态动词，同时以脚注说明其他可能理解。
- source_word: በርቱዕ ለዓለም
  choice: 永远持守正直
  rationale: 末尾结构较难。“永远”保留时间意义；“持守正直”以自然汉语表达其正直、坚定的状态，并避免在同一节中第三次重复“公义”。
theological_decisions:
- issue: ወልደ ሰብእ应作为称号还是一般的人类描述
  choice: 译作具有称号色彩的“那人子”
  alternative: “一个人子”或“那位人”
  rationale: 异象中的问答是在辨明一位具有特定启示职分的人物，语境支持特指；但译文不额外引入新约或后期基督论表述。
- issue: 如何处理关于公义的两个重复分句
  choice: 同时保留“公义属于他”和“公义也与他同住”
  alternative: 合并为“他是那公义者”
  rationale: 重复是原文有意的加强，并呈现公义与这位人物之间两层既相近又不完全相同的关系，不应为求简练而消除。
- issue: 末句“他的份得胜”的含义
  choice: 正文近照表层语法译为“他的份……得胜”，并加脚注说明不确定性
  alternative: “他的分永远存留”或“属他之人的份得胜”
  rationale: 格阿兹语此处艰涩，且缺少足以定夺的外部文本见证。正文不作过度解释，以脚注保存“份、所得之分、所定地位”等可能性。
- issue: 关系结构与汉语句法的处理
  choice: 译成独立而承接前文的“他的份……得胜”
  alternative: 直译为“其份得胜的那一位”或“并且他的份……”
  rationale: 原文关系成分继续描述人子，但若在汉语中机械保留，会导致句法拖沓或关系不清；改用承接性的独立分句，仍明确主语所属，不改变所指。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“那人子”“万灵之主”保留本书独特的异象称谓；句式尽量贴近原文层层推进的描述，同时以分号缓解长句负担。所有不确定性均留在脚注中，没有在正文内作宗派化解释。
