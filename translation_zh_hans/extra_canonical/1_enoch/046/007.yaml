  text: 这些就是审判天上众星者[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的动词也可理解为“统管”或“治理”。由于这段经文基本上仅以吉兹语保存下来，确切语义仍须谨慎看待。
    reason: lexical_alternative
  - marker: b
