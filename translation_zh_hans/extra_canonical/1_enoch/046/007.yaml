    reason: cultural_note
lexical_decisions:
- source_word: እሙንቱ
  choice: 这些
  rationale: 这是复数指示代词；译作“这些”，保留异象叙述中的指示意味。
- source_word: ኮኑ
  choice: 就是
  rationale: 该词源于“是／成为”；此处为辨认性陈述，用“就是”自然地连接指示对象与后面的关系从句。
- source_word: እለ
  choice: ……的
  rationale: 这是引出限定性关系从句的标记；汉语以“……的”构成名词化关系结构，表达“那些……者”。
- source_word: ይኴንኑ
  choice: 审判
  rationale: 保留该动词的核心司法含义，同时不排除“统管、治理”的可能语气。
- source_word: ከዋክብተ ሰማይ
  choice: 天上众星
  rationale: 直接表达“天／天界之星”的构词关系；“众星”自然、庄重，并保留启示文学的宇宙意象。
theological_decisions:
- issue: 此句应表达对众星的审判，还是较弱的宇宙治理
  choice: 审判天上众星
  alternative: 统管天上众星／治理天上众星
  rationale: 吉兹语动词以“审判”最能体现其词义核心；众星在启示文学中又可能指天体或天上众灵，因此保留司法用语，不把其中的神学张力化约为一般行政管理。
- issue: “众星”是否应明确解释为天上的灵体
  choice: 保留“天上众星”而不在正文中解释
  alternative: 天上的众灵／以众星象征的天使
  rationale: 原文并未在本句中明确消除天体与天上存在者之间的歧义，正文不应替读者作出定论。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“这些就是……的”保留辨认性句式；“天上众星”维持启示文学的崇高宇宙意象。正文中的[a][b]均有对应脚注。
