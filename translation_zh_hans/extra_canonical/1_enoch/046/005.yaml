revisions:
- from: 他要把列王从他们的宝座和国位上推翻，因为他们不尊他为至高，不赞美他，也不承认那赐给他们王权的是谁。[a]
  to: 他要把列王从他们的宝座上、从他们的国中推翻下来，因为他们不高举他，不赞美他，也不承认他们的王权是从哪里赐给他们的。[a]
  rationale: 修订以“高举他”还原动词的直接意义，避免加入“至高”的称号性解释；以“从哪里”保留原文关于来源的语义开放性，并将“从谁”置于脚注。对前半句的句法作轻微调整，使“宝座”与“国”两个并列的剥夺对象在现代汉语中更清楚自然，同时不改变审判意象。
