  naturalness: 原译整体庄重流畅，但“从他们的宝座和国位上推翻”中“国位上”与“宝座上”并列稍显滞涩。改为“从他们的宝座上、从他们的国中推翻下来”可较清晰地保留两个并列的剥夺领域。
  terminology: “列王”“宝座”“赞美”“王权”均合乎本段庄重语体。“高举他”比“不尊他为至高”更贴近动词本义，也避免将代词所指或称号写实。“王权”可保留，但应以脚注说明相关词亦可指王国／国度。
