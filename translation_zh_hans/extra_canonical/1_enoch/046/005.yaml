base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/005.yaml
  text: And he will cast down the kings from their thrones and from their kingdoms[a], because they do not exalt him, and do not praise him[c][b], and do not acknowledge from where the kingdom was given to them.
translation:
  language: zh_hans
  text: 他要把列王从他们的宝座上、从他们的国中推翻下来，因为他们不高举他，不赞美他，也不承认他们的王权是从哪里赐给他们的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从哪里”也可译作“从谁”；“王权”也可译作“王国”“国度”或“统治权”。
    reason: 原文关于王权来源的表达可指来源之处，也可在本语境中理解为赐予者；相关名词兼有王权、王国及统治领域之义。
lexical_decisions:
- source_word: ይገፈትኦሙ
  choice: 推翻
  rationale: 表达强力使列王失去权位，保留审判场景的力度；比行政性的“罢黜”更符合启示文学语境。
- source_word: ነገሥት
  choice: 列王
  rationale: 原词明确指众王；“列王”自然、庄重，也与宝座和国位的王权意象相称。
- source_word: መናብርቲሆሙ
  choice: 他们的宝座
  rationale: 在列王受审的语境中指王座，而非普通座位。
- source_word: መንገሥቲሆሙ
  choice: 国位
  rationale: 此处与“宝座”并列，侧重列王所占据的统治地位或王权领域；“国位”既保留王国含义，也避免仅理解为疆土。
- source_word: ኢያሌዕልዎ
  choice: 不尊他为至高
  rationale: 原动词有高举、尊为高之意；此译在现代汉语中自然，并保留其强于一般“尊敬”的含义。
- source_word: ኢይሴብሕዎ
  choice: 不赞美他
  rationale: 直接表达赞颂、荣耀之义，同时与前面的“尊他为至高”有所区分。
- source_word: ኢይገንዩ
  choice: 不承认
  rationale: 语境强调列王不承认其王权的来源；不额外加入“谦卑”等解释性修饰，以免消除词义张力。
- source_word: እምአይቴ
  choice: 是谁
  rationale: 该表达可指来源为“哪里”，也可在本语境中指“谁”；主文采用更符合赐予者为有位格者的汉语说法，并以脚注保留另一可能。
- source_word: ተውህበት ሎሙ መንግሥት
  choice: 赐给他们王权
  rationale: 保留被动赐予的关系；“王权”比“王国”更能涵盖君王身份、统治权柄和国度，不局限于领土。
theological_decisions:
- issue: “他”以及王权赐予者的所指
  choice: 保留“他”，不在正文中加上“至高者”“主”或“蒙拣选者”等称号；末句以未具名的赐予者表达。
  alternative: 把“他”明确解释为至高者，或按紧邻语境解释为蒙拣选者。
  rationale: 本节本身只用代词，并未明说称号。保留代词可维持上下文中的神学张力，避免把某一解释写入正文。
- issue: መንግሥት 所指
  choice: 译作“王权”。
  alternative: 译作“王国”或“国度”。
  rationale: 此处关注列王所得的统治权威；“王权”能避免将含义限缩为疆域，同时承认原词也可表示王国。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“列王”“宝座”保留启示文学的王权意象；句法避免生硬照搬原文，并用脚注保存来源表达和“王权”一词的真实歧义。
