base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/004.yaml
  text: And this Son of Man whom you have seen will raise up kings and the mighty from their couches, and the strong from their thrones; and he will loosen the loins of the strong, and crush the teeth of sinners.
translation:
  language: zh_hans
  text: 你所看见的这位人子，要使君王和权贵从卧榻上起来[a]，使强者从宝座上起来；他要解开强者的腰带[b]，并击碎罪人的牙齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卧榻”也可译作“床榻”。这里描绘统治者被迫从安逸或自以为稳固的位置上起来，并非受到高举。
    reason: lexical_alternative
  - marker: b
    text: 现存吉兹语文本此处的词形含义有疑难。正文按“解开强者的腰带（或腰间束带）”理解，可能指解除其力量或备战状态；也有人把该词理解为缰绳、带子等约束之物。
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: 人子
  rationale: 保留闪语式称谓；本段指异象中已经明确出现的特定人物，但不借译文额外引入后期神学含义。
- source_word: ዘርኢከ
  choice: 你所看见的
  rationale: 自然表达关系结构，并保留对先前异象所见人物的直接指称。
- source_word: ያነሥኦሙ
  choice: 要使……起来
  rationale: 原动词的基本意象是使之起来；在审判语境中并非高举，而是迫使统治者离开安逸或稳固的位置。保留具体意象，避免直接释作“废黜”。
- source_word: እምስካበቲሆሙ
  choice: 从卧榻上
  rationale: 名词可指床或卧榻；“卧榻”既符合宫廷场景，也传达安逸之所的形象。
- source_word: ጽኑዓን
  choice: 强者
  rationale: 保留具体、重复的称呼，指权势稳固的人。
- source_word: መናብርቲሆሙ
  choice: 宝座
  rationale: 在君王与审判语境中译作“宝座”最自然，也保留政治权力意象。
- source_word: ይፈትሕ
  choice: 使……松脱
  rationale: 原义为解开、松开；与腰部意象结合，表达力量和备战状态被解除。
- source_word: ኃማተ
  choice: 腰间
  rationale: 该词在现存吉兹语文本中有疑难；结合《以赛亚书》45:1所见“松开君王的腰带/腰间”式审判意象，采用“腰间”，同时以脚注说明文本不确定性。
- source_word: ይደቅቅ
  choice: 击碎
  rationale: 保留强烈的审判动作和末世性修辞。
- source_word: አስናነ ኃጥኣን
  choice: 罪人的牙齿
  rationale: 直译具体形象，不抽象化为消除能力或权势。
theological_decisions:
- issue: ወልደ ሰብእ 是称号还是泛指普通人
  choice: 采用具有特定指向的“这位人子”
  alternative: “一个人子”或“那位人”
  rationale: 比喻篇的上下文已使此人物个体化，并赋予审判职能；译文保留原有称谓，却不超出本段强行套入后期教义。
- issue: 如何表达对君王和强者的审判行动
  choice: 保留“使……从……起来”的具体图像
  alternative: 译为“废黜”或“使……降卑”
  rationale: 原文使用鲜明的末世审判图像；抽象化会抹去修辞力度，也会掩盖动词本身的含义范围。
- issue: “松开强者的腰间”所表达的意义
  choice: 保留身体与束腰意象，并以脚注提示其含义和文本疑难
  alternative: 直接释作“夺去强者的力量”
  rationale: 该表达可能描绘腰带被解开、力量或备战能力被解除；直译加注能保留原文张力而不把解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“人子”“宝座”“击碎牙齿”等启示文学的具体意象；以“腰间松脱”避免现代汉语中“放松缰绳”可能造成的反向联想，并通过脚注保存词义与文本的不确定性。
