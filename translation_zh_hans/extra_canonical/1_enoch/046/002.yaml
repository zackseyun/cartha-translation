base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/002.yaml
  text: And I asked one of the angels who was going with me[a], and who was showing me all the hidden things, concerning that Son of Man—who he was, and from where he came[c][b], and why he was going with the Head of Days.
translation:
  language: zh_hans
  text: 我问那位与我同行、向我展示一切隐秘之事[a]的天使，关于那位“人子”：他是谁，出自何处，为什么与“诸日之首”同行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一切奥秘”。这里指异象中原本隐藏、如今被指示出来的天上之事。
    reason: lexical_alternative
  - marker: b
    text: “诸日之首”直译埃塞俄比亚语的称谓。传统译本受《但以理书》措辞影响，常采用相当于“亘古常在者”或“亘古者”的称呼。
    reason: cross_reference
lexical_decisions:
- source_word: ተስእልክዎ
  choice: 我就问
  rationale: 该动词直接引出以诺向同行天使发问；“问”自然简明，“就”承接异象叙事。
- source_word: ፩እመላእክት
  choice: 那位……天使
  rationale: 原文是“众天使中的一位”；汉语以关系从句限定“那位天使”，已自然表达他是与以诺同行并为他指示隐秘之事的那一位，未增添“圣”等原文没有的修饰。
- source_word: ዘየሐውር ምስሌየ
  choice: 与我同行
  rationale: 保留进行中的同行意象，同时符合现代汉语叙事表达。
- source_word: ኵሎ ኅቡኣተ
  choice: 一切隐秘之事
  rationale: 指异象中原本隐藏而获揭示的天上事物；“隐秘之事”既透明又不把它固定为后来的技术术语。
- source_word: ዘያርእየኒ
  choice: 指给我看
  rationale: 兼顾该动词的视觉性和启示性，比单用“启示”更贴近异象中实际观看的语境。
- source_word: ወልደ ሰብእ
  choice: 那位“人子”
  rationale: 指异象中已被明确辨识的一位人物；引号标示其称号性，同时不借中文大小写加入后来的教义结论。
- source_word: እምአይቴ ይከውን
  choice: 出自何处
  rationale: 保留对其来源或来处的询问；“出自何处”比逐字的“从哪里是”自然，也不必把问题限定为一次具体的来到行动。
- source_word: ርእሰ መዋዕል
  choice: 诸日之首
  rationale: 直接反映埃塞俄比亚语“日子之首”的构词，避免无声地与《但以理书》的传统称谓合并。
- source_word: ምስለ ... የሐውር
  choice: 与……同行
  rationale: 保留原文重复出现的行走动词，以及“人子”与“诸日之首”同行的鲜明图景。
theological_decisions:
- issue: ወልደ ሰብእ应译作称号还是泛指的人
  choice: 译作“那位‘人子’”
  alternative: 那个人；那个人的儿子
  rationale: 指示语和上下文都把他呈现为异象中一位特定人物。引号体现文学上的称号性，但不预先判定其与后期基督论用法的关系。
- issue: 是否把ርእሰ መዋዕል协调为《但以理书》的传统称谓
  choice: 正文译作“诸日之首”
  alternative: 亘古常在者；万古者
  rationale: 埃塞俄比亚语字面为“诸日之首”，并不等同于传统译法。正文保留本书措辞，脚注说明其与《但以理书》称谓的关联，而不消除两者之间的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。关系从句经适度重组，避免欧化长句；“同行”在本节两处重复，以保留原文的叙事呼应。称号加引号而不依赖大小写，既便于普通读者辨认，也避免过度教义化。
