base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/006.yaml
  text: And he will cast down the face of the strong ones[a], and he will fill them with shame; and darkness shall become their dwelling, and worms their bed. And they shall have no hope of rising from their beds[c][b], because they do not exalt the name of the Lord of Spirits.
translation:
  language: zh_hans
  text: 他要使强者颜面扫地，使他们满怀羞耻；黑暗要成为他们的住处，虫子[a]要成为他们的床榻。他们不指望能从床榻上起来[b]，因为他们不尊崇万灵之主的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虫子”所据的吉兹文词形在这一抄本见证中略有不确定；此义与床榻如坟墓、充满腐朽的审判图景相符。
    reason: textual_variant
  - marker: b
    text: “从床榻上起来”可以只是指起身；但在这里黑暗与虫子的语境中，也可能暗示受审判后不能复起或恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: ገጸ፡ ጽኑዓን፡ ይገፈትእ
  choice: 他要使强者颜面扫地
  rationale: 保留第三人称阳性单数主动动词的主语“他”，并以现代汉语的“颜面扫地”表达“使强者的脸面落下”这一具体的受辱、倾覆意象，避免误译为被动句。
- source_word: ይመልኦሙ፡ ኃፍረተ
  choice: 使他们满怀羞耻
  rationale: 按原文主动结构处理：“他”使“他们”充满羞耻；既保留施事者，也体现羞耻充满他们的结果。
- source_word: ጽልመት፡ ይከውኖሙ፡ መንደሪሆሙ
  choice: 黑暗要成为他们的住处
  rationale: 直陈审判场景中的黑暗与居所意象，不将其抽象化为一般的悲惨境况。
- source_word: ዕፀያት፡ ይከውኖሙ፡ ምስካቦሙ
  choice: 虫子要成为他们的床榻
  rationale: “虫子”符合坟墓、腐朽与审判的图景；“床榻”保留原文的卧具意象，而不直接解释成坟墓。底本文字形态有一定不确定性，故加注。
- source_word: ወኢይሴፈዉ፡ ከመ፡ ይትነሥኡ፡ እምስካቦቲሆሙ
  choice: 他们不再指望能从床榻上起来
  rationale: “起来”既可指从床上起身，也可能在死亡审判语境中暗含不再复起或复兴；译文保留这种开放性。
- source_word: ኢያሌዕሉ፡ ስሞ
  choice: 他们不尊崇……的名
  rationale: “尊崇”表达高举、显为尊大的含义，比一般的“尊敬”更贴近原动词，同时符合现代庄重汉语。
- source_word: እግዚአ፡ መናፍስት
  choice: 万灵之主
  rationale: 作为《以诺一书》反复出现的神圣称号，“万灵之主”简洁、庄重，并清楚表达“众灵的主”。
theological_decisions:
- issue: “起来”是否明确指复活
  choice: 译为“从床榻上起来”，不明确限定为复活。
  alternative: 译为“从床榻上复活”或“被举起来”。
  rationale: 虫子、黑暗和床榻共同形成死亡与审判的图景，可能带有复起或复活意味；但原动词本身也可泛指起身，因此不应在正文中消除这层张力。
- issue: ጽኑዓን所指群体的身份
  choice: 译为“强者”。
  alternative: 译为“权贵”或“强大的统治者”。
  rationale: 原词表示强大有力的人，本节本身没有明说他们是君王或统治者；采用较宽泛的称呼，避免增添社会政治身份。
- issue: 前两句的施事者与语态
  choice: 两句均保留主动施事者“他”。
  alternative: 译为“强者的脸面必被击倒，羞耻必充满他们”。
  rationale: 原文两个动词均由第三人称阳性单数“他”施行；保留主动结构，也延续上文施行审判者的行动。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“颜面扫地”自然传达脸面被压下的受辱意象；“床榻”保留启示文学的凝重感；神圣称号统一作“万灵之主”。
