base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/042/001.yaml
  text: Wisdom found no place where she might dwell[b][a], and her dwelling was in the heavens.
translation:
  language: zh_hans
  text: 智慧找不到可供她居住的地方；[b]她的居所在诸天之中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“天”为复数，故译作“诸天”；这是启示文学中描述天上领域的常见说法。
    reason: lexical_alternative
  - marker: b
    text: 两句在原文中由通常表示“和”的连词连接；按语境也可理解为“但她的居所……”或“于是她的居所……”。
    reason: source_ambiguity
lexical_decisions:
- source_word: ጥበብ
  choice: 智慧
  rationale: 作主动寻找居所的主体，并以“她”回指，保留原文中人格化的智慧形象。
- source_word: መካነ ኢረከበት
  choice: 找不到……地方
  rationale: 按否定完成式与前置宾语的关系，表达未能找到地方；现代汉语自然且不额外限定地点。
- source_word: ኀበ ተኃድር
  choice: 她可以安居
  rationale: 表达所寻找之地的用途；“安居”保留居住、停驻的意象，并符合庄重而通顺的现代汉语。
- source_word: ወሀለወ
  choice: ；她的居所在
  rationale: 以分号并列两句，保留ግዕዝ语连词ወ的基本并列性质，不强行判定为转折或结果关系。
- source_word: ማኅደራ
  choice: 她的居所
  rationale: 保留居住意象及人格化的阴性回指，并与前句“安居”形成词义呼应。
- source_word: ውስተ ሰማያት
  choice: 在诸天之中
  rationale: “诸天”反映原文复数形式，“之中”传达ውስተ的空间含义，并保留启示文学的宇宙性语域。
theological_decisions:
- issue: “智慧”应作为人格化形象还是抽象品质
  choice: 以“智慧”为行动主体，并用“她”回指
  alternative: 将其非人格化地译为“没有地方可容智慧居住”
  rationale: 原文让智慧寻找并拥有居所；人格化属于经文本身的智慧传统意象，不宜消解为纯抽象概念。
- issue: 连接词ወ应明确译为转折、结果还是并列
  choice: 采用分号并列，不在正文中强加逻辑关系
  alternative: 译作“但她的居所……”或“于是她的居所……”
  rationale: ወ主要是并列连词，语境虽可容许转折或承接理解，却不足以要求正文只选其中一种；并列能保存原文张力。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“安居—居所”保留原文反复出现的居住意象；分号模拟原文简洁的并列结构。“她”明确智慧的人格化，同时不把这一形象解释为特定教义身份。
