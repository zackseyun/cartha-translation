base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/001.yaml
  text: And I saw one of those four who had come out first, and he seized that first star which had fallen from heaven, and bound its hands and its feet, and threw it into the abyss. And that abyss was narrow and deep and dreadful and dark.
translation:
  language: zh_hans
  text: 我又看见最先出来的那四位中的一位[a]；他抓住那第一颗从天上坠落的星[b]，捆住它的手脚，把它扔进深渊[c]。那深渊又狭窄，又深，又可怕，又黑暗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最先”也可理解为“先前”；原文没有“在他们前面”中的“他们”。
    reason: 说明时间／次序副词的语义范围，并避免补入原文没有的代词。
  - marker: b
    text: 这颗“星”有手有脚，显示异象中的星象征一位正受审判的天上存在。
    reason: 帮助读者理解异象符号，同时不在正文中把“星”直接改译为“天使”。
  - marker: c
    text: 或译“极深之处”。原词表示幽深之地；这里译作“深渊”，以保留其作为拘禁之所的末世异象色彩。
    reason: 提供词义替代，并说明语境化选择。
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我又看见
  rationale: 保留异象叙事中连续推进的“我看见”框架；“又”自然表达句首连接词。
- source_word: አሐደ፡ እምእልኩ፡ ፬እለ፡ ወፅኡ፡ እምቅዳሚ
  choice: 最先出来的那四位中的一位
  rationale: “那四位”保留回指，“中的一位”表达从四位中选取一位；将 እምቅዳሚ 按副词义译作“最先”，不补入原文没有的“他们”。
- source_word: አሐዘ
  choice: 抓住
  rationale: 比“拿住”更有力度，符合随后捆绑和投入深渊的拘捕场景，同时保持现代汉语自然。
- source_word: ለዝኩ፡ ኮከብ፡ ቀዳማይ
  choice: 那颗……第一颗星
  rationale: 保留指示成分和序数“第一”，与前文“最先”的词义呼应；量词“颗”符合现代汉语习惯。
- source_word: ዘወድቀ፡ እምሰማየ
  choice: 从天上坠落的
  rationale: “坠落”保留由天而下的异象画面，并使该关系从句自然修饰“星”。
- source_word: ወአሰረ፡ እደዊሁ፡ ወእገሪሁ
  choice: 捆住它的手脚
  rationale: “手脚”简洁准确地表达双手和双脚；以“它”承接象征性的“星”，不在正文中直接解释为天使或改用男性代词。
- source_word: ወወደዮ፡ ውስተ፡ ማዕምቅ
  choice: 把它扔进深渊
  rationale: “扔进”体现惩罚动作的力度；“深渊”保留末世异象中幽深拘禁之地的意象。
- source_word: ጸቢብ፡ ወዕሙቅ፡ ወዕጹብ፡ ወጽልመት
  choice: 狭窄、幽深、可怕而黑暗
  rationale: 依次保留四项累积描写；“幽深”比单用“深”更适合空间意象，“可怕”自然表达令人畏惧的性质。
theological_decisions:
- issue: 是否在正文中把坠落的“星”直接译成天使或其他有位格的天上存在
  choice: 保留“星”，并以“它的手脚”呈现异象中兼具象征物与有位格存在的张力。
  alternative: 直接译作“天使”，或全程使用“他”。
  rationale: 吉兹文明确使用“星”，同时又赋予其手脚。正文不应以解释取代异象符号，也不应消除其位格性暗示。
- issue: 深渊是否应具体化为地狱或刑罚坑
  choice: 译作“深渊”。
  alternative: 译作“深坑”“幽冥”或“地狱”。
  rationale: 原词首先表达极深之处；“深渊”既保留拘禁和审判语境，又不把它等同于某一更具体的神学地点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句法尽量贴近吉兹文的动作次序，同时用分号和“把”字句避免汉语拖沓。末句以四个并列形容词保留原文逐层累积的压迫感，不引入宗派性术语。
