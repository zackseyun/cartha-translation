base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/002.yaml
  text: And one of them drew a sword and gave it to those elephants and camels and donkeys[a], and they began to strike one another.
translation:
  language: zh_hans
  text: 他们中的一个拔出一把剑，把剑交给那些大象、骆驼和驴[a]；它们就开始互相击打。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文末句较难。这里谨慎译作这些动物领受剑后开始互相施暴；“开始互相击打”并非唯一可能的译法。
    reason: textual_variant
lexical_decisions:
- source_word: መላሕ ሰይፈ
  choice: 拔出一把剑
  rationale: 结合“剑”的宾语，此处最自然地表示拔出或取出武器；“拔出”既具体，也符合异象叙事的动作感。
- source_word: ወወሀቦሙ
  choice: 交给
  rationale: 保留直接转交之意；现代汉语中“交给”比机械直译为“给了它们”更自然，同时不增加解释。
- source_word: ለእልኩ ነጌያት ወአገማል ወአእዱግ
  choice: 给那些大象、骆驼和驴
  rationale: 照原文保留异象中的三类动物，不把它们直接解释为国家、民族或军队。
- source_word: አንዘ እንዘ ይትደአ
  choice: 它们就开始彼此击打
  rationale: 末尾埃塞俄比亚文较难；此译谨慎表达领受剑以后暴力相向的开始，并保留具体的身体动作。
theological_decisions:
- issue: 动物意象的性质
  choice: 正文保留大象、骆驼和驴等字面动物名称，作为异象符号呈现
  alternative: 在正文中直接译解为不同民族、国家或军队
  rationale: 《动物启示录》以动物形象承载象征意义；翻译应保留异象本身，不把象征对象提前定死。
- issue: 彼此暴力的表述
  choice: 译作“开始彼此击打”
  alternative: 译作“彼此争战”或明确说“用剑互相残杀”
  rationale: 原文末句有困难；采用较克制的表述，既呈现相互暴力，也不擅自补明每个动作都由剑造成或达到杀戮程度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以“拔出一把剑”“交给”“彼此击打”保持动作清楚、语言自然；保留原文异象的动物名称及末句的不确定性。
