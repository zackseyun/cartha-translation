base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/004.yaml
  text: And after that time there came a great upheaval upon the earth[a], and a voice was heard from heaven[b], and I fell on my face.
translation:
  language: zh_hans
  text: 在那之后，地上发生了大动荡[a]；有声音从天上传来，我就俯伏在地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “动荡”也可译作“骚动”、“混乱”或“震动”；原词并未明确限定为地震。
    reason: lexical_alternative
  - marker: b
    text: 末句的文本存在困难：动词形式看似为复数（“他们倒下”），但“我的脸”中的后缀是第一人称单数。这里依照紧接的第一人称叙事，译作“我就俯伏在地”。
    reason: textual_variant
lexical_decisions:
- source_word: በድኅሬ ውእቱ ጊዜ
  choice: 那时以后
  rationale: 保留介词短语的时间先后关系及指示词的指向，同时采用自然、庄重的现代汉语。
- source_word: ሀውክ ዐቢይ
  choice: 大动荡
  rationale: ሀውክ可指骚动、混乱或震荡；“大动荡”保留末世异象中的强烈扰动感，又不把它限定为地震或政治骚乱。
- source_word: ዲበ ምድር
  choice: 地上
  rationale: 简明表达“在地之上”，并与本段宇宙性的语境相称。
- source_word: ተሰምዐ ቃል እምሰማይ
  choice: 有声音从天上传来
  rationale: ቃል可表示话语、声音或声响；此处译作“声音”可体现来自天上的启示，又不擅自补入具体话语内容。“传来”自然表达被动的“被听见”。
- source_word: ወወደቁ በገጽየ
  choice: 我就俯伏在地
  rationale: 现存词形中的动词表面上是复数，但በገጽየ含第一人称单数后缀，字面关联“我的脸”；结合以诺的第一人称叙述，取“我俯伏在地”，并用脚注保留文本困难。
theological_decisions:
- issue: ሀውክ所指扰动的性质
  choice: 用“大动荡”保留宇宙性、末世性的广义扰动
  alternative: 大混乱；大骚动；大震动
  rationale: 上下文具有审判和异象色彩，但原词并未明确限定为地震、心理混乱或政治骚乱，因此不作过度具体化。
- issue: 末句主语及俯伏动作
  choice: 按第一人称叙事译为“我就俯伏在地”
  alternative: 他们倒在我面前；他们倒在我的脸上（极不自然的字面组合）
  rationale: 动词形式与第一人称单数所有格之间存在张力。第一人称读法最符合紧邻语境，但文本歧义不应被隐去，故在脚注中说明。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。句式简洁，保留异象文学的力度；“俯伏在地”自然传达脸伏于地的姿态。脚注标记均已置于正文相应位置。
