base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/003.yaml
  text: And I said to him[a], “Tell me, what is this that is being done upon the earth? For the earth has labored thus and has been shaken[c][b]; perhaps I will perish with it.”
translation:
  language: zh_hans
  text: 我对他说：“请告诉我，地上正在发生的这是什么事？因为大地如此劳苦[a]，又受了震动；也许我会和它一同灭亡[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为大地如此阵痛。”原文动词在这里较难确定；“劳苦”保留大地受苦和剧烈动荡的形象，却不把它明确限定为生产之痛。
    reason: lexical_alternative
  - marker: b
    text: 末句也可更明确地表达恐惧：“我恐怕会和它一同灭亡。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግረኒ
  choice: 请告诉我
  rationale: 这是带第一人称宾语后缀的命令式；译为“请告诉我”自然、直接，也保留了说话者向对方求问的语气。
- source_word: ምንት ውእቱ ዘይትገበር
  choice: 正在发生的这一切究竟是什么
  rationale: 关系动词形式指向正在进行或当前可见之事；“这一切”体现指示意味，“究竟”使现代汉语问句自然，但不增添实质内容。
- source_word: ዲበ ምድር
  choice: 地上
  rationale: 简洁保留处所意义，符合现代汉语庄重叙述。
- source_word: እስመ ከመዝ ሰርሐት ምድር
  choice: 因为大地如此劳苦
  rationale: 此处动词含义较难确定；“劳苦”保留大地人格化、承受痛苦或艰难运作的意象，同时不在正文中过度限定为生产之痛。
- source_word: ወአንቀልቅለት
  choice: 又震动起来
  rationale: 表达剧烈摇动；“震动起来”在汉语中既可呈现地震般的运动，也容纳更广泛的宇宙性动荡。
- source_word: ዮጊ አነ እትኃጐል ምስሌሃ
  choice: 也许我会和它一同灭亡
  rationale: ዮጊ 可表达“也许”或带忧惧意味的“恐怕”；采用“也许”避免把末句误解为前述震动的目的。阴性代词所指为“大地”。
theological_decisions:
- issue: 大地苦难的性质
  choice: 保留大地本身劳苦并震动的宇宙性、人格化图景
  alternative: 将其仅理解为地上人类行为造成的道德败坏，或仅指普通地震
  rationale: “大地劳苦”与“震动”并列表明受扰动的是大地本身，契合审判语境中的启示文学意象；译文不把它缩减为单纯道德陈述或自然现象。
- issue: 末句的语法关系
  choice: 用分号断开，并译作“也许我会和它一同灭亡”
  alternative: 译作“免得我和它一同灭亡”或“我恐怕会和它一同灭亡”
  rationale: 原词可容纳“也许／恐怕”和“免得”的色彩。正文采用可能性表达，以避免产生“大地震动是为了防止说话者灭亡”的错误目的关系；脚注保留恐惧语气的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大地”承载启示文学中的人格化与宇宙性意象；整体句式保持直接求问和紧迫忧惧，不使用古奥文言。
