base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/006.yaml
  text: And a command went out from before the Lord against those who dwell on the dry land[a], that their end should come; for they knew all the hidden things of the angels, and all the violence of the satans[c][b], and all their secret powers.
translation:
  language: zh_hans
  text: 有一道命令从主面前发出[a]，针对那些住在旱地上的人，要使他们灭亡；因为他们知道天使的一切隐秘之事、众撒但的一切暴行[b]，以及他们一切隐秘的力量[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从主面前”也可译作“从主的临在中”；这是表示命令由神那里发出的敬称表达。
    reason: lexical_alternative
  - marker: b
    text: 原文“撒但”为复数，并非后来作为单一专名的“撒但”。这个词本义与“敌对者”有关。
    reason: lexical_alternative
  - marker: c
    text: 这个埃塞俄比亚语抄本的末尾措辞较难确定；可能意为“他们一切隐秘的力量”，也可能与隐秘法术或其施行者有关。
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: 命令
  rationale: 表示带有权威的指令；“命令”既保留其强制性，也不额外赋予法律诏令的意味。
- source_word: ወጽአ እምቅድመ ገጸ እግዚአ
  choice: 从主面前发出
  rationale: 保留闪语式敬称结构及命令由神临在之处发出的图景，同时符合现代汉语表达。
- source_word: ዲበ እለ የሐድሩ የብስ
  choice: 针对那些住在旱地上的人
  rationale: የብስ直指干地、旱地；洪水审判语境中的水陆对照应予保留。介词在此带敌对、审判意味，故译“针对”。
- source_word: ከመ ውእቱ ይኩን ሕልቀትሙ
  choice: 要使他们灭亡
  rationale: ሕልቀት可指终局、毁灭或灭亡；本句审判语境明确，译作“灭亡”简洁自然，但不说明具体毁灭方式。
- source_word: ኵሎ ኅቡኣተ መላእክት
  choice: 天使的一切隐秘之事
  rationale: 贴近“天使的所有隐藏之物”，避免以“奥秘”等术语增加后期神学色彩。
- source_word: ግፍዐ ሰይጣናት
  choice: 众撒但的一切暴行
  rationale: ግፍዕ可表示暴力、压迫或恶行；“暴行”兼顾行为与暴力色彩。ሰይጣናት为复数，故用“众撒但”明确保留。
- source_word: ኃይሎሙ ኅቡአ
  choice: 他们一切隐秘的力量
  rationale: 保留力量与隐秘性的结合；汉语用“力量”可自然涵盖集合性或多种能力，不强行判定单复数。
theological_decisions:
- issue: ሰይጣናት的复数形式
  choice: 众撒但
  alternative: 撒但；众敌对者；邪灵
  rationale: 原文明确使用复数。音译并加“众”既保留文本自身的邪灵观面貌，也避免按后期传统将其统一为单一专名。
- issue: “住在旱地上的人”的审判范围
  choice: 保留旱地居民这一具体图景
  alternative: 地上的所有人；某一类罪人
  rationale: 本章挪亚洪水背景使“旱地”具有鲜明对照意义；正文不进一步限定这些人的身份或审判范围。
- issue: 末尾隐秘力量的困难读法
  choice: 他们一切隐秘的力量
  alternative: 他们所有隐藏的权能；与隐秘法术或其施行者有关的力量
  rationale: 现有埃塞俄比亚语见证末尾形式重复且不稳定。正文采用最直接、最少推断的句法理解，并以脚注保留不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“主面前”“旱地”“众撒但”等启示文学图景；不把复数形式单数化，也不在正文中把困难末语明确解释为巫术施行者。
