revisions:
- from: 他从那里抬起双脚，走到大地的尽头；他向他的祖父以诺呼喊。挪亚用痛苦的声音说：“听我说！听我说！听我说！”——一连三次。
  to: 他抬起双脚，离开那里，走到大地的尽头；他向自己的祖先以诺呼喊。挪亚以悲苦的声音说：“听我说！听我说！听我说！”——一连三次。
  rationale: 修订仅处理现代汉语的自然度及“祖父”在严格代际意义上的潜在误导。经文仍保留抬脚、从原处离开、前往大地尽头、向以诺呼喊，以及挪亚以悲苦声音三次呼求的全部信息；没有将“挪亚”错误置入引语，也没有作教义性协调。
