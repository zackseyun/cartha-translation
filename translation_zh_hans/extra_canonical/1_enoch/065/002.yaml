base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/002.yaml
  text: And he lifted up his feet from there and went as far as the ends of the earth[a], and he cried out to his grandfather Enoch, and Noah said with a bitter voice, “Hear me, hear me[d][c][b], hear me,” three times.
translation:
  language: zh_hans
  text: 他抬起双脚，离开那里，走到大地的尽头；他向自己的祖先以诺呼喊。挪亚以悲苦的声音说：“听我说！听我说！听我说！”——一连三次。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንሥአ፡ እገሪሁ
  choice: 抬起双脚
  rationale: 保留原文具体的身体动作意象，而不笼统改写为“动身”。
- source_word: እምህየ፡ ወሖረ
  choice: 从那里……走
  rationale: 自然表达叙事中的离开和行进，不额外限定行程方式。
- source_word: አጽናፈ፡ ምድር
  choice: 大地的尽头
  rationale: 保留启示文学中具有宇宙地理色彩的惯用表达。
- source_word: ጸርኀ፡ ለአምኄው፡ ሄኖክ
  choice: 向他的祖父以诺呼喊
  rationale: አምኄው 指“他的祖父/祖先”；结合叙事关系译为“他的祖父以诺”，避免旧 consultation layer 将其误解为“儿子”。
- source_word: ወይቤ፡ ኖኅ
  choice: 挪亚……说
  rationale: 按吉兹语常见的动词—主语语序理解，挪亚是“说”的明确主语，并非呼格或引语内容。
- source_word: በቃል፡ መሪር
  choice: 用痛苦的声音
  rationale: መሪር 的基本意象是“苦”；此处修饰声音，现代汉语以“痛苦的声音”自然传达强烈悲苦。
- source_word: ስምዐኒ
  choice: 听我说
  rationale: 表达命令式及第一人称宾语；比孤立的“听我”更符合现代汉语，同时保留急切语气。
- source_word: ሥልሰ
  choice: 一连三次
  rationale: 明确说明同一句呼求重复三次，并使中文句末结构自然。
theological_decisions:
- issue: 以诺与挪亚的亲属称谓
  choice: 译作“他的祖父以诺”
  alternative: 译作“他的祖先以诺”或误作“他的儿子以诺”
  rationale: 吉兹语词形支持“祖父/祖先”，而非“儿子”。“祖父”可作为较宽泛的父系先祖称谓，不应为配合现代严格代际称呼而改动原词。
- issue: “挪亚说”的句法归属
  choice: 将挪亚作为“说”的主语
  alternative: 把“挪亚”置于引语中，当作呼格
  rationale: ወይቤ፡ ኖኅ 符合吉兹语动词—主语次序，句法本身并无须人为制造的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抬起双脚”刻意保留原文较具体的动作表达；以感叹号呈现三次呼求的急迫感。
