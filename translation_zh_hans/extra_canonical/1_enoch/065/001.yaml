base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/001.yaml
  text: In those days Noah saw that the earth had sunk down[a], and that its destruction was near.
translation:
  language: zh_hans
  text: 那些日子，挪亚看见大地沉陷了[a]，它的毁灭已经临近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“沉陷了”的吉兹语词句较难确定，也可能表示大地下沉、坍塌，或受到猛烈震动。
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: 那些日子
  rationale: 保留启示文学中反复出现的庄重时间套语；比“那时”更贴近原文的复数形式。
- source_word: ርእየ
  choice: 看见
  rationale: 采用现代汉语中自然、直接的视觉动词，既可描述亲眼所见，也不排除异象语境。
- source_word: ኖኅ
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ምድረ
  choice: 大地
  rationale: 此处语境指向洪水前的普世性灾变；“大地”既有宇宙性尺度，也保留可见地面的意象。
- source_word: ከመ፡ አጽነነት
  choice: 沉陷了
  rationale: 该词形在现存吉兹语见证中词义较难确定。“沉陷”保留大地失稳、下沉或坍塌的具体图景，同时不武断指定其机制。
- source_word: ወከመ፡ ቅሩብ፡ ሐጕላ
  choice: 它的毁灭已经临近
  rationale: “临近”准确表达ቅሩብ的迫近含义；“它的毁灭”承接前述“大地”，并保留洪水审判语境中的强烈灾变意味。
theological_decisions:
- issue: 大地的状况应理解为道德败坏，还是物理性的失稳
  choice: 以物理图景译作“大地沉陷了”
  alternative: “大地败坏了”或“大地震动了”
  rationale: 原文描述的是挪亚所“看见”的大地状况，较自然地指向可见的物理异变。译文保留启示文学中的灾变图景，不把它消解为抽象的道德评语；脚注同时承认词义的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那些日子”保留启示文学的叙事语调；“沉陷”较“塌陷”略具宏阔感，又不使用古奥措辞。主句按中文习惯补出“它的”，明确毁灭所指，同时不增加原文以外的神学解释。
