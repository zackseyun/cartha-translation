base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/005.yaml
  text: And my grandfather Enoch came and stood beside me[a], and he said to me[b], “Why have you cried out to me with a bitter cry and weeping?”
translation:
  language: zh_hans
  text: 我的祖父以诺来到，站在我身旁，对我说：“你为什么向我痛苦地呼喊，并且哭泣呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的吉兹语OCR转写在此处有误，曾将“我的祖父”误读为“从我的住处”；结合本章上文及该亲属称谓，译作“我的祖父”更为可靠。
    reason: textual_variant
lexical_decisions:
- source_word: እምሐው*የ
  choice: 我的祖父
  rationale: 传抄文本所示形式受损，星号也标明读法可疑；结合本章上文及可还原的吉兹语亲属称谓，宜读作带第一人称后缀的“我的祖父”，而不是把开头误析为“从”。
- source_word: መጽአ፡ ሄኖክ
  choice: 以诺来到
  rationale: መጽአ是叙事中常见的移动动词，译作“来到”自然直接，并保留人物进入现场的动作。
- source_word: ቆመ፡ ኀቤየ
  choice: 来到我身边，站在那里
  rationale: ቆመ表示“站立”，ኀቤየ表示朝向或靠近“我”；中文拆译为“来到我身边，站在那里”，既自然，也保留他在说话者近旁站定的画面。
- source_word: በምንት
  choice: 为什么
  rationale: 这是询问原因的疑问表达，现代汉语以“为什么”最为清楚自然。
- source_word: ጸራሕከ፡ ኀቤየ
  choice: 你为什么向我发出……呼喊
  rationale: 动词指高声呼叫，且ኀቤየ表明呼喊的对象是“我”；“向我发出呼喊”保留了方向和声音强度。
- source_word: ጽራኀ፡ መሪረ
  choice: 痛苦的呼喊
  rationale: 该名词与形容词构成强烈的哀痛表达；“痛苦的呼喊”比普通的“喊叫”更能传达其悲苦意味，同时符合现代汉语。
- source_word: ብካየ
  choice: 哭泣
  rationale: 该词指哭泣或哀哭；译作“哭泣”与前面的“痛苦的呼喊”共同保留原文双重描写悲痛的修辞。
theological_decisions:
- issue: 以诺与说话者的亲属关系
  choice: 译作“我的祖父以诺”，如实保留第一人称亲属称谓
  alternative: 仅译作“以诺”，或依受损字形译作“以诺从我的住处来”
  rationale: 较可信的字形还原和本章语境支持“我的祖父”。这也呈现叙事中的亲属关系，却不在本节内额外点明说话者身份，避免超出经文本身作解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来到我身边，站在那里”避免生硬直译；问句保留原文责问中带有关切的语气。脚注仅说明真正影响译文的文本问题，不借此判定说话者在更大叙事中的身份。
