base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/004/001.yaml
  text: And again[a], observe the days of summer—how the sun comes upon it at its beginning, and you seek shelter and shade because of the heat of the sun[c][b], and the earth is scorched with burning heat, and you cannot tread on the earth or upon a rock because of its heat.
translation:
  language: zh_hans
  text: 再者，你们要察看[a]夏日：太阳如何在夏初照临[b]；你们因太阳的炎热而寻找遮蔽和阴凉[c]；大地被炙热烤得滚烫，你们因这热气，既不能踏在地上，也不能踏在岩石上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察看”也可译作“查问”或“考察”。
    reason: lexical_alternative
  - marker: b
    text: 本句在吉兹语中含义较难确定；也可能更具体地指夏季开始时太阳的威力。
    reason: textual_variant
  - marker: c
    text: “遮蔽和阴凉”保留了吉兹语中两个近义词并列的表达，没有将其合并为一个词。
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳግመ
  choice: 再者
  rationale: 作为承接上文另一例证的话语标记，保留原文反复劝人观察受造界的行文方式。
- source_word: ጠየቁ
  choice: 察看
  rationale: 该复数命令式可指询问、查究或考察；本段语境要求读者观察自然现象，且对应的希腊语旁证支持“仔细观察”的含义。
- source_word: መዋዕለ ሐጋይ
  choice: 夏日
  rationale: 保留“日子”的具体表达，同时在现代汉语中自然地指夏季时日。
- source_word: ከመ ኮነ ፀሓይ ላዕሌሃ በቅድሜሃ
  choice: 太阳在夏季开始时如何照临其上
  rationale: 原句所指关系和措辞均较难确定；“照临其上”保留空间意象，“在夏季开始时”表达季节初始，却不把太阳的具体动作解释得过细。
- source_word: ተኀሥሡ ምጽላለ ወጽላሎተ
  choice: 寻找遮蔽和阴凉
  rationale: 表达为躲避酷热而寻求庇护，并保留原文两个近义名词的并列表达。
- source_word: በእንተ ዋዕየ ፀሓይ
  choice: 因太阳的炎热
  rationale: 直接表达太阳所带来的强烈热力，不添加审判等解释。
- source_word: ወምድርኒ ትውዒ እሙቀተ ሐሩር
  choice: 大地被灼热烤得滚烫
  rationale: 兼顾大地受热、灼烧及结果状态的鲜明感官意象，中文表达自然。
- source_word: ወአንትሙሰ ኢትክሉ ከይዶታ ለምድር ወኢ ኰኵሐ በእንተ ዋዕያ
  choice: 你们因这热气，既不能踏在地上，也不能踏在岩石上
  rationale: 完整恢复订正后的吉兹语末句，并以“既……也……”清楚保留地面与岩石的并列。
theological_decisions:
- issue: 自然景象作为神学见证
  choice: 按受造界季节现象作观察性描述
  alternative: 直接解释为借自然界预示上帝的审判
  rationale: 本节本身描述夏季酷热；其神学作用由上下文呈现，不在译文中加入原文未明说的道德化或审判性解释。
- issue: 困难短语中太阳与季节的关系
  choice: 保留“照临其上”的含混指向，并用脚注说明
  alternative: 明确译作“夏初太阳变得更加强烈”或“太阳升到大地上方”
  rationale: 吉兹语短语的代词所指及太阳动作并不完全清楚，故不选定单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现连续观察到的夏季现象；保留第二人称复数“你们”和命令语气。译文避免古奥措辞，也不把本节自然景象预先解释为某一宗派性的神学结论。
