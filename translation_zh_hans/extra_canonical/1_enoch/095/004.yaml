base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/004.yaml
  text: Woe to you who pronounce curses that cannot be undone[c][b][a], and healing is far from you because of your sins.
translation:
  language: zh_hans
  text: 你们这些发出无法解除的咒诅的人有祸了！因你们的罪，医治远离你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: 你们……有祸了
  rationale: 保留先知性祸哉宣告的审判语气，同时采用现代汉语自然句式。
- source_word: እለ፡ ታወግዙ፡ ግዘታተ
  choice: 这些发出……咒诅的人
  rationale: 按修订后的词源判断，将动词与同源宾语理解为宣告、施加咒诅，而非称量银子；“发出咒诅”在现代汉语中清楚而庄重。
- source_word: ከመ፡ እ ይትፈትሑ
  choice: 无法解除的
  rationale: 依据此处很可能应连读为否定词ኢ与ፈትሐ的被动形式，表达咒诅不能被解开或撤销；“解除”也保留了原文‘解开’的意象。
- source_word: ወፈውስ
  choice: 医治
  rationale: 既可指治疗，也可保留道德与属灵复原的含义，不把意义限缩为身体痊愈。
- source_word: ርኁቅ፡ እምኔክሙ
  choice: 远离你们
  rationale: 直接保留空间隐喻，汉语表达自然。
- source_word: በእንተ፡ ኃጢአተ፡ ዚአክሙ
  choice: 因你们的罪
  rationale: 准确表达原因关系，并保留“罪”的复数集合意义所指向的多重罪行。
theological_decisions:
- issue: 经济行为还是咒诅行为
  choice: 正文译为“发出……咒诅”
  alternative: “称量银子”或“估定钱财”
  rationale: 最新校勘指出ታወግዙ与ግዘታተ构成同源的咒诅/禁制表达；旧译的经济含义源于误析，故不在正文中保留。
- issue: 咒诅不能被解除的表达强度
  choice: “无法解除的咒诅”
  alternative: “不能解开的禁制”或“不可撤销的诅咒”
  rationale: “解除”兼顾原词‘解开、释放’的意象和现代汉语可读性；不进一步说明是谁不能解除，以免补入原文未明说的施事者。
- issue: 医治的范围
  choice: 保留“医治”而不具体解释
  alternative: “补救”或“痊愈”
  rationale: 原文可以兼具身体、道德和属灵复原的意味，宽泛译法保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。前半句以“有祸了”呈现启示文学中的审判宣告；后半句保持简洁和平行感。原文所据转写在否定词处疑有分词/OCR问题，但修订证据足以支持正文，不另设脚注。
