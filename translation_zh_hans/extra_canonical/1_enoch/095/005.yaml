base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/005.yaml
  text: Woe to you who repay evil to your neighbor, for you will be repaid according to your deeds.
translation:
  language: zh_hans
  text: 你们这些以恶报邻舍的人有祸了！因为你们必照自己的行为受报。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文前后两句使用同一词根：以恶“报”邻舍的人，自己也必“受报”。
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: 你们……有祸了
  rationale: 保留先知性审判宣告的力度，同时采用自然、庄重的现代汉语句式。
- source_word: እለ
  choice: 这些……的人
  rationale: 将关系词与受话对象连成直接谴责的句式。
- source_word: ትፈድዩ
  choice: 以……报
  rationale: 表达以恶回报他人的意思，并与后句“受报”形成同根呼应。
- source_word: እኩየ
  choice: 恶
  rationale: 保留其宽泛的道德与伤害含义，不限于具体的身体伤害。
- source_word: ለቢጽክሙ
  choice: 邻舍
  rationale: 指与自己处于社会关系中的他人；“邻舍”符合经文语体，也保留人际伦理意味。
- source_word: እስመ
  choice: 因为
  rationale: 明确引出前述祸患宣告的理由。
- source_word: ትትፈድዩ
  choice: 必……受报
  rationale: 保留被动表达，不明说施行报应者，并与前句的“报”构成刻意的对应。
- source_word: በከመ
  choice: 照
  rationale: 简洁表达报应以人的行为为尺度或准则。
- source_word: ምግባሪክሙ
  choice: 自己的行为
  rationale: 自然表达受话者所行之事，适合审判语境；“自己”明确回指受话者。
theological_decisions:
- issue: 报应陈述的性质
  choice: 采用不说明施事者的被动式“受报”
  alternative: 明确译为“上帝必照你们的行为报应你们”，或理解为恶行自然反噬行为人
  rationale: 原文没有明说施事者。上下文可使人联想到神圣或司法性的审判，但译文不应替原文消除这种含蓄与张力。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“有祸了”保留末世审判宣告的力度；“以恶报邻舍／受报”兼顾汉语自然度与原文的词根呼应。
