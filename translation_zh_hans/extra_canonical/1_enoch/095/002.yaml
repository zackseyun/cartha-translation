base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/002.yaml
  text: Who has allowed you to do hatred and evil? And condemnation will overtake you sinners[a][b].
translation:
  language: zh_hans
  text: 谁准许你们作出仇恨和邪恶的事？定罪[a]必临到你们这些罪人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定罪”也可译作“审判”或“判决”；此处语境强调不利的裁决。
    reason: lexical_range
  - marker: b
    text: 原文直译近于“必临到你们——罪人”；“罪人”与“你们”构成同位关系。
    reason: source_syntax
lexical_decisions:
- source_word: መኑ
  choice: 谁
  rationale: 保留反问开头的直接责备语气。
- source_word: ወሀበክሙ ከመ ትግበሩ
  choice: 准许你们行
  rationale: “给”与ከመ从句连用，在此表达授权或准许；译作“准许……行”比逐字译法自然，也符合责问语境。
- source_word: ጽልአ
  choice: 仇恨
  rationale: 该词可指仇恨、敌意；“仇恨”保留其鲜明的道德分量。
- source_word: ወእኩየ
  choice: 和邪恶之事
  rationale: 这是宽泛的道德恶词；补出“之事”使“行仇恨和邪恶”在现代汉语中更顺畅而不缩窄含义。
- source_word: ይረከበክሙ
  choice: 必追上你们
  rationale: 动词可指找到、临到或追上；审判语境中的“追上”传达无法逃脱的迫近感。
- source_word: ለኃጥኣን
  choice: 你们这些罪人
  rationale: 此处的ለ可作宾格标记，“罪人”与动词中先行出现的第二人称复数宾语相呼应，故按同位关系表达。
- source_word: ኵነኔ
  choice: 定罪
  rationale: 这是司法性词语，语境所指不是中性的审查，而是不利的判决。
theological_decisions:
- issue: ኵነኔ应译为较宽泛的“审判”还是明确的“定罪”
  choice: 定罪
  alternative: 审判；判决
  rationale: 本节处在谴责恶人的语境中，司法结果具有明确的不利性质；“定罪”保留这种惩罚性，同时用脚注提示词义范围。
- issue: ለኃጥኣን与第二人称复数宾语的句法关系
  choice: 按同位关系译作“你们这些罪人”
  alternative: 为罪人；临到罪人
  rationale: 这里的ለ最可能是宾格标记，“罪人”说明动词后缀所指的“你们”；该处理符合吉兹语句法，也不把对象改成另一群人。
translation_notes:
  register: 采用现代、庄重而直接的责问语气。“行……之事”略带经文体色彩，但普通读者易懂；“必追上”保留末世审判不可逃避的力度。
