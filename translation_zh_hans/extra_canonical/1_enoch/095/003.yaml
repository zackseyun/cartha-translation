base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/003.yaml
  text: Do not fear the sinners[a], O righteous ones, for again the Lord will deliver them into your hands[c][b], so that you may execute judgment upon them according to your pleasure.
translation:
  language: zh_hans
  text: 义人哪，不要惧怕那些罪人[a]，因为主必再次把他们交在你们手中[b]，使你们可以照自己的意愿[c]向他们施行审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要因那些罪人而害怕。”原文介词可表达“因／由于”或“从……而来”；正文按自然汉语译作惧怕的对象。
    reason: lexical_alternative
  - marker: b
    text: “交在你们手中”是指把他们置于你们的权力或控制之下。
    reason: cultural_note
  - marker: c
    text: 或译：“按你们所愿的。”这句话描绘处境的逆转：义人获得权柄，审判曾压迫他们的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: 不要惧怕
  rationale: 复数否定命令式，直接劝勉义人；“不要惧怕”自然、庄重，并保留原句力度。
- source_word: ጻድቃን
  choice: 义人哪
  rationale: 将复数名词用作呼语，既显明受话群体，也符合现代汉语庄重劝诫的表达。
- source_word: እምኃጥኣን
  choice: 那些罪人
  rationale: 介词እም在恐惧结构中可有“因／由于”或指向恐惧对象的作用；正文采用自然汉语“惧怕那些罪人”，脚注保留另一种关系理解。
- source_word: ካዕበ
  choice: 再次
  rationale: 表达重复或再度发生的行动，也契合本节所呈现的处境逆转。
- source_word: ያገብኦሙ
  choice: 必……把他们交
  rationale: 结合“在你们手中”表示将人交入他者权下；“交在”保留司法与权力转移的意味。
- source_word: ውስተ እዴክሙ
  choice: 在你们手中
  rationale: 保留原文生动的“手”之习语，在汉语中同样可表示处于某人的权力或控制之下。
- source_word: ከመ ትግበሩ
  choice: 使你们可以……施行
  rationale: 保留目的从句；与“审判”搭配时，“施行”比直译“做”更符合汉语司法语体。
- source_word: ኵነኔ
  choice: 审判
  rationale: 保留司法性与末世性语域，不把含义限定为判决、刑罚或伸张正义中的任何一项。
- source_word: በከመ ፈቀድክሙ
  choice: 照自己的意愿
  rationale: 反映“按你们所愿／所欲”的宽泛含义；现代汉语自然且庄重，避免“随你们高兴”可能带来的轻率语气。
theological_decisions:
- issue: 义人在本节中是主动参与审判，还是仅仅目睹上帝为他们伸冤
  choice: 译为义人“向他们施行审判”，保留其主动参与的语法表述。
  alternative: 可理解为义人只见证上帝的审判，或仅获得制伏罪人的权柄而不亲自审判。
  rationale: 目的从句“使你们可以……施行审判”与“交在你们手中”共同指向义人的主动角色；译文不将这一张力弱化为被动得蒙伸冤。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“义人哪”保留直接呼告；“交在你们手中”和“施行审判”维持启示文学的司法意象。正文没有把“照自己的意愿”解释成任意报复，亦未削弱义人主动参与审判所造成的神学张力。
