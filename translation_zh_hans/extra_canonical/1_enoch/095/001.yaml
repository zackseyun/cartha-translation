base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/001.yaml
  text: Who will grant me that my eyes might become a cloud of water[a], so that I may weep over you and pour out my tears like a cloud of water[c][b], and find rest from the sorrow of my heart?
translation:
  language: zh_hans
  text: 谁能赐我这恩典，使我的双眼成为一片雨云[a]，好让我为你们[b]哭泣，将我的泪水如同雨云般倾泻，并从我心中的忧伤中得到安息？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雨云”也可较直译为“水的云”。原文两次重复这一意象，可能描绘双眼仿佛化为降下泪雨的云。
    reason: lexical_alternative
  - marker: b
    text: “你们”在原文中是复数；结合上下文，很可能指周围祸言所针对的罪人或恶人。“为你们”也可理解为“因你们”或“对着你们”。
    reason: cross_reference
lexical_decisions:
- source_word: መኑ፡ ይሁበኒ
  choice: 谁能赐给我
  rationale: 保留疑问式的哀叹愿望，也明确译出动词所带的第一人称单数宾语“给我”；“赐给”比单纯的“给”更能表达求得成全的语气，却不设定某个明确受呼求者。
- source_word: ለአዕይንትየ፡ ከመ፡ ይኩና፡ ደመና፡ ማይ
  choice: 使我的双眼变成水云
  rationale: 以自然的汉语句法表达与“我的双眼”有关的后续愿望，并保留原文“双眼成为水云”这一奇特而强烈的诗歌意象。
- source_word: እብኪ፡ ዲቤክሙ
  choice: 为你们哭泣
  rationale: “你们”反映复数对象；介词在哀歌语境中可表示为、因或对着某人哀哭，正文采用简洁而不过度限定缘由的“为你们”。
- source_word: እክዐው፡ አንብዐየ
  choice: 把我的眼泪倾泻出来
  rationale: 保留主动而强烈的泪水涌流画面，比一般的“流泪”更接近原文的倾出意味。
- source_word: ከመ፡ ደመና፡ ማይ
  choice: 如同水云
  rationale: 与前一处使用同一措辞，以保存原文刻意的意象重复和修辞呼应。
- source_word: ወአዕርፍ፡ እምሐዘነ፡ ልብየ
  choice: 并从我心中的悲伤得着安息
  rationale: 将“哭泣、倾泻、得安息”保持为同一愿望下的并列结果；“得着安息”兼具实际止息与内心得到舒缓的含义。
theological_decisions:
- issue: 是否把“水云”的诗歌意象意译为普通的流泪表达
  choice: 正文保留“水云”，并在两处保持重复
  alternative: 译作“雨云”，或意译为“泪如雨下／双眼充满泪水”
  rationale: 原文两次使用同一不寻常意象。保留它可呈现哀歌的夸张力度和启示文学的诗性，而不把画面化约为一般性的悲伤。
- issue: 哀哭与复数受话者之间的关系
  choice: 译作“为你们哭泣”，并以脚注说明可能的语义范围
  alternative: 译作“因你们哀哭”或“为你们举哀”
  rationale: 原介词容许哀哭针对、涉及或为了受话者；上下文虽可能指罪人或恶人，正文不把怜悯、控诉或预先举哀中的某一种含义定死。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。保留“水云”这一略显陌生的源文意象，同时用“倾泻出来”“得着安息”等通顺表达承载哀歌力度；句中三个动作保持连续并列，避免割裂原文的愿望—结果结构。
