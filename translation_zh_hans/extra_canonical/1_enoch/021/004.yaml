base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/004.yaml
  text: At that time I said[a], “For what sin have they been bound[c][b], and for what reason have they been cast here?”
translation:
  language: zh_hans
  text: 那时，我说[a]：“他们因什么罪被捆绑，又为什么被抛到这里[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我问”。下文直接提出问题，因此也可按汉语语境这样理解。
    reason: lexical_alternative
  - marker: b
    text: 末尾的动词也可表示“被留在这里”或“被遗弃在这里”。本处审判的语境支持译作“被抛到这里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: 那时
  rationale: 这是吉兹语叙事中常见的时间表达；原文没有连接词，因此不增译“于是”或“那时又”。
- source_word: እቤ
  choice: 我说
  rationale: 该词最直接的意思是“我说”；虽然下文是问句，现代汉语也可说“我问”，但正文保留原文较宽泛的言说动词。
- source_word: በእንተ፡ አይ፡ ኃጢአት
  choice: 因什么罪
  rationale: 介词结构询问受罚的原因；“因什么罪”简洁自然，也保留“罪”的明确含义。
- source_word: ተአስሩ
  choice: 被捆绑
  rationale: 被动形式表达遭到捆绑或束缚；“被捆绑”保留异象中具体的惩罚画面，不将其泛化为“被囚禁”。
- source_word: ወበእንተ፡ ምንት
  choice: 又为什么
  rationale: 原文以连接词和原因疑问结构引出第二问；汉语用“又为什么”既自然，也维持两个问项之间的并列关系。
- source_word: ዝየ
  choice: 这里
  rationale: 该指示副词指以诺正在异象中看见的地点；“这里”保留现场感。
- source_word: ተገደፉ
  choice: 被抛到
  rationale: 该动词可表示抛下、丢下或留下；在审判与拘禁的语境中，“被抛到这里”较好地表现强制处置，同时以脚注保留“被留下/遗弃”的可能。
theological_decisions:
- issue: 所描写惩罚的性质
  choice: 以“被捆绑”和“被抛到这里”呈现具体的惩罚与拘禁图像
  alternative: 译作“被囚禁并遗弃在这里”
  rationale: 异象以可见、具体的审判景象为重点。正文避免将其抽象化为一般性的定罪或排斥，同时不进一步断定受罚者的身份或刑罚期限。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那时”准确反映原文无连接词的开头；问句用平行结构，保持异象叙事的紧迫感。
