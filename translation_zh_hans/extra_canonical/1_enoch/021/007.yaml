base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/007.yaml
  text: 'And from there I went to another place[a], more terrible than this, and I saw a fearful work: a great fire was there, burning and blazing, and the place had a cleft reaching to the abyss, full of great pillars of fire descending; neither its measure nor its size was I able to see[c][b], and I was not able to look at it.'
translation:
  language: zh_hans
  text: 从那里，我又到了一处地方，比先前那地方更可怕。我看见一番骇人的景象：那里有烈火燃烧，火焰熊熊；那地方有一道裂隙，直通深渊[a]，里面满是降下的巨大火柱[c]。我无法看出它的尺度和大小[b]，也不能凝视它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 关于这地方向下裂开的句子，吉兹文较难确定；这里谨慎地译作一道延伸至极深处的裂隙。
    reason: textual_variant
  - marker: b
    text: 或译：“我无法辨明它的尺度和广大。”重点在于以诺无法测知眼前景象的范围。
    reason: lexical_alternative
  - marker: c
    text: “降下”也可译作“向下延伸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእምህየ፡ ሖርኩ፡ ካልአ፡ መካነ
  choice: 从那里，我又到了一处地方
  rationale: 保留异象行程的推进；“又”自然表达叙事承接，“一处地方”符合现代汉语。
- source_word: እምዝ፡ ዘይገርም
  choice: 比这里更可怕
  rationale: 保留比较结构及对前一场景的指涉；审判语境中“可怕”比“令人敬畏”更贴切。
- source_word: ወርኢኩ፡ ግብረ፡ ግሩመ
  choice: 我看见一番骇人的景象
  rationale: ግብር 本有“作为、事物、现象”之意；“景象”在此既保留所见对象的具体性，也比生硬的“骇人的工作”更符合现代汉语。
- source_word: እሳት፡ ዐቢይ፡ በህየ፡ ዘይነድድ፡ ወያንበለብል
  choice: 那里有烈火燃烧，火焰熊熊
  rationale: 以“烈火”传达火势之大，并用两个并列动态描写保留燃烧、腾焰的强烈视觉效果。
- source_word: ወመምተርተ፡ ቦቱ፡ መካኑ፡ እስከ፡ ቀላይ
  choice: 那地方有一道裂隙，直通深渊
  rationale: 原句语法较难，核心意象似为裂口向极深处延伸；“直通深渊”保留空间深度而不额外指认其神学性质。
- source_word: ፍጹም፡ አዕማደ፡ እሳት፡ ዐበይተ፡ ዘይወርዶሙ
  choice: 里面满是向下延伸的巨大火柱
  rationale: 将ፍጹም按“充满”理解，修饰随后出现的火柱；“向下延伸”保留下降方向，同时在汉语中自然描绘柱状火焰。
- source_word: ወኢእምጣኖ፡ ወኢዕበዮ፡ አክሀልኩ፡ ነጽሮ
  choice: 我无法看清它的尺度和大小
  rationale: 保留“尺度/大小”两个并列维度，并以“看清”表达以诺无法辨明其范围。
- source_word: ወስእነኩ፡ [ነጽሮ፡] ዐይኖ
  choice: 也无法注目观看
  rationale: 原文末句有括号内的重复和文本不稳定性；采用简洁译法，保留眼睛无法直视的含义。
theological_decisions:
- issue: 异象地点的性质
  choice: 只描写为可怕、充满烈火且通向深渊的异象地点
  alternative: 直接称为地狱、阴间或宇宙监牢
  rationale: 本节没有明确为该地点命名；不以后文或特定教义标签消解经文本身的开放性。
- issue: “巨大火柱”与深渊的关系
  choice: 译作深渊裂隙里面“满是”向下延伸的巨大火柱
  alternative: 仅译作“伴有”或“有”巨大火柱
  rationale: ፍጹም在此宜理解为“充满”，强化原文异象，却不进一步解释火柱的象征意义。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留启示文学中烈火、深渊和火柱的强烈意象，不使用“地狱”等经文本节未明说的教义标签；对吉兹文疑难处以脚注说明。
