  to: 从那里，我又到了一处地方，比先前那地方更可怕。我看见一番骇人的景象：那里有烈火燃烧，火焰熊熊；那地方有一道裂隙，直通深渊[a]，里面满是降下的巨大火柱[c]。我无法看出它的尺度和大小[b]，也不能凝视它。
  rationale: 修订仅处理可安全确定的表达和脚注锚点：将比较对象明确为前一地点；把疑难句脚注移至实际所释的“裂隙”处；以“降下”恢复火柱下降的动态；末句明确观看对象。保留“深渊”的非教义化译法及原文在裂隙描述上的不确定性。
