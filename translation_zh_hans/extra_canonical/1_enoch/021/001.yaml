  text: And I went on until I came to a place where nothing is made[a].
translation:
  language: zh_hans
  text: 我继续前行，直到我来到一个没有任何事物被造出来的地方。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可理解为“一个没有任何事物曾被造出的地方”或“一个什么都不存在的地方”。吉兹语措辞简短，着重表达该处全然没有任何被做成或形成的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: አድኩ
  choice: 我继续前行
  rationale: 表达异象旅程中的持续移动，既保留叙事推进，也符合现代汉语的庄重语体。
- source_word: እስከነ
  choice: 直到来到
  rationale: 结合行进语境表达抵达某处；“直到来到”自然呈现动作的终点。
- source_word: ኀበ
  choice: 一个……的地方
  rationale: 该词指向地点；在汉语中补出“地方”，使目的地含义清楚而不增加实质内容。
- source_word: አልቦቱ
  choice: 没有任何
  rationale: 保留否定存在结构所强调的彻底缺失，并与后面的关系分句自然衔接。
- source_word: ዘይትገበር
  choice: 受造之物
  rationale: 原词源于“作、制造”，此处指被做成或形成的事物。“受造之物”保留被动含义与异象语境，但不把地点直接解释为绝对虚无。
theological_decisions:
- issue: 异象中目的地的性质
  choice: 一个没有任何受造之物的地方
  alternative: 一个什么都没有被造出的地方；一个什么都不存在的地方
  rationale: 吉兹语措辞简短，可指没有任何被做成、形成的东西，也可能表达那里什么都不存在。正文保留“被造／形成之物缺席”的重点，避免将其断定为形而上意义的绝对虚无；脚注交代其他可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“继续前行”体现旅程推进；“受造之物”较“东西”庄重，并保留原文“被做成／形成”的被动意味。正文中的[a]与脚注标记一致。
