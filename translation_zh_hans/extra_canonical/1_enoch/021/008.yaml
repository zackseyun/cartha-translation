base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/008.yaml
  text: And at that time I said[a], “How terrible this place is[c][b], and grievous to behold.”
translation:
  language: zh_hans
  text: 那时我说[a]：“这地方多么可怕，看着令人痛苦[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文这一短语曾被理解为“我的口说”；但较佳的词汇与句法分析是：“我说：‘多么……’”
    reason: textual_variant
  - marker: b
    text: 或译：“这地方多么可畏，看着令人痛苦。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: 那时
  rationale: 保留叙事与异象进程中的时间衔接；现代汉语中自然、庄重。
- source_word: እቤ
  choice: 我说
  rationale: 该形式引出直接引语；汉语用“我说”即可准确而自然地表达。
- source_word: አፎ
  choice: 多么
  rationale: 依据最新词汇校勘，此处是感叹成分“多么／何等”，并非“我的口”；如此也符合后接形容词的句法。
- source_word: ግሩም
  choice: 可怕
  rationale: 在审判异象的语境中表示引起恐惧的威严或可怖，而非现代汉语中偏正面的“令人惊叹”。
- source_word: ዝንቱ፡ መካን
  choice: 这地方
  rationale: 直接保留指示语和异象地理中的“地方”；比“这个地点”更自然。
- source_word: ወሕሙም
  choice: 令人痛苦
  rationale: 表达所见带来的痛苦、苦楚或难受，同时避免把其意义缩窄为单纯视觉上的丑恶。
- source_word: ለነጽሮ
  choice: 看了
  rationale: 表达“观看／看见时”的意义；与“令人痛苦”组合成自然的现代汉语。
theological_decisions:
- issue: አፎ应理解为身体用语“我的口”，还是感叹词“多么”
  choice: 按感叹词译为“多么”
  alternative: “我的口说”
  rationale: 最新校勘指出，该词在此是感叹成分，与后面的“可怕”构成“多么可怕”；译作“我的口”会改变原句句法和意义。
- issue: ግሩም在审判异象中的语气
  choice: 可怕
  alternative: 可畏；令人惊叹
  rationale: 上下文强调异象之地带来的恐惧和痛苦。“可怕”保留负面的审判氛围，而不引入偏正面的赞叹意味。
- issue: ወሕሙም所表达的痛苦是地方本身的性质，还是观看者的感受
  choice: 译作“看了令人痛苦”，保留观看所引发痛苦的关系
  alternative: “看起来令人痛苦”；“观看实在痛苦”
  rationale: 原文形容词与观看不定式的关系可有不同组织方式；本译文给出自然汉语表达，但不把痛苦过度解释为生理、道德或末世论上的某一种特定痛苦。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“多么可怕”保留感叹力度；“看了令人痛苦”比生硬的“观看是痛苦的”更符合现代标准汉语。
