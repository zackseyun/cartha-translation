  rationale: 修订使乌列明确作句子主语，避免“那位”“一路”等非必要增色；并删除“什么”，使末尾动词在汉语中承接前两次“问谁／探询谁”的对象，同时以“急切地追问”谨慎表达其在此语境中可能具有的热切求知意味。
