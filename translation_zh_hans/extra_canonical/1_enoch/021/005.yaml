base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/005.yaml
  text: And Uriel[a], one of the holy angels who was with me and was guiding me, said to me, “Enoch, about whom are you asking[b], and about whom are you inquiring and searching?”
translation:
  language: zh_hans
  text: 乌列——与我同在并引导我的圣天使之一——对我说：“以诺，你在问谁？又在探询谁，并如此急切地追问？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末尾的动词语义不完全确定；也可理解为“急于知道”或“感到焦虑”。此处译为“如此急切地追问”，其所问的对象承接前文的“谁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ኡርኤል
  choice: 乌列
  rationale: 按现代汉语圣经人名惯例音译，与常见形式“乌列”保持一致。
- source_word: ፩እምቅዱሳን መላእክት
  choice: 圣天使之一
  rationale: 保留“一位属于圣天使群体”的含义，并维持以诺文学中的神圣类别用语。
- source_word: ዘምስሌየ
  choice: 与我同在
  rationale: 自然表达其陪伴以诺、身处以诺身边的关系。
- source_word: ዘይመርሐኒ
  choice: 一路引导我
  rationale: 动词表示带领、引导；“一路”使持续性的异象旅程语境在汉语中更清楚，但不增添新的行动内容。
- source_word: በእንተ መኑ ትስእል
  choice: 你在问谁的事
  rationale: በእንተ 表示所问的对象或事项；该译法符合自然汉语。
- source_word: ወበእንተ መኑ ትጠይቅ
  choice: 你在探询谁
  rationale: 以“探询”保留与前一“问”近义复沓的修辞，同时避免生硬重复。
- source_word: ወትጽህቅ
  choice: 又在急切追究什么呢
  rationale: 该词可涉及热切、焦灼或执意探究；结合问询语境，译作“急切追究”既体现强烈求知意味，也不把它限定为忧虑或悲伤。句中补出“什么”以使汉语完整，所指仍由上下文决定。
theological_decisions:
- issue: “圣天使”的类别性含义
  choice: 圣天使之一
  alternative: 神圣的天使之一
  rationale: “圣天使”保留以诺文学中具有分量的天上群体称谓；“神圣的”在现代汉语中较像一般性质描写，类别感较弱。
- issue: 末尾动词所表达的情绪或求知强度
  choice: 急切追究
  alternative: 忧心／焦虑／急于知道
  rationale: 原词语义可能涵盖热切、焦灼和执意探求。正文保留强度而不明确断定以诺是在忧虑、悲伤，或仅仅好奇。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。调整原文较长的主语结构为自然汉语语序，同时保留乌列的身份、陪伴与持续引导。问句保留三个相近动作所形成的递进，并以脚注标明末尾动词的真实语义张力。
