base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/006.yaml
  text: These are among the stars that transgressed the command of the Lord[a], and they are bound here until ten thousand years are completed[e][d][c][b], the number of the days of their sins.
translation:
  language: zh_hans
  text: 这些是众星中那些违背主命令的星[a]；他们被捆绑在这里，直到一万年期满[b]——即他们犯罪之日的数目[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众星中”也可译为“来自众星”。原文的介词可表示部分关系或来源；正文保留异象中“星”的形象。
    reason: lexical_alternative
  - marker: b
    text: “一万年”也可能用来表示极其漫长、但已有指定的刑期；正文按原文保留具体数目。
    reason: cultural_note
  - marker: c
    text: 原文直译为“他们罪恶之日的数目”。这里保留了以数目衡量罪与刑期的异象性表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ ውእቶሙ
  choice: 这些是
  rationale: 保留指示语与系词结构，符合天使就眼前异象作解释的语境。
- source_word: እምነ ከዋክብት
  choice: 众星中
  rationale: 按部分关系理解，指出这些是众星中的一部分；同时避免把异象中的“星”直接解释为“天使”。
- source_word: እለ ኃለፉ ትእዛዘ እግዚአብሔር
  choice: 违背了主的命令的
  rationale: ኃለፉ本有越过、逾越之意，在法律和道德语境中译作“违背”自然且保留审判意味；ትእዛዘ译作“命令”。
- source_word: እግዚአብሔር
  choice: 主
  rationale: 此处强调发令者的权威；译作“主”符合该神圣称号的语境功能。
- source_word: ወተአስሩ በዝየ
  choice: 他们被捆绑在这里
  rationale: 保留被动状态和具体的惩罚意象，不将其弱化为较抽象的“囚禁”。
- source_word: እስከ ሶበ ይትፌጸም
  choice: 直到……期满
  rationale: 表达拘禁所持续到的终点，并保留完成、届满的含义。
- source_word: ትእልፊተ ዓም
  choice: 一万年
  rationale: 直译明确的巨大年数，不擅自改成不定的“无数年”；原文没有要求添加特指定冠意义。
- source_word: ኈልቈ መዋዕለ ኃጢአቶሙ
  choice: 他们犯罪之日的数目
  rationale: 保留“数目”“日”和“罪”的末世审判计量意象，也保留它与前述年限之间略显紧张的同位关系。
theological_decisions:
- issue: “众星”的身份
  choice: 正文保留“众星”，将这些星呈现为能违背命令并受捆绑的存在。
  alternative: 直接译成“天使”或“守望者”；或仅按拟人化的天体理解。
  rationale: 上下文容许将星理解为天上存在，但译文不应消除异象本身的象征形象或替读者作最终认定。
- issue: 一万年的性质
  choice: 正文按明确数值译为“一万年”。
  alternative: 理解为表示极漫长而未必精确的指定刑期。
  rationale: 吉兹语见证给出具体大数，宜在正文保留；其可能具有象征或惯用功能则在脚注说明。
- issue: 末句与刑期的关系
  choice: 以同位说明处理：“那是他们犯罪之日的数目”。
  alternative: 解释为惩罚按罪行比例量定，或将该短语并入前句而不保持其独立意象。
  rationale: 原文措辞简约，关系并未完全展开；译文保留“罪日数目”这一难解表达，不把它系统化为特定刑罚理论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“众星中”表达部分关系；分号和破折号帮助读者辨明身份说明、拘禁状态及末尾同位解释。所有脚注标记均置于正文相应位置。
