base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/009.yaml
  text: And at that time Uriel—one of the holy angels[a], who was with me—answered me and said to me, “Enoch,”
translation:
  language: zh_hans
  text: 那时，乌列——圣天使中的一位，当时与我同在——回答我说：“以诺。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节止于乌列直接呼唤“以诺”；他所说的话在下一节继续。
    reason: 说明原文在呼格处结束，而直接引语的内容延续至下一节。
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: 那时
  rationale: 这是吉兹语叙事中常见的时间衔接语；“那时”自然、庄重，也符合上下文的叙事推进。
- source_word: አውሥአኒ
  choice: 回答我
  rationale: 保留动词“回答、回应”的基本语义，不因本节未重述先前话语而弱化为一般的“告诉我”。
- source_word: ኡርኤል
  choice: 乌列
  rationale: 采用现代中文宗教文献中通行的人名音译。
- source_word: ፩እምቅዱሳን፡ መላእክት
  choice: 圣天使之一
  rationale: 直接表达乌列属于“圣天使”这一群体，既简洁自然，也不添加后来的天使等级观念。
- source_word: እንዘ፡ ምስሌየ፡ ሀሎ
  choice: 同我在一起的
  rationale: 将吉兹语伴随状态结构自然地处理为修饰乌列的定语，同时保留“与我同在”的信息。
- source_word: ወይቤለኒ
  choice: 对我说
  rationale: 保留原文在“回答我”之后再次使用说话引介语的重复结构。
- source_word: ሄኖክ
  choice: 以诺
  rationale: 采用现代简体中文中通行的人名译法，并以标点体现呼格。
theological_decisions:
- issue: ቅዱሳን መላእክት 的表达
  choice: 圣天使
  alternative: 神圣的天使；圣洁的天使
  rationale: “圣天使”准确而自然地保留这类天上存在的分别为圣性质，同时不引入特定宗派的天使论或等级体系。
- issue: 本节末尾“以诺”的句法功能
  choice: 作为直接称呼，并以省略号显示话语延续至下一节
  alternative: 将下一节部分话语补入本节；把“以诺”处理为叙述成分
  rationale: 原文止于对以诺的直接称呼。保留这一中断可忠实呈现分节边界，并避免擅自补足下一节内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“回答我，对我说”的原文重复，不将其简化；用“同我在一起的”避免生硬照搬吉兹语句法。
