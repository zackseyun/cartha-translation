base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/002.yaml
  text: 'And there I saw a fearful work: I saw neither the heavens above nor the firmly founded earth, but a place unformed and terrible.'
translation:
  language: zh_hans
  text: 我在那里看见一件可怕的事物：我既看不见上面的诸天，也看不见根基稳固的大地，只见一个未成形而可怕的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ፡ ግሩመ
  choice: 一项可怕的工程
  rationale: ግብር可指工作、作为或所造之物；这里保留“工程”这一较具体的表达，避免笼统译作“景象”或“东西”。ግሩም表达令人惊惧、可畏。
- source_word: ወአሰማየ፡ ላዕለ
  choice: 上面的诸天
  rationale: 按复数名词及方位语直译，保留古代宇宙图景中的“诸天”。
- source_word: ወአምድረ፡ ሱርርተ
  choice: 根基稳固的大地
  rationale: 将表示牢固建立、奠基的分词结构译为“根基稳固”，体现大地通常被视为安定有基。
- source_word: መካነ፡ ዘአኮ፡ ድልወ
  choice: 一个尚未成形……的地方
  rationale: 该短语描述此地并非整备、定形或合宜的状态；“尚未成形”与上下文的宇宙秩序形成对照，同时不过度具体化为“混沌”。
- source_word: ግሩምም
  choice: 令人恐惧
  rationale: 保留结尾再次出现的可畏含义，并用自然汉语与前面的“可怕”形成呼应。
theological_decisions:
- issue: 异象中的所在是否应明确解释为地狱或惩罚之地
  choice: 只译作“一个……地方”
  alternative: 地狱／刑罚之地
  rationale: 本节原文仅描写其无天无地、未成形而可怕，并未在此处直接命名；不提前引入后文或特定神学解释。
- issue: 无定形状态的性质
  choice: 尚未成形
  alternative: 混沌／荒废／不适宜
  rationale: 保留它缺乏既定秩序或完备形态的含义，同时避免将其等同于某一特定创世论概念。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“既……也……”清楚呈现两个否定对象；“只见”自然承接转折。保留“诸天”和“大地”的古代宇宙意象，不作现代化改写。
