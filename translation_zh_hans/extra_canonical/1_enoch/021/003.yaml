base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/003.yaml
  text: And there I saw seven stars of heaven[a], bound together in it, like great mountains[c][b], and burning with fire.
translation:
  language: zh_hans
  text: 我在那里看见天上的七颗星[a]；它们在其中一同被捆绑，如同大山，并在火中燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“星”可能象征受审判的天上存在，但原文直接说的是“星”。
    reason: cross_reference
lexical_decisions:
- source_word: ርኢኩ
  choice: 我看见
  rationale: 保留第一人称异象见证的常用表达，现代、清楚而不失庄重。
- source_word: ሰብዐተ ከዋክብተ ሰማይ
  choice: 天上的七颗星
  rationale: 忠实保留“星”的宇宙意象，不在正文中直接解释为天使或其他天上存在。
- source_word: እሱራነ
  choice: 被捆绑
  rationale: 表达受束缚的状态，同时避免擅自具体化为锁链或监禁。
- source_word: በላዕሌሁ
  choice: 在其中
  rationale: 按本节语境及其所对应的希腊语空间关系，理解为在先前所述之处里面，而非悬在其上方。
- source_word: ኅቡረ
  choice: 在一起
  rationale: 将这个较难的读法理解为修饰“被捆绑”的集合性副词，即共同被捆绑；不另增“聚集”这一动作。
- source_word: ከመ አድባር ዐበይት
  choice: 如同大山
  rationale: 保留异象中突兀而宏大的比较，不将其淡化为仅仅形容体积巨大。
- source_word: ወበእሳት እንዘ ይነዱ
  choice: 燃烧着火焰
  rationale: 以自然的现代汉语保留持续燃烧的动态和火的鲜明意象。
theological_decisions:
- issue: 是否把“天上的七颗星”明确解释为受审判的天使或天上存在
  choice: 正文仍译作“天上的七颗星”
  alternative: 天上的七位天使；七个天上存在
  rationale: 以诺传统中星辰可以象征天使，尤其见于审判场景；但本节原文明确使用“星”，故保留原有意象，并在脚注中提示其可能的象征意义，以免消除文本本身的张力。
- issue: 这些星与所述地点的空间关系
  choice: 在其中被捆绑在一起
  alternative: 在其上方被捆绑、聚集在一起
  rationale: 结合语境和可比的希腊语证据，“在其中”较能表达这些星被投入并拘束于该处；同时把ኅቡረ理解为修饰“被捆绑”的“在一起”，而非独立的“聚集”。
translation_notes:
  register: 采用现代标准普通话，句式庄重而易懂。保留异象文学的宏大、陌生感；“颗”符合现代汉语对星的量词习惯，“如同大山”则维持原文比较的凝练力度。
