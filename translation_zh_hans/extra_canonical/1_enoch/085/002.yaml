base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/002.yaml
  text: 'And Enoch lifted up his voice and said to his son Methuselah[a], “To you I speak, my son: hear my words, and incline your ear to the vision of your father’s dream.”'
translation:
  language: zh_hans
  text: 以诺高声对他儿子玛土撒拉说：“我对你说，我儿，你要听我的话，侧耳留心你父亲梦中的异象[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“梦的异象”。吉兹语原文把“看见／异象”与“梦”连在一起，两者之间的确切关系略有含混。
    reason: 保留原文中异象语言与梦语言结合所产生的词义和语法含混。
lexical_decisions:
- source_word: አንሥአ
  choice: 提高声音
  rationale: 该动词本义为“举起、提高”；结合后面的说话公式，译作“提高声音”既保留原文动作意象，也符合庄重的叙事语体。
- source_word: ወይቤ
  choice: 说
  rationale: 这是叙事中常见的引语动词，译作“说”简洁自然。
- source_word: ለወልዱ ማቱሳላ
  choice: 对他儿子玛土撒拉
  rationale: 保留受话者关系，并采用现代简体中文中通行的圣经人名译法“玛土撒拉”。
- source_word: ለከ እብለከ
  choice: 我对你说
  rationale: 原文重复第二人称成分以突出受话者；中文用“我对你说”自然表达这一直接而郑重的强调。
- source_word: ወልድየ
  choice: 我儿
  rationale: 保留父亲对儿子的呼语及其亲切、训诲性的语气。
- source_word: ስማዕ ነገርየ
  choice: 你要听我的话
  rationale: 命令式以“你要”表达，既清楚又保持劝诫语气；“我的话”准确传达所说内容。
- source_word: ወአጽንን እዝነከ
  choice: 侧耳留心
  rationale: “侧耳”保留原文耳朵的具体意象，“留心”显明专注聆听之意，避免中文仅用“侧耳”可能产生的生硬感。
- source_word: ለርእየ ሕልመ አቡከ
  choice: 你父亲梦中的异象
  rationale: 该短语同时包含观看／异象与梦的语义。“梦中的异象”在现代中文中自然，并保留异象发生于梦中的双重表达；“你父亲”保持原文第三人称自称的庄重语气。
theological_decisions:
- issue: ርእየ ሕልመ 中梦与异象的关系
  choice: 梦中的异象
  alternative: 梦的异象；梦境
  rationale: 原文将观看／异象语言与梦联系起来。正文不简化为普通“梦境”，以保留其启示性和视觉性；同时加注说明其语法关系可有不同理解，不把含义过度固定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“提高声音”“我儿”“侧耳留心”保留启示文学和父子训诲的肃穆语气，但避免文言化；正文中的脚注标记[a]与脚注一致。
