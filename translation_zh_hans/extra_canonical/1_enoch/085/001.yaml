  text: And after this I saw another dream[a], and I will show you the whole dream[b], my son.
translation:
  language: zh_hans
  text: 此后，我又看见一个梦；我要把整个梦[a]展示给你看，我儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每一个梦”。原文也可能有分配性的含义；但按本句中单数名词及其紧接的先行语，更可能指刚提到的这个梦的全部内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: 此后
  rationale: 作为异象叙事中的时间转换语，简洁自然，并保留原文承接前文的节奏。
- source_word: ካልአ ሕለመ
  choice: 又看见一个梦
  rationale: ካልአ 表示另一个、又一个；与单数“梦”连用，表明这是有别于前一梦的另一个梦。
- source_word: ርኢኩ
  choice: 我……看见
  rationale: 直接对应第一人称异象报告，采用现代汉语常用而庄重的表达。
- source_word: ኵሎ ሕልመ
  choice: 整个梦
  rationale: ኵሎ 修饰单数“梦”，且直接回指刚提到的“另一个梦”；因此理解为这个梦的全部内容最合乎句法和近距离语境，同时以脚注保留可能的分配性理解。
- source_word: አርእየከ
  choice: 我要……指给你看
  rationale: 保留使役动词“使你看见、展示给你”的形象性，比单纯译作“告诉你”更贴近原文。
- source_word: ወልድየ
  choice: 我儿
  rationale: 自然呈现亲密而带教诲意味的直接称呼，并保持庄重语体。
theological_decisions:
- issue: ኵሎ ሕልመ 的范围
  choice: 整个梦
  alternative: 每一个梦
  rationale: 该词组中的“梦”为单数，并直接承接本句前半的“另一个梦”，较自然地指这个特定梦的全部内容；但原表达也可能被理解为分配性的“每一个梦”，故不在正文中混合两义，而在脚注中保留歧义。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“我儿”保留父亲向儿子传授异象的亲密框架；分号体现两个并列陈述之间的紧密推进。
