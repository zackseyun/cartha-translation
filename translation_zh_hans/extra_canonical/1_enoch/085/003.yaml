base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/003.yaml
  text: Before I took your mother Edna[a], I saw in a vision on my bed, and behold, a bull came up from the earth; and that bull was white. And after it there came out one heifer, and with her came out two bulls[c][b], and one of them was black and one red.
translation:
  language: zh_hans
  text: 在我娶你母亲埃德娜以前，我躺在床上时看见异象：看哪，有一头公牛从地里出来；那头公牛是白色的。随后，又有一头母牛出来；和它一同出来的，还有两头公牛[a]：其中一头是黑色的，另一头是红色的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些动物属于本书《梦中异象》中的象征性形象；正文保留异象本身的动物称谓，不在此直接说明它们所代表的人物。
    reason: cultural_note
lexical_decisions:
- source_word: እንበለ፡ እንሥአ፡ ለአምክ፡ ኤድና
  choice: 我还没有娶你母亲埃德娜以前
  rationale: 保留开头的时间从句及专名，按现代汉语自然语序表达；“娶”准确传达说话者与对方母亲的婚姻关系。
- source_word: ርኢኩ፡ በራእየ፡ ምስካብየ
  choice: 我在床上的异象中看见
  rationale: 同时保留“看见”“异象”和“床”三个要素，不把异象泛化为普通梦境。
- source_word: ላህም
  choice: 公牛
  rationale: 此处与后文母牛形成性别对照；“公牛”也能清楚保留动物异象的具体形象。
- source_word: ወፅአ፡ እምድር
  choice: 从地里出来
  rationale: 直接呈现从土地之中出现的动态，不额外解释其象征意义。
- source_word: ጸዓዳ
  choice: 白色的
  rationale: 颜色在异象叙事中具有显著作用，采用简明、直接的色彩词。
- source_word: ጣዕዋ፡ እንስቲያት፡ አሐቲ
  choice: 一头母牛
  rationale: 原文明确为单数雌性牛类；现代汉语用“一头母牛”自然清楚，且避免过度限定年龄。
- source_word: ወምስሌሃ፡ ወፅኡ፡ ክልኤቱ፡ ጣዕዋ
  choice: 和它一同出来的，还有两头公牛
  rationale: 保留两头雄性牛与母牛同时出现的关系，并以自然汉语呈现原文次序。
- source_word: ጸሊመ
  choice: 黑色的
  rationale: 直接保留与白色、红色构成的颜色对照。
- source_word: ቀይሐ
  choice: 红色的
  rationale: 用普通现代汉语准确呈现颜色，不解释其象征含义。
theological_decisions:
- issue: 《梦中异象》中的动物象征
  choice: 正文只描写异象中的牛，不直接指明它们所象征的人物。
  alternative: 在正文中把牛解释性地译作男人、女人或具体人物。
  rationale: 原文借持续的动物意象展开叙事；翻译应保留其修辞和解释空间，不把后续或传统认定直接写进正文。
- issue: “异象”与“梦”的关系
  choice: 译作“在床上的异象中”，保留异象性质及卧床场景。
  alternative: 译作“在梦中”或“睡觉时亲眼看见”。
  rationale: 原文兼有异象和床榻语汇；仅译“梦”会削弱启示性异象这一要素，扩写为“亲眼”则可能加入原文没有明确表达的强调。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留异象叙事的突显语气；量词统一用“头”。代词用“它”指动物。仅设置一条确有助益的注释，且标记已在正文出现。
