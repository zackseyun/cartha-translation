base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/004.yaml
  text: And that black calf struck the red calf and pursued it onto the earth[c][b][a], and after that I could no longer see that red calf.
translation:
  language: zh_hans
  text: 那黑色的牛犊击打[a]红色的牛犊，并追赶它到地上[b]；从那以后，我就再也看不见那红色的牛犊了。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击打”也可译作“顶伤”；牛科动物的语境使后一译法成为可能，但原动词本身并未明确动作方式。
    reason: lexical_alternative
  - marker: b
    text: “到地上”也可理解为“到地面上”或“进入地里”；原文没有明确说明具体运动方式。
    reason: lexical_alternative
  - marker: c
    text: “牛犊”所译的原词在这里没有明确标示性别；不宜仅按异象所象征的人物而译成特指性别的称呼。
    reason: source_ambiguity
lexical_decisions:
- source_word: ጐድአ
  choice: 击打
  rationale: 该动词表示击打或伤害。“击打”保留暴力动作，却不把具体方式限定为用角顶伤。
- source_word: ጸሊም
  choice: 黑色的
  rationale: 这是基本颜色词；在动物异象中译作“黑色的”自然明确。
- source_word: ጣዕዋ
  choice: 牛犊
  rationale: 此处该词没有明确的阴性限定语，译作不标明性别的“牛犊”较为稳妥，也避免用“母牛犊”预先解释异象中动物的性别。
- source_word: ለቀይሕ
  choice: 红色的牛犊
  rationale: 原文以颜色指称受击者；中文补出上下文中的“牛犊”，使所指清楚，并与本节后半句一致。
- source_word: ተለዎ
  choice: 追赶
  rationale: 前文已有暴力动作，因此这里不是中性的“跟随”，而带有敌对追逐之意。
- source_word: ውስተ ምድር
  choice: 到地上
  rationale: 该短语表达朝向“地、地面”的运动；此译保留空间意象，不断定是倒在地面还是进入地下。
- source_word: አክሀልኩ እምሶቤሃ ርእዮቶ
  choice: 从那以后，我就再也看不见
  rationale: 自然表达异象中自此停止看见那只红色牛犊，同时保留时间转折。
theological_decisions:
- issue: 是否在正文中直接解明动物所象征的人物
  choice: 保留黑色和红色牛犊的异象形象
  alternative: 把它们直接译为该异象可能象征的人物
  rationale: 正文应保存启示文学异象的表层表达，不把解释性身份直接代入译文。
- issue: 是否根据象征人物的传统身份给牛犊加上性别
  choice: 采用不标明性别的“牛犊”
  alternative: 译作“公牛犊”或“母牛犊”
  rationale: 本节该名词本身没有显明的性别标记；不应仅凭象征解释在正文中添加性别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留动物异象及“到地上”的空间歧义，不在正文中解码象征。
