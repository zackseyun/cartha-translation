  text: And that black heifer grew up[b][a], and she came
translation:
  language: zh_hans
  text: 那头黑色的小母牛长大了[a]，她就来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文措辞简短；“长大了”也可理解为“变得强壮了”或“长得高大了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: 那头
  rationale: 按校订后的词法分析理解为“而那一头”；汉语以“那头”自然承接前文，并配合牲畜量词。
- source_word: ጸሊም
  choice: 黑色的
  rationale: 直接保留异象中的颜色意象，不作象征性解释。
- source_word: ጣዕዋ
  choice: 小母牛
  rationale: 该词指牛犊或幼牛；后续动词采用阴性单数，因此译作“小母牛”既保留年龄特征，也与语法性别相应。
- source_word: ላህቀ
  choice: 长大了
  rationale: 作动词理解，表示长大或变得强壮；“长大了”最自然地呈现生长过程。
- source_word: ወመጽአት
  choice: 她就来了
  rationale: 该形式为阴性单数“她来了”；“就”体现叙事的接续关系，同时保留简洁语气。
theological_decisions:
- issue: 《动物启示录》中的象征性动物形象
  choice: 在正文中保留具体的“黑色的小母牛”形象
  alternative: 直接解释为某一民族、统治者或历史人物
  rationale: 译文应呈现异象本身，不把可能的历史或神学所指代入正文。
- issue: 阴性语法形式的表达
  choice: 以“小母牛”和“她”明确体现阴性
  alternative: 译作中性的“牛犊”和“它”
  rationale: 原文末尾动词是第三人称阴性单数；现代汉语可借“小母牛”和“她”清楚保留这一信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留异象中具体的动物与颜色意象；不沿用早期英译所误释的“我看见”和“野猪”。
