  text: And it looked like the carob tree[a], and its fruit was like clusters of good grapes, very beautiful[d][c][b]; and the fragrance of that tree spread far away.
translation:
  language: zh_hans
  text: 它看起来像一棵角豆树；它的果实像一串串葡萄，十分美丽；那棵树的香气飘散到远方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመስል
  choice: 它的样子像
  rationale: 保留视觉上的比较关系，同时采用自然的现代汉语表达。
- source_word: ሐመረ ጽራእ
  choice: 角豆树
  rationale: 该词组所指的树在现存希腊文片段中对应 κερατία，且词典证据支持角豆树（Ceratonia siliqua），不采用旧译“罗望子树”。
- source_word: ፍሬሁ
  choice: 它的果实
  rationale: 按树木语境直译，具体清楚。
- source_word: ከመ እስካለ ወይን
  choice: 像一串串葡萄
  rationale: 源语按字面是与葡萄树的果实相比；汉语用“一串串葡萄”自然呈现其形象。
- source_word: ሠናይ ጥቀ
  choice: 非常美好
  rationale: 将 ጥቀ 理解为程度副词“非常”，修饰 ሠናይ“美好”；现存希腊文 καλοὶ λίαν 亦支持此读法。
- source_word: ወጼናሁ
  choice: 香气飘散
  rationale: 在香气语境中，以“飘散”自然表达向外发出、传播之意。
- source_word: ለውእቱ ዕፅ
  choice: 那棵树的
  rationale: 保留指示语的明确所指，并符合现代汉语习惯。
- source_word: የሐውር ነዋኃ
  choice: 到远方
  rationale: 表达香气延伸至很远之处，简洁保留距离感。
