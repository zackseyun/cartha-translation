  text: And I said[b][a], “It is beautiful.”
translation:
  language: zh_hans
  text: 我说：“这很美。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 吉兹语原文极为简短；逐词近于“我说：‘美／好，这。’”，语法上带有省略。也可译作“我说：‘这很好。’”
    reason: 说明原文的省略结构，并保留 ሠናይ 在“美”与“好”之间的词义选择。
lexical_decisions:
- source_word: ወእቤ
  choice: 我说
  rationale: ወ 表示叙事的接续，እቤ 是“说”的第一人称单数完成式。汉语在单独成节时不必机械译出“和”，用“我说”自然地保留叙事动作。
- source_word: ሠናይዝ
  choice: 这真美
  rationale: ሠናይ 表示“美、好、悦目”；所录形式末尾的 ዝ 可理解为指示成分“这”。“这真美”既表达眼前所见引发的赞叹，也保留了指示意味；“真”用于形成自然的汉语感叹，不增加新的实质内容。
theological_decisions:
- issue: 极简短评语中“美”与“好”的语义张力
  choice: 这真美
  alternative: 这是好的／这很好
  rationale: 原词兼有“美丽、良好、悦目”等意义。上下文属于异象中的观看与评价，因此正文采用偏审美的“美”；脚注保留“好”的可能，不把评价限定为道德意义。
- issue: 是否补出指示对象
  choice: 译出“这”
  alternative: 它真美／真美啊
  rationale: 所提供的吉兹语连写形式可辨认出指示成分 ዝ。译作“这”比泛指的“它”更贴近眼前所见，同时不擅自补出具体名词。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“这真美”符合亲见异象时的直接赞叹；不补出“树”等当前所给原文未明确出现的对象。
