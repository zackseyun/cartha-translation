base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/003.yaml
  text: And I came into the garden of righteousness[a], and I saw beyond those trees many large trees growing there, with good fragrance, great and very beautiful and glorious; and the tree of wisdom[c][b], from which those who eat know great wisdom.
translation:
  language: zh_hans
  text: 我来到公义的园子，看见在那些树的那一边[a]，有许多高大的树木生长着；它们香气宜人，高大、极其美丽、光彩夺目。那里还有智慧树[b]；凡吃这树的，就会认识大智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这个空间短语较难确定，也可较宽泛地理解为“在那些树中间”或“在那些树旁边”。
    reason: textual_variant
  - marker: b
    text: 原文作“智慧树”，有意使人联想到圣园中的树，却没有采用《创世记》“分别善恶树”的确切名称。
    reason: cross_reference
lexical_decisions:
- source_word: ገነት ጽድቅ
  choice: 义园
  rationale: ገነት 指园子或乐园，ጽድቅ 指公义、正义；“义园”简洁而庄重，并保留圣园意象。
- source_word: ከሐክቲሆሙ ለእልክቱ ዕፀው
  choice: 在那些树的那一边
  rationale: 该空间短语在现存埃塞俄比亚文本中较难确定；正文采用符合异象行进脉络的“那一边”，脚注保留“其间/旁边”的可能。
- source_word: ዕፀወ ብዙኃነ ወዐቢይነ ይበቍሉ
  choice: 有许多高大的树木生长在那里
  rationale: 同时表达树木数量众多、形体高大以及正在生长的动态。
- source_word: ጼናሆሙ ሠናይ
  choice: 它们香气宜人
  rationale: 自然表达树木气味美好，保留异象中的感官描写。
- source_word: ዐቢያን ወሥናሙ ብዙኅ ወስቡሓን
  choice: 高大壮观，极其美丽，光彩夺目
  rationale: 分别保留高大、美丽丰盛和辉煌壮丽三层描述，避免遗漏 ወስቡሓን 所表达的荣耀或华美。
- source_word: ዕፀ ጥበብ
  choice: 智慧树
  rationale: 直译该限定结构，保留与圣园传统的呼应，却不改写成《创世记》的特定名称。
- source_word: ዘእምኔሁ በሊዖሙ ይአምርዋ ለጥበብ ዐቢይ
  choice: 人若吃了它的果子，就会认识大智慧
  rationale: 保留进食与认识大智慧之间的条件—结果关系；“果子”在汉语中使吃树上之物的表达自然，但属于语境补足，故加脚注说明。
theological_decisions:
- issue: 智慧树与伊甸园意象的关系
  choice: 译作“智慧树”
  alternative: 知识树；分别善恶树
  rationale: 原文明确使用“智慧”，并未采用《创世记》中“分别善恶树”的完整称谓；直译可保留互文意味，也避免将两者无根据地等同。
- issue: 吃树上之物所得的结果
  choice: 认识大智慧
  alternative: 变得聪明；获得智慧
  rationale: 原文保留“认识”这一动词和“智慧”这一宾语；本译法不把它简化成一般性的聪明，也不消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“义园”“智慧树”保持凝练的经文风格；树木的三重特征分开表达，以保存原文层层累加的异象性描写。所有脚注标记均置于正文相应位置。
