base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/001.yaml
  text: And after these[a], toward the south, as I looked over the mountains, I saw seven mountains full of choice nard and fragrant trees[c][b], and cinnamon and pepper.
translation:
  language: zh_hans
  text: 这些以后，我朝南方越过群山眺望时，看见七座山，满是上好的甘松[a]、芳香树木、肉桂和胡椒[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “甘松”所对应的原文词组含义不完全确定，可能泛指一种贵重的芳香植物或香料；也可译作“上好的香料”。
    reason: lexical_alternative
  - marker: b
    text: 原文连续列举贵重芳香植物和香料，重点在于展现异象之地的丰盛与奇异，不一定是在提供可按现代植物学精确辨认的清单。
    reason: cultural_note
  - marker: c
    text: “我越过群山眺望时”也可理解为：“我观看时，看见群山之上有七座山。”原文中观看、群山与七座山之间的句法关系略有歧义。
    reason: textual_ambiguity
lexical_decisions:
- source_word: እምድኅረ እሉ
  choice: 这些以后
  rationale: 这是承接前面异象场景的时间转换语；保留复数指代，不擅自补出具体名词。
- source_word: አፈው ለመስዕ
  choice: 我转向南方
  rationale: 按上下文将该短语理解为朝南方移动或转向；“南方”反映 ለመስዕ，动词则以自然中文表达异象行程的推进。
- source_word: እንዘ እኔጽር መልዕልተ አድባር
  choice: 我越过群山眺望时
  rationale: 保留持续观看的分词结构，也保留“在群山之上／越过群山”的空间关系；中文采用“越过群山眺望”呈现所见七山位于更远处的图景。
- source_word: ፯አድባረ
  choice: 七座山
  rationale: 明确保留数词“七”；量词“座”符合现代汉语对山的通常表达。
- source_word: ምሉኣነ
  choice: 满是
  rationale: 自然表达群山遍布后列芳香植物与香料的丰盛景象。
- source_word: ሰንብላተ ቅድዋተ
  choice: 上好的甘松
  rationale: 该词组所指植物并不完全确定，但语境是贵重芳香物；“甘松”保留具体植物意象，“上好的”体现修饰语所含的精选、珍贵之意。
- source_word: ዕፀ መዓዛ
  choice: 芳香树木
  rationale: 较直译地保留“香气之树／木”的具体景象，不缩减为抽象的香料。
- source_word: ቀናንሞን
  choice: 肉桂
  rationale: 这是指肉桂类香料的借词；采用现代汉语通行名称。
- source_word: ፐፐሬ
  choice: 胡椒
  rationale: 这是胡椒的借词；采用现代汉语通行名称。
