base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/002.yaml
  text: And from there I went above the summits of those mountains[a], far to the east, and I crossed over the Erythraean Sea; and I went far from it[c][b], and passed above the angel Zutel.
translation:
  language: zh_hans
  text: 从那里，我越过那些山的峰顶，远远向东而去；我越过厄立特里亚海[a]，又远离那海而行[c]，并从天使祖特埃尔[b]的上方经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“红海”。古代的“厄立特里亚海”所指范围可能比现代红海更广。
    reason: lexical_alternative
  - marker: b
    text: 这位天使的名字在其他版本或译本中也可能采用不同的元音拼法，如“祖塔埃尔”。
    reason: textual_variant
  - marker: c
    text: 这里译作“又远离那海而行”的短语在吉兹文见证中确切含义较难确定；大意是他离开那片海域继续远行。
    reason: textual_variant
lexical_decisions:
- source_word: መልዕልተ፡ ርእሶሙ፡ ለእልኩ፡ አድባር
  choice: 越过那些山的峰顶
  rationale: መልዕልተ 表示位于或经过上方，ርእሶሙ 字面为“它们的头”，用于山岳时自然指“峰顶”。“越过”既符合行进语境，也不把异象中的空间关系解释得过细。
- source_word: እንዘ፡ ርሑቅ፡ ውእቱ፡ ለጽባሕ
  choice: 远远向东而去
  rationale: ጽባሕ 在此指日出方向，即东方；整句同时表达距离和方向。译文保留动态行程，并避免误解为清晨时间。
- source_word: ባሕረ፡ ኤርትራ
  choice: 厄立特里亚海
  rationale: 采用古代地理名称的音译，不直接收窄为现代意义上的“红海”；可能范围较广的情况收入脚注。
- source_word: ወእምኔሁ፡ ርሑቀ፡ ተከንኩ
  choice: 又远离了那里
  rationale: 该短语的词形和句法存在困难，但上下文明确涉及离开所述海域继续远行；采用克制的译法，并以脚注说明不确定性。
- source_word: መልዕልተ፡ ለመልአክ፡ ዙጥኤል
  choice: 从天使祖特埃勒的上方经过
  rationale: 重复译出 መልዕልተ 的空间意义，不因“从天使上方经过”较为奇特而改写异象；人名按吉兹文辅音及可见元音保守音译。
theological_decisions:
- issue: 古代海名的处理
  choice: 厄立特里亚海
  alternative: 红海
  rationale: 这是古代地理和异象世界图景的问题。保留古称可避免将原文所指未经论证地限定为现代红海，也不增添特定神学解释。
- issue: 从天使上方经过的异象空间关系
  choice: 按原文保留“从……的上方经过”
  alternative: 弱化为“经过天使祖特埃勒那里”
  rationale: 原文再次使用 መልዕልተ。即使这一画面不寻常，也应保留其真实的空间张力，而不是在译文中将其合理化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“远远向东而去”呈现异象旅程的方向感；“厄立特里亚海”保留古代地理视野；对困难短语及不寻常的“从天使上方经过”不作过度解释。所有脚注标记均置于相应正文之后。
