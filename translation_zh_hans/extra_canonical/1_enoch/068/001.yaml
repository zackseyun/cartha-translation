base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/001.yaml
  text: And after this my grandfather Hēnok gave me the sign of all the hidden things in a book[a], and the parables that had been given to him[c][b]; and they shall recount them to me in the account of the book of the Parable.
translation:
  language: zh_hans
  text: 此后，我的祖父以诺把书中一切隐秘之事的记号[a]，以及赐给他的那些比喻[b]，交给了我；他们要在《比喻之书》的记述中向我讲说这些事。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在现存吉兹语文本中的句法较为困难。“书中”也可与前后成分作不同连接；本译文尽量贴近现存措辞，没有把句子完全理顺。
    reason: textual_difficulty
  - marker: b
    text: “比喻”也可译作“譬喻”。
    reason: lexical_alternative
  - marker: c
    text: “他们要向我讲说”中的复数主语在现存文本中没有明确所指；末句也可较直译为“他们要在《比喻之书》的记述中向我讲说”。
    reason: textual_difficulty
lexical_decisions:
- source_word: ትእምርተ
  choice: 记号
  rationale: 该词可指记号、标志或征兆。“记号”贴近其基本词义，也保留启示文学语境中的暗示性，不将其解释为“说明”。
- source_word: ኵሎሙ ኅቡኣት
  choice: 一切隐秘之事
  rationale: 忠实表达被隐藏、后来得以揭示的事物，同时避免使用可能带有后期神学术语色彩的“奥秘”。
- source_word: በመጽሐፍ
  choice: 书中
  rationale: 介词短语最自然地表示这些隐秘之事记载在书内；但本句句法存在困难，另见脚注。
- source_word: እምሔውየ ሄኖክ
  choice: 我的祖父以诺
  rationale: 将እምሔውየ识别为带第一人称单数领属后缀的完整名词，即“我的祖父／祖先”，并与“以诺”构成主语。
- source_word: ምሳሌያተ
  choice: 比喻
  rationale: 这是现代汉语中自然且易懂的对应词，也适合本书该部分的文学称谓；亦可理解为“譬喻”或“相似之象”。
- source_word: ተውህበ ሎቱ
  choice: 赐给他的
  rationale: 保留被动领受的含义，并以“赐”体现启示语境，但不明说施予者。
- source_word: ይመርሙ ሊተ
  choice: 他们还要向我讲说
  rationale: 原词及其复数主语在此难解。“讲说”保留陈述、铺陈内容的可能性，不武断限定为“解释”或“诠释”。
- source_word: ነገረ መጽሐፍ ዘምሳሌ
  choice: 《比喻之书》的记述
  rationale: ነገር可指话语、事情或记述；此处用“记述”较符合书面语境。末尾单数“比喻”依现存文本保留。
theological_decisions:
- issue: 应将被隐藏的内容译为一般性的“隐秘之事”，还是术语化的“奥秘”
  choice: 隐秘之事
  alternative: 奥秘；秘密
  rationale: 原文表达启示中被揭示的隐蔽事项，却未必要求后期神学意义上的专门术语；“隐秘之事”保留这种张力。
- issue: 是否将ትእምርተ解释性地译作“说明”
  choice: 记号
  alternative: 说明；解释
  rationale: “记号”更符合该词的基本词义范围，也避免替读者先行消解启示文学中的含混。
- issue: 赐下比喻者的身份
  choice: 保留未明说的施予者
  alternative: 明确补作“上帝赐给他的”
  rationale: 被动式表明以诺领受了这些比喻，但本节没有明确指出施予者，因此不在正文中补出。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文中“记号”、未明确的复数主语以及末尾单数“比喻”所形成的含混；书名使用书名号，以提高中文可读性。
