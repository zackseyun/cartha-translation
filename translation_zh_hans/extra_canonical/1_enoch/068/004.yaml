base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/004.yaml
  text: 'And it came to pass[a], when he stood before the Lord of Spirits, that Michael said this to Raphael: “He will not be for them before the eye of the Lord, for the Lord of Spirits is angry with them[c][b], because they act as if they were the Lord.”'
translation:
  language: zh_hans
  text: 事情就这样发生了：当他站在万灵之主面前时，米迦勒对拉斐尔说：“在主眼前，他不会站在他们一边[a]；因为万灵之主向他们发怒，因为他们行事仿佛自己就是主[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站在他们一边”也可译作“支持他们”。原文是第三人称单数“他”，但本节没有明说“他”指谁，也没有明确使用“代求”一词。
    reason: 保留代词所指和司法支持含义上的歧义。
  - marker: b
    text: 或译：“因为他们行事像诸位主宰。”原文措辞简短，可能指他们僭取本不属于自己的神圣地位或统治权柄。
    reason: 说明末句在“仿佛自己就是主”与“像主宰者一样”之间的词义可能性。
lexical_decisions:
- source_word: ወኮነ፡ ሶበ፡
  choice: 事情是这样：当……时
  rationale: 保留叙事过渡和时间结构，同时避免用过于古雅的“事就这样成了”。
- source_word: ቆመ፡
  choice: 他站
  rationale: 采用该动词的基本义，并保留异象中朝廷或审判场景的空间感。
- source_word: በቅድመ፡ እግዚአ፡ መናፍስት፡
  choice: 在万灵之主面前
  rationale: “万灵之主”保留《以诺一书》的固定神圣称号，“面前”体现空间和司法意味。
- source_word: ወከመ'ዝ፡ ይቤሎ፡
  choice: 米迦勒对拉斐尔说
  rationale: 用自然现代汉语表达引语过渡；“如此”之意由后接直接引语充分体现。
- source_word: ወኢይከውን፡ ሎሙ፡ በውስተ፡ ዓይነ፡ እግዚአ፡
  choice: 在主眼前，他不会站在他们一边
  rationale: “站在……一边”自然表达 kona la- 的支持或袒护意味，却不扩写为明确的代求；“主眼前”保留原文生动而略显不寻常的视觉意象。
- source_word: ተምዕዖሙ፡
  choice: 向他们发怒
  rationale: 清楚表达神的忿怒，并保持审判语气。
- source_word: እምሳለ፡ እግዚአ፡ ይገብሩ።
  choice: 他们行事仿佛自己就是主
  rationale: 保留他们僭越神圣权柄的严重指控，同时不把含混的表达缩减为一般的“像首领一样行事”。
theological_decisions:
- issue: 米迦勒话语中第三人称单数代词所指为何
  choice: 正文保留“他”，不指明其先行词
  alternative: 译作“我不会站在他们一边”，或解释性地译成“他不会为他们代求”
  rationale: 所给吉兹语支持第三人称单数，但本节没有明说其所指。保留代词可避免擅自指定某位代求者。
- issue: 对受审者行为的指控力度
  choice: 译为“他们行事仿佛自己就是主”
  alternative: “他们行事像诸位首领”或“他们像主一样行事”
  rationale: 此译保留僭取神之地位或权柄的神学张力；脚注同时说明语句也可能泛指他们以主宰者自居。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“万灵之主”作为全书固定神称保留；避免古奥虚词。正文刻意保留第三人称“他”的未定所指，并以脚注呈现难句的合理替代解释。
