  text: Because of this[b][a], everything hidden forever shall come upon them.
translation:
  language: zh_hans
  text: 因此，一切永远隐藏的都必临到他们身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远”也可理解为修饰“临到”，即：“一切隐藏的都必永远临到他们身上。”原词还可表示“历世以来”或“在一个世代中”，所以也可能译作“历世以来隐藏的一切”。
    reason: 原词的时间含义及其句法修饰对象均有歧义。
lexical_decisions:
- source_word: በእንተ'ዝ
  choice: 因此
  rationale: 保留该短语承接上文并引出后果的因果作用；现代汉语中简洁而庄重。
- source_word: ይመጽእ
  choice: 必临到
  rationale: 表达审判语境中的将来意味和确定性，同时保留“来到、临及”的基本意象。
- source_word: ላዕሌሆሙ
  choice: 他们身上
  rationale: 与“临到”搭配，自然表达某事加在这些对象之上；不擅自强化为“攻击他们”。
- source_word: ኵሉ ዘኅቡእ
  choice: 隐藏的一切
  rationale: 保留所指对象的宽泛性，不限定为隐秘的罪行、奥秘或预留的刑罚。
- source_word: ለዓለመ
  choice: 永远
  rationale: 该词可表示永恒、一个世代或久远的时期；正文按其常见的永恒义处理，并依较可能的句法将其与“隐藏”相连，其他可能见脚注。
theological_decisions:
- issue: 隐藏之物是被揭露，还是作为审判临到他们
  choice: 译为“隐藏的一切都必临到他们身上”
  alternative: “一切隐藏之事都必被揭露，成为对他们的控告”
  rationale: 原文明确使用“临到他们身上”，并未直接说“被揭露”；因此保留其不祥的审判色彩，也不具体断定所指是隐秘行为、奥秘还是预留的刑罚。
- issue: “永远”修饰“隐藏”还是“临到”
  choice: 正文作“永远隐藏的一切”
  alternative: “隐藏的一切都必永远临到他们身上”
  rationale: 末尾短语在压缩的格尔兹语句法中存在附着歧义。正文采用其描述隐藏之久的读法，但以脚注明示它也可能修饰主要动词，避免把争议解释成唯一结论。
translation_notes:
  register: 采用现代、庄重而易懂的审判语体。“必临到他们身上”保留启示文学的压迫感；不补出“刑罚”“罪行”或“揭露”等原文未明说的内容。
