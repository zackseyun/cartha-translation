base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/003.yaml
  text: And Mikael answered again and said to Rufael, "Who is he whose heart is not softened concerning it, and whose kidneys are not troubled by this word of severity and the sentence that has gone out against them because of those who brought them out thus?"
translation:
  language: zh_hans
  text: 米迦勒又回答拉斐尔说：“有谁的心不为此[b]软化，双肾[a]也不因这严厉的话和那因那些把他们这样带出来的人而向他们发出的判决[c]而不安呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他的双肾”。古代语言常以肾象征人内在的情感或良知；也可意译为“肺腑”或“内心深处”。
    reason: lexical_alternative
  - marker: b
    text: 原文代词的具体所指不明；也可译作“因它”或“对于它”。
    reason: referential_ambiguity
  - marker: c
    text: 埃塞俄比亚文末句有文本和句法上的困难，尤其是抄本中以括号标出的词。这里谨慎译作“因那些把他们这样带出来的人”；也可能理解为“从他们中间如此发出”。
    reason: textual_variant
lexical_decisions:
- source_word: አውሥአ ካዕበ
  choice: 又回答
  rationale: ካዕበ表示重复或再次发生；“又回答”自然保留叙事公式及“再次”的含义。
- source_word: ሚካኤል ለሩፋኤል
  choice: 米迦勒……拉斐尔
  rationale: 采用现代中文中通行且可辨识的音译，不把名字所含意义译成称号。
- source_word: ዘኢይረክሕ ልቡ
  choice: 心不……软化
  rationale: 原动词有变软、变温柔或受触动之意；直译身体意象，避免笼统改写为“无动于衷”。
- source_word: ዲቤሃ
  choice: 因这事
  rationale: 介词加阴性单数代词的所指在上下文中并不明确；“这事”保持指代宽泛，不强定其先行词。
- source_word: ኢይትሀወክ ኵልያቲሁ
  choice: 双肾……不安
  rationale: ኵልያት字面指肾，在古代闪族式身体观中可代表情感与良知的内在所在；正文保留具体身体意象，并以脚注说明。
- source_word: ቃለ ጽነኒ
  choice: 严厉的话
  rationale: 该词组表达严峻、刚硬或带来苦难的宣告；“严厉的话”既贴近字面，也保留审判语境。
- source_word: ፅእት ዲቤሆሙ
  choice: 向他们发出的判决
  rationale: 原文含“出去、发出”与“在他们之上/针对他们”的结构；“发出的判决”体现司法性宣告。
- source_word: '[እምኔሆሙ] ዘአውፅእዎሙ ከመ''ዝ'
  choice: 因把他们这样带出来的人
  rationale: 保留关系从句“把他们这样带出来”，并将እም按原因理解；因括号内词及整句关系有文本困难，另加脚注，不把此解释说成确定无疑。
theological_decisions:
- issue: “心”与“肾”的人观意象
  choice: 正文保留“心”和“双肾”两个身体词
  alternative: 译作“内心”与“肺腑”，或抽象化为“心灵”与“内在”
  rationale: 原文以身体器官承载道德及情感反应。保留两者可避免把古代具身语言扁平化为现代心理术语。
- issue: 末句所表达的因果关系
  choice: 译作判决“因”那些把他们带出来的人而发出，同时明确标注文本困难
  alternative: 译作“从他们中间如此发出”，或“从他们面前发出”
  rationale: እም可表达原因，且关系从句不可省略；但抄本中括号词和句法均不稳定，因此正文采取谨慎读法，脚注保留其他可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。问句保留原文连续否定形成的反问力度；“双肾”虽不属日常心理表达，但为保存古代具身意象而保留，并以脚注帮助普通读者理解。
