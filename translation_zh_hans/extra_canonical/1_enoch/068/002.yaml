base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/002.yaml
  text: And on that day Michael answered[a], saying to Raphael, “The power of the spirit seizes me and provokes me to anger because of the severity of the judgment concerning the hidden secrets. Who is there that can endure the severe judgment that has been executed[c][b], and before which they melt away?”
translation:
  language: zh_hans
  text: 那一天，米迦勒回答拉斐尔，说：“灵的力量攫住我，使我发怒，因为有关隐秘之事的判决极其严厉。谁能承受这已经施行的严厉判决？他们在它面前消融。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውሥአ
  choice: 回答
  rationale: 这是叙事中常见的回应动词；与后面的“说”连用，保留对话场景。
- source_word: ኀይሉ ለመንፈስ
  choice: 灵的力量
  rationale: 保留属格结构和“力量”的主动、压倒性意味；“灵”不加神学限定。
- source_word: ይመሥጠኒ
  choice: 攫住我
  rationale: 表达强力抓取、控制之意，也保留异象语言的鲜明力度。
- source_word: ያምዕዐኒ
  choice: 使我发怒
  rationale: 该形式带有使役意义，词根涉及发怒或愤慨；如此译出具体的情绪与审判语境。
- source_word: ዕፁቡ
  choice: 极其严厉／严厉
  rationale: 该词可表示严酷、可怕或难以承受；在此按审判语境译为“严厉”，同时避免把情绪色彩规定得过死。
- source_word: እንተ ኅቡኣት
  choice: 隐秘之事
  rationale: 指被隐藏或保密的事项；“隐秘之事”自然地保留启示文学语感。
- source_word: ተዐግሦተ
  choice: 承受
  rationale: 表达在压倒性的事物之下担当、忍受或支撑得住。
- source_word: ተገብረት
  choice: 已经施行
  rationale: 保留完成、被实行的语义；结合上下文呈现判决已经执行，但在脚注中保留更宽泛的理解。
- source_word: ይትመሰዉ
  choice: 消融
  rationale: 保留在强大审判面前熔化、消解的末世性意象。
theological_decisions:
- issue: መንፈስ指一般的灵还是特指神的灵
  choice: 灵
  alternative: 圣灵／神的灵
  rationale: 吉兹文本本身没有明确指定其为圣灵；不加“圣”或“神的”，以保留所指对象的开放性。
- issue: ዕፁቡ及重复的耳语词组究竟指严厉的审判，还是耳朵听见的可怕之事
  choice: 有关隐秘之事的判决极其严厉
  alternative: 耳朵所听见、有关隐秘之事的可怕事情
  rationale: 传本文句艰涩，且似有重复成分。正文采用上下文中较连贯的审判理解，脚注明示另一种较直译的可能。
- issue: 末句所不能承受的是审判本身，还是审判的揭示／所发生的可怕之事
  choice: 承受这已经施行的严厉判决
  alternative: 承受这已经发生的可怕之事
  rationale: 上下文支持“判决”，但原文表达可更宽泛，因此不把另一解释排除在外。
- issue: “他们消融”的主语所指
  choice: 改用“不在它面前消融”的反问结构
  alternative: 他们在它面前消融
  rationale: 原文复数主语的具体先行词不明；中文正文通过反问延续“谁”的泛指，避免擅自指定某一群体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。人名按中文宗教文献中的通行译法作“米迦勒、拉斐尔”。正文尽量保持吉兹语的强烈意象和神学歧义，不把“灵”明确解释为圣灵，也不擅自确定末句复数主语。
