base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/066/001.yaml
  text: And after this he showed me the angels of punishment[c][b][a], who are prepared to come and release all the power of the waters.
translation:
  language: zh_hans
  text: 此后，他让我看见那些施行惩罚的天使；他们已经预备好，要来释放众水的一切威力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经预备好”所依据的吉兹语形式较难确定，也可译作“已经准备就绪”。“释放”原意也可作“打开”或“解开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ ዝ
  choice: 此后
  rationale: 这是异象叙事中常见的时间承接语，简洁自然地表达前后次序。
- source_word: አርአየኒ
  choice: 他让我看见
  rationale: 保留使役和视觉含义，比“向我启示”更贴近原文。
- source_word: መላእክተ መቅሠፍት
  choice: 施行惩罚的天使
  rationale: 用自然的现代汉语表达属格关系，同时保留末世审判语境；“惩罚”比“鞭打”宽泛，也不弱化为一般管教。
- source_word: እለ ይልዋን
  choice: 他们已经预备好
  rationale: 该困难形式似乎表示准备妥当或处于待命状态；此译保留这一基本含义。
- source_word: ከመ ይምጽኡ
  choice: 要来
  rationale: 在表示准备的结构之后，以“要来”自然表达目的或预期行动，不强行限定其语法关系。
- source_word: ወይፍትሑ
  choice: 释放
  rationale: 该动词可表示打开、解开或释放；与“威力”搭配时，“释放”在汉语中自然，并符合洪水力量被放出的图景。
- source_word: ኵሎ ኀይለ ማይ
  choice: 众水的一切威力
  rationale: “众水”保留原文水的宇宙性、集合性意象，“一切威力”则忠实传达全部力量被释放。
theological_decisions:
- issue: 施行惩罚者的性质
  choice: 把他们译为施行惩罚的超自然天使
  alternative: 人间执行审判的使者，或仅施行温和管教的天使
  rationale: 本书相关异象语境经常描绘天使执行宇宙性的审判，而释放众水威力的行动也支持天上审判执行者这一理解。
- issue: “打开/释放”众水威力的意象
  choice: 正文采用“释放”，保留力量被放出的图景
  alternative: 较形式化地译作“打开众水的一切威力”
  rationale: 原动词确有“打开”义，但汉语通常不说“打开威力”；“释放”既在其语义范围内，也避免把具体机制解释成原文未明说的闸门。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“施行惩罚的天使”比生硬的“惩罚之天使”更易懂；“众水”保留启示文学的宏阔意象。
