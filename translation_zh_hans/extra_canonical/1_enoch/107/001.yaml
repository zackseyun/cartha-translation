base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/107/001.yaml
  text: And I saw written upon them that generation after generation will transgress[a], until a generation of righteousness arises, and iniquity is destroyed, and sin passes away from the earth[b], and every good thing comes upon it.
translation:
  language: zh_hans
  text: '我看见，其上写着：一代又一代都要违犯[a]，直到公义的一代兴起；不义必被除灭，罪必从地上消逝，一切美善都必临到地上。


    “现在，我儿，你去告诉你儿子拉麦：这个所生的儿子确实是他的儿子，并非虚假。”


    玛土撒拉听见他父亲以诺的话以后——以诺曾在隐秘中把一切事显给他看——就回去看那孩子，给这个儿子起名叫挪亚[b]，因为他必使大地因脱离一切毁灭而欢喜。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “违犯”也可译作“背逆”或“犯罪”。
    reason: lexical_ambiguity
  - marker: b
    text: “挪亚”是通行译名；这里原文用“使大地欢喜”来解释这个名字。
    reason: name_wordplay
lexical_decisions:
- source_word: ጽሑፈ፡ በላዕሌሆሙ
  choice: 有话论到他们写着说
  rationale: ጽሑፈ 表示“写着的／所写之事”，በላዕሌሆሙ 可表示“在他们之上”或“论到他们”。这里采用自然中文“论到他们写着说”，同时不擅自补出原文未明说的书写载体。
- source_word: ትኤብስ
  choice: 背逆
  rationale: 该动词在此表示越界、违犯或犯罪。“背逆”既保留道德与宗教性的违抗含义，也比笼统的“犯错”更符合末世审判语境。
- source_word: ትውልደ፡ ጽድቅ
  choice: 公义的一代
  rationale: 按名词属格结构直译，保留“公义”与“世代／一代”之间可能兼具性质与归属的关系，不改写为特定群体称号。
- source_word: አበሳ
  choice: 不义
  rationale: 该词可涉及罪责、过犯或邪恶；与随后“罪”并列时译作“不义”，避免两个词在中文中完全重合。
- source_word: ትትለሐስ
  choice: 消逝
  rationale: 字面意象可能是“被舔去／抹去”。“消逝”在中文中自然地表达从地上彻底除去，又不额外规定施事者。
- source_word: አማን፡ ወኢኮነ፡ ሐሰተ
  choice: 确实是他的儿子，并非虚假
  rationale: 保留“真实／确实”与“虚假”之间的鲜明对照；这里的重点是确认孩子的亲子归属，而不是评价孩子的品格。
- source_word: ያስተፌሥሓ
  choice: 使……欢喜起来
  rationale: 这是使役形式，核心义为“使欢喜”。不以传统名称解释直接替代该动词。
- source_word: ኖኅ
  choice: 挪亚
  rationale: 采用现代汉语中通行的人名形式；原文紧接着以“使大地欢喜”解释命名。
theological_decisions:
- issue: 连续世代的背逆与公义世代的兴起
  choice: 一代又一代都要背逆，直到公义的一代兴起
  alternative: 世世代代都要犯罪，直至义人的世代兴起
  rationale: 保留原文由连续背逆到公义世代兴起的末世张力；不把“公义的一代”明确限定为“义人群体”或某一特定救赎时代。
- issue: 孩子确为拉麦之子
  choice: 确实是他的儿子，并非虚假
  alternative: 真是他的儿子，不是冒充的
  rationale: 原文确认亲子关系，但没有解释拉麦疑虑的原因；译文不引入关于孩子超自然外貌或身世的传统细节。
- issue: 挪亚之名的解释
  choice: 因为他必使大地从一切毁灭中欢喜起来
  alternative: 因为他必安慰遭受一切毁灭的大地
  rationale: 依所供吉兹文的使役动词保留“使欢喜”之义，而不以其他传统版本常见的“安慰”取代；“从一切毁灭中”保留介词关系的开放性。
- issue: 隐秘启示的内容
  choice: 以诺曾在隐秘中把一切事都指给他看
  alternative: 因为以诺曾暗中把一切作为显给他看
  rationale: 句法中的代词与“作为／事情”的范围略有压缩，译文以插入说明保留最自然的指称关系，不进一步说明这些事究竟是过去行为还是未来事件。
translation_notes:
  register: 采用庄重而现代的叙事与预言语体。首段保留简洁的末世宣告和平行结构；人物对话使用自然的现代汉语。对书写载体、拉麦疑虑的背景及挪亚名字的传统词源均不作原文之外的补充。
