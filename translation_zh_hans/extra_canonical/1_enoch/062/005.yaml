base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/005.yaml
  text: And one half of them shall look at the other half[a], and they shall be terrified, and their faces shall fall[b], and pain shall seize them when they see that Son of Man sitting on the throne of his glory.
translation:
  language: zh_hans
  text: 他们中一半人要望着另一半人[a]；他们必惊恐，脸也垂下来；当他们看见那位人子坐在他荣耀的宝座上时，痛苦便攫住他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“他们的一半望着他们的另一半”；这可能描绘人群分成两半、彼此相望。也可理解为“他们彼此相望”。
    reason: lexical_alternative
  - marker: b
    text: “那位人子”在《比喻篇》中是一个具有末世意味的称号；这里按本段自身的用法保留，不据后来的教义措辞作进一步解释。
    reason: cross_reference
lexical_decisions:
- source_word: መንፈቆሙ ... ለመንፈቆሙ
  choice: 他们一半人……另一半人
  rationale: 保留重复名词所呈现的两半或两群人的具体画面，不将其顺译成较笼统的“彼此”。
- source_word: ይሬእዩ
  choice: 望着／看见
  rationale: 这是普通的“看”之动词；首处搭配另一半人，用“望着”自然，后处引出所见异象，用“看见”准确。
- source_word: ይደነግጹ
  choice: 惊恐万状
  rationale: 末世审判场景要求较强烈的恐惧语气，比“惊讶”或“不安”更符合上下文。
- source_word: ይቴሕቱ ገጾሙ
  choice: 垂下脸来
  rationale: 该习语表达因羞愧或恐惧而面容低垂；译文保留可见的身体姿态，同时避免生硬的“脸落下”。
- source_word: ይእኅዞሙ ሕማም
  choice: 痛苦要抓住他们
  rationale: 尽量保存“痛苦／病痛抓住他们”的拟人化结构，也不限定为纯身体或纯心理的痛楚。
- source_word: ወልደ ብእሲ
  choice: 人子
  rationale: 在《比喻篇》中，这一表达指向特定的末世人物；“人子”保留其称号性质，又不额外加入后期教义解释。
- source_word: ይነብር
  choice: 坐在
  rationale: 此动词可指居住、停留或坐着，但与宝座连用时，以“坐在”最贴切；宝座本身已传达登基意味。
- source_word: መንበረ ስብሐቲሁ
  choice: 他荣耀的宝座
  rationale: 保留“宝座—荣耀”的属格关系，并使用现代汉语中庄重而自然的表达。
theological_decisions:
- issue: ወልደ ብእሲ 是称号还是泛指普通人
  choice: 译作特指称号“那位人子”
  alternative: “那个人”或“那位凡人”
  rationale: 本书《比喻篇》的局部语境将这表达用于一位明确的末世施行者；同时保留指示词所表达的“那位”，但不借此导入新约以后形成的额外教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。首句保留原文“两半人”的具体而略显奇特的异象画面；“痛苦要抓住他们”保留拟人化力度。所有脚注标记均置于正文对应位置。
