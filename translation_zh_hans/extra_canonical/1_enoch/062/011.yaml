  text: And he will deliver them over to the angels for punishment[a][b].
translation:
  language: zh_hans
  text: 他要把他们交给众天使，使他们受惩罚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们受惩罚”也可理解为“把他们交给众天使，并施以惩罚”。原文中“惩罚”一语可表示移交的目的或结果，也可能带有伴随或工具性的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይሜጥዎሙ
  choice: 他要把他们交给
  rationale: 该动词在此表示把人移交到他者的权下或看管中；“交给”自然地保留了审判语境中的移交意味，前缀连词“和/于是”在单节独立呈现时不必机械译出。
- source_word: ለመላእክት
  choice: 众天使
  rationale: 介词标示接受者；译作“交给众天使”直接表达他们被移交给天使看管，而不擅自限定为某一类专司惩罚的天使。
- source_word: በመቅሠፍት
  choice: 使他们受惩罚
  rationale: 该名词可指惩罚、责打或管教；结合移交结构，以目的或结果表达最符合现代汉语，同时避免把惩罚过度具体化为肉体折磨。
theological_decisions:
- issue: 天使的身份与职能
  choice: 保留“众天使”这一未加限定的称呼，并由“受惩罚”表达审判语境
  alternative: 译作“施行惩罚的天使”
  rationale: 吉兹文只说“天使”，没有明确指定其类别；不应由语境推导出原文未明说的专门称谓。
- issue: 惩罚与移交之间的关系
  choice: 按目的或结果译为“使他们受惩罚”
  alternative: 译为“带着惩罚交给众天使”或“交给众天使惩罚”
  rationale: 介词结构可有目的、结果或工具色彩；正文采用自然且符合司法语境的目的表达，脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。因所提供的吉兹文证据仅含这一分句，正文不补入其他版本或完整章节中可能续有的内容。
