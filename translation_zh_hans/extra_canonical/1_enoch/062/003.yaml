base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/003.yaml
  text: And in that day all the kings and the mighty and the exalted[a], and those who possess the earth, shall stand up, and they shall see and recognize that he sits on the throne of his glory; and righteousness shall be judged before him[b], and no lying word shall be spoken before him.
translation:
  language: zh_hans
  text: 在那日，所有君王、有权势者、居高位者，以及掌控大地的人[a]，都必站起来。他们必看见并认出，他坐在他荣耀的宝座上；公义必在他面前受审[b]，任何虚谎的话都不得在他面前说出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“占有大地的人”或“统治这地／世界的人”。吉兹语动词可表示持有、占有或实施控制。
    reason: lexical_alternative
  - marker: b
    text: “公义必在他面前受审”这一分句在埃塞俄比亚文本中无论文本还是句法都较难确定。译文保留原措辞的司法含义，没有将它润饰成更常见的表达。
    reason: textual_variant
lexical_decisions:
- source_word: ወይቀውሙ
  choice: 都必站起来
  rationale: 该动词可表示起来或站起。这里采用“站起来”，保留审判庭般的身体动作意象，同时不把它过度解释为复活。
- source_word: በይእቲ ዕለት
  choice: 在那日
  rationale: 保留启示文学和先知话语中庄重而常见的时间表达。
- source_word: ኵሎሙ ነገሥት ወዐዚዛን ወልዑላን
  choice: 所有君王、有权势者、居高位者
  rationale: 分别保留三类社会政治权贵，不将其合并为笼统的“统治者”；用现代汉语表达原文递进而庄严的修辞。
- source_word: ወእለ ይእኅዝዋ ለምድር
  choice: 以及掌控大地的人
  rationale: 原动词可指抓住、持有、占有或控制。“掌控大地”在现代汉语中较自然，也保留政治统治、占有和支配之间的语义宽度。
- source_word: ወይሬእይዎ ወያአምርዎ
  choice: 他们必看见并认出
  rationale: “看见”表达感知，“认出”表达进一步的辨认与承认，比单纯的“知道”更能呈现这一动词组合。
- source_word: ከመ ይነብር ዲበ መንበረ ስብሐቲሁ
  choice: 他坐在自己荣耀的宝座上
  rationale: 保留登基和审判庭的图景；“自己荣耀的宝座”清楚表达第三人称所有关系，同时不增添原句未明说的身份称号。
- source_word: ወጽድቅ ቅድሜሁ ይትኴነን
  choice: 公义必在他面前受审
  rationale: 原句在埃塞俄比亚文本中句法和语义均较困难，但名词明确为“公义”，动词具有司法意味。译文保留这一不寻常表达，不擅自润饰成“他必施行公义的审判”等较熟悉说法。
- source_word: ወነገረ በከ አልቦ ዘይትበሀል በቅድሜሁ
  choice: 任何虚谎的话都不得在他面前说出
  rationale: 保留在其面前不容虚假言辞的法庭语境；“虚谎的话”兼顾虚假和欺骗之意。
theological_decisions:
- issue: 坐宝座者的身份
  choice: 仅用“他”，不明说其为“人子”或“诸灵之主”
  alternative: 依据上下文直接补明为“人子”或“诸灵之主”
  rationale: 本节原文本身只使用代词。保留代词可维持本节局部措辞中的身份开放性，不以周围经文替本节补入称号。
- issue: “掌控大地的人”的所指
  choice: 保持其政治与宇宙性的宽泛含义
  alternative: 限定为地主、占有土地者或统治世界者
  rationale: 原文动词可涵盖持有、占有和控制；启示文学语境可能有意兼容这些含义，因此不宜过早缩窄。
- issue: 公义“受审”的困难表达
  choice: 保留“公义必在他面前受审”
  alternative: 译为“公义的审判必在他面前施行”或“他必按公义审判”
  rationale: 替代译法较流畅，却会改变原文中“公义”作为该司法动词语法主体的异常结构。正文保留文本张力，并用脚注提示困难。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在那日”“荣耀的宝座”等表达保留启示文学语体；整体避免文言化。脚注标记均置于正文对应短语之后。
