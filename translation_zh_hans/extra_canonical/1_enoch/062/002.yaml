base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/002.yaml
  text: And the Lord of Spirits seated him on the throne of his glory[a], and the spirit of righteousness was poured out upon him, and the word of his mouth slays all the sinners[d][c][b], and all the lawless are destroyed from before his face.
translation:
  language: zh_hans
  text: 万灵之主使他坐在自己荣耀的宝座上[a]；公义之灵倾注在他身上[b]；他口中的话杀尽所有罪人，所有悖逆者都从他面前灭亡[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”承接上文所述的人物。原文动词是使役、及物形式，意思是“使他坐下”或“使他就座”，不是“万灵之主坐下”。
    reason: grammar_and_context
  - marker: b
    text: 原文直译为“公义之灵倾注在他身上”。这里的“他”也可按上下文理解为坐在宝座上的那一位；译文保留代词，不进一步明定其身份。
    reason: referential_ambiguity
  - marker: c
    text: “从他面前”是带有空间形象的审判用语，表示他们在他的临在中被除灭。原文后两个动词为未完成体，也可带有持续、特征性或将来的意味。
    reason: idiom_and_aspect
lexical_decisions:
- source_word: አንበረ
  choice: 使他坐在
  rationale: 该动词为使役、及物用法，表示“使……坐下／使……就座”；宾语承接上文，在中文中补出“他”，以准确呈现登基场景。
- source_word: እግዚእ መናፍስት
  choice: 万灵之主
  rationale: 保留《以诺一书》中这一固定的神圣称号；“万灵”在现代汉语中比“诸灵”更自然庄重，也表达众灵之主的含义。
- source_word: መንበረ ስብሐቲሁ
  choice: 自己荣耀的宝座
  rationale: 保留“荣耀”与“宝座”的属格关系，同时用反身代词明确其指向主，符合自然汉语。
- source_word: መንፈሰ ጽድቅ
  choice: 公义之灵
  rationale: 保持原文简洁而庄严的结构；“公义”兼具道德与审判意味，不将其缩窄为单纯的司法“正义”。
- source_word: ተክዕወ ዲቤሁ
  choice: 倾注在他身上
  rationale: 动词具有倾倒、浇灌的鲜明意象；“倾注”既自然又保留其启示文学力度。
- source_word: ነገረ አፉሁ
  choice: 他口中的话
  rationale: 保留话语从其口发出并施行审判的具体意象；中文“口中的话”比机械的“他口的话语”更自然。
- source_word: ይቀትል ኵሎሙ ኃጥኣነ
  choice: 杀尽所有罪人
  rationale: 动词明确表达致死；“杀尽”保留未完成体所呈现的审判效力，并准确传达“所有”的范围。
- source_word: ዐማፂያን
  choice: 悖逆者
  rationale: 该词可指反叛或违抗者；“悖逆者”保留其反抗神圣秩序的意味，又不局限为政治叛乱。
- source_word: እምገጹ ይትሐጐሉ
  choice: 都从他面前灭亡
  rationale: 保留原文空间性的审判惯用语“从他面前”，并以“灭亡”表达其毁灭性结果和未完成体的效力。
theological_decisions:
- issue: “使他坐在”及两个“他”的所指
  choice: 保留男性单数代词“他”，不在正文中以称号替换
  alternative: 明确译为“使那蒙拣选者坐在……；公义之灵倾注在那蒙拣选者身上”
  rationale: 首个“他”在语法上是使役动词所需、由上文承接的隐含宾语；后文代词的具体指向在现存吉兹文中不宜越过文本直接释定，因此正文保留代词，并以脚注说明。
- issue: 口中之话的审判效力
  choice: 译为“他口中的话杀尽所有罪人”
  alternative: 译为“他一开口，所有罪人就都死去”
  rationale: 原文让“口中的话”直接作施行审判的主语；所选译法保留这一启示文学意象，不借用或强行协调其他传统中的固定措辞。
- issue: 后两个动词的时态和体貌
  choice: 使用汉语非过去、概括性表达“杀尽……都……灭亡”
  alternative: 过去式理解：“杀尽了……都灭亡了”
  rationale: 吉兹文由前面的完成体转为未完成体，可表达持续、特征性或将来的审判效力。汉语正文不强制锁定其中一种时间解释，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以分号呈现原文连续并列的三个审判图景；保留“公义之灵”“荣耀的宝座”“从他面前”等启示文学意象，同时避免古奥文言和后期宗派化术语。所有脚注标记均已置于正文相应位置。
