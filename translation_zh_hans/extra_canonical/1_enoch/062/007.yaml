base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/007.yaml
  text: For from the beginning the Son of Man was hidden[a], and the Most High kept him in the presence of his power[b], and revealed him to the chosen ones.
translation:
  language: zh_hans
  text: 因为人子从起初就被隐藏起来，至高者在自己的大能面前保守他[a]，并把他显明给蒙拣选的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凭自己的大能保守他”“在自己的能力面前保守他”，也可译：“在他面前保守他。”原文短语较难确定；正文保留了“在……面前”的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 承接上文并引出理由；现代汉语中“因为”清楚保留其解释性连接作用。
- source_word: እምቅድሙ
  choice: 从起初
  rationale: 此处是时间副词，意为“从起初”或“先前”，不作空间意义的“在他面前”。
- source_word: ኅቡእ ኮነ
  choice: 被隐藏起来
  rationale: 表达持续的隐藏状态，并与后文“显明”形成鲜明对照。
- source_word: ወልደ እጓለ እመሕያው
  choice: 人子
  rationale: 在《比喻篇》中用作特定末世人物的称号；采用汉语中自然且可辨识的“人子”，但不附加后期教义解释。
- source_word: ዐቀቦ
  choice: 保守他
  rationale: 涵盖保存、看守和留存之义，适合表现他在显明以前蒙至高者保守的状态。
- source_word: ልዑል
  choice: 至高者
  rationale: 自然对应这一神圣称号，并符合汉语宗教及启示文学语体。
- source_word: በቅድመ ኃይሉ
  choice: 在自己的大能面前
  rationale: 原短语较难，直译保留空间意象及“大能”这一具体名词，不把它平滑改写成方式状语。
- source_word: ከሠቶ
  choice: 把他显明
  rationale: 与先前的“隐藏”相对，保留启示文学中由隐而显的意象。
- source_word: ለኅሩያን
  choice: 给蒙拣选的人
  rationale: 清楚表达复数群体；“蒙拣选的人”在现代汉语中自然，并避免仅用抽象或过度宗派化的术语。
theological_decisions:
- issue: 如何处理 ወልደ እጓለ እመሕያው 的称号性质
  choice: 人子
  alternative: 人的儿子；活人后裔之子
  rationale: 该短语在本书《比喻篇》中是可辨识的末世人物称号；译作“人子”保留其称号性质，但不借此加入经文本身未明说的基督论解释。
- issue: 如何表达从起初隐藏而后显明的主题
  choice: 从起初就被隐藏起来……保守他……显明
  alternative: 从永恒中被隐藏；由至高者预留
  rationale: 原文明确呈现时间上的先在隐藏及随后的显明，却没有要求译文进一步界定其形而上性质；本译法保留这种神学张力。
- issue: 如何处理 በቅድመ ኃይሉ 的困难表达
  choice: 在自己的大能面前
  alternative: 凭自己的大能；在他面前
  rationale: 保留“大能面前”这一不寻常意象，不把它解释为单纯的工具或方式；脚注列出较自然的可能译法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“从起初”准确体现时间意义；“至高者”“人子”“蒙拣选的人”保持启示文学语域。困难短语不在正文中被过度解释，并以脚注保存其他可能理解。
