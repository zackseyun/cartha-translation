base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/004.yaml
  text: And pain shall come upon them as upon a woman in labor[a], when her child comes to the mouth of the womb[c][b], and she is constrained in giving birth.
translation:
  language: zh_hans
  text: 痛苦必临到他们，正如临到正在分娩的妇人；当她的孩子来到子宫口[a]时，她在分娩时备受煎熬。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“子宫的口”；这是加强分娩图景的解剖性表达。
    reason: lexical_alternative
  - marker: b
    text: 原文见证中，在描述妇人分娩痛苦的分句处有一段括号文字；其句法及文本状态不确定。本译文依照上下文表达其整体意思，未将该短语另行重复译出。
    reason: textual_variant
lexical_decisions:
- source_word: ሕማም
  choice: 痛苦
  rationale: 该词可指身体的疼痛或苦楚；在分娩比喻中译作“痛苦”，既保留具体的产痛，也能承载末世场景中的强烈苦难意味。
- source_word: ውስተ ማሕምም
  choice: 分娩
  rationale: 此处描写妇人正处于产痛和生产的状态。“分娩”是现代汉语中自然、庄重且具体的表达。
- source_word: የዓፅብ / ተዐፅብ
  choice: 备受煎熬
  rationale: 该动词含受压、陷入艰难或被困迫之意；“备受煎熬”在汉语中能表达生产时强烈而难以摆脱的痛楚，又不把含义局限为单纯情绪。
- source_word: ወሊድ
  choice: 生产
  rationale: 该词属于持续的生育意象；“生产”在句末自然地指向分娩过程，并与前文形成呼应。
- source_word: በአፈ ማሕፀን
  choice: 来到子宫口
  rationale: 原文直译为“在子宫的口”；译作“来到子宫口”保留鲜明的解剖意象，同时符合现代汉语表达。
theological_decisions:
- issue: 是否把分娩意象概括为抽象的恐惧或苦难
  choice: 保留产痛、孩子来到子宫口以及生产受苦的完整具体比喻
  alternative: 笼统译作“他们必像临产的妇人一样陷入恐慌”
  rationale: 原文持续使用具体的分娩图景。保留这些细节更符合其末世文学修辞，也避免以抽象解释取代文本本身。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留“痛苦临到他们，如同临到分娩妇人”的对应关系，避免误成“痛苦像妇人”；同时保留原文具体而强烈的生产意象。
