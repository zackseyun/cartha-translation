base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/009.yaml
  text: And all the kings and the mighty and the exalted[a], and those who rule the dry land, shall fall down before him on their faces, and they shall bow down and set their hope on that Son of Man[c][b], and they shall petition him and seek mercy from him.
translation:
  language: zh_hans
  text: 所有的君王、权贵、位高者，以及那些统治陆地[b]的人，都要在他面前俯伏，脸伏于地；他们要向那位人子下拜[a]，把希望寄托在他身上，并要向他祈求，求他怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下拜”也可译作“俯伏行礼”；在较强的语境中，该词也可表示“敬拜”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“干地”或“旱地”，即与海相对的陆地；这里指地上的统治领域。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: 俯伏
  rationale: 该词兼有倒下与伏地之意；结合“在他面前，脸伏于地”，译作“俯伏”既保留具体动作，也符合审判场景的力度。
- source_word: ነገሥት
  choice: 君王
  rationale: 采用通常义“君王”，保留经文所指政治权力的具体性。
- source_word: መዛዝእት
  choice: 权贵
  rationale: 该词泛指有权势者；“权贵”在现代汉语中自然，并能与君王、位高者构成社会等级的并列。
- source_word: ልዑላን
  choice: 位高者
  rationale: 原词指地位崇高的人；“位高者”保留其身份高贵以及随后受降卑的反差。
- source_word: እለ ይመልከዋ ለየብስ
  choice: 那些统治旱地的人
  rationale: 直译保留原文“旱地”的具体意象及统治陆地的含义，不提前泛化为“全地”。
- source_word: በቅድሜሁ በገጾሙ
  choice: 在他面前，脸伏于地
  rationale: 明确呈现两重空间和身体描写，使伏地姿态在汉语中清楚自然。
- source_word: ይሰግዱ
  choice: 下拜
  rationale: “下拜”可表达伏地致敬，却不强行判定为宗教意义上的敬拜，因而保留原词在臣服、尊崇与敬拜之间的张力。
- source_word: ይሴፈዉ
  choice: 把希望寄托在他身上
  rationale: 表达朝向某对象怀抱希望、倚赖他的意思，符合原文的方向性。
- source_word: ለዝኩ ወልደ እጓለ እመሕያው
  choice: 那位人子
  rationale: 该表达在《以诺一书》的比喻篇中具有称号性质；“那位”保留指示语气，“人子”则采用本段中的称号性译法。
- source_word: ይስእልዎ ወይስእሉ ኀቤሁ ምሕረተ
  choice: 向他祈求，求他怜悯
  rationale: 以重复“求”保留两个同根请求动词的修辞呼应，同时使现代汉语自然；“怜悯”准确传达ምሕረተ。
theological_decisions:
- issue: 向人子所作举动是否应明确译为敬拜
  choice: 下拜
  alternative: 敬拜；行礼
  rationale: 原动词可指伏地致敬，也可在较强语境中指敬拜。“下拜”保留尊崇与臣服的力度，却不替文本消除神学上的开放性。
- issue: 如何处理“人子”这一表达的称号性质
  choice: 那位人子
  alternative: 那个人子；那位活人后裔之子
  rationale: 本段语境显示它作为特定末世人物的称号使用；译作“那位人子”保留指示成分和称号感，同时不加入后期教义公式。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。以分号划分伏地、下拜寄望和祈求怜悯三个连续动作；保留“旱地”这一不寻常但有来源依据的具体意象。
