base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/006.yaml
  text: And the kings and the mighty and all who possess the earth shall bless and praise and exalt him who rules over all that is hidden[a][b].
translation:
  language: zh_hans
  text: 君王、权贵和所有掌管大地的人[a]，都要称颂、赞美并尊崇那位统管一切隐秘之事者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有持有大地的人”或“所有占有大地的人”。原文动词可表示持有、占有；这里按地上权势的语境译作“掌管”。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说这位“统管一切隐秘之事者”的称号或身份，因此正文保留描述性的表达。
    reason: alternative_reading
lexical_decisions:
- source_word: ይባርክዎ
  choice: 称颂
  rationale: 此处动词带宾语后缀，处于异象性的将来语境；“称颂”既表达向其祝颂，也保持庄重的敬拜色彩。
- source_word: ይሴብሕዎ
  choice: 赞美
  rationale: 该词表示颂赞或荣耀性的宣扬；“赞美”是现代汉语中最直接自然的对应。
- source_word: የልዕልዎ
  choice: 尊崇
  rationale: 原词有高举、尊为至高之意；“尊崇”比字面的“高举”更符合汉语对尊贵人物的表达，同时保留崇高语体。
- source_word: ነገሥት
  choice: 君王
  rationale: 保留原词明确的王权含义，也与启示文学的庄严语域相称。
- source_word: መዛዝእት
  choice: 权贵
  rationale: 在与君王并列且涉及地上权力的语境中，此词指有势力、有权位者；“权贵”自然地体现其社会政治地位。
- source_word: ኵሎሙ እለ ይእሕዝዋ ለምድር
  choice: 所有掌管大地的人
  rationale: 动词本义可指持有或占有；这里依政治权力语境译作“掌管”，但以脚注保留“持有／占有大地”的字面可能。
- source_word: ለዘይመልክ
  choice: 那位统管……者
  rationale: 关系结构指一位以统治为特征的单数人物；译文保持描述性，不补入原文未明说的称号或身份。
- source_word: ኵሎ ዘኅቡእ
  choice: 一切隐秘之事
  rationale: 原短语范围宽广，可包括所有隐藏、隐而未显之物；不收窄为仅指人的“秘密”。
theological_decisions:
- issue: “统管一切隐秘之事者”这一单数人物的身份
  choice: 在正文中只作描述，不明指其身份
  alternative: 明确译为“灵之主”、“人子／蒙拣选者”或上帝
  rationale: 该节吉兹语只使用关系从句，没有给出明确称号。保持这种未指明状态，可避免凭上下文强行调和，并保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称颂、赞美并尊崇”保留原文三个并列动词的递进与礼赞语气；“君王、权贵”保持政治场景的具体性。所有脚注标记均已置于正文相应位置。
