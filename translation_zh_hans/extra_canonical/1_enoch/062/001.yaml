base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/001.yaml
  text: And thus the Lord commanded the kings and the mighty and the exalted[a], and those who dwell on the earth, and said, “Open your eyes and lift up your horns[b], if you are able to recognize the Chosen One.”
translation:
  language: zh_hans
  text: 于是，主吩咐君王、有权势的人、位高的人，以及住在地上的人，说：“睁开你们的眼睛，扬起你们的角[a]；你们若能，就认出那位蒙拣选者[b]吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”在这里可能象征力量、地位或傲然的权势；正文保留原文的形象说法。
    reason: cultural_note
  - marker: b
    text: 也可译作“被选者”。原文在《比喻篇》中把这个词用作正式称号，并非仅作一般形容。
    reason: lexical_alternative
lexical_decisions:
- source_word: አዘዘ
  choice: 吩咐
  rationale: 该动词表达有权威的命令；“吩咐”既保留主权者发令的力度，也符合庄重而自然的现代汉语。
- source_word: እግዚእ
  choice: 主
  rationale: 保留这一神圣称号所表达的统治与权威，不将其弱化为一般性的“主人”。
- source_word: ነገሥት
  choice: 君王
  rationale: 原词明确指王；“君王”比泛称“统治者”更具体，也适合启示文学语体。
- source_word: ዐዚዛን
  choice: 有权势的人
  rationale: 原词指强大、有势力者；此译清楚自然，并与下一项表示高位身份的词有所区别。
- source_word: ልዑላን
  choice: 位高的人
  rationale: 保留原词关于高位、尊位的意象，同时避免擅自限定为某一特定贵族阶层。
- source_word: እለ የሐድርዋ ለምድር
  choice: 住在地上的人
  rationale: 自然呈现原文关系结构，也保留启示文学中“地上居民”的广泛范围。
- source_word: ክሥቱ አዕይንቲክሙ
  choice: 睁开你们的眼睛
  rationale: 准确传达开启眼睛的命令，并契合此处受命观看、辨认的语境。
- source_word: አንሥኡ አቅርንቲክሙ
  choice: 扬起你们的角
  rationale: 直译并保留“角”这一启示文学意象，不在正文中将其单一解释为力量、地位或骄傲。
- source_word: ትክሉ
  choice: 你们若能
  rationale: 保留原文关于能力的条件意味及其带有挑战性的语气。
- source_word: አእምሮቶ
  choice: 认出
  rationale: 语境重在辨认所显现的特定人物，而不只是获得抽象知识，因此译作“认出”。
- source_word: ሐሩይ
  choice: 那位蒙拣选者
  rationale: 将其作为正式称号处理；“蒙拣选者”既表达被拣选的含义，也自然体现称号性质。
theological_decisions:
- issue: 如何翻译《比喻篇》中作为称号的ሐሩይ
  choice: 那位蒙拣选者
  alternative: 被选者；蒙选者
  rationale: “蒙拣选者”明确保留被拣选的含义和正式称号的分量，却不额外指定其身份，也不将后期神学解释写入正文。
- issue: 是否在正文中解释“扬起你们的角”
  choice: 保留“角”的原始意象
  alternative: 彰显你们的力量；抬高你们的威势
  rationale: “角”可能象征力量、地位或傲然的权势；直接解释会消除原文的多义性，因此正文保留意象，并用脚注说明。
- issue: 如何处理“你们若能”的条件语气
  choice: 保留带挑战意味的条件句
  alternative: 看你们能否认出
  rationale: 原文明确表达能力条件；直译可保留审判场景中的张力，而不把它改写成单纯疑问。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。列举称谓时保持原文各项之间的区别；命令句简洁有力。保留启示文学的“角”意象和“你们若能”的修辞张力，不在正文中消解其多义性。
