base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/008.yaml
  text: And the congregation of the chosen and the holy ones shall be sown[c][b][a], and all the chosen shall stand before him on that day.
translation:
  language: zh_hans
  text: '蒙拣选者和圣者的会众[a][b]必被播种[c]；到那日，所有蒙拣选者都必站在他面前。


    [a] “会众”也可译作“集会”或“群体”。


    [b] “圣者”可能指分别为圣的群体；在启示文学中，也可能包括天上的圣者。


    [c] 原文直译为“被播种”，保留了栽植、繁衍或建立群体的隐喻。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”也可译作“集会”或“群体”。
    reason: lexical_alternative
  - marker: b
    text: “圣者”可能指分别为圣的群体；在启示文学中，也可能包括天上的圣者。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“被播种”，保留了栽植、繁衍或建立群体的隐喻。
    reason: metaphor_clarification
lexical_decisions:
- source_word: ወይዘራእ
  choice: 必被播种
  rationale: 该词形来自“播种”之意的动词，是被动未完成式；直译可保留《以诺一书》中栽植义人群体的意象，不误作“被看见”。
- source_word: ማኅበረ
  choice: 会众
  rationale: 表示聚集成群的人；“会众”既保留集合含义，也符合庄重的启示文学语体。
- source_word: ኅሩያን
  choice: 蒙拣选者
  rationale: 准确表达“被选择的人”，同时避免“选民”可能带入的特定族群或后世教义含义。
- source_word: ቅዱሳን
  choice: 圣者
  rationale: 保留复数名词的宽泛指称，不预先限定为人间圣徒或天上圣者。
- source_word: ወይቀውሙ
  choice: 都必站
  rationale: 直接表达站立或立于某人面前的动作，适合审判场景。
- source_word: በቅድሜሁ
  choice: 在他面前
  rationale: 自然表达临在于某人之前，也保留司法或朝见场景的意味。
- source_word: ኵሎሙ
  choice: 所有
  rationale: 明确保留原文的全称强调。
- source_word: በይእቲ ዕለት
  choice: 到那日
  rationale: 符合现代汉语，也保留启示文学中指向终末时刻的固定表达。
theological_decisions:
- issue: ቅዱሳን所指的是人间忠信者还是天上圣者
  choice: 译作“圣者”，不限定所指
  alternative: 译作“圣徒”并明确理解为人间义人，或译作“天上圣者”并明确理解为天使性存在
  rationale: 该词与“蒙拣选者”并列，较可能指义人群体，但启示文学中的类别有时重叠；采用宽泛译法可保存原文的开放性。
- issue: “被播种”这一隐喻的具体神学含义
  choice: 保留播种隐喻，不解释为显现、繁衍或定居中的任何一种
  alternative: 意译为“被栽植”“兴起”或“显现”
  rationale: 原文动词明确属于播种语义域，但其隐喻落点并未在本节充分说明；直译可保存《以诺一书》有关义之栽植的意象及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“蒙拣选者”比单用“选民”更贴近被动含义；“圣者”保留人间与天上所指之间的可能张力。句子以分号连接群体被播种与末日站立两个画面。
