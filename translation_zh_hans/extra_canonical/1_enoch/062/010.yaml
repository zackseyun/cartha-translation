base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/010.yaml
  text: And the Lord of Spirits will drive them so that they hasten and go out from before his face[a], and their faces will be filled with shame[c][b], and darkness will be added to their faces.
translation:
  language: zh_hans
  text: 万灵之主必驱赶他们，使他们急忙从他面前出去[a]；他们脸上必满了羞愧，黑暗必加在他们脸上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开他的临在。”原文较直译为“从他脸面之前出去”。
    reason: lexical_alternative
  - marker: b
    text: “加在”也可理解为“增添在”。原文强调黑暗的增加，并非明确说黑暗“遮盖”他们的脸。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይጐጕኦሙ
  choice: 必驱赶他们
  rationale: 该动词表达以强力催逼、驱赶；此处保留审判场景中的强制意味，不特别解释为使人惊恐。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 这是《以诺一书》中固定的启示文学称号；“万灵”在现代汉语中自然凝练，也表达众灵皆在其权下。
- source_word: ከመ ይፍጥኑ
  choice: 使他们赶快
  rationale: 保留目的或结果意味，并体现受驱赶者被迫迅速行动。
- source_word: ወይፃኡ እምቅድመ ገጹ
  choice: 从他面前出去
  rationale: 原文直陈“从他脸面之前出去”；汉语“从他面前”既保留脸面/临在意象，也符合自然表达。
- source_word: ገጾሙ ይመልእ ኃፍረተ
  choice: 他们的脸必满是羞愧
  rationale: 明确保留“脸”的意象以及公开蒙羞的审判意味。
- source_word: ጽልመት ይትዌሰክ ገጾሙ
  choice: 黑暗也必加在他们脸上
  rationale: ተወሰከ 的核心意思是“增加、加上”；译作“加在”保留累加意象，避免改成原文没有明确表达的“遮盖”。
theological_decisions:
- issue: 以脸面表达神的临在
  choice: 从他面前出去
  alternative: 离开他的临在
  rationale: 原文明确使用“脸/面”一词。正文保留具体而具宫廷色彩的启示文学意象，不把它抽象化为“临在”。
- issue: 审判中黑暗的累加意象
  choice: 黑暗也必加在他们脸上
  alternative: 黑暗必遮盖他们的脸
  rationale: 原文动词侧重增加或加上，而非遮盖；因此保留较不寻常却忠于原文的神学张力，不将其解释成单纯的覆盖。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万灵之主”作为全书固定称号；平行保留“脸”与“面前”的审判意象。末句有意采用略具异质感的“加在他们脸上”，以准确呈现原文的累加含义。
