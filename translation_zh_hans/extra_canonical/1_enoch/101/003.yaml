revisions:
- from: 如果他因你们一切所行的向你们发出烈怒，你们岂不会向他恳求吗？因为你们说狂妄严厉的话，攻击他的公义[a]；你们得不到平安。
  to: 如果他因你们一切所行的事，把他的烈怒降在你们身上，你们岂不向他恳求吗？因为你们说出攻击他公义[a]的夸大而严厉的话；你们没有平安。
  rationale: 修订保留原文的条件句、反问语气、代词指称和审判语域；将“狂妄”改为“夸大”，以更直接对应“great”，并保留“严厉”对应“harsh”。末句改为现状判语，避免加入原文未明示的未来或能力色彩。
