base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/003.yaml
  text: And if he sends his wrath upon you for all your deeds[a], will you not entreat him? For you speak great and harsh words against his righteousness[d][c][b], and you have no peace.
translation:
  language: zh_hans
  text: 如果他因你们一切所行的事，把他的烈怒降在你们身上，你们岂不向他恳求吗？因为你们说出攻击他公义[a]的夸大而严厉的话；你们没有平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”在这里也可译作“公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈነወ
  choice: 发出
  rationale: 保留“差遣、发出”的基本意象，使烈怒呈现为朝听众而来的审判。
- source_word: መዐቶ
  choice: 烈怒
  rationale: 比普通的“愤怒”更能传达末世审判语境中的强烈与司法意味。
- source_word: በኵሉ ምግባሪክሙ
  choice: 因你们一切所行的
  rationale: 明确烈怒与听众全部行为之间的因果关系，同时保持现代汉语自然。
- source_word: አኮ አንትሙ እለ ታስተበቍዕዎ
  choice: 你们岂不会向他恳求吗
  rationale: 将አኮ理解为期待肯定回答的反问，而非简单否定；“恳求”准确表达哀求、祈求之义。
- source_word: ጽድቅ ዚአሁ
  choice: 他的公义
  rationale: 保留该词广泛的道德正直含义，同时在审判语境中自然包含公正之意。
- source_word: ዐቢይተ ወጽኑዓተ
  choice: 狂妄严厉的话
  rationale: “严厉”保留“坚硬、苛刻”的字面及以诺传统用语；“狂妄”在汉语中传达“大话”所含的僭妄意味，避免生硬直译。
- source_word: አልብክሙ ሰላመ
  choice: 你们得不到平安
  rationale: 以简洁的判语表达平安不属于他们；较“你们没有平安”更符合自然汉语。
theological_decisions:
- issue: ጽድቅ在审判语境中应译为“公义”还是“公正”
  choice: 他的公义
  alternative: 他的公正
  rationale: 这里虽有司法审判背景，但所攻击的不仅是某项裁决，也包括神整体的道德正直；“公义”保留较宽的语义范围。
- issue: 发出烈怒者是否应明确为神
  choice: 保留代词“他”
  alternative: 明确译作“神”或“主”
  rationale: 原文仅用代词，语境足以表明所指；不补入原文没有的神名。
- issue: አኮ的否定或反问功能
  choice: 译为期待肯定回答的反问“岂不会……吗”
  alternative: 译为否定陈述“你们不能向他恳求”
  rationale: 反问读法符合连续问句的语境，也保留审判临到时罪人必会恳求的意义，避免将句意反转。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“岂不会”保留修辞问句，用“发出烈怒”“攻击他的公义”维持启示文学的审判语气；避免添加原文未明说的神名。
