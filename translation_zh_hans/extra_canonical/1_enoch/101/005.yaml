base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/005.yaml
  text: And because of this they fear[a], for all their good possessions go out into the sea with them, and they do not think good in their hearts[b], for the sea will swallow them and they will sink in it.
translation:
  language: zh_hans
  text: 他们因此害怕[a]，因为他们所有的贵重财物都随他们进入海中；他们心里不作美好的设想[b]，因为海要吞没他们，他们也要沉入海中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “害怕”所用的原文形式也可译作“将要害怕”；这里按上下文理解为对风暴中航海者处境的概括性描写。
    reason: tense_aspect
  - marker: b
    text: 原文直译近于“他们心里不想好的”。这句话可指他们在恐惧中不作美好的设想；也可能指他们心里不再顾念自己的贵重财物，或指他们心里不思想善事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይፈርሁ
  choice: 他们害怕
  rationale: 未完成式在上下文中延续对风暴中航海者的概括性当下描写，用现在时比将来时更贴切。
- source_word: ኵሉ ንዋዮሙ ሠናይ
  choice: 他们所有的贵重财物
  rationale: ንዋይ 指财物、产业；ሠናይ 在此修饰其贵重、上好，避免误作抽象的善。
- source_word: ይወፅእ ውስተ ባሕር ምስሌሆሙ
  choice: 都随他们驶入海中
  rationale: 保留财物与主人一同出海的意思；中文以“驶入”自然表达航海语境，同时不引入“被抛入”等被动含义。
- source_word: ወሠናየ ኢይሐልዩ በልቦሙ
  choice: 他们心里想不到好的结局
  rationale: 原文直近“心里不想好的”，可能描述危难中的绝望，也可能回指财物或含道德意义；正文按当前语境表达其不能作乐观之想，并以脚注保留歧义。
- source_word: ባሕር ይውኅጦሙ
  choice: 海要吞没他们
  rationale: “吞没”保存原文鲜明、具象的灾难图景。
- source_word: ወይትኀጐሉ ውስቴታ
  choice: 他们也要沉入海中
  rationale: 在海难语境中以“沉入”表达其在海中覆亡，并保留方位意义，避免扩写为抽象的毁灭。
theological_decisions:
- issue: “心里不想好的”究竟指绝望、财物，还是道德上的善
  choice: 正文理解为航海者在恐惧中想不到好的结局
  alternative: 也可理解为他们心里不再顾念自己的财物，或他们心里不思想善事
  rationale: 本节紧接风暴中航海者的恐惧，心理层面的理解较顺；但 ሠናየ 本身可指好的事物、善或前述贵重财物，因此不把潜在的道德含义定死，并在脚注中说明。
- issue: 动词的时间指向
  choice: 前半采用概括性现在时，后半采用预期结果的“要”
  alternative: 全句也可按预言式将来时翻译
  rationale: 前几个未完成式承接上下文对航海者处境的描述；海吞没和沉没则是他们恐惧中所预见的结果。这样既保持语境连续，也不消除原文未完成式可有的将来色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“贵重财物”“吞没”“沉入海中”保持启示文学的具体力度；脚注保留时态及“好的”所指的真实歧义。
