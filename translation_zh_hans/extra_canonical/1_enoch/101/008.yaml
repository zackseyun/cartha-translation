base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/008.yaml
  text: Was it not he who made heaven and earth and everything that is in them? Who gave instruction and wisdom to all who move upon the earth and to those at sea?[a][b][c]
translation:
  language: zh_hans
  text: 难道不是他造了天、地和其中的一切吗？是谁将教导和智慧赐给所有在地上活动的，以及那些在海上的呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中的一切”或译“存在于其中的一切”。
    reason: lexical_alternative
  - marker: b
    text: “那些在海上的”原文措辞简略，可能指航海者，也可能泛指与海有关的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: አኮኑ
  choice: 难道不是……吗
  rationale: 以现代汉语的反问句式表达原文期待肯定回答的语气。
- source_word: ገብረ
  choice: 造了
  rationale: 该动词基本义为“做、制造”；在天地语境中译作“造”自然，又不刻意采用更具技术意味的神学术语。
- source_word: ሰማየ ወምድረ
  choice: 天、地
  rationale: 保留原文单数形式及概括整个受造秩序的对举。
- source_word: ወኵሎ ዘሀሎ ውስቴቶሙ
  choice: 和其中的一切
  rationale: 准确传达总括性表达，并让“其中”自然回指天与地。
- source_word: መኑ ወሀበ
  choice: 是谁……赐给
  rationale: 原文以无连词的“谁”开启第二个问句，保留突出的修辞效果；“赐给”符合施予教导与智慧的语境。
- source_word: ትምህርተ ወጥበበ
  choice: 教导和智慧
  rationale: 分别保留“所传授的教诲”与“智慧”的意义，不将前者抽象化为“理解力”。
- source_word: ለኵሉ እለ ይትኀወሱ ዲበ ምድር
  choice: 所有在地上活动的
  rationale: 动词含移动、往来之意；“活动”比“居住”更忠实，也不把所指擅自限定为人或动物。
- source_word: ወለእለ ባሕር
  choice: 以及那些在海上的
  rationale: 保留陆地与海洋的对照；原文简略，中文也不明确限定为航海者或海中生物。
theological_decisions:
- issue: 造物者用语是否采用更具教义技术色彩的表达
  choice: 造了
  alternative: 创造了
  rationale: 原动词义域较广；“造了”在此清楚表达上帝是天地万有的制造者，同时避免超出原文作术语化处理。
- issue: 领受教导和智慧者的范围
  choice: 所有在地上活动的，以及那些在海上的
  alternative: 地上所有的人和海上的人；陆地与海洋的一切生物
  rationale: 原文范围宽泛，可能涵盖人或更广的活物；译文不将其缩窄为人，也不明确扩展为所有动物。
- issue: 第二问与第一问的句法关系
  choice: 另起一句“是谁……”
  alternative: “又是谁……”或将两问合并
  rationale: መኑ 前没有连接词，另起问句可保留原文突兀而有力的修辞节奏。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两个反问句保持原文修辞结构；对海上对象及领受者范围保留原文的含混，不补入“人”“生物”或“航海者”。
