base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/001.yaml
  text: Observe heaven[a], you sons of heaven, and every work of the Most High; and fear him[b], and do not do evil before him.
translation:
  language: zh_hans
  text: 你们这些天之子啊，要察看[a]天和至高者的一切作为；要敬畏他，不可在他面前行恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天之子啊，要向天询问关于至高者的一切作为。”
    reason: 开头动词也可译为“询问、查问”；此译法保留将“天”理解为询问对象、并将“至高者的一切作为”理解为询问内容的另一种句法分析。
lexical_decisions:
- source_word: ጠይቅዋ
  choice: 察看
  rationale: 此处为复数命令式；结合本章劝人观察受造秩序的语境，译作“察看”比“询问”更贴切，同时以脚注保留其本义所容许的另一种理解。
- source_word: ለሰማይ
  choice: 天
  rationale: 保留启示文学的宇宙性语域；在“察看”的语境下理解为所察看的对象。
- source_word: ውሉደ፡ ሰማይ
  choice: 你们这些天之子啊
  rationale: 直译这一带有启示文学色彩、身份含义不完全明确的称呼，不将其解释为人类或天上存在。
- source_word: ወኵሎ፡ ግብር፡ ለልዑል
  choice: 和至高者的一切作为
  rationale: 保留连接词“和”，使“天”与“至高者的一切作为”并列为察看的对象；“作为”比“行为”范围更广。
- source_word: ለልዑል
  choice: 至高者
  rationale: 采用现代中文圣经语体中自然且庄重的神圣称号。
- source_word: ወፍርሁ፡ እምኔሁ
  choice: 要敬畏他
  rationale: “敬畏”兼具惧怕与崇敬之意，适合对神的劝诫语境。
- source_word: ወኢትግበሩ፡ እኩየ፡ በቅድሜሁ
  choice: 不可在他面前行恶
  rationale: 保留道德禁令以及“在他面前”所表达的神圣临在与鉴察。
theological_decisions:
- issue: “天之子”的身份
  choice: 保留字面称呼“天之子”
  alternative: 天上的众子；属天的儿女
  rationale: 原文称呼具有刻意的含混性；译文不武断判定其指人类还是更高等的存在。
- issue: 开篇命令的含义
  choice: 按上下文译为“察看”
  alternative: 询问天；向天查问
  rationale: 本章语境支持观察、思量受造秩序的意思，但该动词也可表达询问，因此在脚注中保留词义歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们这些……啊”明确呼语，“要……；要……，不可……”保留连续劝诫的节奏；不解释“天之子”的具体身份。
