base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/006.yaml
  text: Is not the whole sea[a], and all its waters, and all its movements[c][b], the work of the Most High? And he has measured all its works and bound its shores with sand.
translation:
  language: zh_hans
  text: 整个海洋、其中的一切水和一切涌动[a]，不都是至高者的作为吗？他量定了海的一切运作，又以沙围住它的海岸。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “涌动”也可译作“运动”，或更具体地译作“波浪”。
    reason: lexical_alternative
  - marker: b
    text: 末句按较可靠的读法，是说至高者以沙限定海的海岸或边界。题示吉兹文转录中“根基”的读法看来是转录或OCR误差，不宜据此作为正文的另一种同等理解。
    reason: textual_variant
lexical_decisions:
- source_word: አኮ
  choice: 不都是……吗
  rationale: 保留期待肯定回答的反问语气，符合现代汉语表达。
- source_word: ኵሉ ባሕር
  choice: 整个海洋
  rationale: 后续阴性单数领属形式均回指海洋，因此采用整体性的单数表达，而不译作“每一个海”。
- source_word: ማያቲሃ
  choice: 其中的一切水
  rationale: 体现原文复数形式及其对海洋的领属关系；“其中”在汉语中比反复使用“它的”更自然。
- source_word: ሑሳታ
  choice: 一切涌动
  rationale: 该词指海水的运动或激荡；“涌动”既符合语境，又不武断地限定为具体的“波浪”。
- source_word: ግብረ ልዑል
  choice: 至高者的作为
  rationale: “作为”自然表达受造之工，“至高者”保留犹太启示文学中这一庄重的神圣称号。
- source_word: ግብረታ
  choice: 海洋的一切活动
  rationale: 阴性单数后缀回指海洋；“活动”与前文海水的运动相应，也避免误译成“他的一切作为”。
- source_word: ዐቀመ
  choice: 量定
  rationale: 兼具测量与规定范围之意，适合受造秩序的宇宙论图景。
- source_word: አሰረ
  choice: 约束
  rationale: 保留捆绑、限制的形象，同时自然表达海洋被限定在边界之内。
- source_word: እብንታሃ ቡኖባ
  choice: 用沙约束了它的界限
  rationale: 所给转录字面和底本文字均有困难；依海洋以沙为界的上下文作通顺翻译，但以脚注保留“根基”等可能理解。
theological_decisions:
- issue: 神圣称号 ልዑል
  choice: 至高者
  alternative: 至尊者／最高者
  rationale: “至高者”是现代汉语中庄重、清楚且辨识度高的神圣称号，不引入后期宗派性措辞。
- issue: 神对海洋的量定与约束
  choice: 保留“量定”“约束”的受造秩序意象
  alternative: 意译为“规定海洋的范围”
  rationale: 原文用具体动作描写神对海洋的治理；保留这些意象可呈现文本本身的宇宙论张力，而不将其抽象化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。反问句保持原文修辞力量；以“海洋”维持单数整体概念，并在末句文字困难处采用语境译法、脚注保留字面可能。
