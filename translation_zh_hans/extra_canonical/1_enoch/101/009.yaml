lexical_decisions:
- source_word: አኮኑ
  choice: 不也……吗
  rationale: 以反问句式表达原文期待肯定回答的语气。
- source_word: ውእቶሙ ተነገሥተ አሕማር
  choice: 那些船上的掌舵者
  rationale: 该短语字面和文本形态存在困难，可能指“船的王”或航海者；中文采用“船上的掌舵者”，既保留领航、主事之意，又使海上场景自然可懂，并以脚注说明不确定性。
- source_word: ይፈርህዋ ለባሕር
  choice: 惧怕海
  rationale: 直译常用的“惧怕”动词及其对象，并与后半句同一动词形成平行。
- source_word: ወኃጥኣን
  choice: 罪人却
  rationale: 连接词在此形成鲜明对照，用“却”自然呈现其转折作用。
- source_word: ለልዑል
  choice: 至高者
  rationale: 作为上帝的称号，保留第二圣殿时期犹太文献中庄重而简洁的表达。
- source_word: ኢይፈርህዎ
  choice: 不惧怕
  rationale: 与前半句重复“惧怕”，保留原文刻意的修辞平行。
theological_decisions:
- issue: 将 ልዑል 作为神圣称号翻译
  choice: 至高者
  alternative: 至尊者／最高者
  rationale: “至高者”是现代中文圣经语体中清楚、庄重且不附加宗派解释的对应表达。
- issue: 海上人物的身份
  choice: 船上的掌舵者
  alternative: 船王／航海的人／水手
  rationale: 原短语的字面构造及传本文本均有困难；正文采用可理解而不过度具体化的称呼，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的中文。以“不也……吗”保留反问，以两次“惧怕”再现原文平行；不把对海的自然畏惧解释成敬拜或宗教敬畏。
