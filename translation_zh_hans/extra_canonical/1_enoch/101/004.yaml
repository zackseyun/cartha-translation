base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/004.yaml
  text: Have you not seen the captains of the ships[a], how they are tossed by the waves, and their ships are shaken by the winds[c][b], and they are distressed?
translation:
  language: zh_hans
  text: 你们没有看见那些船长吗？他们怎样被海浪颠簸，他们的船怎样被风摇撼，而他们自己陷入苦恼？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትሬእይዎሙኑ
  choice: 你们没有看见……吗？
  rationale: 按否定疑问句理解，保留劝诫语境中的反问语气和对听众的直接称呼。
- source_word: ለተነገሥተ፡ አሕማር
  choice: 那些船长
  rationale: 此处是航海语境中的领船者或船长，并非字面意义上的“船之王”；这一理解也与本章后文的同类表达相符。
- source_word: እፎ
  choice: 怎样
  rationale: 引出后续所描写的情状，现代汉语自然且保留原文的观察性语气。
- source_word: ይትሀወኩ፡ እምገደ
  choice: 被海浪颠簸
  rationale: 传本中的እምገደ很可能是እምሞገድ（“被海浪”）的讹误；结合航海场景，译作“被海浪颠簸”最为连贯。
- source_word: ወያንቀለቅሉ፡ እምነፋሳት፡ አሕማሮሙ
  choice: 他们的船怎样被风摇撼
  rationale: እምነፋሳት意为“被风”，አሕማሮሙ是“他们的船”，而非“他们的灵魂”；调整汉语语序以清楚表达被动关系。
- source_word: ወይትመነደቡ
  choice: 而他们自己陷入苦恼
  rationale: 末尾动词表达人的困顿、忧惧或烦乱；补出“他们自己”以区别前一分句中的船，同时不把情绪强化为纯粹的惊恐。
theological_decisions:
- issue: 本节是实指海上危险，还是借航海图景象征权势者失去稳固
  choice: 正文保留具体的船长、海浪、风和船只等海上图景，不在译文中明说其象征意义
  alternative: 把整节抽象化，译成掌权者在审判中动荡惊惶
  rationale: 原文的航海措辞具体而连贯；启示性劝诫可以借具体图景传达更广的道德意义，但译文不应预先限定其象征对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“颠簸”描写海浪造成的上下动荡，“摇撼”描写风对船体的冲击，避免重复。末句以“他们自己”明确主语回到船长。无需脚注；旧有关于“灵魂/心思”的脚注基于误析，不应保留。
