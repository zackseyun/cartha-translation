base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/002.yaml
  text: If he shuts the windows of heaven[a], and withholds the rain and the dew so that it does not come down upon the earth because of you[c][b], what will you do?
translation:
  language: zh_hans
  text: 如果[c]他[b]关闭天上的窗户[a]，留住雨水和露水，不让它们因你们的缘故降在地上，你们要怎么办呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上的窗户”保留古代宇宙观中的意象：雨水仿佛从天上的开口降下；译文没有将其改写成现代气象学用语。
    reason: cultural_note
  - marker: b
    text: 原文在本节没有明说“他”是谁；上下文暗示这位施事者掌管雨水和露水。
    reason: theological_ambiguity
  - marker: c
    text: 有些译法在“如果”前加“而”；但本节原文开头没有相应的连接词。
    reason: previous_rendering
lexical_decisions:
- source_word: ዐፀወ
  choice: 关闭
  rationale: 保留具体的“关上、关闭”之意，与“天窗”自然搭配，不弱化为抽象的阻止。
- source_word: መስኮተ ሰማይ
  choice: 天窗
  rationale: 简洁保留古代宇宙观中天上开口的具体意象，也符合现代中文圣经语体。
- source_word: ከለአ ዝናመ ወጠለ
  choice: 扣住雨露
  rationale: “扣住”表达拦阻、留住而不赐下；“雨露”同时保留雨与露这两种水分来源。
- source_word: ከመ ኢይረድ ዲበ ምድር
  choice: 使雨露……不降在地上
  rationale: 将原文单数下降动词按雨露这一整体水分现象处理，并明确补出中文所需的主语。
- source_word: በእንቲአክሙ
  choice: 因你们的缘故
  rationale: 保留复数第二人称及因果含义，表明不降雨露与受话者有关，而不进一步说明其具体罪责。
- source_word: ሚሀለወክሙ ትግበሩ
  choice: 你们能怎么办呢？
  rationale: 以自然的中文反问表达人在这种处境中的无能为力；脚注保留更贴近字面的译法。
theological_decisions:
- issue: 关闭天窗者的身份
  choice: 正文只译作“他”
  alternative: 明确译作“上帝”或“主”
  rationale: 原文使用未明说身份的单数主语。上下文虽暗示神圣施事者，译文仍不补入原文没有的神名。
- issue: 旱灾与受话者的关系
  choice: 译作“因你们的缘故”
  alternative: 译作“为了你们”
  rationale: 语境较支持原因或责任关系，但不在译文中额外界定这是惩罚、管教还是其他目的，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而通俗的简体中文。“天窗”保留古老意象；“扣住雨露”兼顾原文的具体动作和中文表达。句首仅译“如果”，不添加“而且”或“如果又”，以反映本节开头没有连接词。
