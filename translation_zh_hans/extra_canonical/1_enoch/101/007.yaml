base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/007.yaml
  text: And at his rebuke it will be afraid and dry up[a], and all its fish will die, and everything that is in it[c][b]. But you sinners who are upon the earth do not fear him.
translation:
  language: zh_hans
  text: 因他的斥责，海就惧怕而干涸[a]；海里所有的鱼和其中的一切都必死亡。但你们这些在地上的罪人，却不敬畏他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以阴性单数动词指海，说海“惧怕而干涸”；“他的斥责”中的“他”则是阳性，指上帝。
    reason: grammatical_clarification
lexical_decisions:
- source_word: በተግሣጹ
  choice: 因他的斥责
  rationale: 介词 በ 可表达原因或凭借；后缀 -u 为第三人称阳性单数，指向上帝，而不是阴性的海。译作“因他的斥责”自然保留审判语气。
- source_word: ትፈርህ ወትየብስ
  choice: 海就惧怕而干涸
  rationale: 两个动词均为阴性单数，承接上文的海。补出“海”以消除汉语中代词指向不明，同时保留受造界人格化的“惧怕”。
- source_word: ዓሣቲሃ ይመውት
  choice: 海里所有的鱼……都必死亡
  rationale: ዓሣቲሃ 明示阴性所属后缀，即“它的鱼”；汉语用“海里的鱼”更自然。ይመውት 直译为“死亡”，保留明确、具体的灾变结果。
- source_word: ኵሉ ዘሀሎ ውስቴታ
  choice: 其中的一切
  rationale: 忠实表达“凡在它里面的”，并让范围超出前述鱼类。
- source_word: ኃጥኣን እለ ዲበ ምድር
  choice: 你们这些在地上的罪人
  rationale: 保留直接呼语和启示文学中“罪人”这一关键道德称谓，不增添原文没有的“居住”。
- source_word: ኢትፈርህዎ
  choice: 却不敬畏他
  rationale: 宾语后缀 -wo 为阳性单数，与海的阴性形式有别，所指应为上帝。“敬畏”既能表达惧怕，也符合面对神的道德与宗教语境。
theological_decisions:
- issue: 斥责者及末句宾语的身份
  choice: 阳性代词均译为“他”，指上帝
  alternative: 译作“它”，指海或水体
  rationale: በተግሣጹ 的 -u 和 ኢትፈርህዎ 的 -wo 都是阳性单数；海的反应及所属内容则由阴性形式标示。译文保留原文这一语法对照。
- issue: 海的惧怕是否保留人格化表达
  choice: 保留“海就惧怕”
  alternative: 弱化为“海就震动”或仅译“海就干涸”
  rationale: 原文确用“惧怕”动词；保留人格化意象，呈现受造界畏惧神而罪人不敬畏神的反差。
- issue: “怕”与“敬畏”的汉语区分
  choice: 海“惧怕”，罪人“不敬畏”他
  alternative: 两处统一译作“害怕”
  rationale: 两处源自动词 ፈርሀ，但对象和语境不同。汉语用词适度变化可自然表达：海因斥责而恐惧，罪人则缺乏对神应有的敬畏；不改变原文的核心语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为清楚呈现吉兹语的阴阳性对照，正文补出“海”，并将指上帝的阳性代词译为“他”。句式保持启示文学的肃穆与鲜明反差。
