base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/023.yaml
  text: And the sun comes out from that third gate[a], and sets in the third gate in the west, and returns to the east, and comes out from the second gate in the east for thirty mornings; and in this way it sets in the second gate in the west of heaven.
translation:
  language: zh_hans
  text: 太阳从那第三道门出来，在西方的第三道门落下；它返回东方，三十个早晨[a]都从东方的第二道门出来；照样，它也在天的西方从第二道门落下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“三十个早晨”，在这里可能指太阳运行历程中的三十天；正文保留原文的说法。
    reason: 说明原文的字面计时表达及其可能含义，同时不在正文中消除这种措辞上的张力。
lexical_decisions:
- source_word: ይወፅእ
  choice: 出来
  rationale: 该动词表示出去、出来或出现；在太阳穿行天门的语境中，“出来”自然地保留了从门中出来的具体运动。
- source_word: ፀሐይ
  choice: 太阳
  rationale: 原文所指明确，是具体的天体，无须泛化或额外拟人化。
- source_word: ሣልስት ኆኅት
  choice: 第三道门
  rationale: “门”保留《天文书》具体的宇宙图景；量词“道”符合现代汉语对门的通常表达。
- source_word: ያዓርብ
  choice: 落下
  rationale: 该词与傍晚、西方有关；用于太阳的运行时，“落下”最自然，也不把原文的天门意象改写成现代天文学术语。
- source_word: በዐረብ
  choice: 在西方
  rationale: 这里与东方相对，主要表达空间方位，因此译为“在西方”，而不是“在傍晚”。
- source_word: ይገብእ
  choice: 返回
  rationale: 该动词本可表示进入，但上下文描述太阳落下后循环回到东方；“返回”清楚传达这一运动，同时不增添具体机制。
- source_word: ውስተ ምሥራቅ
  choice: 东方
  rationale: 结合“返回”译作“返回东方”，既自然又保留原文方向。
- source_word: ካልእ ኆኅት
  choice: 第二道门
  rationale: 本章按次序排列太阳所经过的门；此处应理解为“第二道门”，而非泛指“另一道门”。
- source_word: ሠላሳ ጸባሐ
  choice: 三十个早晨
  rationale: 原文直译为“三十个早晨”。正文保留这种计时说法，不直接改成“三十天”。
- source_word: በምዕረበ ሰማይ
  choice: 在天的西方
  rationale: 保留“天”与“西方”的宇宙空间表达，避免扁平化为现代观察语言中的“西边地平线”。
theological_decisions:
- issue: 太阳穿行天门的宇宙图景
  choice: 保留“门”、东方和西方等具体意象
  alternative: 意译为太阳在地平线上不同位置升起和落下
  rationale: 原文呈现结构化的天界宇宙图景。译文不以现代天文学解释取代这一图景，也不判断其象征性或物理性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。重复“第三道门”“第二道门”和“出来”“落下”，以保留原文有规律的天文叙述。分号用于呈现连续运行阶段；脚注标记紧接其实际所解释的“三十个早晨”。
