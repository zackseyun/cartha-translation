base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/029.yaml
  text: And the sun returns and enters the second gate[a], which is in the east; and it returns to that principal course for thirty mornings[c][b], rising and setting.
translation:
  language: zh_hans
  text: 太阳返回，进入东方的第二道门；它回到那条主轨道上[a]，历经三十个早晨，升起、落下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一短语的句法较为生硬，也可较直译为“它返回到那上面，即它的主要路线”。这里按本章所述太阳循轨运行的语境译为“回到那条主轨道上”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ገብአ
  choice: 返回
  rationale: 该动词的基本义是“返回、回来”；本节末尾另有专指太阳“升起”的ይሠርቅ，因此不把此处译成“升起”。
- source_word: ቦአ ውስተ
  choice: 进入
  rationale: 该结构明确表达进入一道门，保留本章日月运行所用的门户意象。
- source_word: ካልእ ኆኅት
  choice: 第二道门
  rationale: ካልእ可表示“另一个”或“第二个”；在各道门依次推进的语境中，“第二道门”最贴切。
- source_word: እንተ በምሥራቅ
  choice: 东方的
  rationale: 简洁表达关系短语所说明的方位，同时明确修饰“第二道门”。
- source_word: ይገብእ
  choice: 回到
  rationale: 与句首ገብአ同属“返回”语义；汉语以“回到”自然连接其后的目标或轨道。
- source_word: ዲበ ዝኩ አርእስቲሁ
  choice: 那条主轨道上
  rationale: 依本章天文运行语境，把该短语理解为太阳返回的主要运行路线；保留指示成分“那条”，但以脚注提示原文结构不甚明晰。
- source_word: ሠላሳ ጸባሐ
  choice: 连续三十个早晨
  rationale: ጸባሐ意为“早晨、黎明”；加“连续”自然表达太阳使用这道门的时段，而不改变三十日的历法含义。
- source_word: ይሠርቅ ወየዓርብ
  choice: 升起、落下
  rationale: 两个动词构成太阳升落的对应表达，采用现代汉语常用而庄重的天文措辞。
