base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/026.yaml
  text: And on that day the night increases and becomes nine parts[a], and the night becomes twelve parts and two parts exactly[d][c][b], and the day six parts.
translation:
  language: zh_hans
  text: 那一天，夜间缩短，成为白昼的九份[a]；夜间成为整整十二份又两份[b]；白昼则为六份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文此处的数字和句法都很难确定。传本似乎在用“份”计算昼夜，却无法形成清楚协调的算术关系；有些解释会依据上下文调整数字。
    reason: textual_variant
  - marker: b
    text: “整整”也可译为“恰好”或“精确地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: 那一天
  rationale: 保留指示语气和本章反复使用的天文记述格式。
- source_word: ትነሡኅ ሌሊት
  choice: 夜间缩短
  rationale: 该动词表达减少、缩减；译作“缩短”符合昼夜时长的语境，也不随英文咨询层的“增加”改动原文方向。
- source_word: ፵ዕበታ ለማዓልት
  choice: 成为白昼的九份
  rationale: 依现有校订资料所识别的“九份”保留分份计算，并将明确出现的ለማዓልት反映为“白昼的”；因传本文字和算术关系困难，以脚注提示。
- source_word: ፲ወ፪ተ ወ፪እቲ
  choice: 十二份又两份
  rationale: 保留原文分列的两个数字，不擅自合并为“十四份”，以呈现传本文本的异常结构。
- source_word: ክፍለ ጥንቅቀ
  choice: 分毫不差
  rationale: ጥንቅቀ在此作精确性副词，表示“准确地、精确地”；用现代汉语自然表达测量无误之意。
- source_word: ማዓልት ስድስተ ክፍለ
  choice: 白昼则为六份
  rationale: 补出汉语所需的系词，同时保留原文简短的分份陈述。
theological_decisions:
- issue: 是否按上下文协调昼夜份数
  choice: 保留传本中“九份”“十二份又两份”“六份”的不协调排列
  alternative: 依相邻经文推定并改成算术协调的昼夜份数
  rationale: 这虽不是教义争议，却涉及对古代宇宙秩序描述的解释。译文不暗中修订困难文本，而以脚注公开其不确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“份”保留本章天文计算的技术性重复；不润饰原文中夜间被重复陈述及数字彼此紧张的现象。
