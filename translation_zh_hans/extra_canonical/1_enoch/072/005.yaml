base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/005.yaml
  text: And the chariots by which it ascends are driven by the wind[a], and the sun goes down from the sky and returns through the north in order to reach the east[e][d][c][b]; and it is led so that it may enter the gate and shine on the face of heaven.
translation:
  language: zh_hans
  text: 承载它上升的战车由风驱动[a]；太阳从天空落下，经由北方返回，为要到达东方；它受引导，好进入那道门，并照在天穹之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一短语较难确定，也可能较直译为“上升之风”或“升起的风”；全句也可理解为“战车乘风而行”。
    reason: 保留 የዓርግ ነፋስ 与 ይነፍኅ 的词义及句法歧义。
lexical_decisions:
- source_word: ሰረገላት
  choice: 战车
  rationale: 保留复数名词所表达的宇宙性载具意象；“战车”比泛称“车辆”更符合本书的启示文学语境。
- source_word: በኀበ የዓርግ ነፋስ ይነፍኅ
  choice: 承载它上升的战车由风驱动
  rationale: 原短语句法与词义均较困难；译文依上下文表达风推动战车、战车承载太阳上升的图景，同时以脚注保留“上升之风”等可能。
- source_word: የዓርብ ፀሐይ
  choice: 太阳……落下
  rationale: 保留下降的具体动作，比单译“落山”更贴近原文的宇宙运行描写。
- source_word: እምሰማይ
  choice: 从天空
  rationale: 此处描述可见的天象运动，“天空”在现代汉语中清楚自然；末句则用“天穹”保留庄重的宇宙图景。
- source_word: ወይገብእ እንተ መስዕ
  choice: 经由北方返回
  rationale: 按太阳运行的上下文将动词理解为回返，并将北方理解为其经过的区域；不把具体宇宙结构解释得过满。
- source_word: ከመ ይሑር ምሥራቀ
  choice: 为要到达东方
  rationale: 明确保留目的关系及向东方行进的方向。
- source_word: ወይትመራኅ
  choice: 它受引导
  rationale: 保留被动意义，反映太阳运行受到引领或安排，而不明说引导者是谁。
- source_word: ኆኅተ
  choice: 那道门
  rationale: 该词为单数宾格，并且在《天文书》中是天体通行之“门”的技术性意象；“那道门”兼顾语法数与上下文。
- source_word: ወያበርህ በገጸ ሰማይ
  choice: 照亮天穹的表面
  rationale: 较直译地保留“天之面”这一空间意象，同时用现代汉语中可理解的表达呈现。
theological_decisions:
- issue: 太阳运行是否暗示自主行动或受安排
  choice: 译作“它受引导”
  alternative: “它被指引”或省略被动意味
  rationale: 原文的被动形式值得保留，但不补出上帝、天使或其他未明说的行动者，以免替文本消解神学张力。
- issue: ሰማይ 在同一节中译作“天空”还是“天／天穹”
  choice: 前句用“天空”，末句用“天穹”
  alternative: 全节统一译作“天”或“天空”
  rationale: 前句是可观察的日落描述，用“天空”自然清楚；末句“天之面”带有启示文学的宇宙意象，用“天穹的表面”较能保留其庄重和具体性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留战车、门和天穹表面等启示文学意象；不补明太阳所指代的先行对象，也不指认未在原文中出现的引导者。
