base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/003.yaml
  text: And I saw six portals from which the sun rises[a], and six portals where the sun sets, and the moon rises and sets in those portals. And the leaders of the stars, together with those whom they lead, are six in the east and six in the west; and all of them, one after another, in exact order[c][b], with many windows to the right and to the left of those portals.
translation:
  language: zh_hans
  text: 我看见六道门，太阳从那里升起[a]；又有六道门，太阳在那里落下，月亮也从那些门升起和落下。众星的领袖和他们所带领的，都在东方有六个，在西方有六个；他们全都依次排列，秩序井然[b]，那些门的左右两边还有许多窗孔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用同一个词称太阳出入的六道主要开口；本节末尾另有一个难解的词组，可能指这些门旁边较小的附属开口或窗孔。
    reason: lexical_alternative
  - marker: b
    text: 末句原文较难。大意似乎是这些门按正确次序排列，并且在这些门的左右两边有许多附属开口。
    reason: textual_difficulty
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我看见
  rationale: 明确保留异象叙述的第一人称，采用自然庄重的现代汉语。
- source_word: ኃዋኅወ
  choice: 门
  rationale: 本词指天体出入地平线的宇宙性开口；“门”既保留意象，也比音译或生僻表达更易懂。
- source_word: እለ ኀበ ይወፅእ ፀሐይ
  choice: 太阳从那里升起
  rationale: 自然表达太阳从这些开口出来的方向性动作。
- source_word: እለ ኀበ የዓርብ ፀሐይ
  choice: 太阳在那里落下
  rationale: 依原文句法，只以太阳为该分句主语，避免误将月亮并入。
- source_word: ወወርኅ በውእቶን ኃዋኅወ ይሠርቅ ወየዓርብ
  choice: 月亮也从那些门升起和落下
  rationale: 保留独立的月亮分句以及“升起—落下”这一对动作。
- source_word: መራኄሆሙ ለከዋክብት
  choice: 众星的领袖
  rationale: 保留引导、统领之义，不擅自把这些领袖明确解释为天使。
- source_word: ምስለ እለ ይመርኅዎሙ
  choice: 和他们所带领的
  rationale: 忠实呈现领袖与受带领者之间的关系，同时维持所指对象的含混。
- source_word: ፮በጽባሕ ወ፮በምዕራብ
  choice: 在东方有六个，在西方有六个
  rationale: 按宇宙地理方位直译数字与东西两方的对称结构。
- source_word: ኵሎሙ ፩፩እምድኅረ ካልኡ ርቱዕ
  choice: 他们全都依次排列，秩序井然
  rationale: 兼顾逐一相随与端正、合乎秩序两层意义。
- source_word: መላክወ ብዙኃት
  choice: 许多窗孔
  rationale: 该难解短语似指主门旁的附属开口；“窗孔”既与主门区分，也保留开口意象。
theological_decisions:
- issue: 是否把“众星的领袖”明确称为天使
  choice: 中性译作“众星的领袖”
  alternative: “引导众星的天使”
  rationale: 本节可能暗示天使治理众星，但原文在此并未明说“天使”，故不在正文中补入。
- issue: “他们所带领的”究竟指星体还是有位格的存在
  choice: 保留代词表达，不具体说明
  alternative: 明确译为“他们所带领的众星”
  rationale: 原文关系清楚而所指并不完全确定，应保留这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“门”保持启示文学的宇宙建筑意象，以“窗孔”区分末尾可能较小的附属开口；保留领袖及其所带领者身份上的含混。
