  source_fidelity: 正文对日、月的分句处理正确：太阳在第二组六门处落下，而月亮在那些门中升起和落下。也恰当保留了“众星的领袖”而未擅自补作天使，并以“窗孔”区别于主要的“门”。不过脚注b将末句的空间关系具体化为“每道门的左右两边”，原文及英文审校记录仅能较稳妥地说许多附属开口位于这些门的左右两侧；不宜断定每一门都各自如此配置。
