  naturalness: “黑夜比原有的长度缩短”不够自然，且“比……缩短”搭配生硬。改作“夜的长度缩短了”符合现代标准汉语，并保留原文所表达的夜长减少。
  terminology: “夜／昼”“份”在此类天文计量语境中简洁、庄重且一致。保留“份”，并用脚注说明它是该书的示意性划分，不是现代钟点。
  issues:
  - severity: high
    issue: 正文将底本的“十二份”改为“十份”。
