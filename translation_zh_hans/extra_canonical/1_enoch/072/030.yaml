  text: And on that day the night is shortened from its length[a], and the night becomes ten parts[b], and the day eight parts.
translation:
  language: zh_hans
  text: 到那一天，黑夜比原有的长度缩短[a]，成为十份[b]，白昼则为八份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段把昼夜合计分为若干“份”，用这种技术性的计量方式描述季节中昼夜长短的变化；这里的“份”不是现代钟点。
    reason: cultural_note
  - marker: b
    text: 现有埃塞俄比亚文转写作“十二份”；但本书这一段采用昼夜合计十八份的体系，而且相邻经文的递变次序支持“十份”。因此正文据上下文校订为“十份”。
    reason: textual_variant
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: 到那一天
  rationale: 保留指示性的时间表达，同时采用自然的现代汉语。
- source_word: ተኃጽጸ፡ ሌሊት፡ እምኑኃ
  choice: 黑夜比原有的长度缩短
  rationale: 动词表示缩减或变短；እምኑኃ 指明相对于原有长度的缩减。此处所说的是昼夜季节性长短，而非空间长度。
- source_word: ትከውን፡ ሌሊት፡ ፲ወ፪ተ፡ ክፍለ
  choice: 成为十份
  rationale: 所提供的转写表面作“十二份”，但本章十八份制的总数及相邻经文的递变次序均要求“十份”；正文采用有上下文与体系支持的校订，并以脚注保留文本歧义。
- source_word: ማዓልት፡ ፰ክፍለ
  choice: 白昼则为八份
  rationale: 准确表达昼夜份数的对照；“则”使汉语衔接自然，又不增添解释。
