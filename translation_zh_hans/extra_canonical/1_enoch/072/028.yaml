base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/028.yaml
  text: And on that day the night decreases from its length by a ninth part[a], that is, one part, and the night becomes eleven parts[b], and the day seven parts.
translation:
  language: zh_hans
  text: 在那一天，黑夜的长度缩短了九分之一[a]，即一份；黑夜变为十一份，白昼为七份[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚语文本此处较难，数词短语的传抄或转录也有不确定之处。较佳理解是：黑夜从它本身的长度中缩短九分之一；文本随即将此说明为“一份”。
    reason: textual_variant
  - marker: b
    text: 另有译法：“在那一天，黑夜从九份中减少一份；于是黑夜为十一份，白昼为七份。”
    reason: previous_rendering
lexical_decisions:
- source_word: ኀፀፀት
  choice: 缩短
  rationale: 该动词表示减少或变短；在衡量昼夜长度的天文语境中，“缩短”自然且准确。
- source_word: ሌሊት
  choice: 黑夜
  rationale: 指与白昼相对、按份数计量的夜间时段。
- source_word: እምኑኃ
  choice: 从本身的长度中
  rationale: 按最新原文校勘理解为“从它的长度中”，其中阴性代词后缀回指“黑夜”，而不是“从九”。
- source_word: ታስዕተ እደ
  choice: 九分之一
  rationale: 此处表示缩短的幅度，即一个第九份；后文随即解释为“一份”。
- source_word: ክፍለ አሐደ
  choice: 一份
  rationale: 保留《天文书》中将昼夜划分为若干份的技术性计量方式。
- source_word: ወኮነት
  choice: 于是……为
  rationale: 表达缩短后形成的结果状态，现代汉语中简洁自然。
- source_word: ፲ወ፪ተ ወአሐደ ክፍለ
  choice: 十一份
  rationale: 依上下文和经校订的数值理解，表示黑夜缩短后的长度。
- source_word: መዓልት
  choice: 白昼
  rationale: 与“黑夜”相对，明确指日间而非包含昼夜的整日。
- source_word: ሰብዓተ ክፍለ
  choice: 七份
  rationale: 忠实保留原文对昼长的份数计量。
theological_decisions:
- issue: 天文分区术语的译法
  choice: 使用“份”，保留原文的技术性分区表达
  alternative: 译作“小时”或改写为昼夜比例
  rationale: 本节属于《天文书》的图式化宇宙论；“份”既保留原文计量体系，也避免引入现代小时制。
- issue: 困难数词短语的处理
  choice: 正文译作“九分之一，也就是一份”，并以脚注说明文本困难
  alternative: 译作“从九份中减少一份”
  rationale: 原文的较佳语法分析是“从本身的长度中缩短九分之一”，而括注说明该九分之一相当于整个昼夜十八份体系中的一份；但抄本或转录中的数词短语存在困难，故不掩盖异读。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“黑夜／白昼”形成明确对举；“份”保留原文天文分区体系，不现代化为“小时”。脚注呈现原文困难及旧译可能，不在正文中强行消除歧义。
