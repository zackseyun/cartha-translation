base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/031.yaml
  text: And on that day the sun goes out from that gate and sets in the west[a], and returns to the east and rises through the third gate for thirty-one mornings[b], and sets in the west of heaven.
translation:
  language: zh_hans
  text: 那一天，太阳从那道门出来，在西方落下[a]，又回到东方；连续三十一个清晨都从第三道门升起，并在天空的西方落下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “落下”之后的原文还有一个动词，可译作“进入”或“返回”。这里按太阳循环运行、随后再次从东方升起的次序译作“回到”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወፅእ
  choice: 出来
  rationale: 保留太阳从天门中出来的具体运动意象，现代汉语自然明白。
- source_word: ኆኅት
  choice: 门
  rationale: 此处指天上供太阳通行的固定开口；“门”保留原文的宇宙建筑意象。
- source_word: የዓርብ
  choice: 落下
  rationale: 在太阳运行的语境中指日落；译为“落下”既自然，也保留反复出现的运动模式。
- source_word: ይገብእ
  choice: 回到
  rationale: 该词也可表示“进入”；上下文描写太阳落下后循环返回东方，因此正文译为“回到”，并以脚注保留词义张力。
- source_word: በምስራቅ
  choice: 东方
  rationale: 与“回到”连用，自然表达朝向东方的运动。
- source_word: ይሠርቅ
  choice: 升起
  rationale: 在发光体语境中表示太阳升起，是现代汉语中准确自然的天文用语。
- source_word: በሣልስት ኆኅት
  choice: 从第三道门
  rationale: 表达太阳经由第三道天门升起；汉语以“从”清楚呈现其出发通道。
- source_word: ሠላሳ ወአሐደ ጸባሐ
  choice: 接连三十一个清晨
  rationale: 原文逐字为“三十一个清晨”；保留“清晨”而不改成“天”，并用“接连”表明持续时段。
- source_word: ምዕራብ ሰማይ
  choice: 天的西方
  rationale: 保留原文将天描绘为具有方位和结构的空间，不将其现代化改写为“西边地平线”。
theological_decisions:
- issue: 天界的宇宙建筑意象
  choice: 保留“门”和“天的西方”这类具体表述
  alternative: 按现代观察语言译作“地平线”或“西边天空”
  rationale: 本段以具有门户和方位的结构化天界描绘太阳运行；译文不应消解这一启示文学兼天文叙述的宇宙图景。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“门”“清晨”“天的西方”等原文宇宙意象；句式略作汉语化调整，以“接连”明确“三十一个清晨”修饰太阳从第三道门升起的持续时段。
