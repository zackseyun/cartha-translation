base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/004.yaml
  text: And first a great light comes forth[a], whose name is the sun, and its disk is like the disk of heaven[c][b], and it is wholly full of fire that gives light and heat.
translation:
  language: zh_hans
  text: 首先，有一道大光出现[a]，名叫太阳；它的圆盘如同天的圆盘[b]，它全然充满了放光发热的火[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“最先出现的是一道大光”。
    reason: 句法上可把“最先的”理解为实体主语；正文则依上下文将其译为表示次序的“首先”。
  - marker: b
    text: “圆盘”所译的词也可指“圆形”“圆周”或“环行轨道”；后半句也可译作“如同天的圆周”。
    reason: 原词语义范围较宽，而这里的比较究竟侧重可见形状还是周行结构，并不完全确定。
  - marker: c
    text: “放光发热”也可译作“照耀并燃烧”。
    reason: 末尾两个动词既可表达火所产生的光和热，也可较形式化地译为照耀与燃烧。
lexical_decisions:
- source_word: ቀዳማዊ፡ ይወፅእ፡ ብርሃን፡ ዓቢይ
  choice: 首先，有一道大光出现
  rationale: 将“首先”理解为次序副词，使“一道大光”作“出现”的主语，符合本句最可能的句法；脚注保留把“最先者”理解为实体主语的可能。
- source_word: ዘስሙ፡ ፀሐይ
  choice: 名叫太阳
  rationale: 简洁保留原文的命名公式，不把太阳神格化，也不改写为现代科学说明。
- source_word: ክበቡ፡ ከመ፡ ክበበ፡ ሰማይ
  choice: 它的圆盘如同天的圆盘
  rationale: 以“圆盘”表达可见的圆形体，并保留同根词的重复和原文略显奇特的宇宙图景。
- source_word: ኵሉ፡ ምሉእ
  choice: 全然充满了
  rationale: 保留两个词共同加强的完全、充盈之意。
- source_word: እሳት
  choice: 火
  rationale: 直接保留原文的元素性意象，不弱化为抽象的光或能量。
- source_word: ዘያበርህ፡ ወያውዒ
  choice: 放光发热
  rationale: 自然表达两个并列动词所描写的火之作用，同时在脚注中保留“照耀并燃烧”的可能译法。
theological_decisions:
- issue: 太阳形象的性质
  choice: 按受造天体的启示文学形象来翻译，以命名和火焰意象描写太阳，不赋予其神性。
  alternative: 可把命名公式理解为更强烈的拟人化。
  rationale: 原文采用生动的启示文学—宇宙论语言，但本节并未要求把太阳理解为神；译文既不神化，也不以现代科学措辞消解其古代意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“有一道大光出现”保留异象叙述的动态感；“天的圆盘”虽不同于日常说法，但有意保留原文独特的古代宇宙图景。
