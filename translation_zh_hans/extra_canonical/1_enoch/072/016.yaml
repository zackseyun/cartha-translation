base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/016.yaml
  text: And when thirty mornings are completed[a], the day decreases by exactly one part, and the day becomes eleven parts[c][b], and the night seven.
translation:
  language: zh_hans
  text: 三十个清晨满了[a]，白昼就恰好减少一份；白昼成为十一份[b]，黑夜为七份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“三十个清晨”。在本段中，这一说法用作太阳历中的计数时段。
    reason: lexical_alternative
  - marker: b
    text: 本章反复用若干“份”来计量白昼和黑夜；本节说白昼减至十一份，黑夜则为七份。
    reason: cultural_note
lexical_decisions:
- source_word: ተፈጸመ
  choice: 满了
  rationale: 表示一段计数期达到终点；“满了”在现代汉语中自然，并保留完成、满期的含义。
- source_word: ሠላሳ ጽባሕ
  choice: 三十个清晨
  rationale: 原文明确使用“清晨”，虽在本段作为历法计数单位，正文仍保留其具体意象，不泛化为“三十天”。
- source_word: ተሐፅፅ ማዓልት
  choice: 白昼……减少
  rationale: 这里指日照时段按份额缩减；“白昼”可避免把“日”误解为整个昼夜，“减少”则保留量化语气。
- source_word: ክፍለ አሐደ ጥንቁቀ
  choice: 恰好减少一份
  rationale: “一份”延续本章划分昼夜的技术性用语；“恰好”保留ጥንቁቀ所强调的精确性。
- source_word: ወትከውን
  choice: 成为
  rationale: 表达缩减后的结果状态，保留天体运行叙述中的变化过程。
- source_word: ዕለት ዓሠርተ ወአሐደ ክፍለ
  choice: 白昼成为十一份
  rationale: 按原文句法，以“白昼”为“成为”的主语，并保留编号“份”的计量方式。
- source_word: ወሌሊት ስብዓተ
  choice: 黑夜为七份
  rationale: 原文后半为省略式对称结构；汉语补出“份”以清楚说明与白昼使用同一计量单位。
