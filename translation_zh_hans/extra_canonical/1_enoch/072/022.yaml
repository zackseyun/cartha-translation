base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/022.yaml
  text: And on that day the night exceeds the day[a], and the night increases from night to night, and the day grows shorter from day to day, until thirty mornings, and the night becomes exactly ten parts[e][d][c][b], and the day eight parts.
translation:
  language: zh_hans
  text: 那一天，夜长于白昼[a]；夜一夜比一夜更长，白昼一天比一天缩短，直到三十个清晨[b]。那时，夜恰为十份[c]，白昼为八份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的表达也可较直译为“夜超过白昼”，这里指夜的时长超过白昼。
    reason: lexical_alternative
  - marker: b
    text: “三十个清晨”可能是按连续的日子或黎明计算季节周期；原文直译即“三十个清晨”。
    reason: cultural_note
  - marker: c
    text: “恰”所对应的原词在此限定“十份”，有“精确地”或“完全地”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: 那一天
  rationale: 保留标准的时间承接语，符合本章按天象次序展开的叙述。
- source_word: ትነሡኅ ሌሊት እምዕለት
  choice: 夜长过白昼
  rationale: 这里的动词表示时长增加，介词结构带比较意味；译成“长过”既自然，也保留夜与昼的比较。
- source_word: ወሌሊት እምሌሊት ትነሡኅ
  choice: 夜一夜比一夜增长
  rationale: 重复名词与እም构成逐次递进的表达，指夜晚逐夜增长。
- source_word: ወተሐጽር ዕለት እምዕለት
  choice: 白昼一天比一天缩短
  rationale: 动词明确表示缩短；重复结构表达逐日变化。
- source_word: እስከ ሠላሳ ጸባሕ
  choice: 直到三十个清晨
  rationale: ጸባሕ直指清晨或黎明；不换算成“天”，以保留天象观察文本的计数方式及原文可能的含义张力。
- source_word: ዐሠርተ ክፍለ ጥንቁቀ
  choice: 恰为十份
  rationale: ክፍለ是划分出的份额；ጥንቁቀ在此作精确程度的限定，译为“恰”保留技术性精度。
- source_word: ስመንተ ክፍለ
  choice: 八份
  rationale: 与夜的“十份”相对，保留本书天文体系的分份计量，不改写为现代小时。
theological_decisions:
- issue: 天文计量体系
  choice: 保留夜十份、昼八份的古代分份表达
  alternative: 换算成现代小时，或概括为夜长昼短
  rationale: 原文采用示意性的宇宙与历法计量。保留“份”尊重文本自身的天文观念，也避免引入现代钟表制度。
- issue: “三十个清晨”的时间含义
  choice: 正文直译为“三十个清晨”并以脚注说明
  alternative: 解释性译为“三十天”
  rationale: 原词确为“清晨/黎明”，可能用于计算连续的日次；正文不应无声消除这种表达上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现夜昼变化的并行关系，以句号分开变化过程与最终计量。正文保留“三十个清晨”和“份”等天文书术语，不现代化为“天”或“小时”。
