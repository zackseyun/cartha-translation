base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/002.yaml
  text: 'And this is the first law of the luminaries: the sun, a light, has its rising in the portals of heaven on the east, and its setting in the western portals of heaven.'
translation:
  language: zh_hans
  text: 这是众光体的第一条法则[a]：太阳——这一光体——从天上东方的门升起，在天上西方的门落下。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法则”也可译作“定律”“条例”或“规条”，指支配众天体运行的固定秩序。
    reason: lexical_alternative
  - marker: b
    text: 所提供的转写在这里作 መባእ（“进入”），但 Charles 1906 的校勘正文读作意为“它的升起”的词形，并与后面的“它的落下”平行；因此正文译作“升起”。
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: 定律
  rationale: 此处指支配天体运行的固定秩序，而非向人发出的一次性命令；“定律”在现代汉语中自然且能保留宇宙秩序之意。
- source_word: ቀዳማዊ
  choice: 第一条
  rationale: 标明一系列天文规例中的首项；加量词“条”符合汉语表达。
- source_word: ብርሃናት
  choice: 众光体
  rationale: 所指为受宇宙秩序支配的诸天体；“众光体”既保留“光”的词义，也比单纯“众光”更明确。
- source_word: ፀሐይ ብርሃን
  choice: 太阳这光体
  rationale: 将“光”视为“太阳”的同位说明，保留原文名词性表达，同时避免生硬的“太阳，一个光”。
- source_word: መዋፅኢሁ（据校勘恢复；所给转写作 መባእ）
  choice: 升起
  rationale: 依据 Charles 1906 正文及与后文“落下”的平行结构，指太阳在东方升起；所给文本的 መባእ 属转写或OCR讹误，不宜据此译为“进入”。
- source_word: ኃዋኅወ
  choice: 门
  rationale: 指天上供日月运行出入的开口或门户；“门”在中文中简明自然，并保留启示文学的宇宙图景。
- source_word: መንገለ ጽባሕ
  choice: 东方
  rationale: 字面与晨曦的方向有关，此处明确表示东方；译为“东方”最合现代汉语方位表达。
- source_word: ምዕራቢሁ
  choice: 落下
  rationale: 在与东方升起相对的名词性结构中表示太阳的落下或落日；中文以动词表达更自然。
- source_word: ዘምዕራብ
  choice: 西方的
  rationale: 保留与东方门户相对的方位限定。
theological_decisions:
- issue: 宇宙秩序用语的性质
  choice: 将 ትእዛዝ 译为“定律”
  alternative: 条例、法则、命令
  rationale: 本节描写受固定秩序支配的受造世界，并非给人的道德命令；“定律”能保留这一语境，同时不额外引入宗派性解释。
- issue: 太阳运行方向与所给转写的冲突
  choice: 依校勘文本译作东方升起、西方落下
  alternative: 依所给 መባእ 直译为“进入”，造成运动方向含混或颠倒
  rationale: Charles 1906 的校勘读法与平行句法及本章天文语境一致。正文采用可靠读法，并以脚注公开文本问题，而不掩盖证据差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“众光体”保留启示文学的天体意象，以“门”避免过度技术化；句法适度汉语化，同时保留东方升起与西方落下的平行结构。
