base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/021.yaml
  text: And the sun comes out from that gate[a], and sets in the west, and returns to the east, and comes out from the third gate for thirty mornings[c][b], and sets in the west at the third gate.
translation:
  language: zh_hans
  text: 太阳从那道门出来[a]，在西方落下，又返回东方[b]；接着连续三十个清晨从第三道门出来[c]，并在西方的第三道门落下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门”也可译作“门户”。旧译有作“窗”的；但原词通常指门或门户，而《天文书》也把太阳运行的门与窗区别开来。
    reason: lexical_alternative
  - marker: b
    text: 原词也可指“清晨”。因本句与“西方”相对，正文译作“东方”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“三十个清晨”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ
  choice: 出来
  rationale: 该动词表示出去、出来或发出；在太阳经由固定门户运行的语境中，“出来”自然而具体，也保留两次出现的重复动作。
- source_word: ፀሐይ
  choice: 太阳
  rationale: 直接对应天文对象，不额外加入拟人化解释。
- source_word: እምይእቲ ኆኅት
  choice: 从那道门
  rationale: ኆኅት在此指门或门户，并非表示“窗”的通常词；指示词承接前文已提及的门户。量词“道”适合此处固定通道的宇宙图景。
- source_word: ያዓርብ በምዕራብ
  choice: 在西方落下
  rationale: 按太阳运行的上下文，动词自然译为“落下”；既表达日落，也保留其在西方门户处进入的空间意象。
- source_word: ወይገብእ በጽባሕ
  choice: 又返回东方
  rationale: ይገብእ可表示返回或进入；ጽባሕ既可指清晨，也可指东方。此处与“在西方落下”构成空间对应，因此译为“返回东方”，同时不把太阳运行的循环关系弱化为单纯的时间说明。
- source_word: በሣልስት ኆኅት
  choice: 从第三道门／在西方的第三道门
  rationale: 同一短语随动词关系分别译作“从……出来”和“在……落下”；保留“第三道门”这一宇宙结构。
- source_word: ሠላሳ ጸባሐ
  choice: 持续三十个清晨
  rationale: 原文直说“三十个清晨”。用“持续”表达这一时段，避免擅自平滑为“三十天”。
theological_decisions:
- issue: 《天文书》中ኆኅት所指的宇宙建筑意象
  choice: 门
  alternative: 窗
  rationale: 该词通常表示门或门户，而且本书的宇宙图景区分太阳运行的大门与窗。正文采用“门”，注脚说明较早译法中的“窗”，以保存文本与译本传统之间的差异。
- issue: ጽባሕ在本句中的空间义与时间义
  choice: 东方
  alternative: 清晨
  rationale: 该词可表示“清晨”，也可借“晨曦之地”表示“东方”。它与前面的“西方”形成空间对称，故正文采用“东方”；“清晨”作为真实的词义可能性保留在注脚中。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。以分号划分太阳返回东方与随后三十个清晨的运行阶段；保留“门”“第三道门”和“三十个清晨”等启示文学的具体宇宙意象，不以现代天文学术语改写。
