base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/017.yaml
  text: And the sun goes out from the west[a], from that sixth gate, and travels eastward, and rises in the fifth gate for thirty mornings[b], and sets again in the west in the fifth western gate.
translation:
  language: zh_hans
  text: 太阳从西方的第六道门出来，向东运行；它从第五道门升起，持续三十个早晨[a]，又在西方的第五道门落下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“三十个早晨”；这里可能是以早晨计算日数。
    reason: 保留原文计时用语，同时说明其可能具有按日计数的功能。
lexical_decisions:
- source_word: ወይወፅእ፡ ፀሐይ፡ እምነ፡ ምዕራብ
  choice: 太阳从西方……出来
  rationale: ይወፅእ表示出来、出离；እምነ ምዕራብ直译为“从西方”，不增添原文没有的“那里”。中文调整语序，使主语和方位表达自然。
- source_word: እምይእቲ፡ ሳድስት፡ ኆኅት
  choice: 从……第六道门
  rationale: 保留定指的“第六”以及本章反复出现的“门”这一宇宙图景；中文将“西方的”与“第六道门”连用，以避免连续两个“从”造成生硬。
- source_word: ወየሐውር፡ ምሥራቀ
  choice: 向东运行
  rationale: 原文表达朝东方移动；“运行”符合日体运动的语境，同时不把异象性的描写改写成现代天文学术语。
- source_word: ወይሠርቅ
  choice: 升起
  rationale: 该动词在太阳和门的上下文中指日出；“升起”是现代汉语自然且准确的对应表达。
- source_word: በኃምስት፡ ኆኅት
  choice: 从第五道门
  rationale: 介词በ在此可按门作为日出通道的语境译为“从”；比机械地译成“在第五道门里升起”更符合汉语，同时保留门的意象。
- source_word: ሠላሳ፡ ጽባሐ
  choice: 持续三十个早晨
  rationale: ጽባሐ字面为“早晨”。保留这一计数方式，不直接释为“三十天”；增添“持续”只为清楚表达时段关系。
- source_word: ወየዓርብ
  choice: 又……落下
  rationale: 与前面的日出相对，在西方门的语境中表示日落；“落下”清楚自然。
- source_word: ካዕበ
  choice: 又
  rationale: 表达再次、继而发生的对应动作，中文以“又”简洁呈现。
- source_word: ኃምስተ፡ ኆኅተ፡ እንተ፡ ምዕራብ
  choice: 在西方的第五道门
  rationale: 明确这是与东方日出之门相应的西方第五道门，并保留原文的门制图景。
theological_decisions:
- issue: 太阳出入诸门的宇宙图景
  choice: 按原文保留“门”以及太阳从门升起、落下的描写
  alternative: 将“门”解释性改译为“天际开口”或“地平线方位”
  rationale: 这是《天文书》的异象性宇宙图景。直译“门”既忠于反复出现的核心意象，也避免用现代宇宙观消解文本本身的表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“第六道门”“第五道门”和“三十个早晨”等原文特色；通过调整语序及使用“运行”，使句子自然清晰而不把异象性宇宙描写现代化。
