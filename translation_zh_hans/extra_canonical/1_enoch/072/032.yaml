base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/032.yaml
  text: On that day the night decreases and becomes nine parts[a], and the day becomes nine parts, and the night equals the day[b], and the year becomes exact.
translation:
  language: zh_hans
  text: 在那一天，夜晚缩短，成为九份[a]；白昼也成为九份；夜晚与白昼相等，年也变得准确[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “九份”反映本书的天文体系：昼夜按若干份来计算。
    reason: cultural_note
  - marker: b
    text: “年也变得准确”也可译作“年便完整了”或“年变得精确”；原词可表示准确、严整或完备。
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: 在那一天
  rationale: 保留时间指示语的明确所指，也符合现代汉语叙述习惯。
- source_word: ትኃፅፅ ሌሊት
  choice: 夜间缩短
  rationale: 原动词表示减少、缩减；此处是天文计量语境，译为“缩短”自然且不失测量含义。
- source_word: ትስዓተ ክፍለ
  choice: 九份
  rationale: “份”简洁表达该天文体系中将昼夜划分为若干等份的计量方式。
- source_word: ይትዓረይ ሌሊት ምስለ ማዓልት
  choice: 夜间与白昼相等
  rationale: 直接保留昼夜达到等量的含义，不将其解释为象征或近似状态。
- source_word: ዓመት ጥንቅቀ
  choice: 一年也达到准确的度数
  rationale: ጥንቅቀ 可指准确、严整或完备；结合历法语境，以“达到准确的度数”表达年份在计量上吻合，同时保留“准确/完备”之间的语义张力。
theological_decisions:
- issue: 昼夜等分的历法陈述
  choice: 按天文和历法计量来表达昼夜相等
  alternative: 将其解释为宇宙完美的象征，或仅指季节上的大致相等
  rationale: 上下文属于《天文书》的技术性说明，原句以昼夜份数和年份的准确性为重点，不宜加入后来的神学象征。
- issue: “一年准确/完备”的含义
  choice: 译作“一年也达到准确的度数”，并以脚注保留其他可能
  alternative: “一年便完整了”或“一年变得准确”
  rationale: 原词兼具准确、严整、完备等可能；正文采用适合历法语境的自然表达，脚注避免将歧义封闭。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留原文昼夜计量的重复和平衡结构。将“夜间”与“白昼”配对，以增强天文语境中的清晰度；不引入宗派性或象征性解释。
