base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/027.yaml
  text: And the sun completes its courses[a], and again it travels upon those courses; and it enters through that gate for thirty mornings[e][d][c][b], and in the west it sets opposite it.
translation:
  language: zh_hans
  text: 太阳走完它的各条路线，又沿着那些路线运行；它从那道门进入，持续三十个早晨[a]，并在西边与那道门相对之处落下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“ 三十个早晨”；这里大概指太阳连续三十天从同一道门出现。
    reason: 说明原文的具体计时表达，同时保留它究竟强调晨间出现还是三十日时段的余地。
lexical_decisions:
- source_word: ፈጸመ
  choice: 走完
  rationale: 表达太阳完成一段既定运行过程；按本段持续叙述的语境采用现在时态含义，不赋予神学上的“成全”之意。
- source_word: አርእስቲሁ
  choice: 它的各条路线
  rationale: 该词为复数形式，在《天文书》的太阳运行语境中指其若干路线或行程；保留复数，避免误译为单一的“主要路线”。
- source_word: ዳግመ የሐውር ዲበ ዝኩ አርእስቲሁ
  choice: 又沿着那些路线运行
  rationale: 保留“又”所表达的周期性重复，也保留指示语对前述复数路线的回指。
- source_word: ይበውእ በውእቱ ኆኅት
  choice: 它从那道门进入
  rationale: 直译天体经由天门进入的异象性宇宙图景，不改写为现代天文学术语。
- source_word: ሠላሳ ጸባሐ
  choice: 持续三十个早晨
  rationale: “早晨”贴近原词的具体意象；“持续”使其作为一段三十次晨间出现的时段在现代汉语中清楚可读。
- source_word: በምዕራብኒ በመንጸሩ የዓርብ
  choice: 并在西边与那道门相对之处落下
  rationale: 依据Charles 1906正文经校核的读法 በመንጸሩ（“在它对面/与它相对”），而非转录中的OCR误读；“落下”自然表达日落，同时保留空间描写。
theological_decisions:
- issue: 太阳经由天门并沿既定路线运行的宇宙图景
  choice: 保留“门”“路线”和太阳运行、落下的具体形象
  alternative: 改写成抽象或现代科学式的天文描述
  rationale: 本段呈现的是异象性、结构化的古代宇宙图景；翻译应保存其文学与观念形式，而不以现代天文学加以重构。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“路线”比“轨道”更少引入现代科学含义；句式保留原文连续动作和周期运行的节奏。
