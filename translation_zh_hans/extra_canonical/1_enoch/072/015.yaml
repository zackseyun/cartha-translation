base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/015.yaml
  text: And the sun rises so that the day grows shorter and the night lengthens[a], and the sun returns to the east and enters into the sixth gate[c][b], and rises from it and sets for thirty mornings.
translation:
  language: zh_hans
  text: 太阳升起，白昼渐短，黑夜渐长；太阳返回东方[a]，进入第六道门[b]，从那里升起，又落下，如此三十个早晨[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “东方”直译可作“早晨”或“在早晨”。这里按《天文书》的空间图景理解为日出所在的东方；另可译：“太阳在早晨返回，进入……”。
    reason: translation_ambiguity
  - marker: b
    text: 这里的“门”是《天文书》宇宙图景中的天门，宜按异象世界中的具体结构来理解，不宜仅化约为季节的比喻。
    reason: cultural_note
  - marker: c
    text: 末句的文本和句法较难确定。“三十个早晨”很可能指太阳使用这道门运行的三十日时段；另可译：“连续三十个早晨升起、落下。”
    reason: textual_variant
lexical_decisions:
- source_word: ይትነሣእ
  choice: 升起
  rationale: 该动词描写太阳上升；“升起”自然、庄重，并保留天文叙述的语体。
- source_word: ትሕጽር ዕለት
  choice: 白昼渐短
  rationale: 表达日照时段逐渐缩短的季节性变化，也与下句形成工整对照。
- source_word: ትኑኅ ሌሊት
  choice: 黑夜渐长
  rationale: 与“白昼渐短”平行，准确表达夜间时长增加。
- source_word: ይገብእ ፀሐይ በጽባሕ
  choice: 太阳返回东方
  rationale: ይገብእ 表示“返回”，而 በጽባሕ 在本书空间宇宙观中指向日出之处，即东方；脚注保留较字面的时间性理解。
- source_word: ይበውእ ውስተ ሳድስት ኆኅት
  choice: 进入第六道门
  rationale: ይበውእ 表示进入；“门”保留《天文书》中具体的宇宙结构意象。
- source_word: ይሠርቅ እምኔሃ
  choice: 从那里升起
  rationale: 该短语指太阳从这道门出现并升起；译文保持太阳运行用语的一致性。
- source_word: የዓርብ ሠላሳ ጽባሐ
  choice: 又落下，如此三十个早晨
  rationale: የዓርብ 在太阳语境中为“落下”，ሠላሳ ጽባሐ 直指数算的“三十个早晨”；“如此”使中文明确这是持续的运行周期，但不把“早晨”改释为“日”。
