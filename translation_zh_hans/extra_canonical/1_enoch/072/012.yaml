  yaml_path: translation/extra_canonical/1_enoch/072/012.yaml
  text: And at that time the day grows longer by two parts[a], and the day becomes eleven parts[b], and the night grows shorter and becomes seven parts.
translation:
  language: zh_hans
  text: 那时，白昼延长两份[a]，白昼就有十一份；黑夜缩短，就有七份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 埃塞俄比亚文这一见证中的“两”带有存疑标记；不过本节所述白昼为十一份、黑夜为七份，与白昼延长两份的意思相符。
    reason: textual_variant
lexical_decisions:
- source_word: ወእሜሃ
  choice: 那时
  rationale: 作为时间承接语，简洁保留原文依次观察天象变化的叙述方式。
- source_word: ይነኍኅ
  choice: 延长
  rationale: 该动词在此表示长度增加；上下文中白昼达到十一份，也支持“延长”。
- source_word: ዕለት
  choice: 白昼
  rationale: 这里与“黑夜”相对，并按份计量，所指是日照时段而非完整的一日。
- source_word: †ክልኤ†
  choice: 两份
  rationale: 数字词在此见证中带有文本不确定标记；结合全章按“份”计量的术语，补出隐含单位。
- source_word: ክፍለ
  choice: 份
  rationale: 这是本章划分昼夜长度的计量术语；“份”自然、简洁，也适合十一份与七份的对应。
- source_word: ወትከውን
  choice: 就有
  rationale: 自然表达长度总量达到某一份数，同时保留原文连续变化的关系。
- source_word: ዓሠርተ ወአሐደ
  choice: 十一
  rationale: 按现代汉语通常数词表达原文“十和一”。
- source_word: ወተሐጽር ሌሊት
  choice: 黑夜缩短
  rationale: 直接保留黑夜长度减少之意，并与前句“白昼延长”形成清楚对照。
- source_word: ሰብዓተ ክፍለ
  choice: 七份
  rationale: 保留本章的计量方式，并与白昼十一份共同构成十八份。
