  text: On that day the day becomes longer than the night by a ninth part[a], and the day becomes exactly ten parts[c][b], and the night becomes exactly eight parts.
translation:
  language: zh_hans
  text: 那一天，白昼比黑夜长九分之一[a]；白昼恰为十份[b]，黑夜恰为八份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “九分之一”也可理解为昼夜总计十八份中的两份：白昼十份，黑夜八份。原文在“变长”之后另有一个读法困难、被括注的词；它不影响本句的基本意思。
    reason: textual_variant
  - marker: b
    text: 这里的“份”是本章用来计量和比较昼夜相对长度的固定划分，并非现代钟点。
    reason: cultural_note
lexical_decisions:
- source_word: በውእቱ፡ ዕለት፡
  choice: 那一天
  rationale: 保留指示与时间公式，指太阳运行周期中的特定日期。
- source_word: ትነኍኅ፡ እምሌሊት፡
  choice: 白昼比黑夜长
  rationale: 按天文语境将动词译为时长增加，并将介词关系表达为比较。
- source_word: ታስዕተ፡ እደ፡
  choice: 九分之一
  rationale: 结合词形及本章十八份制：白昼十份、黑夜八份，相差两份，即全体的九分之一；避免误译为“九份”。
- source_word: ጥንቁቀ፡
  choice: 恰为
  rationale: 该词强调精确计量；原文在白昼与黑夜的数值后均有相应强调，译文两处都予以体现。
- source_word: ዓሠርተ፡ ክፍለ፡ / ስመንተ፡ ክፍለ፡
  choice: 十份／八份
  rationale: ክፍል 指划分出来的部分；“份”自然地传达本章用于比较昼夜长度的计量单位。
- source_word: '[ካዕበተ፡]'
  choice: 不在正文中单独译出
  rationale: 此括注词读法困难，可能意为“再次”或属于讹误；可靠的上下文已能完整表达句意，因此将不确定性收入脚注而不强行补义。
theological_decisions:
- issue: 数字语言的性质
  choice: 按本章的天文计量体系理解为昼夜长度的技术性划分
  alternative: 将数字解释为象征性的末世数字，或仅视为季节变化的笼统说法
  rationale: 第72章连续描述太阳运行及昼夜长短，十份、八份和九分之一彼此吻合；译文保留文本自身的宇宙观表达，不另加象征性神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“白昼／黑夜”比“日／夜”更明确地指持续时长；分号呈现先概括差额、再列出精确份数的结构。所有正文脚注标记均与脚注对应。
