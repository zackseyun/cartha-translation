base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/020.yaml
  text: On that day the day becomes equal with the night[a], [and it becomes even], and the night becomes nine parts[c][b], and the day also nine parts.
translation:
  language: zh_hans
  text: 那一天，白昼与黑夜相等，[并且变得均等][a]；黑夜成为九份[b][c]，白昼也成为九份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “并且变得均等”在所据文本中带方括号，可能是后加文字，也可能是读法不确定；译文照录方括号，以显明这一文本问题。
    reason: textual_variant
  - marker: b
    text: 这里的“份”是《天文书》用来示意划分昼夜的单位，并非现代钟表所计的小时。
    reason: cultural_note
  - marker: c
    text: “黑夜成为九份，白昼也成为九份”也可表达为“黑夜为九份，白昼也为九份”；正文保留原文动词“成为”的公式化说法。
    reason: translation_alternative
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: 那一天
  rationale: 这是时间指示短语；译作“那一天”自然、简洁，并保留历法观察的语境。
- source_word: ይትዓረይ፡ መዓልት፡ ምስለ፡ ሌሊት
  choice: 白昼与黑夜相等
  rationale: 动词表达变得相等或达到平衡；此处按天文历法语境译为“相等”，不额外解释为现代意义的精确时长。
- source_word: '[ወይከውን፡ ዕሩየ፡]'
  choice: '[并且成为均等的]'
  rationale: 原始资料将此短语置于方括号中，表明文本存疑；译文保留方括号并加注，既传达“均等、平衡”之义，也不掩盖异文状况。
- source_word: ተስዓተ፡ ክፍለ
  choice: 九份
  rationale: “份”保留《天文书》中划分昼夜比例的技术性表达，避免误解为现代钟表的九小时。
- source_word: ወትከውን፡ ሌሊት ... ወመዓልትኒ
  choice: 黑夜成为……，白昼也成为……
  rationale: 依照动词“成为”的基本意义和本章反复出现的公式化措辞翻译，使昼夜两项保持对应结构。
theological_decisions:
- issue: 昼夜相等的语言应按历法描述还是象征意象理解
  choice: 按上下文译作昼夜比例达到相等的天文历法描述
  alternative: 将其理解为宇宙和谐的象征性表述
  rationale: 《天文书》此处上下文以“份”计算昼夜，属于技术性、历法性的叙述；译文不将其灵意化，同时保留原文自身的表达方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“白昼／黑夜”体现历法叙述的成对术语；“九份”简洁保留古代示意性计量方式。方括号直接保留底本的文本不确定性。
