base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/009.yaml
  text: And in those days the day grows longer from day to day[a], and the night grows shorter from night to night[c][b], until thirty mornings.
translation:
  language: zh_hans
  text: 在那些日子，白昼一天比一天长[a]，黑夜一夜比一夜短，直到三十个清晨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文逐字重复“日”和“夜”，形成比较结构；意思是相继而来的白昼越来越长，黑夜越来越短。
    reason: lexical_alternative
  - marker: b
    text: “清晨”也可译作“黎明”。原词字面指早晨或黎明，在这里可能是天体运行方案中的计数单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: 在那些日子
  rationale: 这是常见的时间短语，也保留了启示文学庄重的叙述语气。
- source_word: ትነኍኅ
  choice: 长
  rationale: 该动词表示时长增加；结合“白昼”，译为“长”简洁自然，并准确表达日照时间延长。
- source_word: ዕለት እምዕለት
  choice: 白昼一天比一天长
  rationale: 源文以“日从日”的重复结构表达连续比较。汉语“一天比一天长”既保留逐日递增的比较意义，也避免生硬直译。
- source_word: ተኃጽር ሌሊት እምሌሊት
  choice: 黑夜一夜比一夜短
  rationale: 与前句保持平行，表达每一夜相较前一夜逐渐缩短。
- source_word: እስከ ሠላሳ ጽባሕ
  choice: 直到三十个清晨
  rationale: ጽባሕ 的具体含义是“早晨、清晨、黎明”；保留“清晨”可呈现本段天体运行方案中的计数方式，而不将其抽象改写为“三十天”。
theological_decisions:
- issue: 是否把源文重复的比较结构简化为一般的“日渐”
  choice: 采用“白昼一天比一天长，黑夜一夜比一夜短”
  alternative: 白昼日渐延长，黑夜日渐缩短
  rationale: 本节属于《天文书》，描述昼夜长度按次序变化。保留逐日、逐夜的比较结构，更能反映源文的观测性和程式性，同时符合现代汉语。
- issue: “三十个清晨”是否应解释为“三十天”
  choice: 保留“三十个清晨”
  alternative: 直到三十天
  rationale: 源词明确指早晨或黎明，且这一具体说法可能承担本章天体周期的计数功能；不在正文中替文本消除其独特表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“白昼／黑夜”保持天文叙述的清晰对称；“一天比一天／一夜比一夜”自然传达源文的重复比较结构。
