base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/018.yaml
  text: On that day the day diminishes by two parts[a], and the day becomes ten parts[b], and the night eight parts.
translation:
  language: zh_hans
  text: 在那一天，白昼减少两份[a]，成为十份，黑夜则为八份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《天文书》常以若干“份”来计算白昼和黑夜。本节描述白昼随季节缩短：白昼为十份，黑夜为八份。
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: 在那一天
  rationale: 保留指示语的特定时间含义，并以自然的现代汉语表达天体运行周期中的这一日。
- source_word: ተሐፅፅ
  choice: 减少
  rationale: 该动词表示缩减；在此指白昼时长按季节减少。“减少”既符合天文语境，也不额外解释其机制。
- source_word: ተክልኤተ ክፍል
  choice: 两份
  rationale: 这里量明白昼减少的幅度，而非分成两部分；“两份”保留本章以份数计量昼夜的术语。
- source_word: ወትከውን ዕለት ዓሠርተ ክፍለ
  choice: 成为十份
  rationale: 源文明确以“白昼”为动词的主语；汉语承接前句省略主语自然，同时保留变化后的结果。
- source_word: ወሌሊት ስመንተ ክፍለ
  choice: 黑夜则为八份
  rationale: 与白昼十份构成清晰对照，并保留源文按份数计算黑夜的表述。
