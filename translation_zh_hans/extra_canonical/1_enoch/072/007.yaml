base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/007.yaml
  text: And in that fourth gate[a], from which the sun comes out in the first month, there are twelve open windows[c][b], from which a flame comes out when they are opened at their appointed times.
translation:
  language: zh_hans
  text: 在第四座门内，就是太阳在第一个月从那里出来的那座门内，有十二个敞开的窗口[a]；当这些窗口在各自规定的时节开启时，火焰便从中出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抄录本此处的词形疑有误，按校勘可读作“敞开的窗口”。若机械地依照现存词形，曾有解释将其与“风的权柄”或“风的天使”联系起来；但这种解释不大符合本句的句法和上下文。
    reason: textual_variant
lexical_decisions:
- source_word: ኆኅት ራብዕት
  choice: 第四道门
  rationale: 保留《天文书》中天体经由天上门户运行的具体宇宙图景；“道”使现代汉语表达自然。
- source_word: ይወፅእ ፀሐይ
  choice: 太阳……从那里出来
  rationale: 忠实表达“出去、出来”的具体运动，又符合现代汉语语序。
- source_word: በወርኅ ቀዳማዊ
  choice: 在第一个月
  rationale: 直接保留原文的历法时间表述，不额外判定它对应哪一种历法。
- source_word: ባቲ ፲፪ መስኮተ መላክወ ርኅዋተ
  choice: 里面有十二扇敞开的窗户
  rationale: 结合校勘意见，将抄录文本中的መላክወ视为መሳክወ的误读，并把ርኅዋተ理解为“敞开的”；这比把该短语牵涉到风的权柄或天使更符合句法和上下文。
- source_word: ዘእምኔሆን ይወፅእ ላህብ
  choice: 有火焰从中喷出
  rationale: ዘእምኔሆን表示“从其中／从那些窗户”，ላህብ指火焰；“喷出”传达火焰从开口涌出的鲜明动态。
- source_word: ሶበ ይትረሐዉ እምዘመነ ዚአሆሙ
  choice: 到了它们所定的时节，这些窗户一打开
  rationale: 保留天体秩序中各开口按指定时序开启的含义；汉语调整语序以清楚呈现时间与动作的关系。
theological_decisions:
- issue: 疑难词组是否应明确译出风的权柄或风的天使
  choice: 正文译作“十二扇敞开的窗户”
  alternative: “风所管辖的十二个窗口”或“风之天使的十二个窗口”
  rationale: 现有抄录中的መላክወ很可能是መሳክወ的OCR或抄录误差，而ርኅዋተ可作“敞开的”。因此不在正文中引入语法和上下文均无充分依据的风或天使观念；同时以脚注透明说明文本问题。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“门、窗户、火焰”保留启示文学的建筑性宇宙意象；不把“第一个月”现代化为特定月份，也不添加原文没有明确说明的天使论。
