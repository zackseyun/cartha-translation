base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/025.yaml
  text: And on that day the sun comes out from that second gate[a], and sets in the west at the second gate, and returns to the east at the first gate for thirty-one mornings[d][c][b], and sets at the first gate in the west of heaven.
translation:
  language: zh_hans
  text: 那一天，太阳从那第二道门出来[a]，在西方的第二道门落下；又回到东方，在第一道门历经三十一个清晨[b]，并在天之西方的第一道门落下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“门”指天上供太阳出入的开口。
    reason: cultural_note
  - marker: b
    text: 原文直译为“三十一个清晨”；在这一日月运行体系中，这一说法用来计算日数。原文句序紧凑，此时间短语与“回到东方、在第一道门”及随后在西方第一道门落下之间的具体语法联系并不完全明确。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ይወፅእ
  choice: 出来
  rationale: 按太阳从天门显出的具体运动译出，现代汉语自然，也保留宇宙图景。
- source_word: ኆኅት
  choice: 门
  rationale: 本段指天上供日月出入的固定开口；“门”比“窗”更贴近全书的天界构造意象。
- source_word: ያዓርብ
  choice: 落下
  rationale: 主语为太阳且地点在西方，语境明确指日落；“落下”既自然又保留动作感。
- source_word: ይገብእ
  choice: 回到
  rationale: 该动词基本义可指进入，但在太阳循环往返的序列中可表达返回；“回到东方”符合上下文，同时不另增原文没有的分词。
- source_word: በአሐቲ ኆኅት
  choice: 在第一道门
  rationale: 在依次列举天门的语境中，阴性数词“一个”具有序数作用，指第一道门，而非任意一道门。
- source_word: ሠላሳ ወ፩ ጸባሐ
  choice: 三十一个清晨
  rationale: ጸባሐ直译为“清晨”，在此作为历法中的日数单位；保留原文意象，不直接规范化为“三十一天”。
- source_word: ምዕራበ ሰማይ
  choice: 天的西边
  rationale: 保留其天界宇宙构造含义，同时采用普通现代汉语可懂的表达。
