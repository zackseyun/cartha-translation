base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/001.yaml
  text: The book of the courses of the luminaries of heaven[a], how they are, each according to their companies, and according to their dominion and their seasons, according to their names and their origins, and according to their paths, which Uriel, the holy angel who was with me, showed me—he who is their guide—and the whole record of them, as he showed me, and how it is with regard to every year of the world and forever[h][g][f][e][d][c][b], until a new work is accomplished which will endure forever.
translation:
  language: zh_hans
  text: 《天上众光体运行之书》：记述它们如何运行：各按自己的群体[a]、权柄和时节，又按各自的名称、起源[b]和路径。这些都是与我同在的圣天使乌列向我显明的——他就是它们的引导者；他也照样把关于它们的全部记录[c]向我显明，并显明关乎世界每一年的事，直到永远[d]，直至一项将永远存留的新作为[e]完成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “群体”所译的词通常指“人民、会众或群体”，这里以社会群体的说法比喻众天体的分组；也可译作“众队”或“各群”。
    reason: lexical_alternative
  - marker: b
    text: “起源”直译可作“出生”或“源头”；在这里的天文语境中，也可能指天体“升起”之处。
    reason: lexical_alternative
  - marker: c
    text: 原文为单数，字面近于“它们的整本书”或“它们的全部记载”；这里按上下文译作“关于它们的全部记录”。
    reason: textual_clarity
  - marker: d
    text: “世界每一年”可能指本书天文部分所描述的完整年度循环。原句十分凝练，也可理解为“世界的整年如何运行，直到永远”。
    reason: cultural_note
  - marker: e
    text: “新的作为”也可理解为“新的创造”，即一项永远长存的决定性神圣行动；原文并未把含义明确限定为创造或秩序重整。
    reason: lexical_alternative
lexical_decisions:
- source_word: መጽሐፈ ሚጠተ ብርሃናት ሰማይ
  choice: 《天上众光体运行之书》
  rationale: “运行”表达天体有规律的行程；“众光体”既保留“众光”的字面意象，又自然指向天体，并维持启示文学的庄重语体。
- source_word: በበሕዝቢሆሙ
  choice: 各按自己的群队
  rationale: ሕዝብ本指人民、会众或群体，此处比喻天体的分组；“群队”保留集体性意象，避免改成现代分类学术语。
- source_word: ሥልጣኖሙ
  choice: 权柄
  rationale: 该词表示权力、管辖或统治权；“权柄”适合此处天体受命而有的职权，也符合庄重语域。
- source_word: ዘመኖሙ
  choice: 时节
  rationale: 在天文历法语境中指规定的时间或季节周期；“时节”兼顾时间划分与历法含义。
- source_word: ሙላዳቲሆሙ
  choice: 起源
  rationale: 基本义为出生、起源；在天文语境中也可能暗示升起之处。“起源”不强行限定具体天文学解释。
- source_word: አውራኂሆሙ
  choice: 路径
  rationale: 表示道路、行径；“路径”自然指天体所循之路，又避免使用带现代科学色彩的“轨道”。
- source_word: ኵሎ መጽሐፎሙ
  choice: 关于它们的全部记录
  rationale: መጽሐፎሙ为单数，字面近于“它们的整本书/全部记载”；此处译作“全部记录”，在中文中较自然，同时保留整体性。
- source_word: ግብር ኃዲስ
  choice: 新的作为
  rationale: ግብር可指工作、行为、作为；“新的作为”保留其广度，不直接把它限定为“新创造”。
theological_decisions:
- issue: “新的作为”（ግብር ኃዲስ）的范围
  choice: 译作“一项将永远存留的新作为”
  alternative: “一个新创造”或“一种新秩序”
  rationale: 原文可能指末后的创造行动，也可能泛指更新宇宙秩序的作为。采用较宽的“新作为”，不把后期神学措辞直接带入文本。
- issue: 执行“新作为”的主体
  choice: 沿用无明确施事者的表达“完成”
  alternative: 明说“上帝完成”
  rationale: 原句没有在此处明说施事者。虽然语境可能暗示神圣行动，译文不擅自补出主体。
- issue: “世界每一年……直到永远”的句法关系
  choice: 译作“关乎世界每一年的事，直到永远”
  alternative: “世界的整年如何运行，直到永远”
  rationale: 原文结构简略，既可能涉及每一年的秩序，也可能指完整的宇宙年度循环。正文保留概括性，脚注说明可能含义。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。标题保留古代启示文学的篇章感；正文用破折号梳理原文长句，但不消除“世界每一年”及“新的作为”所含的真实歧义。所有脚注标记均已置于正文相应位置。
