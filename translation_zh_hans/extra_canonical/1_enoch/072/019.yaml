base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/019.yaml
  text: And the sun comes out from that fifth gate[a], and sets in the fifth gate in the west, and rises in the fourth gate according to its signs for thirty-one mornings[d][c][b], and sets in the west.
translation:
  language: zh_hans
  text: 太阳从那第五道门出来，在西边的第五道门落下；又照着它的征象[a]，在第四道门升起，持续三十一个早晨，并在西边落下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照着它的征象”原文含义较难确定，也可理解为“因为它的征象”。这里可能是指太阳在这三十一个早晨期间显出的标志，或与其运行有关的标志。
    reason: lexical_alternative
  - marker: b
    text: 原文末句简略，直译为“并在西边落下”。有些译本补出“在那道门”，但本节所据文本在这里没有再次明说“门”。
    reason: alternative_reading
lexical_decisions:
- source_word: ይወፅእ
  choice: 出来
  rationale: 原词表示出去、显出；用于太阳运行时，“出来”既具体自然，也保留从天门而出的图景。
- source_word: ኆኅት
  choice: 门
  rationale: 本书以天上的“门”描绘众光体运行的出入口；直译可保留其启示文学的宇宙图景。
- source_word: የዓርብ / ያዓርብ
  choice: 落下
  rationale: 在太阳运行的语境中指日落；“落下”自然明白，并与“升起”对应。
- source_word: ምዕራብ
  choice: 西边
  rationale: 表示西方或西部区域；“西边”适合此处空间性的叙述。
- source_word: ይሠርቅ
  choice: 升起
  rationale: 在天文语境中指太阳升起。
- source_word: በራብዕት ኆኅት
  choice: 在第四道门
  rationale: 介词በ与前文“在第五道门”结构相同，因此采用一致的空间表达，不人为区分为“借着”或“靠近”。
- source_word: በእንተ ትእምርታቲሃ
  choice: 照着它的征象
  rationale: በእንተ可表达缘由、关联或依据；结合太阳按既定标志运行的语境，“照着”自然地保留依据关系，而“征象”保留原文技术性兼启示文学色彩。
- source_word: ሠላሳ ወአሐዱ ጽባሕ
  choice: 三十一个早晨
  rationale: 原文明确说“早晨”，没有泛化为“日子”；直译可保留按晨曦观察太阳周期的框架。
theological_decisions:
- issue: 天上之“门”的宇宙图景
  choice: 保留“门”的字面意象
  alternative: 窗口；开口
  rationale: 《天文书》以结构化的天门描述太阳运行。保留“门”可尊重启示文学图景，避免将文本改写成现代天文学术语。
- issue: 太阳运行与“征象”的关系
  choice: 译作“照着它的征象”
  alternative: 因为它的征象；为了它的征象
  rationale: 原短语可涉及原因或依据，且具体所指并不完全清楚。“照着”避免误解为目的，同时不把“征象”过度解释为某种特定神学秩序。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号梳理重复的运行步骤，同时保留“第五道门”“第四道门”“三十一个早晨”等公式化表达及启示文学意象。
