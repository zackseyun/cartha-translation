base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/024.yaml
  text: And on that day the night becomes eleven parts[b][a], and the day seven parts.
translation:
  language: zh_hans
  text: 在那一天，夜长变为十一份[a]，昼长为七份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节用有编号的“份”来计算昼夜；这是《天文书》示意性历法中的技术表达，并非通常所说的钟点。
    reason: cultural_note
lexical_decisions:
- source_word: ወበይእቲ፡ ዕለት
  choice: 在那一天
  rationale: 保留指示词和时间公式；现代汉语中自然、明确。
- source_word: ትከውን
  choice: 变为
  rationale: 未完成体在本章反复出现的天文周期公式中描写昼夜长度的渐次变化，因此译作“变为”，而非仅作静态的“是”或单纯将来时。
- source_word: ሌሊት
  choice: 夜长
  rationale: 原词为“夜”；结合后面的份数计量，汉语用“夜长”能自然说明所量的是夜间长度，同时不改变昼夜对举。
- source_word: ዓሠርተ፡ ወአሐደ፡ ክፍለ
  choice: 十一份
  rationale: 原文直译为“十和一份”；“份”保留《天文书》中把昼夜划分为若干部分的技术性表达。
- source_word: ወዕለት፡ ሰብዓተ፡ ክፍለ
  choice: 昼长为七份
  rationale: 与前半句平行，清楚表达白昼所占的七个部分；“昼长”与“夜长”形成自然对举。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“夜长／昼长”明确份数所计量的是昼夜长度；保留“变为”以反映天文周期中的变化。脚注标记置于“十一份”之后，适用于本句两项份数。
