  yaml_path: translation/extra_canonical/1_enoch/072/006.yaml
  text: Thus it comes out in the first month through the great gate[b][a], which is the fourth of those six gates that are toward the sunrise.
translation:
  language: zh_hans
  text: 这样，在第一个月，它从那道大门出来；这门是朝向日出之处的六道门中的第四道。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据文本把关于“朝向日出之处的六道门”的末句置于方括号内；这句话可能是解释性的增文，也可能属于文本不确定的内容，不过与本章反复提到东方六道门的描写相符。
    reason: textual_variant
  - marker: b
    text: 或译：“这门是第四道——就是朝向日出之处的那六道门。”这种译法保留原文较松散的并列结构；正文则按“六道门中的第四道”理解。
    reason: previous_rendering
lexical_decisions:
- source_word: ከመዝ
  choice: 这样
  rationale: 承接上文，表示太阳运行的方式或次序；简洁自然，同时保留原文的连接作用。
- source_word: ይወፅእ
  choice: 出来
  rationale: 原义为“出去、出来”；这里描写太阳穿门而出，不直接意译为“升起”，以保留具体的宇宙图景。
- source_word: በወርኅ ቀዳማዊ
  choice: 在第一个月
  rationale: 直接表达原文的时间短语，符合现代汉语习惯。
- source_word: በኆኅት ዓቢይ
  choice: 从那道大门
  rationale: ኆኅት 指门或入口；介词与“出来”连用时译为“从……出来”最自然。“大门”保留 ዓቢይ 的修饰意义和全章反复出现的门之意象。
- source_word: እንተ ይእቲ ራብዕት
  choice: 这门是……第四道
  rationale: 把关系从句自然转化为汉语分句，明确该门在一组六道门中的次序。
- source_word: እልኩ ኃዋኅወ ፮
  choice: 六道门中的
  rationale: 按校审所指出的部分关系理解，使“第四道”明确属于这六道门，同时不加入原文以外的解释。
- source_word: እለ መንገለ ምሥራቀ ፀሐይ
  choice: 朝向日出之处的
  rationale: ምሥራቀ ፀሐይ 表示太阳升起或日出；译文避免生硬且易误解的“太阳的东方”，并保留门所处方位的宇宙图景。
theological_decisions:
- issue: 太阳通过编号之门运行的宇宙图景
  choice: 保留“从门出来”以及六道门中第四道的具体描写
  alternative: 按现代天文学观念意译为太阳从天空某一区域升起
  rationale: 本段以门和编号描写天体运行，这是文本自身的启示文学—宇宙论意象；翻译不应将其化约为现代天文学表述。
- issue: 末句的文本不确定性
  choice: 将其收入正文，并用脚注说明所据文本以方括号标示
  alternative: 从正文删去该句，或在正文中直接加上方括号
  rationale: 该句符合本章关于东方六道门的反复描述，但见证文本明确显示其可能属于解释性增文或传抄不稳定的文字；正文保留而脚注示警，可同时顾及连贯性与文本证据。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“它”承接上下文中的太阳，不在本节擅自补明主语；“道”作门的量词，使编号表达自然。保留“门”的具象宇宙意象，不以“天区”“方位区段”等现代术语改写。
