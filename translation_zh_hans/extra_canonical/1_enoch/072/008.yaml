  yaml_path: translation/extra_canonical/1_enoch/072/008.yaml
  text: And when the sun rises from the sky[a], it goes out through that fourth gate for thirty mornings[c][b], and through the fourth gate in the west of the sky it goes down exactly.
translation:
  language: zh_hans
  text: 太阳从天上升起时，便从那第四道门出来，连续三十个早晨[a]；又从天空西边的第四道门径直降下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“三十天”。吉兹语直译为“三十个早晨”；在这一天文运行序列中，它用作时间单位。
    reason: lexical_alternative
  - marker: b
    text: “径直地”也可译作“准确地”或“沿正直的路线”；所强调的可能是运行方位或路线的精确、规整。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሠርቅ
  choice: 升起
  rationale: 在以太阳为主语的天文语境中，指太阳升起；现代汉语自然，同时保留原文的运动意象。
- source_word: ይወፅእ
  choice: 出去
  rationale: 保留太阳经由门而出的具体运动语言，不将异象中的宇宙结构淡化为普通的日出表述。
- source_word: ኆኅት
  choice: 门
  rationale: 本书以一系列天上的门描述日月运行；“门”直接保留这一结构性意象。
- source_word: ራብዕት
  choice: 第四道
  rationale: 忠实保留门的序数，并以量词“道”使现代汉语顺畅。
- source_word: ሠላሳ ጽባሐ
  choice: 三十个早晨
  rationale: 原文明确使用“早晨”，虽在此序列中可表示三十天的时段，正文仍保留其字面表达。
- source_word: ምዕራበ ሰማይ
  choice: 天空西边
  rationale: 自然地表达原文的空间方位，同时保留其宇宙图景。
- source_word: ርቱዐ
  choice: 准确地
  rationale: 表达规则、精确或沿正直路线运行的空间含义，避免译成表示时间紧接的“立刻”。
- source_word: ይወርድ
  choice: 降下
  rationale: 保留原文“下降”的运动意义，不直接替换为较惯用但意象较弱的“落下/落山”。
theological_decisions:
- issue: 天上诸门的宇宙图景
  choice: 保留“门”以及太阳出入、下降的具体运动语言。
  alternative: 将其解释并改写为一般观察意义上的日出和日落。
  rationale: 本段属于具有结构化宇宙图景的天文异象；译文不应把其独特意象消解为普通自然现象的说法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留天文异象中“门”与运动方向的具体表达；以“持续”补足汉语时段关系，但不增加解释性神学内容。
