base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/011.yaml
  text: And the sun comes out from that fourth gate[a], and sets in the fourth gate, and returns to the fifth gate of the east for thirty mornings[c][b]; then it comes out from it and sets in the fifth gate.
translation:
  language: zh_hans
  text: 太阳从那第四道门出来，在第四道门落下，又返回东方的第五道门；经过三十个清晨[a]，它从那里出来，在第五道门落下。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“三十个清晨”；有些译本作“三十天”。原句结构紧凑，这一时段短语与返回东方第五道门的关系未作详细说明。
    reason: 保留原文计时用语及其句法简略性。
  - marker: b
    text: 末句再次提到第五道门。原文叙述简略，可能是在概括太阳经过这三十个清晨后继续循第五道门出入的运行过程。
    reason: 说明重复措辞及其可能的概括功能，而不在正文中强行消除歧义。
lexical_decisions:
- source_word: ወይወፅእ ፀሐይ
  choice: 太阳……出来
  rationale: 该动词本义为出去、出来；在本段天象语境中指太阳从门中显现。译作“出来”既自然，也保留原文的运动意象。
- source_word: እምዘክቱ ራብዕ ኆኅት
  choice: 从那第四道门
  rationale: 指示词回指前文所说的门；“门”保留《天文书》的宇宙图景，“道”作为量词使现代汉语表达自然。
- source_word: ወየዓርብ
  choice: 落下
  rationale: 在太阳运行的语境中表示日落。译作“落下”比单用“落”更庄重，并保留动态表达。
- source_word: በራብዕት
  choice: 在第四道门
  rationale: 原文简略为“在第四”，所省略的“门”由上下文明确，汉语补出以避免歧义。
- source_word: ወይገብእ
  choice: 又返回
  rationale: ገብአ 的核心义为返回、归回；此处描写太阳落下后回到东方，而非单纯进入某门。
- source_word: ውስተ ኃምስ ኆኅት እንተ ጽባሕ
  choice: 东方的第五道门
  rationale: 保留“东方”这一明确方位修饰，显示太阳返回东方第五门的宇宙运行次序。
- source_word: ሠላሳ ጽባሐ
  choice: 三十个清晨
  rationale: 原文按“清晨”计数；不泛化为“三十天”，以保留本段特有的计时说法。
- source_word: እምኔሃ
  choice: 从那里
  rationale: 阴性代词回指第五道门；汉语用“那里”比“从它”更符合处所指称。
- source_word: ኃምስት ኆኅት
  choice: 第五道门
  rationale: 与前文术语一致，保留原文重复及其宇宙图景。
theological_decisions:
- issue: 是否把太阳经由各门出入的宇宙论语言改写为现代天文学术语
  choice: 保留“门”、太阳“出来”“返回”和“落下”的意象
  alternative: 改写为太阳运行的“方位”“区域”或“位置”
  rationale: 本节呈现的是启示文学中的宇宙图景。翻译应忠实保存其具体意象，而不以现代科学框架消解原文。
- issue: “返回”与“三十个清晨”的关系
  choice: 译为“又返回东方的第五道门，历时三十个清晨”
  alternative: 译为“进入东方的第五道门三十个清晨”
  rationale: 原文句法紧凑，时段可理解为与返回第五门后的阶段相连；正文以自然汉语呈现，但不将其进一步解释成现代意义上的三十整天。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“道”作门的量词，保留启示文学的宇宙意象；避免现代天文学改写。正文维持原文的重复和简略，只通过脚注提示计时短语的句法张力。
