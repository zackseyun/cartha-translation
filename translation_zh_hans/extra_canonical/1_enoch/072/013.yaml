base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/013.yaml
  text: And it enters at dawn and goes out through the sixth[a], and it goes out and sets in the sixth gate for thirty-two mornings[d][c][b], according to its sign.
translation:
  language: zh_hans
  text: 清晨，它进入，并经第六道门出去[a]；它又出去，并在第六道门落下，共三十二个清晨[b]，依照它的标记[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里很简略，只说“第六”，按本章上下文指第六道门。该短语的空间关系不甚明确；较直地说可理解为“出去到第六〔门〕”，正文则按上下文译作“经第六道门出去”。
    reason: 省略成分及介词关系存在翻译选择。
  - marker: b
    text: 直译为“三十二个清晨”；原文以清晨计数，没有直接说“三十二天”。
    reason: 保留原文的计时用语。
  - marker: c
    text: 或译：“因着它的标记”或“关于它的标记”。句末短语所表示的是依据、原因还是关联，原文关系略有歧义。
    reason: 原介词可表示依据、原因或关联，原文关系略有歧义。
lexical_decisions:
- source_word: ይገብእ
  choice: 进入
  rationale: 保留表示进入的具体运动动词，与本章天体经由门户运行的图景相符。
- source_word: ጽባሐ
  choice: 清晨
  rationale: 该词表示早晨或黎明；此处作时间说明，译为“清晨”自然且保留原文措辞。
- source_word: ይወፅእ
  choice: 出去
  rationale: 原文两次使用同一运动动词，译文也两次保留，以免删去其重复而压缩的技术性叙述。
- source_word: ውስተ ሳድስት
  choice: 从第六道门出去
  rationale: 原文只说“第六”，按全章语境所省略的是门；汉语正文补出“道门”以便理解。“从……出去”表达天体经该开口出现的运动，同时脚注保留介词关系的另一种直译可能。
- source_word: የዓርብ
  choice: 落下
  rationale: 该动词有下降之意，在太阳运行的语境中指落下或落山；“落下”既自然，也不额外加入“太阳”一词。
- source_word: ኆኅት
  choice: 门
  rationale: 本书以天上的门户描绘天体运行路径；“门”比现代化的“区域”或“方位”更能保存启示文学的具体意象。
- source_word: ሠላሳ ወ፪ ጽባሕ
  choice: 三十二个清晨
  rationale: 原文明确以“清晨”计数，不顺译为“三十二天”，以保留其历法叙述方式。
- source_word: በእንተ ትእምርተ ዚአሃ
  choice: 依照它的标记
  rationale: 在此秩序化的天体运行描述中，“依照它的标记”可表达该行程与其指定标记的关联；鉴于介词也可表示原因或论题，脚注列出其他可能。
theological_decisions:
- issue: 天上门户的宇宙图景
  choice: 保留“门”的具体意象
  alternative: 译作“窗口”“区域”或“方位”
  rationale: 原文呈现的是启示文学中的宇宙建筑图景；不把它改写成现代天文学术语，也不对其作教派化解释。
- issue: “依照它的标记”所表达的关系
  choice: 正文译作与既定标记相符的关系
  alternative: “因着它的标记”或“关于它的标记”
  rationale: 原介词可表达原因、关联或论题，语境容许不止一种理解；正文选取较适合本章秩序性描述的译法，并以脚注保存歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文重复的“出去”和天体经由“门”运行的具体图景；只在“第六”之后补出上下文明确省略的“道门”，并用脚注说明。
