  text: On that day the day becomes longer than the night[a], and the day becomes twice the night, and the day becomes twelve parts[b], and the night grows shorter and becomes six parts.
translation:
  language: zh_hans
  text: 那一天，白昼变得比黑夜长；白昼成为黑夜的两倍[a]；白昼成为十二份，黑夜缩短，成为六份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据转写文本此处的字形可被误读为“九”；结合校勘读法及下文“十二份”对“六份”的对应关系，此处译为“两倍”。
    reason: textual_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: 那一天
  rationale: 保留天文历程中反复出现的时间引介语，现代汉语自然简洁。
- source_word: ትነውኅ ዕለት እምሌሊት
  choice: 白昼比黑夜更长
  rationale: 将表示变长及比较关系的结构译为自然汉语，同时保留昼长超过夜长的观察性陈述。
- source_word: ዕፅበተ ሌሊት（据校勘；转写文本误作፱ዕበተ ሌሊት）
  choice: 白昼是黑夜的两倍
  rationale: 现有转写中的፱很可能是形近字ፅ的OCR误识；十二份与六份的下文也明确支持二比一，而非“九份”。
- source_word: ክፍለ ፲ወ፪
  choice: 十二份
  rationale: ክፍል指划分所得的份或部分；“份”准确反映本章的时间分段体系。
- source_word: ትኃጽር ሌሊት
  choice: 黑夜渐短
  rationale: 保留过程性意义，并与前文昼长的变化相呼应。
- source_word: ስድስተ ክፍል
  choice: 六份
  rationale: 直接呈现本章技术性的昼夜分份计量。
theological_decisions:
- issue: 是否把经文改写为现代天文学说明
  choice: 保留昼夜按“份”计算及其重复、程式化的表述
  alternative: 概括为“昼长为夜长两倍”而删去十二份和六份
  rationale: 这些分份数字属于《天文书》的结构性表达，不能因现代读者可由比例推算便省略。
- issue: 转写文本“九”与校勘读法“两倍”的冲突
  choice: 正文采用“两倍”
  alternative: 译作“白昼成为黑夜的九份”
  rationale: 字形误识的解释与同句十二份对六份的数学关系彼此印证；采用“两倍”能恢复较可信的原文，同时不引入教义性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“白昼／黑夜”比“白天／夜晚”略具经文与天文论述色彩，但普通读者仍易理解。以分号组织比例说明，保留原文层层并列的节奏而避免汉语过度重复。
