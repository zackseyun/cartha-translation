base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/011.yaml
  text: On that day they shall raise one voice[a], and they shall bless and praise and exalt in the spirit of faith, and in the spirit of wisdom, and in the spirit of patience, and in the spirit of mercy, and in the spirit of righteousness and peace, and in the spirit of goodness; and all of them shall say with one voice, ‘Blessed be he[e][d][c][b], and blessed be the name of the Lord of Spirits forever and ever.’
translation:
  language: zh_hans
  text: 那日，他们要同声[a]扬声，在信心[b]之灵、智慧之灵、忍耐之灵、怜悯之灵、公义与和平之灵，以及良善之灵[c]中称颂、赞美、尊崇；他们都要同声说：“他是当受称颂的；愿万灵之主的名永永远远受称颂。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两次使用字面意为“一个声音”的表达，指众者齐声发出颂赞。
    reason: 说明吉兹语习语及其重复。
  - marker: b
    text: “信心”也可译作“忠信”；此词既可指相信，也可指忠诚可靠。
    reason: 保留ሃይማኖት的词义宽度。
  - marker: c
    text: “良善”也可译作“仁厚”或“恩慈”。反复出现的“……之灵”可能表示颂赞时的心志、上天所赐的品格，或较具人格色彩的属天恩赋。
    reason: 说明ኂሩት的词义范围，并保留“灵”结构的神学开放性。
lexical_decisions:
- source_word: ይነሥኡ አሐደ ቃለ
  choice: 同声高呼
  rationale: 该短语直译为“举起一个声音”；在集体颂赞的语境中，“同声高呼”自然表达共同扬声，同时保留礼仪性的力量。
- source_word: ወይባርኩ ወይሴብሑ ወያሌዕሉ
  choice: 称颂、赞美、尊崇
  rationale: 保留三个并列动词的递进和累积效果，不将其合并为一个笼统的颂赞用语。
- source_word: በመንፈሰ ሃይማኖት
  choice: 在信心之灵中
  rationale: 保留反复出现的“在……之灵中”结构；ሃይማኖት可指信心或忠信，正文采用较常见的“信心”。
- source_word: በመንፈሰ ትዕግሥት
  choice: 在忍耐之灵中
  rationale: “忍耐”可涵盖耐心与坚忍，适合本节德目列表的庄重语体。
- source_word: በመንፈሰ ምሕረት
  choice: 在怜悯之灵中
  rationale: “怜悯”保持该词的道德与神学语域，也可包含慈悲之意。
- source_word: በመንፈሰ ጽድቅ ወሰላም
  choice: 在公义与和平之灵中
  rationale: 原文只在“灵”后列出相连的“公义与和平”，因此按同一结构处理，避免擅自拆成两个不同的灵。
- source_word: መንፈሰ ኂሩት
  choice: 良善之灵
  rationale: ኂሩት主要指良善、仁厚或慈善；“良善”最能保留其宽广语义，不缩窄为“慷慨”。
- source_word: ቡሩክ ወይትባረክ
  choice: 他是当受称颂的；愿……受称颂
  rationale: 前者是被动分词，后者是祈愿式；中文分别用陈述与祈愿表达其语法变化。原文首句未明说代词，中文补出“他”以衔接“万灵之主”。
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: 万灵之主的名
  rationale: “万灵之主”作为《以诺一书》中反复出现的称号，庄重而自然；“万”在此表达众灵总体，并非改写为数量概念。
- source_word: ለዓለም ወእስከ ለዓለም
  choice: 永永远远
  rationale: 这是现代汉语中自然、庄严的颂赞惯用语，也保留原文时间表达的重复力度。
theological_decisions:
- issue: 反复出现的“……之灵”究竟指什么
  choice: 正文透明地保留“……之灵”，并以“在……中”表达赞美的方式或领域
  alternative: 可理解为若干近乎人格化的天上之灵，或赐给敬拜者的属天禀赋
  rationale: 吉兹语结构本身允许多种理解；译文不把它们限定为人的心理状态，也不武断地人格化。
- issue: 首个称颂语的所指与语气
  choice: 译作“他是当受称颂的”，将其理解为指万灵之主，并保留与后一句祈愿语气的区别
  alternative: 可译作“愿他受称颂”，把整句统一处理为祝颂祈愿；也可将首个词视为独立感叹“当受称颂！”
  rationale: ቡሩክ是被动分词，而ይትባረክ带祈愿意味。原文没有明示首个主语，但下文“万灵之主的名”使其指向万灵之主最为顺畅；脚注提示补词。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“同声高呼”避免生硬直译“举起一个声音”；德目列表保留“……之灵”的重复节奏。末句以分号区分陈述式称颂与祈愿式称颂，同时不把潜在的神学含义解释进正文。
