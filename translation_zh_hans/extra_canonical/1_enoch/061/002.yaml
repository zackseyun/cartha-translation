base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/002.yaml
  text: And I asked the angel[a], saying, “Why have they taken these cords and gone?” And he said to me[c][b], “They have gone so that they may measure.”
translation:
  language: zh_hans
  text: 我问那位天使说：“他们为什么拿了这些绳索走了？”他对我说：“他们走了，是要去测量。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተስአልክዎ
  choice: 我问
  rationale: 第一人称完成式叙事动词，直接引出以诺向异象中的天使发问；“我问”自然简洁。
- source_word: ለመላእክ
  choice: 那位天使
  rationale: 此处为单数，指上下文中与以诺交谈的天上解释者；用“那位”体现特指而不过度增添身份说明。
- source_word: እንዘ እብሎ
  choice: 说
  rationale: 这是引出直接引语的结构；汉语以“我问……说”保留原文叙事衔接。
- source_word: ነሡ
  choice: 拿了
  rationale: 此词是“拿、取”的第三人称复数完成式，而不是“起来”；与上一节所给的绳索相呼应。
- source_word: እሎንቱ አኅበለ
  choice: 这些绳索
  rationale: 名词指复数的绳索，而非人群或队伍；“这些”体现指示成分并联系上文。
- source_word: ሖሩ
  choice: 走了
  rationale: 基本义为去、离去；原文在问句和回答中重复该词，译文也保留重复。
- source_word: ከመ ይመጥኑ
  choice: 是要去测量
  rationale: 目的从句中的动词是主动复数形式，即“他们测量”，并非“他们被测量”；“是要去”在现代汉语中自然表达目的。
theological_decisions:
- issue: 末尾目的从句的施事与含义
  choice: 他们走了，是要去测量
  alternative: 他们走了，为要量定／按量分配
  rationale: 吉兹语动词在此为主动式，主语仍是复数的“他们”，因此不译成“被测量”。同时保留“测量”的具体异象意象，不把对象或行动进一步解释为审判、分配等神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文问答中“走了”的重复，并依照吉兹语形态及61:1的语境，将相关词译为“拿了这些绳索”和主动的“去测量”。
