base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/001.yaml
  text: And I saw in those days that long cords were given to those angels[a], and they took for themselves wings and flew[b], and they went toward the north.
translation:
  language: zh_hans
  text: 在那些日子，我看见长绳[a]被交给了那些天使[b]；他们为自己取了翅膀，飞了，然后往北方去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长绳”也可译作“长索”；结合上下文，也可能特指“量绳”。
    reason: lexical_alternative
  - marker: b
    text: “那些天使”也可理解为“其他天使”，取决于如何理解这里的指示词。
    reason: alternative_reading
lexical_decisions:
- source_word: ወርኢኩ
  choice: 我看见
  rationale: 保留第一人称异象叙述的惯用表达，现代汉语自然明确。
- source_word: በእማንቱ መዋዕል
  choice: 在那些日子
  rationale: 保留启示文学中反复出现的庄重时间公式。
- source_word: ወተውህበ
  choice: 有人把……交给
  rationale: 原文为被动式；汉语改用不明示施事者的主动结构较自然，并保留施事者未明的含义。
- source_word: ለአልእቱ መላእክት
  choice: 给那些天使
  rationale: መላእክት在此语境通常指天使；አልእቱ可理解为“那些”或“其他的”，正文采用较少增添对比意味的“那些”。
- source_word: አሕባል ነዋኃን
  choice: 长绳
  rationale: 简洁保留绳索及其长度的具体意象，不在正文中擅自限定为测量用绳。
- source_word: ወነሡአ ሎሙ ክንፈ
  choice: 他们为自己取了翅膀
  rationale: 保留ሎሙ的反身意味，也忠实呈现原文颇为奇特的取翼图景。
- source_word: ወሰረሩ ወሖሩ ሰመንገለ መስዕ
  choice: 飞向北方
  rationale: 将连续的“飞了，并往北方去了”自然合并，同时保留方向性，不暗示已经抵达终点。
theological_decisions:
- issue: 天使的身份
  choice: 仅译作“那些天使”，不进一步界定其类别。
  alternative: “其他天使”，或解释为执行审判的某一类天使。
  rationale: 本节本身没有进一步说明其身份；正文不从上下文解释或特定神学体系中补入限定。
- issue: 天使取得翅膀的表述
  choice: 直译为“为自己取了翅膀”。
  alternative: 意译为“展开翅膀”或“获得了飞行能力”。
  rationale: 原文确有“取”及反身成分；保留这种不寻常的措辞，避免消解其异象性的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以分号划分交绳与天使行动两个层次；避免文言化表达，也不补入原文未说明的施事者、绳索用途或天使类别。
