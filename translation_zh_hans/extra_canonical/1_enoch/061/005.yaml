base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/005.yaml
  text: And these measures shall reveal all the hidden things in the depth of the earth[a], and those who were destroyed in the wilderness, and those who were devoured by wild beasts, and those who were devoured by the fish of the sea, so that they may return and be supported on the day of the Chosen One; for none shall perish before the Lord of Spirits[d][c][b], and none can perish.
translation:
  language: zh_hans
  text: 这些量度[a]将显露大地深处一切隐藏之物，以及那些在旷野中灭亡的人、被野兽吞吃的人和被海鱼吞吃的人，使他们得以归回，并在蒙拣选者[b]的日子得到扶持[c]；因为在万灵之主面前，没有一人会灭亡，也没有一人能够灭亡[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些量度”承接上文；原文名词也可理解为“这些测量”或“这些尺度”。
    reason: lexical_alternative
  - marker: b
    text: “蒙拣选者”是《以诺一书·比喻篇》中与末世审判和伸冤相关的一项称号。
    reason: cross_reference
  - marker: c
    text: “得到扶持”所译的原文动词含义较难确定，也可理解为“得到坚固”“被支撑”，或可能是“被聚集”。
    reason: lexical_alternative
  - marker: d
    text: 原文末句十分紧凑，直译近于“没有会灭亡的，也没有能够灭亡的”；这里保留其重复和绝对语气。
    reason: textual_difficulty
lexical_decisions:
- source_word: እሉ፡ እምጣን
  choice: 这些测量
  rationale: 保留原文明确出现的指示语和名词，并承接上文有关“测量”的异象；“测量”在现代汉语中比“尺度”更能兼顾测量行为或所得量度的含义。
- source_word: ይከሥቱ
  choice: 将显露
  rationale: 表达异象中的将来行动，也保留使隐秘事物显明的启示文学色彩。
- source_word: ኵሎ፡ ኅቡኣተ፡ ለዕመቀ፡ ምድር
  choice: 大地深处一切隐藏之物
  rationale: 以中性表达保留复数形式可能指隐藏之物或隐藏者的歧义；后续列举则自然转向死者。
- source_word: ተኃጕሉ፡ እምበድው
  choice: 在旷野中灭亡的人
  rationale: “旷野”符合经文语域；“灭亡”与本节末尾的同词根表达形成呼应。
- source_word: ተበልዑ፡ እምአራዊት
  choice: 被野兽吞吃的人
  rationale: 直接保留死亡方式及其强烈意象，不作弱化。
- source_word: ተበልዑ፡ እምዓሣ፡ ባሕር
  choice: 被海鱼吞吃的人
  rationale: 简洁保留原文“海中的鱼”这一累加式列举。
- source_word: ከመ፡ ይግብኡ
  choice: 使他们得以归回
  rationale: 保留目的或结果关系；“归回”可涵盖恢复与复归，而不把复活的具体方式写入正文。
- source_word: ይትመረጐዙ
  choice: 得到扶持
  rationale: 该动词在此处含义困难；“扶持”保留被支撑、被坚固的基本方向，同时不排除其他理解。
- source_word: በዕለተ፡ ኅሩይ
  choice: 在蒙拣选者的日子
  rationale: 将单数称号作为专称处理，保留《比喻篇》中这位末世人物的称号功能。
- source_word: እግዚአ፡ መናፍስት
  choice: 万灵之主
  rationale: 采用庄重而自然的中文称号；“万灵”表达诸灵总体，而不限定为某一类灵体。
- source_word: አልቦቱ፡ ዘይትኃጐል … ወአልቦ፡ ዘይክል፡ ተኃጕሎተ
  choice: 没有一人会灭亡，也没有一人能够灭亡
  rationale: 保留原文重复及后句所加强的“不可能”语气，不替文本消解其绝对性与神学张力。
theological_decisions:
- issue: 归回条款是否明确译作复活
  choice: 译作“使他们得以归回”
  alternative: 译作“使他们复活”或仅指遗骸被显露
  rationale: 旷野、野兽与海鱼的累积列举，加上末尾无人灭亡的宣告，强烈指向末世恢复；但原动词本身是“归回”，正文不宜把隐含意义直接替换成系统化术语“复活”。
- issue: ኅሩይ的称号处理
  choice: 蒙拣选者
  alternative: 被选者、选民、蒙拣选的一位
  rationale: 单数形式在本段具有专称作用；“蒙拣选者”既保留其称号性，也不额外导入后期教义身份认定。
- issue: 末句绝对性陈述
  choice: 保留“没有一人会灭亡，也没有一人能够灭亡”
  alternative: 限定为没有人在万灵之主面前最终失落
  rationale: 原文表述紧凑且绝对。正文保留重复与张力，不擅自限定其适用范围；脚注仅提示句法压缩。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。句式保留启示文学的累加列举和末尾重复，不以教义解释取代原文。称号“万灵之主”“蒙拣选者”保持全书局部术语的一致性；对含义困难的动词以正文较中性的“扶持”配合脚注呈现其他可能。
