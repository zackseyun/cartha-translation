base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/006.yaml
  text: And all those in the height of heaven received a command[a], and power, and a voice[c][b], and light like fire.
translation:
  language: zh_hans
  text: 所有在天上高处的，都领受了命令[a]、能力、声音和如火的光[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半在现存埃塞俄比亚文本见证中的句法较难确定。另一种理解是：“他们领受了命令——就是所有在天上至高处的——而能力和光的声音如火。”
    reason: textual_variant
  - marker: b
    text: “光”也可译作“明亮”或“光辉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡ
  choice: 领受了
  rationale: 该动词可指“拿取、接受、领受”；与“命令”及后续并列宾语搭配时，“领受”既自然，也保留庄重语体。
- source_word: ትእዛዘ
  choice: 命令
  rationale: 指有权威的指令；“命令”比“指示”更贴合启示文学的语气。
- source_word: እለ በ‘መልዕልተ ሰማይ ኵሎሙ
  choice: 天之高处的众者都
  rationale: 保留原文的空间意象和指称宽度，不把这些存在具体认定为某一类天使。
- source_word: ኃይለ
  choice: 能力
  rationale: 该名词表示力量、权能；此处作为“领受”的并列宾语，“能力”在现代汉语中自然且不过度具体化。
- source_word: ቃለ
  choice: 声音
  rationale: 该词可表示声音、话语或言辞；在与光和火相连的异象语境中，“声音”最直接，也保留原文张力。
- source_word: ብርሃነ
  choice: 光
  rationale: 可译为光、明亮或光辉；正文采用最简明的“光”，并在脚注说明可能的替代译法。
- source_word: ከመ እሳት
  choice: 如火的
  rationale: 直接保留原文的火之比喻，并按最新语法审校结果修饰最后一个并列宾语“光”。
theological_decisions:
- issue: 天之高处诸者的身份
  choice: 使用宽泛的“众者”，不具体命名
  alternative: 译作“天军”或某一特定天使阶层
  rationale: 原文没有指明守望者、圣者或其他特定阶层；宽泛表达避免引入后来的天使等级体系。
- issue: “能力、声音和光”的句法关系
  choice: 均作为“领受”的并列宾语
  alternative: 把“能力和光的声音如火”视为另起的述谓分句
  rationale: 这些名词的形态和连接方式支持其与“命令”共同作直接宾语；如此翻译也遵循最新的源文语法审校，同时以脚注保留旧有理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以简洁并列结构重现原文节奏；“天之高处”保留空间意象，“众者”刻意维持身份上的含混。所有脚注标记均已置于正文。
