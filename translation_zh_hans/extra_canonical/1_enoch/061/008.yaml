base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/008.yaml
  text: And the Lord of Spirits seated the Chosen One on the throne of glory[a], and he will judge all the works of the holy ones in the height of heaven[d][c][b], and he will weigh their deeds in the balance.
translation:
  language: zh_hans
  text: 万灵之主使那位被拣选者坐在荣耀的宝座上[a]；他将审判天之高处众圣者的一切作为[b]，并用天平衡量他们的行为[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被拣选者”也可译作“蒙拣选者”；原文在这里把它用作特定称号。
    reason: lexical_alternative
  - marker: b
    text: “众圣者”可能指圣洁的群体、天上的圣者，或有意兼指二者；原文没有要求作更狭窄的限定。
    reason: alternative_reading
  - marker: c
    text: 原文描绘用天平称量的司法意象；这里的动词是主动形式，即“他将衡量”。
    reason: grammar_and_cultural_note
lexical_decisions:
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 保留《以诺一书》中这一固定而庄严的神圣称号；“万灵”在现代汉语中比“诸灵”更自然，也不限定这些灵的类别。
- source_word: መንበረ ስብሐት
  choice: 荣耀的宝座
  rationale: 保留具体的登基意象，并与圣经传统中“荣耀”的用语相协调。
- source_word: አንበረ ለኅሩይ
  choice: 使那蒙拣选者坐在
  rationale: 明确表达使役意义，而“蒙拣选者”既自然又保留称号性质。
- source_word: ይኴንን
  choice: 他将审判
  rationale: 按未完成式在异象语境中的将来意义处理，并保留司法色彩。
- source_word: ኵሎ ግብሮሙ ለቅዱሳን
  choice: 众圣者的一切作为
  rationale: “众圣者”不擅自限定为人类圣徒或天上圣者；“作为”与后句的“行为”略作词汇区分。
- source_word: በመልዕልተ ሰማይ
  choice: 天之高处
  rationale: 保留原文高举的空间意象，避免过度具体化为“最高天”。
- source_word: በመዳልው ይደሉ ምግባሮሙ
  choice: 用天平衡量他们的行为
  rationale: 将ይደሉ按主动、第三人称阳性单数理解为“他将衡量”，并保留天平所表达的司法评量意象。
theological_decisions:
- issue: ቅዱሳን所指的群体
  choice: 译作“众圣者”，不指明是义人、天上圣者或两者兼有
  alternative: 圣徒；义人；圣天使
  rationale: 本节措辞本身没有要求作更狭窄的身份判断，因此保留其可能的涵盖范围。
- issue: ኅሩይ的称号性质
  choice: 译作“那蒙拣选者”
  alternative: 被选者；选民；一位蒙拣选的人
  rationale: 上下文中的登基与审判职分表明这是对某一特定人物的称号；“那”体现特指，却不进一步界定其神学身份。
- issue: 末句主动动词的主语
  choice: 以“他”延续前句主语，即蒙拣选者
  alternative: 译为被动句“他们的行为将被衡量”，或理解为万灵之主
  rationale: ይደሉ为第三人称阳性单数主动形式，最自然地承接紧邻的“他将审判”；译文保留这一语法连贯性，同时不作超出句法的教义发挥。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“使……坐在”保留原文使役意义；分号理清登基与随后审判、衡量之间的关系。所有注脚标记均置于相关主文之后。
