base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/013.yaml
  text: For abundant is the mercy of the Lord of Spirits[a], and he is slow to anger[c][b]; and all his works and all the measure of what he has made he has revealed to the righteous and the chosen in the name of the Lord of Spirits.
translation:
  language: zh_hans
  text: 因为万灵之主有丰盛的怜悯，并且不轻易发怒[a]；他已在万灵之主的名中，向义人和蒙拣选者启示了自己的一切作为，以及他所作一切的全部尺度[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他的忿怒遥远”。这里也可理解为他恒忍、迟延发怒，而不是说他绝不施行审判。
    reason: 保留原文的字面表达及其神学张力。
  - marker: b
    text: “他所作一切的全部尺度”原文含义不十分确定，也可能指他一切作为的范围、秩序或所定的分量。
    reason: 说明艰涩吉兹语短语的词义可能。
  - marker: c
    text: “在万灵之主的名中”也可能表达奉他的名、凭他的权柄，或在呼求他名的情境中。
    reason: 保留介词短语的多种可能功能。
lexical_decisions:
- source_word: ብዙኅ ምሕረቱ
  choice: 有丰盛的怜悯
  rationale: 既保留“多、丰盛”的数量意味，也以现代汉语中自然庄重的搭配表达神的慈悯。
- source_word: ለእግዚአ መናፍስት
  choice: 万灵之主
  rationale: 保留《以诺一书》中反复出现的神圣称号；“万灵”在汉语中比“诸灵”更自然，也表达众灵之主的含义。
- source_word: ወርሑቅ መዓት
  choice: 并且不轻易发怒
  rationale: 此短语字面涉及忿怒遥远，但在圣经传统中是描述神恒忍、不迅速发怒的固定表达；正文采用自然惯用语，脚注保留字面可能。
- source_word: ወኵሉ ግብሩ
  choice: 自己的一切作为
  rationale: “作为”可涵盖行动与创造活动，且比“工作”更庄重自然。
- source_word: ወኵሉ እምጣነ ገብረ
  choice: 他所造之物的全部尺度
  rationale: 原文艰涩，可能指神所造万物的尺度、范围或秩序；保留“尺度”以避免过度解释。
- source_word: ከሠተ
  choice: 启示
  rationale: 符合异象文学中将隐藏之事显明的语境。
- source_word: ለጻድቃን ወለኅሩያን
  choice: 给义人和蒙拣选的人
  rationale: “义人”保持义的术语一致性；“蒙拣选的人”表达被选择的群体而不额外引入教派含义。
- source_word: በስሙ
  choice: 在……的名里
  rationale: 较形式化地保存介词短语的多义性，不将其确定解释为凭权柄、借着名或呼求名。
theological_decisions:
- issue: “忿怒遥远”短语的意义
  choice: 正文译为“不轻易发怒”，表达神恒忍、迟延发怒的品格。
  alternative: “他的忿怒遥远”或“忿怒远离”。
  rationale: 这一表达与“丰盛的怜悯”构成传统搭配，但字面读法仍有依据，故以脚注保存，避免暗示神绝不施行审判。
- issue: “他所造之物的全部尺度”的所指
  choice: 保留尺度意象，不具体限定为数量、范围或受造秩序。
  alternative: “他所规定的一切”或“他一切受造物的总数”。
  rationale: 现存吉兹语措辞艰涩，证据不足以确定单一解释；透明直译更能保存原文张力。
- issue: “在万灵之主的名里”的功能
  choice: 保留原有介词表达，不在正文中判定其确切功能。
  alternative: “奉万灵之主的名”“凭万灵之主的权柄”或“借着万灵之主的名”。
  rationale: 原短语可能表达权柄、范围或呼求；明确选定其中一种会超出文本证据。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号区分神的品格与启示行动，并用破折号减轻末尾介词短语可能造成的修饰歧义。所有不确定处均在正文中保持克制，并由脚注说明。
