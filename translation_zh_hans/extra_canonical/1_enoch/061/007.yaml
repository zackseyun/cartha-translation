base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/007.yaml
  text: And to him belongs the first word[a]; they shall bless and exalt and praise with wisdom[c][b], and they shall be wise in speech and in the spirit of life.
translation:
  language: zh_hans
  text: 最初的话语属于他[a]；他们要以智慧祝福、尊崇并赞美[b]，也要在言语和生命之灵中显出智慧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“话语的开端属于他。”原文也可理解为“最先的发言”或“第一句话”。
    reason: lexical_alternative
  - marker: b
    text: 另一种较早的理解是：“他们要在他面前出声祝福，并要尊崇……”但这可能误解了本句的吉兹语句法。
    reason: previous_rendering
  - marker: c
    text: 或译：“也要在言语和生命的气息中行事明智。”本节只存吉兹语文本，句末措辞较难确定。
    reason: alternative_reading
lexical_decisions:
- source_word: ወለዉእቱ፡ መቅድመ፡ ቃለ
  choice: 最先的话属于他
  rationale: 按句法将 ወለዉእቱ 理解为“属于他”，并将 መቅድመ ቃለ 作为“最先的话／开头的话”这一整体，而不误解为“在他面前用声音”。中文采用自然的领属句，同时保留“话”可指言辞或发言的宽度。
- source_word: ይባርኩ፡ ወያሌዕሉ፡ ወይሴብሑ
  choice: 他们要……祝福、尊崇并赞美
  rationale: 保留三个并列的颂赞动词；“尊崇”比字面的“高举”更符合此处礼仪性语境，也不额外指定受词。
- source_word: በጥበብ
  choice: 以智慧
  rationale: 介词短语可表达方式；“以智慧”既保留名词“智慧”，又符合现代汉语，并可自然地统摄并列的颂赞动作。
- source_word: ይጠብቡ
  choice: 显出智慧
  rationale: 该动词与前面的“智慧”属同一词根语义场。“显出智慧”比生硬的“成为智慧”自然，也保留其行动或状态之间的开放性。
- source_word: በነገር
  choice: 在言语……上
  rationale: ነገር 可指话语、言论、事情；此处与“生命之灵”并列，译作“言语”较合语境，并与前面的 ቃለ 所译“话”适度区分。
- source_word: መንፈሰ፡ ሕይወት
  choice: 生命之灵
  rationale: 保留“灵／气息”的潜在双义及启示文学的庄重语域；不将其明确限定为生理性的呼吸或位格化的神灵。
theological_decisions:
- issue: መንፈሰ ሕይወት 应译作“生命之灵”还是“生命的气息”
  choice: 生命之灵
  alternative: 生命的气息
  rationale: 天上颂赞的语境容许属灵含义，但原词也可指气息。正文采用较符合庄重语境的“生命之灵”，脚注保留具体的“气息”读法，避免消除原文张力。
- issue: “最先的话属于他”是否表示他拥有发言优先权、话语的开端，或第一句话本身
  choice: 保留简洁的领属表达，不具体解释
  alternative: 话语的开端属于他／他有首先发言之权
  rationale: 原短语简练且可能具有多重理解；译文不把它扩充为明确的礼仪次序或抽象的神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。正文保留颂赞动词的并列节奏，并用“最先的话属于他”呈现原文突出的领属结构。脚注分别说明首句的词义范围、旧有异读及末句“灵／气息”和状态／行动方面的歧义。
