revisions:
- from: 蒙拣选的人必开始与蒙拣选的人同住[a]；这些就是要赐给信心[b]的量度[c]，他们也必坚固公义。
  to: 蒙拣选者必开始与蒙拣选者同住[a]；这些是为信心所赐的量度[c]，它们必坚固公义。
  rationale: 修订仅处理中文中会改变句法关系的表达：以“为信心所赐”避免将信心译成受事，以“它们”保留“这些量度”与末句复数动词之间可能的衔接。开头继续保留“开始＋同住”，并补强相应脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:53:13Z'
review_pass:
