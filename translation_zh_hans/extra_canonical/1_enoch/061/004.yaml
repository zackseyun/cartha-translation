base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/004.yaml
  text: And the chosen ones shall dwell with the chosen ones[a], and these are the measures that shall be given for faith[d][c][b], and they shall strengthen righteousness.
translation:
  language: zh_hans
  text: 蒙拣选者必开始与蒙拣选者同住[a]；这些是为信心所赐的量度[c]，它们必坚固公义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先说“开始”，再说“居住／同住”；也可较完整地译为“开始居住并同住”。
    reason: lexical_clarification
  - marker: c
    text: “量度”也可能指量定的份额、所分得的一份，或衡量的尺度；本句确切含义不明。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይዌጥኑ፡ ወየሐድሩ
  choice: 必开始……同住
  rationale: 将前一动词按“开始”理解，并与后一动词“居住、停留”连用，译出“开始同住”；这比把前一动词解释为“安息”更符合该动词的通常词义，也没有将其省略。
- source_word: ኅሩያን
  choice: 蒙拣选的人
  rationale: 保留启示文学中这一群体称号的意味，同时采用现代中文读者容易理解的表达。
- source_word: እሉ
  choice: 这些
  rationale: 该近指代词宜译作“这些”，不改为远指的“那些”。
- source_word: እምጣናት
  choice: 量度
  rationale: 原词可指计量所得的份额或衡量标准；“量度”保留其具体意象及语义开放性。
- source_word: ይትወሀቡ
  choice: 要赐给
  rationale: 以被动含义译出“被给予、被赐予”，并保持庄重的启示性语体。
- source_word: ለሃይማኖት
  choice: 给信心
  rationale: 原词可表示信心、忠信或坚贞；正文采用直接的“信心”，其他可能性收入脚注。
- source_word: ያፀንዕዋ
  choice: 必坚固
  rationale: 译出使之刚强、稳固或确立的主动含义。
- source_word: ለጽድቅ
  choice: 公义
  rationale: “公义”兼顾道德正直与审判语境中的正义，比单译“正义”涵盖面更广。
theological_decisions:
- issue: ሃይማኖት 在末世赏赐与审判语境中的含义
  choice: 信心
  alternative: 忠信；坚贞
  rationale: 该词语义较宽，正文保留最直接的译法，不把本节限定为某一种神学解释；语境所容许的忠诚与坚忍之意列入脚注。
- issue: 开头两个动词的关系
  choice: 开始同住
  alternative: 开始居住并停留；安居
  rationale: 把“开始”与“居住”视为起始动词加主要动词的结构，既保留两个词的作用，又避免把首个动词神学化为末世“安息”。
- issue: “量度”的具体所指
  choice: 保留“量度”这一开放表达
  alternative: 份额；尺度；标准
  rationale: 上下文不足以确定它指分配所得的份额还是规范性的标准，因此不在正文中消除这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“蒙拣选的人”保留启示文学称号感；分号呈现原句两个相连但关系略显含混的分句。正文保留“这些”和“量度”的突兀感，不擅自补出其指代对象。
