  source_fidelity: 开头的“必开始……同住”恰当地保留了 ይዌጥኑ（开始）与 የሐድሩ（居住／同住）的组合，也正确译出近指“这些”。但“要赐给信心”在现代汉语中容易把“信心”误解为接受者；末句“他们”则会自然回指“蒙拣选的人”，而原句在紧邻的“这些量度”之后保留了较难判定的复数主语关系。
  naturalness: “为信心所赐的量度”比“赐给信心的量度”自然，且保留“为信心”的目的／关联意义。以“它们”回指“量度”虽略显突兀，却符合原文此处的困难句法，避免将主语无根据地限定为蒙拣选者。
  terminology: “蒙拣选者”“信心”“量度”“公义”均保持庄重、现代的启示文学语体；关于“信心”可作“忠信、坚贞”及“量度”的开放含义，应保留脚注。
