base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/010.yaml
  text: And all the hosts of the heavens shall cry out[a], and all the holy ones above, and the host of the Lord—the Keruben, the Seraphen, and the Ophannin—and all the angels of power, and all the angels of principalities, and the Chosen One[d][c][b], and the other powers that are on the dry land and over the water.
translation:
  language: zh_hans
  text: 天上的一切众军、在高处的一切圣者，以及主的军队——基鲁本、苏拉芬和厄法宁[b]——，以及一切大能的天使、一切掌权的天使[c]、那位蒙拣选者[d]，并在干地上和水面之上的其他权能，都要呼喊[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“高声呼叫”。吉兹语动词表示发声呼叫或呼喊。
    reason: lexical_alternative
  - marker: b
    text: “基鲁本、苏拉芬、厄法宁”是按吉兹语形式音译的天界等次名称；“厄法宁”常与宝座异象中的“轮”相联系。
    reason: lexical_alternative
  - marker: c
    text: “掌权的天使”也可译作“统治阶层的天使”或“有权位的天使”；原词表示治理者、掌权者或统治等次。
    reason: lexical_alternative
  - marker: d
    text: “蒙拣选者”在《以诺一书》的《比喻篇》中用作一位末世人物的称号；也可译作“被选中的那一位”。
    reason: theological_ambiguity
lexical_decisions:
- source_word: ይጼውዑ
  choice: 都要呼喊
  rationale: 该动词表示发声呼叫或呼喊；“呼喊”直接保留其声音动作，也避免与下一节“扬声”的不同表达混同。
- source_word: ኵሉ ኃይለ ሰማያት
  choice: 天上的一切众军
  rationale: ኃይል 可指力量、军队或群体；在天界众类的清单中译作“众军”，既体现集体性，也保留军事色彩。
- source_word: ቅዱሳን በመልዕልተ
  choice: 在高处的一切圣者
  rationale: 所指是高天中的圣洁存在；“圣者”比“圣徒”更少带入后来的教会用语。
- source_word: ኃይለ እግዚአብሔር
  choice: 主的军队
  rationale: 上下文列举天界群体，因此按集合意义理解，而不将其化为抽象的“主的能力”。
- source_word: ኪሩቤን / ሱራፌን / እፋኒን
  choice: 基鲁本、苏拉芬和厄法宁
  rationale: 按吉兹语形式音译这些天界等次的名称，避免直接以源自其他语言传统的惯用形式取代本见证。
- source_word: መላእክተ ኃይል
  choice: 大能的天使
  rationale: 保留“能力／大能”与天使的组合，同时采用自然的现代汉语结构。
- source_word: መላእክተ አጋእዝት
  choice: 掌权的天使
  rationale: 该词涉及统治、治理或权位；“掌权”保留其权柄与等次含义，不将具体天使体系写死。
- source_word: ኅሩይ
  choice: 那位蒙拣选者
  rationale: 本书《比喻篇》中该词反复用作末世人物的称号；“那位”显示其单数、特指用法。
- source_word: ካእአ ኃይል
  choice: 其他权能
  rationale: 保留 ኃይል 在此处较宽泛且神秘的“力量／权能”意义，不擅自把它明确化为某一种天使。
- source_word: እለ ውስተ የብስ ወዲበ ማይ
  choice: 在旱地上和水面之上
  rationale: የብስ 特指与水相对的干地，故译“旱地”而非范围更广的“大地”；两个介词关系分别以“在……上”和“在……之上”表达。
theological_decisions:
- issue: ኅሩይ 是特定末世人物的称号，还是清单中的一般形容语
  choice: 那位蒙拣选者
  alternative: 一个蒙拣选的／蒙拣选者
  rationale: 《比喻篇》的局部用法支持把它视为单数称号；译文保留这一身份指向，但不进一步将其等同于后来的某一教义称谓。
- issue: 是否用后期传统中更常见的天使名称取代吉兹语形式
  choice: 按吉兹语形式音译为“基鲁本、苏拉芬和厄法宁”
  alternative: 基路伯、撒拉弗和俄法宁
  rationale: 原文是在正式列举天界等次；按吉兹语见证音译，可保留本书独特的启示文学质感，并避免以其他语言传统覆盖原文形式。
- issue: 最后的 ኃይል 是否明确指人格化的天使群体
  choice: 保留为“其他权能”
  alternative: 其他大能者／其他军队
  rationale: 原词可指力量、权能或群体，原文在此没有充分消除歧义；因此不将其明确人格化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。长串主语按汉语习惯置于谓语“都要呼喊”之前，以“以及、并”和破折号划分层次。天界名称按吉兹语见证音译；对“权能”和“蒙拣选者”等具有神学张力的词不作超出本节的解释性扩写。
