base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/012.yaml
  text: All who do not sleep in the heights of heaven shall bless him[a]; all the holy ones who are in heaven shall bless him, and all the chosen ones who dwell in the garden of life; and every spirit of light that is able to bless and glorify and exalt and sanctify your blessed name[d][c][b]; and all flesh shall exceedingly and with power praise and bless your name forever and ever.
translation:
  language: zh_hans
  text: 凡在天上高处不睡的，都要称颂他[a]；凡在天上的圣者，也都要称颂他；所有住在生命之园的蒙拣选者[b]，以及一切能称颂、荣耀、尊崇并尊你的受颂赞之名为圣的光明之灵，都要如此；凡有血肉的，都要大大地、以大能[c]赞美、称颂你的名，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不睡的”可能指恒常警醒、侍立的天上存在，并不只是说人保持警觉。这里原文是“称颂他”，后文则转为“你的名”；译文保留了这一人称转换。
    reason: cultural_note
  - marker: b
    text: “圣者”和“蒙拣选者”在这里的具体身份并未说明；可能涉及天使、义人，或异象中的不同天上群体。
    reason: theological_ambiguity
  - marker: c
    text: “大大地、以大能”所据的吉兹语短语在文本和句法上较难。另一种理解是：凡有血肉的都拥有丰盛或超越的力量。
    reason: textual_variant
lexical_decisions:
- source_word: ይባርክዎ / ትባርክ
  choice: 称颂他／称颂你的名
  rationale: 保留同一词根贯穿全节的礼仪性结构；“称颂”在现代汉语中兼具祝颂与赞美意味，也能自然用于上帝及其名。首两处严格保留第三人称宾语“他”，不与后文第二人称“你的名”调和。
- source_word: እለ ኢይነውሙ
  choice: 不睡的
  rationale: 贴近原文而不强化为“永不睡眠”；其所指可能是恒常侍立的天上存在，正文不进一步解释。
- source_word: በመልዕልተ ሰማይ
  choice: 在天之高处
  rationale: 保留空间性的高处意象，避免解释成一个技术性的“最高层天”。
- source_word: ቅዱሳን
  choice: 圣者
  rationale: 既可指天上的圣洁存在，也不限定为天使或得荣的人；避免“圣徒”可能带来的后期教会称谓色彩。
- source_word: ኅሩያን
  choice: 蒙拣选者
  rationale: 保留以诺传统中的关键称谓，同时不预先限定其具体身份。
- source_word: ገነት ሕይወት
  choice: 生命之园
  rationale: 直接保留园子的意象，不以带有较多后期传统色彩的“乐园”替代。
- source_word: መንፈሰ ብርሃን
  choice: 光明之灵
  rationale: 保留原文宇宙性和启示文学色彩，不缩窄其身份。
- source_word: ዘትክል
  choice: 能
  rationale: 简明表达能力或合宜性，不增添义务或资格方面的解释。
- source_word: ባርኮተ ወሰብሖተ ወአልዕሎተ ወቀድሶተ
  choice: 称颂、荣耀、尊崇并尊……为圣
  rationale: 保留四重动词序列及其颂赞节奏；最后一项用“尊……为圣”比“使……成圣”更适合神名语境。
- source_word: ለስምከ ቡሩክ
  choice: 你的圣名
  rationale: 这里的“圣”表达蒙福、当受称颂的神名。汉语“有福的名”不自然，“圣名”符合庄重颂赞语体；其与后面的“尊……为圣”虽有语义呼应，但对应不同原词。
- source_word: ኵሉ ሥጋ
  choice: 凡有血肉的
  rationale: 保留圣经式集合表达，同时较“所有肉体”自然，并不泛化为“所有受造物”。
- source_word: ፈድፋደ እምኃይል
  choice: 极力而有力地
  rationale: 按较可信的句法判断，将两个成分作为修饰后续动词的副词语，而非修饰“凡有血肉的”；同时以脚注提示该短语的文本和句法困难。
- source_word: ትሴብሕ
  choice: 赞美
  rationale: 与前面四重序列中的“荣耀”所对应的不同原词区分，并符合末句颂赞语境。
- source_word: ለዓለመ ዓለም
  choice: 直到永永远远
  rationale: 采用自然而庄重的汉语圣经惯用表达，保留原文强化的永久意义。
theological_decisions:
- issue: “圣者”与“蒙拣选者”的身份
  choice: 直译两个类别，不断定他们是天使、得荣的人类，还是混合的天上群体。
  alternative: 将“圣者”明确译作天使，将“蒙拣选者”明确译作蒙救赎的人。
  rationale: 异象中的颂赞名单没有强制给出严格的本体分类；保留类别本身可避免导入特定教义体系。
- issue: 前半节的“他”与后半节的“你的”之间的人称转换
  choice: 原样保留第三人称转第二人称的转换。
  alternative: 统一译为“你”或统一译为“他”。
  rationale: 吉兹语首两处动词带第三人称阳性单数宾语后缀，后文明确转为第二人称“你的名”；不应为了汉语顺畅而消除这一真实张力。
- issue: “生命之园”的传统对应
  choice: 译为“生命之园”。
  alternative: 译为“生命乐园”或“生命的天堂”。
  rationale: 原文以园子为核心意象；保留该意象可避免不必要地导入后期天堂术语。
- issue: 末句力量短语的归属
  choice: 理解为修饰“赞美、称颂”的方式。
  alternative: 理解为描述“凡有血肉的”拥有超越限量的力量。
  rationale: 较佳句法分析支持副词性理解，但见证文本本身困难，因此正文采用此读法并在脚注保留替代可能。
translation_notes:
  register: 采用现代、庄重而可朗读的颂赞语体。保留长句的礼仪性铺陈，但用分号和顿号理清群体列表与四重动词序列。正文保留原文从“他”转向“你的名”的突变，不作神学性调和。所有脚注标记均已置于正文相应位置。
