base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/009.yaml
  text: And when he lifts up his face to judge their hidden ways by the word of the name of the Lord of Spirits[a], and their conduct by the path of righteousness of the Lord of Spirits, then all of them will speak with one voice[d][c][b], and they will bless and praise and exalt and sanctify the name of the Lord of Spirits.
translation:
  language: zh_hans
  text: 当他抬起脸来，凭万灵之主名号的话[a]审判他们隐秘的道路，并按万灵之主公义的道路审察他们的行迹[b]时，他们就都要同声说话，称颂、赞美、尊崇万灵之主的名，并尊其为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭万灵之主名号的话”原文结构艰涩，也可理解为凭与其名号相连的宣告、命令或权威。
    reason: alternative_reading
  - marker: b
    text: “行迹”也可译作“脚步”或“踪迹”，指他们生活中的行为轨迹。此处原文是名词短语，并非“他把他们安置在公义的道路上”。
    reason: lexical_and_textual_clarification
lexical_decisions:
- source_word: ያሌዕል ገጾ
  choice: 他仰起脸来
  rationale: 保留原文具体的身体意象及其庄严感，不弱化为泛泛的“显现”或“观看”。
- source_word: ይኰንን
  choice: 审判／审察
  rationale: 此处具有司法性的末世语境；中文在两个并列宾语前分别用“审判”和“审察”，既保持同一动词的统摄关系，又使句意自然。
- source_word: ፍኖቶሙ እንተ ኅቡእ
  choice: 他们隐秘的道路
  rationale: “道路”保留人生行径的隐喻，“隐秘”表达这些行径虽被隐藏，仍要受审判。
- source_word: በነገረ ስሙ
  choice: 凭……名号的话
  rationale: 尽量贴近“名号之话”这一艰涩结构，并以“凭”表达其工具或权威作用；具体所指保留在脚注中。
- source_word: ወአሰረ ዚአሆሙ
  choice: 他们的脚踪
  rationale: 按名词短语理解为“他们的脚步、踪迹”，与前面的“他们隐秘的道路”构成并列审判对象，不误解为“他安置他们”。
- source_word: በፍኖተ ጽድቅ
  choice: 按……公义的道路
  rationale: 保留原文反复出现的道路意象，也保留“公义”的伦理和审判色彩。
- source_word: በ፩ቃል
  choice: 同声
  rationale: 直义为“以一个声音／一句话”；“同声”自然地表达一致的宣告。
- source_word: ይባርኩ ወይሴብሑ ወያሌዕሉ ወይቄድሱ
  choice: 称颂、赞美、尊崇……并尊其为圣
  rationale: 保留四重赞颂动词，不作压缩；末项用“尊其为圣”避免中文中“使神成圣”的误解，同时保留礼仪性力量。
- source_word: እግዚአ መናፍስት
  choice: 万灵之主
  rationale: 采用庄重、简洁且适合中文的固定称号，表达“众灵的主”，并便于《以诺一书》全书统一。
theological_decisions:
- issue: 单数动词“他仰起脸来”的主语身份
  choice: 正文仅用“他”，不指明身份
  alternative: 明确译为万灵之主、蒙拣选者或人子
  rationale: 本节吉兹文使用单数动词，却未在本节重新明说主语；不应以教义判断补足身份。
- issue: “万灵之主名号的话”的效力
  choice: 用“凭”表达与神圣名号相关的话语或权威
  alternative: 明确译成奉其名发出的命令，或关于其名的启示
  rationale: 原文结构艰涩，可涵盖话语、宣告、命令或名号所代表的权威；正文保持透明，脚注说明歧义。
- issue: ወአሰረ ዚአሆሙ 的句法
  choice: 作为“他们的脚踪”与“他们隐秘的道路”并列，均受“审判”统摄
  alternative: 理解为动词“他把他们安置在公义的道路上”
  rationale: 该词组更合理地分析为名词“脚步／踪迹”加所属表达，而不是带宾语代词的动词；如此也形成较自然的平行结构。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。保留“仰起脸”“道路”“脚踪”等启示文学意象；四重赞颂用并列结构呈现。神名统一译作“万灵之主”。
