base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/003.yaml
  text: And the angel who went with me said to me[a], “These are the measures of the righteous and the cords of the righteous; they will come to the righteous[d][c][b], so that they may rely on the name of the Lord of Spirits forever and ever.”
translation:
  language: zh_hans
  text: 那与我同行的天使对我说：“这些是义人的量度和义人的绳索；它们必临到义人，使他们可以永永远远倚靠万灵之主的名。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “量度”也可理解为“尺度”；“绳索”也可译作“绳”或“带”。“倚靠”还可含有“靠着得支持”或“信赖”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ዘምስሌየ የሐውር
  choice: 与我同行的
  rationale: 关系结构加“行走、前往”动词构成以诺传统中引导天使的常见表达；“同行”自然且保留动态含义。
- source_word: እሉ እሙንቱ
  choice: 这些是
  rationale: 指向异象中刚出现的事物，并明确表达天使的辨认。
- source_word: እምጣነ ጻድቃን
  choice: 义人的量度
  rationale: 按形态将 እምጣነ 识别为“量度”的复数构造形式，而不是介词“从”加名词；也与前文测量的场景相连。汉语以集合意义的“量度”保留数的非一一对应。
- source_word: ማእሰረ ጻድቃን
  choice: 义人的绳索
  rationale: 该词意为绳、索或带，与本章前文的测量绳意象相应；不译作“仓库”。
- source_word: ይመጽኡ ለጻድቃን
  choice: 它们必临到义人
  rationale: 动词为未完成式，可表将来或惯常发生；此处用“必临到”表达异象中的将来指向，同时保留与格“到义人那里”。
- source_word: ከመ ይትመረጐዙ
  choice: 使他们可以……倚靠
  rationale: 该动词具有倚、靠、得支持或信赖的语义范围；“倚靠”既保留支撑意象，也自然表达对神名的依赖。
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: 万灵之主的名
  rationale: 以“万灵之主”作为书中反复出现的庄严称号；“万灵”在现代汉语中比“诸灵”更像固定称号。
- source_word: ለዓለመ ዓለም
  choice: 永永远远
  rationale: 以庄重而通行的汉语表达该强化的永恒惯用语。
theological_decisions:
- issue: 量度与绳索同义人的关系
  choice: 保留“义人的量度和义人的绳索”这一所属结构，并译作“临到义人”
  alternative: 可将属格理解为这些量具源于、属于或为义人预备，也可将动词译为一般现在时“临到”
  rationale: 原文重复“义人的”，随后又以与格表达“到义人”；不把这种张力改写成明确的来源、所有权或供应关系。
- issue: 倚靠的对象与含义
  choice: 译为“倚靠万灵之主的名”
  alternative: 可译为“靠……得支持”或“信赖……”
  rationale: 原动词兼有倚靠、受支持和信赖的意味；正文采用能涵盖身体支撑与信仰依赖的“倚靠”，脚注说明其他可能。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。保留异象语言中“量度—绳索—倚靠”的具体意象，并避免把原文含混的所属关系解释成特定神学体系。
