base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/002.yaml
  text: And Enoch said[a], “Concerning the children of righteousness, and concerning the chosen of the world, and concerning the plant of uprightness, I will speak to you and make known to you, my children—I, Enoch—what was shown to me from a vision of heaven, and what I learned from the words of the holy angels[e][d][c][b], and understood from the tablets of heaven.”
translation:
  language: zh_hans
  text: 以诺说：“关于义之子、世上蒙拣选者[a]和正直之苗[b]，我必把这些事告诉你们，使你们知晓。我的孩子们；我，以诺，要告诉你们那些从天上的异象[c]向我显明、我从圣天使的话[d]得知、又从天上的版册[e]领悟的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世上蒙拣选者”也可译作“这世代中蒙拣选的人”；原词既可指“世界”，也可指“世代”或“世界秩序”。
    reason: lexical_alternative
  - marker: b
    text: “正直之苗”也可译作“正直的栽种”或“正直的植株”。原文保留了植物意象。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“从天上的异象”；这里的“从”表明异象是启示的来源。也可理解为“从一个关于天的异象”。
    reason: source_syntax
  - marker: d
    text: “话”所译的原词是单数构造形式，也可译作“声音”或“所说的话”。
    reason: lexical_alternative
  - marker: e
    text: “天上的版册”是《以诺一书》中常见的天上记录意象；原短语也可较宽泛地理解为“天上的书写”或“天上的书卷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ፡ ጽድቅ
  choice: 义之子
  rationale: 保留原文的亲属隐喻和属格结构，不笼统改写为“义人”；“子”兼具庄重和启示文学色彩。
- source_word: ኅሩያነ፡ ዓለም
  choice: 世上蒙拣选的人
  rationale: 自然呈现“蒙拣选者”与“世界／世代”的关系，同时不采用容易带入后期教义体系的专门术语；“世界／世代”的歧义留在脚注。
- source_word: ተክለ፡ ርትዕ
  choice: 正直之苗
  rationale: 保留植物意象，并以“苗”表达生长中的植株；不把这一称谓抽象化为一般的正直之人。
- source_word: እሎንተ፡ እብለክሙ፡ ወአየድዐክሙ
  choice: 关于这些，我要告诉你们，使你们明白
  rationale: “关于这些”承接前列的三个称谓；后两个动词分别表达讲说和使人知晓。
- source_word: ደቂቅየ
  choice: 我的孩子们
  rationale: 用现代汉语自然的呼语保留亲属称谓，不把听众限定为男性。
- source_word: በዘ፡ አስተርአየኒ፡ እምራእየ፡ ሰማይ
  choice: 我要讲的是由天上的异象向我显明的
  rationale: “由”明确把异象表为启示的来源，对应እም“从／由”，而不是误译成仅仅处于异象之中；句式也承接前文“我要告诉你们”。
- source_word: እምቃለ፡ ቅዱሳን፡ መላእክት፡ አእመርኩ
  choice: 我从圣天使的话语得知
  rationale: “话语”在汉语中不强制标明单复数，既贴近单数构造形式ቃለ，也能自然表示众天使传达的信息。
- source_word: እምነ፡ ጸፍጸፈ፡ ሰማይ፡ ለበውኩ
  choice: 又从天上的版册领悟
  rationale: “版册”保留启示文学中天上记录载体的具体意象，同时可涵盖版、册、书写记录等语义范围。
theological_decisions:
- issue: 三个称谓所指群体之间的关系
  choice: 并列保留“义之子”“世上蒙拣选的人”“正直之苗”三个称谓
  alternative: 把三者合并为同一群“义人”，或断定它们是三个不同群体
  rationale: 原文并列这些启示文学称谓，却没有说明它们完全同义还是分别有所指；译文不替原文消除这种张力。
- issue: ኅሩያነ፡ ዓለም中ዓለም的范围
  choice: 正文采用“世上蒙拣选的人”
  alternative: “这世代中蒙拣选的人”或“永世所拣选的人”
  rationale: ዓለም可指世界、世代或世界秩序；正文采用直观读法，脚注保留“世代”的可能，不引入预定论等后期教义限定。
- issue: 启示知识的媒介
  choice: 保留异象、圣天使的话语和天上版册三个来源
  alternative: 把三者融为一个笼统的神圣启示来源
  rationale: 原文以重复的“从／由”构成平行结构，强调不同的启示媒介；译文维持这一层次。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“论到”“义之子”“正直之苗”维持启示文学的凝练语体；“告诉你们，使你们明白”则避免过度古雅。破折性自称改用分号衔接，使长句在普通现代读者看来清楚，同时保留以诺强调自身见证身份的语气。
