  naturalness: “我的孩子们，我就是以诺”在现代汉语中略显突兀；“我，以诺”更贴近原文的插入式自称。“把这些事告诉你们，使你们知晓”自然地表达了“讲说／使知晓”的并列动词；后半句改为并列的定语结构，可清楚表达以诺所传达之事的三个来源。
  terminology: “义之子”“正直之苗”适合本段庄重的启示文学语域，并保留属格和植物意象。“世上蒙拣选的人”可保留，但“蒙拣选者”较凝练。保留“天上的版册”，并以脚注说明其可泛指天上的书写或书卷，避免将载体性质解释得过窄。
