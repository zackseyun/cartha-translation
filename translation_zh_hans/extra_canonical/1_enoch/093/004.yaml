base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/004.yaml
  text: And after me[a], in the second week, great evil shall arise, and deceit shall spring up in it. And in it there shall be the first end, and in it a man shall be saved; and after it has been completed, unrighteousness shall grow[d][c][b], and a law shall be made for the sinners.
translation:
  language: zh_hans
  text: 我以后，在第二周[a]，大恶将要兴起，诡诈也要在其中滋长。其中将有第一个终局，也有一人将蒙拯救[b]；这一周结束以后，不义将要增多，并有一项法令为罪人制定[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “周”在这里属于以诺历史启示中的象征性时期，并不一定指普通的七天。
    reason: cultural_note
  - marker: b
    text: 原文是单数“一人”。许多读者认为这是暗指挪亚，但本节并未点名。
    reason: cross_reference
  - marker: c
    text: “法令”也可译作“规条”或“规则”；“为罪人”也可能含有“关于罪人”甚至“针对罪人”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ይቀውም
  choice: 将要兴起
  rationale: 该动词基本义为“站立、兴起、出现”；在历史时期展开的语境中，“兴起”自然地表达恶的出现。
- source_word: እምድኅሬየ
  choice: 我以后
  rationale: 采用时间意义，指以诺之后，符合“七期启示”的历史次序。
- source_word: በካልእት ሰንበት
  choice: 在第二个“七期”
  rationale: 这里的“周”是历史启示中的象征性分期；译作“七期”既保留七重结构，也避免现代读者误解为普通七天。
- source_word: ዐቢይ እኩይ
  choice: 大恶
  rationale: 保留原文简峻的道德判断和末世性语气。
- source_word: ትሕሱት በቀለት
  choice: 诡诈也要在其中滋长
  rationale: “诡诈”涵盖欺骗、虚假之意；动词带有萌生、生长的意象，因此译为“滋长”。
- source_word: ቀዳሚት ፍጻሜ
  choice: 第一次终结
  rationale: 直译其顺序性和终结意味，不把它解释为特定事件。
- source_word: ይድኅን ብእሲ
  choice: 有一人将蒙拯救
  rationale: 保留阳性单数“一个人”，同时不在正文中指明其身份。
- source_word: ተፈጸመ
  choice: 这一期结束
  rationale: 依上下文明确所指为第二个象征时期；“结束”自然表达完成之意。
- source_word: ትእህቱ ዓመፃ
  choice: 不义将要增多
  rationale: 该处文本传承和转录存在困难；采用较宽泛的道德用语，不武断限定为暴力或叛逆。
- source_word: ሥርዐት
  choice: 一项法令
  rationale: 该词可指秩序、规则或律法；“法令”在“制定”的搭配中自然，并保留规范性含义。
- source_word: ይትገበር ለኃጥኣን
  choice: 为罪人制定
  rationale: 保持被动和介词关系，不擅自将含义收窄为“惩罚罪人”或“针对罪人”。
theological_decisions:
- issue: 蒙拯救者的身份
  choice: 正文保留“一人”，不点名
  alternative: 明确译作挪亚，或泛化为人类
  rationale: 原文是单数，却没有在本节指名；上下文虽可能使读者联想到挪亚，译文不应代替原文作出认定。
- issue: 为罪人制定法令的含义
  choice: 保留“为罪人制定”的开放措辞
  alternative: 译为“制定针对罪人的法令”或“为罪人指定审判”
  rationale: 原文可表达关于、给予或针对罪人的规范；正文保留关系上的歧义，并在脚注说明。
- issue: “第一次终结”的所指
  choice: 保留抽象的时期标记
  alternative: 将其具体解释为洪水或第一次审判
  rationale: 本节本身没有直接命名事件，故不把可能的历史对应写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“七期”以引号标示其象征性专门含义；整体保留原文的重复时间结构和启示文学张力，同时避免生硬逐词对应。
