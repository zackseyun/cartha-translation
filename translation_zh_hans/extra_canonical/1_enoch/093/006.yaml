base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/006.yaml
  text: And after this[a], in the fourth week, at its completion, visions of the holy and righteous shall be seen[c][b], and a law for generation after generation and an enclosure shall be made for them.
translation:
  language: zh_hans
  text: 此后，第四周结束时，关于圣洁者和义人的异象必显现[a]；并且，必为他们设立一项世世代代的律法和一处围地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “关于圣洁者和义人”也可按原文较宽泛地译作“圣洁者和义人的”；在启示文学语境中，其确切所指仍有一定开放性。“必显现”也可译作“必被看见”。
    reason: lexical_alternative
  - marker: b
    text: “律法”原词也可指“秩序”“规条”或“典章”。“围地”所据原词含义较难确定，也可能使人想到栽种之地、园子或为他们预备之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: 此后
  rationale: 作为时间承接语，引入异象中下一个阶段；简洁保留先后次序。
- source_word: ራብዕት ሰንበት
  choice: 第四周
  rationale: 在“周之启示”的编号结构中指象征性的周或七期，而非一个安息日。
- source_word: በተፍጻሜታ
  choice: 结束时
  rationale: 后缀回指第四周；现代汉语中自然表达该阶段达到终点。
- source_word: ራእያተ
  choice: 异象
  rationale: 符合启示文学语境，也保留视觉性启示的含义。
- source_word: ቅዱሳን ወጻድቃን
  choice: 圣洁者和义人
  rationale: 按实词化复数形容词处理，保留两类称谓，又避免“圣徒”可能带入的后期教会含义。
- source_word: ይትረአይ
  choice: 必显现
  rationale: 该形式可有“被看见”或“显现”之意；“显现”在汉语中兼容异象被看见与变得可见的语义。
- source_word: ሥርዐት
  choice: 律法
  rationale: 该词可指秩序、规条或律法；本节与相关段落的平行及第四周的历史语境支持“律法”，但其较宽泛的可能性在注释中保留。
- source_word: ለትውልደ ትውልድ
  choice: 为世世代代所立的
  rationale: 保留重复名词所表达的跨世代延续，并自然修饰“律法”。
- source_word: ዐጸድ
  choice: 一处围地
  rationale: 这是一个疑难名词，可能涉及围起、栽种或园圃的意象；“围地”保持具体形象而不作过度确定。
- source_word: ይትገበር ሎሙ
  choice: 也必为他们设立
  rationale: 以一个被动谓语统摄并列的“律法”和“围地”，符合原文句法，且“设立”能同时适用于二者。
theological_decisions:
- issue: “圣洁者和义人”的身份
  choice: 正文用宽泛的人群称谓，不明确限定为天使或人类
  alternative: 专指忠信的人；或指天上的圣者；或兼指天使与义人
  rationale: 启示文学语境容许一定开放性；“义人”使人类所指较为可能，但原文不宜被译文彻底限定。
- issue: ሥርዐት 的含义
  choice: 译作“律法”
  alternative: 秩序；规条；典章
  rationale: 第四周的历史框架和上下文平行支持“律法”；同时以脚注说明该词也可有较宽的制度或秩序含义。
- issue: 末尾单数动词的管辖范围
  choice: 让“必为他们设立”同时管辖“律法”和“围地”
  alternative: 分别补出两个谓语
  rationale: 原文只有一个谓语；保持共同管辖可避免无根据地重复动词，并保留紧密的并列结构。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“周”“异象”“律法”等保留启示文学及历史分期色彩；避免古奥虚词和宗派化术语。标点将异象显现与随后为他们设立之物分开，同时保留原文并列关系。
