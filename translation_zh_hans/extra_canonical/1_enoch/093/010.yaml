base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/010.yaml
  text: And at its completion the chosen righteous ones will be selected from the eternal plant of righteousness[c][b][a], and to them will be given the sevenfold instruction concerning all his creation.
translation:
  language: zh_hans
  text: 在其结束时，蒙拣选的义人将从永恒的公义之苗[b]中被选出；他们将获赐有关他所创造的一切的七重教导[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “七重教导”也可译作“七项教导”或“七类教导”。这里的吉兹语短语较难确定，数字可能表示一个完整的七重教导体系。
    reason: lexical_alternative
  - marker: b
    text: “永恒的公义之苗”也可理解为“公义的永恒栽植”或“永恒公义之苗”。译文保留了原文的植物意象。
    reason: textual_ambiguity
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: 到那时期结束时
  rationale: 该介词短语标示前述时期或“一周”的终点；补出“时期”使现代汉语自然，同时不把所指过度限定为某一特定阶段。
- source_word: ይትኃረዩ
  choice: 将……被选出
  rationale: 该形式表达被拣选、被分别出来。由于后接“蒙拣选的”，用“被选出”保留拣选主题而避免完全重复。
- source_word: ኅሩያን ጻድቃን
  choice: 蒙拣选的义人
  rationale: 同时保留“蒙拣选”与“义”两个要素，不把二者合并为单一的道德或教义概念。
- source_word: እምተክለ ጽድቅ ዘለዓለም
  choice: 从永恒的公义之苗中
  rationale: 保留原文具体的植物意象。“苗”在现代汉语中比直译“植物”更能自然表达生长中的栽植意象；修饰关系按“永恒的公义之苗”处理，但语法另有可能，列入脚注。
- source_word: እለ ይትወሀብ ሎሙ
  choice: 他们将领受
  rationale: 原文关系成分与“给他们”紧密连接，指向刚被选出的义人。汉语改用分号后的代词承接，既清楚又庄重；语义仍为所赐予他们。
- source_word: ሰብዓቱ መክዕቢተ ትምህርት
  choice: 七重教导
  rationale: 该短语在词义与结构上均有困难。“七重教导”表达一个具有七重完整性的教导整体，同时将“七项教导”等可能性保留在脚注。
- source_word: በኵሉ ፍጥረት ዚአሁ
  choice: 关于他一切创造的
  rationale: 将介词短语理解为教导的范围或内容。“创造”保留集合意义；“他”照原文保留，不擅自明确其所指。
theological_decisions:
- issue: 审判与复兴语境中的拣选用语
  choice: 蒙拣选的义人
  alternative: 被拣选的义者／义人中的选民
  rationale: 原文并列呈现蒙拣选与公义身份。译文保留两者之间的张力，不将其化约为纯粹道德资格，也不引入后世预定论争的专门术语。
- issue: 义人来源的植物意象
  choice: 永恒的公义之苗
  alternative: 公义的永恒栽植／永恒公义之苗
  rationale: 原文使用生长、栽植的启示文学意象，故不抽象化为“群体”“根基”等词。属格修饰关系存在一定歧义，另以脚注说明。
- issue: “他的一切创造”中代词的指向
  choice: 保留“他”
  alternative: 明确译为“上帝”或“那一位”
  rationale: 原文使用阳性单数所有代词。译文不在本节内部擅自补明先行词，以保存原有指涉方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“蒙拣选的义人”“公义之苗”“七重教导”保留启示文学的凝练感与关键意象；以分号连接后半句，使关系清楚，又避免生硬照搬吉兹语关系结构。
