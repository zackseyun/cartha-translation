base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/005.yaml
  text: And after this[a], in the third week, at its completion, a man shall be chosen as the plant of righteous judgment[c][b], and after him there shall come forth the plant of righteousness forever and ever.
translation:
  language: zh_hans
  text: 此后，在第三周结束时[a]，一个人[b]将被拣选，作为公义审判的植株[c]；在他之后，公义的植株必兴起，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“第三周”属于“诸周启示”中一连串象征性的时期，并非普通的七天一周。
    reason: cultural_note
  - marker: b
    text: 原文没有说明这个被拣选的人是谁。有人把他与某位著名的义人先祖或领袖联系起来，但本节没有给他具名。
    reason: alternative_reading
  - marker: c
    text: 原文反复使用“植株”的植物意象；它可能让人联想到义人的世系、成长或长存的群体，但译文保留这一意象，不限定其所指。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት ሰንበት
  choice: 第三周
  rationale: 在“诸周启示”的上下文中，此语指一连串象征性的七期之一，而不是普通的一周；正文保留“周”的结构意象，脚注加以说明。
- source_word: በተፍጻሜታ
  choice: 结束时
  rationale: 词尾所指为前述“第三周”；“结束时”自然、明确地标示这一象征时期的终点。
- source_word: ይትኃረይ
  choice: 将被拣选
  rationale: 保留原文的被动意义和“选择”的词义核心，不用“任命”，以免额外引入职分含义。
- source_word: ብእሲ
  choice: 一个人
  rationale: 保留单数人物及其未具名状态，不推定其具体身份。
- source_word: ለተክለ
  choice: 作……的栽植
  rationale: 原词具有植物、栽种或所栽之物的意象；“栽植”虽带启示文学的陌生感，却能避免过早限定为苗裔、后代或群体。
- source_word: ኵነኔ ጽድቅ
  choice: 公义审判
  rationale: 同时保留司法性的“审判”与道德性的“公义”，不将二者压缩为泛指的“公正”。
- source_word: ይወፅእ
  choice: 必兴起
  rationale: 原义为出来、出现；在植物意象中，“兴起”既自然表达出现，也不额外限定为发芽或生长。
- source_word: ለተክለ ጽድቅ
  choice: 公义的栽植
  rationale: 保留原文反复出现的植物意象及属格关系，不解释为苗裔、根、后代或社群。
- source_word: ለዓለመ ዓለም
  choice: 直到永永远远
  rationale: 以现代汉语中庄重而通行的表达传达原文重复“世代/永世”所强调的永久性。
theological_decisions:
- issue: 第三周结束时被拣选之人的身份
  choice: 正文仅译作“一个人”，不指明姓名。
  alternative: 以以诺、挪亚、亚伯拉罕或某位代表性的义人为此人。
  rationale: 原文本身没有给出姓名；保持未定状态，避免把解释传统写入正文。
- issue: “栽植”意象所指为何
  choice: 两处均保留植物性的“栽植”意象。
  alternative: 译为苗裔、根、后代、义人群体或某个具体人物。
  rationale: 原文明确反复使用植物意象；直译其意象可保留它可能指个人、世系、成长过程或持久群体的张力。
- issue: “直到永永远远”与末句的关系
  choice: 让永久性修饰整项“公义的栽植必兴起”的宣告。
  alternative: 明确解释为该栽植一经兴起便永远存留，或解释为它不断兴起。
  rationale: 原文语序没有细分“永远”究竟强调兴起还是存续；中文正文不额外解决这一范围歧义。
translation_notes:
  register: 采用现代、庄重、可诵读的简体中文。“公义审判的栽植”有意保留原文启示文学中浓缩而略显陌生的意象；标点将两个连续阶段清楚分开，同时不消除末句范围上的含混。
