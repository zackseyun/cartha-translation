base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/012.yaml
  text: And who is there that can behold heaven? And who is there that can understand the works of heaven? Or see a soul—or[a], if not[e][d][c][b], a spirit—and tell of it? Or else ascend and see all their ends?
translation:
  language: zh_hans
  text: 谁能观看天？谁能明白天上的作为？谁又能看见魂——或者，不然，是灵[a]——并把它述说出来？又有谁能升上去，看见它们一切的边际[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看见魂——或者，不然，是灵”这一句在语义和句法上都很难确定。原文分别使用“魂”和“灵”两个词；这里保留其突兀的措辞，不把二者合并或解释成某一种固定的人论体系。“灵”也可理解为“气息”。
    reason: textual_and_semantic_difficulty
  - marker: b
    text: 末尾一词的字面意义与“翼”有关，也可能引申为边缘、极处或尽头。因此“它们一切的边际”也可译作“它们所有的尽头”或较直译的“它们所有的翼”。代词“它们”具体指什么也不完全明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: ምነት / መኑ
  choice: 谁／谁又
  rationale: 按连续反问理解，使用现代汉语自然的“谁能……”句式，保留挑战性的语气。
- source_word: ነጽሮተ ሰማይ
  choice: 观看天
  rationale: 将ነጽሮተ按ነጸረ“观看、注视”的动词性形式处理；原文没有“库房”一词，因此不采纳旧有误释。
- source_word: አእምሮ ግብረ ሰማይ
  choice: 明白天上的作为
  rationale: አእምሮ表达认识、理解；“天上的作为”保留ግብረ与ሰማይ之间略有开放性的关系和宇宙性语域。
- source_word: ከመ ይርአይ ነፍሰ
  choice: 看见魂
  rationale: 直译这个突兀而困难的表达，不将ነፍሰ释义性改写为“生命”或“气息”。
- source_word: መንፈሰ
  choice: 灵
  rationale: 在此语境中译作“灵”最自然，同时与“魂”保持区分；“气息”仍是词义上的可能性。
- source_word: ይክል ነጊረ
  choice: 能……把它述说出来
  rationale: 保留能力与陈述、报告所见之事的含义；“它”的确切所指在原文中并不完全明确。
- source_word: ወእመ አኮ ዐሪገ
  choice: 又有谁能升上去
  rationale: 将እመ አኮ按“否则／又或”的惯用连接理解，ዐሪገ保留启示文学中的上升意象；在汉语中补出反问框架以承接前文。
- source_word: ኵሎ አክናፊሆሙ
  choice: 它们一切的边际
  rationale: 末词字面可涉及“翼”，但此处可能指边缘、尽头或极处；正文采用较合语境而仍保留空间意象的“边际”。
theological_decisions:
- issue: ነፍሰ与መንፈሰ的人论关系
  choice: 分别译为“魂”和“灵”
  alternative: 译为“生命”和“气息”，或将二者合并为同一概念
  rationale: 原文并列两个相关而不相同的词；译文保留其张力，不据特定教派的人论判断二者究竟如何区分。
- issue: 末句上升者与观看对象的关系
  choice: 保留为反问中的“升上去，看见”
  alternative: 理解为“若没有升上去，岂能看见”
  rationale: እመ አኮ在这里更宜按“又或／否则”的惯用表达处理；不把它改成会扭转句法逻辑的否定条件句。
translation_notes:
  register: 采用庄重而可读的现代标准汉语，以连续反问重现原文节奏。避免“天的库房”这一无源文依据的旧释；对“魂／灵”和末句“边际／翼”的困难不作过度平滑。所有脚注标记均已置于正文。
