base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/003.yaml
  text: And now Enoch began to speak from the books[a], and he said, “I was born the seventh in the first week[d][c][b], while righteousness and justice still endured.”
translation:
  language: zh_hans
  text: 这时，以诺从书卷说起，说：“我生在第一周[c]，是第七位[b]；那时，公义与公正[d]仍然存续。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “第七位”通常理解为从亚当算起的第七代，即以诺在先祖世系中的次序。
    reason: clarification
  - marker: c
    text: 这里的“第一周”是本段用来划分历史的象征性时期，不一定指普通的七天。
    reason: cross_reference
  - marker: d
    text: 此处现有转录文本的词形有困难。校勘所依据的读法可译为“审判”或“公正”，并与“公义”并列；若按现存转录词形，也曾有“正直”“真理”等解释。
    reason: textual_variant
lexical_decisions:
- source_word: አኀዘ፡ እንከ፡ ይትናገር
  choice: 现在……开始……讲说
  rationale: 保留叙事转折词和“开始说话”的起始体，同时采用自然、庄重的现代汉语。
- source_word: እመጻሕፍት
  choice: 根据书卷
  rationale: 介词短语表示以书面材料为来源；“根据书卷”比“从书里说”自然，又不把这些书卷预先认定为正典。
- source_word: ሳብዕ
  choice: 第七位
  rationale: 原文只有序数词，并未明说“第七代”；正文保留其简约性，在注释中说明通常所指。
- source_word: ተወለድኩ
  choice: 我生在
  rationale: 准确表达出生，并与后面的时期短语构成自然汉语。
- source_word: በቀዳሚት፡ ሰንበት
  choice: 在第一周
  rationale: 本段按象征性的“周”划分历史时期；译作“周”可维持全段的文学结构，避免误解为一个安息日。
- source_word: እስከ፡ አመ
  choice: 那时
  rationale: 结合历史回顾语境，表达同一时期内持续存在的状态，而不机械译成指向未来终点的“直到……之时”。
- source_word: ኵነኔ（校勘所得；转录作ጽጌነ）ወጽድቅ
  choice: 公义与公正
  rationale: 据校勘信息，困难词形很可能是表示审判或公正的ኵነኔ，并与ጽድቅ构成伦理词对；采用自然的汉语搭配，同时以脚注交代文本与译法的不确定性。
- source_word: ትዓገሠ
  choice: 仍然存续
  rationale: 在第一周的历史回顾中按过去持续状态理解；“仍然存续”保留延续、持守之意。
theological_decisions:
- issue: “第一周”的性质
  choice: 译作象征性历史时期“第一周”
  alternative: 第一安息日；第一个七期
  rationale: 《周数启示》以连续的“周”概述历史；正文保留原有意象，不将其解释成普通七日历周。
- issue: 以诺“第七位”的含义
  choice: 正文保留“第七位”
  alternative: 第七代；第七个人
  rationale: 按传统语境通常指从亚当起的第七代，但原句未明说“代”，故不在正文中消除这点含蓄。
- issue: 末尾伦理词对及其时态
  choice: “那时，公义与公正仍然存续”
  alternative: 审判与公义仍然存续；直到公义与正直长存之时
  rationale: 校勘证据支持困难词为“审判／公正”，而历史叙述支持过去持续义。正文采用较自然的伦理品质表达，脚注保留“审判”的可能译法及转录见证的问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“书卷”保留古代文献语感；“第七位”避免把上下文推论直接写进正文；末句以自然汉语表达历史时期内持续存在的伦理秩序，并用脚注保留文本校勘与词义张力。
