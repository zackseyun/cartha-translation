base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/008.yaml
  text: And after this[a], in the sixth week, all who are in it will be blind, and the hearts of all of them will forget wisdom. And in it a man will ascend, and at its completion the house of the kingdom will be burned with fire[d][c][b], and in it the whole stock of the chosen root will be scattered.
translation:
  language: zh_hans
  text: 此后，在第六周[a]，其中所有的人都将瞎眼，众人的心都将忘记智慧。在这周中，有一人将升上去[b]；到这周结束时，王国之家将被火焚烧[c]，在这周中，蒙拣选之根的整个族系都将四散[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“第六周”。这里的“周”是启示文学中象征性的七重时期（heptad），并非普通的一周，也未明确规定为七年期。
    reason: lexical_alternative
  - marker: b
    text: 或译“将兴起”。原动词可表示上升或上去；正文保留其方向性和含混性。
    reason: lexical_alternative
  - marker: c
    text: “王国之家”也可能指王室、王朝、宫殿，或与王权相关的建筑，并不一定只指一座具体建筑。
    reason: lexical_alternative
  - marker: d
    text: “蒙拣选之根”结合族系与植物的意象，可能指蒙拣选的血脉或余民。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳድስት ሰንበት
  choice: 第六个七年期
  rationale: 本段属于“诸周启示”的象征性分期；译作“七年期”既保留七重周期的观念，也避免现代读者误以为是普通的一周。原词也可直译为“第六周”。
- source_word: ውስቴታ ጽሉላነ ኵሎሙ
  choice: 其中所有的人都将眼瞎
  rationale: 贴近原文所描述的状态，同时保留可能具有属灵或道德意味的失明意象，不径直释为“无知”或“受迷惑”。
- source_word: ይትረሣዕ ልቦሙ ለኵሎሙ እምጥበብ
  choice: 众人的心也将忘却智慧
  rationale: 保留“心”“忘却”“智慧”等原文要素及智慧传统的回响，不扩写为偏离或背弃。
- source_word: ባቲ የዓርግ ብእሲ
  choice: 在这期间，有一个人将升上去
  rationale: “升上去”保留动词的上升含义，也不预先断定这是兴起、政治崛起、受高举还是实际升天。
- source_word: ቤተ መንግሥት
  choice: 王国之家
  rationale: 采用较贴近原文的表达，保留其可能指王室、王朝、宫殿或与王权相关建筑的多义性。
- source_word: ይውዒ ... በእሳት
  choice: 将被火焚烧
  rationale: 自然而有力地再现原文的火焚审判意象。
- source_word: ኵሉ ዘመደ ሥርወ ኀሩይ
  choice: 蒙拣选之根的全部族类
  rationale: “族类”呈现血统、亲族意义，“根”保留植物隐喻，“蒙拣选”保留拣选语言，而不将其直接等同于某一后来的神学对象。
theological_decisions:
- issue: “有一个人将升上去”的人物身份
  choice: 只译作“有一个人”，不指明其身份
  alternative: 历史领袖、祭司人物或弥赛亚性人物
  rationale: 吉兹语原文仅称其为一个人，本节没有进一步命名；保持其历史与神学身份的开放性。
- issue: “王国之家”的所指
  choice: 保留“王国之家”这一含混表达
  alternative: 王朝、王室、宫殿或与王权相关的圣殿
  rationale: 原短语可能指实体建筑，也可能指王室制度或王朝；译文不应仅凭焚烧语境擅自限定。
- issue: “蒙拣选之根”的神学指向
  choice: 保留族谱与植物相结合的拣选意象
  alternative: 蒙拣选的余民、选民支派或弥赛亚之根
  rationale: 本节并未把此根明确等同于单一人物；避免以后来的经文用法消解本处张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“七年期”帮助普通读者理解象征性分期，脚注同时交代更直译的“周”。“眼瞎”“升上去”“王国之家”“蒙拣选之根”有意保留原文意象及歧义，不作宗派性或后设神学认定。
