base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/009.yaml
  text: And after this[a], in the seventh week, an apostate generation will arise, and many will be its deeds[b], and all its deeds will be apostasy.
translation:
  language: zh_hans
  text: 此后，在第七周[a]，必有一个背道的世代兴起；其将有许多作为[b]，所作的一切都属背道之举。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“第七安息日／周”。本段用此词指历史异象中象征性的“周”或七日历史阶段，并非普通的一周或单独的一天。
    reason: cultural_note
  - marker: b
    text: 原文此处强调其作为众多。末句“背道”也可译作“谬误”“悖谬”或“悖逆”；此处采用“背道”，以保留原文较强的宗教性偏离意味，并与“背道的世代”相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕት ሰንበት
  choice: 第七个七日时期
  rationale: 原文直指“第七安息日／七日周期”；在“数周启示”的象征性历史序列中，并非普通的一周或单个安息日。“七日时期”既保留七数结构，也表明这是象征性的历史阶段。
- source_word: ትትነሣእ
  choice: 必兴起
  rationale: 该动词表示起来、出现；“兴起”符合启示文学叙述历史阶段相继出现的语境，并保留原文可能含有的中间／被动形态，而不明确指定使其兴起者。
- source_word: ትውልድ
  choice: 世代
  rationale: 该词可指后裔、族类或一代人；此处描述特定历史时期中的一群人，“世代”最自然准确。
- source_word: ዕሉት
  choice: 背道的
  rationale: 该词含偏离、误入歧途或悖逆之意；结合后文同根抽象名词，译作“背道的”可保留其宗教和道德力度，同时避免泛化为普通的邪恶。
- source_word: ብዙኅ
  choice: 必多
  rationale: 该词在此作述语，表示数量众多；“它的行为必多”保留原句结构和数量重点。
- source_word: ምግባራቲሃ
  choice: 它的行为
  rationale: 该名词表示行为、作为或实践；“行为”在现代汉语中自然，并保有审判语境中的道德分量。
- source_word: ዕልወት
  choice: 背道
  rationale: 这是与形容该世代的 ዕሉት 相应的抽象名词；重复译作“背道”可保留原文的词根呼应，也呈现偏离正道、叛离信仰的较强含义。
theological_decisions:
- issue: 应将这个世代的特征译为一般性的道德败坏，还是具有宗教性偏离意味的背道
  choice: 背道的世代……它一切的行为尽是背道
  alternative: 悖谬的世代……它一切的行为尽是悖谬；邪恶的世代……它一切的行为尽是邪恶
  rationale: ዕሉት 与 ዕልወት 是相互呼应的词，强调偏离或叛离，不仅是笼统的恶。“背道”保留这种较尖锐的宗教—道德张力，但不进一步规定其具体教义或历史对象。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“此后”“必兴起”保留启示文学的预告语气；“七日时期”避免把象征性历史阶段误解为普通的一周；两次使用“背道”呈现原文相关词语的呼应。
