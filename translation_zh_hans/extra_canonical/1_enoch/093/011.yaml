base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/011.yaml
  text: For who among all the children of men is able to hear the voice of the Holy One and not be shaken? And who is able to comprehend his thoughts? And who is able to look upon all the works of heaven?[a][b][c]
translation:
  language: zh_hans
  text: 因为世人中有谁能听见圣者的声音[a]而不震动？有谁能领会他的意念[b]？又有谁能观看天上的一切作为[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“话语”或“言辞”；原词的含义包括声音、话和所说的话。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“思想他的意念”。“他的”很可能指前句的“圣者”，也有人把这一短语理解为“使自己的心思能够思想”。
    reason: textual_ambiguity
  - marker: c
    text: “天上的一切作为”可广指诸天的运行、构造和有秩序的现象，不只是肉眼可见的天体。
    reason: cultural_note
lexical_decisions:
- source_word: እስመ
  choice: 因为
  rationale: 承接上文，引出作为依据或解释的反问；现代汉语中“因为”比单独使用“因”更自然。
- source_word: ውሉደ ሰብእ
  choice: 世人中
  rationale: 原文直译为“人的儿女”，是泛指全人类的闪语式表达；译作“世人中”既保留范围，也避免现代汉语中生硬或可能引起误解的“人的儿女”。
- source_word: ዘይክል
  choice: 能
  rationale: 三次重复“能”，保留原文连续反问所强调的人类能力有限。
- source_word: ሰሚዐ ቃሉ ለቅዱስ
  choice: 听见圣者的声音
  rationale: ቃል 可指声音、话语或言辞；与“听见”搭配时，“声音”最自然。ቅዱስ 在此按神圣称号译作“圣者”。
- source_word: ወኢይትሀወክ
  choice: 而不震动
  rationale: 表达听见神圣发言时内心受到撼动或惊扰，保留其强度而不限定为恐惧、困惑等单一情绪。
- source_word: ከመ የሐሊ ኅሊናሁ
  choice: 领会他的意念
  rationale: 该短语以“思想/意念”的同根词构成，语义涉及思想、设想或理解；“领会……意念”在中文中自然，并保留这是人试图把握超越者思想的含义。
- source_word: ነጽሮተ
  choice: 观看
  rationale: 比普通“看见”略显庄重，又不采用过于古雅的“瞻仰”或“观览”。
- source_word: ምግባረ ሰማይ
  choice: 天上的一切作为
  rationale: ምግባር 可指工作、作为、运行；“作为”保留广义，不把它收窄为可见天体、道德行为或技术性的宇宙秩序。
theological_decisions:
- issue: 是否把 ለቅዱስ 作为神圣称号
  choice: 圣者
  alternative: 圣洁者／那圣洁的一位
  rationale: 上下文所说的发言者具有令人震动的超越性，“圣者”自然地标示称号，同时不引入后期基督论身份。
- issue: ኅሊናሁ 的第三人称阳性单数后缀所指
  choice: 正文译作“他的意念”，不在正文中明定所指
  alternative: 明确译作“圣者的意念”或理解为“他自己的心思”
  rationale: 语境可以使该代词回指前句的“圣者”，形成听其声音、领会其意念的平行；但原文代词本身并未重述名号，句法理解亦有争议，因此以脚注保留歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续三次以“有谁能”构成反问，保留启示文学的节奏及人面对神圣声音、意念与天上作为时能力有限的张力；避免使用过度古雅或带特定宗派色彩的措辞。
