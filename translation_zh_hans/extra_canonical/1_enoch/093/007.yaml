base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/007.yaml
  text: And after this[a], in the fifth week, at its completion[b], the house of glory and kingship shall be built forever.
translation:
  language: zh_hans
  text: 此后[a]，在第五周结束时[b]，那荣耀与王权之殿[c]必被建造，存到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “此后”也可译作“这些事以后”。
    reason: alternative_reading
  - marker: b
    text: 在“周的启示”中，“周”指以七为结构的象征性历史时期，不一定是普通的七天。
    reason: cultural_note
  - marker: c
    text: 也可按另一种句法理解为：“荣耀之殿和王国必被建造，存到永远。”
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረዝ
  choice: 此后
  rationale: 作为时间承接语，引出异象中的下一阶段；简洁自然地保留先后次序。
- source_word: ኃምስ ሰንበት
  choice: 第五周
  rationale: 在“周的启示”框架中指象征性的七期单位，而非普通安息日；译作“周”既保留结构，也便于理解。
- source_word: በተፍጻሜታ
  choice: 结束时
  rationale: 阴性后缀回指“周”，表达该时期达到终点或完成；“结束时”符合现代汉语。
- source_word: ቤተ ስብሐት
  choice: 荣耀之殿
  rationale: ቤተ意为房屋、殿宇，ስብሐት可指荣耀或赞美；此处的神圣建筑语境更适合译作“荣耀之殿”。
- source_word: መንግሥት
  choice: 王权
  rationale: 该词可指王国、王权或统治；“王权”与“荣耀”并列修饰殿宇，避免不必要地限定为地域性的国家。
- source_word: ይትሐነጽ
  choice: 必被建造
  rationale: 保留原文被动式和具体的建造意象，也以“必”体现预告语气。
- source_word: እስከ ለዓለም
  choice: 存到永远
  rationale: 这是表达永久延续的惯用语；补出“存”使“建造”与永久存在之间的关系在中文中自然明确。
theological_decisions:
- issue: 本节是指末世圣殿，还是更广泛的政治王国
  choice: 将其译为一座具有荣耀与王权的殿宇
  alternative: “荣耀之殿和王国必被建造”
  rationale: 吉兹语词序较自然地容许“荣耀”和“王权”共同限定“殿”；正文保留单一建筑意象，同时用脚注说明把“王权／王国”视为第二个并列成分的可能性，避免消除原文张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“殿”传达圣所式建筑意象；“王权”保留抽象的统治含义。正文中的脚注标记[a]、[b]均与脚注对应。
