  yaml_path: translation/extra_canonical/1_enoch/012/001.yaml
  text: Before these things[b][a], Enoch was hidden.
translation:
  language: zh_hans
  text: '在这一切事以前，以诺被隐藏起来；世人中没有人知道他藏在哪里、身在何处，也不知道他遭遇了什么。在他在世的日子，他的一切作为都与圣者和儆醒者[a]有关。


    我以诺颂赞伟大的主、万世之王[b]。看哪，儆醒者呼唤我以诺这书记，对我说：“以诺，公义的书记，你去告诉天上的儆醒者：他们离弃了至高的天和永恒的圣所，与女人玷污了自己，行世人所行的事，为自己娶了妻，在地上造成极大的败坏。他们在地上必得不到平安，也得不到罪的赦免。他们因自己的儿女欢喜，却必看见自己所爱之人遭杀戮；他们必为儿女的灭亡哀号，永远祈求，却得不到怜悯，也得不到平安。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儆醒者”原意为警醒、守望者，是本书对一群天上存在的特定称谓；下文说他们离开天上的居所，与女人结合。
    reason: term
  - marker: b
    text: “万世之王”也可理解为“永恒之王”或“世界之王”；原词可表示世代、永恒或世界。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ተከብተ
  choice: 被隐藏起来／藏在哪里
  rationale: 上下文两次使用同一形式，描述以诺不为世人所知的隐匿状态；译作“隐藏”既贴合叙事，也避免增添被谁带走等原文未明说的信息。
- source_word: ትጉሃን
  choice: 儆醒者
  rationale: 该词本义与警醒、守望有关，在《以诺一书》中又是特定天上群体的称谓；“儆醒者”兼顾词源意味和专名功能。
- source_word: ጸሓፊ / ጸሓፌ፡ ጽድቅ
  choice: 书记／公义的书记
  rationale: 该词指书写者或书记；保留“书记”能反映以诺受命传达并记录信息的角色，而“公义的”按属格结构自然连接。
- source_word: ማሰኑ / ሙስና
  choice: 玷污了自己／败坏
  rationale: 两个同根表达分别涉及儆醒者与女人的越界结合及其在地上造成的严重破坏；依各自句法译为“玷污”和“败坏”，保留词义联系而使中文自然。
- source_word: ኅድገተ፡ ኀጢአት
  choice: 罪的赦免
  rationale: 字面为罪的放下、免除；“罪的赦免”是现代中文清楚且庄重的对应，不预断赦免机制。
- source_word: ይስእሉ
  choice: 祈求
  rationale: 该动词可指求告、请求；此处没有明示祈求的具体对象或内容，因此用宽泛的“祈求”保留原文省略。
theological_decisions:
- issue: 儆醒者的身份与称谓
  choice: 采用“儆醒者”，并以脚注说明其为天上群体称谓
  alternative: 译作“守望者”或直接释为“天使”
  rationale: 原词强调警醒，并在本书中具有群体专称作用；直接译成“天使”会抹去原文独特称谓并增加解释。
- issue: 儆醒者是否仍有获赦可能
  choice: 直译为“得不到平安，也得不到罪的赦免”及“得不到怜悯”
  alternative: 将其弱化为暂时受罚，或强化为系统性的永恒定罪教义
  rationale: 原文给出严厉而直接的宣告，但并未在此展开完整的赦罪或终末论体系；译文保留宣告本身，不导入宗派性解释。
- issue: “他们虽因自己的儿女欢喜”的时间和逻辑关系
  choice: 用“虽……却……”呈现欢喜与随后目睹死亡之间的强烈反差
  alternative: 译作“当他们因儿女欢喜时”或“他们不会因儿女欢喜”
  rationale: 原文先陈述他们因儿女欢喜，随后宣告他们将看见所爱者被杀；转折关系来自语境，但不把前句否定掉。
- issue: “所爱之人”与“儿女”的关系
  choice: 前句译“自己所爱之人”，后句明确译“儿女”
  alternative: 两处都统一译为“儿女”
  rationale: 原文先用“他们所爱的”一词，后面才明确说“他们的儿女”；译文保留这一措辞变化，不将两者无标记地完全等同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与宣告语体。按所提供的完整吉兹语见证翻译全部文本，不沿用较早英文咨询层基于截断文本所设的短句和文本残缺脚注。专名“以诺”使用通行中文形式；对天上群体保留具有词源色彩的“儆醒者”，避免直接教派化为某类天使。
