  text: Look at the summer and the winter[a], how the whole earth is filled with water[b], and clouds and dew and rain rest upon it.
translation:
  language: zh_hans
  text: 你们看夏季和冬季[a]：全地充满了水；云、露水[b]和雨停驻在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夏季和冬季”直译自吉兹文的季节配对。在埃塞俄比亚的气候背景中，“冬季”可能更侧重雨季，并不一定指现代读者所理解的寒冷季节。
    reason: cultural_note
  - marker: b
    text: 译作“露水”的词单独出现时也可能有别的理解；但在这里，它与水、云和雨并列，最可能指露水一类的湿气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእይዎ
  choice: 你们要观察
  rationale: 保留复数命令语气，表达对众人发出的察看受造秩序的呼吁；“观察”比单纯“看”更能体现留心审视之意。
- source_word: ለሐጋይ ወለክረምት
  choice: 夏季和冬季
  rationale: 直接保留原文成对的季节名称，不径自改译为“旱季和雨季”；其埃塞俄比亚气候背景另以脚注说明。
- source_word: ከመ
  choice: 怎样
  rationale: 引出所要观察的情形，保留原文带有展示意味的表达，而非弱化为单纯的“就是”。
- source_word: ኵሉ ምድር
  choice: 全地
  rationale: 符合创造秩序语境中的广泛范围，也保持庄重简洁；此处不缩小为某一片“土地”。
- source_word: መልአት ማየ
  choice: 充满了水
  rationale: 保留原文具体的水势充盈意象，并以自然的现代汉语表达完成状态。
- source_word: ወደመና
  choice: 云
  rationale: 按气象现象直译，并与露水和雨并列。
- source_word: ወጠለ
  choice: 露水
  rationale: 该词孤立看可能存在其他释义，但在水、云和雨的气象语境中，“露水”最为合适；歧义以脚注保留。
- source_word: ወዝናም
  choice: 雨
  rationale: 直接保留具体气象意象。
- source_word: ያዓርፍ ላዕሌሃ
  choice: 停驻在地上
  rationale: 表达落下、停留于其上的含义；“停驻”既保留原文近于“安歇”的形象，又比生硬的“安息在地上”更适合现代汉语气象描写。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们”显明原文命令语气的复数对象；冒号清楚连接观察的命令与其具体内容。保留“全地充满了水”以及云、露水、雨“停驻在地上”的具象表达，不将其解释性改写为一般气候描述。
