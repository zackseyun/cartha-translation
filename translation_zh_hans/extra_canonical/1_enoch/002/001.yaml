  to: 你们要察看天上万象，看它们怎样不改变各自的运行路线[a]；又要察看天上的众光体，看它们怎样都按次序升起、落下，各按自己的时候[b]，并不偏离为它们所定的秩序[c]。
  rationale: 修订仅解决现代汉语中“作为”与“轨道”的指代失配，并微调时间词和副词位置以增强自然度。未增加原文未明说的施定者，也保留天上万象和众光体之间的平行观察结构、规律运行及法则性意涵。
