base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/001.yaml
  text: 'Consider all the works in heaven: how they do not alter their paths[a], and the lights in heaven, how all of them rise and set in order, each in its season[c][b], and do not transgress their appointed order.'
translation:
  language: zh_hans
  text: 你们要察看天上万象，看它们怎样不改变各自的运行路线[a]；又要察看天上的众光体，看它们怎样都按次序升起、落下，各按自己的时候[b]，并不偏离为它们所定的秩序[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不改变各自的路径”或“轨道”。原文强调天上万象沿固定路线运行。
    reason: lexical_alternative
  - marker: b
    text: 或译：“各按自己的时节”或“各在适当的时间”。原文指各光体各有相应的定时；“时节”也可包含历法与季候的意味。
    reason: lexical_alternative
  - marker: c
    text: “所定的秩序”也可译作“定规”或“法则”；原文含有不越界、不偏离既定安排的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ
  choice: 你们要察看
  rationale: 这是复数祈使式，用来呼吁听众留意并思考可见的受造秩序。“察看”既保留劝勉语气，也避免按字面译作“询问”所可能造成的误解。
- source_word: ግብረ
  choice: 作为
  rationale: 在此指天上万象的运行和表现。“作为”保留“工作、所行之事”的宽泛含义，不把它过早限定为具体受造物。
- source_word: ኢይመይጡ ፍናዊሆሙ
  choice: 不改变自己的轨道
  rationale: 该短语描写天体运行路径的恒定。“轨道”在现代汉语中自然清楚，同时保留具体的宇宙运行意象。
- source_word: ብርሃናት
  choice: 众光体
  rationale: 所指可能包括日、月、星辰。“光体”比单纯的“光”更能表达天上发光之物，又不把范围限定于某一种天体。
- source_word: ይሠርቅ ወየዐርብ
  choice: 升起、落下
  rationale: 这对动词描述天上光体规律性的出没运行；“升起、落下”是现代汉语中清楚而自然的对应表达。
- source_word: ሥሩዕ
  choice: 有序地
  rationale: 表达依照既定安排而运行的规律性，而非仅指动作的先后次序。
- source_word: በበዘመኑ
  choice: 各按自己的时节
  rationale: 重叠的分配表达显示各光体都有相应的时间。“时节”兼顾具体时刻与历法、季候的宇宙性含义。
- source_word: ኢይትኀደዉ እምሥርዓቶሙ
  choice: 不违背为它们所定的秩序
  rationale: 原文含有越界、偏离既定规范的较强意味。“违背”保留这一近于法则性的语气，“为它们所定”则说明此秩序并非偶然。
theological_decisions:
- issue: 应将天体运行仅译成中性的自然规律，还是保留服从既定秩序的法则性意味
  choice: 不违背为它们所定的秩序
  alternative: 不偏离各自的运行规律
  rationale: 本节不只描述重复发生的自然现象，也以近于越界或违犯的措辞表现受造界遵守既定安排。所选译法保留启示文学中的道德—法则性回响，却不擅自补出“上帝”“律法”等原文未明说的内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们要察看”保留复数劝勉语气；分号呈现原文从“天上的一切作为”转向“天上的众光体”的平行结构。避免使用过度科学化的术语，也不把原文隐含的秩序观扩写为特定宗派教义。
