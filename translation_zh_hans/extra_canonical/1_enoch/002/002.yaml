base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/002.yaml
  text: Look at the earth and understand concerning the works that are done upon it from the beginning to their completion[a], that none of the works of God changes[d][c][b], as they appear.
translation:
  language: zh_hans
  text: 你们要观看大地，留心其上从开始直到完成所成就的作为；上帝的一切作为都不改变，正如它们所显现的那样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的一切作为”也可按逐项理解译作：“上帝的每一项作为都不改变。”原文在集合性与逐项理解之间并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእይዋ ለምድር
  choice: 观看大地
  rationale: 祈使语气直接呼吁读者观察；宇宙性语境中的 ምድር 指“大地”，而非局部的“土地”。
- source_word: ወለብዉ
  choice: 留心
  rationale: 该动词要求人在观看之后加以思量、领会；“留心”自然地衔接观察与理解。
- source_word: በእንተ ምግባር ዘይትገበር ላዕሌሃ
  choice: 其上所发生的一切事
  rationale: 保留被动或非人称含义，并明确所述事情发生在大地之上；“一切事”表达集合意义。
- source_word: እምቀዳሚ እስከ ተፍጻሜቱ
  choice: 从开始直到完成
  rationale: 表达从起始到成全的完整过程；不把“完成”弱化为单纯停止。
- source_word: ከመ ኢይትመየጥ ኵሉ ምግባረ ለአምላክ
  choice: 上帝的一切作为都不改变
  rationale: 以集合性的自然汉语呈现“上帝的一切作为”，同时保留各项作为皆不改变的概括性陈述。
- source_word: እንዘ ያስተርኢ
  choice: 正如它们所显现的
  rationale: 按 Ast 词干的不及物或被动意义译为“显现”，而不误译成主动的“他显明”。
theological_decisions:
- issue: 本节是在陈述上帝一切行动的绝对不变性，还是受造秩序中可观察的恒常性
  choice: 按上下文译为人从大地运行中所观察到的上帝作为之恒常不变
  alternative: 将其理解为上帝绝不改变任何事的广泛形上学命题
  rationale: 上下文要求读者观看大地及其过程，因此译文保留关于上帝作为不改变的原句张力，却不扩展成后来的系统神学断言。
- issue: ኵሉ ምግባረ ለአምላክ 的集合与逐项理解
  choice: 上帝的一切作为都不改变
  alternative: 上帝的每一项作为都不改变
  rationale: “一切……都……”在现代汉语中既自然，又能兼顾整体和逐项理解，无须武断排除其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“观看……留心……”保留原文劝诫式节奏；“正如它们所显现的”略带提升语体，以准确反映原文末尾分词结构及不及物含义。
