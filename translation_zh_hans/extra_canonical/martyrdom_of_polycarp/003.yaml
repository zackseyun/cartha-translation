  - severity: low
    issue: “肉体内部的构造显露出来”表达稍显抽象
    rationale: 原句重点是鞭笞使血肉破裂、内里的静脉和动脉都可看见。改以具体身体描写，可更自然准确，且不增加原文信息。
  - severity: low
