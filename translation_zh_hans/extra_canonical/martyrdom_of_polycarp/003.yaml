base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/003.yaml
  text: 'Blessed, therefore, and noble are all the martyrdoms that have taken place according to the will of God—for it behooves us to be very scrupulous and to assign to God power over all things.


    For who could fail to admire their nobility, patient endurance, and loyalty to the Master? For, when they were so torn by lashes that the mechanism of their flesh was visible even as far as the inward veins and arteries, they endured patiently, so that the very bystanders had pity and wept; while they themselves reached such a pitch of bravery that none of them uttered a cry or a groan, thus showing us all that at that hour the martyrs of Christ, while being tortured, were absent from the flesh—or rather, that the Lord was standing by and conversing with them.


    And, giving heed to the grace of Christ, they despised the tortures of this world, purchasing at the cost of one hour a release from eternal punishment. And they found the fire of their inhuman torturers cold, for they set before their eyes escape from the eternal fire that is never quenched; while with the eyes of their heart they gazed upon the good things reserved for those who endure patiently, things that neither ear has heard nor eye has seen, neither have they entered into the heart of man, but were shown to them by the Lord, for they were no longer men but already angels.


    And in like manner also those condemned to the wild beasts endured fearful punishments, being made to lie on sharp shells and buffeted with other forms of manifold tortures, so that the devil might, if possible, by the persistence of the punishment bring them to a denial; for he tried many wiles against them.'
translation:
  language: zh_hans
  text: '**《坡旅甲殉道记》2**


    因此，凡照着神的旨意发生的殉道，都是有福而崇高的；因为我们理当极其谨慎，把掌管万有的权柄归于神。


    谁能不赞叹他们的高尚、坚忍和对主的忠诚呢？他们被鞭打撕裂，肉体内部的构造显露出来，连深处的静脉和动脉都清晰可见，却仍耐心忍受，以致旁观的人也心生怜悯，为他们流泪。他们自己却勇敢到了如此地步，没有一个人发出喊声或呻吟。这向我们众人表明：基督的殉道者受刑的那一刻，已经不在肉身之中[a]；或者更确切地说，是主站在他们身旁，与他们交谈。


    他们专注于基督的恩典，便轻看今世的酷刑，以一个时辰为代价，换得免受永远的刑罚。他们觉得那些残无人道的施刑者所点的火是冰冷的，因为他们定睛于逃离那永不熄灭的永火；同时，他们用心灵的眼睛注视着为坚忍之人存留的美好事物——那是耳朵未曾听见、眼睛未曾看见、人心也未曾想到的，主却把这一切显给了他们，因为他们已不再是人，而已经是天使了[b]。


    同样，那些被判交给野兽的人也忍受了可怕的刑罚：他们被迫躺在尖锐的碎片上[c]，又遭受各式各样、接连不断的折磨。魔鬼企图借着持续的刑罚，尽可能迫使他们否认信仰；因为他用许多诡计攻击他们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不在肉身之中”也可理解为“超脱了肉身的感受”。原句随即以“或者更确切地说”转向另一说明：主亲自临近他们。
    reason: 保留原表述可能涉及离身、超越痛感或修辞夸张的歧义，不在正文中武断定论。
  - marker: b
    text: “已经是天使”保留了原文强烈的赞颂说法；原文没有改写为“像天使一样”。
    reason: 提醒读者正文刻意保存原有神学张力和修辞力度。
  - marker: c
    text: 底本见证译作“尖锐的贝壳”；相关希腊词也可指碎瓦片或陶片。此处按刑罚场景译作“尖锐的碎片”，有待希腊文本复核。
    reason: 现有材料注明希腊语审校尚未完成，须公开标示关键实物名词的不确定性。
lexical_decisions:
- source_word: martyrdoms
  choice: 殉道
  rationale: 采用现代汉语基督教文献中通行且清楚的历史术语，指因忠于基督而受死或遭受致命迫害。
- source_word: Master
  choice: 主
  rationale: 既保留对基督的效忠关系，也符合本段随后明确提到“主”临在的语境；不扩写为特定教义称号。
- source_word: mechanism of their flesh
  choice: 肉体内部的构造
  rationale: 保留原表述对身体组织被暴露的具体性，同时避免用现代机械意象造成不自然或误解。
- source_word: absent from the flesh
  choice: 不在肉身之中
  rationale: 尽量形式对应，保留原文突兀而带神学张力的说法，不擅自解释为灵魂出窍、麻木或已经死亡。
- source_word: purchasing at the cost of one hour
  choice: 以一个时辰为代价，换得
  rationale: 保留代价与所得之间的交易隐喻，但用自然现代汉语表达，避免把救恩解释成可由功德购买。
- source_word: the eyes of their heart
  choice: 心灵的眼睛
  rationale: 保留古代宗教修辞中的内在观看意象，表达他们凭内心注视未见之事。
- source_word: denial
  choice: 否认信仰
  rationale: 使汉语宾语完整，并按迫害语境表达被迫否认所信；不进一步限定为某一种正式弃教程序。
theological_decisions:
- issue: 神的旨意与殉道事件的关系
  choice: “照着神的旨意发生的殉道”并保留“掌管万有的权柄归于神”
  alternative: 译成神直接促成或主动要求每一次殉道
  rationale: 原段肯定神的主权，却没有细分许可、命定和直接施为；译文不替作者消解这层张力。
- issue: 殉道者“已不在肉身之中”
  choice: 按原意直译，并让后句“或者更确切地说”修正为主在旁交谈
  alternative: 解释为感觉不到肉体疼痛、灵魂已经离体或仅是修辞夸张
  rationale: 原文自身先提出一种说法，随即以主的临在加以更正；应保留这一步修辞推进。
- issue: “以一个时辰为代价，换得免受永刑”是否表示功德购买救恩
  choice: 保留交易隐喻，不加入功德论或反功德论说明
  alternative: 改写为因殉道而赚取救恩，或因恩典而完全与殉道无关
  rationale: 本段同时提到基督的恩典与殉道者所付的短暂代价；译文保留二者并置，不导入后世宗派体系。
- issue: “已经是天使”
  choice: 保留作者强烈的赞颂性陈述
  alternative: 弱化为“像天使一样”
  rationale: 见证文本明确说他们已不再是人、已经是天使；虽然可能是修辞性语言，正文不应静默改写为明喻。
- issue: 魔鬼与迫害者的作用
  choice: 保留魔鬼借持续刑罚诱使他们否认信仰的表述
  alternative: 仅归因于人类施刑者，或断言魔鬼直接控制施刑者
  rationale: 原段将诡计归于魔鬼，却没有细述人与魔鬼之间的作用机制。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文，避免文言虚词堆叠；保留殉道叙事的身体性、修辞强度及神学张力。当前委托材料只提供公版英语见证，并明确注明希腊语源文复核尚待进行，因此本稿属于可供源文审校的出版草案；尤其是刑具名词及若干修辞表达，最终定稿应据希腊抄本传统复核。
