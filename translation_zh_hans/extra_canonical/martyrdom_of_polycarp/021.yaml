  source_fidelity: 需修订。直接按希腊文传统复核时，首句明确涉及“殉道者相关的事”，草稿笼统译作“所发生的事”而遗漏该对象。ἐπιστείλατε 的意思是“写信”，不宜确定为把当前这封信传阅。颂赞语应以“那位能……者”为受颂赞对象，保留原文句法。
  naturalness: 草稿总体通顺、庄重。修订后以“概略说明”“写信给较远处的弟兄们”和一个完整的颂赞句，更自然且更贴近书信结语的语气。
  terminology: 保留“主”“恩典”“独生子”“众圣徒”等恰当的早期基督教语域。将“拣选”处译为“从自己的仆人中施行拣选”，并以脚注说明该属格结构的理解仍有语义余地，避免将其扩展为特定教义表述。
