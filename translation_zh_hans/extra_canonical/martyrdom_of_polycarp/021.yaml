  manuscript: Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.xi.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Ye indeed required that the things which happened should be shown unto you at greater length: but we for the present have certified you as it were in a summary through our brother Marcianus. When then ye have informed yourselves of these things, send the letter about likewise to the brethren which are farther off, that they also may glorify the Lord, who maketh election from His own servants.


    Now unto Him that is able to bring us all by His grace and bounty unto His eternal kingdom, through His only-begotten Son Jesus Christ, be glory, honor, power, and greatness for ever. Salute all the saints. They that are with us salute you, and Euarestus, who wrote the letter, with his whole house.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/021.yaml
  text: 'You asked for the things that happened to be presented to you at greater length. But for now, we have informed you of them in summary through our brother Marcianus. When you have learned these things, circulate the letter also among the brothers and sisters who are farther away, so that they too may glorify the Lord, who chooses from among his own servants.


    Now to him who is able, by his grace and generosity, to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Those who are with us greet you, as do Euarestus, who wrote the letter, and his whole household.'
translation:
  language: zh_hans
  text: '你们确实要求更详尽地了解有关殉道者的事；但目前，我们已借着我们的弟兄马尔基安努斯，概略地向你们说明了这些事。你们了解这些事以后，也请写信给较远处的弟兄们，使他们也荣耀那位从自己的仆人中施行拣选的主。[a]


    愿荣耀、尊贵、权能和威严永永远远归给那位能借着他的独生子耶稣基督，凭着他的恩典和厚赐，把我们众人带进他永恒国度的主！请问候众圣徒。与我们同在的人问候你们；写这封信的欧阿瑞斯图斯和他全家也问候你们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从自己的仆人中施行拣选”：希腊文直译为“作出对自己仆人的拣选”。此处属格关系可有不同理解；译文按所提供英语见证所反映的“从……中拣选”理解处理，不引申为特定教义体系的表述。
    reason: 保留原句在拣选对象与范围上的语义余地，并更新原脚注中“尚待直接复核”的说法，以反映已依据希腊文传统所作的复核。
lexical_decisions:
- source_word: certified / informed (English witness; Greek review pending)
  choice: 告知
  rationale: 用自然、庄重的现代汉语表达正式传达消息之意，同时不把语气强化为法律意义的“证明”。
- source_word: brother Marcianus
  choice: 弟兄马尔基安努斯
  rationale: 保留早期基督徒群体的亲属式称谓，并按音译处理人名。
- source_word: send the letter about
  choice: 把这封信传给
  rationale: 表达书信在各地群体之间传阅的行动，比字面化的“寄来寄去”更自然。
- source_word: saints
  choice: 圣徒
  rationale: 保留早期基督教文献中对信徒群体的传统称谓，不另行限定其教派含义。
- source_word: only-begotten Son
  choice: 独生子
  rationale: 保留传统基督论用语所承载的独特父子关系；因尚待希腊文复核，不扩展解释其形而上含义。
- source_word: bounty / generosity
  choice: 厚赐
  rationale: 兼顾慷慨与恩惠的语义，并与前面的“恩典”有所区分。
- source_word: house / household
  choice: 全家
  rationale: 在现代汉语中自然表达其整个家属或家户；不武断限定是否包含仆役等成员。
theological_decisions:
- issue: “who maketh election from His own servants”的施事与含义
  choice: 他从自己的仆人中拣选人
  alternative: 他拣选自己的仆人
  rationale: 依据所给英语见证保留“从……中拣选”的结构及其潜在张力，不将其简化为笼统的“拣选仆人”。因直接希腊文审查尚未完成，以脚注标明暂定性。
- issue: 进入永恒国度的方式
  choice: 他能借着他的独生子耶稣基督，凭自己的恩典和厚赐，带领我们众人进入他永恒的国
  alternative: 愿他借着……把我们带入……
  rationale: 保留颂赞句中对上帝能力的陈述，并同时保留“借着子”与“凭恩典和厚赐”两个层面，不将其归并为单一神学公式。
- issue: “众圣徒”的指称
  choice: 众圣徒
  alternative: 所有信徒
  rationale: 采用较贴近早期基督教文献的称谓，避免以解释性译法抹去原有宗教语域。
translation_notes:
  register: 采用现代标准普通话和简体中文，整体保持早期教会书信结尾应有的庄重、亲切与礼仪性。句式适度拆分，以方便普通读者理解；保留“弟兄姊妹”“众圣徒”“独生子”等群体与神学语汇。由于未提供可直接核查的希腊文，本稿以英语公共领域见证为临时源据，并仅在关键歧义处加注。
