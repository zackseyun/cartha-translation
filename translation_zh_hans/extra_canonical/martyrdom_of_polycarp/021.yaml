revisions:
- from: '你们确实要求我们把所发生的事更详尽地告诉你们；不过眼下，我们只是托我们的弟兄马尔基安努斯，把这些事简要地告知了你们。你们了解这些事以后，也请把这封信传给远方的弟兄姊妹，使他们也荣耀主；他从自己的仆人中拣选人。[a]


    愿荣耀、尊贵、权能和威严永永远远归给他！他能借着他的独生子耶稣基督，凭自己的恩典和厚赐，带领我们众人进入他永恒的国。请问候众圣徒。和我们在一起的人都问候你们；执笔写这封信的欧阿瑞斯图斯和他全家也问候你们。'
  to: '你们确实要求更详尽地了解有关殉道者的事；但目前，我们已借着我们的弟兄马尔基安努斯，概略地向你们说明了这些事。你们了解这些事以后，也请写信给较远处的弟兄们，使他们也荣耀那位从自己的仆人中施行拣选的主。[a]


    愿荣耀、尊贵、权能和威严永永远远归给那位能借着他的独生子耶稣基督，凭着他的恩典和厚赐，把我们众人带进他永恒国度的主！请问候众圣徒。与我们同在的人问候你们；写这封信的欧阿瑞斯图斯和他全家也问候你们。'
  rationale: 修订恢复希腊文中“有关殉道者”的明确对象，将“写信”与“转寄本信”区分开来，并重建颂赞语中“归给那位能……”的句法。其余人名、称谓和礼仪性结尾维持现代标准汉语中自然而庄重的表达。
