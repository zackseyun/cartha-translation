base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/004.yaml
  text: 'But thanks be to God; for He truly prevailed against all. For the most noble Germanicus encouraged their fearfulness through the steadfastness that was in him, and he fought with the wild beasts in a remarkable way. For when the proconsul wished to prevail upon him and bade him have pity on his youth, he used force and dragged the wild beast toward himself, desiring more quickly to obtain a release from their unrighteous and lawless life.


    So after this all the multitude, marvelling at the bravery of the God-beloved and God-fearing people of the Christians, raised a cry: “Away with the atheists! Let search be made for Polycarp.”'
translation:
  language: zh_hans
  text: '但感谢上帝，因为他确实在这一切事上得了胜。[a] 那位极其高尚的日耳曼尼库斯，以自己里面的坚忍激励了他们胆怯的心；他与野兽搏斗的情形格外非凡。总督想劝服他，叫他怜惜自己的青春年华；他却用力把野兽拉向自己，渴望更快地从他们这不义、无法无天的生活中解脱出来。[b]


    此后，全体民众惊叹基督徒这群蒙上帝所爱、敬畏上帝之人的勇敢，便高声喊道：“除掉无神论者！搜捕坡旅甲！”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”所指在此并不完全明确；所据英语见证将其理解为上帝，但也可能与紧接着提到的日耳曼尼库斯有关。希腊语文本仍须进一步复核。
    reason: 保存代词指向的真实不确定性，并如实反映当前底本审查状态。
  - marker: b
    text: “他们这不义、无法无天的生活”也可理解为“世人这不义、无法无天的生活”；这里的“解脱”指借死亡脱离这种生活。
    reason: 说明复数代词范围及“解脱”的语境意义，而不把指代或神学含义绝对化。
  - marker: c
    text: 当时一些人称基督徒为“无神论者”，因为他们拒绝敬拜传统诸神。群众先这样指控基督徒，继而要求搜捕坡旅甲。
    reason: 为现代读者解释这一历史称呼，保留原文反讽。
lexical_decisions:
- source_word: γενναιότατος / right noble
  choice: 极其高尚
  rationale: 兼顾最高级语气及其对品格、勇气的赞许，避免误解为世袭贵族头衔。
- source_word: ὑπομονή / constancy
  choice: 坚忍
  rationale: 表达在苦难中坚定承受、毫不退缩，不仅是静态的“恒常”。
- source_word: ἐπισήμως / in a signal way
  choice: 格外非凡
  rationale: 自然表达其搏斗引人注目、不同寻常，同时不添加具体方式。
- source_word: ἀνθύπατος / proconsul
  choice: 总督
  rationale: 采用普通现代读者易懂的罗马行政官称谓；此处不以生硬音译妨碍阅读。
- source_word: ἀπαλλαγῆναι / obtain a release
  choice: 解脱出来
  rationale: 保留脱离现世邪恶生活的意思，不明确化为某一套关于死亡或来世的教义表述。
- source_word: ἄθεοι / atheists
  choice: 无神论者
  rationale: 保留群众对基督徒的历史性指控及后文的反讽张力。
theological_decisions:
- issue: “他确实在这一切事上得了胜”中“他”的指代
  choice: 保留“他”，并用脚注说明指代存在不确定性
  alternative: 明确译作“上帝得胜”或“日耳曼尼库斯得胜”
  rationale: 现有材料标明希腊语直接复核尚待完成；英语见证以大写“He”呈现，但上下文及代词所指仍有解释空间，不宜在正文中擅自消除歧义。
- issue: “God-beloved”表示蒙上帝所爱还是爱上帝
  choice: 译作“蒙上帝所爱”，同时并列保留“敬畏上帝”
  alternative: 译作“爱上帝”
  rationale: 依所供英语见证的被动意义翻译，但以脚注承认原称谓可能具有语义弹性。
- issue: 殉道者主动把野兽拉向自己的神学评价
  choice: 按叙事直译，不作赞许或谴责性的神学扩写
  alternative: 解释为主动求死、献祭或自杀
  rationale: 原段重在叙述其勇敢和渴望脱离不义生活；添加伦理或教义标签会越过文本证据。
translation_notes:
  register: 采用现代、庄重而可朗读的叙事文体；人名“日耳曼尼库斯”“坡旅甲”使用常见汉译。句式保持紧凑，既呈现殉道叙事的力度，也不美化暴力或加入宗派性解释。鉴于用户所供材料注明希腊语复核尚待完成，本稿对关键歧义以脚注明示。
