base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/001.yaml
  text: 'The church of God living as foreigners in Smyrna, to the church of God living as foreigners in Philomelium, and to all the communities of brothers and sisters belonging to the holy and universal church living as foreigners in every place: May mercy, peace, and love from God the Father and our Lord Jesus Christ be multiplied to you.'
translation:
  language: zh_hans
  text: 寄居在士每拿的上帝教会，致寄居在非罗米流的上帝教会，以及寄居各地、属于圣洁而普世教会的所有弟兄姊妹团体：愿从父上帝和我们的主耶稣基督而来的怜悯、平安和爱，丰丰富富地临到你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sojourneth / living as foreigners
  choice: 寄居
  rationale: 保留教会在世如异乡客旅的意味，同时符合现代汉语的庄重书信语体；不把它弱化为单纯“居住”。
- source_word: brotherhoods
  choice: 弟兄姊妹团体
  rationale: 表达信徒共同体的亲属性和群体性；采用包容性的自然现代汉语，而不局限于男性成员。
- source_word: holy and universal Church
  choice: 圣洁而普世教会
  rationale: “普世”传达跨越各地的整体性，并避免现代中文里“天主教会”可能引发的特定宗派指称。
- source_word: be multiplied
  choice: 丰丰富富地临到你们
  rationale: 以自然中文保留祝福不断增多、充盈的语义，而非仅译作“赐给”。
- source_word: Philomelium
  choice: 非罗米流
  rationale: 采用音译以保留古代地名；具体标准译名仍宜在希腊文与地名资料复核时确认。
theological_decisions:
- issue: 教会“寄居”的神学含义
  choice: 在三个相关位置保留“寄居”
  alternative: 住在／位于
  rationale: 该词不仅标示所在地，也可能呈现信徒在世作客旅的自我理解；保留其张力，不将其处理成纯地理说明。
- issue: “普世教会”的范围
  choice: 译为单数“圣洁而普世教会”
  alternative: 各地所有圣洁的教会
  rationale: 见证文本指向一个遍布各地的整体教会；单数表达既保留其合一性，也不导入后世宗派制度含义。
- issue: 祝福的来源
  choice: “从父上帝和我们的主耶稣基督而来的”
  alternative: 愿父上帝和我们的主耶稣基督赐下
  rationale: 保留见证文本中来源短语的结构，不额外界定父与主在赐福行动中的语法关系。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。鉴于所提供的直接依据是公版英语见证，且希腊文审校尚待进行，本稿为审慎的暂定译文；未添加脚注标记，因为正文中没有需要立即以异文或解释性注释处理的内容。
