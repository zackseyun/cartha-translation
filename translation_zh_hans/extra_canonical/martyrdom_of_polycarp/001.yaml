review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了书信的发信者、受信者、三重“寄居”意象，以及恩惠祝祷的来源和内容。不过，“brotherhoods”在中文中处理为“弟兄姊妹团体”带入了原见证未明说的性别包容性措辞；同时，现有“丰丰富富地临到”虽可理解，却没有以最自然的方式表达祝祷式的“be multiplied”。
  naturalness: 整体庄重清晰，但“父上帝”和“丰丰富富地临到你们”不如现代汉语教会书信体中“父神”“多多加给你们”自然。
  terminology: “寄居”“圣洁而普世的教会”均恰当，既保留客旅含义，也避免将“universal/catholic”误指为某一现代宗派。“弟兄姊妹团体”应改为不额外扩展原文性别表达、但仍可自然指称共同体的“弟兄团体”。地名暂保留现行音译，待希腊文及历史地名资料复核。
  issues:
  - severity: medium
    issue: “弟兄姊妹团体”超出所供见证的“brotherhoods”措辞。
    rationale: “弟兄姊妹”在现代中文中可以是善意且常见的包容性表达，但它在此属于解释性扩展。审校应优先保留见证的较简略共同体称谓。
  - severity: low
    issue: “丰丰富富地临到你们”搭配略显生硬。
    rationale: “多多加给你们”是现代庄重书信语体中自然且准确表达“be multiplied”的方式。
  - severity: low
    issue: “父上帝”不够自然。
    rationale: “父神”是现代标准汉语基督教语境中对“God the Father”更自然、简洁的称呼，且不改变神学意义。
  revised_text: 寄居在士每拿的上帝的教会，致寄居在非罗米流的上帝的教会，以及圣洁而普世的教会在各地寄居的一切弟兄团体：愿从父神和我们的主耶稣基督而来的怜悯、平安和爱，多多加给你们。
  revised_footnotes: []
  revision_rationale: 修订限于措辞忠实度与现代汉语书信体：以“弟兄团体”避免增添原见证未明说的性别措辞；以“父神”和“多多加给你们”提高自然度并保留祝祷语气。保留“寄居”及“圣洁而普世的教会”，不把“普世”宗派化。由于直接希腊文审校尚待进行，地名音译不作推测性改动。
