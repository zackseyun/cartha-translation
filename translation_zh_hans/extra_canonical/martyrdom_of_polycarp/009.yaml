base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/009.yaml
  text: 'But when at last he finished his prayer, after remembering everyone who had ever crossed his path—small and great, high and low—and the whole universal Church throughout the world, the hour of departure came. They seated him on a donkey and brought him into the city, since it was a high Sabbath.


    Herod, the captain of police, and his father Nicetes met him. They moved him into their carriage, sat beside him, and tried to persuade him, saying, “What harm is there in saying, ‘Caesar is Lord,’ and offering incense,” along with more words to this effect, “and saving yourself?” At first he gave them no answer. But when they persisted, he said, “I am not going to do what you advise me.”


    Then, having failed to persuade him, they spoke threatening words and made him get out quickly, so that he bruised his shin as he stepped down from the carriage. Without even turning around, he continued promptly and quickly on his way, as though nothing had happened to him, while he was taken to the stadium. There was such an uproar in the stadium that no one’s voice could even be heard.'
translation:
  language: zh_hans
  text: '他终于祷告完了。在祷告中，他记念了所有曾与他相遇的人，无论大小尊卑，也记念了普天下整个教会。离去的时候到了，他们便扶他骑上一头驴，把他带进城；那天正是一个大安息日。[a]


    警务长希律和他的父亲尼西提来迎见他，又把他接到自己的车上。他们坐在他身旁，试图劝服他，说：“只要说‘凯撒是主’，献上香，又有什么害处呢？”他们还说了许多类似的话，劝他“救救自己”。起初，他没有回答。但他们再三坚持，他就说：“你们劝我的事，我决不会做。”


    他们见无法劝服他，便出言威吓，并催逼他赶快下车，以致他下车时撞伤了小腿。他连头也没有回，仍立刻快步前行，仿佛什么事也没有发生。他们把他带到竞技场；场内喧声震天，甚至听不清任何人的声音。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大安息日”的具体所指并不确定；此处依现有见证保留原有称呼，不把它解释为某个特定节期。
    reason: 保留来源中的真实歧义，并提醒读者不要据译文作过度具体的历法判断。
lexical_decisions:
- source_word: all who at any time had come in his way
  choice: 所有曾与他相遇的人
  rationale: 表达凡在其人生道路上与他有过接触的人，避免现代汉语“挡过他的路”所带来的敌对含义。
- source_word: small and great, high and low
  choice: 无论大小尊卑
  rationale: 用凝练而自然的成对表达保留社会地位与重要程度上的全面性。
- source_word: the universal Church throughout the world
  choice: 普天下整个教会
  rationale: 保留普世范围与教会整体两个层面，不将其处理为特定宗派术语。
- source_word: the hour of departure
  choice: 离去的时候
  rationale: 保留“离去”可能同时指启程进城和临近死亡的含蓄张力，不明确改译为“殉道的时候”。
- source_word: captain of police
  choice: 警务长
  rationale: 采用普通读者易懂的职务名称，同时避免套用现代具体警衔。
- source_word: Caesar is Lord
  choice: 凯撒是主
  rationale: 直译政治—宗教效忠宣言，保留其与基督徒认信之间的神学张力。
- source_word: offering incense
  choice: 献上香
  rationale: 保留祭仪行为的含义，不擅自补明献香对象。
- source_word: save thyself
  choice: 救救自己
  rationale: 自然呈现对方以保全性命为由的劝诱，同时保留“救”字可能具有的更深语义回响。
- source_word: stadium
  choice: 竞技场
  rationale: 符合古代公共比赛与审讯处刑场所的语境，比音译或现代“体育场”更为合适。
- source_word: tumult
  choice: 喧声震天
  rationale: 以自然有力的汉语表现现场极度嘈杂，以至人的声音无法辨听。
theological_decisions:
- issue: “离去的时候”是否明确指死亡或殉道
  choice: 保留“离去”的含蓄说法
  alternative: 译作“殉道的时候”或“离世的时候”
  rationale: 所给见证文本使用间接表达；明确化会消除叙事中启程与赴死相互叠映的张力。
- issue: “凯撒是主”的认信性质
  choice: 不加解释地直译为“凯撒是主”
  alternative: 译作“凯撒是我们的主”或加注其为敬拜宣言
  rationale: 原句本身足以呈现冲突；补入所有格或解释会扩大来源明说的内容。
- issue: “大安息日”的具体所指
  choice: 正文保留“大安息日”并加说明性脚注
  alternative: 解释为某个特定犹太节期或地方节日
  rationale: 现有英文见证不足以确定其历法或地方性含义，不宜进行调和或具体化。
translation_notes:
  register: 采用现代、庄重而清晰的叙事体。人名依常见希腊—拉丁姓名音译习惯处理；句式尽量流畅，但保留原文见证中“离去”“凯撒是主”“大安息日”等关键表达的含蓄或张力。本稿依据所提供的公版英文见证及经审核的英文咨询层拟定；由于尚待直接核对希腊文，未对可能涉及希腊词形、职官名称及历法术语的细节作超出证据的断定。
