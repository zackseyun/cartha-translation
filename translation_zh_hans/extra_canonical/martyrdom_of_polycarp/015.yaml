review_pass:
  verdict: revise
  source_fidelity: 需修订。“从大群中选出”将原文的比较/来源意象具体化为拣选动作；“以致灵与身体都复活”也没有充分保留“在基督的杯中，归于灵与身体的永生复活，并在圣灵的不朽中”这一连贯的目标/领域关系。末段荣耀颂宜依英文见证的紧缩句法保留其关系，且不应把“荣耀”明确分配给三位对象。
  naturalness: 整体庄重、通顺，适合祷告体。修订后以“把双手置于背后”“献作供物”“得以有份于”使叙述更自然，并调整长句的层次，避免“同饮……以致……都复活”的因果误读。
  terminology: “柱子”“燔祭”“诸权能”“殉道者”“大祭司”均可保留。“incorruptibility of the Holy Spirit”宜译为“圣灵的不朽性”或“在圣灵的不朽性中”，不加入原见证未明说的“所赐”。方括号内的“你的”必须保留，并保留相应脚注。
  issues:
  - severity: medium
    issue: “犹如从大群中选出的一只上好公羊”加入“选出”
    rationale: 见证文本说“like a noble ram out of a great flock for an offering”，并未明确叙述从羊群中被挑选出来；“选出”会增加一个动作。
  - severity: high
    issue: “同饮[你的]基督的杯，以致灵与身体都复活，得着永生”重组了原句关系
    rationale: 原文见证将“基督的杯”与“归于永生的复活（灵与身体）”及“在圣灵的不朽中”连结。现译的“以致”将其处理成饮杯导致复活的单一因果，且把“不朽”改成“有份”的附带结果。
  - severity: medium
    issue: “在圣灵所赐的不朽中有份”加入“所赐”
    rationale: 英文见证仅为“in the incorruptibility of the Holy Spirit”；“所赐”虽可解释，却是未受文本明确要求的关系性补足。
  - severity: medium
    issue: 末段“愿荣耀借着他，归于你、他和圣灵”过度确定荣耀归属对象
    rationale: 所供见证的“through whom with Him and the Holy Spirit be glory”句法紧缩；应避免正文把它明确作荣耀分别归于三者的结构，并用脚注说明暂存的句法不确定性。
  revised_text: '于是，他们没有把他钉上去，只把他捆住。他把双手置于背后，被绑在柱子上；他犹如大群中的一只上好公羊，献作供物，是预备好了、蒙神悦纳的燔祭。他举目望天，说：


    “主啊，全能的神，

    你所爱、所赐福的儿子耶稣基督的父！

    我们借着他认识了你。

    你是众天使、诸权能和一切受造之物的神，

