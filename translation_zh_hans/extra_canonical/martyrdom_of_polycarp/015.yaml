  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/015.yaml
  text: 'So they did not nail him, but tied him. Then he, placing his hands behind him and being bound to the stake, like a noble ram out of a great flock for an offering, a burnt sacrifice made ready and acceptable to God, looking up to heaven said:


    “O Lord God Almighty, the Father of your beloved and blessed Son Jesus Christ, through whom we have received the knowledge of you, the God of angels and powers and of all creation and of the whole race of the righteous, who live in your presence: I bless you for that you have granted me this day and hour, that I might receive a portion amongst the number of martyrs in the cup of [your] Christ unto resurrection of eternal life, both of soul and of body, in the incorruptibility of the Holy Spirit. May I be received among these in your presence this day, as a rich and acceptable sacrifice, as you did prepare and reveal it beforehand, and have accomplished it, you who are the faithful and true God. For this cause, yea and for all things, I praise you, I bless you, I glorify you, through the eternal and heavenly High-priest, Jesus Christ, your beloved Son, through whom with him and the Holy Spirit be glory both now [and ever] and for the ages to come. Amen.”'
translation:
  language: zh_hans
  text: '于是，他们没有把他钉上去，只把他捆住。他把双手放在背后，被绑在柱子上，犹如从大群中选出的一只上好公羊，预备献上，作蒙神悦纳的燔祭。他举目望天，说：


    “主啊，全能的神，

    你所爱、所赐福的儿子耶稣基督的父！

    我们借着他认识了你。

    你是众天使、诸权能和一切受造之物的神，

    也是活在你面前的全体义人的神。


    我称颂你，

    因为你使我配得今日此时，

    得以在殉道者的行列中有份，

    同饮[你的]基督的杯，[a]

    以致灵与身体都复活，得着永生，

    在圣灵所赐的不朽中有份。


    愿我今日在你面前被接纳在他们中间，

    成为丰盛而蒙悦纳的祭物；

    正如你这信实真实的神

    预先所预备、所启示，

    如今又成全的。


    因此，也为着一切的事，

    我赞美你，称颂你，荣耀你；

    这是借着永恒、属天的大祭司，

    你的爱子耶稣基督。

    愿荣耀借着他，归于你、他和圣灵，[b]

    从现在直到[永远]，并世世无穷。阿们。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号中的“你的”依所供见证保留，表示该词可能属于文本补足或抄本差异；希腊文传统尚待直接复核。
    reason: 保留原始材料明确标出的文本不确定性。
  - marker: b
    text: 这里的荣耀颂句法紧缩，也可理解为：“愿荣耀借着他，并与他和圣灵一同归于你。”现译暂依所供英文见证保留其关系上的歧义，待希腊文复核。
    reason: 避免在源语言审查尚未完成时，擅自确定“借着”“与……一同”及荣耀归属对象之间的关系。
lexical_decisions:
- source_word: tied / bound to the stake
  choice: 捆住／被绑在柱子上
  rationale: 保留处刑动作及固定于刑柱的具体场景；不把 stake 明确化为十字架，以免超出见证文本。
- source_word: noble ram
  choice: 上好公羊
  rationale: “上好”自然表达祭牲优良、合宜的含义，并保留“公羊”这一献祭意象。
- source_word: burnt sacrifice
  choice: 燔祭
  rationale: 采用现代中文读者熟悉的献祭术语，准确传达整牲焚献的意象。
- source_word: powers
  choice: 诸权能
  rationale: 保留其可能指天上权势或灵界存在的含义，不擅自具体化为某一级天使。
- source_word: martyrs
  choice: 殉道者
  rationale: 在早期基督教殉道语境中，该词指以死亡作见证的人；“殉道者”兼顾历史语境和现代可懂度。
- source_word: cup of [Thy] Christ
  choice: '[你的]基督的杯'
  rationale: 保留“杯”的受苦与共同有份意象，并照录方括号所示的文本恢复信号。
- source_word: incorruptibility
  choice: 不朽
  rationale: 传达不腐坏、免于败坏的末世生命状态，避免仅理解为道德上的廉洁。
- source_word: High-priest
  choice: 大祭司
  rationale: 采用通行圣经术语，保留基督作为中保和献祭职分的意象。
theological_decisions:
- issue: “灵与身体”的复活及其与“不朽”的句法关系
  choice: “以致灵与身体都复活，得着永生，在圣灵所赐的不朽中有份”
  alternative: “进入灵与身体的永生复活，在圣灵的不朽中”
  rationale: 使中文可读，同时不把“不朽”只限定于灵或身体；“所赐”属于为通顺而作的关系性补充，未将圣灵与不朽等同。
- issue: “在殉道者中有份”与“基督的杯”的关系
  choice: 并列呈现为进入殉道者行列并同饮基督的杯
  alternative: 把“杯”解释为殉道者所得的奖赏或圣餐之杯
  rationale: 原见证保留受苦、殉道和团契有份的多重回声，不应单一化为圣餐或奖赏。
- issue: 末段荣耀颂的对象与介词关系
  choice: “愿荣耀借着他，归于你、他和圣灵”并加脚注说明
  alternative: “愿荣耀借着他，并与他和圣灵一同归于你”
  rationale: 所供英文见证的“through whom with Him and the Holy Spirit”句法较紧缩，且希腊文复核尚待进行，因此正文采用尽量贴近的表达，并公开保留可能的关系歧义。
- issue: 神预备、启示并成全殉道事件
  choice: 保留“预先所预备、所启示，如今又成全”
  alternative: 弱化为神预知或许可
  rationale: 见证文本明确使用强烈的神圣行动语言；翻译不应为调和神意与人类暴力之间的张力而削弱原话。
translation_notes:
  register: 采用现代、庄重而可诵读的简体中文；祷告中以“你”称神，避免过度古雅。段落按祷告的意义单位排布。由于当前材料明确说明希腊文审查尚未完成，本稿属于依据公版英文见证并参考英文 POB 的暂定稿；所有方括号信号均予保留。
