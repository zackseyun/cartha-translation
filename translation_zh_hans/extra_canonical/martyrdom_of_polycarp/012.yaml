base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/012.yaml
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you repent.” But he said, “Call for them, for repentance from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you repent.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
translation:
  language: zh_hans
  text: '于是，总督说：“我这里有野兽；你若不悔改，我就把你扔给它们。”波利卡普却说：“叫它们来吧！因为从好变坏的这种转变，是我们绝不容许的；但从邪恶转向公义，却是高尚的事。”


    总督又对他说：“你若轻视野兽，又不悔改，我就叫烈火把你烧尽。”波利卡普却说：“你用那只烧一时、不久便熄灭的火来威吓我，却不知道将来审判的火和永远的刑罚；那是为不敬虔的人存留的。你为什么还拖延呢？来吧，任凭你所愿的去做！”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英语见证译出；希腊文抄本传统尚待直接复核。
    reason: 现有任务资料明确说明希腊语源文审查尚未完成，出版草稿须透明标示其文本依据。
lexical_decisions:
- source_word: proconsul
  choice: 总督
  rationale: 此处指罗马行省长官；采用现代读者易懂的职衔，避免较生硬的“资深执政官”。
- source_word: repent / repentance
  choice: 悔改／转变
  rationale: 官长命令中的词译作“悔改”；波利卡普随即利用同一词的“改变、转向”含义作对比，故在解释性的句子中译作“转变”，保留修辞张力。
- source_word: untowardness
  choice: 邪恶
  rationale: 表达与“公义”相对的道德败坏，措辞自然庄重，不把含义缩限为某一种具体罪行。
- source_word: righteousness
  choice: 公义
  rationale: 保留早期基督教伦理与审判语境中的神学分量。
- source_word: ungodly
  choice: 不敬虔的人
  rationale: 既表达对上帝缺乏敬畏，也避免简单等同于一般意义的“坏人”。
theological_decisions:
- issue: “悔改”既可指回头，也可泛指改变方向
  choice: 在官长口中保留“悔改”，在波利卡普的回应中译为“转变／转向”
  alternative: 各处一律译为“悔改”
  rationale: 这样既呈现同一概念的反讽性复用，也使“从好变坏”在现代汉语中通顺，不替文本消除其修辞张力。
- issue: 未来之火与永远刑罚的关系
  choice: 并列译为“将来审判的火和永远的刑罚”
  alternative: 合并为“将来审判中永刑的火”
  rationale: 依所供见证保留两个并列成分，不武断判定它们是同一对象的两个描述还是相关而有别的概念。
- issue: 刑罚为不敬虔者“存留”
  choice: 保留“为不敬虔的人存留”
  alternative: 解释为“上帝特意为不信者预备”
  rationale: 不增添行动主体，也不把“不敬虔”窄化为特定宗派定义下的“不信”。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。对话保持直接有力；使用“你”而非古雅的“汝”，并以“总督”提供足够清楚的罗马行政语境。
