review_pass:
  verdict: revise
  source_fidelity: 稿本整体忠实呈现了叙事推进、基督与殉道者之间敬拜／珍爱的区分，以及对叙事中“那些犹太人”的限定。不过，结尾把“partakers”扩充为“同得基业”，原文见证并无“基业”一词，属于不安全的意义增补。救恩范围的短语也应采用较自然且不预断其复杂修饰关系的中文表达。
  naturalness: “嫉妒、眼红”中的“眼红”偏口语，和本段庄重的殉道叙事文体不协调；“所有得救之人的整个世界”虽意在保留难句，却不合现代汉语。其余句子经过少量调整即可保持现代、庄重且适于朗读的风格。
  terminology: 保留“恶者”“殉道”“不朽的冠冕”“敬拜”“珍爱”“肉身”等核心术语是恰当的。“敬拜”只用于上帝之子、而“珍爱”用于殉道者，准确反映本段刻意作出的区分。人名“尼基特、希律、阿尔刻、坡旅甲”可保留。
  issues:
  - severity: medium
    issue: 结尾增入“同得基业”。
    rationale: “partakers and fellow-disciples with them”表达与他们同有份、同作门徒；所给英文见证及其所据传统在此未出现“基业”。即使这一补充可使句意顺畅，也会引入额外的末世／产业意象。
  - severity: medium
    issue: “所有得救之人的整个世界”不符合自然汉语，并把复杂短语的关系处理得过于生硬。
    rationale: 可译为“为全世界一切得救之人的救恩”，同时以脚注说明该短语的具体修饰关系仍须直接核对希腊文。这样既保留“全世界”与“得救者”两个元素，也避免中文歧义失控。
  - severity: low
    issue: “眼红”语体过于口语。
    rationale: 原文是庄重的道德／神学性修辞；改为“充满嫉妒和妒恨”更适合现代庄重书面语。
  - severity: low
    issue: “在一旁监视”略弱化“也看守／守候”的叙事动作。
    rationale: 改为“也守候着”能自然表达其在火旁阻止取回遗体的行为，而不添加细节。
  revised_text: '**《坡旅甲殉道记》17**


    然而，那充满嫉妒和妒恨的恶者，就是义人一家之仇敌，看见他殉道的伟大、他从起初就无可指责的一生，又看见他怎样戴上不朽的冠冕，赢得无人能够否认的奖赏，便设法使我们连他那可怜的遗体也不能领回，尽管许多人都想这样做，并想触摸他圣洁的肉身。


    于是，他唆使尼基特——希律的父亲、阿尔刻的兄弟——去请求行政长官不要交出他的遗体。据说，理由是：“免得他们离弃那位被钉十字架的，转而敬拜这个人。”这事是在那些犹太人的煽动和再三恳求下发生的；当我们正要从火中取回遗体时，他们也守候着。他们不知道，我们绝不可能在任何时候离弃基督；他为了全世界一切得救之人的救恩[a]而受苦——他本无罪，却为罪人受苦——我们也绝不可能敬拜任何别的一位。


    因为他是上帝的儿子，我们敬拜他；至于殉道者，我们珍爱他们，因为他们是主的门徒和效法者，并且因他们对自己的君王和老师怀有无与伦比的深情，他们配得我们如此珍爱。愿我们也有幸被发现是与他们一同有份、同作门徒的人！[b]'
  revised_footnotes:
  - marker: a
    text: “为了全世界一切得救之人的救恩”依照现有英文见证保留“全世界”与“得救之人”并列出现的复杂结构。该短语究竟是指“为拯救全世界”、还是指“为全世界得救之人的救恩”，仍须直接核对希腊文手稿传统。
    reason: 避免将不寻常的见证文本静默简化为单一的救恩范围解释，并披露尚待完成的源语核对。
  - marker: b
    text: “与他们一同有份、同作门徒”对应“partakers and fellow-disciples with them”。“有份”的具体所指在所提供的英文见证中没有明说；此处不补入“基业”等额外意象。所据为公版英文见证，仍待直接复核希腊文手稿传统。
    reason: 移除原稿无来源的“同得基业”，并说明结尾措辞及当前底本审查限制。
  revision_rationale: 修订仅处理安全且必要的问题：删除结尾无依据的“同得基业”，调整救恩短语为可读而仍保留歧义的中文，并使个别措辞更合庄重文体。基督受敬拜、殉道者受珍爱的原有区分予以保留；关于叙事中犹太人的历史性、限定性表述亦未泛化。
