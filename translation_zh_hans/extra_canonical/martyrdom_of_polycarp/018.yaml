base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/018.yaml
  text: 'But the jealous and envious Evil One, the adversary of the family of the righteous, had seen the greatness of his martyrdom, his blameless life from the beginning, how he was crowned with the crown of immortality, and how he had won a reward that no one could deny. So he arranged that not even his poor body would be taken away by us, although many desired to do this and to touch his holy flesh.


    So he put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to release his body, “lest,” as it was said, “they abandon the crucified one and begin to worship this man.” This was done at the instigation and urgent entreaty of the Jews, who also kept watch when we were about to take it from the fire. They did not know that it will be impossible for us either ever to forsake the Christ who suffered for the salvation of the whole world of those who are saved—though faultless, he suffered for sinners—or to worship anyone else.


    For we adore him because he is the Son of God, but we cherish the martyrs, as disciples and imitators of the Lord, as they deserve because of their matchless affection for their own King and Teacher. May it also be our lot to be found partakers and fellow disciples with them.'
translation:
  language: zh_hans
  text: '**《坡旅甲殉道记》17**


    然而，那嫉妒、眼红的恶者，就是义人一家的仇敌，看见了他殉道的伟大，也看见他从起初就无可指责的一生，以及他怎样戴上不朽的冠冕，赢得了无人能够否认的奖赏，便设法使我们连他那可怜的遗体也不能领回，尽管许多人都想这样做，并想触摸他圣洁的肉身。


    于是，恶者唆使尼基特——希律的父亲、阿尔刻的兄弟——去求行政长官不要交出坡旅甲的遗体。据说，理由是：“免得他们离弃那位被钉十字架的，转而敬拜这个人。”这事是在那些犹太人的煽动和再三恳求下发生的；当我们正要从火中取回遗体时，他们也在一旁监视。他们不知道，我们绝不可能离弃基督；他为了所有得救之人的整个世界[a]受苦——他本无罪，却为罪人受苦——我们也绝不可能敬拜别的任何一位。


    因为他是上帝的儿子，我们敬拜他；至于殉道者，我们珍爱他们，因为他们是主的门徒和效法者。他们对自己的君王和老师怀有无与伦比的忠爱，配得这样的珍爱。愿我们也能有份与他们同得基业，和他们一同作门徒！[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所有得救之人的整个世界”依照现有见证文本保留其不寻常的结构；也可理解为“为拯救全世界”或“为得救者的全世界”。希腊文底本仍需直接校核。
    reason: 保存有关救恩范围及短语修饰关系的真实歧义，并披露当前底本审查状态。
  - marker: b
    text: “有份与他们同得基业”也可较直译为“与他们一同有份”。本稿依据所提供的公版英文见证拟定，尚待对希腊文手稿传统作直接复核。
    reason: 说明结尾“有份者”的宾语在见证文本中未明说，并透明标示翻译依据的限制。
lexical_decisions:
- source_word: Evil One
  choice: 恶者
  rationale: 保留人格化的邪恶对手形象，并以“那……恶者”的语境明确其特指含义；不直接增译为专名“魔鬼”。
- source_word: family of the righteous
  choice: 义人一家
  rationale: 保留亲族、家族式的共同体意象；相较“义人的族类”，“一家”更自然，也不强化种族含义。
- source_word: martyrdom
  choice: 殉道
  rationale: 采用中文基督教与古代殉道文献中通行且清楚的表达。
- source_word: crown of immortality
  choice: 不朽的冠冕
  rationale: 保留原文的冠冕隐喻及“不朽”这一生命状态，不释义为单纯的“永生奖赏”。
- source_word: poor body
  choice: 可怜的遗体
  rationale: “可怜”传达作者对遭焚遗体的怜惜；“遗体”符合死亡后的语境。
- source_word: holy flesh
  choice: 圣洁的肉身
  rationale: 保留对殉道者身体的崇敬语气，同时不暗示其身体本身具有应受敬拜的神性。
- source_word: adore / worship
  choice: 敬拜
  rationale: 在基督与“任何别的一位”两处统一使用“敬拜”，清楚呈现作者所作的对象区分。
- source_word: cherish
  choice: 珍爱
  rationale: 表达尊重与深厚爱戴，同时与只归给上帝之子的“敬拜”明确区分。
- source_word: partakers and fellow-disciples
  choice: 有份与他们同得基业，和他们一同作门徒
  rationale: “有份”本身宾语较含混；补出“同得基业”使中文顺畅，但以脚注说明也可较形式地理解为“与他们一同有份”。
theological_decisions:
- issue: 对基督与殉道者的不同态度
  choice: 基督是上帝的儿子，因此受“敬拜”；殉道者作为主的门徒和效法者而受“珍爱”
  alternative: 把两者都宽泛译作“尊敬”或把对殉道者的态度译成宗派化的“敬礼”
  rationale: 原段有意驳斥基督徒敬拜殉道者的指控；译文须保留敬拜与爱戴之间的明确界线，又不引入后世宗派术语。
- issue: 基督受苦与救恩范围的复杂表述
  choice: 译作“为了所有得救之人的整个世界”并加脚注
  alternative: 简化为“为拯救全世界”或“为所有将要得救的人”
  rationale: 见证文本的短语结构本身不寻常，可能同时牵涉“全世界”与“得救的人”；不宜静默消解其范围张力。
- issue: “本无罪，却为罪人受苦”
  choice: 保留无罪者代罪人受苦的对照
  alternative: 扩写成某种特定的赎罪理论
  rationale: 正文明确陈述无罪与罪人的对照，但未在此界定赎罪机制，因此不作教派化发挥。
- issue: 对当时犹太人的叙述
  choice: 按见证文本保留“那些犹太人”，并限定于本事件中的群体
  alternative: 泛化为所有犹太人，或因现代敏感性而删除该称谓
  rationale: “那些”使所指限于叙事中参与煽动和监视的人，不把责任扩大到整个民族；同时忠实保留古代文本的争议性陈述。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。句式尽量清楚，保留殉道文献的修辞力度与基督／殉道者之间的神学区分。人名按常见音译原则处理：“Nicetes”作“尼基特”，“Herod”作“希律”，“Alce”作“阿尔刻”；“Polycarp”作中文教会史常见译名“坡旅甲”。因所给材料注明希腊文源语复核尚未完成，本稿不声称已完成独立希腊文校勘，并在脚注中明确披露。
