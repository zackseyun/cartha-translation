review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实保留了段落的论证：恶者阻止信徒取回坡旅甲遗体；叙事者否认离弃基督或转而敬拜殉道者；基督受敬拜，殉道者则受珍爱。可是，末句将未明说的“有份”扩展为“同得基业”，属于无依据的内容增补。关于基督为“全世界／得救者”受苦的异常短语，正文的“所有得救之人的整个世界”虽意在保留歧义，却在汉语中错误地将“世界”表述为属于“得救之人”；宜以可读的保守表达并用脚注说明句法问题。
  naturalness: “眼红”偏口语且带现代俗语色彩，不合本段庄重的殉道叙事语体；“义人一家”也稍显生硬。原文的长句可保留庄重节奏，但应使“不可能离弃……也不可能敬拜……”的并列结构更清楚。末句改作“与他们同有份、同作门徒”能避免虚构宾语，且较自然。
  terminology: “恶者”“殉道”“不朽的冠冕”“敬拜”“珍爱”均可保留，恰当地维持了基督与殉道者之间的区别。“被钉十字架的”改为名词性“被钉十字架者”更贴近引语。“官长”比现代行政含义较强的“行政长官”更适合古代文本。人名“坡旅甲、尼基特、希律、阿尔刻”可维持。
  issues:
  - severity: medium
    issue: “有份与他们同得基业”增入“同得基业”
    rationale: 见证文本只有“partakers and fellow-disciples with them”，没有“基业”或相等概念。脚注承认增补仍不足以消除正文越译，须删除。
  - severity: medium
    issue: “为了所有得救之人的整个世界”造成汉语关系误读
    rationale: 此说法易读成“得救者所拥有的世界”，并未恰当呈现见证文本中“whole world / those who are saved / salvation”的异常组合。应采用较保守、可读的措辞，并在脚注保留源语句法及范围关系待核。
  - severity: low
    issue: “眼红”语域不合
    rationale: “眼红”在现代汉语通常口语化，并常含羡慕或嫉妒他人所得的俗语语感；“嫉妒、妒恨”更庄重，且足以表达 jealous and envious。
  - severity: low
    issue: “行政长官”有现代行政语感
    rationale: magistrate 在古代叙事中以“官长”较中性，不预断具体行政或司法职衔。
  revised_text: '**《坡旅甲殉道记》17**


    然而，那嫉妒、妒恨的恶者，就是义人群体的仇敌，看见他的殉道何等伟大，看见他从起初就无可指责的一生，又看见他怎样戴上不朽的冠冕，赢得无人能够否认的奖赏，便设法使我们连他那可怜的遗体也不能取回，尽管许多人都想这样做，也想触摸他圣洁的肉身。


    于是，他唆使尼基特——希律的父亲、阿尔刻的兄弟——去求官长不要把坡旅甲的遗体交给我们。据说，理由是：“免得他们离弃那位被钉十字架者，转而敬拜这个人。”这事是因那些犹太人的煽动和再三恳求而发生的；当我们正要从火中取回遗体时，他们也在一旁看守。他们不知道，我们绝不可能在任何时候离弃基督；他曾为全世界得救者的救恩[a]受苦——他本无罪，却为罪人受苦——我们也绝不可能敬拜任何别的一位。


    因为他是上帝的儿子，我们敬拜他；至于殉道者，我们珍爱他们，因他们是主的门徒和效法者，也因他们对自己的君王和老师怀有无与伦比的爱；这样做是合宜的。愿我们也得以与他们同有份、同作门徒！[b]'
  revised_footnotes:
  - marker: a
    text: “为全世界得救者的救恩”是对现有见证文本中不寻常结构的保守处理；其中“全世界”“得救者”和“救恩”之间的确切句法关系仍有歧义，也可被理解为“为全世界的救恩”或“为得救之人的救恩”。希腊文底本仍需直接校核。
    reason: 避免把“世界”误表述为属于得救者，同时保留救恩范围及修饰关系的不确定性。
  - marker: b
    text: “与他们同有份”按见证文本保留“有份”而不明说其宾语；不可据此增译为“同得基业”。本稿依据所提供的公版英文见证拟定，尚待对希腊文手稿传统作直接复核。
    reason: 删除无来源的“同得基业”，并说明结尾短语的宾语未明说及当前底本限制。
  revision_rationale: 修订删除了“同得基业”这一改变原意的增补，改善了救恩短语在汉语中的可读性而不擅自裁定其有争议的句法关系，并调整若干语域与古代职衔用语。修订仍将“那些犹太人”限定为本叙事中的行动者，未泛化为对整个民族的断言；也继续清楚区分只归于上帝之子的“敬拜”和对殉道者的“珍爱”。
