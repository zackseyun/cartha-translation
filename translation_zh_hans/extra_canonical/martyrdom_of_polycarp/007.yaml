base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/007.yaml
  text: 'Those who were searching for him persisted, so he left for another farm. Immediately, those searching for him arrived. When they did not find him, they seized two young servants, one of whom confessed under torture;


    for it was impossible for him to remain hidden, since the very people who betrayed him were members of his own household. The police captain, who happened to bear the name Herod, was eager to bring him into the stadium, so that he might fulfill his appointed lot by becoming a fellow participant with Christ, while they—his betrayers—underwent the punishment of Judas himself.'
translation:
  language: zh_hans
  text: '搜捕波利卡普的人仍不罢休，他便转往另一处农庄。他们随即追到那里，却没有找到他，就抓住了两个少年奴仆，其中一个受刑后招供了。


    他实在不可能继续隐藏，因为出卖他的正是自己家里的人。警卫队长碰巧也叫希律；他急于把波利卡普押进竞技场，好让波利卡普实现为他所定的命运，与基督一同有分；而那些出卖他的人，则要承受犹大本人所受的刑罚。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公共领域英语译本译出；希腊语原文的直接校勘尚待完成。“为他所定的命运”“警卫队长”等措辞可能在原文复核后调整。
    reason: 来源资料明确注明尚未完成希腊语复核；刊载时应向读者公开这一文本依据限制。
lexical_decisions:
- source_word: those that were in search of him
  choice: 搜捕波利卡普的人
  rationale: 补明上下文中的指称对象，并用“搜捕”表达持续追踪和拘捕的意图。
- source_word: farm
  choice: 农庄
  rationale: 比现代意义较窄的“农场”更适合古代乡间产业或住所的语境。
- source_word: two slave lads
  choice: 两个少年奴仆
  rationale: 保留其奴隶身份及年轻特征；“奴仆”在庄重叙事中自然，也不抹去受支配的社会地位。
- source_word: confessed under torture
  choice: 受刑后招供了
  rationale: 简洁表达供认是在刑讯之下发生，不暗示其为自愿陈述。
- source_word: captain of the police
  choice: 警卫队长
  rationale: 避免使用过于现代制度化的“警察局长”，表达负责拘捕行动的治安武装首领。
- source_word: stadium
  choice: 竞技场
  rationale: 符合古罗马公共竞赛及处刑场所的语境。
- source_word: appointed lot
  choice: 为他所定的命运
  rationale: 保留“所分定的份”与即将临到之结局的意味，避免将其明确解释为某一方直接预定。
- source_word: made a partaker with Christ
  choice: 与基督一同有分
  rationale: 保留宗教性的参与、相交含义，不把原文缩减为单纯模仿基督受难。
- source_word: punishment of Judas himself
  choice: 犹大本人所受的刑罚
  rationale: 保留与出卖耶稣的犹大之间明确而强烈的类比。
theological_decisions:
- issue: “appointed lot”的施事者与神学含义
  choice: 为他所定的命运
  alternative: 完成上帝为他指定的结局／成全他命定的份
  rationale: 现有材料是英语公共领域见证，希腊语复核尚未完成；译文保留被动和一定歧义，不擅自补出“上帝”或建立更强的预定论表述。
- issue: 波利卡普“与基督一同有分”的性质
  choice: 与基督一同有分
  alternative: 成为基督受难的同伴／与基督一同受苦
  rationale: 保留“参与”这一宽广而有神学张力的表达，不限定为殉道功德、救赎参与或仅仅效法。
- issue: 出卖者承受“犹大的刑罚”
  choice: 要承受犹大本人所受的刑罚
  alternative: 遭受像犹大一样的刑罚
  rationale: 依见证保留直接类比，但不进一步界定刑罚的时间、性质或永恒结局。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。为避免代词指向含混，首处及关键转折处补出“波利卡普”；保留殉道叙事中“与基督一同有分”和“犹大的刑罚”的神学张力。由于未提供希腊文本，本稿只能以英语见证为临时桥梁，不能声称已完成原文直译。
