    他实在不可能继续隐藏，因为出卖他的正是他自己家里的人。治安队长恰好名叫希律；他急于把波利卡普带进竞技场，好让波利卡普完成他所分得的那一份，成为与基督有分的人；而那些出卖他的人，则要承受犹大本人所受的刑罚。[a]'
