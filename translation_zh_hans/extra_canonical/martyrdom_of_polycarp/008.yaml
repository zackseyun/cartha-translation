base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/008.yaml
  text: 'So they took the lad with them, and on Friday, about the supper hour, the gendarmes and horsemen went out with their customary arms, hurrying as though against a robber. Arriving together late in the evening, they found the man himself in bed in an upper chamber of a certain cottage. Although he might have departed from there to another place, he would not, saying, “The will of God be done.”


    When he heard that they had come, he went down and conversed with them. The bystanders marveled at his age and constancy, wondering why there should be such eagerness for the apprehension of an old man like him. Thereupon he immediately gave orders that a table be set for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour in which he might pray unmolested.


    When they consented, he stood up and prayed, so full of the grace of God that for two hours he could not hold his peace. Those who heard were amazed, and many repented that they had come against such a venerable old man.'
translation:
  language: zh_hans
  text: '于是，他们带着那少年，在星期五晚饭前后，差役和骑兵携带惯常的兵器出发了，急匆匆的，仿佛要去捉拿强盗。傍晚时分，他们一同赶到，在一所小屋的楼上发现他正躺在床上。他原本可以离开那里，转往别处，却不肯走，只说：“愿上帝的旨意成就。”


    他听说他们来了，就下楼同他们交谈。旁人见他年事已高却如此坚定，都很惊讶，也不明白为什么竟如此急切地捉拿这样一位老人。于是，他立刻吩咐人为他们摆上饭食，让他们在这个时候随意吃喝。他又请求他们给他一个小时，让他不受打扰地祷告。


    他们答应后，他便站起来祷告。他满有上帝的恩典，竟连续两个小时不能停口。听见的人都很惊讶，其中许多人后悔前来捉拿这样一位可敬的老人。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lad
  choice: 少年
  rationale: 保留年龄较轻之意，同时避免“男孩”可能造成过于年幼的印象。
- source_word: gendarmes
  choice: 差役
  rationale: 指奉命执行拘捕任务的武装公差；比现代制度色彩较强的“宪兵”更适合古代语境。
- source_word: constancy
  choice: 坚定
  rationale: 表达面对拘捕仍不动摇的品格，不额外限定为某种教义性的“信心”。
- source_word: upper chamber
  choice: 楼上
  rationale: 以自然现代汉语表达位于房屋上层的房间；上下文无需硬译为“楼房”。
- source_word: grace of God
  choice: 上帝的恩典
  rationale: 保留早期基督教文本的神学用语及其可能兼具神助、恩赐与属灵能力的含义。
- source_word: repented
  choice: 后悔
  rationale: 此处直接宾语是“前来捉拿”这一行动，语境侧重懊悔；不将其强化为完整的宗教性悔改。
- source_word: venerable
  choice: 可敬的
  rationale: 同时传达老人因年高与品格而值得尊敬，语体庄重而自然。
theological_decisions:
- issue: “The will of God be done”的祈愿性质
  choice: 愿上帝的旨意成就
  alternative: 上帝的旨意必成就
  rationale: 英语见证对应祈愿式表达，译作“愿……成就”保留顺服和祈求的语气，不改成确定性的预告。
- issue: “full of the grace of God”的表达
  choice: 满有上帝的恩典
  alternative: 被上帝的恩典充满
  rationale: “满有”既自然又保留恩典在他身上丰盛彰显的开放含义，避免过度具体化为某种瞬间状态。
- issue: “repented”的范围
  choice: 后悔前来捉拿
  alternative: 悔改了，因为他们来捉拿他
  rationale: 语境明确指向对这次拘捕行动的懊悔；采用较中性的“后悔”避免无根据地断言宗教归信。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。由于所提供材料明确标注希腊语源文复核尚待进行，本稿以公共领域英语见证及经审校的英语POB为暂定依据；未添加无法由现有证据确认的异文脚注。时间表达译为“星期五晚饭前后”和“傍晚时分”，叙事节奏清楚；避免使用现代警政制度色彩过强的术语。
