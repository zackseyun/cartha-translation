review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了日期、逮捕、祭司长、行省总督任期与基督永恒王权的纪年对照。惟末句原见证仅有“from generation to generation（世世代代）”，草稿增译“直到永远”，超出了所给见证。另“任总督”未充分表达 proconsulship 是其任期／任内，而非单纯官衔。
  naturalness: 整体庄重通顺，但“散提古月上旬第二日”在现代汉语中不够自然，且“上旬”通常指一个月前十日，不宜用来对应“the first part of the month”。“一个大安息日”略显生硬，可用引号标示这是保留的特殊历法称谓。
  terminology: “坡旅甲”“散提古月”“希律”“特拉勒的腓力”“斯塔提乌斯·夸德拉图”“大祭司”均可保留。“行省总督任内”较准确对应 proconsulship。“威荣”可理解，但“尊大”更直接对应颂赞语中的 greatness，并与“荣耀、尊贵”形成较自然的礼仪性并列。
  issues:
  - severity: medium
    issue: 末句加入“直到永远”
    rationale: 所提供的英文见证止于“from generation to generation. Amen.”；“直到永远”虽符合常见颂赞语，却不是本段所给见证的内容，应删除。
  - severity: low
    issue: “上旬第二日”对“the first part of the month”表达不准确且不自然
    rationale: “上旬”在现代汉语通常是每月一日至十日；应改为“前半月的第二日”，同时以脚注说明这是未换算、待希腊文复核的古代日期表述。
  - severity: low
    issue: “斯塔提乌斯·夸德拉图任总督”弱化 proconsulship 的任期含义
    rationale: 原文是在该人的行省总督任内，宜译作“在……担任行省总督期间”或“在……行省总督任内”。
  - severity: low
    issue: “一个大安息日”略显直硬
    rationale: 该短语是应保留而不协调的特殊称谓；“恰逢一个‘大安息日’”在现代汉语中较自然，也不预断其历法含义。
  revised_text: 蒙福的坡旅甲于散提古月前半月的第二日、三月朔日前第七日，恰逢一个“大安息日”的第八时殉道。[a] 他被希律拘捕；当时特拉勒的腓力任大祭司，斯塔提乌斯·夸德拉图担任行省总督；然而，正是在永恒的君王耶稣基督掌权作王的时候。愿荣耀、尊贵、尊大和永恒的宝座都归于他，世世代代。阿们。
  revised_footnotes:
  - marker: a
    text: “散提古月前半月的第二日”“三月朔日前第七日”“大安息日”和“第八时”均保留所给古代见证的历法与计时说法，未换算为现代日期和钟点。“大安息日”以引号标示其为未加协调的特殊称谓。现稿依据所提供的公版英文见证拟定，尚待希腊文原文复核。
    reason: 保留见证中的古代历法、计时及可能有歧义的称谓；避免在希腊文复核前作无根据的换算或解释。
  revision_rationale: 修订删除了原见证未载的“直到永远”，以恢复末句的范围；将月份的“first part”改为较准确自然的“前半月”，将 proconsulship 明确为行省总督任期，并微调特殊历法称谓与颂赞词，使其在不消除原文歧义的前提下更符合现代庄重书面汉语。
