base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/022.yaml
  text: The blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends of March, on a great Sabbath, at the eighth hour. He was arrested by Herodes, when Philip of Tralles was high priest, during the proconsulship of Statius Quadratus, but during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne, from generation to generation. Amen.
translation:
  language: zh_hans
  text: 蒙福的坡旅甲于散提古月上旬第二日、三月朔日前第七日，在一个大安息日的第八时殉道。[a] 他被希律拘捕；当时，特拉勒的腓力任大祭司，斯塔提乌斯·夸德拉图任总督；然而，那时掌权作王的，乃是永恒的君王耶稣基督。愿荣耀、尊贵、威荣和永恒的宝座都归于他，世世代代，直到永远。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “散提古月”“三月朔日前第七日”“大安息日”和“第八时”均保留古代见证的历法与计时说法，未换算成现代日期和钟点。现稿依据所提供的公版英文见证拟定，尚待希腊文原文复核。
    reason: 资料明确说明直接希腊文审查尚未完成；这些古代日期和时间术语也不宜在证据不足时强行协调或换算。
lexical_decisions:
- source_word: blessed
  choice: 蒙福的
  rationale: 既保留宗教敬意，也符合现代汉语表达，避免译作“圣”而额外赋予正式封圣含义。
- source_word: Xanthicus
  choice: 散提古月
  rationale: 音译古代马其顿历月份名，不擅自折算为现代日期。
- source_word: the seventh before the calends of March
  choice: 三月朔日前第七日
  rationale: 保留罗马历法的逆数日期方式；“朔日”表达每月第一日，脚注提示其历法性质。
- source_word: a great Sabbath
  choice: 一个大安息日
  rationale: 直译并保留原见证中的特殊称谓及其可能的历法歧义，不将其协调为某个现代节日名称。
- source_word: at the eighth hour
  choice: 第八时
  rationale: 保留古代计时术语，不未经来源审查换算为现代钟点。
- source_word: high priest
  choice: 大祭司
  rationale: 按见证原文保留官职称谓，不推断其具体祭仪或政治职能。
- source_word: proconsulship
  choice: 任总督
  rationale: 以普通读者可懂的汉语表达罗马行省长官任期；人名同时保留，避免过度技术化。
- source_word: in the reign of the Eternal King Jesus Christ
  choice: 那时掌权作王的，乃是永恒的君王耶稣基督
  rationale: 显出世俗年代标记与基督永恒王权之间的修辞对照，同时保持自然、庄重。
- source_word: greatness
  choice: 威荣
  rationale: 在颂赞语境中比一般的“伟大”更庄重，并与“荣耀、尊贵”形成自然并列。
theological_decisions:
- issue: 世俗总督任期与基督王权的对照
  choice: 用“然而，那时掌权作王的，乃是……”明确保留对照
  alternative: 直译为“但在永恒君王耶稣基督统治期间”
  rationale: 见证中的“but”具有神学和修辞张力；所选译法不否认历史年代标记，又突出作者宣认的终极王权。
- issue: 末句代词所指
  choice: 译为“归于他”，承接耶稣基督
  alternative: 明确重复“归于耶稣基督”
  rationale: 保留原文代词形式，同时在汉语中指向清楚，不额外展开三一论解释。
- issue: “永恒的宝座”在颂赞中的功能
  choice: 按名词性颂赞保留“永恒的宝座”
  alternative: 解释为“永远坐在宝座上掌权”
  rationale: 不将浓缩的礼仪性语言改写为解释性命题，以免消除原有表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。人名和古代月份名按音译处理；历史官职以普通读者能够理解的称谓呈现。保留殉道纪年、世俗统治与基督永恒王权之间的礼仪性对照。由于所给 drafting basis 是公版英文见证，且希腊文复核仍待进行，本稿属于来源受限的暂定出版草案。
