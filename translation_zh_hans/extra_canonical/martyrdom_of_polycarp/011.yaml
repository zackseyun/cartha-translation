- from: '但总督仍坚持，又说：“要凭凯撒的守护神起誓。”波利卡普回答：“如果你竟以为我会照你所说的，凭凯撒的守护神起誓，并且佯装不知道我是谁，那就听我明明白白地说：我是基督徒。你若愿意了解基督教的教导，就定个日子，听我陈述。”


    总督说：“去说服民众吧。”波利卡普却说：“至于你，我本认为你配得与我交谈；因为我们所受的教导是：对于上帝所设立的君王和掌权者，应当按本分给予尊重，只要这样做不伤害我们[a]。至于这些人，我不认为他们配听我在他们面前为自己申辩。”'
