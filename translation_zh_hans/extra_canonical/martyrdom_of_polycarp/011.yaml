base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/011.yaml
  text: 'But when he persisted and said again, “Swear by the genius of Caesar,” Polycarp answered, “If you vainly suppose that I will swear by the genius of Caesar, as you say, and pretend not to know who I am, then hear me plainly: I am a Christian. But if you wish to learn the teaching of Christianity, appoint a day and grant me a hearing.”


    The proconsul said, “Persuade the people.” But Polycarp said, “I would have considered you worthy of a discussion, for we have been taught to give rulers and authorities appointed by God the honor that is proper, as long as it does us no harm. But I do not consider these people worthy of hearing me defend myself before them.”'
translation:
  language: zh_hans
  text: '但他仍坚持，又说：“要凭凯撒的福祉[a]起誓。”波利卡普回答：“如果你妄想我会如你所说的那样，凭凯撒的福祉起誓，又假装不知道我是谁，那么你就清楚地听着：我是基督徒。你若想了解基督教的教导，就定一个日子，听我讲。”


    总督说：“说服民众吧。”波利卡普说：“我原会认为你值得同我交谈；因为我们所受的教导是：要按所当得的尊荣，尊敬上帝所设立的君王和掌权者，只要这尊敬不伤害我们[b]。至于这些人，我不认为他们配得我在他们面前为自己申辩。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “福祉”译自希腊文τύχη，指“命运、福运”；“凯撒的福祉”是古罗马公共宗教和政治语境中的誓言用语，可能涉及人格化的福运神观念，并非“守护神”。
    reason: 纠正正文原将τύχη译作“守护神”的错误，同时简要保留其历史宗教语境。
  - marker: b
    text: “不伤害我们”也可理解为“不使我们在信仰或良心上受损”；原句所指范围并不完全明确。
    reason: 保留有关向政治权柄致敬之限度的语义开放性，避免在正文中加入特定神学解释。
lexical_decisions:
- source_word: genius of Caesar
  choice: 凯撒的守护神
  rationale: 这里指罗马宗教观念中凯撒的护佑之灵或神灵，不是现代汉语所说的“天才”。译作“守护神”便于普通读者理解，同时保留其异教敬拜背景。
- source_word: Christian
  choice: 基督徒
  rationale: 采用现代汉语中通行、准确的身份称谓。
- source_word: doctrine of Christianity
  choice: 基督教的教导
  rationale: “教导”比“教义”更宽泛，既可指信仰内容，也可指基督徒所传讲的道理，不把原文含义过度体系化。
- source_word: princes and authorities
  choice: 君王和掌权者
  rationale: 保留两类政治权柄的并列表达，并采用读者熟悉的圣经式现代用语。
- source_word: defend myself
  choice: 为自己申辩
  rationale: 表达公开答辩、自我辩护之意，符合审讯及群众面前的语境。
theological_decisions:
- issue: 政治权柄是否被表述为由上帝设立
  choice: 保留“上帝所设立的君王和掌权者”
  alternative: 弱化为“蒙上帝准许的统治者”
  rationale: 所给见证明确说“appointed by God”；直译保留早期基督教文本关于权柄来源的主张，不以解释性措辞弱化。
- issue: 尊重掌权者的限度
  choice: 译作“只要这样做不伤害我们”并加注说明歧义
  alternative: 解释为“只要不损害我们的信仰”或“不违背良心”
  rationale: 见证中的“does us no harm”所指范围并不完全明确；正文保留较宽泛表达，脚注提示可能涉及信仰或良心上的伤害，避免擅自定解。
- issue: 拒绝向民众申辩的含义
  choice: 保留波利卡普对总督与民众的区分
  alternative: 改写为拒绝向暴民传教
  rationale: 文本谈的是是否值得听其申辩，未明确说他拒绝传教；因此不加入额外动机。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对审讯场景中的称谓和论辩保持简洁有力；“凯撒的守护神”保留古罗马宗教背景。由于希腊语原文复核尚待完成，本稿以所给公共领域英文见证为主要依据，并参考已审校的英文POB咨询层。
