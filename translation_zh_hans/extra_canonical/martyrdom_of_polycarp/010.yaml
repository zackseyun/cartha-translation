    他被带到总督面前，总督问他是不是波利卡普。他承认自己就是。总督便劝他否认信仰，说：“想想你的年纪吧！”又照他们惯常的说法讲了其他类似的话：“凭凯撒的护佑神[a]起誓吧！悔改，说：‘除掉无神论者！’”波利卡普神情庄严，环视竞技场里那一大群目无法纪的异教徒，向他们挥了挥手；随后，他叹息着仰望天空，说：“除掉无神论者！”


    总督又竭力逼迫他说：“起誓吧，我就释放你；辱骂基督！”波利卡普回答：“我服侍他已经八十六年，他从未亏待过我。我又怎能亵渎那拯救了我的王呢？”'
