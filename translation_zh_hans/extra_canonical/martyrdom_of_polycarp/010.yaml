base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/010.yaml
  text: 'But as Polycarp entered the stadium, a voice came to him from heaven: “Be strong, Polycarp, and be courageous.” No one saw the speaker, but those of our people who were present heard the voice. At last, when he was brought up, there was a great uproar, for they had heard that Polycarp had been arrested.


    When he was brought before him, the proconsul asked whether he was the man. When he confessed that he was, the proconsul tried to persuade him to deny Christ, saying, “Have respect for your age,” and other such things, as they usually say: “Swear by the genius of Caesar; repent and say, ‘Away with the atheists!’” Then Polycarp, with a solemn expression, looked at the whole crowd of lawless heathen in the stadium and waved his hand toward them. Groaning and looking up to heaven, he said, “Away with the atheists!”


    But when the magistrate pressed him strongly and said, “Swear the oath, and I will release you. Revile the Christ,” Polycarp said, “For eighty-six years I have been his servant, and he has done me no wrong. How then can I blaspheme my King who saved me?”'
translation:
  language: zh_hans
  text: '波利卡普走进竞技场时，有声音从天上传来：“波利卡普，要刚强，要勇敢！”没有人看见说话的是谁，但我们在场的人听见了那声音。最后，他被带上前来时，众人听说波利卡普已经被捕，就大声喧嚷起来。


    他被带到总督面前，总督问他是不是那个人。他承认自己就是。总督便劝他否认，说：“顾惜你的年纪吧！”又照他们惯常的说法讲了其他类似的话：“凭凯撒的福运[a]起誓吧！悔改，说：‘除掉无神论者！’”波利卡普神情庄严，环视竞技场里那一大群目无法纪的异教徒，向他们挥了挥手；随后，他叹息着仰望天空，说：“除掉无神论者！”


    总督再三紧逼他说：“起誓吧，我就释放你；辱骂基督！”波利卡普回答：“我服侍他已经八十六年，他从未亏待过我。我又怎能亵渎那拯救了我的王呢？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凯撒的福运”直译为“凯撒的τύχη”。此词可指福运、命运，也可指其人格化的神圣力量；这里属于罗马帝国宣誓和皇帝崇拜的宗教政治语境。
    reason: 说明 τύχη 的语义范围和历史语境，避免将其固定解释为单一的“守护神”。
lexical_decisions:
- source_word: ἀνδρίζου
  choice: 做个大丈夫
  rationale: 保留“表现得像勇士／男子汉”这一命令的力度，同时与前面的“要刚强”区分；措辞庄重但仍为现代读者所懂。
- source_word: στάδιον
  choice: 竞技场
  rationale: 指公开竞赛和审讯处刑所用的场地；“竞技场”比音译或“体育场”更符合历史语境。
- source_word: ἀνθύπατος
  choice: 总督
  rationale: 此处为罗马行省长官，即 proconsul；正文采用普通读者熟悉的职衔，避免生硬的“代执政官”。
- source_word: τύχη τοῦ Καίσαρος
  choice: 凯撒的护佑神
  rationale: 该短语涉及对凯撒之神圣福运或守护性神灵起誓；此译较“凯撒的运气”更能传达古代宗教政治含义，并以脚注保留语义范围。
- source_word: ἄθεοι
  choice: 无神论者
  rationale: 保留同一称谓的反讽转换：官府要波利卡普用它斥逐基督徒，他却转向异教人群说出同一句话。古代语境中的含义不完全等同于现代哲学意义的无神论。
- source_word: λοιδορήσον τὸν Χριστόν
  choice: 辱骂基督
  rationale: 准确表达公开谩骂、毁谤基督的要求；不用较强神学术语“亵渎”，以便与波利卡普回答中的“亵渎我的王”形成原有措辞差异。
- source_word: δεδουλεύκω
  choice: 我服侍他
  rationale: 动词本有作奴仆、服役之意；“服侍”自然表达长期忠诚归属，同时避免现代“奴役”可能造成的误读。
theological_decisions:
- issue: “八十六年”是年龄还是信主年数
  choice: 我服侍他已经八十六年
  alternative: 我活了八十六年，一直服侍他
  rationale: 原句只明确说服侍基督八十六年，并未说明从出生还是从归信开始；译文保留这一历史与传记上的开放性。
- issue: “除掉无神论者”的指向
  choice: 保留原句，不在正文解释波利卡普所指的人群
  alternative: 把这些无神论者赶走
  rationale: 叙事动作已显示他环视并指向竞技场中的异教人群；直译保留其反讽和戏剧张力，避免正文替读者过度解释。
- issue: 天上声音的身份
  choice: 译作“有声音从天上传来”，不指明说话者
  alternative: 上帝从天上对他说
  rationale: 原叙事明确无人看见说话者，只说声音来自天上；不将其身份确定为上帝、基督或天使。
- issue: “拯救了我的王”中的救恩含义
  choice: 那拯救了我的王
  alternative: 我的救主和君王
  rationale: 保留“王”与关系从句“拯救了我”的原有结构，不将两个称号合并，也不限定拯救仅指属灵或现世层面。
translation_notes:
  register: 采用现代、庄重、可朗读的叙事文体。保留殉道叙事的公开审讯氛围和波利卡普回答中的简洁力度。鉴于所供材料标明希腊文复核仍待完成，本稿参考现存希腊传统中常见措辞并结合所给公共领域英译与英文POB审校层；涉及“凯撒的护佑神”的词义以脚注审慎处理。
