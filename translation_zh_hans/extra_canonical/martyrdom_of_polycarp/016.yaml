    火焰仿佛形成穹顶，好像被风鼓满的船帆，在殉道者的身体周围形成一道墙；他就在火焰当中，却不像正在焚烧的肉，反而像[炉中烘烤的饼，或像]在熔炉中炼净的金银。我们察觉到一股浓郁的芳香，仿佛飘来乳香或别的某种名贵香料的气味。[a]'
