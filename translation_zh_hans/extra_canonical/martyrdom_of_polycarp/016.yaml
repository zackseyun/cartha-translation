base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/016.yaml
  text: 'When he had offered up the Amen and finished his prayer, those tending the fire lit the fire. And a mighty flame flashing forth, we to whom it was given to see saw a marvel; yea, and we were preserved that we might relate to the rest what happened.


    The fire, making the appearance of a vault, like the sail of a vessel filled by the wind, made a wall round about the body of the martyr; and it was there in the midst, not like flesh burning, but like [a loaf in the oven or like] gold and silver refined in a furnace. For we perceived such a fragrant smell, as if it were the wafted odor of frankincense or some other precious spice.'
translation:
  language: zh_hans
  text: '他献上“阿们”，结束祷告以后，司火的人便点燃了火。熊熊烈焰猛然升起；我们这些蒙准亲眼看见的人，看到了一个奇景。我们得以存留下来，为要把所发生的事讲给其余的人听。


    火焰形成穹顶般的形状，好像船帆被风鼓满，在殉道者的身体周围围成一道墙。他就在火焰当中，却不像烧着的肉，反而像[炉中烘烤的饼，又像]在熔炉中炼净的金银。我们闻到一股浓郁的芳香，仿佛飘来乳香或别的某种名贵香料的气味。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段据所提供的公版英文见证暂译，尚待依据希腊文抄本传统直接复核。正文方括号内的文字沿用见证文本的标记，表示可能的文本补复或抄本残缺之处。
    reason: 资料明确说明希腊文审查尚未完成，且要求保留方括号所传达的文本状况；脚注向读者交代译文依据和不确定性。
lexical_decisions:
- source_word: offered up the Amen
  choice: 献上“阿们”
  rationale: 保留献祭性、礼仪性的表达，同时让现代汉语读者明白这是祷告结语。
- source_word: firemen / those tending the fire
  choice: 司火的人
  rationale: 此处不是现代消防员，而是负责点火、照料火堆的人；“司火的人”简洁且符合历史场景。
- source_word: vault
  choice: 穹顶
  rationale: 表现火焰拱起、罩覆的视觉形态，并与随后鼓满的船帆比喻相协调。
- source_word: martyr
  choice: 殉道者
  rationale: 采用通行且庄重的基督教历史用语，不额外加入宗派解释。
- source_word: refined
  choice: 炼净
  rationale: 既表达金银在炉中受炼，也保留原文可能引发的纯净、珍贵意象。
- source_word: frankincense
  choice: 乳香
  rationale: 采用该古代香料在现代中文中的标准名称。
theological_decisions:
- issue: 异象叙事的真实性语气
  choice: 按见证者的陈述直接翻译为“看到了一个奇景”
  alternative: 弱化为“他们认为看见了奇景”或强化为明确神迹
  rationale: 原文以目击者见证的方式叙述，但并未在此句明说其成因；译文既不怀疑化，也不擅自定义为神迹。
- issue: “蒙准看见”所暗示的施予者
  choice: 译作“蒙准亲眼看见”，不明说是谁准许
  alternative: 译作“蒙上帝恩准看见”
  rationale: 保留被动表达中的神学暗示和原有含蓄，不补入原句未明说的主语。
- issue: 见证者“得以存留”的目的
  choice: 保留目的表达“为要把所发生的事讲给其余的人听”
  alternative: 解释为上帝特意保全他们
  rationale: 原文表达了存留与作见证之间的目的关系，却未在此处明确指出行动主体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留目击见证的第一人称复数、火焰的双重比喻及香气意象；避免把古代司火者误译为现代“消防员”。由于目前只有公版英文见证、缺少直接希腊文复核，本稿应视为待校订的出版草案。
