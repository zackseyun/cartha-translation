lexical_decisions:
- source_word: offered up the Amen
  choice: 献上“阿们”
  rationale: 保留献祭性、礼仪性的表达，同时让现代汉语读者明白这是祷告结语。
- source_word: firemen / those tending the fire
  choice: 司火的人
  rationale: 此处不是现代消防员，而是负责点火、照料火堆的人；“司火的人”简洁且符合历史场景。
- source_word: vault
  choice: 穹顶
  rationale: 表现火焰拱起、罩覆的视觉形态，并与随后鼓满的船帆比喻相协调。
- source_word: martyr
  choice: 殉道者
  rationale: 采用通行且庄重的基督教历史用语，不额外加入宗派解释。
- source_word: refined
  choice: 炼净
  rationale: 既表达金银在炉中受炼，也保留原文可能引发的纯净、珍贵意象。
- source_word: frankincense
  choice: 乳香
  rationale: 采用该古代香料在现代中文中的标准名称。
theological_decisions:
- issue: 异象叙事的真实性语气
  choice: 按见证者的陈述直接翻译为“看到了一个奇景”
  alternative: 弱化为“他们认为看见了奇景”或强化为明确神迹
  rationale: 原文以目击者见证的方式叙述，但并未在此句明说其成因；译文既不怀疑化，也不擅自定义为神迹。
- issue: “蒙准看见”所暗示的施予者
  choice: 译作“蒙准亲眼看见”，不明说是谁准许
  alternative: 译作“蒙上帝恩准看见”
  rationale: 保留被动表达中的神学暗示和原有含蓄，不补入原句未明说的主语。
- issue: 见证者“得以存留”的目的
  choice: 保留目的表达“为要把所发生的事讲给其余的人听”
  alternative: 解释为上帝特意保全他们
  rationale: 原文表达了存留与作见证之间的目的关系，却未在此处明确指出行动主体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留目击见证的第一人称复数、火焰的双重比喻及香气意象；避免把古代司火者误译为现代“消防员”。由于目前只有公版英文见证、缺少直接希腊文复核，本稿应视为待校订的出版草案。
