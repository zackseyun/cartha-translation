base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/013.yaml
  text: 'As he said these things and much more, he was filled with courage and joy, and his face was full of grace. Far from falling in dismay at what was said to him, he astonished the proconsul. The proconsul sent his own herald to proclaim three times in the middle of the stadium, “Polycarp has confessed that he is a Christian.”


    When the herald proclaimed this, the whole crowd of Gentiles and Jews living in Smyrna cried out with uncontrollable rage and a loud shout, “This is the teacher of Asia, the father of the Christians, the destroyer of our gods, who teaches many not to sacrifice or worship.” As they said these things, they shouted loudly and asked Philip the Asiarch to release a lion on Polycarp. But he said that he was not permitted to do so, since he had brought the games to an end.


    Then they all agreed to shout that Polycarp should be burned alive. For the vision concerning his pillow had to be fulfilled. He had seen it on fire while he was praying, and he turned and said prophetically to the faithful who were with him, “I must be burned alive.”'
translation:
  language: zh_hans
  text: '他讲了这些话和更多的话，便充满勇气和喜乐，面容满有恩惠；对于人对他说的话，他不但没有惊慌失色，反而使总督大为惊讶。总督便派自己的传令官到竞技场中央，连宣告三次：“坡旅甲已经承认自己是基督徒。”


    传令官这样宣告后，住在士每拿的非犹太人和犹太人全体群众都怒不可遏，高声喊道：“这人就是亚细亚的教师，基督徒的父，摧毁我们众神的人；他教导许多人不献祭，也不敬拜！”他们说着这些话，便大声叫喊，要求亚细亚克[a]腓力放出一头狮子来攻击坡旅甲。但他说，他不能这样做，因为竞技庆典已经结束了。


    于是，他们一致高喊，要把坡旅甲活活烧死。因为关于他枕头的异象必须应验：他祷告时看见枕头着了火，便转身对同他在一起的信徒预言说：“我必须被活活烧死。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚细亚克”译自“Asiarch”（希腊语Asiarchēs），是罗马亚细亚省地方显要人士所担任、与公共庆典相关的古代职衔；其具体职责和权限会随历史情境而异。
    reason: 保留古代职衔的专名性质，避免“长官”一词造成其为一般行政官的误解。
lexical_decisions:
- source_word: countenance was filled with grace
  choice: 脸上也满有恩惠
  rationale: 保留“恩惠/恩典”这一带有宗教意味且可能含义丰富的表达，不将其缩减为单纯的“神态安详”或“面带喜色”。
- source_word: proconsul
  choice: 总督
  rationale: 以现代读者容易理解的职官称谓表达罗马行省长官；正文不采用较生硬的“前执政官”。
- source_word: Gentiles
  choice: 外族人
  rationale: 在犹太人与非犹太人的对举中，采用自然且相对中性的现代汉语表达，避免“异教徒”所附带的宗教判断。
- source_word: the father of the Christians
  choice: 基督徒的父
  rationale: 保留群众指控中的比喻性尊称，不擅自解释为领袖、牧者或创立者。
- source_word: the puller down of our gods
  choice: 毁灭我们众神的人
  rationale: 传达强烈的敌对指控，同时保留“众神”的复数意味。
- source_word: Asiarch
  choice: 亚细亚长官
  rationale: 将古代亚细亚省的地方显要职衔译成可读的中文，并以脚注说明其职能与译名不确定性。
- source_word: sports
  choice: 斗兽表演
  rationale: 下文紧接放狮子的请求，此处所指是竞技庆典中的兽斗项目；译文依上下文具体化，但不扩展为处决程序。
- source_word: must needs
  choice: 必须
  rationale: 保留叙事者所强调的必然性，不解释其背后的神学机制。
- source_word: said prophetically
  choice: 预言说
  rationale: 自然表达其话语具有预告性质，避免加入关于默示方式的额外说明。
theological_decisions:
- issue: 坡旅甲的勇气与喜乐来自何处
  choice: 心里满有勇气和喜乐
  alternative: 圣灵使他充满勇气和喜乐
  rationale: 现有英文见证只表达他受到鼓舞或被充满，未明确指出施事者；不擅自补入“圣灵”。
- issue: “脸上满有恩惠”的含义
  choice: 保留“恩惠”措辞
  alternative: 译为“面容安详可亲”
  rationale: 原表述可能兼有外在神态与神所赐恩惠的意味，应保留张力，不纯粹心理化。
- issue: 异象“必须应验”的必然性
  choice: 直接保留“必须应验”
  alternative: 解释为上帝预定其殉道方式
  rationale: 文本陈述异象必然实现，却没有在此明确说明预定、护理或因果关系，故不作教义化展开。
- issue: 群众称其为“基督徒的父”
  choice: 按比喻直译
  alternative: 译为“基督徒的领袖”
  rationale: “父”可能含权威、教导与属灵关系等多层意味，直译可避免窄化。
translation_notes:
  register: 采用现代、庄重而顺畅的叙事语体。人名“坡旅甲”和地名“士每拿”沿用常见基督教文献译名。由于希腊文源语复核尚待完成，本稿以所提供的公版英文见证为主要证据，并参考英文POB作为审校层；对施事者、职衔与神学必然性均避免过度确定。
