    where the Lord will permit us to gather ourselves together, as we are able, in gladness and joy, and to celebrate the birth-day of his martyrdom for the commemoration of those that have already fought in the contest, and for the training and preparation of those that shall do so hereafter.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/019.yaml
  text: 'Therefore, when the centurion saw the opposition raised by the Jews, he placed Polycarp in the middle and burned him according to their custom.


    Afterward, we took up his bones, which are more valuable than precious stones and finer than refined gold, and laid them in a suitable place;


    there the Lord will permit us to gather together, as we are able, with gladness and joy, and to celebrate the birthday of his martyrdom, in remembrance of those who have already fought in the contest and for the training and preparation of those who will do so hereafter.'
translation:
  language: zh_hans
  text: '于是，百夫长见犹太人提出反对，就把坡旅甲的遗体置于当中，照他们的惯例焚烧了。


    后来，我们收拾起他的遗骨；这些遗骨比宝石更贵重，比精炼的金子更珍贵。我们把它们安放在一个合宜的地方。


    在那里，主必让我们尽可能欢欣喜乐地聚集，一同纪念他殉道的诞辰[a]，追念那些已经在这场竞赛中奋战过的人，并使那些将来要如此奋战的人得到操练和预备。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殉道的诞辰”指他殉道的日子；早期基督徒有时把殉道者死亡之日称为“诞辰”。
    reason: 说明“诞辰”在此不是指肉身出生之日，并保留正文的特殊历史用语及其意象。
lexical_decisions:
- source_word: centurion
  choice: 百夫长
  rationale: 采用现代中文中通行且准确的罗马军职名称。
- source_word: bones
  choice: 遗骨
  rationale: 上下文所指为殉道者焚烧后被收拾、安放的骨骸；“遗骨”自然庄重。
- source_word: birth-day of his martyrdom
  choice: 他殉道的诞辰
  rationale: 保留早期基督徒把殉道之日称为“诞辰”的特殊表达及其张力，不直接解释成忌日或周年纪念日。
- source_word: fought in the contest
  choice: 奋战过
  rationale: 保留竞赛兼战斗的意象，同时避免生硬地限定为某一种竞技活动。
- source_word: training and preparation
  choice: 操练并预备
  rationale: 呈现两个彼此相关而不完全相同的概念，保持劝勉性质。
theological_decisions:
- issue: 殉道之日被称为“诞辰”
  choice: 正文保留“殉道的诞辰”，脚注简要说明
  alternative: 译作“殉道纪念日”或“殉道周年”
  rationale: “诞辰”承载原文传统中殉道进入新生命的隐含意象；改成一般纪念日会消除这一神学张力。
- issue: 聚集能否实现与主的许可
  choice: 译作“只要条件许可，主会准许我们”
  alternative: “主会准许我们尽可能地聚集”
  rationale: 英语见证的修饰关系略有歧义；本译文将“as we are able”理解为现实条件所许可的程度，同时保留聚集有赖于主许可的表述。
- issue: 对遗骨的高度珍视
  choice: 直接保留价值比较，不增添敬拜、圣物功效等解释
  alternative: 按后世圣物神学加以阐释
  rationale: 文本表达珍视与妥善安放，但本身没有明确陈述敬拜或遗骨具有神奇功效，不应引入后世宗派立场。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。鉴于所提供材料明确说明尚待希腊文复核，本稿以公共领域英文见证为暂定依据；对代词所指作最低限度澄清，将被焚烧者表达为“坡旅甲的遗体”，但不扩展叙事。
