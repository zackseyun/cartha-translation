lexical_decisions:
- source_word: God speed
  choice: 愿你们平安顺遂
  rationale: 以自然的现代汉语表达祝愿对方蒙福、行程顺利的古老问候，不机械译作“神速”或仅限于旅途的“顺风”。
- source_word: the word of Jesus Christ which is according to the Gospel
  choice: 那合乎福音的耶稣基督之道
  rationale: 保留“道/话语”与“福音相符”的修饰关系，同时使汉语句法清楚。
- source_word: be found in the kingdom
  choice: 在……国里被寻见
  rationale: 保留原文较具末世审判意味的被动表达，不弱化为单纯“进入”。
- source_word: catholic rule of the Church
  choice: 教会的大公信仰准则
  rationale: 用“大公”表达普世、共同之义，并以脚注避免被误解为专指后世罗马天主教。
- source_word: gather
  choice: 聚集
  rationale: 保留前后相应的聚集意象，而不改写成较抽象的“接纳”或“使进入”。
- source_word: papers
  choice: 文稿
  rationale: 在抄传语境中比现代行政意味较强的“文件”自然，也不武断限定为卷册形制。
- source_word: firstborn of Satan
  choice: 撒但的长子
  rationale: 保留尖锐的亲属隐喻和“firstborn”的字面力度，不释义为“首要仆役”。
theological_decisions:
- issue: “with whom / through whom”在颂荣句中的关系
  choice: 借着他，愿荣耀归于神
  alternative: 愿荣耀与神同归于他
  rationale: 所给英语见证的“with whom be glory to God”句法不寻常；译文采用较可能的中介性理解，同时避免把基督与神的关系扩写为原文未明说的教义公式。因希腊文尚待复核，此处仍属暂定。
- issue: 选民得救与神的作为
  choice: 因为他拯救了自己的圣洁选民
  alternative: 为了他圣洁选民的救恩
  rationale: 现代汉语中前者较自然，并保留救恩属于神主动作为的意义；不进一步界定拣选论。
- issue: 颂荣对象及三一措辞的抄本差异
  choice: 分别保留“父和圣灵”与“父、子、圣灵”两种形式
  alternative: 统一为完整三一公式
  rationale: 两个传本形式本身不同，不应为神学整齐而消除真实的文本差异。
- issue: “圣者”称谓
  choice: 按原见证保留“圣波利卡普”“这位圣者”
  alternative: 删去“圣”以避免圣徒崇敬联想
  rationale: 这是文献自身的尊称和历史用语；保留并不额外引入后世宗派性的圣徒神学。
- issue: 异象中的显现
  choice: 波利卡普曾在异象中向我显现
  alternative: 我在启示中看见波利卡普
  rationale: 贴近见证文本所述的主体关系，同时不对异象的性质或权威作超出文本的判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。抄传题记保留第一人称与文献传承链条；重复段落完整保留。人名采用较易辨认的现代音译：波利卡普、爱任纽、该犹、苏格拉底、皮奥尼乌斯、伊索克拉底、马吉安；地名用哥林多、罗马、士每拿。由于提供材料明确注明希腊文审校尚未完成，本稿为可出版格式的暂定译稿，不掩饰底本文本与抄本问题。
