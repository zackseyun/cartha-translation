translation:
  language: zh_hans
  text: '【第二十二章】


    弟兄们，愿你们平安顺遂，照着那合乎福音的耶稣基督之道行事。借着他，愿荣耀归于神，因为他拯救了自己的圣洁选民。蒙福的波利卡普就是这样殉道的；愿我们也能跟随他的脚踪，在耶稣基督的国里被寻见。


    这篇记述是该犹从波利卡普的门徒爱任纽的文稿中抄录的。该犹也曾与爱任纽同住。


    我苏格拉底在哥林多照着该犹的抄本把它誊写下来。愿恩典与众人同在。


    我皮奥尼乌斯又照着上述抄本把它誊写下来。我曾寻访这份抄本——因为蒙福的波利卡普曾在异象中向我显现，这事我会在下文说明——找到时，它因年代久远，已经几乎残破不堪。于是我把它整理成篇，好让主耶稣基督也把我和他的选民一同聚集到他的天国里。愿荣耀归于他，也归于父和圣灵，直到永永远远。阿们。


    以下三段是莫斯科抄本所载的文本：[a]


    这篇记述是该犹从爱任纽的文稿中抄录的。该犹曾与爱任纽同住；爱任纽则是圣波利卡普的门徒。波利卡普主教殉道时，爱任纽正在罗马，教导了许多人。他有许多极其优秀、信仰纯正的论著流传于世。在这些著作中，他提到波利卡普，说自己曾受过波利卡普的教导。他有力地驳斥了各种异端，并把教会的大公信仰准则[b]照着自己从这位圣者所领受的传承下来。他还记载了这样一件事：有一次，马吉安——马吉安派就是以他的名字得名——遇见圣波利卡普，对他说：“波利卡普，认出我们吧！”波利卡普回答马吉安说：“不错，我认得你，你是撒但的长子。”爱任纽的著作中还记载：波利卡普在士每拿殉道的那一天、那一时刻，爱任纽正在罗马城，听见一个仿佛号角的声音说：“波利卡普殉道了！”


    这样，正如上文所说，该犹从爱任纽的这些文稿中抄录了一份；伊索克拉底又在哥林多照着该犹的抄本另抄了一份。


    我皮奥尼乌斯又照着伊索克拉底的抄本把它誊写下来。我顺从圣波利卡普在异象中的指示，寻得了这份抄本；找到时，它因年代久远，已经几乎残破不堪，于是我把它整理成篇，好让主耶稣基督也把我和他的选民一同聚集到他的天国里。愿荣耀归于他，也归于父、子、圣灵，直到永永远远。阿们。


    [a] 本段以下保存的是莫斯科抄本的异文形式，与前面几段内容部分重复，并有若干扩充。


    [b] “大公”在这里指普世、共同的教会信仰，并非特指后世某一宗派。


    [c] 本译稿依据所提供的公版英语见证译成；希腊文原典尚待直接复核，因此人名、句法关系和若干抄本细节均属暂定。[c]'
