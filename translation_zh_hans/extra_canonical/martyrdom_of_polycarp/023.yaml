review_pass:
  verdict: revise
  source_fidelity: 需修订。首段将“with whom be glory to God”释作“借着他，愿荣耀归于神”，把见证中不寻常且关系未明的“with”改成了工具性“借着”；又将“for the salvation”改写为完成式“因为他拯救了”，均超过了见证所明示的意思。宜保留颂荣关系和“救恩”名词表达的开放性。其余抄传链、莫斯科抄本异读、称谓及尖锐历史引语均基本忠实保留。
  naturalness: 整体庄重、通顺，适合古代殉道记题记。首段改为“愿荣耀归于神，也归于他，为着他圣洁选民的救恩”，虽仍反映英语见证的句法歧义，但汉语可读且不虚构中介关系。“莫斯科抄本中，以上三段作如下读法”比“以下三段是……所载的文本”更准确说明它是前文三段的异读。
  terminology: 人名、地名和“殉道”“异象”“大公”等用语一致。将“catholic rule of the Church”译作“教会的大公准则”，避免无依据增添“信仰”，并以脚注说明“大公”的历史语义。保留“撒但的长子”及两种颂荣公式的传本差异。
  issues:
  - severity: medium
    issue: 首段“with whom”被译为“借着他”
    rationale: 英语见证使用“with whom”，不是“through whom”；原语直接复核尚待进行时，不应把含混或不寻常的关系固定为中介性。
  - severity: medium
    issue: “for the salvation of his holy elect”被译为“因为他拯救了自己的圣洁选民”
    rationale: 原见证是“为着……的救恩”的名词短语，并未明说完成的“拯救了”，也不应由译文预先判定代词指向和动作时态。
  - severity: low
    issue: “catholic rule of the Church”译作“教会的大公信仰准则”
    rationale: “信仰”虽可由上下文推知，却不是见证明示词；“教会的大公准则”较贴近且保留其范围。
  - severity: low
    issue: 脚注[c]属于译稿制作过程说明而非本文注释
    rationale: 底本限制可保留在版本元数据或译者说明中，不宜作为段末带锚点的正文脚注；移除后不影响原文内容或必要的异文说明。
