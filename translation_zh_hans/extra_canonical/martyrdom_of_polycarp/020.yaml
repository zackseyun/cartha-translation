review_pass:
  verdict: revise
  source_fidelity: 草案总体忠实于所提供的英文见证，保留了殉道、竞技冠冕、身体与灵魂、航海和牧养等关键意象。鉴于希腊文手稿传统尚待直接复核，本次判断以英文见证为主要依据；修订避免把首句的叙述性结果误译为“成就殉道”的人为措辞，并补足“我们身体”的所属关系。
  naturalness: 原译整体庄重通顺，但“就是这样成就了他的殉道”在现代汉语中略显生硬，且弱化了“如此临到/发生于”的叙述语气。“照着基督福音的典范”也稍不自然，改为“照着基督福音的样式”较顺畅，同时保留原有开放性。
  terminology: “坡旅甲”“非拉铁非”“士每拿”“殉道”“不朽的冠冕”“普世教会”均可保留。“全能的上帝，就是父”将英文见证中 God and Father 的并列称谓表达为同一位神的称谓，避免汉语“上帝和父”被理解为两位对象；此处不添加超出见证的教义解释。
  issues:
  - severity: medium
    issue: 首句“蒙福的坡旅甲就是这样成就了他的殉道”不够贴合见证的叙述句式。
    rationale: 英文为“So it befell ... Polycarp”，重点是“事情如此临到/发生在坡旅甲身上”，不是说他主动“成就”自己的殉道。改为“蒙福的坡旅甲的遭遇正是如此”可保留叙述效果。
  - severity: low
    issue: “身体的舵手”遗漏了原文见证中的第一人称所属关系。
    rationale: 英文为“helmsman of our bodies”；应译作“我们身体的舵手”，与“我们灵魂的救主”保持对应。
  - severity: low
    issue: “照着基督福音的典范”搭配略生硬。
    rationale: “照着……的样式”更符合现代汉语，仍保留该措辞可能同时涉及福音信息与福音叙事范式的开放性。
  revised_text: '于是，蒙福的坡旅甲的遭遇正是如此：他与那些从非拉铁非来的人一同在士每拿殉道，共有十二人。他比其他人更受众人纪念，以致各地的外邦人也谈论他。因为他显明自己不仅是一位卓越的教师，也是一位杰出的殉道者；人人都渴望仿效他的殉道，因为他的殉道是照着基督福音的样式。


    他凭着忍耐，在争战中胜过了那不义的统治者，因而得着不朽的冠冕。如今，他与使徒和所有义人一同欢喜，荣耀全能的上帝，就是父，并颂赞我们的主耶稣基督——我们灵魂的救主、我们身体的舵手，以及遍及全世界之普世教会的牧者。[a]'
  revised_footnotes:
  - marker: a
    text: 本译文依据所提供的公版英文见证文本拟定；希腊文手稿传统的直接复核尚待完成。因此，“照着基督福音的样式”“我们身体的舵手”等措辞暂按该见证所保留的意象翻译。
    reason: 资料明确说明尚未完成希腊语原文复核，出版草案应向读者披露文本基础与暂定性质。
  revision_rationale: 修订只处理可安全确定的忠实度和汉语表达问题：首句恢复“如此临到”的叙述功能；“仿效”“样式”提升现代汉语自然度；补回“我们身体”的人称所属；并以“上帝，就是父”避免把同一位神的称谓误读为两个受荣耀的对象。其余表达及脚注披露均予保留，不对尚待希腊文复核的语义争议作超前限定。
