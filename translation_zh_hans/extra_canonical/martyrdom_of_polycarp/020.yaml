base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/020.yaml
  text: 'So it happened to the blessed Polycarp, who suffered martyrdom in Smyrna together with those from Philadelphia—twelve in all. He is remembered by everyone more than the others, so that even pagans everywhere speak about him. For he showed himself to be not only a notable teacher but also a distinguished martyr, whose martyrdom everyone desires to imitate, since it followed the pattern of the gospel of Christ.


    By his endurance he overcame the unrighteous ruler in the conflict and thus received the crown of immortality. He rejoices in the company of the apostles and all righteous people, glorifies the almighty God and Father, and blesses our Lord Jesus Christ, the Savior of our souls, the helmsman of our bodies, and the shepherd of the universal church throughout the world.'
translation:
  language: zh_hans
  text: '于是，蒙福的坡旅甲就是这样成就了他的殉道。他与那些从非拉铁非来的人一同在士每拿殉道，共有十二人。他比其他人更受众人纪念，甚至各地的外邦人也谈论他。因为他显明自己不仅是一位卓越的教师，也是一位杰出的殉道者；人人都渴望效法他的殉道，因为那是照着基督福音的典范。


    他凭着忍耐，在争战中胜过了那不义的统治者，因而得着不朽的冠冕。如今，他与使徒和所有义人一同欢喜，荣耀全能的上帝和父，并颂赞我们的主耶稣基督——我们灵魂的救主、身体的舵手，以及遍布全世界之普世教会的牧者。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文依据所提供的公版英文见证文本拟定；希腊文手稿传统的直接复核尚待完成。因此，“基督福音的典范”“身体的舵手”等措辞暂按该见证所保留的意象翻译。
    reason: 资料明确说明尚未完成希腊语原文复核，出版草案应向读者披露文本基础与暂定性质。
lexical_decisions:
- source_word: blessed
  choice: 蒙福的
  rationale: 保留早期基督教敬称的宗教含义，同时避免译成可能暗示正式封圣制度的称号。
- source_word: suffered martyrdom
  choice: 殉道／成就了他的殉道
  rationale: “殉道”是现代汉语中自然且准确的教会历史用语；首句稍作展开，以表达事件的完成。
- source_word: heathen
  choice: 外邦人
  rationale: 在早期基督教语境中指信仰群体之外、尤其非基督徒的人；比带贬义的“异教徒”更为中性。
- source_word: after the pattern of the Gospel of Christ
  choice: 照着基督福音的典范
  rationale: 保留“福音”既可指基督所宣告的信息，也可能指福音叙事中基督受难榜样的张力，不擅自限定。
- source_word: crown of immortality
  choice: 不朽的冠冕
  rationale: 保留竞赛得冠冕与永生奖赏的意象。
- source_word: helmsman
  choice: 舵手
  rationale: 直译航海隐喻，保留基督引导并掌管身体的形象。
- source_word: universal Church
  choice: 普世教会
  rationale: 表达遍及世界的整体教会，不导入后世宗派或制度性的特定含义。
theological_decisions:
- issue: “照着基督福音的典范”所指为何
  choice: 保留“福音的典范”这一较开放的表达
  alternative: 译为“效法基督受难的福音记载”
  rationale: 现有材料只有英文见证文本，且希腊语复核尚待完成；不宜把可能兼具信息、叙事和榜样含义的措辞收窄。
- issue: 死后与使徒和义人一同欢喜的时态
  choice: 译为“如今，他……一同欢喜”
  alternative: 不加“如今”，只译“他……欢喜”
  rationale: 英文见证使用现在时；加入“如今”使汉语时态自然，但不进一步界定中间状态或末世次序。
- issue: “我们灵魂的救主、身体的舵手”
  choice: 按所供见证分别保留“灵魂”与“身体”
  alternative: 概括为“拯救并引导我们全人的主”
  rationale: 原见证的身体—灵魂并列具有神学与修辞意义，应予保留，不将其系统化解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留殉道叙事中的竞技、冠冕、航海和牧养意象；避免文言化时态词和后世宗派术语。地名采用基督教中文传统中较通行的“非拉铁非”“士每拿”，人名采用“坡旅甲”。
