base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/002.yaml
  text: 'Brethren, we write unto you an account of what befell those who suffered martyrdom, and especially the blessed Polycarp, who stayed the persecution, having, as it were, set his seal upon it by his martyrdom. For nearly all the foregoing events came to pass that the Lord might show us once more an example of martyrdom conformable to the Gospel.


    For he lingered that he might be delivered up, even as the Lord did, to the end that we too might be imitators of him, looking not only to that which concerns ourselves, but also to that which concerns our neighbors. For it is the office of true and steadfast love not only to desire that oneself be saved, but all the brethren also.'
translation:
  language: zh_hans
  text: '弟兄们，我们写信把那些殉道者所遭遇的事告诉你们，尤其是蒙福的坡旅甲所遭遇的事。他借着自己的殉道，仿佛为这场迫害盖上了印，使迫害止息。以上差不多所有的事之所以发生，是要让主再次向我们显明一个合乎福音的殉道榜样。


    他等候在那里，好让自己被交出去，正如主所做的一样，为要使我们也效法他，不单顾自己的事，也顾邻舍的事。因为真实而坚定的爱，不只希望自己得救，也希望众弟兄都得救。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文暂依据所提供的公版英文见证译出；希腊文抄本传统的直接校勘尚待完成。因此，个别措辞（特别是“使迫害止息”“等候在那里”及相关代词的指向）日后可能按希腊文证据修订。
    reason: 用户明确说明希腊文原文审查尚未完成；刊行草案应透明标示当前证据基础及主要不确定处。
lexical_decisions:
- source_word: brethren
  choice: 弟兄们
  rationale: 保留早期基督徒书信中的群体称呼；在现代中文中自然庄重，也可按古代惯例涵盖整个信徒群体。
- source_word: suffered martyrdom
  choice: 殉道者／殉道
  rationale: 用现代中文教会与历史叙述中通行的表达，既传达为信仰作见证，也保留因见证而死的语境。
- source_word: stayed the persecution
  choice: 使迫害止息
  rationale: 按所提供见证的直接语义翻译，避免弱化为仅仅“忍受”或“延缓”迫害。
- source_word: set his seal upon it
  choice: 为这场迫害盖上了印
  rationale: 保留“印”的形象，并用“仿佛”表明这是比喻；所指对象依当前句法理解为这场迫害。
- source_word: conformable to the Gospel
  choice: 合乎福音的
  rationale: 简洁保留殉道方式以福音为规范或与福音相称的含义，不展开为特定教义解释。
- source_word: linger(ed)
  choice: 等候在那里
  rationale: 体现他没有急于逃避、而是等候被交出的叙事含义，同时不额外断定其动机细节。
- source_word: delivered up
  choice: 被交出去
  rationale: 保留与主耶稣受难叙事相呼应的措辞及其被动意味，不擅自具体化为“被捕”或“被出卖”。
- source_word: neighbors
  choice: 邻舍
  rationale: 采用现代圣经汉语中熟悉而庄重的伦理用语，范围不局限于住处相邻的人。
theological_decisions:
- issue: 坡旅甲与主受难之间的类比
  choice: “正如主所做的一样”
  alternative: “像主一样”或明确写成“正如主耶稣等候被交出”
  rationale: 保留文本明确建立的效法关系，但不添加原见证未明说的名字或更具体的受难细节。
- issue: 殉道“合乎福音”的意义
  choice: 保留“合乎福音”而不加解释
  alternative: 译为“照着福音所记的方式”或“符合福音教训”
  rationale: 原表达可能兼有与福音叙事相似及符合福音规范之意；直译可保存这层张力。
- issue: “得救”的范围
  choice: “自己得救……众弟兄都得救”
  alternative: “获救”“脱险”或解释为永恒救恩
  rationale: 保留“得救”在处境性拯救与神学性救恩之间可能具有的语义张力，不把它缩限为逃脱迫害或明确规定为终末救恩。
- issue: 谁是效法对象
  choice: “使我们也效法他”保留单数代词
  alternative: 明确写成“效法坡旅甲”或“效法主”
  rationale: 所提供见证中的代词在近距离上指向坡旅甲，但其行为又以主为典范；保留代词可避免过度消解这种层叠的效法关系。
translation_notes:
  register: 采用现代、庄重而易懂的书信与殉道叙事语体。句式适度拆分以符合普通话阅读习惯，同时保留“盖上了印”“被交出去”“邻舍”等关键圣经意象和互文措辞。因当前仅有公版英文见证而无可直接核验的希腊文本，本稿属于来源受限的暂定译文。
