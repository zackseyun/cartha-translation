review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确传达了所给英文见证，并保留了本段的重要互文和神学张力。不过，“他等候在那里”中的“在那里”并无来源依据；“以上差不多所有的事”也将“nearly all the foregoing events”处理得不够准确、自然。修订为“前面所述的事几乎全都发生了”，并删除无根据的地点性补足。
  naturalness: 整体为自然、庄重的现代汉语。“把……所遭遇的事告诉你们”可更紧凑地改为“把……的事写信告诉你们”。“不单顾自己的事，也顾邻舍的事”可用“顾念”更清楚地表达原文的关切／留意，而非单指处理事务。
  terminology: “弟兄们”“蒙福的坡旅甲”“殉道”“合乎福音”“被交出去”“邻舍”“得救”等术语均可保留。“仿佛以自己的殉道为这场迫害盖上了印”较好保留了“seal”的比喻及其对迫害的指向，且不预设额外神学解释。
  issues:
  - severity: medium
    issue: “他等候在那里”加入了“在那里”
    rationale: 英文见证仅称他“linger[ed]”，没有提供地点信息；“在那里”属于无依据的叙事性补足，应删除。
  - severity: low
    issue: “以上差不多所有的事”对“nearly all the foregoing events”的表达不够准确自然
    rationale: “以上”在现代汉语中较像书面条目指示，“差不多所有”也略显含混。用“前面所述的事几乎全都”既对应“foregoing events”，也自然保留“nearly all”的限定。
  - severity: low
    issue: “不单顾自己的事，也顾邻舍的事”可能偏向事务处理
    rationale: 见证中的“looking to that which concerns”在此强调关切、顾念。改为“顾念自己的事……顾念邻舍的事”更贴近伦理语境，同时保留原有的概括性。
  revised_text: '弟兄们，我们写信把那些殉道之人所遭遇的事告诉你们，尤其是蒙福的坡旅甲的事；他仿佛以自己的殉道为这场迫害盖上了印，使迫害止息。前面所述的事几乎全都发生了，为要让主再次向我们显明一个合乎福音的殉道榜样。


    他迟延等候，为要使自己被交出去，正如主所做的一样；这样，我们也可以效法他，不只顾念自己的事，也顾念邻舍的事。因为真实而坚定的爱，不只希望自己得救，也希望众弟兄都得救。[a]'
