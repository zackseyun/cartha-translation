translation:
  language: zh_hans
  text: '这些事发生得极其迅速，言语还来不及描述，群众就立刻从作坊和浴场收集木料和柴捆；其中犹太人尤其热心地出力，正如他们素来所做的。[a]


    柴堆预备好以后，波利卡普脱下所有外衣，解开腰带，又试着脱鞋。他以往并不习惯自己这样做，因为众信徒一向争先恐后，都想最先触碰他的身体。他还未白发苍苍以前，就已经因圣洁的生活而备受敬重。[b]


    随即，他们把为柴堆备好的用具安置在他周围。正要把他钉在木桩上时，他说：“就让我这样吧。那赐我力量忍受烈火的，也必赐我力量，使我不靠你们想用钉子提供的固定，仍能在柴堆上纹丝不动。”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正如他们素来所做的”是本书作者对这一事件中犹太参与者的概括性评价，反映古代文本的争议语境，不应理解为对各地、各时代所有犹太人的判断。
    reason: 防止将古代叙事中的群体性指责扩大为普遍性的反犹结论，同时不删改原文见证。
  - marker: b
    text: “还未白发苍苍以前”意为他早在年老之前，就因圣洁的生活受到敬重。
    reason: 帮助现代读者理解原句的时间对照关系。
  - marker: c
    text: 本段依据所提供的公版英文见证暂译；希腊文抄本传统尚待直接核校，尤其“用具”“固定”等词的具体含义仍可能需要调整。
    reason: 资料明确说明尚未完成希腊文源语复核，出版草稿需透明标示文本基础及不确定处。
lexical_decisions:
- source_word: timber and faggots
  choice: 木料和柴捆
  rationale: 分别保留较大木材与成捆细柴的意象，符合搭建火刑柴堆的场景。
- source_word: all his upper garments
  choice: 所有外衣
  rationale: 自然表达脱去外层衣物，不把范围扩张为全部衣服。
- source_word: touch his flesh
  choice: 触碰他的身体
  rationale: 避免现代汉语中“肉体”的贬义或强烈神学色彩，同时保留身体接触之意。
- source_word: instruments that were prepared for the pile
  choice: 为柴堆备好的用具
  rationale: 英文见证未明确这些器具的具体种类，因此采用概括性措辞，保留不确定性。
- source_word: stake
  choice: 木桩
  rationale: 此处是柴堆中用于固定受刑者的直立木材；译作“木桩”较“柱子”准确，也不擅自译成十字架。
- source_word: remain at the pile unmoved
  choice: 仍能在柴堆上纹丝不动
  rationale: 传达无需钉牢也能保持不动的重点，以现代而庄重的汉语表达。
theological_decisions:
- issue: “He that hath granted”所指及其大写形式
  choice: 那赐我力量……的
  alternative: 上帝既赐我……也必赐我……
  rationale: 上下文显然带有神圣施予者的含义，但英文见证没有在名词层面明说“上帝”；采用代称以保留原有表达方式和含蓄程度。
- issue: 信徒触碰波利卡普身体的叙述
  choice: 按叙事直译，不补充圣物、医治或崇敬教义
  alternative: 解释为圣徒遗物崇敬
  rationale: 文本只陈述信徒争相触碰他的身体及他受敬重的事实，不应导入后世宗派性解释。
- issue: 对犹太群体的概括性陈述
  choice: 保留历史文献中的措辞，并加说明脚注
  alternative: 删去或改写为少数当地人
  rationale: 作为古代殉道叙事，应如实保留见证文本，同时说明这是作者对当地情境的带评价叙述，不宜被推广为对所有犹太人的判断。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文叙事体。保留殉道记的肃穆语气，避免仿古代词和过度教会化措辞。由于目前仅提供公版英文见证，译文属于待希腊文复核的暂定稿；所有脚注标记均已置入正文。
