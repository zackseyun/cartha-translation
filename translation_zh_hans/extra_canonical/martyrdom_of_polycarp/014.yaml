review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了英文见证的事件次序、火刑场景、信徒对波利卡普的敬重，以及他拒绝被钉住的陈述。需要修正两处：第二段的“自己这样做”无英文依据；第三段将加在他身上的“instruments”译为安置在“他周围”，改变了动作对象。末句“赐我力量”虽可通，却比“赐我忍受烈火”增添了“力量”这一未明说的概念。
  naturalness: 整体为自然、庄重的现代汉语。“言语还来不及描述”略改变了“快得非言语所能述说”的比较表达，但不构成重大问题；改为“快得难以言表”更简洁。将“固定”改为“保障/稳固”可避免技术性、现代工程语感。
  terminology: “波利卡普”“众信徒”“圣洁的生活”“木桩”均适当；“木桩”没有不当导向十字架。第三段的“刑具”比无具体所指的“用具”更符合受刑语境，但仍不具体化器具种类。保留对犹太参与者的作者性概括，并以脚注限定其历史语境，是忠实且审慎的处理。
  issues:
  - severity: medium
    issue: “因为众信徒一向争先恐后”中的“自己这样做”
    rationale: 英文见证只说他从前“不习惯这样做”，未说“不习惯自己做”。加入“自己”缩窄并改变原意。
  - severity: medium
    issue: “把为柴堆备好的用具安置在他周围”
    rationale: 英文为“the instruments ... were placed about him”，动作是施加于他身上/环绕他，而非仅安置在其周围。宜译为“把……刑具加在他身上”，同时不臆定器具种类。
  - severity: low
    issue: “那赐我力量忍受烈火的”
    rationale: 英文说赐他忍受烈火；“力量”是合理推论但并非明说。改为“那使我得以忍受烈火的”更贴近原句并保留神圣施予者的代称。
