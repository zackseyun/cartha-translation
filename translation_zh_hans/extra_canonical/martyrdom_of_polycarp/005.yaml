  english_witness: But one man, Quintus by name, a Phrygian newly arrived from Phrygia, when he saw the wild beasts, turned coward. He it was who had forced himself and some others to come forward of their own free will. This man the proconsul by much entreaty persuaded to swear the oath and to offer incense. For this cause therefore, brethren, we praise not those who deliver themselves up, since the Gospel doth not so teach us.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/005.yaml
  text: But one man named Quintus, a Phrygian who had recently arrived from Phrygia, lost his courage when he saw the wild beasts. He was the one who had compelled himself and some others to come forward voluntarily. After much urging, the proconsul persuaded him to swear the oath and offer incense. Therefore, brothers, we do not praise those who hand themselves over, since the Gospel does not teach us to do so.
translation:
  language: zh_hans
  text: 但有一个名叫昆图斯的人，是个弗吕家人，刚从弗吕家来到这里。他一看见野兽，就胆怯了。原来正是他执意要自己和另外几个人主动出面。总督再三劝说，他便被说服，起誓并献了香。因此，弟兄们，我们不称赞那些主动投案的人，因为福音并不这样教导我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段依据公版英文见证暂译；希腊文原文的直接校核尚待完成。“主动出面”和“主动投案”指未经拘捕而自行到官府面前。
    reason: 资料明确注明源语言复核尚未完成；同时说明关键行为用语的历史语境，避免读者误解。
lexical_decisions:
- source_word: Quintus
  choice: 昆图斯
  rationale: 采用常见的希腊—拉丁人名音译，清楚保留人物身份。
- source_word: Phrygian ... from Phrygia
  choice: 弗吕家人……从弗吕家来到这里
  rationale: 保留原文对族属与来处的重复强调；补出“这里”使现代汉语自然，但不指定原文未明说的地点。
- source_word: turned coward
  choice: 胆怯了
  rationale: 表达临见野兽时失去勇气，语气克制，不额外强化为彻底背教。
- source_word: forced himself and some others
  choice: 执意要自己和另外几个人
  rationale: 反映其强使、催逼自己及他人的意味，同时避免生硬直译。
- source_word: come forward of their own free will
  choice: 主动出面
  rationale: 在受迫害语境中指未经拘捕而自行到官府面前；正文采用自然表达，脚注说明其具体含义。
- source_word: proconsul
  choice: 总督
  rationale: 以普通读者易懂的职官称谓表达罗马行省长官；不以较生僻的“代执政官”干扰阅读。
- source_word: swear the oath and offer incense
  choice: 起誓并献了香
  rationale: 保留两项官方要求，不擅自补明誓言对象或献香对象。
- source_word: those who deliver themselves up
  choice: 那些主动投案的人
  rationale: 准确表达自愿将自己交给当局的行为，并与前文“主动出面”呼应。
- source_word: the Gospel
  choice: 福音
  rationale: 保留早期基督教文本中的规范性用语，不缩限为某一卷成文福音书。
theological_decisions:
- issue: 主动寻求殉道是否值得称赞
  choice: 保留作者明确的不称赞态度
  alternative: 将其解释为全面禁止一切主动见证或自首
  rationale: 原文只说福音不教导信徒自行交付自己；不把这一具体劝诫扩展成超出文本的普遍教义。
- issue: 起誓和献香的宗教含义
  choice: 按原文仅陈述行为
  alternative: 明确译作向凯撒起誓并向异教神明献香
  rationale: 这些背景虽可能隐含于历史语境，但当前所给见证没有明说对象，故不在正文中补入。
- issue: “福音”的所指
  choice: 保留开放的“福音”
  alternative: 指定为耶稣的某一句教训或某一卷福音书
  rationale: 维持原文可能兼指福音信息与主之教导的张力，不作未经证实的限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“弟兄们”保留早期教会劝诫口吻；句式简洁，既呈现昆图斯的失败，也不增添羞辱性措辞。由于当前仅有公版英文见证，所有词义判断均属暂定，并以脚注公开说明证据限制。
