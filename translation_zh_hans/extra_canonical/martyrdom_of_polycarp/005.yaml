review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实于所给英文见证，且没有把誓言或献香的对象擅自具体化。不过，“弗吕家”不是 Phrygia/Phrygian 在现代汉语中的规范译名；“从弗吕家来到这里”额外落实了原文未说明的抵达地点；“执意要自己和另外几个人主动出面”也弱化了“forced himself and some others”的强使/勉强意味。由于尚未直接核对希腊文，以下仍属依据英文见证的审慎修订。
  naturalness: 修订后采用“弗里吉亚人”“刚从弗里吉亚来”“勉强自己和另外几个人自行前来”等较自然、准确的现代书面表达。“把自己交出去”保留原文所批评的自行将自己交给当局之意，避免“投案”可能带出的现代刑事语域和罪犯意味。
  terminology: 人名“昆图斯”可保留。“弗里吉亚”为通行的地区及族属译名；“总督”“福音”“弟兄们”均适合本段语体。“起誓并献香”忠实保留行为而不越过证据补充对象。
  issues:
  - severity: medium
    issue: “弗吕家人，刚从弗吕家来到这里”
    rationale: “弗吕家”不是现代汉语中 Phrygia 的规范通行译名，宜作“弗里吉亚”。“来到这里”指定了英文见证未明确的目的地，宜删去。
  - severity: medium
    issue: “执意要自己和另外几个人主动出面”
    rationale: “执意要”主要表达个人意愿，未充分传达英文见证中 forced himself and some others 的强使、勉强意味；且“要自己”句法不够自然。
  - severity: low
    issue: “主动投案的人”
    rationale: 虽能表达自行向当局现身，但“投案”在现代汉语中较易关联犯罪嫌疑人的刑事语境。改为“主动把自己交出去的人”更贴近原文而不增加罪犯含义。
  revised_text: 但有一个名叫昆图斯的人，是个刚从弗里吉亚来的弗里吉亚人；他看见野兽，就胆怯了。正是他勉强自己和另外几个人自行前来。总督再三劝说，终于说服他起誓并献香。因此，弟兄们，我们不称赞那些主动把自己交出去的人，因为福音并不这样教导我们。[a]
  revised_footnotes:
  - marker: a
    text: 本段依据公版英文见证暂译；尚待直接校核希腊文原文。“自行前来”和“主动把自己交出去”指未经拘捕而自行到官府面前。
    reason: 公开说明目前的文本依据及希腊文复核尚待完成，并说明关键行为用语的历史语境，避免误解。
  revision_rationale: 修订规范了弗里吉亚的译名，删去原文未说明的“这里”，并以“勉强自己和另外几个人自行前来”较完整地表达其主动现身而又强使自己及他人前来的意味。末句改用较中性的“主动把自己交出去”，保留作者的劝诫，不扩展为额外教义判断。
