review_pass:
  verdict: revise
  source_fidelity: 译文大体忠实于所提供的英文见证，也保留了“起誓”和“献香”的对象未明状态。但“从弗吕家来到这里”中的“这里”是原文未明说的落脚地点；“执意要自己和另外几个人”弱化了原文中“强使／迫使自己和他人”的反常而有意的措辞；“主动投案”则带有较具体的现代司法语域，宜改为较中性的“自行前来”。
  naturalness: 整体叙事流畅、庄重。“弗吕家”并非现代汉语中较通行的弗里吉亚译名；“经总督再三劝说，他便被说服”略显被动重复，改为“总督再三劝说后，终于劝他……”更自然。
  terminology: 建议采用“弗里吉亚／弗里吉亚人”这一较通行的现代中文地名与族名。保留“总督”“福音”“献香”均可；“弟兄们”符合原文的教会劝诫语气。
  issues:
  - severity: medium
    issue: “来到这里”补出了原文未指明的地点。
    rationale: 英文见证仅说他“recently arrived from Phrygia”，不需要指定为“这里”；删去可避免无依据的空间指示。
  - severity: medium
    issue: “执意要自己和另外几个人主动出面”未充分表达“forced himself and some others”。
    rationale: 原文刻意使用强制性动词，虽用于“自己”显得不寻常，仍应保留其“强使自己及他人”的力度，而不能仅译为个人意愿坚决。
  - severity: low
    issue: “主动投案”带有现代刑事司法的特定语感。
    rationale: 此处所说的是未经逮捕而自愿到当局面前；“自行前来”较中性，并能与前文呼应。
  - severity: low
    issue: “弗吕家”不是现代普通读者最易辨识的通行译名。
    rationale: 采用“弗里吉亚”更符合现代中文的常用地名译法，同时保留族属与来处的重复。
  revised_text: 但有一个名叫昆图斯的人，是弗里吉亚人，刚从弗里吉亚来到。他一看见野兽，就胆怯了。正是他曾强使自己和另外一些人自行前来。总督再三劝说后，终于劝他起誓并献香。因此，弟兄们，我们不称赞那些自行前来的人，因为福音并不这样教导我们。[a]
  revised_footnotes:
  - marker: a
    text: 本段依据公版英文见证暂译；尚待直接校核希腊文原文。“自行前来”指未经拘捕而自愿到官府面前；其具体程序和行为对象未在本段明说。
    reason: 说明当前文本依据及“自行前来”的历史语境，同时不将未明示的誓言或献香对象补入正文。
  revision_rationale: 修订以忠实呈现昆图斯“强使自己和他人”自愿赴官的措辞，并消除“这里”这一无文本依据的补充。将“主动投案”统一改为“自行前来”，避免过强的现代司法色彩；地名改用较通行的“弗里吉亚”。其余关键术语及原文未说明的宗教行为对象均予保留，不作教义性扩展。
