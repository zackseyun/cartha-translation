base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/006.yaml
  text: 'When the glorious Polycarp first heard it, he was not at all dismayed, but desired to remain in town. Yet the greater part persuaded him to withdraw. So he withdrew to a farm not far from the city, and there he stayed with a few companions, doing nothing else night and day but praying for all people and for the churches throughout the world; for this was his constant habit.


    And while praying, three days before his apprehension, he fell into a trance and saw his pillow burning with fire. He turned and said to those who were with him, “It must needs be that I shall be burned alive.”'
translation:
  language: zh_hans
  text: '可敬的坡旅甲起初听到这消息时，一点也没有惊慌，反而想留在城里；但大多数人劝他离开。于是他搬到离城不远的一处农庄，和几个同伴住在那里。他昼夜所做的，无非是为所有人和世界各地的教会祷告；这原是他一贯的习惯。


    在他被捕前三天，他祷告时出了神，看见自己的枕头正被火烧着。他转身对身边的人说：“我必被活活烧死。”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英文见证译出；希腊文原文复核尚待完成。“出了神”对应英文 fell into a trance，指一种出神状态；本译不据此断定其为神直接赐下的异象或一场梦。
    reason: 透明说明本段的暂定文本依据，并保留 trance 的语义范围，避免将其具体化为“异象”。
lexical_decisions:
- source_word: the glorious Polycarp
  choice: 那荣耀的坡旅甲
  rationale: 保留殉道叙事中对人物的尊称，同时采用现代汉语可理解的表达。
- source_word: withdraw
  choice: 暂且离开／退到
  rationale: 依上下文表示为躲避追捕而离城，并未加入逃亡或怯懦的评价。
- source_word: farm
  choice: 农庄
  rationale: 自然表达城外可供居住的乡间产业或住所，不把范围过度限定为农田。
- source_word: for all men
  choice: 为所有人
  rationale: 以现代汉语明确表达普遍涵盖的人群。
- source_word: churches throughout the world
  choice: 普天下的众教会
  rationale: 保留各地教会的复数与普世范围，并采用庄重而易懂的措辞。
- source_word: falleth into a trance
  choice: 进入异象
  rationale: 英语见证所译 trance 在此伴随所见的启示性景象；此译避免现代汉语中“昏迷”的误解，同时不具体断定其心理或生理状态。
- source_word: It must needs be
  choice: 我必
  rationale: 简洁表达必然性，符合预示自己结局的语境。
- source_word: burned alive
  choice: 被活活烧死
  rationale: 准确保留处刑方式及受刑时仍活着的含义。
theological_decisions:
- issue: 祷告中的异象是否被明说为神直接启示
  choice: 叙述他“进入异象”并看见枕头燃烧，不增添神直接说话或启示的表述
  alternative: 译作“神赐给他异象”或“他作了预言性的梦”
  rationale: 所给见证只叙述祷告中的状态和所见景象；不应超出证据规定异象的施予方式或将其改为梦。
- issue: 坡旅甲关于殉道方式的话是否表达绝对神学必然性
  choice: 以“我必被活活烧死”保留强烈的必然语气
  alternative: “看来我会被活活烧死”
  rationale: 原见证的 must needs 表达确定或命定感；弱化为推测会损失叙事张力，但译文不另行解释其神学机制。
translation_notes:
  register: 采用现代、庄重而流畅的叙事体。“坡旅甲”沿用中文基督教文献中 Polycarp 的常见译名；“众教会”“普天下”保留早期教会文献的庄严语感。因希腊文复核尚待完成，本稿避免对英语见证中的潜在歧义作过度确定的处理。
