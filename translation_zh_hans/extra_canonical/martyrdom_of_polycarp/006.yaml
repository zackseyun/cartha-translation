review_pass:
  verdict: revise
  source_fidelity: “荣耀的”容易把对坡旅甲的称赞性修饰误解为神学性的“荣耀”；就希腊文常见的 θαυμάσιος 而言，“可敬的”或“令人敬佩的”更稳妥。英文 witness 的 fell into a trance 应保留为描述一种状态的“出神”，不宜译成较明确、带启示色彩的“进入异象”。“暂且”不见于所给见证，宜删去。其余叙事次序、祷告对象、被捕前三日、燃烧的枕头及预告火刑均得到保留。
  naturalness: 修订后采用现代书面叙事语体。“离开城里”“搬到……农庄”“出神”均自然清楚；“世界各地的教会”比“普天下的众教会”更符合现代标准汉语，同时保留复数和普遍范围。
  terminology: 保留通行人名“坡旅甲”。“教会”“祷告”符合早期基督教文献及现代中文基督教语境。“出神”是对 trance 的审慎对应，并不断言这是神直接赐下的异象或一场梦。
  issues:
  - severity: medium
    issue: “那荣耀的坡旅甲”对人物称号的语义偏强。
    rationale: 希腊文传统中的称赞性形容语通常更接近“可敬的／令人敬佩的”；“荣耀的”在汉语中容易引入未明说的神学性荣耀。
  - severity: medium
    issue: “进入异象”将 trance 具体化。
    rationale: 见证文本描述的是进入 trance 并看见燃烧的枕头；“进入异象”容易把所见和状态混同，并较强地预设其启示性质。“出神”更能保存原有的叙述余地。
  - severity: low
    issue: “暂且离开”加入了时间限制。
    rationale: 英文 witness 仅说 persuaded him to withdraw，没有“暂时”的限定。
