  rationale: 修订纠正了称赞性称号可能被神学化的表达，删除无依据的“暂且”，并以“出了神”保留 trance 的状态性和解释空间。其余仅作自然中文调整，未改变人物行动、时间、祷告范围或火刑预示的含义。
