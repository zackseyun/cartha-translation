review_pass:
  verdict: revise
  source_fidelity: 整体忠实于所供英语见证，且对“太初之亲”、灵／魂及三位亚当的区分处理审慎。不过，“censure them”译作“定他们的罪”将“责备／谴责”强化为明确的定罪，导入原见证未明说的罪责判断。另，“由尘土造成”比见证的“from the earth”更具体。最重要的是，正文未实际保留“[following] []”的方括号与空缺信号，只有脚注说明，未充分维持损文状态。
  naturalness: 文体庄重流畅，适合此类古代宇宙论文本。“太初之亲”虽略带陌生感，但能保留 Parent 的单数及性别未定，优于擅译为“父”。将损文直接保留为“［随后］［……］卑微的安息日”会有意呈现残缺句法；这比以流畅中文掩盖缺文更符合见证状态。
  terminology: “第一位执政者”“权势者”“太初之亲／母”“灵／魂”“律法之人”均可保留。“属地的亚当”较“属土亚当”更贴近 earth／earthly 的重复，也避免把 earth 收窄为尘土。将 censure 译为“责备”保留其评价性而不预设司法意义。
  issues:
  - severity: medium
    issue: “定他们的罪”强化了 censure 的含义。
    rationale: 见证文本使用 censure，至多明确为责备或谴责；“定罪”及“罪”本身会增加司法与道德罪责色彩。
  - severity: medium
    issue: “由尘土造成的存在”将 earth 窄化为“尘土”。
    rationale: 英语见证仅称该亚当为“a created entity of the earth”；宜保留“地／属地”意象，并与后文 earthly Adam 对应。
  - severity: high
    issue: 正文没有保留见证中的“[following] []”恢复词及空缺标记。
    rationale: 译文以“在……之后”顺译并仅在脚注提及，掩盖了原有的方括号和缺文。应在正文明确保留恢复与残缺信号。
  revised_text: '她先因第一位执政者而怀了亚伯；又因那七位权势者和他们的天使，生下了其余的儿女。一切都照着太初之亲的预先思量而发生，为要使太初之母能在自己里面孕育每一粒种子；这些种子与宇宙及其构造的命运混合相连。公义预先为夏娃定下的计划也随之启动：权势者所塑成的形体要成为禁闭那光的处所，而那光要借着他们所塑成的形体责备他们。



    太初的亚当属光，赋有灵；他在第一日显现。第二个亚当赋有魂；他在第六日显现，名叫“阿佛洛狄忒”。第三个亚当是由地而造的受造者，也就是律法之人；他在第八日显现，这日称为“太阳日”，［随后］［……］卑微的安息日。[a]属地的亚当的后裔繁衍，遍满大地；他们从自身之中发展出赋有魂的亚当所具有的各样技艺。然而，他们全都活在无知之中。'
  revised_footnotes:
  - marker: a
    text: 见证文本在此作“[following] [] the lowly Rest-Day”：方括号中的“following”（此处译作“随后”）表示恢复或不确定的文字，紧后的空缺以“［……］”保留。由于缺文，残句的确切句法与所指关系仍待科普特原文复核。
    reason: 保留并说明英语见证中的恢复词和缺文标记，而不以流畅译文掩盖文本残损。
  revision_rationale: 修订限于可安全确定之处：以“责备”避免把 censure 教义化或司法化；以“由地而造／属地”忠实保留 earth 的重复；并在正文及脚注中恢复方括号和空缺信号。其余宇宙论术语和歧义均维持原稿的审慎处理。
