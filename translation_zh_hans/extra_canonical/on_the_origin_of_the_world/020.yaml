review_pass:
  verdict: revise
  source_fidelity: 译稿整体忠实于所给英语见证，并大体保留其宇宙论术语和三位亚当的区分；但末段的方括号损文信号没有按见证文本实际保留，且“censure”译为“定他们的罪”加入了原文未明说的司法／罪责含义。另有少数措辞可更贴近见证文本，同时避免将“of Light”和“earth”分别限定为“出于光”和“尘土”。
  naturalness: 整体庄重、通顺，适合现代书面普通话。“太初之亲”虽不常见，但能稳妥保留 Parent 的性别开放性；在该文本的专门宇宙论语境中可接受。修订后通过拆分“种子”与“混合、结合”的关系，并使残缺处直接显现，句法会更清楚。
  terminology: “执政者”“权势者”“灵／魂”“律法之人”“阿佛洛狄忒”均可保留。“公义”作为可能人格化的专称亦宜保留。将“定他们的罪”改为“责备他们”，以对应 censure 而不预断其法律或教义性质。
  issues:
  - severity: high
    issue: 方括号损文信号未按见证文本保留
    rationale: 英语见证在“Sun-Day”后明载“[following] [] the lowly Rest-Day”。现稿以脚注标记[a]替代了第一个方括号性补文，又未在正文保留空缺“[]”，使读者无法辨认补文与损文的位置和数量。应在正文中直接保留“[在] []卑微的安息日之后”。
  - severity: medium
    issue: “censure them”译作“定他们的罪”过度解释
    rationale: “censure”本义为责备、谴责；“定罪”带入明确的司法判定和罪责概念，超过所供见证的措辞。应译作“责备他们”或“谴责他们”。
  - severity: low
    issue: “of Light”与“created entity of the earth”的译法略有限定
    rationale: “出于光”可暗示来源关系，“尘土”则比 earth 更具体。译为“属于光的”及“由大地造出的受造物”，更贴近所给英语见证且不增添解释。
  revised_text: '她先因第一位执政者而怀了亚伯；又因那七位权势者和他们的天使，生下了其余的儿女。一切都照着太初之亲的预先思量而发生，为要使太初之母能在自己里面怀有每一粒种子；这些种子与宇宙及其结构的命运混合并结合。公义预先为夏娃定下的计划也随之启动：权势者所塑成的形体要成为禁闭那光的处所，而那光要借着他们所塑成的形体责备他们。



    太初的、属于光的亚当充满灵；他在第一日显现。第二个亚当充满魂；他在第六日显现，名叫“阿佛洛狄忒”。第三个亚当是由大地造出的受造物，也就是律法之人；他在第八日显现，这日称为“太阳日”，[在] []卑微的安息日之后。属土亚当的后裔繁衍，遍满大地；他们从自身之中造出充满魂的亚当所具有的各样技艺。然而，他们全都住在无知之中。'
  revised_footnotes:
  - marker: '[在]'
    text: 方括号中的“在”对应英语见证的补文“[following]”；其确切科普特依据及复原程度仍待核对。
    reason: 保留见证文本以方括号标示的补文性质，而不把补文混同于普通正文。
  - marker: '[]'
    text: 此空方括号对应见证文本中的空缺，可能反映抄本残损或未定复原；不补足其内容。
    reason: 直接保留损文位置与不确定性。
  revision_rationale: 修订以所供公共领域英语见证为依据，未声称完成科普特原文校勘。重点是恢复“[following] []”的双重文本不确定性，避免以脚注符号取代正文中的残缺标记；并将“censure”从带有司法色彩的“定他们的罪”收回为中性的“责备他们”。其余调整旨在更准确呈现“of Light”“earth”及种子与宇宙命运之间的句法关系，而不解决见证文本本有的宇宙论或代词指涉歧义。
