base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/020.yaml
  text: 'She first became pregnant with Abel by the first archon. By the seven authorities and their angels, she had the other children. Everything happened according to the forethought of the Primal Parent, so that the Primal Mother could bear every seed within her, mixed and joined with the destiny of the universe and its structures. A plan designed beforehand by Justice was set in motion concerning Eve: the shaped forms of the authorities would become places enclosing the light, and through their shaped forms the light would condemn them.


    The Primal Adam, who is from the Light, is filled with spirit, and he appeared on the first day. The second Adam is filled with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created being from the earth, namely, the man of the Law. He appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day. The descendants of the earthly Adam multiplied and filled the earth, and from within themselves they produced all kinds of technological skills possessed by the Adam filled with soul. However, they all lived in ignorance.'
translation:
  language: zh_hans
  text: '她先因第一位执政者而怀了亚伯；又因那七位权势者和他们的天使，生下了其余的儿女。一切都照着太初之亲的预先思量而发生，为要使太初之母能在自己里面孕育每一粒种子，与宇宙及其各重结构的命运混合相连。公义预先为夏娃定下的计划也随之启动：权势者所塑成的形体要成为禁闭那光的处所，而那光要借着他们所塑成的形体定他们的罪。


    太初的亚当出于光，充满灵；他在第一日显现。第二个亚当充满魂；他在第六日显现，名叫“阿佛洛狄忒”。第三个亚当是由尘土造成的存在，也就是律法之人；他在第八日显现，这日称为“太阳日”，[a]在卑微的安息日之后。[b]属土亚当的后裔繁衍，遍满大地；他们从自身之中发展出充满魂的亚当所具有的各样技艺。然而，他们全都活在无知之中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “太阳日”直译见证文本的“Sun-Day”，即一周第一日的名称；此处保留其与“光”的字面联系。
    reason: 说明非常规日名而不在正文中扩释。
  - marker: b
    text: 此处见证文本在“在……之后”附近保留了方括号和一处空缺，可能反映抄本残损或补文；句法与确切措辞仍待科普特原文复核。
    reason: 原材料明确要求保存抄本损坏或复原信号；用脚注说明正文顺译所依据的不确定文本状态。
lexical_decisions:
- source_word: first archon
  choice: 第一位执政者
  rationale: “执政者”保留该文献中 archon 的宇宙论专名含义，也避免将其泛化为普通官长。
- source_word: seven authorities
  choice: 七位权势者
  rationale: 以“权势者”与“执政者”区分，同时保留人格化的宇宙权能意味。
- source_word: Primal Parent / Primal Mother
  choice: 太初之亲／太初之母
  rationale: “Parent”在见证文本中不明确指定父或母，故用中性的“亲”，不擅自译成“父”；“Mother”则明确译作“母”。
- source_word: forethought
  choice: 预先思量
  rationale: 表达预先的意念与筹划，同时避免未经科普特原文核验便固定为某一专门神格名称。
- source_word: shaped forms
  choice: 所塑成的形体
  rationale: 保留“塑造”与“形体”两层意义，并与后文重复措辞对应。
- source_word: spirit / soul
  choice: 灵／魂
  rationale: 维持原文对两者的宇宙论区分，不以现代心理学词汇抹平差异。
- source_word: Aphrodite
  choice: 阿佛洛狄忒
  rationale: 按希腊神名通行音译处理，不直接意译为“维纳斯”或“爱神”。
- source_word: man of the Law
  choice: 律法之人
  rationale: 保留该短语可能具有的类型性或神学性，不解释为“守律法的人”。
- source_word: Sun-Day / Rest-Day
  choice: 太阳日／安息日
  rationale: 前者保留字面宇宙论关联，后者采用读者熟悉且符合语境的名称。
- source_word: technological skills
  choice: 各样技艺
  rationale: 在古代语境中，“技艺”比现代色彩浓厚的“技术技能”更自然，也涵盖工艺和实用知识。
- source_word: ignorance
  choice: 无知
  rationale: 保留诺斯替语境中认知缺失的核心含义，不扩释为罪恶或愚昧。
theological_decisions:
- issue: 光究竟是定罪者还是被定罪对象
  choice: 那光要借着他们所塑成的形体定他们的罪
  alternative: 那些形体会责备那光／光会责备那些形体
  rationale: 英语见证中代词指向存在潜在歧义；正文依审核层较可能的理解处理，但不把“光”与权势者的关系作进一步教义化解释。
- issue: 太初之亲的性别
  choice: 使用中性的“太初之亲”
  alternative: 太初之父
  rationale: 见证文本用 Parent 而非 Father；在源语复核前保留性别开放性。
- issue: 三位亚当的本体关系
  choice: 按“太初的／第二个／第三个亚当”并列陈述
  alternative: 解释为同一亚当的三个层面或三个彼此独立的实体
  rationale: 原段只作区分而未充分界定彼此关系，译文不替文本解决其宇宙论张力。
- issue: “公义”的人格性
  choice: 将“公义”视作专称并大意保留其施动性
  alternative: 译为抽象的公平原则
  rationale: 原见证将 Justice 作为计划的设计者，译文不消除其可能的人格化意味。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。鉴于所供 drafting basis 明言“科普特原文复核待定”，本稿以公共领域英语见证为临时依据，不声称已完成原文校勘。专名与宇宙论术语尽量稳定，避免导入宗派解释；对损文以正文标记和脚注保留不确定性。
