base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/009.yaml
  text: 'After witnessing the likeness of Pistis in the waters, the Primal Parent became deeply sorrowful, especially when he heard her voice. It resembled the first voice that had called to him from the waters. He groaned when he realized that she was the one who had given him a name. He was ashamed of his sin. And when he truly learned that a deathless man of light had existed before him, he became deeply troubled, because he had previously declared to all the gods and their angels, “I am the one who is God. Apart from me, nothing else exists.” He had been afraid that they might discover someone else had existed before him and might denounce him.


    But because he lacked discernment, he laughed at (the possibility of) denunciation and acted rashly. He said, “If [] something existed before I did, let it come forward so that we may see its light.” And immediately, look! Light came out from the eighth heaven above and passed through all the heavens of the earth.'
translation:
  language: zh_hans
  text: '原初之父看见水中皮斯蒂斯的形像，便极其忧伤；尤其当他听见她的声音时，更是如此。那声音与先前从水中呼唤他的第一个声音相似。他意识到，正是她给他取了名字，就呻吟起来。他因自己的罪而羞愧；当他确实知道，在他以前已有一位不死的光明之人存在时，就深感不安。因为他先前曾向众神和他们的天使宣告：“我就是神；除我以外，别无存在。”他这样说，是因害怕他们发现有别人在他以前已经存在，便会揭发他。


    然而，他缺乏明辨之力，竟对可能遭人揭发一事嗤笑，并且行事鲁莽。他说：“如果〔缺文〕在我以前已有某个存在，就让他出来，好叫我们看见他的光。”话音刚落，看哪！光从上方的第八重天发出，穿过了属于大地的一切诸天。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如果”之后的“〔缺文〕”表示此处文本残缺或复原未定。末句“属于大地的一切诸天”依现有英文见证直译；其确切科普特语句法及宇宙层级所指，仍待原文校审。
    reason: 明确标示文本残缺，并披露本稿尚未完成科普特语直接核验的关键不确定处。
lexical_decisions:
- source_word: Pistis
  choice: 皮斯蒂斯
  rationale: 作为人物专名音译，不直接译为“信心”或“信仰”，以免预先把专名解释为抽象神学概念。
- source_word: Primal Parent
  choice: 原初之父
  rationale: 保留其作为宇宙起源叙事中父性始祖称号的功能；“原初”比“最初”更具称号感，也避免误作普通家长。
- source_word: likeness
  choice: 形像
  rationale: 表达可见的肖似或显现，同时不武断判定是倒影、影像还是实体形态。
- source_word: deathless man of light
  choice: 不死的光明之人
  rationale: 保留“人”与“光明”的并置及不死属性，不擅自改写为“永生的光人”等更具解释性的术语。
- source_word: denounce
  choice: 揭发
  rationale: 兼顾向他者揭露其虚假宣称和公开指控的含义；上下文并非单纯责骂。
- source_word: eighth heaven
  choice: 第八重天
  rationale: 采用现代中文可懂的宇宙层级表达，保留明确序数。
- source_word: all of the heavens of the earth
  choice: 属于大地的一切诸天
  rationale: 尽量保留原见证文本中“诸天”与“大地”的属格关系，而不将其顺平为单一的“天空”。
theological_decisions:
- issue: “Pistis”是专名还是应译作“信心”
  choice: 作为专名译为“皮斯蒂斯”
  alternative: 译为“信心”或“信仰”
  rationale: 本段把Pistis作为有声音、能命名且有形像的角色；音译可保留其人物身份及名称可能兼有的词义。
- issue: “I am the one who is God”中的排他性自称
  choice: “我就是神；除我以外，别无存在。”
  alternative: “我是唯一的神；除我之外没有别的神。”
  rationale: 原句后半涉及一切其他存在，而不只其他神；因此不把范围缩窄为神祇，也不额外加入“唯一”来消解其夸张张力。
- issue: “sin”的性质
  choice: 直译为“罪”
  alternative: 译为“过错”或具体解释为傲慢、无知
  rationale: 见证文本明确使用sin；保留其伦理与宗教分量，不替作者界定具体罪行。
- issue: 发光者的代词与身份
  choice: “就让他出来……他的光”
  alternative: 用中性“它”或直接称“那存在”
  rationale: 前文称其为“光明之人”，中文以“他”自然承接，但不进一步认定其具体神学身份。
- issue: 残缺处的处理
  choice: 正文标为“〔缺文〕”并加脚注
  alternative: 无标记省略，或猜测补出连接词、称谓
  rationale: 保留抄本损坏或见证文本恢复未定的事实，不作无依据补足。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。叙事句式适度分开，避免英文长句造成中文拖沓；神话宇宙论称谓保持陌生感，不以基督教或其他宗派术语同化。由于所供 drafting basis 明示科普特语复核尚待进行，本稿以公共领域英文见证为暂定依据，并在脚注中标出最关键的文本与句法不确定性。
