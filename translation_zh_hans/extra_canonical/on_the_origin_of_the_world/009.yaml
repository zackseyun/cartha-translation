  english_witness: 'And having witnessed the likeness of Pistis in the waters, the Primal Parent sorrowed greatly, especially when he heard her voice, which resembled the first voice that had called to him from out of the waters, and he moaned when he became aware that this was she who had bestowed on him a name. He was ashamed over his sin, and when he came to know truly that a deathless man of light had been in existence before him, he was deeply troubled, because previously he had announced to all the gods and to their angels, “I am the one who is God. Except me there is nothing else that exists,” because he had feared they could discover that someone else had existed before he had, and they might denounce him.


