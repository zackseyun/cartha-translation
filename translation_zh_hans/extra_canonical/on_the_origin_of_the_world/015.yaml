    他们走近他，问道：“这不就是破坏我们工作的那位神吗？”


    他回答说：“是的。你们若想使他不能再破坏我们的工作，来吧，让我们用泥土造一个人来服侍我们，照着我们身体的形象，也照着这存在者的样式[a]；这样，他看见自己的样式，就会爱上它，不再破坏我们的工作。反倒是那些从光中出生的人，在这整个世代中，我们都要使他们成为服侍我们的奴仆。”


    这一切都按照皮斯蒂斯的预先筹划而发生，为要使那人按着他的样式显现，并因众掌权者所塑造的形体而谴责他们；他们所塑造的形体便成了禁闭光的处所。


    随后，众掌权者获得了造人所需的知识。与萨巴奥特同住的索菲娅·佐伊，早已预见他们要做的事。她嘲笑他们的决定，因为他们是瞎眼的。他们无知地造了那人，所做的正与自身的利益相反，却不明白自己将要着手做什么。


    她抢在他们前面，先造了属于她自己的人，为要使他能教导他们所塑造的形体如何恨恶他们，从而逃离他们。


    那位教师是这样产生的：索菲娅让一滴光降下；光滴流到水面上，立刻显出一个兼具男女两性的人。她先把那滴光塑造成女性的身体，后来又借着这身体，把它塑成先前显现的那位母亲的样式；她在十二个月内使它完备。


    这样，一个兼具男女两性的人产生了。希腊人称其为“赫尔玛弗洛狄托斯”，希伯来人则称其母为“佐伊的夏娃”，也就是“生命的女教师”。她的孩子是那作主的受造者。后来[b]，众掌权者称它为“兽”，为要使那些曾塑造过（某物）的受造者误入歧途。[c]“兽”这个名称的意思是“教师”，因为它被发现是万有之中最聪明的。'
