translation:
  language: zh_hans
  text: '在光之亚当退入混沌以前，众掌权者看见了他，便嘲笑元始之父，因为他曾向他们撒谎，说：“我就是上帝；在我以前，没有任何存在者。”


    他们走近他，问道：“这不就是破坏我们工作的那位神吗？”


    他回答说：“是的。你们若想使他不能再破坏我们的工作，来吧，让我们用泥土造一个人来服侍我们，照着我们身体的形象，也照着这存在者的样式[a]；这样，他看见自己的样式，就会爱上它，不再破坏我们的工作。反倒是那些从光中出生的人，在这整个世代中，我们都要使他们成为服侍我们的奴仆。”


    这一切都按照皮斯蒂斯的预先筹划而发生，为要使那人按着他的样式显现，并因众掌权者所塑造的形体而谴责他们；他们所塑造的形体便成了禁闭光的处所。


    随后，众掌权者获得了造人所需的知识。与萨巴奥特同住的索菲娅·佐伊，早已预见他们要做的事。她嘲笑他们的决定，因为他们是瞎眼的。他们无知地造了那人，所做的正与自身的利益相反，却不明白自己将要着手做什么。


    她抢在他们前面，先造了属于她自己的人，为要使他能教导他们所塑造的形体如何恨恶他们，从而逃离他们。


    那位教师是这样产生的：索菲娅让一滴光降下；光滴流到水面上，立刻显出一个兼具男女两性的人。她先把那滴光塑造成女性的身体，后来又借着这身体，把它塑成先前显现的那位母亲的样式；她在十二个月内使它完备。


    这样，一个兼具男女两性的人产生了。希腊人称其为“赫尔玛弗洛狄托斯”，希伯来人则称其母为“佐伊的夏娃”，也就是“生命的女教师”。她的孩子是那作主的受造者。后来[b]，众掌权者称它为“兽”，为要使那些曾塑造过（某物）的受造者误入歧途。[c]“兽”这个名称的意思是“教师”，因为它被发现是万有之中最聪明的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存见证在“样式”之后有缺文；缺失内容无法确定。
    reason: 标明底本明确保留的文本残缺，不作无证补写。
  - marker: b
    text: 现存见证在“后来”之后有缺文；句中可能缺少若干词。
    reason: 按英文见证的方括号位置标示第二处抄本缺口。
  - marker: c
    text: 这一句的代词和施事关系不明确。“曾塑造过（某物）的受造者”在现有见证中没有明示其塑造的对象；也可能理解为“使那些曾塑造它的受造者误入歧途”等意思。译文未试图彻底厘清其所指。
    reason: 说明末段原有的语法、宾语与指称歧义，避免把暂定理解当作确定释义。
lexical_decisions:
- source_word: authorities
  choice: 众掌权者
  rationale: 保留宇宙论叙事中的统治权力含义，也避免直接套用某一宗派的专门术语。
- source_word: Primal Parent
  choice: 元始之父
  rationale: 依上下文男性代词译作“父”，以“元始”表达其原初地位；不额外认定其神学身份。
- source_word: Adam of Light
  choice: 光之亚当
  rationale: 保留专名结构，并明确“光”对该亚当的限定。
- source_word: aeon
  choice: 世代
  rationale: 在此指具有期限的宇宙时期；“世代”自然易懂，同时不把它过度技术化。
- source_word: Pistis
  choice: 皮斯蒂斯
  rationale: 按专名音译，避免仅译作“信”而消除其人格化身份。
- source_word: Sophia Zoe
  choice: 索菲娅·佐伊
  rationale: 保留复合专名的希腊语形态；其“智慧、生命”的语义关联不在正文中强行解释。
- source_word: androgynous human
  choice: 兼具男女两性的人
  rationale: 直接表达文本所说的双性特征，避免现代身份类别带来的额外含义。
- source_word: Hermaphrodites
  choice: 赫尔玛弗洛狄托斯
  rationale: 作为希腊名称音译，保留叙事所强调的命名传统。
- source_word: the Beast
  choice: 兽
  rationale: 保留称号的简洁与其后反常的“教师”释义之间的张力。
theological_decisions:
- issue: 元始之父关于自己是神的宣称
  choice: 保留叙述者称其“撒谎”的明确判断
  alternative: 将其缓和为“说错了”或解释为无知
  rationale: 原见证明确使用“lied”，不应为协调其他神学体系而弱化。
- issue: 人的创造与皮斯蒂斯的预知
  choice: 译作“依照皮斯蒂斯的预知而发生”
  alternative: 译成直接命定或主动创造
  rationale: 保留“预知/预先思量”与事件发生之间的关系，不把它扩展成更强的因果或预定论断。
- issue: “他的样式”中代词的指向
  choice: 保留男性单数代词“他的”
  alternative: 明确指向光之亚当、皮斯蒂斯或元始之父
  rationale: 现有英文见证的指称不够确定，中文不替文本消除歧义。
- issue: “那作主的受造者”
  choice: 保留“受造”与“作主”并置
  alternative: 将其解释为造物主或世界统治者
  rationale: 原文措辞具有张力，不能擅自用某种宇宙论身份替代。
- issue: “兽”被解释为“教师”
  choice: 照译这一反常解释
  alternative: 按通常象征将“兽”解释为欺骗者或恶者
  rationale: 这是本文自身的专门诠释，应保留而不以较熟悉的宗教象征覆盖。
