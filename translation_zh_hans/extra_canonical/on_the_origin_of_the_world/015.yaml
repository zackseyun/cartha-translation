  register: 采用现代、庄重而可读的简体中文。叙事称谓尽量一致，专名以音译保留其古代宇宙论身份。由于科普特语原文复核尚未完成，本稿以所给公共领域英文见证为暂定依据；抄本缺文与末段歧义均明确保留。
