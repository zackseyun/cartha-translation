id: ORIGW.010
reference: On the Origin of the World — Adam of Light
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  text: 'When the Primal Parent saw that the light was beautiful as it was glowing, he was astonished, and he grew deeply ashamed. As that light came forth, a quite wondrous human likeness manifested itself inside it, and no one saw it apart from the Primal Parent and Pronoia, who dwelt with him. Nevertheless, its light manifested itself to all the hosts of the heavens, on account of which all of them were troubled.


    When Pronoia then saw that messenger, she fell in love with him, but he loathed her because she dwelt in darkness, yet she wanted to embrace him, and she could not. When she could not quench her love, she poured out her light onto the earth. From that day, that messenger has been called “Adam of Light,” which in translation means, “the radiant man of blood,” and the earth was spread out above him, [7] the holy Adaman, which in translation means, “the Holy Land of the Adamantine.”


    From that day, every authority has honored the blood of the virgin, and the earth was purified on account of the blood of the virgin, but additionally, the water was purified by means of the likeness of Pistis Sophia, who had appeared to the Primal Parent inside the waters. Consequently, rightly it has been said, “(it appeared) through the waters.” Because it gives life to everything, [] the holy water purifies everything.'
