base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/010.yaml
  text: 'When the Primal Parent saw how beautifully the light glowed, he was astonished and became deeply ashamed. As that light came forth, a truly wondrous human likeness appeared within it. No one saw it except the Primal Parent and Pronoia, who lived with him. Nevertheless, its light appeared to all the hosts of heaven, and because of this they were all troubled.


    When Pronoia saw that messenger, she fell in love with him. But he loathed her because she lived in darkness. She wanted to embrace him, but she could not. When she could not quench her love, she poured out her light upon the earth. From that day, that messenger has been called “Adam of Light,” which translated means “the radiant man of blood.” And the earth was spread out above him, [7] the holy Adaman, which translated means “the Holy Land of the Adamantine.”


    From that day, every authority has honored the blood of the virgin, and the earth was purified because of the blood of the virgin. In addition, the water was purified through the likeness of Pistis Sophia, who had appeared to the Primal Parent within the waters. Therefore, it has rightly been said, “(it appeared) through the waters.” Because it gives life to everything, [] the holy water purifies everything.'
translation:
  language: zh_hans
  text: '原初之父看见那光辉映得如此美丽，就惊奇不已，并且深感羞愧。那光显现出来时，其中出现了一个极其奇妙的人形；除了原初之父和与他同住的普罗诺亚[a]，没有人看见那人形。然而，那人形的光向天上的众军显现，因此他们全都不安起来。


    后来，普罗诺亚看见那位使者，就爱上了他；但他厌恶她，因为她住在黑暗中。她想拥抱他，却不能。她无法平息自己的爱，便把自己的光倾注到大地上。从那天起，那位使者就被称为“光之亚当”，翻译出来就是“发光的血之人”。大地在他上方铺展开来，就是神圣的阿达曼[b]；这个名称翻译出来就是“金刚石般坚固者的亚当圣地”[c]。


    从那天起，各个权势都尊崇童女的血；大地也因童女的血而得洁净。此外，水也借着皮斯蒂斯·索菲亚[d]的形像得了洁净；她曾在水中向原初之父显现。因此，有话说“（它显现）经过众水”，确实恰当。圣水因赐生命给万物，[e]便洁净万物。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “普罗诺亚”音译自希腊语名称，通常有“预先思虑、预知、眷顾”等含义；此处作为人物名称保留音译。
    reason: 保留专名功能和词义范围，避免以单一中文释义消除歧义。
  - marker: b
    text: “阿达曼”是专名音译，与“亚当”及下文“金刚石般坚固者”的文字关系有关；确切词形仍待科普特语底本核对。
    reason: 原见证含有词源游戏，单纯意译或音译都不足以完整呈现。
  - marker: c
    text: 原句的名称解释十分晦涩，也可理解为“金刚石般坚固的圣地”或“阿达曼的圣地”。本译文暂按所供英文见证保留其词源张力。
    reason: 说明真实的文本与翻译不确定性，而不在正文中武断解决。
  - marker: d
    text: “皮斯蒂斯·索菲亚”是专名音译；两个希腊语词通常分别与“信、信实”和“智慧”有关。
    reason: 帮助普通读者理解名称构成，同时避免把专名直接改成抽象概念。
  - marker: e
    text: 所供见证此处有空方括号，可能表示抄本缺损、无法辨认或待补文字；本译文以此脚注标示该处存在文本空缺。
    reason: 保留原资料所标出的损坏或复原信号，又避免在正文中留下含义不明的空括号。
lexical_decisions:
- source_word: Primal Parent
  choice: 原初之父
  rationale: 据所供见证译出这一宇宙论称号；“之父”保持尊严，也避免现代口语“家长”的制度性联想。由于科普特语核对尚待进行，此译法属暂定。
- source_word: Pronoia
  choice: 普罗诺亚
  rationale: 将专名音译，并以脚注说明其希腊语概念背景，不直接译成“预知”或“天意”，以免抹去其作为人物名称的功能及原有歧义。
- source_word: human likeness
  choice: 人形
  rationale: 保留“像／形态”的意味，不直接写成“一个人”，以免把显现的性质解释得过实。
- source_word: hosts of the heavens
  choice: 天上的众军
  rationale: 采用庄重而可懂的传统宇宙论表达，指天界成群的存在者，不将其窄化为现代军事力量。
- source_word: messenger
  choice: 使者
  rationale: 不擅自译成“天使”；原见证只明确表达受差遣者或传信者。
- source_word: Adam of Light
  choice: 光之亚当
  rationale: 保持名称结构及亚当意象，不扩写其神学身份。
- source_word: radiant man of blood
  choice: 发光的血之人
  rationale: 尽量保留见证中不寻常的词源解释及其张力，不润饰成较顺口却不同义的表达。
- source_word: Adaman
  choice: 阿达曼
  rationale: 按专名音译，使其与“亚当”有关而又不完全相同的文字关系仍可辨认。
- source_word: Adamantine
  choice: 金刚石般坚固者
  rationale: 兼顾“金刚石的”与“坚不可摧的”双重语感；因原句词源关系晦涩，正文保持略带异质感，并以脚注提示暂定。
- source_word: authority
  choice: 权势
  rationale: 保留古代宇宙论中掌权存在者的可能含义，不定为世俗官府，也不预先判定其善恶。
- source_word: Pistis Sophia
  choice: 皮斯蒂斯·索菲亚
  rationale: 作为专名音译；脚注交代组成词通常与“信／信实”和“智慧”有关，而不强行翻译为普通抽象名词。
- source_word: through the waters
  choice: 经过众水
  rationale: 保留引语的空间或媒介歧义；“众水”反映古代宇宙论语感，同时不将其解释为洗礼公式。
theological_decisions:
- issue: “原初之父”对光感到羞愧的原因
  choice: 仅译作“深感羞愧”，不补明原因
  alternative: 解释为因光的优越、自己的欠缺或被揭露而羞愧
  rationale: 见证没有明确给出羞愧的对象或原因，补释会消除叙事张力。
- issue: 光中人形与“光之亚当”的同一关系
  choice: 沿叙事保留关联，但不明说两者本体上完全等同
  alternative: 直接把“人形”从首次出现起称为“光之亚当”
  rationale: 名称是在后文才赋予“使者”的；提前认定会替文本完成其未明说的身份论推断。
- issue: 普罗诺亚对使者的爱及使者的厌恶
  choice: 按见证直译为爱、厌恶与拥抱未遂
  alternative: 弱化为属灵向往、拒绝或不能联合
  rationale: 原叙事使用强烈拟人及欲望语言，应保存其不适感，不作寓意化消解。
- issue: 童女之血的身份与功效
  choice: 保留“童女的血”以及洁净大地的陈述，不指认童女是谁
  alternative: 将童女认定为普罗诺亚、某位索菲亚或其他特定人物
  rationale: 当前所供段落没有明示其身份；也不应把后世教义人物强行带入。
- issue: 水借皮斯蒂斯·索菲亚的形像得洁净
  choice: 保留“借着……的形像”这一媒介表述
  alternative: 改为由皮斯蒂斯·索菲亚本人直接洁净
  rationale: “形像”在原见证中具有独立作用，不能静默删除或本体化。
- issue: “经过众水”引语的来源与所指
  choice: 保留为未注明来源的引语，并用圆括号表示见证中的补足
  alternative: 指认某一正典经文，或断定“它”就是特定人物／形像
  rationale: 所供材料未确定引文来源和省略主语，译文应保存不确定性。
- issue: 圣水赐生命并洁净万物
  choice: 照文本陈述，不解释为特定圣礼教义
  alternative: 明确解释为洗礼之水或某宗派的圣水观
  rationale: 段落本身处于其独特宇宙论脉络，不足以支持宗派化限定。
