    However, before all of these, when he had appeared on the first day, he lingered on earth approximately two days, and departed from the lower Pronoia in heaven, and ascended towards his light, and straightaway darkness obscured the entire cosmos.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/013.yaml
  text: 'The primal Psyche loved Eros, who lived with her, and poured her blood over him and over the earth. From that blood, the first rose sprouted from the earth, emerging from the thorn bush as a source of gladness for the light that was to appear from within the bush.


    In addition, after this, lovely flowers with pleasant fragrances sprouted from the earth in different varieties. They came from each of the virgin daughters of Pronoia, and when the daughters fell in love with Eros, they poured out their blood over him and over the earth.


    After these, all the plants sprouted from the earth in different varieties, bearing within themselves the seed of the authorities and their angels.


    After these, the authorities created different varieties of animal species from the waters, including reptiles and birds, bearing within themselves the seed of the authorities and their angels.


    However, before all these, when he appeared on the first day, he remained on earth for about two days. Then he departed from the lower Pronoia in heaven and ascended toward his light. Immediately, darkness obscured the entire cosmos.'
translation:
  language: zh_hans
  text: '原初的普绪克[a]爱上了与她同住的厄洛斯[b]，把自己的血倾倒在他身上，也倾倒在地上。那血使第一朵玫瑰从地里萌发，从荆棘丛中长出，给那将要从荆棘丛中显现的光带来喜乐。


    此后，各种芳香可爱的花朵也从地里萌发。它们出自普罗诺亚[c]的每一位童贞女儿；这些女儿爱上厄洛斯之后，就把自己的血倾倒在他身上，也倾倒在地上。


    此后，各种植物都从地里萌发，各自在里面带着众掌权者[d]和他们天使的种子。


    此后，众掌权者从水中造出各种动物，包括爬行动物和鸟类；它们各自在里面带着众掌权者和他们天使的种子。


    然而，在这一切以前，他在第一日显现时，曾在地上停留约两日；随后，他离开天上较低的普罗诺亚，上升朝向自己的光。黑暗立刻遮蔽了整个宇宙。[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “普绪克”音译自希腊语 Psyche，字面可指“灵魂”；这里作为人格化角色的名称。
    reason: 兼顾专名身份与词源含义。
  - marker: b
    text: “厄洛斯”音译自希腊语 Eros，可指“爱”或“爱欲”；这里作为人格化角色的名称。
    reason: 避免中文读者把音译误认为无语义的普通人名。
  - marker: c
    text: “普罗诺亚”音译自希腊语 Pronoia，可表示“预知”“预谋”或“天意／眷顾”；这里作为人格化角色的名称。
    reason: 该词含义丰富，单一意译会过早限定解释。
  - marker: d
    text: “掌权者”指具有统治权能的超人间存在；此处不进一步判定其性质。
    reason: 说明称谓范围而不导入宗派化判断。
  - marker: e
    text: 末段“他”的身份在现有英文见证中并不明确；“天上较低的普罗诺亚”也可能理解为“较低天界中的普罗诺亚”。科普特语原文复核尚待完成。
    reason: 公开交代代词和句法歧义，并注明当前译稿的证据限制。
lexical_decisions:
- source_word: Psyche
  choice: 普绪克
  rationale: 保留希腊专名的音译，避免仅译作“灵魂”而抹去其人格化角色；脚注说明其词义。
- source_word: Eros
  choice: 厄洛斯
  rationale: 作为人格化角色采用通行音译，不径直译成“爱欲”，以兼顾专名性质。
- source_word: Pronoia
  choice: 普罗诺亚
  rationale: 保留专名及其文本传统中的人格化意味，并用脚注交代“预知／天意”这一语义范围。
- source_word: authorities
  choice: 众掌权者
  rationale: 表达超人间统治势力的集体称谓，同时不额外指定其善恶属性或套入特定宗派术语。
- source_word: cosmos
  choice: 宇宙
  rationale: 此处指整体有序世界，“宇宙”比“世界”更能涵盖其范围。
- source_word: seed
  choice: 种子
  rationale: 保留原见证文本的具体隐喻，不将其解释为血统、本质或灵性成分。
theological_decisions:
- issue: 末段代词“he”的所指
  choice: 保留为“他”，不明确指认
  alternative: 译成“厄洛斯”或其他特定角色名称
  rationale: 所据见证的代词指向含混；明确补名会替文本消除真实歧义。
- issue: “lower Pronoia”的结构关系
  choice: 译作“天上较低的普罗诺亚”
  alternative: 译作“较低天界中的普罗诺亚”
  rationale: 保留其可能指普罗诺亚的较低层面这一读法，同时以脚注提示原句结构存在歧义。
- issue: 植物和动物所带的“种子”
  choice: 按字面保留，不作神学解释
  alternative: 解释成掌权者的本质、灵种或后裔
  rationale: 原见证没有在此明确界定隐喻，故不引入后起体系化解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。神话性人格专名使用音译并辅以脚注；重复的“此后”与“倾倒在……身上，也倾倒在地上”有意保留，以呈现原见证的递进结构和仪式性色彩。当前仅能依据所供公共领域英文见证起草，尚未完成科普特语原文核校，因此对末段代词及句法保持克制。
