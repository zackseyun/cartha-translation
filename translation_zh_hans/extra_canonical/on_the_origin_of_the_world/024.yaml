base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/024.yaml
  text: 'Let us return to the archons we discussed earlier, so that we can explain them.


    When the seven archons had been thrown down from their heavens to the earth, they made many demonic angels to serve them. These angels taught humanity various kinds of error, magic, potions, idol worship, bloodshed, altars, temples, sacrifices, and drink offerings to all the earthly demons. They worked together with fate, who came into being through the agreement between the gods of injustice and justice. In this way, once the world had come into being, it went astray and remained continually confused, because all people on earth worshiped demons from the creation to the consummation of the age, both the angels of righteousness and the humans of unrighteousness.


    In this way, the world came to exist in confusion, ignorance, and a stupor. They had all gone astray until the true man appeared.


    Let this be enough concerning the subject.'
translation:
  language: zh_hans
  text: '**七位统治者和他们属魔的天使**


    现在，让我们回到先前谈过的那些统治者[a]，对他们作一番说明。


    七位统治者从各自的天上被摔到地上以后，就为自己造了许多属魔的天使来服侍他们。这些天使教给人类种种谬误、法术、药剂[b]、偶像崇拜、杀戮，以及祭坛、庙宇、祭牲和献给地上一切邪灵的奠酒。他们与命运一同运作；命运是由不义之神与正义之神彼此达成协议而产生的。世界就这样形成了，也走入歧途，不断陷在混乱之中；因为从创造之初直到时代的终结，地上所有人都敬拜邪灵——无论是正义的天使，还是不义的人类[c]。


    世界就是这样在混乱、无知和昏沉中形成的。所有的都走入了歧途，直到那真正的人显现[d]。


    关于这个题目，说这些就够了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “统治者”对应通常译作 archons 的称谓，指本篇叙事中具有宇宙辖制权的灵界掌权者。
    reason: 帮助普通读者理解此处并非一般政治官员，同时避免以音译制造不必要障碍。
  - marker: b
    text: “药剂”也可理解为药水、毒剂或用于法术的调制物；现有英译见证无法进一步确定。
    reason: 保存 potions 的词义范围，且科普特语原文复核尚未完成。
  - marker: c
    text: “正义的天使”和“不义的人类”与前句的语法关系并不清楚：它们可能指敬拜者，也可能与受敬拜的对象有关。译文保留了这种不协调，没有强行确定。
    reason: 供应材料特别标明此句存在真实的语法歧义。
  - marker: d
    text: “真正的人”也可能是具有称号意味的“真人”；这里没有进一步确定他是谁。
    reason: 避免在原始语言复核前将该表达教义化或专名化。
lexical_decisions:
- source_word: archons
  choice: 统治者
  rationale: 采用可懂的现代汉语表达其掌权、辖制之意，避免直接音译；同时不把它限定为世俗官长。
- source_word: demonic angels
  choice: 属魔的天使
  rationale: 保留“天使”这一类属与其邪恶归属之间的张力；不简化成“恶魔”，以免抹去原文的复合表达。
- source_word: magic
  choice: 法术
  rationale: 自然表达施行超自然技艺之意，同时避免现代舞台“魔术”的联想。
- source_word: potions
  choice: 药剂
  rationale: 底本文义可能涵盖药物、药水或与法术有关的调制物；正文用中性上位词，歧义见脚注。
- source_word: libations
  choice: 奠酒
  rationale: 准确表现以酒或液体浇奠献祭的礼仪行为。
- source_word: fate
  choice: 命运
  rationale: 保留其在叙述中近似人格化力量的地位，不另行套入特定宗教体系术语。
- source_word: stupor
  choice: 昏沉
  rationale: 兼顾精神麻木、迟钝和失去清醒的语感，比“昏迷”更适合描述世界整体的状态。
- source_word: true man
  choice: 真正的人
  rationale: 直译核心对比而不预先认定这是专名、某一特定人物或教义称号；相关可能性留在脚注。
theological_decisions:
- issue: “不义之神与正义之神”之间的关系
  choice: 命运由双方彼此达成协议而产生
  alternative: 命运由诸位不义与正义的神共同商定而产生
  rationale: 保留两类神祇及其“协议”所造成的神学张力，不把“正义”一方改写成善良或至高的神。
- issue: 末尾“正义的天使／不义的人类”短语的句法归属
  choice: 在正文中以破折号接在敬拜邪灵的陈述之后，并直译为“无论是……还是……”
  alternative: 将其解释为受敬拜的两类对象，或改作从创造至终结期间的两类敬拜者
  rationale: 现有英译见证明确指出语法含混；正文维持突兀的并列关系，脚注说明而不替原文消解矛盾。
- issue: “真正的人”的身份
  choice: 不指明其身份
  alternative: 译作带专名意味的“真人”，或明确为某位救主／基督
  rationale: 所给材料不足以确认其所指；避免导入宗派性或特定解释传统。
- issue: “所有的都走入了歧途”的范围
  choice: 保留宽泛的“所有的”
  alternative: 明确改成“所有人”或“所有受造物”
  rationale: 英语见证使用范围可宽可窄的代词；不在缺乏科普特语核查时擅自限定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式保留古代宇宙论叙事的肃穆感，但拆分过长句以提高可读性。鉴于科普特语源文审查尚待完成，本稿以所供公共领域英语见证为主要依据，并对关键词义及末句句法歧义作显式标注。
