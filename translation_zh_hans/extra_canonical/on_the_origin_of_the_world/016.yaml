base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/016.yaml
  text: 'Eve is the first virgin, the one who bore her first child without a husband. She acted as her own midwife, and because of this she is said to have declared:


    I am the one who is part of my mother,

    and I am the one who is the mother.

    I am the one who is the wife;

    I am the one who is the virgin.

    I am the one who is pregnant;

    I am the one who is the midwife.

    I am the one who eases the pains of childbirth.

    My husband is the one who gave birth to me,

    and I am the one who is his mother,

    and he is the one who is my father and my lord.

    He is the one who is my strength.

    Whatever he wishes, he speaks with reason.

    I am on the way to becoming,

    although I have already given birth to a man as a lord.


    Now these things were revealed, by the will of Sabaoth and his Christ, to the souls that were to enter the shaped forms of the authorities. Concerning these, the holy voice said, “Multiply and flourish; rule over all created beings.” They were the ones who, according to their destinies, were taken captive by the Primal Parent. In this way they were locked inside the prisons of the shaped forms <. . .> until the consummation of the age.'
translation:
  language: zh_hans
  text: '夏娃是第一位童女；她没有丈夫，却生下了自己的头生子。她亲自为自己接生，因此据说她曾这样宣告：


    我是我母亲的一部分，

    我也是那母亲。

    我是妻子；

    我是童女。

    我是怀孕者；

    我是接生者。

    我是缓解产痛者。

    我的丈夫生了我，

    而我是他的母亲；

    他是我的父亲，也是我的主。

    他是我的力量。

    凡他所愿的，他都合乎理性地说出。

    我正在成为的路上，[a]

    虽然我已经生下一个男子作主。[b]


    这些事，照着萨巴奥特和他的基督的旨意，向那些将要进入掌权者所塑形体的灵魂显明了。论到这些灵魂，那神圣的声音说：“要增多，要繁盛；要统治一切受造之物。”它们就是那些按着各自的定命，被原初生养者掳去的；这样，它们便被囚禁在所塑形体的牢狱里<cite>[c]</cite>，直到这世代终结。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我正在成为的路上”原句含义不明，也可理解为“我正走向生成”或“我正在形成”。
    reason: 保留英文见证中 on the way to becoming 的真实含混性，并提示尚待科普特文复核。
  - marker: b
    text: “生下一个男子作主”也可能理解为“生下一个男人，即一位主”；句法关系尚不确定。
    reason: 避免擅自判定“作主”修饰男子的身份、地位还是生育结果。
  - marker: c
    text: 此处原见证有残缺，残文标记为“<. . .>”。
    reason: 明确保存抄本或文本传承中的缺损，不以推测补足。
lexical_decisions:
- source_word: virgin
  choice: 童女
  rationale: 采用庄重而通俗的传统用语，既表达未有性关系的女子，也保留本文反复宣告中的宗教文学语感。
- source_word: part of my mother
  choice: 我母亲的一部分
  rationale: 直存原句的关系性与含混性，不擅自解释为身体部位、后裔或分有本质。
- source_word: authorities
  choice: 掌权者
  rationale: 保留宇宙论中具人格性的统治势力之意，避免弱化为抽象的“权力”。
- source_word: shaped forms
  choice: 所塑形体
  rationale: 体现这些形体被塑造而成，并与后文“形体的牢狱”保持词语呼应。
- source_word: Primal Parent
  choice: 原初生养者
  rationale: 避免将原文见证中未明确性别的 Parent 强行定为父或母，同时表达其先在与生养关系。
- source_word: consummation of the age
  choice: 这世代终结
  rationale: 保留末世性的“世代”概念，不泛化为普通的时间结束。
- source_word: speaks with reason
  choice: 合乎理性地说出
  rationale: 保留 reason 可能兼具理性、道理或逻各斯色彩的张力，不扩写为特定教义术语。
theological_decisions:
- issue: “我的丈夫生了我”与“我是他的母亲”的悖论关系
  choice: 按原有亲属称谓和生育动词直译
  alternative: 解释为象征性的产生、发出或属灵母子关系
  rationale: 文本刻意并置妻子、童女、母亲、女儿等身份；解释性改写会消除其修辞和神学张力。
- issue: “他的基督”中所有关系
  choice: 他的基督
  alternative: 他所膏立的基督／弥赛亚
  rationale: 保留见证文本的简洁所有格，不预先界定萨巴奥特与基督之间的具体本体或职分关系。
- issue: 灵魂被掳并囚于形体中的宇宙论
  choice: 以文本自身陈述呈现
  alternative: 改写为堕落、道成肉身或一般灵魂进入身体的教义表达
  rationale: 不把本文独特宇宙论同化为任何后来的宗派体系。
- issue: “按着各自的定命”
  choice: 定命
  alternative: 命运／预定
  rationale: “定命”既保留命定因素，又不明确导向宿命论或某一预定论体系。
translation_notes:
  register: 采用现代、庄重而可读的简体中文；诗体部分保留排比和身份悖论，散文部分保持宇宙论术语的一致性。由于所给 drafting basis 明示尚未完成科普特文直接复核，本稿以公共领域英文见证为临时依据，所有可能受源语句法影响的关键处均从谨处理。注意：正文中的残文脚注标记应为普通标记“[c]”；提交文本现写作“<cite>[c]</cite>”仅用于紧邻残缺位置，出版排版时应统一显示为“[c]”，并保留原残文符号“<. . .>”。
