  revised_text: '雅达巴沃之子萨巴欧特听见皮斯蒂斯的声音，就歌颂她。他遵照皮斯蒂斯的吩咐，斥责自己的父亲〔和母亲〕[a]，又赞美她，因为她把不死之人和他的光教给了他们。随后，皮斯蒂斯·索菲亚伸出手指，把自身之光的一部分倾注在他身上，以此斥责他的父亲。萨巴欧特蒙光照后，便获得了足以对抗混沌一切军势的极大权柄。从那天起，他就被称为“万军之主”。



    他鄙弃自己的父亲黑暗和自己的母亲深渊，也憎恨自己的姊妹——原初亲本的意念；她曾在众水之上来回运行。由于他身上的光，混沌的一切掌权者都嫉妒他。他们心中不安，便在七重天中发动了一场大战。



    皮斯蒂斯·索菲亚看见这场战争，就从自己的光中派出七位大天使，到萨巴欧特那里。他们把他托举到第七重天，站在他面前侍奉他。她又给他派去另外三位大天使，并为他设立统辖众人的国度，使他可以居于混沌的十二位神之上。



    萨巴欧特因悔改而获得安息的居所作为报偿之后，皮斯蒂斯又把自己的女儿佐伊赐给他，并赐下极大的权柄，好让她把第八重天中存在的一切教导他。他既有权柄，首先便为自己建造了一座宫殿。这宫殿宏伟壮丽，比七重天中所有的宫殿大七倍。他在自己宫殿前[a]造了一个巨大的宝座，宝座立在一辆有四张脸的战车上；这车名叫“基路宾”。



    基路宾的四角各有八种形状，包括狮形、牛犊形、人形和鹰形，所有形状合计六十四种。又有七位大天使站在车前；他自己是第八位，并且掌有权柄。所有形状合计七十二种。[b]此外，七十二位神的形状都源自这辆战车，好让他们统治列国的七十二种语言。他又在那宝座处造了形如蛇的天使，名叫“撒拉芬”；他们不断颂赞他。'
