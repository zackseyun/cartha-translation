    reason: 保存见证中的算数张力，不擅自协调。
lexical_decisions:
- source_word: Pistis / Pistis Sophia
  choice: 皮斯蒂斯 / 皮斯蒂斯·索菲亚
  rationale: 按专名音译，以免把人物名直接释作“信心”或“信心智慧”而预先消解其专名性质；首次出现的两个形式依见证文本分别保留。
- source_word: Sabaoth
  choice: 萨巴欧特
  rationale: 采用接近原名的现代汉语音译；在称号“万军之主”中则翻译其语义关联。
- source_word: Yaldabaoth
  choice: 雅达巴沃
  rationale: 采用音译，保留诺斯替文献中的专名身份。
- source_word: deathless man
  choice: 不死之人
  rationale: 直译并保留其可能兼具宇宙论称号与一般描述的含混性，不改写为“永生者”或特定神学身份。
- source_word: Chaos
  choice: 混沌
  rationale: 作为宇宙领域使用“混沌”，并在语境中保留其近似专名的功能。
- source_word: authorities
  choice: 掌权者
  rationale: 既表达统治权，也保留其作为宇宙灵体类别的可能性。
- source_word: hosts
  choice: 军势
  rationale: 在“混沌的一切军势”中表达成群武力；称号 Lord of Hosts 则采用汉语传统且易懂的“万军之主”。
- source_word: Zoe
  choice: 佐伊
  rationale: 按人物专名音译，不直接译作“生命”，避免把专名与其词义等同。
- source_word: Cherubin / Seraphin
  choice: 基路宾 / 撒拉芬
  rationale: 采用汉语宗教文献中较熟悉的名称，同时按本文分别指战车名称与蛇形天使群体。
- source_word: Primal Parent
  choice: 太初之亲
  rationale: 保留亲本的性别开放性；不擅自译为“太初之父”或“太初之母”。
theological_decisions:
- issue: 萨巴欧特所得权柄与混沌军势的关系
  choice: “可以制伏混沌的一切军势”
  alternative: “凌驾于混沌的一切军势之上”
  rationale: 英语见证的 against 可表示对抗或相对于；正文采用自然且符合争战语境的“制伏”，但不把它扩大为彻底毁灭。
- issue: 皮斯蒂斯·索菲亚之光与斥责父亲的关系
  choice: “以此斥责他的父亲”
  alternative: “作为对他父亲的定罪”
  rationale: 保留动作具有谴责意义，而不用司法色彩更强的“定罪”。
- issue: 萨巴欧特的悔改
  choice: 明确保留“因悔改而……作为报偿”
  alternative: 弱化为“因回转而得到”
  rationale: 见证文本明确使用 repentance 与 recompense；不因其神学张力而弱化因果和报偿措辞。
- issue: 十二位神与七十二位神
  choice: 直称“神”
  alternative: “神祇”或“诸灵”
  rationale: 原见证明确为 gods；不以较弱或贬义称呼替换，从而保留文本自身的多层神性语言。
- issue: “他自己是第八位”的指代
  choice: 保留“他自己”指萨巴欧特
  alternative: 改作某位未指明的大天使
  rationale: 按上下文最自然地回指萨巴欧特，但不补入见证文本没有的身份说明。
- issue: 六十四与七十二形状的数字张力
  choice: 两项数字均照录并加注
  alternative: 协调或改算其中一个数字
  rationale: 文本先说六十四、后说七十二，可能把七位大天使和萨巴欧特计入总数；译文不静默修正。
