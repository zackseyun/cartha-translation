base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/005.yaml
  text: 'When the heavens had established themselves, together with their hosts and all their government, the Primal Parent grew arrogant. The entire host of angels worshiped him, and all the gods and their angels offered him praise and worship. He became elated and repeatedly boasted to them, “I am self-sufficient.”


    He said, “I am the one who is God, and apart from me nothing else exists.” When he had said this, he transgressed against all the deathless ones who speak with words, and they accused him because of it.


    When Pistis witnessed the impiety of the chief archon, she became enraged. Though unseen, she said, “You are mistaken, Samael”—that is, “Blind God.” “There is a deathless man of light who existed before you, and he will appear among the forms you have shaped. He will trample you in contempt, as a potter’s vessel is trampled, and you will plunge down to your mother, the Abyss, together with those who belong to you. For when all your works are completed, the whole deficiency exposed by the truth will be abolished. Its existence will end, and it will be as though it had never existed.”


    After saying this, Pistis revealed the likeness of her greatness in the waters. Having done this, she withdrew back up into her light.'
translation:
  language: zh_hans
  text: '诸天连同其中的众军和一切治理体系都确立以后，原初之父便骄傲自大。天使的全军都敬拜他，众神和他们的天使也都向他献上赞美和敬拜。他得意扬扬，一再向他们夸口说：“我是自足的。”


    他说：“我就是神；除我以外，再没有任何存在。”他说了这话，便冒犯了所有能以言语表达的永生者；他们也为此指控他。


    皮斯蒂斯[a]看见首席执政者[b]的不敬虔，便勃然大怒。她虽不可见，却说：“萨麦尔，你错了！”“萨麦尔”意为“盲目的神”。“有一位永生的光明之人，在你以前就已存在；他必显现在你所塑造的形体之中。他必轻蔑地践踏你，如同践踏陶匠的器皿；你和一切属你的人必一同坠落到你的母亲——深渊[c]那里。因为等你的一切作为完成以后，那被真理揭露的整个缺失[d]必被废除；它的存在必告终结，仿佛从未存在过一样。”


    皮斯蒂斯说完这话，便在众水中显出她伟大之形像；随后，她退回上方，进入自己的光中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “皮斯蒂斯”音译自 Pistis，希腊语意为“信”或“信实”；此处用作一位属天角色的名称。
    reason: 音译可避免把专名误读成一般抽象名词，同时补充其可感知的词义。
  - marker: b
    text: “执政者”译自 archon；在这类古代宇宙论文本中，通常指掌管某一层领域的超自然统治者。
    reason: 该词在现代汉语中容易被理解为世俗官员，需交代文献语境。
  - marker: c
    text: “深渊”在这里被人格化为萨麦尔的母亲，也可理解为他所源出的幽深领域。
    reason: 帮助读者理解“母亲”与宇宙领域并置的特殊表达，而不排除其隐喻性。
  - marker: d
    text: “缺失”也可译作“匮乏”或“不完满”；这里没有明确说明它究竟指无知、邪恶，还是整个有缺陷的秩序。
    reason: 标示关键抽象词的译法范围，并保存原段的神学歧义。
lexical_decisions:
- source_word: Primal Parent
  choice: 原初之父
  rationale: “原初”保留其宇宙起源语境；依见证文本的阳性代词及角色定位译作“父”，比泛称“亲本”更自然庄重，同时不把该称号等同于正统神学中的父神。
- source_word: hosts
  choice: 众军
  rationale: 保留天上成队群体的军事—宇宙论色彩，并与后文“天使的全军”呼应。
- source_word: government
  choice: 治理体系
  rationale: 既表达统治、权制和秩序，也避免把复合宇宙结构窄化为现代意义的“政府”。
- source_word: self-sufficient
  choice: 自足的
  rationale: 准确传达无需依靠他者、凭自身存在或完备的宣称，并保留其哲学意味。
- source_word: deathless ones
  choice: 永生者
  rationale: 在自然现代汉语中表达不受死亡支配者；不擅自将其具体化为某一种天界阶层。
- source_word: use verbal articulation
  choice: 能以言语表达
  rationale: 保留“借有声或有结构的言语表达”的限定，同时避免生硬的“使用言语发音”。
- source_word: chief archon
  choice: 首席执政者
  rationale: “执政者”是 archon 在诺斯替文献语境中的常用中性译法；“首席”保留其居首地位，不将其解释为政治官职或某特定魔鬼称号。
- source_word: man of light
  choice: 光明之人
  rationale: 保留 man 的人形/人物意象和光明属性，不提前判定其具体救赎论身份。
- source_word: forms
  choice: 形体
  rationale: 表现被塑造的可见样式或身体形式，同时保留其指涉范围的开放性。
- source_word: Abyss
  choice: 深渊
  rationale: 以专名化处理呈现其宇宙论实体/领域含义，同时保留普通词“深渊”的形象。
- source_word: deficiency
  choice: 缺失
  rationale: 保留原文抽象的匮乏、不完满之意，不将其教义化为“罪恶”或“物质世界”。
- source_word: likeness of her greatness
  choice: 她伟大之形像
  rationale: 保留“likeness”与“greatness”之间较为含混的属格关系，不擅自解释为她本体、倒影或具体人体形貌。
theological_decisions:
- issue: “我就是神；除我以外……”与一神论措辞的关系
  choice: 直译为角色的排他性神性宣称
  alternative: 改写为“我是唯一的神”或弱化为“我是一个神”
  rationale: 原段旨在呈现该角色的狂妄与越界；保持排他宣称，才能保留它与随后反驳之间的神学张力。
- issue: “永生的光明之人”的身份
  choice: 保持描述性称谓，不确定其身份
  alternative: 明确译作基督、原人或属天亚当
  rationale: 所给见证文本未在本段明确等同关系；不引入特定学派或宗派解释。
- issue: “你的母亲——深渊”的本体关系
  choice: 保留亲属隐喻与专名并置
  alternative: 解释为他源自混沌、阴间或物质
  rationale: “母亲”可能表达来源、归属或拟人关系；直译可保留这种宇宙论张力。
- issue: 最终“缺失”被废除
  choice: 保留抽象名词及存在终结的强烈表述
  alternative: 解释为罪、邪恶、无知或受造界被消灭
  rationale: 原文并未在本段把 deficiency 明确限定为其中任何一项，故不替文本作体系化判定。
- issue: 皮斯蒂斯在水中显出的内容
  choice: 译为“她伟大之形像”
  alternative: 译为“她伟大的本体”“她宏伟的倒影”或“她的伟大形体”
  rationale: 保留 likeness 与 greatness 的语义关系和显现方式的不确定性。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。叙事部分力求流畅，宣告部分保留审判式力度。因现有 drafting basis 明示科普特语原文复核尚待完成，本稿以所供公共领域英文见证为依据，专名和关键宇宙论术语采取审慎、可回溯的译法；未来应据 Nag Hammadi Codex II,5 及相关见证复核。“皮斯蒂斯”“萨麦尔”采用通行音译；脚注标记均已置入正文。
