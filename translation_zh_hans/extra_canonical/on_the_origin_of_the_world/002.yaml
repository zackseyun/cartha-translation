  revised_text: '不死者的自然形态从无限之中发展完毕以后，就在那时，一个名叫索菲亚[a]的形像从皮斯蒂斯[b]流溢而出。她运用自己的意志，成为一个像太初之光的受造者；她的意志随即显现为天的形像，其广大不可测度，处在不死者与后来产生的诸存在之间，仿佛［……］。她如同一道帷幕，将人类与上方的诸存在隔开。


    真理的永世[c]没有外在的阴影，因为无限之光无处不在地住在其中。然而，它的外部是一片称为“黑暗”的阴影。从这阴影中出现了一支统治黑暗的众军；后来产生的众军称这阴影为“无限的混沌”。各类神明都从其中向上涌出［……］，连同整个领域；而且，阴影是在第一个［］受造者之后出现的。它源自前面所说的皮斯蒂斯，显现在〈深渊里面〉[d]。


    随后，阴影意识到有比自己更强大的存在，就生了嫉妒。它凭自己的意志怀了孕，随即生下妒忌。从那日起，妒忌之律在所有永世及其世界中盛行，就显明出来。至于这妒忌，人们发现它是一个流产之物，里面毫无灵。它在一大片水性物质之中成为阴影。从阴影产生的胆汁，随后被抛进混沌的一处。


    从那日起，一种水性物质就显明出来；沉入其中的东西喷涌流去，却仍可在混沌中看见。正如妇人生孩子时，积聚在她里面的一切物质都喷涌而出；同样，物质也从阴影中产生，被推离阴影，却没有离开混沌。


    雅尔达巴奥特的显现


    物质反而留在混沌之中，住在混沌的一处。这些事发生以后，皮斯蒂斯来到，显现在混沌的物质上方；那物质像流产的胎儿一样被排出，其中没有一点灵，因为它全是无限的黑暗和无底的水。皮斯蒂斯看见自己的缺陷所造成的结果，就烦乱起来；这烦乱显现为一个可怕的受造者，在混沌中急速向她奔来。她转向它，在位于诸天之下［］的深渊中，向它脸上吹气。皮斯蒂斯·索菲亚有意使这个没有灵的存在被塑成一个形像，统治物质和她所有的众军。于是，一个形似狮子、兼具男女两性的执政者[e]首次从水中显现；他自身拥有大权，却不知道自己从哪里而来。


    皮斯蒂斯·索菲亚看着他在深水中四处活动，就对他说：“孩子，到这里来。”这句话也就是“雅尔达—巴奥特”[f]。从那日起，分节言语之律显现出来，延伸到众神、天使和人类；凡因分节言语而产生的，都是由众神、天使和人类完成的。


    至于执政者雅尔塔巴奥特，他不知道皮斯蒂斯的力量。他没有看见她的脸，只看见水中与他说话的形像。因为那声音，他称自己为“雅尔〈达巴〉奥特”[g]。然而，完全者称他为“阿里埃尔”[h]，因为他形似狮子。


    他取得统治物质的权柄以后，皮斯蒂斯·索菲亚便退回上方，进入自己的光中。'
