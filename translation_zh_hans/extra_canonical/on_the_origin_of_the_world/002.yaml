  text: 'After the natural form of the deathless beings had finished developing out of infinity, a likeness called Sophia emanated from Pistis. She exercised her will and became a created being like the primordial light. Immediately, her will appeared in the likeness of heaven, possessing an incomprehensible size between the deathless beings and the beings that came into existence afterward, resembling [. . .]. She acted as a veil separating humanity from the beings above.


    Now, the aeon of Truth has no external shadow, because the infinite light dwells everywhere within it. Its exterior, however, is a shadow called “Darkness.” From it appeared a host that ruled over the darkness, and the hosts that came into being afterward called the shadow “Infinite Chaos.” From it every kind of divinity sprang upward [. . .] together with the entire place, with the further result that shadow came after the first [] created being. It appeared <inside> the Abyss, originating from the previously mentioned Pistis.


    The shadow then realized that something more powerful than itself existed and became envious. When it had become pregnant through its own will, it immediately gave birth to jealousy. From that day, the law of jealousy prevailing among all the aeons and their worlds has been evident. Now, this jealousy was found to be an aborted fetus with no spirit within it. It came into being as a shadow within an immense watery substance. The bile that had come from the shadow was then thrust into a region of Chaos.


    From that day, a watery substance has been evident, and what sank down within it gushed away while remaining visible within Chaos. As with a woman giving birth to a child, when all her accumulated matter gushes out, so matter came into being from a shadow and was driven away from it, yet it did not leave Chaos.


    The Manifestation of Yaldabaoth


    Instead, matter remained within Chaos, dwelling in one of its regions. After these things had happened, Pistis arrived and appeared above the matter of Chaos, which had been expelled like an aborted fetus, since no spirit dwelled within it, for it was entirely infinite darkness and bottomless water. When Pistis saw what had resulted from her defect, she became troubled. Her distress appeared as a frightful created being that hurried toward her in Chaos. She turned toward it and blew into its face within the Abyss, which lies beneath [] all the heavens. Pistis Sophia then willed that the being without spirit should be formed into a likeness and should rule over matter and all her hosts. For the first time, an androgynous archon resembling a lion appeared from the waters, possessing great authority within himself and not knowing where he had come from.


    As Pistis Sophia watched him moving about in the watery depths, she said to him, “Child, pass over here,” which is the same as yalda-baoth. From that day, the law of articulate speech appeared and extended to the gods, the angels, and humanity. What had come into being through articulate speech was brought to completion by the gods, the angels, and humanity.


    Now, the archon Yaltabaoth was unaware of the power of Pistis. He did not see her face but instead saw in the water the likeness that spoke with him. Because of that voice, he called himself “Yald<ab>aoth.” The perfect ones, however, call him “Ariael,” because he resembled a lion.


    When he had gained authority over matter, Pistis Sophia withdrew upward into her light.'
translation:
  language: zh_hans
  text: '不死者的自然形态从无限之中发展完毕以后，就在那时，一个名叫索菲亚[a]的形像从皮斯蒂斯[b]流溢而出。她运用自己的意志，成为一个像太初之光的受造者；她的意志随即显现为天的形像，其广大不可测度，处在不死者与后来产生的诸存在之间，仿佛［……］。她如同一道帷幕，将人类与上方的诸存在隔开。


    真理的永世[c]外面没有阴影，因为无限之光无处不在地住在其中。然而，它的外部是一片称为“黑暗”的阴影。从这阴影中出现了一支统治黑暗的众军；后来产生的众军称这阴影为“无限的混沌”。各类神明都从其中向上涌出［……］，连同整个领域；而且，阴影是在第一个［］受造者之后出现的。它源自前面所说的皮斯蒂斯，显现在〈深渊里面〉[d]。


    随后，阴影意识到有比自己更强大的存在，就生了嫉妒。它凭自己的意志怀了孕，随即生下妒忌。从那日起，妒忌之律在所有永世及其世界中盛行，就显明出来。至于这妒忌，人们发现它是一个流产之物，里面毫无灵。它在一大片水质之中成为阴影。从阴影产生的胆汁，随后被抛进混沌的一处。


    从那日起，一种水质就显明出来；沉入其中的东西喷涌流去，却仍可在混沌中看见。正如妇人生孩子时，积聚在她里面的一切物质都喷涌而出；同样，物质也从阴影中产生，被推离阴影，却没有离开混沌。


    雅尔达巴奥特的显现


    物质反而留在混沌之中，住在混沌的一处。这些事发生以后，皮斯蒂斯来到，显现在混沌的物质上方；那物质像流产的胎儿一样被排出，其中没有一点灵，因为它全是无限的黑暗和无底的水。皮斯蒂斯看见自己缺失所造成的结果，就忧乱起来；这忧乱显现为一个可怕的受造者，在混沌中急速向她奔来。她转身朝向它，在位于诸天之下［］的深渊中，向它脸上吹气。皮斯蒂斯·索菲亚有意使这个没有灵的存在被塑成一个形像，统治物质和她所有的众军。于是，一个形似狮子、兼具男女两性的执政者[e]首次从水中显现；他自身拥有大权，却不知道自己从哪里产生。


    皮斯蒂斯·索菲亚看着他在深水中四处活动，就对他说：“孩子，到这边来。”这句话也就是“雅尔达—巴奥特”[f]。从那日起，清晰言语之律显现出来，延伸到众神、天使和人类；因清晰言语而产生的，众神、天使和人类都使之完成。


    至于执政者雅尔塔巴奥特，他不知道皮斯蒂斯的力量。他没有看见她的脸，只看见水中与他说话的形像。因为那声音，他称自己为“雅尔〈达巴〉奥特”[g]。然而，完全者称他为“阿里埃尔”[h]，因为他形似狮子。


    他取得统治物质的权柄以后，皮斯蒂斯·索菲亚便退回上方，进入自己的光中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “索菲亚”音译自希腊语 Sophia，意为“智慧”；这里用作名称。
    reason: 帮助普通读者理解专名所带的语义，同时不把专名直接意译。
  - marker: b
    text: “皮斯蒂斯”音译自希腊语 Pistis，可意为“信、信实”或“信念”；这里用作名称。
    reason: 保留词义范围及专名身份。
  - marker: c
    text: “永世”对应常译作“亿万世”或音译为“爱安”的术语；在本文中既可指超越的领域，也可指其中的存在或秩序。
    reason: 该宇宙论术语在现代汉语中无完全对应词，需要说明其多义性。
  - marker: d
    text: 方括号和省略号表示见证文本有缺损；尖括号表示编者补入的文字。
    reason: 说明正文保留的文本批判符号，防止读者把缺文或补文当作完整抄本内容。
  - marker: e
    text: “执政者”对应意为“统治者、掌权者”的术语，在本文中指统治宇宙领域的权势存在。
    reason: 交代术语的一般意义而不附加宗派解释。
  - marker: f
    text: 原文在这里把“孩子，到这边来”与名称 yalda-baoth 联系起来；译文保留为“雅尔达—巴奥特”，未把这一词源解释视为现代语言学结论。
    reason: 区分文本内部的词源说法与历史语言学判断。
  - marker: g
    text: “雅尔塔巴奥特”“雅尔达—巴奥特”和“雅尔〈达巴〉奥特”反映见证文本中的不同写法；尖括号内为补出的字母。
    reason: 保留拼写差异和补字标记，而不强行统一。
  - marker: h
    text: “阿里埃尔”是名称音译；本文以其“形似狮子”解释这个称呼。
    reason: 保留文本自己的名称解释，不另行裁定其语源。
lexical_decisions:
- source_word: Sophia
  choice: 索菲亚
  rationale: 作为人物名音译，以免直接译作“智慧”而把专名与普通名词含义混同；脚注说明其希腊语意义。
- source_word: Pistis
  choice: 皮斯蒂斯
  rationale: 作为人物名音译，保留作品中的专名关系；脚注说明其希腊语意义。
- source_word: aeon
  choice: 永世
  rationale: 既保留其宇宙论中超越领域或存在层次的专门意味，也避免仅译作普通的“时代”；脚注提示词义范围。
- source_word: likeness
  choice: 形像
  rationale: 一致保留原文“相似之形、映像”的含混性，不擅自解释为身体、人格或幻影。
- source_word: host(s)
  choice: 众军
  rationale: 表达成群而有组织的势力，同时不预断它们是军队、天使或其他类别。
- source_word: archon
  choice: 执政者
  rationale: 呈现“统治者、掌权者”的基本意义，并借脚注指出这是本文宇宙论术语。
- source_word: articulate speech / verbal articulation
  choice: 清晰言语
  rationale: 表达可发出并分节成词的言语能力，避免将其狭义化为发音技巧或一般语言。
- source_word: aqueous substance
  choice: 水质
  rationale: 保留“水性的实体或质料”这一抽象表达，不简单等同于普通的水。
- source_word: bile
  choice: 胆汁
  rationale: 按见证文本的具体身体性意象直译，不将其寓意化为愤怒或苦毒。
- source_word: defect
  choice: 缺失
  rationale: 保留缺欠、不足或过失之间的张力，避免直接定性为道德罪过。
theological_decisions:
- issue: 皮斯蒂斯与索菲亚的关系
  choice: 按文本分别保留“索菲亚从皮斯蒂斯流溢而出”及后文复合称呼“皮斯蒂斯·索菲亚”
  alternative: 将二者统一视为同一人物并只用一个名称
  rationale: 见证文本在称谓上有变化；译文不替文本消解这种身份与称号上的张力。
- issue: 阴影、妒忌与物质的生成
  choice: 保留拟人化、生育和流产意象
  alternative: 改写为抽象的宇宙生成过程
  rationale: 这些身体性比喻是论述结构的一部分，抽象化会削弱文本的神话叙事及其价值判断。
- issue: “神明”与至高者的层级
  choice: 将 divinity/gods 译为“神明/众神”
  alternative: 统一译作“神”或“神性”
  rationale: 复数和类别性的表述应予保留，同时不把这些存在与任何后世体系中的独一至高神自动等同。
- issue: 无灵者获得形像与权柄
  choice: 保留皮斯蒂斯·索菲亚的意志、吹气、塑形与授权之间的叙事次序
  alternative: 将吹气解释为赋予灵或生命
  rationale: 文本明确继续称该存在原先“没有灵”，不可凭相似的创造叙事补入“受灵”结论。
- issue: 雅尔达巴奥特名称的词源说明
  choice: 保留文本把“孩子，到这边来”与 yalda-baoth 对应的说法，并音译其不同拼写
  alternative: 把名字直接意译为该句，或统一所有拼写
  rationale: 该词源联系属于文本自身的解释，而不同拼写及补字是见证文本的重要信号。
- issue: 兼具男女两性的执政者
  choice: 译作“兼具男女两性的执政者”
  alternative: 译作“双性神”或“雌雄同体者”
  rationale: 前者较清楚而不增加神格判断，也保留性别双重特征的明确陈述。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。宇宙论专名以音译为主，并用脚注交代可确定的词义；叙事中的拟人、生育、流产、胆汁和水性物质等强烈意象均予保留。因直接科普特语复核尚待完成，本稿以所给公共领域英文见证为主要证据层，谨慎保留所有缺文、补文和异拼信号，避免对语法歧义及神学关系作超出见证的确定化处理。
