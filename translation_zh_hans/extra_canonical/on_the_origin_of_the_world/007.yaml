base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/007.yaml
  text: 'After this, he created an assembly of angels—countless thousands and tens of thousands—which looked like the assembly in the eighth heaven. He also created a firstborn called “Israel,” that is, “the Man Who Sees God,” and another being called “Jesus Christ.” This being looks like the savior who lives above in the eighth heaven and sits at his right hand on a holy throne. At his left hand, the Virgin of the holy Spirit sits on a throne, glorifying him. The seven virgins stand before her, holding thirty harps, lyres, and [] trumpets and glorifying him. All the angelic hosts glorify him and praise him.


    The place where he sits is a throne of light <in a> great cloud that covers him. No one lived with him inside the cloud except Sophia, <the daughter of> Pistis. She taught him about all the beings that exist within the eighth heaven so that he could create likenesses of them and his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day on, the right has been called “justice,” and the left has been called “evil.” Because of this, all of them received an aeon in the assembly of justice, and evil stands over every created being [5].'
translation:
  language: zh_hans
  text: '此后，他造了一个天使的会众，成千上万，多得不可胜数；这会众仿照第八重天的会众。他又造了一个长子，名叫“以色列”，意思是“看见上帝的人”；又造了另一位，名叫“耶稣基督”。他仿照那位住在上方第八重天的救主；他坐在他的右边，坐在圣洁的宝座上。在他的左边，圣灵的童女坐在宝座上，荣耀他。七位童女站在她面前，拿着三十张竖琴、里拉琴和〔……〕号筒，荣耀他。众天使的军队也都荣耀他，颂赞他。


    他所在之处，是一座光明的宝座，位于一朵笼罩着他的大云中。[a] 除了索菲亚——皮斯提斯的女儿[b]——没有谁与他同住在云中。她把第八重天里一切存在者的事教给他，使他能够照着那些存在者造出形像，也使他的统治可以延续到混沌诸天及其众军终结之时。


    皮斯提斯·索菲亚把他从黑暗中分别出来，召他到自己的右边，又把原初之父安置在自己的左边。从那天起，右边就称为“公义”，左边则称为“邪恶”。因此，他们全都在公义的会众中得到了一个永世；而邪恶居于每一个受造者之上。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “位于一朵……大云中”中的“位于”依见证文本尖括号内的编辑补足译出。
    reason: 保存底本文本的编辑性补足信号，同时使正文可顺畅阅读。
  - marker: b
    text: “皮斯提斯的女儿”在所据见证中属于编辑补足。
    reason: 让读者知道亲属说明并非无缺损地直接保存于文本。
  - marker: c
    text: “永世”所译的词也可指一个时代或宇宙领域；“居于……之上”也可能含有掌权、支配之意。
    reason: 保留 aeon 与 stands over 的真实语义歧义。
lexical_decisions:
- source_word: assembly
  choice: 会众
  rationale: 保留宗教性群体与聚集之意，比“集会”更适合此处天上群体的语境，同时不把它限定为制度化教会。
- source_word: eighth heaven
  choice: 第八重天
  rationale: 采用自然的现代汉语宇宙层级表达，并保留原文独特的第八层天界观。
- source_word: firstborn
  choice: 长子
  rationale: 直译其亲属和位次意涵，不擅自解释为“首位受造者”。
- source_word: entity / being
  choice: 存在者；另一位
  rationale: 叙事中用“另一位”保持人物指称自然；谈论第八重天的普遍类别时用“存在者”，以保留本体论色彩。
- source_word: holy Spirit
  choice: 圣灵
  rationale: 使用通行且庄重的译名；原文短语中的“童女”另行保留，不以传统神学预设消解其特殊形象。
- source_word: hosts
  choice: 军队；众军
  rationale: 保留天上成列群体及势力的含义；“天使的军队”比单纯“众天使”更贴近源词意象。
- source_word: Sophia / Pistis
  choice: 索菲亚／皮斯提斯
  rationale: 作为此文宇宙论中的专名音译，不直接译成“智慧／信仰”，避免把专名与抽象德性混同。
- source_word: Primal Parent
  choice: 原初之父
  rationale: 保留原初亲本的概念，并依汉语宗教叙事采用较自然的阳性人物称谓；不等同于正典中的“父神”。
- source_word: aeon
  choice: 永世
  rationale: 此处可指获分配的长久领域或时代；“永世”保留时间—宇宙领域的张力，脚注说明歧义。
- source_word: consummation
  choice: 终结之时
  rationale: 表达宇宙秩序达到尽头的意义，不额外加入“成全”或末世论体系。
- source_word: stands over
  choice: 居于……之上
  rationale: 保留空间上“在上方”与权势上“支配”的双重可能，不径直译成“统治”。
theological_decisions:
- issue: “耶稣基督”与第八重天救主的关系
  choice: 译作“他仿照……救主”
  alternative: “他看起来像……救主”
  rationale: 上下文强调下层实体按照第八重天存在者造出形像；“仿照”呈现对应关系，但不宣称二者同一。
- issue: 右边、公义与左边、邪恶的对应
  choice: 按原文直接保留
  alternative: 弱化为“善的一边／恶的一边”
  rationale: 这是该文自身的宇宙论断言，应保留其鲜明张力，不用后世教义予以协调。
- issue: 索菲亚与皮斯提斯的关系
  choice: 正文采用“索菲亚——皮斯提斯的女儿——”
  alternative: 仅作“皮斯提斯·索菲亚”
  rationale: 见证文本在此明确补出亲属关系；同时以脚注标明该短语属于编辑补足。
- issue: “邪恶居于每一个受造者之上”
  choice: 保留“居于……之上”的歧义
  alternative: 译为“邪恶统治每一个受造者”
  rationale: 源文既可能表示空间位置，也可能表示支配权；不应默默选定较强的神学解释。
- issue: “他的右边／左边”中代词所指
  choice: 保留代词链，不增补具体姓名
  alternative: 明确改写为“救主的右边”或“创造者的右边”
  rationale: 见证文本的指称存在潜在歧义，中文不应擅自消除。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。专名“索菲亚”“皮斯提斯”音译，以免把人物名直接抽象化。保留宇宙论术语、人物层级及代词指称中的张力。见证文本在乐器清单中有缺文，正文以〔……〕表示；裸页码[5]不纳入正文。由于科普特语源文复核尚待进行，本稿属于依据公共领域英文见证所作的暂定源证据译稿。
