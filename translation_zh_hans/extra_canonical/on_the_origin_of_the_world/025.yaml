  text: 'Now we will move on to consider our world, so that we can accurately complete the description of its structure and governance. Then it will become clear how faithfulness to the unseen aeon was found, which has been revealed from creation until the consummation of the age.


    Consequently, I come to the main themes concerning the deathless man. I will discuss the beings that belong to him, showing how they came to be here.


    When a multitude of humans had come into existence through descent from [the Adam who] [] had been made, even out of matter, and when the world had already become fully populated, the archons were its masters; that is, they kept it enslaved through ignorance. And why? For the following reason: The deathless father knows that a deficiency in truth came into existence among the aeons and their universe. When he desired to bring the archons of perdition to nothing by means of the creatures they had shaped, he sent your likenesses down into the world of perdition—that is, the blessed little spirits of innocence. They are not strangers to knowledge, because all knowledge dwells in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they immediately reveal the structure of indestructibility as a condemnation of the archons and their hosts.


    In this way, when the blessed beings appeared in forms shaped by the authorities, they were envied. Out of envy, the authorities joined their seed with the seed of the blessed beings, wishing to defile them. But they were unable to do so.


    Then, when the blessed beings appeared in a radiant form, they appeared in several ways. They came from different aeons, revealing their knowledge to the church made visible through the shaped forms of perdition. She [16] was found to contain every kind of seed because the seed of the authorities had been joined [with her].


    The savior then made all of them [(as) one], and their spirits are clearly superior, being blessed [] and chosen in various ways. There are also several other beings who have no king and are superior to all those who existed before them.


    Therefore, four races exist. Three belong to the kings of the eighth heaven, but the fourth race is kingless and perfect, and it is the highest of them all. For these are the ones who will enter the Holy Place of their father, and they will obtain rest together with repose, eternal and ineffable glory, and infinite joy.


    What is more, they are kings within the realm of death, since they are deathless. They will condemn the gods of Chaos and their hosts.'
translation:
  language: zh_hans
  text: '现在，我们要转而考察我们的世界，以便准确地完成对其结构与治理的描述。这样就会显明：对那不可见永世的忠信是如何被发现的；这忠信从创造之初直到世代的终结，一直彰显出来。[a]


    因此，我现在要谈到有关不死之人的主要论题。我要论述那些属于他的众存在，并说明他们是怎样来到这里的。


    当众多人类借着[那位亚当的]后裔而产生——他[]甚至是由物质造出的——并且世界已经住满时，执政者便作了世界的主人；也就是说，他们借着无知使世界一直受奴役。为什么呢？原因如下：不死的父知道，诸永世及其宇宙中出现了真理的缺失。当他想借着执政者所塑造的受造物，使这些灭亡的执政者归于无有时，他便把你们的形像差到灭亡的世界里，也就是那些蒙福、纯真的小灵。[b]他们对知识并不陌生，因为一切知识都寓于一位曾向他们显现的天使之中。他在父面前并不缺少能力，甚至能由<他>把知识赐给他们。[c]他们一在灭亡的世界显现，就立刻揭示那不可毁灭之境的结构，以此斥责执政者及其众军。


    这样，当这些蒙福者在掌权者所塑造的形体中显现时，便招来嫉妒。掌权者出于嫉妒，把自己的种子与他们的种子结合，想要玷污他们，却未能得逞。


    后来，当这些蒙福者以光辉的形态显现时，他们以多种方式出现，并且来自不同的永世；他们把自己的知识显明给那借着灭亡所塑造的形体而成为可见的教会。她被发现含有各样的种子，因为掌权者的种子已经与[她]结合。


    随后，救主把他们全都造作成[(仿佛)一体]；他们的灵显然更为卓越，是蒙福的[]，并以不同方式蒙拣选。此外，还有一些没有君王的存在，胜过在他们以前存在的一切。


    因此，共有四个族类：三个属于第八重天的众王，第四个族类却没有君王，而且是完全的；它高过所有其他族类。因为正是这些人要进入他们父的圣所，得到安息与宁静，并得着永恒、不可言说的荣耀和无穷的喜乐。


    不仅如此，他们在死亡的领域中也是君王，因为他们是不死的。他们要斥责混沌的众神及其众军。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永世”译自通常音译为“艾昂”的术语，既可指漫长时代，也可指超世领域或属灵实体；本句中“忠信”的归属关系亦可能有不同理解。
    reason: 说明关键宇宙论术语及原句真实歧义
  - marker: b
    text: “小灵”直译所据见证中的特殊表达；其“小”究竟表示微小、卑微或亲昵称呼，尚不明确。
    reason: 避免读者误以为该词明确指儿童或低等灵体
  - marker: c
    text: 原文此处代词关系不明，且见证以尖括号标示补入的“他”；译文保留<他>，未确定它指父、天使或另一主体。
    reason: 保存残缺文本的校补标记与指代歧义
lexical_decisions:
- source_word: aeon
  choice: 永世
  rationale: 保留诺斯替文献中兼具时间跨度与超世领域/实体含义的术语张力；不简化为单纯的“时代”或“世界”
- source_word: archons
  choice: 执政者
  rationale: 采用可理解且较为形式对应的译法，表达统治权势；与后文较泛的 authorities“掌权者”略作区分
- source_word: deathless man
  choice: 不死之人
  rationale: 直译其不受死亡辖制的性质，不擅自等同于“永生者”或特定神学人物
- source_word: world of perdition
  choice: 灭亡的世界
  rationale: 保留该世界与毁灭、丧亡相连的负面定性，而不增补其成因
- source_word: small spirits of innocence
  choice: 纯真的小灵
  rationale: 保留原文 unusual diminutive“小”及 innocence 的纯真含义，不将其解释为儿童或低阶灵体
- source_word: indestructibility
  choice: 不可毁灭之境
  rationale: 此处与“结构”搭配，可能指不朽坏的领域或秩序；用“之境”保持其领域性而不完全实体化
- source_word: seed
  choice: 种子
  rationale: 保留原文可兼指生殖后裔、属灵族类或本质成分的隐喻，不译成单义的“血统”
- source_word: church
  choice: 教会
  rationale: 采用该古代宗教共同体术语的常用汉译，同时不导入后世具体教派制度
- source_word: races
  choice: 族类
  rationale: 表达四类存在或群体，避免现代“种族”一词可能带来的生物学和政治联想
- source_word: Chaos
  choice: 混沌
  rationale: 保留其作为宇宙领域或拟人格化名称的可能性，故以专名式“混沌”处理
theological_decisions:
- issue: “对不可见永世的忠信”所指为何
  choice: 保留“忠信”及被发现/彰显的被动表达
  alternative: 译为“对不可见永世的信仰”或“不可见永世的信实”
  rationale: 原见证中的属格关系及 faithfulness 主体并不完全明确，不把它单向解释为人的信仰或该永世自身的信实
- issue: 父借受造物使执政者归于无有
  choice: 按原句保留工具关系
  alternative: 解释为受造物主动战胜执政者
  rationale: 原文强调父的意愿及“借着”执政者所造之物，不增补受造物的自主行动机制
- issue: “你们的形像”与“小灵”的关系
  choice: 以同位语“也就是”连接
  alternative: 将二者译成彼此不同的群体
  rationale: 见证明确以 that is 说明，但“形像”的精确本体仍不清楚，故保留其称谓
- issue: “一位天使”与知识的关系
  choice: 译为“一切知识都寓于一位……天使之中”
  alternative: 译为该天使拥有全部知识
  rationale: 保留 lodged in 的强烈内在关系，不将天使仅处理为知识传递者
- issue: 没有君王的第四族类
  choice: 保留“没有君王”而不解释为政治自由或神性自治
  alternative: 译为“不受任何权势统治”
  rationale: 该概念在文本宇宙论中具有专门意义，宜避免现代政治化扩释
- issue: 死亡领域中的君王身份
  choice: 按悖论性陈述直译
  alternative: 解释为他们战胜死亡，所以掌管死亡
  rationale: 原文仅以“不死”作为理由，保留其神学张力，不补足因果机制
translation_notes:
  register: 采用现代、庄重而可读的普通话书面语。对残缺处的方括号、空方括号和校补尖括号予以保留；删除了仅属抄本页码的[16]。由于科普特语直接复核尚待进行，本稿以所给公共领域英文见证为来源依据，并将若干不确定处明确标注，避免把后世宗派解释写入正文。
