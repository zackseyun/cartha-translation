translation:
  language: zh_hans
  text: '接着，正义创造了乐园。乐园美丽，位于月亮运行的轨道和太阳运行的轨道之外，在欢悦之地以内，在东方的岩石之间。欲望居住在那些美丽、令人满足的树木中。照着上帝的旨意，永生树显现在乐园北边，为要使圣徒的灵魂不再死亡；这些灵魂将在时代终结时从卑微的形体中出来。


    生命树的颜色如同太阳，枝条秀美；叶子像柏树叶，果实像一串白葡萄。它高达天空。它旁边是知识树，拥有上帝的力量。知识树的荣光如同满月，枝条秀美；叶子像无花果树叶，果实像甘美、令人满足的椰枣。这棵树位于乐园北边，为要把灵魂从众魔的昏沉中唤醒，使他们能走近生命树，吃它的果实，并借此斥责掌权者及其天使。


    圣经详细说明了这棵树的作用：“你就是乐园里的知识树；最初的人吃了你的果实，你开启了他的心智。他爱上了自己的女伴，并斥责了[a]其他异己的形像，甚至鄙弃他们。”


    此后，橄榄树萌发出来，为要使那些将在末后的日子出现的君王和公义的大祭司成圣；因为橄榄树是从第一位亚当的光中显现出来的，要供应他们将要领受的膏抹。'
