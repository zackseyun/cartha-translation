lexical_decisions:
- source_word: Justice
  choice: 正义
  rationale: 保留抽象属性被人格化并施行创造的表达，不擅自改作某位具名神祇。
- source_word: Paradise
  choice: 乐园
  rationale: 采用现代汉语宗教文献中通行且清楚的对应词。
- source_word: Land of Delight
  choice: 欢悦之地
  rationale: 保留专名色彩及原文关于喜乐、愉悦之地的含义。
- source_word: desire
  choice: 欲望
  rationale: 保留原见证中突兀而可能具人格化意味的陈述，不解释为美感或食欲。
- source_word: lowly shaped forms
  choice: 卑微的形体
  rationale: 尽量保留形体与卑下性质，避免具体化为肉身、躯壳或某种宇宙论实体。
- source_word: tree of knowledge
  choice: 知识树
  rationale: 采用自然简洁的汉语表达，并与生命树、永生树的树名结构协调。
- source_word: authorities
  choice: 掌权者
  rationale: 保留其既可指宇宙性统治力量、也可泛指权势者的张力，不加宗派性解释。
- source_word: anointing
  choice: 膏抹
  rationale: 保留与橄榄树、君王和大祭司相关的礼仪含义，同时不预断是膏油本身还是受膏身份。
theological_decisions:
- issue: “正义”作为创造乐园的主体
  choice: 直译为“正义创造了乐园”
  alternative: 解释为“正义者”或“公义的神创造了乐园”
  rationale: 见证文本以抽象名词为主语；直译可保存其人格化及宇宙论上的开放性。
- issue: 知识树的正面功能
  choice: 保留其唤醒灵魂、引向生命树的作用
  alternative: 依照其他创世传统把知识树解释为诱惑或堕落的根源
  rationale: 本篇自身明确赋予知识树唤醒和引导的功能，不应以其他传统改写。
- issue: “圣徒的灵魂不再死亡”
  choice: 保留未来性的目的表达
  alternative: 译为灵魂本来不死或立即获得永生
  rationale: 原见证将此事与时代终结及从卑微形体中出来联系起来，需保留其末世次序。
- issue: “第一位亚当的光”与橄榄树
  choice: 保留橄榄树从其光中显现的陈述
  alternative: 将“光”解释为身体、荣耀或属灵本质
  rationale: 文本未明确界定“光”的本体含义，故不作神学化补充。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文重复句式、宇宙论意象及若干刻意突兀之处；为提高可读性适度分句，但不补足未见于见证的神学解释。由于科普特语原文复核尚未完成，本稿以所提供的公共领域英文见证为暂定依据。
