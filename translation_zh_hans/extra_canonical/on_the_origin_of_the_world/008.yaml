translation:
  language: zh_hans
  text: '这样，混沌的始祖看见自己的儿子萨巴奥特，以及他所居于其中的荣耀，又知道他在混沌的一切掌权者中为大，就嫉妒他。他勃然大怒，从自己的死亡中生出了“死亡”。“死亡”被安置在第六层天之上，[a]因为萨巴奥特已经从那里被提升上去。这样，混沌的六位掌权者就满了数目。


    “死亡”是一个雌雄同体的存在；他随即与自己的本性结合，生出七个雌雄同体的孩子。男性孩子的名字是：


    嫉妒、

    暴怒、

    眼泪、

    呻吟、

    苦难、

    哭泣、

    哀号。


    女性孩子的名字是：


    暴怒、

    疼痛、

    情欲、

    呻吟、

    咒诅、

    苦涩、

    争竞。


    他们彼此交合，每一个都生出七个孩子，总数为[……][b]四十九个雌雄同体的邪灵。


    你会在《所罗门书》中找到他们的名字和影响。[c]


    在这些存在面前，与萨巴奥特同住的佐伊创造了七个良善、雌雄同体的力量。男性的名字是：不嫉妒者、蒙福者、喜乐者、真实者、不眼红者、蒙爱者、忠信者。女性的名字是：和平、欢欣、喜乐、福分、真理、爱、皮斯蒂斯。[d]许多良善而纯洁的灵都源自这些力量。


    你会在《十二层天之下命运的构造》中找到他们的影响和作用。[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据英文见证在这里保留了补写标志，意为“因为”；本译文按其补足句意。原见证中的裸页码“[6]”未收入正文。
    reason: 说明文本补写与版面数字，避免把页码误当正文。
  - marker: b
    text: 方括号中的省略号表示所据见证在此标示抄本残损或待复原之处；“四十九”则见于保存下来的句文。
    reason: 忠实保留底本文本损坏信号。
  - marker: c
    text: 这里的《所罗门书》究竟指哪一部古代著作，尚不能仅凭本段确定。
    reason: 避免将其武断等同于某部现存或正典书卷。
  - marker: d
    text: 原文先说有“七个”良善力量，随后却列出七个男性名和八个女性名。译文保留这一不一致，不自行校正。“皮斯蒂斯”是音译，希腊语可指信、信实或信仰。
    reason: 保存见证中的数字矛盾，并解释不透明专名。
  - marker: e
    text: 这一书名的原文形式及“十二层天之下”的确切修饰关系，仍有待科普特文校核。
    reason: 当前仅有英文见证可供起草，应明确书名翻译的暂定性质。
lexical_decisions:
- source_word: Primal Parent of Chaos
  choice: 混沌的始祖
  rationale: 保留其作为混沌之原初亲本的神话身份，同时避免以“父”过度限定原文称谓的性别。
- source_word: Sabaoth
  choice: 萨巴奥特
  rationale: 按专名音译，以免与一般词义或圣经称号混淆。
- source_word: Death
  choice: “死亡”
  rationale: 用引号显示此处既指死亡概念，也指被人格化并生出的存在。
- source_word: androgynous
  choice: 雌雄同体
  rationale: 直陈该存在兼具两性，保留文本反复强调的性别结构。
- source_word: authorities of Chaos
  choice: 混沌的掌权者
  rationale: 以“掌权者”呈现具有统治地位的超自然实体，避免误作抽象的权力。
- source_word: Zoe
  choice: 佐伊
  rationale: 作为人物专名音译；其希腊语“生命”之义不在正文中擅自释出。
- source_word: Pistis
  choice: 皮斯蒂斯
  rationale: 按专名音译，因为同一名单已另有“忠信者”，若直接译作“信德/信仰”可能抹去其专名性质。
- source_word: demons
  choice: 邪灵
  rationale: 采用现代汉语中自然且明确的超自然恶性存在称谓，不引入后世系统化的魔鬼阶序。
theological_decisions:
- issue: “从自己的死亡中生出死亡”的双重含义
  choice: 从自己的死亡中生出了“死亡”
  alternative: 从自身的死性中生出死神
  rationale: 保留同词复现及概念与人格之间的张力，不将其明确解释为“死性”或特定的“死神”。
- issue: Death的代词性别
  choice: 使用“他”并同时称其为雌雄同体
  alternative: 使用“它”或“祂”
  rationale: 原见证以男性代词指称该人格化存在，但文本同时明确说其雌雄同体；不用“祂”，以免赋予崇拜性尊称。
- issue: “mixed himself together with his own nature”
  choice: 与自己的本性结合
  alternative: 与自己的同类交合／使自己与自身本性混合
  rationale: 原句含义异常且可能涉及自体结合；译文保留这种含混，不武断指定另一配偶或具体生理过程。
- issue: Zoe所造力量的数量与名单不一致
  choice: 正文保留“七个”，也完整保留七个男性名和八个女性名
  alternative: 把总数校改为十五个或删去一个女性名
  rationale: 见证内部存在明显数目张力；不凭推测协调或删改。
- issue: 末尾书名的宇宙论结构
  choice: 《十二层天之下命运的构造》
  alternative: 《十二之下诸天命运的构造》
  rationale: 英文见证的修饰关系并不完全确定；正文采用可读译法，并以脚注标明书名和结构理解仍待科普特文复核。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。神话实体的名称在可辨为抽象人格化名称时意译，萨巴奥特、佐伊、皮斯蒂斯等专名则音译。当前草案依据所提供的公版英文见证，科普特文直接审校尚待进行；因此保留残损标志、数字矛盾和若干句法歧义，不作教派化协调。
