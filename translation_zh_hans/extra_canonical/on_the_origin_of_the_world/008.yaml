  terminology: 保留“混沌的始祖”“掌权者”“雌雄同体”“邪灵”以及萨巴奥特、佐伊、皮斯蒂斯等译名。“皮斯蒂斯”作为名单中的专名保留音译；不将其与“忠信者”混同。
