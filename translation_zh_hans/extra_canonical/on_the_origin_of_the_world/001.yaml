  naturalness: 修订后保持现代汉语庄重、清晰的论述文体。“乐于[b]宣称”既保留缺损信号，又使句法自然；“从它里面被推出”略具刻意性，但恰当地保存了原见证的动态及未明示施动者。
  terminology: “混沌”“宇宙诸神”“根源”“影子”“受造实体”均可保留。“名为‘黑暗’的影子”清楚维持“黑暗”是影子的名称，而非将二者或其与混沌混同。
