  - severity: low
    issue: “迸发出来”弱化被推动语义
    rationale: was propelled 表达从该实体中被推出、被驱动而出的动作；“迸发”通常带有自发爆发之意。改为“被推出”可保留被动性，且不擅自补出推动者。
