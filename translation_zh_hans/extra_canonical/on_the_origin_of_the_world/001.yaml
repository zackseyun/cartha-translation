translation:
  language: zh_hans
  text: '关于世界的起源——引言


    [a]既然人人——无论宇宙诸神还是人类——都说在混沌以前什么也不存在，我就要反驳他们，证明他们全都错了，因为他们既不知道混沌的起源，也不知道它的根源。证据如下：


    说到混沌，众人竟都乐于[b]宣称它是一种黑暗；其实，它源自一个名为“黑暗”的影子，而这个影子又源自一个从起初就已存在的受造实体。显然，这个受造实体在混沌形成以前就已经存在；混沌是在它之后才形成的。


    因此，让我们来探究事情的实情，并且考察那最初的受造实体；混沌就是从它里面被推出的。这样，真相便会得到清楚的证明。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处原稿开头有缺损或复原未定之处；现有英文见证以空方括号标示。
    reason: 保留底本所示的手稿损坏或文本复原信号。
  - marker: b
    text: 此处原稿有缺损或复原未定之处；句意依据现有英文见证暂译。
    reason: 原见证在“乐于……宣称”之间保留空方括号，译文在相应句法位置标示文本状态。
lexical_decisions:
- source_word: Chaos
  choice: 混沌
  rationale: 沿用现代汉语中对希腊语 Chaos 概念的通行译法，并保留其在本文宇宙起源论中的专名性质。
- source_word: cosmic gods
  choice: 宇宙诸神
  rationale: 保留 cosmic 的宇宙论范围和 gods 的复数，不将其解释为某一特定宗教体系中的神祇。
- source_word: root
  choice: 根源
  rationale: 既保留“根”的来源意象，又符合现代汉语论述起源时的自然表达。
- source_word: shadow
  choice: 影子
  rationale: 采用直接、具体的对应词，不预先把它抽象化为较特定的形而上概念。
- source_word: created entity
  choice: 受造实体
  rationale: 保留其被造性质以及 entity 的含混性，不擅自确定它是人物、灵体或物质。
- source_word: was propelled
  choice: 迸发出来
  rationale: 传达一种从该实体之中被推出或涌出的动态，同时避免补入未经来源确认的施动者。
theological_decisions:
- issue: 混沌以前是否绝对一无所有
  choice: 将此说法明确呈现为作者所反驳的众人观点
  alternative: 把它写成叙述者认可的宇宙论事实
  rationale: 原文的论证正要证明混沌以前已有某个受造实体，因此必须保留其论战结构。
- issue: “黑暗”、影子与受造实体之间的关系
  choice: 按原文依次保留三者：混沌源自名为“黑暗”的影子，影子又源自受造实体
  alternative: 将“黑暗”直接等同于受造实体或混沌
  rationale: 原文关系复杂且可能具有神学张力，不宜在翻译中合并这些层次。
- issue: first created entity 的本体身份
  choice: 译为“最初的受造实体”，不进一步命名
  alternative: 解释为第一位受造者、神灵、智慧或物质
  rationale: 现有见证没有在本段明确其身份，应保存含混性。
translation_notes:
  register: 采用现代、庄重而可读的论述体。因科普特语原文复核尚待进行，本稿以所提供的公版英文见证为暂定依据；不把方括号内的缺损静默补全，也不消解“混沌”“黑暗”“影子”和“受造实体”之间的宇宙论张力。
