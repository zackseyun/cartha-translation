lexical_decisions:
- source_word: archons / authorities
  choice: 执政者／掌权者
  rationale: 主体叙事采用诺斯替文献中文讨论中较通行且较透明的“执政者”；原文改用 authorities 处译作“掌权者”，保留词汇变化。
- source_word: Paradise
  choice: 乐园
  rationale: 与创世叙事背景相符，也保留其作为特定园地的宗教文学色彩。
- source_word: teacher
  choice: 教导者
  rationale: 不擅自认定其具体身份；“教导者”保留原见证文本的称谓及其含混性。
- source_word: deathless
  choice: 不死的／不死之人
  rationale: 区别于较具神学定论色彩的“永生”，直接表达不会死亡这一性质。
- source_word: Cherubin
  choice: 基路宾
  rationale: 按传统音译处理，同时避免擅自将该复数形态规范化为某一特定天使论解释。
- source_word: consummation of the age
  choice: 这世代终结
  rationale: 保留末世性表达，又不扩充为特定宗派的末世体系。
theological_decisions:
- issue: 执政者是否具有祝福能力
  choice: “他们没有祝福；善不可能由恶产生”
  alternative: “他们不拥有祝福；善不能成为恶的结果”
  rationale: 保留文本对执政者及善恶来源的鲜明判断，不将其调和进其他创造论框架。
- issue: 亚当所得知识的性质
  choice: “另一种知识”
  alternative: “不同层次的知识”
  rationale: 原见证只说 different kind，不解释其具体内容或救赎地位。
- issue: “像我们中的一个”的比较内容
  choice: 明确保留为知道光与暗的分别
  alternative: 套用《创世记》的“知道善恶”
  rationale: 本段见证明确为 light and darkness，不以较熟悉的正典措辞替换。
- issue: 命运与寿命的关系
  choice: 保留“从起初便已定下的命运”及天体运行的关联
  alternative: 把命运解释为神的预定
  rationale: 不把本文的宇宙论术语改写为其他神学体系中的预定观。
- issue: 代词“他们的寿命”所指
  choice: 保留复数代词，不强行确定是亚当夫妇还是人类众人
  alternative: 译成“亚当和夏娃的寿命”
  rationale: 见证文本指称略有游移，中文保持其可能的范围歧义。
translation_notes:
  register: 采用现代、庄重而可读的叙事汉语。鉴于所提供材料明确说明科普特语原文复核尚待进行，本稿严格以公开领域英文见证为暂定依据；保留圆括号所示的见证补语，并把原有空方括号转化为正文脚注标记。避免仿古句法，也不以《创世记》的熟悉措辞覆盖本作品独有的光暗、执政者和宇宙论表达。
