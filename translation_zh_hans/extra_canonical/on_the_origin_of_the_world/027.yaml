lexical_decisions:
- source_word: archons
  choice: 众执政者
  rationale: 保留诺斯替文献中统治宇宙势力的专门称谓，同时采用现代汉语可懂的直译，避免直接释为“邪灵”而加入评价。
- source_word: aeon / age
  choice: 世代／永世
  rationale: 依上下文区分时间意义的“世代”与拟人格化或宇宙领域意义的“永世”；不以单一汉语词抹平原文的语义张力。
- source_word: Chaos
  choice: 混沌
  rationale: 采用中文思想和宗教文献中通行且庄重的对应词；作为特定宇宙领域时保留其专名意味。
- source_word: Abyss
  choice: 无底深渊
  rationale: 表达深不可测的宇宙深处，并维持与普通“深渊”的区别。
- source_word: Primal Parent
  choice: 原初之父
  rationale: 上下文随后用阳性单数代词指称该存在，因此暂译“父”；但不进一步等同于其他宗教体系中的至高神。
- source_word: unbegotten one / unbegotten Father
  choice: 未受生者／未受生之父
  rationale: 用“未受生”准确保留非由他者产生的含义，并保留两处称谓形式的差别。
- source_word: deficiency
  choice: 缺失
  rationale: 保留抽象、宇宙论性质，不将其神学化改写为“罪”或“堕落”。
- source_word: kingless aeon
  choice: 无王的永世
  rationale: 直译其悖论式称谓，不擅自解释为某个特定天国或至高界域。
theological_decisions:
- issue: “女人”及其后女性代词所指不明
  choice: 保留“女人／她”的指称，不补出专名
  alternative: 按文献更大语境补译为某一女性宇宙实体的名字
  rationale: 本段所给证据不足以无歧义确认其身份，保留原有指称可避免导入解释。
- issue: “他们的人类”这一异常所有关系
  choice: 直译为“他们的人类”
  alternative: 改为“属他们的人”或“人类”
  rationale: 原文见证重复使用所有格，可能涉及执政者、天使或魔灵各自关联的人类；不应静默消除其宇宙论含义或歧义。
- issue: 光与黑暗的终局冲突
  choice: 按见证译作“光要[战胜]黑暗”并保留修复标记
  alternative: 将其改写为人格化神祇之间的胜利
  rationale: 保留原文抽象名词和文本修复的不确定性，不加入特定教义框架。
- issue: 完全者与未完全者的终局归宿
  choice: 保留分层归宿和“各归本源”的陈述
  alternative: 按某一宗派的救赎论解释为得救、受罚或轮回
  rationale: 该段自身呈现独特宇宙论，应按文本表达，不与后世教义体系强行调和。
- issue: “他”转而毁灭自己时的先行词
  choice: 保留阳性“他”，不在正文明确补名
  alternative: 直接重复“原初之父”或“混沌之神”
  rationale: 英语见证中的代词链可能存在指称张力；在科普特语复核前不宜擅自消解。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。宇宙论专名尽量保持一致；在“age/aeon”处依时间与领域语义分别译作“世代／永世”。由于科普特语直接复核尚待进行，本稿谨慎保存方括号、缺文、省略号、代词链及异常所有格，不以流畅为由消除真实歧义。
