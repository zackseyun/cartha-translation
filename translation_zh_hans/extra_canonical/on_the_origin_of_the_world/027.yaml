translation:
  language: zh_hans
  text: '在这世代终结以前，整个地方都要因响亮的雷声而震动。于是，众执政者会因[惧怕]自己（即将临到的）……死亡而悲伤。[a]众天使会为他们的人类哀恸，众魔灵会为自己的时节哭泣，而他们的人类会因（即将临到的）死亡呻吟尖叫。


    那世代随后就要开始，他们会陷入混乱。他们的众王会被烈火之剑灌醉；他们彼此交战，使大地饱饮流血之灾，海洋也因那些战争而翻腾。那时，太阳要变黑，月亮要遮蔽自己的光。天上的星辰要停止循轨运行；从一支庞大的军势中，要发出一声震天雷鸣；这军势凌驾于混沌的一切军势之上，女人的穹苍就在那里。[b]


    她造出最初的受造物以后，就会放下明智、理性的火，披上非理性的愤怒。


    接着，她要追击混沌诸神，就是她与原初之父一同创造的那些神。[c]她要把他们推入无底深渊。他们必因自己的邪恶而被消灭，因为他们会变得如同喷火的山，彼此吞噬，直到被原初之父的力量毁灭。


    他毁灭他们以后，就会转而攻击自己，甚至毁灭自己，直到不复存在。他们的诸天要彼此坠落，他们的军势要被火吞噬；他们的诸永世也要倾覆。他的天要猛然坠下，裂成两半。他的[众星……]要坠落在地上，[大地将无法]承受它们。[d]它们要坠入无底深渊，无底深渊也要倾覆。光要[战胜]黑暗，将它消灭；黑暗要变得仿佛……从未存在过一样。[e]黑暗的根源要消散，缺失要被连根拔除，抛入黑暗；光则要向上退回自己的根源。那未受生者的荣耀要显现，充满每一个永世。那时，预言和诸王的著作要显明，并在那些称为“完全者”的人身上得以应验。


    然而，那些没有在未受生之父里面成为完全的人，会在自己的永世中，并在不死者的国度里获得荣耀；但他们永远不能进入无王的永世，因为每一个人都必须回到自己所来的地方。每一个人都要借着自己的行为和知识，显明自己相应的本性。'
