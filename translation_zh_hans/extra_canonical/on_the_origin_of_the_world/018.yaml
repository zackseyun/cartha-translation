  revision_rationale: 修订完整保留见证中的“[When] []”残缺／补写信号；以较中性的“休息日”对应“day of rest”；将“Mother of the Living”收束为“活人之母”，避免“众生”所可能引起的范围扩大；并调整“fulfilled in act”的中文表达，使其自然且不增添解释。其余关键术语与叙事歧义均予保留。
