base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/018.yaml
  text: 'After the day of rest, Sophia sent her daughter Zoe, who is called Eve, as a teacher. She was to make Adam, who had no soul, stand up, so that those whom he would beget could become vessels of light.


    [When] [] Eve saw her male companion lying face down, she had compassion on him and said, “Adam, live! Stand up on the earth!”


    Her words were immediately fulfilled in action. Adam stood up and quickly opened his eyes. When he saw her, he said, “You will be called ‘Mother of the Living,’ because you are the one who has given me life.”'
translation:
  language: zh_hans
  text: '安息日过后，索菲亚差遣她那名叫佐伊、又称夏娃的女儿前去作教师，使那没有灵魂的亚当站起来，好让他将要生下的人能成为光的器皿。


    [当][a]夏娃看见她的男性伴侣俯伏在地，就怜悯他，对他说：“亚当，活过来！站在地上！”


    她的话立刻化为行动。亚当站起来，很快睁开眼睛。他看见她，就说：“你要称为‘众生之母’，因为是你使我得了生命。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现有英文见证在此保留补写的“当”和一处空缺标记，表明底本文字可能残损或曾经校补；科普特文原文尚待复核。
    reason: 如实标示所据见证中的方括号及文本不确定性，而不把残缺静默地处理成确定正文。
lexical_decisions:
- source_word: Sophia
  choice: 索菲亚
  rationale: 保留作为人物名称的希腊语音译，同时避免直接译作“智慧”而预先消解其人格化身份。
- source_word: Zoe
  choice: 佐伊
  rationale: 保留人物名的音译；其希腊语含义与“生命”有关，但正文随后明确交代夏娃使亚当得生命，不在名字中额外释义。
- source_word: Eve
  choice: 夏娃
  rationale: 采用现代汉语读者熟悉的传统译名。
- source_word: soulless
  choice: 没有灵魂
  rationale: 紧贴现有见证文本，不改写为“没有生命”或“没有气息”，以免消除灵魂与生命之间可能存在的概念区别。
- source_word: vessels of light
  choice: 光的器皿
  rationale: 保留原有象征性和宗教语汇，不将“器皿”解释性改写为“承载者”。
- source_word: male companion
  choice: 男性伴侣
  rationale: 保留关系称谓的宽泛性，不擅自具体化为“丈夫”。
- source_word: Mother of the Living
  choice: 众生之母
  rationale: 自然而庄重地表达“活着之人的母亲”，并与“使我得了生命”形成文字呼应。
theological_decisions:
- issue: 夏娃在亚当得生命一事中的角色
  choice: 译作“是你使我得了生命”
  alternative: “是你赐给我生命”
  rationale: 前者准确保留因果关系，又不过度强化夏娃作为终极生命赐予者的神学含义。
- issue: 亚当的状态
  choice: “没有灵魂”
  alternative: “没有生命”或“无气息”
  rationale: 不将见证文本中的灵魂概念与肉体生命等同，保留文本自身的宇宙论张力。
- issue: “作教师”的句法关系
  choice: 索菲亚差遣夏娃前去作教师
  alternative: 把“教师”理解为索菲亚或其他人物的称号
  rationale: 依照所给见证文本的直接句法，使这一身份修饰被差遣的女儿，但不增补她具体教导什么。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。人物名“索菲亚”“佐伊”使用音译，“夏娃”沿用通行译名；保留“光的器皿”“没有灵魂”等文本特有表达。由于科普特文审校尚未完成，本稿明确以所供公共领域英文见证为暂定依据。
