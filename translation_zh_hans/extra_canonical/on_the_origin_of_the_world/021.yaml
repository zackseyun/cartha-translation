  footnotes:
  - marker: a
    text: “掌权者”所指层级或对象并不明确；也可能理解为他们所属的权势或上级。
    reason: 保留 authorities 的多义性，并避免和前文 archons 完全混同。
  - marker: b
    text: “因死亡而死”直承见证文本的重复表达，也可理解为“你们绝不会死”。
    reason: 说明不寻常措辞，保留潜在强调或源语习语。
  - marker: c
    text: 此处传本有缺文或校补不确定之处，故以〔……〕标示；“众神”和“恶人与善人”均依现有英语见证暂译，尚待科普特语原文复核。
    reason: 明确文本空缺及关键异读风险，不伪装为确定文本。
lexical_decisions:
- source_word: archons
  choice: 执政者
  rationale: 保留诺斯替文献中指宇宙统治势力的专门称谓，同时不将其预先解释为单纯的官长、天使或魔鬼。
- source_word: deathless man
  choice: 不死之人
  rationale: 直译其不朽性质，并保留“人”可能兼具原型或超越性人物含义的开放性。
- source_word: tree of knowledge
  choice: 知识树
  rationale: 简洁自然，并与后文“知识之光”形成词汇呼应；不擅自补作“分别善恶树”。
- source_word: Beast
  choice: “兽”
  rationale: 保留名称性的突兀表达，不直接等同于蛇，以免消除本文独有叙事。
- source_word: reasoning
  choice: 理性
  rationale: 表达心智辨识能力；后接“清醒”，保留原文由昏沉转为醒悟的意象。
- source_word: mind
  choice: 心智
  rationale: 比“眼睛”更忠实于见证文本，也能承接知识与认知开启的主题。
- source_word: shaped
  choice: 塑造
  rationale: 保留造形、制作的含义，而不使用带有终极创造主意味更强的“创造”。
- source_word: acutely aware
  choice: 变得极其敏锐
  rationale: 保留结句未明说具体对象的认知敏锐性，不补充解释。
theological_decisions:
- issue: 执政者与上帝的身份关系
  choice: 按各处称谓分别译为“执政者”“上帝”，不将二者明确等同或区分为特定神学体系中的实体
  alternative: 将发禁令者统一解释为造物主、首领执政者或假神
  rationale: 现有见证文本在此段没有充分明示身份关系；保留其叙事张力。
- issue: “像众神一样”的数与意义
  choice: 译作“像众神一样”
  alternative: “像上帝一样”或“像神一样”
  rationale: 英语见证为复数 gods；在尚未完成科普特语复核前保留复数，避免用熟悉的《创世记》措辞覆盖本文。
- issue: 善恶知识的对象
  choice: “知道恶人与善人之间的分别”
  alternative: “知道善恶”
  rationale: 供应见证明确含 humans；虽表达异于传统经文，仍应保存，不予教义化校正。
- issue: 吃果子后的觉醒评价
  choice: 如实保留“知识之光照耀”“心智开启”等正面认知语言
  alternative: 将其改写为堕落、犯罪或受骗
  rationale: 本文有意重构乐园叙事；翻译不应导入外部传统来消解其神学张力。
- issue: “因死亡而死”措辞
  choice: 译作“绝不会因死亡而死”并加注
  alternative: 顺畅化为“你们绝不会死”
  rationale: 保留强调性或闪族式重复，也承认其具体语义尚待源语核查。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。叙事句式尽量清楚，保留“执政者”“知识之光”“心智”等作品特有术语。底本说明指出科普特语复核尚未完成，因此本稿是依据公共领域英语见证所作的源证据导向暂定译文；疑难处以脚注公开，不作无根据的和谐化。
