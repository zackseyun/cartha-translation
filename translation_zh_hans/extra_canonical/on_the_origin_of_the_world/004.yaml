base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/004.yaml
  text: 'Seven androgynous beings appeared in Chaos. They have both masculine and feminine names:


    The feminine name is Pronoia, Sambathas, which means “week,”

    and his son is named Yao, whose feminine name is Rulership.

    Sabaoth, whose feminine name is Divinity.

    Adonaios, whose feminine name is Kingship.

    Elaios, whose feminine name is Jealousy.

    Oraios, whose feminine name is Wealth,

    and Astaphaios, whose [feminine] name [] is Sophia.


    These are the seven powers belonging to the seven heavens of Chaos. They were born as androgynous beings, corresponding to the deathless structure that existed before them, in accordance with the desire of Pistis—namely, that the likeness of what had existed from the beginning would rule until the end.


    You will discover the power exerted by these names, as well as the power of the male beings, in the (book) The Archangelic (Nature) of the Prophet Moses, and the power of the names of the female beings in the First Book of Noraia.


    Now the Primal Parent Yaldabaoth, since he possessed great authorities, created heavens for each of his offspring by speaking them into being. He made them good as dwelling places, and in each heaven he created great glories, each seven times as excellent: thrones, palaces, temples, chariots, and virginal spirits, (all the way) up to an unseen one, along with their glories. Each one possessed these in its own heaven: mighty hosts of gods, lords, angels, and archangels, countless myriads, so that they might serve.


    You will find the account of these events precisely described in the First Narration of Oraia.


    And they were completed, from this heaven up to the sixth heaven, which belongs to Sophia.


    This heaven and earth were attacked by the mischief-maker who lived beneath them all, and the six heavens trembled violently, because the hosts of Chaos knew who had attacked the heaven located beneath them. When Pistis became aware of the fracture caused by the mischief-maker, she sent out her spirit, bound him, and cast him down into Tartaros.


    [From that day], the heaven, together with [] its earth, has been established through Sophia, the daughter of Yaldabaoth, who dwells beneath them all.'
translation:
  language: zh_hans
  text: '七个雌雄同体的存在在混沌中显现。他们既有男性名，也有女性名：


    女性名是普罗诺亚；桑巴塔斯，意思是“一周”[a]；

    他的儿子名叫雅奥，其女性名是“统治权”。

    萨巴奥特，其女性名是“神性”。

    阿多奈奥斯，其女性名是“王权”。

    埃莱奥斯，其女性名是“嫉妒”。

    奥莱奥斯，其女性名是“财富”。

    阿斯塔法奥斯，其〔女性〕名〔……〕是索菲亚[b]。


    这就是属于混沌七重天的七种力量。他们生来便是雌雄同体，与先于他们而存在的不朽构造相对应，也合乎皮斯提斯的愿望，就是要让那从起初便已存在之物的形像掌权，直到终结。


    这些名字所施展的能力，以及那些男性存在的力量，你可以在《先知摩西论大天使〔本性〕》一书中找到；女性存在之名的力量，则可在《诺莱娅第一书》中找到[c]。


    原初之父雅尔达巴奥特拥有莫大的权柄，便开口为自己的每一个后裔造出一重天。他把这些天造得美好，作为居所；又在每一重天中造出极大的荣华，每样都卓越七倍：宝座、宫殿、神庙、战车和童贞的灵，〔一直〕到一位不可见者，以及它们的荣华。每一个后裔在各自的天中都拥有这一切：强大的神明军旅、众主、众天使和众大天使，千千万万，不可胜数，为要服侍。


    关于这些事的叙述，你可以在《奥莱娅第一叙事》中找到精确的记载[c]。


    它们就这样建造完成，从这一重天一直到第六重天，也就是属于索菲亚的天。


    住在这一切之下的作恶者袭击了这天及其地，六重天便剧烈震动，因为混沌的众军知道是谁袭击了位于他们下方的那重天。皮斯提斯察觉作恶者造成的裂口，就差遣自己的灵，把他捆绑起来，投入塔耳塔罗斯。


    〔从那一天起〕，这天连同〔……〕它的地，便借着雅尔达巴奥特的女儿索菲亚得以确立；她住在这一切之下[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处现存见证的句法和名单排列不够清楚；“普罗诺亚”与“桑巴塔斯”的确切对应关系，有待科普特语原文进一步校勘。
    reason: 保存名单开头的真实文本疑难，避免无注释地重排。
  - marker: b
    text: “女性”在见证文本中带有编者补入性质；“名”与“是索菲亚”之间另有缺文。
    reason: 标明补字和抄本缺损。
  - marker: c
    text: 这些书名按现有见证暂译；括号所示的“本性”可能属于书名的复原内容。
    reason: 古代作品题名及补足文字具有不确定性。
  - marker: d
    text: 本句开头“从那一天起”为补足；“连同”之后有缺文，因此“天”与“地”的确切关系并不完全清楚。
    reason: 保留末段两处文本残缺及其造成的句法不确定性。
lexical_decisions:
- source_word: androgynous
  choice: 雌雄同体
  rationale: 准确保留这些存在同时具有男性与女性身份和名称的古代宇宙论表述，不弱化为一般性的“双性”。
- source_word: Chaos
  choice: 混沌
  rationale: 采用现代汉语中自然且庄重的宇宙论用语，并保留其作为领域名称的含义。
- source_word: Pronoia / Pistis / Sophia
  choice: 普罗诺亚／皮斯提斯／索菲亚
  rationale: 这些词在本文中兼具专名和观念性含义；正文音译以避免把人物身份化约为单一抽象概念。
- source_word: Rulership / Divinity / Kingship / Jealousy / Wealth
  choice: 统治权／神性／王权／嫉妒／财富
  rationale: 这些是明确说明的女性名，采用透明的现代汉语义译，使名称间的观念关系可见。
- source_word: Primal Parent
  choice: 原初之父
  rationale: 上下文以雅尔达巴奥特为男性并提到其女儿；“原初之父”兼顾亲缘角色与宇宙论称号。
- source_word: verbal articulation
  choice: 开口……造出
  rationale: 自然表达凭发声或言语创造的动作，同时不额外引入特定经典中的固定神学措辞。
- source_word: glories
  choice: 荣华
  rationale: 保留可指辉煌事物、尊荣或光耀配置的语义宽度，避免武断地具体化。
- source_word: Tartaros
  choice: 塔耳塔罗斯
  rationale: 按希腊宇宙论地名音译，不以“地狱”等后世神学术语替代。
- source_word: mischief-maker
  choice: 作恶者
  rationale: 表达主动造成破坏的人格性角色，同时避免将其直接等同于任何特定魔鬼称号。
theological_decisions:
- issue: 七个存在名单开头的句法关系不清
  choice: 依见证文本的次序译为“女性名是普罗诺亚；桑巴塔斯……”并加注说明
  alternative: 直接重构为“桑巴塔斯的女性名是普罗诺亚”
  rationale: 现有英文见证在此标点和句法异常，科普特语校勘尚待完成；正文不擅自消除可能的残缺或错置。
- issue: 不朽构造与七种力量的关系
  choice: 译作“与先于他们而存在的不朽构造相对应”
  alternative: 译作“照着先存的不朽体系被造”
  rationale: 保留“对应／相合”的意义，不额外断定严格的创造方式或本体从属关系。
- issue: “从起初便已存在之物的形像”掌权
  choice: 保留“形像”及其掌权到终结的表述
  alternative: 将其解释为某位具体神圣人物或永恒原型
  rationale: 原文对象保持抽象，译文不以特定诺斯替体系解释补足。
- issue: 雅尔达巴奥特的 authorities
  choice: 译作“莫大的权柄”
  alternative: 译作“众多强大的掌权者”
  rationale: 当前见证可理解为他所拥有的权能或权柄；译文采用较自然读法，但不据此建立其至高性。
- issue: 索菲亚确立天地的方式
  choice: 译作“借着……索菲亚得以确立”
  alternative: 译作“由索菲亚亲自奠立”或“因索菲亚而稳定”
  rationale: 保留 through/by means of 的中介性含混，不断定她是唯一创造者还是维系者。
