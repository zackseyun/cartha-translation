  - severity: low
    issue: “无垠的领域”给“infinity”添加了“领域”这一实体化含义。
    rationale: 见证仅称诸永世位于第八重天与下方混沌之间的“infinity”之内。译作“无穷之中”更能保留其开放的宇宙论含义。
  - severity: low
    issue: “与属于贫乏的宇宙一同计算”搭配生硬。
    rationale: “are counted together with”在此宜译作“被一同算入”，既自然又保留分类／计入关系，而不解释其具体宇宙论机制。
