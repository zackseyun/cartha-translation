base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/014.yaml
  text: '[] As she desired, Sophia, who lived in the lower heaven, received authority from Pistis. She formed great shining bodies and every star, and she placed them in the sky to shine on the earth and to determine signs of time, seasons, years, months, days, nights, minutes, and so on. In this way, the whole expanse of the sky was adorned.


    Now, when Adam of Light desired to enter his light, namely, the eighth heaven, he could not do so because of the poverty that had mingled with his light. Then he created an immense aeon for himself. Within that aeon he created six aeons and their adornments, six in number, which were seven times greater than the heavens of Chaos and their adornments.


    Now all these aeons and their adornments exist within the infinity that lies between the eighth heaven and the Chaos beneath it. They are counted together with the universe that belongs to poverty.


    If you wish to learn their structure, you will find it written in the Seventh World of the Prophet Hieralias.'
translation:
  language: zh_hans
  text: '[] 按照她的心愿，住在下层天界的索菲娅[a]从皮斯蒂斯[b]得到了权柄。她造出巨大的发光天体和所有星辰，把它们安置在天空中，使其照耀大地，并划定时间的标记、季节、年、月、日、夜、分钟等等。这样，整片天空都得了装饰。


    光之亚当想要进入自己的光，也就是第八重天时，却因贫乏[c]已经与他的光混合而无法进入。于是，他为自己创造了一个极其广大的永世[d]；又在其中创造了六个永世，以及六种装饰；这些比混沌诸天及其装饰胜过七倍。


    这一切永世及其装饰，都存在于第八重天与其下方的混沌之间的无穷之中；它们被一同算入属于贫乏的宇宙。


    你若想了解它们的构造，可以在先知希耶拉利亚斯[e]的《第七世界》中找到记载。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “索菲娅”是希腊语 Sophia 的音译，本义为“智慧”；此处作为一位人格化存在的名称。
    reason: 帮助普通读者理解专名背后的语义，同时不把专名直接普通名词化。
  - marker: b
    text: “皮斯蒂斯”是希腊语 Pistis 的音译，可有“信”“信实”等义；此处用作名称。
    reason: 保留专名并提示其词义背景。
  - marker: c
    text: “贫乏”在本文中是宇宙论术语，可能不只是通常所说的物质贫穷。
    reason: 防止读者把抽象宇宙论概念窄化为经济状况。
  - marker: d
    text: “永世”译自常音译为“埃昂”的词；在这类文献中，可指漫长时代，也可指超宇宙领域或层级。
    reason: 源词具有真实的多义性，正文无法以单一汉语词完全呈现。
  - marker: e
    text: “希耶拉利亚斯”及其《第七世界》的确切身份与作品情况不明。
    reason: 避免对罕见专名和失传作品作无根据的认定。
lexical_decisions:
- source_word: Sophia
  choice: 索菲娅
  rationale: 作为人格化存在的专名音译，避免直接译作“智慧”而过早消除专名与普通名词之间的张力。
- source_word: Pistis
  choice: 皮斯蒂斯
  rationale: 按专名音译；其希腊语本义与“信、信实”有关，但在此叙事中指特定人格化存在。
- source_word: shining bodies
  choice: 发光天体
  rationale: 上下文涉及星辰与天空，用“天体”比笼统的“物体”自然，同时保留其发光属性。
- source_word: temporal signs
  choice: 时间的征兆
  rationale: 保留“signs”的征兆义以及它与时间划分的关联，不简化为单纯的“计时”。
- source_word: aeon
  choice: 永世
  rationale: 该词在本文宇宙论中兼有时代、领域或超宇宙层级等意味；采用“永世”并加脚注说明，避免径直定为“世界”或“时代”。
- source_word: poverty
  choice: 贫乏
  rationale: 保留抽象且可能人格化或宇宙论化的术语性质；“贫穷”容易只让人联想到物质生活状况。
- source_word: adornments
  choice: 装饰
  rationale: 忠实保留反复出现的宇宙论用语，不擅自具体化为居民、星体或秩序。
- source_word: infinity
  choice: 无垠的领域
  rationale: 兼顾无限、无边之意与这里作为诸层之间所在范围的空间语境。
- source_word: Hieralias
  choice: 希耶拉利亚斯
  rationale: 按所供见证中的专名作近似音译，不臆测其身份或采用未经证实的异名。
theological_decisions:
- issue: “his light”与“第八重天”的同位关系
  choice: “自己的光，也就是第八重天”
  alternative: “他的光，即第八重天”或将“光”解释为神性本质
  rationale: 保留见证文本明确的同位表达，不进一步说明光为何等同于第八重天。
- issue: 贫乏与光的混合
  choice: 保留“贫乏已经与他的光混合”
  alternative: 解释为罪、物质或缺陷污染了光
  rationale: 原文所呈现的宇宙论张力不应被套入某一宗派或解释体系。
- issue: 六个永世及其装饰的计数
  choice: “六个永世及其装饰，共有六套”
  alternative: 理解为六个永世加六种装饰，合计十二项
  rationale: 英语见证的句法略显含混；译文保留“六”与配套装饰的关系，但不武断宣称总数为十二。
- issue: “seven times superior”所指比较
  choice: “胜过混沌诸天及其装饰七倍”
  alternative: “比……大七倍”或“高七个等级”
  rationale: “superior”未明确仅指尺寸，故用较宽泛的“胜过”。
- issue: “the universe that belongs to poverty”
  choice: “属于贫乏的宇宙”
  alternative: “贫乏所造的宇宙”或“贫穷的宇宙”
  rationale: 只表达所属关系，不额外断定创造者或性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留开头的方括号“[]”，以反映所供见证中的残缺或复原标记。由于科普特语原文复核尚待进行，本稿以所供公共领域英语见证为直接起草依据，并对 aeon、poverty、adornments 等关键宇宙论术语采取审慎、少解释的译法。
