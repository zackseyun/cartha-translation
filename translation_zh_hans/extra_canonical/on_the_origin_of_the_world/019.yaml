    reason: 该短语语义和神学含义均不确定，应保留其陌生感与多义性。
lexical_decisions:
- source_word: authorities
  choice: 执政者
  rationale: 保留该文献中具有宇宙论意味的统治性存在称谓；比泛称“当权者”更能显示其超人间角色，又不额外导入特定宗派解释。
- source_word: shaped form
  choice: 所塑造的形体
  rationale: 同时保留“塑造”的动作和“形体”的实体意味，不擅自把它等同于亚当的完整人格。
- source_word: archangels
  choice: 大天使
  rationale: 采用现代中文中通行、庄重的对应词。
- source_word: likeness
  choice: 形像
  rationale: 与“形体”区分，并保留原段落中可被留下、被误认和被玷污的相似形态这一观念。
- source_word: force
  choice: 一股力量
  rationale: 保持原文关于夏娃作为“力量”的本体性陈述，不弱化为仅仅“有力量”，也不提升为带特定神学内涵的“大能”。
- source_word: tree of knowledge
  choice: 知识树
  rationale: 直译所给见证的表述；不自动改成《创世记》传统中的“分别善恶树”，以免消除文本自身措辞。
- source_word: seed
  choice: 种子
  rationale: 保留原文兼具生殖与象征意味的词，不用解释性较强的“精液”。
- source_word: true man
  choice: 真人
  rationale: 保留其可能具有原型人或真实之人含义的张力，不扩写为“真正的人类”或某一专名。
- source_word: consummation (of the age)
  choice: 这世代终结时
  rationale: 自然表达末世性时间指向，同时保留“世代终结”而不把它解释成某一具体末世体系。
theological_decisions:
- issue: 夏娃与其“形像”的关系
  choice: 持续区分夏娃本人和她留在亚当身边的“形像”
  alternative: 把“形像”解释为替身、影像或肉身
  rationale: 原文叙事有意维持本体层面的区分；译文不替读者决定该形像的确切性质。
- issue: “她是一股力量”的本体论含义
  choice: 直陈“夏娃是一股力量”
  alternative: 译作“夏娃很有力量”或“夏娃有神力”
  rationale: 前者会削弱原句的身份判断，后者则加入原文未明说的神性解释。
- issue: 执政者侵犯形像的叙述
  choice: 明确保留强制、玷污和播种的性暴力语言
  alternative: 以委婉语淡化为“接近她”或“与她结合”
  rationale: 原文明确描述抓捕、玷污及猥亵行为；淡化会改变其伦理与叙事力度。
- issue: “自己的身体”的指向
  choice: 保留为“自己的身体”，随后以分号连接“其实只是那形像”
  alternative: 直接解释为执政者自身的物质身体或亚当的身体
  rationale: 原段落的指代和宇宙论逻辑具有张力，现有英语见证不足以支持更具体的判定。
- issue: “由真人所生”的宣告方式
  choice: 译为“借着言语宣告自己由真人所生”
  alternative: 解释为藉神圣话语重生或某种礼仪口诵
  rationale: 原文只明确提到言语表达，不足以锁定具体救赎论或礼仪背景。
translation_notes:
  register: 采用现代标准汉语简体中文，语气庄重而可读。叙述中的性暴力不作美化或弱化。译稿目前依据所提供的公版英语见证拟定，科普特语原文复核尚待完成；因此对“本性的、猥亵的手段”“声音的封印”等疑难表达采取较形式化、保守的译法。见证中的裸页码[13]未作为正文或脚注标记保留，因为它属于分页信息而非句义；原有空缺信号则改以脚注[a]明确说明。
