base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/019.yaml
  text: 'Then it was reported to the authorities that the form they had shaped was alive and had stood up, and they were deeply disturbed. They sent seven archangels to learn what had happened.


    They approached Adam. When they saw Eve speaking with him, they said to one another, “What kind of being is this radiant woman? She is like that likeness which appeared to us within the light. Come, let us seize her and cast our seed into her, so that when she is defiled, she will be unable to ascend into her light. Instead, those to whom she gives birth will be under our command. But let us not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep, and while he sleeps, let us teach him that she came from his rib, so that his wife will obey him and he will be lord over her.”


    Because she was a force, Eve laughed at their decision. She made a mist enter their eyes and secretly left her likeness with Adam.


    She entered the tree of knowledge and remained there. They chased after her, and she revealed to them that she had entered the tree and had become a tree. Then the blind beings fell into great fear and fled.


    After they had shaken off their stupor, they approached Adam. When they saw the likeness of this woman [] with him, they were deeply troubled, believing that she was the actual Eve, and they acted impulsively. They approached her, seized her, and cast their seed upon her.


    They did this in wickedness, defiling her by natural and obscene means. First they defiled the seal of her voice, [13] which had spoken with them, saying, “What existed before you?” In this way, they meant to defile, at the consummation (of the age), those who might declare through verbal expression that they were born of the true man. They went astray, unaware that they had defiled their own body, since it was the likeness that the authorities and their angels defiled by every means.'
translation:
  language: zh_hans
  text: '后来，有人向执政者报告说，他们所塑造的形体活了，并且站了起来；他们大为不安，就派出七位大天使去查明发生了什么事。


    他们来到亚当那里，看见夏娃正在同他说话，就彼此说：“这个光辉灿烂的女人究竟是什么样的存在？她很像那曾在光中向我们显现的形像。来吧，我们抓住她，把我们的种子撒入她里面，使她受玷污，不能升回她的光中；这样，她所生的就会听命于我们。不过，我们不要告诉亚当，因为他不是我们的一员。我们要使他沉沉睡去，并在他睡着时教导他，说她是从他的肋骨而来的，好叫他的妻子顺服他，让他作她的主。”


    但夏娃是一股力量，便嘲笑他们的决定。她使雾气进入他们眼中，又暗中把自己的形像留在亚当身边。


    她进入知识树，停留在那里。他们追赶她，她便向他们显明：她已经进入树中，成了一棵树。于是，那些盲目的存在陷入极大的恐惧，逃走了。


    后来，他们从昏乱中清醒过来，便走近亚当。他们看见这个女人的形像[a]同他在一起，就大为不安，以为她是真正的夏娃，于是冲动行事。他们上前抓住她，把自己的种子撒在她身上。


    他们怀着恶意做了这事，以本性的、猥亵的手段玷污她。他们首先玷污了她声音的封印[b]；那声音曾对他们说：“在你们之前存在的是什么？”他们这样做，是想在这世代终结时，玷污那些可能借着言语宣告自己由真人所生的人。他们迷失了，并不知道自己所玷污的正是自己的身体；因为执政者和他们的天使用尽各种手段玷污的，其实只是那形像。'
  philosophy: optimal-equivalence
