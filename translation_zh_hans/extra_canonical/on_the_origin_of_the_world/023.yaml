lexical_decisions:
- source_word: Sophia Zoe
  choice: 智慧·佐伊
  rationale: Sophia兼有专名与“智慧”之意，译作“智慧”以保留语义；Zoe音译为“佐伊”，不擅自把组合名称完全解释为“生命智慧”。
- source_word: archons
  choice: 执政者
  rationale: 保留该宇宙论术语的统治含义，避免以“魔王”等词预先加入解释。
- source_word: plenary power
  choice: 全部权能
  rationale: 表达其权力完整无缺，同时保持庄重语体。
- source_word: phoenix
  choice: 不死鸟
  rationale: 采用现代汉语通行名称；上下文所述死亡与复活的特殊传统由正文自行呈现。
- source_word: imbued with spirit / soul
  choice: 有灵的／有魂的
  rationale: 维持“灵”与“魂”的三分对照，不将其改写为特定宗派的人性论。
- source_word: earthly
  choice: 属土的
  rationale: 突出与“灵”“魂”并列的来源或性质，比“世俗的”更少伦理化。
- source_word: water hydri
  choice: 水中“希德里”
  rationale: 底本所据英文见证本身语义未明，采用音译并加最低限度的“水中”限定，避免武断认定具体动物或器物。
- source_word: true man
  choice: 真人
  rationale: 保留其可能具有技术性的人物称谓及歧义，不释为“真正的人”或特定救主。
- source_word: Sabaoth
  choice: 萨巴奥特
  rationale: 按专名音译，不与希伯来圣号或本文特定宇宙论角色强行等同。
- source_word: consummation of the age
  choice: 世代终结
  rationale: 兼顾末世性和原文“世代/时代”概念；与“世界终结”在相应句中区分。
theological_decisions:
- issue: 三类人的性质
  choice: 有灵的、有魂的和属土的
  alternative: 属灵的人、属魂的人和属肉体的人
  rationale: 选择较贴近词形、较少教义化的表达，保留该文自身的人类分类体系。
- issue: 不死鸟的死亡与复活
  choice: 它自我杀死，又使自己复活
  alternative: 它自尽后复生
  rationale: 保留见证文本中主动反身动作所形成的神学张力，不弱化为自然死亡。
- issue: 智慧取得宇宙的因果与时序
  choice: 从……那一天起，她便取得了宇宙
  alternative: 因为智慧获得了宇宙
  rationale: 明确呈现句中时序关系，但不进一步解释“取得”的来源、合法性或宇宙论机制。
- issue: 末世象征
  choice: 成为世代终结时将要发生之事的象征
  alternative: 预表末日复活
  rationale: 不把原文宽泛的“将要发生之事”限定为某一种复活教义。
- issue: 埃及与乐园的相似
  choice: 埃及与上帝的乐园相似
  alternative: 这些象征与上帝的乐园相似
  rationale: 依句法最自然的回指作正文处理，同时以缺文脚注说明原始见证存在不确定性。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。保留方括号与尖括号所表示的编辑补文和手稿信号；将原见证的数字注号改为连续字母脚注，并在正文全部标出。由于科普特语原文复核尚未完成，本稿对疑难术语采取保守音译或直译，不把诺斯替宇宙论术语归并进后世宗派框架。
