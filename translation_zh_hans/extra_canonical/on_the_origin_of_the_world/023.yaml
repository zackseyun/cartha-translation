    凤凰怎样象征天使，埃及的“水希德里”[b]也同样象征那些下到真人之洗礼中的人。


    埃及的两头公牛具有象征意义，[c]就是太阳和月亮。这是萨巴奥特的象征，因为从索菲娅造出太阳和月亮、在自己的天上加盖印记的那一天起，她便取得了宇宙，直到世代终结。


    从凤凰生出的虫也象征一个人；论到他，经上记着：“义人必如凤凰开花。”[d]凤凰先是活着地显现，随后死去，又复活，作为世代终结时将要发生之事的象征。


    这些大有能力的象征只在埃及显现，别处都没有，为要表明[e]这与上帝的乐园相似。'
