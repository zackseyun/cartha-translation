  naturalness: 文体庄重通顺，适合现代标准汉语。将“自我杀死，又使自己复活”调整为“自行杀死自己，又使自己复活”，可更清楚地呈现见证中的反身主动表述。将“加盖印记”调整为“盖上印记”，更符合现代汉语搭配。
  terminology: “智慧·佐伊”“执政者”“有灵的／有魂的／属土的”“萨巴奥特”“真人”等处理审慎，保留了文本自身的技术性与歧义。对 hydri 应保持音译和语义未决，不宜译作“水中”。“神圣经书”可简化为“神圣经文”，但不改变其单数、权威文本的意味。
  issues:
  - severity: medium
    issue: 末句将缺文中的回指补为“埃及”。
    rationale: 英文见证为“to indicate [] that it resembles the Paradise of God”，缺文所在恰影响“it”的明确指向。草稿正文的“埃及与上帝的乐园相似”虽有脚注说明，却仍把不能由现有见证证实的主语写死。应保留空缺及代词歧义。
  - severity: medium
    issue: “water hydri”译作“水中‘希德里’”。
    rationale: 见证仅作“water hydri”，且译者注已明言所指不明。“水中”会把 water 解释为该对象的所在环境；它也可能属于名称、类别或其他构词关系。应译作“水‘希德里’”或保留英文术语并注释。
  - severity: low
    issue: “在自己的天上加盖印记”略显生硬。
    rationale: “placing a seal on her heaven”可译为“在她的天上盖上印记”，既保留意象又更自然；不应解释为制度性或物理性的“加盖”。
