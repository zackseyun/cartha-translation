base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/003.yaml
  text: 'When the archon saw his size—though he saw no one but himself, since he could see nothing beyond water and darkness—he imagined that he was the only one who existed. His [. . .] was completed through verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters. When that spirit had appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he fashioned a dwelling place for himself and called it “Heaven.” From matter the archon also fashioned a footstool and called it “Earth.”


    Then a thought occurred to the archon, in agreement with his nature, and through verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. When his eyes opened, he looked at his father and made the sound “eee!” His father then named him “Eee-a-o.” [1]


    Then he created the second son, making a cooing sound to him. When the son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then he created the third son, making a cooing sound to him. When the son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
translation:
  language: zh_hans
  text: '当执政者看到自己的形体何等庞大时——然而，他除了自己以外谁也没有看见，因为在水与黑暗之外，他什么也看不到——便以为只有自己存在。他的［……］借着言语表达得以完成；这言语［……］显现为一个灵，在众水之上来回运行。那灵显现以后，执政者便将水质分开，干地也被分出来，置于另一处。他用物质为自己造了一所居所，称之为“天”；执政者又用物质造了一个脚凳，称之为“地”。


    随后，执政者心中生出一个与他本性相合的意念；他借着言语表达创造了一个兼具两性的存在[a]。他张开口，向他发出咕咕声。那存在睁开眼睛，看着自己的父亲，向他发出“伊——！”的声音。于是，他父亲给他起名叫“伊阿欧”[b]。


    接着，他创造了第二个儿子，也向他发出咕咕声。那儿子睁开眼睛后，向父亲发出“诶——！”的声音。他父亲给他起名叫“埃洛艾”。


    接着，他创造了第三个儿子，也向他发出咕咕声。那儿子睁开眼睛后，向父亲发出“阿斯——！”的声音。他父亲给他起名叫“阿斯塔法伊奥斯”。


    这三位就是他们父亲的儿子。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兼具两性的存在”指一个同时具有男性与女性特征的存在；原词常译作“双性体”或“雌雄同体者”。
    reason: 解释古代宇宙论术语，同时避免正文使用可能生硬或引起现代身份联想的词语。
  - marker: b
    text: “伊阿欧”按所记声音音译；所据英文见证在此保留注号[1]，但未提供相应注释内容。
    reason: 保留所给见证的注号信息，并说明名字与发声之间的语音联系及资料限制。
lexical_decisions:
- source_word: archon
  choice: 执政者
  rationale: 保留该文献中宇宙统治者的技术性称谓，避免译作“神”而引入原文没有的神学认同；“执政者”也能体现统治权柄。
- source_word: verbal articulation
  choice: 言语表达
  rationale: 兼顾“话语”与“发声、清晰表述”的含义，不把它过度具体化为某一神学术语。
- source_word: spirit
  choice: 灵
  rationale: 采用自然且传统的汉语对应词，同时不额外判定其身份或性质。
- source_word: aqueous substance / dry
  choice: 水质／干地
  rationale: “水质”保留物质性表达；“干地”较自然，并呼应古代创世叙述的语言。
- source_word: matter
  choice: 物质
  rationale: 保留该宇宙论中“质料”的概念；未译作“泥土”，以免缩窄原义。
- source_word: footstool
  choice: 脚凳
  rationale: 直译其宇宙等级意象，不解释为单纯的承托物。
- source_word: androgyne
  choice: 兼具两性的存在
  rationale: 以普通读者能理解的方式表达同时具有男性与女性特征的存在，并避免现代身份类别造成误读。
- source_word: cooing sound
  choice: 咕咕声
  rationale: 保留非词汇性、近似鸟鸣或婴儿咿呀的发声特点。
theological_decisions:
- issue: “灵在众水之上运行”与《创世记》语言的关系
  choice: 按见证文本直译为“一个灵，在众水之上来回运行”
  alternative: 译成“上帝的灵运行在水面上”
  rationale: 原文在此只说“一个灵”，且其叙事主体为执政者；不把它默认为《创世记》中的上帝之灵。
- issue: 执政者关于自身唯一存在的认知
  choice: 译作“便以为只有自己存在”
  alternative: 译作“宣告自己是唯一的神”
  rationale: 保留其认知与想象层面的陈述，不加入原文没有的自我神化宣告。
- issue: 三个受造者的父子关系
  choice: 沿用“父亲”“儿子”的亲属称谓
  alternative: 改写为“创造者”“受造物”
  rationale: 原文明确使用父子语言；保留其神话叙事中的关系张力。
- issue: 缺损文字
  choice: 以［……］原样标示，不作补足
  alternative: 根据上下文推测补为“话语”或“意念”
  rationale: 底本审查尚未完成，补足会虚假消除文本缺损与句法不确定性。
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。鉴于科普特语原文复核尚未完成，本稿以所提供的公共领域英文见证为临时依据；所有文本缺损均保留，不擅自补文。专名以接近见证读音的方式音译：Eee-a-o 为“伊阿欧”，Eloai 为“埃洛艾”，Astaphaios 为“阿斯塔法伊奥斯”。正文脚注标记依次改为[a]、[b]，且均已在正文出现。
