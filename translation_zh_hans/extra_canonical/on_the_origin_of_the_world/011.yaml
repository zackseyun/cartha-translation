base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/011.yaml
  text: 'As an androgynous being, Eros appeared from that primal blood. His masculine element is Himireris, which is fire from light. His feminine element that dwells together with him is a soul consisting of blood and originates from the substance of Pronoia. He is exceedingly lovely in his beauty, possessing a charm surpassing that of all the created entities of Chaos.


    Then all the gods and their angels, when they gazed upon Eros, fell in love with him. By manifesting himself within all of them, he set them ablaze. Just as several lamps are lit from a single lamp, and one and the same light is present while the lamp is not diminished, so Eros dispersed himself within all the created entities of Chaos and was not diminished. Just as Eros appeared at the center of light and darkness, and just as the sexual union of Eros was consummated at the center of the angels and humanity, so the primal pleasure blossomed from the earth. Woman followed Earth; marriage followed Woman. Birth followed marriage; decline followed birth.


    After Eros, the grapevine sprouted from the blood that had been shed upon the earth. Because of this, those who drink from it develop a desire for sexual union.


    After the grapevine, a fig tree and a pomegranate tree sprouted from the earth, together with the remainder of the trees, every species, possessing their seed from the [] seed of the authorities and of their angels.'
translation:
  language: zh_hans
  text: '厄洛斯以雌雄同体的形态，从那原初的血中显现出来。他的雄性部分是希米瑞里斯[a]，也就是源于光的火；与他同住的雌性部分，是一个由血构成的魂，源于普罗诺亚[b]的本质。他容貌极其美好，魅力胜过混沌中一切受造之物。


    于是，众神和他们的天使一看见厄洛斯，就都爱上了他。他在他们每一个里面显现，使他们燃烧起来。这就像许多盏灯由一盏灯点燃：其中有同一个光，那盏灯却并不减损。厄洛斯也照样将自己散布在混沌的一切受造之物里面，却并不减损。正如厄洛斯显现在光与黑暗的中央，又如厄洛斯的交合在天使与人类中间完成，原初的欢愉也照样从地里绽放。女人继大地之后而来；婚姻继女人之后；生育继婚姻之后；衰败继生育之后。


    厄洛斯之后，葡萄树从洒在地上的那血中萌发。因此，饮用葡萄酒的人会生出交合的欲望。


    葡萄树之后，无花果树和石榴树也从地里萌发，其余各种树木也一同萌发；它们的种子都来自掌权者及其天使的〔缺文〕种子。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希米瑞里斯”为专名音译；其确切词源和含义有待科普特语原文进一步审校。
    reason: 避免读者误以为该名称已有确定中文释义。
  - marker: b
    text: “普罗诺亚”音译自希腊语名称，通常带有“预思、先见”之意；这里作为人格化实体的名称保留音译。
    reason: 兼顾专名身份与其词义背景，同时不在正文中强行释义。
  - marker: c
    text: 此处底本有缺文，无法确定“种子”之前遗失的词语。
    reason: 明确保存原见证中的方括号残缺信号，不作猜补。
lexical_decisions:
- source_word: Eros
  choice: 厄洛斯
  rationale: 采用该希腊神名的通行音译，保留其人格化神祇身份，而不简化为抽象的“爱欲”。
- source_word: androgynous entity
  choice: 雌雄同体的形态
  rationale: 明确兼具雄性与雌性成分，同时避免现代身份术语带来的额外含义。
- source_word: Himireris
  choice: 希米瑞里斯
  rationale: 作为专名音译；现有材料不足以可靠释义。
- source_word: Pronoia
  choice: 普罗诺亚
  rationale: 以专名音译保留诺斯替文献中的人格化概念，不径自译成“预知”或“天意”。
- source_word: soul consisting of blood
  choice: 由血构成的魂
  rationale: 以“魂”对应此处实体性的 soul，保留其由血构成的奇特宇宙论表达。
- source_word: created entities of Chaos
  choice: 混沌中一切受造之物
  rationale: “混沌”视为宇宙论领域；“受造之物”保留 created 的生成意味。
- source_word: set them ablaze
  choice: 使他们燃烧起来
  rationale: 保留火焰意象，并与随后一灯点燃多灯的比喻衔接。
- source_word: sexual union
  choice: 交合
  rationale: 庄重而明确地表达性结合，不弱化为一般性的“结合”。
- source_word: primal pleasure
  choice: 原初的欢愉
  rationale: 保留 primal 的宇宙起源意味，并用“欢愉”涵盖感官及性意味而不过度露骨。
- source_word: authorities
  choice: 掌权者
  rationale: 采用早期宗教文献中对超世权势常用的中性译法，不预先判定其善恶或具体等级。
theological_decisions:
- issue: 厄洛斯的雌雄同体性质
  choice: 按文本分别陈述其雄性与雌性部分
  alternative: 将其解释为象征性的男女统一
  rationale: 原文呈现宇宙论实体的构成，没有授权译者将其化约为象征解释。
- issue: 厄洛斯散布自身却不减损
  choice: 保留一灯点燃多灯而本灯不减的类比
  alternative: 解释为神性本质的分有或流溢
  rationale: 保留文本自身比喻及其神学张力，不引入后来的形上学体系。
- issue: “在天使与人类中间”的范围
  choice: 直译为“在天使与人类中间”
  alternative: 解释为发生在天使和人类彼此之间，或分别发生于两类群体内部
  rationale: 原见证文本的空间与关系含义存在歧义，中文不替原文作排他性裁决。
- issue: 女人、婚姻、生育、衰败的递进
  choice: 保留简短平行链条
  alternative: 补明为因果关系或价值评判
  rationale: 原文只说“随后”，其因果性和伦理评价不应由译文擅自加强。
- issue: 葡萄酒与交合欲望的关系
  choice: 表达为文本所述的起源论关联
  alternative: 改写成普遍的道德禁令
  rationale: 该段是在叙述神话性因由，并未明确颁布禁酒或性伦理命令。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留神话宇宙论的陌生性与平行句式；神名使用音译，关键术语不过度基督教化。当前稿依据所提供的公共领域英文见证拟定，科普特语直接审校尚待完成；英文见证中的裸页码不纳入正文，原有缺文则以〔缺文〕并加脚注保存。
