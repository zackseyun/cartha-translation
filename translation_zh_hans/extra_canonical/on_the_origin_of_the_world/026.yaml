review_pass:
  verdict: revise
  source_fidelity: 总体忠实于所供英文见证本，并恰当地保留了“这些”及后段复数代词的未定指。需要修正两处语义偏移：censure 更宜译为“谴责/责难”，不宜强化为司法性的“定罪”；forethought 是“预先的筹划/先见”，而“预谋”在现代汉语中通常含有恶意图谋，超过见证本的语义。
  naturalness: 文本庄重、通顺，适合现代书面普通话。“归于虚无”可保留，但将“预谋”改为“预先的筹划”后搭配更自然。
  terminology: “道”“混沌”“掌权者”“执政者”“完全者”均能保留技术性与语义区分。“至高无上的”比“超越万有的”更直接对应 all-superior，且不改变其宇宙论含义。
  issues:
  - severity: medium
    issue: “一种定罪”对 censure 的译法偏强。
    rationale: censure 的核心为谴责、责难或非难；“定罪”通常暗示正式司法裁决。见证本虽有审判语境，却不足以在此将其明确为定罪。
  - severity: medium
    issue: “预谋”给 forethought 加入了贬义的蓄意图谋。
    rationale: forethought 可指预先筹划、深思或先见，并不本然表示恶意。应采用中性措辞，以保留原文的抽象性。
  - severity: low
    issue: “混沌的七个掌权者和他们的不敬虔也显露出来”使“使人知晓”的动作与“显露出来”的自发显现略有混杂。
    rationale: 见证本重复 make known；译为“使人知道……以及他们的不敬虔”可更准确保留其认识/揭示的动作。
  revised_text: '那至高无上的“道”被差遣，唯独是为这一缘故：使他可以宣告那未知的事。他说：“没有一件隐藏的事不被揭露；未知的将被知晓。”这些也被差来[a]，为要使人知道那隐藏的事，包括混沌的七个掌权者和他们的不敬虔。这样一来，他们被判处死刑。


    当所有完全者以执政者所塑造的形体显现，并揭示那无可比拟的真理时，他们使众神的一切智慧蒙羞。众神的命运被认定为一种谴责[b]，他们的军旅也衰残了。他们的统治消散了；他们预先的筹划连同他们的荣耀，都归于虚无。'
  revised_footnotes:
  - marker: a
    text: “这些”所指不明；现有见证本使用复数，却没有清楚说明被差来的是谁或什么。
    reason: 保留原见证中的真实指代歧义，避免无依据补足。
  - marker: b
    text: “谴责”也可理解为“责难”或“斥责”；原句的确切措辞和关系仍有待科普特文复核。
    reason: 提示见证本中 censure 的语义范围，并避免将其过度确定为司法性的“定罪”。
  revision_rationale: 修订严格依据所供公共领域英文见证本，未解决或消除其本有的复数指代歧义。调整“至高无上的”以更直接表达 all-superior；以“使人知道”对应两次 make known；并将“定罪”“预谋”分别改为“谴责”“预先的筹划”，以避免增添见证本未明确表达的司法性和恶意色彩。
