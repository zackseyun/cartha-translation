  naturalness: 修订使“make known what is hidden”的表达更直接、自然，并将“未知的”改为更合乎现代书面汉语的“未知的事”。其余行文保持庄重、清晰。
  terminology: “道”“混沌”“掌权者”“执政者”“完全者”等术语均可保留。“谴责”比“定罪”更贴近 censure 的通常语义，且避免无根据地强化为司法判决。
