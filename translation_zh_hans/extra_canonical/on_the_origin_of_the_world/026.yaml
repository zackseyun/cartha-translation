  english_witness: 'The all-superior Logos was dispatched solely for this reason: that he could announce the unknown. He said, “Nothing that is hidden is not revealed, and what is unknown will be known,” and these were dispatched to make known what is hidden, even the seven authorities of Chaos as well as their impiety, and in this way they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the truth beyond compare, they humiliated all the wisdom of the gods, and their fate was found to be a censure, and their host withered away. Their lordship dissipated. Their forethought became nothing, together with their glory.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/026.yaml
  text: 'The all-surpassing Logos was sent for this reason alone: so that he could announce the unknown. He said, “Nothing hidden remains unrevealed, and what is unknown will become known.” And these were sent to make known what is hidden, including the seven authorities of Chaos and their impiety. In this way, they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the incomparable truth, they humiliated all the wisdom of the gods. Their fate was found to be a censure, and their host withered away. Their dominion dissolved. Their forethought came to nothing, along with their glory.'
translation:
  language: zh_hans
  text: '那超越万有的“道”被差来，唯独是为这一缘故：使他可以宣告那未知的。他说：“没有什么隐藏之事不被显明，未知的也必为人所知。”这些也被差来[a]，为要使隐藏之事显明，连混沌的七个掌权者和他们的不敬虔也显露出来。这样，他们就被判处死刑。


    当所有完全者以执政者所塑造的形体显现，并揭示那无可比拟的真理时，他们使众神的一切智慧蒙羞。众神的命运显明为一种定罪[b]，他们的军旅也衰残了。他们的统治消散，他们的预谋连同他们的荣耀一并归于虚无。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”所指不明；现有见证本使用复数，却没有清楚说明被差来的是谁或什么。
    reason: 保留原见证中的真实指代歧义，避免无依据补足。
  - marker: b
    text: “一种定罪”也可理解为“责罚”或“斥责”；原句的确切措辞和关系仍有待科普特文复核。
    reason: 提示见证本中 censure 的语义范围及当前底本限制。
lexical_decisions:
- source_word: Logos
  choice: “道”
  rationale: 保留该传统中作为位格化称号的 Logos；加引号提示其为专名式称谓，而不只是普通的“话语”。
- source_word: all-superior
  choice: 超越万有的
  rationale: 表达其居于一切之上的含义，同时避免把范围过度限定为能力或等级。
- source_word: authorities of Chaos
  choice: 混沌的七个掌权者
  rationale: 以“掌权者”表达超自然统治势力，并保留“混沌”作为领域或归属关系。
- source_word: archons
  choice: 执政者
  rationale: 采用较为直译且带有统治意味的术语，与后文较广义的“掌权者”保持可辨识的词汇张力。
- source_word: perfect ones
  choice: 完全者
  rationale: 保留原文群体称谓的技术性和可能的宗教含义，不解释为“完美的人”或某一特定教派身份。
- source_word: host
  choice: 军旅
  rationale: 在此权势冲突语境中理解为有组织的众军，同时不将其具体化为人间军队。
- source_word: forethought
  choice: 预谋
  rationale: 表达预先筹划的含义；此处与敌对统治势力相连，“预谋”比中性的“预见”更符合语境，但仍属暂定。
theological_decisions:
- issue: “these were dispatched”的复数所指不明
  choice: 译为“这些也被差来”，不补出具体先行词
  alternative: 将其解释为“完全者”“使者”或“这些话”
  rationale: 现有英文见证本本身保留含混，且尚未完成科普特文复核，因此不应擅自确定所指。
- issue: “their”在第二段中的指代
  choice: 在“众神的命运”处明示为众神，随后以“他们”承接
  alternative: 理解为执政者、众神的智慧，或所有敌对权势的统称
  rationale: 就现有见证本的邻近语法而言，“众神”是最自然的复数先行词，但底本文本仍待源语言审校。
- issue: “fate was found to be a censure”的意义
  choice: 译为“命运显明为一种定罪”
  alternative: 译为“结局证明是受责罚”或“命定之分被判为可责”
  rationale: 保留 fate 与 censure 的抽象表达及其审判张力，不把它完全改写成结果叙述。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。关键宇宙论称谓如“道”“混沌”“执政者”“完全者”予以保留，不以宗派术语扩释。由于所供 drafting basis 明示科普特文审校尚待进行，本稿严格作为依据公共领域英文见证本所作的暂定译文；对复数指代和抽象审判措辞以正文及脚注保存其不确定性。
