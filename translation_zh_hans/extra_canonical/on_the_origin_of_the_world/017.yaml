translation:
  language: zh_hans
  text: '**七位执政者塑造亚当**


    随后，始祖[a]把关于那人的主意告诉了与他同住的众者。于是，他们各自把自己的精液投入大地肚脐的中央。


    从那日起，七位执政者[b]共同塑造了人和他的身体，使之仿照他们自己的身体；然而，他的样貌却像那位曾向他们显现的人。他的形体是一部分一部分塑成的；他们的首领塑造了脑和神经系统。


    后来，他显得像那位先于他而存在者。他成了[……][c]一个有魂的人，并被称为亚当，也就是“父亲”；这名字与那位先于他而存在者的名字相应。他们完成亚当以后，他便把亚当撇下，如同撇下一件没有生命的器皿，因为亚当虽已成形，却如同流产的胎儿，里面没有灵。


    首席执政者想起皮斯提斯[d]所说的话，便害怕真人可能进入他所塑成的形体，成为那形体的主人。因此，他离开自己所塑成的形体四十天；那形体当时没有魂。他退去，把它撇下了。


    第四十天，索菲亚·佐伊[e]把自己的气息送入没有魂的亚当里面。亚当开始在地上活动，却无法直立起来。


    随后，七位执政者来到，看见了他，便深感不安。他们走近，抓住他；他对自己里面的气息说：“你是谁？你从哪里来到这里？”


    那气息回答说：“我来自那人的力量，为要毁坏你们的工程。”他们听见这话，就颂扬他[f]，因为他使他们从自己所陷的恐惧和忧虑中得了喘息。


    于是，他们称那一天为“安息”，因为他们停止了工作，得以安息。他们看见亚当能够直立起来，就欢喜，把他带进乐园，安置在其中；随后，他们退回自己的诸天去了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “始祖”译自所据见证的 Primal Parent，指原初的亲代或祖源性存在；此称谓本身未明确性别。
    reason: 说明关键宇宙论称谓及其性别开放性。
  - marker: b
    text: “执政者”是对此类统治性天界存在的称呼；此处共有七位。
    reason: 帮助普通读者理解技术性宗教术语而不作宗派化解释。
  - marker: c
    text: 方括号中的省略号表示抄本传统在此有缺文或无法确定的文字。
    reason: 明确标示文本残缺，不以推测补足。
  - marker: d
    text: “皮斯提斯”音译自希腊语 Pistis，字面可意为“信”或“信实”；这里作为名字使用。
    reason: 保留专名，同时提供其语义背景。
  - marker: e
    text: “索菲亚·佐伊”音译自 Sophia Zoe；两个名字分别有“智慧”和“生命”之意。
    reason: 说明复合专名的含义而不将名字直接解释性改写。
  - marker: f
    text: “颂扬他”的“他”所指并不完全明确，可能指那气息、亚当，或气息所代表的更高来源。
    reason: 保存见证文本中的代词歧义，避免暗中确定神学解释。
lexical_decisions:
- source_word: Primal Parent
  choice: 始祖
  rationale: 以简洁、庄重的称谓表达原初的亲代或祖源角色，同时不擅自限定其性别。
- source_word: archons
  choice: 执政者
  rationale: 保留该诺斯替文献中统治性天界存在的技术含义，避免用“天使”或“魔王”等带入额外神学判断的词。
- source_word: soul / spirit / breath
  choice: 魂／灵／气息
  rationale: 分别译出见证文本中的三个术语，维持叙事对无魂、无灵以及外来气息的区分，不将其合并。
- source_word: the true man
  choice: 真人
  rationale: 保留“真实的人”这一专门而含张力的表达，不解释为某一特定神学身份。
- source_word: Paradise
  choice: 乐园
  rationale: 采用现代汉语宗教文献中通行且易懂的译法。
- source_word: the navel of the earth
  choice: 大地肚脐
  rationale: 保留原文具象而神话性的身体隐喻，不弱化为普通的“中心”。
- source_word: Rest
  choice: 安息
  rationale: 既表达停止工作所得的休止，也保留命名该日所带的宗教回响。
theological_decisions:
- issue: “他便把亚当撇下”中主语的指向
  choice: 保留第三人称“他”，仅明确亚当为宾语
  alternative: 明确译成“他们的首领便撇下亚当”
  rationale: 所据英文见证由复数“他们”转为单数“他”，指代并不完全明朗；译文不强行锁定为首席执政者。
- issue: 魂、灵与气息之间的关系
  choice: 采用三个不同汉语词分别对应
  alternative: 全部统一译为“灵”或“生命气息”
  rationale: 本文的宇宙论叙事有意区分这些概念；统一术语会提前化解原有神学张力。
- issue: “那人的力量”所指身份
  choice: 直译为“那人的力量”
  alternative: 解释为“真人的力量”或某位更高神明的力量
  rationale: 原段措辞与前文可能有关联，但见证文本本身未在此明确限定，故保留开放性。
- issue: “他们就颂扬他”中“他”的所指
  choice: 保留代词，并以脚注说明歧义
  alternative: 明确为颂扬气息、亚当或更高者
  rationale: 代词可能指刚发言的气息、亚当或其背后的来源；不宜根据某一解释擅自改写。
- issue: 亚当意为“父亲”的陈述
  choice: 照录文献自身的释义
  alternative: 按希伯来语通常词源改释为“人”或与“土地”相联
  rationale: 此处“父亲”是该文献叙事内部明确提出的解释，即使不同于常见希伯来语词源，也应忠实保留。
translation_notes:
  register: 采用现代、庄重而可读的简体中文，保留神话叙事的身体意象及“魂／灵／气息”等术语张力。由于任务所附材料明确注明科普特语原文复核尚待进行，本稿以所给公共领域英文见证为暂定底本；缺文、代词指向及专名语义均采取审慎处理，待直接核对《拿戈玛第文库》科普特语抄本及相关见证后再行校订。
