base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/030.yaml
  text: 'Therefore, just as the Lord did nothing without the Father, [being united with Him], either by Himself or by the Apostles, so neither do you do anything without the bishop and the presbyters. And do not attempt to think anything right for yourselves apart from others; but let there be one prayer in common, one supplication, one mind, one hope, in love and in joy unblamable, which is Jesus Christ, than whom there is nothing better.


    Hasten, all of you, to come together as to one temple, even God; as to one altar, even to one Jesus Christ, who came forth from One Father and is with One and departed unto One.'
translation:
  language: zh_hans
  text: '因此，主怎样不离开父而做任何事——无论亲自做，还是借着使徒做，[a]——你们也同样不要离开主教和众长老而做任何事。不要各自撇开众人，自以为自己的想法是对的；你们应当同心献上一个祷告、一个祈求，有同一心志、同一盼望，在爱中，也在那无可指摘的喜乐中；这喜乐就是耶稣基督，没有什么比他更美好。


    你们众人要赶快聚集在一起，归向同一座殿，就是上帝；归向同一座祭坛，就是独一的耶稣基督。他从独一的父而出，与独一的父同在，又归到独一的父那里。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据英文见证在“父”之后有方括号文字“[与他联合]”。方括号表示这是一项文本恢复；因希腊语原文复核尚待完成，暂不收入正文。
    reason: 如实标明底本见证的恢复信号和当前来源限制。
lexical_decisions:
- source_word: bishop
  choice: 主教
  rationale: 对应早期教会职分 episkopos 的常用现代汉语名称；在本段与“众长老”并列，保留职分区分。
- source_word: presbyters
  choice: 众长老
  rationale: 用“长老”对应 presbyteroi，并以“众”体现复数。
- source_word: one mind
  choice: 同一心志
  rationale: 既保留“一”的合一强调，又以自然汉语表达共同的思想与意向。
- source_word: unblamable joy
  choice: 那无可指摘的喜乐
  rationale: 尽量保留修饰关系及伦理色彩，不将其弱化为一般的快乐。
- source_word: temple
  choice: 殿
  rationale: 保留敬拜空间和群体合一的意象；“上帝”作为同位说明。
- source_word: altar
  choice: 祭坛
  rationale: 直译祭祀与敬拜意象，不预先限定其礼仪或教义含义。
- source_word: came forth ... is with ... departed unto
  choice: 而出……同在……归到
  rationale: 保留三个方向性表达及其神学张力；“归到”比字面“离去到”更合现代汉语，但不增添具体教义解释。
theological_decisions:
- issue: “without”所表达的关系
  choice: 不离开……而做任何事
  alternative: 没有……就不做任何事
  rationale: “不离开”较自然地表达行动不独立于父或教会领袖，同时避免把句子机械化为能力条件。
- issue: “which is Jesus Christ”的先行对象
  choice: 按近接关系理解为“喜乐”，译作“这喜乐就是耶稣基督”
  alternative: 理解为前述爱、喜乐、盼望或整个合一生活的总括
  rationale: 英文见证的语法允许一定张力；正文采用最自然的近接理解，但不扩写为排他的教义断言。
- issue: “one”在末句中的指称
  choice: 补明为“独一的父”
  alternative: 保留抽象的“那一位”
  rationale: 上下文首次明确说“One Father”，后两次“One”最自然地回指父；补明指称可避免汉语晦涩，同时保留反复强调的“独一”。
- issue: 方括号恢复语“being united with Him”
  choice: 不纳入正文，仅以脚注说明见证中的括注
  alternative: 正文译作“[与他联合]”
  rationale: 现有材料明确称该方括号为恢复信号，且希腊语复核尚待完成；正文不把不稳固的恢复语当作确定原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留段落中“一／同一／独一”的反复，以呈现合一主题；“主教”和“长老”按历史职分称谓处理，不导入后世宗派制度。由于直接希腊语审查尚未完成，本稿是依据所给公版英文见证制作的审慎暂定稿。
