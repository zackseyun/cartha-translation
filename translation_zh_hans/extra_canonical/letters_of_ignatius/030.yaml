review_pass:
  verdict: revise
  source_fidelity: 草稿总体传达了劝勉信徒不脱离父、主教及长老而行事，并保留了祷告、祈求、心志、盼望及“一个”的反复。但将英文见证中明确以方括号标示的“[being united with Him]”从正文移除，削弱了对所给见证的忠实呈现；且把“which is Jesus Christ”确定指为“这喜乐”，超过了该处可保留的语法指向。
  naturalness: 原译文庄重通顺，但“主怎样不离开父而做任何事”在现代汉语中容易理解为主离开某处；“归向同一座殿，就是上帝”也略显生硬。修订以“没有父就不做任何事”和“如同来到……就是……”较自然地保留原有比喻。
  terminology: “主教”“众长老”“祭坛”“耶稣基督”等术语可保留。“一个父”在汉语中不自然且可能误解为数量性描述，采用“独一的父”可对应英文反复的 One，同时不改变其指称。
  issues:
  - severity: medium
    issue: 方括号恢复语未保留在正文
    rationale: 所给英文见证及英语POB均保留“[being united with Him]”。即使其文本地位待希腊文复核，译文也应以方括号保留其不确定性，而非仅在脚注中转述。
  - severity: medium
    issue: 将“which is Jesus Christ”限定为“这喜乐”
    rationale: 该关系从句的具体先行范围在现有英文见证及其所反映的句法中不宜被汉语译文狭义锁定为“喜乐”。应以“这就是耶稣基督”保留其可指向前述合一祈祷、盼望、爱与无可指摘的喜乐的张力。
  - severity: low
    issue: “不离开父而做任何事”及“归向……就是上帝”表达略生硬
    rationale: 这两处虽可理解，却不如“没有父就不做任何事”及“如同来到……就是……”自然，也更清楚体现原文的依附关系和比喻性结构。
  revised_text: '因此，正如主没有父就不做任何事——无论是亲自做，还是借着使徒做，[与他联合]——你们也不要没有主教和众长老就做任何事。不要试图撇开别人，自己认定什么是对的；总要有共同的一个祷告、一个祈求、一个心志、一个盼望，在爱中，在无可指摘的喜乐中；这就是耶稣基督，没有什么比他更美好。


    你们众人要赶快聚集在一起，如同来到一座圣殿，就是上帝；来到一座祭坛，就是独一的耶稣基督。他出自独一的父，与独一的父同在，又归向独一的父。'
  revised_footnotes:
  - marker: 无
    text: “[与他联合]”按所据英文见证的方括号保留。方括号表示恢复或文本不确定性；由于直接希腊语原文复核尚待完成，不应将其视为无争议的正文。
    reason: 既忠实呈现英文见证的恢复信号，也明确当前文本依据的限制。
  revision_rationale: 修订恢复英文见证的方括号文字及其不确定性标记；避免把“which is Jesus Christ”武断地只指“喜乐”；并以更自然的现代汉语表达“without”及末段圣殿、祭坛的比喻。末句仍保留“一位／独一”的重复及其指向父的连贯性，未加入宗派性解释。
