review_pass:
  verdict: revise
  source_fidelity: 需要修订。原稿省略了英文见证以方括号标示的“[being united with Him]”，却把脚注锚点置于“使徒”之后，与脚注所称的位置不符。将“which is Jesus Christ”限定为“这喜乐就是耶稣基督”也过度缩窄了原文可保留的指向范围。末句把重复的“One”明确补为“独一的父”，超出了见证中保留的指称张力。另据该段通行希腊文，第二段首句的意象是“上帝的一座殿”，而非将“上帝”等同于“殿”。
  naturalness: 原稿总体庄重流畅，但“主怎样不离开父而做任何事”略有歧义，容易读成主一面离开父一面行事；改为“主没有父便不做任何事”更清楚自然。“归向同一座殿，就是上帝”则不合现代汉语的比喻关系，宜改为“如同来到上帝的一座殿”。
  terminology: “主教”“众长老”“祭坛”均可保留。“独一的耶稣基督／独一的父”会把反复的数词“一”强化为排他性术语；此处宜译为“一位／那一位”，并在末句保留原文的反复与一定的指称张力。
  issues:
  - severity: high
    issue: 方括号恢复语被省略，且脚注锚点位置错误。
    rationale: 所给英文见证明确含有“[being united with Him]”，其方括号信号应在译文中保留；原稿脚注说它位于“父”之后，实际锚点却放在“使徒”后。
  - severity: high
    issue: 将“which is Jesus Christ”单指为“这喜乐就是耶稣基督”。
    rationale: 该关系语的先行范围不宜仅限于最近的“喜乐”；原稿的处理缩窄了原文的语法和修辞张力。译为“这一切就是耶稣基督”较能保留其概括性。
  - severity: medium
    issue: 将末句两个“One”补定为“独一的父”。
    rationale: 英文见证反复保留“One”的形式。虽其回指父很可能，但正文直接补足并加上“独一的”会减少原有的修辞重复和指称余地。
  - severity: medium
    issue: “同一座殿，就是上帝”误置“殿”与“上帝”的关系。
    rationale: 该处的通行希腊文为“上帝的一座殿”（ναὸν θεοῦ）；即使遵循英文见证，也不应在汉语中造成上帝就是一座殿的断言。
  revised_text: '因此，正如主没有父便不做任何事[a]——无论是亲自做，还是借着使徒做——你们也不要没有主教和众长老便做任何事。不要离开别人而自以为有什么是对的；却要有同一的共同祷告、同一的祈求、同一的心思、同一的盼望，都在爱和无可指摘的喜乐中；这一切就是耶稣基督，没有什么比他更美好。


    你们众人都要赶快聚集在一起，如同来到上帝的一座殿，如同来到同一座祭坛，归向一位耶稣基督；他从一位父而出，与那一位同在，又归到那一位那里。'
  revised_footnotes:
  - marker: a
    text: 所据英文见证在此有方括号文字“[being united with Him]”（“与他联合”）。方括号表示该见证标示的恢复语；因直接希腊语原文复核尚待完成，译文保留方括号，不把它当作无争议的正文。
    reason: 保留英文见证的恢复信号，并使脚注锚点与该文字的实际位置一致。
  revision_rationale: 修订保留见证的方括号恢复信号，纠正脚注锚点；将“耶稣基督”作为前述合一生活的概括性说明，而不武断地只指“喜乐”；按通行希腊文本及见证的基本意象译出“上帝的一座殿”；并在末句不把反复的“One”扩写成确定、排他的“独一的父”。
