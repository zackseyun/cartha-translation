    But the Gospel hath a singular preeminence in the advent of the Savior, even our Lord Jesus Christ, and His passion and resurrection. For the beloved Prophets in their preaching pointed to Him; but the Gospel is the completion of immortality. All things together are good, if ye believe through love.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/073.yaml
  text: 'The priests likewise were good, but better is the High Priest, to whom the holy of holies is entrusted. For to him alone are entrusted the hidden things of God. He himself is the door of the Father, through which Abraham, Isaac, and Jacob enter, along with the Prophets, the Apostles, and the whole Church. All these things come together in the unity of God.


    But the Gospel has a unique preeminence in the coming of the Savior, our Lord Jesus Christ, and in his suffering and resurrection. For the beloved Prophets pointed to him in their preaching, but the Gospel is the fulfillment of immortality. All things together are good, if you believe through love.'
translation:
  language: zh_hans
  text: '祭司们固然也是好的，但那位大祭司更好；至圣所已托付给他，因为唯有他受托掌管上帝隐秘的事。他自己就是通向父的门；亚伯拉罕、以撒、雅各，以及众先知、众使徒和全教会，都从这门进去。这一切都汇聚在上帝的合一之中。


    然而，福音有其独特的卓越之处，就是救主——我们的主耶稣基督——的来临、受难与复活。蒙爱的众先知在宣讲中指向他；福音却是永生的成全[a]。这一切合在一起都是好的，只要你们借着爱而信。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永生的成全”也可译作“不能朽坏之生命的圆满实现”。现有底本为公共领域英译见证；希腊文原文尚待直接复核。
    reason: completion 与 immortality 的具体希腊词及其语义范围尚未完成源语言核查，需明确译文的暂定性质与可能范围。
lexical_decisions:
- source_word: priests / High-priest
  choice: 祭司们／大祭司
  rationale: 保留祭司制度与基督大祭司身份之间的对比，并采用现代中文基督教文献中通行、清楚的称谓。
- source_word: holy of holies
  choice: 至圣所
  rationale: 采用对应圣殿最内层圣所的标准中文用语，保留其礼仪背景。
- source_word: hidden things of God
  choice: 上帝隐秘的事
  rationale: 不将其具体化为某种教义、奥秘或启示内容，以保留原文概括性的表达。
- source_word: door of the Father
  choice: 通向父的门
  rationale: 明确这是通往父的门，同时保留“门”的基督论意象，避免译成较抽象的“途径”。
- source_word: combine / come together
  choice: 汇聚
  rationale: 自然表达众先祖、先知、使徒和教会共同归入上帝合一的思想，不额外解释其关系。
- source_word: advent
  choice: 来临
  rationale: 可涵盖救主进入历史的事件，又不擅自限定为降生或末世再临。
- source_word: passion
  choice: 受难
  rationale: 采用指耶稣苦难与死亡事件的传统而清楚的表达。
- source_word: completion of immortality
  choice: 永生的成全
  rationale: “成全”保留 completion 所含完成、实现之意；“永生”较“不能朽坏”自然，但以脚注标示潜在词义范围。
- source_word: believe through love
  choice: 借着爱而信
  rationale: 保留“爱”与“信”之间的工具性或媒介性关系，不改写成单纯的“以爱心相信”或“因爱而信”。
theological_decisions:
- issue: 大祭司所指对象
  choice: 沿用阳性代词“他”，由上下文与“父的门”指向基督，但不在正文额外补出“基督”
  alternative: 直接译为“基督这位大祭司”
  rationale: 原见证文本未在本句明说名字；保留其修辞推进，避免解释性增补。
- issue: “上帝的合一”的关系
  choice: 译作“汇聚在上帝的合一之中”
  alternative: 译作“合而为一，归于上帝”或“共同构成上帝的统一”
  rationale: 不把合一解释为教会组织统一、神性本体合一或其他特定教义，保留原表达的张力。
- issue: 福音与众先知的关系
  choice: 译出二者的对照，同时肯定“这一切”都是好的
  alternative: 把福音表述为取代先知或旧约
  rationale: 原文强调福音的卓越与成全，却未贬斥先知；译文避免导入替代论式结论。
- issue: “永生的成全”
  choice: 保留完成／实现的双重可能
  alternative: 译作“永生的最终启示”或“使人不朽的圆满手段”
  rationale: 这些替代译法会限定福音与不朽之间的关系；现译保持原有神学浓度与含混度。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留早期基督教劝勉文献的层层推进，但适度拆分以避免欧化。鉴于所提供的直接证据是公共领域英语见证，且注明希腊文复核待定，本稿属于审慎的暂定译文；未把英语见证当作已完成审校的希腊文底本。
