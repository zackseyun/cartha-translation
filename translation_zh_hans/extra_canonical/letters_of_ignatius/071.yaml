    然而，有些人猜疑我这样说，是因为我预先知道某些人的分裂。但我在其中被捆锁的那一位可以为我作证：我不是从人的肉身得知这信息的；这是灵所传讲的信息，它如此说：“不要撇开主教做任何事；要保守你们的肉身，如同上帝的殿；要珍爱合一，躲避分裂；要效法耶稣基督，正如他自己效法他的父一样。”[a]'
