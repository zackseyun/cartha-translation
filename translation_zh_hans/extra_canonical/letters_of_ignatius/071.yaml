base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/071.yaml
  text: 'For even though certain people wanted to deceive me according to the flesh, the spirit is not deceived, since it is from God. For it knows where it comes from and where it is going, and it searches out hidden things. When I was among you, I cried out; I spoke in a loud voice, with God’s own voice: “Pay attention to the bishop, the presbytery, and the deacons.”


    Nevertheless, some suspected that I said this because I knew beforehand about the division of certain people. But He in whom I am bound is my witness that I did not learn it from human flesh. It was the preaching of the Spirit, who spoke in this way: “Do nothing without the bishop. Keep your flesh as a temple of God. Cherish unity. Avoid divisions. Be imitators of Jesus Christ, just as He Himself also was of His Father.”'
translation:
  language: zh_hans
  text: '即使有些人想按着肉身欺骗我，那从上帝而来的灵却不受欺骗；因为它知道自己从哪里来、往哪里去，也能察明隐秘的事。我在你们中间时曾高声呼喊，用上帝的声音说：“你们要留心主教、长老团和执事们。”


    然而，有些人猜疑我这样说，是因为我预先知道某些人的分裂。但我为之被捆锁的那一位可以为我作证：这事不是人的肉身告诉我的，而是灵宣告说：“不要撇开主教做任何事；要保守你们的肉身，如同上帝的殿；要珍爱合一，躲避分裂；要效法耶稣基督，正如他自己效法他的父一样。”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段现依据所提供的公共领域英文见证译出；中期希腊文抄本传统的直接核对尚待完成。尤其是“灵”“用上帝的声音”以及若干介词关系，日后可能按希腊文证据作细部修订。
