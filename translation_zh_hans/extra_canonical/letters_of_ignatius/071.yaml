base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/071.yaml
  text: 'For even though certain people wanted to deceive me according to the flesh, the spirit is not deceived, since it is from God. For it knows where it comes from and where it is going, and it searches out hidden things. When I was among you, I cried out; I spoke in a loud voice, with God’s own voice: “Pay attention to the bishop, the presbytery, and the deacons.”


    Nevertheless, some suspected that I said this because I knew beforehand about the division of certain people. But He in whom I am bound is my witness that I did not learn it from human flesh. It was the preaching of the Spirit, who spoke in this way: “Do nothing without the bishop. Keep your flesh as a temple of God. Cherish unity. Avoid divisions. Be imitators of Jesus Christ, just as He Himself also was of His Father.”'
translation:
  language: zh_hans
  text: '即使有些人想按着肉身欺骗我，那从上帝而来的灵却不受欺骗；因为它知道自己从哪里来、往哪里去，也能察明隐秘的事。我在你们中间时曾高声呼喊，用上帝的声音说：“你们要留心主教、长老团和执事们。”


    然而，有些人猜疑我这样说，是因为我预先知道某些人的分裂。但我为之被捆锁的那一位可以为我作证：这事不是人的肉身告诉我的，而是灵宣告说：“不要撇开主教做任何事；要保守你们的肉身，如同上帝的殿；要珍爱合一，躲避分裂；要效法耶稣基督，正如他自己效法他的父一样。”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段现依据所提供的公共领域英文见证译出；中期希腊文抄本传统的直接核对尚待完成。尤其是“灵”“用上帝的声音”以及若干介词关系，日后可能按希腊文证据作细部修订。
    reason: 用户提供的来源资料明确说明希腊文审查尚未完成；向读者透明交代当前译稿的证据层级。
lexical_decisions:
- source_word: spirit / Spirit (Greek source review pending)
  choice: 灵
  rationale: 上下文先说这灵“从上帝而来”，随后又说它发出宣告。统一译作“灵”，既维持两处联系，也不在尚未核对希腊文之前擅自消除其指向上帝之灵或人的灵所可能形成的语义张力。
- source_word: bishop
  choice: 主教
  rationale: 采用现代汉语中辨识度最高的早期教会职分名称；此处与长老团、执事并列。
- source_word: presbytery
  choice: 长老团
  rationale: 原词所指不是单个长老，而是作为整体的长老群体，因此用“长老团”。
- source_word: deacons
  choice: 执事们
  rationale: 保留复数，并采用现代汉语教会文献通行且易懂的职分称谓。
- source_word: according to the flesh / human flesh
  choice: 按着肉身／人的肉身
  rationale: 保留“肉身”意象及前后呼应，不简化为“以人的办法”或“从人那里”，以免抹去文本刻意形成的肉身—灵对照。
- source_word: cherish unity
  choice: 珍爱合一
  rationale: 既表达积极看重并维护共同体合一，也与下句“躲避分裂”形成清楚对照。
theological_decisions:
- issue: “灵”是否明确译作“圣灵”
  choice: 正文译作“灵”
  alternative: 圣灵
  rationale: 所提供的底本是英文公共领域见证，且希腊文直接核查尚待完成。上下文强烈指向上帝的灵，但首句也利用了“灵不受欺骗”的表达；暂不补入“圣”字，可避免超出当前源证据明确程度。
- issue: 教会职分术语的时代含义
  choice: 采用“主教、长老团、执事们”，不加后世制度解释
  alternative: 监督、众长老和众执事
  rationale: “主教”较自然地对应该书信中居于单数位置、与长老团和执事并列的职分，但正文不把后世宗派体制反向投射到早期语境。
- issue: “用上帝的声音”所表达的权威
  choice: 直译保留为“用上帝的声音”
  alternative: 受上帝感动而说／奉上帝之名说
  rationale: 直译保留原见证中大胆且具有神学张力的表达，不把它解释成某一种启示机制。
- issue: 耶稣基督效法父的表述
  choice: 保留“正如他自己效法他的父一样”
  alternative: 正如他自己顺从父一样
  rationale: 保留“效法者”与“效法基督”之间的平行，不以“顺从”等较窄概念替代。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。保留早期基督教文本中的“肉身—灵”“合一—分裂”对照；命令句简洁有力。神名统一用“上帝”，耶稣基督的代词用“他”，不采用现代汉语中带额外敬体色彩的“祂”。
