base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/033.yaml
  text: 'Therefore, let us not be insensitive to his goodness. For if he were to imitate us according to our deeds, we would be lost. For this reason, since we have become his disciples, let us learn to live in a way worthy of Christianity. For whoever is called by any name other than this does not belong to God.


    Therefore, put away the vile leaven that has grown stale and sour, and turn to the new leaven, which is Jesus Christ. Be salted in him, so that none of you becomes putrid, since you will be tested by your savor.


    It is monstrous to speak of Jesus Christ and practice Judaism. For Christianity did not believe in Judaism, but Judaism believed in Christianity, in which every tongue believed and was gathered together to God.'
translation:
  language: zh_hans
  text: '所以，我们不要对他的良善麻木不觉。因为他若照我们的行为来仿效我们，我们就灭亡了。因此，既然我们已经成为他的门徒，就当学习以配得上基督教之名的方式生活。凡以这名以外的别名称呼自己的，都不属于上帝。[a]


    所以，要除掉那已经陈旧发酸的恶酵，转向新酵，就是耶稣基督。你们要在他里面用盐调和，免得你们中间有人腐坏，因为人要凭你们的滋味检验你们。


    一面谈论耶稣基督，一面奉行犹太教，是荒谬的。因为不是基督教信入了犹太教，而是犹太教信入了基督教；在基督教里，各种语言的人都信了，并一同归聚到上帝那里。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这名”可理解为“基督徒／基督教”之名。原句也可能泛指以其他宗教名号自称；希腊文直接复核尚待进行。
    reason: 保留“another name”在身份称谓与宗教归属之间的歧义。
  - marker: b
    text: 这里的“犹太教”指作者所反对的宗教实践与信仰立场，不是指犹太民族。原文的对比带有早期基督教争辩语境中的尖锐措辞。
    reason: 防止将古代宗教论争误读为对族群的普遍贬抑，同时不削弱原文张力。
lexical_decisions:
- source_word: insensible
  choice: 麻木不觉
  rationale: 保留对上帝良善缺乏感受和回应的含义，同时符合现代汉语表达。
- source_word: Christianity
  choice: 基督教之名／基督教
  rationale: 此处既可指基督徒的生活方式和身份，也可指基督信仰整体；按上下文分别自然表达，不将其窄化为现代制度性宗派。
- source_word: leaven
  choice: 酵／新酵
  rationale: 保留原文连续的发酵隐喻；用“酵”而非只译作“酵母”，以呼应古代面团中的酵种。
- source_word: Be ye salted in Him
  choice: 你们要在他里面用盐调和
  rationale: 保留盐的隐喻及“在他里面”的关系性措辞，避免解释成单一的道德功用。
- source_word: savor
  choice: 滋味
  rationale: 与盐和腐坏的意象相连，也保留借人的表现受检验的比喻意义。
- source_word: practice Judaism
  choice: 奉行犹太教
  rationale: 表达采取犹太教生活实践的动作，避免译成族裔身份。
- source_word: every tongue
  choice: 各种语言的人
  rationale: 按闪语式／圣经式表达传达人类各语言群体，而非字面理解为人体器官。
theological_decisions:
- issue: “以别名称呼”所指范围
  choice: 译为“凡以这名以外的别名称呼自己的，都不属于上帝”，并加注说明语义歧义
  alternative: 凡被冠以这名以外任何名称的人，都不是属上帝的
  rationale: 上下文可能指拒绝“基督徒／基督教”身份而另取宗教名号，也可能泛指以别的名号界定自己；正文保持较宽表达，不指定某一历史群体。
- issue: “犹太教信入基督教”的历史—神学张力
  choice: 直译其方向性主张，并以脚注防止被理解为对犹太民族的贬损
  alternative: 犹太信仰在基督里得到成全
  rationale: 替代译法会加入“成全”这一原句未明说的神学解释；正文保留伊格那丢具有争辩性的表述。
- issue: “in which”先行词
  choice: 理解为“基督教”，译作“在基督教里”
  alternative: 在耶稣基督里
  rationale: 按所提供见证文本的最近先行词应为 Christianity；但希腊文复核尚待进行，因此不擅自改成基督论表达。
translation_notes:
  register: 采用现代、庄重而可读的简体中文，保留“酵—盐—腐坏—滋味”的复合隐喻。鉴于目前仅提供公版英文见证，译文属于待希腊文中期校订本传统直接复核的出版草案；对于英文见证中可能反映希腊语专门用词的地方，未作过度确定化处理。
