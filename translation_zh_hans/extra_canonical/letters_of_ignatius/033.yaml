review_pass:
  verdict: revise
  source_fidelity: 草案总体忠实保留了英文见证的三段论述及其比喻链条。但“他若照我们的行为来仿效我们”把“imitate us”直译为“仿效”，在汉语中容易误解为上帝效法人的行为；这里应明确为按我们的行为对待我们。“用盐调和”也弱化了被动的“be salted”及盐腌、防腐的意象。
  naturalness: 整体庄重流畅；但“以配得上基督教之名的方式生活”“在他里面用盐调和”“凭你们的滋味检验你们”略显生硬或不够明确。修订后以现代汉语保留修辞力度与隐喻的陌生感。
  terminology: “恶酵”“新酵”“耶稣基督”“犹太教”均可保留。“基督教”在此按见证文本保留，不将其制度化为现代宗派；首段改作“合乎基督教的生活方式”，以传达 Christianity 所指的生活/身份。“犹太教”脚注继续限定为作者笔下的宗教实践和立场，而非犹太族群。
  issues:
  - severity: medium
    issue: “照我们的行为来仿效我们”可能误译神的行动。
    rationale: 英文“if He should imitate us according to our deeds”在此意为若他按我们的行为来对待我们，我们必灭亡；汉语“仿效我们”会造成上帝模仿人行为的歧义。
  - severity: medium
    issue: “你们要在他里面用盐调和”没有充分表达“Be ye salted in Him”。
    rationale: “salted”是被动的盐腌/受盐作用意象，并与随后“腐坏”和“滋味（气味）”相连；“调和”转成烹饪式混合，削弱原文意象。
  - severity: low
    issue: “凭你们的滋味检验你们”表达不够自然，且“滋味”可能仅被理解为味道。
    rationale: savor 在此与盐、腐败相接，更接近人所散发的气味/表现这一辨识性隐喻；宜保留“受察验”而避免无依据补出具体施验者。
  revised_text: '所以，我们不要对他的良善麻木不觉。因为他若按我们的行为对待我们，我们就必灭亡。因此，既已成为他的门徒，我们就当学习过合乎基督教的生活。凡用这名以外别的名称被称呼的，就不属上帝。[a]


    所以，要除掉那陈旧发酸的恶酵，归向新酵，就是耶稣基督。你们要在他里面受盐腌，免得你们中间有人腐坏；因为你们必因自己所散发的气味受察验。


    口里谈论耶稣基督，却又奉行犹太教，是荒谬的。因为不是基督教信入了犹太教，而是犹太教信入了基督教；在基督教里，各语言群体的人都信了，并一同归聚到上帝那里。[b]'
  revised_footnotes:
  - marker: a
    text: “这名”可理解为“基督徒／基督教”之名。原句也可能泛指以其他宗教名号自称；希腊文直接复核尚待进行。
    reason: 保留“another name”在身份称谓与宗教归属之间的歧义。
  - marker: b
    text: 这里的“犹太教”指作者所反对的宗教实践与信仰立场，不是指犹太民族。原文的对比带有早期基督教争辩语境中的尖锐措辞。
    reason: 防止将古代宗教论争误读为对族群的普遍贬抑，同时不削弱原文张力。
  revision_rationale: 修订仅处理可安全判定的语义与汉语表达问题：将神“仿效我们”改为按人的行为“对待我们”；将“salted”恢复为“受盐腌”的被动、防腐意象；将“savor”处理为可辨识的“所散发的气味”，并保留“受察验”的被动性。其余争议性表达，包括“基督教信入／犹太教信入基督教”及“在基督教里”的先行词判断，仍依所给英文见证直译并保留说明。
