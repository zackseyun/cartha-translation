review_pass:
  verdict: revise
  source_fidelity: 草案整体忠实于所给英文见证，并保留了段落推进及“酵—盐—腐坏—滋味”的连贯意象。不过，条件句的结果被误作既成过去（“我们就灭亡了”），应改为将来／假设结果；“被称为”也不宜主动化为“称呼自己”。“信入”并非现代汉语自然表达，且末句可更准确地保留原文的信仰方向性。
  naturalness: 语体庄重，整体可读。建议将“照我们的行为来仿效我们”调整为更自然但仍保留反讽的“照着我们的行为来对待我们”；“在他里面用盐调和”不合现代汉语搭配，也弱化了被动命令，改为“在他里面受盐调味”。“因为人要凭你们的滋味检验你们”可简化为“因为你们必因自己的滋味受检验”。
  terminology: “上帝”“门徒”“耶稣基督”“酵”“犹太教”均可保留。“基督教”在此是古代身份／信仰用语，不应读作现代制度化宗派；正文以“基督信仰”表达时较自然，同时保留其与“犹太教”的对照。关于“犹太教”的脚注应继续明确其所指为作者论争中的宗教立场与实践，而非犹太民族。
  issues:
  - severity: medium
    issue: 条件句结果时态不当
    rationale: 英文见证为“if ... we would be lost”，草案“我们就灭亡了”成为既成事实。应译为“我们就会灭亡”。
  - severity: medium
    issue: “is called by another name”被主动化
    rationale: 草案“以这名以外的别名称呼自己的”加入自我命名的主动含义；见证文本为被称为另一名称。改作“凡被称为这名以外别名的”。
  - severity: medium
    issue: “Be ye salted in Him”译法不自然且改变句法意象
    rationale: “用盐调和”使人像混合物，且淡化原文被动命令。以“在他里面受盐调味”保留盐的比喻和“在他里面”的关系语。
  - severity: medium
    issue: “信入”不符合现代标准汉语
    rationale: “believe in”在此应表达信仰／信从的方向性；“信从”较自然，并避免解释性扩充。
  - severity: low
    issue: “every tongue”表达可更自然
    rationale: “各种语言的人”可懂，但“说各种语言的人”更合现代汉语，同时保留“tongue”作为语言群体的转喻。
  revised_text: '所以，我们不要对他的良善麻木不觉。因为他若照着我们的行为来对待我们，我们就会灭亡。因此，既然我们已经成为他的门徒，就当学习以配得上基督信仰之名的方式生活。凡被称为这名以外别名的，都不属于上帝。[a]


    所以，要除掉那已经陈旧发酸的恶酵，转向新酵，就是耶稣基督。你们要在他里面受盐调味，免得你们中间有人腐坏，因为你们必因自己的滋味受检验。


    一面谈论耶稣基督，一面奉行犹太教，是荒谬的。因为基督信仰并非信从犹太教，反倒是犹太教信从基督信仰；在其中，说各种语言的人都信了，并归聚到上帝那里。[b]'
  revised_footnotes:
