    reason: 保留“another name”在身份称谓与宗教归属之间的歧义，并与正文的被动句式对应。
  - marker: b
    text: 这里的“犹太教”指作者在早期基督教论争中所反对的宗教立场与实践，并非指犹太民族。原文的对比带有该论争语境中的尖锐措辞。
    reason: 防止把古代宗教论争误读为对犹太民族的普遍贬抑，同时保留原文的张力。
