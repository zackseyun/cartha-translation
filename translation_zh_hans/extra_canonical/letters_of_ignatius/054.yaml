    text: 本段依据现有公版英文见证暂译，尚待希腊文原文复核。结合全信语境，“饶过我”很可能是请求罗马信徒不要以爱心干预他走向殉道；但本段措辞本身仍保留一定含蓄性。
    reason: 如实标明当前资料仅为英文见证且原文复核尚未完成；说明“饶过我”的可能语境，不在正文中消除其含蓄性。
  revision_rationale: 修正末句条件否定的方向，使其与英文见证的“unless ye shall spare me”一致；同时微调两处汉语表达，以提升自然度并保留原有修辞与神学含蓄。脚注保留原有的来源限制和语境说明。
