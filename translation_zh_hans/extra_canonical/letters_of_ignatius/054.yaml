review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实保留了祈祷蒙允、锁链、终点／目标、产业及“爱可能造成伤害”的张力。惟“开端确实已经安排妥当”把“开端是好的／顺利的”改成了被安排的状态，增添原见证未明示的施事与含义；末句“放过我”在现代汉语中容易暗示对方蓄意加害，未能恰当承载“spare me”的请求语气。
  naturalness: 整体庄重通顺。“上帝垂听我的祈祷，准我得见……”比“我向上帝祈求之后，蒙准……”更直接反映因果关系；“开端固然是好的”自然且不增译；“饶过我”比“放过我”更适合书信中恳求对方不要以行动干预自己的语境，同时仍保留原句含蓄。
  terminology: “上帝”“基督耶稣”“敬虔”“锁链”“产业”等用语一致且适合庄重书信语域。“被看为配得”保留被动含蓄，可维持。“归到上帝那里”比“达到上帝那里”更符合现代汉语，但不明言殉道。
  issues:
  - severity: medium
    issue: “开端确实已经安排妥当”
    rationale: 英文见证为“the beginning verily is well ordered”，所依据的传统译法在此表达开端良好／顺利，并非明确说某人已把开端“安排妥当”。现译添加了安排者及完成性，宜改为不带该增义的表达。
  - severity: medium
    issue: “你们若不放过我”
    rationale: “spare me”在这里是恳求收信人不要以其爱心行动妨碍作者所追求的结局；“放过我”在现代汉语常带对方正在恶意为难的色彩。改为“饶过我”较贴近原有请求，同时不把具体行动写入正文。
  - severity: low
    issue: 首句的祈祷蒙允关系表达较弱
    rationale: “我向上帝祈求之后”主要表达时间先后；见证明确表示获准得见是对祷告的回应。改为“上帝垂听我的祈祷”可更清晰地保留该关系。
  revised_text: '上帝垂听我的祈祷，准我得见你们敬虔的面容；我所得的甚至超过所求的。因为我在基督耶稣里身负锁链，盼望能向你们问安；倘若这是上帝的旨意，使我被看为配得走到终点。


    开端固然是好的，只要我能达到目标，毫无阻碍地领受我的产业。我所担心的，恰恰是你们的爱，恐怕它反而会伤害我。你们要做自己想做的事很容易；但若你们不肯饶过我，我就很难归到上帝那里。 [a]'
  revised_footnotes:
  - marker: a
    text: 本段依据现有公版英文见证暂译，尚待希腊文原文复核。结合全信语境，“你们不肯饶过我”很可能是请求罗马信徒不要设法阻止他走向殉道；但本段措辞本身仍保留一定含蓄性。
    reason: 如实标明当前资料仅为英文见证且希腊文复核尚未完成；说明关键语境，但不在正文中消除“spare me”所保留的含蓄。
  revision_rationale: 修订仅处理可安全确认的语义增补与现代汉语语用问题：以“开端固然是好的”避免“安排妥当”所加入的施事及完成性；以“饶过我”替换易误导为敌意加害的“放过我”；首句明确祈祷获回应。其余关键张力、被动表达和终末指向均予保留。
