    for the beginning verily is well ordered, if so be I shall attain unto the goal, that I may receive mine inheritance without hindrance. For I dread your very love, lest it do me an injury; for it is easy for you to do what ye will, but for me it is difficult to attain unto God, unless ye shall spare me.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/054.yaml
  text: 'Because, in answer to my prayer to God, I have been granted the privilege of seeing your godly faces, I have received even more than I asked for. For while wearing chains in Christ Jesus, I hope to greet you, if it is the divine will that I should be counted worthy to reach the end.


    For the beginning is indeed well ordered, provided that I reach the goal and receive my inheritance without hindrance. I fear your very love, in case it should harm me. For it is easy for you to do what you want, but it is difficult for me to reach God unless you spare me.'
translation:
  language: zh_hans
  text: '我向上帝祈求之后，蒙准得见你们敬虔的面容，所得的甚至超过了我所求的。如今我在基督耶稣里身负锁链，盼望能与你们相见问安——如果这是上帝的旨意，并且我被看为配得走到终点。


    开端确实已经安排妥当，只要我能达到目标，毫无阻碍地领受我的产业。我所担心的，恰恰是你们的爱，恐怕它反而会伤害我。你们要做自己想做的事很容易；但你们若不放过我，我要达到上帝那里就很难了。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段依据现有公版英文见证暂译，尚待希腊文原文复核。结合全信语境，“放过我”很可能是请求罗马信徒不要设法阻止他走向殉道；但本段措辞本身仍保留一定含蓄性。
    reason: 如实标明当前资料仅为英文见证且原文复核尚未完成，并说明关键语境而不在正文中消除歧义。
lexical_decisions:
- source_word: godly countenances
  choice: 敬虔的面容
  rationale: 保留“敬虔”这一属灵品格及“面容”的具体意象，同时符合现代汉语表达。
- source_word: wearing bonds in Christ Jesus
  choice: 在基督耶稣里身负锁链
  rationale: “锁链”具体呈现囚禁处境；“在基督耶稣里”保留其神学关系，不将其弱化为单纯因信仰受囚。
- source_word: reach unto the end / attain unto the goal
  choice: 走到终点／达到目标
  rationale: 保留原文相互呼应的竞赛或行程意象，也不预先限定为殉道以外或以内的单一含义。
- source_word: receive mine inheritance
  choice: 领受我的产业
  rationale: 采用圣经语域中自然且庄重的表达，保留末世性与继承意涵。
- source_word: spare me
  choice: 放过我
  rationale: 结合上下文，指不要以爱心干预他的既定道路；译法直接有力，但不在正文中明确增译“不要营救我”。
theological_decisions:
- issue: “达到上帝”与殉道之间的关系
  choice: 保留“达到上帝那里”的原始张力
  alternative: 译为“借着殉道归到上帝那里”
  rationale: 上下文强烈暗示殉道，但见证文本并未在此句明说；不应将解释直接写入正文。
- issue: 罗马信徒的爱可能“伤害”伊格那丢
  choice: 保留反常而有意的表达
  alternative: 解释为“你们若设法营救我，就会妨碍我殉道”
  rationale: 原句以爱可能造成伤害形成张力；正文不替作者消解，脚注仅说明可能的语境。
- issue: “被看为配得”的施事者
  choice: 使用被动式“我被看为配得”
  alternative: 明确译为“上帝认为我配得”
  rationale: 保留神圣被动的含蓄，不补出见证文本未明说的主语。
translation_notes:
  register: 采用现代、庄重而清晰的书信语体。保留“锁链、终点、目标、产业”等相互关联的意象，并让“你们的爱反而伤害我”保持原有的修辞张力。由于所给材料明确注明希腊文审查尚待完成，本稿属于可出版格式的暂定译稿。
