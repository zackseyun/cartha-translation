  yaml_path: translation/extra_canonical/letters_of_ignatius/090.yaml
  text: Ignatius, who is also called Theophorus, to Polycarp, bishop of the church of the Smyrnaeans—or rather, one who has God the Father and Jesus Christ as his bishop—abundant greeting.
translation:
  language: zh_hans
  text: 又名“提奥弗罗斯”的伊格那修，致士每拿人教会的监督坡旅甲——或者更确切地说，致其监督是父神和耶稣基督的坡旅甲：致以丰盛的问安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ignatius, who is also Theophorus
  choice: 又名“提奥弗罗斯”的伊格那修
  rationale: 保留两个专名，并用“又名”自然表达别称关系；由于希腊文复核尚待完成，不在正文中解释 Theophorus 的可能词义。
- source_word: bishop
  choice: 监督
  rationale: 以现代读者可理解且较少宗派色彩的词表达早期教会职分；同一词在本句两处保持一致，以保留原文的修辞转折。
- source_word: church of the Smyrnaens
  choice: 士每拿人教会
  rationale: 表达由士每拿当地信徒组成的教会，贴近见证文本中的族群式属格措辞。
- source_word: or rather
  choice: 更确切地说
  rationale: 保留作者对前一句的提升和修正语气，不将两种描述简单并列。
- source_word: abundant greeting
  choice: 愿你丰丰富富地喜乐
  rationale: 采用书信问安句式，并保留“丰盛、充盈”的加强意味；避免生硬直译为“许多问候”。
theological_decisions:
- issue: 父神和耶稣基督为坡旅甲的“监督”
  choice: 他是以父神和耶稣基督为监督的人
  alternative: 他的监督是父神和耶稣基督
  rationale: 保留神与基督共同作为“监督”的神学张力及对地上职分的文字呼应，同时使汉语指代清楚；不把“监督”弱化为一般性的“看顾者”。
- issue: “教会的监督”与“以神为监督”的关系
  choice: 用破折号和“更确切地说”保留修正式转折
  alternative: 将两者合并为并列称谓
  rationale: 见证文本有意从坡旅甲监督教会转向他自己受父神与耶稣基督监督，译文不消解这一反转。
translation_notes:
  register: 采用庄重而通顺的现代书信体。人名使用基督教中文传统中较常见的“伊格那修、坡旅甲、士每拿”；避免古奥的“致意多多”，也不增添原见证未明说的头衔或教义解释。鉴于直接希腊文复核尚待完成，本稿按所给公版英文见证审慎拟定。
