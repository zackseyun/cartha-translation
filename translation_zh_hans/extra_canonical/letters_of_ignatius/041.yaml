base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/041.yaml
  text: 'For when you are obedient to the bishop as to Jesus Christ, it is evident to me that you are living not after men but after Jesus Christ, who died for us, so that, believing in his death, you might escape death.


    It is therefore necessary, even as is your custom, that you should do nothing without the bishop; but be obedient also to the presbytery, as to the Apostles of Jesus Christ our hope. For if we live in him, we shall also be found in him.


    And likewise those who are deacons of the mysteries of Jesus Christ must please all people in every way. For they are not deacons of meats and drinks but servants of the Church of God. It is right, therefore, that they should beware of blame as of fire.'
translation:
  language: zh_hans
  text: '因为你们顺服主教，如同顺服耶稣基督，我就看出，你们不是按人的方式生活，而是按耶稣基督的方式生活。他曾为我们而死，使你们因信他的死，可以逃脱死亡。


    所以，你们必须像一向所做的那样，凡事都不要离开主教而自行其是；也要顺服长老团，如同顺服耶稣基督——我们盼望的那一位——的使徒。我们若在他里面生活，也必被发现是在他里面。[a]


    同样，作耶稣基督奥秘之执事的人，必须在各方面使众人满意。[b]他们所服事的并不是饮食，而是上帝的教会。因此，他们理当像防火一样，防备一切可受指控之事。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被发现是在他里面”也可译作“显明是在他里面”；原文可能带有最终受察验时被认定的意味。
    reason: 保留 εὑρεθησόμεθα 的被动表达及其可能的末世性含义。
  - marker: b
    text: “使众人满意”不是说要无原则地讨好人，而是要求执事在各方面有使众人认可的表现。
    reason: 说明 ἀρέσκειν 的通常语义，同时避免中文读者误读为迎合众人。
  - marker: c
    text: “可受指控之事”原文也可理解为“指控”或“罪名”。这里可能兼指应避免过错，也应避免给人留下合理指控的把柄。
    reason: 原词 τὰ ἐγκλήματα 在此存在客观过错与所受指控之间的语义歧义。
lexical_decisions:
- source_word: ἐπίσκοπος
  choice: 主教
  rationale: 在伊格那丢书信的语境中，此词指地方教会中区别于长老团和执事的监督者；“主教”最能清楚呈现这一历史职分结构。
- source_word: πρεσβυτέριον
  choice: 长老团
  rationale: 该词是集合名词，所指不是单个长老，而是作为整体的长老群体。
- source_word: διάκονοι
  choice: 执事
  rationale: 上下文将其与主教、长老团并列，显示这里主要是职分称谓，而非泛指一切服事者。
- source_word: μυστήρια
  choice: 奥秘
  rationale: 保留宗教语境中的宽广含义，不将其限定为某一特定圣礼体系。
- source_word: ἀναστρεφώμεθα
  choice: 生活
  rationale: 该词在此指人的生活行止；“生活”自然且不把含义缩窄为单一的行为表现。
- source_word: ἐγκλήματα
  choice: 可受指控之事
  rationale: 此词可指指控、罪名或招致指控的过失；此译文兼顾执事应避免实际过错及合理指控的语境。
theological_decisions:
- issue: 顺服主教“如同”顺服基督的措辞
  choice: 顺服主教，如同顺服耶稣基督
  alternative: 把主教视为耶稣基督而顺服
  rationale: 原文作类比，强调顺服的方式，并未明说主教与基督身份等同；译文保留强烈类比而避免本体论上的混同。
- issue: “在他里面生活／被发现”的指代和末世意味
  choice: 将“他”理解为紧邻的耶稣基督，并保留“被发现”措辞
  alternative: 译为“我们若照他而活，也必与他同在”
  rationale: 语法上最自然的先行词是耶稣基督；“被发现”可能含最终受察验时显明之意，不宜静默改写为一般性的“同在”。
- issue: 执事服事的“奥秘”
  choice: 不具体界定为圣餐或圣礼
  alternative: 耶稣基督的圣礼之执事
  rationale: 原词本身范围较广，而本段虽提及饮食，却不足以证明仅指某项礼仪；保留原有神学张力。
- issue: “使众人满意”与讨好人的张力
  choice: 直译其普遍性要求，并以脚注说明语义
  alternative: 在各方面服事众人
  rationale: 原文确用“使……满意/蒙悦纳”一类动词；直接改成“服事”会消除文本中对执事公共品行的强烈要求。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡事都不要离开主教而自行其是”传达“不要在主教以外做任何事”的群体秩序含义，避免机械直译造成空间意义误解。全文依据可核对的中篇希腊文本措辞拟订，并参考所给公共领域英译；鉴于项目元数据注明希腊文审校尚待完成，出版前仍宜按指定底本逐词复核标点、异文与段落编号。
