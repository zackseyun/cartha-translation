review_pass:
  verdict: revise
  source_fidelity: 首段“因信他的死”将英语见证的 believing on/in his death 恰当地译出；“逃脱死亡”忠实。第二段“不要离开主教而自行其是”是对“without the bishop”的自然解释，但略增“自行其是”的贬义，宜更直接译为“不要做任何不经主教的事”。“如同顺服……使徒”的原句结构应直接保留，不宜用破折号插入同位解释而使修饰关系迟滞。末段“deacons of meats and drinks”不是“他们所服事的并不是饮食”，而是说他们并非饮食的执事；应保留与“奥秘之执事”相对应的职分表达。“as of fire”意为像躲避火一样躲避责难/指控，草稿“像防火一样”误解了比较结构。
  naturalness: 整体庄重清晰；但“按人的方式生活／按耶稣基督的方式生活”略显重复和生硬，“不是照着人而活，而是照着……而活”更自然且贴近文本。“被发现是在他里面”可保留其被动与终末审验色彩，但“也必显明是在他里面”在现代汉语中更顺畅。
  terminology: “主教”“长老团”“执事”“奥秘”均适合此段历史与教会职分语境。“上帝的教会”可保留。将“可受指控之事”改为“责难/指控”可更准确对应末句所要躲避的对象，并避免把名词短语不必要地实体化。
  issues:
  - severity: high
    issue: “像防火一样，防备一切可受指控之事”误译 as of fire。
    rationale: 英语见证为“beware of blame as of fire”，比较对象是火：应为“要像躲避火一样躲避责难（或指控）”，而非“像防火一样”。
  - severity: medium
    issue: “他们所服事的并不是饮食”弱化并改变“not deacons of meats and drinks”的职分对照。
    rationale: 原文/英译将“奥秘的执事”与“饮食的执事”作名词性对比；宜译作“他们不是饮食和酒的执事，而是上帝教会的仆役/执事”。
  - severity: low
    issue: “凡事都不要离开主教而自行其是”增添了原文未明说的负面语气。
    rationale: “without the bishop”可自然译为“不经主教”或“离开主教”，但“自行其是”含较强责备意味；改为较中性的表达更稳妥。
  revised_text: '因为你们顺服主教，如同顺服耶稣基督，我就看出你们不是照着人而活，而是照着那位为我们而死的耶稣基督而活；你们信他的死，就可以逃脱死亡。


    因此，正如你们一向所行的，你们必须不要做任何不经主教的事；也要顺服长老团，如同顺服耶稣基督——我们所盼望的——的使徒。因为我们若在他里面活着，也必显明是在他里面。[a]


    同样，那些作耶稣基督奥秘之执事的人，必须在各方面使众人满意。[b]他们不是饮食和酒的执事，而是上帝教会的仆役。因此，他们理当像躲避火一样躲避责难。[c]'
  revised_footnotes:
  - marker: a
    text: “显明是在他里面”直译可作“被发现是在他里面”。此被动表达可能带有最终受察验时被认定或显明的意味。
    reason: 保留 εὑρεθησόμεθα 的被动表达及其可能的末世性含义。
  - marker: b
    text: “使众人满意”不是说要无原则地讨好人，而是要求执事在各方面有使众人认可的表现。
    reason: 说明 ἀρέσκειν 的通常语义，同时避免中文读者误读为迎合众人。
  - marker: c
    text: “责难”原文也可译作“指控”或“罪名”。这里可能兼指应避免过错，也应避免给人留下合理指控的把柄。
    reason: 原词 τὰ ἐγκλήματα 在此存在客观过错与所受指控之间的语义歧义；“像躲避火一样”对应比较语。
  revision_rationale: 修正末句对“as of fire”的关键误解，并恢复“饮食和酒的执事”与“上帝教会的仆役”之间的职分性对照。其余调整使语序更贴近英语见证及所述希腊语语义，同时维持原段对主教、长老团、执事的历史性称谓和不具体化的“奥秘”。
