review_pass:
  verdict: revise
  source_fidelity: 首段“按人的方式／按耶稣基督的方式生活”弱化了原文对照的简洁表达，宜译为“不再照着人而活，乃是照着……而活”。第二段“凡事都不要离开主教而自行其是”是合理释义，但加入“自行其是”略带贬义，原文只说不可“没有主教”而行事。末句“像防火一样，防备”误解了“如同防备火”这一比较结构，需更正。
  naturalness: 整体庄重、通顺，职分术语一致。修订后以“没有主教就不要做任何事”更贴近原意且自然；“要像防备火一样防备受指控”也恢复中文的正常句法。
  terminology: “主教”“长老团”“执事”“奥秘”均适合本段历史与教会秩序语境。“上帝的教会”可保留。将“使众人满意”保留为直译，并注释其语义，处理妥当。
  issues:
  - severity: medium
    issue: 末句将“ὡς πῦρ”译作“像防火一样”。
    rationale: 原意是“要像防备火那样防备指控／罪名”，不是把“防火”当作方式或对象；现译造成明显语义与句法偏差。
  - severity: low
    issue: “凡事都不要离开主教而自行其是”加入“自行其是”。
    rationale: 该说法含有擅断、任性的贬义，而原文主要要求信徒不在主教之外采取行动；应避免额外评价。
  - severity: low
    issue: “按人的方式生活／按耶稣基督的方式生活”较为解释性。
    rationale: 原文的“照着人／照着耶稣基督而活”是简洁的伦理—归属对比；修订可更直接保留该表达。
  revised_text: '因为你们顺服主教，如同顺服耶稣基督，我就看出你们不再照着人而活，乃是照着那位为我们而死的耶稣基督而活，使你们因信他的死，可以逃脱死亡。


    所以，照你们一向的做法，你们必须没有主教就不要做任何事；也要顺服长老团，如同顺服耶稣基督——我们所盼望的那一位——的使徒。因为我们若在他里面生活，也必被发现是在他里面。[a]


    同样，那些作耶稣基督奥秘之执事的人，必须在各方面使众人满意。[b]因为他们不是饮食的执事，而是上帝教会的仆人。因此，他们理当像防备火一样，防备一切可受指控之事。[c]'
