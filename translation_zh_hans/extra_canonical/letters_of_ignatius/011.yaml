base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/011.yaml
  text: 'And pray also without ceasing for the rest of humanity, for there is in them a hope of repentance, that they may find God. Therefore, permit them to learn at least from your works.


    Against their outbursts of anger, be meek; against their proud words, be humble; against their insults, set your prayers; against their errors, be steadfast in the faith; against their fierceness, be gentle. And do not be zealous to imitate them by requital.


    Let us show ourselves to be their brothers by our forbearance; but let us be zealous to be imitators of the Lord, competing with one another over who shall suffer the greater wrong, who shall be defrauded, and who shall be set at nothing; that no herb of the devil may be found in you. But in all purity and self-control abide in Christ Jesus, with your flesh and with your spirit.'
translation:
  language: zh_hans
  text: '你们也要为其余的人不断祷告，因为他们还有悔改的希望，好让他们寻见上帝。因此，至少要让他们从你们的行为中学习。


    面对他们暴怒，你们要温柔；面对他们狂傲的话，你们要谦卑；面对他们的辱骂，你们要以祷告回应；面对他们的谬误，你们要在信仰上坚定；面对他们的凶狠，你们要和善。不要热衷于以报还报，仿效他们。


    让我们以忍耐表明自己是他们的弟兄；但我们更要热切效法主，彼此争先，看谁甘愿蒙受更大的冤屈，谁甘愿被人欺骗，谁甘愿受人轻视，好叫你们里面找不到魔鬼的草[a]。你们却要在一切纯洁和节制中，以肉身和心灵常住在基督耶稣里。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “魔鬼的草”保留植物隐喻，指不应让任何属魔鬼的恶在你们里面生根滋长。
    reason: 该表达若不说明，在现代汉语中较为突兀；注释帮助读者把握隐喻，同时正文保留其原有形象。
lexical_decisions:
- source_word: rest of mankind
  choice: 其余的人
  rationale: 自然表达作者所指的信徒群体以外之人，同时避免把范围擅自限定为某一宗教或社会群体。
- source_word: find God
  choice: 寻见上帝
  rationale: 保留“寻找并遇见”的动态含义，也维持庄重的宗教语体。
- source_word: works
  choice: 行为
  rationale: 此处指可供旁人观察和效法的实际生活表现；“行为”比“工作”准确。
- source_word: requital
  choice: 以报还报
  rationale: 表达以同类敌意回敬对方的意思，并与前文一连串非报复性的回应形成对照。
- source_word: forbearance
  choice: 忍耐
  rationale: 涵盖遭受冒犯时克制、宽容而不报复的含义，且符合现代汉语教会外读者也能理解的用语。
- source_word: be set at nought
  choice: 受人轻视
  rationale: 传达被视为无足轻重、遭人藐视的含义，不强化为更具体的迫害情境。
- source_word: herb of the devil
  choice: 魔鬼的草
  rationale: 保留原见证文本中的植物隐喻，不擅自解释为某一种罪或教义。
- source_word: temperance
  choice: 节制
  rationale: 表达自我约束和审慎克制；与“纯洁”并列时简洁、自然。
- source_word: abide
  choice: 常住
  rationale: 保留持续留在基督里的关系性和延续性，避免弱化为短暂状态。
- source_word: with your flesh and with your spirit
  choice: 以肉身和心灵
  rationale: 保留身体与内在生命并举的整体性表达；“心灵”在现代汉语中比单用“灵”更易懂，同时不把二者解释成彼此对立。
theological_decisions:
- issue: “他们还有悔改的希望”所表达的可能性
  choice: 保留希望与目的表达，不写成他们必然悔改或必然得救
  alternative: 译为“他们必会悔改并找到上帝”
  rationale: 见证文本只说存在悔改的希望，并以“好让”表达祷告的目的；不应把盼望改成确定结果。
- issue: “以忍耐表明自己是他们的弟兄”中的弟兄关系
  choice: 直译为关系性的伦理宣告
  alternative: 解释为对方已经属于基督徒共同体，或仅译作“像弟兄一样待他们”
  rationale: 原句在身份宣告与待人方式之间保有张力；译文不替作者限定其教会论含义。
- issue: 争先承受冤屈、欺骗和轻视
  choice: 以“甘愿”表明不报复地承受，而非主动追求伤害
  alternative: 直写成“谁要受到更多伤害”或解释为必须寻求受苦
  rationale: 上下文强调效法主、忍耐和不以恶报恶；“甘愿”既保持劝勉的尖锐性，也避免误解为鼓励制造或寻求虐待。
- issue: 肉身与心灵都住在基督里
  choice: 保留二者并列，不建立二元对立
  alternative: 将“肉身”解释为罪性，或把“心灵”限定为特定人论术语
  rationale: 文本强调全人的纯洁、节制和在基督里的生活；现有英文见证不足以支持更专门的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体，并保留连续排比的修辞力量。当前所给材料明确说明希腊文直接校勘尚待完成，因此本稿以公共领域英文见证及经审核的英文桥接文本为依据，不对可能依赖希腊词形或句法的细节作过度确定的处理。
