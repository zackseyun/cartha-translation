base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/048.yaml
  text: 'Therefore, be deaf whenever anyone speaks to you apart from Jesus Christ. He was of the family line of David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died in the sight of those in heaven, those on earth, and those under the earth.


    Moreover, he was truly raised from the dead, for his Father raised him. In the same way, his Father will also raise us who believe in him—his Father, I say, will raise us—in Christ Jesus, apart from whom we do not have true life.'
translation:
  language: zh_hans
  text: '所以，无论谁向你们传讲离开耶稣基督的道理，你们都要充耳不闻。耶稣基督出于大卫的后裔，是马利亚的儿子；他确实出生，也吃过、喝过；他确实在本丢·彼拉多执政时受迫害；他确实被钉十字架，并且死了，天上的、地上的和地底下的都亲眼见证了这一切。


    不但如此，他也确实从死人中复活了，是他的父使他复活的。同样，他的父也必在基督耶稣里，使我们这些信他的人复活——我再说，是他的父必使我们复活。离开基督耶稣，我们就没有真正的生命。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κωφώθητε（据中篇希腊传统通常所见；尚待直接核校）
  choice: 充耳不闻
  rationale: 保留“成为聋子”的强烈修辞，又符合现代汉语习惯，表达对偏离基督之教导的拒绝。
- source_word: χωρὶς Ἰησοῦ Χριστοῦ（据通常希腊文本；尚待直接核校）
  choice: 离开耶稣基督
  rationale: “χωρίς”可表示“没有、在……之外、与……分离”；译作“离开”保留关系与内容上的排除意味，不擅自限定为某一种异端主张。
- source_word: ἐκ γένους Δαυίδ（据通常希腊文本；尚待直接核校）
  choice: 出于大卫的后裔
  rationale: 自然表达血统来源，同时贴近早期基督教的传统称谓。
- source_word: ἀληθῶς
  choice: 确实
  rationale: 原段反复以该词强调耶稣出生、受难、死亡和复活的真实性；中文重复保留其反幻影论式的修辞力度。
- source_word: ὑπὸ Ποντίου Πιλάτου（据通常希腊文本；尚待直接核校）
  choice: 在本丢·彼拉多执政时
  rationale: 英语见证作“under Pontius Pilate”，可能兼有其权下或任内之意；此译采用自然的历史时间表达，但不把彼拉多直接说成迫害行为的唯一施事者。
- source_word: ἐπουρανίων, ἐπιγείων, ὑποχθονίων（据通常希腊文本；尚待直接核校）
  choice: 天上的、地上的和地底下的
  rationale: 保留三重宇宙范围及其可能指向的存在者，不进一步解释为天使、人或死人。
- source_word: ἀνέστη / ἐγείραντος（据通常希腊文本；尚待直接核校）
  choice: 复活／使……复活
  rationale: 在中文中区分基督“复活”与父“使他复活”，保留原文主动与使动之间的神学关系。
- source_word: ἀληθινὸν ζῆν（据通常希腊文本；尚待直接核校）
  choice: 真正的生命
  rationale: 以名词结构呈现自然汉语，并保留“真实地活着／真正生命”的语义张力。
theological_decisions:
- issue: 基督肉身经历的真实性
  choice: 四次重复“确实”，明确保留真实出生、饮食、受迫害、被钉、死亡与复活
  alternative: 为行文简洁而减少重复，或译成“看似、仿佛”
  rationale: 重复是本段核心论证手段，削弱它会淡化作者对基督真实肉身与受难的强调。
- issue: 复活的施事者
  choice: 明确译为“他的父使他复活”，并保留随后对信徒复活的同一施事者
  alternative: 笼统译作“他复活了，我们也会复活”
  rationale: 原文同时陈述基督真实复活与父使其复活，不应省去父的行动。
- issue: “在基督耶稣里”的句法归属
  choice: 将其连接到父使信徒复活：“必在基督耶稣里，使……复活”
  alternative: 连接到“信他的人”，或把它视为结尾“离开他”的前置成分
  rationale: 见证文本的标点倾向于前一连接，但希腊语序可能容许一定句法张力；正文采用最通顺且传统上常见的理解，不额外扩展为具体复活机制。
- issue: “天上、地上、地底下”所指对象
  choice: 保持泛称，不指定为天使、活人和死者
  alternative: 解释性译为“天使、世人和阴间的死人”
  rationale: 原表达具有宇宙性和修辞性，具体身份并未由所给证据确定。
- issue: “离开基督”与真正生命
  choice: 译为“离开基督耶稣，我们就没有真正的生命”
  alternative: 译为“在他以外没有永生”
  rationale: 不把“真正的生命”自动等同并缩窄为后世术语化的“永生”，保留作者原有措辞。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“充耳不闻”保留开头命令的强度；连续使用“确实”重现原段有意的反复。因用户注明希腊文直接核校尚待完成，本稿以所给公共领域英语见证和可识别的中篇希腊传统措辞为依据，避免对未核实异文设置脚注。
