review_pass:
  verdict: revise
  source_fidelity: 开头“传讲……道理”将“有人向你们说话，离开/不涉及耶稣基督”的宽泛表述收窄为特定的教导内容；“天上的、地上的和地底下的都亲眼见证了这一切”则把“在……眼前/当……观看时”扩展为明确的见证行为，并增添“这一切”。此外，“出于大卫的后裔”在汉语中易被理解为出自大卫的后代，表达不够准确；应明确为出于大卫的家系。其余核心内容，包括反复的真实性强调、父使基督复活及使信徒复活、以及“真正的生命”，基本忠实于所供见证及通常所见希腊措辞。
  naturalness: 整体庄重流畅，适合早期基督教书信的劝诫语体。修订后以“若有人……向你们说话”避免不必要的“传讲道理”，并用“在……众目之下”自然保留原句的观看场景而不强化为正式作证。
  terminology: “本丢·彼拉多”“基督耶稣”“复活”“真正的生命”均恰当。“大卫的家系”比“大卫的后裔”更准确地表达血统归属；“受逼迫”保留受动及“在本丢·彼拉多治下”的历史框架，不断定彼拉多是唯一行动者。
  issues:
  - severity: medium
    issue: 开头将“离开耶稣基督而说话”译为“传讲离开耶稣基督的道理”。
    rationale: “传讲”和“道理”均非所供见证的明示内容，且把宽泛的说话对象限缩为教义性宣讲。
  - severity: medium
    issue: “天上的、地上的和地底下的都亲眼见证了这一切”强化了观看者的行动。
    rationale: 来源仅表明钉十字架和死亡发生在这些存在者观看之下；“见证了这一切”及“这一切”额外引入正式见证和更广事件范围。
  - severity: low
    issue: “出于大卫的后裔”指代关系不够准确。
    rationale: 原意是基督属于大卫的家系/族系；该措辞在现代汉语中可能被读作“出自大卫的后代”。
  revised_text: '所以，若有人离开耶稣基督向你们说话，你们就要充耳不闻。耶稣基督出于大卫的家系，是马利亚的儿子；他确实出生，也吃过、喝过；他确实在本丢·彼拉多治下受逼迫；他确实被钉十字架，也死了，是在天上的、地上的和地底下的众目之下发生的。


    不但如此，他也确实从死人中复活了，是他的父使他复活的。同样，他的父也必在基督耶稣里，使我们这些信他的人复活——我再说，是他的父必使我们复活。离开基督耶稣，我们就没有真正的生命。'
  revised_footnotes: []
  revision_rationale: 修订仅消除原稿中对说话性质和观看行为的增补，并校正大卫家系的汉语表达；保留原段的重复强调、三重宇宙范围、父作为复活施事者，以及“在基督耶稣里”的句法处理。未设脚注：所供材料未显示需要标注的异文或结构性脚注锚点。
