review_pass:
  verdict: revise
  source_fidelity: 开头的命令、基督出自大卫家系和马利亚、其真实出生、饮食、在本丢·彼拉多任内受迫害、被钉、死亡、复活，以及父使信徒复活的主要内容均已保留。可是“天上的、地上的和地底下的都亲眼见证了这一切”将“被他们看见／在他们眼前”误改为这些存在者主动“亲眼见证”，改变了原句的语态和意义。
  naturalness: 整体庄重流畅，适合现代标准汉语。“出于大卫的后裔”搭配不够自然，且可被理解为“出自大卫的后代”；改为“出自大卫的家系”更清楚。将“传讲离开耶稣基督的道理”改为“讲论撇开耶稣基督的事”，可避免无根据地补入“道理”这一限定。
  terminology: “确实”的重复恰当保留了原文的强调；“本丢·彼拉多”“基督耶稣”“真正的生命”均可接受。保留“天上的、地上的和地底下的”这一不作解释的三重范围。
  issues:
  - severity: high
    issue: “亲眼见证了这一切”误译了“被看见／在……眼前”。
    rationale: 原文及英语见证表达的是基督被天上、地上和地底下的存在者看见，并未说这些存在者主动为事件作见证；“亲眼见证”增加了主动见证和“这一切”的含义。
  - severity: medium
    issue: “出于大卫的后裔”表达含混且不自然。
    rationale: “大卫的后裔”通常指大卫的后代群体；此处要表达的是基督属于／出自大卫的家系。
  - severity: low
    issue: “传讲离开耶稣基督的道理”补入“道理”。
    rationale: “有人向你们说话，撇开耶稣基督”并未限定为传讲某种“道理”；删去该补充可更贴近原句的开放性。
  revised_text: '所以，若有人向你们讲论撇开耶稣基督的事，你们就要充耳不闻。耶稣基督出自大卫的家系，是马利亚的儿子；他确实出生，也吃过、喝过；他确实在本丢·彼拉多执政时受迫害；他确实被钉十字架并且死了，是被天上的、地上的和地底下的看见的。


    而且，他确实从死人中复活；是他的父使他复活的。照样，他的父也必使我们这些信靠他的人复活——就是说，他的父必在基督耶稣里使我们复活；离了他，我们就没有真正的生命。'
  revised_footnotes: []
  revision_rationale: 修订仅纠正语态和未受原文支持的补充，并改善“出于大卫的后裔”的现代汉语表达。末段保留父是使基督及信徒复活的施事者，并将“在基督耶稣里”维持为与父使信徒复活相连，符合所给英语见证的句法处理；不对其作超出文本的神学阐释。
