    for the divine prophets lived after Christ Jesus. For this cause also they were persecuted, being inspired by His grace to the end that they which are disobedient might be fully persuaded that there is one God who manifested Himself through Jesus Christ His Son, who is His Word that proceeded from silence, who in all things was well-pleasing unto Him that sent Him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/031.yaml
  text: 'Do not be led astray by strange teachings or by ancient fables, which are useless. For if we still live according to Judaism even to this day, we admit that we have not received grace.


    For the divine prophets lived after Christ Jesus. For this reason they were also persecuted, being inspired by his grace, so that those who are disobedient might be fully convinced that there is one God, who manifested himself through Jesus Christ his Son. He is his Word who proceeded from silence and who in every way was well-pleasing to the one who sent him.'
translation:
  language: zh_hans
  text: '不要被怪异的教训或陈旧而无益的神话引入歧途。因为，如果直到今日我们仍按犹太教的方式生活，就等于承认自己还没有领受恩典。


    事实上，属上帝的先知们是照着基督耶稣而生活的。[a] 正因如此，他们也受到迫害；他们受他的恩典感动，为要使那些不顺从的人确信：只有一位上帝；他借着自己的儿子耶稣基督显明了自己。这一位就是他的道，从静默中出来，在一切事上都蒙差他来的那一位喜悦。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照着基督耶稣而生活”也可理解为“以基督耶稣为准则而生活”；这里不是说先知在年代上生活于基督之后。
    reason: 防止汉语读者将“after Christ Jesus”的旧式英语误解为时间顺序，并说明所保留的希腊语关系。
  - marker: b
    text: “从静默中出来”是原文的凝练说法，可能指上帝的道从隐藏进入显明；译文保留其意象，不限定为某一种解释。
    reason: 提示真实的语义与神学开放性，避免正文过度阐释。
lexical_decisions:
- source_word: ἑτεροδοξίαις
  choice: 怪异的教训
  rationale: 表达与所领受信仰不同、使人偏离的教导；避免用后世宗派色彩较强的“异端”。
- source_word: παλαιοῖς μύθοις
  choice: 陈旧而无益的神话
  rationale: 保留“古旧”与“虚构故事”的贬义，同时以“无益”承接上下文的明确评价。
- source_word: κατὰ Ἰουδαϊσμὸν ζῶμεν
  choice: 按犹太教的方式生活
  rationale: 这里指依循犹太教制度或生活方式，并非泛指犹太民族身份；译文避免对族群作笼统评价。
- source_word: κατὰ Χριστὸν Ἰησοῦν ἔζησαν
  choice: 照着基督耶稣而生活
  rationale: 保留κατά可能表示“依照、以……为准则”的关系，不将其改写为单纯的时间先后。
- source_word: ἐμπνεόμενοι ὑπὸ τῆς χάριτος αὐτοῦ
  choice: 受他的恩典感动
  rationale: 自然表达受恩典推动或默感之意，同时不把措辞限定为某一种后世灵感论。
- source_word: λόγος
  choice: 道
  rationale: 在上帝、圣子及显明的语境中采用基督教汉语传统且易懂的“道”，并保留其位格性。
- source_word: ἀπὸ σιγῆς προελθών
  choice: 从静默中出来
  rationale: 近直译以保存这一凝练而可能多义的表述，不擅自解释为永恒生出、道成肉身或上帝先前隐藏的旨意。
theological_decisions:
- issue: 先知“照着基督耶稣而生活”的含义
  choice: 保留“照着”所表达的准则或归属关系
  alternative: 译作“生活在基督耶稣之后”或“预先活出了基督的样式”
  rationale: 原句重点不是年代上的“之后”；译文不强行判定先知与基督关系的具体神学机制。
- issue: “他的恩典”中代词的指向
  choice: 正文保留“他的”，按近邻通常理解为基督的恩典
  alternative: 明译为“上帝的恩典”
  rationale: 保留代词及其潜在指向，不用解释性名词消除原文可能存在的张力。
- issue: 上帝借圣子显明自己
  choice: 译为“他借着自己的儿子耶稣基督显明了自己”
  alternative: 译为“他的儿子耶稣基督显现了他”
  rationale: 保留上帝为自我显明的主体、耶稣基督为媒介的句法关系。
- issue: “从静默中出来”
  choice: 正文保留意象，不作教义化释义
  alternative: 解释为“从父隐秘的旨意中发出”或“在道成肉身时显现”
  rationale: 该短语神学内涵丰富且解释有争议，应保存原有张力。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“怪异的教训”避免后世论战术语；“属上帝的先知”比生硬的“神圣先知”更自然。鉴于所供材料明确注明希腊语复核尚待进行，本稿依据中期修订本传统常见希腊文本线索并参照公共领域英语见证拟定，适合作为待校核的出版草案。
