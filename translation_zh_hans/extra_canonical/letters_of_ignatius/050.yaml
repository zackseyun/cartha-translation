    他们若是父所栽植的，就会显明为十字架的枝子，他们的果子也不会朽坏。借着十字架，他在自己的受难中召唤你们；你们是他的肢体。头不可能没有肢体，因为上帝所应许的是合一，而这合一就是他自己。[a]'
