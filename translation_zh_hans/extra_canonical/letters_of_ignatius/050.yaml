base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/050.yaml
  text: 'Therefore shun those vile offshoots that produce deadly fruit. If anyone tastes it, that person dies at once. For these people are not the Father’s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable—the Cross by which He, through His passion, invites us, being His members. Now a head cannot be found without members, since God promises union, and this union is Himself.'
translation:
  language: zh_hans
  text: '所以，你们要避开那些卑劣的旁枝；它们结出致命的果子，谁若尝了，立刻就会死。因为这些人不是父所栽种的。


    他们若是父所栽种的，就会显明为十字架的枝子，所结的果子也不会朽坏。基督借着十字架、借着自己的受难召我们到他那里，因为我们是他的肢体。头不可能没有肢体，因为上帝所应许的是合一，而这合一就是他自己。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段现据所提供的公版英语见证译出；希腊文原始资料尚待直接核校。末句“这合一就是他自己”也可理解为“他自己就是这合一”。
    reason: 当前材料明确说明尚未完成希腊文复核；脚注既披露文本依据，也保留末句可能的句法表达差异。
lexical_decisions:
- source_word: vile offshoots
  choice: 卑劣的旁枝
  rationale: 保留植物意象及贬义，并与下文“栽种”“枝子”“果子”连贯。
- source_word: deadly fruit
  choice: 致命的果子
  rationale: 直译核心意象，表达吃了便死亡的结果。
- source_word: the Father’s planting
  choice: 父所栽种的
  rationale: 保留“父”这一称谓与栽种隐喻，不改写为抽象的归属表达。
- source_word: branches of the Cross
  choice: 十字架的枝子
  rationale: 保留原文不同寻常的混合意象，不将其解释性改写为教会或信徒。
- source_word: imperishable
  choice: 不会朽坏
  rationale: 既可指果实不腐坏，也承载不灭亡的神学意味。
- source_word: members
  choice: 肢体
  rationale: 与“头”构成身体隐喻，也是现代汉语基督教文献中易懂而庄重的表达。
- source_word: union
  choice: 合一
  rationale: 表达结合为一而不强行限定为某一种制度性或神秘性联合。
theological_decisions:
- issue: “He”与十字架、受难的关系
  choice: 将“他”明确为“基督”，并译作“基督借着十字架、借着自己的受难召我们到他那里”
  alternative: 保持代词：“他借着十字架、借着受难邀请我们”
  rationale: 英语见证中的男性代词显然指向经历受难者；汉语若只用“他”容易与前句的“父”混淆。补出“基督”是为澄清指代，而非增添教义。
- issue: “being His members”的附着关系
  choice: 译为“因为我们是他的肢体”
  alternative: 译为“他既有我们作他的肢体”或将其与“召”直接连接
  rationale: 保留信徒为基督肢体的身体隐喻，同时避免把分词结构的逻辑关系解释得过死。
- issue: “this union is Himself”的含义
  choice: “而这合一就是他自己”
  alternative: “而他自己就是这合一”或“这合一在于他自己”
  rationale: 采用贴近见证文本的表达，保留其强烈且略显奥秘的同一性陈述，不弱化为“由他促成”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。植物意象贯穿“旁枝—果子—栽种—枝子”，身体意象贯穿“头—肢体”。因尚无直接希腊文核校，本稿避免对英语见证中含混的分词关系和末句同一性陈述作过度神学解释。
