review_pass:
  verdict: revise
  source_fidelity: 稿本总体保留了植物、十字架与身体的连贯意象，也正确保留了末句的强同一性表述。不过“基督借着十字架、借着自己的受难召我们到他那里”增添了原英语见证未明说的目的地“到他那里”，并把“being His members”较松散地改作因果说明。宜更贴近“借着十字架，在其受难中，召唤我们这些作他肢体的人”的句法关系。
  naturalness: 原译整体庄重通顺；“旁枝”在现代汉语中略不自然，改为“恶劣的枝芽”可保留植物隐喻且更顺畅。“就会显明为”也可改为“就会看出是”，表达更自然。
  terminology: “父”“十字架”“受难”“肢体”“合一”均合乎现代汉语基督教语境，并未强加教派性解释。为避免无依据地明确为“基督”并增加“到他那里”的方向性，修订中保留与前文“父”可区分的“他”，但不额外释义。
  issues:
  - severity: medium
    issue: “召我们到他那里”超出英语见证的表达。
    rationale: 见证文本仅说他借十字架、在受难中“invites/calls us”，没有“到他那里”的补足语；加入该方向改变了语义的明确程度。
  - severity: medium
    issue: “因为我们是他的肢体”重组了“being His members”的句法关系。
    rationale: 英语见证将“being His members”附于“invites us”，并非明确陈述“召唤”的因果理由；应以同位式或定语式保留其关系。
  - severity: low
    issue: “卑劣的旁枝”不够自然。
    rationale: “offshoots”可译作“枝芽”；“恶劣的枝芽”既保留贬义和植物意象，也较符合现代书面汉语。
  revised_text: '所以，你们要避开那些恶劣的枝芽；它们结出致命的果子，谁若尝了，立刻就死。因为这些人不是父所栽种的。


    他们若是父所栽种的，就会看出是十字架的枝子，所结的果子也不会朽坏。借着十字架，他在自己的受难中召唤我们这些作他肢体的人。头不可能没有肢体，因为上帝所应许的是合一，而这合一就是他自己。[a]'
  revised_footnotes:
