review_pass:
  verdict: revise
  source_fidelity: 草稿大体保留了植物、十字架与身体的连贯意象，也恰当地没有把“十字架的枝子”解释化。不过，“基督借着十字架、借着自己的受难召我们到他那里”加入了见证文本没有明说的目的地“到他那里”，并把原文第二人称复数的劝勉对象转为“我们”。应删除该补入，并在该处保持“你们”及其分词关系的简约表达。直接希腊文核校仍待完成，脚注应继续披露此限度。
  naturalness: “卑劣的旁枝”可懂，但“恶劣的枝蔓”在现代汉语中更自然，并仍保存植物意象。“父所栽种的”可接受；“父所栽植的”更贴近名词性的“栽植/栽种”，且与下文枝子、果子衔接顺畅。
  terminology: “父”“十字架”“受难”“肢体”“合一”均符合庄重的现代汉语基督教语境。应避免用“基督”及“到他那里”重构原句的指向与动作；在本段上下文中“他”足以承接受难者，同时保留见证所呈现的句法浓缩性。
  issues:
  - severity: medium
    issue: 加入“召我们到他那里”
    rationale: 英语见证只说“借着十字架、通过他的受难邀请/召唤我们（作为他的肢体）”，未明确“到他那里”。该补入改变了动词的补足内容。
  - severity: medium
    issue: “你们”改为“我们”
    rationale: 段首及该句所反映的希腊文劝诫对象均为第二人称复数；译文应保持对特拉利亚信徒的直接称呼。
  - severity: low
    issue: 脚注列出“他自己就是这合一”的替代译法
    rationale: 作为译法可能性可以保留，但应明确其用于保留该句高度凝练的表述，而不应暗示可任意倒置为同等语义。
