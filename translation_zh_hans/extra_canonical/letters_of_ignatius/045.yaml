base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/045.yaml
  text: 'Therefore I urge you—yet not I, but the love of Jesus Christ—take only Christian food, and abstain from strange herbage, which is heresy:


    for these people even mingle poison with Jesus Christ, imposing upon others by a show of honesty, like persons administering a deadly drug with honeyed wine, so that one who does not know it, fearing nothing, drinks in death with baneful delight.'
translation:
  language: zh_hans
  text: '所以我劝你们——不是我，而是耶稣基督的爱——只接受基督徒的食物，远避陌生的草；这草就是异端。


    因为这些人把耶稣基督掺入他们自己当中，装作可信；他们好比有人用蜜甜的酒送服致命的药物，使不知情的人毫无戒备地喝下死亡，带着有害的快意。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Christian food
  choice: 基督徒的食物
  rationale: 保留“食物”与下文“草木”的饮食隐喻，同时用现代汉语清楚表达其基督徒身份限定；不擅自解释为某一种特定教义、礼仪或著作。
- source_word: strange herbage
  choice: 异样的草木
  rationale: 保留原文见证中与“食物”相连的植物隐喻。“异样”表达不属于正当食粮的异质性，又避免过度具体化。
- source_word: heresy
  choice: 异端
  rationale: 采用现代汉语基督教传统中通行且简明的对应词；上下文明确把它比作不应取食的草木。
- source_word: mingle poison with Jesus Christ
  choice: 把毒药与耶稣基督混在一起
  rationale: 依照现有英文见证保留强烈而略显突兀的并置，不将其释义性改写为“用基督之名包装毒害”，以免提前消除原有修辞张力。
- source_word: show of honesty
  choice: 一副诚实的外表
  rationale: 表达外表可信、实则欺骗之意，并保留“外观”与真实本质之间的对照。
- source_word: honeyed wine
  choice: 蜜酒
  rationale: 用简洁自然的汉语呈现加蜜或甘甜的酒；与其中所掺的致命药物形成鲜明反差。
- source_word: baneful delight
  choice: 有害的甘美
  rationale: 兼顾愉悦、甘甜与致害两面，使其同时呼应蜜酒的口感和死亡的后果。
theological_decisions:
- issue: “耶稣基督的爱”的属格关系
  choice: 耶稣基督的爱
  alternative: 我对耶稣基督的爱／耶稣基督对你们的爱
  rationale: 现有见证本身容许主观属格或客观属格等理解；直译保留这种神学与修辞上的开放性，不擅自限定爱的施予者或对象。
- issue: “基督徒的食物”是否指特定礼仪或教义内容
  choice: 保留为“基督徒的食物”
  alternative: 圣餐／纯正教义／基督的教训
  rationale: 上下文使用饮食隐喻批评异端，但现有证据不足以将“食物”排他性地认定为某一种礼仪或教义类别。
- issue: “毒药与耶稣基督混在一起”的解释
  choice: 保留原有并置
  alternative: 用耶稣基督的名义掩饰毒害／把关于基督的教导掺入毒素
  rationale: 保留作者对真假混杂的尖锐表达，不把隐喻转换为带有额外神学判断的释义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，并保留食物、草木、毒药和蜜酒构成的连续隐喻。此稿依据所提供的公版英文见证拟定；资料注明希腊文直接校核尚待进行，因此对词序、语义范围及若干修辞细节的判断均属暂定。
