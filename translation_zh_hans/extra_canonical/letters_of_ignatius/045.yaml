revisions:
- from: '所以，我劝你们——其实不是我，而是耶稣基督的爱在劝你们——只取用基督徒的食物，并要远避异样的草木，也就是异端。


    因为这些人竟把毒药与耶稣基督混在一起，又以一副诚实的外表欺骗人；这就像有人把致命的药物掺入蜜酒给人喝，使不知情的人毫无戒心，在有害的甘美中将死亡喝下。'
  to: '所以我劝你们——不是我，而是耶稣基督的爱——只接受基督徒的食物，远避陌生的草；这草就是异端。


    因为这些人把耶稣基督掺入他们自己当中，装作可信；他们好比有人用蜜甜的酒送服致命的药物，使不知情的人毫无戒备地喝下死亡，带着有害的快意。'
  rationale: 本修订以希腊文中期传统的句法和比喻次序为先：保留“耶稣基督的爱”及“基督徒的食物”的解释开放性，保留异端为陌生草的隐喻；但将“耶稣基督”恢复为“掺入他们自己当中”的对象，并将“致命药物”限于随后蜜甜酒的类比。未将食物解释为特定礼仪或教义，也未把掺杂具体化为某一派别的基督论。
