base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/083.yaml
  text: 'Therefore, those who deny the good gift of God perish through their arguments. It would be better for them to have love, so that they too may rise again.


    It is therefore right for you to keep away from such people and not speak about them either privately or publicly. Instead, pay attention to the Prophets, and especially to the Gospel, in which the suffering is shown to us and the resurrection is accomplished.'
translation:
  language: zh_hans
  text: '因此，那些反驳上帝美好恩赐的人，因自己的争辩而灭亡。他们若有爱，倒于他们有益，好使他们也能复起。


    所以，你们应当避开这样的人；无论私下还是公开，都不要谈论他们。你们却要留心众先知，尤其要留心福音；在福音中，主的受难向我们显明，复起也得以成就。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段目前依据公版英语见证起草，尚待希腊文原文复核。“在福音中”可理解为在福音信息、福音传统或福音文本中；“复起得以成就”也可能强调复活事件已经实现，而不只是被记载。
    reason: 资料明确说明源语言审校尚未完成；同时此处“福音”及复活句式存在值得保留的语义空间。
lexical_decisions:
- source_word: gainsay
  choice: 反驳
  rationale: 依现有英译见证表达公开抵拒、否认上帝恩赐之意；“反驳”保留其争辩色彩，又不预先限定具体异端命题。
- source_word: good gift of God
  choice: 上帝美好的恩赐
  rationale: 保留“美好”与“恩赐”两个语义要素，不擅自认定该恩赐专指圣餐、救恩或基督的肉身。
- source_word: questionings / arguments
  choice: 争辩
  rationale: 兼顾质疑、辩难和论争之意，避免“问题”在现代汉语中显得过轻。
- source_word: love
  choice: 爱
  rationale: 直译核心伦理与神学用语，不缩窄为友爱、仁爱或爱宴。
- source_word: rise again
  choice: 复起
  rationale: 保留复活语境，同时避免把此处完全等同于后文明言的“复活”，从而保存措辞上的细微差异。
- source_word: the Prophets
  choice: 众先知
  rationale: 按基督教早期文献语境，既可指先知本人，也可借指先知书；正文保留这种可能性。
- source_word: the Gospel
  choice: 福音
  rationale: 保留单数及其可指福音信息或福音传统/文本的开放性。
- source_word: passion
  choice: 主的受难
  rationale: 现代汉语中“受难”自然准确；补出“主的”以避免读者误解为一般苦难，而上下文所指显然是基督受难。
- source_word: resurrection
  choice: 复起
  rationale: 用“复起”保存早期汉语基督教文献可接受的庄重感，也让“得以成就”的被动/完成意味保持突出。
theological_decisions:
- issue: “上帝美好的恩赐”的具体所指
  choice: 正文不加限定
  alternative: 明确译作圣餐、基督的肉身或救恩
  rationale: 现有段落与英译见证不足以无争议地锁定唯一所指；应保留原文可能具有的语境张力。
- issue: “好使他们也能复起”是末日复活还是属灵悔改
  choice: 采用可兼容复活语境的“复起”
  alternative: 明确译作“从死里复活”或“悔改重生”
  rationale: 后文明确提到复活，但此句也可能带有悔改归正的修辞意味；不宜替作者消除含混。
- issue: “不要谈论他们”的范围
  choice: 按现有见证直译为不要谈论他们
  alternative: 译为不要同他们谈话或不要讨论他们的教训
  rationale: 现有英语见证的代词关系本身可能有解释空间；正文不擅自改定谈话对象或内容。
- issue: 受难与复活的时态和施事
  choice: “受难向我们显明，复起也得以成就”
  alternative: “福音记载了受难和复活”
  rationale: 保留“显明”与“成就”之间的不对称表达，避免把神学性陈述扁平化为单纯的文本记载。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“上帝”符合现代标准汉语；第二人称复数用“你们”。句式尽量保留早期书信的劝诫力度及两段之间“因此/所以”的推论关系。因希腊文审校待完成，本稿避免对关键术语作过度确定的教义化处理。
