review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了段落的论辩与劝诫结构，但“复起”未能稳定、明确地对应此处连续出现的复活语境，且将“the passion”补为“主的受难”超出了现有英语见证的明示措辞。
  naturalness: “他们若有爱，倒于他们有益”及“复起”在现代标准汉语中较生硬。改为“他们若有爱，对他们倒有益处”和“复活”，更自然而仍保持庄重。
  terminology: “上帝”“恩赐”“爱”“众先知”“福音”“受难”“复活”均适合本段早期基督教语境。为保留“福音”单数所可能指向的信息、传统或文本，不作进一步限定。
  issues:
  - severity: medium
    issue: 两处将 rise again / resurrection 译为“复起”。
    rationale: 本段后句明确对应 resurrection，前句又以“也”与之呼应；现代汉语的“复活”既是稳定的对应术语，也不会不当缩窄其所指。相较之下，“复起”不属当前自然、常用的现代标准表达，并可能弱化死亡后复活的语义。
  - severity: low
    issue: “主的受难”加入了英语见证未明说的“主的”。
    rationale: 上下文很可能指基督的受难，但现有审校基准的措辞只是“the passion / suffering”。译作“受难”已能在本段基督教语境中自然传达，且较少添加解释。
  - severity: low
    issue: “他们若有爱，倒于他们有益”语序偏文言且不够自然。
    rationale: 调整为“他们若有爱，对他们倒有益处”保留假设、转折及劝诫力度，也符合现代庄重书面语。
  revised_text: '因此，那些反驳上帝美好恩赐的人，因自己的争辩而灭亡。他们若有爱，对他们倒有益处，好使他们也能复活。


    所以，你们应当避开这样的人；无论私下还是公开，都不要谈论他们。你们却要留心众先知，尤其是福音；在福音中，受难向我们显明，复活也得以成就。[a]'
  revised_footnotes:
