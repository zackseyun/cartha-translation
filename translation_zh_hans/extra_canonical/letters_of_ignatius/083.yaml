review_pass:
  verdict: revise
  source_fidelity: 草稿大体传达了段落的论辩与劝诫，但有几处削弱或不必要地增添了原意：“他们若有爱”没有充分表达原文不定式“去爱／爱人”的劝告；“复起”并非现代标准汉语中自然、明确的 resurrection 对应语，且使前后同一复活概念显得不一致；“主的受难”虽合上下文，原句本身未明说“主”，不宜在正文添入。
  naturalness: 整体庄重通顺，但“倒于他们有益”“复起”略显生硬或带仿古色彩。“私下或公开”“复活已经成就”更符合现代标准汉语，也能保留原句的完成语气。
  terminology: “上帝”“恩赐”“爱”“福音”“受难”“复活”均为适切的现代汉语基督教术语。将两处 resurrection 统一译为“复活”，既忠实又清楚；“众先知”可保留其指先知本人或先知传统／著作的开放性。
  issues:
  - severity: medium
    issue: “他们若有爱”未充分表达“去爱”的动作性。
    rationale: 英语见证的“to have love”以及相应希腊语结构指向爱这一应当实行的行为；“有爱”在汉语中更像一种内在品质。
  - severity: medium
    issue: “复起”不够自然，且不利于辨认两处同属复活语义的对应。
    rationale: 此段后文明确为 resurrection；现代标准汉语通常译为“复活”。“复起”可被理解为重新兴起，弱化死亡—复活的语境。
  - severity: low
    issue: “主的受难”是正文未明载的补足。
    rationale: 上下文当然指基督的受难，但原句只说“受难”；删去“主的”可避免添加，同时不损害上下文理解。
  - severity: low
    issue: 现有脚注称“尚待希腊文原文复核”，却对若干希腊文句式作较具体断言。
    rationale: 宜将脚注限于译文中实际保留的“福音”指涉与完成语气，不作超出当前见证基础的说明。
  revised_text: '因此，那些反对上帝美好恩赐的人，因自己的争辩而灭亡。对他们来说，去爱倒更有益处，好使他们也可以复活。


    所以，你们应当远离这样的人；无论私下还是公开，都不要谈论他们。却要留心众先知，尤其要留心福音；在福音中，受难已向我们显明，复活也已经成就。[a]'
  revised_footnotes:
  - marker: a
    text: 本段依据公版英语见证起草，希腊文原文复核尚待完成。“福音”可指福音信息、福音传统或福音文本；“复活也已经成就”保留原句所呈现的完成语气，而不将其仅译为福音对复活的记载。
    reason: 说明起草依据，并保留“福音”的指涉范围及复活句的完成性，而不增添特定教义解释。
  revision_rationale: 修订以现有英语见证为基础，并按该段通常的希腊文措辞核对关键表达。改“有爱”为“去爱”，使劝告的动作性更明确；两处均译“复活”，以保持术语一致、现代自然且符合语境；删去原句未明说的“主的”。其余保留原稿对“恩赐”“众先知”“福音”指涉范围的审慎处理，以及“显明／成就”的不对称表达。
