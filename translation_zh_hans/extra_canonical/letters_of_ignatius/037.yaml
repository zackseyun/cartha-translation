base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/037.yaml
  text: Knowing that you are full of God, I have encouraged you briefly. Remember me in your prayers, so that I may reach God. Also remember the church in Syria, of which I am not worthy to be called a member. For I need your united prayer and love in God, so that the church in Syria may be granted refreshment by the dew of your fervent prayer.
translation:
  language: zh_hans
  text: 我知道你们里面充满了上帝，所以只简短地劝勉你们。请在祷告中记念我，使我可以到达上帝那里。也请记念叙利亚的教会；我不配称为其中的一员。我需要你们同心的祷告，以及你们在上帝里的爱，好使叙利亚的教会因你们恳切祈求的甘露而得着舒畅。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文暂据所提供的公版英文见证起草；希腊文原文的直接校勘尚待完成。
    reason: 明确当前底本限制，避免将依据英文见证的暂定译法呈现为已经完成希腊文审校的定稿。
lexical_decisions:
- source_word: full of God
  choice: 里面充满了上帝
  rationale: 保留“充满上帝”的强烈属灵表达，并以“里面”使现代汉语更自然，不将其弱化为仅仅“敬虔”。
- source_word: exhorted
  choice: 劝勉
  rationale: “劝勉”兼有劝告与鼓励之意，适合书信中的牧养语气。
- source_word: attain unto God
  choice: 到达上帝那里
  rationale: 保留原见证中朝向上帝、抵达上帝的表达，不提前解释为殉道、死亡或得救。
- source_word: united prayer
  choice: 同心的祷告
  rationale: 自然传达共同一致祈求的含义。
- source_word: refreshed by the dew
  choice: 因……甘露而得着舒畅
  rationale: 保留露水带来滋润、复苏的比喻意象。
- source_word: fervent supplication
  choice: 恳切祈求
  rationale: 体现祈求的热切与迫切，同时保持庄重自然。
theological_decisions:
- issue: “到达上帝那里”的具体含义
  choice: 保留空间性、目标性的表达，不作解释
  alternative: 译作“归到上帝那里”或“最终得着上帝”
  rationale: 此处可能关联作者预期的殉道及与上帝联合，但所供材料尚不足以在正文中限定其神学含义。
- issue: “充满了上帝”的表述强度
  choice: 直译为“里面充满了上帝”
  alternative: 译作“满有上帝的恩典”或“十分敬虔”
  rationale: 原见证的表达具有鲜明神学张力，不宜增添“恩典”等原文见证未明说的限定，也不宜弱化。
- issue: 为叙利亚教会祈求的结果
  choice: 译为“得着舒畅”
  alternative: 译作“复兴”“安息”或“解脱”
  rationale: 保持语义开放，不断定教会所面对的具体处境或所需的特定拯救形式。
translation_notes:
  register: 采用现代、庄重而易懂的书信体；以“你们”“请……记念”传达亲切恳切的劝勉语气。保留“充满了上帝”“到达上帝那里”“甘露”等具有神学或修辞张力的表达。
