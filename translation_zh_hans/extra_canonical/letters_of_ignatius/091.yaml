base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/091.yaml
  text: 'I welcome your godly mind, grounded as though on an immovable rock, and I give exceedingly great glory that I have been granted the privilege of seeing your blameless face,


    of which I long to have joy in God. I urge you in the grace with which you are clothed to press forward in your course and to urge everyone that they may be saved. Vindicate your office with all diligence of flesh and spirit. Be concerned for unity, than which there is nothing better. Bear with everyone, just as the Lord also bears with you. Endure everyone in love, as indeed you do.


    Devote yourself to unceasing prayers. Ask for greater wisdom than you have. Be watchful, and keep your spirit from falling asleep. Speak to each person individually after the manner of God. Bear the illnesses of all, like a perfect athlete. Where there is more toil, there is much gain.'
translation:
  language: zh_hans
  text: '我欣然接纳你在上帝里面的心志；这心志仿佛建立在不可动摇的磐石上。我因蒙允得见你无可指摘的面容，深感荣耀；愿我常常在上帝里面享受见你面之乐。


    我劝你：既已披戴这恩典，就要奋力奔跑你的赛程，也要劝勉众人，使他们得救。你要以一切身体上和属灵上的殷勤，尽好你所处的位置。[a] 务要关心合一，因为没有什么比合一更好。要担当众人，正如主也担当你；要在爱中爱护众人，正如你一向所做的。


    要专心不住地祷告。要祈求比你现有更大的悟性。务要警醒，使你的灵保持不眠。要按着上帝的心意同人说话。要像娴熟的竞技者一样，担当众人的病痛。[b] 劳苦越多，益处也越多。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你所处的位置”直译为“你的位置”；可指受托的岗位、角色或责任，不必限定为正式的制度性职分。
    reason: 保留τόπος的语义范围，避免将其无根据地窄化为特定教会职位。
  - marker: b
    text: “病痛”直译为“疾病”。在此牧养劝勉中可包括人所患的各样病患，但正文保留原文的疾病意象。
    reason: 准确反映νόσοι的基本义，同时不排除其在劝勉语境中的较广应用。
lexical_decisions:
- source_word: godly mind (Greek review pending)
  choice: 敬虔的心志
  rationale: “心志”兼顾思想、意向和判断，不把其范围缩窄为单纯理智；“敬虔”自然表达其以上帝为中心的性质。
- source_word: grounded as it were on an immovable rock
  choice: 仿佛立在不可动摇的磐石上
  rationale: 保留明示的比喻和“仿佛”所表达的修辞限定，同时采用现代汉语的自然搭配。
- source_word: grace with which you are clothed
  choice: 你所披戴的恩典
  rationale: 保留“穿戴”意象，不将恩典抽象改写为能力或资格。
- source_word: Vindicate thine office
  choice: 尽好自己的职分
  rationale: 现有英文见证中的措辞可能包含证明、维护或不负其职位之意；在希腊文复核前，以自然且不过度具体化的“尽好……职分”暂译，并加注说明。
- source_word: union
  choice: 合一
  rationale: 此处指共同体关系中的联合一致；“合一”比“团结”更贴近早期基督教劝勉语境，同时不限定具体制度形式。
- source_word: Bear all men
  choice: 担当众人
  rationale: 保留承受、扶持他人的重量感，并与主担当收信者的平行结构相呼应。
- source_word: Suffer all men in love
  choice: 在爱中容忍众人
  rationale: 按古英语 suffer 的“忍受、容纳”义处理，避免误译为使众人受苦。
- source_word: maladies
  choice: 软弱
  rationale: 语境可能涵盖身体、性情或属灵方面的病弱；“软弱”避免无根据地只限定为生理疾病，脚注保留可能范围。
- source_word: perfect athlete
  choice: 成熟的竞技者
  rationale: “perfect”在此更可能表示完备、受过充分操练；“成熟”比现代汉语中的“完美”更自然，也避免绝对无瑕之意。
theological_decisions:
- issue: “得救”的施事与人的劝勉之间的关系
  choice: 劝勉众人，使他们可以得救
  alternative: 拯救众人
  rationale: 保留“劝勉”与“可以得救”的语法区分，不把收信者写成救恩的最终施行者，也不额外规定得救过程。
- issue: 主“担当”人的含义
  choice: 正如主也担当你
  alternative: 正如主也宽容你／扶持你
  rationale: 沿用同一动词以保存原有平行与神学张力，不擅自限定为赦免、宽容或能力扶持中的某一种。
- issue: “灵”是否专指圣灵
  choice: 你的灵
  alternative: 圣灵
  rationale: 英文见证明确为“your spirit”；不将人的灵改释为圣灵。
- issue: “按着上帝的方式”所指为何
  choice: 按着上帝的方式
  alternative: 以适合上帝仆人的方式／照上帝对待人的方式
  rationale: 保留表达的开放性，不将其具体化为某种牧养方法或神学体系。
translation_notes:
  register: 采用现代、庄重而易懂的书信劝勉体，以“你”对应单数收信者，以“众人”表达普遍对象。保留了磐石、披戴、路程、担当和竞技者等核心意象。段落依内容逻辑整理；供应材料注明希腊文直接审校尚未完成，因此对“职分”等关键处作审慎暂译并设置脚注，不声称已完成原文定本复核。
