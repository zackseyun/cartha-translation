base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/024.yaml
  text: 'When I learned of the exceeding good order of your love in the ways of God, I was gladdened and determined to address you in the faith of Jesus Christ.


    For, being counted worthy to bear a most godly name in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ’s, our never-failing life—and union of faith and of love, which is preferred before all things, and—what is more than all—union with Jesus and with the Father, in whom, if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
translation:
  language: zh_hans
  text: '我得知你们的爱按着神有极好的秩序，便十分欢喜，决意在对耶稣基督的信心中写信给你们。


    我带着这些锁链，蒙算为配得承受一个至为神圣的名[a]，就歌颂众教会；我祈求众教会有耶稣基督的肉身和灵的合一；他是我们永不衰竭的生命。又愿众教会有信与爱的合一——信与爱比一切都更为可贵；更胜过这一切的，是与耶稣和父合而为一。我们若在他们里面耐心忍受这世代的执政者的一切凌辱，并得以逃脱，就必到达神那里。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个至为神圣的名”具体指什么，原文并未明说；可能涉及基督之名、基督徒之名，或作者因信仰所承受的称号。译文不预先限定其所指。
    reason: 保留该称谓在文本中的真实歧义，避免补入特定教义性解释。
lexical_decisions:
- source_word: exceeding good order
  choice: 极其井然有序
  rationale: 保留“秩序良好”的核心意象，同时使现代汉语自然；不将其弱化为一般性的“美好表现”。
- source_word: in the ways of God
  choice: 在神的道路上
  rationale: 保留“道路”的圣经式隐喻及其行为、生活方式层面的开放性。
- source_word: address you
  choice: 写信给你们
  rationale: 在书信语境中以自然现代汉语表达“向你们致辞/讲话”。
- source_word: bear a most godly name
  choice: 承载一个最属神的名
  rationale: 原见证没有明确指出该“名”究竟指基督徒之名、基督之名或其他称号，因此采用较直译且保留歧义的表达。
- source_word: which I carry about
  choice: 如今随身带着的
  rationale: 表达锁链被作者带在身上的具体形象，避免仅译成抽象的“被囚”。
- source_word: union
  choice: 合而为一
  rationale: 兼顾“联合”与群体一致的含义，并在连续结构中维持修辞统一。
- source_word: never-failing life
  choice: 永不止息的生命
  rationale: 传达不会衰竭、不会中断的生命；不额外解释为特定末世论术语。
- source_word: the prince of this world
  choice: 这世界之王
  rationale: 保留早期基督教与约翰传统中的称谓，不直接以解释性的“魔鬼”替换。
- source_word: attain unto God
  choice: 达到神那里
  rationale: 保留朝向神并最终抵达的动态意味，避免预先界定为得救、殉道或死后升天。
theological_decisions:
- issue: “肉身与灵都属于耶稣基督”的句法关系
  choice: 将“属于耶稣基督”同时关联于肉身和灵
  alternative: 理解为教会在肉身和灵里的联合，而这种联合本身属于耶稣基督
  rationale: 依据所供见证的关系从句，最直接的读法是二者皆为基督所有；但句法可能存在张力，正文尽量不作扩展性阐释。
- issue: “在他们里面”的指代
  choice: 按复数理解为耶稣与父
  alternative: 将其概括译作“在神里面”或按单数指父
  rationale: 所供见证使用关系代词“in whom”，先行项为“Jesus and the Father”；采用复数代词保留这一关联，不过希腊文复核仍属必要。
- issue: “最属神的名”的具体所指
  choice: 不明确指认
  alternative: 译作“基督徒这个尊贵的名”或“耶稣基督的名”
  rationale: 所供材料不足以排除不同理解，明确补入所指会消除原有歧义。
- issue: “达到神那里”的救恩含义
  choice: 保留空间性、终向性的表述
  alternative: 译作“得着神”“与神同在”或“归到神那里”
  rationale: 避免将殉道、终末得救或灵性联合中的任何一种解释固定为唯一含义。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留早期基督教书信中“神的道路”“这世界之王”“合而为一”等带有圣经回声的表达，同时避免过度古雅。长句按原文层层递进的祈愿结构处理，以破折号和分号帮助普通读者把握逻辑。
