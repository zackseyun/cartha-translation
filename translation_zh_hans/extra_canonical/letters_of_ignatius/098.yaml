    issue: 亲属关系误译
    rationale: “她儿女的家人”把英文见证中指向该妻子的“her children’s”（排印符号异常）改成了其儿女的家庭，改变了问安对象。
  - severity: medium
    issue: 单复数称呼不一致
    rationale: 本段直接受命写信和“this is worthy of thee”的对象均为单数；“这样，你们就会……得荣耀”不必要地改成复数。
  - severity: low
    issue: 加入“善举”的评价
    rationale: “ever memorable deed”是值得永远纪念的行动；“善举”虽可能合乎语境，却增加了原见证未明说的道德定性。
  - severity: low
    issue: 脚注a制造不必要的不确定性
    rationale: 脚注基于误译而设；修正为“她的儿女”后，无须保留该脚注。
