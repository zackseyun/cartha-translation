base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/098.yaml
  text: 'Since I have been unable to write to all the churches because I sailed suddenly from Troas to Neapolis, as the divine will commands, you shall write to the churches ahead, as one who possesses the mind of God, so that they too may do this same thing: let those who are able send messengers, and let the rest send letters with the people you send, so that you may be glorified by an ever-memorable deed—for this is worthy of you.


    I greet everyone by name, especially the wife of Epitropus, together with her entire household and those of her children. I greet my beloved Attalus. I greet the one who will be appointed to go to Syria. Grace will always be with him, and with Polycarp, who sends him.


    I always bid you farewell in our God Jesus Christ. Remain in him, in the unity and supervision of God. I greet Alce, a name very dear to me. Farewell in the Lord.'
translation:
  language: zh_hans
  text: '我因照上帝的旨意，突然从特罗亚乘船前往尼亚波利，未能写信给所有教会。因此，你既领会上帝的心意，就要写信给前方的各教会，好让他们也做同样的事：有能力的，应当派遣使者；其余的，应当托你所差派的人带去书信。这样，你就会因一件永远值得纪念的行动而得荣耀——这事原与你相称。


    我逐一问候众人，尤其问候以彼特罗普的妻子、她全家和她的儿女。我问候我所爱的亚他鲁。我问候那位将被委派前往叙利亚的人。愿恩典常与他同在，也与差遣他的坡旅甲同在。


    我常在我们的上帝耶稣基督里向你们道别。你们要住在他里面，持守上帝的合一和看顾。我问候阿尔刻；这个名字令我十分珍爱。愿你们在主里平安。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the Divine will
  choice: 上帝的旨意
  rationale: 用现代汉语中自然、庄重的表达传达神圣意旨，不将其具体化为额外的启示方式。
- source_word: churches in front
  choice: 前面的各教会
  rationale: 保留这些教会位于行程前方的空间含义，避免擅自改成更具体的地理称谓。
- source_word: possessing the mind of God
  choice: 有上帝的心意
  rationale: 既传达与上帝心意相合的意思，也保留原表述的强度，不解释为某种正式职权。
- source_word: messengers
  choice: 使者
  rationale: 可指亲自代表教会前往的人，与下文托人携带书信形成区别。
- source_word: supervision of God
  choice: 上帝的监督
  rationale: 保留见证文本中较为生硬且可能具有神学张力的措辞，不以‘治理’‘主教职分’等解释性术语替换。
- source_word: Fare ye well
  choice: 愿你们……平安
  rationale: 采用现代中文书信结语，同时保留祝愿语气。
theological_decisions:
- issue: “our God Jesus Christ”的基督论称谓
  choice: 我们的上帝耶稣基督
  alternative: 我们的上帝和耶稣基督
  rationale: 见证文本将‘上帝’直接用于耶稣基督；不添加‘和’来拆分称谓，以免削弱原文的基督论表达。
- issue: “unity and supervision of God”的关系
  choice: 上帝所赐的合一，并在上帝的监督之下
  alternative: 上帝的合一和监督
  rationale: 中文略作句法展开以便理解，但不把‘监督’解释为特定教会职位或制度。
- issue: “you may be glorified”的主体
  choice: 你们就会……得荣耀
  alternative: 你就会……得荣耀
  rationale: 英文见证在上下文中由单数受信人转为复数；保留复数所指的群体维度，不强行统一。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。因直接希腊文审查尚未完成，本稿以所提供的公版英文见证为起草依据，并参考英文POB作为校核层；对亲属关系及“监督”等不确定措辞以脚注保留歧义。人名按常见音译原则处理：特罗亚、尼亚波利、以彼特罗普、亚他鲁、坡旅甲、阿尔刻。
