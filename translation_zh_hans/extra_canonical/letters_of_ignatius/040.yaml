base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/040.yaml
  text: 'I have learned that you have a blameless mind and are steadfast in patience, not from habit but by nature, just as Polybius your bishop informed me. By the will of God and Jesus Christ, he visited me in Smyrna, and he rejoiced so greatly with me in my chains in Christ Jesus that in him I saw the whole multitude of you.


    Therefore, having received your godly goodwill through him, I gave glory, because I had found you to be imitators of God, just as I had learned.'
translation:
  language: zh_hans
  text: '我得知，你们心志无可指责，在忍耐中坚定不移；这不是出于习惯，而是你们本性如此。你们的监督波利比乌就是这样告诉我的。他按着上帝和耶稣基督的旨意，到士每拿来看望我；他因我在基督耶稣里的锁链，与我一同欢喜，喜乐之深，使我在他身上看见了你们全体。


    因此，我借着他领受了你们敬虔的善意，便将荣耀归给上帝，因为我发现你们果然效法上帝，正如我先前所听见的。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mind
  choice: 心志
  rationale: 比“思想”更能涵盖群体的内在品格、态度与意向，同时保留见证文本的宽泛含义。
- source_word: steadfast in patience
  choice: 在忍耐中坚定不移
  rationale: 兼顾“忍耐”的持续承受与“坚定”的稳固性，不把它缩减为一般耐心。
- source_word: bishop
  choice: 监督
  rationale: 采用贴近早期基督教职分词 episkopos 基本含义的现代汉语表达，避免把后期制度形态直接投射到文本中。
- source_word: bonds / chains
  choice: 锁链
  rationale: 具体呈现作者受囚禁的处境，也保留“在基督耶稣里”赋予苦难的信仰关联。
- source_word: godly benevolence / goodwill
  choice: 敬虔的善意
  rationale: 保留该善意与敬神生活的关联，同时避免译成较抽象或制度化的“慈善”。
- source_word: imitators of God
  choice: 效法上帝
  rationale: “效法”自然且准确地表达以神为榜样的实践含义。
theological_decisions:
- issue: “按着上帝和耶稣基督的旨意”的修饰关系
  choice: 将其与波利比乌前来探望相连
  alternative: 将其理解为波利比乌担任监督或整个事件均出于这一旨意
  rationale: 所给见证文本在句法上最直接地把该短语连接到“到士每拿来看望我”；译文不进一步界定上帝与耶稣基督之旨意的关系。
- issue: “在基督耶稣里的锁链”
  choice: 保留属灵归属与实际囚禁并置的表达
  alternative: 释义为“因信基督耶稣而被囚”
  rationale: 原表达可能同时涉及受囚原因、与基督联合及服事身份；直译可保留其神学张力。
- issue: “效法上帝”
  choice: 直接保留
  alternative: 弱化为“遵行上帝的旨意”
  rationale: 见证文本明确使用“imitators”，不应以较安全但较弱的伦理表述取代。
- issue: “不是出于习惯，而是本性如此”
  choice: 保留习惯与本性的鲜明对比
  alternative: 释义为“并非勉强养成，而是发自内心”
  rationale: 该对比可能带有修辞性赞誉，也可能提出品格来源的问题；译文不替作者化解这种张力。
translation_notes:
  register: 采用现代、庄重而可读的书信体。“你们”保持群体复数语境；“全体”自然传达 whole multitude。由于尚未完成希腊文直接复核，本稿以所给公版英文见证为基础，避免添加该见证未明确表达的内容。
