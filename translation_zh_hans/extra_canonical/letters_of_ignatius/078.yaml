base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/078.yaml
  text: For he suffered all these things for our sake [so that we might be saved]. He truly suffered, just as he truly raised himself. It was not as certain unbelievers say—that he suffered only in appearance, while they themselves are mere appearances. What they believe will also happen to them, for they are bodiless and demon-like.
translation:
  language: zh_hans
  text: 因为他为我们的缘故受了这一切苦，[a]并且他确实受了苦，正如他也确实使自己复起一样。事情并不像某些不信的人所说的那样——他只是在表象上受苦；其实他们自己才不过是表象。他们怎样相信，也必怎样遭遇，因为他们是没有身体、如同鬼魔的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些见证在此补作：“使我们可以得救。”所据英文见证以方括号标示这一补文；因希腊文校核尚待完成，正文保留补文标记而暂不将其无标记地并入。
    reason: 保留所给见证的文本恢复信号，并明确当前底本审查的限制。
lexical_decisions:
- source_word: for our sakes
  choice: 为我们的缘故
  rationale: 忠实保留代受性的受益对象，同时不加入原文未明说的赎罪理论。
- source_word: suffered truly
  choice: 确实受了苦
  rationale: 突出与“在表象上”相对的真实受苦，中文自然而庄重。
- source_word: raised Himself truly
  choice: 确实使自己复起
  rationale: 保留见证文本的反身表达，避免改写成被动的“被复活”；“复起”表达从死中起来，但不额外补入原文此处未明说的成分。
- source_word: in semblance
  choice: 在表象上
  rationale: 保留对仅有外观而无真实实体的批判，并与后句“不过是表象”形成文字呼应。
- source_word: without body and demon-like
  choice: 没有身体、如同鬼魔的
  rationale: 直译其非肉身、类鬼魔的描述，不将修辞性定性扩展成系统化教义判断。
theological_decisions:
- issue: 基督受苦的真实性
  choice: “确实受了苦”与“只是在表象上受苦”正面相对
  alternative: “真的受难”
  rationale: 既保留反幻影论的核心张力，也避免把一般性的“受苦”过度术语化。
- issue: 复起的语态与施事者
  choice: “他也确实使自己复起”
  alternative: “他也确实复活了”或“他也确实被复活了”
  rationale: 所给英文见证明确采用反身表达“raised Himself”；在希腊文复核尚未完成时，暂不消解这一神学上可能重要的语态差异。
- issue: 信念与结局的对应关系
  choice: “他们怎样相信，也必怎样遭遇”
  alternative: “他们所相信的也必发生在他们身上”
  rationale: 保留审判式的报应对应，同时避免把“opinions”仅仅处理成中性的思想意见。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免把待核的方括号补文直接写成确定正文，主文以脚注标记承接；整体依据所给公版英文见证起草，仍属等待希腊文直接复核的出版草案。
