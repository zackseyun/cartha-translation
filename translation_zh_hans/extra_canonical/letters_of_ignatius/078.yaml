review_pass:
  verdict: revise
  source_fidelity: 草稿大体保留了受苦与复起的真实性、对“仅是表象”的反驳，以及对手立场与其结局的对应；但方括号补文实际上未译入正文，只留下一个不合句法的脚注标记，未能保留见证的恢复信号。另“表象”用来指人不够贴切，“复起”亦非现代汉语常用说法。
  naturalness: “受了这一切苦，[a]并且”因脚注标记代替了应有的补文而句意断裂。“事情并不像……”较绕；“他们自己才不过是表象”与“没有身体、如同鬼魔的”均略显生硬。修订后维持庄重而自然的现代书面语。
  terminology: 以“真实地受苦／使自己复活”保留原见证的强调和反身表达；以“貌似”“虚幻的存在”对应“in semblance／mere semblance”，不将其扩展为系统神学术语。“无躯体、如鬼魔一般”保留原文修辞性描述。
  issues:
  - severity: high
    issue: 方括号补文没有出现在译文正文中
    rationale: 英文见证在“for our sakes”之后以方括号标出“that we might be salved”。草稿仅置[a]，导致补文内容缺失，且“，[a]并且”不成句。应将补文译入方括号，并由脚注说明其文本地位。
  - severity: medium
    issue: “他们自己才不过是表象”不自然且指涉不清
    rationale: “semblance”在此是对那些主张基督仅为表象者的反讽；以“虚幻的存在”可保留这种反讽，并使中文可读。
  - severity: low
    issue: “复起”现代汉语使用不自然
    rationale: “使自己复活”更自然，同时仍明确保留英文见证“raised Himself”的反身、使动表达，而不改为被动。
  revised_text: 因为他为我们的缘故受了这一切苦[a]；他真实地受了苦，正如他也真实地使自己复活了一样。这并不像某些不信的人所说的那样：他只是貌似受苦；他们自己反倒不过是虚幻的存在。他们所持的见解如何，结局也必如何临到他们，因为他们无躯体、如鬼魔一般。
  revised_footnotes:
  - marker: a
    text: 有些见证在此补作：“为使我们得救。”所据英文见证以方括号标示这一补文；因希腊文校核尚待完成，正文保留补文标记而暂不将其无标记地并入。
    reason: 补回英文见证中以方括号标示的内容，并保留其文本恢复信号及目前尚待直接校核希腊文的限制。
  revision_rationale: 修订将方括号补文实际译为“[为使我们得救]”，使脚注锚点附于相应文字，并消除原句的结构断裂。其余调整限于使中文自然、清楚，同时保留见证文本中“真实”与“貌似”的对比、反身的“使自己复活”，以及对“无躯体、如鬼魔”的修辞性描述。
