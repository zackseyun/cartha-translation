review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了基督真实受苦、真实使自己复起，以及对“仅是表象”之说的反驳。但英文见证以方括号保留的“that we might be salved”在正文中只留下脚注标记而未呈现补文内容，未能保留见证的实际文本信号。末句的“他们怎样相信，也必怎样遭遇”也略显不完整；原文是其见解将照样临到他们身上。
  naturalness: “使自己复起”可理解，但现代汉语较生硬；“亲自使自己复起”既较自然，也保留反身施事。“在表象上受苦”及“他们自己才不过是表象”略带翻译腔，改为“只是在表面上受苦／他们自己也不过是幻象”更顺畅，并保留修辞呼应。“没有身体、如同鬼魔的”应改为“没有形体，如同鬼魔”，更自然明确。
  terminology: “受苦”“得救”“不信的人”“鬼魔”均适合庄重现代汉语。保留“亲自使自己复起”，不改为“复活”或“被复活”，以免在希腊文直接校核前抹去英文见证所呈现的反身表达。
  issues:
  - severity: medium
    issue: 方括号补文未在正文中出现
    rationale: 英文见证及英文 POB 均将“that we might be saved/salved”作为方括号内的恢复文字。草稿仅在“苦”后置[a]，读者无法得知被方括号标示的具体补文，因而未完整保留文本与不确定性信号。
  - severity: low
    issue: “他们怎样相信，也必怎样遭遇”所指不够清楚
    rationale: 原句所说的是他们的意见／主张将照样临到他们身上；改为“他们所持的见解，也必照样临到他们身上”更贴合且自然。
  - severity: low
    issue: 若干措辞生硬
    rationale: “使自己复起”“在表象上”“没有身体、如同鬼魔的”可分别调整为“亲自使自己复起”“在表面上”“没有形体，如同鬼魔”，在不改变论证和反身表达下提升现代汉语可读性。
  revised_text: 因为他为我们的缘故受了这一切苦［使我们可以得救］[a]。他确实受了苦，正如他也确实亲自使自己复起。事情并不像某些不信的人所说的那样——他只是在表面上受苦，而他们自己也不过是幻象。他们所持的见解，也必照样临到他们身上，因为他们没有形体，如同鬼魔。
  revised_footnotes:
  - marker: a
    text: 有些见证在此补作：“使我们可以得救。”所据英文见证以方括号标示这一补文；因希腊文校核尚待完成，正文保留方括号及补文标记。
    reason: 完整保留所给英文见证的恢复信号，并说明其暂定性质。
  revision_rationale: 修订将方括号补文实际置入正文，并保留脚注锚点和审校限制说明。其余调整旨在改善现代汉语自然度、明确末句的报应式对应关系，并继续保留英文见证中“他使自己复起”的反身表达，不预断待完成的希腊文校核。
