revisions:
- from: '不要让那些看似言之有理、却传讲异端教训的人使你灰心。你要站立得稳，像铁砧受锤击一样。能承受打击而得胜，才是杰出竞技者的本分。尤其要紧的是，我们必须为上帝的缘故忍受一切，好让他也容忍我们。[a]


    你要比现在更加殷勤。要辨明时势。[b]要等候那位超越一切时序者：他是永恒的，是不可见、却为我们成为可见的；是不可触摸的，是不能受苦、却为我们受了苦的；他为我们忍受了各样的苦难。'
  to: '不要让那些看似言之成理、却教导异样道理的人使你惊惧。你要坚定不移，像受锤击的铁砧那样。伟大的竞技者应当承受击打而得胜。尤其是，为了上帝的缘故，我们必须忍耐一切，好让他也忍耐我们。[a]


    你要比现在更加热心。要细察各个时机。[b]要等候那位超越一切时机者：那位超越时间的、不可见却为了我们成为可见的；不可触摸的、不可受苦却为了我们成为可受苦的；为了我们以各种方式忍耐过的。'
  rationale: 修订以希腊文的词义、平行结构及修辞重复为优先，同时保持现代标准汉语中庄重而可读的书信劝勉语体。尤其避免把“不同教导”直接归类为后世意义的“异端”，并保留“不可受苦／为了我们成为可受苦”的张力，而不以系统神学解释消解它。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:30:39Z'
review_pass:
  verdict: revise
  source_fidelity: 需修订以更贴近希腊文本。"使你灰心"弱化了πτοέω所表达的惊惧、扰乱；"异端教训"把ἑτεροδιδασκαλέω预设为后期定型的“异端”类别；καταμάνθανε τοὺς καιρούς宜译为细察／留心诸时机，而非带有政治或局势判断色彩的“辨明时势”。末段的ἀχρόνος意为“超越时间／无时间限制”，而παθητός在此与“不可受苦的”相对，宜保留“为我们成为可受苦的”的状态性平行；末句不可增添原文未明说的“苦难”。
  naturalness: 原稿整体庄重流畅，但“像铁砧受锤击一样”略显悬置，改为“像受锤击的铁砧那样”更自然。“比现在更加殷勤”可简化为“要比现在更加热心”。“好让他也忍耐我们”虽不寻常，却有意保留原文尖锐的对应关系，并以脚注说明。
  terminology: 保留“上帝”“铁砧”和“竞技者”。将“异端教训”改为“教导异样道理”，避免在未指定具体群体或教义的段落中使用可能过度定性的术语。“不可触摸的／不可受苦的／成为可受苦的”维持原文基督论并列与张力，不作教义性调和。
  issues:
