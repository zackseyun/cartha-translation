base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/093.yaml
  text: 'Do not let those who seem convincing but teach strange doctrine dismay you. Stand firm, like an anvil when it is struck. It is the part of a great athlete to receive blows and be victorious. Above all, for God’s sake we must endure everything, so that he may also endure us.


    Be more diligent than you are. Pay attention to the seasons. Await the one who is above every season: the Eternal, the Invisible, who became visible for our sake; the Untouchable, the one incapable of suffering, who suffered for our sake; the one who endured in every way for our sake.'
translation:
  language: zh_hans
  text: '不要让那些看似言之成理、却教导异样道理的人使你惊惧。你要坚定不移，像受锤击的铁砧那样。伟大的竞技者应当承受击打而得胜。尤其是，为了上帝的缘故，我们必须忍耐一切，好让他也忍耐我们。[a]


    你要比现在更加热心。要细察各个时机。[b]要等候那位超越一切时机者：那位超越时间的、不可见却为了我们成为可见的；不可触摸的、不可受苦却为了我们成为可受苦的；为了我们以各种方式忍耐过的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好让他也忍耐我们”直译原文。这里“忍耐”与前句“我们必须忍耐一切”使用同一动词，形成刻意而不寻常的对应；也可按较顺的中文说“好让他也容忍我们”，但会减弱这一呼应。
    reason: 保留原文重复及其修辞张力，避免将其解释成悦纳、拯救或扶持。
  - marker: b
    text: “时机”译自可指时期、时机或关键时刻的词；下句“超越一切时机者”保留其重复，并指明这位所等候者不受一切时间限定。
    reason: 说明词语的语义范围和上下句的刻意重复。
lexical_decisions:
- source_word: plausible
  choice: 看似言之有理
  rationale: 既表达其表面上的说服力，也保留作者对其教训的否定判断。
- source_word: strange doctrine
  choice: 异端教训
  rationale: 此处指偏离所领受信仰的外来教导；“异端”在现代中文中清楚而凝练，但不进一步指定具体派别。
- source_word: anvil
  choice: 铁砧
  rationale: 保留原有锤击意象及坚忍不动的比喻。
- source_word: athlete
  choice: 竞技者
  rationale: 保留古代竞赛语境，避免现代中文“运动员”可能带来的职业体育联想。
- source_word: seasons
  choice: 时势／时序
  rationale: 第一处按劝勉语境译为“时势”，第二处在超越性描述中译为“时序”；脚注保留其也可指特定时期或时机的语义范围。
- source_word: Impalpable
  choice: 不可触摸的
  rationale: 采用普通读者易懂的表达，保留与“成为可见”“受苦”并列的神学悖论。
- source_word: Impassible
  choice: 不能受苦
  rationale: 直陈其传统哲学—神学含义，并保留紧接着“却为我们受了苦”所形成的张力。
theological_decisions:
- issue: “that He also may endure us”的含义
  choice: 好让他也容忍我们
  alternative: 好让他也忍耐我们／承受我们
  rationale: 英文见证保留了同一“忍受”词根所造成的尖锐反转。中文“容忍我们”较自然，也没有把关系改释为拯救、悦纳或扶持；因源语复核尚待完成，以脚注提示措辞的不寻常。
- issue: 不能受苦者却受了苦
  choice: 是不能受苦、却为我们受了苦的
  alternative: 是不受苦害、却为我们受苦的
  rationale: 保留原文明显的基督论悖论，不以教义解释消解其张力。
- issue: “became visible”所指
  choice: 不可见、却为我们成为可见的
  alternative: 不可见、却为我们显现的
  rationale: “成为可见”更直接保留状态对照，不预先限定其具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的书信劝勉语体；保留铁砧和竞技者的古代意象，以及“不可见／成为可见”“不能受苦／受了苦”的平行结构。由于所供材料明确注明希腊文源语复核尚待完成，本稿以公共领域英文见证为临时依据，并对关键不确定处加注，避免虚称已完成直接源语校勘。
