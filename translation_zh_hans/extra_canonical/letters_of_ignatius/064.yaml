  text: Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ, which is in Philadelphia of Asia, which has found mercy and is firmly established in the concord of God and rejoices in the passion of our Lord and in His resurrection without wavering, being fully assured in all mercy; which church I salute in the blood of Jesus Christ, that is eternal and abiding joy, more especially if they are at one with the bishop and the presbyters who are with him, and with the deacons who have been appointed according to the mind of Jesus Christ, whom after His own will He confirmed and established by His Holy Spirit.
translation:
  language: zh_hans
  text: 又名提奥福罗斯[a]的伊格那丢，致信给在亚细亚非拉铁非的、属于父上帝和主耶稣基督的教会。这教会蒙了怜悯，在上帝所赐的同心中坚立；她因我们主的受难而欢喜，对他的复活毫不动摇，并在一切怜悯中满有确信。我在耶稣基督的血中问候这教会；她是永恒、常存的喜乐。尤其是当教会与监督、与同他在一起的长老，以及与那些照耶稣基督心意受委任的执事合一时，更是如此。这些执事是耶稣基督按自己的旨意，借着他的圣灵所坚固并确立的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提奥福罗斯”是希腊语别名，通常可理解为“负有上帝者”；也可能理解为“上帝所负者”。
    reason: 保留该希腊别名在施事者与受事者关系上的真实语义歧义，不在正文中单向判定。
lexical_decisions:
- source_word: Theophorus (Θεοφόρος)
  choice: 提奥福罗斯
  rationale: 保留伊格那丢的希腊别名音译；其词义可能是“负有上帝者”或“上帝所负者”，不在正文中单向判定。
- source_word: concord
  choice: 和睦
  rationale: 表达共同协调、同心一致的关系，同时避免把其含义缩窄为组织上的统一。
- source_word: passion
  choice: 受难
  rationale: 在早期基督教语境中指耶稣的苦难与死亡；“受难”自然、庄重且易懂。
- source_word: bishop
  choice: 监督
  rationale: 采用较贴近词源和早期教会职分语境的称呼，不预设后世宗派制度。
- source_word: presbyters
  choice: 长老
  rationale: 这是现代汉语基督教文献中清楚而通行的对应词。
- source_word: deacons
  choice: 执事
  rationale: 采用通行职分名称，并保留其与监督、长老并列的结构。
- source_word: mind
  choice: 心意
  rationale: 兼顾意向、思想与旨意的语义，不把表达过度制度化。
theological_decisions:
- issue: “在父上帝和耶稣基督里”与教会的关系
  choice: 保留“在……里”的联合性措辞
  alternative: 译为“属于父上帝和耶稣基督”
  rationale: “在……里”保留原表述可能包含的属灵联合和归属双重意味。
- issue: “在耶稣基督的血里问候”与“永恒、常存的喜乐”的语法关系
  choice: 按现有见证将“永恒、常存的喜乐”理解为指向“血”
  alternative: 理解为整个问候或教会合一所带来的喜乐
  rationale: 所供英文见证以“that”承接“blood”，但底本希腊文尚待直接核校，因此用脚注标明语法上的可能歧义。
- issue: 基督坚固并确立的对象
  choice: 依供稿见证理解为监督、长老和执事这些人
  alternative: 理解为相关职分安排或教会整体
  rationale: 近距离先行词是这些受委任的人；同时避免由此推导后世特定圣职神学。
- issue: 教会合一的表达
  choice: 译为“同心合一”
  alternative: 译为“顺服”或“联合”
  rationale: 原见证强调“at one”，不宜擅自增添单向服从的含义。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留古代书信序言的长句推进，但适度分句以便普通读者理解。由于任务所供材料明确注明希腊文复核尚未完成，本稿以公共领域英文见证为临时依据，并在有实质歧义处作脚注提示。
