revisions:
- from: 又名提奥福罗斯[a]的伊格那丢，致信给亚细亚的非拉铁非那在父上帝和耶稣基督里的教会。这教会蒙了怜悯，在上帝的和睦中坚立，因我们主的受难和他的复活而欢喜，毫不动摇，在一切怜悯中满有确信。我在耶稣基督的血里问候这教会；这血是永恒、常存的喜乐[b]。若众人尤其与监督、同他在一起的长老，以及那些照耶稣基督心意受委任的执事同心合一，就更是如此。这些人是耶稣基督按自己的旨意，借着他的圣灵坚固并确立的。
  to: 又名提奥福罗斯[a]的伊格那丢，致信给在亚细亚非拉铁非的、属于父上帝和主耶稣基督的教会。这教会蒙了怜悯，在上帝所赐的同心中坚立；她因我们主的受难而欢喜，对他的复活毫不动摇，并在一切怜悯中满有确信。我在耶稣基督的血中问候这教会；她是永恒、常存的喜乐。尤其是当教会与监督、与同他在一起的长老，以及与那些照耶稣基督心意受委任的执事合一时，更是如此。这些执事是耶稣基督按自己的旨意，借着他的圣灵所坚固并确立的。
  rationale: 修订依据中期本希腊文的语法关系，并与英文见证逐项核对。最重要的是将‘永恒、常存的喜乐’恢复为对教会的描述，并将末句限定为基督借圣灵坚固、确立受委任的执事。删除原脚注 b，因为其所述‘血’的指代不受希腊文语法支持。其余措辞力求保持现代、庄重且可朗读的简体中文，同时不引入后世教会制度或教义推论。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:29:32Z'
review_pass:
  verdict: revise
  source_fidelity: 需要修订两处关键指代。按中期本希腊文的性、数配合，‘永恒、常存的喜乐’的关系代词指向阴性的‘教会’，不能指向中性的‘血’；末句‘他们’（οὓς）最近且语法上对应‘执事’，不包括监督和长老。另将开头教会与父上帝、耶稣基督的属格关系明确译出，并保留原文对复活及‘一切怜悯’的修饰关系。
  naturalness: 原稿整体庄重流畅，但‘亚细亚的非拉铁非那在父上帝和耶稣基督里的教会’结构略显拗口，改为‘在亚细亚非拉铁非的、属于父上帝和主耶稣基督的教会’更符合现代书面汉语。以‘她’回指教会虽可行，但现代中文用‘这教会’更自然且不损原文阴性指代。
  terminology: 保留‘提奥福罗斯’及其歧义说明；‘监督、长老、执事’适合早期教会职分语境。将‘上帝的和睦’调整为‘上帝所赐的同心’以更贴近 concord/ὁμονοία 的共同一致含义；保留‘受难’和‘复活’等通行术语。
  issues:
  - severity: high
    issue: ‘永恒、常存的喜乐’被译为耶稣基督的血，并以脚注确认这一判断。
    rationale: 希腊文此处关系代词为阴性（ἥτις），与阴性的‘教会’相合；‘血’（αἷμα）为中性。因此该短语应说明教会是永恒而常存的喜乐。
  - severity: high
    issue: 末句把基督所坚固并确立的对象扩展为监督、长老和执事全体。
    rationale: 关系代词 οὓς 为阳性复数，紧接并指向阳性复数的‘执事’；‘监督’为单数，‘长老’虽为复数却不构成该最近的语法先行词。应仅译为基督坚固、确立这些执事。
  - severity: medium
    issue: 开头将‘属于父上帝和耶稣基督的教会’改写为‘在父上帝和耶稣基督里的教会’。
    rationale: 所据见证及希腊文均为属格表述，首先表达教会属于父上帝和主耶稣基督；改为‘在……里’加入了不同的关系表达。
  - severity: low
    issue: 脚注 b 以尚待复核为由保留了不符合希腊文性别配合的歧义。
    rationale: 此处不存在‘血’与‘教会’之间可由语法维持的歧义；应删除该脚注，避免误导。
