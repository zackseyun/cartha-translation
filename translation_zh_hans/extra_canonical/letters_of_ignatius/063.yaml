  source_fidelity: 末句的希腊文为“ἐν ὑπομονῇ Ἰησοῦ Χριστοῦ”，直义为“在耶稣基督的忍耐／坚忍中”；现稿按英文桥接稿译为“耐心等候耶稣基督”，将属格的表达明确改成“等候耶稣”，不够忠实。另“这个名字是我所深爱的”误将对克罗古的亲爱说成对其名字的爱，且“配得上帝和你们”在汉语中缺少必要的中心词。
  naturalness: 整体书信体庄重通顺，但“我已经临近了”“配得上帝和你们”“使他们得舒畅”略显生硬。“我快到你们那里了”“配得上帝和你们的嘉许”“使他们得安慰”更符合现代汉语，同时仍保留原文的宽泛关怀语义。
  terminology: “士每拿”“以弗所”“叙利亚”“罗马”“耶稣基督”和“上帝”均可保留。将“worthy of all felicitation”译作“配受一切称颂”较准确、自然；“为上帝的荣耀”保留该短语的目的性而不预断其是否专指殉道。
