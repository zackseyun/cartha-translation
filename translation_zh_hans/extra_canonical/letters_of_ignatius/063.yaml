  rationale: 修订以希腊文的句法和词义优先，并参照英文见证。尤其恢复末句“耶稣基督的忍耐”的开放属格表达，避免将其收窄为对基督再来的等候；同时处理了人名同位语、汉语中省略中心词所造成的歧义，以及若干不自然的书信措辞。历法脚注保留，且其锚点与正文[a]一致。
