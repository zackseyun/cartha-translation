  - severity: medium
    issue: “这个名字是我所深爱的”
    rationale: 原句的修辞性同位语称克罗古为作者所亲爱的；汉语若说“这个名字”被深爱，会造成字面误解。
  - severity: medium
    issue: “他们都配得上帝和你们”
    rationale: 原文简略地说他们“配得上帝和你们”；汉语需要补出“嘉许”等受词，才既自然又不致误作“配得上帝”。
  - severity: low
    issue: “我已经临近了”缺少趋向对象
    rationale: 这里是要罗马信徒转告先到者作者将至；补作“我快到你们那里了”使现代汉语明确，未添加实质信息。
