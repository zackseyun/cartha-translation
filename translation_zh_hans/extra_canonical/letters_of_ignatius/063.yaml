revisions:
- from: '我现在从士每拿写这些话给你们，由那些配受一切称许的以弗所人捎去。克罗古也和我在一起；这个名字是我所深爱的。此外还有许多人也在这里。


    至于那些从叙利亚先我前往罗马、为要归荣耀给上帝的人，我相信你们已经得到了有关他们的指示。也请通知他们，我已经临近了；因为他们都配得上帝和你们，也理当由你们在各方面使他们得舒畅。


    这些话是我在九月朔日前第九日[a]写给你们的。愿你们在耐心等候耶稣基督中，坚守到底。愿你们平安！'
  to: '我现从士每拿写这些话给你们，由那些配受一切称颂的以弗所人带去。我所亲爱的克罗古也与我同在，此外还有许多人。


