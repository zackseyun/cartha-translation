base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/063.yaml
  text: 'I am writing these things to you from Smyrna by the hand of the Ephesians, who are worthy of every congratulation. Crocus also, a name very dear to me, is here with me, along with many others.


    Regarding those who went ahead of me from Syria to Rome for the glory of God, I believe you have received instructions. Let them also know that I am near, for they are all worthy of God and of you, and it is fitting for you to refresh them in every way.


    I am writing these things to you on the ninth day before the Calends of September. Farewell to the end as you wait patiently for Jesus Christ.'
translation:
  language: zh_hans
  text: '我现从士每拿写这些话给你们，由那些配受一切称颂的以弗所人带去。我所亲爱的克罗古也与我同在，此外还有许多人。


    至于那些从叙利亚先我一步往罗马去、为上帝的荣耀而行的人，我相信你们已经得到了关于他们的消息；也请让他们知道，我快到你们那里了。因为他们都配得上帝和你们的嘉许；你们理当在各方面使他们得安慰。


    这些话是我在九月朔日前第九日[a]写给你们的。愿你们在耶稣基督的忍耐中坚忍到底。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “九月朔日前第九日”是罗马历法的记日方式，按通常的包容计数法，相当于公历8月24日。
    reason: 正文保留原有的罗马历日期，并说明其通常对应的现代日期；“通常”保留历法换算及历年对应的必要谨慎。
lexical_decisions:
- source_word: by the hand of
  choice: 由……捎去
  rationale: 表达书信经他人递送之意，比直译“借着……的手”更符合现代汉语，同时保留使者身份。
- source_word: worthy of all felicitation
  choice: 配受一切称许
  rationale: 保留高度赞许的语气；“称许”自然庄重，也避免把含义过窄地限定为“祝贺”。
- source_word: unto the glory of God
  choice: 为要归荣耀给上帝
  rationale: 既可表达目的，也不把短语处理成单纯的行程结果；措辞符合早期基督教书信语域。
- source_word: refresh them
  choice: 使他们得舒畅
  rationale: 保留关怀、接待并给予安慰与补给的宽广含义，不窄化为单一物质援助。
- source_word: patient waiting
  choice: 耐心等候
  rationale: 兼顾忍耐与期待两个语义成分，采用普通现代读者易懂的表达。
- source_word: Fare ye well unto the end
  choice: 坚守到底。愿你们平安！
  rationale: 将持续到底的修饰关系与告别祝愿都表达出来；原句关系略显压缩，汉语分句可读性更佳。
theological_decisions:
- issue: “为要归荣耀给上帝”所修饰的行动或目的
  choice: 保留为此行与见证归荣耀给上帝的开放表达
  alternative: 译为“走向上帝的荣耀”或明确指殉道得荣耀
  rationale: 现有英文见证不足以断定其专指殉道或终末得荣，因此不作教义性收窄。
- issue: 末句“等候耶稣基督”与“到底”的关系
  choice: 译作“在耐心等候耶稣基督中，坚守到底”
  alternative: “愿你们等候耶稣基督，直到末了”
  rationale: 保留持续忍耐和终极坚持的张力，同时避免把“到底”只机械地附着于时间长度。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。人名和地名依常见基督教汉语译法处理。因希腊文源语复核尚待完成，本稿以所提供的公版英文见证为依据，对可能涉及源语句法或词义范围之处保持克制，并用脚注标明历法信息。
