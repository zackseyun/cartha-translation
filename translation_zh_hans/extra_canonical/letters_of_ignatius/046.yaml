base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/046.yaml
  text: 'Therefore, be on your guard against such people. And this will certainly be so, if you are not puffed up and if you remain inseparable from [God] Jesus Christ, from the bishop, and from the ordinances of the Apostles.


    Whoever is inside the sanctuary is clean, but whoever is outside the sanctuary is not clean. That is, whoever does anything without the bishop, presbytery, and deacons is not clean in his conscience.'
translation:
  language: zh_hans
  text: '所以，你们要提防这样的人。只要你们不自高自大，并且与[上帝]耶稣基督、与监督以及使徒的规条保持不可分离，这事就必定如此。[a]


    在圣所之内的人是洁净的；在圣所之外的人却不洁净。也就是说，凡做任何事不与监督、长老团和执事同工的人，他的良心并不洁净。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “[上帝]”的方括号沿用底本所提供的文本标记，表示该词的文本状况尚待希腊文校勘确认。此译稿目前依据所给公版英文见证，直接希腊文复核尚待完成。
    reason: 提示关键文本变异及当前底本限制。
  - marker: b
    text: “不与……同工”所对应的表达也可理解为“不在……参与之下”“离开……”或“未经……而行”；原句未明确限定为某一种正式许可程序。
    reason: 保留介词关系的真实歧义，避免过度制度化解释。
lexical_decisions:
- source_word: be ye on your guard
  choice: 你们要提防
  rationale: 以自然的现代汉语表达持续警戒之意，同时保留命令语气。
- source_word: puffed up
  choice: 自高自大
  rationale: 准确传达因骄傲而膨胀自满的比喻含义，且为普通读者易懂。
- source_word: inseparable from
  choice: 与……保持不可分离
  rationale: 保留原文强烈的联合与不分离意味，避免弱化为一般性的“亲近”。
- source_word: bishop
  choice: 监督
  rationale: 采用较贴近早期教会职分用语的中性译名，避免直接套用后世宗派制度称谓。
- source_word: ordinances
  choice: 规条
  rationale: 保留有权威的既定规范或安排之意，不把它具体化为原文未明说的礼仪或教义。
- source_word: sanctuary
  choice: 圣所
  rationale: 保留圣域内外的空间与礼仪洁净比喻，不径自解释为某一具体建筑或组织边界。
- source_word: presbytery
  choice: 长老团
  rationale: 此处指由长老组成的集体，而非抽象职分或单个长老。
- source_word: deacons
  choice: 执事
  rationale: 采用现代中文教会语境中通行且对应明确的职分名称。
- source_word: doeth aught without
  choice: 做任何事不与……同工
  rationale: “without”在此既可指未经参与、同意或脱离其外；译作“不与……同工”较自然，同时不强行限定为单纯“未获许可”。
- source_word: not clean in his conscience
  choice: 他的良心并不洁净
  rationale: 保留洁净语言与良心之间刻意形成的对应和神学张力。
theological_decisions:
- issue: '[God]在“耶稣基督”前的文本地位'
  choice: 保留方括号译作“[上帝]耶稣基督”
  alternative: 省略“上帝”，译作“耶稣基督”
  rationale: 所给见证明确以方括号标示该词具有文本不确定性；译文不应静默裁定。
- issue: “圣所之内／之外”的含义
  choice: 保留为圣所内外的比喻，并由下句按原文加以说明
  alternative: 直接意译为教会内外或服从教会职分者与不服从者
  rationale: 原文刻意使用圣所和洁净语言；直接改成制度性陈述会消除其礼仪意象与神学张力。
- issue: “without the bishop…”所表达的关系
  choice: 译为“不与监督、长老团和执事同工”
  alternative: 译为“未经监督、长老团和执事许可”或“离开他们”
  rationale: 英语见证中的“without”允许多种关系性理解；选择较宽的协同行动表述，避免加入明确授权程序。
- issue: 洁净与良心的关系
  choice: 直译为“良心并不洁净”
  alternative: 解释为“在道德上有罪”
  rationale: 保留作者将圣所洁净范畴转用于良心判断的修辞，不以系统神学术语替换。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话。“监督、长老团、执事”保持早期教会职分层次；“圣所、洁净、良心”保留原段的礼仪意象及其伦理转用。因直接希腊文审查尚未完成，本稿明确作为依据公版英文见证形成的审慎出版草案。
