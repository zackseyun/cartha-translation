review_pass:
  verdict: revise
  source_fidelity: 需要修订两处关键措辞。希腊文的 θυσιαστήριον 指“祭坛”，不宜译为“圣所”；且 χωρὶς ἐπισκόπου καὶ πρεσβυτερίου καὶ διακόνων πράσσων τι 是“离开／不依附于……而行事”，原译“不与……同工”加入了原文未明示的协作含义。其余内容大体忠实地保留了条件句、洁净与良心的对应，以及[上帝]的文本标记。
  naturalness: 原文“与……保持不可分离”略显生硬，改为“不离开……”更符合现代汉语，也准确反映 ἀχώριστοι ἦτε ἀπό 的关系性表达。“在祭坛以内／以外”虽带古典礼仪意象，但在庄重书面语中清楚可读。
  terminology: “监督”“长老团”“执事”可保留，能分别对应 bishop、presbytery、deacons，且不预设后世宗派体制。“祭坛”应取代“圣所”，以对应 θυσιαστήριον。“使徒的规条”可保留。“[上帝]耶稣基督”保留英文见证及希腊文校勘不确定性的方括号标记。
  issues:
  - severity: high
    issue: “sanctuary”译作“圣所”未反映希腊文 θυσιαστήριον。
    rationale: θυσιαστήριον 的通常且直接含义是“祭坛”，而非泛指圣所或圣殿区域。译为“圣所”抹去了作者所用的祭坛意象；下文以祭坛内外说明与教会职分的关系，这一比喻应保留。
  - severity: medium
    issue: “不与监督、长老团和执事同工”过度具体化 χωρὶς。
    rationale: χωρὶς 的核心是“离开、脱离、没有、在……之外”，并不明说共同工作。改作“离开……而行事”保留关系上的广义性，不擅自规定为协作或正式许可程序。
  - severity: low
    issue: “与……保持不可分离”不够自然。
    rationale: “不离开……”在现代汉语中更流畅，同时保留不与基督、监督及使徒规条分离的强烈语气。
  revised_text: '所以，你们要防备这样的人。而这必会如此：只要你们不自高自大，并且不离开[上帝]耶稣基督、监督和使徒的规条。[a]



    在祭坛以内的人是洁净的；在祭坛以外的人却不洁净。也就是说，凡离开监督、长老团和执事而行事的人，他的良心并不洁净。[b]'
  revised_footnotes:
  - marker: a
    text: “[上帝]”的方括号沿用所给英文见证的文本标记，表示该词的文本状况尚待希腊文校勘进一步确认。本译稿依据所给公版英文见证，并参照中期本希腊文传统的措辞复核。
    reason: 保留关键文本不确定性的可见标记，避免将有争议的词语静默确定或删除。
  - marker: b
    text: “离开监督、长老团和执事而行事”对应“without/apart from”。该表达可涵盖脱离、缺少或不依附这些职分而行动等关系；原句本身未明确限定为某一种正式许可程序。
    reason: 说明“without”的关系性范围，并避免把原文解释成“同工”或单一的制度性授权程序。
  revision_rationale: 修订以希腊文措辞为优先：将 θυσιαστήριον 译为“祭坛”，并将 χωρὶς 的宽泛“离开／在……之外”关系恢复出来。其余译文维持原有庄重、现代的书面普通话，并保留[上帝]的方括号、洁净—良心的修辞对应，以及职分名称的中性处理。
