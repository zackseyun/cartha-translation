review_pass:
  verdict: revise
  source_fidelity: 需修订。下段希腊文的θυσιαστήριον通常指“祭坛”，不宜按英文见证的“sanctuary”译作“圣所”。此外，χωρὶς（“离开／没有／不在……之下”）不能正面译成“不与……同工”，后者加入了协作劳动的含义。修订保留了[上帝]的方括号文本信号，也未将“without”窄化为正式许可程序。
  naturalness: “只要……这事就必定如此”在现代汉语中条件关系和指代均不够清楚；改为“若……，这必定会如此”，在保留原句简略指代的同时更合乎书面普通话。“与……保持不可分离”亦改为较自然的“不离开……”。
  terminology: 保留“监督、长老团、执事”以对应早期教会职分用语；“使徒的规条”可保留。将“圣所”改为“祭坛”，以对应θυσιαστήριον；“洁净”和“良心”仍保留原文的礼仪—伦理修辞。
  issues:
  - severity: high
    issue: “圣所”未对应θυσιαστήριον的通常含义。
    rationale: 该词通常指“祭坛”，且本段以内外、洁净的比喻正围绕祭坛语言展开。译为“圣所”是随从所给英文见证而失去更具体的原语意象。
  - severity: medium
    issue: “不与监督、长老团和执事同工”过度解释χωρὶς。
    rationale: χωρὶς表达“离开、没有、脱离……而”之意；“同工”引入共同劳动或事工协作，不能作为中性对应。
  - severity: low
    issue: “只要”及“保持不可分离”表达不够自然。
    rationale: “只要”容易把条件误读为充分条件，“保持不可分离”搭配生硬；改为“若……不离开……”更自然且保留关系性含义。
  revised_text: '因此，你们要防备这样的人。若你们不自高自大，又不离开[上帝]耶稣基督、监督和使徒的规条，这必定会如此。[a]


    在祭坛以内的人是洁净的；在祭坛以外的人却不洁净。也就是说，凡离开监督、长老团和执事而行事的人，他的良心并不洁净。[b]'
  revised_footnotes:
  - marker: a
    text: “[上帝]”的方括号沿用所给英文见证的文本标记，表示该词的文本地位尚待希腊文校勘进一步确认。本译稿同时保留其与“耶稣基督”的紧邻关系，不预断其具体句法分析。
    reason: 保留英文审计轨迹所标出的文本不确定性，避免静默裁定该词是否属于正文或其句法关系。
  - marker: b
    text: “离开……而行事”对应“without／apart from”的关系表达，可能指脱离监督、长老团和执事而行动，或不在其共同关系之内；该语本身未明确限定为某一种正式许可程序。“祭坛”对应希腊文θυσιαστήριον；所给英文见证译作“sanctuary”，但原词通常指祭坛。
    reason: 纠正“同工”所加入的含义，并说明祭坛译法及其与英文见证的差异。
  revision_rationale: 修订以希腊文术语的通常含义优先，并与所给英文见证逐项核对。文本仍保留第一段“这必定会如此”的简略指代，不擅自补足其所指；保留[上帝]的方括号；对χωρὶς采用不预设制度程序的“离开……而行事”。
