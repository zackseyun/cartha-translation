base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/032.yaml
  text: 'If, then, those who had lived according to ancient practices came to a new hope, no longer observing Sabbaths but shaping their lives according to the Lord’s day—on which our life also arose through him and through his death, which some deny—a mystery through which we came to believe, and for this reason we patiently endure, so that we may be found to be disciples of Jesus Christ, our only teacher—


    if this is so, how will we be able to live apart from him? For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit. And for this reason, he whom they rightly awaited, when he one, raised them from the dead.'
translation:
  language: zh_hans
  text: '所以，那些按古老习俗生活的人，既已进入新的盼望，就不再守安息日，反倒照着主日而生活；在这日，我们的生命也借着他和他的死升起——有些人否认他的死——这是一个奥秘；我们借着这奥秘得以相信，也因此恒久忍耐，使我们得以显明为耶稣基督——我们唯一的教师——的门徒。


    既是这样，我们怎能离开他而生活呢？因为就连众先知，作为他的门徒，也借着圣灵等候他作他们的教师。因此，他们所正当地等候的那一位，来到后，使他们从死人中复起。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ancient practices
  choice: 古老习俗
  rationale: 现有材料尚待希腊文复核；此译保留其可指犹太传统生活方式的宽泛含义，不擅自贬称为“旧规条”或限定为摩西律法。
- source_word: newness of hope
  choice: 新的盼望
  rationale: 用现代中文自然表达盼望进入更新状态，同时避免扩写其具体神学内容。
- source_word: observing Sabbaths
  choice: 守安息日
  rationale: “守安息日”是现代中文读者熟悉而准确的宗教用语；原文见证中的复数不必机械译作“各安息日”。
- source_word: fashioning their lives after the Lord's day
  choice: 按主日塑造自己的生活
  rationale: 保留“主日”与生活方式之间的关联，不把句意缩减为单纯“庆祝主日”。
- source_word: our life also arose
  choice: 我们的生命也……兴起
  rationale: 保留“生命”及“兴起”的复活语感，不直接改写成“我们得救”。
- source_word: teacher
  choice: 老师
  rationale: 采用普通现代汉语，既适用于耶稣，也能自然表达先知所等候的教导者身份。
- source_word: through the Spirit
  choice: 借着圣灵
  rationale: 在基督教语境中自然明确；表达先知借圣灵等候基督，不额外规定“老师”与“借着圣灵”的句法关系。
theological_decisions:
- issue: “主日”与安息日的关系
  choice: 译为“不再守安息日，而是按主日塑造自己的生活”
  alternative: “不再按安息日生活，却按主的生命生活”
  rationale: 所给见证明示 Lord’s day，故正文依此翻译；但底层希腊文尚待复核，因此不进一步发挥安息日制度是否被取代等教派性结论。
- issue: “借着他和他的死”所修饰的内容
  choice: 让它修饰“我们的生命……兴起”
  alternative: 可理解为生命因基督及其死亡而产生或更新
  rationale: 依见证保留紧密句法和神学张力，不把“他的死”淡化为仅是复活前的背景。
- issue: “有些人否认”所否认的对象
  choice: 明确为“他的死”
  alternative: 也可能笼统指否认相关基督事件或奥秘
  rationale: 英语见证的最近先行词是“他的死”；中文若只写“有些人否认”，对象会过度含混。
- issue: 末句残损或讹误
  choice: 依据上下文译为“那一位来到时，使他们从死人中复起”，并加脚注
  alternative: 机械保留为“当他独一时，使他们从死人中复起”
  rationale: 见证中的“when He one”明显不通，可能是排印、转录或文本问题。正文采用最小幅度的语境修复，同时明确标示不确定性。
- issue: 先知是否在基督复活时从死里复起
  choice: 保留“使他们从死人中复起”
  alternative: 解释为属灵唤醒、阴间释放或末世复活
  rationale: 不替文本解决其具体所指，也不导入某一宗派关于死者状态的体系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以”“既然如此”保留论证推进；“恒久忍耐”兼顾教会文献语体与普通读者可懂性。由于直接希腊文审校尚未完成，本稿以所给公共领域英语见证及经审核的英文桥接稿为临时依据，尤其对“主日”句法和末句保持审慎。
