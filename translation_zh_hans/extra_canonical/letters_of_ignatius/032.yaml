revisions:
- from: '所以，那些按古老习俗生活的人，既已进入新的盼望，就不再守安息日，而是按主日塑造自己的生活；在这一日，我们的生命也借着他和他的死兴起——有些人否认他的死。这是一个奥秘，我们借此有了信心；也正因如此，我们恒久忍耐，好让人看出我们是耶稣基督——我们唯一的老师——的门徒。


    既然如此，我们怎能离开他而生活呢？就连众先知也是他的门徒，借着圣灵等候他作他们的老师。正因如此，他们所正当等候的那一位来到时，使他们从死人中复起。[a]'
  to: '所以，那些按古老习俗生活的人，既已进入新的盼望，就不再守安息日，反倒照着主日而生活；在这日，我们的生命也借着他和他的死升起——有些人否认他的死——这是一个奥秘；我们借着这奥秘得以相信，也因此恒久忍耐，使我们得以显明为耶稣基督——我们唯一的教师——的门徒。


    既是这样，我们怎能离开他而生活呢？因为就连众先知，作为他的门徒，也借着圣灵等候他作他们的教师。因此，他们所正当地等候的那一位，来到后，使他们从死人中复起。'
  rationale: 修订以中期本希腊文的句法为优先，并与英语见证核对。删除因英语讹排而设的末句不确定性脚注；以“来到后”对应ἐλθών，以“使他们从死人中复起”对应ἤγειρεν αὐτοὺς ἐκ νεκρῶν。将“奥秘”紧系于被否认的死亡，同时仍不界定该奥秘的系统神学含义；也不解释先知复起的具体时间或状态。
