base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/021.yaml
  text: 'If Jesus Christ should count me worthy through your prayer, and if it should be God’s will, then in the second tract that I intend to write to you, I will further set before you the dispensation of which I have begun to speak, relating to the new man Jesus Christ. This consists in faith toward him and love toward him, in his passion and resurrection,


    especially if the Lord should reveal anything to me. Assemble yourselves together in common, each one of you severally, person by person, in grace, in one faith and one Jesus Christ, who according to the flesh was of David’s race, who is Son of Man and Son of God, so that you may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live forever in Jesus Christ.'
translation:
  language: zh_hans
  text: '若耶稣基督借着你们的祷告，认为我配得，且这是上帝的旨意，我就在计划写给你们的第二篇短文中，进一步向你们说明我已开始谈及的安排[a]，即有关新人耶稣基督的事：在对他的信和爱中，在他的受难和复活中——尤其是主若向我启示什么。


    你们众人要在恩典中一同聚集，各人都在同一信仰和同一位耶稣基督里；他按肉身说是大卫的后裔，也是人子和上帝的儿子。为要使你们心思不分散地顺服监督和众长老，你们要同擘一个饼；这饼是赐人不朽的良药，是使我们不至死亡、反而在耶稣基督里永远活着的解药[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安排”也可译作“计划”或“经纶”，指上帝在耶稣基督里所施行的救赎安排。
    reason: 该词含义丰富，正文采用通俗表达，脚注提示其传统译法与语义范围。
  - marker: b
    text: 原文在“良药”和“解药”处连续使用医疗比喻，形容这“一个饼”使人不至死亡、而在耶稣基督里永远活着。
    reason: 帮助现代读者识别并保留作者刻意使用的双重医学意象，而不添加宗派性圣餐解释。
lexical_decisions:
- source_word: οἰκονομίαν / “dispensation”
  choice: 安排
  rationale: 保留“按计划施行、经营安排”的含义，同时避免在普通现代汉语中使用含义不明的“经纶”；此处具体所指由后文“有关新人耶稣基督的事”限定。
- source_word: καινὸν ἄνθρωπον
  choice: 新人
  rationale: 采用早期基督教语境中自然且具有互文性的表达，不扩展为“新造的人”，以免缩窄或改写原有措辞。
- source_word: πάθει
  choice: 受难
  rationale: 在耶稣语境中表达其苦难与死亡事件，比泛泛的“痛苦”更准确，也保持庄重。
- source_word: κατὰ σάρκα
  choice: 按肉身说
  rationale: 保留原文有关耶稣人性与世系的限定性表述，不将其淡化为单纯“按血统”。
- source_word: ἐπίσκοπος
  choice: 监督
  rationale: 较贴近词义及早期教会职分语境，避免直接套用后世特定宗派制度称谓。
- source_word: πρεσβυτέριον
  choice: 众长老
  rationale: 表达由长老组成的整体，并与单数的“监督”形成原文中的职分对应。
- source_word: φάρμακον ἀθανασίας
  choice: 使人不朽的良药
  rationale: 保留鲜明的医药隐喻；“使人不朽”比仅说“永生之药”更贴近ἀθανασία。
- source_word: ἀντίδοτος
  choice: 解药
  rationale: 直接保留与“良药”相连的医学意象以及抵御死亡的功能。
theological_decisions:
- issue: “对他的信与爱”中属格关系的理解
  choice: 对他的信与爱
  alternative: 他的信与他的爱／在他的信实与爱中
  rationale: 依照所给见证的理解，同时保留中文中一定的关系弹性；不把它明确限定为基督自身的信实，避免在直接希腊文校勘尚未完成时过度裁断。
- issue: “一个饼”与不朽之药的关系
  choice: 明确由“这饼”承接“一个饼”
  alternative: 把“不朽的良药”泛指整个聚会或圣餐行动
  rationale: 原句的关系代词直接承接“一个饼”；译文保持这一语法联系，但不进一步加入圣礼机制或宗派性解释。
- issue: “人子，也是上帝的儿子”
  choice: 并列保留两项称号
  alternative: 将“人子”解释为“人的儿子”或将两者融合为教义说明
  rationale: 并列呈现原有基督论张力，不以解释性增译消除称号本身的含义空间。
- issue: 顺服监督与长老的目的或结果关系
  choice: “这样，你们就能……”
  alternative: “为要使你们……”
  rationale: 表达原文目的结构，同时使用自然现代汉语；不将其强化为绝对化的制度命令。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。长句按现代中文节奏分段，但保留条件句、目的关系及连续的基督论和医药意象。鉴于所给材料注明希腊文复核尚待完成，本稿以公共领域英文见证为主要起草依据，并仅在可稳妥辨认的中期希腊传统措辞上作词义校准；未把存疑处处理成过度确定的教义结论。
