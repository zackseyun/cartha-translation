  rationale: 修订首句以“我就在……中说明”恢复条件句的主语和修饰关系；将聚集命令译为“各人都在……里”，删去无依据的“来”；并以“为要使”恢复原文目的结构。其余保留原稿的术语取向、称号并列、按肉身的限定及医学隐喻。脚注b相应明确“一个饼”是医疗比喻的语法承接对象。
