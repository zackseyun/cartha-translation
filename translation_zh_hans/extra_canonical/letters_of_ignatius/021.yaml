  naturalness: 现稿庄重清楚，但“我打算写给你们的第二篇短文，就会进一步……”主谓搭配不自然；“人人都来”也增添了“来”的动作，未必需要。修订后以“你们各人一同聚集”自然表达共同聚集与逐一参与。
  terminology: “安排”“新人”“受难”“按肉身说”“监督”“众长老”“良药”“解药”均可保留。“不朽的良药”较直译但在中文中略生硬；“赐人不朽的良药”在不减弱ἀθανασία含义的前提下更顺畅。对πίστει αὐτοῦ与ἀγάπῃ αὐτοῦ的属格关系，正文继续沿用英文见证所取的“对他的信和爱”，不作超出底本依据的教义性裁断。
