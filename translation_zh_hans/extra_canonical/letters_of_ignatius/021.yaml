    你们众人要在恩典中共同聚集，人人都来，在同一信仰和同一位耶稣基督里合而为一。他按肉身说出自大卫的后裔，是人子，也是上帝的儿子。这样，你们就能心无旁骛地顺服监督和众长老；你们同掰一个饼，这饼是使人不朽的良药，是使我们不至死亡、反而永远活在耶稣基督里的解药[b]。'
