base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/070.yaml
  text: 'But if anyone teaches Judaism to you, do not listen to him. For it is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But if either one does not speak concerning Jesus Christ, I regard them as tombstones and graves of the dead, on which only the names of men are inscribed.


    Therefore shun the wicked arts and plots of the prince of this world, lest you perhaps be crushed by his schemes and grow weak in your love. But gather together, all of you, with an undivided heart. And


    I thank my God that I have a good conscience in my dealings with you. No one can boast, either secretly or openly, that I was a burden to anyone in small things or great. Yes, and for all among whom I spoke, I pray that they may not turn it into a testimony against themselves.'
translation:
  language: zh_hans
  text: '但若有人向你们宣讲犹太教，不要听他；因为，听一个受过割礼的人宣讲基督信仰，胜过听一个未受割礼的人宣讲犹太教。但无论是前者还是后者，若不讲论耶稣基督，在我看来，他们就像墓碑和死人的坟墓，上面只刻着人的名字。


    所以，你们要避开这世界之王的邪恶伎俩和阴谋，免得被他的诡计压垮，在爱中变得软弱。你们却要全体聚集在一起，同心合意。并且——[a]


    我感谢我的上帝，因为在与你们的交往中，我问心无愧；没有人能私下或公开夸口说，我在小事或大事上曾给任何人增添负担。至于所有听过我讲话的人，我祈求他们不要让这些话反倒成为定他们罪的证据。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原见证在此以“并且”中断，下一段另起；译文保留这一突兀衔接。
    reason: 该断裂可能反映传本、段落划分或原有修辞结构，不宜擅自补足。
  - marker: b
    text: “这些话”原文所指可能是伊格那丢的教导或他在众人中所说的一切；句意是听者若不顺服，所听见的反会成为对自己不利的证据。
    reason: 代词所指和司法性比喻存在一定解释空间，脚注保留其开放性。
lexical_decisions:
- source_word: Judaism
  choice: 犹太教
  rationale: 指作为教导内容而提出的犹太宗教体系；用现代读者易懂的通常称谓，不将其扩大为犹太民族或全部犹太传统。
- source_word: Christianity
  choice: 基督信仰
  rationale: 此处与“犹太教”相对，但重点是关于基督的信仰宣讲；“基督信仰”比现代制度化色彩较强的“基督教”更贴合语境。
- source_word: circumcised / uncircumcised
  choice: 受过割礼的人／未受割礼的人
  rationale: 保留原文具体的盟约与族群标记，不以“犹太人／外邦人”替换，以免消除修辞张力。
- source_word: tombstones and graves of the dead
  choice: 墓碑和死人的坟墓
  rationale: 保留两个并列的死亡意象及其尖锐比喻，不加以弱化。
- source_word: the prince of this world
  choice: 这世界之王
  rationale: 保留早期基督教文本中的统治者称号及其隐含所指，不在正文直接释作“撒但”。
- source_word: with undivided heart
  choice: 同心合意
  rationale: 自然表达全体聚集时内心不分裂、目标一致的含义。
- source_word: burdensome
  choice: 增添负担
  rationale: 保留其可能涵盖经济、接待或其他实际拖累的宽泛含义，不具体化。
- source_word: testimony against themselves
  choice: 成为定他们罪的证据
  rationale: 传达司法性比喻中“作不利见证”的含义，同时保持对象是听众自身。
theological_decisions:
- issue: 对犹太教的批评范围
  choice: 按条件句译为拒听“向你们宣讲犹太教”的人
  alternative: 概括为对犹太人或犹太传统的一般性否定
  rationale: 原段针对特定教导及其与耶稣基督的关系，不应扩大为族群性谴责。
- issue: “前者或后者”与基督论标准
  choice: 保留两类人都必须讲论耶稣基督的对称结构
  alternative: 理解为只有未受割礼者受此检验
  rationale: 见证文本将两者并列，重点不在割礼身份本身，而在是否讲论耶稣基督。
- issue: “这世界之王”的身份
  choice: 保留称号，不在正文点名
  alternative: 直接译为“魔鬼”或“撒但”
  rationale: 虽通常被理解为敌对的属灵权势，保留原称号可避免将隐含所指变成明说。
- issue: 末句“证据”的功能
  choice: 译出不利、定罪性的司法含义
  alternative: 中性地译作“见证”
  rationale: “against themselves”明确表示这些话可能反过来指控听者，但具体审判场景仍不加说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原段强烈的对比、死亡意象、属灵争战措辞及段落间突兀的“并且”。鉴于所供 drafting basis 为公版英语见证，且希腊文直接复核尚待进行，本稿属于据见证形成的审慎出版草案；未据英语措辞擅自消除歧义。
