review_pass:
  verdict: revise
  source_fidelity: 需修订。草稿总体忠实保留了割礼身份与所传讲内容之间的对比，也没有把针对特定教导的警告扩大为对犹太族群的概括性论断。然而，“这世界之王”把希腊文所指的“这世代/时代”改成了“世界”，宜改正；末句将未明指的“这”具体化为“这些话”，并加入“不要让……成为”的使役表达，超过了原句和英语见证所能稳妥支持的范围。
  naturalness: 整体为自然、庄重的现代书面普通话。可将“你们却要全体聚集在一起”调整为“你们众人却要聚在一处”，更贴近“全体一同”的劝勉；“并且——”保留见证中的突兀衔接，但以脚注说明。
  terminology: “犹太教”“基督信仰”“受过割礼的人／未受割礼的人”“耶稣基督”等处理可取。“这世界之王”应改为“这世代的掌权者”，既避免把“世代”译作“世界”，也不擅自点明其身份。“作不利的见证”比“定他们罪的证据”更贴近原有司法比喻，并保留其具体含义的开放性。
  issues:
  - severity: medium
    issue: “这世界之王”未保留“这世代”的时间性表达。
    rationale: 此处传统希腊文本为“这世代的掌权者”（ὁ ἄρχων τοῦ αἰῶνος τούτου）；英语见证作“prince of this world”，但直接按原文复核时，不宜将“世代/时代”改为“世界”。
  - severity: medium
    issue: 末句将未明指代词具体化为“这些话”，并添加听者使其成为证据的表达。
    rationale: 原句仅祈愿“这”不成为他们不利的见证，未明确指定“这”究竟指何事；应在正文保留指代的开放性，不以脚注中的一种可能解释替代正文。
  - severity: low
    issue: “同心合意”略弱化“心不分裂/不分党”的意象。
    rationale: 可用“以不分裂的心”保留原文的心志合一而不分裂的形象，同时仍合现代汉语。
  revised_text: '但若有人向你们讲解犹太教，不要听他；因为，听一个受过割礼的人讲论基督信仰，胜过听一个未受割礼的人讲论犹太教。但若这两者不讲论耶稣基督，在我看来，他们就是墓碑和死人的坟墓，上面只刻着人的名字。


    所以，你们要避开这世代的掌权者的邪恶伎俩和阴谋，免得受他的图谋压迫，以致在爱中软弱。你们众人却要聚在一处，以不分裂的心。并且——[a]


    我感谢我的上帝，因为在你们中间我良心无愧；没有人能私下或公开夸口说，我在小事或大事上曾给任何人增添负担。我也为所有我曾与之交谈的人祈求，愿这不成为对他们不利的见证。[b]'
  revised_footnotes:
  - marker: a
    text: 所据见证在此以“并且”中断，下一段另起；译文保留这一突兀衔接。
    reason: 该断裂可能反映传本、段落划分或原有修辞结构，不宜擅自补足。
  - marker: b
    text: “这”在句中未明指何事，可能与作者的言谈、行为或前文所述情形有关；“对他们不利的见证”保留其司法性比喻，未具体化审判场景。
    reason: 原文的指代对象并不明确；译文及脚注均保留这一开放性。
  revision_rationale: 修订按原文优先校正“这世代的掌权者”，并把末句恢复为不具体化的“这”，避免把解释性内容写入正文。其余修订旨在更完整保留“不分裂的心”和“全体聚在一处”的措辞，同时维持英语见证中段末突兀“并且”的审计轨迹。
