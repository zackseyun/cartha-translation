base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/072.yaml
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they repent, if in repentance they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
translation:
  language: zh_hans
  text: '因此，我已经尽了自己的本分，作为一个为合一而预备的人。然而，哪里有分裂和愤怒，神就不住在那里。主赦免一切悔改、归回神的合一和主教的议事会[a]的人。我信靠耶稣基督的恩典；他必从你们身上除去一切捆绑。我劝你们：


    不要出于结党纷争而做任何事，却要照着基督的教导而行。因为我听见有些人说：“我若在档案[b]中找不到，就不信福音。”我对他们说：“经上写着。”他们却回答我：“这正是问题所在。”但对我来说，我的档案就是耶稣基督；那不可侵犯的档案，就是他的十字架、他的死、他的复活，以及借着他而有的信[c]。我渴望在这些事上，借着你们的祷告得以称义[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主教的议事会”直译为“主教的议事机构／议会”。该短语保留其归属关系及群体性，未把它简化为仅指服从主教个人。
    reason: 说明该制度性短语的语义范围，同时避免超出文本作教会制度上的断定。
  - marker: b
    text: “档案”对应原文反复使用的ἀρχεῖα，指可查验、可援引的权威记录或文献。其具体所指未必能够仅据本段确定为某一类经卷或文献集。
    reason: 保留原文的档案／凭据意象及其修辞反转，不预断其正典范围。
  - marker: c
    text: “借着他而有的信”保留原句的关系表达；在此不将其限定为“对他的信”或其他单一解释。
    reason: 避免在简短译文中消除该表达可能保有的语义开放性。
  - marker: d
    text: “称义”含有被判为正、获认可的司法性含义；本句同时明确将其置于收信人代祷的语境中。
    reason: 保留术语的神学和司法色彩，以及原文的代祷关联，而不附加系统性解释。
lexical_decisions:
- source_word: composed unto union
  choice: 致力于合一
  rationale: 表达此人自身已被导向、安顿于合一的状态与取向，避免生硬直译为“为合一而组成”。
- source_word: council of the bishop
  choice: 主教的议会
  rationale: 保留“council”的集体商议或会议含义，不擅自简化为对主教个人的服从；因源语言复核尚待完成，以脚注提示可能的理解。
- source_word: charters / charter
  choice: 文书
  rationale: 保留全段反复使用的法定、权威凭据意象；“文书”比“宪章”更适合此处可能指书面档案或权威文本的语境。
- source_word: strike off every fetter
  choice: 除去一切捆绑
  rationale: 以自然汉语保留解除锁链的比喻，涵盖属灵或群体性的束缚而不缩窄其指向。
- source_word: faith through Him
  choice: 借着他而有的信
  rationale: 保留介词关系的开放性，不明确限定为“对他的信”或“他的信实”。
- source_word: justified
  choice: 称义
  rationale: 保留早期基督教文本中司法与神学色彩兼具的用语，不弱化为一般性的“证明正确”。
theological_decisions:
- issue: 悔改、合一与赦免之间的关系
  choice: “凡悔改的人，主都赦免；只要他们悔改，归回……”
  alternative: “主赦免所有人，使他们悔改……”
  rationale: 依据所供见证，将归回神的合一及主教议会作为悔改的具体表现或条件，但不扩展为完整的赦罪制度论。
- issue: 神在分裂之处“不住”
  choice: 直译为“神就不住在那里”
  alternative: “神不喜悦那里”
  rationale: 保留原见证强烈的临在语言及其神学张力，不予缓和。
- issue: 权威文书与基督事件的关系
  choice: 保留“我的文书就是耶稣基督”及其后十字架、死与复活的并列
  alternative: 解释为“旧约圣经预言基督”
  rationale: 作者的修辞有意把权威凭据集中于基督及其救赎事件；不替读者判定对话者所指“文书”的精确正典范围。
- issue: “借着他而有的信”的主体与对象
  choice: 采用关系开放的表达
  alternative: “对他的信心”或“耶稣基督的信实”
  rationale: 当前仅有英文见证且希腊文复核待定，因此不预先解决可能的介词与主体歧义。
- issue: 借着收信人的祷告“得以称义”
  choice: 保留原句的代祷关联
  alternative: 改为“愿你们祷告，使我蒙神认可”
  rationale: 不消除称义与群体代祷并置所形成的神学张力，也不暗示祷告本身是称义的功德原因。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。句式力求清晰，保留“合一—分裂”“文书—基督”两组修辞对照及命令语气。由于所供 drafting basis 明示希腊文源语复核尚待完成，本稿以公共领域英文见证为临时依据，对关键不确定处作脚注，不伪称已经完成直接源语校勘。
