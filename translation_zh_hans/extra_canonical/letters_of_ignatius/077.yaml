  english_witness: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


    truly nailed up in the flesh for our sakes under Pontius Pilate and Herod the tetrarch (of which fruit are we--that is, of His most blessed passion); that He might set up an ensign unto all the ages through His resurrection, for His saints and faithful people, whether among Jews or among Gentiles, in one body of His Church.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/077.yaml
  text: 'I glorify Jesus Christ, the God who gave you such wisdom, because I have seen that you are established in unshakable faith, as though nailed to the cross of the Lord Jesus Christ in flesh and spirit, and firmly rooted in love in the blood of Christ. You are fully convinced concerning our Lord that he is truly descended from David according to the flesh, yet is the Son of God by divine will and power; that he was truly born of a virgin and baptized by John so that all righteousness might be fulfilled by him;


    that he was truly nailed up in the flesh for our sake under Pontius Pilate and Herod the tetrarch (of which we are the fruit—that is, of his most blessed suffering); and that through his resurrection he might raise a banner for all ages, for his saints and faithful people, whether among Jews or Gentiles, in the one body of his Church.'
translation:
  language: zh_hans
  text: '我将荣耀归给那位赐你们这般智慧的上帝耶稣基督；因为我看出，你们在信仰上坚定不移，仿佛在肉身和灵里都钉在主耶稣基督的十字架上，又借着基督的血，在爱中牢牢扎根。你们对我们的主确信不疑：按肉身说，他确实出于大卫的后裔；但凭上帝的旨意和能力，他是上帝的儿子；他确实由童贞女所生，受了约翰的洗，为要使一切的义都由他成全；


    在本丢·彼拉多和分封王希律执政时，他确实为我们的缘故，在肉身中被钉上十字架。我们正是这事所结的果子，也就是他至福受难所结的果子。借着复活，他要为历世历代竖起旗帜，召聚他的圣徒和忠信之民——无论是犹太人还是外族人——使他们同在他教会的一个身体里。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文暂依据所提供的公版英译见证及其所反映的中篇希腊文本传统拟定；希腊原文尚待直接复核。末句也可较贴近形式地译作：“借着他的复活，他要为历世历代竖起旗帜，给他的圣徒和忠信之民……，使他们同在他教会的一个身体里。”
    reason: 资料明确说明希腊语审校尚未完成；脚注公开交代文本基础，并保留末句目的、受益者与合一关系的句法不确定性。
lexical_decisions:
- source_word: δοξάζω / “give glory” (English witness)
  choice: 将荣耀归给
  rationale: 采用自然而庄重的现代汉语，也保留颂赞对象为耶稣基督的明确表达。
- source_word: Ἰησοῦν Χριστὸν τὸν θεόν / “Jesus Christ the God”
  choice: 上帝耶稣基督
  rationale: 保留见证文本对耶稣基督直接使用“上帝”称号的强烈基督论表述，不弱化为“属上帝的”。
- source_word: καθηλωμένους / “nailed”
  choice: 钉在
  rationale: 保留钉十字架的具体意象以及信徒与主受难相连的修辞力度。
- source_word: ἐν σαρκὶ καὶ πνεύματι / “in flesh and spirit”
  choice: 在肉身和灵里
  rationale: 不将其解释性改写为“身心”，以保存早期基督教文本中“肉身—灵”的表达张力。
- source_word: ἐρριζωμένους / “firmly rooted”
  choice: 牢牢扎根
  rationale: 用现代汉语自然呈现植物性隐喻，并保留稳固之意。
- source_word: κατὰ σάρκα / “according to the flesh”
  choice: 按肉身说
  rationale: 保留基督论公式的限定语，不简化为仅仅“血统上”。
- source_word: ἐκ γένους Δαυίδ / “of the race of David”
  choice: 出于大卫的后裔
  rationale: 以普通读者易懂的方式表达大卫家系，同时避免现代种族含义。
- source_word: βουλὴν καὶ δύναμιν θεοῦ / “divine will and power”
  choice: 上帝的旨意和能力
  rationale: 明确属格关系，并避免“神圣意志”可能产生的抽象或泛宗教色彩。
- source_word: πᾶσα δικαιοσύνη / “all righteousness”
  choice: 一切的义
  rationale: 保留与福音书传统相呼应的术语，不预先限定为“礼仪要求”或“上帝的计划”。
- source_word: τετραάρχου / “tetrarch”
  choice: 分封王
  rationale: 采用中文圣经及历史叙述中较通行且易懂的称谓。
- source_word: πάθος / “passion/suffering”
  choice: 受难
  rationale: 在基督受苦与死亡的语境中，“受难”比一般的“痛苦”更准确庄重。
- source_word: σύσσημον / “ensign/banner”
  choice: 旗帜
  rationale: 保留公开标志、召聚记号的意象，不直接解释成某一特定教义概念。
- source_word: ἐν ἑνὶ σώματι τῆς ἐκκλησίας αὐτοῦ / “in one body of his Church”
  choice: 同在他教会的一个身体里
  rationale: 保留“一个身体”和“教会”的双重意象以及合一重点。
theological_decisions:
- issue: “Jesus Christ the God”的神性称谓
  choice: 直译为“上帝耶稣基督”
  alternative: “耶稣基督，就是上帝”或弱化为“属上帝的耶稣基督”
  rationale: 英文见证明确将“God”同位地用于耶稣基督；直译既忠实，也避免加入解释性标点造成超过来源的强调。
- issue: 基督出于大卫与为上帝之子的并列表述
  choice: 保留“按肉身说……；但凭上帝的旨意和能力……”
  alternative: 将两者融合成后期系统神学措辞
  rationale: 保存文本自身对真实人性、家系和神子身份的并置及张力，不以宗派公式取代原文。
- issue: “all righteousness might be fulfilled by him”的施事关系
  choice: “使一切的义都由他成全”
  alternative: “使他成全一切的义”或“使一切正义在他身上实现”
  rationale: 英文见证的“by Him”可指由他作为施事者成全；当前译法保留这一点，同时不展开其救赎论机制。
- issue: 信徒是基督受难所结的果子
  choice: 明确回指“他至福受难所结的果子”
  alternative: 模糊译为“我们是这果子”
  rationale: 括注本身解释果子的来源；译文保留这一神学因果，但不进一步规定其圣礼或代赎含义。
- issue: 复活、旗帜与召聚的句法关系
  choice: 译为复活使旗帜竖起，并以“召聚”表达旗帜面向圣徒和忠信者的功能
  alternative: 仅作静态的“为他们竖起旗帜”
  rationale: “召聚”来自旗帜意象的自然语用，但因现有材料尚未直接核对希腊文，使用脚注提示句法可能性。
- issue: 犹太人与外族人在教会一个身体里的合一
  choice: 保留两个群体的对举及“一个身体”
  alternative: 概括为“所有民族”
  rationale: 原文的犹太人—外族人对举具有历史和神学意义，不应抹平。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，保留早期基督教书信的长句推进、受难与复活意象，以及“肉身”“义”“一个身体”等神学关键词。为可读性适度分句，但不将基督论和教会论张力改写成后期宗派术语。人名采用现代中文圣经常见形式“本丢·彼拉多”“希律”；“Gentiles”译作“外族人”，避免“外邦人”在普通现代读者中可能产生的贬抑语感。
