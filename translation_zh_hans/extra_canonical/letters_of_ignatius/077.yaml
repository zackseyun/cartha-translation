- from: '我将荣耀归给那位赐你们这般智慧的上帝耶稣基督；因为我看出，你们在信仰上坚定不移，仿佛在肉身和灵里都钉在主耶稣基督的十字架上，又借着基督的血，在爱中牢牢扎根。你们对我们的主确信不疑：按肉身说，他确实出于大卫的后裔；但凭上帝的旨意和能力，他是上帝的儿子；他确实由童贞女所生，受了约翰的洗，为要使一切的义都由他成全；


    在本丢·彼拉多和分封王希律执政时，他确实为我们的缘故，在肉身中被钉上十字架。我们正是这事所结的果子，也就是他至福受难所结的果子。借着复活，他要为历世历代竖起旗帜，召聚他的圣徒和忠信之民——无论是犹太人还是外族人——使他们同在他教会的一个身体里。[a]'
