review_pass:
  verdict: revise
  source_fidelity: 需修订。草稿大体传达了中篇希腊文本及英文见证的基督论、受难与教会合一内容，但若干处加入或改变了原句关系：将“出于大卫的家系”译作“出于大卫的后裔”不合现代汉语；“召聚”是对旗帜意象的解释性增添；末句将原有的介词性关系改作“使他们同在”也较为扩展。另“在爱中牢牢扎根”将“坚立/稳固”的语义替换为植物隐喻，宜收回。
  naturalness: “上帝耶稣基督”虽试图保留同位称谓，但在现代汉语中生硬且容易造成名称误解；“耶稣基督，就是……上帝”更自然，同时不减弱原文称耶稣为上帝的表述。“大卫的后裔”应配“是”或“出自大卫的家系”，不可说“出于大卫的后裔”。修订后保持庄重而清楚的现代书面语。
  terminology: 保留“肉身”“灵”“上帝的儿子”“童贞女”“义”“受难”“分封王”和“一个身体”等关键术语。将“外族人”保留为对ἔθνη/Gentiles的中性现代处理。采用“标志”对应σύσσημον，以免“旗帜”附带未明说的召聚动作。
  issues:
  - severity: medium
    issue: “出于大卫的后裔”表达不当
    rationale: ἐκ γένους Δαυίδ意为“出自大卫的家系／是大卫的后裔”。汉语“出于大卫的后裔”在语法和语义上都不自然。
  - severity: medium
    issue: 末句加入“召聚”并重构合一关系
    rationale: 原文说借复活竖立标志，并以“为／向他的圣徒和忠信之民”、以及“在犹太人中或在列邦中、在他教会的一个身体里”限定；“召聚”及“使他们同在”虽可作解释，却不是原文明说。
  - severity: low
    issue: 将“坚立、稳固”改为“扎根”
    rationale: ἡδρασμένους的核心是坚定、稳固；“扎根”虽通顺，却引入并非此词本身的植物性比喻。
  - severity: low
    issue: 脚注仍称希腊原文尚待直接复核，并以替代译文保留已可处理的句法不确定性
    rationale: 本次可依据所给中篇希腊文本传统直接核对；脚注应删除，以免错误陈述审校状态或把解释性“召聚”保留为正文选项。
  revised_text: '我把荣耀归给耶稣基督，就是那赐给你们如此智慧的上帝；因为我看出，你们在不可动摇的信心中已经坚立，仿佛在肉身和灵里都被钉在主耶稣基督的十字架上，并且在爱中、在基督的血里得以坚固。你们对于我们的主已经完全确信：他按肉身确实是大卫的后裔，按上帝的旨意和能力是上帝的儿子；他确实由童贞女而生，并受约翰施洗，好使一切的义都由他得以成全；



    他确实为我们的缘故，在肉身上被钉在十字架上，归在本丢·彼拉多和分封王希律之下；我们正是从他那蒙上帝赐福的受难所结的果子。这样，他好借着自己的复活，为万世竖立一个标志，给他的圣徒和忠信之民：无论在犹太人中或在外族人中，都在他教会的一个身体里。'
  revised_footnotes: []
  revision_rationale: 修订以中篇希腊文本传统所反映的句法为先，并与英文见证核对。保留“耶稣基督……上帝”的直接称谓，避免以弱化译法回避其同位表达；以“按肉身……按上帝的旨意和能力……”保存两个并列限定，不加入转折性的系统神学推论。末段恢复“标志”与复活、圣徒／忠信之民及一个身体之间较克制的关系，不把旗帜意象扩写为明确的“召聚”。删除已不准确的审校状态脚注。
