base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/082.yaml
  text: 'Let no one be deceived. Even the heavenly beings, the glory of the angels, and the rulers, visible and invisible—if they do not believe in the blood of Christ [who is God], judgment awaits them also. He who receives, let him receive. Let no one be puffed up by office, for faith and love are all in all, and nothing is preferred before them.


    But mark those who hold strange doctrine concerning the grace of Jesus Christ that came to us, how they are contrary to the mind of God. They have no care for love, none for the widow, none for the orphan, none for the afflicted, none for the prisoner, none for the hungry or thirsty. They abstain from the eucharist (thanksgiving) and prayer because they do not acknowledge that the eucharist is the flesh of our Savior Jesus Christ, which flesh suffered for our sins and which the Father, in His goodness, raised up.'
translation:
  language: zh_hans
  text: '不要受迷惑。即使是天上的众灵、天使的荣耀，以及可见与不可见的掌权者，若不信基督［他是上帝］的血，审判也在等候他们。能领受的，就让他领受吧。不要让任何人因职分而自高，因为信心和爱乃是一切，没有什么可置于它们之上。


    你们要留意那些对于临到我们的耶稣基督的恩典持异样教导的人，看他们怎样与上帝的心意相违。他们毫不顾念爱，也不顾念寡妇、孤儿、受苦的人、被囚的人，以及饥饿或口渴的人。他们拒绝参与圣餐[a]和祷告，因为他们不承认圣餐就是我们救主耶稣基督的肉；这肉曾为我们的罪受苦，父又以自己的良善使它复活。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣餐”所译的词原义为“感恩”；这里指基督徒共同举行的感恩礼。
    reason: 保留见证文本中“eucharist (thanksgiving)”的词义提示，同时采用现代中文通行的礼仪名称。
lexical_decisions:
- source_word: heavenly beings
  choice: 天上的众灵
  rationale: 见证文本所指范围并不完全明确；译作“众灵”可自然表达超世存在，同时避免将其与后文的天使和掌权者简单等同。
- source_word: rulers visible and invisible
  choice: 有形无形的掌权者
  rationale: 保留宇宙性权势的含义及“有形／无形”的对举，不把它具体化为世俗官长或某类灵体。
- source_word: office
  choice: 职分
  rationale: 表达教会中的身份、职位或事奉责任；比“官职”更适合早期基督徒群体语境。
- source_word: strange doctrine
  choice: 异样教导
  rationale: 保留对偏离所领受信仰之教导的批评，又不额外套用后世宗派术语。
- source_word: mind of God
  choice: 上帝的心意
  rationale: 现代汉语自然，并保留其与上帝旨意或意向相违的含义。
- source_word: eucharist (thanksgiving)
  choice: 圣餐[a]
  rationale: 采用现代读者熟悉的礼仪名称，并以脚注说明原词本义为“感恩”，避免在正文中造成生硬重复。
- source_word: flesh
  choice: 肉
  rationale: 直译具有反幻影论意义的关键实体词，不弱化为较宽泛的“身体”。
- source_word: raised up
  choice: 使它复活
  rationale: 在此明确指父使基督所取的肉身从死里复起；保留“父”为施动者。
theological_decisions:
- issue: “［他是上帝］”的文本状态
  choice: 保留方括号
  alternative: 无方括号并入正文，或删除该短语
  rationale: 所给见证明确用方括号标示该短语，可能反映文本恢复或传本问题；在尚未完成希腊文校勘前，不宜静默决定其原始性。
- issue: 不信基督之血的主语范围
  choice: 让条件句统摄前列的天上众灵、天使的荣耀及有形无形的掌权者
  alternative: 仅让“不信”修饰最后一类掌权者
  rationale: 英语见证的句法倾向于将条件应用于整个列举；中文以停顿和复句保持这一读法，但不进一步解释非人存在如何“信”。
- issue: “能领受的，就让他领受吧”的所指
  choice: 保留孤立而开放的劝语
  alternative: 明确解释为领受前述教训或领受某种启示
  rationale: 见证本身没有交代具体宾语；不应擅自消除其含混。
- issue: 圣餐与基督之肉的关系
  choice: 译作“圣餐就是……肉”
  alternative: 译作“圣餐象征／代表……肉”
  rationale: 原见证使用直接同一性表述；为保存其神学张力，不加入“象征”“本质转化”等后世解释框架。
- issue: “这肉……父使它复活”的指代
  choice: 保留“这肉”为受苦并复活者
  alternative: 改为“耶稣受苦，父使他复活”
  rationale: 原段反复强调“肉”，与作者反对否认真实受苦的论旨相关；不可在翻译中弱化。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。保留劝诫的直接语气、寡妇至饥渴者的排比，以及关于基督之肉受苦和复活的实体性措辞。由于所提供材料是公版英语见证，且希腊文源语审查尚待完成，本稿属基于见证的暂定译文；方括号明确保留文本不确定性。
