source:
  text: 'Let no man be deceived. Even the heavenly beings and the glory of the angels and the rulers visible and invisible, if they believe not in the blood of Christ [who is God], judgment awaiteth them also. He that receiveth let him receive. Let not office puff up any man; for faith and love are all in all, and nothing is preferred before them.


    But mark ye those who hold strange doctrine touching the grace of Jesus Christ which came to us, how that they are contrary to the mind of God. They have no care for love, none for the widow, none for the orphan, none for the afflicted, none for the prisoner, none for the hungry or thirsty. They abstain from eucharist (thanksgiving) and prayer, because they allow not that the eucharist is the flesh of our Savior Jesus Christ, which flesh suffered for our sins, and which the Father of His goodness raised up.'
