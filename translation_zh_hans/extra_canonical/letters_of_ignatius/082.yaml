- from: '不要受迷惑。即使是天上的众灵、天使的荣耀，以及有形无形的掌权者，若不信基督——［他是上帝］——的血，也同样有审判等候他们。能领受的，就让他领受吧。不要让任何人因职分而自高，因为信与爱就是一切，没有什么比它们更重要。


    你们要留意那些对临到我们的耶稣基督之恩典持异样教导的人，看他们怎样与上帝的心意相违。他们不关心爱，也不关心寡妇、孤儿、受苦的人、被囚的人，以及饥饿或口渴的人。他们不参加圣餐[a]和祷告，因为他们不承认圣餐就是我们救主耶稣基督的肉；这肉曾为我们的罪受苦，父又本着良善使它复活。'
