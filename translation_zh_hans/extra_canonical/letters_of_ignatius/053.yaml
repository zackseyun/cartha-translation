review_pass:
  verdict: revise
  source_fidelity: 需修订。草稿总体保留了称号、两处“我们的上帝”、罗马教会的“居首”以及过滤的意象；但末句将书信问安（πλεῖστα χαίρειν / “abundant greeting”）改成祝愿对方“满有喜乐”，改变了句子的交际功能。另有数处可更贴近希腊语：ἁγνοπρεπής宜表达为“以纯洁为美/相称”，而非“在纯洁上无愧”；ἀλλότριον χρῶμα的核心意象是“外来的杂色/异色”，不只是“污点”。
  naturalness: 原稿庄重可读，但“在罗马人地区的境内居首”略显翻译腔，“已经滤净一切外来的污点”也容易理解为主动滤除污点。修订为“在罗马人之地居于首位”及“从一切外来的杂色中滤清”，较自然且保留原有陌生意象。
  terminology: “提奥福罗斯”“我们的上帝”“居首”均可保留，并以脚注维持未决解释。“承载父的名”可改为“以父的名为名”，更准确反映πατρώνυμον的“以父名得名/冠父名”性质，而不预设额外神学解释。
  issues:
  - severity: medium
    issue: 末句把问安语改写为祝愿语。
    rationale: 原文及英文见证的“abundant greeting”是致意公式；“愿你们……满有喜乐”虽通顺，却不再是“向你们致以……问安”。
  - severity: medium
    issue: “在纯洁上无愧”未充分表达ἁγνοπρεπής。
    rationale: 该词指与纯洁相称、以纯洁为美或显出纯洁之美；“无愧”加入了原文未明说的道德评价框架。
  - severity: medium
    issue: “外来的污点”弱化并转移了χρῶμα的色彩意象。
    rationale: χρῶμα本义为颜色、色泽，语境中可喻指外来的杂染；译作“外来的杂色”并用脚注说明，更能保留过滤比喻和语义开放性。
  - severity: low
    issue: “承载父的名”不够清楚。
    rationale: πατρώνυμον更直接指“以父的名为名”或“冠父名”；修订可提高准确度，且不改变其修辞性的压缩表达。
  revised_text: '又称提奥福罗斯的伊格那提，写信给那在至高之父和他独生子耶稣基督的丰盛慈惠中蒙了怜悯的教会：这教会因那位定意使万有存在者的旨意，并借着对耶稣基督——我们的上帝——的信与爱，蒙爱并得光照；她在罗马人之地居于首位[b]，配得上帝，配得尊荣，配受称庆，配得赞美，配得成就，且以纯洁为美；她也在爱中居首[c]，遵行基督的律法，以父的名为名。我也奉父之子耶稣基督的名向这教会问安。


    我又向你们问安：你们在肉身和灵里都与他的每一条诫命联合，毫不动摇地充满上帝的恩典，并从一切外来的杂色中滤清[d]；愿你们在耶稣基督——我们的上帝——里面，无可指责地多多安好。'
  revised_footnotes:
  - marker: a
    text: “提奥福罗斯”是希腊语称号的音译，通常可理解为“承载上帝者”；按词形和古代用法，也有人理解为“被上帝承载者”。
    reason: 该称号具有真实的语义歧义，正文采用音译以免过早裁定。
  - marker: b
    text: “居于首位”也可译作“主持”或“居首”。这里没有进一步说明这种居首的具体性质或范围。
    reason: 避免把有争议的教会秩序用语解释成某种后世制度。
  - marker: c
    text: “在爱中居首”是高度凝练的表达，也可理解为“主持爱”或“在爱的团契中居首”；确切所指并不明确。
    reason: 保留该短语的语法和神学开放性。
  - marker: d
    text: “从……中滤清”保留了原文罕见的过滤比喻；“杂色”直译其“颜色、色泽”的意象，在此可指一切外来的混杂或染污。
    reason: 保留原文的色彩和过滤意象，避免将其单一化为普通的“洁净”或“除污”。
  revision_rationale: 修订以中期编订本希腊文的措辞为优先，并与所给英文见证核对。保留长串赞语、两次对基督为“我们的上帝”的称谓，以及两处“居首”的开放性。补出第二段开头的“我又向你们问安”，使汉语能承载原句中由“我问安的教会”转入“我向……致以丰盛问安”的结构，同时不把问安错误改写成单纯祝福。脚注a虽未在正文锚定，现保留会造成结构性无效；因此应在“提奥福罗斯”后加[a]。
