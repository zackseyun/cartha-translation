base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/053.yaml
  text: 'Ignatius, who is also called Theophorus, to the church that has found mercy in the generosity of the Most High Father and of Jesus Christ, his only Son; to the church beloved and enlightened through the will of him who willed all things that exist, by faith and love toward Jesus Christ our God; even to the church that has the presidency in the territory of the region of the Romans, worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father’s name; this church also I greet in the name of Jesus Christ, the Son of the Father. To those who in flesh and spirit are united to his every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain: abundant greeting in Jesus Christ our God, in blamelessness.'
translation:
  language: zh_hans
  text: '又称提奥福罗斯的伊格那提[a]，写信给那在至高之父和他独生子耶稣基督的丰盛慈惠中蒙了怜悯的教会。这教会因那位定意使万有存在者的旨意，在对耶稣基督——我们的上帝——的信与爱中蒙爱、得光照；她在罗马人地区的境内居首[b]，配得上帝，配得尊荣，配受称庆，配得赞美，配得亨通，在纯洁上无愧；她也在爱中居首[c]，遵行基督的律法，承载父的名。我也奉父之子耶稣基督的名向这教会问安。


    你们在肉身和灵里都与他的每一条诫命紧密相连，满有上帝的恩典，毫不动摇，并且已经滤净一切外来的污点[d]。愿你们在耶稣基督——我们的上帝——里面，无可指责地满有喜乐。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提奥福罗斯”是希腊语称号的音译，通常可理解为“承载上帝者”；在词形和古代用法上，也有人理解为“被上帝承载者”。
    reason: 该称号具有真实的语义歧义，正文采用音译以免过早裁定。
  - marker: b
    text: “居首”也可译作“主持”或“居于首位”。这里没有进一步说明这种居首的具体性质或范围。
    reason: 避免把有争议的教会秩序用语解释成某种后世制度。
  - marker: c
    text: “在爱中居首”原是高度凝练的表达，也可理解为“主持爱”或“在爱的团契中居首”；确切所指并不明确。
    reason: 保留该短语的语法和神学开放性。
  - marker: d
    text: “滤净”保留了原文见证中类似过滤的罕见比喻，意思是除去一切外来、混杂的污点。
    reason: 帮助读者理解刻意保留的陌生意象，而不在正文中将其普通化。
lexical_decisions:
- source_word: Theophorus
  choice: 提奥福罗斯
  rationale: 采用音译，避免在正文中把其可能含义“承载上帝者”或“被上帝承载者”单向定死；以脚注保留语义空间。
- source_word: hath the presidency / presidency
  choice: 居首
  rationale: 保留原文关于领先、主持或居于首位的表达，同时不擅自将其制度化为后世特定教会职权。
- source_word: filtered clear
  choice: 滤净
  rationale: 保留原文不寻常的过滤意象，而不改写成较普通的“洁净”或“摆脱”。
- source_word: our God
  choice: 我们的上帝
  rationale: 忠实保留原文对耶稣基督的直接称谓，不弱化为解释性说法。
- source_word: abundant greeting / plenteously rejoice
  choice: 满有喜乐
  rationale: 用自然现代汉语表达问安语中丰盛喜乐的语气；同时避免生硬照搬英语书信套语。
theological_decisions:
- issue: “耶稣基督——我们的上帝”这一称谓
  choice: 在两处均直接保留
  alternative: 译为“我们的主耶稣基督”或以脚注淡化
  rationale: 现有见证文本明确称耶稣基督为“我们的上帝”；翻译不应为配合某种神学体系而改写。
- issue: 罗马教会“居首”的性质
  choice: 保留“居首”，不说明其权力范围
  alternative: 译为“管辖”“主持众教会”或仅译为“著名”
  rationale: 原措辞可涉及领先、主持、尊位或座次，其具体教会论含义存在争议，正文不作超出文本的裁定。
- issue: “在爱中居首”的所指
  choice: 直译并保留开放性
  alternative: 解释为“领导爱筵”“统领爱德团契”或“以爱领导”
  rationale: “爱”可指爱德、基督徒共同体关系或更具体的实践；现有证据不足以排除其他理解。
- issue: 肉身和灵里的联合
  choice: 译为“在肉身和灵里都与他的每一条诫命紧密相连”
  alternative: 解释为教会制度上的完全合一或纯粹内在顺服
  rationale: 保留身体与灵性并列所形成的整体性，不将其限定为某一特定教义。
translation_notes:
  register: 采用现代、庄重而可朗读的书信体；长串赞语适度分句，但保留其礼仪性节奏和重复结构。由于所提供材料注明希腊语原文复核尚待完成，本稿按现有公共领域见证并参照其中标示的中期编订本传统拟定；涉及“遵行基督的律法，承载父的名”等措辞，正式出版前应与希腊文逐词核验。
