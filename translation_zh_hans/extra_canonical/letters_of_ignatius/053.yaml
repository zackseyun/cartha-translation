review_pass:
  verdict: revise
  source_fidelity: 需修订。“滤净一切外来的污点”将“被滤清、脱离一切异样色泽／杂质”的被动状态改成了以污点为直接宾语的主动清除，且遗漏了原文“色泽”这一刻意陌生的意象。末句的问安可更贴近书信公式。其余核心称谓、重复赞语及“居首”的开放性总体得到保留。
  naturalness: 整体庄重、可朗读，长句分层也清楚。“在纯洁上无愧”略偏解释性；改为“在纯洁上配得称许”可保留赞语并更自然。“承载父的名”不够合现代汉语习惯，改作“冠以父的名”较自然，同时仍保留该称谓性质。
  terminology: “提奥福罗斯”及其脚注适当保留语义歧义；两处“耶稣基督——我们的上帝”应维持。关于罗马教会的两层“居首”不宜制度化解释。χρῶμα本义为“色泽、颜色”，在此可能引申为异质混杂；正文和脚注均应让这一意象可见。
  issues:
  - severity: medium
    issue: “已经滤净一切外来的污点”改变了“filtered clear from every foreign stain/color”的句法关系，并弱化“色泽”意象。
    rationale: 原语的分词描述受书信人：他们已从一切异样的χρῶμα中被滤清／过滤出来；并非单纯说他们主动把污点滤掉。
  - severity: low
    issue: “在纯洁上无愧”比“worthy in purity”更具判定性。
    rationale: 该处属于连续的颂赞语；“配得称许”可较少增加“无愧”的法庭性含义。
  - severity: low
    issue: “承载父的名”搭配不够自然，且易与提奥福罗斯的“承载上帝者”混同。
    rationale: “冠以父的名”更自然地表达patronymic/以父之名为名，同时不对其具体神学含义作制度化解释。
