review_pass:
  verdict: revise
  source_fidelity: 依据所给英文见证，草稿总体保留了“一圣餐／一肉身／一杯／一祭坛／一监督”及末句劝勉的并列与合一主题。然而，“flesh”译为“身体”弱化了原词的肉身性；“使我们在他的血里合而为一”加入了原见证未明说的“我们”，并对关系作了较具体的展开；“照着上帝的旨意”则比“after God”更明确地加入“旨意”。由于直接希腊文复核尚待进行，修订保持英文见证所呈现的开放度。
  naturalness: “只守一个圣餐”在现代汉语中不够自然，也容易被理解为只举行一次或只遵守一项仪式。改为“务要持守同一圣餐礼”更自然，并可表达此处所强调的共同、合一的圣餐。职分并列关系亦改为“连同长老团和……执事”，使句法归属清楚。
  terminology: 保留“圣餐礼”“祭坛”“监督”。“监督”附注传统译名“主教”，但不把后世制度预设带入正文。“presbytery”译为“长老团”，较准确表达集体性。“flesh”译作“肉身”，避免与中文神学语境中较宽泛的“身体”混同。
  issues:
  - severity: medium
    issue: “一个身体”未充分对应 witness 的 “one flesh”。
    rationale: 英文见证明确用 flesh；在圣餐语境中，将其译为“肉身”较能保留具体性，且不预先将其抽象为“身体”。
  - severity: medium
    issue: “使我们在他的血里合而为一”对“one cup unto union in His blood”作了较强的主语和关系展开。
    rationale: “我们”并未在所给见证中明说；“使人……合一”虽仍属可行解释，却应以较开放的正文和脚注处理。
  - severity: low
    issue: “照着上帝的旨意”比“after God”更具体。
    rationale: “旨意”可作为解释性补足，但原表达较简约，宜译为“合乎上帝”，并在脚注说明。
  - severity: low
    issue: “只守一个圣餐”不够自然且可能产生数量上的误解。
    rationale: “持守同一圣餐礼”更符合现代汉语，也更适合此段的合一语境。
  revised_text: 因此，你们务要持守同一圣餐礼[a]；因为我们的主耶稣基督只有一个肉身，又有一杯，使人在他的血中合一[b]；也只有一个祭坛，正如只有一位监督[c]，连同长老团和那些与我同作仆人的执事。这样，你们无论做什么，都要做得合乎上帝[d]。
  revised_footnotes:
  - marker: a
    text: “圣餐礼”所对应的词本义为“感恩、感谢”，在早期基督徒文献中也用作圣餐礼的名称。“同一”表达本段所强调的合一，未规定本句以外的礼仪细节。
    reason: 保留 eucharist 的词源意义及本段的合一语境。
  - marker: b
    text: 原文见证可直译为：“一杯，为在他的血中的合一。”此语可指群体在基督之血中的合一，也可指与其血的联合；译文不进一步限定其神学含义。
    reason: 保留 unto union in His blood 的关系与范围歧义。
  - marker: c
    text: “监督”传统上也常译作“主教”；此处指当地教会的带领职分。“长老团”指由长老组成的群体。
    reason: 说明传统称谓，并保留 presbytery 的集体含义而不预设后世教阶制度。
  - marker: d
    text: 直译近于：“按着上帝去做”或“以合乎上帝的方式去做。”
    reason: 说明“合乎上帝”对 after God 的自然中文表达，避免增添“旨意”等原句未明说的内容。
  revision_rationale: 修订纠正“flesh”的语义弱化，收敛对“一杯……合一”和“after God”的解释性补足，并改善“只守一个圣餐”及职分并列的现代汉语表达。修订仍以所提供的公共领域英文见证为直接依据；希腊文本的句法、分词归属及术语细节有待直接复核。
