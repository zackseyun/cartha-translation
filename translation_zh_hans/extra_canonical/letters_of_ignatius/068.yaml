review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了英文见证中“一个身体、一个杯、一个祭坛、一位监督”的并列合一结构，也谨慎保留了“在他的血里联合”的关系。惟“只守一个圣餐”在中文中容易理解为每人只可守一次圣餐，未充分表达原文劝勉群体持守/举行同一圣餐礼的意思；“他们与我一同服事”也把“与我同作仆人”的限定对象泛化了。
  naturalness: “只守一个圣餐”搭配生硬且有歧义。“持守同一圣餐礼”较能表达群体礼仪合一，且为现代庄重汉语。末句改作“都合乎上帝”既自然，也保留“after God”未明说“旨意”的简约性。
  terminology: 保留“圣餐”“身体”“杯”“祭坛”“监督”“长老团”“执事”等译法。“长老团”比“众长老”更明确对应 presbytery 为长老组成的团体；脚注继续说明“监督”亦常译“主教”。
  issues:
  - severity: medium
    issue: “只守一个圣餐”可能被读作次数限制。
    rationale: 英文见证的 one Eucharist 在本段与一个祭坛、一个监督相连，强调教会共同体的合一；中文宜避免“只守一个”所造成的个体次数含义。
  - severity: medium
    issue: “他们与我一同服事”使“与我同作仆人”的指向不够明确。
    rationale: 见证的 my fellow-servants 紧随 deacons，宜译作“与我同作仆人的执事们”，避免将此语法限定无根据地扩及监督和长老团。
  - severity: low
    issue: “照着上帝的旨意”较原文见证增加“旨意”。
    rationale: after God 可自然表达为“合乎上帝”；这样避免把简约的“按着上帝”具体化为“旨意”。
  revised_text: 因此，你们务要持守同一圣餐礼[a]（因为我们的主耶稣基督只有一个身体，也只有一个杯，使人在他的血里合而为一[b]；只有一个祭坛，正如只有一位监督[c]，连同长老团和与我同作仆人的执事们），好使你们无论做什么，都合乎上帝[d]。
  revised_footnotes:
  - marker: a
    text: “圣餐”所对应的词本义为“感恩、感谢”，在早期基督徒文献中也用来称呼圣餐礼。“同一”表达本句与下文“一个祭坛”“一位监督”相连的合一强调。
    reason: 保留 eucharist 的词源及早期礼仪用法，并避免“只守一个”在中文中可能产生的次数限制含义。
  - marker: b
    text: 或译：“一个杯，使人联合于他的血。”
    reason: 保留 unto union in His blood 的结构歧义：既可强调群体在基督之血里的合一，也可强调与其血的联合。
  - marker: c
    text: “监督”传统上也常译作“主教”；这里指当地教会的一种带领职分。
    reason: 帮助读者辨认传统称谓，同时避免正文过早导入后世教阶制度。
  - marker: d
    text: 直译近于：“按着上帝去做”或“以合乎上帝的方式去做。”
    reason: 说明“都合乎上帝”是自然中文表达，并保留原句较简约的措辞。
  revision_rationale: 修订只处理中文语义和句法：以“持守同一圣餐礼”表达共同体合一，以“长老团”对应 presbytery，并将“与我同作仆人”明确连于执事。其余关键礼仪及职分术语均保留，未对圣餐、祭坛或监督职分加入超出见证文本的教义推论。
