base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/068.yaml
  text: Therefore, be careful to observe one Eucharist (for there is one flesh of our Lord Jesus Christ and one cup for union in his blood; there is one altar, just as there is one bishop, together with the presbytery and the deacons, my fellow servants), so that whatever you do, you may do it in accordance with God.
translation:
  language: zh_hans
  text: 因此，你们要留心，只守一个圣餐[a]（因为我们的主耶稣基督只有一个身体，只有一个杯，使我们在他的血里合而为一[b]；只有一个祭坛，正如只有一位监督[c]，并有众长老和众执事——他们与我一同服事），好使你们无论做什么，都照着上帝的旨意去做[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣餐”所对应的词本义为“感恩、感谢”，在早期基督徒文献中也用于称呼圣餐礼。
    reason: 保留 eucharist 的词源意义及早期礼仪用法。
  - marker: b
    text: 或译：“一个杯，使人联合于他的血。”
    reason: 保留 unto union in His blood 的结构歧义：既可强调群体在基督之血里的合一，也可强调与其血的联合。
  - marker: c
    text: “监督”传统上也常译作“主教”；这里指当地教会的一种带领职分。
    reason: 帮助读者辨认传统称谓，同时避免正文过早导入后世教阶制度。
  - marker: d
    text: 直译近于：“按着上帝去做”或“以合乎上帝的方式去做。”
    reason: 说明“照着上帝的旨意”是为自然中文所作的展开，并保留原句较简约的表达。
lexical_decisions:
- source_word: eucharist
  choice: 圣餐
  rationale: 采用现代中文读者较易理解且跨传统通行的称呼；原词也含“感恩”之意，故以脚注保留这一语义。
- source_word: one flesh
  choice: 一个身体
  rationale: 此处指基督的肉身，也与圣餐语境相连；中文用“身体”较自然，同时避免把原文的具体性抽象化。
- source_word: cup unto union in His blood
  choice: 一个杯，使我们在他的血里合而为一
  rationale: 保留“杯”“血”与“合一”的关系，不把合一具体限定为某一种系统神学解释。
- source_word: altar
  choice: 祭坛
  rationale: 直译礼仪空间用语，保留其与圣餐及群体合一之间的象征张力。
- source_word: bishop
  choice: 监督
  rationale: 以较贴近希腊教会职分词通常意义的中文表达，避免直接套用后世特定宗派的“主教”制度内涵。
- source_word: presbytery
  choice: 众长老
  rationale: 表达由长老组成的群体，而不是建筑、抽象制度或单一职分。
- source_word: after God
  choice: 照着上帝的旨意
  rationale: 原表述可指合乎上帝、按上帝而行；正文采用自然中文，脚注保留其简约和开放性。
theological_decisions:
- issue: “一个圣餐”所表达的合一
  choice: 保留“一”与教会职分并列的结构
  alternative: 解释为必须由某一位职分人员主持才有效
  rationale: 见证文本强调圣餐、祭坛和群体职分的合一，但未在本句明确建立完整的礼仪有效性理论，因此不作超出文本的推论。
- issue: “在他的血里合而为一”的关系
  choice: 保留“在……里”的参与性表达
  alternative: 译为“象征他的血”或“借他的血得救”
  rationale: 两种替代都可能预先解决原文在圣餐语境中的神学张力；当前译文不限定为纯象征或某一特定圣餐论。
- issue: bishop 的职分称谓
  choice: 监督
  alternative: 主教
  rationale: 在希腊原文尚待直接复核的前提下，采用较少导入后世制度含义的译名；同时用脚注说明可能的传统译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“只守一个圣餐”保留劝诫力度与合一主题；括号内依照原见证的层递结构排列“一个身体、一个杯、一个祭坛、一位监督”。由于直接希腊文复核尚待完成，本稿谨慎依据所给公共领域英文见证起草，不对潜在的希腊语句法和术语作过度确定的判断。
