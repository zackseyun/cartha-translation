base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/018.yaml
  text: 'For this reason the Lord received ointment on his head, so that he might breathe incorruption upon the church. Do not be anointed with the foul odor of the teaching of the prince of this world, so that he may not take you captive and rob you of the life set before you.


    Why do we not all walk wisely, receiving the knowledge of God, which is Jesus Christ? Why do we perish in our foolishness, not knowing the gift of grace that the Lord has truly sent?'
translation:
  language: zh_hans
  text: '为此，主的头受了膏抹，好让他把不朽的生命吹入教会。不要让这世界之王的教训以恶臭膏抹你们，免得他掳走你们，夺去那摆在你们面前的生命。


    我们为什么不都谨慎行事，领受对上帝的认识——这认识就是耶稣基督？我们为什么因愚昧而灭亡，不认识主真正赐下的恩典之礼呢？[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂依据所提供的公版英译见证翻译；希腊文中本段若干关键词及句法，尤其“不朽”“吹入”和“赐下／差来”，仍有待直接复核。
    reason: 用户材料明确说明源语言审查尚未完成；脚注如实标明文本基础及关键未决处。
lexical_decisions:
- source_word: ointment / anointed (Greek review pending)
  choice: 膏抹
  rationale: 保留本段围绕香膏、气味与受膏所形成的连续意象，同时采用现代中文教会内外均较易理解的表达。
- source_word: breathe incorruption upon
  choice: 把不朽的生命吹入
  rationale: “吹入”保留呼气、吹气的具体意象；补出“生命”使中文自然，也与下文“生命”呼应，但不把“不朽”简化为仅仅“不腐坏”。
- source_word: prince of this world
  choice: 这世界之王
  rationale: 以“王”表达统治者之义，保留其敌对性的称号，不额外点明身份，以免消除原文的修辞张力。
- source_word: walk prudently
  choice: 谨慎行事
  rationale: 将闪语式或希腊文常见的“行走”伦理用法译为自然现代汉语，同时保留审慎生活的含义。
- source_word: knowledge of God
  choice: 对上帝的认识
  rationale: “认识”兼顾知识与关系性认知，不译作纯粹抽象的“知识”。
- source_word: gift of grace
  choice: 恩典之礼
  rationale: 兼顾“恩典”与“礼物”两层意义，避免将其中任何一项吞并。
theological_decisions:
- issue: “对上帝的认识”与“耶稣基督”的同位关系
  choice: 这认识就是耶稣基督
  alternative: 领受上帝的知识，也就是耶稣基督
  rationale: 保留见证文本中将“上帝的认识”直接指向耶稣基督的强同位表达，不另行解释其基督论含义。
- issue: “不朽”是性质、状态还是生命
  choice: 不朽的生命
  alternative: 不朽；不腐朽
  rationale: 中文若只说“把不朽吹入”极不自然；结合下文生命主题补出“生命”，但以脚注说明源语言复核尚待完成。
- issue: 末句“主真正赐下”的宾语关系
  choice: 主真正赐下的恩典之礼
  alternative: 主确实差来的恩典恩赐
  rationale: 依据所提供见证的 sent 处理为“赐下”，避免赋予恩典礼物过强的位格化或使者色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。第一段尽量保留“膏抹—恶臭—吹入”的感官意象；第二段保持连续反问及劝诫力度。因现有材料仅提供公版英语见证，所有可能依赖希腊文精确词形与句法的判断均从谨处理。
