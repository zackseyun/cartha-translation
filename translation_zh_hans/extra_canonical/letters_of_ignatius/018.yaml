review_pass:
  verdict: revise
  source_fidelity: 草稿基本保留了段落的劝诫结构及“膏抹—气味”的意象，但有几处超出或偏离见证文本：将“不朽”补成“不朽的生命”，将“这世代的统治者”弱化且误作“这世界之王”，并将 sent 译为“赐下”。修订后不添加“生命”，并保留“差来”的派遣语义。
  naturalness: 修订稿采用自然、庄重的现代汉语。“不可受……所膏抹”虽保留略具陌生感的修辞，却与上下文的香膏意象相连；“明智地行事”清楚表达伦理性的“行走”。
  terminology: “香膏／膏抹”“不朽”“教会”“恩典的恩赐”保留关键语义及修辞联系。“这世代的统治者”较“这世界之王”更贴近原称号的时代性范围，且不预先判定其身份。
  issues:
  - severity: high
    issue: “把不朽的生命吹入教会”增添了“生命”。
    rationale: 见证文本为“breathe incorruption upon the church”；“不朽”本身可指不朽性／不腐坏，并未明说“生命”。补入“生命”会缩窄原句表述。
  - severity: medium
    issue: “这世界之王”不够准确。
    rationale: 该称号对应“这世代的统治者”（prince/ruler of this age）的表达；“王”改变称号，“世界”也弱化了“世代”的时间性含义。
  - severity: medium
    issue: “主真正赐下的恩典之礼”把 sent 的派遣语义改作赐予。
    rationale: 见证文本明确用 sent；宜保留“差来／差遣来”，即使其所指在句法及神学上仍有讨论空间。
  - severity: low
    issue: “以恶臭膏抹你们”使“教训”成为施膏主体，中文搭配较生硬。
    rationale: 改为“不可受……所膏抹”，既自然，又保存受膏的比喻及其与前句的呼应。
  revised_text: '为此，主让香膏抹在他头上，好向教会吹送不朽。不可受这世代的统治者之教训的恶臭所膏抹，免得他掳掠你们，夺去摆在你们面前的生命。


    我们为什么不都明智地行事，领受对上帝的认识——这认识就是耶稣基督？我们为什么在愚昧中灭亡，不认识主确实差来的恩典之恩赐呢？'
