base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/010.yaml
  text: 'But I have learned that certain people passed through you from elsewhere, bringing evil teaching; you did not allow them to sow seed in you, for you stopped your ears so that you might not receive the seed sown by them. For you are stones of a temple, prepared beforehand for a building of God the Father, being hoisted up to the heights through the lifting device of Jesus Christ, which is the cross, and using the Holy Spirit as a rope. Your faith is your windlass, and love is the way that leads up to God.


    Therefore, you are all companions on the way, carrying your God and your shrine, your Christ and your holy things, clothed from head to foot in the commandments of Jesus Christ. I too, taking part in the celebration, am permitted by letter to accompany you and rejoice with you, that you set not your love on anything after the common life of men, but only on God.'
translation:
  language: zh_hans
  text: '不过，我得知有些人从那里经过你们这里，带着邪恶的教导；你们没有容许他们在你们中间撒种。你们堵住耳朵，免得接受他们所撒的种子。因为你们是父神殿宇的石头，已经预备好，被用于建造父神的居所；你们借着耶稣基督的起重装置——就是十字架——被提升到高处，以圣灵为绳索。你们的信心是绞盘[a]，爱则是引人上到神那里的道路。


    所以，你们众人都是同路人，是承载神、承载圣殿、承载基督、承载圣物的人[b]；你们在各方面都以耶稣基督的诫命为装饰。我也参与这欢庆，获准借着书信与你们同行，并同你们一同欢喜，好叫你们不爱人们共同生活中的任何事物，只爱神。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绞盘”指借绳索提升重物的装置；这里延续建造殿宇的施工比喻。
    reason: 说明现代读者可能不熟悉的器具，并保留石头、起重装置、绳索与提升的连贯意象。
  - marker: b
    text: 原文用一组结构相同的称谓，直译可作“负载神者、负载圣殿者、负载基督者、负载圣物者”。这里译为“承载……的人”，以保留其身份称谓及平行修辞。
    reason: 说明中文为求自然所作的句法调整，且不把这组意象定为单一神学解释。
lexical_decisions:
- source_word: 'engine / lifting device (Greek source review pending; witness: μηχανή concept)'
  choice: 起重装置
  rationale: 保留建筑施工的整体比喻，又比“机器”更明确地表达将石头提升的功能。
- source_word: 'windlass (Greek source review pending; witness: ἀναγωγεύς concept)'
  choice: 绞盘
  rationale: 与绳索、起重装置和提升到高处的意象连贯；脚注补充其功能，避免现代读者误解。
- source_word: companions in the way
  choice: 同路人
  rationale: 自然简洁，兼顾共同前行和通往神之道路的上下文。
- source_word: carrying your God and your shrine, your Christ and your holy things
  choice: 承载着神，承载着圣殿，承载着基督，也承载着圣物
  rationale: 保留原句反复出现的“承载”修辞和四项并列，不把其神学意象改写为单一解释。
- source_word: arrayed from head to foot
  choice: 从头到脚都以……为装束
  rationale: 保留穿戴的形象，同时用现代汉语清楚表达全然遵行诫命。
theological_decisions:
- issue: 信徒与神、圣殿、基督、圣物的关系
  choice: 采用“承载着……”的意象性表达
  alternative: 译作“有神同在／是圣殿／属于基督／已经成圣”
  rationale: 见证文本使用一组密集而彼此平行的承载意象；不将其消解为某一种系统神学解释。
- issue: 十字架在建筑比喻中的作用
  choice: “耶稣基督的起重装置——就是十字架”
  alternative: “借耶稣基督，也就是借十字架”
  rationale: 明确保留十字架与起重装置的同位关系，使石头、绳索、绞盘的连续比喻可见。
- issue: 末句“只爱神”与世俗生活的对比
  choice: 将否定对象表达为世人通常生活方式所追求的事物
  alternative: “你们不爱属世的生活，只爱神”
  rationale: 避免把文本绝对化为否定日常生活本身，也不额外引入“属世”这一带有较强神学解释色彩的术语。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留撒种、殿宇石头、起重装置、绳索、绞盘、道路和穿戴等连续意象，并通过重复“承载着”再现原段的修辞力度。当前材料明确注明希腊文复核尚待完成，因此本稿以所供公版英文见证为基础，并对末句的歧义作脚注提示；出版定稿前应核对中编希腊文本。
