base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/049.yaml
  text: But if, as certain godless people—that is, unbelievers—say, he suffered only in appearance, while they themselves are mere appearances, why am I in chains? And why do I also desire to fight with wild beasts? Then I die for nothing. Truly, then, I lie against the Lord.
translation:
  language: zh_hans
  text: 但若照某些不敬虔的人——也就是不信的人——所说的，他只是在表面上受苦，而他们自己也不过是假象，那么我为什么还被锁链捆绑？我又为什么渴望与野兽搏斗？那么我就是徒然死去。如此说来，我确实是在对主说谎。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godless
  choice: 不敬虔的人
  rationale: 保留其宗教和道德层面的责难，同时避免使用可能显得过于现代意识形态化的“不信神者”。
- source_word: unbelievers
  choice: 不信的人
  rationale: 按原文解释性同位语直译，与“不敬虔的人”区分而又相互说明。
- source_word: suffered only in semblance
  choice: 只是在表面上受了苦
  rationale: 清楚表达其所谓受苦并非真实发生的主张，不额外引入后世教义术语。
- source_word: being themselves mere semblance
  choice: 而他们自己也不过是虚影
  rationale: 保留作者针对反对者的讽刺性文字呼应；“虚影”比“表象”更自然地指向人的虚幻不实。
- source_word: in bonds
  choice: 被锁链捆绑
  rationale: 既保留具体的囚禁意象，也符合现代汉语表达。
- source_word: fight with wild beasts
  choice: 与野兽搏斗
  rationale: 直接保留殉道语境中的竞技场意象。
- source_word: die in vain
  choice: 白白送死
  rationale: 自然有力地表达其死亡将毫无意义，与上下文的殉道期待相称。
- source_word: lie against the Lord
  choice: 说谎，作假见证毁谤主
  rationale: 该短语不仅可指一般说谎，也可能含有对主作虚假陈述或见证的意味；正文并列表达以保留语义张力。
theological_decisions:
- issue: 基督受苦的真实性
  choice: 他只是在表面上受了苦
  alternative: 他只是假装受苦
  rationale: “表面上”保留受苦仅为显现或假象的含义；不用“假装”，以免暗示这是基督主动欺骗。
- issue: 反对者“自己也不过是 semblance”的含义
  choice: 他们自己也不过是虚影
  alternative: 他们自己也不过是徒有其表
  rationale: 选择保留与前句“表面上”相关的存在性讽刺，不把它弱化为单纯的道德虚伪。
- issue: lie against the Lord 的指向
  choice: 我确实是在说谎，作假见证毁谤主
  alternative: 我确实是在说主的谎话
  rationale: 保留这句话可能同时涉及说谎、作假见证以及敌对主的含义，不武断限定为某一种句法关系。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留原段反问、反讽和层层推进的论证力度。由于希腊文直接复核尚未完成，本稿以所提供的公版英文见证和经审校的英文桥梁文本为依据；对“mere semblance”及“lie against the Lord”等可能受希腊文措辞影响之处采取审慎、保留张力的译法。
