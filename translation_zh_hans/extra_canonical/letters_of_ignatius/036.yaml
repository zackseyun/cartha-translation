review_pass:
  verdict: revise
  source_fidelity: 整体准确传达了所据英语见证的劝勉、职分称谓和末句的“肉身与灵”的联合。惟首段末尾“同心同行”并非见证原有内容，且会把“与监督、长老团及执事”的连带关系解释性地扩展为共同实践；应删除。将“在肉身和灵里”调整为“在肉身和灵方面”、将“因着信与爱”调整为“借着信和爱”，可更清楚保留原文连续列举的不同关系。
  naturalness: 原译庄重且总体通顺，但“如合宜编成之属灵花冠的众长老”修饰关系稍显生硬。“作为配合得宜、编成属灵冠冕的你们长老团”较自然，同时保留比喻，不将其化约为普通行政称谓。
  terminology: “监督、长老团、执事”适合保留早期教会职分的历史语境；“规条”“得以坚固”“合而为一”亦可。保留“按肉身说”的方括号文本信号，不对其作原始性判断。
  issues:
  - severity: medium
    issue: “同心同行”属增译
    rationale: 所据见证在列举监督、长老团和执事后即结束该句；“同心同行”加入了未明说的共同实践和一致性概念，改变了句末的语义重心。
  - severity: low
    issue: “属灵花冠”的中文修饰结构不够清晰
    rationale: 原句可能使读者难以辨明“花冠”是指长老团整体的比喻。调整语序可保留隐喻并提高可读性。
  revised_text: '所以，你们要竭力在主和使徒的规条上得以坚固，使你们无论做什么，都能在肉身和灵方面，借着信和爱，在子、父和圣灵里，自始至终，与你们所敬重的监督、作为配合得宜、编成属灵冠冕的你们长老团，以及按着上帝而行的执事们一同亨通。[a]


    你们要顺服监督，也要彼此顺服，正如耶稣基督顺服父［按肉身说］，[b]使徒也顺服基督和父，好使肉身与灵都合而为一。'
  revised_footnotes:
  - marker: a
    text: 本段依据所提供的公版英语见证暂译；中古希腊文传统的直接校勘尚待完成。“编成属灵冠冕”保留了以长老团比作配合编成之冠冕的隐喻。
    reason: 交代间接起草依据，并说明原文较不寻常的长老团／冠冕比喻。
  - marker: b
    text: “按肉身说”在所据见证中以方括号标出；此处照样保留，作为文本状态的提示。
    reason: 保存供应材料所标明的文本信号，不静默判定该短语的原始性。
  revision_rationale: 删除无来源的“同心同行”，并重整首句的并列短语和长老团隐喻，使译文更贴近所据见证、语法关系更清晰。其余关键术语及方括号限定语均予保留。
