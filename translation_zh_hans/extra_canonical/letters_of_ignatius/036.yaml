base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/036.yaml
  text: 'Therefore, make every effort to be firmly established in the ordinances of the Lord and of the apostles, so that you may prosper in everything you do, in flesh and spirit, through faith and love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, just as Jesus Christ was to the Father [according to the flesh], and as the apostles were to Christ and to the Father, so that there may be union of both flesh and spirit.'
translation:
  language: zh_hans
  text: '所以，你们要竭力在主和使徒的规条上得以坚固，使你们无论做什么，在肉身和灵里，都能因着信与爱而亨通；在子与父并圣灵里，自始至终，与你们所敬重的监督、如合宜编成之属灵花冠的众长老，以及按着上帝而行的执事们同心同行。[a]


    你们要顺服监督，也要彼此顺服，正如耶稣基督顺服父［按肉身说］，[b]使徒也顺服基督和父，好使肉身与灵都合而为一。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段依据所提供的公版英语见证暂译；中古希腊文传统的直接校勘尚待完成。‘属灵花冠’保留了众长老如编成环冠的比喻。
    reason: 交代间接起草依据，并帮助读者理解较不寻常的群体隐喻。
  - marker: b
    text: “按肉身说”在所据见证中以方括号标出；此处照样保留，作为文本状态的提示。
    reason: 保存供应材料所标明的文本信号，不静默判定该短语的原始性。
lexical_decisions:
- source_word: ordinances
  choice: 规条
  rationale: 保留其作为主和使徒所传规范、教导或安排的宽泛含义，不缩窄为礼仪或行政条例。
- source_word: be confirmed
  choice: 得以坚固
  rationale: 表达被建立、站立稳固的被动意味，同时符合现代汉语宗教文体。
- source_word: prosper
  choice: 亨通
  rationale: 保留行事顺遂、达成善果的含义，避免仅理解为物质兴旺。
- source_word: presbytery
  choice: 众长老
  rationale: 在此指由长老构成的群体；用普通读者较易理解的表达，而不采用可能陌生的音译或制度术语。
- source_word: fitly wreathed spiritual circlet
  choice: 如合宜编成之属灵花冠
  rationale: 尽量保留原见证中花冠/环冠的群体隐喻及‘合宜编成’之意，不将其平直化为单纯的长老团。
- source_word: walk after God
  choice: 按着上帝而行
  rationale: 保留‘行走’作为生活方式的圣经式隐喻，并避免把关系具体化为‘效法’或‘跟随’中的单一解释。
- source_word: union
  choice: 合而为一
  rationale: 自然表达联合与一致，同时保留肉身和灵两个层面的张力。
theological_decisions:
- issue: ‘在子与父并圣灵里’的关系
  choice: 依照见证保留三者并列及‘在……里’的表达
  alternative: 改写为更明确的三一论公式
  rationale: 原文见证的句法关系较紧密且直接希腊文复核尚待进行，不宜以系统神学措辞替代。
- issue: 耶稣基督顺服父的限定语
  choice: 保留［按肉身说］并以方括号标示
  alternative: 直接纳入正文而不标示，或删除
  rationale: 供应材料明确要求保留这一文本信号；括号也维持其文本状态及基督论张力。
- issue: 对监督与彼此的顺服
  choice: 将两个对象并列保留
  alternative: 把彼此顺服解释为仅透过监督实现
  rationale: 不把原见证的并列关系导向特定教会制度立场。
- issue: 肉身与灵的联合
  choice: 译作‘肉身与灵都合而为一’
  alternative: 解释为教会中有形与属灵层面的统一
  rationale: 保持原有歧义，不明确限定其所指是个人、群体或教会秩序。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。以‘监督、长老、执事’呈现早期教会职分；句式适度保留原段落的层叠结构，但加入必要停顿以便普通读者理解。鉴于直接希腊文审查尚待完成，本稿避免对不寻常介词结构和修辞隐喻作过度确定的解释。
