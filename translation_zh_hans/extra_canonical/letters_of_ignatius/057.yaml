base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/057.yaml
  text: 'I write to all the churches, and I want everyone to know that I willingly die for God—unless you hinder me. I urge you: do not show me kindness at the wrong time. Let me be given to the wild beasts, for through them I can reach God. I am God’s wheat, and I am ground by the teeth of wild beasts so that I may be found to be pure bread [of Christ].


    Instead, entice the wild beasts, so that they may become my grave and leave no part of my body behind. Then, when I have fallen asleep, I will not be a burden to anyone. I will truly be a disciple of Jesus Christ when the world does not even see my body. Plead with the Lord for me, so that through these instruments I may be found to be a sacrifice to God.


    I do not command you as Peter and Paul did. They were apostles; I am a convict. They were free, but I am a servant even to this hour. Yet if I suffer, then I will be a freedman of Jesus Christ, and I will rise free in him. Now, in my chains, I am learning to put away every desire.'
translation:
  language: zh_hans
  text: '我写信给众教会，也吩咐众人知晓：我甘愿为了上帝而死，除非你们拦阻我。我劝你们：不要在不合时宜的时候向我示好。请让我成为野兽的食物；因为我能借着它们得以归向上帝。我是上帝的麦子，要被野兽的牙齿磨碎，好使我成为纯净的［基督的］饼。[a]


    倒要设法引来野兽，使它们成为我的坟墓，不留下我身体的任何部分；这样，在我睡去以后，我就不会成为任何人的负担。等到世人连我的身体也看不见时，我才真正成为耶稣基督的门徒。请为我祈求主，使我借着这些器具得以成为献给上帝的祭物。


    我不像彼得和保罗那样吩咐你们。他们是使徒，我是被定罪的人；他们是自由人，我直到如今还是奴隶。然而，我若受苦，就会成为耶稣基督所释放的人，并要在他里面复活，成为自由的人。如今我被锁链捆绑，正在学习不再贪恋任何事物。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督的”在所据英文见证中置于方括号内，表示这几个字的文本归属存在不确定性；此处照样保留。
    reason: 保留见证中的文本恢复标记，不把有疑问的词语当作无争议正文。
lexical_decisions:
- source_word: ἀποθανεῖν / die (witness)
  choice: 死
  rationale: 直译其殉道语境中的实际死亡，不以“牺牲”替代，以免提前引入祭祀解释。
- source_word: ἐπιτυχεῖν θεοῦ / attain unto God (witness)
  choice: 到达上帝那里
  rationale: 保留“达到、抵达上帝”的强烈空间性隐喻，同时使用现代汉语可理解的表达。
- source_word: σῖτός εἰμι θεοῦ / I am God’s wheat
  choice: 我是上帝的麦子
  rationale: 保留原文鲜明的麦粒与磨饼意象，不改写为抽象的属灵成长语言。
- source_word: θηρίων / wild beasts
  choice: 野兽
  rationale: 符合罗马竞技场处刑背景，也比“猛兽”更贴近通行的早期基督教文献措辞。
- source_word: κατάκριτος / convict (witness)
  choice: 囚犯
  rationale: 在此强调被定罪、受拘押的身份；“罪犯”可能造成道德犯罪的额外暗示。
- source_word: ἀπελεύθερος / freedman
  choice: 所释放的人
  rationale: 表达由奴役获得释放者的身份，避免“自由民”在现代汉语中仅被理解为固定社会阶层。
- source_word: ἐπιθυμίαν / desire
  choice: 欲望
  rationale: 保留宽泛而未限定对象的含义，不擅自收窄为肉欲、私欲或求生欲。
theological_decisions:
- issue: “借着野兽到达上帝”与殉道的关系
  choice: 保留作者直接而强烈的因果表达
  alternative: 弱化为“借此更亲近上帝”
  rationale: 原有见证将受难与“达到上帝”直接联系；译文不应将其系统化，也不应因现代顾虑而削弱。
- issue: “纯净之饼”后的“基督的”
  choice: 用全角方括号保留为［基督的］并加脚注标记
  alternative: 直接纳入正文或完全删除
  rationale: 所供见证明确以方括号标示文本恢复的不确定性；正文需保存这一文本状态。
- issue: “真正成为耶稣基督的门徒”
  choice: 按条件性语势直译
  alternative: 解释为“证明自己早已是真门徒”
  rationale: 保留作者在殉道完成与门徒身份之间制造的神学张力，不替作者化解。
- issue: “在他里面复起，成为自由的人”
  choice: 保留可同时联想到复活和获释的表达
  alternative: 明确译为“在他里面自由地复活”
  rationale: 英译见证中的“rise free in him”可能兼具复起/复活与自由的含义；在希腊语复核前不宜过度确定句法关系。
- issue: “除去一切欲望”
  choice: 不限定欲望的性质
  alternative: 译作“弃绝一切世俗欲望”
  rationale: 避免把禁欲主义或特定伦理分类加入未限定的表述。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“容许我”“被显明为”“恳求”等措辞保留书信劝勉与殉道见证的肃穆感，同时避免文言化。段落和对偶结构依照所供见证。由于项目注明希腊语源文复核尚待进行，本稿以中期校订本传统的公开英文见证及英语POB为咨询层，凡可能涉及希腊语句法或文本异文之处均采取保守译法并加注说明。
