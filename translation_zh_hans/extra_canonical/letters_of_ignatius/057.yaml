- from: '我写信给众教会，也要让所有人知道：我甘愿为上帝而死——除非你们阻止我。我劝你们：不要在不合时宜的时候向我施恩。容许我被交给野兽吧，因为我能借着它们到达上帝那里。我是上帝的麦子，经野兽的牙齿磨碎，好使我被显明为［基督的］纯净之饼。[a]


