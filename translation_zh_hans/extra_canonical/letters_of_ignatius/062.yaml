base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/062.yaml
  text: 'Remember in your prayers the church in Syria, which has God as its shepherd in my place. Jesus Christ alone will be its bishop—he and your love.


    But I am ashamed to be called one of them, for I am not worthy, being the very last of them and an untimely birth. Yet I have found mercy so that I may be someone, if indeed I attain to God.


    My spirit greets you, as does the love of the churches that received me in the name of Jesus Christ, not as a mere traveler. For even the churches that were not on my route according to the flesh went ahead of me from city to city.'
translation:
  language: zh_hans
  text: '你们祷告时，要记念在叙利亚的教会；上帝代替我作它的牧者。唯有耶稣基督要照管它，你们的爱也要如此[a]。


    至于我，我羞于被称为他们中的一员；因为我不配，是他们中最末后的，又是一个流产之胎[b]。然而，我蒙了怜悯，得以成为某个人[c]，只要我得以归到上帝那里[d]。


    我的灵向你们问安；那些奉耶稣基督的名接待我的众教会的爱，也向你们问安。他们接待我，并不只是把我当作一个过路人；因为就连那些不在我按肉身所行的路上的教会，也一城一城地走在我前面[e]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句可直译为“唯有耶稣基督和你们的爱将照管它”。“你们的爱”既可能指罗马信徒对叙利亚教会的爱，也可能是对罗马教会的称呼；其具体指向未能完全确定。
    reason: 澄清并列主语及“你们的爱”的指向歧义，不将其人格化或制度化。
  - marker: b
    text: “流产之胎”译自一个强烈的非正常出生意象，用于作者自谦；也有译作“未及产期而生的人”。
    reason: 保留原词的力度，并说明较缓和的译法。
  - marker: c
    text: 这里较直地说“成为某个人”或“算得上一个人”；并未明确表示“有用”。
    reason: 避免把原文宽泛表达解释为功用或价值判断。
  - marker: d
    text: “归到上帝那里”在本书信语境中可能暗指作者藉死亡或殉道归向上帝，但正文不把这种含义确定化。
    reason: 保留语境中的可能暗示而不扩写。
  - marker: e
    text: “按肉身所行的路”指实际的地理行程。“走在我前面”所指的具体行动未明；可能与沿途的接待或支持有关，但文本没有明说“迎接”。
    reason: 解释字面行程语汇，并移除原稿所补入的具体情节。
lexical_decisions:
- source_word: ποιμήν / shepherd（据现有英译见证）
  choice: 牧养……的是上帝
  rationale: 保留牧者意象，同时用现代汉语的动词结构避免“以上帝为牧人”略显生硬；原始希腊文尚待直接复核。
- source_word: ἐπίσκοπος / bishop（据现有英译见证）
  choice: 监督
  rationale: 采用该词在早期基督教语境中的基本职分含义，不直接套用后世宗派化称谓。
- source_word: ἔκτρωμα / untimely birth（据现有英译见证）
  choice: 未到产期而生的人
  rationale: 保存保罗式的强烈自谦和非正常出生意象，不弱化为一般的“后来者”。
- source_word: τις εἶναι / be someone（据现有英译见证）
  choice: 成为一个有用的人
  rationale: 使现代汉语通顺，但该短语也可能只是“算得上一个人”；以脚注保留不确定性。
- source_word: κατὰ σάρκα / according to the flesh（据现有英译见证）
  choice: 按肉身的行程来说
  rationale: 结合上下文表达现实地理路线，同时保留“按肉身”这一原文张力。
theological_decisions:
- issue: 上帝、基督与罗马信徒之爱的牧养关系
  choice: “惟有耶稣基督要作它的监督——他和你们的爱”
  alternative: “惟有耶稣基督和你们的爱要作它的监督”
  rationale: 保留见证文本中突兀的并列和神学张力，不把“你们的爱”擅自人格化或制度化；用脚注说明句法歧义。
- issue: “到达上帝那里”的含义
  choice: 直译为“到达上帝那里”
  alternative: 解释为“藉殉道与上帝联合”
  rationale: 上下文很可能指向殉道，但正文不把隐含意义扩写为确定教义。
- issue: 教会职分名称
  choice: 译作“监督”
  alternative: 译作“主教”
  rationale: 避免把二世纪语境中的ἐπίσκοπος自动等同于后世成熟的主教制度。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“上帝”统一指God；“监督”用于早期教会职分。由于所提供材料明确标注希腊文审校尚待进行，本稿以公版英译见证和英文POB为桥梁，所有希腊词判断均属待源文复核的暂定意见。
