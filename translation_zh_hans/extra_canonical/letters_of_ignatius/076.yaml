base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/076.yaml
  text: 'Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ the Beloved, which has been mercifully endowed with every grace, being filled with faith and love and lacking in no grace, most reverend and bearing holy treasures; to the church which is in Smyrna of Asia, in a blameless spirit and in the word of God: abundant greeting.'
translation:
  language: zh_hans
  text: 又名“提奥福罗斯”的伊格那修，致信给父上帝和蒙爱的耶稣基督的教会，就是亚细亚士每拿的教会。她蒙怜悯，得着各样恩典，充满信心和爱，毫不缺少任何恩赐；她极其可敬，承载着圣洁的珍宝。愿你们在无可指摘的灵里，并在上帝的话语中，满得喜乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus
  choice: 提奥福罗斯
  rationale: 保留称号的音译，避免在希腊文复核尚未完成时武断选定“上帝的承载者”或“蒙上帝承载者”等有歧义的词源释义。
- source_word: church
  choice: 教会
  rationale: 采用现代汉语基督教文献中自然且通行的群体称谓。
- source_word: mercifully endowed with every grace
  choice: 蒙怜悯，得着各样恩典
  rationale: 分别保留怜悯与恩典两个概念，并使中文句法清楚自然。
- source_word: bearing holy treasures
  choice: 承载着圣洁的珍宝
  rationale: 维持原见证文本的比喻，不擅自判定珍宝具体指人、礼仪或属灵恩赐。
- source_word: abundant greeting
  choice: 满得喜乐
  rationale: 按早期基督教书信问安语的语用作自然表达，同时保留“丰盛、充满”的程度意味。
theological_decisions:
- issue: “父上帝和蒙爱的耶稣基督的教会”所表达的所属关系
  choice: 父上帝和蒙爱的耶稣基督的教会
  alternative: 属于父上帝、也属于蒙爱的耶稣基督的教会
  rationale: 保留见证文本紧密而略有张力的并列结构，不额外展开其基督论关系。
- issue: “in a blameless spirit”中“灵”的所指
  choice: 在无可指摘的灵里
  alternative: 怀着无可指摘的心灵
  rationale: 不把“灵”明确限定为人的态度、群体状态或圣灵，以保存原表达可能具有的歧义。
- issue: “grace”与“gift”的关系
  choice: 前者译“恩典”，后者译“恩赐”
  alternative: 两处均译“恩典”
  rationale: 英文见证在重复中可能兼有恩惠与具体赋予之物的语义；采用相关但不同的中文词，使修辞不显机械，同时不引入特定恩赐清单。
translation_notes:
  register: 采用现代、庄重而易懂的书信题署体。鉴于所给材料明确说明希腊文复核尚待完成，本稿主要依据公共领域英文见证及其所反映的中期校订本传统起草；专名与可能有歧义的神学表达从审慎处理。
