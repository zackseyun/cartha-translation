review_pass:
  verdict: revise
  source_fidelity: 需要修订。草稿将“我为……的人献上自己”弱化了ἀντίψυχον所含的“以己命作保证／替代”的强烈委身语气；又把“as God is with you”解释为“正如上帝恒久忍耐你们一样”，添加了原句未明说的谓语，改变了意思。πάρεδρος不宜译为“同席者”，因其主要指侍立在旁的助手、随员，亦可带顾问或评议者之意。
  naturalness: 整体庄重流畅，排比和军事意象也自然。修订后以“为……舍命作保”“侍从”及“正如上帝也与你们同在”表达，可更准确且仍符合现代标准汉语。
  terminology: “主教、长老、执事”“洗礼、信心、爱、忍耐”等术语可保留。“管家、侍从和仆役”较准确地对应三个并列的服事身份；不把统帅明确等同于某一对象，以保留文本的修辞表达。
  issues:
  - severity: high
    issue: 末句将“上帝与你们同在”改释为“上帝恒久忍耐你们”。
    rationale: 英文见证明载“as God is with you”；该句并未重复“忍耐”的谓语。这样的补足虽可能出于上下文联想，却改变了明示内容，必须恢复其开放而直接的表述。
  - severity: medium
    issue: “我愿为……献上自己”未充分表达ἀντίψυχον的担保／以命相代意象。
    rationale: 此词比一般的“委身”或“献上自己”更强，宜译作“我愿为……舍命作保”，同时不将其系统化为特定救赎论。
  - severity: medium
    issue: “同席者”误导性较强。
    rationale: πάρεδρος字面为“坐在旁边者”，在此类行政或服事语境中可指助手、侍从、顾问或评议者；“同席者”在现代汉语中较易被理解为共同用餐者。
  - severity: low
    issue: “上帝也留心看顾你们”略强化为保护、照料。
    rationale: 对应的动词与开头“留心”相同，宜在汉语中保持“垂顾／留心”的对应，避免额外加入“看顾”的牧养含义。
  revised_text: '你们要留心听从主教，好叫上帝也垂顾你们。我愿为那些顺服主教、长老和执事的人舍命作保。愿我在上帝面前得以与他们同有一份。你们要彼此一同劳苦，一同奋战，一同奔跑，一同受苦，一同躺卧，一同起来，作上帝的管家、侍从[a]和仆役。


    要使你们所服役的统帅喜悦；你们也要从他那里领受军饷。你们中间不可有人被发现是逃兵。要让你们的洗礼常与你们同在，作盾牌；信心作头盔；爱作长矛；忍耐作护身甲。要让你们的善行成为存款，好使你们领取应得的资产[b]。所以，你们要温柔地彼此恒久忍耐，正如上帝也与你们同在。愿我常常因你们而喜乐。'
  revised_footnotes:
  - marker: a
    text: “侍从”对应的词字面有“坐在旁边者”之意；按语境也可译为“助手”“随员”“顾问”或“评议者”。
    reason: 保留该职务或服事称谓的语义范围，避免“同席者”所带来的共餐含义。
  - marker: b
    text: “存款……资产”延续财务比喻，也可译作“押存……应得之物”。这里没有进一步说明所领取之物的具体性质。
    reason: 保留报偿意象及其歧义，不擅自解释为某种特定的末世赏赐或功德机制。
  revision_rationale: 本次修订恢复了“上帝也与你们同在”的明示语义，纠正了对并列职分称谓的误导性译法，并更充分表达“我为……作保”的强烈自我担保语气。其余军事与财务比喻、排比节奏及未明确的神学指向均予保留。
