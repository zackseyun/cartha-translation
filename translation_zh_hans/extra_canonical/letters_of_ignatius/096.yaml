base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/096.yaml
  text: 'Give heed to the bishop, that God also may give heed to you. I am devoted to those who are subject to the bishop, the presbyters, and the deacons. May it be granted me to have my portion with them in the presence of God. Toil together with one another, struggle together, run together, suffer together, lie down together, rise up together, as God’s stewards, assessors, and ministers.


    Please the Captain in whose army you serve, from whom also you will receive your pay. Let none of you be found a deserter. Let your baptism abide with you as your shield; your faith as your helmet; your love as your spear; your patience as your body armor. Let your works be your deposits, that you may receive your assets due to you. Be therefore long-suffering with one another in gentleness, as God is with you. May I have joy of you always.'
translation:
  language: zh_hans
  text: '你们要留心听从主教，好让上帝也留心看顾你们。我愿为那些顺服主教、众长老和众执事的人献上自己。愿我在上帝面前得以与他们同有一份。你们要彼此一同劳苦，一同奋战，一同奔跑，一同受苦，一同躺卧，一同起来，作上帝的管家、同席者[a]和仆役。


    要使你们所服役的统帅喜悦；你们也要从他那里领受军饷。你们中间不可有人被发现是逃兵。要让你们的洗礼常与你们同在，作盾牌；信心作头盔；爱作长矛；忍耐作护身甲。要让你们的善行成为存款，好使你们领取应得的资产[b]。所以，你们要温柔地彼此恒久忍耐，正如上帝恒久忍耐你们一样。愿我常常因你们而喜乐。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同席者”所对应的词在这里含义不够确定，也可理解为“伙伴”“同工”或“评议者”。本译文依照现有英文见证保留其与“管家、仆役”并列的身份意味。
    reason: 当前材料注明希腊文复核尚待进行，而英文 witness 的 assessors 在现代汉语中若直译为“评议员”容易造成制度化误解。
  - marker: b
    text: “存款……资产”延续财务比喻，也可译作“押金……应得之物”。这里没有进一步说明所领取的具体是什么。
    reason: 保留原文报偿意象及其真实歧义，避免擅自解释为某一种确定的末世赏赐或功德机制。
lexical_decisions:
- source_word: Give ye heed / subject to
  choice: 留心听从／顺服
  rationale: 分别保留开头劝勉的注意与听从含义，以及后句所强调的服从关系；不把两处机械译成同一词。
- source_word: presbyters
  choice: 众长老
  rationale: 采用早期基督教职分的通行现代汉语称呼，并用“众”保留复数。
- source_word: deacons
  choice: 众执事
  rationale: 采用现代汉语教会语境中清楚而广泛通行的职分名称。
- source_word: I am devoted to
  choice: 我愿……献上自己
  rationale: 表达原见证中强烈的自我委身语气，同时避免误解为一般性的喜爱。
- source_word: toil / struggle / run / suffer together
  choice: 一同劳苦／奋战／奔跑／受苦
  rationale: 保留连续重复的“一同”及运动、竞赛和受难意象。
- source_word: Captain
  choice: 统帅
  rationale: 与“服役、军饷、逃兵、盾牌”等军事隐喻协调，又保持尊严。
- source_word: baptism ... shield
  choice: 洗礼……作盾牌
  rationale: 按见证文本保留洗礼的军事装备比喻，不另加关于洗礼功效的解释。
- source_word: patience / long-suffering
  choice: 忍耐／恒久忍耐
  rationale: 前者作为甲胄名称求简洁，后者在彼此关系中显出持续、宽容的含义。
theological_decisions:
- issue: 对主教的服从与上帝看顾之间的关系
  choice: “好让上帝也留心看顾你们”
  alternative: “上帝也必顾念你们”
  rationale: 保留原句的目的或结果语气，不将其强化为无条件保证，也不削弱其劝勉力度。
- issue: “在上帝面前与他们同有一份”的末世含义
  choice: 保留“在上帝面前……同有一份”
  alternative: 明确译成“在上帝国里与他们同得产业”
  rationale: 原见证没有明确指定“份”究竟是产业、命运还是群体归属，因此保留开放性。
- issue: 善行、存款与领取资产的报偿语言
  choice: 直译其财务比喻，并以脚注提示歧义
  alternative: 解释为“积存善行，以得天上的赏赐”
  rationale: 避免把可能的末世报偿语言系统化为特定功德论或赏赐论；保留文本本身的张力。
- issue: “正如上帝与你们同在／对待你们”
  choice: “正如上帝恒久忍耐你们一样”
  alternative: “正如上帝与你们同在一样”
  rationale: 依据句法平行，将省略的谓语理解为“恒久忍耐”；但因当前尚未直接核对希腊文，此处保持审慎，不作进一步教义发挥。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，并保留原段落密集的排比、军事意象和财务意象。由于所供材料是公共领域英文见证，且明确注明希腊文源文复核尚待进行，本稿属于以该见证为基础的审慎出版草案；对“assessors”及财务术语设置脚注，不假装已完成直接希腊文校勘。
