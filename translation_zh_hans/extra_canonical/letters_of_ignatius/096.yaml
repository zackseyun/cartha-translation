review_pass:
  verdict: revise
  source_fidelity: 需要修订。按中期希腊文本，ἀντίψυχον 表达以性命作担保／抵偿的强烈委身，不只是泛称“献上自己”。συναναπαύεσθε 是“同得安息／一同歇息”，不宜具体化为“一同躺卧”。βάπτισμα 被比作 ὅπλα（兵器、武器；复数），并非“盾牌”。末句 ὡς καὶ ὁ θεὸς μεθ᾽ ὑμῶν 直陈“正如上帝也与你们同在”，不能补成“上帝恒久忍耐你们”。
  naturalness: 原稿整体庄重通顺，排比和军事意象也清楚。但“同席者”在现代汉语中通常指一同用餐的人，不能自然传达 πάρεδροι 所指的在旁协助、辅佐或参议的角色；改作“辅佐者”较自然。
  terminology: “主教、长老、执事”可保留。“管家、辅佐者和仆役”既保留三个并列职分／角色，也不把 πάρεδροι 过度制度化为现代意义的“评议员”。“存款”及“应得之物”保留财务报偿比喻，避免作教义性发挥。
  issues:
  - severity: high
    issue: 将“洗礼”译作“盾牌”
    rationale: 希腊文为ὅπλα（兵器／武器，复数）；英语见证的“shield”与希腊文本不符。应按原文改译，不应以英语见证覆盖原文。
  - severity: high
    issue: 把“正如上帝也与你们同在”解释为“正如上帝恒久忍耐你们一样”
    rationale: 原文为ὡς καὶ ὁ θεὸς μεθ᾽ ὑμῶν，谓语为“同在”概念；译稿擅自补入“恒久忍耐”，改变了明示内容。
  - severity: medium
    issue: “我愿……献上自己”弱化ἀντίψυχον
    rationale: 该词含“以生命作担保、抵偿或代替”的强烈表达。以“我愿以自己的性命作担保”能较准确保留其修辞力度，且不强加具体救赎理论。
  - severity: medium
    issue: “一同躺卧”过度具体化συναναπαύεσθε
    rationale: 该动词指一同安息、休息，而非必然指身体躺卧。
  - severity: medium
    issue: “同席者”误导πάρεδροι的语义
    rationale: πάρεδροι可指在旁坐席而协助的人，即辅佐者、助手或参议者；现代汉语“同席者”容易理解成共席用餐者。
  revised_text: '你们要留心听从主教，好让上帝也留心看顾你们。我愿以自己的性命为那些顺服主教、长老和执事的人作担保。愿我在上帝面前得以与他们同有一份。你们要彼此一同劳苦，一同奋战，一同奔跑，一同受苦，一同安息，一同起来，如同上帝的管家、辅佐者[a]和仆役。


    要使你们所服事的统帅喜悦；你们也要从他那里领受军饷。你们中间不可有人被发现是逃兵。要让你们的洗礼常与你们同在，作为兵器；信心作为头盔；爱作为长矛；忍耐作为全副军装。你们的善行要成为你们的存款，好使你们领受相称的应得之物[b]。所以，你们要以温柔彼此恒久忍耐，正如上帝也与你们同在。愿我常常因你们而喜乐。'
  revised_footnotes:
  - marker: a
    text: “辅佐者”对应的词指在旁协助、辅佐或参议的人；也可译为“助手”或“参议者”。
    reason: 说明该词的角色性含义，避免“同席者”在现代汉语中引起共席用餐的误解，同时不将其限定为某一固定制度职称。
  - marker: b
    text: “存款……应得之物”保留原文的财务比喻；后者也可理解为“相称的报偿”或“应领之物”。
    reason: 保留原文报偿语言及其未明说的具体内容，避免预设特定的末世赏赐或功德体系。
  revision_rationale: 修订以中期希腊文本优先，并在英语见证与希腊文不一致之处依原文校正：将“盾牌”改为“兵器”，恢复末句“上帝也与你们同在”的明示语义；同时调整ἀντίψυχον、συναναπαύεσθε和πάρεδροι，使译文更贴近原文且保持现代庄重的汉语表达。保留段落的命令式排比、军事比喻、财务比喻与未决的报偿指向。
