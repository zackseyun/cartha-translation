  yaml_path: translation/extra_canonical/letters_of_ignatius/002.yaml
  text: 'While I welcomed in God [your] well beloved name, which ye bear by natural right, [in an upright and virtuous mind], by faith and love in Christ Jesus our Savior—being imitators of God, and having your hearts kindled in the blood of God, ye have perfectly fulfilled your congenial work—


    for when ye heard that I was on my way from Syria, in bonds for the sake of the common Name and hope, and was hoping through your prayers to succeed in fighting the wild beasts in Rome, that by so succeeding I might have power to be a disciple, ye were eager to visit me—


    seeing then in God''s name I have received your whole multitude in the person of Onesimus, whose love passeth utterance and who is moreover your bishop [in the flesh], and I pray that ye may love him according to Jesus Christ and that ye all may be like him; for blessed is He that granted unto you according to your deserving to have such a bishop.'
translation:
  language: zh_hans
  text: '我在上帝里面欣然领受你们那深受爱戴的名；你们凭着本性当得这名，[怀着正直而有德的心]，又借着对我们的救主基督耶稣的信与爱而持守它。你们效法上帝，心被上帝的血点燃，便圆满地完成了与你们相称的事工。


    你们听说我为了我们共同的名和盼望，带着锁链从叙利亚前往罗马；我也盼望借着你们的祷告，得以成功地与野兽搏斗，好叫我借此能够成为门徒。于是，你们热切地来见我。


    因此，我奉上帝的名，在奥尼西穆一人身上接待了你们全体。他的爱难以言表，并且他也是你们在肉身中的主教[a]。我祈求你们照着耶稣基督爱他，也愿你们众人都像他一样。那位按你们所配得的，恩准你们拥有这样一位主教的，是有福的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在肉身中的”在所据英语见证中置于方括号内，表示该处可能属于文本残缺后的补足或存在传本疑问；希腊文直接复核尚待完成。
    reason: 交代底本文本状态，并避免把不确定的复原无标记地纳入正文。
lexical_decisions:
- source_word: ὄνομα / Name（据英语见证所反映）
  choice: 名
  rationale: 保留原文在“名字、名号、所信之名”之间的浓缩表达；第二处译作“共同的名”，不擅自补明为某一专名。
- source_word: ἐν αἵματι θεοῦ / blood of God（据见证）
  choice: 上帝的血
  rationale: 保留早期基督教文本中强烈且具有神学张力的措辞，不改写为较弱的“基督的血”。
- source_word: συγγενικὸν ἔργον / congenial work（据见证）
  choice: 与你们相称的事工
  rationale: 表达此事工与收信人的身份、本性或品格相合，同时避免生硬直译为“同族的工作”。
- source_word: θηριομαχῆσαι / fight the wild beasts（据见证）
  choice: 与野兽搏斗
  rationale: 保留罗马竞技场殉道语境中的具体意象及其不确定性。
- source_word: ἐπίσκοπος / bishop（据见证）
  choice: 主教
  rationale: 采用现代汉语中对早期教会职分的通行称呼，不在正文中扩展其后世制度含义。
- source_word: μαθητής / disciple（据见证）
  choice: 门徒
  rationale: 保留依纳爵将殉道与“成为门徒”相联系的特殊表达，不缓和为“证明自己是门徒”。
theological_decisions:
- issue: “上帝的血”的神学张力
  choice: 直译“上帝的血”
  alternative: 译为“基督的血”或“耶稣的血”
  rationale: 所提供见证明确如此，且这一表述可能有重要的基督论意义；翻译不应替作者消解张力。
- issue: “能够成为门徒”是否表示此前尚非门徒
  choice: 保留“能够成为门徒”
  alternative: “显明自己是真门徒”或“成为完全的门徒”
  rationale: 原句的修辞与神学张力应予保留，不加入原文未明说的资格限定。
- issue: “按你们所配得的”与恩典的关系
  choice: 译作“按你们所配得的，恩准你们”
  alternative: 弱化为“赐给你们”
  rationale: 保留“配得”与“恩准”并置的张力，不按某种恩典论体系重释。
- issue: “在肉身中的主教”
  choice: 正文保留并加脚注
  alternative: 省略括号内短语或解释成“现世的主教”
  rationale: 英语见证将其标为方括号内容，可能涉及文本复原；正文保留其见证状态，并避免过度解释。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。长句按汉语逻辑适度分段，但保留原段落的递进关系和殉道语境。由于本条所给“原文”实际为公版英语见证，且注明希腊文复核待定，本稿为据该见证所作的审慎暂定译文；对方括号、神学浓缩语和可能的多义处不作武断消解。
