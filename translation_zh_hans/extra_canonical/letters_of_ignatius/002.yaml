review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了书信的段落推进、殉道处境、“上帝的血”、野兽、奥尼西穆及主教等核心内容。但首句将“[your]”这一见证中的方括号补足未作标示，且“又借着……而持守它”加入了见证未明说的“持守”动作。第三段“奉上帝的名”也把较中性的“in God”不必要地译成了“奉……的名”。
  naturalness: 整体庄重、现代且可朗读。第一段原有分号后的结构略显断裂；“凭着本性当得这名”不如“按本性所具有的”自然，也较易误解为法律意义的“当然权利”。“照着耶稣基督爱他”可改为更合现代汉语的“以合乎耶稣基督的方式爱他”。
  terminology: “上帝”“基督耶稣”“门徒”“主教”“奥尼西穆”及“上帝的血”均可保留。为忠实反映英语见证的文本不确定性，首处[你们的]、[怀着正直而有德的心]及主教后的[按肉身说]均应在正文中明确保留方括号；脚注应说明所有这些锚点，而非只说明最后一处。
  issues:
  - severity: medium
    issue: 首句未保留“[your]”的方括号状态。
    rationale: 所据英语见证明确以方括号标示该词；直接译为无标记的“你们”会把暂定补足当作无争议正文。
  - severity: medium
    issue: “又借着……而持守它”添加了“持守”这一动作。
    rationale: 见证将信与爱、效法上帝及心被点燃作为描述/修饰语，并未明确说收信人“持守”该名；应避免补入解释性谓语。
  - severity: low
    issue: “奉上帝的名”过度专门化。
    rationale: 见证的“in God's name”在此宜保留为较宽的“在上帝里面/在上帝里”，不预设为正式的奉名行为。
  - severity: low
