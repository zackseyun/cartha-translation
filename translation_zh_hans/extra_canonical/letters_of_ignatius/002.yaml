review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实保留了英语见证的段落推进、殉道语境、“上帝的血”、“共同的名和盼望”及“成为门徒”等关键表达。不过，首句把“所承负的名”进一步译成“持守它”，加入了见证未明说的动作；“在奥尼西穆一人身上接待了你们全体”也未清楚表达他作为全体代表被接待的意思。方括号中的“[your]”亦应在中文正文保留其见证性的文本不确定标记。
  naturalness: 原稿整体庄重、可朗读。“在奥尼西穆一人身上接待了你们全体”在现代汉语中不够自然，且易被理解为在其身体上接待会众。改为“借着奥尼西穆一人，接待了你们全体”可同时保留代表性和行文自然度。
  terminology: “上帝”“基督耶稣”“门徒”“主教”“奥尼西穆”“叙利亚”等用语均可保留。“与野兽搏斗”恰当保留具体意象；“上帝的血”应维持，不应按后世神学偏好替换。方括号内容宜一律在正文中保留，并以脚注交代其依据仅为所给英语见证。
  issues:
  - severity: medium
    issue: 首句增添“持守它”
    rationale: 英语见证说收信人“bear”该名，并未明确说“持守”该名；此补入会把承有／带有某名的表达解释为信仰忠贞行为。
  - severity: medium
    issue: 未保留“[your]”的方括号标记
    rationale: 所给见证明确以方括号标出该词；既然译稿说明保留这些文本不确定信号，正文也应显示。
  - severity: medium
    issue: “在奥尼西穆一人身上接待了你们全体”表达不清
    rationale: 见证的“in the person of Onesimus”意为借奥尼西穆作为代表而接待全体，而非在他“身上”接待。
  - severity: low
    issue: 脚注仅说明“[in the flesh]”，未统一说明所有方括号
    rationale: 首段另有两个方括号处，宜以同一脚注说明它们均按英语见证保留，且希腊文直接复核尚待完成。
  revised_text: '我在上帝里面欢喜地接待了[你们]那深受爱戴的名；你们按本性承负这名，[怀着正直而有德的心，]又借着对我们救主基督耶稣的信和爱。你们既效法上帝，又使自己的心在上帝的血中燃起，便完全成就了与你们相称的工作。


    你们听说我为了共同的名和盼望，带着锁链从叙利亚前往罗马；我也盼望借着你们的祷告，能成功地与野兽搏斗，好叫我借此能够成为门徒。于是，你们热切地来见我。


    因此，我奉上帝的名，借着奥尼西穆一人，接待了你们全体。他的爱难以言表；他也是你们的主教[在肉身中]。[a]我祈求你们照着耶稣基督爱他，也愿你们众人都像他一样。那位按你们所配得的，赐给你们这样一位主教的，是有福的。'
  revised_footnotes:
  - marker: a
    text: 正文中的方括号（包括“[你们]”“[怀着正直而有德的心，]”和“[在肉身中]”）均依所据英语见证保留，表示该处可能是补足文本，或在传本中存在疑问；希腊文直接复核尚待完成。
    reason: 统一标明英语见证中的方括号文本状态，不把可能的复原或传本疑问无标记地纳入正文。
  revision_rationale: 修订保留见证的语义张力和不确定性，不以教义性解释替换“上帝的血”“成为门徒”或“按你们所配得的”。同时删除无依据的“持守”补义，明确奥尼西穆代表以弗所全体被接待的关系，并在中文正文中一致保留所有方括号信号。
