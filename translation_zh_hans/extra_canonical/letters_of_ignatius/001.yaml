base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/001.yaml
  text: 'Ignatius, who is also Theophorus, to her who has been blessed in greatness through the fullness of God the Father; who was foreordained before the ages to be forever in abiding and unchangeable glory, united and chosen in a true passion, by the will of the Father and of Jesus Christ our God; even to the church that is in Ephesus [of Asia], worthy of every felicitation: abundant greeting in Christ Jesus and in blameless joy.'
translation:
  language: zh_hans
  text: 又名提阿弗罗斯[a]的伊格那修，致以弗所[亚细亚][b]的教会：这教会因父神的丰盛而大大蒙福；在万世以前已蒙预定，要永远进入恒久不变的荣耀；又照着父和我们的神耶稣基督的旨意，在真实的受难中合而为一并蒙拣选[c]。这教会配受至高的称颂。愿你们在基督耶稣里、在无可指责的喜乐中，满得问候！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提阿弗罗斯”是希腊语名号 Θεοφόρος 的音译；可理解为“承载神者”或“神所承载者”，此处不确定采用哪一种解释。
    reason: 保留名号本身及其可能的双重理解。
  - marker: b
    text: “亚细亚”在所据英文见证中置于方括号内，表示文本补入或校勘上的保留；这里照样保留。此处指罗马帝国的亚细亚行省。
    reason: 保存见证文本的方括号恢复信号，并避免与现代亚洲概念混淆。
  - marker: c
    text: “真实的受难”很可能指耶稣基督真实经历的苦难，但原句在这里没有明说“基督的”，所以正文未补出。
    reason: 提示主要语义可能，同时保存原句的含混。
lexical_decisions:
- source_word: Θεοφόρος (Theophorus)
  choice: 提阿弗罗斯
  rationale: 作为伊格那修的别名或称号音译保留，不在正文中限定其可能的含义。
- source_word: πλήρωμα / plentitude
  choice: 丰盛
  rationale: 保留“充满、完满”的语义范围，同时使现代汉语表达自然。
- source_word: προωρισμένῃ / foreordained
  choice: 蒙预定
  rationale: 直接表达事先定下的被动意义，不进一步说明预定的机制或神学体系。
- source_word: πάθος ἀληθινόν / true passion
  choice: 真实的受难
  rationale: “受难”保留与基督苦难相关的可能指向，“真实的”则保留对其真实性的强调。
- source_word: ἀξιομακάριστος / worthy of all felicitation
  choice: 配受至高的称颂
  rationale: 避免生硬直译“配受一切福乐”，表达该词对教会蒙福状态的高度赞许。
- source_word: χαίρειν / greeting
  choice: 满得问候
  rationale: 采用书信问候语，同时借“喜乐”保留原句与后文χαρά可能存在的语义呼应。
theological_decisions:
- issue: “我们的神”与“耶稣基督”的关系
  choice: 我们的神耶稣基督
  alternative: 父和耶稣基督、我们的神
  rationale: 所给见证把“our God”直接联系于“Jesus Christ”；译文保留这一紧密同位关系，不将称谓移接于父。
- issue: “在真实的受难中”所指为何
  choice: 保留未明说的关联
  alternative: 明译为“因基督真实的受难”
  rationale: 原句没有在该短语内明确补出“基督的”，因此正文不补足，以保存句法和神学上的含混与张力。
- issue: “合而为一并蒙拣选”的施事者与方式
  choice: 保持被动及短语连接
  alternative: 译为“神借着受难使你们合一并拣选你们”
  rationale: 避免补入原文未明说的施事者和因果关系。
translation_notes:
  register: 采用庄重而可读的现代书信体。将原文层层修饰教会的长句适度分句，以免现代读者失去主干，但保留各修饰语之间的神学联系。因直接希腊语审校尚待完成，本稿主要依据所提供的公版英文见证，并参考已知的中期校订本希腊语措辞；正式出版前应复核希腊语文本、标点与句法。
