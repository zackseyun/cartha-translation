review_pass:
  verdict: revise
  source_fidelity: 稿本总体保留了称号、书信对象、父与“我们的神耶稣基督”的并列，以及“真实的受难”未明指所属者的句法含混。不过，“要永远进入……荣耀”将“被预定为／归于永恒、恒久不变的荣耀”误作进入某一状态；“至高的称颂”也把“每一／一切祝贺（felicitation）”强化成原文未有的“至高”。
  naturalness: 原译整体庄重可读，但“满得问候”不是自然的现代汉语书信问候语；“愿你们……满得问候”也将发信人的致意改成对收信人的祝愿。改为“致以丰盛的问候”既自然又保留书信公式。
  terminology: “父和我们的神耶稣基督”恰当保留了“Jesus Christ our God”的紧密称谓关系；“蒙预定”“合而为一并蒙拣选”也合宜。“真实的受难”可保留，不应在正文擅自补成“基督的受难”。
  issues:
  - severity: medium
    issue: “要永远进入恒久不变的荣耀”
    rationale: 见证文本的“hath been foreordained ... to be forever and unto abiding and unchangeable glory”表达被预定归于／为着永恒、恒久不变的荣耀，并不明确含有“进入”的动作。
  - severity: medium
    issue: “配受至高的称颂”
    rationale: “worthy of all felicitation”是“配得一切／每一祝贺、庆贺”之意；“至高”并非原句信息，且“称颂”可能使语义偏向敬拜性颂赞。
  - severity: medium
    issue: “愿你们……满得问候”
    rationale: “abundant greeting”是发信人向收信教会所致的问候，不是祈愿收信人获得问候；“满得问候”亦不自然。
  revised_text: 又名提阿弗罗斯[a]的伊格那修，致以弗所[亚细亚][b]的教会：这教会因父神的丰盛而大大蒙福；在万世以前已蒙预定，归于永恒、恒久不变的荣耀；又照着父和我们的神耶稣基督的旨意，在真实的受难中合而为一并蒙拣选[c]。这教会配得一切祝贺。愿你们在基督耶稣里、在无可指责的喜乐中，领受丰盛的问候！
  revised_footnotes:
  - marker: a
    text: “提阿弗罗斯”是希腊语名号 Θεοφόρος 的音译。该称号通常可理解为“承载神者”，其构词关系也容许其他理解；正文不作解释。
    reason: 保留称号而不在正文限定其含义。
  - marker: b
    text: “亚细亚”在所据英文见证中置于方括号内，表示文本补入或校勘上的保留；这里照样保留。此处指罗马帝国的亚细亚行省。
    reason: 保存见证文本的方括号恢复信号，并避免与现代亚洲概念混淆。
  - marker: c
    text: “真实的受难”在上下文中很可能关联耶稣基督的受难，但该短语本身未明说“基督的”；正文因此不补出。
    reason: 提示主要语义可能，同时保存原句的含混。
  revision_rationale: 修订避免将“被预定……归于荣耀”译为“进入荣耀”，将“all felicitation”准确译为“一切祝贺”，并把末句恢复为发信人所致的书信问候。其余关键神学称谓与受难短语的未明关联均予保留。
