base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/065.yaml
  text: 'I have found that this bishop of yours holds the ministry that serves the common good, not from himself or through people, nor for vain glory, but in the love of God the Father and the Lord Jesus Christ. I am amazed at his patience;


    his silence is more powerful than the speech of others. For he is attuned to the commandments in harmony, like a lyre with its strings. Therefore my soul blesses his godly mind, for I have found it virtuous and perfect—even the untroubled and calm disposition he has while living with all godly patience.'
translation:
  language: zh_hans
  text: 我发现，你们的这位监督所承担的、关乎众人益处的职分，不是出于自己，也不是借着人，更不是为了虚荣，而是在父神和主耶稣基督的爱中承担的。我对他的忍耐深感惊叹；他的沉默比别人的言语更有力量。他与诫命和谐相应，就像琴与琴弦协调一致。因此，我的心称颂他敬虔的心思，因为我发现这心思既有德行，又趋于完全；他在一切敬虔的忍耐中生活，性情安定沉着，不受搅扰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂依据所提供的公版英文见证译出；尚需对中间校订本的希腊文抄本传统作直接复核，尤其是“职分”“忍耐”“完全”等词的准确语义与句法关系。
    reason: 用户提供的资料明确注明希腊文源语审查尚未完成；出版草稿应透明标示这一文本依据限制。
lexical_decisions:
- source_word: bishop (Greek source review pending)
  choice: 监督
  rationale: 采用较贴近早期教会职分语境、且不过早套入后世宗派制度的译法。
- source_word: ministry which pertaineth to the common weal
  choice: 关乎众人益处的职分
  rationale: 兼顾“ministry”的职分含义与“common weal”的共同福祉含义，避免现代政治化措辞。
- source_word: forbearance / patience
  choice: 忍耐
  rationale: 上下文强调其安静、沉着和克制；“忍耐”自然且保留敬虔品格的意味。
- source_word: silence is more powerful
  choice: 沉默……更有力量
  rationale: 保留原文鲜明的反衬，不将其解释为特定形式的权威。
- source_word: attuned in harmony
  choice: 和谐相应
  rationale: 与下文琴和琴弦的比喻呼应，同时表达其生命与诫命协调一致。
- source_word: godly mind
  choice: 敬虔的心思
  rationale: 保留内在思想、品格和取向的复合含义，避免缩减为单纯的“智慧”。
- source_word: imperturbable and calm temper
  choice: 性情安定沉着，不受搅扰
  rationale: 传达不动摇、平静的气质，同时使用现代汉语可自然理解的表达。
theological_decisions:
- issue: 监督职分的来源
  choice: 不是出于自己，也不是借着人
  alternative: 不是由自己或人所设立
  rationale: 保留“not of himself or through men”的张力，不进一步断定这是关于任命方式、权柄来源还是个人动机的教义陈述。
- issue: “在……爱中”的归属关系
  choice: 在父神和主耶稣基督的爱中承担
  alternative: 因爱父神和主耶稣基督而承担
  rationale: 保留“in the love of”的可能开放性，不明确限定为人的爱、神所赐的爱或两者兼有。
- issue: “完全”的品格陈述
  choice: 又趋于完全
  alternative: 又是完全的
  rationale: 英语见证中的“perfect”可能表达成熟、完整或圆满；在尚待希腊文复核时，避免译成绝对无瑕。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“琴与琴弦”的古代比喻和原段落对沉默、诫命与敬虔品格的修辞递进；避免使用带有明确后世宗派制度色彩的术语。
