review_pass:
  verdict: revise
  source_fidelity: 需修订。“由布鲁斯代笔”把“by the hand of Burrhus”较明确地限为代笔，原见证至少也可指经他递送；而“他是……差来陪伴我的”对“whom ye sent with me jointly with the Ephesians your brethren”的关系处理不够贴切。基督的“flesh and blood”宜明确译为“肉身和血”，不宜合成为泛称性的“血肉”。
  naturalness: 整体庄重、通顺，适合现代书信体。“在……里”的连续结构虽密集，但与见证文本的祝安语式相称。修订后将“经……的手”与“同……一同差来，和我同行”表达得更自然且保留开放性。
  terminology: “主教、长老团、执事”可保留；“弟兄姊妹”在这一暂以英语见证为桥接的文本中可接受。“上帝的恩典”及“受难和复活”也合宜。保留方括号连接词的脚注；关于“肉身、属灵”及“上帝和你们自己的合一”的歧义，可用简短、非教义预断的注释说明。
  issues:
  - severity: medium
    issue: “由布鲁斯代笔”过度限定“by the hand of Burrhus”
    rationale: 该书信惯语可涵盖经其手传递、协助书写等情形；在未直接核对希腊文时，不宜断定为代笔。
  - severity: medium
    issue: 布鲁斯受差遣及同行关系的译法不够准确
    rationale: “whom ye sent with me jointly with the Ephesians your brethren”更直接表示收信人把布鲁斯同以弗所弟兄一起差来，与作者同行；原译的“差来陪伴我”弱化并改动了该句关系。
  - severity: medium
    issue: “血肉”未清楚保留基督“flesh and blood”的并列指称
    rationale: “血肉”在现代汉语常作整体性或泛称表达；“他的肉身和血”更准确保留原见证的两个并列名词及其基督论力度。
  - severity: low
    issue: 脚注 b 含有超出文本说明所必需的护教性表述
    rationale: “这不是说基督的复活没有真实身体”虽意在防误读，却直接回应特定教义争议；应限于说明修饰范围及待核希腊文，不预设解释对象。
  revised_text: '特罗亚的弟兄姊妹之爱向你们问安。我也从那里借布尔鲁斯的手写信给你们；你们曾把他同以弗所的弟兄姊妹一同差来，和我同行。他在各方面都使我得着安慰。我愿人人都效法他，因为他是服事上帝的榜样。上帝的恩典必在一切事上报答他。


    我向你们敬虔的主教、可敬的长老团，[a]以及与我一同作仆人的众执事问安；也向你们每一个人和全体问安。这问安是在耶稣基督的名里，在他的肉身和血里，在他既属肉身、又属灵的受难和复活里，[b]也在上帝和你们自己的合一里。[c]愿恩典、怜悯、平安和忍耐常与你们同在。'
  revised_footnotes:
  - marker: a
    text: “以及”对应见证文本中以方括号标出的补入连接词；希腊文抄本传统尚待直接复核。
    reason: 保留所给英语见证的文本补足信号，同时使正文可读。
  - marker: b
    text: “既属肉身、又属灵”在所给见证文本中与“受难和复活”相连；其准确措辞及修饰范围仍须根据希腊文核验。
    reason: 说明见证文本所留下的修饰关系问题，而不在译文或注释中预断其神学解释。
  - marker: c
    text: 直译近于“在上帝和你们自己的合一里”。此处可理解为人与上帝的合一，或收信人共同体的合一；具体句法关系仍待核对希腊文。
    reason: 保留见证文本简约结构的歧义，避免擅自确定单一解释。
  revision_rationale: 修订避免把经布尔鲁斯之手写信限定为“代笔”，并更贴近其与以弗所弟兄一同受差、和作者同行的句法关系。将“血肉”改为“肉身和血”，以保留原见证的并列用语。其余保留原稿的现代庄重语体、职分称谓和有意保留的文本歧义；脚注删去不必要的教义性辩护，集中于文本与语法问题。专名“布尔鲁斯”按 Burrhus 作较完整的音译；仍建议在直接核对希腊文后统一全书专名规范。
