base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/088.yaml
  text: 'The love of the brothers and sisters in Troas greets you. From there I am also writing to you through Burrhus, whom you sent with me together with your brothers and sisters, the Ephesians. He has refreshed me in every way. I wish everyone would imitate him, for he is an example of service to God. Divine grace will repay him in all things.


    I greet your godly bishop, your venerable council of elders, [and] my fellow servants the deacons, as well as all of you individually and together, in the name of Jesus Christ, and in his flesh and blood, in his suffering and resurrection, both bodily and spiritual, in the unity of God and of yourselves. Grace, mercy, peace, and patience be with you always.'
translation:
  language: zh_hans
  text: '特罗亚众弟兄姊妹的爱向你们问安。我也是从那里写信给你们，由布鲁斯代笔；他是你们和以弗所的弟兄姊妹一同差来陪伴我的。他在各方面都使我得到振奋。我希望人人都效法他，因为他是服事上帝的榜样。上帝的恩典必在一切事上报答他。


    我向你们敬虔的主教、可敬的长老团，[a]以及与我一同作仆人的众执事问安；也向你们每一个人和全体问安。这问安是在耶稣基督的名里，在他的血肉里，在他那既属肉身、又属灵的受难和复活里，[b]也在上帝与你们的合一里。[c]愿恩典、怜悯、平安和忍耐常与你们同在。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以及”对应见证文本中以方括号标出的补入连接词；希腊文抄本传统尚待直接复核。
    reason: 保存所给英语见证的文本补足信号，同时让正文保持可读。
  - marker: b
    text: “既属肉身、又属灵”在此随所给见证文本与“受难和复活”相连；其准确措辞和修饰范围仍须根据希腊文核验。这不是说基督的复活没有真实身体。
    reason: 保留原有神学张力并防止现代读者把“属灵”误读为“非身体的”，但不在正文中替原文解决语法歧义。
  - marker: c
    text: 直译近于“在上帝和你们自己的合一里”。此处究竟着重人与上帝的合一，还是收信人共同体在上帝里的合一，尚可有不同理解。
    reason: 标明见证文本简约结构所留下的真实歧义，避免默默选定单一教义解释。
lexical_decisions:
- source_word: brethren / brothers and sisters
  choice: 弟兄姊妹
  rationale: 所提供的底本是英语公共领域见证，尚待希腊文复核；此处以现代汉语中可自然涵盖整个信徒群体的表达传达亲属性群体称谓，不据此断定原词语法性别所指。
- source_word: by the hand of Burrhus
  choice: 由布鲁斯代笔
  rationale: 按古代书信惯用语理解为经某人之手写成，比直译“借着布鲁斯的手”更自然；不排除他同时承担递送或协助书写的角色。
- source_word: refreshed me
  choice: 使我得到振奋
  rationale: 兼顾身体、精神与服事支持等可能含义，避免窄化为单纯休息或物质供应。
- source_word: ministry of God
  choice: 服事上帝
  rationale: 保留其指向上帝的服事含义，同时避免把该短语制度化为特定宗派职分。
- source_word: presbytery
  choice: 长老团
  rationale: 表达由多位长老组成的群体，而不是后世某种固定宗派治理机构的专名。
- source_word: flesh and blood
  choice: 血肉
  rationale: 采用自然而庄重的现代汉语，并保留基督真实具身存在的力度。
- source_word: patience
  choice: 忍耐
  rationale: 在祝福语境中保留承受患难、持守不移的含义；希腊文直接复核后仍可评估是否需译作“恒忍”。
theological_decisions:
- issue: “受难和复活”与“属肉身、属灵”的修饰关系
  choice: 在他那既属肉身、又属灵的受难和复活里
  alternative: 在他的受难和复活里——这受难和复活既是肉身的，也是属灵的
  rationale: 保留英语见证中修饰范围的张力，使“属肉身、属灵”共同关联受难与复活，不把“属灵”解释成否定身体真实性；并以脚注说明其语法范围有待希腊文复核。
- issue: “上帝与你们的合一”所表达的关系
  choice: 也在上帝与你们的合一里
  alternative: 也在你们与上帝彼此合一里
  rationale: 尽量保存见证文本不寻常且简约的并列结构，不擅自补足为某套精密的教会论或神秘联合教义。
- issue: 主教、长老与执事的职称
  choice: 主教、长老团、执事
  alternative: 监督、众长老、服事者
  rationale: 依此早期教会书信的明确职分语境采用通行历史称谓，但不附加后世宗派的权力结构或圣礼含义。
- issue: “上帝的恩典必……报答他”的施事者
  choice: 上帝的恩典必在一切事上报答他
  alternative: 愿上帝的恩典在一切事上回报他
  rationale: 保留见证文本所呈现的陈述/确信语气和“恩典”作主语的拟人表达，不改写为祈愿句。
translation_notes:
  register: 采用现代、庄重而易懂的书信体；问安段保留反复出现的“在……里”，以呈现原见证的节奏和神学密度。因未提供希腊文原文，本文严格属于依据公共领域英语见证所作的暂定稿；专名、连接词补足、修饰范围及关键职分术语均应在中期校勘本希腊文传统直接复核后定稿。
