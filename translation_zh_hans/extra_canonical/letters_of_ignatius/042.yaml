review_pass:
  verdict: revise
  source_fidelity: 需作小幅修订。草稿大体忠实保留了职分之间的类比、强烈的“教会”表述，以及作者不以使徒身分发令的自我限制。但“囚犯”较弱于见证所译 convict（且希腊语 κατάκριτος 通常带有“被定罪／判决”的含义）；“宽待”也略将作者的节制语气转为对受信人的恩待。
  naturalness: 整体庄重流畅。将“上帝的议会”调整为“上帝的议事会”，更符合现代汉语中该集体性意象；末段改为“我便如此克制”，能更自然地表达作者因爱而不作更严厉书写的意思。
  terminology: “执事”“主教”“众长老”可保留，既符合早期教会职分语境，也清楚保留单数主教与复数长老的对照。“父的表征”适度保留 type 的象征性而不作身份等同。“众使徒的团体”可保留，避免将 college 时代错置为学校。
  issues:
  - severity: medium
    issue: “囚犯”未充分表达 convict／κατάκριτος 的受判决含义。
    rationale: “囚犯”可泛指被拘押者；此处作者的自称带有“被定罪的人”的自我贬抑色彩，宜在不擅加具体罪名的前提下译出。
  - severity: low
    issue: “所以这样宽待你们”略偏离 spare 的语用重点。
    rationale: 本句重点是作者因爱而克制、不作更尖锐的责备；“宽待”容易暗示施恩或从轻处置。
  - severity: low
    issue: “上帝的议会”在现代汉语中略显生硬。
    rationale: “议事会”更自然，同时保留 council 所表达的共同议事、团体性的比喻。
  revised_text: '同样，所有人都要敬重执事，如同敬重耶稣基督；也要敬重主教，视他为父的表征；敬重众长老，视他们为上帝的议事会和众使徒的团体。没有这些，连“教会”这个名称也谈不上。


    我深信，你们在这些事上正是这样想的；因为我已经从你们的主教身上领受了你们爱心的典范，如今这典范也与我同在。他的举止本身就是极大的教诲，他的温柔就是力量。我想，就连不敬虔的人也尊敬他。


    因为我爱你们，我便如此克制；其实为了他，我本可以写得更严厉些。但我认为自己没有资格这样做：作为一个被定罪的人，我不该像使徒一样向你们发号施令。'
  revised_footnotes: []
  revision_rationale: 修订限于提升语义精确度与现代汉语自然度：以“被定罪的人”对应作者受判决的自称；以“我便如此克制”表达 spare 的自我节制；以“议事会”自然保留 council 的意象。未改变职分对应、教会秩序的强烈措辞，或作者与使徒权威的比较关系。由于所给材料明确说明希腊文直接复核尚待进行，此结论仍应在出版前与中编希腊文文本及异读复核。
