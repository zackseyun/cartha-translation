review_pass:
  verdict: revise
  source_fidelity: 需修订。“囚犯”未充分表达英语见证的“convict”（且希腊文通常作被判定/被定罪者）的司法含义；末句加入“不该”也将作者的自我判断扩展成了额外的规范性断言。其余职分对应、强烈的比较语气及“离开这些……不称为教会”的绝对表达基本得到保留。
  naturalness: 整体庄重、通顺，适合现代标准汉语。“因为我爱你们，所以这样宽待你们”略显口语化且“宽待”容易转为待遇意义；改为“我因爱你们，便如此对你们有所保留”更贴合在书信责备中克制措辞的语境。
  terminology: “执事”“主教”“众长老”可保留。“父的表征”可理解，但“父的形像”较直接地传达 type 的象征性对应，且不构成身份等同。“众使徒的团体”可保留为对 college 的自然表达。
  issues:
  - severity: medium
    issue: 将 convict 译为“囚犯”
    rationale: “囚犯”只说明拘押状态；convict 指已被定罪者。应译为“被定罪的人”或“被判定有罪的人”，以保存原文的自我贬抑及司法色彩。
  - severity: medium
    issue: 末句加入“不该”
    rationale: 见证文本说作者不认为自己有资格“像使徒那样命令”，并未另行明说“不该”。该词会把自我资格判断强化为规范性禁止，应删去。
  - severity: low
    issue: “这样宽待你们”语义略偏
    rationale: 此处是因爱而没有写得更严厉，不是泛指善待；“有所保留”更明确体现修辞克制。
  revised_text: '同样，所有人都要敬重执事，如同敬重耶稣基督；也要敬重主教，视他为父的形像；敬重众长老，视他们为上帝的议会和众使徒的团体。离开这些人，连“教会”这个名称也谈不上。


    我深信，你们在这些事上正是这样想的；因为我已经从你们的主教身上领受了你们爱心的典范，如今这典范也与我同在。他的举止本身就是极大的教诲，他的温柔就是力量。我想，就连不敬虔的人也尊敬他。


    我因爱你们，便如此对你们有所保留；其实为了他，我本可以写得更严厉些。但我认为自己没有资格这样做：我作为一个被定罪的人，竟像使徒那样向你们发号施令。'
  revised_footnotes: []
  revision_rationale: 修订仅处理可由所给英语见证并结合该段希腊文常见措辞安全确认的问题：以“被定罪的人”恢复 convict 的含义，删除原稿额外加入的“不该”，并使“spare you”的书信语境更准确。保留“如同敬重耶稣基督”、主教作为父的对应、长老与上帝议会及使徒团体的比拟，以及关于教会之名的强烈措辞；不加入教派性解释。未设脚注，因为这些修订不需要读者脚注才能理解，且当前材料未提供须标注的异读。
