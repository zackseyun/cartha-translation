base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/042.yaml
  text: 'In the same way, let everyone respect the deacons as Jesus Christ, just as they should respect the bishop as a representation of the Father, and the presbyters as the council of God and the assembly of the apostles. Apart from these, there is not even the name of a church.


    I am convinced that you think this way concerning these matters, for I received an example of your love and have it with me in the person of your bishop. His very conduct is a great lesson, while his gentleness is power—a man to whom I think even the godless show reverence.


    Because I love you, I spare you in this way, though I could write more sharply on his behalf. But I did not consider myself qualified to do this: as a convict, to give you orders as though I were an apostle.'
translation:
  language: zh_hans
  text: '同样，所有人都要敬重执事，如同敬重耶稣基督；也要敬重主教，视他为父的表征；敬重众长老，视他们为上帝的议会和众使徒的团体。离开这些人，连“教会”这个名称也谈不上。


    我深信，你们在这些事上正是这样想的；因为我已经从你们的主教身上领受了你们爱心的典范，如今这典范也与我同在。他的举止本身就是极大的教诲，他的温柔就是力量。我想，就连不敬虔的人也尊敬他。


    因为我爱你们，所以这样宽待你们；其实为了他，我本可以写得更严厉些。但我认为自己没有资格这样做：我不过是个囚犯，不该像使徒一样向你们发号施令。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deacons
  choice: 执事
  rationale: 采用现代汉语基督教文献中通行且清楚的职分名称。
- source_word: bishop
  choice: 主教
  rationale: 对应古代教会单数监督职分；在本段与复数的“长老”相区别，保留其制度语境。
- source_word: presbyters
  choice: 众长老
  rationale: 准确表达复数，并采用读者熟悉的早期教会职分用语。
- source_word: type / representation
  choice: 表征
  rationale: 既表达代表或形象对应关系，又避免将其强化为身份等同。
- source_word: council of God
  choice: 上帝的议会
  rationale: 保留集体议事机构的意象，不弱化为泛指的顾问。
- source_word: college of Apostles
  choice: 众使徒的团体
  rationale: 以自然现代汉语表达有组织的群体含义，避免“学院”的时代错置。
- source_word: convict
  choice: 囚犯
  rationale: 依语境指伊格那丢受拘押的身份；“罪犯”可能不必要地强调罪责判定。
theological_decisions:
- issue: “敬重执事如同耶稣基督”的关系强度
  choice: 保留直白类比“如同敬重耶稣基督”
  alternative: 译作“把执事看作耶稣基督的代表”
  rationale: 见证文本本身使用直接比较；不擅自加入“代表”来消解其修辞张力。
- issue: 主教与父的对应关系
  choice: “视他为父的表征”
  alternative: “把他当作父上帝”或“父的代表”
  rationale: 避免身份等同，同时保留早期教会秩序所用的象征性对应。
- issue: “离开这些便无教会之名”的绝对语气
  choice: “连‘教会’这个名称也谈不上”
  alternative: “就不能成为完整的教会”
  rationale: 保留原陈述的强烈措辞，不引入“完整”等解释性限定。
- issue: 作者的使徒权威声明
  choice: “不该像使徒一样向你们发号施令”
  alternative: “不能凭使徒身份命令你们”
  rationale: 原文表达的是比较和自我克制，并未声称作者拥有使徒身份。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留早期教会职分术语及原文强烈的教会秩序表达。鉴于所提供材料明确注明希腊文直接复核尚待进行，本稿以公共领域英译见证及经审核的英文咨询层为暂定依据；正式出版前应据中编希腊文传统复核关键词、句法和文本异读。
