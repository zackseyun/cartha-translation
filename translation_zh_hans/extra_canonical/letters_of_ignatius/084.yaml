    rationale: ὅπου…φανῇ…ἐκεῖ τὸ πλῆθος ἔστω的重点是监督显现／到场之处，应有会众在场。译作“会众就应当聚集在那里”更明确而不增添神学解释。
  - severity: low
    issue: 末句“确实有效”未充分区分“稳妥”和“确定”。
    rationale: ἀσφαλές与βέβαιον并列；在礼仪语境中虽可涉及有效性，但文本也强调行为的可靠、确定。译为“稳妥而确定”更贴近原文的双重措辞。
