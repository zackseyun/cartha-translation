base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/084.yaml
  text: '[But] shun divisions, since they are the beginning of evils. All of you, follow your bishop as Jesus Christ followed the Father, and the presbytery as the Apostles; and respect the deacons as God’s commandment. Let no one do anything pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he has committed it.


    Wherever the bishop appears, there let the people be; even as wherever Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatever he approves is also well-pleasing to God, so that everything you do may be sure and valid.'
translation:
  language: zh_hans
  text: '[但]要避开分裂，因为分裂是各种恶事的开端。你们众人都要跟从监督，正如耶稣基督跟从父；也要顺从长老团，如同顺从众使徒；还要敬重执事，如同敬重上帝的诫命。凡属教会的事，任何人都不可撇开监督而擅自办理。只有在监督主持之下，或由他所委派的人主持的圣餐，才应当视为有效。




    监督在哪里出现，会众就应当聚集在那里；同样，耶稣基督在哪里，普世教会就在哪里。[a]撇开监督，无论施洗还是举行爱筵，都是不许可的；但凡他所认可的，也蒙上帝喜悦，好使你们所做的一切都稳妥而确定。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “普世教会”所译的词有“普遍的、完整的”之意；这里不一定是后世某一特定宗派的专名。
    reason: 该词在现代中文中容易被误解为特定宗派名称，需要交代其早期语境。
lexical_decisions:
- source_word: ἐπίσκοπος (inferred from the Greek tradition; direct review pending)
  choice: 监督
  rationale: 保留早期教会职分用语的基本含义，避免直接套用后来宗派化较强的称谓。
- source_word: πρεσβυτέριον (inferred; direct review pending)
  choice: 众长老
  rationale: 这里指由长老组成的群体；译为“众长老”比抽象的“长老团”更适合普通读者，同时保留集体含义。
- source_word: διάκονοι (inferred; direct review pending)
  choice: 执事
  rationale: 采用现代中文教会中通行、且能对应早期教会职分的称呼。
- source_word: εὐχαριστία (inferred; direct review pending)
  choice: 圣餐
  rationale: 采用现代中文最易理解的礼仪名称；其字面含义为“感恩礼”，但本段明确指教会礼仪。
- source_word: ἀγάπη (inferred; direct review pending)
  choice: 爱筵
  rationale: 保留早期基督徒团契筵席的专门含义，不泛化为一般聚餐。
- source_word: καθολικὴ ἐκκλησία (inferred; direct review pending)
  choice: 普世教会
  rationale: 表达“完整、普遍的教会”，避免现代读者误以为专指后来形成的某一宗派或制度。
- source_word: βέβαιος / βεβαία (inferred; direct review pending)
  choice: 有效／确实有效
  rationale: 上下文涉及教会行为获认可、具有确定效力；用“有效”保留制度性语气，同时以“确实”传达可靠、稳固的意味。
theological_decisions:
- issue: 监督与教会礼仪的关系
  choice: 按原文直陈：不可撇开监督办理教会事务、施洗或举行爱筵
  alternative: 弱化为仅须征询监督意见
  rationale: 见证文本使用明确的合法性和认可语言；不应为适应后世不同教会体制而削弱其历史主张。
- issue: “如同上帝的诫命”所修饰的对象
  choice: 译作“敬重执事，如同敬重上帝的诫命”
  alternative: 译作“敬重执事，因为这是上帝的诫命”
  rationale: 保留英文见证及可能的希腊文结构所具有的比较关系，不把它解释成明确的因果命令。
- issue: “普世教会”的含义
  choice: 保留“普世教会”并加脚注说明
  alternative: 译作“公教会”或“天主教会”
  rationale: “普世教会”较能呈现早期语境中的普遍性，又避免把该词无说明地等同于后世特定教会名称。
- issue: “耶稣在哪里”的语气
  choice: 译作“耶稣在哪里”
  alternative: 译作“耶稣基督在哪里出现”
  rationale: 避免补入原句未必明确表达的显现方式，保留简洁而具有神学张力的对应句式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。因所提供材料注明尚待直接核对希腊文，本稿以公开领域英文见证为主要起草依据，并仅依据可合理辨识的希腊术语作审慎判断；不把这些推断冒充已完成的原文校勘。“监督、长老、执事、圣餐、爱筵、普世教会”等采用读者可理解且尽量少带宗派预设的译法。
