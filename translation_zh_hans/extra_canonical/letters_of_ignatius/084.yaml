  naturalness: 文体庄重清楚，术语总体自然。将“众长老”调整为“长老团”能更直接表达πρεσβυτέριον的集体性；“会众应当聚集在那里”也比“会众就应当在哪里”更合乎现代汉语。
  terminology: “监督、执事、圣餐、爱筵、普世教会”均可保留。“长老团”比“众长老”更准确对应由长老组成的团体。脚注对καθολική的说明审慎且适当。
