review_pass:
  verdict: revise
  source_fidelity: 首句的“我的灵愿作”加入了原文未明说的意愿，且将 ψυχή（灵魂、生命）处理为“灵”并不理想；应保留其陈述语气。περίψημα τοῦ σταυροῦ 的精确修辞关系不宜过度释义，译为“十字架的渣滓”可保留其突兀和含混。第二段“由马利亚怀在腹中”在现代汉语中容易使马利亚成为“怀孕”动作的施事，宜改为“在马利亚腹中受孕”。“出于大卫的后裔”语义可通，但改为“出自大卫的后裔”更准确自然。
  naturalness: 整体庄重、易懂，三个反问的节奏也良好。不过“按着所安排的旨意”搭配生硬，且把 οἰκονομία 的“安排/计划”压缩为“旨意”；“照着神的安排”更自然，同时适合此处神圣安排的语境。
  terminology: 保留“绊脚石”“救恩”“永生”“圣灵”“受难”和“洁净水”均合适。“我们的神耶稣基督”应维持，不宜弱化。καλούμενοι φρόνιμοι 宜译为“被称为明达的人”，而非“号称”，因为后者额外强化了自我宣称的意思；原文的潜在反讽可由上下文承载。
  issues:
  - severity: medium
    issue: 首句加入“愿作”，并将“我的灵魂”译作“我的灵”。
    rationale: 原文为陈述，不含“愿意”的情态；ψυχή通常不宜在此无依据地缩窄为“灵”。
  - severity: medium
    issue: “由马利亚怀在腹中”句法不自然。
    rationale: 现代汉语容易理解为马利亚是“怀”这一动作的施事，未清楚表达基督在马利亚腹中受孕。
  - severity: low
    issue: “按着所安排的旨意”不够自然且略改变 οἰκονομία 的语义重心。
    rationale: “神的安排”保留安排、计划的含义，避免将其直接等同于“旨意”。
  - severity: low
    issue: “号称明达之人”略增原文没有明说的自我标榜色彩。
    rationale: “被称为明达的人”更贴近 καλούμενοι，仍不排除修辞语境中的讽刺。
  revised_text: '我的灵魂成了十字架的渣滓；这十字架对不信的人是绊脚石，对我们却是救恩和永生。智慧人在哪里？辩士在哪里？那些被称为明达的人的夸口在哪里？


    因为我们的神耶稣基督，照着神的安排，在马利亚腹中受孕；他出自大卫的后裔，也出自圣灵。他出生，又受了洗，为要借着他的受难洁净水。'
  revised_footnotes: []
  revision_rationale: 修订删除无原文依据的“愿”，以“灵魂”对应 ψυχή，并以“在马利亚腹中受孕”清楚表达受孕地点。其余关键神学表达维持原有的非解释性：耶稣同时“出自大卫的后裔，也出自圣灵”，且受难“洁净水”的对象和机制均不予扩写。由于本任务提供的是公共领域英语见证并注明希腊文直接复核尚待完成，本修订仅依据所列希腊关键词和中期修订本传统的可识别措辞作审慎调整。
