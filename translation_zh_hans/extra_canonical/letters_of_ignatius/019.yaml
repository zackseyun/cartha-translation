source:
  text: 'My spirit is made an offscouring for the Cross, which is a stumbling-block to them that are unbelievers, but to us salvation and life eternal. Where is the wise? Where is the disputer? Where is the boasting of them that are called prudent?


    For our God, Jesus the Christ, was conceived in the womb by Mary according to a dispensation, of the seed of David but also of the Holy Ghost; and He was born and was baptized that by His passion He might cleanse water.'
