base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/019.yaml
  text: 'My spirit is made refuse for the cross, which is a stumbling block to those who do not believe, but to us is salvation and eternal life. Where is the wise person? Where is the debater? Where is the boasting of those who are called prudent?


    For our God, Jesus the Christ, was conceived in Mary’s womb according to a dispensation, from the seed of David but also from the Holy Spirit. He was born and was baptized so that by his suffering he might cleanse water.'
translation:
  language: zh_hans
  text: '我的灵愿作十字架的渣滓；这十字架对不信的人是绊脚石，对我们却是救恩和永生。智慧人在哪里？辩士在哪里？那些号称明达之人的夸口在哪里？


    因为我们的神耶稣基督，按着所安排的旨意，由马利亚怀在腹中；他出于大卫的后裔，也出于圣灵。他出生，又受了洗，为要借着他的受难洁净水。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίψημα (represented by “offscouring/refuse” in the witness)
  choice: 渣滓
  rationale: 保留自我卑抑、被弃之物的强烈意象；比“垃圾”庄重，也不把可能含有的代赎性语感解释进正文。
- source_word: σκάνδαλον (represented by “stumbling-block”)
  choice: 绊脚石
  rationale: 沿用现代汉语中清楚而自然的圣经性意象，表达导致跌倒或拒绝的障碍。
- source_word: οἰκονομία (represented by “dispensation”)
  choice: 所安排的旨意
  rationale: 兼顾神圣安排与旨意之义，避免“时代论”“制度”等现代专门含义。
- source_word: σπέρμα Δαυίδ (represented by “seed of David”)
  choice: 大卫的后裔
  rationale: 在现代汉语中自然表达血统来源，同时保留弥赛亚谱系含义。
- source_word: πάθος (represented by “passion/suffering”)
  choice: 受难
  rationale: 在基督受苦与死亡的语境中准确、庄重，且不误解为一般情感或激情。
- source_word: καθαρίσῃ τὸ ὕδωρ (represented by “cleanse water”)
  choice: 洁净水
  rationale: 保留原句反常而富神学张力的表达，不改写成“借水洁净人”或限定为洗礼用水。
theological_decisions:
- issue: “我们的神耶稣基督”的基督论称谓
  choice: 直接译作“我们的神耶稣基督”
  alternative: “我们的神的基督耶稣”或弱化为“我们的主耶稣基督”
  rationale: 所给见证明确将“神”用于耶稣基督；不弱化其高基督论，也不增添解释。
- issue: 耶稣由大卫后裔与圣灵而来
  choice: “他出于大卫的后裔，也出于圣灵”
  alternative: 把两者解释为分别指人性与神性
  rationale: 保留并列结构及其张力，不把后期神学范畴直接写入正文。
- issue: 受洗与洁净水的目的关系
  choice: 保留“为要借着他的受难洁净水”
  alternative: 解释为耶稣受洗使洗礼之水成圣，或借水洁净信徒
  rationale: 原句把出生、受洗、受难和水的洁净紧密相连，但具体机制含混；正文不应替作者消解这种含混。
- issue: “十字架”在后半句的主语延续
  choice: 译作“这十字架……对我们却是救恩和永生”
  alternative: 补明为“基督对我们是救恩和永生”
  rationale: 依见证的语法保留十字架作为主语，不另换神学主语。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“辩士”保留修辞色彩，与连续三个反问相称；“号称明达”既传达“被称为谨慎/聪明”，也保留潜在讽刺意味。鉴于直接希腊文复核尚待进行，本稿以所给公共领域英语见证及可识别的希腊术语为暂定依据。
