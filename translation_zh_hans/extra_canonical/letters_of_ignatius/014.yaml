review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留了劝勉聚集、撒但势力受挫、信仰中的合一，以及和平消除天上地下争战的结构。为更贴近英文见证及可复核的希腊文措辞，宜避免把“cast down”强化为“摧毁”，并将末句的现在时被动意义译得更明确。
  naturalness: 原稿整体庄重通顺。“因为你们常常聚集”可改为“你们这样常常聚集的时候”，使因果和时间条件更自然；“在信仰里同心合意”改作“在信仰中同心合一”更凝练。
  terminology: “上帝”“撒但”“信仰”“和平”均合适。“感谢”可改为“感恩”，与本段传统礼仪语境及现代汉语宗教文体更协调，但不在正文断定其专指圣餐。脚注应锚定于相关词语，而非整段末尾。
  issues:
  - severity: medium
    issue: “撒但的权势就被摧毁”强化了“are cast down”的程度。
    rationale: 所据英文见证为“are cast down”；希腊文传统对应的动词通常指推倒、击败或废除，并不要求译作彻底“摧毁”。“被击败”保留有力语气而较不强化。
  - severity: low
    issue: “他的恶谋”较“his mischief”及其底层语义略窄。
    rationale: “恶谋”侧重计划或阴谋；原语境可泛指撒但造成的祸害、破坏或败坏。“他的祸害”保留概括性。
  - severity: low
    issue: “都止息了”使用完成体，且对“is abolished”的表达略弱。
    rationale: 本句为格言式、现时性的陈述；“一切争战都被废除”更直接体现被动的消除／废止，也不额外限定争战的性质。
  - severity: low
    issue: 脚注标记置于段末，未直接锚定“感恩”的礼仪性语义说明。
    rationale: 将标记置于“感恩”之后，读者可清楚知道“感恩礼”可能性是针对该词，而文本依据说明仍适用于全段。
  revised_text: '所以，你们要更加勤勉，常常聚集，向上帝感恩[a]，并归荣耀给他。因为你们这样常常聚集的时候，撒但的权势就被击败；在你们信仰中的同心合一里，他的祸害也归于无有。


    没有什么比和平更好；在和平中，天上和地上一切争战都被废除。'
  revised_footnotes:
  - marker: a
    text: 本段暂据所提供的公版英文见证翻译；中编希腊文抄本传统尚待直接复核。“感恩”也可能带有礼仪性的“感恩礼”含义。
    reason: 资料明确说明希腊文审查尚未完成；脚注标示本段的暂定文本依据，并说明“感恩”一词可能具有的礼仪性语义，而不在正文中预先限定其含义。
  revision_rationale: 修订保留原段的劝勉、因果关系和宇宙性和平图景，同时将“cast down”由过强的“摧毁”调整为“被击败”，将“mischief”译为较宽泛的“祸害”，并以“被废除”对应末句的被动消除。脚注内容不作实质扩张，只将锚点移至相关词语。
