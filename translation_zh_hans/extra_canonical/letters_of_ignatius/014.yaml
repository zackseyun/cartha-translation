base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/014.yaml
  text: 'Therefore, be diligent to meet together more frequently for thanksgiving to God and for his glory. For when you meet together frequently, the powers of Satan are cast down, and his mischief comes to nothing in the concord of your faith.


    There is nothing better than peace, in which all warfare of things in heaven and things on earth is abolished.'
translation:
  language: zh_hans
  text: '所以，你们要竭力更常聚集，为要感谢上帝，归荣耀给他。因为你们常常聚集，撒但的权势就被摧毁；你们在信仰里同心合意，他的恶谋也就归于无有。


    没有什么比和平更美好；在和平中，天上和地上一切争战都止息了。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段暂据所提供的公版英文见证翻译；中编希腊文抄本传统尚待直接复核。“感谢”也可能带有礼仪性的“感恩礼”含义。
    reason: 资料明确说明希腊文审查尚未完成；脚注向读者标示文本依据及关键词的真实不确定性。
lexical_decisions:
- source_word: meet together more frequently
  choice: 更常聚集
  rationale: 既保留频率比较的语义，也以现代教会语境中自然明白的表达传达共同聚会。
- source_word: thanksgiving to God
  choice: 感谢上帝
  rationale: 按所提供见证直译其对象与行动；不在希腊文复核前擅自限定为圣餐含义。
- source_word: for His glory
  choice: 归荣耀给他
  rationale: 以自然汉语表达目的关系，同时保留荣耀归于上帝的神学方向。
- source_word: powers of Satan
  choice: 撒但的权势
  rationale: 保留复数概念所涵盖的多重势力或能力，但汉语以集合性单数“权势”表达较自然。
- source_word: concord of your faith
  choice: 你们在信仰里同心合意
  rationale: 将“和谐、一致”落实为群体在信仰中的同心，避免生硬的“信仰的和谐”。
- source_word: peace
  choice: 和平
  rationale: 此处与“争战”相对，译作“和平”比“平安”更直接保留公共、宇宙性的对照。
- source_word: is abolished
  choice: 都止息了
  rationale: 在和平与争战的语境中，“止息”自然庄重；不把意义强化为形而上的彻底消灭。
theological_decisions:
- issue: “感谢”是否专指圣餐（Eucharist）
  choice: 正文译作一般性的“感谢上帝”
  alternative: 译作“举行感恩礼／圣餐”
  rationale: 所提供材料仅为英文见证，且明确注明希腊文审查尚待进行；因此不应在正文中预先锁定礼仪性解释。
- issue: 信徒聚集如何使撒但的恶谋失效
  choice: 保留原文直接的因果陈述
  alternative: 弱化为“有助于抵挡撒但”
  rationale: 原见证明确说撒但的权势被摧毁、恶谋归于无有；译文保留其强烈神学主张，不另作机制解释。
- issue: 天上和地上的“争战”所指范围
  choice: 保留为“天上和地上一切争战”
  alternative: 解释为属灵争战与人间战争
  rationale: 原句具有宇宙性和概括性，可能涵盖多层意义；正文不应将其缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留劝勉、因果和格言式收束的结构；“归于无有”“止息”略具典雅感，但仍为普通读者可理解。因缺少希腊原文直审，本稿明确作为暂定译文，不以英文POB取代源语言证据。
