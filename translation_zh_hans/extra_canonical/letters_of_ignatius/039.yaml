base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/039.yaml
  text: Ignatius, who is also called Theophorus, to the church beloved by God the Father of Jesus Christ—the holy church in Tralles of Asia, chosen and worthy of God, having peace in flesh and spirit through the passion of Jesus Christ, who is our hope through our resurrection unto him. I also greet this church in the divine fullness, after the apostolic fashion, and wish her abundant greeting.
translation:
  language: zh_hans
  text: 又名“提奥福罗斯”的伊格那修，致蒙耶稣基督的父上帝所爱的教会，就是亚细亚特拉勒斯的圣教会：蒙拣选、配得上帝，借着耶稣基督的受难，在肉身和灵里享有平安；耶稣基督因我们复活归向他而成为我们的盼望。[a] 我也照使徒的方式，在上帝的丰盛中向这教会问安，并祝愿你们满得喜乐。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因我们复活归向他”依所提供的英文见证译出；这句话也可理解为“他是我们的盼望，使我们复活归向他”。希腊文原文尚待直接复核。
    reason: 保留句法和神学关系上的真实歧义，并明确当前底本限制。
  - marker: b
    text: “祝愿你们满得喜乐”所对应的书信问安语，字面上也可译作“致以丰盛的问安”。
    reason: 说明自然汉语译法与较形式对应译法之间的差别。
lexical_decisions:
- source_word: Theophorus (Θεοφόρος, presumed from the Greek tradition)
  choice: 提奥福罗斯
  rationale: 保留作为别名的音译，不在正文中强行确定其可能的词义“承载上帝者”或“蒙上帝承载者”；因希腊文复核尚待完成。
- source_word: passion
  choice: 受难
  rationale: 在早期基督教语境中自然表达耶稣所受的苦难与死亡，同时避免仅译作较宽泛的“苦难”。
- source_word: in flesh and spirit
  choice: 在肉身和灵里
  rationale: 保留原见证文本的二重表达及其可能的神学张力，不改写为单纯的“身心”。
- source_word: Divine plenitude
  choice: 上帝的丰盛
  rationale: 以现代汉语表达“神圣的丰盛/圆满”，同时不预先限定其具体神学所指。
- source_word: abundant greeting
  choice: 满得喜乐
  rationale: 将书信问安语的丰盛祝愿译成自然中文；通过脚注说明其字面与语用范围。
theological_decisions:
- issue: “through our resurrection unto Him”修饰与意义关系
  choice: 耶稣基督因我们复活归向他而成为我们的盼望
  alternative: 耶稣基督是我们的盼望，使我们复活归向他／我们因他的复活而有盼望
  rationale: 依所给英文见证保留“我们的复活”以及“归向他”的方向性，不擅自改成“他的复活”；但原句结构可能有歧义，故加注说明。
- issue: 教会“配得上帝”的含义
  choice: 配得上帝
  alternative: 在上帝看来配得／与上帝相称
  rationale: 保留简洁而张力较强的称谓，不解释为凭行为赚取资格，也不加入特定教派框架。
- issue: 平安与基督受难的关系
  choice: 借着耶稣基督的受难……享有平安
  alternative: 在耶稣基督的受难中得平安
  rationale: 依见证文本的through表达媒介或根基关系，不进一步规定救赎机制。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留古代书信序言的长句与礼仪性问安风格，但适度分号断句以便阅读。专名按现代中文音译处理。由于所给材料明确说明希腊文复核尚待完成，本稿以公共领域英文见证为暂定依据，脚注对关键不确定处作出标示。
