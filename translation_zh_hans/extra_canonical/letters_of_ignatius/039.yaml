review_pass:
  verdict: revise
  source_fidelity: 草稿整体忠实反映所给英文见证的书信称谓、教会所在地、拣选与平安的祝祷，以及使徒式问安。惟“因我们复活归向他而成为我们的盼望”把原文中可能附属于“平安”的短语改成了基督“成为盼望”的因果根据，句法关系不够忠实。
  naturalness: 正文庄重且大体流畅，但“配得上帝”在现代汉语中生硬，容易被理解为人获得上帝；“满得喜乐”也没有充分表达书信结语的问安／安好祝愿。修订后以更自然的“与上帝相称”和“大得安好”表达，同时保留正式书信体。
  terminology: “提奥福罗斯”“受难”“肉身和灵”“上帝的丰盛”均可保留。“与上帝相称”适合表达英文见证的“worthy of God”，又避免“配得上帝”的不自然歧义。
  issues:
  - severity: medium
    issue: “因我们复活归向他而成为我们的盼望”改变了短语的句法关联。
    rationale: 所给英文见证为“who is our hope through our resurrection unto Him”；“through/in our resurrection unto him”可与前述平安或整句祝祷相关，未必是基督成为盼望的原因。应以破折号及脚注保留这一关联歧义。
  - severity: medium
    issue: “配得上帝”不合现代汉语惯用搭配。
    rationale: 该说法容易被读作“获得上帝”，而非教会在上帝面前相称／蒙上帝认可。改为“与上帝相称”较自然，且不引入功德论解释。
  - severity: low
    issue: “祝愿你们满得喜乐”将书信问安语过度限缩为情绪上的喜乐。
    rationale: 英文见证的“abundant greeting”以及相应古代书信结语主要是问安、安好祝愿；“愿你们大得安好”更贴切，也保留丰盛祝愿的语气。
  revised_text: 伊格那修，又称“提奥福罗斯”，致蒙耶稣基督的父上帝所爱的教会，就是在亚细亚特拉勒斯的圣教会：这教会蒙拣选、与上帝相称；愿你们在肉身和灵里，借着耶稣基督的受难——他是我们的盼望——并在我们复活归向他时，得享平安。[a] 我也照使徒的方式，在上帝的丰盛中向这教会问安，并愿你们大得安好。[b]
  revised_footnotes:
  - marker: a
    text: “并在我们复活归向他时”依所提供的英文见证译出（“through our resurrection unto him”）。它与“平安”“盼望”或全句的具体修饰关系可有不同理解；所据希腊文尚待直接复核。
    reason: 避免把该短语确定为“基督成为我们盼望”的因果理由，并保留见证文本的句法歧义及底本限制。
  - marker: b
    text: “愿你们大得安好”对应书信结语的丰盛问安；也可较直译为“致以丰盛的问安”。
    reason: 说明自然的现代汉语书信祝愿与形式对应译法的关系。
  revision_rationale: 修订不改变书信的称谓、祝祷或神学用语，只校正复活短语的句法归属，改善“配得上帝”的汉语歧义，并使结语问安更贴合原有书信功能。脚注继续明示现阶段以公共领域英文见证为依据、希腊文仍待直接复核。
