review_pass:
  verdict: revise
  source_fidelity: 需修订两处关键表达：σάρκοφόρος（“带有／具有肉身的”）不应译为带有完成时意味的“曾身披肉身”；末句把“受难，乃是我们的复活”的同位／等同结构改成“使我们复活的受难”，增加了原文未明说的因果关系。其余段落基本保留了原文的论战性反转、排比和含混的意象。
  naturalness: 整体书面语庄重自然。“归向那使我们复活的受难”虽可读，但既弱化原句的凝缩结构，也略显解释性。改为“归回那受难——这受难就是我们的复活”较忠实且仍通顺。
  terminology: “否认”“真理”“摩西的律法”“福音”“受难”均合宜。“身负尸身的人”可保留其刻意尖锐且未完全明晰的对照意象；“身披肉身”宜改为“具有肉身”，避免将σάρκοφόρος误作“披戴”或暗示仅为过去状态。
  issues:
  - severity: medium
    issue: “不承认他曾身披肉身”对“a bearer of flesh／σαρκοφόρος”的处理不够准确。
    rationale: “曾”引入原文没有的过去完成意味；“身披”也较容易带出可脱卸的衣饰意象。这里所要求承认的是他具有真实肉身。
  - severity: high
    issue: “那使我们复活的受难”将末句的“受难，就是我们的复活”改写为因果关系。
    rationale: 原文以高度凝缩的同位／等同结构表述；改为“使我们复活”属于额外神学解释，应在正文保留其结构与张力。
  - severity: low
    issue: “不承认这一点”可改为“凡不这样说的”。
    rationale: 英文见证的“affirmeth not this”及对应希腊措辞指向公开的宣认／说出；改法更贴近措辞，并不改变意义。
  revised_text: '但有些人因无知而否认他；不如说，他们已被他否认。他们是死亡的拥护者，而不是真理的拥护者。众先知的预言没有使他们信服，摩西的律法没有，直到如今，福音也没有；就连我们各人所受的苦难也没有，因为他们对我们也抱着同样的看法。


    若有人称赞我，却亵渎我的主，不承认他具有肉身，这对我有什么益处呢？凡不这样说的，就是彻底否认他；而这人自己却是身负尸身的人。[a]


    至于这些不信之人的名字，我认为不宜写下来。不，我甚至绝不要记起他们，直到他们悔改，归回那受难——这受难就是我们的复活。[b]'
  revised_footnotes:
