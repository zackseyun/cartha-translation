review_pass:
  verdict: revise
  source_fidelity: 'The draft generally preserves the witness’s sequence, polemical reversal (“deny him / have been denied by him”), and the deliberately stark contrast between “bearer of flesh” and “bearer of a corpse.” Two renderings, however, add interpretation: “曾身披肉身” can imply that bearing flesh was merely past, and “那使我们复活的受难” converts the compressed apposition “the passion, which is our resurrection” into a causal statement. The latter should remain appositional.'
  naturalness: The Chinese is clear and appropriately solemn. “身披肉身” is readable but somewhat literary; “带着肉身” more directly reflects the concrete bearer-language without suggesting clothing imagery. The revised final sentence is both natural and closer to the source’s compressed rhetoric.
  terminology: 'Retain “否认”“真理”“摩西的律法”“福音”“受难” and the lower-case pronoun convention used in the draft. Render the flesh/corpse wordplay with matched expressions: “带着肉身” / “带着尸体.” Do not construe “our resurrection” as a merely causal effect of the passion.'
  issues:
  - severity: medium
    issue: “曾身披肉身” introduces a potentially misleading past-time implication.
    rationale: The supplied witness says “He was a bearer of flesh”; the underlying idiom is a predicate concerning his embodied reality, not necessarily a statement confined to a past period. “承认他是带着肉身的” preserves the claim without that added implication.
  - severity: medium
    issue: “那使我们复活的受难” resolves an appositional theological expression into causation.
    rationale: The witness’s “the passion, which is our resurrection” identifies the passion with “our resurrection” in a deliberately condensed formulation. The existing footnote acknowledges this, but the main text should itself preserve it rather than explain it.
  - severity: low
    issue: The footnote on the final sentence is unnecessary after a source-close revision.
    rationale: Once the apposition is retained in the text, the note no longer supplies needed ambiguity preservation. The explanatory note on “带着尸体的人” remains useful because the image’s precise polemical force is not explicit in the supplied witness.
  revised_text: '但有些人因无知而否认他；不如说，他们已被他否认。他们是死亡的拥护者，而不是真理的拥护者。众先知的预言没有使他们信服，摩西的律法没有，直到如今，福音也没有；就连我们各人所经历的苦难也没有，因为他们对我们也抱着同样的看法。


    若有人称赞我，却亵渎我的主，不承认他是带着肉身的，这对我有什么益处呢？凡不这样说的，就是彻底否认他；而这人自己却是带着尸体的人。[a]


    至于这些不信之人的名字，我认为不宜写下来。不，我甚至绝不要记起他们，直到他们悔改，归向受难——这受难就是我们的复活。'
  revised_footnotes:
  - marker: a
    text: “带着尸体的人”直译保留了原文与“带着肉身的”相对的尖锐意象；这句话的具体含义并不完全明确。
    reason: 避免把含混的论战性比喻过度解释为某一种确定的人论或末世论主张。
  revision_rationale: The revision makes only safe source-fidelity corrections. It retains the original’s polemical register and rhetorical ambiguity, removes the added past-time nuance in the flesh-bearing clause, and restores the final statement’s appositional form rather than paraphrasing it as a causal claim. The remaining note preserves the uncertainty of the corpse-bearing image without imposing a doctrinal interpretation.
