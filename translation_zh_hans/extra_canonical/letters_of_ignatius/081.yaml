base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/081.yaml
  text: 'But certain people ignorantly deny Him—or rather, have been denied by Him—being advocates of death rather than of the truth; and they have not been persuaded by the prophecies, nor by the law of Moses, nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if someone praises me but blasphemes my Lord, not confessing that He was a bearer of flesh? Yet whoever does not affirm this thereby denies Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing—nay, far be it from me even to remember them—until they repent and return to the passion, which is our resurrection.'
translation:
  language: zh_hans
  text: '但有些人因无知而否认他；不如说，他们已被他否认。他们是死亡的拥护者，而不是真理的拥护者。众先知的预言没有使他们信服，摩西的律法没有，直到如今，福音也没有；就连我们各人所受的苦难也没有，因为他们对我们也抱着同样的看法。


    若有人称赞我，却亵渎我的主，不承认他具有肉身，这对我有什么益处呢？凡不这样说的，就是彻底否认他；而这人自己却是身负尸身的人。[a]


    至于这些不信之人的名字，我认为不宜写下来。不，我甚至绝不要记起他们，直到他们悔改，归回那受难——这受难就是我们的复活。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身负尸身的人”直译保留了原文与“具有肉身”相对的尖锐意象；这句话的具体含义并不完全明确。
    reason: 保留论战性比喻及其歧义，不把它解释为某一种确定的人论或末世论主张。
  - marker: b
    text: “受难就是我们的复活”保留原文的同位／等同表达；“受难”在此指基督的受苦与死亡。
    reason: 避免把原文简练而具张力的表述改释为单一的因果关系，同时为现代读者说明术语所指。
lexical_decisions:
- source_word: deny Him / have been denied by Him
  choice: 否认他／已被他否认
  rationale: 保留原文主动与被动之间刻意形成的反转，不把后一句弱化为一般的弃绝。
- source_word: advocates of death
  choice: 倡导的是死亡
  rationale: 保留其鲜明的论战语气，以及“死亡—真理”的对照。
- source_word: bearer of flesh
  choice: 身披肉身
  rationale: 自然表达基督真实具有肉身的含义，同时保留“承载、披有肉身”的意象，避免仅译作抽象的“成为人”。
- source_word: bearer of a corpse
  choice: 身负尸身的人
  rationale: 保留与“身披肉身”对应而又尖锐反转的形象，不替作者解释其确切所指。
- source_word: passion
  choice: 受难
  rationale: 在早期基督教语境中指基督的受苦与死亡；“受难”简明庄重，并与复活形成张力。
theological_decisions:
- issue: “已被他否认”的施事者与审判意味
  choice: 按代词直译为“已被他否认”
  alternative: 译作“已被他弃绝”或淡化为无人称表达
  rationale: 保留作者关于否认基督者反被基督否认的神学反转，不额外界定其终局性质。
- issue: 基督与肉身的关系
  choice: 译作“不承认他曾身披肉身”
  alternative: 译作“不承认他成为了人”
  rationale: 前者保留原文肉身论争的具体措辞，不将其完全解释成人论概括。
- issue: “受难，就是我们的复活”之关系
  choice: 译作“那使我们复活的受难”并加注直译
  alternative: 直译为“归向受难，就是我们的复活”
  rationale: 正文采用较自然的现代汉语表达，但脚注保存原句同位结构及其高度凝缩的神学张力。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语，保留原段强烈的论战语气。鉴于直接希腊语审校尚待完成，本稿依据所供公共领域英文见证谨慎起草；不以英文中方括号补足的“对我”作为脚注，因为汉语疑问句可自然表达该关系。
