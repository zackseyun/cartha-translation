  witness_license: Public domain witness
  english_witness: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/026.yaml
  text: 'Yes, and it is fitting for you also not to presume upon the youth of your bishop, but, in accordance with the power of God the Father, to show him every reverence. I have learned that the holy presbyters likewise have not taken advantage of his outwardly youthful condition, but yield to him as to one who is wise in God—yet not to him, but to the Father of Jesus Christ, the Bishop of all.


    Therefore, for the honor of Him who desired you, it is right that you should obey without pretense. For a person does not so much deceive this visible bishop as cheat the One who is invisible; and in such a case, that person must reckon not with flesh but with God, who knows the hidden things.'
translation:
  language: zh_hans
  text: '你们也不可因你们监督的年轻而轻看他；反要按着父神的权能，向他尽一切敬重。正如我所知道的，圣洁的长老们也没有趁着他表面上年轻的身份而占他的便宜，反倒如同顺服一位在神里面有智慧的人那样顺服他；更准确地说，他们顺服的不是他，而是耶稣基督的父，就是众人的监督。


    因此，为了尊荣那位愿意你们如此行者[a]，你们理当毫不虚假地顺服。因为人所欺哄的，与其说是这位看得见的监督，不如说是那位看不见的；在这事上，他所打交道的不是血肉之人，而是那位知道隐秘之事的神。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“那位愿意你们的人”。此处的“愿意”可理解为愿意、定意或要求你们作出前文所说毫不虚假的顺服；正文以“愿意你们如此行”补足汉语所需的语境，未把它限定为“拣选”“呼召”或“归属”。
    reason: 避免原译“归属他”所添加的意思，同时保留该简短希腊语短语在具体动作和神学措辞上的开放性。
lexical_decisions:
- source_word: bishop / ἐπίσκοπος（待希腊文核校）
  choice: 监督
  rationale: 采用能体现“看顾、督理”职分的现代中文译法，并保留本段将地方教会职分与神作“众人的监督”相对应的文字联系。
- source_word: presbyters / πρεσβύτεροι（待希腊文核校）
  choice: 长老们
  rationale: 这是早期基督教职分语境中自然且通行的中文表达。
- source_word: presume upon / take advantage of
  choice: 轻看／轻慢
  rationale: 上下文强调不可因监督年轻而不把他当回事；用“轻看、轻慢”比直译为“利用”更符合语境。
- source_word: give place / yield
  choice: 把地位让给
  rationale: 保留长老承认其职分地位、对他退让的含义，避免扩大为无条件服从的一般命题。
- source_word: wise in God
  choice: 在神里面有智慧
  rationale: 保留原表达的神学关系，不简化成普通意义上的“敬虔明智”。
- source_word: without dissimulation
  choice: 毫不虚假地
  rationale: 表达顺服不可伪装、假意或表里不一。
- source_word: reckon with
  choice: 所要面对
  rationale: 自然表达须向神交账、与神打交道的警告意味，同时不把含义过度限定为末日审判。
theological_decisions:
- issue: 对年轻监督的敬重与顺服
  choice: 保留其依据父神权能及教会职分的论述
  alternative: 将其泛化为对一切年轻领袖的绝对服从
  rationale: 原段的论述对象是特定教会职分，且顺服最终指向神；不应扩展成无条件服从任何领袖。
- issue: “不是他，而是耶稣基督的父”的所指
  choice: 译为“其实，他们所顺服的不是他，而是……”
  alternative: 理解为长老所让位的对象不是他
  rationale: 上下文的“让位／顺服”关系存在修辞张力；此译使中文连贯，但仍保留顺服可见监督即关乎顺服神的核心逻辑。
- issue: “那位要你们归属他的人”的身份与动作
  choice: 正文保留相对含混的措辞，并加脚注
  alternative: 明确译为“拣选你们的神”或“呼召你们的神”
  rationale: 现有材料仅为英语见证，且注明希腊文核校待定；不宜在缺少源文确认时擅自锁定动词及其神学含义。
- issue: 可见监督与不可见者的关系
  choice: 译为欺瞒可见监督实质上是在蒙骗那位不可见者
  alternative: 把二者等同
  rationale: 保留原文的类比与神学警告，但不把属人的监督与神本体等同。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。为保存段落内部的修辞联系，ἐπίσκοπος 一律拟译“监督”，包括“众人的监督”；避免使用可能预设后期宗派制度的称谓。由于提交材料明确说明希腊文源文审查尚待进行，本稿属于依据公共领域英语见证所作的暂定译稿，尤其是脚注[a]所涉短语应在出版前核校。
