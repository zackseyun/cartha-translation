    text: 直译为“那位愿意你们的人”。此处的“愿意”可理解为愿意、定意或要求你们作出前文所说毫不虚假的顺服；正文以“愿意你们如此行”补足汉语所需的语境，未把它限定为“拣选”“呼召”或“归属”。
    reason: 避免原译“归属他”所添加的意思，同时保留该简短希腊语短语在具体动作和神学措辞上的开放性。
  revision_rationale: 修订以希腊文的句法与关键动词为优先，并与所给英文见证核对。“顺服”恢复ὑποτάσσεσθαι的主要意义；“更准确地说”对应μᾶλλον δέ的修辞校正；脚注及正文删除无根据的“归属”增译。其余地方保留原稿的现代、庄重语体，以及“监督／众人的监督”的词汇呼应。
