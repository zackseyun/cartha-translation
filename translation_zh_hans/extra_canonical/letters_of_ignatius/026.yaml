review_pass:
  verdict: revise
  source_fidelity: 译稿总体忠实反映所给英文见证，并保留了可见监督与不可见的神之间的修辞关联。但“把地位让给他”把 give place / yield 具体化为让出职分或地位，力度过强；随后将“不是他，而是……”改作“他们所顺服的不是他”也改变了原句对“让步／敬让”动作的直接修正。脚注锚点处“要你们归属他”额外加入“归属”的意思，不足以保留英文见证的含混。
  naturalness: 整体庄重、通顺，适合现代书面普通话。“向他让步（更确切地说，不是向他，而是向……）”既自然，又能保留原文自我修正的句法和修辞。“那位愿意要你们的”在现代汉语中略显生硬，但此处正是为避免擅自确定动词的具体含义；以脚注说明可接受。
  terminology: “监督”“长老们”“父神”“耶稣基督”“神”均可保留。“监督”在两处一致译出 bishop，且“众人的监督”保留原文的称谓呼应。
  issues:
  - severity: medium
    issue: “把地位让给他”过度具体化 give place / yield。
    rationale: 原见证说长老“yield to him / give place to him”，重点是敬让、退让或承认其应有位置；“把地位让给”容易理解为长老交出自己的职位或地位。
  - severity: medium
    issue: “其实，他们所顺服的不是他”改变了原句所修正的动作。
    rationale: “yet not to him, but to the Father”紧接在“yield to him”之后，最稳妥的中文应继续以“向他让步／敬让”为中心，而不将其解释性改写为一般性的“顺服”。
  - severity: medium
    issue: “那位要你们归属他的人”添加了原见证未明说的“归属”关系。
    rationale: 英文“Him that desired you”及材料说明均要求保留歧义；“归属他”会使其偏向招聚、归信或所有权含义。
  revised_text: '你们也不该因你们的监督年轻就轻看他；相反，要照着父神的权能，向他表示完全的敬重。我得知，圣洁的长老们也没有因他外表年轻而轻慢他，反而把他当作一个在神里面有智慧的人，向他让步；更确切地说，不是向他，而是向耶稣基督的父，就是众人的监督。


    因此，为尊重那位愿意要你们的[a]，你们理当毫不虚假地顺服。因为人若欺瞒这位看得见的监督，与其说是在欺骗他，不如说是在蒙骗那位看不见的；这样的人所要面对的不是血肉之人，而是那位知道隐秘之事的神。'
  revised_footnotes:
  - marker: a
    text: “那位愿意要你们的”也可能理解为“那位拣选（或呼召）你们的”。现有译文依据所提供的英文见证保留其含混性；有待希腊文源文核校。
    reason: 英文见证作“Him that desired you”，且 POB 审校记录明确指出此处含混。正文避免加入“归属”等额外关系，也不在未完成希腊文核校前锁定为“拣选”或“呼召”。
  revision_rationale: 修订限于消除三处不必要的解释性扩展：以“向他让步”对应 give place / yield；保留“更确切地说，不是向他，而是向……”对该动作的原有修正；并以“愿意要你们”及脚注维持“Him that desired you”的未决含义。其余用语和段落结构均予保留。
