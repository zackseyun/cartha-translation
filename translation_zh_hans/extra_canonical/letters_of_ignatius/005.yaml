review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了本段以奔跑、琴弦、合唱与齐唱贯串的合一意象，也妥善保留了“有分于上帝”的参与性措辞。惟“与主教的心意和谐同行”弱化了原文及英译见证中“奔跑”的主动比喻；“上帝所定的音调”则将“上帝的基调／音调”解释性地改为上帝所规定的音调，宜避免增加该限定。
  naturalness: 整体庄重、现代且可朗读。“配得上帝的众长老团”在汉语中搭配稍显生硬；“你们持守无可指责的合一是有益的”也不如直接表达“你们处在无可指责的合一中”自然。修订使句法更顺畅，同时保留音乐意象。
  terminology: “主教”“众长老团”“里拉琴”“肢体”“有分于上帝”均可保留。“众长老团”配合注释足以说明其为集体职分，且不强加现代制度含义。将 χρῶμα θεοῦ 暂译为“上帝的基调”，保留其在音乐语境中的比喻性和属格关系，不扩展为神所指定的调子。
  issues:
  - severity: medium
    issue: “和谐同行”未充分保留“run”的奔跑比喻。
    rationale: 英译见证明确作“run in harmony”；改作“与……步调一致地奔跑”可保留运动和协调两层意象。
  - severity: medium
    issue: “上帝所定的音调”加入了“所定”的解释。
    rationale: 见证译文为“the key note of God”，并不明说此音调是上帝规定的。译为“上帝的基调”较能保留原有的简洁和歧义。
  - severity: low
    issue: “配得上帝的众长老团”汉语搭配不够自然。
    rationale: 以“蒙上帝悦纳的”表达其受上帝认可的正面评价，读来更自然；这属于措辞顺译，非制度性或教义性扩展。
  - severity: low
    issue: “持守无可指责的合一”将状态性表述略强化为守持行为。
    rationale: “be in blameless unity”更直接地指处于无可指责的合一中；修订可避免额外强调。
  revised_text: '所以，你们理当与主教的心意步调一致地奔跑；你们也确实这样做。你们那尊贵、蒙上帝悦纳的众长老团[a]与主教协调一致，正如琴弦与里拉琴相合。因此，耶稣基督在你们的同心与和谐相爱中被歌唱。


    你们每一个人都要组成一个合唱队，好在同心中彼此和谐，领受上帝的基调，借着耶稣基督，以同一声音向父歌唱；这样，他既会听见你们，也会借着你们的善行认出你们是他儿子的肢体[b]。因此，你们处在无可指责的合一中是有益的，好使你们常常有分于上帝。'
  revised_footnotes:
  - marker: a
    text: “众长老团”指由众长老组成的群体；传统译法常作“长老会”或“长老团”。
    reason: 帮助普通读者理解这一集体职分名称，同时避免与现代宗派名称混淆。
  - marker: b
    text: “肢体”指身体的各部分，也就是属于他儿子的成员；此词在希腊文中也可用于音乐语境，可能与本段歌曲、音调的意象形成文字呼应。
    reason: 说明身体隐喻，并提示汉语正文难以完整重现的可能文字呼应。
  revision_rationale: 修订集中处理两处可能影响源文忠实度的解释性偏移：恢复“奔跑”的比喻，并删除“所定”这一未明示的限定。其余调整旨在改善现代汉语的搭配和句法，同时维持主教、长老团、音乐和合一等关键术语与意象。
