  english_witness: 'So then it becometh you to run in harmony with the mind of the bishop; which thing also ye do. For your honorable presbytery, which is worthy of God, is attuned to the bishop, even as its strings to a lyre. Therefore in your concord and harmonious love Jesus Christ is sung.


    And do ye, each and all, form yourselves into a chorus, that being harmonious in concord and taking the key note of God ye may in unison sing with one voice through Jesus Christ unto the Father, that He may both hear you and acknowledge you by your good deeds to be members of His Son. It is therefore profitable for you to be in blameless unity, that ye may also be partakers of God always.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/005.yaml
  text: 'So then it is fitting for you to run in harmony with the mind of the bishop, as indeed you do. For your honorable council of elders, which is worthy of God, is attuned to the bishop like strings to a lyre. Therefore Jesus Christ is sung in your unity and harmonious love.


    Each and every one of you should form yourselves into a chorus, so that, being harmonious in unity and taking the key note of God, you may sing in unison with one voice through Jesus Christ to the Father. Then he may both hear you and acknowledge by your good deeds that you are members of his Son. It is therefore beneficial for you to be in blameless unity, so that you may always share in God.'
translation:
  language: zh_hans
  text: '所以，你们理当与主教的心意同心奔走；你们也确实这样做。你们那尊贵、堪配上帝的众长老团[a]与主教协调一致，如琴弦与竖琴相协调。因此，在你们的同心与和谐相爱之中，耶稣基督被歌唱。


    你们每一个人都要成为一个合唱团，好在同心中彼此和谐，领受上帝的音调，借着耶稣基督，同声向父歌唱；这样，他就会听见你们，并藉着你们所行的善，认出你们是他儿子的肢体[b]。因此，你们处在无可指摘的合一中是有益的，好使你们始终有分于上帝。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众长老团”指由众长老组成的群体；传统译法常作“长老会”或“长老团”。
    reason: 帮助普通读者理解这一集体职分名称，同时避免与现代宗派名称混淆。
  - marker: b
    text: “肢体”指身体的各部分，即属于他儿子的成员。这里的原文词语与前面的“音调”在希腊语中形成文字呼应。
    reason: 说明身体隐喻，并提示汉语正文难以重现的希腊语音乐词与“肢体”一词的文字游戏。
lexical_decisions:
- source_word: γνώμη（据中篇希腊文本传统；尚待直接核校）
  choice: 心意
  rationale: 既可指思想、意向或判断；“心意”在现代汉语中自然，也不把主教的意向窄化为命令或正式教令。
- source_word: ἐπίσκοπος（据中篇希腊文本传统；尚待直接核校）
  choice: 主教
  rationale: 采用早期基督教文献中通行且易懂的职分名称；不在正文中额外界定其后世制度内涵。
- source_word: πρεσβυτέριον（据中篇希腊文本传统；尚待直接核校）
  choice: 众长老团
  rationale: 表达由多位长老构成的群体，避免仅用“长老会”而引出现代宗派或机构联想。
- source_word: συνήρμοσται / ἁρμονία（据中篇希腊文本传统；尚待直接核校）
  choice: 协调一致／和谐
  rationale: 保留贯穿本段的调弦、和声及群体合一意象，同时使用自然的现代汉语。
- source_word: μέλος θεοῦ（据英译所反映的中篇希腊文本；尚待直接核校）
  choice: 上帝所定的音调
  rationale: 在“曲调、音调、调子”等可能含义中选用与合唱及齐声歌唱最协调的表达；“所定”传达领受而非自创，但仍保留音乐隐喻。
- source_word: μέλη τοῦ υἱοῦ（据中篇希腊文本传统；尚待直接核校）
  choice: 他儿子的肢体
  rationale: 保留身体归属和彼此联结的隐喻，并在注释中提示其与本段音乐词汇可能形成的文字呼应。
- source_word: μετέχειν θεοῦ（据中篇希腊文本传统；尚待直接核校）
  choice: 有分于上帝
  rationale: 保留“分享、参与、同有”的强烈神学张力，不擅自解释为仅仅领受上帝的恩赐或与上帝相交。
theological_decisions:
- issue: 主教与长老团的关系
  choice: 译作“众长老团与主教协调一致”
  alternative: 译作“众长老团服从主教”
  rationale: 原段的核心比喻是琴弦与琴协调相合；正文不把这种和谐关系扩大解释为特定的后世教阶或管辖理论。
- issue: “耶稣基督被歌唱出来”的语态与含义
  choice: 保留被动式音乐表达
  alternative: 解释为“你们便一同颂赞耶稣基督”
  rationale: 被动表达具有诗性和一定歧义：既可指基督是歌唱的内容，也可指基督在群体的合一与爱中得到彰显；不在正文中单方面消解。
- issue: 父如何“认出”信徒
  choice: 译作“从你们的善行认出你们是他儿子的肢体”
  alternative: 译作“因你们的善行承认你们配作他儿子的肢体”
  rationale: 避免把善行明确处理成赚取身份或称义的功劳；原句只说明善行使其成员身份得到辨认。
- issue: “有分于上帝”
  choice: 保留直接而强烈的表述
  alternative: 弱化为“常常领受上帝的恩典”或“常与上帝相交”
  rationale: 原表达的参与性含义不应被预先归入某一特定神学体系。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文，以“和谐同行—琴弦—合唱队—音调—齐声歌唱”贯通原段的音乐意象。“里拉琴”保留古代乐器特色。正文依据所给公版英译见证并参照可识别的中篇希腊文本用语拟订；由于任务材料明确注明希腊原文直接核校尚未完成，所有希腊词项判断均应在出版前对中篇希腊校勘文本逐项复核。
