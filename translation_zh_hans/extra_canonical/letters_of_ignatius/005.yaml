review_pass:
  verdict: revise
  source_fidelity: 需修订。“常常”未充分表达 πάντοτε（“始终、总是”）；“所定的”给 χρῶμα θεοῦ（上帝的音调／调性）加入了原文未明说的限定。“汇成合唱队”也较弱地表达了 χορὸς γίνεσθε（成为一个合唱团）。其余核心关系、音乐意象、善行与成员身份的关联，以及“有分于上帝”的参与性表达，基本忠实。
  naturalness: 整体庄重、可朗读，但“琴弦与里拉琴相合”略显生硬，“被歌唱出来”也不如“被歌唱”凝练。改为“如琴弦与竖琴相协调”及“耶稣基督被歌唱”，更自然且保留原文的音乐性被动表达。
  terminology: “主教”“众长老团”“父”“他儿子的肢体”“有分于上帝”均可保留。“众长老团”避免了把 πρεσβυτέριον 直接等同于现代制度。“上帝的音调”可对应 χρῶμα θεοῦ，但不宜添加“所定”。
  issues:
  - severity: medium
    issue: “常常有分于上帝”弱化了 πάντοτε。
    rationale: “常常”通常表示频率上的“经常”，并非持续不间断；原文此处为“总是／始终”。
  - severity: low
    issue: “上帝所定的音调”添加了“所定”。
    rationale: χρῶμα θεοῦ可保留为“上帝的音调／调性”；“所定”虽可由“领受”联想，却不是原文明说。
  - severity: low
    issue: “汇成合唱队”及“被歌唱出来”不够贴切、凝练。
    rationale: 前者不如“成为一个合唱团”直接反映 γίνεσθε，后者的“出来”无对应原文且略口语化。
  revised_text: '所以，你们理当与主教的心意同心奔走；你们也确实这样做。你们那尊贵、堪配上帝的众长老团[a]与主教协调一致，如琴弦与竖琴相协调。因此，在你们的同心与和谐相爱之中，耶稣基督被歌唱。


    你们每一个人都要成为一个合唱团，好在同心中彼此和谐，领受上帝的音调，借着耶稣基督，同声向父歌唱；这样，他就会听见你们，并藉着你们所行的善，认出你们是他儿子的肢体[b]。因此，你们处在无可指摘的合一中是有益的，好使你们始终有分于上帝。'
  revised_footnotes:
  - marker: a
    text: “众长老团”指由众长老组成的群体；传统译法常作“长老会”或“长老团”。
    reason: 帮助普通读者理解这一集体职分名称，同时避免与现代宗派名称混淆。
  - marker: b
    text: “肢体”指身体的各部分，即属于他儿子的成员。这里的原文词语与前面的“音调”在希腊语中形成文字呼应。
    reason: 说明身体隐喻，并提示汉语正文难以重现的希腊语音乐词与“肢体”一词的文字游戏。
  revision_rationale: 修订保持主教、长老团及合一的关系为音乐性的协调比喻，不添加后世教阶理论；保留耶稣基督“被歌唱”的被动式歧义，也不把善行解释为赚取成员身份。主要校正持续时间、副加限定和若干中文搭配，同时使合唱、音调、同声歌唱的意象更连贯。
