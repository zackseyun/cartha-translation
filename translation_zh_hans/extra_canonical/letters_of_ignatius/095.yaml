review_pass:
  verdict: revise
  source_fidelity: 'Draft generally follows the supplied English witness and preserves the major ambiguities. However, several Chinese renderings obscure the Greek/English sense: κακοτεχνίας is better represented as harmful/evil practices than merely “tricks”; ἀρκεῖσθαι is contentment/satisfaction with one’s husband, but the current word order is stiff; γνωσθῇ πλεῖον τοῦ ἐπισκόπου should retain the comparative force (“becomes known more than the bishop”), rather than introducing “outside the bishop”; and ἐφθάρη means “is corrupted/ruined,” not specifically “is polluted.”'
  naturalness: The epistolary register is appropriate, but “在肉身和灵里以自己的丈夫为满足” and “在监督以外越发为人所知” are unnatural and hard to parse in modern Mandarin. The revision keeps a formal, readable exhortatory style while retaining the difficult comparative expression.
  terminology: “主”“教会”“贞洁”“情欲”“上帝” are suitable. “监督” is a defensible transparent rendering of ἐπίσκοπος and is retained consistently. “尊荣主的肉身” accurately reflects εἰς τιμὴν τῆς σαρκὸς τοῦ κυρίου; “为尊荣主的肉身” is smoother in Chinese.
  issues:
  - severity: medium
    issue: “邪恶的伎俩” narrows κακοτεχνίας.
    rationale: κακοτεχνίαι denotes evil or harmful practices/arts and may include more than deceptive tricks. “恶行恶术” preserves breadth without forcing a specifically magical meaning.
  - severity: medium
    issue: The rendering of γνωσθῇ πλεῖον τοῦ ἐπισκόπου loses the Greek comparative construction.
    rationale: The phrase literally contains “more than the bishop,” not “outside the bishop.” Its intended reference remains disputed/obscure, so the text should preserve the comparison and explain it in a note.
  - severity: medium
    issue: “败坏了”/“玷污” terminology requires closer alignment with ἐφθάρη.
    rationale: ἐφθάρη is passive perfect, “has been corrupted/ruined.” “败坏了” is acceptable, whereas “玷污” can suggest a narrower ritual or sexual pollution not required by the wording.
  - severity: low
    issue: The satisfaction phrase is syntactically awkward in Mandarin.
    rationale: Reordering it as “在肉身和灵里都以自己的丈夫为满足” is natural while retaining both qualifying spheres.
  revised_text: '要躲避恶行恶术；不如说，要谈论这些事。[a] 你要告诉我的姊妹们：她们应当爱主，在肉身和灵里都以自己的丈夫为满足。同样，你也要奉耶稣基督的名嘱咐我的弟兄们：他们应当爱自己的妻子，正如主爱教会一样。



    若有人能够为尊荣主的肉身而持守贞洁，就让他这样持守，不可夸耀。若他夸耀，他就败坏了；若他比监督更为人所知，他就败坏了。[b] 男男女女结婚时，应当在监督同意之下结合，使婚姻合乎主，而不是出于情欲。[c] 一切都要为尊荣上帝而行。'
  revised_footnotes:
  - marker: a
    text: “谈论这些事”直译为“就这些事进行谈话／论说”。它可能指谈论并劝戒前述恶行恶术，也可能含有与涉及这些事的人交谈之意；简短措辞的具体指向仍有余地。
    reason: 保留 μᾶλλον δὲ περὶ τούτων ποιεῖσθαι ὁμιλίας 的转折及指代余地，不将其限定为一种劝戒或牧养程序。
  - marker: b
    text: “比监督更为人所知”直译保留了“超过监督”的比较语。此句究竟指贞洁持守被公开到超过监督所知的范围，还是另有所指，难以确定；正文不把它解释为特定的教会纪律或争夺名望。
    reason: 修正原脚注和正文中“在监督以外”的非比较性表达，并保留 γνωσθῇ πλεῖον τοῦ ἐπισκόπου 的歧义。
  - marker: c
    text: “在监督同意之下”对应“经监督的意见／同意”（μετὰ γνώμης τοῦ ἐπισκόπου）。原句要求婚姻如此缔结，却没有说明具体仪式、主持人或后世教会法程序。
    reason: 准确说明 γνώμη 的同意／意见语义，并避免读入特定婚礼制度。
  revision_rationale: The revision is based first on the standard middle-recension Greek wording reflected by the supplied witness. It improves fidelity at the difficult terms κακοτεχνίαι, γνωσθῇ πλεῖον τοῦ ἐπισκόπου, and ἐφθάρη; improves modern Mandarin syntax; and retains the draft’s appropriate restraint at disputed or compressed expressions. No denominational conclusions are added.
