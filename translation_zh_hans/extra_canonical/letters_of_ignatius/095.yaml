review_pass:
  verdict: revise
  source_fidelity: 草稿整体忠实传达所供英译见证，并谨慎标示两处仍待希腊文直接校核的难句。但“邪恶的伎俩”把 evil arts/κακοτεχνίαι 偏窄地导向诡计；“在监督以外越发为人所知”中的“越发”既不自然，也使“beyond the bishop”的范围关系不够清楚。修订以较宽的“邪恶的行径”及“在监督以外为人所知”保留原句的不确定性。
  naturalness: 书信劝勉体基本庄重流畅。修订“在肉身和心灵上都以自己的丈夫为满足”使现代汉语更自然，并将“征得监督的同意而结合”调整为“在监督同意下彼此结合”，语句更简洁而不改变同意的要求。
  terminology: 保留“主”“教会”“贞洁”“监督”“情欲”“上帝”等用语；“监督”适合在不预设后世宗派职制的情况下对应 bishop/ἐπίσκοπος。“主的肉身”保留文本显著的肉身措辞。
  issues:
  - severity: medium
    issue: “邪恶的伎俩”过窄
    rationale: 所供见证的“evil arts”及通常相应的 κακοτεχνίαι 可涵盖邪恶技艺、行径或作法，不限于欺骗性的伎俩。改为“邪恶的行径”较为宽泛。
  - severity: medium
    issue: “在监督以外越发为人所知”不自然且范围不清
    rationale: “越发”没有清楚表达 known beyond the bishop 的“超过／在……之外”的关系。改为“在监督以外为人所知”，并保留脚注说明该句仍有语义争议。
  - severity: low
    issue: “肉身和灵里”略显生硬
    rationale: 改为“在肉身和心灵上都”更合现代标准汉语，同时保留 flesh and spirit 的双重维度。
