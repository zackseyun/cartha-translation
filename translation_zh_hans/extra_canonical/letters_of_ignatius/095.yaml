source:
  text: 'Flee evil arts, or rather hold thou discourse about these. Tell my sisters to love the Lord and to be content with their husbands in flesh and in spirit. In like manner also charge my brothers in the name of Jesus Christ to love their wives, as the Lord loved the Church.


    If any one is able to abide in chastity to the honor of the flesh of the Lord, let him so abide without boasting. If he boast, he is lost; and if it be known beyond the bishop, he is polluted. It becometh men and women too, when they marry, to unite themselves with the consent of the bishop, that the marriage may be after the Lord and not after concupiscence. Let all things be done to the honor of God.'
