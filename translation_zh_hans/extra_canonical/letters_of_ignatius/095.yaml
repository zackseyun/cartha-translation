base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/095.yaml
  text: 'Flee evil arts—or rather, hold discourse about these. Tell my sisters to love the Lord and to be content with their husbands in flesh and in spirit. In like manner also charge my brothers in the name of Jesus Christ to love their wives, as the Lord loved the Church.


    If anyone is able to abide in chastity to the honor of the flesh of the Lord, let him so abide without boasting. If he boasts, he is lost; and if it becomes known beyond the bishop, he is polluted. It becometh men and women too, when they marry, to unite themselves with the consent of the bishop, that the marriage may be after the Lord and not after concupiscence. Let all things be done to the honor of God.'
translation:
  language: zh_hans
  text: '要躲避邪恶的伎俩——不如说，要谈论这些事。[a] 你要告诉我的姊妹们：她们应当爱主，并在肉身和灵里以自己的丈夫为满足。同样，你也要奉耶稣基督的名嘱咐我的弟兄们：他们应当爱自己的妻子，正如主爱教会一样。


    若有人能为尊荣主的肉身而持守贞洁，就让他这样持守，不可夸耀。若他夸耀，就失丧了；若他在监督以外越发为人所知，他就败坏了。[b] 男人和女人结婚时，应当征得监督的同意而结合，使这婚姻合乎主，而不是出于情欲。[c] 一切都要为荣耀上帝而行。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要谈论这些事”所指可能是应当谈论并劝戒前述邪恶伎俩，也可能是与相关之人交谈。现有英译见证语意简略；希腊文尚待直接校核。
    reason: 保留首句转折及其指代关系的真实歧义。
  - marker: b
    text: “在监督以外越发为人所知”是一处难解表达。它可能指此人的贞洁誓愿不应在监督之外公开，也可能涉及他追求超过监督的名望。正文暂从所供见证作较字面的保留，待希腊文及异文核验。
    reason: 避免在源语言复核前把晦涩措辞解释成单一教会纪律或身份主张。
  - marker: c
    text: 这里要求婚姻在监督知情并同意之下缔结；原句本身没有说明具体礼仪程序。
    reason: 防止读者把“同意”误读为文本明确规定了后世某种婚礼制度。
lexical_decisions:
- source_word: evil arts（希腊文源词尚待直接核验）
  choice: 邪恶的伎俩
  rationale: 保留所供英译中“arts”所含的手段、诡计或恶行之意，避免把它过早限定为巫术或某一种特定罪行。
- source_word: chastity / ἁγνεία（据中篇希腊传统的通行文本形态，仍待本项目核验）
  choice: 贞洁
  rationale: 本段与不婚持守相连，“贞洁”比笼统的“纯洁”更能表达语境，同时不把它解释成对婚姻的贬抑。
- source_word: the flesh of the Lord / σὰρξ τοῦ κυρίου
  choice: 主的肉身
  rationale: 直译并保留早期基督教文本对主真实肉身的强调，不弱化为抽象的“身体”或“道成肉身”。
- source_word: bishop / ἐπίσκοπος
  choice: 监督
  rationale: 采用能反映词义且避免直接套入后世宗派制度称谓的译法。
- source_word: concupiscence / ἐπιθυμία
  choice: 情欲
  rationale: 表达受欲望支配的婚姻动机；不译作较窄的“淫欲”，以免增添原文未必具有的定罪范围。
- source_word: to the honor of God
  choice: 为荣耀上帝
  rationale: 按现代汉语习惯表达以尊荣上帝为目的，保持句末劝勉的庄重力度。
theological_decisions:
- issue: 持守贞洁与婚姻之间的关系
  choice: 分别正面呈现自愿持守贞洁和经监督同意的婚姻，不建立二者的属灵等级。
  alternative: 把贞洁解释为比婚姻更高的属灵身份。
  rationale: 文本赞许为尊荣主而持守贞洁，却立即禁止夸耀，并同样规范婚姻；译文不应增添等级化结论。
- issue: 监督对婚姻的参与
  choice: 译作“征得监督的同意而结合”。
  alternative: 译作必须由监督亲自主持婚礼，或仅须告知监督。
  rationale: 所供见证明确为“with the consent of the bishop”；既不扩大为特定礼仪制度，也不削弱为单纯通知。
- issue: “正如主爱教会”中的婚姻劝勉
  choice: 保留其类比，不补入具体的权柄、顺服或牺牲模式。
  alternative: 依某一婚姻神学体系展开解释。
  rationale: 原句只直接命令丈夫爱妻子，并以主爱教会作比；译文保留张力而不作宗派化扩写。
- issue: “known beyond the bishop”这一晦涩句
  choice: 正文采取较贴近见证字面的“在监督以外越发为人所知”，并用脚注说明歧义。
  alternative: 明确解释为“除监督外若还有人知道”，或“若自认为比监督更有名望”。
  rationale: 现有英译见证本身语义不明，且直接希腊文校核尚未完成，不宜在正文中无声选定单一解释。
translation_notes:
  register: 采用现代、庄重而可诵读的书信劝勉体。“姊妹们／弟兄们”保留共同体亲属称谓；“监督”作为 ἐπίσκοπος 的透明译名。因用户提供的主要起草依据仍是公版英译见证，且注明希腊文复核待办，本稿对关键晦涩处采用保守译法并以脚注公开不确定性。
