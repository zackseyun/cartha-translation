base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/038.yaml
  text: The Ephesians in Smyrna greet you; I am also writing to you from here. They are here with me for the glory of God, as you also are, and they have comforted me in every way, together with Polycarp, bishop of the Smyrnaeans. Yes, and all the other churches greet you in the honor of Jesus Christ. Farewell in godly harmony, and possess a steadfast spirit, which is Jesus Christ.
translation:
  language: zh_hans
  text: '在士每拿的以弗所人向你们问安；我也是从这里写信给你们。他们和我一同在这里，为要荣耀上帝，正如你们也是这样。他们和士每拿人的监督波利卡普一起，在各方面安慰了我。是的，其他各教会也都为尊荣耶稣基督向你们问安。


    愿你们在上帝的和睦中安好，并持有坚定不移的灵；这灵就是耶稣基督。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the Ephesians from/in Smyrna
  choice: 在士每拿的以弗所人
  rationale: 表达这些以弗所人当时身在士每拿，避免让读者误以为他们原籍士每拿。
- source_word: for the glory of God
  choice: 为要荣耀上帝
  rationale: 以自然现代汉语表达目的或结果关系，同时保留“荣耀上帝”的核心含义。
- source_word: bishop
  choice: 监督
  rationale: 采用较贴近早期基督教职分用语的译法，不把后世特定宗派制度预先带入文本。
- source_word: in the honor of Jesus Christ
  choice: 在耶稣基督的尊荣里
  rationale: 保留介词结构及“尊荣”的语义，不擅自改释为“奉……的名”或其他较明确的神学公式。
- source_word: godly concord
  choice: 属上帝的和谐
  rationale: 既保留与上帝的关联，又用现代读者容易理解的“和谐”表达彼此一致。
- source_word: possess a steadfast spirit
  choice: 持守坚定不移的灵
  rationale: “持守”比直译“拥有”更符合中文劝勉语气；“灵”保留原句可能兼具属灵状态与位格指向的张力。
theological_decisions:
- issue: “坚定不移的灵”与“耶稣基督”的关系
  choice: 这灵就是耶稣基督
  alternative: 持守坚定不移的心志，这心志源于耶稣基督
  rationale: 采用较形式对应的同一表述，不把原句可能令人意外的身份关系弱化为来源关系，从而保留其神学张力。
- issue: “监督”所指职分的制度含义
  choice: 监督
  alternative: 主教
  rationale: 使用语义较基础的职分称谓，避免直接套用后世教会体制；人名与所属群体仍足以说明其领导身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留书信问安和末尾祝愿的语气。鉴于所提供的直接依据是公共领域英文见证，且希腊文复核尚待进行，本稿对末句尤其采取审慎、较形式对应的译法，并以脚注保留解释空间。
