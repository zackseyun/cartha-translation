review_pass:
  verdict: revise
  source_fidelity: 需修订。根据希腊文，第一段的“亲爱的弟兄姊妹”将ἀγαπητοί（亲爱的）无根据地具体化；“主所经历的这些事”弱化了“主若只是貌似做了这些事”的反事实论证；“使我们可以与他一同受苦”也应为单数“使我与他一同受苦”。“有能力成就”缺少明确、自然的谓语承接，可改为“能够做到”，但不指定其所指，从而保留原文的语义张力。
  naturalness: 原译整体庄重流畅，但“我预先为你们警醒”“有能力成就”以及“只要这一切是奉……的名”不够自然或句法不完整。修订后以“我预先保护你们，提防……”和“只愿……好叫我……”表达，既自然也保留书信的警诫与格言式节奏。
  terminology: 保留“人形的野兽”“接待”“表面上”“完全的人”等核心措辞。“完全的人”可表达τέλειος ἄνθρωπος所强调的真实、完整人性，避免使用带有额外后世含义的术语。神名沿用“上帝”，与原稿一致。
  issues:
  - severity: medium
    issue: “亲爱的弟兄姊妹”增添了原文未明说的群体称谓。
    rationale: ἀγαπητοί意为“亲爱的（人）”；虽收信者是信徒群体，但原文在此并未使用“弟兄姊妹”。
  - severity: high
    issue: “使我们可以与他一同受苦”误作复数。
    rationale: 希腊文ἵνα συνπάσχω αὐτῷ为第一人称单数：“好叫我与他一同受苦”。
  - severity: medium
    issue: “我们的主所经历的这些事”未准确呈现“只是貌似做了这些事”。
    rationale: τὸ δοκεῖν ... ἔπραξεν的重点是主的行动若仅属表象；改为“若只是表面上做了这些事”更贴近原文的反幻影说论证。
  - severity: medium
    issue: “有能力成就”语义悬空。
    rationale: 原文只说基督“能够”，其补足语由前文语境引出；“能够做到”既符合汉语，又不武断界定所指。
  - severity: low
    issue: “只要这一切是奉耶稣基督的名”句法和语气不完整。
    rationale: μόνον ἐν ὀνόματι Ἰησοῦ Χριστοῦ在此为限定、祈愿性表达；“只愿这一切是在耶稣基督的名里”可保留其开放性。
  revised_text: '但亲爱的，我知道你们自己也是这样想，仍要就这些事警告你们。我预先保护你们，提防那些人形的野兽。这样的人，你们不但不该接待；如果可能，甚至不要同他们见面。只要为他们祷告，或许他们会悔改。这的确很难，但耶稣基督——我们真实的生命——能够做到。


    因为，如果我们的主只是表面上做了这些事，那么我也只是表面上被囚。既是这样，我为什么还把自己交给死亡、烈火、刀剑和野兽呢？靠近刀剑，就是靠近上帝；与野兽在一起，就是与上帝在一起。只愿这一切是在耶稣基督的名里，好叫我与他一同受苦。我忍受一切，因为那位完全的人亲自使我刚强。'
  revised_footnotes: []
  revision_rationale: 修订以中期本希腊文为优先依据，并与所给英语见证核对。删去无明示依据的“弟兄姊妹”，恢复主语行动的“只是表面上做了这些事”，并将“与他一同受苦”改回原文单数。对“耶稣基督能够”的未明说补足语保持开放，不把它限定为使异端者悔改或使信徒能够祷告。原稿没有脚注锚点或结构性验证错误，故无需新增脚注。
