  english_witness: 'But these things I warn you, dearly beloved, knowing that ye yourselves are so minded. Howbeit I watch over you betimes to protect you from wild beasts in human form--men whom not only should ye not receive, but, if it were possible, not so much as meet [them]; only pray ye for them, if haply they may repent. This indeed is difficult, but Jesus Christ, our true life, hath power over it.


    For if these things were done by our Lord in semblance, then am I also a prisoner in semblance. And why then have I delivered myself over to death, unto fire, unto sword, unto wild beasts? But near to the sword, near to God; in company with wild beasts, in company with God. Only let it be in the name of Jesus Christ, so that we may suffer together with Him. I endure all things, seeing that He Himself enableth me, who is perfect Man.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/080.yaml
  text: 'But I warn you about these things, dearly loved, knowing that you yourselves think this way. Nevertheless, I am watching over you in advance to protect you from wild beasts in human form—people whom you should not only refuse to receive but, if possible, not even meet [them]. Only pray for them, in case they might repent. This is indeed difficult, but Jesus Christ, our true life, has power over it.


    For if our Lord did these things only in appearance, then I too am a prisoner only in appearance. And why, then, have I handed myself over to death, to fire, to the sword, to wild beasts? But close to the sword, close to God; in the company of wild beasts, in the company of God. Only let it be in the name of Jesus Christ, so that we may suffer together with him. I endure everything, since he himself enables me, who is the perfect human being.'
translation:
  language: zh_hans
  text: '但亲爱的，我知道你们自己也是这样想，仍要就这些事警告你们。我预先保护你们，提防那些人形的野兽。这样的人，你们不但不该接待；如果可能，甚至不要同他们见面。只要为他们祷告，或许他们会悔改。这的确很难，但耶稣基督——我们真实的生命——能够做到。


    因为，如果我们的主只是表面上做了这些事，那么我也只是表面上被囚。既是这样，我为什么还把自己交给死亡、烈火、刀剑和野兽呢？靠近刀剑，就是靠近上帝；与野兽在一起，就是与上帝在一起。只愿这一切是在耶稣基督的名里，好叫我与他一同受苦。我忍受一切，因为那位完全的人亲自使我刚强。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wild beasts in human form
  choice: 披着人形的野兽
  rationale: 保留强烈比喻及“人形”与“野兽”的反差，同时符合现代汉语表达。
- source_word: receive
  choice: 接待
  rationale: 保留早期基督徒群体接纳来访者、教师或同工的语境，不缩窄为单纯赞同其教导。
- source_word: in semblance
  choice: 只是假象
  rationale: 清楚表达所反驳的“仅在表象上发生”之意，并保留其基督论争议的尖锐性。
- source_word: near to / in company with
  choice: 靠近／相伴
  rationale: 保留原文格言式的平行结构和递进节奏。
- source_word: perfect Man
  choice: 完全的人
  rationale: 保留对基督真实且完全之人性的明确宣告，不改写为可能淡化人性含义的“完人”。
theological_decisions:
- issue: “有能力成就”所指的对象
  choice: 保持宽泛，不明确限定为使对方悔改或使信徒为其祷告
  alternative: 译作“有能力使他们悔改”或“能使我们做到”
  rationale: 英语见证中的代词所指并不完全明确；正文不应替原文消除这种张力。
- issue: 主所经历之事的真实性
  choice: 译为“只是假象”
  alternative: “只是看起来如此”
  rationale: 保留对幻影说式主张的直接反驳，同时不加入后世教义术语。
- issue: 受苦者的人称
  choice: “使我们可以与他一同受苦”
  alternative: “使我可以与他一同受苦”
  rationale: 依所供见证保留复数“我们”，使作者个人殉道与群体参与基督受苦之间的张力不被消除。
- issue: “完全的人”的基督论表达
  choice: 保留“完全的人”
  alternative: “完美的人”或“完全之人”
  rationale: “完全”较能承载神学语境中的完整、成熟与无缺，同时仍是自然现代汉语。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留第二段格言式平行句的力度。鉴于直接希腊文审校尚未完成，本稿以所供公版英语见证和P​​OB审校层为暂定依据，避免提出超出见证材料的词源断言。
