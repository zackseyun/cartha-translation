source:
  text: 'But these things I warn you, dearly beloved, knowing that ye yourselves are so minded. Howbeit I watch over you betimes to protect you from wild beasts in human form--men whom not only should ye not receive, but, if it were possible, not so much as meet [them]; only pray ye for them, if haply they may repent. This indeed is difficult, but Jesus Christ, our true life, hath power over it.


    For if these things were done by our Lord in semblance, then am I also a prisoner in semblance. And why then have I delivered myself over to death, unto fire, unto sword, unto wild beasts? But near to the sword, near to God; in company with wild beasts, in company with God. Only let it be in the name of Jesus Christ, so that we may suffer together with Him. I endure all things, seeing that He Himself enableth me, who is perfect Man.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
