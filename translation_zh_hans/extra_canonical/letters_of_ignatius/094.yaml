review_pass:
  verdict: revise
  source_fidelity: 需修订以贴近希腊文。尤其是“你自己也不要做任何未经上帝同意的事”将ἄνευ θεοῦ（“离开／不依靠上帝”）误具体化为“未经上帝同意”；“服侍得更加忠心”增添了原文未明说的“忠心”；“私欲”把ἐπιθυμία的较宽泛“欲望／贪求”预先贬义化。此外，ἀπὸ τοῦ κοινοῦ应保留为“共同体的公共款项／公共基金”，不宜正文直接断定为“教会公费”。
  naturalness: 原稿整体庄重通顺，但“不要让任何事未经你同意就去做”不合现代汉语常用搭配；“要按名字寻找每一个人”也略显生硬。改作“凡事都不可未经你的同意而办理”及“要按名寻访众人”，更自然且保留原文的逐一关怀之意。
  terminology: “寡妇”“主”“上帝”“聚会”“奴隶／为奴的人”等核心称谓可保留。为忠实表达δούλους καὶ δούλας，采用“男女奴隶”；这不是认可该制度，而是准确呈现古代身份。将“更美的自由”改为“更好的自由”，以对应κρείσσονος的比较义，避免“美”所带的额外审美色彩。
