  - severity: medium
    issue: “教会公费”过度限定ἀπὸ τοῦ κοινοῦ
    rationale: 该短语指“从共同体的公共基金／共同资源”。在书信共同体语境中可能由教会承担，但正文不应将其定为正式的“教会公费”。
