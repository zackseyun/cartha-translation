base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/094.yaml
  text: 'Do not neglect widows. After the Lord, be their protector. Let nothing be done without your consent, and do nothing without God’s consent, as indeed you do not. Be steadfast.


    Let meetings be held more frequently. Seek out everyone by name.


    Do not despise enslaved people, whether men or women. Yet let them not in turn be puffed up, but let them serve even more faithfully for the glory of God, so that they may obtain a better freedom from God. Let them not seek to be freed at public expense, lest they be found to be servants of lust.'
translation:
  language: zh_hans
  text: '不可忽略寡妇。你要在主之后作她们的照管者。凡事都不可未经你的同意而办理；你自己也不可离开上帝而做任何事，正如你并非如此行。要坚定不移。


    要更频繁地举行聚会。要按名寻访众人。


    不可傲慢地对待男女奴隶；他们自己也不可自高自大，反而要更多地服侍，使上帝得荣耀，好从上帝那里获得更好的自由。他们不可贪求由共同体的公共款项得以释放，免得被发现是欲望的奴隶。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “由共同体的公共款项得以释放”直译ἀπὸ τοῦ κοινοῦ ἀπελευθεροῦσθαι，指由共同体的公共资源或基金支付释放所需费用；在此语境中可能涉及教会共同体，但原文没有明定具体机构。“欲望”译自ἐπιθυμία，也可译为“贪求”或“情欲”；不宜预先限定为某一种欲望。
    reason: 保留“共同资源”与ἐπιθυμία的语义开放性，并避免把公共款项直接等同于正式教会经费。
lexical_decisions:
- source_word: widows
  choice: 寡妇
  rationale: 保留早期教会语境中的明确群体称谓，不泛化为所有弱势者。
- source_word: After the Lord
  choice: 在主之后
  rationale: 保留原见证文本中次序或从属关系的紧缩表达，不擅自解释为“代表主”或“仅次于主”。
- source_word: protector
  choice: 保护者
  rationale: 自然表达照管与维护的责任，同时避免加入制度化职衔。
- source_word: consent
  choice: 同意
  rationale: 兼顾许可、认可之义；上下两句采用同一译词，以保留修辞对应。
- source_word: Be steadfast
  choice: 要坚定不移
  rationale: 以现代庄重汉语表达持续稳固、不动摇的劝勉。
- source_word: meetings
  choice: 聚会
  rationale: 不明确限定为礼拜、圣餐或行政会议，以保留原文所指范围的开放性。
- source_word: Seek out all men by name
  choice: 要按名字寻找每一个人
  rationale: “每一个人”按通用人称理解；“寻找”保留主动寻访、查问的力度。
- source_word: slaves, whether men or women
  choice: 为奴的人，无论男女
  rationale: 既如实呈现古代奴隶身份，又以人的称谓为中心；“男女”对应男女奴隶。
- source_word: serve
  choice: 服侍
  rationale: 保留其实际服役含义及宗教语境可能产生的双重意味，不改写为一般的“工作”。
- source_word: better freedom
  choice: 更美的自由
  rationale: 保留比较级及属灵张力，不直接等同于法律释放或末世救恩。
- source_word: public cost
  choice: 教会公费
  rationale: 依段落教会共同体语境使中文可理解；以脚注说明其具体所指仍不完全确定。
- source_word: slaves of lust
  choice: 私欲的奴隶
  rationale: 保留奴役的反讽对照；“私欲”比单指性欲更能保存词义范围。
theological_decisions:
- issue: 教会领袖的同意与上帝的同意之间的关系
  choice: 按原见证文本并列翻译，不把领袖的同意等同于上帝的同意
  alternative: 解释为领袖拥有代表上帝的绝对许可权
  rationale: 文本既要求群体不绕过收信者，也要求收信者不绕过上帝；应保留两者之间的对应与制约。
- issue: “更美的自由”的性质
  choice: 保留未明确说明的属灵或终末性意味
  alternative: 明确译成天堂中的自由、从罪中得释放，或现实中的获释
  rationale: 现有材料不足以唯一确定所指，直译可保存神学张力。
- issue: 奴隶寻求公共出资赎身
  choice: 如实保留劝阻，不将其扩展为认可奴隶制度的普遍教义
  alternative: 弱化为一般不得滥用教会慈善，或强化为禁止一切获释诉求
  rationale: 劝告针对具体共同体实践；译文不应加入原段没有陈述的制度性结论。
- issue: “私欲”的范围
  choice: 采用范围较广的“私欲”
  alternative: 译作“情欲”并限定为性欲
  rationale: 在缺少直接希腊文复核的情况下，不宜把欲望的语义范围过度收窄。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉体。收信对象为单数，但现代汉语“你”本身不标数；避免使用古雅的“汝”。段落分隔依见证文本保留。由于直接希腊文审校尚未完成，本稿以公共领域英文见证为主要起草依据，并对可能受底本影响的关键处保持克制。
