    rationale: πλέον δουλευέτωσαν意为“要更多地服役／服侍”；“忠心地”虽见于所给英文桥接稿，却非希腊文中明确的对应词。
  - severity: medium
    issue: “私欲”缩窄并预设ἐπιθυμία的价值判断
    rationale: ἐπιθυμία可指欲望、贪求或情欲；本句语境显然为负面奴役的反讽，但译作“欲望的奴隶”较能保留词义范围。
  - severity: low
