    text: “如同”表达比较关系：佐提翁顺服监督，如同顺服上帝的恩典；顺服长老团，如同顺服耶稣基督的律法。该措辞本身并未把监督等同于恩典，或把长老团等同于律法。
    reason: 说明两处比较结构，避免将职分与“恩典”或“律法”作超出原句的本体性等同。
  revision_rationale: 修订保留原文未完成的句法和双重“如同”比较，改善被动语气、愿望式表达及中文行文，并以“长老团”明确集体名词。脚注缩为与锚点直接相关的说明，既保存可能引起神学误读的句法界限，也不引入宗派性解释。
