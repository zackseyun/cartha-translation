base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/025.yaml
  text: Since, then, I was permitted to see you in the person of Damas, your godly bishop, and your worthy presbyters Bassus and Apollonius, and my fellow servant, the deacon Zotion—whom I would gladly rejoice in, because he is subject to the bishop as to the grace of God, and to the presbytery as to the law of Jesus Christ—
translation:
  language: zh_hans
  text: 既然我蒙允得以在你们至为敬虔的监督达马斯、可敬的长老巴苏斯和阿波罗尼乌斯，以及我的同仆、执事佐提翁身上见到你们——愿我能因他得享喜乐；因为他顺服监督，如同顺服上帝的恩典，也顺服长老团，如同顺服耶稣基督的律法[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如同”表达比较关系：佐提翁顺服监督，如同顺服上帝的恩典；顺服长老团，如同顺服耶稣基督的律法。该措辞本身并未把监督等同于恩典，或把长老团等同于律法。
    reason: 说明两处比较结构，避免将职分与“恩典”或“律法”作超出原句的本体性等同。
lexical_decisions:
- source_word: bishop / ἐπίσκοπος
  choice: 监督
  rationale: 采用能体现照管、督导职能的现代汉语称谓，避免将后世制度形态无条件带入早期教会语境。
- source_word: presbyters / πρεσβύτεροι; presbytery / πρεσβυτέριον
  choice: 长老；众长老
  rationale: 前者指个别长老，后者指作为整体的长老群体；译为“众长老”比抽象的“长老会”较少引入后世宗派制度含义。
- source_word: deacon / διάκονος
  choice: 执事
  rationale: 这是现代中文教会中通行且简明的职分名称。
- source_word: fellow-servant / σύνδουλος
  choice: 与我同作仆人的
  rationale: 保留共同服事同一位主的关系，不弱化为普通同事。
- source_word: I would fain have joy / οὗ ὀναίμην
  choice: 我很愿意因他而欢喜
  rationale: 表达作者希望从佐提翁身上得到喜乐或因他欣慰的语气，同时避免过度确定其惯用表达的具体含义。
- source_word: in the person of / διά
  choice: 借着……见到你们
  rationale: 表达作者在这些代表人物身上与整个群体相遇，而不把他们简单等同于全体。
- source_word: godly / ἀξιόθεος
  choice: 敬虔的
  rationale: 依所提供的公共领域英文见证采取自然中文表达；该词也可能含“配得上帝”之意，尚待直接核对希腊文来源。
theological_decisions:
- issue: 监督与上帝恩典、众长老与基督律法之间的比较关系
  choice: 保留“如同……；也……如同……”的明喻结构
  alternative: 译成“监督就是上帝的恩典，众长老就是耶稣基督的律法”
  rationale: 原见证表达的是顺服方式或关系上的类比，并不必然宣告职分与恩典、律法在本体上完全等同；保留比较可避免强化原文未明说的教会论主张。
- issue: presbytery 的制度含义
  choice: 众长老
  alternative: 长老会
  rationale: “众长老”保留群体性，却不预设后世某种固定宗派治理制度。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。人名按常见音译处理；职分名称保持一致。破折号保留本节未完待续的句法。当前材料注明尚待直接核对希腊文，因此本稿以所提供的公共领域英文见证为主要起草依据，并对可能受源词影响之处保持谨慎。
