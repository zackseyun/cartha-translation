base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/008.yaml
  text: 'For some are accustomed, with malicious deceit, to peddle the Name while doing other things unworthy of God. You should avoid these people as wild beasts, for they are mad dogs that bite in secret. Be on your guard against them, for they are difficult to heal.


    There is only one physician, of flesh and of spirit, generated and ungenerated, God in man, true Life in death, Son of Mary and Son of God, first able to suffer and then unable to suffer: Jesus Christ our Lord.'
translation:
  language: zh_hans
  text: '因为有些人惯于心怀恶意、以诡诈到处兜售那名[a]，所做的另一些事却与神不相称。你们应当躲避这些人，如同躲避野兽；因为他们是狂犬，暗中咬人。你们应当提防他们，因为他们的病难以医治。


    只有一位医生：既属肉体，也属灵；既是受生的，也是非受生的[b]；是在人里面的神，是死亡中的真实生命；既出于马利亚，也出于神；先是可受苦的，随后是不受苦的[c]——他就是我们的主耶稣基督。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那名”原文只说“名”，在此显然具有信仰上的特殊所指；也可理解为主的名或基督之名。
    reason: 原文没有明说该名的完整形式，正文应保留其含蓄指称。
  - marker: b
    text: “受生的／非受生的”也可译作“有生的／无生的”或“被生的／未被生的”。原文两个词的准确含义及其神学用法存在争议。
    reason: 提示关键希腊对举的词义范围，避免中文措辞被误当作唯一解释。
  - marker: c
    text: “可受苦的／不受苦的”也可译作“能受苦的／不能受苦的”。原文强调两种相反属性及其先后次序。
    reason: 保留早期基督论语言中的真实张力，而不在正文中作教义化释义。
lexical_decisions:
- source_word: τὸ ὄνομα
  choice: 那名
  rationale: 保留原文以定冠词指称“名”的简洁表达及其基督信仰语境，不擅自补成“耶稣的名”或“基督徒之名”。
- source_word: περιφέρειν
  choice: 到处兜售
  rationale: 表达“带着四处走、到处推销”的贬义语感，与上下文中的恶意和诡诈相称。
- source_word: λαθροδῆκται
  choice: 暗中咬人
  rationale: 直观传达复合词所含“隐秘”和“咬噬”两层意思，并保持狂犬的比喻。
- source_word: δυσθεραπεύτους
  choice: 病难以医治
  rationale: 延续下段“医生”的医疗意象；此词也可泛指难以纠正，正文不将比喻抽象化。
- source_word: σαρκικός τε καὶ πνευματικός
  choice: 既属肉体，也属灵
  rationale: 保留肉体与灵的并列张力，不把它解释为某一后期教义公式。
- source_word: ἐν ἀνθρώπῳ θεός
  choice: 在人里面的神
  rationale: 贴近介词结构，避免径直改写为“成为人的神”，从而保留措辞本身的开放性。
- source_word: ἐν θανάτῳ ζωὴ ἀληθινή
  choice: 死亡中的真实生命
  rationale: 保持“死亡—生命”的鲜明悖论和原文名词式表达。
theological_decisions:
- issue: γεννητός καὶ ἀγέννητος 的基督论对举
  choice: 既是受生的，也是非受生的
  alternative: 既是有生的，也是无生的；既是被生的，也是未被生的
  rationale: 采用相对中性的对应表达，保留两个希腊形容词的形式对称及其神学张力，不将其预先解释为单指降生、受造或永恒生出。
- issue: καὶ ἐκ Μαρίας καὶ ἐκ θεοῦ 的双重来源措辞
  choice: 既出于马利亚，也出于神
  alternative: 是马利亚之子，也是神之子
  rationale: 按中期希腊文本常见措辞保留“出于……出于……”的结构，不沿用英文见证中较解释性的“Son of”表述。
- issue: πρῶτον παθητὸς καὶ τότε ἀπαθής 的时间次序与属性对举
  choice: 先是可受苦的，随后是不受苦的
  alternative: 先能受苦，后来不能受苦；先受苦，后来不再受苦
  rationale: 保留 παθητός／ἀπαθής 所表达的能力或属性对举，也保留 πρῶτον／τότε 的先后关系；不把原文直接解释为受难和复活两个事件。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；首段保留野兽、狂犬、暗咬和医治等连续意象，次段保留原文密集而对称的基督论短语。鉴于所供主要底本为公版英文见证且标明希腊文复核待定，本稿按中期校订本传统中通常见到的希腊措辞作审慎翻译，出版前仍应逐字核对指定希腊校本及异文。
