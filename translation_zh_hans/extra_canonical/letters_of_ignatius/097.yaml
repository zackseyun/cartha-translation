base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/097.yaml
  text: 'Seeing that the church in Antioch of Syria has peace, as it has been reported to me, through your prayers, I myself also have been the more comforted, since God has banished my care—if indeed through suffering I may attain to God, so that through your intercession I may be found to be a disciple.


    It is fitting for you, most blessed Polycarp, to call together a godly council and choose someone among you who is very dear to you and also zealous, who will be fit to bear the name of God’s courier. Appoint him, I say, so that he may go to Syria and glorify your zealous love to the glory of God.


    A Christian has no authority over himself but gives his time to God. This is God’s work, and yours also, when you shall complete it; for I trust in the divine grace that you are ready for an act of well doing worthy of God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
translation:
  language: zh_hans
  text: '据我所知，因着你们的祷告，叙利亚安提阿的教会已经平安；我自己也越发得了安慰，因为上帝已除去我的忧虑——但愿我能借着受苦归向上帝，并因你们的代求，显明自己是个门徒。[a]


    最蒙福的坡旅甲，你应当召集一个合乎上帝心意的会议，从你们中间选出一位深受爱戴又热心的人，配得称为“上帝的信使”。我说，你要委派他前往叙利亚，好使你们热切的爱得到彰显，归荣耀给上帝。[b]


    基督徒无权支配自己，而要把自己的时间交给上帝。你们若完成这事，这便是上帝的工作，也是你们的工作；因为我信靠上帝的恩典，深信你们已准备好行一件配得上帝的善事。我知道你们真诚而火热，因此写了这封短信劝勉你们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可理解为：“但愿我能借着受苦到达上帝那里，使我因你们的代求而被认定为门徒。”现有底本注明尚待直接核对希腊文。
    reason: 标示“attain unto God”与“be found a disciple”在中文中的可选译法，并诚实说明来源限制。
  - marker: b
    text: “上帝的信使”指受委派前往叙利亚传达教会关爱与消息的人，并非后世特定的教会职衔。
    reason: 防止普通读者把比喻性称号误解为固定教阶。
lexical_decisions:
- source_word: hath peace
  choice: 已经平安
  rationale: 保留教会处境恢复安宁的表述，不具体限定为停止迫害或内部和解。
- source_word: through suffering attain unto God
  choice: 借着受苦归向上帝
  rationale: “归向”自然表达朝向并最终到达上帝的意义，同时保留殉道语境可能包含的神学张力。
- source_word: God's courier
  choice: “上帝的信使”
  rationale: 兼顾受差遣者传递消息的职分和原文比喻色彩；加引号表明这是称号。
- source_word: giveth his time to God
  choice: 把自己的时间交给上帝
  rationale: 按见证文本直译其核心意象，不擅自改成较宽泛的“把自己献给上帝”。
- source_word: act of well doing
  choice: 善事
  rationale: 采用现代汉语中清楚自然的概括，所指即差派使者前往叙利亚之举。
- source_word: fervor of your sincerity
  choice: 真诚而火热
  rationale: 以并列形容结构保存真挚与热忱两层含义，避免生硬的名词堆叠。
theological_decisions:
- issue: “借着受苦归向上帝”是否明确指殉道死亡
  choice: 保留“受苦”及“归向上帝”的开放表达
  alternative: 借着殉道到上帝那里去
  rationale: 现有材料仅提供待希腊文复核的英文见证；不把可能的殉道含义提升为正文中唯一明确的解释。
- issue: “显明自己是个门徒”的身份判定
  choice: 显明自己是个门徒
  alternative: 被认定为门徒
  rationale: 保留“被发现为门徒”的末世性或群体性判断空间，同时用自然汉语表达，不指定判断者。
- issue: 教会会议的性质
  choice: 合乎上帝心意的会议
  alternative: 教会会议／宗教会议
  rationale: 避免把早期教会的临时共同商议制度化为后世特定教阶会议。
- issue: “无权支配自己”的伦理范围
  choice: 无权支配自己
  alternative: 不属于自己
  rationale: 紧贴见证文本关于自主权的措辞，并由下句“把自己的时间交给上帝”限定其实际含义，避免引入额外教义表述。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。保留第二人称单复数差别：对坡旅甲用“你”，对整个群体用“你们”。避免古奥措辞及后世制度化术语。由于所给古语言来源尚待审查，本稿以公开领域英文见证为依据，并在关键歧义处从谨处理。
