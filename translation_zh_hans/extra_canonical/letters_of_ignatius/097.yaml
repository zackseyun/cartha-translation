review_pass:
  verdict: revise
  source_fidelity: 首段“据我所知”没有表达“如所报告给我”的传闻来源，且“归向上帝”弱化并改变了“attain unto God”的到达／归赴意象；宜改为“我得知”及“到上帝那里去”。“因为上帝已除去我的忧虑”可更准确地体现 God has banished my care。第二段末句原译“使……爱得到彰显，归荣耀给上帝”句法上不清楚，也未充分表达“glorify … unto the glory of God”。其余主要内容与所给英文见证相符。由于未提供希腊文本，以下按英文见证作保守修订。
  naturalness: 修订后保持现代庄重书信体，清楚区分对坡旅甲的单数“你”和对教会群体的复数“你们”。“议会”在此指共同商议、决议的集会，不预设后世教会制度。
  terminology: 保留“坡旅甲”“上帝”“基督徒”等用语。“上帝的信使”以引号保留称号性质；“把自己的时间献给上帝”忠实保留英文见证的时间意象，不扩译为完全舍己。
  issues:
  - severity: medium
    issue: “据我所知”替代“as it has been reported to me”
    rationale: 前者容易表示译者自身知识或判断，遗漏消息是被报告给作者这一层意思。
  - severity: medium
    issue: “借着受苦归向上帝”处理 attain unto God 不够准确
    rationale: “归向”通常表示转向或归信，未明确保留“attain unto”的抵达／归赴目标；应采用不额外界定死亡方式的“到上帝那里去”。
  - severity: medium
    issue: 第二段末句的荣耀关系表达不清
    rationale: “好使……爱得到彰显，归荣耀给上帝”无法清楚对应 glorify your zealous love unto the glory of God；改为在上帝的荣耀中彰显该爱，更通顺且不添加制度或教义解释。
  - severity: low
    issue: 脚注 a 将译文选择及底本审查状态置入正文注释
    rationale: 该注释所述替代译法可由正文的保守直译解决；“待核对希腊文”属于制作审计信息，不宜作为读者脚注。
  revised_text: '我得知，因着你们的祷告，叙利亚安提阿的教会已经得享平安；我自己也更加得了安慰，因为上帝已驱除了我的忧虑——但愿我能借着受苦到上帝那里去，以致借着你们的代求，我被发现是一个门徒。


    最蒙福的坡旅甲，你应当召集一个合乎上帝心意的议会，从你们中间选出一位你们所深爱、又热心的人；他应当配得称为“上帝的信使”。我说，你要委派他前往叙利亚，在上帝的荣耀中彰显你们热切的爱。[a]


    基督徒不支配自己，却把自己的时间献给上帝。你们完成这事时，这既是上帝的工作，也是你们的工作；因为我信靠上帝的恩典，相信你们已经预备好行一件配得上帝的善事。我知道你们真诚的热忱，所以用一封简短的信劝勉了你们。'
  revised_footnotes:
  - marker: a
    text: “上帝的信使”是对受委派者的称号；本段语境表明他受差前往叙利亚，代表教会的热切关爱。
    reason: 说明称号及其直接上下文功能，避免将其误作后世固定教会职衔。
  revision_rationale: 修订消除了“据我所知”与“归向上帝”对英文见证的偏移，改善荣耀关系的中文句法，并以“议会”“你们所深爱”等表达更准确、自然地呈现共同选派的场景。删除原脚注 a，因为修订后的正文已经直接保留关键意象，而来源审查状态应保留在翻译审计记录中。
