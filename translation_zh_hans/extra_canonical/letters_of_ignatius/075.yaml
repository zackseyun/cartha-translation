base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/075.yaml
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
translation:
  language: zh_hans
  text: '至于来自基利家的执事腓罗，他是个有好名声的人，如今也在上帝的话语上服侍我；还有瑞乌斯·亚迦托普，他是蒙拣选的人，从叙利亚一路跟随我，已经辞别了今世的生活[a]。他们也为你们作见证。我因你们的缘故亲自感谢上帝，因为你们接待了他们；我深信主也会接纳你们。至于那些羞辱他们的人，愿他们借着耶稣基督的恩典得蒙救赎。


    特罗亚众弟兄的爱向你们问安。我也是从这里写信给你们，由布鲁斯执笔；他是以弗所人和士每拿人派来陪伴我的，以此表示对我的尊重。主耶稣基督必尊重他们；他们在肉身、魂与灵上，都借着信、爱与和睦，把盼望寄托在他身上[b]。


    愿你们在我们共同的盼望——基督耶稣里平安。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经辞别了今世的生活”或可表示弃绝世俗生活；这句话的确切所指及与前文的句法关系，仍有待依据希腊文抄本传统复核。
    reason: 当前仅提供公共领域英文见证，且资料注明源语审校尚未完成。
  - marker: b
    text: “在肉身、魂与灵上”在原句中的修饰关系可能存在歧义；本译文将它理解为他们以全人把盼望寄托在基督身上。
    reason: 如无希腊文直接核查，不应隐藏英文见证所反映的复杂句法。
lexical_decisions:
- source_word: διάκονος (as reflected by “deacon”)
  choice: 执事
  rationale: 保留早期教会职分称谓，同时符合现代中文基督教通行用语。
- source_word: λόγος θεοῦ (as reflected by “word of God”)
  choice: 上帝的话语
  rationale: 既可指上帝的信息或宣讲内容，也不将其过度限定为书面经文。
- source_word: ἐκλεκτός (as reflected by “elect one”)
  choice: 蒙拣选的人
  rationale: 保留被动、神学意味较浓的表达，不擅自说明拣选的具体性质。
- source_word: χάρις
  choice: 恩典
  rationale: 采用现代中文神学语境中清楚而庄重的对应词。
- source_word: ἀγάπη (as reflected by “love”)
  choice: 爱
  rationale: 这里指特罗亚弟兄群体向收信人的关爱，不机械译作抽象的“爱情”。
- source_word: ὁμόνοια (as reflected by “concord”)
  choice: 和睦
  rationale: 自然表达共同体内部同心协调的关系，同时避免过度抽象的“协调一致”。
- source_word: ἐλπίς (as reflected by “hope”)
  choice: 盼望
  rationale: 保留基督信仰中的末世与信靠意味，较“希望”更庄重。
theological_decisions:
- issue: “having bidden farewell to this present life”的主语与含义
  choice: 按现有英文见证，将其与瑞乌斯·亚迦托普相连，译为“已经辞别了今世的生活”
  alternative: 可理解为他弃绝世俗生活，或与更宽泛的跟随行为相连
  rationale: 现有材料明确显示该分词短语紧随亚迦托普，但缺少希腊文直接核查，故保留较直译且略显开放的表达，并加脚注说明。
- issue: “bear witness to you”的方向
  choice: 译为“为你们作见证”
  alternative: “向你们作见证”
  rationale: 英文介词结构可能表示替收信人作证，也可能表示向他们见证；上下文称赞他们的接待，前者较顺，但不宜视为完全确定。
- issue: “the Lord shall honor them, even Jesus Christ”的句法关系
  choice: 将“主”明确为“主耶稣基督”
  alternative: “主必尊重他们，就是耶稣基督”
  rationale: 英文见证中的同位语自然指明主即耶稣基督；合并表达可避免现代中文误读，同时不改变基督论内容。
- issue: “in flesh and soul and spirit”的修饰关系
  choice: 理解为他们全人的盼望都寄托在基督身上
  alternative: 理解为主在肉身、魂和灵各方面尊重他们，或与信、爱、和睦形成并列结构
  rationale: 现有英文标点支持将该短语与“盼望寄托”相连，但源语审校尚待进行，因此用脚注保留句法不确定性。
- issue: “be redeemed”对羞辱者的祈愿
  choice: “愿他们……得蒙救赎”
  alternative: “愿他们……得释放”或“得赎回”
  rationale: 保留作者对敌对者的恩典性祈愿及救赎语言，不把它弱化为一般性的改善或宽恕。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。人名和地名使用简体中文常见音译；“执事、恩典、救赎、盼望”等保留早期基督教文本的神学语域。由于所给 drafting basis 明示希腊文源语审校尚待完成，本稿以公开英文见证为临时依据，对关键句法歧义以脚注透明标示，未声称完成直接源语定稿。
