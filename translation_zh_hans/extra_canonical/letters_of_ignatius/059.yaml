    issue: “弟兄们，请宽容我”
    rationale: 英语见证的“Bear with me”在此是请求听者容忍、容让自己的强烈愿望；“请容忍我”更直接，且不把意思转为宽大饶恕。
  - severity: low
    issue: “因为他知道那使我受困迫的事”
    rationale: “那”在现代汉语中略显滞重，删去后仍完整对应“the things which straiten me”，并使句子更自然。
