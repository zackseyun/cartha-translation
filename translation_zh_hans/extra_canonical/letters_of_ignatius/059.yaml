base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/059.yaml
  text: 'The farthest reaches of the universe will profit me nothing, nor will the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest reaches of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].


    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Do not give to the world one who desires to be God’s, nor entice him with material things. Allow me to receive the pure light. When I have arrived there, then I will be a man.


    Permit me to be an imitator of the passion of my God. If anyone has Him within himself, let him understand what I desire and have fellow-feeling with me, for he knows the things that constrain me.'
translation:
  language: zh_hans
  text: '宇宙的尽头对我毫无益处，世上的万国也同样无益。对我来说，为耶稣基督而死，胜过统治大地的尽头。我寻求的是那位替我们死的；我渴望的是那位复活的[a]。


    新生的阵痛临到我了。弟兄们，请宽容我。不要拦阻我得生命；不要想要我的死亡。不要把一个渴望归属上帝的人交给世界，也不要用物质的东西诱惑他。容我领受纯净的光。等我到了那里，我才真正成为人。


    请准许我效法我的上帝所受的苦难[b]。若有人心里有他，就让他明白我所渴望的，也与我感同身受，因为他知道那使我受困迫的事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译文依据补充文字作：“那位为我们复活的。”所据英语见证将“为我们”置于方括号内；希腊文原始资料尚待直接复核。
    reason: 保存见证所标示的文本或译文不确定性。
  - marker: b
    text: “我的上帝所受的苦难”也可较凝练地译作“我的上帝的受难”，这里指耶稣基督的受苦与死亡。
    reason: 说明“passion”的古代基督教用法，并保留原句强烈的基督论措辞。
lexical_decisions:
- source_word: farthest bounds / πέρατα
  choice: 尽头
  rationale: 保留空间极限的意象；结合“宇宙”“大地”分别表达普遍范围与尘世疆域。
- source_word: profit
  choice: 有益处
  rationale: 按语境表达世俗疆域和权势对说话者终极目标毫无价值。
- source_word: pangs of a new birth
  choice: 新生的阵痛
  rationale: 保留生产阵痛与即将进入新生命之间的强烈隐喻，不将其淡化为一般痛苦。
- source_word: pure light
  choice: 纯净的光
  rationale: 保持原有象征性，不擅自明确解释为天堂、殉道或上帝。
- source_word: be a man
  choice: 真正成为人
  rationale: 用现代汉语传达完成、成全之意，同时保留其意味深长的神学张力。
- source_word: passion
  choice: 所受的苦难
  rationale: 在本段指受难经历；避免现代汉语“激情”的误解。
- source_word: constrain / straiten
  choice: 使我受困迫
  rationale: 保留内外压力交织的开放性，不限定为情绪、监禁或殉道冲动中的任何一种。
theological_decisions:
- issue: “Do not hinder me from living; do not desire my death”中生命与死亡的悖论
  choice: “不要拦阻我得生命；不要想要我的死亡”
  alternative: “不要阻止我活着；不要希望我死”
  rationale: 上下文把肉身之死与真正生命并置；“得生命”使中文可懂，却不把该悖论完全解释掉。
- issue: “one who desires to be God’s”的归属意义
  choice: “一个渴望归属上帝的人”
  alternative: “一个渴望成为上帝的人”
  rationale: 英语见证中的所有格意为属于上帝；译作“成为上帝”会造成神化主张，偏离句法。
- issue: “the passion of my God”所含高基督论表达
  choice: “我的上帝所受的苦难”
  alternative: “我的上帝的受难”
  rationale: 明确保留“我的上帝”与受苦之间的神学张力，不改写为较弱的“基督的苦难”。
- issue: 复活句中括号补语的文本状态
  choice: 正文译作“那位复活的[a]”，脚注保留“为我们”的补充读法
  alternative: 正文写作“那位为我们复活的”
  rationale: 所给见证以方括号标示补入成分；将其移入脚注能避免把不确定补语当作无争议正文。
- issue: “then shall I be a man”的人性完成观
  choice: “我才真正成为人”
  alternative: “我才是一个人”
  rationale: 表达殉道者将抵达完成人性之境的说法，同时不将其系统化为特定成圣或神化教义。
translation_notes:
  register: 采用现代、庄重而自然的简体中文，保留原文连续的第一人称呼求、生命与死亡的悖论，以及生产、光和成为人的意象。鉴于所提供材料是公版英语见证，且注明希腊文复核尚待进行，本稿不声称完成了直接的希腊文校勘；对括号补语尤其谨慎处理。
