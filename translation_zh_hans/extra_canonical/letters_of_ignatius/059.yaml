  naturalness: 整体为自然、庄重的现代书面汉语。“请宽容我”在此呼吁语境中不如“请容忍我”贴切；“那使我受困迫的事”可简化为“使我受困迫的事”，语气更凝练。
  terminology: “归属上帝的人”正确传达“be God’s”的归属意义；“我的上帝所受的苦难”保留了强烈的基督论措辞；“新生的阵痛”“纯净的光”与“真正成为人”均适切。保留复活句脚注，以避免将方括号中的“为我们”视为无争议正文。
  issues:
