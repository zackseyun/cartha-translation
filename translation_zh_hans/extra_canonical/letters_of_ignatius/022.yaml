  rationale: 修订优先校正地点回指、ἀντίψυχον的核心语义，以及末段目的从句的结构；删除英语见证式措辞所增添的“被算为配得”概念。脚注仅用于两个确有语言难点的锚点，既使正文保持流畅，也保留文本本身的开放性。
