base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/022.yaml
  text: 'I am devoted to you and to those whom you sent to Smyrna for the honor of God. From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too. Remember me, just as I desire that Jesus Christ may also remember you.


    Pray for the church in Syria, from which I am being led as a prisoner to Rome—I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God. Farewell in God the Father and in Jesus Christ, our common hope.'
translation:
  language: zh_hans
  text: '我愿为你们，也为你们为着上帝的尊荣派往士每拿的那些人舍命。[a]我从那里写信给你们，感谢主；我爱坡旅甲，也像爱你们一样。请记念我，正如耶稣基督也记念你们。


    请为在叙利亚的教会祷告；我正从那里作为囚犯被押往罗马。我是那里的信徒中最末的，为要得以为上帝的尊荣而被寻见。[b]愿你们在父上帝和耶稣基督——我们共同的盼望——里面安好。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我愿……舍命”：原文用一个可直译为“作为……的替命者／性命保证”的罕见词，表达极强的委身。此处译为“愿……舍命”，不据此限定其是否指具体的殉道、替代或担保情形。
    reason: 说明罕见词ἀντίψυχον的强烈语义，避免将其误解为一般的喜爱或作单一教义性解释。
  - marker: b
    text: “为上帝的尊荣而被寻见”：原文的表达较为凝练，字面含“得以被寻见”及“归于上帝的尊荣”。译文保留其目的性，未将之解释为获得资格、功德认可或特指殉道。
    reason: 保留末句目的从句和“上帝的尊荣”之间存在的句法与解释空间，同时避免英语见证中“counted worthy”所引入的额外含义。
lexical_decisions:
- source_word: I am devoted to you
  choice: 我深爱你们
  rationale: 英语见证表达强烈的爱与委身；现代汉语用“深爱”自然庄重，又不额外引入仆属或献祭含义。
- source_word: for the honor of God
  choice: 为尊荣上帝
  rationale: 保留目的或关联意义，也保留原见证两处措辞的呼应。
- source_word: Remember me
  choice: 请记念我
  rationale: “记念”符合早期基督教书信与祷告语境，比日常的“记得”更庄重。
- source_word: the very last of the faithful there
  choice: 在那里的信徒中是最末后的
  rationale: 保留自谦性的排序表达，不擅自解释为时间上最后归信或身份上最不配。
- source_word: our common hope
  choice: 我们共同的盼望
  rationale: 忠实保留基督作为共同盼望的称谓及群体性。
theological_decisions:
- issue: “耶稣基督也记念你们”的语气
  choice: 正如我盼望耶稣基督也记念你们
  alternative: 愿耶稣基督也记念你们
  rationale: 英语见证含愿望表达；译文保留其愿望性，不把它改成确定应许。
- issue: “counted worthy”与“for the honor of God”的关系
  choice: 却蒙准配得为上帝的尊荣而被看为合宜
  alternative: 却被算为配得荣耀上帝
  rationale: 现有材料仅为英语见证，且希腊语复核尚待进行；采用较形式化且略显张力的表达，避免断定这是指殉道、服事资格或某种功德。
- issue: “in God the Father and in Jesus Christ”
  choice: 在父上帝和耶稣基督……里面
  alternative: 靠着父上帝和耶稣基督
  rationale: 保留“在……里面”的联合/领域意象，不将其缩减为工具性的“靠着”。
translation_notes:
  register: 采用现代、庄重而可读的书信体；保留“记念”“盼望”“在……里面”等基督教传统中仍易懂的用语。避免用过度古雅的“尔等”“算为配得”，也不将囚禁和蒙准配得直接解释成殉道神学。由于直接希腊语复核尚待进行，本稿严格以所给英语公共领域见证为暂定依据，并对最不确定的一句加注。
