review_pass:
  verdict: revise
  source_fidelity: 首段对“信是开始、爱是终结”及“二者在合一中是上帝”的张力大体保留得当。可是“其余的一切都随之通向真正的美善”把ἀκόλουθα（随之而来／相伴而随）译成了目的性很强的“通向”。末句把条件性的“若有人在信心的能力中被发现，直到末了”改写为“是否显明自己始终活在……”；这增添了“自己”“活在”的意思，也弱化了原文的条件结构和“被发现”的表述。
  naturalness: 整体庄重、通顺。修订后以“随之而来”对应原句的从属／伴随关系；末句保留格言式的条件句，同时仍使用自然的现代书面汉语。
  terminology: “信”“爱”“上帝”“基督”“信心的能力”均可接受。“真正的美善”可以保留，以表达καλοκἀγαθία兼具美好与良善、高尚品格的含义。“这工作”保留其概括性，不把英语见证的首字母大写解释为专名。
  issues:
  - severity: medium
    issue: “其余的一切都随之通向真正的美善”
    rationale: τὰ δὲ ἄλλα πάντα εἰς καλοκἀγαθίαν ἀκόλουθά ἐστιν表示其余一切是随从／相伴于真正美善的，不是“通向”美善的过程或目标。
  - severity: high
    issue: 末句改写了条件结构与“被发现”的措辞
    rationale: ἐὰν εὑρεθῇ εἰς τέλος意为“若（有人）在……中被发现，直到末了”。“一个人是否显明自己始终活在”加入原文未明说的自我展示和生活状态，并将条件句改为抽象的判断标准。
  revised_text: '你们若在对耶稣基督的信与爱上完全，这些事就没有一件向你们隐藏；因为信与爱是生命的开端和终结——信是开端，爱是终结。这两者在合一中成为，就是上帝；其余的一切都随真正的美善而来。[a]


    宣称有信的人不犯罪，拥有爱的人不憎恨。树从它的果子就显明出来；照样，那些宣称自己属于基督的人，也会借着他们所行的显明出来。因为这工作如今不是口头宣称的事，而是在于是否有人被发现有信心的能力，直到末了。[b]'
  revised_footnotes:
  - marker: a
    text: “这两者在合一中成为，就是上帝”保留原句不寻常而富有张力的表达。也可按字面理解为“这两者在合一中是上帝”；此处不作神学调和。
    reason: 原文的表述本身突兀，译文不补入原文没有的关系或教义性说明。
  - marker: b
    text: 较直译：“因为这工作如今不是宣称的事，而在于若有人在信心的能力中被发现，直到末了。”
    reason: 保留原文的条件结构、“被发现”以及“直到末了”；正文为使汉语顺畅作了有限重组。
  revision_rationale: 修订纠正了“随之通向”所造成的目的性偏移，并恢复末句的条件式、被动式及“直到末了”。“二者……就是上帝”的歧义与神学张力仍不予调和。
