review_pass:
  verdict: revise
  source_fidelity: 第一段基本忠实地保留了信与爱作为生命之始终，以及“二者在合一中成为／是上帝”这一突兀、不可轻易调和的表述。第二段末句原稿将“在信心的能力中被发现，直到末了”较大幅度改写为“显明自己始终活在……中”，加入了原文未明说的主动“显明自己”和“活在”概念；修订后恢复原句的被动、条件性及“直到末了”。
  naturalness: 原稿整体为庄重、现代的书面普通话。修订将“树怎样，从它的果子就显明出来”改为更自然的“树从它的果子就可认出来”，并使末句在保持原文结构的同时更顺畅。
  terminology: “信心／信”“爱”“基督”“上帝”均合乎现代中文基督教文本的通行用语，且没有加入宗派性解释。“真正的美善”可以传达 καλοκἀγαθία 所含的美好、良善与高尚；“工作”保留 τὸ ἔργον 的概括性。
  issues:
  - severity: medium
    issue: 末句把“被发现／被证实、直到末了”的表达改为“显明自己始终活在信心的能力中”。
    rationale: 该改写弱化了原文的条件式和被动语态，并加入“自己显明”“活在”等解释性内容。应保留一个人“在信心的能力中被发现／证实，直到末了”的开放表达。
  - severity: low
    issue: “树怎样，从它的果子就显明出来”不够自然。
    rationale: 原意是借果子辨认树；“树从它的果子就可认出来”更符合现代汉语，也准确保留比喻。
  revised_text: '你们若对耶稣基督有完全的信心和爱，这一切就没有一件是瞒得过你们的；因为信心和爱是生命的开始和终结——信心是开始，爱是终结。这两者在合一中成为上帝；其余的一切都随之而来，归向真正的美善。[a]


    自称有信心的人不犯罪，拥有爱的人不憎恨。树从它的果子就可认出来；同样，那些自称属于基督的人，也必借着他们所行的事被认出来。因为这工作如今不在于宣称；惟有一个人在信心的能力中被发现，直到末了，才显明出来。[b]'
  revised_footnotes:
  - marker: a
    text: “这两者在合一中成为上帝”保留了原句本身不寻常而有张力的表达；也可按句法理解为“这两者既在合一中，便是上帝”。此处不作神学调和。
    reason: 提示此句的真实语义与神学张力，避免把译文当作已解决的教义陈述。
  - marker: b
    text: 较直译：“因为这工作如今不是宣称的事，而是：若有人在信心的能力中被发现，直到末了。”这里“被发现”和“直到末了”的具体关系保留原有的句法开放性。
    reason: 保存原文末句的被动表达、条件性及“直到末了”，不把它具体解释为某种内在状态、死亡、末世或特定教义。
  revision_rationale: 修订集中于恢复末句的原文语法与歧义，避免把“被发现”解释成当事人主动显明自己，也避免以“活在”取代原有表达。其余调整仅为使现代普通话更自然，并保留原文与英语审计轨迹中的神学张力和概括性。
