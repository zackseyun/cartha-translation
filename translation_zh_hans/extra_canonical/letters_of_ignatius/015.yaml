base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/015.yaml
  text: 'None of these things is hidden from you, if you are complete in your faith and love toward Jesus Christ, for these are the beginning and end of life—faith is the beginning and love is the end. The two, found in unity, are God, while everything else follows in their train toward true nobility.


    No one who professes faith sins, and no one who possesses love hates. The tree is revealed by its fruit; likewise, those who profess to belong to Christ will be recognized by their actions. For the Work is not now a matter of profession, but is seen when someone is found in the power of faith to the end.'
translation:
  language: zh_hans
  text: '你们若对耶稣基督有完全的信与爱，这些事就没有一件是你们所不知道的；因为信与爱是生命的起点和终点——信是起点，爱是终点。这两者合而为一，就是上帝；其余的一切都随之通向真正的美善。[a]


    宣称有信心的人不犯罪，拥有爱的人也不憎恨。树怎样，从它的果子就显明出来；同样，那些宣称自己属于基督的人，也必从他们所做的事被认出来。因为这工作如今不在于口头宣称，而在于一个人是否显明自己始终活在信心的能力中。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这两者合而为一，就是上帝”保留了原句本身不寻常而有张力的表达；也可理解为“这两者在合一中就是上帝”，此处不作神学调和。
    reason: 提醒读者此句具有真实歧义，避免把译法误当作已解决的教义陈述。
  - marker: b
    text: 较直译：“而在于是否有人在信心的能力中被显明，直到末了。”
    reason: 正文采用自然汉语重组句法；脚注保存“被发现／显明”和“直到末了”的形式与歧义。
lexical_decisions:
- source_word: πίστις
  choice: 信／信心
  rationale: 按上下文分别采用简洁的“信”和自然的“信心”，既保留其信靠、信仰的范围，也避免加入宗派性界定。
- source_word: ἀγάπη
  choice: 爱
  rationale: 用现代汉语通行而庄重的“爱”，不以较旧的“爱德”缩窄含义。
- source_word: καλοκἀγαθία
  choice: 真正的美善
  rationale: 该词表达高尚、美好与良善兼具的品格；“真正的美善”比“高贵”更能传达其伦理意味。
- source_word: ἐπαγγέλλομαι
  choice: 宣称
  rationale: 此处指公开自称或表明自己有信、属于基督；“宣称”保留言语宣认与实际行为之间的对照。
- source_word: τὸ ἔργον
  choice: 这工作
  rationale: 保留单数和概括性，不沿用英语见证文本中未必来自希腊文的首字母大写，也不把它具体化为某一种行为。
- source_word: ἐν δυνάμει πίστεως
  choice: 活在信心的能力中
  rationale: 以自然汉语表达“在信心的能力中”的状态，同时保留信心具有实际效力的含义。
theological_decisions:
- issue: “这两者合而为一，就是上帝”的神学张力
  choice: 按其表面结构直译为“这两者合而为一，就是上帝”
  alternative: 解释为“这两者合一，就使人亲近上帝”或“上帝存在于二者的合一中”
  rationale: 现有希腊文传统所见表达本身突兀，不宜替作者作神学调和或补出原文没有的关系。
- issue: “宣称有信心的人不犯罪”的绝对表述
  choice: 保留“不犯罪”
  alternative: 弱化为“不应犯罪”或“不会惯常犯罪”
  rationale: 原句采用直陈式绝对陈述；虽有解释空间，译文不应暗中加入劝诫语气或“持续犯罪”等限定。
- issue: 信心坚持到底的表达
  choice: 译为“始终活在信心的能力中”
  alternative: 译为“在信心的能力中被发现，直到末了”
  rationale: 使现代读者易懂，同时保留“能力”与“到底”的要素，不把“到底”专门解释为死亡、末世或某一教义概念。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“起点和终点”比“开始和结束”更适合抽象论述；第二段保留短句与格言式力度。现有任务说明称希腊文复核尚待完成，因此本稿参考所提供的公版英语见证，并依据可核对的中期希腊文传统措辞谨慎起草；出版前仍应完成正式希腊文校勘复核。
