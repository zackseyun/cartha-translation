base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/089.yaml
  text: 'I greet the households of my brothers, with their wives and children, and the virgins who are called widows. I bid you farewell in the power of the Father. Philo, who is with me, greets you.


    I greet the household of Tavia, and I pray that she may be grounded in faith and love, both of flesh and of spirit. I greet Alce, a name very dear to me, and the incomparable Daphnus, and Eutecnus, and all by name. Farewell in the grace of God.'
translation:
  language: zh_hans
  text: '我问候我弟兄们的各家，以及他们的妻子儿女，也问候那些被称为寡妇的童贞女[a]。愿你们在父的能力中安好。与我同在的斐洛问候你们。


    我问候塔维娅一家，并祈求她在信心和肉身、属灵两方面的爱中坚定稳固[b]。我问候我所深爱的阿尔刻，也问候无与伦比的达弗努斯、欧特克努斯，并逐一问候众人。愿你们在上帝的恩典中安好。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被称为寡妇的童贞女”可能是当时群体中的一种称谓；现有见证未能确定其确切身份，因此保留原有表述。
    reason: 说明一个历史上含义不确定、字面上带有张力的称号。
  - marker: b
    text: 原文中“肉身的和属灵的”在语法上直接修饰“爱”，而不是“信心”。这里的“肉身”和“属灵”具体所指未明，故按字面保留。
    reason: 反映希腊文的语法关联，同时避免把这对用语解释为特定神学立场或实践。
lexical_decisions:
- source_word: households
  choice: 各家／一家
  rationale: 按现有英文见证译出家庭或家户整体，既包括亲属，也不排除同住成员；根据上下文分别采用自然的复数和单数表达。
- source_word: virgins who are called widows
  choice: 那些被称为寡妇的童贞女
  rationale: 保留原句看似矛盾的称谓，不擅自解释为某种固定教会职分。
- source_word: in the power of the Father
  choice: 靠着父的能力
  rationale: 保留“父”与“能力”的神学措辞，并用“靠着”表达所凭借的力量。
- source_word: grounded
  choice: 根基稳固
  rationale: 保留建筑性隐喻，同时符合现代汉语表达。
- source_word: both of flesh and of spirit
  choice: 无论在肉身方面还是在灵性方面
  rationale: 保留肉身与灵的双重范围，不将其简化为某一种伦理或神学解释。
- source_word: all by name
  choice: 逐一问候众人
  rationale: 自然传达按名字一一致意的含义，避免生硬直译。
- source_word: Fare ye well / Farewell
  choice: 愿你们……安好
  rationale: 在书信结语中采用庄重而自然的祝愿式表达，并保留所凭借的属灵范围。
theological_decisions:
- issue: “被称为寡妇的童贞女”的身份
  choice: 按字面保留双重称谓，并加注说明其确切所指不明
  alternative: 直接译作“守贞的寡妇”或认定为某种寡妇职分
  rationale: 现有材料未完成希腊文复核，且表述本身可能反映早期群体中的特殊称号；不应以宗派传统消除其张力。
- issue: “肉身和灵”的修饰范围
  choice: 译为信心和爱在肉身与灵性两方面都根基稳固
  alternative: 将“肉身和灵”仅与“爱”相连，或解释为身体健康与属灵生命
  rationale: 英文见证在句法上存在一定歧义；正文以自然中文保留广义关联，并用脚注提示。
- issue: 告别语中的神圣施动
  choice: 用祝愿式“愿你们靠着父的能力安好／在上帝的恩典中安好”
  alternative: 命令式“你们要在……中刚强”
  rationale: 英文见证表达为书信告别祝愿；在未直接核查希腊文前不强化为命令。
translation_notes:
  register: 采用现代、庄重、易懂的书信体。“弟兄们”保留古代共同体的亲属称谓；人名依英语见证作暂定音译。由于希腊文源语复核尚待完成，本稿明确以公共领域英文见证为直接起草依据，对有疑义之处采取保守译法并加注。
