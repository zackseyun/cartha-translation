base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/006.yaml
  text: 'For if, in a short time, I had such fellowship with your bishop—not in a merely human way, but in the Spirit—how much more do I congratulate you who are closely joined to him, as the Church is joined to Jesus Christ and Jesus Christ to the Father, so that all things may be harmonious in unity.


    Let no one be deceived. If anyone is not within the precinct of the altar, that person lacks the bread [of God]. For if the prayer of one person and another has such great power, how much more does the prayer of the bishop and the whole Church.


    Therefore, whoever does not come to the congregation thereby shows pride and has separated himself, for it is written, “God resists the proud.” Let us therefore be careful not to resist the bishop, so that by our submission we may give ourselves to God.'
translation:
  language: zh_hans
  text: '因为我在短时间内得以同你们的监督有这样的交往——这并非属人的，而是属灵的——我就更称你们为有福了：你们与他紧密结合，正如教会与耶稣基督结合，耶稣基督又与父结合，好叫一切都在合一中和谐一致。


    不要受迷惑。若有人不在祭坛以内，他就缺少〔上帝的〕饼[a]。因为，一个人和另一个人的祷告既有如此大的力量，何况监督和全教会的祷告呢？


    所以，凡不与众人一同聚集的，就已经自高自大，使自己与众人分离了；因为经上记着：“上帝抵挡骄傲的人。”[b] 因此，我们要谨慎，不可抵挡监督，好叫我们顺服上帝。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的”在所据英文见证中置于方括号内；中期希腊文传统的校勘文本也常将相应短语视为不确定。方括号保留这一文本层面的不确定性，并不判定“饼”具体指何种礼仪或神学意义。
    reason: 保留原见证的方括号信息，并以正文锚点对应。
  - marker: b
    text: 参《箴言》3:34。此语也见于《雅各书》4:6和《彼得前书》5:5；此处不据此断定作者直接援引哪一新约文本。
    reason: 说明引文的经文背景，同时避免不必要地限定其直接来源。
lexical_decisions:
- source_word: bishop (Greek source review pending; likely ἐπίσκοπος)
  choice: 监督
  rationale: 采用能反映早期教会职分基本含义、且不预先套入后世宗派制度的译名；本稿因尚未直接核对希腊文，保留审订空间。
- source_word: converse / fellowship
  choice: 相交
  rationale: 既表达亲身交往，也保留属灵团契的意味，避免只译作一般谈话。
- source_word: in the Spirit
  choice: 在圣灵里
  rationale: 按基督教语境自然理解为圣灵，同时保留原表达与“按人的方式”的对照。
- source_word: precinct of the altar
  choice: 祭坛的范围之内
  rationale: 尽量保留祭坛意象及空间性的含混，不直接解释为圣餐资格、教会辖区或特定建筑范围。
- source_word: bread [of God]
  choice: 上帝的饼
  rationale: 保留见证文本所标示的“of God”，并以脚注说明其文本状态，避免把所指对象在正文中限定为某一种教义解释。
- source_word: congregation
  choice: 聚会
  rationale: 突出实际参加共同集会的行动；上下文已用“全教会”，因此不机械重复“教会”。
- source_word: submission
  choice: 顺服
  rationale: 符合上下文对监督的态度，也保留借此将自己归向上帝的神学张力。
- source_word: give ourselves to God
  choice: 将自己献给上帝
  rationale: 以自然庄重的中文表达自我交付；“献给”并不把该句缩减为单纯服从人的权威。
theological_decisions:
- issue: 监督与教会合一的关系
  choice: 保留教会—基督、基督—父的平行类比
  alternative: 将其解释为监督具有与基督同等的权威
  rationale: 原文类比强调紧密相连及合一的和谐，并未明说身份或权威完全等同。
- issue: “祭坛之外”与“上帝的饼”的含义
  choice: 保留祭坛和饼的原有意象，不在正文中判定其专指圣餐、教会共同体或救恩
  alternative: 直接译解为“不参加圣餐便得不到救恩”
  rationale: 该段意象具有礼仪和共同体双重可能性；在希腊文直接审查尚未完成时，不宜消除其真实张力。
- issue: 不参加聚会者的状态
  choice: 译为“显出自己的骄傲，并且已经使自己与众人分离”
  alternative: 译为遭监督或教会正式逐出
  rationale: 见证文本强调当事人的行为所显出的骄傲与自我分离，并未明确描述正式惩戒程序。
- issue: 顺服监督与归向上帝
  choice: 保留“借着顺服，将自己献给上帝”的目的关系
  alternative: 把顺服监督直接等同于顺服上帝
  rationale: 原句建立密切关系，但仍区分监督与上帝；译文不把二者无条件等同。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“诸位”保留书信对群体的礼貌称呼；“监督”避免直接输入后世宗派性的“主教”制度含义。当前只能以所给公版英文见证并参考英文POB作临时源证据审订，尚未完成中期希腊文传本的直接核查，因此对“相交”“祭坛的范围”“上帝的饼”等关键表达采取较形式对应、保留含混的译法。
