  naturalness: 初稿整体庄重通顺。修订后以“交往”“紧密结合”“一同聚集”“自高自大”等现代书面语表达，避免“竟”“一两个人”和感叹号所增添的语气，并保留原文的劝诫性语域。
  terminology: “监督”可保留，能对应ἐπίσκοπος而不预设后世宗派职制。“祭坛”“教会”“耶稣基督”“父”也可保留。“〔上帝的〕饼”以方括号显明所据见证及希腊文传统中该属格短语的不确定状态；不在正文判定其礼仪或救恩意义。
  issues:
  - severity: medium
    issue: “不是按人的方式，而是在圣灵里”过度限定原文的形容词对照。
    rationale: 希腊文οὐκ ἀνθρωπίνης οὔσης ἀλλὰ πνευματικῆς与英文见证的“not after the manner of men but in the Spirit”相应，但πνευματική可保留为“属灵的”；译作“在圣灵里”把形容词转为地点性表达，并确定为圣灵。
