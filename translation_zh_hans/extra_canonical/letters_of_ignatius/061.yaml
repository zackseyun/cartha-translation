    issue: 脚注e错误地说末句“愿意”与“憎恨”的对象没有明说。
    rationale: 原文末句的两个动词均以“我”为宾语。现有说明会使读者误以为这是原文的句法歧义，且正文“所愿意的／所憎恨的”也弱化了直接的人称宾语。
  - severity: medium
    issue: “父借着他真实地说了话”把“in whom”译作“借着他”。
    rationale: 这会将所在／联合性的表达改为工具性表达。宜译为“父在他里面说了话”，以避免不必要的释义。
