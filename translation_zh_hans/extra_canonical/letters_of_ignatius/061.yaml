base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/061.yaml
  text: 'I no longer desire to live in the manner of human beings, and this will happen if you desire it. Desire it, so that you yourselves may also be desired. In this brief letter I plead with you: believe me.


    And Jesus Christ will make these things clear to you—that I am speaking the truth—Jesus Christ, the unerring mouth in whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you according to the flesh, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
translation:
  language: zh_hans
  text: '我不再愿意照世人的方式活着；只要你们愿意，这事就会实现。你们要愿意这事，好使你们自己也同样为人所愿[a]。我以这封短信恳求你们：请相信我。


    耶稣基督必向你们显明，我所说的是真话。他是绝无虚谎的口，父借着他真实地说了话[b]。


    请为我祈求，使我可以达到目标[c]〔借着圣灵〕[d]。我写信给你们，不是顺着肉体，而是依照上帝的心意。如果我受苦，那是你们所愿意的；如果我被弃绝，那是你们所憎恨的[e]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为人所愿”直译原文的被动形式；是谁“愿意”他们，原文没有明说。这里刻意保留了“愿意……为人所愿”的文字呼应。
    reason: 说明原文文字游戏及被动施事者的歧义。
  - marker: b
    text: 有些见证在“说了话”后明确作“真实地”；本译文依所提供见证保留此意。希腊文见证仍需直接复核。
    reason: 交代所给英文见证中方括号词 truly 的文本不确定性。
  - marker: c
    text: “达到目标”在本信上下文中很可能指达到殉道的目标；原句本身没有把目标明说出来。
    reason: 保留原文省略，同时帮助读者理解语境。
  - marker: d
    text: “借着圣灵”在所提供的英文见证中置于方括号内，表明其文本归属存疑；待直接核查希腊文传统后再定。
    reason: 透明呈现当前底本限制和异文状态。
  - marker: e
    text: 末句也可按上下文理解为：“如果我受苦，就是你们愿意了；如果我被弃绝，就是你们恨了。”原文没有明说“愿意”与“憎恨”的对象，语气刻意简峻。
    reason: 保存末句句法与修辞上的含混和张力。
lexical_decisions:
- source_word: κατὰ ἀνθρώπους
  choice: 照世人的方式
  rationale: 保留“按人/照人的方式”的对照含义，同时使现代汉语自然；不将其扩释成特定伦理或神学判断。
- source_word: θελήσατε … θεληθῆτε
  choice: 你们要愿意这事……也同样为人所愿
  rationale: 尽量保留原文主动与被动形式之间的重复和文字呼应，不擅自补出被动式背后的施事者。
- source_word: τὸ ἀψευδὲς στόμα
  choice: 绝无虚谎的口
  rationale: 保留“口”的身体意象及“不虚假”的强烈断言，比改写为“可靠的发言者”更贴近原文。
- source_word: ἐπιτύχω
  choice: 达到目标
  rationale: 该动词表示达到、获得或如愿以偿；上下文所指是殉道目标，但正文不直接补出，以保存原文简略表达。
- source_word: κατὰ σάρκα
  choice: 顺着肉体
  rationale: 保留早期基督教文本中“肉体”的神学张力，并与“上帝的心意”形成原有对照。
- source_word: κατὰ γνώμην θεοῦ
  choice: 依照上帝的心意
  rationale: γνώμη 可指意向、判断或心意；此处用“心意”自然且不过度限定为命令或旨意。
- source_word: ἀποδοκιμασθῶ
  choice: 被弃绝
  rationale: 保留“经检验后不被接纳/遭拒绝”的被动意义，也维持其可能涉及未能完成殉道的语境。
theological_decisions:
- issue: “使你们也同样为人所愿”中被动式的施事者
  choice: 不补明是谁愿意或悦纳他们
  alternative: 译作“使上帝也悦纳你们”或“使别人也爱慕你们”
  rationale: 原文被动式本身未明说施事者；补作“上帝”虽可能符合语境，却会消除真实歧义。
- issue: “达到目标”的具体所指
  choice: 正文保留概括表达，以脚注说明上下文可能指达到殉道的目标
  alternative: 正文直译为“使我可以殉道”
  rationale: 原文动词没有明说殉道，虽上下文强烈指向此意，仍不宜在正文中把隐含内容变成明说。
- issue: “借着圣灵”的文本状态
  choice: 保留方括号并加脚注标明见证问题
  alternative: 无括号纳入正文，或完全删去
  rationale: 所给英文见证将其置于方括号，且希腊文直接复核尚待完成；现阶段应显明其文本不确定性。
- issue: 末句“愿意/憎恨”的宾语
  choice: 不补出宾语，保留原文突兀而有力的条件句
  alternative: 补成“你们愿意我受苦/你们恨我”
  rationale: 原文表达极其简练，可能含有对罗马信徒是否协助或阻碍其殉道的尖锐反讽；补足宾语会替读者决定句法关系。
translation_notes:
  register: 采用现代、庄重而可读的书信体。保留“肉体”“上帝的心意”“绝无虚谎的口”等原文意象和神学张力；避免把依纳爵对殉道的渴望改写成一般性的励志语言。由于本任务提供的是公共领域英文见证，且注明希腊文复核尚待进行，本稿对方括号内容和可能异文采取审慎、透明的处理。
