base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/003.yaml
  text: 'Regarding my fellow servant Burrhus, who by the will of God is your deacon, blessed in every way, I ask that he may remain with me, to the honor of both you and your bishop. And Crocus also, who is worthy of God and of you, whom I received as an example of the love you bear me, has relieved me in every way. In the same way, may the Father of Jesus Christ refresh him, together with Onesimus, Burrhus, Euplus, and Fronto. In them I saw you all with the eyes of love.


    May I always have joy in you, if indeed I am worthy of it. Therefore, it is fitting for you in every way to glorify Jesus Christ, who glorified you, so that, being perfectly joined together in one submission and submitting yourselves to your bishop and presbytery, you may be sanctified in all things.'
translation:
  language: zh_hans
  text: '至于与我同作仆人的布鲁斯，他照上帝的旨意作你们的执事，在各方面都蒙了福；我恳求让他留在我身边，使你们和你们的监督都得尊荣。还有克罗库斯，他配得上帝和你们的认可；我接待了他，就把他看作你们爱我的明证。他在各方面都使我得了安慰。愿耶稣基督的父也照样使他得安慰，也使阿尼西母、布鲁斯、欧普鲁斯和弗龙托得安慰。我以爱的眼光，在他们身上看见了你们众人。


    愿我能常常因你们而喜乐——如果我确实配得。因此，你们理当在各方面荣耀那位荣耀了你们的耶稣基督，好使你们在同一的顺服中完全联结，顺服你们的监督和众长老[a]，从而在各方面都得以成圣。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众长老”所对应的英文见证为 presbytery，指作为一个整体的长老群体，也可译作“长老团”。
    reason: 提示集合性职分含义，并保留另一种常见译法；直接希腊文复核尚待进行。
lexical_decisions:
- source_word: fellow servant
  choice: 与我同作仆人的
  rationale: 保留共同服事及同属一位主人的意味，避免较宽泛的“同工”削弱“仆人”意象。由于尚待希腊文复核，此处依据所提供的公共领域英文见证翻译。
- source_word: deacon
  choice: 执事
  rationale: 采用现代汉语基督教文献中通行且简明的职分名称，不额外界定其具体职责。
- source_word: refresh / relieved
  choice: 使……得安慰
  rationale: 以同一措辞连接克罗库斯对伊格那丢所做之事与作者为他向父所求之事，尽量保留原段的呼应。
- source_word: bishop
  choice: 监督
  rationale: 采用能表达群体带领职分的现代标准汉语译名，并避免在正文中加入后世制度细节。
- source_word: presbytery
  choice: 众长老
  rationale: 正文采用普通读者易懂的表达，同时以脚注指出英文见证所呈现的集合性含义。
- source_word: sanctified
  choice: 得以成圣
  rationale: 保留被动语态及宗教伦理含义，不将其窄化为单纯的道德改善。
theological_decisions:
- issue: “顺服”与群体合一的关系
  choice: 按原句次序保留“在同一的顺服中完全联结，顺服你们的监督和众长老”
  alternative: 解释为因服从教会职分而自动达到完全合一
  rationale: 译文呈现原句的紧密联系，却不额外建立超出文本的教会论因果体系。
- issue: “得以成圣”的范围
  choice: 译作“在各方面都得以成圣”
  alternative: 译作“凡事都行为圣洁”
  rationale: 保留英文见证中的被动表达和神学张力，不擅自判定此处仅指人的行为或某种特定成圣教义。
- issue: “配得上帝和你们”
  choice: 译作“配得上帝和你们的认可”
  alternative: 直译为“配得上帝和你们”
  rationale: 补出汉语中自然的关系词，使句意可懂，同时不把“配得”解释为救恩功德。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。人名按常见音译原则处理；句法适度拆分以利朗读。由于提供材料明确说明希腊文审校尚未完成，本稿以公共领域英文见证及英文POB咨询层为暂定依据，不声称已经完成中期校订本希腊文传统的直接核验。
