    愿我能常常因你们而喜乐——若我配得有这喜乐。因此，你们理当在各方面荣耀那位荣耀了你们的耶稣基督，好使你们在同一的顺服中完全联结，并顺服你们的监督和众长老[a]，从而在各方面都得以成圣。'
  revised_footnotes:
  - marker: a
    text: “众长老”所对应的英文见证为 presbytery，指作为一个整体的长老群体，也可译作“长老团”。
    reason: 提示集合性职分含义，并保留另一种常见译法；直接希腊文复核尚待进行。
