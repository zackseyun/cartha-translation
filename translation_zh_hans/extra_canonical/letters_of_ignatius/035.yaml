base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/035.yaml
  text: May I have joy in you in all things, if I am worthy. For even though I am in chains, I am not comparable to any one of you who are free. I know that you are not puffed up, for you have Jesus Christ within you. And when I praise you, I know that you only feel all the more ashamed, as it is written, “The righteous person accuses himself.”
translation:
  language: zh_hans
  text: 如果我配得，愿我在一切事上以你们为乐。因为我虽然身受捆绑，却不能与自由的你们任何一位相比。我知道你们并不自高自大，因为你们里面有耶稣基督。当我称赞你们时，我知道你们只会越发感到惭愧；正如经上所记：“义人控告自己。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的引语与《箴言》18:17的希腊文传统有关；其措辞也可理解为“义人先控诉自己”或“义人是自己的控告者”。本译文依所提供的古代见证直译。
    reason: 说明引文来源和可能译法；当前草案依据公共领域英文见证，尚待希腊文原文复核。
lexical_decisions:
- source_word: have joy of you
  choice: 因你们而喜乐
  rationale: 自然表达喜乐以收信人为缘由，同时保留原句亲切而郑重的语气。
- source_word: in bonds
  choice: 身受捆绑
  rationale: 保留实际被囚、受锁链拘禁的处境，不弱化为泛指困境。
- source_word: at liberty
  choice: 自由的
  rationale: 与“身受捆绑”形成清楚对照，指未被囚禁的人。
- source_word: puffed up
  choice: 自高自大
  rationale: 传达骄傲膨胀的比喻意义，符合现代普通话习惯。
- source_word: in yourselves
  choice: 你们里面
  rationale: 保留基督内住的空间性表述，不改写为较弱的“你们信奉基督”。
- source_word: self-accuser
  choice: 控告自己
  rationale: 贴近见证文本的司法性措辞，并保留引语可能指自省、自责或自我陈明的张力。
theological_decisions:
- issue: “你们里面有耶稣基督”的内住表述
  choice: 直译为“你们里面有耶稣基督”
  alternative: “耶稣基督住在你们里面”
  rationale: 前者更贴近所提供见证文本，避免额外强化“居住”这一解释性意象，同时保留神学含义。
- issue: “义人控告自己”的引文性质与意义
  choice: 保留为“正如经上所记：‘义人控告自己。’”
  alternative: 解释为“义人先责备自己”或“义人承认自己的过错”
  rationale: 不将可能源于箴言传统的引语预先限定为认罪或谦卑教训，保存其司法措辞及文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“如果我配得”保留依格那丢谦逊的条件语气；“反而越发自觉惭愧”表达受称赞后更谦抑的反应。由于直接希腊文审校尚未完成，本稿为依据所给公共领域英文见证的暂定译文。
