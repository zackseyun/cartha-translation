  text: Ignatius, who is also called Theophorus, to her who has been blessed through the grace of God the Father in Christ Jesus our Savior, in whom I salute the church in Magnesia on the Maeander, and I wish her abundant greeting in God the Father and in Jesus Christ.
translation:
  language: zh_hans
  text: 又名“提奥福罗斯”的伊格那修，致那在我们的救主基督耶稣里、藉父神的恩典蒙福的教会。我在基督里问候位于迈安德河畔马格尼西亚的教会，并在父神和耶稣基督里向她致以丰盛的问安。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文暂据所提供的公版英文见证拟定；中间校订本希腊文原文尚待直接复核。
    reason: 资料明确说明源语言审查尚未完成，应向读者透明交代当前文本基础。
lexical_decisions:
- source_word: Ignatius
  choice: 伊格那修
  rationale: 采用现代中文中较常见、且接近希腊名 Ignatios 的音译。
- source_word: Theophorus
  choice: 提奥福罗斯
  rationale: 保留称号的音译，避免在希腊原文复核尚未完成时过早确定其可能的词义翻译。
- source_word: her / church
  choice: 教会／她
  rationale: 明确收信者是教会，同时在后句保留原见证文本把教会人格化为阴性对象的表达。
- source_word: blessed
  choice: 蒙福
  rationale: 自然表达领受神恩惠与福分之意，不将其收窄为单一神学术语。
- source_word: abundant greeting
  choice: 丰盛的问安
  rationale: 兼顾书信问候语的庄重感和“abundant”的加强意味。
- source_word: Magnesia on the Maeander
  choice: 迈安德河畔马格尼西亚
  rationale: 以现代汉语自然地标示该城所在，区别于其他同名地点。
theological_decisions:
- issue: “在基督耶稣里”与“藉父神的恩典”的修饰关系
  choice: 那在我们的救主基督耶稣里、藉父神的恩典蒙福的教会
  alternative: 那藉着父神在我们的救主基督耶稣里的恩典蒙福的教会
  rationale: 所据英文见证允许不同的短语连接方式；当前译法保留“在基督里”与“藉恩典”两重关系，不把“在基督里”明确限定为只修饰“恩典”。
- issue: “in whom I salute”中关系代词的指向
  choice: 我在基督里问候
  alternative: 我在他里面问候
  rationale: 英文见证中的“whom”最自然地回指基督耶稣；明示“基督”可避免中文代词指向含混，但希腊原文仍待直接复核。
- issue: 教会的拟人化
  choice: 向她致以丰盛的问安
  alternative: 向他们致以丰盛的问安
  rationale: 保留见证文本把教会作为一个整体并以阴性称代的修辞，不改写为会众个体。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。人名和地名使用音译；“父神”“救主”“教会”“在基督里”等表达保持早期基督教书信的神学语域。因希腊文复核待定，避免为“提奥福罗斯”添加未经确认的释义。
