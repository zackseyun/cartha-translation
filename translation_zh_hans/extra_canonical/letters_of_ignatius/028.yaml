base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/028.yaml
  text: Seeing then that all things have an end, and these two—life and death—are set before us together, each person shall go to his own place. For just as there are two coinages, one of God and the other of the world, and each has its proper stamp impressed upon it, so the unbelievers bear the stamp of this world, but the faithful, in love, bear the stamp of God the Father through Jesus Christ, through whom, unless we of our own free choice accept to die unto his passion, his life is not in us:--
translation:
  language: zh_hans
  text: 既然万物都有终局，生命与死亡这两者又一同摆在我们面前，每个人都将到自己的归宿去。正如有两种铸币，一种属于上帝，另一种属于世界，各自都有其特有的印记；不信的人带着这世界的印记，信的人却在爱中，借着耶稣基督得有上帝父的印记。除非我们出于自己的自由选择，甘心与他的受难一同受死，他的生命就不在我们里面——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: end
  choice: 终局
  rationale: 既可表达万物有其结局，也保留原文面向终末的庄重语气；比单纯的“结束”更适合本段语境。
- source_word: his own place
  choice: 自己的归宿
  rationale: 保留每个人各有去处的含义，同时避免把未明确的地点具体化为天堂、地狱或某种固定教义术语。
- source_word: coinages
  choice: 钱币
  rationale: 本段以钱币所带的印记作比喻；译作“钱币”比“铸币制度”自然，也能承接后面的“印记”。
- source_word: stamp
  choice: 印记
  rationale: 体现钱币上压印的标志，并保留其象征归属与身份的意义。
- source_word: the faithful
  choice: 忠信的人
  rationale: 兼顾相信与持守忠诚两层含义，不把词义缩减为单纯的身份标签。
- source_word: in love
  choice: 在爱中
  rationale: 保留短语可能修饰“忠信的人”或其带有印记之状态的语法张力，不擅自改成较明确的因果关系。
- source_word: of our own free choice
  choice: 甘心选择
  rationale: 表达主动、自愿的选择，不引入后世关于“自由意志”的体系化术语。
- source_word: die unto his passion
  choice: 向他的受难而死
  rationale: 尽量保留原表述中与基督受难联合、相应而死的浓缩神学语言，不解释为殉道或一般舍己。
- source_word: passion
  choice: 受难
  rationale: 在早期基督教语境中指耶稣基督的苦难与死亡；“受难”是现代中文清楚而庄重的对应语。
theological_decisions:
- issue: “生命与死亡”及“自己的地方”的终末含义
  choice: 译为“生命与死亡……自己的归宿”
  alternative: 明确译为永生、永死或天堂、地狱
  rationale: 现有见证文本没有直接展开具体地点或最终状态，故保留其终末张力而不增添教义解释。
- issue: “借着耶稣基督”与印记的关系
  choice: 保留为“借着耶稣基督带着父上帝的印记”
  alternative: 解释为由耶稣授予、因信耶稣获得或在洗礼中领受
  rationale: 原句只明确中介关系，没有限定其具体施行方式。
- issue: “在爱中”的修饰范围
  choice: 置于“忠信的人”与“借着……”之间并用逗号保留开放性
  alternative: 明确译成“因着爱”或“以爱为印记”
  rationale: 现有英文见证及潜在希腊语结构允许一定修饰歧义，不宜无依据消除。
- issue: “甘心选择向他的受难而死”
  choice: 保留主动选择及与基督受难关联的表述
  alternative: 译为必须自愿殉道，或必须治死罪性
  rationale: 两种解释都可能过度具体化；当前材料不足以把它限定为殉道或灵修意义上的治死。
- issue: “他的生命不在我们里面”中的代词所指
  choice: 译作“他的生命”
  alternative: 译作“基督的生命”
  rationale: 上下文最近的先行对象是耶稣基督，但保留代词更贴近见证文本，且不改变所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号和破折号维持原段层层推进且尚未完结的句法；末尾破折号表明论述在下一节继续。由于希腊语源文复核尚未完成，本稿谨慎依据所给公共领域英文见证与审校层起草，不虚构源文异读。
