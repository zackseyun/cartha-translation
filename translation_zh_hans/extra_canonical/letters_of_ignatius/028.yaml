revisions:
- from: 既然万物都有终局，而生命与死亡这两者又一同摆在我们面前，每个人都将到自己的归宿去。正如有两种钱币，一种属于上帝，另一种属于世界，各自都印有本身的印记；不信的人带着这世界的印记，忠信的人却在爱中，借着耶稣基督带着父上帝的印记。我们若不甘心选择向他的受难而死，他的生命就不在我们里面——
  to: 既然万物都有终局，生命与死亡这两者又一同摆在我们面前，每个人都将到自己的归宿去。正如有两种铸币，一种属于上帝，另一种属于世界，各自都有其特有的印记；不信的人带着这世界的印记，信的人却在爱中，借着耶稣基督得有上帝父的印记。除非我们出于自己的自由选择，甘心与他的受难一同受死，他的生命就不在我们里面——
  rationale: 修订仅处理影响可读性和句法关系的措辞。“归宿”保留“自己的地方”的未具体化终末意味；“在爱中”仍以逗号隔开，保留其修饰范围的开放性。末尾破折号保留，表示论述续接下一段。
