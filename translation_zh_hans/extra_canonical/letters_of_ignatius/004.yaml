base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/004.yaml
  text: 'I do not command you as though I were someone important. For even though I am in chains for the sake of the Name, I have not yet been perfected in Jesus Christ. [For] I am only now beginning to be a disciple, and I speak to you as my fellow students. For I ought to be trained by you for the contest in faith, admonition, endurance, and patience.


    But since love does not allow me to remain silent concerning you, I was therefore eager to exhort you to run in harmony with the mind of God. For Jesus Christ also, our inseparable life, is the mind of the Father, just as the bishops established in the farthest parts of the earth are in the mind of Jesus Christ.'
translation:
  language: zh_hans
  text: '我并不命令你们，仿佛我是个什么人物。即使我为这名的缘故被锁链捆绑，我仍尚未在耶稣基督里得以完全。[a]我如今才开始接受作门徒的训练；我对你们说话，如同对我的同学。因为我本该由你们用信心、劝诫、忍耐和恒忍来操练。


    然而，爱不容我对你们保持沉默；因此我敦促你们，要一同奔跑，与上帝的心意相合。因为耶稣基督——我们不可分离的生命——就是父的心意；同样，那些设立在地极各处的主教，也都在耶稣基督的心意中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给英文见证在此以方括号标出“因为”（For），表示一个文本补入信号；本译文不将其纳入正文。
    reason: 保留所提供英文见证的方括号提示，并使中文正文保持自然。
lexical_decisions:
- source_word: the Name
  choice: 那名
  rationale: 保留早期基督教语境中对神圣之名的含蓄指称及其定冠意味，不擅自补明为“耶稣的名”或“上帝的名”。
- source_word: perfected in Jesus Christ
  choice: 在耶稣基督里仍未达到完全
  rationale: 保留“在基督里”这一关系性表达，并以“达到完全”传达尚未完成的属灵成熟过程。
- source_word: school-fellows
  choice: 一同受教的同学
  rationale: 兼顾共同学习者的比喻和现代汉语的可懂性，避免译成带有现代校园色彩过强的单一称谓。
- source_word: contest
  choice: 竞赛
  rationale: 保留训练与竞技的连贯意象，不把它解释性收窄为争战。
- source_word: mind
  choice: 心意
  rationale: 可涵盖思想、意愿与旨意，避免分别译作“意志”或“教义”而过早消解原文张力。
- source_word: bishops
  choice: 主教
  rationale: 采用对早期教会职分 episcopoi 的通行中文名称，不在正文中预判其后世制度形态。
- source_word: our inseparable life
  choice: 我们不可分离的生命
  rationale: 保留基督既是“生命”又与信徒不可分离的紧密表达，不改写为较弱的“永远同在者”。
theological_decisions:
- issue: “那名”的具体所指
  choice: 保留“那名”这一含蓄称呼
  alternative: 译作“耶稣的名”或“上帝的名”
  rationale: 现有见证文本未明说所指；保留省略可避免替作者解决真实的指称含混。
- issue: 耶稣基督是“父的心意”
  choice: 按比喻直译为“父的心意”
  alternative: 解释为“完全彰显父的旨意”
  rationale: 直译保留强烈的基督论表述及其神学张力，不以释义取代正文。
- issue: 各地主教与基督心意的关系
  choice: 译为“与耶稣基督的心意和谐一致”
  alternative: 译为“拥有耶稣基督的思想”或“奉行耶稣基督的旨意”
  rationale: 与前句“和谐一致地奔跑”的主题相呼应，同时不把关系限定为认知拥有或制度服从。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留竞技、受教与和谐一致等原有意象。本稿依据所提供的公版英文见证拟定；希腊文中期修订本传统的直接核校尚待完成，因此对连接词、个别职分术语及句法关系持审慎态度。
