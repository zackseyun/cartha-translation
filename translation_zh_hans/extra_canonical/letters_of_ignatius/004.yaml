    然而，爱不容我对你们保持沉默；因此我敦促你们，要一同奔跑，与上帝的心意相合。因为耶稣基督——我们不可分离的生命——就是父的心意；同样，那些设立在地极各处的主教，也都在耶稣基督的心意中。'
