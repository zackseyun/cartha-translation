base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/020.yaml
  text: 'Hidden from the ruler of this world were Mary’s virginity, her giving birth, and also the Lord’s death—three mysteries to be proclaimed aloud—which were accomplished in the silence of God. How, then, were they revealed to the ages?


    A star shone forth in the heaven above all the stars. Its light was beyond description, and its strangeness caused amazement. All the other constellations, together with the sun and moon, formed a chorus around the star, but the star itself far outshone them all. There was bewilderment about where this strange appearance, so unlike the others, had come from.


    From that time on, every sorcery and every spell was dissolved. Ignorance of wickedness vanished, and the ancient kingdom was torn down when God appeared in human likeness unto the newness of everlasting life. What had been brought to completion in the counsels of God began to take effect. From then on, everything was thrown into turmoil because the abolition of death had begun.'
translation:
  language: zh_hans
  text: '马利亚的童贞、她的生子，以及主的死，都向这世界的统治者隐藏了；这三件要高声宣告的奥秘，是在上帝的静默中成就的。那么，它们怎样向诸世代显明呢？


    天上有一颗星显现，超乎众星；它的光不可言喻，它的新奇令人惊异。其余所有星宿连同太阳和月亮，都围着这颗星组成歌队；但这颗星自身的光辉远胜它们全都。于是，人们困惑不解：这与它们不同的新奇景象究竟从何而来？


    从那时起，一切巫术都被解除，一切邪恶的束缚都消失了；无知被除去，旧有的国度被毁坏了。当上帝以人的样式显现，带来永恒生命的更新时，那由上帝所预备妥当的事便开始实行。因此，万有都一同震动，因为废除死亡之事正在筹划。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'prince/ruler of this world (Greek witness commonly: ἄρχων τοῦ αἰῶνος τούτου)'
  choice: 这世界的统治者
  rationale: 保留其作为敌对属灵掌权者的称谓，同时不直接增译为“撒但”，以免消除原文表达空间。
- source_word: virginity
  choice: 童贞
  rationale: 采用庄重而通行的神学与历史文本用语，并保留所指状态。
- source_word: three mysteries to be cried aloud
  choice: 这三件奥秘本当大声宣扬
  rationale: 保留“奥秘”与“高声宣告”的张力；“本当”表达其应被公开传扬的性质。
- source_word: in the silence of God
  choice: 在上帝的静默中
  rationale: 按原有意象直译，不擅自解释为上帝隐秘的计划或无人知晓的过程。
- source_word: to the ages
  choice: 向历世历代
  rationale: 保留跨越时代、向诸世代显明的广泛含义。
- source_word: formed themselves into a chorus
  choice: 仿佛组成歌队
  rationale: 保存天体合成歌队的诗性图景；加“仿佛”使现代汉语自然，不将修辞误读为字面演唱。
- source_word: sorcery and spell
  choice: 邪术和符咒
  rationale: 分别呈现施行魔法与咒法手段，避免合并后损失原文的并列强调。
- source_word: ignorance of wickedness
  choice: 对邪恶的无知
  rationale: 保留原短语可能指不认识邪恶真相或由邪恶造成的无知这一语义张力，不在正文中单向定解。
- source_word: ancient kingdom
  choice: 古老的国度
  rationale: 不直接指定为撒但的国度，以保留原文未明说对象的含蓄性。
- source_word: abolition of death
  choice: 废除死亡
  rationale: 保留原文强烈的终末性表达，不弱化为“战胜死亡”。
theological_decisions:
- issue: “上帝以人的样式显现”的基督论措辞
  choice: 当上帝以人的样式显现
  alternative: 当上帝成为人显现
  rationale: “以人的样式”贴近所给见证文本，也避免把原句本身未明确展开的道成肉身表述改写得更具教义定义性。
- issue: “为永恒生命之更新”的句法关系
  choice: 为要带来永恒生命的更新
  alternative: 进入永恒生命的更新
  rationale: 所给英文见证中的“unto”关系较含混；正文采用较自然的目的表达，但不把它扩写为特定救恩次序。
- issue: 上帝旨意中已经成全之事“开始生效”
  choice: 那在上帝旨意中已经成全的事便开始实现
  alternative: 上帝计划中已经完成的事开始发挥效力
  rationale: 保留“已经成全”与“开始实现”之间刻意存在的时态张力，不将二者调和为单一时间点。
- issue: 末句万有震动与死亡被废除的关系
  choice: 万有都受到震动，因为废除死亡的工作已经开始
  alternative: 一切都陷入混乱，因为人着手废除死亡
  rationale: 保留宇宙性范围及被动/非人格化表达，避免凭空指定行动主体。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。段落和排比结构依照见证文本；保留“静默”“歌队”“古老的国度”“万有震动”等诗性及神学张力。由于直接希腊文校勘尚待完成，本稿为依据所提供公共领域英文见证、并参考其标示的常见希腊词形所作的暂定源文导向译稿；未添加脚注标记。
