    reason: 专名的源语言核验尚未完成，需向读者说明其暂定性质。
  - marker: b
    text: “基督”在所依据的英文见证中置于方括号内，表示这是文本补入或恢复，原始读法仍需根据希腊文手稿传统复核。
    reason: 保留供应材料标明的文本不确定性，避免把补文当成毫无争议的正文。
