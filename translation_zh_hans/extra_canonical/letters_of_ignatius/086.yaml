base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/086.yaml
  text: 'You did well to receive Philo and Rhaius Agathopus, who followed me in the cause of God, as ministers of [Christ] God. They also give thanks to the Lord for you, because you refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which you did not despise, neither were ashamed of them. Nor shall he who is perfect faithfulness, even Jesus Christ, be ashamed of you.'
translation:
  language: zh_hans
  text: '你们接待斐洛和莱乌斯·阿伽托普斯[a]，把这两位为上帝的事业随我同行的人当作〔基督〕上帝[b]的仆役，实在做得好。他们也为你们感谢主，因为你们在各方面都使他们舒畅。你们所做的一切，绝不会失去回报。


    我的灵为你们献上，我的锁链也是如此；你们没有轻看这些锁链，也没有以它们为耻。那位全然信实的，也绝不会以你们为耻——他就是耶稣基督。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “莱乌斯·阿伽托普斯”按所提供英文见证音译；希腊文原名的直接复核尚待完成。
    reason: 专名的源语言核验尚未完成，需向读者说明其暂定性质。
  - marker: b
    text: “基督”在所依据的英文见证中置于方括号内，表示这是文本补入或恢复，原始读法仍需根据希腊文手稿传统复核。
    reason: 保留供应材料标明的文本不确定性，避免把补文当成毫无争议的正文。
lexical_decisions:
- source_word: in the cause of God
  choice: 为上帝的事业
  rationale: 在希腊文复核尚未完成的情况下，依所提供的古译见证保留“为上帝之缘故／事业”的宽泛含义，不把它具体化为某项事工。
- source_word: ministers
  choice: 仆役
  rationale: 采用宽泛、庄重的服事用语，避免擅自赋予正式教职含义。
- source_word: refreshed
  choice: 使……舒畅
  rationale: 兼顾实际照料与身心振奋的含义，不缩窄为单纯款待。
- source_word: My spirit is devoted for you
  choice: 我的灵为你们献上
  rationale: 保留原见证中强烈而略显特殊的自我奉献表达，不解释成普通问候。
- source_word: perfect faithfulness
  choice: 全然信实的
  rationale: 将抽象性质自然地表达为对基督的称述，同时保留“信实”而不改作“信仰”。
theological_decisions:
- issue: “[Christ] God”的文本恢复与基督称谓
  choice: 〔基督〕上帝
  alternative: 上帝／基督的上帝／基督上帝
  rationale: 供应材料明确指出方括号是文本恢复标志，故在正文中保留补入信号，不擅自消除其文本不确定性；中文用六角括号标示补文。
- issue: “Nothing shall be lost to you”的含义
  choice: 你们所做的一切，绝不会失去回报
  alternative: 你们必不会有任何损失
  rationale: 上下文是在称许他们对同行者的接待；译文表达善行不会落空，但不进一步规定回报的性质或时间。
- issue: 末句主语的身份
  choice: 那位全然信实的……他就是耶稣基督
  alternative: 那位全然信实的耶稣基督
  rationale: 依见证将“耶稣基督”视为对前述主语的同位说明，清楚呈现而不增加额外教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书信体；“你们”保留复数受众，“锁链”保留殉道语境中的具体意象。由于直接希腊文审校尚未完成，本稿以所给公共领域英文见证为临时依据，并对专名及方括号补文作明确脚注提示。
