review_pass:
  verdict: revise
  source_fidelity: 需修订以更贴近所列中期希腊传统的句法和意象，并与英文见证一致。“在近处的人”应表达为“在场的人”；“涌流”并无相应的明确原文依据，不宜添加；“即使我到了你们那里”宜保留为假设性的“即使我亲自来到你们那里”。“大卫后裔”应明确修饰基督。方括号承接词的不确定性应继续以脚注标出，而不在正文断定其为原文。
  naturalness: 修订稿保持现代、庄重、可朗读的普通话。“我写信给你们时还活着，却渴望死亡”比“我还活着的时候写信给你们”更自然且保留原句并置。以“活着、说话的水”保留原文人格化，而不加入“涌流”。
  terminology: 保留“这世界的统治者”“上帝”“活水”“基督的肉”“大卫的后裔”“不朽坏的爱”等用语；不把“统治者”释作撒但，也不把活水释作圣灵。“会朽坏的食物”与“不朽坏的爱”形成清楚对应。“爱欲”虽可更贴近ἔρως的词面，但现代汉语易造成不必要的狭窄理解；正文采用“欲望”，并保留其被钉十字架的隐喻。
  issues:
  - severity: medium
    issue: “在近处的人”未准确、自然地表达τῶν παρόντων／英文“who are near”。
    rationale: 该表达所指是在场、当前在近旁的人；“你们中在近处的人”在汉语中不自然，且弱化“在场”的情境性。
  - severity: medium
    issue: “活水在我里面涌流、说话”加入“涌流”。
    rationale: 所给见证及对应希腊语仅表达“活着、说话的水在我里面”；“涌流”虽与活水常见联想相合，却是额外意象。
  - severity: low
    issue: “即使我到了你们那里”较弱地保留了原文的亲自来临和假设语气。
    rationale: 改为“即使我亲自来到你们那里”更清楚对应“when/if I myself am with you”。
  - severity: medium
    issue: “那出于大卫后裔的基督的肉”修饰关系不够清晰。
    rationale: 原意为“基督的肉；这位基督是大卫的后裔”。重组语序可避免读者误解为肉本身“出于后裔”。
  - severity: low
    issue: 脚注锚点后的正文缺少更自然的断句处理。
    rationale: 保留[a]作为编辑性提示是合宜的；将其紧贴“我写信给你们时……”并在脚注说明未把“因为”补入正文，可清楚呈现不确定性。
  revised_text: '这世界的统治者想要把我撕碎，败坏我向着上帝的心意。因此，你们在场的人中，不要有人帮助他；倒要站在我这一边，也就是站在上帝这一边。不要一面说耶稣基督，一面又贪恋这世界。不要让嫉妒在你们里面安家。


    即使我亲自来到你们那里，恳求你们，也不要听从我；倒要信从我写给你们的这些话。[a]我写信给你们时还活着，却渴望死亡。我的欲望已经被钉在十字架上；我里面没有贪恋物质的火，只有活着、说话的水在我里面，对我说：“到父那里来。”


    我不以会朽坏的食物为乐，也不以今生的享乐为乐。我渴望上帝的饼，就是基督的肉——这位基督是大卫的后裔；作为饮品，我渴望他的血，也就是不朽坏的爱。'
  revised_footnotes:
