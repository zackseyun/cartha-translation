    text: 此处的承接词在所据英文见证中以方括号标为补入；由于希腊原文复核尚待完成，译文不另补“因为”，仅保留脚注提示。
    reason: 保留底本所显示的编辑性不确定，并避免把可能的逻辑连接词当作确定原文。
  revision_rationale: 本次修订只处理可安全确定的表达和增译问题：以“在场的人”取代不自然的“在近处的人”，删除“涌流”，并优化“仍活着却渴望死亡”的对比。保留“统治者”的含蓄称谓、活水的未定所指、基督肉与血的具体措辞，以及“血／不朽坏的爱”的同位关系；不作教义性解释。
