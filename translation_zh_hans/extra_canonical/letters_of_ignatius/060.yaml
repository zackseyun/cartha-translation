    text: 此处的承接词在所据英文见证中以方括号标为补入。由于希腊原文的校勘复核尚待完成，译文不在正文补入“因为”，仅保留此提示。
    reason: 保留英文见证所显示的编辑性不确定，不把可能的逻辑连接词当作确定原文。
  revision_rationale: 修订主要消除无明确依据的“涌流”，改善“在场者”和假设性来访的表达，并厘清“基督是大卫的后裔”的修饰关系。其余关键意象及神学性措辞均维持原有的非释义处理：称谓不专名化，活水不作教义性等同，肉与血的具体措辞不弱化，血与“不朽坏的爱”的同位关系亦予保留。
