review_pass:
  verdict: revise
  source_fidelity: 总体忠实于所给英文见证，并大体保留了原文传统中的强烈意象与未明说的指涉。不过，“在近处的人”未能准确自然地表达见证所说的“who are near／在场者”，而“活水在我里面涌流”加入了“涌流”这一原文及英文见证均未明示的动作，应删去。
  naturalness: 文字庄重流畅，但“你们中在近处的人”不合现代汉语习惯；“我还活着的时候写信给你们”容易被理解为与死后写信作平行的时间限定，宜改为“我虽仍活着，却写信……”。
  terminology: “这世界的统治者”“上帝的饼”“基督的肉”“活水”及“不朽坏的爱”均可保留。“物质欲念”虽可理解，改为“属物质的欲望”更贴近英文见证的 material longing，且不预断其具体所指。
  issues:
  - severity: medium
    issue: “在近处的人”表达不准确且不自然
    rationale: 英文见证的 who are near 对应在场／临近者的限定；“在近处的人”在汉语中缺乏明确参照。改作“你们这些在场的人中”较明确，且不把该限定扩展为“亲近我的人”等解释。
  - severity: medium
    issue: “涌流”是额外加入的意象
    rationale: 所给见证仅说活水在作者里面、并且说话；未说其涌流。删去该词可避免增译，同时保留活水的人格化说话。
  - severity: low
    issue: “我还活着的时候写信”有不必要的时间歧义
    rationale: 见证强调作者仍在生命之中却渴慕死亡；“我虽仍活着，却写信给你们”更自然地保留这一对比。
  - severity: low
    issue: 大卫血统修饰语可稍作调整以避免句法黏连
    rationale: 将“出于大卫后裔的基督”改为“那位出于大卫后裔的基督”，可清楚表明该限定修饰基督，仍保留见证的血统表述。
  revised_text: '这世界的统治者想要把我撕碎，败坏我向着上帝的心意。因此，你们这些在场的人中，谁也不要帮助他；倒要站在我这一边，也就是站在上帝这一边。不要一面谈论耶稣基督，一面又贪恋这世界。不要让嫉妒在你们里面安家。


    即使我到了你们那里，亲自恳求你们，也不要听从我；倒要相信我写给你们的这些话。[a]我虽仍活着，却写信给你们，渴望死亡。我的欲望已经钉上了十字架；在我里面没有属物质的欲望之火，只有活水在我里面说话，对我说：“到父那里来。”


    我不以必朽坏的食物为乐，也不以今生的享受为乐。我渴望上帝的饼，就是那位出于大卫后裔的基督的肉；我所渴望的饮品，是他的血，也就是不朽坏的爱。'
  revised_footnotes:
