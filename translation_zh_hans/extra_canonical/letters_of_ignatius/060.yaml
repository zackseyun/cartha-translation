base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/060.yaml
  text: 'The ruler of this world wants to tear me to pieces and corrupt my mind toward God. Therefore, let none of you who are near help him. Instead, stand on my side—that is, on God’s side. Do not speak of Jesus Christ while also desiring the world. Do not let envy make its home in you.


    Even if I myself, when I am with you, should plead with you, do not obey me. Instead, believe what I am writing to you. [For] I write to you while still alive, yet longing for death. My desire has been crucified, and there is no fire of material longing in me. There is only living water, speaking within me and saying, “Come to the Father.”


    I take no delight in the food of corruption or in the pleasures of this life. I desire the bread of God, which is the flesh of Christ, who was from the seed of David; and as my drink I desire his blood, which is incorruptible love.'
translation:
  language: zh_hans
  text: '这世界的统治者想要把我撕碎，败坏我向着上帝的心意。因此，你们中在近处的人，谁也不要帮助他；倒要站在我这一边，也就是站在上帝这一边。不要一面谈论耶稣基督，一面又贪恋这世界。不要让嫉妒在你们里面安家。


    即使我到了你们那里，亲自恳求你们，也不要听从我；倒要相信我现在写给你们的这些话。[a]我还活着的时候写信给你们，却渴望死亡。我的欲望已经钉上了十字架；在我里面，也没有物质欲念的火，只有活水在我里面涌流、说话，对我说：“到父那里来。”


    我不以必朽坏的食物为乐，也不以今生的享受为乐。我渴望上帝的饼，就是那出于大卫后裔的基督的肉；我所渴望的饮品，是他的血，也就是不朽坏的爱。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处的承接词在所据英文见证中以方括号标为补入；由于希腊原文复核尚待完成，译文不另补“因为”，仅保留脚注提示。
    reason: 保留底本所显示的编辑性不确定，并避免把可能的逻辑连接词当作确定原文。
lexical_decisions:
- source_word: ὁ ἄρχων τοῦ αἰῶνος τούτου
  choice: 这世界的统治者
  rationale: 保留约翰传统中“这世界的统治者”这一称谓及其人格化意味，不直接释为“撒但”，以免消除原文的含蓄表达。
- source_word: τὴν εἰς θεόν μου γνώμην
  choice: 我向着上帝的心意
  rationale: “γνώμη”可涉及心思、意向或决意；此处采用较宽的“心意”，并保留“向着上帝”的方向性。
- source_word: κόσμον ἐπιθυμεῖτε
  choice: 贪恋这世界
  rationale: “ἐπιθυμέω”在此表示强烈欲求；“贪恋”自然地传达负面语境，又不把“世界”缩窄为财富或享乐。
- source_word: ὁ ἐμὸς ἔρως ἐσταύρωται
  choice: 我的欲望已经钉上了十字架
  rationale: “ἔρως”可指爱欲、热望或欲望。采用“欲望”保留其概括性，并直译“已经钉上了十字架”的强烈隐喻。
- source_word: ὕδωρ ζῶν καὶ λαλοῦν
  choice: 活水在我里面涌流、说话
  rationale: 保留“活水”及其人格化的“说话”；补入“涌流”使汉语自然，但不将其明确等同于圣灵。
- source_word: ἄρτον θεοῦ
  choice: 上帝的饼
  rationale: 直译并保留圣餐与约翰福音式语言可能形成的多重回响，不改写为一般性的“属灵食粮”。
- source_word: σάρκα Χριστοῦ
  choice: 基督的肉
  rationale: 采用具体的“肉”而非较抽象的“身体”，保留早期基督教文本对基督真实肉身的强调及原语的冲击力。
- source_word: ἀγάπη ἄφθαρτος
  choice: 不朽坏的爱
  rationale: “ἄφθαρτος”兼有不腐败、不毁坏、不朽坏之意；“不朽坏”与前文“必朽坏”形成对照。
theological_decisions:
- issue: “这世界的统治者”的身份
  choice: 保留称谓，不在正文中明说是撒但
  alternative: 译作“撒但”或“魔鬼”
  rationale: 原文使用称谓而非专名；保留表达可维护其经文互文和原有含蓄性。
- issue: “活水”的所指
  choice: 保留活水意象，不明确注释为圣灵
  alternative: 译作“圣灵如活水”
  rationale: 活水可能带有圣灵、内在神圣生命或殉道召唤等联想，但正文没有明说，故不替作者消除张力。
- issue: 基督的肉与血
  choice: 按原文具体表述为“基督的肉”和“他的血”
  alternative: 弱化为“基督所赐的生命”或纯象征性措辞
  rationale: 原文措辞具有鲜明的肉身与圣餐意味；翻译不预先裁定其礼仪或象征层面的确切关系。
- issue: “他的血，也就是不朽坏的爱”的关系
  choice: 用“也就是”保留同位解释
  alternative: 译作“他的血和不朽坏的爱”
  rationale: 见证文本将“血”与“不朽坏的爱”紧密同位；译文保留这一神学性等置，不拆成两个并列对象。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。鉴于所提供材料注明希腊原文复核尚待完成，本稿以中期校订本传统的信息和公共领域英文见证为依据，并参考英文POB作审校层；对关键希腊词的判断属暂定，出版前应据希腊校勘文本逐项核验。
