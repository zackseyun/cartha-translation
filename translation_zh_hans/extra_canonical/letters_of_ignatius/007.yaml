revisions:
- from: '人越看见自己的监督沉默少言，就越要敬畏他。因为家主差遣任何人管理自己的家，我们都应当接待那人，如同接待差他来的家主本人。因此，显然我们应当看待监督如同看待主自己。


    奥尼西慕本人极力称赞你们在上帝里面井然有序，因为你们众人都按真理生活，并且没有任何异端在你们中间安家；甚至若有人所讲的不是在真理中讲论耶稣基督，你们连听也不听。[a]'
  to: '人越看见监督沉默，就越要敬畏他。因为凡是家主所差来负责自己家务的人，我们都应当接待他，如同接待差遣他的人。因此，显然我们应当把监督看作主自己。


    奥尼西慕自发地极力称赞你们在上帝里面井然有序，因为你们众人都按真理生活，没有任何异端在你们中间安家；不但如此，除非那人是在真理中讲论耶稣基督，你们甚至不听任何人。'
  rationale: 修订删除未明示的“自己的”，将“沉默少言”还原为“沉默”，并准确译出αὐθαιρέτως的副词意义。家主与受差者的比喻仍予保留，但以现代汉语清楚表达其管家职责。末句采用与希腊条件结构及英语见证相符的自然汉语；不保留会削弱“在真理中”限定的脚注替代译法。
