  english_witness: 'And in proportion as a man seeth that his bishop is silent, let him fear him the more. For every one whom the Master of the household sendeth to be steward over His own house, we ought so to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praiseth your orderly conduct in God, for that ye all live according to truth, and that no heresy hath a home among you: nay, ye do not so much as listen to any one, if he speak of aught else save concerning Jesus Christ in truth.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/007.yaml
  text: 'And in proportion as anyone sees that his bishop is silent, let him fear him the more. For everyone whom the Master of the household sends to be steward over His own house, we ought to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praises your orderly conduct in God, for you all live according to truth, and no heresy has a home among you; indeed, you do not so much as listen to anyone if he speaks of anything other than Jesus Christ in truth.'
translation:
  language: zh_hans
  text: '人越看见监督沉默，就越要敬畏他。因为凡是家主所差来负责自己家务的人，我们都应当接待他，如同接待差遣他的人。因此，显然我们应当把监督看作主自己。


    奥尼西慕自发地极力称赞你们在上帝里面井然有序，因为你们众人都按真理生活，没有任何异端在你们中间安家；不但如此，除非那人是在真理中讲论耶稣基督，你们甚至不听任何人。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σιγῶντα
  choice: 沉默少言
  rationale: 兼顾“沉默”和“不多言”的语义，避免把监督的沉默解释成软弱、隐忍或某种特定的领导风格。
- source_word: φοβείσθω
  choice: 敬畏
  rationale: 保留原词既可含惧怕、也可含敬重的张力；现代汉语中“敬畏”比单纯“害怕”更适合此处对教会监督的态度，同时没有完全消除畏惧意味。
- source_word: οἰκοδεσπότης / οἰκονομίαν
  choice: 家主／管理自己的家
  rationale: 保留家庭治理的比喻关系；用自然现代汉语表达被差者承担管家的职责。
- source_word: ἐπίσκοπον
  choice: 监督
  rationale: 采用能反映其监督、看顾职分的通行译法，不预先套入后世某一宗派的职制称谓。
- source_word: προσβλέπειν
  choice: 看待
  rationale: 表达注目、重视和视为之意，中文自然且不额外添加“顺服”等原文未明说的内容。
- source_word: εὐταξίαν
  choice: 井然有序
  rationale: 传达秩序良好、行为端正的状态，并保留“在上帝里面”的属灵限定。
- source_word: αἵρεσις
  choice: 异端
  rationale: 在早期基督教语境中指偏离真理的派别或教训；采用中文读者熟悉的神学用语。
- source_word: κατοικεῖ
  choice: 安家
  rationale: 保留原文“居住”的形象性表达，而不弱化为“存在”。
theological_decisions:
- issue: 接待受差遣的监督与接待差遣者之间的类比
  choice: “如同接待差他来的家主本人”
  alternative: “如同接待差遣他的人”
  rationale: 明确代词所指并保留家主比喻，同时保持这是接待上的类比，不扩展为监督与主在本体上等同。
- issue: “看待监督如同看待主自己”的强烈表述
  choice: 直译保留
  alternative: 解释为“把监督看作主的代表”
  rationale: 原文措辞有意强烈；不以解释性译文减弱其张力，也不据此导入后世特定教会论。
- issue: 末句对听取他人言论的限制
  choice: 译为“不在真理中讲论耶稣基督”便不听
  alternative: “讲论耶稣基督以外的事”便不听
  rationale: 希腊语句法可理解为只听在真理中讲论耶稣基督的人；此译避免把句意绝对扩大为禁止聆听任何非基督主题，同时用脚注保留另一种可能读法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“监督”避免宗派化职衔，“敬畏”保留敬重与畏惧的双重色彩。正文按所提供的中篇希腊传统信息并参照可核对的希腊措辞拟定，但用户材料注明直接原文审查尚待完成，因此对末句歧义作脚注说明。
