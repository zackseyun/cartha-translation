review_pass:
  verdict: revise
  source_fidelity: 需修订。中编希腊文此处的对偶为“属肉体的／属灵的”（σαρκικοί／πνευματικοί），并未在这些词中明确使用“圣灵”；现稿将其固定为“属圣灵”过度限定。自我奉献句中的περίψημα含“弃渣”而引申为替人承担代价、作赎价一类的修辞，ἁγνίζω则是“洁净自己／使自己洁净”；现译“献上自己／分别为祭”未能清楚保留这两个不同动词的意义。
  naturalness: 整体庄重流畅。“在你们里面扎根”给“确立、盘踞”加入了原文未有的植物意象；“把自己分别为祭”在现代汉语中不够自然，且混合了洁净与献祭两个概念。修订后以“盘踞”“洁净自己”表达。
  terminology: “全然属于上帝”“属肉体”“属灵”“在耶稣基督里”均宜保留。“属圣灵”改为“属灵”，以避免把πνευματικός在本段的开放指向预先限定为圣灵。
  issues:
  - severity: medium
    issue: 将πνευματικοί及τὰ πνευματικά译为“属圣灵的人／属圣灵的事”
    rationale: 希腊文在此使用πνευματικός，虽与肉体相对且可具有圣灵相关含义，却没有明示“圣灵”。译作“属灵”更能保留原文的语义宽度及该段平行结构。
  - severity: medium
    issue: 自我奉献句未区分περίψημα与ἁγνίζω
    rationale: 前者带有“弃渣”及为人承担代价的修辞背景，后者意为洁净、使自己洁净。现有“献上自己／分别为祭”既弱化前者，也将后者过度祭祀化。
  - severity: low
    issue: “扎根”加入原文未明示的意象
    rationale: καθέζηται所表达的是坐定、停留或盘踞；“盘踞”较贴近其持续占据的意思。
