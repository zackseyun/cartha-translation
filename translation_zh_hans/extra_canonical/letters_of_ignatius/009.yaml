base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/009.yaml
  text: 'Therefore, let no one deceive you, just as indeed you are not deceived, since you belong wholly to God. For when no desire that has the power to torment you is established within you, then you truly live according to God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians, which is famous throughout all ages.


    Those who are of the flesh cannot do the things of the Spirit, nor can those who are of the Spirit do the things of the flesh, just as faith cannot do the things of unfaithfulness, nor unfaithfulness the things of faith. Indeed, even the things you do according to the flesh are spiritual, for you do everything in Jesus Christ.'
translation:
  language: zh_hans
  text: '所以，不要让任何人欺骗你们；正如你们确实没有受骗，因为你们全然属于上帝。若没有能折磨你们的欲望在你们里面盘踞，你们就真是照着上帝而活。我愿为你们付上代价，也为你们以弗所人的教会洁净自己[a]；这教会在万世间享有盛名。


    属肉体的人不能做属灵的事，属灵的人也不能做属肉体的事；正如信心不能做不信的事，不信也不能做信心的事。其实，即使你们按肉体所做的事也是属灵的，因为你们凡事都是在耶稣基督里做的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你们付上代价”所译的希腊词字面可指“弃渣”，在此类用法中可引申为为他人承担代价或作补偿；“洁净自己”是另一动词。两者都使用祭祀或洁净相关的修辞，但本句未明确界定其机制。
    reason: 保留περίψημα与ἁγνίζω两个不同用语的历史语义，避免将其固定解释为特定的赎罪理论或单一的献祭含义。
lexical_decisions:
- source_word: belong wholly to God
  choice: 全然属于上帝
  rationale: 保留归属与完全性的双重含义，表达自然庄重。
- source_word: lust / desire
  choice: 欲望
  rationale: 原始希腊文尚待直接复核；据现有见证采用较宽泛的“欲望”，不预先限定为性欲或某一种私欲。
- source_word: is established within you
  choice: 在你们里面扎根
  rationale: 用现代汉语自然表达一种欲望在内心确立并取得稳固地位。
- source_word: live according to God
  choice: 按着上帝而活
  rationale: 保留“以神为准则、与神相称”的开放含义，不改写成特定的成圣理论。
- source_word: things of the flesh / according to the flesh
  choice: 属肉体的事／按肉体所做的事
  rationale: 保留同一语义场，同时反映两种句法关系；不把“肉体”简单等同于身体或罪性。
- source_word: things of the Spirit / spiritual
  choice: 属圣灵的事／属灵的
  rationale: 上下文将肉体与Spirit对举，此处以“圣灵”明确所指；形容词则译作惯用的“属灵”。
- source_word: in Jesus Christ
  choice: 在耶稣基督里
  rationale: 保留早期基督教文本中“在基督里”的联合、领域或归属意涵，不将其缩减为“奉他的名”。
theological_decisions:
- issue: “肉体”与“圣灵”的对立
  choice: 保留“属肉体／属圣灵”的平行对照
  alternative: 解释为“罪恶的人／受圣灵引导的人”
  rationale: 原文的神学张力在于两种归属或领域的对照；解释性改写会过早限定其人论与伦理含义。
- issue: “按肉体所做的事也是属灵的”这一悖论
  choice: 直译并保留表面张力
  alternative: 改写为“即使日常身体行为也因动机正确而属灵”
  rationale: 作者随后只以“在耶稣基督里”说明，不宜补入关于动机、日常生活或圣礼的特定解释。
- issue: 自我奉献用语
  choice: 译为“献上自己／把自己分别为祭”，并加注说明不确定性
  alternative: 译为“我是你们的赎价”或“我为你们洁净自己”
  rationale: 该处可能带有祭献、洁净或代价性的修辞色彩；在未完成希腊文校核前，不宜确定为赎罪性陈述。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。保留早期基督教文本中“按着上帝而活”“属肉体／属圣灵”“在耶稣基督里”等关键表达及其张力。由于所提供的原始材料实际为公版英文见证，且注明希腊文复核尚待进行，本稿属于可出版格式的暂定译稿；尤其自我奉献句须在核对中编希腊文后再定。
