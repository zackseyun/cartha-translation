    text: 本段依据所提供的公版英文见证起草；希腊文原文尚待直接校勘。“每一封信”可能是修辞性的概括，不一定意指现存每一封保罗书信都明确提到以弗所人。
    reason: 透明标示源语言复核尚未完成，并保留末句在文本史与修辞层面的不确定性。
  revision_rationale: 修订聚焦于“为上帝而赴死者”的道路隐喻及其语态，使中文既可读又更接近希腊文和英文见证；同时将“心满意足”恢复为祈愿式表达，并微调对保罗的赞辞。保留“奥秘”的开放性和“抵达上帝”的方向性，不加入特定教派解释。
