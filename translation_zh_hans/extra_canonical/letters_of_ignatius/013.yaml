base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/013.yaml
  text: 'I know who I am and to whom I am writing. I am a condemned prisoner; you have received mercy. I am in danger; you are firmly established.


    You are the highway of those who are on their way to die unto God. You share in the mysteries with Paul, who was sanctified, who received a good testimony, and who is worthy of every congratulation. I would gladly be found following in his footsteps when I shall attain to God. In every letter, he makes mention of you in Christ Jesus.'
translation:
  language: zh_hans
  text: '我知道自己是谁，也知道我是在给谁写信。我是一个被定罪的囚犯，你们却蒙了怜悯；我身处险境，你们却根基稳固。


    你们是那些正在走向为上帝而死之人的大道。你们与保罗一同有分于奥秘；他已成圣，得了美好的见证，配受一切称许。我若能在到达上帝那里时，被发现正跟随他的脚踪，我就心满意足了。他在每一封信中，都在基督耶稣里提到你们。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段依据所提供的公版英文见证起草；希腊文原文尚待直接校勘。“每一封信”可能是修辞性的概括，不一定意指现存每一封保罗书信都明确提到以弗所人。
    reason: 透明标示源语言复核尚未完成，并保留末句在文本史与修辞层面的不确定性。
lexical_decisions:
- source_word: convict
  choice: 被定罪的囚犯
  rationale: 同时保留司法定罪与受囚身份，比单译“囚犯”更贴近见证文本的语气。
- source_word: established
  choice: 根基稳固
  rationale: 表达群体在信仰上坚立的状态，又不额外指定其教义或制度层面的含义。
- source_word: high-road
  choice: 大道
  rationale: 保留道路意象及其显著、通达之感，避免改写成纯抽象的“榜样”或“途径”。
- source_word: die unto God
  choice: 为上帝而死
  rationale: 保留死亡朝向或归于上帝的神学张力；在现有英文见证基础上采用自然汉语，未将其窄化为某一种殉道理论。
- source_word: associates in the mysteries
  choice: 一同有分于奥秘
  rationale: “有分于”保留共同参与之义；“奥秘”维持宗教语境中的开放含义，不擅自限定为圣礼。
- source_word: obtained a good report
  choice: 得了美好的见证
  rationale: 既可指获得良好评价，也保留信仰见证的语义回响。
- source_word: attain unto God
  choice: 到达上帝那里
  rationale: 保留伊格那丢关于最终抵达上帝的方向性表达，不将其解释性改写为“得救”或“进入天堂”。
theological_decisions:
- issue: “奥秘”是否特指圣礼
  choice: 保留泛指的“奥秘”
  alternative: 译作“圣礼”或“神圣仪式”
  rationale: 现有见证不足以将其唯一确定为制度化圣礼；保留原表达的广度与张力。
- issue: “为上帝而死”的含义
  choice: 保留死亡与上帝之间的目的／归属关系
  alternative: 明确译为“为信仰殉道”
  rationale: 上下文显然涉及赴死，但直接加入“殉道”会比现有源证据更明确，故不在正文中替作者完成解释。
- issue: “到达上帝那里”的末世含义
  choice: 采用方向性表达
  alternative: 译为“进入天堂”或“与上帝联合”
  rationale: 避免将开放的神学措辞归入某一特定末世论或神秘联合框架。
- issue: 保罗“在每一封信中”提到收信人
  choice: 按见证文本直译并加注说明其可能的修辞概括
  alternative: 改成“在他的书信中常常提到你们”
  rationale: 正文忠实保留绝对表达，同时借脚注避免读者误以为这是可逐封核验的现代文献统计判断。
translation_notes:
  register: 采用现代、庄重而易懂的书信体；保留“你们”与“我”的鲜明对照，以及“大道”“脚踪”等连续道路意象。因所给材料明确说明希腊文复核尚待进行，本稿属于以公版英文见证为基础的审慎出版草案。
