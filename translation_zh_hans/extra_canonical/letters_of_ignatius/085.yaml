    May all things therefore abound unto you in grace, for ye are worthy. Ye refreshed me in all things, and Jesus Christ shall refresh you. In my absence and in my presence ye cherished me. May God recompense you; for whose sake if ye endure all things, ye shall attain unto Him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/085.yaml
  text: 'From now on, it is reasonable for us to wake up and be sober-minded while we [still] have time to repent and turn to God. It is good to recognize God and the bishop. Whoever honors the bishop is honored by God; whoever does anything without the bishop’s knowledge serves the devil.


    Therefore, may all things abound to you in grace, for you are worthy. You refreshed me in every way, and Jesus Christ will refresh you. Both in my absence and in my presence, you cherished me. May God repay you; for whose sake, if you endure all things, you will attain to him.'
translation:
  language: zh_hans
  text: '从今以后，我们理当警醒自守；趁着还有悔改归向上帝的时间，就当如此。承认上帝，也承认主教，是好的。尊重主教的人，上帝也尊重他；背着主教做事的人，就是服事魔鬼。


    所以，愿各样恩典丰丰富富地临到你们，因为你们配得。你们在各方面都使我畅快，耶稣基督也必使你们畅快。无论我不在还是在你们那里，你们都关爱我。愿上帝报答你们；你们若为他的缘故忍受一切，就必归到他那里。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wake to soberness
  choice: 警醒自守
  rationale: 兼顾从沉睡中醒来与保持清醒、节制的双重意象，采用自然而庄重的现代汉语。
- source_word: recognize
  choice: 承认
  rationale: 保留其认可、尊重正当地位之意，避免译成单纯认知性的“认识”。
- source_word: bishop
  choice: 主教
  rationale: 对应早期基督教书信中监督者/主教的职分称谓；使用现代读者熟悉的通行译名。
- source_word: without the knowledge of the bishop
  choice: 背着主教做事
  rationale: 自然表达未经其知情或认可而行动；不扩大为必须得到正式许可。
- source_word: refreshed
  choice: 使……畅快
  rationale: 保留使人振奋、得安慰的含义，也维持前后同词呼应。
- source_word: attain unto Him
  choice: 归到他那里
  rationale: 表达最终达到上帝面前的方向性，同时避免擅自具体化为某套末世论术语。
theological_decisions:
- issue: 上帝与主教并列的“承认”
  choice: “承认上帝，也承认主教”
  alternative: “认识上帝和主教”
  rationale: 保留原句刻意并列所形成的张力，但不暗示二者地位相等。
- issue: 主教不知情与服事魔鬼的强烈对照
  choice: 保留直陈“就是服事魔鬼”
  alternative: 弱化为“是在帮助魔鬼”
  rationale: 见证文本措辞强烈，不应因现代教会制度观念而淡化。
- issue: “for whose sake”的先行词
  choice: 译为“为他的缘故”，指向紧邻的上帝
  alternative: 明确译作“为上帝的缘故”或理解为基督
  rationale: 代词所指存在一定解释空间，正文保留代词，不替作者消除可能的含混。
- issue: “attain unto Him”的终末含义
  choice: “归到他那里”
  alternative: “得着他”或“到达上帝那里”
  rationale: 保留与上帝相会/达到他的含义，不引入额外的救恩次序说明。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。鉴于直接希腊文审校尚待完成，本稿以所给公版英文见证为临时依据；不保留英文见证中仅表示译者补足的方括号，而以流畅中文表达“还有……时间”。
