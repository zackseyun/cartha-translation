review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实于所给英文见证，并大体反映该段希腊文的劝勉、主教职分及恩典语言。惟“各样恩典”将“万事……在恩典中丰盛”的句法关系改成恩典的种类；“归到他那里”较强地加入“归回”含义，宜修正。
  naturalness: 整体庄重通顺，符合现代标准汉语。“背着主教做事”较口语，并带有规避、瞒骗的特定语气；以“瞒着主教行事”更贴近原文“暗中／瞒着”的表达。
  terminology: “主教”“上帝”“魔鬼”均可。“尊重”用于上帝对人的回应，在汉语中略显不够庄严，改为“蒙上帝尊荣”可保留原文被动式及相应的“尊荣”语义。“你们都关爱我”可译为“你们都爱我”，更直接对应“cherished/loved”。
  issues:
  - severity: medium
    issue: “愿各样恩典丰丰富富地临到你们”改变了“万事”与“恩典”的关系。
    rationale: 见证文本为“May all things ... abound unto you in grace”，并非“愿各样恩典”本身丰盛；应保留“万事”及“在恩典中”的修饰关系。
  - severity: medium
    issue: “归到他那里”对“attain unto Him”加入了“归回”的意味。
    rationale: 原文的动词表示达到、得着；“归到”可暗示原先所属后返回，超过原句。译作“得着他”较为简洁且保留对象代词的含混。
  - severity: low
    issue: “背着主教做事”偏口语且语义略窄。
    rationale: 该表达自然，但容易主要理解为故意规避；“瞒着主教行事”更适合庄重书信体，也保留未经其知情而行的意思。
  - severity: low
    issue: “上帝也尊重他”语体及措辞不够贴合上下文的尊荣对应。
    rationale: 原句是“尊敬主教者为上帝所尊敬”的对应表达；“也必蒙上帝尊荣”较庄重，并保留被动关系。
  revised_text: '从今以后，我们理当醒来，保持清醒；趁着还有悔改、归向上帝的时间，就当如此。承认上帝，也承认主教，是好的。尊敬主教的人，也必蒙上帝尊荣；瞒着主教行事的人，就是服事魔鬼。


    所以，愿万事都在恩典中丰丰富富地临到你们，因为你们是配得的。你们在各方面都使我畅快，耶稣基督也必使你们畅快。无论我不在还是在你们那里，你们都爱我。愿上帝报答你们；你们若为他的缘故忍受一切，就必得着他。'
  revised_footnotes: []
  revision_rationale: 修订保留原段强烈的教会秩序劝勉及“他”的指代含混，不将其定为上帝或基督；同时恢复“万事……在恩典中”的关系，避免把“达到／得着他”解释为“归回”，并提升个别措辞的庄重度与语义准确性。未设置脚注，因为本段没有提供需要锚定的脚注标记；英文见证的方括号是其译者补足信号，中文以“还有……时间”自然表达即可。
