source:
  text: 'It is reasonable henceforth that we wake to soberness, while we have [still] time to repent and turn to God. It is good to recognize God and the bishop. He that honoreth the bishop is honored of God; he that doeth aught without the knowledge of the bishop rendereth service to the devil.


    May all things therefore abound unto you in grace, for ye are worthy. Ye refreshed me in all things, and Jesus Christ shall refresh you. In my absence and in my presence ye cherished me. May God recompense you; for whose sake if ye endure all things, ye shall attain unto Him.'
