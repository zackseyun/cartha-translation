review_pass:
  verdict: revise
  source_fidelity: 需要修订。首段应保留英文见证以方括号标示的“[also]”这一编辑性恢复，而非仅在脚注说明后从正文省去。第三段的“spirit”在此对应希腊文ψυχή（生命、性命），译为“灵”不够准确；结合ἀντίψυχον及英文见证的“offered up”，以“性命”为宜，同时不将其限定为某一种救赎或殉道理论。末句的“be found”宜保留“被发现／被认定”而非“被显明”。
  naturalness: 原稿整体庄重通顺。“愿你们在耶稣基督里平安”可用，但作为书信结语，“愿你们在耶稣基督里安好”更贴近“Fare ye well”。“长老团”比“众长老”更明确表达presbytery是一个群体，且不必暗示后世宗派制度。
  terminology: 保留“士每拿”“以弗所”“叙利亚”“主教”“长老团”“父”“耶稣基督”等通行且适合早期教会书信的用语。“如同顺服命令”不补出命令来自上帝，保留原文及英文见证的凝缩和歧义。
  issues:
  - severity: medium
    issue: 方括号中的编辑性补字未在正文保留
    rationale: 英文POB审校轨迹明确保留“[also]”。现稿将其删出正文，仅以脚注交代，未忠实反映所据见证的编辑标记。
  - severity: medium
    issue: “我的灵”为ψυχή的不准确对应
    rationale: 此处ψυχή通常指生命或性命；译作“灵”会将其与πνεῦμα意义混同，并削弱“为你们献上”的生命奉献意象。
  - severity: low
    issue: “被显明为无可指责”未准确保留“be found”
    rationale: “显明”侧重显露；原句的被动“被发现为／被认定为”更贴近祈愿在基督里蒙验察、被认定无瑕疵的语气。
  revised_text: '士每拿人和以弗所人的爱向你们问安。请在祷告中记念在叙利亚的教会；我[也]不配称为其中的一员，因为我是他们中最末后的。[a]


    愿你们在耶稣基督里安好。你们要顺服主教，如同顺服命令；也同样顺服长老团。你们每个人都要以专一的心彼此相爱。[b]


    我愿为你们献上自己的性命，不但现在如此，就是我将要到达上帝那里时也是如此。因为我仍在危险中；但父在耶稣基督里是信实的，必成全我和你们的祈求。愿我们得以在他里面被发现为无可指责。'
  revised_footnotes:
  - marker: a
    text: 方括号中的“也”对应所据英文见证的“[also]”，表示编辑性补入或恢复；其在文本中的地位仍须待希腊文见证进一步核对。
    reason: 保留英文POB审校轨迹中的方括号编辑标记，并说明其性质。
  - marker: b
    text: “长老团”指长老所组成的群体（presbytery），并非现代某一宗派的名称。
    reason: 说明早期教会职分术语，避免以后世宗派制度过度诠释。
  revision_rationale: 修订以中期本希腊文传统所见措辞及所提供英文见证为先：恢复正文的方括号补字；将ψυχή译为“性命”；以“被发现为”保留末句被动验察语气。职分用语仍保持历史性而不投射后世教会制度；“在他里面”的代词指向也维持原有歧义。
