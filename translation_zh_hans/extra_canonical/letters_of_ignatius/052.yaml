base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/052.yaml
  text: 'The love of the Smyrnaeans and Ephesians greets you. Remember in your prayers the church which is in Syria, whereof [also] I am not worthy to be called a member, being the very last of them.


    Farewell in Jesus Christ, submitting yourselves to the bishop as to the commandment, and likewise also to the presbytery; and each of you severally love one another with an undivided heart.


    My spirit is offered up for you, not only now, but also when I shall attain unto God. For I am still in peril; but the Father is faithful in Jesus Christ to fulfill my petition and yours. May we be found unblamable in Him.'
translation:
  language: zh_hans
  text: '士每拿人和以弗所人的爱向你们问安。请在祷告中记念叙利亚的教会；我不配称为其中的一员，因为我是他们当中最末后的。[a]


    愿你们在耶稣基督里平安。你们要顺服主教，如同顺服诫命，也要照样顺服众长老；你们各人都要以专一的心彼此相爱。[b]


    我的灵为你们献上，不但现在如此，就是我将要到达上帝那里时也是如此。因为我仍在危险中；但父在耶稣基督里是信实的，必成全我和你们的祈求。愿我们在他里面被显明为无可指责。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 部分见证或版本在“我不配”一语附近有相当于“也”的编辑性补字；本译文未将其写入正文。
    reason: 交代所据英文见证以方括号标出的编辑性恢复，同时避免在正文中制造不自然且未经希腊文复核的措辞。
  - marker: b
    text: “众长老”直指长老组成的群体，并非现代意义上的某个宗派名称。
    reason: 防止读者把早期教会职分用语误解为后世宗派称谓。
lexical_decisions:
- source_word: Smyrnaens and Ephesians
  choice: 士每拿人和以弗所人
  rationale: 采用现代中文基督教文献中通行的地名音译，并以“人”指当地信徒群体。
- source_word: bishop
  choice: 主教
  rationale: 对应早期教会职分的常用中文名称；不额外界定其后世宗派制度含义。
- source_word: presbytery
  choice: 众长老
  rationale: 该词指长老组成的群体；译作“众长老”比制度色彩较强的“长老会”更贴合此处。
- source_word: undivided heart
  choice: 专一的心
  rationale: 表达内心不分裂、真诚一致，且符合自然现代汉语。
- source_word: My spirit is offered up for you
  choice: 我的灵为你们献上
  rationale: 保留献祭式表达及其可能含有的殉道意味，不将其明确化为某一种解释。
- source_word: attain unto God
  choice: 到达上帝那里
  rationale: 保留“抵达、达到”的方向性和依纳爵书信中的神学张力，避免直接释为“殉道”或“去世”。
- source_word: unblamable
  choice: 无可指责
  rationale: 采用清楚而庄重的伦理及审判语汇。
theological_decisions:
- issue: “如同顺服诫命”中诫命与主教的关系
  choice: 顺服主教，如同顺服诫命
  alternative: 顺服主教，如同顺服上帝的命令
  rationale: 见证文本没有明说诫命的颁布者；保留较凝缩的比较结构，不补入“上帝的”。
- issue: “我的灵为你们献上”的性质
  choice: 保留献祭式隐喻
  alternative: 我愿为你们牺牲性命
  rationale: 原表达可能涉及代求、奉献及预期殉道等多重意涵，不宜只归结为舍命。
- issue: “在他里面”所指
  choice: 保留代词“他”
  alternative: 在耶稣基督里／在父里面
  rationale: 英文见证中的指代存在可感知的张力；在希腊文直接复核完成前，不擅自消除。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。由于所提供材料注明希腊文源语复核尚待完成，本稿以中期 recension 的公共领域英文见证为暂定依据，并把可能受源语核查影响的编辑补字、职分术语和代词指向审慎保留。
