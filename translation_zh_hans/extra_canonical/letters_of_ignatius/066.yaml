review_pass:
  verdict: revise
  source_fidelity: 整体保留了见证文本的劝诫、牧人—羊群、狼和赛跑意象，但“掳走”没有充分表达“lead captive（使人沦为俘虏／掳为俘虏）”；首句的“所以”与“既是”组合也稍弱化了原文“因此，作为……儿女”的劝勉结构。方括号内容已得到适当标记，且不应在希腊文直接复核前消除其不确定性。
  naturalness: 现代汉语总体通顺，但“牧人在哪里，你们就要像羊一样跟随到那里”中“跟随到那里”搭配不够自然，且未明确呈现羊跟随牧人的关系。改为“牧人在哪里，你们就要在那里跟随他，像羊跟随牧人一样”更清楚自然。
  terminology: “真理之光的儿女”“分裂”“错误的教导”“牧人”“豺狼”“上帝的赛程”均可接受，并避免了不必要的宗派化解释。“貌似可信”可更贴近specious的迷惑性而译为“外表诱人的”。“无处可乘”是自然的语境化表达，但“无处立足”更直接保留“find no place”的空间意象。
  issues:
  - severity: medium
    issue: “掳走”弱化了“lead captive”的奴役／俘虏意味。
    rationale: 英文见证不仅说狼把人带走，也说其使奔跑者成为俘虏；应译出“掳为俘虏”或相近表达。
  - severity: low
    issue: “跟随到那里”不符合现代汉语惯用搭配。
    rationale: 原句要求在牧人所在之处跟随，汉语宜明确为“在那里跟随他”，同时保留羊的比喻。
  - severity: low
    issue: “所以，你们既是”使原文“Therefore, as children …”的劝勉式称谓略显生硬。
    rationale: “因此，你们既作为……”更能体现“作为……儿女”的身份基础与随后的命令。
  revised_text: '因此，你们既作为真理之光的儿女[a]，就要躲避分裂和错误的教导；牧人在哪里，你们就要在那里跟随他，像羊跟随牧人一样。


    因为有许多外表诱人的豺狼，用有害的享乐把那些在上帝的赛程中奔跑的人掳为俘虏；但在你们同心合一之处，它们就无处立足。'
  revised_footnotes:
  - marker: a
    text: 所据英文见证在“光明”一语外加方括号；希腊文直接复核尚待完成。本译暂按“真理之光的儿女”处理。
    reason: 如实标明当前英文见证中方括号所反映的文本或编辑不确定性，并说明此处译文的暂定性质。
  revision_rationale: 修订仅处理可由所供英文见证安全确认的问题：以“掳为俘虏”补足lead captive的含义，调整牧人句的汉语搭配并保留其开放指向，以“外表诱人的”表达specious，并以“无处立足”较直接呈现find no place。保留“真理之光”的方括号脚注，未对其属格关系或希腊文异文作超出资料范围的断定。
