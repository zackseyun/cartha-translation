base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/066.yaml
  text: 'Therefore, as children [of the light] of truth, avoid division and false teachings. Where the shepherd is, follow him like sheep.


    For many persuasive wolves use harmful pleasures to take captive those running in God’s race. But where you are united, they will find no place.'
translation:
  language: zh_hans
  text: '所以，你们既是真理之光的儿女[a]，就要躲避分裂和错误的教导；牧人在哪里，你们就要像羊一样跟随到那里。


    因为有许多貌似可信的豺狼，用有害的享乐掳走那些在上帝的赛程中奔跑的人；但你们若同心合一，它们就无处可乘。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据英文见证在“光明”一语外加方括号；希腊文直接复核尚待完成。本译暂按“真理之光的儿女”处理。
    reason: 如实标明当前底本中方括号所显示的文本或编辑不确定性，并说明此稿的暂定性质。
lexical_decisions:
- source_word: children [of the light] of the truth
  choice: 真理之光的儿女
  rationale: 保留“光”“真理”和“儿女”的意象及其紧密关系，同时使现代汉语自然可读；方括号所反映的见证文本问题另以脚注说明。
- source_word: shun division
  choice: 躲避分裂
  rationale: “躲避”保留主动远离之意，“分裂”指群体内部的割裂，不弱化为一般争执。
- source_word: wrong doctrines
  choice: 错误的教导
  rationale: 采用普通读者易懂的宗教语体，既表达教导内容有误，也不额外引入特定教派术语。
- source_word: specious wolves
  choice: 貌似可信的豺狼
  rationale: “貌似可信”表达外表具有迷惑力，“豺狼”保留危险掠食者的比喻。
- source_word: baneful delights
  choice: 有害的享乐
  rationale: 同时保留诱人的愉悦性与其造成伤害的性质。
- source_word: the runners in God's race
  choice: 那些在上帝的赛程中奔跑的人
  rationale: 保留赛跑隐喻及其与上帝的关系，不把隐喻解释成某一套特定救恩阶段论。
- source_word: where ye are at one
  choice: 你们若同心合一
  rationale: 表达共同体团结一致的状态；用条件句顺应上下文的警戒语气。
- source_word: they will find no place
  choice: 它们就无处可乘
  rationale: 自然表达这些迷惑者在合一的群体中找不到可利用的空间，同时保留原句的排斥性结论。
theological_decisions:
- issue: “牧人”所指是否明确限定为某一职分或人物
  choice: 保留“牧人”，不在正文中明指具体身份
  alternative: 译作“监督”或明确解释为基督、主教等
  rationale: 所供见证文本本身仅用牧人意象；为避免导入宗派性的职分解释，保留其开放指向。
- issue: “上帝的赛程”是否解释为得救过程或教会使命
  choice: 保留赛跑比喻，不作教义化展开
  alternative: 译为“奔走信仰道路的人”或“追求得救的人”
  rationale: 直译性比喻能够保存原文的神学张力，避免把赛程单一定义为某一教义框架。
- issue: 豺狼的代词指称
  choice: 用“它们”延续动物比喻
  alternative: 用“他们”明确指假教师
  rationale: 见证文本以“狼”为喻，并未在此句直接解除比喻；保留动物代词可避免过早解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“同心合一”“无处可乘”等表达自然易懂，同时保留牧人、羊、豺狼和赛跑等核心意象。此稿依据所供公版英文见证起草；希腊文直接审校尚待完成，因此对首句属格关系及方括号内容采取审慎的暂定译法。
