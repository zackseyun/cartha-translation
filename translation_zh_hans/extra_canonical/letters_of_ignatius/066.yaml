review_pass:
  verdict: revise
  source_fidelity: 首句把英文见证中以方括号标示、位置又有歧义的“[of the light]”无标记地整合为“真理之光”，未充分保留其文本不确定性。末句“无处可乘”将“they will find no place”具体化为“没有可乘之机”，略增原文未明说的利用含义。
  naturalness: 整体庄重、通顺，但“牧人在哪里，你们就要像羊一样跟随到那里”在现代汉语中略显生硬，也把跟随牧人的动作转成跟随地点。
  terminology: “牧人”“羊”“豺狼”“上帝”“合一”均合宜。将“specious”译为“貌似可信”可理解，但“貌似有理”更贴近其表面合理、足以迷惑人的语气。
  issues:
  - severity: medium
    issue: 首句未在正文保留方括号所示的不确定成分
    rationale: 所据英文见证将“of the light”置于方括号内；仅在脚注说明而正文定译为“真理之光”，会掩盖该成分及其与“真理”的关系尚待直接核对。
  - severity: low
    issue: “跟随到那里”误将跟随对象偏向地点
    rationale: “where the shepherd is, there follow ye as sheep”核心命令是如羊跟随牧人；中文可明确为“就在那里像羊一样跟随他”，既保留地点框架，也保持跟随对象。
  - severity: low
    issue: “无处可乘”增添了利用漏洞的意味
    rationale: “find no place”较稳妥地说是找不到容身或立足之处；原文并未明确说他们寻找可趁之机。
  revised_text: '所以，你们既是真理的[光明]儿女[a]，就要躲避分裂和错误的教导；牧人在哪里，你们就在那里像羊一样跟随他。


    因为有许多貌似有理的豺狼，用有害的享乐掳走那些在上帝的赛程中奔跑的人；但你们若合而为一，它们就找不到容身之处。'
  revised_footnotes:
  - marker: a
    text: 所据英文见证作“children [of the light] of the truth”，其中“of the light”置于方括号内。希腊文直接复核尚待完成；本译暂以“真理的[光明]儿女”保留该方括号及其所反映的文本或编辑不确定性。
    reason: 在译文正文中保留见证文本的方括号，不预先判定“光明”是否属于原文，或其与“真理”的确切属格关系。
  revision_rationale: 修订以更透明的方式保存首句方括号所标示的文本不确定性；调整牧人句，使汉语自然且仍以牧人为跟随对象；并将末句改为“找不到容身之处”，避免把原文笼统的“place”解释为可资利用的破口。其余关键意象和不作宗派化界定的处理均予保留。
