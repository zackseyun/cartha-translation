base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/069.yaml
  text: 'My brethren, my heart completely overflows with love for you; and rejoicing beyond measure, I watch over your safety—yet not I, but Jesus Christ. Wearing his bonds, I am all the more afraid because I have not yet been perfected. But your prayer will perfect me [unto God], so that I may attain the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the apostles as the council of elders of the church.


    Yes, and we also love the prophets, because they too pointed to the Gospel in their preaching, set their hope on him, and awaited him. Having faith in him, they too were saved in the unity of Jesus Christ, as holy men worthy of all love and admiration, approved by Jesus Christ and numbered together in the Gospel of our common hope.'
translation:
  language: zh_hans
  text: '我的弟兄们，我的心满溢着对你们的爱；我欢喜得无以复加，也为你们的安稳警醒——其实不是我，而是耶稣基督。我戴着他的锁链，却因自己还未达到完全而越发敬畏。但你们的祷告必使我达到完全[a]，使我可以得着那蒙怜悯而承受的产业。我投奔福音，如同投奔耶稣的肉身；也投奔使徒，如同投奔教会的众长老。


    我们也爱众先知，因为他们在宣讲中也指向福音，仰望他，等候他。他们信靠他，也在耶稣基督的合一里得救。他们是圣洁的人，配受一切爱戴和赞叹，蒙耶稣基督认可，也被列在我们共同盼望的福音之中。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本见证在“达到完全”后作“归于上帝”或“对上帝而言”；所据英文见证以方括号标示这一读法。
    reason: 保留所据见证中的校勘/补入信号，并说明该短语的文本状态。
lexical_decisions:
- source_word: ἀδελφοί / brethren
  choice: 弟兄们
  rationale: 保留早期基督教书信中的亲属称谓及群体语气；此处英文见证为复数泛称。
- source_word: σωτηρία / safety
  choice: 安稳
  rationale: 上下文是依纳爵对收信群体属灵福祉的关切；“安稳”保留安全、福祉的宽泛含义，不把它径直限定为终末意义的“救恩”。
- source_word: δεσμοί / bonds
  choice: 锁链
  rationale: 指依纳爵因基督受囚的实际捆锁，同时保留其荣耀与敬畏并存的语气。
- source_word: τέλειος / perfected
  choice: 达到完全
  rationale: 保留尚未完成、尚未臻于完全的意义，避免具体断定所指是殉道、道德完全或终末成全。
- source_word: πρεσβυτέριον / presbytery
  choice: 众长老
  rationale: 表达由长老组成的集体，不采用易被现代宗派制度化理解的专门名词。
- source_word: προφῆται / prophets
  choice: 众先知
  rationale: 指旧约先知这一整体群体，采用现代中文教会和一般读者都易理解的称呼。
- source_word: ἑνότης / unity
  choice: 合一
  rationale: 保留与耶稣基督联合并处于其合一中的措辞，不扩展为某一特定教会论解释。
theological_decisions:
- issue: “yet not I, but Jesus Christ”的施事关系
  choice: “其实不是我，而是耶稣基督”
  alternative: “不是我在看顾，而是耶稣基督在看顾”
  rationale: 保留原句简洁而略带省略的对照，不额外补足耶稣具体如何行动。
- issue: “your prayer will make me perfect”所指的完全
  choice: “你们的祷告必使我达到完全”
  alternative: “你们的祷告必使我完成殉道”
  rationale: 不把“完全”单一定义为殉道，保留属灵成熟、忠信到底与最终成全之间的张力。
- issue: 福音作为“耶稣的肉身”的比喻
  choice: 直译为“投奔福音，如同投奔耶稣的肉身”
  alternative: 释义为“紧紧依靠记载耶稣生平的福音”
  rationale: 保留依纳爵鲜明而神学含义丰富的比喻，不把“肉身”消解为福音书中的生平记载。
- issue: 众先知“在耶稣基督的合一里得救”
  choice: 保留为“也在耶稣基督的合一里得救”
  alternative: “因与耶稣基督联合而得救”
  rationale: 前者更贴近见证文本的结构，并避免将“合一”完全解释成一种特定的救恩论术语。
- issue: “numbered together in the Gospel”
  choice: “被列在我们共同盼望的福音之中”
  alternative: “与我们一同归入福音”
  rationale: 保留“列入/数算”这一被动意象以及与福音的关系；不明确添加“与我们”，因英文见证的 together 具体关联范围仍可能有歧义。
translation_notes:
  register: 采用现代、庄重而可诵读的简体中文。鉴于所提供材料注明希腊文复核尚待完成，本稿以公共领域英文见证及经审校的英文 POB 为临时依据，谨慎保留关键比喻和神学歧义。段落结构依原见证分为两段；脚注标记已置于正文相应位置。
