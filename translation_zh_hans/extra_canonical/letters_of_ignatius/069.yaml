review_pass:
  verdict: revise
  source_fidelity: 需修订。“wearing whose bonds”指身负基督的锁链；“afraid”应保留为惧怕，不宜译作“敬畏”。“wherein I have found mercy”应明确修饰“产业”。末句“taking refuge”分别以福音／使徒为对象，并以耶稣的肉身／教会的长老团作对应比拟，宜使句法关系更清楚。
  naturalness: 原稿整体庄重流畅，但“我戴着他的锁链”在现代中文中略显生硬，“投奔……如同投奔……”重复且使原文的对应结构不够清晰。改为“身带他的锁链”及“以……为避难所”更自然。
  terminology: “弟兄们”“安稳”“达到完全”“众先知”“合一”均可保留。“πρεσβυτέριον”在这里是集体名词，译为“长老团”比“众长老”更准确，且不预设特定现代宗派制度。
  issues:
  - severity: medium
    issue: “afraid”译作“敬畏”
    rationale: 英文见证明确为“afraid”，此处与尚未达到完全相连；“敬畏”改变了情感色彩。应译为“惧怕”。
  - severity: medium
    issue: “inheritance wherein I have found mercy”的关系未充分呈现
    rationale: “蒙怜悯”应与“产业”所在的关系相连，而非笼统成为承受产业的方式。
  - severity: medium
    issue: 福音／使徒及其比拟对象的句法关系不够清晰
    rationale: 应保留“以福音为避难所，如同以耶稣的肉身为避难所；以使徒为避难所，如同以教会的长老团为避难所”的平行结构。
  - severity: low
    issue: 脚注将方括号读法表述为“有些文本见证”
    rationale: 所提供材料只能确定英文见证以方括号标示该语，未提供足以说明具体文本见证分布的资料；脚注应避免超出证据的断言。
  revised_text: '我的弟兄们，我的心满溢着对你们的爱；我欢喜得无以复加，也为你们的安稳警醒——然而不是我，而是耶稣基督。我身带他的锁链，反而更加惧怕，因为我还没有达到完全。


    但你们的祷告必使我达到完全[a]，使我得以达到那我在其中蒙怜悯的产业；我以福音为避难所，如同以耶稣的肉身为避难所；也以使徒为避难所，如同以教会的长老团为避难所。


    是的，我们也爱众先知，因为他们也在宣讲中指向福音，把盼望寄托在他身上，并等候他。他们既信靠他，也在耶稣基督的合一里得救；他们是圣洁的人，配受一切爱戴和赞叹，蒙耶稣基督认可，并被列在我们共同盼望的福音之中。'
  revised_footnotes:
  - marker: a
    text: 所据英文见证在“达到完全”后以方括号标出“归于上帝”（unto God）一语。
    reason: 保留英文见证的方括号提示，同时不在缺乏进一步校勘资料时断言具体的文本见证分布。
  revision_rationale: 修订保留原文及英文见证的省略、比喻和神学开放性，不将“完全”限定为殉道或其他单一解释。改正“惧怕”的语义，明确“蒙怜悯”与“产业”的关系，并重建福音／使徒两组平行的“避难所”比拟。因中文段落表达需要，将英文见证第一段的长句分作两段，未改变内容或论述次序。
