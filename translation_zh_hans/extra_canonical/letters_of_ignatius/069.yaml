review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了两段结构、对基督的捆锁、尚未完全、先知指向并等候基督，以及“福音／耶稣的肉身”和“使徒／教会的长老团”这两组刻意鲜明的比喻。不过，“我投奔福音，如同投奔耶稣的肉身；也投奔使徒，如同投奔教会的众长老”把原文的两个“以……为避难所，如同……”改造成两次比较性的“投奔”，关系不够准确；“在其中我蒙了怜悯的产业”也不宜改写为“蒙怜悯而承受的产业”。“afraid”应译为“惧怕”，不宜提升为“敬畏”。
  naturalness: 原稿整体庄重可读，但“我欢喜得无以复加，也为你们的安稳警醒——其实不是我，而是耶稣基督”中施事对照略显悬置；补出“看顾你们安稳的”可使现代中文自然，同时不规定基督具体行动方式。修订后的“以……为避难所，视之如……”既保留原文突兀而有意的类比，也较符合中文句法。
  terminology: 保留“弟兄们”“锁链”“达到完全”“长老团”“众先知”“合一”等用语。“长老团”比“众长老”更明确表达πρεσβυτέριον的集体性，且不必诉诸特定宗派制度。“在上帝面前达到完全”谨慎表达见证中方括号标示的“unto God”，脚注仍保留其校勘／补入状态。
  issues:
  - severity: medium
    issue: “戴着他的锁链，却因……越发敬畏”
    rationale: 见证的“wearing whose bonds ... I am the more afraid”表达在基督的捆锁中反而更惧怕自己尚未完全；“敬畏”改变了“afraid”的对象和情感色彩。
  - severity: high
    issue: “我投奔福音，如同投奔耶稣的肉身；也投奔使徒，如同投奔教会的众长老”
    rationale: 原句的结构是“以福音为避难所，如同〔以〕耶稣的肉身；以使徒为避难所，如同〔以〕教会的长老团”。草稿的重复“投奔”使“如同”后的名词成为另一投奔对象，弱化了原有的对应／认定关系。
  - severity: medium
    issue: “那蒙怜悯而承受的产业”
    rationale: “wherein I have found mercy”修饰“inheritance”，即“那我在其中蒙怜悯的产业”；草稿可被理解为产业本身蒙怜悯，或把怜悯与承受合并为新的因果关系。
  - severity: low
    issue: “其实不是我，而是耶稣基督”
    rationale: 中文中缺少承接对象，读者不易确定否定的是何一动作。补出“看顾你们安稳的”是必要的语法澄清，不增加神学解释。
  revised_text: '我的弟兄们，我的心满溢着对你们的爱；我欢喜得无以复加，并为你们的安稳警醒。看顾你们安稳的不是我，而是耶稣基督。我戴着他的锁链，反而更加惧怕，因为我还没有达到完全。但你们的祷告必使我在上帝面前达到完全[a]，使我得以达到那我在其中蒙怜悯的产业；我以福音为避难所，视之如耶稣的肉身；又以使徒为避难所，视之如教会的长老团。


    我们也爱众先知，因为他们也在宣讲中指向福音，把盼望寄托于他，并等候他。他们既信靠他，也就在耶稣基督的合一里得救；他们是圣洁的人，配受一切爱戴和赞叹，蒙耶稣基督认可，并一同被列在我们共同盼望的福音之中。'
  revised_footnotes:
  - marker: a
    text: 所据英文见证在“达到完全”后以方括号标示“归于上帝／在上帝面前”（unto God）这一短语；此处保留该补入或校勘信号。
    reason: 保留英文见证的方括号及其所显示的文本状态，同时以自然中文表达该短语。
  revision_rationale: 修订纠正了“惧怕”的语义、产业从句的修饰关系，以及“福音如耶稣的肉身／使徒如教会的长老团”的平行比喻；并将“not I, but Jesus Christ”的省略在中文中作最低限度补足。未将“达到完全”限定为殉道或某一教义性过程，也未界定“合一”或“被列在福音中”的具体神学含义。
