base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/034.yaml
  text: I say these things, my dearly loved ones, not because I have learned that any of you think this way. Rather, since I am less than any of you, I want you to be on your guard in good time, so that you do not fall into the snares of empty teaching. Instead, be fully convinced about the birth, the suffering, and the resurrection, which took place during the governorship of Pontius Pilate. For these things were truly and certainly done by Jesus Christ, our hope. May none of you be turned away from this hope.
translation:
  language: zh_hans
  text: 我亲爱的弟兄姊妹，我说这些话，并不是因为我得知你们中有人抱持这种想法；而是因为我自觉比你们中任何一人都卑微，所以预先警戒你们，免得你们落入虚荣的网罗。你们却要对耶稣基督的降生、受难和复活确信不疑；这复活发生在本丢·彼拉多任总督期间。这些事确实无误地由耶稣基督——我们的盼望——成就。愿你们中没有一人偏离这盼望。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: my dearly beloved
  choice: 我亲爱的弟兄姊妹
  rationale: 以现代中文教会书信中自然且亲切的群体称呼表达复数受众；“弟兄姊妹”在英文见证中属语境性明示，并非性别限定。
- source_word: being less than any of you
  choice: 我既比你们任何人都微小
  rationale: 保留作者自谦的比较结构，不将其改写为较弱的客套语。
- source_word: vain doctrine
  choice: 虚妄教导
  rationale: “虚妄”兼具空洞、不真实和误导之意；“教导”比现代汉语中的“教义”更贴近日常表达，也避免预先赋予系统神学含义。
- source_word: the birth and the passion and the resurrection
  choice: 主的降生、受难和复活
  rationale: “受难”准确传达基督的苦难与死亡语境；补出“主的”以使中文所指清楚，同时不改变三项事件的并列。
- source_word: our hope
  choice: 我们的盼望
  rationale: 保留把耶稣基督直接称为“盼望”的神学表达，不弱化为“我们所盼望的那一位”。
- source_word: be turned aside
  choice: 偏离
  rationale: 保持离开这盼望或信仰道路的动态意象，同时避免把其具体化为某种后世宗派意义的“背道”。
theological_decisions:
- issue: 降生、受难和复活的历史真实性
  choice: “发生在本丢·彼拉多任总督期间，确实而无疑……成就”
  alternative: 将彼拉多的时间限定仅联系于“受难”
  rationale: 所给英文见证在语法上把三件事整体与彼拉多任内相连；译文保留这种表述及其可能的时间张力，不擅自重组。
- issue: “由耶稣基督成就”的施事关系
  choice: 是由我们的盼望耶稣基督成就的
  alternative: 发生在我们的盼望耶稣基督身上
  rationale: 忠实反映当前英文见证的“done by Jesus Christ”，同时用脚注提示源语言复核尚待完成，不以推测替代现有证据。
- issue: “这盼望”的指向
  choice: 愿你们没有一人偏离这盼望
  alternative: 愿你们没有一人离开耶稣基督
  rationale: 保留原文从“耶稣基督，我们的盼望”到“这盼望”的回指和修辞张力。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语，保留早期基督徒书信的劝勉语气与作者的自谦。句式适度拆分以便普通读者理解，但维持“不是……相反……；却要……”的论证推进。因当前仅有公版英文见证而未完成希腊文直审，本稿属于可出版格式的暂定译稿，并以脚注明示证据限制。
