base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/017.yaml
  text: 'Do not be deceived, my brethren. Those who corrupt households will not inherit the kingdom of God.


    If those who do such things according to the flesh are put to death, how much more if a man, through evil teaching, corrupts the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, will go into the unquenchable fire; and likewise also the one who listens to him.'
translation:
  language: zh_hans
  text: '我的弟兄们，不要受骗。败坏人家室的人，不能承受上帝的国。


    既然那些按肉体行这类事的人尚且要被处死，那么，人若用邪恶的教导败坏上帝的信仰——耶稣基督正是为这信仰被钉十字架的——岂不更要受罚吗？这样的人玷污了自己，必进入那不能熄灭的火；听从他的人也同样如此。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本译文依据所提供的公共领域英文见证拟定；希腊文中期修订本传统的直接复核尚待完成。因此，“败坏人家室”“上帝的信仰”等措辞暂保留见证文本中的语义张力。
    reason: 资料明确说明源语言复核尚未完成；脚注向读者透明交代文本基础及关键未决之处。
lexical_decisions:
- source_word: Corrupters of houses
  choice: 败坏人家室的人
  rationale: 保留“house/household”所指的家庭或家室范围，也保留“败坏”可能涉及道德破坏而不只一般扰乱的力度。
- source_word: inherit the kingdom of God
  choice: 承受上帝的国
  rationale: 采用早期基督教文献与圣经语境中自然且较正式的固定表达，保留“继承、得为产业”的意象。
- source_word: after the flesh
  choice: 按肉体行
  rationale: 保留“肉体”这一具有神学张力的措辞，不擅自限定为某一种具体罪行。
- source_word: evil doctrine
  choice: 邪恶的教导
  rationale: 用现代汉语清楚表达有害或错误的教训，同时避免使用带后世宗派裁断色彩的专门术语。
- source_word: the faith of God
  choice: 上帝的信仰
  rationale: 尽量保留属格结构可能表示源于上帝、属于上帝或以他为对象的含混性，不改写为单一解释。
- source_word: unquenchable fire
  choice: 不能熄灭的火
  rationale: 直译其持续不可扑灭的性质，保持审判意象。
- source_word: hearkeneth unto him
  choice: 听从他的人
  rationale: “听从”同时包含聆听、接受并顺从其教导，比单纯“听见”更符合见证文本的语气。
theological_decisions:
- issue: “上帝的信仰”中属格关系的解释
  choice: 保留“上帝的信仰”
  alternative: 上帝所赐的信仰／对上帝的信仰
  rationale: 现有材料仅为英文公共领域见证，且希腊文复核尚未完成；不宜预先把属格明确为来源属格或对象属格。
- issue: “耶稣基督为之被钉十字架”的关系对象
  choice: 明确让“这信仰”作为关系对象，同时用破折号维持原句结构
  alternative: 译作“耶稣基督正是为了使人有这信仰而被钉十字架”
  rationale: 后者会加入目的性解释；现译保留原见证中“for which”的简约与张力。
- issue: “按肉体行这类事”所指罪行
  choice: 不具体化
  alternative: 解释为奸淫、破坏婚姻或其他身体罪行
  rationale: 上下文可能暗示具体伦理行为，但所给段落不足以无争议地确定，故不将解释写入正文。
- issue: 听从邪恶教师者的结局
  choice: 译为“也同样如此”
  alternative: 明确补写“也必进入不能熄灭的火”
  rationale: 保留原文省略式的平行表达，同时使现代读者能够自然理解其所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我的弟兄们”保留早期书信的亲切劝诫语气；第二段以“尚且……那么……岂不……”重现递进论证。避免古奥词汇和宗派化术语。
