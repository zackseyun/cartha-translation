review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实于所提供的英文见证，并保留了有关“肉体”和“上帝的信仰”的解释空间。但“更要受罚吗”将原文递进比较改成了明确的问句，并把未明说的后果概括为“受罚”；“上帝的信仰”在现代汉语中易被理解为“上帝自己所持有的信念”，不宜作为保留属格歧义的表达。
  naturalness: “败坏人家室的人”和“按肉体行这类事”较为生硬。“败坏家庭的人”及“行这些属肉体之事的人”更符合现代庄重书面语，同时不把所指行为具体化。
  terminology: “承受上帝的国”“被钉十字架”“不能熄灭的火”均恰当。将“上帝的信仰”改为“属于上帝的信仰”，可维持原属格的开放性，并避免不自然的汉语歧义。
  issues:
  - severity: medium
    issue: “上帝的信仰”在汉语中指向不清且不自然。
    rationale: 该措辞通常会被读作“上帝所相信的内容”，而不是保留“faith of God”的属格关系；“属于上帝的信仰”较能维持原见证文本的语义开放性。
  - severity: medium
    issue: “岂不更要受罚吗？”增添问句形式和概括性的“受罚”。
    rationale: 英文见证以“how much more”作递进比较，随后直接陈述其进入不能熄灭之火；译为“何况……”可更贴近其论证和句法，避免预先概括其结局。
  - severity: low
    issue: “败坏人家室的人”“按肉体行这类事”不够符合现代汉语。
    rationale: 前者搭配生硬，后者的“按肉体行”不自然。修订后仍保留家庭／家室及“肉体”的语义张力。
  revised_text: '我的弟兄们，不要受迷惑。败坏家庭的人不能承受上帝的国。


    既然行这些属肉体之事的人要被处死，何况有人借着邪恶的教导，败坏属于上帝的信仰——耶稣基督正是为这信仰被钉十字架的。这样的人玷污了自己，必进入那不能熄灭的火；听从他的人也同样如此。[a]'
  revised_footnotes:
  - marker: a
    text: 本译文依据所提供的公共领域英文见证拟定；希腊文中期修订本传统的直接复核尚待完成。“败坏家庭”“属肉体之事”及“属于上帝的信仰”均尽量保留见证文本的语义范围；尤其“属于上帝的信仰”未预先断定其属格关系是来源、归属还是对象。
    reason: 说明译文的暂定文本基础，并交代关键措辞仍保留的语义开放性。
  revision_rationale: 修订以所给英文见证为直接审校基准，并在不预断尚待复核之希腊文细节的前提下改善现代汉语表达。“何况”保留原文递进而不添加问句或笼统惩罚用语；“属于上帝的信仰”比“上帝的信仰”更自然，也更能避免把含混属格错误限定为上帝自身的信念。
