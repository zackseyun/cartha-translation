base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/051.yaml
  text: 'I greet you from Smyrna, together with the churches of God that are here with me—people who refreshed me in every way, both in body and in spirit.


    My chains, which I carry for Jesus Christ’s sake, urge you, as I plead that I may reach God: remain united in harmony and in prayer with one another. For each of you, and especially the presbyters, ought to encourage the soul of your bishop, to the honor of the Father [and to the honor] of Jesus Christ and of the apostles.


    I pray that you will listen to me in love, so that, by writing this, I may not become a witness against you. And you also must pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I am eager to attain and may not be found rejected.'
translation:
  language: zh_hans
  text: '我从士每拿向你们问安；与我同在的上帝众教会也向你们问安。他们在各方面使我振奋，无论身体还是心灵。


    我为耶稣基督的缘故随身带着的锁链劝勉你们；我也恳求，使我可以到达上帝那里。你们要持守彼此间的和睦，同心祷告。你们每一个人，尤其是长老们，都理当使你们主教的心振奋，以此尊荣父、[也尊荣]耶稣基督和众使徒。[a]


    我祈求你们在爱中听从我，免得我因写了这些话而成为指证你们的人。你们也要为我祷告；在上帝的怜悯中，我需要你们的爱，好使我可以蒙准得到那份我切望达到的归宿，不至于被判为不合格。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号中的“也尊荣”依所据英文见证保留，表示这里有补足或文本上的不确定性；希腊文仍待直接校勘。
    reason: 如实呈现底本见证的恢复标记，并说明当前草案的来源限制。
  - marker: b
    text: “被判为不合格”也可理解为“经检验后被弃绝”；此处可能带有竞赛资格或受审判的意象。
    reason: 说明该词的语义范围，避免读者把它误解为特定宗派的神学术语。
lexical_decisions:
- source_word: refreshed me
  choice: 使我振奋
  rationale: 兼顾身体与心灵两个层面，保留扶助、舒畅和鼓舞的语义，而不把含义缩窄为物质供给。
- source_word: bonds
  choice: 锁链
  rationale: 在殉道语境中保留具体的囚禁意象，也符合伊格那丢书信的惯用表达。
- source_word: attain unto God
  choice: 到达上帝那里
  rationale: 保留原见证中强烈而含蓄的终极指向，不擅自释为殉道、死亡或得救。
- source_word: presbyters
  choice: 长老们
  rationale: 采用现代中文基督教文献中通行且较中性的职分名称。
- source_word: bishop
  choice: 主教
  rationale: 对应早期教会单数监督职分的传统中文称谓，并与复数长老相区分。
- source_word: the lot
  choice: 那份……归宿
  rationale: “份”保留所得之分或命定份额的意象，“归宿”使现代读者能理解其所切望达到的终点，同时不明确限定为死亡或天国。
- source_word: reprobate
  choice: 被判为不合格
  rationale: 保留受检验后遭否决的法庭或竞赛色彩，避免使用带有后世预定论色彩的术语。
theological_decisions:
- issue: “到达上帝那里”的含义
  choice: 直译为“到达上帝那里”
  alternative: “藉殉道回到上帝那里”
  rationale: 文本本身把殉道愿望与到达上帝联系起来，却没有在本句完全展开；译文保留这种神学张力。
- issue: 尊荣对象中方括号内容
  choice: 正文保留“[也尊荣]”
  alternative: 无方括号地译作“尊荣父、耶稣基督和众使徒”
  rationale: 所给见证以方括号标示补足或文本不确定性，出版草案应让读者看见这一点，而不是无声抹平。
- issue: “成为指证你们的人”
  choice: 保留审判性见证的表述
  alternative: “免得这封信证明你们有错”
  rationale: 原句让写信者本人因其劝告而成为见证者，保留其人称和警诫力度。
- issue: “那份归宿”是否明确等同殉道
  choice: 不明确等同
  alternative: “蒙准获得殉道者的福分”
  rationale: 上下文高度暗示殉道，但原有措辞仍具含蓄性，不宜把解释写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留早期基督教书信的劝勉语气。“上帝”依项目现代普通话风格使用；“士每拿、长老、主教、使徒”等采用通行历史与教会术语。本稿受限于所给公版英文见证，希腊文原文尚待直接复核，因此对方括号补足及若干关键词保留谨慎措辞。
