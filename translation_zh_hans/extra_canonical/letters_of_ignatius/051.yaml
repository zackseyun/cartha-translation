review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实保留了书信的劝勉、祷告和受囚意象，也恰当地没有把“到达上帝那里”或“那一份”直接释作殉道。不过首句将“众教会”直接作为“使我振奋”的施事，与英文见证中紧随其后的“人们”不完全相合；末句把“the lot”译为“归宿”则加入了原文未明说的终点意味。
  naturalness: 整体庄重、易懂，符合现代标准汉语。首句“与我同在的上帝众教会”语序略显生硬，且“他们”回指“众教会”会造成教会而非在场之人的歧义。将其改为“与我在一起的、属于上帝众教会的人们”更自然清楚。
  terminology: “士每拿”“上帝”“长老”“主教”“使徒”均可接受；“锁链”也准确。“被判为不合格”可表达受检验遭否决，但“被弃绝”更贴近英文见证的 reprobate/rejected，并可在注释交代其检验意象，避免把术语固定为后世教义用法。
  issues:
  - severity: medium
    issue: 首句“他们”对“上帝众教会”的回指不清
    rationale: 英文见证在“与我同在的上帝众教会”后特别说明“人们，他们在各方面使我得安慰/振奋”。中文应明确这些在场之人，避免把“使我振奋”误解成教会这一抽象集体的行动。
  - severity: medium
    issue: “那份……归宿”把 the lot 的分得之份、份额意象改写为终极去处
    rationale: 见证用 lot，重点是获准得到自己所热切追求的“份”；“归宿”虽可由语境联想，却不是该词本身所明示，且与“达到”搭配造成双重终点意象。
  - severity: low
    issue: “以此尊荣父”可更明确表现 honor 的对象
    rationale: 改作“使父……得尊荣”能更清楚呈现劝勉主教所指向的尊荣目的，同时保留方括号所标的恢复/不确定信号。
  revised_text: '我从士每拿向你们问安，也同与我在一起、属于上帝众教会的人们向你们问安；他们在各方面都使我得安慰，无论在身体上还是在心灵上。


    我为耶稣基督的缘故所带着的锁链，也劝勉你们；我祈求能到达上帝那里。你们要持守彼此的和睦，并彼此同心祷告。你们每一个人，尤其是长老们，都应当鼓舞你们主教的心，使父、[也使]耶稣基督和众使徒得尊荣。[a]


    我祈求你们在爱中听我所说，免得我因写了这些话，反而成为指证你们的见证人。你们也要为我祷告；我在上帝的怜悯中需要你们的爱，使我得以蒙准获得我所热切追求的那一份，不至于被弃绝。[b]'
  revised_footnotes:
  - marker: a
    text: 方括号中的“也使”依所据英文见证保留，表示此处有补足或文本上的不确定性；希腊文仍待直接校勘。
    reason: 保留英文见证明确标示的恢复信号，并说明当前文本依据的限制。
  - marker: b
    text: “被弃绝”可指经检验后遭否决或不蒙接纳；此处保留该词的警诫性，而不将它限定为特定宗派的神学术语。
    reason: 交代 reprobate 的语义范围，并避免以“归宿”或特定教义解释“那一份”。
  revision_rationale: 修订首句以明确使作者得安慰的是在场的信徒，而非抽象的“众教会”；调整第二段末句，使尊荣的对象和方括号恢复信号更清楚；并将“那份……归宿”改为“获得……那一份”，保留 lot 的份额/所得含义及原句的含蓄性。“到达上帝那里”仍按见证保留，不擅自解释为殉道或救恩。
