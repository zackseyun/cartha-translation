review_pass:
  verdict: revise
  source_fidelity: 草稿整体忠实于所供英文见证，并谨慎保留了方括号所示的文本恢复信号。不过，“我也恳求”把“恳求／祈祷我得以达到上帝那里”与前句“锁链劝勉你们”的连贯结构切开；“那份……归宿”则把 lot（所得的一分、份额）和 attain（得着、达到）的意象混合为较明确的终点，宜收敛。
  naturalness: 行文庄重且基本自然。将首段的“上帝众教会”调整为“上帝的众教会”，并使第二段长句的逻辑关系更清楚，可提升现代汉语可读性。
  terminology: “士每拿”“上帝”“长老”“主教”“使徒”“锁链”均合宜。“被判为不合格”可保留其受检验而遭否决的意味，但改为“不被发现为不合格”更贴近原句的被动发现式措辞。
  issues:
  - severity: medium
    issue: 第二段将祈求句与“锁链劝勉”句拆分
    rationale: 英文见证把“我所佩带的锁链劝勉你们”与“祈求我得以达到上帝那里”置于同一劝勉结构中。草稿的分号和“我也”虽不致误译，却削弱了原文连贯的书信语势。
  - severity: medium
    issue: “那份我切望达到的归宿”过度融合并具体化 lot 的意象
    rationale: the lot 首要是“分得的一份／份额”，而 attain 是对该份额的取得或达到；“归宿”将其解释为终极目的地。宜译为“我所热切盼望得着的那一分”，保留含蓄性。
  - severity: low
    issue: “上帝众教会”搭配略显生硬
    rationale: “上帝的众教会”更符合现代标准汉语，同时完整呈现 churches of God。
  - severity: low
    issue: “被判为不合格”略强化司法宣判
    rationale: reprobate 可指经检验而被弃绝、不蒙认可；“不被发现为不合格”既保留评断意象，也贴近 witness 的 found。
  revised_text: '我从士每拿向你们问安；与我同在的上帝的众教会也向你们问安。他们在各方面都使我得安慰，无论在身体上还是在心灵上。


    我为耶稣基督的缘故所佩带的锁链劝勉你们；我祈求自己可以达到上帝那里。你们要持守和睦，彼此一同祷告。你们各人，尤其是长老们，都应当使你们主教的心灵得安慰，以尊荣父、[也尊荣]耶稣基督和众使徒。[a]


    我祈求你们在爱中听从我，免得我因写下这些话而成为指证你们的见证人。你们也要为我祷告；我在上帝的怜悯中需要你们的爱，使我得以蒙准获得我所热切盼望得着的那一分，并且不被发现为不合格。[b]'
  revised_footnotes:
  - marker: a
    text: 方括号中的“也尊荣”依所据英文见证保留，表示此处有补足或文本上的不确定性；希腊文仍待直接校勘。
    reason: 如实呈现英文见证的恢复标记，并说明当前底本限制。
  - marker: b
    text: “不合格”也可理解为“经检验后被弃绝”或“不蒙认可”；该词可带有受审查、竞赛或审判的意象。
    reason: 说明词语的语义范围，避免把它限定为后世特定宗派的神学术语。
  revision_rationale: 修订维持原有的谨慎和书信体庄重语域，改正较不自然的属格表达，恢复“锁链劝勉”与祈求之间的连贯语势，并将“lot”译为“那一分”以保留其份额意象而不预设其必然等同于死亡、殉道或天国。方括号及两处脚注锚点均予保留。
