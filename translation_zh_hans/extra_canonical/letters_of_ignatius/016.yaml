  naturalness: 原译总体流畅庄重，但“只有一位教师”在此基督论语境下可用“老师”，更符合现代汉语而不失庄重；“沉默而有真实的生命”略显解释性。“以合宜的爱爱他”重复且不自然，可改为“以正确的方式爱他”或“正确地爱他”。
  terminology: “耶稣之道”“主”“上帝”“殿”均可接受。“父的称许”把“worthy of the Father”（ἄξια τοῦ πατρός）限缩为父的主观认可；应保留为“配得父／与父相称”的开放关系。
