revisions:
- from: '沉默而有真实的生命，胜过说话却没有真实的生命。教导人是美好的，只要教导者也身体力行。如今只有一位教师；他说了，事情就成了。不仅如此，就连他在沉默中所做的事，也配得父的称许。[a]


    真正拥有耶稣之道的人，也能聆听他的沉默，好使自己达到完全：他可以借着言语采取行动，也可以借着沉默让人认出他是怎样的人。[b]


    没有什么能向主隐藏；就连我们的隐秘，也都在他面前。因此，我们做一切事，都要知道他住在我们里面，好使我们成为他的殿，他自己也在我们里面作我们的上帝。这确实如此；我们若以合宜的爱爱他，这事也必在我们眼前显明出来。[c]'
