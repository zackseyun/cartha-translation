base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/016.yaml
  text: 'It is better to be silent and to be than to speak and not to be. It is a fine thing to teach, if the speaker practices. Now there is one teacher who spoke, and it came to pass. Indeed, even the things he has done in silence are worthy of the Father.


    Whoever truly possesses the word of Jesus is also able to listen to his silence, so that he may be perfect—so that through his speech he may act, and through his silence he may be known.


    Nothing is hidden from the Lord; even our secrets are near to him. Therefore, let us do everything knowing that he dwells in us, so that we may be his temples and he himself may be in us as our God. This is so, and it will also be made clear before our eyes through the love that we rightly bear toward him.'
translation:
  language: zh_hans
  text: '沉默而有实际，胜过说话却没有实际。教导是美好的，只要说话的人也实行。如今只有一位老师；他说了，事情就成了。是的，就连他在沉默中所做的事，也配得父。[a]


    真正拥有耶稣之道的人，也能够聆听他的沉默，好使他得以完全；好使他借着所说的话行事，并借着沉默被人认识。[b]


    没有什么能向主隐藏；就连我们的隐秘，也在他近旁。因此，让我们做一切事，都知道他住在我们里面，好使我们成为他的殿，而他自己在我们里面作我们的上帝。这是如此，并且也会借着我们正确地爱他，在我们眼前显明出来。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “配得父”直译原文，亦可理解为“与父相称”或“配归于父”。此处的语义关系不宜限缩为父的“称许”。
    reason: 保留“worthy of the Father”及其希腊文属格表达的开放性。
  - marker: b
    text: “被人认识”原文为被动式，未明说认识者，也未具体说明所认识的是何事；也可较字面译为“借着沉默被认识”。
    reason: 避免添加“让人认出他是怎样的人”等原文没有的内容，同时保留代词和语义关系的歧义。
  - marker: c
    text: “在我们眼前显明出来”也可译为“向我们显明”。“这”所指可涵盖前述上帝住在我们里面、我们成为他的殿并且他作我们的上帝这一现实。
    reason: 保留末句指示语的概括范围及显明方式的开放性。
lexical_decisions:
- source_word: to keep silence and to be
  choice: 沉默而有真实的生命
  rationale: “to be”在此与空谈而缺乏真实存在或实践相对；补出“真实的生命”使现代汉语可懂，同时不把它窄化为某一具体德目。
- source_word: one teacher
  choice: 只有一位教师
  rationale: 保留单数和排他语气；上下文中的“他”指向耶稣，但正文不额外补名，以维持原文衔接。
- source_word: possesseth the word of Jesus
  choice: 拥有耶稣之道
  rationale: “道”可涵盖耶稣的信息、教训或话语，保留原表达可能具有的丰富含义。
- source_word: hearken unto His silence
  choice: 聆听他的沉默
  rationale: 保留富有张力的悖论性意象，不解释为某一种特定的启示方式。
- source_word: temples
  choice: 殿
  rationale: 采用宗教语境中自然而庄重的表达，并保留复数主体共同成为属他的圣所这一语义张力。
- source_word: rightly bear towards Him
  choice: 以合宜的爱爱他
  rationale: “合宜”表达正确、恰当之意，避免将其具体化为某一宗派规定的爱之形式。
theological_decisions:
- issue: “他说了，事情就成了”是否暗示创造神学
  choice: 保留简洁表述，不注明具体事件
  alternative: 译为“他一发命，万物就成了”
  rationale: 见证文本可能呼应上帝借言语成事，但未明说“万物”或创造；不应在正文中消除这种含蓄性。
- issue: “在沉默中所做的事”所指为何
  choice: 维持开放指称
  alternative: 明确解释为耶稣隐藏的生平、受难或无言的行动
  rationale: 现有英文见证没有限定所指，宜保存其神学和修辞张力。
- issue: “借着沉默让人认出”中被认出的对象
  choice: 译为“让人认出他是怎样的人”
  alternative: 译为“借着沉默被上帝认识”或“使耶稣被人认识”
  rationale: 代词指向存在歧义；正文采用较自然的伦理性理解，脚注明确保留其他可能，避免将歧义完全隐藏。
- issue: 内住与成为殿的关系
  choice: 按原有目的结构直译为“好使我们成为他的殿”
  alternative: 解释为信徒群体共同构成教会圣殿
  rationale: 原句可有个人和群体层面的理解；不引入后来的教会论限定。
- issue: 末句“这事”指向什么
  choice: 泛指上帝在我们里面作我们的上帝这一现实
  alternative: 仅指“他住在我们里面”或整段全部陈述
  rationale: 原指称范围并不完全明确，中文以概括性“这事”保留弹性。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。保留“沉默／说话”“言语／沉默”的平行结构与悖论张力。由于所给 drafting basis 明示希腊文审校尚待完成，本稿以公共领域英文见证为暂定依据，并在可能受原文复核影响之处设置脚注；未引入宗派性术语或特定解释家的观点。
