review_pass:
  verdict: revise
  source_fidelity: 需要修订。“不是由于我自己的功劳”把原句较宽泛的“并非出于我自己／并非由我自己所致”收窄为功德论含义；应保留原有的非自发、非自致之意。“已经快要抵达港湾”也弱化了原文“已经驶近／到达港湾”的进行或已临近意象。有关安提阿教会恢复的两个并列身体／完整性意象，宜避免以“完满”作抽象神学化表达。
  naturalness: 原稿整体庄重流畅。修订后以“并非出于我自己”“重获原有的整体”“已经驶近港湾”等表达，既更贴近见证文本，也符合现代书面汉语。
  terminology: “上帝”“教会”“恩典”“锁链”“使者”等用语一致且合宜。“上帝的使者”可保留其受差遣的代表含义；不必采用现代外交语境浓厚的“大使”。“完全”在末句保留，以维持原文的重复，脚注说明其亦可含成熟、完备之义。
  issues:
  - severity: medium
    issue: 将“not of my own complicity”译为“并不是由于我自己的功劳”
    rationale: 英语见证此处措辞古旧且不稳定；即使按其基本方向，也并未明确说“功劳”。译作“并非出于我自己”更能保留非自致、非自愿或非自作主张等可能范围。
  - severity: medium
    issue: “本来的完满”处理“proper bulk/fullness”
    rationale: “完满”容易抽象化并带入完成／圆满的神学联想，未能充分保留与“规模”并列的实体性、整体性恢复意象。
  - severity: low
    issue: “已经快要抵达港湾”
    rationale: “were already reaching a haven”表明已经在驶近港湾；“快要”略将其推回尚未临近的将来状态。
  revised_text: '你们的祷告已经传到叙利亚安提阿的教会。我从那里出来，如今作为一个身带最蒙上帝喜悦之锁链的囚徒，向众人问安；我不配属于那里，因为我是他们中最末后的。承蒙这样的恩典，是照着上帝的旨意，并非出于我自己，而是借着上帝的恩典；我祈求能完全领受这恩典，好借着你们的祷告达到上帝那里。[a]


    因此，为使你们的工作在地上和天上都得以完成，你们的教会应当为上帝的荣耀委派一位上帝的使者，叫他远赴叙利亚，向他们道贺，因为他们已经恢复平安，恢复了原有的规模，也重获了原有的整体。[b]


    所以，我认为你们从自己人中派一位带着书信前去，是合宜的；让他同他们一起归荣耀给上帝，因为照着上帝的旨意，平静已经临到他们，而且借着你们的祷告，他们已经驶近港湾。既然你们是完全的，你们的谋划也要完全；因为你们若有意行善，上帝随时会赐下所需的条件。[c]'
  revised_footnotes:
  - marker: a
    text: 本段依据所供公版英语见证暂译，仍须直接核对希腊文。“并非出于我自己”对应英语见证中含义不够明确的古旧措辞，可能涉及非自致、非自愿或非自作主张等意思；“达到上帝那里”保留原文表达，未明确解释为殉道。
    reason: 源语言审查尚未完成；须避免将不明确的措辞限定为“功劳”，也不把“达到上帝”单一解释为某一神学结论。
  - marker: b
    text: “原有的规模”和“原有的整体”延续原句两个相近而不完全相同的恢复意象；它们具体是指教会人数、秩序、完整性或其他情形，尚不确定。
    reason: 避免把含混的恢复意象过早解释为特定教会制度或单一历史状况。
  - marker: c
    text: “完全”也可带有“成熟、完备”之义；“赐下所需的条件”对应英语见证的“grant the means”，可指实现善愿所需的条件、途径或能力。
    reason: 保留原文重复的修辞，并避免把“means”局限为单指能力。
  revision_rationale: 修订以所供英语见证为直接审校依据，并在关键处保留其歧义：不将“非出于我自己”释作“没有功劳”，不将安提阿教会的恢复意象抽象化为“完满”，并使“驶近港湾”更准确呈现已经临近安稳处境的比喻。脚注同步更新，明确直接希腊文复核尚待完成。
