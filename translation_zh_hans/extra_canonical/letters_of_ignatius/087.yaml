base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/087.yaml
  text: 'Your prayer sped forth unto the church which is in Antioch of Syria; whence coming a prisoner in bonds most pleasing to God, I salute all men, though I am not worthy to belong to it, being the very last of them. By the divine will was this vouchsafed to me, not of my own complicity, but by God’s grace, which I pray may be given to me perfectly, that through your prayers I may attain unto God.


    Therefore, that your work may be perfected both on earth and in heaven, it is fitting that your church should appoint, for the honor of God, an ambassador of God, that he may go as far as Syria and congratulate them because they are at peace, have recovered their proper stature, and their proper fullness has been restored to them.


    It seemed to me therefore a fitting thing that you should send one of your own people with a letter, that he might join with them in giving glory for the calm which, by God’s will, had overtaken them, and because they were already reaching a haven through your prayers. Seeing you are perfect, let your counsels also be perfect; for if you desire to do well, God is ready to grant the means.'
translation:
  language: zh_hans
  text: '你们的祷告已经传到叙利亚安提阿的教会。我从那里出来，如今因着最蒙上帝喜悦的锁链作了囚徒，向众人问安。虽然我是他们中最末后的，不配属于那教会，但这恩赐照着上帝的旨意临到我，并不是由于我自己的功劳，而是靠上帝的恩典。我祈求这恩典完完全全地赐给我，使我借着你们的祷告得以达到上帝那里。[a]


    因此，为使你们的工作在地上和天上都得以完成，你们的教会应当为上帝的荣耀委派一位上帝的使者，让他远赴叙利亚，向他们道贺，因为他们已经恢复平安，重得应有的规模，又恢复了本来的完满。[b]


    所以，我认为你们从自己人中派一位带着书信前去，是合宜的；让他同他们一起归荣耀给上帝，因为照着上帝的旨意，平静已经临到他们，而且借着你们的祷告，他们已经快要抵达港湾。既然你们是完全的，你们的谋划也要完全；因为你们若有意行善，上帝随时会赐下成事的能力。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段依据所供公版英语见证暂译；“不是由于我自己的功劳”所对应的希腊文含义仍须直接核对，可能有“并非凭自己的自觉／良心”等译法。“达到上帝那里”也保留原文表达，未明确解释为殉道。
    reason: 源语言审查尚未完成，且英语古词 complicity 与神学目标语具有真实歧义。
  - marker: b
    text: “应有的规模”和“本来的完满”延续原句两个身体或成长方面的意象；它们究竟具体指教会人数、组织秩序还是其他恢复，尚不确定。
    reason: 避免把含混的恢复意象过早解释为某种特定教会制度。
  - marker: c
    text: “赐下成事的能力”也可理解为“赐下所需条件”；这里强调上帝使善愿能够付诸实行。
    reason: 英语 witness 的“grant the means”可指能力、条件或途径，中文正文选择自然但非排他的表达。
lexical_decisions:
- source_word: prayer sped forth
  choice: 祷告已经传到
  rationale: 保留祷告迅速抵达对方教会的动态意象，同时避免生硬的“飞奔出去”。
- source_word: most godly bonds
  choice: 最蒙上帝喜悦的锁链
  rationale: 依据英语见证与POB咨询层所呈现的语义，表达这些锁链因忠于上帝而可蒙悦纳，而不是把锁链本身称为神圣。
- source_word: ambassador of God
  choice: 上帝的使者
  rationale: “使者”自然庄重，保留受教会委派、为上帝荣耀出行的代表性；不采用容易带入现代外交制度色彩的“大使”。
- source_word: proper stature / proper fullness
  choice: 应有的规模／本来的完满
  rationale: 保留两个相近而不完全相同的恢复意象，不将其具体化为未经证实的教制或人数恢复。
- source_word: calm / haven
  choice: 平静／港湾
  rationale: 保留海上风浪平息并驶向港湾的连贯比喻。
- source_word: attain unto God
  choice: 达到上帝那里
  rationale: 保留伊格那丢书信中具有神学张力的目标表达，不擅自改释为单纯“殉道”或一般性的“得救”。
- source_word: God is ready to grant the means
  choice: 上帝随时会赐下成事的能力
  rationale: 以自然汉语表达上帝预备实现善愿所需条件或能力的含义，避免含混的“赐下手段”。
theological_decisions:
- issue: “达到上帝那里”的含义
  choice: 直译保留“达到上帝那里”
  alternative: 明确译作“借殉道到上帝那里”或“得救”
  rationale: 上下文可能关联伊格那丢预期的殉道，但所供材料没有把该含义明说；应保留原有张力。
- issue: “在地上和天上都得以完成”所指
  choice: 保留天地并列，不加解释
  alternative: 解释为教会在人间行动、在天上得赏赐
  rationale: 原句没有明确界定完成的方式或结果，不宜导入特定功德或奖赏体系。
- issue: 安提阿教会“恢复”的具体性质
  choice: 用“平安、规模、完满”概括呈现
  alternative: 明确说恢复主教职位、组织秩序或人数
  rationale: 见证文本只使用恢复 stature/fullness 的意象，具体历史或教制含义尚待希腊文与背景审查。
- issue: 恩典并非出于自己
  choice: 译作“并不是由于我自己的功劳，而是靠上帝的恩典”
  alternative: 译作“并非我自己促成／参与”
  rationale: 英语 complicity 在此古旧且可能反映希腊文“不凭自觉／良心”的表述；当前译法传达非自取而蒙恩，但以脚注标明暂定性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；以“上帝”统一译称 God。保留“锁链”“平静”“港湾”等修辞意象，并避免古奥句式。由于材料明确注明希腊文复核尚待进行，本稿属于以公版英语见证为依据、参考英语POB咨询层的暂定出版草案；重要不确定处均以脚注说明。
