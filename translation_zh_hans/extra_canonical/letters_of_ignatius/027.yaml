base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/027.yaml
  text: Therefore, it is right that we should not only be called Christians but also be Christians. In the same way, some people have the bishop’s name on their lips but act apart from him in everything. Such people do not seem to me to maintain a good conscience, because they do not assemble together lawfully according to the commandment.
translation:
  language: zh_hans
  text: 所以，我们不应当只是被称为基督徒，也应当真正成为基督徒。同样，有些人嘴上称他为主教，在一切事上却撇开他而行。在我看来，这样的人并没有持守纯正的良心，因为他们没有照着诫命正当地聚集。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: be called Christians ... be such
  choice: 被称为基督徒……真正成为基督徒
  rationale: 保留“名为”与“实为”的鲜明对照，并以“真正”自然表达省略的表语。
- source_word: bishop
  choice: 主教
  rationale: 采用当代中文中对古代教会监督职分最通行、易懂的称呼；不额外界定其后世制度含义。
- source_word: have the bishop's name on their lips
  choice: 嘴上提着主教的名
  rationale: 保留原见证文本的口唇意象，表达口头承认却无实际顺服。
- source_word: act apart from him
  choice: 撇开他而行
  rationale: 表达行动上与主教分离、独自行事，避免强化为原文未明说的公开反抗。
- source_word: keep a good conscience
  choice: 持守无愧的良心
  rationale: “持守”对应持续保持；“无愧的良心”比字面的“好良心”更符合现代中文宗教伦理语域。
- source_word: assemble themselves together lawfully
  choice: 合乎规矩地聚集
  rationale: “合乎规矩”保留合法、合宜、有秩序的含义，同时避免让现代读者误解为国家法律许可。
- source_word: according to commandment
  choice: 照着诫命
  rationale: 保留单数“诫命”的权威语气，不擅自说明该命令的具体发布者或内容。
theological_decisions:
- issue: 基督徒之名与实际身份的关系
  choice: “不应当只是被称为基督徒，也应当真正成为基督徒”
  alternative: “不但要有基督徒之名，也要有基督徒之实”
  rationale: 所选译法更贴近原句结构，清楚保留名义与实际之间的伦理张力，而不把“成为”缩减为外在行为表现。
- issue: 主教权柄的范围
  choice: “凡事却都撇开他而行”
  alternative: “凡事都不服从他”
  rationale: 见证文本强调“apart from him”，所选表达保留分离行事的含义，不把它无根据地明确化为全面服从这一制度命题。
- issue: 聚会的规范依据
  choice: “照着诫命合乎规矩地聚集”
  alternative: “按主教的命令合法聚会”
  rationale: 原见证没有明确说诫命来自主教；因此不补入发布者，保留可能的指涉张力。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。鉴于所提供材料明确说明尚待希腊文直接复核，本稿依公共领域英文见证谨慎起草，避免在“lawfully”“commandment”等处作超出见证的具体化解释。
