revisions:
- from: 所以，我们不应当只是被称为基督徒，也应当真正成为基督徒。同样，有些人嘴上提着主教的名，凡事却都撇开他而行。在我看来，这样的人并没有持守无愧的良心，因为他们没有照着诫命合乎规矩地聚集。
  to: 所以，我们不应当只是被称为基督徒，也应当真正成为基督徒。同样，有些人嘴上称他为主教，在一切事上却撇开他而行。在我看来，这样的人并没有持守纯正的良心，因为他们没有照着诫命正当地聚集。
  rationale: 修订仅改善措辞的自然度并使“lawfully”的译法更贴近所给英文见证；保留“诫命”来源未明的歧义，也不将“撇开他而行”强化为明确的制度性不服从。鉴于直接希腊文复核仍标明待完成，未在正文中对诫命的发布者或聚集的具体规范作任何补充说明。
