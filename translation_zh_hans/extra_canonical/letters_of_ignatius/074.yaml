base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/074.yaml
  text: 'Seeing that in answer to your prayer and to the tender sympathy which you have in Christ Jesus, it has been reported to me that the church which is in Antioch of Syria has peace, it is becoming for you, as a church of God, to appoint a deacon to go there as God’s ambassador, that he may congratulate them when they are assembled together, and may glorify the Name.


    Blessed in Jesus Christ is he who shall be counted worthy of such a ministration; and you yourselves shall be glorified. Now if you desire it, it is not impossible for you to do this for the name of God, even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
translation:
  language: zh_hans
  text: '既然有人告诉我，叙利亚安提阿的教会享有平安——这回应了你们的祷告，也回应了你们在基督耶稣里所怀的深切关怀——那么，你们作为上帝的教会，理当委派一位执事到那里去，作上帝的使者，好让他在他们聚集时向他们道贺，并荣耀这名[a]。



    在耶稣基督里被看为配得承担这项服事的人是有福的；你们自己也必得荣耀。如今只要你们愿意，为上帝的名做这事并非不可能；邻近的教会已经差派了主教[b]，其他教会则差派了长老和执事。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这名”是敬称性的表达；此处可能指上帝的名，也可能更具体地指耶稣基督的名。因希腊文源流复核尚待完成，正文保留其简约表达。
    reason: 保留原文见证中的指涉含混，避免无依据地限定为某一对象。
  - marker: b
    text: “主教”在此译早期教会职分名称；不应仅凭本段就把它等同于后世各种传统中已经定型的主教制度。
    reason: 防止将后期教制含义倒读进早期文本，同时保留职分名称的可识别性。
lexical_decisions:
- source_word: hath peace
  choice: 已经恢复平安
  rationale: 上下文指安提阿教会先前的患难或动荡已经止息；“恢复平安”比静态的“有平安”更符合此处报告好消息的语境，同时不具体断定平安如何临到。
- source_word: tender sympathy
  choice: 温柔怜爱
  rationale: 兼顾深切关怀、同情与亲爱之意，避免较现代行政语感的“慰问”。
- source_word: God's ambassador
  choice: 上帝的使者
  rationale: 保留受差遣、代表上帝前往的意味；“使者”自然庄重，也不额外赋予正式外交官职含义。
- source_word: the Name
  choice: 那名
  rationale: 保留早期基督教文本以“那名”敬称上帝或基督之名的特殊表达及其指涉张力，不擅自补明对象。
- source_word: ministration
  choice: 服事
  rationale: 表达受托承担的教会性服务，较“职事”更易为普通现代读者理解，同时保持宗教语域。
- source_word: bishops / presbyters / deacons
  choice: 主教／长老／执事
  rationale: 采用现代汉语中通行的早期教会职分名称，不进一步说明后世制度层级。
theological_decisions:
- issue: “the Name”的指涉
  choice: 正文译作“那名”，并加注说明可能指上帝或基督之名
  alternative: 直接译作“上帝的名”或“耶稣的名”
  rationale: 现有英文见证保留了专称形式，而直接希腊文复核尚待完成；因此不应在正文中消除其真实的指涉开放性。
- issue: 差派执事是否构成固定制度规范
  choice: 按特定处境译为“委派一位执事”，不扩展为普遍教规
  alternative: 译成带规范性的固定教制命令
  rationale: 本段是对非拉铁非教会在具体事件中的劝勉，文本本身不足以建立超出该语境的普遍制度要求。
- issue: “你们自己也必得荣耀”的主体与性质
  choice: 保留原句，不说明荣耀来自谁或以何种方式实现
  alternative: 补译为“上帝也必荣耀你们”或“你们也必受人称赞”
  rationale: 见证文本没有明说施动者或荣耀的具体性质，应保留神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句式适度拆分，但保留劝勉书信的郑重语气。鉴于所提供材料明确说明希腊文源流复核尚待完成，本稿以公共领域英文见证及经审核的英文POB为暂定依据；凡可能涉及源文细节之处均采取保守译法，不声称已完成直接希腊文校勘。
