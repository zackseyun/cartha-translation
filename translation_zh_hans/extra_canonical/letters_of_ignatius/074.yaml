source:
  text: 'Seeing that in answer to your prayer and to the tender sympathy which ye have in Christ Jesus, it hath been reported to me that the church which is in Antioch of Syria hath peace, it is becoming for you, as a church of God, to appoint a deacon to go thither as God''s ambassador, that he may congratulate them when they are assembled together, and may glorify the Name.


    Blessed in Jesus Christ is he that shall be counted worthy of such a ministration; and ye yourselves shall be glorified. Now if ye desire it, it is not impossible for you to do this for the name of God; even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
