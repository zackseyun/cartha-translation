review_pass:
  verdict: revise
  source_fidelity: 需修订。首句的ἔγνων是“知道/得知”，不是“听说”；προφυλάσσω的核心是预先守护、警戒，不宜缩窄为“及早提醒”。“在信心和爱中重新得回/恢复自己”是一个并列结构，草稿将“在爱中”另行扩展为第二次“重新振作”，改变了句法关联。更重要的是，第二段的希腊文传统读作τὸ θεοφόρον πλῆθος（“承载上帝的群体／神载的群体”），而非τὸ ἐν θεῷ πλῆθος；草稿及其词汇、神学说明据此产生了实质性误译。末句ἐπὶ ματαιότητί τινι应保留“因某种虚妄/空妄事”，不应随英文见证的“before some”处理。
  naturalness: 草稿整体庄重可读，但“那在上帝里面的众人”在现代汉语中生硬，且不合源文。“以温柔装备自己”可懂，却不如“拿起温柔”贴近原有的取用意象；“在信心和爱中恢复自己”既自然，也较准确地保留原句的并列关系。
  terminology: “外邦人”是此处τοῖς ἔθνεσιν在早期基督教语境中较稳定且自然的译法。“邻舍”可保留。“主的肉”“耶稣基督的血”应维持，不把强烈的系词关系教义化解释。θεοφόρον宜在正文译为“承载上帝的群体”，并以脚注说明其字面意象，避免误作“在上帝里面”或泛化为“敬虔的群众”。
  issues:
  - severity: high
    issue: 将ἔγνων译为“听说”
    rationale: 该词表示“知道、得知”，并不表示传闻；应译为“我并非知道你们中间有这种事”。
  - severity: medium
    issue: 将προφυλάσσω译为“及早提醒”
    rationale: 该词的预先防护、警戒意义不应完全化约为言语上的提醒；“预先警戒/守护你们”更完整。
  - severity: medium
    issue: 把“在爱中”改写为独立的第二次“重新振作”
    rationale: 原文以“在信心……和在爱……”共同限定“恢复自己”；草稿添加第二个动词，弱化了原有的平行结构。
  - severity: high
    issue: τὸ θεοφόρον πλῆθος误作τὸ ἐν θεῷ πλῆθος，并译为“那在上帝里面的众人”
    rationale: 中期修订本希腊文传统的词是θεοφόρον，意为“承载上帝的、神载的”，不是“在上帝里面的”。正文、词汇决定和相关神学说明均须更正。
  - severity: low
    issue: 以“因为经上说”引入末句
    rationale: φησίν只说“他说/有话说”；虽明显呼应经文传统，但正文宜避免把源文未明说的书面归属强化为“经上”。
  revised_text: '我并非知道你们中间有这种事；而是因为你们是我所爱的人，我预见到魔鬼的埋伏，所以预先警戒你们。


    因此，你们要拿起温柔，并在信心和爱中恢复自己[a]；信心就是主的肉，爱就是耶稣基督的血。


    你们谁也不可对邻舍怀有嫌隙。不要给外邦人留下可乘之机，免得上帝的群体因少数愚昧人而受毁谤[b]。因为有话说：“祸哉！那使我的名因某种虚妄而受毁谤的人！”[c]'
  revised_footnotes:
  - marker: a
    text: “恢复自己”对应的希腊语直意近于“重新得回自己”。“在信心和爱中”共同限定这一劝勉；下文随即以“是”将信心与主的肉、爱与耶稣基督的血相连。
    reason: 说明不易直译的反身表达及原文的并列句法，同时不预断其神学解释。
  - marker: b
    text: “上帝的群体”所对应的词为“承载上帝的群体”（θεοφόρον πλῆθος）；这里以较自然的中文表达，并保留其“承载上帝”意象。
    reason: 更正草稿将该词误认作“在上帝里面的众人”的源文错误，并交代该术语的字面含义。
  - marker: c
    text: 此句呼应《以赛亚书》52:5等经文传统，但本处的传抄措辞为“因某种虚妄而受毁谤”，与现行旧约译文未必逐字相同。
    reason: 标明引文背景及其与通行旧约文本的措辞差异，保留本段文本的不确定性。
  revision_rationale: 修订首先恢复“知道”与“预先警戒”的原义，并按原文句法将“在信心和爱中”同归于“恢复自己”。随后将第二段的关键读法改回θεοφόρον（“承载上帝的”），删除“在上帝里面”的错误依据；末句则保留“某种虚妄”的不定表达，并用中性引语公式避免过度断定引文归属。
