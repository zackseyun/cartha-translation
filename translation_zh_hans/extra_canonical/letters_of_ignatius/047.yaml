review_pass:
  verdict: revise
  source_fidelity: 需修订。首句的ἔγνων是“我知道/得知”，不是“我听说”；原文也把“预先警戒/守护你们”作为与“并非因我知道你们中有此事”相对的行动。另，温柔对应ἐν πραΰτητι，且“装备”动词与“使自己恢复”动词在原文中不同；末句应保留“因某种虚妄/空妄之事”的不定表达。
  naturalness: 原稿总体庄重可读，但“那在上帝里面的众人”不够自然。“在上帝里的众人”既保留原文关系表达，也更符合现代汉语。首句重组后可避免原稿将“把你们当作我所爱的人”和“及早提醒”处理成因果链的歧义。
  terminology: “外邦人”是此处τοῖς ἔθνεσιν在早期基督教语境中更准确、通行的译法；“主的肉”“耶稣基督的血”应保留。引文不宜加入原文未明说的“经上说”，但可用引号并在注释说明其经文传统背景。
  issues:
  - severity: high
    issue: 首句将“我知道/得知”译为“我听说”，并改写了句法关系。
    rationale: οὐχ ὅτι ἔγνων τι τοιοῦτον ἐν ὑμῖν意为“并不是因为我知道你们中有这样的事”；ἀλλὰ προφυλάσσω ὑμᾶς则是“而是我预先警戒/守护你们”。原稿的“我并不是听说……不过，我既……就……”既弱化ἔγνων，也引入原文没有的因果结构。
  - severity: medium
    issue: 脚注a误称“以温柔装备自己”依据ἀναλαβόντες τὴν πραΰτητα。
    rationale: 本段文本为ἐν πραΰτητι ὁπλίσασθε（“要以/在温柔中武装自己”），随后才是ἀνακτήσασθε ἑαυτούς（“使自己恢复/重新得回自己”）。脚注应更正，以免造成错误的希腊语锚定。
  - severity: medium
    issue: “外族人”未充分表达τοῖς ἔθνεσιν在本段的传统语境。
    rationale: 此处通常指“外邦人”（即群体之外的列邦/非信徒世界），而非现代民族学意义上的“外族人”。
  - severity: low
    issue: “那在上帝里面的众人”表达生硬。
    rationale: τὸ ἐν θεῷ πλῆθος可自然译为“在上帝里的众人”，保留“在上帝里”的关系性语言，且不擅自制度化为特定教会称谓。
  - severity: medium
    issue: “因为经上说”是解释性添加。
    rationale: 该句显然呼应以赛亚书的经文传统，但希腊文本在此直接引出“祸哉”。正文宜不添加引介语；经文背景可置于脚注。
  revised_text: '并不是因为我知道你们中间有这样的事，而是因为我预见魔鬼的圈套，就把你们当作我所爱的人，预先警戒你们。因此，你们要以温柔武装自己，并要在信心中使自己恢复；这信心就是主的肉。也要在爱中使自己恢复；这爱就是耶稣基督的血。[a]


    你们谁也不可对邻舍怀有怨恨；也不要给外邦人留下机会，免得在上帝里的众人因少数愚妄的人而受毁谤。因为：“祸哉，那因某种虚妄之事使我的名受毁谤的人！”[b]'
  revised_footnotes:
  - marker: a
    text: “以温柔武装自己”对应希腊语“在温柔中武装自己”；随后“使自己恢复”直译有“重新得回自己”的意思。译文保留其劝人恢复稳固、整全状态的意象。
    reason: 更正原脚注对希腊语动作词的错误锚定，并说明“使自己恢复”的较不寻常措辞。
  - marker: b
    text: 末句呼应《以赛亚书》52:5等经文传统，但本段所传措辞为“因某种虚妄之事”（保留不定表达），与现行旧约译文的常见形式不完全相同。
    reason: 说明引文传统背景及其措辞差异，不把它静默统一为某一现行旧约文本。
  revision_rationale: 修订首句以符合ἔγνων、ἀλλά和προφυλάσσω的语义及句法；以“以温柔武装自己”对应ἐν πραΰτητι ὁπλίσασθε，并将“使自己恢复”对应ἀνακτήσασθε ἑαυτούς。另将“外族人”改为“外邦人”，使群体边界语境更准确；删去正文中解释性添加的“经上说”，并以脚注处理引文背景。保留信心与主的肉、爱与耶稣基督的血之间原文强烈的“是”式关系，不作教义化解释。
