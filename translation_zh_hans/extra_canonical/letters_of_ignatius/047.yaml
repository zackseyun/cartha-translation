base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/047.yaml
  text: 'It is not indeed that I have known of any such thing among you, but I keep watch over you betimes, as my beloved, for I foresee the snares of the devil. Do ye therefore arm yourselves with gentleness and recover yourselves in faith, which is the flesh of the Lord, and in love, which is the blood of Jesus Christ.


    Let none of you bear a grudge against his neighbor. Give no occasion to the Gentiles, lest by reason of a few foolish men the godly multitude be blasphemed: for, “Woe unto him through whom My name is vainly blasphemed before some.”'
translation:
  language: zh_hans
  text: '我并不是听说你们中间有这样的事；不过，我既把你们当作我所爱的人，又预见到魔鬼的圈套，就及早提醒你们。因此，你们要以温柔装备自己，并在信心中重新振作[a]；这信心就是主的肉。你们也要在爱中重新振作；这爱就是耶稣基督的血。


    你们谁也不可对邻舍心怀怨恨。不要给外族人留下把柄，免得因少数愚昧的人，那在上帝里面的众人反受毁谤。因为经上说：“祸哉，那使我的名因某种虚妄而受毁谤的人！”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以温柔装备自己，并在信心中重新振作”所依据的希腊语可较直译为“拿起温柔，在信心中重新得回自己”。现译保留其恢复、振作之意。
    reason: 说明原文动作意象及“恢复自己”这一不易在中文中直接表达的措辞。
  - marker: b
    text: 末句呼应《以赛亚书》52:5等经文传统，但这里传下来的措辞是“我的名因某种虚妄而受毁谤”。不同文本或译本的表达可能有差异。
    reason: 标明引文来源背景及文本形式的不一致，避免读者误以为这是对现行旧约译文的逐字引用。
lexical_decisions:
- source_word: προφυλάσσω
  choice: 及早提醒
  rationale: 该词带有预先防备、事先警戒之意；结合作者牧养式劝诫的语境，译为“及早提醒”比单纯“看守”更自然。
- source_word: τὰς ἐνέδρας τοῦ διαβόλου
  choice: 魔鬼的圈套
  rationale: 保留“埋伏、陷阱”的具体意象，同时采用现代汉语常用表达。
- source_word: ἀναλαβόντες τὴν πραΰτητα
  choice: 以温柔装备自己
  rationale: ἀναλαμβάνω可指拿起、披戴或装备；此处保留行动和备战色彩，不把“温柔”弱化为一般态度。
- source_word: ἀνακτήσασθε ἑαυτούς
  choice: 重新振作
  rationale: 该表达可有恢复、重新得回自己之意；“重新振作”在现代汉语中自然，并保留劝人恢复稳固状态的语气。
- source_word: κατὰ τοῦ πλησίον ἐχέτω
  choice: 对邻舍心怀怨恨
  rationale: 按语境表达“怀有针对邻舍的事物/敌意”；“心怀怨恨”符合紧接着不可给外人把柄的伦理劝告。
- source_word: τοῖς ἔθνεσιν
  choice: 外族人
  rationale: 此处指基督徒群体之外的非犹太或异教社会；“外族人”保留群体边界，又避免直接加入贬义。
- source_word: τὸ ἐν θεῷ πλῆθος
  choice: 那在上帝里面的众人
  rationale: 直保“在上帝里面”这一关系性表达，不将其解释性改写成“敬虔的群众”或某一制度化教会称谓。
- source_word: ἐπὶ ματαιότητί τινι
  choice: 因某种虚妄
  rationale: 保留τινι的不确定性和ματαιότης的虚妄、空妄语义；不依英文见证中含混的“before some”作定向解释。
theological_decisions:
- issue: 信心与主的肉、爱与基督的血之间的系词关系
  choice: 译作“这信心就是主的肉……这爱就是耶稣基督的血”
  alternative: 译作“信心所指的是主的肉，爱所指的是耶稣基督的血”
  rationale: 原句使用明确的“是”式关系。正文保留其强烈而有张力的圣礼性/具身性措辞，不预先判定它是隐喻、对应关系还是教义定义。
- issue: τὸ ἐν θεῷ πλῆθος的群体身份
  choice: 那在上帝里面的众人
  alternative: 敬虔的群众／上帝的会众
  rationale: 选择较形式对应的译法，以免把“在上帝里面”的表达化约为一般敬虔，或擅自指定为某一教会制度概念。
- issue: 末句引文的经文性质与措辞
  choice: 以“因为经上说”引入，并保留本段见证的独特措辞
  alternative: 直接按某一旧约通行译本统一措辞
  rationale: 该句明显呼应经文传统，但现有文本措辞与常见旧约形式不完全一致；不应静默校正为后来的标准经文文本。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。正文以中等形式对应为主，保留“主的肉”“耶稣基督的血”“在上帝里面”等具有神学张力的表达。由于用户所附元数据注明希腊语源文复核尚待完成，本稿依据中期修订本希腊语传统的可识别措辞并参照所给公共领域英文见证起草；出版前仍宜据指定希腊语校勘本逐词复核。
