base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/043.yaml
  text: 'I have many profound thoughts in God, but I keep myself within proper bounds, so that I do not perish through my boasting. For now I must be even more afraid and must not listen to those who would puff me up, because those who say such things to me are a scourge to me.


    For although I desire to suffer, I do not know whether I am worthy. The envy of the devil is indeed unseen by many, but it wages an even fiercer war against me. Therefore, I long for gentleness, by which the ruler of this world is brought to nothing.'
translation:
  language: zh_hans
  text: '我在上帝里面有许多深邃的思想；但我衡量自己，免得因自夸而灭亡。如今，我更应当警醒惧怕，不去听那些使我自高自大的人，因为对我说这些话的人，反倒成了鞭打我的鞭子。


    我虽然渴望受苦，却不知道自己是否配得上。魔鬼的嫉妒固然不为许多人所察觉，对我发动的攻势却越发猛烈。因此，我渴求温柔；借着温柔，这世界的统治者就归于无有。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段依据所提供的公版英文见证译出；希腊文原文尚待直接复核。
    reason: 资料明确说明希腊文源语审校仍待进行，因此公开标示当前译稿的文本依据与暂定性质。
lexical_decisions:
- source_word: deep thoughts in God
  choice: 在上帝里面有许多深邃的思想
  rationale: 保留“在上帝里面”这一关系性表达，不将其解释性改写为“属灵洞见”；“深邃的思想”对应所据见证的开放含义。
- source_word: take the measure of myself
  choice: 衡量自己
  rationale: 保留自我审度、自知限度的比喻，同时避免过度释义。
- source_word: boasting
  choice: 自夸
  rationale: 采用现代汉语中清楚而具伦理分量的表达，保留因夸耀而陷入危险的张力。
- source_word: puff me up
  choice: 使我自高自大
  rationale: 以自然汉语传达被奉承而膨胀、骄傲的意象。
- source_word: scourge
  choice: 鞭打我的鞭子
  rationale: 保留强烈的刑罚与伤害意象，并明确其对作者本人造成的作用。
- source_word: envy of the devil
  choice: 魔鬼的嫉妒
  rationale: 按见证直译，不将其弱化为一般性的“恶意”或另作神学解释。
- source_word: gentleness
  choice: 温柔
  rationale: 采用常见且庄重的德性用语；不擅自收窄为“谦卑”或“忍耐”。
- source_word: prince of this world
  choice: 这世界的统治者
  rationale: “统治者”自然表达权势身份，也避免“王子”在现代汉语中的误解。
- source_word: brought to nought
  choice: 归于无有
  rationale: 保留被废除、失去效力的强烈表达及其神学张力。
theological_decisions:
- issue: “在上帝里面”的思想之性质
  choice: 保留“在上帝里面”，不说明这些思想是启示、奥秘或个人默想
  alternative: 译为“我对上帝有许多深刻认识”
  rationale: 所据文本并未明确思想的来源或内容，故保留关系性与含混性。
- issue: 作者是否“配得”受苦
  choice: 译为“是否配得上”，保留资格或价值判断
  alternative: 译为“是否有能力承受”
  rationale: “worthy”主要涉及配得与资格；不可将殉道神学的张力化约为承受能力。
- issue: 温柔如何使世界的统治者归于无有
  choice: 保留工具性表达“借着温柔”
  alternative: 解释为“温柔使魔鬼无法得逞”
  rationale: 原见证没有展开作用机制，应保留修辞与神学上的开放性。
- issue: “这世界的统治者”的指称
  choice: 正文不直接注明为魔鬼
  alternative: 译为“魔鬼这世界的统治者”
  rationale: 上下文很可能指魔鬼，但称号本身应保留，以免把暗示改成明说。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语。句式保留劝诫与自省的力度，同时避免古奥文言。因尚未完成希腊文直接复核，对可能受源语词义影响的细节采取审慎、少释义的译法。
