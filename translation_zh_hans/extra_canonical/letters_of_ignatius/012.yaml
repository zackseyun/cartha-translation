base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/012.yaml
  text: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is—the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot always to be a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the apostles in the power of Jesus Christ.'
translation:
  language: zh_hans
  text: '这是末后的时期。从今以后，我们要心存敬畏；我们要惧怕上帝的恒久忍耐，免得这忍耐变成对我们的审判。我们要么惧怕将要临到的震怒，要么爱慕现今的恩典——二者必居其一；只要我们最终是在基督耶稣里，被引向真正的生命。


    除了他以外，不要让任何事物在你们眼中显得光彩夺目。我在他里面带着我的锁链，就是我属灵的珍珠。愿我借着你们的祷告，带着这些珍珠复活[a]；愿我总能有分于你们的祷告，好使我得以列在以弗所的基督徒中间；他们一向借着耶稣基督的能力与使徒同心。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “复活”也可理解为“起来”。这里的表达可能指末后的复活，也可能带有更宽泛的“被兴起”之意；译文保留其末世色彩。
    reason: 所据英文见证的“rise again”具有一定语义空间，而中期校订本希腊文的直接复核尚待完成。
lexical_decisions:
- source_word: last times
  choice: 末后的时期
  rationale: 保留末世性的时间表达，同时使用现代汉语中自然、庄重的措辞。
- source_word: long-suffering of God
  choice: 上帝的恒久忍耐
  rationale: 既表达上帝长久容忍，也保留原文要求人对这忍耐心存惧怕的张力。
- source_word: true life
  choice: 真正的生命
  rationale: 不擅自限定为今生生活或末后永生，保留表达的广度。
- source_word: spiritual pearls
  choice: 属灵的珍珠
  rationale: 保留作者把锁链比作珍珠的鲜明隐喻，不改写为抽象的‘荣耀’或‘功德’。
- source_word: be always a partaker
  choice: 总能有分于
  rationale: 自然表达持续参与或分享祷告之意，而不额外规定具体礼仪背景。
- source_word: of one mind with the Apostles
  choice: 与使徒同心
  rationale: 表达思想与志向上的一致，不强化为制度性继承或绝对同等。
theological_decisions:
- issue: 上帝的忍耐与审判之间的关系
  choice: ‘免得这忍耐变成对我们的审判’
  alternative: ‘免得我们因他的忍耐而受审判’
  rationale: 依照所给见证保留拟人化转折，不替作者系统化忍耐如何成为审判。
- issue: 惧怕震怒与爱慕恩典的二选一结构
  choice: 保留‘要么……要么……二者必居其一’
  alternative: 将二者协调为同时并存的属灵态度
  rationale: 原见证有意呈现尖锐的选择，译文不以教义调和消除其修辞张力。
- issue: ‘在基督耶稣里’与真正生命的关系
  choice: ‘在基督耶稣里，被引向真正的生命’
  alternative: ‘在基督耶稣里得永生’
  rationale: 避免把‘真正的生命’直接等同并收窄为某一固定末世论术语。
- issue: 锁链作为属灵珍珠
  choice: 直接保留同位隐喻
  alternative: 释义为‘我因信仰所受的光荣苦难’
  rationale: 不把殉道受苦解释成特定功德论，也不削弱作者对锁链的珍视。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。鉴于当前材料明确说明中期校订本希腊文复核尚待完成，本稿以所给公共领域英文见证为暂定依据；避免对代词、复活意象及使徒关系作超出见证的宗派性解释。
