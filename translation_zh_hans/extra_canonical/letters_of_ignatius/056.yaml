review_pass:
  verdict: revise
  source_fidelity: 译稿总体保留了段落、反复和主要悖论，但若干处偏离见证文本及所列希腊关键词：第一段将“我希望……得以坚立”的祈愿弱化为“愿……坚定不移”；末段把 μεγέθους（伟大、宏大）译成“大能”，不够准确。
  naturalness: 现代书面语总体通顺；但“只要为我祈求”“也都坚定不移”“我才显为忠信”等表达不够自然或改变句间关系。修订后保留庄重、简洁的书信体。
  terminology: “我们的神耶稣基督”“父”“基督徒／基督信仰”等术语可保留。“美善”可表达 καλόν 的广度；“伟大”应取代“大能”，并以脚注说明该处并非通常意义的能力或权能。
  issues:
  - severity: medium
    issue: “愿你们在教导人时所吩咐的那些话，也都坚定不移”未准确表达说话者的愿望及“得以坚立”。
    rationale: 见证文本为“我希望你们作为教师所吩咐的那些教导能够有效／得以坚立”。修订为“我希望……得以坚立”，既保留第一人称愿望，也不将其误作对罗马信徒的直接祝愿。
  - severity: medium
    issue: “只要为我祈求”中的“只要”在中文中易被理解为条件或限制。
    rationale: 此处是“only”的劝勉性限定，宜译为“只请你们……”。
  - severity: medium
    issue: “而当我……时，我才显为忠信”将“那时我便能忠信”改成了被显明为忠信，并强化了“才”的排他性。
    rationale: 见证文本的 faithful 是说话者届时成为／保持忠信；应保留其时间关联，而不额外转成旁观者的判定。
  - severity: high
    issue: “基督信仰乃在于大能”将 μεγέθους 译作“大能”。
    rationale: 所列希腊词的基本义是“伟大、宏大”，与“劝服／说服”构成格言式对照；“大能”会引入较强的能力、权能含义，且脚注已承认“伟大”是合理释义。
  - severity: low
    issue: “反而教导了别人”添加了原文未明说的强对比语气。
    rationale: 前后确有对照，但“反而”会略加强逻辑。改为并列陈述更稳妥。
  revised_text: '你们从未嫉妒任何人；你们曾教导别人。我希望你们作教师时所吩咐的那些教导得以坚立。


    只请你们为我祈求，使我在内在和外在都有力量，好叫我不但能说，也能愿意；不但被称为基督徒，也被证实是基督徒。因为我若被证实是基督徒，就也能被这样称呼；当我不再向世人显现时，那时我便能忠信。


    一切可见的事物都不是美善的。[a] 因为我们的神耶稣基督既在父里面，就越发显明。基督信仰不是劝服之事，而是伟大之事；它在遭世人憎恨时尤其如此。[b]'
  revised_footnotes:
  - marker: a
    text: “可见的”也可理解为“显露于眼前的”或“外在的”。本句与下文基督“越发显明”的说法形成刻意的张力；正文不把它解释为对物质世界的全面否定。
    reason: 说明该词的语义范围及上下文悖论，避免过度解释。
  - marker: b
    text: “伟大”所据词语主要指“伟大、宏大”。前句的“劝服”指靠说服或劝诱而成的事；本句以格言式语言对照基督信仰的本质与单靠劝服。
    reason: 纠正将该词译为“大能”所产生的语义偏移，并保留原句简练的对照。
  revision_rationale: 修订以所提供的英语见证为基准，并参照稿件列出的希腊关键词。重点恢复“我希望……得以坚立”的句法关系，调整“只请”的语气和“忠信”的时间关系，并将 μεγέθους 译为“伟大”。“不再向世人显现”保留其可能暗示死亡或殉道的语境，而不在正文中落实为单一解释。
