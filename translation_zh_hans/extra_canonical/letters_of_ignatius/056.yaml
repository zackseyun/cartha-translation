base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/056.yaml
  text: 'You never begrudged anyone; you were the instructors of others. And I desire that the lessons you give as teachers will remain in force.


    Only pray that I may have power both inwardly and outwardly, so that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one. For if I am found to be one, then I can also be called one and be faithful when I am no longer visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is all the more plainly visible. The work is not of persuasiveness, but Christianity is a thing of power whenever it is hated by the world.'
translation:
  language: zh_hans
  text: '你们从未嫉妒任何人，反而教导了别人。我所盼望的是：愿你们在教导人时所吩咐的那些话，也都坚定不移。


    只要为我祈求，使我内外都有力量；这样，我不但能说，也真心愿意；不但被称为基督徒，也确实是基督徒。因为我若确实是基督徒，便也可以被这样称呼；而当我不再显现在世人眼前时，我才显为忠信。


    一切显在眼前的，都算不得美善。[a] 因为我们的神耶稣基督在父里面，反而越发显明。这事不在于劝服人的言辞；基督信仰乃在于大能，正是在它被世人憎恨的时候。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显在眼前”也可译作“可见的”或“外在显露的”；本句与下文基督“越发显明”构成刻意的反差。
    reason: 说明关键词的语义范围及原文悖论，避免读者把该句理解为对一切物质事物的简单否定。
  - marker: b
    text: “大能”所据词语也含“伟大、宏大”之意；本句也可理解为：“基督信仰不是劝服人的事，而是伟大之事。”
    reason: 该处希腊词的语义比单纯“能力”更宽，应保留另一种合理理解。
lexical_decisions:
- source_word: ἐβασκάνατε
  choice: 嫉妒
  rationale: 该词可指嫉妒、眼红或不愿别人得益；“从未嫉妒任何人”保留其基本语义，也与后文主动教导别人形成对照。
- source_word: μαθητεύοντες ἐντέλλεσθε
  choice: 在教导人时所吩咐的
  rationale: 兼顾“使人成为门徒／教导”与“吩咐”的双重动作，避免仅译作抽象的“课程”。
- source_word: δύναμιν ... ἔσωθέν τε καὶ ἔξωθεν
  choice: 内外都有力量
  rationale: 保留内在意愿与外在行动相称的对举，不将“力量”窄化为勇气或身体能力。
- source_word: εὑρεθῶ
  choice: 确实是
  rationale: 原意是“被发现为／证实为”；中文如此表达可自然传达名实相符，同时不额外指定由谁检验。
- source_word: καλόν
  choice: 美善
  rationale: 该词兼有“好、善、美、可贵”之意；“美善”保留其伦理与价值层面的宽度。
- source_word: πεισμονῆς
  choice: 劝服人的言辞
  rationale: 指凭说服、劝诱而成之事；加入“言辞”使中文对比清楚，但不把它限定为欺骗性修辞。
- source_word: μεγέθους
  choice: 大能
  rationale: 字面涉及伟大、宏大；在此与单靠说服相对，译作“大能”较自然，并保留实际力量与伟大实质的意味。
theological_decisions:
- issue: “当我不再显现在世人眼前时”所指为何
  choice: 保留为“不再显现在世人眼前”
  alternative: 明确译为“当我殉道死去时”
  rationale: 上下文很可能指殉道后的不可见状态，但本句采用可见／显现语言；正文不把暗示直接解释成“死亡”或“殉道”。
- issue: “我们的神耶稣基督”
  choice: 按称谓直译
  alternative: 弱化为“我们的主耶稣基督”
  rationale: 见证文本明确以“神”称耶稣基督，应保留其直接的基督论表述。
- issue: “在父里面”与“越发显明”的关系
  choice: 保留悖论式表述
  alternative: 解释为耶稣借着回到父那里而更清楚地被认识
  rationale: 原句有意将不可见与真正显明并置；不在正文中消解其神学张力。
- issue: 基督信仰被世界憎恨时显出“大能”
  choice: 保留时间性和悖论
  alternative: 译成“即使被世界憎恨，仍有大能”
  rationale: “正是在……的时候”比让步式“即使”更忠实地表达其受憎恨之际显出本质的关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。段落和反复结构依照见证文本保留，以显出“说／愿意”、“被称为／确实是”、“显在眼前／越发显明”的修辞对应。鉴于所给材料注明希腊文复核尚待完成，本稿参考中编希腊传统的常见文本措辞，并对关键歧义以脚注保留；出版前仍应据指定底本逐词校勘。
