review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了段落结构、反复句式及基督论称谓，但若按所列希腊关键词复核，若干处将原文的状态、条件或语义重心改得过强："教导了别人"不如持续性的"作别人的教师"；"坚定不移"并非"仍然有效"的准确表达；末句的 μεγέθους 应译为"伟大／宏大"，不宜正文定为"大能"。
  naturalness: 文字庄重流畅，但"只要为我祈求"、"我才显为忠信"及"劝服人的言辞"略显生硬或增添限定。改为"只请你们为我祈求"、"那时我也能忠信"、"不是靠劝说"更合现代书面普通话，也更贴近原句。
  terminology: 保留"基督徒"、"我们的神耶稣基督"、"父"和"基督信仰"是恰当的。"美善"可用，但"好"更直接对应 καλόν；"伟大"应取代"大能"以对应 μεγέθους，并在注释中说明其亦可含宏大、崇高之义。
  issues:
  - severity: medium
    issue: 将"lessons ... shall hold good"译为"也都坚定不移"
    rationale: 此处是祈愿他们作为教师所吩咐／教导的事仍然有效、得以实行；"坚定不移"转而描述教导者或话语的坚定性。
  - severity: medium
    issue: 将"ye were the instructors of others"译为完成式"教导了别人"
    rationale: 原意是他们一贯作为别人的教师／教导者，宜保留角色性或持续性。
  - severity: medium
    issue: 将 μεγέθους 译为"大能"
    rationale: 该词的基本义为伟大、宏大，而非 δύναμις 一类的能力或权能。英语见证的"might/power"可作解释性译法，但中文正文宜按希腊语义译为"伟大"。
  - severity: low
    issue: '"我才显为忠信"增添"显为"及强调性"才"'
    rationale: 原句是当他不再为世界所见时，便能忠信；不必另加入"显为"。
  - severity: low
    issue: '"劝服人的言辞"将 πεισμονή 限为言辞'
    rationale: 该词关乎劝说、说服，不必限定为言辞；"不是靠劝说"更宽且自然。
  revised_text: '你们从未嫉妒任何人，反而作别人的教师。我所盼望的是：愿你们作为教师所教导的那些事，仍然有效。


    只请你们为我祈求，使我在内在和外在都有力量，好让我不但能说，也愿意如此；不但被称为基督徒，也被发现真是基督徒。因为若我被发现真是基督徒，我就也能被称为基督徒；当我不再被世界看见时，那时我也能忠信。


    一切可见的都不是美善。[a] 因为我们的神耶稣基督在父里面，就更清楚地显明出来。基督信仰不是靠劝说，而是在它被世界憎恨时显出伟大。[b]'
  revised_footnotes:
  - marker: a
    text: “可见的”也可理解为“外在显露的”。本句与下文基督在父里面却“更清楚地显明出来”形成刻意的反差；不宜据此简单断定作者否定一切物质事物。
    reason: 说明“可见”与“显明”的修辞张力，同时避免把格言式表述过度系统化。
  - marker: b
    text: “伟大”所据词语含“宏大、崇高”之意；可译作“伟大之事”。它不同于前文“力量”所据的词。
    reason: 更正正文中将 μεγέθους 混同为“能力／大能”的问题，并保留该词的语义范围。
  revision_rationale: 修订以所列希腊词及句法重心为先，并与英语见证核对。保留“被发现”“不再被世界看见”所含的殉道语境暗示，而不将其正文释作死亡；保留“我们的神耶稣基督在父里面”的直接称谓和悖论式表达。
