base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/079.yaml
  text: 'For I know and believe that he was in the flesh even after the resurrection;


    and when he came to Peter and his companions, he said to them, “Take hold of me and touch me, and see that I am not a bodiless demon.” Immediately they touched him, and they believed, being united with his flesh and his blood. Therefore they also despised death; indeed, they proved superior to death. After his resurrection he [both ate and drank with them as one in the flesh, though spiritually he was united with the Father.'
translation:
  language: zh_hans
  text: '因为我知道并且相信，即使在复活以后，他仍是有血有肉的。


    他来到彼得和彼得的同伴那里，对他们说：“抓住我，摸摸我，就知道我不是没有身体的鬼灵。”他们立刻触摸了他，便信了，并与他的肉和血联合。因此，他们也藐视死亡；不但如此，他们显明自己胜过了死亡。他复活以后，[仍以有血有肉之身与他们一同吃喝，尽管在灵里他与父联合。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in the flesh
  choice: 有血有肉／以有血有肉之身
  rationale: 以自然现代汉语明确表达真实的身体存在，同时保留反对“无身体”理解的语境重点。
- source_word: demon without a body
  choice: 没有身体的鬼灵
  rationale: “鬼灵”比现代语境中的“魔鬼”更适合指无形灵体；“没有身体”直接保留原文对身体性的强调。
- source_word: being joined unto His flesh and His blood
  choice: 与他的肉和血联合
  rationale: 保留“肉和血”及“联合”的强烈而可能含混的表述，不将其解释为某一特定礼仪或教义。
- source_word: despised death
  choice: 藐视死亡
  rationale: 保留原句的强烈修辞，表示不再畏惧或受死亡辖制。
- source_word: superior to death
  choice: 胜过了死亡
  rationale: 使用自然汉语表达其超越、战胜死亡的意义，同时不额外说明实现方式。
- source_word: spiritually
  choice: 在灵里
  rationale: 保留其属灵层面的表达及与“有血有肉之身”的张力，避免译成仅指态度或象征的“精神上”。
theological_decisions:
- issue: 复活后基督身体的真实性
  choice: “仍是有血有肉的”及“以有血有肉之身”
  alternative: “仍在肉身中”
  rationale: 所选译法对普通现代读者更清楚地传达真实身体性，也与后文“没有身体的鬼灵”形成直接对照。
- issue: “与他的肉和血联合”的所指
  choice: 直译并保留含混性
  alternative: 解释为圣餐联合、身体接触或信仰上的联合
  rationale: 现有见证并未要求在这些可能含义中作出排他判断，因此不导入宗派性解释。
- issue: 基督与父的联合
  choice: “在灵里他与父联合”
  alternative: “在属灵意义上与父合一”
  rationale: “联合”较贴近见证措辞，并保留这种联合的性质与程度所具有的神学张力。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。因尚未完成希腊文直接核查，本稿依据所给公共领域英译见证拟定。保留末句不配对的左方括号，以反映底本中的文本残缺或补订标记；由于正文已有该符号而非脚注标记，未另设脚注。
