    text: 原始英译见证及所据文本在此保留未闭合的左方括号；本译照录，表示此处可能存在文本中断、缺文或补订标记。
    reason: 使正文中保留的方括号具有明确说明，且不擅自补足未获见证支持的文字。
  revision_rationale: 修订以希腊文中“在肉身中”、彼得“周围的人”、无形体的“鬼”、以及“属灵地／在属灵方面”等表达为优先，并保留“与他的肉和血结合”的含混性，不将其解释为特定礼仪或教义。末句不配对的左方括号照底本保留，且以同符号脚注说明，不擅自恢复可能缺失的文字。
