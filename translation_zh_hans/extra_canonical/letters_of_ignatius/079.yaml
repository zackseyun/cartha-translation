review_pass:
  verdict: revise
  source_fidelity: 建议修订。“有血有肉”虽传达身体真实性，却把希腊文 σάρξ（肉身／肉体）惯用地扩展为“血肉”，而下文另明说“肉和血”；改作“在肉身中／以肉身”更贴近原文，也保持术语一致。"Peter and his company"更准确是“彼得一行人／彼得周围的人”。末句的不配对方括号应保留，作为底本文本中断或补订信号。
  naturalness: 原译整体通顺、庄重。"抓住我，摸摸我"稍口语且“摸摸”减弱命令语气；“你们来摸我，仔细察看”更自然。"鬼灵"在现代标准汉语中不够稳定；“无形体的鬼”既自然又保留 δαιμόνιον ἀσώματον 的字面张力。
  terminology: 以“肉身”对应 σάρξ，以“肉和血”对应后文 σαρκὶ…αἵματι，避免混同。“在属灵方面”对应 πνευματικῶς，避免把副词性限定误作“在灵里”的地点性说法，同时不对其神学含义作进一步阐释。
  issues:
  - severity: medium
    issue: “有血有肉”不够精确对应“in the flesh／ὄντα ἐν σαρκί”
    rationale: 该汉语成语虽自然，但含有“血”的语义；原文此处只说“在肉身中”，且紧接后文才明确提出“肉和血”。
  - severity: low
    issue: “彼得和彼得的同伴”弱化“Peter and his company”
    rationale: 原语表达为“彼得周围的那些人”，并非仅指彼得个人的同伴；“彼得一行人”较合适。
  - severity: low
    issue: “鬼灵”及“在灵里”措辞不够自然或精确
    rationale: “无形体的鬼”较符合现代汉语；πνευματικῶς是副词，译为“在属灵方面”更明确地保留其限定作用。
  revised_text: '因为我知道并且相信，他即使在复活以后，仍是在肉身中。


    他来到彼得一行人那里，对他们说：“你们来摸我，仔细察看，就知道我不是无形体的鬼。”他们立刻摸了他，就相信了，并与他的肉和血结合。因此，他们也藐视死亡；不但如此，他们显明自己胜过了死亡。他复活以后，[以肉身与他们一同吃喝，尽管在属灵方面他与父联合。'
  revised_footnotes:
