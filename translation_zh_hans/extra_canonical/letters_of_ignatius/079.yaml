review_pass:
  verdict: revise
  source_fidelity: 建议将“有血有肉”改为“在肉身中／有肉身”，以较准确对应希腊文的“在肉身中”（ἐν σαρκί）及“作为有肉身者”（ὡς σαρκικός），避免汉语成语“有血有肉”所带的引申色彩。将“彼得和彼得的同伴”改为“彼得和跟他在一起的人”，更贴近“彼得和与他同在的人”。其余关键表述保留原有的含混度，尤其是“与他的肉和血联合”及“在灵里与父联合”。
  naturalness: 修订后语句更自然、指代更清晰；“摸我，察看我”在庄重现代汉语中能表达“抓住并触摸/查验”的命令，而不造成“抓住我”可能暗示拘捕或拉扯的语感。
  terminology: “肉身”是此处基督身体真实性论辩中较稳定且准确的用语。“没有身体的鬼灵”保留“无身体的δαιμόνιον”的字面重点，不把它具体化为某一宗派性的魔鬼论。“肉和血”“死亡”“父”“在灵里”均维持原文及英译见证的神学张力。
  issues:
  - severity: medium
    issue: “有血有肉”替代“在肉身中”
    rationale: 虽能传达真实身体性，但“有血有肉”是现代汉语成语，常含“形象真实、生动”等引申义；原文在此反复使用肉身语汇，宜以“肉身”保留其术语连贯性。
  - severity: low
    issue: “彼得和彼得的同伴”措辞重复
    rationale: 原意是彼得及与他同在者；改为“彼得和跟他在一起的人”较顺畅且不改变范围。
  - severity: low
    issue: “抓住我”语义可能偏强
    rationale: 原命令包含触摸、查验之意；“摸我，察看我”在中文中更自然地表达这一验证动作。
  revised_text: '因为我知道并且相信，他即使在复活以后仍在肉身中。


    他来到彼得和跟他在一起的人那里，对他们说：“摸我，察看我，就知道我不是没有身体的鬼灵。”他们立刻触摸了他，便信了；他们与他的肉和血联合。因此，他们也藐视死亡；不但如此，他们显明自己胜过了死亡。他复活以后，[以有肉身者的身份与他们一同吃喝，尽管在灵里他与父联合。'
  revised_footnotes: []
  revision_rationale: 修订以“肉身”一致呈现本段关于复活后身体真实性的核心措辞，并改善人物短语和命令语气。末句不配对的左方括号照所给英译见证保留，作为底本文本缺损或补订信号；不擅自补加右方括号或补足未提供的文本。未增添圣餐、基督论或父子关系的解释。
