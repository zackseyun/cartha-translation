  source_fidelity: 草稿在若干关键处超出了或削弱了所据见证，并且可由希腊文中评估的两处句法/词义应予校正：“好学、顺服的人”把“好学生/门徒”增译为“顺服”；“更难对付的人”弱化了较强的病患/有害意象。尤其航海比喻后的目的从句，希腊文以第二人称单数为主语（使“你”得以达到/得着上帝），不应保留英语见证中“it”的不明指向。末句ἀντίψυχον的“代价、赎价/替身”语义亦不可改为泛泛的“献上自己”。
