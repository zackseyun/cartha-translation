  terminology: “肉体和灵”“属灵的恩赐”“不朽和永生”均可保留。“学生”在本段可译为“门徒”，既符合早期基督教书信的称谓语境，也不将其现代学术化；不应加上“顺服”。“赎价”仅在此作为ἀντίψυχον的直接语义，不说明或扩展为任何特定的赎罪理论。
