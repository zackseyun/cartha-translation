base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/092.yaml
  text: 'If you love good students, that is no credit to you. Rather, bring the more pernicious into submission through gentleness. Not all wounds are healed by the same ointment. Soothe sharp pains with compresses.


    Be prudent as the serpent in all things and always guileless as the dove. You are made of flesh and spirit so that you may accommodate the things visible before your eyes; and as for the invisible things, pray that they may be revealed to you, so that you may lack nothing but abound in every spiritual gift.


    The season requires you, as pilots require winds or as a storm-tossed sailor requires a harbor, so that it may attain to God. Be sober, as God’s athlete. The prize is incorruption and eternal life, of which you too are persuaded. In all things I am devoted to you—I and my bonds, which you cherished.'
translation:
  language: zh_hans
  text: '如果你爱好门徒，这不值得称赞。倒要用温柔使病情更重的人顺服。不是所有的伤口都用同一种药膏医治；要用热敷缓解剧烈的疼痛。


    凡事要像蛇一样谨慎，常常像鸽子一样纯真。你是由肉体和灵构成的，为要妥善应对眼前可见的事；至于不可见的事，要祈求它们向你显明，使你一无所缺，充满各样属灵的恩赐。


    这时势需要你，正如舵手需要风，遭风浪颠簸的水手需要港湾，使你得以达到上帝。要保持清醒，像为上帝参赛的运动员。奖赏是不朽和永生；对此你也深信不疑。在一切事上，我和你所珍爱的我的锁链，都是你的赎价。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: good scholars
  choice: 好学、顺服的人
  rationale: 英语见证的 scholars 在本段牧养语境中更可能指受教良好、易于带领的人，而非现代意义的学者；并列措辞避免过度限定。
- source_word: more pestilent
  choice: 更难对付的人
  rationale: 保留对顽梗、棘手者的负面描述，同时避免使用现代汉语中主要指传染病的“有害/致命”。
- source_word: bring ... to submission
  choice: 使……归服
  rationale: 保留服从、归顺的力度，不擅自补明是归服监督、教会纪律或上帝。
- source_word: fomentations
  choice: 温敷
  rationale: 对应古代以热敷舒缓剧痛的医疗意象，现代读者也容易理解。
- source_word: humor
  choice: 妥善应对
  rationale: 此处不是现代英语“幽默”，而是迁就、适应或适当处理；译文保留实践性的宽度。
- source_word: be sober
  choice: 保持清醒
  rationale: 兼顾警醒、自制与头脑清醒的含义，避免只理解为戒酒。
- source_word: incorruption
  choice: 不朽
  rationale: 在奖赏与永生的末世语境中，指免于朽坏的生命状态；采用自然而庄重的汉语。
- source_word: God's athlete
  choice: 上帝的运动员
  rationale: 保留古代竞技意象及其操练、争胜的含义，不改写成带特定传统色彩的称谓。
theological_decisions:
- issue: “so that it may attain unto God”中代词所指
  choice: 保留“它”的歧义，并加注说明
  alternative: 明确译为“使这时势/你的事奉/你可以达到上帝那里”
  rationale: 现有英语见证本身所保留的代词指向不明；在希腊文复核尚待完成时，不宜替原文解决歧义。
- issue: “flesh and spirit”的人论表达
  choice: 译为“由肉体和灵构成”
  alternative: 译为“既属肉体又属灵”
  rationale: 前者较直接保留构成性表达，不把肉体自动解释为罪性，也不引入二元对立。
- issue: “every spiritual gift”
  choice: 各样属灵的恩赐
  alternative: 一切灵性的恩惠
  rationale: “属灵的恩赐”是自然且广为理解的表达，但不列举或限定具体恩赐。
- issue: 末句“我和我的锁链”之奉献含义
  choice: 译为“我都为你献上自己——不但我，连……锁链也是如此”
  alternative: 译为“我和我的锁链凡事都作你的赎价”
  rationale: 英语见证仅明确表达 devoted，译作“献上自己”可保留强烈委身，却不擅自引入赎价或替代性牺牲的专门神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留医疗、航海和竞技三组比喻。鉴于所提供材料注明希腊文源语复核尚待完成，本稿以公共领域英语见证及经审校的英文桥梁稿为暂定依据，避免在词义与神学歧义处作过度确定的处理。
