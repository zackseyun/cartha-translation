    text: 本段目前依据所提供的公版英文见证译出，尚待希腊文原文复核。末句“我们缺少许多，免得我们缺少上帝”按该见证保留其简省而带张力的表达；未将其逻辑关系作进一步神学解释。
    reason: 说明当前底本限制，并保留末句的语义张力，不在正文或注释中预断其确切逻辑。
