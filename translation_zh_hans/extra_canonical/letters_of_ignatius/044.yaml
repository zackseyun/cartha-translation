    text: 本段目前依据所提供的公版英文见证译出，尚待希腊文原文复核。末句直译式地保留“缺少许多”与“缺少上帝”之间紧缩而不寻常的关系；不据此断定其更具体的逻辑或神学解释。
    reason: 说明底本限制，并保留末句的语义张力，避免正文或注释作过度解释。
