base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/044.yaml
  text: 'Am I not able to write to you about heavenly things? But I fear lest I should cause you harm, being infants. So bear with me, lest, not being able to take them in, you should be choked.


    For I myself also, although I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible—I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
translation:
  language: zh_hans
  text: '难道我不能把天上的事写给你们吗？但我怕你们还像婴孩，反而因此受害。所以请体谅我，免得你们承受不了，竟被噎住。


    我自己虽被捆锁，也能领会天上的事、众天使的队列、各掌权者的集结，以及可见与不可见之事；然而，我并不因此就已经是门徒。因为我们还缺少许多，好让我们不至于缺少上帝。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段目前依据所提供的公版英文见证译出，尚待希腊文原文复核。末句也可理解为：“我们还缺少许多，才不至于缺少上帝。”其确切逻辑关系在现有英文见证中较为含蓄。
    reason: 明确当前底本限制，并保存末句真实的语义张力，避免正文作过度解释。
lexical_decisions:
- source_word: heavenly things
  choice: 天上的事
  rationale: 保留原文宽泛含义，不把它限定为某一类奥秘或教义。
- source_word: being babes
  choice: 还像婴孩
  rationale: 保留属灵幼小的比喻，同时用现代汉语自然表达。
- source_word: be choked
  choice: 被噎住
  rationale: 承接“承受不了”的吞咽意象，不将其弱化为一般的困惑。
- source_word: arrays of the angels
  choice: 众天使的队列
  rationale: 保留有秩序排列的军事性或礼仪性图景。
- source_word: musterings of the principalities
  choice: 各掌权者的集结
  rationale: 将 principalities 译作早期基督教语境中常见的超自然“掌权者”，同时保留 musterings 的集合、编队意味。
- source_word: disciple
  choice: 门徒
  rationale: 采用通行且庄重的基督教用语。
- source_word: bonds
  choice: 捆锁
  rationale: 兼顾囚禁处境与锁链意象，比单译“坐牢”更贴近见证文本。
theological_decisions:
- issue: “我并不因此就已经是门徒”的资格表述
  choice: 保留其反直觉的自谦与张力
  alternative: 解释为“并不因此就是成熟的门徒”
  rationale: 见证文本没有“成熟”一词；补入会替作者消解刻意的悖论式表达。
- issue: 末句“that God may not be lacking to us”的因果或目的关系
  choice: 译为“好让我们不至于缺少上帝”并加注
  alternative: 译为“因为我们若缺少许多，就会缺少上帝”或“唯有如此，上帝才不至于离开我们”
  rationale: 英语见证保留了简练而语义不寻常的目的结构；正文尽量保留，不擅自确定其神学逻辑。
- issue: principalities 的所指
  choice: 译作“掌权者”，不明定善恶属性
  alternative: 译作“天使统领”或“邪灵权势”
  rationale: 上下文虽与天使和不可见之事并列，但没有足够依据限定其性质。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“难道……吗”保留开篇反问；“所以请体谅我”传达请求听众容让作者有所保留的语气。分段依照见证文本。因希腊文复核尚未完成，译文对术语和末句保持审慎，并以脚注说明文本基础。
