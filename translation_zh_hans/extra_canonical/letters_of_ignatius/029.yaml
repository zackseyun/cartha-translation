- from: '既然我在上述各位身上，凭着信心看见并拥抱了你们全体，我就劝你们：要热心地在敬虔的和谐中做一切事。主教照着上帝的样式主持，长老们照着使徒议会的样式主持；还有我极其亲爱的执事们，他们受托承担耶稣基督的执事职分。耶稣基督在万世以前与父同在，并在末后的时候显现。


    所以，你们众人都要竭力效法上帝，彼此尊重。谁也不要按肉体看待邻舍，却要常常在耶稣基督里彼此相爱。你们中间不可有任何能使你们分裂的事；倒要与主教以及那些带领你们的人合而为一，成为不朽的榜样和教训。[a]'
  to: '既然我在上述这些人身上，在信心里看见了你们全体，并且爱了你们，我劝你们：要热心地在属上帝的同心中行一切事。主教居于上帝的位置主持，长老们居于使徒团的议会的位置；还有我所亲爱的执事们，他们受托承担耶稣基督的执事职分。耶稣基督在万世以前与父同在，并在末后的时候显现。


    所以，你们众人都要与上帝同心，彼此敬重。谁也不要按肉体看待自己的邻舍；却要常常在耶稣基督里彼此相爱。你们中间不可有任何能使你们分裂的事；反要跟随主教和那些带领你们的人，作为不朽生命的榜样和教训。'
  rationale: 本修订以中期本希腊文的关键词和句法为优先，并与所给英文见证及英文POB审计文本核对。“在信心里”保留κατὰ πίστιν的限定性；“居于……的位置”保留εἰς τόπον的职分对应，而不将其解释为本体等同或后世教会制度；“与上帝同心”对应ὁμοτροπεῖτε θεοῦ。末句恢复“跟随”的命令，并把“榜样和教训”恰当地联系于此命令。删除原脚注，因为修订后并无必须以脚注保留的结构性歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:29:37Z'
review_pass:
  verdict: revise
  source_fidelity: 需修订。按中期本希腊文，首句的动词是“爱”（ἠγάπησα），并非“拥抱”；主教和长老是分别“居于上帝的位置／居于使徒团的议会的位置”（εἰς τόπον），不只是“照着……样式”。结尾的命令是“跟随主教和带领者”，而“作为不朽的榜样和教训”修饰这种跟随，不能译为信徒“成为”榜样和教训。
  naturalness: 原稿整体庄重通顺，但“凭着信心看见”“在敬虔的和谐中做一切事”“成为不朽的榜样和教训”略显生硬或造成句法误解。修订以“在信心里看见”“在属上帝的同心中”“作为……的榜样和教训”使现代汉语更自然，同时保留早期教会文本的庄重语域。
  terminology: 保留“主教、长老、执事、执事职分”和“按肉体”等历史性术语。“使徒议会”改为“使徒团的议会”，以免汉语读者误解为某一场后世意义的使徒会议；“不朽”调整为“不朽生命”，使ἀφθαρσία在此处所指的永不败坏生命更明确，但不作教派化阐释。
  issues:
  - severity: high
    issue: “拥抱了你们全体”
    rationale: 希腊文此处为ἠγάπησα（“我爱了”）；英文公共领域见证的“embraced”可作修辞性转述，但不宜覆盖原文动词。
  - severity: high
    issue: “主教照着上帝的样式主持，长老们照着使徒议会的样式主持”
    rationale: 原文用εἰς τόπον（“居于／占据……的位置”），并用προκαθημένου（“居首、主持”）描述主教；草稿将职分对应弱化为“样式”，且把“主持”重复加于长老。
  - severity: medium
    issue: “敬虔的和谐”
    rationale: θεοῦ ὁμονοίᾳ直指“属于上帝的同心／合一”；“敬虔的和谐”虽可理解，却较抽象，且没有充分呈现属神的归属。
  - severity: high
    issue: 结尾译作“成为不朽的榜样和教训”
    rationale: συνακολουθεῖτε是“跟随”，εἰς τύπον καὶ διδαχὴν ἀφθαρσίας说明该跟随所具有的“榜样和教训”功能；草稿错误地将“成为”加给受信者。
  - severity: medium
    issue: 脚注将结尾描述为主要未决的句法歧义
    rationale: 在中期本希腊文的句法中，命令“跟随”及其后的εἰς短语关系足以作出较稳妥翻译；现有脚注反而使已可处理的结构显得不确定。
