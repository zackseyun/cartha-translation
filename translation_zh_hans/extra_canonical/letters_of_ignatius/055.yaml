base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/055.yaml
  text: 'For I do not want you to please people, but to please God, as indeed you do please him. For I myself will never find an opportunity like this to attain to God, nor can you, if you remain silent, receive credit for any nobler work. For if you remain silent and leave me alone, I am a word of God; but if you desire my flesh, then I will again be merely a cry.


    No, grant me nothing more than to be poured out as a libation to God while an altar is still ready, so that, forming yourselves into a chorus in love, you may sing to the Father in Jesus Christ, because God has graciously granted that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, so that I may rise unto him.'
translation:
  language: zh_hans
  text: '我不愿你们讨人的喜悦，却要讨上帝的喜悦；事实上，你们正是这样做的。因为我再也不会有这样的机会到达上帝那里；你们若保持沉默，也不能因任何更高尚的事工而获得称许。因为你们若保持沉默，不要干预我，我就是上帝的话语；但你们若贪恋我的肉身，我就会再次只是一声呼喊。


    不，你们只要准许我在祭坛仍预备好了的时候，作为献给上帝的奠祭被浇奠；这样，你们就在爱中组成合唱队，在耶稣基督里向父歌唱，因为上帝恩准这位来自叙利亚的监督在西方被寻见，把他从东方召来。从世界沉落，归向上帝，是美好的，好让我向他升起。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沉落”译自一个可指日落或下沉的动词；它与紧接着的“升起”形成刻意的意象张力。此处不将其解释性地改写为“离世归向上帝”。
    reason: 保留末句的诗性含混及其与“升起”的对照；同时纠正正文中将“落下”误作朝向上帝的空间关系。
lexical_decisions:
- source_word: men-pleasers
  choice: 讨人的喜欢
  rationale: 保留与“讨上帝的喜欢”的直接对照，同时采用现代汉语可懂的表达。
- source_word: attain unto God
  choice: 达到上帝那里
  rationale: 保留依纳爵关于藉殉道抵达上帝的趋向性语言，不弱化为一般性的“亲近上帝”。
- source_word: a word of God
  choice: 上帝的一句话
  rationale: 保留“word”与后文“cry”的修辞对照；不用“大道”等可能引入额外基督论联想的词。
- source_word: a mere cry
  choice: 仅仅成为一声呼喊
  rationale: 维持“话语/呼喊”的对比及其开放含义，不擅自解释为无效见证。
- source_word: poured out a libation
  choice: 像奠祭一样浇献
  rationale: 以“奠祭”标明祭祀意象，并以“浇献”保留倾倒动作。
- source_word: bishop
  choice: 监督
  rationale: 采用贴近词源且宗派色彩较低的称谓；此处指作者本人在叙利亚教会中的职分。
- source_word: set from the world unto God
  choice: 离开世界、向上帝落下
  rationale: 保留航海落日般的“落下/启程”与下一句“升起”之间刻意而含混的意象，不将其平解为“离世归神”。
theological_decisions:
- issue: 殉道与“达到上帝”之间的关系
  choice: 直译为“达到上帝那里”
  alternative: “到上帝那里去”或“得着上帝”
  rationale: 原段将即将发生的殉道视为趋向上帝的机会；译文保存这一强烈表述，但不补充功德论或得救条件。
- issue: “上帝的一句话”的身份性隐喻
  choice: 保留原隐喻
  alternative: 解释为“为上帝作见证的话”
  rationale: 解释性译法会消除“word/cry”的张力，也可能过度限定作者的意思。
- issue: 祭坛与奠祭意象
  choice: 按献祭语言呈现
  alternative: 泛化为“让我为上帝牺牲”
  rationale: 原文的祭坛、倾倒和奠祭构成连续意象，应保留而不将其制度化或圣礼化。
- issue: 末句“落下/升起”的张力
  choice: 正文保留反常而富诗意的空间运动，辅以脚注
  alternative: 顺译为“离开世界到上帝那里去”
  rationale: 该句有落日、启航或离世等可能联想；不宜在正文中只选定一种解释。
translation_notes:
  register: 采用现代、庄重而可朗读的书信体。保留“话语/呼喊”“奠祭/祭坛”“落下/升起”等核心修辞。鉴于所供材料明确注明希腊文审校尚待完成，本稿以公共领域英文见证为暂定依据，避免伪称已完成原文校勘。
