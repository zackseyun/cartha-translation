base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/058.yaml
  text: 'From Syria all the way to Rome, I fight with wild beasts, on land and sea, night and day, bound among ten leopards—that is, a company of soldiers—who only grow worse when they are treated kindly. Yet through their wrongdoing I become more fully a disciple, though I am not thereby justified.


    May I have joy from the beasts prepared for me. I pray that I may find them ready; indeed, I will entice them to devour me quickly, unlike what they have done to some, refusing out of fear to touch them. Even if they are unwilling while I am ready, I myself will force them to it.


    Bear with me. I know what is best for me. Now I am beginning to be a disciple. Let nothing visible or invisible envy me, so that I may attain to Jesus Christ. Let fire and cross come, grappling with wild beasts, [cuttings and manglings,] wrenching of bones, hacking off of limbs, crushing of my whole body; let the cruel tortures of the devil come upon me. Only let me attain to Jesus Christ.'
translation:
  language: zh_hans
  text: '从叙利亚一路到罗马，我在陆地和海上、昼夜不停地与野兽搏斗，被捆绑在十只豹子中间——我指的是一队士兵；别人越善待他们，他们反而变得越凶恶。然而，借着他们对我的恶行，我更完全地成为门徒；但我并不因此被称义。


    愿我能因那为我预备的野兽而欢喜！我祈求自己遇见它们时，它们正急着扑来；我甚至要引诱它们，让它们迅速吞噬我，不像它们对待某些人那样，因害怕而不肯碰他们。即使我已准备好了，它们却不情愿，我也要亲自迫使它们这样做。


    请容忍我吧。我知道什么对我有益。如今，我才开始成为门徒。愿一切可见和不可见之物都不要嫉妒我，拦阻我到达耶稣基督那里。任凭火与十字架临到，任凭与野兽搏斗，[a]任凭折断骨头、砍碎肢体、碾碎全身，任凭魔鬼残酷的折磨袭击我；只要我能到达耶稣基督那里！'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些文本在这里还包括“割裂与撕碎”一语；其文本状况并不确定。
    reason: 所据英文见证以方括号标示该短语，可能反映文本残缺、补订或传承不确定性；正文以脚注标记保留这一情况，而不把不确定措辞无标记地纳入经文。
lexical_decisions:
- source_word: θηριομαχῶ
  choice: 与野兽搏斗
  rationale: 保留“同野兽争战”的具体意象；首段又以“十只豹子”比喻押送士兵，使字面刑罚与比喻性受虐彼此呼应。
- source_word: δέκα λεοπάρδοις
  choice: 十只豹子
  rationale: 直译动物隐喻，并由下文“我指的是一队士兵”解释其所指，不把比喻直接改写为士兵。
- source_word: μαθητεύομαι
  choice: 成为门徒
  rationale: 体现持续受塑造、日益成为门徒的过程，而非仅指获取知识。
- source_word: δεδικαίωμαι
  choice: 被称义
  rationale: 保留早期基督教语境中的法律—神学用语及其与“成为门徒”的张力，不弱化为“证明自己正确”。
- source_word: ἐπιτύχω Ἰησοῦ Χριστοῦ
  choice: 到达耶稣基督那里
  rationale: 兼顾动词“达到、获得、得着”的开放性；此处采用关系性、目标性的表达，避免把意义限定为功德性的“赢得基督”。
- source_word: συστάσεις θηρίων
  choice: 与野兽搏斗
  rationale: 以自然现代汉语表达与野兽近身遭遇、交锋的含义。
theological_decisions:
- issue: 受苦使人成为门徒与称义之间的关系
  choice: “借着他们对我的恶行，我更完全地成为门徒；但我并不因此被称义”
  alternative: “他们的恶行使我更配作门徒，却不能证明我无罪”
  rationale: 保留原文对门徒生命受塑造与“称义”之间的明确区分，不将受难本身解释为取得称义的功德。
- issue: “到达/得着耶稣基督”的含义
  choice: “到达耶稣基督那里”
  alternative: “得着耶稣基督”
  rationale: 上下文指向殉道后与基督相会，但原措辞仍可含“达到、获得”的意味；采用较少教派色彩的表达，同时不额外说明死后状态。
- issue: “魔鬼残酷的折磨”的施事关系
  choice: “魔鬼残酷的折磨袭击我”
  alternative: “愿魔鬼把残酷的折磨加在我身上”
  rationale: 保留属格关系的可能张力，不武断判定魔鬼是直接施刑者、折磨的来源，还是对折磨性质的描述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留殉道言辞强烈、急迫甚至令人不安的修辞，不加以缓和或赞美式扩写。由于所供材料明确说明希腊文复核尚待完成，本稿主要依据中篇希腊传统的公共领域英文见证及英文POB审校层拟定；词形判断仅作审慎辅助，出版前应直接核对希腊校勘文本。
