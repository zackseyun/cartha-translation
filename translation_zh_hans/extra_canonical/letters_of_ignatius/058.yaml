    text: “割裂与撕碎”在所据英文见证中置于方括号内；方括号表示该短语的文本地位或复原状况不确定。
    reason: 保留英文见证及英文POB正文中的方括号信号，同时以脚注说明其文本不确定性。
  revision_rationale: 修订以所提供的英文见证为直接审校基准，并审慎参照所列希腊词。它撤回了“急着扑来”和“拦阻”等未经标记的扩展，恢复方括号短语于正文，且保留原文强烈的殉道修辞、野兽与士兵的双重意象，以及“成为门徒”并不等同于“得称义”的张力。
