base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/067.yaml
  text: 'Keep away from noxious herbs, which are not the husbandry of Jesus Christ, because they are not the planting of the Father. Not that I have found division among you, but filtering.


    For as many as are of God and of Jesus Christ, they are with the bishop; and as many as shall repent and enter into the unity of the Church, these also shall be of God, that they may be living after Jesus Christ. Be not deceived, my brethren.


    If any man follows one that makes a schism, he does not inherit the kingdom of God. If any man walks in strange doctrine, he has no fellowship with the passion.'
translation:
  language: zh_hans
  text: '你们要远离有害的草木；它们不是耶稣基督所耕种的，因为它们不是父所栽种的。我并不是在你们中间发现了分裂，而是发现了滤清[a]。


    凡属于上帝和耶稣基督的人，都与监督[b]同在；凡悔改、进入教会合一的人，也必属于上帝，好让他们照着耶稣基督而活。弟兄们，不要受迷惑。


    若有人跟随制造分裂的人，他就不能承受上帝的国；若有人按异样的教导行事，他就与受难无分[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “滤清”所对应的词十分罕见，带有过滤、筛清的意象；也可理解为“甄别”或“经过筛滤后的纯净”。这里保留这一不寻常的比喻。
    reason: 英语见证也特意保留“filtering”；需提示读者该词的罕见性及译义的不确定范围。
  - marker: b
    text: “监督”也常译作“主教”，指当地教会的带领职分。
    reason: 说明中文教会传统中的不同术语，同时避免正文预先套用某一宗派的职制名称。
  - marker: c
    text: “受难”在这里通常理解为耶稣基督的受难；原句没有明说“基督的”。
    reason: 保留原文省略所形成的简约和轻微歧义，同时给现代读者必要的语境提示。
lexical_decisions:
- source_word: κακαὶ βοτάναι / “noxious herbs”
  choice: 有害的草木
  rationale: 保留耕种、栽种这一贯穿句子的农业比喻；“草木”比单说“杂草”更少增添原文未明确表达的判断。
- source_word: γεωργεῖ / “husbandry”
  choice: 耶稣基督所耕种的
  rationale: 按希腊语传统所见的动词意象表达，比英语名词“耕作”更符合现代汉语。
- source_word: ἀποδιϋλισμός / “filtering”
  choice: 滤清
  rationale: 这是罕见而含义不寻常的词；保留过滤、澄清的意象，不擅自解释为纪律审查、净化或分别。
- source_word: ἐπίσκοπος / “bishop”
  choice: 监督
  rationale: 采用与早期基督教职分词直接对应、且为现代中文读者可辨识的译法；脚注提示另一常见译名。
- source_word: κατὰ Ἰησοῦν Χριστόν ζῶντες / “living after Jesus Christ”
  choice: 照着耶稣基督而活
  rationale: 保留“按照、合乎耶稣基督”的开放表达，不具体化为模仿其榜样或遵守其命令。
- source_word: ἀλλοτρία γνώμη / “strange doctrine”
  choice: 异样的教导
  rationale: 既表达其与使徒群体信念相异，也避免现代汉语“奇怪教义”可能产生的轻佻语感。
- source_word: πάθος / “passion”
  choice: 受难
  rationale: 在早期基督教语境中通常指基督的受苦与受难；正文不补出“基督的”，以保留原句的简约性。
theological_decisions:
- issue: “属于上帝和耶稣基督”与“同监督在一起”的关系
  choice: 按并列和判断句直译，不把它改写成得救必须服从某一后世教制的命题
  alternative: 译成“凡得救的人都服从主教”
  rationale: 原文强调群体合一及其与监督的关系，但不宜导入后世宗派对职权范围的界定。
- issue: “与受难无分”所指的受难
  choice: 正文保留未明说承受者的表达，并在脚注说明通常理解为耶稣基督的受难
  alternative: 正文直接译成“与基督的受难无分”
  rationale: 兼顾早期基督教语境与原句形式上的省略，避免无标记地消除歧义。
- issue: 制造分裂者不能承受上帝的国
  choice: 保留原文强烈而直接的警告
  alternative: 弱化为“会妨碍属灵成长”
  rationale: 原文明确使用承受上帝国的末世性语言，不应以较温和的现代措辞消解其神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留农业、滤清、同行和有分等原文意象。段落与警告语气依见证文本处理。由于所提供材料注明希腊语源文复核尚待完成，本稿依据所给公共领域英语见证，并参照可识别的中期希腊文本词汇作审慎拟译；罕见词“滤清”尤其应在后续希腊语校勘时复核。
