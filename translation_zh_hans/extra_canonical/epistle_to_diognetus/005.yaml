review_pass:
  verdict: revise
  source_fidelity: 整体忠实保留本章的排比、悖论、历史群体称谓及“肉身／天上公民身份”等核心意象。需修正两处：第三段应明确所否定的是基督徒所持的教导并非人类才智所发现的发明，且不应将“masters/champions of a human doctrine”窄化为单纯“倡导”；“共享饭桌／不共享床榻”的原文对照不宜译成“共享妻子”。
  naturalness: 文体庄重、流畅，适合现代书面普通话。“也不过一种奇特的生活”不合现代汉语搭配，改为“不实行奇特的生活方式”。“公民生活秩序”较“公民生活方式”更能自然承载该处公共生活／公民身份的意象。
  terminology: 保留“肉身”“寄居者”“异乡人”“公民身份”等术语和意象，不将“得着生命”具体化为永生或复活。将“床榻”用于原文的性伦理对照，避免英语见证中“wives”可能造成的语义偏移。
  issues:
  - severity: medium
    issue: “他们所持守的，也不是……发明出来的东西”句法及指涉不够明确。
    rationale: 该句应说明基督徒所遵循的教导或生活准则，并非由人的聪明才智或精巧研究发现的发明；原译的“所持守的”悬置，且“东西”过泛。
  - severity: high
    issue: “他们同桌共享食物，却不共享妻子”未准确呈现原文的“饭桌／床榻”对照。
    rationale: 希腊文以共同的饭桌（τράπεζα）与非共同的床榻（κοίτη）构成警句式对偶。译作“共享妻子”既偏离“床榻”的字面意象，也可能不必要地改变陈述重点。
  - severity: low
    issue: “也不过一种奇特的生活”不自然。
    rationale: 现代汉语通常说“实行／过……生活方式”；调整不改变原意。
