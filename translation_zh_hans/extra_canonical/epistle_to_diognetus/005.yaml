base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/005.yaml
  text: 'Christians are not distinguished from the rest of humanity by where they live, by their language, or by their customs.


    They do not live in cities of their own, use a different language, or practice an unusual way of life.


    Nor do they possess an invention discovered through the intelligence or study of ingenious people, nor are they masters of any human doctrine, as some are.


    Instead, they live in Greek and barbarian cities, wherever each one’s lot has placed them, and follow the local customs in clothing, food, and the other arrangements of life. Yet the way of citizenship they display is marvelous and admittedly contrary to expectation.


    They live in their own countries, but only as temporary residents. They share in everything as citizens, yet endure every hardship as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like everyone else and have children, but they do not cast away their offspring.


    They share their meals, but not their wives.


    They are in the flesh, yet they do not live according to the flesh.


    They exist on earth, but their citizenship is in heaven.


    They obey the established laws, yet in their own lives they surpass the laws.


    They love everyone, and they are persecuted by everyone.


    They are unknown, yet they are condemned. They are put to death, yet they are endowed with life.


    They are poor, yet they make many rich. They lack everything, yet they abound in everything.


    They are dishonored, yet they are glorified in their dishonor. They are spoken of as evil, yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they show respect.


    When they do good, they are punished as evildoers. When they are punished, they rejoice as though thereby brought to life.


    The Jews wage war against them as aliens, and the Greeks persecute them; yet those who hate them cannot explain the reason for their hostility.'
translation:
  language: zh_hans
  text: '基督徒与其他人并没有因居住的地方、所说的语言或生活习俗而有所区别。


    他们不住在专属于自己的城里，不使用某种不同的语言，也不实行奇特的生活方式。


    他们所遵循的教导，并不是聪明人凭才智或钻研发明出来的；他们也不像有些人那样，奉行某种人的学说。


    相反，他们住在希腊人和外族人的城里，各人随所分得之处分散居住；在衣着、饮食和生活的其他安排上，他们遵从当地习俗。然而，他们所展现的公民生活秩序[a]却令人惊叹，公认是出人意料的。


    他们住在自己的国家，却只像寄居者；他们以公民的身份参与一切，也像异乡人一样忍受一切。对他们来说，每个异国都是故乡，每个故乡又都是异国。


    他们像众人一样结婚生儿育女，却不遗弃自己的儿女。[b]


    他们共享饭桌，却不共用床榻。[c]


    他们身在肉身之中，却不顺从肉身而活。


    他们生活在地上，公民身份却在天上。[d]


    他们服从既定的法律，却以自己的生活超越法律的要求。


    他们爱所有人，却受所有人迫害。


    他们不为人所知，却被定罪；他们被处死，却得着生命。


    他们贫穷，却使许多人富足；他们凡事缺乏，却凡事丰足。


    他们受羞辱，却在羞辱中得荣耀；他们被人毁谤，却显明是无辜的。


    他们受辱骂，反而祝福；他们受侮辱，仍然尊重别人。


    他们行善，却被当作作恶的人受惩罚；受惩罚时，他们反倒欢喜，仿佛由此得了生命。


    犹太人把他们当作异族而攻击，希腊人也迫害他们；然而，那些恨他们的人却说不出敌视他们的理由。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公民生活秩序”也可理解为“他们所呈现的公民身份生活方式”。这里不是指现代意义上的成文宪法。
    reason: 说明 citizenship/constitution 的公共生活与公民身份意象，避免现代法律术语的误解。
  - marker: b
    text: “遗弃儿女”指古代社会中把婴儿丢弃、任其死亡或被人收走的做法。
    reason: 为现代读者补充古代社会背景，避免误解为一般性的疏于照顾。
  - marker: c
    text: 原句以“共享饭桌”与“不共用床榻”形成简洁对比，强调共同生活并不包括性关系上的共有。
    reason: 保留原文“饭桌／床榻”的警句式对照，并澄清其伦理含义。
  - marker: d
    text: “公民身份”保留了原文的公民身份意象，也可译作“公民的归属”。
    reason: 指出关键词的可能译法及其比喻性质。
lexical_decisions:
- source_word: locality / speech / customs
  choice: 居住的地方、所说的语言或生活习俗
  rationale: 以自然的现代汉语表达三项并列区别，同时保留地域、语言与习俗的范围。
- source_word: barbarians
  choice: 外族人
  rationale: 古代语境中指非希腊人；避免现代汉语“野蛮人”所带来的贬损性误读。
- source_word: constitution of their own citizenship
  choice: 公民生活方式
  rationale: 保留原文关于公民身份及公共生活秩序的意象，又避免译成现代成文“宪法”。
- source_word: sojourners / strangers
  choice: 寄居者／异乡人
  rationale: 分别呈现暂居身份与不属于当地的处境，并维持段落中的对照。
- source_word: in the flesh / according to the flesh
  choice: 身在肉身之中／不顺从肉身而活
  rationale: 保留“肉身”的神学张力，且通过“顺从”说明后者不是否定身体本身。
- source_word: citizenship
  choice: 公民的归属
  rationale: 保留天上公民身份的核心意象，同时使中文表达自然。
- source_word: vindicated
  choice: 显明是无辜的
  rationale: 表达在毁谤之下最终获得证明或认可的含义，不额外指定由谁宣告。
- source_word: Greeks
  choice: 希腊人
  rationale: 按见证文本直译；在末段与“犹太人”并列时可能泛指当时的非犹太异教社会，故不擅自缩窄或扩展。
theological_decisions:
- issue: “不顺从肉身而活”的含义
  choice: 保留“肉身”及其伦理性对照
  alternative: 译作“不按人的欲望生活”
  rationale: 替代译法会把含义预先限定为欲望；正文保留身体存在与生活准则之间的张力。
- issue: 天上的 citizenship
  choice: 译为“公民的归属却在天上”
  alternative: 译为“国籍在天上”或“家乡在天上”
  rationale: “国籍”过于现代法律化，“家乡”则失去公民身份意象；所选译文兼顾可懂性与原有比喻。
- issue: “超越法律”
  choice: 以生活超越法律的要求
  alternative: 不受法律约束
  rationale: 上下文明确说他们服从法律，因此不能译成废弃或脱离法律，而是行为超过法律的最低要求。
- issue: “被处死，却得着生命”
  choice: 保留生命与死亡的悖论，不解释生命的具体性质
  alternative: 补明为“得着永生”或“复活”
  rationale: 见证文本没有在本句明说永生或复活；正文保留神学上的开放性。
- issue: 末段对犹太人与希腊人的概括
  choice: 忠实保留历史文本的群体称谓
  alternative: 泛化为“各方势力”
  rationale: 不抹去原文历史语境，也不把古代修辞扩展为对现代任何群体的断言。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话，保留原文连续的悖论、排比与对偶。鉴于所提供材料是公共领域英语见证，且古希腊语原文复核尚待进行，本稿避免在英语见证未明确之处作过度确定的词源或句法判断。
