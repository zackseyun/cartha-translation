base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/006.yaml
  text: 'In a word, what the soul is in a body, Christians are in the world.


    The soul is spread throughout all the members of the body, and Christians throughout the various cities of the world.


    The soul lives in the body, yet it is not of the body. In the same way, Christians live in the world, yet they are not of the world.


    The soul, which is invisible, is guarded within the visible body. In the same way, Christians are recognized as being in the world, yet their religion remains invisible.


    The flesh hates the soul and wages war against it, though it has suffered no wrong, because it is forbidden to indulge in pleasures. In the same way, the world hates Christians, though it has suffered no wrong from them, because they oppose its pleasures.


    The soul loves the flesh that hates it, and loves the body''s members. In the same way, Christians love those who hate them.


    The soul is enclosed in the body, yet it holds the body together. In the same way, Christians are kept in the world as in a prison, yet they themselves hold the world together.


    The soul, though itself immortal, lives in a mortal tent. In the same way, Christians live as strangers among perishable things while they await the imperishability that is in the heavens.


    The soul improves when treated harshly with respect to food and drink. In the same way, when Christians are punished, they increase more and more each day.


    So great is the role to which God has appointed them, and they are not permitted to refuse it.'
translation:
  language: zh_hans
  text: '总而言之，灵魂在身体中怎样，基督徒在世界中也怎样。


    灵魂遍布身体的各个肢体，基督徒也遍布世界各地的城邑。


    灵魂住在身体里，却不属于身体；同样，基督徒住在世界中，却不属于世界。


    灵魂看不见，却被保守在看得见的身体里；同样，人们知道基督徒身在世界中，他们的敬虔[a]却仍是看不见的。


    肉体恨恶灵魂，与它争战，尽管灵魂并没有伤害肉体，只因灵魂不许肉体放纵享乐；同样，世界恨恶基督徒，尽管基督徒并没有伤害世界，只因他们抵制世界的享乐。


    灵魂爱那恨恶它的肉体，也爱身体的各个肢体；同样，基督徒爱那些恨恶他们的人。


    灵魂被禁闭在身体里，却维系着身体；同样，基督徒被囚在世界中，如同在监牢里，却维系着世界。


    灵魂本是不死的，却住在必死的帐棚里；同样，基督徒寄居在会朽坏的事物之中，同时等候那在天上的不朽坏[b]。


    灵魂在饮食上受到苛待，反而变得更好；同样，基督徒受惩罚，人数却一天比一天增多。


    上帝所指派给他们的职责何等重大；他们不可推辞这职责。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬虔”指对上帝的敬畏、敬拜及与之相应的生活；也可译作“对上帝的敬拜”或“敬神之心”。这里强调的是虽不可由外在形体直接看见、却属于基督徒的这种实况。
    reason: 对应希腊语 θεοσέβεια 的较具体语义，并保留其涵盖敬拜与虔诚生活的范围。
  - marker: b
    text: 直译为“在天上的不朽坏”或“天上的不朽性”。此处与“会朽坏的事物”相对，原文并未明说“生命”。
    reason: 避免在正文中补入原文未明确出现的“生命”，同时说明抽象名词的汉语表达。
lexical_decisions:
- source_word: soul
  choice: 灵魂
  rationale: 保留全章灵魂—身体的核心类比；“灵魂”是现代汉语中自然且明确的对应语。
- source_word: world
  choice: 世界
  rationale: 保留其双重语境：既指基督徒居住的人世，也指敌视他们并追逐享乐的社会秩序，不将其窄化为某一特定制度。
- source_word: religion
  choice: 信仰生活
  rationale: 此处强调基督徒在世可被认出，但其内在敬虔不可见；“信仰生活”较“宗教”自然，也避免只指制度组织。以脚注保留其他可能。
- source_word: holds ... together
  choice: 维系
  rationale: 保留灵魂维持身体、基督徒维持世界这一强烈类比，又不额外说明其运作方式。
- source_word: mortal tabernacle
  choice: 必死的帐棚
  rationale: 保留原见证中生命短暂、居所暂时的形象，不平淡化为“身体”。
- source_word: sojourn
  choice: 寄居
  rationale: 表达暂居和异乡客身份，同时不暗示完全脱离现世责任。
- source_word: imperishability
  choice: 不朽坏的生命
  rationale: “不朽坏”保留与“会朽坏”之间的对照；补出“生命”使现代汉语通顺，但以脚注说明原表述更抽象。
- source_word: office / role
  choice: 职分
  rationale: 表达上帝所指派、不可擅自放弃的责任和位置，避免“职位”带来的官僚色彩。
theological_decisions:
- issue: “不属于世界”的含义
  choice: 直译为“住在世界上，却不属于世界”
  alternative: 解释为“不认同世界的价值观”或“不受世界管辖”
  rationale: 保留原文见证的神学张力，不把“世界”单一解释为道德体系、政治权力或受造界。
- issue: 基督徒“维系世界”
  choice: 保留强陈述“却维系着世界”
  alternative: 弱化为“有益于世界”或解释为“借祷告保存世界”
  rationale: 文本本身未说明维系的机制；不引入特定教义解释，也不削弱灵魂—身体类比。
- issue: 不朽坏之盼望
  choice: 译作“等候天上那不朽坏的生命”
  alternative: 译作“等候天上的不朽”或“盼望天堂里的永生”
  rationale: 保留朽坏与不朽坏的对照，同时避免将其过度具体化为地点性的“天堂生活”。
- issue: 受罚后“增多”
  choice: 明确译为人数增长
  alternative: 译为“越发兴盛”或“日益长进”
  rationale: 上下文将基督徒作为群体，英语见证的“increase”最自然地指群体增加；但古希腊语复核仍可能影响最终措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语，保留各段反复出现的“同样”以及灵魂—身体、基督徒—世界的平行结构。避免仿古虚词和宗派化术语。本稿依据所提供的公共领域英语见证及经审校的英语咨询层拟定；由于古希腊语原文复核尚未完成，凡可能受希腊词形或句法影响之处均应视为暂定，尤其是“信仰生活”“增多”和“不朽坏的生命”三处。
