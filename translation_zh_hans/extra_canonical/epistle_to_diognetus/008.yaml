  yaml_path: translation/extra_canonical/epistle_to_diognetus/008.yaml
  text: 'For what human being at all had any knowledge of what God was before he came?


    Or do you accept the empty and senseless statements of those pretentious philosophers: some of whom said that God was fire (they call that God, to which they themselves shall go), and others water, and others some other of the elements created by God?


    And yet, if any of these statements is worthy of acceptance, any other created thing might just as well be made out to be God.


    No, all this is the trickery and deceit of magicians;


    and no one has either seen or recognized him, but he revealed himself.


    And he revealed (himself) by faith, whereby alone it is given to see God.


    For God, the Master and Creator of the universe, who made all things and arranged them in order, was found to be not only friendly toward humanity, but also long-suffering.


    And such indeed he always was, and is, and will be, kind and good and dispassionate and true, and he alone is good.


    And having conceived a great and unutterable plan, he communicated it to his Son alone.


    For so long as he kept and guarded his wise design as a mystery, he seemed to neglect us and to be careless about us.


    But when he revealed it through his beloved Son, and manifested the purpose that he had prepared from the beginning, he gave us all these gifts at once: participation in his benefits, and sight and understanding of (mysteries) which none of us ever would have expected.'
translation:
  language: zh_hans
  text: '《致丢格那妥书》8


    在他来以前，世人中究竟有谁知道神到底是怎样的呢？[a]


    难道你接受那些自命不凡的哲学家空洞荒谬的说法吗？他们有的说神是火——他们把自己将要去到其中的火称为神——有的说神是水，另有的说神是神所造的其他某种元素。


    然而，如果这些说法中有任何一个值得接受，那么其他任何受造之物同样也都可以被说成是神了。


    不，这一切不过是术士的骗术和欺诈。


    从来没有人见过他，也没有人认识他；是他亲自显明了自己。


    他借着信显明自己；唯有借着信，人才蒙准得见神。[b]


    神是宇宙的主宰和创造者；他创造万物，又使万物井然有序。他显出自己不仅对人怀有善意，也恒久忍耐。


    他向来如此，现在如此，将来也必如此：仁慈、良善、不发怒、真实；唯有他是良善的。[c]


    他定下一个伟大、无法言喻的计划，只把这计划告诉他的儿子。


    只要他仍把自己智慧的旨意作为奥秘保守着，他看上去就像是忽略我们、毫不关心我们。


    但当他借着爱子将这旨意启示出来，把他从起初就预备好的意图显明时，他便把这一切恩赐同时赐给了我们：使我们同享他的恩惠，又得以看见并明白——这些事，我们中有谁曾料想得到呢？[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他来”所指的具体对象在句法上没有完全明说；也可理解为神借着他的儿子临到并显明自己。
    reason: 保留代词指代的歧义，避免正文过度解释。
  - marker: b
    text: “借着信”也可理解为“在信中”；原句强调，得见神唯独是在信这一途径或范围中才蒙许可。
    reason: 说明介词结构可能兼具工具与范围含义。
  - marker: c
    text: “不发怒”对应的词也可译作“无怒”。此处不加“不轻易”的程度限定，以保留原文用语的力度。
    reason: 避免弱化原文的表述，同时不把该词扩展为关于神一切情感状态的哲学主张。
  - marker: d
    text: 英语见证在“看见并明白”后以括号补入“奥秘”，但这不是确定的明文宾语。正文以“这些事”承接前述整体恩赐，并保留末句反问的开放性。
    reason: 交代括号补词的处理，避免将补足词写成确定原文。
lexical_decisions:
- source_word: φιλάνθρωπος / “friendly to men”
  choice: 爱人
  rationale: 表达神对人类的善意与关爱，既比“对人友好”庄重，也不把含义收窄为现代意义的慈善。
- source_word: μακρόθυμος / “long-suffering”
  choice: 恒久忍耐
  rationale: 保留长期忍耐、宽容延缓的意味，同时符合现代汉语宗教文体。
- source_word: ἀόργητος / “dispassionate”
  choice: 不轻易发怒
  rationale: 这里重点并非哲学意义上的“没有情感”，而是无怒或不动怒；此译法避免暗示神冷漠无情。
- source_word: βουλή / “plan, design”
  choice: 计划／旨意
  rationale: 首次用“计划”突出所定方案，后文用“旨意”体现智慧意图，并维持上下文衔接。
- source_word: μετασχεῖν / “participation”
  choice: 同享
  rationale: 自然表达实际有分于神的恩惠，而不采用生硬的抽象名词“参与”。
- source_word: στοιχεῖον / “element”
  choice: 元素
  rationale: 在古代宇宙论语境中指构成世界的基本要素；保留论证所需的分类含义。
theological_decisions:
- issue: “在他来以前”中“他”的指代
  choice: 保留代词，不在正文中明确解释为神、子或神的启示临到
  alternative: 译为“在神来以前”或“在神的儿子来以前”
  rationale: 现有见证文本的代词存在解释空间；正文不以补词消除这种张力，并用脚注说明。
- issue: “借着信”与“得见神”的关系
  choice: 译为“唯有借着信，人才蒙准得见神”
  alternative: 译为“神只向信他的人显现”
  rationale: 保留信作为得见神的途径，以及“蒙准／获准”的被动意味；不把句子改写成关于神向特定群体显现的断言。
- issue: “唯有他是良善的”
  choice: 按原有排他性陈述直译
  alternative: 弱化为“他全然良善”
  rationale: 保留作者明确的神学强调，不擅自协调其与受造者相对意义上的善。
- issue: 末句是否补出“奥秘”
  choice: 译为“那些……事”，不把括号中的“奥秘”纳入正文
  alternative: 译为“那些奥秘”
  rationale: “奥秘”是英语见证为补足语意所加，并非确定的明文宾语；以中性代词承接“看见并明白”的对象，更能保留原句开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。反问句和“不”保留原段的论辩力度；“江湖伎俩”传达骗术、冒牌技艺之意，但与“术士”并用以维持古代语境。神的代词统一用“他”，不使用现代汉语中的专用神性代词，以保持普通文本可读性。当前材料注明希腊文直接复核尚待完成，因此本稿以所给公共领域见证为基础，并参考其中可辨识的关键希腊词义；涉及不确定处均从宽处理，不作教派化定论。
