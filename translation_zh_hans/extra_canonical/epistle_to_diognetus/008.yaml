  - severity: low
    issue: “江湖伎俩”带有较强现代口语色彩。
    rationale: 原句指术士或魔法师的骗术与欺诈；用较中性的“骗术和欺诈”更符合本段庄重论辩文体。
  - severity: low
    issue: 末句把“那些……事”限定为“看见并明白”的宾语，且未充分表现“这些恩赐”整体出乎预料。
    rationale: 英语见证中的“mysteries”带括号，非确定明文；改以破折号后的反问承接前列的整体恩赐，可保留原句开放性。
