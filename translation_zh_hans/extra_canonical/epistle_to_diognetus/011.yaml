base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/011.yaml
  text: 'My teachings are not strange, nor are my questions perverse. Rather, having been a disciple of Apostles, I come forward as a teacher of the Gentiles, worthily presenting to those who offer themselves as disciples of the truth the lessons that have been handed down.


    For who, having been rightly taught and having entered into friendship with the Word, does not seek to learn clearly the lessons openly revealed by the Word to the disciples? The Word appeared to them and declared these lessons, speaking plainly. He was not perceived by the unbelieving, but related them to disciples who, being counted faithful by Him, were taught the mysteries of the Father.


    For this reason He sent forth the Word, so that He might appear to the world. Though He was dishonored by the people and preached by the Apostles, He was believed in by the Gentiles.


    This Word, who was from the beginning, who appeared as new and yet was shown to be old, and who is always engendered young in the hearts of saints,


    He, I say, is eternal. Today He was accounted a Son. Through Him the Church is enriched, and grace is unfolded and multiplied among the saints: grace that gives understanding, reveals mysteries, announces seasons, rejoices over the faithful, and is bestowed on those who seek her—those by whom the pledges of faith are not broken and the boundaries of the fathers are not overstepped.


    Therefore the fear of the law is sung, the grace of the prophets is recognized, the faith of the gospels is established, the tradition of the apostles is preserved, and the joy of the Church exults.


    If you do not grieve this grace, you will understand the teachings that the Word delivers through the mouths of those whom He desires, when He wishes.


    For in everything that, by the will of the commanding Word, we were moved to utter with great effort, we become sharers with you through love for the things revealed to us.'
translation:
  language: zh_hans
  text: '我的讲论并不怪异，我的探问也不乖谬。相反，我既作过使徒们的门徒，如今便出来作外邦人的教师，把传承下来的教导恰当地供给那些愿意成为真理门徒的人。


    因为，凡受过正确教导、与道结为朋友的人，谁不愿清楚领会道向门徒公开显明的教导呢？道曾向他们显现，明明白白地宣讲这些事。不信的人没有认出他；他却把这些事告诉门徒，并认定他们忠信，使他们得以领受父的奥秘。


    为此，他差遣道，使他向世人显现。这道虽受那百姓轻慢，却由使徒们传扬，并为外邦人所信。


    这道从起初就有；他显现时似乎是新的，却显明原是古老的；他又常在圣徒心里生发，永远年轻。


    我所说的这一位是永恒的，今日被称为儿子。[a] 教会借着他得以丰富，恩典也在圣徒中展开并增多。这恩典赐人悟性，揭示奥秘，宣告时机，为忠信的人欢喜，又赐给寻求她的人——就是那些不背弃信仰的保证，也不越过先辈所定界限的人。[b]


    于是，人歌咏律法所生的敬畏，认识先知的恩典，福音的信仰得以坚立，使徒的传承得以保存，教会的喜乐也满溢欢腾。


    你若不叫这恩典忧伤，就会明白道在自己愿意的时候，借他所愿意之人的口所讲的言语。


    至于我们奉发令之道的旨意，辛苦受催促而说出的一切，我们因爱那向我们显明的事，便与你们一同分享。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今日被称为儿子”也可理解为“今日被认作儿子”或“今日显明为儿子”。现存底本已失，仅由抄本副本及旧译见证传存；希腊文措辞尚待直接复核。
    reason: 此句在时间、宣认与身份关系上含有真实歧义，需避免过度解释。
  - marker: b
    text: “信仰的保证”所对应的表达也可能指信仰的凭据、托付或约定；“先辈所定界限”所指的具体传统或规范并不明确。
    reason: 两个短语在现有英语见证中语义范围较宽，且尚未完成希腊文核查。
lexical_decisions:
- source_word: Word (Greek source review pending; traditionally λόγος)
  choice: 道
  rationale: 沿用早期基督教汉语语境中对 Logos 的通行译法，同时保留其作为言语、启示者及位格称谓的多重含义。
- source_word: Gentiles
  choice: 外邦人
  rationale: 保留原文宗教与族群语境，不弱化为泛指的“各国人”。
- source_word: mysteries of the Father
  choice: 父的奥秘
  rationale: 保持原文神学表达的开放性，不擅自解释为某套特定教义或礼仪。
- source_word: engendered always young
  choice: 常在圣徒心里生发，永远年轻
  rationale: 兼顾生成意象与现代汉语可读性，避免把难解表达具体化为“重生”之类后起术语。
- source_word: grace
  choice: 恩典
  rationale: 采用现代汉语基督教文本中的自然对应词；后文保留“她”的代词，以反映见证文本对 grace 的阴性拟人化。
- source_word: seasons
  choice: 时机
  rationale: 保留受安排或具有意义的时段之义，不强行限定为节期、时代或末世日期。
- source_word: pledges of faith
  choice: 信仰的保证
  rationale: 保留 pledge 可指保证、凭据或托付的模糊性，并以脚注提示不确定范围。
- source_word: boundaries of the fathers
  choice: 先辈所定界限
  rationale: 将 fathers 译为较中性的“先辈”，避免未经希腊文核查便限定为教父、祖先或宗教领袖。
- source_word: fear of the law
  choice: 律法所生的敬畏
  rationale: 以属格关系较自然的汉语表达，同时不把“敬畏”对象过早固定为律法本身或上帝。
- source_word: commanding Word
  choice: 发令之道
  rationale: 保留 Word 的位格连续性及 commanding 的命令意味。
theological_decisions:
- issue: “他差遣道”中主语与道的关系
  choice: 保留“他差遣道，使他向世人显现”的代词结构
  alternative: 明确写成“父差遣他的道，使道向世人显现”
  rationale: 现有英语见证没有在本句直接点明差遣者；在希腊文复核之前，不补入“父”，也不消除代词所含的张力。
- issue: “今日被称为儿子”的时间与身份含义
  choice: 直译并加脚注说明歧义
  alternative: 译作“如今被认明为上帝的儿子”或“今日生为儿子”
  rationale: “今日”及“被称为/算为”的关系可能涉及宣认、显明或生成语言；不以宗派化解释替代文本。
- issue: 恩典的拟人化
  choice: 后文用“她”指代恩典
  alternative: 统一用无性别的“它”或重复“恩典”
  rationale: 英语见证明确使用 her；保留拟人化有助于呈现原文修辞，但不据此断言恩典是独立位格。
- issue: 律法、先知、福音与使徒传承的关系
  choice: 保留并列且正面的陈述
  alternative: 把律法与恩典处理为对立关系
  rationale: 本段把各项置于共同欢庆的结果中，译文不引入律法与福音必然对立的框架。
- issue: “先辈的界限”所指
  choice: 保持概括表达
  alternative: 明确为正统教义、教会法规或使徒传统
  rationale: 见证文本不足以确定具体所指，故保留历史与神学张力。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“使徒们”“外邦人”“圣徒”“恩典”等保留早期基督教文本的历史语域；句法适度拆分，以免旧译长句妨碍理解。由于所给 drafting basis 明示希腊文复核尚待完成，本文是依据公共领域英语见证并参考审校层所作的暂定出版草案；凡关键歧义均尽量保留，并以脚注标示。
