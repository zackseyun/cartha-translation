base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/003.yaml
  text: 'Next, I think you are especially eager to hear why they do not practice their religion in the same way as the Jews.


    The Jews, then, do well when they avoid the kind of worship described above and claim to reverence the one God of the universe and regard him as Master. But when they offer him worship by methods like those already mentioned, they are completely mistaken.


    For the Greeks display their foolishness by offering these things to senseless and deaf images. But the Jews, thinking that they are presenting them to God as though he needed them, should rightly consider this folly rather than religious worship.


    For he who made heaven and earth and everything in them, and who provides us all with what we need, cannot himself need any of the things that he supplies to those who imagine they are giving them to him.


    But those who think they can offer sacrifices to him with blood, fat, and whole burnt offerings, and honor him with such honors, seem to me no different from those who show the same respect toward deaf images. For the first group thinks it proper to make offerings to things unable to receive the honor, while the other makes offerings to one who needs nothing.'
translation:
  language: zh_hans
  text: '《致丢格那妥书》第3章


    接下来，我想你尤其急于知道，为什么他们不像犹太人那样敬拜。


    犹太人不采用上文所说的那种敬拜方式，并且宣称自己敬奉宇宙间独一的上帝，以他为主宰；在这一点上，他们做得对。然而，他们若用与前面所提相似的方式向他献上敬拜，就完全错了。


    希腊人把这些东西献给没有知觉、不能听见的神像，显出了自己的愚昧；犹太人则以为自己是在把这些东西献给上帝，仿佛他有所缺乏。按理说，他们应当把这种做法看作愚昧，而不是敬拜。


    因为，那位创造天地和其中万物、又把我们所需的一切供给众人的上帝，自己绝不可能需要这些东西；而这些东西本来正是他供给那些自以为是在献给他的人的。


    至于那些以为可以用血、脂油和全燔祭向他献祭，并用这样的尊荣来尊崇他的人，在我看来，与那些同样尊崇不能听见的神像的人毫无分别：一方认为应当把供物献给根本无法领受这尊荣的东西，另一方则把供物献给那位一无所缺的上帝。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: practice their religion
  choice: 敬拜
  rationale: 本章语境集中于献供物和献祭等敬拜行为；译作“敬拜”比宽泛的“奉行宗教”更自然、准确。
- source_word: one God of the universe
  choice: 宇宙间独一的上帝
  rationale: 保留“独一”与“宇宙万有之神”的双重含义，同时避免生硬直译。
- source_word: Master
  choice: 主宰
  rationale: 表达上帝对万有的权柄；较“主人”更符合庄重的神学语域。
- source_word: senseless and deaf images
  choice: 没有知觉、不能听见的神像
  rationale: 分别保留无感知能力与耳聋这两个修辞要素，不笼统弱化为“无生命的偶像”。
- source_word: whole burnt offerings
  choice: 全燔祭
  rationale: 这是祭物全部焚烧的特定祭礼术语；“全燔祭”在中文宗教文献中明确且易辨。
- source_word: unable to participate in the honor
  choice: 根本无法领受这尊荣
  rationale: 保留神像没有能力成为尊荣接受者的论证重点，并使中文表达通顺。
theological_decisions:
- issue: 本章对犹太献祭的批评范围
  choice: 按作者原有概括保留其尖锐批评，不增添解释或限定
  alternative: 将批评限定为错误心态、特定时代或某类滥用祭礼
  rationale: 现有见证文本直接把血、脂油和全燔祭与对神像的供奉并置；译者不应擅自替作者缓和或作宗派性协调。
- issue: 上帝是否“需要”祭物
  choice: 译为上帝“一无所缺”且“绝不可能需要”这些东西
  alternative: 译成上帝不悦纳或不要求这些祭物
  rationale: 原论证关乎上帝的自足，而非直接论断祭物是否蒙悦纳；译文保留这一神学焦点。
- issue: “他们”所指的人群
  choice: 首段保留“他们”，承接前文所论群体
  alternative: 直接补明为“基督徒”
  rationale: 本章在现有段落中没有重新明说所指对象；保留代词既忠于篇章衔接，也不在译文中添加原文未显说的称谓。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留作者第一人称“我想”“在我看来”，也保留其论辩的鲜明力度。因所提供材料注明希腊文复核尚待完成，本稿严格依据现有公共领域英文见证及经审校的英文咨询层起草，未把无法由现有材料验证的希腊词形或句法主张写入正文或脚注。
