base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/010.yaml
  text: 'If you also desire this faith, first grasp the full knowledge of the Father.


    For God loved those for whose sake he made the world, to whom he subjected everything on earth, to whom he gave reason and understanding, whom alone he permitted to look up to heaven, whom he created in his own image, to whom he sent his only-begotten Son, to whom he promised the kingdom in heaven, and to whom he will give it—those who have loved him.


    And when you have attained this full knowledge, with what joy do you think you will be filled? How will you love him who loved you first?


    By loving him, you will imitate his goodness. Do not be amazed that a human being can imitate God. One can, if God wills it.


    For happiness does not consist in ruling over one’s neighbors, desiring to have more than weaker people, possessing wealth, or using force against inferiors. No one can imitate God in these matters; indeed, these things lie outside his greatness.


    But whoever takes upon himself his neighbor’s burden, whoever desires to benefit someone worse off in an area where he himself is better off, and whoever supplies those in need with possessions he received from God, becoming a god to those who receive them from him—this person imitates God.


    Then, although you are placed on earth, you will see that God lives in heaven. Then you will begin to declare the mysteries of God. Then you will both love and admire those who are punished because they refuse to deny God. Then you will condemn the deceit and error of the world, when you perceive the true life that is in heaven, when you despise the apparent death that is here on earth, and when you fear the real death reserved for those who will be condemned to the eternal fire, which will punish those delivered over to it until the end.


    Then you will admire those who endure, for righteousness’ sake, the fire that lasts only for a season, and you will count them blessed when you perceive that fire...'
translation:
  language: zh_hans
  text: '《致丢格那妥书》10


    如果你也渴望这样的信仰，首先要充分认识父。


    因为神爱人类；他为他们创造了世界，使地上的万物都服在他们之下，赐给他们理性和心智，唯独让他们能够仰望天上；他照着自己的形象创造他们，把自己的独生子差给他们，又应许把天上的国赐给他们——就是那些爱他的人。


    当你充分认识了父，你想自己会充满何等的喜乐？你又会怎样爱那位先爱你的呢？


    你爱他，就会效法他的良善。不要惊讶，人竟能效法神；只要神愿意，人就能做到。


    福乐不在于辖制邻舍，也不在于企图比弱小的人拥有更多；不在于占有财富，也不在于以强力欺压地位较低的人。没有人能在这些事上效法神；这些事与他的伟大毫不相称。


    可是，谁担当邻舍的重担，谁愿意用自己的长处帮助处境不如自己的人，谁把从神领受的财物供给缺乏的人，因而成了领受者的神[a]，谁就是在效法神。


    到那时，你虽然身处地上，却会看见神在天上生活；到那时，你将开始宣扬神的奥秘；到那时，你会爱慕并敬佩那些因不肯否认神而受刑的人；到那时，你会看清世上的欺骗与谬误。当你认识天上那真实的生命，就会轻看地上这看似的死亡，并且惧怕那真正的死亡。这死亡是为那些要被定罪、交付永火的人预备的；这火要惩罚被交给它的人，直到终局[b]。


    到那时，你会敬佩那些为义忍受短暂烈火的人；当你看清那火……[c]，你就会称他们为有福。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成了领受者的神”是本段的大胆比喻，指施予者把从神所得的供给缺乏者，因而在良善上效法神；这里并非明确宣称人取得神的本体或身份。
    reason: 保留原文神学与修辞张力，同时防止现代读者误解。
  - marker: b
    text: “直到终局”也可译作“直到末了”。这句话本身没有明确说明终局之后如何，不宜据此额外推断。
    reason: 避免把有歧义的时间表达教义化。
  - marker: c
    text: 现存文本在此处残缺，句子没有完成；省略号据此保留。
    reason: 标明传本文本中断，不虚构缺失内容。
lexical_decisions:
- source_word: ἐπίγνωσις (as reflected in “full knowledge”)
  choice: 认识
  rationale: 用现代汉语自然表达对父真实而充分的认识，避免生硬的“完全知识”，也不把它缩减为仅有资讯层面的了解。
- source_word: τοὺς ἀνθρώπους (recoverable behind the defective English witness)
  choice: 人类
  rationale: 所给英文见证在“God loved”后疑有漏词；现存希腊文传统通常作“人类／人们”，此处据此恢复，使后续一连串复数关系从句有明确先行词。
- source_word: μακαριότης / happiness
  choice: 福乐
  rationale: 兼顾蒙福、幸福与美善生活的含义，比单纯的情绪性“快乐”更符合上下文。
- source_word: μιμητής / imitate
  choice: 效法
  rationale: 表达以神的良善为行为榜样，而非机械模仿。
- source_word: πολιτεύεται (underlying “lives” in the witness)
  choice: 掌权
  rationale: 该词可指生活、行事或治理；上下文关乎神在天上的地位与作为，“掌权”较能传达其公共治理色彩，同时以脚注保留词义范围。
- source_word: εἰς τέλος / “until the end”
  choice: 直到终局
  rationale: 保留“直到末了／终局”的开放性，不擅自解释为刑罚终止或绝不终止。
theological_decisions:
- issue: “成了领受者的神”是否意味着人成为本体意义上的神
  choice: 正文保留强烈原喻“成了领受者的神”，并加脚注说明语境
  alternative: 译作“对领受者仿佛神一般”或“成为神的代表”
  rationale: 原文刻意以大胆措辞描述施予者在受助者面前效法神的供应；弱化会消除修辞张力，直译而注释则避免导入人的本体神化。
- issue: 永火“直到终局”的时间含义
  choice: 直译为“直到终局”，不判定其后是否结束
  alternative: “永远惩罚”或“直到刑罚完毕”
  rationale: 文本同时使用“永火”与“直到末了”一类表述；应保留二者之间的张力，不据宗派立场加以系统化。
- issue: “神在天上”所表达的是居住、生活还是治理
  choice: 译为“神在天上掌权”，脚注列出另一可能
  alternative: “神住在天上”或“神在天上生活”
  rationale: 希腊词可能兼有生活与施行治理之意；“掌权”贴合此处天上真实秩序与地上虚妄秩序的对照，但不宣称词义只有这一种。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留第二人称单数劝勉的直接语气，但不使用古奥的“尔、汝”。排比句适度分节，以保存原文修辞推进。所给资料标明希腊文复核尚待完成；本稿参考可恢复的希腊措辞，并对英文见证中“God loved”后的明显缺项作最小恢复。
