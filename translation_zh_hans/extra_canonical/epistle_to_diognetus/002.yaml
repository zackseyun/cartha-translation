base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/002.yaml
  text: 'Come, then, clear your mind of all the preconceptions that occupy it, throw off the habit that leads you astray, and become, as it were, a new person from the beginning—someone ready to hear a new account, just as you yourself confessed. Look not only with your eyes but also with your understanding at the substance and form of those whom you call and regard as gods.


    Is not one of them stone, like what we tread underfoot, and another bronze, no better than the vessels forged for our use; another wood, which has already rotted; another silver, which needs someone to guard it so that it is not stolen; another iron, which is corroded by rust; and another earthenware, no more attractive than what is supplied for the most dishonorable service?


    Are not all these made of perishable material? Are they not fashioned by iron and fire? Did not the sculptor make one, the bronze-worker another, the silversmith another, and the potter another? Before they were molded into these shapes by the skills of these various craftspeople, could not each of them have been reshaped and made to resemble these various utensils? Could not the vessels now made from the same material, if they came into the hands of the same craftspeople, be made like these gods?


    Could not these things that you now worship be made again by human hands into vessels like the rest? Are they not all deaf and blind? Are they not without souls, without senses, and motionless? Do they not all rot and decay?


    These things you call gods; to these you are servants; these you worship; and you end up becoming altogether like them.


    Therefore you hate the Christians because they do not consider these things to be gods.


    For do not you yourselves, who now regard and worship them, despise them much more? Do you not rather mock and insult them by leaving those made of stone and earthenware unguarded, while locking up those made of silver and gold at night and setting guards over them by day to prevent them from being stolen?


    As for the honors you think you offer them, if they can perceive them, you actually punish them by these honors; but if they cannot perceive them, you reproach them by trying to appease them with the blood and fat of sacrificial victims.


    Let one of you undergo this treatment; let him submit to having these things done to him. No, not even a single person would willingly submit to such punishment, because he has feeling and reason. But a stone submits because it has no feeling. Therefore you convict its sensibility.


    Well, I could say much more about the Christians not being enslaved to gods such as these. But if anyone considers what has been said insufficient, I think it unnecessary to say more.'
translation:
  language: zh_hans
  text: '那么，来吧！要清除盘踞在你心里的一切成见，摆脱那使你误入歧途的习惯，仿佛从头开始，成为一个新人，准备听一番新的讲述，正如你自己所承认的。对于那些你们称为神、也当作神的，要察看它们究竟是什么质料、什么形状；不但要用眼睛看，也要用理智察验。


    其中一个岂不是石头，和我们脚下所踩的一样吗？另一个是铜，丝毫不比为我们日用而打造的器皿更好；另一个是木头，已经腐朽；另一个是银子做的，需要有人看守，免得被偷；另一个是铁，受锈侵蚀；还有一个是陶土制品，并不比供最卑贱用途的器皿美观。


    这一切不都是用会朽坏的材料制成的吗？不都是用铁和火加工出来的吗？这一个不是雕刻匠做的，那一个不是铜匠做的，另一个不是银匠做的，又一个不是陶匠做的吗？这些材料尚未被各门工匠凭手艺塑成如今的形状以前，岂不能各自改换形状，做成上述各样器皿的样式吗？如今由同样材料制成的器皿，若交给同类工匠，岂不能做成这些神像的样式吗？


    你们如今所敬拜的这些东西，岂不能再由人的手做成其他器皿，和其余器皿一样吗？它们不都是又聋又瞎、没有生命、没有知觉、不能动弹的吗？它们不都会腐朽败坏吗？


    这些东西，你们称为神；你们服事它们，敬拜它们，到头来竟完全变得和它们一样。


    所以，你们恨基督徒，因为基督徒不把这些东西当作神。


    可是，如今把它们当作神来敬拜的你们自己，岂不是更加轻视它们吗？你们让石头和陶土制成的神像无人看守，却在夜间把银子和金子制成的锁起来，白天又派人看守，以免被偷；这岂不是反而嘲弄、侮辱它们吗？


    至于你们自以为献给它们的尊荣：它们若能感受，你们这样做反而是在折磨它们；它们若不能感受，你们用祭牲的血和脂肪来安抚它们，反倒是在羞辱它们。


    让你们中间一个人受这样的对待吧，让他任凭这些事行在自己身上吧！不，连一个人也不会甘愿承受这种折磨，因为人有知觉，也有理性；石头却任凭这一切，因为它没有知觉。因此，你们正显明它毫无知觉。


    关于基督徒不受这类神明奴役的事，我还可以说许多。不过，若有人认为以上所说的还不够，我倒觉得再多说也是多余的。'
