review_pass:
  verdict: revise
  source_fidelity: 整体准确传达该章针对人工偶像的连串反问、讽刺及祭祀批评。惟第三段将可改换形状的对象译为“这些材料”，原见证的 each one 指前述受拜之物，宜改为“它们每一个”。“soul-less”宜保留为“没有灵魂”，不宜泛化为“没有生命”。末段 sensibility 的反常结语在所给英文见证中确有张力；在希腊文直接复核尚待进行的条件下，应保留其表面读法并以脚注注明。
  naturalness: 文体庄重、可朗读，反问与讽刺的节奏基本自然。个别措辞可更贴合现代汉语及指代：开头“对于那些你们称为神、也当作神的”略显滞涩；“同一批工匠”引入不必要的“批”；“供最卑贱用途的器皿”可简化为“供最卑贱用途之物”。
  terminology: “成见、质料、理智、安抚、受……奴役”等选择稳妥，并未导入宗派性表述。为对应 soul-less / senseless / motionless 三项并列，改用“没有灵魂、没有知觉、不能动弹”。“神像”在材料段是合语境的，但原文的广义指称在其他位置保留为“这些东西”。
  issues:
  - severity: medium
    issue: 第三段“这些材料尚未被……塑成如今的形状以前，岂不能各自改换形状”改变了被重塑的对象。
    rationale: 英文见证的 each one 指前述各个受敬拜之物；材料本身被“塑成形状”后再“改换形状”的说法虽可理解，却弱化原文的反讽：偶像本身本可被改作普通器物。
  - severity: medium
    issue: “soul-less”译作“没有生命”。
    rationale: “没有生命”与后面的“没有知觉、不能动弹”意义重叠，也没有保留原见证明示的 soul-less 概念；“没有灵魂”在此为非宗派、直接的对应。
  - severity: low
    issue: “同一批工匠”及开头的个别指代表达略有增译或滞涩。
    rationale: “同样的工匠”更直接对应 same artificers；调整开头语序可使“称为并视为神”的宾语关系清楚。
