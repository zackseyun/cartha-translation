lexical_decisions:
- source_word: prepossessions
  choice: 成见
  rationale: 按现有英文见证所表达的先入观念处理；“成见”自然且保留其妨碍理解的负面意味。
- source_word: intellect
  choice: 理智
  rationale: 与“眼睛”形成外在观看和理性察验的对照，较“心眼”少作解释。
- source_word: substance / form
  choice: 质料／形状
  rationale: 保留论证中材料与外形的哲学性区分，并与下文各种制作材料及重塑形状相呼应。
- source_word: soul-less, senseless, motionless
  choice: 没有生命、没有知觉、不能动弹
  rationale: 用现代普通读者易懂的并列语表达原见证的递进，不把“soul”扩展成特定宗派的人论术语。
- source_word: servants / enslaved
  choice: 服事／受……奴役
  rationale: 前者配合敬拜语境，末段则保留奴役这一强烈意象。
- source_word: propitiating
  choice: 安抚
  rationale: 表达以祭物平息或取悦对象的祭祀行为，同时避免导入后世系统神学术语。
- source_word: sensibility
  choice: 知觉
  rationale: 与前句“没有知觉”保持词义和反讽结构的一致。
theological_decisions:
- issue: 作者对偶像的论证是否应译成针对一切神明的普遍断言
  choice: 保留“这些东西／这类神明”的具体指向
  alternative: 概括为“所有异教神明”
  rationale: 本文直接攻击由会朽坏材料和人工制成的受拜对象；不扩大原有论证范围。
- issue: 祭牲之血和脂肪的功能
  choice: 译为“安抚”
  alternative: 译为“赎罪”或“献上赎罪祭”
  rationale: 现有见证只支持平息、讨好受祭对象之意，不应加入基督教赎罪论含义。
- issue: “Therefore ye convict his sensibility”的明显张力
  choice: 正文直译为“因此，你们倒证明它有知觉了”，并加脚注说明
  alternative: 按上下文修正为“因此，你们正证明它没有知觉”
  rationale: 现存英文见证与POB咨询层都保存这一反常表述；在希腊文复核尚待进行时，不宜静默校正。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。保留原段连续反问和讽刺力度；第二人称单数开场译作“你”，随后群体性指称译作“你们”。鉴于所供 drafting_basis 明示希腊文复核尚待进行，本稿属于以公共领域英文见证和经审校英文POB为辅助的暂定出版草稿，疑难处以脚注标明。
