base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/004.yaml
  text: 'But again their scruples concerning food, and their superstition relating to the Sabbath, and the vanity of their circumcision, and the pretense of their fasting and new moons, I do [not] suppose you need to learn from me, are ridiculous and unworthy of any consideration.


    For to receive some of the things created by God for human use as created well, but to decline others as useless and superfluous, is not this impious?


    And again, to lie against God, as if he forbade us to do any good thing on the Sabbath day, is not this profane?


    Again, to boast of the mutilation of the flesh as a token of election, as though for this reason they were particularly beloved by God, is not this ridiculous?


    And to watch the stars and the moon and to keep the observance of months and days, and to distinguish the arrangements of God and the changes of the seasons according to their own impulses, making some into festivals and others into times of mourning, who would regard this as an exhibition of godliness and not much more of folly?


    That the Christians are right, therefore, in holding aloof from the common silliness and error of the Jews, and from their excessive fussiness and pride, I consider that you have been sufficiently instructed; but as regards the mystery of their own religion, do not expect that you can be instructed by man.'
translation:
  language: zh_hans
  text: '至于他们对食物的种种顾忌、有关安息日的迷信、以割礼自夸的虚妄，以及在禁食和月朔之事上的装模作样，我想这些事何等可笑、何等不值得认真看待，你无须由我来指教。[a]


    上帝所造、供人使用的事物，他们把一些当作造得好的而接受，却拒绝另一些，视之为无用而多余；这岂不是不敬虔吗？


    再者，他们仿佛上帝禁止人在安息日行任何善事，这样歪曲上帝，岂不是亵渎吗？


    他们又夸耀肉身受割损，以此作为蒙拣选的标记，仿佛他们因此格外蒙上帝所爱；这岂不可笑吗？


    他们观测星辰和月亮，谨守月份和日子的规例，又凭自己的意愿区分上帝所定的秩序与季节的变换，把某些日子定为节庆，把另一些日子定为哀悼之时；谁会认为这是敬虔的表现，而不更认为是愚昧呢？


    所以，基督徒远离犹太人普遍的愚昧和错谬，也远离他们过度的拘泥与自夸，这是对的；我想，你对此已经得到了充分的指教。至于基督徒自身信仰的奥秘，不要以为人能把它传授给你。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存见证在“我想”之后的“不是”带有补入或校勘性质；据此本句意为“你无须由我来指教”。希腊文原文尚待直接复核。
    reason: 保留所提供英文见证中方括号 [not] 的文本恢复信号及其对句义的影响。
  - marker: b
    text: 本章现存文本来自已失传的《斯特拉斯堡抄本》之传抄材料；本译稿暂据所提供的公版英文见证起草，仍待希腊文逐词复核。
    reason: 公开交代当前底本限制，避免把英文见证误作已完成核验的希腊文直译。
lexical_decisions:
- source_word: scruples concerning meats
  choice: 对食物的种种顾忌
  rationale: 保留饮食禁忌与良心顾虑的语义，不窄化为某一种具体食物律例。
- source_word: superstition relating to the Sabbath
  choice: 有关安息日的迷信
  rationale: 保留原文尖锐的论辩性评价，同时用现代汉语自然表达。
- source_word: vanity of their circumcision
  choice: 以割礼自夸的虚妄
  rationale: 结合后文“夸耀”说明其所指并非割礼动作本身的空无，而是把割礼当作优越凭据的虚妄。
- source_word: dissimulation
  choice: 装模作样
  rationale: 表达外在宗教行为带有伪饰、假装的贬义；因希腊文复核尚待完成，不进一步细化。
- source_word: new moons
  choice: 月朔
  rationale: 采用中文宗教与历法语境中易辨识的表达，指每月初一相关的礼仪性遵守。
- source_word: mutilation of the flesh
  choice: 肉身受割损
  rationale: 保留作者刻意强烈、贬抑的说法，并避免使用过度现代医学化的术语。
- source_word: token of election
  choice: 蒙拣选的标记
  rationale: 保留“拣选”的神学含义，也明确其作为可见记号的功能。
- source_word: mystery of their own religion
  choice: 基督徒自身信仰的奥秘
  rationale: “奥秘”保留神圣真理并非单靠人力获得的意味；“信仰”比现代汉语中的“宗教”更贴合此处。
theological_decisions:
- issue: 作者对犹太礼俗的论辩性批评
  choice: 忠实保留其尖锐语气，并明确这是文本中对相关实践及其理解方式的批评
  alternative: 以较温和语言概括为基督徒与犹太教礼俗不同
  rationale: 弱化会抹去古代文本真实的论辩张力；译文不应另行扩大为对所有犹太人的现代泛化判断。
- issue: 安息日与行善
  choice: 译为“仿佛上帝禁止人在安息日行任何善事”
  alternative: 译为“禁止在安息日做任何事情”
  rationale: 原证据明确强调“任何善事”，应保留作者对禁令之解释的具体指控。
- issue: 人的教导与信仰奥秘
  choice: 译为“不要以为人能把它传授给你”
  alternative: 译为“人绝不能对此作任何教导”
  rationale: 保留格言式张力，不擅自解释为完全否定人的宣讲、教导或见证。
