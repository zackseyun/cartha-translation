    reason: 希腊语原文复核尚待进行，且现有见证的 true reason 存在语义开放性。
  - marker: d
    text: “夏娃没有被败坏，反而作为童女受到信靠”是现有见证中的异常表述，可能涉及文本残缺或象征性语言；本译文未将其改释为马利亚或教会。
    reason: 保留原有难解之处和神学张力，防止无证据的协调。
  - marker: e
    text: 方括号中的“万事”来自见证中的补足。
    reason: 保存编辑性补文标记。
lexical_decisions:
- source_word: knowledge
  choice: 知识
  rationale: 保留全章在知识树、真知识及保罗引文之间的词语关联，不改译为较窄的“认知”或“智慧”。
- source_word: charity
  choice: 爱
  rationale: 此处引用《哥林多前书》8:1，现代汉语用“爱”自然准确，也避免“慈善”的现代窄义。
- source_word: fear
  choice: 敬畏
  rationale: 在宗教语境中表达面对神与生命时肃敬的态度，不仅是害怕。
- source_word: true reason
  choice: 真正的理性
  rationale: 保留见证中较抽象且可能含有 logos 色彩的表达，不擅自具体化为“道”或“教义”。
- source_word: the Word
  choice: 圣言
  rationale: 末段带位格指向，并以“他”为关系代词；译作“圣言”既显示其特殊称谓，又避免与普通话语混淆。
- source_word: Passover of the Lord
  choice: 主的逾越节
  rationale: 直译其礼仪与救赎历史意象，不将其直接等同或替换为“复活节”。
- source_word: congregations
  choice: 会众
  rationale: 保留复数聚集群体的含义，不预设后世制度化教会结构。
theological_decisions:
- issue: 知识树与死亡的关系
  choice: “致人死亡的不是知识树，而是悖逆”
  alternative: 将知识树本身描述为危险或邪恶
  rationale: 忠实保留作者明确的神学对照：受责备的是悖逆以及脱离生命之诫命的知识，而非知识本身。
- issue: 知识与生命的相互关系
  choice: 保留“没有知识，就没有生命；没有真实的生命，也就没有健全的知识”的双向陈述
  alternative: 把其中一项解释为另一项的单向结果
  rationale: 原见证有意维持二者彼此相属的张力，不宜系统化处理。
- issue: 夏娃作为童女受到信靠
  choice: 按见证保留这一反常且含义不明的表述
  alternative: 改成“童女夏娃得到恢复”或将夏娃解释为马利亚、教会
  rationale: 文本意义和可能的文本史问题均不确定，不应以教义协调代替翻译。
- issue: 末句代词所指
  choice: 将“他”就近理解为圣言，并保留父借着他得荣耀
  alternative: 将荣耀直接只归给父，或明确称圣言为基督
  rationale: 见证的关系结构指向圣言，但没有必要在正文中加入原文未明说的“基督”。
- issue: “主的逾越节继续向前”
  choice: 保留动态而含混的说法
  alternative: 解释为礼仪被举行、福音扩展或基督受难实现
  rationale: 英语见证的 goes forward 语义开放，直译式自然表达较能保存其多重可能。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。第二人称随原文由复数“你们”转为单数“你”。由于希腊语原文复核尚待进行，本稿以所给公共领域英语见证为主要起草依据，并把方括号、异常句法及神学含混处显式保留；避免用后世宗派术语消解“知识—生命”、夏娃、逾越节及圣言等处的张力。
