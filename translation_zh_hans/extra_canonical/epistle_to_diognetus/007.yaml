  - marker: c
    text: “一个人”在传世英译见证中以方括号标出，可能是据上下文补足；此句也可较直译为“差他到人那里”。
    reason: 保留修复信号及句法歧义。
  - marker: d
    text: 此处前文有缺失；“你难道没有看见”是补足的衔接语。省略号和方括号标示传本残缺及重构。
    reason: 明确段落跳跃源于文本缺损，而非作者正常转折。
lexical_decisions:
- source_word: earthly discovery
  choice: 属世的发现
  rationale: 保留其与来自天上的启示之间的对照；“属世”比单纯“世俗”更适合此处的空间与神学双重意味。
- source_word: dispensation / administration
  choice: 管理／料理
  rationale: 按上下文译为受托管理事务，避免用可能带有后世神学体系色彩的专门术语。
- source_word: Artificer and Creator
  choice: 缔造者和创造者
  rationale: 保留两个近义称号的并列与修辞力度，同时使用现代汉语可懂的表达。
- source_word: mysteries
  choice: 奥秘
  rationale: 保留原见证中既可指隐秘安排、也可指神圣秩序的语义张力，不具体化为“自然规律”。
- source_word: using persuasion, not force
  choice: 以劝服而非强迫行事
  rationale: 自然表达其行动方式，并保留劝服与强制的鲜明对比。
- source_word: presence
  choice: 临在
  rationale: 同时容纳亲自到场和神圣显现的意味，不弱化为普通的“出现”。
theological_decisions:
- issue: 差遣者与受差遣者的身份及代词关系
  choice: 使用“上帝”明确差遣者，并以“他／这一位”指受差遣者
  alternative: 全程机械保留两个同形代词“他”
  rationale: 中文若全用“他”会造成非原文所要求的混乱；但译文仍保留“差遣上帝”“同为君王的儿子”等高基督论表述，不替文本作后世教义定义。
- issue: “He sent Him, as God”
  choice: “他差遣他，是差遣上帝”
  alternative: “他把他当作上帝差来”或“他以神的身份差来”
  rationale: 采用形式上较贴近见证且不预先解释句法关系的表达，保留其强烈而略显张力的神学陈述。
- issue: 首次差遣与将来审判的对照
  choice: “是怀着爱，不是为审判……将来……施行审判”
  alternative: 把“不是为审判”解释为“不是要定罪”
  rationale: 保留当前爱的差遣与未来审判之间的时间性张力，不消解原文对照。
- issue: 殉道者“未被胜过”
  choice: 不明确说明究竟是信心、群体还是个人未被胜过
  alternative: 译为“他们的信仰仍未被摧毁”
  rationale: 见证本身表达简略，译文不添加明确宾语，以保存含混性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。长串宇宙论排比予以保留，但通过分号和冒号增强可读性。因希腊文源语复核尚待完成，本稿以所给公共领域英文见证为依据；所有显著的缺损、补足和神学张力均在正文或脚注中保留，未作宗派化阐释。
