  yaml_path: translation/extra_canonical/2_baruch/007/001.yaml
  text: And after these things I heard that angel say to those angels who were holding the torches, “Now pull down the supports of its walls and overthrow them, lest the enemies boast and say, ‘We ourselves have cast down the wall of Zion, and we have burned the place of the mighty God.’ And stand there in the place where I had been standing before.”
translation:
  language: zh_hans
  text: 这些事以后，我听见[a]那位天使对手持火把的众天使说：“现在要拆掉这城墙的支撑，把墙推倒，免得仇敌夸口说：‘是我们推倒了锡安的城墙，焚烧了大能上帝所在之处。’你们要站在我先前所站的地方。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据叙利亚文印本此处疑有讹误；按语境及校勘作“我听见”。
    reason: 说明译文所采用的必要文本校勘。
  - marker: b
    text: 本句所据文字有损；按上下文理解为天使对众天使所发的复数命令。
    reason: 保留传本文字状况，并说明为何不译成巴录自述“我站在那里”。
lexical_decisions:
- source_word: ܫܒܩܬܗ（据语境及校勘作“我听见”）
  choice: 我听见
  rationale: 所据印本此处文字疑有讹误；按叙事语境及通行校勘，动词应表示“听见”，并引出天使随后的话。
- source_word: ܠܡܦܐܕ̈ܐ / ܠܡܦܝܕܐ
  choice: 火把
  rationale: 这些器具用于焚毁城邑；“火把”比普通的“灯”更符合场景，也保留异象鲜明的画面。
- source_word: ܣܡܝܟܘܬ ܫܘܪ̈ܝܗ
  choice: 这城墙的支撑
  rationale: 原语指城墙赖以稳固的支撑部分；不强行确定为“地基”或“扶壁”，以保留建筑意义上的宽度。
- source_word: ܣܚܦܢܝܗܝ
  choice: 推倒
  rationale: 该动词表示以强力拆毁、倾覆；“推倒”在现代汉语中自然，并准确表达城墙遭毁。
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  choice: 大能上帝所在之处
  rationale: 既保留“大能上帝”这一庄严称谓，也用“所在之处”表达圣所与上帝临在的关联，而不把原文具体化为某种建筑术语。
- source_word: ܘܐܬܩܝܡܘ（校勘读法）
  choice: 你们要站在
  rationale: 按上下文，这里是天使对众天使所发的复数命令，不是巴录关于自己的叙述。
theological_decisions:
- issue: 耶路撒冷陷落的最终施动者
  choice: 众天使奉天上的命令推倒城墙，使仇敌不能把毁城之功归给自己。
  alternative: 只说城墙倒塌，或把毁城完全归因于地上的仇敌。
  rationale: 这段话明确命令天使拆毁城墙，并说明目的在于阻止仇敌夸口；译文保留了毁灭作为神圣审判从天上执行的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“这些事以后”延续异象叙事语体；引语层次分明。“锡安”“上帝”保留经书语域，但避免古奥句法。
