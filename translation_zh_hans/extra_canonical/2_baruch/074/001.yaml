  yaml_path: translation/extra_canonical/2_baruch/074/001.yaml
  text: '1. And it shall be in those days: the reapers will not grow weary, and the builders will not labor; for the works will move forward of themselves with those who do them, in much tranquility.'
translation:
  language: zh_hans
  text: 1 在那些日子，收割者必不疲倦，建造者也不劳苦；因为各种工作会自行推进，做这些工作的人也都在极大的安宁中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܨܘܕ̈ܐ / messores（控制见证所支持的“收割者”用语）
  choice: 收割的人
  rationale: 保留具体的农耕意象，也与末世丰饶的上下文相符；比泛称“务农的人”更准确。
- source_word: ܒܢܝ̈ܐ / aedificantes（控制见证所支持的“建造者”用语）
  choice: 建造的人
  rationale: 与“收割的人”形成平行结构，并避免将其扩大为一般工人。
- source_word: non fatigabuntur ... neque laborabunt
  choice: 必不疲倦……也不劳苦
  rationale: 分别保留“疲倦”与“劳苦”两个概念，使原有的对偶节奏不被合并。
- source_word: sponte erunt currentia opera
  choice: 各样工作会……自行推进
  rationale: 保留工作仿佛自行向前完成的异象性画面，同时避免译成现代机械自动化的含义。
- source_word: cum operantibus ea
  choice: 在做工的人手中
  rationale: 自然表达工作与执行者相伴推进的关系，不把人从工作过程中排除。
- source_word: tranquillitate multa
  choice: 在极大的安宁中
  rationale: 既传达平静无扰的状态，也呼应上下文所描绘的整体恢复与秩序。
theological_decisions:
- issue: 弥赛亚时代劳动毫不费力的程度
  choice: 各样工作会在做工的人手中自行推进
  alternative: 他们的工作必顺利／他们做工必轻省
  rationale: 控制见证所呈现的不只是成功或轻省，而是受造秩序恢复后，工作以非同寻常的安稳自然推进；译文保留这一启示文学的张力，却不暗示完全没有人的参与。
- issue: 末句所描绘的是效率还是恢复后的安宁
  choice: 一切都在极大的安宁中
  alternative: 十分顺利／大有平安
  rationale: 本句重点不仅在工作成效，也在恢复后的平静秩序；“安宁”较能保留这种氛围，同时不把它限定为个人内心感受。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“到那些日子”保留启示文学的时间表达；以“必不……也不……”维持平行和宣告语气。所给Ceriani页包含章节边界重叠，目标句在该页摘录中并不清晰可辨，因此具体措辞谨慎参照控制见证与经审核的英文咨询层，不虚构叙利亚文词形。
