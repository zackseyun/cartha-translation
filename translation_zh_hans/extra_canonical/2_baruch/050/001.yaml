  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܐ ܘܐܡܪ ܠܝ
  choice: 他回答我说
  rationale: 依照叙事公式直译，既保留“回答”与“说”的双重表达，也符合庄重自然的现代汉语。
- source_word: ܫܡܥ
  choice: 你要听
  rationale: 该祈使式是对巴录的直接吩咐；补出主语“你”使汉语清楚自然。
- source_word: ܒܪܡ
  choice: 那么
  rationale: 此处承接上文并引出答复；译作“那么”比转折较强的“但是”更符合语境，同时保留衔接语气。
- source_word: ܡܠܬܐ
  choice: 这话
  rationale: ܡܠܬܐ 可指“话、言语、信息”；此处是即将宣告的答复，译作“这话”自然且不过度具体化。
theological_decisions:
- issue: 本节与后续复活论述的边界
  choice: 本节只译“他回答我说：‘那么，你要听这话。’”
  alternative: 把随后关于大地交还死者、复活与审判的内容并入本节
  rationale: 所给叙利亚文的第50章起始处仅包含这一引语导语；后续内容属于后面的节次，不应提前并入50:1。
translation_notes:
  register: 采用简洁、庄重而现代的叙事语体。“那么”承接前文提问并引出下文答复；不增补本节范围以外的复活论述。
