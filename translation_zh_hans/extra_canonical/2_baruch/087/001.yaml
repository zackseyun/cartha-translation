base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/087/001.yaml
  text: and in my prayer. And you also have learned from them the commandments of this letter, and you will be subdued in excellence, the nations for the promise, and you will be loved, and you will be comforted, lest you fall and be tormented.
translation:
  language: zh_hans
  text: 也在我的祈求中。你们也已经从那些话中学到了这封信的诫命。众民哪，你们要为着应许，在美德中谦卑下来[a]；你们必蒙爱，必得安慰，免得跌倒受苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的叙利亚文本语法和衔接较为艰涩；也可较直译为：“你们必在美德中被压服，众民归于应许。”这里把“众民”理解为呼语。
    reason: 原文 ܘܬܬܟܦܘܢ ܒܡܝܬܪܘܬܐ ܥܡܡܐ ܠܡܘܠܟܢܐ 的词义虽大致可辨，句法关系却不稳定，可能还涉及传抄问题；脚注保留其真实歧义。
lexical_decisions:
- source_word: ܒܒܥܘܬܝ
  choice: 在我的祈求中
  rationale: ܒܥܘܬܐ 可指祈祷、祈求或恳求；此处承接上文“我记念你们”，译作“祈求”既自然，也保留向上帝祷告的语境，而不扩写为特定的代祷教义。
- source_word: ܝܠܦܬܘܢ
  choice: 已经学到了
  rationale: 该动词在此为第二人称复数完成式，基本义是“学习、领受教导”；用“已经学到了”保留其完成体，不改写成命令语气。
- source_word: ܡܢܗܘܢ
  choice: 从那些话中
  rationale: 原文代词意为“从它们／他们”；其先行词并不完全明确。结合上文提到信中的“话”，译作“从那些话中”使中文可读，同时不把所指缩窄为具体人物。
- source_word: ܦܘ̈ܩܕܢܐ
  choice: 诫命
  rationale: 该词可指命令、训令或规条；“诫命”保留书信结尾劝诫中较强的权威和盟约色彩。
- source_word: ܘܬܬܟܦܘܢ
  choice: 你们要……谦卑下来
  rationale: 词根表达弯下、屈服或受抑制，而非“刚强”；在美德语境中译作“谦卑下来”，既保留其被压低／降服的意象，也较符合现代汉语。
- source_word: ܠܡܘܠܟܢܐ
  choice: 为着应许
  rationale: ܡܘܠܟܢܐ 通常意为“应许”；照原文译出，不误读为与“统治”有关的词。
- source_word: ܘܬܬܪܚܡܘܢ ܘܬܬܢܚܡܘܢ
  choice: 你们必蒙爱，必得安慰
  rationale: 两个被动／反身形式构成并列结果；“蒙爱”“得安慰”保留施事者未明说的特点。
- source_word: ܕܠܡܐ ܬܦܠܘܢ ܘܬܫܬܢܩܘܢ
  choice: 免得跌倒受苦
  rationale: ܕܠܡܐ 引出警戒性的否定目的或可能结果；末一动词可指受折磨、遭苦楚，译作“受苦”庄重且不过度强化。
theological_decisions:
- issue: “在我的祈求中”是否应扩写为正式代祷
  choice: 仅译明巴录在祈求中记念收信者的延续关系
  alternative: 明确写成“我为你们代求”
  rationale: 原文确实提到祈求，但本节开头是承接上一句的残句；不宜据此扩展出更完整的代祷表述。
- issue: “应许”的内容和赐予者是否应明确
  choice: 保留为未加限定的“应许”
  alternative: 补成“上帝所赐的应许”或具体说明应许内容
  rationale: 原文只有“为着应许”，未明说赐予者或内容；保留这种简略可避免添加经文没有交代的神学信息。
- issue: “必蒙爱、必得安慰”的施事者
  choice: 使用汉语被动式，不说明由谁施行
  alternative: 补出“必蒙上帝爱护和安慰”
  rationale: 叙利亚文没有明说施事者；虽然语境可能暗示上帝，正文仍应保留这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书信劝勉语体。开头保留跨节承接的残句感；中段以呼语整理艰涩句法，但用脚注明示原文困难；结尾用整齐的并列结构呈现劝勉和警戒。
