  yaml_path: translation/extra_canonical/2_baruch/035/001.yaml
  text: 'And I, Baruch, went to the holy gate, and sat down in humility, and I wept and said:


    “O my eyes, become springs,

    and eyelids of water, a fountain of tears.

    For how can I find rest over Zion?

    And how can I weep for Jerusalem?

    For the people whom I nourished

    and who were formerly greater than I in vision

    have been shaken with trembling.”'
translation:
  language: zh_hans
  text: '我巴录走到圣门，谦卑地坐下，哭着说：


    “我的双眼啊，要化作泉源；


    我的眼睑啊，要涌出水来，汇成泪泉。


    我怎能因锡安得安慰？


    又怎能为耶路撒冷哀哭？[a]


    因为我所养育的百姓，


    就是从前在异象上比我更大的，


    如今都因震恐而动摇了。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本行叙利亚文本不稳定。也可按现有字面译作：“我又怎能为这哀恸哭泣，并得着它呢？”
    reason: 说明正文“耶路撒冷”采用了锡安／耶路撒冷平行结构的校勘性读法，同时保留现存文本可能支持的“哀恸”读法及末语所指的不确定性。
lexical_decisions:
- source_word: ܬܪܥܐ ܩܕܝܫܐ
  choice: 圣门
  rationale: ܬܪܥܐ通常指门或城门；译作“圣门”保留圣所区域中具体的空间意象，不泛化为“圣地”。
- source_word: ܡ̈ܟܝܟܐܝܬ
  choice: 谦卑地
  rationale: 该副词表达卑微、降卑的姿态；“谦卑地”自然地呈现哀恸者伏低自己的情态。
- source_word: ܡܒܘ̈ܥܐ
  choice: 泉源
  rationale: 原文为复数，描绘泪水不断涌流；“泉源”既保留诗意，也为现代读者所熟悉。
- source_word: ܐܡܘ̈ܬܐ
  choice: 眼睑
  rationale: 依控制传统取身体部位义；“眼睑”与流泪的上下文相合，并避免将其解释为非身体性的“水渠”。
- source_word: ܐܬܬܢܝܚ
  choice: 得安慰
  rationale: 该动词可表示安歇、舒缓或得慰藉；在为锡安哀哭的语境中，“得安慰”最自然，同时保留无法平静的情感张力。
- source_word: ܐܒܠܐ
  choice: 耶路撒冷
  rationale: 现存叙利亚文本此处疑有讹误或传抄不稳；正文依上下文中的“锡安／耶路撒冷”平行结构采用“耶路撒冷”，并以脚注公开另一种按现有字面理解的译法。
- source_word: ܕܡܬ̇ܪܣܝܢ ܐܢܐ
  choice: 我所养育的
  rationale: 按句法和受审校层支持的读法，表明巴录与百姓之间养育、照管的关系；用“所养育的”保持关系方向，不另加具体职分。
- source_word: ܒܙܘܥܐ ܐܬܬܙܝܥ
  choice: 因震恐而动摇
  rationale: 保留原文同根词形成的强烈震动意象，同时用现代汉语表达惊惧与摇撼并存的含义。
theological_decisions:
- issue: “圣门”的礼仪与圣所指涉
  choice: 保留具体的“圣门”
  alternative: 概括译为“圣地”或“圣所”
  rationale: 本节原文使用具体的“门”，不宜在翻译中扩展为一般化的圣所观念，也不额外加入祭司或献祭等本节未明说的内容。
- issue: “在异象上比我更大”的比较关系
  choice: 保留百姓从前“在异象上比我更大”的反常而含混的表述
  alternative: 解释为百姓所得异象更大，或解释为他们在外观、地位上更显赫
  rationale: 原文的比较与“异象／景象”关系不够明确；正文不以神学推断消除其张力，也不擅自指定异象的领受者或内容。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体；以短行保留原文诗性和平行结构。“眼睑要涌出水来，汇成泪泉”略作汉语化处理，避免机械直译成“水的眼睑”，但不改变泪水泉涌的意象。
