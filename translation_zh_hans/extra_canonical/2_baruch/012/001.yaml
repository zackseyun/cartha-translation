  text: But I will speak as I understand, and I will speak against you, land that prospers.
translation:
  language: zh_hans
  text: 但我要照我所领会的说话；繁荣之地啊，我要出言斥责你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܝܟ ܕܡܫܬܡܥ ܐܢܐ
  choice: 照我所领会的
  rationale: ܡܫܬܡܥ 可按字面理解为“所听见的”，在这里也可指人所领会、理解的内容；“所领会的”符合哀诉语境，同时不把语气强化为确定无疑的知识。
- source_word: land that prospers
  choice: 昌盛之地
  rationale: 现有材料未列出本短语对应的叙利亚文本；依经审核的英语咨询层保留对土地的拟人化称呼及其繁荣状态，不扩充为特定城邑或政权。
- source_word: speak against you
  choice: 发言指责你
  rationale: 既保留“说话”的重复，又明确其敌对、谴责的方向；比单纯的“对你说”更能传达 against 的力量。
theological_decisions:
- issue: 对“昌盛之地”的称呼是否特指某一城市或政治势力
  choice: 保留为泛称“昌盛之地”
  alternative: 明确译作某座城市、国家或邪恶政权
  rationale: 所给证据没有明确指名其对象；不以解释性身份取代原文的开放表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“昌盛之地啊”保留呼语色彩；分号呈现两个平行的“说”句。所附叙利亚页面片段似乎保存了前一段结尾及七日禁食后的场景转换，并未显出本节英语咨询层所依据的完整叙利亚句，因此没有为缺失短语虚构叙利亚词形。
