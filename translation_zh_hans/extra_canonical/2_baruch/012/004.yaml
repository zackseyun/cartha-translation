  yaml_path: translation/extra_canonical/2_baruch/012/004.yaml
  text: For surely wrath will be aroused against you at its appointed time; for now it is restrained by longsuffering, as by a bridle.
translation:
  language: zh_hans
  text: 因为到了所定的时候，忿怒必向你们发作；如今，忿怒因恒久忍耐而受到约束，如同被缰绳勒住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܝܪܐܝܬ
  choice: 必
  rationale: 该词有“确实、实在”之意；在此用“必”自然表达其强调和确定语气。
- source_word: ܒܙܒܢܐ
  choice: 到了所定的时候
  rationale: 按语境表达忿怒发作的指定时刻，采用现代汉语中自然而庄重的说法。
- source_word: wrath（据经文语境及审校层所保存的内容）
  choice: 忿怒
  rationale: “忿怒”适合庄重经文语体，也保留审判性情绪的力度。
- source_word: longsuffering（据审校层所保存的内容）
  choice: 恒久忍耐
  rationale: 不仅表示一般耐心，也体现长期克制、不立刻施行忿怒的含义。
- source_word: bridle（据审校层所保存的比喻）
  choice: 缰绳
  rationale: 保留原有的驾驭、约束比喻，并使现代读者容易理解。
theological_decisions:
- issue: 忿怒暂受约束与日后发作之间的张力
  choice: 同时保留“如今受到约束”和“到了所定的时候必发作”
  alternative: 把恒久忍耐解释为取消或减轻忿怒
  rationale: 经文强调延迟而非取消；译文不替文本消解忍耐与审判并存的张力。
- issue: 恒久忍耐的主体
  choice: 不明说是谁在忍耐
  alternative: 明确增译为“上帝因恒久忍耐”
  rationale: 现有材料中该处主体未在本句明说；避免加入虽可能合理、但超出明文的信息。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“向你们发作”比“被唤醒攻击你们”更符合汉语习惯；重复“忿怒”以避免后半句代词所指含混。现有叙利亚文页面摘录的分节边界与目标节内容并不完全清晰，因此以原文证据可辨部分为先，并谨慎参考经审校的英文层保存完整句意。
