  text: Do not expect or hope that you will always have prosperity and joy. Do not exalt yourselves too highly, and do not oppress.
translation:
  language: zh_hans
  text: 不要指望或盼望你们会一直繁荣喜乐。不要过分抬高自己，也不要欺压人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prosperity and joy（英文审校层；所给叙利亚文摘录中未见本节对应词句）
  choice: 繁荣喜乐
  rationale: 简洁保留物质兴盛与欢乐两层含义，符合现代汉语表达。
- source_word: exalt yourselves too highly（英文审校层；据修订记录，底层形式为第二人称复数）
  choice: 过分抬高自己
  rationale: 既表达自高，也避免译成较强宗教术语；“自己”随主语“你们”自然取得复数指向。
- source_word: oppress（英文审校层；所给叙利亚文摘录中未见本节对应词句）
  choice: 欺压人
  rationale: 补出汉语中自然需要的受事泛指“人”，不限定具体受害群体。
theological_decisions:
- issue: 第二人称的单复数
  choice: 采用复数“你们……自己”
  alternative: 单数“你……自己”
  rationale: 最新语法审校明确指出相关叙利亚语动词和代词为复数，所指为集体；中文“你们……自己”准确而自然。
- issue: 自高行为的表达
  choice: “过分抬高自己”
  alternative: “高举自己”或“自高”
  rationale: 避免赋予该句额外的专门神学色彩，同时保留对骄傲自大的禁止。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。需注意：用户提供的叙利亚文篇章摘录表面上包含前段结尾、禁食七日及巴录站在河边听见声音等内容，未能辨认出与英文审校层本节相对应的句子。因此本稿依据经审校的英文层及其明确记录的叙利亚语复数语法拟定；正式出版前宜回查本节正确的叙利亚文行文或节号。英文旧脚注“或作‘你自己’”与最新复数语法裁定冲突，故不收入正文及脚注。
