  text: For the noonday blaze does not burn forever, nor do the rays of the sun continue to give light.
translation:
  language: zh_hans
  text: 因为正午的烈焰不会永远燃烧，太阳的光芒也不会一直照耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 正午之热／烈焰（英审校层：the noonday blaze）
  choice: 正午的烈焰
  rationale: 保留火焰“燃烧”的意象，并采用自然、庄重的现代汉语；不弱化为单纯的“炎热”。
- source_word: 太阳的光芒（英审校层：the rays of the sun）
  choice: 太阳的光芒
  rationale: 准确保留太阳所发射之光的复数／集合意象，汉语表达自然。
- source_word: 继续发光（英审校层：continue to give light）
  choice: 一直照耀
  rationale: 以现代汉语自然表达持续发光之意，并与前句“不会永远”形成平行。
- source_word: 因果连词（英审校层：For）
  choice: 因为
  rationale: 保留本节对上文所作的因果说明，避免割断论证关系。
theological_decisions:
- issue: 自然界光明意象是否应作神学化解释
  choice: 按字面保留正午烈焰与太阳光芒的对偶意象
  alternative: 将其解释为审判、苦难或世上荣华
  rationale: 本节本身没有明说意象所指，不在译文中替作者消除隐喻的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留两分句的否定平行结构和开头的因果连接。所给叙利亚文页面摘录似乎未直接呈现本节对应句，因此具体措辞以经审校的英译咨询层所保存的源文结构为控制，并避免添加无法由材料确认的细节。
