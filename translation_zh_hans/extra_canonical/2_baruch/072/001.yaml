  text: But hear also about the bright waters that are to come at the end, after these dark waters.
translation:
  language: zh_hans
  text: 不过，你也要听一听：在这些黑水[a]之后，末了将要来到的是明亮的水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些黑水”也可译作“那些黑水”。
    reason: 保留英语审校记录中既有译法的替代可能；但叙利亚文近指词更直接支持正文的“这些”。
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ（与ܡ̈ܝܐ ܐܘܟܡ̈ܐ相对）
  choice: 明水
  rationale: 保留异象中“明”与“黑”的鲜明对照；“明水”既可表达光明，也避免把意象仅限于水质清澈。
- source_word: ܗܠܝܢ
  choice: 这些
  rationale: 近指复数指示词指向刚刚提到的黑水序列，宜译为“这些”，而非较远指的“那些”。
- source_word: ܒܫܘܠܡܐ / 表示终末的短语
  choice: 末了
  rationale: 既传达时间序列的终点，也保留启示文学中的终末意味，不额外扩展为某一套末世论术语。
theological_decisions:
- issue: “明水”是否应解释为具体的弥赛亚时代
  choice: 本节只保留“明水”的象征说法
  alternative: 直接译释为“弥赛亚时代的福乐”
  rationale: 本节以水的明暗延续异象结构，尚未在句内明说其完整所指；不应在正文中提前消解象征及其张力。
translation_notes:
  register: 采用庄重而自然的现代汉语。“也要听我讲”体现话语转折和继续启示的语气；语序调整为“这些黑水之后、末了将要来到”，使中文顺畅，同时保留先后次序。
