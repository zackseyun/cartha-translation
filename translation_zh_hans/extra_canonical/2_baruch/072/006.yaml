  text: But all those who have ruled over you, or have known you, all these shall be delivered to the sword.
translation:
  language: zh_hans
  text: 但凡统治过你或认识你的人，都必被交在刀剑之下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܠܛ / ܐܫܬܠܛ（据本节传统文本；所给页段的行次与字符识别不完整）
  choice: 统治过
  rationale: 保留对城或群体施行权柄的含义；比“管辖”更自然，也不额外限定其政权性质。
- source_word: ܝܕܥ
  choice: 认识
  rationale: 直译其基本义，保留可能包含亲历、熟知或与之有接触的宽泛含义，不擅自改成“侵略”或“占有”。
- source_word: ܫܠܡ
  choice: 被交在……之下
  rationale: 表达被交付、任凭处置的被动含义，并保留审判语气。
- source_word: ܣܝܦܐ
  choice: 刀剑
  rationale: 采用现代中文圣经文体中自然且庄重的战争与处决意象。
theological_decisions:
- issue: 审判对象的范围
  choice: 保留“凡……的人，都……”的全面表述
  alternative: 把对象缩限为敌对的统治者或压迫者
  rationale: 原句并未明说只有敌对者；不以解释性措辞缩小其范围。
- issue: “认识你”的含义
  choice: 保持字面上的开放性
  alternative: 解释为“曾占有你”“曾与你交战”或“曾熟悉你”
  rationale: 此处语义可能带有上下文限定，但现有证据不足以排除其真实歧义。
translation_notes:
  register: 采用简洁、庄重的现代标准普通话。“但”承接上文的转折；“被交在刀剑之下”保留原文的审判意象，不改写为较抽象的“被杀”。所给叙利亚文为章节页桶，且字符识别与行次不完整，因此本稿以可辨认的传统本节措辞及英文审校层交叉控制。
