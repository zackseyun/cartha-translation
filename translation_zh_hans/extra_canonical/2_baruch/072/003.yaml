  text: These, then, are the things that shall happen to those nations which are to be spared by him.
translation:
  language: zh_hans
  text: 这些事将临到那些将蒙他存留的列国。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܠܝܢ
  choice: 这些事
  rationale: 采用近指复数，承接上文所述将发生的各项事情。
- source_word: ܥܡܡ̈ܐ
  choice: 列国
  rationale: 此处指多个外邦民族或国家；“列国”简洁庄重，也符合启示文学语境。
- source_word: ܢܫܬܒܩܘܢ
  choice: 将蒙……存留
  rationale: 保留将来时和被动意味；此处不是一般的“留下”，而是在审判中得以幸存、被保全。
- source_word: ܥܠܝܗܘܢ / ܠܗܘܢ
  choice: 临到
  rationale: 以自然现代汉语表达事情落在某些民族身上的含义，同时保持审判性语境。
theological_decisions:
- issue: 施行存留者的代词所指
  choice: 保留为“他”
  alternative: 明确译作“弥赛亚”或“至高者”
  rationale: 本节以代词承接上下文；不在正文中补明身份，以免消除原文的指代关系或引入解释。
- issue: “存留”的性质
  choice: 译为“蒙他存留”
  alternative: “被他饶恕”或“被他留下”
  rationale: “存留”能兼顾免遭毁灭与继续存活的含义，而不额外断定这是赦罪意义上的“饶恕”。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；保留原文的将来时、被动意味和代词指向，不作教派化阐释。
