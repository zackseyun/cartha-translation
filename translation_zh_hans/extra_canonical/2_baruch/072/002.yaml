base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/072/002.yaml
  text: 'This is the word: after the signs have come that were told to you before, the nations will be thrown into confusion, and the time of my Messiah will come. He will summon all the nations, and some of them he will keep alive, but others of them he will put to death.'
translation:
  language: zh_hans
  text: 这话是说：从前告诉你的那些征兆出现以后，列国必陷入混乱，我的弥赛亚[a]的时代也必来到。他必召集列国，使其中一些存活，却将另一些处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”意为“受膏者”。
    reason: 帮助普通现代读者理解这一音译称号，同时不在正文中加入超出原文的身份解释。
lexical_decisions:
- source_word: ܡܠܬܐ
  choice: 这话是说
  rationale: 在此作为解释异象的引介语，译为自然庄重的现代汉语，同时保留“话／所说之事”的语义。
- source_word: ܥܡܡ̈ܐ
  choice: 列国
  rationale: 该词可指各民族或诸国；上下文描写弥赛亚召集并审判世界各国，故用“列国”，不限定具体族群。
- source_word: ܡܫܝܚܝ
  choice: 我的弥赛亚
  rationale: 保留原文第一人称所属关系及“受膏者”称号，不把其身份进一步作宗派化解释。
- source_word: ܢܚܐ
  choice: 使……存活
  rationale: 表达让一部分人继续活着或保全其性命，与后文“处死”形成明确对照，又不额外引入赦免等神学含义。
- source_word: ܢܩܛܘܠ
  choice: 处死
  rationale: 直接呈现杀死、置于死地的强烈含义，不用弱化措辞。
theological_decisions:
- issue: “我的弥赛亚”的身份与所属关系
  choice: 直译为“我的弥赛亚”
  alternative: “我所膏立的那一位”或“弥赛亚”
  rationale: 原文既有弥赛亚称号，也有第一人称所属表达；直译能保留文本自身的神学张力，而不预先界定说话者与弥赛亚之间更具体的关系。
- issue: 部分列国所得的结局
  choice: “使其中一些存活”
  alternative: “饶过其中一些”
  rationale: “存活”紧贴原文的生命—死亡对照；“饶过”可能额外暗示赦罪或免罚，因此不采用。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“必……也必……”体现预言语气；“陷入混乱”“召集”“存活”“处死”保持简洁有力。正文中的脚注标记与脚注条目一致。
