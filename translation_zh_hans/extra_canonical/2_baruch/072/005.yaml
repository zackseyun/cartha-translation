  text: And this is because they shall be subjected, from among all the nations, to your people.
translation:
  language: zh_hans
  text: 这是因为，他们必从万国中归服于你的百姓。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܥܒܕܘܢ（据本节通行叙利亚文重建）
  choice: 必归服
  rationale: 表达被置于从属地位的被动含义；较“被奴役”自然，也不把政治从属过度具体化。
- source_word: ܡܢ ܟܠܗܘܢ ܥܡܡ̈ܐ（据本节通行叙利亚文重建）
  choice: 在列国之中
  rationale: 保留“从所有民族中／在列国中”的范围关系，避免误译为所有列国无一例外都归服。
- source_word: ܠܥܡܟ（据本节通行叙利亚文重建）
  choice: 你的百姓
  rationale: “百姓”符合面向以色列共同体的称谓，并保留第二人称关系。
theological_decisions:
- issue: 归服关系的对象与范围
  choice: “他们必归服你的百姓”
  alternative: “列国都必臣服于你的百姓”
  rationale: 采用被动从属关系，同时让“在列国之中”修饰这些人的来源；不将原文扩大为全体列国必然臣服。
translation_notes:
  register: 采用庄重而易懂的现代汉语。“这是因为”承接上文的解释关系；“归服”保留统治与从属意味，但不额外引入奴役制度的细节。当前所给页面材料存在章节插值与重叠，未清楚显出本节完整行文，因此以所附英文审校层并参照该节通行叙利亚文措辞作谨慎重建。
