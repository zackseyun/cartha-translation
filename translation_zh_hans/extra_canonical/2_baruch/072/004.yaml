  text: Every people that has not known Israel and has not trampled the seed of Jacob—these are the ones that shall live.
translation:
  language: zh_hans
  text: 凡不认识以色列、也未曾践踏雅各后裔[a]的民族，都将存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”。
    reason: 说明闪语的谱系隐喻，同时保持正文自然易懂。
lexical_decisions:
- source_word: ܥܡܡ̈ܐ
  choice: 民族
  rationale: 该词指各族、列国或众民；此处以“民族”自然表达群体性对象，同时避免现代国家政治含义过强的“国家”。
- source_word: ܝܕܥ / ܐܫܬܘܕܥ
  choice: 认识
  rationale: 保留闪语中“知道、认识”的基本语义，不擅自解释为承认、归信或缔约关系。
- source_word: ܕܫ / ܕܘܫ
  choice: 践踏
  rationale: 以具体而有力度的动词表达压迫、蹂躏的意象，不弱化为泛泛的“伤害”。
- source_word: ܙܪܥܗ ܕܝܥܩܘܒ
  choice: 雅各后裔
  rationale: “种子”在此是闪语常见的后裔喻称；正文采用现代汉语自然表达，脚注保留字面信息。
- source_word: ܢܚܘܢ
  choice: 将存活
  rationale: 保留未来时和“活着、存留”的语义，不进一步限定为末世得救或永生。
theological_decisions:
- issue: “认识以色列”的关系性质
  choice: 直译为“认识以色列”
  alternative: 承认以色列／与以色列有交往
  rationale: 原表达可涵盖一般认知或关系性认识；正文不替原文消除这种张力。
- issue: “将活着”的末世含义
  choice: 译为“将存活”
  alternative: 将得救／将获得永生
  rationale: 上下文虽有审判与存留背景，但动词本身不要求特定的系统神学解释，因此不扩译。
- issue: 民族是否同时满足两个条件
  choice: 以“也未曾”连接，表达并列限定
  alternative: 把两类民族拆分为两组
  rationale: 句法最自然地指同一群体具备“不认识以色列”和“未践踏雅各后裔”两个特征。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“未曾”体现过去行为的限定；“都将存活”保持预言语气。所给叙利亚文材料是章节页桶且存在重叠、错序和识别残缺，本节措辞主要依据可核对的章节传本读法，并以英文POB作为审校参照，而非不透明底本。
