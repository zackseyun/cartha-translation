  text: Then I lifted up my eyes and wept, and I said at that time, “Far be it from me that I should be silent toward you or forget you. But only as far as the house of the tombs of my fathers, in affliction and in the distress of lamentation cry aloud, so that I may not be forgotten before you and afterward. And these things I have declared to you for your remembrance.”
translation:
  language: zh_hans
  text: 那时，我抬起眼来，哭泣着说：“我绝不向你们缄默，也绝不忘记你们。只是，你们只须陪我到我祖先坟墓所在的墓地；[a]你们要在患难中、在哀号的困苦里放声呼喊，使我不至在你们面前被遗忘，也不至在日后被遗忘。[b]这些事，我已经告诉你们，供你们记念。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陪我”是按上下文补出的；原文在“只是你们”之后直接接“直到我祖先坟墓所在的墓地”，句法有所省略。
    reason: 说明为使中文成句而补足的语境性动词，并保留原文的省略现象。
  - marker: b
    text: “使我不至在你们面前被遗忘，也不至在日后被遗忘”原文在“在你们面前”和“此后”之间的衔接不甚清楚；也可能理解为“使我在你们面前不被遗忘；此后，这些事……”。
    reason: 底本文句在“在你们面前”与“此后”之间存在真实的句法歧义，不宜在正文中无声消解。
lexical_decisions:
- source_word: ܚܣ ܠܝ
  choice: 我绝不
  rationale: 这是表达强烈否定或拒绝的叙利亚语惯用语；现代汉语用“我绝不”既保留庄重决绝的语气，也避免误译成求怜悯。
- source_word: ܕܐܫܬܘܩܘܟܘܢ
  choice: 向你们缄默
  rationale: 保留“沉默”这一动词及其对人的指向，不擅自解释为抛弃或不再教导。
- source_word: ܐܢܫܝܢ ܡܢܟܘܢ
  choice: 忘记你们中任何一人
  rationale: 原文含“你们中的一人／任何人”，因此明译“任何一人”，比笼统的“忘记你们”更完整。
- source_word: ܠܒܝܬ ܩܘ̣ܒܘܪ ܩܘ̈ܒ̣ܪܐ ܕܐܒܗܝ
  choice: 到我祖先诸坟的墓室那里
  rationale: 尽量保留原文叠加的“墓室／坟墓”意象及第一人称“我的祖先”，不将其完全泛化为“墓地”。
- source_word: ܡܢ ܚܒܠܬܐ ܒܥܝܩܘܬ ܝܠܠܐ ܨܘܝܘ
  choice: 在患难中、在哀号的困苦中大声呼喊
  rationale: 原文累叠苦难、困窘和哀号等词，随后使用复数命令式“呼喊”；译文保留这种累积的哀恸修辞。
- source_word: ܥܘܗܕܢܘܢ
  choice: 供你们记念
  rationale: 该词组以记忆、记念为中心；此译法保留纪念性语气，同时不把它强化为特定礼仪行为。
theological_decisions:
- issue: “使我不被遗忘”所指的记念性质
  choice: 按人际记念直译，不赋予祈祷、祭仪或死后代求的特定含义
  alternative: 解释为礼仪性纪念或为死者代求
  rationale: 本节语境是巴录与百姓分别时的哀恸嘱咐；原文没有足够依据支持更具体的宗派性解释。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“缄默”“记念”维持经文体的端正语域；其余句式尽量自然。正文保留原文哀恸词语的累叠，并以脚注标示省略和句法歧义。
