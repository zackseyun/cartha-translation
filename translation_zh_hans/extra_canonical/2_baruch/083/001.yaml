lexical_decisions:
- source_word: ܡܪܝܡܐ
  choice: 至高者
  rationale: 保留犹太启示文学中对上帝的尊称，不改写为带有额外解释的神名。
- source_word: ܙܒ̈ܢܘܗܝ
  choice: 他的时期
  rationale: 原词为复数并带第三人称单数所属后缀；译作“他的时期”保留这些时期由至高者掌管的表达，同时不擅自补入“所定的”等原文未明说的限定。
- source_word: ܢܣܪܗܒ
  choice: 必使……迅速来到
  rationale: 用现代汉语表达使某事加速、催促其来临的使动含义；“必”体现叙述中的确定语气。
theological_decisions:
- issue: “他的时期”是否应解释为末世预定日期
  choice: 保留为“他的时期”
  alternative: “他所定的末世时期”
  rationale: 经文本身强调时间属于至高者并将迅速来到，但本节没有明确加上“末世”或“预定”二义；不在正文中提前消解其启示文学张力。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“至高者”延续第二巴录书的启示文学语域；句式自然，同时尽量保留原文的所属关系和确定语气。
