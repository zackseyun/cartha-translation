  text: Afterward come to this place, and I will appear to you there and speak true things with you, and I will instruct you concerning the order of the times, for they are coming and will not delay.
translation:
  language: zh_hans
  text: 此后，你要到这个地方来；我必在那里向你显现，与你谈论真实的事，并教导你有关各个时期的次序，因为它们将要来到，必不迟延。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܚܙܐ（据本节传统文本；所给页片段有错置与残损）
  choice: 向你显现
  rationale: 保留“使自己被看见／显现”的直接含义，不弱化为普通的“见你”。
- source_word: ܫܪܝܪ̈ܬܐ（据本节传统文本）
  choice: 真实的事
  rationale: 既可涵盖真实的话语，也保留所谈内容为真实之事的宽度；避免擅自限定为某类预言。
- source_word: ܛܟܣܐ ܕܙܒ̈ܢܐ（据本节传统文本）
  choice: 各个时期的次序
  rationale: “次序”对应安排、秩序；“时期”比单纯“时间”更适合末世异象中依次展开的阶段。
- source_word: ܠܐ ܡܘܚܪܝܢ（据本节传统文本）
  choice: 必不迟延
  rationale: 保持宣告式语气，并准确表达这些时期不会耽搁。
theological_decisions:
- issue: “各个时期”是否应解释为特定末世阶段
  choice: 保留为“各个时期的次序”
  alternative: 末世各阶段的安排
  rationale: 上下文具有末世论色彩，但原句本身未在此处加上“末世”一词，因此不把解释直接写入正文。
- issue: 显现者与说话者的身份表达
  choice: 沿用第一人称“我必……显现”
  alternative: 主必向你显现
  rationale: 原句采用第一人称神圣发言；不额外添加称号，以免超出本节措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“此后”承接时间顺序；分号划分命令与应许。所给叙利亚文页面材料存在明显错置、残损和章节重叠，因此措辞以可辨识的本节传统叙利亚文本证据为先，并以经审校的英文 POB 作为核对层。
