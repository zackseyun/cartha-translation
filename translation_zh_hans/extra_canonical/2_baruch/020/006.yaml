  rationale: 修订仅处理现代汉语中“这里／那里”的指示协调，并将“正在临近”改为更直接对应来临动词的“将要来到”。其余关键措辞保留，以维持原句的庄重语体、复数“时期”及未被细化的时间秩序概念。
