  text: Then I will show you the judgment of my might and my ways, which are past searching out.
translation:
  language: zh_hans
  text: 那时，我必向你显明我大能的审判，以及我那无法探究的道路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܐ
  choice: 审判
  rationale: 保留司法与神圣裁决的语义，不弱化为一般的“判断”。
- source_word: ܚܝܠܐ
  choice: 大能
  rationale: 在神的语境中自然表达“能力、权能”，同时保留原文属格结构中的力量意涵。
- source_word: ܐܘܪ̈ܚܬܐ
  choice: 道路
  rationale: 采用圣经语体中自然且可理解的隐喻，指行动方式与治理之道。
- source_word: 不可探究（对应叙利亚文相关否定性描述）
  choice: 无法探究
  rationale: 表达人的查考不能穷尽这些道路，保留其不可测度性，不解释为单纯的“不知道”。
theological_decisions:
- issue: “我大能的审判”中属格关系的理解
  choice: 保留“我大能的审判”这一紧密属格表达
  alternative: “我凭大能施行的审判”
  rationale: 原表达可指彰显神大能的审判，也可指凭其大能施行的审判；正文不将这种关系单向解释。
- issue: 神的道路“无法探究”
  choice: 保留认识论上的不可穷尽性
  alternative: “隐秘的道路”
  rationale: 原意重点在无法查透，而非仅仅隐藏，因此不引入绝对不可认识或刻意遮蔽的额外神学判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；“那时……我必……”体现宣告语气，“审判”“道路”保留经文的核心意象与神学张力。
