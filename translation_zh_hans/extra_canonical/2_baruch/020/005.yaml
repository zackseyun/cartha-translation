lexical_decisions:
- source_word: ܐܙܠ（据本节传本文句复原）
  choice: 你去
  rationale: 保留命令语气，并用现代汉语自然表达。
- source_word: ܐܬܩܕܫ（据本节传本文句复原）
  choice: 洁净自己
  rationale: 此处指为领受启示而分别并作礼仪性预备；译作“洁净自己”比单译“使自己成圣”更清楚，也避免额外引入教义含义。
- source_word: ܫܒܥܐ ܝܘܡܝܢ（据本节传本文句复原）
  choice: 七天
  rationale: 直接保留明确的时间长度。
- source_word: ܠܚܡܐ（据本节传本文句复原）
  choice: 饼
  rationale: 按古代近东日常主食的通常用语直译，不泛化为“一切食物”。
- source_word: ܡܝܐ（据本节传本文句复原）
  choice: 水
  rationale: 保留禁水这一具体而强烈的禁食要求。
- source_word: ܥܡ ܐܢܫ（据本节传本文句复原）
  choice: 同任何人
  rationale: 准确表达不与人交谈的全面禁令。
theological_decisions:
- issue: “洁净／成圣”一词的礼仪与神学范围
  choice: 洁净自己
  alternative: 使自己成圣
  rationale: 上下文中的七日禁食、禁水和静默表明这是领受启示前的分别与预备。“洁净自己”保留礼仪意味，同时不把经文扩大为系统性的成圣教义。
- issue: 禁食范围
  choice: 不要吃饼，不要喝水
  alternative: 不要吃喝
  rationale: 保留原句所列的具体对象，不将“饼”自动解释为所有食物，也不削弱明确提到的禁水。
