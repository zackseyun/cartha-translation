  text: Therefore I have now taken Zion away, so that I may visit the world more swiftly in its appointed time.
translation:
  language: zh_hans
  text: 因此，我如今取走了锡安，以便我在这世界所定的时候，能更快地察看这世界。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܛܠ ܗܢܐ
  choice: 因此
  rationale: 保留承接上文、引出结果或理由的连接关系。
- source_word: ܨܗܝܘܢ（据本节校勘复原）
  choice: 锡安
  rationale: 按专名音译，不擅自将其明确解释为耶路撒冷、圣殿或居民。
- source_word: ܐܦܩܬ / ܢܣܒܬ（据本节文本传统）
  choice: 取走了
  rationale: 对应英语审校层的 taken away，并保留动作究竟侧重移除、夺去还是毁灭的张力。
- source_word: ܐܣܥܘܪ（据本节文本传统）
  choice: 察看
  rationale: 该动词可指临到、巡视或施行审判；“察看”保留较宽语义，不预先限定为惩罚或眷顾。
- source_word: ܒܙܒܢܗ
  choice: 在……命定的时刻
  rationale: 字面为“在它的时刻／时候”；结合语境表达其既定时机，同时不把时间具体化。
theological_decisions:
- issue: “察看世界”是否明确译成审判世界
  choice: 察看世界
  alternative: 审判世界／临到世界
  rationale: 源语相关动词具有巡视、眷顾、追讨等范围；本节未单独限定其正面或负面含义，故不把神学张力消解为单一的“审判”。
- issue: “锡安”所指范围
  choice: 保留专名“锡安”
  alternative: 耶路撒冷／圣殿／锡安城
  rationale: 不在正文中替原文确定其究竟是城市、圣所还是群体的转喻。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“取走”有意保留原句中移除锡安这一动作的含混性；“命定的时刻”使时间表达自然，同时维持末世性语境。
