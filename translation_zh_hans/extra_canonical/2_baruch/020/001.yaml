  source_fidelity: 译文准确保留了本节三个时间单位（时光、季节、年岁）加速的递进，以及“日子将到”的预告语气。惟末句“年岁也要比现今过得更快”略带人对年岁的主观经历意味；原文及英文审校轨迹所表达的是年岁本身更快地推移，宜明示这一点。
