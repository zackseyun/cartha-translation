  yaml_path: translation/extra_canonical/2_baruch/020/001.yaml
  text: Therefore, behold, days are coming when the times will hasten more than the former ones, and the seasons will pass more swiftly than those that have gone by, and the years will move faster than the present years.
translation:
  language: zh_hans
  text: 因此，看哪，日子将到；那时，时光要比从前奔得更快，季节要比以往流逝得更急，年岁也要比现今更快地推移。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒ̈ܢܐ
  choice: 时光
  rationale: 此处指不断加速推移的时间阶段；译作“时光”既保留时间意义，也符合现代汉语表达。
- source_word: ܫܢܝ̈ܐ
  choice: 年岁
  rationale: 保留复数“诸年”的历时感，并与前面的“时光”“季节”形成自然的排比。
- source_word: ܗܐ
  choice: 看哪
  rationale: 保留先知性宣告中的提示语气，同时采用读者熟悉而庄重的圣经汉语。
theological_decisions:
- issue: 时间加速的性质
  choice: 按原文呈现为时光、季节和年岁的加速流逝
  alternative: 解释为末世日期被缩短或寿命减少
  rationale: 本节使用时间性意象，却未明确说明加速的机制或神学含义，因此不把它具体化为某一种末世解释。
translation_notes:
  register: 采用现代、庄重、易懂的书面汉语；以三个并列分句保留原文的递进排比，不补入原文未明说的解释。
