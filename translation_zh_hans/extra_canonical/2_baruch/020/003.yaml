  text: And now, hold fast in your heart all that I command you, and seal it in the inner chambers of your mind.
translation:
  language: zh_hans
  text: 现在，你要把我吩咐你的一切牢牢记在心里，并封存在你心思的深处。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܒܟ / ܠܒܐ（据本节传统文本；所给页桶未清晰呈现本节）
  choice: 心里
  rationale: 闪语“心”既指内心，也涉及思想与意志；现代汉语用“记在心里”自然传达牢记之意。
- source_word: ܟܠ ܡܕܡ ܕܡܦܩܕ ܐܢܐ ܠܟ（据本节传统文本）
  choice: 我吩咐你的一切
  rationale: 保留命令者、受命者和范围完整的关系，中文表达简洁清楚。
- source_word: ܐܘܢ̈ܐ / 内室意象（据本节传统文本）
  choice: 心思的深处
  rationale: 原意象指思想内部隐秘而稳妥的存放处；这样译既保留内在空间感，也避免生硬的“心思内室”。
- source_word: ܚܬܘܡ / 封印词根（据本节传统文本）
  choice: 封存在
  rationale: 兼顾“封上、封印”与“妥善保存”的含义，并与内在空间意象自然衔接。
theological_decisions:
- issue: “心”与“心思”是否区分
  choice: 前半句译“心里”，后半句译“心思的深处”
  alternative: 两处都译作“心”
  rationale: 保留原句由内心牢记到思想深处封存的递进，而不把二者解释成严格的人性构成分类。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“牢牢记在心里”传达持续持守，“封存在你心思的深处”保留封印与内室的双重意象。鉴于所给叙利亚文为章节页桶且本节未能在摘录中可靠定位，译文以原文传统措辞线索为主，并参照经审校的英文层，不对无法核实的具体词形作过度断言。
