  text: 'And when I had said these things, I slept there, and I saw a vision by night. And behold, I saw a cloud ascending from the great sea, and it was full of white and black waters, and there were many colors in those waters, and at its head there appeared the likeness of a great lightning. And I looked, and that cloud passed swiftly in a violent rush and covered the whole earth. And after this, waters began to descend from it upon the earth, and I saw that the appearance of those waters was not one and the same. And after these things again I saw black, and after these things again bright, again black, and again bright. And this happened up to twelve times, but in all of them the black were more than the bright.


    And it came to pass, at the end of the cloud, that black waters, darker than all the former waters, descended, and there was a mingling in them, and wherever those waters descended they produced devastation and destruction. And after these things I saw the lightning that I had seen at the head of the cloud, and it seized the cloud and dragged it down to the earth. And after this I saw, and behold, twelve rivers[a] were ascending from the sea, and they surrounded that lightning and became subject to it, and they rejoiced over that proclamation and praised it. And I awoke because of my fear.'
translation:
  language: zh_hans
  text: '我说完这些话，就在那里睡着了；夜间，我看见了一个异象。看哪，我看见一朵云从大海升起，里面满是白水和黑水；这些水中翻腾着许多波浪。云的前端显出一道大闪电的形状。我观看时，那朵云急速而猛烈地掠过，遮盖了全地。此后，水开始从云中降到地上；我看见那些水的样子并不相同。接着，我又看见黑的；之后又是明亮的；又是黑的，又是明亮的。这样交替了十二次，但每一次，黑的都多于明亮的。


    到了那朵云的末尾，便有黑水降下，比先前所有的水都更幽暗；其中有混杂。那些水无论降在哪里，都造成毁坏和灭亡。此后，我又看见先前在云的前端所见的那道闪电；它抓住那朵云，把云拖到地上。此后我观看，看哪，有十二条河[a]从海中升起，环绕那道闪电，归服于它；它们因那宣告而欢喜，并赞美它。[b]我因惧怕而惊醒。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“十二道光”。
    reason: 叙利亚文本的读法及传本证据存在“河”与“光”的差异。
  - marker: b
    text: 末句也可理解为：“它们因那位宣告者而欢喜，并赞美他。”
    reason: ܟܪܘܙܐ既可按“宣告”理解，也可指“宣告者／传令者”；相关代词的所指亦有歧义。
lexical_decisions:
- source_word: ܥܢܢܐ
  choice: 云
  rationale: 这是叙利亚语中“云”的常用词；异象中它从海上升起、移动并降下水，直译自然清楚。
- source_word: ܩ̈ܝܐ
  choice: 水
  rationale: 语境既描述云中之物，也描述其降到地上；“水”可贯穿全段，并避免把名词过早解释成具体的雨势。
- source_word: ܓ̈ܠܠܐ
  choice: 波浪
  rationale: 该词通常指波浪或翻腾之物；译作“波浪”比咨询层的“颜色”更贴近现存叙利亚文本，并与水的意象相合。
- source_word: ܐܘܟܡܐ
  choice: 黑的／黑水
  rationale: 保留黑与明亮之间反复出现的鲜明对照，不把象征预先解释为某些历史时期。
- source_word: ܢܗܝܪܐ
  choice: 明亮的
  rationale: 与“黑的”形成对称，同时保留其可指明亮、发光的语义。
- source_word: ܒܪܩܐ
  choice: 闪电
  rationale: 这是该词的通常含义；“一道大闪电的形状”也保留了异象所用的比拟表达。
- source_word: ܒܪܗܛܐ ܩܫܝܐ
  choice: 急速而猛烈地掠过
  rationale: 兼顾动作的迅疾和强劲，符合现代汉语叙事，同时保留异象的压迫感。
- source_word: ܚܫܘܟܝܢ
  choice: 幽暗
  rationale: 用于加强最后黑水的黑暗程度，与前文普通的“黑”有所区别。
- source_word: ܚܒܠܐ ܘܐܒܕܢܐ
  choice: 毁坏和灭亡
  rationale: 保留两个并列的灾难性名词，不合并为单一结果。
- source_word: ܐܚܕ ... ܘܐܬܚܬ
  choice: 抓住……把……拖到地上
  rationale: 呈现两个连续而有力的动作，并保留第二个动作的向下方向。
- source_word: ܢܗ̈ܪܐ/ܢܘܗ̈ܪܐ
  choice: 河（脚注：或作“光”）
  rationale: 正文采用控制见证及叙事语境所支持的“河”，同时以脚注公开现存读法可能指“光”的文本歧义。
- source_word: ܟܪܘܙܐ
  choice: 宣告
  rationale: 按其可指宣告、传报之义译出，不进一步把它人格化为特定的“宣告者”；另以脚注保留代词所可能形成的不同句法关系。
theological_decisions:
- issue: 是否在异象本身中指明黑水与明亮之水所象征的历史时期
  choice: 只翻译异象画面，不加入历史对应
  alternative: 在正文中标出亚当、洪水等后文才出现的解释
  rationale: 本章先陈述异象，解释在后文展开；提前加入对应关系会消除文本刻意保留的悬念。
- issue: “十二条河”与“十二道光”的异文
  choice: 正文作“十二条河”，脚注注明“十二道光”
  alternative: 正文作“十二道光”或用含混概称回避选择
  rationale: “河”与从海中升起的叙事场景及控制见证相合；但叙利亚文字形和现存抄本读法支持“光”的可能性，故必须透明标注。
- issue: ܟܪܘܙܐ在末句是“宣告”还是“宣告者”
  choice: 正文作“那宣告”
  alternative: 译作“那位宣告者／传令者”
  rationale: “宣告”延续经审核的咨询层读法，又不将闪电明确等同于某一神学人物；该词的人格化可能性仍不应被视为已经解决。
- issue: 闪电对云所做的最终动作
  choice: 译为抓住云并把它拖到地上
  alternative: 译为在全地摇动云，或泛化为光战胜黑暗
  rationale: 所见动词组合表现强制控制和向下运动；具体翻译比神学化释义更忠于异象叙事。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。异象叙述保留重复句式和黑暗、明亮交替的节奏；不用教派化术语，也不在翻译中预先解释象征。正文中的“白水和黑水”“波浪”优先依据现存叙利亚语词形，而非机械沿用英语咨询层的“颜色”。
