revisions:
- from: '我说完这些话，就在那里睡着了；夜间，我看见了一个异象。看哪，我看见一朵云从大海升起，里面满是白水和黑水；这些水中翻腾着许多波浪。云的前端显出一道大闪电的形状。我观看时，那朵云急速而猛烈地掠过，遮盖了全地。此后，水开始从云中降到地上；我看见那些水的样子并不相同。接着，我又看见黑的；之后又是明亮的；又是黑的，又是明亮的。这样交替了十二次，但每一次，黑的都多于明亮的。


    到了那朵云的末尾，便有黑水降下，比先前所有的水都更幽暗；其中各种水混杂在一起。那些水无论降在哪里，都造成毁坏和灭亡。此后，我又看见先前在云的前端所见的那道闪电；它抓住那朵云，把云拖到地上。此后我观看，看哪，有十二条河[a]从海中升起，环绕那道闪电，归服于它；它们因那宣告而欢喜，并赞美它。[b]我因惧怕而惊醒。'
