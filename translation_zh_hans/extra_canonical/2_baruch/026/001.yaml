  text: And I answered and said, "Will that tribulation that is to come continue a long time, and will this necessity embrace many years?"
translation:
  language: zh_hans
  text: '**《巴录二书》26:1**


    我回答他说：“那场[a]将要来临的患难会持续很久吗？这困境会延续许多年吗？”


    [a] 或译：“这场”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这场”。
    reason: 叙利亚文为远指形式，正文据此译作“那场”；但现代汉语依篇章指代习惯也可说“这场”。
lexical_decisions:
- source_word: ܐܘܠܨܢܐ
  choice: 患难
  rationale: 该词表示压迫、困苦或患难；“患难”既符合启示文学的庄重语境，也保留了词义的宽度。
- source_word: ܗܘ̇
  choice: 那场
  rationale: 叙利亚文采用远指形式，故正文译作“那场”；汉语也可按上下文理解为“这场”，在脚注中保留该可能。
- source_word: ܕܐܬܝ̇
  choice: 将要来临的
  rationale: 直陈患难尚未来到，采用自然的现代汉语表达其将来意义。
- source_word: necessity / corresponding unstable Syriac reading
  choice: 困境
  rationale: 现存页边文本不稳定；英译审校层所反映的词义涉及迫切、不得不承受的处境。“困境”比“必要”更符合此处灾难性语境，同时避免加入特定神学解释。
- source_word: continue / embrace many years
  choice: 持续很久／延续许多年
  rationale: 两问均关乎患难历时；用近义而不完全重复的现代汉语表达，保留原文的平行结构。
theological_decisions:
- issue: 患难持续时间是否被明确断定
  choice: 保留为巴录提出的两个疑问句
  alternative: 改写成关于末世患难必然长久的陈述
  rationale: 原文在此提出问题，并未于本节直接给出答案；不应把疑问提前解释为确定的末世时间表。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我回答他说”保留古代叙事公式；两个平行问句清楚易懂。鉴于所给页边文本存在分章及识读不稳定，译文以可辨认的叙利亚文语义为先，并参考经审校的英文层，但不对不确定词形作虚假精确化处理。
