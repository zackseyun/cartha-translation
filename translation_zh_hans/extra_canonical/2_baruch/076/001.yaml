  yaml_path: translation/extra_canonical/2_baruch/076/001.yaml
  text: And he answered and said to me, “Because you have prayed that I show you what will happen to you after these things, for this reason I have shown you this vision, that you may see what will happen to you after these things. For you shall surely depart from this earth—but not unto death; rather, you shall be kept for the appointed times. Therefore go up to the summit of that mountain, and the regions of that land shall pass before you, and the form of the inhabited world, and the tops of the mountains, and the depths of the valleys, and the depths of the seas, and the number of the rivers, so that you may see what you are leaving and where you are going. And this shall be after forty days. Go therefore now, during these days, and instruct the people as much as you are able, so that they may learn, lest they die at the last time, but may learn so that they may live at the last time.”
translation:
  language: zh_hans
  text: 他回答我说：“既然你求我向你显明已经发生的事和已经造成的事，那么，关于这一切以后将要发生的事，你已经领受了更高深的悟性教导。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节现存叙利亚文的措辞和分句颇为困难。另有文本重构作：“因为你曾祈求我把这些事以后你将遭遇的事指示给你，所以我把这异象显给了你。”该读法随后还接有巴录离开大地、登上山顶以及四十天等内容；这些内容不见于此处所提供的 Ceriani 叙利亚文本。
    reason: 说明主要叙利亚见证与英文咨询文本及其重构之间的重大差异，保留真实的文本不确定性。
lexical_decisions:
- source_word: ܐܦܝܣܬ ܠܝ
  choice: 你求我
  rationale: 该表达在此表示恳求或请求；译作“求我”自然、庄重，也不过度限定请求的具体方式。
- source_word: ܕܐܚܘܝܟ
  choice: 向你显明
  rationale: 动词意为使人看见、指示或显明；“显明”适合启示性语境。
- source_word: ܕܗܘܐ ܐܝܟ ܕܥܒܝܕ
  choice: 已经发生的事和已经造成的事
  rationale: 紧贴现存叙利亚文中“发生／成为”与“造成／制作”的并列表达，不按较晚的重构文本改写成巴录自身将遭遇的事。
- source_word: ܝܘܠܦܢܐ ܡܥܠܝܬ
  choice: 更高深的……教导
  rationale: ܝܘܠܦܢܐ 指教导、训诲，ܡܥܠܝܬ 表示高超、卓越；合译既保留尊严，也符合现代汉语。
- source_word: ܕܥܬܝܕ ܠܡܗܘܐ
  choice: 将要发生的事
  rationale: 保留未来指向，不额外解释其末世论细节。
theological_decisions:
- issue: 本节究竟描述已发生与受造之事，还是巴录离世前将经历之事
  choice: 正文依所提供的 Ceriani 叙利亚文，译为“已经发生的事和已经造成的事”以及“以后将要发生的事”
  alternative: 按另一种文本重构译为“你求我把这些事以后你将遭遇的事指示给你”
  rationale: 所提供的主要见证与英文咨询层明显不一致。优先翻译现有原文证据，并以脚注公开文本困难，不把后者的山顶、四十天或不经死亡离世等内容移入本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“显明”“领受”“教导”维持启示文学语体；不引入特定宗派术语。
