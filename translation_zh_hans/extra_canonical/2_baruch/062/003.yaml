  text: 还有耶洗别的所作所为，以及以色列当时对偶像的敬拜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒܕܝܗ̇
  choice: 所作所为
  rationale: 该词意为“她的行为／所做的事”；结合上下文，所指为耶洗别的行为。译作“所作所为”自然且不额外评断其性质。
- source_word: ܕܚܠܬܐ / ܦܘܠܚܢܐ（语境所指）
  choice: 敬拜
  rationale: 表达以色列当时对偶像所行的宗教崇拜，用现代汉语“敬拜”准确而清楚。
- source_word: ܦܬܟܪ̈ܐ（语境所指）
  choice: 偶像
  rationale: 采用现代中文圣经语境中通行且易懂的对应词。
theological_decisions:
- issue: ܥܒܕܝܗ̇应译为“行为”还是“咒诅”
  choice: 所作所为
  alternative: 咒诅
  rationale: 叙利亚文词义是“她的行为／作为”，没有“咒诅”之义；因此不沿用旧注所反映的错误理解。
- issue: 是否把耶洗别的行为明译为“恶行”
  choice: 保留为较中性的“所作所为”
  alternative: 恶行
  rationale: 上下文自然带有负面评价，但源词本身仅指行为；不在正文中增加源文未明说的定性。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“所作所为”与“对偶像的敬拜”便于普通读者理解，同时紧贴源文，不保留依据不足的“咒诅”异译注。
