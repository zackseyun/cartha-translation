  yaml_path: translation/extra_canonical/2_baruch/062/004.yaml
  text: And the withholding of rain, and the famines that came to pass until women ate the fruit of their womb.
translation:
  language: zh_hans
  text: 又有雨水的断绝，以及发生的饥荒，直到妇女吃自己腹中所生的孩子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܛܪܐ
  choice: 雨水
  rationale: 采用现代汉语中自然且明确的表达，指从天降下、维系收成的雨。
- source_word: the withholding of rain（据审校咨询层；所给叙利亚文页段在相关句尾处残缺）
  choice: 雨水的断绝
  rationale: “断绝”既表达降雨被止住，也保留灾祸持续发生的力度；不额外说明施事者。
- source_word: the fruit of their womb（据审校咨询层；所给叙利亚文页段未完整显示该短语）
  choice: 自己腹中所生的孩子
  rationale: 以现代汉语清楚传达母腹所生的儿女；相比直译“腹中的果子”，更自然，也准确呈现饥荒中食子的惨状。
theological_decisions:
- issue: 降雨为何断绝、由谁使其断绝
  choice: 使用无施事表达“雨水的断绝”
  alternative: 译作“上帝不降雨”或“雨水被扣留”
  rationale: 原句在现有证据中并未明确点出施事者，因此不把神学推断写入正文。
- issue: “腹中所生的”所指为何
  choice: 明确译为“孩子”
  alternative: 保留比喻形式“腹中的果子”
  rationale: 上下文所述是饥荒导致母亲食子；译为“孩子”传意清楚，却不增添其年龄或身份等原文未说明的信息。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“随之而来”呈现旱灾与饥荒的自然衔接；末句保持简洁直接，不弱化原文的惨烈程度。现有叙利亚文页面摘录在相关位置残缺，因此以可见词汇和经审校的英文咨询层共同控制措辞。
