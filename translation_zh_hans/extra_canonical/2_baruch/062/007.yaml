  text: But concerning the nations, it would be too much to tell how they continually acted in impiety and wickedness and never showed themselves righteous.
translation:
  language: zh_hans
  text: 至于列国，他们不断行不敬虔和邪恶的事，从未显出自己是义的；要述说这些，实在难以尽述。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܡ̈ܐ（据本节传统文本；所给章节页桶未能清楚定位）
  choice: 列国
  rationale: 在本节语境中指以色列以外的诸民族；“列国”比“外邦人”更贴近民族集合的原义，也较少附加贬义。
- source_word: ܪܫܝܥܘܬܐ / ܒܝܫܘܬܐ（据本节传统文本）
  choice: 不敬虔和邪恶的事
  rationale: 保留两个并列的道德—宗教概念，不把二者合并成笼统的“罪恶”。
- source_word: ܙܕܝܩ̈ܐ / ܙܕܝܩܘܬܐ（据本节传统文本）
  choice: 显明自己为义
  rationale: 表达行为或表现层面的“显为正直”，避免译成“被称义”，从而不引入原句未明确表达的法庭性或教义性含义。
theological_decisions:
- issue: “为义”是否指神学意义上的称义
  choice: 译作“显明自己为义”
  alternative: 译作“得称为义”或“成为义人”
  rationale: 本句重点是列国一贯的行为表现；采用反身、显现性的表达，保留其道德判断，而不把它限定为某种称义教义。
- issue: 对列国的概括是否应弱化
  choice: 保留“不断”与“从未”的绝对性措辞
  alternative: 译作“常常”与“很少”
  rationale: 原有见证及审校层所呈现的是强烈、概括性的控诉；弱化会改变作者的修辞力度。
translation_notes:
  register: 采用庄重而自然的现代书面汉语。“实在说不胜说”传达叙述内容过多、难以尽述的语气。所给叙利亚文材料是经页面插值取得的章节页桶，且存在跨页重叠，本节对应文字未能在所示片段中可靠定位，因此措辞以已审校的本节传统文本和英语咨询层交叉控制；不据页面噪声臆造异文。
