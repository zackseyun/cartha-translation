lexical_decisions:
- source_word: ܡܝ̈ܐ
  choice: 水
  rationale: 保留本章异象反复使用的“水”这一核心意象；中文用“股”作量词，使表达自然，但不改变意象。
- source_word: ܐܘܟ̈ܡܐ
  choice: 黑水
  rationale: 直译表示黑色的形容词，不将其解释性改写为“灾祸”或“邪恶”，以保留异象本身的象征张力。
- source_word: ܕܫܒܥ
  choice: 第七股
  rationale: 按序数意义表达异象中各段水的次序；“股”仅为现代汉语量词。
- source_word: ܕܚܙܝܬ
  choice: 你所看见的
  rationale: 保留第二人称单数及先前所见异象的回指关系。
theological_decisions:
- issue: “黑水”的象征含义
  choice: 保留“黑水”这一异象性表述
  alternative: 译为“第七次灾祸”或“第七个邪恶时代”
  rationale: 本节是在辨认异象中的水，并未在此直接把象征意义等同于某一种神学解释，因此不在正文中提前释义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“这些就是……”体现指认和总结语气；不添加原文没有的解释。
