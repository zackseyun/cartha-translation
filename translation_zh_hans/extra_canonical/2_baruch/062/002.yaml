  text: And all the wickedness that the kings after him committed in unrighteousness.
translation:
  language: zh_hans
  text: 以及他以后的君王以不义所行的一切恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܒܝܫܘܬܐ / English consultation: wickedness'
  choice: 恶事
  rationale: 按上下文指君王实际行出的邪恶行为；译作“恶事”比抽象的“邪恶”更自然，同时保留其道德谴责。
- source_word: 'ܒܥܘܠܐ / English consultation: in unrighteousness'
  choice: 以不义
  rationale: 保留“不义”这一司法与道德色彩兼具的表达，也保留原句所示的方式或性质关系，不将其具体化为某一种罪。
- source_word: 'ܡ̈ܠܟܐ / English consultation: the kings'
  choice: 那些君王
  rationale: “那些”使“他以后”的后置限定在现代汉语中清楚地修饰复数的君王。
theological_decisions:
- issue: “恶事”与“不义”是否合并为单一概念
  choice: 分别保留为“恶事”和“以不义”
  alternative: 译作“所行的一切不义恶行”
  rationale: 原句把所行之恶与其不义的性质或方式并列呈现；分别翻译可保留这种语义张力，避免压缩。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；保留“他以后”的指代，不擅自补明先行人物。
