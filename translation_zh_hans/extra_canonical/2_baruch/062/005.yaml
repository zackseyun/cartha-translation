  text: 以及那因他们罪恶累累而临到九个半支派的被掳时期。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: 时期
  rationale: 按英语审校层及本节结构，此词表示一段历史时期；译作“时期”比单纯的“时候”更适合列举历代事件的语境。
- source_word: ܫܒܝܬܐ / captivity（据审校层所保存的本节读文）
  choice: 被掳
  rationale: 采用现代中文圣经历史叙述中自然且明确的表达，指支派遭强制迁徙、流放。所给叙利亚文页面分段与目标节定位并不清晰，因此以审校层保存的节文为控制。
- source_word: nine and a half tribes
  choice: 九个半支派
  rationale: 保留原有数目表达及其历史指向，不擅自改释为某一具体支派名单。
- source_word: many sins
  choice: 罪恶累累
  rationale: 自然传达“许多罪／处于许多罪中”的闪语式含义，同时保留其作为被掳原因的道德判断。
theological_decisions:
- issue: 被掳与罪之间的因果关系
  choice: 译作“因为他们罪恶累累”
  alternative: “当时他们犯了许多罪”
  rationale: 保留原文所表达的因果关系，不弱化为仅仅同时发生，也不进一步说明惩罚机制。
- issue: 九个半支派的身份
  choice: 仅保留“九个半支派”
  alternative: 在正文中认定为以色列北方诸支派
  rationale: 本节本身只给出数目；为避免加入经文未明说的历史或宗派性解释，不作扩充。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“临到……的被掳时期”保留事件临到支派的句法关系；“罪恶累累”比“在许多罪中”自然。由于所附叙利亚文属于章节页桶且目标节原句无法从页面切分中可靠定位，本稿以英语POB审校层的节文为控制，并避免制造无法由现有证据支持的脚注。
