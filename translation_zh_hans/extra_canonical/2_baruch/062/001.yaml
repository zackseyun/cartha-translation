  text: And the seventh black waters that you saw—this is the perversion brought about by the counsel of Jeroboam, who took counsel to make two calves of gold.
translation:
  language: zh_hans
  text: 你所看见的第七段黑水，就是耶罗波安谋划制造两只金牛犊所带来的败坏。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܚܫ̈ܟܐ / ܐܘܟܡ̈ܐ
  choice: 黑水
  rationale: 保留异象中黑水与明水之间鲜明、固定的象征性对比；“黑水”也比“暗水”更具体有力。
- source_word: ܚܒܠܬܐ
  choice: 败坏
  rationale: 此处指耶罗波安的计谋所造成的宗教与政治扭曲。“败坏”兼具道德损坏和使事物变质之意，符合上下文，又不额外限定其性质。
- source_word: ܬܪ̈ܝܢ ܥܓ̈ܠܐ ܕܕܗܒܐ
  choice: 两只金牛犊
  rationale: 采用现代汉语中熟悉而准确的圣经表达，明确数量、材质和所造之物。
- source_word: ܡܠܟ / ܡܡܠܟ
  choice: 计谋／商议
  rationale: 用两个同源语义表达保留原句中“谋划”概念的重复，同时使中文行文自然。
theological_decisions:
- issue: 黑水与“败坏”之间的单复数指代
  choice: 就是……所造成的败坏
  alternative: 这些就是……所造成的败坏
  rationale: 叙利亚文以阴性单数指示语和系词与阴性单数谓语“败坏”呼应；中文不必强行让系词结构与复数概念“水”一致，因此采用自然的单数性说明结构。
- issue: 耶罗波安行为的定性范围
  choice: 败坏
  alternative: 腐败／毁灭／悖谬
  rationale: “败坏”保留道德、敬拜和政治秩序被扭曲的综合含义，不把经文收窄为单纯政治腐败或彻底毁灭。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“第七股黑水”把异象中的一组水视为一股象征性水流，较“第七次黑水”更具画面感；分号保留后半句对耶罗波安计谋的具体说明。
