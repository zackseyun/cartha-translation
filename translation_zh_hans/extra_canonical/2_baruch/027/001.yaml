base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/027/001.yaml
  text: 'And I answered and said to him, “After this, that time is divided into twelve parts, and each one of them is known for what has been appointed in it. In the first part: the beginning of upheavals. In the second part: the slaying of the great ones. In the third part: the fall of many. In the fourth part: the sending forth of the sword. In the fifth part: famine. In the sixth part: earthquakes. In the seventh part: terrors and plagues. In the eighth part: assaults of spirits and of demons of apparitions. In the ninth part: the fall of fire. In the tenth part: plundering and much oppression.”'
translation:
  language: zh_hans
  text: 我回答他说：“此后，那段时期分为十二个阶段[a]，每一个阶段都可由其中所定的事识别出来。第一阶段，是动乱的开始；第二阶段，是权贵被杀；第三阶段，是许多人倒下；第四阶段，是刀剑出动；第五阶段，是饥荒；第六阶段，是地震；第七阶段，是恐怖和灾祸；第八阶段，是灵的侵袭，以及显形之鬼魔的侵袭[b]；第九阶段，是火降下；第十阶段，是劫掠和重重压迫。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本页叙利亚文作“三十个时期”；但后续编号结构及其他文本见证支持“十二个阶段”。
    reason: 原始页面数字与对校传统及全段结构冲突，必须公开保留这一重要异文。
  - marker: b
    text: 本句原文结构不明，也可译作“灵与显形鬼魔的侵袭”，或“灵的侵袭和鬼魔的幻象”。
    reason: 属格关系及“形貌／显现”一词的修饰范围存在真实歧义。
lexical_decisions:
- source_word: ܡܢܝܢ ... ܙܒܢܝ̈ܢ
  choice: 分为十二个阶段
  rationale: 后文按顺序列举各个“阶段”，故用“阶段”比直译为“次数”自然；现存页面所见数字与十二阶段传统有冲突，正文采用结构及对校传统所支持的“十二”，并以脚注保留异文问题。
- source_word: ܡܬܬܝܕܥܐ
  choice: 为人所知
  rationale: 保留叙利亚文“被知道、被识别”的被动意义，不擅自改成“被保留”或“被显明”；后接“其中所定之事”说明各阶段的识别特征。
- source_word: ܙ̈ܘܥܐ
  choice: 动乱
  rationale: 此处可指震荡、骚乱或剧变；因第六阶段另有可明确译作“地震”的同形词，第一处采用范围较广的“动乱”，以保存语境中的区分。
- source_word: ܪ̈ܘܪܒܢܐ
  choice: 权贵
  rationale: 所指是地位显赫或有权势者；“权贵”在现代汉语中简洁自然，又不把范围限定为某一官职或阶层。
- source_word: ܫܕܪܘܬܐ ܕܚܪܒܐ
  choice: 刀剑出动
  rationale: 保留“差遣、放出刀剑”的主动意象，同时避免生硬的逐词翻译。
- source_word: ܬܗܪ̈ܐ
  choice: 恐怖
  rationale: 该词可表示惊骇、可怖之事或异象；在灾难清单中译作“恐怖”最能保持其可怕而未完全具体化的含义。
- source_word: ܡܚܘ̈ܬܐ
  choice: 灾祸
  rationale: 字面可指打击、创伤或灾殃；“灾祸”适合此处集体性审判灾难的语境，同时不强行限定为疫病。
- source_word: ܫܘ̈ܕܐ ܕܢܦܫ̈ܬܐ
  choice: 灵的侵袭
  rationale: 词组困难；在末世灾难清单中，“侵袭”较能表达敌对活动，但其结构仍有其他可能，故以脚注提示。
- source_word: ܫ̈ܐܕܐ ... ܦܪ̈ܨܘܦܐ
  choice: 显形之鬼魔
  rationale: ܫ̈ܐܕܐ明确指鬼魔；ܦܪ̈ܨܘܦܐ可指面貌、形态或显现，此处用“显形”传达诡异可见的显现，同时保留句法歧义于脚注。
- source_word: ܢܦܠܘ ܕܢܘܪܐ
  choice: 火从天降下
  rationale: 原文是“火的降落”；汉语用“火从天降下”呈现启示文学中的降火图景，“从天”属于语境性明示。
- source_word: ܚܛܘܦܝܐ ܘܐܢܘܣܝܐ ܣܓܝܐܐ
  choice: 劫掠和重重压迫
  rationale: 前者指暴力夺取，后者指强迫、压制；“重重”自然表达ܣܓܝܐܐ的“许多、严重”之意。
theological_decisions:
- issue: 灾祸时期的数字结构
  choice: 正文作“十二个阶段”，并注明现存叙利亚文页面作“三十”
  alternative: 三十个时期
  rationale: 所给页面清楚可读为ܬܠܬܝܢ（“三十”），不可隐去；但后文明确按阶段连续列举，且对校传统支持十二阶段结构。正文采用较能解释整体结构的“十二”，脚注如实保留主要文本张力。
- issue: 第八阶段的超自然内容
  choice: 保留“灵”和“鬼魔”为启示异象中的超自然行动者
  alternative: 将其心理化为内在恐惧，或泛化为普通灾害
  rationale: 叙利亚文明确使用“灵”与“鬼魔”一类词语；翻译不将其自然化，也不进一步规定这些存在的教义性质。
- issue: 第八阶段词组的句法关系
  choice: “灵的侵袭，以及显形之鬼魔的侵袭”
  alternative: “灵与显形鬼魔的侵袭”；或“灵的侵袭和鬼魔的幻象”
  rationale: 原文连续属格结构容许不同组合方式。正文给出可读且保留超自然质感的理解，脚注列出另一种可能，避免把不确定句法说死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。灾难清单用分号保持节奏和层次；避免古奥的“差遣刀剑”等硬译，也不以现代心理学或特定宗派术语消解启示文学的超自然表达。
