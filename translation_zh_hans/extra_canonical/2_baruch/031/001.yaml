  yaml_path: translation/extra_canonical/2_baruch/031/001.yaml
  text: 'And it happened after these things, that I went to the people and said to them, “Gather to me your elders and your children, and I will speak my words with them."”


    And they all assembled in the valley of Kidron.


    And I asked and said to them,'
translation:
  language: zh_hans
  text: '这些事之后，我来到百姓那里，对他们说：“把你们的长老和儿女召集到我这里来；我要向他们讲说我的话。[a]”


    众人都聚集在汲沦谷。我便问他们说：'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本页叙利亚文此处疑有讹误，字面可读作“要寻求我的话”；标准文本传统作“我要向他们讲说我的话”。
    reason: 所给 Ceriani 页面文本在此处语法和语意不顺，而校勘传统所保存的读法可解释上下文；正文采用后者，同时公开文本不确定性。
lexical_decisions:
- source_word: ܟܢܫܘ
  choice: 召集
  rationale: 这是直接的命令语气，要求听众把指定的人聚集起来；“召集”在现代汉语中自然，也保留行动的直接性。
- source_word: ܣܒܝܟܘܢ ܘܒܢ̈ܝܟܘܢ
  choice: 你们的长老和儿女
  rationale: ܣܒܝܟܘܢ 指群体中的长老，ܒܢ̈ܝܟܘܢ 可指儿子或儿女；此处用“儿女”表达较广的后代或年轻一代，不限于男性。
- source_word: ܒܚܠܬܐ ܕܩܕܪܘܢ
  choice: 在汲沦谷
  rationale: 指耶路撒冷附近的 Kidron Valley；采用现代中文圣经地名中常见的“汲沦谷”。
- source_word: ܒܥܝܬ ܘܐܡܪܬ ܠܗܘܢ
  choice: 我请求他们说
  rationale: ܒܥܐ 可表示求、请求或询问；这里后接一段劝告，以“请求”较能保留恳切语气，同时不把它解释成回答。
theological_decisions:
- issue: 巴录将要宣告之话语的对象与归属
  choice: 我要向他们说我的话
  alternative: 我要对你们说话；要寻求我的话
  rationale: 标准叙利亚文本传统支持“与他们说我的话”，既保留第一人称所属“我的”，也保留第三人称对象“他们”。不过本页所载字形疑有传抄或识读问题，因此以脚注说明，不据此引入额外神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“民众”对应作为整体的百姓，“长老和儿女”保留群体内部的世代层次。末句以冒号结束，因为后续讲话延续到下一节。
