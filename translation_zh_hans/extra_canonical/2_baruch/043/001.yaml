  yaml_path: translation/extra_canonical/2_baruch/043/001.yaml
  text: 'But you, Baruch, fix your heart on what has been said to you, and understand the things shown to you, for much eternal consolation is yours.

    For from now on you will not again see the evil things that are now happening.

    Therefore go and command my people, and do not stir them up, because after these things, in the times to come, many days of affection will come. And I will make known to you and speak in your understanding.'
translation:
  language: zh_hans
  text: '但你，巴录，要坚定你的心，专注于对你所说的话，并明白向你显明的事，因为你有丰盛而永远的安慰。


    从今以后，你不会再看见如今正在发生的这些恶事。


    所以，你去吩咐我的子民，不要使他们动荡；因为这些事以后，在将来的时期，许多蒙眷爱的日子将要来到。我也要使你知道，并在你的悟性中向你说话。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句叙利亚文的人称和数并不完全整齐，直译近于“我要使你们知道，并在你们的悟性中说话”；按上下文，这里仍是对巴录说话，因此正文采用单数。
    reason: 说明抄本文本中的人称、数问题，并交代正文为保持语境连贯所作的最小调整。
lexical_decisions:
- source_word: ܐܬܩܢ ܠܒܟ
  choice: 坚定你的心，专注于
  rationale: ܐܬܩܢ有使之稳固、安定、预备妥当之意；保留“心”的具体意象，同时以“专注于”自然引出后面的内容。
- source_word: ܒܘܝܐܐ ܣܓܝܐܐ ܕܒܠܥܕܡ
  choice: 丰盛而永远的安慰
  rationale: ܒܘܝܐܐ侧重安慰、慰藉；ܣܓܝܐܐ表示丰盛或极大，ܕܒܠܥܕܡ表示无尽、永远。中文以集合性的“安慰”表达，不强行复制数的形式。
- source_word: ܒܝ̈ܫܐ ... ܡܘ̈ܬܐ
  choice: 如今正在发生的这些恶事
  rationale: 该行抄本文本较粗糙，但语境清楚指当前显现或发生的灾恶；译文保留宽泛指称，避免补入具体灾难。
- source_word: ܠܐ ܬܬܬܙܝܥܘܢ
  choice: 不要使他们动荡
  rationale: 词根ܙܘܥ含摇动、震动、扰乱之意；结合复数受词语境，译为使百姓动荡，不限定为情绪激动或政治叛乱。
- source_word: ܝܘܡ̈ܬܐ ... ܚܒܒܐ
  choice: 许多蒙眷爱的日子
  rationale: ܚܒܒܐ可涉及爱、亲爱、恩宠；“蒙眷爱”保留关系性与受恩意味，而不将其缩减为单纯愉快的日子。
- source_word: ܡ̇ܘܕܥ ܐܢܐ ܠܟܘܢ ܘܐܡ̇ܠܠ ܒܡ̈ܕܥܝܟܘܢ
  choice: 我也要使你知道，并在你的悟性中向你说话
  rationale: 原文在单复数形式上可能受传抄或段落边界影响；此处依对巴录的连续讲话采用单数，并保留“在悟性中说话”这一不寻常表达。
theological_decisions:
- issue: 给巴录的应许应理解为何种安慰
  choice: 译为丰盛而永远的安慰，保留其末世性和慰藉性
  alternative: 仅指今生的心理安慰，或仅译为抽象的盼望
  rationale: ܒܘܝܐܐ本身有安慰的语义，而ܕܒܠܥܕܡ赋予其长存、无尽的范围；不宜削弱任何一面。
- issue: “蒙眷爱的日子”的施予者与具体性质
  choice: 不明说是安宁、复兴或神直接赐下的恩宠
  alternative: 明确译成“幸福的日子”“神施恩的日子”或“和平时期”
  rationale: 原文用爱或眷爱性质的词描述将来的日子，但未在本句中充分限定其政治、社会或救赎性质，应保留开放性。
- issue: “在你的悟性中向你说话”的启示方式
  choice: 保留原文表达，不判定为异象、内在默示或可听见的神谕
  alternative: 明确译为“在你心里启示你”或“亲口对你说”
  rationale: 原文指出话语与悟性相关，却未清楚规定启示机制；不应替文本作神学判定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“心”“安慰”“悟性”等原文核心意象；对文本粗糙处避免过度补足。
