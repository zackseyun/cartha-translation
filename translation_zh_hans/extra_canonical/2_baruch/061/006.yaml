  text: And the judgments of the rulers were then seen to be without deceit, and the righteousness of the commandments of the Mighty One was accomplished in truth.
translation:
  language: zh_hans
  text: 那时，众统治者的判决显明为毫无欺诈；大能者诫命的公义也在真理中得以成全。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝ̈ܢܐ
  choice: 判决
  rationale: 按复数形式处理，指众统治者所作的各项裁断；“判决”比宽泛的“审判”更自然地搭配统治者。
- source_word: ܫܠܝ̈ܛܢܐ
  choice: 众统治者
  rationale: 保留复数及政治权柄含义，不具体化为君王或官长。
- source_word: ܕܠܐ ܢܟܠܐ
  choice: 毫无欺诈
  rationale: 表达没有诡诈、虚假或欺骗，避免把意义缩窄为单纯的程序公正。
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 保留该书对上帝的尊称，不擅自换成专名。
- source_word: ܐܫܬܡܠܝܬ ܒܩܘܫܬܐ
  choice: 真实地实现了
  rationale: 兼顾“成就、实现”与“在真实中”的语义，中文表达自然，同时不额外解释其实现方式。
theological_decisions:
- issue: “大能者”是否直译为“上帝”
  choice: 保留“大能者”
  alternative: 上帝
  rationale: 原文使用称号；保留称号可维持文本自身的神学措辞和修辞色彩。
- issue: 诫命的“公义”与实现之间的关系
  choice: 译作“大能者诫命的公义也真实地实现了”
  alternative: 大能者公义的诫命也确实得到了遵行
  rationale: 原句将“公义”作为核心概念，不宜改写成诫命的修饰语，也不应把“成就”限定为人的遵行。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。依据复数语法译作“众统治者的判决”，不沿用旧有的单数异译；本节无需脚注。
