  yaml_path: translation/extra_canonical/2_baruch/061/007.yaml
  text: And the land, because it then received mercy, and because its inhabitants did not sin, was glorified above all lands; and the city Zion then ruled over all lands and regions.
translation:
  language: zh_hans
  text: 那地因当时蒙了怜悯，又因其中的居民没有犯罪，就得了荣耀，超过一切土地；锡安城那时统辖所有土地和地区。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那时统辖所有土地。”
    reason: 保留较短的可能译法；该译法不另译“和地区”。
lexical_decisions:
- source_word: ܐܪܥܐ (ʾarʿā)
  choice: 地／土地
  rationale: 按上下文分别译为“那地”和“一切土地”，既自然，也保留原词兼指地域、国土的宽泛含义。
- source_word: ܐܬܪܚܡܬ (ʾetraḥmat，依据本节校勘文本)
  choice: 蒙了怜悯
  rationale: 采用被动表达，保留土地作为受怜悯者的语义，不擅自补明施怜悯者。
- source_word: ܐܫܬܒܚܬ (ʾeštabḥat，依据本节校勘文本)
  choice: 得了荣耀
  rationale: 体现被高举、得荣耀的被动意义；“超过一切土地”保留比较结构。
- source_word: ܫܠܛܬ ܗܝܕܝܢ (šellṭat haydēn，依据本节校勘文本)
  choice: 那时统辖
  rationale: 明确译出时间副词“那时”，并用“统辖”表达政治上的管辖或支配，而不弱化为一般影响力。
- source_word: ܨܗܝܘܢ (Ṣehyon)
  choice: 锡安
  rationale: 采用现代中文宗教与历史文献中通行的专名译法。
theological_decisions:
- issue: 土地蒙怜悯与居民无罪之间的关系
  choice: 用“因……又因……”并列呈现两个理由
  alternative: 将居民没有犯罪解释为土地蒙怜悯的原因，合并为单一因果链
  rationale: 源文把两项理由并列；译文不把它们重组为更具体的神学因果关系。
- issue: 锡安统辖范围的表述
  choice: 正文保留“所有土地和地区”，脚注列出较短读法
  alternative: 正文仅作“所有土地”
  rationale: 保留咨询文本所反映的较完整地理范围，同时以脚注呈现简短译法，避免掩盖表达上的不确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那地”与“锡安城”保持叙事指向清楚；分号连接土地得荣耀与锡安统辖两项结果。正文中的脚注标记[a]与脚注对应。
