revisions:
- from: 那时，锡安得以建造[a]，圣所举行了奉献礼；当时犯罪的列国之人流了许多血，圣所奉献之时也献上了许多祭物。
  to: 那时，锡安被建造，圣所举行了奉献礼；当时犯罪的列国的人流了许多血，圣所奉献礼上也献上了许多祭物。
  rationale: 将“锡安得以建造”改为“锡安被建造”，删除无明示根据的许可／成就色彩；并微调“列国之人”为更自然的“列国的人”。其余内容、专名、礼仪术语及脚注均予保留。
