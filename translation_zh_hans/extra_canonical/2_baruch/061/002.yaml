  yaml_path: translation/extra_canonical/2_baruch/061/002.yaml
  text: And at that time there came the building of Zion, and the dedication of the sanctuary, and much blood of the nations who sinned then was shed, and many offerings were offered then at the dedication of the sanctuary.
translation:
  language: zh_hans
  text: 那时，锡安被建造，圣所举行了奉献礼；当时犯罪的列国的人流了许多血，圣所奉献礼上也献上了许多祭物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘܐ（据本节所据叙事措辞及英译审校层）
  choice: 得以建造／举行了
  rationale: 该常用动词可表示“发生、出现、成为”。按不同名词搭配分别自然表达，同时不额外指定建造者或奉献者。
- source_word: ܨܗܝܘܢ / Zion（据英译审校层定位）
  choice: 锡安
  rationale: 采用现代汉语读者熟悉的传统专名译法。
- source_word: ܒܝܬ ܩܘܕܫܐ / sanctuary（据英译审校层定位）
  choice: 圣所
  rationale: 保留礼仪和圣殿语境，不将其窄化为整座“圣殿”。
- source_word: offerings（据英译审校层定位）
  choice: 祭物
  rationale: 上下文是圣所奉献礼；“祭物”比泛称“礼物”更准确，同时不武断限定为某一种祭。
theological_decisions:
- issue: “锡安的建造”是否应解释为重建耶路撒冷或圣殿
  choice: 译作“锡安得以建造”
  alternative: “耶路撒冷被重建”或“圣殿被重建”
  rationale: 保留“锡安”这一原有象征性地名及被动/事件性表达，不把它解释性缩窄。
- issue: 列国流血与犯罪之间的关系
  choice: “当时犯罪的列国之人流了许多血”
  alternative: “列国因犯罪而受惩罚，死伤惨重”
  rationale: 原句陈述犯罪者与流血，却未明说惩罚机制或死伤范围，故不补入因果性神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“举行了奉献礼”避免“圣所的奉献发生了”的生硬表达；分号呈现建造、奉献与流血、献祭之间的叙事层次。现给出的叙利亚文页段属于章节范围且未清楚显出本节对应行文，因此具体措辞以章节定位及经审校的英文咨询层相互约束，未虚构不可见的叙利亚词形。
