  text: And wisdom was heard in the assembly, and the riches of understanding were magnified in the congregations.
translation:
  language: zh_hans
  text: 智慧在集会中被听见，悟性之丰富在各会众中被显扬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܟܡܬܐ
  choice: 智慧
  rationale: 对应叙利亚语“智慧”，保留其人格化或作为神赐智慧的可能性，不另作解释。
- source_word: ܣܘܟܠܬܢܘܬܐ
  choice: 悟性
  rationale: 指理解、洞察的能力；“悟性”既准确又符合庄重的现代汉语经文语体。
- source_word: ܥܘܬܪܐ
  choice: 丰富
  rationale: 原义为财富、丰盛；与抽象名词“悟性”连用时译作“丰富”较自然，同时保留丰厚充盈的意象。
theological_decisions:
- issue: 智慧与悟性是否应明确为上帝的属性或恩赐
  choice: 不添加所属说明
  alternative: 译作“上帝的智慧”或“上帝所赐悟性的丰富”
  rationale: 本节措辞本身未明确加上所属关系；保留原文的开放性，避免加入经文未明说的神学限定。
- issue: 被动表达的施事者
  choice: 保留“被听见”“受到尊崇”的无施事者表达
  alternative: 补出“人们听见……并尊崇……”
  rationale: 不擅自指定行动主体，也保留原句庄重的被动结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“会众”与“各聚会”既呈现两个群体性场合的对应，也避免机械重复；全句保持诗性平行结构。
