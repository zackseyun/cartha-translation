    issue: “各聚会”指称不自然。
    rationale: 汉语中“聚会”多指一次活动或活动本身；此处的 congregations 指群体或集会场合。改作“各会众”更自然，也更好保留复数。
  revised_text: 智慧在集会中被听见，悟性之丰富在各会众中被显扬。
