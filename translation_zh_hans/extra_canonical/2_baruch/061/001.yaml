  text: And the sixth bright waters that you saw—this is the time in which David and Solomon were born.a
translation:
  language: zh_hans
  text: 你所看见的第六组明亮的水，代表大卫和所罗门出生的时期。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按原文较直译：“这些是那个时期。”原文以复数的“水／这些”对应单数的“时期”。
    reason: 说明原文复数异象符号与单数时间名词的句法张力，同时使脚注中文清楚可读。
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: 明亮的水
  rationale: 保留异象中与“黑暗的水”相对的光明意象；“明亮”既表达光辉、吉祥的象征意义，也不过度扩展为纯粹诗化措辞。
- source_word: ܙܒܢܐ
  choice: 时代
  rationale: 此处指大卫和所罗门出生并兴起的历史时期，“时代”比单纯的“时间”更符合上下文。
- source_word: ܐܬܝܠܕܘ
  choice: 出生
  rationale: 按其通常被动态含义直译，明确指大卫和所罗门在这一时期出生。
theological_decisions:
- issue: 第六段明亮的水所代表的是历史上的大卫—所罗门时期，还是直接指向弥赛亚统治
  choice: 按上下文译作大卫和所罗门出生的历史时代，同时保留其在全书异象结构中的预表空间
  alternative: 直接译成弥赛亚统治的时代
  rationale: 本节明确以大卫和所罗门为时间标志；不应把后文的弥赛亚启示提前强加于此。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第六段”说明这是异象中依次出现的一组水；“代表”使复数异象符号与单数历史时期之间的关系在汉语中清楚可读，同时脚注保留较形式对应的译法。
