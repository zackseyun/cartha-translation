  text: O You who created the earth, hear me—You who established the firmament by the word, and made firm the height of heaven by the spirit[a].
translation:
  language: zh_hans
  text: 创造大地者啊，求你垂听我！你以话语立定穹苍，以气息[a]使高天稳固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”所译的叙利亚语也可译作“灵”；这里“话语”与“气息”的并列，可能呼应《诗篇》33:6。
    reason: 保留 ܪܘܚܐ 的词义歧义及可能的经文互文。
lexical_decisions:
- source_word: ܕܒܪܐ
  choice: 创造
  rationale: 源自动词 b-r-ʾ，指创造；在呼格结构中译作“创造大地的主”，以自然汉语表达对上帝的直接称呼。
- source_word: ܬܩܢܬ
  choice: 立定
  rationale: Pael 词形兼有安置、整饬并使之稳固之意；“立定”既保留建立的动作，也与下句“稳固”形成自然对应。
- source_word: ܪܩܝܥܐ
  choice: 穹苍
  rationale: 指铺展在上的天空穹顶；“穹苍”是庄重而易懂的中文圣经语汇，并保留古代宇宙图景。
- source_word: ܒܡܠܬܐ
  choice: 以话语
  rationale: ܡܠܬܐ 在此为施行创造的言语；“以话语”保留工具性介词，并与后句“以气息”平行。
- source_word: ܘܫܪܪܬ
  choice: 使……稳固
  rationale: 源自动词 š-r-r，表达坚固、确立；如此处理可体现与前句“立定”的近义平行而不将两词完全同化。
- source_word: ܪܘܚܐ
  choice: 气息
  rationale: ܪܘܚܐ 可指气息、风或灵；本句与“话语”平行，并可能呼应《诗篇》33:6，因此正文采用“气息”，同时以脚注保留“灵”的可能。
theological_decisions:
- issue: ܪܘܚܐ 是否应作人格化或神学化的“灵”
  choice: 正文译“气息”，脚注注明也可译“灵”
  alternative: 正文译“灵”
  rationale: 叙利亚语本身允许两义；在创造语境及与“话语”的诗性平行中，“气息”较直接，但不应排除“灵”的神学读法，故以脚注保存歧义。
- issue: 对受呼者的称谓是否明说“主”
  choice: 用“创造大地的主啊”表达呼格
  alternative: 直译为“创造大地者啊”
  rationale: 原文以阳性单数关系结构直接呼唤创造者；中文“……的主啊”自然、庄重，且不额外加入专名或宗派性解释。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“求你垂听我”自然呈现祈求语气；两个“以……”分句保留原文平行结构。脚注标记已在正文中以[a]出现。
