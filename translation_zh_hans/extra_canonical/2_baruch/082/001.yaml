- from: '现在，我们看见列国兴盛富足，尽管他们作恶；然而，他们不过如一滴水。我们注视他们强大的威势；然而，他们必被看作唾沫。我们思想他们盛大的荣耀，尽管他们不遵守大能者的诫命，反倒轻蔑这些诫命。我们也思想那显于外的华美，尽管它在患难中动摇；然而，他们必像疼痛的肉身一样被追讨。我们想到他们所倚仗的把握，尽管它就在我们眼前动摇；然而，他们必像波浪一样被击碎。我们只寻求他们力量所带来的希望，尽管这力量因上帝赐给他们的美物而兴旺；然而，它必被收藏起来，哀哭也必临到它。


    至高者确实正在催促他的时日，使他的时辰临近。他必审判那些欺压人的；这世代的宣告也必发出。一切隐藏的罪都必显露，安静思念正道的心思必如泉涌出。那些如今以为自己能够逃脱的人，必不能救自己；也没有人能靠充足的食物与饥荒立约。谦卑的人不会把希望寄托在兴盛上；他们的心反倒因那些长存之事而欢喜。他们必越发怀有希望，因为那令人畏惧的终局已经来到。他们不会注目于现今世代的享乐，只会知道自己正被带向终点。然而，世界的终局必显明他治理的大能；那时，万物都进入内在之境[a]，回到起初为它们所定之处。那时，人必看出，所显现的这一切并非由人设立，而是真正达到了圆满。


    因为，凡曾经立定、受造，或在冲突中出现而后消逝的，都显明一件事：恶不会永远是恶，善也不会永远是善。所有健康都转为疾病，所有强壮都转为软弱，所有美丽都转为丑陋，青春的一切荣华都转为不堪重负的衰老。你们所见的一切美丽，都转为黑暗和朽坏；你们造成的一切废墟，都转为和平与甘美。所赐下的一切黑暗，都转为真理的光明；一切迷误和软弱，都转为寂静中的卑微；一切报应和烈怒，都转为安息与力量；警醒者的一切声音，都转为尘土所生的寂静。


    对寻求产业的人来说，产业不再使他们转回死亡。那些抢夺工价的人，不再叫死亡过早发生；那作为苦难之工价的死亡，也必被除去。不再有只为享乐而生的欢喜之事。变迁的领域必转为已经完成的争战；罪人在示奥尔——阴间——的声音，也不再被听见。


    所以，当这一切都发生时，你还以为地上的居民不会在同一日为这一切受追讨吗？既然他们自己的显露表明他们活着，他们的罪责本身就揭示他们里面的虚假。我已经记下这虚假的全部分量，因为在我死以前，他们早已从虚假而生。我也说过，他们一直信赖邪恶。[b]'
