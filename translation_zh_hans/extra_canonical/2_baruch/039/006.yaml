  text: And truth will hide itself in it, and all those who are stained with iniquity will flee to it, just as evil beasts flee and creep into the forest.
translation:
  language: zh_hans
  text: 真理必隐藏在其中[a]；凡沾染不义的人都必逃到那里，正如恶兽逃进林中，潜行藏身。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“安稳必在其中建立。”
    reason: 保留动词及名词读法所产生的传统异译。
  - marker: b
    text: 或译：“正如野兽和爬物逃走一样。”
    reason: 保留末句语法切分的另一可能：相关形式可被理解为另一类生物，而非与“逃”并列的动作。
lexical_decisions:
- source_word: ܫܪܪܐ
  choice: 真理
  rationale: 该词通常表示“真理、真实”，并与下句的“不义”形成语义对照。
- source_word: ܬܬܓܠܐ / 相关校勘所据的隐藏义动词形式
  choice: 隐藏
  rationale: 依本节所据校勘与修订证据，表达“隐藏起来／被隐藏”，而不将其释为“建立”；异读另见脚注。
- source_word: ܡܟܬܡܝܢ
  choice: 沾染
  rationale: 保留“被玷污、染上污点”的形象，同时采用自然的现代汉语。
- source_word: ܥܘܠܐ
  choice: 不义
  rationale: 此处指道德上的邪恶或不义；“不义”能保持其伦理和神学分量。
- source_word: ܚܝܘ̈ܬܐ ܒܝ̈ܫܬܐ（据校勘理解）
  choice: 恶兽
  rationale: 既可指凶恶、邪恶的兽类，也与上下文的“不义”相呼应，不具体化为某一种动物。
- source_word: ܥܪܩܝܢ … ܘܪ̈ܚܫܢ（据校勘理解）
  choice: 逃进……潜行藏身
  rationale: 将两个并列动作分别译出，避免把后一个分词误解为名词“爬虫”；“藏身”使汉语中的趋向和目的自然明确。
theological_decisions:
- issue: 真理在该国度中是“隐藏”还是“建立”
  choice: 正文采用“真理必隐藏在其中”
  alternative: “安稳（或真理）必在其中建立”
  rationale: 依据所附最新源文审校，动词应理解为“隐藏起来／被隐藏”；但传本或读法存在足以影响整句意义的差异，因此不在正文中消除张力，而以脚注保留另一译法。
- issue: 逃入国度者的道德描述
  choice: “凡沾染不义的人”
  alternative: “所有被邪恶玷污的人”
  rationale: 不额外判断这些人的最终悔改、庇护或审判状态，只保留源文对其现状及行动的描述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“真理”“不义”保留经卷语体的伦理分量；“潜行藏身”自然表达恶兽逃入树林后的动作。所有异读均以脚注标示，不在正文中混合不同读法。
