review_pass:
  verdict: revise
  source_fidelity: 所给叙利亚文此处读作“ܘܬܬܩܝܡ ܒܗ̇ ܫܪܪܐ”，其中ܫܪܪܐ为“真理／真实”，ܬܬܩܝܡ为“将被立定、坚立”，并非“隐藏”。因此草稿正文的“真理必隐藏在其中”及其脚注a均与所附源文不合。末句源文的比喻是兽类逃奔并在树林（或密林）中藏匿；不宜据英文审校轨迹将其固定译作“恶兽……潜行”。
  naturalness: “凡沾染不义的人都必逃到那里”自然且保持庄重语体。“正如野兽逃奔并藏匿在树林中”以现代汉语清楚表达源文的两个动作，且不增添“恶”或“潜行藏身”的解释性成分。
  terminology: “真理”“不义”均合适。“坚立”对应被动、确立性的动词，保留经卷语体；“野兽”不将源文所指兽类道德化为“恶兽”。
  issues:
  - severity: high
    issue: 将“真理将被坚立”译为“真理必隐藏在其中”。
    rationale: 所附叙利亚文明确有ܬܬܩܝܡ（将被立定／坚立）与ܫܪܪܐ（真理）。英文审校轨迹所称“隐藏”与当前提供的源文不一致；依要求应以原文为先。
  - severity: medium
    issue: 脚注a保留“安稳必在其中建立”作为“传统异译”。
    rationale: 该脚注没有反映当前源文可支持的关键异读，且其内容不能补救正文把动词译为“隐藏”的问题；应删除。
  - severity: medium
    issue: 末句译作“恶兽……潜行藏身”，并以脚注b将其改作另一类生物。
    rationale: 所附源文的比喻更适合译为野兽逃奔、藏匿于树林；“恶兽”和“潜行”会增加源文未明确给出的道德及动作色彩。
  revised_text: 真理必在其中坚立；凡沾染不义的人都必逃到那里，正如野兽逃奔并藏匿在树林中。
  revised_footnotes: []
  revision_rationale: 依所附叙利亚文重译关键谓语：以“坚立”对应ܬܬܩܝܡ，而以“真理”对应ܫܪܪܐ。保留“不义”与“沾染”的伦理和形象语言，并将末句按兽类逃奔、藏匿于树林的比喻直译。删除无可靠源文根据、且会误导正文读法的两个脚注。
