review_pass:
  verdict: revise
  source_fidelity: 所给Ceriani叙利亚文本读作“ܘܬܬܩܝܡ ܒܗ̇ ܫܪܪܐ”，即“真理将在其中被建立／确立”。草稿正文“真理必隐藏在其中”遵循英语审校轨迹中的另一读法，却与本任务提供的主源页不符。下句“被不义玷污的人”逃往该处，以及恶兽“逃遁并潜行”的比喻，草稿基本准确。
  naturalness: “沾染不义”及“恶兽”庄重自然；但“逃进林中，潜行藏身”把“藏身”这一目的性解释加入正文，略超过原文的两个并列动作。改为“逃遁，潜入树林”更简洁，也更贴近原文。
  terminology: “真理”（ܫܪܪܐ）、“不义”（ܥܘܠܐ）和“被玷污／沾染”的伦理语汇均合适。应将“建立／确立”置于正文；“隐藏”可作为与英语审校轨迹相应的异译保留于脚注，不应反置。
  issues:
  - severity: high
    issue: 正文将“真理”译为“隐藏在其中”。
    rationale: 所提供的主源明确有ܬܬܩܝܡ（被建立、确立），而非“隐藏”。英语审校轨迹所反映的隐藏读法与该主源存在冲突；依源文优先原则，主文应按所给叙利亚文本译出，并以脚注保留争议读法。
  - severity: low
    issue: “潜行藏身”加入“藏身”的目的性含义。
    rationale: 原文并列表达恶兽逃遁和潜行；“潜入树林”已足以自然表达动作与场景，无须增添“藏身”。
  - severity: low
    issue: 脚注b保留“野兽和爬物”为另一语法切分。
    rationale: 所给审校资料已特别说明相关形式应作与“逃”并列的“潜行”动作。该脚注会不必要地使已被排除的分析显得同等可采。
  revised_text: 真理必在其中建立[a]；凡沾染不义的人都必逃到那里，正如恶兽逃遁，潜入树林。
  revised_footnotes:
  - marker: a
    text: 或译：“真理必隐藏在其中。”
    reason: 所提供的英语审校轨迹依据另一校勘读法将动词理解为“隐藏”。但本任务所给Ceriani主源作“将在其中建立／确立”，故正文依主源，脚注保留该争议译法。
  revision_rationale: 修订以所提供的叙利亚主源为首要依据，将“真理必在其中建立”恢复为正文；同时不抹除英语审校轨迹所提示的异读，改在脚注中明确保留。“逃遁，潜入树林”保留恶兽的两个并列动作，避免增添“藏身”的解释，也不再保留把“潜行”分析为另一类动物的脚注。
