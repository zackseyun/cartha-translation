  naturalness: 原文整体庄重通顺；将末句改为“它将经历各个时期，并比黎巴嫩的香柏树更加坚立”，既自然，也较准确地保留异象语言。
  terminology: “王国”比“国”更明确对应ܡܠܟܘܬܐ，并与相继而起的政治权势语境相称。“黎巴嫩的香柏树”恰当。
  issues:
