base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039/005.yaml
  text: And after these a fourth kingdom will arise, whose power will be harsher and worse than those that were before it. It will rule for many times like the forests of the plain, and it will hold the times in its grasp and lift itself up more than the cedars of Lebanon.
translation:
  language: zh_hans
  text: 此后，第四个王国将要兴起；它的权势会比先前的王国更残酷、更邪恶。它将像平原上的树林那样统治许多时期；它将经历各个时期，并比黎巴嫩的香柏树更加坚立。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: 国
  rationale: 此处指相继兴起并施行统治的王国；用“国”符合现代汉语经文语体，也保留政治实体与统治权的双重意味。
- source_word: ܙܒ̈ܢܐ ܣܓܝ̈ܐܐ
  choice: 许多时期
  rationale: ܙܒܢܐ 可指时间、时期或时机；“许多时期”避免将其过度具体化为固定年数。
- source_word: ܐܪ̈ܙܐ ܕܠܒܢܢ
  choice: 黎巴嫩的香柏树
  rationale: 保留古代近东常见的高大、尊荣与强盛意象。
- source_word: ܬܬܩܢ ܝܬܝܪ
  choice: 高抬自己，超过
  rationale: 依上下文表达该国自我抬举、凌驾于其他权势之上的形象，不将意象平化为单纯的“强大”。
theological_decisions:
- issue: 第四个国的历史身份
  choice: 不在正文中指认具体帝国
  alternative: 直接认定为罗马或另一历史帝国
  rationale: 本节异象只称其为“第四个国”；翻译应保留文本本身的开放性，不引入特定解释传统。
- issue: “时势”的范围
  choice: 译作“掌控时势”并加注说明歧义
  alternative: 译作“控制年代”或“把握机会”
  rationale: 原词可涵盖时期、时机或所定之时；正文需自然表达其支配性的语境，同时不把含义限定得过窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“兴起”“诸国”“香柏树”等词保持异象文学的庄严感；句法适当分段，使普通读者易于理解，同时保留原文的比较、统治和自我高抬意象。
