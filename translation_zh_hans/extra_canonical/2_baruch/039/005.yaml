revisions:
- from: 此后，第四个国将要兴起；它的权势会比先前诸国更残酷、更邪恶。它将统治许多时期，如平原上的树林一般；它要掌控时势[a]，并高抬自己，超过黎巴嫩的香柏树。
  to: 此后，第四个王国将要兴起；它的权势会比先前的王国更残酷、更邪恶。它将像平原上的树林那样统治许多时期；它将经历各个时期，并比黎巴嫩的香柏树更加坚立。
  rationale: 修订以叙利亚文动词的通常意义为准：ܬܚܙܐ译为“经历”，避免无根据地说该国“掌控”时间或时机；ܬܬܩܢ译为“更加坚立”，保留与香柏树比较的强盛、稳固意象，而不将其解释为自我高抬。并将“国”改为“王国”，使政治实体的含义更明确。
