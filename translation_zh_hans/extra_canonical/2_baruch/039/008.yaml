base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039/008.yaml
  text: 'And when it is revealed, it will uproot the multitude of its host. And as for the tall cedar that you saw left from that forest, and the words that the vine spoke with it which you heard—this is the meaning:'
translation:
  language: zh_hans
  text: 它一显现，就必将它所属的众多随从连根拔除。至于你所看见的那棵从那片树林中留下来的高大雪松，以及葡萄树对它所说、你所听见的那些话——其含义如下：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可将“你所听见的那些话——其含义如下”断作：“你所听见的那些话——”，以下文开始说明其含义。
    reason: 保留英文审计轨迹所反映的断句可能，同时明确原文仍有引入后续解释的公式。
lexical_decisions:
- source_word: ܬܥܩܘܪ
  choice: 连根拔除
  rationale: 该动词本义为“拔根、根除”，保留异象中树木意象与彻底毁灭的力度。
- source_word: ܗܝܘܬܐ ܕܡܢܗ̇
  choice: 那国的众军
  rationale: 此处所指为前述国度所属的群体或军势；结合上下文译作“众军”，同时用“那国的”明确阴性代词的回指。
- source_word: ܐܪܙܐ ܕܪܡܐ
  choice: 高大雪松
  rationale: ܐܪܙܐ 指雪松，ܕܪܡܐ 表示高耸、高大；译文保留异象的具体树木形象。
- source_word: ܡܠܬܐ
  choice: 含义
  rationale: 在引入异象解释的语境中，该词虽可直译为“话/事情”，这里自然地表达为“含义”，并保留明确的解释过渡。
theological_decisions:
- issue: 显现者的指代
  choice: 以“它”承接上文，不在本节补明身份
  alternative: 译为“我的弥赛亚一显现”
  rationale: 上文虽提到“我的弥赛亚”，本节代词本身仍依赖前文；不重复补入名词，可避免把解释性信息写进本节正文。
- issue: 被连根拔除者的性质
  choice: 译作“那国的众军”
  alternative: “从它而出的众多生灵/群众”
  rationale: 词组存在群体、军势等语义空间；国度冲突的上下文支持“众军”，但不进一步赋予特定末世论身份。
translation_notes:
  register: 采用庄重而通顺的现代汉语；“连根拔除”“高大雪松”“葡萄树”等词保留异象的连贯意象。用破折号和“其含义如下”清楚呈现从异象描述转入解释的结构。
