  text: And this kingdom that once destroyed Zion will be destroyed, and it will be subjected to the one that comes after it.
translation:
  language: zh_hans
  text: 这个曾毁灭锡安的国度也必被毁灭，并要臣服于后来者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: 国度
  rationale: 指异象中相继兴起的统治势力；“国度”既保留政治统治的含义，也符合本段启示文学的语境。
- source_word: ܬܚܒܠ
  choice: 必被毁灭
  rationale: 该动词在此表示遭毁坏、覆灭；用“必”自然表达未完成式在预言语境中的将来意义。
- source_word: ܕܡܟܝ ܚܒܠܬ
  choice: 曾毁灭
  rationale: 指该国度先前对锡安所施行的毁坏；“曾”简明呈现时间上的先后关系。
- source_word: ܬܫܬܥܒܕ
  choice: 要臣服于
  rationale: 表达被置于另一权势之下、受其辖制，较“被奴役”更适合国度之间的从属关系。
- source_word: ܠܗ̇ܘ ܕܐܬܐ ܒܬܪܗ
  choice: 后来者
  rationale: 原文直指“在它之后来的那一位/那一个”；“后来者”保留其所指对象未明的特点，不擅自补成特定人物或国度。
theological_decisions:
- issue: “后来者”的身份
  choice: 保留为未明确指认的“后来者”
  alternative: 译作“后来兴起的国度”或特定弥赛亚人物
  rationale: 本句自身没有明确说明其身份；为保留原文的启示文学张力，不依据后文或特定解释传统提前确定所指。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。“这个……的国度”对应原文的指示与关系结构；全句保持预言性陈述的简洁力度。
