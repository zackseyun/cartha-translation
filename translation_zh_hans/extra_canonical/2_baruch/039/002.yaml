  text: 'As for the great forest that you saw, with the lofty and rugged mountains surrounding it, this is the interpretation:'
translation:
  language: zh_hans
  text: 至于你所看见的那片大森林，四周环绕着高耸险峻的山岭，其含义如下：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“这就是这话”。在这里是引出异象的解释。
    reason: 保留ܡܠܬܐ“话、事情”的字面可能，同时说明正文按语境译为“含义如下”。
lexical_decisions:
- source_word: ܥܒ̈ܐ ܣܓܝ̈ܐܐ
  choice: 那片大森林
  rationale: 按异象语境将词组理解为规模宏大的森林；用“那片”自然回指先前所见的异象。
- source_word: ܪ̈ܒܐ ܘܩܫܝܐ
  choice: 高耸险峻的
  rationale: 分别传达“大／高”和“坚硬／崎岖”的形象意义，修饰环绕森林的山岭。
- source_word: ܡܠܬܐ
  choice: 含义如下
  rationale: 该词本义可指“话、事情”，但在解释异象的引介句中指所见景象的意义；“含义如下”比直译“这是话语”更符合现代汉语，同时保留其作为下文引语开端的功能。
theological_decisions:
- issue: 本节末语是否直接认定某一国度
  choice: 不在正文中补入“这是一个国度”或“这是将在那些日子兴起的国度”
  alternative: 将本节末句译为“这就是那个国度”
  rationale: 按本节的异象解释引介功能及经审校的节界，国度的具体说明属于后文；避免把后续内容前移，也不预先锁定森林的象征对象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于……其含义如下”清楚承接前文异象，并自然引出后续解释；“山岭”比单用“山”更能呈现环绕森林的群山景象。
