  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܪܡ
  choice: 然而
  rationale: 该词表示转折或承接性的限定，译作“然而”既保留语气，也符合庄重叙事文体。
- source_word: ܦܘܫܩܗ
  choice: 解释
  rationale: 该名词指对异象意义的阐释；“解释”是现代汉语中自然、准确的对应。
- source_word: ܚܙܘܐ
  choice: 异象
  rationale: 在启示性语境中指所见的超常景象；“异象”保留其启示文学色彩。
- source_word: ܚܙܝܬ
  choice: 你所看见的
  rationale: 保留第二人称和完成性关系，使异象明确指向巴录先前所见。
theological_decisions:
- issue: 异象解释的启示权威
  choice: 直译为“这就是你所看见的异象的解释”
  alternative: 这就是你所见异象的含义
  rationale: “解释”更贴近ܦܘܫܩܗ，不把后续象征内容简化为单一“含义”，也不额外引入解释者身份或教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他回答我说”保留闪语常见引语公式；句末用冒号，因为原文随即进入异象的具体解释。
