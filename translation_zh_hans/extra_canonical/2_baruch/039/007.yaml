base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039/007.yaml
  text: And it will happen that, when the time of its completion draws near for it to fall, then the reign of my Messiah will be revealed, which is like the fountain and like the vine.
translation:
  language: zh_hans
  text: 当它临近终局、将要覆亡的时候，我弥赛亚的开端就会显现；它如同泉源，又如同葡萄树。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开端”所译的原词也可含有开始掌权之意。
    reason: ܪܝܫܝܬܐ的基本义为“开端、开始”，在王国更替的上下文中可涉及弥赛亚权柄开始显现；脚注保留这一语义空间。
lexical_decisions:
- source_word: ܫܘܠܡܗ̇
  choice: 它终结的时刻
  rationale: 该词表示“终结、完成”；阴性代词承接前文的王国。结合随后“覆亡”的语境，译为“终结”比“完成”更自然，同时保留末期已近之意。
- source_word: ܕܬܦܠ
  choice: 走向覆亡
  rationale: 该动词直指“倒下、倾覆”，不可省略；这里描述前述王国的覆灭。
- source_word: ܪܝܫܝܬܗ ܕܡܫܝܚܝ
  choice: 我所立弥赛亚的统治
  rationale: ܪܝܫܝܬܐ 可涉及首位、权柄或统治的开端；在王国更替的上下文中译作“统治”最为通顺。“我所立”自然表达属格“我的弥赛亚”，不暗加特定宗派含义。
- source_word: ܡܒܘܥܐ
  choice: 泉源
  rationale: 保留异象中涌流水源的具象比喻。
- source_word: ܓܦܢ
  choice: 葡萄树
  rationale: 按常见词义直译，并保留异象意象。
theological_decisions:
- issue: “我弥赛亚的ܪܝܫܝܬܐ”是指其开端、首权还是统治
  choice: 正文译为“我所立弥赛亚的统治”
  alternative: “我所立弥赛亚的统治开端”或“我弥赛亚的首权”
  rationale: 此处重点是前一王国覆亡后弥赛亚权柄的显现；“统治”符合语境且现代中文清楚，但以脚注保留原词兼含“开端”的可能。
- issue: 泉源和葡萄树所比拟的对象
  choice: 用“这统治”明确承接前句
  alternative: 不补主语，仅译“它如同泉源和葡萄树”
  rationale: 原文语法承接弥赛亚的ܪܝܫܝܬܐ；中文补出“这统治”可避免误以为直接描述弥赛亚本人，同时不改变比喻关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“到……时……就……”重组较复杂的时间从句；“走向覆亡”明确保留源文中“倒下”的动词。
