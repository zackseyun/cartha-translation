    rationale: 此词首先可指“开端/开始”；在该处也可能暗含开始掌权的意思。译为“统治”并非完全不可能，但会遮蔽“我弥赛亚的开端将显现”这一源文表述，应以“开端”保留其开放性。
  - severity: low
