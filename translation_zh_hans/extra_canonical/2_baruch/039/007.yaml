  terminology: “弥赛亚”“泉源”“葡萄树”均合宜。“我弥赛亚”应直译源文属格，不应扩写为“我所立弥赛亚”。将ܪܝܫܝܬܐ译为“开端”，并以脚注说明可涉及其开始掌权，较能保留语义歧义。
