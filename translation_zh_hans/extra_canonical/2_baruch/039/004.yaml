  text: And that one too, after a time, will be destroyed, and another will arise, a third; and it too will rule in its time and will be destroyed.
translation:
  language: zh_hans
  text: 那国过了一段时期也必被毁灭；另一个，就是第三个，必兴起。它也必在自己的时候掌权，随后被毁灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܙܒܢܐ
  choice: 过了一段时期
  rationale: 保留时间间隔的概括性，不把未明确的时长具体化。
- source_word: ܬܩܘܡ
  choice: 必兴起
  rationale: 在国度更替的语境中，译作“兴起”比字面的“站立”更自然，同时保留建立并登上历史舞台之意。
- source_word: ܬܫܠܛ
  choice: 必……掌权
  rationale: 表达统治、行使权柄之意，适合这里所说的国度。
- source_word: ܒܙܒܢܗ̇
  choice: 在自己的时期
  rationale: 保留原文所属代词和限定意味，表示该国度获准统治的特定时期。
- source_word: ܬܬܚܒܠ
  choice: 被毁灭
  rationale: 采用被动表达，保留原文只陈述其覆亡、未明确毁灭者的特点。
theological_decisions:
- issue: “第三个”与“另一个”的关系
  choice: 译为同位说明：“另一个，就是第三个”
  alternative: 译为“第三个国度将兴起”
  rationale: 同位表达既清楚呈现序列，也不额外补入原文在本句中可能省略的“国度”。
- issue: 国度兴亡的施动者
  choice: 使用“必被毁灭”，不指明施动者
  alternative: 补译为“上帝必毁灭它”或“另一个国度必毁灭它”
  rationale: 原句没有在此明确指出毁灭者，不应以神学推断补足。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；用“兴起、掌权、毁灭”呈现异象解释中诸国度依次更替的节奏，并保留时间长度及毁灭施动者未明的状态。
