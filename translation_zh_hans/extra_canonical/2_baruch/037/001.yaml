  yaml_path: translation/extra_canonical/2_baruch/037/001.yaml
  text: And after these things I saw that the cedar was burning, and the forest that was around it, and the vine was growing, and the plain around it was full of unfading flowers. And I awoke and arose.
translation:
  language: zh_hans
  text: 在这些事以后，我看见香柏树燃烧起来，连同它周围的树林；葡萄树正在生长，它周围的平原开满了永不凋谢的花。于是我醒来，站起身。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܙܐ
  choice: 香柏树
  rationale: 保留异象中特定而具有王者意味的树种，不笼统译作“树”。
- source_word: ܥܒܐ
  choice: 树林
  rationale: 此处指环绕香柏树的成片林木；“树林”在现代汉语中自然，也保留异象的整体景象。
- source_word: 葡萄树所对应的叙利亚语意象
  choice: 葡萄树
  rationale: 保留异象本身的形象，不在本节提前把它解释为弥赛亚。
- source_word: “不凋谢”的花卉表述
  choice: 永不凋谢的花
  rationale: 保留花朵长存、不衰残的异象色彩；“永不凋谢”比抽象的“常青”更符合花的意象。
theological_decisions:
- issue: 是否在本节直接把葡萄树解释为弥赛亚
  choice: 正文仍称“葡萄树”
  alternative: 直接译为“弥赛亚”，或用特殊称谓明示其身份
  rationale: 本节是在叙述异象，解释留待后文；不提前消解象征，才能保留叙事次序及其神学张力。
- issue: 香柏树与周围树林燃烧的关系
  choice: 译作“香柏树燃烧起来，连同它周围的树林”
  alternative: 只说香柏树燃烧，或把树林处理成单纯背景
  rationale: 这样既表达两者一同燃烧，也不额外断定火势的起因或先后。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。句式保留异象叙述的并列推进，以分号区分毁灭与生长、繁花之间的鲜明对照；末句简洁直译“醒来，站起身”。未采用旧稿中属于前一章葡萄树向香柏树宣告审判的长段内容。
