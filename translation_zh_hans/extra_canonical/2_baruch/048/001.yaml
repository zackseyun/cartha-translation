  text: 'And it happened after the seventh day, that I prayed before the Mighty One[a] and said:'
translation:
  language: zh_hans
  text: 第七日过后，我便向大能者[a]祷告说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能者”是《巴录二书》中常见的上帝称号，强调上帝至高的能力。
    reason: lexical_choice
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 该词在《巴录二书》中用作上帝的称号，突出其能力与主权；“大能者”既保留称号性质，也符合现代中文宗教语体。
- source_word: ܘܗܘܐ
  choice: 便
  rationale: 这是叙事承接语。中文以“便”自然表达事情随后发生，避免机械照译为“事情发生了”，同时保留原文的时间推进。
- source_word: ܡܢ ܒܬܪ ܝܘܡܐ ܫܒܝܥܝܐ
  choice: 第七日过后
  rationale: 按原文直译时间短语，保留“第七日”而不擅自解释为七日期间结束或某一特定礼仪日期。
- source_word: ܨ̇ܠܝܬ ܩܕܡ
  choice: 向……祷告
  rationale: ܩܕܡ 字面有“在……面前”之意；现代汉语用“向……祷告”更自然，并准确表达祷告的对象。
theological_decisions:
- issue: 上帝称号 ܚܝܠܬܢܐ
  choice: 大能者
  alternative: 全能者；刚强者
  rationale: “大能者”直接反映能力强盛的词义，又不把该称号收窄为可能带有更强系统神学意味的“全能者”。以专名式称号处理，但简体中文无需借助大小写标示。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第七日过后”紧贴叙利亚文的时间表达；以“便”承接叙事，避免古雅的“事情就这样发生了”。严格止于第48章第1节。
