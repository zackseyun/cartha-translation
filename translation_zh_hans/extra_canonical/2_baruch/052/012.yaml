  naturalness: 整体庄重自然。“奇事必在他们的时候向他们显现”比“到了他们的时候，奇事必向他们显现”更直接对应原文语序和句法关系；后半句采用“对他们不可见／对他们隐藏”可保持平行且自然。
  terminology: “奇事”适合对应 ܬܡܝ̈ܗܬܐ，不擅自窄化为“神迹”；“世界”对应 ܥܠܡܐ，“时代”对应 ܙܒܢܐ，均保留原文未明说的末世指涉。
