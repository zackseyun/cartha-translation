  rationale: 调整首句以更准确呈现“在他们的时候”的介词性时间短语，并修订脚注，使替代译文不遗漏该时间成分。后半句仅微调为平行的“对他们不可见／对他们隐藏”，不改变原有的指示性或神学含义。
