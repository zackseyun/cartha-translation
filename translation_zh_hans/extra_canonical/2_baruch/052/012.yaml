base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/012.yaml
  text: Wonders will appear to them in their time. For they will see that world which is now invisible to them, and that time which is now hidden from them.
translation:
  language: zh_hans
  text: 奇事必在他们的时候向他们显现[a]；因为他们将看见如今对他们不可见的那个世界，也将看见如今对他们隐藏的那个时代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们的时候，奇事必显现。”
    reason: 原短语的句法衔接及传译方式存在差异；此译法保留“在他们的时候”，但不明确以“向他们”表达受事视角。
lexical_decisions:
- source_word: ܬܡܝ̈ܗܬܐ
  choice: 奇事
  rationale: 该词指令人惊奇、非同寻常之事；“奇事”既保留其超常意味，也不擅自具体化为某类神迹。
- source_word: ܢܬܚܙܝܢ ܠܗܘܢ
  choice: 必向他们显现
  rationale: 保留叙利亚语被动/中动态“被看见、显现”的表达，并以“向他们”自然呈现受事视角。
- source_word: ܥܠܡܐ
  choice: 世界
  rationale: 此处与当前不可见的现实领域相对，“世界”较“世代”更符合语境。
- source_word: ܙܒܢܐ
  choice: 时代
  rationale: 此处指将来显露的时期；译作“时代”保留其时间性，也避免缩窄为某一日或时刻。
theological_decisions:
- issue: 不可见的世界与隐藏的时代是否具体指天堂、来世或末世
  choice: 不作具体指认，直译为“那个世界”和“那个时代”
  alternative: 明确译为“来世”和“末世”
  rationale: 原文保持指示性和末世张力，却未在本句直接命名这些概念；译文不应加入宗派性或解释性的限定。
- issue: 奇事显现的时间归属
  choice: 正文译为“到了他们的时候，奇事必向他们显现”，并以脚注保留较简略的句法理解
  alternative: 只译“奇事必显现”
  rationale: ܒܙܒܢܗܝܢ通常可理解为“在他们的时候”；正文保留这一成分，同时承认传译传统中的句法差异。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如今还看不见”与“如今仍向他们隐藏”形成对应，保留原文关于当前不可见、将来得见的张力；不额外解释“世界”或“时代”的具体神学所指。
