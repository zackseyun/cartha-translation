base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/018.yaml
  text: For they chose for themselves this present time, which cannot pass apart from anguish, and they chose for themselves that time whose outcomes are full of groanings and evils; and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they might not come to the honor of which I told you before.
translation:
  language: zh_hans
  text: 因为他们为自己选择了现今这段时日，而这段时日离不开苦难；他们又为自己选择了那结局充满呻吟和祸患的时日。他们弃绝了那不会使进入其中的人衰老的世界[a]，也弃绝了荣耀的时日，以致不能得着我先前告诉你的那份尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那对进入其中的人而言不会衰老的世界。”
    reason: 保留将相关动词理解为非使役、以世界本身为“不衰老”主体的传统译法；正文则依及物使役性形态译出。
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: 世界
  rationale: 该词在此指与现今苦难世界相对、供人进入的未来世界；译作“世界”既自然，也保留其时代与领域交叠的语义。
- source_word: ܙܒܢܐ
  choice: 时日／一段时日
  rationale: 上下文将现今与未来的时段并置；按汉语语境译为“时日”或“一段时日”，避免机械重复“时间”。
- source_word: ܥܩܬܐ / ܐܘܠܨܢܐ
  choice: 苦难
  rationale: 表达压迫、困厄或患难；“苦难”适合本节庄重的末世论语境，又不把含义窄化为某一种痛楚。
- source_word: ܒܝܫܬܐ
  choice: 祸患
  rationale: 此处与“呻吟”并列，指恶事及其苦果；“祸患”比抽象的“邪恶”更符合结局性语境。
- source_word: 使……衰老（Pael 使役性形式，据校订所指）
  choice: 不会使进入其中的人衰老
  rationale: 保留动词的及物、使役意义，表明该世界不会令其居民老去，不改写为单纯“自身不衰老”。
- source_word: ܐܝܩܪܐ
  choice: 尊荣
  rationale: 指将要领受的荣耀性地位或荣誉；译作“尊荣”可与前文“荣耀的时日”区分，同时保留二者关联。
theological_decisions:
- issue: 未来世界与衰老的关系
  choice: “不会使进入其中的人衰老”
  alternative: “对进入其中的人来说不会衰老”或“进入其中的人不会衰老”
  rationale: 采用源语使役性读法，明确未来世界不使其居民衰老；脚注保留传统或较宽松的非使役理解，不进一步推演不朽身体的性质。
- issue: 人主动选择与最终失落之间的张力
  choice: 重复保留“为自己选择了”与“弃绝了”
  alternative: 概括为“他们因自己的选择而失去”
  rationale: 源文的反复强调人的主动取舍；直陈而不解释其与神圣审判、预定或自由意志的系统关系。
- issue: “以致不能得着”的逻辑关系
  choice: 保留结果性表达
  alternative: 译成目的性较强的“为了不去得着”
  rationale: 汉语中的“以致”既能表达其弃绝所造成的结果，也避免断言他们主观上以失去尊荣为明确目的。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号和重复句式呈现原文的对照与累积结构；正文中的脚注标记[a]与脚注完全对应。
