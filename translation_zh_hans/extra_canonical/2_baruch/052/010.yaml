  yaml_path: translation/extra_canonical/2_baruch/052/010.yaml
  text: while they themselves are reckoned among the heaps of sins, and the evil of their forms wastes away still more. For first they see, and afterward they go away to be tormented.
translation:
  language: zh_hans
  text: 他们自己也被算在罪恶的堆积之中，他们形貌上的丑恶也越发消损。[a] 因为他们先看见，随后便离去受折磨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “形貌”也可译作“形象”或“形态”；“消损”所译的词含有衰败、耗损之意。
    reason: 该短语所指的形态及其消损方式仍有一定歧义；译文避免将其限定为单纯肉体或作教义性解释。
lexical_decisions:
- source_word: ܓܘܡܥܐ ܕܚ̈ܛܗܐ
  choice: 累累罪恶
  rationale: 该短语直指罪恶的堆积或聚集；译作“累累罪恶”既保留集合意象，也符合现代汉语庄重文体。
- source_word: ܒܝܫܬܐ ܕܕܡ̈ܘܬܐ
  choice: 丑恶的形貌
  rationale: ܕܡ̈ܘܬܐ 可指形状、形象或外貌；上下文讨论复活后可见的形态，因此采用不把它收窄为单纯肉体的“形貌”。
- source_word: ܢܫܘܚܘܢ
  choice: 衰残
  rationale: 此处表达消损、衰败之意；“衰残”比“消失”更能保留渐进过程，并与 ܝܬܝܪܐܝܬ（越发）配合。
- source_word: ܢܫܬܢܩܘܢ
  choice: 受刑罚
  rationale: 该词表示遭受折磨或刑罚；“受刑罚”保留审判语境，同时不具体化刑罚方式。
theological_decisions:
- issue: “先看见”的宾语
  choice: 不补出宾语
  alternative: 补作“先看见义人的荣耀”或“先看见所失去的一切”
  rationale: 叙利亚文此句没有明说所见对象；为保存原文的含蓄与上下文张力，不替读者确定具体内容。
- issue: 形貌衰残的性质
  choice: 按可见形态的衰败来表达
  alternative: 解释为灵魂败坏或彻底毁灭
  rationale: 原文涉及“形貌/形象”的恶与渐进消损，却没有明确建立灵魂本体或灭绝教义，因此避免教义化扩展。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“累累罪恶”保存原文堆积意象；末句保持简洁，并保留“看见”宾语未明的原文特征。
