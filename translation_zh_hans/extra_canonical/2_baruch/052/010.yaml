  source_fidelity: 译文总体准确保留了“被算在罪恶的堆积中”“形貌相关的恶渐渐消损”以及“先看见、随后去受折磨”的顺序。不过，“丑恶的形貌”在汉语中较容易理解为“形貌本身丑陋”，而原文及英文审校轨迹的重心是“他们形貌的恶／形貌上的丑恶”在消损。末句的“受刑罚”可行，但原词更直接指受折磨，不必预先定为司法意义的刑罚。
  naturalness: 原文庄重通顺。“累累罪恶”有适切的文学感；将首句略调为“罪恶的堆积之中”可更明确表达被列入“罪恶之堆”的意象。修订后的“形貌上的丑恶”在现代汉语中更清楚，也不牺牲原文的形态歧义。
  terminology: 保留“形貌”，避免缩窄为肉体外貌或加入灵魂本体的解释。将“受刑罚”改为“受折磨”，更贴近叙利亚文所表达的痛苦，且不额外界定惩罚的性质。
