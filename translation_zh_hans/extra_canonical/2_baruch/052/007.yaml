review_pass:
  verdict: revise
  source_fidelity: 所给叙利亚正文在此处读作“醒起／被唤醒”（ܢܬܬܥܝܪ）及“照耀／被照亮”（ܬܬܢܗܪ），而非英语审校轨迹所采用的“在变化中得荣耀／变为”。草稿正文基本依循所给正文，但遗漏了紧接在“他们尊荣的光中”之后的目的性动词 ܕܢܫܒܚܘܢ（“使他们得荣耀／被荣耀”）。末句 ܗ̇ܢܝܢ ܡܠܝܢ ܠܗܘܢ 直指“这些事是应许给他们的”，不宜用“这就是”弱化其复数指涉。
  naturalness: “醒起”在庄重的末世／复活语境中自然可用；“面容必在……光中照耀”比“因……而明亮”更贴近原文的光照意象，也更明确地保留介词短语。“得着、领受”保留两个并列动词，行文简洁。
  terminology: 以“荣光”对应 ܫܘܒ̈ܚܐ，以“尊荣”对应 ܐܝܩܪ，避免在同一句中将两个相关但不同的词一律译作“荣耀”。“那不死的世界”保留原文对世界的表述，不化约为“永生”。
  issues:
  - severity: medium
    issue: 遗漏“使他们得荣耀”
    rationale: 草稿在“面容……光辉而明亮”后直接进入“好让他们得着并承受”，没有译出所给正文中的 ܕܢܫܒܚܘܢ。这改变了句中对复活者荣显的明确陈述。
  - severity: low
    issue: 末句复数指涉被弱化
    rationale: “这就是应许给他们的”可懂，但原文“这些事是应许给他们的”回指前述多项应许，宜在汉语中明示。
  - severity: medium
    issue: 所给叙利亚正文与英语审校轨迹存在实质差异
    rationale: 英语轨迹采用“在变化中得荣耀／变为”的措辞，所给叙利亚页文则支持“醒起／照耀”。正文应首先忠于所给原文，同时以脚注透明保留英语轨迹所代表的另一种译法；此一版本归属差异建议人工复核。
  revised_text: 他们必在荣光中醒起[a]；他们的面容必在他们尊荣的光中照耀，使他们得荣耀，并得着、领受那不死的世界；这些事是应许给他们的。
  revised_footnotes:
  - marker: a
    text: 另有校订本译作：“他们必在变化中得荣耀；他们面容的形态也必变为他们荣美的光辉。”
    reason: 所给叙利亚正文读作“醒起……照耀”，英语审校轨迹则记录“在变化中得荣耀……变为”的译法。由于两者差异显著，正文依所给原文，脚注保留另一译法而不混合文本。
  revision_rationale: 修订补出原文在光照意象之后的“得荣耀”，并将末句恢复为复数的“这些事”。鉴于所给叙利亚正文与英语审校轨迹的措辞不一致，采用所给原文所支持的“醒起／照耀”为正文，且以锚定脚注保留另一译法，避免未经证实地将两种文本形态合并。
