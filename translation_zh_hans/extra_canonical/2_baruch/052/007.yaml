review_pass:
  verdict: revise
  source_fidelity: 草稿正文基本跟随所给叙利亚文的“苏醒—面容被光照—领受不死的世界”意象，但漏译了“d-nšabḥun”（得荣耀／被荣耀）的目的性动词。英语审校轨迹所采用的“在变化中得荣耀”与本页所示“在荣耀中苏醒”不一致，且页码与经节归属显有复杂的版本/编排问题；不宜将前者当作本正文的确定校订读法。
  naturalness: “醒起”虽可懂，但现代庄重汉语在复活语境中以“苏醒”更自然。“因自身荣美的光辉而明亮”略显重复且搭配生硬，改为“被他们尊荣的光照亮”更贴近原文的被动表达。“这些事是应许给他们的”比“这就是应许给他们的”更准确保留复数指代。
  terminology: 以“荣耀／尊荣”分别对应相关叙利亚词，可避免“荣光、荣美、光辉”在一句中堆叠。保留“得着并承受”以呈现两个并列领受动词；“不死的世界”保留原文对世界的表述，不化约为“永生”。
  issues:
  - severity: medium
    issue: 漏译“得荣耀”的动词
    rationale: 所给正文在“以他们尊荣的光照亮面容”之后，仍有表示“得荣耀／被荣耀”的动词，随后才是“得着并承受”。草稿将其省略。
  - severity: medium
    issue: 脚注将英语审校轨迹的异文性表述为确定的“校订读法”，且与可见叙利亚正文及英语轨迹均不严丝合缝
    rationale: 可见叙利亚文支持“在荣耀中苏醒”，英语轨迹则说明其所依据的另一文本判断为“在变化中得荣耀、面容被改变”。现有脚注的“另有校订读法”缺乏可核实的版本依据，且不应在没有明确文本见证时断言。
  - severity: low
    issue: “醒起”及“因自身荣美的光辉而明亮”不够自然
    rationale: “苏醒”是更自然的现代书面表达；“被……的光照亮”也更直接对应叙利亚文。
  revised_text: 他们必在荣耀中苏醒；他们的面容必被他们尊荣的光照亮，使他们得荣耀，并得着、承受那不死的世界；这些事是应许给他们的。
  revised_footnotes:
  - marker: a
    text: 英语审校资料采用另一种文本判断，译作：“他们的荣耀必在变化中得荣耀，他们面容的形态也必变为他们荣美的光辉。”所给叙利亚正文则作“在荣耀中苏醒……面容被……光照亮”。
    reason: 保留可见叙利亚正文与英语审校轨迹之间的差异，但不把未经明确见证支持的说法断定为“校订读法”。
  revision_rationale: 修订补出“得荣耀”的动词，调整为自然的现代庄重汉语，并将脚注改为中性地说明所给叙利亚正文与英语审校轨迹的差异。由于源页和英语审校资料之间存在文本/编排不一致，脚注不裁定何者为唯一正确读法。
