  yaml_path: translation/extra_canonical/2_baruch/052/007.yaml
  text: then their splendor will be glorified in transformations, and the form of their faces will be changed into the light of their beauty, so that they may acquire and receive the world that does not die, which is promised to them.
translation:
  language: zh_hans
  text: 他们必在荣光中醒起[a]；他们的面容必因自身荣美的光辉而明亮，好让他们得着并承受那永不死亡的世界；这就是应许给他们的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有校订读法作：“他们必在变化中得荣耀，他们面容的形态也必变为他们荣美的光辉。”
    reason: 所给叙利亚正文读作“在荣光中醒起……面容……明亮”，但英语审校资料记录了基于不同读法或校订的译文；脚注保留这一文本差异而不在正文中混合两者。
lexical_decisions:
- source_word: ܢܬܬܥܝܪ
  choice: 醒起
  rationale: 所给叙利亚文本的动词意为“被唤醒、醒起”，在复活语境中保留其具体意象，不按英语修订层改作“得荣耀”。
- source_word: ܒܫܘܒ̈ܚܐ
  choice: 在荣光中
  rationale: 该词复数可指荣耀、荣光或辉煌；这里以自然汉语表达其状态，同时保留复数在汉语中不必明示。
- source_word: ܬܬܢܗܪ
  choice: 明亮
  rationale: 动词意为被照亮、发光；译作“明亮”与后面的“光辉”搭配自然。
- source_word: ܐܝܩܪܗܘܢ
  choice: 自身荣美
  rationale: ܐܝܩܪ 可指荣耀、尊荣、华美；结合面容发光的语境译为“荣美”，并以“自身”体现三复所有格。
- source_word: ܕܢܣܒܘܢ ܘܢܩܒܠܘܢ
  choice: 得着并承受
  rationale: 保留两个并列动词；“承受”适合表达领受所应许世界的继承意味，但不把两词合并。
- source_word: ܥܠܡܐ ܕܠܐ ܡܐܬ
  choice: 那永不死亡的世界
  rationale: 按原文保留“世界不死”的拟人化表述，不提前解释为“永生”。
- source_word: ܗ̇ܢܝܢ ܡܠܝܢ ܠܗܘܢ
  choice: 这就是应许给他们的
  rationale: 原文末句直陈“这些是应许给他们的”；汉语以总结句表达，并避免将其无提示地压缩成关系从句。
theological_decisions:
- issue: 复活者的连续性与改变
  choice: 保留“醒起”以及面容被光照的描写
  alternative: 译作“在变化中得荣耀，面容变为光辉”
  rationale: 所给叙利亚正文明确支持“醒起”和“明亮”；如此不把复活后的改变过度系统化，也不消除文本的形象张力。
- issue: 永恒赏赐的性质
  choice: “得着并承受那永不死亡的世界”
  alternative: “获得永生”
  rationale: 原文将赏赐表述为一个“不死亡的世界”，应保留其宇宙性语言，而非化约为个人灵魂永生。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“醒起”较“苏醒”更能呼应末世复活语境；分号保留末句作为应许总结的独立力度。
