  yaml_path: translation/extra_canonical/2_baruch/052/004.yaml
  text: And it shall be that, after that appointed day has passed, afterward the forms of those who are condemned will be changed, and also the glory of those who are justified.
translation:
  language: zh_hans
  text: 那指定的日子过去以后，被定罪之人的形体将要改变，得称为义之人的荣耀也将改变。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܨܘܪܬܗܘܢ / ܕܡܘ̈ܬܐ
  choice: 形体
  rationale: 本段讨论复活者可见形态的改变；“形体”既保留外在形貌之意，也避免把它缩窄为单指面容。
- source_word: ܐܝܠܝܢ ܕܗܘܐ ܐܙܕܩܘ
  choice: 得称为义之人
  rationale: 该表达指被判定或宣告为义的人；采用“得称为义”保留其受判定的语义，不径直改写为泛指品德的“义人”。
- source_word: ܬܫܒܘܚܬܗܘܢ
  choice: 荣耀
  rationale: 此词在末世转变的语境中指蒙荣耀的状态或荣美，译作“荣耀”自然且保留神学张力。
- source_word: ܗܘ ܝܘܡܐ
  choice: 那指定的日子
  rationale: 依上下文及校审层所反映的指称，译为“那指定的日子”，表示先前所说、已定下的时日。
theological_decisions:
- issue: 被定罪者与得称为义者各自发生改变的对象
  choice: 分别译作“形体将要改变”和“荣耀也将改变”
  alternative: 将两者统括为“形体和荣耀都将改变”
  rationale: 源文以不同名词对应两类人；分别表达可保留其不对称结构，不擅自说明改变的性质或结果。
- issue: 称义措辞的司法性与道德性
  choice: 得称为义之人
  alternative: 义人
  rationale: 选择较具受判定意味的措辞，但不进一步规定称义机制或宗派性教义。
translation_notes:
  register: 采用庄重而清楚的现代汉语。“那指定的日子过去以后”压缩重复的时间连接词，使句子自然，同时保留先后次序；不补充源文未明说的审判结果或改变方式。
