  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: zh_hans
  text: 因为他们已经从这个患难的世界中获救脱离，卸下了患难的重担。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: 脱离了
  rationale: 该词在此表示获救、被解救或逃脱；“脱离了”自然表达从苦难世界中得到释放，同时避免额外强化特定教义色彩。
- source_word: ܥܠܡܐ ܕܐܘܠܨܢܐ
  choice: 苦难的世界
  rationale: ܥܠܡܐ 指“世界/世代”，ܐܘܠܨܢܐ 指压迫、困苦或患难；结合上下文译作“苦难的世界”简洁而贴切。
- source_word: ܐܢܝܚܘ ܡܢܗܘܢ
  choice: 卸下了
  rationale: 原文描写重担从他们身上除去或被放下；“卸下了”符合汉语对重担的自然搭配。
- source_word: ܛܘܥܢܐ ܕܥܩ̈ܬܐ
  choice: 患难的重担
  rationale: ܛܘܥܢܐ 是所背负的担子，ܥܩ̈ܬܐ 是困境、灾难、患难；译文保留负重意象。
theological_decisions:
- issue: 脱离苦难世界的施事与方式
  choice: 用“脱离了”保留原文被解救或得以逃脱的含义，不明说施事者
  alternative: “蒙拯救脱离了”或“逃离了”
  rationale: 叙利亚文动词形式偏向被解救，但本句没有明说施事者；“脱离了”既不抹去拯救意味，也不加入原文未明言的说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“苦难的世界”与“患难的重担”保留原文的平行意象；全句使用完成体“已经……了”，对应叙利亚文完成式并契合上下文。
