review_pass:
  verdict: revise
  source_fidelity: 译文总体准确呈现了乐园、宝座下的活物、天使暂不得显现及奉命守位的异象。可是，“受权能约束”将叙利亚文此处不甚稳定/不甚明确的限制方式具体化为“权能”，而“直到为他们指定的来临之时”又加入了“指定的”；两处都应收敛为不预断的表达。现存文本中“它下面”的先行词确未明载，正文补作“宝座”可以保留，但必须以注释说明。
  naturalness: 原文汉语庄重、通顺。将“天使的各队”调整为“天使的众队”，并把末句改为“直到他们来临的时候”，更自然，也避免“指定的”造成不必要的解释性负担。
  terminology: “乐园”“宝座”“活物”“天使”均适合本段异象性、宗教性的现代书面语。为避免“众生”在现代汉语中泛指一切生物而弱化此处特定天界活物，采用“活物”更贴近原文和本书的异象语境。
  issues:
  - severity: medium
    issue: “受权能约束”将限制的媒介具体化。
    rationale: 现存叙利亚文此处的措辞和句法有文本困难，英文审校层作“by my word”，而草案作“受权能约束”；二者均超出可稳妥直译的程度。正文宜只说“受拘束”，并以注释交代该处的不确定性。
  - severity: medium
    issue: “直到为他们指定的来临之时”增加“指定的”。
    rationale: 所给叙利亚文末语按字面似为“直到他们的城来到”，英文审校层则作“their appointed coming”。既然字面读法存在明显疑难，正文可采用语境化的“直到他们来临的时候”，但不应额外断定“指定”。
  - severity: low
    issue: “众生”可能过于宽泛。
    rationale: ܚܝ̈ܐ 在此是宝座下特定的天界“活物”；译为“活物”较能保留异象文学的专指性，且不强行界定其类别。
  - severity: low
    issue: 脚注a的“时光对他们不再衰老”不合现代汉语且未清楚说明争点。
    rationale: 应直接说明英文审校层的“grow old”与现存叙利亚文本所见“使……受苦/受压迫”并不一致，而不要给出语义和句法均不自然的替代汉译。
  revised_text: 那时，时间也不再使他们受苦。[a]因为乐园的广阔之地必在他们面前展开，宝座之下活物那庄严的荣美也必向他们显明；[b]天使的众队如今受拘束，不能显现，又奉命各守其位，直到他们来临的时候。[c]
  revised_footnotes:
  - marker: a
    text: 现存叙利亚文的动词通常指“使……受苦、受压迫”或“困扰”。英文审校层作“时间不再对他们衰老（grow old）”，与所见叙利亚文不完全一致。
    reason: 说明源文与英文审校层在该动词上的差异，并保持正文以源文为先。
  - marker: b
    text: 现存叙利亚文只说“在它下面”，并未在此句明说“宝座”；“宝座”可能是前文所指的先行词，或由上下文补出。
    reason: 标明正文补出的先行词及其文本不确定性。
  - marker: c
    text: 现存叙利亚文末语按字面似可读作“直到他们的城来到”，语意不明，可能反映抄本、排印或分词问题。正文按上下文作“直到他们来临的时候”；英文审校层则作“直到他们指定的来临之时”。
    reason: 保留末句的真实文本疑难，且不把英文审校层的解释性限定写成无争议的正文。
  revision_rationale: 修订以现存叙利亚文为首要依据：保留时间不再造成苦楚、乐园展开、宝座下活物显现以及天使暂受限制的基本意思；删除对限制媒介的具体断定，并减少末句的解释性增补。脚注完整交代“宝座”补词、时间动词和末句读法的疑难。
