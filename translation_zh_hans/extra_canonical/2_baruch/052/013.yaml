base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/013.yaml
  text: And that time will no longer grow old for them. For the expanses of Paradise will be spread out before them, and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the companies of the angels, who are now restrained by my word so that they are not seen, and are kept by command to stand in their places until their appointed coming.
translation:
  language: zh_hans
  text: 那时，时间也不再使他们苦恼。[a]因为乐园的广阔之地必在他们面前展开，宝座之下众生那庄严的荣美也必向他们显明；[b]天使的各队如今都受权能约束，不得显现，又奉命各守其位，直到为他们指定的来临之时。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 叙利亚文直译为“时间也不再使他们苦恼”；另有译法作“那时光对他们不再衰老”。
    reason: 说明原文动词与英语咨询层“grow old”之间的差异，保留可能的释读空间。
  - marker: b
    text: 现存叙利亚文在此仅作“它下面”；“宝座”可能出自前文缺损的先行词，或由上下文补出。
    reason: 源页在此附近有断裂，需明确正文补词的依据与不确定性。
  - marker: c
    text: 末句叙利亚文本的词形按字面似可读作“直到他们的城来到”，语意不明；正文依上下文采用“直到为他们指定的来临之时”。
    reason: 保留真实的文本疑难，避免将校订结果呈现为毫无争议。
lexical_decisions:
- source_word: ܢܥܘܩ
  choice: 使……苦恼
  rationale: 该动词表达压迫、困扰或使受苦；直译符合叙利亚文本，比咨询层的“变老”更有原文依据。
- source_word: ܦܠܝ̈ܛܘܗܝ ܕܦܪܕܝܣܐ
  choice: 乐园的广阔之地
  rationale: 保留其开放、宽广空间的意象，同时采用现代汉语自然表达。
- source_word: ܫܘܦܪܐ ܕܪܒܘܬܐ
  choice: 庄严的荣美
  rationale: 兼顾“美丽”和“伟大、威严”两层含义，不将其弱化为单纯外观。
- source_word: ܚܝ̈ܐ
  choice: 众生
  rationale: 原词可指活物或生命；此处用“众生”保留群体性，并避免擅自确定具体天上生物类别。
- source_word: ܚܒܝ̈ܫܐ
  choice: 受……约束
  rationale: 原义为被拘束、受限制；语境指天使暂不显现，并非监禁意义上的定罪。
- source_word: ܒܡܫܠܛܘ
  choice: 受权能约束
  rationale: 现存叙利亚文指权柄、管辖或控制；不采用英语咨询层较具体的“被我的话约束”，以免加入原文未明说的第一人称所有关系。
- source_word: ܒܦܘܩܕܢܐ
  choice: 奉命
  rationale: 简洁表达“按着命令、由于命令”，符合天使各守其位的上下文。
theological_decisions:
- issue: 宝座是否在现存叙利亚文本中明说
  choice: 正文采用“宝座之下”并加注说明
  alternative: 译作“它下面”
  rationale: 当前所给文本只见阴性代词“它”，其先行词似在页面断裂或缺文处；英语校订层据上下文补出“宝座”。正文补足可读性，脚注保留文本状况。
- issue: 约束天使的媒介
  choice: 译作“受权能约束”
  alternative: “被我的话约束”
  rationale: 以现存叙利亚词形为先，避免把神圣话语这一更具体的神学概念无注释地写入正文。
- issue: 末句时间表达的疑难读法
  choice: 依上下文译为“直到为他们指定的来临之时”并加注
  alternative: 按现存词形直译为“直到他们的城来到”
  rationale: 字面读法在语境中难以成立，可能涉及抄本、排印或分词问题；正文采用语境上可理解且与古译咨询层一致的读法，但不掩盖疑难。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“乐园”“宝座”“天使”沿用普通读者熟悉的宗教词汇；句式保持异象文学的肃穆感，但避免古奥虚词。所有补足和疑难均以脚注标明。
