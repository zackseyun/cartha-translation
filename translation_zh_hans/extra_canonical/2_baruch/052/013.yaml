review_pass:
  verdict: revise
  source_fidelity: 现存叙利亚文的“时间不再使他们受困扰/压迫”不支持英语审校记录的“时间不再衰老”。末句字面为“直到他们的城来到”，虽语意疑难，却不宜在正文无标示地改作“为他们指定的来临之时”。此外，天使各队与前面的显现异象应连贯表达为也在他们面前显现。
  naturalness: 原译整体庄重通顺，但“受权能约束”略显抽象生硬；“天使的各队如今都受……又奉命……”也使其与“向他们显明”的异象结构脱节。修订后以“受权柄约束”“也必向他们显现”使句法更自然。
  terminology: 保留“乐园、宝座、活物、天使”等适合异象文学和现代中文宗教语境的术语。“宝座”仍属依据上下文补出的先行词，须保留脚注。
  issues:
  - severity: high
    issue: 末句将“他们的城来到”改译为“为他们指定的来临之时”。
    rationale: 现存文本为ܥܕܡܐ ܕܬܐܬܐ ܡܕܝܢܬܗܘܢ，字面明确含“他们的城”；即使语境困难，也应保留疑难，而非采用英语审校记录的释读取代原文。
  - severity: medium
    issue: 脚注a列出的“那时光对他们不再衰老”不构成自然或准确的汉语替代译法。
    rationale: 原文动词表达困扰、压迫，英语审校记录的“grow old”与所给叙利亚文本不一致；脚注应说明此差异，不应把它表述为原文的可行直译。
  - severity: medium
    issue: 正文没有清楚表达天使各队也属于将被看见的异象内容。
    rationale: 英语审校记录将天使的各队与所显明的天上景象并列；按上下文，将其明确为“也必向他们显现”可避免中文句法将其误读为单纯背景说明。
  - severity: low
    issue: “受权能约束”搭配偏抽象。
    rationale: “受权柄约束”较自然，也更贴近现存文本所表达的权柄或管辖之意，同时不加入“我的话”这一原文未明示的限定。
  revised_text: 那时，时间也不再使他们苦恼。[a]乐园的广阔境域必在他们面前展开；宝座之下活物所具的威荣之美，以及天使的各队，也必向他们显现。[b]这些天使如今受权柄约束，不得显现，又奉命各守其位，直到他们的城来到。[c]
  revised_footnotes:
  - marker: a
    text: 现存叙利亚文直译为“时间不再使他们受困扰（或受压迫）”。英语审校记录作“时间不再衰老”，与所给叙利亚文本的动词不一致。
    reason: 说明原文动词的基本义，并标示与英语审校记录的差异。
  - marker: b
    text: 现存叙利亚文只说“在它下面”；正文的“宝座”是按上下文补出的先行词，现存片段本身未明说。
    reason: 标示正文补足的文本依据及其不确定性。
  - marker: c
    text: 现存叙利亚文按字面为“直到他们的城来到”。这句话在当前语境中的具体所指不明；正文保留其字面表达。
    reason: 保留真实的文本疑难，避免以未经证实的释读替换原文。
  revision_rationale: 修订以现存叙利亚文本为优先：保留“时间不再使他们受困扰”的含义，恢复末句“他们的城来到”的字面读法，并用脚注而非正文改写处理两处疑难。同步调整天使段落的句法，使其清楚地连于末世显现的异象。
