  text: By what, then, did people lose their life, and for what did those who were on the earth exchange their soul?
translation:
  language: zh_hans
  text: 那么，他们凭什么丧失了生命？世上的人又用自己的灵魂换取了什么？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܡܢܐ
  choice: 为什么
  rationale: 该短语可表示“凭什么、因什么、为了什么”。本节是带有哀叹意味的反问，用现代汉语“为什么”能自然保留其宽泛的因由或代价含义。
- source_word: ܐܘܒܕܘ
  choice: 丧失了
  rationale: 该动词表达使之失去或毁掉；“丧失”与“生命”搭配庄重自然，也保留主动造成损失的意味。
- source_word: ܚܝܝ̈ܗܘܢ
  choice: 生命
  rationale: 直译为“他们的生命”；中文语境中泛指“人”之后无需重复所有格，意义仍然明确。
- source_word: ܢܦܫܗܘܢ（据本节后续文本及校勘层）
  choice: 自己的灵魂
  rationale: “灵魂”保留与前句“生命”的词义区别；加“自己的”明确这是世上的人所拿来交换的对象。
theological_decisions:
- issue: “生命”与“灵魂”的关系
  choice: 分别译作“生命”和“灵魂”
  alternative: 两处都译作“生命”或“性命”
  rationale: 不把两个概念强行合并，保留原句在生命与灵魂之间形成的平行和张力。
- issue: 问题所指是原因还是交换代价
  choice: 首句用宽泛的“为什么”，次句明确为“换取了什么”
  alternative: 首句译作“因什么”，次句译作“拿什么交换”
  rationale: 这样既保留首个介词问语的语义开放性，也准确呈现次句以灵魂作为交换代价的结构。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“究竟”传达原句追问和哀叹的力度，但不额外加入神学判断。现存页面摘录在本节末端有截断及重复读文，因此第二问参考叙利亚文篇章连续性与已审校的英文咨询层恢复；正文不以脚注制造不必要的阅读负担。
