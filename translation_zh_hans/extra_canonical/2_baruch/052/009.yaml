translation:
  language: zh_hans
  text: 当他们看见那些如今被他们视为无足轻重的人，正与众天使一同安息、得荣耀时，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܬܢܝܚܝܢ
  choice: 安息
  rationale: 该词表示得到休息、安宁；“安息”在此既自然，也保留末世性语境中的庄重意味。
- source_word: ܡܫܬܒܚܝܢ
  choice: 得荣耀
  rationale: 采用被动表达，准确体现该词“被荣耀、获尊荣”的含义，不擅自说明荣耀的施予者。
- source_word: ܡܬܚܫܒܝܢ
  choice: 被他们视为无足轻重
  rationale: 按上下文表达“被算作不值一顾”；补出“他们”以使汉语指代清楚，同时保留贬抑判断的力度。
- source_word: ܡܠܐܟܐ
  choice: 众天使
  rationale: 在此末世异象语境中指天使；汉语用复数集体表达“众天使”较自然。
theological_decisions:
- issue: 义人与天使的关系
  choice: 与众天使一同安息、得荣耀
  alternative: 像天使一样安息、得荣耀
  rationale: 译文保留共同处境或共同参与的关系，不把它解释为本体上变成天使，也不将关系弱化为单纯比拟。
- issue: “得荣耀”的施予者
  choice: 使用无施事者的被动式
  alternative: 被上帝赐予荣耀
  rationale: 源文未在本句明确点出施予者，因此不把合理的神学推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“无足轻重”自然传达轻蔑性的估价；句末保留逗号，因为本节在篇章中属于引出后续结果的时间从句。
