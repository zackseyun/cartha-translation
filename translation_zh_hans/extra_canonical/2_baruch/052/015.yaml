  text: For the first will receive the last, whom they were expecting, and the last those they had heard had passed away.
translation:
  language: zh_hans
  text: 因为先到的要迎接他们所等候的后来者，后来者也要迎接那些他们听说已经离世的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些他们听说已经离世的人。”
    reason: 说明原文关系从句可作较直译的理解；不将邻近语境中“从这个患难的世界得解脱”的措辞并入本节。
lexical_decisions:
- source_word: ܢܩܒܠܘܢ
  choice: 迎接
  rationale: 此处描写先后复活者彼此相会；“迎接”比笼统的“接受”更符合人际相逢的语境，同时保留动词“接纳、接待”的基本含义。
- source_word: ܩܕܡܝܐ / ܐܚܪ̈ܝܐ
  choice: 先到的／后来者
  rationale: 原词形成“先者／后者”的对照，主要指时间次序；译为“先到的／后来者”可避免误解为地位高低。
- source_word: ܡܣܟܝܢ ܗܘܘ
  choice: 所等候的
  rationale: 准确表达持续期待、等候之意。
- source_word: ܐܬܦܨܝܘ ܡܢ ܗܢܐ ܥܠܡܐ
  choice: 已经离世
  rationale: 源文较完整的意象是“从这个世界得解脱”；本节按死亡与复活相会的语境简洁译作“离世”，详细字面意义置于脚注。
theological_decisions:
- issue: “先者／后者”的身份
  choice: 按死亡或复活相会的时间次序译为“先到的／后来者”
  alternative: 译为带有地位意味的“在先的／在后的”
  rationale: 上下文谈论已离世者在复活时彼此辨认和相迎，并非确立等级；时间性表达较为稳妥，但不进一步限定具体群体。
- issue: 离世的措辞是否暗示灵魂状态
  choice: 使用中性的“离世”
  alternative: 明确译作“得释放”或“去世”
  rationale: “离世”既符合上下文，也不把“从这患难的世界得解脱”扩展成特定的死后状态教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；以“迎接”呈现复活者重逢的场景，以“先到的／后来者”清楚表达原文的时间对照。
