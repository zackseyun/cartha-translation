  text: 那时，他们将再次显现出来，其形貌将比天使的更为卓越。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܡܬܚܙܝܐ ... ܬܘܒ ܗܝܕܝܢ
  choice: 那时，他们将再次显现
  rationale: 保留原文“显现”“再次”“那时”的时间与显现意象；依上下文将所指明确为前述得救之人。
- source_word: ܒܕܡܘܬܐ
  choice: 形貌
  rationale: 该词可指形象、样式或相貌；此处论及复活者显现的状态，“形貌”既自然，也避免将其抽象化为单纯的“卓越”。
- source_word: ܝܬܝܪ ܡܢ ܕܡܠܐܟ̈ܐ
  choice: 比天使更加卓越
  rationale: 直译比较结构“超过天使的”；用“更加卓越”表达其超越性，同时不说明究竟在哪一种本体或等级意义上超过。
theological_decisions:
- issue: 复活之人胜过天使的含义
  choice: 形貌比天使更加卓越
  alternative: 义人的卓越将超过天使
  rationale: 叙利亚文明确含有“形貌／样式”一词，因此保留可见形态的意象；不把经文扩展为义人在本体、权柄或等级上全面高于天使。
- issue: 主语的身份
  choice: 他们
  alternative: 义人
  rationale: 原句以代词承接上下文中的得救者；正文保留代词，避免在本节内加入原文未重复出现的称谓。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；句式简洁，保留原文“再次显现”和“形貌”的末世性视觉意象。
