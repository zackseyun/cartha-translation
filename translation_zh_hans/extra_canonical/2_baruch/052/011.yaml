review_pass:
  verdict: revise
  source_fidelity: 所给叙利亚文本在本句末尾实际读作ܘܚܟܡܬܐ ܡܚܡܣܢܘܬܐ（“智慧〔是〕力量／坚固”），并非“智慧〔是〕坚忍”。此外，该文本在“律法”与“智慧”之间还列出ܣܒܪܐ（盼望）、ܣܘܟܠܐ（悟性／领悟）、ܬܘܟܠܢܐ（信赖／倚靠）及ܣܘܩܒܝܐ（期待／盼望）；草稿遗漏了ܣܘܩܒܝܐ，且把末项误释为“坚忍”。英文审校轨迹的“纯洁为冠冕”与本次提供的Ceriani叙利亚文转录不一致，不能据此覆盖所给原文读法。
  naturalness: 修订保留原文紧凑的名词排比，同时以“是他们的”使现代汉语句法完整。源文本中“律法为律法”属重复或可能有传抄／版面问题；不宜无依据地改作英文咨询文本的“律法为盼望”。
  terminology: ܐܬܦܨܝܘ宜译“得蒙拯救／获救”；ܡܚܡܣܢܘܬܐ宜译“力量”或“坚固”，不宜译“坚忍”。“悟性”“信赖”“期待”分别对应所列叙利亚名词，并避免把英文轨迹中的“纯洁、冠冕”当作此处原文。
  issues:
  - severity: high
    issue: “以智慧为坚忍”误译ܡܚܡܣܢܘܬܐ。
    rationale: 该词的基本义为力量、坚固、强化，并非“坚忍／忍耐”。
  - severity: high
    issue: 正文遗漏ܣܘܩܒܝܐ所表达的“期待／盼望”。
    rationale: 草稿只译出“悟性为倚靠”，未处理紧接的名词ܣܘܩܒܝܐ。
  - severity: medium
    issue: 脚注断言英文咨询文本与所给叙利亚文本构成异文，却没有准确说明所给文本本身的全部词列。
    rationale: 脚注应如实呈现：英文轨迹的“纯洁为冠冕”不见于所提供的叙利亚文，而所给文本的末项是“智慧为力量”；并不应将“力量”误称“坚忍”。
  revised_text: 至于那些因自己的行为得蒙拯救的人，他们有律法为律法，盼望、悟性、信赖和期待为依托，智慧为力量。
  revised_footnotes:
  - marker: a
    text: 所给Ceriani叙利亚文在此列有“律法为律法，盼望、悟性、信赖、期待，智慧为力量”。英文咨询文本作“律法为盼望、悟性为期待、智慧为信心、纯洁为冠冕”，与所给原文转录不一致；本文按所给叙利亚文翻译。
    reason: 交代原语言转录与英文审校轨迹之间的实质差异，并说明正文未以英文读法覆盖所给原文。
  revision_rationale: 必须修正“坚忍”这一词义错误，并补出源文所列的“期待”。鉴于所给叙利亚文与英文审校轨迹在词列及末项上明显不合，正文遵循原语言来源；脚注仅记录差异，不裁定未提供证据支持的另一读法。
