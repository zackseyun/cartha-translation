  yaml_path: translation/extra_canonical/2_baruch/052/011.yaml
  text: But for those who were delivered by their works, and for whom the law was hope, and understanding expectation, and wisdom confidence, and purity a crown,
translation:
  language: zh_hans
  text: 但那些因自己的行为而得蒙拯救的人，就是那些以律法为盼望、以悟性为倚靠、以智慧为坚忍的人，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 英文咨询文本作“以智慧为信心、以纯洁为冠冕”；但所给叙利亚文本此处作“以智慧为坚忍”。
    reason: 交代原语言来源与咨询层之间的实质性异文或转录差异，避免无声地选定一方。
lexical_decisions:
- source_word: ܐܬܦܨܝܘ ܒܥ̈ܒܕܝܗܘܢ
  choice: 因自己的行为而得蒙拯救
  rationale: 按叙利亚文被动动词与介词结构直译，保留“行为”与“得救”之间原有的神学张力，不另作解释。
- source_word: ܢܡܘܣܐ ܣܒܪܐ
  choice: 以律法为盼望
  rationale: ܢܡܘܣܐ意为“律法”，ܣܒܪܐ在此为“盼望”；用“以……为……”自然呈现省略系词的名词结构。
- source_word: ܣܘܟܠܐ ܬܘܟܠܢܐ
  choice: 以悟性为倚靠
  rationale: ܣܘܟܠܐ指悟性、领悟；ܬܘܟܠܢܐ通常指信赖、倚靠。译文保留其抽象名词之间的对应关系。
- source_word: ܚܟܡܬܐ ܡܚܡܣܢܘܬܐ
  choice: 以智慧为坚忍
  rationale: 所给叙利亚文明确呈现“智慧”与“坚忍／忍耐”的并列名词结构；虽较不寻常，仍不以咨询层的另一读法取代原文证据。
theological_decisions:
- issue: “因自己的行为而得蒙拯救”可能引发对救恩机制的教义性解读
  choice: 保留原文措辞，不加限定
  alternative: 解释为“其行为显明他们已得救”或改成其他教义化表述
  rationale: 原文直接把得蒙拯救与他们的行为相连；翻译不应替文本消解这一张力。
- issue: 本节末项在所给叙利亚文与英文咨询层之间不一致
  choice: 正文依所给叙利亚文译作“以智慧为坚忍”
  alternative: 依英文咨询层译作“以纯洁为冠冕”
  rationale: 原语言证据优先；所给文本为ܚܟܡܬܐ ܡܚܡܣܢܘܬܐ，并未出现“纯洁”或“冠冕”的对应词。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话；以重复的“以……为……”保留原文排比。末尾逗号反映本句在章段中尚未完结。
