base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/001.yaml
  text: For the earth will then certainly give back the dead whom it now receives in order to preserve them, changing nothing in their form; but as it received them, so it will restore them, and as I delivered them to it, so it will raise them.
translation:
  language: zh_hans
  text: 1 到那时，大地必定把它如今接纳、为要保存的死者交还，毫不改变他们的形体；[a]但它怎样接纳他们，就怎样归还他们；我怎样把他们交给大地，大地也必怎样使他们复起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它如今按他们原来的样子接纳他们，毫不改变他们的形体；它怎样接纳他们……”
    reason: 保留先前断句和读法所产生的另一种译法；正文采用校勘上更有根据的目的性读法“为要保存他们”。
lexical_decisions:
- source_word: ܡܦܩܢܗ / ܡܦܩܐ / ܡܩܝܡܐ
  choice: 交还出来／使他们复原／使他们复起
  rationale: 这一组动词兼有从大地中带出、按所接纳的状态归还，以及使死人复起的含义。采用不同但相互呼应的汉语表达，以保留归还与复活两方面的力度。
- source_word: ܒܨܘܪܬܗܘܢ
  choice: 他们的形体
  rationale: “形体”既保留可辨认的外在连续性，也不把经文限定为某种具体的生理机制。
- source_word: ܕܬܢܛܪ ܐܢܘܢ（校勘所据读法）
  choice: 接纳并保存
  rationale: 将大地描绘为暂时收纳并保守死者的所在；汉语以并列动词自然表达接纳的目的。
theological_decisions:
- issue: 现今身体与复起之人的连续性
  choice: 保留“丝毫不改变他们的形体”以及接纳、交还、复起的连贯表述
  alternative: 将本节解释为与原有形体无关的纯属灵复活
  rationale: 原文反复强调大地怎样接纳，也怎样交还并使之复起，突出身份与可辨认形体的连续性，但没有进一步界定复活身体的机制。
- issue: 大地在复活中的角色
  choice: 把大地表述为接纳、保存并交还死者的受托者
  alternative: 把大地写成复活的自主施行者
  rationale: “我怎样把他们交给它”表明大地是在神的交付与安排之下保存并交还死者，译文不额外赋予大地主动神能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“复起”比单纯“站起来”更适合末世复活语境，同时避免引入特定宗派术语；分号保留原句中接纳、复原与复起三层递进。
