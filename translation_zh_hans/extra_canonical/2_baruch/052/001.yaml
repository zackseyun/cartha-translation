revisions:
- from: 1 到那时，大地必把它如今接纳并保存的死人交还出来，丝毫不改变他们的形体；[a]它怎样接纳他们，就怎样使他们复原；我怎样把他们交给它，它也必怎样使他们复起。
  to: 1 到那时，大地必定把它如今接纳、为要保存的死者交还，毫不改变他们的形体；[a]但它怎样接纳他们，就怎样归还他们；我怎样把他们交给大地，大地也必怎样使他们复起。
  rationale: 修订明确“保存”是接纳死者的目的，译出“但”的转折，并以“归还他们”取代可能误导为一般恢复状态的“使他们复原”。其余复活、形体连续性及神将死者交付大地的表达均予保留。
