review_pass:
  verdict: revise
  source_fidelity: 正文正确保留了大地现今接纳死者、目的在于保存他们、毫不改变其形体，以及随后按原样归还并使其复起的三层意思。宜将“接纳并保存”明确为目的关系，并补足原文在“归还”前的转折；“交还出来”也略显重复。
  naturalness: “使他们复原”在现代汉语中容易指病愈或恢复原状，未充分表达大地将死者归还的动作。改为“归还他们”更自然且更贴近上下文；“使他们复起”保留庄重的复活语境。
  terminology: “形体”恰当地保留了广义的可辨认形状，避免过度界定。“死者”“复起”符合庄重的经文体。“大地”作为阴性代词所指，在汉语中重复名词可避免“它”指代不清。
  issues:
  - severity: medium
    issue: “接纳并保存”未明确保存是接纳的目的，且未体现归还分句开头的转折。
    rationale: 校勘所据读法含目的从句“为要保存他们”，随后有相当于“但”的转折。将其译明可更准确呈现句法关系。
  - severity: low
    issue: “使他们复原”弱化了大地按所接纳者将其归还的动作。
    rationale: 该处与前面的“交还”同属归还、复原的语义链；译作“归还他们”更直接自然。
  - severity: low
    issue: “交还出来”语义重复。
    rationale: “交还”本身已经包含返还之意，删去“出来”使文句更凝练。
