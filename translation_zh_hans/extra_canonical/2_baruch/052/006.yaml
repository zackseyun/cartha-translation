  text: But the glory of those who were justified in their time, and those who had understanding in their life, and those who planted in their heart the root of wisdom—
translation:
  language: zh_hans
  text: 但那些在自己的时代被判为义的人，那些在生活中有悟性的人，以及那些把智慧之根栽在心里的人——他们的荣耀[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文的句子在这里尚未结束；“他们的荣耀”要到下文才继续说明。
    reason: 帮助读者理解破折号与悬置句法，避免误以为经文残缺，同时不提前补入下一节内容。
lexical_decisions:
- source_word: ܬܫܒܘܚܬܗܘܢ
  choice: 他们的荣耀
  rationale: 直译该词的‘荣耀、荣光’义，并保留本节尚未说完、下文继续陈述其荣耀的句法悬置。
- source_word: ܐܙܕܩܘ
  choice: 被判为义
  rationale: 保留叙利亚语被动形态及其裁定意味，不擅自明说施动者。
- source_word: ܫܘܒܠܐ
  choice: 行事有道
  rationale: 该词可指引导、道路或人生的行程；结合‘在他们一生中’，译为自然汉语‘一生行事有道’，比咨询层的‘有悟性’更贴近现存叙利亚语词形。
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: 智慧之根
  rationale: 保留‘根’的具体意象和‘智慧’的属格关系。
theological_decisions:
- issue: ܐܙܕܩܘ 的义理表达与施动者
  choice: 被判为义
  alternative: 称义了／显为义
  rationale: 原文为被动形式，但没有明确指出由谁判定；采用‘被判为义’既呈现裁定意味，也不补入原文未明说的神学主体。
- issue: 本节与下节之间未完成的句法
  choice: 用破折号和逗号保留悬句
  alternative: 补写‘必显出来’等谓语，使本节成为完整句
  rationale: 原文在列举三类人并提出‘他们的荣耀’后，由后文继续说明；不应在本节内擅自补足结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个‘那些……的人’构成平行列举；末尾保留悬句，以贴合原文跨节延续的结构。
