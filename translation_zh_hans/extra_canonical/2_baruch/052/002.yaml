base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/002.yaml
  text: 'For this is required: that it may be shown to the living that the dead have come to life, and that those who had departed have returned.'
translation:
  language: zh_hans
  text: 因为这是必须的：要向活着的人显明，死人已经活过来，离去的人已经归来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܒܥܐ
  choice: 是必须的
  rationale: 该词表达“被要求、必要”的意思；译为“是必须的”既保留必要性，也符合现代汉语表达。
- source_word: ܠܡܚܘܝܘ
  choice: 显明
  rationale: 源词意为“使人看见、显示”；“显明”兼顾可见的展示和事实的揭示。
- source_word: ܕܚܝܘ ܡ̈ܝܬܐ
  choice: 死人已经活过来
  rationale: 贴近源文“死人活了”的措辞，不直接改译为带有更强术语色彩的“复活”，以保留原句朴素而直接的表述。
- source_word: ܘܐܬܘ ܗܢܘܢ ܕܐܙܠܘ ܗܘܘ
  choice: 离去的人已经归来
  rationale: 源文直义为“那些曾经离去的人来了”；“归来”自然表达其回来之意，并与前半句保持庄重、平行的句式。
theological_decisions:
- issue: “死人活了”是否应术语化为“死人复活”
  choice: 死人已经活过来
  alternative: 死人已经复活
  rationale: 上下文确实涉及死人复生，但叙利亚文在此使用普通的“活”这一动词。采用“活过来”可保留原文措辞，同时不否认复活的语境。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语；以冒号保留源文“这是必须的”之后的解释结构，并使两个并列事实形成清晰节奏。
