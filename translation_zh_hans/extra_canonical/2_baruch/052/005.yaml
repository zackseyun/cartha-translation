  text: For the appearance of those who now act wickedly will become worse than it is now, as they suffer torment.
translation:
  language: zh_hans
  text: 因为那些如今作恶之人的形貌，将变得比现在更糟；他们要承受刑罚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: 形貌
  rationale: 此处指受刑罚者显于外的样貌或形态；“形貌”既保留身体外观之意，也不过度限定为单指面容。
- source_word: ܒܝܫ
  choice: 更加丑陋
  rationale: 该词基本义为“坏、恶、糟”；用于形貌时，按汉语自然表达译作“丑陋”，体现外观变坏。
- source_word: ܬܫܢܝܩܐ
  choice: 刑罚
  rationale: 指痛苦的惩治或折磨；“刑罚”保持审判语境及庄重文体，又不额外规定刑罚的具体形式。
theological_decisions:
- issue: 形貌变坏与承受刑罚之间的关系
  choice: 以“那时”连接，保留同时发生的语义
  alternative: 译作“因为他们要承受刑罚”，明确为因果关系
  rationale: 叙利亚文连接语更自然地表示“当……时／在……之际”；不把形貌改变与刑罚之间本可兼具时间或因果意味的关系强行限定为单一因果。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“作恶”比“行为邪恶”更简洁自然；“承受刑罚”保留末世审判段落的严肃语气。
