  yaml_path: translation/extra_canonical/2_baruch/052/003.yaml
  text: And it shall be, when they recognize one another—those who now know one another—that then the appearance of those who are now condemned will become more dreadful.
translation:
  language: zh_hans
  text: 那时，如今彼此相识的人将彼此认出；随后，如今被定罪之人的容貌将变得更加可怕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܝܕܥܘ ܚܕ ܠܚܕ
  choice: 彼此认出
  rationale: 保留相互识认的含义，并与下文“如今彼此相识”自然衔接。
- source_word: ܚܙܘܗ
  choice: 容貌
  rationale: 此处指人显现出来的外观或形貌；“容貌”符合复活后形体显现的语境，又不额外解释其性质。
- source_word: ܐܡܝܢ
  choice: 更加可怕
  rationale: 按本节语境表达受定罪者外观加剧的可怖性，采用现代汉语中自然而庄重的说法。
theological_decisions:
- issue: 复活后彼此识认
  choice: 直译为“如今彼此相识的人将彼此认出”
  alternative: 解释为所有复活者都必然保有完整的人际记忆
  rationale: 原文只陈述现在互相认识者届时会彼此识认，不将其扩展为更系统的复活论主张。
- issue: “被定罪”所指的时间与状态
  choice: 保留“如今被定罪”
  alternative: 改作“届时受审判”或“如今作恶”
  rationale: 维持原文及校审英文所呈现的时间张力，不擅自改写定罪发生的阶段或依据。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；以分号划分彼此识认与被定罪者容貌变化这两个紧密相连的结果，并用“随后”避免连续重复“那时”造成生硬。
