  text: But they will especially be confounded—those who rejected the law and stopped their ears so as not to hear wisdom and not to receive understanding—
translation:
  language: zh_hans
  text: 但那些像这样的人，尤其要惊惶失措：他们弃绝我的律法，堵住耳朵，不听智慧，也不领受悟性——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܬܙܝܥܘܢ
  choice: 要惊惶失措
  rationale: 此词表达受震动、惊惶或慌乱；结合末世显现与审判语境，译为“惊惶失措”既自然，也保留强烈的心理震撼。
- source_word: ܕܐܣܠܝܘ
  choice: 弃绝
  rationale: 该动词有鄙弃、拒斥之意；“弃绝”比单纯“拒绝”更能体现主动轻蔑并排斥。
- source_word: ܢܡܘܣܝ̈
  choice: 我律法
  rationale: 叙利亚文为带第一人称单数后缀的复数形式，直指“我的律法”；汉语以集合性单数“律法”表达更自然。
- source_word: ܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
  choice: 堵住耳朵
  rationale: 保留原文具体而生动的身体隐喻，表示故意拒听。
- source_word: ܚܟܡܬܐ
  choice: 智慧
  rationale: 采用该词常规而庄重的对应词，不将其限定为某一特殊神学概念。
- source_word: ܣܘܟܠܐ
  choice: 悟性
  rationale: 该词可指理解、领悟或明辨；“悟性”与“领受”搭配自然，并与前文“智慧”形成对应。
theological_decisions:
- issue: 律法的数与所属
  choice: 我律法
  alternative: 我的律例／我的诸律法
  rationale: 原文形态带第一人称所属标记且形式为复数；中文“我律法”忠实表达所属关系，同时把多项法令视作整体，避免生硬的复数措辞。
- issue: 受震动之词是羞愧还是惊惶
  choice: 惊惶失措
  alternative: 羞愧困惑／震惊
  rationale: 源词的核心更接近震动、骚乱和惊惶，不宜仅按英语 consultation layer 的“confounded”收窄为羞愧或困惑。
- issue: 句末未完结构
  choice: 以破折号收尾
  alternative: 以句号结束
  rationale: 原文以“当……因此……”进入下一节，英语审核层也保留未完结构；破折号提示本节思想尚待下文续接。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留“堵住耳朵”的原文意象，并用破折号呈现跨节延续的句法。
