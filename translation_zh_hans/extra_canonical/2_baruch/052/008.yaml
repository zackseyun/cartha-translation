  naturalness: “我律法”在现代汉语书面语中不自然，应作“我的律法”。其余措辞庄重通顺；“堵住耳朵”保留原文意象，可接受。
  terminology: “弃绝”“智慧”“悟性”均与叙利亚文及本段审判/智慧语境相称。ܢܡܘܣܝ̈带第一人称所属，宜明确译作“我的律法”。“惊惶失措”可表达ܢܬܬܙܝܥܘܢ所含的受震动、惶乱，不应按英语“confounded”限缩为单纯困惑或羞愧。
