  text: 我们撕裂衣服，哭泣哀悼，禁食了七天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “撕裂衣服”所对应的叙利亚语短语
  choice: 撕裂衣服
  rationale: 保留古代近东以撕裂衣服表达剧烈悲痛的具体动作，不改写为抽象的“悲痛”。
- source_word: “哭泣／哀悼”所对应的并列动词
  choice: 哭泣哀悼
  rationale: 保留两个相近而不相同的哀伤动作；现代汉语中不用顿号，可使连续动作读来自然。
- source_word: “七天”所对应的时间短语
  choice: 禁食了七天
  rationale: 将时间长度自然地连接到“禁食”，同时保留七日这一明确时段。
