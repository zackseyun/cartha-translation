  yaml_path: translation/extra_canonical/2_baruch/009/001.yaml
  text: And I, Baruch, came with Jeremiah, whose heart had been found pure from sins, and who had not been taken in the capture of the city. And we rent our garments, wept, mourned, and fasted seven days.
translation:
  language: zh_hans
  text: 我巴录和耶利米一同来到；耶利米的心被认定为洁净、没有罪污，他也没有在城陷落时被掳去。[a]我们撕裂衣服，哭泣、哀悼，并禁食七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来到”或译“回来”。本节开头的叙利亚文本较难辨认，动词的方向不确定。
    reason: 保留原文动词在现存文本及校勘传统中的方向不确定性，避免正文预设为“返回”。
lexical_decisions:
- source_word: ܐܬܒܥ
  choice: 回来
  rationale: 本处叙事开头的叙利亚文本传抄与识读较不稳定；结合上下文及校勘传统，采用语义负担较小的移动动词“回来”，同时以脚注保留“前来”的可能。
- source_word: ܕܟܝ ... ܡܢ ܚܛܝ̈ܗ̣ܐ
  choice: 他的心被认定为没有罪污
  rationale: 既保留“被认定”的判断意味，也用“没有罪污”表达其相对于耶路撒冷灾祸与罪责的清白，不将措辞扩大为关于绝对无罪的系统性断言。
- source_word: ܐܬܚܙܝ
  choice: 被认定
  rationale: 此处不是单指视觉上的“被看见”，而是对耶利米品格与处境所作的判断。
- source_word: ܒܥܒܕܘܗܝ ܕܡܕܝܢܬܐ
  choice: 在城被攻陷时
  rationale: 自然地表达城市遭武力夺取的事件，并保留军事语境。
- source_word: ܘܒܩ̈ܝ
  choice: 哭泣哀悼
  rationale: 以两个相连而有区别的哀伤动作体现原文哀歌场景的分量。
theological_decisions:
- issue: 耶利米被描述为从罪中洁净
  choice: 译作“他的心被认定为没有罪污”
  alternative: 译作“他的心完全无罪”或“他的心在礼仪上洁净”
  rationale: 紧接着的语境是城被攻陷以及耶利米没有被掳；因此此语最自然地指他在导致该灾祸的罪责上清白。译文仍保留原文的道德洁净措辞，但不擅自断言他在一切意义上绝对无罪。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“城被攻陷”“被掳去”符合历史叙事语域；“撕裂衣服，哭泣哀悼，并禁食了七天”保留连续的哀悼动作及完整的七日禁食信息。
