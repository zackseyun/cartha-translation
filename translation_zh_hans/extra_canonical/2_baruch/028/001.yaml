translation:
  language: zh_hans
  text: 因此，那时凡有悟性的人都必有智慧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本次所附的叙利亚文页面止于前一章灾难清单的第十项，并未收录本节；本句暂依经审核的英文参照层译出，待取得包含本节的叙利亚文页面后复核。
    reason: source_gap
lexical_decisions:
- source_word: （本次所附叙利亚文材料未包含本节词形）
  choice: 有悟性的人
  rationale: 依据经审核的英文参照层中“whoever understands”，采用自然、庄重的现代汉语；不把“明白”具体限定为某种知识或启示。
- source_word: （本次所附叙利亚文材料未包含本节词形）
  choice: 必有智慧
  rationale: 对应“shall then be wise”，保留将来或终末语境中的断言，不增添“得救”“称义”等原文未明说的神学含义。
- source_word: （本次所附叙利亚文材料未包含本节词形）
  choice: 那时
  rationale: 对应英文参照层的“then”，保留时间指向，同时避免擅自明确其所指的具体阶段。
theological_decisions:
- issue: “有悟性”所指为何
  choice: 保持泛指，不明确为领受某一特定教义或启示
  alternative: 译成“明白这些事的人”或“认识上帝的人”
  rationale: 现有参照文本没有宾语；补出具体对象会消除原有的开放性。
- issue: 智慧是当下状态还是届时显明的结果
  choice: 以“那时……必有智慧”保留时间性及断言语气
  alternative: 译成“所以，聪明人就是智慧人”
  rationale: 后者会削弱“then”所表达的时间或终末张力。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“有悟性的人”比“理解者”自然，也避免把原句窄化为智力能力；“必有智慧”保留箴言式与末世性兼具的语气。
