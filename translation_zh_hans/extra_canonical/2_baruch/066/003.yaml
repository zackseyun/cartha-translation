base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/003.yaml
  text: And not only did they kill the impious who were living, but they also brought the bones of the dead out from the graves and burned them with fire.
translation:
  language: zh_hans
  text: 他们不但杀害了那些还活着的不敬虔之人，还把死者的骸骨从坟墓里取出来，用火焚烧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܨ̈ܥܨܥܐ
  choice: 不敬虔之人
  rationale: 依上下文及英译审校层理解为道德、宗教意义上的恶人；译作“不敬虔之人”既通顺，也不把含义收窄为某一种具体罪行。
- source_word: ܠܡܝ̈ܬܘܗܝ … ܡܢ ܩܒܪܐ
  choice: 死者的骸骨从坟墓里取出来
  rationale: 叙述对象是已经埋葬的死人；按汉语习惯以“骸骨”表达从坟墓中取出的遗骸，同时保留“坟墓”这一明确意象。
- source_word: ܒܢܘܪܐ
  choice: 用火焚烧
  rationale: 直接保留火焚动作，采用庄重而自然的现代汉语。
theological_decisions:
- issue: 本节动词主语在叙利亚文中由单数转为复数
  choice: 保留“他……；他们……”的转换
  alternative: 统一译作“他们……他们……”或“他……他……”
  rationale: 现存叙利亚文先用单数形式叙述杀害，随后用复数形式叙述掘墓焚骨。英译修订层为行文一致而统一成复数，但原文的转换不宜在无文本依据时被默默消除。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；用分号呈现两项递进的暴行，并保留原文主语数的张力。
