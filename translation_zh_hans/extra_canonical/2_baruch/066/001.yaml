base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/001.yaml
  text: And the tenth bright waters that you saw—these are the purity of the generation of Josiah king of Judah, who alone at that time submitted himself to the king (or change source word to ܚܝܠܬܢܐ) with the fullness of his heart and with all his soul.
translation:
  language: zh_hans
  text: 你所看见的第十股明亮的水，代表犹大王约西亚[a]那一代的纯正；当时唯有他以充盈的心、全部的魂顺服大能者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本页的王名文字受损，表面上近似“亚们”；但本节所述的纯正世代和随后列举的改革都指向约西亚。
    reason: 交代受损王名及采用语境校读的依据。
  - marker: b
    text: 本页此处文字损坏，照现存字样难以成句；“顺服大能者”是依据上下文和可能的原文校复而译。
    reason: 明确标示正文所依据的校订，并保留真实的文本不确定性。
lexical_decisions:
- source_word: ܒ̈ܬܪ ܒܣܝ̈ܡܐ
  choice: 第十股明亮的水
  rationale: 按异象中明暗诸水交替出现的结构理解；“第十”修饰这一股水，“明亮”保留其象征性的类别名称。
- source_word: ܕܫܘܝܐ
  choice: 纯正
  rationale: 兼顾道德端正与洁净之意，也与下文约西亚的改革相称；不把含义限缩为单纯的礼仪洁净。
- source_word: ܡ̇ܠܟܐ
  choice: 王
  rationale: 该词在“犹大王”中是普通王号，不能据此译作神圣称号“大能者”。
- source_word: ܡܢ ܡܠܝܘ ܠܒܗ ܘܡܢ ܟܠܗ̇ ܢܦܫܗ
  choice: 以充盈的心、全部的魂
  rationale: 分别保留“心的充盈”与“全部的魂”两种表达，避免都归并为惯用的“尽心尽性”而抹去原文差别。
theological_decisions:
- issue: 本节开头受损的王名
  choice: 约西亚
  alternative: 亚们
  rationale: 现存页面字形似乎受到讹误或文本损坏影响，但明水的正面象征、紧接着叙述的宗教改革以及历史背景都明确指向约西亚；以脚注交代抄本文字问题。
- issue: 顺服对象及其称号
  choice: 大能者
  alternative: 王／按现存页面逐字作“罪”一类不通顺的读法
  rationale: 本页这一短语明显损坏，所给页面文本无法形成符合语境的句意。依据句法、上下文及本书对上帝的惯常称号，正文采用“大能者”，同时用脚注保留文本不确定性，不把校订伪装成毫无疑问的原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第十股明亮的水”延续异象的结构性用语；“纯正”同时容纳伦理与敬拜层面的更新。末句刻意保留“心的充盈／全部的魂”的并列表达，虽略带源语色彩，却能呈现原文的词汇区别。
