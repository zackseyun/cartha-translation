base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/002.yaml
  text: And he cleansed the land from idols, and sanctified the vessels that had been defiled, and restored the offerings to the altar, and raised the horn of the holy ones, and exalted the righteous, and honored all who were wise in understanding. He also brought the priests back to their service, and removed the sorcerers, diviners, and wizards from the land.
translation:
  language: zh_hans
  text: 他清除那地的偶像，使那些曾被玷污的器皿重新分别为圣，又恢复祭坛上的供物；他高举圣民的角[a]，抬举义人，并尊重一切聪明通达的人。他也使祭司重返职任，把行巫术的、占卜的和交鬼的[b]从那地除去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣民”也可译作“圣者”。“高举……的角”是表示使人得力量、尊荣或兴盛的说法。
    reason: 保留复数称谓及“角”这一闪族意象的语义幅度。
  - marker: b
    text: 或译“通灵者”。这里指求问灵界的术士，并非泛指“罪人”。
    reason: 说明该术语在禁忌术士列表中的专门含义，并记录可行译法。
lexical_decisions:
- source_word: ܕܚ̈ܝܐ / source tradition reflected in the audited clause “cleansed”
  choice: 清除
  rationale: 与“那地的偶像”搭配自然，表达除净、肃清之意，同时不把动作弱化为抽象的洁净。
- source_word: ܡܐܢ̈ܐ（器皿）
  choice: 器皿
  rationale: 保留圣殿礼仪语境中的具体器具，不泛化为“物品”。
- source_word: ܩܪܢܐ（角）
  choice: 角
  rationale: 保留闪族语言中象征力量、尊荣和兴盛的形象，不在正文中单向释义。
- source_word: ܩܕܝ̈ܫܐ（圣者／圣民）
  choice: 圣民
  rationale: 此处是复数群体称谓；“圣民”在现代汉语中较自然，同时脚注保留“圣者”的形式对应。
- source_word: ܝܕܘ̈ܥܐ（知道者／术士一类）
  choice: 交鬼的
  rationale: 在列举禁忌术士的语境中，该词指求问灵界的术士，而非泛称罪人；“交鬼的”能与“行巫术的、占卜的”形成清楚的三项并列。
theological_decisions:
- issue: “高举……的角”是否直接解释为赐予力量或尊荣
  choice: 正文保留“高举圣民的角”
  alternative: 使圣民大有力量／尊荣
  rationale: 原文意象具有力量、尊荣和兴盛等多重含义；保留“角”可避免把神学和诗性张力限定为单一解释。
- issue: ܩܕܝ̈ܫܐ 的群体身份
  choice: 圣民
  alternative: 圣者
  rationale: “圣民”较符合群体性历史叙事，但不将其限定为某一后世教会身份；脚注注明直译可能。
- issue: 末项术士称谓的处理
  choice: 交鬼的
  alternative: 术士／通灵者
  rationale: 上下文明确是约西亚式改革中被清除的禁忌从业者；不采用“罪人”，因为那会丢失具体类别。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留祭坛、分别为圣、祭司等礼仪用语。并列结构按原文修辞推进，避免加入宗派性解释。
