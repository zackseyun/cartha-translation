base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/004.yaml
  text: And the workers of magic he burned with fire; and the lying prophets who were leading the people astray, these also he gave over to burning. And the people who had listened to them while they were alive, he cast into the brook.
translation:
  language: zh_hans
  text: 他把行邪术的人用火焚烧；那些诱使百姓走入歧途的假先知，他也交给烈火焚烧。至于那些在他们活着时听从他们的百姓，他把他们扔进溪中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܡܩ̈ܢܫܐ
  choice: 行邪术的人
  rationale: 依上下文及校勘传统，此处指从事法术者；用现代汉语概括其行为，避免采用容易误指舞台表演的“魔术师”。
- source_word: ܠܥܝ̈ܒ̣ܝܐ ܕ̈ܕ̈ܠܐ
  choice: 假先知
  rationale: 叙利亚文本传抄形态不甚清晰，英语审校层将其理解为说谎、误导人的先知；“假先知”自然简洁，并保留其宗教身份与虚假性质。
- source_word: ܕܡܣܒܝܢ ܗܘܘ ܠܥܡܡ̣ܐ
  choice: 诱使百姓走入歧途
  rationale: 表达持续误导百姓的含义，符合现代汉语习惯。
- source_word: ܒܢܚܠܐ
  choice: 溪中
  rationale: 原文仅作“溪流/河谷中的水道”，未在本句明说名称，因此不补入“汲沦溪”。
theological_decisions:
- issue: 对受刑行为的表述
  choice: 交给烈火焚烧
  alternative: 烧死
  rationale: 保留原文“交付/置于火中”的叙事措辞，不擅自断定句中着重的是死亡结果。
- issue: 听从假先知者的责任
  choice: 那些在他们活着时听从他们的百姓
  alternative: 被他们欺骗的百姓
  rationale: 原文强调百姓曾听从他们；不加入“被欺骗”以免减弱经文保留的责任张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；三个处置动作按原文次序展开，并以“至于”清楚标示最后一组对象。未沿用英语旧脚注中的误重复内容。
