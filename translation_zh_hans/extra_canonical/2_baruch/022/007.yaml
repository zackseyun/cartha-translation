  text: Or does a woman who is pregnant, if she gives birth without pains, expect a dead child in her womb?
translation:
  language: zh_hans
  text: 又比如，一个怀孕的妇人若生产时没有阵痛，岂不会以为腹中的孩子已经死了吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܬܬܐ ܕܒܛܢܐ
  choice: 一个怀孕的妇人
  rationale: 按叙利亚语直译，同时采用现代汉语自然表达。
- source_word: ܕܠܐ ܟܐܒ̈ܐ
  choice: 没有阵痛
  rationale: 原词泛指疼痛；在生产语境中译作“阵痛”准确而自然。
- source_word: ܩܛܝܠܐ
  choice: 孩子已经死了
  rationale: 该词字面义为“被杀的、死去的”；此处与母腹和生产相连，指腹中死去的孩子。避免采用带有现代医学界定色彩更强的“死胎”。
- source_word: ܒܥܘܒܗ̇
  choice: 腹中的
  rationale: 原文意为“在她的腹中/怀中”，此处按妊娠语境译为“腹中”。
theological_decisions:
- issue: 反问句的逻辑与语气
  choice: 保留“岂不会……吗”的反问形式
  alternative: 译为陈述句“她就会以为……”
  rationale: 原文以否定疑问表达预期，保留反问可维持上下文一连串比喻的修辞力度，也不额外解释其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言；“又比如”承接上文连续的类比问句。
