  text: Or if a treasure is given to someone, does he not take confidence from it, so that he is no longer shaken?
translation:
  language: zh_hans
  text: 又好比一个人得了宝藏，难道不会因它而有把握，从此不再动摇吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܙܐ
  choice: 宝藏
  rationale: 该词指财宝、宝藏；此处与“赐给”搭配，译作“宝藏”自然，也保留比喻的价值感。
- source_word: ܡܣܬܒܪ
  choice: 有把握
  rationale: 此词在此处语义较难确定，可能涉及怀有信心、盼望或确信；结合后句“不再动摇”，译作“有把握”较能传达稳定信心，同时不作过度神学化处理。
- source_word: ܡܬܬܙܝܥ
  choice: 动摇
  rationale: 该词表示受震动、被扰动；“不再动摇”既贴近原文意象，也符合现代汉语表达。
theological_decisions:
- issue: 所得宝藏带来的内在状态
  choice: 有把握
  alternative: 有信心／有盼望
  rationale: 原词可容纳信心或盼望的意味，但上下文重点在获得宝藏后不再动摇；采用较宽泛的“有把握”，避免把比喻限定为某一特定神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式；以“又好比”承接本段连续的类比，并保留原文从获得宝藏到不再动摇的逻辑关系。
