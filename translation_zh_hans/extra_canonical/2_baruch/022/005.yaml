  text: Or if someone sows the earth, unless he loses instead of his fruits, is he afterward ruined by famine?
translation:
  language: zh_hans
  text: 又如有人在地里撒种，若不有所舍弃以得果实，后来还能不被饥荒毁灭吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܪܥ ܐܪܥܐ
  choice: 撒种在地里
  rationale: 直译其农业动作，同时采用现代汉语自然表达。
- source_word: ܡܘܒܕ
  choice: 舍去
  rationale: 该词通常有“失去、丧失、毁掉”之意；在播种语境中指种子投入土中而被舍去，不宜按上下文直接改译为“收获”。
- source_word: ܚܠܦ ܦܐܪ̈ܘܗܝ
  choice: 来换取果实
  rationale: ܚܠܦ 表示交换、代替或作为回报；此处呈现舍去种子与得到果实之间的对应关系。
- source_word: ܡܚܒܠ ܠܗ ܟܦܢܐ
  choice: 饥荒……伤害他
  rationale: 保留动词“伤害、毁坏”的力度，并以汉语自然语序表达。
theological_decisions:
- issue: 是否依据上下文把疑难词句改成“收获果实”
  choice: 保留“舍去……来换取”的文本张力
  alternative: 译作“若不收获果实”
  rationale: 现存叙利亚文本使用的动词是“失去、舍去”，不是通常表示“收获”的词；译文不应仅凭比喻逻辑静默校正原文。
- issue: 末句反问的逻辑关系
  choice: 译为“岂能从此不再伤害他呢”
  alternative: 陈述为“饥荒从此不再伤害他”
  rationale: 前后例证构成带条件的反问句；如此既符合语境，也保留原句“不再”的措辞。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；以“又如”衔接本段连续的比喻式反问，并保留原文较为费解的交换意象。
