  text: Or if someone plants a vineyard, unless he takes from it fruit for nourishment, does not the one who planted it expect to take fruit from it?
translation:
  language: zh_hans
  text: 又有谁栽种葡萄园，却不从中取果子供自己食用呢？栽种它的人，岂不盼望从中取果子吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܨܒ ܟܪܡܐ
  choice: 栽种葡萄园
  rationale: ܢܨܒ 表示栽植，ܟܪܡܐ 指葡萄园；按叙利亚文意象直译，并符合现代汉语表达。
- source_word: ܦܐܪ̈ܐ
  choice: 果实
  rationale: 保留泛指复数“果实”，不窄化为“葡萄”或“收成”。
- source_word: ܕܢܬܪܣܐ
  choice: 来维持生活
  rationale: 该词在此有得到供养、滋养之意；译法既表达果实的生活供给作用，也避免生硬的“被滋养”。
- source_word: ܡܣܒܪ
  choice: 指望
  rationale: 表达期待、盼望之意；“指望”适合此处栽种者期待收获的日常语境。
theological_decisions:
- issue: 反问句的逻辑关系
  choice: 保留“若不……难道不……”的反问结构
  alternative: 改写为肯定句“栽种的人自然指望……”
  rationale: 原文以类比式反问推进论证；保留反问可维持其修辞张力，不替作者把论证直接化约为陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“又比如”承接上下文连续的类比；不添加原文没有明说的神学指涉。
