review_pass:
  verdict: revise
  source_fidelity: 叙利亚文的核心意象与英文审校轨迹一致：栽种葡萄园者从园中取果子以供养自己，并期待取得果子。草稿准确保留了葡萄园、果实及反问式论证；但“维持生活”略泛，未清楚表达果实是供栽种者自己食用／养生的用途。
  naturalness: “若不……难道……不……”在现代汉语中形成不够顺畅的双重否定式条件反问，且容易使条件与结论的逻辑关系显得别扭。改为两个连贯的反问句，更符合汉语，也保留原文连续类比的修辞。
  terminology: “葡萄园”“果子”均恰当。“果子”在此比“果实”稍自然，并仍保留泛指，不将其窄化为葡萄。“供自己食用”准确传达 ܕܢܬܪܣܐ 的自我养生／得供养含义。
  issues:
  - severity: medium
    issue: 条件反问在汉语中不够清晰自然
    rationale: 草稿的“若不从园中收取果实来维持生活，难道栽种的人不指望……”字面追随英文“unless”，但现代汉语的双重否定条件句容易造成逻辑歧义。将其处理为“有谁……却不……呢？……岂不……”可忠实呈现原文的修辞性设问而不强加解释。
  - severity: low
    issue: “来维持生活”略宽泛
    rationale: 原文表明取果子的目的在于使栽种者得到滋养；“供自己食用”更具体、自然，且不增添原文没有的经济或生活方式含义。
  revised_text: 又有谁栽种葡萄园，却不从中取果子供自己食用呢？栽种它的人，岂不盼望从中取果子吗？
