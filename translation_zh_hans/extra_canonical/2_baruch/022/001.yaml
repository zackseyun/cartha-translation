  text: 'And it happened after these things, and behold, I heard a voice, and I saw a might fixed upon me. And a voice was heard from on high and said to me:'
translation:
  language: zh_hans
  text: 这些事以后，看哪，我听见一个声音，又看见有一股力量加在我身上。又有声音从高处传来，对我说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܐ
  choice: 一股力量
  rationale: 该词可指力量、能力或威势；加量词使现代汉语自然，同时不把它具体化为某位使者或某种异象。
- source_word: ܕܐܬܩܒܥ ܠܝ
  choice: 临到我
  rationale: 字面含“被安置／确立于我”的意味；“临到我”保留外来力量作用于叙述者的方向感，也避免生硬的“固定在我身上”。
- source_word: ܡܢ ܡܪܘܡܐ
  choice: 从高处
  rationale: 按叙利亚语空间表达直译，不擅自明确为“从天上”，从而保留原文措辞。
- source_word: ܐܫܬܡܥ
  choice: 传来
  rationale: 原词为被动式“被听见”；结合汉语听觉叙事译作“传来”，比重复“有声音被听见”自然。
theological_decisions:
- issue: “力量”的所指
  choice: 不指明其身份，仅译作“一股力量”
  alternative: 译作“神力”“大能”或“有权能者”
  rationale: 本节没有明确说明该力量是神的能力、天使还是异象中的实体；不作神学性补足。
- issue: 高处是否明确等同于天上
  choice: 从高处
  alternative: 从天上
  rationale: 保留ܡܪܘܡܐ的空间性及可能的神圣含义，不将其唯一化。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。“看哪”保留启示叙事中的提示语气；句式适度调整，以免连续被动结构显得生硬。
