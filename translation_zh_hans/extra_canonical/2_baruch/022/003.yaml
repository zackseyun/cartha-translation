  text: Does one who sets out on a road fail to find it? Or can one who sails on the sea find rest unless he reaches the harbor?
translation:
  language: zh_hans
  text: 走在路上的人，难道会找不到路吗？出海航行的人若不到港口，岂能得安歇呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗ̇ܘ ܕܐܙܠ ܒܐܘܪܚܐ
  choice: 走上道路的人
  rationale: 贴近叙利亚文“在道路上行走的人”，同时以现代汉语自然表达启程上路之意。
- source_word: ܠܐ ܡܫܟܚ ܠܗ̇
  choice: 难道会找不到它吗
  rationale: 保留原文阴性代词“它”及反问语气，不擅自补出原文未明说的目的地。
- source_word: ܕܦܪܫ ܒܝܡܐ
  choice: 航海的人
  rationale: 该短语指乘船出海或在海上航行；“航海”简洁而符合比喻语境。
- source_word: ܠܡܐܢܐ
  choice: 港口
  rationale: 原词指港湾、避风港或船只抵达之处；“港口”是现代通行表达。
- source_word: ܕܢܬܢܝܚ
  choice: 得安歇
  rationale: 兼顾“休息、安顿、获得安宁”的含义，并与抵达港口的意象相称。
theological_decisions:
- issue: 道路意象中代词所指不完全明确
  choice: 正文保留“它”，脚注说明可能所指
  alternative: 译为“终点”或“目的地”
  rationale: 叙利亚文使用阴性代词，语法上可回指“道路”，但语义上也可能暗含旅程所寻的去处；不以解释性补语消除原有张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；两个反问句保持原文平行结构。“得安歇”略带经文语体，但仍为普通读者易懂。
