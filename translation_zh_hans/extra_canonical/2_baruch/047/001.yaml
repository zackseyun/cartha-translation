  text: And when I had gone out and dismissed them, I went away from there and said to them, “Look, I am going to my dwelling in Hebron.”
translation:
  language: zh_hans
  text: 我出去遣散了他们以后，就离开那里，对他们说：“看哪，我要到我在希伯仑的住处去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫ̇ܪܝܘ ܐܢܘܢ
  choice: 遣散了他们
  rationale: 该动词组有释放、让人离去之意；结合公开讲话结束后的叙事场景，“遣散了他们”既保留正式语气，也比单纯的“离开他们”更准确。
- source_word: ܠܕܝܪܝ ܠܚܒܪܘܢ
  choice: 回希伯仑我的住处去
  rationale: 叙利亚文在地名“希伯仑”之前明确保留“我的住处”这一成分；中文调整语序，并用“回……去”自然表达前往自己居所的意思。
- source_word: ܗܐ
  choice: 看哪
  rationale: 保留提示听者注意的语用功能和庄重叙事语气，同时不增添原文没有的解释。
