  text: And afterward my companions left me, and I came to the cedar where he had spoken with me; and I sat there and fasted seven days.
translation:
  language: zh_hans
  text: 此后，我的同伴离开了我。我来到那棵香柏树旁，那是先前有人在那里与我说话的地方；我坐在那里，禁食了七天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܒܪܐ
  choice: 我的同伴
  rationale: 该词在此可作集合意义；结合动词和叙事场景，译作“我的同伴”既自然，也不强行限定人数。
- source_word: ܐܪܙܐ
  choice: 香柏树
  rationale: 通常指香柏木或香柏树；此处是巴录前往并坐在其旁的具体地点，故译作“香柏树”。
- source_word: ܨܡ̇ܬ
  choice: 禁食
  rationale: 准确表达宗教语境中的禁食行为，比一般的“不吃东西”更符合叙事语域。
theological_decisions:
- issue: ܕܐܬܡܠܠ ܥܡܝ 中说话者未明说
  choice: 译作“先前与我说话之处”，不补出主语
  alternative: “先前他与我说话的地方”或“先前上帝与我说话的地方”
  rationale: 叙利亚文使用未明确施事者的表达；中文省略说话者，可保留原文含蓄，不把语境中的推定身份写进正文。
translation_notes:
  register: 采用现代、庄重而顺畅的叙事语言；保留“香柏树”和“禁食”等文本意象，并通过省略说话者来维持原文的指称开放性。
