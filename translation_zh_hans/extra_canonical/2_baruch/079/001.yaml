  text: Therefore, mourn for Zion, and sigh for Jerusalem.
translation:
  language: zh_hans
  text: 所以，要为锡安哀哭，为耶路撒冷叹息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的叙利亚文页面片段实际包含前一章书信开头的材料，并未可靠呈现本节；本节措辞依据已经过节号对齐校订的读法译出。
    reason: source_alignment
lexical_decisions:
- source_word: mourn（校订所恢复的本节动词）
  choice: 哀哭
  rationale: 既表达公开的悲恸，也保持庄重语气；比单纯的“悲伤”更贴近为锡安举哀的动作。
- source_word: sigh（校订所恢复的本节动词）
  choice: 叹息
  rationale: 自然保留与“哀哭”并列而有区别的悲痛表达，不扩展为原文未明说的祈祷或悔罪。
- source_word: Zion / Jerusalem
  choice: 锡安／耶路撒冷
  rationale: 采用通行中文专名，并保留两个地名的平行结构，不把二者合并解释。
theological_decisions:
- issue: 锡安与耶路撒冷的关系
  choice: 按原有平行句分别保留“锡安”和“耶路撒冷”
  alternative: 将二者合并解释为同一座城或其居民
  rationale: 两者虽密切相关，诗性并列仍可能具有不同侧重；译文不替原文消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“所以”承接上文，“要……要……”所隐含的劝告语气以中文停顿自然表达；两个悲恸动词保持简洁的平行结构。
