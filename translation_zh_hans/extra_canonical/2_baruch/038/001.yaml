  naturalness: “在悟性中受引导的人”略显生硬，“我的心一直遵行你的律法”则将“魂/心灵行在律法中”的意象转为较狭义的守法行为。改为“凭悟性受引导的人”及“我的心灵行在你的律法中”，既更合现代汉语，也更贴近原文的表达。
  terminology: “律法”“生命”“智慧”“正直”“异象”均恰当，且没有引入宗派性术语。“赐光”比“光照”更直接对应“give light”的施予表达。
