  yaml_path: translation/extra_canonical/2_baruch/038/001.yaml
  text: And I prayed and said, “Lord, my Lord, you continually give light to those who are guided in understanding. Your law is life, and your wisdom is uprightness. Therefore show me the interpretation of this vision. For you know that my soul has walked in your law, and from my earliest days I have not been cut off from your wisdom.”
translation:
  language: zh_hans
  text: 我祷告说：“主啊，我的主，你不断赐光给那些凭悟性受引导的人。你的律法就是生命，你的智慧就是正直。因此，求你向我显明这个异象的解释；因为你知道，我的心灵行在你的律法中；从幼年起，我就未曾与你的智慧隔绝。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存叙利亚文印本的这一段在扫描转写中有明显讹误；若机械依照所给转写，也可读作：“他回答我说：‘你为什么问我？你在祷告中帮助那些凭悟性受引导的人。我的律法就是生命，我的智慧就是正直。我与你之间的奥秘，就是这个异象的解释。因为你已经看见，你在祷告中出去时怎样被我的律法说服；从古时的日子以来，你未曾离开我的智慧。’”本译文采用经手稿校勘所恢复、也与本节上下文相合的读法。
    reason: 记录所给OCR式叙利亚文与经校勘文本之间足以改变说话者、人称和句意的异文，避免默默消除文本问题。
lexical_decisions:
- source_word: ܕܒܣܘܟܠܐ ܡܬܕܒܪܝܢ
  choice: 在悟性中受引导的人
  rationale: 保留介词所表达的范围意味，以及被引导这一被动色彩；“悟性”兼顾理解力与道德洞察。
- source_word: ܢܡܘܣܟ ܚ̈ܝܐ ܗܘ
  choice: 你的律法就是生命
  rationale: 按经校订的底本读作第二人称所有格，并保留无系词名词句的强烈等同关系，不弱化为“赐生命”。
- source_word: ܚܟܡܬܟ ܬܪܝܨܘܬܐ ܗܝ
  choice: 你的智慧就是正直
  rationale: “正直”自然传达直正、端正及伦理意义，同时避免擅自限定为法庭式称义概念。
- source_word: ܦܘܫܩܗ ܕܚܙܘܐ ܗܢܐ
  choice: 这个异象的解释
  rationale: 在启示文学语境中，“解释”准确表达对异象象征意义的阐明。
- source_word: ܠܐ ܐܬܢܣܝܬ
  choice: 未曾与你的智慧隔绝
  rationale: 保留该动词可能含有的分离、断绝意味，也避免把它仅处理成主动的“离弃”。
theological_decisions:
- issue: 律法、智慧与神圣启示的关系
  choice: 将两句译为强谓语判断：“你的律法就是生命，你的智慧就是正直。”
  alternative: 将其弱化为“你的律法赐生命”或把“正直”限定译作司法性的“公义”
  rationale: 原文的格言式平行结构把律法与生命、智慧与正直直接相联；直译可保留其圣约与启示神学的张力，而不引入特定宗派解释。
- issue: 末句所表达的是主动离弃还是被隔绝
  choice: 未曾与你的智慧隔绝
  alternative: 未曾离弃你的智慧
  rationale: 被动措辞保留关系被切断的较强含义，也与受审校的英文咨询层一致。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主啊，我的主”保留祷告称呼的重复；“我的心一直遵行”以自然汉语表达“我的魂行在……中”的惯用意象。脚注明确交代转写讹误与校勘取舍。
