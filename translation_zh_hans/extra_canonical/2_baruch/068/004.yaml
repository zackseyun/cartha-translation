  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܙܒܢܐ ܗܘ
  choice: 那时
  rationale: 介词短语带指示成分，指向特定的时期，而非泛指“终有一天”或“及时”。
- source_word: 喜乐（对应叙利亚文“喜乐”语义）
  choice: 大大喜乐
  rationale: 用程度副词自然表达原文所述喜乐之丰盛，同时保持庄重、易懂的现代汉语。
theological_decisions:
- issue: 该时间短语是否泛指未来某时，或特指上下文所述时期
  choice: 译作“那时”，保留其对特定末后时期的指向
  alternative: 到时候／终有一天
  rationale: 指示成分支持特指；不把它弱化为不确定的将来时间。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；“必”表达预告性将来语气，“大大喜乐”比“有许多快乐”更自然，也更符合经文语体。
