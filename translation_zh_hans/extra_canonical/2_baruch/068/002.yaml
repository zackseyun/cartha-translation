  text: After these things a time will come when your people will fall into such distress that they will all be in danger of perishing together.
translation:
  language: zh_hans
  text: 这些事以后，将有一段时期，你的人民会陷入极大的困境，以致全都面临一同灭亡的危险。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: 这些事以后
  rationale: 按叙事顺序自然表达“在这些事之后”，并保留原文的承接关系。
- source_word: ܠܐܒܗܝܟܘܢ / 相关残缺行文
  choice: 临到你的人民
  rationale: 所给叙利亚文页面在目标位置残缺且分行混乱；结合章节语境及经审校的英文咨询层，采用指向受话者族群的表达，不据残缺字形作过度推断。
- source_word: 困厄与灭亡相关的残缺行文
  choice: 陷入极大的困境……面临一同灭亡的危险
  rationale: 用现代汉语清楚传达群体陷入严重危局、濒临共同毁灭的意思，同时保留“危险”而不把可能性强化为必然结局。
theological_decisions:
- issue: 灾难是否必然导致全体灭亡
  choice: 面临一同灭亡的危险
  alternative: 全都一同灭亡
  rationale: 原意强调濒危而非明确宣告结局；保留这种张力，避免把危险误译成已经注定的结果。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“将有一个时期临到”保留预告语气；分号呈现困境与后果之间的递进关系。
