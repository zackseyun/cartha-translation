  text: Nevertheless, they will be saved, and their enemies will fall before them.
translation:
  language: zh_hans
  text: 然而[a]，他们必蒙拯救，他们的仇敌必倒在他们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不过”。
    reason: 转折词可按上下文理解为“然而”或“不过”；正文采用较庄重、通顺的“然而”。
lexical_decisions:
- source_word: ܒܪܡ
  choice: 然而
  rationale: 保留转折语气；现代汉语中庄重而自然，也不把它强化为因果或让步关系。
- source_word: “得救／获救”所对应的叙利亚语被动式
  choice: 必蒙拯救
  rationale: 保留被动含义以及将来指向，同时不擅自明说施救者。
- source_word: “倒在他们面前”所对应的叙利亚语表达
  choice: 必倒在他们面前
  rationale: 按原有空间性意象直译，表达敌人败亡或溃败，却不额外限定具体方式。
theological_decisions:
- issue: 拯救者是否应在译文中明说
  choice: 保留“蒙拯救”的被动表达，不补出主语
  alternative: 译作“上帝必拯救他们”
  rationale: 原文没有在本句中明说施救者；补出“上帝”虽可能符合语境，却会消除原文的语法留白。
- issue: 敌人的结局应译为败退、死亡还是倒下
  choice: 译作“倒在他们面前”
  alternative: 译作“被他们击败”或“死在他们面前”
  rationale: “倒下”保留原文意象及其范围上的开放性，不把它收窄为某一种军事或死亡结果。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“必蒙拯救”保留原文被动式的神学含蓄；句式简洁，以符合异象叙事中的预告语气。
