  text: The nations also will come to honor it, but not as fully as before.
translation:
  language: zh_hans
  text: 列国也必前来尊崇它，只是不再像从前那样充分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܡ̈ܬܐ / ܥܡ̈ܡܐ（列国；本页文字传抄或识别不清）
  choice: 列国
  rationale: 保留集体性的外邦诸国含义，与本节经审核的对照层一致，也符合庄重的现代汉语表达。
- source_word: 表示“尊崇、给予荣耀”的词语（本页对应词形不清）
  choice: 尊崇
  rationale: 既可表达向所指对象致敬，也避免将动作过度具体化为敬拜。
- source_word: 表示“不如先前充分”的比较语句（本页对应语序不清）
  choice: 只是不再像从前那样充分
  rationale: 保留程度上的比较，不擅自解释究竟减少的是人数、礼仪还是荣耀的程度。
theological_decisions:
- issue: 列国所作之事是否应译为宗教性的“敬拜”
  choice: 尊崇
  alternative: 敬拜
  rationale: 源语证据不足以确定这里专指神圣敬拜；“尊崇”能保留政治、礼仪和宗教层面的开放性。
- issue: 代词所指是否应在正文中明确为耶路撒冷或锡安
  choice: 保留“它”
  alternative: 明确译作“耶路撒冷”或“锡安”
  rationale: 本节所给材料是章节页段而非清晰的逐节切分，直接补出专名会消除原文依赖上下文的指代关系。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“前来尊崇”呈现列国主动趋近并致敬的动作；“充分”刻意保留程度比较的含混性。由于叙利亚文材料是章节页段，且目标节在页面中的边界和部分词形不清，本稿以源语可辨语义和经审核的英文咨询层交叉控制。
