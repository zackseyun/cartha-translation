  text: 'And the twelfth bright waters that you saw—this is the word:'
translation:
  language: zh_hans
  text: 1 你所看见的第十二组明亮的水，含义如下：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这就是这话。”也可译作“意思是：”。
    reason: 保留叙利亚文解释公式的字面形式及其可能译法。
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: 明亮的水
  rationale: 保留本段反复出现的象征意象，并与“黑暗的水”形成直接对照；“明亮”比“清澈”更贴近光明与黑暗的对比。
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  choice: 含义如下
  rationale: 这是引出异象解释的固定公式；采用自然的现代汉语表达其语用功能，同时在脚注中保留较直译的形式。
- source_word: ܕܬܪܬܥܣܪܐ
  choice: 第十二组
  rationale: “水”在汉语中通常作不可数名词，补出量词“组”可清楚表明这是异象中依次出现的第十二组水，而不是十二份水。
theological_decisions:
- issue: 解释公式应译为“这些就是”还是“含义如下”
  choice: 含义如下
  alternative: 这些就是
  rationale: 叙利亚文公式的核心是“这是这话／其含义”，用于引出对异象的解释，并非把复数的“水”与后文直接作同一性判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“第十二组”使异象序列清晰；冒号表明后文将展开解释。
