translation:
  language: zh_hans
  text: 这些就是你所看见的明亮之水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ（据本节上下文重建）
  choice: 明亮之水
  rationale: 保留异象中“水”的具体意象，并以“明亮”表达其与黑暗之水相对的性质；不把这一意象解释性改写为某种人物、时代或福分。
- source_word: ܕܚܙܝܬ
  choice: 你所看见的
  rationale: 用自然的现代汉语关系结构表达第二人称单数所见的异象，同时保持原文回指先前所见之物的功能。
- source_word: ܗܠܝܢ ܐܢܘܢ
  choice: 这些就是
  rationale: 以判断句准确传达指示代词与系词结构，强调当前解释与先前异象之间的对应。
theological_decisions:
- issue: 是否解释“明亮之水”的象征意义
  choice: 保留异象意象，不在正文中释义
  alternative: 译成“这些就是你所看见的蒙福时代（或义人）”
  rationale: 本节本身只作辨认，象征意义须由上下文展开；在正文中直接释义会消除原文的象征张力并引入解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“明亮之水”略带异象文学色彩，但普通读者容易理解；本节不增补原文未明说的解释。
