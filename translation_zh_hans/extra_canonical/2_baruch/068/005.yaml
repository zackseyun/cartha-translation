  yaml_path: translation/extra_canonical/2_baruch/068/005.yaml
  text: And at that time, after a short interval, Zion will be rebuilt, its offerings restored, and the priests will return to their ministry.
translation:
  language: zh_hans
  text: 那时[a]，过了不久，锡安必重建，献祭必恢复，祭司也必重返职任。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“然后”。
    reason: 该时间短语既可按字面译为“在那时”，也可在连贯叙事中表达“然后”的承接关系。
lexical_decisions:
- source_word: ܒܗܘ ܙܒܢܐ
  choice: 那时
  rationale: 保留叙利亚语指示性时间短语“在那时”的具体表达，而不只译成表示先后次序的“然后”。
- source_word: ܨܗܝܘܢ
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的地名音译。
- source_word: ܩܘܪܒܢܝܗ̇
  choice: 其中的祭物
  rationale: 按献祭语境译出供物、祭品之义；“其中的”自然指回锡安及其圣所秩序。
- source_word: ܟܗܢ̈ܐ
  choice: 祭司
  rationale: 准确保留宗教职分称谓，不泛化为普通侍奉者。
- source_word: ܬܫܡܫܬܗܘܢ
  choice: 供职
  rationale: 表达祭司恢复履行其礼仪职务，措辞简洁庄重。
theological_decisions:
- issue: 锡安重建与献祭、祭司职分恢复之间的关系
  choice: 并列陈述“重建”“祭物恢复”“祭司回来供职”
  alternative: 把后两项解释为锡安重建的属灵象征
  rationale: 原句陈列具体的复兴内容，并未明说其仅为象征；译文不额外作神学化解释。
- issue: 未来语气
  choice: 三项均以“必”统摄
  alternative: 译为一般叙事过去时或愿望语气
  rationale: 上下文为预告性的异象陈述，保留其确定的未来指向。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语；以“供职”表达祭司履职，避免过于古雅的“供祭司之职”，也不加入原文未明说的圣殿或特定礼制细节。
