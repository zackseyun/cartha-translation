translation:
  language: zh_hans
  text: 但在这些事之后，许多国将倾覆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: 这些事以后
  rationale: 按叙事时序自然表达，保留“在这些事之后”的承接关系。
- source_word: ܡ̈ܕܝܢܬܐ
  choice: 国家
  rationale: 该词可指城邑、地区或国家；本节所述对象为多个政治共同体，译作“国家”最合语境，同时避免把它限定为现代民族概念。
- source_word: （对应“fall”的叙利亚文动词在所给章节页的转录中无法可靠辨明）
  choice: 倾覆
  rationale: 依据英文审校层所保存的句义，选用兼具败亡与政权崩落意味的“倾覆”，比字面的“跌倒”更适合国家这一主语。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代汉语。“但”承接前文的转折，“倾覆”保留预言语体；不增补倾覆的施事者、原因或具体方式。所给叙利亚文是整章页桶且文本次序、辨读存在明显困难，因此以可辨的时序表达为基础，并谨慎参照英文审校层确定本节句义。
