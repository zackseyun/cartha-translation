  text: “Behold, Sennacherib is prepared to destroy us, and he will be exalted and lifted up when he destroys Zion.”
translation:
  language: zh_hans
  text: “看哪，西拿基立已经准备好要毁灭我们；他毁灭锡安时，将被高举、被抬高。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܩܐ
  choice: 西拿基立
  rationale: 按本段叙事所指的亚述王西拿基立采用现代中文圣经通行译名；底本此处的字形可能受抄本或转录影响。
- source_word: ܡܕܐ / ܡܐ ܕ־
  choice: ……时
  rationale: 该连接结构在此最自然地表达时间关系，即西拿基立确信自己毁灭锡安之时；不在正文中译成条件句。
- source_word: exaltation doublet（据源文语境及审校层）
  choice: 高举自己，抬高自己
  rationale: 保留原文近义并列所呈现的傲慢强化效果，避免仅译作一个笼统的“自大”。
theological_decisions:
- issue: 西拿基立的“高举”是他人的尊崇，还是自我抬高
  choice: 高举自己，抬高自己
  alternative: 他将被高举、被抬高
  rationale: 上下文描述其因预期攻破锡安而骄傲；用反身表达能自然传达这一语境，同时保留两个对应动作，不暗示上帝认可或真正尊荣他。
- issue: 毁灭锡安是时间关系还是条件关系
  choice: 他毁灭锡安时
  alternative: 如果他毁灭锡安
  rationale: 叙利亚文连接结构较支持时间义，表现西拿基立自以为必能得胜的口吻；脚注保留条件译法，以反映传统译读。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“已经准备好要毁灭我们”传达迫在眉睫的威胁；“高举自己，抬高自己”保留原文修辞性重复，并明确其傲慢含义。未把上一节结尾的“他说”重复纳入本节。
