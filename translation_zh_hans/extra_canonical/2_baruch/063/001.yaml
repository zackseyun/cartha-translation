  yaml_path: translation/extra_canonical/2_baruch/063/001.yaml
  text: And the eighth bright waters that you saw—these are the integrity and uprightness of Hezekiah king of Judah, and the gracious favor that came upon him.
translation:
  language: zh_hans
  text: 你所看见的第八段明亮的水，就是犹大王希西家的纯正和正直，以及临到他的恩宠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܘܗܪ̈ܐ
  choice: 明亮之水
  rationale: 保留异象中的水之意象，并以“明亮”与上下文中相对的黑暗之水形成清楚对照，不扩释为抽象的“光明时期”。
- source_word: ܬܪܝܨܘܬܐ / ܬܩܢܘܬܐ（据校勘支持的词义）
  choice: 纯正和正直
  rationale: 以两个自然且庄重的现代汉语伦理用语，保留原文并列词所形成的双重强调。
- source_word: ܛܝܒܘܬܐ
  choice: 恩宠
  rationale: 表达临到希西家的善意与眷顾，同时避免将其缩窄为某一特定教义体系中的专门术语。
theological_decisions:
- issue: 本节对希西家的称许应仅理解为他的品德，还是也包括临到他的恩惠
  choice: 同时保留希西家的纯正、正直，以及临到他的恩宠
  alternative: 只描述希西家的正直，或只泛指上帝抽象的良善
  rationale: 原文所反映的结构区分了希西家的伦理品格与另外临到他的恩惠；译文保留二者，不将其合并。
- issue: 是否在正文中明确补出恩宠来自上帝
  choice: 不补出施恩者，仅译作“临到他的恩宠”
  alternative: 译作“上帝赐给他的恩宠”
  rationale: 语境可使读者理解其神圣来源，但本节措辞本身未必明说施恩者；不补主语可保留原文的表达幅度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“第八股”使不可数的水意象在汉语中自然可数，同时保留异象连续分段的感觉；“犹大王希西家”按现代汉语常用次序表达。
