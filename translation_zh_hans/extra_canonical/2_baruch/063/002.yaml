  yaml_path: translation/extra_canonical/2_baruch/063/002.yaml
  text: For when Sennacherib was stirred up for destruction, and his wrath was inflamed so as to destroy, together with the multitude of the nations that were with him,
translation:
  language: zh_hans
  text: 因为西拿基立被激起，要施行毁灭；他的烈怒燃烧起来，要同与他在一起的众多民族一道施行毁灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܩܐ
  choice: 西拿基立
  rationale: 本章语境所指为亚述王西拿基立；采用现代中文圣经中通行的人名译法。
- source_word: ܐܬܬܙܝܥܘ
  choice: 受激而起
  rationale: 保留叙利亚文被动／中间语态的意味，不擅自说明是谁或什么激动了他。
- source_word: ܐܒܕܢܐ
  choice: 毁灭
  rationale: 以宽泛而庄重的用语表达灭亡、毁坏之义，不限定为战争中的某一种具体行动。
- source_word: ܣܘܓܐܐ
  choice: 众多
  rationale: 表达数量庞大，修饰与王同行的各民族。
theological_decisions:
- issue: 西拿基立受激而起的施动者
  choice: 不说明施动者
  alternative: 译作“上帝激起西拿基立”或“西拿基立自己勃然兴起”
  rationale: 源文的被动／中间表达并未在本句明确指出施动者；避免额外加入神学因果。
- issue: “毁灭”的对象
  choice: 不补出具体对象
  alternative: 补作“毁灭耶路撒冷”或“毁灭列国”
  rationale: 本节措辞本身没有明说对象，应保留原有的开放性，并让上下文提供指向。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语；保留“受激而起”的被动含混，并以分号呈现王的行动、烈怒与随行民族之间紧密但略有张力的句法关系。
