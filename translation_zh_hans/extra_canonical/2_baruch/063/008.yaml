base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/063/008.yaml
  text: And at that time I burned their bodies from within, but I preserved their garments and their weapons outwardly, so that the still greater wonders of the Mighty One might be seen, and that his name might be spoken throughout the whole earth.
translation:
  language: zh_hans
  text: 那时，我从里面焚烧了他们的身体，却保全了他们外面的衣服和兵器，好让人看见大能者所行的更大奇事，也使他的名传遍全地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܓܪܐ（语境所指）
  choice: 身体
  rationale: 采用自然、庄重的现代汉语，准确指向被焚烧的肉身，与衣服和兵器形成对照。
- source_word: ܠܒܪ（语境所指）
  choice: 外面的
  rationale: 保留“里面／外面”的空间对照；这里修饰衣服和兵器，表达它们在外部仍获保全。
- source_word: ܚܝܠܬܢܐ（对应称号）
  choice: 大能者
  rationale: 将神圣称号译作“大能者”，既保留称号性质，又不把原文扩展为更具体的神学表述。
- source_word: ܬܕܡܪ̈ܬܐ（对应概念）
  choice: 奇事
  rationale: “奇事”兼具神奇作为与令人惊叹之意，符合经文体裁，也避免仅译成视觉性的“神迹”。
theological_decisions:
- issue: “大能者”及后续“他的名”的指代
  choice: 保留“大能者”这一称号，并用“他的名”承接
  alternative: 直接译成“上帝……上帝的名”
  rationale: 原文的称号和代词具有修辞作用；保留它们可避免擅自把称号改写成专名，同时上下文仍足以表明神圣指向。
- issue: 焚烧与保全的主体
  choice: 保留第一人称“我”
  alternative: 改写为“上帝焚烧……并保全……”
  rationale: 第一人称是叙述中的真实声音，不应因神学推断而更换行动主体。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。以“从里面／外面的”保留身体被焚与衣物、兵器获保全之间的鲜明对照；句法顺畅，但不消解行动主体及神圣称号的原有张力。
