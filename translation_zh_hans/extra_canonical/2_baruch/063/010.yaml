  text: And all those who were in the holy land rejoiced, and the name of the Mighty One was glorified, so that it was spoken of.
translation:
  language: zh_hans
  text: 圣地里所有的人都欢喜；大能者的名被尊崇，以致为人所谈论。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为人所谈论”也可译作“被人传扬”或“被人说起”。
    reason: 末句为被动表达，可指这名成为人谈论或宣扬的对象；正文采用较中性的译法，不额外强化其为公开宣讲。
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ（据本节传统所保存的叙利亚语措辞）
  choice: 圣地
  rationale: 保留地点的神圣属性，不扩展为特定政治或地理名称。
- source_word: ܚܝܠܬܢܐ（据本节传统所保存的叙利亚语措辞）
  choice: 大能者
  rationale: 这是《巴录二书》对上帝的称号；采用名词性称谓，避免弱化成单纯的形容词“全能的”。
- source_word: ܐܫܬܒܚ（据本节传统所保存的叙利亚语措辞）
  choice: 得了荣耀
  rationale: 表达被动的尊崇和颂扬，符合上下文中上帝之名受荣耀的含义。
- source_word: ܐܬܡܠܠ（据本节传统所保存的叙利亚语措辞）
  choice: 被人传扬
  rationale: 保留被动语态，并用自然汉语表达“成为人们谈论、宣扬的对象”。
theological_decisions:
- issue: “大能者”所指对象
  choice: 保留“大能者”这一神圣称号
  alternative: 直接译作“上帝”或“全能者”
  rationale: 原文称号本身具有文学和神学功能；不将其解释性替换为普通神名，也不把它强化为可能对应另一专门称号的“全能者”。
- issue: 末句被传讲的对象
  choice: 按最近的主语理解为“大能者的名”被人传扬
  alternative: 泛指“大能者”或此前发生的事被人谈论
  rationale: 语法和语境最自然地承接“名”，但正文仍用被动表达，未额外说明传扬的内容或方式。
translation_notes:
  register: 采用庄重而通顺的现代汉语；分号呈现欢喜与神名受荣耀之间的并列推进。源材料为章节页桶且本节行文未清楚显现在所给摘录中，因此以可核对的本节传统措辞及经审校的英文咨询层谨慎定稿，不补入原文没有明说的对象或因果关系。
