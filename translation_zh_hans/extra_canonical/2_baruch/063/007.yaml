  text: And he went out and destroyed their multitude; the number of the chiefs alone was one hundred and eighty-five thousand, and each one of them had the like number.
translation:
  language: zh_hans
  text: 他[a]便出去，消灭了他们的众多军兵；单是首领就有十八万五千人，每一位首领各自也有同样数目的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我便出去，消灭了……”。
    reason: 保留英文POB审校记录中的第一人称替代译法；正文依据叙利亚文第三人称阳性单数采用“他”。
lexical_decisions:
- source_word: ܢܦܩ
  choice: 出去
  rationale: 按叙事语境译作“出去”，保留行动的简洁表达。
- source_word: ܐܘܒܕ
  choice: 消灭
  rationale: 该词在军事语境中表示毁灭、除灭；“消灭”自然且不弱化原文力度。
- source_word: ܣܘܓܐܐ
  choice: 大军
  rationale: 原义为“众多、群众”；此处指敌方庞大群体，译为“大军”符合上下文。
- source_word: ܪ̈ܝܫܢܐ
  choice: 首领
  rationale: 保留领袖、统领之意，不具体化为未经文本明确限定的军衔。
theological_decisions:
- issue: 行动者的人称
  choice: 他便出去
  alternative: 我便出去
  rationale: 现有叙利亚文动词形态及上下文支持第三人称阳性单数，所指为奉差遣施行毁灭者；不采用第一人称旧译。
- issue: “同样数目”的归属
  choice: 每个首领手下也有同样数目的人
  alternative: 他们每个人也有同样的数目
  rationale: 补出“手下……的人”使现代汉语可懂，同时保留原句数字关系所带来的异常张力，不擅自改小或重新解释数目。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。“十八万五千”按原有数字直译；分号体现毁灭大军与随后人数说明之间的关系。
