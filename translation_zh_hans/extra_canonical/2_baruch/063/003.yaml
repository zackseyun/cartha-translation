  yaml_path: translation/extra_canonical/2_baruch/063/003.yaml
  text: and when Hezekiah the king heard what the king of Assyria was devising—to come, seize him, destroy his people, the two and a half tribes that remained, and even overthrow Zion—then Hezekiah trusted in his works, hoped in his righteousness, and spoke with the Mighty One.
translation:
  language: zh_hans
  text: 希西家王听说亚述王正在图谋前来擒拿他，毁灭他的百姓，就是余下的两个半支派，甚至倾覆锡安；于是，他信赖自己的作为，寄望于自己的义，并与大能者交谈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܩܐ ܡ̇ܠܟܐ
  choice: 希西家王
  rationale: 按本节叙事语境及英语审校层识别为希西家王；叙利亚文抄本此处的人名拼写有传抄或辨读困难。
- source_word: ܡ̇ܠܟܐ ܕܐܬܘܪ
  choice: 亚述王
  rationale: 直译王号，符合列王时期历史语境。
- source_word: ܬܪ̈ܝܗܘܢ ... ܦܠܓܘܬܐ
  choice: 两个半支派
  rationale: 保留源文所指的数量和支派概念，不扩展解释其具体组成。
- source_word: ܣܒܪ
  choice: 寄望于
  rationale: 表达把盼望或信心置于某对象之上，同时与前面的“信赖”有所区分。
- source_word: ܙܕܝܩܘܬܗ
  choice: 自己的义
  rationale: 保留“义/正直”的神学语义及其可能形成的张力，不改写为较弱的“善行”。
- source_word: ܚܝܠܘܗܝ ܕܐܠܗܐ
  choice: 大能者
  rationale: 按《巴录二书》常见神称处理，既体现神的能力，也避免增添源文没有的专名解释。
theological_decisions:
- issue: 希西家所信赖的对象
  choice: “信赖自己的作为，寄望于自己的义”
  alternative: “因自己的作为和正直而有信心”
  rationale: 保留源文将“作为”和“义”明确作为信赖、盼望对象的张力，不替作者判断这是赞许还是批评。
- issue: 与神交流的表述
  choice: “与大能者交谈”
  alternative: “向大能者祷告”
  rationale: 源文及审校层采用较宽泛的“说话/交谈”，不把它无依据地限定为正式祷告。
- issue: 锡安遭遇的强度
  choice: “倾覆锡安”
  alternative: “攻打锡安”
  rationale: 采用更强的毁坏性动词，以保留亚述王图谋的严重程度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“前来擒拿他，毁灭他的百姓……”以并列结构呈现谋划内容；分号划分威胁与希西家回应。未添加脚注，因为本节虽有底本文字辨读困难，正文可依据叙利亚文语境和审校层稳定呈现。
