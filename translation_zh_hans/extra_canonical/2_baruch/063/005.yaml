  yaml_path: translation/extra_canonical/2_baruch/063/005.yaml
  text: And the Mighty One heard him, because Hezekiah was wise, and he regarded his prayer, because he was righteous.
translation:
  language: zh_hans
  text: 大能者垂听了他，因为希西家有智慧；他也垂顾希西家的祷告，因为希西家是义人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܘܗܝ / Mighty One（本段所指的神）
  choice: 大能者
  rationale: 保留本书对神的称谓及其能力意涵，不以“神”笼统替代。
- source_word: ܚܟܝܡܐ（wise）
  choice: 有智慧
  rationale: 自然表达希西家所具备的智慧，也避免把词义缩窄为机敏或聪明。
- source_word: ܒܥܘܬܗ（his prayer/supplication）
  choice: 希西家的祷告
  rationale: 用现代宗教语境中通行的“祷告”；重复姓名以消除汉语连续代词可能造成的指代含混。
- source_word: ܙܕܝܩܐ（righteous）
  choice: 义人
  rationale: 保留该词的道德与神学分量，不弱化为一般性的“好人”或仅指行为“正直”。
theological_decisions:
- issue: 神垂听并垂顾祷告与希西家智慧、公义之间的因果关系
  choice: 保留两个“因为”
  alternative: 改写为较弱的伴随关系，如“希西家既有智慧又为人正直”
  rationale: 原文明确陈述理由；译文不消解祷告蒙顾念与希西家品格之间的张力，也不进一步建构功德论解释。
- issue: “义”的身份性表达
  choice: “希西家是义人”
  alternative: “希西家为人正直”
  rationale: “义人”较完整地承载原词在犹太宗教语境中的法理、道德及盟约色彩，同时不额外规定其具体神学机制。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“垂听”“垂顾”保持经文语体，但仍为普通读者熟悉；通过重现“希西家”使两个第三人称指代清楚。
