  verdict: revise
  source_fidelity: “自己人”把英文审校轨迹中刻意未明说的“their own”具体化为“同一群体的人”，无来源依据，因而改变了原文的歧义。应以“因自身而”保留其指向未明的表达。其余部分忠实保留了“至高者”“预先预备”“显露”以及先“来”后“争战”的动作次序。
  naturalness: “有些人将因自身而灭亡”在现代汉语中庄重、通顺，并避免“被自己人毁灭”所带来的不必要施事者推定。“至高者要使……显露出来”自然且适合启示文学语境。
  terminology: “至高者”“民族”“统治者”“争战”均恰当。“显露出来”正确反映 ܓܠܐ 的揭示义；不宜将已被审校否定的“激起”作为正文等值异译，也不宜把省略原文“来”的译法列作脚注。
  issues:
