  yaml_path: translation/extra_canonical/2_baruch/070/007.yaml
  text: and some will be undone by their own. Then the Most High will reveal the peoples whom he prepared beforehand, and they will come and wage war against the rulers who remain at that time.
translation:
  language: zh_hans
  text: 有些人将因自身而灭亡。随后，至高者要使他预先预备的那些民族显露出来；他们必来与那时余下的统治者争战。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܓܠܐ（据语境补足的动词；词根 ܓܠܐ）
  choice: 使……显露出来
  rationale: 该词根的基本义是“揭开、显露、启示”。这里宾语是被预先预备的民族，用使动式汉语既自然，也保留末世情境中原先隐藏、届时出现的意味。
- source_word: ܥܡܡ̈ܐ
  choice: 民族
  rationale: 复数名词可指列国、各族或外邦民族；此处强调参与争战的群体，译作“民族”比抽象的“人民”更贴切，同时不预设其具体族属。
- source_word: ܡܪܝܡܢܐ
  choice: 至高者
  rationale: 保留该称号的尊严和超越意味，不擅自用具体神名称替。
- source_word: “来”与“争战”的连续动词（后续正文据章节控制文本及审校层）
  choice: 必来与……争战
  rationale: 保留原文先“来”、继而“争战”的动作次序，不省略前一动词。
- source_word: ܫܠܝܛ̈ܢܐ（后续正文据章节控制文本及审校层）
  choice: 统治者
  rationale: 采用涵盖政治或军事掌权者的中性表达，不缩窄为某一种官职。
theological_decisions:
- issue: 至高者使预备好的民族显露
  choice: 保留“预先预备”与“显露出来”两个概念
  alternative: 译成“激起那些民族”
  rationale: “显露”更直接对应 ܓܠܐ 的词义，也保留这些民族先被预备、后在特定时刻出现的启示文学张力；脚注列出传统替代译法。
- issue: 发动争战者的行动次序
  choice: “他们必来与……争战”
  alternative: “他们必与……争战”
  rationale: 正文保留来源所见的连续动作；脚注说明可省略“来”的较简译法，不赋予额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“自己人”自然表达内部群体；“至高者”“争战”保留启示文学的肃穆色彩。正文中的 [a]、[b] 与脚注逐一对应。
