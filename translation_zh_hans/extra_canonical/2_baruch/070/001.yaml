  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ ܐܚܪ̈ܝܐ
  choice: 最后黑水
  rationale: 保留启示文学中反复出现的“黑水”意象，并以“最后”表达这一组水在异象序列中的终末位置，不将其泛化为普通灾难。
- source_word: ܦܘܫܩܐ
  choice: 所代表的解释
  rationale: 这里指对异象象征意义的解说；加入“所代表的”使现代汉语自然，同时保留“解释”的基本含义。
- source_word: ܦܬܓܡܐ
  choice: 这话
  rationale: 以简洁庄重的表达引出下文，既可指接下来的言辞，也不把它限定为某种特定形式的神谕。
theological_decisions:
- issue: 最后黑水与前面黑水的关系
  choice: 译作“那接续黑水而来的最后黑水”
  alternative: 译作“黑水之后的末后灾难”
  rationale: 原文以水的颜色和次序维持异象象征；不提前把“黑水”解释为灾难，以免消除象征的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“所以”承接前文，“你要听”保留直接命令的语气；句末用冒号明确引出随后展开的解释。
