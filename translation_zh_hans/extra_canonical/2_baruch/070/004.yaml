base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/004.yaml
  text: Many will be delivered into the hands of the few. Those who were nothing will rule over the strong, the poor will have more than the rich, and the impious will exalt themselves over the brave.
translation:
  language: zh_hans
  text: 许多人将被交在少数人手中；那些原本算不得什么的人[a]将统治强者，穷人将比富人拥有更多，不敬虔的人将抬高自己，凌驾于勇士之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“那些原本什么也不是的人”。
    reason: 说明原文刻意而强烈的身份卑微表达，同时正文采用较自然、庄重的现代汉语。
lexical_decisions:
- source_word: ܣ̈ܓܝܐܐ / ܒܙܒܘܪ̈ܐ
  choice: 许多人／少数人
  rationale: 按该节传承文本所表达的数量对比处理，保留“多数落入少数手中”的倒置景象；“交在……手中”也保留闪语常见的受制含义。
- source_word: ܕܠܐ ... ܡܕܡ
  choice: 那些原本算不得什么的人
  rationale: 贴近字面“不是任何东西／算不得什么”，又避免“无名小卒”等过于口语化或带贬称色彩的表达。
- source_word: ܫܪܝܪܐ
  choice: 强者
  rationale: 在此对举关系中指有力量、有权势者；译作“强者”简洁并符合末世性社会秩序颠倒的语境。
- source_word: ܡܣܒܪܝܢ
  choice: 穷人
  rationale: 依据本节平行对比“穷人—富人”呈现其社会经济含义，采用现代读者直接可懂的称谓。
- source_word: ܓܒܪ̈ܐ
  choice: 勇士
  rationale: 此处不只泛指“男人”，而与自我高抬者形成地位和勇力上的对照；“勇士”保留庄严语体。
theological_decisions:
- issue: 社会秩序颠倒是预言陈述还是道德认可
  choice: 保持为将要发生之事的预言性陈述
  alternative: 译成上帝认可或命令这些人掌权、富足、自高
  rationale: 原文列举灾变时期的反常景象，并未在本节明说这是道德上的肯定或神圣命令，因此不额外加入因果或神学评断。
- issue: “不敬虔的人”的宗教与道德色彩
  choice: 译作“不敬虔的人”
  alternative: “恶人”或“无神论者”
  rationale: “不敬虔”保留对神缺乏敬畏的宗教伦理含义；“恶人”过度泛化，“无神论者”则引入现代思想类别。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以分号串联四幅秩序颠倒的平行景象。保留“将……”的预言语气，不补入原文未明说的施事者或神学解释。
