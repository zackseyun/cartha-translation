  text: And whoever escapes from the war will die in the earthquake, and whoever escapes from the earthquake will be burned by fire, and whoever escapes from the fire will perish by famine.
translation:
  language: zh_hans
  text: 凡从战争中逃脱的，必死于地震；凡从地震中逃脱的，必被火焚烧；凡从火中逃脱的，必因饥荒而灭亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “逃脱／逃生”（本节反复出现的叙利亚语动词）
  choice: 逃脱
  rationale: 保留三个分句中层层递进的重复结构，并表达从灾祸中幸免的含义。
- source_word: “战争”
  choice: 战争
  rationale: 采用现代汉语中直接、庄重且范围适当的对应词，不把它缩窄为某一场具体战役。
- source_word: “地震”
  choice: 地震
  rationale: 准确表达灾变类型，并与战争、火和饥荒构成连续灾祸。
- source_word: “火”
  choice: 火
  rationale: 保留原文具体意象；译作“被火焚烧”符合现代汉语表达。
- source_word: “饥荒”
  choice: 饥荒
  rationale: 表达普遍而严重的食物匮乏，比单纯的“饥饿”更符合灾难语境。
theological_decisions:
- issue: 连续灾祸与无人幸免的审判图景
  choice: 保留三个平行条件句及“必”的确定语气
  alternative: 将其意译为“即使躲过一种灾难，也会遭遇另一种”
  rationale: 平行结构本身承载末世灾祸不断递进的修辞力量；不额外说明这些灾祸是象征还是字面事件。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“凡……的，必……”重复三次，以再现原文的平行和递进节奏。所提供的叙利亚文页面片段似乎涵盖章节相邻内容，未清楚呈现本节完整词序，因此正文措辞谨慎参照已审校的英文咨询层，不据此添加脚注或文本异读。
