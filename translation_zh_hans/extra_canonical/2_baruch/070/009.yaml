  yaml_path: translation/extra_canonical/2_baruch/070/009.yaml
  text: And it will happen that anyone who escapes and is delivered from all these aforementioned things—both those who conquered and those who were conquered—will be delivered into the hands of my servant, the Messiah.
translation:
  language: zh_hans
  text: 事情必将如此：凡从上述这一切事情中逃脱、获救的人[a]——无论是征服者还是被征服者——都必被交在我的仆人弥赛亚手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡从这一切事情中逃脱、获救的人。”
    reason: 原文带有指向先前所述事件的限定语；此译法省略“上述”，作较简略处理。
lexical_decisions:
- source_word: ܢܫܬܘܙܒܘܢ
  choice: 逃脱并获救
  rationale: 该动词表达脱险、得救之意；结合句中灾难背景，用“逃脱并获救”自然传达其语义。
- source_word: ܡܕܐ ܕܗ̈ܘܝ ܘܐܝܠܝܢ ܕܡܩܕ̈ܡܢ ܐܡܝܪ̈ܢ
  choice: 上述这一切事情
  rationale: 保留指向前文所说诸事的关系限定，避免漏译“先前所说的／上述”。
- source_word: ܡܫܝܚܐ
  choice: 弥赛亚
  rationale: 采用现代中文中通行且能保留犹太末世语境的音译，而不提前将其解释为特定身份称谓。
- source_word: ܒܐܝܕ̈ܝܐ
  choice: 交在……手中
  rationale: 保留闪语中表示被置于某人权下或控制之下的惯用表达及其力度。
theological_decisions:
- issue: “我的仆人”与“弥赛亚”的关系
  choice: 我的仆人弥赛亚
  alternative: 弥赛亚，我的仆人
  rationale: 将“仆人”作为弥赛亚的限定语，保留原句中二者的紧密关系，又不加入超出文本的基督论解释。
- issue: 征服者与被征服者是否均受弥赛亚处置
  choice: 无论是征服者还是被征服者，都必被交在……手中
  alternative: 征服者和被征服者都将获救，并被交在……手中
  rationale: 明确两类人都属于被交付者，同时避免把“获救”解释为终极救恩；此处首先指从前述灾难中幸存。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“事情将是这样”承接预言叙述；破折号保留插入说明的层次。“交在……手中”有意保留原文关于权柄与处置的形象表达。
