base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/006.yaml
  text: When those things that were foretold have come to pass, confusion will fall upon all people. Some will fall in war, some will perish in tribulations, and some will be destroyed by their own.
translation:
  language: zh_hans
  text: 先前所预言的那些事发生以后，混乱必临到所有人：有些人会在战争中倒下，有些人会在患难[a]中丧命，还有些人会被自己人[b]毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“苦难”或“困厄”。
    reason: 该灾难词可涵盖痛苦、压迫和困境，不宜限定为单一类型。
  - marker: b
    text: 原文只表明是“他们自己的人”或“自己一方的人”，并未说明具体指亲属、同胞还是同一阵营的人。
    reason: 保留施害者身份的真实含混性，避免加入原文没有的具体关系。
lexical_decisions:
- source_word: ܐܬܝܢ
  choice: 发生
  rationale: 该词在这里表示所说之事来到、实现；译作“发生”最符合现代汉语叙事习惯。
- source_word: ܐܢܫܝܢ
  choice: 有些人
  rationale: 保留原文对不同人群的逐项列举，不把它泛化为抽象类别。
- source_word: ܓܒܪ̈ܐ
  choice: 人
  rationale: 按上下文作普通的人称表达，不额外强调性别。
theological_decisions:
- issue: 末句毁灭行为的施行者
  choice: 被自己人毁灭
  alternative: 自取灭亡
  rationale: “他们自己的人”指向与受害者有归属关系的一群人；译成“自取灭亡”会把外在施害改成自身责任，消除原文保留的关系性与含混性。
- issue: 预言实现与混乱临到的时间关系
  choice: 发生以后，混乱必临到
  alternative: 当……发生时，混乱就临到
  rationale: 使用宽泛的时间衔接，不把两者之间的先后间隔说得过于精确，同时保持预言实现后灾乱来临的基本结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以冒号呈现原文连续列举的三类结局；使用“倒下、丧命、毁灭”保留动作层次，并避免宗派化或解释性扩写。
