base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/005.yaml
  text: The wise will be silent and the foolish will speak. Then the thought of men will not be fulfilled, nor the counsel of the strong, nor the hope of those who hope.
translation:
  language: zh_hans
  text: 智慧人必沉默，愚昧人却要发言。那时，世人的谋算不能实现，世间的谋议不能成就，盼望者的盼望也必落空。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܟܠܐ
  choice: 愚昧人
  rationale: 该词表示愚昧、缺乏判断的人；用“愚昧人”既贴近原义，也与“智慧人”形成自然对照。
- source_word: ܡܚܫܒܬܐ ܕܒܢܝ ܐܢܫܐ
  choice: 世人的谋算
  rationale: 字面为“人子们／人类的思想、谋划”；语境强调计划无法实现，因此译作“世人的谋算”。
- source_word: ܬܪܥܝܬܐ
  choice: 计策
  rationale: 可指意念、筹划或谋议；在与“谋算”并列的语境中，“计策”简洁而自然。
- source_word: ܫܒܪ̈ܘܗܝ ܕܐܝܠܝܢ ܕܡܣܒܪܝܢ
  choice: 怀有盼望之人的希望
  rationale: 保留原文“盼望／希望”的同词根重复，不把其对象或神学性质具体化。
theological_decisions:
- issue: “盼望”是否特指对上帝的信靠
  choice: 保留为未限定的“希望”
  alternative: 译为“信靠上帝之人的盼望”
  rationale: 本节没有明说盼望的对象；为保留原文张力，不补入神学限定。
- issue: 各项计划失败的施事者
  choice: 采用“不能实现／不能成就／必落空”的非施事表达
  alternative: 补译为“上帝必使……失败”
  rationale: 原文聚焦结果，未在本句明确指出施事者，因此不作增补。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以“必……却……”呈现智慧人与愚昧人的鲜明对照，并用三个平行分句保持末句的节奏和递进。
