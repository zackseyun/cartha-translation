  text: They will hate one another and provoke one another to fight; the base will rule over the honorable, and the ignoble will be exalted over the illustrious.
translation:
  language: zh_hans
  text: 他们要彼此憎恨，彼此挑衅，以致争斗起来；卑贱的人要辖制尊贵的人，低微的人要被抬举，凌驾于显赫的人之上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “彼此仇恨”所对应的叙利亚语表述
  choice: 彼此仇恨
  rationale: 保留相互敌视的直接力度，并用自然的现代汉语表达彼此之间的行动。
- source_word: “彼此挑动争斗”所对应的叙利亚语表述
  choice: 彼此挑起争斗
  rationale: 译出相互煽动、导致冲突的动态含义，不把它缩窄为某一种具体战斗形式。
- source_word: “卑贱者／低微者”所对应的叙利亚语名词
  choice: 卑贱的人
  rationale: 与“尊贵的人”形成社会地位与声望上的鲜明对照，同时避免额外加入特定阶级身份。
- source_word: “辖制”所对应的叙利亚语动词
  choice: 辖制
  rationale: 表达掌权和支配，不弱化为一般的影响或胜过。
- source_word: “无名／不显要者”所对应的叙利亚语名词
  choice: 无名之辈
  rationale: 与“显赫的人”构成平行反差，并区别于前一组“卑贱／尊贵”的措辞。
- source_word: “被高举在……之上”所对应的叙利亚语表述
  choice: 被抬举，凌驾于……之上
  rationale: 兼顾地位被提升和最终居于他人之上的双重意象，使汉语句意完整清楚。
theological_decisions:
- issue: 末世乱象中社会秩序颠倒的性质
  choice: 按预告性的陈述翻译，不说明这是神的认可、命令或直接作为
  alternative: 译成神主动使卑贱者掌权、使无名者升高
  rationale: 原句着重描写将要发生的秩序颠倒；不额外判定其神学因果，可保留文本本身的张力。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语；两组平行对比均予保留：“卑贱／尊贵”与“无名／显赫”。所给叙利亚文页面摘录似未清楚呈现本节完整措辞，因此定稿谨慎参考经审核的英文咨询层，不据此补入专名或额外解释。
