base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/002.yaml
  text: Behold, days are coming when the time of the world has ripened and the harvest of the seed of the evil and the good has come. Then the Mighty One will bring confusion of spirit and consternation of heart upon the earth, its inhabitants, and its rulers.
translation:
  language: zh_hans
  text: 看哪，日子将到：世界的时期已经成熟，恶人和善人的种子[a]也已到收割之时。那时，大能者必使灵里的混乱和心中的惊惶临到大地、地上的居民和统治者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“种子”为单数，可作集合性用法；“恶人”和“善人”为复数实体词，修饰“种子”，并非指种子本身有善恶之分。
    reason: 说明叙利亚文属格结构与单数“种子”的用法，避免误读为“邪恶和良善的种子”，同时不把隐喻性“种子”限定为“后裔”。
lexical_decisions:
- source_word: ܙܒܢܗ ܕܥܠܡܐ
  choice: 世界的时限
  rationale: 保留“世界／世代之时间”的末世性含义；“时限”比单纯的“时间”更自然地表达一个阶段达到成熟点。
- source_word: ܙܪܥܐ ܕܒܝܫ̈ܐ ܘܕܛܒ̈ܐ
  choice: 恶人和善人的种子
  rationale: “恶／善”在叙利亚文中是复数实体词，指恶人和善人，并以属格修饰单数集合名词“种子”；不译成种子本身具有善恶性质。
- source_word: ܚܨܕܐ
  choice: 收割的时候
  rationale: 将“收割／庄稼”意象自然地接续“种子”，表达收成已经来到。
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 保留作为上帝称号的庄严表达，不额外加入原文没有的专名。
- source_word: ܫܓܘܫܝܐ ܕܪܘܚܐ … ܬܘܗܝܐ ܕܠܒܐ
  choice: 灵里混乱、心中惊惶
  rationale: 分别保留“灵”与“心”的对应及两种不同的内在失序，不将二者合并为一般性的恐慌。
theological_decisions:
- issue: “恶与善”修饰谁
  choice: 理解为“恶人和善人的种子”
  alternative: “邪恶和良善的种子”或“恶种与善种”
  rationale: 复数实体化形态指向两类人，而非种子的道德属性；这样也保留审判同时临到恶人和善人之“后裔／种子”的张力。
- issue: “大能者”的身份
  choice: 保留称号“大能者”
  alternative: 直接译作“上帝”
  rationale: 上下文显然具有神学指向，但原文使用称号；保留称号可避免把解释写进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留启示性宣告语气；分号划分时机宣告与随后发生的行动。正文中的“灵里混乱、心中惊惶”保持平行结构，并尽量避免过度书面化。
