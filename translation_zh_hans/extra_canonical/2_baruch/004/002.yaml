  text: Or do you think that this is the city of which I said, 'On my hands I have engraved you'?
translation:
  language: zh_hans
  text: 难道你以为，这就是我所说的那座城：“我已把你铭刻在我的手掌上”[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 参《以赛亚书》49:16。引文中的“你”指拟人化的城。
    reason: 标明经文典故，并帮助读者理解第二人称代词的所指。
lexical_decisions:
- source_word: ܡܕܝܢܬܐ
  choice: 那座城
  rationale: 该词意为“城、城市”；配合指示语和后接引语，译作“那座城”自然且准确。
- source_word: ܒܝܕ̈ܝ / ܥܠ ܦܣ̈ܬܐ ܕܐܝ̈ܕܝ（引文传统）
  choice: 在我的手掌上
  rationale: 此处引用《以赛亚书》49:16的意象；“手掌”比笼统的“手”更贴近该引文传统，也保留铭刻于掌上的具体画面。
- source_word: ܓܠܦ / 引文中的‘铭刻’用语
  choice: 铭刻
  rationale: “铭刻”兼具刻写和永久存记的意味，适合庄重语体，并准确传达原有意象。
theological_decisions:
- issue: “这座城”所指为何
  choice: 不在本节中补明其为地上的或天上的耶路撒冷
  alternative: 直接译成“地上的耶路撒冷”或“天上的耶路撒冷”
  rationale: 本节以反问提出区分，后文才进一步说明；提前补明会消除叙事刻意保留的张力。
- issue: 引文中的第二人称单数“你”
  choice: 保留“你”，让其指向拟人化的城
  alternative: 改成“这城”或“耶路撒冷”
  rationale: 保留直接称呼可呈现先知性引文中把城人格化的修辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道你以为”保留原句的反问语气；引文使用“铭刻在我的手掌上”，呈现具体且具有经文回声的意象。
