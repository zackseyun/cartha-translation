  text: And after these things I showed it to my servant Abraham by night, between the pieces of the sacrifice.
translation:
  language: zh_hans
  text: 此后，我在夜间、祭牲肉块之间，把它显示给了我的仆人亚伯拉罕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܟܝܢ
  choice: 此后
  rationale: 自然表达时间承接，同时保留“在这些事以后”的基本含义。
- source_word: ܚܘܝܬܗ
  choice: 把它显给了
  rationale: ܚܘܝ 可指使人看见、显示；宾语后缀为阳性单数，承接上文所说的那座预先预备并显出的城。采用“显给”以保留启示语境。
- source_word: ܠܥܒܕܝ ܐܒܪܗܡ
  choice: 我的仆人亚伯拉罕
  rationale: 按原文直译，保留神对亚伯拉罕的称谓。
- source_word: ܒܠܠܝܐ
  choice: 在夜间
  rationale: 对应时间状语“在夜里”。
- source_word: ܒܝܢܬ ܦܓܪ̈ܐ ܕܕܒܚܐ
  choice: 祭牲肉块之间
  rationale: ܦܓܪ̈ܐ 指躯体或尸身，此处结合创世记15章的献祭场景，指被切开的祭牲肉块；“之间”准确保留空间关系。
theological_decisions:
- issue: “它”的所指
  choice: 保留代词“它”
  alternative: 明说“那座城”
  rationale: 叙利亚文使用阳性单数宾语后缀，语境指向上文那座预备的城，但本节本身仍以代词回指；译文不擅自将所指明文化。
- issue: 亚伯拉罕夜间异象与创世记15章的关系
  choice: 译作“在夜间、祭牲肉块之间”
  alternative: 扩译为“在夜间切开的祭牲之间”
  rationale: 原文清楚呼应创世记15章，却未在本节明确说“切开”；正文保留原文措辞，不把互文信息扩写进去。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。语序略作汉语化处理，使“在夜间、祭牲肉块之间”共同修饰“显给”，同时保留原文的启示性语气和回指关系。
