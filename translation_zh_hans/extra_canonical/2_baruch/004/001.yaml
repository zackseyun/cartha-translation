  yaml_path: translation/extra_canonical/2_baruch/004/001.yaml
  text: And the Lord said to me, “This city will be delivered up for a time, and the people will be led away into captivity, but the world will not be forgotten.
translation:
  language: zh_hans
  text: 主对我说：“这城将暂时被交出去，百姓将被掳走，但世界不会被遗忘。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܙܒܢܐ (b-zabnā)
  choice: 暂时
  rationale: 该短语直指一段限定的时间；译为“暂时”自然地表达这城被交出的处境并非终局。
- source_word: ܡܫܬܠܡܐ (meštalmā)
  choice: 被交出去
  rationale: 保留叙利亚语被动式及“交付、交出”的基本意义，不擅自补明交给何人。
- source_word: ܡܬܕܒܪ ܫܒܝܐ (metdabbar šəbyā)
  choice: 被掳走
  rationale: 以现代汉语简洁表达“被带入俘虏状态”，同时保留强制迁徙的含义。
- source_word: ܥܠܡܐ (ʿālmā)
  choice: 世界
  rationale: 此词可指世界或世代；本句不宜用较具解释性的“时代”，故采用范围较宽、符合传统语境的“世界”。
- source_word: ܠܐ ܡܬܬܢܫܐ (lā mettənšē)
  choice: 不会被遗忘
  rationale: 依原文保留被动表达，不补入施事者，也不把“遗忘”解释成“弃绝”。
theological_decisions:
- issue: “世界不会被遗忘”的施事者与范围
  choice: 保留原文的被动句，不明说是谁不会忘记世界，也不限定“世界”仅指以色列或受造界的某一部分。
  alternative: 译为“上帝不会忘记这个世界”或“这个世代不会被弃绝”。
  rationale: 原文没有明示施事者，且ܥܠܡܐ本身具有“世界／世代”的语义张力；直译可避免过早作神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。三个分句保持原文递进：城被交出、百姓被掳、世界却不被遗忘；用“但”凸显末句的转折与盼望。
