revisions:
- from: 后来，我又在西奈山把它指给摩西看；当时，我把帐幕和其中一切器具的样式指示给他。”
  to: 我又在西奈山向摩西显明了它；当时，我把帐幕和其中的一切器具的样式指示给他。”
  rationale: 仅作风格与连接词的微调：以“又”对应重复性连接，以“显明”表达启示性的“使看见／显示”。保留“它”的未明所指，并完整保留帐幕及其全部器具之“样式”的语义，不加入任何神学解释。
