  text: And again I also showed it to Moses on Mount Sinai, when I showed him the pattern of the tabernacle and all its vessels.”
translation:
  language: zh_hans
  text: 我又在西奈山向摩西显明了它；当时，我把帐幕和其中的一切器具的样式指示给他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܘܝܬܗ
  choice: 把它指给……看
  rationale: 该动词表示“使看见、指示、显明”；保留阳性单数宾语所承接的“城”，不把所指在正文中明说。
- source_word: ܡܘܫܐ
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: tabernacle（由审校层保存的本节后半句）
  choice: 帐幕
  rationale: 用普通读者熟悉且能体现礼仪设施性质的传统译名。
- source_word: pattern（由审校层保存的本节后半句）
  choice: 样式
  rationale: 既可指可见的模型，也可指建造的范式；“样式”保留这层语义幅度。
- source_word: vessels（由审校层保存的本节后半句）
  choice: 器具
  rationale: 在帐幕语境中泛指各类礼仪用具，不窄化为容器。
theological_decisions:
- issue: 代词“它”的所指
  choice: 保留“它”
  alternative: 明译为“那座城”或“天上的耶路撒冷”
  rationale: 叙事上承前文所显明的城，但源文使用代词；正文不把隐含所指扩写成明确的神学称谓。
- issue: 帐幕“样式”的性质
  choice: 译作“样式”而不解释
  alternative: 译作“天上的原型”
  rationale: 本句把所显之城与摩西所得的帐幕启示相联，但没有必要在译文中断定柏拉图式原型或特定圣所神学。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“后来”顺承前文亚伯拉罕所见异象；分号清楚区分向摩西显城与指示帐幕样式这两个彼此关联的动作。引文末尾保留闭引号，以符合所给段落的发言结构。
