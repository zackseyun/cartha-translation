base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/004/003.yaml
  text: For it is not that which is by the hands of men; it is that which will be revealed, which was prepared beforehand from the time I resolved to make Paradise, and I showed it to Adam before he sinned.
translation:
  language: zh_hans
  text: 因为，那城不是人手所造的；它乃是那座将要显现的城，早在我定意创造乐园时就已预备好了；我又在亚当犯罪以前把它指给他看。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܕ ܒܢܝܢܫܐ
  choice: 人手所造的
  rationale: 直译“借着人的手”，按现代汉语习惯表达为“人手所造”，并保留与神所预备之城的对照。
- source_word: ܕܡܬܓܠܐ
  choice: 将要显现的
  rationale: 该被动分词在上下文中指未来的揭示或显现；“显现”既自然，也不把方式具体化。
- source_word: ܐܬܟܢ ܡܢܩܕܡ
  choice: 预先把它预备好了
  rationale: 保留原文“预先”与“预备”的语义叠加，以突出这城并非临时形成。
- source_word: ܐܬܚܫܒܬ ܕܐܥܒܕ ܦܪܕܝܣܐ
  choice: 我定意创造乐园
  rationale: ܐܬܚܫܒܬ 表示筹划、定意；ܥܒܕ 在此配合神创造乐园的语境译为“创造”。
- source_word: ܚܘܝܬܗ ܠܐܕܡ
  choice: 把它指给亚当看
  rationale: 保留“使看见、展示”的具体动作，不强化为启示性的专门术语。
theological_decisions:
- issue: 人间之城与将显现之城的关系
  choice: 以“那城……那一座”承接上下文，但不进一步命名或解释其性质
  alternative: 明确译作“天上的耶路撒冷”或“末世圣城”
  rationale: 原文借上下文指向另一座城，却未在本句中给出这些神学名称；避免加入超出文本的认定。
- issue: 这城的预存与预备
  choice: 译为神从定意创造乐园时便已预备
  alternative: 解释为该城与乐园完全同一，或仅为神心中的计划
  rationale: 原文同时谈到预备、乐园和向亚当展示，但没有明说二者完全等同，也没有把展示降格为纯粹观念。
translation_notes:
  register: 采用庄重而清楚的现代书面汉语。“人手所造”保留经典宗教语感但仍通俗；通过分句呈现原文由否定、未来显现、预先预备到向亚当展示的推进。
