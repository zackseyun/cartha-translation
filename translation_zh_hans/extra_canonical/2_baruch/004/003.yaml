    rationale: 原文说这城“早已被预备”，并未在该分句直接使用“我预备了它”。上下文虽使施事者不难推知，译文仍应保留其语法上的含蓄。
  - severity: low
    issue: “那一座”指代不够自然
    rationale: 汉语中可直接以“那座将要显现的城”承接上文，无须使用略显省略的量词性表达及解释性脚注。
