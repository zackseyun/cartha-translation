  text: But when he transgressed the commandment, it was taken away from him, just as Paradise also was.
translation:
  language: zh_hans
  text: 但诫命被违背后，它[a]就从他那里被收回了，乐园也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”承接上文所说向亚当显明之物；原文只用代词，没有在本句中重复说明其所指。
    reason: 说明原文真实存在的代词指向含混，避免读者误以为中文漏译了名词。
lexical_decisions:
- source_word: ܐܫܬܕ ܦܘܩܕܢܐ
  choice: 诫命被违背
  rationale: 按叙利亚文的被动表达翻译，不在正文中额外明说违背者，以保留原文的语法含混；上下文自然指向亚当。
- source_word: ܐܬܢܣܒܬ ܡܢܗ
  choice: 它就从他那里被收回了
  rationale: 保留原文阴性单数代词及被动结构；“收回”比机械的“拿走”更符合神赐之物因违命而不再向亚当显现的语境，同时不具体断定其所指。
- source_word: ܐܝܟ ܕܐܦ ܦܪܕܝܣܐ
  choice: 乐园也是如此
  rationale: 简洁保留比较结构，表明乐园同样从亚当那里被收回。
theological_decisions:
- issue: 被收回之物的所指
  choice: 正文保留代词“它”
  alternative: 明确译作“那座城”或“那异象”
  rationale: 叙利亚文本身使用代词；上下文可能指先前向亚当显明的那座预备之城或相关启示。明确补出名词会消除原文的指代张力。
- issue: 违背诫命者的身份
  choice: 采用“诫命被违背”的被动式
  alternative: 译作“他违背诫命后”
  rationale: 上下文虽清楚关联亚当，原文在此却用被动措辞；保留被动可避免把隐含主语强行写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“诫命被违背”略具经文语体，但准确保留原文被动结构；后半句用“也是如此”避免生硬重复。
