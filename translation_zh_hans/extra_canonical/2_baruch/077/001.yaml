  text: 1 我巴录离开那里，来到百姓中间，把他们从大到小都召集起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܪܘܟ
  choice: 巴录
  rationale: 采用该人物在中文宗教文献中的通行译名。
- source_word: ܥܡܐ
  choice: 百姓
  rationale: 此处指以色列民众；“百姓”自然、庄重，也符合讲话场景。
- source_word: ܡܢ ܪܒܐ ܘܥܕܡܐ ܠܙܥܘܪܐ
  choice: 从大到小
  rationale: 保留原文的两极表达，意指各等人都包括在内，不额外限定为年龄或社会地位。
- source_word: ܟܢܫܬ ܐܢܘܢ
  choice: 把他们……都召集起来
  rationale: 准确表达聚集众人的主动行为，并以“都”自然呼应“从大到小”的全括意义。
