lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ
  choice: 黑水
  rationale: 按叙利亚文异象叙述中的固定意象直译；“水”在此为集合性表达。
- source_word: ܬܫܝ̈ܥܝܐ
  choice: 第九股
  rationale: 序数词修饰异象中的一组水；加量词“股”使现代汉语自然，同时不改变意象。
- source_word: ܕܚܙܝܬ
  choice: 你所看见的
  rationale: 保留第二人称单数及完成性观看动作，与上下文中对异象的回指一致。
theological_decisions:
- issue: 本节与玛拿西恶行详述的文本对齐
  choice: 依叙利亚文当前章节结尾，将本节译为对“第九股黑水”的总结性识别
  alternative: 采用英语修订层的长句：“因为他行了许多不敬虔的事……”
  rationale: 原始叙利亚文在第65章末可辨认为“这些就是你所看见的第九黑水”一类固定总结公式；玛拿西恶行的详述属于此前上下文。遵循原文证据优先，不把疑似错位的英语修订内容移入本节。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“这就是”体现叙利亚文总结辨识公式；不添加原文此节没有的罪行清单。
