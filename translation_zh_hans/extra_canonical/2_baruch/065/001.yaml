  text: And after Manasseh, Amon arose, and in his own time he thought that the Mighty One would not call these things to account.
translation:
  language: zh_hans
  text: 在玛拿西之后，亚们兴起；他在位时，以为大能者不会追究这些事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܒܬܪܗ ܕܝܢ ܡܢܫܐ ܗܘܐ
  choice: 后来，玛拿西兴起
  rationale: 按叙事次序和叙利亚文句法理解为“在他之后，玛拿西兴起”；本章讲述玛拿西，而非亚们。
- source_word: ܐܪܫܥ
  choice: 行事邪恶
  rationale: 该词表示作恶或行事不敬虔；“行事邪恶”在现代汉语中自然，也保留其道德与宗教层面的分量。
- source_word: ܘܡܬܚܫܒ
  choice: 以为
  rationale: 表达玛拿西内心的判断或设想，而不是公开宣告。
- source_word: ܒܙܒܢܗ
  choice: 在他的时代
  rationale: 保留原文的时间范围，并突出玛拿西当政的时期。
- source_word: ܚܝܒܘܬܐ
  choice: 追究
  rationale: 保留司法性的问责含义，又不把语义过窄地限定为“惩罚”。
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 采用尊称式表达，保留原文对上帝的间接称谓，不擅自改成更具体的神名。
theological_decisions:
- issue: 本节人物及叙事主语
  choice: 玛拿西兴起，并行事邪恶
  alternative: 亚们兴起
  rationale: 章节次序、上下文及叙利亚文的可靠复原均指向玛拿西；把人物改成亚们会使第65章与紧接着讲亚们的第66章次序错乱。
- issue: 上帝是否实际不追究
  choice: 明确写成玛拿西主观“以为”大能者不会追究
  alternative: 陈述大能者不会追究
  rationale: 原文将此置于玛拿西的思想之中，并不认可他的判断；译文须保留这种神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“兴起”保留历史叙事语体；“行事邪恶”比“行事不虔”更贴近原词的道德力度；句子分为两句以便普通读者理解。
