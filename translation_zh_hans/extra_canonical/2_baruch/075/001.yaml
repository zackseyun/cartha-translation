  text: And I answered and said, “Who can comprehend your goodness, Lord? For it is beyond comprehension.”
translation:
  language: zh_hans
  text: 我回答说：“主啊，谁能领会你的良善呢？因为这实在无法领会[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为这是不可测透的。”
    reason: “不可测透”更突出无法穷尽、无法彻底把握的含义，是ܡܬܬܚܡܐ的另一种自然译法。
lexical_decisions:
- source_word: ܛܒܬܐ / bonitati tuae
  choice: 你的良善
  rationale: “良善”既能表达神的善这一宽广属性，也不把含义缩窄为单纯的仁慈或慷慨；用“你的”保留原文直接向主说话的祷告语气。
- source_word: ܡܬܬܚܡܐ / incomprehensibilis
  choice: 无法领会
  rationale: 此处强调人的理解不能把握或穷尽神的良善。“无法领会”是自然、庄重的现代汉语，同时保留原词所表达的不可理解、不可测透之意。
theological_decisions:
- issue: 末句“这是”所指的是神的良善，还是更广泛地指神自身及其作为
  choice: 保留“这是”这一概括性指代，不进一步明说所指
  alternative: 因为你的良善是无法领会的
  rationale: 紧邻的先行内容是“你的良善”，但原句的神学意涵也可能延伸到主本身。采用“这是”既符合上下文，又避免把指代范围限定得比原文更窄。
- issue: 是否把不可领会解释为人类理性有限或神完全不可认识
  choice: 只译作“无法领会”
  alternative: 人的理性无法完全认识
  rationale: 原文强调不可把握，却没有在本句中建立一套关于理性或神之可知性的系统论述，因此不加入解释性教义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“我回答说”保留叙事公式；“主啊”体现直接呼告。“良善”较“美善”更符合现代汉语宗教文本的自然用法，又不失正式感。
