  yaml_path: translation/extra_canonical/2_baruch/075/008.yaml
  text: But if we do not now know why we came, and do not recognize what has been, neither shall the immeasurable be seen, nor shall the preeminence of him who established it from the beginning be made known; and not a few living creatures would be astonished.”
translation:
  language: zh_hans
  text: 但我们若如今不知道自己为何而来，也不明白已经发生的事，就既看不见那不可测度的，也无从认识那位从起初将其设立者的超越；并且，会有不少生灵为之惊异。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English consultation: “why we came” (Syriac verse boundary not securely visible in supplied page bucket)'
  choice: 自己为何而来
  rationale: 以自然现代汉语表达目的或缘由上的疑问，不擅自限定为出生、受造或来到某一具体地点。
- source_word: 'English consultation: “what has been”'
  choice: 已经发生的事
  rationale: 保留概括性，不把所指缩窄为历史、创造或先前的启示。
- source_word: 'English consultation: “the immeasurable”'
  choice: 那不可测度的
  rationale: 采用名词化表达，保留原语可能指某一不可测度之实在、范围或奥秘的含混性，不直接补作“上帝”。
- source_word: 'English consultation: “the preeminence”'
  choice: 超越
  rationale: 表达卓绝、居首或超乎万有之意，同时避免加入后期教义术语。
- source_word: 'English consultation: “living creatures”'
  choice: 生灵
  rationale: 比“动物”范围更广，也不武断限定为人类；符合庄重而通俗的文体。
theological_decisions:
- issue: “那不可测度的”是否直接指上帝
  choice: 保留为“那不可测度的”
  alternative: 译为“那不可测度的上帝”
  rationale: 所给章节页桶未能可靠显示第8节的完整叙利亚语行文，而英语审校层也保留了名词化的含混表达；不应擅自补明所指。
- issue: “那位从起初将其设立者”中的“其”指什么
  choice: 保留代词“其”
  alternative: 明确译为“从起初设立万有的那一位”
  rationale: 代词的先行对象并不确定，明确为“万有”会增加原文未必明说的解释。
- issue: 惊异的主体范围
  choice: 译作“不少生灵”
  alternative: 译作“不少人”或“不少受造物”
  rationale: 既保留广泛生命主体的可能，也避免将其神学化为所有受造界。
translation_notes:
  register: 采用现代、庄重、可朗读的书面普通话。鉴于所给叙利亚文是章节页桶且第75章8节的具体边界无法从材料中可靠辨明，本稿以英语POB审校层为辅助，同时明确保留“不可测度的”“其”“生灵”等关键含混处，不作教派化解释。
