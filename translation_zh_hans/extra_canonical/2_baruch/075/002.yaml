translation:
  language: zh_hans
  text: 又有谁能探究你那无穷无尽的怜悯？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܨܐ
  choice: 探究
  rationale: 该动词表达查考、探寻之意；“探究”既保留深入寻索的力度，也符合现代汉语祷告语体。
- source_word: ܪ̈ܚܡܝܟ
  choice: 你的怜悯
  rationale: 闪语中的复数形式常整体指上帝丰富的慈怜；汉语用集合意义的单数“怜悯”更自然，同时不削弱其丰盛之意。
- source_word: ܕܠܐ ܡܣܬܝܟܝܢ
  choice: 无穷无尽
  rationale: 原意为不受界限约束、没有尽头；“无穷无尽”自然传达其无限性。
theological_decisions:
- issue: 上帝的怜悯不可穷尽
  choice: 保留反问句，表明无人能彻底探究其无限的怜悯
  alternative: 直陈“你的怜悯无人能够探究”
  rationale: 原句的反问形式兼具敬拜与认信意味，应予保留，不将其改写成纯命题陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以“又有谁”承接上下文连续的反问，以“你”保持直接祷告的第二人称表达。
