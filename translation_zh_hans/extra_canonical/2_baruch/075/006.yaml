review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了英文审校层所见的条件句、怜悯、"右手之下"及例外结构；但将“called in”译为“被列入”把“被称／蒙召”的表述改为登记或编列，语义略有偏移。目标节在所给叙利亚文页的边界与排印中难以完全复原，故对“卓越数目”的含义应继续保持审慎，不宜将其落实为固定人数或特定群体。
  naturalness: “因为，除非……”的断句不够自然，“达到这些境地”也比原有开放的“these things”更具体。改为“若非……便不能达到这些事”较符合现代汉语，同时保留指代范围。
  terminology: “出于怜悯而怜恤”“在你右手之下”可保留，既庄重又不强加解释。“卓越数目”虽生硬，但作为不透明的数目性表达可暂存；应将“被列入”改为“被召入……中的人”，以较贴近英文审校层的 called in，且不把它等同于某种既定教义的“选民”。
  issues:
  - severity: medium
    issue: “被列入卓越数目的人”弱化并改变了“called in”的称呼／蒙召语义。
    rationale: “列入”主要表示行政性编列；审校层明确保留 called，宜以“被召入”呈现，同时不将其解释成预定或固定名册。
  - severity: low
    issue: “达到这些境地”将开放的指代具体化为“境地”。
    rationale: 原句及英文审校层只说“these things”；译作“这些事”更能保留其所指可能涵盖所述情形、应许或状态的含混性。
  - severity: low
    issue: 脚注中的“上好的数列”不合此处宗教语境下的人群／数目表达。
    rationale: 该说法在现代汉语中易被理解为数学数列，反而造成误导；脚注应只说明“数目”究竟指人数、群体或称号仍不明确。
  revised_text: 因为，若非你出于怜悯怜恤世人，在你右手之下的人便不能达到这些事；只有那些被召入卓越数目中的人[a]例外。
  revised_footnotes:
  - marker: a
    text: “卓越数目”原文所指不很明确；可指某一特别的数目或群体，未必是固定人数。这里保留其含混性，不将之具体解释为某一特定群体。
    reason: 保留原表达中“数目／群体”及“被召入”的不确定性，避免导入固定人数、预定论或其他特定神学解释。
  revision_rationale: 修订使条件句和例外结构在汉语中更顺畅，并将“被列入”改为较贴近 called in 的“被召入”。同时以“这些事”避免将开放指代具体化为“境地”，并删去会误导为数学概念的脚注替代说法。
