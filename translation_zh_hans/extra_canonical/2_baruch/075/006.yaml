  yaml_path: translation/extra_canonical/2_baruch/075/006.yaml
  text: For unless, in compassion, you have mercy on human beings, those who are under your right hand cannot come to these things, except those who are called in the excellent number.
translation:
  language: zh_hans
  text: 因为，除非你出于怜悯而怜恤世人，那些在你右手之下的人就不能达到这些境地；惟有那些被列入卓越数目的人[a]才能达到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卓越数目”原文所指不很明确，也可理解为“优选的一群”或“上好的数列”；这里未将其具体解释为固定人数或某一特定群体。
    reason: 原表达语义生硬且可能有文本传承问题；脚注保存其不确定性，避免正文过度诠释。
lexical_decisions:
- source_word: ܪ̈ܚܡܐ / compassion-context (source text partially obscured at verse boundary)
  choice: 出于怜悯而怜恤
  rationale: 保留英译审校层所反映的“in compassion, have mercy”双重表达，同时用自然的现代汉语呈现其因由与行动。
- source_word: ܬܚܝܬ ܝܡܝܢܟ / under your right hand (as reflected in the audited consultation layer)
  choice: 在你右手之下
  rationale: 保留“右手”这一具有权柄、庇护与归属意味的原始意象，不把它释义为某一种单一神学概念。
- source_word: ܢܡܛܘܢ / come to, reach (as reflected in context)
  choice: 达到
  rationale: “达到这些境地”比字面的“来到这些事”更符合现代汉语，同时不具体断定所指是福分、时代还是终末状态。
- source_word: ܡܢܝܢܐ ܡܝܬܪܐ / excellent number (as reflected in the audited consultation layer)
  choice: 卓越数目
  rationale: 采取较形式对应的译法，以保存原语中含义不完全确定的“数目/群体名额”表达，避免擅自改成“选民”或固定得救人数。
theological_decisions:
- issue: “右手之下”的身份含义
  choice: 直译为“在你右手之下的人”
  alternative: 受你保护的人／属你的人
  rationale: 原有意象可能同时涉及权柄、保护和归属；直译能保留这种神学张力。
- issue: “卓越数目”是否等同预定的选民
  choice: 保留含混措辞，并加注说明
  alternative: 被列在选民数目中的人
  rationale: 文本本身不足以支持特定预定论或固定人数的解释，因此不导入宗派性结论。
- issue: “惟有……才能达到”的逻辑关系
  choice: 将例外分句明确接续前句
  alternative: 只译作“除了那些被称为卓越数目的人”
  rationale: 补出汉语所需的谓语，但不改变例外结构所形成的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“出于怜悯而怜恤”保留原句的重复力度；“这些境地”维持指代开放性；“右手之下”和“卓越数目”保留古代宗教语言的意象与含混性。所给叙利亚文页面在目标节边界处残缺且排版交错，因此以可辨识的源语线索为主，并审慎参考经审校的英文咨询层。
