review_pass:
  verdict: revise
  source_fidelity: 审校层的英文句法包含一个否定条件句和例外分句。草案将“these things”译为“这些境地”，把开放的“事/事物”范围收窄为某种状态；“called in the excellent number”中的蒙召及数目意象也宜更直接保留。由于所给叙利亚文页码材料在本节边界处交错，不能据此安全重建超出英文审校层所见的细节，故保留该表达的歧义。
  naturalness: “出于怜悯而怜恤”虽庄重但略显同义重复；“除非……否则……”可更清楚地表达汉语条件关系。“卓越数目”不够自然，改为“优选的数目”并以脚注说明，可保留其刻意且含混的数目表达。
  terminology: 保留“右手之下”，不将其释义为保护、拣选或归属。“蒙召归入这优选的数目”对应英文审校层的 called in ... number，不把它定为固定人数、预定论意义的选民或某特定群体。
  issues:
  - severity: medium
    issue: “这些境地”将指称范围具体化。
    rationale: 英文审校层为“these things”，并未限定为状态、境地或终末福分；译作“这些事”可保留开放指向。
  - severity: medium
    issue: “被列入卓越数目”弱化了“called”并使“卓越数目”不够自然。
    rationale: “蒙召归入这优选的数目”同时保留蒙召与数目/群体名额的意象，且不把其解释成固定的神学类别。
  revised_text: 因为，除非你怜悯世人，否则那些在你右手之下的人不能达到这些事；只有那些蒙召归入这优选的数目的人才能达到。[a]
  revised_footnotes:
  - marker: a
    text: “优选的数目”原文所指不很明确，也可理解为“卓越的数目”或“优选的一群”。这里不将其具体解释为固定人数或某一特定群体。
    reason: 保留“数目”表达及其可能指向群体的歧义，避免把“蒙召”预设为某一宗派性的拣选或预定论结论。
  revision_rationale: 以“怜悯”取代同义重复的“出于怜悯而怜恤”，使条件句自然清晰；以“这些事”避免将原文开放的指称收窄为“境地”；以“蒙召归入这优选的数目”更完整反映英文审校层所见的蒙召和数目意象，并通过脚注保留文本不确定性。
