  text: 又有谁能领悟你的意念呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܘܟܠܐ
  choice: 意念
  rationale: 该词可表示理解、悟性或心中的构想；本句指向上帝不可测度的思维，译作“意念”比抽象的“理解力”更符合现代汉语表达，同时保留其认知含义。
- source_word: ܡܬܕܪܟܐ
  choice: 能领悟
  rationale: 该动词具有达到、把握、领会之意；“领悟”自然地表达受造者无法在认知上把握上帝的意思。
theological_decisions:
- issue: 上帝的意念是否可被人完全认识
  choice: 用反问句“谁能领悟”保留原文对人类认知限度的强调
  alternative: 译成陈述句“无人能领悟”
  rationale: 反问形式既忠于语气，也不把经文扩展为超出本句范围的系统性断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“又”承接上下文连续的反问；句末“呢”使反问自然，但不削弱庄严感。
