  text: Or who among those born can hope to come to these things, unless it is one to whom you show mercy and are gracious?
translation:
  language: zh_hans
  text: 凡生而为人者，谁能指望达到这些事呢？除非他蒙你怜悯、受你恩待。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝ̈ܠܝܕܐ（据经文对应词义；底本页图转写有错乱）
  choice: 生来的人
  rationale: 保留“出生者／受生者”的普遍范围，同时采用自然的现代汉语表达，不擅自缩限为某一群体。
- source_word: ܢܣܒܪ（据经文对应词义）
  choice: 指望
  rationale: 兼有盼望与期待能够达成之意；在反问句中，“指望”比单纯“希望”更自然。
- source_word: ܢܡܛܐ（据经文对应词义）
  choice: 达到
  rationale: 保留“来到、抵达、达到”的动态意味；“这些事”具体所指仍由上下文决定，不作解释性扩写。
- source_word: 怜悯／施恩所对应的两个叙利亚语表达
  choice: 怜悯他，向他施恩
  rationale: 保留原句并列的两个神圣恩惠概念，避免合并成单一措辞。
theological_decisions:
- issue: 人能否凭自身达到所述之事
  choice: 保留反问及“除非”条件结构
  alternative: 直译成断言，如“只有蒙恩的人才能达到”
  rationale: 反问形式既强调人的有限，也保留原文的修辞张力，不将其改写成更系统化的教义命题。
- issue: 第二人称“你”的身份
  choice: 保留为“你”，不在正文补作“上帝”或“主”
  alternative: 明确译为“除非上帝怜悯他”
  rationale: 尊重原文称呼方式，让身份由上下文显明，避免解释性增译。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“生来的人”略带经文语体，但普通读者易懂；整句保留反问、条件限制及“怜悯／施恩”的平行结构。所给叙利亚文为章节页桶，行序与识别结果明显错乱，因此以原语言可辨语义及经审核的英文咨询层交叉控制，未虚构细节。
