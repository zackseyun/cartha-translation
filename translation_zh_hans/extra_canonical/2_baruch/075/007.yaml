  yaml_path: translation/extra_canonical/2_baruch/075/007.yaml
  text: But we who live—if we know why we came, and submit ourselves to him who brought us out from Egypt—we shall come again, and we shall remember what has passed, and rejoice over what was.
translation:
  language: zh_hans
  text: 但我们这些活着的人[a]，如果知道自己为何而来，并且顺服[b]那位领我们出埃及的[c]，就必再次回来；我们必记起过去的事，也必因从前的一切而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们这些留下来的人”。
    reason: 保存早期译法所反映的理解，但正文依叙利亚语“活着”取更直接的词义。
  - marker: b
    text: 或译“已经使自己顺服”。
    reason: 该形式可被处理为完成意味，但在这里与“知道”平行，正文采用持续状态。
  - marker: c
    text: “领……出”或可译“带……出来”；旧译作“领……上来”。
    reason: 说明动词方向义；正文依词根“出去”及出埃及语境采用“领出”。
lexical_decisions:
- source_word: ܚܝܝܢܢ (ḥayyīnan)
  choice: 活着的人
  rationale: 按词根 ܚܝܐ“活、生活”的通常意义翻译；相较“留下来的人”，更直接保留生命状态的含义。
- source_word: ܡܫܥܒܕܝܢܢ (mšaʿbdīnan)
  choice: 顺服
  rationale: 以持续状态表达与“知道”平行的现在条件，不译成已经完成的过去动作。
- source_word: ܐܦܩ (appeq)
  choice: 领……出
  rationale: 该词来自动词 ܢܦܩ“出去”，使役义为“使出来、领出来”；在埃及语境中自然译作“领我们出埃及”，而不是“领我们上来”。
theological_decisions:
- issue: “回来”的所指
  choice: 保留“再次回来”，不补明目的地或复活等解释
  alternative: 译为“复归”或明确解释为复活、归回应许之地
  rationale: 原句本身未在此处明说返回何处；保留其末世论张力和指称上的开放性。
- issue: 顺服对象的身份表达
  choice: 那位领我们出埃及的
  alternative: 直接补作“上帝”或使用特定神学称号
  rationale: 保留关系从句的原有表达，不以译者解释替代原文称谓。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“自己为何而来”保留原句的存在性追问；分号划分应许的两个后续动作。所有脚注标记均已置于正文相应位置。
