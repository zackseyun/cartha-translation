  yaml_path: translation/extra_canonical/2_baruch/044/001.yaml
  text: And I, Baruch, went from there and came to the people. And I called my firstborn, its inhabitants, and the elders of its great ones, and the lowly from the elders of the people, and I said to them,
translation:
  language: zh_hans
  text: 我，巴录，从那里离开，来到百姓那里。我召来我的长子、百姓的居民、其中显贵者的长老，以及百姓的长老中卑微者[a]，对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节受召者名单的叙利亚文本含义不甚清楚；也可依据平行段落所提出的校勘读法，理解为“百姓中的权贵和长老”。
    reason: 现存叙利亚文本的名单结构不规则；脚注说明校勘性替代读法，同时不以之取代正文。
lexical_decisions:
- source_word: ܒܘܟܪܝ
  choice: 我的长子
  rationale: 该词通常意为“我的长子”。虽然在召集民众领袖的语境中也可能指居首位的人，但正文保留叙利亚文本最直接的词义，不以推测性解释代替原文。
- source_word: ܥܡܘܪܝܗ
  choice: 百姓中的居民
  rationale: 原词意为“其居民”；依最近的先行词“百姓”补明所指，使中文可读，同时保留名单中这一独立成分。
- source_word: ܩܫ̈ܝܫܝ ܪ̈ܘܪܒܢܘܗܝ
  choice: 其中显贵的长老
  rationale: 尽量保留原文的领属结构，即“其显贵者的长老”；中文以“其中显贵的长老”表达，但原结构存在歧义。
- source_word: ܡܟܝܟܐ
  choice: 卑微的人
  rationale: 该词可表示卑微、谦卑或地位低下；此处与前面的显贵相对，译作“卑微的人”可保留社会地位与品格含义之间的张力。
theological_decisions:
- issue: 受召者名单的文本不确定性
  choice: 在正文中直译现存叙利亚文本的各个成分
  alternative: 将名单校勘或概括为“百姓中的权贵和长老”
  rationale: 现存文本的句法和名单次序较为困难，但不宜凭平行经文或后期校勘静默改写；正文保留其不规则性，并以脚注说明另一种理解。
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。“我巴录”保留原文自称的强调；名单则尽量贴近现存叙利亚文本，即使其句法略显突兀。
