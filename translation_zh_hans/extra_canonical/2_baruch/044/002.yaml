base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/044/002.yaml
  text: But you, do not withdraw from the way of the law, but guard and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: zh_hans
  text: 但你们不可偏离律法之道；要守护并劝戒余下的百姓，免得他们偏离大能者的诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܬܥܕܘܢ / 对应校勘所据“不可离开”
  choice: 不可偏离
  rationale: 以现代汉语自然表达离开既定道路或规范的含义，并与后半句形成对应。
- source_word: ܐܘܪܚܐ ܕܢܡܘܣܐ / “律法之道”
  choice: 律法之道
  rationale: 保留“道路”意象，同时准确传达律法这一核心概念。
- source_word: ܛܪܘ / “守护”
  choice: 守护
  rationale: 既可指谨守责任，也可指照管群体；不把含义缩窄为单纯遵守。
- source_word: ܪܬܘ / “劝戒、告诫”
  choice: 劝戒
  rationale: 兼具劝勉与警戒之意，适合巴录对群体领袖的嘱托语境。
- source_word: ܚܝܠܬܢܐ / “大能者”
  choice: 大能者
  rationale: 保留对上帝的称号，不擅自换成其他神名或加入宗派性解释。
theological_decisions:
- issue: “大能者”是否直接译作“上帝”
  choice: 保留“大能者”
  alternative: 上帝
  rationale: 源文使用称号而非普通神名；保留称号可维持文本的修辞和神学色彩。
- issue: 劝戒对象与偏离者的指代
  choice: 明确为“余下的百姓……他们”
  alternative: 不补出代词，保持高度省略
  rationale: 汉语需明确句法关系；如此处理不改变劝戒对象，也不把责任主体混同。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“但你们”承接上文并保留复数对象；分号呈现禁止与积极命令之间的转折。未收入英文旧脚注，因为该旧译把44:1的内容混入44:2，且缺少本节关于守护、劝戒余民的核心分句，不宜作为有效异文保留。
