  text: But remember and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: zh_hans
  text: 但你们要谨慎，并劝戒余下的百姓[a]，免得他们离弃上帝的诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句叙利亚文本在“要谨慎，并劝戒”所对应的措辞上有释读困难。首个动词有“守护、看顾、留意”之意；“劝戒”依传统释读及上下文译出。
    reason: 保留现存文本与传统释读之间的真实不确定性，同时说明正文为何采用“谨慎，并劝戒”。
lexical_decisions:
- source_word: ܢ̇ܛܪܘ ܘܗܘܘ
  choice: 要记念并劝戒
  rationale: 本处叙利亚文本的传抄或释读有困难；按本节语境及传统释读，表达巴录要求领袖继续关照、告诫留下的百姓。正文采用自然且能体现双重命令的译法，并以脚注保留较贴近现存字面的可能性。
- source_word: ܥܡܐ ܕܐܫܬܚܪ
  choice: 余下的百姓
  rationale: 准确表达“留下来／剩余的民众”，并与耶路撒冷灾后余民的语境相符。
- source_word: ܢܫܒܘܩ
  choice: 离弃
  rationale: 该动词基本义为“离开、舍弃”；在诫命语境中，“离弃”比单纯“离开”更自然。
- source_word: ܦܘܩ̈ܕܢܘܗܝ ܕܐܠܗܐ
  choice: 上帝的诫命
  rationale: 现存叙利亚文明确为“上帝的诫命”；不依英语咨询层的“Mighty One”改译为“大能者”。
theological_decisions:
- issue: 神的称谓
  choice: 上帝
  alternative: 大能者
  rationale: 叙利亚原文此处是ܐܠܗܐ（上帝／神），故按源文翻译，不把英语咨询文本中的称谓引入正文。
- issue: 百姓可能背离诫命的表述
  choice: 免得他们离弃上帝的诫命
  alternative: 使他们不可离弃上帝的诫命
  rationale: 保留目的兼防范性的语气，不把人的责任或未来结果解释得过于确定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“劝戒”保留训诫意味；“余下的百姓”延续灾后余民语境。
