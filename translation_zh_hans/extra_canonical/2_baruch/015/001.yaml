  text: 'And the Lord answered and said to me:

    “You are right to be astonished at man’s passing, but your judgment about the evils that befall sinners is not right.


    And as for what you said about the righteous who are taken away and the wicked who prosper,

    and as for what you said—that man does not know your judgment—

    because of this, listen now and I will speak to you; pay attention and I will make my words heard.


    Indeed, man would not have understood my judgment if he had not received the Law and if I had not instructed him in understanding.

    But now, because he has transgressed while understanding, he will surely be punished because of that understanding.

    And as for the righteous, concerning whom you said that the world came on their account: what is coming is likewise on their account.

    For to them this world is a struggle and a labor with much trouble, but what is to come is a crown with great glory.”'
translation:
  language: zh_hans
  text: '主回答我说：


    “你因人的逝去而惊异，是对的；但你对临到罪人的灾祸所作的判断，却不对。


    至于你所说义人被取去、恶人却亨通，


    又说人不知道我的审判——


    因此，现在你要听，我要对你说话；你要留心，我要让你听见我的话。


    的确，若人没有领受律法，若我没有教导他，使他明白，他原不会懂得我的审判。


    但如今，他既明白，却仍违犯，就必因这份明白而受惩罚。


    至于你所说的义人——这世界是因他们而有的——那将要来临的，也同样是因他们而有的。


    因为对他们来说，这世界是争战，是充满许多患难的劳苦；但那将要来临的，却是带着极大荣耀的冠冕。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܡܗܬ
  choice: 惊异
  rationale: 表达面对人的逝去与审判时震惊、诧异的反应，语气强于一般的“好奇”，同时不额外限定为恐惧或哀伤。
- source_word: ܢܡܘܣܐ
  choice: 律法
  rationale: 此处所指具有明确的启示和规范作用；采用中文圣经语境中自然且庄重的“律法”，而不把它狭义化为一般法律条文。
- source_word: ܡܕܥܐ / ܚܟܡܬܐ
  choice: 明白
  rationale: 上下文强调人获得道德认识之后所承担的责任。“明白”既可涵盖理解与智慧，也能自然连接“在明白的情况下违犯”与随后的审判。
- source_word: ܟܠܝܠܐ
  choice: 冠冕
  rationale: 保留未来奖赏与尊荣的具体意象，不弱化为抽象的“荣耀”或“报偿”。
theological_decisions:
- issue: 知识为何加重审判责任
  choice: 人在已经明白的情况下违犯律法，因此要因这份明白而受惩罚。
  alternative: 知识只是使罪更清楚，并不加重人的责任。
  rationale: 本段的论证直接把明白、故意违犯和惩罚联系起来；译文保留这一关系，但不进一步建立超出文本的审判体系。
- issue: 义人与今世及将来之世的关系
  choice: 义人在今世经历争战、劳苦和患难，将要来临的则为他们带来冠冕与荣耀。
  alternative: 本段只涉及义人在现世中的处境。
  rationale: 原段刻意对照“这世界”与“那将要来临的”，兼顾当前的苦难和未来的伸冤与尊荣。
- issue: “因他们而有”的范围
  choice: 保留“这世界”和“那将要来临的”都因义人而有的陈述。
  alternative: 解释为世界仅为了给义人奖赏或试炼而被创造。
  rationale: 文本本身的因果表达较浓缩；译文不把它扩展成特定的创造论或末世论解释。
translation_notes:
  register: 采用现代标准书面汉语，保持庄重而易懂。以短段落呈现连续论证；使用“逝去”“被取去”“那将要来临的”等措辞，保留死亡、义人命运及未来实在之间的含蓄张力，不擅自明确为某一特定末世体系。
