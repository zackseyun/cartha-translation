  yaml_path: translation/extra_canonical/2_baruch/025/001.yaml
  text: 'Then he answered me and said, “You too shall be spared until that time, until the sign that the Mighty One will perform for the inhabitants of the earth at the end of the days. And this will be the sign: bewilderment will seize the inhabitants of the earth, and they will fall into many afflictions; then again into great anguish. And when, because of the abundance of their distress, they say in their thoughts, ‘The Mighty One no longer remembers the earth,’ and they have given up hope, then the time will awaken.”'
translation:
  language: zh_hans
  text: 他回答我说：“你也必蒙保全，直到那时；也就是直到末后的日子，大能者为地上居民所行的那个征兆[a]出现。这就是那征兆：昏乱必临到地上的居民；他们必落入重重患难，又陷入极大的痛苦之中。由于苦难深重，他们心里会说：‘大能者不再记念这地了。’当他们绝了希望，那时候便要苏醒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “征兆”也可译作“所定的安排”或“指定的标记”。
    reason: 叙利亚词 ܬܘܩܢܐ 可兼有安排、设立之事和标志等含义；正文依启示文学语境取“征兆”，脚注保留其语义宽度。
lexical_decisions:
- source_word: ܬܘܩܢܐ
  choice: 征兆
  rationale: 此处指末世苦难临到时可辨认的标志；“征兆”自然传达其启示文学功能，同时以脚注保留“安排、所定之事”等可能含义。
- source_word: ܡܪܝܡܢܐ
  choice: 大能者
  rationale: 保留庄严的神圣称号，不扩写为“全能的上帝”，以免加入原文未明说的成分。
- source_word: ܡܬܕܟܪ
  choice: 记念
  rationale: 既准确表达“记得”，又保留圣经语境中上帝眷顾、顾念的意味；不把绝望者的话弱化为一般的“不关心”。
- source_word: ܐܘܠܨܢܐ
  choice: 患难／苦难
  rationale: 按上下文分别译为“患难”和“苦难”，避免中文重复，同时保留末世困厄逐步加深的力度。
- source_word: ܥܪ
  choice: 苏醒
  rationale: 保留末句把所定日期人格化的鲜明意象，不解释性改写为“日期便来到”。
theological_decisions:
- issue: 绝望者关于大能者的说法是否应缓和
  choice: 大能者不再记念这地了
  alternative: 大能者不再眷顾这地了
  rationale: 原句是患难中人的绝望之言，并非叙述者的神学断言；直译“记念”能保留哀诉的张力。
- issue: 末句的主语应译为希望还是日期／时候
  choice: 那日期就要苏醒
  alternative: 希望就要苏醒
  rationale: 经校订的篇章语境及传统文本见证支持“时候／日期”作为人格化主语；“希望苏醒”源于所给页面中严重错乱的行序或识读，不宜据此改写正文。
- issue: 开头说话者的身份
  choice: 他回答我说
  alternative: 我回答他说
  rationale: 篇章连贯性和校勘控制所反映的通行叙事均指向神圣答话者回答巴录；页面转录在章界处有明显行序及识读问题，不应据孤立的乱码反转说话者。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“蒙保全”“记念”保留经文语体，但避免古奥表达；“重重患难—极大的痛苦”呈现灾难递进；末句保留“日期苏醒”的启示文学拟人意象。
