  - severity: low
    issue: “那日期就要苏醒”中“日期”过于具体，且拟人搭配较突兀。
    rationale: 原文是“时候／时机”苏醒的拟人表达；“那时候便要苏醒”较贴切，并保留而不解释该意象。
  - severity: low
    issue: 开句可更清楚地表达征兆尚未来到。
    rationale: 以“直到……征兆出现”明确中文句法关系，未增加原文以外的实质内容。
