  language: en
  yaml_path: translation/extra_canonical/2_baruch/006/001.yaml
  text: And it happened on the next day that, behold, the forces of the Chaldeans surrounded the city. And at evening time I, Baruch, left the people, and I went out and stood by the oak, and I was grieving over Zion and lamenting over the captivity that had come upon the people. And I was filled with a spirit of strength, and I was lifted up on high above the square of Jerusalem. And I saw, behold, four angels standing at the four corners of the city, each of them holding a torch.
translation:
  language: zh_hans
  text: 第二天，看哪，迦勒底人的军队包围了城。到了傍晚，我，巴录，离开众人，出去站在橡树旁，为锡安悲伤，又为临到百姓的被掳之事哀哭。随后，我被一股力量之灵充满，被举到耶路撒冷广场的上空。我又看见，看哪，四位天使站在城的四角，各自手持一支火把。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܐ ܕܡܚܪ
  choice: 第二天
  rationale: 这是常见的时间承接语；“第二天”在现代汉语中自然，并保留叙事次序。
- source_word: ܚܝ̈ܠܐ ܕܒ̈ܥܝܕܐ
  choice: 迦勒底人的军队
  rationale: 控制见证支持“迦勒底人的军队”之意；“军队”清楚传达军事力量，又符合现代汉语表达。
- source_word: ܘܐܬܬܙܝܥܝ ... ܒܟܝܐ
  choice: 悲伤……哀哭
  rationale: 这组词同时表达内心的哀痛和外在的哭诉，以两个词保留原文重叠加强的哀悼语气。
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: 力量之灵
  rationale: 贴近叙利亚文的构词，表达一种使人得力的灵，同时避免套用后期固定的神学称谓。
- source_word: ܫܘܩܐ ܕܐܘܪܫܠܡ
  choice: 耶路撒冷广场
  rationale: 该词可指街道或市场空地；此处是从高处俯瞰全城的异象场景，“广场”较为合宜，同时不把含义限定为市场。
- source_word: ܠܡܦܝܕܐ
  choice: 火把
  rationale: 下文语境显示天使所持的是带火的器具；“火把”比“灯”更能保留异象的强烈画面。
theological_decisions:
- issue: “力量之灵”的所指
  choice: 保留为“力量之灵”，不明确指认其身份
  alternative: 译作“圣灵”或“能力的灵”并作神学认定
  rationale: 原文表达赋予力量的灵，却未在此明确其位格或身份；译文保留这种开放性，不作超出文本的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留两处“看哪”以再现异象叙事的提示语；使用“我巴录”保持自我点名的古典叙事力度，但避免过度文言化。
