base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/006/002.yaml
  text: And behold, suddenly a spirit of strength lifted me up and carried me above the wall of Jerusalem; and I saw four angels standing at the four corners of the city, each one holding a flaming torch in his hands.
translation:
  language: zh_hans
  text: 看哪，忽然，大能之灵把我提起，带到耶路撒冷城墙上方；我看见四位天使站在城的四角，各自手中拿着一支燃烧的火把。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: 大能之灵
  rationale: 保留“灵”与“力量／大能”的属格结构，不把它具体解释为风、神力或某位特定天使。
- source_word: ܐܣܬܠܩ ܠܥܠܐ
  choice: 把我提起，带到……上方
  rationale: 以自然汉语表达被提升至高处的动作，同时避免“向上……上方”的重复。
- source_word: ܐܪܒܥܐ ܡܠܐܟ̈ܝܢ
  choice: 四位天使
  rationale: 准确传达数目，并用适合有位格者的量词。
- source_word: ܐܪܒܥܬܝܗܝܢ ܙܘܝ̈ܬܗ̇ ܕܡܕܝ̣ܢܬܐ
  choice: 城的四角
  rationale: 直译空间意象，不将其改释为四方或四座城门。
- source_word: ܠܡܦܝܕܐ ܕܢܘܪܐ ܒܐܝܕܘܗܝ
  choice: 手中拿着一支燃烧的火把
  rationale: 保留火把的火焰性质及持在手中的细节；“燃烧的火把”比“火的火把”更符合现代汉语。
theological_decisions:
- issue: “大能之灵”的身份
  choice: 保持为“大能之灵”
  alternative: 强风／一位强大的天使／神的灵
  rationale: 原文在此没有明确界定这灵的身份；译文保留其开放性，不作教义性限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留异象叙事的突现感；句式清楚，适合普通读者朗读。
