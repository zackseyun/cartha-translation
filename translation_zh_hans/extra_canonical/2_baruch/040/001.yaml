revisions:
- from: 那时最后一位统治者仍会活着；他的大军被刀剑击杀之后，他必被捆绑，人们要把他押上锡安山。我的弥赛亚要判明他一切不敬虔的罪，也要把他大军所行的一切恶事摆在他面前。
  to: 那时最后一位统治者仍会活着；当他的大军被刀剑击杀后，他必被捆绑，他们要把他带上锡安山。我的弥赛亚要责备他一切不敬虔的行为，也要把他大军所行的一切恶事摆在他面前。
  rationale: 修订仅收敛“判明……的罪”所带出的正式定罪含义，改以“责备……不敬虔的行为”保留原文的谴责与揭露性质，并改善两处现代汉语行文；未改变人物、地点、事件次序或神学指称。
