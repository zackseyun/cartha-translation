review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实保留了末后统治者在其军队遭刀剑击杀后独自存活、被捆绑并带到锡安山，以及“我的弥赛亚”对其罪恶加以追究并陈列其军队恶行的次序。惟“判明……的罪”较原文及英文审计轨迹所示的责备、揭露语气更偏正式定罪，且将“impieties”转为名词性“罪”，宜调整为保留行为和谴责的表达。
  naturalness: “不敬虔的罪”在现代汉语中搭配稍显生硬；“责备他一切不敬虔的行为”庄重、清楚，也更符合经文语体。“人们要把他押上”虽可理解，但无指称根据地泛指“人们”不如“他们要把他带上”自然。
  terminology: “锡安山”与“我的弥赛亚”均恰当，应保留。“大军”可传达其军队整体；“不敬虔的行为”保留针对神的邪恶/不虔敬色彩，而不把含义限定为抽象司法罪名。
  issues:
  - severity: medium
    issue: “判明他一切不敬虔的罪”将原有的责备、揭露行动加强为正式裁定罪责。
    rationale: 英文审计轨迹的“convict”及其说明强调公开揭露和指控，但相关传统表达的核心是弥赛亚责备该统治者的恶行。汉语采用“责备……不敬虔的行为”更能保留该行动的开放性，避免增添具体司法程序。
  - severity: low
    issue: “不敬虔的罪”搭配不够自然。
    rationale: “不敬虔”更自然地修饰“行为、行径或恶行”；改为“不敬虔的行为”同时保留原文的道德—宗教指向。
  - severity: low
    issue: “人们要把他押上”中的泛指主语略显突兀。
    rationale: 原文的未明示施事可用“他们”承接，既不补充身份，也更合汉语叙事习惯。
  revised_text: 那时最后一位统治者仍会活着；当他的大军被刀剑击杀后，他必被捆绑，他们要把他带上锡安山。我的弥赛亚要责备他一切不敬虔的行为，也要把他大军所行的一切恶事摆在他面前。
