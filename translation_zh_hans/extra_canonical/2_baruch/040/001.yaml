base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/040/001.yaml
  text: The last ruler of that time will be left alive, when the multitude of his hosts has been struck down by the sword; and he will be bound, and they will bring him up to Mount Zion. And my Messiah will convict him of all his impieties, and will set before him all the wicked deeds of his hosts.
translation:
  language: zh_hans
  text: 那时最后一位统治者仍会活着；当他的大军被刀剑击杀后，他必被捆绑，他们要把他带上锡安山。我的弥赛亚要责备他一切不敬虔的行为，也要把他大军所行的一切恶事摆在他面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܫܘܬܗ
  choice: 不敬虔的罪
  rationale: 该词既指邪恶，也在弥赛亚于锡安施行审判的语境中带有冒犯上帝的意味；此译法保留其宗教和道德双重色彩。
- source_word: ܥܒ̈ܕܝܗܘܢ ܕܒܝܫܘܬܗܘܢ
  choice: 他大军所行的一切恶事
  rationale: 保留“行为/所行之事”和“邪恶”两个语义成分，同时明确这些恶行具有群体范围。
- source_word: ܛܘܪ ܨܗܝܘܢ
  choice: 锡安山
  rationale: 采用现代汉语圣经传统中自然、明确的专名形式。
- source_word: ܡܫܝܚܝ
  choice: 我的弥赛亚
  rationale: 直译所有格与明确的受膏者称号，保留此人物的个人性和弥赛亚身份。
- source_word: ܚܝܠܘ̈ܬܗ
  choice: 他的大军
  rationale: 在末世战争场景中译作“大军”比抽象的“众军力”更自然，并保留复数军队的整体含义。
theological_decisions:
- issue: 弥赛亚在末后统治者受审场景中的角色
  choice: 译为“我的弥赛亚要判明……的罪”，呈现他亲自执行审判。
  alternative: 将弥赛亚理解为纯粹象征性的时代，或弱化为一般受膏代理人。
  rationale: 文本明确称“我的弥赛亚”，并赋予他针对末后统治者的司法行动；译文不应削弱其个人性和审判职能。
- issue: 对末后统治者罪行的判定力度
  choice: “判明他一切不敬虔的罪”
  alternative: “责备他的一切邪恶”或“使他知罪”
  rationale: “判明”保留公开揭露并裁定其罪的司法语气，同时避免擅自说明其内心是否悔改。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“押上”体现被捆绑后强制带往锡安山；分号保留“大军被杀而统治者暂时存活”之间的时间与逻辑关系。未添加原文没有的教派性解释。
