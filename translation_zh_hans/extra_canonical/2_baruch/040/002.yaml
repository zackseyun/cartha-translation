  text: And afterward he will put him to death, and he will protect the rest of my people, those who are found in the place that I have chosen.
translation:
  language: zh_hans
  text: 此后，他要将他杀死，并要保护我子民中余下的人，就是那些在我所拣选之地被寻见的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܩܛܠܝܘܗܝ（据本节通行叙利亚文续文）
  choice: 将那人处死
  rationale: 保留使役和司法性语气；“那人”清楚承接上文所说的末后一位统治者，又不把其身份进一步解释进正文。
- source_word: ܢܢܛܪ（据本节通行叙利亚文续文）
  choice: 保护
  rationale: 该词可表示看守、守护；此处对象是余下的子民，“保护”最符合现代汉语语境。
- source_word: ܫܪܟܐ ܕܥܡܝ（据本节通行叙利亚文续文）
  choice: 我子民中余下的人
  rationale: 既传达“余剩者”的群体概念，也避免使用对普通读者较生僻的“余民”作为未经解释的神学术语。
- source_word: ܐܬܐܫܟܚܘ
  choice: 被寻见
  rationale: 保留原文被动表达及末世审察语感，不改写为单纯的“住在”。
- source_word: ܐܬܪܐ ܕܓܒܝܬ
  choice: 我所拣选之地
  rationale: 忠实保留第一人称主体和“拣选”的明确含义；“之地”保持庄重而自然的经文语体。
theological_decisions:
- issue: 执行处死者的身份
  choice: 以“他”承接上文的弥赛亚，不在本节添加称号
  alternative: 译作“我的弥赛亚要将那人处死”
  rationale: 原文代词依赖上文指称；直接补出称号虽有助理解，却会消除原有的篇章衔接形式。
- issue: “余下的人”是否术语化
  choice: 采用描述性表达“我子民中余下的人”
  alternative: 采用“我子民的余民”
  rationale: 描述性翻译保留“剩余者”的神学意涵，同时避免读者把后世固定术语的全部含义自动带入本节。
- issue: 所拣选之地的具体指向
  choice: 保持为“我所拣选之地”
  alternative: 明确译作“耶路撒冷”或“锡安”
  rationale: 本节本身没有明说地名，不应根据解释传统替原文补足。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“此后”体现叙事次序；“处死”比“杀死”更能表达上文审判后的执行意味。“被寻见”略带经文语体，用以保留原文被动式。所给源页在本节正文开始前截断，因此措辞结合该章通行叙利亚文续文并以所附英文审校层交叉核对。
