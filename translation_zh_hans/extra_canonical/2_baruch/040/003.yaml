  yaml_path: translation/extra_canonical/2_baruch/040/003.yaml
  text: And his dominion will stand forever, until the world of corruption comes to its end, and until the times spoken of before are fulfilled.
translation:
  language: zh_hans
  text: 他的统治将永远长存，直到这败坏的世界终结，直到先前所说的时期都得以实现。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܠܛܢܗ（据本节传本文意还原）
  choice: 他的统治
  rationale: 以“统治”表达权柄及其施行，比“国度”更贴近 dominion 的语义，也不额外限定政治实体。
- source_word: ܠܥܠܡ（据本节传本文意还原）
  choice: 永远长存
  rationale: 保留“永远”与随后“直到……”并置所形成的张力，不擅自解释为有限或无限。
- source_word: ܥܠܡܐ ܕܚܒܠܐ（据本节传本文意还原）
  choice: 这败坏的世界
  rationale: “败坏”既可指腐朽状态，也可带道德与末世意味；译文不将其窄化为单一解释。
- source_word: ܢܫܬܠܡܘܢ（据本节传本文意还原）
  choice: 得以圆满
  rationale: 兼顾“完成、届满、应验”等含义，并适合与“时期”搭配。
theological_decisions:
- issue: “永远”与“直到世界终结”之间的张力
  choice: 原样保留“永远……直到……”的句法关系
  alternative: 将“永远”弱化为“长久”，或解释为“从此直到永恒”
  rationale: 源文传统所呈现的表达具有真实张力；译文不替作者消解其时间或末世论含义。
- issue: 败坏是世界的性质还是一个时代秩序的称谓
  choice: 译作“这败坏的世界”
  alternative: “腐朽的世代”或“败坏的时代”
  rationale: “世界”保留较宽的宇宙与时代双重可能，避免过早限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两个“直到”保留原句的平行推进；“各个时期都得以圆满”比生硬的“时期被完成”自然，同时保留末世性的完成意味。所给叙利亚文页在40:3处截断，因此具体词形以该节传本文意及审校层为参照，未虚构脚注或异文。
