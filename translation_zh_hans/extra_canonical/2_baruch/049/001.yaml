revisions:
- from: 然而，大能者啊，我仍要向你发问，也要向那创造万有的求怜悯：在他的日子里活着的人，将以怎样的形体生活？那时以后之人的荣光[a]将如何存留？他们会取这现今的形体吗？人的这些样貌到那时仍会存留，并被立为有生命的吗？还是你会改变那些曾存在于世上的事物，正如也改变世界本身？
  to: 然而，大能者啊，我仍要向你发问，也要向那创造万有的求怜悯：在他的日子里活着的人，将以怎样的形体生活？那时以后之人的荣光[a]将如何存留？他们会取这现今的形体吗？这些人的形貌到那时仍会存留，并被立为有生命的吗？还是你会改变那些曾存在于世上的事物，连世界本身也改变吗？
  rationale: 仅作两处安全的汉语表达修订：使最后一个问句完整地表达‘连世界本身’亦在改变范围内，并改善‘人的这些样貌’的指称。其余译文、脚注及对文本不确定性的处理均可保留。
