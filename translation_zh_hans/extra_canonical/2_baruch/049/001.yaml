  yaml_path: translation/extra_canonical/2_baruch/049/001.yaml
  text: 'But nevertheless I will ask you, O Mighty One, and I will seek mercy from him who made all: In what form will those who live in his days live? Or how will the splendor of those who come after that time be preserved? Will they then take on this present form, and will those human likenesses then remain and will they be established as living beings?? Or will you perhaps change these things that have been in the world, as also the world itself?'
translation:
  language: zh_hans
  text: 然而，大能者啊，我仍要向你发问，也要向那创造万有的求怜悯：在他的日子里活着的人，将以怎样的形体生活？那时以后之人的荣光[a]将如何存留？他们会取这现今的形体吗？这些人的形貌到那时仍会存留，并被立为有生命的吗？还是你会改变那些曾存在于世上的事物，连世界本身也改变吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处叙利亚文传本的字样艰涩，控制传统支持“光辉”或“荣光”一类含义。
    reason: 说明原文疑有讹误，并交代正文所采用读法的依据。
lexical_decisions:
- source_word: ܚܝܠܬܢܐ（控制文本所支持的读法；所给页面转录作 ܚܒܝܒܝ）
  choice: 大能者啊
  rationale: 采用控制传统支持、且与祷告语境相合的称呼；不依页面转录中疑有讹误的“我亲爱的”来改写对上帝的呼求。
- source_word: ܕܡܘܬܐ
  choice: 形体／样貌
  rationale: 此处指人的形态或样貌，并非“死亡”；前处用“形体”表达存在方式，后处用“样貌”避免汉语重复，同时保留同一词的语义关联。
- source_word: ܙܥܘܪܬܗ（传本文字可疑）
  choice: 荣光
  rationale: 页面所见读法艰涩，控制传统支持“光辉、荣光”一类意义；正文采用自然而庄重的“荣光”，并以脚注说明文本不确定性。
- source_word: ܡܩܝܡܝܢ ܚܝ̈ܐ
  choice: 被立为有生命的
  rationale: 按复活语境理解为这些样貌被确立为活着的存在，不译成主动的“维持活人”。
- source_word: ܡܚܠܦ
  choice: 改变
  rationale: 使用宽泛的“改变”，不预先断定是完全替换还是保有连续性的转化。
theological_decisions:
- issue: 时代转折后人的形体是延续还是改变
  choice: 保留问句的开放性：现今形体可能存留，也可能被改变。
  alternative: 明确断言复活后形体完全相同，或明确断言形体被彻底替换。
  rationale: 本节只提出问题，尚未给出答案；译文不提前消解关于连续性与转化的张力。
- issue: “被立为有生命的”是否明说肉身复活
  choice: 依原文表述为生命的确立，不扩写为特定的复活形态。
  alternative: 直接译成“肉身复活”或“恢复原来的身体”。
  rationale: 上下文与复活相关，但本句措辞仍集中于人的样貌和生命；避免加入原文未明说的教义细节。
translation_notes:
  register: 采用现代、庄重而易懂的祷告与启示文学语体。“大能者啊”保留呼语的肃穆感；连续问句维持巴录对末后形体的探问，不将其改写为断言。
