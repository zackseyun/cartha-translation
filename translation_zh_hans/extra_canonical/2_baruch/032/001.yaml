lexical_decisions:
- source_word: ܦܐܪ̈ܐ / fructus legis
  choice: 律法的果实
  rationale: 保留原文的农耕意象和“律法”这一明确的盟约性用语；按叙利亚语复数形态译作“果实”，不将其意译为“顺服”或“善行”。
- source_word: Fortis
  choice: 大能者
  rationale: 此处作为对上帝的尊称，且祂是震动整个受造界的那一位；“大能者”既庄重，也保留称号形式。
- source_word: concutiat omnem creaturam
  choice: 震动整个受造界
  rationale: “受造界”传达宇宙性的范围；“震动”保留末世性剧变的力度，又不夸大为彻底毁灭。
- source_word: ܒܢܝܢܐ / aedificatio Sion
  choice: 锡安的建筑
  rationale: 按字面保留建筑意象，不擅自限定为圣殿、城墙或整个城市。
- source_word: ܡܬܚܕܬܘ ܒܬܫܒܘܚܬܐ
  choice: 在荣耀中更新
  rationale: 兼顾“更新”和“荣耀”两个要素，不弱化为一般性的重建。
- source_word: ܡܫܬܡܠܐ ܠܥܠܡ
  choice: 永远坚立
  rationale: 原语可有“完成、达到完满”之意；结合建筑在最终更新后永久存留的语境，译作“永远坚立”较自然，同时保留其终局性。
- source_word: contristari tantopere
  choice: 如此悲伤
  rationale: 保留强烈的哀伤语气，同时采用普通现代读者易懂的表达。
theological_decisions:
- issue: 保护者的语法身份
  choice: 译作“它就会……保护你们”，让前述“律法的果实”承担主动保护作用
  alternative: 译作“你们就会受到保护”
  rationale: 主动表达更贴近相关叙利亚语及拉丁语控制见证的语法，也不掩盖经文把保护作用与内心所播下的律法果实相联系的张力。
- issue: 律法的意象
  choice: 保留“律法的果实”
  alternative: 译作“顺服的成果”或“公义的果子”
  rationale: 原文明确指向律法；不将其神学含义预先归结为某一种解释。
- issue: 锡安建筑段的文本位置与稳定性
  choice: 将该段保留在正文中并置于方括号内
  alternative: 删去该段，或不加标识地作为完全确定的正文刊出
  rationale: 控制见证支持震动、重建、再度荒凉和最终荣耀更新的次序，但当前章节边界资料仍有不稳定之处；方括号既保存重要材料，也如实标明文本归属的不确定性。
- issue: “直到那时候”的指向
  choice: 保留含混的时间表达“直到那时候”
  alternative: 明确解释为“直到末日”或“直到弥赛亚来临的时候”
  rationale: 原文的时间指向并未在本句中完全说明，不应以特定末世体系替它消除歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“预备自己的心”“播下……果实”“震动”“拔除”等保留原文意象；避免宗派化术语。代词“它”在首段承接“律法的果实”，虽有轻微语义张力，但这正反映原文语法，不予消解。
