base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/005/005.yaml
  text: And I went and took Jeremiah, Addo, Seraiah, Jabish, Gedaliah, and all the honorable men of the people, and I brought them down to the valley of Kidron, and I told them everything that had been said to me.
translation:
  language: zh_hans
  text: 我便去带上[a]耶利米、亚多、西莱雅、雅比施、基大利，以及民中所有尊贵的人，领他们下到汲沦谷，把对我说的一切都告诉了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带来了他们”。
    reason: 相关动词既可理解为“带上、带同”，也可按使役或趋向关系译作“带来”；正文依上下文采用较自然的“带上”。
lexical_decisions:
- source_word: ܕܐܚܬ
  choice: 领他们下到
  rationale: 按所报告的叙利亚语使役形含义，既表达“带领”，也保留向下进入谷地的方向性。
- source_word: ܢܚܠܐ ܕܩܕܪܘܢ
  choice: 汲沦谷
  rationale: 采用现代中文圣经语境中易于辨认的地名译法，并明确其谷地性质。
- source_word: honorable men（英语审校层所反映的源文称谓）
  choice: 尊贵的人
  rationale: 保留其社会身份与受敬重意味，不扩大解释为特定官职或长老群体。
- source_word: ܐܡܪ
  choice: 告诉
  rationale: 在“把……一切”这一宾语结构中，“告诉”比直译“说”更符合现代汉语，同时保持传达话语的含义。
theological_decisions:
- issue: “对我说的一切”的发言者是否明说为上帝
  choice: 不补出“上帝”或“主”
  alternative: “主对我说的一切”
  rationale: 原句以被动表达发言内容；保留未明说的施事者，避免替文本消解指代上的含蓄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名以常见圣经音译风格处理；并列名单使用顿号，避免英语式重复连接词。正文保留“下到”以体现进入汲沦谷的地势方向。所提供的叙利亚语页面片段与指定节号似有错位，因此具体人名与句法次序同时参考了经审校的英语咨询层，未据页面中无关段落臆造内容。
