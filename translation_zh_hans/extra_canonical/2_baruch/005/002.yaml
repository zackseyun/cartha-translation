  verdict: revise
  source_fidelity: 叙利亚语在本节的核心表达为“我的名和我的荣耀……直到永远；我的审判却在它的时候持守/保全其ṣedq（正当、公义或权利）”。草稿准确保留了永恒性、审判及其时机；但“到了相应的时候”将“在其时候”改成了事件临到时的说法，并略增“相应”的解释。“维护其权”虽试图保留法律语义，却在现代汉语中指代不清且不够自然。
  naturalness: “存到永永远远”庄重自然。“我的审判到了相应的时候，必维护其权”句法较拗口，尤其“其权”不合现代标准汉语的通常搭配。改为“必在其时候维护自己的正当性”既保留原文的反身指涉与法律语感，也更通顺。
  terminology: “主”“名”“荣耀”“审判”均恰当。对ܙܕܩܗ不宜单独译作“权”，因为中文“权”通常要求更具体的所指；“正当性”可涵盖其权利/正当权利的法律含义，而脚注保留“公义”的另一译法。
  issues:
  - severity: medium
    issue: “到了相应的时候”对“在其时候”的表达稍有扩展。
    rationale: 原文仅标示审判自己的时机，未明确说“到了”或评价该时机为“相应”。
  - severity: medium
    issue: “维护其权”在现代汉语中指代不明且搭配生硬。
    rationale: 源语的反身属格指向“审判”本身；明确为“自己的正当性”可保留其法律性，同时避免将含义缩窄为一般“权利”。
  revised_text: 主对我说：“我的名和我的荣耀存到永远；但我的审判必在其时候维护自己的正当性[a]。”
