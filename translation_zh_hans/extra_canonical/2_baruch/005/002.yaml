  text: And the Lord said to me, "My name and my glory endure forever, but my judgment maintains its right in its time."
translation:
  language: zh_hans
  text: 主对我说：“我的名和我的荣耀存到永远；但我的审判必在其时候维护自己的正当性[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“持守自己的公义。”
    reason: ܢܛܪ ܙܕܩܗ直义近于“持守/保全其正当（或公义）”；该词可带法律上的正当权利、正当性或公义之意。
lexical_decisions:
- source_word: ܫܡܝ / ܫܘܒܚܝ（据本节传本文意）
  choice: 我的名和我的荣耀
  rationale: 对应本节传统所保存的并列语，保留第一人称属格和庄重语气。
- source_word: ܠܥܠܡܐ ܕܠܥܠܡ
  choice: 存到永永远远
  rationale: 这是表达永久、永恒的叙利亚语强化结构；采用现代中文圣经语体中自然且易懂的说法。
- source_word: ܕܝܢܝ
  choice: 我的审判
  rationale: 保留抽象名词及其神学张力，不擅自改写为刑罚、判决或审判行动。
- source_word: ܢܛܪ ܙܕܩܗ
  choice: 必维护其权
  rationale: 该短语直义近于“守住其权/正当性”；译作“维护其权”既保留司法语感，也避免把含义单一限定为道德上的公正。
- source_word: ܒܙܒܢܗ
  choice: 到了相应的时候
  rationale: 保留“在它的时候”的指涉，同时用自然中文表达审判有其适当或指定的时机。
theological_decisions:
- issue: “审判”与“权/公正”的关系
  choice: 我的审判……必维护其权
  alternative: 我的审判……必持守公正
  rationale: 源语容许“权利、正当性、公义”等语义；正文保留较具法律色彩且较含混的“其权”，并以脚注呈现另一可能。
- issue: 审判时机是否明确为神预定
  choice: 到了相应的时候
  alternative: 到了所定的时候
  rationale: 原文只说“在它的时候”，没有明说“预定”；故不把预定观念直接写入正文。
translation_notes:
  register: 采用现代、庄重而清楚的中文。“存到永永远远”保留原文的强调；分号呈现永恒的名与荣耀同按时施行的审判之间的转折。
