lexical_decisions:
- source_word: ܐܪܝܡܘ ܩܠܗܘܢ
  choice: 放声
  rationale: 该表达直译为“扬起他们的声音”；汉语以“放声”自然传达高声哭泣，同时保留声音增强的意味。
- source_word: ܒܟܘ ܟܠܗܘܢ
  choice: 大哭
  rationale: 意为“他们全都哭了”；与前面的“放声”合译为“放声大哭”，简洁表达众人共同哭泣。
- source_word: ܨܡܢ ܥܕܡܐ ܠܪܡܫܐ
  choice: 禁食，直到傍晚
  rationale: 保留禁食持续至日暮时分的时间界限；“傍晚”是现代汉语中自然且庄重的表达。
