  yaml_path: translation/extra_canonical/2_baruch/005/001.yaml
  text: And I said, “So then, I have hoped in vain, and in vain was Zion built. For if those who hate us have taken possession of her, what will you do for your great name?”
translation:
  language: zh_hans
  text: 我说：“这样看来，我竟徒然盼望，锡安也徒然建成了。若恨恶我们的人占据了她，你要为你伟大的名做什么呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܒܪܬܝ
  choice: 我的盼望
  rationale: 该词源于表示“盼望、期待”的词根；结合本节哀叹语境，译作名词性短语自然，也保留说话者希望落空之意。
- source_word: ܨܗܝܘܢ
  choice: 锡安
  rationale: 采用现代汉语圣经传统中通行的专名形式，并保留其作为城的阴性拟人意象。
- source_word: ܐܝܠܝܢ ܕ… / 敌对者语句
  choice: 恨恶我们的人
  rationale: 依上下文中的敌对关系直译，不将其具体化为某一民族或军队，以免超出本节措辞。
- source_word: ܪܒܘ
  choice: 你伟大的名
  rationale: 按英语审校层所保留的“great name”及本段神名受尊崇的语境表达；汉语中补出“名”以呈现所指。
theological_decisions:
- issue: 锡安的身份
  choice: 保留“锡安”作为被建造、又被仇敌占据的城，不在正文中将其明确等同于天上的城或仅限于地上的城。
  alternative: 直接解释为永恒的天上锡安，或仅解释为历史上的耶路撒冷。
  rationale: 本节的哀叹与前章预备之城的论述形成张力；译文应保留这种张力，而不替文本作体系化判定。
- issue: 仇敌与上帝在城陷落中的能动性
  choice: 本节按巴录的疑问表达，称仇敌“占据了她”，不在此处提前加入他们只是审判工具的解释。
  alternative: 译成仇敌独立毁灭锡安，或否认仇敌实际参与。
  rationale: 后文会重新界定仇敌在审判中的角色；本节应忠实保留说话者当下的困惑。
- issue: “你伟大的名”所表达的质问
  choice: 译为“你要怎样维护你伟大的名呢”。
  alternative: 较字面的“你要为你伟大的名做什么呢”。
  rationale: “维护”自然传达古代语境中神名因其城受辱而涉及的声誉与尊荣，同时仍保留疑问和神学张力。
translation_notes:
  register: 采用庄重而现代的叙事语体。“竟是徒然”体现哀叹和希望落空，“她”延续锡安作为城市的拟人化表达；问句保持尖锐，不以解释性神学语言削弱巴录的困惑。
