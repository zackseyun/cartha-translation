revisions:
- from: 我说：“这样看来，我的盼望竟是徒然，锡安的建造也是徒然。若恨恶我们的人占据了她，你要怎样维护你伟大的名呢？”[a]
  to: 我说：“这样看来，我竟徒然盼望，锡安也徒然建成了。若恨恶我们的人占据了她，你要为你伟大的名做什么呢？”
  rationale: 以“徒然盼望”和“徒然建成了”保留原句的动词性哀叹；将末句改为较形式对应的开放式问法，避免把神名所涉的行动限定为“维护”。删除无具体异文依据且非理解所必需的脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:17:48Z'
review_pass:
  verdict: revise
  source_fidelity: 正文基本忠实传达审校英译所见的哀叹、锡安被占据以及对神名的质问。惟“维护你伟大的名”将末句具体化为维护名誉，较原问句“为你的大名做什么”更具解释性；宜保留其开放的语义。
  naturalness: “这样看来”“徒然盼望”“恨恶我们的人占据了她”均属自然、庄重的现代汉语。“我曾徒然盼望，锡安也徒然建成了”比“我的盼望竟是徒然，锡安的建造也是徒然”更贴近原句的动词表达，亦更流畅。
  terminology: “锡安”符合通行圣经专名；“恨恶我们的人”恰当地未将敌人具体化。“大名”是汉语宗教语境中自然且不失庄重的表达；不应以“维护”预断其所涉及的行动。
  issues:
  - severity: medium
    issue: 末句“你要怎样维护你伟大的名呢”带入解释性动作。
    rationale: 英译审校轨迹及所附较直译的措辞均为“你要为你伟大的名做什么呢”。“维护”虽可表达可能的语境含义，却缩窄了原有质问的开放性。
  - severity: low
    issue: 脚注声称“叙利亚文的传抄与分词存在不稳定之处”，但未指明具体异文或其对译文的可核实影响。
    rationale: 该脚注主要重复正文的可选形式，并加入无法由所提供审校材料充分支持的笼统文本批判断言。删去脚注可避免制造不必要的不确定性。
