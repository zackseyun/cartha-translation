  text: And you will see with your eyes that it is not the enemies who overthrow Zion, nor those who burn Jerusalem, but that they are ministers of the Judge for a time.
translation:
  language: zh_hans
  text: 你必亲眼看见：推翻锡安的并不是仇敌，焚烧耶路撒冷的也不是他们；他们不过是在一段时期内为审判者效力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不过是在一段时期内执行审判。”
    reason: 原文相关短语可理解为“为审判者效力”，也可能理解为“执行审判”；脚注保留这一词义与句法上的歧义。
lexical_decisions:
- source_word: ܒܥܝܢܝ̈ܟ
  choice: 亲眼
  rationale: 直译为“用你的眼睛”，现代汉语以“亲眼”自然表达亲身目睹的强调。
- source_word: ܠܨܗܝܘܢ
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行、清楚的专名译法。
- source_word: ܠܐܘܪܫܠܡ
  choice: 耶路撒冷
  rationale: 采用现代中文通行专名译法。
- source_word: ܡ̇ܫܡܫܝܢ
  choice: 效力
  rationale: 该动词有服事、供职、充任执行者之意；“效力”既自然，又保留这些人受更高权柄支配的关系。
- source_word: ܒܙܒܢܐ
  choice: 在一段时期内
  rationale: 保留其时间有限的含义，不将其具体化为未经原文说明的固定期限。
theological_decisions:
- issue: 毁灭者与神圣审判之间的关系
  choice: 他们不过是在一段时期内为审判者效力
  alternative: 他们是在一段时期内执行审判
  rationale: 正文保留原文中这些毁灭者作为更高审判权柄之仆役或执行者的张力，不把他们的行为直接等同于审判本身，也不由此免除其自身责任。
- issue: ܕܝ̈ܢܐ 的理解
  choice: 审判者
  alternative: 审判
  rationale: 结合 ܡ̇ܫܡܫܝܢ“服事、效力”的支配关系及经审校的英译，正文取人格性的“审判者”；脚注保留名词可作“审判”理解的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你必亲眼看见”保留宣告语气；分号呈现前后转折。补出“他们”以明确指回前述毁灭、焚烧者，并以“不过”自然表达这些人只是暂时受差遣的工具。
