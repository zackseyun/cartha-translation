  text: And he answered and said to me, “Whatever is destined to happen at that time will happen upon the whole earth; therefore, all who live will experience[a] it.”
translation:
  language: zh_hans
  text: 他回答我说：“那时注定要发生的事，必临到全地；因此，所有活着的人都会感受到[a]这事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都会察觉到”或“都会感觉到”。
    reason: ܢܪܓܫܘܢ可表示察觉、感知或感觉；上下文也容许理解为亲身感受到这些事件。
lexical_decisions:
- source_word: ܕܥܬܝܕ ܠܡܗܘܐ
  choice: 注定要发生的事
  rationale: ܥܬܝܕ 与不定式连用，表示将要发生之事；在启示文学语境中也带有既定、预定的意味。译为“注定要发生”既保留未来指向，也呈现其既定性。
- source_word: ܥܠ ܟܠܗ̇ ܐܪܥܐ ܢܗܘܐ
  choice: 必临到全地
  rationale: 原文直陈此事将在全地发生。“临到”比机械重复“发生”更符合现代汉语，并保留事件波及全地的含义；“必”传达叙述中的确定未来，而非另加神学判断。
- source_word: ܢܪܓܫܘܢ
  choice: 都会感受到
  rationale: ܪܓܫ 的核心义是察觉、感知或感觉。此处既可能指意识到，也可能指亲身感受末时事件；正文采用自然且涵盖较广的“感受到”，并以脚注保留词义范围。
theological_decisions:
- issue: ܕܥܬܝܕ 是否应明确译为神所预定
  choice: 译作“注定要发生”，不明说由谁命定
  alternative: “神预定要发生”或仅作“将要发生”
  rationale: 原文表达未来既定性，却没有在本句明说命定者。当前译法保留启示文学中的确定意味，同时避免补入未明说的施事者。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“他回答我说”保留叙事公式；“全地”沿用经文体中自然且易懂的表达。脚注标记已在正文对应出现。
