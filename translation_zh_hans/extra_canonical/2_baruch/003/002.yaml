base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/002.yaml
  text: If I have found grace in your sight, let your mercies quickly take my spirit to yourself, that I may go to my fathers and not see the destruction of my mother.
translation:
  language: zh_hans
  text: 我若在你眼前蒙恩，愿你的怜悯快快把我的灵接到你那里，使我归到列祖那里，不致亲眼看见我母亲遭毁灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܝܒܘܬܐ
  choice: 恩
  rationale: 在“在你面前找到恩惠”的闪语表达中，译作“蒙恩”既准确又符合现代汉语宗教文体。
- source_word: ܪ̈ܚܡܝܟ
  choice: 你的怜悯
  rationale: 保留复数形式所表达的丰厚怜悯，但汉语以集合性单数自然呈现。
- source_word: ܪܘܚܝ
  choice: 我的灵
  rationale: 直译“我的灵”，保留说话者求死、归于列祖的表达，不改写成解释性的“我的性命”。
- source_word: ܐܒ̈ܗܝ
  choice: 列祖
  rationale: 此处指已经去世的先祖；“归到列祖那里”自然承载死亡并与祖先同在的古代语义。
- source_word: ܐܡܝ
  choice: 我母亲
  rationale: 保留原文以母亲指称耶路撒冷的拟人隐喻，不在正文中直接解释或替换。
theological_decisions:
- issue: 求神取走其灵的祈求
  choice: 按原文保留“愿你的怜悯快快把我的灵接到你那里”
  alternative: 意译为“求你让我快快死去”
  rationale: 原文把行动归于神的怜悯，并以“取灵”含蓄表达死亡；直译可保留其神学张力与诗性。
- issue: “母亲”的身份
  choice: 正文保留“我母亲”
  alternative: 直接译作“耶路撒冷”或“母城”
  rationale: 原文使用亲属隐喻，直接释为耶路撒冷会消除其情感力度和文学意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“蒙恩”“列祖”保留经文语感；句法则保持流畅，避免过度古雅。条件从句按源文证据补出。
