  yaml_path: translation/extra_canonical/2_baruch/003/005.yaml
  text: If indeed you destroy your city and give over your sanctuary for a time and scatter your people among the nations so that they may be no more,
translation:
  language: zh_hans
  text: 你若真要毁灭你的城，把你的圣所暂时交出去，又把你的子民分散在列国中，使他们不复存在，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܘܒܕ
  choice: 毁灭
  rationale: 该动词在此表示使之灭亡、毁坏；“毁灭”准确保留其强烈程度。
- source_word: ܡܕܝܢܬܟ
  choice: 你的城
  rationale: 直译为“你的城”，并保留上帝与该城之间的归属关系。
- source_word: ܬܫܠܡ
  choice: 交出去
  rationale: 此处表示交付、交在他者手中；采用自然现代汉语，同时不具体说明受交付者。
- source_word: ܠܙܒܢܐ
  choice: 暂时
  rationale: 表达“为一段时间”，简洁保留其有限时段之意。
- source_word: ܒܥܡܡ̈ܐ
  choice: 在列国中
  rationale: “列国”符合圣经语域，也准确表达众多外邦民族或国家。
- source_word: ܥܡܟ
  choice: 你的子民
  rationale: “子民”在庄重而通俗的汉语中能体现与上帝的归属关系。
theological_decisions:
- issue: 上帝毁城并交出圣所的表述
  choice: 直接保留第二人称主语及行动
  alternative: 弱化为许可城市与圣所遭难
  rationale: 原文将行动直接归于上帝，不应为缓解神学张力而改写成单纯许可。
- issue: “使他们不复存在”的范围
  choice: 保留原文的绝对化措辞
  alternative: 解释为仅指失去民族或政治实体身份
  rationale: 该句本身没有明确限定其含义，应保留可能涉及民族存续或实际灭亡的张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语体。“你的城”“你的圣所”“你的子民”形成平行结构；末尾逗号保留本节在上下文中尚未完结的句法走势。
