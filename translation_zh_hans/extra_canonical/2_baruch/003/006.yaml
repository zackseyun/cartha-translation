translation:
  language: zh_hans
  text: 又怎能述说你的赞美呢？你律法中的内容又能向谁解释呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܫܒܚܬܟ (teshbḥātāk)
  choice: 对你的赞美
  rationale: 按叙利亚语单数名词及第二人称所有格理解为“对你的赞美”，中文用集合意义的“赞美”自然表达，不强行复数化。
- source_word: ܢܬܦܫܩ (netpashaq)
  choice: 解明
  rationale: 该被动式表示“被解释、被阐明”；“解明”既保留被说明的含义，也符合庄重的祷告语体。
- source_word: ܢܡܘܣܟ (nāmōsāk)
  choice: 你的律法
  rationale: 保留“律法”这一核心宗教法律用语及第二人称所属关系，不缩窄为某一条诫命。
- source_word: ܡܐ ܕܒܢܡܘܣܟ (mā d-b-nāmōsāk)
  choice: 你律法中的内容
  rationale: 直译其不定关系表达“在你律法中的事物/内容”，不擅自限定为教训、奥秘或诫命。
theological_decisions:
- issue: “你律法中的内容”所指范围
  choice: 保持概括，不具体化
  alternative: 译作“你律法的教训”或“你律法中的奥秘”
  rationale: 原文仅说“在你律法中的内容”，没有明言是教训、预言或奥秘；概括译法保留其开放性。
- issue: 第一问的主语
  choice: 译为泛指的“谁”
  alternative: 译为“人怎能”
  rationale: 原文表达非特指的人称疑问；“谁能”在现代汉语中自然，同时不指定某一群体或解释者。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。两句均保留反问结构，并以“又”连接；不采纳早先把首句理解为“那些像你百姓的人”的旧译，因为该读法与经校核的叙利亚语词句不符。
