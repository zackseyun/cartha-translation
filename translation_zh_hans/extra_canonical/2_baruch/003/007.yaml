  rationale: 将两个重复的“看见”合并，令“因这城手所行的恶”自然地置于所见内容之前；以“凄苦的寡妇”替换偏口语的“苦命的寡妇”。译文继续保留疑问句、第二人称复数、城市拟人化以及异常的“甘美的战利品”意象。脚注保留介词及句法切分的歧义。
