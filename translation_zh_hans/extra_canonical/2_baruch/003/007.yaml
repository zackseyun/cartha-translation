base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/007.yaml
  text: And that they may see concerning this city, because of the evil of her deeds, that this city is like a bitter widow, and that her humiliation is like sweet spoil?”
translation:
  language: zh_hans
  text: “又使你们因这城手所行的恶，看见这城如同凄苦的寡妇，她所受的羞辱如同甘美的战利品吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ
  choice: 好让你们亲眼看见
  rationale: 动词为第二人称复数；ܠܟܘܢ带有反身或强调意味，译作“亲眼”比生硬的“为你们自己看见”更自然。
- source_word: ܒ̈ܝܫܬܗ̇ ܕܐܝܕܝܗ̇
  choice: 她手所行的恶
  rationale: 保留“她的手”这一闪语式表达，同时用“所行”显明其指行为。
- source_word: ܥܡܗܕܐ ܡܪܝܪܐ
  choice: 苦命的寡妇
  rationale: 名词指寡妇，形容词本义为“苦的”；“苦命”在现代汉语中自然地表达其悲苦处境。
- source_word: ܨܥܪܘܗܝ
  choice: 她所受的羞辱
  rationale: 按上下文理解为这城遭受的羞辱，采用自然且庄重的汉语表达。
- source_word: ܫܘܕܐ ܚܠܝܬܐ
  choice: 甘美的战利品
  rationale: 保留原文“甘美”与“掠物、战利品”之间刻意而尖锐的意象张力，不将其解释性改写。
theological_decisions:
- issue: 观看者的人称
  choice: 你们
  alternative: 他们
  rationale: 叙利亚文ܬܚܙܘܢ是第二人称阳性复数；尽管英文咨询层作“they”，此处依原文人称翻译。
- issue: 句法关系及重复的“这城”
  choice: 将后半句理解为“看见”的内容，并保留第二次“这城”
  alternative: 将“因她手所行的恶”及其后内容全部作为独立说明
  rationale: 原文句法压缩且标点为后设；正文给出通顺理解，脚注保留其他可行切分，避免把歧义悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以“这城”和阴性代词“她”保留城市人格化意象，并保留“甘美的战利品”这一不寻常比喻的张力。正文中的脚注标记[a]、[b]均已对应列出。
