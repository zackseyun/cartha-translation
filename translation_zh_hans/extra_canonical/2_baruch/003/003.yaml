review_pass:
  verdict: revise
  source_fidelity: 应修订。现有叙利亚语底本的前半句逐字呈现两个由“我不能／我做不到”（ܠܐ ܡܫܟܚ ܐܢܐ）支配的不定式结构，意为“与众人一同死去”和“与我的会众一同死去”。正文采用“离弃你一半的子民”虽符合英语审校轨迹所保留的一种解释，却未反映所给叙利亚语的表层措辞；该解释应置于脚注。末句的ܒܝܫܬܗ可指灾祸、苦难或祸患，不能在正文中无保留地具体化为“遭毁灭”。
  naturalness: 修订后的句子保持庄重、自然的现代书面汉语。以“无法看见”直译“不能看见”，避免加入原文未明说的“忍受”与“亲眼”等强化成分。
  terminology: “我的心”可自然传达ܢܦܫܝ在此处的内在感受；“我的会众”保留ܟܢܘܫܬܝ（集会／会众）的群体性，而不把它解释为某一特定宗教制度。“我母亲”应保留为原文隐喻。
  issues:
  - severity: high
    issue: 正文前半句采用“我不能离弃你一半的子民”。
    rationale: 所给叙利亚语可见的ܕܐ̈ܡܘܬ…ܥܡ ܣܓܝܐ及ܕܐܡܘܬ ܥܡ ܟܢܘܫܬܝ，表层意思是“我不能与众人同死，也不能与我的会众同死”。在无进一步校勘证据支持改写时，应以该底本措辞为正文，并将英语审校轨迹中的另一解释列为脚注。
  - severity: medium
    issue: “遭毁灭”过度限定ܒܝܫܬܗ。
    rationale: 该词基本义为灾祸、苦难或恶事。虽然邻近上下文涉及城的毁灭，但本节本身宜保留较宽的“灾祸”，不将语境性推论写死为正文含义。
  - severity: low
    issue: “忍受亲眼看见”增添了原文未明说的强化语义。
    rationale: 原文为“我的心（魂）不能看见我母亲的灾祸”；“无法看见”已足以表达其哀痛与不能承受的语境。
  revised_text: 因为这两件事都令我难以承受：我不能与众人一同死去，也不能与我的会众一同死去；我也无法看见我母亲所遭的灾祸。[a]
  revised_footnotes:
  - marker: a
    text: 本节前半句的叙利亚语文本及断句存在困难。也可译作：“我不能离弃你一半的子民。”末句“灾祸”直译可指苦难、祸患或恶事。
    reason: 正文按所给叙利亚语底本中“与众人一同死去”和“与我的会众一同死去”的表层措辞翻译；脚注保留英语审校轨迹所见的另一种解释，并说明末句词义范围。
  revision_rationale: 依原文优先原则，将现有叙利亚语底本清楚可见的“同死”双重表达恢复为正文；将“离弃你一半的子民”作为因文本和断句困难而产生的替代解释置于脚注。并将末句改为较不限定的“灾祸”，保留原词的语义开放性和“母亲”这一隐喻。
