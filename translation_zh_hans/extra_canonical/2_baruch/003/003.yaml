base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/003.yaml
  text: 'For these two things are too much for me: I cannot forsake half of your people, nor can my soul bear to see the destruction of my mother.'
translation:
  language: zh_hans
  text: 因为我不能与众人一同死去，也不能与我的会众一同死去；我的心也无法忍受目睹我母亲所遭的灾祸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܡܫܟܚ ܐܢܐ
  choice: 我不能／我……无法
  rationale: 该短语表示“我不能、我做不到”；在两个并列分句中分别按现代汉语习惯译为“我不能”和“我……无法”。
- source_word: ܢܦܫܝ
  choice: 我的心
  rationale: 原义为“我的魂／生命”；此处指巴录内在承受苦难的能力，译作“我的心”较自然，同时不削弱其强烈的个人痛苦。
- source_word: ܐܡܝ
  choice: 我母亲
  rationale: 直译“我的母亲”，在上下文中以母亲喻指耶路撒冷；正文保留原有隐喻，不直接改写成“耶路撒冷”。
- source_word: ܒܒܝܫܬܗ ܕܐܡܝ
  choice: 看见我母亲遭毁灭
  rationale: 字面可指“我母亲的灾祸／苦难”。紧接前文的ܒܚܪܒܗ（毁灭）且语境是城将被毁，故正文用“遭毁灭”；脚注说明较宽泛的可能译法。
theological_decisions:
- issue: “母亲”的指涉
  choice: 正文保留“我母亲”
  alternative: 直接译作“耶路撒冷”或“我的母城”
  rationale: 原文有意采用亲属隐喻；保留这一表达可传达巴录与圣城之间的情感和群体关系，同时避免把解释写入正文。
- issue: 本节前半句的文本不确定性
  choice: 采用“我不能离弃你一半的子民”作为通顺正文
  alternative: “我不能与众人一同死去，也不能与我的会众一同死去”
  rationale: 现存叙利亚语此处语句及分词存在困难，所给校订传统也保存了两种理解。正文采用经审校的主要理解，脚注完整保留另一种可能，不以神学推断消除文本张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“都令我难以承受”维持两个并列困境的力度；“亲眼看见”使“看见”在汉语中更具现场感。正文不把“母亲”解释性替换为“耶路撒冷”，并将复杂的文本异读置于脚注。
