  text: And I said, “O Lord, my Lord, have I come into the world for this, that I should see the evil of my mother? No, my Lord.
translation:
  language: zh_hans
  text: 我说：“主啊，我的主啊，我来到世上，难道就是为了看见我母亲[a]所遭的灾祸吗？不，主啊！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我母亲”指拟人化的耶路撒冷或锡安。
    reason: 帮助现代读者辨明隐喻所指，同时在正文中保留原文的母亲意象。
lexical_decisions:
- source_word: ܐܬܝܬ ܠܥܠܡܐ
  choice: 我来到世上
  rationale: 依据校勘所指出的实际叙利亚文读法，保留“来到世上”的出生、生存意象，不采用受页面识读错误影响的“我曾求问”。
- source_word: ܒܝܫܬܗ̇
  choice: 她所遭的灾祸
  rationale: 此处指临到拟人化母亲的祸患，而非她自身的道德邪恶；这样译既符合哀歌语境，也与下一节表示毁灭的另一词语相区别。
- source_word: ܐܡܝ
  choice: 我母亲
  rationale: 直译母亲意象，保留巴录将耶路撒冷／锡安人格化所产生的亲密感与悲痛，不在正文中解释性改写为“我的城”。
- source_word: ܡܪܝܐ ܡܪܝܐ
  choice: 主啊，我的主啊
  rationale: 以自然庄重的现代汉语再现重复呼告及其个人关系色彩。
theological_decisions:
- issue: “我母亲”的所指
  choice: 正文保留“我母亲”，脚注说明指拟人化的耶路撒冷／锡安。
  alternative: 在正文直接译作“我的城”或“锡安”。
  rationale: 母亲隐喻是这段哀诉的重要神学与诗性意象；保留它可避免把原文的情感张力解释掉。
- issue: “来到世上”的修辞作用
  choice: 理解为巴录悲痛地追问自己活在世上的意义。
  alternative: 理解为他曾提出某项请求。
  rationale: 经校勘确认的叙利亚文支持“来到世上”；疑问表达哀痛和困惑，并不等于否认上帝的主权。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“难道就是为了……吗”自然传达反问；末句用感叹号表现强烈恳求，但不额外增添神学解释。
