  yaml_path: translation/extra_canonical/2_baruch/023/001.yaml
  text: And I answered and said, “No, Lord, my Lord.” And he answered and said to me, “Why are you troubled about what you do not know, and why are you disturbed over matters of which you are ignorant? For just as you have not forgotten those who now exist and those who have passed away, so I remember those who are to come. For when Adam sinned and death was decreed for those who would be born, then the multitude of those who would be born was numbered, and for that number a place was prepared, where the living might dwell and the dead might be kept. Unless, therefore, that number which was appointed beforehand is completed, the creature will not live again. For my Spirit is the giver of life, and Sheol receives the dead. Moreover, it has been granted to you to hear what will come after these times. For my salvation has truly drawn near, and is not as far off as it was before.”
translation:
  language: zh_hans
  text: 我回答说：“不，主啊，我的主。”他回答我说：“你为什么因自己不知道的事忧虑，又为什么为自己不了解的事不安呢？正如你没有忘记现今活着的人和已经逝去的人，我也记得那些将要来的人。因为亚当犯罪时，死亡就被判定临到那些将要出生的人；那时，将要出生之人的总数已经数定，并且为这数目预备了一个地方，让活人居住，让死人被收存。因此，除非那预先定下的数目满了，受造界就不会重新活过来。因为我的灵[a]赐予生命，而阴间[b]收纳死人。此外，你已蒙准听见这些时期以后将要发生的事。因为我的救恩确实已经临近，不再像从前那么遥远。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“气息”；原词兼有这两方面的含义。
    reason: 保留ܪܘܚܝ在生命气息与神圣之灵之间的词义张力。
  - marker: b
    text: “阴间”指死者所在之境；原文为“示奥勒”，不专指坟墓，也不应直接等同于后世所说的地狱。
    reason: 保存第二圣殿时期犹太末世观中的死亡领域概念。
lexical_decisions:
- source_word: ܡܥܝܪ
  choice: 忧虑
  rationale: 表达内心受扰的状态，同时不过度强化为惊恐；与随后“不安”的平行表达自然区分。
- source_word: ܡܢܝܢܐ
  choice: 总数
  rationale: 保留末世论语境中由上帝预先定下的完整数额，而不只表示数算这一动作。
- source_word: ܫܝܘܠ
  choice: 阴间
  rationale: 用现代中文圣经语域中较为通行的词指死者所在之境，避免窄化为坟墓或等同于后世所说的地狱。
- source_word: ܦܘܪܩܢܐ
  choice: 拯救
  rationale: 自然承载上帝施行解救的广义含义，不擅自限定为某一种后来的教义术语。
- source_word: ܪܘܚܝ
  choice: 我的灵
  rationale: 保留神圣说话者所拥有、并赐予生命的灵，同时以脚注说明“灵／气息”的词义张力。
theological_decisions:
- issue: 亚当犯罪与后来人类之死亡判定的关系
  choice: 死亡就被判定临到那些将要出生的人
  alternative: 亚当的后裔从此被定为必死
  rationale: 保留文本的群体性和判定意味，同时不引入原文范围以外、体系化的原罪或遗传罪责表述。
- issue: “我的灵”所表达的赐生命行动
  choice: 因为我的灵赐予生命
  alternative: 因为我的气息使人活着
  rationale: 保留神圣主体的生命赐予行动，却不把该句过度界定为后期三一论术语；脚注同时保留“气息”的可能含义。
- issue: 受造者再次活过来
  choice: 受造之物就不会再次活过来
  alternative: 受造界就不会复生
  rationale: 保留单数集合性表达及复活意味，不明确限定为全体宇宙或仅指人类。
