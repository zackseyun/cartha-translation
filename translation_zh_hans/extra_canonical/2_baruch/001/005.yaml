  yaml_path: translation/extra_canonical/2_baruch/001/005.yaml
  text: And my people will be chastened, and the time will come when they will seek the prosperity of their times.”
translation:
  language: zh_hans
  text: “我的子民必受惩戒；时候将到，那时[a]他们必寻求自己时代的福祉。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“时候将到，他们必寻求……”
    reason: 叙利亚文以两个并列的“并且”连接分句；正文按自然汉语表达为“那时”，但原文也可保留并列结构。
lexical_decisions:
- source_word: ܡܬܪܕܐ
  choice: 必受惩戒
  rationale: 该词表示受到责罚、管束或纠正；“受惩戒”兼顾惩罚与纠正之意，也符合本段审判语境。
- source_word: ܡܘܨܠܚܘܬܗܘܢ
  choice: 他们……的福祉
  rationale: ܡܘܨܠܚܘܬܐ 可指兴盛、顺遂、成功或福祉；“福祉”保留较宽泛的正面含义，不把它收窄为物质繁荣。
- source_word: ܕܙܒܢܝ̈ܗܘܢ
  choice: 自己时代的
  rationale: 直译为“他们的时代（诸时期）的”；保留其不寻常的属格关系，不擅自解释为某个特定的蒙福时期。
theological_decisions:
- issue: 子民受惩戒的性质
  choice: 受惩戒
  alternative: 受管教／受责罚
  rationale: 原文既含责罚意味，也可能含纠正意味；“惩戒”可容纳两者，不预先判定这里只是父性的管教或纯粹的刑罚。
- issue: “他们时代的福祉”所指为何
  choice: 保留概括而含混的表达
  alternative: 他们将来时代的繁荣／适合他们时代的福乐
  rationale: 原文没有明确说明这是末世福乐、政治复兴还是一般顺遂，因此不作神学上的具体化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“自己时代的福祉”略显陌生，是为保留叙利亚文原句本身不寻常且含义未定的表达。
