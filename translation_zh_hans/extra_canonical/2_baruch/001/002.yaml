base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/002.yaml
  text: “You have seen all that this people has done to me; the evil that these two tribes that remain have done is greater than that of the ten tribes that were taken captive.”
translation:
  language: zh_hans
  text: “你看见了这百姓对我所做的一切；留下来的这两个支派所行的恶，比被掳去的十个支派所行的更大。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝܬ
  choice: 你看见了
  rationale: 按叙利亚语完成式直译，并保留上帝对巴录说话的第二人称形式。
- source_word: ܥܡܐ ܗܢܐ
  choice: 这百姓
  rationale: 采用自然且庄重的现代汉语，保留指示词的语气。
- source_word: ܬܪ̈ܬܝܢ ܫܪ̈ܒܢ
  choice: 这两个支派
  rationale: ܫܪܒܐ 在此指以色列的支派；复数配合数词译为“两个支派”。
- source_word: ܕܐܫܬܚܪܝ
  choice: 留下来的
  rationale: 保留被动／状态含义，即这两个支派仍然存留，未擅自具体化为犹大和便雅悯。
- source_word: ܕܐܫܬܒܝܘ
  choice: 被掳去的
  rationale: 准确表达被俘、被带走的被动含义。
- source_word: ܝܬܝܪ ܡܢ
  choice: 比……更大
  rationale: 将叙利亚语比较结构完整呈现，使中文句法清楚自然。
theological_decisions:
- issue: 两个支派与十个支派的罪恶比较
  choice: 所行的恶……更大
  alternative: 所行的恶更多／更严重
  rationale: 原文使用比较结构，却未限定比较的是数量还是严重程度；“更大”保留这种概括性的判断和神学张力。
- issue: “向我所做”中的第一人称所指
  choice: 保留“向我”
  alternative: 明确译作“得罪我／得罪上帝”
  rationale: 直接保留神谕的第一人称措辞，不把行为预先解释为某一种具体罪行。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留神谕直接引语。分号呈现原文两个紧密相关的分句，并补足中文比较句所需的谓语。
