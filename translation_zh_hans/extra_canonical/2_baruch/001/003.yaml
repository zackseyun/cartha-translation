  yaml_path: translation/extra_canonical/2_baruch/001/003.yaml
  text: For the former tribes were compelled by their kings to sin, but these two tribes themselves desired to sin and compelled their kings to sin.
translation:
  language: zh_hans
  text: 因为先前的各支派受他们的君王强迫而犯罪；但这两个支派却甘愿犯罪[a]，并强迫他们的君王犯罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“催促（他们的君王犯罪）”。
    reason: 相关词形及文本传统容许按语境将该词理解为对君王的催促；正文采用表达这些支派主动意愿的读法。
lexical_decisions:
- source_word: ܫܪ̈ܒܬܐ ܩܕ̈ܡܝܬܐ
  choice: 先前那些支派
  rationale: 按上下文指此前被掳的十个支派；译文保留原文较概括的“先前”表达，不擅自补明“十个”。
- source_word: ܐܬܐܠܨܘ
  choice: 被……逼迫
  rationale: 该被动动词表达外在强制，与后半句这些支派主动影响君王形成鲜明对照。
- source_word: ܚܨܘ
  choice: 自己想要犯罪
  rationale: 依校勘与修订所反映的读法，表达意愿或选择；补出语境中省略的“犯罪”，使现代汉语意思完整，同时以“自己”凸显主动性。
- source_word: ܐܠܨܘ
  choice: 逼迫
  rationale: 与前半句同一词根的被动形式相呼应，保留“受君王逼迫”与“逼迫君王”的反转结构。
theological_decisions:
- issue: 支派与君王在犯罪中的责任
  choice: 保留前者受君王逼迫、后者主动想要犯罪并逼迫君王的对比
  alternative: 将两者都笼统译为受到诱导或彼此影响
  rationale: 原文刻意对照外在强迫与主动意愿，不应削弱其关于责任的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以分号保持原句的对照结构，并避免补入原文未明说的历史说明。
