base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/004.yaml
  text: Therefore behold, I am bringing evil upon this city and upon its inhabitants, and it will be removed from before me for a time, and I will scatter this people among the nations, that they may be servants to the nations.
translation:
  language: zh_hans
  text: 因此，看哪，我要使灾祸临到这城和其中的居民；这城必暂时从我面前被挪去。我要把这百姓分散在列国中，使他们对列国有益。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对列国有益”：叙利亚文也可理解为“使列国得益”。有译本依据不同读法译作“作列国的仆人”。
    reason: 所给叙利亚文本与英语审校层的底本说明不一致；脚注交代词义和文本读法差异，而正文优先服从当前原文证据。
lexical_decisions:
- source_word: ܒܝܫܬܐ
  choice: 灾祸
  rationale: 此处指神将降下的祸患或灾难，而非抽象的道德之“恶”；“灾祸”在现代汉语中自然且保留审判语气。
- source_word: ܘܬܬܬܪܝܡ ܡܢ ܩܕܡܝ
  choice: 必……从我面前被挪去
  rationale: 按被动式动词及介词短语直译，保留城市被移离神面前的空间性和神学张力，不擅自解释为毁灭或弃绝。
- source_word: ܥܕ ܙܒܢܐ
  choice: 暂时
  rationale: 字面为“直到一个时候”，汉语以“暂时”简洁表达其有限时段；不限定具体期限。
- source_word: ܡܒܕܪ
  choice: 分散
  rationale: 准确表达把百姓散布到列国之中的动作，并与经文常见的离散语汇相符。
- source_word: ܢܘܬܪ
  choice: 有益
  rationale: 依所给叙利亚文辅音文本，按使役义理解为“使……得益、对……有益”；其单数形式以集合名词“这百姓”为主语。此读法优先于英语审校层所据、但未见于当前叙利亚文本的“作仆人”。
theological_decisions:
- issue: 百姓被分散后的作用
  choice: 使他们对列国有益
  alternative: 使他们作列国的仆人
  rationale: 当前提供的叙利亚文末词是ܢܘܬܪ，并非修订说明所称的ܢܗܘܘܢ ܥܒܕܝܢ；故正文按现存来源证据译作“有益”，不把受役于列国的解释写入正文。
- issue: “从我面前被挪去”的对象与程度
  choice: 保留被挪去的表述
  alternative: 译作“被我弃绝”或“被毁灭”
  rationale: 原文没有明确说永久弃绝或彻底毁灭，并以“直到一个时候”限制时段，因此保留原有含混与暂时性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事—先知体。“看哪”保留原文提示语的郑重感；“这城”“这百姓”“列国”延续经文语域。主文中的脚注标记[a]与脚注对应。
