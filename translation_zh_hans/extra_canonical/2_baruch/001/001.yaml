base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/001.yaml
  text: In the twenty-fifth year of Jeconiah king of Judah, the word of the Lord came to Baruch son of Neriah, saying, / and He said to him,
translation:
  language: zh_hans
  text: 犹大王耶哥尼雅在位第二十五年，主的话临到尼利亚的儿子巴录[a]，说[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临到”也可译作“降在……身上”。
    reason: 保留介词 ܥܠ 所含“在……之上”的空间意象。
  - marker: b
    text: 或译：“主对他说”。原文直译为“并对他说”。
    reason: 原文没有在这一分句重新明说主语，可能按语法承接“主的话”，也可按语义理解为主。
lexical_decisions:
- source_word: ܗܘܐ ܒܫܢܬ ܥܣܪܝܢ ܘܚܡܫ ܕܝܘܟܢܝܐ ܡܠܟܐ ܕܝܗܘܕܐ
  choice: 犹大王耶哥尼雅第二十五年
  rationale: 贴近叙利亚文的纪年表达，不擅自补入“在位”，因为原文只说“耶哥尼雅……的第二十五年”。
- source_word: ܗܘܐ ܦܬܓܡܗ ܕܡܪܝܐ ܥܠ
  choice: 主的话临到
  rationale: 采用现代汉语先知性叙事中的自然表达；ܥܠ 本义为“在……之上”，其方向和降临意象在脚注中保留。
- source_word: ܒܪܘܟ ܒܪ ܢܪܝܐ
  choice: 尼利亚的儿子巴录
  rationale: 按亲子关系明确表达，并采用现代中文圣经中常见的人名音译。
- source_word: ܘܐܡܪ ܠܗ
  choice: 说
  rationale: 原文直译为“并对他说”；正文用“说”自然衔接后文，同时避免强行判定说话者在语法上是“主的话”还是“主”。
theological_decisions:
- issue: “并对他说”的主语
  choice: 正文译作“说”而不明示主语
  alternative: “主对他说”或“主的话对他说”
  rationale: 叙利亚文承接“主的话临到”，但神学语义可理解为主亲自发言；省略显式主语既符合汉语表达，也保留原文的语法与神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。纪年句保持原文的简练，不添加“在位”；末尾用冒号引出下一节的直接话语。
