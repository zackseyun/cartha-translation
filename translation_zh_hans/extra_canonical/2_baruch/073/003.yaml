  text: And no one will again die before his time, nor will any sudden adversity come to pass.
translation:
  language: zh_hans
  text: 再也没有人未到寿数便死，也不会有任何突如其来的灾祸临到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܢܡܘܬ ܕܠܐ ܒܙܒܢܗ
  choice: 没有人未到寿数便死
  rationale: 字面意为“不在自己的时候死”；依上下文表达为未到应有寿数而早逝，既保留时间含义，也符合现代汉语。
- source_word: ܡܕܡ ܡܥܝܩ
  choice: 任何……灾祸
  rationale: ܡܥܝܩ 表示造成困苦、压迫或痛苦之事；在此末世安宁的语境中，“灾祸”自然且涵盖面适当。
- source_word: ܢܓܕܫ
  choice: 临到
  rationale: 该动词有发生、遭遇之意；以“临到”表达灾祸发生在人身上。
- source_word: ܣܡܡܠܐ
  choice: 突如其来的
  rationale: 底本此词读法与意义不完全确定；结合英文审校层的 sudden，谨慎译为“突如其来的”，不进一步限定灾祸类型。
theological_decisions:
- issue: “自己的时候”是否指神所命定的死期
  choice: 译为“未到寿数”
  alternative: “不按自己的时候死”或“未到命定的时候便死”
  rationale: 原文强调死亡不会提前发生，但未明说是谁命定其时；避免加入“命定”等更强的神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“再也”承接上一节对未来安宁景象的描述；全句保留原文两个并列否定分句。
