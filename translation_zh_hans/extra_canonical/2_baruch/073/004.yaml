base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/073/004.yaml
  text: And judgments, and accusations, and contentions, and retaliations, and bloodshed, and cravings, and envy, and hatred, and everything like these will pass away into condemnation when they are removed.
translation:
  language: zh_hans
  text: 审判、控告、争竞、报复、流血、贪欲、嫉妒、仇恨，以及一切类似的事，都必在被除去时归于定罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归于定罪”一句的叙利亚文较难确定，也可理解为“被除去时必被判为有罪”。
    reason: 原文末句的动词关系与表达方式不寻常，宜向读者保留真实的翻译不确定性。
lexical_decisions:
- source_word: ܕ̈ܝܢܐ
  choice: 审判
  rationale: 保留该词关于司法裁断或审判行为的基本含义，并与后续一连串社会性恶行并列。
- source_word: ܡܕ̈ܝܢܝܘܬܐ
  choice: 控告
  rationale: 此词处于司法与争端语境，可指诉讼、指控；“控告”在现代汉语中简明自然。
- source_word: ܚܪ̈ܝܢܐ
  choice: 争竞
  rationale: 表达争执、冲突之意；“争竞”比“争论”更能涵盖敌对性的纷争。
- source_word: ܬܒ̈ܥܬܐ
  choice: 报复
  rationale: 该词可涉及追讨、索偿或报复；在这一恶行清单中，“报复”最符合语境，同时不扩写具体形式。
- source_word: ܕܡܐ
  choice: 流血
  rationale: 字面为“血”，但在恶行清单中惯指流人血或血腥暴力，译作“流血”更符合汉语表达。
- source_word: ܪ̈ܓܝܓܬܐ
  choice: 贪欲
  rationale: 原词指强烈欲望或私欲；“贪欲”保留其负面伦理色彩，又不把范围收窄为单一类型的欲望。
- source_word: ܚܣܡܐ
  choice: 嫉妒
  rationale: 对应嫉妒、妒忌的常见含义。
- source_word: ܣܢܐܬܐ
  choice: 仇恨
  rationale: 直接表达敌意与憎恨，符合现代庄重汉语。
- source_word: ܠܚܘܝܒܐ ܢܬ̈ܪܝܡܢ ܟܕ ܢܫ̈ܬܩܠܢ
  choice: 都必在被除去时归于定罪
  rationale: 尽量保留原句中“定罪”与“被移除”之间不寻常的关系，不擅自解释为恶人受罚或单纯说这些恶行消失。
theological_decisions:
- issue: “定罪”所指的对象与动作关系
  choice: 保留为这些恶事“在被除去时归于定罪”
  alternative: 译为“这些事都将被定罪并彻底消失”或“行这些事的人都将被定罪”
  rationale: 叙利亚文的语法主语承接所列各事，并未明说是“行这些事的人”；因此不把审判对象改成人，也不把两个动作强行整理成明确的先后关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。全句保持原文列举式节奏；使用“争竞”“贪欲”等普通宗教与伦理语境中可理解的词，但避免加入特定宗派解释。
