  naturalness: 原译整体庄重流畅，并列结构也自然。“焦虑必平息”虽自然，但为忠实原文，改为“安宁必显现”更妥；“从世人中逃去”改为“从人间逃离”更符合现代汉语搭配。
  terminology: “医治”“露水”“疾病”“叹息”“欢喜”“全地”均为合宜、清楚且不带宗派色彩的用语。“苦难”可保留以对应困苦／悲惨（ܕܘܝܐ）；“安宁”对应ܢܝܚܐ，避免把安息、平静的正面图景窄化为心理焦虑的止息。
