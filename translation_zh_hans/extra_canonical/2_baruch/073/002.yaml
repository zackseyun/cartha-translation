  yaml_path: translation/extra_canonical/2_baruch/073/002.yaml
  text: And then healing will descend in dew,[b] and anxiety will be quieted, and misery and disease and groanings will flee from the sons of men; and gladness will be in all the earth.
translation:
  language: zh_hans
  text: 那时，医治将随着露水降下[a]，安宁必显现；苦难、疾病和叹息必从人间逃离，欢喜必遍及全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“医治必如露水降下”或“医治的露水必降下”。原文中“医治”与“露水”的句法关系略有歧义。
    reason: 保留原文意象关系的真实句法弹性，不在正文中作过度确定的解释。
lexical_decisions:
- source_word: ܒܘܣܡܐ
  choice: 医治
  rationale: 该词在此语境指康复、疗愈；译作“医治”既保留行动意味，也符合末世更新的语境。
- source_word: ܛܠܐ
  choice: 露水
  rationale: 按其通常词义直译，保留原文以露水描绘生命与复苏的意象。
- source_word: ܢܝܚܐ ܒܫܠܝܐ
  choice: 焦虑必平息
  rationale: 底本文字传递安静、止息之意；用现代汉语自然表达内在不安归于平静。
- source_word: ܕܘܝܐ ܘܟܘܪܗܢܐ ܘܐܢܚ̈ܬܐ
  choice: 苦难、疾病和叹息
  rationale: 依次保留三项并列的人间祸患，不将它们合并为笼统的“痛苦”。
- source_word: ܚܕܘܬܐ
  choice: 欢喜
  rationale: 表达公开而普遍的喜乐；“欢喜”比“快乐”更符合庄重的经文语体。
theological_decisions:
- issue: 医治与露水之间的句法关系
  choice: 正文译作“医治必如露水降下”
  alternative: “医治必在露水中降下”或“医治的露水必降下”
  rationale: 叙利亚文介词结构可作方式或伴随理解；正文采用自然的比喻表达，脚注保留其他可能，避免把意象关系解释得过死。
- issue: 末世福乐的范围
  choice: “欢喜必遍及全地”
  alternative: “全地都必欢喜”
  rationale: 保留原文中“欢喜”作为临到全地之现实的表达，不额外界定其对象或神学阶段。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“世人”自然对应“人的众子／人类”；并列短句保持原文宣告式节奏。
