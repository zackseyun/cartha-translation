  text: For these are the things that filled this world with evils, and because of these the life of mankind was greatly troubled.[c]
translation:
  language: zh_hans
  text: 因为正是这些事使这世界充满祸患，也正因这些事，世人的生活深受搅扰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些事”指上文所列的诉讼、争端、冲突、报复、流血、欲望、嫉妒、仇恨等事。
    reason: 本节以指示语承接上一节的清单；补注可使单独阅读本节的读者明确所指，而不把解释加入正文。
lexical_decisions:
- source_word: ܗܢܝܢ ܐܢܝܢ ܓܝܪ
  choice: 因为正是这些事
  rationale: 保留叙利亚文的解释性连接和强调语气，并自然承接上文所列各项。
- source_word: evils（英语审校层所反映的源文语义）
  choice: 祸患
  rationale: “祸患”既可涵盖道德之恶造成的后果，也符合本段关于纷争、流血、嫉妒和仇恨的语境；避免把含义仅限于抽象的“邪恶”。
- source_word: life of mankind（英语审校层所反映的源文语义）
  choice: 世人的生活
  rationale: 采用现代汉语中自然、庄重且易懂的表达，指全体人类的现实生活。
- source_word: greatly troubled（英语审校层所反映的源文语义）
  choice: 深受搅扰
  rationale: 表达持续而严重的不安与困苦，不额外限定为外在灾难或内心痛苦。
theological_decisions:
- issue: 世界祸患与人类困苦的因果关系
  choice: 用两个“正是这些事”明确保留原句的双重因果强调
  alternative: 将后半句弱化为一般性的并列结果
  rationale: 原句把世界充满祸患和人类生活受扰都归因于上文所列之事；译文不将其扩展成特定的罪论体系。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“祸患”与“深受搅扰”保持经文语体，同时让普通读者容易理解。现存源页的行文跨页且文字识别较混乱，因此以可辨认的叙利亚文承接结构为先，并参考已审校的英语层确认本节语义范围。
