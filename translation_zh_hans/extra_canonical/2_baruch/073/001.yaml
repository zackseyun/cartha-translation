  yaml_path: translation/extra_canonical/2_baruch/073/001.yaml
  text: And it shall be, after he has brought low all that is in the world, and has sat down in peace forever on the throne of his kingdom, then joy will be revealed, and rest will appear.[a]
translation:
  language: zh_hans
  text: 事情将会这样：他使世上的一切都降卑，并在他国度的宝座上永远安然坐下之后，喜乐就要显露，安息也要出现。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的“他”承接上文所说的弥赛亚。原文以并列的显现性动词描述喜乐和安息；译文分别作“显露”和“出现”，以保留这种表达。
    reason: 帮助读者辨明代词所指，并更准确说明译文保留原文对喜乐与安息的显现性表述。
lexical_decisions:
- source_word: ܡܟܟ / ܡܟܝܟܐ（本段相关词形）
  choice: 使……降卑
  rationale: 保留叙利亚文“使低下、使降卑”的动作含义，不弱化为泛指的“制服”或“除去”
- source_word: ܚܕܘܬܐ
  choice: 喜乐
  rationale: 采用庄重而通俗的名词，表达公开显现的欢欣状态
- source_word: ܢܝܚܐ
  choice: 安息
  rationale: 该词可指休息、安宁；此处与弥赛亚国度的和平景象相连，“安息”兼顾具体与神学语境而不额外限定
- source_word: ܢܬܚܙܐ
  choice: 出现
  rationale: 按被动/反身语态表达“被看见、显现”，不添加造成这一状态的方式
theological_decisions:
- issue: “他”的身份
  choice: 正文保留代词“他”
  alternative: 直接译为“弥赛亚”
  rationale: 上下文指向弥赛亚，但本节表述以代词承接前文；保留代词可避免把上下文解释直接写入正文
- issue: 国度宝座上的状态
  choice: “永远安然坐下”
  alternative: “永远作王”
  rationale: 保留坐在宝座上与和平安宁的双重意象，不把动作解释性改写为“作王”
- issue: 喜乐与安息的显现
  choice: 分别译作“显露”和“出现”
  alternative: 统一译作“临到”
  rationale: 保留源文视觉性的显现措辞及两个并列动词，不将其解释为单纯的时间性来临
translation_notes:
  register: 采用现代标准普通话，句式庄重但易懂；以“降卑、宝座、喜乐、安息”等词保留末世国度图景，并避免补入特定宗派解释。
