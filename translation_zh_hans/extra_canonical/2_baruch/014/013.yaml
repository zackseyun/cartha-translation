  source_fidelity: 译文忠实保留了本节所呈现的几个核心成分：他们无惧地离开现今世界，并在信赖与喜乐中等候领受上帝所应许的世界。将 ܥܠܡܐ 两次均译为“世界”，保留了原文有意形成的今世／应许之世界的对应，而未越界解释为固定教义术语。
