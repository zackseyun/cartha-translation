  text: Therefore they leave this world without fear, and with trust and gladness they wait to receive the world that you promised them …
translation:
  language: zh_hans
  text: 因此，他们无所畏惧地离开这个世界，怀着信赖和喜乐[a]，等候领受你应许给他们的世界……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“满怀信赖，欢喜地等候”。
    reason: 原文中“信赖”采用副词性表达，并与“在喜乐中”共同修饰“等候”；两种汉译的侧重点略有不同。
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: 世界
  rationale: 保留原文“世界／世代”的末世性张力；本句以离开现今世界和领受所应许的世界相对照，译作“世界”自然且不预先限定其具体形态。
- source_word: ܬܟܝܠܐܝܬ（据校勘所反映的副词形式）
  choice: 怀着信赖
  rationale: 表达对上帝的信靠状态，同时避免汉语读者误解为“信赖喜乐”本身。
- source_word: ܒܚܕܘܬܐ
  choice: 和喜乐
  rationale: 保留喜乐作为伴随等候的心态，并与“信赖”并列，形成自然、庄重的现代汉语。
- source_word: ܡܣܟܝܢ
  choice: 等候
  rationale: 既呈现期待，也不把原文强化为焦躁或确定时点的盼望。
theological_decisions:
- issue: 所应许之“世界”的性质
  choice: 你应许给他们的世界
  alternative: 你应许给他们的来世
  rationale: 采用“世界”以保存原文对现今世界与所应许世界的对照，不直接将其教义化为特定的“来世”概念。
- issue: 信赖与喜乐的句法关系
  choice: 怀着信赖和喜乐，等候
  alternative: 满怀信赖，欢喜地等候
  rationale: 原文可将两个成分都理解为修饰“等候”的状态；正文以并列方式保留这种关系，脚注列出更偏副词化的自然译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“无所畏惧地离开这个世界”与“等候领受……世界”构成清楚对照；保留句末省略号，以反映所给经文文本的延续状态。
