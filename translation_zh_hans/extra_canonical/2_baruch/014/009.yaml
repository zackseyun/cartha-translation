  text: Or who among mortals can find the beginning and the end of your wisdom?
translation:
  language: zh_hans
  text: 世人中谁能找到你智慧的起始和终结呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “找到”也可译作“探明”。
    reason: 原词基本义为“找到、发现”，在本语境中也可理解为追索并探明界限。
lexical_decisions:
- source_word: ܡܫܟܚ
  choice: 能找到
  rationale: 该动词的基本义是“找到、发现”，这里指人无法寻得或确定上帝智慧的起始与终结；“能找到”既贴近原词，也符合现代汉语表达。
- source_word: ܫܘܠܡܐ
  choice: 终结
  rationale: 该名词可表示“结束、终点、完成”；与“起始”相对时译作“终结”最为自然，并保留智慧不可穷尽的语意。
- source_word: ܚܟܡܬܟ
  choice: 你的智慧
  rationale: 保留第二人称单数所属形式，不增添原文未明说的神学限定。
theological_decisions:
- issue: 上帝智慧是否被表述为绝对无始无终
  choice: 以反问表达世人无法找到其起始和终结
  alternative: 直接断言“你的智慧无始无终”
  rationale: 原文采用人的能力受限这一反问方式，并未直接作形而上的定义；译文保留这种修辞和神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“世人中谁能……”保留原文反问语气；“起始和终结”形成清楚对举。
