base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/014/011.yaml
  text: 'For as a breath rises without intention and vanishes, so is the nature of men: they do not go by their own will, and they do not know what will happen to them in the end.'
translation:
  language: zh_hans
  text: 因为气息并非出于自己的意愿升起，随即消散；人的本性也是如此：他们并不是凭自己的意愿离去，也不知道最终会有什么事临到自己。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܒܠܐ
  choice: 气息
  rationale: 该词可指气息、风气或虚空之气；此处与“升起、消散”的意象相连，译作“气息”最自然，也保留生命短暂、无法自主的比喻。
- source_word: ܨܒܝܢܐ
  choice: 自己的意愿
  rationale: 表达人的意志或意愿；上下两处都强调人不能自主决定气息的升起或自己的离去。
- source_word: ܟܝܢܐ
  choice: 本性
  rationale: 指人类共有的性质或生存情状；译作“本性”贴近原词，同时不额外解释为特定神学概念。
- source_word: ܐܙܠܝܢ
  choice: 离去
  rationale: 字面可作“去、行去”；在气息消散及人生终局的语境中，“离去”既自然，又保留可能指死亡而未直说死亡的含蓄。
theological_decisions:
- issue: 人的意志与生命终局之间的关系
  choice: 保留“并不是凭自己的意愿离去”的直接陈述
  alternative: 解释为“人不能自行决定死亡的时候”
  rationale: 原文着重人的非自主性，但没有把命题系统化；正文不补入时间、预定等超出本节的神学说明。
- issue: “离去”是否明确译成“死亡”
  choice: 保留比喻性的“离去”
  alternative: 译作“死去”
  rationale: 气息升起又消散的比喻使死亡意味清楚，但原有含蓄值得保留，以免消除文学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；以分号连接气息的比喻和对人类处境的说明。“随即消散”体现动作短暂迅速，“临到自己”自然表达不可预知的最终遭遇。
