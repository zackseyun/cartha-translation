  text: who did not seek the vanity of the dead, but desired you, and did not turn their hearts to what is small and passing,
translation:
  language: zh_hans
  text: 他们不寻求死者的虚妄[a]，却渴慕你，也不把心转向琐小而易逝的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不寻求死者”。
    reason: 保留该属格短语可作简短理解的译法；正文则依据叙利亚语读法保留“虚妄／空幻”这一名词。
lexical_decisions:
- source_word: ܣܪܝܩܘܬܐ ܕܡܝ̈ܬܐ（据校勘所指的叙利亚语读法）
  choice: 死人的虚空
  rationale: 保留“虚空、空幻、徒然”这一核心名词，不简化为“死人”；“死人的”维持原文属格关系及其可能的语义张力。
- source_word: ܨܒܝܢ
  choice: 渴慕
  rationale: 表达强烈的意愿和向往；在以神为宾语时，比普通的“想要”更自然庄重。
- source_word: ܙܥܘܪܘ…（与短暂、消逝相关的表述）
  choice: 渺小而转瞬即逝的事
  rationale: 以自然现代汉语同时传达卑微微小与短暂无常的双重含义。
- source_word: ܠܒܗܘܢ
  choice: 他们的心
  rationale: 按原文保留“心”作为意志与取向的中心，不抽象改写为“思想”。
theological_decisions:
- issue: “死人的虚空”是否应解释成直接“寻求死人”
  choice: 正文保留“死人的虚空”
  alternative: 不寻求死人
  rationale: 现有源文校勘证据明确包含“虚空／徒然”名词；正文不应删去它，也不应擅自把该短语限定为招魂或求问亡灵。另以脚注保留较简短的异译。
- issue: “渴慕你”的对象
  choice: 保留第二人称“你”
  alternative: 渴慕上帝
  rationale: 原文祷告语境直接向上帝说话；保留人称可维持话语形式，不把解释性称谓写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“反而”清楚呈现否定与肯定之间的对照；分号保留诗性祷告句的平衡结构。
