  yaml_path: translation/extra_canonical/2_baruch/014/003.yaml
  text: For what profit is there in this, or what is worse than these things that we have seen, that we should desire to wait to see?
translation:
  language: zh_hans
  text: 这有什么益处呢？还有什么比我们已经看见的这些事更糟，以至于我们还想等着去看呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以至于我们还想期待着看见呢？”
    reason: ܡܣܟܢܝܢ 可表示“等待”或“期待”，原文末尾的动词组合也保留了一定的句法歧义。
lexical_decisions:
- source_word: ܝܘܬܪܢܐ
  choice: 益处
  rationale: 该词指利益、好处；“益处”符合庄重而通俗的现代汉语表达。
- source_word: ܕܒܝܫ
  choice: 更糟
  rationale: 这里是比较结构，所指不限于道德意义上的“恶”，译作“更糟”更贴合巴录对所遭遇之事的哀叹。
- source_word: ܡܣܟܢܝܢ
  choice: 等着
  rationale: 该词在此可表达等待或期待；正文采用“等着”，与前面的意愿动词连用较自然，同时不把对象解释得过于具体。
theological_decisions:
- issue: 末句连续出现意愿、等待与观看的表达，句法略显突兀
  choice: 以至于我们还想等着去看呢？
  alternative: 以至于我们还想期待着看见呢？
  rationale: 保留原文“想—等待—看”的语义链和反问张力，不擅自补出“更坏的事”或其他宾语。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。首句保留简短反问，次句尽量维持叙利亚文中“看见—想—等待—看见”的重复与张力；不根据上下文擅自补明所期待看见的具体内容。
