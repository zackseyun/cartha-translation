translation:
  language: zh_hans
  text: 因为我们都变得如同气息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”也可理解为“雾气”或“虚空”，强调短暂易逝。
    reason: 源词语义范围较宽，脚注保存其真实歧义而不使正文生硬。
lexical_decisions:
- source_word: ܗܒܠܐ (heblā)
  choice: 气息
  rationale: 该词可指气息、雾气，也可引申为虚空、短暂；本句以比喻表达人的脆弱易逝，“气息”既贴近基本意象，也保留其短暂无常的含义。
- source_word: ܟܠܢ（由句意及校勘层所反映的“我们都”）
  choice: 我们都
  rationale: 保留全称范围，表明说话者将自己与众人一并包括在内。
- source_word: ܗܘܝܢ／同源系词结构（由句意重建）
  choice: 成了
  rationale: 用现代汉语自然表达状态的形成，同时不额外解释这种状态是受造、受罚或死亡所致。
theological_decisions:
- issue: “气息”是否应解释为“虚空”
  choice: 正文保留具体意象“气息”
  alternative: “虚空”或“雾气”
  rationale: “虚空”容易将本句抽象化并强化特定神学判断；“气息”更能保留源词的形象性及其关于人生短暂、脆弱的开放张力。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“如气息一般”略带诗性，符合祷告语境，也避免口语化的“像一口气”。
