  text: 'But I will speak before you: What more have those who knew you and did not walk in vanity like the rest of the nations gained?'
translation:
  language: zh_hans
  text: 但我要在你面前说：那些认识你、没有像其余各族一样行在虚妄中的人[a]，究竟多得了什么益处呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有像其余的人一样行在虚妄中”。
    reason: 所据文本在此处传抄或版面转录不够清晰；另一种理解不明确指出“各族”。
lexical_decisions:
- source_word: ܐܡܠܠ ܩܕܡܝܟ
  choice: 我要在你面前说
  rationale: 保留向上帝直接陈说的庄重语气，也自然衔接后面的反问。
- source_word: ܡܢܐ ܝܬܝܪ
  choice: 究竟多得了什么益处呢
  rationale: 将“什么更多”按现代汉语表达为反问，同时保留比较意味，不把问题改写成绝对的“得了什么”。
- source_word: vanity（叙利亚文相应短语在所给页面转录中残缺）
  choice: 行在虚妄中
  rationale: “虚妄”兼具徒然、空幻与偏离正道的含义；采用“行在”保留行为和生活道路的意象。
- source_word: of the nations（叙利亚文相应短语在所给页面转录中残缺）
  choice: 其余各族
  rationale: 保留经校订确认的民族群体对比；“各族”比“列国”更适合此处泛指诸民族。
theological_decisions:
- issue: 认识上帝之人的所得与其他民族的对比
  choice: 保留反问“究竟多得了什么益处呢”
  alternative: 解释为义人并未得到任何益处
  rationale: 原句表达巴录的困惑和质问，并未在本节直接给出教义答案；译文不预先消解这种神学张力。
- issue: “虚妄”是生活方式还是内在观念
  choice: 译作“行在虚妄中”
  alternative: 译作“存着虚妄的意念”
  rationale: 保留原文所反映的行为性表达，并避免将含义局限为思想状态。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷式陈说语体。“但我要在你面前说”保留直面上帝的语气；反问句维持原文的哀诉与张力。
