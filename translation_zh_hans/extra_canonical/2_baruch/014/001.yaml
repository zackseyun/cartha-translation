  yaml_path: translation/extra_canonical/2_baruch/014/001.yaml
  text: Then I answered and said, “Behold, you have shown me the course of the times, and what is to happen after these things, and you have told me that the retribution which was spoken of by you will come upon the nations.
translation:
  language: zh_hans
  text: 于是我回答说：“看哪，你已经向我显明了诸时代的进程，以及这些事以后将要发生的事；你也告诉我，你所说的报应将临到列国。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你也将那要来的报应告诉了我。”
    reason: 保留一种较简略的句法理解；正文则依据叙利亚文及控制材料明确表达“你所说的”和“临到列国”两个成分。
lexical_decisions:
- source_word: ܐܘܪܚܐ
  choice: 进程
  rationale: 此处所指并非普通道路，而是末世异象中诸时代依次展开的过程；“进程”既保留道路意象的延伸义，也符合现代汉语表达。
- source_word: ܦܘܪܥܢܐ
  choice: 报应
  rationale: 该词具有偿还、追讨和司法性惩治的意味；“报应”能保留神按行为施行回报的审判力度，不把它弱化为一般的“结果”。
- source_word: ܥܡܡ̈ܐ
  choice: 列国
  rationale: 语境指受审判的众民族或诸国；“列国”简洁庄重，也保留群体性的政治与民族含义。
theological_decisions:
- issue: 巴录所述是否只是一般性的未来预告
  choice: 保留“你所说的报应将临到列国”，突出先前宣告、未来施行及受审对象。
  alternative: 泛化为“你把将来的报应告诉了我”。
  rationale: 源文及校勘控制材料支持“由你说过”和“临到列国”两个要素；保留它们能呈现本节关于神圣审判的具体张力，而不将其化为模糊的未来灾祸。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“看哪”保留启示文学中引人注意的语气；以“诸时代的进程”表达末世时间秩序，避免生硬直译为“道路”。
