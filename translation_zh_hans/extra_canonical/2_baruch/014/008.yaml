  text: Or who can learn your judgment, or search out the depth of your way, or calculate the weight of your path, or comprehend your counsel which cannot be grasped?
translation:
  language: zh_hans
  text: 谁能明白你的判决，探究你道路的深处，衡量你路径的分量，又领会你那无法测透的谋略呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 叙利亚文抄本的分节位置并不十分明确；末句“又领会你那无法测透的谋略呢”也可能划入下一节。
    reason: versification_uncertainty
lexical_decisions:
- source_word: ܕܝܢܟ (reconstructed from the poorly preserved/OCR-corrupted line; cf. English audit layer “your judgment”)
  choice: 你的判决
  rationale: 在向上帝发问的语境中，“判决”既保留司法意味，也比“判断”更清楚地指上帝所作的裁定。
- source_word: ܥܘܡܩܐ ܕܐܘܪܚܟ (source wording reflected in the audited reconstruction)
  choice: 你道路的深处
  rationale: 直译其空间隐喻，不把“道路”解释成某一特定教义概念。
- source_word: ܬܘܩܠܐ ܕܫܒܝܠܟ (source wording reflected in the audited reconstruction)
  choice: 你路径的分量
  rationale: 保留“重量/分量”的原有隐喻；“分量”在现代汉语中比“重量”用于抽象路径更自然，同时没有消解原文张力。
- source_word: ܬܪܥܝܬܟ ܕܠܐ ܡܬܕܪܟܐ
  choice: 你那无法测透的谋略
  rationale: ܬܪܥܝܬܐ 可指心意、筹算或谋略；此处与“无法领会”搭配，译作“谋略”自然且保留上帝旨意不可穷尽之意。
- source_word: ܡܫܟܚ ܠܡܐܠܦ / ܡܕܪܟ
  choice: 明白／领会
  rationale: 按各分句宾语分别采用自然汉语：判决可“明白”，谋略可“领会”；避免机械重复，同时保持连续反问。
theological_decisions:
- issue: 上帝的判决与谋略是否被描述为绝对不可知
  choice: 译为人无法穷尽、测透，而非断言人对其全然无知
  alternative: 译成“无人能够知道你的判决或旨意”
  rationale: 原文的连续反问强调人的认知有限以及上帝道路深不可测；不应扩大为否认一切启示或认识的可能。
- issue: “道路”和“路径”的所指
  choice: 保留两个近义路径意象
  alternative: 统一解释为“救赎计划”或“治理方式”
  rationale: 原文没有明确限定其神学所指，保留意象可维护真正的语义开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续使用“明白、探究、衡量、领会”呈现原文递进式反问；保留“道路的深处”和“路径的分量”这两个有意而富张力的隐喻。
