  text: And now I know that many have sinned and lived, and only a few will remain in those times to whom these words may be spoken.
translation:
  language: zh_hans
  text: 现在我知道，许多人犯了罪，并随自己的心意活着；而在那些日子，存留的人很少；在那些日子，已经说过的话将要应验。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܛܘ
  choice: 犯了罪
  rationale: 按叙利亚语完成式直译，保留已经犯罪的含义。
- source_word: ܚܝܘ
  choice: 仍活着
  rationale: 原词基本义为“活着”；加“仍”自然呈现其与“犯了罪”之间的反差，但不引申为蒙赦免。
- source_word: ܡܫܬܚܪܝܢ
  choice: 剩下
  rationale: 在末后时期的语境中表达“存留、余剩”，用现代汉语“剩下”清楚自然。
- source_word: ܡ̇ܠܐ ܐܝܠܝܢ ܕܐܡܝܪ̈ܢ
  choice: 这些话
  rationale: 保留复数“话语”的指称，并以“这些”承接上下文。
theological_decisions:
- issue: 犯罪后仍然活着所含的神学意义
  choice: 译作“犯了罪，却仍活着”
  alternative: “犯了罪并活着”
  rationale: “却”呈现原句中的张力，但不把继续存活解释为赦免、称义或神的认可。
- issue: 少数存留者的身份
  choice: 不说明他们为何或如何存留
  alternative: 称他们为“余民”
  rationale: 原句只陈述人数少且存留到那些日子；避免加入具有特定神学含义的身份标签。
- issue: 话语与存留者的关系
  choice: “可以向他们说这些话”
  alternative: “这些话将在他们身上应验”
  rationale: 依照所给源文与审校层所支持的言说关系，不将其改释为预言应验。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“到了那些日子”自然表达时间背景；分号保留前后两项之间的对照。
