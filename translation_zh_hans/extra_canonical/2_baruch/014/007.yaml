  text: Or who, O Lord, knows your judgment? Or who can search out the depth of your way?
translation:
  language: zh_hans
  text: 主啊，又有谁能明白你的审判？谁能探究你道路的深奥？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܟ (dinak)
  choice: 你的审判
  rationale: ܕܝܢ可指审判、判断或裁决；此处是向主发问，译作“审判”既贴近词义，也保留神学语境中的庄重感。
- source_word: ܠܡܘܟܡܘ / ܥܘܡܩܐ ܕܐܘܪܚܟ（据校勘所反映的读法）
  choice: 探究你道路的深奥
  rationale: 以“探究”表达彻底查明，以“道路的深奥”保留原文“你道路之深度”的意象，而不将其解释性地改写为某一具体旨意。
- source_word: ܐܘ
  choice: 又有谁
  rationale: 原文承接前文的并列反问；“又”在现代汉语中自然体现这一衔接，比句首孤立的“或”更符合中文表达。
theological_decisions:
- issue: 人能否穷尽神的审判与道路
  choice: 保留两个反问句，不补入“无人能够”等结论性措辞
  alternative: 译为陈述句：“无人能明白你的审判，也无人能探究你的道路。”
  rationale: 原文借反问表达人的认识限度；保留句式可维持其修辞力度与神学张力，避免把含蓄的反问直接解释成断言。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“明白”比“知道”更能表达对审判的理解，“探究……深奥”则兼顾原文意象和现代读者的可读性。
