  text: But the righteous may rightly hope for the end, and they depart from this dwelling without fear, because they have with you a store of works kept in treasuries.
translation:
  language: zh_hans
  text: 但义人有理由盼望终局；他们离开这居所时毫无惧怕，因为他们在你那里有善行积存于宝库中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܕܝ̈ܩܐ（据本节文本传统复原）
  choice: 义人
  rationale: 采用犹太启示文学中自然且通行的称谓，指行义、蒙上帝认可的人。
- source_word: ܫܘܠܡܐ（据本节文本传统复原）
  choice: 终局
  rationale: 既可表达结束，也保留末世性指向；比单纯的“死亡”或“结局”更能避免过早限定所指。
- source_word: ܥܘܡܪܐ（据本节文本传统复原）
  choice: 居所
  rationale: 保留人生或身体如暂居之所的意象，不直接解释为“身体”或“世界”。
- source_word: ܥܒ̈ܕܐ（据本节文本传统复原）
  choice: 善行
  rationale: 上下文指可积存的正义行为；补出“善”使现代汉语语义明确，但不扩展为功德体系。
- source_word: ܒܝܬ ܓܙܐ / ܓܙ̈ܐ（据本节文本传统复原）
  choice: 宝库
  rationale: 保留天上储藏、受保管的形象，并与“积存”自然搭配。
theological_decisions:
- issue: 义人盼望的对象
  choice: 终局
  alternative: 死亡／末日
  rationale: 原意可能兼含个人生命结束与末世终结；译作“终局”保留这种张力，不将其限缩为其中之一。
- issue: 善行与上帝认可之间的关系
  choice: 直译为善行在上帝那里积存于宝库中
  alternative: 解释为凭功德换取救恩
  rationale: 保留经文本身的奖赏与积存意象，不加入关于称义、功德或救恩机制的宗派性说明。
- issue: 第二人称“你”所指
  choice: 保留“你”
  alternative: 明译为“上帝”
  rationale: 上下文的受话者显然是上帝，但保留原有直接祷告式称呼，更贴近话语形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有理由”对应其盼望的正当性；分号保持两层陈述的紧密关系。所给叙利亚文页面存在错行、重叠及节号定位不稳，本节措辞据章节文本传统与经审核的英文咨询层交叉重建，未把不确定处伪装成逐字可见的页面读法。
