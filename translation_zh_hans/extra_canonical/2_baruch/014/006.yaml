translation:
  language: zh_hans
  text: 善行[a]是为谁寻求的？先知又是为谁赐下的[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行善的劳苦”。
    reason: 原文词组可直译为“善的劳苦”，既可理解为善行，也可强调为善而付出的劳苦。
  - marker: b
    text: “赐下”直译为“被寻见”或“被找到”。
    reason: 保留叙利亚文动词的字面意义及其与语境化译法之间的差异。
lexical_decisions:
- source_word: ܥܡܠܐ ܕܛܒܬܐ
  choice: 善行
  rationale: 该词组字面可指“善的劳苦／行善的劳苦”，正文采用自然简洁的“善行”，并以脚注保留字面层面的歧义。
- source_word: ܢܫܬܟܚ
  choice: 赐下
  rationale: 该动词的基本义是“被找到／被寻见”，在先知为人而出现、供人领受的语境中译作“赐下”较自然；脚注保留其字面读法。
- source_word: ܡܬܒܥܝܢ
  choice: 寻求
  rationale: 保留原文“寻找、寻求”的语义，而不将其进一步解释为“要求”或“期望”，以免消解句中的张力。
theological_decisions:
- issue: 先知与善行是为谁而设的反问
  choice: 保持两个并列反问，不明确指定答案
  alternative: 补出“为百姓”或“为义人”等隐含对象
  rationale: 原文以反问保留对象上的开放性；补出特定群体会加入原文没有明说的神学限定。
- issue: 先知的出现是否表述为上帝主动赐予
  choice: 正文用“赐下”，脚注注明字面为“被寻见”
  alternative: 正文直译“被寻见”
  rationale: “赐下”符合上下文功能且现代汉语自然，但原动词本身未直接使用“赐予”，故以脚注避免把解释冒充唯一意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以两个平行反问呈现原句结构；不补出原文未明说的受益群体。
