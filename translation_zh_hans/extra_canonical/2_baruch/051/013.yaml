  yaml_path: translation/extra_canonical/2_baruch/051/013.yaml
  text: For the first will receive the last, those for whom they were waiting; and the last, those of whom they had heard that they had passed away.
translation:
  language: zh_hans
  text: 因为先来的将接纳后来的人，就是他们所等候的人；后来的人也将接纳先来的，就是他们曾听说已经离世的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先来的”和“后来的人”的具体所指，本句没有进一步限定。
    reason: 保留原文的对举及其开放指涉，不预先界定为特定世代、群体或死亡先后。
lexical_decisions:
- source_word: ܩܕܡܝܐ / ܐܚܪܝܐ（据本节传本文意）
  choice: 先来的／后来的人
  rationale: 保留时间次序及群体对举，不擅自解释为特定世代、身份或救赎等级。
- source_word: ܢܩܒܠܘܢ（据本节传本文意）
  choice: 迎接
  rationale: 在复活者彼此相认、相会的语境中，“迎接”比单纯“接受”自然，同时不额外加入团聚或奖赏等概念。
- source_word: ܡܣܟܝܢ（据本节传本文意）
  choice: 一直等候
  rationale: 表达持续期待之意，使现代汉语通顺，并与前后两组人的关系保持清楚。
- source_word: ܡܝܬܘ / ܥܒܪܘ（传本所反映的死亡表达）
  choice: 已经离世
  rationale: 以庄重而易懂的现代汉语表达死亡；不将其弱化为普通离开，也不预先解释死后状态。
theological_decisions:
- issue: “先来的”与“后来的人”所指为何
  choice: 保留为未具体界定的两组人
  alternative: 明确解释为早逝者与末世仍活着的人，或旧约与末世世代
  rationale: 本句着重两组人在复活时相迎；原有对举本身并未要求锁定某种宗派性或时代论身份。
- issue: 相迎是否暗示复活者彼此辨认
  choice: 按句面呈现双方相迎，但不扩展论述
  alternative: 明说所有复活者都能完全认出彼此
  rationale: 上下文确有彼此相认的主题，但本节不宜承担超出原句的系统性结论。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。用重复的“先来的／后来的人”显明交叉对应关系；“迎接”贴合复活相会的上下文。
