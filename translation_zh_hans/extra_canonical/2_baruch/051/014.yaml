  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: zh_hans
  text: 因为他们已经脱离了这个苦难的世界，卸下了忧患的重担。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: 世界
  rationale: 按其通常含义译为“世界”，与本章末世性语境相符。
- source_word: ܬܫܢܝܩܐ
  choice: 苦难
  rationale: 该词表示折磨、痛苦或患难；此处用“苦难”自然概括现世所受的困苦。
- source_word: ܝܘܩܪܐ / ܡܘܒܠܐ（本节对应表达）
  choice: 重担
  rationale: 保留“负重”的具象隐喻，并与“卸下”自然搭配。
- source_word: ܐܘܠܨܢܐ / ܥܩܬܐ（本节对应表达）
  choice: 忧患
  rationale: 表达多重困厄和压迫，既有外在苦楚，也不排除内心愁苦。
theological_decisions:
- issue: “脱离”所指的状态
  choice: 不进一步说明是死亡、复活还是末世得救的具体阶段
  alternative: 明确译成“因死亡而离开”或“已经得救脱离”
  rationale: 原句强调从苦难世界中获得释放；为保留上下文中的末世张力，不加入原文未明说的教义限定。
- issue: 完成体的时间意味
  choice: 译作“已经脱离了……卸下了”
  alternative: 译作“将要脱离……卸下”
  rationale: 顺承该节所描述之人的既成释放状态，同时不额外规定其实现的精确时间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“苦难的世界”和“忧患的重担”保留原句的平行结构及负重意象，普通读者易于理解。
