  yaml_path: translation/extra_canonical/2_baruch/051/001.yaml
  text: And it shall be, after that appointed day has passed, that then the form of those who are condemned will be changed, and also the glory of those who are vindicated.
translation:
  language: zh_hans
  text: 那指定的日子过去以后，被定罪之人的形态，以及被判为义之人的荣光，都将改变。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܨܘܪܬܗܘܢ
  choice: 形态
  rationale: 保留末世转变语境中的具体含义；“形态”比“外貌”更能涵盖整个人的存在样式，又不把转变的性质解释得过细。
- source_word: ܐܙܕܩܘ
  choice: 被判为义
  rationale: 保留该词的司法和裁断意味，同时避免用“称义”引入后世特定神学体系的固定含义。
- source_word: ܫܘܒܚܬܗܘܢ
  choice: 荣光
  rationale: 此处与被改变的形态并列，指蒙认可者在末世显出的荣耀状态；“荣光”自然地保留了启示文学的庄重色彩。
- source_word: ܗܘ ܝܘܡܐ
  choice: 那指定的日子
  rationale: 依上下文将其理解为已经定下的末世之日；“指定”保留其既定性而不擅自明确指定者或事件细节。
theological_decisions:
- issue: 义人的司法地位
  choice: 译作“被判为义”，保留末世审判中获得有利裁断的含义。
  alternative: 称义；证明为义；被证实为义人
  rationale: 这里强调与被定罪者相对的审判结果；译文不把这种裁断归入后世任何特定的救恩论框架。
- issue: 形态改变的性质
  choice: 只陈述“形态……将改变”，不说明是本体改变、外貌改变，还是成为天使。
  alternative: 外貌将改变；本质将改变；将变成天使
  rationale: 本节本身只断言转变，并未精确界定其机制或范围，因此保留这种张力。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“以及……都……”使两个并列主语的共同谓语明确；不保留英文旧脚注中实质重复的另译，以免制造并不存在的译义差别。
