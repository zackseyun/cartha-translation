  text: For what then did men lose their life, and for what did those on the earth exchange their soul?
translation:
  language: zh_hans
  text: 那么，人是为了什么而丧失生命的[a]？地上的人又拿自己的灵魂换取了什么呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，人为什么丧失生命呢？”
    reason: 原文疑问表达既可理解为询问目的或所得，也可自然理解为询问原因。
lexical_decisions:
- source_word: ܚ̈ܝܐ
  choice: 生命
  rationale: 指人的生命或性命；与后半句“灵魂”形成原文中的平行而不完全等同的表达。
- source_word: ܢܦܫܗܘܢ（据本节校勘文本所反映的表达）
  choice: 自己的灵魂
  rationale: 保留“生命”与“灵魂”的词汇区别，不把两者静默合并，也不预先界定其形而上含义。
- source_word: ܚܠܦ / ܡܚܠܦ（据本节校勘文本所反映的词根）
  choice: 拿……换取
  rationale: 以自然汉语表达交换、以一物换另一物的意义，并保留反问的力度。
- source_word: ܡܢܐ
  choice: 为了什么／什么
  rationale: 该疑问词在上下文中可表达“为何”或“为了什么”；正文采用后者，以贴近两分句的目的或所得之反问。
theological_decisions:
- issue: “生命”与“灵魂”是否应译成同一概念
  choice: 分别译作“生命”和“灵魂”
  alternative: 两处都译作“生命”或“性命”
  rationale: 原文所依据的词汇区分具有潜在神学张力；译文不应擅自消除这种区别。
- issue: 首句是在询问原因还是目的／所得
  choice: 正文译为“为了什么”
  alternative: “为什么”
  rationale: 这样既与后句“换取了什么”形成修辞平行，也不把问题仅限定为因果解释；脚注保留原因式理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人”作泛指；两个反问句保留原文的平行结构。由于所给叙利亚文页面是章节范围材料，且本节末尾在摘录中不完整，措辞同时参考了该节经审核的英文咨询层，但关键语义按叙利亚文词汇与结构加以控制。
