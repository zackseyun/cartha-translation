base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/007.yaml
  text: But for those who have been saved by their works, and for whom the law was hope, and understanding an expectation, and wisdom a confidence, wonders will appear in their time.
translation:
  language: zh_hans
  text: 但那些因自己的行为而得救的人——律法是他们的盼望，悟性是他们的期待[a]，智慧是他们的倚靠——到了他们的时候，必有奇事向他们显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“悟性的期待”。原文此处可理解为省略系词的平行分句，也可将“悟性”和“期待”连读为一个名词短语；正文保留前一种理解。
    reason: 使脚注准确对应审校记录所保留的句法歧义，同时不改变正文的平行结构。
lexical_decisions:
- source_word: 'ܐܙܕܩܘ / consultation: have been saved'
  choice: 得救
  rationale: 保留本节关于最终蒙拯救的强烈措辞，不弱化为“得到帮助”或“被判为义”。
- source_word: 'ܥܒܕܘܗܝ / consultation: works'
  choice: 自己的行为
  rationale: “行为”自然表达人的所行；加“自己的”显明所属关系，同时不预先把它限定为礼仪行为或功德。
- source_word: 'ܢܡܘܣܐ / consultation: law'
  choice: 律法
  rationale: 采用现代中文宗教文献中通行而庄重的对应词，不擅自限定为某一条具体律例。
- source_word: 'ܣܘܟܠܐ / consultation: understanding'
  choice: 悟性
  rationale: 表达领悟和辨明的能力，并与“智慧”保持区别。
- source_word: 'consultation: expectation'
  choice: 期待
  rationale: 保留与“盼望”相近却不完全相同的平行概念。
- source_word: 'ܚܟܡܬܐ / consultation: wisdom'
  choice: 智慧
  rationale: 直接、稳定地对应源语概念。
- source_word: 'consultation: confidence'
  choice: 倚靠
  rationale: 在此平行结构中表示可供信赖的凭据，比现代语境下易被理解为心理状态的“自信”更合适。
- source_word: 'ܫܘܒ̈ܚܐ / consultation: wonders'
  choice: 奇事
  rationale: 依本节经校订的咨询文本表达超常显现；避免用“神迹”额外断定其施行方式。
- source_word: ܒܙܒܢܗܘܢ
  choice: 到了他们的时候
  rationale: 保留“他们的时候”所含的指定时刻意味，避免译成“他们的时代”而局限为历史年代。
theological_decisions:
- issue: 行为与得救的关系
  choice: 因自己的行为而得救
  alternative: 因自己的行为被称义／得蒙保全
  rationale: 原文传统及经审校的咨询层使用强烈的救赎表述；直译保留文本自身的神学张力，不以特定宗派的因信或功德体系加以改写。
- issue: 律法、悟性、智慧三个平行成分的关系
  choice: 分别译作“律法是他们的盼望，悟性是他们的期待，智慧是他们的倚靠”
  alternative: 把三者合并为一个解释性陈述
  rationale: 保留诗性平行和各名词之间的细微差别，不说明它们是得救原因、证据还是生命取向。
- issue: 奇事显现的主体
  choice: 采用无明确施事者的“必有奇事向他们显现”
  alternative: “上帝必向他们显出奇事”
  rationale: 源句未明说施事者；中文也保持这种开放性，不擅自补入上帝作语法主语。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。破折号标出三个平行分句，使长句易读；保留“因行为而得救”的原有张力，并避免添加宗派性解释。脚注标记[a]已在正文对应位置出现。
