  verdict: revise
  source_fidelity: 需修订。所给叙利亚文本对应的段落并非“因行为得救／律法是盼望／奇事显现”，而是论及在其时候蒙称义者、有悟性者、以及在心中栽种智慧之根者；继而说他们的荣光与面貌改变，并承受不朽的世界。草稿主要随英文 POB 审校轨迹而译，未反映所提供的原文页文本。
  naturalness: 原草稿中文本身通顺、庄重，平行结构也清楚；但其内容与此处原文不合。修订稿以现代书面普通话保留原文较长的关系分句和末句的目的关系。
  terminology: “蒙称义”对应 ܐܙܕܩܘ，避免把它改为“得救”；“悟性”和“智慧”保留为两个不同概念；“不朽的世界”直译 ܥܠܡܐ ܕܠܐ ܡܐ̇ܬ，不额外释作天国或永生。
  issues:
  - severity: high
    issue: 正文将本节译为“因自己的行为而得救的人……必有奇事向他们显现”。
    rationale: 提供的叙利亚文实际含有“蒙称义”“一生中有悟性”“在心里栽下智慧之根”“面貌变为其荣美之光”及“承受不朽的世界”等内容；并无草稿中的“行为”“律法是盼望”“期待”“倚靠”或“奇事”。
  - severity: high
    issue: 英文 POB 审校轨迹与所附 Ceriani 叙利亚文本不一致。
    rationale: 英文句子的词项和结构均不能由所示本节段落直接支持。为忠于指定的原文优先原则，正文须按叙利亚文修订；这一版本/经节对齐差异应由人工核查。
  - severity: low
    issue: 脚注[a]讨论“悟性、期待”的句法歧义。
    rationale: 该脚注只服务于英文审校轨迹所反映的另一种文本，和所示叙利亚文段落无对应锚点，修订后应删除。
  revised_text: 至于那些在自己的时候蒙称义、在一生中有悟性、并在心里栽下智慧之根之人的荣光，他们的荣光必在变换中得着荣耀；他们脸上的形貌必变为他们荣美的光，使他们能够取得并承受那不朽的世界。
  revised_footnotes: []
  revision_rationale: 按所附叙利亚文本重译。保留“在自己的时候”这一时间语的开放性，不补入“我的律法”；将有关荣光和面貌的连续变化译为两个并列分句，并保留末句“使……”所表达的目的/结果关系。删除无原文依据的脚注。
