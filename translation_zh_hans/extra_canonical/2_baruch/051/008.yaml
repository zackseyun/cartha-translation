  text: 因为他们将看见如今向他们隐藏的那个世界。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: 世界
  rationale: 在本章末世复活的语境中，指将要显现并由义人承受的世界；译作“世界”既保留其时代与领域的语义张力，也避免擅自具体化为“天堂”。
- source_word: ܚܙܐ（本节所据动词词形）
  choice: 看见
  rationale: 保留直接的视觉与启示意象；比“认识”或“经历”更贴近原文表达。
- source_word: 表示现今不可见或隐藏的表达
  choice: 如今向他们隐藏
  rationale: 顺应英语审校层所保存的“hidden”含义，并以自然汉语表达该世界目前未向他们显明的状态，不将其解释为不存在。
theological_decisions:
- issue: “那个世界”的性质
  choice: 保留“那个世界”
  alternative: 译作“来世”或“天堂”
  rationale: 原文语境指与现今世界相对、将来显现的世界，但本句本身未将其等同于某一更具体的教义术语；直译可保留末世论张力。
- issue: 隐藏状态的主体关系
  choice: “向他们隐藏”
  alternative: “他们现在看不见”
  rationale: 前者保留启示尚未显明的意味；后者容易仅被理解为人的视觉能力不足。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因为”承接前文论证，“将看见”呈现未来性；句式简洁，适合经文正文。
