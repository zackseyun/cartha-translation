translation:
  language: zh_hans
  text: 因为他们要先看见，随后才离去受刑罚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܚܙܘܢ（“他们将看见”）
  choice: 他们要先看见
  rationale: 保留原文“看见”未明说宾语的表达，不擅自补入所见对象；“先”与后续“随后”构成清楚的时间次序。
- source_word: ܢܐܙܠܘܢ（“他们将去／离去”）
  choice: 离去
  rationale: 按上下文表达从观看转入受罚的行动，同时不把它弱化为单纯的状态变化。
- source_word: ܠܡܫܬܢܩܘ（“受折磨／受刑罚”）
  choice: 受刑罚
  rationale: 既传达被动承受苦楚，也保留末世审判语境中的惩罚含义，措辞庄重而易懂。
theological_decisions:
- issue: “看见”的宾语
  choice: 不补明宾语
  alternative: 译作“看见义人的荣耀”或“看见审判的景象”
  rationale: 本句本身没有明确宾语；补入具体对象会消除原文留下的指涉空间。
- issue: 受苦是否带有司法审判意味
  choice: 译为“受刑罚”
  alternative: 译为“受折磨”
  rationale: 上下文涉及恶人的末后结局，“受刑罚”较能呈现审判意味；但不进一步界定刑罚的性质、期限或施行方式。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；保留原句的时间推进与“看见”宾语未明的含混性。
