  to: 因为他们为自己选择了这个必伴随着痛苦而过去的时代，也为自己选择了那个结局充满哀号和灾祸的时代；他们弃绝了那不使进入其中的人衰老的世界[a]，又弃绝了荣耀的时代，以致不能得享我先前告诉你的尊荣。
