base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/016.yaml
  text: For they chose for themselves this time that cannot pass away without anguish, and they chose for themselves that time whose end is full of laments and evils, and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they should not come to the honor of which I told you before.
translation:
  language: zh_hans
  text: 因为他们为自己选择了这个必伴随着痛苦而过去的时代，也为自己选择了那个结局充满哀号和灾祸的时代；他们弃绝了那不使进入其中的人衰老的世界[a]，又弃绝了荣耀的时代，以致不能得享我先前告诉你的尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那对进入其中的人而言永不衰老的世界。”
    reason: 说明传统将该动词按不及物意义理解的译法；正文则依叙利亚文使役、及物形式译为“不使……衰老”。
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: 世界／时代
  rationale: 该词可按语境指“世界”或“时代”；在“不使进入其中的人衰老”处译作“世界”，在时间性对举中译作“时代”，保留原文层次。
- source_word: ܡܣܐܒ
  choice: 使……衰老
  rationale: 按其使役、及物意义处理，表达那世界不会使进入其中的人衰老，而非仅说世界本身不会衰老。
- source_word: ܬܫܒܘܚܬܐ
  choice: 荣耀
  rationale: 在末世赏赐的语境中指荣耀，与后文“尊荣”相连，但不将二者强行合并。
- source_word: ܐܝܩܪܐ
  choice: 尊荣
  rationale: 体现 honor 的意义，并与“荣耀”保持词汇区分。
theological_decisions:
- issue: 不衰老的对象
  choice: 那世界不使进入其中的人衰老
  alternative: 那为进入其中的人永不衰老的世界
  rationale: 采用叙利亚文动词的使役、及物读法，保留其关于进入者免于衰老的含义。
- issue: 选择痛苦时代的主体责任
  choice: 重复“为自己选择了”，凸显其主动选择
  alternative: 他们落入了这些时代
  rationale: 原文和英语审校层均强调他们自己的选择；不把责任改写为被动遭遇。
- issue: 末世赏赐的表达
  choice: 不能得享……尊荣
  alternative: 不得救／不能进入天堂
  rationale: 不以体系化神学术语替代原文较具体的“来到／获得尊荣”，避免超出文本。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号呈现两组“选择”与“弃绝”的平行关系；保留“时代—世界—荣耀—尊荣”的语义张力，不加入宗派性解释。
