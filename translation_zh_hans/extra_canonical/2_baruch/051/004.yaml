  yaml_path: translation/extra_canonical/2_baruch/051/004.yaml
  text: And above all, those who come after will be grieved, because they despised my law and stopped their ears so that they would not hear wisdom or receive understanding.
translation:
  language: zh_hans
  text: 尤其是后来的人，必大为悲痛，因为他们藐视我的律法，堵住耳朵，不肯听智慧，也不肯领受悟性。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܬܝܪܐܝܬ ܢܬܬܙܝܥܘܢ
  choice: 必大为悲痛
  rationale: 该短语含“更甚地被震动、深受搅扰”之意；结合审判语境，译作“大为悲痛”既自然，也保留强烈的内在震动。
- source_word: ܢܡܘܣܝ̈
  choice: 我的律法
  rationale: ܢܡܘܣܐ 指律法、法度；原文带第一人称所属意义，译为“我的律法”。
- source_word: ܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
  choice: 堵住耳朵
  rationale: 直译为“封住他们的耳朵”，是拒绝聆听的形象表达；中文用“堵住耳朵”自然清楚。
- source_word: ܚܟܡܬܐ
  choice: 智慧
  rationale: 保留其关于神圣教诲与正确生活之智慧的宽泛含义。
- source_word: ܣܘܟܠܐ
  choice: 悟性
  rationale: 该词表示理解、洞察；“悟性”与前文“智慧”相配，又不把两词合并为同一概念。
theological_decisions:
- issue: 拒绝律法、智慧与悟性之间的关系
  choice: 保留三个彼此关联但有区别的表达
  alternative: 将全句概括为“拒绝上帝的教导”
  rationale: 原文分别提到藐视律法、不听智慧、不领受悟性；逐项保留可避免削弱其伦理和认知层面的张力。
- issue: 人的主动拒绝
  choice: 用“藐视”“堵住”“不肯”体现主动抗拒
  alternative: 译成较被动的“没有听见、没有明白”
  rationale: 原文描写的是有意拒绝，而非单纯缺乏机会或能力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不肯”连续用于后两个分句，凸显主动拒绝；整体保持经文式节奏，但避免生硬的逐词直译。
