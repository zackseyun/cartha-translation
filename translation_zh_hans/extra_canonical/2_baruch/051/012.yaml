  text: 那时，义人的卓越将胜过天使的卓越。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܬܝܪܘܬܐ（据本节连续文本复原）
  choice: 卓越
  rationale: 表达义人在末后所得地位或荣美的超越性，同时避免将其过度限定为道德、能力或外在荣耀。
- source_word: ܙܕܝܩ̈ܐ（据本节连续文本复原）
  choice: 义人
  rationale: 采用自然、庄重且通行的圣经汉语称谓。
- source_word: ܥܝܪ̈ܐ／ܡܠܐܟ̈ܐ（天使称谓，依连续文本传统）
  choice: 天使
  rationale: 现代普通读者易懂，并保留与属天受造者比较的原意。
theological_decisions:
- issue: 义人的卓越超过天使的比较关系
  choice: 直译为“义人的卓越将超过天使”
  alternative: “义人将比天使更荣耀”
  rationale: 保留原句所说的“卓越”这一较宽泛概念，不把比较关系缩窄为单指荣耀，也不解释其本体论含义。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；“那时”承接末世性上下文，“将”体现未来指向。所给叙利亚文页段在本节起始处截断，因此措辞结合章节连续文本证据与经审核的英文咨询层谨慎拟定。
