base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/003.yaml
  text: But as for the glory of those who have now been vindicated by my law—those who had understanding in their life, and those who planted in their heart the root of wisdom—their splendor will then be glorified in transformations, and the form of their face will be turned into the light of their beauty, so that they may receive the world that does not die, which is promised to them.
translation:
  language: zh_hans
  text: 至于那些在自己的时代被称为义的人[a]——他们一生有悟性，又把智慧的根栽在心里——到那时，他们的光辉必因种种变化而得荣耀；他们面容的形态必转变成他们荣耀的光，好使他们承受那不死的世界，并领受这应许给他们的世界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的叙利亚文转录作“在自己的时代被称为义”；英语审校轨迹所依据的读法则作“因我的律法被称为义”。
    reason: 所给原文转录与英语审校轨迹在此处存在实质差异；正文按所提供的叙利亚文转录翻译，并以脚注公开该差异。
lexical_decisions:
- source_word: ܐܙܕܩܘ
  choice: 被判为义
  rationale: 保留该被动词所表达的裁定、宣告为义之意，同时避免在正文中预先限定其后期教义含义。
- source_word: ܒܙܒܢܗܘܢ
  choice: 在自己的时代
  rationale: 按所提供的叙利亚文转录直译；该读法与咨询英译所依据的“因我的律法”不同，因此以脚注公开异文问题。
- source_word: ܫܘܒܠܐ
  choice: 行事有准则
  rationale: 该词可指道路、引导或生活操守；结合“在他们一生中”，译为自然且不失行动意味的表达，不径直改作“悟性”。
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: 智慧的根
  rationale: 保留原文栽种与根的鲜明比喻。
- source_word: ܙܝܘܗܘܢ
  choice: 他们的光辉
  rationale: 依经审校的句法重构保留悬置主题后的新主语，避免误把前面的“荣耀”直接当作谓语主语。
- source_word: ܒܫܘܚܠܦܐ
  choice: 在种种变化中
  rationale: 采用该段通常校读所表达的形态转变；所给版面转录在此疑有讹误或缺字。
- source_word: ܥܠܡܐ ܕܠܐ ܡܐܬ
  choice: 那不死的世界
  rationale: 贴近原文拟人式表达，而不将其平化为抽象的“永生”。
theological_decisions:
- issue: 义者蒙认可的依据
  choice: 正文按所给叙利亚文作“在自己的时代被判为义”
  alternative: “因我的律法被判为义”
  rationale: 原始语言证据优先；同时用脚注保留传统校读所呈现的律法关联，不静默消除文本张力。
- issue: 复活后身份与形态的连续性
  choice: 同时保留“他们的光辉”“面容的形态”和“变化”
  alternative: 概括为“他们将得到荣耀的身体”
  rationale: 原文既表现人格与面容的延续，也表现形态的改变；概括性的神学术语会过早解决这种张力。
- issue: 末世产业的性质
  choice: “得着并领受那不死的世界”
  alternative: “获得永生”
  rationale: 保留原文关于世界的宇宙性图景及两个并列动词，不缩减为个人得救公式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于……——……——到那时……”重现原文的悬置主题结构；“行事有准则”兼顾生活语境和ܫܘܒܠܐ的道路、引导含义。脚注标记[a]已在正文出现。
