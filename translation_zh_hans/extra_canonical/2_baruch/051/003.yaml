revisions:
- from: 至于那些在自己的时代被判为义的人[a]——他们一生行事有准则，又把智慧的根栽在心里——到那时，他们的光辉必在种种变化中得着荣耀；他们面容的形态必被照亮，成为他们荣美的光，使他们可以得着并领受那不死的世界。这些事都是应许给他们的。
  to: 至于那些在自己的时代被称为义的人[a]——他们一生有悟性，又把智慧的根栽在心里——到那时，他们的光辉必因种种变化而得荣耀；他们面容的形态必转变成他们荣耀的光，好使他们承受那不死的世界，并领受这应许给他们的世界。
  rationale: 修订以所给叙利亚文转录为优先依据，保留“在自己的时代”的时间限定和悬置主题结构；将生活中的品质还原为“悟性”，并恢复面容形态转变为荣耀之光的末世变形意象。末句明确“不死的世界”既是承受和领受的对象，也是应许的对象。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:20:35Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿正确保留了悬置主题之后以“他们的光辉”为新主语的句法，也保留了智慧之根、面容形态、变化及不死世界等核心意象。然而，“他们一生行事有准则”将原文此处所指的理解/悟性改写成行为规范；“面容的形态必被照亮，成为……”也弱化了原文由一种形态转变为荣耀之光的变化语义。末句“这些事都是应许给他们的”把所应许的对象扩展为前面一切事项，原文所修饰的是“不死的世界”。
  naturalness: 原译整体庄重顺畅，但“在种种变化中得着荣耀”和“得着并领受”略显生硬；改为“因种种变化而得荣耀”及“承受……并领受它”更清楚地呈现关系与两个并列动词。
  terminology: “被判为义”可保留其裁定性，但在此上下文以“被称为义”较为自然。鉴于所给叙利亚文页码转录明确呈现“在他们的时代/时候”，不应在正文采用英语审校轨迹的“因我的律法”，也不宜把未经提供的传统校读表述为确定的“通行校读”。
  issues:
  - severity: medium
    issue: “行事有准则”误译理解/悟性语义。
    rationale: 英语审校轨迹的“had understanding in their life”与本段语境中的智慧之根相互印证；“道路、引导或生活操守”的释义在此会将认知品质转为伦理规范。
  - severity: medium
    issue: 面容形态的“转变”为荣耀之光被弱化为“被照亮”。
    rationale: 原文的动词表达形态改变；应保留“转变成……光”的语义，而非只说受光照。
  - severity: medium
    issue: 末句的应许修饰范围不准确。
    rationale: “那不死的世界”是被应许给他们的对象；“这些事”会使应许错误地涵盖变形、光辉等全部前述内容。
  - severity: low
    issue: 脚注将未获本任务材料证实的读法称为“另一种通行校读”。
    rationale: 可中性地说明英语审校轨迹所依据的不同读法，但不应断言其通行性。
