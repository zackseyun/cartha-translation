base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/011.yaml
  text: For the expanses of Paradise will be spread out before them; and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the armies of the angels—those now held fast by my word so that they may not appear, and those kept by my command, to stand in their places until their arrival.
translation:
  language: zh_hans
  text: 乐园的辽阔境域必在他们面前展开；宝座之下众活物的威荣华美必向他们显明，天使的一切军队也必向他们显现——他们如今受我的话约束，免得显现，又受命留在本位，直到他们来临[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到他们的来临来到。”
    reason: 相应语句可较直译地理解为“直到他们的来临到来”；正文采用自然中文，并以注释保留原表达的重复式措辞。
lexical_decisions:
- source_word: Paradise（相应叙利亚语传统用语）
  choice: 乐园
  rationale: 沿用现代中文圣经语体中对末世福乐居所的常见称呼，既自然，也不将其进一步解释为“天国”或其他特定概念。
- source_word: expanses
  choice: 广阔之处
  rationale: 保留复数所表达的开阔地域感，并以自然中文呈现，不窄化为单一地点。
- source_word: living beings beneath the throne
  choice: 宝座之下众活物
  rationale: “活物”可明确指宝座周围的天上生灵，避免误解为一般“生物”或人类；“众”体现复数。
- source_word: beauty of the majesty
  choice: 威荣的华美
  rationale: 同时保留“华美”与“威荣”两个语义层面，不把二者合并为单一的“荣耀”。
- source_word: armies of the angels
  choice: 天使的一切军队
  rationale: 保留军事编制和天上众军的意象，不弱化为普通的“天使群”。
- source_word: held fast by my word
  choice: 被我的话约束
  rationale: 表达命令之言使其受限制的含义，同时避免添加锁链等原文未明说的形象。
- source_word: stand in their places
  choice: 留守本位
  rationale: 自然表达持续站在各自指定位置上的意思，并保留受命候守的色彩。
theological_decisions:
- issue: “众活物”的身份
  choice: 保留为“宝座之下众活物”
  alternative: 解释为某一特定等级的天使或基路伯
  rationale: 文本只描写其位于宝座之下，没有明确界定其天上阶级；译文不作教义化归类。
- issue: 末句“他们”的所指
  choice: 保留代词“他们”及其潜在歧义
  alternative: 明确改写为“直到义人到来”或“直到天使到来”
  rationale: 上下文中代词所指并非完全无歧义，不应由译者擅自确定。
- issue: 天使暂不显现的原因
  choice: 译为受神的话约束、奉命留守
  alternative: 解释为被囚禁或受惩罚
  rationale: 原意强调神的言语和命令所施加的限制，没有必要引入刑罚或堕落天使的观念。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话；句式保留异象文学的展开感，并用破折号区分两类受约束或奉命候守的天使。脚注标记已置于正文相应位置。
