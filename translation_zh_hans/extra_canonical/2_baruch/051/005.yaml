base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/005.yaml
  text: 'When therefore they see that those over whom they are now exalted are then exalted and glorified more than they, then these and those will be changed: the latter into the splendor of angels, but the former will waste away yet more in wonder at the visions and at the sight of the forms.'
translation:
  language: zh_hans
  text: 所以，当他们看见那些现今在他们之下的人，到那时被高举，并且比他们更为荣耀时[a]，这两类人都将改变：后者要显出天使般的光辉，前者却要因所见的异象和种种形体，越发惊愕消损。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当他们看见那些现今在他们之下的人，看见他们到那时被高举，并且比他们更为荣耀时。”
    reason: 叙利亚文可保留前置宾语，随后以从句复指该宾语；正文将其整合为自然的现代汉语句式。
lexical_decisions:
- source_word: “被高举”相关叙利亚文表达
  choice: 被高举
  rationale: 保留地位发生逆转的被动意味，不改写成较含混的“升高”。
- source_word: “天使的荣光”相关叙利亚文表达
  choice: 天使般的荣光
  rationale: 自然表达其形貌转变所呈现的光辉，同时避免把人直接等同于天使。
- source_word: “消损”相关叙利亚文表达
  choice: 惊愕消损
  rationale: 兼顾内在震骇与衰败、萎顿之意；不把它强化解释为灭亡。
- source_word: “异象／形体”相关叙利亚文表达
  choice: 所见的异象和种种形体
  rationale: 保留两个相近但并不相同的视觉对象，不将其合并为笼统的“景象”。
theological_decisions:
- issue: 两类人在末后发生改变的性质
  choice: 双方都将改变，但一方显出天使般的荣光，另一方惊愕消损
  alternative: 把“改变”仅理解为义人的荣耀转化
  rationale: 原句将改变分别落实在两类人身上；译文保留这种对称与强烈反差，不预先建构更细的复活身体教义。
- issue: “天使般的荣光”是否表示成为天使
  choice: 译作相似于天使的荣光
  alternative: 译作“变成天使”
  rationale: 源文强调光辉或荣耀的类比，不足以断定人的本体转为天使。
- issue: 前者“消损”的终局含义
  choice: 不进一步说明为灭绝或永刑
  alternative: 明确译成“灭亡”或“永远受罚”
  rationale: 保留本节措辞本身的张力，不导入文本未明说的终局体系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凌驾”保留现今两类人之间的权势反差；“后者／前者”严格对应前句两类人：后者指现今被凌驾、届时受高举者，前者指现今凌驾他人者。脚注标记[a]已置于正文相应歧义处。
