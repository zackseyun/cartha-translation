revisions:
- from: 所以，当他们看见那些现今被自己凌驾的人，到那时反而被高举，所得的荣耀也超过自己时[a]，双方都将改变：后者要显出天使般的荣光，前者却要因所见的异象和种种形体，越发惊愕消损。
  to: 所以，当他们看见那些现今在他们之下的人，到那时被高举，并且比他们更为荣耀时[a]，这两类人都将改变：后者要显出天使般的光辉，前者却要因所见的异象和种种形体，越发惊愕消损。
  rationale: 修正“被自己凌驾”的反身指代歧义，明确两群体的现今从属关系与末后反转。其余措辞维持原有的末世对照、视觉意象和不强化终局含义的处理。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:18:33Z'
review_pass:
  verdict: revise
  source_fidelity: 正文保留了两类人在末后地位逆转、双方改变，以及一方呈现天使般光辉、另一方因所见而越发消损的对照。惟“那些现今被自己凌驾的人”在汉语中把“自己”误指向该群体本身，未能准确表达“他们现今所凌驾的人”。
  naturalness: 整体庄重流畅，但“被自己凌驾”不合现代汉语指代习惯；改为“那些现今在他们之下的人”既自然，也清楚保留原文的比较关系。
  terminology: “被高举”“荣耀”“天使般的光辉”“异象”“形体”均适切。将“所得的荣耀也超过自己”调整为“比他们更为荣耀”，可避免把荣耀不必要地表述为可获得的对象，并使比较对象明确。
  issues:
  - severity: medium
    issue: “被自己凌驾的人”指代错误且表达不自然。
    rationale: “自己”通常回指该短语中的“人”，遂近似成为“被他们自己凌驾的人”；原意是主句“他们”现今凌驾于另一群体之上。
  - severity: low
    issue: 脚注的备选译文沿用了同一不自然指代，且重复“看见”使汉语句法不清。
    rationale: 脚注应呈现前置宾语后以从句复指的源语结构，同时明确主语与被凌驾者的关系。
  revised_text: 所以，当他们看见那些现今在他们之下的人，到那时被高举，并且比他们更为荣耀时[a]，这两类人都将改变：后者要显出天使般的光辉，前者却要因所见的异象和种种形体，越发惊愕消损。
