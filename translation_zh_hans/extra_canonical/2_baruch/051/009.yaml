translation:
  language: zh_hans
  text: 他们将看见如今还对他们隐藏的时间；时间也不再使他们衰老。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: 时代／时间
  rationale: 该词可指一段时期、时代或时间。前半句按所见的特定时期译作“时代”，后半句按使人衰老的时间进程译作“时间”，既符合现代汉语，也保留原句的语义关联。
- source_word: ܟܣܝ（据本节校勘范围及受审核咨询层所反映的‘隐藏’措辞）
  choice: 隐藏
  rationale: 表达该时代目前尚未向他们显明，不额外解释其具体内容。
- source_word: ܣܐܒ（据本节校勘范围及受审核咨询层所反映的‘衰老’措辞）
  choice: 使他们衰老
  rationale: 采用使役表达，保留时间作为施事者的原句形象，避免弱化为单纯的“不再变老”。
theological_decisions:
- issue: 复活后人与时间及衰老的关系
  choice: 直译为“时间也不再使他们衰老”
  alternative: “他们将不再衰老”
  rationale: 保留文本将“时间”人格化为致人衰老之力量的张力，不进一步界定复活生命是否处于时间之外。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如今还”清楚表达当前隐藏、将来显明的对照；分号保留两项应许之间的紧密联系。
