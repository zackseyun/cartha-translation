  yaml_path: translation/extra_canonical/2_baruch/051/010.yaml
  text: For they will dwell in the heights of that world, and they will be made like the angels, and be made equal to the stars; and they will be changed into every form they desire, from beauty into loveliness, and from light into the splendor of glory.
translation:
  language: zh_hans
  text: 因为他们必住在那世界的高处，变得像天使一样，与众星同等；他们也必照着自己的意愿，变成各样的形态：从美丽变为华美，从光明变为荣耀的辉煌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “那世界的高处”（据英文审校层所保存的叙利亚文语义）
  choice: 那世界的高处
  rationale: 保留空间性的复数/集合意象，不将其解释为特定的天堂层级。
- source_word: “被造得／变得像天使”
  choice: 变得像天使一样
  rationale: 以自然现代汉语表达状态转变，同时不把“像”强化为“成为天使”。
- source_word: “与众星同等”
  choice: 与众星同等
  rationale: 保留原有的比较与尊荣意象，不弱化为仅仅“如星辰般明亮”。
- source_word: “每一种他们所愿的形态”
  choice: 照着自己的意愿，变成各样的形态
  rationale: 兼顾意愿、变化和形态范围，不额外限定为身体、外貌或灵体。
- source_word: “从美丽到华美／可爱”
  choice: 从美丽变为华美
  rationale: 保留两个相近却递进的审美词，不把二者合并为单一概念。
- source_word: “荣耀的辉煌”
  choice: 荣耀的辉煌
  rationale: 保留“荣耀”与“辉煌”的叠加结构及末世性的尊荣语气。
theological_decisions:
- issue: 复活者与天使的关系
  choice: “像天使一样”
  alternative: “成为天使”
  rationale: 原意表达相似而非身份等同，故不引入人变成天使的教义判断。
- issue: “与众星同等”的含义
  choice: 直译为“与众星同等”
  alternative: 解释为“像众星一样发光”
  rationale: 保留原文可能兼具地位、荣耀和光辉的张力，不单方面限定为视觉亮度。
- issue: “各样的形态”是否指自主无限变形
  choice: 保留“照着自己的意愿”而不作机制解释
  alternative: 改写为“按神所赐的荣耀形态”
  rationale: 不添加原句未明说的限制，也不据此建立关于复活身体性质的额外教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。所给叙利亚文页面摘录在51:10正文出现前即截断，因此本节措辞以英文POB审校层所保存的句法与语义为直接控制，并与上下文关于义人形体得荣耀、面容发光及承受不朽世界的叙利亚文内容相协调；不凭空补造未展示的叙利亚词形。
