  verdict: revise
  source_fidelity: 叙利亚文将“如今作恶的人”的形貌／形态与其后所要承受的折磨相连；后半句带有目的或结果意味（“以致／好叫他们能忍受折磨”）。草稿的基本意思正确，但“使他们承受”较像单纯使役，未充分表达其“能忍受”的意味。
  naturalness: “形体……更加丑恶”可以理解，但在描述复活后外貌改变的语境中，“形貌……更加丑陋”更贴合现代汉语。“好叫他们能忍受折磨”也比“使他们承受苦刑”更顺畅。
  terminology: “形貌”对应此处的“形态、外观”，不把意义缩窄为身体实体；“折磨”对应 ܬܫܢܝܩܐ 的痛苦刑罚，避免将其具体限定为某一种司法“苦刑”。
