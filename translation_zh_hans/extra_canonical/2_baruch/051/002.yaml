  text: For the form of those who now act wickedly will become worse than it is, so that they may endure torment.
translation:
  language: zh_hans
  text: 因为那些如今作恶之人的形貌，将变得比现在更加丑陋，好叫他们能忍受折磨。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: 他们的形体
  rationale: 该词在本段复活与形貌改变的语境中指人的形态、形貌；译作“形体”既保留具体性，也避免只限于面容。
- source_word: ܒܝܫ
  choice: 更加丑恶
  rationale: 本义为“坏、恶”；用于形体时，中文译作“丑恶”较自然，同时保留其负面的道德与外观色彩。
- source_word: ܬܫܢܝܩܐ
  choice: 苦刑
  rationale: 该词表示折磨、刑罚；“苦刑”兼顾受苦与惩罚两层含义。
theological_decisions:
- issue: 恶人的形体变化与刑罚之间的关系
  choice: 译为“形体……更加丑恶，使他们承受苦刑”
  alternative: 译为“形象……变得更坏，以便忍受折磨”
  rationale: 依照叙利亚文句法保留形体恶化与承受刑罚之间的目的关系，不进一步说明变化的机制或刑罚性质。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“如今作恶之人”对应当前行为状态；“形体”与本章复活后外貌改变的上下文协调。
