- from: “你同伴[a]耶利米吩咐你的，就是这些命令吗？他说：‘我去安慰[b]在巴比伦、已经沦为俘虏的其余弟兄时，你要照看这百姓。’如今，如果你也离开我们，那么，与其让你离我们而去，不如让我们众人死在你前面。”
  to: “你的同伴[a]耶利米吩咐你的，是这些命令吗？他说：‘我去安慰[b]在巴比伦、已经被掳去的我们其余的弟兄时，你要照看这百姓。’如今，如果你也离开我们，那么，我们众人死在你之前，总比你离我们而去好。”
  rationale: 修订补足“我们的”这一人称所属关系，改善中文所属结构，并以“已经被掳去的”更自然地表达原文所指的被掳处境。其余措辞、反问形式和强烈挽留的比较句均予保留；脚注锚点及其内容无需改动。
