base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/033/001.yaml
  text: “Are these the commands that your companion Jeremiah commanded you, saying, ‘Look after this people while I go and comfort the rest of our brothers in Babylon, those who have fallen into captivity’? And now, if you also leave us, it would be better for all of us to die before you than for you to depart from us.”
translation:
  language: zh_hans
  text: “你的同伴[a]耶利米吩咐你的，是这些命令吗？他说：‘我去安慰[b]在巴比伦、已经被掳去的我们其余的弟兄时，你要照看这百姓。’如今，如果你也离开我们，那么，我们众人死在你之前，总比你离我们而去好。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同伴”也可译作“伙伴”或“友人”。
    reason: 叙利亚文ܚܒܪܟ表达密切同伴关系，但没有直接写“先知”；脚注保留其可译范围。
  - marker: b
    text: 或译“劝慰”或“鼓励”。
    reason: 叙利亚文ܐܦܝܣ的语义可涵盖劝说、鼓励和安慰，具体侧重点存在真实歧义。
lexical_decisions:
- source_word: ܦܘܩ̈ܕܢܐ
  choice: 命令
  rationale: 该词指吩咐、指令或托付；“命令”以现代汉语直接保留其权威语气。
- source_word: ܚܒܪܟ
  choice: 你同伴
  rationale: 该词通常指同伴、伙伴或友人；这里表明耶利米与巴录的密切关系，不另行加入原文没有的身份称号。
- source_word: ܚܙܝ ܠܗܘܢ ܥܡܐ
  choice: 你要照看这百姓
  rationale: 字面含“看这百姓”，在托付语境中自然表示留意、照料和看顾。
- source_word: ܐܦܝܣ
  choice: 安慰
  rationale: 该动词可表示劝说、恳劝、鼓励或安慰；流亡处境下“安慰”最合语境，同时以脚注保留词义宽度。
- source_word: ܐܚ̈ܝ
  choice: 弟兄
  rationale: 保留群体内部的亲属称谓及共同体意味；“弟兄”庄重且在现代宗教文体中清楚易懂。
- source_word: ܕܢܦܠܘ
  choice: 已经沦为俘虏的
  rationale: “落入”在这里与被掳处境相连；“沦为俘虏”自然表达其遭遇，同时不额外解释被掳的方式或神学原因。
- source_word: ܫܪܘܟ
  choice: 离开我们／离我们而去
  rationale: 该表达在哀求语境中带有离去乃至撇下众人的情感；中文用重复而略有变化的说法，保留呼求的力度。
