  yaml_path: translation/extra_canonical/2_baruch/060/001.yaml
  text: And the fifth black waters that you saw raining—these are the deeds that the Amorites did, and the spells of their enchantments that they practiced, and the wickedness of their mysteries, and the mingling of their uncleanness.
translation:
  language: zh_hans
  text: 你所看见降下的第五阵黑水，就是亚摩利人所行的事：他们所施行的邪术及其咒语、他们隐秘之事中的邪恶，以及他们污秽的混杂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fifth black waters
  choice: 第五场黑水
  rationale: 按异象中依次出现的水流理解，用“场”标明这是第五次出现的黑水，同时保留“黑水”这一核心意象。
- source_word: Amorites
  choice: 亚摩利人
  rationale: 采用现代中文圣经传统中通行的族名译法。
- source_word: spells / enchantments
  choice: 邪术和咒法
  rationale: 保留原文并列的巫术语汇，不将两者合并为单一概念；中文表达自然且易懂。
- source_word: mysteries
  choice: 隐秘之事
  rationale: 保留其隐蔽、秘密的含义，不擅自赋予后世宗教术语色彩。
- source_word: mingling of their uncleanness
  choice: 他们污秽的混杂
  rationale: 尽量保留“混杂”这一较难确定的意象及其与“污秽”的属格关系，不具体化其所指。
theological_decisions:
- issue: “隐秘之事”是否指特定宗教秘仪
  choice: 译作中性的“隐秘之事”
  alternative: 邪恶的秘仪
  rationale: 现有证据不足以断定这是技术性的宗教仪式名称，因此保留语义开放性。
- issue: “污秽的混杂”具体所指
  choice: 不作解释性展开
  alternative: 他们彼此玷污的淫乱行为
  rationale: 原措辞具有含混性，可能涉及宗教、伦理或族群层面的混合；译文不应静默限定为某一种解释。
translation_notes:
  register: 采用庄重而现代的叙述语体。句首以同位结构解释异象，冒号后列举亚摩利人的行为；保留原文的四项并列及末项的含混性。所给叙利亚文页面片段未清楚覆盖本节，因此以英语审校层所保存的本节内容为定位依据，并采取谨慎、不过度阐释的译法。
