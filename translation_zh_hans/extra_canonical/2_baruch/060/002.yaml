  yaml_path: translation/extra_canonical/2_baruch/060/002.yaml
  text: But Israel also was defiled with sins in the days of the judges, while they were seeing many signs that were done by him who made them.
translation:
  language: zh_hans
  text: 但在士师的时代，以色列也被种种罪恶玷污了；那时，他们亲眼看见造他们的那一位施行了许多神迹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Israel
  choice: 以色列
  rationale: 保留民族整体的称谓，不擅自改为“以色列人”，以维持原句的集体主体表达。
- source_word: was defiled with sins
  choice: 因种种罪恶玷污了自己
  rationale: 用反身表达自然呈现其因犯罪而陷入污秽的含义；“种种罪恶”对应复数，避免缩减为单一罪行。
- source_word: in the days of the judges
  choice: 在士师的时代
  rationale: 采用现代读者易懂、同时保留历史时期含义的表达。
- source_word: signs
  choice: 神迹
  rationale: 此处指具有神圣作为和指示意义的非凡事件；“神迹”较“记号”更符合叙事语境，但不具体限定其形式。
- source_word: him who made them
  choice: 造他们的那一位
  rationale: 保留“创造者”的迂回称谓及其所指，不直接以“上帝”替换，也不消除原文措辞的庄重感。
theological_decisions:
- issue: “造他们的那一位”的身份是否直接明说为上帝
  choice: 保留“造他们的那一位”
  alternative: 译作“创造他们的上帝”
  rationale: 上下文虽明显指向上帝，但原句使用迂回称谓；直译可保留原有修辞和神学张力，避免在正文中补出未明说的名称。
- issue: 看见神迹与犯罪之间的关系
  choice: 以分号并列，不额外加入“尽管”
  alternative: 译作“尽管他们看见……”
  rationale: 上下文具有明显反差，但连接结构本身未必明确标示让步；采用并列可让读者感受到张力而不替原文作过度解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“士师的时代”比“士师的日子”更符合当代汉语习惯；整体保留集体主体、罪污意象以及创造者的迂回称谓。现有叙利亚文页面材料属于章节范围汇集，所示片段未能清楚定位本节对应句，因此正文谨慎参照已审校的英文咨询层，不据页面中其他段落臆造词句。
