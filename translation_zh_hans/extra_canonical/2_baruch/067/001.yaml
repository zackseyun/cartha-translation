  text: And the eleventh black waters that you saw—this is the calamity that has now come upon Zion.[a]
translation:
  language: zh_hans
  text: 你所看见的第十一股黑水，就是如今临到锡安的这场灾祸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ
  choice: 黑水
  rationale: 保留异象中黑水与明水交替出现的固定意象，不将其泛化为普通的黑暗或灾难。汉语以“股”作量词，使“第十一”自然地修饰这一轮水象。
- source_word: ܫܘܚܬܐ
  choice: 灾祸
  rationale: 该词在此指临到锡安的重大灾难；“灾祸”既保持审判语境的分量，也符合现代汉语表达。
- source_word: ܗܕܐ ܗܝ
  choice: 就是……这场
  rationale: 叙利亚文使用单数指示词和系词，与单数的“灾祸”一致；此译明确保留单数语法。
- source_word: ܨܗܝܘܢ
  choice: 锡安
  rationale: 采用现代中文圣经及犹太—基督教文献中通行的专名译法，并保留其作为耶路撒冷象征性称号的意味。
theological_decisions:
- issue: 锡安受灾的性质
  choice: 译作临到锡安的“灾祸”，只陈述异象的辨认关系
  alternative: 进一步解释为上帝最终弃绝锡安，或将灾祸本身说成上帝所喜悦的事
  rationale: 本节只把第十一股黑水对应于当前临到锡安的灾祸，并未在此解决审判、哀痛与上帝公义之间的张力，因此不加入超出原文的神学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“你所看见的……就是……”保留启示文学中解释异象的句式；“如今临到”表达灾祸已经发生并构成当前处境。
