lexical_decisions:
- source_word: ܕܝܢ
  choice: 然而
  rationale: 保留转折或承接语气；现代汉语中比直译为“但”更庄重自然。
- source_word: ܕܝܢܐ ܙܕܝܩܐ（据经文语义重构）
  choice: 公义的审判
  rationale: 与英语审校层的“righteous judgment”一致，并采用宗教文献中自然且准确的现代汉语表达。
- source_word: ܐܝܟܢܐ / ܡܢܐ（据疑问句语义重构）
  choice: 将是怎样的呢
  rationale: 保留对审判性质或情形的开放式询问，不擅自具体化为审判结果或刑罚内容。
theological_decisions:
- issue: 代词“他”的所指
  choice: 保留“他”，不明确其所指
  alternative: 改为“上帝”或具体人物姓名
  rationale: 现有叙利亚文页面材料的分节与排列不够清楚，英语审校层也保留代词；明确所指会超出可确认的文本证据。
- issue: “公义”修饰审判的方式
  choice: 译作“公义的审判”
  alternative: 译作“按公义施行审判”
  rationale: 前者保留名词短语的紧凑性和潜在歧义，不把文本扩展成对施行方式的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以疑问句保留原文的修辞张力；由于所给叙利亚文为跨页章节语料且目标节定位不稳，不添加超出英语审校层和可辨语义的内容。
