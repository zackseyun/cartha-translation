  text: Yet after these things they will be seized by tribulation in the dispersion among the nations, and they will dwell in shame in every place.
translation:
  language: zh_hans
  text: 然而，这些事以后，他们分散在列国之中时，必被患难攫住；无论在哪里，他们都必蒙羞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܒܨܪܘ
  choice: 被……攫住
  rationale: 按本节经校勘后所确认的语境，表达遭患难临到并控制，而不是“明白”；用“攫住”保留被动、强烈的受困意味。
- source_word: ܒܝܬ ܒܡ̈ܢܘܬܐ
  choice: 分散在列国之中时
  rationale: 结合残损文本与平行传本所指的离散处境译出，使“列国之中”既表示地点，也交代他们散居异邦的状态。
- source_word: ܒܚܣܝܪܘ
  choice: 蒙羞
  rationale: 该词组在此描述受辱、处于羞耻中的境况；“蒙羞”简洁而符合庄重的现代汉语。
- source_word: ܒܟܠ ܐܬܪ
  choice: 无论在哪里
  rationale: 自然表达“在每一处／各处”的普遍范围，不把它误解为某个特定地点。
theological_decisions:
- issue: 患难与离散之间的关系
  choice: 译作“分散在列国之中时，必被患难攫住”
  alternative: “必因分散在列国中而被患难攫住”
  rationale: 原文可明确看出离散的处境，却未必明确断言离散就是患难的直接原因；采用时间兼处境表达，避免增添因果解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“然而”承接上文转折；分号保留本节两个相连但各自完整的预言性分句。原始页面材料残损且章节定位属暂定，因此以可辨识的叙利亚文线索、校勘结论及经审核的英文咨询层综合定稿，不沿用已判定为误译且残缺的旧脚注。
