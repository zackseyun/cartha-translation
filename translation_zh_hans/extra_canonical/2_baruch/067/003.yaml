  text: Do you think the Most High rejoices in these things, or that his name is glorified by them?
translation:
  language: zh_hans
  text: 你们以为至高者喜悦这些事，或是他的名因这些事得荣耀吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܠܝܢ
  choice: 这些事
  rationale: 保留指向上文所述行为的概括性指代，不擅自补明具体内容。
- source_word: 至高者（据本节语境及校勘层所反映的称谓）
  choice: 至高者
  rationale: 采用现代中文宗教文献中清楚而庄重的称谓，并避免改写为带有额外解释的神名。
- source_word: ܫܡܗ／对应“名”的原文表达
  choice: 他的名
  rationale: 保留闪语传统中“名”本身的表达，不释义为“声誉”或“荣耀”。
theological_decisions:
- issue: “他的名得荣耀”是否应解释为人使上帝更荣耀
  choice: 按原句保留“他的名因这些事得荣耀吗”
  alternative: 这些事能荣耀他吗
  rationale: 保留“名”这一重要神学表达，也保留反问句对相关行为是否荣耀上帝的判断张力。
- issue: 反问对象的数
  choice: 采用“你们”
  alternative: 你
  rationale: 本章话语面向群体；中文以复数称呼更贴合语境，同时不改变反问的直接性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“喜悦”而非较口语的“高兴”，用“得荣耀”保留原文宗教语域；以“或是”自然连接两个并列反问分句。
