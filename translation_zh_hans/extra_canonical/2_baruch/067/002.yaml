base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/067/002.yaml
  text: Or do you think there is no grief, even for the angels before the Mighty One, because Zion was handed over in this way, and because, look, the nations boast in their hearts, and they gather before their idols and say, “She who long trampled others is trampled down; she who brought others into subjection has herself been subjected”?
translation:
  language: zh_hans
  text: 难道你们以为，就连大能者面前的众天使，也不会因锡安这样被交出去而悲痛吗？看哪，列国心里自夸，聚集[a]在自己的偶像前，说：“那长久践踏别人的，如今被践踏了；那使别人臣服的，如今自己也臣服了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“偶像前的众人说”。
    reason: ܟܢܫܝܢ 的无元音拼写也可按名词形式理解；正文按与前后分词并列的动词“聚集”处理。
lexical_decisions:
- source_word: ܚܫܐ / ܚܫܘܬܐ（据上下文复原）
  choice: 悲痛
  rationale: 表达因锡安被交付而产生的深切哀伤，比一般的“忧愁”更符合语境，同时不增添愤怒或悔恨等原文未明说的含义。
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 保留该书对上帝的称号形式，避免直接改写为专名，也维持其神学语气。
- source_word: ܐܫܬܠܡܬ / ܐܫܬܠܡܘܬ
  choice: 被交出去
  rationale: 保留被动和被置于他者权下的含义；不明确补出交付者，以免消除原文张力。
- source_word: ܡܫܬܒܗܪܝܢ
  choice: 自夸
  rationale: 准确表达列国因锡安受辱而夸耀、自鸣得意的动作。
- source_word: ܟܢܫܝܢ（无元音拼写）
  choice: 聚集
  rationale: 按主动分词理解，与前后的“自夸”和“说”构成连续动作；这也符合最新文本审定。
- source_word: ܕܚܫܐ / ܕܝܠܗܘܢ（上下文所指）
  choice: 自己的偶像
  rationale: 以自然现代汉语表达列国所敬奉的偶像，不把它们称作真正的神。
- source_word: ܐܫܬܥܒܕ / ܡܫܬܥܒܕ
  choice: 臣服
  rationale: 同时涵盖受制、被征服或被置于权下的意思，并与前句“使别人臣服”形成对称。
theological_decisions:
- issue: 天使是否也为锡安遭难而悲痛
  choice: 以反问句保留“就连……也不会……吗”的语气
  alternative: 直陈“众天使也为此悲痛”
  rationale: 原文论证依赖反问，既传达说话者预期的肯定答案，也不把修辞性问题改成无条件陈述。
- issue: 锡安被交付的施事者
  choice: 使用无施事者的被动表达“被交出去”
  alternative: 译作“上帝把锡安交出去”或“锡安被仇敌攻陷”
  rationale: 原文此处未明确指出谁交付，也未单纯使用军事攻陷措辞；保留被动可避免过度解释神意或历史机制。
- issue: 列国在偶像前的言语是否代表叙述者认同
  choice: 明确置于列国的引语中
  alternative: 改写成叙述者的历史判断
  rationale: 这些话是列国夸耀时所说，并非经文认可偶像或赞同其嘲讽。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留反问、呼语“看哪”及两句对称的讥讽话语；用“锡安”“大能者”等符合本书语域的称谓，同时避免古奥难懂的文言结构。
