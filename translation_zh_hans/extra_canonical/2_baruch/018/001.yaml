  yaml_path: translation/extra_canonical/2_baruch/018/001.yaml
  text: And I answered and said, “He who took from the light is able to know it. But the many who exist took from Adam’s darkness, and did not rejoice in the light of Moses.”
translation:
  language: zh_hans
  text: 我回答说：“凡从光明领受的人，能够认识光明；但许多人从亚当的黑暗中领受，却没有在摩西的光明中欢喜。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܣܒ / ܢܣܒܘ
  choice: 领受
  rationale: 保留该动词宽泛而具体的含义，也维持从光明或黑暗有所承受的对照，不将其过度解释为单纯的学习或继承。
- source_word: ܢܘܗܪܐ
  choice: 光明
  rationale: “光明”自然、庄重，并保留启示与道德层面的末世意象。
- source_word: ܚܫܘܟܐ ܕܐܕܡ
  choice: 亚当的黑暗
  rationale: 保留叙利亚文中与亚当直接相连的属格表达，不淡化为一般性的“人的黑暗”。
- source_word: ܐܬܒܣܡܘ（校正读法；页面识别作 ܐܬܒܣܣܘ）
  choice: 欢喜
  rationale: 依校勘控制材料采用“欢喜”的读法；页面中的形式属于文字识别讹误，不据此译作“立稳”或“被建立”。
- source_word: ܢܘܗܪܐ ܕܡܘܫܐ
  choice: 摩西的光明
  rationale: 保留摩西这一明确的人名及原文意象，不用“律法”替换，也不把摩西说成光明的独立源头。
theological_decisions:
- issue: 亚当之黑暗与摩西之光明的对照
  choice: 保留两位具名人物及“黑暗／光明”的历史与启示性对照
  alternative: 将其泛化为无知与教导的对照
  rationale: 原文明言亚当和摩西；直译这一结构可保留其代表性张力，而不额外规定罪性遗传或律法论的具体教义框架。
- issue: 摩西与光明的关系
  choice: 译作“摩西的光明”，同时让“领受”表明光明是所得之物
  alternative: 译作“摩西所传的光明”或“摩西自己的光明”
  rationale: 前者加入原文未明说的中介解释，后者又可能把摩西塑造成独立源头；现译保持原有含混与张力。
- issue: 首句的人称
  choice: 采用第三人称泛指：“从光明领受的人”
  alternative: 采用第二人称：“你是从光明领受的”
  rationale: 控制材料支持第三人称读法；页面文字中的第二人称外观源于识别讹误，且上下文是在概说人如何认识光明。
translation_notes:
  register: 采用现代标准普通话，语气庄重而清楚。“从……领受”刻意重复，以呈现光明与黑暗的平行对照；省去生硬的“现存的许多人”，以自然的“许多人”表达其核心指向。
