  text: 'And I said, “For whom and for how many will these things be? And who will be counted worthy to see that time?[a]

    But I will speak with you of all that I think, and I will ask of you concerning those of your people whom I have seen in great number, who withdrew from your covenant and cast from themselves the yoke of your law.

    But others again I have seen who left their vanity[b] and fled beneath your wings.

    What then will happen to these? Or how will that last time receive them?

    Or will the time of these perhaps be weighed, and as the balance inclines, so will they be judged?”'
translation:
  language: zh_hans
  text: '我说：“这些事将临到谁，又涉及多少人？谁会被算为配得看见那时刻？[a]


    我要同你谈论我所思量的一切，也要向你询问有关你百姓的事：我曾看见他们中有许多人背离你的约，把你律法的轭从自己身上抛开。


    但我也看见另一些人离弃自己的虚妄，[b]逃到你的翅膀之下。


    那么，这些人将会怎样？那末后的时候将如何接纳他们？


    这些人所处的时候会不会受到称量，并且照着天平所倾斜的方向，他们也将照样受审判呢？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存 Ceriani 章段资料在第40章末与第42章初之间有重叠。本段问话的基本意思清楚，但其确切分界参照 Kmosko 第576页加以确认。
    reason: textual_variant
  - marker: b
    text: Ceriani 文本的这一行局部不清；“自己的虚妄”有 Kmosko 拉丁文校勘见证支持。也可理解为“自己的空虚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ܩܝܡܐ / ܩܝܡ̈ܐ（现存行文有讹损）
  choice: 你的约
  rationale: 该词兼有约定、承诺的意味；在本书犹太启示文学的语境中，“约”最能保留其群体性与神学分量，同时不把它扩写成特定教义术语。
- source_word: ܢܡܘܣܐ
  choice: 律法
  rationale: “律法的轭”是此处明确而稳定的比喻；“律法”比宽泛的“教导”更能保留其约与审判层面的含义。
- source_word: ܡܘܒܠܐ / 局部存疑的词组
  choice: 自己的虚妄
  rationale: Ceriani 文本此处不清楚，但拉丁文校勘见证支持 vanitatem suam；“虚妄”既表达道德与属灵上的空虚，又不把所指过度限定为偶像、谬误或欺骗。
- source_word: ܓܢܦ̈ܐ / 由校勘见证保存的词组
  choice: 你的翅膀之下
  rationale: 保留具体的庇护意象及其经文风格，不将其平化为“你的保护之下”。
- source_word: ܡܬܬܚܒܘ / 天平称量语句（文本有讹损）
  choice: 受到衡量
  rationale: 后文天平倾斜的意象表明这里说的是称量式的审判；译作“衡量”既承接该意象，也比“评估”更具形象性。
theological_decisions:
- issue: 如何处理背约者与回转者最终的命运
  choice: 保留为巴录向上帝提出的开放性问题，不在本节预先给出答案。
  alternative: 按后续回答的方向，在此直接判定两类人的结局。
  rationale: 本节仍在询问末后的时刻将如何接纳这些人；答案属于后续段落。保留问句可维持原文的悬念与神学张力。
- issue: “你的翅膀之下”的含义
  choice: 直译为神圣庇护的比喻。
  alternative: 意译为“投靠你的保护”。
  rationale: 原有意象把悔改描写为逃入上帝的遮蔽之下；保留“翅膀”可避免削弱这一诗性和神学意味。
- issue: “时日受到衡量”与人的审判之间的关系
  choice: 保留原文较难确定的称量表达，并让后句说明其与审判有关。
  alternative: 直接解释为“他们的善恶行为将被权衡”。
  rationale: 原文并未明确说被称量的是行为或功过；直译“这些人的时日”可避免擅自补入功德衡量的教义框架。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“约”“律法的轭”“翅膀之下”等表达保留犹太启示文学的经文质感；对受损文本中的称量意象保持克制，不作超出来源证据的解释。
