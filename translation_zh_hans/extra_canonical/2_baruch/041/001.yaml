  - severity: medium
    issue: “这些人的时日会不会受到衡量”可能把“time of these”误读为个人寿数。
    rationale: 此处的称量用语本有文本不确定性，应保留其所指的含混；“这些人所处的时候／时期”较不预设为个人寿命，也更贴近随后“那末后的时候”的时间性表述。
  - severity: low
