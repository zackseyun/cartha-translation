  yaml_path: translation/extra_canonical/2_baruch/045/008.yaml
  text: But those who turned themselves toward darkness and received lies, and lost the settledness of hope, and sought out vanities, and did not show mercy, nor keep the path of discipline—
translation:
  language: zh_hans
  text: 但那些转向黑暗、接受谎言、失去盼望之珍宝、追逐虚妄之事[a]、不施怜悯[b]、也不持守管教之道的人——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按原文形式译：“在虚妄之事中被寻求。”原文动词可作被动或中间义理解。
    reason: 保留叙利亚文动词语态及受事关系的歧义；更正“被寻见”所引入的非原文结果义。
  - marker: b
    text: 原文直译近于：“不顾惜怜悯。”
    reason: 说明正文“不施怜悯”是依上下文作出的自然表达。
lexical_decisions:
- source_word: ܚܫܘܟܐ
  choice: 黑暗
  rationale: 该词意为“黑暗”，并非“痛苦”；也保留本段所含的光暗对照意象。
- source_word: ܣܝܡܬܐ ܕܣܒܪܐ
  choice: 盼望之珍宝
  rationale: ܣܝܡܬܐ 通常指珍宝、宝藏或积存之物；如此译比抽象的“盼望的稳固性”更贴近叙利亚文。
- source_word: ܕ̈ܓܠܐ
  choice: 谎言
  rationale: 复数名词指虚假之言或欺骗，句中与“接受”搭配，译作“谎言”自然明确。
- source_word: ܡܘܣܪ
  choice: 管教
  rationale: 该词可指训诲、规训或管教；“管教之道”既保留伦理含义，也符合庄重的经文语体。
theological_decisions:
- issue: “盼望”前名词 ܣܝܡܬܐ 的含义
  choice: 失去盼望之珍宝
  alternative: 失去盼望的稳固根基
  rationale: 原词的具体意象是珍藏、宝藏或存放之物，不宜未经说明便抽象化为内心的稳定状态。
- issue: 追逐虚妄之事的动词语态
  choice: 正文采用中间义或反身义“追逐”
  alternative: 按形式译作被动句“在虚妄之事中被寻见”
  rationale: 原动词形式容许被动或中间义；结合一连串主动描述恶人行为的分句，中间义在汉语中更连贯，但以脚注保留形式上的歧义。
- issue: 怜悯分句的表达
  choice: 不施怜悯
  alternative: 不顾惜怜悯
  rationale: 按上下文，这是对他们缺乏怜悯行为的谴责；正文采用自然汉语，但脚注保留叙利亚文较直译的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。全句在原段落中是尚未结束的条件或对比结构，因此以破折号收束本节，保留其悬接下一节的句法张力。
