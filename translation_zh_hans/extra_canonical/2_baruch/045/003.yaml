  text: For everything corruptible passes away and comes to nothing, and the time that has been is now forgotten; nor after this is it sought in remembrance.
translation:
  language: zh_hans
  text: 凡会朽坏的，都消逝而归于无有；已经过去的时日将被遗忘，今后也不再在记忆中被寻求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܟܠ ... ܡܕܡ ܕܡܬܚܒܠ
  choice: 凡会朽坏的
  rationale: ܡܬܚܒܠ 表示遭败坏、毁坏或归于腐朽；“会朽坏的”既保留事物必然消逝的含义，也符合现代汉语经文语体。
- source_word: ܘܐܙܠ ... ܘܡܬܛܥܐ
  choice: 都消逝而归于无有……被遗忘
  rationale: 依上下文呈现从消逝、归于无有到被遗忘的推进；避免把物质毁灭与记忆消退混为同一动作。
- source_word: ܙܒܢܐ ܕܗܘܐ
  choice: 已经过去的时日
  rationale: 字面为“曾经有过的时间”；“已经过去的时日”在现代汉语中自然，并保留其与将来之事的时间对照。
- source_word: ܡܬܒܥܐ ܒܥܘܗܕܢܐ
  choice: 被人追念
  rationale: 该短语含在记忆中寻求、提起之意；“追念”简洁传达主动回想与纪念，而不额外引入礼仪含义。
theological_decisions:
- issue: 经文所说的消逝与遗忘是否指绝对不存在
  choice: 按经文本身译为“归于无有”并“被遗忘”
  alternative: 解释为仅在今世失去影响或不再被人记得
  rationale: 本节使用强烈的消逝语言，但未在此明确界定其形而上或末世论范围，因此不在正文中加以弱化或教义化说明。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语；保留原文由朽坏、消逝到遗忘和不再追念的递进结构。
