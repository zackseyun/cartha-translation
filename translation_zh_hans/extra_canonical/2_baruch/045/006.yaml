revisions:
- from: 如果有人被指定承受它，它就不会向他们扣留；至于那些活在其中的人，他们不会被引向灭亡。[a]
  to: 若有人是为它而被指定的，它就不会不给他们；至于那些活在其中的人，他们不会被带往灭亡。[a]
  rationale: 修订删除“承受”这一额外动作，改善“扣留”的汉语搭配，并以“带往灭亡”对应原文的被带领/带往用语。代词“它”和“其中”仍不作具体解释；脚注保留末句非人称式表达的可能。
