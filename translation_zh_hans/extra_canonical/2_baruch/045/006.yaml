  yaml_path: translation/extra_canonical/2_baruch/045/006.yaml
  text: And if there are any who are appointed for it, it is not withheld from them; and for those who live in it, they will not be led to destruction.
translation:
  language: zh_hans
  text: 若有人是为它而被指定的，它就不会不给他们；至于那些活在其中的人，他们不会被带往灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人若活在其中，就不会被带往灭亡。”
    reason: 原文末句可按与前句所指人群相连的被动陈述理解，也可作非人称式表达；两种读法的基本意义相近。
lexical_decisions:
- source_word: ܥܬܝܕܝܢ
  choice: 被指定承受
  rationale: 该词可表示已经预定、指定或注定；结合后面的“不会向他们扣留”，译为“被指定承受”较自然，同时避免把预定的性质作过度神学化解释。
- source_word: ܡܬܚܣܟ
  choice: 扣留
  rationale: 保留“阻止、保留不给”的被动含义；汉语改用主动结构，并沿用上下文中的单数所指“它”。
- source_word: ܚ̈ܝܝܢ ܒܗ
  choice: 活在其中
  rationale: 直译介词结构，保留“其中”所指对象在上下文中的含混性。
- source_word: ܡܘܒܠܐ ܠܐܒܕܢܐ
  choice: 被引向灭亡
  rationale: 体现“带领、引往”与“毁灭、灭亡”的语义，并以自然的汉语被动句表达。
theological_decisions:
- issue: “被指定”是否应解释为神学意义上的预定
  choice: 采用中性的“被指定承受”
  alternative: “注定要承受”
  rationale: 原文表达预先安排或将要承受的状态，但本节未明说其施行者或教义机制，因此不作宗派性展开。
- issue: 末句的语法主语与表达方式
  choice: 正文译为“他们不会被引向灭亡”
  alternative: “那里不会把人引向灭亡”或“没有引向灭亡这回事”
  rationale: 原文可作非人称或以相关情境为主语；正文采用最顺畅且与所指人群相连的读法，脚注保留另一种结构可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“它”和“其中”保留原文代词所指的含混性，不擅自补明其具体指向。
