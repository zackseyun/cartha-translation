  - severity: medium
    issue: “它就不会向他们扣留”不合汉语常规支配关系。
    rationale: “扣留”通常说“把某物扣留不给某人”或“从某人处扣留某物”；改为“不会不给他们”既自然又保留被动原义。
  - severity: low
