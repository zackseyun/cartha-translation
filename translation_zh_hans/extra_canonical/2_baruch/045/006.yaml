  naturalness: 原译“向他们扣留”不合现代汉语搭配。“不会不给他们”准确表达“不会向他们扣留/不予他们”，并保留代词指向。将“引向灭亡”改为“带往灭亡”，更贴近ܡܘܒܠܐ（被带领、被带往）且中文更自然。
  terminology: “灭亡”可对应ܐܒܕܢܐ，且符合本段庄重书面语体。保留“其中”及“它”的含混指向，不擅自将其解释为死亡、救恩或其他特定神学概念。
