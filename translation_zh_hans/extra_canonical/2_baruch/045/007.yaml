  text: Therefore, let those who desire to see it beware of the time spoken of, and let them pass beyond the burden of the troubled time.
translation:
  language: zh_hans
  text: 所以，凡愿意看见那事的人，都要警惕所说的时期，并要跨过那动荡时期的重负。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重负”原词也可指“债、亏欠、罪责或义务”；“动荡”也含“被激起、被搅动”的意思。
    reason: 两个词均有可观的语义弹性；脚注保留“罪债／义务”及“被激起”等可能，避免正文作过度定解。
lexical_decisions:
- source_word: ܕܢܬܚܙܝܢ
  choice: 看见那事
  rationale: 该形式及其所指在传抄文本中略有含混；结合上下文和经审校的英文参照层，按“得以看见它／那事”表达，同时以“那事”保留前文所指的开放性。
- source_word: ܕܢܬܙܗܪܘܢ
  choice: 警醒，提防
  rationale: 该词含谨慎、防备、留意之意；并列两个紧密相关的现代汉语动词，既传达内在警觉，也传达对特定时期的防范。
- source_word: ܚܘܒܐ
  choice: 重负
  rationale: 本词通常可指债、亏欠、罪责或义务；此处与艰难时期相连，语境义接近压在人身上的负担，故正文译为“重负”，并用脚注保留字面义范围。
- source_word: ܕܡܥܝܪ
  choice: 动荡
  rationale: 词根可表达唤醒、激起、搅动；形容“时期”时译为“动荡”较自然，也不把其具体性质解释得过窄。
- source_word: ܕܢܥܒܪܘܢ
  choice: 越过
  rationale: 保留“经过、跨过、脱离”的空间性意象，比单纯译作“忍受”更贴近原词。
theological_decisions:
- issue: “看见那事”所指为何
  choice: 不具体补明其为锡安的安慰、未来时代或某一异象
  alternative: 将其明确译为“看见锡安得安慰”或“看见未来之事”
  rationale: 本节代词式所指依赖前文，原文没有在本句重新明确说明；正文保留这种指代张力，避免加入解释性神学结论。
- issue: 如何理解“越过……重负”
  choice: 保留为劝勉人越过动荡时期的重负
  alternative: 解释为偿清该时期的罪债，或逃脱末世患难
  rationale: ܚܘܒܐ具有债、罪责、负担等多重可能，单凭本句不足以确定专门的罪论或末世论含义，因此采用语境通顺而神学上较中性的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“警醒，提防”强化劝诫语气；“那个时期”对应原文特指的“所说的时期”；句末脚注标记已在正文中出现。
