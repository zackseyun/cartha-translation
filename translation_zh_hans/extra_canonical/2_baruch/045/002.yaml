  text: For what exists now is nothing; but what is to come will be exceedingly great.
translation:
  language: zh_hans
  text: 因为如今所存在的算不得什么；但将要有的，将会极其伟大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܡ ܕܗܘܐ ܗܫܐ
  choice: 如今所存在的
  rationale: 按上下文表达当前存在或发生的现实；采用“所存在的”保留概括性，不把范围缩限为某一事件。
- source_word: ܠܐ ܗܘܐ ܡܕܡ
  choice: 算不得什么
  rationale: 这是自然的现代汉语表达，同时传达原文“不是任何东西／无足轻重”的修辞性否定，避免误读为绝对不存在。
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܗܘܐ
  choice: 将要出现的
  rationale: 传达未来将存在或发生之事；“出现”在汉语中兼顾事物与局势，且不额外规定其性质。
- source_word: ܗܘܝܘ ܪܒ ܣܓܝ
  choice: 实在极其伟大
  rationale: ܪܒ ܣܓܝ 表示程度极高的“大”；“实在”承接强调结构，“极其伟大”保留强烈对比。
theological_decisions:
- issue: 现今与未来的末世性对比
  choice: 保留“如今”与“将要”的直接对照，不说明未来之物具体为何
  alternative: 将其明确译作“将来的荣耀／世界”
  rationale: 原句本身使用概括性表达；具体化会把上下文可能蕴含的末世盼望解释直接写入正文，消除原有开放性。
- issue: “算不得什么”的本体论含义
  choice: 理解为比较中的无足轻重
  alternative: 译成“如今存在的一切都不存在”
  rationale: 上下文将现今短暂、败坏之物与未来重大之物相比较；译为绝对不存在会造成不必要的本体论断言。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。分号突出今昔对照；不添加脚注，因为本节的主要歧义可由正文措辞本身保留。
