  verdict: revise
  source_fidelity: 译文总体保留了原文所呈现的将来“时代／时期”的拟人化：它来到、其时节来到、处理其作为并察验其罪。末句也保留了“属于它的人”与“苦难—毁灭”之间较不寻常的关系。不过，“追究”比ܡܒܩܪ及英语审校轨迹的“examines”更带定罪、追责意味；“再”则是原文和英语轨迹均未明示的附加时间含义。
  naturalness: 整体庄重清楚。“因为……一旦来临，它的时刻一到”虽有原文式重复，仍可接受，并适合保留“时间”与“时节”的并置。末句的搭配因原文意象而略显生硬，但“为毁灭增添苦难”在现代汉语中较顺畅，且不改变其关系。
  terminology: “永不消逝的时代”可对应不逝去的时间／时期，且保留末世性语境而不作体系化解释。“作为”可对应deeds；“察验罪过”比“追究罪过”更准确地保留查察而未必判罚的含义。
  issues:
  - severity: medium
    issue: “追究自己的罪过”将查察译成带追责、定罪色彩的动作。
    rationale: ܡܒܩܪ的基本语义为察看、考察、检查；英语审校轨迹亦作“examines”。在此不宜把文本未明说的惩治性判断写入译文。
  - severity: low
    issue: “不会再给毁灭增添苦难”中的“再”没有明确的源文依据。
    rationale: 否定词表达的是不增添，并未明示此前已经增添或停止继续增添。删去“再”可避免补入时间性前提。
  revised_text: 因为那永不消逝的时代来临，它的时刻一到，就必整顿自己的作为，察验自己的罪过。属于它的人，不会为毁灭增添苦难。
