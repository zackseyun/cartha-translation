base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/005.yaml
  text: For when the time that does not pass away comes and its season arrives, it sets its deeds in order and examines its sins. Those who belong to it do not add anguish to destruction.
translation:
  language: zh_hans
  text: 因为那永不消逝的时代来临，它的时刻一到，就必整顿自己的作为，察验自己的罪过。属于它的人，不会为毁灭增添苦难。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ ܕܠܐ ܥܒܕ
  choice: 那永不消逝的时代
  rationale: ܙܒܢܐ 可指“时间、时期、时代”；结合末世语境及“不消逝”的限定，译作“时代”较自然，也保留其与当前会过去之时代的对照。
- source_word: ܐܬܐ ܥܕܢܗ
  choice: 它的时刻一到
  rationale: 直译其“来到／到来”与“它的时刻”，用现代汉语表达时机到达。
- source_word: ܡܫܘܐ ܥܒܕܘܗܝ
  choice: 整顿自己的作为
  rationale: ܡܫܘܐ 有使之平正、安排妥当之意；“整顿”避免过度确定为审判、成全或报偿。
- source_word: ܡܒܩܪ ܚܛܗܝܗ̇
  choice: 追究自己的罪过
  rationale: ܡܒܩܪ 可表示查察、审视或追究；在罪的语境中“追究”较通顺，同时保留审察意味。
- source_word: ܠܐ ܡܘܣܦܝܢ ܥܘܩܢ ܥܚܒܠܐ
  choice: 不会再给毁灭增添苦难
  rationale: 保留“增添—苦难—毁灭”的源文关系；“再”体现否定继续增加的自然汉语语气。
theological_decisions:
- issue: 不消逝的“时代”被拟人化，拥有“作为”和“罪过”
  choice: 保留拟人化表达“自己的作为／自己的罪过”
  alternative: 解释为该时代中之人的行为和罪过
  rationale: 源文的代词所指在语法上承接“时代”；不把它静默改写为世人或某一审判主体，以保存文本本身的张力。
- issue: 末句中“属于它的人”与毁灭、苦难的关系
  choice: 译为“不再给毁灭增添苦难”
  alternative: 译为“不把苦难加在毁灭之上”或“不会增加苦难和毁灭”
  rationale: 依据句法及英语审校层保留苦难作为被增添之物、毁灭作为关联对象；不进一步推定这是免受惩罚或停止作恶。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；保留原文对将来时代的拟人化，不以教派性末世体系加以解释。
