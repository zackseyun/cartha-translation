base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/004.yaml
  text: For what has passed away into corruption, and what is corrupted falls and is forgotten. But what is to come is what is sought; what has passed from the hand is no longer reckoned.
translation:
  language: zh_hans
  text: 因为已经逝去而归于朽坏的，朽坏的必坠入遗忘，被人遗忘。将要来到的才是人所寻求的；已经从手中逝去的，不再被算在内。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܠܦ ܠܡܬܚܒܠܘ
  choice: 逝去而归于朽坏
  rationale: ܚܠܦ可指经过、逝去或转变，ܠܡܬܚܒܠܘ表示趋向败坏、朽坏；此译保留时间消逝并归于朽坏的双重意象。
- source_word: ܒܥܘܗܕܢܐ ܢܦܠܐ ܘܡܬܛܥܐ
  choice: 从记忆中消逝，被人遗忘
  rationale: 原文直陈朽坏之物在记忆中衰落并被遗忘；中文以并列结构自然表达其从记忆中淡出的过程。
- source_word: ܕܥܬܝܕ
  choice: 将来之事
  rationale: 指尚未来到、即将发生之事，不把它限定为某一特定末世事件。
- source_word: ܡܢ ܐܝܕܐ
  choice: 从手中
  rationale: 保留原文的‘从手中’意象，而不将其完全解释为抽象的‘过去’。
- source_word: ܡܬܚܫܒ
  choice: 被计算
  rationale: 保留该词‘计算、算入、看作’的语义开放性；上下文可理解为不再算数或不再被计入。
theological_decisions:
- issue: ‘将来之事’是否特指末世应许
  choice: 保留为‘将来之事’
  alternative: 译作‘将要显现的永恒之事’
  rationale: 叙利亚文此处只说‘将来的／即将发生的’，不宜在正文中加入‘永恒’或特定末世解释。
- issue: 过去之物‘不再被计算’的含义
  choice: 直译为‘不再被计算’
  alternative: 意译为‘不再被看重’或‘不再算数’
  rationale: 原词兼有计算、归入考虑和看作之意；直译能保存关于价值、记念或账算之间的张力。
translation_notes:
  register: 采用庄重而清楚的现代普通话，以‘归于朽坏’‘从记忆中消逝’保持智慧文学式的沉思语气；保留‘从手中’和‘被计算’等原文意象及其含义张力。
