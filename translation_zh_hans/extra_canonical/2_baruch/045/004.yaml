  naturalness: 整体庄重通顺，适合本段的智慧文学语境。修订后以“坠入遗忘”表达原文的“落下”及遗忘语境，简洁且自然。脚注中的“越过去”不合现代汉语习惯。
  terminology: “朽坏”“将要来到的”“从手中逝去”“不再被计算”均能保留原文的开放性，未添加特定末世或教派解释。“算在内”略微明确“被计算”的汉语功能，但仍保留其可指计入、算数或纳入考量的含义。
