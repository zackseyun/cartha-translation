    rationale: 原文及英文审计轨迹所指的是“已经逝去而归于朽坏的”这一类事物，不宜以“都”扩展为所有曾存在之物。
  - severity: low
    issue: “从记忆中消逝”弱化了“坠落／落入遗忘”的意象。
    rationale: 原文在“记忆／纪念”语境中使用“落下”并接“被遗忘”；“坠入遗忘”可同时自然保留二者。
  - severity: low
