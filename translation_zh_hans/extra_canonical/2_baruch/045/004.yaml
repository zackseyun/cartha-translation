revisions:
- from: 因为已经存在过的，都逝去而归于朽坏[a]；朽坏的，也从记忆中消逝，被人遗忘。将来之事才是人所寻求的；已经从手中流逝的，就不再被计算。
  to: 因为已经逝去而归于朽坏的，朽坏的必坠入遗忘，被人遗忘。将要来到的才是人所寻求的；已经从手中逝去的，不再被算在内。
  rationale: 修订删除无依据的“都”，以关系性措辞贴近原文；以“坠入遗忘”恢复“落下”与遗忘的双重表达；并将脚注中不自然的“越过去”改为合乎现代普通话的“过去”。其余关键意象及语义张力予以保留。
