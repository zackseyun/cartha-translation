  yaml_path: translation/extra_canonical/2_baruch/045/001.yaml
  text: …that belong to corruption and its ways, ways that cannot be searched out, whatever they may be. But if you endure and stand in his fear and do not go astray from his law, the times will be changed in their season for good, and you will see the consolation of Zion.
translation:
  language: zh_hans
  text: 1 ……属于朽坏及其道路；那些道路无法探究，无论它们究竟如何。[a] 然而，你们若忍耐，在敬畏他中站立得稳，不偏离他的律法，各个时期就会在其时节转为美好；你们也必看见锡安的安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无论它们究竟如何”：叙利亚文直译近似“它们就是它们”，是强调其本相而又不加界定的说法。
    reason: 保留并说明原文罕见且略显晦涩的重复语式，避免正文将其含义解释得过死。
lexical_decisions:
- source_word: ܚܒܠܬܐ
  choice: 朽坏
  rationale: 该词指败坏、毁坏或归于消亡的状态；“朽坏”既保留末世性语境中现今秩序会消逝的含义，也避免单纯理解为道德腐败。
- source_word: ܕܠܐ ܡܬܒ̈ܩܥܢ
  choice: 无法探究
  rationale: 此处表达这些道路不可查透、不可探明；“无法探究”在现代汉语中自然，同时保留原文的认知限度。
- source_word: ܡܬܚܠܦܝܢ ... ܙܒ̈ܢܐ ܠܛܒܬܐ
  choice: 时势就会在各自的时节转为美好
  rationale: 保留“时期／时势发生转变”的末世性意象，不将其弱化为个人境遇或抽象的好运；“在各自的时节”对应复数附属代词。
- source_word: ܒܘܝܐܐ
  choice: 安慰
  rationale: 该名词可指安慰、慰藉；“锡安的安慰”庄重而自然，并保留这是赐给锡安的安慰还是与锡安相关之安慰的语法张力。
- source_word: ܒܕܚܠܬܗ
  choice: 存敬畏他的心
  rationale: 原文直指“在对他的敬畏中”；此译符合现代汉语表达，同时保留敬畏上帝这一宗教语义。
theological_decisions:
- issue: 锡安末后的盼望
  choice: 锡安的安慰
  alternative: 锡安所得的安慰
  rationale: 原文属格本身可容纳关系上的宽度；采用较直接的“锡安的安慰”，不额外限定锡安只是领受者。
- issue: 时势转变与人的忠贞
  choice: 你们若忍耐……时势就会……转为美好
  alternative: 只要你们忍耐，就必使时势转好
  rationale: 原文将忍耐、敬畏和守律法置于条件句中，却没有说人使时代改变；译文保留条件关系，同时避免把时代转变归因于人的能力。
- issue: “他的”所指
  choice: 他的
  alternative: 上帝的
  rationale: 上下文可清楚指向上帝，但原文本节使用代词；保留代词，避免在正文中增补原文未明说的名词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。开头保留省略号，表明本节从前文未完的句子接续而来；用“站立得稳”“不偏离”呈现劝勉语气，并以“锡安的安慰”保留末世性和群体性。
