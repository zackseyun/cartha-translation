translation:
  language: zh_hans
  text: 他们想要探究那为将来百姓隐藏着的苦难；但他们看不见对那件事的鉴察，就是许多人曾借那件事得称为义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被证实为义”。
    reason: 叙利亚语ܐܙܕܕܩܘ可指被判定／宣告为义，也可强调经察验而显为义。
lexical_decisions:
- source_word: ܥܘܩܢ
  choice: 苦难
  rationale: 该词表示困苦、患难或痛苦；“苦难”在本句末世性语境中自然且不缩窄含义。
- source_word: ܡܬܚܣܟ
  choice: 隐藏的
  rationale: 此处可表达被保留、扣留或遮藏；结合其修饰将来百姓所面对的苦难，译作“隐藏的”，同时在措辞上保留尚未显明的意味。
- source_word: ܡܒܩܪܐ
  choice: 鉴察
  rationale: 该词可指察验、追究或临到的审察；“鉴察”保留其司法与神圣探察色彩，不武断限定为惩罚。
- source_word: ܐܙܕܕܩܘ
  choice: 得称为义
  rationale: 该被动形式表示被判定、宣告或证实为义；“得称为义”保留其被动及司法性。
theological_decisions:
- issue: ܐܙܕܕܩܘ所表达的称义性质
  choice: 得称为义
  alternative: 被证实为义
  rationale: 正文不把该词限定为某一宗派的系统教义；脚注保留其也可表示经察验而显为义的可能。
- issue: ܡܒܩܪܐ是审察还是惩罚性临到
  choice: 鉴察
  alternative: 察验／追究
  rationale: 源词本身不必然只表示惩罚，因此采用较宽而庄重的“鉴察”，保留语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“将来的百姓”直译末世指向而不擅自明确其身份；分号保留原句两部分之间的转折。
