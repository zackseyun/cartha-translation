revisions:
- from: 他们想要探究为将来的百姓隐藏的苦难；但他们看不见那件使许多人得称为义[a]之事所带来的鉴察。
  to: 他们想要探究那为将来百姓隐藏着的苦难；但他们看不见对那件事的鉴察，就是许多人曾借那件事得称为义[a]。
  rationale: 修订恢复原文的核心句法：他们不得看见“对那件事的鉴察”，而该事是许多人借以得称为义的事。正文没有把鉴察限定为惩罚，也未把“称义”纳入特定宗派体系；脚注保留“被证实为义”的合理歧义。
  reviewer_model: gpt-5.6-terra
