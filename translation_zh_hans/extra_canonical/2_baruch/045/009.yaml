review_pass:
  verdict: revise
  source_fidelity: 草稿前半句基本传达了“他们欲探究……苦难”的意思，但后半句将“对那件事的鉴察／察验”译成“那件事所带来的鉴察”，错误地把鉴察说成该事产生的结果。叙利亚语结构是他们看不见对那件事的鉴察，而许多人曾借那件事得称为义／被证实为义。
  naturalness: “那件使许多人得称为义之事所带来的鉴察”定语层叠且关系不清。将“鉴察”明确为“对那件事的鉴察”，并用“就是……”说明其与“许多人得称为义”的关系，更合乎现代汉语，也保留原文复杂的关系结构。
  terminology: “苦难”可保留；“鉴察”可作为对ܡܒܩܪܐ的审察性宽译；“得称为义”保留ܐܙܕܕܩܘ的被动司法意味。脚注的“被证实为义”是合宜的非宗派性替代译法。
  issues:
  - severity: high
    issue: 后半句误将鉴察表述为“那件事所带来的鉴察”。
    rationale: 原文及英文审计轨迹所对应的结构是“他们看不见对那件事的鉴察”，而不是“那件事带来鉴察”。这改变了ܡܒܩܪܐ与“那件事”的句法关系。
  - severity: medium
    issue: “为将来的百姓隐藏的苦难”可能被理解为百姓隐藏苦难。
    rationale: 将“隐藏”改为“为将来百姓隐藏着的”可明确苦难是被隐藏／保留的对象，而非由百姓施行隐藏。
  revised_text: 他们想要探究那为将来百姓隐藏着的苦难；但他们看不见对那件事的鉴察，就是许多人曾借那件事得称为义[a]。
  revised_footnotes:
  - marker: a
    text: 或译：“被证实为义”。
    reason: 叙利亚语ܐܙܕܕܩܘ可指被判定／宣告为义，也可强调经察验而显为义。
  revision_rationale: 修订恢复原文的核心句法：他们不得看见“对那件事的鉴察”，而该事是许多人借以得称为义的事。正文没有把鉴察限定为惩罚，也未把“称义”纳入特定宗派体系；脚注保留“被证实为义”的合理歧义。
