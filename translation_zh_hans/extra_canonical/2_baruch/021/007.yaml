  text: And you know the number of those who pass away and of those who abide.
translation:
  language: zh_hans
  text: 你也知道逝去的和存留的数目。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܕܥ ܐܢܬ (ydʿ ʾnt)
  choice: 你也知道
  rationale: 保留第二人称主语和“知道”的直陈语气；“也”承接上下文的并列关系。
- source_word: ܡܢܝܢܐ (menyānā)
  choice: 数目
  rationale: 按其通常意义译为可数的总数，不扩展为身份、名单或命定数额。
- source_word: ܕܥܒܪܝܢ (d-ʿābrīn)
  choice: 那些逝去之人
  rationale: 该分词基本义为“经过、离去”；在与“存留”对举时，“逝去”自然表达人的消逝，同时避免明确限定为死亡。
- source_word: ܕܡܩܘܝܢ (d-maqwayn)
  choice: 那些存留之人
  rationale: 保留“继续存在、留下”的含义，并与“逝去”形成对称。
theological_decisions:
- issue: “逝去”与“存留”所指的范围
  choice: 保持为泛指的两类人
  alternative: 明确解释为死者与活人，或灭亡者与得救者
  rationale: 原文的分词对举本身没有明确说明是生死、历史存亡还是末世归宿，因此不在正文中消解其含义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；以平行结构重现原文两组属格关系，不沿用旧译中缺乏本文依据的“罪人”和“满有忿怒的话”等表述。
