  text: And how was it revealed if afterward they do not understand?
translation:
  language: zh_hans
  text: 如果他们后来并不明白，这事又是怎样显明的呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܙܐ
  choice: 显明
  rationale: 该词可表达“显现、被看见、显明”；此处采用“显明”，既保留被动意味，也符合关于认知与启示的设问语境。
- source_word: ܝܕܥ
  choice: 明白
  rationale: 该词基本义为“知道、认识”；此处所说的是领会先前所显明之事，译作“明白”更自然。
theological_decisions:
- issue: “显明”与“明白”之间的张力
  choice: 保留条件式反问，不解释显明是否必然带来理解
  alternative: 译成“既然他们后来不明白，这事就没有显明”
  rationale: 原句以“如果”提出反问，并未直接断定启示与人的理解完全等同，因此不替文本化解这一张力。
translation_notes:
  register: 采用庄重而自然的现代汉语；以“又是怎样……的呢”保留原句的反问力度，并保留“如果”的条件关系。
