  text: For even the former things that have passed away are not distant from you, with all their possessors and their remembrance.
translation:
  language: zh_hans
  text: 因为即使从前那些已经消逝的事，连同所有与之相关的人[a]及对这些事的记念，离你也不远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们的主人／所有者”。原文的关系词可指这些事的主人、所属者或相关者；其具体所指不甚明确。
    reason: 避免将该关系词过度解释为犯罪者或行为人，同时使正文符合现代汉语表达。
lexical_decisions:
- source_word: ܩܕܡ̈ܝܬܐ
  choice: 从前那些……的事
  rationale: 按上下文作“从前的事”，不译成“从前的罪过”，以免加入原文在此未明确表达的道德含义。
- source_word: ܕܫܠܝܢ
  choice: 已经消逝的
  rationale: 表达已经过去、不再继续的状态，同时与英语审校层的“passed away”一致。
- source_word: ܡܪܝܗܝܢ（据审校所据读法）
  choice: 它们的所有者
  rationale: 保留“主人／所有者”这一较直译的关系，不因上下文擅自改成带犯罪色彩的“作恶者”。
- source_word: ܕܘܟܪܢܐ
  choice: 对它们的记忆
  rationale: 将名词理解为对先前之事的记忆或记念；中文补出关系词，使所指清楚。
- source_word: ܠܝܬ ܠܗܝܢ ܕܒܥܝܕܐ ܡܢܟ
  choice: 也离你不远
  rationale: 采用自然汉语表达空间隐喻，保留这些事在上帝面前并不遥远、并未隐没的含义。
theological_decisions:
- issue: “从前的事”是否应理解为“从前的罪过”
  choice: 从前那些已经消逝的事
  alternative: 从前的罪过
  rationale: 现有审校明确指出关键词应作“从前的事”；译作“罪过”会不必要地将经文限定为审判或罪责语境。
- issue: 与“从前的事”相关者的身份
  choice: 所有者
  alternative: 行为人／作成这些事的人
  rationale: 原有证据支持“主人／所有者”一类关系词；“行为人”虽可能更顺口，却会解释性地收窄原文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“连同……和……”保留原句并列结构；“所有者”虽略显陌生，但借脚注说明，以避免把含混的关系过度解释为“作恶者”或“行为人”。
