revisions:
- from: 因为即使从前那些已经消逝的事，连同它们的所有者[a]和对它们的记忆，也离你不远。
  to: 因为即使从前那些已经消逝的事，连同所有与之相关的人[a]及对这些事的记念，离你也不远。
  rationale: 修订补出了整体范围词，并将对现代汉语读者易产生物权误解的“它们的所有者”调整为“所有与之相关的人”。脚注保留“主人／所有者”的字面可能和原文所指的含混性。未将“从前的事”改译为“罪过”，也未把相关者限定为“行为人”或“作恶者”。
