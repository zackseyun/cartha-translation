  text: You who have commanded the air by a nod and have seen the things that are to come.
translation:
  language: zh_hans
  text: 你以一示意命令空气，也看见将来的事，如同看见你所做的事一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如同看见你所做的事一样”：原文也可较直译为“如同那些你所做的事”；比较分句在叙利亚文中较为凝缩，所比较的关系略有歧义。
    reason: 保留原文末尾比较分句，并说明其凝缩句法，避免将“所做”限定为进行时。
lexical_decisions:
- source_word: ܦܩܕ ... ܒܪܡܙܐ（据校勘还原）
  choice: 一示意便命令
  rationale: “示意”自然表达以动作或暗示发令；“便”体现命令随示意而成，不擅自限定为点头。
- source_word: ܠܐܐܪ（据校勘还原）
  choice: 空气
  rationale: 按此处通行的叙利亚文辨读，指空气或大气。
- source_word: ܐܝܠܝܢ ܕܥܬܝ̈ܕܢ
  choice: 将来的事
  rationale: 保留关系结构的概括性，既可指未来事件，也可指将要出现之物。
- source_word: ܐܝܟ ܐܝܠܝܢ ܕܥܒܕ ܐܢܬ
  choice: 如同看见你正在做的事一样
  rationale: 源文确有这一比较分句；补出中文比较结构中隐含的“看见”，使句意可读，同时不删去其神学张力。
theological_decisions:
- issue: 上帝对未来之事的看见与其行动之间的比较
  choice: 保留“如同看见你正在做的事一样”
  alternative: 省略该比较分句，仅作“也看见了将来的事”
  rationale: 叙利亚文材料明确保存“如同……你正在做”的分句；省略会损失原文，并可能削弱其关于神预知与行动关系的张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体；以“一示意”避免生硬的“借着一个点头”，并保留源文末尾较难解的比较分句。
