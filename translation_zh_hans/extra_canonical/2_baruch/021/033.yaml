lexical_decisions:
- source_word: ܫܡܟ（据校勘层所反映的“你的名”）
  choice: 你名
  rationale: 保留闪语式的庄重表达，不擅自增添原文没有的“圣”字。
- source_word: ܚܘܒܐ／相应属格结构（据校勘层所反映的“对你名的爱”）
  choice: 对你名的爱
  rationale: 保留“爱”与“你名”之间属格关系的张力，不改写成较具解释性的“爱你名之人的心”。
- source_word: ܩܕܡܝܟ（据校勘层所反映的“在你面前”）
  choice: 在你面前
  rationale: 采用自然且庄重的圣经汉语，表达处于上帝鉴察或临在之中的空间隐喻。
- source_word: ܥܠ ܟܠ（据校勘层所反映的“超乎一切”）
  choice: 超乎一切
  rationale: 保留比较或优越含义，并避免把它明确限定为修饰祈求动作。
theological_decisions:
- issue: “对你名的爱”的主体与含义
  choice: 保留“对你名的爱”
  alternative: 爱你名之人的爱心／你对自己名的爱
  rationale: 属格结构可能容纳不止一种理解；正文不指定爱的主体，以免引入特定神学解释。
- issue: 祈求动词是否属于可确证正文
  choice: 以方括号标示“求你顾念”
  alternative: 无括号直译为“求你顾念”
  rationale: 现有源页材料残缺且英文本也将该命令语置于方括号中，因此明确标出补足成分。
translation_notes:
  register: 采用现代、庄重而可理解的祷告语体。“你名”保留原文的闪语色彩；“超乎一切”维持其修饰关系的一定开放性。
