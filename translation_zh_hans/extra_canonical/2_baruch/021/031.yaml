  text: For the spirit of man is the ruler of the world, yet they do not know what belongs to it.
translation:
  language: zh_hans
  text: 因为人的灵是世界的治理者，却不知道什么是属于自己的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“世上的众人就是人的灵。”
    reason: 保留先前译法所反映的另一种句法及词义分析；现存来源文本及其切分存在困难。
lexical_decisions:
- source_word: ܪܘܚ
  choice: 灵
  rationale: 保留叙利亚语“灵、气息”的基本语义，并与本节所指的“人的灵”相称。
- source_word: ܡܕܒܪܢܘܬܐ / 相关治理词根
  choice: 治理者
  rationale: 依上下文及校勘层所辨认的治理、管理含义翻译；比“统治者”略少君王色彩，也比“管理者”更庄重。
- source_word: ܥܠܡ
  choice: 世界
  rationale: 此处按空间意义译为“世界”；该词也可指时代，但本句的治理关系更适合前者。
theological_decisions:
- issue: 人的灵与世界的关系
  choice: 译作“人的灵是世界的治理者”
  alternative: “人的灵统治世界”
  rationale: 保留原句对人的灵之治理地位的强烈陈述，不将其弱化为一般影响，也不增添有关神人权柄层级的解释。
- issue: 末句代词所指
  choice: 保留“他们”与“它”的表面张力
  alternative: 统一改为“人却不知道什么属于自己的灵”
  rationale: 来源材料呈现代词数与指称上的不平整；不在正文中擅自消解这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“治理者”既自然，也保留原句正式而带权柄意味的语气。
