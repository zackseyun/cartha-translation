translation:
  language: zh_hans
  text: 愿那留待其时的继续存留。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那留待其时的仍存留。”
    reason: 保留动词作陈述式而非祈愿式的可能。
  - marker: b
    text: “其时”也可理解为复数：“它的各个时期”。
    reason: 保留单复数读法上的文本与语法可能。
lexical_decisions:
- source_word: ܒܙܒܢܗ
  choice: 为其时
  rationale: 保留介词关系、单数“时候”及第三人称所属关系；用简洁庄重的“其时”表达，不擅自增添“指定”或“末后的”等解释。
- source_word: 表示保留、保存的叙利亚语表达
  choice: 所保留的
  rationale: 以名词化结构对应“那被保留之物”，既保持对象未明的含混，也避免擅自说明是谁保留或保留在哪里。
- source_word: 表示持续、存留的未完成式动词
  choice: 继续存留
  rationale: 兼顾动作的持续意义与祈愿语气；“存留”比单纯“继续”更清楚地承接前面的“保留”。
theological_decisions:
- issue: 动词是祈愿式还是陈述式
  choice: 译作祈愿：“愿……继续存留”
  alternative: 陈述：“……仍在存留”
  rationale: 本节处于祷告语境，未完成式可承担祈愿功能；正文采用祈愿读法，同时以脚注保留陈述式的可能。
- issue: “时”应作单数还是复数
  choice: 正文采用单数“其时”
  alternative: “其各时”或“它的各个时期”
  rationale: 单数读法更常见，也与某一时刻或期限的语境相称；但词形或传承容许复数理解，因此不将另一读法排除。
- issue: 被保留之物的身份
  choice: 保持“那……的”这一不特指表达
  alternative: 明确译成某种宝藏、事物或受造物
  rationale: 现有文本并未在本句中清楚指明对象；不以神学推断补足其所指。
translation_notes:
  register: 采用现代、简洁而庄重的祷告语体。“其时”略带书面色彩，但普通读者易懂，并能避免把原文解释性扩写为“指定的时刻”。脚注标记均已置于正文。
