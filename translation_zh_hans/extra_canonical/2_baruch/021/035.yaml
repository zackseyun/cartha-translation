  text: 愿你的荣耀彰显，愿你浩大的美善为人所知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܒܚܐ（“荣耀”，据本章叙述材料及英语审校层所保留的对应概念）
  choice: 荣耀
  rationale: 采用现代汉语宗教与文学语体中通行且庄重的对应词，并以“彰显”自然表达“被看见”。
- source_word: “greatness”（底本所据本节对应词在所给叙利亚文页面中无法可靠定位；参考英语审校层）
  choice: 浩大
  rationale: “浩大”既保留程度与规模之意，又比“伟大”更适合修饰抽象的“美善”。
- source_word: “goodness”（参考英语审校层）
  choice: 美善
  rationale: “美善”可涵盖良善、恩惠与善意，不把原义收窄为某一种具体恩典。
theological_decisions:
- issue: “你的荣耀被看见”是否具体化为神显或救赎行动
  choice: 译作“愿你的荣耀彰显”
  alternative: “愿人看见你的荣耀”
  rationale: 保留祈愿及神圣荣耀显明的开放含义，不限定其实现方式；“彰显”也符合自然、庄重的现代汉语。
- issue: 美善的接受者是否明说为“世人”
  choice: 采用无特定主体的“为人所知”
  alternative: “让世人知道”
  rationale: 原句未限定认识者的范围，因此不增添“世人”等可能扩大的对象。
