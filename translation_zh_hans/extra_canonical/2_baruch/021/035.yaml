  register: 采用简洁、庄重而自然的现代标准汉语。所提供的叙利亚文是章节页面桶，目标节文字未能在可见材料中可靠逐词定位，因此译文谨慎遵循英语POB审校层所呈现的语义，不据此补入额外细节。
