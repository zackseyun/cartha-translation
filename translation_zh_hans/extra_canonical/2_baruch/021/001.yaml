base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/021/001.yaml
  text: And I went away from there and sat in the valley of Kidron, in a cave of the earth. And I sanctified my soul there. I ate no bread, yet I was not hungry; and I drank no water, yet I was not thirsty. And I remained there until the seventh day, as he had commanded me.
translation:
  language: zh_hans
  text: 我从那里离开，坐在汲沦谷的一处地下洞穴里。我在那里使自己分别为圣。我没有吃饼，却不觉得饿；也没有喝水，却不觉得渴。我留在那里，直到第七日，正如他所吩咐我的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܥܪܬܗܘܝ ܕܡܥܪܬܐ
  choice: 地下洞穴
  rationale: 保留叙利亚文中洞穴与土地相连的具体意象，同时避免生硬直译为“地的洞穴”。
- source_word: ܩܕܫ / sanctification expression reflected in the control tradition
  choice: 使自己分别为圣
  rationale: 保留自我预备、奉献为圣的宗教含义，不弱化为一般性的“洁净自己”。
- source_word: Kidron geographical designation in the control tradition
  choice: 汲沦谷
  rationale: 采用现代汉语中通行的地名形式；“谷”比“溪流”更自然，也符合此处退隐地点的地理表达。
theological_decisions:
- issue: 巴录禁食期间不饥不渴的表述
  choice: 按叙事直陈为“却不觉得饿……却不觉得渴”
  alternative: 解释为神迹性维持，或改写为刻意忍受饥渴
  rationale: 原句只陈述结果，没有说明原因；译文保留这种含蓄，不额外规定其神学机制。
- issue: “使自己成圣”的含义
  choice: 译作“使自己分别为圣”
  alternative: “洁净自己”或“预备自己”
  rationale: “分别为圣”保留宗教奉献和礼仪预备的张力，而不把它限定为道德洁净或普通心理准备。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。句式保留原文连续的第一人称叙述，并以“却”清楚呈现禁食与不饥不渴之间的反差。
