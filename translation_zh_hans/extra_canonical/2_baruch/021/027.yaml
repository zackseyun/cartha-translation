  text: And what is preserved remains for what is made new.
translation:
  language: zh_hans
  text: 凡被保全的，仍为那被更新的而存留[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那被更新的”也可理解为“将被更新的事物”。原句未明确所指的具体对象，因此不宜限定为人、天地或整个受造界。
    reason: 保留原句对于“被更新者”具体指涉及更新时态的含混。
lexical_decisions:
- source_word: （对应英审校层 preserved 的叙利亚语被动表达）
  choice: 被保全的
  rationale: 保留受事性的含混，不明说施行保全者；“保全”比“保存”更适合指受造界或生命的存留。
- source_word: （对应 remains 的存留表达）
  choice: 仍存留着
  rationale: 传达持续存在之意，并采用自然、庄重的现代汉语。
- source_word: （对应 made new 的更新表达）
  choice: 更新之物
  rationale: 保留原文名词化表达可能指向更新后的受造之物或更新之事，不擅自限定具体对象。
theological_decisions:
- issue: “被保全”者与“更新之物”的关系
  choice: 译作“为那更新之物”，保留目的或归属关系
  alternative: “直到被更新”或“为要得到更新”
  rationale: 英审校层明确区分“被保全的”与“那更新之物”；不将二者直接认定为同一对象，以免消除原句可能存在的末世论张力。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“被保全”保留被动含义，“存留着”避免文言化过重；脚注标记已在正文中出现。
