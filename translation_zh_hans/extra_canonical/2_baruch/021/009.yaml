translation:
  language: zh_hans
  text: 从世界之初，你呼唤那些不存在的事物，它们也听从你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܪܝܫ ܥܠܡܐ
  choice: 从世界之初
  rationale: 按字面保留时间起点的表达，语序符合现代汉语。
- source_word: ܩܪܐ
  choice: 呼唤
  rationale: 保留“发声召唤”的基本义，也维持受造之物回应上帝命令的语境。
- source_word: ܕܒܕܓܠܐ ܠܐ
  choice: 不存在的事物
  rationale: 底本文字传抄或识读存在困难；依据句法、语境及校审层所反映的文本意义，采用中性表述，不增添“尚未”等时间限定。
- source_word: ܡܫܬܡܥܝܢ
  choice: 听从
  rationale: 该词既含“听见”也含“服从”之意；“听从”在汉语中同时体现听见召唤并作出顺服回应。
theological_decisions:
- issue: 呼唤不存在之物的创造意涵
  choice: 保留“不存在的事物”这一张力，不解释为“使无变有”或“预定未来之事”
  alternative: 译作“尚未存在的事物”或“使无变有”
  rationale: 原句并未明确加入“尚未”，也未直接说明呼唤的结果；直译可避免把潜在的创造论含义扩写成特定教义命题。
- issue: 无生命事物“听从”的拟人表达
  choice: 保留“它们也听从你”
  alternative: 意译为“它们便应召存在”
  rationale: 保留原文诗性拟人和神学张力，不把回应具体解释为受造过程。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留原句简洁、祷告式的第二人称陈述，不添加解释性成分。
