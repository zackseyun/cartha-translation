  text: Therefore from now on show your greatness, and do not overlook what is brought to nothing under the kingdom of death.
translation:
  language: zh_hans
  text: 所以，从现在起，求你彰显你的伟大，不要忽视那在死亡权势之下归于虚无的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死亡权势”直译可作“死亡的国度”；“归于虚无”也可译作“被废除”或“被消灭”。
    reason: 交代两个具有实质意义且不宜在正文中强行消除的词义分歧。
lexical_decisions:
- source_word: ܪܒܘܬܟ（据本节对应叙利亚语词形重构）
  choice: 你的伟大
  rationale: 保留“伟大、尊荣、威势”的宽泛含义；不擅自具体化为“荣耀”或“能力”所施行的某一行动。
- source_word: ܡܠܟܘܬܐ ܕܡܘܬܐ（据本节对应叙利亚语短语重构）
  choice: 死亡权势
  rationale: 字面可作“死亡的国度/王权”；现代汉语用“权势”较自然，也保留死亡被拟人化为统治力量的意象。
- source_word: ܡܬܒܛܠ（据本节对应叙利亚语词形重构）
  choice: 归于虚无
  rationale: 该词可涵盖“被废除、消灭、化为乌有”；此处不用更具解释性的“被毁灭”，以保留语义张力。
theological_decisions:
- issue: “死亡的国度/权势”是否指具体的末世领域
  choice: 死亡权势
  alternative: 死亡的国度
  rationale: 不将其限定为地理性的阴间，也不消解其统治意象；“权势”可兼顾拟人化王权与死亡支配的含义。
- issue: “归于虚无的”所指为何
  choice: 保留无明确先行词的中性表达
  alternative: 译作“那些将要灭亡的人”
  rationale: 原句所指具有歧义，不擅自判定为人、受造界或某项应许。
translation_notes:
  register: 采用现代、庄重的祷告语体；以“求你”显明祈求语气，但避免古雅的“尔、彰显威荣”等表达。所给章节页桶并未清楚呈现本节完整行文，故正文依据对应叙利亚语传统的词义范围，并以英文POB作为校核层；相关不确定性已在词汇说明中明示。
