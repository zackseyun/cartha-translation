  text: of those who live and of those who are as nothing. For life that is not gladdened is no life.
translation:
  language: zh_hans
  text: 无论是活着的人，还是如同不存在的人；因为没有喜乐的生命，算不得生命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܐ
  choice: 活着的人／生命
  rationale: 该词根在本句中依语境分别表达“活着”与“生命”，中文按其句法功能自然区分。
- source_word: ܐܝܬ
  choice: 存在
  rationale: 保留存在性措辞，以“如同不存在的人”表达与活人相对的状态，不擅自解释为死人或恶人。
- source_word: ܡܒܣܡܐ
  choice: 喜乐
  rationale: 此词可指欢悦、愉快或甘美；“喜乐”既庄重自然，也切合生命得到欢欣的语境。
theological_decisions:
- issue: “如同不存在的人”所指为何
  choice: 保留存在论式的模糊表达，不明确等同于死人、被遗忘者或受审判者
  alternative: 译作“死人”或“归于虚无的人”
  rationale: 现存叙利亚文在此处传读困难，英语审校层也保留“are as nothing”；不应在译文中加入来源未明确给出的末世论解释。
- issue: “没有喜乐的生命算不得生命”的断言强度
  choice: 用“算不得生命”表达修辞性的否定
  alternative: 译作“就不是生命”
  rationale: 这样既保留强烈判断，也避免被误读为对生物性生命作字面否定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如同不存在”保留原句的张力；分号呈现后一分句对前文的解释关系。
