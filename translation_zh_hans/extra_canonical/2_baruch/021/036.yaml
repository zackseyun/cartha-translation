  text: Let Sheol be sealed, so that from now on it may not receive the dead.
translation:
  language: zh_hans
  text: 愿阴间被封闭，使它从今以后不再接收死人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܝܘܠ
  choice: 阴间
  rationale: 指死者所在之处，不等同于带有终极刑罚含义的“地狱”；采用现代中文圣经语境中较准确、自然的对应词。
- source_word: ܬܬܚܬܡ
  choice: 被封闭
  rationale: 该被动动词意为“被封上、被封闭”；“被封闭”在此比“被盖印”更自然，也保留阴间被关闭的意象。
- source_word: ܬܩܒܠ
  choice: 接收
  rationale: 基本义为“接纳、接收”，这里以阴间为主语、死人为宾语；“接收”准确表达其不再容纳新死者，而不误作仅仅扣留已有死者。
- source_word: ܡܢ ܗܫܐ
  choice: 从今以后
  rationale: 自然表达由当前时点开始、延续至未来的时间含义。
- source_word: ܡܝ̈ܬܐ
  choice: 死人
  rationale: 直接对应复数名词“死者”；“死人”通俗明确，并符合此句关于阴间接收死者的语境。
theological_decisions:
- issue: “Sheol”的译法
  choice: 阴间
  alternative: 地狱
  rationale: 原词所指是死者的领域，本句没有明确表达终极惩罚；译作“地狱”会加入原文未明说的神学限定。
- issue: 阴间被封闭所表达的范围
  choice: 保留为不再接收死人
  alternative: 解释为死亡本身被彻底消灭或已有死者立即复活
  rationale: 原句只明确说阴间将被封闭，不再接收死者；不在正文中推演其末世次序或具体机制。
translation_notes:
  register: 采用庄重而直接的现代标准汉语。句式保留祈愿语气；不沿用缺乏叙利亚文支持的旧译“被搅动”，也不把“接收”改释为“扣留”。
