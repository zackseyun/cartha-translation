  text: And because the world was created for a time, and those in it are sustained with much trouble, command concerning evil.
translation:
  language: zh_hans
  text: 因为这世界是为一段时期[a]而造的，世上的人在许多患难中得以存活[b]；求你针对邪恶下令[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为时间而造”。
    reason: ܙܒܢܐ可指“时间”或“一段时期”；正文以“一段时期”自然表达受造世界的有限性，替译保留较直译的可能。
  - marker: b
    text: 也可译：“在其中带着许多患难生活”。
    reason: 有关介词关系以及“得以存活／生活”的具体表达可有不同处理；正文不把患难本身误作维持生命的施事。
  - marker: c
    text: 也可译：“吩咐有关邪恶的事”。原句没有说明命令的具体内容，思想可能延续至下一节。
    reason: 保留命令所指和节界衔接的不确定性，不擅自补入“除灭”或“审判”等结果。
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: 世界
  rationale: 按本节语境指受造并受时间限制的世界，而非抽象的“永恒”。
- source_word: ܙܒܢܐ
  choice: 一段时期
  rationale: 保留“时间、时期”的词义，并自然表达世界具有有限期限；不擅自具体化为某个末世阶段。
- source_word: ܚܝ̈ܒܘܬܐ / ܒܝܫܬܐ（据本节传本文意）
  choice: 邪恶
  rationale: 采用宽泛而中性的道德用语，不将其限定为罪责、灾祸或某一具体恶行。
- source_word: ܦܩܕ（据本节传本文意）
  choice: 发令
  rationale: 保留命令、吩咐的直接语气；不补入原文未明说的执行结果。
theological_decisions:
- issue: 世界受造的时间性质
  choice: 为一段时期而造
  alternative: 为时间而造
  rationale: “一段时期”符合现代汉语，并保留世界具有期限的含义；不将其解释为世界为抽象的“时间”服务。
- issue: “就邪恶发令”的对象与结果
  choice: 保持概括，不说明命令邪恶消失或受审判
  alternative: 下令除灭邪恶
  rationale: 现有叙利亚文见证和节界所呈现的短句并未清楚交代命令的具体内容或结果，应保留悬而未决的张力。
- issue: 人在患难中的状态
  choice: 在重重患难中才得以维生
  alternative: 被许多患难维持
  rationale: 前者在汉语中自然，也传达艰难维持生存之意，同时避免把患难本身拟作维系生命的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”承接向上帝祈求的语境；句末用句号方便独立诵读，但脚注说明原意可能延续至下一节。
