  text: “Woe to my heart, for it bursts open into a spring of grief, and from there tears flow from my eyes, and I am not satisfied with weeping.”
translation:
  language: zh_hans
  text: 我的心哪，有祸了！它迸裂，成了悲哀的泉源[a]；泪水由此从我眼中流出，我哭也哭不够。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它在悲哀的泉源处裂开。”
    reason: 相关叙利亚文的句法和意象关系存在歧义，既可理解为心迸裂而成为泉源，也可理解为心在泉源处裂开。
lexical_decisions:
- source_word: ܘܝܠܗ ܠܒܒܝ
  choice: 我的心啊，有祸了
  rationale: 保留哀叹语“有祸了”的力度，同时用呼语形式使现代汉语自然庄重。
- source_word: ܒܡܒܘܥܐ ܕܐܒܠܐ
  choice: 成了悲哀的泉源
  rationale: 保留“悲哀之泉”的核心意象，并与下文泪水流出相衔接。
- source_word: ܘܠܡܒܟܐ ܠܐ ܐܫܒܥ
  choice: 我哭也哭不够
  rationale: 直现“不因哭泣而满足”的未尽悲痛，符合现代汉语习惯。
