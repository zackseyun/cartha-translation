  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘ
  choice: 并且
  rationale: 保留句首连接词，使本句与上文祷告中的连续陈述相接。
- source_word: ܒܠܚܘܕܝܟ ܐܢܬ
  choice: 唯有你
  rationale: 准确表达第二人称单数及排他性的“你独自、唯独你”。
- source_word: ܙܕܩܐ
  choice: 有权
  rationale: 该词可表示“是合宜的、理当属于”；此处译作“有权”，自然地传达这项探究唯独属于上帝，而不把语气弱化为一般能力。
- source_word: ܕܬܒܥܝܟ
  choice: 探究
  rationale: 采用表示追寻、查考并寻明的动词，符合祷告中对上帝独有知识的陈述。
- source_word: ܒܪܝܫܘܬܗ
  choice: 本源
  rationale: 保留“起首、开端、根源”的语义；“本源”在现代汉语中简洁而庄重。
- source_word: ܟܘܠܐ ܕܒ̣ܝܬ
  choice: 整个秩序
  rationale: 按校审层所反映的整体结构或安排来译；所给叙利亚文转写在此处疑有文本或识读困难，因此避免擅自具体化为某种受造物。
theological_decisions:
- issue: 唯独上帝与“探究”之间可能形成的张力
  choice: 保留“唯有你有权探究”
  alternative: 唯有你知道
  rationale: 原文陈述的是寻索或探究，而不只是静态的“知道”；保留这一拟人化表达，不替作者消解其神学张力。
- issue: ܙܕܩܐ 所表达的是权属还是合宜性
  choice: 有权
  alternative: 理当由你／属于你
  rationale: “有权”在中文中兼顾专属权属与合宜性，同时不引入特定宗派含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。句首“并且”维持上下文连贯；“整个秩序的本源”保留抽象性，不擅自将其解释为创造过程、宇宙法则或救赎秩序。
