  text: 此后，我来到你曾对我说话的地方，坐在地下的洞穴中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܡܢ ܒܬܪܗܝܢ
  choice: 此后
  rationale: 直译为“在这些事之后”；用“此后”自然承接上文，同时保留时间先后关系。
- source_word: ܠܐܬܪܐ ܗܘ ܕܡܠܠܬ ܥܡܝ ܬܡܢ
  choice: 你曾在那里对我说话的地方
  rationale: 保留叙利亚文关系结构中的地点副词ܬܡܢ（“在那里”）；此表达在现代汉语中自然，也明确指出先前说话发生于该处。
- source_word: ܘܝܬܒܬ
  choice: 坐在
  rationale: ܝܬܒ在此表示坐下、停坐；中文按后接地点自然译为“坐在……中”。
- source_word: ܒܡܥܪܬܗܘܝ ܕܡܥܪܬܐ
  choice: 地穴中
  rationale: 底本此处的传抄或识读形式不够清晰；参照可辨认的“洞穴”语素及英译审校层的“cave of the earth”，以“地穴”简洁表达位于地下或土中的洞穴，不作超出证据的地名化解释。
theological_decisions:
- issue: 说话者的指称
  choice: 保留第二人称“你”
  alternative: 改作“上帝”或“主”
  rationale: 原文为第二人称单数动词，祷告语境虽指向上帝，但不应把原文代词显化为神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“此后”承接叙事，“你曾在那里对我说话的地方”保留原文略带回指性的句法；末句因叙利亚文本形态不够清晰，采用谨慎而通顺的“地穴中”。
