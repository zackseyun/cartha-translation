  text: And let the treasuries of the souls restore those who are shut up in them, that there may be a gathering of the sons of men, as you commanded from of old.
translation:
  language: zh_hans
  text: 愿众灵魂的库房交还其中被囚禁的人，使人类得以聚集，正如你从古时所吩咐的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܨܪ̈ܐ ܕܢܦܫ̈ܬܐ
  choice: 众灵魂的库房
  rationale: 按相关叙利亚语证据直译为存放灵魂的“库房”，保留本书末世语境中的具体意象，不泛化为“居所”。
- source_word: ܢܦܢܘܢ
  choice: 交还
  rationale: 该动词可表达使返回、归还；“交还”既保留方向感，也不预先断定复活过程的具体方式。
- source_word: ܐܝܠܝܢ ܕܚܒܝܫܢ ܒܗܘܢ
  choice: 那些被关在其中的人
  rationale: 保留被动状态及“其中”的复数所指，即众库房。
- source_word: ܟܢܘܫܝܐ ܕܒܢܝܢܫܐ
  choice: 世人得以聚集
  rationale: 将“人的众子”按现代汉语惯用法译为“世人”，并把名词“聚集”自然地转为目的分句。
- source_word: ܡܢ ܩܕܝܡ
  choice: 从古时
  rationale: 保留时间久远、起初已有命令的含义，措辞庄重而自然。
theological_decisions:
- issue: 灵魂库房与末世聚集之间的关系
  choice: 译作库房“交还”其中被关的人，目的在于世人聚集
  alternative: 译作库房“释放”其中的人，或把“世人”理解为交还的对象
  rationale: 现有叙利亚语句法证据支持“那些被关在其中的人”作交还动词的宾语，而“世人的聚集”构成目的分句；“交还”同时避免过度解释为某一特定复活机制。
translation_notes:
  register: 采用现代、庄重而易懂的祈愿句式。“库房”保留原文意象；“世人”比字面的“人的众子”更符合现代标准汉语。脚注标记已在正文中以[a]呈现。
