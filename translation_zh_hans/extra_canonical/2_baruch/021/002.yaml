  text: 此后，我来到你曾在那里与我说话的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܡܢ ܒܬܪܗܝܢ
  choice: 此后
  rationale: 字面为“在这些事之后”；现代汉语用“此后”自然简洁，也保留了承接前文的关系。
- source_word: ܐܬܝܬ ܠܐܬܪܐ ܗܘ
  choice: 我来到……的地方
  rationale: 准确表达第一人称动词“我来到”和特指的“那个地方”，汉语关系从句中无需重复指示词。
- source_word: ܕܡܠܠܬ ܥܡܝ ܬܡܢ
  choice: 你曾在那里与我说话
  rationale: ܡܠܠܬ 是第二人称单数“你说话”，ܥܡܝ 为“与我”，ܬܡܢ 为“在那里”；“曾”体现先前发生的动作。
theological_decisions:
- issue: 说话者所称对象的人称
  choice: 你
  alternative: 他
  rationale: 叙利亚文动词 ܡܠܠܬ 明确是第二人称单数；本节处于向上帝祷告的直接称呼中，因此依原文译为“你”，不沿用英文咨询层的第三人称“he”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；句式简洁，适合经文朗读。
