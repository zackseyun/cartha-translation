translation:
  language: zh_hans
  text: 免得人的败坏再次显露，仿佛人未曾受造。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句叙利亚文传本残缺，句法也较晦涩；亦可理解为：“免得人的败坏再次被看作如同人未曾受造。”
    reason: 保留原文残损所造成的句法与指代不确定性。
lexical_decisions:
- source_word: ܡܬܚܒܠܘܬܗܘܢ / ܚܒܠ
  choice: 败坏
  rationale: 该词可指毁坏、败坏或灭亡；此处谈论人的受造与结局，用“败坏”既保留道德—存在层面的张力，也不把含义缩窄为单纯肉体死亡。
- source_word: ܒܪܝ / ܐܬܒܪܝ
  choice: 受造
  rationale: 采用“受造”准确表达被创造的被动意义，并与本段创造语境相呼应。
- source_word: ܬܬܝܕܥ / ܡܬܚܙܐ（据句义及传本理解）
  choice: 显得
  rationale: 原句表达某种表象或被认知的结果；“显得”自然地保留“仿佛”所引出的非事实比较。
theological_decisions:
- issue: “人的败坏”与“从未受造”之间的关系
  choice: 保留为表象性的比较：“显得仿佛”
  alternative: 译成确定的神学判断，如“证明人本不该被造”
  rationale: 原文旨在否定一种表象，并未断言创造本身错误；译文不替文本消解有关受造、败坏与终局之间的张力。
- issue: “人”是泛指还是特定男性个体
  choice: 译作泛指的“人”
  alternative: 译作“他”或“男人”
  rationale: 上下文论及人类受造与败坏，泛指“人”比带性别或特定指称的表达更合适。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“免得……再次……”对应目的或结果性的否定从句；“仿佛”保留原句的非事实比较。主文加入脚注标记，以说明叙利亚文传本残缺和可替代句法理解。
