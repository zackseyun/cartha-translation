  text: 你一发令，闪电便听命；你看见将来的事，如同已经过去的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐܙܐ
  choice: 闪电
  rationale: 按上下文取其指自然现象“闪电”的常见释义。
- source_word: ܦܩܝܕܐ ܒܪܘܙܝܟ
  choice: 你一发信号，就号令
  rationale: 既保留“发出信号”与“命令”的语义关系，又采用自然的现代汉语表达。
- source_word: ܐܝܠܝܢ ܕܥܬܝ̈ܕܢ
  choice: 未来的事
  rationale: 直译其时间指向，即尚未来到、将要发生之事。
- source_word: ܐܝܠܝܢ ܕܥܒܪ̈ܝ
  choice: 已经过去的事
  rationale: 按经校核的叙利亚文词根 ܥܒܪ（经过、过去）翻译，与“未来的事”构成时间上的对照。
theological_decisions:
- issue: 上帝对未来之事的认识如何表述
  choice: 未来的事，你也看得如同已经过去的事
  alternative: 未来的事，你看见了，如同你所做的事
  rationale: 正文采用校核后更符合时间对照的读法，同时不把经文扩展为某一套关于预知方式的系统神学命题；异读在脚注中保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一发信号，就号令”呈现神发令与闪电受命的关系；分号保留原句两组并列陈述。
