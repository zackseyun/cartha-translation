  text: For what is visible in them? Or what visible hope is there? Or what visible dwelling is not vanity?
translation:
  language: zh_hans
  text: 因为在它们中间，有什么是看得见的呢？有什么看得见的盼望呢？又有什么看得见的居所不是虚空呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܙܐ
  choice: 看得见的
  rationale: 保留原文“可见、能被看见”的意义，并在三个反问句中采用一致措辞，以凸显重复结构。
- source_word: ܣܒܪܐ
  choice: 盼望
  rationale: 此处指所盼望或可寄望之事；“盼望”自然庄重，也不预先限定其神学含义。
- source_word: ܥܘܡܪܐ
  choice: 居所
  rationale: 采用涵盖住所、栖身之处的中性表达，避免缩窄为特定建筑。
- source_word: ܣܪܝܩܘܬܐ
  choice: 虚空
  rationale: 表达空无、徒然的性质；“虚空”比“毫无价值”更能保留原文的开放性和智慧文学色彩。
theological_decisions:
- issue: 三个反问句是否应改写为明确断言
  choice: 保留反问形式
  alternative: 译成“其中没有什么可见之物；可见的盼望和居所都是虚空”
  rationale: 原句借连续反问表达对可见事物的质疑；保留句式可避免把诗性张力化约为绝对化的教义断言。
- issue: “它们”所指为何
  choice: 保留代词“它们”
  alternative: 根据上下文补明为“世上的事物”或“受造之物”
  rationale: 本节所给材料未能无歧义地确定先行词，保留代词可避免擅自解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个分句反复使用“看得见的”，对应原句的修辞回环；末句用“虚空”保留“空无／徒然”之间的语义张力。
