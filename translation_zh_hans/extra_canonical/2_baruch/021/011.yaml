  text: In the great reckoning, the offenses of those who are before you are kept before you.
translation:
  language: zh_hans
  text: 在那重大的核算中，那些在你面前的人的过犯仍记在你面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重大的核算”也可译作“重大的审察”或“重大的考量”。本句相关动词可理解为“被记念／被保留”；也有人将其理解为：“你在重大的核算中记念那些在你面前的人的过犯。”
    reason: 保留ܚܘܫܒܐ的“核算／考量／审察”范围，并谨慎标示相关动词的另一种主动句法理解。
lexical_decisions:
- source_word: ܚܝ̈ܒܘܬܐ
  choice: 过犯
  rationale: 该词在此指应受追究的罪责或过失；“过犯”既保留道德与司法色彩，也符合庄重的祷告语体。
- source_word: ܒܚܘܫܒܐ ܪܒܐ
  choice: 在那重大的审察中
  rationale: ܚܘܫܒܐ 可指计算、核算、考量或审察；上下文涉及上帝记念并追究过犯，译作“审察”较自然，同时以脚注保留“核算”的可能。
- source_word: ܡܕܟ̣ܪܐ
  choice: 陈列
  rationale: 抄本读法及句法存在困难；此处表达过犯持续在上帝面前、未被遗忘。采用“陈列”可自然呈现这一状态，又不把句子强行改成上帝主动回想。
- source_word: ܕܩܕܡ̈ܝܟ ... ܩ̣ܕܡܝܟ
  choice: 你面前之人……在你面前
  rationale: 保留原文同根短语的重复：前者修饰那些人，后者说明过犯所在，避免删去其修辞和语义层次。
theological_decisions:
- issue: 上帝对过犯的记念是主动行为还是过犯持续呈现的状态
  choice: 译为过犯“陈列在你面前”
  alternative: “你在自己面前记念……的过犯”或“过犯被保存在你面前”
  rationale: 源文相关动词形态和传本文句不够明朗；主译文采用状态性表达，既不否认上帝的主动知晓，也不把语法争议过度确定化。
- issue: ܚܘܫܒܐ 的末世审判含义
  choice: “重大的审察”
  alternative: “大核算”或“大清算”
  rationale: 上下文有司法意味，但原词本身未必专指某一套末世审判术语，因此避免直接译成带强烈既定教义色彩的“大审判”。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“你”指向上帝，但不额外补入神名或尊称。主句保留“你面前”的重复，以对应叙利亚文结构。
