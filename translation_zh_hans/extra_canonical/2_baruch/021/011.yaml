  source_fidelity: 叙利亚文以“过犯”为主语，表达这些过犯在（或为着）“重大的核算／考量”中持续被记念、保留在“你面前”。现译“陈列”虽试图作状态性处理，却偏向可见的摆放，未能准确传达记念／保留的语义。
  naturalness: “你面前之人”在现代汉语中生硬，易被理解为恰好站在上帝面前的人；“过犯都陈列在你面前”也不够自然。改为“那些在你面前的人的过犯仍记在你面前”，在保留原文重复的同时较为通顺。
  terminology: ܚܝ̈ܒܘܬܐ译为“过犯”恰当。ܒܚܘܫܒܐ ܪܒܐ宜译“重大的核算”；“审察”可作为脚注备选，但不宜将其作为主译而弱化原词的核算／考量语义。
  issues:
  - severity: medium
    issue: “陈列”未充分对应相关动词的“被记念／被保留”语义。
    rationale: 英语审校轨迹虽曾讨论被动态，但其稳定结论为“are kept before you”；源文的语境也指过犯未被遗忘，而不是实物般被摆列。
  - severity: medium
    issue: “你面前之人”不合现代汉语习惯。
    rationale: 应改为“那些在你面前的人”，并保留后面的“在你面前”，以反映源文重复而不制造文法障碍。
  - severity: low
    issue: 脚注将主动“记念”说成完整替代译法，未清楚区分主句的被动／状态性读法。
