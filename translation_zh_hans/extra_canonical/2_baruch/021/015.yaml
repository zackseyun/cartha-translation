  text: You do not decree rain and flood except on account of sinful man.
translation:
  language: zh_hans
  text: 你若非因[b]有罪的人，就不命定[a]洪水和雨水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“说”。
    reason: 原文动词的基本义为“说、发言”；正文按其在此处支配雨水和洪水的权威性语境译为“命定”。
  - marker: b
    text: 或译：“关乎”。
    reason: 该关系词在其他语境可作较宽泛的关联理解；本句的否定限制结构中，以“因”表达缘由更为贴切。
lexical_decisions:
- source_word: ܡܡܠܠ
  choice: 降旨
  rationale: 该词基本义为“说、发言”；这里以上帝为主语，以雨水和洪水为其权威话语所支配的对象，译作“降旨”既保留言说行为，也符合现代汉语表达。
- source_word: ܛܘܦܢܐ ܡܛܪܐ
  choice: 雨水和洪水
  rationale: 两个名词分别指洪水与雨；按自然汉语调整次序，并以“和”明确并列关系。
- source_word: ܐܠܐ
  choice: 无非是因为
  rationale: 此处具有“除非、若非”的限制意味；结合上下文，用“无非是因为”自然表达行为仅以有罪之人为缘由，而不把这种因果关系解释得更具体。
- source_word: ܐܢܫܐ ܡܣܟܠܢܐ
  choice: 有罪的人
  rationale: ܡܣܟܠܢܐ 指犯错、犯罪或有罪者；“有罪的人”庄重清楚，也避免将其弱化为仅仅“不明智的人”。
theological_decisions:
- issue: 雨水与洪水同人的罪之间的关系
  choice: 译为“因为有罪的人”，表达原因或缘故
  alternative: 译为“关乎有罪的人”
  rationale: ܐܠܐ 所构成的限制句在此更自然地指向缘由；但不进一步说明这是惩罚、审判还是别的安排，以保留原文的神学张力。
- issue: 上帝话语的施行方式
  choice: 用“降旨”表达权威性的言说
  alternative: 直译为“说出”
  rationale: 原文动词本身是“说”，但现代汉语不能自然地说“说出雨水和洪水”；“降旨”表达话语产生或支配事件的权威性，同时以脚注保留直译可能。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“降旨降下”略带经文式庄重感，并清楚区分上帝的命令与雨洪事件本身；两处脚注标记均置于正文对应词后。
