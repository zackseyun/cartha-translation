  text: Bring near those who are sought, and let what began in toil rejoice at the arrival of your glory.
translation:
  language: zh_hans
  text: 求你使那些被寻找的人临近，也让那在劳苦中开始的，因你荣耀的来临而欢喜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܪܒ / “bring near” （据校订咨询层所反映的底本文义）
  choice: 使……临近
  rationale: 保留使役意义及空间或关系上的“接近”这一开放性，不具体化为“召聚”或“拯救”。
- source_word: “those who are sought”
  choice: 那些被寻找的人
  rationale: 保留被动表达，不擅自确定寻找者，也不将其解释为“选民”或“失丧者”。
- source_word: “what began in toil”
  choice: 那在劳苦中开始的
  rationale: 保留原句非人格化、指称未明的表达；不擅自补成某一群体、工程或时代。
- source_word: “at the arrival of your glory”
  choice: 因你荣耀的来临
  rationale: “因”自然表达欢喜的缘由；“荣耀的来临”保留荣耀被拟人化或作为显现事件的张力。
theological_decisions:
- issue: “你荣耀的来临”是否明确解释为上帝亲自降临或末世事件
  choice: 保持“你荣耀的来临”
  alternative: 你在荣耀中降临／你的荣耀显现
  rationale: 原表达容许相关联想，却未必等同于某一特定教义术语，因此不作释义性限定。
- issue: “被寻找的人”的身份
  choice: 不明确其群体身份
  alternative: 被拣选的人／流散的人／失丧的人
  rationale: 上下文资料不足，且原有被动结构本身未指明这些人的身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你”承接祷告语境；后半句保留“那……的”这一有意未定的指称，以免消解原文歧义。
