lexical_decisions:
- source_word: ܐܘܡܘܗܝ ܕܫܡܝܐ
  choice: 天上的众军
  rationale: 按所给校勘层将该短语理解为“天上的众军”，保留其群体性及天界意象。
- source_word: ܝܕܥ
  choice: 知道
  rationale: 采用普通、直接的认知动词，不补出原文未明说的宾语。
- source_word: ܒܪܘܚܐ
  choice: 藉着灵
  rationale: 介词ܒ表达凭借或媒介；译作“藉着”较贴合。ܪܘܚܐ本身可指灵、气息或风，此处依语境译“灵”，但不加“圣”字，以免消除原文的神学含混。
theological_decisions:
- issue: ܪܘܚܐ是否特指圣灵
  choice: 灵
  alternative: 圣灵
  rationale: 原文没有相当于“圣”的限定语；译作“灵”既与来源相符，也避免把后来的三一论术语明确导入这段犹太文献。
- issue: 是否补明“知道”的宾语
  choice: 不补宾语
  alternative: 补作“知道万事”等
  rationale: 所给句子没有明示宾语；保留省略可避免替原文解决语义张力。
translation_notes:
  register: 采用简洁、庄重而现代的书面语。“藉着”体现媒介意义；句法保留原文的简略，不作解释性扩写。
