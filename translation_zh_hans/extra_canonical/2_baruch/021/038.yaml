  text: 也要让那些同他们在一起、与他们相似的人知道：这正是时候。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: 时候
  rationale: 该词可指“时间、时候、时期”；此处带有特指意味，译作“那时候”既自然，也不擅自说明它具体指哪个末世或历史阶段。
- source_word: 与“同他们在一起”相对应的叙利亚语关系表达（本页材料未能可靠分离出本节词形）
  choice: 同他们在一起
  rationale: 依照经审校的英文咨询层保留陪伴或归属关系，不扩大为“他们的同党”等带评价色彩的说法。
- source_word: 与“与他们相似”相对应的叙利亚语比较表达（本页材料未能可靠分离出本节词形）
  choice: 与他们相似
  rationale: 保留“相似”的开放范围，不具体解释为行为、命运、信仰或身份上的相似。
theological_decisions:
- issue: “这就是那时候”所指的时间性质
  choice: 保留未说明的特指“那时候”
  alternative: 译为“这就是末后的时候”或“这就是审判的时候”
  rationale: 现有证据没有充分支持把该时间明确限定为末世或审判，因此不作神学性补足。
- issue: “与他们相似”的相似方面
  choice: 不加解释
  alternative: 明确为“与他们同样有罪”或“遭遇同样命运”
  rationale: 原句的比较关系本身具有歧义，应保留其神学和叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同他们在一起、与他们相似”保留原句并列关系；冒号使告知内容清楚。所给叙利亚语材料是跨页的章节桶，且存在残缺、错序及重叠，无法从中可靠划定21:38的完整原文边界，因此本稿以可辨认的时间词及经审校英文咨询层为辅助，避免虚构更精确的逐词对应。
