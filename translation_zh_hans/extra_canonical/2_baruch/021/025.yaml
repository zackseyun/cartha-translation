  text: If what is reserved for the world were not in them, they would be comforted by their hope.
translation:
  language: zh_hans
  text: 如果那为世界所存留的[a]不在他们里面[b]，他们就会因自己的盼望而得安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那为世界所积存的”。
    reason: “所存留的”对应的表达也可着重于已经存放、积存起来。
  - marker: b
    text: 或译：“如果他们里面没有那为世界所存留的”。
    reason: 原条件句可按存在句结构表达；两种译法意义相近，但语序和强调略有不同。
lexical_decisions:
- source_word: ܥܬܝܕ / ܕܥܬܝܕ
  choice: 存留的
  rationale: 该词在此语境中指留待将来之物；译作“存留的”既自然，也保留其尚未实现、为将来保留的意味。
- source_word: ܥܠܡܐ
  choice: 世界
  rationale: 采用其通常义“世界”，不把它具体解释为“来世”或某一时代，以免消除原文可能保留的末世性张力。
- source_word: ܒܘܝܐ / ܡܬܒܝܐ
  choice: 得安慰
  rationale: 表达从盼望而来的安慰，符合上下文哀伤与慰藉的对照。
- source_word: ܣܒܪܐ
  choice: 盼望
  rationale: 在祷告及末世语境中，“盼望”比“期望”更庄重自然，同时不额外限定盼望的具体内容。
theological_decisions:
- issue: “为世界存留的”具体指什么
  choice: 保持为未明确说明的事物
  alternative: 明确译成“为来世存留的福分”或“将来的赏赐”
  rationale: 现有叙利亚文证据和英语审校层均未明确其所指；不应擅自补入福分、赏赐或来世等解释。
- issue: 条件句中“他们”与所存留之物的关系
  choice: 直译为“不在他们里面”
  alternative: 释义为“他们若没有分于……”或“他们心中若没有……”
  rationale: 原句关系含混；保留空间性表达，避免把它解释成内心经验或参与某种福分。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“因自己的盼望而得安慰”保留因果关系；代词“他们”及“为世界存留的”均不擅自补明所指。
