  - marker: a
    text: “承受”也可译为“承担”或“负担”。
    reason: 叙利亚文动词可指承担、承受；在此与“祈求”搭配，保留其未完全具体化的动作色彩。
  - marker: b
    text: 直译可作：“在你面前的那些人、已经过去的那些人和将要来的那些人。”
    reason: ܕܩܕ̈ܡܝܟ字面可理解为“在你面前的”；正文按上下文将首项译作“现存者”，并保留这一可能的空间／关系性表达。
  revision_rationale: 依据叙利亚文优先校订：恢复原文明确出现的“祈求”，并将三项时间性短语作为“祈求”的相关者。采用“承受”而非“托住”，避免将本节改写为上帝维系万有的断言。删去原脚注a中把主要句意仅列为异译的处理；以两则脚注保留动词及“在你面前”短语的合理歧义。
