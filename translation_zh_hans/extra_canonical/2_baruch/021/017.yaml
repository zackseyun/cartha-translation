  text: Look, for you alone are able to sustain all who are, those who have passed, and those who are to come,
translation:
  language: zh_hans
  text: 看哪，因为惟有你能承受现存者、已逝者和将来者的祈求，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܘܪ
  choice: 看哪
  rationale: 该词可作“看、垂顾”；正文依句法将其处理为引起注意的呼语“看哪”，同时以脚注保留与后文“祈求”相连的可能。
- source_word: ܬܣܒܪ
  choice: 托住
  rationale: 此处表达承担、支撑之意；“托住”既保留具体动词色彩，也自然表达上帝维系万有。
- source_word: ܐܝܠܝܢ ܕܩܕܡ̈ܝܟ
  choice: 一切现存的
  rationale: 依英语审校层及上下文，理解为在上帝面前现存者；叙利亚文也可能与“祈求”构成属格关系，故在脚注保留异读。
- source_word: ܘܠܐܝܠܝܢ
  choice: 已经过去的和将要来的
  rationale: 按并列结构表达跨越过去、现在与将来的整体范围，不额外限定为人或时代，以保留原文张力。
theological_decisions:
- issue: “托住”所指是维系众存在者，还是承受其祈求
  choice: 正文采用“托住一切现存的、已经过去的和将要来的”
  alternative: “垂顾在你面前之人的祈求”或把后续并列项理解为祈求者
  rationale: 正文顺应审校后的并列句法和上帝承托万有的语境，但借脚注保留叙利亚文断句及支配关系的不确定性，避免把神学含义单一化。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“惟有你”保留祷告语体的强调；“现存的、已经过去的和将要来的”维持三项并列及其时间张力。句末逗号反映本节在篇章中尚未完句。
