  text: And let no one who reigns and has become king boast and grow proud through the pride of man.”
translation:
  language: zh_hans
  text: 凡掌权并已经作王的，都不可夸口，也不可因人的骄傲而自高。[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可让任何掌权、已经作王的夸口。”
    reason: 以汉语自然语序保留禁令主语及“掌权／已经作王”两个修饰成分的另一种组合方式。
  - marker: b
    text: 或译：“凡掌权的，都不可夸口；那已经作王的也是如此。”
    reason: 较中性地反映“已经作王”可后置、与前一修饰语关系不完全明确的句法可能，而不把它定为唯一的同位解释。
lexical_decisions:
- source_word: ܡܠܟ / ܡܠܟܘ (reconstructed from the consultation reading)
  choice: 掌权／作王
  rationale: 分别表达统治与成为君王的意思；用现代汉语中自然而庄重的措辞，不把两者强行合并。
- source_word: ܫܒܗ / boast (consultation reading)
  choice: 夸口
  rationale: “夸口”准确表达以自身地位为荣而自夸，并符合经文体裁。
- source_word: pride of man (consultation reading)
  choice: 人的骄傲
  rationale: 保留属人之骄傲这一较宽泛的表达，不具体解释为权势、血统或成就。
- source_word: grow proud (consultation reading)
  choice: 自高
  rationale: “自高”简洁庄重，表达因骄傲而抬高自己的状态与行为。
theological_decisions:
- issue: 禁令所指对象的句法范围
  choice: 理解为同一类人：掌权并已经作王的人
  alternative: 可按较生硬的句法理解为“任何掌权之物”或把“已经作王”后置
  rationale: 正文采用最自然且与上下文人物指称相符的读法，同时以脚注保留原句可能存在的句法歧义。
- issue: “人的骄傲”的性质
  choice: 直译为“人的骄傲”
  alternative: 解释为“世俗的骄傲”或“凭人的身份而骄傲”
  rationale: 原表达具有神学张力和一定开放性，不宜在译文中替读者限定其具体含义。
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。“掌权”“作王”“夸口”“自高”彼此平行，避免欧化长句；句末引号依照所给段落显示本节结束一段引语。
