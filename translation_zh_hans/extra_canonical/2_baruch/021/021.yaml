  text: For if this life alone were given to human beings, nothing would be more bitter than this.
translation:
  language: zh_hans
  text: 因为，若赐给世人的只有今生，就没有什么比这更苦了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܐ / “life”
  choice: 今生
  rationale: 上下文所指并非抽象的生命，而是人现今所度的这一生；译作“今生”自然地表达其与来世相对的含义。
- source_word: ܒ̈ܢܝ ܐܢܫܐ / “sons of men”
  choice: 世人
  rationale: 这是指全人类的常用闪语表达；“世人”简洁、庄重，也避免生硬直译为“人的儿子们”。
- source_word: “bitter”
  choice: 苦
  rationale: 保留原文以苦味喻痛苦、悲惨的表达，不将其具体化为“悲惨”或“痛苦不堪”。
theological_decisions:
- issue: “只有今生”的条件句是否暗示来世
  choice: 保留假设语气：“如果赐给世人的只有今生”
  alternative: “如果世人只有今生”
  rationale: “赐给”保留生命由上帝授予的语义背景，而条件句本身维持原文的神学张力，不在正文中额外解释来世。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”承接前文论证；以“就没有什么比这更苦了”保留比较结构和感叹力度。
