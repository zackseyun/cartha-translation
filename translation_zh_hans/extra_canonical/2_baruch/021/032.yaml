lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܥܬܝ̈ܕܢ
  choice: 将来的事
  rationale: 该表达指尚未来到、将要发生的事；译为“将来的事”自然明白，并保留时间上的对照。
- source_word: ܚܙ̣ܝܬ / ܚܙܝ
  choice: 看见
  rationale: 沿用视觉动词的基本意义，避免解释为较强的“预知”或“领悟”。
- source_word: ܐܝܠܝܢ ܕܥܒ̣ܕ
  choice: 现在的事
  rationale: 源页文字及分节定位存在不确定性；依据所给审校层呈现“现有之事”与“将来之事”的对举，采用现代汉语中简洁自然的“现在的事”。
theological_decisions:
- issue: 是否把“看见”解释为预言性的认识
  choice: 保留“看见”
  alternative: 知道／预知
  rationale: 原文使用视觉语汇；直译可保留其修辞与可能的启示语境，不额外界定认识方式。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语，以“现在的事／将来的事”形成清楚对举。鉴于所附叙利亚文是整章页桶且第32节定位并不明确，本稿审慎参照原文可辨识的“将来的事”与“看见”等词，并以已审校英文层控制句义。
