  text: For if the things that have been are not remembered, the things that stand before you are yours, and the things that are to come are remembered in their times.
translation:
  language: zh_hans
  text: 因为若已经发生的事不被记念，摆在你面前的事就是你的；而将要发生的事，也在各自的时日被记念。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的句法也可理解为：“摆在你面前的事就是你的，是在各自的时日被记念的。”但正文依上下文保留过去、当前和未来三项的对照。
    reason: 叙利亚文末句的修饰关系和标点存在句法歧义。
lexical_decisions:
- source_word: ܕܩܕ̈ܡܝܟ
  choice: 摆在你面前的事
  rationale: 保留第二人称单数“你”和“在……面前”的空间意象，不误译为“彼此相近”。
- source_word: ܕܝܠܟ
  choice: 就是你的
  rationale: 直译所属关系，避免擅自解释这些事如何或为何属于受话者。
- source_word: ܡܕܟ̣ܪܐ / ܕܘܟܪܢܐ
  choice: 被记念
  rationale: 以被动表达保留原文有关记念的措辞及施事者未明的特点。
- source_word: ܒܙܒܢܘܬܐ
  choice: 按各自的时日
  rationale: 表达复数时间观念，指各事在相应的时刻受到记念。
theological_decisions:
- issue: 过去、当前与未来三类事物的对照
  choice: 完整保留三个分句及其并列关系
  alternative: 把后两句合并为“摆在你面前的事，是在各自的时日被记念的”
  rationale: 篇章校勘证据支持过去、当前、未来三个独立成分；不把有关神之知识与记念的张力化约为单一命题。
- issue: “就是你的”的含义
  choice: 保留所有权式表述，不加解释
  alternative: 意译为“都由你掌管”或“都为你所知”
  rationale: 原文的所属表达可以蕴含掌管或知晓，但并未明确限定，故不代替原文作神学解释。
translation_notes:
  register: 采用庄重而自然的现代书面汉语。“摆在你面前”保留原文意象；“按各自的时日”避免生硬直译，同时不消解时间层面的含混。
