  text: For in his kingdom the death of the sons of men is seen. And what truly exists whose end is not known?
translation:
  language: zh_hans
  text: 因为在他的国度中，人们看得见世人的死亡。又有什么是真实存在而其结局不为人知呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܗ
  choice: 他的国度
  rationale: 保留叙利亚文“国度/王权”及第三人称所属关系，不擅自明确所指。
- source_word: ܡܘܬܐ
  choice: 死亡
  rationale: 采用直接、庄重的对应词，保留原句对人类必死性的陈述。
- source_word: ܒ̈ܢܝ ܐܢܫܐ
  choice: 世人
  rationale: 自然表达“人的众子/人类”，符合现代汉语经文语体。
- source_word: ܐܝܬ
  choice: 真实存在
  rationale: 结合句中的存在性追问，保留其哲理意味；“真实”亦呼应英译审校层所呈现的强调。
- source_word: ܚܪܬܗ
  choice: 其结局
  rationale: 用“结局”表达事物的终局或末后，不将其限定为死亡或审判。
- source_word: ܠܐ ܡܬܝܕܥ
  choice: 无人知晓
  rationale: 以自然汉语表达被动的“不得而知/不被知道”，不额外指定认知主体。
theological_decisions:
- issue: “他的国度”所指
  choice: 保留第三人称“他的”
  alternative: 译作“上帝的国度”
  rationale: 本节截取文本未明确重述先行词；直译可避免把可能的指代解释写入正文。
- issue: 末句的存在论式反问
  choice: 保留为开放反问
  alternative: 改写成“凡存在的，其结局都为人所知”
  rationale: 反问形式保留原文的修辞力度以及关于存在与终局之间的张力，不将其化为明确的教义命题。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“显而易见”传达“被看见”的公开可见性；末句保留哲理性的反问。
