revisions:
- from: 因为在他的国度中，世人的死亡显而易见。又有什么是真实存在的，其结局却无人知晓呢？[a]
  to: 因为在他的国度中，人们看得见世人的死亡。又有什么是真实存在而其结局不为人知呢？
  rationale: 将“显而易见”改为“人们看得见”，忠实保留原文的“被看见”而不强化其含义；末句维持开放的哲理性反问。删除没有实质翻译价值的脚注，避免制造虚假的歧义。
