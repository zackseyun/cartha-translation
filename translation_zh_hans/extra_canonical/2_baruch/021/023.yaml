  - severity: low
    issue: 现有脚注的替译未呈现实质性句法差异
    rationale: 脚注中的“又有什么确实存在，而它的结局却不为人知呢”与正文意思相同，且“而”反而较易被读成转折；中文正文无需保留英文审校过程中的两种英文断句。
  revised_text: 因为在他的国度中，人们看得见世人的死亡。又有什么是真实存在而其结局不为人知呢？
