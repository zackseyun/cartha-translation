  yaml_path: translation/extra_canonical/2_baruch/021/020.yaml
  text: And I saw that, because of one man, those who live came to be, and also the dwelling place of those who are to come.
translation:
  language: zh_hans
  text: 我看见，因着一个人，活着的人得以存在，那些将要来之人的居所也得以存在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “one man”（所给叙利亚文页在本节对应处残缺）
  choice: 一个人
  rationale: 不直接解释为亚当，保留原句人物指称的含蓄性。
- source_word: “those who live / came to be”（据审校咨询层）
  choice: 活着的人得以存在
  rationale: 既表达其产生或存在，也避免译成较抽象的“众生”。
- source_word: “dwelling place”（据审校咨询层）
  choice: 居所
  rationale: 现代汉语自然庄重，可指居住之处而不额外限定其性质。
- source_word: “those who are to come”（据审校咨询层）
  choice: 那些将要来之人
  rationale: 保留“将要来”的时间指向，不擅自具体化为后代、未来世代或末世群体。
theological_decisions:
- issue: “一个人”的身份
  choice: 保留为“一个人”
  alternative: 亚当
  rationale: 上下文或传统可能使人联想到亚当，但本句没有必要在译文中明说其名。
- issue: 两个分句是否共享“得以存在”
  choice: 第二分句补出“也得以存在”
  alternative: “以及那些将要来之人的居所”
  rationale: 汉语补出谓语可清楚呈现并列关系，同时不改变英语审校层所反映的存在意义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。鉴于所给叙利亚文页面在本节对应位置有明显残损和乱码，译文谨慎参照可辨识的章节语境及经审校的英语咨询层，不对“一个人”或“居所”作超出文本的神学解释。
