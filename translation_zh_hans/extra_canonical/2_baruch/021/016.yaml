translation:
  language: zh_hans
  text: 惟有你毫不动摇地知晓各时代的安排[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各时代的训示”或“各时代的教导”。
    reason: “安排”依上下文和英文POB审校轨迹表达时代的秩序；叙利亚文ܝܘܠܦܢܐ亦常指训示、教导，故以脚注保留这一词义可能。
lexical_decisions:
- source_word: ܝܘܠܦܢܘܗܝ ܕܙܒ̈ܢܐ
  choice: 各时代的安排
  rationale: ܝܘܠܦܢܐ 通常可指“教导、训示”，但在此启示文学语境中与“各时代”连用，所指更可能是各时代受命而有的秩序或安排；译作“安排”较自然，同时以脚注保留其“训示/规律”义。
- source_word: ܐܢܬ ܒܠܚܘܕܝܟ ܝܕܥܬ
  choice: 惟有你知道
  rationale: 保留强调性的“你独自/只有你”及“知道”；虽叙利亚文采用完成式，祷告语境中汉语用现在时更自然，也能表达上帝独有的恒常知识。
- source_word: ܟܕ ܠܐ ܢܬܬܙܝܥ
  choice: 毫不动摇
  rationale: 按字面保留“未被摇动/不动摇”的意象，不把它解释成某种特定教义概念。
theological_decisions:
- issue: 谁不动摇
  choice: 将“毫不动摇”保留为紧接全句的状语，自然指向受称呼的“你”
  alternative: 理解为各时代的安排坚定不移
  rationale: 叙利亚文的第二人称语境较支持修饰“你”，但短语位置容许一定语义张力，因此不增添“你的计划”等解释性主语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；“惟有你”保持祷告中的强调语气，“各时代”保留启示文学的时间秩序观。
