  yaml_path: translation/extra_canonical/2_baruch/021/019.yaml
  text: Therefore, the one who lives is not gladdened in his life. And I considered the sons of men, and I saw that they were not many and were nothing but the vanity of Adam.
translation:
  language: zh_hans
  text: 因此，活着的人在一生中并不喜乐。[a]我思想世人，看见他们并不多，不过是亚当的虚空。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“活着的人在生命尚存时并不喜乐。”
    reason: 介词短语既可理解为“在其一生中”，也可突出“生命持续之时”的时间含义。
lexical_decisions:
- source_word: ܒܢ̈ܝ ܐܢܫܐ
  choice: 世人
  rationale: 字面为“人的众子”，现代汉语以“世人”自然表达全体人类，且保留其群体意义。
- source_word: ܒܚܝܘܗܝ
  choice: 一生之中
  rationale: 介词结构可表示“在他的生命中”；译作“一生之中”自然明确，同时不把它解释成“以自己的生命为乐”。
- source_word: ܣܪܝܩܘܬܗ ܕܐܕܡ
  choice: 亚当的虚空
  rationale: “虚空”保留该词关于空虚、短暂和徒然的语义幅度，也保留“亚当”作为人类始祖及人类代表的张力。
theological_decisions:
- issue: “亚当的虚空”所指为何
  choice: 保留属格结构“亚当的虚空”
  alternative: 释作“人类因亚当而有的虚妄”或“亚当后裔的虚空”
  rationale: 原文的属格关系可有多重理解，不宜在正文中断定它特指原罪、死亡或某一教义体系。
- issue: 活着之人的喜乐状态
  choice: 译为“一生之中并不喜乐”
  alternative: 译为“不以自己的生命为乐”
  rationale: 前者贴近介词短语并保留状态性的陈述，避免擅自指定喜乐的对象。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不过是”自然传达“并非别的，只是……”这一排他性惯用表达；不采用“另一些人”之类会误分主语的译法。
