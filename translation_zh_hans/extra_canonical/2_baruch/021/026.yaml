  text: But because he was created from the earth and from dust, whatever passes away departs from it to its own place.
translation:
  language: zh_hans
  text: 但因为他是从地和尘土受造的，凡逝去的[a]都离开它，归到自己的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡经过的事物”。
    reason: 相应表达既可按逝去、消逝理解，也可较字面地理解为经过；正文依受造、死亡与归回的语境采用“逝去”。
lexical_decisions:
- source_word: ܐܪܥܐ / ܥܦܪܐ（据校审所据读法）
  choice: 地和尘土
  rationale: 保留两个并列的来源语，不把“地”误作动词“受造”的主语；阳性动词所指为上文的人。
- source_word: ܐܬܒܪܝ（据校审所据读法）
  choice: 受造
  rationale: 用庄重而通行的现代汉语表达被动的创造动作。
- source_word: whatever passes away（英译审校层所反映的叙利亚语）
  choice: 凡消逝的
  rationale: 上下文涉及人出于尘土并归回，译作“消逝”可表达生命的短暂与死亡，同时以脚注保留“经过”的字面可能。
- source_word: to its own place
  choice: 归到自己的地方
  rationale: 保留“自己的地方”这一未被进一步界定的表达，不把它神学化为坟墓、阴间或尘土。
theological_decisions:
- issue: 受造者的指代
  choice: 译为“他”，指上文所说的人
  alternative: 把“地”理解为受造的主语
  rationale: 校审指出叙利亚语“地”为阴性，而“受造”动词形式为阳性，因此不能以“地”为其主语；此处也与人由地和尘土受造的语境相符。
- issue: “自己的地方”的含义
  choice: 不作具体解释
  alternative: 明确译成“坟墓”“阴间”或“尘土”
  rationale: 原表达保留了指向上的开放性，译文不应擅自消解其神学张力。
- issue: 代词“它”的所指
  choice: 保留代词，不明确限定为“地”或“尘土”
  alternative: 直接译为“离开大地”或“离开尘土”
  rationale: 咨询英译中的代词所指并不完全明确，保留代词可避免过度释义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“受造”“归到自己的地方”保留经文语体；“从它那里离去”刻意保留原句代词的含混，不擅自指定其先行词。
