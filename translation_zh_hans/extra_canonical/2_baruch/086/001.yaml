base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/086/001.yaml
  text: So then, when you receive the letter, read it in your assemblies with care. And consider its words more carefully on the days of the weeks, so that you may remember and be set right.
translation:
  language: zh_hans
  text: 所以，你们收到这封信后，要在你们的聚会中用心宣读；在每周的日子里[a]，要更加仔细地留意信中的话，好让你们记在心上，得以归正。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在各周的日子里”；具体所指的日子并不明确。
    reason: 原文时间短语ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ的具体含义不稳定，脚注保留其含混性，避免擅自解释为平日、禁食日或特定礼仪日期。
lexical_decisions:
- source_word: ܒܒܛܝܠܘܬܐ
  choice: 用心
  rationale: 该词可表示安静、从容或审慎专注；在会众宣读的语境中，“用心”自然表达认真而不草率的态度，又不过分强化为辛勤用功。
- source_word: ܬܬܗܪܘܢ
  choice: 留意
  rationale: 该动词表示仔细关注、留心或重视；与程度副词ܝܬܝܪܐܝܬ搭配译作“更要留意”，保留劝勉语气。
- source_word: ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ
  choice: 在每周的日子里
  rationale: 原文直陈“日子”与“周”的关系，但具体指哪些日子并不清楚；正文保持接近原文的表达，不擅自解释为平日、禁食日或特定礼仪日期。
- source_word: ܬܬܥܗܕܘܢ
  choice: 记在心上
  rationale: 该词基本义为记得、记起；“记在心上”在现代汉语中兼有记住并认真看待之意，适合此处劝勉语境。
- source_word: ܬܬܪܨܘܢ
  choice: 得以归正
  rationale: 该动词含被弄直、被纠正或走上正路之意；“归正”保留道德修正的力度，同时避免把它窄化为仅仅接受训诫。
- source_word: ܒܟܢܘܫܬܟܘܢ
  choice: 在你们的聚会中
  rationale: 原文为单数集合性表达，所指是群体聚集或会众场合；译作“聚会”自然体现公开宣读的场景。
theological_decisions:
- issue: 是否将不明确的时间短语解释为特定宗教日子
  choice: 保留为“在每周的日子里”
  alternative: 译作“在平日”“在禁食的日子”或其他特定礼仪日期
  rationale: 叙利亚文本身未明确指出禁食或礼仪实践；保留较直译且略显含混的措辞，避免引入后来的宗派或礼仪解释。
- issue: 末句修正性动词的力度
  choice: “得以归正”
  alternative: “受到纠正”或“得到教导”
  rationale: 原词兼有被弄直和纠正之意。“归正”保留其道德转向的张力，但不把此句扩展成特定的救恩论陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以“宣读、留意、归正”维持书信劝勉的正式语气；句式清晰，适合普通读者及公开诵读。
