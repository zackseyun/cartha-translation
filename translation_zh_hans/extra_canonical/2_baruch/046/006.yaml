translation:
  language: zh_hans
  text: 因为你们若实行这些事，希望就必临到你们——也就是先前向你们所说的那些事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܥܒܪܘܢ ܗܠܝܢ
  choice: 实行这些事
  rationale: 动词字面可表示“经过、越过”，在此语境中与所领受的教导相连，功能上指遵行或实行上述之事；译作“实行”较符合现代汉语，又不额外限定具体内容。
- source_word: ܢܬܬܢܝܚ ܠܟܘܢ ܣܒܪܐ
  choice: 希望就必临到你们
  rationale: 该表达含“得安歇、安顿”的意象，介词结构可理解为“向你们／为你们”。中文若直译“希望安歇给你们”不自然，因此以“临到你们”表达希望落在他们身上并成为其所有。
- source_word: ܗܠܝܢ ܕܩܕܡܘ ܐܡܪܘ ܠܟܘܢ
  choice: 先前向你们所说的那些事
  rationale: 保留原文对“希望”内容的复数指称和回顾性表达，不把它具体解释为某一项预言或应许。
theological_decisions:
- issue: “希望”与先前所说之事的关系
  choice: 用破折号及“也就是”表达后半句对“希望”的说明
  alternative: 将后半句理解为独立的主语或另起一句
  rationale: 叙利亚文结构简略，后半句最自然地说明这希望所包含的、先前已宣告之事；译文保留其概括性，不将内容教义化。
- issue: 条件句是否暗示凭行为换取希望
  choice: 保留“若实行……希望就必……”的原有条件关系
  alternative: 弱化为单纯劝勉，或解释为功德交换
  rationale: 原文明确具有条件结构；翻译既不应消除这种张力，也不应额外构建功德论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“希望”沿用原文抽象名词；破折号帮助普通读者识别后置说明，同时保留原句的凝练结构。
