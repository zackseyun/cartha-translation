  text: 'And my son and the elders of the people answered and said to me,


    "Has the Mighty One humbled us so greatly as to take you from us so suddenly?'
translation:
  language: zh_hans
  text: 我儿子和百姓的长老回答我说：“大能者竟使我们受这样的屈辱，以致如此突然地把你从我们身边带走吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 保留该称号的名词性质及其对上帝能力的强调，不直接换成普通的“上帝”。
- source_word: ܡܟܟܢ
  choice: 使我们如此卑微
  rationale: 按使役意义表达“使……降卑”，既可涵盖受压低、遭屈辱的处境，也不把语义缩窄为单纯情绪上的羞辱。
- source_word: ܕܢܣܒܟ
  choice: 把你从我们中间带走
  rationale: ܢܣܒ 的基本意义是“取、带走”；结合离别语境译为“带走”，不预先断定具体方式。
theological_decisions:
- issue: “大能者”的指称
  choice: 保留称号“大能者”
  alternative: 译作“上帝”或“全能者”
  rationale: 原文使用的是强调能力的称号，而非普通神名；“大能者”既忠实又避免与另一特定称号“全能者”完全等同。
- issue: 被“带走”的性质
  choice: 仅译为“带走”
  alternative: 译作“接升”或“使你离世”
  rationale: 本节措辞本身没有明确说明升天或死亡，因此保留叙事中的开放性。
translation_notes:
  register: 采用现代、庄重而自然的叙述语体；以“竟……要……”呈现问句中的惊愕和哀痛，不额外补入原文未明说的教义解释。
