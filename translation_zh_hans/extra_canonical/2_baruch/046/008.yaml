  language: zh_hans
  text: 不过，关于我将被接去的事，我没有告诉他们，也没有告诉他们的儿子们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܬܐ
  choice: 事
  rationale: 此处指所要传达的消息或事项；译作“事”比重复使用“话”更符合现代汉语。
- source_word: ܕܡܬܬܣܝܡ ܐܢܐ
  choice: 我将被接去
  rationale: 该被动表达指巴录将被移走或被接离；“被接去”保留行动者未明及去向未明的含混性，也不擅自解释为死亡或升天。
- source_word: ܠܐ … ܐܘܕܥܬ
  choice: 我没有告诉
  rationale: 按上下文理解为没有使人知道；用自然的现代汉语表达其使役含义。
theological_decisions:
- issue: “被接去”是否明确指死亡或升天
  choice: 保留“被接去”
  alternative: 译作“离世”或“升天”
  rationale: 原文只说明巴录将被移走，并未在本节明确界定其方式；不应消除这一末世论叙事中的含混性。
- issue: 末句亲属对象的读法
  choice: 正文采用“我的儿子”
  alternative: “他们的儿子们”
  rationale: 英语审校层及通行的本节理解支持单数第一人称“我的儿子”；但所提供的叙利亚文页面转录表面读作复数第三人称，因此以脚注公开异文证据。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；以“不过”承接前文转折，以“被接去”保留原文被动式及事件性质未明的张力。
