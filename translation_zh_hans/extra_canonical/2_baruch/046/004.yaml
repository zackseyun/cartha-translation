base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/046/004.yaml
  text: 'And I said to them,

    "I cannot stand against the will of the Mighty One.

    Yet Israel will not lack a wise man,

    nor the seed of Jacob a son of the law.'
translation:
  language: zh_hans
  text: '我对他们说：


    “我无法与大能者抗衡。


    然而，以色列必不缺少智慧人，


    雅各的后裔中也必不缺少律法之子。[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法之子”直译自叙利亚文；指与律法相属的人，但原文未明确其具体是研习、教导还是遵行律法的人。
    reason: 该闪族式表达在现代汉语中不常见；脚注说明其大致语义范围，同时不把原文未限定的身份具体化。
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 这是叙利亚文《巴录二书》中对上帝的称号，直译为“有能力者／大能者”；采用“大能者”既保留称号性质，也符合现代汉语宗教文体。
- source_word: ܠܐ ܡܫܟܚ ܐܢܐ ܕܐܩܘܡ
  choice: 我无法抗拒
  rationale: 字面含义近于“我不能站立／起来对抗”；结合前面的ܕܠܘܩܒܠܐ（在……对面、反对），译为“无法抗拒”较自然，同时保留不能与之相争的意思。
- source_word: ܚܟܝܡܐ
  choice: 智慧人
  rationale: 对应“智慧者／有智慧的人”，采用简洁而庄重的“智慧人”。
- source_word: ܒܪ ܢܡܘܣܐ
  choice: 律法之子
  rationale: 逐字为“律法之子”，可能指忠于、研习或遵行律法的人；正文保留原文形象，不把其具体含义单一化。
- source_word: ܓܢܣܗ ܕܝܥܩܘܒ
  choice: 雅各的后裔
  rationale: ܓܢܣܐ可指种族、族类或后裔；此处与以色列平行，“雅各的后裔”最符合汉语表达。
theological_decisions:
- issue: 大能者之意志与人的行动
  choice: 我无法抗拒大能者的旨意
  alternative: 我无法站立在大能者对面
  rationale: “旨意”由属格结构和语境所表达的对抗对象推知，英文审校层亦如此理解；译文没有进一步说明这是命定、命令还是许可，以保留原文张力。
- issue: “律法之子”的身份
  choice: 正文保留“律法之子”
  alternative: 遵守律法的人／律法教师
  rationale: 原文并未明确限定为教师或一般遵守者，故不作教派性或角色性的具体化。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；以分行形式呈现原文的平行结构。“必不缺少”表达叙利亚文否定将来意义，并凸显“以色列／雅各的后裔”与“智慧人／律法之子”的对应。
