    rationale: 英文审校轨迹作了“the will of the Mighty One”的解释性表达，但现存叙利亚文的句法直接以“大能者”为“站立／对抗”的对象。按原文优先原则，应避免把解释写死在正文。
  - severity: low
    issue: 末行的地点／归属关系可更明确。
    rationale: ܠܓܢܣܗ ܕܝܥܩܘܒ 表示“对于／在雅各的后裔（族类）中”。加入“中”使汉语关系明确，意义不变。
