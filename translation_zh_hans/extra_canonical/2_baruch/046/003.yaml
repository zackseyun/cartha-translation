translation:
  language: zh_hans
  text: 我们还能到哪里去寻求律法呢？又有谁能引导我们离开死亡之家，进入生命呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: 律法
  rationale: 该词在犹太经文语境中指神所赐的律法；“律法”既准确又符合现代中文圣经文体。
- source_word: ܡܕܪܟܢ
  choice: 引导我们
  rationale: 源词表达带领、指引之意；译作“引导我们”自然且保留其主动带领的含义。
- source_word: ܒܝܬ ܡܘܬܐ
  choice: 死亡之家
  rationale: 按叙利亚文保留“家”这一具体意象，不将其弱化为单纯的“死亡”。
- source_word: ܠܚܝ̈ܐ
  choice: 进入生命
  rationale: 与“离开死亡之家”构成方向性的对照；中文补出“进入”，清楚表达源文介词所指的趋向。
theological_decisions:
- issue: 从死亡到生命的表达是否解释为特定救赎教义
  choice: 保留“离开死亡之家，进入生命”的意象
  alternative: 意译为“使我们得救”或“使我们复活”
  rationale: 原文以死亡与生命的空间性对照发问，并未在本句中明确限定为复活、得救或其他特定教义，因此不作额外解释。
- issue: “律法”的所指
  choice: 直译为“律法”
  alternative: 解释为“摩西律法”或“上帝的教导”
  rationale: 原文仅用“律法”一词；不擅自缩窄或扩展其范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个反问句保留原文失去属灵领袖后的忧惧；“死亡之家”保留源文鲜明意象。
