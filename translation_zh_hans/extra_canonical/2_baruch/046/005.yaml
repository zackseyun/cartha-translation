lexical_decisions:
- source_word: ܠܒܘ̈ܬܟܘܢ（底本扫描/OCR作 ܠܒܩ̈ܝܟܘܢ）
  choice: 自己的心
  rationale: 按上下文及英译校勘层，此处指人的内心、意志与领受能力；译作“心”既贴近闪语表达，也符合现代汉语习惯。
- source_word: ܕܬܫܡܥܘܢ
  choice: 好听从
  rationale: 该动词既可表示“听”，也常含“听从、顺服”之意；与“律法”搭配时译作“听从”更完整。
- source_word: ܢܡܘܣܐ
  choice: 律法
  rationale: 这是叙利亚语中表示法律、律法的常用词；本处涉及以色列的神圣律法，采用庄重且通行的“律法”。
- source_word: 原页末行受损，英译校勘层作 hold fast to understanding
  choice: 持守明悟
  rationale: “持守”保留坚定抓住、不放弃的意味；“明悟”比抽象的“理解”更适合作为应当持守的属灵与伦理辨识，同时不额外引入宗派解释。
theological_decisions:
- issue: “听”是否带有顺服律法的含义
  choice: 听从律法
  alternative: 聆听律法
  rationale: 闪语“听”在此语境通常兼具接受与遵行之意；“听从”保留这种伦理要求，而非仅指听见声音。
- issue: “理解/明悟”是否人格化或教义化
  choice: 持守明悟
  alternative: 坚守理解力
  rationale: 保持其为一般性的智慧与辨识，不将其解释为特定启示人物、圣灵恩赐或宗派教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文的劝勉语气，并以“好……”表达预备内心的目的。源页该处存在扫描/OCR损坏，因此以可辨认的叙利亚语、上下文及经审校的英文咨询层综合复原，未添加脚注标记。
