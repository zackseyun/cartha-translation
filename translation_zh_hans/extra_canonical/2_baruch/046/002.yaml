translation:
  language: zh_hans
  text: 我们确实将处在黑暗中；余下的百姓将没有光明。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܝܪܐܝܬ
  choice: 实在
  rationale: 保留副词的确证语气，表达说话者对将临处境的断定。
- source_word: ܒܚܫܘܟܐ
  choice: 陷于黑暗之中
  rationale: 源文介词结构直指身处黑暗的状态；用“陷于”使现代汉语自然，同时不把“黑暗”具体解释为某一种灾祸。
- source_word: ܢܘܗܪܐ
  choice: 光明
  rationale: 保留“光”与“黑暗”的鲜明对照，并维持其可能兼具现实与象征意义的开放性。
- source_word: ܥܡܐ ܕܐܫܬܚܪܘ
  choice: 余下的百姓
  rationale: ܐܫܬܚܪܘ 表示留下、剩下的人；译法不额外断定他们是“余民”这一带有较强神学色彩的群体称谓。
theological_decisions:
- issue: “黑暗”与“光明”的含义
  choice: 保留意象，不作解释性增译
  alternative: 明确译成灾难、盼望或神的同在
  rationale: 本句自身没有限定意象的唯一所指；直译可保存其现实、政治及神学层面的张力。
- issue: 留下之人的身份
  choice: 译作“余下的百姓”
  alternative: 译作“余民”
  rationale: “余民”容易预先赋予特定的蒙拣选或得救含义，而源文在此首先描述灾后仍留下的人。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，以分号保留两行诗性陈述之间的紧密并列与黑暗—光明对照。
