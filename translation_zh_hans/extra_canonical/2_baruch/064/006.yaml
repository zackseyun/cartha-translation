translation:
  language: zh_hans
  text: 玛拿西的不敬虔变得如此严重，竟使至高者的荣耀离开了圣所。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至高者的荣耀被移离了圣所。”
    reason: 记录将该动词理解为被动表达的另一种译法；正文则依叙利亚文使役式主动语法处理。
lexical_decisions:
- source_word: ܪܫܝܥܘܬܗ ܕܡܢܫܐ
  choice: 玛拿西的不敬虔
  rationale: 以“不敬虔”表达对上帝的悖逆与亵慢，比泛指道德败坏的“邪恶”更贴近本节的宗教语境，同时不额外限定具体罪行。
- source_word: ܐܝܩܪܗ ܕܡܪܝܡܐ
  choice: 至高者的荣耀
  rationale: 保留“至高者”这一神圣称号，并将“荣耀”按其神显和临在语境直译。
- source_word: ܡܢ ܡܩܕܫܐ
  choice: 离开了圣所
  rationale: “圣所”准确传达神圣空间；“离开”自然表达荣耀不再驻留其中，而不擅自具体化为圣殿建筑的某一部分。
theological_decisions:
- issue: 玛拿西的不敬虔与神圣荣耀离开之间的语法和因果关系
  choice: 竟使至高者的荣耀离开了圣所
  alternative: 至高者的荣耀被移离了圣所
  rationale: 叙利亚文动词为使役式主动形，阴性单数主语与“不敬虔”相应，因此正文保留恶行直接导致荣耀离开的强烈因果表达；脚注记录可见于传译传统中的被动理解，以免掩盖文本传承中的差异。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“竟使”既承接“不敬虔变得如此严重”的程度结构，也清楚呈现其后果；避免使用过度教派化或解释性的措辞。
