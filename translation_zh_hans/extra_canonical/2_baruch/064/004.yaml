  yaml_path: translation/extra_canonical/2_baruch/064/004.yaml
  text: Then wrath went out from before the Mighty One, that Zion should be uprooted—as it also happened in your days.
translation:
  language: zh_hans
  text: 于是，烈怒从大能者面前发出，要把锡安连根拔起——正如这事也在你们的日子里发生过。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܓܙܐ
  choice: 烈怒
  rationale: 表示强烈、施行审判的忿怒；“烈怒”既保留力度，也符合庄重的叙事语体。
- source_word: ܡܢ ܩܕܡ
  choice: 从……面前
  rationale: 按叙利亚语空间性表达直译，保留烈怒由大能者临在之处发出的意象。
- source_word: ܚܝܠܬܢܐ（底本文字疑有讹损）
  choice: 大能者
  rationale: 与本书对上帝的常用尊称及英语审校层的 Mighty One 相符，同时避免改译成带有宗派色彩的称号。
- source_word: ܬܬܥܩܪ（据语境辨读；页面转录疑有讹损）
  choice: 连根拔起
  rationale: 该动词的基本意象是拔除、根除；用于锡安时，“连根拔起”自然地保留其强烈形象。
- source_word: ܒܝܘ̈ܡܬܟܘܢ
  choice: 在你们的日子
  rationale: 保留原文直接对听众说话及其时代指向，不具体化为某一未经明说的历史事件。
theological_decisions:
- issue: 烈怒与大能者的关系
  choice: 保留“烈怒从大能者面前发出”
  alternative: 译作“大能者发怒了”
  rationale: 前者保存原文中烈怒仿佛从神面前出发的独立意象，不把它简化为普通心理状态。
- issue: 锡安被拔起的语气
  choice: 译作目的或结果取向的“要把锡安连根拔起”
  alternative: 译作“于是锡安被连根拔起”
  rationale: 源句连接形式可承载目的/结果色彩；现译保留英语审校层所反映的张力，并由后半句说明此事确已发生。
- issue: “你们的日子”的历史所指
  choice: 不作具体历史身份说明
  alternative: 明确解释为耶路撒冷毁灭或被掳时期
  rationale: 本节只以第二人称复数指向听众所处的时代；正文不加入原文未明说的历史辨认。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“于是”推进异象解释的叙事；破折号突出“正如……”的印证关系。因所给章节页转录明显混杂且局部讹损，译文以可辨认的叙利亚语词项、上下文和已审校英语层交叉控制，不在正文中暴露文本重建问题。
