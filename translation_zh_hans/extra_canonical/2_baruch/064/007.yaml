  text: Therefore at that time Manasseh was called the impious one, and in the end his dwelling was in the fire.
translation:
  language: zh_hans
  text: 因此，那时玛拿西被称为“不敬虔的人”；最终，他的住处是在火中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܫܐ（抄本页面识读作 ܡܢܫܪ）
  choice: 玛拿西
  rationale: 按本章历史人物及英语审校层所指，识别为犹大王玛拿西。
- source_word: ܪܫܝܥܐ
  choice: 不敬虔的人
  rationale: 该词可指邪恶、不虔或有罪的人；此处采用“不敬虔”以保留其宗教和道德意味，并避免仅译作一般性的“坏人”。
- source_word: ܒܢܘܪܐ
  choice: 在火中
  rationale: 直译地点表达，不把“火”进一步解释为某一特定的末世刑罚观念。
- source_word: ܥܘܡܪܗ
  choice: 他的住处
  rationale: 保留“居所、住处”的具体意象，而不释义为“结局”或“刑罚”。
theological_decisions:
- issue: “火”的性质
  choice: 保留为“火”，不加解释
  alternative: 译作“地狱之火”或“永火”
  rationale: 源文只表达其住处在火中；加入“地狱”或“永恒”会超出本节明说的内容。
- issue: 玛拿西的称号
  choice: 译作“不敬虔的人”
  alternative: 译作“恶人”
  rationale: “不敬虔”较能呈现该词在宗教伦理语境中的张力，同时不引入特定宗派术语。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体；引号标明这是玛拿西所得的称号。源页文字识读较不稳定，因此以叙利亚文可辨词形、章节语境及已审校英语咨询层综合校定。
