  text: And a decree also went out against the two and a half tribes, that they too should be led away captive, as you have now seen.
translation:
  language: zh_hans
  text: 又有一道判令颁布，针对那两个半支派，使他们也被掳走，正如你现在所看见的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܪܝܢ ܫܒ̈ܛܝܢ ܘܦܠܓܗ
  choice: 两个半支派
  rationale: 按闪语表达直译，指两个完整支派加上半个支派。
- source_word: ܕܝܕܐ（底本此处文本疑有讹乱）
  choice: 判令
  rationale: 结合现存叙事语境及校审层所保留的 decree 含义，译为庄重而自然的“判令”；避免把它过度具体化为某位人间君王的诏令。
- source_word: ܫܒ̈ܝܐ（相关俘掳语汇）
  choice: 被掳走
  rationale: 用被动式保留原文所强调的遭遇，同时符合中文圣经历史叙事的常用表达。
theological_decisions:
- issue: 判令的发出者是否明说
  choice: 采用无主句“有判令临到”
  alternative: 补出“上帝下令”或“亚述王下令”
  rationale: 本节所给叙利亚文材料有讹乱，且句中发令主体并不稳妥；不擅自补明可保留原文的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“临到”体现判令针对这些支派而来；“被掳走”清楚表达被带往异地为俘的结果。
