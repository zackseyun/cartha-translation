  yaml_path: translation/extra_canonical/2_baruch/064/008.yaml
  text: For although his prayer was heard by the Most High, yet at last, when he was cast into the bronze horse and the bronze horse melted, it became a sign for him for the moment.
translation:
  language: zh_hans
  text: 虽然他的祷告蒙至高者垂听，但最后，当他被投入铜马、铜马熔化时，这事一时成了他的一个征兆。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一时”也可译作“暂时”；较直译为“在那时辰”。
    reason: 说明叙利亚语时间短语的习语义及较直译形式，保留其可能的表达幅度。
lexical_decisions:
- source_word: ܒܥܘܬܗ
  choice: 他的祷告
  rationale: 该词指祈求、恳求；此处以“祷告”自然表达向至高者所作的祈求。
- source_word: ܡܪܝܡܐ
  choice: 至高者
  rationale: 保留犹太宗教语境中对上帝的尊称，不另行增补神学解释。
- source_word: ܒܐܝܕܝܬܐ
  choice: 铜马
  rationale: 结合句中铜制刑具及英语审校层所保存的上下文，译作“铜马”。
- source_word: ܠܫܥܬܐ
  choice: 只在当时
  rationale: 按叙利亚语时间习语理解为“暂时、在当时”，而非将其僵硬处理为“关于时辰”；“只”体现其效力受时间限制的语境。
- source_word: ܐܬܐ / ܐܬܘܬܐ
  choice: 征兆
  rationale: 按上下文表达具有指示意义的记号；“征兆”比一般的“记号”更符合此处叙事语气，同时不解释其具体神学含义。
theological_decisions:
- issue: 祷告蒙垂听与最终结局之间的张力
  choice: 保留“虽然……但最后……”的对照，不说明蒙垂听是否等同最终得救
  alternative: 将此句解释为祷告只带来暂时的肉身获救
  rationale: 原句呈现蒙垂听与后来事件之间的张力；译文不应替文本裁定其救恩论意义。
- issue: 铜马熔化所成之兆的时限
  choice: 译为“只在当时成了给他的一个征兆”
  alternative: 译为“成了他暂时获救的征兆”
  rationale: 后者明确加入“获救”，超出本句直接措辞；现译保留“征兆”所指的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“蒙至高者垂听”保持经文语体；后半句尽量顺畅，同时保留“征兆”的指向含混性。
