  yaml_path: translation/extra_canonical/2_baruch/064/009.yaml
  text: Not because he had lived blamelessly, for he was not worthy, but so that from then on he might know by whom he would finally be punished.
translation:
  language: zh_hans
  text: 并不是因为他一生无可指责——他本不配得——而是要让他从那时起知道，最终会是谁惩罚他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English consultation: “lived blamelessly”'
  choice: 一生无可指责
  rationale: 现有叙利亚文材料的章节定位与排版次序不够可靠，未能明确辨认本节对应原词；因此谨慎依据经审核的英文咨询层表达，并保留其道德层面的含义。
- source_word: 'English consultation: “was not worthy”'
  choice: 本不配得
  rationale: 用“不配得”表达资格或配受问题，不擅自补出他不配得到的具体对象。
- source_word: 'English consultation: “by whom”'
  choice: 会是谁
  rationale: 保留施罚者身份尚待认识的悬念，不将其明确解释为上帝或其他主体。
- source_word: 'English consultation: “finally be punished”'
  choice: 最终……惩罚他
  rationale: 保留末后的时间指向和被动受罚意义，同时采用自然的现代汉语主动句式。
theological_decisions:
- issue: 人物获知施罚者的原因
  choice: 明确否定这是因其一生无可指责或因其配得
  alternative: 将此理解为对人物义行的奖赏
  rationale: 原咨询文本以“不是……而是……”构成鲜明对照；译文保留这种神学张力，不把所得认识解释成个人功德。
- issue: 最终施罚者的身份
  choice: 保持未明说
  alternative: 直接译为“上帝最终会惩罚他”
  rationale: “by whom”本身保留身份指向，译文不越过现有证据补明主体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“本不配得”作为插入性说明，以破折号保留原句的论证节奏。所给叙利亚文页面包含跨章、错页或文字次序混乱的迹象，且无法从中稳妥锁定64:9，因此本稿以英文POB审核层作谨慎控制，避免虚构原文对应。
