  text: For he who is able to do good is also able to do evil.
translation:
  language: zh_hans
  text: 因为能行善的人，也能作恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: likely Syriac contrast underlying “do good / do evil”
  choice: 行善／作恶
  rationale: 采用现代汉语中自然、对称且具有伦理含义的表达，保留原句关于同一人两种可能行为的鲜明对照。
- source_word: likely ability construction underlying “is able”
  choice: 能
  rationale: 简洁表达能力或可能性，不把句意强化为意愿、必然性或许可。
theological_decisions:
- issue: 句中的行为者是否特指某一位人物
  choice: 译作泛指的“人”
  alternative: 译作特指的“他”或解释为上帝
  rationale: 现有英译将其表述为一般性的“he who”，而所给叙利亚文篇章材料因页面插值和文本混杂，无法可靠支持特指；因此不引入额外的神学身份认定。
- issue: “能行善”与“能作恶”的关系
  choice: 保留并列的能力陈述
  alternative: 解释为行善者必然也会作恶
  rationale: 原意只陈述两种能力并存，并未断言恶行必然发生。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；“行善／作恶”形成平衡结构。鉴于所提供的叙利亚文为章节页桶且定位不稳，本稿谨慎依据可审计的英译层，不增添无法由文本确认的细节。
