  text: And the ninth black waters that you saw—this is all the wickedness that was in the days of Manasseh son of Hezekiah.
translation:
  language: zh_hans
  text: 你所看见的第九道黑水——这[a]就是希西家的儿子玛拿西时代所有的邪恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些就是……”。
    reason: 保留英文审校记录中的替代性复数译法；正文仍按叙利亚文单数指示语及集合性名词采用“这就是”。
lexical_decisions:
- source_word: ܚܫ̈ܟܐ
  choice: 黑水
  rationale: 保留异象中明水与黑水交替出现的颜色意象，不泛化为一般的“幽暗”或“灾祸”。
- source_word: ܚܒܠܐ
  choice: 恶行
  rationale: 此处概括玛拿西时代的道德与宗教罪恶；“恶行”在现代汉语中自然明确，也与下文列举的罪行相衔接。
- source_word: ܟܠܗ
  choice: 一切
  rationale: 明确译出叙利亚文表示整体性的“全、所有”，避免遗漏原文强调。
- source_word: ܒܝܘܡ̈ܬܐ ܕܡܢܫܐ
  choice: 玛拿西时代
  rationale: 按闪语习惯，“在玛拿西的日子”指他所处并掌权的时期；译作“时代”自然，又不额外限定具体年数。
theological_decisions:
- issue: 指示语按单数还是复数理解
  choice: 这就是……一切恶行
  alternative: 这些就是……一切恶行
  rationale: 正文采用与叙利亚文单数指示形式及集合性谓语相合的表达，把第九股黑水作为一个整体象征；脚注保留按其复数内容理解的可能。
- issue: 是否把玛拿西时代的罪恶解释为其个人罪责
  choice: 保留“一切恶行”的时代性概括
  alternative: 玛拿西所犯的一切罪
  rationale: 原句所指范围是“玛拿西时代”的邪恶，不宜在本节中缩窄为仅由玛拿西本人实施的罪。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“第九股黑水”延续异象系列的计数方式；破折号突出由异象转入解释的结构。
