  source_fidelity: 译文完整保留英文审校层所列的罪行次序和范围。鉴于叙利亚语底本文字错乱，未对清单作超出审校层的重建；“圣所”“祭司”“祭献”等用语保持原有宗教语境。
  naturalness: “曲解公正”在现代汉语中搭配不够自然，且“公正”是原则，不是通常被“曲解”的对象；“颠倒公正”更符合庄重叙事及司法败坏的语境。“不敬虔的事”可理解，但改为“不敬虔的罪”更凝练自然。
  terminology: 保留“义人”“圣所”“祭司”等经文常用、但仍易懂的术语。将“祭物”改为“祭献”，更明确指被废除的献祭供物而非泛指物品；不改变其具体礼仪含义。
  issues:
  - severity: low
    issue: “曲解公正”搭配生硬。
    rationale: 司法或裁断语境中，“颠倒公正”是更自然、也更能表达“twisted judgment”的现代庄重说法。
  - severity: low
    issue: “不敬虔的事”略显冗赘。
    rationale: “不敬虔的罪”在本节恶行清单的语境中更紧凑，且不增添神学解释。
  - severity: low
    issue: “祭物”可能被理解为一般宗教物件。
    rationale: “祭献”更清楚地对应被废除的献祭或供物，同时保留原文的概括性。
