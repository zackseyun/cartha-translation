base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/002.yaml
  text: 'For he committed much impiety: he killed the righteous, twisted judgment, shed innocent blood, violated married women by force, overturned altars, abolished their offerings, and drove out the priests so that they could not minister in the sanctuary.'
translation:
  language: zh_hans
  text: 因为他犯下许多不敬虔的罪：杀害义人，颠倒公正，流无辜人的血，强暴有夫之妇，拆毁祭坛，废除祭献，又赶走祭司，使他们不能在圣所中供职。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪ̈ܫܝܥܐ / impiety-context wording
  choice: 不敬虔的事
  rationale: 本节所列行为是对上帝、圣所与人伦的多重冒犯；用“不敬虔的事”保留宗教伦理色彩，同时符合现代汉语。
- source_word: judgment / justice wording (source text here is textually garbled)
  choice: 公正
  rationale: 语境指司法或裁断被扭曲；“曲解公正”既保留行为的主动恶意，也不把含义限缩为某一次具体审判。
- source_word: ܕܡܐ ܐܫܕ
  choice: 流……的血
  rationale: 依照闪语常见表达直译为“流血”，并由语境补足“无辜人的”，保持庄重而自然。
- source_word: ܥܒܕ ܓܘܪܐ / sexual-violation wording
  choice: 强暴有夫之妇
  rationale: 表达对已婚妇女的强迫性侵犯，不以较弱的“玷污”淡化暴力性质。
- source_word: minister / priestly service wording
  choice: 供职
  rationale: 指祭司在圣所履行礼仪职责；“供职”简洁、庄重，也避免添加原文未明说的具体仪式。
theological_decisions:
- issue: 对恶行清单中宗教罪与社会罪的关系
  choice: 并列呈现杀人、司法败坏、性暴力和破坏圣所礼制
  alternative: 将全节概括为“犯罪得罪上帝”
  rationale: 原文以具体恶行累积说明其不敬虔；逐项保留能维持文本的伦理与神学张力。
- issue: 祭司不能供职的地点
  choice: 圣所
  alternative: 圣殿
  rationale: “圣所”较贴近原文的一般性圣域称谓，不无根据地限定建筑名称。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语体。源页文字存在明显错乱和缺损，因此以可辨认的叙利亚语词组及经审校的英文咨询层共同控制措辞；不添加原文以外的解释。
