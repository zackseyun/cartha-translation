  yaml_path: translation/extra_canonical/2_baruch/064/003.yaml
  text: 'And he made an image with five faces: four looked toward the four winds, and the fifth was on top of the image, as a rival to the zeal of the Mighty One.'
translation:
  language: zh_hans
  text: 他又造了一座有五个面孔的像：四个面孔分别朝向四方的风，第五个在像的顶端[a]，仿佛要与大能者的忌邪相抗衡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在像的上方”。
    reason: 相应叙利亚语空间短语可指像的顶端，也可泛指位于像的上方。
  - marker: b
    text: 或译：“作为大能者忌邪的对手”。
    reason: 源语用“对手、敌手”一类名词；正文以“相抗衡”作自然的动态表达。
lexical_decisions:
- source_word: ܚܡܫܥܣܪܐ / reconstructed sense ‘five faces’
  choice: 五张脸
  rationale: 按本节可恢复的语境表达像的五个面孔；“张”符合现代汉语对人脸或像之面容的量词用法。
- source_word: ܪ̈ܘܚܝ / ‘winds’
  choice: 四方的风
  rationale: 保留闪语传统中“四风”与四个方向相连的表达，同时让现代读者清楚这些脸分别朝向四方。
- source_word: ܠܥܠ ܡܢ ܨܠܡܐ / ‘on top of, above the image’
  choice: 在像的顶上
  rationale: 在描述同一座像的第五张脸时，实体位置“在顶上”比单说“在上方”更自然；脚注保留另一种空间理解。
- source_word: ܛܢܢܬܐ / ‘zeal, jealousy’
  choice: 忌邪之心
  rationale: 此处指大能者因偶像冒犯而发的神圣热忱；“忌邪之心”既保留神学张力，也避免把它弱化为普通热心。
- source_word: ܚܪܘܝܐ / ‘rival, adversary’
  choice: 争胜
  rationale: 以动态汉语表达该像被设为对手、与大能者的忌邪之心抗衡的含义；脚注保留较弱的‘对抗’读法。
theological_decisions:
- issue: 偶像与“大能者的忌邪之心”的关系
  choice: 要与大能者的忌邪之心争胜
  alternative: 仿佛与大能者的忌邪之心对抗
  rationale: 正文保留源词所含“对手、竞争者”的强烈冒犯意味，不把它解释成偶像真能与上帝匹敌；“要”表达造像者赋予它的僭越姿态。
- issue: 神名或称号的处理
  choice: 大能者
  alternative: 全能者
  rationale: “大能者”较直接对应源文称号，也避免擅自把它固定为带有更专门语义的“全能者”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“四方的风”保留古代方位意象；“忌邪之心”传达神圣热忱与嫉邪之间不宜消解的语义张力。
