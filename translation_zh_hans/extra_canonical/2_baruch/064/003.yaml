revisions:
- from: 他又造了一座有五张脸的像：四张朝向四方的风，第五张在像的顶上[a]，要与大能者的忌邪之心争胜[b]。
  to: 他又造了一座有五个面孔的像：四个面孔分别朝向四方的风，第五个在像的顶端[a]，仿佛要与大能者的忌邪相抗衡[b]。
  rationale: 修订仅改善汉语句法、语体及“对手”意象的对应方式：以“分别”明确四风对应，以“顶端”表达同一座像上的物理位置，并以“相抗衡”传达源语的敌对、竞争含义而不引入实际胜负的断言。脚注保留“在上方”的空间歧义，并更直接说明“对手”的名词性表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:18:54Z'
