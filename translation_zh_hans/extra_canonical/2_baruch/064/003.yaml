  - severity: medium
    issue: “要与……忌邪之心争胜”对“rival/adversary”的表达略偏竞赛性。
    rationale: 源词强调该像被设为与大能者的忌邪相对抗的对手；“相抗衡”更自然，也较少添加胜负竞赛的色彩。
  - severity: low
