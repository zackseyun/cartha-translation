  text: 于是他回答我说：“为此，当时曾这样说过……”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: 他回答我说
  rationale: 保留叙事中常见的回答公式；中文省去句首“于是”，表达更自然，同时没有增强原文语气。
- source_word: ܡܛܠ ܗܢܐ
  choice: 因此
  rationale: 明确保留因果联系；较“因为这事”更符合现代汉语直接引语中的自然表达。
- source_word: ܒܗܘ ܙܒܢܐ
  choice: 那时
  rationale: 保留时间指向，不将其弱化为单纯的话语连接词。
- source_word: ܐܡܝܪ
  choice: 有话说
  rationale: 以无人称表达保留叙利亚文被动式的含混性，不擅自指定说话者；也比生硬的“被说”更符合现代汉语。
theological_decisions:
- issue: 开头回答者及后续话语的归属
  choice: 仅按原文写作“他回答我说”，并将ܐܡܝܪ译为不指明主体的“有话说”
  alternative: 将后半句明确译作“上帝曾说”或“有人说”
  rationale: 现存句段没有进一步指明ܐܡܝܪ的施事者；译文不把这句话解释性地归为神谕或一般人的言论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句末省略号反映所给原文在本节仅保存或截取到解释的开头。
