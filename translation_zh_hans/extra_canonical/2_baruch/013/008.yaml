    text: 或作“你要对他们说”。
    reason: 保存既有传本或断句所产生的说话者转换这一异读，不在正文中默然消解。
  revision_rationale: 仅作安全的汉语措辞调整：以“喝过……，也要喝……”替换略不自然的“既……也要……”，并以“滤过的酒”明确原文的过滤含义。正文的说话者、受话者、酒与沉渣的意象，以及至高者不偏私的审判均未改变。
