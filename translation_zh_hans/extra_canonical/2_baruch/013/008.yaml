review_pass:
  verdict: revise
  source_fidelity: 叙利亚语底本此处为 ܐܡܪ ܠܗܘܢ ܐܢܐ（“我对他们说”），而不是“我对你们说”。后面的直接引语以复数“你们”称呼这些对象。其余意象“滤清的酒／沉渣”及不偏私的审判均可保留。
  naturalness: “我对他们说：‘你们既喝了滤清的酒，也要喝它的沉渣……’”在现代书面普通话中自然、庄重，且清楚保留对照意象。
  terminology: “至高者”“审判”“沉渣”适切；“滤清的酒”准确传达与沉渣相对的酒。删除不受当前底本支持且与正文说话者不相符的异读脚注。
  issues:
  - severity: high
    issue: 正文将 ܠܗܘܢ（“对他们”）译为“对你们”。
    rationale: 这改变了叙述者对受话者的指称关系。英文审校轨迹虽采用“to you”，但所给叙利亚语底本明确作“to them”；应以原文为先。
  - severity: medium
    issue: 脚注“或作‘你要对他们说’”并非正文“我对你们说”的同等替代，且没有所给底本依据。
    rationale: 该脚注同时改变人称、说话者和受话者，容易造成无根据的文本歧义；删除即可避免误导。
  revised_text: 我对他们说：“你们既喝了滤清的酒，也要喝它的沉渣，因为至高者的审判不偏待人。”
  revised_footnotes: []
  revision_rationale: 依叙利亚语 ܐܡܪ ܠܗܘܢ ܐܢܐ 将引语引介语改为“我对他们说”，但保留直接引语中面向该群体的“你们”。删除没有当前底本支持的脚注；不改变酒与沉渣的比喻，也不增添神学解释。
