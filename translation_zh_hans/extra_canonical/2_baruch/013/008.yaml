  text: I say to you, ‘You who have drunk strained wine shall also drink its dregs. For the judgment of the Most High shows no partiality.’
translation:
  language: zh_hans
  text: 我对你们说[a]：“你们喝过滤过的酒，也要喝它的沉渣，因为至高者的审判不偏待人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“你要对他们说”。
    reason: 保存既有传本或断句所产生的说话者转换这一异读，不在正文中默然消解。
lexical_decisions:
- source_word: ܚܡܪܐ ܡܕܝܠܢܐ
  choice: 滤清的酒
  rationale: 按叙利亚语所指经滤除杂质、澄清的酒直译，同时保留它与下文“沉渣”的鲜明对照。
- source_word: ܕܠܡܐ
  choice: 沉渣
  rationale: 语境与滤清之酒相对，所指是酒中沉积、混浊的残余；“沉渣”比“渣滓”更具体自然。
- source_word: ܦܘܪܥܢܐ
  choice: 审判
  rationale: 该词可指报应、偿还或惩罚；本句谈至高者不徇私的裁断，译作“审判”最能涵盖司法与报应意味。
theological_decisions:
- issue: 至高者的审判是否偏待人
  choice: 不偏待人
  alternative: 不徇情面／没有偏私
  rationale: 保留神施行审判时不按身份徇私的陈述，不扩展为特定宗派的审判论。
- issue: 引语开头的说话者与受话者
  choice: 我对你们说
  alternative: 你要对他们说
  rationale: 当前校勘与修订证据支持第一人称说话者直接向复数对象发言；因传本或断句传统存在另一读法，以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；“既……也……”准确表达先饮滤清之酒、继而必饮沉渣的对应关系。引号完整标示直接引语，脚注标记已置于正文相应位置。
