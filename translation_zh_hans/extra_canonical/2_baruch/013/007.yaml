    ܠܡܘܒܠܢܝ ܒܒܟܝܐ. ܠܐܘ ܬܘܒ

    ܐܬܝܬ ܡܕܒܪܐ ܘܐܡ̣ܪܬ

    ܒܡܕܐ ܒܬܫܥ̈ܝܬܗ̇.

    ܟܐܒܐ ܗܘܘ ܠܝ ܪ

    ܠܥܠܡ. ܗܟܢܐ ܕܝܢ ܗܘܐ

    ܡܙܥܙ ܕܠܐ ܡܣܬܝܟ.

    ܘܐܢܫܐ ܕܒܝܬ ܓܘܣܝ

    ܀ ܡܘܫܚܬܐ ܕܐܝܬ ܗܘܐ

    ܡܕܥܝܗܝܢ ܘܐܘܦܢ ܚܕ̈ܕܐ.

