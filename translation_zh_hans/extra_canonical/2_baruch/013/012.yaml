translation:
  language: zh_hans
  text: 因为我始终善待你们，你们却始终否认我的恩惠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܟܠ ܙܒܢ
  choice: 一直
  rationale: 这个短语在本节中两次表示“在一切时候／始终”；译作“一直”符合现代汉语习惯，也保留反复对照。
- source_word: ܐܒܐ
  choice: 善待
  rationale: 此处据上下文及校勘所反映的施恩行动理解；用动词“善待”自然表达持续向对方行善。
- source_word: ܛܝܒܘܬܐ（校勘所反映的语义）
  choice: 恩善
  rationale: “恩善”兼顾恩惠与良善，既与前句“善待”呼应，又避免将含义缩窄为单纯的“好意”。
- source_word: ܟܦܪ / ܐܡܪ否定结构（校勘所反映的语义）
  choice: 否认
  rationale: 保留对方不承认、拒认上帝恩善的指控力度，不弱化为“忘记”或“不领情”。
theological_decisions:
- issue: 施恩者与受惠者的关系
  choice: 保留第一人称“我”和复数“你们”
  alternative: 明确增补“上帝”或“以色列”
  rationale: 本节语境足以辨明说话者和对象；不在正文中增补原句未明说的身份，以免过度解释。
- issue: “恩善”的含义
  choice: 译为“我的恩善”
  alternative: “我的仁慈”或“我的善行”
  rationale: “恩善”保留品格与施恩行动之间的张力，不把原意限定为情感上的仁慈或若干具体善行。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“因为……却……”呈现原句的理由关系和强烈转折；两次使用“一直”保留源文“在一切时候”的平行与责问力度。
