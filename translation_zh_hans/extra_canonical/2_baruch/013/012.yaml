    ܒܚܘܫܒܐ ܘܐܡܪܘ ܠܡܘܬܐ.

    ܛܘܒܝܟܘܢ ܠܟܘܢ ܕܐܝܬ

    .. ܡܠܝܢ ܕܝܠܢ ܕܚܢܢ ܚܝܝܢ܀

    12 ܐܠܐ ܗܘܐ ܐܡܪ ܐܢܐ

    ܐܝܟ ܕܡܫܬܡܥ ܐܢܐ.

    ܘܐܡܠܠ ܠܡܘܒܕܢܗܘܢ ܕܐܒܐ

