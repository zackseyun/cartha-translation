    # Source page p0221 (printed 121)

    ܙܒܢ ܦܠܓܗ ܕܝܘܡܐ

    ܡܫܬܘܙܒ. ܘܠܐ ܐܡ̇ܝܢ

    ܬܟܘܬܗܘܢ ܕܫܡܝܐ ܡܬܬܙܝܥܝܢ.

    ܠܐ ܬܣܒܪ ܘܬܣܒܪܝܢ

    ܕܒܒܥܘܬܟ ܬܬܩܒܠ ܡܕܡ

    ܘܚ̇ܕܝܬ. ܘܠܐ ܣ̇ܟܝܬ

    ܬܬܢܣܒ ܘܬܫܬܒܩܝܢ.

    ܫܪܝܪܐܝܬ ܓܝܪ ܒܙܒܢܐ

    ܡܬܬܒܪܐ ܒܥܝܢܝ ܚܛܝ̈ܐ.

    ܗܘ ܕܐܡܪ ܒܠܒܗ ܪܘܚܐ

    ܐܝܟ ܕܦ̇ܩܕܬ ܐܚܝܕܐ.

    ܘܟܕ ܐܡ̇ܪܢܐ ܗܠܝܢ ܪ̇ܡܬ

    ܫܒܥܐ ܝܘܡ̈ܝܢ.܀ ܘܗܘܬ

    ܡܢ ܒܬܪ ܗܠܝܢ ܐܢܐ ܒܪܘܟ

    ܩܐܡ ܗܘܝܬ ܥܠ ܨܝܕܐ

    ܕܢܗܪܐ. ܘܗܘܐ ܩܠܐ

    ܐܙܐ ܡܢ ܡܪܘܡܐ

    ܘܐܡ̇ܪ ܠܝ. ܩܘܡ ܥܠ

    ܪ̈ܓܠܝܟ ܒܪܘܟ ܘܫܡܥ

    ܡܠܬܐ ܕܐܠܗܐ ܚܝܠܬܢܐ.

    ܡܛܠ ܕܐܬܬܙܝܥܘ ܥܠ

    ܡܕܡ ܕܐ̇ܡܪܬ ܠܩܘܒܠܝ.

    ܡܛܠ ܗܢܐ ܡܬܝܗܒ

    ܠܟܘܢ ܠܡܫܡܥܘ ܡ̈ܠܐ.

    ܕܬܬܒܝܐܘ ܒܬܪܟܢ.

    ܐܢ ܢܬܒܥ ܡܢܟܘܢ

    ܡܕܝ̈ܢܬܐ ܐܝܠܝܢ ܕܡ̈ܠܝܢ

    ܕܠܡܒܢܐ ܐܢܬܝܢ ܒܠܚܘ

    ܐܠܗܐ ܚܝܠܬܢܐ. ܦܘܪܥܢܐ

    ܗܘܐ. ܐܡܪ ܠܗܘܢ ܐܢܐ

    ܘܐܝܠܝܢ ܕܕܡ̈ܝܢ ܠܗܘܢ ܐܝܠܝܢ

    ܕܚܕܝܘܬܗܘܢ ܒܝܫܬܐ ܗܘܬ

    ܘܦܘܪܥܢܐ ܕܐܝܠܝܢ ܒܠܝܫܘ

    ܗܠܝܢ ܒܡܠܟܝܢ. ܒܙܒܢܘ

    ܕܡܬܝܕܥܐ ܠܐܬܪܘܬ

    ܠܡܡܠܠܘ ܘܡ̇ܚܝܢ ܢܦܫܗܘܢ.

    ܘܐܢ ܠܐܡܕܢ ܒܗܘ̇ ܙܒܢܐ

    ܕܐܬܬܚܝܘ. ܘܐܡܪ ܠܗܘܢ

    ܐܢܬܝܢ ܕܐܫܬܬܝܬܝܢ ܚܡܪܐ

    ܡܕܝܠܢܐ. ܐܫܬܝܬܝܢ ܐܦ ܡܢ

    ܕܠܡܐ. ܕܢܗܘܐ ܕܡܐ

    ܕܠܐ ܡܣܒܪ ܒܪ̈ܦܐ ܗܘ.

    ܡܛܠ ܗܕܐ ܠܐ ܒܢܦܫܗܘܢ

    ܠܡܘܡܬܐ ܠܐ ܚܣܘ. ܐܠܐ

    ܫܠܡ ܒܗܘ̇. ܐܝܟ

    ܕܒܣܝ̈ܡܘܗܝ. ܡܛܠ ܕܢܗܘܐ.

