  text: But now, you nations and peoples, you are guilty, because at all times you have trodden the earth and dealt with creation without righteousness.
translation:
  language: zh_hans
  text: 但现在，你们列国万民都有罪，因为你们一向践踏大地，以不义对待受造之物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡ̈ܘܬܐ
  choice: 列国万民
  rationale: 该词可指各国、各族或外邦人；结合并列群体称呼，以“列国万民”自然传达其集体范围。
- source_word: ܚܝܒܝܢ
  choice: 都有罪
  rationale: 保留负有罪责、被判有罪的司法和道德意味，而不弱化为一般性的“有过错”。
- source_word: at all times（英语审校层所反映的源文时态范围）
  choice: 一向
  rationale: 简洁表达持续、惯常的行为，符合现代汉语，同时不限定为某一具体历史时段。
- source_word: trodden the earth
  choice: 践踏大地
  rationale: 保留动作意象及其压迫、蹂躏的负面色彩。
- source_word: creation
  choice: 受造之物
  rationale: 既可涵盖整个受造界，也可指其中的受造者；此译法保留原有神学指向而不擅自缩窄为“人类”或“自然”。
- source_word: without righteousness
  choice: 以不义
  rationale: 以正面概念的反义形式保留道德与司法张力，避免仅译作“错误地”或“不公平地”。
theological_decisions:
- issue: 列国万民罪责的范围
  choice: 保持对群体的直接宣告：“你们……都有罪”
  alternative: 弱化为“你们犯了错”或限定为某些统治者
  rationale: 源文及英语审校层均将罪责直接归于所呼告的列国和民众，不宜另加范围限制。
- issue: “受造之物”的所指
  choice: 保留广义而不具体化
  alternative: 译为“自然界”“人类”或“上帝的创造”
  rationale: 原句容许整体受造界或其中受造者的理解；“受造之物”能保存这种开放性。
translation_notes:
  register: 采用现代、庄重而清楚的经文语体。“但现在”承接上下文转折；“列国万民”适合公开宣告的语势；全句不增添解释性神学术语。
