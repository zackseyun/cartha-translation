  text: 'And it happened after these things that I, Baruch, was standing on the bank of the river, and a voice came from the height and said to me:'
translation:
  language: zh_hans
  text: 这些事以后，我巴录正站在河岸边[a]，有声音从高处传来，对我说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有文本作“锡安山”。
    reason: 对照传统在启示地点上与Ceriani叙利亚文主底本不同；正文依主底本作“河岸边”，脚注保存异文。
lexical_decisions:
- source_word: ܗܘܬ ܡܢ ܒܬܪ ܗܠܝܢ
  choice: 这些事以后
  rationale: 忠实表达叙事承接关系，同时采用自然简洁的现代汉语。
- source_word: ܩܐܡ ܗܘܝܬ
  choice: 正站在
  rationale: 进行体结构表示当时持续的状态，“正站在”在汉语中自然地保留这一叙事背景。
- source_word: ܥܠ ܨܝܕܐ ܕܢܗܪܐ
  choice: 在河岸边
  rationale: Ceriani叙利亚文底本明确指向河流的一侧或岸边；不以对照传统的“锡安山”取代主文本读法。
- source_word: ܩܠܐ ܐܙܐ ܡܢ ܡܪܘܡܐ
  choice: 有声音从高处传来
  rationale: “从高处”保留原文空间表述，不擅自具体化为“从天上”；“传来”自然表达声音来到叙述者耳中的动态。
- source_word: ܐܡ̇ܪ ܠܝ
  choice: 对我说
  rationale: 直接、准确地引出下一节的话语。
theological_decisions:
- issue: 巴录领受启示时所在的地点
  choice: 保留Ceriani主底本的“河岸边”
  alternative: 锡安山
  rationale: 项目以Ceriani叙利亚文为主证；对照传统虽有“锡安山”的异文，但不应据此静默改写主文本，故将其列入脚注。
- issue: 声音来源“高处”的指涉
  choice: 译作“从高处”
  alternative: 从天上
  rationale: 原文可使读者联想到天上来源，但措辞本身是“高处”；译文保留其表达幅度，避免将含义过度限定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我巴录”保留原文自我点名的强调；整句按汉语叙事节奏调整，但不省略声音从高处传来并开口说话的后半句。
