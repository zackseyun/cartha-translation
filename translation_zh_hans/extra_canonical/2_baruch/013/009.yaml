  text: Therefore, he formerly did not spare even his own sons, but afflicted them like his enemies because they sinned.
translation:
  language: zh_hans
  text: 所以，他从前连自己的儿子也不顾惜；他们犯了罪，他就使他们受苦，如同对待自己的仇敌。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܢ̈ܘܗܝ（据经节校勘所指）
  choice: 自己的儿子
  rationale: 保留亲属称谓及所属关系；“自己的”在现代汉语中自然地凸显原文的反差。
- source_word: ܠܐ ܚܣ（据经节校勘所指）
  choice: 不顾惜
  rationale: 既表达“不宽免、不怜惜”，又保持庄重的经文语体。
- source_word: ܐܝܟ ܒܥܠܕܒܒ̈ܘܗܝ（据审校所恢复的读法）
  choice: 如同对待自己的仇敌
  rationale: “对待”补足汉语比较结构所需成分；“自己的”明确保留叙利亚语所有格后缀。
- source_word: ܚܛܘ（据经节校勘所指）
  choice: 犯了罪
  rationale: 直陈行为及其道德性质，不弱化为一般性的“犯错”。
theological_decisions:
- issue: “儿子”所指及神人关系
  choice: 保留“自己的儿子”，不解释其具体身份
  alternative: 译作“他的子民”或加注说明所指群体
  rationale: 原文称谓具有神学张力；译文不应擅自将其释义为某一特定群体。
- issue: 苦难与犯罪之间的因果关系
  choice: 译为“他们犯了罪，他就使他们受苦”
  alternative: 译为较弱的伴随关系，如“在他们犯罪时使他们受苦”
  rationale: 保留原文及审校文本所呈现的因果关系，同时不额外说明惩罚机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”承接上文论证；以分号划分“不顾惜”与“使他们受苦”两个紧密相关的分句，避免长句含混。由于所给章节页桶存在重叠、断行及经节定位不清，措辞以可辨识的叙利亚语证据、经节级审校信息和英语审计层交叉确定。
