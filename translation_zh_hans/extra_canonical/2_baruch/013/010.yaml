translation:
  language: zh_hans
  text: 因此，他们当时受了管教，好叫他们得以成圣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܪܕܝܘ
  choice: 受了管教
  rationale: 采用被动表达，保留叙利亚语“受惩戒、受训诫”的含义；“管教”既包含惩治，也包含使人归正的目的，比单纯的“惩罚”更完整。
- source_word: ܢܬܩܕܫܘܢ
  choice: 成为圣洁
  rationale: 译出“被分别为圣／得以圣洁”的目的意义，同时避免加入具体礼仪或宗派解释。
- source_word: ܗܝܕܝܢ
  choice: 那时
  rationale: 保留原文的时间指示，承接上下文所说的受审判时期。
theological_decisions:
- issue: 管教与成圣之间的关系
  choice: 用“为要”表达目的
  alternative: “以致他们成为圣洁”
  rationale: 原句呈现管教指向成圣的目的；不进一步断定这一目的是否必然实现，从而保留原文的神学张力。
- issue: 成圣的施事者
  choice: 译作“成为圣洁”，不明说施事者
  alternative: “使他们成圣”
  rationale: 原文动词形态不要求在中文中补出明确施事者；如此可避免把未明说的主体直接限定为上帝或管教本身。
translation_notes:
  register: 采用庄重而自然的现代汉语。“受了管教”适合经文语体，也能让普通读者理解；句式简洁，保留因果、时间和目的三个层次。
