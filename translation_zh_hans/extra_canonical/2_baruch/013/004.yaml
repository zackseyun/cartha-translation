translation:
  language: zh_hans
  text: 如果那些如今建成的城说：‘大能的上帝为什么使这报应临到我们？’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܝ̈ܢܬܐ
  choice: 城
  rationale: 该词通常指城市；这里采用简洁自然的现代汉语表达。
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ
  choice: 大能的上帝
  rationale: 保留原文对上帝能力的明确称述，语体庄重而通顺。
- source_word: ܦܘܪܥܢܐ
  choice: 报应
  rationale: 此词含偿还、追讨或惩罚性回报之意；上下文是城因恶行遭受上帝追讨，译作“报应”可保留行为与后果相称的意味。
theological_decisions:
- issue: 上帝与灾祸性报应的关系
  choice: 译作“使这报应临到我们”
  alternative: “给我们这样的报应”或“把这惩罚降在我们身上”
  rationale: 原文把事件明确归于大能的上帝，但不必扩展为更具体的施罚机制；“使……临到”既保留神的主权，也避免加入原文未明说的细节。
translation_notes:
  register: 采用现代、庄重、易懂的叙述语体。“有一天问”自然表达原文所设想的将来发问情形；引语保留质问式语气。
