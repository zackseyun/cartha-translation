  text: Therefore, they were disciplined at that time so that they might be forgiven.
translation:
  language: zh_hans
  text: 所以，他们当时受了管教，为要使他们得到赦免。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要使他们得以存留（被放过）。”
    reason: 原文动词既可表示“得到赦免／被放过”，也可表示“被留下／存留”。
lexical_decisions:
- source_word: ܐܬܪܕܝܘ
  choice: 受了管教
  rationale: 该完成式表示已经发生的管教或惩戒；“受了管教”既保留其纠正意味，也符合上下文。
- source_word: ܗܝܕܝܢ
  choice: 当时
  rationale: 自然表达时间副词“那时／当时”，并保留事件发生于特定时刻的含义。
- source_word: ܢܫܬܒܩܘܢ
  choice: 得到赦免
  rationale: 该动词可表示“被赦免、被放过”或“被留下”；在管教所指向的结果这一语境中，正文采用“得到赦免”，同时以脚注保留另一可能。
theological_decisions:
- issue: 管教与赦免之间的关系
  choice: 译作目的结构“为要使他们得到赦免”
  alternative: 可理解为结果或存留：“以致他们得以被放过／存留下来”
  rationale: 原文的从属结构宜保留目的意味，但不进一步解释赦免的机制，以免加入原文没有明说的神学结论。
- issue: 动词ܢܫܬܒܩܘܢ的语义张力
  choice: 正文采用“得到赦免”
  alternative: “得以存留”或“被放过”
  rationale: “赦免”最切合惩戒语境，但原词确有“留下、存留”的词义，因此用脚注明确保留歧义。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“受了管教”比“遭受惩罚”更能保留惩戒兼具纠正目的的语气；不补出原文没有的“列国”等主语。
