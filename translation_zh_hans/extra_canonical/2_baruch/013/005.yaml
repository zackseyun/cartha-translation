  text: You shall say to them, and to those like them, ‘You who have seen this calamity and this retribution that has come upon you and upon your city at its appointed time—
translation:
  language: zh_hans
  text: 你要对他们，以及和他们一样的人说：“你们已经看见这场灾祸，也看见这惩罚在所定的时候临到你们和你们的城[a]——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的人民”。
    reason: 保留英文审校轨迹中的替代译法，同时不对其文本史依据作未经证实的说明。
lexical_decisions:
- source_word: ܒܝܫܬܐ
  choice: 灾祸
  rationale: 此处指亲历的重大祸患；“灾祸”既保留负面事件的广度，也符合庄重叙事语体。
- source_word: ܦܘܪܥܢܐ
  choice: 惩罚
  rationale: 该词可指报应、偿还或惩处；上下文强调灾难作为对恶行的追讨，译作“惩罚”自然且不额外限定其神学机制。
- source_word: ܒܙܒܢܗ
  choice: 在所定的时候
  rationale: 保留单数所属关系及特定时机之意；用“所定的时候”表达事件在其指定时刻发生。
- source_word: ܡܕܝܢܬܟܘܢ
  choice: 你们的城
  rationale: 通常义为城或城市；结合本书耶路撒冷受难的语境，正文采用“城”。
theological_decisions:
- issue: 灾祸与惩罚的关系
  choice: 以“这场灾祸”和“这惩罚”并列表达
  alternative: 把灾祸直接解释为神的审判或报应
  rationale: 原文并列两个相关概念，但不必把二者完全等同；译文保留其神学张力，不增添解释。
- issue: 惩罚发生时间的指向
  choice: “在所定的时候”
  alternative: “在神所定的时候”
  rationale: 原文表达特定或指定的时间，却未在本句明说设定者；正文不补入“神”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“你要……说”保留命令式语气；“也看见”使两个并列宾语在汉语中清晰自然。句末破折号表明话语在下一节继续。
