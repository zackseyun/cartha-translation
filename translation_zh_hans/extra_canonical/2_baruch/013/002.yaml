translation:
  language: zh_hans
  text: 有声音从高处传来，对我说：“巴录，站起来，听大能者的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܡܪܘܡܐ
  choice: 从高处
  rationale: 直译空间意象“从高处”，不擅自明确为“从天上”。
- source_word: ܩܘܡ ܥܠ ܪ̈ܓܠܝܟ
  choice: 站起来
  rationale: 原文直译为“用你的双脚站立”；现代汉语用“站起来”自然、准确地表达同一命令。
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 保留作为神圣称号的表达，与审校后的英文咨询层一致；“大能者”在中文中庄重自然，也避免生硬的“大能的上帝”。
theological_decisions:
- issue: 神圣称号ܐܠܗܐ ܚܝܠܬܢܐ的呈现
  choice: 大能者
  alternative: 大能的上帝
  rationale: 原文含“上帝/神”与“大能”两个要素，但在此可整体理解为神圣称号；采用“大能者”保留称号功能，不额外引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；引语标点完整，不添加原文没有的解释。
