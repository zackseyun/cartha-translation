  text: Because you were shaken by what has happened to Zion, therefore you will surely be preserved until the consummation of the times, that you may be a testimony.
translation:
  language: zh_hans
  text: 因为锡安所遭遇的事使你震动，所以你必蒙保全，直到诸时代终结，使你成为见证。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成为见证”也可理解为“成为证言”或“成为凭据”。
    reason: 对应原词可指见证、证言或作为凭据之物；正文保留其名词性和语义开放性。
lexical_decisions:
- source_word: ܐܬܬܙܝܥܘ
  choice: 震动
  rationale: 保留原词所表达的强烈震撼与不安，不弱化为一般的惊讶。
- source_word: ܐܬܪܘܬ / ܨܗܝܘܢ（据本节文本传统）
  choice: 锡安
  rationale: 本节所指为锡安及其遭遇；采用现代中文圣经语域中通行的专名形式。
- source_word: ܡܫܬܘܙܒ
  choice: 蒙保全
  rationale: 兼顾被保存、获保守而存留之意，并保留被动意味。
- source_word: ܫܘܠܡܐ ܕܙܒ̈ܢܐ（据本节文本传统）
  choice: 诸时代的终结
  rationale: 按短语的末世性时间含义直译，避免擅自限定为某一具体末世体系。
- source_word: ܣܗܕܘܬܐ（据本节文本传统）
  choice: 见证
  rationale: 保留既可指见证行为、也可指作为证言或凭据的语义幅度。
theological_decisions:
- issue: “诸时代的终结”的末世含义
  choice: 诸时代的终结
  alternative: 世界的末了
  rationale: 原表达着重多个时期或时代达到终局；不将其简化为物质世界毁灭，也不引入特定末世论解释。
- issue: 巴录存留的目的
  choice: 好让你作见证
  alternative: 好让你成为一个证据
  rationale: “作见证”在现代中文中自然庄重，同时不把见证的对象、内容或法庭性质补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原句的因果结构、神学张力和末世时间表达，不补明施行保全者，也不解释见证的具体对象。
