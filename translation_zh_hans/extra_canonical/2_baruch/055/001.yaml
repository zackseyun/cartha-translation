  text: 'And it happened, when I was praying, speaking the first words of this prayer, that I was disturbed and I trembled; and I was reflecting on the seed of humankind—how many are those who have gone, and how few are those who are kept. And as I was considering these things, I heard a voice that said to me:


    “Son of man, why are you troubled, and why are you alarmed? For before you were created, you were known to me, and before you came forth from your mother’s womb, you were promised to me. And for this reason these things that are to come were shown to you.”


    And I said to him, “Lord, you have shown me the multitude of the times, and what has happened in them; but you have not shown me how long it will be. Therefore I ask that I may hear concerning those who have borne witness for righteousness, what is the reward kept for them.” And a multitude of good things and of evil things that are coming was promised to me, and then I went up to the mountain.


    And it came to pass, after seven days, that I came to that place where there was a spring. And as I was sitting there, I was taken up on the chariot of a cloud—not in the body, and I did not know it. And a mystery was shown to me, and I heard a voice that said to me: “See and know how, in this world, their works and their labors are preserved, of those who have acted well and of those who have acted wickedly.”'
translation:
  language: zh_hans
  text: '我正在祷告，刚说出这祷告最初的话时，心里便受到震动，浑身战栗。我思量着人类的后裔：离去的人何其多，蒙保守的人何其少！正思量这些事的时候，我听见有声音对我说：


    “人子啊，你为什么心神不宁？为什么惊慌？你尚未受造，我就认识你；你尚未出母腹，我就认识你。因此，将来要发生的这些事才向你显明了。[a]”


    我对他说：“主啊，你已经让我看见众多的时期，以及其中所发生的事，却没有让我看见这一切要延续多久。[b] 所以，求你让我听见：那些为正义作见证的人，有什么为他们存留的报偿？”于是，将要来临的许多善事和恶事都应许给了我；随后我便上了山。


    七天以后，我来到那处有泉水的地方。我坐在那里，坐在一辆云车上时，就被提了上去——不是在身体中，我也不知道这是怎么回事。一个奥秘向我显明了；我听见有声音对我说：“你要观看，并且明白：在这个世界上，那些行善之人和作恶之人的行为与劳碌，是怎样被保存下来的。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因此，我才把这些将来要发生的事向你显明。”
    reason: 叙利亚文的动词形态与句法可按神为施事者的主动意义理解，也可用不明说施事者的被动式表达。
  - marker: b
    text: 较直译：“却没有让我看见是从何时到何时。”
    reason: 原文用成对的疑问表达界定时间跨度；正文采用较自然的“延续多久”。
lexical_decisions:
- source_word: ܙܪܥܗ ܕܐܢܫܐ
  choice: 人类的后裔
  rationale: ܙܪܥ本义为“种子”，在此集合性地指人类的后代；“后裔”保留繁衍意象，又符合现代汉语。
- source_word: ܡܬܕܘܕ
  choice: 心神不宁
  rationale: 表达内在的扰乱和不安，并与下句的“惊慌”形成自然递进。
- source_word: ܡܬܪܗܒ
  choice: 惊慌
  rationale: 该词基本义为惧怕；此译既保留恐惧感，也不过分强化为“恐惧万分”。
- source_word: ܬܬܒܪܐ
  choice: 受造
  rationale: 动词表示被造或被形成；“受造”贴近被动态，同时不把上下文限定为胚胎形成过程。
- source_word: ܐܬܝܕܥܬ ܠܝ
  choice: 我就认识你
  rationale: 叙利亚文是“为我所知／被我认识”；用主动式汉语更自然。原文在“尚未受造”及“尚未出母腹”之后重复这一表达，因此两处均保留“认识”，不改作“应许”。
- source_word: ܐܬܚܘܝܬ ܠܟ
  choice: 向你显明了
  rationale: 采用非限定施事的表达，保留原文形态可能呈现的被动色彩，并避免过度明确行动方式。
- source_word: ܡܢ ܐܝܕܐ ܥܕܡܐ ܠܐܝܕܐ
  choice: 要延续多久
  rationale: 此处问的是所述时期从何时到何时，即持续的跨度；采用自然汉语表达，脚注保留较直译的可能。
- source_word: ܬܘܪܨܐ
  choice: 正义
  rationale: 在“作见证”的语境中按正直、公义之义处理；不把它具体化为某种宗派性的教训或制度。
- source_word: ܐܫܬܘܕܝܘ
  choice: 应许给了我
  rationale: 该处动词表示作出承诺或应许；与所启示的将来善恶之事相连，译作“应许”最贴近其语态和语境。
- source_word: ܡܪܟܒܬܐ ܕܥܢܢܐ
  choice: 一辆云车
  rationale: 保留启示文学中的车辆意象；“云车”比“云的战车”更自然而仍清楚。
- source_word: ܐܬܢܣܒܬ
  choice: 被提了上去
  rationale: 符合异象中被带上升的语境，同时不暗示永久升天。
- source_word: ܪܐܙܐ
  choice: 奥秘
  rationale: 这是叙利亚文中常用于神圣隐秘或启示内容的词，“奥秘”保持庄重的启示文学语域。
- source_word: ܡܬܢܛܪܝܢ
  choice: 被保存下来
  rationale: 保留“守住、存留”的开放含义，不擅自判定是记入审判簿册、今世得报，还是末世才受处置。
theological_decisions:
- issue: 神在先知受造和出生以前对他的认识
  choice: 两处均直译为“我就认识你”
  alternative: 第二处译为“你就被应许给我”
  rationale: 现存叙利亚文两处都使用“被我认识／为我所知”的表达。译文保留其重复和神预先认识人的张力，不额外套入某种预定论体系或特定先知蒙召公式。
- issue: “离去的人多、蒙保守的人少”的含义
  choice: 保持“离去／蒙保守”的对照，不说明其救恩结局
  alternative: 明确译成“灭亡的人多、得救的人少”
  rationale: 上下文可涉及人的死亡、存留或更广的终末命运；原文并未在此明确作出得救人数的教义判断。
- issue: 巴录被提与身体的关系
  choice: 译为“不是带着身体”，保留异象经历的描述
  alternative: 解释为纯粹内心的梦，或肉身升天
  rationale: 原文明说不在身体中，却没有进一步界定经验机制；因此不把它系统化为某种灵魂出游或肉身被提教义。
- issue: 善恶之人的行为与劳碌“被保存”
  choice: 维持被保存、存留的开放表述
  alternative: 明说记录下来等候末日审判
  rationale: 审判背景是可能的，但该动词本身只要求守存含义；译文不指定报应的时间和方式。
- issue: 将来的善事和恶事被“应许”
  choice: 依动词照译“应许给了我”
  alternative: 为避免“恶事也被应许”的张力而改成“向我预告”
  rationale: 原文用承诺、应许类动词统摄将来的善恶之事。即使汉语读来有张力，也不应擅自弱化成单纯告知。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留启示文学的“云车”“奥秘”等意象；避免古奥虚词和教派术语。标点与分段帮助普通读者辨认叙述、祷告和天上声音。
