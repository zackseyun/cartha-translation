  source_fidelity: 译文总体忠实保留了叙利亚文的叙事、神预先认识、人数多寡的开放对比、异象中的云车和行为劳碌被守存等重点。惟开头没有明确译出“祷告”这一动作；“不是带着身体”把“不在身体中”的表述轻微改写，宜更贴近原文并保留其未解释的性质。
  naturalness: 整体为自然、庄重的现代书面汉语。修订后将开首改为明确的祷告叙述，并调整云车句的语序，使其既自然又能由脚注说明句法歧义。
  terminology: “人子”“主”“奥秘”“云车”“蒙保守”等用语恰当，且未引入宗派性诠释。“认识你”两次重复符合现存叙利亚文，优于英语审计文本第二次的“应许给我”。
  issues:
  - severity: medium
    issue: 开头未明确表达“我正在祷告”
    rationale: 原文以“当我祷告、开始说这祷告最初的话时”引入；“我开口说出这祷告最初的话时”虽暗示祷词，却遗漏了明确的祷告动作。
  - severity: low
    issue: “不是带着身体”略微过度解释“not in the body”
    rationale: 叙利亚文是“不是在身体中”，并未说明是否“带着”身体。改为“不是在身体中”能保留异象经验的原有歧义。
  - severity: low
    issue: 云车句的主句连接可更清晰
    rationale: 原文的“在云车上”可修饰“坐着”或“被提”；正文采用前者，并以脚注保留后者，能避免把两种理解混合在同一语序中。
  revised_text: '我正在祷告，刚说出这祷告最初的话时，心里便受到震动，浑身战栗。我思量着人类的后裔：离去的人何其多，蒙保守的人何其少！正思量这些事的时候，我听见有声音对我说：


    “人子啊，你为什么心神不宁？为什么惊慌？你尚未受造，我就认识你；你尚未出母腹，我就认识你。因此，将来要发生的这些事才向你显明了。[a]”


    我对他说：“主啊，你已经让我看见众多的时期，以及其中所发生的事，却没有让我看见这一切要延续多久。[b] 所以，求你让我听见：那些为正义作见证的人，有什么为他们存留的报偿？”于是，将要来临的许多善事和恶事都应许给了我；随后我便上了山。


    七天以后，我来到那处有泉水的地方。我坐在那里，坐在一辆云车上时，就被提了上去——不是在身体中，我也不知道这是怎么回事。一个奥秘向我显明了；我听见有声音对我说：“你要观看，并且明白：在这个世界上，那些行善之人和作恶之人的行为与劳碌，是怎样被保存下来的。”'
  revised_footnotes:
  - marker: a
    text: 或译：“因此，我才把这些将来要发生的事向你显明。”
    reason: 叙利亚文的动词形态与句法可按神为施事者的主动意义理解，也可用不明说施事者的被动式表达。
  - marker: b
    text: 较直译：“却没有让我看见是从何时到何时。”
    reason: 原文用成对的疑问表达界定时间跨度；正文采用较自然的“延续多久”。
  - marker: c
    text: 或译：“我坐在那里时，就被提到一辆云车上。”
    reason: 介词短语“在云车上”既可与“坐”连接，也可与“被提”连接；叙利亚文句法容许两种理解。
  revision_rationale: 修订仅补足原文开头明确的祷告动作，并把“不是在身体中”按原文较直译地保留；云车句选择“在云车上”修饰“坐着”的读法，同时保留另一读法的脚注。其余译法保持原稿的源语忠实度、现代汉语可读性及神学中立性。
