base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/059/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and going forth and covering this earth: it is the world which his power made when he considered making creation. And when the word went out from before him, the structure of the world stood forth, very small, and it was established according to what was sought for it to become.


    And as for the first black waters that you saw descending upon it from the cloud, this is the first sin, the transgression that the first Adam committed. For when he sinned, death was stirred up, though it was not in its time; and mourning was made known, and sorrows were prepared, and pain was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in a form and took on a likeness, know that the time will be examined, and the law of humanity will be measured, and its strength will be tested. Therefore Adam, while he was one who heard from God something of what was to be, considered the release of the dead that had been given, and what had been commanded him from God. He kept considering, and he devised five thoughts. For he made himself liable; he also made the angels liable. And even at that time when he was created, a vision was shown to him: the fierce beasts, and the elements with fire. Thus God gathered in Eden, in the likeness of those who were created.'
translation:
  language: zh_hans
  text: '你所看见从海中升起、向前而去并遮盖这地的那朵大云，究竟是什么？你要听：那就是上帝打算创造万物时，他的能力所造出的世界。话语从他面前发出时，世界的架构便显立出来，极其微小；它也照着所要成为的样子被安置妥当。


    至于你起初所看见从云上降下的黑水，那就是起初的罪，是最初的亚当最先所犯的过犯。他一犯罪，死亡就被激动起来，尽管死亡的时候尚未到；哀恸显露出来，忧患预备好了，痛苦被造出来，劳苦也全然成形，尊荣也开始降卑。


    至于那以形体显现、取了样式的末日，你要知道：时间将受查验，人类的准则[a]将被衡量，其力量也将受考验。因此，亚当既从上帝那里听见了一些将要发生的事，又明白那已经赐下的死人之释放[b]，以及上帝给他的吩咐，便不断思量，思量了五个念头。他使自己负上罪责，也使众天使负上罪责。甚至在他受造的时候，异象就曾向他显现，其中有凶猛的野兽，也有元素与火。上帝就这样在伊甸园中聚集，以受造者的样式。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人类的尺度”或“人性的法则”。
    reason: ܢܘܡܫܐ 可表达法则、规范或尺度；上下文的“衡量”使几种理解都可能成立。
  - marker: b
    text: “死人之释放”原文含义不确定，也可能指死人所得的解脱；原文未明确使用“复活”一词。
    reason: 保留具有神学意义的词义开放性，避免过度具体化。
  - marker: c
    text: 本句原文十分简略；“聚集”的对象以及“受造者”所指为何，都不明确。
    reason: 正文不补出原文未明说的聚集对象，并保留末句的句法压缩与指涉不确定性。
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: 世界的架构
  rationale: 该词组指世界得以立定、成形的构造；“架构”既保留具体的创造意象，也与随后“极其微小”及被安置妥当的描述相合。
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: 罪……过失
  rationale: 原文使用两个相近而不完全相同的词，强调亚当最初的越界行为；中文保留双重表达，不将两词合并。
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: 死亡就被激动起来
  rationale: 动词表达死亡被唤起、启动，而不只是被人知晓；“被激动起来”保留原文拟人化和因果力度。
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: 尊荣也开始降卑
  rationale: 保留“开始”及向下受抑的动态；此处可指伟大、尊荣或威荣，选“尊荣”较自然且不把所指限定为抽象规模。
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: 人类的准则
  rationale: ܢܘܡܫܐ 可指法则、规范或尺度；上下文同时出现衡量与考验，“准则”兼顾规范性和评估语境，脚注保留另一可能。
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: 死人之释放
  rationale: 该词组含义困难。“释放”贴近原词，却不擅自具体化为“复活”或某种赦免教义。
- source_word: ܡܚܝܒܢܘܗܝ
  choice: 使……负上罪责
  rationale: 该词具有司法性的负罪、负有责任之意；这样译保留亚当自身及天使都被牵涉其中的困难陈述。
- source_word: ܐܣܛܘܟܣܐ
  choice: 元素
  rationale: 这是源自希腊语的借词，在此最自然地指宇宙的基本元素；不扩译为“元素势力”，以免过度解释。
- source_word: ܒܥܕܢ
  choice: 在伊甸园里
  rationale: 此处应读作“在伊甸”，与亚当的语境吻合，不读作“预先”或“在某时”。
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: 凶猛的野兽
  rationale: ܚܝܘܬܐ 在这里是动物、野兽，ܡܪܝܪܬܐ 修饰其凶恶或猛烈；译文避免误作抽象的“苦涩生命”。
theological_decisions:
- issue: 亚当犯罪与死亡开始运作之间的关系
  choice: 保留亚当犯罪激动死亡、并带来哀恸痛苦劳苦的直接因果表达
  alternative: 弱化为死亡仅在此时被人认识，或把这段只当作修辞并列
  rationale: 叙利亚文明确以亚当的犯罪引出死亡被激动及一连串后果；译文保留这种启示文学的神学力度，但不添加后来的教义体系。
- issue: 死亡尚未到其时候
  choice: 译作“尽管死亡的时候尚未到”
  alternative: 将其解释为亚当本人的自然寿限未到，或末世之死尚未来临
  rationale: 原文保留“非其时”的张力，却未明说所指是哪一种时间；中文不替原文消除歧义。
- issue: 死人之释放
  choice: 采用较直译的“死人之释放”并加注说明
  alternative: 译为“死人复活”或“关于死人的赦免”
  rationale: 原词不足以确定某个更具体的教义术语；直译使复活、释放或免除等解释可能继续开放。
- issue: 亚当使天使负上罪责
  choice: 保留众天使也因亚当而负上罪责的困难表述
  alternative: 把天使解释为单纯的见证者，或据推测修改疑难文本
  rationale: 传世叙利亚文确实作此陈述。译文不因神学上的不寻常而将其消解。
- issue: 伊甸园中聚集的对象与受造者的样式
  choice: 以“这些”承接前述异象内容，同时用脚注标明句法和所指不明
  alternative: 明确解释为上帝在亚当身上聚集动物与元素的性质，或解释为上帝召集所有受造物
  rationale: 原文末句高度压缩，聚集的宾语和“那些受造者”的所指均未明说；正文仅作最低限度的语法补足，不把一种推测写成定论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。创造和末世段落保留启示文学的重复、被动式及异象感；对“死亡被激动”“死人之释放”“天使负罪责”等不寻常表达不作教派化顺译。末句仅作最低限度补足，并以脚注公开原文的压缩与歧义。
