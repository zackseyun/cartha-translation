  revised_text: '你所看见从海中升起、向前而去并遮盖这地的那朵大云，究竟是什么？你要听：那就是上帝打算创造万物时，他的能力所造出的世界。话语从他面前发出时，世界的架构便显立出来，极其微小；它也照着所要成为的样子被安置妥当。


