- from: '不过，也请听一句安慰的话[a]。我曾为锡安哀恸，向至高者祈求怜悯，说：“这些事难道要一直留给我们，直到末了吗？这些苦难难道要时时临到我们吗？”大能者便照他丰盛的怜悯行事，按他浩大的恩慈宽赦了我们。他向我启示一句话，使我得以刚强；又赐给我异象，使我不再动摇；他还使我知道各时期的奥秘，把将要来到的世代指给我看。


    所以，我的弟兄们，我写信给你们，是要使你们在许多患难中得到安慰。你们要知道，我们的创造者必向我们所有的仇敌追讨他们对我们所行的一切恶事。至高者所预备的终局已经临近；他的怜悯正在来到，他审判的完成也不遥远。


    如今，我们看见列国作恶时极其亨通，但他们必被算作一滴水。我们看见他们权势强盛，但这权势必被视如唾沫。我们想到他们显赫的荣华；他们却不遵守大能者的诫命，反倒轻蔑这些诫命。我们想到那看得见的华美，尽管它在患难中动摇；他们却必像疼痛的肉体一样被追究。我们所看重的，不过是他们所倚仗的把握，尽管它在我们眼前动摇；但他们必像波浪一样被击碎。我们所寻求的，不过是他们力量所带来的希望；这力量靠着上帝所赐的美物兴旺，但它必被收起，哀哭必追上它。


    [a] 或译：“关于安慰的话”。'
