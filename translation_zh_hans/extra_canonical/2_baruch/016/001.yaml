  yaml_path: translation/extra_canonical/2_baruch/016/001.yaml
  text: And I answered and said, "O Lord, my Lord, the years of this age are few and evil, and who can acquire, in so little time, that which is immeasurable?"
translation:
  language: zh_hans
  text: 我回答说：“主啊，我的主，今世的年日又少又苦；在如此短促的时间内，谁能获得那不可测度的呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不可测度的”也可译作“超越尺度的”；原文没有明确说明它具体指什么。
    reason: 保留原文名词所指的含混性，并提示其与前面短促、有限的时间形成对照。
lexical_decisions:
- source_word: ܫ̈ܢܝܗܝ
  choice: 年日
  rationale: 该词指以年计算的岁月；译作“年日”既保留具体的时间跨度，也符合中文哀叹人生短促的自然表达。
- source_word: ܙܒܘ̈ܢܝ
  choice: 今世
  rationale: 在本书的启示文学语境中，该词不只指某一时刻，也指现今有限、必朽的时代秩序；“今世”能简洁传达这一层含义。
- source_word: ܡܫܟܚ
  choice: 能获得
  rationale: 采用主动表达，保留巴录所问的核心：人在短暂的一生中是否能够取得那超越通常尺度之物。
- source_word: ܡܟܝܠܐ
  choice: 在如此短促的时间内
  rationale: 这里强调所分得时限的短小，与前文“年日又少”相呼应；按现代汉语自然展开其含义。
- source_word: ܡܫܘܚܬܐ
  choice: 那不可测度的
  rationale: 保留“尺度／测量”的词义意象，并维持所指对象未明说的含混性，不擅自解释为某一特定奖赏或境界。
theological_decisions:
- issue: 巴录是在质疑上帝的公义，还是哀叹短暂人生难以达到那不可测度的终局
  choice: 译文呈现人类寿命短促与不可测度之目标之间的张力，不把问题明确改写成对上帝公义的指控。
  alternative: 将此句译成直接质疑上帝要求是否公平。
  rationale: 本节本身以疑问保留张力；邻近上下文则强调结局不取决于寿命长短，而与人的顺服和品格有关。因此不宜在译文中预先替巴录的问题作出神学裁断。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主啊，我的主”保留原文重复呼告；“又少又苦”简洁呈现岁月短促且充满患难的哀叹。
