  yaml_path: translation/extra_canonical/2_baruch/010/003.yaml
  text: But you, remain here in the desolation of Zion, and after these days I will show you what is to happen in the latter times.”
translation:
  language: zh_hans
  text: 但你要留在这里，在锡安的荒凉之地；过了这些日子，我要把末后的日子所要发生的事指示你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܘܡ
  choice: 留在这里
  rationale: 该词基本义为“站立、起来、停留”；结合本节命令巴录留在锡安废墟中的语境，译作“留在这里”最为自然。
- source_word: ܒܚܘܫܒܝܟ ܕܢܗܘܘܢ（所给转录疑有讹误）
  choice: 住在锡安的废墟中
  rationale: 现存行文转录明显受版面或识别误差影响；依据叙利亚文本传统的读法及本章哀悼锡安毁灭的上下文，表达巴录留在锡安废墟之中。
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ
  choice: 这些日子过后
  rationale: 按时间短语直译，保留“这些日子”所指范围未明的特点。
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܓܕܫ
  choice: 将要发生的事
  rationale: 准确表达将来临到或发生之事，不额外限定事件性质。
- source_word: ܒܙܒܢܐ ܝܘܡ̈ܝܐ（转录疑对应“在日子的末后”）
  choice: 末后的日子
  rationale: 采用圣经语体中自然且熟悉的表达，同时保留其末世性和时间上的开放性。
theological_decisions:
- issue: “末后的日子”的范围
  choice: 保留为“末后的日子”
  alternative: 末世／世界终结的时候
  rationale: 原文没有明确界定它仅指世界终结，也可能涵盖未来历史与终末事件；因此不作教义化收窄。
- issue: 神将启示的内容
  choice: “将要发生的事”
  alternative: 将要降下的灾祸
  rationale: 原文表述宽泛，不预先将一切所启示之事定性为灾祸。
translation_notes:
  register: 采用庄重而清晰的现代汉语；“锡安的废墟”和“末后的日子”保留原文的哀歌背景与末世张力，避免以特定宗派术语解释。
