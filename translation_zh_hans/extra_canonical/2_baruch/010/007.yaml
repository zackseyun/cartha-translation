  text: 'But as for us who live, woe to us,

    because we have seen the afflictions of Zion

    and what has happened to Jerusalem.'
translation:
  language: zh_hans
  text: '至于我们这些活着的人，我们有祸了！

    因为我们看见了锡安所受的苦难，

    也看见了耶路撒冷所遭遇的事。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܢ ܕܝܢ ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ
  choice: 至于我们这些活着的人
  rationale: 保留ܕܝܢ的转折、话题转换作用，并自然表达“我们这些活着的人”。
- source_word: ܚܙ ܠܢ
  choice: 我们有祸了
  rationale: 按哀歌语境理解为向仍活着之人发出的悲叹；汉语以“有祸了”保留强烈而庄重的哀叹语气。
- source_word: ܒܩ̈ܠܢܐ ܕܨܗܝܘܢ
  choice: 锡安所受的苦难
  rationale: 该词在此指锡安遭受的患难、屈辱或灾祸；正文采用语义涵盖较广且符合上下文的“苦难”。
- source_word: ܘܡܕܡ ܕܓܕܫܗ ܠܐܘܪܫܠܡ
  choice: 也看见了耶路撒冷所遭遇的事
  rationale: ܓܕܫ表示“发生、临到、遭遇”；不擅自具体化灾难内容，保留原文较概括的表达。
