base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/013.yaml
  text: 'And you, bridegrooms, do not enter;

    and let not the virgins adorn themselves.

    And you, women, do not pray to bear children.'
translation:
  language: zh_hans
  text: '新郎们，不要进去；[a]


    童女们也不要装扮自己。


    妇女们，不要祈求怀孕。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “进去”原文未说明进入何处；按婚嫁语境，可能指进入婚房或开始婚姻生活。
    reason: 保留原文省略所造成的歧义，同时帮助现代读者理解语境。
  - marker: b
    text: 原语所用词具体指怀孕、受孕或怀胎；此处译作“怀孕”，不延伸为生产后的养育。
    reason: 说明译文采用较具体的生育含义，并避免“生儿育女”所带来的语义扩展。
lexical_decisions:
- source_word: ܒܘܪ̈ܟܐ
  choice: 新郎
  rationale: 该词在婚礼语境中指新郎；采用普通现代汉语的明确称呼。
- source_word: ܒܬܘܠܬܝܐ
  choice: 童女
  rationale: 保留原词所强调的未婚、贞洁身份，也与本段婚嫁语境相合。
- source_word: ܢܫܝ̈ܐ
  choice: 妇女
  rationale: 这是泛指成年女性的常用词，译作“妇女”庄重而自然。
- source_word: ܒܛܢܝ̈ܗܝܢ
  choice: 生儿育女
  rationale: 原词涉及怀孕、腹中受孕；在“祈求”这一语境中，用“生儿育女”自然表达求得儿女之意，同时不限定婴儿性别。
theological_decisions:
- issue: 哀歌中的禁令是否是普遍伦理命令
  choice: 保留直接禁令的修辞形式
  alternative: 解释为只在耶路撒冷灾难期间暂停婚育
  rationale: 上下文是为锡安和耶路撒冷遭难而作的哀歌；译文不把修辞性的哀悼命令扩展为普遍教义，也不在正文中加入时限解释。
- issue: “进去”的隐含对象
  choice: 正文保留对象省略
  alternative: 译作“不要进入洞房”
  rationale: 原表达及所给英译未明说进入何处；婚礼或洞房含义虽可能由语境暗示，却不宜无标记地补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体，以“啊”呈现连续呼告。三行保持平行结构；不擅自补出“洞房”，也不把“生儿育女”收窄为“生儿子”。
