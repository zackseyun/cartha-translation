base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/016.yaml
  text: 'Or why should people again have children,

    or why should the seed of their nature again be named,

    when this mother lies desolate

    and her children have gone away into captivity?'
translation:
  language: zh_hans
  text: '或是，生儿育女的人为什么还要抱有希望？

    既然这位母亲已成荒凉，

    她的儿女也被掳去了。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܫܐ ܕܡܘܠܕܝܢ
  choice: 生儿育女的人
  rationale: 直译为“生育的人们”，在现代汉语中用“生儿育女的人”自然表达，并保留泛指。
- source_word: ܡܣܒܪܝܢ
  choice: 抱有希望
  rationale: 该词表达盼望、期待；结合哀歌语境，译为“抱有希望”最为顺畅。
- source_word: ܐܡܐ
  choice: 母亲
  rationale: 保留原文的母亲意象，不在正文中直接解释为锡安或耶路撒冷。
- source_word: ܚܕܝܬܐ
  choice: 已成荒凉
  rationale: 依上下文及英译校勘层理解为母亲陷入荒凉凄惨的状态；避免采用可能由文本或转写讹误造成的“喜乐”字面义。
- source_word: ܐܬܬܒܝܘ
  choice: 被掳去了
  rationale: 该动词表示被俘、被掳；“被掳去了”兼顾被动意义及离散结果。
theological_decisions:
- issue: “母亲”的身份
  choice: 正文只译“这位母亲”
  alternative: 明确译作“锡安母亲”或“耶路撒冷”
  rationale: 本节原文延续拟人化哀歌，但此处没有再次明说其身份；保留指称含蓄性，避免把上下文解释写入正文。
- issue: 生育与盼望之间的关系
  choice: 保留反问语气
  alternative: 改写成禁止生育或断言毫无希望
  rationale: 原文是在灾难与被掳背景下发出的哀叹，并非明确颁布禁令；反问可保留其情感张力而不扩大神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体。原文可见段落主要支持三行内容；未采纳英语咨询层中“他们本性的种子为何还被提名”一句，因为在所提供的叙利亚文对应段落中缺乏清晰可核实的依据。
