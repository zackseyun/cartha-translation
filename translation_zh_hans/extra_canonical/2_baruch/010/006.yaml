  text: '“Blessed is he who was not born,

    or he who was born and died.'
translation:
  language: zh_hans
  text: '“那未曾出生的人有福了，


    或是那出生后死去的人有福了。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܘܒܘܗܝ
  choice: 有福了
  rationale: 这是宣告某人处境可称为有福或幸运的固定表达；“有福了”既贴近原文，也保留哀歌中反常而沉重的语气。
- source_word: ܠܗܘ ܕܠܐ ܐܬܝܠܕ
  choice: 那未曾出生的人
  rationale: 按原文直译，保留“未出生”而非解释为夭折或不存在。
- source_word: ܐܘ
  choice: 那……也……
  rationale: 原词通常意为“或”；汉语诗体中以并列的“那……也……”自然呈现两个可称有福的对象，不把两者改成排他选择。
- source_word: ܠܗܘ ܕܐܬܝܠܕ ܘܡܝܬ
  choice: 那出生后死去的人
  rationale: 忠实保留“出生—死亡”的先后关系，并避免添加死亡时间或方式。
theological_decisions:
- issue: “有福”用于未出生者和已死者所形成的神学张力
  choice: 照原文保留反常的福祉宣告
  alternative: 弱化为“倒不如没有出生”或“更幸运”
  rationale: 本句处于为锡安和耶路撒冷遭难而作的哀歌中，是悲痛中的夸张宣告；译文不应将其改写成系统性的生死教义，也不应消解其张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体。两行对应原文的平行结构；不添加解释性措辞。
