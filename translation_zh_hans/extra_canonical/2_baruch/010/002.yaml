translation:
  language: zh_hans
  text: 我把主所吩咐我的事告诉了我弟兄耶利米；他便同百姓一道前往巴比伦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܡܝܐ
  choice: 耶利米
  rationale: 采用该先知姓名在现代汉语圣经传统中的通行译名。
- source_word: ܥܡܐ
  choice: 百姓
  rationale: 此处指集体性的人民，用“百姓”比泛称“人群”更符合语境。
- source_word: ܫܒܝܬܐ（由本节传统文本及英语审校层所保存的读法）
  choice: 被掳的百姓
  rationale: 源页文字在此处残缺且分行、识读不稳；结合叙利亚文本传统，表达的是被掳群体，而非抽象的“被掳状态”。
- source_word: ܒܒܠ
  choice: 巴比伦
  rationale: 采用现代汉语中这一地名的标准译法。
- source_word: 表示同行、伴随或扶助的动词（源页此处残缺）
  choice: 陪同……前往
  rationale: 保留与被掳百姓同行的核心意义；避免用“护送”增添武装押解或保护的含义，也不以“扶持”过度限定其职分。
theological_decisions:
- issue: 耶利米与被掳百姓同行的性质
  choice: 译作“陪同”，仅陈述同行
  alternative: “扶持”或“护送”被掳的百姓
  rationale: 原文传统可涵盖陪伴、扶助之意，但本节没有明确说明军事护送或特定牧养职分，因此不作神学性扩展。
- issue: 命令的表达方式
  choice: “你要告诉耶利米，叫他……”
  alternative: “我告诉我的弟兄耶利米主所吩咐我的事”
  rationale: 后者来自相邻叙事行，可能属于下一节或命令执行的叙述；本节传统及英语审校层均把本句理解为上帝给巴录的命令，故保持直接引语结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被掳的百姓”既清楚表达历史处境，又保留群体称谓；句式简洁，适合经文朗读。源页在本节附近存在残缺、错行和节界不稳，译文以可辨认的叙利亚语上下文、传统节文及英语审校层交叉控制。
