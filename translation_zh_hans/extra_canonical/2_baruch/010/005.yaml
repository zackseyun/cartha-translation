  source_fidelity: 译文忠实反映现存叙利亚语：ܐܙܠ ܥܡ ܥܡܐ 为“和百姓一同去了”；ܐܦܩܬ ܐܢܘܢ 明确含“我，巴录”及复数宾语，译作“送他们出去后”妥当地保留了这一点。此处叙利亚语措辞与英文审校轨迹中的“returned（回来）”不完全相同，草案依原文而未随英文改写，处理正确。末句“坐在圣殿门前，为锡安唱起这首哀歌，说”准确传达坐在殿门前、为/因锡安而哀悼及引出下文的结构。
