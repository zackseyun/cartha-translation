  text: 'And he went with the people, but I, Baruch, returned and sat before the gates of the temple, and I lifted up this lament over Zion and said:'
translation:
  language: zh_hans
  text: 他便和百姓一同去了；而我巴录送他们出去后，就坐在圣殿门前，为锡安唱起这首哀歌，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܙܠ ܥܡ ܥܡܐ
  choice: 和百姓一同去了
  rationale: 按叙利亚语直译，保留主语由上文确定的衔接方式。
- source_word: ܐܦܩܬ ܐܢܘܢ
  choice: 送他们出去后
  rationale: ܐܦܩ 的基本义为“使出去、领出、送出”；此处带复数宾语，译出英文咨询层遗漏的“他们”。
- source_word: ܝܬܒܬ ܩܕܡ ܬܪ̈ܥܘܗܝ ܕܗܝܟܠܐ
  choice: 坐在圣殿门前
  rationale: 自然表达复数“门扇／门口”；“圣殿”符合宗教建筑语境。
- source_word: ܐܠܝܬ ܐܠܝܬܐ
  choice: 唱起这首哀歌
  rationale: 同根动词与名词构成“哀悼／唱哀歌”的强调表达；中文以“唱起哀歌”自然传达。
- source_word: ܥܠ ܨܗܝܘܢ
  choice: 为锡安
  rationale: 介词可表示“为、因、关于”；哀歌语境中“为锡安”最自然，同时不把关系过度解释为单纯“论到”。
theological_decisions:
- issue: 巴录与百姓分别时的动作
  choice: 保留“送他们出去”
  alternative: 省略，依英文咨询层作“我巴录回来”
  rationale: 现存叙利亚语明确含复数宾语与使役／带出动作；“回来”并非该词的直接意义。
- issue: 哀歌与锡安的关系
  choice: 为锡安唱哀歌
  alternative: 向锡安／论锡安唱哀歌
  rationale: 保留哀悼对象的关系，不将锡安拟人化程度额外强化，也不把文本收窄为纯粹论述。
translation_notes:
  register: 采用庄重而清楚的现代汉语。“他便”承接上文；分号呈现他与巴录行动的对照。专名依通行形式译作“巴录”“锡安”。
