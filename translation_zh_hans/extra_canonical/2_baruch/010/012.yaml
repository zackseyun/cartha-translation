base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/012.yaml
  text: 'And you, sun, hold back the light of your rays;

    and you, moon, extinguish the abundance of your light.

    For why should light rise again,

    where the light of Zion has been darkened?'
translation:
  language: zh_hans
  text: '太阳啊，收敛你明亮的光线；

    月亮啊，熄灭你丰沛的光芒。


    既然锡安的光已经暗淡，

    光为什么还要再次升起呢？'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܫܐ
  choice: 太阳
  rationale: 该词通常指“太阳”；用现代通行名称保留呼告语气。
- source_word: ܐܢܒܝ
  choice: 收住
  rationale: 依上下文及校勘层理解为抑制、收敛光线；“收住”自然地表达停止放射而非永久毁灭。
- source_word: ܙܠܝ̈ܩܝܟ ܕܢܘܗܪܐ
  choice: 你光明的射线
  rationale: 贴近“光的射线”这一属格结构，同时符合现代汉语诗体。
- source_word: ܢܘܗܪܐ
  choice: 光／光辉
  rationale: 按不同搭配分别译作“光”和“光辉”，既保留全节反复出现的光暗意象，也使汉语自然。
- source_word: ܨܗܝܘܢ
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的专名译法，不将其解释性改写为耶路撒冷或圣殿。
theological_decisions:
- issue: “锡安的光”所指为何
  choice: 保留“锡安的光”这一意象
  alternative: 解释为圣殿、耶路撒冷的荣耀或上帝的临在
  rationale: 原文的诗性表达具有多重可能指向；直译可避免把哀歌中的神学意象限定为单一解释。
- issue: 末句的反问及时间意味
  choice: 译为“光为什么还要再次升起呢？”
  alternative: 译为“为何还要有光？”
  rationale: 保留校勘文本所呈现的“再次”及“升起”意味，使宇宙性的哀悼与日月意象相呼应。
translation_notes:
  register: 采用庄重而清晰的现代汉语诗体，以四行平行结构呈现对太阳、月亮的呼告和末尾反问；保留“光”在本节中的关键词复现，不额外加入宗派性解释。
