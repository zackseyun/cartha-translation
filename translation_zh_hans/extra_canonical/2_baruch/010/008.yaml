review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确保留了海中塞壬、莉莉丝、鬼魔、龙以及共同举哀的呼告。然“鬼魔和林中的龙，也要来”将“来”明确加给第三组受呼告者；原文及英文审校轨迹在此转入“醒来、束腰”的命令，宜不补出该动词。末两行中“唱起挽歌”把一般的“发出／承担哀歌”收窄为歌唱，宜改为“同我一同哀号”。“束腰哀悼”也可更清楚表达为哀悼而束腰。
  naturalness: 修订后采用“塞壬”“莉莉丝”“鬼魔”“龙”等简明的诗性呼告，并以“醒来，束上腰带，为哀悼作准备”表达命令，符合现代汉语庄重的哀歌语体。
  terminology: 将特指的 Sirens 译为“塞壬”，并以脚注说明其海中神怪形象，较“海妖”更能保留原词的专名性。保留“莉莉丝”；“鬼魔”和“龙”不作教义化解释。
