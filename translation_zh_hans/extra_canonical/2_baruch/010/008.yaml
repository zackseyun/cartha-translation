base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/008.yaml
  text: 'I will call the Sirens from the sea,

    and you Liliths, come from the desert,

    and you demons and dragons from the forests:

    awake, gird up your loins for mourning,

    and take up lamentation with me,

    and mourn with me.'
translation:
  language: zh_hans
  text: '我要从海中召来塞壬[a]；


    你们这些莉莉丝[b]，要从旷野而来；


    你们这些鬼魔和林中的龙：


    醒来，束上腰带，为哀悼作准备；


    同我一同哀号，


    同我一同哀哭。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塞壬”是希腊语借词“Sirens”的叙利亚语形式，指传说中与海相关的神怪。
    reason: 保留原词的特指文化背景，避免“海妖”被理解为泛称。
  - marker: b
    text: “莉莉丝”是原文的音译，指与旷野相关的夜间神怪；这里不必套用后世关于这一名称的各种传说。
    reason: 保留原名及其荒野关联，同时避免后世民间传统支配经文含义。
lexical_decisions:
- source_word: ܣܝܪ̈ܝܢܘܣ
  choice: 海妖
  rationale: 这是希腊语借词“Sirens”的叙利亚语形式；译作“海妖”既保留海中神怪的意象，也比音译更便于现代普通读者理解。
- source_word: ܠܝ̈ܠܝܬܐ
  choice: 莉莉丝
  rationale: 保留专名式音译，以免把这一荒野中的神怪泛化为普通“夜妖”或导入后世特定传说。
- source_word: ܫܐ̈ܕܐ
  choice: 鬼魔
  rationale: 该词通常指邪灵或魔类存在；“鬼魔”在此哀歌式神怪列举中自然，也不把它过度体系化为某一类教义中的恶魔。
- source_word: ܐܣܗܕܘ ܚܨܝ̈ܟܘܢ（据语境复原）
  choice: 束腰
  rationale: 抄本转录处字形不稳，但语境及传统文本支持“束起你们的腰”；采用简洁的汉语惯用表达“束腰”。
- source_word: ܡܘܡܬܐ
  choice: 哀悼
  rationale: 指为灾难或死亡而举哀，译作“哀悼”符合本段对锡安的挽歌语境。
theological_decisions:
- issue: 海妖、莉莉丝、鬼魔和龙是否被断言为真实存在
  choice: 按诗歌呼告直接保留这些名称
  alternative: 将它们解释性改译为野兽、荒野动物或纯粹象征
  rationale: 原文以哀歌中的宇宙性呼告召集神怪形象；直译保留其文学张力，却不额外裁定其本体地位。
translation_notes:
  register: 采用现代、庄重的挽歌体；以短行保持原文连续呼告和排比节奏。“也要来”补足汉语句法中对前一命令的承接，不增加新的内容。
