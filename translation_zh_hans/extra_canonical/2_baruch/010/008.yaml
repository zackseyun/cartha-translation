    rationale: 此处第三组名称后，文本随即命令它们醒来并束腰；英文审校轨迹没有在该组后重复“come”。汉译不宜把前一组的“来”扩展为明确命令。
  - severity: low
    issue: “唱起挽歌”将哀歌限为歌唱行为。
    rationale: 原文的哀歌／哀号用语并不必然指唱歌；“同我一同哀号”保留较宽的哀悼表达，并与末句“哀哭”形成递进。
  - severity: low
    issue: “海妖”未充分显示此处是特指的塞壬。
    rationale: “海妖”在现代汉语中容易被理解为泛称；采用“塞壬”并加注可保存希腊文化语汇的特定性。
