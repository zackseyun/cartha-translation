    ܗܘ̣ ܕܠܐ ܐܬܚܙܝ ܒܥܒܕܘܗܝ

    ܕܡܕܝܢܬܐ ܘܕܢܝ ܡܕ̈ܢܝܗ

    ܘܒܩ̈ܝ. ܘܐܬܒܥܝ ܘܕܩ̈ܝ

    10 .. ܝܡܝܟ ܐܘ ܡ̈ܢܝ ܆܀܆ ܗܘ̣ܘ

    ܡܢ ܒܝܬ ܝܡܝܟ ܝܘܡ̈ܝ.

    ܗܘ̣ ܒܠܥܕ ܦܘ ܨܒܘܬ

    ܕܐܠܗܐ ܘܐܡ̣ܪ ܠܝ. ܐܡ̣

