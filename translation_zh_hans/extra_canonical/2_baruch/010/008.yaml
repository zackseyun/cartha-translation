  rationale: 修订消除第三组受呼告者后所补的“也要来”，以免超出文本明示内容；将“唱起挽歌”改为不限定发声方式的“哀号”；并以“塞壬”及脚注保留原文的特指名称。其余神怪意象和哀歌体排比均予保留。
  reviewer_model: gpt-5.6-terra
