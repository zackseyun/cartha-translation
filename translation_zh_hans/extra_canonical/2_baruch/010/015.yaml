  text: 'For why should they bear in pain

    and bury in groaning?'
translation:
  language: zh_hans
  text: '她们何必在痛苦中生育，

    又在哀叹中埋葬呢？'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܟܐܒܐ
  choice: 痛苦
  rationale: 该词表示疼痛、苦楚；结合生育语境，以“痛苦”兼顾产痛与更广泛的悲苦。
- source_word: ܡܘܠܕܝܢ
  choice: 生育
  rationale: 该词属于生出、生产的语义范围；现代汉语“生育”自然凝练，并保留母亲生产的语境。
- source_word: （据句义重建的“埋葬”表达）
  choice: 埋葬
  rationale: 现存页图转写在此处有讹损，但英语审校层与上下文均支持“埋葬”；采用直接、庄重的现代汉语。
- source_word: （哀痛/呻吟语义）
  choice: 哀叹
  rationale: 与埋葬相连，表达丧子时的悲声；“哀叹”比单纯“呻吟”更符合丧葬语境。
theological_decisions:
- issue: 灾难哀歌中的反问是否应弱化
  choice: 保留“何必……呢”的强烈反问
  alternative: 译作陈述句：“她们在痛苦中生育，在哀叹中埋葬。”
  rationale: 原句并非一般性教导，而是锡安毁灭背景下的哀歌修辞；保留反问可呈现其悲痛与张力，而不把绝望语言改写为教义断言。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。两行结构对应原句的平行节奏；“她们”承接上下文中的妇女与母亲，不额外补入“孩子”，以免消除原文简约而沉重的表达。
