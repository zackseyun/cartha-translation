  yaml_path: translation/extra_canonical/2_baruch/010/014.yaml
  text: 'Rather, let the barren rejoice,

    and let those who have no children be glad;

    but let those who have children grieve.'
translation:
  language: zh_hans
  text: '倒要让不孕的女子欢喜，

    让没有儿女的人快乐；

    有儿女的却要悲伤。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܩܪܬܐ（“不生育的女子”，据本节校勘所反映的读法）
  choice: 不生育的
  rationale: 保留原文所指不能生育者的具体处境，同时用现代汉语自然表达，不额外限定其原因。
- source_word: “没有儿女的人”（本节对应叙利亚语表述）
  choice: 没有儿女的
  rationale: 与前句形成平行，又不把“没有儿女”与生理不育完全等同。
- source_word: “欢喜／快乐”
  choice: 欢喜／快乐
  rationale: 用近义词再现诗句的同义平行，行文简洁庄重。
- source_word: “悲伤”
  choice: 悲伤
  rationale: 与前两句的欢喜形成强烈反差，保留哀歌语境中的逆转张力。
theological_decisions:
- issue: 无儿女者与有儿女者命运倒置的哀歌张力
  choice: 直译为命令／愿望式的“让……欢喜／快乐；……却要悲伤”
  alternative: 解释为一般性的伦理评价，认为不生育本身更蒙福
  rationale: 上下文是在耶路撒冷遭难、儿女被掳的处境中发出哀叹；译文保留灾难语境中的尖锐反转，不将其扩展为关于生育价值的普遍教义。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体；三行排布保留平行结构。“倒要”承接上下文的反转，“却”突出有儿女者在灾祸中的悲痛。
