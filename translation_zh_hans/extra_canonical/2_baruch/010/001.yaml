theological_decisions:
- issue: “上帝的话”是否改释为“上帝的声音”或直接写成“上帝”
  choice: 保留“上帝的话”
  alternative: 上帝对我说／上帝的声音临到我
  rationale: 原文传统表达强调临到巴录的是“上帝的话”；不将其具体化为声音，也不省略这一具有神学分量的名词短语。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“临到我”保留先知叙事的经文语体，同时普通读者容易理解。
