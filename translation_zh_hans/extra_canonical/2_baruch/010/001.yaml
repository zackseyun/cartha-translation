lexical_decisions:
- source_word: ܡܠܬܐ ܕܐܠܗܐ（据校勘文本及上下文；所给页面转写在此处有讹损）
  choice: 上帝的话
  rationale: 保留闪语先知叙事中“上帝的话临到某人”的固定表达，也与现有英译审校层一致。
- source_word: ܡܢ ܒܬܪ ܫܒܥܐ ܝܘܡ̈ܝܢ（据校勘文本；页面转写有讹损）
  choice: 七天以后
