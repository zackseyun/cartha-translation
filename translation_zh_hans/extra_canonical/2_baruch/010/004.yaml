  text: 我便照着主所吩咐我的，向我弟兄耶利米说了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܡܪܬ
  choice: 我……告诉了
  rationale: 该动词基本义为“说”；结合对人转述所领受命令的语境，译作“告诉”更符合现代汉语，同时保留言说行为。
- source_word: ܠܐܪܡܝܐ ܐܚܝ
  choice: 我的弟兄耶利米
  rationale: 按原文保留亲属称谓“我的弟兄”；不擅自将其弱化为“同胞”或“朋友”。
- source_word: ܡܪܝܐ
  choice: 主
  rationale: 这是叙利亚文圣经传统中对神的常用称呼，译作“主”简洁、庄重，也不额外引入专名形式。
- source_word: ܕܦܩܕܢܝ
  choice: 主吩咐我的话
  rationale: 关系成分可理解为所说内容，即“主所吩咐我的”；用“话”补足自然汉语表达，并以脚注说明另一种句法理解。
theological_decisions:
- issue: ܕܦܩܕܢܝ 的句法关系
  choice: 理解为巴录向耶利米转告“主吩咐我的话”
  alternative: 理解为“我照着主的吩咐，对我的弟兄耶利米说了”
  rationale: 原文关系词可引出言说内容，也可能表达所遵照的命令。正文采用与紧邻动词“说”衔接更直接的内容性理解，脚注保留方式性理解，避免把真实歧义隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“我的弟兄”这一原文称谓。
