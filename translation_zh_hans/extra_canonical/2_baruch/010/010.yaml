base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/010.yaml
  text: 'And you, vine, why do you still give your wine?

    For no offering from you will again be received in Zion,

    and no firstfruits will again be accepted.'
translation:
  language: zh_hans
  text: '葡萄树啊，你为何还出酒呢？


    因为从你而来的供物不再会在锡安蒙悦纳，


    初熟之物也不再蒙悦纳。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܒܐ
  choice: 葡萄树
  rationale: 此处为拟人化呼语；译作“葡萄树”既符合上下文，也能自然承接酒与献祭的意象。
- source_word: ܚܡܪܟܝ（据校勘所反映的读法；所给页面转写此处不清）
  choice: 结出葡萄酿酒
  rationale: 原意指葡萄树继续产出其酒；汉语不说葡萄树“产酒”，因此保留酒的意象，同时明确酒由葡萄酿成。
- source_word: ܩܘܪܒܢܐ / 相应献供用语
  choice: 供物
  rationale: 采用宽泛的祭仪用语，不把原文限定为某一种祭物。
- source_word: ܪܫܝܬܐ / 相应初熟果实用语
  choice: 初熟之物
  rationale: 保留献上最先收成之物的祭仪含义，并避免仅限于某一种农产品。
theological_decisions:
- issue: 锡安圣所被毁后献祭停止的表述
  choice: 按哀歌语境直译为“不再献上”
  alternative: 解释为献祭制度永久终止
  rationale: 经文直接哀叹锡安不再接受供物与初熟之物，并未在本节界定这种停止的最终神学性质，故不作超出原文的教义推论。
translation_notes:
  register: 采用庄重而现代的哀歌体。首句保留对葡萄树的直接呼告；后两行以平行句式再现原文的诗性重复。
