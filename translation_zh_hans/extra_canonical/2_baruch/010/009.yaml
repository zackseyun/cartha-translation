    ܬܪ̈ܥܘܗܝ ܕܗܝܟܠܐ ܘܐܠܝܬ

    ܐܠܝܬܐ ܗܕܐ ܥܠ

    ܨܗܝܘܢ ܘܐܡܪܬ܆ ܛܘܒܘܗܝ

    ܠܗܘ ܕܠܐ ܐܬܝܠܕ܂ ܐܘ

    ܠܗܘ ܕܐܬܝܠܕ ܘܡܝܬ܂

    ܠܢ ܕܝܢ ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ ܚܙ

