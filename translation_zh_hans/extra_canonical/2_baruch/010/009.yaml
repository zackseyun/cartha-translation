    ܗܟܝܠ ܒܚܘܫܒܝܟ ܕܢܗܘܘܢ܂

    ܘܠܐ ܡܚܘܐ ܐܢܐ ܠܟ

    ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ܂

