base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/009.yaml
  text: 'You farmers, do not sow again;

    and you, O earth, why do you still give the fruit of your produce?

    Keep within you the sweetness of your nourishment.'
translation:
  language: zh_hans
  text: '农夫们，不要再播种；


    大地啊，你为什么还要结出你的出产？


    把你养分的甘美留在自己里面吧。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你养分的甘美”也可理解为“你所供养之物的甘美”或“你食物的甘美”。原文兼有滋养与食物的意味。
    reason: 保留原文名词短语在滋养能力与所产食物之间的语义张力。
lexical_decisions:
- source_word: ܐܪܥܐ
  choice: 大地
  rationale: 保留对土地的直接呼告，并采用现代汉语中庄重自然的拟人表达。
- source_word: ܦܐܪ̈ܐ
  choice: 出产
  rationale: 此处指大地所结的成果或果实；“出产”比单指树木果实的“果子”范围更合适。
- source_word: ܚܠܝܡܘܬܐ ܕܡܙܘ̈ܢܝܟܝ
  choice: 你所供养之物的甘美
  rationale: 叙利亚文表述涉及滋养、食物及其美好滋味；译文保留其具体意象，不将其解释性地缩减为“肥力”。
theological_decisions:
- issue: 对受造界停止生育和供养的哀歌式命令
  choice: 按诗歌中的直接呼告和命令翻译
  alternative: 解释为巴录实际宣告永久咒诅大地
  rationale: 上下文是为锡安和耶路撒冷所作的宇宙性哀歌；不额外判定这些话是永久性神学命令。
translation_notes:
  register: 采用现代、庄重的诗体散文；三行结构保留连续呼告与哀歌节奏。“农夫们”用复数称呼，“大地啊”保留拟人化呼语。
