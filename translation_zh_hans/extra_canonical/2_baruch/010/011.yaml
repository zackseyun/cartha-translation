translation:
  language: zh_hans
  text: 诸天哪，要止住你们的甘露，不要开启雨水的宝库。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܝܐ（诸天）
  choice: 诸天哪
  rationale: 保留闪语中“天”的复数形式和直接呼告的语气。
- source_word: 露／甘露
  choice: 你们的甘露
  rationale: “甘露”是现代中文圣经语体中自然且庄重的表达，并保留原句归属于“诸天”的物主关系。
- source_word: 雨的宝库
  choice: 雨水的宝库
  rationale: 保留古代宇宙图景中的“宝库”意象，不将其解释性改写为“云层”或“水源”。
- source_word: 止住／扣留
  choice: 止住
  rationale: 准确表达不让甘露降下，同时比“扣留”更符合现代汉语搭配。
theological_decisions:
- issue: 是否将“雨水的宝库”按现代气象观念解释
  choice: 保留“雨水的宝库”
  alternative: 不要让云层降雨
  rationale: 原文的诗性宇宙图景具有文本和神学意义，翻译不应以现代解释取代它。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留平行句式、呼告语气和古代诗性意象。所给叙利亚文页面在目标句附近有断页及识别混乱，因此以可审计的英语咨询层协助定位和控制措辞。
