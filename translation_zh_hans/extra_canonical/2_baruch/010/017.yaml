translation:
  language: zh_hans
  text: “从今以后，不要再为美丽歌唱，也不要谈论秀美……”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܗܫܐ
  choice: 从今以后
  rationale: 直接表达时间起点，符合现代汉语习惯。
- source_word: ܠܐ ܗܘܝ ܬܙܡܪܘܢ
  choice: 不要再歌唱
  rationale: ܬܙܡܪܘܢ 的通常意义是“你们歌唱”；ܠܐ ܗܘܝ 构成禁止性表达。结合上下文哀歌语气，译作“不要再歌唱”自然且贴近原文。
- source_word: ܫܘܦܪܐ
  choice: 美丽
  rationale: 该词指美、美丽或华美；这里保留抽象名词表达。
- source_word: ܘܠܐ ܬܚܬܘܢ
  choice: 也不要谈论
  rationale: 所给叙利亚文在此处页末中断，字形或文本可能不完整；参考经审校的英文咨询层，以较谨慎的“谈论”呈现第二个并列禁令。
- source_word: loveliness（英文咨询层）
  choice: 秀美
  rationale: 用“秀美”与前面的“美丽”形成近义并列，同时避免生硬重复。
