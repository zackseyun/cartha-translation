  text: Therefore the hours are not counted with the hours, nor the times with the times.
translation:
  language: zh_hans
  text: 因此，时辰不与时辰一同计算，时期也不与时期一同计算。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܢܝܢ
  choice: 计算
  rationale: 该词在此表达“数算、计数”；译作“计算”符合现代汉语，同时保留原文所说不能彼此并计的含义。
- source_word: ܐܘ̈ܩܢܘܐ
  choice: 时辰
  rationale: 按本节上下文及校勘层所辨识的时间单位处理为“时辰”，并保留其在原文中的首位次序。
- source_word: ܙܒܢܐ（语义所指）
  choice: 时期
  rationale: 用“时期”与“时辰”区分，表达较宽泛的时间段而不强行限定具体长度。
theological_decisions:
- issue: 两类时间单位的先后次序
  choice: 先“时辰”，后“时期”
  alternative: 先“时期”，后“时辰”
  rationale: 现有叙利亚文证据及最新校审均支持先列“时辰”、后列“时期”；不为行文对称而倒置。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；重复“时辰不与时辰”“时期不与时期”，以保留原文刻意的平行结构和未加解释的含义张力。
