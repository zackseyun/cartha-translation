  yaml_path: translation/extra_canonical/2_baruch/069/004.yaml
  text: and the ends of the times of the righteous, which were going to be accomplished before him, stand as one fixed remembrance, besides those things that he is going to do at the consummation of the age.
translation:
  language: zh_hans
  text: 义人的诸时期的终局——即那些将在他面前实现的事——都作为一份固定的记念而存立；又在这些事之外，还有他将在这世代的终局所要做的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这世代的终局”也可译作“世界的终局”或“时代的圆满”。
    reason: 叙利亚语相关表达兼有时代结束、世界终局与完成圆满的语义可能。
lexical_decisions:
- source_word: ܫܘܠܡܐ
  choice: 终局／终结
  rationale: 该词可指结束、完成或圆满；按上下文分别译为“终局”和“终结”，既保留末世语境，也不把它窄化为单纯的停止。
- source_word: ܕܘܟܪܢܐ
  choice: 记念
  rationale: 该词表示记忆、记念或记录；“记念”可自然表达这些将来之事在上帝面前已被确定记下的含义。
- source_word: ܩܿܝܡ
  choice: 而立
  rationale: 保留原文“站立、存立”的形象，表达这记念在他面前确定不移。
- source_word: ܥܠܡܐ
  choice: 世代
  rationale: 在“终结”这一末世性搭配中可指现今时代或世界秩序；正文取“世代”，脚注说明另一可能。
theological_decisions:
- issue: 将来的事在上帝面前已作为固定记念而立
  choice: 保留“将要成就”与“已经确定存立”之间的张力
  alternative: 改写为“上帝预先知道将发生的一切”
  rationale: 原文把未来的成就与其在上帝面前确定存立并置；不将其解释性地简化为某一种预知论表述。
- issue: “世代终结”的范围
  choice: 译作“这世代终结”
  alternative: “世界终结”或“时代圆满”
  rationale: 源词可涵盖时代与世界；正文采用自然且具末世意味的表达，并以脚注保留语义幅度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“在他面前”“记念而立”等原文意象，并避免把末世性的含混之处解释得过于确定。
