  verdict: revise
  source_fidelity: 草稿基本传达了义人之时期的终局、这些事在“他面前”将要实现、以及它们作为固定记念而存立的意象。不过“义人各时期的终局，就是那些……”把原文的关系从“终局……将要成就”改成了不够清楚的同位判断，且“此外，还有……”未明确其与末句“他将要做的事”的并列／排除关系。
  naturalness: “义人各时期的终局，就是那些将要在他面前成就的”句法滞涩，现代汉语中“就是那些”也使修饰范围不明。用破折号标示同位说明，并将“而立”改为“存立”，可保留原文形象而更自然。
  terminology: “终局”“记念”“世代”均可保留。“在他面前”应维持原文的指向而不擅自明确为上帝；“世代的终局”比“世代终结时”更贴近原文名词结构。脚注应锚定在“世代的终局”上。
  issues:
  - severity: medium
    issue: 首句的句法与修饰关系不清
    rationale: 原文是“义人的诸时期的终局，亦即那些将在他面前实现的事，作为一份固定的记念而存立”。草稿的“终局，就是那些……的，都作为”在汉语中难以辨明“将要成就”修饰何者。
  - severity: low
    issue: 末句的“此外”未充分呈现原文的关联
    rationale: 末句是与前述已固定存立之事相对的“他将在这世代终局所做的事”。改为“又在……之外”可较明确保留“besides”的关系，而不添加解释。
  revised_text: 义人的诸时期的终局——即那些将在他面前实现的事——都作为一份固定的记念而存立；又在这些事之外，还有他将在这世代的终局所要做的事。[a]
  revised_footnotes:
