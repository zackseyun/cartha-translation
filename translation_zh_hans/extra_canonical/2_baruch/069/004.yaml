revisions:
- from: 义人各时期的终局，就是那些将要在他面前成就的，都作为一个确定的记念而立；此外，还有他将在这世代终结时所要做的事。[a]
  to: 义人的诸时期的终局——即那些将在他面前实现的事——都作为一份固定的记念而存立；又在这些事之外，还有他将在这世代的终局所要做的事。[a]
  rationale: 修订厘清了“义人的诸时期的终局”与“将在他面前实现的事”之间的同位关系，保留“固定的记念而存立”的原文意象，并以“在这些事之外”较准确表达末句的连接关系；不对“他”的所指或末世语义作教义性限定。
