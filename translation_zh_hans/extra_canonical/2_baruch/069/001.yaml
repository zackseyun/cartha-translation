translation:
  language: zh_hans
  text: 1 至于你所看见的最后那些水，它们比先前所有的水都更黑——它们就是……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存叙利亚文在“它们就是”之后中断，缺失的内容无法确定。
    reason: 说明正文省略号反映的是源文残缺，而非单纯的修辞停顿。
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܚܪ̈ܢܐ
  choice: 最后那些水
  rationale: ܐܚܪ̈ܢܐ 可表示“另一些”或序列中的“最后一批”。本段处于异象水序列的收尾阶段，译作“最后那些水”最符合上下文，同时保留“那些水”的复数指称。
- source_word: ܕܐܘܟܡܝܢ ܗܘܘ ܡܢ ܟܠܗܘܢ ܗܢܘܢ ܕܩܕܡܝܗܘܢ
  choice: 比先前所有的水都更黑
  rationale: 保留比较结构“比……更黑”，并明确比较对象是先前出现的水，使中文自然清楚，也延续异象中黑水的意象。
- source_word: ܗܢܘܢ ܗܘ
  choice: 它们就是……
  rationale: 源文在指认句开头处中断。译文保留“就是”的识别语气，不补入现存叙利亚文没有明确提供的解释内容。
theological_decisions:
- issue: 是否补足最后黑水所代表的对象
  choice: 不补足，以省略号标明源文在此中断
  alternative: 补作“它们属于全世界”或其他推定内容
  rationale: 现存所给叙利亚文只到“它们就是”，不足以确定缺失内容。保留中断可避免将推测写入正文，也不预先限定异象的末世含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“至于”引出异象解释，“更黑”保留鲜明的视觉对比；破折号与省略号共同呈现原句转入解释却突然中断的状态。
