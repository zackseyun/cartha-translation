  text: For the evils and the good things that are to be stand before him as one fixed remembrance,
translation:
  language: zh_hans
  text: 因为将要发生的恶事和善事都立在他面前；关于它们的记忆作为一个整体，恒常留存。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句直译近于“它们的一个记忆是固定的／安住的”。原文句法凝缩；“一个”可能强调这些事的记忆合为一个整体。
    reason: 说明原文“一个”与“固定／安住”这一凝缩表达，避免把事件本身误解为记忆。
lexical_decisions:
- source_word: ܒܝ̈ܫܬܐ ... ܘ̈ܛܒܬܐ
  choice: 恶事和善事
  rationale: 两个复数名词在此指将要发生的坏事与好事；译作“恶事和善事”既保留道德色彩，也符合现代汉语。
- source_word: ܕܥܬܝܕܝܢ ܗܘܘ ܕܢܗܘܘܢ
  choice: 将要发生的
  rationale: ܥܬܝܕ 与“成为／发生”的未完成式组合表达预定或即将发生之事；汉语用“将要发生”自然地传达其未来指向。
- source_word: ܩܕܡܘܗܝ ܩܿܝܡܢ
  choice: 立在他面前
  rationale: 按常见句法将“在他面前”连接于“立着”，并保留原文的空间性认识隐喻。
- source_word: ܚܕܐ ܕܘܟܪܢܗܘܢ ܫܪܐ
  choice: 作为一个恒久的记忆
  rationale: 原短语字面近于“它们的一个记忆常存／安住”；此处采用谓语关系更顺畅的汉语表达，同时以脚注保留较直译的可能。
theological_decisions:
- issue: 这些未来事件如何“在他面前”
  choice: 保留“立在他面前”的原文意象，不解释为特定的神学术语
  alternative: 译成“他预先知道一切”
  rationale: 上下文确实涉及那一位对未来的认识，但原文以事件及其记忆“立在他面前”来表达；不应把该意象直接改写为系统神学命题。
- issue: “他”的所指
  choice: 沿用代词“他”
  alternative: 明确译作“上帝”
  rationale: 本节原文使用第三人称代词；虽可由上下文辨明所指，正文仍应保存其指代形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恒久的记忆”保留原文关于未来善恶之事在他面前如同持续现存之记忆的张力；脚注说明凝缩句法的另一种切分。
