revisions:
- from: '……因为时候已经临近，正步步逼来。水罐已临近井边，船已临近港口，旅程已临近城邑，生命也已临近终点。


    所以，你们要领受他的诫命，免得与他丰盛的怜悯隔绝，倒要得享安息，不被定罪。


    因为至高者使这些事成就时，就再没有悔改的余地，没有为诸时期所定的界限，没有诸时节的延展，也不能再转向安息；那时，祈求不能帮助任何人，先祖的斡旋不能，先知的恳求不能，义人的援助不能，妇女的哭泣不能，幼童的可爱不能，婴孩的啼哭不能，新生儿的纯洁不能，他们父辈的义也不能。凡从前被认为、也显明是助力的事，没有一样还能施以援助。


    因为到那时，我们每个人都要独自受审[a]。


    他必为自己的世代保全那些仰望他的人，却要立刻灭绝那些被罪玷污的人。


