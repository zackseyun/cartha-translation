  yaml_path: translation/extra_canonical/2_baruch/085/001.yaml
  text: '… the times are close and already pressing in. The pitcher is near the well, the ship the harbor, the journey the city, and life its completion.


    So then receive his commandments, that you may not be cut off from the greatness of his mercy, but may find rest and not condemnation.


    For when the Most High brings these things to pass, there will no longer be room for repentance, or a boundary for the times, or an extension of the seasons, or a turning toward rest; nor will anyone be helped by prayer, or by the mediation of fathers, or by the petition of prophets, or by the aid of the righteous, or by the weeping of women, or by the tenderness of little children, or by the crying of infants, or by the innocence of newborns, or by the righteousness of their fathers. None of the things once thought and seen to be helpers will be able to help.


    For each of us will then be judged by himself alone.


    And he will preserve for his age those who have hope in him, but he will at once destroy those who are defiled with sins.'
translation:
  language: zh_hans
  text: '……因为时候已经临近，正步步逼来。水罐已临近井边，船已临近港口，行程已临近城邑，生命也已临近终点。


    所以，你们要领受他的诫命，免得与他丰盛的怜悯隔绝，倒要得享安息，不被定罪。


    因为至高者使这些事成就时，就再没有悔改的余地，没有时期的界限，没有时节的延展，也不能再转向安息；那时，无论祈求、先祖的斡旋、先知的恳求、义人的援助、妇女的哭泣、幼童的可爱、婴孩的啼哭、新生儿的纯洁，还是他们父亲的义，都不能帮助任何人。凡从前被认为并显明能帮助人的，没有一样还能施以援助。


    因为到那时，我们每个人都要独自受审[a]。


    他必为他的世代保全那些仰望他的人，却要立刻灭绝那些被罪玷污的人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要独自站立。”
    reason: 正文依叙利亚文动词“受审/被审判”的直接意义翻译；保留英语审校记录中的替代性场景表达。
lexical_decisions:
- source_word: ܦܩ̈ܘܕܘܗܝ
  choice: 他的诫命
  rationale: 保留该词所表达的神圣权威与劝诫语境；“诫命”在现代汉语中庄重、清楚，也不额外限定某一套律法。
- source_word: ܬܐܢܝܚܘܢ
  choice: 得享安息
  rationale: 此处与被定罪相对，既含解脱之意，也保留末世安息的意味。
- source_word: ܒܒܟܝܐ ܕܢܫ̈ܐ
  choice: 妇女的哭泣
  rationale: 按叙利亚文直译，保留整段逐项累加的哀求修辞。
- source_word: ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ
  choice: 幼童的可爱
  rationale: 原词可指美好、可爱或温柔；此处描写幼童足以动人怜爱的特质，“可爱”较自然且不把含义过度神学化。
- source_word: ܒܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
  choice: 新生儿的纯洁
  rationale: “纯洁”直接保留原词洁净、纯净的语义，并适合此处作为不能代人求情的品质。
- source_word: ܐܬܪܐ ܠܬܝܒܘܬܐ（据校勘恢复；页面识读作ܐܪܙܐ）
  choice: 悔改的余地
  rationale: 页面文本显然受识读或传抄问题影响；依据上下文与控制文本，采用“悔改的余地”，符合最终审判临到后不再有机会的语境。
- source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
  choice: 被罪玷污
  rationale: 原表达字面可能带有被罪分割或陷于诸罪的意味；“被罪玷污”自然传达其道德状态，同时避免把较难确定的字面意象强行写入正文。
- source_word: ܡܬܬܕܝܢ
  choice: 受审
  rationale: 采用该动词“被审判”的直接含义，不以仅属语境推论的“站立”代替正文。
theological_decisions:
- issue: 是否把最后审判时一切代求均告无效的长串列举压缩成概括句
  choice: 逐项保留祈求、先祖、先知、义人、妇女、儿童和父辈之义等内容
  alternative: 概括为“那时任何代求都不能帮助人”
  rationale: 叙利亚文的力量来自累积式列举；逐项保留可呈现最终审判与个人责任的严肃性，而不另加宗派性解释。
- issue: 如何表达最后的保全对象
  choice: 那些仰望他的人
  alternative: 那些在他里面有盼望的人；那些他看为配得的人
  rationale: 原文指向以他为盼望的人。“仰望他”是自然的现代汉语，并保持关系对象明确，不引入“配得”等原文未明说的条件。
- issue: 如何处理个人独自受审与“独自站立”的可能表达
  choice: 正文译为“独自受审”，脚注保留“独自站立”
  alternative: 正文译为“独自站立”
  rationale: 校勘所据动词直接表示受审，故正文采用“受审”；同时以脚注保留传统或语境性表达，呈现文本解释史中的可能措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“水罐—井、船—港口、旅程—城邑、生命—终点”的四重比喻及长篇排比，不以解释性神学术语取代原文张力。所有代词维持原文所容许的指向，不擅自加入专名。
