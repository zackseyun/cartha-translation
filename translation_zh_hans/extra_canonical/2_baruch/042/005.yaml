    ܐܢܐ. ܘܐܒܥܐ ܡܢܟܝ

    ܐܠܐ ܐܢܬܝ ܕܪܝ ܐܢܐ.

    ܡܛܠ ܕܗܘ ܚܙܐ ܐܢܐ

