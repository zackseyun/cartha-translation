    ܝܠܕܐ ܡܬܝܠܕ ܗܘܝ

    ܐܬܕܝܠܚ. ܀ ܝ ܀ ܘܥܒܕܬ

    ܘܐܡܪ ܠܝ. ܐܦ ܗܠܝܢ

