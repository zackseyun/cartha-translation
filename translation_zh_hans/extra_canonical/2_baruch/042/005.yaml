  yaml_path: translation/extra_canonical/2_baruch/042/005.yaml
  text: But those who formerly did not know life, and afterward came to know it, and mingled with the seed of the people which has separated itself—their former time is also reckoned as nothing.”
translation:
  language: zh_hans
  text: 但那些从前不认识生命，后来却认识了生命，又与那自我分别出来之民的后裔相混合的人，他们先前的那段时日也算为无有。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܐ（由本节校勘文本及英译所反映的“life”）
  choice: 生命
  rationale: 保留原文宽泛的生命概念，不擅自限定为永生、救恩或某种宗派性的属灵生命。
- source_word: ܙܪܥܐ / 对应“seed”
  choice: 后裔
  rationale: 此处指群体延续的人群；“后裔”比直译“种子”更符合现代汉语，同时保留族群性含义。
- source_word: ܐܬܦܪܫܘ / 对应“has separated itself”
  choice: 自我分别
  rationale: 保留中间或反身意味，避免改写成明确由上帝拣选或由外力隔离。
- source_word: ܐܬܚܫܒ / 对应“is reckoned”
  choice: 算为
  rationale: 保留计算、认定的被动语义及其审判性语气，不强化为“赦免”或“抹除”。
- source_word: ܠܐ ܡܕܡ / 对应“nothing”
  choice: 无有
  rationale: 用庄重而易懂的表达呈现“不算什么／视为不存在”的语义力度。
theological_decisions:
- issue: “认识生命”的具体神学含义
  choice: 保留为“认识生命”
  alternative: 译作“认识永生”或“获得救恩”
  rationale: 上下文并未在本节明确限定“生命”的性质，故不替原文消除其神学张力。
- issue: “分别”之民的施动者
  choice: 译作“自我分别之民”
  alternative: 译作“被分别出来的子民”
  rationale: 依据所给英译审校层所保留的反身含义，不将分别明确归因于上帝或其他外在主体。
- issue: 先前时日“算为无有”的效果
  choice: 仅陈述其被算为无有
  alternative: 解释为罪得赦免、旧生命被彻底消除
  rationale: 原句使用核算或认定式语言；不额外界定其救赎论机制。
translation_notes:
  register: 采用现代、庄重且可朗读的书面普通话。“融为一体”表达“混合／联合于”群体的意思，避免“混杂”可能带出的贬义；句法保留原文先描述人群、后作判定的结构。
