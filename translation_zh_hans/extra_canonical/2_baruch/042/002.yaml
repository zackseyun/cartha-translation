base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042/002.yaml
  text: And as for what you said, ‘For whom and for how many will these things be?’ — for those who have believed, there will be the good things spoken beforehand; but for those who despise them, the opposite of these things.
translation:
  language: zh_hans
  text: 至于你所说的：“这些事是为谁、为多少人而有的？”——那些盼望先前所说美福的人[a]，必得这些美福；至于轻看这些事的人，所得的则与此相反。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盼望”也可译作“指望”或“相信”；原词在此含有信赖并期待的意思。
    reason: 保留该叙利亚语词可涵盖盼望、指望与相信的语义范围，同时正文按本句与“先前所说美福”的直接搭配译出。
lexical_decisions:
- source_word: ܡܣܒܪܝܢ
  choice: 信的人
  rationale: 该词在此可表达相信、指望或盼望；正文采用简洁自然的“信”，同时以脚注保留“盼望”的可能含义。
- source_word: ܛܒ̈ܬܐ
  choice: 美福
  rationale: 复数词指所应许的诸般好处或福分；“美福”既保留复数性的整体观念，也符合庄重的经文语体。
- source_word: ܕܡܩܕܡܐ ܐܡܝܪܢ
  choice: 先前所说的
  rationale: 按字面呈现“预先/先前已经说过”的意思，不额外指定说话者或将其强化为特定形式的预言。
theological_decisions:
- issue: 相信或盼望的语义范围
  choice: 正文作“信的人”，脚注说明亦可译“盼望的人”
  alternative: 直接译作“盼望的人”
  rationale: 叙利亚语动词兼有相信、指望和盼望的语义；采用正文与脚注并置的方式，避免把信与盼望之间的张力强行消解。
- issue: 轻看者所得的反面
  choice: 译为“所得的则与此相反”
  alternative: 明确补成“必得灾祸”或“必受惩罚”
  rationale: 原文只说与上述美福相反，并未具体界定其内容，因此不作神学性扩充。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为谁、为多少人而有的”保留原问句的双重追问；后半句用“所得的”补足汉语表达，但不增加原文未说明的具体赏罚内容。
