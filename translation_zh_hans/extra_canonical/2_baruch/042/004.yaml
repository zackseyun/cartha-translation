revisions:
- from: 那些先前受辖制，后来却离开，并与混杂各族的后裔混在一起的人——他们先前的那段时期算不得什么。
  to: 那些先前受辖制、后来退出并与混杂民族的后裔混在一起的人——他们先前的那段时期算不得什么。
  rationale: 修订仅澄清“混杂民族的后裔”的修饰关系，并以“退出”更贴切表达“withdraw”；不改变人物身份、退出对象、交杂的具体性质或“先前时期”被否定计算的解释范围。
