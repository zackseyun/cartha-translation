  text: Those who were formerly under subjection and afterward withdrew and mingled themselves with the seed of the mixed peoples—their former time is reckoned as nothing.
translation:
  language: zh_hans
  text: 那些先前受辖制、后来退出并与混杂民族的后裔混在一起的人——他们先前的那段时期算不得什么。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܥܒܕܘ
  choice: 受辖制
  rationale: 该被动形式在此表示处于从属或受支配的状态；“受辖制”既保留被动意味，也避免擅自限定为政治奴役。
- source_word: ܐܬܢܣܒܘ
  choice: 离开
  rationale: 结合本段对离弃盟约者的论述及校审层的理解，译作“离开”；不补明他们离开的具体对象，以保留原文在本句中的省略。
- source_word: ܒܡܘ̈ܬܐ
  choice: 混杂各族
  rationale: 按上下文所指的混合族群处理，以“各族”表达群体复数，并保留“混杂”的负载而不将其具体化为某一民族。
- source_word: ܐܬܚܫܒܘ
  choice: 算不得什么
  rationale: 采用评价性的核算表达，传达其先前时期不被计为有效或有分量，同时不进一步解释其神学后果。
theological_decisions:
- issue: 先前受辖制的时期是否因后来离开而完全失去效力
  choice: 他们先前的那段时期算不得什么
  alternative: 他们先前的那段时期不被算在内
  rationale: 保留原句对“先前时期”的否定性评判，不擅自说明这是功德、盟约身份、救恩资格或最终审判上的失效。
translation_notes:
  register: 采用庄重而通顺的现代汉语。“却”凸显前后转折；破折号清楚划分人物描述与结论。保留“受辖制”“离开”及“算不得什么”的概括性，不替原文补出未明说的对象或教义解释。
