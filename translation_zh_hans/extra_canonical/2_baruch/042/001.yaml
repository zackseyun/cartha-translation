  text: And he answered and said to me, “These things also I will show you.
translation:
  language: zh_hans
  text: 他回答我说：“这些事，我也要指示你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܐ ܘܐܡܪ ܠܝ
  choice: 他回答我说
  rationale: 按叙事中的常见叙利亚语表达处理；页面转录似有字符识别讹误，但英语审校层与上下文均支持“回答我说”。
- source_word: ܐܦ ܗܠܝܢ
  choice: 这些事……也
  rationale: ܐܦ 表示“也、还”，ܗܠܝܢ 指“这些事”；中文将“也”置于谓语前，更自然地保留附加语气。
- source_word: ܐܚܘܝܟ
  choice: 我要指示你
  rationale: 采用“指示”表达启示、使人看见或明白之意，既符合异象语境，也避免扩写为解释性的神学措辞。
theological_decisions:
- issue: “指示”的内容与方式
  choice: 保留概括性的“这些事”和启示性的“指示”
  alternative: 具体化为“让我把这些奥秘显明给你”
  rationale: 原文简洁，并未在本节界定这些事的具体范围，也没有明说“奥秘”；因此不作神学性扩展。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“他回答我说”保留古代启示文学的叙事节奏；“这些事，我也要指示你”通过停顿突出所指内容，同时不消解原文的概括性。
