translation:
  language: zh_hans
  text: 至于你所说的那些前来的人和离去的人[a]，答复如下：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处叙利亚文传本的分句及个别词语所指较难确定；按字面也可理解为“那些被分别（或离去）的人”和“那些被取去的人”。正文依英语审校轨迹所呈现的对举，译为“前来的人和离去的人”。
    reason: 说明底本文本困难，并保留可能的字面理解；正文则以中性的行动对举表达，不预断两类人的身份。
lexical_decisions:
- source_word: ܘܕܐܡܪܬ ܥܠ
  choice: 至于你所说……
  rationale: 以自然的现代汉语再现转题结构，同时保留对先前话语的直接承接。
- source_word: ܐܝܠܝܢ ܕܐܬܦܪܫܘ
  choice: 退去的人
  rationale: 该词通常含分开、离去之意；依本节平行结构译作“退去”，不进一步判定其道德或神学身份。
- source_word: ܐܝܠܝܢ ܕܐܬܢܣܒܘ
  choice: 亲近的人
  rationale: 此处底本读法及分句关系存在文本困难；依据经审校的英语咨询层所保存的对举关系译作“亲近的人”。
- source_word: ܡܠܠ
  choice: 话是这样
  rationale: 保留引出下文的“话/言语”公式，用现代汉语表达为“话是这样”。
theological_decisions:
- issue: “亲近”与“退去”所指群体的身份
  choice: 不补明这些人是义人、恶人、生者或死者
  alternative: 按上下文明确指定为某一神学群体
  rationale: 原句仅以动作区分两类人；补定身份会消除原文保留的含混与张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“话是这样”承接下文，保留古代启示文学的宣告语气；不使用宗派术语。
