  text: For your deeds are to this city like a firm pillar, and your prayer is like a strong wall.”
translation:
  language: zh_hans
  text: 因为你的作为对于这城，如同坚固的柱子；你的祷告如同坚固的城墙。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒ̈ܕܝܟ（据上下文复原）
  choice: 你所行的
  rationale: 以自然的现代汉语表达“你的行为／作为”，并保留其概括性的伦理含义。
- source_word: ܥܡܘܕܐ（正文讹读作近似 ܥܡܗܕܐ）
  choice: 柱石
  rationale: 原文意象是支撑建筑的柱子；“柱石”庄重自然，并能体现其对城的支撑作用。
- source_word: ܨܠܘܬܟ（据上下文及校勘传统复原）
  choice: 你的祷告
  rationale: 采用单数，与叙利亚语所有格形式及两个平行分句相称，不扩展为复数“祷告们”。
- source_word: ܫܘܪܐ
  choice: 城墙
  rationale: 在城市语境中译为“城墙”比泛称“墙”更准确，也保留保护城市的意象。
theological_decisions:
- issue: 行为和祷告对城市所起作用的比喻
  choice: 保留“柱石”和“城墙”两个直接比喻
  alternative: 解释为“你的义行和代祷保护了这城”
  rationale: 原文使用建筑意象，却没有明确阐释其作用机制；直译可保留行为、祷告与城市安危之间的神学张力，避免加入因果性教义说明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你所行的”比“你的功德”更中性，不引入特定功德观；两处“坚固的”形成清晰平行。保留句末引号，以衔接上文主所说的话。
