lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܕܡ̇ܝܢ ܠܟܘܢ
  choice: 所有像你们一样的人
  rationale: 保留原文具体的人际比较；ܠܟܘܢ为复数，因此译作“像你们一样”，指与巴录、耶利米同类的人。
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ
  choice: 你们要离开
  rationale: 这是叙利亚语惯用表达，字面涉及“从……顾看自己”，在本句中表示从该城退出、离开；“离开”在现代汉语中自然明确，同时不额外说明离城的方式。
- source_word: ܡܟܝܠ ܕܝܢ
  choice: 不过现在
  rationale: 兼顾ܕܝܢ的转折语气与ܡܟܝܠ在此处的时间推进意味，使开头自然而庄重。
