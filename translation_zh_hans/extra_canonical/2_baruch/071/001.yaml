  text: And the holy land shall have mercy on its own, and at that time it shall protect its inhabitants.
translation:
  language: zh_hans
  text: 圣地必怜悯属它的人；到那时，它必保护住在其中的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存所提供的叙利亚文页面节录实际涵盖前面数章，未载本节文字；本节据叙利亚文传统中归于七十一章一节的读法译出。另一曾列作本节的长段落，内容属于前文，不采入正文。
    reason: 说明所给底本页面与节号错位，并防止把前文误作本节；这是影响正文鉴别的重要文本资料。
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: 圣地
  rationale: 保留土地作为行动主体的末世性拟人表达，也自然承载其神圣、分别为圣的含义。
- source_word: ܬܪܚܡ
  choice: 必怜悯
  rationale: 表达主动施予怜恤，而不只是感到同情；“必”也符合预言语气。
- source_word: ܕܝܠܗ̇
  choice: 属它的人
  rationale: 保留“属于这地”的简洁关系表达，不擅自将其限定为某一特定群体。
- source_word: ܬܢܛܪ
  choice: 必保护
  rationale: 体现看守、护卫和保全的语义，在现代汉语中清楚而庄重。
- source_word: ܥܡܘܪ̈ܝܗ̇
  choice: 住在其中的人
  rationale: 自然表达“它的居民”，并避免连续使用两个拟人性的所有格造成生硬。
theological_decisions:
- issue: 是否保留圣地作为施怜悯和保护的行动主体
  choice: 保留拟人表达：“圣地必怜悯……它必保护……”
  alternative: 改写为上帝怜悯并保护圣地的居民
  rationale: 现有叙利亚文传统证据及校订记录支持土地拟人化；改为上帝直接行动会增添原句没有明说的主语，消解其启示文学张力。
- issue: “属它的人”的范围
  choice: 保持概括，不明确解释为以色列、义人或所有居民
  alternative: 译作“它的百姓”或“其中的义人”
  rationale: 所属关系本身没有明确限定群体身份，应保留其开放性；后半句才明确说住在其中的人。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣地”及代词“它”维持原文拟人手法；用分号连接两个紧密相关的预言分句。
