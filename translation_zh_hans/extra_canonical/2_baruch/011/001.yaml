  yaml_path: translation/extra_canonical/2_baruch/011/001.yaml
  text: 'Then I, Baruch, said: “And I said to you, O Babylon: ‘If you had prospered, and Zion had dwelt in her glory, our grief would still have been great that you had been made equal to Zion. But now, behold, the grief is infinite and the lamentation beyond measure, because Babylon has prospered and Zion lies desolate. For who can judge concerning these things, or to whom shall we complain about what has come upon us? O Lord, how have you endured it? Our fathers went to rest without grief, and behold, the righteous sleep quietly in the earth, because they did not know this distress, nor had they heard what has happened to us. Would that you had ears, O earth, and that you had a heart, O dust, so that you might go and announce in Sheol and say to the dead, ‘Blessed are you more than we who live.’”'
translation:
  language: zh_hans
  text: 11:1 那时，我巴录说：“我又对你说，巴比伦啊：[a]‘假使你兴盛，而锡安仍住在她的荣耀中，我们本会因你竟与锡安被相提并论而深感悲痛。可是如今，看哪，悲痛无穷，哀号难以量度；因为巴比伦兴盛，锡安却荒凉了。谁能判断这些事呢？临到我们的一切，我们又能向谁申诉呢？主啊，你怎能忍受这一切？我们的列祖毫无悲痛地安息；看哪，义人安静地睡在地里，因为他们不知道这场苦难，也没有听见临到我们的事。大地啊，但愿你有耳朵；尘土啊，但愿你有一颗心，好让你前往阴间，向死人宣告说：你们比我们这些活着的人有福。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本章开头的叙利亚文传本及版面衔接较为艰涩；这里按上下文理解为巴录继续直接对巴比伦说话。
    reason: 说明章首文本状况及受词判定，同时避免把传本不确定处伪装成毫无疑问。
lexical_decisions:
- source_word: ܒܪܘܟ
  choice: 巴录
  rationale: 采用现代中文中对本书人物 Baruch 的通行译名。
- source_word: ܒܒܠ
  choice: 巴比伦
  rationale: 保留对帝国之城的直接称呼，并维持它与锡安的鲜明对照。
- source_word: ܨܗܝܘܢ
  choice: 锡安
  rationale: 采用现代中文圣经传统中的通行地名，同时保留城市人格化的表达。
- source_word: prosperity concept in the Babylon address
  choice: 兴盛
  rationale: 既表达巴比伦的昌盛，也不额外加入安逸、邪恶等原文未明确表达的评价。
- source_word: desolation language for Zion
  choice: 一片荒凉
  rationale: 用自然而庄重的现代汉语保留锡安遭毁后的荒废景象。
- source_word: divine bearing/enduring verb
  choice: 忍受
  rationale: 保留哀歌中对上主何以容忍此事的惊问，不强化为对上主的直接控告。
- source_word: ܫܝܘܠ
  choice: 阴间
  rationale: 以中文读者熟悉的古代死人境域用语表达 Sheol，避免译成带有刑罚意味的“地狱”。
theological_decisions:
- issue: 巴录向上主发出的哀诉
  choice: “主啊，你怎能忍受这一切？”
  alternative: “主啊，你怎能容许这一切？”
  rationale: “忍受”较贴近承受、容忍的语义，也保留祷告中惊愕与信仰张力，不把句子解释成关于神许可之教义的断言。
- issue: 死人所在之境 ܫܝܘܠ
  choice: 阴间
  alternative: 坟墓；冥府
  rationale: “阴间”可保留第二圣殿时期犹太文本中的古代宇宙观，又不导入后来关于最终刑罚的系统化教义。
- issue: 死亡的安息意象
  choice: “列祖安然长眠……义人静静地睡在尘土中”
  alternative: “列祖归于安息……义人安静地躺在地里”
  rationale: 保留原文成对出现的安息、睡眠隐喻，不把死亡表达改写成纯粹生理或教义性的说法。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体。保留“巴比伦啊”“大地啊”“尘土啊”等直接呼语和连续反问，以呈现原文的修辞力度；句式适度分节，但不消除锡安与巴比伦并置所产生的神学张力。
