base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/008/001.yaml
  text: And I saw that he went into the Holy of Holies, and took from there the veils, the ephod, the altar, the mercy seat, the two tables, the holy garments of the priests, the censer, the forty-eight precious stones, and all the holy vessels of the tabernacle. And he said to the earth with a loud voice, "Earth, earth, earth, hear the word of the mighty God, and receive what I commit to you, and guard them until the last times, so that, when you are commanded, you may restore them, so that strangers may not boast over them. For the time has drawn near when Jerusalem also will be delivered up for a time, until it is said that it will be restored again forever."
translation:
  language: zh_hans
  text: 1 我看见他进入至圣所，从那里取出帷幔、以弗得、祭坛、施恩座[a]、两块法版[b]、祭司的圣衣、香炉[c]、四十八颗宝石，以及会幕中一切神圣的器皿。他向大地高声说：“大地啊，大地啊，大地啊，要听大能上帝的话！收下我交托给你的这些物件，保守它们直到末后的时期；到了你奉命之时，就将它们交还，免得外族人因它们夸耀。因为时候近了，耶路撒冷也将暂时被交出去，直到有话宣告它要重新建立，永远长存。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施恩座”也可按字面理解为“遮盖物”，指约柜上面的盖。
    reason: 该词所指大致明确，但中文传统术语带有解释性，脚注保留其具体器物含义。
  - marker: b
    text: 原文此处的读法不稳定；按圣所器物清单的传统理解，指两块约版。
    reason: 现存叙利亚文页面及其识读存在文本不确定性，不宜在正文中假装毫无歧义。
  - marker: c
    text: 或指另一种焚香用的圣所器具；原词所指的具体形制不确定。
    reason: 该器物名称在此文本见证中难以完全确定，需保留词义范围。
lexical_decisions:
- source_word: ܒܝܬ ܩܘܕܫܐ ܩܘܕܫܐ
  choice: 至圣所
  rationale: 这是叙利亚语表达最高级的圣所称谓；“至圣所”是现代中文中准确、自然且具有礼仪语境的对应语。
- source_word: ܦܪ̈ܘܟܬܐ
  choice: 帷幔
  rationale: 该复数名词指圣所中的帘幕；“帷幔”既保留复数整体含义，也符合圣所陈设的庄重语域。
- source_word: ܚܘܣܝܐ
  choice: 施恩座
  rationale: 此词在圣所器物清单中很可能指约柜上面的遮盖物；采用通行的礼仪称谓，同时用脚注保留字面理解。
- source_word: ܘܬܪ̈ܬܝܢ ܟܘܪ̈ܣܘ
  choice: 两块法版
  rationale: 现存页面读法不稳定，但传统清单与语境强烈指向两块约版；“法版”比直译“两张桌子”更符合所指，脚注说明文本问题。
- source_word: ܦܝܪܡܐ
  choice: 香炉
  rationale: 该器物名称在当前见证中有一定不确定性；“香炉”符合既有词义分析与圣所器物语境，但以脚注标明也可能指焚香器具的另一种形制。
- source_word: ܐܪܥܐ ܐܪܥܐ ܐܪܥܐ
  choice: 大地啊，大地啊，大地啊
  rationale: 保留三重呼语的庄严和修辞力度；此处大地被命令收存圣物，故“大地”比“土地”更贴切。
- source_word: ܢܘܟܪ̈ܝܐ
  choice: 外族人
  rationale: 该词指外来者或异族人；“外族人”保留族群和敌对语境，又不额外加入道德判断。
- source_word: ܐܫܬܠܡ
  choice: 被交出去
  rationale: 保留动词“交付、交出”的被动含义，呈现耶路撒冷落入他者手中的情形，而不把它收窄为单纯军事陷落。
theological_decisions:
- issue: 大地收存圣所器物
  choice: 将大地呈现为奉命接收、保守并在指定时候交还圣物
  alternative: 将此处弱化为普通掩埋或遗失
  rationale: 段落明确使用命令和交托语言，强调圣物在审判期间仍受安排和保守。
- issue: 耶路撒冷被交付的期限
  choice: 译作“暂时被交出去”，并保留日后永久重建的宣告
  alternative: 将被交付解释为最终弃绝，或把重建具体化为某一既定末世体系
  rationale: 原文同时保持暂时受审与最终复兴的张力，不应以教派性框架消解。
- issue: “大能上帝”的称谓
  choice: 采用“大能上帝”
  alternative: 全能上帝
  rationale: “大能”忠实传达能力与威势，而“全能”可能加入更专门的神学术语色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。器物名称尽量沿用读者熟悉的圣所术语，同时以脚注标示叙利亚文本中真实存在的词汇或抄本文本不确定性。保留“大地”三次呼告及命令句的仪式性力度，并避免把耶路撒冷的暂时交付与永久复兴纳入特定宗派的末世解释。
