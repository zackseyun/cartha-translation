  text: '"Pull down its walls and overturn them to their foundations, lest the enemies boast and say, ''We ourselves have pulled down the wall of Zion, and we have burned the dwelling place of the mighty God.''"'
translation:
  language: zh_hans
  text: “拆毁它的城墙，连根基也推倒，免得仇敌夸口说：‘是我们拆毁了锡安的城墙，烧毁了大能上帝的居所。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܪ̈ܝܗ
  choice: 它的城墙
  rationale: 该词指城的墙垣；在汉语中用集合意义的“城墙”自然表达，不强行突出单复数。
- source_word: ܥܘܪ̈ܩܘ
  choice: 连根基也推倒
  rationale: 结合下文所指的根基，译出彻底拆毁、倾覆至根基的意思，同时保持自然汉语。
- source_word: ܢܫܬܒܗܪܘܢ
  choice: 夸口
  rationale: 准确表达敌人因自以为立功而自夸的语义。
- source_word: ܕܘܟܬܐ
  choice: 居所
  rationale: 原义为地方、所在之处；在此指上帝的圣所，用“居所”既符合语境，又不额外限定为某种建筑术语。
- source_word: ܐܠܗܐ ܚܝܒܬܐ
  choice: 大能上帝
  rationale: 保留对上帝能力与威势的称述，采用现代中文圣经语体中清楚庄重的表达。
theological_decisions:
- issue: 上帝居所的称谓
  choice: 大能上帝的居所
  alternative: 大能上帝的圣殿
  rationale: 原文使用一般性的“地方／居所”，没有在本短语中直接使用“圣殿”一词；译作“居所”可避免把语义过度具体化。
- issue: 敌人毁城与上帝主权之间的张力
  choice: 保留“免得仇敌夸口说”的目的表达
  alternative: 解释为上帝不许仇敌夺取毁城之功
  rationale: 原文只陈述防止敌人夸口，不进一步解释其神学含义，因此正文不作扩展。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话；严格限于第2节内容，不纳入相邻经节。引语层次以中文单双引号区分。
