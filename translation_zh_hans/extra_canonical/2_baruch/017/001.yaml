revisions:
- from: 主回答我说[a]：“在至高者那里，年岁多寡并不算数。亚当活了九百三十年，却违背了给他的命令，这对他有什么益处呢？所以，他活了那么长久，并没有使他得益，反而带来了死亡，也使从他而生之人的年岁缩短了。摩西只活了一百二十年，又有什么欠缺呢？因为他顺服那位塑造他的，就把律法带到雅各的后裔那里，为以色列民点亮了一盏灯。”
