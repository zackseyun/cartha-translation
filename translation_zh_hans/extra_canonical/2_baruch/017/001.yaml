base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/017/001.yaml
  text: And the Lord answered and said to me, “With the Most High there is no reckoning of many years or few years. For what did it profit Adam that he lived nine hundred and thirty years, yet transgressed what had been commanded him? So the multitude of time that he lived did not benefit him, but brought death and cut short the years of those born from him. And what did Moses lack because he lived only one hundred and twenty years? Because he was subject to the one who formed him, he brought the law near to the offspring of Jacob and kindled a lamp for the people of Israel.”
translation:
  language: zh_hans
  text: 主回答我，对我说[a]：“在至高者那里，并不按年岁多少来衡量。亚当活了九百三十年，却违背了所吩咐他的命令，这对他有什么益处呢？所以，他所活的漫长岁月并没有使他得益，反而带来了死亡，也使他所生后代的年岁缩短了。摩西只活了一百二十年，又有什么欠缺呢？因为他顺服那位塑造他的，就把律法带给雅各的后裔，并为以色列民点亮了一盏灯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主对我说”。
    reason: 正文保留叙事衔接词“回答”；附注记录较简略、弱化该词的译法。
lexical_decisions:
- source_word: ܡܢܝܗܝ
  choice: 算数
  rationale: 这里以年岁多寡作对比；“算数”既保留计算、衡量的意味，也能自然表达寿命长短在至高者面前并非决定性价值。
- source_word: ܙܒܘ̈ܢܝ / ܫ̈ܢܝܗܝ
  choice: 年岁多寡
  rationale: 底本文字传承略有噪声，但上下文清楚对比寿命的长与短；此译简洁保留对称结构。
- source_word: ܡܘܬܪܐ
  choice: 益处／得益
  rationale: 语境讨论的是寿命在道德与属灵意义上是否有益，并非商业利润，因此采用现代汉语中自然的“益处”和“得益”。
- source_word: ܡܒܣܪܝܢ
  choice: 点亮
  rationale: 与“一盏灯”搭配，保留照明意象；“点亮”比“使发光”更自然，也不额外限定灯所象征的对象。
- source_word: ܢܣܘܒܘܬ ܒܪܢܫܐ ܕܒܣܘܪ
  choice: 以色列民
  rationale: 末句所指是以色列这一共同体；“以色列民”自然、庄重，并保留集体含义。
- source_word: ܕܐܬܝܗܒܬ ܠܡܘܬ
  choice: 带来了死亡
  rationale: 保留死亡作为亚当悖逆后果的因果力度，同时避免超出本句范围说明其机制。
- source_word: ܕܐܦܩܟ / ܕܒܣܘܪ
  choice: 那位塑造他的
  rationale: 以“塑造”呈现创造者与受造者的关系，也与摩西的顺服形成自然呼应。
theological_decisions:
- issue: 寿命长短的道德与属灵价值
  choice: 以亚当与摩西作对比，表明寿命本身不能使人得益，关键在于是否顺服。
  alternative: 仅把两人视为相反的历史例子，不将其概括为普遍原则。
  rationale: 开头关于年岁多寡“不算数”的命题统摄后面的两个反问，因此译文保留明确的论证关系，但不添加“得救”等原文未明说的术语。
- issue: 亚当犯罪与后代寿命缩短的关系
  choice: 按经文明说，亚当的悖逆带来死亡，并使后代的年岁缩短。
  alternative: 将“缩短年岁”仅理解为死亡笼统临到后代。
  rationale: 原文把死亡与后代年岁受限并列陈述；译文保留二者，不进一步建立经文之外的遗传罪责理论。
- issue: 摩西点灯的意象
  choice: 保留律法与灯的并列意象，表示摩西把律法带给雅各后裔，并为以色列民点灯。
  alternative: 明确解释这盏灯就是律法，或解释为摩西本人是灯。
  rationale: 上下文使启示和引导的含义十分明显，但原句没有完全消除意象所指的开放性，因此不在正文中将二者直接等同。
- issue: 摩西的顺服对象
  choice: 译作顺服“那位塑造他的”。
  alternative: 译作臣服于“他的创造者”。
  rationale: “塑造”较贴近具体的创造意象；“顺服”则以自然汉语表达受其权柄约束，而不引入特定宗派术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。两个反问保持原文的论辩力度；“年岁多寡并不算数”“只活了一百二十年”使亚当与摩西的对照清楚。“雅各的后裔”和“以色列民”分别保留家族与民族共同体层面的称呼。
