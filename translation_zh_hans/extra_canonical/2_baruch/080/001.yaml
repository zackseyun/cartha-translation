  yaml_path: translation/extra_canonical/2_baruch/080/001.yaml
  text: 'Knowing first what was to happen, that Nebuchadnezzar king of Babylon set it in his heart... But we knew that no command from his mouth would go forth in vain, nor otherwise than he had appointed beforehand. For what had been determined beforehand was shown openly. And it was also revealed to me that angels were engaged against the city: they shook its walls and uprooted them, and the mighty wall with its strong iron corners they cast down. But at that time they hid the holy vessels, so that they might not be seen by the enemies.


    And when they had done these things, then they handed over to the enemies the broken wall, the plundered house, the burned temple, and the people who had been overcome and were being carried away, so that the enemies might not boast and say, ‘We have surrounded even the house of the Most High, and in battle we have thrown it down.’


    They also bound your brothers and led them away to Babylon, and there they made them dwell. But we and our seed were left here, few and small. This is the affliction of the people about which I wrote to you. For you surely know that the humiliation of Zion has weighed heavily upon you, because your knowledge of her was greater than that of the people, since you were those who served there, while we were helping.'
translation:
  language: zh_hans
  text: '他们预先知道将要发生的事，就是巴比伦王尼布甲尼撒心里所定的……[a] 然而我们知道，他口中所出的命令绝不会落空，也绝不会偏离他预先所定的。因为预先决定的事已经显明。我也蒙启示，看见有天使对这城采取行动：他们震动城墙，将墙拆毁，又推倒那坚固、四角包铁的雄伟城墙。但那时，他们把圣所的器皿藏了起来，免得被仇敌看见。


    他们做完这些事以后，才把残破的城墙、被洗劫的殿宇、遭焚烧的圣所，以及那些已被制伏、正遭掳去的百姓交在仇敌手中，免得仇敌夸口说：“我们连至高者的殿也围住了，并且在战斗中把它摧毁了。”


    他们又捆绑你们的弟兄，把他们带到巴比伦，使他们住在那里。但我们和我们的后代仍留在这里，人数又少又弱。这就是我写信告诉你们的那百姓所受的苦难。你们当然知道，锡安所受的屈辱沉重地压在你们心上，因为你们对她的认识比一般百姓更深；你们曾在那里供职，而我们则从旁协助。


    [a] 本节开头的叙利亚文传本文句残缺，语法关系不明；也可按传统校补理解为：“弟兄们，你们首先要知道将要发生的事：巴比伦王尼布甲尼撒曾决意上来攻打这城。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节开头的叙利亚文传本文句残缺，语法关系不明；也可按传统校补理解为：“弟兄们，你们首先要知道将要发生的事：巴比伦王尼布甲尼撒曾决意上来攻打这城。”
    reason: 现存文本开头残损且句法不完整；脚注保留传统重构，但避免把来源中未清楚见到的成分无标记地纳入正文。
lexical_decisions:
- source_word: ܡܠܐܟ̈ܐ
  choice: 天使
  rationale: 这些行动者先于仇敌拆毁城防，置于本书启示与审判的语境中，应理解为属天的使者；译作“天使”也保留原文的神学力度。
- source_word: ܫܘܪ̈ܝܗ̇ / ܫܘܪܝܐ ܕܒܪܝܬܐ
  choice: 城墙……雄伟城墙
  rationale: 原词指城市的防御墙体；前处用通俗的“城墙”，后处以“雄伟”体现强化表达，同时不把破损文本过度具体化。
- source_word: ܡܐ ܛܒܝ̈ܢ
  choice: 圣所的器皿
  rationale: 字面也可指“美物”或“贵重之物”，但紧接圣殿陷落与隐藏物件的叙事，理解为圣所器皿最符合上下文。
- source_word: ܐܫܠܡܘ
  choice: 交在……手中
  rationale: 该动词表示把人或物交付到另一方权下；此译兼顾叙事中的移交和神圣审判下的交付意味。
- source_word: ܚܘܪܐ
  choice: 被洗劫的殿宇
  rationale: 此处传本文句粗糙，含义不完全确定；上下文依次列举残墙、殿宇、圣所和百姓的毁坏状态，“被洗劫”能自然衔接而不作更细的推断。
- source_word: ܡܟܝܟ
  choice: 屈辱
  rationale: 这里描述锡安被降卑及其带来的公共羞辱和情感重压，“屈辱”比单纯的“卑微”更符合语境。
theological_decisions:
- issue: 真正使城防倒塌的是谁
  choice: 明确保留天使先行震动并拆毁城墙，随后城市才被交给仇敌的叙事次序。
  alternative: 把城墙的毁灭完全归于巴比伦军队，或把天使理解为比喻。
  rationale: 叙利亚文明确提到天使及其行动；保留这一层次，可呈现城市在神圣审判与许可之下陷落，而不把经文简化为纯粹军事事件。
- issue: 为何隐藏圣所器皿
  choice: 器皿被藏起，使仇敌不能把胜利夸称为对至高者之殿的征服。
  alternative: 仅理解为战时保护财物，或把所藏之物泛译为贵重物品。
  rationale: 后文直接强调仇敌不可夸口，叙事重点不只是财物保存，也在限制仇敌对其胜利的神学解释。
- issue: 本节开头残缺句的处理
  choice: 正文保留现存文本可辨认的内容与省略号，并用脚注给出传统校补理解。
  alternative: 把“弟兄们”及“上来攻打这城”等校补内容直接写入正文。
  rationale: 现提供的叙利亚文本并不清楚包含这些成分；正文不应把推定补文当作无疑的原文，同时脚注使读者了解常见重构。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。叙事动词尽量清晰直接；“至高者”“圣所”“锡安”等保留经文语体。对残损或多义处不强行消除歧义，并以脚注区分现存文本与传统校补。
