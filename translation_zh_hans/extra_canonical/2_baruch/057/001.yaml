base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/057/001.yaml
  text: 'For you saw a great cloud that ascended from the sea and went and covered this earth, hear this: that it is the world that the Mighty One made when he planned to make creation. And it happened that, when the word went out from before him, the beginning of the world stood, small and beautiful, and was established as it was destined to be.


    And the black waters that you saw first, which descended upon it from the cloud—this is the transgression that the first Adam committed at first. For when he sinned, death was stirred up, though it was not its time, and grief was made known, and pains were prepared, and suffering was created, and toil was accomplished, and greatness began to be brought low.


    And the last day, which was shown in the form and took the likeness, know that the time will be inquired into, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, while he was, heard from God something of what was to be, and understood the release of the dead that was to be given, and what had been commanded him by God, he considered it, and he devised five thoughts. For he made himself liable, and he also made the angels liable. And also at that time when he was created, there was shown to him a vision of the bitter life and of the elements with fire. Thus God gathered in Eden, in the likeness of those that were created.'
translation:
  language: zh_hans
  text: '**《巴录二书》57:1**


    你看见一朵大云从海中升起，随后飘去，遮盖了这片大地。你要听明白：这就是大能者计划创造万物时所造的世界。[a] 他面前的话一发出，世界的开端便呈现出来，虽小却美，并且照着预定的样子被设立。


    你最先看见从云中降在其上的黑水，就是第一位亚当最初所犯的过犯。因为他一犯罪，死亡就被发动了，尽管那时还不是死亡的时候；悲哀显露，痛苦备下，苦难造成，劳碌完成了，尊荣也开始衰落。


    至于那以某种形态显现、又取了某种样式的末日，你要知道：到那时，时候要受查验，人类的尺度要被衡量，人的力量也要受检验。[b] 亚当在世时，曾从上帝那里听见一些将来之事，也明白死人将要得到释放，并明白上帝所吩咐他的事。因此，他反复思量，想出了五个念头。他使自己招致了责任，也使天使招致了责任。[c] 他受造时，还曾看见一个异象，见到苦涩的人生，以及与火相伴的诸元素。上帝就这样在伊甸园中，照着受造之物的样式聚集。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可按另一种断句理解为：“遮盖了这片大地——这就是大能者计划创造万物时所造的世界。”
    reason: 叙利亚文的句法和断句允许“这就是世界”直接承接“这片大地”。
  - marker: b
    text: “衡量”所对应的叙利亚文动词与“膏抹”同形；这里因与“尺度”“查验”“检验”并列，取“衡量”义。
    reason: 说明词形歧义及上下文为何支持“衡量”，避免误读为受膏。
  - marker: c
    text: “招致了责任”也可译作“使……负有责任”或“使……承担责任”。原文没有说明亚当如何使天使负有这种责任。
    reason: 保留司法责任的语义，并标明天使一语本身含义不明。
  - marker: d
    text: 本句原文晦涩，动词“聚集”没有明说宾语；“照着受造之物的样式”与前文的具体关系也不清楚。
    reason: 避免为难解的末句擅自补出对象或建立确定的神学联系。
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: 世界的开端
  rationale: 结合控制文本所支持的原初起源含义，译作“开端”，而不将其限定为物质性的“根基”或后世的“进程”。
- source_word: ܚܛܗܐ ܡܬܒܪܝܢܘܬܐ
  choice: 过犯
  rationale: 突出亚当越过上帝所定界限的行为，同时避免把这里弱化为泛指的道德缺失。
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: 死亡就被发动了
  rationale: 保留动词所含的启动、激发之意，也保存死亡在未到其时便开始运作的启示文学张力。
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: 尊荣也开始衰落
  rationale: 保留由高而低的动态意象；“尊荣”可涵盖伟大、尊贵或威荣，不擅自限定为单一对象。
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: 人类的尺度
  rationale: 与“时候受查验”和“力量受检验”平行，表示用于评断人类的尺度，同时保留短语本身的抽象性。
- source_word: ܡܚܝܒܢܘܗܝ
  choice: 使……负了罪责
  rationale: 表达所招致的司法性责任，而不只表示主观的罪疚感；保留经文关于亚当和天使的强烈陈述。
- source_word: ܐܣܛܘܟܣܐ
  choice: 诸元素
  rationale: 这是希腊语 stoicheia 的借词；“诸元素”既透明，又保留其可能具有的宇宙论含义。
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: 死人将要得到释放
  rationale: 按字面保留“死人之释放”，不直接释义为“复活”或其他更具教义限定的说法。
theological_decisions:
- issue: 亚当的过犯与死亡及堕落处境的关系
  choice: 译文把亚当的过犯呈现为死亡、悲哀、痛苦、苦难、劳碌和尊荣衰落的起点
  alternative: 仅把亚当当作一般人类犯罪的代表，或只强调法律意义上的定罪
  rationale: 原文明确列出由亚当犯罪引发的宇宙性和人类性后果，不宜缩窄为个人罪责。
- issue: 亚当使天使负罪责的难解陈述
  choice: 直译为“他使自己负了罪责，也使天使负了罪责”
  alternative: 改写为亚当只伤害自己，或删淡天使的责任
  rationale: 原文的陈述虽大胆且含义不明，译文应保留其神学张力，而不是替读者消解。
- issue: 死人的释放
  choice: 保留“释放”这一表达
  alternative: 明确解释为死人复活、得赦免或脱离阴间
  rationale: 原文没有在此明确说明释放的机制或性质，因此不导入某一特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。叙事部分力求流畅；在“天使负罪责”和末句等原文本就晦涩之处，不以顺译为由补足未经明说的对象或教义解释。使用“大能者”保留尊称色彩，用“诸元素”保存启示文学的宇宙论语感。
