base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/056/001.yaml
  text: 'That great cloud which you saw ascending from the sea and going to cover the earth—understand this: it is the ordering of the world which the Mighty One made when he resolved to create it.[1][2] And it came to pass that, when the word went forth from before him, the establishment of the world arose—fair, small—and it was prepared as it was fitting to be.[3]


    And as for the first black waters which you saw descending from that cloud, this is the sin and transgression which the first Adam committed first. For when he transgressed, death was aroused before its time, and mourning became known, and afflictions were prepared, and pains were created, and toil was completed; and greatness began to wane.


    And the last day, which appeared in a form and took on a likeness—you will know that the time will be demanded, and the measure of humanity will be measured, and its strength will be tested.[4][5]


    Therefore, because Adam—when he heard from God something of what was to be, and understood that the release of the dead had been given, and had been commanded by God—considered, and he thought five thoughts: for he was condemning himself; he was also condemning the angels; and even at the time when he was created in it, there was for him a seen vision, and the fierce living creatures, and the elements with fire.[6][7]


    And thus God gathered in time, in the likeness in which they had been created.'
translation:
  language: zh_hans
  text: '你所看见的那朵大云从海中升起，又遮盖了大地——你要明白：这就是大能者决意创造世界时所定下的世界秩序。[a][b] 当话语从他面前发出时，世界的建制便立了起来——美好、微小——并且照着它所应有的样子预备妥当。[c]


    至于你起初所看见从那云中降下的黑水，它就是第一位亚当最初所犯的罪和过犯。因为他犯了过错，死亡便在未到其时之际被唤醒；哀恸由此为人所知，患难预备起来，痛苦被造出，劳苦达到完全，伟大也开始衰退。


    至于那显出形状、带有样式的末日，你将知道：时候必被追讨，人类的形貌必被抹去，其力量也必受检验。[d][e]


    因此，亚当从上帝那里听见一些将要发生的事，又明白给死者的赦免已经赐下，并且领受了上帝的命令；于是他思量，想了五个念头：他定自己有罪，也定天使有罪；甚至在他受造于其中的时候，他得见一个异象，还有凶猛的活物和与火同在的诸元素。[f][g]


    上帝就这样在那时按着它们受造时的样式把它们聚集起来。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “又遮盖了”在不同见证中使用两个近义动词，均有“覆盖、遮盖”之意，不影响句义。
    reason: textual_variant
  - marker: b
    text: 此处叙利亚文传本有困难。校勘见证支持“世界的秩序／结构”；另一读法可理解为“施展他的能力”。正文采用前者。
    reason: textual_variant
  - marker: c
    text: “美好、微小”在上下文中颇为突兀，可能描写世界初成时尚在萌始状态；正文保留原文简短并列，不作补释。
    reason: lexical_alternative
  - marker: d
    text: “显出形状、带有样式的末日”句法简略；相关词形也可能使人联想到“死亡的样式”。正文没有替原文确定这一关系。
    reason: lexical_alternative
  - marker: e
    text: 译作“形貌”的词很少见，后接动词可理解为“抹去”；也有译法把整句理解为衡量人类的尺度。
    reason: lexical_alternative
  - marker: f
    text: “给死者的赦免”也可理解为“死者所得的释放”。正文按被动句理解为上帝已经赐下、关乎死者的恩赐。
    reason: lexical_alternative
  - marker: g
    text: “想了五个念头”之后的各分句极其压缩，五项如何划分并不清楚。正文保留原有次序，没有加以调和或补足。
    reason: textual_difficulty
lexical_decisions:
- source_word: ܥܢܢܐ
  choice: 云
  rationale: 该词通常指云；保留异象中从海上升起并覆盖大地的自然意象。
- source_word: ܚܦܝ / ܟܣܝ
  choice: 遮盖
  rationale: 两个见证读法都表达覆盖；“遮盖”自然、准确，也不额外引入隐藏或蒙蔽的含义。
- source_word: ܢܘܓܪܗ ܕܥܠܡܐ
  choice: 世界秩序
  rationale: 依据校勘见证理解为世界的安排或结构；“秩序”契合随后创造和建制的语境。
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 按形容词名词化理解为上帝的称号，并与本书惯用的神圣称谓一致。
- source_word: ܡܠܬܐ
  choice: 话语
  rationale: 既准确表达“话语”，又保留创造命令的互文意味。
- source_word: ܩܘܝܡܐ
  choice: 建制
  rationale: 该词可指建立、设立或稳固状态；“世界的建制”保留宇宙被设立起来的意味。
- source_word: ܫܦܝܪ ܙܥܘܪ
  choice: 美好、微小
  rationale: 原文并列而语意突兀，故不补足为成熟或初生等解释，保留其张力。
- source_word: ܡܝ̈ܐ ܐܘܟܡ̈ܐ
  choice: 黑水
  rationale: 直译颜色与水的意象，以维持异象中各时期的象征结构。
- source_word: ܐܬܬܙܝܥ
  choice: 被唤醒
  rationale: 动词含被激起、震动之意；“被唤醒”表现死亡因过犯而开始发生作用。
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: 人类的形貌
  rationale: 罕见词语可能指外貌、形态或表象；采用较谨慎的“形貌”，并保留其不确定性。
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: 凶猛的活物
  rationale: 依上下文将其理解为严酷、凶猛的活物，而不是抽象的痛苦生活。
- source_word: ܐܣܛܘܟܣܐ
  choice: 诸元素
  rationale: 这是源自希腊语的借词，通常指宇宙元素；不进一步解释为精灵或语言字母。
theological_decisions:
- issue: 遮盖大地的大云所象征的内容
  choice: 象征大能者创造世界时所定下的世界秩序
  alternative: 象征帝国统治或审判的扩展
  rationale: 紧接的解释明确谈到上帝决意创造及其话语发出，因此创造秩序比政治或审判解释更符合近距语境。
- issue: 死亡在未到其时之际被唤醒
  choice: 亚当的过犯使死亡及其伴随的哀恸、患难和痛苦过早进入受造秩序
  alternative: 仅指亚当个人比预定寿命更早死亡
  rationale: 原文把死亡与一系列普遍后果并列，重点在宇宙和人类处境的变动，而不只是一人的寿命。
- issue: 末日段落的指向
  choice: 保留为有关末后追讨、人的形貌消逝和力量受检验的审判性陈述
  alternative: 专指亚当死亡之日或后续某一黑水时期
  rationale: “末日”“时候被追讨”和“受检验”共同形成末世审判语域，但不把简略句法扩写成完整教义体系。
- issue: 给死者的赦免
  choice: 理解为上帝所赐、关乎死者的赦免
  alternative: 亚当赦免别人，或赦免只赐给亚当
  rationale: 被动式“已经赐下”更自然地以上帝为施赐者；仍保留“死者”与“赦免”之间关系的简略性。
- issue: 亚当定自己和天使有罪
  choice: 按原文压缩次序直译，不说明天使如何被定罪
  alternative: 解释为亚当导致天使犯罪，或天使拥有审判亚当的权柄
  rationale: 叙述高度省略，强行指定因果或司法关系会消除原文真实的含混。
- issue: 与火同在的诸元素
  choice: 指宇宙元素，但不规定其具体哲学或灵界分类
  alternative: 指字母、语言成分或元素之灵
  rationale: 借词通常具有宇宙论含义，与火并列也支持此解；原文不足以建立更具体的分类。
translation_notes:
  register: 采用现代标准普通话的庄重书面语，句式尽量清楚而不口语化。异象解释中的重复、并列和突兀表达予以保留；对末日、赦免、天使和元素等神学性语句不作宗派化扩写。脚注统一使用[a]至[g]，且所有标记均已出现在正文中。
