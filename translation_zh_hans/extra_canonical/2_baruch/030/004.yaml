  text: But the souls of the wicked will waste away even more when they see all these things.
translation:
  language: zh_hans
  text: 但恶人的灵魂看见这一切时，必更加衰残。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܦܫ̈ܬܗܘܢ（据本节传本文义还原）
  choice: 灵魂
  rationale: 在复活与终末审判的语境中，此词指人的灵魂或生命主体；译作“灵魂”可与前文复活后的景象相衔接。
- source_word: ܕܪ̈ܫܝܥܐ（据本节传本文义还原）
  choice: 恶人
  rationale: 采用现代汉语中自然、明确的道德称谓，不额外引入法律定罪或宗派术语。
- source_word: ܢܬܒܠܝܢ／对应‘消损、衰败’的传本文义
  choice: 衰残
  rationale: 保留原句所表达的持续耗损、败落之意；“衰残”比单纯“消失”更能体现逐渐衰败，也不把它解释为灵魂灭绝。
- source_word: ܝܬܝܪ
  choice: 更加
  rationale: 保留比较或程度递增的语义，表明看见这一切使恶人的痛苦与衰败加剧。
theological_decisions:
- issue: 恶人灵魂的结局是否指彻底灭绝
  choice: 译为“必更加衰残”
  alternative: “必更加消灭”或“必归于无有”
  rationale: 原文表达衰败、耗损，并未在本句明确断言灵魂彻底不存在；因此保留终末刑罚性质上的张力，不作额外教义判断。
- issue: “看见这一切”与衰残之间的关系
  choice: 用“看见这一切时”表达时间伴随关系
  alternative: “因为看见这一切”
  rationale: 源文可自然理解为见到这些事之时发生进一步衰残，但未必明确标示单一因果关系；时间表达更审慎。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“但”承接前文对义人福乐的描述，并形成鲜明转折；句式简洁，适合经文朗读。所给页面文本的分节与排版较混乱，本节措辞依据叙利亚文传本中《巴录二书》30:4的对应句义，并以英文POB作为校核层。
