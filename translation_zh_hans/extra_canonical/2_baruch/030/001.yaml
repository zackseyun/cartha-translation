  text: And it will happen after these things, when the time of the coming of the Messiah is completed and he returns with glory, then all those who sleep in hope of him will rise.
translation:
  language: zh_hans
  text: 这些事以后，弥赛亚来临的时期完成后，他要带着荣耀归来；那时，所有怀着对他的盼望而长眠的人都要起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ ܕܡܐܬܝܬܗ ܕܡܫܝܚܐ
  choice: 弥赛亚来临的时期
  rationale: 按叙利亚语名词结构直译，保留“时期”与“来临”两层含义，不缩减为单纯的“弥赛亚来时”。
- source_word: ܡܫܝܚܐ
  choice: 弥赛亚
  rationale: 采用现代中文读者熟悉的音译，并保留其末世性称号的开放含义。
- source_word: sleep / rise（本节后半句据章节传统文本及英译审校层）
  choice: 长眠／复起
  rationale: “长眠”保留死亡的委婉隐喻，“复起”表达从死亡中起来，同时避免额外加入原句未明说的身体性解释。
- source_word: hope in him（本节后半句据章节传统文本及英译审校层）
  choice: 怀着对他的盼望
  rationale: 自然表达关系对象，同时保留盼望指向弥赛亚这一语义。
theological_decisions:
- issue: 弥赛亚归来与荣耀的关系
  choice: 他就要带着荣耀归来
  alternative: 他将在荣耀中返回
  rationale: “带着荣耀归来”符合现代汉语，也不把“荣耀”解释成地点、状态或特定教义概念。
- issue: 死者复起的范围
  choice: 所有怀着对他的盼望而长眠的人
  alternative: 所有在盼望他时睡去的人
  rationale: 保留原句限定范围：并非明说所有死者，而是那些盼望指向弥赛亚而死的人。
- issue: 时期的完成
  choice: 时期一满
  alternative: 时期成全之时
  rationale: “一满”自然且贴近完成、届满之义，不把时间的终结神学化为某种特定的“成全”理论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这些事以后……那时……”保持末世叙事的推进；分号连接弥赛亚归来与盼望者复起，清楚呈现其时间关系。所给页面在本节边界处有明显错接或缺损，因此后半句参考章节传统文本与经审校的英文咨询层复原，未据乱码作臆测。
