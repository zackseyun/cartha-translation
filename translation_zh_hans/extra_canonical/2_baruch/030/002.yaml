- from: 到那时，存放义人灵魂数目的宝库将要开启；他们要出来，众多灵魂同心聚集，显现出来。先来的必欢喜，后来的也不忧愁。[a]
  to: 到那时，存有义人灵魂数目的宝库将被开启，义人的灵魂就要出来；众多灵魂将一同显现，聚集为一，心意一致。最先的必欢喜，最后的也不忧愁。[a]
  rationale: 修订明确灵魂是“出来”的主语，调整中段语序以清楚表达共同显现、同一聚集和心意一致，并以较中性的“最先的／最后的”及脚注保留末句指代歧义。
