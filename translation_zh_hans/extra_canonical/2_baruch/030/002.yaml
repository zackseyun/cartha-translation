base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/030/002.yaml
  text: And it will happen at that time that the storehouses will be opened in which the number of the souls of the righteous is kept, and they will come forth. And the multitudes of souls will be seen together in one gathering, of one mind. And the first will rejoice, and the last will not be grieved.
translation:
  language: zh_hans
  text: 到那时，存有义人灵魂数目的宝库将被开启，义人的灵魂就要出来；众多灵魂将一同显现，聚集为一，心意一致。最先的必欢喜，最后的也不忧愁。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最先的”和“最后的”直译为“第一的”和“最后的”；原文未明确说明具体指的是哪些人。
    reason: 保留原文的次序性对举及其未定指向，避免将其限定为特定世代或离世先后。
lexical_decisions:
- source_word: ܓܙ̈ܐ（据本节可辨文本及上下文复原）
  choice: 宝库
  rationale: 指封存、保守义人灵魂的天上储藏之处；“宝库”既保留原文意象，也符合庄重的末世语境。
- source_word: ܢܦ̈ܫܬܐ
  choice: 灵魂
  rationale: 本节所指是义人死后被保存、继而出来的生命主体；译作“灵魂”比泛称“生命”更准确。
- source_word: ܒܚܕ ܟܢܫܐ
  choice: 聚集
  rationale: 表达众多灵魂共同会集于一处，不额外引入礼仪性或制度性的“会众”含义。
- source_word: ܒܚܕ ܪܥܝܢܐ（据传本文句复原）
  choice: 同心
  rationale: 原意为具有同一心思、意向；“同心”自然简洁，同时保留群体一致的含义。
- source_word: ܩܕܡܝܬܐ…ܐܚܪܝܬܐ
  choice: 先来的……后来的
  rationale: 保留先后次序的对举，并用“来的”补足现代汉语表达；不把两者武断解释为特定世代。
theological_decisions:
- issue: 义人灵魂的保存与显现
  choice: 按原文保留“宝库开启—灵魂出来—共同显现”的图像
  alternative: 解释为身体复活，或淡化为义人得到纪念
  rationale: 本节明确谈到被保存并出来的灵魂；译文不提前把这一图像等同于某一套更完整的复活教义。
- issue: “先来的”与“后来的”所指
  choice: 保持开放，仅译为时间次序上的两组人
  alternative: 明确译为古代义人与末代义人，或先死与后死的人
  rationale: 原句本身未充分限定其身份；保留歧义可避免把解释写入正文。
- issue: 末句否定的力度
  choice: “也不忧愁”
  alternative: “绝不会悲伤”
  rationale: 忠实保留与“欢喜”相对的否定表达，不无根据地加强语气。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号呈现宝库开启与灵魂出来的连续动作；“同心聚集，显现出来”保留原句的共同聚集和可见性。脚注标记已在正文中出现。
