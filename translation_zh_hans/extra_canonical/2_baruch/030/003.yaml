lexical_decisions:
- source_word: ܝܕܥ… / “they know”
  choice: 他们知道
  rationale: 依照本节可辨识的上下文与经校核的英文咨询层，主语承接前节复起的义人众灵；所给叙利亚文转录在此处疑有版面或识读混乱。
- source_word: ܙܒܢܐ
  choice: 时候
  rationale: 此处指预告将到的特定末后时刻，用“时候”比抽象的“时间”更自然。
- source_word: ܫܘܠܡܗ ܕܙܒܢܐ / consummation of the times
  choice: 诸时代的终结
  rationale: “终结”保留圆满完成与告终的双重意味；“诸时代”依经校核的英文读法保留复数及末世性表达。
theological_decisions:
- issue: “终结”是否解释为毁灭或成全
  choice: 终结
  alternative: 圆满／末了
  rationale: 不将末世性的“完成、告终”限定为毁灭，也不以“圆满”弱化其终局意味。
- issue: 关系从句所修饰的对象
  choice: “所说的那个时候……就是诸时代的终结”
  alternative: “那个时候已经到了；关于它，曾有话说，那是诸时代的终结”
  rationale: 采用自然中文重组，同时保留“预先所说的时刻”与“诸时代的终结”之间的同位关系。
translation_notes:
  register: 采用庄重而通顺的现代书面汉语；不增添说话者、预言来源或具体末世体系。
