lexical_decisions:
- source_word: ܫܘܢܩܗܘܢ（据本节传本语境复原；所给页面转录此处讹乱）
  choice: 自己的苦刑
  rationale: 表达临到恶人身上的痛苦惩罚；“苦刑”比泛泛的“惩罚”更保留 torment 的强度，又不额外限定刑罚的具体方式。
- source_word: ܐܒܕܢܗܘܢ（据本节传本语境复原；所给页面转录此处讹乱）
  choice: 自己的灭亡
  rationale: 保留“毁灭、丧亡”的终局意味，不将其解释为某一特定教义术语。
- source_word: ܡܛܐ / ܐܕܪܟ（所给转录可辨“来到”语义，但具体词形受讹误影响）
  choice: 已经来到／已经临到
  rationale: 用完成体呈现两个结局已迫近并成为现实的语气，同时以近义变化使现代汉语自然庄重。
theological_decisions:
- issue: “灭亡”是否应解释为灵魂消灭或永恒刑罚
  choice: 仅译作“灭亡”
  alternative: 译作“永远沉沦”或“彻底消灭”
  rationale: 原句本身不裁定灭亡的具体形态；避免导入超出文本的宗派性末世论解释。
- issue: 刑罚临到的时间语气
  choice: 译作“已经来到／已经临到”
  alternative: 译作“快要来到”
  rationale: 根据英语审校层及本章末世审判语境，句子强调恶人认出刑罚与灭亡已经到达，而不只是将来可能发生。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“苦刑”保留原句的严厉程度；两个“自己的”明确回指恶人，并维持原文平行结构。因所给叙利亚文页面转录在本节附近明显错乱，词形判断参考可辨语境与已审校的英语咨询层，未以不确定的转录细节改写句意。
