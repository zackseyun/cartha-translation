base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/058/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and covering this earth: it is the world which his power made when he planned to make creation. And when the word went out from before him, the beginning of the world stood forth, very small, and it was set in order according to what it was intended to become.


    And the first black waters that you saw descending from the cloud—this is the sin, the transgression that the first Adam committed. For when he sinned, death was stirred up before its time, and mourning was made known, and pains were prepared, and anguish was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in the form that had taken likeness, know that the time will be searched out, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, when he heard from God something of what was to be, reflected on the release of the dead that had been given, and on what had been commanded him by God, he kept considering it and devised five thoughts. For he made himself liable, and through him the angels also were made liable. And at the time when he was created, a vision was shown to him: the bitter life, and the elements with fire. Thus God gathered these beforehand in the likeness of those who were created.'
translation:
  language: zh_hans
  text: '你所看见从海中升起、继而遮盖这地的那片大云究竟是什么，你要听：它就是上帝以自己的能力所造的世界；那时，他定意创造万有。话语一从他面前发出，世界的开端便显立出来，极其微小，并照着预定要有的样子被安排妥当。


    你最先看见从云中降下的黑水，就是起初亚当所犯的罪，也就是那次过犯。因为他一犯罪，死亡就在尚未到期之时被唤起；哀恸为人所知，病痛得到预备，苦楚被造出，劳苦齐备，尊荣也开始降卑。


    至于那以某种形状显现、并取了形貌的末日，你要知道：时候必受察验，人类的尺度必被衡量，其力量也必受检验。因此，亚当从上帝那里听见一些将来之事，又明白那已经赐下的“死人的释放”[a]，以及上帝吩咐他的事；他不断思量，想出了五种意念。他使自己担负罪责，天使也因他担负罪责。在他受造的时候，也有异象给他看：苦涩的生命、诸元素和火。上帝就这样在某个时候将这些聚集起来，照着它们受造时的样式。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死人的释放”原文含义不确定；也可能涉及死人得赦免、被遣离或得释放，但不可据此确定为某一种教义概念。
    reason: 保留ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ这一困难短语的语义开放性。
  - marker: b
    text: “在某个时候”所据的叙利亚文词语含义和句法关系并不完全确定；不宜据此将其确定为伊甸园这一地点。
    reason: 避免将ܒܥܕܢ的歧义具体化为未经充分支持的地点名，同时提示读者末句仍有文本困难。
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: 世界的开端
  rationale: 该短语描写世界最初显立而出的状态。“开端”既保留创造语境，也不把它限定为“根基”或后来的秩序。
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: 罪……过犯
  rationale: 并列保留两个词的语义层次：前者是罪，后者强调越界或违犯，不将二者压缩为一个概念。
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: 死亡……被唤起
  rationale: 动词表示死亡被激发、发动，而不只是死亡开始存在；“被唤起”保留这一动态意象。
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: 尊荣也开始降卑
  rationale: 译文保留下行动势及地位受贬抑之意；“尊荣”在此比抽象的“伟大”更符合人的受造地位这一语境。
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: 人类的尺度
  rationale: 该短语与“衡量”和“检验”平行，因此采用具有评量意味的“尺度”，而不径直解释为律法或规范。
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: 死人的释放
  rationale: 原文含义和句法均较困难；直译保留其开放性，不擅自确定为复活、赦免或死亡判决。
- source_word: ܡܚܝܒܢܘܗܝ
  choice: 担负罪责
  rationale: 该词带有司法性的归责意味；“担负罪责”比单纯“内疚”更贴近原文，同时比“被定罪”少作一步终局判断。
- source_word: ܐܣܛܘܟܣܐ
  choice: 诸元素
  rationale: 这是源自希腊语的宇宙论用词；“诸元素”清楚而中性，不额外解释为灵界权势。
- source_word: ܒܥܕܢ
  choice: 在伊甸园中
  rationale: 无元音文本可理解为“在伊甸园中”，也可能与“时候”有关。正文依亚当受造的近邻语境采用前者，并以脚注保留歧义。
theological_decisions:
- issue: 亚当的过犯与死亡及人类苦难的关系
  choice: 保留原文的直接因果次序：亚当犯罪后，死亡在未到期时被唤起，继而出现哀恸、病痛、苦楚和劳苦。
  alternative: 将其弱化为对普遍人类败坏或苦难的概括描述。
  rationale: 叙述明确把亚当的行为与死亡及苦难链条相连；译文不淡化这种启示文学式的因果张力。
- issue: “死人的释放”的确切所指
  choice: 正文作相对直译，并加引号和脚注说明其不确定性。
  alternative: 明确译成“死人复活”“死人得赦免”或“死人被遣走”。
  rationale: 现有叙利亚文不足以排除这些可能，但也不足以独断其中之一；保留含混可避免把后来的教义表述强加给文本。
- issue: 亚当使天使担负罪责
  choice: 依上下文译作“天使也因他担负罪责”，保留令人不安的归责关系。
  alternative: 将其解释为亚当控告天使，或只说亚当本人有罪。
  rationale: 原句代词和介词关系困难；正文采用较有上下文支持的读法，但不进一步说明哪些天使或罪责如何归算。
- issue: 末句的地点或时间含义
  choice: 正文采用“在伊甸园中”，脚注保留时间性读法。
  alternative: 译作“预先”或“在适当的时候”。
  rationale: ܒܥܕܢ在无元音状态下存在真实歧义；亚当受造的语境支持伊甸园读法，但不应掩盖另一可能。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。创造段落使用“显立出来”“安排妥当”保留原文的宇宙秩序意象；苦难清单采用整齐短句以维持启示文学的递进节奏。对句法破碎或词义不确定之处不作宗派化阐释，而以较直译正文配合必要脚注。
