translation:
  language: zh_hans
  text: '《巴录二书》24:1


    看哪，日子将到，那时书卷都要展开；凡犯罪之人的罪都记在其中。此外，库藏中汇集着凡在受造界中行义之人的义。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܘܡ̈ܬܐ
  choice: 日子
  rationale: 保留闪语末世宣告中“日子将到”的惯用表达，自然且庄重。
- source_word: ܐܬ ܓܙ / ܒܝܬ ܓܙ̈ܐ
  choice: 库藏
  rationale: 源文抄录在此处有切分或识读困难；结合叙利亚文本脉络及平行结构，所指为存放义的库藏，而非普通书卷。
- source_word: ܙܕܝ̈ܩܐ / ܐܙܕܩܦ
  choice: 行义之人／义
  rationale: 按上下文保留“罪”与“义”的对应关系；用现代汉语可懂的表达，避免强行限定为法庭称义或伦理功德。
- source_word: ܒܒ̣ܪܝܬܐ ܕܐܬܒܪܝܬ
  choice: 在受造界中
  rationale: 直译其创造语汇，保留可能指“受造世界”或“创造秩序”的宽度。
theological_decisions:
- issue: 罪与义被记录、积存的审判意象
  choice: 以“罪记在书卷中、义积存在库藏中”的平行结构呈现
  alternative: 解释为靠行为获得救恩或法律意义上的称义
  rationale: 源文陈述审判前的记录与保存意象，并未在本节说明救恩机制，因此不作宗派性推断。
- issue: “义人／行义者”的时间含义
  choice: 译作“行义之人”
  alternative: 译作“已经称义的人”
  rationale: 该词形和上下文容许道德或司法色彩；此译保持张力，不预先锁定教义范畴。
translation_notes:
  register: 采用现代、庄重而通顺的经文体。“看哪”保留启示性宣告语气；分号凸显书卷与库藏的对应。由于所给章节页文本存在边界重叠与若干OCR错乱，正文以可辨认的叙利亚语词汇、句法脉络及经审核的英文咨询层交叉校核。
