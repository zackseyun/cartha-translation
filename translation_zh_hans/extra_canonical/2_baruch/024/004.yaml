  yaml_path: translation/extra_canonical/2_baruch/024/004.yaml
  text: For I know what has happened to us, but what will happen to our enemies I do not know, nor when you will visit your works.”
translation:
  language: zh_hans
  text: 因为我知道我们所遭遇的事；但我们的仇敌将遭遇什么，我不知道；你何时临到你所造之物，我也不知道。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临到你所造之物”直译可作“临到你的作为”。“临到”可指眷顾、察验或施行审判；本句没有明确限定其性质。“你所造之物”也可广义指神的工作或受造界。
    reason: 说明“临到”和“works”的语义范围，并避免将神的临到定为单指施恩或审判。
lexical_decisions:
- source_word: ܓܕܫܢܝ / ܕܓܕܫܢ
  choice: 临到我们的是什么
  rationale: 该词根表示发生、遭遇或临到；按本节上下文保留事件内容未明说的表达，不擅自具体化为某种灾祸。
- source_word: ܒܥܠܕܒܒܝܢ（据本节连续文本及英译校核）
  choice: 我们的仇敌
  rationale: 采用普通而庄重的现代汉语对应，维持群体性的敌对关系。
- source_word: ܬܣܥܘܪ / 表示 divine visitation 的动词（据本节连续文本复原）
  choice: 察看
  rationale: 既可涵盖神的临到、鉴察和处置，又不预先限定为恩慈眷顾或刑罚。
- source_word: ܥܒܕ̈ܝܟ
  choice: 你的作为
  rationale: 保留“works”可指所行之事或所造之物的语义张力，不窄化为“受造物”或“工程”。
theological_decisions:
- issue: “察看”所表示的神圣临到是拯救还是审判
  choice: 不明确限定，译作“察看”
  alternative: 眷顾／审判
  rationale: 原语在末世语境中可带鉴察并介入之意；本节没有要求只按恩典或刑罚理解。
- issue: “你的作为”的所指
  choice: 保留广义“作为”
  alternative: 你所造的万物／你的工作
  rationale: 避免把可能兼指上帝所行之事与所造之物的表达单一化。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语体；以“临到”呼应前后两个分句，并保留原文对已知之遭遇、未知之敌人结局及未知时刻的三重对照。
