  yaml_path: translation/extra_canonical/2_baruch/024/002.yaml
  text: And at that time you will see—and the many who are with you—the forbearance of the Most High that has been through all generations, how he has been patient with all who are born, both those who sin and those who are righteous.
translation:
  language: zh_hans
  text: 到那时，你和与你同在的许多人，必看见至高者历世历代的恒久忍耐：他一直忍耐所有出生的人，无论是犯罪的，还是行义的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘ̇ ܙܒܢܐ
  choice: 到那时
  rationale: 保留末世性时间指向，并采用自然、庄重的现代汉语表达。
- source_word: ܣܘܓܐܐ ܕܥܡܟ
  choice: 与你同在的许多人
  rationale: 按叙利亚文所指的群体直译，不擅自说明其身份。
- source_word: ܡܓܪܬ ܪܘܚܗ ܕܡܪܝܡܐ
  choice: 至高者……的恒久忍耐
  rationale: 该惯用语表达长期克制、宽容和延缓施罚；“恒久忍耐”兼顾词义与经文语体。
- source_word: ܒܟܠ ܕܪ
  choice: 历世历代
  rationale: 准确传达“在每一代中”的持续范围，同时符合现代汉语经文语感。
- source_word: ܐܝܠܝܢ ܕܚܛܝܢ ܘܐܝܠܝܢ ܕܡܙܕܩܝܢ
  choice: 无论是犯罪的，还是行义的
  rationale: 保留两类人的并列对照；将后者译为行为层面的“行义”，避免提前判定其终局身份。
theological_decisions:
- issue: 至高者忍耐的对象是否仅指罪人
  choice: 译作他忍耐所有生在世上的人，包括犯罪者与行义者
  alternative: 只把“忍耐”理解为对犯罪者延缓审判
  rationale: 原文明确把两类人都置于同一陈述之下；译文保留这一神学张力，不替作者缩小范围。
- issue: 义者称谓的性质
  choice: 行义的
  alternative: 义人
  rationale: 原文与“犯罪的”形成动态并列，采用“行义的”更能保留行为性，也避免引入特定称义体系。
translation_notes:
  register: 采用现代标准普通话，句式庄重而清楚。“你和与你同在的许多人”保留原文略显突出的并列结构；以冒号引出至高者忍耐的具体说明。
