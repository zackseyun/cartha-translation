  text: And I answered and said, “But look, Lord, no one knows the number of the things that have passed, nor of the things that are to come.
translation:
  language: zh_hans
  text: 我回答说：“可是，主啊，请看，没有人知道过去之事的数目，也没有人知道将来之事的数目。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܥܢܝܬ ܘܐܡܪܬ
  choice: 我回答说
  rationale: 按叙事公式直译，保留第一人称发言的庄重语气。
- source_word: ܐܠܐ ܗܐ
  choice: 可是……看哪
  rationale: ܐܠܐ 表转折，ܗܐ 用于唤起注意；分别译出，以保留原文语势。
- source_word: ܡܢܝܢܐ
  choice: 数目
  rationale: 对应可计数的总数，与上下文关于世代及事件之数的论述相符。
- source_word: ܕܥܒܪ̈ܢ
  choice: 已经过去之事
  rationale: 该阴性复数分词在上下文中指已经发生、过去的事；译为“之事”比仅译“过去的人”更符合语境，也与将来之事形成对称。
- source_word: ܕܥܬܝ̈ܕܢ
  choice: 将来之事
  rationale: 保留原文“将要发生/来到的”这一开放表达，不具体限定为人物、年代或灾祸。
theological_decisions:
- issue: 人对过去与未来之数的无知范围
  choice: 保持为“没有人知道”
  alternative: 译成“人无法知道”或限定为巴录本人不知道
  rationale: 原文以泛指的“人”陈述知识的局限，不应加强为绝对能力判断，也不应缩窄为说话者个人。
- issue: 过去和将来的所指
  choice: 译作“事”而不作“人”或“世代”
  alternative: 已经过去的人／将来的人；过去与未来的世代
  rationale: 原文分词本身容许一定语义开放性；结合英语审校层和邻近语境，“事”最能保留其宽泛性，避免引入特定末世论解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留“看哪”这一经文式提示语，但避免过度古雅。句式维持过去与未来的平行结构。
