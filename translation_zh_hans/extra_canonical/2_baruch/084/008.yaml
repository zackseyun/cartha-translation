  text: Remember the law and Zion, and the holy land, and your brothers, and the covenant of your fathers; and do not forget the festivals and the sabbaths.
translation:
  language: zh_hans
  text: 你们要记住律法、锡安、圣地、你们的弟兄，以及你们祖先的约；不要忘记节期和安息日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: 律法
  rationale: 该词通常指律法或法律；在此与锡安、圣地及祖先之约并列，译作“律法”最符合犹太经文语境。
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ（据语境复原；页面转写疑有讹误）
  choice: 圣地
  rationale: 现存页面文本在此处明显不稳，但英语审校层及并列结构支持“圣地”；译文保持简洁，不扩展为特定疆域。
- source_word: ܩܝܡܐ
  choice: 约
  rationale: 闪语传统中该词可指所立的约；“祖先的约”保留其群体与神学含义。
- source_word: ܥܕ̈ܥܕܐ
  choice: 节期
  rationale: 指按时举行的宗教节庆；“节期”比“节日”更能体现礼仪性，同时为现代读者所熟悉。
- source_word: ܫܒ̈ܐ
  choice: 安息日
  rationale: 按经文语境指安息日；采用现代中文圣经通行表达。
theological_decisions:
- issue: “祖先的约”的立约主体未明说
  choice: 保留“你们祖先的约”
  alternative: 译成“上帝与祖先所立的约”
  rationale: 原句并未在此明确补出立约主体；不添加“上帝”，以保存原文的简约和潜在歧义。
- issue: “弟兄”的群体范围
  choice: 译作“你们的弟兄”
  alternative: 译作“你们的同胞”
  rationale: “弟兄”既可表达亲族，也可表达盟约群体；不将其范围预先限定为民族同胞。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“你们要记住……不要忘记……”保留劝诫语气；各项并列清晰，避免古奥虚词。所给叙利亚文为整章页面桶，且目标句附近的转写/OCR明显不稳，因此以可辨词形、并列结构和经审校的英语咨询层交叉判定。
