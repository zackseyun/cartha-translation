  text: For if he should judge us not according to the abundance of his mercies, woe to all of us who have been born.
translation:
  language: zh_hans
  text: 因为，如果他不按自己丰盛的怜悯审判我们，我们所有生下来的人就都有祸了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ... ܐܝܟ
  choice: 不按
  rationale: 叙利亚语否定词与比较、准则表达相连，表示审判若“不按照”其怜悯为尺度；这比“离开”更直接符合现存原文。
- source_word: ܣܘܓܐܐ ܕܪ̈ܚܡܘܗܝ（据经文通行校读）
  choice: 他丰盛的怜悯
  rationale: 以自然庄重的现代汉语表达“他怜悯的丰盛/众多”，并保留怜悯作为审判语境中的关键神学用语。
- source_word: ܠܟܠܢ ... ܝܠܝ̈ܕܐ（据经文通行校读）
  choice: 我们这些生在世上的人就都
  rationale: 传达“我们所有已经出生的人”的普遍范围；“生在世上”在现代汉语中较自然，也避免误解为只指婴孩。
- source_word: ܘܝ
  choice: 有祸了
  rationale: 保留哀叹兼宣告灾祸的力度，采用读者熟悉且庄重的圣经汉语表达。
theological_decisions:
- issue: 怜悯与审判之间的关系
  choice: 不按他丰盛的怜悯审判我们
  alternative: 离开他的怜悯审判我们
  rationale: 原文较自然地把怜悯呈现为审判所依据的尺度，而不是暗示取消审判；脚注保留另一种既有理解，不进一步系统化二者关系。
translation_notes:
  register: 采用现代、庄重而通俗的书面普通话。“我们这些生在世上的人”比直译“所有出生的人”更自然；“有祸了”保留原文强烈的哀叹语气。
