  - severity: low
    issue: “生在世上的人”含有原文未明说的“在世上”。
    rationale: 原文的范围是“我们所有出生的人”；改为“我们所有生下来的人”可保留普遍范围而不增添地点性表达。
  revised_text: 因为，如果他不按自己丰盛的怜悯审判我们，我们所有生下来的人就都有祸了。
