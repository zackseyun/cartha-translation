base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/001.yaml
  text: Look, while I am still alive I have made these things known to you, because I said that you should learn what is good; for the Mighty One commanded me to instruct you, and before I die I will set before you some of the ordinances of his judgment.
translation:
  language: zh_hans
  text: 看哪，趁我还活着，我已经把这些事告诉了你们，因为我曾说过，你们应当学习美善之事；大能者[a]吩咐我教导你们，我死以前，也要把他审判的一些条例摆在你们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能者”是本书用来称呼上帝的一个称号，也可译作“刚强者”。
    reason: 帮助普通读者识别此词为神圣称号，并保留其可能的字面译法。
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: 大能者
  rationale: 保留本书反复使用、具有修辞分量的神圣称号，不将其泛化为“上帝”或“主”；“大能者”在现代汉语中庄重而易懂。
- source_word: ܫܦܝܪ̈ܬܐ
  choice: 美善之事
  rationale: 该词指道德上美好、合宜的事；“美善之事”兼顾劝诫语境与庄重文体，也不把含义缩窄为单纯的行为规范。
- source_word: ܦܘܩ̈ܕܢܐ / ܦܘܩ̈ܕܢܘܗܝ
  choice: 条例
  rationale: 此处与审判相连，“条例”较“命令”更能表达具有裁断和规范性质的规定，同时保留原文的法律语域。
- source_word: ܚܝ̈ܐ / life expression
  choice: 趁我还活着
  rationale: 采用自然现代汉语表达说话者在死亡以前履行教导责任的时间意味。
theological_decisions:
- issue: 神圣称号
  choice: 大能者
  alternative: 上帝；主；刚强者
  rationale: 保留叙利亚文本中特有的称号及其崇高语气，避免以通用神名抹平本书的措辞特色。
- issue: 审判与条例的关系
  choice: 他审判的一些条例
  alternative: 他的一些审判；关于他审判的一些规定
  rationale: 保留“审判”与规范性条例之间略显紧密而有张力的原文关系，不擅自解释为判决、刑罚或一般道德教训。
- issue: 劝诫的道德范围
  choice: 学习美善之事
  alternative: 学习何为善；学习合宜之事
  rationale: 既传达道德劝诫，也不把原词限定为抽象善恶知识或礼俗上的合宜。
translation_notes:
  register: 采用现代、庄重而清楚的劝诫文体。“看哪”保留原文提示听者注意的语气；“摆在你们面前”保留公开陈明、郑重交付的意象。全句避免教派化术语，并保留“审判的一些条例”的语义张力。
