  text: Hand on this letter and the traditions of the law to your children after you, just as your fathers handed them on to you.
translation:
  language: zh_hans
  text: 你们要把这封信和律法的传统传给你们的儿女，正如你们的祖先把这些传给你们一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܒ̈ܠܡܢܘܬܗ
  choice: 传统
  rationale: 该词属于“传递、交付”语义范围，在此指历代传下来的律法传统；译作“传统”既保留其群体传承含义，也不把它窄化为成文规条。
- source_word: ܢܡܘܣܐ
  choice: 律法
  rationale: 在犹太经文语境中指律法，采用现代中文圣经读者熟悉而庄重的译法。
- source_word: ܒܢ̈ܝ
  choice: 后代子孙
  rationale: 原词直译为“儿子们”，在传承语境中可涵盖后裔；“后代子孙”自然表达代际延续，也避免误解为仅限直接男性子嗣。
theological_decisions:
- issue: 律法与传统的关系
  choice: 译为“律法的传统”，保留所属关系
  alternative: 译为“律法和传统”或“律法的规条”
  rationale: 不把传统与律法分成两个并列实体，也不把传统等同于律法条文，从而保留原文可能具有的传承性含义。
translation_notes:
  register: 采用现代、庄重而清楚的劝诫语体；以“传给……正如……传给”保留原句代际交付的呼应结构。
