lexical_decisions:
- source_word: ܐܡ̇ܪ ܗܘܐ
  choice: 不断地……说
  rationale: 叙利亚文以分词加过去时系词表达过去持续或反复的动作；译作“不​​断地……说”可自然传达这一体貌。
- source_word: ܫ̈ܒ̣ܛܝܟܘܢ
  choice: 你们十二个支派
  rationale: 词义为“你们的支派”；本节语境明确指以色列十二支派，按源文与校审层所保存的数目明说“十二个支派”。
- source_word: ܒܡܕܒܪܐ
  choice: 在旷野
  rationale: 这是圣经叙事中以色列人在旷野时期的常用称呼；“旷野”准确且符合现代汉语圣经语域。
theological_decisions:
- issue: “他”的所指
  choice: 保留代词“他”
  alternative: 明确译为“摩西”
  rationale: 本节承接上文，源文以代词延续所指；不在本节擅自补入专名，以保留篇章衔接方式。
- issue: 十二支派共同在旷野的表述
  choice: 译作“你们十二个支派一同在旷野时”
  alternative: 译作“你们的十二支派形成之时”
  rationale: 选择表达共同处境的读法，符合校审层及旷野叙事语境，同时避免加入“形成”等源文未明说的神学或历史解释。
