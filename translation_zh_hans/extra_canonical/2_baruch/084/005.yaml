lexical_decisions:
- source_word: ܡܘܫܐ
  choice: 摩西
  rationale: 采用现代中文圣经读者熟悉的专名译法。
- source_word: ܡܢ ܩܕܝܡ
  choice: 早在……以前
  rationale: 表达时间上的预先性，并自然连接后面的事件从句。
- source_word: ܢܓܕܫܟܘܢ
  choice: 临到你们
  rationale: 该动词表示事情发生或遭遇；此处用“临到”保留预告之事后来应验的语气。
- source_word: ܢܡܘܣܐ
  choice: 律法
  rationale: 在摩西语境中指规范以色列的神圣律法；“律法”是准确且通行的中文表达。
theological_decisions:
- issue: 灾祸临到与离弃律法之间的因果关系
  choice: 保留“因为你们离弃了律法”
  alternative: 弱化为“正如律法所说”
  rationale: 英语审校层明确见证因果读法，且符合本段摩西警告与事件应验的论述；不另加惩罚机制或宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这些事”补足汉语所需的事件指代；“看哪”保留原段落中强调应验事实的宣告语气。
