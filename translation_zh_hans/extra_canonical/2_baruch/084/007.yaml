base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/007.yaml
  text: Let this letter also be a witness between me and you, so that you may remember the commandments of the Mighty One, and so that it may become a vindication for me before him who sent me.
translation:
  language: zh_hans
  text: 愿这封信也在我和你们之间作见证，好使你们记住大能者的诫命，也使它在差遣我的那一位面前成为我得以申辩的凭据。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܓܪܬܐ
  choice: 这封信
  rationale: 按本节语境指巴录写给众人的书信；用“这封信”符合现代汉语指示方式。
- source_word: ܣܗܕܐ
  choice: 见证
  rationale: 保留其在双方之间作证、证明的正式含义，不弱化为一般的“提醒”。
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 这是本书对上帝的称号；采用名词性称谓，保留原文庄严而间接的表达。
- source_word: ܦܘܩ̈ܕܢܘܗܝ
  choice: 诫命
  rationale: 此处指大能者所颁布、要求人谨守的命令；“诫命”符合经文语域且通俗清楚。
- source_word: ܙܕܝܩܘܬܐ
  choice: 申辩的凭据
  rationale: 相关表达可涉及正直、称义、辩护或得以证明无过；译作“申辩的凭据”既适合审判语境，也避免过早锁定为某一套教义术语。
theological_decisions:
- issue: “大能者”是否直接译作“上帝”
  choice: 保留“大能者”这一称号
  alternative: 上帝
  rationale: 原文以称号指称神，保留称号能呈现本书独特用语，又不加入额外的神学解释。
- issue: 末句是否明确译为“使我称义”或“宣告我无罪”
  choice: 译为“成为我得以申辩的凭据”
  alternative: 成为使我称义的证据／宣告我无罪
  rationale: 原语的司法意味并不必然等于后世特定的称义教义；当前译法保留巴录在差遣者面前获得辩明的含义及一定歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在我和你们之间作见证”保留原文的契约与司法色彩；两个“好使／也使”呈现并列目的关系。
