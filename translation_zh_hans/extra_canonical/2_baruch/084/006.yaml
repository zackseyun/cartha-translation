  source_fidelity: 草稿准确保留了条件句、第二人称复数、从“大能者”领受，以及“预备并存留”的将来应许。可是叙利亚文在“从大能者”之后明确有 ܡܠܟܘܬܐ（“国度”）；草稿以中性的“那……”取代，遗漏了原文的核心名词。英文审校轨迹的泛称“what”不应优先于原文的“国度”。
  naturalness: 原译整体庄重、现代且顺畅。“在你们受苦以后”与英文审校轨迹一致；在本节所给页面桶中，相应叙利亚文措辞的界限和释义不完全稳定，故不作超出既有审校轨迹的改动。修订后句子仍自然。
  terminology: “大能者”适当地对应 ܚܝܠܬܐ，并保留其作为神的称谓而不擅加特定神名。“领受”也适合 ܬܣܒܘܢ。应补出 ܡܠܟܘܬܐ 为“国度”。
