base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/006.yaml
  text: 'So I also say to you after your suffering: if you listen to these words that have been spoken to you, you will receive from the Mighty One what has been kept ready and stored up for you.'
translation:
  language: zh_hans
  text: 所以，在你们受苦以后，我也对你们说：你们若听从这些已经对你们说过的话，就必从大能者那里领受那为你们预备并存留的国度。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: 大能者
  rationale: 该词在本书中是对上帝的称称，直译其“大能”含义，同时避免擅自换成带有额外解释的神名。
- source_word: ܬܣܒܘܢ
  choice: 领受
  rationale: 表达从大能者那里得到所预备之物；“领受”比单纯“拿取”更符合此处庄重语境。
- source_word: ܕܩܝܡܐ … ܠܟܘܢ
  choice: 为你们预备并存留的
  rationale: 依据叙利亚文所表达的已安置、为受众保留之意，并参照审校层保留两个并列概念。
theological_decisions:
- issue: 所领受之物的具体所指
  choice: 保留中性的“那……的”，不补作“奖赏”“救恩”或“国度”
  alternative: 将其明确译为“奖赏”或“国度”
  rationale: 本句所指在语法和语境上可保持概括性；明确指定会消除原文留有的开放性并引入解释。
- issue: 听从与领受之间的关系
  choice: 用“若……就……”保留条件结构
  alternative: 改写为无条件的应许
  rationale: 保留文本中的伦理劝勉及其与将来领受之间的张力，不把它系统化为某一宗派的救恩论命题。
translation_notes:
  register: 采用现代、庄重而通顺的普通话；保留第二人称复数“你们”。句首“所以”承接上下文劝勉，“已经对你们说过的话”避免生硬重复。
