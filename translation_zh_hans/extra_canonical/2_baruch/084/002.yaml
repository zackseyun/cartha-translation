base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/002.yaml
  text: Remember how Moses once called heaven and earth as witnesses against you and said, “If you transgress the law, you will be scattered; but if you keep it, you will be kept.”
translation:
  language: zh_hans
  text: 你们要记得，摩西从前怎样召唤天地作见证，指控你们，说：“你们若违背[a]律法，就必四散；你们若遵守律法，就必蒙保守。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“触犯律法”。
    reason: 相应动词可指违背或触犯律法；正文采用现代汉语更自然的“违背律法”。
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: 律法
  rationale: 该词通常指成文或神圣的律法；本节处于摩西立约劝诫的语境中，译作“律法”最为准确自然。
- source_word: （对应“召……作证”的叙利亚语表述）
  choice: 召天地作证，控告你们
  rationale: 保留申命记式的司法意象：天地被召为见证，而见证对听众不利；“控告”明确表达“against you”，但不增添判决含义。
- source_word: （对应“分散”的动词）
  choice: 四散
  rationale: 表达群体因违背律法而被驱散的结果；“四散”比单纯“分散”更自然，也保留去向未明的概括性。
- source_word: （对应“被保守”的被动式）
  choice: 蒙保守
  rationale: 保留原句的被动表达，不擅自明说施事者；在庄重的现代汉语中，“蒙保守”也能自然暗示神圣保全。
theological_decisions:
- issue: “蒙保守”的施事者是否明说为上帝
  choice: 保留被动式“必蒙保守”
  alternative: “上帝必保守你们”
  rationale: 原文的神学语境可能暗示上帝是施事者，但句面采用被动表达；不补出“上帝”，可保存原有含蓄与张力。
- issue: 顺服律法是否被解释为救恩功德
  choice: 仅译出条件句，不添加功德或称义术语
  alternative: 将其解释为凭守律法得救
  rationale: 本节陈述守约与保全之间的关系，却没有展开救恩机制；译文不应导入宗派性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留摩西立约劝诫的司法语气和平行条件结构。“四散／蒙保守”形成清晰对照；没有补出原文未明说的施事者或神学解释。
