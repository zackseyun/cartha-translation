base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/010.yaml
  text: And at all times keep asking earnestly, and pray diligently with your whole heart, that the Mighty One may be reconciled to you and may not reckon the multitude of your sins, but remember the uprightness of your fathers.
translation:
  language: zh_hans
  text: 你们要时时恳切祈求，全心殷勤祷告，好让大能者与你们和好[a]，不追究你们众多的罪，反而记念你们列祖的正直。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“怜悯你们”。
    reason: 相关叙利亚语表达可侧重关系恢复，也可理解为施恩怜悯。
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: 大能者
  rationale: 保留叙利亚文对上帝的称号，既传达能力，也避免改换为带有额外教义色彩的称谓。
- source_word: ܢܦܢܝܟܘܢ
  choice: 与你们和好
  rationale: 此处表达大能者重新转向并施恩于人的关系性恢复；译作“与你们和好”与上下文的祈求相称，同时以脚注保留“怜悯你们”的可能理解。
- source_word: ܚ̈ܛܗܘܗܝ / ܚ̈ܛܝܢ
  choice: 你们众多的罪
  rationale: 用现代汉语直接表达罪过之多，不弱化原文的道德与审判语境。
- source_word: ܐܒ̈ܗܝܟ / ܐܒܗܘܬܢ
  choice: 你们列祖
  rationale: “列祖”自然、庄重，并准确体现群体先祖的含义。
theological_decisions:
- issue: 大能者对祈求者的回应
  choice: 与你们和好
  alternative: 怜悯你们
  rationale: 正文保留关系恢复的张力，不把意义仅限于同情或赦免；脚注列出传统上可取的施怜悯含义。
- issue: 列祖的正直与当代人的罪
  choice: 记念你们列祖的正直
  alternative: 因列祖的义而赦免你们
  rationale: 原句只说记念列祖的正直，并未明确建立功德转移或必然赦免的教义，因此不作扩充。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恳切祈求”“全心殷勤祷告”保留原文反复劝勉的力度；“反而”清楚呈现“不追究……却记念……”的对比。
