  text: But after his death you cast them away from yourselves, and because of this what had been foretold came upon you.
translation:
  language: zh_hans
  text: 但他死后，你们却把它们从自己身边弃掉了[a]；因此，先前预告的事便临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”和“它们”在现存叙利亚语文本中的具体所指并不完全明确；“它们”也可理解为上文所说的律法或相关诫命。
    reason: 保留原文代词指向的真实歧义，避免在正文中擅自确定其先行词。
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܡܘܬܗ
  choice: 他死后
  rationale: 按叙利亚语的时间短语直译，并保留第三人称所指在节选中的含混。
- source_word: ܐܢܝܢ ܡܢܟܘܢ
  choice: 把它们从自己中间丢弃了
  rationale: 保留复数代词“它们”，不擅自把所指明确为律法、诫命或其他对象；“从自己中间”反映来源中的分离表达。
- source_word: ܐܝܟܢܐ ... ܗ̈ܘܝ
  choice: 因此，先前预告的事便临到你们
  rationale: 结合本节英语审校层与上下文，表达所预言之事成为现实；采用自然现代汉语而不增加事件细节。
theological_decisions:
- issue: 复数代词所指
  choice: 正文保留“它们”
  alternative: 译作“律法”或“诫命”
  rationale: 原文证据中的代词所指并不完全清楚；明确化会消除原有歧义，并可能引入解释性神学判断。
- issue: 因果关系
  choice: 译作“因此”
  alternative: 仅作并列“而”
  rationale: 英语审校层明确读作因果关系，且上下文将弃绝与预告之灾的实现相连；此译法不进一步界定审判机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“丢弃”比“废弃”更贴近主动排拒的动作，也避免把对象预先限定为法规文本；“临到你们”保留古代宗教叙事的庄重语感，同时仍为普通读者所理解。
