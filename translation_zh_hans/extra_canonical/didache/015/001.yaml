review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实地保留了任命监督和执事、四项资格，以及他们为群体承担与先知和教师相关之服事的陈述。但原文明确使用ἄνδρας（“男子”），草案以“他们应当为人”未体现这一限定；此外，“配得主”不合现代汉语的通常搭配。
  naturalness: 整体庄重通顺。“配得上主的”较“配得主的”自然；“承担……的服事”也比“履行……的服事”更符合现代书面汉语，同时保留原文同源结构所表达的承担职务之意。
  terminology: “监督”和“执事”适切；脚注说明“监督”亦可按传统译作“主教”，且不将后期教阶制度读入正文，处理稳妥。资格中的ἀληθεῖς宜译为“诚实”，不额外加入“可靠”，以免与“经过考验”（δεδοκιμασμένους）的获认可、经验证含义重叠。
  issues:
  - severity: medium
    issue: ἄνδρας（男子）未在正文中译出。
    rationale: 原文在监督和执事之后以ἄνδρας引出四项资格。无论如何理解其在古代文本中的社会语境，译文应保留这一明示的性别限定，而不应以泛指的“他们”取代。
  - severity: low
    issue: “配得主的”搭配不自然。
    rationale: 汉语通常说“配得上主的”或“配得归于主的”；前者最直接对应ἄξιος τοῦ κυρίου。
  - severity: low
    issue: “诚实可靠”稍扩展了ἀληθεῖς的表达。
    rationale: “可靠”并非错误，但会与紧随的“经过考验”形成语义重叠。译作“诚实”可更清楚地区分两项并贴近原文。
  revised_text: 所以，你们要为自己选立[a]配得上主的监督[b]和执事，就是温和、不贪财、诚实、经过考验的男子；因为他们也为你们承担先知和教师的服事。
