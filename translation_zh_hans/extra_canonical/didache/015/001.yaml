id: DID.15.1
reference: Didache 15:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Χειροτονήσατε οὖν ἑαυτοῖς ἐπισκόπους καὶ διακόνους ἀξίους τοῦ Κυρίου, ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους· ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/001.yaml
  text: Appoint, then, for yourselves overseers and deacons worthy of the Lord—men who are gentle, not lovers of money, truthful, and proven; for they too perform for you the ministry of the prophets and teachers.
translation:
  language: zh_hans
  text: 所以，你们要为自己选立[a]配得上主的监督[b]和执事，就是温和、不贪财、诚实、经过考验的男子；因为他们也为你们承担先知和教师的服事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “选立”也可译作“选派”或“任命”。
    reason: 希腊词可指借着选举或正式指定而设立人员；上下文未说明具体程序。
  - marker: b
    text: “监督”传统上也译作“主教”。
    reason: 提示该希腊职分名称的传统译法，同时避免正文预设后期教阶含义。
lexical_decisions:
- source_word: Χειροτονήσατε
  choice: 选立
  rationale: 该词在此指群体为职分拣选、任命人员；“选立”兼顾选择与设立两层意思，也避免把词源中的举手动作强加进正文。
- source_word: ἐπισκόπους
  choice: 监督
  rationale: 保留“看顾、监督者”的基本职能含义，避免直接采用可能让现代读者联想到后期教阶制度的“主教”。
- source_word: διακόνους
  choice: 执事
  rationale: 此处与“监督”并列，明显指群体中的职分；“执事”是自然且通行的现代汉语称谓。
- source_word: ἀφιλαργύρους
  choice: 不贪财
  rationale: 准确表达“不爱钱财”的含义，同时符合现代汉语对职分资格的自然表述。
- source_word: ἀληθεῖς καὶ δεδοκιμασμένους
  choice: 诚实可靠，并且经过考验
  rationale: ἀληθεῖς 表示真实、诚实可信；δεδοκιμασμένους 表示经检验而获认可。译文区分两项资格，避免合并其含义。
- source_word: λειτουργοῦσι ... τὴν λειτουργίαν
  choice: 履行……的服事
  rationale: 希腊文使用同源动词与名词，表示承担、执行宗教性服务；汉语不机械复制重复，而以“履行……服事”自然传达。
theological_decisions:
- issue: ἐπίσκοπος 是否译作后期教阶称号“主教”
  choice: 正文译“监督”
  alternative: 主教
  rationale: 《十二使徒遗训》的语境较早，原词本身强调监督、看顾的职能。正文不预设后期形成的教阶制度，脚注保留传统称谓。
- issue: “先知和教师的服事”的关系
  choice: 保留属格结构，译作“先知和教师的服事”
  alternative: 译为“代替先知和教师服事你们”
  rationale: 原文只说监督和执事也履行与先知、教师相关的服事，并未明确说他们取代后两者，因此不在译文中加入“代替”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“所以”承接上文；以分号划分任命要求与资格清单。资格用“温和、不贪财、诚实可靠、经过考验”平行呈现；末句保留“他们也”的强调，并维持原文关于职分关系的开放性。
