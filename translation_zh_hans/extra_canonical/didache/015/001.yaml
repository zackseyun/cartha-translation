revisions:
- from: 所以，你们要为自己选立[a]配得主的监督[b]和执事；他们应当为人温和、不贪财、诚实可靠，并且经过考验。因为他们也为你们履行先知和教师的服事。
  to: 所以，你们要为自己选立[a]配得上主的监督[b]和执事，就是温和、不贪财、诚实、经过考验的男子；因为他们也为你们承担先知和教师的服事。
  rationale: 修订补出原文明示的“男子”，将不自然的“配得主的”改为“配得上主的”，并以“诚实、经过考验”分别对应ἀληθεῖς与δεδοκιμασμένους。“承担……的服事”自然表达λειτουργοῦσι…τὴν λειτουργίαν，且没有添加监督和执事取代先知、教师的意思。
