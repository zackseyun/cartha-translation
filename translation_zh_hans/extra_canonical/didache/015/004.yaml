source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰς δὲ εὐχὰς ὑμῶν καὶ τὰς ἐλεημοσύνας καὶ πάσας τὰς πράξεις οὕτω ποιήσατε, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/004.yaml
  text: But as for your prayers and your alms and all your deeds[a], do them in this way, as you have it in the gospel of our Lord.
translation:
  language: zh_hans
  text: 至于你们的祷告、施舍和一切行为，都要这样去行，照着我们主的福音中所载的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“照着你们在我们主的福音中所有的”；这里没有明说是“所写的”还是所持有、所领受的教导。
    reason: preserve_ambiguity
lexical_decisions:
- source_word: Τὰς δὲ
  choice: 至于……
  rationale: 希腊文用宾语前置形成话题和强调；“至于”自然保留这一结构。δέ在此表示承接兼轻微转折，不宜强化为鲜明的“但是”。
- source_word: εὐχὰς
  choice: 祷告
  rationale: εὐχή在此指宗教性的祈祷；结合复数及上下文，用现代汉语通行的集合表达“祷告”。
- source_word: ἐλεημοσύνας
  choice: 施舍
  rationale: 该词在早期犹太和基督教语境中具体指向对穷人的慈善周济；“施舍”比宽泛的“怜悯之举”更准确，也与祷告等宗教实践并列自然。
- source_word: πάσας τὰς πράξεις
  choice: 一切行为
  rationale: πρᾶξις指所做之事、行动或行为；“一切行为”既贴近原文，也保持概括性。
- source_word: οὕτω ποιήσατε
  choice: 都要这样去行
  rationale: 保留命令语气及οὕτω“这样”的指示作用；“去行”可同时统摄祷告、施舍和其他行为。
- source_word: ὡς ἔχετε ἐν τῷ εὐαγγελίῳ
  choice: 照着……福音中所载的
  rationale: 直译“照你们在福音中所有的”在现代汉语中生硬。“所载的”自然表达群体在主的福音中已有的教导，但原文ἔχετε本身并未明说“写着”，故以脚注保留其较宽泛的表达。
- source_word: τοῦ Κυρίου ἡμῶν
  choice: 我们主的
  rationale: 按原文保留共同体性的第一人称复数和“主”的称谓。
theological_decisions:
- issue: “福音”是书面文本还是所传教导
  choice: 正文采用“福音中所载的”，脚注说明原文较直译为“你们在福音中所有的”
  alternative: “照着你们在我们主的福音中所有的”
  rationale: ἐν τῷ εὐαγγελίῳ可指主的福音传统或其文本形态，ἔχετε也只表达“拥有”。正文需要自然可懂，但不应无提示地断定特指某一部成文福音书，因此用脚注保存歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“至于”保留原文宾语前置的话题结构；句中不使用古奥的“赒济”“善举”等词。“施舍”在此为中性宗教实践用语，指对穷人的周济。
