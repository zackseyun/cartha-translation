id: DID.15.3
reference: Didache 15:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/003.yaml
  text: And reprove one another[a], not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents.
translation:
  language: zh_hans
  text: 你们要在平和中彼此劝诫，不可带着怒气，正如你们在福音中所领受的教导。凡得罪别人的人[a]，谁都不要同他说话；也不要让他听见你们的话，直到他悔改。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得罪别人”也可译作“对别人犯了错”或“偏离正道而冒犯别人”；原词本义是“没有击中目标、偏离”。
    reason: 保留ἀστοχέω在具体人际冒犯与较宽泛的犯错、偏离之间的词义幅度。
lexical_decisions:
- source_word: Ἐλέγχετε
  choice: 劝诫
  rationale: 该词可指指出过错、责备或纠正；“劝诫”既保留纠正之意，也符合下文不可发怒、要以和平相待的语境。
- source_word: ἐν εἰρήνῃ
  choice: 以和平相待
  rationale: 直译为“在和平中”；此处描述劝诫人的方式和关系状态，用现代汉语表达为“以和平相待”自然且庄重。
- source_word: ἀστοχοῦντι κατὰ τοῦ ἑτέρου
  choice: 得罪别人的人
  rationale: ἀστοχέω本义为未中目标、偏离或犯错，与κατά加属格连用时表示对另一人有所过犯；“得罪别人”准确传达人际冒犯，同时以脚注保留较宽泛的词义。
- source_word: μηδὲ παρ’ ὑμῶν ἀκουέτω
  choice: 也不要让他从你们这里听到什么
  rationale: ἀκουέτω在希腊文中是主动语态，较自然地表示“让他听见”；παρ’ ὑμῶν意为“从你们那里”。译文避免依照英语咨询层将其误作“被你们听取”。
- source_word: μετανοήσῃ
  choice: 悔改
  rationale: 表示心意和行为的转变；“悔改”是现代中文宗教文本中清楚、通行且准确的对应词。
theological_decisions:
- issue: 对犯错者的群体性管教
  choice: 保留“谁都不要同他说话……直到他悔改”的明确命令
  alternative: 弱化为仅仅不赞同或不听从此人
  rationale: 原文以两个否定命令描述停止交谈和信息往来，并明确以悔改为终点；译文不淡化其群体管教意味，也不额外规定其实施范围。
- issue: “福音”所指的形式
  choice: 译作“你们在福音中所受的教导”
  alternative: 具体化为某一卷书面《福音书》或某段经文
  rationale: ἐν τῷ εὐαγγελίῳ可指福音教导或福音传统，原文未明确限定为某一部成书文本，因此不作更窄的解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“彼此劝诫”“以和平相待”适合群体训诫语境；末句保留希腊文主动语态的听取方向。脚注标记已在正文中对应出现。
