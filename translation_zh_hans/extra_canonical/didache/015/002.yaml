source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ οὖν ὑπερίδητε αὐτούς· αὐτοὶ γάρ εἰσιν οἱ τετιμημένοι ὑμῶν μετὰ τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/002.yaml
  text: Therefore do not disregard them, for they are the ones honored by you, together with the prophets and teachers.
translation:
  language: zh_hans
  text: 所以，不要轻看他们；因为他们与先知和教师一起，都是你们所尊重的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερίδητε
  choice: 轻看
  rationale: 该词在此表示忽视、不把人放在眼里；“轻看”自然简洁，同时保留对其身份与职分不予重视的含义。
- source_word: τετιμημένοι
  choice: 所尊重的人
  rationale: 保留完成时被动分词的受尊重、被看重之意，避免译成主动意义或固定头衔。
- source_word: μετὰ τῶν προφητῶν καὶ διδασκάλων
  choice: 同先知和教师一样
  rationale: 结合上下文，该短语把“他们”与先知、教师并列为应受尊重的人；此译法自然表达共同享有尊重，但不主张职分完全相同。
theological_decisions:
- issue: “他们”与先知、教师之间的关系
  choice: 同先知和教师一样，是你们所尊重的人
  alternative: 是你们与先知和教师一同尊重的人
  rationale: 希腊语 μετὰ 可表达伴随或并列。所选译文更自然地表明这些人也应受尊重，同时不把他们与先知、教师的具体职分等同起来。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“所以”承接前文；分号呈现禁令与理由之间的逻辑关系。
