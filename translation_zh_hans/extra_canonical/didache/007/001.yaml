source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ βαπτίσματος, οὕτω βαπτίσατε· ταῦτα πάντα προειπόντες, βαπτίσατε εἰς τὸ ὄνομα τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ ἁγίου Πνεύματος ἐν ὕδατι ζῶντι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/001.yaml
  text: 'Concerning baptism, baptize in this way: Having first said all these things, baptize into the name of the Father and of the Son and of the Holy Spirit in living water.'
translation:
  language: zh_hans
  text: 至于洗礼，要这样施洗：先把这一切都讲过以后[a]，再奉父、子、圣灵的名，在活水中施洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先把这一切都预先说过以后”。
    reason: 保留 προειπόντες“预先说、事先说”的较字面表达；正文的“讲过以后”在汉语中自然表达其与施洗之间的先后关系。
lexical_decisions:
- source_word: βαπτίσματος / βαπτίσατε
  choice: 洗礼／施洗
  rationale: 分别用现代汉语通行的名词和动词表达同一词根，并保留本句礼仪指示的语气。
- source_word: προειπόντες
  choice: 先说完
  rationale: 该词基本义为“预先说、事先说”；此处指施洗前先讲完前述内容，不采用带有公开宣讲色彩的“宣告”。
- source_word: εἰς τὸ ὄνομα
  choice: 奉……的名
  rationale: 这是现代汉语基督教语境中自然且庄重的施洗表达；其字面结构为“进入……的名”，故以脚注保留。
- source_word: ὕδατι ζῶντι
  choice: 活水
  rationale: 直译为“活的水”，在古代语境通常指流动的水；正文保留原文鲜明而简洁的措辞，并以脚注说明。
theological_decisions:
- issue: 父、子、圣灵之名的单复数结构
  choice: 奉父、子、圣灵的名
  alternative: 奉父的名、子的名、圣灵的名
  rationale: 原文“名”为单数，并由父、子、圣灵共同受其支配；译文保留这一结构，不将其改写为三个分别的“名”。
- issue: εἰς 的洗礼公式含义
  choice: 正文采用惯用语“奉……的名”，脚注注明字面意思
  alternative: 进入父、子、圣灵的名
  rationale: 既保证现代汉语可读性，又不掩盖原文介词 εἰς 的方向性及其可能承载的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的指示性语体。“至于”自然承接主题转换；“要这样施洗”保留命令语气。正文中的脚注标记与脚注条目一致。
