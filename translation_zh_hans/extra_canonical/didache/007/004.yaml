source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ δὲ τοῦ βαπτίσματος προνηστευσάτω ὁ βαπτίζων καὶ ὁ βαπτιζόμενος καὶ εἴ τινες ἄλλοι δύνανται· κελεύσεις δὲ νηστεῦσαι τὸν βαπτιζόμενον πρὸ μιᾶς ἢ δύο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/004.yaml
  text: But before the baptism, let the one baptizing and the one being baptized fast beforehand, and any others who are able; and you shall command the one being baptized to fast one or two days beforehand.
translation:
  language: zh_hans
  text: 但在施洗以前，施洗的人、受洗的人，以及其他任何能这样做的人，都要预先禁食；你要吩咐受洗的人在受洗前一两天禁食。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βάπτισμα / βαπτίζων / βαπτιζόμενος
  choice: 施洗／受洗
  rationale: 按早期基督教礼仪语境译为现代汉语通行的“施洗、受洗”，既表达动作及双方角色，也避免用生硬音译。
- source_word: προνηστευσάτω
  choice: 要预先禁食
  rationale: 保留 προ- 的“预先”意义，以及第三人称命令式所表达的规范性要求。
- source_word: εἴ τινες ἄλλοι δύνανται
  choice: 其他能禁食的人也要这样做
  rationale: δύνανται 在上下文中指有能力参与禁食；补出“禁食”使汉语指向明确，但不限定具体有哪些人。
- source_word: κελεύσεις
  choice: 你要吩咐
  rationale: 保留第二人称单数和带权威性的命令语气，不弱化为建议。
- source_word: πρὸ μιᾶς ἢ δύο
  choice: 在受洗前禁食一天或两天
  rationale: 原文省略“天”，依惯用表达和语境补出；理解为提前一日或二日开始禁食，并以自然汉语表达其时长。
theological_decisions:
- issue: 禁食规定的强制程度
  choice: 施洗者与受洗者“都要”预先禁食，并“吩咐”受洗者禁食
  alternative: 译作“最好禁食”或“劝受洗者禁食”
  rationale: 原文使用命令式 προνηστευσάτω 和 κελεύσεις，语气明确，不宜弱化为建议。
- issue: 其他参与者的范围
  choice: 保留为不特定的“其他能禁食的人”
  alternative: 具体化为教会成员、亲友或见证人
  rationale: 原文没有界定这些人的身份，故不导入额外的礼仪或教派设定。
- issue: “一天或两天”的句法含义
  choice: 译为受洗前禁食一天或两天
  alternative: 译为在受洗前一日或二日禁食，但不明确禁食时长
  rationale: πρὸ μιᾶς ἢ δύο 省略了“天”，可从时间点或提前时长理解；结合 προνηστεύω 与通行理解，正文采用自然的时长表达，同时不扩充具体起止规则。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号和分句清楚区分共同禁食要求与对受洗者禁食时长的特别吩咐；避免古奥的“斋戒”及过度口语化表达。
