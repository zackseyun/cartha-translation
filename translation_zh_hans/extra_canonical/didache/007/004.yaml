revisions:
- from: 不过，在施洗以前，施洗的人和受洗的人都要预先禁食；其他能禁食的人也要这样做。你要吩咐受洗的人在受洗前禁食一天或两天。
  to: 但在施洗以前，施洗的人、受洗的人，以及其他任何能这样做的人，都要预先禁食；你要吩咐受洗的人在受洗前一两天禁食。
  rationale: 修订仅澄清末句的时间关系，并使“其他能做到的人”保留原文未具体界定的范围；不改变命令语气、禁食要求或洗礼礼仪语境。
