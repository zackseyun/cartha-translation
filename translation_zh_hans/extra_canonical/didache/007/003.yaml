id: DID.7.3
reference: Didache 7:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ ἀμφότερα μὴ ἔχῃς, ἔκχεον εἰς τὴν κεφαλὴν τρὶς ὕδωρ εἰς ὄνομα Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/003.yaml
  text: But if you do not have either[a], pour water on the head three times in the name of the Father and of the Son and of the Holy Spirit.
translation:
  language: zh_hans
  text: 但如果这两种水都没有，就奉父、子、圣灵的名[a]，把水浇在头上三次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉……的名”：原文也可较直译为“归入……的名下”。
    reason: 保留希腊语 εἰς ὄνομα 的方向性，以及洗礼公式在惯用译法与较直译表达之间的张力。
lexical_decisions:
- source_word: ἀμφότερα
  choice: 这两种水都
  rationale: 该词指上文所说的两种水；译出“这两种水”可使中文指代清楚，同时保留“二者均无”的含义。
- source_word: ἔκχεον
  choice: 浇
  rationale: 原词意为“倒出、倾倒”；在水施于头上的语境中，“浇”自然、准确，也不额外规定水量。
- source_word: τρὶς
  choice: 三次
  rationale: 直接保留动作重复三次的明确要求。
- source_word: εἰς ὄνομα
  choice: 奉……的名
  rationale: 这是现代中文宗教礼仪语境中自然而庄重的表达；脚注同时提示介词 εἰς 较直译的方向性含义，避免完全抹平原文措辞。
- source_word: Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος
  choice: 父、子、圣灵
  rationale: 按三项并列结构翻译；希腊文虽未用冠词，但所指明确，中文无需添加对应冠词。
theological_decisions:
- issue: εἰς ὄνομα 的洗礼公式应如何表达
  choice: 正文采用“奉父、子、圣灵的名”
  alternative: “归入父、子、圣灵的名下”或“进入父、子、圣灵的名”
  rationale: “奉……的名”符合现代中文的惯用表达，并与礼仪语境协调；但 εἰς 本有“向、进入、归入”的方向性，因此以脚注保留较直译的可能，避免把原文只解释为凭权柄行事。
- issue: 三项名称的确定性
  choice: 译作“父、子、圣灵”
  alternative: 以特殊格式强调相当于英语定冠词的确定性
  rationale: 这些称谓在上下文中均为明确所指；现代汉语本身没有冠词系统，不需人为增添标记，也不应因希腊文省略冠词而译成不确定称谓。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“但如果……就……”清楚承接上文条件；“把水浇在头上三次”避免生硬倒装。父、子、圣灵之间用顿号，准确呈现三个并列称谓。
