source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ μὴ ἔχῃς ὕδωρ ζῶν, εἰς ἄλλο ὕδωρ βάπτισον· εἰ δʼ οὐ δύνασαι ἐν ψυχρῷ, ἐν θερμῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/002.yaml
  text: But if you do not have living water, baptize in other water; and if you cannot in cold, then in warm.
translation:
  language: zh_hans
  text: 但如果你没有活水，就用别的水施洗；如果不能用冷水，就用温水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδωρ ζῶν
  choice: 活水
  rationale: 直译保留原文表达；在古代语境中通常指流动的水，同时不抹去“活水”可能带有的丰富联想。
- source_word: εἰς ἄλλο ὕδωρ βάπτισον
  choice: 用别的水施洗
  rationale: 此处 εἰς 与施洗及水的搭配表达改用另一种水施洗；中文采用自然说法，避免生硬译成“进入别的水”。
- source_word: ἐν ψυχρῷ / ἐν θερμῷ
  choice: 用冷水／用温水
  rationale: 省略的名词由上文“水”补足；ἐν 在此表示施洗所用的水，译为“用”符合现代汉语习惯。
theological_decisions:
- issue: “活水”的含义
  choice: 在正文保留“活水”
  alternative: 流水
  rationale: “流水”能明确呈现古代礼仪语境中的通常含义，但会收窄原词 ζῶν 的表达范围；正文采用较形式对应的“活水”，保留其语义张力。
- issue: βάπτισον 的译法
  choice: 施洗
  alternative: 浸洗
  rationale: 原文在本句规定水的种类，并未在此明确限定具体动作方式；“施洗”避免把某一种实施方式额外写入正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。两个条件句保持原文递进次序，并将第二句省略的“水”补出，以确保普通读者易于理解。
