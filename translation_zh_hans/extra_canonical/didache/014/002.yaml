  source_fidelity: 译文总体忠实呈现禁令、争执双方须先和好及避免祭献受玷污的因果关系。惟“来与你们聚会”在汉语中略显不顺，且“来”并非原文所强调；συνελθέτω ὑμῖν更直接是“同你们聚集／聚会”。
  naturalness: “但凡……的人”与“在彼此和好以前”可以理解，但前者稍显生硬，后者的和好主体不如明确说出“他和同伴”。改为“凡……的人，在他和同伴彼此和好以前，不可同你们聚会”更符合现代庄重汉语，也保留原文的双方和解。
  terminology: “同伴”对应ἑταῖρος，保持宽泛且合宜；“争执”可表达ἀμφιβολία在此的人际争端；“祭献”对应θυσία，不将其教义化为特定礼仪；“玷污”恰当表达κοινωθῇ在礼仪语境中成为不洁／受亵污的含义。
