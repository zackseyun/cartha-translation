source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ἔχων τὴν ἀμφιβολίαν μετὰ τοῦ ἑταίρου αὐτοῦ μὴ συνελθέτω ὑμῖν, ἕως οὗ διαλλαγῶσιν, ἵνα μὴ κοινωθῇ ἡ θυσία ὑμῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/002.yaml
  text: But let no one who has a dispute with his companion come together with you until they are reconciled, so that your sacrifice may not be defiled.
translation:
  language: zh_hans
  text: 但凡与同伴有争执的人，在他和同伴彼此和好以前，不可同你们聚会，免得你们的祭献受到玷污。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφιβολίαν
  choice: 争执
  rationale: 此处结合“与同伴”和随后“彼此和好”的语境，指人际间尚未解决的争端；“争执”自然且不过度限定争端的具体性质。
- source_word: ἑταίρου
  choice: 同伴
  rationale: 保留该词对伙伴、同伴的宽泛指称，不擅自限定为朋友、邻舍或教会弟兄。
- source_word: συνελθέτω ὑμῖν
  choice: 来与你们聚会
  rationale: 既表达“同你们聚集”的基本意义，也符合本章共同敬拜与祭献的语境。
- source_word: διαλλαγῶσιν
  choice: 彼此和好
  rationale: 该复数被动形式表达发生和解；汉语用“彼此和好”自然呈现双方关系恢复，而不额外规定由哪一方主动。
- source_word: θυσία
  choice: 祭献
  rationale: 保留献祭性宗教用语，同时避免用“祭物”将含义仅限于所献之物。
- source_word: κοινωθῇ
  choice: 受到玷污
  rationale: 在礼仪语境中指变为不洁或遭亵污；“受到玷污”准确传达祭献因未和解的争端而失去洁净状态。
theological_decisions:
- issue: “祭献”的具体所指
  choice: 保留为“祭献”，不进一步解释
  alternative: 明确译作“圣餐”或“祷告”
  rationale: 原文 θυσία 本身未在本节内明确等同于某一特定礼仪元素；直译可保留早期基督徒聚会语境中的神学张力。
- issue: 和解的主体与方式
  choice: 译作“彼此和好”
  alternative: 译作“他与同伴和好”或“他们被调解”
  rationale: 原文使用复数形式，强调争执双方达到和解，但未说明调解者或具体程序。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但凡……的人”承接上文并保留普遍禁令的语气；“不可”体现原文否定命令的力度。
