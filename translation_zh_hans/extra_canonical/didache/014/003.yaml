revisions:
- from: 因为这就是主所说的那祭[a]：“你们要在各处、各时向我献上洁净的祭，因为我是伟大的君王，”主说，“我的名在列国中令人惊叹。”
  to: 因为这正是主所说的那祭[a]：“无论在何处、何时，都要向我献上洁净的祭；因为我是伟大的君王，”主说，“我的名在列国中令人惊叹。”
  rationale: 修订主要改善现代汉语行文，并将脚注由排他性的语法判断改为审慎说明。正文仍以“那祭”表达阴性形式与上文祭献语境之间的紧密联系，却不加入对该祭具体为何种仪式的教义解释。引语中的命令语气以“都要”自然呈现原文不定式所表达的献祭要求。
