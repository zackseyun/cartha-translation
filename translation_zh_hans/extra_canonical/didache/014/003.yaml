  text: αὕτη γάρ ἐστιν ἡ ῥηθεῖσα ὑπὸ Κυρίου· Ἐν παντὶ τόπῳ καὶ χρόνῳ προσφέρειν μοι θυσίαν καθαράν· ὅτι βασιλεὺς μέγας εἰμί, λέγει Κύριος, καὶ τὸ ὄνομά μου θαυμαστὸν ἐν τοῖς ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/003.yaml
  text: 'For this is what was spoken by the Lord: “In every place and time offer me a pure sacrifice[a], because I am a great King,” says the Lord, “and my name is marvelous among the nations.”'
translation:
  language: zh_hans
  text: 因为这正是主所说的那祭[a]：“无论在何处、何时，都要向我献上洁净的祭；因为我是伟大的君王，”主说，“我的名在列国中令人惊叹。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语“这”和“所说的”均为阴性单数，可照应上文的“祭”；也可较宽泛地理解为：“这正是主所说的。”
    reason: 说明原文的阴性语法形式及其与上文“祭”的可能照应，同时保留句法所指的译解余地。
lexical_decisions:
- source_word: αὕτη … ἡ ῥηθεῖσα
  choice: 这就是主所说的那祭
  rationale: 指示代词和分词均为阴性，最自然地承接上文阴性名词“祭”（θυσία），而非泛指“所说的话”；中文补出“祭”以显明希腊语的语法照应。
- source_word: ἐν παντὶ τόπῳ καὶ χρόνῳ
  choice: 在各处、各时
  rationale: 逐项保留“每一处”和“每一时”的普遍范围，同时采用自然、庄重的现代汉语。
- source_word: προσφέρειν μοι θυσίαν καθαράν
  choice: 向我献上洁净的祭
  rationale: προσφέρειν 在引语中表达献祭要求；“洁净”保留 καθαράν 的礼仪及道德含义，不擅自收窄。
- source_word: θαυμαστόν
  choice: 令人惊叹
  rationale: 表达“奇妙、非凡、引人惊叹”的意义，避免借用其他经文传统中的“可畏”来替换本段实际所用的 θαυμαστόν。
- source_word: ἐν τοῖς ἔθνεσι
  choice: 在列国中
  rationale: ἔθνη 在此指各国各族；“列国”符合先知性引文的庄重语域，也不限定为某一族群。
theological_decisions:
- issue: αὕτη ἡ ῥηθεῖσα 的所指
  choice: 译作“主所说的那祭”，承接上文的“祭”
  alternative: 译作“主所说的话”或“主所说的事”
  rationale: 希腊语 αὕτη 与 ῥηθεῖσα 都是阴性单数，与 θυσία（祭）一致；若泛译为“话/事”，会掩盖作者把前述之祭与主所说预言相联系的论证。不过不进一步把“祭”解释为某一宗派所规定的特定祭仪。
- issue: “洁净的祭”的性质
  choice: 保留原文祭献措辞，不加解释
  alternative: 明确解释为圣餐、祷告或其他具体献祭形式
  rationale: 本句自身只称其为“洁净的祭”；具体所指须由上下文判断，译文不加入原文未明说的教义限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在各处、各时”保留原文并列结构；“列国”维持先知性引文的语感。引号与说话标记依照希腊语句法安排。
