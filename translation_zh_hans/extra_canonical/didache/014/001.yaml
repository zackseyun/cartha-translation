source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Κατὰ κυριακὴν δὲ Κυρίου συναχθέντες κλάσατε ἄρτον καὶ εὐχαριστήσατε προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν, ὅπως καθαρὰ ἡ θυσία ὑμῶν ᾖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/001.yaml
  text: But on the Lord’s own day, when you have gathered together, break bread and give thanks, having first confessed your transgressions, so that your sacrifice may be pure.
translation:
  language: zh_hans
  text: 但在主日，你们聚集之后，要先承认自己的过犯，然后擘饼并献上感谢，好使你们的祭物纯洁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ κυριακὴν δὲ Κυρίου
  choice: 但在主日
  rationale: κυριακήν在此指属于主的日子；“主日”是自然、简洁且历史上相称的现代汉语表达。原文重复使用κυριακὴν与Κυρίου以加强“属主”之意，汉语不宜机械译成“主的主日”。
- source_word: συναχθέντες
  choice: 你们聚集之后
  rationale: 不定过去时被动形动词在此具有时间意义，表示会众聚集后进行擘饼与感谢；译文保留行动次序。
- source_word: κλάσατε ἄρτον
  choice: 要擘饼
  rationale: 直译“掰开饼”；“擘饼”既保留早期基督徒共同用餐或礼仪语境，也为现代读者所能理解。
- source_word: εὐχαριστήσατε
  choice: 献上感谢
  rationale: 该动词基本义为“感谢、感恩”；这里不直接音译或专门化为某一宗派的圣礼名称，以避免超出原文。
- source_word: προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν
  choice: 先承认自己的过犯
  rationale: προ-表明在先，ἐξομολογέομαι在此是承认、 confess；παραπτώματα指过犯或失足。
- source_word: ἡ θυσία ὑμῶν
  choice: 你们的祭物
  rationale: θυσία可指献祭行为或所献之祭。上下文将擘饼和感谢称作会众的祭；“祭物”保持祭献意象，同时不预先界定其确切礼仪性质。
theological_decisions:
- issue: “祭”（θυσία）的礼仪或神学所指
  choice: 译作“你们的祭物”，不另加解释
  alternative: “你们的献祭”或“你们所献的祭”
  rationale: 原文没有明确说明这是感恩祷告、饼酒、赞美，还是整个聚会；译文保留这种开放性，不引入特定宗派的圣餐论。
- issue: 认罪与祭物纯洁之间的关系
  choice: 按目的从句译为“好使你们的祭物纯洁”
  alternative: “以便你们的献祭成为洁净的”
  rationale: ὅπως加虚拟式明确表达目的或结果倾向；译文保持原文的神学张力，不补充认罪如何使祭物纯洁。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“主日”“擘饼”保留早期基督教文本的历史语感；其余用语尽量自然。以分号清楚呈现聚集、擘饼感恩、预先认罪及其目的之间的关系。
