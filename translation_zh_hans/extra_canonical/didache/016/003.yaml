  text: Ἐν γὰρ ταῖς ἐσχάταις ἡμέραις πληθυνθήσονται οἱ ψευδοπροφῆται καὶ οἱ φθορεῖς καὶ στραφήσονται τὰ πρόβατα εἰς λύκους καὶ ἡ ἀγάπη στραφήσεται εἰς μῖσος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/003.yaml
  text: For in the last days false prophets and corrupters will be multiplied, and the sheep will be turned into wolves, and love will be turned into hatred.
translation:
  language: zh_hans
  text: 因为在末后的日子，假先知和败坏他人的人将日益增多；羊将变成狼，爱也将变成恨。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: 在末后的日子
  rationale: 贴近希腊文的时间表达，同时保留其末世意味，不进一步限定具体时期。
- source_word: πληθυνθήσονται
  choice: 必日益增多
  rationale: 表达被动形式所呈现的数量增加；汉语无需生硬译出被动语态。
- source_word: οἱ ψευδοπροφῆται
  choice: 假先知
  rationale: 现代中文宗教语境中通行且准确，对应宣称说预言却虚假的人。
- source_word: οἱ φθορεῖς
  choice: 败坏人的人
  rationale: φθορεύς可指腐化者、毁坏者；此译保留其使他人败坏的主动含义，避免仅译成自身腐败的人。
- source_word: στραφήσονται τὰ πρόβατα εἰς λύκους
  choice: 羊必变成狼
  rationale: 保留原文鲜明的身份转变比喻，不解释其具体所指。
- source_word: ἡ ἀγάπη στραφήσεται εἰς μῖσος
  choice: 爱也必变成恨
  rationale: 简洁对应ἀγάπη与μῖσος的对照，并保留从爱转为恨的强烈张力。
theological_decisions:
- issue: 羊变成狼的指向
  choice: 按原文保留比喻，不明确解释为信徒、领袖或其他群体
  alternative: 译为“温顺的人将变成残暴的人”等解释性表达
  rationale: 原文只使用“羊”和“狼”的形象，具体所指具有解释空间，不宜在正文中消除歧义。
- issue: “末后的日子”的范围
  choice: 保留传统而宽泛的末世表达
  alternative: 译为“世界末日临近时”或“最后几天”
  rationale: 原文没有限定为极短时段，也未在本句中说明其起点，因此避免过度具体化。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“必”体现预告语气；以分号划分并列的末世征象，使句势清楚。未添加原文没有的解释性信息。
