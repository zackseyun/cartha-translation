source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὐξανούσης γὰρ τῆς ἀνομίας, μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι, καὶ τότε φανήσεται ὁ κοσμοπλάνος ὡς υἱὸς Θεοῦ καὶ ποιήσει σημεῖα καὶ τέρατα, καὶ ἡ γῆ παραδοθήσεται εἰς χεῖρας αὐτοῦ, καὶ ποιήσει ἀθέμιτα, ἃ οὐδέποτε γέγονεν ἐξ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/004.yaml
  text: For as lawlessness increases, they will hate one another and persecute and betray one another, and then the world-deceiver will appear as a son of God and will do signs and wonders, and the earth will be delivered into his hands, and he will do unlawful things such as have never happened from the beginning of the age.
translation:
  language: zh_hans
  text: 因为不法之事日益增多，人们将彼此憎恨、彼此迫害、彼此出卖。那时，那迷惑世界者将如同神的一个儿子那样显现，施行神迹奇事；全地将被交在他手中，他将做出亘古以来从未发生过的不合规矩的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομίας
  choice: 不法的事
  rationale: 既保留违背法度、秩序的含义，也符合现代汉语表达；此处用复数概念性的“事”体现其不断增多。
- source_word: παραδώσουσι
  choice: 彼此出卖
  rationale: 在互相仇恨和迫害的语境中，παραδίδωμι 指把人交出去、出卖；补出承前的“彼此”，使汉语自然，并保留希腊文并列动词共享对象的关系。
- source_word: ὁ κοσμοπλάνος
  choice: 那迷惑世界者
  rationale: κόσμος 与 πλάνος 的复合词表示迷惑世界的人；采用描述性称谓，不把它替换成原文未明说的专名。
- source_word: ὡς υἱὸς Θεοῦ
  choice: 以神儿子的身份
  rationale: 保留 ὡς 的“作为／以……身份”语义及其可能含有的表象张力，不直接断言此人确实是神的儿子。
- source_word: σημεῖα καὶ τέρατα
  choice: 神迹奇事
  rationale: 这是犹太—基督教文献中的常见固定搭配，准确表达“记号与奇事”，同时为普通中文读者所熟悉。
- source_word: ἡ γῆ
  choice: 全地
  rationale: γῆ 可指土地、地或大地；此处宇宙性末世语境适合译作“全地”，但不扩大为原文没有明确说出的“全世界”。
- source_word: ἀθέμιτα
  choice: 悖逆之事
  rationale: 该词指不合神圣法度、禁忌或不应当做的事；“悖逆之事”比泛泛的“非法之事”更能体现其宗教伦理力度。
- source_word: ἐξ αἰῶνος
  choice: 亘古以来
  rationale: 自然表达“从久远之初／自古以来”，避免把 αἰών 过度限定为某个明确的神学时代体系。
theological_decisions:
- issue: ὡς υἱὸς Θεοῦ 是否断言迷惑者真是神的儿子
  choice: 译为“以神儿子的身份显现”
  alternative: 译为“显现出来，好像是神的儿子”
  rationale: “以……身份”保留其自我呈现或被看作如此的含义，没有把身份真实性坐实；同时比“好像”更贴近 ὡς 在表明角色或身份时的用法。
- issue: κοσμοπλάνος 是否应直接等同于敌基督
  choice: 保留为“迷惑世界者”
  alternative: 译为“敌基督”
  rationale: 原文使用描述性称谓而非 ἀντίχριστος；不引入后世或特定传统的身份判定。
- issue: 末句时间范围
  choice: 译为“亘古以来从未发生过”
  alternative: 译为“从这个时代开始以来从未发生过”
  rationale: ἐξ αἰῶνος 本身可作“自古以来”，原文没有明确的“开始”名词；采用自然而不过度体系化的中文。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。并列结构以短句和分号梳理末世叙述的递进关系；避免古奥措辞和宗派化术语，同时保留原文对身份、地域和时间范围的必要张力。
