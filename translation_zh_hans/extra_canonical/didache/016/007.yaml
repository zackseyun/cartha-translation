  text: 'but not of all, but as it was said: The Lord will come, and all the holy ones with him.'
translation:
  language: zh_hans
  text: 但并非所有人都复活；正如所说：“主必来临，所有圣者都要与他一同来临。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话呼应《撒迦利亚书》14:5。“所有圣者”可能指天使、属神的人，或两者；原文没有进一步说明。
    reason: 说明引语背景，并保留οἱ ἅγιοι的真实指称歧义。
lexical_decisions:
- source_word: οὐ πάντων
  choice: 不是所有人
  rationale: 保留原文承接上文的省略表达；πάντων 为阳性复数属格，在语境中指人，不擅自补明具体群体。
- source_word: ὡς ἐρρέθη
  choice: 正如经上所说
  rationale: 直义为“正如所说过的”；此处引出经文性引语，用“经上所说”自然地表达其引用功能。
- source_word: Ἥξει
  choice: 必来临
  rationale: 将未来时译作确定的将来，并用庄重而通顺的“来临”表达末世语境。
- source_word: οἱ ἅγιοι
  choice: 众圣者
  rationale: 保留“圣者／圣洁者”的广义，不限定为天使或信徒，以维持原文可能包含的指称歧义。
- source_word: μετ᾽ αὐτοῦ
  choice: 与他同来
  rationale: 原义为“与他同在／同来”；结合动词“来临”，译为“与他同来”较自然。
theological_decisions:
- issue: “众圣者”的身份
  choice: 众圣者
  alternative: 众圣徒／众天使
  rationale: 原文 οἱ ἅγιοι 本身未明确指定是得荣耀的信徒还是天上使者；采用较宽泛的“众圣者”，不替原文消除其神学张力。
- issue: 引语来源及文本差异
  choice: 正文按本节所引希腊文翻译
  alternative: 按《撒迦利亚书》14:5常见旧约文本译作“众圣者与你同来”
  rationale: 本节希腊文明确为“与他”（μετ᾽ αὐτοῦ），故正文忠实保留第三人称，同时以脚注提示其与相关经文传统的联系。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“但不是所有人”刻意保留原文依赖上文的省略；引语使用“必来临”“众圣者”以兼顾末世语境、可读性与语义开放性。
