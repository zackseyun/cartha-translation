  text: Then the world will see the Lord coming upon the clouds of heaven.j
translation:
  language: zh_hans
  text: 那时，世人将看见主在天上的云上而来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 直接保留时间推进，语气自然庄重。
- source_word: ὁ κόσμος
  choice: 世人
  rationale: 此处作观看行为的主体，指世上的人类；译作“世人”比“世界”更符合现代汉语表达，同时不改变普遍性的含义。
- source_word: τὸν Κύριον
  choice: 主
  rationale: 保留早期基督教文本中 Κύριος 的尊称及其神学分量。
- source_word: ἐρχόμενον
  choice: 而来
  rationale: 以进行性分词描述主的来临；与“驾着”连用，形成自然的现代汉语句式。
- source_word: ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: 驾着天上的云
  rationale: ἐπάνω 可表示“在……之上”；中文圣经语体常以“驾着云”自然表达乘云而来的景象，但具体空间关系另以脚注说明。
theological_decisions:
- issue: “世人”所指的范围
  choice: 世人
  alternative: 世界
  rationale: κόσμος 可指世界或世人；因其在句中“看见”，采用人格化程度较低且现代汉语更自然的“世人”，不进一步限定为某一群体。
- issue: 主与云的空间关系
  choice: 驾着天上的云而来
  alternative: 在天上的云之上而来
  rationale: 正文采用自然且具经文庄重感的表达；脚注保留 ἐπάνω 更直译的空间含义，避免将意象解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；句式简洁，并以脚注保留希腊语空间表达的可能译法。
