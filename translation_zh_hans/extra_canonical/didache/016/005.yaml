source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τότε ἥξει ἡ κτίσις τῶν ἀνθρώπων εἰς τὴν πύρωσιν τῆς δοκιμασίας καὶ σκανδαλισθήσονται πολλοὶ καὶ ἀπολοῦνται, οἱ δὲ ὑπομείναντες ἐν τῇ πίστει αὐτῶν σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/005.yaml
  text: Then the human creation will come into the fire of testing[a], and many will be caused to stumble and will perish, but those who endure in their faith will be saved by the curse itself.
translation:
  language: zh_hans
  text: 那时，人类将进入试炼的烈火；许多人会跌倒、灭亡，但那些在自己的信仰中坚忍的人，却要借着那咒诅本身得救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可理解为“脱离那咒诅本身而得救”。原文的介词结构通常可表示“借着”或施事，但这里的具体含义并不明确。
    reason: 原文末句语义异常；正文保留较直接的“借着”译法，脚注说明可作分离义理解的可能性，而不强加神学解释。
lexical_decisions:
- source_word: ἡ κτίσις τῶν ἀνθρώπων
  choice: 人类
  rationale: 原文直译为“人的受造界／人类的创造”，在此整体指人类；译作“人类”较符合现代汉语，同时不把范围擅自扩大为整个受造界。
- source_word: πύρωσιν τῆς δοκιμασίας
  choice: 试炼的烈火
  rationale: πύρωσις有焚烧、火炼之意，δοκιμασία指检验或试炼；此译保留原文的火炼意象。
- source_word: σκανδαλισθήσονται
  choice: 会跌倒
  rationale: 该动词在宗教语境中指因诱惑或患难而失足、背离；“跌倒”保留这一比喻，不将其过度解释为单纯受骗或犯罪。
- source_word: ὑπομείναντες
  choice: 忍耐到底的人
  rationale: 该分词表示在压力和患难中坚持、忍受；“到底”自然表达持续坚忍的含义。
- source_word: ὑπ᾽ αὐτοῦ τοῦ καταθέματος
  choice: 借着那咒诅本身
  rationale: κατάθεμα是中性名词，基本义为“咒诅”；ὑπό加属格通常标示施事或媒介，因此正文直译其反常而富张力的表述，不擅自改成具体人物。
theological_decisions:
- issue: “咒诅本身”如何成为得救的媒介
  choice: 保留“借着那咒诅本身得救”的悖论式表述
  alternative: 脱离那咒诅本身而得救
  rationale: 希腊文措辞突兀，可能承载作者有意的神学张力；正文不将“咒诅”解释为敌基督、十字架或试炼，也不默默改写为脱离之义。
- issue: κατάθεμα是否指“那受咒诅者”
  choice: 按中性抽象名词译为“咒诅”
  alternative: 借着那受咒诅者本人得救
  rationale: 词形及其一致关系支持“咒诅”而非阳性的“受咒诅者”；人物化解释缺乏足够语法依据，故不收入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“试炼的烈火”“跌倒”“忍耐到底”保留早期基督教劝诫文体及原文意象；末句刻意维持原文的陌生感与神学张力。
