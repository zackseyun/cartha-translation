source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πυκνῶς δὲ συναχθήσεσθε ζητοῦντες τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν· οὐ γὰρ ὠφελήσει ὑμᾶς ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν, ἐὰν μὴ ἐν τῷ ἐσχάτῳ καιρῷ τελειωθῆτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/002.yaml
  text: And gather together often, seeking the things that are fitting for your souls; for the whole time of your faith will not profit you unless you are perfected in the last time.
translation:
  language: zh_hans
  text: 你们要常常聚集，寻求那些关乎你们灵魂的事；因为你们信仰的全部岁月都不能使你们受益，除非你们在末后的时候得以成全。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πυκνῶς
  choice: 常常
  rationale: 表达频繁、经常之意，符合现代汉语自然用法。
- source_word: συναχθήσεσθε
  choice: 你们要聚集
  rationale: 该形式在上下文中具有劝勉意味；译作“要聚集”既保留群体性，也符合本段命令语气。
- source_word: τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν
  choice: 那些关乎你们灵魂的事
  rationale: ἀνήκοντα 可指适合、应当或相关之事；“关乎”保留一定语义宽度，避免擅自限定具体内容。
- source_word: ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν
  choice: 你们信仰的全部岁月
  rationale: 直指信仰持续的整个时段；“岁月”在汉语中自然表达一段延续的时间。
- source_word: ὠφελήσει
  choice: 使你们受益
  rationale: 准确传达“有益、带来益处”，不额外指定益处的性质。
- source_word: ἐν τῷ ἐσχάτῳ καιρῷ
  choice: 在末后的时候
  rationale: 保留末世性的时间表达，同时不将 καιρός 过度具体化为某一事件或季节。
- source_word: τελειωθῆτε
  choice: 达到完全
  rationale: 保留“被成全、臻于完全”的结果意味；中文采用自然表达，并不预先裁定其具体神学机制。
theological_decisions:
- issue: 信仰历程与末后成全之间的关系
  choice: “你们信仰的全部岁月都不能使你们受益，除非你们在末后的时候达到完全”
  alternative: “你们信了这么久也无济于事，除非最终坚持到底”
  rationale: 原文以 ὠφελήσει 和 τελειωθῆτε 表达“受益”与“达到完全”，并未直接使用“坚持到底”；正文保留其警戒力度与神学张力，不把成全简化为单一的坚忍观念。
- issue: τελειωθῆτε 的被动形态
  choice: 达到完全
  alternative: 被成全
  rationale: “被成全”更显明语法被动，却可能在现代汉语中显得生硬，并使读者过早推定明确的施事者；“达到完全”自然地保留进入完全状态的核心意义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。分号保留原句两部分之间的因果推进。“灵魂”对应 ψυχαῖς，以维持早期基督教劝诫文本的语域；全句避免加入原文未明说的末世事件、得救机制或宗派性解释。
