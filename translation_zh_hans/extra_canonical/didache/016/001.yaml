  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν· οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν, καὶ αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν, ἀλλὰ γίνεσθε ἕτοιμοι· οὐ γὰρ οἴδατε τὴν ὥραν, ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/001.yaml
  text: Keep watch over your life.a Do not let your lamps be quenched, and do not let your loins be loosened,b but be ready, for you do not know the hour in which our Lord is coming.
translation:
  language: zh_hans
  text: 你们要为自己的生命保持警醒。[a]你们的灯不可熄灭，腰不可松弛，[b]总要准备好，因为你们不知道我们的主什么时候来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为自己的生命保持警醒”也可理解为“谨慎看守自己的生命”或“在生活上警醒”。
    reason: ὑπὲρ与ζωή的组合在此含义较宽，既可强调为生命警醒，也可强调谨慎守护生活。
  - marker: b
    text: 直译：“你们的腰不可被松弛。”这是古代束紧衣服、随时准备行动的形象。
    reason: αἱ ὀσφύες指“腰”或“腰身”，并非“腰带”；脚注说明其与束腰待命有关的文化图像。
lexical_decisions:
- source_word: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν
  choice: 你们要为自己的生命警醒
  rationale: 保留“警醒”这一末世劝诫用语，并以“为自己的生命”表达ὑπὲρ的关切、守护意味，不把ζωή缩窄为仅指肉身性命。
- source_word: οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν
  choice: 你们的灯不可熄灭
  rationale: 按原文保留灯的意象及被动含义，不另行解释其象征所指。
- source_word: αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν
  choice: 腰带不可松开
  rationale: 以现代读者较易理解的具体表达传达“腰间不可松弛”，同时保留束腰待命的古代意象。
- source_word: γίνεσθε ἕτοιμοι
  choice: 总要准备好
  rationale: γίνεσθε是持续性的命令；“总要”自然体现不断保持预备状态。
- source_word: ἔρχεται
  choice: 来
  rationale: 希腊语为现在时，置于未知时刻的语境中指主的来临；中文用“来”自然表达，不额外限定为某种时态或末世体系。
theological_decisions:
- issue: “生命”（ζωή）的所指
  choice: 保留宽泛的“生命”
  alternative: 译作“性命”或“灵魂”
  rationale: 原文可涉及整个人的生命与最终得救，不能仅凭本句限定为肉身性命或非物质灵魂。
- issue: 灯与束腰意象的解释
  choice: 在正文中保留意象
  alternative: 释译为“保持信仰热忱并随时待命”
  rationale: 原文借用警醒和预备的传统图像；直留意象可保存其经文回响及开放性，避免把象征固定为单一教义解释。
- issue: 主的来临
  choice: 译作“我们的主什么时候来”
  alternative: 明确译作“我们的主再来”
  rationale: 原文只说“来”，虽有末世指向，却未出现相当于“再”的词；不在正文增添原文没有的限定。
translation_notes:
  register: 采用现代、庄重而清楚的劝诫语体。保留“灯”和“束腰”的原始图像，并用脚注解释可能不熟悉的表达；句式简洁，适合公共诵读。
