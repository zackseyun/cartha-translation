source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ τότε φανήσεται τὰ σημεῖα τῆς ἀληθείας· πρῶτον, σημεῖον ἐκπετάσεως ἐν οὐρανῷ, εἶτα σημεῖον φωνῆς σάλπιγγος καὶ τὸ τρίτον ἀνάστασις νεκρῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/006.yaml
  text: 'And then the signs of the truth will appear: first[a], a sign of an opening in heaven; then a sign of the sound of a trumpet; and the third[b], the resurrection of the dead—'
translation:
  language: zh_hans
  text: 到那时，真理的诸征兆将要显现：第一，是天上有伸展之象的征兆[a]；随后，是号筒声的征兆；第三，是死人复活——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上展开之象的征兆”。原文仅说“伸展／展开”，没有说明何物被伸展或展开。
    reason: ἐκπέτασις意为伸展、展开；脚注保留其词义，并说明原文未指明伸展的对象。
lexical_decisions:
- source_word: τὰ σημεῖα τῆς ἀληθείας
  choice: 真理的种种征兆
  rationale: 保留属格结构及复数；“征兆”比一般的“记号”更自然地表达末世事件的预示作用，同时不把ἀληθείας具体化为某一种教义解释。
- source_word: ἐκπετάσεως
  choice: 伸展开来
  rationale: 该词源于ἐκπετάννυμι，核心义为伸展、展开，而非通常意义上的开启。采用动态名词化表达，使现代汉语自然，也保留其所指对象未明的歧义。
- source_word: ἐν οὐρανῷ
  choice: 天上
  rationale: 自然表达其空间意义，不额外断定是“天空”还是神圣领域。
- source_word: φωνῆς σάλπιγγος
  choice: 号筒声
  rationale: φωνή用于乐器时指其声音；“号筒声”简洁自然，避免将无生命的乐器拟人化为“声音/嗓音”。
- source_word: ἀνάστασις νεκρῶν
  choice: 死人复活
  rationale: 采用现代中文宗教及一般语境中都易懂的固定表达，忠实保留无冠词的概括性结构。
theological_decisions:
- issue: “伸展开来的征兆”具体指什么
  choice: 不补明所伸展之物
  alternative: 译作“十字架伸展的征兆”或“天开了的征兆”
  rationale: 原文只有ἐκπέτασις，并未明说十字架，也并非通常表示“开启”的词；保留其真实歧义，避免把早期解释传统写入正文。
- issue: 死人复活的范围
  choice: 译作概括性的“死人复活”
  alternative: “所有死人复活”或“义人复活”
  rationale: 本节本身没有限定范围，且句末延续到下节；不在此处加入原文没有的普遍性或限制性说明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。依照希腊文的三项递进结构，用“第一……随后……第三……”组织句子；句末保留破折号，表明语意接续下节。所有脚注标记均置于正文对应位置。
