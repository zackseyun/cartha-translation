- from: 到那时，真理的种种征兆将要显现：第一，是天上伸展开来的征兆[a]；随后，是号筒声的征兆；第三，是死人复活——
  to: 到那时，真理的诸征兆将要显现：第一，是天上有伸展之象的征兆[a]；随后，是号筒声的征兆；第三，是死人复活——
  rationale: 修订仅澄清“伸展／展开”与“征兆”的句法关系，避免将未说明的动作对象理解为征兆本身；同时以“诸”直接表达原文复数。其余用语、递进结构及破折号均保留。
