  to: 正如这碎块曾散落在群山之上，聚集起来后便成为一体；愿你的教会从地极被聚集，归入你的国。因为荣耀和权能，借着耶稣基督，直到永远，都归于你。
  rationale: 以“碎块”替代“碎饼”，避免将κλάσμα在正文中过度具体化；相应更新脚注。将教会的聚集改为“被聚集”，显出原文被动祈使；重组末句语序，以清晰表达颂赞借着耶稣基督、直到永远归于上帝。
