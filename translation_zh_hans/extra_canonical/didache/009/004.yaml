  naturalness: 祷文语体总体自然庄重。“愿你的教会从地极被聚集，归入你的国”更清楚地对应原文被动祈使语气；将颂赞句调整语序后，中文的修饰关系更明确、节奏也更顺畅。
  terminology: “教会”“地极”“国”“耶稣基督”均恰当。“碎块”保留κλάσμα的基本范围，同时不在正文中补出“谷粒”；相关常见解释仅置于脚注，处理得当。
