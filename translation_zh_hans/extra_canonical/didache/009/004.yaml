source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὥσπερ ἦν τοῦτο κλάσμα διεσκορπισμένον ἐπάνω τῶν ὀρέων καὶ συναχθὲν ἐγένετο ἕν, οὕτω συναχθήτω σου ἡ ἐκκλησία ἀπὸ τῶν περάτων τῆς γῆς εἰς τὴν σὴν βασιλείαν· ὅτι σοῦ ἐστιν ἡ δόξα καὶ ἡ δύναμις διὰ Ἰησοῦ Χριστοῦ εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/004.yaml
  text: Just as this fragment was scattered upon the mountains and[a], when gathered together, became one, so let your assembly be gathered together from the ends of the earth into your kingdom. For yours is the glory and the power through Jesus Messiah forever.
translation:
  language: zh_hans
  text: 正如这碎块曾散落在群山之上，聚集起来后便成为一体；愿你的教会从地极被聚集，归入你的国。因为荣耀和权能，借着耶稣基督，直到永远，都归于你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσμα
  choice: 碎饼
  rationale: 该词本义为掰下或破开的碎块；在《十二使徒遗训》第9章祝谢饼的语境中指碎饼。译作“碎饼”既交代上下文，又保留原文把它描述为先分散、后合一的特殊意象。
- source_word: ἐκκλησία
  choice: 教会
  rationale: 在这篇早期基督徒礼文中指属上帝、将被聚集的信徒共同体；“教会”是现代汉语中自然且准确的对应词。
- source_word: τῶν περάτων τῆς γῆς
  choice: 地极
  rationale: 简洁保留“地的尽头／边界”这一普世性的空间表达，也符合庄重祷文的语体。
- source_word: εἰς τὴν σὴν βασιλείαν
  choice: 进入你的国
  rationale: 直接表达εἰς的趋向意义，不把“国”改释为统治、领域或末世状态，从而保留原文的神学张力。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣基督
  rationale: διὰ加属格表达中介；在此早期基督徒固定称谓中，Χριστός自然译作“基督”，不额外强化为“弥赛亚”。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 以自然的现代汉语表达礼仪颂赞中的永恒时间公式。
theological_decisions:
- issue: 教会被聚集与进入上帝之国的关系
  choice: 愿你的教会……聚集起来，进入你的国
  alternative: 愿你的教会在你的国里聚集起来
  rationale: 原文两个结构依次为“从地极”与“进入你的国”；采用“进入”保留方向和终点，不把国度仅处理为聚集发生的地点。
- issue: Χριστός是固定称号／名称还是明确译出犹太弥赛亚含义
  choice: 耶稣基督
  alternative: 耶稣弥赛亚
  rationale: 在διὰ Ἰησοῦ Χριστοῦ这一早期基督徒公式中，“耶稣基督”最符合现代汉语惯用称谓，并避免擅自加强原句没有明说的解释性重点。
- issue: 分散后合一的对象
  choice: 保留“碎饼”本身曾散落、后来成为一体的原文表述
  alternative: 解释为谷粒散布山间，收集后做成一块饼
  rationale: 谷粒到饼的解释虽常见且可使意象更顺畅，但原文明确以τοῦτο κλάσμα为主语；正文不补入“谷粒”或制作过程，以免消除原文真实存在的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷文语体。“正如……；愿……也……”对应原文类比祈愿结构；“荣耀和权能都是你的”自然呈现属有断言；全句避免古奥虚词，同时保留礼仪性的节奏。
