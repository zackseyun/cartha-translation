  yaml_path: translation/extra_canonical/didache/009/001.yaml
  text: 'Concerning the thanksgiving, give thanks in this way:'
translation:
  language: zh_hans
  text: 关于感恩礼，要这样献上感谢：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “感恩礼”也可译作“感恩”或“感谢”。这里原文的名词和动词出自同一词根，直译为：“关于感恩，要这样感谢。”
    reason: 保留 εὐχαριστία 的词汇歧义及其与 εὐχαριστήσατε 的同根呼应。
lexical_decisions:
- source_word: εὐχαριστία
  choice: 感恩礼
  rationale: 此处带定冠词，并由后文关于杯和掰开的饼的礼文具体展开，指早期教会的感恩礼；译作“感恩礼”既保留“感恩”的词义，也呈现其礼仪语境。
- source_word: εὐχαριστήσατε
  choice: 献上感谢
  rationale: 与名词 εὐχαριστία 保持词义呼应，同时用自然的现代汉语表达复数命令语气。
- source_word: οὕτως
  choice: 这样
  rationale: 直接引出后续具体的感谢祷文。
- source_word: δέ
  choice: 关于……，要……
  rationale: δέ 在此承担话题转换和承接作用；汉语通过话题结构自然体现，不机械加译“现在”或“但是”。
theological_decisions:
- issue: εὐχαριστία 是泛指感谢，还是指礼仪性的感恩礼
  choice: 正文译作“感恩礼”
  alternative: 译作“感谢”或“感恩”
  rationale: 紧接着的杯与掰饼祷文使礼仪含义较为明确，但脚注保留较宽泛的词义可能性，避免把后世完整的圣餐制度概念反向置入文本。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“献上感谢”适合祷告和礼仪语境；句末冒号对应希腊文高点在此引出随后祷文的功能。
