base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/002.yaml
  text: 'First, concerning the cup:


    We give thanks to you, our Father,

    for the holy vine of David your servant,

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: zh_hans
  text: '首先，关于杯：


    “我们的父啊，我们感谢你，


    为你仆人大卫的圣葡萄树；[a]


    你借着你仆人耶稣使我们认识了它。


    愿荣耀归于你，直到永远。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”所译的希腊词也可指“孩子”；原文用同一个词称大卫和耶稣。“大卫的圣葡萄树”具体所指，原文没有明说。
    reason: 说明关键词的语义范围，并保留“圣葡萄树”意象的解释开放性。
lexical_decisions:
- source_word: ποτήριον
  choice: 杯
  rationale: 直译为“杯”，既保留礼仪语境，也不把原文未明说的杯中之物补入正文。
- source_word: Εὐχαριστοῦμέν
  choice: 我们感谢
  rationale: 在此处表示向父献上感谢；译作现代汉语自然明确的“我们感谢”，并由引言“要这样感谢”带出祷文。
- source_word: ἁγία ἄμπελος
  choice: 圣葡萄树
  rationale: 保留“圣”与“葡萄树”的意象，不改释为酒、以色列或弥赛亚谱系。
- source_word: παῖς
  choice: 仆人
  rationale: παῖς 可指仆人、孩子或儿子；大卫在此宜译“仆人”，而耶稣处采用同一译词，以呈现原文刻意重复并避免把“儿子”的神学解释直接写入正文。
- source_word: ἐγνώρισας
  choice: 使我们认识
  rationale: 保留认知与启示的表达，比仅译作“显明”更贴近使役性语义。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 符合现代汉语祷告语体，也准确表达延续至万世的含义。
theological_decisions:
- issue: “大卫的圣葡萄树”所指为何
  choice: 保留原文意象，不在正文中明确其所指
  alternative: 解释为大卫家系、弥赛亚国度、以色列或圣餐之酒
  rationale: 原句具有浓缩的礼仪与经文意象，明确释义会消除其真实的多义性。
- issue: 耶稣的 παῖς 如何翻译
  choice: 你仆人耶稣
  alternative: 你儿子耶稣／你的孩子耶稣
  rationale: 同句先称大卫为 παῖς，重复译作“仆人”可保留平行结构；脚注说明其词义范围，以免否认原词可能具有的“孩子”含义。
- issue: 是否将“杯”明确为圣餐杯或酒杯
  choice: 仅译“杯”
  alternative: 圣餐杯／酒杯
  rationale: 本节上下文具有礼仪性，但原文只写“杯”，不宜在正文中增加限定。
translation_notes:
  register: 采用庄重而自然的现代普通话。引言用“要这样感谢”补足汉语表达，使其顺畅引出祷文；祷文保持短行结构与原文的礼仪节奏。
