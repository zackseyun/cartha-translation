base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/003.yaml
  text: 'And concerning the broken bread:


    We give thanks to you, our Father,

    for the life and knowledge

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: zh_hans
  text: '至于掰开的饼：


    我们的父啊，我们感谢你，


    为着生命，以及你借着你的仆人耶稣使我们认识的知识。


    愿荣耀永远归于你。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσματος
  choice: 掰开的饼
  rationale: 该词本义为“掰下的一块／掰开的食物”，在本段祝谢语境中特指掰开的饼；译出“饼”可使现代读者清楚，同时保留掰饼意象。
- source_word: Εὐχαριστοῦμέν
  choice: 我们感谢
  rationale: 在向父所作的祷告中自然表达“献上感谢／感恩”，不预先将其术语化为后世礼仪名称。
- source_word: ζωῆς καὶ γνώσεως
  choice: 生命和知识
  rationale: 分别直译两个名词，保留“生命”与“认识神的知识”之间未被原文进一步界定的关系。
- source_word: ἐγνώρισας
  choice: 使我们认识
  rationale: 体现使役意义，并与名词 γνώσεως 的“知识／认识”形成原文中的词根呼应。
- source_word: παιδός
  choice: 仆人
  rationale: παῖς 可指孩子、儿子或仆人；在犹太经文与早期基督教用语中，“仆人”是可靠且不过度限定关系的表达，并保留其可能的仆人传统背景。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 以现代汉语祷告中自然庄重的表达传达“直到世世代代／诸世”的恒久意义。
theological_decisions:
- issue: παῖς 所表达的耶稣身份称谓
  choice: 你的仆人耶稣
  alternative: 你的儿子耶稣／你的孩子耶稣
  rationale: 原词具有多义性，但此处“仆人”能自然衔接圣经中的上帝仆人传统，也避免把原文本身未明确使用的 υἱός（儿子）意义直接写入正文。
- issue: 生命和知识的来源与启示方式
  choice: 因你赐下生命和知识，并借着……使我们认识这些
  alternative: 为着你借着……使我们知道的生命和知识
  rationale: 希腊语关系代词 ἧς 与并列名词的形式存在不规则之处；译文保留两项感谢内容，并明确“借着耶稣使人认识”的基本句法关系，而不额外界定生命与知识的神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言；保留原文的短行结构与颂赞语气。“我们的父”紧贴原文称呼；不使用过度礼仪化或宗派化术语。
