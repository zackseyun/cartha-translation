id: DID.9.5
reference: Didache 9:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδεὶς δὲ φαγέτω μηδὲ πιέτω ἀπὸ τῆς εὐχαριστίας ὑμῶν, ἀλλ' οἱ βαπτισθέντες εἰς ὄνομα Κυρίου· καὶ γὰρ περὶ τούτου εἴρηκεν ὁ Κύριος· Μὴ δῶτε τὸ ἅγιον τοῖς κυσί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/005.yaml
  text: 'But let no one eat or drink from your thanksgiving except those who have been baptized into the name of the Lord. For also concerning this, the Lord has said: “Do not give what is holy to the dogs.”'
translation:
  language: zh_hans
  text: 但除了那些已经奉主的名受洗的人，谁也不可吃喝你们的感恩餐[a]。因为关于这事，主也曾说：“不要把圣物给狗。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “感恩餐”直译为“你们的感恩”；这里指前文所述有吃喝内容的感恩礼餐，后来也常称为“圣餐”。
    reason: 说明 εὐχαριστία 的词义与此处礼仪语境，同时避免在正文中直接采用可能带有后期宗派色彩的固定名称。
lexical_decisions:
- source_word: εὐχαριστίας
  choice: 感恩餐
  rationale: 本词本义为“感恩”，但此处有“吃喝其中”的语境，所指是群体举行的感恩礼餐；译作“感恩餐”既保留词源意义，也让现代读者明白其具体所指。
- source_word: βαπτισθέντες εἰς ὄνομα Κυρίου
  choice: 奉主的名受洗的人
  rationale: εἰς ὄνομα 表示与“主的名”相关并归入其名下的洗礼；“奉主的名受洗”自然、庄重，同时避免过度展开其神学含义。
- source_word: τὸ ἅγιον
  choice: 圣物
  rationale: 希腊文为中性单数，意为“神圣之物”；“圣物”保留其概括性，不擅自限定为某一种礼仪元素。
- source_word: τοῖς κυσί
  choice: 给狗
  rationale: 直译原文比喻，保留其尖锐语气以及与主语录的呼应。
theological_decisions:
- issue: 感恩礼餐的参与资格
  choice: 按原文明确表达：仅限已经奉主名受洗的人
  alternative: 将其泛化为“信徒”或“教会成员”
  rationale: 原文明言 οἱ βαπτισθέντες，资格依据是已经受洗；不应以较宽泛的教会身份用语取代。
- issue: 主语录“不要把圣物给狗”与本条规定的关系
  choice: 保留“关于这事”的直接关联
  alternative: 弱化为一般性的经文引述
  rationale: περὶ τούτου 明确把该语录应用于前述感恩礼餐参与规定；译文保留这种神学张力，不另作解释或缓和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谁也不可”传达禁令力度；引语保持简洁有力。正文中的脚注标记与脚注条目一致。
