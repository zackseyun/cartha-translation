  yaml_path: translation/extra_canonical/didache/013/005.yaml
  text: If you prepare food[a], take the firstfruits and give according to the commandment.
translation:
  language: zh_hans
  text: 你若预备食物[a]，就要取出初熟的一份，照着诫命给出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你若做饼，就要取出初熟的一份。”
    reason: 所给希腊底本此处的词形疑有连写或转录问题；较具体的传统译法可作“做饼”，但ἀπαρχή仍应译为“初熟的一份”，不可译成“首先做成的一份”。
lexical_decisions:
- source_word: σιτιαυτοῖς
  choice: 预备食物
  rationale: 所给希腊文本此处疑有连写或转录讹误；结合可辨认的 σιτι-、句法及上下文，理解为预备食物。正文采用涵盖面较广、现代汉语自然的译法，同时在脚注保留“做饼”的传统理解。
- source_word: ἀπαρχή
  choice: 初熟的一份
  rationale: 该词指从出产或所制食物中首先分别出来献给或给予的一份；如此既保留“初熟/初产”的经文语汇，也避免把希腊文单数机械译成不自然的表达。
- source_word: λαβών
  choice: 取出
  rationale: 分词表明先从所预备之物中拿出初熟的一份，再给予；“取出”能自然表达这一动作次序。
- source_word: δός
  choice: 给出去
  rationale: 直译命令式“给”；原文未明说接受者，因此中文也不补定为先知、穷人或其他对象。
- source_word: κατὰ τὴν ἐντολήν
  choice: 照着诫命
  rationale: 保留定冠词所指向的既知命令，但不擅自说明具体是哪一条诫命。
theological_decisions:
- issue: 初熟之物的接受者
  choice: 不补明接受者，仅译“给出去”
  alternative: 译作“献给先知”或“给穷人”
  rationale: 本节自身省略了间接宾语；虽然上下文可能帮助读者推断，正文仍应保留原文的省略和开放性。
- issue: “给”是否带有祭献含义
  choice: 采用中性的“给出去”
  alternative: 译作“献上”
  rationale: δός 本身是普通的“给”，译为“献上”会强化礼仪或祭祀色彩，超出本句明说的范围。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。“初熟的一份”保留早期犹太—基督教奉献语境，“给出去”则刻意不补足原文省略的接受者。脚注标记[a]已在正文对应出现。
