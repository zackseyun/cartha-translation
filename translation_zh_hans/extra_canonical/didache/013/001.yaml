source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης ἀληθινός, θέλων καθῆσαι πρὸς ὑμᾶς, ἄξιός ἐστι τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/001.yaml
  text: But every true prophet who wishes to settle among you is worthy of his food.
translation:
  language: zh_hans
  text: 但每一位愿意在你们中间定居的真先知，都配得他的食物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς δὲ προφήτης ἀληθινός
  choice: 但每一位……真先知
  rationale: 保留 δὲ 的承接兼转折作用，并按现代汉语语序表达“每一位真先知”。
- source_word: θέλων καθῆσαι πρὸς ὑμᾶς
  choice: 愿意在你们中间定居
  rationale: καθῆσαι 在此语境不是单指“坐下”，而是留下来居住；πρὸς ὑμᾶς 表示与该群体同住、在他们中间安顿。
- source_word: ἄξιός ἐστι τῆς τροφῆς αὐτοῦ
  choice: 都配得他的食物
  rationale: 较为贴近原文，保留“配得”这一伦理判断及 αὐτοῦ 的指称；“食物”也维持 τροφή 可指日常供养的语义范围。
theological_decisions:
- issue: 先知所得 τροφή 是仅指饭食，还是泛指生活供养
  choice: 正文译作“食物”
  alternative: 译作“供养”或“生活所需”
  rationale: 原词可在语境中延伸为供养，但其直接词义是食物。正文保留较具体且开放的表达，不把共同体责任解释得比原文更宽或更窄。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“定居”清楚表达先知长期留在群体中的意思；整体保持原句简洁，不添加解释性内容。
