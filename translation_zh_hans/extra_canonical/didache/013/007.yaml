  text: ἀργυρίου δὲ καὶ ἱματισμοῦ καὶ παντὸς κτήματος λαβὼν τὴν ἀπαρχὴν ὡς ἂν σοὶ δοξῇ, δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/007.yaml
  text: And of money and clothing and every possession[a], having taken the firstfruit, as it seems good to you, give according to the commandment.
translation:
  language: zh_hans
  text: 至于钱[a]、衣物和各样财物，你从中取出初献的一份，按你认为合宜的数额，照着那诫命给出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “钱”原文也可译作“银子”。
    reason: 保留ἀργύριον的字面义，同时正文采用其在此语境中指钱币或金钱的通常含义。
lexical_decisions:
- source_word: ἀργυρίου
  choice: 钱财
  rationale: 该词本义为“银子”，但在通用希腊语中常指作为交易媒介的钱；此处与衣物及各样财物并列，译作“钱财”更自然，同时以脚注保留其字面义。
- source_word: ἱματισμοῦ
  choice: 衣物
  rationale: 概括衣服、衣着之物，符合此处财物分类的语境。
- source_word: παντὸς κτήματος
  choice: 各样财物
  rationale: κτῆμα可指所有物、财产；此处泛指所拥有的东西。“财物”既自然，也避免把范围限于不动产。
- source_word: ἀπαρχήν
  choice: 初献的一份
  rationale: ἀπαρχή本指初熟之物或初收之物，继而指从所得中首先分别出来献上的一份。由于这里包括钱财和衣物，直译“初熟果子”会显得不合语境；“初献的一份”保留献上首份的观念。
- source_word: ὡς ἂν σοὶ δοξῇ
  choice: 按自己认为合宜的
  rationale: 保留数量或比例由领受者自行判断的开放性，不擅自规定具体额度。
- source_word: δὸς κατὰ τὴν ἐντολήν
  choice: 照着那诫命献上
  rationale: δὸς是“给、交出”；结合ἀπαρχή的奉献语境译作“献上”。定冠词表明所指是上下文中已知的诫命，因此译作“那诫命”。
theological_decisions:
- issue: “初献的一份”的数额是否固定
  choice: 保留“按自己认为合宜的”所表达的自行斟酌
  alternative: 将其解释为固定比例或什一奉献
  rationale: 原文没有给出比例，且ὡς ἂν σοὶ δοξῇ明确留下判断空间，不应引入特定制度。
- issue: “诫命”具体指哪一条命令
  choice: 译作“那诫命”，但不在正文中指定其内容
  alternative: 直接解释为摩西律法、耶稣的命令或《十二使徒遗训》前文某一具体条文
  rationale: 定冠词显示其为已知所指，但本节本身并未充分界定具体出处，应保留这种指涉上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“至于”承接前文并体现δέ的转折或话题推进；句法略作调整，使分词结构在中文中自然呈现，同时不补出原文未明说的受赠者或固定数额。
