revisions:
- from: 所以，凡是榨酒池和禾场出产的初熟之物，以及牛羊中头生的，你都要取来，献给先知，因为他们就是你们的大祭司。
  to: 所以，你要把酒榨和禾场所出的各样初熟之物，以及牛羊所产的一切初生之物，取来给先知；因为他们就是你们的大祭司。
  rationale: 修订仅澄清牲畜部分的汉语表达，并将“献给”收敛为原文直接的“给”。保留“取来给”的动作次序、单数命令的“你”、复数所属的“你们”，以及先知被直接称为“大祭司”的表述。
