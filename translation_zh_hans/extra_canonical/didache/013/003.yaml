source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶσαν οὖν ἀπαρχὴν γεννημάτων ληνοῦ καὶ ἅλωνος, βοῶν τε καὶ προβάτων λαβὼν δώσεις τοῖς προφήταις· αὐτοὶ γάρ εἰσιν οἱ ἀρχιερεῖς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/003.yaml
  text: Therefore, taking every firstfruit of the produce of the winepress and threshing floor, and of cattle and sheep, you shall give it to the prophets, for they are your high priests.
translation:
  language: zh_hans
  text: 所以，你要把酒榨和禾场所出的各样初熟之物，以及牛羊所产的一切初生之物，取来给先知；因为他们就是你们的大祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴν
  choice: 初熟之物／头生的
  rationale: 该词指献给上帝的初收或首生部分。按农产品与牲畜分别用自然的现代汉语表达，同时保留共同的“初献”概念。
- source_word: γεννημάτων
  choice: 出产的
  rationale: 表示所产生、所收获之物；在榨酒池和禾场的语境中译为“出产的”自然清楚。
- source_word: ληνοῦ
  choice: 榨酒池
  rationale: 指压榨葡萄取汁的设施；“榨酒池”比泛称“酒榨”更具体，也符合古代场景。
- source_word: ἅλωνος
  choice: 禾场
  rationale: 指打谷、扬谷的场地；采用简洁且已有圣经语体基础的“禾场”。
- source_word: προφήταις
  choice: 先知
  rationale: 保留《十二使徒遗训》中对群体内先知职分的称谓，不另作教派化解释。
- source_word: ἀρχιερεῖς
  choice: 大祭司
  rationale: 按字面保留复数谓语称号的含义；汉语名词本身不标复数，由“他们”明确其复数所指。
theological_decisions:
- issue: 先知被称为ἀρχιερεῖς的身份类比
  choice: 因为他们就是你们的大祭司
  alternative: 因为他们对你们而言如同大祭司
  rationale: 原文使用直接系词判断“他们是”，并非明示比喻；因此保留其强烈、可能带有神学张力的表述，不弱化为“如同”。
- issue: 初熟农产与头生牲畜是否都在“每一种初献”范围内
  choice: 凡是……初熟之物，以及……头生的
  alternative: 把榨酒池、禾场、牛群和羊群的一切初产都……
  rationale: 原文以单数集合名词ἀπαρχή统摄各类初产。中文按农产和牲畜的惯用说法分译，更易懂而不改变献纳范围。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“所以”承接上文；以“都要取来，献给”再现λαβὼν δώσεις的动作关系。经文中的“你”依希腊语单数命令表达个人责任，“你们的大祭司”则保留原文复数所属群体。
