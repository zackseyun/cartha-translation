source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὡσαύτως κεράμιον οἴνου ἢ ἐλαίου ἀνοίξας, τὴν ἀπαρχὴν λαβὼν δὸς τοῖς προφήταις·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/006.yaml
  text: Likewise, when you open a jar of wine or oil, take the firstfruits and give them to the prophets.
translation:
  language: zh_hans
  text: 同样，你打开一罐酒或油时，要取出初熟的那一份，给先知们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: 同样
  rationale: 承接上文同类规定，简洁体现“照样、同样”的关系。
- source_word: κεράμιον
  choice: 一坛
  rationale: 指盛酒或油的陶制容器；“坛”符合中文对这类容器的自然称呼，又不必限定其精确形制。
- source_word: ἀπαρχή
  choice: 初熟之物
  rationale: 这是献上最先出产之份的宗教性用语；采用“初熟之物”保留其献祭和奉献背景，而不把它误解为整坛内容的普通“第一份”。
- source_word: προφήταις
  choice: 先知
  rationale: 按早期基督教语境直译，指本段所述接受供给的先知。
theological_decisions:
- issue: ἀπαρχή在液体语境中的数与具体所指
  choice: 译作单数集合概念“初熟之物”
  alternative: 初熟果子；初产的一份；初熟之物的一份
  rationale: 希腊文为单数，但可表示作为奉献类别的“初熟之物”。中文用集合性表达，既不强行改成复数，也不把酒或油实体化为“果子”；其具体取用数量原文未说明，予以保留。
- issue: δός所表达的给予是否应译为祭献术语
  choice: 译作“献给”
  alternative: 给；交给
  rationale: 上下文是把初熟之物供给先知，“献给”能体现奉献性质，同时不额外断定这是正式圣殿祭礼。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“开一坛酒或油”依照汉语习惯表达开启盛装酒或油的容器；保留原文简洁的命令句结构。
