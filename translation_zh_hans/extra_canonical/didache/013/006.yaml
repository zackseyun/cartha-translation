review_pass:
  verdict: revise
  source_fidelity: “同样”准确承接Ὡσαύτως；“先知”也正确对应τοῖς προφήταις。不过，“初熟之物”在现代汉语中主要使人想到刚成熟的农产品，在“酒或油”的容器已开启这一语境下不够明确地表达ἀπαρχή所指的当献上的最先一份。
  naturalness: “开一坛酒或油时”可理解，但“打开一罐酒或油时”更符合现代汉语对容器的通常说法；将“初熟之物”明确为“初熟的那一份”也更自然，同时保留原文未说明其具体数量的余地。
  terminology: 将ἀπαρχή译为“初熟的那一份”保留其奉献/初熟供物的语义，不把它误作普通的“第一份”，也不限定为“果子”。“给先知们”忠实于δὸς τοῖς προφήταις，避免“献给”在中文里可能暗示向神明举行仪式性献祭。
  issues:
  - severity: medium
    issue: “初熟之物”在酒、油容器的语境中指向不够清楚。
    rationale: ἀπαρχή是应献出的初熟供物／最先的一份；译文宜体现其“份额”性质，而不把酒或油误解成尚在生长、刚成熟的物品。
  - severity: low
    issue: “开一坛酒或油”略显口语搭配不顺。
    rationale: 原文是打开盛酒或油的陶罐；“打开一罐酒或油”在现代标准汉语中更顺畅，且不改变容器或内容物的关系。
  revised_text: 同样，你打开一罐酒或油时，要取出初熟的那一份，给先知们。
