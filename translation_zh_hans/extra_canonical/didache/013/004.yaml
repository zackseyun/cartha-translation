lexical_decisions:
- source_word: Ἐὰν δὲ μὴ ἔχητε
  choice: 但如果你们中间没有
  rationale: 保留条件句及转折关系；补出“中间”以自然表达群体中没有先知这一含义，并未增添原文所无的受词。
- source_word: προφήτην
  choice: 先知
  rationale: 采用通行且准确的宗教与历史称谓。
- source_word: δότε
  choice: 就要周济
  rationale: 译出第二人称复数命令语气；“周济”在此自然表达向贫穷者施予。
- source_word: τοῖς πτωχοῖς
  choice: 穷人
  rationale: 与格表示给予的对象，译为“周济穷人”；保持复数的群体含义。
theological_decisions:
- issue: 所给予之物是否应明确补出
  choice: 不补“它”或具体物品
  alternative: 把上下文所指之物补译为“它”
  rationale: 本节希腊文本没有直接受词；不明说所给之物，可避免将上下文推断写入正文，并保留原文的简洁与省略。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“你们中间”使 ἔχητε προφήτην 的群体语境在中文中自然；“就要”清楚承接条件句中的命令。
