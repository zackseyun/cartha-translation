  yaml_path: translation/extra_canonical/didache/013/002.yaml
  text: Likewise a true teacher is also himself worthy, like the worker, of his food.
translation:
  language: zh_hans
  text: 同样，真正的教师也配得自己的食物，正如工人一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διδάσκαλος ἀληθινός
  choice: 真正的教师
  rationale: 直译其核心含义，既保留“真实、名副其实”的限定，也符合现代汉语表达。
- source_word: ἄξιος
  choice: 配
  rationale: 表达“有资格、理当获得”的含义，并保留原文对教师应受供养的正当性判断。
- source_word: ὁ ἐργάτης
  choice: 工人
  rationale: 采用普通而宽泛的对应词，不把语义限缩为特定行业的劳动者。
- source_word: τῆς τροφῆς αὐτοῦ
  choice: 得到自己的食物
  rationale: τροφῆς 指食物或供养；正文保留具体的“食物”，并用“得到”使汉语句法自然。
theological_decisions:
- issue: 教师与工人所得供养的类比
  choice: 也配像工人一样得到自己的食物
  alternative: 也像工人一样配得供养
  rationale: 选择保留原文“食物”的具体意象，并维持“教师也同样配得”的强调，不将其扩展为更宽泛的制度性报酬。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“同样”承接上文；“也”对应 καὶ αὐτός 的强调。
