  text: Εἰ δ᾽ οὐ θέλει οὕτω ποιεῖν, χριστέμπορός ἐστι· προσέχετε ἀπὸ τῶν τοιούτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/005.yaml
  text: But if he is not willing to do so, he is a Messiah-trader; beware of such people.
translation:
  language: zh_hans
  text: 但他若不肯这样做，就是个拿弥赛亚做买卖的人[a]；你们要提防这等人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“弥赛亚贩子”，指借弥赛亚之名牟利的人。
    reason: 原文χριστέμπορος是罕见而尖锐的复合词；脚注说明其字面商业意象和贬义色彩。
lexical_decisions:
- source_word: χριστέμπορος
  choice: 拿弥赛亚做买卖的人
  rationale: 这是由“χριστός”（弥赛亚）和与商贸有关的词素构成的贬义复合词，指借弥赛亚之名谋利的人。此译保留原文鲜明的商业意象，也比生造汉语复合词更易懂。
- source_word: προσέχετε ἀπὸ
  choice: 提防
  rationale: 该表达在此表示警戒并远离某类人；“提防”简洁、庄重，符合劝诫语气。
- source_word: τῶν τοιούτων
  choice: 这等人
  rationale: 保留原文对同类人的概括，而不限于前述单独一人。
theological_decisions:
- issue: χριστέμπορος中χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: χριστός在该复合词中仍保有称号意义；译作“弥赛亚”可清楚呈现其语义，并与所提供的POB审定措辞一致，不额外引入教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“不肯”传达οὐ θέλει的意愿含义；分号保留判断与警告之间的紧密推进。
