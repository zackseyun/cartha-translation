source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου δεχξήσθω, ἔπειτα δὲ δοκιμάσαντες αὐτὸν γνώσεσθε· σύνεσιν γὰρ ἕξετε δεξιὰν καὶ ἀριστεράν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/001.yaml
  text: But let everyone who comes in the name of the Lord be received; then, after testing him, you will know, for you will have understanding of right and left.
translation:
  language: zh_hans
  text: 凡奉主名而来的人，都要接待；随后，考验过他之后，你们就会知道[a]，因为你们有辨别左右的悟性。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就会认清他。”
    reason: 原文“知道”没有明说宾语，但可从上下文把受考验的来客理解为其隐含对象。
lexical_decisions:
- source_word: ἐν ὀνόματι Κυρίου
  choice: 奉主的名
  rationale: 既保留“在主名里／以主名义”的宗教语义，也符合现代汉语中表示凭主名义而来的自然说法。
- source_word: δεχθήτω
  choice: 要接待
  rationale: 该被动命令式表达对来者予以接纳和款待；“接待”简明自然，并符合本段论旅行者的语境。
- source_word: δοκιμάσαντες
  choice: 要考验
  rationale: 表示经过查验、试验而辨明真伪，不只是一般观察。
- source_word: γνώσεσθε
  choice: 就会知道
  rationale: 原文动词没有明说宾语，采用绝对用法，保留“便会知道／明白实情”的开放性，不把前面的 αὐτόν 强行兼作其宾语。
- source_word: σύνεσιν ... δεξιὰν καὶ ἀριστεράν
  choice: 分辨左右的悟性
  rationale: 保留“右与左”的具体意象，同时用“分辨”使其作为鉴别能力的含义在现代汉语中可懂。
theological_decisions:
- issue: 接待来客与查验来客之间的张力
  choice: 先无条件表述“都要接待”，随后保留“要考验他”
  alternative: 把接待限制为通过考验之后
  rationale: 原文次序明确：先接待，继而查验；不应为了消除实践上的张力而重排或附加条件。
- issue: γνώσεσθε 是否以“他”为宾语
  choice: 正文译作无明说宾语的“就会知道”
  alternative: “就会认清他”
  rationale: αὐτόν 直接受 δοκιμάσαντες 支配，而 γνώσεσθε 本身没有明说宾语；正文因此保留原文句法上的开放性，另一理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“凡……的人”与“都要……”保留普遍命令的力度；“分辨左右的悟性”刻意保留原文较不寻常的左右意象，不将其完全解释性地改写为“辨别是非的能力”。
