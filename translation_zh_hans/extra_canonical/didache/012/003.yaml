  text: Εἰ δὲ θέλει πρὸς ὑμᾶς καθίσαι, τεχνίτης ὤν, ἐργαζέσθω καὶ φαγέτω·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/003.yaml
  text: But if he wants to settle among you and is a craftsman, let him work and eat.
translation:
  language: zh_hans
  text: 但如果他愿意在你们中间住下来，又有手艺，就应当做工吃饭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσαι
  choice: 住下来
  rationale: 此处结合 πρὸς ὑμᾶς 表示在群体中定居或较长期留下；译为“住下来”自然且不夸大永久定居之意。
- source_word: τεχνίτης
  choice: 有手艺
  rationale: 指掌握某种技艺、能够靠手艺谋生的人；“有手艺”比限定为某一类“工匠”更宽泛，也更符合语境。
- source_word: ἐργαζέσθω καὶ φαγέτω
  choice: 就应当做工吃饭
  rationale: 两个第三人称命令式表达群体规范：“让他/应当让他工作并吃饭”；中文用“应当”保留劝令语气，“做工吃饭”简洁呈现以劳动维生的关系。
theological_decisions:
- issue: 两个命令式的责任主体与力度
  choice: 就应当做工吃饭
  alternative: 就让他做工，也让他吃饭
  rationale: 希腊文形式上可理解为对该人的要求，也可能蕴含群体准许其劳动维生。正文采用较自然的规范性表达，不额外断定群体必须供给其饭食。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在你们中间住下来”保留群体语境；“做工吃饭”简明自然，并维持原文的命令/规范语气。
