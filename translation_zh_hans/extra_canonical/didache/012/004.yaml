base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/004.yaml
  text: But if he has no trade[a], according to your understanding make provision for how a Christian may live among you without being idle.
translation:
  language: zh_hans
  text: 但如果他没有手艺，你们要按自己的判断作出安排，使一个基督徒[a]能在你们中间生活而不闲着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他能作为基督徒在你们中间生活而不闲着。”
    reason: 希腊文χριστιανός可理解为泛指的主语“一个基督徒”，也可理解为说明前述来客“他”的身份；保留句法歧义。
lexical_decisions:
- source_word: τέχνην
  choice: 手艺
  rationale: 此处指可用来谋生的技能或行业；“手艺”自然承接上文接待旅客的处境，也不把含义限定为现代意义上的职业。
- source_word: κατὰ τὴν σύνεσιν ὑμῶν
  choice: 按自己的判断
  rationale: σύνεσις在此指理解、判断或明辨能力；该表达要求群体依具体情况作审慎安排。
- source_word: προνοήσατε
  choice: 作出安排
  rationale: 该动词在此有预先考虑、设法照料之意；“作出安排”能自然连接后面的πῶς从句。
- source_word: ἀργός
  choice: 游手好闲
  rationale: 指不做工、闲散无事；此译保留其负面伦理色彩，并与谋生手艺的上下文相符。
theological_decisions:
- issue: χριστιανός在句中的句法作用
  choice: 使他作为基督徒住在你们中间
  alternative: 使一个基督徒住在你们中间
  rationale: 上下文谈论同一位来客，因此把χριστιανός理解为对“他”身份的表述较连贯；脚注保留其可作一般主语理解的可能性，不将句法歧义绝对化。
translation_notes:
  register: 采用现代、庄重而通俗的劝诫语体。“作出安排”体现群体实际照顾与督促谋生的责任；“游手好闲”清楚传达不劳动的负面含义。
