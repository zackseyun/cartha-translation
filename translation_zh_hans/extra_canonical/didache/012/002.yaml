  source_fidelity: 草稿主文“但除非有需要，他不可在你们那里停留两三天”在汉语中通常表示：没有需要时，他不得停留两三天；这没有表达原文“不得停留，惟在有需要时可停留两三天”的限时许可。原文的οὐ……εἰ μὴ将可允许的停留限于两三天，末尾ἐὰν ᾖ ἀνάγκη说明此有限停留以需要为条件，不能成为超出期限的例外。
  naturalness: “来的人若是过路的旅客，就要尽力帮助他”自然清楚。“但若有需要，他也只能在你们那里停留两三天”能以现代汉语明确表达条件与最长时限，且保持训诫语体。
  terminology: “过路的旅客”“尽力帮助”“在你们那里停留”均恰当。将“不可”改为“也只能”可避免否定词与“除非”的汉语辖域歧义，同时准确传达限制。
