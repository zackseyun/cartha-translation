source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰμὲν παρόδιος ἐστιν ὁ ἐρχόμενος, βοηθεῖτε αὐτῷ ὅσον δύνασθε· οὐ μενεῖ δὲ πρὸς ὑμᾶς εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/002.yaml
  text: If the one who comes is a traveler[a], help him as much as you can; but he shall not remain with you except for two or three days, if there is a need.
translation:
  language: zh_hans
  text: 来的人若是过路的旅客，就要尽力帮助他；但若有需要，他也只能在你们那里停留两三天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“……但他不可在你们那里停留，若有需要，也只可停留两三天。”
    reason: 希腊文“οὐ……εἰ μὴ……ἐὰν ᾖ ἀνάγκη”的语序可按汉语重组；两种译法都表示仅在有需要时可停留，且不得超过两三天。
lexical_decisions:
- source_word: παρόδιος
  choice: 过路的旅客
  rationale: 指正在旅途中、途经此地的人；“过路的旅客”比单说“旅客”更能体现其暂时途经的性质。
- source_word: βοηθεῖτε
  choice: 要……帮助
  rationale: 保留希腊文复数命令语气，同时使用自然的现代汉语表达。
- source_word: ὅσον δύνασθε
  choice: 尽力
  rationale: 自然而准确地表达“在你们能力所及的范围内”。
- source_word: μενεῖ πρὸς ὑμᾶς
  choice: 在你们那里停留
  rationale: 符合接待旅客的语境，也保留与群体同住或逗留之意。
- source_word: ἐὰν ᾖ ἀνάγκη
  choice: 若确有需要
  rationale: 表示停留两三天须以实际需要为条件，而不是允许超过这一期限的例外。
theological_decisions:
- issue: ἐὰν ᾖ ἀνάγκη与停留期限的关系
  choice: 将“若确有需要”理解为允许停留两三天的条件
  alternative: 把它理解成可因需要而突破两三天的期限
  rationale: 希腊文οὐ…εἰ μὴ结构将允许的停留限定为两三天；末尾条件说明这种有限停留是在有需要时发生，并不构成延长期限的漏洞。
- issue: εἰ μὲν与后半句δὲ的对比
  choice: 译作“若是……；但……”
  alternative: 译作“但若是……”并弱化第二分句的转折
  rationale: 本节εἰ μὲν开启条件，且与下一节εἰ δὲ形成篇章对应；本节第二分句的δὲ则应明确体现为“但”。
translation_notes:
  register: 采用现代、庄重而易懂的群体训诫语体。“过路的旅客”凸显暂时途经；用“不可以”表达规范性限制。主句保留原文条件结构的贴近形式，脚注提供更清晰的限制性释义。
