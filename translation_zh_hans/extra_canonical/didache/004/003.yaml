source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ ποιήσεις σχίσμα, εἰρηνεύσεις δὲ μαχομένους· κρινεῖς δικαίως, οὐ λήψῃ πρόσωπον ἐλέγξαι ἐπὶ παραπτώμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/003.yaml
  text: You shall not cause division[a], but you shall reconcile those who are fighting. You shall judge justly; you shall not show partiality in reproving transgressions.
translation:
  language: zh_hans
  text: 不可制造分裂[a]，却要使相争的人和好。要公正地判断；在责备过犯时，不可徇情面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“制造分争”。这里指群体内部的分争或分裂，并不特指后世制度意义上的宗派分裂。
    reason: 说明 σχίσμα 在早期基督徒群体语境中的词义，并保留英语审校记录所提示的“make a schism”这一替代表达的实质。
lexical_decisions:
- source_word: σχίσμα
  choice: 分裂
  rationale: 该词在早期基督徒群体的语境中指裂痕、分争或群体内部的分裂；用“分裂”可避免现代汉语“宗派分裂”可能带入的后世制度性含义。
- source_word: εἰρηνεύσεις ... μαχομένους
  choice: 使争斗的人和好
  rationale: 动词在此为及物用法，表达促成正在争斗者之间的和平；“使……和好”比单说“劝和”更完整地传达这一结果导向。
- source_word: κρινεῖς δικαίως
  choice: 按公义判断
  rationale: 保留判断或裁断的司法色彩，同时以自然现代汉语表达副词 δικαίως 的公正、公义之意。
- source_word: οὐ λήψῃ πρόσωπον
  choice: 不可徇情面
  rationale: 这是闪语背景下“接受人的脸面”的惯用表达，意为因人的身份、关系或情面而偏袒；“徇情面”在中文中简洁自然。
- source_word: παραπτώμασιν
  choice: 过犯
  rationale: 该词指越轨、失足或具体过错；“过犯”保留其道德分量，又不将其过度限定为某种制度化罪名。
theological_decisions:
- issue: 责备过犯与不偏待人的关系
  choice: 将“不徇情面”明确置于责备人的过犯这一情境中
  alternative: 把后半句理解为两个较松散的命令：“不可偏待人；要责备过犯。”
  rationale: 希腊文不定式 ἐλέγξαι 与“不接受人的脸面”紧密相连，更自然地表示在责备或指证过犯时不可偏袒；译文保留群体纪律与公正之间的张力，而不引入特定教会制度。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“不可……却要……”呈现原文的对照；“使争斗的人和好”避免生硬直译；“就人的过犯加以责备时，不可徇情面”兼顾希腊文结构与自然汉语。
