  text: Ἐκζητήσεις δὲ καθ’ ἡμέραν τὰ πρόσωπα τῶν ἁγίων, ἵνα ἐπαναπαῇ τοῖς λόγοις αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/002.yaml
  text: And you shall seek out day by day the presence of the saints, so that you may find rest in their words.
translation:
  language: zh_hans
  text: 你要天天寻访圣徒，好从他们的话语中得安息。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐκζητήσεις
  choice: 寻访
  rationale: 此词表示认真寻找、寻求；结合宾语“圣徒的面”，这里是主动寻找并亲近他们，因此译作自然且有人际意味的“寻访”。
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 准确表达“每日、日复一日”，也符合现代汉语劝诫文体。
- source_word: τὰ πρόσωπα τῶν ἁγίων
  choice: 圣徒
  rationale: 字面是“圣徒的面”，在此以“面”指本人或亲身相见。中文若直译“面容”容易误解为观察外貌，故在“寻访”中体现寻找他们本人、与他们相交之意。
- source_word: ἐπαναπαῇ
  choice: 得安息
  rationale: 该动词有安歇、获得休息或慰藉之意；“得安息”保留其较强的属灵和内在意味，不把它缩减为单纯的身体休息。
- source_word: τοῖς λόγοις αὐτῶν
  choice: 从他们的话语中
  rationale: 希腊语与格可表达凭借、领域或所依托之处；译作“从……中”自然地传达在他们的话语里获得安息，同时不限定为某种特定教导形式。
theological_decisions:
- issue: οἱ ἅγιοι所指群体
  choice: 圣徒
  alternative: 圣洁的人／信徒
  rationale: “圣徒”保留早期基督教群体称谓及其神学色彩，但不进一步限定为已故、受封或某一特定阶层的人。
- issue: 在圣徒话语中“得安息”的性质
  choice: 保留“得安息”的开放含义
  alternative: 得安慰／感到安心／灵里得安息
  rationale: 原文没有明确说明这是心理安慰、属灵安息还是一般性的休憩，因此不添加“灵里”等解释性限定。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“你要”呈现原文将来时在训诲语境中的命令或规范作用；“寻访”同时承载主动寻找与亲身接触的含义，避免生硬直译“圣徒的面”。
