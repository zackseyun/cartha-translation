source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὑμεῖς δὲ οἱ δοῦλοι ὑποτάγησεθε τοῖς κυρίοις ὑμῶν ὡς τύπῳ Θεοῦ ἐν αἰσχύνῃ καὶ φόβῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/011.yaml
  text: But you servants shall be subject to your masters as to a representative of God[a], in reverence and fear.
translation:
  language: zh_hans
  text: 然而，你们作奴仆的，要怀着羞惭和惧怕顺服自己的主人，如同对待上帝的代表那样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同对待上帝的范型（或形像）那样。”这里的希腊词τύπος可指样式、印记、形像或范型；在此权柄关系的语境中，也可指代表。
    reason: 保留τύπος的词义幅度，同时说明正文“代表”是依上下文作出的译法。
lexical_decisions:
- source_word: δοῦλοι
  choice: 作奴仆的
  rationale: 该词指处于奴役或隶属身份的人；译作“奴仆”既准确呈现古代社会身份，也比泛化的“仆人”更忠实。
- source_word: ὑποτάγησεθε
  choice: 要顺服
  rationale: 表达服从权柄、置身其下的意思；汉语“顺服”自然且保留命令语气。
- source_word: κύριοι
  choice: 主人
  rationale: 在奴仆语境中指拥有支配权的主人，与δοῦλοι形成明确对应。
- source_word: τύπῳ Θεοῦ
  choice: 上帝的代表
  rationale: τύπος用于人在权柄关系中，可指体现或代表某位者的形象；“代表”清楚传达本句关系，同时以脚注保留“形像/范型”的词义空间。
- source_word: αἰσχύνῃ
  choice: 敬重
  rationale: 该词本义涉及羞耻、羞惭，在此与φόβος并列，用于对待主人的态度，语境上可表达因知耻而有的敬重或恭谨；脚注保留其较字面的可能译法。
- source_word: φόβῳ
  choice: 惧怕
  rationale: 保留φόβος较强的“害怕、惧怕”含义，不弱化为一般的尊敬。
theological_decisions:
- issue: 主人被称为“上帝的τύπος”所表达的关系
  choice: 译为“如同顺服上帝的代表”
  alternative: “如同顺服上帝的形像（或范型）”
  rationale: 本句将主人视为在权柄关系中代表上帝的人，但τύπος本身也可指形像、印记或范型；正文采用自然且合乎语境的表达，脚注保留词语本身的多义性，不把它扩展为关于主人本质或道德品质的断言。
- issue: 是否将φόβος弱化为纯粹的敬意
  choice: 保留“惧怕”
  alternative: “敬畏”
  rationale: 原文同时使用αἰσχύνη与φόβος；若两者都处理为敬意，会抹平并列词之间的张力，因此分别译作“敬重”和“惧怕”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“奴仆—主人”明确保留原文的古代社会关系；句式简洁，并以“心存……”自然表达ἐν加与格所描述的态度。
