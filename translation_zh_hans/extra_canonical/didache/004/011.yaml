revisions:
- from: 但你们作奴仆的，要顺服自己的主人，如同顺服上帝的代表[a]，心存敬重[b]和惧怕。
  to: 然而，你们作奴仆的，要怀着羞惭和惧怕顺服自己的主人，如同对待上帝的代表那样[a]。
  rationale: 修订将αἰσχύνῃ从“敬重”改为“羞惭”，以忠实保留原文与φόβῳ（“惧怕”）并列的双重态度；其余主要术语维持原有处理。正文以“如同对待上帝的代表那样”清楚表达ὡς τύπῳ Θεοῦ的比较关系，脚注则保留该词的争议性和较字面的替代理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:24:04Z'
