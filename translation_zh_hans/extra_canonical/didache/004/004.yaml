  yaml_path: translation/extra_canonical/didache/004/004.yaml
  text: You shall not be double-minded whether it will be or not[a].
translation:
  language: zh_hans
  text: 不可心怀二意，犹疑某事会不会发生。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可犹疑某事会不会发生。”
    reason: διψυχέω字面含有“有两种心意、摇摆不定”之意；在此带“是否”式间接疑问，也可按语境译为“犹疑”或“怀疑”。
lexical_decisions:
- source_word: διψυχήσεις
  choice: 心怀二意，疑惑
  rationale: διψυχέω字面含有“有两种心意、摇摆不定”之意，在此后接间接疑问句，语境中也有“疑惑、拿不准”的功能。“心怀二意，疑惑”既保留原词鲜明的“两心”意象，也使现代汉语句法自然。
- source_word: πότερον … ἢ οὔ
  choice: 究竟会不会
  rationale: 这是希腊语表示二选一的间接疑问结构；“究竟会不会”准确而自然地表达“是否会发生”。
- source_word: ἔσται
  choice: 会成就
  rationale: ἔσται本义为“将会是、将会发生”。此处没有明说主语，“成就”保留对某事将来实现与否的开放性，并以“这事”补足现代汉语表达所需的指称。
theological_decisions:
- issue: 未明说之事是否必然指神的应许或末世事件
  choice: 译作不特定的“这事”，不明说具体所指
  alternative: 译作“神的应许会不会实现”或“那日会不会来到”
  rationale: 原句只用第三人称单数ἔσται，并未明确所指；不应在正文中加入特定神学解释。
- issue: διψυχέω侧重“两心”还是“怀疑”
  choice: 并列呈现“心怀二意，疑惑”
  alternative: 只译“不可疑惑”或“不可三心二意”
  rationale: 原词兼有内心分裂、摇摆和怀疑的语义；并列表达可保留其张力，避免只取一面。
translation_notes:
  register: 采用现代、庄重而易懂的命令语气。“不可”与《十二使徒遗训》本段连续训诫的文体相称；避免生硬直译为“不可成为双心的人”，同时用“心怀二意”保留希腊原词的形象。
