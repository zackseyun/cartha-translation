  text: Οὐ μὴ ἐγκαταλίπῃς ἐντολὰς Κυρίου, φυλάξεις δὲ ἃ παρέλαβες, μήτε προστιθεὶς μήτε ἀφαιρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/013.yaml
  text: You shall never forsake the commandments of the Lord, but you shall keep what you received, neither adding nor taking away.
translation:
  language: zh_hans
  text: 你绝不可离弃主的诫命，却要遵守你所领受的，既不增添，也不删减。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ ἐγκαταλίπῃς
  choice: 你绝不可离弃
  rationale: οὐ μή加虚拟式表达强烈禁止；“绝不可”保留其强调语气，“离弃”准确传达ἐγκαταλείπω。
- source_word: ἐντολὰς Κυρίου
  choice: 主的诫命
  rationale: 采用现代中文中自然、庄重且沿用已久的对应表达。
- source_word: φυλάξεις
  choice: 要遵守
  rationale: φυλάσσω在诫命语境中指谨守、遵行；“遵守”清楚自然。
- source_word: ἃ παρέλαβες
  choice: 你所领受的
  rationale: παραλαμβάνω指从传统或教导中接受、承接；“领受”保留传承意味。
- source_word: μήτε προστιθεὶς μήτε ἀφαιρῶν
  choice: 既不增添，也不删减
  rationale: 保留两个并列分词的对称结构；“增添／删减”符合现代书面汉语。
theological_decisions:
- issue: “你所领受的”具体所指
  choice: 保留概括表达，不明确限定为某一文本或传统范围
  alternative: 译作“你所领受的教导”或“这些诫命”
  rationale: 希腊文仅用关系代词ἃ，没有明说宾语类别；保留原文的指涉开放性，避免加入解释。
- issue: 命令语气的强度
  choice: 前句用“绝不可”，后句用“要”
  alternative: 两句均用普通的“不可／要”
  rationale: οὐ μή表达特别强烈的否定，而φυλάξεις在此具有命令效力；区别处理能反映原文语气。
translation_notes:
  register: 采用现代标准普通话简体中文，句式庄重而易懂；以“却”呈现δέ的转折，以“既不……也不……”保持末句的平衡和节奏。
