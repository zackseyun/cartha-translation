  text: If you have anything, you shall give through your hands a ransom for your sins.
translation:
  language: zh_hans
  text: 如果你有，就要亲手给出，作为你罪的赎价。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν ἔχῃς
  choice: 如果你有财物
  rationale: 原文直译为“如果你有”，宾语省略；结合“献出”的语境，以“财物”自然表达所拥有且可施舍之物，同时不限定具体种类。
- source_word: διὰ τῶν χειρῶν σου
  choice: 亲手
  rationale: 保留“借着你的双手”的行动意象，并以现代汉语自然表达本人实际施予。
- source_word: δώσεις
  choice: 就要……献出
  rationale: 体现将来时在训诫语境中的命令意味；“献出”比单纯“给”更适合其郑重语气。
- source_word: λύτρωσιν
  choice: 赎价
  rationale: 保留该词“赎金、赎价”的核心比喻，不将其弱化为一般的“补偿”或预先解释为某种特定教义。
- source_word: ἁμαρτιῶν σου
  choice: 你罪的
  rationale: 忠实表达复数“你的罪”；汉语集合名词“罪”已可涵盖多项罪过。
theological_decisions:
- issue: 施舍与罪之赎价的关系
  choice: 作为你罪的赎价
  alternative: 使你的罪得赦免
  rationale: 原文使用名词λύτρωσις，并未明说赦免的机制或结果；直保留“赎价”可维持原文的神学张力，避免把句子解释成特定的功德或赦罪教义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“亲手献出”兼顾希腊文手的意象与自然汉语；不添加原文没有的受赠对象或教义说明。
