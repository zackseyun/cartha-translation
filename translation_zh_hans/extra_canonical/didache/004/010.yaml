revisions:
- from: 不可怀着苦毒，命令那与你仰望同一位上帝的男仆或女仆[a]，免得他们不再敬畏那位在你们双方之上的上帝；因为他来召人，不是按人的身份，而是临到圣灵所预备的人。
  to: 不可怀着苦毒，命令那与你一同仰望同一位上帝的男仆或女仆[a]，免得他们竟不敬畏那位在你们双方之上的上帝；因为他来召人，并不是按外在身份而来，乃是临到圣灵所预备的人。
  rationale: 修订仅除去“不再”所额外加入的时间性，调整主仆所受定语的中文语序，并使末句的“来”与“临到”对照更清楚。“竟不敬畏”力求表达原文否定结果句的警告力度，但不机械重叠否定。
