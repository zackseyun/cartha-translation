  terminology: “上帝”“圣灵”“男仆或女仆”均符合现代中文基督教语境和原文词义范围。“外在身份”比“人的身份”更能体现κατὰ πρόσωπον所指的外在身份、面貌或社会地位，而不将其限定为人的身份这一单一概念。
