source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιτάξεις δούλῳ σου ἢ παιδίσκῃ, τοῖς ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν, ἐν πικρίᾳ σου, μήποτε οὐ μὴ φοβηθήσονται τὸν ἐπ᾽ ἀμφοτέροις Θεόν· οὐ γὰρ ἔρχεται κατὰ πρόσωπον καλέσαι, ἀλλ᾽ ἐφ᾽ οὓς τὸ πνεῦμα ἡτοίμασεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/010.yaml
  text: You shall not[a], in your bitterness, command your servant or female servant who hope in the same God, lest they should fail to fear the God who is over both; for he does not come to call according to outward standing, but upon those whom the Spirit has prepared.
translation:
  language: zh_hans
  text: 不可怀着苦毒，命令那与你一同仰望同一位上帝的男仆或女仆[a]，免得他们竟不敬畏那位在你们双方之上的上帝；因为他来召人，并不是按外在身份而来，乃是临到圣灵所预备的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男仆或女仆”也可译作“男奴或女奴”。原文中“与你一同仰望同一位上帝的”直接修饰男仆或女仆。
    reason: 保留古代奴隶身份的词义范围，并说明希腊语修饰关系，以免将“怀着苦毒”误接到仆人身上。
lexical_decisions:
- source_word: δούλῳ σου ἢ παιδίσκῃ
  choice: 你的男仆或女仆
  rationale: 两词在当时可指奴隶身份的男女家仆；正文采用现代读者自然可懂的“男仆或女仆”，脚注保留“奴仆”的可能译法。
- source_word: ἐν πικρίᾳ σου
  choice: 怀着苦毒
  rationale: 保留 πικρία 的强烈负面情感和态度，不弱化为一般的严厉或怒气。
- source_word: ἐλπίζουσιν
  choice: 仰望
  rationale: 表达对同一位上帝怀有盼望并信靠他，较单纯“希望”更符合此处宗教语境。
- source_word: κατὰ πρόσωπον
  choice: 按人的身份
  rationale: 该短语字面涉及“面貌/脸面”，语境指依据外在地位或身份待人；此译自然且不把含义限缩为外貌。
- source_word: ἐφ᾽ οὓς
  choice: 临到……的人
  rationale: 保留介词 ἐπί 的方向性，与前面的“来”相应，避免仅译成抽象的“召那些人”。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 此处带定冠词并承担预备人的神圣行动，中文基督教语境自然理解为圣灵。
theological_decisions:
- issue: 上帝对主人与仆人的共同权柄
  choice: 那位在你们双方之上的上帝
  alternative: 那位同是你们双方之主的上帝
  rationale: 贴近 ἐπ᾽ ἀμφοτέροις，保留空间性隐喻及上帝共同居于二者之上的张力，不额外加入原文没有的“主”。
- issue: κατὰ πρόσωπον 所指
  choice: 不是按人的身份
  alternative: 不是看人的外貌／情面
  rationale: 上下文涉及主仆社会地位，因此“身份”最能传达外在等级不构成蒙召依据，同时避免加入特定宗派解释。
- issue: 召者与圣灵的关系
  choice: 保留“他”与“圣灵”两个语法主体
  alternative: 把二者明确合并为同一主体
  rationale: 原文先以隐含主语“他”说来召人，后以“圣灵”为预备者；译文不替原文解决二者关系。
- issue: 否定结果句的力度
  choice: 免得他们不再敬畏
  alternative: 免得他们绝不敬畏
  rationale: μήποτε οὐ μή 的组合在此表达受恶劣对待后可能失去敬畏的警告；中文用“不再”自然呈现这种结果，不机械叠加希腊语否定。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“不可”对应禁令语气；以“你们双方”明确主人与仆人在上帝面前共同受其权柄约束。避免过度古雅，也不淡化古代主仆制度的现实。
