  text: Μὴ γίνου πρὸς μὲν τὸ λαβεῖν ἐκτείνων τὰς χεῖρας, πρὸς δὲ τὸ δοῦναι συσπῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/005.yaml
  text: Do not be one who stretches out his hands to receive[a], but draws them in to avoid giving.
translation:
  language: zh_hans
  text: 不要成为这样的人：领取时伸出双手，施予时却把手缩回。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνου
  choice: 不要成为这样的人
  rationale: 保留“不要成为／不要作”的人格与习惯导向，比单纯命令某一次行为更贴近原文。
- source_word: ἐκτείνων τὰς χεῖρας
  choice: 伸手
  rationale: 原文直译为“伸出双手”；汉语以“伸手”自然表达领取时主动索取的动作。
- source_word: λαβεῖν
  choice: 领取
  rationale: 表达“接受、取得”，并与后文“施予”形成清楚对照，语气较“索取”中性，避免额外强化贪婪含义。
- source_word: δοῦναι
  choice: 施予
  rationale: 对应“给予”，用词庄重而通俗，适合教诲体。
- source_word: συσπῶν
  choice: 把手缩回
  rationale: 保留收拢、缩回双手的形象；在汉语语境中自然传达临到给予时退缩吝惜之意。
theological_decisions:
- issue: 是否把后半句明说为“为避免给予”
  choice: 采用“到了施予时却把手缩回”，让动作与语境表达不肯给予
  alternative: 译作“却缩手以免施予”
  rationale: 希腊文只有“对于给予则收拢（双手）”，没有独立的“避免”一词；本译保留形象和隐含批评，不把推论写成明说。
translation_notes:
  register: 采用现代、凝练而庄重的劝诫语体；以“伸手／缩回”保持原文鲜明的肢体对照和适合口述的节奏。
