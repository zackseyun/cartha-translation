source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν ἐκκλησίᾳ ἐξομολογήσῃ τὰ παραπτώματά σου, καὶ οὐ προσελεύσῃ ἐπὶ προσευχήν σου ἐν συνειδήσει πονηρᾷ. Αὕτη ἐστὶν ἡ ὁδὸς τῆς ζωῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/014.yaml
  text: In the assembly you shall confess your transgressions, and you shall not come to prayer with an evil conscience. This is the way of life.
translation:
  language: zh_hans
  text: 你要在会众中承认自己的过犯；不可怀着邪恶的良心来祷告。这就是生命之道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: 在会众中
  rationale: 此处 ἐκκλησία 首先指聚集的信徒群体；译作“会众”比现代制度化含义较强的“教会”更贴近语境。
- source_word: ἐξομολογήσῃ
  choice: 承认
  rationale: 该动词在此指公开或明确地认罪、承认过犯；“承认”自然清楚，又不额外限定具体礼仪形式。
- source_word: παραπτώματά
  choice: 过犯
  rationale: παράπτωμα 指偏离正道、犯下的过错；“过犯”保留其道德与宗教分量。
- source_word: προσευχήν
  choice: 祷告
  rationale: 原文无物主限定，故译为一般性的“来祷告”，不增添“你的”。
- source_word: συνειδήσει πονηρᾷ
  choice: 邪恶的良心
  rationale: 较直接保留 πονηρός 的强烈道德判断以及 συνείδησις 的“良心”概念，不弱化为仅仅“内疚”。
- source_word: ἡ ὁδὸς τῆς ζωῆς
  choice: 生命之道
  rationale: 既保留“道路”的比喻，也符合本段“两条道路”教导的标题性表达。
theological_decisions:
- issue: ἐκκλησία 是指礼仪场所、制度化教会，还是聚集的群体
  choice: 译作“会众”，指聚集的群体
  alternative: 在教会中
  rationale: 原文容许“教会”之义，但在这则早期训诲中，重点是共同体聚集；“会众”避免把后世制度结构带入文本。
- issue: “承认过犯”是否特指某种正式告解圣礼
  choice: 不限定具体仪式
  alternative: 告解自己的罪过
  rationale: ἐξομολογέομαι 可用于认罪，但本句本身没有说明执行者、程序或圣礼形式，因此保留开放性。
- issue: “怀着邪恶的良心”具体指未认之罪、恶意，还是一般道德败坏
  choice: 保留原文概括性的道德表述
  alternative: 心中有愧
  rationale: “心中有愧”会把含义缩窄为主观内疚；原文 πονηρᾷ 更强，也可能指实际邪恶的内在状态。
translation_notes:
  register: 采用简洁、庄重而现代的训诫语体。“你要……；不可……”体现希腊语将来时在规范性教导中的命令功能。“来祷告”自然传达 προσελεύσῃ ἐπὶ προσευχήν，同时不加入原文没有的物主成分。
