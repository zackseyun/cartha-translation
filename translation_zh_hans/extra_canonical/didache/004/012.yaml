  text: 你要憎恨一切虚伪，以及一切不蒙主喜悦的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μισήσεις
  choice: 你要憎恨
  rationale: 保留将来时形式在训诫语境中的命令意味，并准确传达 μισέω 的强烈否定态度。
- source_word: πᾶσαν ὑπόκρισιν
  choice: 一切虚伪
  rationale: ὑπόκρισις 指虚假、伪善或装假；“虚伪”在现代汉语中自然，也能涵盖行为与态度。
- source_word: πᾶν ὃ μὴ ἀρεστὸν
  choice: 一切不蒙……喜悦的事
  rationale: 用“一切……的事”承接中性单数 πᾶν ὃ；“不蒙……喜悦”自然表达“不为……所喜悦、不讨……喜悦”。
- source_word: τῷ Κυρίῳ
  choice: 主
  rationale: κύριος 在此为信仰语境中的尊称，译作“主”简洁而符合通行用法。
theological_decisions:
- issue: “不蒙主喜悦”是否应具体化为“不合主旨意”或“主所厌恶”
  choice: 不蒙主喜悦
  alternative: 不合主旨意
  rationale: 原文只陈述“不为主所喜悦”，未明确使用“旨意”或“厌恶”；保留原有措辞可避免扩大或强化其神学含义。
translation_notes:
  register: 采用简洁、庄重而现代的训诫语体；保留“憎恨”的力度，不以较弱的“厌弃”淡化原文。
