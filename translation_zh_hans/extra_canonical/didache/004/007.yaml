base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/007.yaml
  text: You shall not hesitate to give, nor grumble while giving; for you will know who is the good giver of the reward.
translation:
  language: zh_hans
  text: 你不可在施予时迟疑，也不可一面施予一面抱怨；因为你将会知道，谁是那位美善的赏报者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διστάσεις
  choice: 迟疑不肯
  rationale: 该词表示犹豫、迟疑；结合否定命令和不定式“施予”，译为“不可迟疑不肯施予”，自然表达不可因犹豫而不施予。
- source_word: γογγύσεις
  choice: 抱怨
  rationale: 表示低声发怨言或不满；“抱怨”是现代汉语中自然、准确且易懂的对应表达。
- source_word: μισθοῦ
  choice: 赏报
  rationale: 此处指因行为所得的报偿或奖赏；“赏报”兼顾奖赏与回报的含义，又不将其限定为雇佣意义的工资。
- source_word: ἀνταποδότης
  choice: 赐人赏报的
  rationale: 该名词指作出回报或报偿者。采用动词性表达，使中文自然，同时保留“按所行给予报偿”的核心语义。
- source_word: καλὸς
  choice: 美善
  rationale: 既可表达道德上的良善，也保留原文对报偿者的正面评价，比单纯的“好”更庄重。
theological_decisions:
- issue: 报偿者的身份
  choice: 保留“是谁”的间接指称，不直接补出“上帝”
  alternative: 因为你将知道，上帝是那位美善、赐人赏报的
  rationale: 上下文很可能以此指上帝，但本节希腊文没有明说其名；保留未明言的身份，避免替原文消除含蓄性。
- issue: 报偿的性质
  choice: 译作“赏报”，不具体说明今世或末世的奖赏
  alternative: 天上的赏赐／将来的奖赏
  rationale: 原文 μισθός 未在本句限定报偿发生的时间或形式，应保持其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“一面……一面……”再现分词 διδοὺς 所表达的伴随情形；末句保留原文对报偿者身份的含蓄表达。
