id: DID.4.8
reference: Didache 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀποστραφήσῃ τὸν ἐνδεόμενον, συγκοινωνήσεις δὲ πάντα τῷ ἀδελφῷ σου καὶ οὐκ ἐρεῖς ἴδια εἶναι· εἰ γὰρ ἐν τῷ ἀθανάτῳ κοινωνοί ἐστε, πόσῳ μᾶλλον ἐν τοῖς θνητοῖς;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/008.yaml
  text: You shall not turn away the one in need, but you shall share all things with your brother, and you shall not say they are your own; for if you are sharers in what is immortal, how much more in mortal things?
translation:
  language: zh_hans
  text: 不可拒绝有需要的人，却要与你的弟兄分享一切，不可说这些是你自己的；因为你们若在不朽之事上有份，何况在必朽之物上呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστραφήσῃ
  choice: 拒绝
  rationale: 该动词在此直接支配“有需要的人”，表达转身不顾、拒绝帮助之意；译作“拒绝”符合现代汉语，又保留命令的力度。
- source_word: τὸν ἐνδεόμενον
  choice: 有需要的人
  rationale: 概括其缺乏和求助的处境，不擅自限定为贫穷者、乞求者或教会成员。
- source_word: συγκοινωνήσεις
  choice: 分享
  rationale: 表达共同参与、共同享用或使对方有份；结合“与你的弟兄”和“一切”，译作“分享”自然且不过度制度化。
- source_word: τῷ ἀδελφῷ σου
  choice: 你的弟兄
  rationale: 保留早期基督徒群体中的亲属式称谓，不改成较解释性的“信徒同伴”。
- source_word: ἐν τῷ ἀθανάτῳ
  choice: 在不朽之事上
  rationale: 希腊文为中性单数，所指可包括永生、属灵恩惠或不朽的实在；采用概括表达以保留其开放性。
- source_word: ἐν τοῖς θνητοῖς
  choice: 在必朽之物上
  rationale: 中性复数与“不朽之事”形成对照，主要指会消逝的今世财物；译文保留修辞对比而不将含义收窄为“钱财”。
theological_decisions:
- issue: “不朽之事”所指为何
  choice: 保留“不朽之事”的宽泛表达
  alternative: 明确译为“永生”或“属灵的恩赐”
  rationale: 原文没有明说具体对象；明确化会消除其可能兼指永生、救恩和属灵福分的张力。
- issue: 分享“一切”的规范范围
  choice: 直译为“分享一切”
  alternative: 译为“凡所有的都要共享”并暗示强制公有
  rationale: 原文强调不把所有物绝对据为己有并向弟兄开放，但未在本句中规定一种具体财产制度。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“不可……却要……”再现禁止与正面命令的对照；末句以“何况……呢”保留由重到轻的反问论证。
