  yaml_path: translation/extra_canonical/didache/004/009.yaml
  text: You shall not take your hand away from your son or from your daughter, but from youth you shall teach them the fear of God.
translation:
  language: zh_hans
  text: 不可把你的手从儿子或女儿身上挪开；却要从他们年幼时起教导他们敬畏上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不可把你的手从……身上挪开”保留原文的身体意象。这句话可能指不可放弃对儿女的照料、监督或教导；原文没有说明具体方式。
    reason: 保存希腊文的形象表达及其解释上的开放性，避免将其限定为体罚或某一种管教方式。
lexical_decisions:
- source_word: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπό
  choice: 不可不管教
  rationale: 字面为“不可把你的手从……挪开”。结合对子女持续负有教养责任的语境，以“不管教”自然传达不可撒手不理、应持续训导之意，同时避免照搬不自然的汉语意象。
- source_word: ἀπὸ νεότητος
  choice: 从他们年幼时起
  rationale: νεότης 指年幼或年轻时期；补出“他们”以明确所指为儿女，并用“从……时起”表达持续起点。
- source_word: διδάξεις
  choice: 教导
  rationale: 保留将来式在规训文体中的命令功能，以现代汉语祈使命令句表达。
- source_word: τὸν φόβον τοῦ Θεοῦ
  choice: 敬畏上帝
  rationale: “敬畏上帝”是自然且准确的汉语宗教表达，兼含畏惧与尊崇，不缩减为单纯害怕。
theological_decisions:
- issue: “把手挪开”是指体罚、管教，还是一般性的照管责任
  choice: 正文译为“不可不管教”，脚注保留字面及较宽解释
  alternative: 不可从你的儿子或女儿身上收回你的手
  rationale: 原文意象本身具有一定开放性；正文需自然可懂，但不应将其明确限定为体罚，因此采用含义较宽的“管教”，并以脚注保存字面表达及“不可撒手不管”的可能含义。
translation_notes:
  register: 采用现代、庄重而通顺的劝诫语体。“儿子或女儿”保留原文对两者的明确并列；分号呈现禁止与积极教导之间的对照。
