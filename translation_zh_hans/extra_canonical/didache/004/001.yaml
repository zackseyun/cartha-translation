source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ μνησθήσῃ νυκτὸς καὶ ἡμέρας, τιμήσεις δὲ αὐτὸν ὡς Κύριον· ὅθεν γὰρ ἡ κυριότης λαλεῖται, ἐκεῖ Κύριός ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/001.yaml
  text: My child, you shall remember night and day the one who speaks to you the word of God, and you shall honor him as the Lord; for where lordship is spoken, there the Lord is.
translation:
  language: zh_hans
  text: 我的孩子，你要昼夜记念那向你讲说上帝之道的人，也要像尊敬主那样尊敬他；因为哪里谈到主权，主就在哪里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主权”也可译作“主治”或“主的权柄”。原文 κυριότης 是罕见而含义宽广的抽象名词；本句也可较直译为：“因为哪里讲说主权，主就在那里。”
    reason: 说明κυριότης的语义范围，并保留末句简练、含蓄的表达及其与“主”的文字关联。
lexical_decisions:
- source_word: Τέκνον μου
  choice: 我的孩子
  rationale: 保留师长对受教者亲切而庄重的称呼；“孩子”比“儿子”更不限定性别。
- source_word: μνησθήσῃ νυκτὸς καὶ ἡμέρας
  choice: 你要昼夜记念
  rationale: 两个将来时形式在本段具有命令功能，译作“要”符合现代汉语训诲语气；“昼夜”凝练地表达持续记挂。
- source_word: τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ
  choice: 那向你讲说上帝之道的人
  rationale: 保留现在分词所表达的讲说者身份，并以“上帝之道”对应 λόγον τοῦ Θεοῦ。
- source_word: τιμήσεις δὲ αὐτὸν ὡς Κύριον
  choice: 也要像尊敬主那样尊敬他
  rationale: 明确比较关系，既保留“如同主”的力度，也避免中文误读为把讲道者直接等同于主。
- source_word: ἡ κυριότης
  choice: 主的权柄
  rationale: 该抽象名词可指主权、主治或主的尊威；“主的权柄”在现代汉语中较自然，同时保留与 Κύριος 的词义联系。
- source_word: ὅθεν…ἐκεῖ
  choice: 哪里……就在哪里
  rationale: 以自然汉语呈现来源副词与对应地点副词构成的关联结构。
theological_decisions:
- issue: 对讲说上帝之道者“如同主”予以尊敬
  choice: 像尊敬主那样尊敬他
  alternative: 尊敬他如同尊敬主
  rationale: 保留原文要求的高度尊敬，同时不暗示讲说者在本体上就是主。
- issue: κυριότης 与主临在的关系
  choice: 哪里在宣讲主的权柄，主就在哪里
  alternative: 主权从哪里被讲说，主就在那里
  rationale: 原句含蓄地把关于“主权/主治”的讲说与主的临在相连；正文保持这一张力，不进一步解释其机制或限定为某种教会职分。
translation_notes:
  register: 采用现代、庄重而易懂的训诲体。“你要……也要……”统一呈现两个具有命令作用的希腊语将来时；末句适度顺应汉语语序，并以脚注保留原文较生硬、含蓄的表达。
