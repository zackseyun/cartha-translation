source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εὐχαριστοῦμέν σοι, Πάτερ ἅγιε, ὑπὲρ τοῦ ἁγίου ὀνόματός σου, οὗ κατεσκήνωσας ἐν ταῖς καρδίαις ἡμῶν, καὶ ὑπὲρ τῆς γνώσεως καὶ πίστεως καὶ ἀθανασίας, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/002.yaml
  text: 'We give thanks to you, Holy Father,

    for your holy name,

    which you caused to dwell in our hearts,

    and for the knowledge and faith and immortality

    which you made known to us through Jesus your servant;

    to you be the glory forever.'
translation:
  language: zh_hans
  text: '圣父，我们感谢你，


    因你的圣名；


    你使你的圣名住在我们心里。


    也因知识、信心和你借着你的仆人耶稣使我们认识的不朽；


    愿荣耀归于你，直到永远。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμέν
  choice: 我们感谢
  rationale: 直接表达礼仪祷告中的感恩，现代汉语自然庄重。
- source_word: Πάτερ ἅγιε
  choice: 圣父
  rationale: 保留呼格称谓，简洁且符合现代汉语祷告语体。
- source_word: ὄνομά
  choice: 名
  rationale: 保留圣经传统中“名”所承载的身份、临在与权柄含义，不改释为单一概念。
- source_word: κατεσκήνωσας
  choice: 使……住
  rationale: 该词有搭帐幕、居住之意；译作“使……住”保留其临在意象，同时避免生硬。
- source_word: γνώσεως
  choice: 知识
  rationale: 保留原词较宽泛的认识/知识含义，不限定为特定教义知识。
- source_word: πίστεως
  choice: 信心
  rationale: 在此名词并列结构中，“信心”自然且能保留信靠与信仰的张力。
- source_word: ἀθανασίας
  choice: 不朽的生命
  rationale: ἀθανασία直指不死、不朽；加入“生命”使现代汉语语义完整，但不将其具体化为某一末世论体系。
- source_word: ἐγνώρισας
  choice: 使我们认识
  rationale: 与γνῶσις形成词根呼应，也表达启示、使人知晓之意。
- source_word: παιδός
  choice: 仆人
  rationale: παῖς可指孩子、儿子或仆人；在早期基督徒传统及相关经文语境中“仆人”有充分依据，同时不直接改译为“儿子”。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 以自然庄重的现代汉语表达历世无尽之意。
theological_decisions:
- issue: “圣名住在我们心里”的主体与意象
  choice: 你使这名住在我们心里
  alternative: 你使你的圣名安居在我们心里
  rationale: 保留上帝主动使其名居住的语法关系，并避免用“安居”额外强化永久状态。
- issue: παῖς用于耶稣的称呼
  choice: 你的仆人耶稣
  alternative: 你的儿子耶稣
  rationale: 原词本身有歧义；此处采用与《使徒行传》早期祷告语言相呼应的“仆人”，不以系统神学术语消解原文张力。
- issue: 荣耀句的语气
  choice: 愿荣耀归于你
  alternative: 荣耀归于你
  rationale: 希腊文为省略系词的颂赞公式；中文以愿望式自然呈现祷告语气，不改变荣耀归属。
translation_notes:
  register: 采用现代、庄重、适合公共诵读的祷告体。分行呈现原文的并列与颂赞节奏；用破折号帮助读者辨明两个关系从句分别说明“圣名”与“知识、信心和不朽的生命”。无脚注，故正文不设脚注标记。
