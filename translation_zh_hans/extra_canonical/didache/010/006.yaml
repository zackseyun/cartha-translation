  text: Ἐλθέτω χάρις καὶ παρελθέτω ὁ κόσμος οὗτος. Ὡσαννὰ τῷ υἱῷ Δαβίδ. Εἴ τις ἅγιός ἐστιν, ἐρχέσθω· εἴ τις οὐκ ἔστι, μετανοείτω· μαρανᾰθά. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/006.yaml
  text: 'Let grace come,

    and let this world pass away.

    Hosanna to the son of David.

    If anyone is holy, let him come;

    if anyone is not, let him repent.

    Maranatha. Amen.'
translation:
  language: zh_hans
  text: '愿恩典来临，

    愿这世界逝去。


    和散那归于大卫之子！[a]


    若有人是圣洁的，就让他来；

    若有人不圣洁，就让他悔改。


    主啊，来吧！[b] 阿们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和散那”源自希伯来语祈求语，意为“求你拯救”，后来也成为赞美、欢呼用语。
    reason: 音译词对普通读者不透明，需说明其祈求与颂赞的双重色彩。
  - marker: b
    text: “主啊，来吧”所译的词音译为“马拉拿他”，源自亚兰语；它也可被理解为“我们的主已经来了”。
    reason: 保留原文未分写形式所产生的真实语言与神学歧义。
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 保留其在早期基督教语境中既可指上帝的恩惠、也可能带有末世性临到意味的宽度，不具体化为某一对象。
- source_word: παρελθέτω
  choice: 过去
  rationale: 对应命令式“让……过去/消逝”，用自然中文保留世界终将退去的末世语气。
- source_word: Ὡσαννά
  choice: 和散那
  rationale: 采用中文基督教传统中通行的音译，并以脚注说明其祈求、欢呼色彩。
- source_word: τῷ υἱῷ Δαβίδ
  choice: 归于大卫之子
  rationale: 与“和散那”的颂呼结构相配；“大卫之子”保留弥赛亚称号的原貌。
- source_word: ἅγιος
  choice: 圣洁的
  rationale: 保持形容人的原文表达，不擅自限定为礼仪洁净、受洗资格或道德完全。
- source_word: μετανοείτω
  choice: 让他悔改
  rationale: 准确传达命令式及心意、方向转变的宗教伦理含义。
- source_word: μαρανᾰθά
  choice: 主啊，来吧
  rationale: 按常见的亚兰语切分 māranā thā 译作对主的祈求，同时以脚注保留另一种可能切分。
- source_word: Ἀμήν
  choice: 阿们
  rationale: 采用现代中文宗教文本通行音译，保留礼仪性应答。
theological_decisions:
- issue: “恩典来临”所指为何
  choice: 不补出主语身份或具体事件
  alternative: 译作“愿基督来临”或“愿恩典的国来临”
  rationale: 原文仅有 χάρις，可能与基督、上帝的恩惠或末世实现相关；直译可保存其含蓄与张力。
- issue: “圣洁的”是否指特定礼仪资格
  choice: 保持一般性的“圣洁”表述
  alternative: 译作“已经分别为圣/有资格领受圣餐的人”
  rationale: 上下文可能具有圣餐礼仪背景，但本句没有明说受洗、洁净或领餐资格，不宜在正文中收窄。
- issue: μαραναθά 的切分与时态
  choice: 正文采用“主啊，来吧”
  alternative: “我们的主已经来了”
  rationale: 未分词的亚兰语可有不同切分；本段接续“愿恩典来临”及邀请“来”的末世语境，更支持祈使读法，但应在脚注中承认另一解。
translation_notes:
  register: 采用简洁、庄重而可诵读的现代标准汉语，保留原文连续祈愿、呼喊与劝诫的礼仪节奏。以“愿……”“就让……”对应第三人称命令式；不额外补入圣餐、教会成员身份或末世次序等解释。
