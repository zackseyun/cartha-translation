  text: 你们吃饱以后，要这样感谢：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὸ ἐμπλησθῆναι
  choice: 你们吃饱以后
  rationale: ἐμπλησθῆναι 是 ἐμπίμπλημι 的不定过去时被动不定式；在进餐语境中表示吃饱、得到饱足。“吃饱”自然明确，也避免“被充满”可能引起的属灵化误解。δὲ 在此承接并转入餐后情形，无须生硬译作“但是”。
- source_word: οὕτως
  choice: 这样
  rationale: 指向下文将给出的感谢祷文，译为“这样”简洁自然。
- source_word: εὐχαριστήσατε
  choice: 要……感谢
  rationale: 不定过去时主动命令语气复数，向群体发出指示；“感谢”保留该词在此处献上感恩祷告的基本含义。
theological_decisions:
- issue: εὐχαριστήσατε 是否应专门译为礼仪术语
  choice: 感谢
  alternative: 祝谢／举行感恩礼
  rationale: 原文可以指献上感谢，但本句自身并未要求采用后世特定礼仪名称；选用普通而庄重的“感谢”，避免预先加入宗派或礼仪体系的限定。
translation_notes:
  register: 采用现代、自然而庄重的指示语体。“你们”体现复数受众；“吃饱以后”准确交代餐后场景；句末冒号引出随后祷文。
