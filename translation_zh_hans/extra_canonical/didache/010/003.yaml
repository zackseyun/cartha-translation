source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Σὺ, δέσποτα παντοκράτορ, ἔκτισας τὰ πάντα ἕνεκεν τοῦ ὀνόματός σου, τροφήν τε καὶ ποτὸν ἔδωκας τοῖς ἀνθρώποις εἰς ἀπόλαυσιν ἵνα σοι εὐχαριστήσωσιν, ἡμῖν δὲ ἐχαρίσω πνευματικὴν τροφὴν καὶ ποτὸν καὶ ζωὴν αἰώνιον διὰ τοῦ παιδός σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/003.yaml
  text: 'You, almighty Master,

    created all things for the sake of your name,

    and gave food and drink to people for enjoyment,

    so that they might give thanks to you;

    but to us you graciously gave spiritual food and drink

    and eternal life through your servant.'
translation:
  language: zh_hans
  text: '你，全能的主宰，


    为了你的名创造了万物；


    你把食物和饮料赐给世人享用，


    使他们感谢你；


    但你却借着你的仆人，[a]


    恩赐我们属灵的食物、饮料


    和永恒的生命。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”所译的希腊词也可指“孩子”或“儿子”。
    reason: 保留παῖς的真实词义歧义及其可能的基督论含义。
lexical_decisions:
- source_word: δέσποτα παντοκράτορ
  choice: 全能的主宰
  rationale: δέσποτα是直接称呼，表示拥有权柄的主人或主宰；παντοκράτορ意为“全能者”。“全能的主宰”既保留权柄与全能之义，也符合现代汉语祷告语体。
- source_word: ἕνεκεν τοῦ ὀνόματός σου
  choice: 为了你的名
  rationale: 直译保留“名”在古代宗教语言中代表身份、荣耀与启示的丰富含义，不将其窄化为“荣耀你的名”等解释。
- source_word: τοῖς ἀνθρώποις
  choice: 世人
  rationale: ἀνθρώποις泛指人类，并非特指男性；“世人”自然、简洁，并与后文“我们”形成对照。
- source_word: εἰς ἀπόλαυσιν
  choice: 享用
  rationale: ἀπόλαυσις可指享受、享用；在食物和饮品的语境中，“享用”自然且不过度强调感官享乐。
- source_word: ἐχαρίσω
  choice: 恩赐给了
  rationale: 该动词含出于恩惠而赐予之意；“恩赐”保留其恩典色彩，并与普通的ἔδωκας“赐给”有所区别。
- source_word: πνευματικὴν τροφὴν καὶ ποτὸν
  choice: 属灵的食物、饮品
  rationale: πνευματικός译为“属灵的”，保留其与灵或圣灵相关的开放语义，不具体判定所指为何种礼仪或教义内容。
- source_word: ζωὴν αἰώνιον
  choice: 永恒的生命
  rationale: 准确表达持续、属于永世的生命；采用现代读者易懂且庄重的措辞。
- source_word: διὰ τοῦ παιδός σου
  choice: 借着你的仆人
  rationale: παῖς可指孩子、儿子或仆人；在早期基督徒祷告传统及本句中，“仆人”是稳妥译法，同时以脚注保留词义歧义。
theological_decisions:
- issue: παῖς所指身份及其基督论含义
  choice: 正文译作“仆人”，并加脚注说明也可译作“孩子”或“儿子”
  alternative: 你的儿子
  rationale: 希腊词παῖς本身兼有“仆人”与“孩子/儿子”义。此处没有在译文中明说名字；采用“仆人”与早期基督教中“上帝的仆人”传统相符，但脚注保留真实的词汇歧义，避免将经文的基督论表达提前固定为单一解释。
- issue: “属灵的食物和饮品”的具体指涉
  choice: 保持原文泛称，不增译为圣餐、基督身体和血或其他具体对象
  alternative: 圣餐中的属灵食物和饮品
  rationale: 上下文虽为餐后感恩祷告，可能具有圣餐意涵，但本句原文本身未明确界定，译文应保留这种开放性。
- issue: “为了你的名”所表达的目的
  choice: 保留字面表达
  alternative: 为荣耀你的名
  rationale: “名”可能涵盖上帝的身份、荣耀和启示；直接译出可保留其神学张力，避免只解释为荣耀。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体，并按希腊文的平行与转折关系分行。“但你却”突出ἡμῖν δὲ与前句普遍恩赐之间的对照；不添加原文未明说的礼仪或教义解释。
