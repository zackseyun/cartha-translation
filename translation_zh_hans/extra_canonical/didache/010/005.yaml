  source_fidelity: 需修订。希腊文中τὴν ἁγιασθεῖσαν（“那已成圣的〔教会〕”）紧接在“从四方聚集它”之后，作为与“教会”同位的分词短语；εἰς τὴν σὴν Βασιλείαν更自然地随该分词表达其归属／目标，即“为你的国度成圣”，而非越过该分词直接修饰“聚集”。关系代词ἣν的最近且合乎语义的先行词是“国度”，αὐτῇ则指教会。
  naturalness: 原译整体庄重自然，但“把这已经成圣的教会从四方聚集到你的国度里，就是你为它预备的国度”将同位分词与关系从句的层次压缩，且容易误读为“教会就是国度”。修订后以“这国度是你为它预备的”明确所指，现代汉语更清晰。
  terminology: “教会”“成圣”“国度”“权能”“荣耀”等术语均恰当。“一切邪恶”可保留，以维持παντὸς πονηροῦ的概括性；“使它在你的爱中达到完全”准确传达τελειῶσαι与ἐν τῇ ἀγάπῃ σου。
