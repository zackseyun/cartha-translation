    rationale: 该介词短语位于τὴν ἁγιασθεῖσαν之后，按句法与语序更自然地与该分词相连。正文应优先反映“为你的国度成圣的教会”；可用脚注保留将其连于“聚集”的较少见断法。
  - severity: medium
