source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μνήσθητι, Κύριε, τῆς ἐκκλησίας σου τοῦ ῥύσασθαι αὐτὴν ἀπὸ παντὸς πονηροῦ καὶ τελειῶσαι αὐτὴν ἐν τῇ ἀγάπῃ σου, καὶ σύναξον αὐτὴν ἀπὸ τῶν τεσσάρων ἀνέμων, τὴν ἁγιασθεῖσαν εἰς τὴν σὴν Βασιλείαν, ἣν ἡτοίμασας αὐτῇ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/005.yaml
  text: Remember[a], Lord, your church, to deliver it from every evil and to perfect it in your love; and gather it from the four winds, the one sanctified for your kingdom, which you prepared for it. For yours is the power and the glory forever.
translation:
  language: zh_hans
  text: 主啊，求你记念你的教会，救它脱离一切邪恶，并使它在你的爱中达到完全；又把这已为你的国度成圣的教会从四方聚集起来[a]。这国度是你为它预备的。因为权能和荣耀都属于你，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一断句译作：“又把这已经成圣的教会从四方聚集到你的国度里。”
    reason: 希腊文“到／为你的国度”的介词短语可被理解为与“聚集”相连；正文则依其紧随“已经成圣的”这一分词的语序，译为“为你的国度成圣”。
lexical_decisions:
- source_word: Μνήσθητι
  choice: 求你记念
  rationale: 保留“记念、顾念”的祷告用语及命令式语气；加“求你”使现代汉语表达自然，而不削弱原文的恳求力度。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 在早期基督教语境中指属主的信徒群体；“教会”是现代汉语中准确且通行的对应词。
- source_word: ῥύσασθαι
  choice: 救……脱离
  rationale: 表达从危险或邪恶势力中解救出来的含义，比单纯的“除去”更贴近原词。
- source_word: παντὸς πονηροῦ
  choice: 一切邪恶
  rationale: 原文为概括性的中性表达，可指各种恶事或邪恶；用“一切邪恶”保留其广泛范围。
- source_word: τελειῶσαι
  choice: 使……达到完全
  rationale: 保留“使完全、带到完满”的过程与目标，避免把它弱化为一般性的“改善”。
- source_word: ἀπὸ τῶν τεσσάρων ἀνέμων
  choice: 从四方
  rationale: “四风”是指来自四个方向；正文采用自然的现代汉语“从四方”，同时保留普世聚集的空间意象。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 是汉语中自然、庄重的永恒颂赞表达，传达原文“直到万世”的意义。
theological_decisions:
- issue: εἰς τὴν σὴν Βασιλείαν 与动词或分词的连接关系
  choice: 正文理解为教会被聚集“到你的国度里”
  alternative: 也可理解为教会是“为你的国度而成圣”的
  rationale: εἰς 短语在语序上可能与“聚集”或“已经成圣”相连。正文采用语义较顺畅且常见的方向性理解，同时以脚注保留另一种真实可能。
- issue: 关系代词 ἣν 的先行词
  choice: 指紧邻的“国度”，即上帝为教会预备国度
  alternative: 理论上可因阴性形式而与“教会”发生语法呼应
  rationale: “国度”是最近的阴性先行词，而后面的 αὐτῇ 自然指教会，因此译为“你为它预备的国度”最符合句法和语义。
- issue: τὴν ἁγιασθεῖσαν 的表达
  choice: 译作“这已经成圣的教会”
  alternative: 直译为“这已经成圣的”
  rationale: 该阴性分词与前面的教会相呼应。汉语补出“教会”能清楚说明所指，不增加新的神学内容；“已经”也体现完成时被动分词的状态。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保持祷告与颂赞语气。“求你记念”“达到完全”“直到永远”兼顾礼仪感和当代可读性；避免引入宗派性术语。
