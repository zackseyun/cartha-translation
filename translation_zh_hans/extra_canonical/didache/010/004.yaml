  yaml_path: translation/extra_canonical/didache/010/004.yaml
  text: Before all things we give thanks to you because you are mighty; to you be the glory forever.
translation:
  language: zh_hans
  text: 在万有之先，我们感谢你，因为你大有能力；荣耀归于你，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: 首先
  rationale: 字面可作“在一切之前”，在此祷告语境中自然表达为“首先”；不把它强化为表示重要程度的“最重要的是”。
- source_word: εὐχαριστοῦμέν σοι
  choice: 我们感谢你
  rationale: 直接保留第一人称复数及向上帝献上感谢的语气。
- source_word: δυνατός εἶ
  choice: 你大有能力
  rationale: δυνατός 表示有能力、强有力；“大有能力”在现代汉语中庄重自然，也避免限定为某一种具体作为。
- source_word: σοὶ ἡ δόξα
  choice: 荣耀归于你
  rationale: 希腊文是省略系词的颂赞句；汉语用“归于”清楚传达荣耀属于受祷告者。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 采用汉语颂赞语中自然的时间表达，传达延续至万世的含义。
theological_decisions:
- issue: Πρὸ πάντων 的语义
  choice: 首先
  alternative: 在一切之先／最重要的是
  rationale: 该短语既可能表示次序，也可能带有优先性。上下文证据不足以断定是在宣称重要程度，因此正文采用能保留次序意味且自然的“首先”。
- issue: δυνατός 的表达范围
  choice: 大有能力
  alternative: 全能／强大
  rationale: 原词只明确说“有能力、强有力”，未必承载“全能”这一更强的系统神学表述，故不作强化。
translation_notes:
  register: 采用现代、庄重而易懂的祷告体。分号保留原句由感谢转入颂赞的平行结构；无须脚注。
