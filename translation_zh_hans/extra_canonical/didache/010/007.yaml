  text: But permit the prophets to give thanks as they desire.
translation:
  language: zh_hans
  text: 但要容许先知们随自己的意愿献上感谢。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῖς δὲ προφήταις
  choice: 但要容许先知们
  rationale: δὲ 表转折或补充，译作“但”；προφήταις 为复数，保留为“先知们”；ἐπιτρέπετε 表示允许或准许。
- source_word: εὐχαριστεῖν
  choice: 献上感谢
  rationale: 该词在本段语境中既可指感谢，也与前文感恩祷告的礼仪语境相连；“献上感谢”自然庄重，并不过度限定为固定祷文。
- source_word: ὅσα θέλουσιν
  choice: 随自己的意愿
  rationale: 直译有“凡他们所愿的／愿意多少”之意；这里保留方式和范围上的开放性，表达先知可按其意愿感恩，而不硬性解释为篇幅长短。
theological_decisions:
- issue: 先知所得许可的范围
  choice: 随自己的意愿献上感谢
  alternative: 想感谢多久就感谢多久
  rationale: 希腊语 ὅσα θέλουσιν 可涉及内容、程度或篇幅。正文采用较宽泛的表达，避免把许可范围仅限定为祷告时长。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“容许”体现许可之意，“献上感谢”兼顾自然表达与本段感恩礼仪语境。
