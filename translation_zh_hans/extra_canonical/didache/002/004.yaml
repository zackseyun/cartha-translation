  text: Οὐκ ἔσῃ διγνώμων οὐδὲ δίγλωσσος· παγὶς γὰρ θανάτου ἡ διγλωσσία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/004.yaml
  text: You shall not be double-minded nor double-tongued, for double-tongued speech is a snare of death.
translation:
  language: zh_hans
  text: 你不可心怀二意，也不可说两面话，因为说两面话是死亡的网罗。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διγνώμων
  choice: 心怀二意
  rationale: 保留该词“心思分裂、持两种意向”的基本形象，同时采用现代汉语中自然、庄重的表达。
- source_word: δίγλωσσος
  choice: 说两面话
  rationale: 该词字面为“有两条舌头”，实际指对不同的人说不同的话或言语不一；译为“说两面话”既自然，也与下句形成重复。
- source_word: παγὶς θανάτου
  choice: 死亡的网罗
  rationale: 保留原文“网罗、陷阱”的意象及其与“死亡”的属格关系，不将其弱化为一般性的危险。
- source_word: διγλωσσία
  choice: 说两面话
  rationale: 这是与 δίγλωσσος 同词根的抽象名词；重复同一译语，以再现原文的词语呼应。
theological_decisions:
- issue: “死亡的网罗”所指的死亡性质
  choice: 保留为“死亡”，不加限定
  alternative: 解释为属灵死亡、永死或导致死亡的罪
  rationale: 原文只说“死亡”，没有明确限定其为肉身死亡、属灵死亡或末世审判；译文保留这一开放性。
translation_notes:
  register: 采用现代、简洁而庄重的劝诫语体。“你不可”明确保留第二人称单数命令色彩；两个分句以“心怀二意”和“说两面话”呈现内在意向与外在言语的并列。
