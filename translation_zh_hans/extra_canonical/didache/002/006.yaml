source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἔσῃ πλεονέκτης οὐδὲ ἅρπαξ οὐδὲ ὑποκριτὴς οὐδὲ κακοήθης οὐδὲ ὑπερήφανος. Οὐ λήψῃ βουλὴν πονηρὰν κατὰ τοῦ πλησίον σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/006.yaml
  text: You shall not be greedy[a], nor grasping, nor a hypocrite, nor malicious, nor arrogant. You shall not take evil counsel against your neighbor.
translation:
  language: zh_hans
  text: 你不可贪得无厌，不可强取豪夺，不可虚伪，不可心怀恶意，也不可骄傲。你不可采纳恶计来对付你的邻舍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “采纳恶计”直译为“接受／采取恶谋”。希腊语λήψῃ βουλὴν也可能指作出或制定针对邻舍的恶意谋议。
    reason: λήψῃ βουλὴν可涵盖接受、采取或作出谋议；脚注保留这一词义侧重点的歧义。
lexical_decisions:
- source_word: πλεονέκτης
  choice: 贪得无厌
  rationale: 指贪婪、总想占有更多的人；此译比单用“贪心”更充分体现词中“求取更多”的意味。
- source_word: ἅρπαξ
  choice: 强取豪夺
  rationale: 指掠夺成性或凭强力攫取他人之物；用动词性四字表达，在现代汉语中自然有力。
- source_word: ὑποκριτής
  choice: 虚伪
  rationale: 在此恶行清单中指假冒、伪善；译作“虚伪”比名词“伪君子”更适合与其他并列禁令保持一致。
- source_word: κακοήθης
  choice: 心怀恶意
  rationale: 该词表示品性恶劣、恶毒或奸恶；“心怀恶意”保留主动恶意的强度，又不把可能的“奸诈”义限定得过窄。
- source_word: ὑπερήφανος
  choice: 骄傲
  rationale: 指高傲、自大；“骄傲”是清楚、庄重且通行的现代汉语表达。
- source_word: λήψῃ βουλὴν πονηράν
  choice: 图谋恶事
  rationale: 字面为“采取／接受恶谋”；在此语境中可指形成、采纳或实施针对邻舍的恶意谋划。“图谋恶事”自然表达核心含义，相关歧义在脚注说明。
- source_word: πλησίον
  choice: 邻舍
  rationale: “邻舍”是现代中文圣经语域中通行的关系性称谓，不只限于住在附近的人。
theological_decisions:
- issue: λήψῃ βουλήν所表达的是自己谋划，还是接受他人的计谋
  choice: 正文用较宽泛的“图谋恶事”，脚注保留两种可能
  alternative: 采纳恶计／心怀恶谋
  rationale: 希腊文的“采取谋议”可能涵盖形成、接受或采用计谋；不宜无依据地只限定为其中一种。
- issue: κακοήθης的恶意与奸诈色彩
  choice: 心怀恶意
  alternative: 奸诈／恶毒
  rationale: 源词可兼有恶毒和奸恶、诡诈之意；正文不将含义缩窄为单一行为特征。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。首句保留连续禁令的排比力度，并用“也不可／不可”避免机械重复。第二句保留“邻舍”这一经文语域用词，同时通过脚注交代希腊文表达的词义幅度。
