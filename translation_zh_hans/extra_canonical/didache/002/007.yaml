source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μισήσεις πάντα ἄνθρωπον, ἀλλὰ οὓς μὲν ἐλέγξεις, περὶ δὲ ὧν προσεύξῃ, οὓς δὲ ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/007.yaml
  text: You shall not hate any person, but some you shall reprove, for some you shall pray, and some you shall love more than your own life.
translation:
  language: zh_hans
  text: 你不可恨任何人；有些人，你要责备；有些人，你要为他们祷告；还有些人，你要爱他们，胜过爱自己的性命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ἄνθρωπον
  choice: 任何人
  rationale: ἄνθρωπος在这里泛指人，并非特指男性；在否定结构中译作“任何人”，自然表达“不恨任何一个人”。
- source_word: ἐλέγξεις
  choice: 责备
  rationale: ἐλέγχω可表示指出过错、责备或纠正；“责备”既保留力度，也符合本段劝诫语体。
- source_word: περὶ δὲ ὧν προσεύξῃ
  choice: 有些人，你要为他们祷告
  rationale: περί与人的属格连用，在祷告语境中自然表示“为……祷告”；将希腊语关系结构转成现代汉语分句。
- source_word: ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου
  choice: 你要爱他们，胜过爱自己的性命
  rationale: ὑπέρ在比较结构中表示“胜过”；ψυχή在此指自己的生命或性命。“性命”保留舍己意味，并避免抽象化为灵魂。
theological_decisions:
- issue: 三类对象是否彼此排斥
  choice: 保留“有些人……有些人……还有些人……”的并列结构，不说明各类是否重叠
  alternative: 明确译成三个互不重叠的群体
  rationale: 原文以相关代词并列不同回应，却没有明说这些群体必然互斥；译文不额外作神学或伦理上的界定。
- issue: “胜过自己的性命”的含义
  choice: 保留比较性的舍己表达
  alternative: 解释为必须为对方牺牲生命
  rationale: 原文表达爱超过对自身性命的珍惜，但未明确规定具体行为；译文保留其张力而不扩展成特定命令。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。希腊语将来时在规范性语境中按命令义译为“不可／要”。分号呈现原文连续而平衡的并列结构。
