id: DID.2.2
reference: Didache 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ φονεύσεις, οὐ μοιχεύσεις, οὐ παιδοφθορήσεις, οὐ πορνεύσεις, οὐ κλέψεις, οὐ μαγεύσεις, οὐ φαρμακεύσεις, οὐ φονεύσεις τέκνον ἐν φθορᾷ οὐδὲ γεννηθὲν ἀποκτενεῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/002.yaml
  text: You shall not murder; you shall not commit adultery; you shall not sexually abuse boys;a you shall not commit sexual immorality; you shall not steal; you shall not practice magic; you shall not use sorcery; you shall not kill a child by abortion, nor kill one that has been born.b
translation:
  language: zh_hans
  text: 不可杀人；不可奸淫；不可对男童施行性侵害；[a]不可行淫乱；不可偷盗；不可行邪术；不可施用巫药；不可借堕胎杀害腹中的孩子，也不可杀死已经出生的孩子。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对男童施行性侵害”：原词也可较直译为“败坏男童”，但在这里的一连串性行为禁令中，通常理解为对男童的性剥削或性侵害。
    reason: 说明罕见词παιδοφθορήσεις的构词及语境义，避免译文掩盖其词义讨论。
  - marker: b
    text: “施用巫药”所译的词可涉及借助药物、毒物或调制的药剂行巫术。末句直译近于：“不可在毁坏中杀害孩子，也不可杀死已经出生的。”这里的“毁坏”通常指堕胎。
    reason: 保留φαρμακεύσεις的历史语义范围，并交代ἐν φθορᾷ的字面形式与通常理解。
lexical_decisions:
- source_word: φονεύσεις
  choice: 杀人
  rationale: 对应蓄意夺取人命的禁令；用现代汉语中自然且庄重的“杀人”，不狭化为某一法律术语。
- source_word: μοιχεύσεις
  choice: 奸淫
  rationale: 特指破坏婚姻关系的性行为，与后面的广义πορνεύσεις有所区分。
- source_word: παιδοφθορήσεις
  choice: 对男童施行性侵害
  rationale: 该罕见动词由παῖς与φθείρω构成，在本段性伦理语境中通常指对男童的性侵害；译文明确受害对象和行为性质，同时以脚注保留词义范围。
- source_word: πορνεύσεις
  choice: 行淫乱
  rationale: 表达婚外或不正当性行为的广义禁令，并与μοιχεύσεις“奸淫”区分。
- source_word: μαγεύσεις
  choice: 行邪术
  rationale: 表示施行魔法或法术；“邪术”符合现代宗教伦理语境，也与下一项φαρμακεύσεις区分。
- source_word: φαρμακεύσεις
  choice: 施用巫药
  rationale: 该词可指以药物、毒物或符咒药剂施行巫术；“巫药”保留其物质媒介与巫术色彩，歧义另见脚注。
- source_word: τέκνον ἐν φθορᾷ
  choice: 使胎中的孩子流产而死
  rationale: ἐν φθορᾷ在此指借由堕胎或流产手段使孩子死亡；采用自然汉语表达动作及结果，不将φονεύσεις在此机械重复为“谋杀”。
- source_word: γεννηθὲν ἀποκτενεῖς
  choice: 杀死已经出生的孩子
  rationale: 忠实体现γεννηθέν“已经出生的”和ἀποκτενεῖς“杀死”，并与前一分句形成清晰对照。
theological_decisions:
- issue: παιδοφθορήσεις所指行为
  choice: 正文译为“对男童施行性侵害”
  alternative: 败坏男童／诱奸男童
  rationale: 性禁令序列支持性侵害含义；避免“败坏”过于含混，也避免“诱奸”暗示受害者同意或只限某种具体方式。
- issue: φαρμακεύσεις的语义范围
  choice: 正文译为“施用巫药”，脚注说明药物、毒物与巫术药剂的可能范围
  alternative: 行巫术／下毒
  rationale: 原词具有历史语义重叠，不应无依据地只定为一般巫术或单纯投毒。
- issue: 胎儿与已出生婴孩的称谓
  choice: 两处均用“孩子”
  alternative: 胎儿／婴儿
  rationale: 原文τέκνον统摄前一对象，而后一对象以分词“已经出生的”加以界定；“孩子”保留作者将两者连续并列的表达。
translation_notes:
  register: 采用现代、庄重而易懂的禁令体，以连续的“不可”重现希腊文反复的οὐ加将来时所表达的强制禁令。保留“奸淫”与“淫乱”、“邪术”与“巫药”的词义区分；标点用分号呈现原文逐项列举的节奏。
