source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιθυμήσεις τὰ τοῦ πλησίον, οὐκ ἐπιορκήσεις, οὐ ψευδομαρτυρήσεις, οὐ κακολογήσεις, οὐ μνησικακήσεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/003.yaml
  text: You shall not covet the things of your neighbor[a]; you shall not swear falsely; you shall not bear false witness; you shall not speak evil; you shall not hold a grudge.
translation:
  language: zh_hans
  text: 不可贪图邻舍的东西[a]；不可起假誓；不可作假见证；不可恶言毁谤；不可怀恨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可想要邻舍的东西。”
    reason: ἐπιθυμέω 的基本义可以是“想要、渴望”，但本句语境带有不当贪求的意味；脚注保留较为字面的译法。
lexical_decisions:
- source_word: ἐπιθυμήσεις
  choice: 贪图
  rationale: 此处与“邻舍的东西”连用，并呼应十诫，所指不是中性的愿望，而是想占有他人所有之物的不当欲求；“贪图”既自然，也保留禁令的伦理力度。
- source_word: τὰ τοῦ πλησίον
  choice: 邻舍的东西
  rationale: τὰ 是概括性的中性复数，指属于邻舍的事物；不擅自缩限为房屋、财物或配偶。“邻舍”也保留了 πλησίον 的经文语域。
- source_word: ἐπιορκήσεις
  choice: 起假誓
  rationale: 该词指虚假或违背事实地起誓；“起假誓”比泛称“撒谎”更准确地保留誓言语境。
- source_word: ψευδομαρτυρήσεις
  choice: 作假见证
  rationale: 准确对应虚假的见证，并保留其与十诫用语的联系，不把含义局限为一般说谎。
- source_word: κακολογήσεις
  choice: 恶言毁谤
  rationale: 该词可涵盖以恶言攻击、辱骂或诋毁他人；“恶言毁谤”比单说“说坏话”更庄重，也较充分地表达其负面言语行为。
- source_word: μνησικακήσεις
  choice: 怀恨
  rationale: 该词指记住别人所行的恶而心存怨恨；“怀恨”自然简洁，保留持续不释怨的含义。
theological_decisions:
- issue: 与十诫的呼应
  choice: 采用“贪图”“作假见证”等具有经文回声的表达
  alternative: 使用较中性的“想要”和一般性的“说谎”
  rationale: 希腊原文的措辞明显呼应十诫；译文保留这种联系，但不增添原文未明说的具体对象或教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的命令句式。各分句反复使用“不可”，以呈现原文连续禁令的节奏；保留“邻舍”这一熟悉的经文用语。
