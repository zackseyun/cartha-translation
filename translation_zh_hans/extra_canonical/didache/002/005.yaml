  language: en
  yaml_path: translation/extra_canonical/didache/002/005.yaml
  text: Your word shall not be false or empty, but filled with action.c
translation:
  language: zh_hans
  text: 你的话不可虚假，也不可空洞，而要以行动充实。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：而要被行动充满。
    reason: 说明希腊文 μεμεστωμένος πράξει 的被动和“充满”意象；正文则采用自然、庄重的现代汉语。
lexical_decisions:
- source_word: ὁ λόγος σου
  choice: 你的话
  rationale: λόγος 在此指一个人所说的话；译为“你的话”自然、准确，并与上下文的伦理训诫相称。
- source_word: ψευδής
  choice: 虚假
  rationale: 保留“不真实、欺骗”的核心含义，又适合修饰“话”。
- source_word: κενός
  choice: 空洞
  rationale: 此处与“虚假”并列，形容言语没有实质或落实；“空洞”比字面的“空”更符合现代汉语。
- source_word: μεμεστωμένος πράξει
  choice: 以行动充实
  rationale: μεστόω 的完成时被动分词表达被充满、具有充足内容；πρᾶξις 可指行动或实践。“以行动充实”保留了原文的充满意象和被实践落实的要求。
theological_decisions:
- issue: 言语与行动的关系
  choice: 以行动充实
  alternative: 付诸行动
  rationale: “付诸行动”会把原文改写成单纯的命令；“以行动充实”更贴近“被行动充满”的语义，同时保留言语必须有实践内容的张力。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“不可……也不可……而要……”保留原文鲜明的训诫结构；避免使用过度古雅的“言语”“践履”等表达。
