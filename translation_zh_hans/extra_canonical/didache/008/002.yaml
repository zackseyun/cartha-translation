id: DID.8.2
reference: Didache 8:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδὲ προσεύχεσθε ὡς οἱ ὑποκριταί, ἀλλʼ ὡς ἐκέλευσεν ὁ Κύριος ἐν τῷ εὐαγγελίῳ αὐτοῦ, οὕτω προσεύχεσθε· Πάτερ ἡμῶν ὁ ἐν τῷ οὐρανῷ, ἁγιασθήτω τὸ ὄνομά σου, ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς· τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον καὶ ἄφες ἡμῖν τὴν ὀφειλὴν ἡμῶν ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν, καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/002.yaml
  text: 'Do not pray like the hypocrites[a], but as the Lord commanded in his gospel, pray in this way:


    Our Father in heaven,

    may your name be made holy,

    may your kingdom come,

    may your will be done,

    as in heaven, so also on earth.

    Give us today our bread for the day,

    and forgive us our debt,

    as we also forgive our debtors,

    and do not bring us into testing,

    but rescue us from the evil one;

    for yours is the power and the glory unto the ages.'
translation:
  language: zh_hans
  text: '也不要像那些假冒为善的人那样祷告；要照主在他的福音中所吩咐的这样祷告：



    我们在天上的父，


    愿你的名被尊为圣，


    愿你的国度来临，


    愿你的旨意成就，


    如同在天上，也在地上。


    我们日用的饼[a]，求你今天赐给我们；


    免我们的债，


    如同我们也免欠我们债的人；


    不要带我们进入试炼[b]，


    却要救我们脱离那恶者[c]；


    因为权能和荣耀都是你的，直到永远。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日用的”所译的希腊词含义不确定，也可能指“今日所需的”或“来日的”。
    reason: ἐπιούσιος 是罕见词，其词源和具体时间指向存在争议。
  - marker: b
    text: “试炼”也可译作“试探”。
    reason: πειρασμός 既可指考验，也可指引诱人犯罪的试探。
  - marker: c
    text: “那恶者”也可译作“邪恶”。
    reason: τοῦ πονηροῦ 在此既可按阳性理解为人格化的恶者，也可按中性理解为邪恶。
lexical_decisions:
- source_word: Μηδὲ
  choice: 也不要
  rationale: 承接上文的否定性劝诫；用“也不要”既保留连续关系，又符合现代汉语表达。
- source_word: ὑποκριταί
  choice: 假冒为善的人
  rationale: 该词指在宗教行为中装样、扮演虔诚角色的人；这一通行表达自然且易懂。
- source_word: ἁγιασθήτω
  choice: 愿……被尊为圣
  rationale: 保留希腊文被动祈愿语气，不将其简化为仅仅“愿……圣洁”。
- source_word: βασιλεία
  choice: 国度
  rationale: 在此指上帝的王权及其统治领域；“国度”比现代政治意义较强的“王国”更合语境。
- source_word: ἐπιούσιον
  choice: 日用的
  rationale: 该罕见词词义有争议；正文采用汉语中自然、传统且不过度限定的译法，并以脚注说明可能含义。
- source_word: ὀφειλὴν / ὀφειλέταις
  choice: 债／欠我们债的人
  rationale: 保留原文的债务隐喻和同根词呼应，不直接释义为“罪”或“过犯”。
- source_word: πειρασμόν
  choice: 试炼
  rationale: 可指考验或引诱犯罪的试探；正文选“试炼”，脚注保留另一可能。
- source_word: τοῦ πονηροῦ
  choice: 那恶者
  rationale: 带冠词的属格形式可按阳性理解为人格化的恶者；同时以脚注保留中性“邪恶”的语法可能。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 以现代庄重汉语表达“直到万世”的持续意义。
theological_decisions:
- issue: “愿你的名成圣”的被动含义
  choice: 愿你的名被尊为圣
  alternative: 愿你的名成圣
  rationale: “被尊为圣”保留神圣之名得到承认和尊崇的意味，同时没有指明隐含的施事者。
- issue: 债务语言是否直接解释为罪
  choice: 保留“债”及“欠债的人”
  alternative: 罪／得罪我们的人
  rationale: 原文明确使用债务词汇；保留隐喻可避免先行决定其伦理或罪论层面的全部含义。
- issue: 上帝与试探的关系
  choice: 不要带我们进入试炼
  alternative: 不要让我们陷入试探
  rationale: 正文尽量贴近 εἰσενέγκῃς 的主动表达，不用“容许”来预先化解神学张力；脚注说明 πειρασμός 的语义范围。
- issue: πονηροῦ 指人格化恶者还是抽象邪恶
  choice: 正文译“那恶者”
  alternative: 邪恶
  rationale: 两者在语法上都可能；冠词化用法支持人格化理解，但以脚注明示另一读法，避免掩盖原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，祷文按诗行排列以呈现平行结构。保留“愿……”“求你……”的祈愿语气，并维持“债／欠债”及“试炼”等原文张力。所有脚注标记均置于相应正文词语之后。
