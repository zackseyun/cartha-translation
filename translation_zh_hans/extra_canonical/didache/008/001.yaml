id: DID.8.1
reference: Didache 8:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Αἱ δὲ νηστεῖαι ὑμῶν μὴ ἔστωσαν μετὰ τῶν ὑποκριτῶν· νηστεύουσι γὰρ δευτέρα σαββάτων καὶ πέμπτῃ· ὑμεῖς δὲ νηστεύσατε τετράδα καὶ παρασκευήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/001.yaml
  text: But let your fasts not be with the hypocrites, for they fast on the second day of the week and on the fifth; but you, fast on the fourth day and on Preparation.
translation:
  language: zh_hans
  text: 你们禁食，不可与那些假冒为善的人在同样的日子；因为他们在一周的第二日和第五日禁食。你们却要在第四日和预备日[a]禁食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “预备日”指安息日前的预备日，也就是星期五；“一周的第二日、第五日、第四日”依次相当于星期一、星期四、星期三。
    reason: 现代读者通常不熟悉古代犹太式按周次序称日以及“预备日”的用法，说明可避免日期误解。
lexical_decisions:
- source_word: ὑποκριτῶν
  choice: 假冒为善的人
  rationale: 该词可指扮演者、伪装者；在早期犹太—基督教伦理语境中译为“假冒为善的人”自然且准确，同时不额外指明具体群体。
- source_word: δευτέρα σαββάτων
  choice: 一周的第二日
  rationale: 按犹太式周日计数直译，所指相当于星期一；正文保留原文的计日表达。
- source_word: πέμπτῃ
  choice: 第五日
  rationale: 与前后按周计日的表达一致，所指相当于星期四。
- source_word: τετράδα
  choice: 第四日
  rationale: 保留原文按一周次序称日的方式，所指相当于星期三。
- source_word: παρασκευήν
  choice: 预备日
  rationale: παρασκευή是安息日前的预备日，即星期五；采用具有历史语境的名称，并用脚注说明。
- source_word: μετὰ
  choice: 在同样的日子
  rationale: 此处不仅可能泛指“与……一起”，下文紧接双方不同的禁食日，因此译出同日禁食的语境含义，同时避免让中文误解为必须共同聚集禁食。
theological_decisions:
- issue: “假冒为善的人”所指群体
  choice: 不在正文中认定其具体身份
  alternative: 明确译作法利赛人、犹太人或其他特定群体
  rationale: 希腊文本只说“假冒为善的人”，具体身份并未明言；应保留这种未确定性，避免引入反犹或宗派化解释。
- issue: 禁食日期的规范语气
  choice: 译为“不可……；……要……”
  alternative: 弱化为一般建议或习俗描述
  rationale: 原文使用命令式νηστεύσατε，并以μὴ ἔστωσαν表达禁止，具有明确的规劝与规范语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留原文按周次序称日的历史表达，以脚注提供现代星期名称；分号和句号呈现原文的对比结构。
