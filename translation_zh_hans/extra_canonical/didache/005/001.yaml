source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ δὲ τοῦ θανάτου ὁδός ἐστιν αὕτη· πρῶτον πάντων πονηρά ἐστι καὶ κατάρας μεστή· φόνοι, μοιχεῖαι, ἐπιθυμίαι, πορνεῖαι, κλοπαί, εἰδωλολατρεῖαι, μαγεῖαι, φαρμακεῖαι, ἁρπαγαί, ψευδομαρτυρίαι, ὑποκρίσεις, διπλοκαρδία, δόλος, ὑπερηφανία, κακία, αὐθάδεια, πλεονεξία, αἰσχρολογία, ζηλοτυπία, θρασύτης, ὕψος, ἀλαζονεία·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/001.yaml
  text: 'But the way of death is this: first of all, it is evil and full of a curse: murders, adulteries, lusts, sexual immoralities, thefts, idolatries, sorceries, magic arts, robberies, false testimonies, hypocrisies, double-heartedness, deceit, arrogance, malice, self-will, greed, foul speech, jealousy, audacity, haughtiness, boastfulness;'
translation:
  language: zh_hans
  text: 但死亡之路是这样的：首先，它是邪恶的，充满咒诅[a]：杀人、通奸、私欲、淫乱、偷窃、拜偶像、行邪术、施巫术、抢夺、作假见证、虚伪、二心、诡诈、傲慢、恶毒、任性、贪婪、污言秽语、嫉妒、放肆、自高自大、自夸；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“充满了咒骂”。
    reason: κατάρας 可指咒诅，也可能侧重咒骂或诅咒的言行；保留原文语义幅度。
lexical_decisions:
- source_word: κατάρας
  choice: 咒诅
  rationale: 保留该词可指所受咒诅或咒诅状态的语义，不擅自明确施咒者；汉语无须添加不自然的量词。
- source_word: μαγεῖαι
  choice: 行邪术
  rationale: 与后面的 φαρμακεῖαι 区分，表达一般性的魔法或巫术行为。
- source_word: φαρμακεῖαι
  choice: 施巫术
  rationale: 在此恶行清单中指借药物、毒物或符咒从事的巫术；采用宽泛译法，避免过度限定为下毒。
- source_word: διπλοκαρδία
  choice: 三心二意
  rationale: 自然表达内心不专一、态度反复或表里不一，同时保留其道德谴责意味。
- source_word: αὐθάδεια
  choice: 任性
  rationale: 表达自我中心、执意而行且不顾他人的态度。
- source_word: θρασύτης
  choice: 放肆
  rationale: 体现无所顾忌、冒失大胆的贬义，而不误译为中性的勇敢。
- source_word: ὕψος
  choice: 自高自大
  rationale: 在恶行列表中表示自视甚高，与相邻的傲慢和自夸相关但仍有侧重。
- source_word: ἀλαζονεία
  choice: 自夸
  rationale: 突出夸耀、虚张声势之意，并与 ὑπερηφανία 和 ὕψος 作有限区分。
theological_decisions:
- issue: κατάρας 是指“一项咒诅”、受咒诅状态，还是咒骂行为
  choice: 正文译作“充满咒诅”，脚注说明也可理解为“充满了咒骂”
  alternative: 充满一个咒诅／满是咒骂
  rationale: 希腊语属格单数可表达所充满的内容；此处语义存在一定开放性，正文采用庄重而自然的概括表达，脚注保留另一种理解。
- issue: φαρμακεῖαι 的具体范围
  choice: 施巫术
  alternative: 下毒／施药术
  rationale: 古代语境可涉及药物、毒物和巫术，但上下文无法确定具体所指，故不将其收窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文密集并列的恶行清单和结尾分号；对近义的骄傲类词语尽量作有限区分，不人为建立严格的神学分类。
