id: DID.5.2
reference: Didache 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: διῶκται ἀγαθῶν, μισοῦντες ἀλήθειαν, ἀγαπῶντες ψεῦδος, οὐ γινώσκοντες μισθὸν δικαιοσύνης, οὐ κολλώμενοι ἀγαθῷ οὐδὲ κρίσει δικαίᾳ, ἀγρυπνοῦντες οὐκ εἰς τὸ ἀγαθὸν, ἀλλ’ εἰς τὸ πονηρόν· ὧν μακρὰν πραΰτης καὶ ὑπομονή, μάταια ἀγαπῶντες, διώκοντες ἀνταπόδομα, οὐκ ἐλεοῦντες πτωχόν, οὐ πονοῦντες ἐπὶ καταπονουμένῳ, οὐ γινώσκοντες τὸν ποιήσαντα αὐτούς, φονεῖς τέκνων, φθορεῖς πλάσματος Θεοῦ, ἀποστρεφόμενοι τὸν δεόμενον, καταπονοῦντες τὸν θλιβόμενον, πλουσίων παράκλητοι, πενήτων ἄνομοι κριταί, πανθαμάρτητοι· ῥυσθείητε, τέκνα, ἀπὸ τούτων ἁπάντων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/002.yaml
  text: persecutors of the good[a], hating truth, loving falsehood, not knowing the reward of righteousness, not clinging to what is good nor to righteous judgment, keeping watch not for what is good but for what is evil; from whom gentleness and patience are far, loving vain things, pursuing repayment, not showing mercy to the poor, not feeling distress for one who is oppressed, not knowing the one who made them, murderers of children, destroyers of God's handiwork, turning away from the one in need, oppressing the one under affliction, advocates of the rich, lawless judges of the poor, altogether sinful. Be delivered, children, from all these things.
translation:
  language: zh_hans
  text: 迫害良善者，憎恨真理，喜爱虚假；不知道行义的赏报，不持守良善，也不持守公正的判断；警醒不是为善，而是为恶。温柔和忍耐远离他们。他们喜爱虚妄之事，追求回报；不怜悯穷人，不为受压迫的人忧痛[a]；不认识那位造他们的；杀害儿女，毁坏上帝所造之物；背弃有需要的人，欺压受苦的人；替富人说情，作穷人的不法审判官；罪恶满身。孩子们，愿你们蒙拯救，脱离这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不为受压迫的人劳苦。”
    reason: πονέω可表示忧痛，也可表示劳苦；本处与ἐπί加与格连用，更可能指因对方受压迫而忧痛，但保留另一种词义可能。
lexical_decisions:
- source_word: διῶκται ἀγαθῶν
  choice: 迫害良善的人
  rationale: 保留 διώκτης 的主动敌对含义；ἀγαθῶν 可指善人或良善之事，中文“良善”也保留这一范围。
- source_word: μισθὸν δικαιοσύνης
  choice: 行义的赏报
  rationale: μισθός 是报酬、赏报；δικαιοσύνη 可指义或行义，译为“行义的赏报”较自然，同时不具体规定赏报的内容。
- source_word: κολλώμενοι
  choice: 持守
  rationale: 原词本义为黏附、紧紧依附；“持守”在现代宗教语体中自然，并表达坚定依附。
- source_word: ἀγρυπνοῦντες
  choice: 警醒
  rationale: 保留彻夜警觉、专心留意的意象，而不弱化为一般的“关注”。
- source_word: διώκοντες ἀνταπόδομα
  choice: 追求回报
  rationale: ἀνταπόδομα 可指报偿、回报，可能含报复性偿还，但原文未明确限定，故用中性而开放的“回报”。
- source_word: πονοῦντες ἐπὶ καταπονουμένῳ
  choice: 为受压迫的人忧痛
  rationale: πονεῖν 与 ἐπί 加与格在此表示因受压迫者的处境而悲痛、同情，与前句“不怜悯”平行。
- source_word: φθορεῖς πλάσματος Θεοῦ
  choice: 毁坏上帝所造的人
  rationale: πλάσμα 指被塑造、受造之物；紧接“杀害儿女”，此处很可能指上帝所造的人，但措辞仍保留“受造”的核心意象。
- source_word: πλουσίων παράκλητοι
  choice: 替富人说情
  rationale: παράκλητος 在此指代言者、辩护者；“替……说情”适合本段司法语境且通俗自然。
- source_word: πανθαμάρτητοι
  choice: 无恶不作
  rationale: 罕见复合词表达在各方面犯罪、满身罪恶；中文成语凝练呈现其全面性。
- source_word: ῥυσθείητε
  choice: 愿你们蒙拯救，脱离
  rationale: 不定过去被动祈愿式表达愿望或劝愿；“愿……蒙拯救”保留被动和祈愿语气。
theological_decisions:
- issue: “良善”是指善人还是善事
  choice: 迫害良善的人
  alternative: 迫害善人
  rationale: ἀγαθῶν 为中性复数或阳性复数均有形式可能；采用可兼指良善及善者的表达，避免过度消歧。
- issue: “行义的赏报”是否特指末世奖赏
  choice: 不加说明
  alternative: 永恒的赏赐
  rationale: 原文只说 μισθὸν δικαιοσύνης，没有明说时间或性质，不应加入末世限定。
- issue: πλάσμα Θεοῦ 的对象
  choice: 上帝所造的人
  alternative: 上帝的造物／上帝的杰作
  rationale: 上下文的“杀害儿女”支持人类生命这一所指；但不使用带特定教义色彩的扩展措辞。
- issue: 结尾是命令还是祈愿
  choice: 愿你们蒙拯救
  alternative: 你们要远离
  rationale: ῥυσθείητε 是被动祈愿式，宜保留祈愿和被拯救的语义，而非改为单纯主动命令。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。长串分词结构以分号和短句分节，保留原文密集列举的力度；称呼 τέκνα 译作“孩子们”，既自然又保留师长劝诫的亲近语气。
