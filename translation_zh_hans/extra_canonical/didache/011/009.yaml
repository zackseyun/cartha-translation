source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πᾶς προφήτης ὁρίζων τράπεζαν ἐν πνεύματι, οὐ φάγεται ἀπ᾽ αὐτῆς, εἰδὲ μήγε ψευδοπροφήτης ἐστί·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/009.yaml
  text: And every prophet who sets a table in the Spirit shall not eat from it[a]; otherwise he is a false prophet.
translation:
  language: zh_hans
  text: 凡在灵的感动下吩咐摆设筵席的先知，都不可吃席上的食物[a]；否则，他就是假先知。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吩咐摆设筵席”也可译作“指定预备一桌饭食”；原文的“桌子”也可借指桌上的饭食。
    reason: 保留ὁρίζων与τράπεζα在此处的词义幅度，并说明正文为何将后半句译为“吃席上的食物”。
lexical_decisions:
- source_word: ὁρίζων τράπεζαν
  choice: 吩咐摆设筵席
  rationale: ὁρίζω在这里有定下、指定或吩咐之意；τράπεζα既可指桌子，也可转指桌上摆设的饭食。此译既保留“摆设席面”的具体意象，也自然表达先知吩咐预备饭食的语境。
- source_word: ἐν πνεύματι
  choice: 在灵的感动下
  rationale: 原文直译为“在灵里”。译作“在灵的感动下”符合现代汉语，并表达先知在受灵感动时说话；不直接增添原文未明说的“圣”字，以保留措辞的含蓄。
- source_word: οὐ φάγεται ἀπ᾽ αὐτῆς
  choice: 不可吃席上的食物
  rationale: 原文逐字近于“不可从它吃”。由于阴性代词αὐτῆς回指τράπεζα，用“席上的食物”可在汉语中清楚传达从所摆筵席取食的意思。
- source_word: ψευδοπροφήτης
  choice: 假先知
  rationale: 这是该词在现代中文宗教与一般语境中清楚、简洁的对应表达。
theological_decisions:
- issue: ἐν πνεύματι所指的灵
  choice: 在灵的感动下
  alternative: 在圣灵感动下
  rationale: 上下文显然涉及先知受灵感动的言说，但希腊文此处没有明确写出“圣”字。正文避免把所指进一步明定，同时仍使普通读者明白这是受灵感动的状态。
- issue: 先知是否可分享自己吩咐预备的筵席
  choice: 明确译为不可吃席上的食物，否则即为假先知
  alternative: 仅按字面译为“不可从桌上吃”
  rationale: 句子的伦理检验在于先知不得为自己的饮食利益利用受灵感动的权威；译文忠实保留这一判断，不另行解释其动机或适用范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“筵席”保留共同用餐和摆设席面的意象；“吩咐摆设”表达先知以受灵感动的权威要求预备饭食。句末用“否则”准确呈现εἰδὲ μήγε的强烈反面判断。
