source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πᾶς δὲ προφήτης διδάσκων τὴν ἀλήθειαν, εἰ ἃ διδάσκει οὐ ποιεῖ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/010.yaml
  text: And every prophet teaching the truth, if he does not do what he teaches, is a false prophet.
translation:
  language: zh_hans
  text: 凡教导真理的先知，如果自己不实行所教导的，就是假先知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς δὲ προφήτης
  choice: 凡……的先知
  rationale: πᾶς 表示无一例外的概括；δὲ 在此承接并推进论述，中文无需生硬译出“但是”。
- source_word: διδάσκων τὴν ἀλήθειαν
  choice: 教导真理的
  rationale: 保留分词对“先知”的限定，并将 ἀλήθεια 直译为“真理”。
- source_word: ἃ διδάσκει οὐ ποιεῖ
  choice: 自己不实行所教导的
  rationale: ποιεῖ 在此指把教导付诸行动；补出“自己”使主语关系在现代汉语中清楚，同时不增添新的神学含义。
- source_word: ψευδοπροφήτης
  choice: 假先知
  rationale: 采用现代中文宗教语境中清楚且通行的对应词。
theological_decisions:
- issue: 先知是否因未实践自己的教导而被判定为假先知
  choice: 保留原文直接而绝对的判断：“就是假先知”
  alternative: 译作较弱的“可算是假先知”或“表明他是假先知”
  rationale: 希腊文 ψευδοπροφήτης ἐστί 是明确的系词判断，不应弱化其中对言行一致的要求。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语；句式简洁，保留原文的普遍条件判断及强烈结论。
