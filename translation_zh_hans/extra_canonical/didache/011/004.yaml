  text: 凡到你们这里来的使徒，都应当像主一样受到接待。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς
  choice: 凡……都
  rationale: 表达希腊文全称意义，同时符合现代汉语的自然句式。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 采用通行且准确的基督教历史术语；此处指巡回而来的使徒身份者。
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: 到你们那里来的
  rationale: 忠实保留朝向受众群体而来的含义，并使中文表达自然。
- source_word: δεχθήτω
  choice: 要受到接待
  rationale: 保留第三人称命令式的规范语气，并以被动结构对应原文。
- source_word: ὡς Κύριος
  choice: 如同主一样
  rationale: 直接保留比较表达，不擅自解释为代表主、奉主之名或等同于主。
theological_decisions:
- issue: 使徒应当“如同主”受到接待的含义
  choice: 保留“如同主一样”的直接比较
  alternative: 把他当作主的代表来接待
  rationale: 原文只作简洁比较，并未明确说明代表关系；直译可保留其修辞力度和潜在神学张力，同时不暗示使徒本人与主本体相同。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“受到接待”略带规范性书面语色彩，适合早期教会训诲文体。
