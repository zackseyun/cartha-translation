revisions:
- from: 但凡经过考验、确实真实的先知，若是为教会属世的奥秘而行事，却不教导人照他所行的去行，你们不可论断他；因为他的审判在上帝那里。古时的先知也曾照样行。
  to: 但凡已经受过考验、证实为真的先知，为教会属世的奥秘而行事，却不教导人去做他自己所做的事，你们不可审判他；因为他的审判是在上帝那里。古时的先知也照样做过。
  rationale: 修订仅处理汉语自然度和两处语义衔接：以“证实为真的”替换重复的“确实真实的”；以“是在上帝那里”使审判归属的表达更完整。保留“教会属世的奥秘”这一原文艰涩短语，未擅自指定其为某一仪式、婚姻行为或教会象征；也保留本句对先知的限定条件，未泛化为所有自称先知者均不受判断。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:25:47Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了已受检验且真实的先知、其未教导他人实行自己所做之事、以及古先知同样如此行的论述。须微调“ἀληθινός”的汉语表达，并使“μετὰ Θεοῦ ἔχει τὴν κρίσιν”较明确地保留审判归于上帝的意思，而不作过度释义。艰涩短语“εἰς μυστήριον κοσμικὸν ἐκκλησίας”应继续保持其不透明性。
  naturalness: “确实真实的”在现代汉语中重复且不自然。“他的审判在上帝那里”可以理解，但略显生硬；改为“他的审判是在上帝那里”较可朗读，同时不把关系具体化为先知与上帝共同审判。
  terminology: 以“已经受过考验、证实为真的”表达 δεδοκιμασμένος 与 ἀληθινός的连用，既避免“确实真实”的赘余，也不简单抹平成固定称号。“教会属世的奥秘”保留原文中“教会／属世（世界性）／奥秘”之间关系的含混。“审判”前后一致对应 κρίσις／κριθήσεται。
  issues:
  - severity: low
    issue: “确实真实的先知”表达重复、不合自然现代汉语。
    rationale: ἀληθινός可表达为“证实为真的”，与前面的“已经受过考验”形成自然的连续限定，仍保留其真实性而不增添具体检验标准。
  - severity: low
    issue: “他的审判在上帝那里”略显不完整。
    rationale: 补出系词为“他的审判是在上帝那里”，能较自然地对应其审判与上帝相关、而非由读者审判的含义；不将μετὰ具体化为“与上帝共同施行审判”。
  revised_text: 但凡已经受过考验、证实为真的先知，为教会属世的奥秘而行事，却不教导人去做他自己所做的事，你们不可审判他；因为他的审判是在上帝那里。古时的先知也照样做过。
