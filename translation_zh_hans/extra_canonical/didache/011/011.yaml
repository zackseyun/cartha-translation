source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης δεδοκιμασμένος, ἀληθινός, ποιῶν εἰς μυστήριον κοσμικὸν ἐκκλησίας, μὴ διδάσκων δὲ ποιεῖν ὅσα αὐτὸς ποιεῖ, οὐ κριθήσεται ἐφ᾽ ὑμῶν· μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν· ὡσαύτως γὰρ ἐποίησαν καὶ οἱ ἀρχαῖοι προφῆται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/011.yaml
  text: But every prophet who has been tested, genuine, doing for an earthly mystery of the church, yet not teaching others to do what he himself does, will not be judged by you; for he has his judgment with God. For in the same way the ancient prophets also did.
translation:
  language: zh_hans
  text: 但凡已经受过考验、证实为真的先知，为教会属世的奥秘而行事，却不教导人去做他自己所做的事，你们不可审判他；因为他的审判是在上帝那里。古时的先知也照样做过。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδοκιμασμένος
  choice: 经过考验
  rationale: 保留完成时被动分词所表达的已经受过检验并获认可之意，不额外说明检验方式。
- source_word: ἀληθινός
  choice: 确实真实的
  rationale: 作为对先知的进一步限定，保留原文与“经过考验”并列而略显紧凑的表达，避免将其化约为单纯的“真先知”。
- source_word: ποιῶν
  choice: 行事
  rationale: 原义宽泛，语境又未明确具体行动；译作“行事”既自然，也避免擅自补足仪式内容。
- source_word: εἰς μυστήριον κοσμικὸν ἐκκλησίας
  choice: 为教会属世的奥秘
  rationale: 这一短语在希腊文中艰涩且可能涉及象征行动；采取较形式对应的译法，以保留“属世的/世界性的”“奥秘”“教会”之间未完全明朗的关系。
- source_word: οὐ κριθήσεται ἐφ᾽ ὑμῶν
  choice: 你们不可论断他
  rationale: 按语用表达群体不应对这样的先知作审判；“论断”比法律性的“审判”更适合对读者的禁令，同时下句以“审判”对应 κρίσιν。
- source_word: μετὰ Θεοῦ ... τὴν κρίσιν
  choice: 他的审判在上帝那里
  rationale: 保留 κρίσις 的审判含义，并以自然汉语表达其审断归于上帝；不将其解释成“由上帝负责”或“与上帝共同审判”。
- source_word: οἱ ἀρχαῖοι προφῆται
  choice: 古时的先知
  rationale: 准确表达古代、从前的先知，采用现代汉语中庄重而易懂的措辞。
theological_decisions:
- issue: “属世的奥秘”所指为何
  choice: 保留为“教会属世的奥秘”，不解释具体仪式或象征
  alternative: 译作“教会在世上的奥秘”或解释为先知以婚姻等行为象征教会
  rationale: 原文短语本身罕见而含混，现有文本不足以确定其具体神学或仪式所指；译文应保存这种张力。
- issue: 先知是否完全免受群体判断
  choice: 仅按本句说“你们不可论断他”，并保留前提“经过考验、确实真实”
  alternative: 泛化为任何自称先知者均不可受教会判断
  rationale: 上下文本句明确限定为已经受验且真实的先知，因此不可将豁免扩大到未经辨验的人。
- issue: “他的审判在上帝那里”的关系
  choice: 表达最终审断属于上帝
  alternative: 译为“他与上帝一同施行审判”
  rationale: μετὰ Θεοῦ 的结构虽可直译为“与上帝一起”，但结合“不可由你们论断”更可能指其案件或审判归上帝；译文不引入先知参与神圣审判的额外教义。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。原文核心短语“εἰς μυστήριον κοσμικὸν ἐκκλησίας”语义艰涩，正文有意保留其陌生感而不作教派性解释；全节不设脚注，故无脚注标记。
