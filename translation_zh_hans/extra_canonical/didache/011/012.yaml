  naturalness: 修订后采用庄重、自然的现代汉语。“为其他缺乏的人要求施与”清楚表达该人的请求是为他人，而非为自己；“不可论断他”也比“不要有人评断他”更合乎经文体语感。
  terminology: “在灵里”避免未经明示地把πνεύματι定为“圣灵”；脚注保留“在圣灵感动下”这一合乎语境但非语法上唯一的理解。“论断”对应κρινέτω，且不加入定罪、查验或认可其先知资格等额外含义。
