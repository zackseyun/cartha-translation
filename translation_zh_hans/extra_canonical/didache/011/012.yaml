source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς δ᾽ ἂν εἴπῃ ἐν πνεύματι· Δός μοι ἀργύρια ἢ ἕτερά τινα, οὐκ ἀκούσεσθε αὐτοῦ· ἐὰν δὲ περὶ ἄλλων ὑστερούντων εἴπῃ δοῦναι, μηδεὶς αὐτὸν κρινέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/012.yaml
  text: But whoever says in the Spirit[a], “Give me money or something else,” you shall not listen to him. But if he tells you to give for others who are in need, let no one judge him.
translation:
  language: zh_hans
  text: 但无论谁在灵里说：“给我钱或别的东西”，你们都不可听从他；但如果他为其他缺乏的人要求施与，就不可有人论断他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πνεύματι
  choice: 在圣灵感动下
  rationale: 此处描述先知在灵中发言的状态；译为“在圣灵感动下”符合现代汉语表达，同时保留其属灵宣称。希腊文未带冠词，但本段语境指向圣灵。
- source_word: ἀργύρια
  choice: 钱
  rationale: 该词可指银钱、钱财；这里与索取物品并列，现代汉语用“钱”最自然直接。
- source_word: ἕτερά τινα
  choice: 别的东西
  rationale: 意为“某些别的东西”，与“钱”同作“给我”的宾语，必须保留在引语之内。
- source_word: οὐκ ἀκούσεσθε αὐτοῦ
  choice: 你们都不要听从他
  rationale: ἀκούω 加属格在此不只是听见，而是听从、理会；中文译作“听从”能表达群体不可响应其索求。
- source_word: περὶ ἄλλων ὑστερούντων
  choice: 为缺乏的人
  rationale: 指为了其他处于匮乏中的人；汉语不必机械译出“其他”，即可自然表达受助对象并与先知本人形成对照。
- source_word: κρινέτω
  choice: 评断
  rationale: 保留“判断、论断”的语义宽度，不具体化为定罪或审查。
theological_decisions:
- issue: “在灵里”所指为何
  choice: 在圣灵感动下
  alternative: 在灵里
  rationale: 上下文涉及以先知身份说话，中文明确为“圣灵”较易理解；“感动下”表达发言状态，但不表示作者认可该人的每项要求。
- issue: 对为穷乏者募捐的先知是否完全免于辨别
  choice: 就不要有人评断他
  alternative: 谁也不要论断他
  rationale: 直译 μηδεὶς αὐτὸν κρινέτω，不增添“真假先知”或资金监管等经文没有明说的限制，保留原文形成的张力。
- issue: 施予命令的对象
  choice: 吩咐你们施予
  alternative: 说应当给他们
  rationale: 希腊文仅有 εἴπῃ δοῦναι（说要给），受词需要由语境补足；译文以“你们施予”自然传达对群体的劝令，而不武断指定具体物资。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“圣灵感动下”避免生硬的“在灵里”；“缺乏的人”比“有需要的人”更贴近 ὑστερούντων 的匮乏含义。两处转折都译作“但”，对应 δέ，并以分号呈现紧密对比。
