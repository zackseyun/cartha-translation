source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ πᾶς δὲ ὁ λαλῶν ἐν πνεύματι προφήτης ἐστίν, ἀλλ' ἐὰν ἔχῃ τοὺς τρόπους Κυρίου. Ἀπὸ οὖν τῶν τρόπων γνωσθήσεται ὁ ψευδοπροφήτης καὶ ὁ προφήτης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/008.yaml
  text: Yet not everyone speaking in the Spirit is a prophet[a], but only if he has the ways of the Lord. Therefore, from their ways the false prophet and the prophet will be known.
translation:
  language: zh_hans
  text: 然而，并非每个在灵里说话的人都是先知；只有具有主的行事方式，才是先知。因此，从他们的行事方式，就能认出谁是假先知，谁是先知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλῶν ἐν πνεύματι
  choice: 在灵里说话
  rationale: 较贴近原文措辞，并保留“灵”究竟特指圣灵还是泛指灵性状态的语义张力；不擅自补成“受圣灵感动”。
- source_word: τοὺς τρόπους Κυρίου
  choice: 在行事为人上有主的样式
  rationale: τρόπος在此指生活方式、行为表现或品格样式。此译法自然地表达“具有主的行为样式”，并避免与《十二使徒遗训》前文以ὁδός表达的“两条道路”混同。
- source_word: Ἀπὸ ... τῶν τρόπων
  choice: 从他们的行事为人
  rationale: 表达依据实际行为加以辨认的意思，并与前句的τρόπους保持词义一致。
- source_word: γνωσθήσεται
  choice: 就能认出
  rationale: 原文为被动式“将被认出／得以辨明”；汉语用主动能力式更自然，且保留可由行为辨识的含义。
theological_decisions:
- issue: 如何判定说预言者的身份
  choice: 只有在行事为人上有主的样式，才是先知
  alternative: 只要自称在灵里说话，就是先知
  rationale: 原文明言，属灵言说本身并不足以证明先知身份，行为是否呈现主的样式才是检验依据。
- issue: πνεῦμα是否明确译作“圣灵”
  choice: 灵
  alternative: 圣灵
  rationale: 希腊文无定冠词，且本节正警告不能仅凭“在灵里说话”确认其来源，因此保留原文较宽的表达，不预先断定必为圣灵。
- issue: ὁ προφήτης是否补译为“真先知”
  choice: 先知
  alternative: 真先知
  rationale: 原文只写“假先知和先知”；不补入“真”可更严格地保留原文对举方式。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“行事为人”比直译“方式”更清楚地指向可观察的生活行为；“主的样式”则保留其以主为典范的含义。末句用“谁是假先知，谁是先知”使汉语对举自然，同时不额外加入原文没有的“真”字。
