source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς ἂν οὖν ἐλθὼν διδάξῃ ὑμᾶς ταῦτα πάντα, τὰ προειρημένα, δέξασθε αὐτόν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/001.yaml
  text: Therefore, whoever comes and teaches you all these things that have been said before, receive him.
translation:
  language: zh_hans
  text: 所以，无论谁来教导你们以上所说的这一切，都要接待他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν
  choice: 无论谁
  rationale: 不定关系结构，表示任何符合条件的人；“无论谁”自然保留其泛指意义。
- source_word: οὖν
  choice: 所以
  rationale: 承接前文并引出相应指示，译为“所以”符合其推论、过渡功能。
- source_word: ἐλθὼν διδάξῃ
  choice: 来教导
  rationale: 分词与主要动词共同构成“来并教导”的条件情形；汉语用“来教导”简洁自然。
- source_word: ταῦτα πάντα, τὰ προειρημένα
  choice: 以上所说的这一切
  rationale: 将“这一切”与同位说明“先前所说的”合并为自然汉语，同时完整保留其回指范围。
- source_word: δέξασθε αὐτόν
  choice: 要接待他
  rationale: δέχομαι 在此指欢迎并接纳来者；“接待”比单纯“接受”更符合人物到访的语境。
theological_decisions:
- issue: 接待对象的条件
  choice: 保留“教导以上所说的这一切”作为接待来者的限定条件
  alternative: 宽泛表达为接待任何教师
  rationale: 原文明确以其所教内容符合前述教训为条件，不应把命令扩展为无条件接待所有教师。
translation_notes:
  register: 采用简洁、庄重而现代的普通话。“以上所说的”清楚回指前文，“接待”保留早期群体迎接巡回教师的语境。
