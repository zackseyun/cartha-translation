id: DID.11.2
reference: Didache 11:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἐὰν δὲ αὐτὸς ὁ διδάσκων στραφεὶς διδάσκῃ ἄλλην διδαχὴν εἰς τὸ καταλῦσαι, μὴ αὐτοῦ ἀκούσητε· εἰς δὲ τὸ προσθεῖναι δικαιοσύνην καὶ γνῶσιν Κυρίου, δέξασθε αὐτὸν ὡς Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/002.yaml
  text: But if the teacher himself turns and teaches another teaching so as to overthrow[a], do not listen to him; but if it is to add righteousness and knowledge of the Lord, receive him as the Lord.
translation:
  language: zh_hans
  text: 但如果那教师自己转而传授另一种教导，意图破坏[a]，你们就不要听从他；但如果是要增添公义和对主的认识，就要接待他，如同接待主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “破坏”在原文中没有明说所破坏的对象；也可译作“拆毁”“废除”或“使失效”。
    reason: 原文καταλῦσαι的宾语省略，且该词有一定语义幅度，脚注用于保留这种真实歧义。
lexical_decisions:
- source_word: στραφεὶς
  choice: 转而
  rationale: 该词本义为“转向、转变”；此处描述教师改变方向，采用“转而”既自然，也不额外加入“偏离正道”的判断。
- source_word: ἄλλην διδαχήν
  choice: 另一种教导
  rationale: 保留ἄλλην所表达的差异性，并以现代汉语自然表达“另一教导”。
- source_word: καταλῦσαι
  choice: 废除
  rationale: 该词可指拆毁、废除或使失效；这里宾语未明说，译文也不擅自补出，以保留原文的省略与张力。
- source_word: ἀκούσητε
  choice: 听从
  rationale: 语境并非仅指听见，而是接受并依从教师的教导，因此译作“听从”。
- source_word: προσθεῖναι
  choice: 增添
  rationale: 该不定式直接支配“公义”和“对主的认识”，故译作及物的“增添”，不译为“增添于公义”。
- source_word: δικαιοσύνην
  choice: 公义
  rationale: 采用庄重且通行的宗教伦理用语，涵盖正直及合乎上帝旨意的生活。
- source_word: γνῶσιν Κυρίου
  choice: 对主的认识
  rationale: 属格可自然理解为以主为对象的认识；“对主的认识”比“主的知识”更符合现代汉语。
- source_word: δέξασθε αὐτὸν ὡς Κύριον
  choice: 接待他，如同接待主
  rationale: 明确第二个“接待”为汉语所需的补足，但不把教师等同于主；“如同接待主”保留ὡς的比较或代表性含义。
theological_decisions:
- issue: “废除”的宾语
  choice: 不补出宾语，并加注说明
  alternative: 补作“废除这些教导”或“破坏前述教训”
  rationale: 希腊文καταλῦσαι没有明示宾语；补出具体对象会消除原文真实的语法省略并限定解释。
- issue: “如同主”是否把教师等同于主
  choice: 译为“如同接待主”
  alternative: 译为“把他当作主”
  rationale: 上下文命令接待合宜的教师；汉语补出重复动词可避免本体上的等同，同时保留ὡς Κύριον所具有的强烈接待标准。
- issue: προσθεῖναι与δικαιοσύνην的关系
  choice: “增添公义”
  alternative: “在公义上有所增益”
  rationale: δικαιοσύνην为προσθεῖναι的直接宾语；译文保留及物结构，不改写成介词关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“那教师自己”对应强调性的αὐτὸς ὁ διδάσκων；分号保留原句中禁止与接待之间的鲜明对照。所有脚注标记均已置于正文。
