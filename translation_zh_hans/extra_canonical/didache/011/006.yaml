review_pass:
  verdict: revise
  source_fidelity: 原译大体忠实地保留了离行使徒不得携带物品、仅可带饼，以及求钱者被断为假先知的结构。不过，“带够到投宿之处的饼”把原文未明说的“够”明确化，且措辞略显生硬。原文的重点是许可携带“直到投宿前所需的饼”。
  naturalness: “使徒离开时”及“就是假先知”自然、庄重。“除了带够到投宿之处的饼以外”搭配不够顺畅，改为“除了直到投宿前所需的饼以外”更合现代汉语表达。
  terminology: “使徒”“假先知”均为恰当且通行的对应语。ἀργύριον 在此可简明译为“钱”；“要钱”比“索要钱财”更贴近 αἰτῇ 的一般“请求、求取”义，避免把请求方式预设为强索。
  issues:
  - severity: medium
    issue: “带够到投宿之处的饼”将“够”作为明确数量要求，并且句法不够自然。
    rationale: ἄρτον ἕως οὗ αὐλισθῇ 表示所准许携带的饼与投宿前这一时间界限有关，但原文没有单独的“足够”一词。应以“直到投宿前所需的饼”保留其时间限定，避免额外量化。
  - severity: low
    issue: “索要钱财”语气稍强且“钱财”范围偏宽。
    rationale: ἀργύριον 此处通常指钱，αἰτέω 是“请求、求取”，未必含强索意味。“要钱”简洁并保留原文概括性。
  revised_text: 使徒离开时，除了直到投宿前所需的饼以外，什么也不可带；但若他要钱，他就是假先知。
