revisions:
- from: 使徒离开时，除了带够到投宿之处的饼以外，什么也不可拿；但他若索要钱财，就是假先知。
  to: 使徒离开时，除了直到投宿前所需的饼以外，什么也不可带；但若他要钱，他就是假先知。
  rationale: 修订消除了“够”这一未由原文字面明示的量化表达，清楚呈现饼的时间性限度；同时以较中性的“要钱”对应“请求钱”，并保留原文明确的身份判断。
