  text: Ἐξερχόμενος δὲ ὁ ἀπόστολος μηδὲ λαμβανέτω εἰμὴ ἄρτον ἕως οὗ αὐλισθῇ· ἐὰν δὲ ἀργύριον αἰτῇ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/006.yaml
  text: And when the apostle departs, let him take nothing except bread until he finds lodging; but if he asks for money, he is a false prophet.
translation:
  language: zh_hans
  text: 使徒离开时，除了直到投宿前所需的饼以外，什么也不可带；但若他要钱，他就是假先知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 保留早期基督教语境中的身份称谓；本节指巡回服事者，而非泛化为普通“使者”。
- source_word: μηδὲ λαμβανέτω
  choice: 什么也不可拿
  rationale: 以自然的现代汉语表达第三人称禁令，同时保留原文的强制语气。
- source_word: ἄρτον
  choice: 饼
  rationale: 直译基本食物名称；在这里指旅途所需的简单口粮。
- source_word: ἕως οὗ αὐλισθῇ
  choice: 够到投宿之处
  rationale: αὐλίζομαι 指过夜、投宿；与“饼”连读，表达只可携带足以维持到下一处住宿地点的食物。
- source_word: ἀργύριον αἰτῇ
  choice: 索要钱财
  rationale: ἀργύριον 在此指钱，αἰτέω 指请求或索取；“索要”体现该行为受到谴责的语境，但不额外限定索取方式。
- source_word: ψευδοπροφήτης
  choice: 假先知
  rationale: 采用通行且直接的宗教术语，保留原文对其身份的明确判断。
theological_decisions:
- issue: “使徒”是否仅指十二使徒
  choice: 保留“使徒”，不加范围限定
  alternative: 译作“巡回使者”或解释为“巡回传道人”
  rationale: 上下文虽反映巡回服事者，但本节本身只使用 ἀπόστολος；不在正文中预先解决其身份范围。
- issue: 索要钱财与假先知身份的关系
  choice: 按原文直陈“就是假先知”
  alternative: 弱化为“可视为假先知”
  rationale: 原文使用系词 ἐστί 作明确断定，不宜弱化其规范性判断。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。为准确呈现“ἄρτον ἕως οὗ αὐλισθῇ”的关系，将其译为“带够到投宿之处的饼”，避免误解为抵达住处之前完全不得取用食物。
