  text: But he shall not remain one day; but if there is need, also the next. But if he remains three days, he is a false prophet.
translation:
  language: zh_hans
  text: 但他不可停留一天[a]；若有需要，也可停留到第二天；但他若停留了三天，就是假先知。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“不可停留一天”。这与下句“若有需要，也可停留到第二天”形成张力；按上下文，有些人理解为“不可停留超过一天”或“只可停留一天”，但所据希腊文本本身没有明确写出“超过”或“只可”。
    reason: 保留所提供底本中首句的否定措辞，并说明其与下文产生的歧义，避免在正文中擅自补入“超过”或“只可”的限定。
lexical_decisions:
- source_word: μενεῖ / μείνῃ
  choice: 住 / 住了
  rationale: 这里指来访者停留、住宿的时日；“住”比“停留”更自然，也符合接待旅客的语境。
- source_word: ἡμέραν μίαν
  choice: 一天
  rationale: 按希腊文保留时长宾格的直接表达。
- source_word: τὴν ἄλλην
  choice: 第二天
  rationale: 字面为“另一天／下一天”，在连续住宿的语境中，“第二天”清楚自然。
- source_word: ψευδοπροφήτης
  choice: 假先知
  rationale: 采用现代汉语中通行且直接对应的宗教用语，不额外解释其动机或身份。
theological_decisions:
- issue: 首句否定语的含义及其与后文的张力
  choice: 按所提供希腊文本译为“不可住上一天”，并加注说明
  alternative: 译为“不可住超过一天”或“只可住一天”
  rationale: 所提供的希腊文 οὐ μενεῖ δὲ ἡμέραν μίαν 缺少可明确表达“除了一天”或“超过一天”的成分。虽然上下文似乎支持通常理解，但不宜把文本未明说的限定直接写入正文。
translation_notes:
  register: 采用简洁、庄重而现代的规范汉语。“但……；若……；但若……”保留原文连续对比和条件判断的结构。
