  yaml_path: translation/extra_canonical/didache/011/003.yaml
  text: Concerning the apostles and prophets, according to the rule of the gospel, do thus.
translation:
  language: zh_hans
  text: 至于使徒和先知，你们要按照福音的准则这样做。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστόλων
  choice: 使徒
  rationale: 采用通行且准确的基督教用语，指奉差遣传道的人。
- source_word: προφητῶν
  choice: 先知
  rationale: 保留原词的宗教职分含义，不缩窄为一般的讲道者。
- source_word: κατὰ τὸ δόγμα τοῦ εὐαγγελίου
  choice: 按照福音的准则
  rationale: κατά表达依照、按照；δόγμα在此指规范行动的准则或规章。“准则”既保留规范性，也避免“教义”可能造成的纯命题化理解。
- source_word: οὕτω ποιήσατε
  choice: 你们要……这样做
  rationale: 直接表达第二人称复数命令语气；“这样做”自然对应οὕτω ποιήσατε的简洁指示。
theological_decisions:
- issue: δόγμα τοῦ εὐαγγελίου的性质
  choice: 福音的准则
  alternative: 福音的条例／福音的教训
  rationale: 原文可指权威性的规定、教导或规范；“准则”保留其约束行动的意味，同时不把它限定为法令或系统教义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“至于”对应περὶ δέ所引出的新话题；补出“你们”以清楚呈现ποιήσατε的第二人称复数。
