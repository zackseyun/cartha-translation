source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πάντα προφήτην λαλοῦντα ἐν πνεύματι οὐ πειράσετε οὐδὲ διακρινεῖτε· πᾶσα γὰρ ἁμαρτία ἀφεθήσεται, αὕτη δὲ ἡ ἁμαρτία οὐκ ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/007.yaml
  text: And you shall not test or judge any prophet speaking in the Spirit; for every sin will be forgiven[a], but this sin will not be forgiven.
translation:
  language: zh_hans
  text: 凡是在圣灵里说话的先知，你们都不可试验，也不可评断；因为一切罪都必蒙赦免，但这罪必不蒙赦免。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα προφήτην
  choice: 凡……的先知……都不可
  rationale: 在否定谓语的结构中表达“任何一个都不可”的全称禁令，避免译成“不是每个”所产生的部分否定歧义。
- source_word: λαλοῦντα ἐν πνεύματι
  choice: 在圣灵里说话
  rationale: 保留ἐν πνεύματι的属灵语境及其简洁表达；“说话”不额外限定为讲道或预言，以免缩窄原文。
- source_word: πειράσετε
  choice: 试探
  rationale: πειράζω可指试验、考验或试探；此处与对先知的态度有关，“试探”保留其负面语气，也不把具体检验方式写入正文。
- source_word: διακρινεῖτε
  choice: 评断
  rationale: διακρίνω在此可含判断、辨别或裁断；“评断”与前项并列，表达对其发言作裁判性判断，同时保留一定语义张力。
- source_word: ἀφεθήσεται
  choice: 必蒙赦免
  rationale: 采用自然且庄重的被动表达，保留神学被动而不明说施行赦免者。
theological_decisions:
- issue: “在灵里”是否明确为“在圣灵里”
  choice: 在圣灵里
  alternative: 在灵里
  rationale: 先知受灵感说话的语境指向圣灵；现代汉语单说“在灵里”较含混。“圣灵”使普通读者易懂，但不进一步界定如何确认先知确是在圣灵里说话。
- issue: 不可赦免之罪的指向
  choice: 但这罪必不蒙赦免
  alternative: 但这种罪必不蒙赦免
  rationale: 直译指示语αὕτη，令“这罪”回指刚才所禁之行为，不引入后世教义体系来解释其范围或条件。
- issue: 未来时态的规范性与断言性
  choice: 都不可……必蒙……必不蒙
  alternative: 不要……会蒙……不会蒙
  rationale: 前两处未来直陈式在禁令中具有命令效力，译作“不可”；赦免句则保留未来断言的确定性，译作“必”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……都不可”清楚呈现希腊语全称宾语配合否定谓语的绝对禁令；全节保持紧凑的训诫文体。未沿用英文脚注，因为该脚注内容实际是旧译说明，且其标记在英文正文中的位置与内容不相符；中文正文已直接消除相关语法歧义。
