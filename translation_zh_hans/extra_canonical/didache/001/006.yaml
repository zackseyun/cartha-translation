  text: Ἀλλὰ καὶ περὶ τούτου δὴ εἴρηται· Ἱδρωσάτω ἡ ἐλεημοσύνη σου εἰς τὰς χεῖράς σου, μέχρις ἂν γνῷς τίνι δῷς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/006.yaml
  text: 'But about this also it has been said: Let your alms sweat in your hands until you know to whom you should give.'
translation:
  language: zh_hans
  text: 不过，关于这事也曾这样说过：“要让你的施舍在你手中冒汗，直到你知道该给谁。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: 施舍
  rationale: 指为怜悯穷困者而给予的财物或善举；“施舍”在现代汉语中简明自然，也保留了原词的慈善含义。
- source_word: Ἱδρωσάτω
  choice: 要让……冒汗
  rationale: 保留原文醒目的拟人化比喻，而不将其解释性改写为“谨慎保留”或“反复斟酌”。
- source_word: εἰς τὰς χεῖράς σου
  choice: 在你手中
  rationale: 按原文保留施舍之物仍在给予者手中的具体意象。
- source_word: μέχρις ἂν γνῷς τίνι δῷς
  choice: 直到你知道该给谁
  rationale: 自然表达原文的期限结构，并保留对受赠对象作出辨识的要求。
theological_decisions:
- issue: 本句是否要求无条件给予，还是辨明受赠者后再给予
  choice: 保留“直到你知道该给谁”的条件性措辞
  alternative: 解释为只应给真正有需要或配得的人
  rationale: 原文要求先知道给予对象，却没有明确规定辨识标准；译文不额外加入“配得”“真正贫穷”等解释。
- issue: “施舍冒汗”的含义
  choice: 直译其比喻性表达
  alternative: 意译为“把施舍握在手里，慎重考虑后再给”
  rationale: 原文比喻刻意而强烈，可能同时暗示等待、谨慎和紧握；直译可保存其开放性与修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“不过”承接上文并表达转折；引语保留原文简短有力的训诫语气。
