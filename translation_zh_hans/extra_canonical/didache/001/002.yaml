- from: 所以，生命之道是这样的：第一，你要爱那创造你的上帝；第二，要爱邻人如同爱自己。凡是你不愿发生在自己身上的事，你也不要对别人做。
  to: 生命之道是这样的：第一，你要爱创造你的上帝；第二，要爱你的邻人，如同爱自己。凡是你不愿发生在自己身上的事，你也不要将这些事做在别人身上。
  rationale: 删除不必要的因果性“所以”，并以更自然的汉语处理创造者定语；补足“你的”以对应 σου。末句保留前半“发生在……身上”和后半“做在……身上”的动词张力，同时保留 καὶ σὺ 的“也”。原文及所给英文审计资料均未提出需要转入中文正文的文本异文或解释性脚注，故不设脚注。
