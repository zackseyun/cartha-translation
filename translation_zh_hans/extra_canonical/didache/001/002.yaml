  text: Ἡ μὲν οὖν ὁδὸς τῆς ζωῆς ἐστιν αὕτη· πρῶτον, ἀγαπήσεις τὸν Θεὸν τὸν ποιήσαντά σε· δεύτερον, τὸν πλησίον σου ὡς σεαυτόν· πάντα δὲ ὅσα ἐὰν θελήσῃς μὴ γίνεσθαί σοι, καὶ σὺ ἄλλῳ μὴ ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/002.yaml
  text: 'This is the way of life: first[a], you shall love God who made you; second, your neighbor as yourself. And whatever you would not want to happen to you, do not do to another either.'
translation:
  language: zh_hans
  text: 生命之道是这样的：第一，你要爱创造你的上帝；第二，要爱你的邻人，如同爱自己。凡是你不愿发生在自己身上的事，你也不要将这些事做在别人身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδὸς τῆς ζωῆς
  choice: 生命之道
  rationale: 保留“道路”作为生活方式和人生方向的比喻，并以现代汉语中简洁庄重的“之道”表达。
- source_word: ἀγαπήσεις
  choice: 你要爱
  rationale: 希腊语为将来时形式，但在此承担诫命功能；译为“要爱”比直译为将来发生的动作更准确自然。
- source_word: τὸν Θεὸν τὸν ποιήσαντά σε
  choice: 那创造你的上帝
  rationale: 保留定语分词所强调的创造者身份；“上帝”是现代普通话中自然且庄重的 Θεός 对应词。
- source_word: τὸν πλησίον σου
  choice: 邻人
  rationale: 这里指与人相接、需要人去爱的他者，不限于住处相邻者；“邻人”能保留这一伦理含义。
- source_word: καὶ σὺ
  choice: 你也
  rationale: 明确呈现 καί 与显式代词 σύ 所带出的附加和强调意味，突出受教者本人同样不可如此待人。
theological_decisions:
- issue: “爱邻人如同自己”中省略谓语的处理
  choice: 补出“要爱”，译作“第二，要爱邻人如同爱自己”
  alternative: 第二，邻人如同自己
  rationale: 原文承接前句而省略 ἀγαπήσεις；现代汉语若不补出谓语会显得残缺，补出后不增加新的神学含义。
- issue: 负面金律中“发生”与“做”的张力
  choice: 分别保留为“不愿发生在自己身上”与“不要对别人做”
  alternative: 凡你不愿别人怎样待你，你也不要怎样待别人
  rationale: 原文先用 γίνεσθαι（发生、临到），后用 ποιεῖν（做）；不将两者统一改写，以保留原句措辞上的张力。
translation_notes:
  register: 采用现代标准普通话的简体中文，语气庄重而易懂。保留开头 μὲν οὖν 的承接意味，以“所以”引入；诫命部分使用“要……不要……”的自然命令表达。
