review_pass:
  verdict: revise
  source_fidelity: 开头“所以”将 μὲν οὖν 误作明确的因果推论；此处主要是篇章承接和引出，汉语不译更稳妥。末句的“你也”恰当保留了 καὶ σὺ 的附加/强调意味。补出“你的”可对应 σου。
  naturalness: 原译整体通顺庄重，但“那创造你的上帝”略显书面且定语指示词不必要；“生命之道是这样的”及“创造你的上帝”更自然。末句改为“将这些事做在别人身上”可使“事”与后句的施行对象明确衔接。
  terminology: “生命之道”“上帝”“邻人”均适合本段的庄重伦理训诲语体；“邻人”保留 πλησίον 不仅指地理邻居的开放含义。
  issues:
  - severity: low
    issue: “所以”过度表达因果关系。
    rationale: μὲν οὖν 在此作为承接并引出说明的篇章性组合，不必译为带明确推论力度的“所以”。
  - severity: low
    issue: 未明示“你的邻人”。
    rationale: τὸν πλησίον σου 含 σου；汉语虽可在语境中省略，但明示“你的”能以极小代价保留原文信息。
  - severity: low
    issue: “那创造你的上帝”略不自然。
    rationale: 希腊语定语分词可自然译为前置定语“创造你的上帝”，无需添加“那”。
  revised_text: 生命之道是这样的：第一，你要爱创造你的上帝；第二，要爱你的邻人，如同爱自己。凡是你不愿发生在自己身上的事，你也不要将这些事做在别人身上。
