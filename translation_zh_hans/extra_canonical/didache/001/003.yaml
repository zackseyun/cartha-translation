id: DID.1.3
reference: Didache 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τούτων δὲ τῶν λόγων ἡ διδαχὴ ἐστὶν αὕτη· Εὐλογεῖτε τοὺς καταρωμένους ὑμῖν καὶ προσεύχεσθε ὑπὲρ τῶν ἐχθρῶν ὑμῶν, νηστεύετε δὲ ὑπὲρ τῶν διωκόντων ὑμᾶς· ποία γὰρ χάρις, ἐὰν ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς· οὐχὶ καὶ τὰ ἔθνη τὸ αὐτὸ ποιοῦσιν ; ὑμεῖς δὲ ἀγαπᾶτε τοὺς μισοῦντας ὑμᾶς καὶ οὐχ ἕξετε ἐχθρόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/003.yaml
  text: 'And the teaching of these words is this: bless those who curse you, and pray for your enemies, and fast for those who persecute you. For what credit is it if you love those who love you? Do not even the Gentiles do the same? But you, love those who hate you, and you will not have an enemy.'
translation:
  language: zh_hans
  text: 这些话的教导是这样的：要祝福咒诅你们的人，为你们的仇敌祷告，并为迫害你们的人禁食。因为你们若爱那些爱你们的人，有什么可称许的呢？就连外邦人不也是这样做吗？但你们要爱那些恨你们的人，这样你们就不会有仇敌了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们就不会有仇敌了”也可理解为“你们就不会把任何人当作仇敌”。原文没有明确区分客观上没有敌对者，还是自己不再以人作仇敌。
    reason: 保留末句在客观状态与伦理态度之间的真实歧义。
lexical_decisions:
- source_word: ἡ διδαχή
  choice: 教导
  rationale: 直接表达教训、训导之意，也与作品名称《教导篇》的语义相符；此处不必专名化。
- source_word: Εὐλογεῖτε
  choice: 要祝福
  rationale: 保留命令语气及“说祝福的话、求福”的宗教含义。
- source_word: χάρις
  choice: 可称许的
  rationale: 此处按语境表示因超越互惠之爱而得到的认可或可贵之处；避免译成“恩典”而过早限定神学含义。
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 指群体边界之外的列国之民；“外族人”较自然，并避免“异教徒”附带的贬义和解释性。
- source_word: ἐχθρόν
  choice: 仇敌
  rationale: 与前文“仇敌”保持词汇呼应，并保留末句简洁而带张力的绝对表述。
theological_decisions:
- issue: 末句“οὐχ ἕξετε ἐχθρόν”的因果或结果关系
  choice: 这样你们就不会有仇敌了
  alternative: 你们也不会把任何人当作仇敌
  rationale: 原文直译是“你们将不会有仇敌”，并未明确说明是客观上无人敌对，还是主观上不再视人为敌；正文保留其表面陈述，脚注提示歧义。
- issue: χάρις 的神学色彩
  choice: 有什么可称许的呢
  alternative: 有什么恩典呢／有什么功劳呢
  rationale: 上下文是反问仅爱爱己者有何特别之处。“可称许”既符合语用，也避免将其固定为功德论或专门的恩典术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“要……”“但你们要……”呈现劝诫节奏；保留原文由祝福、祷告、禁食到爱仇敌的递进，以及末句未经弱化的伦理张力。
