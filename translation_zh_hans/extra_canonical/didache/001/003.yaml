  to: 这些话的教导是这样的：要祝福咒诅你们的人，为你们的仇敌祷告，并为迫害你们的人禁食。因为你们若爱那些爱你们的人，有什么可称许的呢？就连外邦人不也是这样做吗？但你们要爱那些恨你们的人，这样你们就不会有仇敌了。[a]
