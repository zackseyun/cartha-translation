  terminology: “教导”“祝福”“祷告”“禁食”“仇敌”均恰当。“外邦人”比“外族人”更能对应τὰ ἔθνη，且并不必然断言其宗教身份。“可称许的”可保留，用以传达χάρις在此反问中的“可嘉、值得认可”之意。
