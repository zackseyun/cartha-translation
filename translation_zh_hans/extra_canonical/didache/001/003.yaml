  - severity: medium
    issue: τὰ ἔθνη译作“外族人”未充分体现其历史语境。
    rationale: 该词通常指“列邦、外邦人”，即相对于说话群体的非犹太／非本群体之人，并非主要按现代民族意义所说的“外族”。“外邦人”是更稳妥的对应。
