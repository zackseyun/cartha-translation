source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀπέχου τῶν σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν. Ἐάν τις σοὶ δῷ ῥάπισμα εἰς τὴν δεξιὰν σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην, καὶ ἔσῃ τέλειος· ἐὰν ἀγγαρεύσῃ σε τις μίλιον ἕν, ὕπαγε μετʼ αὐτοῦ δύο· ἐὰν ἄρῃ τις τὸ ἱμάτιόν σου, δὸς αὐτῷ καὶ τὸν χιτῶνα· ἐὰν λάβῃ τις ἀπὸ σοῦ τὸ σόν, μὴ ἀπαίτει· οὐδὲ γὰρ δύνασαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/004.yaml
  text: Abstain from fleshly and worldly desires. If anyone gives you a blow on the right cheek[a], turn to him the other also, and you will be perfect. If anyone compels you to go one mile, go with him two. If anyone takes away your cloak, give him your tunic also. If anyone takes from you what is yours, do not demand it back, for you are not able.
translation:
  language: zh_hans
  text: 要远避肉体的欲望和世俗的欲望。若有人打你的右脸一巴掌，就把另一边脸也转向他，你就会成为完全的人[a]。若有人强迫你走一里路，就同他走两里；若有人拿走你的外衣，连内衣也给他；若有人从你这里拿走属于你的东西，不要讨回来，因为你也不能。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全”也可理解为“完整”或“成熟”。
    reason: τέλειος具有“完全、完整、成熟”等相近含义；脚注附于其正文译词，以保留原文语义范围，而不在正文中预先限定为单一解释。
lexical_decisions:
- source_word: Ἀπέχου
  choice: 要远避
  rationale: 表达持续克制、远离之意，比单纯的“不要”更贴近该命令的语气。
- source_word: σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν
  choice: 肉体和世俗的欲望
  rationale: 保留两个并列形容词，不把“肉体”窄化为仅指性欲，也不额外引入宗派性解释。
- source_word: ῥάπισμα
  choice: 打一巴掌
  rationale: 该词指掌掴或击打；此处用现代汉语自然表达，同时保留具体动作。
- source_word: τέλειος
  choice: 完全的人
  rationale: 保留“完全、完整、成熟”的语义张力，不直接改译为单一解释性的“成熟”。
- source_word: ἀγγαρεύσῃ
  choice: 强迫你走
  rationale: 该词指征用、强迫服役；结合距离宾语“一个μίλιον”，补出汉语所需的移动动词“走”。
- source_word: ἱμάτιον / χιτών
  choice: 外衣 / 内衣
  rationale: 以功能对应用现代读者易懂的词，保留两件衣物的区分及由外至内的递进。
- source_word: μὴ ἀπαίτει
  choice: 不要讨回来
  rationale: 准确表达要求归还、索回之意，语气简洁有力。
- source_word: οὐδὲ γὰρ δύνασαι
  choice: 因为你也不能
  rationale: 原文结尾简短且所指略显突兀；译文保留这种省略与张力，不擅自补明“不能做什么”。
theological_decisions:
- issue: τέλειος所表达的伦理目标
  choice: 译作“完全的人”，并以脚注保留“完整、成熟”的可能含义
  alternative: 成熟的人；完美无缺的人
  rationale: “完美无缺”容易导入绝对无罪的含义，“成熟”又会过早消解词义；“完全”最能保留原文的广度。
- issue: 结尾“因为你也不能”的理解
  choice: 保留原文省略，不补充具体对象或能力范围
  alternative: 因为你无法把它要回来；因为你本来就无权索回
  rationale: 希腊文没有明说究竟“不能”什么，且表述本身带有解释张力；不应代作者作神学或伦理上的限定。
translation_notes:
  register: 采用现代、庄重而易懂的命令式表达；句式保留原文连续的条件结构和逐步推进的伦理劝诫。距离单位“μίλιον”译为“一里路、两里”，作为古代借词所指的行程单位，不按现代中国市里精确换算。
