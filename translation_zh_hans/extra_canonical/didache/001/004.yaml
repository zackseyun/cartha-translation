  to: 要远避肉体的欲望和世俗的欲望。若有人打你的右脸一巴掌，就把另一边脸也转向他，你就会成为完全的人[a]。若有人强迫你走一里路，就同他走两里；若有人拿走你的外衣，连内衣也给他；若有人从你这里拿走属于你的东西，不要讨回来，因为你也不能。
