  text: Ὁδοὶ δύο εἰσί, μία τῆς ζωῆς καὶ μία τοῦ θανάτου, διαφορὰ δὲ πολλὴ μεταξὺ τῶν δύο ὁδῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/001.yaml
  text: There are two ways, one of life and one of death, and there is a great difference between the two ways.
translation:
  language: zh_hans
  text: 有两条路：一条是生命之路，一条是死亡之路；这两条路之间有很大的差别。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ δύο
  choice: 两条路
  rationale: 直译核心意象，保留原文以“道路”比喻两种生活取向的表达。
- source_word: τῆς ζωῆς
  choice: 生命之路
  rationale: 将属格关系自然表达为“生命之路”，不额外限定为今生、永生或得救。
- source_word: τοῦ θανάτου
  choice: 死亡之路
  rationale: 与“生命之路”形成对称，并保留“死亡”的直接力度。
- source_word: διαφορὰ δὲ πολλὴ
  choice: 有很大的差别
  rationale: 准确传达差异显著之意，使用现代普通读者易懂的措辞。
- source_word: μεταξὺ τῶν δύο ὁδῶν
  choice: 这两条路之间
  rationale: 明确回指前述两条路，同时维持原句结构与对比。
theological_decisions:
- issue: “生命”与“死亡”的范围
  choice: 不加解释，保留“生命之路／死亡之路”
  alternative: 译作“通往永生的路／通往灭亡的路”
  rationale: 原文使用名词属格，并未明说道路的终点或限定其末世含义；直译可保留其伦理与终末层面的张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；以冒号和分号呈现原文的总述、并列与结论关系。
