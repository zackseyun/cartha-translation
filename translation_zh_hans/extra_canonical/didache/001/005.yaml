id: DID.1.5
reference: Didache 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Παντὶ τῷ αἰτοῦντί σε δίδου καὶ μὴ ἀπαίτει· πᾶσι γὰρ θέλει δίδοσθαι ὁ πατὴρ ἐκ τῶν ἰδίων χαρισμάτων. Μακάριος ὁ διδοὺς κατὰ τὴν ἐντολήν· ἀθῷος γάρ ἐστιν· οὐαὶ τῷ λαμβάνοντι· εἰ μὲν γὰρ χρείαν ἔχων λαμβάνει τις, ἀθῷος ἔσται· ὁ δὲ μὴ χρείαν ἔχων δώσει δίκην, ἱνατί ἔλαβε καὶ εἰς τί, ἐν συνοχῇ δὲ γενόμενος ἐξετασθήσεται περὶ ὧν ἔπραξε, καὶ οὐκ ἐξελεύσεται ἐκεῖθεν μέχρις οὗ ἀποδῷ τὸν ἔσχατον κοδράντην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/005.yaml
  text: Give to everyone who asks you[a], and do not demand it back; for the Father wants his own gifts to be given to all. Blessed is the one who gives according to the commandment, for he is innocent. But woe to the one who receives; for if someone receives while having need, he will be innocent, but the one not having need will pay the penalty for why he received and for what purpose. And having come under confinement, he will be examined concerning the things he did[b], and he will not come out from there until he repays the last quadrans.
translation:
  language: zh_hans
  text: 凡向你求的，你都要给；不要索回[a]。因为父愿意使众人从他自己的恩赐中得着施予。那照着诫命施予的人有福了，因为他是无罪的；但那领受的人有祸了。因为人若有需要而领受，他将是无罪的；但没有需要而领受的人，必为自己为何领受、为了什么而领受受惩罚。他被拘禁后，必为自己所做的事受审查；他不会从那里出来，直到还清最后一枚戈得兰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不要索回”直译为“不要再要求”；指不要向已领受者要求归还。
    reason: 说明ἀπαίτει的“索回、要求归还”之义。
  - marker: b
    text: “戈得兰”（κοδράντης）是罗马的小额铜币，约等于一个quadrans；此处不作现代币值换算。
    reason: 保留并解释原文具体的历史货币名称。
lexical_decisions:
- source_word: ἀπαίτει
  choice: 讨回来
  rationale: 该动词指索回、要求归还；在施予语境中译作“讨回来”自然且准确。
- source_word: χαρισμάτων
  choice: 恩赐
  rationale: 保留 χάρισμα 所含由恩惠而来的赠予之意，同时避免仅译作普通“财物”。
- source_word: ἀθῷος
  choice: 无罪的
  rationale: 此处表示不负罪责、无可归咎；“无罪”能贯穿施予者与确有需要的领受者两处用法。
- source_word: δώσει δίκην
  choice: 受惩罚
  rationale: 希腊语惯用表达，意为付出刑罚、承担惩处；译为“受惩罚”符合现代汉语。
- source_word: ἐν συνοχῇ
  choice: 被拘禁
  rationale: 该短语可指受拘束、陷于禁闭；上下文的受审与不得出来支持拘禁含义，但不明确指定监狱。
- source_word: κοδράντην
  choice: 小钱
  rationale: κοδράντης 是价值极低的罗马铜币；正文用易懂的功能性表达，避免生硬音译。
theological_decisions:
- issue: 父与恩赐分配之间的句法关系
  choice: 父愿意把自己的恩赐给所有人
  alternative: 父愿意从自己的恩赐中给所有人
  rationale: πᾶσι…δίδοσθαι…ἐκ τῶν ἰδίων χαρισμάτων 的句法略显压缩。正文采取“自己的恩赐被给所有人”的自然理解，不把“父”以外的施予主体额外明确化。
- issue: 有需要者的无罪状态
  choice: 他将是无罪的
  alternative: 他是无罪的
  rationale: 保留 ἔσται 的将来时态，使其与末后审查和惩罚的语境相呼应，而不进一步规定审判时间。
- issue: 拘禁与末后审判的性质
  choice: 被拘禁后，必因自己所做的事受审查
  alternative: 陷入困境后，将为自己所做的事受查问
  rationale: 上下文“不能从那里出来”倾向实际拘禁的意象，但原文没有明确命名地狱、炼狱或监狱，因此不导入宗派性解释。
- issue: 偿还最后小钱的条件句力度
  choice: 若不还清……就绝不能……
  alternative: 直到还清……才会……
  rationale: οὐ…μέχρις οὗ 表达强烈的“决不，直到”结构；正文保留其警告力度，同时不推论最终必能偿清。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“施予”与“领受”形成反复对照；“有福了／有祸了”保留训诫文体。未将“那里”具体解释为任何特定末世场所，也未把极小铜币作可能失真的现代币值换算。
