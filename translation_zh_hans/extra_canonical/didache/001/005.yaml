revisions:
- from: 凡向你求的，都要给他[a]，不要讨回来；因为父愿意把自己的恩赐给所有人。那照着诫命施予的人有福了，因为他是无罪的。但那领受的人有祸了！若有人因有需要而领受，他将是无罪的；但没有需要却领受的人，必因自己为何领受、领受来作什么而受惩罚。他被拘禁后，必因自己所做的事受审查[b]；若不还清最后一个小钱，就绝不能从那里出来。
  to: 凡向你求的，你都要给；不要索回[a]。因为父愿意使众人从他自己的恩赐中得着施予。那照着诫命施予的人有福了，因为他是无罪的；但那领受的人有祸了。因为人若有需要而领受，他将是无罪的；但没有需要而领受的人，必为自己为何领受、为了什么而领受受惩罚。他被拘禁后，必为自己所做的事受审查；他不会从那里出来，直到还清最后一枚戈得兰[b]。
