  text: Εἰ μὲν γὰρ δύνασαι βαστάσαι ὅλον τὸν ζυγὸν τοῦ Κυρίου, τέλειος ἔσῃ· εἰ δʼ οὐ δύνασαι, ὃ δύνῃ τοῦτο ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/002.yaml
  text: For if you are able to bear the whole yoke of the Lord, you will be perfect; but if you are not able, do what you can.
translation:
  language: zh_hans
  text: 因为，如果你能承担主的整个轭，你就会成为完全的人；但如果不能，就做你力所能及的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάσαι
  choice: 负起
  rationale: 既保留承担重负的含义，也自然配合“轭”这一比喻。
- source_word: ὅλον τὸν ζυγὸν τοῦ Κυρίου
  choice: 主的整个轭
  rationale: 尽量保留希腊文的范围词“整个”和属格关系，不把“轭”具体解释为某一套规条或特定教义。
- source_word: τέλειος
  choice: 完全的人
  rationale: 表达成熟、完备或达到完全之意，同时保留原文可能具有的道德与属灵张力。
- source_word: ὃ δύνῃ τοῦτο ποίει
  choice: 就做你力所能及的
  rationale: 采用自然的现代汉语，准确传达按自身能力而行的意思。
theological_decisions:
- issue: “主的整个轭”所指为何
  choice: 保留“主的整个轭”这一比喻，不加具体界定
  alternative: 译作“主全部的要求”或明确指摩西律法
  rationale: 原文本身未明说其具体范围；直译可避免把某一传统解释写入正文。
- issue: τέλειος 的含义
  choice: 译为“完全的人”
  alternative: “成熟的人”或“完美的人”
  rationale: “完全”较能保留原词在完备、成熟和道德完全之间的语义张力；加“的人”使现代汉语句子自然。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语；保留“轭”的圣经性比喻，并以“力所能及”使末句简洁自然。
