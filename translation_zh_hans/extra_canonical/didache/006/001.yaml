  text: Ὅρα μή τις σε πλανήσῃ ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς, ἐπεὶ παρεκτὸς Θεοῦ σε διδάσκει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/001.yaml
  text: See that no one leads you astray from this way of the teaching, since he teaches you apart from God.
translation:
  language: zh_hans
  text: 你要谨慎，不要让任何人把你从这条教导之道上引入歧途，因为他是在撇开上帝的情况下教导你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅρα μή τις σε πλανήσῃ
  choice: 你要谨慎，不要让任何人把你……引入歧途
  rationale: ὅρα μή带有警戒意味；πλανάω指使人迷失、误入歧途。此译既保留命令语气，也符合现代汉语表达。
- source_word: ταύτης τῆς ὁδοῦ τῆς διδαχῆς
  choice: 这条教导之道
  rationale: 保留ὁδός“道路”和διδαχή“教导”的双重意象，并与《十二使徒遗训》前文“两条道路”的主题相呼应。
- source_word: παρεκτὸς Θεοῦ
  choice: 与上帝无关
  rationale: παρεκτός可表示“在……之外、撇开……”。这里描述该教导脱离上帝；译文不进一步断定其具体动机或性质。
theological_decisions:
- issue: παρεκτὸς Θεοῦ所表达的关系
  choice: 与上帝无关
  alternative: 离开上帝／在上帝以外
  rationale: 希腊文可指脱离或撇开上帝而教导。采用自然汉语表达，同时保留其神学批判，不将其强化为明确的敌对或异端判决。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“教导之道”略带凝练的宗教文献语体，以保留原文结构及全书的道路意象；“这样的人”明确承接前面的泛指人物，避免汉语代词性别造成不必要限定。
