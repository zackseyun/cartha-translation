  text: Περὶ δὲ τῆς βρώσεως, ὃ δύνασαι βάστασον· ἀπὸ δὲ τοῦ εἰδωλοθύτου λίαν πρόσεχε· λατρεία γάρ ἐστι θεῶν νεκρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/003.yaml
  text: And concerning food, bear what you are able; but be very careful about food sacrificed to idols, for it is the worship of dead gods.
translation:
  language: zh_hans
  text: 至于饮食，尽你所能承担；但对献给偶像的食物要格外警惕，因为这就是对死去的诸神的敬拜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώσεως
  choice: 饮食
  rationale: 该词在此泛指吃食、食物方面的事，与上下文的生活规条相符；“饮食”在现代汉语中自然且庄重。
- source_word: ὃ δύνασαι βάστασον
  choice: 你能承担多少，就承担多少
  rationale: 保留 δύνασαι（能够）与 βάστασον（承担、负担）的比喻性表达，也保留原文未明确说明具体应承担何种饮食要求的开放性。
- source_word: εἰδωλοθύτου
  choice: 献给偶像的食物
  rationale: 该名词通常指献祭给偶像之物，在此依饮食语境明确译作“食物”，避免生硬的“偶像祭物”。
- source_word: λίαν πρόσεχε
  choice: 要格外谨慎，不可吃
  rationale: λίαν 表示高度程度，πρόσεχε 表示警戒、留意；结合其宾语和饮食语境，以“格外谨慎”传达警戒，并用“不可吃”自然说明实际所指。
- source_word: λατρεία
  choice: 敬拜
  rationale: 该词指宗教性的侍奉或崇拜；“敬拜”准确表达这里的祭祀宗教行为。
- source_word: θεῶν νεκρῶν
  choice: 死去之神
  rationale: 按原文直译，保留“神”与“死”的尖锐张力，不擅自改释为“没有生命的偶像”或“假神”。
theological_decisions:
- issue: 对偶像祭物的警戒是否表述为明确禁令
  choice: 译作“要格外谨慎，不可吃献给偶像的食物”
  alternative: “要格外提防献给偶像的食物”
  rationale: 原文 πρόσεχε 字面是“留意、警戒”，未直接使用“不可吃”；但在“饮食”语境中，警戒的实际指向是不食用。正文以自然汉语明示其含义，同时保留“谨慎”的措辞，避免仅译成抽象关注。
- issue: “死去之神”的本体论含义
  choice: 保留“死去之神”
  alternative: “没有生命的神”或“死的诸神”
  rationale: 原文 θεῶν νεκρῶν 具有刻意的反讽和神学张力；不将其解释性改写为“假神”或“偶像”，以免消除原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。分号对应原文两项饮食劝诫之间的转折；末句保留简洁有力的因果说明。
