  source_fidelity: 译文准确传达两项禁令及随后“不可……却要……”的交往劝诫。"高抬自己"对应ὑψώσεις σεαυτόν；"让自己的心放肆"在本段劝诫语境中恰当表达θράσος所含的鲁莽、放纵或不知分寸的胆量。"心"可自然承载ψυχή在此处的内在自我之义。
  naturalness: 行文简洁、庄重且符合现代汉语劝诫文体。“不可……也不可……却要……”衔接自然；“与……亲近／来往”也清楚表达关系和交游。
  terminology: “正直、谦卑的人”妥善区分δικαίων与ταπεινῶν。“高傲的人”在与“谦卑的人”的对照下是ὑψηλῶν的合理语境化理解；虽该词可有“高位者”色彩，但此处译法未造成不当的教义性限定。
