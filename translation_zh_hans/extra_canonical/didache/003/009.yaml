id: DID.3.9
reference: Didache 3:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐχ ὑψώσεις σεαυτὸν οὐδὲ δώσεις τῇ ψυχῇ σου θράσος. Οὐ κολληθήσεται ἡ ψυχή σου μετὰ ὑψηλῶν, ἀλλὰ μετὰ δικαίων καὶ ταπεινῶν ἀναστραφήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/009.yaml
  text: You shall not exalt yourself, nor give your soul boldness. Your soul shall not be joined with the lofty, but you shall associate with the righteous and humble.
translation:
  language: zh_hans
  text: 不可高抬自己，也不可让自己的心放肆。你的心不可与高傲的人亲近，却要与正直、谦卑的人来往。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑψώσεις σεαυτόν
  choice: 高抬自己
  rationale: 保留“抬高、 exalt”的形象，同时用现代汉语自然表达自我抬举之意。
- source_word: ψυχή
  choice: 心
  rationale: 此处指人的内在自我、意愿与倾向；译作“心”比直译“灵魂”更符合现代汉语劝诫语境。
- source_word: θράσος
  choice: 放肆
  rationale: 该词可指冒失的胆量、放肆或狂妄；“让自己的心放肆”保留其负面意味，又避免额外加入“傲慢”等原文未明说的限定。
- source_word: κολληθήσεται
  choice: 亲近
  rationale: 原词有黏附、紧密结合之意；在与人交往的语境中译为“亲近”，自然且保留关系密切的含义。
- source_word: ὑψηλῶν
  choice: 高傲的人
  rationale: 实词化形容词，语境中与“谦卑的人”相对，主要指自高者；译出“人”以符合汉语表达。
- source_word: δικαίων καὶ ταπεινῶν
  choice: 正直、谦卑的人
  rationale: 分别呈现 δικαίων 的正直/公义与 ταπεινῶν 的谦卑，不将两类品质合并。
- source_word: ἀναστραφήσῃ
  choice: 来往
  rationale: 该动词在此指生活交往、相处；“来往”简洁地表达与某类人为伴的意思。
theological_decisions:
- issue: ὑψηλῶν 是指社会地位高者还是内心高傲者
  choice: 高傲的人
  alternative: 位高的人／显贵的人
  rationale: 与 ταπεινῶν（谦卑的人）形成最直接的品格对照；但原词本身也可含“高位”意味，正文依语境采用较自然的道德含义。
- issue: ψυχή 的汉语表达
  choice: 心
  alternative: 灵魂／性命
  rationale: 本节谈内在态度及与人亲近的取向，“心”最贴合现代汉语，也不引入关于灵魂构成的教义判断。
translation_notes:
  register: 采用简洁、庄重的劝诫语体，以“不可……却要……”对应原文的禁令与转折。避免生硬照搬“把胆量给灵魂”，并保持两句中“心”的衔接。
