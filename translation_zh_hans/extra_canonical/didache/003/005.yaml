  text: Τέκνον μου, μὴ γίνου ψεύστης· ἐπειδὴ ὁδηγεῖ τὸ ψεῦσμα εἰς τὴν κλοπήν· μηδὲ φιλάργυρος μηδὲ κενόδοξος· ἐκ γὰρ τούτων ἁπάντων κλοπαὶ γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/005.yaml
  text: My child, do not become a liar, since lying leads to theft; nor be money-loving, nor vainglorious, for from all these thefts are born.
translation:
  language: zh_hans
  text: 我的孩子，不要成为说谎的人，因为谎言会把人引向偷窃；也不要贪爱钱财，不要贪图虚荣，因为这一切都会滋生偷窃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψεύστης
  choice: 说谎的人
  rationale: 准确表达“说谎者”，同时比生硬的名词标签更符合现代汉语。
- source_word: τὸ ψεῦσμα
  choice: 谎言
  rationale: 保留原文由“说谎的人”转到“谎言”这一名词表达。
- source_word: ὁδηγεῖ ... εἰς τὴν κλοπήν
  choice: 会把人引向偷窃
  rationale: 保留“引导、带向”的路径意象；补出泛指的“人”，使汉语自然。
- source_word: φιλάργυρος
  choice: 贪爱钱财
  rationale: 表达对金钱的贪恋，不将词义缩窄为一般节俭或单次贪念。
- source_word: κενόδοξος
  choice: 贪图虚荣
  rationale: 兼顾 κενός（空虚）与 δόξα（荣耀、名声）构成的“虚荣、自负求名”之义，并采用现代常用表达。
- source_word: κλοπαὶ γεννῶνται
  choice: 滋生偷窃
  rationale: 以自然汉语保留“偷窃被生出、产生”的因果意象，并用“偷窃”涵盖原文复数所指的多次或多种偷窃行为。
