id: DID.3.10
reference: Didache 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰ συμβαίνοντά σοι ἐνεργήματα ὡς ἀγαθὰ προσδέξῃ, εἰδὼς ὅτι ἄτερ Θεοῦ οὐδὲν γίνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/010.yaml
  text: You shall accept the things that happen to you as good, knowing that apart from God nothing happens.
translation:
  language: zh_hans
  text: 凡临到你的事，你都要当作好事来接受，因为你知道，离了上帝，什么事也不会发生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ συμβαίνοντά σοι ἐνεργήματα
  choice: 凡临到你的事
  rationale: συμβαίνοντά σοι指发生在某人身上、临到某人的事；ἐνεργήματα在此修饰或补充说明这些发生之事。译文采用自然且涵盖面较广的表达，不把它缩窄为灾祸或特殊作为。
- source_word: ὡς ἀγαθὰ προσδέξῃ
  choice: 当作好事来接受
  rationale: 保留ὡς所表达的“作为、当作”关系，并以“接受”传达προσδέχομαι的接纳意味，不额外解释这些事为何是好的。
- source_word: εἰδὼς
  choice: 因为你知道
  rationale: 该分词说明接受这些事的认知基础；用原因性连接使现代汉语流畅，同时保留其逻辑关系。
- source_word: ἄτερ Θεοῦ
  choice: 离了上帝
  rationale: 直译“没有／离开上帝”；“离了上帝”在现代宗教汉语中自然，并保留原文可能涉及许可、旨意或参与方式的含混性。
- source_word: οὐδὲν γίνεται
  choice: 什么事也不会发生
  rationale: 按其宽泛字面意义翻译，不将γίνεται具体化为“受造”“成就”或“被许可”。
theological_decisions:
- issue: “离了上帝，什么事也不会发生”与上帝对事件的关系
  choice: 保留原文的概括性陈述，不注明上帝是直接促成、容许还是以其他方式与事件相关
  alternative: 译作“若非上帝许可，什么事也不会发生”
  rationale: 原文没有“许可”一词；加入该词会替文本化解其神学张力，并限定ἄτερ Θεοῦ的含义。
- issue: 把临到人的事“当作好事”接受
  choice: 保留“当作好事”的劝勉
  alternative: 译作“以良善的态度接受”或“相信最终会成为好事”
  rationale: ἀγαθὰ在语法上指这些事被作为“好的事”来接受，而不是仅描述接受者的态度或事情的最终结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……都……”呈现概括性的劝诫；“临到你”比单纯“发生在你身上”更凝练，且仍为普通读者易懂。未添加脚注，因此正文无脚注标记。
