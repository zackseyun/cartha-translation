id: DID.3.3
reference: Didache 3:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ἐπιθυμητής· ὁδηγεῖ γὰρ ἡ ἐπιθυμία πρὸς τὴν πορείαν· μηδὲ αἰσχρολόγος μηδὲ ὑψηλοόφθαλμος· ἐκ γὰρ τούτων ἀπάντων μοιχεῖαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/003.yaml
  text: My child[a], do not become lustful, for lust leads to sexual immorality; nor foul-mouthed, nor haughty, for from all these adulteries are born.
translation:
  language: zh_hans
  text: 我的孩子，不要成为贪恋情欲的人，因为情欲会引向淫乱[a]；也不要口出秽语，不要眼目放肆[b]，因为这一切都会生出种种奸淫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据OCR文本作 πορείαν，意为“行程”；按上下文及通行希腊文本，应为 πορνείαν，意为“淫乱”。
    reason: 说明底本文字疑似OCR漏字及正文采用的校勘判断。
  - marker: b
    text: 原词字面可理解为“眼目高抬”，因而也可译作“眼目高傲”；在这里也可能指目光放肆、带着欲念观看。
    reason: 保留 ὑψηλοόφθαλμος 在字面意义与性伦理语境之间的真实歧义。
lexical_decisions:
- source_word: ἐπιθυμητής / ἐπιθυμία
  choice: 贪恋情欲的人／情欲
  rationale: 在本句以淫乱和奸淫为语境，所指不是一般愿望，而是放纵的性欲；同时保留同根词的重复。
- source_word: πρὸς τὴν πορείαν
  choice: 引向淫乱
  rationale: 所给OCR文本的 πορείαν 通常意为“行程”，在此语义不通；按上下文和通行文本应为 πορνείαν，即“淫乱”。以脚注明示文本问题，不将校勘判断隐藏起来。
- source_word: αἰσχρολόγος
  choice: 口出秽语
  rationale: 表达说淫秽、羞耻之话的习惯，比笼统的“言语粗俗”更贴合本段的性伦理语境。
- source_word: ὑψηλοόφθαλμος
  choice: 眼目放肆
  rationale: 该复合词字面为“眼目高抬”，既可能表示高傲，也可在本句语境中指目光不受约束、带着欲念观看；正文采用能贴合上下文且不过度具体化的表达，并以脚注保留另一解释。
- source_word: μοιχεῖαι
  choice: 种种奸淫
  rationale: 保留希腊文复数所表达的多种奸淫行为；“奸淫”也比仅指已婚者法律意义上的“通奸”更自然、宽广。
theological_decisions:
- issue: ὑψηλοόφθαλμος 是指骄傲还是淫邪的目光
  choice: 正文译作“眼目放肆”
  alternative: “眼目高傲”或“目光淫邪”
  rationale: 词的字面构成支持“眼目高抬／高傲”，但它与情欲、秽语并列，并被说成产生奸淫，语境明显带有性方面的含义。“眼目放肆”保留这两方面的张力，脚注则明确歧义。
- issue: πορείαν 的文本是否按字面翻译
  choice: 按校勘上高度可信的 πορνείαν 译为“淫乱”
  alternative: 按所给OCR字面译为“行程”
  rationale: “情欲引向行程”在句中不成义，而少一个字母ρ即可形成符合语境及通行希腊文本的 πορνείαν。脚注公开说明这一判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我的孩子”保留师长劝诫的亲密语气；分号维持原句两组警告及其因果关系。避免使用过度教派化的术语。
