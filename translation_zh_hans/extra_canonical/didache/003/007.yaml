base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/007.yaml
  text: But be meek, because the meek will inherit the earth.
translation:
  language: zh_hans
  text: 但要温柔，因为温柔的人必承受大地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πραΰς / πραεῖς
  choice: 温柔 / 温柔的人
  rationale: “温柔”自然、庄重，也能表达受约束的谦和与不强暴；同一词根前后保持一致。
- source_word: κληρονομήσουσι
  choice: 必承受
  rationale: 保留“作为产业承受、继承”的圣经语感；“必”体现希腊语将来时在此引文中的应许意味。
- source_word: τὴν γῆν
  choice: 大地
  rationale: γῆ 可指土地、地或大地；此处采用“大地”，既符合相关经文的传统意象，也不把所指范围过早限定为某一块土地。
- source_word: ἐπεὶ
  choice: 因为
  rationale: 在此引出成为温柔之人的理由，“因为”符合上下文的因果关系，现代汉语也自然清楚。
theological_decisions:
- issue: “承受大地”的范围
  choice: 保留“大地”，不作解释性限定
  alternative: 译作“土地”或“全地”
  rationale: 原文 γῆ 本身具有一定语义宽度；正文不应擅自判定其专指应许之地、现世土地或末世更新后的全地。
- issue: 将来时的语气
  choice: 译作“必承受”
  alternative: “将承受”
  rationale: “必”较自然地传达这一格言式应许的确定性，同时不额外说明应验方式或时间。
translation_notes:
  register: 采用简洁、劝诫式的现代标准普通话，保留原文与《马太福音》5:5相呼应的结构。无脚注标记。
