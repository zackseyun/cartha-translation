source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γίνου μακρόθυμος καὶ ἐλεήμων καὶ ἄκακος καὶ ἡσύχιος καὶ ἀγαθὸς καὶ τρέμων τοὺς λόγους διὰ παντός, οὓς ἤκουσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/008.yaml
  text: Be patient and merciful and guileless and quiet and good[a], and always trembling at the words that you heard.
translation:
  language: zh_hans
  text: 要有耐心，有怜悯，不存恶意，安静，良善，并且要常常对你所听过的话存战兢之心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γίνου
  choice: 要有／要……为人
  rationale: 此处为持续性的道德劝勉；按现代汉语习惯以“要有……、为人……”统摄后列形容词及分词，比直译“要成为”自然，同时保留培养这些品格的意味。
- source_word: μακρόθυμος
  choice: 有耐心
  rationale: 表示长久忍耐、不轻易发怒；“有耐心”简明自然，适合一连串品格劝勉。
- source_word: ἐλεήμων
  choice: 有怜悯
  rationale: 保留主动怜悯、体恤他人的品格含义。
- source_word: ἄκακος
  choice: 不存恶意
  rationale: 该词可指无恶、纯真、无害；“不存恶意”在现代汉语中自然，并避免把它误解成智识上的天真。
- source_word: ἡσύχιος
  choice: 安静温和
  rationale: 兼顾安静、不滋事、平和的语义；单译“安静”容易仅被理解为不说话。
- source_word: ἀγαθὸς
  choice: 为人良善
  rationale: 表达道德上的良善；加入“为人”使汉语列举顺畅，也避免只表示能力上的“好”。
- source_word: τρέμων
  choice: 敬畏
  rationale: 字面为“战兢”；在对所领受之话语的态度上表达肃然敬重。译作“敬畏”符合自然汉语，但不把对象明确提升为神本身。
- source_word: διὰ παντός
  choice: 常常
  rationale: 表示始终、不断；“常常”在劝勉语体中自然，并传达持续性。
- source_word: τοὺς λόγους … οὓς ἤκουσας
  choice: 你所听过的那些话
  rationale: 保留复数“话语”和听闻的既成事实；“那些”对应关系代词所指的特定教导。
theological_decisions:
- issue: “战兢”的对象与性质
  choice: 敬畏你所听过的那些话
  alternative: 因你所听过的那些话而常常战兢
  rationale: 希腊文直接以“那些话”为宾语，描述对已领受教导的持续肃敬。正文采用自然汉语“敬畏”，不另加“神的话”等原文没有的神学限定。
- issue: γίνου所表达的是“成为”还是“保持为”
  choice: 以“要有……／要……为人”表达持续劝勉
  alternative: 要成为有耐心、有怜悯……的人
  rationale: γίνου可有“成为”或劝勉语境中的“要作／要保持”之意；现代汉语正文不强行判定起点状态，而以持续性的规范表达保留开放性。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。以平行短语呈现品格清单，并避免生硬照搬希腊语系词结构；原文没有需要设置脚注才能保留的重大异文或歧义。
