source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ γίνου ὀργίλος· ὁδηγεῖ γὰρ ἡ ὀργὴ πρὸς τὸν φόνον· μηδὲ ζηλωτὴς μηδὲ ἐριστικὸς μηδὲ θυμικός· ἐκ γὰρ τούτων ἀπάντων φόνοι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/002.yaml
  text: Do not become quick-tempered, for anger leads to murder; nor be jealous, nor quarrelsome, nor hot-headed, for from all these murders are born.
translation:
  language: zh_hans
  text: 不要变得易怒，因为愤怒会把人引向杀人；也不要嫉妒，不要好争，也不要暴躁，因为杀人的事都是由这些生出来的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργίλος
  choice: 易怒
  rationale: 指容易动怒、性情急躁；“易怒”简洁自然，并保留品格倾向的含义。
- source_word: ἡ ὀργὴ
  choice: 愤怒
  rationale: 与前面的“易怒”保持词义关联，同时在汉语中区分易怒的性情与实际的怒气。
- source_word: ζηλωτής
  choice: 嫉妒
  rationale: 此处位于一系列会导向杀人的恶习中，取该词的负面义“嫉妒”，与上下文相合。
- source_word: ἐριστικός
  choice: 好争
  rationale: 表达爱争执、好争斗的性情，比单纯的“争吵”更准确地体现形容人的用法。
- source_word: θυμικός
  choice: 暴躁
  rationale: 表示容易激愤、冲动发怒；“暴躁”是现代汉语中自然且贴切的品格描述。
- source_word: φόνοι γεννῶνται
  choice: 生出杀人的事
  rationale: 保留“生出”的因果隐喻及复数 φόνοι 的意味；“杀人的事”比抽象的“谋杀”更自然，也不限定法律意义上的预谋杀人。
theological_decisions:
- issue: 愤怒及相关恶习与杀人之间的关系
  choice: 译作“会把人引向杀人”及“都会生出杀人的事”
  alternative: 译作“就是杀人”或“必然导致谋杀”
  rationale: 原文表达导向与产生的关系，并未把愤怒直接等同于杀人，也未明确表示每次都必然造成杀人；译文保留其伦理警告和因果张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“不要变得易怒”对应 Μὴ γίνου，保留“不要成为/养成这种人”的动态意味；后半句用平行的“不要”使汉语节奏清楚。
