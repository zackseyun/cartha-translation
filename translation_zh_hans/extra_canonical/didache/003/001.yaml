  yaml_path: translation/extra_canonical/didache/003/001.yaml
  text: My child, flee from every evil thing, and from everything like it.
translation:
  language: zh_hans
  text: 我的孩子，要远避一切恶事，也要远避一切与恶相似的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: 我的孩子
  rationale: 保留亲切的教导口吻；τέκνον可指受教者，不必限定为亲生子女。
- source_word: φεῦγε ἀπό
  choice: 要远避
  rationale: 表达持续躲避、远离之意，比单纯“避免”更贴近命令语气和动作感。
- source_word: παντὸς πονηροῦ
  choice: 一切恶事
  rationale: 希腊语中性单数形容词作名词使用，泛指各种邪恶之事；译作“恶事”自然且不把范围限于具体物件。
- source_word: παντὸς ὁμοίου αὐτοῦ
  choice: 一切与恶相似的事
  rationale: 忠实保留“与它相似”的宽泛表达，并明确代词所指为前述的“恶”，避免汉语指代含混。
theological_decisions:
- issue: “与恶相似”的范围
  choice: 保留宽泛措辞，不具体界定哪些事物属于此类
  alternative: 译成“各样恶的苗头”或“近似邪恶的一切事”
  rationale: 原文没有说明判断标准或具体对象；保留其伦理警戒中的开放性，避免加入特定传统的解释。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“我的孩子”体现师长对受教者的亲切称呼；重复“也要远避”使中文节奏清楚，并保留原文两个并列介词短语的强调。
