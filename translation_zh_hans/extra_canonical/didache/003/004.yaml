id: DID.3.4
reference: Didache 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου οἰωνοσκόπος· ἐπειδὴ ὁδηγεῖ εἰς τὴν εἰδωλολατρείαν· μηδὲ ἐπαοιδὸς μηδὲ μαθηματικὸς μηδὲ περικαθαίρων, μηδὲ θέλε αὐτὰ βλέπειν· ἐκ γὰρ τούτων ἁπάντων εἰδωλολατρεία γεννᾶται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/004.yaml
  text: My child[a], do not become an observer of omens, because it leads to idolatry; nor an enchanter, nor an astrologer, nor one who performs purifications, nor even be willing to look at these things; for from all these idolatry is born.
translation:
  language: zh_hans
  text: 我的孩子，不要成为观兆者，因为这会引向偶像崇拜；也不要成为念咒的人、占星的人或行洁净术的人，也不要想去看这些事[a]；因为偶像崇拜从这一切产生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“这些事”为中性复数，指上述各类做法或事物，并非指从事这些行为的人。
    reason: 说明 αὐτὰ 的指代，保留原文与英文审校记录所关注的“事物／做法”而非“人”的区别。
lexical_decisions:
- source_word: οἰωνοσκόπος
  choice: 观兆的人
  rationale: 指观察征兆、鸟兆等以占卜吉凶者；“观兆”既贴近词义，也比泛称“算命”更准确。
- source_word: ἐπαοιδός
  choice: 念咒的人
  rationale: 指以咒语施术者；采用现代读者易懂且不过度限定具体法术的表达。
- source_word: μαθηματικός
  choice: 占星的人
  rationale: 在此古代语境中并非现代意义的“数学家”，而是依据星象推算吉凶的人。
- source_word: περικαθαίρων
  choice: 行洁净术的人
  rationale: 指施行仪式性、法术性除秽净化者；加“术”以区别一般清洁或礼仪洁净。
- source_word: βλέπειν
  choice: 观看
  rationale: 保留“看、观看”的基本语义，不擅自解释为参与或求问。
- source_word: γεννᾶται
  choice: 产生
  rationale: 原义为“生出、产生”；中文以“产生”自然表达其因果意象。
theological_decisions:
- issue: ὁδηγεῖ 的主语与因果关系
  choice: 因为这会引向偶像崇拜
  alternative: 因为它引向偶像崇拜
  rationale: 希腊文省略主语，最自然地承接观兆这一行为；用“这”保留指代范围，不将其扩大为所有后列行为。
- issue: αὐτὰ 的指代
  choice: 这些事
  alternative: 他们
  rationale: αὐτὰ 是中性复数，指前述占卜、念咒、占星及洁净术等事物或做法，而不是阳性的人。
- issue: 偶像崇拜的生成表述
  choice: 偶像崇拜正是从这一切产生的
  alternative: 这一切都会导致偶像崇拜
  rationale: 保留 γεννᾶται“产生、生出”的被动/中间形式和原文较强的生成意象，避免把句法完全改写成普通因果句。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“我的孩子”保留师长式称呼；各项禁令使用平行结构。“行洁净术”用于呈现古代驱邪除秽性质，避免误解为日常清洁或一般宗教洁净。
