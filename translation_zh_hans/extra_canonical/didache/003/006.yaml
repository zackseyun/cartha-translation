  text: Τέκνον μου, μὴ γίνου γόγγυσος· ἐπειδὴ ὁδηγεῖ εἰς τὴν βλασφημίαν· μηδὲ αὐθάδης μηδὲ πονηρόφρων· ἐκ γὰρ τούτων ἁπάντων βλασφημίαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/006.yaml
  text: My child, do not become a grumbler, since it leads to blasphemy; nor self-willed, nor evil-minded, for from all these blasphemies are born.
translation:
  language: zh_hans
  text: 我的孩子，不要成为爱抱怨的人，因为这会引向亵渎；也不要任性自负，也不要心怀恶念，因为种种亵渎都由这一切而生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: 我的孩子
  rationale: 保留教导者亲切而郑重的称呼，符合本书劝诫语体。
- source_word: γόγγυσος
  choice: 抱怨的人
  rationale: 指惯于发怨言、低声不满的人；译作“抱怨的人”自然易懂，并由下句以“抱怨”承接其行为。
- source_word: βλασφημία / βλασφημίαι
  choice: 亵渎／种种亵渎
  rationale: 该词可指亵渎上帝、毁谤或侮辱性言语；“亵渎”保留其宗教与言语层面的张力，复数用“种种”体现。
- source_word: αὐθάδης
  choice: 任性自负
  rationale: 兼顾该词“固执任性、不顾他人”以及“傲慢自负”的语义范围，避免仅取其一。
- source_word: πονηρόφρων
  choice: 心怀恶念
  rationale: 由“邪恶”与“心思”构成，表示思想或意向邪恶；此译简洁且符合现代汉语。
- source_word: γεννῶνται
  choice: 生出
  rationale: 保留原文“出生、产生”的形象表达，而不弱化为一般性的“导致”。
theological_decisions:
- issue: βλασφημία的对象是否明确为上帝
  choice: 译作“亵渎”，不补出对象
  alternative: “亵渎上帝”或“毁谤”
  rationale: 希腊文本没有明说亵渎的对象；不补“上帝”，以保留原文可能涵盖亵渎性言语与毁谤的开放性。
- issue: 前句单数与后句复数的关系
  choice: 前译“亵渎”，后译“种种亵渎”
  alternative: 两处均译为“亵渎”
  rationale: 保留βλασφημία与βλασφημίαι的数之差异，同时使中文表达自然。
translation_notes:
  register: 采用现代、庄重而平易的劝诫语体。“我的孩子”保留师长式亲切称呼；分号与重复的“不要”呈现原文逐项警戒的节奏。
