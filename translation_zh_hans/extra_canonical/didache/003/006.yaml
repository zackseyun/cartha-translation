  - severity: low
    issue: 末句“这一切都会生出种种亵渎”语义重心及中文搭配可改善。
    rationale: ἐκ γὰρ τούτων ἁπάντων βλασφημίαι γεννῶνται以“种种亵渎”为主语、以“从这一切中”为来源；修订后更贴合原文，且不暗示各项必定各自独立地产生亵渎。
