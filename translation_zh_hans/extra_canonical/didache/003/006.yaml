  rationale: 作两处轻微修订：删除“把人”以避免补足原文未明说的对象；重组末句，使“种种亵渎”作为“而生”的主语，并保留原文从单数“亵渎”到复数“种种亵渎”的变化。其余关键术语和教诲语体维持不变。
