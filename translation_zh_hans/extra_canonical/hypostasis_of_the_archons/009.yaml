base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/009.yaml
  text: 'The angel said, “I am Eleleth, the great angel Wisdom, who stands before the holy Spirit. I have been sent to speak with you and to save you from the hand of the lawless ones. I will also instruct you about your root.”


    As for that angel, I am unable to describe his power. His appearance is like fine gold, and his clothing is like snow. My mouth is truly unable to describe his power or the appearance of his face.


    The great angel Eleleth spoke to me and said, “I am Wisdom, one of the Four Lights who stand before the great unseen Spirit. Do you (really) think that these archons can exercise (any) power over you? Not one of them will be able to conquer the root of the truth, because he has appeared in the last days on account of the root of the truth, and these authorities will be confined. Moreover, these authorities will be unable to defile you and that generation, because your dwelling is in indestructibility, where the virgin Spirit dwells, who is superior over the authorities of chaos and over their world.”'
translation:
  language: zh_hans
  text: '天使说：“我就是厄勒勒特，是那位大天使‘智慧’，站在圣灵面前。我奉差遣来与你说话，救你脱离那些不法之人的手，并要把有关你的根源[a]的事教导你。”


    至于那位天使，我无法言说他的能力。他的形貌如同精金，衣裳如同白雪。我的口实在无法述说他的能力和他面容的形貌。


    大天使厄勒勒特对我说：“我就是‘智慧’，是站在伟大、不可见之灵面前的四光者[b]之一。你真以为这些统治者[c]能对你施展什么权势吗？他们没有一个能胜过真理的根[d]，因为他[e]已在末后的日子为了真理的根显现；这些掌权者也必被禁锢。不但如此，这些掌权者不能玷污你和那一族[f]，因为你的居所在不朽坏之境；童贞之灵住在那里，超越混沌的掌权者和他们的世界。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “根源”直译为“根”；这里可能指人的属灵来源、所属族类或真实本质，原文没有进一步说明。
    reason: 保留象征语汇的多义性。
  - marker: b
    text: “四光者”是本书宇宙论中的专门称谓；也可直译为“四道光”。
    reason: 帮助普通读者理解人格化称谓，同时不展开体系化解释。
  - marker: c
    text: “统治者”对应通常译作“执政者”或音译为“阿尔孔”的称谓，指支配这个世界的超自然权势。
    reason: 说明古代宗教语境，避免被误解为一般人间官员。
  - marker: d
    text: “真理的根”可能指源于真理的族类、其属灵根源，或某个与真理相关的实体；语义并不确定。
    reason: 原文意象高度浓缩，不宜单一定义。
  - marker: e
    text: “他”所指不明确；也可能与“真理的根”有关。部分理解会把它指向一位在末后显现者，但此处没有明说其身份。
    reason: 显式保存代词先行词的真实歧义。
  - marker: f
    text: “那一族”也可译作“那个世代”或“那一代人”。
    reason: 见证文本 generation 可表达族类或世代，语境不能完全排除其中任何一种。
lexical_decisions:
- source_word: Eleleth
  choice: 厄勒勒特
  rationale: 按名称 Eleleth 音译，保留古代专名的异域特征，不擅自赋予词义。
- source_word: Wisdom
  choice: ‘智慧’
  rationale: 译出其意义，并用引号表明此处像是天使的称号或身份名称；不预断它与其他文献中‘智慧’形象的关系。
- source_word: root
  choice: 根源／根
  rationale: 首次出现译作较自然的“根源”，后文固定短语“真理的根”保留“根”的意象，以维持原文象征性和可能的群体、起源或本质含义。
- source_word: Four Lights
  choice: 四光者
  rationale: 保留专门称谓及其人格化色彩；“光者”比单纯“四道光”更符合其作为站立者的语境。
- source_word: archons / authorities
  choice: 统治者／掌权者
  rationale: 依见证文本的词项变化分别翻译，既呈现其统治权含义，也避免用现代政治术语或直接音译造成不必要隔阂。
- source_word: indestructibility
  choice: 不朽坏之境
  rationale: 将抽象名词处理为居所领域，符合“居所”“住在那里”的空间语境，同时保留不受毁坏的神学意涵。
- source_word: virgin Spirit
  choice: 童贞之灵
  rationale: 直译其称号，保留“童贞”的象征张力，不解释为性别、贞洁教义或特定神格。
theological_decisions:
- issue: “he has appeared”中男性代词的所指
  choice: 正文保留“他”，并加注说明所指不明确
  alternative: 直接译为“真理的根已经显现”或指定为某位救赎者
  rationale: 所给英文见证保留男性代词，却没有清楚先行词；不应在译文中替读者解决这一神学和句法歧义。
- issue: “that generation”的身份
  choice: 译作“那一族”，并以脚注保留可译范围
  alternative: 译作“那个世代”或“那一代人”
  rationale: 此处可能指与受话者相关的属灵族类，也可能指世代；“族”较能承接群体身份，但脚注保留另一可能。
- issue: “Wisdom”是普通属性还是专名／位格称号
  choice: 译为带引号的“智慧”
  alternative: 译作“有智慧的大天使”
  rationale: 原句以“我就是智慧”自我认定，宜保留其名号或位格性质，不弱化为一般品质。
- issue: 统治者对受话者是否完全无权
  choice: 保留反问和“什么权势”的强调
  alternative: 平直译为“这些统治者不能管辖你”
  rationale: 原文带有 (really) 与 (any) 所标示的强调色彩；反问更忠实传达挑战和安慰的语气。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。专名“Eleleth”音译为“厄勒勒特”；宇宙论术语尽量译义，并用脚注交代其他可能。因科普特原文复核尚未完成，本稿以所供公共领域英文见证为临时底本，避免补入该见证未明说的体系或教派解释。
