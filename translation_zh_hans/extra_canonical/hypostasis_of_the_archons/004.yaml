    rationale: 见证作“side”，虽与《创世记》肋骨叙事互文，却没有明确说“rib”。译为“身体的一侧”可保留字面与叙事歧义。
  - severity: medium
    issue: “the one who has given birth”译为“那位生产者”。
    rationale: “生产者”在现代汉语中通常指生产活动的主体，语域和语义均不适合生育称谓。应译作“生下孩子的那一位”。
  - severity: low
    issue: 将“shape/form”译为“形体”。
    rationale: “形体”较易引向实体肉身；见证仅称其为所塑造的“shape/form”。“形状”较少预断其本体性质。
