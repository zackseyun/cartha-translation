    text: “如同一个活生生的女人”在当前见证中的修饰关系含混：可能涉及被打开的肋旁、从其中显现的女性，或动作的比拟。译文未加解释。
    reason: 保存原句真实的语法和意象歧义。
  - marker: d
    text: “属魂”用来保留本作对“属灵”“属魂”与“属物质”状态的区分，并非普通意义上的“有灵魂”。
    reason: 防止关键人类学术语被自然化而失去对照。
  - marker: e
    text: 原句由对女性说“你”突然转为谈论“她”。这可能反映引语层次或文本传承问题，译文照样保留。
    reason: 避免擅自统一代词并确定女性身份。
  - marker: f
    text: “她声音的印记”是见证中的晦涩意象，也可能涉及声音、形象与其表征之间的关系；此处不作释义性改写。
    reason: 保留象征语言的开放性。
  - marker: g
    text: “按照自身形象塑造的形体”究竟指朦胧仿像、他们所造的肉身形体，还是二者之间的反讽对应，当前见证未能完全确定。
    reason: 标示结尾因果链和指称对象的多义性。
lexical_decisions:
- source_word: archons
  choice: 执政者
  rationale: 该词在本作中指宇宙性的统治势力；“执政者”既保留治理含义，也避免直接套用某一宗派术语。
- source_word: garden
  choice: 园中／园子
  rationale: 采用现代自然表达，并保留与《创世记》叙事的明显呼应。
- source_word: knowledge of good and evil
  choice: 善恶知识
  rationale: 贴近原有名词结构，不擅自解释为道德辨别、全知或经验知识。
- source_word: deep sleep
  choice: 沉睡
  rationale: 保留《创世记》典故和文本随后将其解释为“无知”的关联。
- source_word: ignorance
  choice: 无知
  rationale: 保持本作认知论层面的技术含义，不弱化为普通的“不知道”。
- source_word: soulish
  choice: 属魂
  rationale: 保留灵、魂、物质之间的文本区分；“仅仅属魂”传达贬抑或受限状态，而不将其正规化为“有灵魂”。
- source_word: spiritual woman
  choice: 属灵的女人
  rationale: 与“属魂”“属物质”的层次对照清晰，同时保持为描述性称谓。
- source_word: female counterpart
  choice: 与他相对应的女性
  rationale: 保留对应、配对之意，不直接解释为妻子、分身或神圣配偶。
- source_word: signet of her voice
  choice: 她声音的印记
  rationale: 原短语意象晦涩；直译“印记”以保存歧义，不擅自改成形象、回声或权能。
- source_word: authorities
  choice: 众权势
  rationale: 原见证在后段改用“authorities”；译文保留词汇变化，同时让读者可辨其与执政者属于同一叙事群体。
theological_decisions:
- issue: 父的旨意与执政者无知之间的张力
  choice: 直陈执政者不明白自己的话，却按父的旨意说出
  alternative: 解释为父直接欺骗执政者，或解释为执政者有意执行父的计划
  rationale: 见证同时肯定他们无知和父旨意的作用，译文不消解其中的因果与主权张力。
- issue: 亚当吃果子的目的句
  choice: 译作“为要使亚当果真吃那果子”
  alternative: 弱化为“以便亚当可能会吃”
  rationale: 保留见证中强调性的“indeed”，体现禁令在本叙事中的反讽功能。
- issue: “属魂”人类学
  choice: 保留“仅仅属魂的人”
  alternative: 译为“成了有灵魂的人”或“成了血肉之人”
  rationale: 这些替代会抹去文本在属灵、属魂和物质之间的特有区分。
- issue: 女性的身份及代词转换
  choice: 保留“你……她……”的突变
  alternative: 统一为第二人称，或解释成亚当在谈论夏娃／灵性夏娃
  rationale: 原见证的指称不稳定可能源于文本层次、引语或传抄问题，故不替作者确定身份。
- issue: 性暴力叙述
  choice: 以直接而不渲染的语言翻译
  alternative: 委婉删减或强化描写
  rationale: 忠实呈现文本对众权势的控诉及其自招审判的逻辑，同时避免额外煽情。
- issue: 结尾审判的施事关系
  choice: 译作“借着……形体，使审判临到自己”
  alternative: 解释为女性主动审判他们，或父直接审判他们
  rationale: 见证强调他们藉自身所塑形体自招审判，却未清楚指明审判的最终施行者。
