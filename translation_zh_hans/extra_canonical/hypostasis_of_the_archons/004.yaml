  terminology: “执政者”“众权势”“属灵”“属魂”“属物质”“善恶知识”均可保留。“side”改译“身体的一侧”，不预断其是否为肋骨或肋旁；“signet”继续用“印记”，以维持该晦涩短语的开放性。
  issues:
  - severity: medium
    issue: 将“all the trees”译为“所有树上的果子”，并在后段加入“那果子”。
    rationale: 英文见证只说可吃园中所有树、并说亚当会“eat”；虽可由语境推知吃的是果实，译文不应把未明说的对象两次显性补足。
  - severity: medium
