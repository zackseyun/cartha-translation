  text: '[] Concerning the substance of the authorities (from which they were made). [2] By the spirit of the Father of truth, the great apostle mentioned the authorities of darkness, and informed us that “our battle is not against flesh and [blood], but against the cosmic authorities and the spirits of evil.” I have sent you this writing because you inquired concerning the substance of the authorities (from which they were made).'
translation:
  language: zh_hans
  text: '论掌权者的本质（他们是由什么造成的）。[a]


    真理之父的灵感动那位伟大的使徒；他提到黑暗的掌权者，并告诉我们：“我们的争战不是对抗血肉之躯，而是对抗宇宙的掌权者和邪恶的诸灵。”[b]


    你既询问掌权者的本质（他们是由什么造成的），我便把这篇文字寄给你。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本文现据公共领域英文见证起草；科普特语原文复核尚待完成。标题中的括注“他们是由什么造成的”属于所据见证文本。
    reason: 透明说明当前底本限制，并保留标题中可能具有解释性质的括注。
  - marker: b
    text: 此处化用《以弗所书》6:12；措辞依本文献的见证形式翻译。英文见证中 blood 带方括号，表示文本残损或补复，故译文所表达的“血”属补复内容。
    reason: 交代引文来源及手稿补复信息；正文采用自然汉语，脚注保存文本批判层面的不确定性。
lexical_decisions:
- source_word: substance
  choice: 本质
  rationale: 见证文本以 substance 表达掌权者的构成或本性；“本质”可保留其形上意味，而括注“他们是由什么造成的”继续呈现原文的解释性张力。
- source_word: authorities
  choice: 掌权者
  rationale: 此处指具有统治权势的宇宙性存在，而非抽象的“权力”或人间当局；“掌权者”也与引文中的人格化敌对势力相称。
- source_word: cosmic authorities
  choice: 宇宙的掌权者
  rationale: 直译 cosmic 的宇宙范围，不将其预先解释为仅属今世、世界制度或某一特定天界阶层。
- source_word: spirits of evil
  choice: 邪恶的诸灵
  rationale: 保留复数及属格关系可能具有的歧义，既可理解为邪恶之灵，也不排除与邪恶相关的灵体。
- source_word: By the spirit of the Father of truth
  choice: 真理之父的灵感动
  rationale: 采用自然汉语表达其媒介或感动含义；不武断判定“灵”在此是否为独立位格、能力或启示媒介。
- source_word: flesh and blood
  choice: 血肉之躯
  rationale: 在现代汉语中自然表达有血有肉的人类，同时保持与非物质敌对势力的对照。
theological_decisions:
- issue: “掌权者”的身份
  choice: 保留为人格化的“掌权者”
  alternative: 译作抽象的“权势”或明确称为“邪灵统治者”
  rationale: 上下文将其与黑暗及邪恶诸灵联系起来，但见证文本并未在引言中完全界定其本体或阶层，故不添加更具体的教义分类。
- issue: “真理之父的灵”的语法与神学关系
  choice: 译为“真理之父的灵”，不加身份说明
  alternative: 明确译为“圣灵”或“来自真理之父的灵”
  rationale: 原有措辞的关系可有不同理解；避免将其等同于某一既定神学术语。
- issue: 保罗书信引文的措辞
  choice: 按本见证文本翻译，不强行统一于任何现行中文圣经版本
  alternative: 直接套用某一宗派或出版传统中的《以弗所书》6:12固定译文
  rationale: 此处是古代文献中的引述形式，应保存其自身措辞，尤其是“宇宙的掌权者”和“邪恶的诸灵”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。删除裸露的手稿页码“[2]”。不在正文中机械复制表示残损的方括号，而以脚注说明补复情况；所有脚注标记均已置于正文。标题及末句保留重复，以呈现原文的书信引言结构。
