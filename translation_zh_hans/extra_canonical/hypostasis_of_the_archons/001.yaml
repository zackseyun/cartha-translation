review_pass:
  verdict: revise
  source_fidelity: 草稿总体忠实于所给英文见证，并保留了标题与末句的重复。可是，英文见证的“By the spirit ... the great apostle mentioned”并不明说“灵感动”使徒；该译法加入了因果性的启示/感动关系。另，见证正文以方括号标示 blood 为补复，译文应在正文中保留这一文本状态，而不宜仅在脚注中说明。
  naturalness: 行文庄重、通顺。将“真理之父的灵感动那位伟大的使徒”改为“藉着真理之父的灵，那位伟大的使徒曾提到……”后，既更贴近见证句法，也更自然明确。
  terminology: “掌权者”适合保留 authorities 的人格性而不作教义性限定；“宇宙的掌权者”可保留 cosmic 的范围。“本质”在括注“他们由何而成”的限定下可接受。“肉身和[血]”以较直译的方式保存引文中 blood 的补复状态。
  issues:
  - severity: medium
    issue: “真理之父的灵感动那位伟大的使徒”加入了见证文本未明确表达的使役/感动关系。
    rationale: 英文见证仅以“By the spirit of the Father of truth”说明使徒提及这些掌权者的媒介或凭借；译为“藉着……”可保留该关系的开放性，避免预设特定神学解释。
  - severity: medium
    issue: 引文中 blood 的方括号未在正文保留。
    rationale: 所据英文见证以 [blood] 标示补复；脚注虽有说明，但正文取消方括号会丢失该处的直接文本批判信息。
