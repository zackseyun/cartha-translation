base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/011.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, witnessed that angel’s power, he repented and sentenced his father and Matter, his mother, whom he reviled, to judgment.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him up and appointed him over the seventh heaven, beneath the veil that divides the upper and lower realms. He is called “God of hosts, Sabaoth” because he is over the hosts of chaos, since Sophia appointed him.


    After these events had taken place, Sabaoth made for himself a massive, four-faced chariot of cherubim, an infinity of angels to serve him, and harps and lyres.


    Sophia brought her daughter Zoe and had her sit at his right hand to instruct him about the things of the eighth heaven. She placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called “life,” [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had taken place.


    When Yaldabaoth saw Sabaoth in such great majesty and so highly exalted, he became envious of him, and his envy became an androgynous entity. This was the origin of Envy, who gave birth to Death. Death gave birth to offspring and appointed each of them to rule over its own heaven. All the heavens of chaos were filled with their multitudes.


    All these events, however, took place by the will of the Father of the All, according to the pattern of everything above, so that the summation of chaos could be achieved.


    Behold, I have instructed you about the mold of the archons, the matter in which was made manifest, as well as their parent and their world. [8]'
translation:
  language: zh_hans
  text: '“雅达巴奥特的儿子萨巴奥特看见那位天使的能力，就悔改了，并宣判他的父亲和他的母亲‘物质’受审；他曾辱骂自己的母亲。


    “他向上方的索菲娅和她的女儿佐伊唱赞歌。索菲娅和佐伊把他提升上去，立他掌管第七重天，位于分隔上下诸界的帷幕之下。他被称为‘万军之神萨巴奥特’，因为索菲娅立了他，使他统管混沌的众军。


    “这些事发生以后，萨巴奥特为自己造了一辆巨大的四面基路伯战车，又造了无数天使服侍他，以及竖琴和里拉琴。


    “索菲娅带来她的女儿佐伊，让她坐在他的右边，把第八重天的事教导他。她又把忿怒天使安置在他的左边。


    “[从]那一天起，[他的右边]称为‘生命’，[…]而左边则象征独裁者上界的不义。[a]在你存在以前，这些事就已经发生了。


    “雅达巴奥特看见萨巴奥特如此威严，又被高举到这般地步，就嫉妒他；他的嫉妒化成了一个兼具两性的实体。嫉妒就是这样产生的。嫉妒生下死亡，死亡又生下众多后裔，并指派他们各自掌管一重天。于是，混沌的诸天都充满了他们的众多后裔。


    “然而，这一切都是照万有之父的旨意发生的，并且依照上方万物的范式发生，为要使混沌的总和得以完成。


    “看哪，我已经把执政者的形制、他们显现于其中的物质，以及他们的亲本和世界，都告诉你了。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此句的传本有残缺；方括号中的文字为补足或复原，“[…]”表示缺文。
    reason: 向读者交代文本损坏情况，并避免把复原文字当作无疑的原文。
lexical_decisions:
- source_word: Sabaoth
  choice: 萨巴奥特
  rationale: 按专名音译；在称号“万军之神”中保留其姓名形式，避免把专名与称号合并消解。
- source_word: Yaldabaoth
  choice: 雅达巴奥特
  rationale: 采用接近通行学术形式的现代汉语音译。
- source_word: Sophia / Zoe
  choice: 索菲娅／佐伊
  rationale: 保留拟人化专名；不直接译作“智慧／生命”，以免抹去叙事人物与抽象含义之间的张力。
- source_word: Matter
  choice: 物质
  rationale: 译出普通名词意义，并用引号显示其在此被人格化为母亲。
- source_word: God of hosts
  choice: 万军之神
  rationale: 使用自然而庄重的汉语称号，同时保留后文“混沌的众军”所解释的军旅／群体意象。
- source_word: hosts of chaos
  choice: 混沌的众军
  rationale: 保留hosts与神号之间的词义呼应，不泛化为“众生”或“势力”。
- source_word: autocrat
  choice: 独裁者
  rationale: 保留原称号中自居最高统治者的贬义色彩，不将其神学身份预先具体化。
- source_word: androgynous entity
  choice: 兼具两性的实体
  rationale: 明示同时具有两性这一概念，避免现代“中性”一词可能造成的弱化。
- source_word: summation of chaos
  choice: 混沌的总和
  rationale: 保留原表达的抽象和不寻常性质，不擅自解释为毁灭、圆满或救赎。
- source_word: mold of the archons
  choice: 执政者的模型
  rationale: “模型”可表达形制、范型或铸模的开放含义，避免过早限定为“本质”或“形象”。
- source_word: parent
  choice: 亲本
  rationale: 保留英文见证文本的单数及较宽泛的生源含义，不擅自指定为父亲或母亲。
theological_decisions:
- issue: 萨巴奥特的悔改与审判行为
  choice: 直译为他“悔改”并宣判父母受审
  alternative: 将其改写为归信至高神并定父母有罪
  rationale: 原文叙事只明确悔改和审判，不补入特定宗派的归信框架。
- issue: 上界、下界与第八重天的宇宙结构
  choice: 保留重天、帷幕及上下诸界的空间语言
  alternative: 解释为纯粹精神等级或心理状态
  rationale: 维持文本自身的神话宇宙论，不作去神话化处理。
- issue: 万有之父的旨意与混沌事件
  choice: 保留“一切”依其旨意发生的强表述
  alternative: 弱化为许可或预知
  rationale: 原文存在神意与混沌恶性事件并置的神学张力，不替文本消解。
- issue: “混沌的总和得以完成”
  choice: 以相对形式对应的抽象措辞保留歧义
  alternative: 译为“使混沌达到终结”或“使混沌圆满”
  rationale: 现有英语见证不足以确定这是总数齐备、过程完成还是终局实现。
translation_notes:
  register: 采用现代、庄重而可读的叙事汉语；保留诺斯替文献的专名、人格化抽象概念和层级宇宙意象。本文依据所提供的公版英语见证拟定，科普特语原文复核尚待完成。
