    Orea [3] then approached Noah, desirous to board the ark. When he refused her, she blew on the ark so that it was devoured by fire. So a second time he made an ark.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/007.yaml
  text: 'The rulers plotted together and said, “Come, let us cause a flood with our own hands and destroy all flesh, humans and animals.”


    When the ruler of the forces learned of their plot, he said to Noah, “Make yourself an ark from wood that does not rot, and hide in it—you, your children, the animals, and the birds of the sky, both small and large—placing it on Mount Sir.”


    Orea [3] then approached Noah, wanting to board the ark. When he refused her, she blew on the ark, and it was devoured by fire. So he made an ark a second time.'
translation:
  language: zh_hans
  text: '众执政者彼此谋划，说：“来吧，让我们亲手制造一场洪水，灭尽一切血肉之躯，无论人或走兽。”


    掌管众势力的执政者得知他们的计谋，就对挪亚说：“你要用不朽坏的木料为自己造一只方舟，藏身其中；你和你的儿女，以及走兽和天空的飞鸟，无论大小，都要进去。你要把方舟安置在西尔山上。”


    后来，奥瑞娅[3]来到挪亚那里，想要登上方舟。挪亚不肯让她上去，她便向方舟吹气，方舟就被火吞噬了。于是，挪亚又造了一只方舟。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '3'
    text: '[3] 此编号依所据英文公共领域见证保留，可能是手稿或编者的标记；其确切功能有待科普特文底本核查。'
    reason: 用户资料明确要求保留该括号编号，而当前尚未完成源语言审查
lexical_decisions:
- source_word: archons
  choice: 执政者
  rationale: 依所给见证译出其统治者、掌权者之义，并保留该文献中作为一类超自然权势的术语色彩；不直接解释为“天使”或“魔王”
- source_word: all flesh
  choice: 一切血肉之躯
  rationale: 保留古代洪水叙事的惯用表达及其涵盖人和动物的广度，随后以“无论人或走兽”明示范围
- source_word: archon of the forces
  choice: 掌管众势力的执政者
  rationale: 保留forces可能指众力量、权势或军势的开放性，同时使现代汉语关系清楚
- source_word: ark
  choice: 方舟
  rationale: 采用中文洪水叙事中通行且易懂的对应词
- source_word: wood that does not rot
  choice: 不朽坏的木料
  rationale: 贴近见证的字面意义，不擅自认定具体树种
- source_word: Mount Sir
  choice: 西尔山
  rationale: 按专名音译，不将其等同于其他已知山名
- source_word: blew on the ark
  choice: 向方舟吹气
  rationale: 保留动作本身的奇异性及叙事张力，不解释其机制
- source_word: devoured by fire
  choice: 被火吞噬了
  rationale: 保存原见证鲜明的拟人化意象，避免弱化为普通的“烧毁”
theological_decisions:
- issue: 洪水的发动者
  choice: 明确由众执政者共同谋划并亲手造成
  alternative: 模糊为无主语的天灾或归于至高神
  rationale: 所给见证将洪水归因于archons；应保留其与经典《创世记》叙事之间的神学张力
- issue: 警告挪亚者的身份
  choice: 译作“掌管众势力的执政者”
  alternative: 译作“众军之主”或直接认定为某一神祇
  rationale: 原见证仍称其为archon，且forces的具体所指未定，不作教派化身份认定
- issue: 奥瑞娅焚毁方舟的方式
  choice: 直译为吹气后方舟被火吞噬
  alternative: 解释为神迹、魔法或象征行为
  rationale: 文本仅陈述行动与结果，应保留其超自然性质而不补充解释
- issue: 挪亚拒绝奥瑞娅
  choice: 仅陈述“挪亚不肯让她上去”
  alternative: 补写拒绝原因或评价其对错
  rationale: 见证没有说明动机，译文不应填补叙事空白
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“执政者”作为关键术语统一使用；句式适度保留古代文献风格。译稿暂以所给公共领域英文见证为依据，尚待《拿戈玛第文库》II,4科普特文直接校核。主文已保留脚注标记[3]。
