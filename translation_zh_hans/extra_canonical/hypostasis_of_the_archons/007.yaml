    text: '[3] 此编号依所据英文公共领域见证保留，可能是手稿或编者的标记；其确切功能有待科普特文底本核查。'
    reason: 所供英文见证在“Orea”后保留[3]；在直接科普特文审查完成前，中文主文及脚注继续保留该标记。
  revision_rationale: 修订仅处理可安全确定的措辞与范围：以“不腐朽的木材”对应不会腐烂的木；以“兽类”避免将beasts/animals限缩为走兽；重组方舟命令，使挪亚、儿女、飞鸟和兽类共同藏身其中的关系在现代汉语中清楚。“安置在西尔山上”的宾语明确为方舟，符合所给英文见证，同时不认定西尔山为何处。
