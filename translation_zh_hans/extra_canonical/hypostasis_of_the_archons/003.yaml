base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/003.yaml
  text: 'The archons plotted and said, “Come, let us create a man to be soil of the earth.”


    They fashioned their creation as an entirely earthly being.


    The archons have bodies that are both female [and male], and their faces are the faces of beasts. They took [soil] from the earth and fashioned [their man] according to their own bodies and [according to the image] of God that had appeared [to them] on the water.


    They said, “[Come], let us seize the image through the form we have molded, [so that] the image may gaze upon its male counterpart [and become enamored with it], [] and so that we may grasp it in the form we have molded.” Because they were powerless, they did not understand the power of God.


    He blew into the man’s face, and the man received a soul, but he remained on the ground for several days. Because they were powerless, the archons could not make him rise. They kept blowing like stormy winds, trying to seize the image that had appeared to them on the waters, but they did not know its power.


    All these events happened by the will of the Father of the All.


    Afterward, the Spirit looked upon the soulish man on the ground. The Spirit came forth from the Adamic Land. It descended and made its dwelling within him, and that man became a living soul. The Spirit called his name Adam because he was found moving on the ground.


    A voice from indestructibility came forth to help Adam. The archons gathered all the animals of the earth and all the birds of the sky and brought them before Adam to learn what Adam might call them, so that he could give names to all the birds and all the animals.'
translation:
  language: zh_hans
  text: '执政者[a]谋划说：“来吧，让我们造一个人，使他成为地上的泥土。”


    他们把自己所造的塑造成一个完全属地的存在。


    执政者的身体兼具雌性[和雄性]，面孔却是野兽的面孔。他们从地上取来[泥土]，照着自己的身体，又[照着]那曾在水面上向[他们]显现的上帝之[形象]，塑造了[他们的人]。


    他们说：“[来吧]，让我们借着所塑造的形体抓住那形象，[好让]那形象注视与它对应的雄性形体，[并迷恋上它]，[]也好让我们能在所塑造的形体中将它抓住。”他们没有能力，并不明白上帝的能力。


    他[b]朝那人的脸吹气，那人便有了魂，却仍在地上躺了好几天。执政者没有能力，不能使他站起来。他们不断吹气，犹如狂风，企图抓住那曾在水面上向他们显现的形象，却不知道它的能力。


    这一切事都是照万有之父的旨意发生的。


    此后，灵注视着地上那个属魂的人[c]。灵从亚当之地[d]出来，降下，住进他里面；那人就成了一个活的魂。灵给他起名叫亚当，因为当时发现他正在地上活动。


    有声音从不朽坏之境传出，要帮助亚当。执政者把地上所有的走兽和空中所有的飞鸟聚集起来，带到亚当面前，要看看亚当会怎样称呼它们，好让他给所有飞鸟和走兽命名。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “执政者”译自通常称作 archons 的词，意为掌权者或统治者；这里指本文叙事中的宇宙统治势力。
    reason: 该术语对普通读者并不透明，需要简要说明而不作宗派化定性。
  - marker: b
    text: “他”在现存见证中的所指不明确；上下文先以复数谈到执政者。
    reason: 保存单复数突变造成的原有歧义。
  - marker: c
    text: “属魂的人”直译所给见证的 soulish man，与后文“灵”有意区别。
    reason: 避免读者把“魂”和“灵”误认为此处完全同义。
  - marker: d
    text: “亚当之地”是原见证中的特殊称谓，可能呼应“亚当”与土地、泥土的关联。
    reason: 提示文字关联，同时不把尚待科普特文复核的词源关系说成定论。
lexical_decisions:
- source_word: archons
  choice: 执政者
  rationale: 沿用中文宗教与诺斯替文献中较通行的对应词，既保留其统治者之义，也避免将其预先解释为某一特定种类的灵体。
- source_word: entirely earthly being
  choice: 一个完全属地的存在
  rationale: 保留其与后文“属魂的人”和“灵”的层次对照，不把“earthly”弱化为仅指材料来源。
- source_word: soul / soulish
  choice: 魂／属魂的
  rationale: 用同一词根呈现原见证中 soul 与 soulish 的关联，并保留“属魂”在此文本中的特殊人类学含义。
- source_word: Father of the All
  choice: 万有之父
  rationale: 保留称号的宇宙性范围及专名式庄重语气，不扩写其神学身份。
- source_word: indestructibility
  choice: 不朽坏之境
  rationale: 将抽象来源表达译成自然中文，同时以“之境”提示它在叙事中像一个超越领域；不具体认定为人物或地点。
- source_word: Adamic Land
  choice: 亚当之地
  rationale: 直译该特殊称谓，并借脚注提示它与亚当、土地之间可能存在的文字关联。
theological_decisions:
- issue: 吹气者“他”的身份
  choice: 保留单数代词“他”，不明说是谁
  alternative: 译为“一个执政者”或“首领”
  rationale: 所给见证在复数“他们”之后突然使用单数 He，指代不清；为保存真实歧义，不替文本确定行动者。
- issue: 灵、魂与属地身体的关系
  choice: 分别译作“灵”“魂”“属地”，并保留其先后进入或形成的叙述
  alternative: 将 soul 与 Spirit 均译作“生命”或“气息”
  rationale: 原见证有意区分这些层次；合并词语会消除文本自身的人类学张力。
- issue: 万有之父的旨意与执政者无能之间的关系
  choice: 照译两者，不作调和性解释
  alternative: 补明万有之父是许可、命令或预定这些事件
  rationale: 原文同时陈述执政者无知无能和一切按父旨意发生，但未说明二者如何相容。
- issue: 水面形象的性别及其对象
  choice: 译作“与它对应的雄性形体”
  alternative: 解释为形象自己的男性本体、配偶或原型
  rationale: “male counterpart”的关系具有解释空间，译文不锁定具体神话身份。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“塑造、属地、属魂、不朽坏”等词保留古代宗教论述的层次感，但句法尽量自然。方括号及空缺记号“[]”均原样保留，表示见证中的补足或残缺，而非中文译者新增内容。本稿依据所给公共领域英语见证起草；科普特文原文尚待直接复核，因此不对疑难处作超出见证的确定性重构。
