base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/006.yaml
  text: 'Next, Eve gave birth to their son Cain, and Cain cultivated the land. Then Adam knew his wife. She became pregnant again and gave birth to Abel, and Abel was a shepherd. Cain brought crops from his field, while Abel brought an offering from among his lambs. God looked favorably on Abel’s offering, but he did not accept Cain’s offerings.


    The fleshly Cain pursued his brother Abel.


    God said to Cain, “Where is your brother Abel?”


    Cain answered, “Am I my brother’s keeper?”


    God said to Cain, “Listen! The voice of your brother’s blood cries out to me. You have sinned with your mouth. It will return to you. Whoever kills Cain will unleash seven acts of revenge, and you will live moaning and trembling on the earth.”


    Adam once again [knew] his female counterpart Eve, and she became pregnant and bore [Seth] to Adam. She said, “I have given birth to [another] man through God, to replace [Abel].”


    Eve became pregnant again and gave birth to [Norea]. Eve said, “He has begotten a virgin for me to help many generations of humans.” [] She is the virgin whom the forces did not defile.


    And humanity began to multiply and progress.'
translation:
  language: zh_hans
  text: '随后，夏娃生下他们的儿子该隐；该隐耕种土地。后来，亚当与妻子同房。她再次怀孕，生下亚伯；亚伯成了牧羊人。该隐拿田里的出产来献上，亚伯则从羊羔中挑选祭物献上。上帝看中了亚伯的祭物，却不接纳该隐的祭物。


    属肉体的该隐追赶他的兄弟亚伯。


    上帝对该隐说：“你的兄弟亚伯在哪里？”


    该隐回答说：“难道我是看守我兄弟的吗？”


    上帝对该隐说：“听啊！你兄弟血的声音正向我呼喊。你用口犯了罪，这罪必归到你身上。谁若杀该隐，必引发七重报复；你要在地上呻吟战栗地生活。”


    亚当再次与他的女性伴侣夏娃[同房]；她怀孕了，为亚当生下[塞特]。她说：“我借着上帝生下了[另一个]人，来代替[亚伯]。”


    夏娃又怀孕，生下[诺瑞娅][a]。夏娃说：“他为我生了一位童女，使她帮助人类的许多世代。”她就是那位未被众势力玷污的童女。[b]


    于是，人类开始增多，并不断进步。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诺瑞娅”是按所供英语见证音译的人名；原稿此处为复原文字。
    reason: 说明陌生专名及方括号所反映的文本状况。
  - marker: b
    text: 所供见证在前一句之后另有一组空方括号，似乎表示原稿有无法复原的缺文；译文未补入臆测内容。
    reason: 记录见证所示但无法在正文中实质翻译的残缺信号。
lexical_decisions:
- source_word: knew
  choice: 与妻子同房／[同房]
  rationale: 此处“认识”是性关系的委婉语；用现代汉语“同房”清楚传意。后一次原见证以方括号标示补足，译文相应保留。
- source_word: fleshly
  choice: 属肉体的
  rationale: 保留该词可能具有的身体性与神学色彩，不简化为“凶恶的”或“世俗的”。
- source_word: keeper
  choice: 看守……的吗
  rationale: 贴近“守护者、看管者”的反问含义，同时符合现代汉语表达。
- source_word: forces
  choice: 众势力
  rationale: 保留文献中超自然统治力量的宽泛指称，避免擅自具体化为“魔鬼”“执政者”或其他体系化术语。
- source_word: progress
  choice: 不断进步
  rationale: 依所供英语见证保留“发展、前进”的正向动态含义，而不改写为单纯“遍满大地”。
- source_word: female counterpart
  choice: 女性伴侣
  rationale: 表达与亚当相对应的女性配偶身份，避免生硬直译为“女性对应者”。
theological_decisions:
- issue: “God”在这部文献中的身份
  choice: 译作“上帝”而不加解释性限定
  alternative: 译作“神”或按诺斯替体系指明某位统治者
  rationale: 本段所供见证仅写“God”；译文不预先裁定说话者在全文宇宙论中的确切身份。
- issue: 该隐“用口犯罪”与“归到你身上”的关系
  choice: 按见证保留两个短句
  alternative: 解释为该隐因撒谎而受报应，或改写成土地受咒诅
  rationale: 措辞及逻辑关系存在文本与解释上的张力，应避免依据《创世记》平行经文替换或补足。
- issue: “七重报复”的施事与结果
  choice: 译作“必引发七重报复”
  alternative: 译作“必遭七倍报复”
  rationale: 原见证的表达更接近“释放／引发”报复；不明确指定由谁实施，以保留歧义。
- issue: 诺瑞娅的童贞与使命
  choice: 保留“帮助人类的许多世代”及“未被众势力玷污”
  alternative: 将其解释为特定救赎角色或性侵事件
  rationale: 忠实呈现文献陈述，不导入宗派化或超出本段的叙事解释。
- issue: 残缺及编者复原
  choice: 正文保留方括号
  alternative: 无标记地纳入流畅正文
  rationale: 所供见证明示这些词属于残缺处的复原，出版译文应让读者看见其不确定性。
