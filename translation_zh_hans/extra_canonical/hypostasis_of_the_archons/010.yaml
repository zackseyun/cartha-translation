translation:
  language: zh_hans
  text: '我说：“我的主啊，请教导我这些执政者的[权势]。他们是[怎样]产生的？出于何种本质、何种[]质料？又是谁造了他们和他们的力量？”[a]


    那位具有智慧的大天使厄勒勒特对我说：“不朽者居住在无穷的永世之中。那称为皮斯提斯的索菲亚想要离开她的伴侣，独自创造一样东西；她所产生的源自上方。


    “上界与下方的永世之间有一道帷幕。帷幕下出现了一个影子；影子成了质料，又落到一个隔离之处。


    “她所产生的渐渐成为有形之物，仿佛流产的胎儿；它的形体由影子塑成，成了一头骄傲、形似狮子的野兽。正如我先前所说，它兼具两性，因为它源自质料。


    “它睁开眼睛，看见浩瀚无边的质料，便骄傲起来，说：‘我是神；除我以外，什么也不存在。’


    “它这样说，就得罪了万有。于是有声音从至高统治之处的上方发出，[b]说：‘你错了，萨麦尔。’这个名字的意思是‘盲目的神’。


    “它说：‘若在我以前还有别的存在，就显给我看。’


    “索菲亚立刻伸出手指，把光注入质料，并循着那光向下直至混沌之地。随后她返回上方自己的光中，黑暗便再次[落在]质料之上。


    “这位兼具两性的执政者为自己造了一个广大的领域，一片无边的空间。


    “[]它想到要为自己创造后裔，就为自己造了七个后裔；他们像自己的亲本一样，也兼具两性。


    “它对自己的后裔说：‘我是万有的神。’


    “皮斯提斯·索菲亚的女儿佐伊向它喊道：‘你错了，萨克拉！’它的另一个名字是雅达巴沃特。佐伊向它脸上吹气；她的气息为她化成一位火焰天使。那天使捆绑了雅达巴沃特，把它投入深渊之下的塔耳塔罗斯。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处原稿有缺损；方括号中的字词是据上下文补出的，“[]”表示缺失而无法复原的文字。所据见证中的手稿页码未收入正文。
    reason: 说明补字及残缺标记，同时交代裸页码的处理。
  - marker: b
    text: “至高统治之处”也可理解为“最高权柄的领域”；原句所指的宇宙层级并不完全明确。
    reason: 保留 place of supreme rule 的空间性与权柄性双重可能。
lexical_decisions:
- source_word: authorities / archon
  choice: 执政者
  rationale: 以“执政者”表达具有统治权的宇宙性权势，并使后文单数“这位执政者”保持术语一致。
- source_word: aeons
  choice: 永世
  rationale: 保留该诺斯替文献中既可指时代、又可指超越性领域或实体的张力，避免直接套用教派化音译。
- source_word: Indestructibility
  choice: 不朽者
  rationale: 原见证可理解为抽象的“不灭性”，也可能人格化；此处按居住这一谓语采用人格化译法，同时不指定其身份。
- source_word: Sophia / Pistis / Zoe
  choice: 索菲亚／皮斯提斯／佐伊
  rationale: 作为专名音译，保留文本中的人物区分，不擅自以“智慧／信／生命”完全替代；索菲亚首次出现处借上下文说明智慧。
- source_word: matter
  choice: 质料
  rationale: 区别于日常“物质”，保留古代宇宙论中作为成形基质的哲学意味。
- source_word: androgynous
  choice: 兼具两性
  rationale: 采用现代、清楚且不带贬义的表述，避免把古代宇宙论概念误译为具体的现代性别身份。
- source_word: the All
  choice: 万有
  rationale: 保留其既可指一切存在、也可带有整体性神圣领域意味的开放性。
- source_word: Tartaros
  choice: 塔耳塔罗斯
  rationale: 按古希腊宇宙论专名音译，避免直接等同于后世一般意义的“地狱”。
theological_decisions:
- issue: 创造者自称为神的叙事张力
  choice: 直译“我是神；除我以外，什么也不存在”及“我是万有的神”
  alternative: 改写成带解释性的“它妄称自己为神”
  rationale: 叙述者随后已以“骄傲”“得罪万有”和斥责表达评价，不在引语内额外加入神学判断。
- issue: 不朽者是否为人格实体
  choice: 译作“不朽者”，保留人格化可能
  alternative: 译作抽象名词“不灭性”
  rationale: “居住”支持人格化理解，但源文复核尚待进行，因此不进一步确定其本体身份。
- issue: 索菲亚独自创造的性质
  choice: 译作“离开她的伴侣，独自创造”
  alternative: 译作“违背伴侣私自创造”
  rationale: 原见证仅说明独立于伴侣，并未明确加入违背或叛逆的道德定性。
- issue: 火焰天使与佐伊气息的关系
  choice: “她的气息为她化成一位火焰天使”
  alternative: “她的气息就是她的火焰天使”
  rationale: 保留气息发生转化以及天使归属于她的句法关系，不把二者本体关系绝对化。
translation_notes:
  register: 采用现代标准普通话的庄重叙事体。专名依常见学术音译处理，核心宇宙论术语尽量一致。因科普特语原文复核尚待进行，本稿明确以所供公共领域英语见证为暂定依据；保留所有修复括号和残缺符号。代词用“它”指兼具两性的兽形执政者，以避免强行指定单一性别。
