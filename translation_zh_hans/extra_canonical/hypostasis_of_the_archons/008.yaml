review_pass:
  verdict: revise
  source_fidelity: 需修订。译文总体忠实于所给英语见证，但“女性配偶”把 female counterpart 收窄为婚配关系；“仗着自己的权势”和“逼迫她”分别增添倚势与强迫行为的具体含义。残缺标记也应在正文中逐一保留，尤其是引语前的空方括号及“[. . .]”。
  naturalness: 叙事体总体通顺庄重。“提供性服事”不合现代汉语常用搭配，改为“向我们提供性服务”更自然；“从她那里退去了”也比“已经离开她了”更贴近 withdrawn 的动作意味。
  terminology: “执政者”“万有之上帝”“圣灵”可保留。“女性对应者”比“女性配偶”更能保留该宇宙论术语的开放性，避免断定其为配偶。
  issues:
  - severity: medium
    issue: “女性配偶”过度限定 female counterpart。
    rationale: counterpart 表示相对应的女性存在，并不必然表示配偶；译作“女性对应者”可保留见证的含混性。
  - severity: medium
    issue: “仗着自己的权势”及“狂妄地逼迫她”添加了原见证未明说的内容。
    rationale: in his might 可直译为“在其权势中/凭着他的权势”，不必表达倚势；was presumptuous toward her 是冒犯、放肆，尚未直接断言“逼迫”。
  - severity: medium
    issue: 正文未完整保留两处残缺/编辑标记。
    rationale: 英语见证在“because”后有“[. . .]”，在祈祷引语前有“[]”；应分别以“[……]”和“[]”在正文呈现，而非仅以脚注标记代替。
  - severity: low
    issue: “提供性服事”搭配生硬。
    rationale: “向我们提供性服务”在现代标准汉语中更自然，且保留原文的性胁迫要求。
  revised_text: '众执政者前来见她，图谋欺骗她。他们的首领对她说：“你的母亲夏娃曾到我们这里来。”挪利亚却转向他们，说：“你们是黑暗的执政者；你们受诅咒吧！你们不认识我的母亲；反倒认识你们自己的女性对应者，因为我不是你们的后裔；我来自上方的世界。”


    那傲慢的执政者凭着他的权势转过身来，面容变得像燃烧的[烈火]。他对她放肆，[说]：“你必须像你母亲夏娃一样，向我们提供性服务，因为[……]已交给我了。”


    挪利亚却借着[上帝]的能力转过身来，向那圣者、万有之上帝高声呼喊：[]“求你救我脱离不义的执政者，立刻救我脱离他们的手！”


    一位天使从天而降，对她说：“你为什么呼求上帝？你为什么对圣灵如此放肆？”


    挪利亚问：“你是谁？”


