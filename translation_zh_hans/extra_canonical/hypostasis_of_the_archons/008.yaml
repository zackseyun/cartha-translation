    reason: 保留文本的神学与叙事张力，并提示来源限制。
lexical_decisions:
- source_word: archons
  choice: 执政者
  rationale: 保留该作品中具有宇宙论色彩的统治者称谓；不用“掌权者”或音译，以兼顾可懂度与术语一致性。
- source_word: female counterpart
  choice: 女性配偶
  rationale: 英语见证所表达的不只是一般女性，而是与这些执政者相对应的女性伴侣；“女性配偶”较自然，同时不额外界定其本体性质。
- source_word: world above
  choice: 上面的世界
  rationale: 保留原见证的空间性宇宙论表达，不解释为“天国”或其他特定神学概念。
- source_word: God of the All
  choice: 万有之上帝
  rationale: 将“All”理解为万有整体，保留其称号性质，并避免译成可能暗示不同句法关系的“全能上帝”。
- source_word: holy Spirit
  choice: 圣灵
  rationale: 采用现代汉语中最自然的对应词，但不借大小写进一步断定此处与后世三一论术语完全相同。
theological_decisions:
- issue: 挪利亚的来源与身份
  choice: “我不是你们的后裔；我来自上面的世界”
  alternative: 将其解释为属天灵魂或某一特定神性族类
  rationale: 按见证直译其对立关系，不把作品自身的宇宙论陈述系统化或教派化。
- issue: 执政者与夏娃的关系
  choice: 保留“认识”这一含混表达
  alternative: 明确译为“与……发生性关系”
  rationale: 上下文虽有性意味，但“认识”也可能兼具辨认、接触及性关系等层次，正文不宜消除张力。
- issue: 天使责问挪利亚对圣灵“放肆”
  choice: 保留看似反常的责问
  alternative: 改释为执政者放肆，或把天使的话理解成赞许
  rationale: 现有见证明确如此，尽管语义和叙事关系可能令人意外；在科普特文复核前不作校正。
- issue: 方括号中的“God”
  choice: 译作“[上帝]”并保留补字标记
  alternative: 无括号译作“上帝”
  rationale: 保留见证所标示的残缺或编辑补复状态。
translation_notes:
  register: 采用现代、庄重而可读的叙事体。“性服事”直陈胁迫性质而不使用过度委婉语。所有方括号、缺文和含混处均依所提供的公共领域英语见证处理；由于尚未直接复核《拿戈玛第文集》II,4的科普特文，本稿应视为基于见证的暂定译稿。
