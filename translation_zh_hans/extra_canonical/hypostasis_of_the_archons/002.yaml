    issue: “vented his power”译为“发泄出自己的能力”
    rationale: “发泄”通常搭配情绪或不满，且“能力”不宜被“发泄”。此处在见证的叙述逻辑中是他释放／发出那力量，即先前说出的亵渎言语。
