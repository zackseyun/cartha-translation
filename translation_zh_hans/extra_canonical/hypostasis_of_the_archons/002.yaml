  terminology: “万有”“不朽者”“掌权者”“属魂的”“永世”“深渊”及“皮斯蒂斯·索菲亚”的处理可保留；它们既维持该文献的术语密度，也没有加入特定宗派解释。“不朽者”虽保留抽象名词人格化的张力，但因英文见证明确以 she 指代，当前处理可接受。
  issues:
