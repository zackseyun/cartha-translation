translation:
  language: zh_hans
  text: '他们的首领是瞎眼的。他因自己的能力、无知和骄傲，便凭自己的[能力]宣告：“我是神；除我[以外]，再没有别的。”


    他说这话时，就得罪了[万有][a]。这番夸口上升到不朽者[b]那里；[此处原文残缺][c]，有声音从不朽者那里回应说：“萨麦尔，你错了。”萨麦尔的意思是“盲目的神”，因为他的思想是盲目的。他发泄出自己的能力，也就是他说出的那句亵渎之言，又随着它下到混沌之中，来到他的母亲深渊那里；这是皮斯蒂斯·索菲亚[d]所促成的。她按照他每一个后裔各自的能力，把他们一一安置妥当，使其仿照高天上永恒的诸永世[e]，因为可见之物源自不可见之物。


    不朽者俯视下面众水所在之处。她的形像如倒影一般显现在水面上，黑暗的掌权者便迷恋上她。然而，他们无法抓住那显现在水面上的形像，因为他们软弱无力。仅仅属魂的，无法抓住属灵的；因为那些掌权者源自下面，而不朽者的形像源自上面。


    因此，不朽者俯视下面那地方，好让她照着父的旨意，使他们全都与光联合。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万有”对应见证文本的 the All，可能是对整体实在的专门称呼。方括号表示见证文本所依据的原文有缺损或补足。
    reason: 提示术语性质并说明补文状态。
  - marker: b
    text: “不朽者”所对应的词也可译作“不朽性”或“不可毁坏者”；本段将其人格化，并以“她”指称。
    reason: 保留抽象性质与人格化实体之间的词义张力。
  - marker: c
    text: 此处见证文本标有空缺；缺失内容无法由现有材料确定。
    reason: 公开标示文本残缺，避免无依据补写。
  - marker: d
    text: “皮斯蒂斯·索菲亚”为音译；希腊语词义大致为“信”与“智慧”，但此处作为专名处理。
    reason: 帮助普通读者识别名称，同时不把词源解释强行写入正文。
  - marker: e
    text: “永世”对应 aeons；在此类文献中，该词既可带有永恒时代的意味，也可指高天的超宇宙实体。
    reason: 说明无法用单一现代汉语词完全重现的术语双重含义。
lexical_decisions:
- source_word: the All
  choice: 万有
  rationale: 保留诺斯替语境中作为整体实在或超越性总体的术语色彩，不将其窄化为“众人”或一般性的“一切事物”。
- source_word: indestructability / indestructibility
  choice: 不朽者
  rationale: 上下文将其人格化，以“她”指称并赋予观看、回应和行动；译作“不朽者”比抽象名词“不朽性”更符合叙事语法，同时不进一步断定其本体身份。
- source_word: authorities
  choice: 掌权者
  rationale: 既保留其权势含义，也符合早期宗教文献中对宇宙性统治力量的常见称呼。
- source_word: soul-ish
  choice: 属魂的
  rationale: 保留“魂”与“灵”的明确对照，不将其泛化为“天然的”或“心理的”。
- source_word: aeons
  choice: 永世
  rationale: 保留该词兼有永恒时代与超宇宙实体的术语张力；复数译为“诸永世”。
- source_word: Abyss
  choice: 深渊
  rationale: 使用自然而庄重的对应词，并以不加解释的专称形式保留其宇宙论角色。
- source_word: Pistis Sophia
  choice: 皮斯蒂斯·索菲亚
  rationale: 采用音译，避免直接译成“信心—智慧”而预先判定这是称号、属性组合还是专名。
theological_decisions:
- issue: 首领宣称自己是唯一的神
  choice: 按原文直接保留其宣称及随后受到的否定
  alternative: 将“神”改为“小神”“伪神”或在正文中加贬义限定
  rationale: 叙事本身借“不朽者”的回应评判这句话；译文不额外加入宗派性解释。
- issue: 不朽者的人格与性别表达
  choice: 译作“不朽者”，后文依见证文本用“她”
  alternative: 译作抽象名词“不朽性”，或改用无性别表达
  rationale: 保留见证文本中的人格化和阴性指代，同时不将其等同于某一已命名的神学位格。
- issue: 可见之物与不可见之物的关系
  choice: 译作“可见之物源自不可见之物”
  alternative: 解释为创造、复制、流溢或堕落
  rationale: 原句只陈述来源关系，未在此明确界定其机制，故保留神学张力。
- issue: 皮斯蒂斯·索菲亚所促成之事的句法范围
  choice: 将其紧接在下到混沌与深渊的叙述之后
  alternative: 明确说她只促成“亵渎之力的下沉”，或只促成首领的行动
  rationale: 英语见证的修饰范围存在歧义，因此中文避免补出更具体的受事。
- issue: 与光联合的对象和方式
  choice: 保留“使他们全都与光联合”
  alternative: 解释为拯救、归化、照亮或消灭黑暗
  rationale: 不替原文界定联合的具体救赎论含义。
