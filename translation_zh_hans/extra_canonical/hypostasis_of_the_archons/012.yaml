  text: 'I said, “My Lord, do I too come from their matter?”


    “You and your offspring come from the Father, who existed from the beginning.


    “The souls come from above, from indestructible light. Therefore, the authorities cannot approach them because the spirit of truth is within them. Everyone who knows this path of truth will be deathless among mortal humans.


    “However, that seed will not yet be known. It will become known after three ages, and then it will free them from bondage to the error of the authorities.”


    I asked, “My Lord, how much longer will it be before this happens?”


    He said to me, “Until the moment the True Man, in a moldable substance, reveals [the spirit of] truth that the Father has sent.


    [] “Then he will instruct them about all things, anointing them with the oil of eternal life bestowed on him by the kingless generation.


    “Then they will be freed from blind thought. They will tread on death, which comes from the authorities, and they will ascend to the infinite light where this seed dwells.


    “Then the authorities will give up their times. Their angels will weep because of their destruction, and their demons will grieve because of their death.


    “Then all the sons of light will truly know the truth, their root, the Father of the All, and the holy Spirit. They will all proclaim with one voice, ‘The truth of the Father is just. The Son reigns over the All.’ And everyone will proclaim, ‘Forever and ever, holy, holy, holy! Amen.’”


    The Substance of the Archons'
translation:
  language: zh_hans
  text: '我说：“我主啊，难道我也是从他们的物质而来的吗？”


    他说：“你和你的后裔都从那自起初就存在的父而来。


    “灵魂从上面、从不可毁灭的光而来。因此，掌权者无法接近他们，因为真理之灵在他们里面。凡认识这条真理之路的人，在必死的人类中将不死。


    “然而，那种子现在还不会被人认识。三个世代以后，它才会被人认识；到那时，它要把他们从掌权者之谬误的奴役中解放出来。”


    我问：“我主啊，还要多久，这事才会实现？”


    他对我说：“要等到父所差来的真理之灵，由处在可塑质料[a]中的真正之人显明出来的时候。[b]


    “[原文残缺][c]那时，他会把一切事教导他们，又用永生之油膏抹他们；这油是无王的族类赐给他的。


    “那时，他们将从盲目的思想中得到解放。他们要践踏那源自掌权者的死亡，并要升到无限的光中；那种子就居住在那里。


    “那时，掌权者将交出各自的时限。他们的天使要因他们的毁灭而哭泣，他们的邪灵要因他们的死亡而悲伤。


    “那时，所有光明之子都将真正认识真理，也认识自己的根源、万有之父和圣灵。他们要同声宣告：‘父的真理是公义的；子统治万有。’众人都要宣告：‘直到永永远远，圣哉！圣哉！圣哉！阿们。’”


    《掌权者的质体》[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可塑质料”所对应的是希腊语借词 plasma，指能够被塑造、成形的质料。
    reason: 说明关键技术词及其物质性语义。
  - marker: b
    text: “真理之灵”中的“之灵”为所据见证根据语境补足；残存文本也可能只读作“真理”。本句的句法关系亦不完全确定。
    reason: 公开标示见证中的编辑补足，并保留真实文本歧义。
  - marker: c
    text: 此处手稿有残缺，无法确定缺失了多少文字。
    reason: 保留原始见证所标出的抄本缺口。
  - marker: d
    text: 标题中的“质体”对应希腊语借词 hypostasis；在本文语境中，它似乎主要指掌权者由之形成的具体物质性构成，而非抽象的属灵本性。也有人可将此词译为“实体”或“本质”。
    reason: 标题术语具有多义性，需要说明本译选择及可行替代。
lexical_decisions:
- source_word: hyle / matter
  choice: 物质
  rationale: 保留文本关于来源与构成材料的具体含义，避免将其抽象化为单纯的“本性”或“存在”。
- source_word: authorities
  choice: 掌权者
  rationale: 既表达这些存在者所具有的权势，也保留其作为一类宇宙性统治力量的称谓功能。
- source_word: indestructible light
  choice: 不可毁灭的光
  rationale: 直译其否定性限定，不改写为较具教派色彩的“永恒神光”。
- source_word: True Man
  choice: 真正之人
  rationale: 保留其称号性质及“真实/真正”的语义，同时不擅自等同于其他宗教人物。
- source_word: plasma / moldable substance
  choice: 可塑质料
  rationale: 兼顾“能够被塑造”与“构成材料”两层意思，并与前文的物质来源主题相呼应。
- source_word: kingless generation
  choice: 无王的族类
  rationale: 保留原文反常而技术性的表达，不将其解释性改写为“至高族类”或“自由世代”。
- source_word: give up their times
  choice: 交出各自的时限
  rationale: 保留“时间/期限”及“放弃、交出”的张力，不将意义过度确定为统治终结。
- source_word: hypostasis / Substance
  choice: 质体
  rationale: 标题语境指向掌权者由之形成的具体物质性构成；“质体”比“本质”更少引向抽象本体论，同时保留术语感。
theological_decisions:
- issue: “那种子”与被解放者之间的关系
  choice: 保留“它要把他们……解放出来”
  alternative: 将“种子”解释为一个群体，并译作“他们要获得解放”
  rationale: 见证文本将“种子”作为单数施事者，而“他们”为受益者；译文不消除这种张力。
- issue: 真理与真理之灵的残缺读法
  choice: 正文采用“真理之灵”，并用脚注说明补足
  alternative: 仅译作“真理”
  rationale: 所据见证明确以方括号标出“the spirit of”为编者补足；正文采取连贯读法，同时公开其文本不确定性。
- issue: “父的真理是公义的”
  choice: 保留“公义的”这一述语
  alternative: 译为“父的真理是正确的”
  rationale: “just”可能涉及正义、公正或正确；此处采用庄重且具有伦理意味的“公义”，但不扩写其神学含义。
- issue: “子统治万有”中的“子”
  choice: 直接保留称号“子”
  alternative: 明确等同于基督或其他特定人物
  rationale: 本段本身未明确完成身份等同，译文不引入后来的教义识别。
- issue: 掌权者之天使与邪灵的毁灭/死亡
  choice: 保留代词“他们”
  alternative: 明确改写为掌权者、天使或邪灵各自的毁灭
  rationale: 原句的所属及所指可能存在歧义，译文维持其代词结构，不擅自消解。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。对“种子”“无王的族类”“真正之人”等文本自身的技术性表达不作教派化解释。由于科普特语原文复核尚未完成，本稿以所提供的公共领域英文见证为主要依据，并明确标示其中的补足与残缺。
