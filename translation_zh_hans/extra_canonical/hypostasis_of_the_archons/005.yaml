    [] The fleshly woman said, “He said not only, ‘Eat not,’ but even, ‘Touch it not, because on the day that you eat from it, you certainly will die.’”


    The serpent, the teacher, said, “Certainly you will not die, because he said this to you motivated by jealousy. On the contrary, your eyes will be opened, and you will become like gods, knowing what is good and evil.” And the female teaching nature was removed from the serpent, and she forsook it as though it were something earthly.


    The fleshly woman took of the tree and ate, and she gave to her husband also, and in this way they ate, these beings who were merely soulish. Their blemish was revealed by their lack of knowledge. They realized that they had been stripped of what was spiritual, and they took fig leaves and fastened them around their naked loins.


    Because he was unaware of what had transpired, the leader of the archons arrived and said, “Adam, where are you?”


    Adam said, “I heard your voice, and I became afraid, because I was naked, and so I hid.”


    The archon said, “Why did you hide, if not because you ate from the one tree from which I forbade you to eat? You ate from it!”


    Adam said, “The woman you gave me [handed] me the fruit, and I ate it.”


