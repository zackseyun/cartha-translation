translation:
  language: zh_hans
  text: '随后，女性的属灵本性化作那条蛇——那位教师——的模样而来。蛇教导亚当和夏娃，说：“萨麦尔对你们[a]说了什么？他说的可是：‘园中所有树上的果子，你们都可以吃；只是不可吃那棵[c]知善恶树上的果子’？”


    此处原文有缺文。[b]那属肉体的女人说：“他不但说‘不可吃’，甚至还说‘不可碰；因为你们吃的那一天，必定会死。’”


    那条蛇——那位教师——说：“你们必定不会死。他这样对你们说，是出于嫉妒。恰恰相反，你们的眼睛将会打开，你们会变得像众神一样，知道什么是善、什么是恶。”于是，那女性的教导本性离开了蛇，弃它而去，仿佛它只是属地之物。


    那属肉体的女人摘下树上的果子吃了，也给了她丈夫；就这样，他们吃了——这些只有魂性的人。他们缺少知识，因而显露出自身的缺陷。他们发觉自己已被剥去了属灵之物，便拿无花果树的叶子系在赤裸的腰间。


    众执政者的首领不知道发生了什么，便来到那里，说：“亚当，你在哪里？”


    亚当说：“我听见你的声音，就害怕了，因为我赤身裸体，所以躲了起来。”


    那执政者说：“你躲起来，岂不正是因为你吃了我禁止你吃的那一棵树上的果子吗？你果然吃了！”


    亚当说：“你给我的那个女人把[d]果子给了我，我就吃了。”


    那傲慢的执政者[e]便咒诅了女人。


    女人说：“蛇欺骗了我，所以我吃了。”


    众执政者转向[f]蛇，咒诅它的影像，使它[g]衰弱。


    他们却不知道，那正是他们自己塑造过的形像。从那时起，蛇便落在诸权势的咒诅之下，一直持续到……[h]完全之人来临。


    他们又转向属于他们的亚当，把他和妻子一同赶出园子。他们没有任何福分，因为他们自己也在咒诅之下。


    他们使人类陷入极大的混乱，过着劳作的生活，好叫属于他们的人类只顾世上的事务，无暇顾念神圣的灵。'
