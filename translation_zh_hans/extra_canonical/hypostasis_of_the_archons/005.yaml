review_pass:
  verdict: revise
  source_fidelity: 需修订。译稿总体忠实保留了叙事顺序、执政者（archons）、魂性／属灵的术语对照、复数“众神”，以及抄本缺文和补足的提示。不过，“in the guise of”不宜译成明确的“化作”，因为前后文仅明确该女性属灵本性以蛇的形貌显现，随后又离开蛇；另将 serpent 的“shadow”译为“影像”并与后句的“shape”混同，改变了见证文本的用词层次与指代关系。
  naturalness: 原译庄重通顺，但“女性的教导本性”“这些只有魂性的人”等略显生硬。保留必要的文献术语之余，可调整为“女性的教诲本性”“他们这些仅具魂性者”，使现代书面汉语更自然。
  terminology: “执政者”“属灵”“属肉体”“魂性”“完全之人”“神圣的灵”均可保留，且避免了不当教派化。“shadow”应一贯译为“影子”，而“shape”宜译为“形体／形貌”，不可同译为“影像”。
  issues:
  - severity: medium
    issue: “in the guise of the serpent”译为“化作……的模样而来”
    rationale: “化作”断言发生形体变化；见证文本只说该女性属灵本性“以蛇的形貌／ guise”来到，且随后离开蛇。应避免增加本体性或变形的断言。
  - severity: high
    issue: 将“cursed its shadow, [making it] grow weak”译为“咒诅它的影像，使它衰弱”
    rationale: 见证文本此处是“shadow”，后句才是“same shape they had modeled”。“影像”既误译 shadow，也预先将其与 shape 合并，模糊文本刻意保留的不同表达及代词指向。
  - severity: low
    issue: 缺文位置以“此处原文有缺文”取代空括号信号
    rationale: 虽有脚注说明，但正文直接保留“[]”更准确地对应所供见证的抄本损坏标记，并避免把编辑说明混入叙事正文。
  - severity: low
    issue: “摘下树上的果子”较原文具体
    rationale: 见证仅说“took of the tree and ate”，未明说“摘下”或“果子”。可译为“从那树上取了些来吃”，以免增加动作细节。
