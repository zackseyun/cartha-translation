lexical_decisions:
- source_word: archon(s)
  choice: 执政者
  rationale: 采用汉语诺斯替文献中清楚而不过度解释的对应语；既保留其掌权者含义，也避免直接等同于一般意义上的统治者或魔鬼。
- source_word: female spiritual nature
  choice: 女性的属灵本性
  rationale: 保留“女性”“属灵”与“本性”三个语义成分，不把这一形象直接认定为某个具名人物。
- source_word: female teaching nature
  choice: 女性的教导本性
  rationale: 保留见证文本不寻常的抽象表达，并与前文“女性的属灵本性”形成呼应，不擅自将其改写为“女教师”或智慧神祇。
- source_word: soul-ish / soulish
  choice: 只有魂性
  rationale: 呈现该文献中“灵、魂、肉体”的区分；“只有”传达 merely，同时避免以现代心理学意义的“心理性”取代古代人类论术语。
- source_word: Perfect Man
  choice: 完全之人
  rationale: 保留其可能具有称号性质的含义，同时不预先认定具体基督论身份。
- source_word: holy Spirit
  choice: 神圣的灵
  rationale: 原见证此处可作普通描述或专称理解；译为“神圣的灵”保留这种张力，避免自动套用后世固定专名“圣灵”。
- source_word: shape
  choice: 形像
  rationale: 此处指众执政者先前塑造的样式或形态；“形像”可保留与创造叙事的呼应，而不把它限缩为影子本身。
theological_decisions:
- issue: 蛇与女性属灵本性的关系
  choice: 区分蛇与暂时借其形貌而来的女性属灵／教导本性
  alternative: 把蛇直接称为女性属灵者或智慧
  rationale: 见证文本先说该本性以蛇的模样而来，后又说她离开并弃绝蛇，故不应把二者无条件等同。
- issue: 执政者首领的无知
  choice: 直译其“不知道发生了什么”
  alternative: 弱化为迟到后才询问情况
  rationale: 此处无知是叙事的神学张力之一，应保留，不能按《创世记》的传统神学预设加以调和。
- issue: “像众神一样”中的复数
  choice: 译作“像众神一样”
  alternative: 译作“像上帝一样”
  rationale: 供应见证明确采用复数 gods；保留复数可避免消除文本自身的宇宙论特征。
- issue: “属于他们的亚当／人类”
  choice: 保留所属表达
  alternative: 自然化为“亚当／人类”
  rationale: “their Adam / their mankind”暗示执政者对受造人类的主张或归属关系，是本文的重要神学措辞。
- issue: 蛇受咒诅的对象
  choice: 译为蛇的“影像”受咒诅，并使其衰弱
  alternative: 直接说蛇本身受咒诅
  rationale: 见证区分蛇、借蛇显现的教导本性及蛇的 shadow；此处以“影像”承接后文“他们塑造过的形像”，但仍通过脚注提示补足成分。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。因科普特语原文复核尚待完成，本稿以所供公共领域英译见证为直接起草依据，并系统保留其中的补足与缺文信号。称谓“教师”“完全之人”采用可辨识但不额外教派化的表达；灵、魂、肉体三分语汇则尽量保持术语一致。
