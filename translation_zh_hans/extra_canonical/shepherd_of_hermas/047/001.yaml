translation:
  language: zh_hans
  text: ……使他们在信仰上坚定。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιῆσαι αὐτοὺς ἐν τῇ πίστει
  choice: 使他们在信仰上坚定
  rationale: 短语字面结构为“使他们在信仰中”；结合未定式 ποιῆσαι 的使动含义，译为“使……坚定”更符合现代汉语，也保留了以信仰为其所处领域或根基的意思。
theological_decisions:
- issue: πίστις 可指“信仰”“信心”或“忠信”
  choice: 信仰
  alternative: 信心
  rationale: 此处缺少足以限定为主观信靠或忠诚品格的近距离语境；“在信仰上坚定”较能保留其宽泛的宗教意义，并与英语审校层的理解相合。
