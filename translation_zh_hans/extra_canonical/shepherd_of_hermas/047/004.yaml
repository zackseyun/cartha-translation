base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/004.yaml
  text: I say to him, “Lord, now I have been strengthened in all the righteous requirements of the Lord, because you are with me; and I know that you will cut off all the devil’s power, and we shall gain mastery over him and prevail against all his works. And I hope, Lord, that now I can keep these commandments that you have commanded, with the Lord strengthening me.”
translation:
  language: zh_hans
  text: 我对他说：“主啊，如今我因你与我同在，已经在主一切公义的要求上得了力量。我知道，你必摧毁魔鬼的一切势力；我们也必制伏他，胜过他的一切作为。主啊，我盼望如今靠着主加给我的力量，能够遵守你所吩咐的这些诫命。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεδυναμώθην
  choice: 得了力量
  rationale: 采用被动表达，保留‘被加力、得到能力’之意，同时符合现代汉语习惯。
- source_word: δικαιώμασι
  choice: 正道
  rationale: 此处可指公义的要求、规条或正当之事；结合 ἐν 和‘在……上得了力量’，译作‘正道’较自然，并避免把含义过度限定为律例条文。
- source_word: συγκόψεις
  choice: 摧毁
  rationale: 该词字面有砍碎、击溃之意；‘摧毁’保留强烈的破坏意象，适用于魔鬼的势力。
- source_word: κατακυριεύσομεν
  choice: 制伏
  rationale: 表达取得支配、胜过的意思；‘制伏’在汉语中自然且保留主动压制之力。
- source_word: κατισχύσομεν
  choice: 胜过
  rationale: 传达占上风、取得胜利之意，与前面的‘制伏’形成递进。
- source_word: φυλάξαι
  choice: 遵守
  rationale: 用于诫命时，‘遵守’准确表达谨守实行，而不只是保存。
theological_decisions:
- issue: ‘主’的指称转换
  choice: 保留说话者先称眼前对象为‘主’，末句又说‘靠着主所赐的力量’
  alternative: 将末句明确译为‘靠着上帝所赐的力量’或把所有‘主’统一为同一指称
  rationale: 希腊文同时使用呼格 κύριε、第二人称‘你’和属格绝对结构 τοῦ Κυρίου ἐνδυναμοῦντος；原文可能区分异象中的使者与上帝，也保留一定张力，因此不擅自消解。
- issue: 人在胜过魔鬼作为中的角色
  choice: 译为‘我们也必制伏他，胜过他的一切作为’
  alternative: 改写为完全由上帝单方面得胜
  rationale: 原文明确以第一人称复数作主语，同时把得力和魔鬼势力被摧毁归于‘主’；译文兼顾神的加力与人的参与。
- issue: δύνασθαί με 的语气
  choice: ‘我盼望……能够’
  alternative: ‘我确信……必能’
  rationale: ἐλπίζω 表达盼望而非绝对断言，故保留说话者带信心却仍是盼望的语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文中‘主’可能指眼前说话者或至高之主的指称张力；句式适度拆分，以避免希腊文长句在中文中显得拖沓。
