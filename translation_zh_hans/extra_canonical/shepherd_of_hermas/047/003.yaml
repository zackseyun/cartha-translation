base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/003.yaml
  text: Listen to me, then, and fear the One who is able to do all things, to save and to destroy; and keep these commandments, and you will live to God.
translation:
  language: zh_hans
  text: 所以，你们要听我的话，敬畏那位无所不能、能拯救也能毁灭的那一位；要遵守这些诫命，你们就会为上帝而活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατε οὖν μου
  choice: 所以，你们要听我的话
  rationale: 保留命令语气和οὖν的承接作用；“听我的话”在现代汉语中自然表达听从说话者劝告的含义。
- source_word: φοβήθητε
  choice: 敬畏
  rationale: 此处对象是具有拯救和毁灭权能的上帝；“敬畏”既保留惧怕成分，也符合庄重的宗教语境，不弱化为单纯“尊敬”。
- source_word: τὸν πάντα δυνάμενον
  choice: 那位凡事都能的
  rationale: 直接保留πάντα的广度和δυνάμενον的能力含义，避免仅将其并入后面的拯救与毁灭。
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: 能拯救也能毁灭
  rationale: 保留两个不定式之间对称而有张力的表达；ἀπολέσαι译为“毁灭”，不擅自限定为肉身死亡或末世定罪。
- source_word: τηρεῖτε τὰς ἐντολὰς ταύτας
  choice: 要遵守这些诫命
  rationale: τηρεῖτε表示持续持守、遵行；“遵守”清楚自然，并保留ἐντολάς的权威性。
- source_word: ζήσεσθε τῷ Θεῷ
  choice: 你们就会为上帝而活
  rationale: 以“为上帝而活”表达与格τῷ Θεῷ的指向或关系含义，同时避免硬译成不自然的“活给上帝”。
theological_decisions:
- issue: “能拯救也能毁灭”的对象与范围
  choice: 不补出具体宾语或毁灭的方式
  alternative: 译作“能拯救灵魂、也能使灵魂灭亡”或“能救人、也能杀人”
  rationale: 希腊文本未明说宾语，也未限定为灵魂、身体或某种审判方式；保留原文的开放性和神学张力。
- issue: ζήσεσθε τῷ Θεῷ中与格的理解
  choice: 译为“为上帝而活”
  alternative: “在上帝面前活着”或“归于上帝而活”
  rationale: 该短语可体现生命对上帝的归属、指向或关系；“为上帝而活”在现代汉语中最自然，同时不过度锁定为单一语法解释。
translation_notes:
  register: 采用现代、庄重而清楚的普通话；保留第二人称复数“你们”和连续命令的劝诫力度。句中以分号连接敬畏与遵命两部分，使节奏清晰，并保持原文由命令转向应许的结构。
