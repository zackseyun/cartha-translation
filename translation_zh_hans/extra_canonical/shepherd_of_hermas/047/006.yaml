  text: Foolish, double‑minded, and wretched man, do you not understand that all these things are alien, and are under the authority of another? For the lord of this city will say, ‘I do not want you to dwell in my city; rather, go out from this city, because you do not make use of my laws.’ So then, you—having fields and dwellings and many other possessions—when you are cast out by him, what will you do with your field and your house, and the rest of the things you have prepared for yourself? For the lord of this land says to you, rightly, ‘Either make use of my laws, or withdraw from my land.’ So then, what are you about to do, having…
translation:
  language: zh_hans
  text: 愚昧、三心二意、可悲的人啊！你难道不明白，这一切都是别人的，并且都在另一人的权柄之下吗？因为这城的主人会说：‘我不愿你住在我的城里；你从这城出去吧，因为你不按我的律法而行。’那么，你拥有田地、房屋和许多别的财产，若被他赶出去，你将怎样处理你的田地、房屋，以及你为自己预备的其余一切呢？因为这片土地的主人理所当然会对你说：‘要么按我的律法而行，要么离开我的土地。’那么，你既有律……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所供希腊文选段截断于“ἔχων νό…”，即“既有律……”；其后的词语和句子不在本段所给范围内。
    reason: 如实标示源材料在词中截断，并保留原文尚可辨认的词首信息，避免擅自补足。
lexical_decisions:
- source_word: ἄφρον
  choice: 愚昧
  rationale: 表达缺乏属灵判断力，并保留直接斥责的语气。
- source_word: δίψυχε
  choice: 三心二意
  rationale: δίψυχος字面涉及“两个心思”；现代汉语“三心二意”自然传达内心摇摆、不专一。
- source_word: ἀλλότριά
  choice: 别人的
  rationale: 此处强调产业并非真正属于寄居者，而属于另一位权柄持有者；“别人的”比抽象的“异物”自然。
- source_word: ὑπ᾽ ἐξουσίαν ἑτέρου
  choice: 在另一个人的权下
  rationale: 保留ἐξουσία的管辖、支配含义，也与随后城主的命令衔接。
- source_word: τοῖς νόμοις μου οὐ χρᾶσαι
  choice: 你不遵行我的律法
  rationale: χράομαι与“律法”连用时指按其行事；译为“遵行”符合现代汉语，不机械译作“使用”。
- source_word: ὑπάρξεις
  choice: 产业
  rationale: 在田地和房屋的语境中指各类所有物或资产，“产业”简洁庄重。
- source_word: δικαίως
  choice: 有理由
  rationale: 表示城主如此发话是正当合理的，避免把它误解为救恩论意义上的“称义”。
- source_word: ἐκχώρει
  choice: 离开
  rationale: 表达退出、迁出其领地；与前文“离开这城”保持自然呼应。
theological_decisions:
- issue: 城主及其律法所指对象
  choice: 保留比喻中的“这城的主人／这地方的主人”，不在正文中明指其象征对象
  alternative: 将城主解释性译为世俗统治者或魔鬼
  rationale: 希腊文本在本句维持寓言层面的称谓；直接指定象征对象会消除原文留给上下文的解释空间。
- issue: “别人的”所表达的寄居观念
  choice: 按所有权与管辖权翻译，不加“今世”“属世”等神学说明
  alternative: 译为“这一切都属于今世”
  rationale: 原文只说这些事物属于别人并受另一人权柄管辖；不应把寓意直接写进正文。
- issue: νόμοι的译法
  choice: 律法
  alternative: 法律／规章
  rationale: “律法”保留宗教伦理文本的庄重色彩，但正文仍将其呈现为寓言中城主的律法，不额外等同于摩西律法或某套教会法规。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留连续反问和城主的直接引语，以维持原文劝诫性的力度；“三心二意”传达δίψυχε的内心分裂感，“在……权下”则保留寓言中的权柄主题。
