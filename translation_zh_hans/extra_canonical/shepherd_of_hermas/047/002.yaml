base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/002.yaml
  text: Therefore, believe God—you who, on account of your sins, have despaired of your life, and are adding sins and weighing down your life—that if you turn back to the Lord with your whole heart and work righteousness for the remaining days of your life, and serve him rightly according to his will, he will bring healing to your former sins, and you will have power to gain mastery over the works of the devil. And do not at all fear the devil’s threat; for he is powerless, like the sinews of a dead man.
translation:
  language: zh_hans
  text: 所以，你们这些因自己的罪而对自己的生命绝望、又罪上加罪，使自己的生命不堪重负的人，要信靠上帝：如果你们全心归向主，在自己生命余下的日子行公义，并照着他的旨意正确地事奉他，他就会医治你们从前的罪过；你们也会有力量制伏魔鬼的作为。至于魔鬼的威吓，你们丝毫不要惧怕，因为他软弱无力，如同死人的筋腱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστεύσατε ... τῷ Θεῷ
  choice: 要相信上帝
  rationale: 保留命令语气；希腊语与格所表达的对象用现代汉语“相信上帝”自然呈现。
- source_word: ἀπεγνωκότες τὴν ζωὴν ὑμῶν
  choice: 对生命绝望
  rationale: 保留“绝望”与“生命”的直陈，不擅自解释为对得救、永生或自身处境绝望。
- source_word: προστιθέντες ἁμαρτίαις
  choice: 不断加添罪恶
  rationale: 表达持续增加罪的分量；“不断”体现现在分词的持续状态。
- source_word: καταβαρύνοντες τὴν ζωὴν ὑμῶν
  choice: 使自己的生命不堪重负
  rationale: 传达“压得沉重”的形象，同时保持现代汉语流畅。
- source_word: ἐπιστραφῆτε πρὸς τὸν Κύριον
  choice: 归向主
  rationale: 兼具转回与悔改意涵，但不额外加入原文没有的教义术语。
- source_word: ἐργάσησθε τὴν δικαιοσύνην
  choice: 行公义
  rationale: 采用自然且有尊严的圣经汉语，保留 δικαιοσύνη 的伦理意味。
- source_word: δουλεύσητε αὐτῷ ὀρθῶς
  choice: 正确地服事他
  rationale: ὀρθῶς 指正确、正直地；“正确地”避免将其缩窄为“忠心地”。
- source_word: ποιήσει ἴασιν τοῖς προτέροις ὑμῶν ἁμαρτήμασι
  choice: 他就会医治你们从前的罪过
  rationale: 保留“医治”这一原文隐喻及罪过作为医治所及对象的非常规张力，不改写成“赦免”。
- source_word: κατακυριεῦσαι τῶν ἔργων τοῦ διαβόλου
  choice: 制伏魔鬼的作为
  rationale: κατακυριεύω 表示取得支配权或胜过；“制伏”在汉语中简洁表达掌控、胜过。
- source_word: ἀπειλὴν τοῦ διαβόλου
  choice: 魔鬼的威吓
  rationale: 保留属格可能表示由魔鬼发出的威胁，不扩展为试探或攻击。
- source_word: ἄτονος ... ὥσπερ νεκροῦ νεῦρα
  choice: 软弱无力，如同死人的筋腱
  rationale: ἄτονος 是无力、松弛；νεῦρα 可指筋腱，保留原文具体而强烈的比喻。
theological_decisions:
- issue: “医治从前的罪过”与赦罪的关系
  choice: 直译为“医治你们从前的罪过”
  alternative: 赦免你们从前的罪过
  rationale: 原文明确使用 ἴασις（医治），译文不应把这一救治隐喻直接等同并缩减为法律性的赦免。
- issue: 条件句与上帝行动之间的关系
  choice: 以“只要……他就会……”保留条件结构
  alternative: 如果真心悔改，上帝必定赦免
  rationale: 保留归向、行义、服事三项并列条件及原文的应许，不加入“真心悔改”或系统化救恩论表述。
- issue: “对生命绝望”的所指
  choice: 保持“生命”的开放含义
  alternative: 对得救绝望／对永生绝望
  rationale: ζωή 在此可能涉及现今生命、属灵生命或终极生命；上下文不足以只选其中一种。
- issue: 胜过魔鬼作为的主体与范围
  choice: 译为“有力量制伏魔鬼的作为”
  alternative: 获得权柄彻底战胜魔鬼
  rationale: 原文说的是其“作为”而非魔鬼本身，也未明确“彻底”或制度性权柄。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。长句依照希腊文论证关系组织，以冒号引出所信的内容，并用分号区分应许的两部分。保留“医治罪过”和“死人的筋腱”等原文不寻常意象，避免以熟悉的神学套语抹平张力。
