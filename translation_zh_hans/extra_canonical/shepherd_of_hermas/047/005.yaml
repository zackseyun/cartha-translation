  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/005.yaml
  text: “You will keep them,” he says, “if you bend toward your own city.
translation:
  language: zh_hans
  text: “你会遵守这些诫命，”他说，“只要你不回到自己的城里去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξεις
  choice: 你会遵守这些诫命
  rationale: 动词意为“遵守、守住”；结合上文明确提到的“这些诫命”，在中文中补出宾语，使指代清楚。
- source_word: κάμψαι
  choice: 转向
  rationale: 该词通常表示“弯曲、屈下”，在与方向短语连用时可自然表达为“转向”；这里不把它解释成更具体的悔改或归回，以免消除原文张力。
- source_word: εἰς τὴν ἰδίαν πόλιν
  choice: 向自己的城
  rationale: 直译方向与归属关系；保留“城”的比喻性及其可能指向真正家乡的含义，不在正文中加以神学化解释。
theological_decisions:
- issue: “自己的城”的所指
  choice: 保留为“自己的城”
  alternative: 译作“天上的家乡”或“真正的家乡”
  rationale: 现存短语本身只说“自己的城”；虽然上下文可能具有属灵家乡的意涵，正文不应把隐喻直接解释成特定神学结论。
translation_notes:
  register: 采用简洁、庄重的现代汉语对话体。“遵守这些诫命”承接上文；“转向自己的城”保留原句的空间隐喻与含义上的开放性。
