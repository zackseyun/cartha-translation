base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/003.yaml
  text: So when I heard these things, I wept greatly. But seeing me weeping, he says, ‘Why are you weeping?’ ‘Because, sir,’ I say, ‘I do not know whether I can be saved.’ ‘Why?’ he says. ‘For,’ I say, ‘sir, never yet in my life have I spoken a true word, but I have always lived deceitfully with everyone, and I made my lie appear true before all people; and no one ever contradicted me, but my word was believed. How then,’ I say, ‘sir, can I live, having done these things?’
translation:
  language: zh_hans
  text: 我听了这些话，就大大哭泣起来。他看见我哭，便问：“你为什么哭？”我说：“先生，因为我不知道自己能不能得救。”他问：“为什么？”我说：“先生，因为我这一生从未说过一句真话，反倒与众人相处时总是诡诈，使所有人都把我的谎言看作真话；从来没有人反驳我，人人都相信我的话。先生，我做了这些事，怎能活下去呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωθῆναι
  choice: 得救
  rationale: 该动词在此关乎人在罪过之后能否获得拯救；“得救”既准确，也符合现代汉语宗教文本的自然表达。
- source_word: πανοῦργος ἔζησα μετὰ πάντων
  choice: 总是以诡诈待人
  rationale: πανοῦργος 在此表示狡猾、欺诈的生活方式；转换为汉语动宾结构，清楚表达他对所有人的欺骗行为。
- source_word: τὸ ψεῦδός μου ἀληθὲς ἐπέδειξα
  choice: 使所有人都把我的谎言看作真话
  rationale: 保留“让谎言显为真实”的对照，同时用自然汉语呈现其使人信以为真的含义。
- source_word: ἀντεῖπεν
  choice: 反驳
  rationale: 指没有人对他的话提出异议或揭穿；“反驳”最贴近原文而不额外补入解释。
- source_word: ζῆσαι
  choice: 活着
  rationale: 直译其“活”的措辞，保留它可能兼指今后的生命与终极生命的语义张力。
theological_decisions:
- issue: κύριε 的称呼对象与译法
  choice: 先生
  alternative: 主啊／大人
  rationale: 这里是赫尔马对训诫者的尊称，并非明确称呼上帝；译作“先生”可避免把对话对象神化，同时保留恭敬语气。
- issue: πῶς δύναμαι ζῆσαι 的生命含义
  choice: 往后怎能活着呢
  alternative: 我怎能得生命呢／我怎能活下去呢
  rationale: 原文 ζῆσαι 可有一般生存和末世得生命的双重回响，因此不把它明确限定为永生或肉身存活。
- issue: “从未说过一句真话”的绝对表述
  choice: 按原文保留绝对语气
  alternative: 几乎没有说过真话
  rationale: 这是说话者悔恨中的强烈自陈；原文没有弱化语，应保留其修辞力度而不替作者缓和。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。保留原文问答的反复节奏和忏悔语气；不增添解释性神学术语，也不以脚注消解原文中“活着”的含义张力。
