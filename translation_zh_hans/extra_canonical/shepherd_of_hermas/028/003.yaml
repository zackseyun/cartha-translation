  terminology: “得救”适切对应 σωθῆναι；对训诫者的 κύριε 译为“先生”合乎此处非明确神名的敬称语境。“活下去”保留 ζῆσαι 可指一般生存、并可能带有生命意义回响的开放性，未将其限定为永生。
