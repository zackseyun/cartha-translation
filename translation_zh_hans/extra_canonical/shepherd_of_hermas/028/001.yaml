  to: 他又对我说：“要爱真理，让一切真理都从你口中发出，好使上帝安置在这肉身里的灵在众人面前显为真实；这样，住在你里面的主就必得荣耀。因为主所说的每一句话都真实，在他那里毫无虚假。”
