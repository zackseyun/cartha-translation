base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/001.yaml
  text: 'Again he says to me: “Love truth, and let all truth go forth from your mouth, so that the spirit which God has caused to dwell in this flesh may be found true before all people, and thus the Lord who dwells in you will be glorified; for the Lord is true in every word, and there is no falsehood with him.'
translation:
  language: zh_hans
  text: 他又对我说：“要爱真理，让一切真理都从你口中发出，好使上帝安置在这肉身里的灵在众人面前显为真实；这样，住在你里面的主就必得荣耀。因为主所说的每一句话都真实，在他那里毫无虚假。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλήθειαν / πᾶσα ἀλήθεια
  choice: 真理 / 一切真实的话
  rationale: 首次出现指应当热爱的真理原则，译作“真理”；第二处与“从你口中发出”搭配，按语境具体化为“一切真实的话”，使现代汉语自然，同时保留重复所形成的强调。
- source_word: τὸ πνεῦμα
  choice: 灵
  rationale: 保留希腊文的宽泛表达，不擅自明确为“圣灵”或“人的灵”。
- source_word: κατῴκισεν
  choice: 使之住
  rationale: 按及物用法表达上帝使这灵居住于肉身之中，并用“之”清楚回指“灵”。
- source_word: ἐν τῇ σαρκὶ ταύτῃ
  choice: 在这肉身里
  rationale: “肉身”既保留 σάρξ 的实体性与神学色彩，也比单译“身体”更贴近原文。
- source_word: ἀληθὲς εὑρεθῇ
  choice: 显为真实
  rationale: 表达“被发现、被认定为真实”，避免误解成灵此前并不真实。
- source_word: δοξασθήσεται
  choice: 就必得荣耀
  rationale: 保留被动意义，并以自然庄重的汉语表达结果。
- source_word: παρ’ αὐτῷ
  choice: 在他那里
  rationale: 贴近原文的关系性表达，说明虚假与主无涉。
theological_decisions:
- issue: “上帝使之住在肉身里的灵”的身份
  choice: 仅译作“灵”
  alternative: 圣灵；人的灵
  rationale: 本句本身没有用 ἅγιον 修饰 πνεῦμα，其所指存在解释空间；译文不替原文消除这种神学张力。
- issue: “住在你里面的主”与前述“灵”的关系
  choice: 依原文分别保留“灵”和“主”
  alternative: 将二者合并解释为圣灵或主的灵
  rationale: 原文先说上帝使灵居住，后说主住在里面；译文维持措辞转换，不作教义性等同或区分。
- issue: δοξασθήσεται 的语气
  choice: 译为“就必得荣耀”
  alternative: 就会受到称颂
  rationale: 保留“荣耀”的宗教语义及将来结果色彩，不把它缩减为人的口头赞美。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。分号承接目的句之后的结果，句号后引出理由，使长句层次清楚。译文范围严格对应读者分段第1节，不纳入原始资料中随后第2—5节的内容。
