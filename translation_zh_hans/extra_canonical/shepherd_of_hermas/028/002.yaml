base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/002.yaml
  text: Therefore those who lie reject the Lord and become defrauders of the Lord, not handing back to him the deposit that they received. For they received from him a spirit without falsehood. If they return it false, they have defiled the command of the Lord and have become defrauders.
translation:
  language: zh_hans
  text: 因此，说谎的人弃绝主，成了亏负主的人，因为他们没有把所受托保管之物交还给他。他们从他领受的是毫无虚假的灵；若把这灵变得虚假再交还，他们就玷污了主的命令，也成了亏负主的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亏负主的人”直译意为“使主失去其应得之物的人”，也可译作“欺骗主的人”或“夺去主应得之物的人”。这里承接“受托保管之物”和“交还”的意象：他们从主领受了毫无虚假的灵，却没有按其本来状态交还。
    reason: 说明ἀποστερηταί的主动“剥夺／克扣”含义，并保留παρακαταθήκη所构成的寄托、归还意象。
lexical_decisions:
- source_word: ἀθετοῦσι
  choice: 弃绝
  rationale: 此词可指拒绝、否定或废弃；在这里以说谎对待主，译作“弃绝”既保留关系层面的力度，也符合现代汉语。
- source_word: ἀποστερηταὶ τοῦ Κυρίου
  choice: 侵夺主的人
  rationale: ἀποστερητής指夺取、克扣或使人失去应得之物的人；上下文所指是没有向主交还所托付的灵，因此采用较贴近原文主动含义的“侵夺”。
- source_word: παρακαταθήκην
  choice: 托付
  rationale: 指交由人保管、日后应归还的寄存物或托付；“托付”在汉语中自然，并能与“领受”“交还”形成连贯意象。
- source_word: πνεῦμα ἄψευστον
  choice: 毫无虚假的灵
  rationale: 保留πνεῦμα的“灵”及ἄψευστος“不虚假、不会说谎”的语义，不将其明确限定为圣灵或人的灵，以保存原文张力。
- source_word: ψευδὲς ἀποδώσωσιν
  choice: 把这灵变得虚假再交还
  rationale: 原文直译近于“将它作为虚假的交还”；此译使汉语顺畅，同时呈现领受时无虚假、归还时却已虚假的对照。
- source_word: ἐμίαναν
  choice: 玷污
  rationale: 准确表达使之污秽、亵渎或败坏的强烈含义，并保持庄重语体。
theological_decisions:
- issue: 所领受之“灵”的身份
  choice: 不加限定地译作“灵”
  alternative: 译作“圣灵”或“人的灵”
  rationale: 希腊文仅作πνεῦμα，前文虽说神使其住在肉身中，却没有在本句明确加上“圣”或“人的”；不作限定可避免替原文消除神学上的含混。
- issue: “侵夺主”这一隐喻的解释
  choice: 保留债托与侵夺的司法—保管意象
  alternative: 弱化为“亏欠主的人”或“得罪主的人”
  rationale: 原文把灵称为应当交还的παρακαταθήκη，并用ἀποστερηταί描述未归还者；保留此意象更忠实于段落论证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“领受—托付—交还”的贯穿意象，并避免把“灵”的身份作超出希腊文本的教派性限定。
