base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/004.yaml
  text: He says, ‘You are thinking rightly and truly; for it was necessary for you, as a servant of God, to walk in truth, and not to let an evil conscience dwell with the spirit of truth, nor to bring grief upon the holy and true Spirit.’ ‘Never,’ I say, ‘sir, have I heard such words clearly.’
translation:
  language: zh_hans
  text: 他对我说：“你想得对，而且是真诚的；因为你既是上帝的仆人，就本该按真理行事，不该让邪恶的良心与真理之灵同住，也不该使那庄严而真实的灵忧伤。”我说：“先生，我从未这样清楚地听过这些话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλῶς καὶ ἀληθῶς φρονεῖς
  choice: 你的想法是正直而诚实的
  rationale: φρονεῖς指思想、判断或心态；καλῶς与ἀληθῶς并列，译文保留“正确/良善”与“真实/诚实”两方面含义，并采用自然现代汉语。
- source_word: ἐν ἀληθείᾳ πορεύεσθαι
  choice: 按真理行事
  rationale: 字面为“在真理中行走”，是表示生活方式的惯用表达；“按真理行事”自然且保留伦理含义。
- source_word: πονηρὰν συνείδησιν
  choice: 邪恶的良心
  rationale: 保留原文对良心的强烈负面定性，不弱化为较抽象的“内疚感”或“坏心思”。
- source_word: τῷ πνεύματι τῷ σεμνῷ καὶ ἀληθεῖ
  choice: 那庄重而真实的灵
  rationale: σεμνός基本义为可敬、庄严、庄重；此处避免直接译作“圣”，以免与常见的ἅγιος混同，并保留其修饰πνεῦμα的措辞。
- source_word: ἀκριβῶς ἤκουσα
  choice: 这样清楚地听过
  rationale: ἀκριβῶς可指准确、详尽或清楚；上下文中说话者此前未充分听明这些教导，译作“清楚地”最自然，同时不增添“准确理解”等原文未明说的内容。
theological_decisions:
- issue: πνεῦμα τῆς ἀληθείας与后文πνεῦμα所指
  choice: 译作“真理之灵”及“那庄重而真实的灵”，不明确加上“圣”或“上帝的”
  alternative: 译作“真理的圣灵”及“圣洁真实的圣灵”
  rationale: 上下文可能指上帝使之住在人肉身中的灵，也可能使读者联想到圣灵；原文此处没有ἅγιον，也未明确标示专名。译文保留这一神学张力，不擅自确定所指。
- issue: ἔδει的义务与责备语气
  choice: 译作“本该”
  alternative: 译作“必须”或“理当一直”
  rationale: ἔδει为未完成时，结合对既往行为的反省，带有未履行之责任的意味；“本该”能表达这一反事实责备。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体；保留“先生”作为κύριε在师徒式对话中的尊称，并避免将其神学化为“主啊”。原文无需要另设脚注的文本异读或不可压缩歧义。
