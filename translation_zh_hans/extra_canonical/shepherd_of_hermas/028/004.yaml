  terminology: “上帝的仆人”“按真理行事”“真理之灵”“邪恶的良心”均可接受。保留“真理之灵”与“庄严而真实的灵”，不把πνεῦμα擅自定为“圣灵”，符合原文及其神学指向尚可保留的特点。κύριε译为“先生”符合此处对话语境。
