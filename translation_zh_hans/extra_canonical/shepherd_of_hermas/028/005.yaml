base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/005.yaml
  text: ‘Now then,’ he says, ‘you are hearing; keep them, so that even the former lies that you spoke in your dealings, if these are found true, those also may become credible; for those too can become credible. If you keep these and from now on speak all truth, you will be able to gain life for yourself. And whoever hears this command and abstains from the most evil lie will live to God.’
translation:
  language: zh_hans
  text: 他又说：“那么，现在你听见了，就要谨守这些话，使你从前在办事时所说的谎话，因这些话被证实为真实，也能变得可信；因为从前那些话也能变得可信。[a]你若谨守这些话，从今以后凡事都说真话，就能为自己赢得生命。凡听从这条命令，并远离那最邪恶的谎言的人，都必为神而活。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一句的希腊文含义较难确定。“这些话”所指及“从前的谎话变得可信”之间的逻辑都较压缩。也可理解为：只要如今所持守或所说的话被证实为真，从前所说的话也会重新取得信用。
    reason: 说明τούτων的可能指代和πιστὰ γένηται的含混逻辑，而不在正文中强行定解。
lexical_decisions:
- source_word: φύλασσε αὐτά
  choice: 谨守这些话
  rationale: φύλασσε兼有留意、遵守之意；依上下文，所指是刚听见的教导，译为“谨守这些话”自然且保留命令语气。
- source_word: ἐν ταῖς πραγματείαις σου
  choice: 办事时
  rationale: πραγματεία可指事务、交往或经营活动；“办事时”范围较宽，不把语境限定为商业交易。
- source_word: πιστὰ γένηται
  choice: 变得可信
  rationale: πιστός在此与谎话后来获得可信性相对，主要表示“可信、可相信”，而非宗教意义上的“忠信”。
- source_word: πᾶσαν ἀλήθειαν λαλήσῃς
  choice: 凡事都说真话
  rationale: 直译是“说出一切真实”；现代汉语以“凡事都说真话”清楚表达持续、全面诚实的要求。
- source_word: ζήσεται τῷ Θεῷ
  choice: 必向神而活
  rationale: 保留与格τῷ Θεῷ所形成的方向或关系表达，不武断简化为“得救”或仅“永生”。
theological_decisions:
- issue: 从前的谎话如何能“变得可信”
  choice: 保留原文中令人不安且逻辑压缩的说法，并用脚注说明
  alternative: 解释为后来诚实能使过去那些本意虚假的话得到证实，或使说话者重新获得信誉
  rationale: 希腊文本确实说从前的谎话也可能成为πιστά，指代与逻辑关系存在困难；正文不应替作者消除这种张力。
- issue: ζήσεται τῷ Θεῷ的生命观念
  choice: 译作“向神而活”
  alternative: “为神而活”或“在神面前活着”
  rationale: 原文可表达相对于神、归于神或为神而活；“向神而活”保留关系和方向上的开放性，避免加入特定救恩体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谨守”“向神而活”略带古典和宗教语感，以贴合劝诫文体；其余措辞避免生硬直译。
