base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/002.yaml
  text: But if a quick temper comes on, at once the holy spirit—being tender—is cramped, not having a clean place, and it seeks to withdraw from that place; for it is choked by the evil spirit, not having room to minister to the Lord as it desires, being defiled by the quick temper. For in long-suffering the Lord dwells, but in quick temper the devil. Therefore, when both spirits dwell together in one, it is unprofitable and harmful to that person in whom they dwell.
translation:
  language: zh_hans
  text: 可是，如果一阵暴躁袭来，圣灵本是柔和敏感的，就立刻感到局促，因为没有洁净的地方可住，于是想要离开那里；原来圣灵被那邪灵压得透不过气，没有地方照自己的心愿服侍主，又被暴躁玷污了。因为主住在恒忍之中，魔鬼却住在暴躁之中。所以，这两个灵若一同住在一个人里面，对那人既无益又有害。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: 暴躁
  rationale: 该词指脾气急烈、容易动怒的性情；“暴躁”既自然简明，也能贯穿本段拟人化的对比。
- source_word: μακροθυμία
  choice: 恒忍
  rationale: 不仅表示暂时忍耐，也表示长久克制怒气；“恒忍”保留其持续性，并与“暴躁”形成鲜明对照。
- source_word: τρυφερόν
  choice: 柔和敏感
  rationale: 原词有娇嫩、易受伤害之意；此处用双词表达圣灵不与邪恶和刚硬相容的细腻形象，避免译成现代汉语中容易显得贬义的“脆弱”。
- source_word: στενοχωρεῖται
  choice: 感到局促
  rationale: 保留空间受挤压的意象，并与后文“没有地方”及“压得透不过气”相呼应。
- source_word: λειτουργῆσαι τῷ Κυρίῳ
  choice: 服侍主
  rationale: λειτουργέω在此指履行对主的事奉；“服侍主”自然、庄重，不额外限定礼仪或职分。
- source_word: ἐπὶ τὸ αὐτό
  choice: 一同住在一个人里面
  rationale: 结合上下文明确其共同居于同一人的空间意象，同时不将其解释为两者和谐共存。
theological_decisions:
- issue: “圣灵”离开以及两个灵同住的表述
  choice: 按原文保留空间性和拟人化语言，不加系统神学解释
  alternative: 将其解释为信徒失去救恩、圣灵仅停止工作，或所谓“邪灵”只是人的情绪
  rationale: 原文有意以居住、受挤压、离开的形象发出伦理警告；译文不应替作者消解其神学张力。
- issue: πνεῦμα πονηρόν的所指
  choice: 译作“邪灵”
  alternative: 译作“邪恶的性情”或直接译作“魔鬼”
  rationale: 原文明确称之为“灵”，随后又把暴躁与魔鬼相联；保留“邪灵”可维持二者相关但不完全等同的表达。
- issue: “主住在恒忍之中，魔鬼住在暴躁之中”
  choice: 直译保留对称断言
  alternative: 弱化为“恒忍属于主，暴躁属于魔鬼”
  rationale: 原文使用κατοικεῖ（居住），与全段的居所意象相连，不宜改写为单纯归属关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留“居住—地方—局促—压迫”的连续空间隐喻，并用“恒忍／暴躁”稳定呈现核心伦理对照。
