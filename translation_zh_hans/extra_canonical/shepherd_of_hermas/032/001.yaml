  to: 他说：“要恒久忍耐，并且明辨事理；这样，你就必制伏一切邪恶的行为，实行一切公义。因为你若恒久忍耐，住在你里面的圣灵将是纯净的，不被另一个邪灵遮暗；反而，圣灵住在宽敞之处，就会与自己所居住的器皿一同欢欣喜乐，并且满怀喜乐地事奉上帝，内有丰足。”
  rationale: 修订仅校正可安全确定的语义与表达：以“将是纯净的”保留原文条件句的直陈语气；以“内有丰足”较中性地保留εὐθηνία的丰足含义；并提升“制伏”“实行一切公义”的源语对应度及中文清晰度。未添加脚注，因为本读者段没有必须以脚注处理的文本歧义。
