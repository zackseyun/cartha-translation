  terminology: “恒久忍耐”“圣灵”“邪灵”“器皿”“事奉上帝”均适合本段语境。“制伏”比“胜过”更能体现κατακυριεύσεις的掌控、胜制意味；“一切公义”比“各样的义”更贴近原文。
