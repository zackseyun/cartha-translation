    rationale: καθαρὸν ἔσται直陈“将是纯净的”；虽然语境可说明其不受遮暗的状态，但“保持”是解释性补充。
  - severity: medium
    issue: εὐθηνία译为“内里安舒”过窄。
    rationale: 该词通常指丰足、兴盛、富足或良好境况；“安舒”主要突出舒适和不受压迫，未充分保留其丰盛含义。
