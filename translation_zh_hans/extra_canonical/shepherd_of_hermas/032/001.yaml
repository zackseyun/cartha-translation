base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/001.yaml
  text: “Be long-suffering,” he says, “and sensible, and you will gain mastery over all wicked deeds and do every work of righteousness. For if you are long-suffering, the holy spirit that dwells in you will be pure, not being darkened by another evil spirit; rather, dwelling in a wide space it will exult and rejoice with the vessel in which it dwells, and it will minister to God with much cheerfulness, having prosperity within itself.
translation:
  language: zh_hans
  text: 他说：“要恒久忍耐，并且明辨事理；这样，你就必制伏一切邪恶的行为，实行一切公义。因为你若恒久忍耐，住在你里面的圣灵将是纯净的，不被另一个邪灵遮暗；反而，圣灵住在宽敞之处，就会与自己所居住的器皿一同欢欣喜乐，并且满怀喜乐地事奉上帝，内有丰足。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακρόθυμος / μακροθυμία
  choice: 恒久忍耐
  rationale: 既表达受激惹时克制怒气，也保留长久忍受的持续性；比单用“耐心”更贴近本段与暴躁相对的伦理含义。
- source_word: συνετός
  choice: 明辨事理
  rationale: 此词指有理解力、审慎明智；用动词性短语使现代汉语自然，并避免把它缩窄为知识上的“聪明”。
- source_word: κατακυριεύσεις
  choice: 胜过
  rationale: 原词有制伏、掌控之意；“胜过”自然地表达不受邪恶行为支配，同时保留主动取得优势的意味。
- source_word: πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 本段把该灵描述为住在人里面并事奉上帝；采用中文基督教文献中自然且明确的人格化称谓。
- source_word: ἐν εὐρυχώρῳ
  choice: 住在宽敞之处
  rationale: 保留原文鲜明的空间隐喻，并与后文受挤压的意象形成对照。
- source_word: σκεύους
  choice: 器皿
  rationale: 保留身体或人的容器隐喻，不具体化为“身体”，以免消除原文的开放性。
- source_word: λειτουργήσει
  choice: 事奉
  rationale: 表达为上帝履行服事的宗教语境，比一般的“服务”庄重且准确。
- source_word: εὐθηνίαν
  choice: 内里安舒
  rationale: 该词可指丰足、兴盛或良好状态；结合“宽敞”“欢欣”的语境，译为“安舒”以传达不受压迫、状态顺畅之意，同时避免物质繁荣的误读。
theological_decisions:
- issue: “圣灵纯净”的条件式表述
  choice: 译为“圣灵就会保持纯净”
  alternative: “圣灵就是纯净的”
  rationale: 上下文的 καθαρὸν ἔσται 与不被邪灵遮暗、挤压相连，描述圣灵在此人里面不受沾染或遮蔽的状态；加入“保持”可避免暗示圣灵本质上会由不洁变为洁净，但不消除作者强烈的条件性修辞。
- issue: 圣灵的人格化代词
  choice: 用“他”承接圣灵
  alternative: 用“它”或反复写“圣灵”
  rationale: 希腊文语法虽用中性形式，但叙述赋予圣灵居住、欢欣、事奉等行动；中文用“他”自然承接这种人格化，同时不额外展开后期教义定义。
- issue: “另一个邪灵”与圣灵的并置
  choice: 直译为“另一个邪灵”
  alternative: 简化为“邪恶”或“恶念”
  rationale: 保留原文 ἑτέρου πονηροῦ πνεύματος 的灵体语言及其与圣灵之间的张力，不将其心理化。
- issue: 人与圣灵共同欢喜
  choice: “与他所居住的器皿一同欢欣喜乐”
  alternative: “在那器皿中欢欣喜乐”
  rationale: μετὰ 表示“与……一同”；直译保留圣灵与作为器皿之人的共同喜乐，而不把关系削弱为地点说明。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“宽敞之处”“器皿”等贯穿上下文的空间和容器意象；句式适度分开，以适合普通读者朗读。此读者段对应希腊文第1—2节，未纳入后续父段材料。
