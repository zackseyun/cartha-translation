base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/003.yaml
  text: 'For if, after taking a little wormwood, you pour it into a jar of honey, does not all the honey perish? So much honey is ruined by the smallest amount of wormwood: it destroys the sweetness of the honey, and it no longer has the same usefulness with its master, because it has been embittered and has lost its use. But if the wormwood is not cast into the honey, the honey is found sweet and becomes serviceable to its master.'
translation:
  language: zh_hans
  text: 你若拿一点苦艾，倒进一罐蜂蜜里，岂不是整罐蜂蜜都毁了吗？那么多蜂蜜，竟被那么一点苦艾糟蹋了；苦艾破坏了蜂蜜的甘甜，使它不再同样蒙主人喜爱，因为它已经变苦，失去了用途。但若不把苦艾放进蜂蜜里，蜂蜜就是甘甜的，对主人也有用。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀψίνθιον
  choice: 苦艾
  rationale: 指味道极苦的艾属植物；“苦艾”既准确又能保留原文以少量苦物败坏蜂蜜的比喻。
- source_word: κεράμιον μέλιτος
  choice: 一罐蜂蜜
  rationale: κεράμιον 指陶制容器；现代汉语用“一罐蜂蜜”自然简洁，也保留容器意象。
- source_word: ἀφανίζεται / ἀπόλλυται
  choice: 毁了／糟蹋了
  rationale: 上下文不是蜂蜜物质消失，而是其甜味和效用被破坏；采用语境化表达，同时以两个近义词反映原文动词变化。
- source_word: χάριν ἔχει παρὰ τῷ δεσπότῃ
  choice: 蒙主人喜爱
  rationale: χάρις 在此可指悦纳、青睐或可取之处；译文保留主人对蜂蜜的认可这一关系含义，不硬译为抽象的“恩惠”。
- source_word: εὔχρηστον
  choice: 有用
  rationale: 表示适用、可供使用；“对主人有用”自然传达其功能性。
theological_decisions:
- issue: δεσπότης 在比喻中的指向
  choice: 主人
  alternative: 主
  rationale: 本句仍处于蜂蜜和器皿的比喻层面，直译为“主人”可保留叙事意象；上下文虽可能影射主上帝，但不在本句中明示，以免提前消解双关。
- issue: 蜂蜜“毁灭”的含义
  choice: 按品质和用途受损来表达
  alternative: 按字面译为“灭亡”或“消失”
  rationale: 后文明确解释为甜味被破坏、用途丧失，因此不应让读者误以为蜂蜜在物质上消失。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文的反问、数量对比和“主人”意象；避免以解释性神学术语取代具体比喻。
