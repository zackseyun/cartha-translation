base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/004.yaml
  text: You see, then, that long-suffering is sweeter than honey and is serviceable to the Lord, and he dwells in it; but quick temper is bitter and useless. If, therefore, quick temper is mixed with long-suffering, long-suffering is defiled and is no longer useful to God. Long-suffering at all times has nothing bitter within itself, remaining always gentle and quiet. This long-suffering, then, dwells with those who have the faith complete.
translation:
  language: zh_hans
  text: 所以，你看，恒忍比蜜更甘甜，对主有用，主也住在恒忍之中；急躁易怒却是苦的，毫无用处。因此，急躁易怒若与恒忍混在一起，恒忍就受了玷污，不再对上帝有用。恒忍在任何时候都不带一点苦味，始终温和安静。这样的恒忍与信心完整无缺的人同住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακροθυμία
  choice: 恒忍
  rationale: 该词在本段指受激惹时持久忍耐、不轻易发怒的品格。“恒忍”既保留持续忍耐之意，也能与下文的温和、安静自然衔接。
- source_word: ὀξυχολία
  choice: 急躁易怒
  rationale: 原词不是一般性的“愤怒”，而是脾气骤发、容易动怒的倾向；用“急躁易怒”可与后文更强烈的怒气层次区分。
- source_word: εὔχρηστος / ἄχρηστος
  choice: 有用／毫无用处
  rationale: 保留器皿或品格可供主人使用的语义，也呼应上文蜂蜜是否仍适合主人使用的比喻。
- source_word: ὁλόκληρον
  choice: 完整无缺
  rationale: 表达整体、健全、无缺的含义，不擅自解释为某一宗派所界定的信仰成熟程度。
theological_decisions:
- issue: “主住在恒忍之中”的表达
  choice: 按原文直译为“主也住在恒忍之中”
  alternative: 解释为“主与恒忍的人同住”
  rationale: 原文明确以品格“恒忍”为居所式表达；保留这一拟人化和神学张力，不将其改写成较平常的人际表述。
- issue: “信心完整无缺的人”所指
  choice: 保留原文对信心整体性的描述
  alternative: 译作“信心成熟的人”或“全心信靠的人”
  rationale: 原文只说信心是完整的，并未明确界定为成熟度或主观投入程度，因此不作额外限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“恒忍”贯穿本段，保持与“急躁易怒”的鲜明对照；句式适度保留原文反复论证和智慧教导的节奏。
