base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/005.yaml
  text: Quick temper, for its part, is first foolish—flighty and senseless. Then from senselessness comes bitterness; from bitterness, anger; from anger, wrath; and from wrath, rage. Then rage—composed of so many evils—becomes a great and incurable sin.
translation:
  language: zh_hans
  text: 至于暴躁，首先是愚蠢、轻浮而不明事理的。接着，不明事理生出苦毒，苦毒生出怒气，怒气生出愤怒，愤怒生出暴怒。暴怒由这么多恶事汇聚而成，就成为大而无可医治的罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: 急躁
  rationale: 指容易动怒、性情急烈的状态；“急躁”自然易懂，也适合本段将其描述为逐步恶化之起点的语境。
- source_word: μωρά, ἐλαφρά τε καὶ ἄφρων
  choice: 愚蠢、轻浮而无知
  rationale: 分别保留“愚昧”“轻率或轻浮”“缺乏明辨”的并列语义，不将三个形容词合并为单一评价。
- source_word: πικρία
  choice: 苦毒
  rationale: 既表达内在的苦涩怨毒，也与后续各种怒气状态有所区分。
- source_word: θυμός / ὀργή / μῆνις
  choice: 怒气／愤怒／暴怒
  rationale: 用逐渐增强的现代汉语词汇再现原文从 θυμός 到 ὀργή，再到 μῆνις 的递进，同时避免把三个近义词译成同一个词。
- source_word: συνισταμένη
  choice: 汇聚而成
  rationale: 表达暴怒由前述多种恶逐步构成、聚合起来，而非凭空出现。
- source_word: ἀνίατος
  choice: 无可医治
  rationale: 保留原文的医治隐喻，比单译“无法挽回”更贴近希腊文。
theological_decisions:
- issue: 罪的形成过程
  choice: 保留“生出”与“汇聚而成”的递进链条
  alternative: 将整段概括为急躁会导致严重的罪
  rationale: 原文刻意呈现从无知、苦毒到不同层级怒气，最终成为大罪的过程；不应在译文中压缩这种道德与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫文体。通过“怒气—愤怒—暴怒”呈现原文近义词的强度递增；不添加原文没有的教派性解释。
