base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/007.yaml
  text: Therefore keep away from quick temper—that most wicked spirit—but clothe yourself with long-suffering, and stand against quick temper and bitterness, and you will be found with the dignity that is beloved by the Lord. See to it, then, that you never neglect this command; for if you gain mastery over this command, you will also be able to keep the other commands that I am about to give you. Be strong in them and be empowered[—], and let all be empowered who wish to walk in them.”
translation:
  language: zh_hans
  text: 所以，你要远离暴躁——这极其邪恶的灵；却要披戴恒忍，抵挡暴躁和苦毒，这样你就会显出主所喜爱的端庄。你要留心，切不可轻忽这条命令；因为你若掌握了这条命令，也就能遵守我将要吩咐你的其余命令。要在这些命令中刚强，也要得力；凡愿意在这些命令中行事的人，也都要得力。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: 暴躁
  rationale: 指性情急烈、容易发怒；“暴躁”自然简洁，也能贯穿本段将其拟人化为邪灵的论述。
- source_word: μακροθυμία
  choice: 恒忍
  rationale: 兼有长久忍耐与不轻易发怒之意；“恒忍”比单纯“忍耐”更能保留持续性，并与“暴躁”形成对照。
- source_word: ἔνδυσαι
  choice: 披戴
  rationale: 保留原文“穿上”的比喻，现代宗教语境中易懂且庄重。
- source_word: σεμνότης
  choice: 端庄
  rationale: 表达庄重、可敬的品格，不将其窄化为特定德目。
- source_word: παρενθυμηθῇς
  choice: 忽略
  rationale: 该罕见词在语境中指把命令置于心外、不予理会；译作“忽略”自然，并避免过度确定其词源细节。
- source_word: κυριεύσῃς
  choice: 制伏
  rationale: 保留“取得支配、掌握”的强烈意味；此处宾语虽是“命令”，语义略显张力，译文不改写为较弱的“明白”。
- source_word: πορεύεσθαι
  choice: 行事
  rationale: 原义为“行走”；在“按命令而行”的伦理语境中译作“行事”更符合现代汉语，同时保留生活实践之意。
theological_decisions:
- issue: “极其邪恶的灵”是修辞拟人还是独立灵体
  choice: 保留“灵”的直译，不作解释
  alternative: 译作“极其邪恶的性情”
  rationale: 上下文明确反复使用πνεῦμα，并将暴躁描写为邪恶的灵；译文保留文本自身的灵性语言与可能的拟人张力，不替读者作本体论判断。
- issue: “制伏这条命令”的不寻常搭配
  choice: 保留取得支配的表达
  alternative: 译作“掌握这条命令”或“遵守这条命令”
  rationale: κυριεύω本身强调掌控；紧接着才用“遵守”描述其余命令，因此不把两个不同动词合并。
- issue: 末句被动式ἐνδυναμοῦ／ἐνδυναμούσθωσαν的施事者
  choice: 译作“得着力量”，不补明力量来自谁
  alternative: 译作“靠主得力”
  rationale: 希腊文未明说施事者；不擅自补入“主”或其他神学说明，以保存原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“披戴”“灵”“命令”等原文核心意象和术语；用“恒忍”与“暴躁”构成稳定对照。末尾被动表达不补出未明说的力量来源。
