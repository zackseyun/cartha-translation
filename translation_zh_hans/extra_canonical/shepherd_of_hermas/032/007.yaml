revisions:
- from: 所以，你要远离暴躁——这极其邪恶的灵；却要披戴恒忍，抵挡暴躁和苦毒，这样你就会与主所喜爱的端庄同在。你要留心，绝不可忽略这条命令；因为你若能制伏这条命令，也就能遵守我将要吩咐你的其余命令。要在这些命令上刚强起来，得着力量；凡愿意按这些命令行事的人，也都要得着力量。”
  to: 所以，你要远离暴躁——这极其邪恶的灵；却要披戴恒忍，抵挡暴躁和苦毒，这样你就会显出主所喜爱的端庄。你要留心，切不可轻忽这条命令；因为你若掌握了这条命令，也就能遵守我将要吩咐你的其余命令。要在这些命令中刚强，也要得力；凡愿意在这些命令中行事的人，也都要得力。”
  rationale: 修订仅处理两处汉语句法和一处搭配问题：以“显出……端庄”表达“被发现与端庄相伴”，以“在这些命令中刚强，也要得力”对应两个并列命令及其复数指代，并将“制伏命令”调整为自然且仍保留掌控意味的“掌握命令”。未添加任何关于“灵”或力量来源的解释。
