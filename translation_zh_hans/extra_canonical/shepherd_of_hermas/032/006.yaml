base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/006.yaml
  text: For when all these spirits dwell in one vessel, the very vessel in which the holy spirit also dwells, that vessel cannot contain them; it overflows. The tender spirit, having no habit of dwelling with an evil spirit or with harshness, withdraws from such a person and seeks to dwell with gentleness and quiet. Then, when it has departed from that person in whom it dwells, that person becomes empty of the righteous spirit; and thereafter, being filled with evil spirits, he is unstable in all his deeds, dragged here and there by the evil spirits, and is altogether blinded from his good understanding. Thus it happens to all who are quick-tempered.
translation:
  language: zh_hans
  text: 因为当这一切的灵都住在同一个器皿里，就是圣灵也居住的那个器皿，这器皿便容纳不下，满溢出来。于是，那娇嫩的灵既不惯于同邪灵或刚硬的性情共住，就会离开这样的人，寻求与温柔、安静同住。它离开原先所住的那人以后，那人便失去了公义之灵；此后，他被邪灵充满，在一切行为上都摇摆不定，被邪灵牵扯得忽东忽西，完全被蒙蔽，失去了良善的心思。凡性情急躁的人，都会落到这种地步。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγος
  choice: 器皿
  rationale: 保留原文以容器比喻人为圣灵居所的意象，并与“容纳不下、满溢”自然衔接。
- source_word: τὸ τρυφερὸν ... πνεῦμα
  choice: 那柔敏的灵
  rationale: τρυφερός在此表示柔嫩、敏感而不能与邪恶和刚硬共处；“柔敏”既保留这种脆弱敏锐之感，也避免与后文πραότης的“温柔”完全重合。
- source_word: σκληρότης
  choice: 刚硬
  rationale: 兼顾性情上的严酷、顽硬之意，并维持与柔敏、温柔和安静的对照。
- source_word: τὸ πνεῦμα τοῦ δικαίου
  choice: 公义之灵
  rationale: 按属格短语直译，保留它与前文“圣灵”的关联及措辞差异，不擅自断定二者是否为严格同一称谓。
- source_word: ἀκαταστατεῖ
  choice: 变得反复不定
  rationale: 表达行为失序、不稳定的状态，符合随后被邪灵牵扯来去的图景。
- source_word: ἀποτυφλοῦται ἀπὸ τῆς διανοίας τῆς ἀγαθῆς
  choice: 良善的悟性也完全昏瞎了
  rationale: 保留“完全致盲”与“良善悟性”的强烈表述，同时使用现代汉语可理解的宗教文体。
- source_word: ὀξύχολοι
  choice: 性情急躁的人
  rationale: 该词指易怒、暴躁者；结合本段上下文，以“性情急躁”表达迅速发怒的倾向。
theological_decisions:
- issue: 圣灵离开人的表述
  choice: 直译为“就会离开这样的人”及“它离开……以后”
  alternative: 弱化为圣灵暂时不再发挥作用或人失去圣灵的感受
  rationale: 原文明确使用ἀποχωρεῖ和ἀποστῇ表示离开；译文保留其神学张力，不以特定宗派的圣灵论加以调和。
- issue: “公义之灵”与“圣灵”的关系
  choice: 保留原文两个不同表达：“圣灵”与“公义之灵”
  alternative: 两处都统一译作“圣灵”
  rationale: 原文先称τὸ πνεῦμα τὸ ἅγιον，后称τὸ πνεῦμα τοῦ δικαίου；保留差异可避免解释过度，也让读者看见文本本身的称谓变化。
- issue: 多个邪灵的本体地位
  choice: 按原文译作“邪灵”，不改写为情绪或恶习
  alternative: 解释性翻译为“各种邪恶情绪/恶习”
  rationale: 上下文虽可能人格化急躁、苦毒等倾向，但原文反复使用πνεύματα；译文应保留其可能兼具灵性实体与人格化恶习的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“器皿”“同住”“公义之灵”等早期基督教劝诫文体的核心意象，同时以“容纳不下”“忽东忽西”“反复不定”等自然表达避免生硬欧化。
