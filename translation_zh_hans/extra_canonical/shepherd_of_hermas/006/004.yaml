base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/004.yaml
  text: After you have made known to them these words which the Master commanded me to be revealed to you, then all their sins that they formerly committed are forgiven them, and also to all the holy ones who have sinned up to this day, if they repent with all their heart and remove from their heart their double‑mindedness.
translation:
  language: zh_hans
  text: 你把这些话告诉他们以后——就是主宰吩咐我向你启示的那些话——他们从前所犯的一切罪就都蒙赦免；所有直到今日犯过罪的圣徒，也同样蒙赦免，只要他们全心悔改，并从心里除去三心二意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεσπότης
  choice: 主宰
  rationale: 保留 δεσπότης 所含的权柄与主权意味，并与本段其他位置的 Κύριος（主）有所区分。
- source_word: ἀφίενται
  choice: 蒙赦免
  rationale: 此处为现在时被动语态，语境明确指罪得赦；用“蒙赦免”自然表达其被动含义，又不擅自说明施事者。
- source_word: οἱ ἅγιοι
  choice: 圣徒
  rationale: 指属于神的群体；“圣徒”是现代汉语基督教文献中清楚而庄重的群体称谓。
- source_word: ἐξ ὅλης τῆς καρδίας μετανοήσωσιν
  choice: 全心悔改
  rationale: 简洁保留“从整个心/全心”与“悔改”的双重重点。
- source_word: τὰς διψυχίας
  choice: 三心二意
  rationale: διψυχία 指内心分裂、摇摆不定；复数在汉语中无需机械标数。“三心二意”通俗自然，也保留其道德与信仰上的不坚定意味。
theological_decisions:
- issue: 赦罪陈述与悔改条件之间的关系
  choice: 按原文保留“就都蒙赦免……只要……”的结构
  alternative: 改写为“便可得到赦免”或明确限定赦免发生的时间与机制
  rationale: 原文先以现在时被动语态陈述赦免，随后用 ἐὰν 引出悔改和除去二心的条件；译文保留这种张力，不将其系统化为特定教义公式。
- issue: “所有圣徒”是否包括赫马的家人
  choice: 用“也同样蒙赦免”并列呈现
  alternative: 解释为家人属于圣徒群体，或解释为两个彼此排斥的群体
  rationale: καὶ πᾶσιν τοῖς ἁγίοις 是附加并列成分；原文没有明确交代两个群体的集合关系，译文不替作者消除这一含混。
- issue: δεσπότης 的所指
  choice: 译作“主宰”而不进一步指明位格
  alternative: 译作“上帝”“主耶稣”或“主”
  rationale: 本句本身未明确说明 δεσπότης 的具体所指；采用对应称号可避免导入未经文本明说的位格判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以破折号处理关系从句和启示内容之间较复杂的嵌套，使句法清楚；不添加原文没有的时间、圣礼或教会制度解释。
