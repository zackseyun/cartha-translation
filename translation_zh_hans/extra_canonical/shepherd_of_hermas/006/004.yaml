review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了赦罪、全心悔改及除去διψυχία（内心摇摆／二心）的主要内容，也保留了赦罪陈述与条件从句并置的句法张力。惟“主宰吩咐我启示给你的”在现代汉语中施事和受事关系略显含混；改为“主宰吩咐我向你启示的”更清楚对应原文中主宰对说话者的命令及“向你”启示的方向。
  naturalness: 原句整体庄重自然。“主宰吩咐我启示给你的”略不合现代书面汉语常用搭配，宜补出介词“向”。其余“蒙赦免”“全心悔改”“从心里除去三心二意”均符合现代标准汉语的宗教书面语体。
  terminology: “主宰”可恰当区别于本段的Κύριος（主）；“蒙赦免”“圣徒”“悔改”均为稳定而适切的译法。“三心二意”自然地表达διψυχία的内心分裂、摇摆之意，虽较口语化，置于本句仍可接受。
  issues:
  - severity: low
    issue: “主宰吩咐我启示给你的”句法关系略含混。
    rationale: “启示给你”可被读作“我启示给你”，但“吩咐我启示给你”在现代汉语中搭配不够顺畅。加“向”可明确为主宰吩咐说话者向“你”启示这些话，同时不增添原文未有的神学解释。
  revised_text: 你把这些话告诉他们以后——就是主宰吩咐我向你启示的那些话——他们从前所犯的一切罪就都蒙赦免；所有直到今日犯过罪的圣徒，也同样蒙赦免，只要他们全心悔改，并从心里除去三心二意。
