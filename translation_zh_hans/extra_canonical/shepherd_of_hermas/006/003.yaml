base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/003.yaml
  text: But make these words known to all your children and to your wife, who is to be your sister; for she too does not refrain from her tongue, by which she acts wickedly. But when she hears these words, she will refrain, and she will obtain mercy.
translation:
  language: zh_hans
  text: 但你要把这些话告诉你所有的儿女，也告诉你那将要成为你姊妹的妻子；因为她也不约束自己的舌头，借着它作恶。但她听见这些话以后，就会约束自己，并将蒙怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβίῳ
  choice: 妻子
  rationale: 该词指共同生活的配偶；现代汉语以“妻子”最自然明确。
- source_word: τῇ μελλούσῃ σου ἀδελφῇ
  choice: 就是那将要成为你姊妹的人
  rationale: 保留将来意味和“姊妹”的基督徒亲属称谓，不把其神学含义进一步解释化。
- source_word: οὐκ ἀπέχεται τῆς γλώσσης
  choice: 不约束自己的舌头
  rationale: 贴近原文的身体隐喻，同时在现代汉语中可理解为不控制言语。
- source_word: ἐν ᾗ πονηρεύεται
  choice: 用它行恶
  rationale: 关系代词指向“舌头”；译文保留以言语作恶的含义，不擅自限定为毁谤或辱骂。
- source_word: ἕξει ἔλεος
  choice: 将蒙怜悯
  rationale: 希腊文直义为“将得着怜悯”；“蒙怜悯”符合庄重而自然的中文宗教语体。
theological_decisions:
- issue: 妻子将成为“姊妹”的含义
  choice: 按原文直译为“将要成为你姊妹的人”
  alternative: 解释为“今后要像姊妹一样生活的妻子”或“将成为信徒姊妹的妻子”
  rationale: 原文没有明说这是守独身、改变婚姻关系，还是属灵身份的转变，因此保留其真实歧义。
- issue: 怜悯与行为改变的关系
  choice: 按叙述次序译为听见、约束自己、蒙怜悯
  alternative: 扩译为“因悔改而得到赦免”
  rationale: 本句只说她会停止并得怜悯，未明确使用“悔改”或“赦免”，故不加入额外的救恩论解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“儿女”兼顾 τέκνα 的集合意义；“姊妹”保留早期基督徒文本的称谓色彩。“约束自己的舌头”有意保存原文意象。
