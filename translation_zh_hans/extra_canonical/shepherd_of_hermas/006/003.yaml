review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了命令、对象、舌头所犯的恶，以及听见后止息并得怜悯的次序。"将要成为你姊妹的人"保留了μελλούσῃ与ἀδελφῇ的未解歧义，但其与前面的“妻子”连接方式不够清楚。
  naturalness: “你的妻子，就是那将要成为你姊妹的人”在现代汉语中会令人误以为妻子与“那人”是两个对象，且“用它行恶”略显生硬。调整语序并以“借着它作恶”表达工具意义，可更自然而不缩窄原意。
  terminology: “儿女”“妻子”“姊妹”“蒙怜悯”均适合庄重的现代汉语宗教文本。“姊妹”应保留，不将其解释为禁欲安排或单纯信徒称谓。
  issues:
