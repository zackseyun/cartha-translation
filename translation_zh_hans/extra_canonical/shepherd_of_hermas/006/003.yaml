    issue: 妻子与“将要成为你姊妹的人”的同位关系不够明确
    rationale: 原文τῇ συμβίῳ σου τῇ μελλούσῃ σου ἀδελφῇ是指同一人。草案的“你的妻子，就是那将要成为你姊妹的人”在中文中略显指称断裂。
  - severity: low
