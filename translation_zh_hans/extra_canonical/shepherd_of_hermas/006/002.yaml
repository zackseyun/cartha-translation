base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/002.yaml
  text: “Your offspring, Hermas, have rejected God and blasphemed the Lord, and they have betrayed their parents in great wickedness, and they were heard as betrayers of parents; and though they betrayed them, they gained no advantage, but they added still to their sins licentious acts and mixtures of wickedness, and thus their lawless deeds were filled up.
translation:
  language: zh_hans
  text: “赫尔马，你的后代背弃了上帝，亵渎了主；他们以极大的邪恶出卖了自己的父母，也被称为出卖父母的人。[a]他们出卖了父母，却没有得到益处，反而在自己的罪上又加添了放荡的行为和邪恶的混杂；这样，他们的不法之事就满盈了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “也被称为出卖父母的人”：希腊文直译近于“也被听说是出卖父母的人”。此处措辞与句法不寻常；也可能是指他们被人传为、称作出卖父母的人。
    reason: 为 ἤκουσαν προδότας γονέων 保留文本与语义的不确定性，避免将其定为单一、过度解释的意思。
lexical_decisions:
- source_word: Τὸ σπέρμα σου
  choice: 你的儿女
  rationale: σπέρμα 字面为“种子、后裔”，这里是集合用法，后文以复数代词指代，并明确称为“儿女”，故采用自然且合乎语境的“你的儿女”。
- source_word: ἠθέτησαν εἰς τὸν Θεόν
  choice: 背弃了上帝
  rationale: ἀθετέω 可表示拒绝、弃绝或背信；结合 εἰς τὸν Θεόν，译作“背弃了上帝”既传达关系性的悖逆，也不把含义收窄为纯粹理智上的否认。
- source_word: προέδωκαν τοὺς γονεῖς αὐτῶν
  choice: 出卖了自己的父母
  rationale: προδίδωμι 指背叛、出卖；“出卖”能与下文反复出现的同词根表达保持联系。
- source_word: ἀσελγηίας
  choice: 淫荡的行为
  rationale: ἀσέλγεια 可泛指放纵、无耻行为，也常带性方面的淫荡意味；此处用“淫荡的行为”保留其强烈道德色彩。
- source_word: συμφυρμοὺς πονηρίας
  choice: 种种邪恶的混杂
  rationale: συμφυρμός 指混合、混杂或纠缠；原文具体所指不明，因此保留其不寻常而含混的意象，不擅自解释为某一类具体罪行。
- source_word: ἐπλήσθησαν αἱ ἀνομίαι αὐτῶν
  choice: 他们违法的事就满盈了
  rationale: 保留“满盈”这一完成、积满的意象；ἀνομία 译为“违法的事”，体现违背神圣法则之意，同时避免添加原文没有明说的审判结论。
theological_decisions:
- issue: 儿女对上帝的行为应译为“拒绝”“否认”还是“背弃”
  choice: 背弃了上帝
  alternative: 拒绝了上帝
  rationale: “背弃”较能兼顾 ἀθετέω 的弃绝与背信色彩，并与本段家庭关系中的“出卖”形成呼应，但不把两者视为同一行为。
- issue: 罪恶“满盈”的陈述是否应解释为审判已经不可逆转
  choice: 仅译出“违法的事就满盈了”
  alternative: 译为“罪恶已经满盈，必受审判”
  rationale: 原文只陈述不法行为达到满盈，并未在本句明说审判或不可逆转性，因此不添加系统神学推论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文连续指控的强烈节奏，以分号划分层次；避免古奥措辞，但用“背弃”“亵渎”“满盈”等词维持早期基督教劝诫文本的肃穆语气。
