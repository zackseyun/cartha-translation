base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/007.yaml
  text: Persevere, then, you who work righteousness, and do not be double‑minded, so that your passing may be with the holy angels. Blessed are you who endure the great tribulation that is coming, and who will not deny their life.
translation:
  language: zh_hans
  text: 所以，你们这些行公义的人，要坚守，不要心怀二意，好使你们走过这段路程时得与圣天使同在。你们这些忍受那即将来临的大患难、并且不否认自己生命的人，是有福的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “走过这段路程”所译的希腊词也可指“经过”或“离去”；原文并未明确限定为死亡。“不否认自己生命”直译原文；这句话的确切所指不完全明确，可能是指在大患难中不弃绝真正的生命，但正文保留原句的歧义。
    reason: 说明πάροδος及“否认自己的生命”这一不寻常表达的语义范围，避免把可能的解释写成正文的确定意思。
lexical_decisions:
- source_word: ἐμμείνατε
  choice: 要坚持到底
  rationale: 表达持续坚守、恒久不移的命令语气；“到底”自然传达坚持不放弃，并未额外限定具体终点。
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: 这些行公义的人
  rationale: 保留“实践、施行公义”的主动含义，采用现代汉语中自然且庄重的表达。
- source_word: μὴ διψυχήσητε
  choice: 不要心怀二意
  rationale: διψυχέω指内心摇摆、意志不专一；“心怀二意”既保留心志分裂的意象，也便于现代读者理解。
- source_word: ἡ πάροδος
  choice: 离世时
  rationale: 此处可指经过、离去或人生的终程；结合“与圣天使同在”的语境，译作“离世时”较为自然，但以脚注保留词义歧义。
- source_word: τὴν θλῖψιν τὴν ἐρχομένην τὴν μεγάλην
  choice: 那即将来临的大患难
  rationale: 保留定冠词、将来临及“大”的强调；“患难”兼有压迫、苦难和困境之义。
- source_word: τὴν ζωὴν αὐτῶν
  choice: 自己生命
  rationale: 严格保留希腊文宾语“他们的生命”，不依后文擅自改成“主”或“信仰”，从而保存文本本身的张力。
theological_decisions:
- issue: “不否认他们的生命”的所指
  choice: 不否认自己生命
  alternative: 不否认他们的主／不弃绝自己的信仰
  rationale: 希腊文明确为τὴν ζωὴν αὐτῶν（他们自己的生命）；即使下一节谈到否认主，也不应据此静默改写本节。保留直译，并以脚注说明其可能含义。
- issue: πάροδος是否指死亡或进入末世境况
  choice: 离世时
  alternative: 经过时／过渡时
  rationale: 上下文中的“与圣天使同在”支持生命终程的理解，但词本身并非专门的死亡术语，因此脚注提示其较宽词域，避免把解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留劝勉语气和末世患难的张力；避免使用教派化术语。
