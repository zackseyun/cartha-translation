base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/001.yaml
  text: 'After fifteen days, when I had been fasting and had asked the Lord many things, the understanding of the writing was revealed to me. And this was written:'
translation:
  language: zh_hans
  text: 我禁食了十五天，又多次求问主以后，那篇文字的含义就向我显明了。上面写着这些话：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ δέκα καὶ πέντε ἡμέρας
  choice: 十五天后
  rationale: 准确表达经过十五天之后；δέ在此主要承接叙事，不必机械译出。
- source_word: νηστεύσαντός μου
  choice: 我禁食
  rationale: 保留νηστεύω的宗教实践含义，同时使用现代汉语通行表达。
- source_word: πολλὰ ἐρωτήσαντος τὸν Κύριον
  choice: 多次求问主
  rationale: πολλά可指许多事或多番询问；“多次求问”在汉语中自然，也保留反复恳求、询问的语气。
- source_word: ἡ γνῶσις τῆς γραφῆς
  choice: 那文字的含义
  rationale: γνῶσις在此指对所写内容的认识或理解；γραφή指前文所见的文字，不宜直接译成容易特指正典的“经文”。
- source_word: ἀπεκαλύφθη μοι
  choice: 向我显明了
  rationale: 保留被动启示语态及神圣揭示的意味，符合庄重而自然的现代汉语。
- source_word: ἦν δὲ γεγραμμένα ταῦτα
  choice: 上面写着这些话
  rationale: 将希腊语迂回被动结构转换为自然汉语，并以冒号引出后文内容。
