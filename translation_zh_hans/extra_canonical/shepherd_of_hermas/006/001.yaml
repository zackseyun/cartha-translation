    rationale: 希腊文以“十五天”与“我禁食了”的分词结构相连，意为禁食十五天之后（并多方求问主），而不是十五天后才禁食。
  revised_text: 我禁食了十五天，又多次求问主以后，那篇文字的含义就向我显明了。上面写着这些话：
