  naturalness: 原译“被排除在自己的生命之外”在现代汉语中搭配生硬，且“自己的生命”容易造成语义不清。“他们的生命已无望”较自然、庄重，且不额外界定为肉身死亡、永罚或教会处分。
  terminology: “主”“儿子”“否认”“怜悯”均合乎本段庄重的基督教文献语域。将“自己之主”调整为“自己的主”更合现代普通话习惯；“已向他们施恩”可保留为对ἵλεως ἐγένετο的谨慎表达。
