revisions:
- from: 因为主曾指着他的儿子起誓：凡否认自己之主的人，都被排除在自己的生命之外——就是那些如今将要在来临的日子里否认他的人；至于从前否认过的人，因着主极大的怜悯，他已向他们施恩。
  to: 因为主曾指着他的儿子起誓：凡否认自己主的人，他们的生命已无望——就是那些如今将要在来临的日子里否认他的人；至于从前否认过的人，因着主极大的怜悯，他已向他们施恩。
  rationale: 仅修订ἀπεγνωσθαι ἀπὸ τῆς ζωῆς αὐτῶν的译法，以贴近其“无望／被绝望地放弃”的开放语义，并使汉语自然清楚。保留原文“指着他的儿子起誓”的突兀起誓公式，以及对未来否认者和既往否认者的时间性对照；不把“生命”解释为特定的救恩论或刑罚结论。
