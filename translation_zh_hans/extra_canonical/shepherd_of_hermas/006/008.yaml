base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/008.yaml
  text: For the Lord swore by his Son that those who denied their Lord are cut off from their life—those who are now about to deny him in the coming days; but to those who denied before, because of his great compassion, he became merciful.”
translation:
  language: zh_hans
  text: 因为主曾指着他的儿子起誓：凡否认自己主的人，他们的生命已无望——就是那些如今将要在来临的日子里否认他的人；至于从前否认过的人，因着主极大的怜悯，他已向他们施恩。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤμοσεν ... κατὰ τοῦ υἱοῦ αὐτοῦ
  choice: 曾指着他的儿子起誓
  rationale: κατά与属格用于起誓对象，可自然译为“指着……起誓”；保留“他的儿子”的明确所指。
- source_word: ἀρνησαμένους
  choice: 否认
  rationale: 在逼迫语境中表示不承认、弃绝自己的主；“否认”既贴近原文，也保留其具体表现的开放性。
- source_word: ἀπεγνωσθαι ἀπὸ τῆς ζωῆς αὐτῶν
  choice: 被排除在自己的生命之外
  rationale: ἀπεγνωσθαι语义强烈，含被判定无分、被弃绝之意；采用“被排除”而不直接解释成“不得救”，保留原文与“生命”之间的表达张力。
- source_word: πολυσπλαγχνία
  choice: 极大的怜悯
  rationale: 指深厚、丰富的慈悲怜悯；现代汉语中“极大的怜悯”庄重且清楚。
- source_word: ἵλεως ἐγένετο αὐτοῖς
  choice: 他已向他们施恩
  rationale: 表达转为恩慈、宽宥相待；“施恩”自然传达其结果，同时避免把句子扩释为特定的赦罪公式。
theological_decisions:
- issue: 否认主者与生命的关系
  choice: 译作“被排除在自己的生命之外”
  alternative: “已经断绝了他们的生命”或“无分于生命”
  rationale: 原文结构ἀπεγνωσθαι ἀπὸ τῆς ζωῆς αὐτῶν较不寻常；所选译法保留被判定排除的被动意义及“他们自己的生命”这一措辞，不擅自断定是肉身死亡、永刑或教会纪律。
- issue: 过去否认者所得的宽宥
  choice: “因着主极大的怜悯，他已向他们施恩”
  alternative: “他已怜悯他们”或“他们已蒙赦免”
  rationale: 保留ἵλεως ἐγένετο的恩慈、宽宥含义，但不把它收窄为某一种系统化救恩结论。
- issue: 起誓公式“指着他的儿子”
  choice: 按原文直译保留
  alternative: 弱化为“主郑重宣告”
  rationale: 这一公式虽在神学与修辞上较为突兀，却是希腊文本的真实表述，不应静默改写。
translation_notes:
  register: 采用现代、庄重且可朗读的书面普通话。以破折号承接原文对“那些人”的进一步限定，并以分号凸显将来否认者与从前否认者之间的对照。未添加原文没有的解释性称谓或宗派术语。
