  source_fidelity: 草稿准确传达了起誓、指定日期后犯罪将无救恩，以及圣徒与列国在悔改时限上的对比。惟“因为义人悔改的期限已经到了”将ἡ μετάνοια τοῖς δικαίοις ἔχει τέλος（“义人的悔改有终点／限度”）提前译成该终点已经到达；原文紧接着才以“悔改的日子已经满了”作出该时限已满的陈述。应保留这两个表达的层次。
  naturalness: 整体庄重、通顺，符合现代书面普通话。“列国之人仍可悔改”可理解，但“仍”略增原文未明说的持续意味；改为“至于列国，悔改可直到末日”更简洁，并保留原文对列国／万民的概括称呼。
  terminology: “主宰”恰当地区分δεσπότης与本段其他处的κύριος；“荣耀”“选民”“救恩”“义人”“圣徒”“末日”均适合此段的宗教与末世语境。“列国”较好保留ἔθνη的开放指涉，无须限定为“外邦人”或“不信者”。
