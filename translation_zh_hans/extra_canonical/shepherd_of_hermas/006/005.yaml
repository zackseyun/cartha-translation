base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/005.yaml
  text: 'For the Master swore by his glory concerning his chosen ones: if, after this appointed day, sin should still occur, they have no salvation; for repentance has an end for the righteous. The days of repentance have been fulfilled for all the holy ones, but for the nations there is repentance until the last day.'
translation:
  language: zh_hans
  text: 因为主宰指着自己的荣耀，论到他的选民起誓说：“若在这指定的日子以后仍有犯罪的事，他们就没有救恩；因为义人的悔改是有期限的。所有圣徒悔改的日子都已满了；至于列国，悔改可直到末日。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεσπότης
  choice: 主宰
  rationale: 保留δεσπότης所含的权柄与主人身份，并与本段后文的Κύριος有所区分。
- source_word: κατὰ τῆς δόξης αὐτοῦ
  choice: 指着自己的荣耀
  rationale: 这是起誓用语；中文以“指着”自然表达凭某对象起誓，同时保留“荣耀”。
- source_word: ἐπὶ τοὺς ἐκλεκτοὺς αὐτοῦ
  choice: 论到他的选民
  rationale: ἐπί在此表示誓言所涉及的对象，而非起誓所凭借的对象。
- source_word: ἐὰν ὡρισμένης τῆς ἡμέρας ταύτης ἔτι ἁμάρτησις γένηται
  choice: 若在这指定的日子以后仍有犯罪的事
  rationale: 按属格独立结构理解为“这日子被定下之后”；用非人格表达保留原文“犯罪发生”的概括性。
- source_word: σωτηρίαν
  choice: 救恩
  rationale: 在末世与悔改语境中指最终的拯救；“救恩”兼具准确性与宗教文本的庄重语体。
- source_word: ἡ μετάνοια ... ἔχει τέλος
  choice: 悔改的期限已经到了
  rationale: 原义为“悔改有终点”；结合下一句“日子已满”，译为期限已到，避免误读为悔改已经完成。
- source_word: τοῖς δικαίοις
  choice: 义人
  rationale: 直译并保留作者对群体的道德—宗教称谓。
- source_word: τοῖς ἁγίοις
  choice: 圣徒
  rationale: 指分别为圣的信徒群体；采用现代中文基督教文本中通行且庄重的表达。
- source_word: τοῖς ... ἔθνεσιν
  choice: 列国之人
  rationale: 保留ἔθνη可指非信徒、外邦人或诸民族的语义张力，不径直限定为某一神学分类。
- source_word: ἕως ἐσχάτης ἡμέρας
  choice: 直到末日
  rationale: 简洁呈现末世性的最终日，同时符合现代中文宗教语体。
theological_decisions:
- issue: 选民或圣徒在指定日后犯罪便“没有救恩”的严厉断言
  choice: 按原文直接保留，不以注释性措辞缓和
  alternative: 译成“若持续犯罪而不悔改，就可能失去救恩”
  rationale: 原文没有“持续”“不悔改”或“可能”等限定；应保留其警告的绝对语气及与前文悔改应许之间的张力。
- issue: “义人悔改有终点”的含义
  choice: 译为“义人悔改的期限已经到了”
  alternative: 译为“义人的悔改已经结束”
  rationale: 后句明确谈到“悔改的日子”已经满了，焦点是获准悔改的时限，不宜暗示义人已经完成了悔改行为。
- issue: ἔθνη的群体身份
  choice: 译作“列国之人”
  alternative: 译作“外邦人”或“不信的人”
  rationale: “列国之人”保留原词的民族与宗教双重可能性，避免把文本的救恩群体边界解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文因果链条、起誓公式和末世警告的力度；引入直接引语标点以提升可读性，但不增添解释性内容。
