    rationale: ἐπαγγελίας指“各项应许”，而非直接指一切被应许的事物；保留“各项应许”更贴近原文。
  - severity: low
    issue: “并有极大的荣耀”未清楚呈现“伴随着极大的荣耀”的关系。
    rationale: μετὰ πολλῆς δόξης修饰领受应许的情形；以“伴随着”表达可保留其关系而不界定荣耀的归属。
