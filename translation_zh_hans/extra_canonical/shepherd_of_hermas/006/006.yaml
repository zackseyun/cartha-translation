base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/006.yaml
  text: Therefore you shall say to those who lead the church that they should set their ways straight in righteousness, so that they may receive the promises in full, with much glory.
translation:
  language: zh_hans
  text: 因此，你要告诉教会的带领者，叫他们在公义中修正自己的道路，好使他们能充分领受各项应许，伴随着极大的荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: 教会的领袖们
  rationale: 指在教会中居于带领地位的人；译作“领袖们”自然清楚，同时不限定具体职衔或治理制度。
- source_word: κατορθώσωνται τὰς ὁδοὺς αὐτῶν
  choice: 修直自己的道路
  rationale: 保留“使道路正直”的源语意象，也传达纠正生活行为的劝诫意味。
- source_word: ἐν δικαιοσύνῃ
  choice: 在公义中
  rationale: 贴近希腊文的范围或方式表达，不将其窄化为单纯的道德端正。
- source_word: ἀπολάβωσιν ἐκ πλήρους τὰς ἐπαγγελίας
  choice: 满得所应许的一切
  rationale: ἐκ πλήρους 表示完全、充分；复数“应许”在现代汉语中以“所应许的一切”表达更自然，并保留完整领受之意。
- source_word: μετὰ πολλῆς δόξης
  choice: 并有极大的荣耀
  rationale: μετά 在此可表示伴随情形；用“并有”维持其与领受应许相伴的关系，不强行判定荣耀的具体归属或方式。
theological_decisions:
- issue: “教会的领袖们”是否指特定圣职
  choice: 采用一般性的“教会的领袖们”
  alternative: 教会的监督／在教会中居首位的人
  rationale: 源语只说明他们具有带领地位，并未在本句指定某种后世制度化职衔，因此避免加入宗派性教制含义。
- issue: 应许与荣耀之间的关系
  choice: 译为“满得所应许的一切，并有极大的荣耀”
  alternative: “在极大的荣耀中满得各项应许”
  rationale: 希腊文可理解为领受应许时伴有荣耀；所选译法保留关联，同时避免过度解释荣耀究竟属于领受方式、结果还是末世处境。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留“修直道路”的圣经式意象。因本段无需文本异读或关键歧义说明，未设脚注。
