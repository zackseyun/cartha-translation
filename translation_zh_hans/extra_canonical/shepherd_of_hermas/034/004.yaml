base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/004.yaml
  text: '4. Therefore there are two fears: if you wish to do what is evil, fear the Lord and you will not do it; and if, on the other hand, you wish to do what is good, fear the Lord and you will do it. Thus the fear of the Lord is strong and great and glorious. So fear the Lord, and you will live to him; and all who fear him, among those who keep his commandments, will live to God.'
translation:
  language: zh_hans
  text: 4 因此，敬畏有两种：如果你想作恶，就要敬畏主，这样你便不会去作；如果你反过来想行善，也要敬畏主，这样你便会去行。这样，对主的敬畏是强大、伟大而荣耀的。所以，要敬畏主，你就会向他而活；凡敬畏他、遵守他诫命的人，也都将向上帝而活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向他而活”和“向上帝而活”也可译作“为他而活”和“为上帝而活”。
    reason: 希腊语与格αὐτῷ／τῷ Θεῷ所表达的关系可有不同理解；脚注保留这一真实歧义。
lexical_decisions:
- source_word: δισσοὶ ... οἱ φόβοι
  choice: 敬畏有两种作用
  rationale: 上下文并非指两个不同的敬畏对象，而是同一种对主的敬畏既使人离恶、又促人行善；如此表达可避免误解，同时保留其双重面向。
- source_word: τὸ πονηρὸν ἐργάσασθαι
  choice: 作恶
  rationale: 简洁自然地表达“行作邪恶之事”。
- source_word: τὸ ἀγαθὸν ἐργάσασθαι
  choice: 行善
  rationale: 以现代汉语常用搭配表达“行作良善之事”，并与“作恶”形成对照。
- source_word: ὁ φόβος τοῦ Κυρίου
  choice: 对主的敬畏
  rationale: φόβος在本段包含畏惧与敬畏的庄重含义；“敬畏”符合语境，也能与对魔鬼及其恶行的恐惧相区别。
- source_word: ἰσχυρός ... μέγας ... ἔνδοξος
  choice: 大有力量，既伟大又荣耀
  rationale: 分别保留三个并列形容词的语义和修辞力度。
- source_word: ζήσῃ αὐτῷ / ζήσονται τῷ Θεῷ
  choice: 向他而活／向上帝而活
  rationale: 保留希腊语与格可能表达的关系或归向含义，不径自解释成单纯“因他而活”或“在他里面活”。
theological_decisions:
- issue: 敬畏与行为之间的关系
  choice: 保留命令及其结果式陈述：“敬畏主……便不会作／便会行”
  alternative: 弱化为“敬畏主会帮助你不作恶、行善”
  rationale: 原文使用祈使语气及将来时，表达直接而有力；不应添加“帮助”等弱化措辞。
- issue: “向上帝而活”的范围
  choice: 译作“凡敬畏他、遵守他诫命的人”
  alternative: 译作“所有敬畏他的人，也就是遵守他诫命的人”
  rationale: 原文结构ὅσοι ... τῶν φυλασσόντων可理解为在遵守诫命者当中凡敬畏者；结合下一节的解释，两项条件紧密相连。正文采用自然汉语并列呈现，不强行判定其精细集合关系。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“作恶／行善”形成清楚对偶；保留原文反复出现的“敬畏主”，以维持训令式节奏。
