base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/002.yaml
  text: 2. But do not fear the devil; for by fearing the Lord you will gain mastery over the devil, because there is no power in him. In one in whom there is no power, there is no fear; but in one in whom there is glorious power, there is also fear. For everyone who has power has fear, but the one who has no power is despised by all.
translation:
  language: zh_hans
  text: 2 但不要惧怕魔鬼；因为你敬畏主，就必制伏魔鬼，因为他并没有能力。没有能力的，就不足为惧；但有显赫能力的，也令人畏惧。凡有能力的，都使人畏惧；没有能力的，却被众人轻视。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβηθῇς / φοβούμενος / φόβος
  choice: 惧怕／敬畏／畏惧
  rationale: 同一词根随对象调整中文表达：对魔鬼用“惧怕”，对主用带有尊崇意味的“敬畏”；一般论述中用“畏惧”，既保留原文反复，也使现代汉语自然。
- source_word: κατακυριεύσεις
  choice: 必制伏
  rationale: 该动词表示取得支配、制服；“制伏”准确表达胜过并掌控之意，又不额外引入属灵争战术语。
- source_word: δύναμις
  choice: 能力
  rationale: 保留原词“能力、力量”的宽泛含义，不具体化为权柄或武力。
- source_word: ἔνδοξος
  choice: 荣耀
  rationale: 按常见本义译作“荣耀”，保留原文“有荣耀的能力”这一略显张力的表述，不擅自解释为“强大”或“可畏”。
- source_word: καταφρονεῖται
  choice: 被众人轻视
  rationale: 准确传达被藐视、看不起的被动意义。
theological_decisions:
- issue: “魔鬼里面没有能力”的绝对表述
  choice: 直译为“他里面没有能力”
  alternative: “他对敬畏主的人没有能力”或“他没有真正的能力”
  rationale: 希腊文没有明说限制对象或限定能力种类；直译保留其强烈而有张力的断言，不以解释性措辞加以缓和。
- issue: 对主与对魔鬼的“怕”
  choice: 分别译作“敬畏主”和“惧怕魔鬼”
  alternative: 全部统一译作“害怕”或“畏惧”
  rationale: 原文刻意重复同一词根，但语用对象不同；中文采用不同搭配可传达对主的尊崇性敬畏与对魔鬼的恐惧，同时通过“畏惧”一词维持段落的语义联系。
- issue: 能力与畏惧之间的一般命题
  choice: 保留“凡有能力的，都使人畏惧”
  alternative: 解释为“凡有权柄的，都应受敬畏”
  rationale: 原文的 φόβον ἔχει 可指引起畏惧或受人敬畏；所选译法在中文中较通顺，并避免把 δύναμις 窄化为制度性权柄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。尽量保留原文围绕“惧怕／敬畏”和“能力”的反复及论证节奏；不添加原文未明说的条件。段首“2”对应作品分段。
