  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/005.yaml
  text: 5. “Why,” I said, “sir, did you say about those who keep his commandments, ‘They will live to God’?” “Because,” he said, “all creation fears the Lord, but it does not keep his commandments. Therefore the life of those who fear him and keep his commandments is with God; but for those who do not keep his commandments, there is not even life in them.”
translation:
  language: zh_hans
  text: 5. 我问：“先生，你为什么说那些遵守他诫命的人：‘他们必为上帝而活’呢？”他说：“因为一切受造之物都敬畏主，却不遵守他的诫命。因此，那些敬畏他、遵守他诫命的人，他们的生命是在上帝那里；至于那些不遵守他诫命的人，在他里面连生命也没有。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 此处是对异象中说话者的尊称；用“主啊”保留古代宗教文本的庄重语气及称谓可能具有的开放性，不具体化为“先生”。
- source_word: τηρούντων / φυλασσόντων
  choice: 遵守
  rationale: 两词在本段都指切实持守并实行诫命；汉语用“遵守”自然清楚，也与“诫命”形成惯常搭配。
- source_word: Ζήσονται τῷ Θεῷ
  choice: 他们必向上帝而活
  rationale: 保留希腊语与格 τῷ Θεῷ 的关系表达及其一定歧义，不径直解释成“为上帝而活”或“在上帝面前活着”。
- source_word: πᾶσα ἡ κτίσις
  choice: 一切受造之物
  rationale: κτίσις 在此指整个受造界；“一切受造之物”比单说“万物”更明确呈现其受造含义。
- source_word: ἡ ζωή ἐστι παρὰ τῷ Θεῷ
  choice: 他们的生命是在上帝那里
  rationale: παρά 加与格表达生命在上帝那里、与上帝同在的关系；直译可保留空间性与神学张力。
- source_word: οὐδὲ ζωὴ ἐν αὐτῷ
  choice: 在他里面连生命也没有
  rationale: 依现有希腊文本保留单数代词 αὐτῷ 的指向，不按英文咨询层改成复数“他们里面”。
theological_decisions:
- issue: “向上帝而活”的含义
  choice: 采用“向上帝而活”
  alternative: “为上帝而活”或“在上帝面前活着”
  rationale: 原文与格可承载方向、关系或利益等色彩；译文不把它限定为伦理上的“为上帝生活”。
- issue: 末句 αὐτῷ 的指代
  choice: 译作“在他里面”
  alternative: “在他们里面”或“在上帝里面”
  rationale: 希腊文本为阳性/中性单数与格代词，最自然可回指上帝；保留代词能避免过度阐释，同时忠于原文数与格。
- issue: 敬畏与遵命的关系
  choice: 按原文并列呈现，生命归于既敬畏又遵守诫命的人
  alternative: 将遵命解释为得生命的功德条件，或将其弱化为生命的外在证据
  rationale: 原文只作关系性陈述，未系统说明因果或功德机制，译文不引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留问答体和“敬畏—遵守—生命”的重复结构；“上帝”用于 Θεός，“主”用于 κύριος。本文无脚注，因此正文无脚注标记。
