revisions:
- from: 5. 我问：“主啊，你为什么论到那些遵守他诫命的人说：‘他们必向上帝而活’呢？”他说：“因为一切受造之物都敬畏主，却不遵守他的诫命。因此，那些敬畏他、遵守他诫命的人，他们的生命是在上帝那里；至于那些不遵守他诫命的人，在他里面连生命也没有。”
  to: 5. 我问：“先生，你为什么说那些遵守他诫命的人：‘他们必为上帝而活’呢？”他说：“因为一切受造之物都敬畏主，却不遵守他的诫命。因此，那些敬畏他、遵守他诫命的人，他们的生命是在上帝那里；至于那些不遵守他诫命的人，在他里面连生命也没有。”
  rationale: 修订仅处理称呼的语境意义及两处现代汉语表达。“先生”反映 κύριε 在本段对话中的礼貌称呼，不把人物身份神学化；“为上帝而活”取代不自然的“向上帝而活”。“在上帝那里”对应 παρὰ τῷ Θεῷ；末句保留“在他里面”以对应 ἐν αὐτῷ，避免把单数代词改释为“在他们里面”或明确为“在上帝里面”。无需脚注。
