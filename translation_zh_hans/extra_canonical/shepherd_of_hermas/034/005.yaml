    issue: “主啊”将 κύριε 的叙事性礼貌称呼具体化为神圣称号。
    rationale: 本句中说话者称呼异象中的对话对象；英语审校记录译为“sir”。译为“先生”既忠于称呼功能，也避免预设该对象就是神。
  - severity: medium
    issue: “他们必向上帝而活”不够自然。
    rationale: 该表达不是现代标准汉语的正常搭配。以“他们必为上帝而活”表达 ζήσονται τῷ Θεῷ 的关系性与面向性，读者可自然理解，且不将其扩展为特定的救恩理论。
  - severity: low
