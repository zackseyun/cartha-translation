base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/003.yaml
  text: 3. But fear the works of the devil, for they are evil. So, by fearing the Lord, you will fear the works of the devil, and you will not do them, but will keep away from them.
translation:
  language: zh_hans
  text: 3. 但要惧怕魔鬼的作为，因为这些作为是邪恶的。因此，因敬畏主，你会惧怕魔鬼的作为，不去行这些事，反而要远离它们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητι / φοβούμενος / φοβηθήσῃ
  choice: 惧怕／敬畏／惧怕
  rationale: 同一词根在本段有不同对象：对主采用现代汉语宗教语境中庄重且含尊崇意味的“敬畏”，对魔鬼的邪恶作为采用“惧怕”，保留原文反复运用“怕”这一概念的论证。
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: 魔鬼的作为
  rationale: ἔργα 指行为、活动或所行之事；“作为”自然且范围较宽，不把含义限缩为具体作品。
- source_word: πονηρά
  choice: 邪恶的
  rationale: 在伦理语境中表达道德上的恶，较“坏”庄重明确。
- source_word: οὐκ ἐργάσῃ αὐτά
  choice: 不去行那些事
  rationale: 保留 ἐργάζομαι 与前文 ἔργα 的词根呼应，同时用自然现代汉语表达。
- source_word: ἀφέξῃ ἀπ᾽ αὐτῶν
  choice: 会远离它们
  rationale: 表达克制自己、不接触或避开这些恶行的意思，不额外强化为彻底断绝等解释。
theological_decisions:
- issue: 对主与对魔鬼作为的“惧怕”之间的关系
  choice: 保留两者均由 φοβ- 词族表达，但以“敬畏主”和“惧怕魔鬼的作为”区分对象与语气
  alternative: 两处均译作“惧怕”，或将后一处释译为“警惕”
  rationale: 原文刻意重复同一词族，形成神学与伦理上的对照；中文若全译“惧怕”容易误解敬主仅为惊恐，若译“警惕”又会削弱原文词语呼应。
- issue: 是否把“魔鬼的作为”具体解释为罪
  choice: 不增译为“罪恶行为”或列举具体罪行
  alternative: 译作“魔鬼所行的罪恶”
  rationale: 原文只称这些作为是邪恶的，应保留其概括性，不代替作者作进一步界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法保留原文“命令—原因—结果—转折”的推进，并以“那些作为／那些事／它们”维持所指清楚。
