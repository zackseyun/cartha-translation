base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/001.yaml
  text: 1. “Fear,” he says, “the Lord, and keep his commandments. By keeping the commandments of God you will be powerful in every deed, and your conduct will be incomparable. For in fearing the Lord you will do everything well. This is the fear that you must have—and you will be saved.
translation:
  language: zh_hans
  text: 1. 他对我说：“要敬畏主，遵守他的诫命。你若遵守上帝的诫命，就会在一切所行的事上有能力，你的作为也将无可比拟。因为你敬畏主，凡事都会做得好。这才是你应当有的敬畏；这样，你就会得救。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβήθητι / φοβούμενος / φόβος
  choice: 敬畏
  rationale: 本段所说的是人面对主时应有、并引向顺服的畏惧；“敬畏”既保留“惧怕”的实质，也符合现代汉语的宗教语境。
- source_word: φύλασσε / φυλάσσων
  choice: 遵守
  rationale: 表达持续谨守诫命并付诸实行，不只是在心里记住。
- source_word: δυνατὸς
  choice: 有能力
  rationale: 保留该词关于能力、力量的直接含义，不把它窄化为“成功”或“刚强”。
- source_word: πρᾶξις
  choice: 作为
  rationale: 与前面的“所行的事”自然呼应，可涵盖行动与行为表现。
- source_word: ἀσύγκριτος
  choice: 无可比拟
  rationale: 直接传达“不能相比、无与伦比”的强烈判断，不擅自弱化为“无可指摘”。
- source_word: σωθήσῃ
  choice: 得救
  rationale: 保留其救助、拯救的神学分量及被动意义。
theological_decisions:
- issue: 敬畏、守诫命与得救之间的关系
  choice: 按原文保留“这样，你就会得救”的紧密衔接
  alternative: 解释为守诫命只是已经得救之人的表现，或解释为凭行为赚取救恩
  rationale: 希腊文本本身未在本句说明因果机制；译文不应替作者消解其中的神学张力。
- issue: 能力的范围
  choice: 译为“在一切所行的事上有能力”
  alternative: 译为“做任何事都能成功”
  rationale: 原文强调能力，却没有保证世俗意义上的成功，因此避免过度阐释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引语中的命令句简洁有力；以“这才是”体现 οὗτος δέ ἐστιν 的辨别和强调。
