base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/008.yaml
  text: “He does not sin,” he says; “but if someone remains by himself, he obtains for himself greater honor and great glory with the Lord; but if he also marries, he does not sin. Therefore keep purity and dignity, and you will live to God. These things that I speak to you and am about to speak, keep from now on, from the day you were entrusted to me, and I will dwell in your house. And for your former trespasses there will be forgiveness, if you keep my commandments; and there will also be forgiveness for all, if they keep these commandments of mine and walk in this purity.”
translation:
  language: zh_hans
  text: “不算犯罪，”他说，“但若有人保持独身，就为自己赢得在主面前更大的尊荣和极大的荣耀；若再婚，也不算犯罪。所以，你要持守纯洁和端庄，就必向着上帝而活。我现在对你所说和将要说的一切，你都要从现在起、自你被交托给我的那日起谨守；我要住在你家里。你若遵守我的诫命，你从前的过犯就必蒙赦免；所有人若遵守我这些诫命，并照这样的纯洁行事，也都必蒙赦免。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφ' ἑαυτῷ μείνῃ
  choice: 独身不再婚
  rationale: 本段讨论配偶去世后是否再婚；此处不是泛指独处，而是指丧偶后保持独身。
- source_word: τιμὴν καὶ μεγάλην δόξαν
  choice: 尊荣和极大的荣耀
  rationale: 分别保留 τιμή 与 δόξα 的语义，不将二者合并为一个抽象概念。
- source_word: πρὸς τὸν Κύριον
  choice: 主面前
  rationale: 表达这种尊荣与荣耀相对于主、在主面前所得的意义，同时避免暗示人凭行为获得救恩。
- source_word: ἁγνείαν καὶ σεμνότητα
  choice: 纯洁和端庄
  rationale: ἁγνεία 在上下文中涉及性与婚姻方面的纯洁；σεμνότης 指庄重、可敬的品格。
- source_word: ζήσῃ τῷ Θεῷ
  choice: 就必向着上帝而活
  rationale: 保留与格 τῷ Θεῷ 所表达的为上帝、归向上帝而活之取向，不弱化为单纯“活着”。
- source_word: παραπτώμασιν
  choice: 过犯
  rationale: 准确表达偏离正道、失足犯罪之意，并与后文“蒙赦免”自然搭配。
- source_word: πορευθῶσιν ἐν τῇ ἁγνότητι ταύτῃ
  choice: 照这样的纯洁行事
  rationale: πορεύομαι 在伦理语境中指生活行事；“照……行事”比字面“行走在……”更符合现代汉语。
theological_decisions:
- issue: 丧偶后再婚是否构成犯罪
  choice: 明确译为“即使再婚，也不算犯罪”
  alternative: 将独身表述为必须遵守的更高律法
  rationale: 原文两次明确说再婚“不犯罪”，同时称保持独身会得到更大尊荣；译文保留这种张力，不把劝勉改成禁令。
- issue: 遵守诫命与赦免的关系
  choice: 保留“若……就必蒙赦免”的条件句
  alternative: 改写为遵守诫命只是已经蒙赦免的证据
  rationale: 原文直接使用条件结构 ἐάν；译文不以任何后设教义体系消解其表面神学张力。
- issue: “被交托给我”所指的权柄关系
  choice: 保留被动表达，不明说交托者是谁
  alternative: 补译为“上帝把你交托给我”
  rationale: 原文未明示施事者，故保留其真实含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。对话引语保持连贯；“主”与“上帝”依原文 Κύριος 和 Θεός 分别翻译。此读者段对应希腊文自 Οὐχ ἁμαρτάνει 至本节末尾，未受前部规范化 OCR 缺损影响。
