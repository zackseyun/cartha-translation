base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/007.yaml
  text: “If a woman,” I say, “sir, or again some man, should fall asleep, and one of them marries, does the one who marries sin?”
translation:
  language: zh_hans
  text: “先生，”我说，“如果一个妇人，或一个男子，睡去[a]，另一方再婚，再婚的那人犯罪吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “睡去”是死亡的婉语。
    reason: 原文κοιμηθῇ字面为“睡去”，此处指死亡。
lexical_decisions:
- source_word: κοιμηθῇ
  choice: 睡去
  rationale: 保留希腊文以睡眠婉指死亡的表达，同时借脚注向现代读者说明。
- source_word: γαμήσῃ / ὁ γαμῶν
  choice: 再婚／再婚的人
  rationale: 上下文讨论配偶死亡后尚存者结婚；中文用“再婚”比单说“结婚”更清楚地表达该语境。
- source_word: τις ἐξ αὐτῶν
  choice: 他们中的一方
  rationale: 贴近原文“他们中的某一方”，不在正文中进一步改写为“尚存的一方”。
- source_word: μήτι ἁμαρτάνει
  choice: 算犯罪吗
  rationale: μήτι引出预期否定回答的疑问；“算犯罪吗”在现代汉语中自然，也保留对行为是否构成罪的判断。
theological_decisions:
- issue: 配偶死亡后的再婚是否被预设为犯罪
  choice: 以疑问形式保留说话者的询问，不在译文中先行裁定
  alternative: 译成带有明显预期答案的“难道……犯罪吗”
  rationale: μήτι虽可暗示预期否定答案，但本句的叙事功能仍是提出问题；用中性而自然的问句可避免过度强化语气，答案留待下文。
- issue: “睡去”所指的死亡
  choice: 正文保留死亡婉语，并以脚注释义
  alternative: 正文直译为“去世”或“死了”
  rationale: 这样既保存原文意象，也防止现代读者误解为普通睡眠。
translation_notes:
  register: 采用现代、庄重而易懂的对话体；保留“先生”作为对κύριε的称呼，并用插入语“我说”呈现原文叙事结构。
