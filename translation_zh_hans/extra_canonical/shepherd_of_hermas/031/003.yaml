base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/003.yaml
  text: “I heard,” I say, “sir, from certain teachers, that there is no other repentance except that one when we went down into the water and received forgiveness of our former sins.”
translation:
  language: zh_hans
  text: 我说：“先生，我听某些教师说，除了我们下到水里、领受了我们从前罪的赦免时的那一次悔改以外，再没有别的悔改了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 先生
  rationale: 此处是对异象中说话者的尊称，并非明确称呼上帝；译作“先生”可保留敬意而不预断身份。
- source_word: ἑτέρα μετάνοια
  choice: 别的悔改
  rationale: 直译其比较与排他意味；“悔改”兼顾内心转变和离罪归正的宗教含义。
- source_word: εἰς ὕδωρ κατέβημεν
  choice: 我们下到水里
  rationale: 保留原文具体的入水动作及其洗礼语境，不泛化为“受洗”。
- source_word: ἐλάβομεν ἄφεσιν ἁμαρτιῶν ἡμῶν τῶν προτέρων
  choice: 领受从前所犯之罪得赦免
  rationale: “领受”对应ἐλάβομεν；以自然汉语表达赦罪，同时保留“从前”对既往罪行的限定。
theological_decisions:
- issue: 入水与洗礼的关系
  choice: 保留“下到水里”的原始意象
  alternative: 译作“受洗”
  rationale: 上下文显然涉及洗礼，但原文采用具体动作而非洗礼术语；不应在正文中把暗示改成明说。
- issue: “没有别的悔改”的范围
  choice: 照原文保留绝对式引述
  alternative: 解释为“洗礼后再无悔改机会”
  rationale: 本句是在转述某些教师的说法，其意义将由后文回应展开；译文不提前裁定其教义范围。
- issue: 赦免与悔改的关系
  choice: 维持两者在句中的并列关联而不加解释
  alternative: 补明悔改必然导致赦免或洗礼本身施行赦免
  rationale: 原文只陈述入水并领受赦免的事件，不明确说明因果机制。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事对话体；保留原文重复的“我说”框架，并避免使用可能预设神学身份的“主啊”。
