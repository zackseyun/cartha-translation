  text: He says to me, “You heard well; for so it is. For the one who has received forgiveness—”
translation:
  language: zh_hans
  text: 他对我说：“你听得没错，事实正是如此。因为那已经蒙赦免的人——”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καλῶς ἤκουσας
  choice: 你听得没错
  rationale: 直译为“你听得好/正确”；现代汉语用“听得没错”自然表达对所听教导的确认。
- source_word: οὕτω γὰρ ἔχει
  choice: 事实正是如此
  rationale: 该惯用语意为“事情就是这样”，此译庄重而自然，并保留γὰρ的说明语气。
- source_word: τὸν εἰληφότα ἄφεσιν
  choice: 那已经蒙赦免的人
  rationale: εἰληφότα是“已经领受”的完成时分词；ἄφεσιν在上下文中指罪得赦免，以“蒙赦免”简洁传达其被动受惠含义。
theological_decisions:
- issue: 赦免与洗礼语境的关系
  choice: 仅译作“已经蒙赦免的人”，不在正文补入“借着洗礼”等解释
  alternative: 译作“那已经在洗礼中蒙赦免的人”
  rationale: 前文虽明确提到下到水中并得赦免，但本句现存措辞本身只说领受赦免；不把上下文推论写进正文，以免消除原文表达的开放性。
- issue: 残缺句的处理
  choice: 以破折号保留未完句
  alternative: 根据后续传统文本补全句子
  rationale: 所提供的希腊文在ἄφεσ之后即出现文本断裂，而指定英文审校层也保留未完句；不凭未提供的证据擅自补文。
translation_notes:
  register: 采用现代、清楚而庄重的叙事对话体。“他对我说”保留《牧人书》问答叙事的结构；句末破折号明确表示本读者分段在句中截断，而非完整句意。
