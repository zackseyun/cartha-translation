base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/009.yaml
  text: I came near it, and that huge sea monster stretched itself out on the ground and did nothing except thrust out its tongue; it did not move at all until I had passed by it.
translation:
  language: zh_hans
  text: 我走近它，那头庞大的海兽便伏身在地，只伸出舌头；直到我从它旁边走过，它始终一动不动。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ τηλικοῦτο κῆτος
  choice: 那头庞大的海兽
  rationale: κῆτος指体形巨大的海中怪兽或巨兽；结合上文的比喻性描述，译作“海兽”既保留其怪兽意象，也避免把它限定为现代分类中的“鲸”。τηλικοῦτο译为“庞大的”。
- source_word: ἐκτείνει ἑαυτὸ χαμαί
  choice: 伏身在地
  rationale: 原文直义为“把自己伸展在地上”；“伏身在地”自然呈现巨兽贴地展开身体的动作，不额外解释其姿势或意图。
- source_word: τὴν γλῶσσαν προέβαλλεν
  choice: 伸出舌头
  rationale: 直接对应“把舌头伸出来”，保持动作描写简洁。
- source_word: ὅλως οὐκ ἐκινήθη
  choice: 始终一动不动
  rationale: ὅλως强化完全不动；汉语“一动不动”准确自然，“始终”与后面的时间界限相呼应。
- source_word: μέχρις ὅτου παρῆλθον αὐτό
  choice: 直到我从它旁边走过
  rationale: παρέρχομαι在此表示从该兽旁经过；“从它旁边走过”比单纯“越过它”更符合场景，也不暗示从其身体上跨过。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。希腊文在“我走近”及海兽动作处使用生动的历史现在时，中文以连贯叙事表达，不强行复制时态转换；同时不对海兽的象征意义作解释。
