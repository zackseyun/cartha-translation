base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/001.yaml
  text: The vision that I saw, brothers, came twenty days after the former vision; it was as a pattern of the tribulation that is coming.
translation:
  language: zh_hans
  text: 弟兄们，我在上一次异象之后二十天所看见的这个异象，是那将要临到的患难的预表。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “预表”译自原文τύπος，指以某种对应的形式预先呈现将要临到的患难；不只是一般意义上的征兆。
    reason: 说明τύπος的预示性和对应性含义，避免将“预表”理解为对患难性质或时间的特定教义性界定。
lexical_decisions:
- source_word: τύπον
  choice: 预象
  rationale: 这里指预先呈现某一将来现实的形象或范型；“预象”既保留这种对应关系，也避免把它弱化为一般性的“征兆”。
- source_word: θλίψεως
  choice: 患难
  rationale: 该词表示压迫、困苦或磨难；“患难”符合早期基督教语境，同时不擅自限定为某套末世论中的专名“大灾难”。
- source_word: ἐπερχομένης
  choice: 将要临到的
  rationale: 保留现在分词所表达的逼近、来临之意，语气自然，并不额外规定患难发生的具体时间。
- source_word: τῆς προτέρας ὁράσεως
  choice: 上一个异象
  rationale: προτέρα在此指先前的那一次异象；现代汉语用“上一个”比直译“先前的”更顺畅明确。
theological_decisions:
- issue: “将要临到的患难”是否应译成特定末世术语
  choice: 将要临到的患难
  alternative: 将来的大灾难
  rationale: 原文有定冠词，但没有等同于专名“大灾难”的充分词汇依据；采用普通而庄重的表达，以保留其可能指历史性或末世性患难的开放性。
- issue: τύπος所表达的异象与患难之间的关系
  choice: 预象
  alternative: 象征／预兆
  rationale: “预象”保留异象作为未来患难之对应形态或范型的意味，不把关系单纯解释成任意象征，也不只理解为预告事件的征兆。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。原文以关系代词开头，形式上承接“异象”；中文补出“这个异象”，使句子完整自然，同时未添加原文没有的事件内容。
