  text: 'The beast had four colors on its head: black, then fiery and blood-red, then golden, then white.'
translation:
  language: zh_hans
  text: 那兽头上有四种颜色：黑色，接着是火红和血红色，再接着是金色，最后是白色。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: 兽
  rationale: 指异象中的巨大可怖生物；“兽”简洁自然，也保留原文未进一步界定其种类的特点。
- source_word: χρώματα τέσσαρα
  choice: 四种颜色
  rationale: 直接对应原文，符合现代汉语表达。
- source_word: πυροειδὲς καὶ αἱματῶδες
  choice: 火红和血红色
  rationale: 分别呈现“如火的”与“带血色的”两个并列色彩描述，不将二者合并为一种颜色。
- source_word: χρυσοῦν
  choice: 金色
  rationale: 在颜色序列中自然表达“金的、金色的”。
- source_word: λευκόν
  choice: 白色
  rationale: 准确对应原文的白色。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留原文四项颜色的排列，并以“接着……再接着……最后……”清楚传达 εἶτα 的顺序关系；不添加原文此句未说明的象征解释。
