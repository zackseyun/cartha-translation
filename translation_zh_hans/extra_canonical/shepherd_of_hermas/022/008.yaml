base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/008.yaml
  text: So then, brothers, having put on the faith of the Lord and having remembered the mighty deeds that he had taught me, I took courage and gave myself over to the beast. Now the beast was coming with such a roar that it could destroy a city.
translation:
  language: zh_hans
  text: 因此，弟兄们，我披戴了对主的信心〔a〕，又记起他所教导我的那些大事，就鼓起勇气，把自己交给那兽。那兽正轰鸣着逼近，声势之大，足以毁灭一座城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδυσάμενος
  choice: 披上了
  rationale: 保留原文“穿上、披戴”的鲜明隐喻，而不弱化为一般的“怀着”。
- source_word: τὴν πίστιν τοῦ Κυρίου
  choice: 对主的信心
  rationale: 属格在此可有多种理解；结合主体赫马的行动，译作“对主的信心”最自然，同时避免扩展为特定教义表述。
- source_word: μεγαλείων
  choice: 伟大之事
  rationale: 该词指宏伟、奇妙或大能之事；译文保留一定宽度，不具体限定为“神迹”或“伟业”。
- source_word: ἐμαυτὸν ἔδωκα
  choice: 迎向
  rationale: 字面为“把自己交给”；在此语境指赫马鼓起勇气面对并走向那兽。“迎向”自然表达主动面对，又不误导为向兽投降。
- source_word: ῥοίζῳ
  choice: 呼啸之声
  rationale: 该词表示疾速运动所发的呼啸、轰鸣声；结合巨兽逼近的场景，用“呼啸之声”传达听觉与威势。
- source_word: λυμᾶναι
  choice: 毁坏
  rationale: 原词可指摧毁、蹂躏或严重损害；“毁坏一座城”准确而自然。
theological_decisions:
- issue: πίστις τοῦ Κυρίου 的属格关系
  choice: 对主的信心
  alternative: 主的信实／主所赐的信心
  rationale: 希腊文属格本身可能容许不同关系，但上下文强调赫马凭信心壮胆行动，因此采用客体属格的自然读法；不在正文中加入原文未明说的“所赐”。
- issue: μεγαλείων 所指为何
  choice: 他教导我的那些伟大之事
  alternative: 他向我显明的大能作为
  rationale: 原文说“教导”，且没有在本句明确限定为神迹；保留概括性，以免把异象中的教导窄化为某类神迹。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“披上了对主的信心”保留早期基督教文本的衣着隐喻；后半句以“来势汹汹，呼啸之声大得……”重现巨兽逼近的动态与压迫感。
