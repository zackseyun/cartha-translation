revisions:
- from: 所以，弟兄们，我披上了对主的信心，又想起他教导我的那些伟大之事，便鼓起勇气，迎向那兽。那兽来势汹汹，呼啸之声大得足以毁坏一座城。
  to: 因此，弟兄们，我披戴了对主的信心〔a〕，又记起他所教导我的那些大事，就鼓起勇气，把自己交给那兽。那兽正轰鸣着逼近，声势之大，足以毁灭一座城。
  rationale: 修订恢复了“把自己交给那兽”这一原文表达的力度，同时以“轰鸣着逼近”自然呈现巨兽的ῥοίζος。脚注处理“主的信心”的属格歧义，避免将正文锁定为单一神学解释。
