  to: 于是，弟兄们，我独自行走时，恳求主成全他借着自己的圣教会向我显明的那些启示和异象，好使他使我刚强，并赐悔改给他那些跌倒的仆人，使他伟大而荣耀的名得荣耀；因为他认为我配得看见他的奇事。
  rationale: 修订补出原文的呼语“弟兄们”，并使末句明确表达“认为我配得看见”的句法关系；同时作了不改变意义的现代汉语润色。保留“借着自己的圣教会”“赐悔改”“成全”等译法，以维持原文的媒介、施予及完成之意。
