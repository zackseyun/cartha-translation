    issue: 漏译ἀδελφοί。
    rationale: 该词是叙述者对读者的直接呼语，希腊原文在本节明确出现；即使英语审计文本省略，也应依原文补出。
  - severity: low
    issue: “他看我配得，让我看见他的奇事”对不定式关系表达不够明确。
    rationale: τοῦ δεῖξαί μοι τὰ θαυμάσια αὐτοῦ说明被看为配得的是“看见他的奇事”；译为“认为我配得看见他的奇事”更清楚。
  - severity: low
    issue: 个别搭配不够自然。
    rationale: “坚固我”和“他那些跌倒了的仆人”可分别调整为“使我刚强”和“他那些跌倒的仆人”，不增添神学解释。
