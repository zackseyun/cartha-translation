base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/003.yaml
  text: So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions that he had shown me through his holy Church, so that he would strengthen me and give repentance to his servants who have stumbled, in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders.
translation:
  language: zh_hans
  text: 于是，弟兄们，我独自行走时，恳求主成全他借着自己的圣教会向我显明的那些启示和异象，好使他使我刚强，并赐悔改给他那些跌倒的仆人，使他伟大而荣耀的名得荣耀；因为他认为我配得看见他的奇事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιῶ
  choice: 恳求
  rationale: 此处表示向主郑重祈求；“恳求”自然传达持续而迫切的请求。
- source_word: τελειώσῃ
  choice: 成全
  rationale: 保留“使之达到完成、圆满实现”的含义，也维持这些启示和异象尚待完成的语意。
- source_word: διὰ τῆς ἁγίας Ἐκκλησίας αὐτοῦ
  choice: 借着自己的圣教会
  rationale: διά加属格表达媒介；“自己的”明确αὐτοῦ回指主，同时不额外解释教会在异象中的身份。
- source_word: μετάνοιαν
  choice: 悔改
  rationale: 采用早期基督教语境中通行且准确的术语，兼含心意转变与行为回转。
- source_word: ἐσκανδαλισμένοις
  choice: 跌倒了的
  rationale: 该词可指被绊倒、陷入罪或信仰受挫；“跌倒了”保留其比喻张力，不把原因或程度说死。
- source_word: τὰ θαυμάσια αὐτοῦ
  choice: 他的奇事
  rationale: 指上帝令人惊异的作为或所显之事；“奇事”庄重简洁，避免限定为神迹。
theological_decisions:
- issue: 悔改是由主赐下还是由仆人自行产生
  choice: 赐悔改给他那些跌倒了的仆人
  alternative: 使他那些跌倒了的仆人悔改
  rationale: 原文δῷ τὴν μετάνοιαν明确以主为赐予者，直译能保留恩赐与人的回应之间的神学张力。
- issue: 启示和异象与圣教会的关系
  choice: 他借着自己的圣教会向我显明
  alternative: 他向我显明有关圣教会的启示和异象
  rationale: 依照现有希腊文本，διά加属格通常表示媒介，因此译作“借着”；不依据上下文擅自改成“有关教会”。
- issue: “配得”的主体判断
  choice: 他看我配得
  alternative: 他使我配得
  rationale: ἄξιον ἡγήσατο意为“认为/看作配得”，并未直接说“使之配得”，故保留原文判断性表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原句较长的祷告结构及连续目的从句，但以现代汉语连接词分层，使逻辑清楚。
