base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/004.yaml
  text: 'And while I was glorifying and giving thanks to him, something like the sound of a voice answered me: “Do not be double-minded, Hermas.” I began to reason within myself and say, “What do I have to be double-minded about, being so firmly established by the Lord and having seen glorious things?”'
translation:
  language: zh_hans
  text: 我正颂赞他、感谢他时，仿佛有声音响起，回应我说：“赫尔马斯，不要心怀二意。”我便开始在心里思量，说：“我既被主奠立得如此稳固，又见过荣耀的事，还有什么可心怀二意的呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζοντός μου
  choice: 我正荣耀他
  rationale: 保留“归荣耀于”的宗教语义，并以现代汉语可理解的表达呈现。
- source_word: εὐχαριστοῦντος αὐτῷ
  choice: 感谢他
  rationale: 直接对应向主献上感谢的动作。
- source_word: ὡς ἦχος φωνῆς
  choice: 仿佛有一个声音
  rationale: 保留ὡς所表达的近似和异象经验中的不确定感，不把声音来源具体化。
- source_word: ἀπεκρίθη
  choice: 回应我说
  rationale: 体现声音针对黑马的赞美与感谢作出回应；补出“说”使引语自然。
- source_word: Μὴ διψυχήσεις
  choice: 不要心怀二意
  rationale: διψυχέω可指内心摇摆、疑惑或三心二意；“心怀二意”较贴近其字面意象，也保留属灵与心理层面的张力。
- source_word: ἐν ἐμαυτῷ ἠρξάμην διαλογίζεσθαι
  choice: 我便在心里思量
  rationale: 以自然汉语表达内在推想和自我对话。
- source_word: τεθεμελιωμένος ὑπὸ τοῦ Κυρίου
  choice: 蒙主这样坚固
  rationale: 原词有奠基、立稳之意；译文保留被主确立稳固的被动含义，同时避免生硬的建筑隐喻。
- source_word: ἔνδοξα πράγματα
  choice: 荣耀的事
  rationale: 保持概括性，不擅自将所见限定为神迹、异象或启示。
theological_decisions:
- issue: διψυχέω的含义
  choice: 心怀二意
  alternative: 疑惑／动摇
  rationale: “心怀二意”保留词语所含的内在分裂意象，而上下文中的疑惑和动摇仍可由读者体会，不将其窄化为单纯认知上的怀疑。
- issue: 声音的身份
  choice: 仿佛有一个声音
  alternative: 有声音／主的声音
  rationale: 原文只说“仿佛声音的声响”，没有明确说是主亲自发声，因此不补入声音的身份。
- issue: 主的坚固行动
  choice: 蒙主这样坚固
  alternative: 被主这样奠定根基
  rationale: 保留神为行动者和黑马被动领受坚固的关系，但采用现代中文较自然的措辞。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留异象叙述中“仿佛”的含混性，并用“心怀二意”维持关键词的重复及其神学张力。人名Ἑρμᾶ按通行音译作“黑马”。
