base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/006.yaml
  text: As the dust grew greater and greater, I supposed it was something divine. The sun shone out a little, and behold, I see a very great beast, like some sea monster, and from its mouth fiery locusts were coming out. The beast was about a hundred feet in length, and its head was like a jar.
translation:
  language: zh_hans
  text: 尘土越来越浓、越来越大，我便猜想那是某种神异之事。太阳微微露出光来；看哪，我看见一头极其庞大的兽，仿佛某种海怪，口中不断有火焰般的蝗虫出来。那兽约有一百尺长，头却像一片瓦。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像一片瓦”：希腊文κεράμου指陶土制品，通常可指瓦；也有人理解为某种陶制器物。英语《人民开放圣经》作“像一只罐子”。
    reason: 现存希腊文本的比喻突兀且词义范围存在讨论；脚注说明而不以英语译文取代希腊文的直接语义。
  - marker: b
    text: “一百尺”：原文为约一百个古代“脚”（feet）的长度单位。
    reason: 澄清“尺”在这里是对希腊长度单位πούς的惯用对应，不指中国传统市尺，也不作不必要的现代精确换算。
lexical_decisions:
- source_word: τι θεῖον
  choice: 某种神异的事
  rationale: 保留希腊文“某种属神或超自然之物”的宽泛含义，不把它明确解释为神亲自显现。
- source_word: κῆτός τι
  choice: 某种海怪
  rationale: κῆτος可指巨大的海中生物或海怪；此处为比喻，译作“海怪”既自然，也保留异象中的骇人形象。
- source_word: ἀκρίδες πύριναι
  choice: 火蝗虫
  rationale: 直译其复合意象，保留这些蝗虫本身如火或带火的歧义。
- source_word: ποδῶν ἑκατόν
  choice: 一百尺
  rationale: ποῦς是古代长度单位“脚/尺”；用“尺”表达原文计量方式，并避免换算成现代公制所带来的虚假精确。
- source_word: κεράμου
  choice: 一片瓦
  rationale: κέραμος通常指陶土制品，尤其是瓦片；本句说兽的头“像瓦”，虽形象突兀，却是现有希腊文本的直接语义，不随英语咨询文本改作“罐子”。
theological_decisions:
- issue: 异象是否明确来自神
  choice: 译作“某种神异的事”
  alternative: “某种神圣之物”或“神所显的事”
  rationale: 原文τι θεῖον只表达赫马对其超自然性质的推想，并未明确断定来源或解释其神学意义。
- issue: 火蝗虫意象的性质
  choice: 不解释为审判、邪灵或具体末世象征
  alternative: 在正文中释义其象征意义
  rationale: 本节只叙述异象，解释出现在后文；译文应保留叙事张力，不预先解决象征含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留异象叙述的骤然显现感；“不断……涌出”体现未完成时所描写的持续动作。
