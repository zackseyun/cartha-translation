  source_fidelity: 草稿总体忠实呈现异象的递进、巨兽的比喻及其尺寸。“一片瓦”保留了κεράμου在现存希腊文本中突兀而不确定的陶土制品意象，这是可取的；但“尘土越来越大”把尘土说成体积变大，不够准确传达κονιορτοῦ γινομένου μείζονος καὶ μείζονος所指尘土（或尘云）愈发浓重、扩大的景象。
  naturalness: “尘土越来越浓、越来越大”在现代汉语中自然，也兼顾可见尘云的扩展。“火蝗虫”容易被理解为一种固定名称或普通复合名词；“火焰般的蝗虫”更清楚地保留πύριναι的描写性。
  terminology: “某种神异之事”适切保留τι θεῖον的非特指性，未擅自断定其为神的显现。“海怪”可对应κῆτός τι。长度保留为“约一百尺”，并在注中说明此“尺”对应古代的foot计量，避免与现代中国市尺混同。
