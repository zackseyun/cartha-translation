  to: 尘土越来越浓、越来越大，我便猜想那是某种神异之事。太阳微微露出光来；看哪，我看见一头极其庞大的兽，仿佛某种海怪，口中不断有火焰般的蝗虫出来。那兽约有一百尺长，头却像一片瓦。[a][b]
