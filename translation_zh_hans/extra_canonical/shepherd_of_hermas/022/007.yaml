base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/007.yaml
  text: 'I began to weep and to ask the Lord that he would deliver me from it. And I remembered the word that I had heard: “Do not be double-minded, Hermas.”'
translation:
  language: zh_hans
  text: 我便哭起来，求主救我脱离它。随后我想起曾听见的那句话：“赫尔马，不要疑惑动摇。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτᾶν
  choice: 求
  rationale: 此处是向主恳求搭救；现代汉语用“求”自然、庄重，也准确表达语境中的请求。
- source_word: λυτρώσηται
  choice: 救……脱离
  rationale: 该词在这里指从猛兽的威胁下解救出来；“救我脱离它”保留解救含义和介词结构。
- source_word: διψυχήσεις
  choice: 心怀二意
  rationale: δίψυχος相关词语本义涉及“两心”或内心摇摆；“心怀二意”既保留这一意象，也能表达面对威胁时信心动摇、犹疑不定的含义，而不将其缩窄为单纯的“怀疑”。
theological_decisions:
- issue: μὴ διψυχήσεις所指的属灵状态
  choice: 不要心怀二意
  alternative: 不要疑惑／不要三心二意
  rationale: 原词可涵盖怀疑、犹疑和内心分裂。“心怀二意”保留其神学张力，不把劝诫仅解释为理智上的疑问，也比“三心二意”更贴近“两心”的源语构词。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“我便哭起来”承接前文突发的危险；引语简洁有力。专名Ἑρμᾶ译作通行形式“赫尔马”。
