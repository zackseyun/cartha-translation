base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/002.yaml
  text: I was going into the countryside by the Campanian road. It is about ten stadia from the public road, and the place is easy to travel.
translation:
  language: zh_hans
  text: 我沿着坎帕尼亚大道往乡间去。那地方离公路约有十斯塔迪亚[a]，路很好走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “斯塔迪亚”是古代长度单位；十斯塔迪亚约合1.8公里，具体长度因地区和时代略有差异。
    reason: 现代读者通常不熟悉该古代计量单位，正文保留原单位，脚注提供约略换算。
lexical_decisions:
- source_word: ἀγρός
  choice: 乡间
  rationale: 此处指城外的田野地区；译作“乡间”符合现代汉语叙事，也不把它限定为某一块田地。
- source_word: ὁδὸς ἡ Καμπανή
  choice: 坎帕尼亚大道
  rationale: 保留道路的专名，并以“大道”表达其作为路线的性质。
- source_word: ὁδὸς δημοσία
  choice: 公路
  rationale: 指公共干道；“公路”自然简洁，并与前述专名道路相区分。
- source_word: στάδια δέκα
  choice: 十斯塔迪亚
  rationale: 保留古代长度单位，避免用不确定的现代数值取代原文。
- source_word: ῥᾳδίως δὲ ὁδεύεται ὁ τόπος
  choice: 路很好走
  rationale: 按希腊语非人称表达的实际意义自然转述，表示通往该地的路容易行走。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“往乡间去”贴近未完成时所描写的行程背景；句式简洁，适合普通读者。
