base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/005.yaml
  text: I went on a little, brothers, and behold, I see dust rising as if to the sky, and I began to say within myself, “Perhaps cattle are coming and stirring up dust?” For it was about a stadion away from me.
translation:
  language: zh_hans
  text: 弟兄们，我又往前走了一小段。看哪，我看见尘土扬起，仿佛高及天空。我心里想：“莫非是牲畜过来，扬起了尘土？”因为它离我约有一斯塔狄昂[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “斯塔狄昂”是古代长度单位，此处约合185米；实际长度因地区和时代而异。
    reason: 现代读者通常不熟悉该计量单位；注释提供大致距离，同时保留历史语境及单位的不确定性。
lexical_decisions:
- source_word: προσέβην μικρόν
  choice: 又往前走了一小段
  rationale: 按语境表达继续前行少许；“又”承接前文在路上行走，现代汉语自然。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留叙述者对共同体听众的直接称呼，不扩展为未由原文明确表达的双性称谓。
- source_word: ἰδοὺ βλέπω
  choice: 看哪，我看见
  rationale: 保留ἰδού的突现和引人注意功能，也保留历史叙事中生动的现在时βλέπω。
- source_word: κονιορτὸν ὡς εἰς τὸν οὐρανόν
  choice: 尘土扬起，仿佛直冲天空
  rationale: 原文省略明确的运动动词，中文补出“扬起”以传达可见景象；“仿佛直冲天空”保留夸张性的ὡς。
- source_word: λέγειν ἐν ἑαυτῷ
  choice: 心里想
  rationale: 这是现代汉语表达内心自语的自然说法，内容仍以直接引语呈现。
- source_word: κτήνη
  choice: 牲畜
  rationale: 该词可泛指家畜或役畜；此处扬尘而来的动物群并未具体说明种类，因此采用宽泛译词。
- source_word: στάδιον
  choice: 斯塔狄昂
  rationale: 保留古代希腊长度单位，并用脚注给出大致现代换算，避免正文制造虚假的精确度。
