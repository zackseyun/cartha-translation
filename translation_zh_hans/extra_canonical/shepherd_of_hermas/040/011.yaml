  text: 11. “Hear now,” he says, “about the spirit that is earthly and empty and has no power, but is foolish.
translation:
  language: zh_hans
  text: 11. 他说：“现在，你要听听那属地、空虚、没有能力、而且愚昧的灵是怎样的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίγειος
  choice: 属地
  rationale: 保留与后文“从上头来的”之灵的空间和神学对照，也符合现代中文宗教语境。
- source_word: κενός
  choice: 空虚
  rationale: 表达该灵内在空洞、毫无实质的含义，并与上下文反复出现的“空”意象相呼应。
- source_word: δύναμιν μὴ ἔχοντος
  choice: 没有能力
  rationale: 直译其缺乏能力或权能的陈述，不额外限定能力的性质。
- source_word: μωρός
  choice: 愚昧
  rationale: 较“愚蠢”庄重，也准确表达道德与属灵判断上的无知。
theological_decisions:
- issue: “灵”的性质
  choice: 保留“属地、空虚、没有能力、愚昧”四重描述
  alternative: 概括为“邪灵”或“假预言的灵”
  rationale: 原文没有在本句直接使用“邪灵”，故不以解释性标签取代作者刻意并列的描述，以保留其修辞和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；以“请听”自然呈现命令语气，并保留引语中的“他说”。
