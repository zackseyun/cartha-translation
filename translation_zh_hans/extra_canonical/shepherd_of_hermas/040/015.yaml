base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/015.yaml
  text: 19. “How,” I say, “sir, can these things be? For you have said both these things are impossible.” “As these, then, are impossible, so also the spirits that are earthly are impossible and inert.
translation:
  language: zh_hans
  text: 19 我说：“主啊，这些事怎么可能发生呢？因为你说这两件事都是不可能的。”他说：“正如这些事不可能发生，那些属地的灵也同样无能而不起作用[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不可能”和“无能”译自同一个希腊词；这个词既可指某事不可能，也可指某者没有能力。
    reason: 保留原文以同词连接“两件不可能的事”和“属地之灵无能”的修辞关系，同时避免中文正文产生“这些灵不存在”的歧义。
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 在《黑马牧人》的对话语境中，这是对启示者的尊称；译作“主啊”既保留呼格语气，也与全书现有称谓协调。
- source_word: ἀδύνατα / ἀδύνατά
  choice: 不可能的／无能为力
  rationale: 同一希腊词在前句描述事情“不可能”，后句描述属地之灵“无能、无力”；按各自句法自然表达，同时以脚注保留原文的反复与双关。
- source_word: τὰ πνεύματα τὰ ἐπίγεια
  choice: 那些属地的灵
  rationale: 直译 ἐπίγεια 的空间及性质含义，不擅自把它解释为“邪灵”或其他特定类别。
- source_word: ἀδρανῆ
  choice: 毫无作用
  rationale: 该词指不活动、不起效力；此处与“无能为力”并列，译为“毫无作用”自然且避免重复。
theological_decisions:
- issue: “属地的灵”的性质
  choice: 保留为“属地的灵”
  alternative: 邪灵／世俗的灵
  rationale: 原文只称其为 ἐπίγεια（属地的），上下文虽作负面评价，却没有在本句直接称其为邪灵；保留原有神学张力。
- issue: ἀδύνατος 的语义反复
  choice: 正文依语境分别译为“不可能”和“无能为力”，并加脚注说明
  alternative: 两处都译为“不可能”
  rationale: 中文若说“灵是不可能的”容易被误解为其不存在；语境实际强调属地之灵无力、无效，但原文修辞上的同词反复仍应向读者交代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“主啊”保留古代宗教文本的尊称语感；句式尽量简洁，并以“怎样……也同样……”呈现原文类比结构。
