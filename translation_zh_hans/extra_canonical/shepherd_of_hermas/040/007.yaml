  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/007.yaml
  text: 7. “How then,” I say, “sir, will a person know which of them is a prophet and which is a false prophet?” “Listen,” he says, “about both prophets; and in the way I am about to tell you, so you shall test the prophet and the false prophet. Test the man who has the divine spirit by his life.
translation:
  language: zh_hans
  text: 7. 我问：“那么，先生，人怎样才能知道他们中谁是先知，谁是假先知呢？”他说：“你要听我讲讲这两种先知；我将要怎样告诉你，你就怎样察验先知和假先知。要从那有神圣之灵的人的生活来察验他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 先生
  rationale: 此处是赫马对训导者的尊称；译作“先生”自然庄重，也避免在上下文中误作直接称呼主神。
- source_word: δοκιμάσεις / δοκίμαζε
  choice: 察验
  rationale: 既表达观察辨别，也保留检验真伪的含义，适合先知辨识的语境。
- source_word: ἀπὸ τῆς ζωῆς
  choice: 根据一个人的生活
  rationale: ζωή在此指可观察的生活和品行；“根据……生活”忠实保留判断依据。
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: 神圣之灵
  rationale: 保留形容词θεῖον的表达，不径自统一为专名“圣灵”，以免消除原文措辞上的区别。
- source_word: ἀμφοτέρων τῶν προφητῶν
  choice: 这两种先知
  rationale: 上下文所指为真先知与假先知两类；中文如此表达比字面的“两位先知”更准确。
theological_decisions:
- issue: “神圣之灵”是否应直接译为“圣灵”
  choice: 神圣之灵
  alternative: 圣灵
  rationale: 原文此处为τὸ πνεῦμα τὸ θεῖον，而非固定形式τὸ πνεῦμα τὸ ἅγιον；保留措辞差异及其可能的神学张力。
- issue: 辨别先知的依据
  choice: 根据一个人的生活来察验
  alternative: 凭他的生命来试验
  rationale: 原文明确以ζωή为检验依据；译文不扩展为特定教义标准，也不把“生活”抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“真先知”中的“真”由与“假先知”的明确对举自然补出，使中文指称清楚；末句保留原文由一般方法转向具体对象的命令语气。
