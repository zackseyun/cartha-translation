  terminology: “先生”对应 κύριε，适合此处对训导者的尊称；“察验”准确表达 δοκιμάζω 的检验、辨识含义；“神圣之灵”恰当保留 τὸ πνεῦμα τὸ θεῖον 与后文 τὸ πνεῦμα τὸ ἅγιον 的措辞差异。
