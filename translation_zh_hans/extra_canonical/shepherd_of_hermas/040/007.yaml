  to: 7. 我问：“那么，先生，人怎样才能知道他们中谁是先知，谁是假先知呢？”他说：“你要听我讲讲这两种先知；我将要怎样告诉你，你就怎样察验先知和假先知。要从那有神圣之灵的人的生活来察验他。”
