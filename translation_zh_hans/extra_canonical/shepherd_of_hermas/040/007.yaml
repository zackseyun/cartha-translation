  source_fidelity: 译文整体准确传达了问答、辨别先知与假先知的主题，以及以其 ζωή（生活/行事）为检验根据。然“谁是真先知”将原文较中性的“谁是先知”明确化为“真先知”；虽由对举可推知，仍可避免增添。末句的“根据一个人的生活，察验那有神圣之灵的人”语义可懂，但判断对象与判断根据的关系不够清晰。
