revisions:
- from: 9 所以，当那有上帝之灵的人来到一群义人的聚会中，而这些人对上帝的灵有信心，并且这群人向上帝祈求时，住在他身边、掌管先知之灵的天使就充满那人；那人被圣灵充满，便照着主的旨意向众人说话。
  to: 9. 所以，当那有上帝之灵的人来到义人们的会众中，而这些人对上帝的灵有信心，并且他们向上帝祈求时，在他身旁的先知之灵的天使就充满那人；那人被圣灵充满，便照着主的旨意向众人说话。
  rationale: 修订仅删除“掌管”这一无原文依据的解释性措辞，并略调会众表达使其自然。其余保留原译对“上帝之灵”“先知之灵”“圣灵”的区分，以及对ἔντευξις和主的意愿的谨慎处理。
