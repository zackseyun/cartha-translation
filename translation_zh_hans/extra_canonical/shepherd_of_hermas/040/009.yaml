base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/009.yaml
  text: 9. Therefore, when the man who has the divine spirit comes into a gathering of righteous men who have faith in the divine Spirit, and an intercession is made to God by the gathering of those men, then the angel of the prophetic spirit who is assigned to him fills the man; and being filled with the holy Spirit he speaks to the multitude as the Lord wills.
translation:
  language: zh_hans
  text: 9. 所以，当那有上帝之灵的人来到义人们的会众中，而这些人对上帝的灵有信心，并且他们向上帝祈求时，在他身旁的先知之灵的天使就充满那人；那人被圣灵充满，便照着主的旨意向众人说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: 上帝之灵
  rationale: 保留“属上帝、来自上帝的灵”这一含义，并与后文“圣灵”有所区分，以反映原文用词变化。
- source_word: συναγωγὴν ἀνδρῶν δικαίων
  choice: 一群义人的聚会
  rationale: συναγωγή在此指聚集或会众，并非必然指犹太会堂；译为“聚会”自然且避免过度限定。
- source_word: πίστιν θείου πνεύματος
  choice: 对上帝的灵有信心
  rationale: 希腊语属格关系存在一定含混；按上下文取“对……有信心”，同时不扩写为特定教义表述。
- source_word: ἔντευξις
  choice: 祈求
  rationale: 此词可指恳求、代求；这里没有明说为谁代求，因此用较宽泛的“祈求”。
- source_word: ὁ ἄγγελος τοῦ προφητικοῦ πνεύματος
  choice: 掌管先知之灵的天使
  rationale: 直译“先知之灵的天使”在现代汉语中关系不明；“掌管”表达属格关联，但不将天使与圣灵等同。
- source_word: ὁ κείμενος πρὸς αὐτὸν
  choice: 住在他身边
  rationale: 保留天使被置于或常在此人身旁的空间性表达，避免采用原文没有明确给出的“被指派”。
- source_word: εἰς τὸ πλῆθος
  choice: 向众人
  rationale: 自然表达其面向聚集人群说话的意思。
- source_word: καθὼς ὁ Κύριος βούλεται
  choice: 照着主的旨意
  rationale: 准确表达说话受主意愿支配，而不是由人自行发动。
theological_decisions:
- issue: “上帝之灵”“先知之灵”“圣灵”三种表述之间的关系
  choice: 依次保留原文不同称谓，不在译文中将其解释为完全相同或不同的实体
  alternative: 全部统一译作“圣灵”
  rationale: 原文在同一句中刻意使用不同表达；统一处理会抹去文本本身的神学张力。
- issue: 天使与先知之灵的关系
  choice: 译作“掌管先知之灵的天使”
  alternative: 译作“先知之灵的天使”或“作为先知之灵的天使”
  rationale: 原文是属格结构，并未明说天使就是该灵；所选译法提供可读性，同时避免二者同一化。
- issue: 先知发言的主动权
  choice: 明确保留“照着主的旨意”
  alternative: 译为“按主所赐的话”
  rationale: 后者会添加“所赐的话”这一原文没有的概念；本译文保留主的意愿与人的发言之间的原始表述。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；保留本段重复出现的“灵”“充满”等关键词，以维持论述结构。
