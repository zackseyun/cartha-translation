base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/005.yaml
  text: 5. For no spirit given from God is consulted, but, having the power of the Deity, it speaks everything from itself, because it is from above, from the power of the divine Spirit.
translation:
  language: zh_hans
  text: 5 因为上帝所赐的每一个灵，都无需受人求问；它既有神性的能力，便自行说出一切，因为它从上面而来，出于神圣之灵的能力。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν ... πνεῦμα ἀπὸ Θεοῦ δοθὲν
  choice: 凡从上帝领受的灵
  rationale: 保留“灵由上帝赐下”的被动含义，同时用自然的现代汉语表达。
- source_word: οὐκ ἐπερωτᾶται
  choice: 不是由人求问才说话
  rationale: 结合上下文，此词指受人询问、求问；补出“才说话”，明确与假先知须经求问才开口的对比。
- source_word: τὴν δύναμιν τῆς θεότητος
  choice: 神性的能力
  rationale: θεότης在此指神性；不将其扩展解释为特定教义命题。
- source_word: ἀφ' ἑαυτοῦ λαλεῖ πάντα
  choice: 便自行说出一切
  rationale: 贴近“从自身说出一切”的措辞，同时避免误解为灵的能力独立于上帝；后句随即说明其来源。
- source_word: ἄνωθέν
  choice: 来自上面
  rationale: 保留空间性及神圣来源的双重意涵，不窄化为单一释义。
- source_word: τοῦ θείου πνεύματος
  choice: 神圣之灵
  rationale: 保留原文较描述性的表达，不擅自统一为专名“圣灵”。
theological_decisions:
- issue: “自行说出”是否暗示这灵独立于上帝
  choice: 保留“自行说出”，并紧接“来自上面，来自神圣之灵的能力”
  alternative: 译作“主动说出”或“照着上帝的意思说出”
  rationale: 原文ἀφ' ἑαυτοῦ确有“从自身、自发地”之意；上下文重点是它不等待人的求问，而非宣称其脱离上帝。译文保留这一张力，不加入原文没有的限定。
- issue: θεῖον πνεῦμα是否直接译为专名“圣灵”
  choice: 译作“神圣之灵”
  alternative: 圣灵
  rationale: 原文使用θεῖον而非固定表达πνεῦμα ἅγιον；采用描述性译法可保留词汇差异及文本本身的含混性。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“求问才说话”承接本段关于真假先知的语境；“神性”“神圣之灵”尽量对应希腊语词形差异，不作教派化阐释。
