revisions:
- from: 12 首先，那个自以为有灵的人抬高自己，想坐首位；他很快就变得狂妄、无耻、喋喋不休，生活奢靡，又行许多欺骗的事。他靠说预言收取报酬；若得不到报酬，就不说预言。神的灵难道会收取报酬才说预言吗？神的先知不可能这样做；这类先知所有的，乃是属地的灵。
  to: 12 首先，那个看似有灵的人抬高自己，想坐首位；他立刻显得狂妄、无耻、喋喋不休，沉溺于许多奢靡和许多别样的欺骗中，并且为自己的预言收取报酬；若得不到报酬，就不说预言。神的灵能收取报酬并说预言吗？神的先知不可能这样做；这类先知的灵是属地的。
  rationale: 修订仅处理可由希腊原文明确判定的语义问题：以“看似”保留 δοκῶν 的表象性，以并列句式对应“收取报酬并说预言”，并以直接判断对应末句。未添加教义性解释或脚注。
