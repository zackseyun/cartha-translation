base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/012.yaml
  text: 12. First, that man who seems to have a spirit exalts himself and wants to have the first seat; and immediately he is presumptuous and shameless and talkative, and lives among many luxuries and many other deceits, and he receives payment for his prophecy; and if he does not receive it, he does not prophesy. Can a divine spirit receive payment and prophesy? A prophet of God cannot do this; rather, the spirit of such prophets is earthly.
translation:
  language: zh_hans
  text: 12 首先，那个看似有灵的人抬高自己，想坐首位；他立刻显得狂妄、无耻、喋喋不休，沉溺于许多奢靡和许多别样的欺骗中，并且为自己的预言收取报酬；若得不到报酬，就不说预言。神的灵能收取报酬并说预言吗？神的先知不可能这样做；这类先知的灵是属地的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δοκῶν πνεῦμα ἔχειν
  choice: 自以为有灵的人
  rationale: δοκῶν 在此结合后文的假先知语境，表示自称或看似有灵；译作“自以为”自然地传达其表象与实情之间的反差。
- source_word: πρωτοκαθεδρίαν
  choice: 首位
  rationale: 指受尊崇的首席座位或地位；“坐首位”兼顾具体座席意象与身份诉求。
- source_word: ἰταμός
  choice: 狂妄
  rationale: 该词可指冒失、放肆、僭越；与“无耻”并列时，“狂妄”能避免语义完全重复。
- source_word: πολύλαλος
  choice: 喋喋不休
  rationale: 保留“多言、话多”的贬义色彩，并符合现代汉语表达。
- source_word: ἐν τρυφαῖς πολλαῖς ἀναστρεφόμενος
  choice: 生活奢靡
  rationale: τρυφή 指奢华享乐，ἀναστρέφομαι 指生活行事；此译简洁呈现其生活方式。
- source_word: μισθὸν λαμβάνει τῆς προφητείας αὐτοῦ
  choice: 靠说预言收取报酬
  rationale: 明确报酬与其预言活动相连，不将 μισθός 过度限定为工资、礼金或特定宗教费用。
- source_word: ἐπίγειόν ἐστι τὸ πνεῦμα
  choice: 乃是属地的灵
  rationale: 保留“从地上而来、非从上而来”的对照，并维持文本对灵之来源与性质的判断。
theological_decisions:
- issue: πνεῦμα θεῖον 是指神圣之灵还是圣灵
  choice: 神的灵
  alternative: 神圣的灵／圣灵
  rationale: 原文用 θεῖον 而非此句中的固定称号“圣灵”；“神的灵”既自然，也不强行把表达系统化为后期术语。
- issue: 假先知与属地之灵的关系
  choice: 这类先知所有的，乃是属地的灵
  alternative: 这类先知的灵是属地的
  rationale: 原文可理解为他们里面运作的灵之性质与来源。采用“所有的”保留外来灵或其自身之灵两种理解空间，避免断定其精确本体关系。
- issue: 收取报酬是否被绝对视为一切先知事工的禁令
  choice: 按本段修辞直接译出，不扩展适用范围
  alternative: 解释为任何宗教服事都不可接受供养
  rationale: 文本针对以报酬为说预言条件的假先知，译文不导入更广泛的教会供养制度立场。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留原文连续并列的揭露语势，并以分号和问句呈现论证推进。经文无脚注标记需求。
