base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/001.yaml
  text: 1. He showed me men sitting on a bench, and another man sitting on a chair. And he says to me, “Do you see the ones sitting on the bench?” “I see, sir,” I say. “These,” he says, “are faithful; and the one sitting on the chair is a false prophet who destroys the understanding of the servants of God—of the double‑minded, not of the faithful.
translation:
  language: zh_hans
  text: 1 他让我看见一些人坐在一条长凳上，另有一个人坐在座椅上。他问我：“你看见那些坐在长凳上的人吗？”我说：“看见了，先生。”他说：“这些人是忠信的；那坐在座椅上的人是假先知，他败坏上帝仆人的心思——所败坏的是那些三心二意的人，不是忠信的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλλιον
  choice: 长凳
  rationale: 指可供多人同坐的凳子，与一人所坐的 καθέδρα 形成场景上的对比。
- source_word: καθέδρα
  choice: 座椅
  rationale: 保留其较为显要、独立的座位含义，又避免用现代官职色彩过强的表达。
- source_word: πιστοί
  choice: 忠信的／忠信的人
  rationale: 兼顾“相信”与“忠贞”的语义范围；本段用作人的称谓时补出“人”。
- source_word: ψευδοπροφήτης
  choice: 假先知
  rationale: 采用现代汉语宗教文献中清楚而稳定的对应词。
- source_word: ἀπόλλυσι τὴν διάνοιαν
  choice: 败坏……的心思
  rationale: ἀπόλλυμι 在此指造成毁坏，διάνοια 指理解、思想或心智；“心思”保留一定语义宽度。
- source_word: δίψυχοι
  choice: 三心二意的人
  rationale: 该词字面为“有两个心魂”，在本书中指摇摆不定、心志不专一的人；采用自然且能表达其伦理意味的现代汉语。
- source_word: κύριε
  choice: 先生
  rationale: 此处是赫尔马对启示者的尊称，不必然是在称呼神；译作“先生”避免预先作神学身份判定。
theological_decisions:
- issue: 假先知所败坏之人的范围
  choice: 以破折号明确限定为“三心二意的人，不是忠信的人”
  alternative: 理解为他一般地败坏上帝仆人的心思，随后仅补充双心者受害更深
  rationale: 希腊文属格短语 τῶν διψύχων…οὐ τῶν πιστῶν 明确修正或限定前句“上帝的仆人”，应保留原文张力：这些动摇者仍可被归入上帝的仆人，却与“忠信的人”形成对照。
- issue: πιστοί 的信仰与忠贞双重含义
  choice: 译为“忠信的人”
  alternative: 信徒／相信的人
  rationale: “忠信”既不把词义缩减为群体身份，也保留上下文中坚定、不受假先知败坏的特征。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留原文现在时引述所带来的现场感，但汉语中统一以自然对话呈现。以“长凳／座椅”再现多人同坐与假先知独坐显位的视觉对照。
