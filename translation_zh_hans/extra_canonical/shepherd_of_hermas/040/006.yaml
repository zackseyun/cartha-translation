base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/006.yaml
  text: 6. But the spirit that is consulted and speaks according to the desires of men is earthly and light, having no power; and it does not speak at all unless it is consulted.
translation:
  language: zh_hans
  text: 6 然而，那受人求问、照着人的欲望说话的灵，是属地的、轻浮的，毫无能力；若无人求问，它就根本不说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπερωτώμενον
  choice: 受人求问
  rationale: 保留该灵被人询问、求取指示的被动含义，并与本段末尾“若无人求问”相呼应。
- source_word: κατὰ τὰς ἐπιθυμίας τῶν ἀνθρώπων
  choice: 照着人的欲望
  rationale: κατά 表示依照、迎合；ἐπιθυμίαι 在此指求问者想听到的欲求，而非中性的愿望。
- source_word: ἐπίγειον
  choice: 属地的
  rationale: 既表达来源和性质属于地上，也保留与上下文“从上头而来”的神圣之灵的对照。
- source_word: ἐλαφρόν
  choice: 轻浮的
  rationale: 此处不是物理重量轻，而是指欠缺分量、轻佻不可靠；“轻浮”能自然传达其贬义。
- source_word: δύναμιν μὴ ἔχον
  choice: 毫无能力
  rationale: 简洁表达分词结构，保留其完全缺乏属灵能力的断言。
- source_word: ὅλως οὐ λαλεῖ
  choice: 根本不说话
  rationale: ὅλως 加强否定，译作“根本”符合现代汉语语势。
theological_decisions:
- issue: “灵”的身份是否明确为假先知之灵
  choice: 保留为“那……的灵”
  alternative: 译作“假先知里面的灵”或“邪灵”
  rationale: 希腊文本只以定冠词和修饰语指称该灵；上下文虽将其与属神的灵对立，却未在本句直接命名为邪灵，因此不作超出原文的定性。
- issue: “能力”是否特指神能或权柄
  choice: 译作一般性的“能力”
  alternative: “神能”或“权柄”
  rationale: δύναμις 在上下文与从上头来的神圣能力形成对照，但本句没有限定词；保留较宽泛的表达可维持原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求问”适合预言、占问语境；“属地的、轻浮的”保留两个并列性质判断，不把它们合并解释。
