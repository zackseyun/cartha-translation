base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/016.yaml
  text: 20. Take now the power that comes from above. Hail is a very small pellet, and when it falls on a man’s head, how much pain it causes! Or again, take a drop that falls from the roof tile to the ground, and it bores through the stone.
translation:
  language: zh_hans
  text: 20. 现在来看看那从上面而来的力量。冰雹是一颗极小的颗粒；它落在人的头上，会带来多大的疼痛！再看一滴从屋瓦上落到地面的水，它会把石头滴穿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβε
  choice: 来看看
  rationale: 此处不是单纯命令“拿取”，而是引导听者以实例加以思量；译为“来看看”较符合现代汉语语境。
- source_word: δύναμιν
  choice: 力量
  rationale: 保留该词兼有能力、效力之意，并与上下文属天之灵的能力相呼应。
- source_word: ἄνωθεν
  choice: 从上头而来
  rationale: 直译其空间和神学意涵，不径自扩展为“从神而来”。
- source_word: χάλαζα
  choice: 冰雹
  rationale: 按通常词义翻译；后文以其微小却有冲击力为喻。
- source_word: κοκκάριον
  choice: 一粒
  rationale: 表达微小颗粒，符合冰雹在此处的形象，避免生硬的“小谷粒”。
- source_word: κεράμου
  choice: 屋瓦
  rationale: 在滴水语境中指屋顶的瓦片；译作“屋瓦”自然且具体。
- source_word: τρυπᾷ
  choice: 滴穿
  rationale: 原义为“穿透、钻孔”；结合水滴反复落下的常见汉语表达，译为“滴穿”。
theological_decisions:
- issue: ἄνωθεν的指向
  choice: 从上头而来
  alternative: 从神而来／从天上而来
  rationale: 保留原文“从上面、从上头”的措辞及其属天含义，不把隐含指向明说得超过本节原文。
- issue: 水滴穿石所表达的过程
  choice: 竟能把石头滴穿
  alternative: 在石头上钻出洞来
  rationale: 原文使用现在时描述其效力；汉语“滴穿”自然暗示持续作用，同时不改变以微小之物彰显巨大力量的论证。
translation_notes:
  register: 采用现代、庄重而通俗的叙述语体。以“现在来看看”承接前文论证；两个感叹性例证保留原文的反问和强调力度。无脚注标记。
