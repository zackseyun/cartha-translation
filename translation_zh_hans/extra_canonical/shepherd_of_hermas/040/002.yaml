  source_fidelity: 译文总体准确传达了双心者向假先知求问，以及假先知按提问者的提问和欲望回应的意思。惟脚注标记目前置于“所问的”之后，实际却注释紧随其后的方括号异文，锚点应移至该异文短语。另“神圣之灵的能力”搭配略显生硬，可在不将πνεῦμα θεῖον专名化的前提下调整为更自然的“神圣之灵的力量”。
  naturalness: “三心二意的人”虽可理解，但惯用语通常含泛指反复无常之意；“心怀二意的人”更直接对应δίψυχοι的内心摇摆、不能专一之义。调整后句法也更流畅。
  terminology: 保留“术士”“假先知”恰当。“神圣之灵”可保留其描述性和指涉开放性；将“能力”改为“力量”仅为汉语搭配优化，不改变δύναμις的含义。
