  to: 2. 因此，这些心怀二意的人像去找术士一样来到他那里，问他他们将会遭遇什么事；那个假先知自己里面没有神圣之灵的力量，就照着他们所问的与他们说话，也照着他们邪恶的欲望[a]，使他们的心灵得到满足。
