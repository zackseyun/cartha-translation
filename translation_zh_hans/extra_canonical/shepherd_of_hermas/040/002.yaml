  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/002.yaml
  text: 2. These, then, the double‑minded, come to him as to a magician and ask him what will happen to them; and that false prophet, having in himself no power of a divine spirit, speaks with them according to their questions [and according to the desires of their wickedness], and fills their souls as they desire.
translation:
  language: zh_hans
  text: 2. 因此，这些心怀二意的人像去找术士一样来到他那里，问他他们将会遭遇什么事；那个假先知自己里面没有神圣之灵的力量，就照着他们所问的与他们说话，也照着他们邪恶的欲望[a]，使他们的心灵得到满足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“也照着他们邪恶的欲望”这句话。
    reason: 希腊文校勘文本将καὶ κατὰ τὰς ἐπιθυμίας τῆς πονηρίας αὐτῶν置于方括号中，表明其文本见证存在疑问。
lexical_decisions:
- source_word: δίψυχοι
  choice: 三心二意的人
  rationale: 字面涉及“两个心魂”，在本书中指内心摇摆、不能专一信靠的人；“三心二意”是现代汉语中自然且贴近语义的表达。
- source_word: μάγον
  choice: 术士
  rationale: 此处指受人求问未来或命运的行法术者；“术士”比单指表演者的“魔术师”准确，也保留其宗教与占卜色彩。
- source_word: τί ἄρα ἔσται αὐτοῖς
  choice: 自己将会有什么遭遇
  rationale: 原文可指将来会临到他们的事；此译不限定为单一事件或纯粹命运。
- source_word: δύναμιν πνεύματος θείου
  choice: 神圣之灵的能力
  rationale: 保留πνεῦμα θεῖον可理解为来自神或具有神圣性质之灵的措辞，不直接把此处规范化为专名“圣灵”。
- source_word: πληροῖ τὰς ψυχὰς αὐτῶν
  choice: 填满他们的心灵
  rationale: 保留“填满”的具体意象；“心灵”在现代汉语中比“魂”更自然，同时未替原文补出所填内容。
theological_decisions:
- issue: πνεύματος θείου是否译作专名“圣灵”
  choice: 神圣之灵
  alternative: 神的灵／圣灵
  rationale: 希腊文此处没有定冠词，且上下文讨论真、假预言之灵；采用描述性表达，以保存词义和指涉上的一定开放性。
- issue: 括号内短语的文本地位
  choice: 纳入正文并加脚注标记
  alternative: 从正文删除，或不加说明地保留
  rationale: 源文本以方括号标示该短语，说明其文本见证可能不稳；正文保留可呈现较长读法，脚注则如实提示异文。
- issue: “按他们所问的”与“按邪恶欲望”的关系
  choice: 两项并列保留
  alternative: 合并解释为假先知迎合提问者
  rationale: 原文两次使用κατά，分别指向问题和欲望；并列翻译避免淡化其修辞和道德张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“求问术士”传达此处寻求预知的场景；“三心二意”延续本命令篇对δίψυχος的核心刻画。正文保留原句重复和因果推进，不额外解释假先知具体以何物“填满”他们的心灵。
