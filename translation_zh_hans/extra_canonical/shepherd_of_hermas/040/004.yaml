review_pass:
  verdict: revise
  source_fidelity: 整体准确传达了信心坚固者远离此类灵，以及心怀二意者求占、拜偶像并受责备的论证。惟“求问占卜”将不及物的μαντεύονται处理得不够顺畅，宜明确为“行占卜”；τὰ ἔθνη在此为与信徒相对的外邦人，译作“外邦人”更合语境。
  naturalness: “在对主的信仰上刚强”略显翻译腔；“在主的信心上坚强”更符合现代庄重汉语。“三心二意”虽可表达δίψυχοι，却略偏日常口语，改为“心怀二意”较贴合本段的宗教伦理语域。
  terminology: 保留“披戴真理”这一穿衣隐喻，且不把πνεύματα额外定性为“邪灵”，处理恰当。“拜偶像的人”准确保留εἰδωλολάτρης的直接断言。
  issues:
  - severity: medium
    issue: “像列国的人一样求问占卜”搭配不自然，且“列国的人”未充分体现τὰ ἔθνη在此处的群体性宗教语境。
    rationale: μαντεύονται意为实行/从事占卜，非“求问占卜”；τὰ ἔθνη在早期基督教语境通常指“外邦人”。
  - severity: low
    issue: “在对主的信仰上刚强”表达生硬。
    rationale: 可在不改变τῇ πίστει τοῦ Κυρίου的归属歧义的前提下，译为“在主的信心上坚强”。
  - severity: low
    issue: “三心二意”语体略口语化。
    rationale: “心怀二意”较适合庄重文本，也保留δίψυχοι的内心分裂、摇摆之义。
