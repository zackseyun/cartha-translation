  to: 4 所以，凡在主的信心上坚强、披戴真理的人，都不依附这类灵，反而远离它们。至于那些心怀二意、常常悔改的人，也像外邦人一样行占卜，并因拜偶像而使自己担上更大的罪；因为，凡为任何事求问假先知的，就是拜偶像的人，毫无真理，又愚昧无知。
  rationale: 修订仅改善对μαντεύονται、τὰ ἔθνη和κολλῶνται的语义及中文搭配，并调整个别语体；保留原文对“常常悔改”的未解释张力，以及求问假先知者“就是”拜偶像者的直接判断。无需脚注。
