base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/004.yaml
  text: 4. Therefore, as many as are strong in the faith of the Lord, having put on the truth, do not cling to such spirits, but keep away from them. But those who are double‑minded and often repent practice divination like the nations and bring a greater sin upon themselves by practicing idolatry; for the one who consults a false prophet about any matter is an idolater, empty of the truth and foolish.
translation:
  language: zh_hans
  text: 4 所以，凡在主的信心上坚强、披戴真理的人，都不依附这类灵，反而远离它们。至于那些心怀二意、常常悔改的人，也像外邦人一样行占卜，并因拜偶像而使自己担上更大的罪；因为，凡为任何事求问假先知的，就是拜偶像的人，毫无真理，又愚昧无知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰσχυροί εἰσιν ἐν τῇ πίστει τοῦ Κυρίου
  choice: 在对主的信仰上刚强
  rationale: 保留介词短语与“刚强”的核心意象；“对主的信仰”在此自然表达以主为对象的信靠，同时不排除“主所赐之信仰”的语义张力。
- source_word: ἐνδεδυμένοι τὴν ἀλήθειαν
  choice: 披戴真理
  rationale: 保留穿衣隐喻，而不弱化为一般性的“持守真理”。
- source_word: κολλῶνται
  choice: 亲近
  rationale: 该词本义有黏附、依附之意；结合对邪灵的态度，译作“亲近”自然且与下文“远离”形成对照。
- source_word: δίψυχοι
  choice: 三心二意
  rationale: 表达内心分裂、摇摆不定的状态，比生硬的“双心”更符合现代汉语。
- source_word: πυκνῶς μετανοοῦσι
  choice: 屡屡悔改
  rationale: 直译其频繁重复悔改之意，不擅自解释为悔改不真诚或反复犯罪。
- source_word: μαντεύονται
  choice: 求问占卜
  rationale: 体现寻求预言或占卜指示的行为，并与后文“求问假先知”相呼应。
- source_word: τὰ ἔθνη
  choice: 列国的人
  rationale: 保留早期基督教文本中与信徒群体相对的“列国/外邦”概念，同时让现代读者易懂。
- source_word: κενὸς ἀπὸ τῆς ἀληθείας
  choice: 心里没有真理
  rationale: 将“空无真理”转成自然汉语，但保留其内在缺失的判断。
theological_decisions:
- issue: “屡屡悔改”是否应解释为虚假悔改
  choice: 保留为“屡屡悔改”
  alternative: 反复悔改却不改正
  rationale: 希腊文只明说频繁悔改；添加“不改正”会替原文解决其刻意保留的道德张力。
- issue: 求问假先知与拜偶像的关系
  choice: 按原文直接表述“就是拜偶像的人”
  alternative: 如同拜偶像的人
  rationale: 原文使用判断句 εἰδωλολάτρης ἐστίν，语气明确，不宜弱化为类比。
- issue: πνεύματα 的所指
  choice: 译为“这类灵”
  alternative: 这些邪灵
  rationale: 上下文已表明是假先知背后的地上之灵，但本节未直接使用“邪”字；避免增加分类性神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“披戴真理”保留原文鲜明隐喻；“三心二意”传达 δίψυχοι 的内在分裂。“列国的人”兼顾历史语境与可读性。本节无需脚注。
