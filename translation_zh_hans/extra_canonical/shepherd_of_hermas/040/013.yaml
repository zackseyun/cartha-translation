  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/013.yaml
  text: 13. Then, he does not come near a gathering of righteous men at all, but avoids them. He clings to the double‑minded and the empty, and he prophesies to them in a corner, and deceives them by speaking everything according to their desires, emptily; for he also answers the empty. For an empty vessel, placed together with empty ones, is not broken, but they agree with one another.
translation:
  language: zh_hans
  text: 13 接着，他根本不接近义人的聚会，反而躲避他们；他却依附那些心怀二意、内里空虚的人，在角落里向他们说预言，按着他们的欲望说一切空话，借此欺骗他们；因为他也向空虚的人作答。空器皿同空器皿放在一起，不会破裂，反倒彼此相合。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγὴν ἀνδρῶν δικαίων
  choice: 义人的聚会
  rationale: 按普通意义译作聚集或会众，不以“会堂”等后期固定宗教称谓缩窄语义。
- source_word: διψύχοις
  choice: 心怀二意的人
  rationale: 保留 δίψυχος 所表达的内心分裂、摇摆不定，而非泛化为单纯的怀疑者。
- source_word: κενοῖς / κενῶς
  choice: 内里空虚的人／空话
  rationale: 依上下文分别作人格状态与言语内容处理，同时保留反复出现的“空”这一修辞链。
- source_word: κατὰ γωνίαν
  choice: 在偏僻处
  rationale: 原义为“在角落里”，语境强调避开公义群体而私下活动；采用自然中文表达，不额外推定具体地点。
- source_word: κολλᾶται
  choice: 厮混
  rationale: 表现紧密依附、结交的贬义语气，并与前文“躲避义人”形成对照。
- source_word: συμφωνοῦσιν ἀλλήλοις
  choice: 彼此合拍
  rationale: 自然表达双方相互契合、附和之意，保留讽刺意味。
theological_decisions:
- issue: “说预言”是否意味着其话语具有真实的神圣来源
  choice: 保留“说预言”的行为称谓，同时由上下文的“空话”“欺骗”否定其真实性
  alternative: 译为“假冒说预言”
  rationale: 原文使用 προφητεύει，并未在此动词本身加入“假冒”；不宜把上下文判断直接塞入词义。
- issue: “义人”所指群体的范围
  choice: 直译为“义人”，不具体化为某一教会职分或宗派群体
  alternative: 译为“正统信徒”或“教会领袖”
  rationale: 原文仅称 ἄνδρες δίκαιοι；保持其伦理与信仰层面的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文“空虚—空话—空器皿”的连续比喻与讽刺效果；句式适当拆分，以符合现代汉语阅读节奏。
