revisions:
- from: 3 他自己既是空虚的，就用空话回答空虚的人；无论别人问他什么，他都照着那人的空虚回答。不过，他也会说几句真话，因为魔鬼用自己的灵充满他，想看看能不能使义人中有人离弃正道。
  to: 3 他自己既是空虚的，就用空话回答空虚之人；无论人问他什么，他都照着那人的空虚回答。不过，他也会说一些真话；因为魔鬼用自己的灵充满他，或许能击垮一些义人。
  rationale: 仅修订末句，以避免将原文未明确的破坏结果解释为“离弃正道”；同时微调个别措辞，使语体更整齐。其余译法保留原文的修辞重复与逻辑关系。
