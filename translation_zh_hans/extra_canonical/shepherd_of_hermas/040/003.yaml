  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/003.yaml
  text: 3. For he, being empty, answers empty men with empty things; for whatever he is asked, he answers according to the emptiness of the person. But he also speaks some true words; for the devil fills him with his own spirit, if perhaps he may be able to tear away some of the righteous.
translation:
  language: zh_hans
  text: 3 他自己既是空虚的，就用空话回答空虚之人；无论人问他什么，他都照着那人的空虚回答。不过，他也会说一些真话；因为魔鬼用自己的灵充满他，或许能击垮一些义人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κενὸς / κενὰ / κενοῖς / κένωμα
  choice: 空虚的／空话／空虚的人／空虚
  rationale: 保留原文围绕“空”的反复文字效果，同时按各词在句中的语法功能作自然汉语表达。
- source_word: ἀποκρίνεται
  choice: 回答
  rationale: 对应受询问后作答的语境，简明自然。
- source_word: ῥήματα ἀληθῆ
  choice: 几句真话
  rationale: τινά 表示不定数量的“一些”，译作“几句”符合现代汉语；“真话”保留其内容真实之意。
- source_word: πληροῖ αὐτὸν τῷ αὐτοῦ πνεύματι
  choice: 用自己的灵充满他
  rationale: 贴近原文措辞，并保留“灵”的神学语汇及施动关系。
- source_word: ῥῆξαι
  choice: 使……离弃正道
  rationale: 该词基本义涉及撕裂、冲破；此处指从义人群体或忠贞状态中扯走某人。正文采用自然且不把具体机制说死的表达。
theological_decisions:
- issue: 魔鬼之灵与假先知偶尔说真话之间的关系
  choice: 明确保留因果关系：“因为魔鬼用自己的灵充满他”
  alternative: 弱化为“这是魔鬼的灵在他里面作工”
  rationale: 原文 ὁ γὰρ διάβολος πληροῖ 明确以魔鬼为主语，并用“充满”描述其行动，不宜淡化。
- issue: ῥῆξαι τῶν δικαίων 的对象与结果
  choice: 译为“使义人中有人离弃正道”
  alternative: “撕裂义人中的一些人”或“把一些义人夺走”
  rationale: 原文表达简略，可能含有击破、扯走或使之脱离的意象。译文保留其属灵败坏的方向，又避免断定是失去救恩、离开群体或遭受毁灭中的某一种。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“空虚—空话—空虚”尽量再现希腊文密集复现 κεν- 词根的修辞；末句避免引入特定宗派对义人是否可能失落的定论。
