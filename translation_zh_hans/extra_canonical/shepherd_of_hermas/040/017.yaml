base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/017.yaml
  text: 21. You see, then, that things from above, though very small when they fall upon the earth, have great power; so also the divine spirit that comes from above is powerful. Trust in this spirit, but keep away from the other.”
translation:
  language: zh_hans
  text: 21 所以你看，从上面落到地上的东西，哪怕极其微小，也有巨大的力量；同样，从上面来的神圣的灵也是大有能力的。因此，你要信靠这灵，远离另一灵。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἄνωθεν
  choice: 从上面……的东西
  rationale: 承接前文冰雹和水滴的比喻，保留“来自上面”的空间意象及其属天含义。
- source_word: ἐλάχιστα
  choice: 哪怕极其微小
  rationale: 自然表达让步关系，同时准确体现最高级所强调的微小。
- source_word: μεγάλην δύναμιν ἔχει
  choice: 有巨大的力量
  rationale: 直译 δύναμις 的能力、力量含义，并与下句形成呼应。
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: 神圣之灵
  rationale: 保留原文对灵之神圣来源或性质的表述，不擅自将其专名化为固定称谓。
- source_word: πίστευε
  choice: 信靠
  rationale: 在此语境中既包含相信这灵是真实可靠的，也包含将信任寄托于它。
- source_word: ἀπέχου
  choice: 远离
  rationale: 准确表达主动保持距离、避免接触之意。
theological_decisions:
- issue: τὸ πνεῦμα τὸ θεῖον 是否译作专名“圣灵”
  choice: 神圣之灵
  alternative: 圣灵
  rationale: 本段将从上面来的神圣之灵与属地之灵对比；译作“神圣之灵”可保留原文措辞和语境中的类别性张力，避免超出文本而固定为后世专名。
- issue: πίστευε 的信仰强度
  choice: 信靠这灵
  alternative: 相信这灵
  rationale: “信靠”体现命令中持续倚赖与信任的意味，但不额外说明这种信靠的教义性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留前文比喻中“上面—地上”的垂直意象，并以“这灵／另一种灵”清楚承接两类灵的对比。
