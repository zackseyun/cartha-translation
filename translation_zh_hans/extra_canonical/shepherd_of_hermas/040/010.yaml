  text: 10. Thus the spirit of the Deity will be made manifest. As for the spirit of the Deity of the Lord, this is its power.
translation:
  language: zh_hans
  text: 10 这样，神性的灵就会显明出来。这就是主的神性之灵的能力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节第二句的希腊文表达十分凝缩，直译近于：“论到主神性的灵，这就是其能力。”
    reason: 提示原文句法的凝缩及指示语的具体所指仍有一定弹性，避免将其过度释义。
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς θεότητος
  choice: 神性的灵
  rationale: 保留属格表达所含的“具有神性／出于神”的意味，又不把它直接改写成后期教义术语。
- source_word: φανερὸν ἔσται
  choice: 就会显明出来
  rationale: 表达由先前所述情境得以被辨认、显露的含义。
- source_word: ἡ δύναμις αὕτη
  choice: 就是……的能力
  rationale: 承接上文圣灵使人按主旨意说话的表现；“能力”对应 δύναμις，不弱化为一般的“特征”。
theological_decisions:
- issue: “神性的灵”与“圣灵”的关系
  choice: 依本节字面译作“神性的灵”
  alternative: 译作“圣灵”或“神的灵”
  rationale: 本节使用 τὸ πνεῦμα τῆς θεότητος，而上文另有 τὸ πνεῦμα τὸ ἅγιον；保留用词差异，避免擅自消除文本中的表达张力。
- issue: 第二句残缺、凝缩的希腊句法
  choice: 译作“以上所说的，就是主那神性之灵的能力”
  alternative: 更字面地译作“论到主神性的灵，这就是其能力”
  rationale: 原句语法凝缩且可能有文本困难；正文采用自然中文承接上文，脚注说明原文措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“显明出来”承接上文对真先知受灵说话的描述；“以上所说的”仅补足汉语衔接，不增加新的神学判断。
