base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/008.yaml
  text: 8. First of all, the one who has the [divine] spirit from above is gentle and quiet and humble‑minded, and refrains from every evil and from the vain desire of this age, and makes himself lower than all people; and when consulted he answers nothing to anyone, nor does he speak privately—nor does the holy Spirit speak whenever a person wishes it to speak—but it speaks when God wishes him to speak.
translation:
  language: zh_hans
  text: 8 首先，凡有从上头来的[神圣的]灵的人[a]，都是温柔、安静、谦卑的，远离一切邪恶和今世虚妄的欲望；他把自己置于众人之下。有人求问他时，他不回答任何人，也不私下说话——圣灵也不在人想要它说话时就说话——而只在上帝要那人说话时才说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神圣的”在一些文本见证中缺失；原文编辑以方括号标出。
    reason: 说明源文本τὸ θεῖον的文本不确定性，并对应正文中的方括号。
lexical_decisions:
- source_word: πραΰς
  choice: 温柔
  rationale: 表达性情柔和、不强横，符合早期基督教伦理语境，也为现代普通读者熟悉。
- source_word: ἡσύχιος
  choice: 安静
  rationale: 保留沉静、不喧扰的基本含义，不扩展为“沉默”。
- source_word: ταπεινόφρων
  choice: 谦卑
  rationale: 自然表达“心思卑微、不自高”的含义。
- source_word: ἐπιθυμίας ματαίας
  choice: 虚妄的欲望
  rationale: 同时保留ἐπιθυμία的欲求含义与ματαία的空虚、徒然色彩。
- source_word: ἐνδεέστερον ποιεῖ
  choice: 看自己……卑微
  rationale: 该表达可指使自己处于较低、较缺乏或较卑下的位置；此处结合谦卑品格，以自然汉语表达其自居于众人之下的意思。
- source_word: κατὰ μόνας
  choice: 私下
  rationale: 指离开公开聚会、单独进行的言说。
- source_word: λαλεῖ
  choice: 说话
  rationale: 保持原文反复用词及先知发言语境，避免擅自具体化为“说预言”。
theological_decisions:
- issue: τὸ πνεῦμα [τὸ θεῖον] τὸ ἄνωθεν中方括号词的文本状态
  choice: 正文译作“[神圣之]灵”并保留方括号
  alternative: 直接译作“神圣之灵”或省略“神圣之”
  rationale: 源文本以方括号标出τὸ θεῖον，译文相应标示其文本不确定性，不将其静默解决。
- issue: 末句αὐτόν的指代与圣灵行动主体
  choice: 译作“上帝要那人说话时”，同时保留圣灵“说话”的句法
  alternative: 译作“上帝要圣灵说话时”或“上帝要借着他说话时”
  rationale: 阳性代词αὐτόν最自然地回指“那人”，但上下文又以“圣灵”为说话主体；译文保留这一张力，不补入“借着”。
- issue: 圣灵是否受人的意愿操控
  choice: 明确译出“不在人想要它说话时就说话”
  alternative: 简化为“不随人的意思说话”
  rationale: 保留原文条件式对比：并非人想让圣灵发言，它就发言；发言取决于上帝。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。保留原文长句的递进与对比，但用分号和破折号帮助阅读；不将“说话”教派化地改写成特定形式的先知活动。
