    rationale: “那有从上头来的[神圣之]灵的人”中“那有”和“神圣之”均不够流畅。改为“凡有从上头来的[神圣的]灵的人”更符合现代汉语，且不改变原文泛指结构。
  - severity: low
    issue: “看自己比所有人都卑微”稍弱化原文的自我置低动作
    rationale: ἑαυτὸν ἐνδεέστερον ποιεῖ含有使自己处于较低位置的表达。译作“把自己置于众人之下”更直接保留这一点。
