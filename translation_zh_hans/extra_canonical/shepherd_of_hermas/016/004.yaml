base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/004.yaml
  text: “But the others, lady, who are they?” “They are daughters of one another. And they are called Simplicity, Knowledge, Innocence, Dignity, and Love. Whenever, then, you do all the works of their mother, you are able to live.”
translation:
  language: zh_hans
  text: '“可是，夫人，其余的那些是谁呢？”我问。


    “她们是彼此的女儿。她们叫作纯朴、知识、无邪、庄重和爱。每当你实行她们母亲的一切作为，你就能够活着。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁπλότης
  choice: 纯一
  rationale: 表示心志单纯、真诚而不诡诈；“纯一”既保留德性的名词形式，也避免仅被理解为头脑简单。
- source_word: Ἐπιστήμη
  choice: 知识
  rationale: 此处为人格化德性，通常指认识或知识；译作“知识”简明且不额外限定为属灵知识。
- source_word: Ἀκακία
  choice: 无邪
  rationale: 原词指不怀恶意、没有恶；“无邪”自然凝练，并与人格化德性名称相称。
- source_word: Σεμνότης
  choice: 端庄
  rationale: 涵盖庄重、可敬与品格端正；“端庄”较符合此处德性名称的语域。
- source_word: Ἀγάπη
  choice: 爱
  rationale: 保留原词宽广而未限定的含义，不擅自加上宗派性或特定神学修饰。
- source_word: δύνασαι ζῆσαι
  choice: 就能得生命
  rationale: ζῆσαι 可直译“活着”，但在本段救赎与永生语境中带有得生命之意；“得生命”自然地保留其神学分量。
theological_decisions:
- issue: “她们彼此为女儿”的代际关系
  choice: 她们彼此相生，都是前一位的女儿
  alternative: 她们互为女儿
  rationale: 字面“互为女儿”在汉语中会形成逻辑矛盾；下文明确给出依次相生的次序，因此用“前一位”使本句可懂，同时不把她们说成同一位母亲所生。
- issue: “她们母亲”的指代
  choice: 保留为“她们母亲”
  alternative: 明确译为某一德性，如“节制”
  rationale: 本节此句的单数“母亲”指代在孤立段落中存在张力，后文才展开德性相生的链条；正文不擅自指定，以保留原文表达。
- issue: ζῆσαι 的生命含义
  choice: 得生命
  alternative: 活下去
  rationale: 上下文将这些德性与永生及住在塔中相连；“得生命”保留救赎性意味，但不直接增译“永生”。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的叙事对话体。德性名称统一用简洁名词，并保留人格化效果。本单元无脚注。
