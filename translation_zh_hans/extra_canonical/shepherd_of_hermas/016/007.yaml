- from: 她们的能力彼此相连，也彼此相随，正如她们的出生次序一样：节制由信心而生，纯朴由节制而生，纯真由纯朴而生，庄重由纯真而生，知识由庄重而生，爱由知识而生。因此，她们的行为是纯洁、庄重而神圣的。
  to: 她们的力量彼此维系，也彼此相随，正如她们按受生的次序一样：节制由信心而生，纯朴由节制而生，纯真由纯朴而生，庄重由纯真而生，知识由庄重而生，爱由知识而生。因此，这些德性的行为是纯洁、庄重而神圣的。
  rationale: 修订仅加强首句对“彼此维系”的表达，并使“受生”意象更贴近原文；其余德性名称、生成顺序及末句评价均予保留。加入“这些德性”是为使“她们”在中文中所指更清楚，未改变原意。
