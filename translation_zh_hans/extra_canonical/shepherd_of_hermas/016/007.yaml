base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/007.yaml
  text: But it was not revealed to you alone, but so that you may make them known to all. After three days—for first you must understand, and I first command you, Hermas, the words I am about to say to you—speak them all into the ears of the holy ones, so that, after hearing them and doing them, they may be cleansed from their evils, and you also with them.”
translation:
  language: zh_hans
  text: 她们的力量彼此维系，也彼此相随，正如她们按受生的次序一样：节制由信心而生，纯朴由节制而生，纯真由纯朴而生，庄重由纯真而生，知识由庄重而生，爱由知识而生。因此，这些德性的行为是纯洁、庄重而神圣的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατοῦνται δὲ ὑπ᾽ ἀλλήλων
  choice: 彼此相连
  rationale: 中间式 κρατοῦνται 在这里描写诸德性的能力互相维系、连结；译作“彼此相连”自然，并保留相互依存之意。
- source_word: ἀκολουθοῦσιν ἀλλήλαις
  choice: 彼此相随
  rationale: 保留德性依次跟随、相继而来的形象，并与下文出生次序呼应。
- source_word: γεγεννημέναι
  choice: 出生次序
  rationale: 诸德性被人格化为母女，因此保留“生”的比喻，不改写为抽象的逻辑推演。
- source_word: Ἐγκράτεια
  choice: 节制
  rationale: 表示克制欲望和行为的自制德性；“节制”是现代中文中简洁庄重的对应。
- source_word: Ἁπλότης
  choice: 纯朴
  rationale: 可含单纯、诚实、不复杂之意；“纯朴”在此不把语义收窄为单一的“诚实”。
- source_word: Ἀκακία
  choice: 纯真
  rationale: 字面涉及无恶、无害、清白；“纯真”符合人格化德性的表达，同时避免生硬的“无恶”。
- source_word: Σεμνότης
  choice: 庄重
  rationale: 表达可敬、端正、庄严的品格，与下文形容词 σεμνά 保持词义关联。
- source_word: Ἐπιστήμη
  choice: 知识
  rationale: 直译其认知、认识之义，不扩展为特定宗教性的“属灵知识”。
- source_word: Ἀγάπη
  choice: 爱
  rationale: 采用现代中文最自然、宽广的对应，不额外加入教派化限定。
- source_word: θεῖά
  choice: 神圣的
  rationale: 传达属于神、具有神圣性质之意；中文“神圣”比“神性的”更自然，且不暗示行为本身具有神格。
theological_decisions:
- issue: 德性之间的出生关系
  choice: 按原文保留人格化的母女生成链条
  alternative: 解释为诸德性在伦理或救恩上的因果阶段
  rationale: 原文以 γεννᾶται 明说“由……而生”，但并未界定这是严格的因果、时间次序或救恩阶梯，因此不替作者消解其象征性张力。
- issue: 诸德行为的 θεῖα
  choice: 译为“神圣的”
  alternative: “神的”或“具有神性的”
  rationale: 既传达与神相关的崇高性质，也避免把人的行为等同于神或赋予其本体神性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留七种德性的人格化和出生意象。该读者分段对应希腊原文第7节，因此正文仅翻译该节，不并入英语咨询层所含的第10—11节内容。
