base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/006.yaml
  text: And I kept asking her about the times—whether it is already the end. But she cried out with a loud voice, saying, “Senseless man, do you not see that the tower is still being built? Whenever, then, the tower is completed in its building, it comes to an end. But it will be built up quickly. Do not question me any further; this reminder and the renewal of your spirits are enough for you and for the holy ones.
translation:
  language: zh_hans
  text: 我又问她关于那些时候的事：现在是否已经到了终局。她却高声喊道：“愚昧的人哪！你没有看见那座塔仍在建造吗？所以，塔一建造完毕，就到了终点。不过，它很快就会建成。不要再问我什么了；这番提醒，以及你们心灵的更新，对你和众圣徒来说已经足够了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν καιρῶν
  choice: 那些时期
  rationale: 保留复数及末世时序的含义，不把它缩窄为单一日期。
- source_word: συντέλεια
  choice: 终局
  rationale: 指事物达到完成、时代抵达终点；“终局”比单纯的“末日”更能保留其与塔建成之间的文字呼应。
- source_word: Ἀσύνετε ἄνθρωπε
  choice: 愚昧的人哪
  rationale: 传达缺乏领悟的责备语气，同时保持庄重自然。
- source_word: ἐποικοδομηθήσεται
  choice: 就会建成
  rationale: 在塔的语境中自然表达被继续建造直至完成的意思。
- source_word: ὑπόμνησις
  choice: 提醒
  rationale: 表示使人重新记起并受到劝诫的话。
- source_word: ἀνακαίνωσις τῶν πνευμάτων ὑμῶν
  choice: 你们心灵的更新
  rationale: πνεύματα 为复数并带属人格局；中文用“你们心灵”自然保留群体性，不预先限定为圣灵论意义。
- source_word: τοῖς ἁγίοις
  choice: 众圣徒
  rationale: 指归属于上帝的圣洁群体；采用早期基督教文本中通行且易懂的称谓。
theological_decisions:
- issue: συντέλεια 是否明确译作“世界末日”
  choice: 终局
  alternative: 世界末日
  rationale: 原文没有明说“世界”，且把终点与塔建成相连；较宽的译法保留其末世含义和象征张力。
- issue: πνευμάτων 是否译为超自然的“诸灵”
  choice: 你们心灵
  alternative: 你们的灵
  rationale: 上下文是听者内在生命的更新；“心灵”在现代汉语中更自然，同时不将其解释成多个独立灵体。
- issue: ἁγίοις 的群体身份
  choice: 众圣徒
  alternative: 圣洁的人
  rationale: “圣徒”能准确表示被分别为圣的信徒群体，又不引入特定宗派的封圣观念。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留塔仍在建造、建成与终局之间的条件关系；通过“我”与“你们”的人称变化再现原文中对赫尔马个人和圣徒群体的同时指向。
