base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/003.yaml
  text: Hear their functions. The first of them, the one clasping her hands, is called Faith; through her the chosen of God are saved. And the second, the one girded about and acting bravely, is called Self-control; she is the daughter of Faith. Whoever, then, follows her becomes blessed in his life, because he will refrain from all evil works, believing that if he refrains from every evil desire he will inherit eternal life.”
translation:
  language: zh_hans
  text: 你要听她们各自的功用。她们中第一位，就是双手相握的，名叫“信心”；上帝所拣选的人借着她得救。第二位，就是束着腰、刚强勇敢的，名叫“节制”；她是信心的女儿。所以，凡跟随她的人，一生都会蒙福，因为他会远离一切恶行，并且相信：若远离一切邪恶的欲望，他必承受永生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργείας
  choice: 功用
  rationale: 此处指七位女子各自发挥的作用；“功用”既保留功能含义，也适合人格化美德的语境。
- source_word: ἡ κρατοῦσα τὰς χεῖρας
  choice: 双手相握的
  rationale: 按希腊文直译其姿态，不擅自说明她握的是自己的手还是别人的手。
- source_word: Πίστις
  choice: 信心
  rationale: 在此为人格化美德的名称；“信心”自然且能体现其宗教语境。
- source_word: σώζονται
  choice: 得救
  rationale: 保留原文被动式及其救赎含义，不额外说明施救者或得救过程。
- source_word: περιεζωσμένη
  choice: 束着腰
  rationale: 保留古代预备行动、劳作的具体形象，避免仅抽象译为“准备好了”。
- source_word: ἀνδριζομένη
  choice: 刚强勇敢的
  rationale: 该词含勇敢、刚强行事之意；如此翻译避免现代汉语中性别化且不自然的“像男人一样”。
- source_word: Ἐγκράτεια
  choice: 节制
  rationale: 涵盖克制欲望与自我约束，是早期基督教美德语境中的常用对应词。
- source_word: μακάριος
  choice: 蒙福
  rationale: 既表达福乐状态，也保留宗教性的赐福意味。
- source_word: ἀφέξεται
  choice: 远离
  rationale: 表达主动不参与恶行、避开邪欲的意思，较“戒绝”更自然，同时保留道德克制。
- source_word: κληρονομήσει ζωὴν αἰώνιον
  choice: 承受永生
  rationale: 保留“继承、得为产业”的圣经式意象，并使用庄重自然的现代中文。
theological_decisions:
- issue: “借着信心得救”与拣选的关系
  choice: 上帝所拣选的人借着她得救
  alternative: 她拯救上帝所拣选的人
  rationale: 原文为被动式 σώζονται，并以 διὰ ταύτης 表示中介；译文保留“得救”的被动表达，不把人格化的信心直接说成救主，也不解释拣选与信心的先后关系。
- issue: 远离邪欲与承受永生之间的条件关系
  choice: 只要远离一切邪恶的欲望，就必承受永生
  alternative: 由于远离一切邪恶的欲望，他便配得永生
  rationale: 原文明确使用条件句 ἐὰν…，但没有“配得”一词；译文保留其劝诫中的条件张力，不增添功德论或其他教派性解释。
- issue: “节制”作为“信心的女儿”
  choice: 直译为“她是信心的女儿”
  alternative: 节制源于信心
  rationale: 保留原文人格化和亲属谱系的意象，而不将其化约为抽象的逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。美德名称加引号以提示其人格化专名身份；保留“束着腰”“女儿”“承受永生”等原文意象。段首的 ἄκουε νῦν 中 νῦν 具有话语推进作用，因此不机械译出“现在”，以符合自然汉语并与经审校的英文处理一致。
