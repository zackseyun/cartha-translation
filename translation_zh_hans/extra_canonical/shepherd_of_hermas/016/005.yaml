base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/005.yaml
  text: '“I wanted,” I said, “to know, lady, what power each of them has.” “Hear,” she says, “the powers they have. Their powers are held together by one another, and they follow one another, just as they were born: from Faith is born Self-control, from Self-control Simplicity, from Simplicity Innocence, from Innocence Dignity, from Dignity Knowledge, and from Knowledge Love. So, then, the works of these are pure and dignified and divine. Whoever, then, serves these and proves able to hold fast to their works will have his dwelling in the tower with the holy ones of God.”'
translation:
  language: zh_hans
  text: 我说：“夫人，我想知道她们各自有什么能力。”她说：“你听听她们所具有的能力。她们的能力彼此维系，她们也彼此相随，正如她们出生的次序一样：节制由信心而生，纯朴由节制而生，无邪由纯朴而生，庄重由无邪而生，知识由庄重而生，爱由知识而生。因此，她们的作为是纯洁、庄重而神圣的。凡服事她们，并且能够坚守她们作为的人，必与上帝的圣民一同住在塔中。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύναμις
  choice: 能力
  rationale: 兼顾这些拟人化德行各自所具有的力量与功用；上下文并未要求缩窄为单纯的“作用”或“功效”。
- source_word: κρατοῦνται ... ὑπ᾽ ἀλλήλων
  choice: 彼此相连
  rationale: 中间/被动形式表达这些能力互相维系、相扣；译作“彼此相连”自然且保留关系上的互依性。
- source_word: Πίστις
  choice: 信心
  rationale: 在此为拟人化德行；“信心”比“信仰”更自然地与其后诸德行并列，同时保留宗教语境。
- source_word: Ἐγκράτεια
  choice: 节制
  rationale: 指对欲望和行为的自我约束，与前文远离邪恶欲望的说明一致。
- source_word: Ἁπλότης
  choice: 纯朴
  rationale: 可表达单纯、真诚、不诡诈的品格，避免现代汉语“简单”可能带来的贬义。
- source_word: Ἀκακία
  choice: 无邪
  rationale: 表达没有恶意、无害而清白的品格；比“天真”更庄重，也较少暗示幼稚。
- source_word: Σεμνότης
  choice: 庄重
  rationale: 涵盖端庄、可敬的道德品格，并与同段形容词 σεμνά 保持词义呼应。
- source_word: Ἐπιστήμη
  choice: 知识
  rationale: 保留一般性的认知与明辨含义，不擅自解释为某种专门的属灵知识。
- source_word: Ἀγάπη
  choice: 爱
  rationale: 采用现代汉语最自然且宽广的表达，不额外加入宗派性限定。
- source_word: κρατῆσαι τῶν ἔργων αὐτῶν
  choice: 持守她们的行为
  rationale: 此处属格结构可表示紧紧抓住、坚持实行；“持守”保留坚守意味，而“行为”承接前句 τὰ ἔργα。
- source_word: κατοίκησις
  choice: 住在
  rationale: 以自然汉语表达获得居所、定居之意；塔的象征意义由文本本身保留。
- source_word: οἱ ἅγιοι τοῦ Θεοῦ
  choice: 上帝的圣民
  rationale: 这里指属上帝的圣洁群体；“圣民”较“圣徒”更便于普通读者理解，也不引入后世封圣含义。
theological_decisions:
- issue: 德行之间的“出生”关系
  choice: 保留“由……而生”的连续次序
  alternative: 解释为这些德行仅在逻辑或道德成长上依次产生
  rationale: 原文以拟人化的生育关系描述德行次序；不将其静默化约为单一的心理、伦理或救恩阶段。
- issue: 服事拟人化德行
  choice: 直译为“服事她们”
  alternative: 意译为“践行这些德行”
  rationale: δουλεύσῃ 带有服事、效力的强烈拟人化色彩；保留这一张力，并由后文“持守她们的行为”说明实践层面。
- issue: 住在塔中的含义
  choice: 保留象征性表述，不解释塔等同于某一具体制度或末世地点
  alternative: 明说塔就是教会或最终救恩
  rationale: 本单元自身只陈述与上帝圣民同住塔中；译文不越过当前文本替作者完成神学解释。
- issue: 行为与进入塔中居所的关系
  choice: 照原文保留条件式陈述
  alternative: 加入有关恩典、功德或称义体系的解释
  rationale: 原文把服事这些德行、持守其行为与塔中居所相连；应保留其劝诫力度和神学张力，不以宗派框架增删。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留七种德行的女性拟人化，因此统一使用“她们”。句式尽量清晰呈现德行相生的链条，并避免把原文的象征和救恩性劝诫过度解释。
