  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/002.yaml
  text: Looking at me, she smiled and says to me, “Do you see seven women around the tower?” “I do, lady,” I said. “This tower is supported by these women at the Lord’s command.
translation:
  language: zh_hans
  text: 她注视着我，微微一笑，对我说：“你看见塔周围的七位女子吗？”我说：“看见了，夫人。”她说：“这座塔奉主的命令，由她们托住。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασά μοι
  choice: 她注视着我
  rationale: 表达带有定向、专注意味的凝视，比普通的“看着我”更贴近原文。
- source_word: ὑπεμειδίασεν
  choice: 微微一笑
  rationale: 该动词表示轻微或含蓄的笑，译法自然且保留程度。
- source_word: κυρία
  choice: 夫人
  rationale: 这是对受尊敬女性的直接称呼；“夫人”符合本段庄重语境，又不额外赋予宗教头衔。
- source_word: βαστάζεται
  choice: 托住
  rationale: 在塔的意象中表示承托、支撑；“托住”既具体又保留被动含义。
- source_word: κατ’ ἐπιταγὴν τοῦ Κυρίου
  choice: 奉主的命令
  rationale: 准确表达依照主之命令或权威而行，句式符合现代汉语。
theological_decisions:
- issue: “主”（Κύριος）的所指
  choice: 保留为“主”
  alternative: 明确译作“上帝”或“基督”
  rationale: 本句本身未明确限定所指，保留原文称谓可避免替文本消除歧义。
- issue: 七位女子与塔的关系
  choice: 译为“由她们托住”
  alternative: 译为“由她们建造”或抽象化为“依靠她们”
  rationale: 原文使用承托、支撑的动词，不应引入建造含义，也不应把具象异象过度解释为抽象神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原文由叙述过去时转入历史现在时的鲜活感，但按汉语习惯统一成流畅对话。
