base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/001.yaml
  text: When, then, I had stopped questioning her about all these things, she says to me, “Do you want to see something else?” And because I was eager to behold it, I became very glad to see.
translation:
  language: zh_hans
  text: 于是，我不再向她询问这一切事时，她对我说：“你想看别的事吗？”我渴望观看，因能看见就满心欢喜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαυσάμην ἐρωτῶν
  choice: 问完了
  rationale: 表达停止询问、告一段落的意思，比直译“停止询问”更符合现代汉语叙事。
- source_word: ἄλλο
  choice: 别的
  rationale: 保留“不定的另一事物”之意，不擅自具体化异象内容。
- source_word: κατεπίθυμος ὢν τοῦ θεάσασθαι
  choice: 正渴望观看
  rationale: 保留加强语气的渴望及 θεάομαι 所含的凝视、观看意味。
- source_word: περιχαρὴς ἐγενόμην
  choice: 满心欢喜
  rationale: 自然传达强烈喜悦，而不削弱 περιχαρής 的程度。
- source_word: τοῦ ἰδεῖν
  choice: 一想到能看见
  rationale: 希腊文末尾属格不定式与前文结构略显重复；此译保留因将要看见而欢喜的因果关系，同时使中文通顺。
theological_decisions: []
