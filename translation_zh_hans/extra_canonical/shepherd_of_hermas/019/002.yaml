base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/002.yaml
  text: “Why then was she seated in a chair? I wanted to know, sir.” “Because every weak person sits in a chair because of his weakness, in order that the weakness of his body may be supported. You have the pattern of the first vision.”
translation:
  language: zh_hans
  text: '“那么，她为什么坐在椅子上呢？先生，我想知道。”


    “因为每个软弱的人，都因自己的软弱坐在椅子上，好使他身体的软弱得到扶持。你已经得到了第一次异象的象征图像。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθέδρα
  choice: 椅子
  rationale: 指供人坐下并支撑身体的座位；用现代常用的“椅子”比“座位”更能保留上下文中的具体形象。
- source_word: ἀσθενής / ἀσθένεια
  choice: 软弱
  rationale: 原文反复使用同一词根，既描述人的虚弱，也描述身体的无力；统一译作“软弱”以保留重复和象征联系。
- source_word: συνκρατηθῇ
  choice: 得到支撑
  rationale: 此处表达身体的虚弱借椅子被扶持、稳住，译为“得到支撑”自然且符合语境。
- source_word: τύπος
  choice: 所表示的意义
  rationale: 在此指先前异象形象所呈现的象征模式或含义；结合“ἔχεις”译成“你明白……所表示的意义”，使现代读者容易理解而不引入特定神学术语。
theological_decisions:
- issue: τύπος是否译作具有专门神学色彩的“预表”
  choice: 第一次异象所表示的意义
  alternative: 第一次异象的预表／模式
  rationale: 这里是在解释老妇坐椅的异象象征，并非明确建立后世常说的预表论关系；采用较中性的表达，避免过度神学化。
- issue: ἔχεις的语气
  choice: 现在你明白……了
  alternative: 你有了……的模式
  rationale: 希腊语字面为“你有了第一异象的τύπος”，在问答收束处表示解释已经交付、听者已经掌握其意义；这样译较自然，同时保留结论性语气。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“先生”对应κύριε，在师生式询问语境中比宗教称谓“主啊”更合适。保留“软弱”的词根重复，以维系身体状态与异象象征之间的联系。
