  rationale: 修订保留原文的问答语气、椅子的具体形象和“软弱”的重复。末句以“象征图像”表达τύπος所指的样式、模型或象征性呈现，避免把它直接等同于抽象“意义”，同时不引入“预表”的专门神学含义。
