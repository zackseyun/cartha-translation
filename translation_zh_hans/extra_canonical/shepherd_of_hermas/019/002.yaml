  source_fidelity: 前两句基本忠实保留了问答、καθέδρα（椅子）以及ἀσθενής／ἀσθένεια的重复。末句“现在你明白……所表示的意义了”将ἔχεις（“你有/你得到了”）明确化为“明白”，又把τύπος限定为“意义”，虽合乎上下文，却比原文和英语审校轨迹的“pattern”更具解释性。宜保留其“样式/图像、范式”的表达。
  naturalness: 译文整体自然，现代汉语对话体得当。“凡软弱的人”略显书面但与文本庄重语域相称；“软弱的身体”可更贴近原文改为“他身体的软弱”，并保留同词根反复。
  terminology: “椅子”适合καθέδρα在此处的具体坐具含义；“先生”可对应称呼κύριε，避免误作对神的称谓。“支撑”可表达συνκρατηθῇ的扶持、稳住之意。τύπος不宜在正文中直接消解为单纯“所表示的意义”，也不必采用带特定神学传统色彩的“预表”。
