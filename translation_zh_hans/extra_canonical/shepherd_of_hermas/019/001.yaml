base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/001.yaml
  text: “Listen,” he says, “about the three forms you are inquiring about. In the first vision, why did she appear to you as an old woman and seated on a chair? Because your spirit is old and already withered and has no strength because of your weaknesses and your double‑mindedness. For just as the aged, no longer having hope of being renewed, expect nothing else but their sleep, so also you, having been weakened by the affairs of life, have handed yourselves over to negligence, and you did not cast your anxieties upon the Lord; instead your mind has been shattered, and you have grown old in your sorrows.”
translation:
  language: zh_hans
  text: “听着，”他说，“关于你所追问的那三种形象：在第一次异象中，她为什么以老妇人的样子向你显现，并且坐在椅子上呢？因为你们的灵已经衰老枯萎，又因你们的软弱和三心二意而失去了力量。年老的人既不再指望恢复青春，所等候的就只有长眠；同样，你们也因今生的事务而变得软弱，把自己交给了懈怠，并没有把自己的忧虑交托给主；反倒心志破碎，在忧愁中衰老了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  choice: 形态
  rationale: 指老妇人后来显现出的三种外在样貌；“形态”既自然，又不把含义限缩为容貌。
- source_word: τὸ πνεῦμα ὑμῶν
  choice: 你们的灵
  rationale: 保留原文“灵”的用语及其可能的属灵含义，不改释为“精神状态”。
- source_word: μαλακιῶν
  choice: 软弱
  rationale: 此处与丧失力量相连，表示松懈、软弱；采用涵盖面较广的译法，避免过度具体化。
- source_word: διψυχιῶν
  choice: 三心二意
  rationale: 表达内心分裂、摇摆不定，符合现代汉语习惯，同时保留道德与信仰层面的张力。
- source_word: κοίμησιν
  choice: 长眠
  rationale: 原义为“睡眠”，在老人生命终点的语境中委婉指向死亡；“长眠”保留这一双关。
- source_word: βιωτικῶν πραγμάτων
  choice: 今生的事务
  rationale: 指日常生活和世俗生计方面的事务；“今生”保留其与属灵关切相对的色彩。
- source_word: ἀκηδίας
  choice: 漠然
  rationale: 表示懈怠、灰心和疏忽的状态；“漠然”避免只译成一般的懒惰。
- source_word: διάνοια
  choice: 心志
  rationale: 兼顾思想、内在意向与精神承受力，比单纯的“头脑”更切合语境。
theological_decisions:
- issue: πνεῦμα 是人的灵、精神，还是群体的属灵状态
  choice: 直译为“你们的灵”
  alternative: 你们的精神／你们的属灵生命
  rationale: 原文保留人格构成与属灵状况之间的开放性，不宜在译文中先行界定。
- issue: κοίμησις 是否明确译作死亡
  choice: 译为“长眠”
  alternative: 死亡／睡眠
  rationale: 保存早期基督教语境中“睡眠”对死亡的委婉表达及复活盼望可能形成的张力。
- issue: “把忧虑卸给主”的经文回响
  choice: 保留“卸给主”的表达
  alternative: 把忧虑交托给主
  rationale: 较贴近ἐπιρίπτω“扔到、卸到……之上”的形象，也保留与相关经文传统的语言联系。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。依照所指定的读者分段，仅译19:1所涵盖的问答开端至“在忧愁中衰老了”，未纳入原文后续关于为何坐在椅子上的进一步问答。
