base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/004.yaml
  text: '"You shall keep these things thus—you, with your children and your whole household; and having kept them you will be blessed; and as many as, having heard them, keep them will be blessed, and they will receive understanding from the Lord."'
translation:
  language: zh_hans
  text: 你和你的儿女，以及全家，都要这样遵守这些事。你遵守了这些事，就有福了；凡听见这些事而遵守的人，也都有福；他们必从主领受悟性。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρήσεις / τηρήσας / τηρήσωσι
  choice: 遵守
  rationale: 该动词在本段指切实守住所领受的吩咐；“遵守”既保留反复措辞，也符合现代汉语宗教文本的庄重语域。
- source_word: τέκνων
  choice: 儿女
  rationale: 比“孩子”更庄重，并可自然涵盖子女。
- source_word: ὅλου τοῦ οἴκου σου
  choice: 你全家的人
  rationale: οἶκος在此指整个家户或家庭成员；此译法比单说“家”更清楚地表达人的群体。
- source_word: μακάριος / μακάριοι
  choice: 有福
  rationale: 保留原文表示蒙福之状态的宗教含义，而不弱化为一般的“幸福”。
- source_word: σύνεσιν
  choice: 悟性
  rationale: 指理解、领悟的能力；“悟性”简洁自然，也与从主领受相配。
theological_decisions:
- issue: 福分与遵守之间的关系
  choice: 依原文直陈“若遵守……就有福”
  alternative: 解释为遵守赚取救恩，或仅为现世幸福
  rationale: 原文只陈述遵守者有福，并未界定其救恩机制或福分性质，因此不作教派性扩展。
- issue: “从主领受悟性”的施予者与内容
  choice: 保留为“从主领受悟性”
  alternative: 具体解释为领受圣灵、救恩知识或理解禁食教训
  rationale: 原文未进一步限定σύνεσις的内容，宜保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。通过重复“遵守”保留希腊文的修辞衔接；将较长的希腊语句分成两个汉语句群，以提升可读性而不删减信息。
