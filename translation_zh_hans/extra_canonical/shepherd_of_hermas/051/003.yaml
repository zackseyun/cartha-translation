base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/003.yaml
  text: '"If, then, you complete the fast in this way as I commanded you, your sacrifice will be acceptable before God, and this fast will be recorded; and the service performed in this way is good and cheerful and acceptable to the Lord.'
translation:
  language: zh_hans
  text: 所以，如果你照我所吩咐的方式完成这次禁食，你的祭物在上帝面前必蒙悦纳；这次禁食也必被记下。这样履行的服事是美好的、喜乐的，并且蒙主悦纳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελέσῃς τὴν νηστείαν
  choice: 完成禁食
  rationale: 保留τελέω“完成、实行到底”的意义，不弱化为单纯“禁食”。
- source_word: ἡ θυσία σου
  choice: 你的祭物
  rationale: θυσία在此指作为献给上帝之物的“祭物”；避免译成抽象的“牺牲”而丢失敬拜语境。
- source_word: δεκτὴ παρὰ τῷ Θεῷ
  choice: 在上帝面前必蒙悦纳
  rationale: 以自然中文表达“为上帝所接纳”，并保留敬虔语体。
- source_word: ἔγγραφος ἔσται
  choice: 必被记下
  rationale: ἔγγραφος意为“登记在册、留有记录”；“被记下”自然且不额外断定记在何处。
- source_word: λειτουργία
  choice: 服事
  rationale: 在此指履行的宗教性服务或奉献行动；“服事”兼顾礼仪与实际行动，避免限定为后世制度化的“礼拜仪式”。
- source_word: ἱλαρά
  choice: 喜乐的
  rationale: 表达“欣然、愉快”的性质；与“美好的”并列自然，也保留行动应出于乐意的意味。
- source_word: εὐπρόσδεκτος τῷ Κυρίῳ
  choice: 蒙主悦纳
  rationale: 忠实表达“为主所欣然接纳”，并与前句关于上帝的悦纳形成原文中的呼应。
theological_decisions:
- issue: 禁食、祭物与上帝悦纳之间的关系
  choice: 按原文保留条件句：“如果……这样完成禁食……必蒙悦纳”
  alternative: 将其解释为功德换取上帝接纳，或加入“不是靠行为”等说明
  rationale: 原文强调按先前吩咐实行的禁食蒙悦纳，但本句自身并未系统说明功德、恩典或称义关系；译文不加入宗派化解释。
- issue: “被记下”的对象与记录地点
  choice: 译作“这次禁食也必被记下”
  alternative: 明确译为“记录在天上”或“记在生命册上”
  rationale: 原文只说ἔγγραφος，没有指明记录地点或册名，应保留这种未明确性。
- issue: λειτουργία的礼仪含义
  choice: 采用较宽泛的“服事”
  alternative: 译为“礼拜”“礼仪”或“职事”
  rationale: 上下文涉及禁食及相关奉献实践，若使用制度性较强的术语，会把后世教会结构读入文本。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法保留原文的条件—结果结构及三项评价（美好、喜乐、蒙悦纳），同时避免生硬复制希腊语语序。无脚注，因此正文不设脚注标记。
