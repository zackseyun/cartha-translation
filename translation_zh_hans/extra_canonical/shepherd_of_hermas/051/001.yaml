base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/001.yaml
  text: I say, "Sir, I do not know these parables, nor am I able to understand them unless you explain them to me."
translation:
  language: zh_hans
  text: 我说：“先生，这些比喻我不明白；除非你给我解释，否则我无法领会。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: 先生
  rationale: 此处是对异象中说话者的尊称，并非直接称呼上帝；译作“先生”既保留敬意，也避免误导为神圣称号。
- source_word: παραβολὰς
  choice: 比喻
  rationale: 该词在本书这一部分指借具体形象传达意义的譬喻性教导，“比喻”自然且符合文体。
- source_word: οὐ γινώσκω
  choice: 不明白
  rationale: 语境所指不是缺乏事实知识，而是不懂这些比喻的含义。
- source_word: νοῆσαι
  choice: 领会
  rationale: 突出思想上的理解，与前面的“不明白”形成自然递进。
- source_word: ἐπιλύσῃς
  choice: 解释
  rationale: 在解释比喻的语境中意为解明、阐释；“解释”是现代汉语最直接自然的表达。
theological_decisions:
- issue: Κύριε所指身份
  choice: 译为“先生”
  alternative: “主啊”
  rationale: 本句是赫尔马向异象中的引导者说话；原词兼有尊称与“主”的含义，此处按叙事关系采用人际尊称，不预设其神圣身份。
translation_notes:
  register: 采用现代、庄重而口语自然的直接引语。保留原句“若非……”的条件关系，但以“除非……否则……”表达，使普通读者易于理解。
