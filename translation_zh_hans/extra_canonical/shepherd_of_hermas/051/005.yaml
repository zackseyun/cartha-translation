base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/005.yaml
  text: I say to him, "Sir, since I have you with me, I must ask you and question you; for you show me everything and speak with me. But if apart from you I were seeing or hearing these things, I would ask the Lord that it might be made clear to me."
translation:
  language: zh_hans
  text: 我对他说：“先生，既然你与我同在，我就必须向你求问、向你询问；因为你把一切都指给我看，又同我说话。但若没有你同在，而是我看见或听见这些事，我就会求问主，好使我得到显明。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: 先生
  rationale: 此处是赫马对异象中的讲解者所用的尊称；译作“先生”既保留礼貌称呼，也避免把对方直接等同于后文的“主”。
- source_word: ἀνάγκην ἔχω
  choice: 我自然要
  rationale: 该短语表达在当前情境下的必要性；用“自然要”符合现代汉语对话语气，同时保留“有必要”的含义。
- source_word: αἰτεῖσθαι καὶ ἐπερωτᾶν
  choice: 请教、问你
  rationale: 保留两个并列动词；“请教”体现有所求，“问”体现进一步询问。
- source_word: δεικνύεις
  choice: 指给我看
  rationale: 保留“展示、指出”的具体意味，与下文“看见”相呼应。
- source_word: ἄτερ σοῦ
  choice: 在没有你的情况下
  rationale: 自然表达“离开你／没有你在场”，不额外推断空间距离或关系断绝。
- source_word: ἠρώτων ἂν τὸν Κύριον
  choice: 我就会求问主
  rationale: 未完成过去时配合ἄν构成非现实条件的结果；“就会”传达条件语气，“求问”兼顾向主祈求并询问的语义。
- source_word: ἵνα μοι δηλωθῇ
  choice: 好让这些事向我显明
  rationale: 保留被动表达及目的意味，不明确添加由谁解释，从而维持原文的含蓄。
theological_decisions:
- issue: 同一句中两个Κύριε/Κύριον所指对象不同
  choice: 对讲解者译作“先生”，对神译作“主”
  alternative: 两处都译作“主”
  rationale: 前者是直接称呼异象中的讲解者，后者明确指赫马会求问的主；中文用不同译词可清楚呈现叙事角色，又不对讲解者的本体身份作神学断言。
- issue: 显明之事的施事者
  choice: 采用被动式“向我显明”
  alternative: 译作“求主向我说明”
  rationale: 原文δηλωθῇ为被动式，未明说施事者；保留被动可避免把解释行动直接限定为主亲自施行。
translation_notes:
  register: 采用现代、庄重而自然的叙事对话体。保留原文因果与假设结构，并以“请教、问你”重现并列动作；不添加原文未明说的身份判断或解释方式。
