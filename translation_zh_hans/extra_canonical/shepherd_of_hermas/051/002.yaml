  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/002.yaml
  text: He says, "I will explain everything to you, and whatever I speak with you I will show you. The one who has received the commands of prudence will fill his own soul and will pray to the Lord on your behalf.
translation:
  language: zh_hans
  text: 他说：“我会把一切都向你解释；凡我同你说的事，也都会指示给你。那领受了你明智的诫命的人，要充满自己的心灵，并为你向主祈求。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλύσω
  choice: 解释清楚
  rationale: 该词在此指解开比喻的含义；译作“解释清楚”既承接上文，也符合现代汉语表达。
- source_word: δείξω
  choice: 指明
  rationale: 保留“使看见、展示”的基本意象，同时表达把所说之事向听者说明的语境义。
- source_word: φροσύνης
  choice: 明智教导
  rationale: 原文在此处的句法和文本传承显得不整齐；“明智教导”保留φροσύνη所含的明智、审慎之义，也使“领受”与“诫命/教导”的搭配自然。
- source_word: ἐμπλήσῃ τὴν ἑαυτοῦ ψυχὴν
  choice: 使自己的心灵充实
  rationale: 较直接地保留“充满自己的魂/心灵”的表达，不擅自补出原文未明说的充满内容。
- source_word: εὔξηται ὑπὲρ σοῦ πρὸς τὸν Κύριον
  choice: 为你向主祈求
  rationale: 准确呈现代求的方向和对象；现代汉语中“向主祈求”自然庄重。
theological_decisions:
- issue: “领受明智教导的人”与前句的关系
  choice: 保留为独立的第三人称陈述
  alternative: 将其解释为守诫命者必得智慧，或改写成对赫马的直接命令
  rationale: 所给希腊文本确实转为第三人称；虽然句法可能反映文本缺损或传抄问题，但不宜据推测将其神学意义重构。
- issue: “使自己的心灵充实”所充满的内容
  choice: 不补明具体内容
  alternative: 补作“使自己的心灵充满智慧”或“充满这些教导”
  rationale: 原文没有明确宾语补足成分；保留开放性可避免替作者消除真实的文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“主”依早期基督教文本惯例保留。鉴于所给希腊文在φροσύνης附近句法不规则，正文采取最小限度的顺译，不用脚注臆测重建文本。
