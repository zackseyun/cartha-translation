review_pass:
  verdict: revise
  source_fidelity: 草稿基本准确传达了劝勉、应许与警戒的结构，也正确保留了原文未加限定的“将会得到”。但“不要停歇”的位置使汉语句法略显滞涩；末句“那赐给你的”在现代汉语中缺少中心词，未能自然对应ὁ διδούς σοι（“那位赐给你的人”）。
  naturalness: “所以，你祈求心灵所求的，不要停歇”语序不够自然，容易使“不要停歇”附着不明。改为“不要停止为你心灵所求的事祈求”更清晰、自然。为保持本段对διψυχία的反复主题，使用“心怀二意”比泛泛的“疑惑不定”更能体现其“双重/摇摆的心”的意象，同时在汉语中仍属自然表达。
  terminology: “灰心”贴合ἐκκακέω。“心怀二意”对应διψυχέω，并与本命令篇持续批判的διψυχία相呼应；不将其扩展为特定教义术语。“那位赐给你的人”保留原文以分词含蓄指称赐予者的表达，不在正文擅自补出“上帝”。
  issues:
  - severity: medium
    issue: 首句语序不自然，持续祈求的关系不够清楚。
    rationale: μὴ διαλίπῃς αἰτούμενος意为“不要停止祈求”。草稿将“不要停歇”后置于“祈求心灵所求的”之后，汉语读来较拗口。
  - severity: medium
    issue: “不要责怪那赐给你的”缺少中心词。
    rationale: τὸν διδόντα σοι是带定冠词的实词化分词，指“那位赐给你的人/赐予者”。汉语须补出“人”或“那一位”才完整自然；这不改变其含蓄指向。
  revised_text: 所以，不要停止为你心灵所求的事祈求，你就会得到。可是，若你在祈求时灰心而心怀二意，就该责怪自己，不要责怪那位赐给你的人。
  revised_footnotes: []
