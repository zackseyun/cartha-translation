revisions:
- from: 所以，你祈求心灵所求的，不要停歇，就必得到。可是，你若在祈求时灰心、疑惑不定，就该责怪自己，不要责怪那赐给你的。
  to: 所以，不要停止为你心灵所求的事祈求，你就会得到。可是，若你在祈求时灰心而心怀二意，就该责怪自己，不要责怪那位赐给你的人。
  rationale: 修订仅调整汉语语序和补足实词化分词在汉语中所需的中心词。“为你心灵所求的事祈求”保留τὸ αἴτημα τῆς ψυχῆς σου所指的内在请求，未加入祈求是否合乎旨意等外来限制；“你就会得到”保留λήψῃ的直接未来应许。
