base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/008.yaml
  text: So do not cease asking for the request of your soul, and you will receive it. But if you grow weary and become double-minded while asking, blame yourself and not the one who gives to you.
translation:
  language: zh_hans
  text: 所以，不要停止为你心灵所求的事祈求，你就会得到。可是，若你在祈求时灰心而心怀二意，就该责怪自己，不要责怪那位赐给你的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλίπῃς
  choice: 不要停歇
  rationale: 表达持续祈求、不可中断之意，同时保持劝诫语气。
- source_word: τὸ αἴτημα τῆς ψυχῆς σου
  choice: 心灵所求的
  rationale: 保留属格结构的内在、深切诉求含义，避免增添“愿望是否合宜”等原文未明说的限定。
- source_word: ἐκκακήσῃς
  choice: 灰心
  rationale: 此处指因迟延而丧志、厌倦；现代汉语“灰心”自然且切合语境。
- source_word: διψυχήσῃς
  choice: 疑惑不定
  rationale: 该词字面有“二心”之意，在本命令篇中指对上帝是否赐予心存摇摆；“疑惑不定”保留其不坚定性而不硬译为生涩的“双心”。
- source_word: σεαυτὸν αἰτιῶ
  choice: 就该责怪自己
  rationale: 准确呈现命令式，并使用自然的现代汉语。
- source_word: τὸν διδόντα σοι
  choice: 那赐给你的
  rationale: 保留分词表达及其指向上帝的含蓄性，不擅自把称谓明说为“上帝”。
theological_decisions:
- issue: “必得到”是否意味着对所有祈求无条件应允
  choice: 依原句保留直接应许“就必得到”
  alternative: 补入“若合上帝旨意”等限制语
  rationale: 本节原文没有明示限制；其张力应保留，不从其他经文或教义体系引入限定。
- issue: “赐给你的”所指身份
  choice: 保留原文含蓄称呼“那赐给你的”
  alternative: 明译为“赐予你的上帝”
  rationale: 上下文清楚指向主，但本句使用 substantival participle；保留其修辞形式更忠实。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“心灵所求的”与上下文重复措辞相呼应；全句保留原文的劝勉、应许和警戒结构。
