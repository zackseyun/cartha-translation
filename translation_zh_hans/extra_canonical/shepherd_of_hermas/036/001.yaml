base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/001.yaml
  text: 'He says to me: Remove double-mindedness from yourself, and do not at all be double-minded when asking anything from God, saying within yourself, “How am I able to ask from the Lord and receive, I who have sinned so much against him?”'
translation:
  language: zh_hans
  text: 他对我说：“要除掉你心里的三心二意；向上帝求什么时，丝毫不要疑惑，心里说：‘我得罪了主这么多，怎么还能向他祈求，并且得到呢？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία / διψυχήσῃς
  choice: 三心二意／疑惑
  rationale: διψυχία字面有“心分为二”之意，在本段具体指祈求时内心摇摆、不能信靠。名词译作自然的“三心二意”，动词在祈求语境中译作“疑惑”，既保留核心意象，也使现代汉语流畅。
- source_word: Ἆρον ἀπὸ σεαυτοῦ
  choice: 要除掉你心里的
  rationale: 原意是“从你自己身上拿走”。中文以“除掉你心里的”自然表达这种内在品性的清除。
- source_word: αἰτήσασθαί τι παρὰ τοῦ θεοῦ
  choice: 向上帝求什么
  rationale: παρά加属格表示从上帝那里求取；简洁译法符合现代汉语祈求语境。
- source_word: λέγων ἐν σεαυτῷ
  choice: 心里说
  rationale: 直译“在自己里面说”，汉语惯用“心里说”。
- source_word: ἡμαρτηκὼς τοσαῦτα εἰς αὐτόν
  choice: 我得罪了主这么多
  rationale: εἰς αὐτόν表明罪是针对他而犯；“得罪了主”比笼统的“犯了这么多罪”更保留关系指向。
theological_decisions:
- issue: 说话者因罪而怀疑能否向主祈求并蒙应允
  choice: 保留这种自我怀疑，译为反问“怎么还能……并且得到呢？”
  alternative: 解释为上帝必定无条件满足一切祈求
  rationale: 本节只呈现并驳斥祈求者的疑惑，并未在此限定祈求蒙应允的条件或方式，因此不额外加入系统神学解释。
- issue: θεός与κύριος的称谓区别
  choice: 分别译作“上帝”和“主”
  alternative: 二者一律译作“神”或“主”
  rationale: 保留希腊文本在同一句中使用的不同称谓。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。引语层次清楚；“三心二意”承接核心术语的“二心”意象，“疑惑”则贴合向上帝祈求时摇摆不定的具体语境。
