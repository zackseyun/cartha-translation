base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/011.yaml
  text: “You see then,” he says, “that faith is from above, from the Lord, and it has great power; but double-mindedness is an earthly spirit from the devil, having no power.
translation:
  language: zh_hans
  text: 他说：“所以你看，信心是从上而来，出于主，并且大有能力；三心二意却是属地之灵，出于魔鬼，没有能力。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: 信心
  rationale: 在本段与向主祈求时的信靠相连；“信心”既保留宗教语境，也符合现代汉语习惯。
- source_word: ἄνωθεν
  choice: 从上面
  rationale: 直译其空间及神圣来源意象，并由后面的“从主而来”加以说明。
- source_word: διψυχία
  choice: 三心二意
  rationale: 此词字面涉及“两个心魂”，在上下文中指祈求时摇摆、疑惑而不能专一信靠；“三心二意”是自然且易懂的现代汉语对应。
- source_word: ἐπίγειον πνεῦμα
  choice: 属地之灵
  rationale: 保留其与“从上面”相对的垂直意象，也不把 πνεῦμα 过度解释为心态或人格化灵体。
- source_word: δύναμιν μεγάλην
  choice: 大能
  rationale: 表达强大的能力，并保持庄重的宗教文体。
- source_word: δύναμιν μὴ ἔχουσα
  choice: 毫无能力
  rationale: 自然表达否定分词结构，与前句“具有大能”形成鲜明对照。
theological_decisions:
- issue: 信心与三心二意的来源
  choice: 分别译为“从主而来”和“从魔鬼而来”
  alternative: 弱化为受主或魔鬼影响的心理状态
  rationale: 原文两次使用 παρά 明确陈述来源；译文保留这一神学张力，不将其心理化。
- issue: πνεῦμα 的本体含义
  choice: 译为“灵”并保留歧义
  alternative: 译为“心态”“精神”或明确为“邪灵”
  rationale: 原文称三心二意为“属地之灵”，但没有进一步界定其是否是独立灵体；因此不作超出文本的解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语；以“他说”嵌入引语，保持原文叙述框架，并用“从上面／属地”保留原文的对照结构。
