    rationale: 希腊文λήψῃ明确以听者为主语，意为“你将领受”。汉语宜明说“你必会得到”，以避免“一切”仿佛自行“得到”的轻微歧义。
  - severity: low
    issue: “清除心里的三心二意”措辞稍显搭配不顺。
    rationale: 原文是“洁净你的心，除去双心”。现代汉语以“除去你心里的三心二意”更自然，也保留该状态位于内心的意象。
