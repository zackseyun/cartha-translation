base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/007.yaml
  text: Cleanse, then, your heart from double-mindedness, and put on faith, because it is strong, and believe God, that all your requests which you ask you will receive. And if ever, after asking some request from the Lord, you receive it more slowly, do not be double-minded because you did not quickly receive the request of your soul; for surely it is because of some testing or some transgression, which you do not know, that you receive your request more slowly.
translation:
  language: zh_hans
  text: 所以，要除去你心里的三心二意，披戴信心，因为信心是刚强的；要信靠上帝，确信你所求的一切，你必会得到。即使有时你向主求了什么，却较迟才得到，也不要因为没有很快得到心中所求的，就三心二意；因为你较迟才得到所求的，必定是由于某种试炼，或是某个你不知道的过犯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία / διψυχήσῃς
  choice: 三心二意
  rationale: 原词字面涉及“两个心/心意分裂”，在本段特指祈求时对上帝疑惑动摇；“三心二意”是现代汉语中自然且可反复使用的对应表达。
- source_word: ἔνδυσαι τὴν πίστιν
  choice: 披戴信心
  rationale: 保留“穿上”的鲜明隐喻，同时采用中文宗教文体中可理解而庄重的“披戴”。
- source_word: πίστευε τῷ θεῷ
  choice: 信靠上帝
  rationale: 希腊语与格结构不只是相信某个命题，也含信任、倚靠之意；译作“信靠”较完整。
- source_word: τὸ αἴτημα τῆς ψυχῆς σου
  choice: 心中所求的
  rationale: ψυχή在这里指人的内在生命或深切愿望；直译“灵魂的请求”在现代汉语中生硬，故作自然表达。
- source_word: βραδύτερον
  choice: 迟迟才／迟些才
  rationale: 表达相对于期待而言较晚获得，并与后面的“没有很快”形成原文对照。
- source_word: πειρασμόν
  choice: 试炼
  rationale: 该词可指试探或试炼；此处解释应允延迟的处境，译作“试炼”较合语境，同时不进一步说明试炼来源。
- source_word: παράπτωμά
  choice: 过犯
  rationale: 保留失足、犯错或违犯的道德含义，又不将其强化为特定类别的罪。
theological_decisions:
- issue: “一切所求都会得到”的绝对表述
  choice: 按原文保留“一切都会得到”
  alternative: 加上“若合乎上帝旨意”等限制语
  rationale: 本节原文没有明说限制条件；不从其他经文或教义体系补入限定，以保留原有劝勉力度及神学张力。
- issue: 延迟获得所求的原因
  choice: 保留“必定是由于某种试炼，或某个未知的过犯”
  alternative: 弱化为“可能是因为”
  rationale: πάντως在此语气强，原文明示确定性；虽会产生解释上的张力，仍不应擅自弱化。
- issue: 过犯归属的歧义
  choice: 译为“某个你自己不知道的过犯”
  alternative: 明确译作“你自己所犯却不知道的过犯”
  rationale: 关系代词ὃ的直接先行范围允许理解为听者不知道的某个过犯，但未明确说一定是听者本人所犯，因此避免补足归属。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“披戴信心”的原文隐喻，并用“三心二意”贯穿διψυχία语义；句法适度拆分，使长句便于普通读者朗读和理解。
