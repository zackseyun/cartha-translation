base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/005.yaml
  text: But if you waver in your heart, you will by no means receive anything of your petitions. For those who doubt with respect to God—these are the double-minded—and they do not at all obtain their petitions.
translation:
  language: zh_hans
  text: 但如果你心里疑惑不定，你所求的，什么也得不到。因为那些对上帝心存疑虑的人，就是心怀二意的人；他们所求的，一样也得不到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διστάσῃς
  choice: 疑惑不定
  rationale: 兼顾“迟疑、怀疑、摇摆”的语义，并与本段祈求上帝的语境相合。
- source_word: τῶν αἰτημάτων σου
  choice: 你所求的事
  rationale: 比直译“请求”更自然，同时保留复数所指的各项祈求。
- source_word: διστάζοντες εἰς τὸν θεόν
  choice: 对上帝疑惑
  rationale: 保留介词结构所表达的指向，不额外解释为怀疑上帝的能力、慈爱或应许。
- source_word: δίψυχοι
  choice: 心怀二意的人
  rationale: 表达字面上的“双心”及意志摇摆，采用现代汉语中清楚而庄重的说法。
- source_word: ἐπιτυγχάνουσι
  choice: 得到
  rationale: 在祈求的语境中自然表达“获得、达成”，避免生硬的“成功取得”。
theological_decisions:
- issue: 疑惑与祈求不得应允之间的绝对表述
  choice: 保留“绝不能”和“一样也得不到”的强烈否定
  alternative: 弱化为“很难得到”或“未必得到”
  rationale: 原文 οὐδὲν οὐ μὴ λήψῃ 与 οὐδὲν ὅλως ἐπιτυγχάνουσι 均为明确而强烈的否定，不应为缓和神学张力而弱化。
- issue: “对上帝疑惑”的具体对象
  choice: 不补明为怀疑上帝的能力、信实或慈悲
  alternative: 解释性翻译为“不信上帝会应允”
  rationale: 原文保持概括性；译文也保留这种开放范围，避免加入经文未明说的教义解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话；保持原文两句的因果推进和重复强调。无脚注标记。
