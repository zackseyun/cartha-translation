revisions:
- from: 但如果你心里疑惑不定，就绝不能从你所求的事中得到什么。因为那些对上帝疑惑的人，就是心怀二意的人；他们所求的，一样也得不到。
  to: 但如果你心里疑惑不定，你所求的，什么也得不到。因为那些对上帝心存疑虑的人，就是心怀二意的人；他们所求的，一样也得不到。
  rationale: 修订仅改善汉语搭配和行文自然度：首句直接表达祈求毫无所得，避免“从所求的事中得到”的不自然说法；第二句以“心存疑虑”顺畅表达对上帝的犹疑，未添加原文没有明说的疑虑内容。保留原文的重复、绝对否定及“心怀二意”的比喻性称谓。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:50:14Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了原文两重强烈否定（οὐδὲν οὐ μή、οὐδὲν ὅλως）、祈求的语境，以及“犹疑者”与“心怀二意者”的对应关系。不过，“从你所求的事中得到什么”在汉语中搭配不自然，也略模糊了“在你一切所求的事上毫无所得”的意思。
  naturalness: 首句“从……中得到什么”不够地道；改为“你所求的，什么也得不到”更自然、简洁，并保留原文的绝对否定。“对上帝疑惑的人”可调整为“对上帝心存疑虑的人”，在现代庄重汉语中更顺畅，同时不具体化其疑虑的内容。
  terminology: “上帝”前后一致。“心怀二意的人”恰当表达 δίψυχοι 的“双心、摇摆不定”，且避免把它限制为某一特定的神学解释。
  issues:
  - severity: medium
    issue: “就绝不能从你所求的事中得到什么”搭配生硬。
    rationale: 原文说的是“不会从你的祈求中得到任何东西”，即所求不得；汉语不宜说“从所求的事中得到”。改为“你所求的，什么也得不到”可完整传达语义和强调。
  - severity: low
    issue: “对上帝疑惑的人”表达略显别扭。
    rationale: διστάζοντες εἰς τὸν θεόν表达对上帝的犹疑，但未说明怀疑的具体对象。用“对上帝心存疑虑的人”更合现代汉语，且仍保留原文的概括性。
  revised_text: 但如果你心里疑惑不定，你所求的，什么也得不到。因为那些对上帝心存疑虑的人，就是心怀二意的人；他们所求的，一样也得不到。
