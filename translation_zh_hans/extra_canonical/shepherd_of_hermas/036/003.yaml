base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/003.yaml
  text: For God is not like human beings who remember wrongs; rather, he does not remember wrongs, and he has compassion on what he has made.
translation:
  language: zh_hans
  text: 因为上帝不像人那样记恨；他不记恨，并且怜悯自己所造的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己所造的”也可译作“他的受造物”。
    reason: 说明ποίησις的集合性含义及可能译法，而不在正文中缩窄所指。
lexical_decisions:
- source_word: μνησικακοῦντες
  choice: 记恨
  rationale: 该词指记住所受的恶而怀怨、伺机报复；“记恨”在现代汉语中自然，并保留怨恨意味。
- source_word: ἀμνησίκακός
  choice: 不记恨
  rationale: 与前句“记恨”形成原文刻意的反义对应；不扩展为较具教义解释色彩的“赦免”。
- source_word: σπλαγχνίζεται
  choice: 怜悯
  rationale: 表达发自深处的慈悲和同情，是庄重且通俗的对应语。
- source_word: ποίησιν
  choice: 所造的
  rationale: 此处指上帝的创造物或受造界；采用集合性表达，保留所指范围可能涵盖万物或受造之人的含混性。
theological_decisions:
- issue: ἀμνησίκακός是否译作“赦免罪过”
  choice: 不记恨
  alternative: 赦免罪过
  rationale: 原文强调上帝不怀怨记仇，而非在此直接陈述赦罪机制；直译可避免加入原文没有明说的神学限定。
- issue: ποίησις的所指范围
  choice: 自己所造的
  alternative: 他的受造物／他所造的人
  rationale: 不把对象限定为人，也不明确扩大成整个受造界，以保存希腊语集合名词的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“记恨／不记恨”重现希腊文的词义对照；句式简洁，适合箴言式教导。
