base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/012.yaml
  text: Therefore serve faith, which has power, and keep away from double-mindedness, which has no power, and you will live to God—and all who think these things will live to God.”
translation:
  language: zh_hans
  text: 所以，你要服事那有能力的信心，远离那没有能力的三心二意；这样，你就必为上帝而活。凡持有这些心思的人，也都必为上帝而活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλευε
  choice: 服事
  rationale: 保留“作奴仆、服从并效力于”的强烈关系含义；上下文把信心拟人化，因此“服事”比单纯“持守”更贴近原文。
- source_word: πίστει
  choice: 信心
  rationale: 此处与“有能力”搭配并被拟人化，指信靠上帝的信心。
- source_word: διψυχίας
  choice: 三心二意
  rationale: 表达内心分裂、对上帝迟疑不定的状态，比仅译作“疑惑”更能保留 δίψυχος 的“双重心志”意象。
- source_word: ἀπόσχου
  choice: 远离
  rationale: 自然表达克制自己、不与之沾染的命令语气。
- source_word: ζήσῃ τῷ θεῷ
  choice: 向上帝而活
  rationale: 保留与格短语可能包含的方向、归属和关系意味，不将其窄化为单一解释。
- source_word: φρονοῦντες
  choice: 存这样心思
  rationale: 涵盖思想取向和内在态度，呼应整段对信心与三心二意的对照。
theological_decisions:
- issue: “向上帝而活”的含义
  choice: 采用“向上帝而活”
  alternative: “在上帝面前活着”或“为上帝而活”
  rationale: 原文 τῷ θεῷ 的与格可表达关系、归属或指向；直译式表达保留其神学张力，避免限定为今生伦理生活或末世得生命。
- issue: 信心的拟人化
  choice: 保留“服事那有能力的信心”
  alternative: “持守大有能力的信心”
  rationale: δούλευε 明确带有服事、顺从的意味，且上下文将“信心”与“三心二意”作为两种相对的力量来描述。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句法保留原文的命令、对照和结果关系；不添加原文没有的教派性解释。
