base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/004.yaml
  text: Therefore cleanse your heart from all the vanities of this age and from the words previously spoken to you, and ask from the Lord; and you will receive everything, and you will lack nothing in any of your petitions, if you ask from the Lord without doubting.
translation:
  language: zh_hans
  text: 所以，你要除净心中今世的一切虚妄，以及先前对你说过的那些话；要向主祈求，你就会领受一切。只要你毫不迟疑地向主祈求，你所求的无论什么，都不会得不到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ματαιωμάτων
  choice: 虚妄
  rationale: 该词指今世空洞、徒然、无价值的事物或意念；“虚妄”既保留其道德与属灵色彩，也避免把范围缩窄为某一种具体罪恶。
- source_word: ἀδιστάκτως
  choice: 毫不迟疑地
  rationale: 这里与本段反复出现的 διστάζω／διψυχία 相呼应，强调祈求时不疑惑、不摇摆；“毫不迟疑”自然且保留上下文关联。
- source_word: ἀνυστέρητος
  choice: 不会得不到
  rationale: 原词意为不被剥夺、不至缺少。结合 τῶν αἰτημάτων，译为“所求的……都不会得不到”，较准确地表达祈求不落空，而不额外说明实现方式或时间。
- source_word: αἴτημα
  choice: 所求的
  rationale: 在祷告语境中指请求、祈求之事；采用“所求的”比抽象的“请求事项”更符合现代汉语。
theological_decisions:
- issue: “领受一切”与祈求必蒙应允的绝对表达
  choice: 保留原文“你就会领受一切”及“都不会得不到”的强烈措辞
  alternative: 增译为“合乎上帝旨意的一切都会领受”
  rationale: 本句本身没有明说额外条件；不把其他经文或系统神学限定语加入正文，以保留《牧人书》此处关于坚定信靠的劝勉力度。
- issue: τῶν προειρημένων σοί ῥημάτων 所指不够明确
  choice: 直译为“先前对你说过的那些话”
  alternative: 解释为“先前提到的那些疑念”或“先前警告你的那些事”
  rationale: 希腊文表面义是“先前对你说过的话”，具体指涉存在解释空间，因此不在正文中擅自收窄。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“除净心中”比逐字式“从你自己洁净你的心”更符合普通话表达；分为两句以清楚呈现命令、应许和条件之间的关系。
