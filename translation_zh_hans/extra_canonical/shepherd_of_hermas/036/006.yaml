  - severity: low
    issue: “毫不疑惑”可更精确反映 ἀδιστάκτως。
    rationale: 本段将 ἀδιστάκτως 与 διστάζω、δίψυχος 连结，核心是迟疑、摇摆或两心；“毫不犹疑”更自然地保留这一关联。
