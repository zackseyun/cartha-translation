revisions:
- from: 但那些在信心上完全的人，凡事都祈求，因为他们信靠主；他们也必领受，因为他们祈求时毫不疑惑，毫无二心。凡心怀二意的人，若不悔改，就很难得救。
  to: 但那些在信心上完全的人，凡事都祈求，因着信靠主；他们就领受，因为他们祈求时毫不犹疑，毫无二心。凡心怀二意的人，若不悔改，就很难得救。
  rationale: 仅作两项安全的措辞校正：以“就领受”避免把原文现在时强化为未来式，并以“毫不犹疑”更贴近本段反复出现的迟疑／两心语义。其余内容、范围及“很难得救”的非绝对表述均予保留。
