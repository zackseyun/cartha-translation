base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/006.yaml
  text: But those who are complete in faith ask for all things, having put their trust in the Lord, and they receive, because they ask without doubting, not being at all double-minded. For every double-minded man, unless he repents, will be saved with difficulty.
translation:
  language: zh_hans
  text: 但那些在信心上完全的人，凡事都祈求，因着信靠主；他们就领受，因为他们祈求时毫不犹疑，毫无二心。凡心怀二意的人，若不悔改，就很难得救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁλοτελεῖς ὄντες ἐν τῇ πίστει
  choice: 在信心上完全的人
  rationale: ὁλοτελής 表示完整、完全；保留原文对信心完整性的强调，同时采用自然的现代汉语表达。
- source_word: πάντα αἰτοῦνται
  choice: 凡事都祈求
  rationale: αἰτέω 在此语境指向主祈求；“凡事”保留 πάντα 的广泛范围，但不额外断言所求内容必然正当。
- source_word: πεποιθότες ἐπὶ τὸν κύριον
  choice: 因为他们信靠主
  rationale: 完成时分词表达已经将信赖置于主身上的状态；译作“信靠主”简洁自然。
- source_word: ἀδιστάκτως
  choice: 毫不疑惑
  rationale: 该词表示不迟疑、不怀疑，与本段反复出现的 διστάζω 和 διψυχία 形成语义呼应。
- source_word: μηδὲν διψυχοῦντες / δίψυχος
  choice: 毫无二心／心怀二意
  rationale: διψυχ- 词族字面涉及“两个心魂”，语境指对上帝摇摆不定；用相关而自然的汉语表达保留重复与警戒意味。
- source_word: δυσκόλως σωθήσεται
  choice: 就很难得救
  rationale: 直译其困难性表述，不将其强化为“不能得救”，也不弱化为一般生活困境。
theological_decisions:
- issue: “凡事都祈求并领受”的范围
  choice: 按原文保留“凡事都祈求……也必领受”的强烈陈述
  alternative: 增译为“凡合乎上帝旨意的事都祈求并领受”
  rationale: 本句没有明说“合乎旨意”等限定；不从其他经文或教义体系引入解释性条件。
- issue: δίψυχος 与得救的关系
  choice: 译为“若不悔改，就很难得救”
  alternative: 译为“若不悔改，就不能得救”或“恐怕不能得救”
  rationale: δυσκόλως 明确表示“困难地／很难”，原文留下张力，不应改成绝对否定或仅仅主观担忧。
- issue: “完全”的性质
  choice: 限定为“在信心上完全”
  alternative: 译为“完全人”或“信仰成熟的人”
  rationale: ἐν τῇ πίστει 限定完全所在的领域；避免暗示全然无罪，也避免以“成熟”削弱原词。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留本段平行结构和警戒语气；“毫不疑惑／毫无二心／心怀二意”兼顾词族联系与汉语自然度。
