base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/002.yaml
  text: Do not reason about these things, but turn to the Lord with your whole heart, and ask from him without doubting; and you will come to know his great compassion, because he will certainly not abandon you, but will fulfill the request of your soul.
translation:
  language: zh_hans
  text: 不要思量这些事，只要全心归向主，毫不疑惑地向他祈求；这样你就会知道他有何等丰盛的怜悯，因为他绝不会撇下你，反而会满足你心灵的祈求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλογίζου
  choice: 不要思量
  rationale: 保留“反复盘算、在心里推想”的语义，并自然承接上文因犯罪而不敢祈求的内心推论。
- source_word: ἐξ ὅλης τῆς καρδίας σου ἐπίστρεψον ἐπὶ τὸν κύριον
  choice: 全心归向主
  rationale: “归向”准确表达 ἐπιστρέφω 的转回、回归之意，也保留悔改语境；“全心”符合现代汉语表达。
- source_word: ἀδιστάκτως
  choice: 毫不疑惑地
  rationale: 本段反复对照信心与 δίψυχος/διστάζω；译作“不疑惑”能维持段落的关键词联系。
- source_word: πολλὴν εὐσπλαγχνίαν
  choice: 丰盛的怜悯
  rationale: εὐσπλαγχνία 指深切、由衷的慈悲；“丰盛”体现 πολλήν 的程度。
- source_word: τὸ αἴτημα τῆς ψυχῆς σου πληροφορήσει
  choice: 会满足你心灵的祈求
  rationale: πληροφορέω 在此有使之圆满、充分成就之意；“满足……祈求”比字面“充满请求”更符合现代汉语，同时保留结果性的应允含义。
theological_decisions:
- issue: 祈求蒙应允的表述强度
  choice: 会满足你心灵的祈求
  alternative: 会成全你心灵所求的
  rationale: 原文作肯定陈述，但本节未具体界定所求内容；译文保留其强烈应许，不额外加入“若合乎旨意”等原文没有的限定。
- issue: οὐ μή 的强调否定
  choice: 绝不会撇下你
  alternative: 不会离弃你
  rationale: οὐ μή 带强烈否定语气，因此用“绝不会”；“撇下”自然、庄重，也准确表达 ἐγκαταλείπω。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留本段从内心疑虑转向全心归主、毫不疑惑祈求的推进；不增添原文未明说的教义限定。
