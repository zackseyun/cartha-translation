base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/009.yaml
  text: 'Look at this double-mindedness: for it is evil and senseless, and it uproots many from the faith, even those who are very faithful and strong. For this double-mindedness is a daughter of the devil, and it acts very wickedly toward the servants of God.'
translation:
  language: zh_hans
  text: 你看这种疑惑不定：它是邪恶而愚昧的，使许多人从信仰中连根拔起，甚至连那些十分忠信、刚强的人也不例外。因为这种疑惑不定是魔鬼的女儿，它极其恶毒地对待上帝的仆人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: 三心二意
  rationale: 字面涉及“两个心/魂”的分裂状态；此处尤指向上帝祈求时疑惑动摇。用现代汉语“三心二意”保留内心不专一与摇摆之意，并与本命令上下文相合。
- source_word: βλέπε
  choice: 你要当心
  rationale: 此处不只是视觉上的“看”，而是警戒并留意这种危险，译作“当心”更自然准确。
- source_word: ἐκριζοῖ ἀπὸ τῆς πίστεως
  choice: 使……连根脱离信仰
  rationale: 保留ἐκριζόω“连根拔除”的强烈意象，也明确ἀπό所表达的脱离。
- source_word: λίαν πιστοὺς καὶ ἰσχυρούς
  choice: 信心坚定、刚强的人
  rationale: πιστούς可指“忠信的”或“有信心的”；上下文反复讨论信心与疑惑，因此采用“信心坚定”，同时保留ἰσχυρούς的“刚强”。
- source_word: θυγάτηρ ἐστὶ τοῦ διαβόλου
  choice: 是魔鬼的女儿
  rationale: 保留原文人格化的亲属隐喻，不将其弱化为抽象的“来自魔鬼”。
- source_word: πονηρεύεται εἰς
  choice: 恶毒地加害
  rationale: 该表达指向对上帝仆人的邪恶活动或图谋；“加害”自然呈现其敌对指向，同时避免过度具体化行为方式。
theological_decisions:
- issue: “信心坚定、刚强的人”是否暗示真正有信心者会彻底失去信仰
  choice: 按原文保留“三心二意使人脱离信仰”的严厉警告
  alternative: 将其解释性弱化为“使人在信仰上动摇”
  rationale: ἐκριζοῖ ἀπὸ τῆς πίστεως是强烈的“从信仰中连根拔出”意象；译文不预先用特定教义体系消解这一张力。
- issue: 魔鬼之“女儿”的人格化语言
  choice: 直译并保留人格化隐喻
  alternative: 译作“这种三心二意出于魔鬼”
  rationale: 原文将διψυχία拟人化为魔鬼的女儿，具有修辞和神学力度，应予保存。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号衔接警戒与理由，保留原文重复的“这种三心二意”，使人格化主题清晰。
