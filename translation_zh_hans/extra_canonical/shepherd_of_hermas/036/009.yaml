revisions:
- from: 你要当心这种三心二意；它既邪恶又愚昧，使许多人连根脱离信仰，甚至连那些信心坚定、刚强的人也不例外。因为这种三心二意是魔鬼的女儿，极其恶毒地加害上帝的仆人。
  to: 你看这种疑惑不定：它是邪恶而愚昧的，使许多人从信仰中连根拔起，甚至连那些十分忠信、刚强的人也不例外。因为这种疑惑不定是魔鬼的女儿，它极其恶毒地对待上帝的仆人。
  rationale: 修订βλέπε的语气，改善“连根拔起”意象在现代汉语中的表达，并以“疑惑不定”明确本段所论的祈求时的内心摇摆；其余保留原文的严厉警告、人格化修辞和对上帝仆人的敌对行动。
