review_pass:
  verdict: revise
  source_fidelity: 草稿整体准确保留了διψυχία的危险性、从信仰中被“连根拔起”的强烈意象，以及“魔鬼的女儿”这一人格化隐喻。不过，βλέπε在此首先是提示听者观看、注意眼前所说之事（“看/你看”），而非直接命令其“当心”；后者把语气加强为警告。另，“连根脱离信仰”在汉语中搭配不够自然，宜调整以保留原文的拔根意象。
  naturalness: “三心二意”可表达内心摇摆，但现代汉语常主要指用情或做事不专一；本段特指对上帝及祈求的疑惑摇摆。“疑惑不定”在此更明确，也使其拟人化为“魔鬼的女儿”的上下文更易理解。
  terminology: 保留“上帝”“信仰”“魔鬼”“上帝的仆人”。将λίαν πιστούς译为“十分忠信的”较贴近原文及英文审校轨迹，避免将其限定解释为心理状态上的“信心坚定”。
