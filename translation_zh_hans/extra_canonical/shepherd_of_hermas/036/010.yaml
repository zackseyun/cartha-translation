base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/010.yaml
  text: Therefore despise double-mindedness and master it in every matter, having put on the strong and mighty faith. For faith promises all things and accomplishes all things, but double-mindedness, because it does not trust, fails in all the works that it does.
translation:
  language: zh_hans
  text: 所以，你要藐视三心二意，在凡事上制伏它，穿上刚强有力的信心。因为信心应许一切，也成就一切；三心二意却因对自己没有把握，在它所做的一切事上都失败。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: 三心二意
  rationale: 此词字面涉及“两个心灵”，在本段指信心动摇、迟疑不定；“三心二意”是现代汉语中自然且易懂的对应表达，并保留其人格化用法。
- source_word: κατακυρίευσον
  choice: 制伏
  rationale: 表达取得支配权、将其置于控制之下，比单纯“克服”更贴近原词的强势语气。
- source_word: ἐνδυσάμενος
  choice: 穿上
  rationale: 保留原文以衣服为喻的鲜明意象。
- source_word: ἰσχυρὰν καὶ δυνατήν
  choice: 刚强有力
  rationale: 分别体现两个近义形容词的叠加强调，同时保持汉语流畅。
- source_word: πάντα ἐπαγγέλλεται, πάντα τελειοῖ
  choice: 应许一切，也成就一切
  rationale: 直接保留信心被人格化为“应许”并“成就”的表述，不将主语改成上帝，也不缩小“凡事”的范围。
- source_word: μὴ καταπιστεύουσα ἑαυτῇ
  choice: 因不信任自己
  rationale: 保留原文反身代词和人格化结构；虽语义略显反常，却忠实呈现三心二意本身缺乏确信的形象。
- source_word: ἀποτυγχάνει
  choice: 失败
  rationale: 准确表达未能达到目标、不能成功之意。
theological_decisions:
- issue: “信心应许一切，也成就一切”的施事者表述
  choice: 保留“信心”为应许和成就的主语
  alternative: 改写为“凭信心可以领受上帝所应许并成就的一切”
  rationale: 原文明确将信心人格化；改写会加入原文未明说的施事关系，并可能提前化解其神学张力。
- issue: “一切”的范围
  choice: 不添加祈求合乎上帝旨意等限定
  alternative: 将其解释性缩窄为“一切合宜的祈求”
  rationale: 本句使用绝对表达，具体理解应由本段上下文共同限定；译文不宜自行加入宗派性或解释性条件。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话；保留“穿上信心”以及信心、三心二意被人格化的修辞。句式分为命令与理由两层，便于普通读者朗读和理解。
