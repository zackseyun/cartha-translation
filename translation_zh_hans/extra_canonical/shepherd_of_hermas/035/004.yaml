review_pass:
  verdict: revise
  source_fidelity: “禁绝”不准确地表达了ἐγκρατεύεσθαι ἀπό所要求的个人自制、远离／不去行；中文也容易理解为禁止或废除某种行为。末句的τὰ ἀκόλουθα τούτων只是“接下来（与这些相关）的话／事”，原文在本节未明说“恶行”，不宜补入。其余句意基本相符。
  naturalness: “不禁绝这些事的人”在现代汉语中不自然，且主语与“禁绝”的搭配不当。“不能向神而活”虽可勉强理解，但“不能为神而活”更自然、庄重，并可传达ζῆσαι τῷ θεῷ的关系性表达。
  terminology: 将ἐγκρατεύεσθαι ἀπό统一译为“远离”，在此恶行语境中明确表示自我约束而不去行。保留“神的仆人”“行为”等合宜用语。
  issues:
  - severity: medium
    issue: “禁绝”误表ἐγκρατεύεσθαι ἀπό。
    rationale: 原文指人对恶行实行自制、远离而不去做，并非禁止、取缔或消灭这些行为。
  - severity: medium
    issue: 末句增译“恶行”。
    rationale: τὰ ἀκόλουθα τούτων意为“接下来的事／随后的内容”；虽然下段确实继续列举恶事，本节原文未附“恶”这一限定，不应在正文补足。
  - severity: low
    issue: “不能向神而活”不够自然。
    rationale: “为神而活”是现代汉语中较自然的庄重表达，且不把原文的与格关系具体化为单一的教义性解释。
  revised_text: 这些行为是人类生活中最邪恶的。因此，神的仆人必须远离这些行为；因为不远离这些行为的人，不能为神而活。现在，也要听听接下来有关这些事的话。
