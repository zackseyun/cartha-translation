revisions:
- from: 这些行为在人类生活中是最邪恶的。因此，神的仆人必须禁绝这些行为；因为不禁绝这些事的人，不能向神而活。现在，也要听听随这些事而来的恶行。
  to: 这些行为是人类生活中最邪恶的。因此，神的仆人必须远离这些行为；因为不远离这些行为的人，不能为神而活。现在，也要听听接下来有关这些事的话。
  rationale: 修订以“远离”准确表达针对恶行的自我克制，避免“禁绝”的禁止／取缔义；末句不增添原文未明说的“恶行”，改为自然地指向下文的后续内容；并将“向神而活”调整为更合现代汉语表达的“为神而活”。
