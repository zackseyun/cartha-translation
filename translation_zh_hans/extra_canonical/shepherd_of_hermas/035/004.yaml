base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/004.yaml
  text: “These deeds are the most evil of all in the life of human beings. From these works, then, the servant of God must exercise self‑control; for the one who does not exercise self‑control from these is not able to live to God. Listen, then, also to the things that follow these.”
translation:
  language: zh_hans
  text: 这些行为是人类生活中最邪恶的。因此，神的仆人必须远离这些行为；因为不远离这些行为的人，不能为神而活。现在，也要听听接下来有关这些事的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔργα
  choice: 行为
  rationale: 在此指前文列举的具体恶行；译作“行为”自然，并保留实践层面的含义。
- source_word: ἐγκρατεύεσθαι ἀπό
  choice: 禁绝
  rationale: 该结构指克制自己、不去行某事；“禁绝”比单纯“节制”更清楚地表达远离这些恶行，同时保留自我约束的意味。
- source_word: ζῆσαι τῷ θεῷ
  choice: 向神而活
  rationale: 保留与格短语的方向及归属意味，避免具体化为未经原文明确说明的“蒙神悦纳”或“为神而活”。
- source_word: τὰ ἀκόλουθα τούτων
  choice: 随这些事而来的恶行
  rationale: 结合下一节继续列举恶行的语境，将省略的类别补明为“恶行”；“随……而来”保留 ἀκόλουθα 的关联含义。
theological_decisions:
- issue: “不能向神而活”的含义
  choice: 保留“向神而活”这一较为直译且开放的表达
  alternative: 不能为神而活／不能在神面前存活
  rationale: 原文 ζῆσαι τῷ θεῷ 可涵盖为神而活、归向神而活或在与神的关系中活着；正文不把这种神学张力限定为单一解释。
- issue: 自制与禁欲主义的关系
  choice: 按上下文译为针对恶行的“禁绝”
  alternative: 实行禁欲／操练节制
  rationale: 原文所要求的是不行列举的恶事，并非倡导对一切受造之物的普遍禁欲。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文反复出现的“行为／这些事”以及“向神而活”的神学措辞；末句依据后文语境适度补出“恶行”，使段落在中文中指向清楚。
