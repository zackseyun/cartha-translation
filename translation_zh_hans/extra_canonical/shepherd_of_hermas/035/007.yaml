base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/007.yaml
  text: '“But the things from which you must not exercise self‑control,” he says, “but rather do them—listen: Do not exercise self‑control with regard to the good, but do it.”'
translation:
  language: zh_hans
  text: 他说：“至于那些你不该克制自己不去做、反而应当去做的事，你要听好：不要克制自己不去行善，而要行善。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκρατεύου
  choice: 克制／克制自己不去
  rationale: 本段以同一词根对恶与善作反向运用。汉语若只说“不要克制善”不够自然，因此在末句补出语境所含的“不去”，既保留关键词的重复，也清楚表达不可抑制行善。
- source_word: τὸ ἀγαθόν
  choice: 行善
  rationale: 原文名词性表达意为“善／善事”，但与 ποιεῖν（做）连用时，现代汉语自然表达为“行善”。
- source_word: ἄκουε
  choice: 你要听好
  rationale: 保留命令语气，并以自然、庄重的现代汉语提示下文的重要训诲。
theological_decisions:
- issue: “节制／克制”用于善行时的悖论性措辞
  choice: 译作“不要克制自己不去行善”
  alternative: “不要在善事上节制”
  rationale: 原文刻意沿用 ἐγκρατεύεσθαι，形成对恶应克制、对善不应克制的张力；所选译法保留该张力，同时避免读者误解为一般意义上反对节制。
translation_notes:
  register: 采用现代、庄重且易懂的对话体；保留原文“他说”与“你要听好”的训诲语气。无脚注。
