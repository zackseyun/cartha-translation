  to: 他说：“至于那些你不该克制自己不去做、反而应当去做的事，你要听好：不要克制自己不去行善，而要行善。”
  rationale: 修订仅澄清首句中“克制”的施事和所抑制的行动，并删除原文未明示的“又”。保留同一关键词在两句中的重复，以及“不可抑制行善、应当行善”的训诲语气。
