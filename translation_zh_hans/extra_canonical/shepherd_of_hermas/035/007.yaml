review_pass:
  verdict: revise
  source_fidelity: 原文以“对善不应ἐγκρατεύεσθαι（克制／自我约束）”这一刻意反常的说法，与前文“克制不作恶”相对。草稿末句准确说明其实际含义，即不可克制自己而不去行善。首句“那些你不该克制、反而应当去做的事”则可能被理解为“不该克制那些事”，而非“不该克制自己不去做那些事”。
  naturalness: 整体为现代、庄重的普通话。将首句补足“自己不去做”，可使其与后句的解释一致，避免宾语关系含混。“他又说”中的“又”不见于本节原文，删去更稳妥。
  terminology: “克制自己不去行善”恰当地处理ἐγκρατεύεσθαι在此处的修辞性反转；“行善”可自然对应τὸ ἀγαθόν与ποιεῖν的组合。无需脚注。
  issues:
  - severity: medium
    issue: 首句“你不该克制、反而应当去做的事”句法指向略含混。
    rationale: 原文所否定的是“克制自己不去做”善事，不是对“事物”本身施行克制。补出“自己不去做”可忠实呈现原文的反向用法。
  - severity: low
    issue: “又”缺乏本节原文依据。
    rationale: φησίν仅为“他说”；虽上下文或许容许“又说”，但本节无需添加该连接意义。
  revised_text: 他说：“至于那些你不该克制自己不去做、反而应当去做的事，你要听好：不要克制自己不去行善，而要行善。”
