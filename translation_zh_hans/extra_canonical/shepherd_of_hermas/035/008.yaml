  - severity: medium
    issue: “服事它们”不够自然。
    rationale: δουλεύσω αὐτοῖς确以“善的事”为对象，但汉语“服事”通常搭配人、神或机构；“奉行它们”能保留对这些善事的投入和顺服，且不改变对象。
