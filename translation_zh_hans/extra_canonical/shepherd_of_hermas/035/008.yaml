  source_fidelity: 译文整体准确传达了第8节的请求、伦理性的“行在其中”、对善事的服事，以及实行善事与“能够得救”之间未经展开的关联。惟“善事所包含的行为”略将τῶν ἀγαθῶν τὰ ἔργα处理成善事内部所含的行为；原文更直接指“善的行为／善行”。
  naturalness: “服事它们”虽近于字面，却在现代汉语中颇显突兀，易被理解为服侍某些有生命的对象。“奉行它们”既保留αὐτοῖς以善事为对象，也更符合现代庄重汉语。“不可克制自己不去做”可简化为“不可克制自己不做它们”，意思更清楚。
  terminology: 保留“善事”“得救”“行在其中”。“力量”可保留τὴν δύναμιν的宽泛性，避免把它限定为“意义”“功效”或特定神学解释。
