  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/008.yaml
  text: “And of the good things, Lord,” I say, “declare to me their power, so that I may walk in them and serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works of the good, which you must do and not exercise self‑control from.
translation:
  language: zh_hans
  text: “主啊，”我说，“也请向我说明这些善事的力量，好让我行在其中，并奉行它们；这样，我实行这些善事，就能得救。”他说：“你要听听善行，就是你必须实行、不可克制自己不做的事。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不可克制自己不做”直译为“不要节制（或戒绝）这些事”。本章反复以“节制”作对举：对恶事应当节制，不去做；对善事却不可“节制”而不做。
    reason: 说明ἐγκρατεύεσθαι在本章的特殊对举，避免读者把“节制”一概理解为对任何行为都应当克制。
lexical_decisions:
- source_word: τῶν ἀγαθῶν
  choice: 这些善事
  rationale: 此处指前文所说应当实行的“善”，兼具善良之事与善行的含义；译作“善事”比抽象的“善物”更符合现代汉语。
- source_word: τὴν δύναμιν
  choice: 力量
  rationale: 保留原文对善事之能力、效力或意义的概括表达，不将其窄化为某一种解释。
- source_word: πορευθῶ ἐν αὐτοῖς
  choice: 行在其中
  rationale: 保留原文“在其中行走”的伦理生活隐喻，同时采用读者可以理解的庄重表达。
- source_word: δουλεύσω αὐτοῖς
  choice: 服事它们
  rationale: 原文确实以善事为间接宾语，表达较为突兀；直译以保存修辞和语义张力，不改写成“献身行善”等解释性说法。
- source_word: σωθῆναι
  choice: 得救
  rationale: 准确保留被动不定式的救赎用语，不擅自说明施救者或具体救赎机制。
- source_word: τῶν ἀγαθῶν τὰ ἔργα
  choice: 善事所包含的行为
  rationale: 避免生硬的“善的工作”，表达“属于善的诸种行为”，并与后文具体善行清单衔接。
theological_decisions:
- issue: 实行善事与得救之间的关系
  choice: “这样，我实行这些善事，就能得救”
  alternative: “借着实行这些善事，我就配得救恩”或“得救以后便能实行这些善事”
  rationale: 原文以目的结构将实行善事和“能够得救”相连，但没有详述功德、恩典、先后次序或因果机制；译文保留这种联系而不加入宗派性解释。
- issue: “服事它们”的对象
  choice: 保留善事作为“服事”的对象
  alternative: 改写为“献身于这些善事”或“借此服事上帝”
  rationale: 原文 αὐτοῖς 的自然先行词是“善事”；虽不符合通常神学措辞，仍应保存作者独特表达，不替作者转换对象。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“行在其中”略带古典伦理隐喻，以保存原文意象；其余句法适度现代化。保留“服事它们”这一不寻常表达及善行与得救之间未被解释的神学张力。
