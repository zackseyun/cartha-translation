  to: 我说：“主啊，还有恶行吗？”他说：“确实还有许多，是上帝的仆人必须禁戒的：偷窃、说谎、侵夺、作伪证、贪婪、邪恶的欲望、欺骗、虚荣、自夸，以及一切诸如此类的事。”
  rationale: 修订仅处理原文未明示的“别的”、ἀποστέρησις的语义范围及ψευδομαρτυρία的现代固定表达；其余措辞保留，以维持原有庄重、清晰的现代普通话风格和清单节奏。
