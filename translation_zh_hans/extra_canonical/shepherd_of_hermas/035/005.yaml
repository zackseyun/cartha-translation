base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/005.yaml
  text: '“Are there still,” I say, “Lord, evil works?” “Indeed, there are many,” he says, “from which the servant of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil desire, deceit, vainglory, boastfulness, and whatever things are like these.”'
translation:
  language: zh_hans
  text: 我说：“主啊，还有恶行吗？”他说：“确实还有许多，是上帝的仆人必须禁戒的：偷窃、说谎、侵夺、作伪证、贪婪、邪恶的欲望、欺骗、虚荣、自夸，以及一切诸如此类的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι
  choice: 禁戒
  rationale: 此处指克制自己、不去行各样恶事；“禁戒”既保留自我约束之意，也适合后接恶行清单。
- source_word: κλέμμα
  choice: 偷窃
  rationale: 指偷盗行为或赃取之物；在恶行清单中译作行为名词“偷窃”最自然。
- source_word: ἀποστέρησις
  choice: 侵占
  rationale: 指剥夺他人应得之物、欺诈性扣留或侵夺；“侵占”保留较宽泛的财物侵夺含义，不与后面的“欺骗”重复。
- source_word: πλεονεξία
  choice: 贪婪
  rationale: 表达贪求更多、占有欲过盛的伦理含义。
- source_word: κενοδοξία
  choice: 虚荣
  rationale: 字面涉及空虚的荣耀，指追求虚浮名望。
- source_word: ἀλαζονεία
  choice: 自夸
  rationale: 指夸耀、狂妄自负；与“虚荣”并列时译作“自夸”可体现二者差别。
theological_decisions:
- issue: κύριε在对话中的称谓
  choice: 主啊
  alternative: 先生／大人
  rationale: 《赫尔马牧人》的异象与训诫语境中，这是对权威启示者的尊称；“主啊”保留传统宗教语域，但不进一步断定说话者的神学身份。
- issue: τοῦ θεοῦ的译名
  choice: 上帝的
  alternative: 神的
  rationale: 采用现代中文中庄重且普通读者易懂的称谓，不增加宗派性解释。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话；保留问答形式和恶行清单的节奏。将“确实还有许多”置于回答开头，以自然呈现καί γε πολλά的强调。
