base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/009.yaml
  text: '“First of all: faith, fear of the Lord, love, concord, words of righteousness, truth, endurance—there is nothing better than these in the life of human beings. If someone keeps these and does not exercise self‑control from them, he becomes blessed in his life.'
translation:
  language: zh_hans
  text: “首先是信心、敬畏主、爱、和睦、公义的话、真理、忍耐；在人类的生活中，没有什么比这些更美好。人若持守这些，也不自我克制而远离这些，他的一生就是有福的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: 信心
  rationale: 保留该词在早期基督教伦理语境中兼具信靠与忠信意味的常用译法。
- source_word: φόβος κυρίου
  choice: 敬畏主
  rationale: φόβος 在此指对主敬畏而非单纯恐惧；采用现代中文宗教语境中自然且准确的表达。
- source_word: ὁμόνοια
  choice: 和睦
  rationale: 表达同心一致、彼此和谐的关系；“和睦”较自然，也不把含义限缩为思想完全相同。
- source_word: ῥήματα δικαιοσύνης
  choice: 公义的话
  rationale: 贴近复数 ῥήματα 与属格 δικαιοσύνης，不擅自改释为教训、言论或判语。
- source_word: ὑπομονή
  choice: 忍耐
  rationale: 涵盖在困难中坚持与承受的含义，符合本段德目清单的语体。
- source_word: φυλάσσῃ
  choice: 持守
  rationale: 既保留守护、遵守之意，也适合这些德目作为持续实践对象的语境。
- source_word: μὴ ἐγκρατεύηται ἀπ᾿ αὐτῶν
  choice: 不克制自己去行这些事
  rationale: 原文刻意反转“节制/克制”的通常对象，意为不应抑制这些善行；译文保留这种修辞张力，同时补出“去行”以使现代中文可懂。
- source_word: μακάριος
  choice: 有福的
  rationale: 保留宗教伦理语境中的福乐与蒙福意味，而不弱化为一般的“幸福”。
theological_decisions:
- issue: “信心”是否应译作“忠信”
  choice: 信心
  alternative: 忠信
  rationale: 此处 πίστις 单列为首要德目，原文未明确限定为人的忠诚行为或信靠内容；采用较宽泛的“信心”，保留语义空间。
- issue: μακάριος 是否表达神的赐福
  choice: 有福的
  alternative: 幸福的
  rationale: “有福”保留可能的神学含义，但不额外补入“蒙神赐福”，避免超出原文。
- issue: ἐγκρατεύηται 的反常搭配
  choice: 保留“克制”概念并说明是不克制自己去行善
  alternative: 不停止行这些事
  rationale: 本命令全段围绕 ἐγκράτεια 的双重用法展开；若只译作“不停止”，会丢失作者刻意形成的伦理悖论和上下文呼应。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。德目列表尽量保持希腊原文的并列结构；分号呈现由清单转入评价的语义层次。未添加原文没有的解释性脚注。
