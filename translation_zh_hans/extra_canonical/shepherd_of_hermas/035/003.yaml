revisions:
- from: 我问：“主啊，我们应当戒绝的是哪些恶事呢？”他说：“你听：要戒绝通奸、淫乱、无法无天的醉酒、邪恶的奢靡、贪食、财富带来的铺张，以及夸口、自高、自大；也要戒绝说谎、毁谤、虚伪、记恨和一切亵渎的话。”
  to: 我问：“主啊，我们应当戒绝的是哪些恶事呢？”他说：“你听：要戒绝通奸、淫乱、不法的醉酒、邪恶的奢靡、过多的食物、财富的奢华，以及夸口、自高、自大；也要戒绝说谎、毁谤、虚伪、记恨和一切亵渎的话。”
  rationale: 修订仅收回两处原文未明示的解释性限定：以“过多的食物”对应“许多食物”，以“财富的奢华”保留属格关系的开放性。其余用语保留，因为均与希腊原文及英文审校轨迹相符，且符合现代标准汉语的庄重对话体。
