base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/003.yaml
  text: '“What kinds, Lord,” I say, “are the wickednesses from which we must exercise self‑control?” “Listen,” he says: “From adultery and fornication, from lawless drunkenness, from wicked luxury, from many foods and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying and slander and hypocrisy, resentment, and every blasphemy.'
translation:
  language: zh_hans
  text: 我问：“主啊，我们应当戒绝的是哪些恶事呢？”他说：“你听：要戒绝通奸、淫乱、不法的醉酒、邪恶的奢靡、过多的食物、财富的奢华，以及夸口、自高、自大；也要戒绝说谎、毁谤、虚伪、记恨和一切亵渎的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρίαι
  choice: 恶事
  rationale: 此处指需要戒绝的各种邪恶行为；译作“恶事”比抽象的“邪恶”更自然，也与随后列举的行为相衔接。
- source_word: ἐγκρατεύεσθαι
  choice: 戒绝
  rationale: 原词在本段表示自我节制、避免参与某些恶行；“戒绝”简洁地传达持续克制并远离的含义。
- source_word: μοιχείας καὶ πορνείας
  choice: 通奸、淫乱
  rationale: 分别保留婚约关系内的不忠与较广义的性不道德，不将两词合并。
- source_word: μεθύσματος ἀνομίας
  choice: 无法无天的醉酒
  rationale: 保留属格结构可能表达的性质修饰，使ἀνομία的强烈道德与秩序含义不被弱化。
- source_word: τρυφῆς πονηρᾶς
  choice: 邪恶的奢靡
  rationale: τρυφή指纵情享乐、奢华生活；“奢靡”兼顾放纵与奢华的负面色彩。
- source_word: ἐδεσμάτων πολλῶν
  choice: 贪食
  rationale: 字面为“许多食物”，语境中所谴责的是饮食过度；“贪食”比“许多食物”更符合自然汉语且保留伦理指向。
- source_word: πολυτελείας πλούτου
  choice: 财富带来的铺张
  rationale: 保留“财富”与“奢费、铺张”之间略有弹性的属格关系，不强行限定为单一语法解释。
- source_word: καυχήσεως καὶ ὑψηλοφροσύνης καὶ ὑπερηφανίας
  choice: 夸口、自高、自大
  rationale: 以三个相近而有区分的汉语词保留原文逐项累加的修辞。
- source_word: καταλαλιᾶς
  choice: 毁谤
  rationale: 表示在背后恶言中伤；“毁谤”在现代汉语中庄重而易懂。
- source_word: μνησικακίας
  choice: 记恨
  rationale: 原词指牢记所受的恶并怀怨；“记恨”较“怨恨”更明确保留不肯忘却冒犯的意味。
- source_word: πάσης βλασφημίας
  choice: 一切亵渎的话
  rationale: βλασφημία可指亵渎、辱骂或恶言；此处采用其宗教伦理色彩较强的含义，并用“的话”使汉语表达自然。
theological_decisions:
- issue: βλασφημία所指对象未明
  choice: 译为“一切亵渎的话”，不补出亵渎上帝或人的明确对象
  alternative: 一切辱骂／一切亵渎上帝的话
  rationale: 希腊文本没有明说对象；不增补对象可保留其可能涵盖亵渎与恶言的语义张力。
- issue: 罪恶清单中近义骄傲用语的关系
  choice: 分别译出“夸口、自高、自大”
  alternative: 合并为“各种骄傲”
  rationale: 逐项保留原文能呈现作者有意累积的伦理强调，避免以系统化分类消解文本的重复与张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事对话体。清单以顿号和分号分层，既保留希腊文连续列举的节奏，也避免现代读者误读修饰关系。未添加原文没有的神学限定。
