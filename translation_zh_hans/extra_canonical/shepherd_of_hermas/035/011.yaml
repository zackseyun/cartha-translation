  - severity: medium
    issue: “向上帝而活”不符合现代汉语常用搭配。
    rationale: 虽然试图逐字保留与格，但中文“向……而活”语义不稳。“为上帝而活”可自然表达归向/归属关系，且不把短语限定为“得生命”或特定救恩理论。
