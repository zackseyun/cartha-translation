  naturalness: “行在这些事上”和“向上帝而活”带有生硬的欧化痕迹；“照着这些去行”及“为上帝而活”在现代庄重普通话中更自然。为避免“不要克制自己不去做”可能短暂造成句法歧义，可明确其宾语为“这些事”。
  terminology: “主”“上帝”使用一致且合宜。“克制自己”可保留本段对ἐγκρατεύομαι（节制/自制）的反常用法；补足“不做这些事”使其与上下文的修辞对照清楚。
