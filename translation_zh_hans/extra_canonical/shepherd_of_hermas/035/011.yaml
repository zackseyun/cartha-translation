base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/011.yaml
  text: “Do these seem to you to be good?” “What, Lord, is better than these?” I say. “Go, then,” he says, “walk in them and do not exercise self‑control from them, and you will live to God.
translation:
  language: zh_hans
  text: 他问：“你看这些事是好的吗？”我说：“主啊，还有什么比这些更好呢？”他说：“那么，你要照着这些去行，不要克制自己不做这些事，就必为上帝而活。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύου ἐν αὐτοῖς
  choice: 行在这些事上
  rationale: 保留原文“在其中行走”的伦理性隐喻，同时符合中文宗教文本的庄重表达。
- source_word: μὴ ἐγκρατεύου ἀπ᾿ αὐτῶν
  choice: 不要克制自己不去做
  rationale: 本段刻意反转“节制”的通常用法；译文保留这种张力，并补出“不去做”以使现代中文语义清楚。
- source_word: ζήσῃ τῷ θεῷ
  choice: 向上帝而活
  rationale: 保留与格短语可能表达的归向、为着上帝而活之意，不将其简化为泛泛的“得生命”。
- source_word: Τί γάρ ... τούτων ἀγαθώτερον
  choice: 还有什么比这些更好呢
  rationale: 以自然的中文反问再现原文，表达说话者认定没有什么比这些更好。
theological_decisions:
- issue: ζῆν τῷ θεῷ 的含义
  choice: 向上帝而活
  alternative: 为上帝而活／在上帝面前活着
  rationale: “向上帝而活”较直接地保留希腊语与格的开放性，避免限定为单一的工具、目的或关系含义。
- issue: 善行与生命之间的关系
  choice: 保留“行……就必向上帝而活”的条件式表述
  alternative: 解释为善行证明已经得救
  rationale: 原文直接将践行这些善事与“向上帝而活”相连；译文不额外加入因果体系或宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留问答结构及本章围绕“克制”展开的修辞反转。
