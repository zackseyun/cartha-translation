revisions:
- from: 所以，你要遵守这条诫命：如果你行善，并不克制自己去远离善事，你就会向上帝而活；凡这样行的人，也都会向上帝而活。再者，如果你不作恶，克制自己远离恶事，你就会向上帝而活；凡遵守这些诫命、按着它们行事的人，也都会向上帝而活。
  to: 所以，你要遵守这条诫命：如果你行善，不自我克制而不去行善，你就会为上帝而活；凡这样行的人，也都会为上帝而活。再者，如果你不作恶，自我克制而不作恶，你就会为上帝而活；凡遵守这些诫命并按着它们而行的人，也都会为上帝而活。
  rationale: 修订集中处理“自制”与“善／恶”的对象关系，使两句条件句在现代汉语中可读，并保留原文刻意形成的对照：不可因自制而停止行善，却应以自制拒绝作恶。将“向上帝而活”调整为“为上帝而活”，提高现代汉语自然度而不加入关于生命性质或救恩机制的解释。无须脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:50:20Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体保留了命令、两个条件句及末尾复数“这些诫命”的结构。可是“并不克制自己去远离善事”把原文的否定命令性表述译得不够自然，且“克制自己远离恶事”在汉语中易被理解为克制自己这一行为，而非自我约束以不作恶。应更清楚表达ἐγκρατεύεσθαι ἀπό的反常搭配：对善不可‘自制而不做’，对恶则须自制不做。
  naturalness: “向上帝而活”略显生硬，但可作为保留τῷ θεῷ关系义的谨慎译法。以“为上帝而活”较合现代汉语，并仍可保留其归属／关系含义；不应擅自译作“得救”。“并不克制自己去远离善事”不符合自然搭配，宜改为“不自我克制而不去行善”。
  terminology: “诫命”“行善”“作恶”“上帝”均适切。为维持本段反复的ἐγκρατεύομαι，采用“自我克制”并在两处以“不去行善／不作恶”明确其所限制的动作。
  issues:
  - severity: medium
    issue: “并不克制自己去远离善事”语义和句法不清
    rationale: ἐὰν τὸ ἀγαθὸν ποιῇς καὶ μὴ ἐγκρατεύσῃ ἀπ᾿ αὐτοῦ直指‘行善，并不克制自己而离开／不做它’。草稿的“克制自己去远离”容易把“去远离”当作被鼓励的目的动作，未清楚呈现原文反常的‘克制而不做善’。
  - severity: medium
    issue: “克制自己远离恶事”搭配含混
    rationale: ἐγκρατεύσῃ ἀπ᾿ αὐτοῦ在此意为自制以不做恶；补出“不作恶”可使中文明确，同时保留原文将自制与远离对象并列的表达。
  - severity: low
    issue: “向上帝而活”不够现代自然
    rationale: 该措辞虽试图保留与格的开放性，却不合现代普通话常规。‘为上帝而活’较自然，且不将其缩窄为某一种救恩机制。
  revised_text: 所以，你要遵守这条诫命：如果你行善，不自我克制而不去行善，你就会为上帝而活；凡这样行的人，也都会为上帝而活。再者，如果你不作恶，自我克制而不作恶，你就会为上帝而活；凡遵守这些诫命并按着它们而行的人，也都会为上帝而活。
  revised_footnotes: []
