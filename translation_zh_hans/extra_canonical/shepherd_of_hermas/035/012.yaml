base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/012.yaml
  text: “Therefore keep this commandment. If you do the good and do not exercise self‑control from it, you will live to God—and all who act in this way will live to God. And again, if you do not do the evil and exercise self‑control from it, you will live to God; and all will live to God—whoever keeps these commandments and walks in them.”
translation:
  language: zh_hans
  text: 所以，你要遵守这条诫命：如果你行善，不自我克制而不去行善，你就会为上帝而活；凡这样行的人，也都会为上帝而活。再者，如果你不作恶，自我克制而不作恶，你就会为上帝而活；凡遵守这些诫命并按着它们而行的人，也都会为上帝而活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: 遵守
  rationale: 在“诫命”的语境中表示谨守、持守，以现代汉语“遵守”最自然。
- source_word: ἐγκρατεύσῃ ἀπ᾿ αὐτοῦ
  choice: 克制自己去远离善事／克制自己远离恶事
  rationale: 保留ἐγκρατεύομαι“实行克制”的核心意义，也呈现ἀπό所表达的远离对象；善事与恶事形成原文刻意的悖论式对照。
- source_word: ζήσῃ τῷ θεῷ
  choice: 向上帝而活
  rationale: 保留与格τῷ θεῷ可能具有的方向、归属或关系含义，不径自化约为“靠上帝活着”或“得救”。
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: 按着它们行事
  rationale: 希腊语字面为“行走在其中”，此处指按诫命生活；译文采用自然汉语，同时保留实践性的含义。
theological_decisions:
- issue: ζῆν τῷ θεῷ的神学含义
  choice: 向上帝而活
  alternative: 为上帝而活／在上帝面前活着／得以存活
  rationale: 原文没有明说这是称义、永生还是今世敬虔生活；“向上帝而活”保留其关系性和末世性张力。
- issue: 行善、戒恶与“向上帝而活”的关系
  choice: 维持原文条件句的直接陈述
  alternative: 加入“从而得救”或“借此赚得生命”等解释
  rationale: 文本确实以ἐάν条件句连接行为与生命，但没有进一步界定因果机制；不加入特定宗派的功德论或恩典论解释。
- issue: 单数“这条诫命”与复数“这些诫命”
  choice: 分别保留单数和复数
  alternative: 统一译作单数或复数
  rationale: 原文先用τὴν ἐντολὴν ταύτην，末尾则用ταύτας τὰς ἐντολάς；虽数的转换可能涉及本命令中的多项要求，译文不替作者消除这种变化。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。保留本段反复出现的“向上帝而活”及善恶两面的平行结构，以反映希腊原文的劝诫节奏；不用古雅的“汝”“尔”等表达。
