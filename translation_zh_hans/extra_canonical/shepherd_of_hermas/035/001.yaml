review_pass:
  verdict: revise
  source_fidelity: 原文的 εἶπόν 是回指先前所说的话，译为“我曾告诉你”比“我已经告诉过你”更中性。ἐπὶ τινων ἐγκρατεύεσθαι 的对象关系不宜译成“克制某些事”，因为汉语容易理解为控制事物本身；应明确为“对于……自制”，同时保留原文未在本节展开的语义。διπλᾶ 依上下文译为“有两类”可接受。
  naturalness: 修订后采用“对于有些事……对于有些事则……”的平行结构，既自然又准确；“自制有两类”在现代庄重汉语中顺畅。
  terminology: “上帝”“自制”均可保留。此处“上帝所造的事物”忠实对应 τὰ κτίσματα τοῦ θεοῦ，且不预先将其释窄为人的行为或善恶类别。
  issues:
  - severity: medium
    issue: “有些事必须克制，有些事却不该克制”把介词短语式的“对于某些事自制”处理成直接“克制某些事”。
    rationale: 这在汉语中可能表示对那些事物本身加以控制，未清楚表达原文所说的在某些事项上应当有所节制、在另一些事项上不应节制。改为“对于……自制”可更准确保留原文结构和本节刻意的张力。
  - severity: low
    issue: “已经告诉过你”增添了原文未明示的完成性强调。
    rationale: εἶπόν 是简单回顾先前的话；“曾告诉你”在中文中足以表达这一点，且语气更中性。
