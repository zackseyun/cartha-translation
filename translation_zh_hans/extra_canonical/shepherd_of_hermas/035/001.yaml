base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/001.yaml
  text: “I said to you,” he says, “that the things created by God are twofold; for self‑control is twofold as well. For with regard to some things one must exercise self‑control, and with regard to others one must not.
translation:
  language: zh_hans
  text: 他说：“我曾告诉你，上帝所造的事物有两类；自制也有两类。因为对于有些事，人必须自制；对于有些事，则不必自制。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ κτίσματα τοῦ θεοῦ
  choice: 上帝所造的事物
  rationale: κτίσματα 可指受造之物或所造的事物；本段随即按善恶行为讨论克制与否，采用较宽泛的“所造的事物”，避免把含义限于具体生物。
- source_word: διπλᾶ
  choice: 分为两类
  rationale: 此处不是说性质上“双重”，而是由下文“有些……有些……”界定为两种类别。
- source_word: ἐγκράτεια
  choice: 自制
  rationale: 保留以内在节制和约束为核心的伦理含义；下句用动词“克制”使汉语表达自然。
- source_word: ἐγκρατεύεσθαι
  choice: 克制
  rationale: 在“对于某些事”的结构中译作“克制”最自然，也与后文克制恶事的命令相衔接。
- source_word: δεῖ
  choice: 必须／该
  rationale: 表达道德上的必要性；为避免汉语重复，前后分别使用“必须”和“该”，含义不变。
theological_decisions:
- issue: “上帝所造的事物分为两类”是否暗示受造界本体上有善恶二元
  choice: 按原文保留“分为两类”，不补充类别性质
  alternative: 意译为“人的行为分为善恶两类”
  rationale: 原文确实使用 κτίσματα τοῦ θεοῦ，且本句尚未明说善恶；不应在译文中提前化解其语义张力或改写为人的行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留直接引语中的转述语气；将希腊语重复的“他说”自然置于句首，避免生硬照搬插入式结构。
