  to: 我说：“大人[a]，请告诉我，有哪些事应当克制，有哪些事不应当克制。”他说：“你听：对于恶事，要克制，不可去做；对于善事，却不要克制，而要去做。因为你若克制而不行善，就是犯了大罪；你若克制而不作恶，就是成就了大义。因此，你要克制，远离一切恶事，并且行善。”
