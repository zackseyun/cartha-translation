review_pass:
  verdict: revise
  source_fidelity: 译文准确呈现本段关于恶与善的对照，以及“对恶节制、对善不可节制”的刻意反常表述。μως，“先生”给现代汉语读者的主要含义是教师，不是κύριε在此作为敬称的通常语义；“行了大义”也不是自然现代汉语，且未能恰当表达ἐργάζῃ δικαιοσύνην的“实行／成就义”的意思。
  naturalness: “克制自己”可理解，但反复与“对于……克制自己”的搭配稍显滞重。用“克制”保留关键词反复，同时使命令句更顺畅。“成就了大义”比“行了大义”更符合庄重的现代书面语。
  terminology: ἐγκρατεύεσθαι统一译为“克制”，保留原文修辞性重复；τὸ πονηρόν和τὸ ἀγαθόν分别译为“恶事”与“善事”。δικαιοσύνη译为“大义”，但以“成就”搭配，避免不自然的“行大义”。κύριε采用不预设神学身份的敬称“大人”，并以脚注说明其语义范围。
  issues:
  - severity: medium
    issue: “先生”不恰当地限定了κύριε的称谓含义。
    rationale: κύριε是敬称，可指主人、主或“大人／阁下”等，并不特指教师。“先生”在现代普通话中通常指教师或一般男性称谓，未反映此处对权威性说话者的敬称。
  - severity: medium
    issue: “你若克制自己而不作恶，就是行了大义”不够自然。
    rationale: “行大义”并非现代普通话的惯常搭配；原文ἐργάζῃ δικαιοσύνην强调实行或成就义。“成就了大义”既保留伦理力度，也更自然。
  - severity: low
    issue: “克制自己”在各处重复时略显笨重。
    rationale: 原文重复的是“节制／自制”动词本身；汉语直接用“克制”即可保留该重复，且与“不可去做”的宾语关系更清楚。
