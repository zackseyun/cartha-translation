  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/002.yaml
  text: '“Make it known to me, Lord,” I say, “with respect to what things one must exercise self‑control, and with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard to what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather, do it. For if you exercise self‑control so as not to do the good, you commit a great sin; but if you exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore exercise self‑control from every wickedness, doing the good.”'
translation:
  language: zh_hans
  text: 我说：“大人[a]，请告诉我，有哪些事应当克制，有哪些事不应当克制。”他说：“你听：对于恶事，要克制，不可去做；对于善事，却不要克制，而要去做。因为你若克制而不行善，就是犯了大罪；你若克制而不作恶，就是成就了大义。因此，你要克制，远离一切恶事，并且行善。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文κύριε是敬称，可译作“大人”“阁下”或“主啊”；此处译作“大人”，不预先确定说话者的身份。
    reason: 保留该称谓的敬称性质及其可有的较宽指涉，避免“先生”所带的教师含义，也不将其直接限定为神学意义上的“主”。
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκρατεύσῃ / ἐγκράτευσαι
  choice: 克制自己；远离
  rationale: 核心义统一译为“克制自己”，以保留原文围绕节制展开的反复和善恶之间的悖论式对照；末句ἀπὸ πονηρίας πάσης结合介词ἀπό译作“远离一切恶事”，自然表达戒绝之意。
- source_word: τὸ πονηρόν / πονηρίας πάσης
  choice: 恶事 / 一切恶事
  rationale: 此处与“善事”构成行为层面的对照；译作“恶事”比抽象的“邪恶”更契合紧接着的“不可去做”。
- source_word: τὸ ἀγαθόν
  choice: 善事；行善
  rationale: 兼顾名词性的“善”与动词ποιεῖν所强调的实践，以现代汉语自然表达原文反复的“做善事”。
- source_word: ἁμαρτίαν μεγάλην ἐργάζῃ
  choice: 犯了大罪
  rationale: 按现代汉语习惯表达“造成／作出重大罪行”，同时保留强烈的道德判断。
- source_word: δικαιοσύνην μεγάλην ἐργάζῃ
  choice: 行了大义
  rationale: 保留δικαιοσύνη与行为动词ἐργάζῃ的积极伦理力度，不把它收窄为仅仅“做了对的事”。
theological_decisions:
- issue: 不行善被称为“大罪”，不作恶被称为“大义”
  choice: 按原文直接保留这一对称而紧张的表述
  alternative: 弱化为“不太好”与“做得很好”，或解释为某种功德体系
  rationale: 原文有意把消极不行善与积极戒恶并列评价；译文不应削弱，也不应额外导入关于功德、称义或救恩机制的教派性说明。
- issue: κύριε所指身份
  choice: 正文译“先生”，脚注说明也可译“主啊”或“大人”
  alternative: 直接译“主啊”
  rationale: 叙事中这是对说话者的尊称，不宜未经说明就让现代读者认定是在直接称呼上帝；脚注保留希腊词可能具有的较宽称谓范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体；保留“克制自己”在全段中的刻意反复，以呈现原文关于对恶应节制、对善不应节制的修辞对照。
