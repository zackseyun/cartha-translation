base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/010.yaml
  text: '“Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the servants of God from distresses; to be hospitable (for in hospitality one sometimes finds an opportunity for doing good); to oppose no one; to be quiet; to become lower than all people; to honor the elderly; to practice righteousness; to preserve the brotherhood; to endure insult; to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not to cast off those who have stumbled away from the faith, but to turn them back and make them cheerful; to admonish those who sin; not to oppress debtors and the needy; and if there is anything like these.'
translation:
  language: zh_hans
  text: “再听听与这些相关的事：服事寡妇；看顾孤儿和缺乏的人；救上帝的仆人脱离困境；殷勤接待客旅（因为接待客旅有时会带来行善的机会）；不与任何人敌对；安静度日；在众人中自居卑微；敬重年长者；践行公义；维系弟兄情谊；忍受凌辱；恒久忍耐；不怀怨恨；鼓励心灵疲惫的人；不要丢弃那些离开信仰而跌倒的人，却要使他们回转，并使他们振作起来；劝诫犯罪的人；不欺压欠债的人和贫困的人；以及其他类似的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπηρετεῖν
  choice: 服事
  rationale: 表达实际照料和帮助寡妇之意，同时保留早期基督教伦理语境中的服务意味。
- source_word: ἐπισκέπτεσθαι
  choice: 看顾
  rationale: 不只指探访，也包含关怀和照料；比单纯“探望”更符合此处伦理清单。
- source_word: ἐξ ἀναγκῶν λυτροῦσθαι
  choice: 救……脱离困境
  rationale: λυτροῦσθαι有赎出、解救之意，ἀνάγκαι可指困苦、危难或迫切需要；用“救……脱离困境”保留范围，不限定为金钱赎买。
- source_word: φιλόξενον εἶναι
  choice: 殷勤接待客旅
  rationale: 自然表达古代“好客、接待陌生人”的伦理要求，避免现代“热情好客”可能偏重性格描述。
- source_word: μηδενὶ ἀντιτάσσεσθαι
  choice: 不与任何人敌对
  rationale: ἀντιτάσσεσθαι可指反抗、对立；此译保留人际伦理中的不对抗意味，而不绝对化为禁止一切异议。
- source_word: ἡσύχιον εἶναι
  choice: 安静度日
  rationale: 指平静、不滋事的生活方式，不只是保持沉默。
- source_word: ἐνδεέστερον γίνεσθαι πάντων ἀνθρώπων
  choice: 比所有人都谦卑
  rationale: 字面涉及成为比众人更低微或更卑下；按伦理语境用自然中文传达自居卑微，而非鼓励物质匮乏。
- source_word: ἀδελφότητα συντηρεῖν
  choice: 维系弟兄情谊
  rationale: ἀδελφότης可指弟兄群体或弟兄关系；“弟兄情谊”保留这种双重指向，且不擅自限定为制度性教会组织。
- source_word: μακρόθυμον εἶναι
  choice: 恒久忍耐
  rationale: 传达面对冒犯或困难时长期忍耐、不轻易发怒。
- source_word: κάμνοντας τῇ ψυχῇ
  choice: 心灵疲惫的人
  rationale: κάμνω指疲乏、困倦，τῇ ψυχῇ限定为内在生命层面；此译较“灵性患病”少作解释。
- source_word: ἐσκανδαλισμένους ἀπὸ τῆς πίστεως
  choice: 那些因信仰而跌倒的人
  rationale: 保留ἀπό与“信仰”的关系所含歧义：既可能指从信仰中跌落，也可能指因信仰受绊；正文采用较贴近字面的表达。
- source_word: εὐθύμους ποιεῖν
  choice: 使他们振作起来
  rationale: 指使人重新有勇气、心情振奋；用现代自然中文表达。
- source_word: χρεώστας μὴ θλίβειν
  choice: 不欺压欠债的人
  rationale: θλίβειν是压迫、逼迫，χρεώστας是债务人；译文保留债权关系中的伦理禁令。
theological_decisions:
- issue: “从信仰跌倒”与“因信仰受绊”的关系
  choice: 那些因信仰而跌倒的人
  alternative: 那些偏离信仰的人／那些在信仰上跌倒的人
  rationale: 希腊语ἐσκανδαλισμένους ἀπὸ τῆς πίστεως的ἀπό可表达离开起点，也可与受绊的缘由相关。正文不将其明确化为背教，保留一定张力；后文“使他们回转”则呈现恢复方向。
- issue: “回转”行为的施事与救恩含义
  choice: 却要使他们回转，并使他们振作起来
  alternative: 却要劝他们回转，使他们振作起来
  rationale: ἐπιστρέφειν在此与ποιεῖν同属不定式清单，语法上可理解为使偏离者转回。译文保留群体主动挽回的责任，但不把它解释为人施行最终救恩。
- issue: 弟兄群体的范围
  choice: 维系弟兄情谊
  alternative: 维护弟兄群体
  rationale: ἀδελφότης既可能偏向共同体，也可能指弟兄关系。采用不严格制度化的表达，以免导入特定教会论。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体；保留原文连续伦理清单的节奏，以分号区分各项。涉及古代社会处境的“寡妇、孤儿、客旅、欠债者”均直译，不作现代制度化改写。
