revisions:
- from: “再听听这些事之后所当做的：服事寡妇；看顾孤儿和缺乏的人；救上帝的仆人脱离困境；殷勤接待客旅（因为接待客旅有时会带来行善的机会）；不与任何人敌对；安静度日；比所有人都谦卑；敬重年长者；践行公义；维系弟兄情谊；忍受凌辱；恒久忍耐；不怀怨恨；鼓励心灵疲惫的人；不要丢弃那些因信仰而跌倒的人，却要使他们回转，并使他们振作起来；劝诫犯罪的人；不欺压欠债的人和贫困的人；以及其他类似的事。”
  to: “再听听与这些相关的事：服事寡妇；看顾孤儿和缺乏的人；救上帝的仆人脱离困境；殷勤接待客旅（因为接待客旅有时会带来行善的机会）；不与任何人敌对；安静度日；在众人中自居卑微；敬重年长者；践行公义；维系弟兄情谊；忍受凌辱；恒久忍耐；不怀怨恨；鼓励心灵疲惫的人；不要丢弃那些离开信仰而跌倒的人，却要使他们回转，并使他们振作起来；劝诫犯罪的人；不欺压欠债的人和贫困的人；以及其他类似的事。”
