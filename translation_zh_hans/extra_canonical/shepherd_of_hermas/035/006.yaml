  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/006.yaml
  text: “Do these not seem to you to be evil?” “Very evil,” I say, “for the servants of God.” “From all these the one who serves God must exercise self‑control. Exercise self‑control, then, from all these, that you may live to God and be enrolled with those who exercise self‑control from them. These, then, are the things from which you must exercise self‑control.
translation:
  language: zh_hans
  text: '“这些难道不是恶的吗？”他问。


    “是的，对神的仆人来说，这些实在极其邪恶。”我说。


    “凡服事神的人，都必须持守自制，远离这一切。所以，你要持守自制，远离这一切，好让你为神而活，并被列入那些持守自制、远离这些事的人中。以上就是你必须持守自制、远离的事。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρά / πονηρά
  choice: 恶事／极大的恶事
  rationale: 这里指前文所列的邪恶行为；用“恶事”比抽象的“邪恶”更贴合上下文。λίαν 加强程度，译作“实在是极大的”。
- source_word: δοῦλοι τοῦ θεοῦ / δουλεύοντα τῷ θεῷ
  choice: 神的仆人／服事神的人
  rationale: 分别保留名词性的身份表达和动词性的事奉表达，同时采用现代汉语中自然、庄重的措辞。
- source_word: ἐγκρατεύεσθαι ἀπό
  choice: 克制自己，远离
  rationale: 该结构不只是一般性的“节制”，而是克制自身、不去行所列恶事；双重表达既保留核心概念，也使现代读者明确其离弃对象的含义。
- source_word: ζήσῃ τῷ θεῷ
  choice: 为神而活
  rationale: 保留与格所表达的朝向和归属关系，不把它扩展解释为得救或永生。
- source_word: ἐγγραφήσῃ
  choice: 被列在……中
  rationale: 保留登记、列入名册的被动意象，同时避免凭空补出具体名册或末世场景。
theological_decisions:
- issue: “为神而活”的含义
  choice: 直译为“为神而活”
  alternative: “在神面前存活”或“得以在神里面活着”
  rationale: τῷ θεῷ 的具体关系存在一定张力；“为神而活”自然且不预先限定为今生伦理生活、属灵生命或末世得生。
- issue: “被列在”所指的登记
  choice: 不说明具体名册
  alternative: “名字被记在生命册上”
  rationale: 原文只说“被列入”，没有明言生命册；不引入原文未有的启示文学或救恩论细节。
translation_notes:
  register: 采用现代标准普通话和简体中文。保留问答体以及“克制自己”的反复，以维系本命令全段的关键词链；同时补用“远离”说明希腊语 ἀπό 所表达的离弃对象。整体语气庄重、清楚，适合普通现代读者。
