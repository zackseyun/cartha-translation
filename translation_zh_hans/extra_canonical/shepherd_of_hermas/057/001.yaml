  yaml_path: translation/extra_canonical/shepherd_of_hermas/057/001.yaml
  text: I say to him, "Lord, explain this to me further." He says, "What are you seeking?" I say, "Then, Lord, are those who indulge themselves and are deceived tormented for the same length of time as the time of the deception? For the time of deception is one hour, but the hour of torment has the force of thirty days. Therefore, if someone indulges himself for one day and is deceived, and is tormented for one day, the day of torment amounts to a whole year. So then, for as many days as a person indulges himself, for that many years he is tormented." "You see then," he says, "that the time of indulgence and deception is very short, but the time of punishment and torment is long."
translation:
  language: zh_hans
  text: 我对他说：“主啊，请再给我解释这一点。”他说：“你还想弄清什么？”我说：“主啊，那么，那些纵情享乐、受迷惑的人所受的折磨，是否与他们受迷惑的时间一样长呢？因为受迷惑的时间是一小时，而受折磨的一小时有三十天的效力。因此，若有人纵情享乐、受迷惑一天，又受折磨一天，那么受折磨的那一天就相当于整整一年。所以，一个人纵情享乐多少天，就要受折磨多少年。”他说：“这样你就看见了，纵情享乐和受迷惑的时间极短，惩罚和折磨的时间却很长。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶντες / τρυφήσῃ
  choice: 享乐／享乐
  rationale: τρυφάω在此指沉溺于舒适、奢乐或放纵的生活；译作“享乐”简洁自然，并保留其负面语境，而不额外限定为某一种罪行。
- source_word: ἀπατώμενοι / ἀπάτης / ἀπατηθῇ
  choice: 受迷惑／受迷惑
  rationale: 采用被动表达，保留希腊文“被欺骗、受迷惑”的语态及主体未明的含混性。
- source_word: βασανίζονται / βασάνου / βασανισθῇ
  choice: 受折磨／折磨
  rationale: βασανίζω在本段表示严厉痛苦或苦刑；“受折磨”既传达强度，也避免擅自规定折磨的具体方式。
- source_word: δύναμιν ἔχει / ἰσχύει
  choice: 具有……的分量／相当于
  rationale: 这里表达时间在惩罚计算中的效力或等值关系；依上下文分别自然译出，保留一小时折算三十天、一天折算一年的推论。
- source_word: τιμωρίας
  choice: 惩罚
  rationale: 该词指处罚、报应；“惩罚”是现代汉语中清楚而不过度神学化的对应词。
theological_decisions:
- issue: 享乐与受迷惑同惩罚时长之间的比例
  choice: 按原文保留一小时对三十天、一天对一年的计算，不解释为象征或精确的末世时间表
  alternative: 将数字明确解释为象征性的长期惩罚，或视为字面末世刑期
  rationale: 原文陈述比例及结论，却没有说明数字属于象征还是字面制度；译文不替作者消解这一张力。
- issue: ἀπατάω被动式的施事者
  choice: 译作“受迷惑”，不补出迷惑者
  alternative: 补作“受魔鬼迷惑”或“自欺”
  rationale: 希腊文没有明说施事者；补出具体主体会导入原文未表达的解释。
- issue: 惩罚的性质与场域
  choice: 仅译“受惩罚和折磨”，不指明地狱、炼狱或今世管教
  alternative: 明确归入某种宗派性的来世惩罚框架
  rationale: 本句本身未界定惩罚的场域和教义性质，应保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“主啊”对应κύριε，保留古代尊称语气；引语层次按说话者转换重新断句，使中文读者能清楚辨认问答关系。全段没有需要设置的文本异读或解释性脚注。
