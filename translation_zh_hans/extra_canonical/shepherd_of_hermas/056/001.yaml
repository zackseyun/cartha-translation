base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/001.yaml
  text: Therefore, seeing them being scourged and afflicted like this, I was grieved for them, because they were being tormented in this way and had no respite at all. I said to the shepherd who was speaking with me, “Sir, who is this shepherd, so pitiless and harsh, showing no compassion at all for these sheep?” He said, “This is the angel of punishment; he is one of the righteous angels, appointed over punishment. Therefore he takes charge of those who have wandered away from God and have gone after the desires and deceits of this age, and he punishes them, as they deserve, with dreadful and various punishments.”
translation:
  language: zh_hans
  text: 所以，我看见它们这样受鞭打、遭受痛苦，就为它们忧伤，因为它们这样受折磨，丝毫没有喘息的机会。我对那位正同我说话的牧人说：“先生，这个牧人是谁？他竟这样毫无怜悯、严酷无情，对这些羊丝毫没有同情！”他说：“这是施行惩罚的天使；他是公义天使中的一位，受命掌管惩罚。因此，他接管那些被引离上帝、随从这个时代的欲望和欺骗的人，照他们所应得的，用可怕而各样的惩罚惩治他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαστιγούμενα
  choice: 受鞭打
  rationale: 保留动词的具体刑罚意象，而不泛化为一般的‘受罚’。
- source_word: ταλαιπωρούμενα
  choice: 遭苦难
  rationale: 表达遭受困苦、折磨的状态，并与后面的‘受折磨’形成自然但不完全重复的汉语措辞。
- source_word: ἀνοχὴν
  choice: 喘息的机会
  rationale: 此处指苦刑中的暂缓或休止；现代汉语用‘喘息的机会’最自然地传达‘毫无宽缓’。
- source_word: ἄσπλαγχνος καὶ πικρός
  choice: 毫无怜悯、严酷无情
  rationale: 分别体现缺乏怜悯与严厉苛酷；采用自然、庄重的并列短语。
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: 施行惩罚的天使
  rationale: 属格可表示与惩罚相关或负责惩罚；结合下文‘受命掌管惩罚’，译出其职能。
- source_word: ἀποπλανηθέντας ἀπὸ τοῦ Θεοῦ
  choice: 偏离上帝
  rationale: 兼顾被引入歧途和实际离开上帝的含义，避免过度判定其主动或被动程度。
- source_word: ἐπιθυμίαις καὶ ἀπάταις τοῦ αἰῶνος τούτου
  choice: 今世欲望和迷惑
  rationale: ‘今世’符合早期基督教语境；ἀπάταις 可指欺骗或诱惑性的迷惑，此处保留其宽泛含义。
- source_word: τιμωρεῖ
  choice: 惩治
  rationale: 既保留惩罚含义，也适合本段有关管教与刑罚的语境。
theological_decisions:
- issue: 公义天使与严酷惩罚之间的张力
  choice: 直译‘他属于那些公义的天使，受命掌管惩罚’
  alternative: 弱化为‘他虽严厉，却是在执行公义’
  rationale: 原文并未解释或消解这种张力，译文应保留牧人看似无怜悯却属于公义天使的陈述。
- issue: 受罚者偏离上帝的主客观色彩
  choice: 译作‘偏离上帝’
  alternative: ‘被诱骗而远离上帝’或‘背弃上帝’
  rationale: ἀποπλανηθέντας 带有迷失、受引诱之意，但上下文也强调他们追随欲望；中性表达可保留责任与受迷惑之间的张力。
- issue: 惩罚是否具有终极刑罚含义
  choice: 使用一般性的‘惩罚／惩治’
  alternative: ‘刑罚’或‘永刑’
  rationale: 本段自身并未说明终极审判或永恒刑罚，后续语境反而涉及管教和悔改，因此不额外加入末世论限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以‘先生’对应 κύριε 在人与牧人对话中的尊称，避免译成可能被误解为神圣称号的‘主啊’。代词‘它们’指羊；涉及偏离上帝的人时改用‘他们’，符合汉语指称习惯。
