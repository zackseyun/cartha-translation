    rationale: 该词指人被误导、被引离而远离上帝。虽不应抹去下文他们随从私欲的责任，但译文应保留原文的受迷惑／受引诱维度。
  - severity: low
    issue: “他属于那些公义的天使”不够自然。
    rationale: ἐκ τῶν ἀγγέλων τῶν δικαίων ἐστί意为“他是公义天使中的一位”；改写可提高自然度而不改变意义。
