base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/002.yaml
  text: '“I wished, Sir,” I said, “to know what these various punishments are.” He said, “Listen. The various punishments and torments are torments of this present life: for some are punished with losses, some with deprivations, some with various sicknesses, some with every kind of disorder; some are insulted by the unworthy, and suffer in many other ways. For many, being unsettled in their plans, undertake many things, and nothing at all advances for them. They say of themselves that they do not prosper in their undertakings, and it does not rise up into their heart that they have done evil, but they blame the Lord.'
translation:
  language: zh_hans
  text: “先生，”我说，“我想知道这些各式各样的惩罚究竟是什么。”他说：“你听。各式各样的惩罚和折磨，都是今生的折磨：有些人因损失受罚，有些人因匮乏受罚，有些人因各种疾病受罚，有些人因种种动荡不安受罚；有些人受不配之人的凌辱，又遭受许多别的苦楚。许多人心思不定，筹划许多事，却没有一件进展顺利。他们说自己所做的事总不顺遂，心里却从未想到自己作了恶，反而责怪主。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 先生
  rationale: 此处是赫马对牧者的尊称，而非直接称呼上帝；“先生”自然地保留礼貌称谓，也避免与下文“主”混淆。
- source_word: τιμωρίαι
  choice: 惩罚
  rationale: 在本段语境中指针对恶行而来的惩处，译作“惩罚”比泛称“苦难”更准确。
- source_word: βάσανοι / βιωτικαί ... βάσανοι
  choice: 折磨／今生的折磨
  rationale: 保留 βάσανος 所含的痛苦与煎熬色彩；βιωτικαί 指现世生活领域，译为“今生的”清楚自然。
- source_word: ὑστερήσεσιν
  choice: 匮乏
  rationale: 涵盖缺少生活所需或遭受短缺，不把含义缩限为某一种具体剥夺。
- source_word: ἀκαταστασίᾳ / ἀκαταστατοῦντες
  choice: 动荡不安／心思不定
  rationale: 同一词族在两处分别描述生活状况与谋划者的不稳定状态；按语境作自然区分，同时保留不安定这一共同核心。
- source_word: ὑβριζόμενοι
  choice: 受……凌辱
  rationale: 表达遭受傲慢侮辱或虐待的被动含义，语气符合原文。
- source_word: οὐδὲν ... προχωρεῖ
  choice: 没有一件进展顺利
  rationale: 原意是所筹办之事毫无进展；此译比字面“前进”更符合现代汉语。
- source_word: οὐκ ἀναβαίνει ... ἐπὶ τὴν καρδίαν
  choice: 心里却从未想到
  rationale: 将闪族式“上到心里”转化为自然汉语，同时保留其意念未曾生起的意义。
- source_word: αἰτιῶνται τὸν Κύριον
  choice: 责怪主
  rationale: 准确表达将责任归咎于主；“主”在此明确指神，与开头对牧者的称谓区别开来。
theological_decisions:
- issue: 现世患难与惩罚的关系
  choice: 按原文将所列损失、匮乏、疾病等称为“今生的折磨”和“惩罚”
  alternative: 弱化为一般性的“考验”或“苦难”
  rationale: 本段明确使用 τιμωρία 和 βάσανος，并将这些遭遇置于管教性惩处的论述中；译文保留这一神学张力，不把它普遍化为关于一切患难的断言，也不另加解释。
- issue: κύριε 的指称区分
  choice: 对牧者译“先生”，对神译“主”
  alternative: 两处一律译“主”
  rationale: 希腊文同形称谓依上下文有不同所指；区分翻译可避免读者误以为赫马在开头直接向神发问。
- issue: “不配之人”的道德评价
  choice: 保留“不配之人”
  alternative: 解释为“卑劣的人”或“无足轻重的人”
  rationale: ἀνάξιος 的具体评价维度并未说明；直译保留原文的开放性，避免擅自确定其社会身份或道德性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。保留“惩罚—折磨—今生遭遇—责怪主”的逻辑链条；在不牺牲原义的前提下，将希腊语习语转换为自然普通话。本读者段落对应原文第4节至第5节末，无需脚注标记。
