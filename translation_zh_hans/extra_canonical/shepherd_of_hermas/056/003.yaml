base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/003.yaml
  text: “When, then, they are afflicted with every affliction, then they are handed over to me for good discipline, and they are strengthened in the faith of the Lord; and the rest of the days of their life they serve the Lord with a pure heart. And if they repent, then the evil works that they did rise up into their heart; and then they glorify God, saying that he is a righteous judge and that each one suffered justly according to his deeds. Thereafter they serve the Lord with a pure heart, and they prosper in every work of theirs, receiving from the Lord whatever they ask for; and then they glorify the Lord because they were handed over to me, and they no longer suffer any of the evils.”
translation:
  language: zh_hans
  text: “所以，当他们遭受各样患难时，就被交给我，接受有益的管教，并在对主的信仰上得以坚固。在他们余下的日子里，他们都以纯洁的心服侍主。如果他们悔改，自己从前所行的恶事就会浮上心头。那时，他们便荣耀上帝，说他是公义的审判者，也承认各人照自己的行为受苦，实属公正。此后，他们以纯洁的心服侍主，所做的一切事都顺利；凡向主所求的，也都从主领受。那时，他们便荣耀主，因为自己曾被交给我，并且不再遭受任何祸患。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλιβῶσι πάσῃ θλίψει
  choice: 遭受各样患难
  rationale: 保留同根词造成的强调，同时用自然现代汉语表达范围广泛的困苦。
- source_word: ἀγαθὴν παιδείαν
  choice: 有益的管教
  rationale: παιδεία兼具训练、教导与纠正之意；“管教”贴合惩戒语境，“有益的”对应ἀγαθή并表明其正面目的。
- source_word: ἰσχυροποιοῦνται ἐν τῇ πίστει τοῦ Κυρίου
  choice: 在对主的信仰上得以坚固
  rationale: 采用被动表达保留原文含义；将属格理解为以主为对象的信仰，同时不扩展为特定教义术语。
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτῶν
  choice: 浮上心头
  rationale: 以自然汉语保留“上到心中”的意象，表示恶行重新进入意识并被忆起。
- source_word: εὐοδοῦνται ἐν πάσῃ πράξει αὐτῶν
  choice: 所做的一切事都顺利
  rationale: εὐοδόομαι在此指事情进展顺遂；避免译成专指物质财富的“兴旺”。
- source_word: τῶν πονηρῶν
  choice: 任何灾祸
  rationale: 此处中性复数结合πάσχουσι，指所遭受的坏事、苦难或祸患，而非道德意义上的罪恶。
theological_decisions:
- issue: 患难、管教与悔改之间的关系
  choice: 按原文次序呈现：受患难、被交付管教、信心得坚固；若悔改，则认清恶行并承认审判公正。
  alternative: 把一切患难直接概括为上帝对特定罪行的惩罚，或断言管教必然产生悔改。
  rationale: 原文将这些环节紧密关联，却仍使用条件句ἐὰν μετανοήσωσιν“如果他们悔改”；译文保留这一条件性，不作超出文本的普遍化。
- issue: 祈求与蒙应允
  choice: 直译为“凡向主所求的，也都从主领受”。
  alternative: 添加“符合主旨意的”或将其解释为无条件满足一切愿望。
  rationale: 原文没有附加限定，也没有要求无条件主义的解释，因此保留其强烈陈述及内在张力。
- issue: δικαίως ἔπαθον ἕκαστος κατὰ τὰς πράξεις αὐτοῦ的主语与承认语气
  choice: 译作“也承认各人照自己的行为受苦，实属公正”。
  alternative: 译成上帝主动使每个人受罚，或消除受苦者对审判公正的自我承认。
  rationale: 原文强调各人所受与其行为相称；译文不额外规定上帝实施苦难的具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留“主”“上帝”“公义的审判者”“服侍”等早期基督教文本的核心称谓。无脚注，正文无需脚注标记。
