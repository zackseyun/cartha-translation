  source_fidelity: 译文整体忠实呈现了条件结构、悔改后的自觉、按行为受苦的公正性，以及蒙主赐予所求和不再受苦的结局。两处措辞可作小幅收紧：首句的“此后”并非原文“余下的日子”本身所明说；末句“灾祸”较偏向外在事故，原文中性复数τῶν πονηρῶν更宽泛地指所受的恶事或祸患。
