  - severity: low
    issue: “任何灾祸”略微缩窄τῶν πονηρῶν的范围。
    rationale: 该短语指他们不再遭受的“恶事、祸患”或各种有害之事，并不限于通常所说的突发灾祸。用“任何祸患”较宽泛而自然。
