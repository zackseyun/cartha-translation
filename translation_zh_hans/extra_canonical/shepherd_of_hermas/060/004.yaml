base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/004.yaml
  text: The angel who had given the rods to the people again demanded them back from them; and as they had received them, so too they were called to him, and each one returned the rods. The angel of the Lord took them and examined them.
translation:
  language: zh_hans
  text: 那位把枝条分给众人的天使，又向他们收回枝条。他们当初怎样领受，如今也照样一个个被叫到他面前，各自交还枝条。主的天使接过来，逐一察看。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: 枝条
  rationale: 上下文说明这些是从柳树上剪下、约一肘长的小枝；译作“枝条”比泛称“杖”更符合此处具体意象。
- source_word: πάλιν ἀπῄτει ἀπ᾽ αὐτῶν
  choice: 又向他们收回
  rationale: 表达天使在先前分发之后再次索取、要求交回的动作，现代汉语自然清楚。
- source_word: ἐκαλοῦντο πρὸς αὐτόν
  choice: 一个个被叫到他面前
  rationale: 保留被动语态以及受召来到天使面前的场景；“一个个”承接后文εἷς ἕκαστος。
- source_word: ἀπεδίδου
  choice: 交还
  rationale: 准确呈现把先前所领之物归还的含义。
- source_word: κατενόει
  choice: 逐一察看
  rationale: 该词在此指仔细观察、检视；结合复数宾语和后续分类情节，用“逐一察看”最贴切。
theological_decisions:
- issue: ὁ ἄγγελος τοῦ Κυρίου的身份称谓
  choice: 主的天使
  alternative: 主使者／耶和华的使者
  rationale: 按字面保留“主的天使”，不将其身份进一步神学化，也不把后期或特定宗派解释带入文本。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以“枝条”维持本段柳树异象的具体图景，并通过“一个个”“逐一”自然呈现原文依次召回和检查的动作。
