base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/003.yaml
  text: After all had received the rods, the angel laid aside the sickle, and that tree was sound, just as I had seen it before. I marveled within myself, saying, How is the tree sound, with so many branches cut off? The shepherd says to me, Do not marvel that the tree remained sound though so many branches were cut off. But wait until you see everything, and it will be shown to you what it is.
translation:
  language: zh_hans
  text: 众人都领了枝条以后，天使便放下镰刀；那棵树仍然完好，正如我先前所见的一样。我心里诧异，说：“砍下了这么多枝子，这棵树怎么还完好呢？”牧人对我说：“这么多枝子虽被砍下，这棵树却仍然完好，你不要诧异。只管等到你看完这一切，就会向你说明这是什么意思。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαβδία / ῥαβδία
  choice: 枝条
  rationale: 上下文说这些是从柳树上砍下并分给众人的小枝；译作“枝条”比泛指棍棒的“杖”更符合此处具象场景。
- source_word: ὑγιές
  choice: 完好
  rationale: 该词本义为健康、健全；用于树木时，“完好”自然地表达虽被砍去许多枝子却未受损败坏的状态。
- source_word: ἄγγελος
  choice: 天使
  rationale: 采用早期基督教文献中该词的常规称呼，并与后文“牧人”区分。
- source_word: δηλωθήσεταί
  choice: 会向你说明
  rationale: 保留被动形式所未明说的施事者，不擅自指定由牧人或天使解释。
theological_decisions:
- issue: 树木“仍然完好”的象征意义
  choice: 正文仅陈述异象，不提前解释象征
  alternative: 把树直接解释为律法、上帝子民或教会
  rationale: 本句明确说其意义稍后才会显明，因此应保留叙事悬念，避免引入后文或宗派性的解释。
- issue: δηλωθήσεταί的施事者
  choice: 用无明确施事者的“会向你说明”
  alternative: 译为“牧人会向你说明”或“上帝会向你显明”
  rationale: 希腊文使用神学被动式但未明说施事者，应保留这种含蓄与开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留异象文学的问答节奏。为与上下文中从柳树砍下的 κλάδοι 相协调，将所分发的 ῥαβδία 译为“枝条”，而在提到被砍下的 κλάδοι 时译为“枝子”，体现小枝与一般枝条之间轻微的词汇差异。
