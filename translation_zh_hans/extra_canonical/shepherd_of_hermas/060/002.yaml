base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/002.yaml
  text: And an angel of the Lord—exceedingly glorious and very tall—was standing beside the willow, holding a great sickle, and he was cutting off branches from the willow and handing them to the people who were being sheltered by the willow; and he kept giving them little rods, about a cubit long.
translation:
  language: zh_hans
  text: 主的一位天使站在柳树旁边；他极其荣耀，身材非常高大，手里拿着一把大镰刀。他从柳树上砍下枝条，递给那些受柳树遮蔽的人们；他交给他们的是一根根约一肘长的小杖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一肘”是古代按前臂长度计算的尺度，约合45厘米。
    reason: 现代读者通常不熟悉“肘”这一长度单位；脚注提供近似换算，同时保留原文的古代度量表达。
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  choice: 主的一位天使
  rationale: 按希腊语普通名词结构译出，不把它擅自确定为某位特定天使，也不引入额外的神学身份判断。
- source_word: ἔνδοξος λίαν
  choice: 极其荣耀
  rationale: 保留ἔνδοξος的尊荣、荣光意味，并用“极其”对应λίαν的强烈程度。
- source_word: ὑψηλός
  choice: 身材非常高大
  rationale: 在人物外貌语境中自然表达身量高，而非抽象的地位崇高。
- source_word: δρέπανον μέγα
  choice: 一把大镰刀
  rationale: 直译农具名称和大小，符合砍取树枝的异象场景。
- source_word: σκεπαζομένῳ ὑπὸ τῆς ἰτέας
  choice: 在树荫下
  rationale: 表达被柳树遮蔽的具体画面；不把这种遮蔽预先解释为某种神学性的保护。
- source_word: μικρὰ ῥαβδία
  choice: 小枝条
  rationale: 这些细杖由柳树枝砍下，译作“小枝条”既保留来源，也比“小棍”更自然。
- source_word: ὡσεὶ πηχυαῖα
  choice: 约一肘长
  rationale: 保留古代长度单位及ὡσεὶ所表达的约数意味。
theological_decisions:
- issue: “主的天使”是否指一个具有特殊神圣身份的固定称谓
  choice: 译作“主的一位天使”
  alternative: “主的使者”或“那位主的天使”
  rationale: 本句把该人物作为异象中的天使来叙述，文本本身没有要求将其等同于某个特定的神圣位格；采用不定表达可避免过度诠释。
- issue: 柳树的遮蔽是否直接译成属灵保护
  choice: 保留为具体的“在树荫下”
  alternative: “蒙柳树庇护”
  rationale: 此处首先描绘异象画面，其象征意义将在后文说明；翻译不提前化解象征的开放性。
translation_notes:
  register: 采用庄重而清楚的现代汉语，保留异象叙事的重复节奏；用“柳树”“镰刀”“枝条”等具体词汇呈现画面，不提前解释其象征意义。
