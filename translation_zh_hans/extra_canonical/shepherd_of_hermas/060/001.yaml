revisions:
- from: ……全心全意地悔改。那么，你以为悔改之人的罪会立刻得到赦免吗？并不完全如此。悔改的人必须使自己的心灵受苦，在一切行为上都极力谦卑自己，并在种种患难中受苦；如果他忍受临到他的患难，那创造万物并赐万物力量的主必定会动慈心，赐下某种医治。这要等到上帝[a]看见悔改之人的心已经洁净，脱离了一切……
  to: ……以他们的全心全意。那么，你以为那些悔改之人的罪会立刻得到赦免吗？并不完全如此；悔改的人必须使自己的心灵受熬炼，在自己一切的行为上都深深谦卑，并在各种患难中受苦。若他忍受临到自己的患难，那位创造万物并使万物坚固者必定会怜悯他，并赐给他某种医治。而这，当上帝[a]看见悔改之人的心已经洁净，脱离一切……
  rationale: 修订删除原文未明说的“主”，将“赐万物力量”改为较贴合并列分词结构的“使万物坚固”，并把末句恢复为未完成的条件句，以省略号忠实呈现所给文本在此中断的状态。其余关键术语及“某种医治”的不定性均予保留。
