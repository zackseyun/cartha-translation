base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/001.yaml
  text: …with their whole heart. So then, do you suppose that the sins of those who are repenting are immediately forgiven? Not entirely. Rather, the one who repents must afflict his own soul and be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations; and if he bears the tribulations that come upon him, the One who created all things and strengthened them will surely be moved with compassion and will grant some healing. And this, when [God] sees the heart of the one repenting clean from everything.
translation:
  language: zh_hans
  text: ……以他们的全心全意。那么，你以为那些悔改之人的罪会立刻得到赦免吗？并不完全如此；悔改的人必须使自己的心灵受熬炼，在自己一切的行为上都深深谦卑，并在各种患难中受苦。若他忍受临到自己的患难，那位创造万物并使万物坚固者必定会怜悯他，并赐给他某种医治。而这，当上帝[a]看见悔改之人的心已经洁净，脱离一切……
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝”在所据希腊文本中以方括号标出，表示这是编者补出的词。
    reason: 如实反映ὅταν [ὁ Θεὸς]中ὁ Θεός的文本校补状态。
lexical_decisions:
- source_word: βασανίσαι τὴν ἑαυτοῦ ψυχήν
  choice: 使自己的心灵受苦
  rationale: 保留“使……受折磨、经受痛苦”的强烈语气，同时避免让现代读者误解为肉体自残。
- source_word: ταπεινοφρονῆσαι
  choice: 谦卑自己
  rationale: 自然表达主动采取谦卑态度之意，并与“在一切行为上”顺畅衔接。
- source_word: ἐν πάσῃ πράξει αὐτοῦ ἰσχυρῶς
  choice: 在一切行为上都极力
  rationale: 将ἰσχυρῶς理解为修饰谦卑行动的强度，保留其“强有力、坚定、竭力”的意味。
- source_word: θλίψεσι ποικίλαις
  choice: 种种患难
  rationale: “患难”兼具外在压力和苦楚之意，“种种”对应ποικίλαις。
- source_word: ὑπενέγκῃ
  choice: 忍受
  rationale: 准确传达承受并坚持度过临到之患难的意思。
- source_word: σπλαγχνισθήσεται
  choice: 会动慈心
  rationale: 保留源词发自内里的怜悯和慈悲色彩。
- source_word: ἴασίν τινα
  choice: 某种医治
  rationale: 保留τινα所表达的不确定性，不擅自明确医治的性质或范围。
- source_word: ὁ τὰ πάντα κτίσας καὶ ἐνδυναμώσας
  choice: 那创造万物并赐万物力量的主
  rationale: 按两个分词的平行结构翻译；补出“主”使汉语称谓自然，但不改变其指向上帝的语境。
theological_decisions:
- issue: 悔改者的罪是否立刻得到赦免
  choice: “并不完全如此”，随后保留受苦、谦卑、忍耐与医治之间的条件性陈述
  alternative: 将其解释为赦免完全取决于补赎，或反过来弱化为悔改后的普通成长过程
  rationale: 源文直接保留赦免、悔改、患难和上帝怜悯之间的张力；译文不加入特定宗派的悔罪或称义体系。
- issue: ἴασις所指的救恩结果
  choice: 译作“某种医治”
  alternative: 译作“完全赦免”“救恩”或“恢复”
  rationale: 原文措辞刻意不确定，不能将“医治”具体化为某一项教义结论。
- issue: ὁ Θεός的文本状态
  choice: 正文译作“上帝”并加注说明其为校补
  alternative: 无标记地译作“上帝”，或因底本方括号而完全删去主语
  rationale: 汉语需要明确主语，而读者也应知道该词在所给希腊文本中带有编辑校补标记。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“心灵”对应ψυχή，避免“灵魂”在此被误读为纯粹形而上的实体。所给希腊材料在“脱离了一切”（ἀπὸ παντός）之后突然接入下一段异象文字，明显存在截断或拼接问题，因此以省略号保留残缺，不凭后世通行文本擅自补足缺失内容。开头承接上文，亦以省略号标明。
