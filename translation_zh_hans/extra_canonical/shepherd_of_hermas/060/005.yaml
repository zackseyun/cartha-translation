  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/005.yaml
  text: From some he received the rods dry and eaten as if by a moth; the angel ordered those who had handed in such rods to stand apart. Others handed in dry rods, but they had not been eaten by a moth; these too he ordered to stand apart. Others handed in rods half-dry; and these stood apart. Others handed in their rods half-dry and having splits; and these stood apart. Others handed in their rods green and having splits; and these stood apart. Others handed in their rods half dry and half green; and these stood apart. Others presented their rods with two parts of the rod green and the third part dry; and these stood apart. Others handed in two parts dry and the third part green; and these stood apart. Others handed in their rods almost entirely green, but a very little of their rods was dry—at the very tip; and they had splits in them; and these stood apart.
translation:
  language: zh_hans
  text: 天使从一些人那里收回的枝条已经干枯，仿佛被蛀虫蛀过；他吩咐交回这种枝条的人站到一边。另一些人交回的枝条虽然干枯，却没有被蛀虫蛀过；他也吩咐这些人站到一边。另一些人交回的枝条一半干枯；这些人也站到一边。另一些人交回的枝条一半干枯，而且有裂缝；这些人也站到一边。另一些人交回的枝条青翠，却有裂缝；这些人也站到一边。另一些人交回的枝条一半干枯，一半青翠；这些人也站到一边。另一些人交回的枝条有三分之二青翠，三分之一干枯；这些人也站到一边。另一些人交回的枝条有三分之二干枯，三分之一青翠；这些人也站到一边。另一些人交回的枝条几乎全都青翠，只有最尖端的一小点干枯；枝条上还有裂缝。这些人也站到一边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους / ῥαβδία
  choice: 枝条
  rationale: 上下文说明这些是从柳树上割下、约一肘长的细条；“枝条”比“杖”更贴合具体意象，也能自然描述干枯、青翠、虫蛀和裂缝等状态。
- source_word: ξηράς / ξηρόν
  choice: 干枯
  rationale: 此处与“青翠”相对，描述植物枝条失去生机的状态；“干枯”比单纯“干”更准确。
- source_word: χλωράς / χλωρόν
  choice: 青翠
  rationale: χλωρός在此指仍有生命、保持绿色的枝条；“青翠”保留颜色与鲜活状态。
- source_word: βεβρωμένας ὡς ὑπὸ σητός
  choice: 像被虫蛀过一样
  rationale: σής可指蛀虫或衣蛾；对木质枝条而言，现代汉语用“虫蛀”最自然，同时“像……一样”保留ὡς的比较语气。
- source_word: σχισμάς
  choice: 裂缝
  rationale: 表示枝条上的开裂之处；“裂缝”准确而通俗。
- source_word: χωρὶς ἵστασθαι
  choice: 站到一边
  rationale: 表达被分别归类、与其他人分开的动作，不额外解释其象征意义。
theological_decisions:
- issue: 枝条各种状态的象征意义
  choice: 只按叙事逐项呈现，不在正文中解释其属灵含义
  alternative: 将干枯、青翠、虫蛀或裂缝直接释为不同信仰或道德状况
  rationale: 本段尚处于异象的观察和分类阶段，原文没有在此解释象征；提前释义会消除后文展开的张力。
- issue: 天使的身份称谓
  choice: 译作“天使”
  alternative: 译作“主的天使”
  rationale: 本选段各句的主语承接第5节的ὁ ἄγγελος；虽然前文第5节末有“主的天使”，本段无需在每处补入原文未重复的限定。
translation_notes:
  register: 采用庄重、清楚的现代书面汉语，并保留原文反复列举的节奏。统一用“交回”表现这些枝条先前由天使发给众人、如今又被收回检查的情境；个别处依原文用“拿来”，避免机械重复。分数表达按希腊文的“两部分……第三部分……”自然译为“三分之二……三分之一”。
