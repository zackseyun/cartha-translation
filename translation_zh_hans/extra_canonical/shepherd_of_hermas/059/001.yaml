translation:
  language: zh_hans
  text: '比喻七


    1 过了几天，我看见他在那同一片原野上，就是我也曾看见那些牧人的地方。他对我说：“你来有什么事？”我说：“主啊，我来是要请你吩咐那位施罚的牧人离开我家，因为他使我受的苦实在太重了。”他说：“你必须受苦；因为荣耀的天使曾就你的事这样吩咐：他要你经受考验。”我说：“主啊，我究竟做了什么如此恶的事，竟被交给这位天使？”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεδίον
  choice: 原野
  rationale: 指开阔的野外场地；“原野”自然、庄重，并与叙事场景相称。
- source_word: ἐπιζητεῖς
  choice: 有什么请求
  rationale: 此处不是一般性的“寻找”，而是询问赫马前来求取何事。
- source_word: ποιμένα τὸν τιμωρητήν
  choice: 施罚的牧人
  rationale: 保留 ποιμήν 的“牧人”形象，同时以“施罚”表达 τιμωρητής 在本段执行惩戒的角色。
- source_word: θλίβει / θλιβῆναι
  choice: 使……受苦／受苦
  rationale: 词义涵盖压迫、患难和痛苦；本段语境强调惩戒所带来的苦楚。
- source_word: πειρασθῆναι
  choice: 经受考验
  rationale: 保留“试验、考验”的意义，不预先断定其是诱惑犯罪还是单纯磨炼。
- source_word: παραδοθῶ
  choice: 被交给
  rationale: 直译其被动语态和受制于该天使权下的含义，不额外解释为定罪。
theological_decisions:
- issue: 荣耀的天使与施罚天使的关系
  choice: 按原文分别译为“荣耀的天使”和“这位天使”，不把二者合并
  alternative: 将两者解释为同一位天使，或补明为不同天使
  rationale: 希腊文叙事显示荣耀的天使发出命令，而施罚的牧人执行惩戒；译文保留这种角色区分，但不添加原文没有的体系化说明。
- issue: 受苦的目的
  choice: 译为“他要你经受考验”
  alternative: 译为“他要诱惑你”或“他要惩罚你”
  rationale: πειράζω 语义可涉及试验或试探；此处由荣耀天使所命，且上下文为纪律性受苦，“经受考验”较能保留神学张力而避免负面定性。
translation_notes:
  register: 采用现代、清楚而庄重的叙事和对话体；保留早期基督教异象文本中的称谓“主啊”、牧人意象及天使层级的含混性。译文范围严格限于《赫马牧人书》59:1；所给希腊文后续第2—4段不纳入本单元。
