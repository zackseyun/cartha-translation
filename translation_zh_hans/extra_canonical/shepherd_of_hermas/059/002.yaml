base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/002.yaml
  text: 1. After a few days I saw him in the same field where I had also seen the shepherds, and he says to me, “What are you seeking?” “I am here, sir,” I say, “that you may command the shepherd, the punisher, to go out from my house, because he afflicts me greatly.” He says, “It is necessary for you to be afflicted; for thus the glorious angel has commanded concerning you, for he wants you to be tested.” “For what, sir,” I say, “have I done that was so evil, that I should be handed over to this angel?”
translation:
  language: zh_hans
  text: 2. 他对我说：“你听着：你的罪固然很多，却还没有多到该把你交给这位天使的地步。可是你家的人犯下了严重的不法行为和罪；那位荣耀的天使因他们的所作所为被激怒了。因此，他命令你受苦一段时间，好让他们也悔改，洁净自己，脱离今世的一切欲望。等他们悔改并洁净自己以后，施行惩罚的天使就会离开。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: 你一家人
  rationale: 这里指他的家属或全家，而不是房屋建筑；用“一家人”能在现代汉语中清楚表达集体责任。
- source_word: παρεπικράνθη
  choice: 激怒了
  rationale: 该词表示使人苦恼、愤慨或受冒犯；结合因罪而招致天使命令惩戒的语境，“激怒”自然且保留其强烈程度。
- source_word: θλιβῆναι
  choice: 受苦
  rationale: 原词可指遭受压迫、患难或痛苦；此处不限定具体方式，故用范围较宽的“受苦”。
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: 对今世一切事物的贪恋
  rationale: ἐπιθυμία在此为需洁除的负面欲望；“贪恋”保留道德贬义，τοῦ αἰῶνος τούτου则译为“今世……事物”，避免误解为仅指时代本身。
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: 施行惩罚的天使
  rationale: 属格短语表示与惩罚职责相关的天使；此译比生硬的“惩罚之天使”更符合现代汉语。
theological_decisions:
- issue: 一家人的罪与赫尔马所受痛苦之间的关系
  choice: 按原文保留：他受苦是为了促使家人悔改并洁净自己
  alternative: 解释为他代替家人承担刑罚或为他们赎罪
  rationale: 原文表达管教性的关联，却没有使用代赎语言；不应把这种家庭连带关系扩展为特定的赎罪教义。
- issue: 悔改与洁净的主体
  choice: 明确为家人自己悔改并洁净自己
  alternative: 译成由天使直接洁净他们
  rationale: μετανοήσωσι、καθαρίσωσιν ἑαυτούς均以家人为主体，并有反身代词“自己”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与对话体。保留“荣耀的天使”和“施行惩罚的天使”的区分；避免沿用英文咨询层中属于第1段而非本读者分段的内容。
