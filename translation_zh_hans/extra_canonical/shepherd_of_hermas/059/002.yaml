revisions:
- from: 2. 他对我说：“你听着。你的罪固然很多，却还没有多到该把你交给这位天使的地步。可是你一家人犯下了严重的不法之事和罪恶，他们的所作所为激怒了那位荣耀的天使。因此，他命令你受苦一段时间，好让他们也悔改，并除去自己心中对今世一切事物的贪恋。等他们悔改、洁净了自己，施行惩罚的天使就会离开。”
  to: 2. 他对我说：“你听着：你的罪固然很多，却还没有多到该把你交给这位天使的地步。可是你家的人犯下了严重的不法行为和罪；那位荣耀的天使因他们的所作所为被激怒了。因此，他命令你受苦一段时间，好让他们也悔改，洁净自己，脱离今世的一切欲望。等他们悔改并洁净自己以后，施行惩罚的天使就会离开。”
