  source_fidelity: 译文整体忠实呈现了本段的家庭连带受苦、悔改及惩罚天使离去的逻辑。惟“并除去自己心中对今世一切事物的贪恋”将“洁净自己”（καθαρίσωσιν ἑαυτούς）弱化为单一的“除去”，又把“今世的一切欲望”（πάσης ἐπιθυμίας τοῦ αἰῶνος τούτου）转成对“事物”的贪恋，略缩窄并增添了原文未明说的对象。
  naturalness: 整体为自然、庄重的现代汉语。“你一家人”可通，但“你家的人”更贴近此处 οἶκος 所指的家中成员，也避免“一家人”在现代汉语里略带泛称的语感。
  terminology: “荣耀的天使”“施行惩罚的天使”“悔改”均恰当。将 ἀνομίας 明确译为“不法行为”，可与“罪”保留原文并列而不显得抽象重复。
