  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/005.yaml
  text: 4. “But look, sir,” I say, “they have repented with all their heart.” He says, “I also know that they have repented with—”
translation:
  language: zh_hans
  text: 4. 我说：“可是，先生，你看，他们已经全心全意地悔改了。”他说：“我也知道他们已经全心全意地悔改——”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 此处是对权威人物的尊称；译作“主啊”既保留早期基督教文献的庄重语体，也不额外判定受话者的身份。
- source_word: μετανενοήκασιν
  choice: 已经悔改了
  rationale: 完成时表达悔改已经发生且结果仍然有效；“悔改”准确承载宗教和伦理语境。
- source_word: ἐξ ὅλης καρδίας αὐτῶν
  choice: 全心
  rationale: 自然凝练地表达“从他们全部的心”，即真诚而彻底，不增添原文没有的解释。
- source_word: Οἶδα κἀγώ
  choice: 我也知道
  rationale: 保留κἀγώ的“我也”强调，并采用自然的现代汉语语序。
theological_decisions:
- issue: 悔改的程度及真实性
  choice: “已经全心悔改”
  alternative: “已经从心底悔改”
  rationale: 原文明确说“从他们全部的心”，但本段在句中截断；译文不进一步推断其悔改是否已满足后文可能提出的条件。
- issue: κύριε所指身份
  choice: 译作“主啊”而不加身份说明
  alternative: “先生”或“阁下”
  rationale: 保留称谓本身的语义张力，不将受话者明确等同于上帝、基督或普通人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。保留读者分段在句中结束的状态，以破折号标示原始选段未完，不补写超出所给范围的内容。
