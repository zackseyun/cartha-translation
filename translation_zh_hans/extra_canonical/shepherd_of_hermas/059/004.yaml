base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/004.yaml
  text: 3. I say to him, “Sir, if they did such things as to embitter the glorious angel, what did I do?” “Otherwise,” he says, “they cannot be afflicted unless you, the head of the whole household, are afflicted; for when you are afflicted, of necessity they also will be afflicted, but if you stand firm, they cannot have any affliction.”
translation:
  language: zh_hans
  text: 3. 我对他说：“主啊，如果他们做了这样的事，触怒了那位荣耀的天使，那么我做了什么呢？”他说：“若你这家的一家之主不受苦，他们就无法受苦；因为你受苦时，他们也必然受苦；但你若安稳，他们就不能受任何苦。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 在本段中是对具权威者的尊称；“主啊”既保留原文称呼，也符合庄重而自然的汉语对话。
- source_word: παραπικρανθῇ
  choice: 惹恼
  rationale: 该词表示使之愤懑、激怒；“惹恼”自然地传达因他们的行为而引起天使不悦。
- source_word: ἡ κεφαλὴ τοῦ οἴκου [ὅλου]
  choice: 这全家之首
  rationale: 保留“头/首”所表达的家庭领属与代表地位，并将有抄本疑问的 ὅλου 译入正文，与所给审校层一致；“全家之首”在现代汉语中较为清楚。
- source_word: θλιβῆναι / θλιβομένου / θλῖψιν
  choice: 受苦
  rationale: 原文反复使用同一词族，含受压迫、遭患难之意；统一译作“受苦”，保留段落中的重复和因果联系。
- source_word: εὐσταθοῦντος
  choice: 安稳无恙
  rationale: 与“受苦”形成对照，表示处境稳定、良好；避免把它窄化为单纯的意志坚定。
- source_word: ἐξ ἀνάγκης
  choice: 必然
  rationale: 表达由家庭之首受苦而导致家人同受苦的必然关系。
theological_decisions:
- issue: 一家之首受苦与家人受苦之间的关系
  choice: 按原文直译为条件与必然结果，不补充代罚、连带罪责或管教机制
  alternative: 解释为家主代替家人受罚，或将其明确表述为家庭纪律
  rationale: 原文只说明他们若要受苦，作为全家之首的他也必须受苦，并未系统界定其中的神学机制。
- issue: “荣耀的天使”的身份
  choice: 保留称号，不指认其为特定天使或神圣位格
  alternative: 加注具体身份或采用带有特定教义含义的名称
  rationale: 本句没有提供足够依据作进一步身份判定，应保留叙事本身的开放性。
translation_notes:
  register: 采用现代、庄重且易懂的叙事对话体。保留原文“受苦”的反复，以呈现论证节奏；将 εὐσταθοῦντος 译为“安稳无恙”，使其与“受苦”构成处境上的清晰对照。
