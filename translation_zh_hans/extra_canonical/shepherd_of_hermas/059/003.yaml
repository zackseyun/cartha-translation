base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/003.yaml
  text: '2. He says, “Listen: your sins are many, but not so many that you should be handed over to this angel. Rather, your household has committed great lawless deeds and sins, and the glorious angel was embittered at their works; and for this reason he ordered that you be afflicted for a certain time, so that they too might repent and cleanse themselves from every desire of this age. When therefore they repent and are cleansed, then the angel of punishment will depart.”'
translation:
  language: zh_hans
  text: 2 他对我说：“听着：你的罪固然多，却还没有多到该被交给这位天使的地步。但你全家犯了严重的不法之事和罪，那位荣耀的天使因他们的行为而大为恼怒。因此，他命令你受苦一段时间，好让他们也悔改，洁净自己，除去今世的一切欲望。所以，等他们悔改并得洁净以后，施罚的天使就会离开。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: 你全家
  rationale: 此处指赫马所负责的家庭成员，而非房屋；“你全家”符合现代汉语，也与下文“他们”衔接。
- source_word: ἀνομίας
  choice: 不法之事
  rationale: 保留“不遵从法度、违背正道”的含义，并与随后较宽泛的“罪”并列。
- source_word: παρεπικράνθη
  choice: 被激怒
  rationale: 该词表达因他人的行为而受到强烈冒犯、恼怒；采用被动式保留希腊文句法及施事关系。
- source_word: θλιβῆναι
  choice: 受苦
  rationale: 此处是惩戒性患难或压迫，不只指内心忧伤；“受苦”自然且保持范围宽广。
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: 今世的一切欲望
  rationale: 保留αἰών的时代性与ἐπιθυμία可能包含各种世俗欲求的广度，不窄化为某一种私欲。
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: 施罚的天使
  rationale: 表达这位天使执行惩罚的职能；比“惩罚之天使”更自然，也不暗示其本身受到惩罚。
theological_decisions:
- issue: 家庭成员犯罪与家长受苦之间的关系
  choice: 按原文保留：赫马受苦是为了促使家人悔改洁净
  alternative: 解释为赫马替家人赎罪，或仅说他因管教失职而受罚
  rationale: 本节只陈述其受苦具有促使家人悔改的管教作用，并未明确提出代赎，也未在本句说明其个人失职，因此不作教义化扩展。
- issue: 洁净的主体与方式
  choice: 译作“除净自己里面……”，随后以“得洁净”表达结果
  alternative: 译作神直接洁净他们，或视为仅靠人的自我净化
  rationale: καθαρίσωσιν ἑαυτούς在前句语法上是反身主动，但后句καθαρισθῶσι为被动；译文保留这种张力，不明确指定最终洁净的施行者。
- issue: 天使的身份与权柄
  choice: 保留“荣耀的天使”与“施罚的天使”的不同称谓
  alternative: 将两者解释为同一位或明确区分为两位特定天使
  rationale: 原文在此没有充分解释二者身份关系，故不替文本消除可能的区分或关联。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留直接引语及因果推进；“固然……却……”自然呈现μέν…ἀλλά的让步对照。“一段时间”“今世”“施罚的天使”等用语尽量贴近原文，同时避免生硬的逐词翻译。
