base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/006.yaml
  text: “But those who have the fear of God and inquire about the divine and the truth and have their heart toward the Lord quickly understand and comprehend everything spoken to them, because they have the fear of the Lord within themselves; for where the Lord dwells, there also is abundant understanding. Therefore cling to the Lord, and you will understand and comprehend all things.”
translation:
  language: zh_hans
  text: 但那些敬畏上帝、探求神性和真理、心向着主的人，很快就能领悟并明白对他们所说的一切，因为他们里面有对主的敬畏；主居住在哪里，那里就有丰富的悟性。因此，你要紧紧依附于主，就会领悟并明白一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβον θεοῦ / φόβον τοῦ κυρίου
  choice: 敬畏上帝 / 对主的敬畏
  rationale: φόβος 在此指面对上帝的虔敬与畏惧，译作“敬畏”可避免仅理解为害怕，同时保留原文两种属格表达。
- source_word: ἐρευνῶντες περὶ θεότητος
  choice: 探求神圣之事
  rationale: θεότης 在此与“真理”并列，语境指有关神性、神圣领域的事；“神圣之事”自然且不把含义过度限定为抽象的“神性”。
- source_word: τὴν καρδίαν ἔχοντες πρὸς τὸν κύριον
  choice: 心向着主
  rationale: 贴近原文空间性表达，并以自然汉语表达内心的定向与专注。
- source_word: νοοῦσι καὶ συνίουσιν
  choice: 领悟并明白
  rationale: 保留两个近义动词的并列与强调；“领悟”偏重洞察，“明白”偏重理解。
- source_word: σύνεσις πολλή
  choice: 丰盛的悟性
  rationale: 保留 πολλή 的充足、丰富意味，并用“悟性”对应理解与洞察的能力。
- source_word: κολλήθητι τῷ κυρίῳ
  choice: 紧紧依附主
  rationale: κολλάω 原意为黏合、紧密相连；“紧紧依附”保留其强烈的关系性意象，不弱化为一般的“亲近”。
theological_decisions:
- issue: 敬畏主、主的居住与理解力之间的关系
  choice: 按原文保留直接因果和所在地陈述
  alternative: 解释为圣灵内住所赐的属灵光照
  rationale: 原文只说敬畏在他们里面，并说主居住之处有丰盛悟性；不额外指定其机制或系统化为某一教义表述。
- issue: θεότης 的指涉范围
  choice: 译为“神圣之事”
  alternative: “神性”或“有关上帝的事”
  rationale: 原文措辞具有一定开放性；“神圣之事”既保留抽象与领域含义，也不将其收窄为上帝本体论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文“领悟并明白”的重复强调，以及末句命令式的劝勉力度；本节无需脚注。
