  to: 但那些敬畏上帝、探求神性和真理、心向着主的人，很快就能领悟并明白对他们所说的一切，因为他们里面有对主的敬畏；主居住在哪里，那里就有丰富的悟性。因此，你要紧紧依附于主，就会领悟并明白一切。
