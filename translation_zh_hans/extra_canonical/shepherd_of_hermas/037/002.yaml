base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/002.yaml
  text: “How, lord,” I say, “is it a sister of these? For quick temper seems to me one thing, double‑mindedness another, and sorrow another.”
translation:
  language: zh_hans
  text: 我说：“主啊，悲伤怎么会是这两者的姐妹呢？因为在我看来，易怒是一回事，心怀二意是另一回事，悲伤又是另一回事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύπη
  choice: 悲伤
  rationale: 直接表达忧愁、悲痛的情绪，并与上下文所说的急躁和三心二意并列。
- source_word: ὀξυχολία
  choice: 急躁
  rationale: 该词指容易迅速动怒的性情；“急躁”自然简洁，也保留其脾气易发作的含义。
- source_word: διψυχία
  choice: 三心二意
  rationale: 字面涉及“两个心魂”，语境中指内心摇摆、不坚定；“三心二意”是现代汉语中自然易懂的对应表达。
- source_word: ἀδελφή
  choice: 姐妹
  rationale: 保留原文将这些性情拟人化并视为同类亲属的比喻。
- source_word: κύριε
  choice: 主啊
  rationale: 此处是对说话者的尊称；沿用作品宗教语境中自然、庄重的称呼。
theological_decisions:
- issue: διψυχία所指的内在状态
  choice: 三心二意
  alternative: 疑惑／心怀二意
  rationale: 原词可能涵盖疑惑、摇摆和不忠贞；正文不把它收窄为单纯理智上的怀疑，而用较宽泛的“内心不定”表达。
- issue: κύριε的称呼层级
  choice: 主啊
  alternative: 先生／大人
  rationale: 保留宗教文本中的传统称谓及说话双方的权威关系，同时不额外断定受称者的具体神学身份。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，保留问答语气和原文“三者各不相同”的平行结构。
