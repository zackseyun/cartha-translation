base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/003.yaml
  text: “You are senseless, man,” he says, “and do you not perceive that sorrow is more evil than all the spirits and most dreadful for the servants of God, and that beyond all the spirits it destroys a person and wears away the Holy Spirit—and then saves again?”
translation:
  language: zh_hans
  text: “你这人真不明事理，”他说，“难道你不明白，忧愁比所有的灵都更邪恶，对上帝的仆人最为可怕；它比所有的灵都更败坏人，磨损圣灵，却又再次拯救吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “再次拯救”在原文中没有明说拯救的对象；这句话刻意形成悖论，下一句随即追问忧愁怎能既“磨损”又“拯救”。
    reason: 提示原文真实存在的语法省略和思想张力，避免读者误以为译文遗漏宾语。
lexical_decisions:
- source_word: ἀσύνετος
  choice: 不明事理
  rationale: 表达缺乏领悟力、不能理解的意思；比“愚蠢”更贴近本段关于属灵理解力的语境，同时保留责备语气。
- source_word: λύπη
  choice: 忧愁
  rationale: 指使人陷入悲伤、沮丧的忧愁；采用现代汉语中自然且适合宗教劝诫语境的译法。
- source_word: πνευμάτων
  choice: 灵
  rationale: 原文未在此处明说“邪灵”，故不擅自补入，以保留“比一切灵更邪恶”这一强烈而略显反常的原文措辞。
- source_word: δεινοτάτη
  choice: 危害最大
  rationale: 在“对上帝的仆人”这一结构中，表达可怕、凶险和有害的最高程度，比直译为“最可怕”更自然。
- source_word: καταφθείρει
  choice: 败坏
  rationale: 兼顾彻底损害、毁坏之意，也符合本段的道德和属灵语境。
- source_word: ἐκτρίβει
  choice: 磨损
  rationale: 保留动词本身“磨耗、损耗”的形象及原文关于圣灵的异常强烈说法，不弱化为一般性的“使忧伤”。
- source_word: σώζει
  choice: 拯救
  rationale: 采用其通常意义，保留“忧愁既败坏、磨损，却又拯救”的悖论，留待下文解释。
theological_decisions:
- issue: “磨损圣灵”的强烈表述
  choice: 按希腊文保留“磨损圣灵”
  alternative: 译为“把圣灵排挤出去”或“使圣灵忧伤”
  rationale: ἐκτρίβει 的直接宾语是“圣灵”，原文措辞具有神学张力；不以较熟悉的教义化表达替换。
- issue: “再次拯救”的主语与宾语
  choice: 保留“忧愁”为承接主语，不补出拯救的对象
  alternative: 译为“然后又拯救那人”或改换主语为圣灵
  rationale: 希腊文延续前句主语，但 σῴζειν 的宾语未明说；下句正以“怎能既磨损又拯救”为疑问，因此应保留其含混与悖论。
- issue: “一切灵”的范围
  choice: 译作“一切灵／任何灵”
  alternative: 明确译作“一切邪灵”
  rationale: 本句没有形容词“邪恶的”来限定 πνευμάτων；尽管语境可能指各种恶灵，译文不直接替原文消除范围上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留直接责备的口吻以及原文关于忧愁、众灵和圣灵之间不易化解的张力；分号用来呈现希腊文层层推进的论述结构。
