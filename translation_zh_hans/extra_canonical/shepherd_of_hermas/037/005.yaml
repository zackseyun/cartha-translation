  - severity: low
    issue: “败坏他们”句法和施事关系不够清晰
    rationale: καταφθείρονται 是人受这些行为／事务影响而“被败坏”；改为“使他们昏暗、败坏”能清楚表达原文的被动意义。
  - severity: low
    issue: “神圣之事”在“比喻”搭配中略显抽象
    rationale: “有关神的事”更自然地对应 περὶ θεότητος 和 παραβολὰς τῆς θεότητος，且不把该词限定为神的某一抽象属性。
