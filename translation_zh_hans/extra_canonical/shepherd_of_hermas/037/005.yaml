  naturalness: 整体为自然、庄重的现代汉语。将“心里昏暗，败坏他们”调整为“使他们昏暗、败坏”，并将“偏离原有的悟性”调整为“迷失了心智”，更贴合原文且更顺畅。
  terminology: θεότης 在此处不宜狭义处理为抽象的“神性”。正文使用“有关神的事”较符合汉语搭配，也维持其可涵盖对神及属神事物的宽泛指向；脚注保留语义说明。
