base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/005.yaml
  text: “Listen,” he says. “Those who have never inquired about the truth nor sought concerning the divine, but have only believed, and are mixed up with business affairs and wealth and pagan friendships and many other affairs of this age—so all who devote themselves to these do not understand the parables of the divine; for they are darkened by these pursuits and are corrupted and become barren. Just as good vineyards, when they are neglected, become barren from thorns and various weeds, so also the people who have believed and fall into these many pursuits just mentioned are led astray from their understanding, and they understand nothing at all about righteousness. And even when they hear about the divine and the truth, their mind is occupied with their business, and they understand nothing at all.
translation:
  language: zh_hans
  text: “你听，”他说，“那些从未探究真理，也未寻求有关神的事[a]，只是信了，却又纠缠在生意、财富、与异教徒的交往，以及今世许多其他事务中的人——凡一心扑在这些事上的，都不明白有关神的事的比喻；因为这些事务使他们昏暗、败坏，使他们变得荒芜。正如上好的葡萄园，一旦无人照料，就会因荆棘和各种杂草而荒芜；同样，那些信了以后又陷入上述种种事务的人，也会迷失了心智，对公义一无所知。即使听见有关神的事和真理，他们的心思仍被自己的事务占据，什么也不明白。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有关神的事”所译的希腊词也可译作“神性”或“神圣之事”；这里包括对神及属神真理的认识。
    reason: 原词 θεότης 在此语境中的范围较宽，单一汉语对应词容易把意义过度限定。
lexical_decisions:
- source_word: θεότης
  choice: 神圣之事
  rationale: 本段的 περί θεότητος 与“探究、听见、比喻”等表达相连，语境所指不限于抽象的“神性”属性；译作“神圣之事”较自然，也保留其可指关于神或神性之事的宽度。
- source_word: πραγματείαι / πράξεις / πρᾶξις
  choice: 事务／生意
  rationale: 该词组涵盖经商活动及今世各种牵累；首次按并列语境译为“生意”，后文概括译为“事务”，避免一律窄化成商业。
- source_word: φιλίαις ἐθνικαῖς
  choice: 与异教徒的交往
  rationale: ἐθνικός 在早期基督教语境中指外邦或异教群体；φιλίαι 可指友谊与社会关系，译作“交往”既自然又不额外断定亲密程度。
- source_word: κεχερσωμένοι / χερσοῦνται
  choice: 变得荒芜／荒芜
  rationale: 词语本指土地荒废、未耕，随后以葡萄园作明喻；统一保留农业意象。
- source_word: ἀποπλανῶνται ἀπὸ τῆς διανοίας αὐτῶν
  choice: 偏离原有的悟性
  rationale: 直译结构较含混，表达他们因世务而离开本应有的理解能力，不把它强化为完全失去信仰。
theological_decisions:
- issue: θεότης 的指向
  choice: 正文译“神圣之事”，并加注说明其语义范围
  alternative: 神性／关于上帝的事
  rationale: “神性”在现代汉语中容易被理解为专门讨论神的属性；“关于上帝的事”则较明确地消除了原词的抽象性。现译保留原文在“神、神性、神圣领域”之间的宽度。
- issue: “只是信了”与后续受世务缠累的关系
  choice: 保留“只是信了”的限制性语气，不增补真假信心的判断
  alternative: 只有口头相信／虽已信主
  rationale: 原文 πιστεύσαντες δὲ μόνον 强调只有相信而未进一步探究，但没有在此明确裁定其信仰真伪，故不作教派化解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留葡萄园、荆棘、杂草和荒芜的连贯比喻；对重复出现的“全然不明白”以“一无所知／什么也不明白”自然呈现，同时维持原文的强调。
