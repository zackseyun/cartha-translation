base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/004.yaml
  text: “I, lord,” I say, “am senseless, and I do not understand these parables. For how can it wear away and then save? I do not understand.”
translation:
  language: zh_hans
  text: 我说：“主啊，我实在愚钝，不明白这些比喻。它怎么能既毁坏，又再拯救呢？我不明白。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσύνετος
  choice: 愚昧
  rationale: 表示缺乏领悟和理解，并非现代汉语中偏生理或贬辱性的“无知觉”。
- source_word: παραβολὰς
  choice: 比喻
  rationale: 此处指牧者以隐喻和类比方式所作的教导；“比喻”自然且保留原词的形象性。
- source_word: ἐκτρίβειν
  choice: 损毁
  rationale: 该词可表示磨损、耗尽或毁坏；结合上文“忧愁”对人的破坏作用，译为“损毁”，同时避免擅自补明原句省略的宾语。
- source_word: πάλιν σῴζειν
  choice: 又反过来拯救
  rationale: 保留πάλιν所形成的逆转和原文令人困惑的张力，不将其解释性改写为其他含义。
theological_decisions:
- issue: “损毁”与“拯救”的反常并列
  choice: 保留“既损毁，又反过来拯救”的悖论式表达
  alternative: 按上下文补成“把圣灵赶出去，又拯救人”或修正其中一个动词
  rationale: 原文在本句省略宾语，并刻意呈现说话者不理解的矛盾；不应替作者消解这一文本和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的对话体。“主啊”符合早期基督教劝诫文献中的称呼语气；末尾重复“我不明白”，照原文保留强调。
