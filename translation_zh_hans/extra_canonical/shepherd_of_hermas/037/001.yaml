base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/001.yaml
  text: “Remove sorrow from yourself,” he says, “for it is a sister of double‑mindedness and quick temper.”
translation:
  language: zh_hans
  text: 他说：“你要从自己身上除去忧愁，因为忧愁是心怀二意和急躁易怒的姊妹。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἆρον ἀπὸ σεαυτοῦ
  choice: 要除去你里面的
  rationale: 直译为“从你自己身上除去”；中文用“除去你里面的”自然表达摆脱内在状态，同时保留命令语气。
- source_word: λύπην
  choice: 忧愁
  rationale: 此处指有害的内在哀愁或愁苦；“忧愁”既通俗庄重，也适合后文对其属灵危害的论述。
- source_word: ἀδελφή
  choice: 姊妹
  rationale: 保留原文将忧愁、三心二意和暴躁人格化并视为同类的比喻。
- source_word: διψυχίας
  choice: 三心二意
  rationale: 该词字面有“两个心魂”之意，在《牧人书》中指内心摇摆、不能专一信靠；“三心二意”是现代汉语中自然且易懂的对应表达。
- source_word: ὀξυχολίας
  choice: 暴躁
  rationale: 该词表示易怒、急躁发怒的性情；“暴躁”比单次的“发怒”更能体现持续的性情倾向。
- source_word: φησί
  choice: 他……说
  rationale: 保留叙事中的说话提示；原文未在本句明说人物身份，因此不擅自补为“牧人”或“他对我说”。
theological_decisions:
- issue: “忧愁”与其他恶性情的关系
  choice: 按原文译作“姊妹”
  alternative: 意译为“与……同属一类”
  rationale: 原文有意采用亲属关系的拟人比喻，既表明密切关联，又没有明确断言三者完全相同，故保留其张力。
- issue: διψυχία 的属灵含义
  choice: 三心二意
  alternative: 疑惑不定／心怀二意
  rationale: 不将其限定为某一宗派化的“不信”概念；“三心二意”保留摇摆与不专一的广义含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“除去你里面的忧愁”保留命令力度；“三心二意”和“暴躁”使用普通读者熟悉的表达。
