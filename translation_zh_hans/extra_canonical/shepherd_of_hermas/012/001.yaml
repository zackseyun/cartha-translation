base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/001.yaml
  text: Answering, I say to her, "Lady, this matter is great and marvelous. And the six young men who are building—who are they, Lady?"
translation:
  language: zh_hans
  text: 我回答她说：“夫人，这件事真是重大而奇妙。那六个正在建造的年轻人是谁呢，夫人？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς λέγω αὐτῇ
  choice: 我回答她说
  rationale: 保留分词加现在时叙事的结构和直接引语引入方式，同时采用自然的现代汉语表达。
- source_word: Κυρία
  choice: 夫人
  rationale: 此处是赫马对异象中女性形象的尊称；“夫人”庄重自然，也避免将其误解为神圣称号。
- source_word: μεγάλως καὶ θαυμαστῶς ἔχει τὸ πρᾶγμα τοῦτο
  choice: 这件事实在宏大而奇妙
  rationale: 希腊语字面意为“这事具有宏大而奇妙的性质”；译文保留双重评价，并以“实在”传达副词的强调作用。
- source_word: οἱ νεανίσκοι οἱ ἓξ οἱ οἰκοδομοῦντες
  choice: 那六个正在建造的年轻人
  rationale: 保留人数、年轻人的身份及正在进行的建造行动，不提前补出所建对象。
- source_word: τίνες εἰσίν
  choice: 是谁呢
  rationale: 直接表达身份询问；语气词“呢”使重复称呼下的问句符合现代汉语。
theological_decisions:
- issue: 对异象中女性的称呼是否使用宗教化头衔
  choice: 夫人
  alternative: 主母／女主人
  rationale: 原词在这里是礼貌尊称。采用“夫人”既保留尊敬，也不引入关于该女性身份或权柄的额外神学判断。
- issue: 是否明确“建造”的对象是塔
  choice: 不在本句补出对象
  alternative: 正在建塔的六个年轻人
  rationale: 本句希腊文只用分词“正在建造的”；虽然上下文对象是塔，正文仍保留原句的信息分布。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原文问答节奏和末尾重复呼语。
