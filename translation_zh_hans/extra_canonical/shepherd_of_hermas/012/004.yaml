base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/004.yaml
  text: '"They too are holy angels of God; but these six are superior to them. The building of the tower, then, will be brought to completion, and all together will rejoice around the tower and will glorify God, because the building of the tower has been completed."'
translation:
  language: zh_hans
  text: “他们也是上帝的圣天使；不过，这六位高过他们。因此，塔的建造必将完成，众人都一同在塔周围欢喜，并且荣耀上帝，因为塔的建造已经完成了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχοντες
  choice: 地位更高
  rationale: 表达这六位天使相对于搬运石头者居于更高位阶；比单说“更强”更符合此处关系性的语义，同时不额外规定具体的天使等级体系。
- source_word: συντελεσθήσεται
  choice: 必将完成
  rationale: 保留将来被动式所表达的确定完成，同时用自然的现代汉语呈现。
- source_word: εὐφρανθήσονται
  choice: 要……欢喜
  rationale: 传达共同喜乐、庆贺的含义，并与πάντες ὁμοῦ的“一同”结合。
- source_word: δοξάσουσιν
  choice: 荣耀
  rationale: 采用现代基督教汉语中清楚而庄重的常用表达，保留将荣耀归给上帝的宗教含义。
theological_decisions:
- issue: 六位天使与其他圣天使的关系
  choice: 译作“这六位比他们地位更高”
  alternative: “这六位比他们更强”或“这六位统管他们”
  rationale: 原文ὑπερέχοντες只明确表达居于其上或优越于他们，并未说明这种优越具体是能力、权柄还是固定品级，因此不作更具体的教义化解释。
- issue: 塔建造完成的确定性
  choice: 译作“必将完成”
  alternative: “将会完成”
  rationale: 上下文以预示性的口吻陈述结果；“必将”体现其确定性，但不补充原文未说明的施事者或末世论细节。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；保留引语形式及“圣天使”“荣耀上帝”等宗教语汇。以“塔的四周”自然对应κύκλῳ τοῦ πύργου，并避免引入原文未明说的天使品级名称。
