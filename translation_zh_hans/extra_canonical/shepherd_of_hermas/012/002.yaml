base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/002.yaml
  text: '"These are the holy angels of God, the first-created, to whom the Lord entrusted all his creation, to increase and to build and to rule over all creation. By these, therefore, the building of the tower will be brought to completion."'
translation:
  language: zh_hans
  text: “这些是上帝的圣天使，是最先受造的。主把他所造的一切都交托给他们，要他们使之增长、建造并治理整个受造界。因此，塔的建造必借着他们完成。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἅγιοι ἄγγελοι τοῦ Θεοῦ
  choice: 上帝的圣天使
  rationale: 直接保留所属关系和“圣”的性质，语言自然庄重。
- source_word: οἱ πρῶτοι κτισθέντες
  choice: 最先受造的
  rationale: 保留“首先”与被动受造之意，不进一步推断其具体位阶或受造次序。
- source_word: παρέδωκεν
  choice: 交托给
  rationale: 表达主将责任和权柄委派给这些天使，比单纯“交给”更符合上下文。
- source_word: πᾶσαν τὴν κτίσιν αὐτοῦ
  choice: 他所造的一切
  rationale: 用现代汉语自然表达“他的整个受造物”，同时与后文“整个受造界”形成清楚照应。
- source_word: αὔξειν καὶ οἰκοδομεῖν καὶ δεσπόζειν
  choice: 使之增长、建造并治理
  rationale: 依次保留三个不定式的动作；“治理”表达 δεσπόζειν 的管辖含义，而不过度强化为专横统治。
- source_word: διὰ τούτων
  choice: 借着他们
  rationale: 保留工具或施行媒介的意义。
- source_word: τελεσθήσεται ἡ οἰκοδομὴ τοῦ πύργου
  choice: 塔的建造必……完成
  rationale: 保留将来被动结构及工程达到完成的含义。
theological_decisions:
- issue: 最先受造的天使与其他受造物之间的次序
  choice: 译为“最先受造的”，仅陈述原文
  alternative: 译为“最初被造的六位最高天使”
  rationale: 原文在本句只说“最先受造的”，不宜把上下文中的数量或位阶解释增添进来。
- issue: 天使对受造界的权柄性质
  choice: 译为“治理”
  alternative: 译为“作主”或“统治”
  rationale: δεσπόζειν 确有掌权、管辖之意；“治理”既保留真实权柄，也避免引入有关天使绝对主权的额外神学结论。
- issue: 受造界的增长与建造
  choice: 保留“使之增长、建造”这一较不寻常的并列表述
  alternative: 意译为“发展并完善受造界”
  rationale: 原文的意象及其与塔之建造的呼应具有解释空间，不宜在翻译中将其抽象化或预先解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“受造界”是普通基督教读者可理解的术语；前一句用“他所造的一切”避免连续术语化，使行文更自然。
