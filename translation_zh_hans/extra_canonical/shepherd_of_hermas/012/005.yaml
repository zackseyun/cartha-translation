  text: 3. I asked her, saying, "Lady, I wished to know the outcome of the stones and their power—what sort it is."
translation:
  language: zh_hans
  text: 3. 我问她说：“夫人，我想知道这些石头的归宿，以及它们有怎样的能力。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησα
  choice: 我问
  rationale: 直接表达主动询问，符合叙事语境。
- source_word: Κυρία
  choice: 夫人
  rationale: 保留尊称及阴性称谓，语气庄重自然，不额外界定人物身份。
- source_word: ἔξοδον
  choice: 结局
  rationale: 此处指这些石头最终的去向或结果；“结局”保留一定语义宽度，也符合上下文。
- source_word: δύναμιν
  choice: 能力
  rationale: 较直接对应“力量、能力”，不将其预先解释为象征意义、性质或功效。
- source_word: ποταπή ἐστιν
  choice: 究竟如何
  rationale: 自然传达对其类别或性质的追问，同时保留原文表达的开放性。
theological_decisions:
- issue: 石头的“能力”是否应解释为象征意义或属灵功效
  choice: 直译为“能力”
  alternative: 意义／功效／性质
  rationale: 本句尚未给出解释，直译可避免提前消解异象语言中的含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原文直接引语结构，不增补上下文未明说的解释。
