base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/006.yaml
  text: Answering me, she says, "It is not because you are more worthy than all that it is revealed to you; for there are others before you and better than you, to whom it was fitting that these visions should be revealed. But in order that the name of God might be glorified, it has been revealed to you and will be revealed, for the sake of the double-minded—those who reason within their hearts whether these things are so or not. Tell them that all these things are true, and nothing is outside the truth; rather, all are strong and sure and well-founded."
translation:
  language: zh_hans
  text: 她回答我说：“这事启示给你，并不是因为你比所有人都更配；因为在你以前另有比你更好的人，这些异象本该启示给他们。然而，为使上帝的名得荣耀，这事已经启示给你，也还要启示给你；这是为了那些心怀二意的人，就是那些心里思量这些事究竟是真是假的人。你要告诉他们：这一切都是真的，没有一件偏离真理；这一切都是坚实、可靠、根基稳固的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιώτερος
  choice: 更配
  rationale: 表达比较级“更有资格、更堪当”，并避免将其窄化为道德上的“更正直”。
- source_word: διψύχους
  choice: 心怀二意的人
  rationale: 保留该词“心思分裂、摇摆不定”的伦理与信仰含义；比单纯“怀疑的人”更贴近原文。
- source_word: διαλογιζομένους
  choice: 思量
  rationale: 对应人在心中反复推想、权衡，语气自然且不预先判定其动机。
- source_word: ἔξωθέν ἐστιν τῆς ἀληθείας
  choice: 偏离真理
  rationale: 按原文空间性表达“在真理之外”，用现代汉语自然传达“不属于或背离真实”的意思。
- source_word: ἰσχυρὰ καὶ βέβαια καὶ τεθεμελιωμένα
  choice: 坚实、可靠、根基稳固
  rationale: 保留三个并列形容词的递进与建筑意象，尤其使 τεθεμελιωμένα 与本段建塔语境呼应。
theological_decisions:
- issue: 启示的目的与受启示者的资格
  choice: 明确区分：启示并非因赫马更配，而是为了上帝的名得荣耀并帮助心怀二意者。
  alternative: 把受启示解释为赫马具有特殊属灵地位。
  rationale: 原文直接否定个人资格是启示的原因，并陈明神名得荣耀这一目的。
- issue: οἷς ἔδει ἀποκαλυφθῆναι 的语气
  choice: 译作“本该启示给他们”。
  alternative: “原本可以启示给他们”或“必须启示给他们”。
  rationale: ἔδει 表达适宜或应当；“本该”保留其反事实张力，而不强化为绝对神学必然。
- issue: 真理断言的范围
  choice: 将“这一切”理解为所述异象及其内容，不扩展为对某一教义体系的全面宣称。
  alternative: 泛化为所有宗教教导皆绝对无误。
  rationale: ταῦτα πάντα 的近指对象是这些异象和启示。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和直接引语。“上帝”对应 Θεός；保留“异象”“启示”“心怀二意”等早期基督教文献常用概念。原文段首为阴性分词“她回答我”，与上文说话者一致。未添加脚注，因此正文无脚注标记。
