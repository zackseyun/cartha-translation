  rationale: 在建塔语境中指把石头运送过来；“搬运”自然且保留动作含义。
- source_word: τοὺς λίθους
  choice: 石头
  rationale: 直译其普通复数含义，并与建塔场景一致。
- source_word: τίνες εἰσίν
  choice: 是谁呢
  rationale: 保留询问群体身份的语气；“呢”体现原文连续追问的自然口吻。
