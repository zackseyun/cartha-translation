base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/002.yaml
  text: So, having come to the place, I knelt and began to pray to the Lord and to glorify his name, because he had deemed me worthy and had made known to me my former sins.
translation:
  language: zh_hans
  text: 于是，我来到那地方，便跪下，开始向主祷告，颂扬他的名，因为他看我配得，并使我知道自己从前所犯的罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιθῶ τὰ γόνατα
  choice: 跪下
  rationale: 原意为“屈膝、跪下”，现代汉语用“跪下”自然清楚，也保留祷告时的身体动作。
- source_word: δοξάζειν αὐτοῦ τὸ ὄνομα
  choice: 颂扬他的名
  rationale: 既表达“使其名得荣耀、赞美其名”的含义，又符合现代汉语宗教叙事的庄重语体。
- source_word: ἄξιον ἡγήσατο
  choice: 看我配得
  rationale: 贴近“认为我值得／配得”的判断性表达，不额外说明配得什么，以保留原文的省略。
- source_word: ἐγνώρισέν μοι
  choice: 使我知道
  rationale: 保留使役含义，即主使叙述者认识到自己的罪，而非仅泛指告知。
- source_word: τὰς ἁμαρτίας μου τὰς πρότερον
  choice: 自己从前所犯的罪
  rationale: “从前所犯的罪”比直译“从前的罪”更符合现代汉语，同时不限定这些罪已获赦免或已被除去。
theological_decisions:
- issue: “配得”的对象在原文中未明说
  choice: 保留“看我配得”的省略结构
  alternative: 补作“看我配得领受这启示”
  rationale: 上下文或可暗示配得领受异象或罪的显明，但希腊文本没有明说；译文不替原文消解这一开放性。
- issue: 认识从前之罪的方式与结果
  choice: 译为“使我知道自己从前所犯的罪”
  alternative: 译为“向我揭露并赦免了我从前的罪”
  rationale: 原文只陈述罪被显明或得以认识，并未在本句明确提到赦免，因此不加入额外神学结论。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接前文到达该处的叙事，“便”使动作推进流畅；整体保持第一人称见证叙事的简洁语气。
