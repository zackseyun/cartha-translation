base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/003.yaml
  text: And after I rose from prayer, I see before me the elderly woman whom I had also seen last year, walking and reading a little book. And she says to me, “Are you able to report these things to the elect of God?” I say to her, “Lady, I am not able to remember so many things; but give me the little book, so that I may copy it.” “Take it,” she says, “and you will give it back to me.”
translation:
  language: zh_hans
  text: 我祷告完站起来以后，看见去年见过的那位老妇人就在我面前，一边走一边读着一本小书。她对我说：“你能把这些事传达给上帝所拣选的人吗？”我对她说：“夫人，这么多内容，我记不住；请把这本小书给我，让我抄下来。”她说：“拿去吧，之后要还给我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέραν
  choice: 老妇人
  rationale: 此处名词化的阴性比较级指先前异象中的年长妇人；“老妇人”自然明确，又不额外赋予“长老”等职分含义。
- source_word: βιβλαρίδιον
  choice: 一本小书
  rationale: 保留指小型书卷或册子的指小形式；现代汉语用“小书”通俗自然，不武断限定其装帧。
- source_word: ἀναγγεῖλαι
  choice: 传达
  rationale: 兼顾宣告、转告之意，适合将书中内容告知群体的语境。
- source_word: τοῖς ἐκλεκτοῖς τοῦ Θεοῦ
  choice: 上帝所拣选的人
  rationale: 保留属格关系和“蒙拣选者”的神学含义，同时采用普通读者易懂的表达。
- source_word: μεταγράψωμαι
  choice: 抄下来
  rationale: 指为自己誊抄文本；“抄下来”准确且符合现代叙事口吻。
- source_word: ἀποδώσεις
  choice: 还给
  rationale: 在借出小书的语境中表示归还，直截自然。
theological_decisions:
- issue: “上帝所拣选的人”的群体身份
  choice: 保留为“上帝所拣选的人”
  alternative: 上帝的选民
  rationale: 原文没有进一步界定该群体；所选译法保留神学张力，也避免“选民”在现代读者中可能被过早限定为特定族群或教义范畴。
- issue: 老妇人的身份
  choice: 仅译作“那位老妇人”
  alternative: 女长老／教会
  rationale: 本句原文只以年龄称谓指认她；不把异象人物的象征身份直接写入正文，以免将解释当成翻译。
translation_notes:
  register: 采用现代、庄重而流畅的叙事汉语。保留原文由过去时转为历史现在时的生动感，以“看见……她对我说……我对她说”呈现；对话措辞清楚自然。本文无脚注，因此正文不设脚注标记。
