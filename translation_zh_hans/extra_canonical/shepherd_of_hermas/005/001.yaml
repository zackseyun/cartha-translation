base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/001.yaml
  text: As I was going to Cumae at the same season as the year before, while walking I recalled last year’s vision, and again the Spirit lifts me up and carries me away to the same place as the year before.
translation:
  language: zh_hans
  text: 我前往库迈的时候，正值和去年相同的时节。我一路走着，想起了去年的异象；灵又将我提起，把我带到去年那个地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κούμας
  choice: 库迈
  rationale: 按古代地名 Cumae 音译，采用简洁的现代汉语译名。
- source_word: κατὰ τὸν καιρὸν ὃν καὶ πέρυσι
  choice: 正值和去年相同的时节
  rationale: 保留 καιρός 在此所指的时节或时期，不把它窄化为某个具体日期。
- source_word: περιπατῶν
  choice: 一路走着
  rationale: 自然表达行走过程，同时衔接前往库迈的背景。
- source_word: ὁράσεως
  choice: 异象
  rationale: 符合早期基督教启示叙事的语境，也区别于普通视觉景象。
- source_word: πνεῦμα
  choice: 灵
  rationale: 原文无冠词，既可理解为圣灵，也可泛指灵；译作“灵”以保留原文的指称开放性。
- source_word: αἴρει
  choice: 将我提起
  rationale: 保留动作的超自然色彩，并与随后“带到”形成递进。
- source_word: ἀποφέρει
  choice: 把我带到
  rationale: 在现代汉语中自然传达被带离并送往另一地点的意思，不额外断定具体方式。
theological_decisions:
- issue: πνεῦμα 是否明确指圣灵
  choice: 灵
  alternative: 圣灵
  rationale: 希腊文此处为无冠词 πνεῦμα，直接译成“圣灵”会替原文明确其身份；保留“灵”更忠实于原有歧义。
- issue: 叙事现在时 αἴρει、ἀποφέρει 的时态表达
  choice: 又将我提起，把我带到
  alternative: 又提起了我，把我带到了
  rationale: 原文在过去叙事中突然使用历史现在时，以增强现场感；中文用现在式的连续动作表达，保留这种叙事鲜活感。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原文从过去背景转入历史现在时所产生的临场感，并避免把“灵”的身份解释得比原文更确定。
