base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/004.yaml
  text: So I took it, and withdrawing to a certain place in the field, I copied it all letter by letter, for I could not make out the syllables. And when I had finished the letters of the book, suddenly the little book was snatched from my hand; but by whom I did not see.
translation:
  language: zh_hans
  text: 我接过小书，退到田野中的一处地方，逐个字母把全文抄了下来，因为我辨认不出那些音节。把那小书的字母抄完后，小书忽然从我手中被夺走了；至于是谁夺走的，我没有看见。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: 小书
  rationale: 指一卷或一册较小的书写材料；译作“小书”既保留指小形式，也符合上下文。
- source_word: μετεγραψάμην
  choice: 抄了下来
  rationale: 表示将所见文本转抄成副本，用现代汉语“抄下来”自然准确。
- source_word: πρὸς γράμμα
  choice: 逐字母
  rationale: 直指按一个个字母誊抄，并与后文“音节”形成原文中的对照。
- source_word: οὐχ ηὕρισκον τὰς συλλαβάς
  choice: 我辨认不出那些音节
  rationale: 原句字面近于“我找不出音节”，语境是不能将字母识别或组合为音节；“辨认不出”保留其阅读困难而不额外解释原因。
- source_word: ἡρπάγη
  choice: 被夺走了
  rationale: 被动形式表达突然、强力地从手中取走；“被夺走”保留动作力度及施事者不明。
theological_decisions:
- issue: 夺走小书者的身份
  choice: 保持不明，只译“至于是谁夺走的，我没有看见”
  alternative: 将施事者解释为圣灵、天使或其他超自然存在
  rationale: 希腊文本明确说叙述者没有看见是被谁夺走，因此不应补入身份或教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；保留“字母—音节”的原文对照和施事者不明的悬念，不添加解释性脚注。
