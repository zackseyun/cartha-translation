  source_fidelity: 正文总体准确传达了命令、禁止心中生起相关意念、此举为大罪，以及常念自己的妻子而不致犯罪的对照。然“ὁμοιωμάτων πονηρῶν”应保留为与前项相类的“邪恶事物／形态”，而不宜直接译成“恶事的念头”；原文的“念头”由前置的“关于……（περὶ）”统摄，所思想的对象与该念头须有所区分。
  naturalness: 语体庄重自然。“让有关……的念头涌上心头”比“让关于……念头涌上心头”更合现代汉语搭配，也更清楚呈现原文句法。
