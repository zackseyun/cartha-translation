base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/001.yaml
  text: “I am commanding you,” he says, “to guard chastity, and do not let a thought about another man’s wife, or about any fornication, or about any such evil likenesses, rise up upon your heart. For in doing this you commit a great sin. But if you remember your own wife always, you will never transgress.
translation:
  language: zh_hans
  text: 他对我说：“我吩咐你要持守贞洁；不可让有关别人的妻子[a]、任何淫乱，或诸如此类邪恶之事的念头涌上心头。因为你若这样做，就是犯了大罪。但你若常常记念自己的妻子，就绝不会犯罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别人的妻子”也可译作“别的女人”；原文在这里可有两种理解，但后文与“自己的妻子”相对，较支持正文译法。
    reason: 保留γυναικὸς ἀλλοτρίας中γυνή可指“女人”或“妻子”的词义歧义。
lexical_decisions:
- source_word: ἁγνείαν
  choice: 贞洁
  rationale: 这里的命令紧接着禁止对他人妻子和淫乱起念，语境特指性方面的纯洁；“贞洁”比泛义的“纯洁”更准确自然。
- source_word: γυναικὸς ἀλλοτρίας
  choice: 别人的妻子
  rationale: ἀλλοτρία 表示属于他人的，γυνή 可指女人或妻子；婚姻语境及后句“自己的妻子”支持译作“别人的妻子”，同时以脚注保留词义范围。
- source_word: πορνείας
  choice: 淫乱
  rationale: 采用涵盖不正当性行为的常用中文，不把原词限缩为某一种具体行为。
- source_word: ὁμοιωμάτων πονηρῶν
  choice: 诸如此类恶事的念头
  rationale: 原文直译近于“邪恶的类似之事/形态”；结合与前面内容并列且作心中所念，译成自然中文，同时不具体增补其所指。
- source_word: ἀναβαινέτω σου ἐπὶ τὴν καρδίαν
  choice: 涌上心头
  rationale: 保留“上到心里”的动态意象，并采用现代汉语自然表达。
- source_word: διαμαρτήσεις
  choice: 犯罪
  rationale: 此处指违犯命令、陷入罪中；“犯罪”与上下文“大罪”衔接清楚，避免生硬的“越界”。
theological_decisions:
- issue: 思想中的欲念是否本身构成罪
  choice: 按原文直陈“若这样做，就是犯了大罪”
  alternative: 解释为只有付诸行动才算犯罪
  rationale: ποιῶν τοῦτο 所回指的是让这类念头涌上心头；译文保留原段将内在意念称为罪的张力，不替文本作弱化解释。
- issue: “常常想着自己的妻子”与“绝不会犯罪”的范围
  choice: 保留绝对式表述，不另加“在这事上”
  alternative: 译为“在这方面就不会犯罪”
  rationale: 希腊文 οὐδέποτε διαμαρτήσεις 本身没有明示范围限定；虽语境可能限定于本段所论，正文不擅自补足。
translation_notes:
  register: 采用现代、庄重而易懂的叙述与训诫语体；以“涌上心头”保留原文的心灵意象，以“持守贞洁”“淫乱”“犯了大罪”维持早期基督教伦理文本的严肃力度。
