base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/006.yaml
  text: “I therefore,” he says, “do not give an occasion for this practice to be carried through in this way, but so that the one who has sinned may no longer sin. But with regard to his former sin, there is One who is able to give healing—for he is the One who has authority over all.”
translation:
  language: zh_hans
  text: 他说：“所以，我并不是给这种做法以这种方式实行提供借口，而是要使那犯了罪的人不再犯罪。至于他先前的罪，有一位能够赐下医治；因为他就是拥有统管万有之权柄的那一位。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφορμή
  choice: 提供理由
  rationale: 此词可指机会、由头或借口；译作“提供理由”保留其开放性，也符合说话者否认自己是在为某种处理方式授权的语境。
- source_word: ἡ πρᾶξις
  choice: 这种做法
  rationale: 指上文所谈的处理方式，但原文没有进一步明确限定；采用较宽泛的“做法”，不擅自解释为离婚、分居或再婚。
- source_word: συντελῆται
  choice: 进行到底
  rationale: 该动词含完成、贯彻到底之意；此译法在现代汉语中自然，同时保留原文对该做法最终落实的关注。
- source_word: ἴασιν δοῦναι
  choice: 能够医治
  rationale: 直译其“给予医治”的意象，以“能够医治”表达自然，不弱化罪与医治的比喻。
- source_word: τὴν ἐξουσίαν
  choice: 统管……的权柄
  rationale: ἐξουσία表示权柄、权限或支配权；“权柄”保留宗教文本的庄重语域，“统管”使其与πάντων的关系清楚。
theological_decisions:
- issue: “有一位”所指对象是否明说为上帝
  choice: 保留“有一位”，并以“他”承接
  alternative: 译为“上帝能够医治”
  rationale: 希腊文只说“有一位能够医治”，随后用强调代词αὐτός承接，并未在本句直接点名；保留含蓄指称，避免替原文消除其修辞张力。
- issue: 本句是否在批准某种婚姻处理方式
  choice: 仅译为“不为这种做法照此进行到底提供理由”
  alternative: 明确译作“不准离婚”或“不准再婚”
  rationale: 本句依赖上文语境，但自身用语概括而含蓄；不将特定婚姻立场直接写入译文，以免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。保留原文对“这种做法”的概括指称，以及“有一位”的含蓄神学表达；不添加教派性婚姻术语。
