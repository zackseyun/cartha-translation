base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/003.yaml
  text: I say to him, “Sir, allow me to ask you a few things.” “Speak,” he says. “Sir,” I say, “if someone has a wife who is faithful in the Lord, and he finds her in some adultery, does the husband sin by living together with her?”
translation:
  language: zh_hans
  text: 我对他说：“先生，请允许我问您几件事。”他说：“你问吧。”我说：“先生，如果有人有一位在主里忠信的妻子，发现她犯了某种奸淫，那么丈夫与她共同生活，算不算犯罪呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: 先生
  rationale: 这里是赫尔马对教导者的尊称，并非直接称呼上帝或基督；译作“先生”可保留尊敬语气而避免神学误解。
- source_word: γυναῖκα ... πιστὴν ἐν Κυρίῳ
  choice: 一位在主里忠信的妻子
  rationale: 保留“在主里”的基督徒身份表述；πιστή既可指有信仰，也可指忠信，此处不宜把语义收窄为单一解释。
- source_word: εὕρῃ ἐν μοιχείᾳ τινί
  choice: 发现她有通奸的行为
  rationale: 表达发现妻子涉入某种通奸情形；不额外断定是一次行为、持续关系或当场撞见。
- source_word: συνζῶν μετ᾿ αὐτῆς
  choice: 继续与她共同生活
  rationale: συνζάω表示共同生活；结合前提，加入“继续”使中文逻辑自然，但不将其专门解释为性关系。
- source_word: ἆρα ἁμαρτάνει
  choice: 算不算犯罪呢
  rationale: 再现疑问语气，并以现代宗教语境中自然的“犯罪”表达“犯了罪”。
theological_decisions:
- issue: 丈夫与犯奸淫的妻子继续共同生活是否犯罪
  choice: 仅提出问题，不在本段预先给出答案
  alternative: 依据后文直接暗示或补入肯定回答
  rationale: 本读者分段止于提问；应保留叙事中的悬念及伦理张力，不以随后段落的信息改写本句。
- issue: πιστὴν ἐν Κυρίῳ所指的忠信性质
  choice: 译作“在主里忠信”以保留歧义
  alternative: 译作“信主的”或“对丈夫忠贞的”
  rationale: 原文可突出基督徒身份或忠信品质；直译式表达避免替原文排除其中一种意味。
translation_notes:
  register: 采用现代、庄重而口语顺畅的问答体；称谓统一为“先生”，避免古奥的“主公”等说法，也避免将Κύριε误作对神的称呼。
