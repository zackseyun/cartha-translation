review_pass:
  verdict: revise
  source_fidelity: 整体忠实呈现问答结构，并恰当保留了问题尚未作答的状态。“在主里忠信”可保留πιστὴ的信徒身份／忠信品质双重可能。不过，“却”带出原文未明说的转折预设，“继续”则比συνζῶν（与她同住、共同生活）多加了持续性的强调；宜删去。
  naturalness: 译文总体自然庄重，适合现代汉语问答体。“发现她有通奸的行为”略显迂回，改为“发现她犯了某种奸淫”更贴近原文的ἐν μοιχείᾳ τινί，也更顺畅。
  terminology: Κύριε在此是对发言教导者的敬称，译为“先生”可接受，且不应预先等同于对神的称呼。“在主里忠信”适当地保留了πιστὴν ἐν Κυρίῳ的语义空间。“奸淫”比“通奸的行为”更直接对应μοιχείᾳ；“犯罪”可保留为现代汉语中对ἁμαρτάνει的自然表达。
  issues:
  - severity: low
    issue: “却”引入未明示的转折关系。
    rationale: 原文只是条件句：某人有一位在主里忠信的妻子，并发现她处于某种奸淫中；没有明确的对比连词。
  - severity: low
    issue: “继续与她共同生活”中的“继续”超出原文。
    rationale: συνζῶν μετ᾿ αὐτῆς意为“与她共同生活／同住”；虽然语境可暗示婚内生活的延续，但译文不必明说。
  - severity: low
    issue: “有通奸的行为”表达较迂回。
    rationale: ἐν μοιχείᾳ τινί更直接指“犯了某种奸淫／处于某种奸淫之中”；应保留τινί的不定性，而无需加入“行为”一词。
