base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/002.yaml
  text: '“For if this thought rises up upon your heart, you will transgress—and if other such evil things [do], you commit sin. For this thought is a great sin for a servant of God; and if anyone carries out this evil deed, he brings death upon himself. Look to yourself, then: keep away from this thought; for where modesty dwells, there lawlessness ought not to rise up upon the heart of a righteous man.”'
translation:
  language: zh_hans
  text: “因为这念头若涌上你的心头，你就会犯罪；若有其他同样邪恶的念头也涌上心头，你也在犯罪。[a] 这念头对上帝的仆人来说，是重大的罪；谁若把这恶事付诸行动，就是给自己招来死亡。所以你要当心，远离这念头；因为端庄所居之处，不法就不该涌上义人的心头。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“其他同样邪恶的……”之后省略了动词；正文按上文补出“念头……涌上心头”。
    reason: 标明原文的省略结构，并说明为使汉语完整而依上下文补出的成分。
lexical_decisions:
- source_word: ἐνθύμησις
  choice: 念头
  rationale: 指内心形成并逗留的意念；“念头”自然易懂，又不把它过度限定为幻想、欲望或既定意图。
- source_word: διαμαρτήσεις
  choice: 越轨
  rationale: 此处表示犯过、违犯；“越轨”保留道德越界之意，并避免与下文一般性的“犯罪”完全重复。
- source_word: ἐργάζῃ / κατεργάζεται
  choice: 犯罪／招来
  rationale: 依宾语和语境分别译出：前者是“犯下罪”，后者是为自己造成死亡，即“给自己招来死亡”。
- source_word: σεμνότης
  choice: 端庄
  rationale: 该词含庄重、可敬、纯正的品格意味；“端庄”适合本段贞洁伦理语境，同时没有窄化成单指性纯洁。
- source_word: ἀνομία
  choice: 不法之事
  rationale: 保留违反上帝规范的强烈意味，不将其弱化为普通的坏念头。
- source_word: ἀναβαίνειν ἐπὶ καρδίαν
  choice: 涌上……心头
  rationale: 以现代汉语自然表达保留希腊文“上到心中”的动态意象。
theological_decisions:
- issue: 思想之罪与实际行为的区分
  choice: 将“这念头是重大的罪”与“把这恶事付诸行动……招来死亡”分别表达
  alternative: 把前者解释为仅有诱惑而尚未犯罪，或把两者视为同一程度的行为
  rationale: 原文明确既称该意念为罪，又进一步说明实施恶行会给自己造成死亡；译文保留这种递进及其张力，不替作者建立额外的罪责等级体系。
- issue: “死亡”的性质
  choice: 直译为“死亡”
  alternative: 明确解释为肉身死亡、属灵死亡或永恒沉沦
  rationale: 原文未进一步界定，故不在正文中作宗派性或系统神学式限定。
- issue: 义人心中不该出现不法之事
  choice: 保留规范性措辞“不该”
  alternative: 译成绝对事实“不可能”
  rationale: 希腊文 οὐκ ὀφείλει 表示不应当，而非逻辑上或心理上不可能。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。保留第二人称单数的直接告诫感；“上帝的仆人”“义人”等传统宗教用语清楚自然。
