  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/004.yaml
  text: “As long as he is ignorant,” he says, “he does not sin; but if the husband comes to know her sin, and the wife does not repent but persists in her fornication, and the husband lives together with her, he becomes guilty of her sin and a sharer in her adultery. "What then, sir," I say, "should the husband do, if the wife persists in this passion?" "Let him divorce her," he says, "and let the husband remain by himself; but if, after divorcing his wife, he marries another, he himself also commits adultery." "If then, sir," I say, "after the wife is divorced, she repents and wishes to return to her own husband, will she not be received?" "Indeed," he says, "if the husband does not receive her, he sins and brings a great sin upon himself; rather, the one who has sinned and is repenting must be received—but not repeatedly—for to the servants of God repentance is one. Because of repentance, then, the man ought not to marry. This rule is laid upon both woman and man.
translation:
  language: zh_hans
  text: '他回答：“在不知情的时候，丈夫没有犯罪；但丈夫若知道了妻子的罪，而妻子不悔改，反倒继续淫乱，丈夫还与她共同生活，就成了与她的罪有牵连的人，也在她的奸淫上有份。”


    我问：“主啊，如果妻子执意陷在这种情欲中，丈夫该怎么办呢？”


    他回答：“要与她离异，丈夫要独自生活；但他若与妻子离异后另娶，自己也犯奸淫。”


    我问：“主啊，那么，妻子离异后若悔改，愿意回到自己的丈夫身边，丈夫不该接纳她吗？”


    他回答：“当然应该！丈夫若不接纳她，就是犯罪，使自己担上大罪。犯罪而悔改的人必须得到接纳，但不是一再如此，因为对上帝的仆人来说，悔改只有一次。[a] 因着悔改，丈夫不应另娶。这项规定对妻子和丈夫同样适用。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悔改只有一次”也可理解为“只有一次悔改的机会”。本段尤其针对配偶持续犯罪、离异后悔改并求复合的情形；原文是否意指一切犯罪后的悔改都只能有一次，语义并未完全说明。
    reason: 保留μία的强烈限定，同时避免在正文中擅自裁定其神学范围。
lexical_decisions:
- source_word: Ἄχρι τῆς ἀγνοίας
  choice: 在不知情的时候
  rationale: 按时间范围表达丈夫尚不知道妻子犯罪的阶段，符合希腊语原意，也比直译“直到无知”自然。
- source_word: πορνείᾳ
  choice: 淫乱
  rationale: 此处与妻子的婚外性行为相关，但用词本身较广；译作“淫乱”保留其范围，并与后文特指的“奸淫”有所区分。
- source_word: συνζῇ
  choice: 共同生活
  rationale: 表达继续以夫妻关系同住、共同生活，而不把含义缩窄为单纯居住或性关系。
- source_word: ἔνοχος γίνεται … καὶ κοινωνὸς τῆς μοιχείας αὐτῆς
  choice: 成了与她的罪有牵连的人，也在她的奸淫上有份
  rationale: 分别体现ἔνοχος的罪责牵连与κοινωνός的参与、分享含义，不将两者合并弱化。
- source_word: ἀπολυσάτω αὐτήν
  choice: 要与她离异
  rationale: 在本段婚姻语境中表示解除夫妻共同生活；“离异”比现代法律色彩较强的“办理离婚”更适合古代文本。
- source_word: ἐφ᾿ ἑαυτῷ μενέτω
  choice: 自己独身
  rationale: 意为离开配偶后独自保持现状，不另行结婚。
- source_word: δεχθῆναι
  choice: 接纳
  rationale: 既包含准许悔改的配偶回来，也保留关系恢复的意味。
- source_word: μετάνοια … μία
  choice: 悔改只有一次
  rationale: 形式上忠实保留原文强烈而有张力的陈述，不擅自改写成某一系统神学解释。
- source_word: πρᾶξις
  choice: 准则
  rationale: 在末句指前述处理方式或实践规定；“准则”在现代汉语中清楚而不显得过度法律化。
theological_decisions:
- issue: “悔改只有一次”的范围
  choice: 正文保留原句，并以脚注提示其语境与解释张力
  alternative: 直接解释为洗礼后仅可悔改一次，或仅指此类婚姻事件不可反复
  rationale: 希腊文本本身陈述简短绝对，而上下文聚焦于反复淫乱、离异和复合；译文不应替作者消除这一真实歧义。
- issue: 丈夫继续与不悔改的妻子同住是否等同亲自奸淫
  choice: 译为对她的罪有牵连、在她的奸淫上有份
  alternative: 译为丈夫本人也直接犯了奸淫
  rationale: 原文区分“有罪责/牵连”和“成为她奸淫的共同参与者”，不宜抹平为完全相同的行为。
- issue: 离异后不得另娶的理由
  choice: 保留“因着悔改仍有可能”的上下文逻辑
  alternative: 表述为普遍且无语境限定的婚姻教义
  rationale: 本段明确把不另娶与犯罪配偶可能悔改、应获接纳相连，并说明男女同样适用。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“主啊”对应对尊长的κύριε，在这里是对异象中说话者的敬称，并非必然称呼上帝或基督。句式尽量简洁，保留原文对罪责、奸淫、悔改和接纳之间的张力。
