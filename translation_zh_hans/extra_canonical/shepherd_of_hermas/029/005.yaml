base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/005.yaml
  text: “Not only,” he says, “is it adultery if someone defiles his flesh, but whoever makes images as the nations do is committing adultery. Therefore, even in such works, if someone persists and does not repent, keep away from him and do not live together with him; otherwise you too are a sharer in his sin. For this reason it was commanded you to remain by yourselves, whether man or woman, for in cases like these there can be repentance.
translation:
  language: zh_hans
  text: 他又说：“人玷污自己的身体，不只是这样才算犯奸淫；凡仿照外邦人制作形像的，也是犯奸淫。[a] 所以，若有人在这类行为中执迷不改，你要远离他，不要同他一起生活；不然，你也有份于他的罪。因此，无论男女，你们都受命要各自生活；因为在这类情形中仍可能有悔改。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “形像”对应原文ὁμοιώματα，可指形像、肖像或仿制物。在“仿照外邦人”的语境中，它可能指偶像性形像；原文未在此处使用通常可直译为“偶像”的词。
    reason: 避免将原文词义直接窄化为“偶像”，同时说明语境所容许的理解。
lexical_decisions:
- source_word: μοιχεία / μοιχᾶται
  choice: 犯奸淫
  rationale: 保留原文把身体上的不贞与制造偶像并列为“奸淫”的强烈措辞，不将后一处直接释义为“拜偶像”，以保存其属灵比喻张力。
- source_word: τὰ ὁμοιώματα ποιῇ τοῖς ἔθνεσιν
  choice: 仿效各民族制造偶像
  rationale: ὁμοιώματα可指形像或仿制之物；结合“各民族”及属灵奸淫的语境，译作“偶像”较自然，同时用“仿效”体现与τοῖς ἔθνεσιν的关联。
- source_word: ἐμμένῃ
  choice: 执意做
  rationale: 表达持续、固守于某种行为的含义，并与下文“不悔改”自然衔接。
- source_word: ἀπέχου ἀπ᾽ αὐτοῦ
  choice: 远离他
  rationale: 准确表达避免与此人来往或保持距离的命令。
- source_word: μὴ συνζῆθι αὐτῷ
  choice: 不可与他共同生活
  rationale: 保留συνζάω的共同生活含义，不擅自缩窄为夫妻同房。
- source_word: ἐφ᾽ ἑαυτοῖς μένειν
  choice: 独自守候
  rationale: “独自”体现不另结伴侣，“守候”则结合随后仍可能悔改的理由，表达保留复合可能性的语境。
- source_word: μέτοχος
  choice: 有份于
  rationale: 采用自然且庄重的表达，传达共同参与、分担罪责之意。
theological_decisions:
- issue: 制造形像为何称为奸淫
  choice: 正文保留“犯奸淫”，并以脚注指出此处可能具有属灵不忠的含义
  alternative: 直接译为“犯属灵的奸淫”或“拜偶像”
  rationale: 原文刻意重复μοιχεία/μοιχᾶται，却未加“属灵的”这一限定；保留措辞可避免替作者消解比喻。
- issue: 分居期间的婚姻状态
  choice: 译作“独自守候”，不直接加入“不可再婚”
  alternative: 译作“必须保持不婚”或“不可再婚”
  rationale: 本句本身只说“留在自己这边/独自留下”；虽然上下文涉及不另行婚配，正文仍不应把解释性结论直接写入。
- issue: 悔改的主体
  choice: 译作“对方仍有可能悔改”
  alternative: 笼统译作“这种情况下仍可能有悔改”
  rationale: 希腊文未明说主体，但上下文关注持续犯罪者日后悔改；加“对方”是为现代汉语清晰，同时脚注保留原文表达的宽泛性。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留劝诫体的直接力度，以“固然……也……”“所以”“正因如此”呈现原文论证关系；避免古奥措辞，也不引入特定宗派对偶像、离婚或再婚的教义术语。
