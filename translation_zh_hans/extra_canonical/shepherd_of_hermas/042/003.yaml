base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/003.yaml
  text: 3. But all who are overmastered by them and do not resist them will die utterly; for these desires are deadly.
translation:
  language: zh_hans
  text: 3 但凡被这些恶欲制伏、又不加抵抗的人，终必死亡；因为这些欲望是致命的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακυριευθῶσιν
  choice: 被……制伏
  rationale: 该词表示被支配、辖制；“制伏”既保留其强烈的主宰意味，又能与下文“抵抗”自然对应。
- source_word: μὴ ἀντισταθῶσιν
  choice: 不加抵抗
  rationale: 忠实表达“不站起来反抗／不抵挡”，用现代汉语简洁呈现。
- source_word: ἀποθανοῦνται εἰς τέλος
  choice: 终必死亡
  rationale: εἰς τέλος 可强调最终、彻底的结局；“终必死亡”保留结局性的语气，而不额外界定死亡的神学性质。
- source_word: θανατώδεις
  choice: 致命的
  rationale: 直陈这些欲望带来死亡，符合上下文的警戒语气。
- source_word: αἱ ἐπιθυμίαι αὗται
  choice: 这些欲望
  rationale: 承接前文列举的邪恶欲望；首句为明确所指译作“这些恶欲”，末句则按原文译作“这些欲望”。
theological_decisions:
- issue: “死亡”的性质
  choice: 保留为“死亡”，不加解释
  alternative: 译作“永远灭亡”或“灵性死亡”
  rationale: 原文未明确限定为肉体、灵性或永恒意义上的死亡；译文应保存这种神学张力，避免过度阐释。
- issue: εἰς τέλος 的力度
  choice: 译为“终必”
  alternative: “彻底”或“永远”
  rationale: “终必”表达最终结局和强烈警告，同时避免把该短语确定解释为永恒刑罚或完全毁灭。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体；保留原文“受恶欲辖制—不抵抗—死亡”的紧密因果推进。
