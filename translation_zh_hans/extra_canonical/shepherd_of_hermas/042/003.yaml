  source_fidelity: 译文准确传达了ὅσοι δὲ ἂν…、κατακυριευθῶσιν、μὴ ἀντισταθῶσιν、ἀποθανοῦνται εἰς τέλος及θανατώδεις的逻辑与警戒力度。“终必死亡”以不作教义性细化的方式表达εἰς τέλος的最终、彻底结局，符合英文审校轨迹“will die utterly”，且没有把死亡预先解释为某一种特定意义。
  naturalness: 行文庄重、清楚，适合劝诫文体。“被这些恶欲制伏、又不加抵抗的人”与“因为这些欲望是致命的”的因果衔接自然。“终必死亡”虽较书面，但在此类古代宗教文本的现代庄重语体中通顺可接受。
  terminology: “恶欲”准确承接上文的邪恶欲望；“制伏”充分表达被欲望支配、辖制的含义；“抵抗”准确对应ἀντισταθῶσιν；“致命的”忠实对应θανατώδεις。没有不当引入宗派性术语或解释。
