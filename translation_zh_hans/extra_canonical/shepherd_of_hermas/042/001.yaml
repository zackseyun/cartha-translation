base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/001.yaml
  text: Foremost of all is desire for another’s wife or husband, and for the luxury of wealth, and for many vain foods and drunken drinks, and for many other foolish indulgences; for every indulgence is foolish and empty for the servants of God.
translation:
  language: zh_hans
  text: 最突出的欲望，是贪恋别人的妻子或丈夫，贪图财富所带来的奢华，贪享许多虚浮的美食、令人沉醉的饮品，以及许多其他愚妄的享乐；因为对上帝的仆人来说，一切享乐都是愚妄而空虚的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντων προέχουσα
  choice: 其中最要紧的
  rationale: 表达在诸般恶欲中居首、尤为突出的意思，同时保留希腊文略带省略的句式关系。
- source_word: ἐπιθυμία
  choice: 贪恋／贪图／贪享
  rationale: 本句所列对象不同，按现代汉语搭配作语境化表达；共同保留不正当欲求的负面含义。
- source_word: γυναικὸς ἀλλοτρίας ἢ ἀνδρός
  choice: 别人的妻子或丈夫
  rationale: ἀλλοτρίας直接修饰“妻子”，但并列的“丈夫”在语义上同样指不属于自己的配偶；此译法自然呈现男女双方均适用的意思。
- source_word: πολυτελείας πλούτου
  choice: 财富所带来的奢华
  rationale: 保留“财富”与“奢华”的属格关系，不把它过度简化为单纯爱钱。
- source_word: ἐδεσμάτων πολλῶν ματαίων
  choice: 各样虚浮的美食
  rationale: ματαίων可指徒然、虚空或无益；“虚浮”既保留道德评价，也避免误译为食物本身不真实。
- source_word: μεθυσμάτων
  choice: 令人沉醉的饮品
  rationale: 该词指使人醉的饮品或纵饮；采用较自然且不局限于某一种酒类的表达。
- source_word: τρυφῶν
  choice: 享乐
  rationale: 涵盖奢侈、娇纵和感官享受；“享乐”适合本段概括性的伦理语境。
- source_word: δούλοις τοῦ Θεοῦ
  choice: 上帝的仆人
  rationale: 直译并保留早期基督教伦理劝诫中的身份用语。
theological_decisions:
- issue: 对一切τρυφή的全面否定
  choice: 一切享乐都是愚妄而空虚的
  alternative: 一切奢靡的享受都是愚妄而空虚的
  rationale: 原文确实使用概括性的πᾶσα τρυφή，不宜擅自加上“过度”来缓和；同时以“享乐”承载其偏负面的语感，保留文本本身的严厉张力。
- issue: 婚外欲望的适用对象
  choice: 别人的妻子或丈夫
  alternative: 别人的妻子，或贪恋男人
  rationale: 结合并列结构及英译审校层，译为对他人配偶的欲望最合乎上下文；不将其解释成针对特定性取向的教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体。通过“贪恋、贪图、贪享”的排比增强汉语流畅度，并保留原文对奢华、饮食、醉饮和其他享乐逐项列举的力度。
