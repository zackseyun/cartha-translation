revisions:
- from: 5 所以，你既战胜了邪恶的欲望，戴上冠冕[a]，就要转向追求正义的愿望，把所得的胜利交给它，并照它的意愿服侍它。你若服侍这良善的愿望，顺服它，就能制伏邪恶的欲望，随你的意愿使它屈服。
  to: 5 所以，你既已在对抗它时得了冠冕，就来到那对正义的渴望面前，把你所得的胜利交给它，并照它所愿服事它。你若服事这良善的渴望，并顺服它，就能够辖制邪恶的欲望，并按你的意愿使它顺服。
  rationale: 修订恢复“来到那……渴望面前”的人格化修辞，并以“得了冠冕”自然保留στεφανωθεὶς的冠冕意象和得胜语境。删去脚注，因为正文已可清楚而不过度解释地表达该意象；同时维持原文“辖制”与“使其顺服”两个相连动作的强调。
