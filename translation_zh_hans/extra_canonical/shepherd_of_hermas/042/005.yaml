review_pass:
  verdict: revise
  source_fidelity: 草稿基本准确传达了本节的劝诫逻辑、两类欲望的人格化，以及服事良善欲望所带来的辖制邪恶欲望的能力。然而，“转向追求正义的愿望”把πρὸς τὴν ἐπιθυμίαν τῆς δικαιοσύνης所指的、已人格化的“对正义的渴望”改写为“去追求某个愿望”，弱化了随后“交给它／服事它”的连续人格化结构。
  naturalness: 整体庄重通顺；但“你既战胜了邪恶的欲望，戴上冠冕”在汉语中像是两个并列动作，且“戴上冠冕”不如“得了冠冕”自然。将其改为“既已在对抗它时得了冠冕”，可保留原文冠冕意象及κατ᾽ αὐτῆς的对抗关系。
  terminology: “正义”“良善”“邪恶的欲望”“服事／顺服／辖制”均可用。为准确且自然地表达ἐπιθυμία τῆς δικαιοσύνης，采用“对正义的渴望”；后文以“这良善的渴望”对应ἐπιθυμία ἡ ἀγαθή，并保持同一人格化对象。
  issues:
  - severity: medium
    issue: “转向追求正义的愿望”改变了“来到那对正义的渴望面前”的修辞关系。
    rationale: πρὸς...ἐλθέ与后续“把胜利交给它、服事它”共同将“对正义的渴望”人格化；“追求……愿望”则将其改作人的行动目标。
  - severity: low
    issue: “战胜了……，戴上冠冕”将原文单一分词意象拆成不够自然的并列谓语。
    rationale: στεφανωθεὶς意为“得冠冕／被加冠”，κατ᾽ αὐτῆς说明其在对抗邪恶欲望时所得；修订保留这一意象，不把冠冕简化为纯抽象的胜利。
  revised_text: 5 所以，你既已在对抗它时得了冠冕，就来到那对正义的渴望面前，把你所得的胜利交给它，并照它所愿服事它。你若服事这良善的渴望，并顺服它，就能够辖制邪恶的欲望，并按你的意愿使它顺服。
