base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/005.yaml
  text: 5. So then, having been crowned against it, come to the desire for righteousness, and, handing over to it the victory you received, serve it as it wills. If you serve the good desire and submit to it, you will be able to master the evil desire and to subject it as you wish.
translation:
  language: zh_hans
  text: 5 所以，你既已在对抗它时得了冠冕，就来到那对正义的渴望面前，把你所得的胜利交给它，并照它所愿服事它。你若服事这良善的渴望，并顺服它，就能够辖制邪恶的欲望，并按你的意愿使它顺服。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στεφανωθεὶς κατ᾽ αὐτῆς
  choice: 战胜了邪恶的欲望，戴上冠冕
  rationale: 保留“戴冠冕”的得胜意象，同时将代词所指按上文明确为“邪恶的欲望”，使现代汉语读者易于理解。
- source_word: ἐπιθυμίαν τῆς δικαιοσύνης
  choice: 追求正义的愿望
  rationale: 既保留ἐπιθυμία的“愿望、渴求”含义，也自然表达属格τῆς δικαιοσύνης所指向的正义。
- source_word: παραδοὺς αὐτῇ τὸ νῖκος
  choice: 把所得的胜利交给它
  rationale: 保留原文将“追求正义的愿望”人格化的表达，不将其释义为单纯的“归功于”。
- source_word: δούλευσον αὐτῇ
  choice: 服侍它
  rationale: δούλευω含有作奴仆、服事之意；“服侍”保留其强度，并与本段人格化修辞协调。
- source_word: κατακυριεῦσαι
  choice: 制伏
  rationale: 表达取得支配权、辖制对方的意思，并与后面的“使它屈服”形成递进。
theological_decisions:
- issue: 人对邪恶欲望的得胜与顺服良善愿望之间的关系
  choice: 按原文表达条件与能力：顺服良善的愿望，就能制伏邪恶的欲望
  alternative: 将其扩展为依靠神的恩典或人的意志得胜
  rationale: 本节没有明说得胜能力的终极来源；不引入原文未出现的神学解释，以保留段落本身的劝诫张力。
- issue: “正义的愿望”和“良善的愿望”是否为同一对象
  choice: 沿用原文先称“追求正义的愿望”，后称“这良善的愿望”
  alternative: 两处统一译为同一固定称谓
  rationale: 保留希腊文由ἐπιθυμία τῆς δικαιοσύνης转为ἐπιθυμία ἡ ἀγαθή的措辞变化，同时用“这”清楚表明所指相同。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“愿望”的人格化以及服侍、顺服、制伏等连续动作，呈现原文的修辞结构；为避免孤立段落中代词含混，首次将“它”明确为“邪恶的欲望”。
