base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/004.yaml
  text: 4. But you—put on the desire for righteousness, and, having armed yourself with the fear of the Lord, resist them. For the fear of God dwells in the good desire. If the evil desire sees you armed with the fear of God and resisting it, it will flee far away from you, and it will no longer appear to you, being afraid of your weapons.
translation:
  language: zh_hans
  text: 4 但你要披上对正义的渴望，以敬畏主为装备，抵挡那些邪恶的渴望。因为对上帝的敬畏住在良善的渴望之中。邪恶的渴望若看见你以敬畏上帝全副武装，又抵挡它，就会远远逃离你；它因惧怕你的武器，再也不会在你面前显现。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία
  choice: 渴望
  rationale: 本段用同一希腊词指向善与恶两类欲求；统一译作“渴望”，既保留这种刻意的对应，也比“欲望”用于正义时更自然。按语境分别加上“对正义的”“善的”“邪恶的”限定。
- source_word: δικαιοσύνη
  choice: 正义
  rationale: 此处指与邪恶欲求相对的正直、合宜之道；“正义”简洁地保留其伦理分量，不把含义缩窄为某一特定教义术语。
- source_word: φόβος τοῦ Κυρίου / φόβος τοῦ Θεοῦ
  choice: 敬畏主／对上帝的敬畏
  rationale: “敬畏”能表达宗教语境中兼具畏惧与尊崇的含义；同时依原文分别保留“主”和“上帝”的称谓。
- source_word: καθοπλισάμενος
  choice: 全副武装
  rationale: 该词具有完备装备武器的形象，与下文“武器”相呼应，因此保留军事隐喻。
- source_word: ἀντίστηθι
  choice: 抵挡
  rationale: 准确表达主动站立抗拒、反抗邪恶欲求之意，并符合现代汉语宗教伦理语境。
- source_word: ὀφθήσεται
  choice: 在你面前显现
  rationale: 保留被看见、出现的语义，而不擅自解释为邪念彻底消失。
theological_decisions:
- issue: “敬畏主／上帝”与善的渴望之间的关系
  choice: 直译为“对上帝的敬畏住在善的渴望之中”
  alternative: 意译为“善的愿望总伴随着对上帝的敬畏”
  rationale: 原文使用“居住”隐喻，表达二者内在而持续的关系；直译保留其神学张力，不把它弱化为一般性的伴随关系。
- issue: 邪恶欲求的拟人化
  choice: 保留其“看见、逃离、惧怕、显现”等拟人动作
  alternative: 改写为心理状态逐渐消退
  rationale: 原文把邪恶欲求描绘成会对抗、也会逃跑的敌手；保留拟人及军事意象，避免将文本仅心理化。
- issue: 复数与单数邪恶欲求的转换
  choice: 首句以复数“那些邪恶的渴望”承接上文，随后依原文用单数“邪恶的渴望”
  alternative: 全段统一为复数或单数
  rationale: 原文先以αὐταῖς回指多种邪恶欲求，继而以单数概括并拟人化“邪恶的欲求”；保留转换可呈现其修辞结构。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“披上—全副武装—抵挡—武器”的连续军事意象，也保留“渴望”的善恶对照及拟人化表达；未添加解释性脚注。
