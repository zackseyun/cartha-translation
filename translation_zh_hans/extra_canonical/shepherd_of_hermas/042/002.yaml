base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/002.yaml
  text: 2. These, then, are evil desires, putting the servants of God to death. For this evil desire is the devil’s daughter. Therefore one must abstain from evil desires, so that, by abstaining, you may live to God.
translation:
  language: zh_hans
  text: 2. 因此，这些欲望都是邪恶的，使上帝的仆人死亡。因为这种邪恶的欲望是魔鬼的女儿。因此，必须远离邪恶的欲望，好叫你们因远离这些欲望而为上帝活着。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμίαι / ἐπιθυμία
  choice: 欲望
  rationale: 保留原文可指强烈欲求的宽泛含义，并与上下文所列淫欲、奢华、饮食和宴乐等相衔接。
- source_word: θανατοῦσαι
  choice: 会使……丧命
  rationale: 译出现在分词的致死作用，同时避免把这里的死亡未经说明限定为肉体或属灵意义。
- source_word: ἀπέχεσθαι
  choice: 远离
  rationale: 自然表达克制、戒绝并不参与这些欲望的要求；下文重复处保持同一语义。
- source_word: ζήσητε τῷ Θεῷ
  choice: 向上帝活着
  rationale: 尽量保留与格 τῷ Θεῷ 的关系表达及其神学张力，不擅自释为“为上帝而活”或“在上帝面前活着”。
theological_decisions:
- issue: “死亡”的性质
  choice: 丧命
  alternative: 在灵性上死亡／永远灭亡
  rationale: 原文 θανατοῦσαι 只说明这些欲望具有致死作用，未在本句明确界定死亡的性质，因此不作教派化或末世论式限定。
- issue: 魔鬼与邪恶欲望的亲属隐喻
  choice: 邪恶的欲望是魔鬼的女儿
  alternative: 邪恶的欲望源于魔鬼
  rationale: 保留原文鲜明的拟人和亲属隐喻，不将其弱化为抽象的来源陈述。
- issue: “向上帝活着”的关系
  choice: 向上帝活着
  alternative: 为上帝而活
  rationale: 原文表达简练且具有多重关系可能，直译能保存其含混性，并与“使人丧命”形成对照。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语；保留“魔鬼的女儿”这一拟人隐喻和“向上帝活着”的紧凑神学表达。
