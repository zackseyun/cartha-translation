base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/001.yaml
  text: But I do not know whether these commandments can be kept by a human being, because they are very hard.
translation:
  language: zh_hans
  text: 但我不知道这些诫命是不是人所能遵守的，因为它们实在太难了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολαὶ
  choice: 诫命
  rationale: 在《牧人书》的“命令篇”语境中，指具有约束力的命令；“诫命”既准确又符合庄重的宗教文体。
- source_word: ὑπὸ ἀνθρώπου φυλαχθῆναι
  choice: 人所能遵守的
  rationale: 被动不定式表达“由人守住、遵行”；译成“人所能遵守”自然保留了对人是否有能力实行这些诫命的疑问。
- source_word: σκληραί
  choice: 难
  rationale: 此处形容诫命难以实行，而非字面上的坚硬；“难”与上下文关于能否遵守的讨论最贴切。
- source_word: λίαν
  choice: 实在太
  rationale: 保留原文的强烈程度，同时符合现代汉语自然表达。
theological_decisions:
- issue: 人是否能够遵守这些诫命
  choice: 保留说话者的疑问，不说明人靠自身、恩典或其他力量才能遵守
  alternative: 将句子解释为人凭自身不可能遵守，或明确说人靠神才能遵守
  rationale: 本句原文只提出能力上的疑问并说明诫命很难，尚未界定能力的来源；不应预先消解后文将展开的张力。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“是不是”使第一人称疑问表达流畅，“实在太难了”保留原文的强调力度，适合普通读者阅读。
