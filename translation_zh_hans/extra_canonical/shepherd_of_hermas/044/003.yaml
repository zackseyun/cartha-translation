base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/003.yaml
  text: 'I say to you: if you do not keep these, but neglect them, do not follow the commandments of the devil, which are difficult and bitter and savage and licentious; and do not fear the devil, because he has no power against you. For I will be with you—I, the angel of repentance, who has mastery over him. The devil has only fear, but his fear has no force. Therefore do not fear him, and he will flee from you.”'
translation:
  language: zh_hans
  text: “我告诉你：你若不遵守这些诫命，反而轻忽它们，就不要遵行魔鬼的诫命；那些诫命艰难、苦毒、凶残、放荡。你们[b]不要惧怕魔鬼，因为他没有对付你们的能力。因为我必与你们同在——我就是那掌管他的悔改天使。魔鬼只有恐惧；他的恐惧没有力量。[a]所以不要惧怕他，他就会从你们那里逃走。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “魔鬼只有恐惧；他的恐惧没有力量”直译保留原文措辞。“他的恐惧”既可指他所造成的恐惧，也可指对他的恐惧；按语境，重点是这种恐惧没有实际效力。
    reason: 保留φόβον与φόβος αὐτοῦ之间简练而有歧义的关系，同时说明语境上的理解。
  - marker: b
    text: 本段开头对一个人说“你”，此处起转为对众人说“你们”。
    reason: 原文由单数转为复数；将脚注置于转换处。
lexical_decisions:
- source_word: παρενθυμηθῇς
  choice: 轻忽它们
  rationale: 该词在此表示不把诫命放在心上、疏忽不守；“轻忽”既自然，也保留其内在态度与实际怠慢两层意味。
- source_word: πορευόμενοι
  choice: 去遵行
  rationale: 字面为“行走”，与诫命连用时指按其要求生活行事；译作“遵行”符合现代汉语习惯。
- source_word: ἀσελγέσι
  choice: 放荡
  rationale: 该词可指放纵、无耻或淫逸；“放荡”保留较宽的道德失序含义，不限缩为单一性罪。
- source_word: κατακυριεύων
  choice: 掌管
  rationale: 表示居于其上、对其施行权柄；“掌管”保留权柄关系，同时避免额外发挥为彻底消灭。
- source_word: φόβον
  choice: 叫人害怕
  rationale: 原句直译为“魔鬼只有恐惧”，中文不够明晰；依语境译出其威吓作用，同时以脚注说明原文歧义。
- source_word: τόνον
  choice: 力量
  rationale: 本义涉及张力、劲力或效力；此处说恐惧并无实际作用，译作“力量”简洁而贴合上下文。
theological_decisions:
- issue: 悔改天使对魔鬼的权柄
  choice: 那掌管他的悔改天使
  alternative: 那胜过他的悔改天使
  rationale: 原文强调对魔鬼具有支配权，并未直接说一次性的胜利；“掌管”较少加入原文没有的事件性含义。
- issue: 魔鬼对听众的能力
  choice: 他没有能力加害你们
  alternative: 他在你们身上没有能力
  rationale: καθ’ ὑμῶν 表示“针对你们、敌对你们”；“加害你们”自然表达敌对方向，但不扩张为魔鬼在任何意义上都绝无能力。
- issue: 单数听者转为复数听众
  choice: 先用“你”，随后保留“你们”
  alternative: 全段统一译作“你”
  rationale: 希腊文确实由单数 σοι、φυλάξῃς 转为复数 φοβήθητε、ὑμῶν，保留这一变化，不擅自抹平话语对象的扩展。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留“悔改天使”这一作品内部称号。句式尽量明快，并以破折号呈现说话者的自我说明。原始引文在“不要去遵行魔鬼的诫命”附近语法有讹乱迹象，正文依可恢复的句意及经审校的英文咨询层表达，不在正文中强行展示残缺语法。
