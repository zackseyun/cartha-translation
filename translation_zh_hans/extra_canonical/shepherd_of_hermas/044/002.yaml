base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/002.yaml
  text: Answering, he says to me, “If you set before yourself that they can be kept, you will keep them easily, and they will not be hard. But if it has already arisen in your heart that they cannot be kept by a human being, you will not keep them.
translation:
  language: zh_hans
  text: 他回答我说：“你若自己认定这些诫命能够遵守，就会很容易地遵守它们，它们也不会觉得艰难；但如果你心里已经生出一个念头，认为这些诫命不是人所能遵守的，你就不会遵守它们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προθῇς
  choice: 立定心意，认定
  rationale: 该词在此指人在自己里面预先确立一种判断或决意；合并表达既保留意志层面，也自然传达后接ὅτι从句的认定内容。
- source_word: φυλαχθῆναι / φυλάξεις
  choice: 能够遵守 / 遵守
  rationale: φυλάσσω用于诫命时通常指谨守、遵行；现代汉语以“遵守诫命”最自然清楚。
- source_word: σκληραί
  choice: 难守
  rationale: 字面可作“艰难、严苛”；此处论题是诫命能否被遵守，译作“难守”明确保持语境关联。
- source_word: ἐπὶ τὴν καρδίαν σου ἤδη ἀναβῇ
  choice: 你心里已经冒出一个念头
  rationale: 保留“上到心里”的意象所表达的念头产生，同时采用自然的现代汉语。
- source_word: ὑπὸ ἀνθρώπου
  choice: 人所
  rationale: 泛指人类或任何人，并不限定某个具体的人。
theological_decisions:
- issue: 诫命是否可遵守与人的内在决意之间的关系
  choice: 按原文直陈条件关系，不增添关于恩典、功德或绝对无罪的解释
  alternative: 将其解释为人单靠意志即可完全守律，或反向弱化为仅仅尽力而为
  rationale: 原文强调先入为主的判断会影响实际遵守，却未在本句系统说明能力来源或遵守程度；译文应保留这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留直接引语和条件句的对称结构，使普通读者易懂，同时避免把“能够遵守”扩大解释为任何特定宗派的完全论。
