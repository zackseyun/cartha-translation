base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/005.yaml
  text: She appeared to me, brothers, in the first vision—the one last year—very aged and sitting on a chair. And in the second vision her appearance was younger, but her flesh and her hair were older, and as she stood she spoke to me; and she was more cheerful than before. And in the third vision she was wholly younger and most distinguished in beauty, only her hair was older; and she was cheerful to the end and was seated on a cushioned seat.
translation:
  language: zh_hans
  text: 弟兄们，在去年的第一次异象中，她向我显现时十分年迈，坐在一把椅子上。第二次异象中，她的容貌较为年轻，身体和头发却仍显苍老；她站着对我说话，比先前更为喜悦。第三次异象中，她整体显得更年轻，容貌极其美丽出众，只有头发仍显苍老；她始终满怀喜悦，坐在一张带垫的座椅上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέρα
  choice: 十分年迈／显苍老
  rationale: 依上下文表达外在年龄特征；在后两次异象中用“显苍老”，自然呈现身体与头发保留老态的意思。
- source_word: ὄψιν νεωτέραν
  choice: 容貌较为年轻
  rationale: ὄψις在此指外观、面貌；比较级保留为“较为年轻”。
- source_word: κάλλει ἐκπρεπεστάτη
  choice: 容貌极其美丽出众
  rationale: 兼顾κάλλος的美丽与ἐκπρεπής的卓异、显著，并用最高程度“极其”体现原文强调。
- source_word: ἱλαρωτέρα / ἱλαρὰ
  choice: 更为喜悦／满怀喜悦
  rationale: 该词在此描写神态明朗、喜悦；避免“开朗”过于日常化，也不将其收窄为单纯微笑。
- source_word: συμψελίου
  choice: 带垫的座椅
  rationale: 该词所指家具的具体形制不完全确定；结合英语审校层和上下文，以概括性表达保留其有坐垫、可坐卧的特征。
theological_decisions:
- issue: 老妇人的身份与三种形貌的象征意义
  choice: 只按叙事描述其形貌变化，不在正文中解释象征意义
  alternative: 直接称她为教会，并说明三种年龄形态的寓意
  rationale: 本节经文本身尚未给出解释；提前释义会消除叙事悬念，并把后文的解释导入正文。
- issue: ἱλαρά的情感色彩
  choice: 译为“喜悦”
  alternative: 译为“慈祥”或“容光焕发”
  rationale: “喜悦”最直接保留原词的愉悦、明朗意味，不额外赋予年龄或道德性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体；保持三次异象的平行结构和年龄对比，不增添原文未明说的象征解释。
