  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/008.yaml
  text: Answering him again, I said, “But from you, Lord, we shall learn these things more precisely.”
translation:
  language: zh_hans
  text: 我又回答他说：“不过，主啊，我们会从你这里更确切地知道这些事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... πάλιν εἶπον
  choice: 我又回答他说
  rationale: 保留分词加限定副词的叙事结构，以自然现代汉语表达再次作答。
- source_word: ἀπὸ σοῦ
  choice: 从你这里
  rationale: 忠实保留知识来源于受话者的含义，并突出原文中的代词。
- source_word: κύριε
  choice: 主啊
  rationale: 采用庄重而常用的呼格译法；原文在此是对异象中那位青年人的称呼，不进一步判定其身份。
- source_word: ἀκριβέστερον
  choice: 更确切地
  rationale: 比较级表示对这些事获得更准确、更详尽的认识，而非仅仅‘清楚’。
- source_word: γνωσόμεθα
  choice: 我们会……知道
  rationale: 保留第一人称复数和将来时语气，不擅自改成单数或请求式。
- source_word: αὐτά
  choice: 这些事
  rationale: 指回此前所问老妇人的三种形态，以汉语自然指称表达。
theological_decisions:
- issue: κύριε所指身份
  choice: 译作“主啊”，但不在正文中明确其神性身份
  alternative: 先生啊／大人啊
  rationale: κύριε可作尊称，也可表示“主”；上下文中说话者是异象中的青年人，原文本身未在本句进一步界定身份，因此保留其称谓及张力。
- issue: 第一人称复数γνωσόμεθα
  choice: 保留为“我们会……知道”
  alternative: 我会……知道
  rationale: 希腊文明确使用第一人称复数；即使上下文主要涉及赫尔马本人，也不将其静默改为单数。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原句转折、呼格、比较级和复数主语，不添加解释性内容。
