    你们要留意那将要来到的审判。所以，你们富足的人，要趁塔还没有建成，去寻找饥饿的人；因为塔建成以后，你们会想行善，却不再有余地[b]。因此，你们这些以财富自夸的人要当心，免得缺乏的人叹息，他们的叹息上达于主，你们便和自己的那些财物[c]一同被关在塔门之外。'
