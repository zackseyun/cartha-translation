revisions:
- from: '你们要除去一切邪恶和一切诡诈，使自己成为圣洁。然而，你们不肯离开自己的邪恶。


    所以现在要听我的话：你们彼此要和睦，互相照顾，彼此扶助；不要只顾自己在丰裕中享用上帝所造之物，也要分给那些缺乏的人。有些人因食物过多，反使肉身衰弱，损害自己的身体；而没有食物的人，因为得不到足够的营养，身体也受到损害，甚至败坏。因此，这种失衡[a]对你们这些拥有却不分给缺乏之人的人是有害的。


    你们要留意那将要来到的审判。所以，你们富足的人，要趁塔还没有建成，去寻找饥饿的人；因为塔建成以后，你们即使想行善，也不会再有机会[b]。因此，你们这些以财富自夸的人要当心，免得缺乏的人叹息，他们的叹息上达于主，你们便连同自己那些无用的财物[c]，一起被关在塔门之外。'
