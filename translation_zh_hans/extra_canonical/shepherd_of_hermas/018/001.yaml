review_pass:
  verdict: revise
  source_fidelity: 整体准确涵盖了所限定的希腊文段落，并妥善保留“塔”的意象、临近审判的警告及ἀσχέτων的文本不确定性。但“不要只顾自己”比μή μόνοι（“不要独自”）多加入了责备性的动机色彩；“即使想行善”加入原文没有的让步关系；“诡诈”将σκολιότης偏窄地限定为欺诈。另有少数身体毁损的表达可更贴近原文的层递。
  naturalness: 原译文流畅、庄重，适合现代标准普通话。修订后以“不要独自”“不再有余地”等表达，既自然也更贴近原文。
  terminology: 保留“上帝”“主”“审判”“塔”等用语合宜。“乖谬”用于σκολιότης可保留其“弯曲、偏邪、不正”的广义道德含义，避免限缩为“诡诈”。对方括号内ἀσχέτων不将单一词义作为确定正文，而以脚注说明，较能保持文本歧义。
  issues:
  - severity: medium
    issue: “不要只顾自己在丰裕中享用”
    rationale: μή μόνοι…μεταλαμβάνετε要求不可“独自”享用；“只顾自己”虽符合上下文劝诫，却额外明说主观自私，宜改为“不要独自在丰裕中享用”。
  - severity: low
    issue: “一切诡诈”对应σκολιότης
    rationale: σκολιότης基本意象为弯曲、乖僻、偏邪或不正，不专指诡诈。宜采用较宽的“乖谬”。
  - severity: low
    issue: “即使想行善”
    rationale: 原文是“你们将想要行善，却不会有地方／余地”，没有“即使”的让步语气；删除可避免附加逻辑关系。
  - severity: low
    issue: 末句将方括号词确定译为“无用的”
    rationale: ἀσχέτων在所给底本中属方括号文字，且词义也并非毫无争议。正文不宜把“无用”呈为确定释义；可不直译该不确定修饰语，并在注中说明。
