base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/001.yaml
  text: Be made holy from all wickedness and from all crookedness. But you do not want to depart from your wickedness. Now then, listen to me and be at peace among yourselves, and look after one another and support one another; and do not alone partake of God’s creatures in an overflow of abundance, but share also with those who are in want. For some, from their many foods, bring weakness upon the flesh and ruin their flesh; but the flesh of those who do not have food is ruined because they do not have enough nourishment, and their body is destroyed. This lack of moderation then is harmful to you who have and do not share with those who lack. Look to the judgment that is coming. Therefore, you who are well-off, seek out the hungry while the tower is not yet finished; for after the tower has been finished you will want to do good, and you will not have a place. So watch, you who pride yourselves in your wealth, lest those in need should groan, and their groaning go up to the Lord, and you
    be shut out together with your useless goods outside the door of the tower.
translation:
  language: zh_hans
  text: '你们要脱离一切邪恶和一切乖谬，成为圣洁。然而，你们不肯离开自己的邪恶。


    所以，现在要听我的话：你们要彼此和睦，互相照顾，彼此扶助；不要独自在丰裕中享用上帝所造之物，也要分给那些缺乏的人。有些人因食物太多，使肉身衰弱，又损害自己的肉身；而那些没有食物的人，因得不到足够的食物，肉身受损，身体也毁坏了。因此，这种失衡[a]对你们这些拥有却不分给缺乏之人的人是有害的。


    你们要留意那将要来到的审判。所以，你们富足的人，要趁塔还没有建成，去寻找饥饿的人；因为塔建成以后，你们会想行善，却不再有余地[b]。因此，你们这些以财富自夸的人要当心，免得缺乏的人叹息，他们的叹息上达于主，你们便和自己的那些财物[c]一同被关在塔门之外。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “失衡”也可译作“无节制”或“不协调”，这里指一方过量、另一方不足的状况。
    reason: 希腊词ἀσυνκρασία罕见，且其准确侧重点存在歧义。
  - marker: b
    text: “余地”直译为“地方”；此处也可理解为行善的机会。
    reason: 保留τόπος的字面意义及其可能的象征意味。
  - marker: c
    text: 所据希腊文本在“财物”前有一个置于方括号内的形容词（ἀσχέτων）；该词是否为原文及其确切含义均不确定。
    reason: 向读者披露底本的编辑性不确定，并避免在正文中将有争议的词义确定化。
lexical_decisions:
- source_word: ἁγιασθῆτε ἀπό
  choice: 除去……使自己成为圣洁
  rationale: 保留被动命令“成为圣洁”的核心，同时用自然汉语表达ἀπό所指的与邪恶分离。
- source_word: σκολιότης
  choice: 诡诈
  rationale: 该词可指弯曲、乖僻或不正直；此处与“邪恶”并列，译为“诡诈”能表达道德上的不正直，又不把含义限定为外在行为。
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  choice: 彼此要和睦
  rationale: 按群体内部关系理解，采用现代中文常用而庄重的表达。
- source_word: ἐπισκέπτεσθε
  choice: 互相照顾
  rationale: 该动词在此不是单纯“探访”，而含看顾、关怀之意。
- source_word: ἀντιλαμβάνεσθε
  choice: 彼此扶助
  rationale: 表达主动扶持和帮助，保留互惠性的命令。
- source_word: τὰ κτίσματα τοῦ Θεοῦ
  choice: 上帝所造之物
  rationale: 直译其创造论用语；在上下文中主要涉及食物和物质供应，但不擅自缩窄为“食物”。
- source_word: ἐκ καταχύματος
  choice: 在丰裕中
  rationale: 该罕见表达有充溢、丰盛之意；译文传达拥有过量供应的处境，而避免生硬直译。
- source_word: ἀσυνκρασία
  choice: 失衡
  rationale: 指富者过量、穷者不足所形成的不协调状态；“失衡”比单指个人“无节制”更能涵盖上下文的社会对比。
- source_word: οἱ ὑπερέχοντες
  choice: 富足的人
  rationale: 字面为“居上者、占优势者”，上下文明确针对拥有财富和食物者，故作语境化翻译。
- source_word: τόπον
  choice: 机会
  rationale: 字面为“地方、位置”；此处意指塔完成后不再有行善的余地或时机，正文采用自然汉语，并以脚注保留字面信息。
- source_word: γαυρούμενοι
  choice: 自夸
  rationale: 准确传达因财富而骄傲、夸耀的负面语气。
theological_decisions:
- issue: “塔”完成以后行善不再有τόπος的含义
  choice: 译作“不再有机会”，保留末世性警告
  alternative: “不再有地方”或“不再有余地”
  rationale: 上下文将塔的完成与将来的审判相连；译文不进一步断定悔改、救恩或功德的具体教义机制。
- issue: 施舍与将来审判的关系
  choice: 保持原文直接的因果警告，不添加“凭行为得救”或“仅为信心证据”等解释
  alternative: 以特定教派的救恩论框架改写
  rationale: 原文有意把拒绝分享、穷人的叹息和被关在塔外并置，应保存其神学张力。
- issue: 塔的象征身份
  choice: 保留为“塔”，不在正文解释
  alternative: 直接改译为“教会”
  rationale: 本段自身使用异象象征；虽在《牧人书》更广语境中塔与教会相关，正文不应取代原有意象。
- issue: 末句ἀσχέτων的文本问题
  choice: 依据方括号所示读法译为“无用的”并加注
  alternative: 按其他可能读法译为“不可控制的”或不译
  rationale: 底本文字带编辑性方括号，须明确其文本不确定性，不能把该形容词当作毫无疑问的原文。
translation_notes:
  register: 采用现代标准普通话和简体中文，语气庄重而清楚。命令与审判警告保持直接有力；避免古奥句法，也不淡化富足者对缺乏者的责任。段落按内容逻辑分行，覆盖所指定的reader segment，即从ἁγιασθῆτε至塔门之外。
