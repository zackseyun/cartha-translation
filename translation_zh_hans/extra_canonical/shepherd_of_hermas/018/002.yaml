base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/002.yaml
  text: 'I say to you who lead the church and to the first-seaters: do not become like poisoners. Poisoners carry their drugs in boxes; but you carry your drug and your poison in your heart. You are encrusted and do not wish to cleanse your hearts and to bring your understanding together as one in a pure heart, so that you may receive mercy from the great King. Watch then, children, lest these dissensions of yours deprive you of life. How can you wish to train the Lord’s chosen ones when you yourselves do not have training? Train one another and be at peace among yourselves, so that I also, standing joyfully before the Father, may give an account on behalf of you all to your Lord.'
translation:
  language: zh_hans
  text: '我对你们这些带领教会的人和坐首位的人说：不要像配制毒药的人。配制毒药的人把药物装在匣子里；你们却把自己的药物和毒素藏在心里。你们的心已经刚硬结垢，却不愿洁净自己的心，也不愿在清洁的心中使你们的心思合一，好叫你们从那位伟大的王那里蒙怜悯。


    所以，孩子们，要当心，免得你们的这些纷争夺去你们的生命。你们自己尚未受过教导，怎能想要教导主所拣选的人呢？你们要彼此教导，彼此和睦；好叫我也能欢欢喜喜地站在父面前，为你们众人向你们的主交账。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: 这些带领教会的人
  rationale: προηγουμένοις 指在群体中居领导地位者；译作“带领教会的人”自然清楚，又不预设后世具体职衔。
- source_word: τοῖς πρωτοκαθεδρίταις
  choice: 坐首位的人
  rationale: 保留“首座/首位”的座席意象及其地位含义，避免径直套用特定教阶称号。
- source_word: τοῖς φαρμακοῖς
  choice: 制毒的人
  rationale: 上下文以 φάρμακα、ἰός 构成毒药比喻；此处宜按负面意义理解为配制毒药者，而非现代中性的药剂师。
- source_word: τὰς πυξίδας
  choice: 匣子
  rationale: 指盛放药物的小盒或容器；“匣子”简洁保留古代器物感。
- source_word: ἐνεσκιρωμένοι
  choice: 心已经刚硬结垢
  rationale: 该词含变硬、硬结或结垢之意；结合随后的“洁净你们的心”，以“刚硬结垢”保留身体性隐喻，并补明所指为心。
- source_word: συνκεράσαι ὑμῶν τὴν φρόνησιν ἐπὶ τὸ αὐτό
  choice: 使彼此的心思合而为一
  rationale: 直译为把你们的思想调和到同一处；此译保留群体思想趋于一致的意思，而不解释为制度性统一。
- source_word: παιδεύειν / παιδείαν
  choice: 教导／受过教导
  rationale: 同一词根在句中形成反诘；以相同词根重现修辞联系。παιδεία 也可含训练、管教，但此处“教导”最自然。
- source_word: λόγον ἀποδῶ
  choice: 交账
  rationale: 惯用表达，传达向权威作出说明、呈交责任账目的含义。
theological_decisions:
- issue: “父”与“你们的主”的关系
  choice: 按原文分别译为“父”和“你们的主”
  alternative: 将二者合并或明确认定为同一位格
  rationale: 原文在同一句中使用 πατήρ 与 κύριος，但未解释两者关系；译文保留这种表述张力。
- issue: “主所拣选的人”中“主”的指称
  choice: 保留“主”，不补明具体身份
  alternative: 明确译为“基督所拣选的人”或“上帝所拣选的人”
  rationale: Κυρίου 本身没有在本句进一步限定，故不替原文作神学消歧。
- issue: “生命”所指
  choice: 直译为“生命”
  alternative: 解释为“永生”或“属灵生命”
  rationale: ζωή 在此可能具有终末和救恩意涵，但原文未加限定；保留其开放性。
- issue: 教会领导称谓
  choice: 采用功能性和意象性表达“带领教会”“坐首位”
  alternative: 使用“监督”“长老”“主教”等固定教阶称谓
  rationale: 避免把后世宗派或教制结构倒置进文本。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文毒药、心硬结垢、坐首位和交账等鲜明意象；第二人称复数统一用“你们”。段落按劝诫内容自然分为两段。无脚注，故正文无脚注标记。
