  source_fidelity: 译文整体准确传达了本段的叙事次序、六名建造者、四人搬运带软垫的座椅，以及因其转身而未见面容的原因。惟“她和我说完话后”略将主语处理为双方共同结束谈话；原文更明确是“她停止同我说话”。“抬到塔那里”可理解，但“送往那座塔”更自然，也不对搬运方式作不必要的具体化。
