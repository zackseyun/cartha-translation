base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/003.yaml
  text: X. When she had ceased speaking with me, the six young men who were building came and carried her to the tower, and four others lifted the cushioned seat and carried it also to the tower. I did not see their faces, because they were turned away.
translation:
  language: zh_hans
  text: 十、她停止同我说话后，那六个正在建造的年轻人来了，把她送往那座塔；另有四个人抬起那张带软垫的座椅，也把它送往那座塔。我没有看见他们的脸，因为他们转过身去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἓξ νεανίσκοι οἱ οἰκοδομοῦντες
  choice: 那六个负责建造的年轻人
  rationale: 保留定冠结构所指的已知六人，并以“负责建造”自然表达持续参与建塔者的身份。
- source_word: ἀπήνεγκαν αὐτὴν πρὸς τὸν πύργου
  choice: 把她抬到塔那里
  rationale: 原文末词应为指向塔的表达（所给文本 πύργου 很可能是传抄或OCR问题）；结合上下文，采用表示朝向和目的地的自然汉语。
- source_word: συμψέλιον
  choice: 带软垫的座椅
  rationale: 该词指有垫子的座具；这样既说明物件性质，又避免使用生僻的器物名称。
- source_word: ἀπεστραμμένοι ἦσαν
  choice: 他们背对着我
  rationale: 按语境明确表达其脸转离叙述者；“背对着我”比直译“转过去”更自然清楚。
