  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/006.yaml
  text: 'About these things I was very much distressed, wanting to know this revelation. And I see the aged woman in a vision of the night, saying to me: “Every inquiry has need of humility; therefore fast, and you will receive what you ask from the Lord.” So I fasted one day, and on that very night a young man appeared to me and said to me: “Since you are asking for revelations in prayer, watch lest by asking for many things you harm your flesh. These revelations are sufficient for you. Are you able to see revelations more powerful than those you have seen?”'
translation:
  language: zh_hans
  text: 因这些事，我十分忧愁，想要明白这个启示。夜间，我在异象中看见那位老妇人对我说：“一切求问都需要谦卑；因此，你要禁食，就会从主那里领受你所求的。”于是我禁食了一天；就在那天夜里，有一个青年向我显现，对我说：“你既在祈祷中接连求启示，就要当心，免得因求问太多而伤害自己的身体。这些启示对你已经够了。难道你能看见比你所见过的更强烈的启示吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: 十分忧愁
  rationale: 表达强烈的忧虑和苦恼，符合现代汉语的庄重叙事语体。
- source_word: ἀποκάλυψις
  choice: 启示
  rationale: 在异象语境中指被揭示的属天内容；保留早期基督教文献的常用术语。
- source_word: ταπεινοφροσύνη
  choice: 谦卑
  rationale: 既涵盖卑己的态度，也符合求问时应有的内在姿态。
- source_word: ὑπὸ χεῖρα
  choice: 接连
  rationale: 该短语在此较为困难，可能表示急切、频繁或轻率地求取；译作“接连”保留反复求取的语境，同时不加入过强的责备。
- source_word: βλάψῃς σου τὴν σάρκα
  choice: 伤害自己的身体
  rationale: σάρξ在禁食和身体承受力的语境中指肉身，现代汉语用“身体”更自然清楚。
- source_word: ἰσχυροτέρας ἀποκαλύψεις
  choice: 更强烈的启示
  rationale: ἰσχυρός在此描述启示的强度或震撼程度，并非启示本身具有权力；“更强烈”保留比较意义。
theological_decisions:
- issue: 禁食与领受所求之间的关系
  choice: “你要禁食，就会从主那里领受你所求的”
  alternative: “你要禁食，主就必把你所求的赐给你”
  rationale: 按原文保留老妇人的应许，同时避免把禁食表述为机械地迫使主赐予启示。
- issue: 求问启示受到限制的原因
  choice: 强调身体可能因过多祈求而受损
  alternative: 将其解释为启示本身会直接伤害身体
  rationale: 希腊文把“求得太多”与“伤害身体”连接起来，但具体机制没有说明，因此不作额外教义化解释。
- issue: 末句问话的语气
  choice: “你承受得了吗？”
  alternative: “你能看见吗？”
  rationale: 原文直译是“你能看见……吗”，但语境着重人的身体能否面对更强烈的启示；“承受得了吗”自然呈现其含意，同时保留反问的警戒语气。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；保留“异象、启示、禁食、主”等核心术语。时态上以过去叙事为主，但“我看见”对应希腊文历史现在 βλέπω，使场景更鲜明。
