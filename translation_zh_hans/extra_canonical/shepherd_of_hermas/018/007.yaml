base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/007.yaml
  text: 'And answering him I said, “Lord, this only I ask—that concerning the three forms of the aged woman the revelation may become complete.” He answered me and said: “How long will you be senseless? Rather, your double-mindednesses make you senseless, and your heart is not toward the Lord.”'
translation:
  language: zh_hans
  text: 我回答他说：“主啊，我只求这一件事：愿有关那位老妇人三种形貌的启示得以完全。”他回答我说：“你们还要愚昧到几时呢？你们的三心二意，以及你们的心不向着主，使你们愚昧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: 保留尊称及呼格语气；此处称呼异象中的青年，不额外判定其身份。
- source_word: τῶν τριῶν μορφῶν
  choice: 三种形貌
  rationale: μορφή在此指老妇人三次显现时不同的外在样貌；“形貌”自然且不暗示三个不同实体。
- source_word: ἀποκάλυψις ὁλοτελὴς γένηται
  choice: 启示完整显明
  rationale: 兼顾ὁλοτελής的“完整”和γίνομαι在此所表达的达成、显明之意。
- source_word: ἀσύνετοί
  choice: 愚昧
  rationale: 表达缺乏领悟、不能明白，并保留责备语气。
- source_word: διψυχίαι
  choice: 三心二意
  rationale: 该复数名词表达内心摇摆、不能专一；用现代汉语常用说法保留其属灵与意志层面的张力。
- source_word: τὸ μὴ ἔχειν τὴν καρδίαν ὑμῶν πρὸς τὸν Κύριον
  choice: 因为你们的心没有归向主
  rationale: 将希腊语名词化结构自然转为原因分句；πρός表示心的朝向，以“归向”传达而不扩充为特定教义。
theological_decisions:
- issue: 说话者身份及两处κύριος的指向
  choice: 对青年仍称“主啊”，末句译作“主”
  alternative: 将前者译为“先生”或明确称青年为天使；将后者明确作“上帝”
  rationale: 原文两处均为κύριος，但语境中的指向并不完全相同；译文保留原有称谓，不据此断定青年的神性或具体身份。
- issue: 从单数叙述对象转为复数责备
  choice: 保留“你们”
  alternative: 统一译作“你”
  rationale: 青年回答时原文连续使用复数ἀσύνετοί、ὑμῶν、ὑμᾶς，显然把责备扩展到共同体，不能为行文顺滑而消除。
- issue: διψυχίαι的道德与属灵含义
  choice: 译为“三心二意”
  alternative: 译为“疑惑”“双重心灵”
  rationale: 避免仅缩减为认知上的怀疑，也避免生硬直译；保留对不专一、摇摆之心的批评。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留直接引语、问责力度，以及希腊文由单数请求突然转为复数群体责备的结构。无脚注。
