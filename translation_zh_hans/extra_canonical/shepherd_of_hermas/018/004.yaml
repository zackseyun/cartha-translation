base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/004.yaml
  text: And as she was going, I asked her to reveal to me about the three forms in which she had appeared to me. She answered me and said, “About these, you must ask another, so that it may be revealed to you.”
translation:
  language: zh_hans
  text: 她离去时，我问她，求她把她曾向我显现的三种形貌揭示给我。她回答我说：“关于这些事，你必须去问另一位，好使这些事向你显明。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγουσαν
  choice: 离去时
  rationale: 分词表示她正在离开的同时发生下文动作；译法简洁自然。
- source_word: τῶν τριῶν μορφῶν
  choice: 三种形貌
  rationale: μορφή在此指她显现时呈现的三种外在样貌；“形貌”既保留视觉性，也避免解释为三个位格或本质。
- source_word: ἐνεφανίσθη
  choice: 显现
  rationale: 符合异象叙事语境，并保留主动向叙述者呈现之意。
- source_word: ἕτερον
  choice: 另一位
  rationale: 原词为阳性单数，指另一位可询问者，但身份未明；“另一位”保留未指名状态，且比“另一个”更符合庄重语体。
- source_word: ἀποκαλυφθῇ
  choice: 揭明
  rationale: 保留“使隐藏之事得以显明”的被动含义，又避免在同一句中使用生硬的名词化表达。
theological_decisions:
- issue: 三种μορφαί的性质
  choice: 译作“三种形貌”，不说明其象征或本体意义
  alternative: 三种形态／三个形象
  rationale: 本句只说她以三种μορφαί显现，后文才解释其意义；译文不提前作神学判断。
- issue: 被询问者ἕτερον的身份
  choice: 译作“另一位”，不补出具体人物或天使身份
  alternative: 另一个人／另一位使者
  rationale: 希腊文没有明确交代其身份，故保留叙事上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“求她向我揭明”体现ἠρώτων ἵνα的请求意味；末句补出“答案”作为中文语义承接，但不增加答案的具体内容。
