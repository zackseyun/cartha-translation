  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/002.yaml
  text: Then she called me over, touched my chest, and said to me, "Did my reading please you?" And I said to her, "Lady, these last things please me, but the earlier things are hard and harsh." But she said to me, "These last things are for the righteous, but the earlier are for the nations and for the apostates."
translation:
  language: zh_hans
  text: 她又把我叫到跟前，触摸我的胸口，对我说：“我的宣读，你喜欢吗？”我对她说：“夫人，后面这些话我喜欢，前面的却艰难又严厉。”她对我说：“后面这些话是给义人的，前面的则是给列国和背道者的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεῖται
  choice: 把我叫到跟前
  rationale: 表达召唤某人近前的语义，比单说“叫我”更清楚自然。
- source_word: ἥψατο τοῦ στήθους μου
  choice: 摸了摸我的胸口
  rationale: 保留身体动作及其部位；中文用完成体和叠词使叙述自然，不额外解释象征意义。
- source_word: ἡ ἀνάγνωσίς μου
  choice: 我所读的
  rationale: 这里指她方才宣读的内容；译为关系短语符合现代汉语对话习惯。
- source_word: χαλεπὰ καὶ σκληρά
  choice: 难懂又严厉
  rationale: χαλεπός可指艰难或难以接受，σκληρός可指严厉、刺耳或刚硬；结合所宣读的信息，保留“难”和“严厉”两个层面。
- source_word: τοῖς ἔθνεσιν
  choice: 列国
  rationale: ἔθνη可指各民族、外邦人或列国；此处采用较中性且保留群体性与潜在歧义的“列国”，避免擅自限定为宗教意义上的“外邦人”。
- source_word: τοῖς ἀποστάταις
  choice: 背道者
  rationale: 准确表达离弃原有信仰或立场的人，并保留文本中的宗教伦理力度。
theological_decisions:
- issue: ἔθνη的群体身份
  choice: 列国
  alternative: 外邦人／异教徒
  rationale: 原词本身可涵盖民族或宗教群体；“列国”不把其含义过早收窄为某一特定教义分类。
- issue: 前后两部分信息的适用对象
  choice: 直译为“给义人的”与“给列国和背道者的”
  alternative: 解释为祝福与审判分别临到不同群体
  rationale: 原文只陈述归属或指向，没有明说“祝福”“审判”，故不补入解释，以保留神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“夫人”对应Κυρία，保留赫尔马对女性显现者的尊称；未使用带特定宗派色彩的称谓。
