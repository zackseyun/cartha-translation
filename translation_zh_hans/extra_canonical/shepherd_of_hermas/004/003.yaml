base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/003.yaml
  text: While she was speaking with me, two men appeared, lifted her by the elbows, and went away to where the chair also was, toward the east. She went away cheerful, and as she was going she said to me, "Take courage, Hermas."
translation:
  language: zh_hans
  text: 她正同我说话时，有两个男子出现，从她的双肘扶起她，便往那座椅子也在的地方，就是东方，去了。她愉快地离去，边走边对我说：“赫尔马斯，要刚强！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦραν αὐτὴν τῶν ἀγκώνων
  choice: 扶着她的双肘，将她带走
  rationale: ἦραν本义为“抬起、托起”，与表示抓持部位的τῶν ἀγκώνων连用；译为“扶着……带走”既保留身体动作，也避免中文“抬着双肘”可能造成的误解。
- source_word: πρὸς τὴν ἀνατολήν
  choice: 往……东方去了
  rationale: ἀνατολή在此指东方；保留异象叙事中的明确方位，不额外赋予象征意义。
- source_word: ἱλαρά
  choice: 神情喜悦地
  rationale: 该词表示愉快、欢欣的状态；加入“神情”使现代汉语表达自然，同时不扩大为具体情绪原因。
- source_word: Ἀνδρίζου
  choice: 要刚强
  rationale: 命令式动词意为勇敢、刚强；“要刚强”庄重而自然，也保留劝勉语气。
- source_word: Ἑρμᾶ
  choice: 赫尔马斯
  rationale: 按希腊语人名Ἑρμᾶς音译，并采用现代简体中文常见形式。
theological_decisions:
- issue: 向东方而去是否具有象征意义
  choice: 仅按叙事译出明确方位，不作解释
  alternative: 译文中暗示东方具有神圣或末世象征
  rationale: 原文只陈述去向，未在本句解释其神学意义，应保留文本的开放性。
- issue: Ἀνδρίζου的性别色彩
  choice: 译作“要刚强”
  alternative: 直译为“要像男子一样勇敢”
  rationale: 该动词在语境中已词汇化为勇敢、坚强的劝勉；译作“要刚强”准确传达功能，又不引入现代中文中不必要的性别限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句式紧凑，保留原文动作次序、东方这一方位，以及结尾直接劝勉的力度。
