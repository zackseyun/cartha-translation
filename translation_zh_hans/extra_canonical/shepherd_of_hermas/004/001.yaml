  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/001.yaml
  text: So when she had finished reading and had risen from the chair, four young men came, lifted the chair, and went away toward the east.
translation:
  language: zh_hans
  text: 她诵读完毕，便从椅子上站起来。四个青年男子来到，抬起那把椅子，往东方去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέλεσεν ἀναγινώσκουσα
  choice: 读完
  rationale: 按上下文表示她完成了朗读；现代汉语用“读完”自然简洁。
- source_word: καθέδρα
  choice: 座椅
  rationale: 指她先前坐着的椅子；“座椅”比“座位”更能保留其可被抬走的实体含义，也较“宝座”少作不必要的神学化处理。
- source_word: τέσσαρες νεανίαι
  choice: 四个年轻人
  rationale: νεανίαι泛指年轻男子；译作“年轻人”自然，并不额外强调其身份。
- source_word: πρὸς τὴν ἀνατολήν
  choice: 朝东方
  rationale: 直接保留方向含义，不把ἀνατολή解释为日出或其他象征。
