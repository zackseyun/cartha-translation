base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/003.yaml
  text: He says, "You do not know how to fast to the Lord, nor is this useless fast that you fast to him a fast."
translation:
  language: zh_hans
  text: 他说：“你们不懂得怎样为主禁食；你们为主所守的这种禁食毫无益处，根本算不上禁食。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεύειν τῷ Κυρίῳ
  choice: 向主禁食
  rationale: 保留与格所表达的指向或奉献关系；“向主”也避免把它过度解释为单纯的目的或利益关系。
- source_word: ἀνωφελής
  choice: 毫无益处
  rationale: 准确表达“无用、无益”的含义，并保持原句对这种禁食的否定评价。
- source_word: ἣν νηστεύετε αὐτῷ
  choice: 你们为他所守的这种禁食
  rationale: 用“守禁食”呈现汉语自然搭配，同时保留 αὐτῷ 所指向的“为他／向他”。
theological_decisions:
- issue: 此处是否否定禁食本身
  choice: 明确限定为“这种禁食”毫无益处，并非笼统否定禁食
  alternative: 译作“禁食毫无益处”
  rationale: 指示词 αὕτη 和关系从句都将批评限定于听者正在实行的那一种禁食。
- issue: οὐδέ ἐστιν νηστεία 的断言力度
  choice: 译为“根本算不上禁食”
  alternative: 较形式地译为“也不是禁食”
  rationale: 在现代汉语中自然传达原文对其真实性或资格的强烈否定，同时不额外规定何种禁食才是真正的禁食。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事对话体。“他说”承接上下文；后半句稍作汉语语序调整，以清楚保留原文的重复和强调。
