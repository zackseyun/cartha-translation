base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/006.yaml
  text: '"After a time the master of the servant [and of the field] came and went into the vineyard. And seeing the vineyard well fenced, and even dug, and [all] the weeds pulled out, he rejoiced greatly over his servant on account of his deed. Summoning again his friends and his son, the master announced to them the deed the servant had done with his portions which he had received; and they approved all the more that the servant should become co-heir with his son."'
translation:
  language: zh_hans
  text: 过了一段时间，那仆人和田地的主人[a]来了，走进葡萄园。他看见葡萄园围得整整齐齐，地也翻过了，所有[b]杂草都拔除了，就因仆人所做的事而非常欣喜。主人再次召集朋友和自己的儿子，把仆人用所领受的食物所做的事告诉了他们；他们便更加赞同让这仆人与他的儿子一同承受产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“和田地的”。
    reason: 标示希腊文本中καὶ τοῦ ἀγροῦ的抄本异文。
  - marker: b
    text: 有些抄本没有“所有”。
    reason: 标示希腊文本中πάσας的抄本异文。
lexical_decisions:
- source_word: δεσπότης
  choice: 主人
  rationale: 在主仆关系的叙事中自然表达拥有权威的家主，不额外赋予神学专名意味。
- source_word: κεχαρακωμένον εὐπρεπῶς
  choice: 篱笆修得整整齐齐
  rationale: χαρακόω指用栅栏或围障圈护；译出完成状态，并以自然汉语表达εὐπρεπῶς所含的整齐、美观之意。
- source_word: ἐσκαμμένον
  choice: 地也翻过了
  rationale: 结合葡萄园耕作语境，将“掘过”表达为现代汉语常用的“翻地”。
- source_word: βοτάνας
  choice: 杂草
  rationale: 上下文明确指会妨碍葡萄园生长、需要拔除的草。
- source_word: ἐδέσμασιν
  choice: 食物
  rationale: 保留原词较宽泛的“可吃之物、食物”含义；上下文可理解为主人分给仆人的食物，但不擅自具体化为口粮或份额。
- source_word: συγκληρονόμον
  choice: 一同承受产业
  rationale: 准确表达与主人之子共同成为继承人的含义，同时采用普通读者易懂的庄重措辞。
theological_decisions:
- issue: 主人、儿子与仆人的寓意身份
  choice: 按叙事角色直译，不在正文中指明其神学对应
  alternative: 将“主人”“儿子”神学化或直接标明其所象征的身份
  rationale: 本句本身只陈述比喻情节；应保留后文解释寓意的空间，避免预先锁定诠释。
- issue: 仆人成为共同继承人的表述
  choice: 译为“与他的儿子一同承受产业”
  alternative: 译为“成为他儿子的共同继承人”
  rationale: 两者语义相近；所选译法更符合现代汉语，又保留συγκληρονόμος所表达的共同继承关系，不推断继承产业的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留比喻中的主仆和继承关系，不把角色寓意直接写入正文；两个有明确校勘标记的短语以脚注说明。
