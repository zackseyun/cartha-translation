  naturalness: 叙事体整体自然庄重。“葡萄园的篱笆修得整整齐齐”可更直接地表达为“葡萄园围得整整齐齐”；异文应以脚注锚点呈现，而非在中文词语外保留方括号。
  terminology: “主人”“仆人”“葡萄园”“共同承受产业”均合宜。将συγκληρονόμος译作“与他的儿子一同承受产业”准确且不强加神学解释。
