  to: 过了一段时间，那仆人和田地的主人[a]来了，走进葡萄园。他看见葡萄园围得整整齐齐，地也翻过了，所有[b]杂草都拔除了，就因仆人所做的事而非常欣喜。主人再次召集朋友和自己的儿子，把仆人用所领受的食物所做的事告诉了他们；他们便更加赞同让这仆人与他的儿子一同承受产业。
