base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/005.yaml
  text: He says to me, "I tell you, this is not fasting, the kind you suppose you are fasting to the Lord. Listen to a parable. A vineyard, not having weeds, will give more fruit, not being choked by the weeds. So the servant took up [his tool], dug the vineyard, and pulled up all the weeds that were in the vineyard. And that vineyard became very comely and thriving, having no weeds to choke it.
translation:
  language: zh_hans
  text: 过了一些时候，那仆人和田地[a]的主人来到，进入葡萄园。他看见葡萄园已用栅栏围好，十分美观；园地也翻挖过了，所有杂草都已拔除，葡萄藤茂盛开花，就因仆人所做的事非常高兴。主人再次召集朋友和自己的儿子，把仆人对他所领受的食物所做的事告诉他们；他们就更加赞同让这仆人与主人的儿子一同承受产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本不含“和田地”。
    reason: 希腊文本将καὶ τοῦ ἀγροῦ标作异读；正文保留该读法，并以脚注说明。
lexical_decisions:
- source_word: δεσπότης
  choice: 主人
  rationale: 在比喻的家仆关系中指拥有权柄的家主；译作“主人”自然且不额外引入神学称谓。
- source_word: κεχαρακωμένον
  choice: 篱笆修整得很美观
  rationale: χαρακόω指用桩、栅栏或篱笆围护；结合εὐπρεπῶς，表达园子被妥善而美观地围整。
- source_word: βοτάνας
  choice: 杂草
  rationale: 上下文指会挤压、妨碍葡萄生长的草木，现代汉语以“杂草”最清楚。
- source_word: ἐδέσμασιν
  choice: 食物
  rationale: 指仆人所领受的食物或口粮；采用宽泛、自然的对应词，避免擅自具体化。
- source_word: συγκληρονόμον
  choice: 一同承受产业
  rationale: 保留“共同继承”的核心含义，同时以现代汉语清楚表达与儿子共享继承权。
theological_decisions:
- issue: 仆人与儿子共同继承的身份含义
  choice: 按比喻原文直译为“让这仆人与主人的儿子一同承受产业”
  alternative: 解释为某种特定的救恩、收养或功德教义
  rationale: 本句只叙述比喻中众人的决定；不把其象征意义提前固定为某一宗派解释。
- issue: 主人对仆人行为的认可
  choice: 译为“因仆人所做的事非常高兴”
  alternative: 加入“奖赏其额外功德”等解释
  rationale: 保留πρᾶξις所指的行为及主人的喜悦，不将叙事扩展成系统神学判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。叙事关系以“主人、仆人、儿子”清楚呈现；园艺描写使用普通读者熟悉的“篱笆、翻挖、杂草、茂盛”。源文此处有OCR残缺，正文依据可辨句法、上下文及所给校勘标记谨慎复原，不扩写象征解释。
