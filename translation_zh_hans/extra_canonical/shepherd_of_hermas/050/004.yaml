  text: I say, "Why, sir, do you say this?"
translation:
  language: zh_hans
  text: 我说：“先生，你为什么这么说呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 先生
  rationale: 这里是对牧者的尊称，而不是明确称呼上帝为“主”；译作“先生”可保留礼貌而不引入神学判断。
- source_word: Διατί
  choice: 为什么
  rationale: 直接表达询问对方如此断言的缘由，符合现代汉语习惯。
- source_word: τοῦτο λέγεις
  choice: 你这么说
  rationale: 自然传达“你说这话”的指向，并与上文对话衔接。
theological_decisions:
- issue: κύριε是否应译为神圣称号“主啊”
  choice: 译作“先生”
  alternative: “主啊”
  rationale: 说话对象在叙事中是牧者；原词既可作尊称也可作神圣称号。此处采用一般尊称，以免把对牧者的称呼神化。
translation_notes:
  register: 采用简洁、自然的现代标准汉语对话体；“呢”使追问语气清楚而不过度口语化。
