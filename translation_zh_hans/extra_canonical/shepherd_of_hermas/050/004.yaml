source:
  text: ἐλήλυθας; Ὅτι, φημί, κύριε, στατίωνα ἔχω. 2. Τί, φησίν, ἐστὶ στατίων; Νηστεύω, φημί, κύριε. Νηστεία δέ, φησί, τί ἐστιν αὕτη[, ἣν νηστεύετε]; Ὡς εἰώθειν, φημί, κύριε, οὕτω νηστεύω. 3. Οὐκ οἴδατε, φησί, νηστεύειν τῷ Κυρίῳ, οὐδέ ἐστιν νηστεία αὕτη ἡ ἀνωφελὴς ἣν νηστεύετε αὐτῷ. Διατί, φημί, κύριε, τοῦτο λέγεις; Λέγω σοι, φησίν, ὅτι οὐκ ἔστιν αὕτη νηστεία, ἣν δοκεῖτε νηστεύειν βοτάνας μὴ ἔχων δώσει καρπὸν πλείονα, μὴ πνιγόμενος ὑπὸ τῶν βοτανῶν. λαβὼν ἔσκαψε τὸν ἀμπελῶνα, καὶ πάσας τὰς βοτάνας τὰς οὔσας ἐν τῷ ἀμπελῶνι ἐξέτιλλε. καὶ ἐγένετο ὁ ἀμπελὼν ἐκεῖνος εὐπρεπέστατος καὶ εὐθαλής, μὴ ἔχων βοτάνας πνιγούσας αὐτόν. 5. μετὰ χρόνον ἦλθεν ὁ δεσπότης τοῦ δούλου [καὶ τοῦ ἀγροῦ], καὶ εἰσῆλθεν εἰς τὸν ἀμπελῶνα. καὶ ἰδὼν τὸν ἀμπελῶνα κεχαρακωμένον εὐπρεπῶς, ἔτι δὲ καὶ ἐσκαμμένον, καὶ [πάσας] τὰς βο ἐπὶ τῇ πράξει αὐτοῦ. συγκαλεσάμενος πάλιν τοὺς φίλους ὁ δεσπότης καὶ τὸν υἱὸν αὐτοῦ ἀπήγγειλεν αὐτοῖς τὴν πρᾶξιν αὐτοῦ ἣν ἔπραξεν ἐπὶ τοῖς ἐδέσμασιν αὐτοῦ οἷς ἔλαβεν· οἱ δὲ ἔτι μᾶλλον συνευδόκησαν
    γενέσθαι τὸν δοῦλον συγκληρονόμον τῷ υἱῷ αὐτοῦ.
