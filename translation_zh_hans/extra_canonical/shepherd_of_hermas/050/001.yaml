  text: '"Have you come?" I say, "Because, sir, I am keeping a station."'
translation:
  language: zh_hans
  text: “你来了吗？”我说：“先生，是因为我正在守斋期[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守斋期”原文是στατίων，指按规定守的禁食规期；该词字面与“站立、驻守”有关。下文的“禁食”译自另一词νηστεύω。
    reason: 保留στατίων作为早期基督徒禁食习惯术语的制度性含义，并说明它与下文普通“禁食”用词不同，且不将其限定为单一的“斋戒日”。
lexical_decisions:
- source_word: ἐλήλυθας
  choice: 你来了吗
  rationale: 按现存所给片段保留完成时疑问的基本语义；其前文似有缺失，不擅自补出原因、地点或时间等成分。
- source_word: κύριε
  choice: 先生
  rationale: 此处是赫马对牧者的尊称；译作“先生”自然庄重，又避免在语境未明确时直接译成神称“主”。
- source_word: στατίωνα ἔχω
  choice: 正在守斋戒日
  rationale: στατίων是早期基督徒按特定日子遵守的禁食礼规；采用读者可理解的功能性表达，并以脚注保留其术语背景。
theological_decisions:
- issue: στατίων是否译作一般“禁食”
  choice: 译作“守斋戒日”并加注
  alternative: 我在禁食；我在守站日
  rationale: 下文随即用νηστεύω解释στατίων，表明二者相关但并非单纯重复；“守斋戒日”既体现固定礼规，也不把它扩大成特定宗派制度。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。源文本段从问句末尾开始，可能缺少前置成分，因此不据上下文猜补；对技术词στατίων采用正文释义加脚注的方式。
