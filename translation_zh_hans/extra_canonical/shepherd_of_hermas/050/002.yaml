  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/002.yaml
  text: '"What," he says, "is a station?" I say, "I am fasting, sir." He says, "And what is this fasting that you are fasting?" I say, "As I have been accustomed, sir, so I fast."'
translation:
  language: zh_hans
  text: 他问：“‘守斋’是什么？”我说：“先生，我在禁食。”他说：“这种你们所行的禁食†，是什么呢？”我说：“先生，我一向怎样禁食，现在就怎样禁食。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στατίων
  choice: 守斋
  rationale: 该词借自拉丁语 statio，在早期基督教语境中可指按时持守的宗教性禁食；译作“守斋”既保留其专门称谓，也使随后对“是什么意思”的追问自然成立。
- source_word: νηστεύω / νηστεία
  choice: 禁食
  rationale: 分别对应动词“禁食”和名词“禁食”，用现代汉语的通行表达保留原文反复问答的措辞。
- source_word: κύριε
  choice: 先生
  rationale: 此处是赫尔马对说话者的尊称，不必明确译成神圣称号“主”；“先生”符合叙事关系及现代汉语语域。
- source_word: ὡς εἰώθειν ... οὕτω
  choice: 我一向怎样……现在还是怎样……
  rationale: 表达依照惯常方式行事，既保留前后呼应，也比直译“正如我素常那样”更自然。
theological_decisions:
- issue: στατίων是否直接等同于普通禁食
  choice: 先译为专门称谓“守斋”，再由赫尔马解释为“禁食”
  alternative: 两处都译作“禁食”
  rationale: 原文刻意区分借词 στατίων 与解释它的 νηστεύω；保留区别可呈现对话中的术语解释，也避免提前消除其礼仪性含义。
- issue: κύριε是否译为“主”
  choice: 译为“先生”
  alternative: 译为“主”或“主啊”
  rationale: 这里主要体现礼貌尊称；译成“主”容易使读者误以为赫尔马明确把对话者称作上帝或基督，从而引入原文未在本句中确定的神学判断。
- issue: 括号异文ἣν νηστεύετε的处理
  choice: 纳入正文，译为“你们所守的这种禁食”
  alternative: 省略为“这种禁食是什么呢？”
  rationale: 该短语有文本不确定性，但与上下文及英语审校层一致；纳入后不改变核心意义，并保留复数“你们”的泛指意味。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。通过“守斋／禁食”的术语区别重现原文的问答逻辑，并保留第二个问题中复数“你们”与回答中单数“我”的转换。
