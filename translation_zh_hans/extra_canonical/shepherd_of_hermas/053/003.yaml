base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/003.yaml
  text: “But if, Sir,” I say, “there has been some former ignorance before these words were heard, how will the man who has defiled his flesh be saved?”
translation:
  language: zh_hans
  text: 我说：“可是，主啊，如果有人在听见这些话以前曾处于无知之中，那么玷污了自己肉身的人怎能得救呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 保留对受敬重者的直接称呼；在本书异象对话的语境中，“主啊”庄重自然，同时不额外指明说话对象的身份。
- source_word: ἄγνοια προτέρα
  choice: 曾因无知而犯错
  rationale: ἄγνοια在此不仅指缺乏知识，也指由无知导致的过失；结合后文复数ἀγνοημάτων，以自然中文表达这种道德含义。
- source_word: πρὶν ἀκουσθῶσι τὰ ῥήματα ταῦτα
  choice: 在听见这些话以前
  rationale: 按原文保留时间关系和被动意义，不将“这些话”具体化为某项教训或诫命。
- source_word: ὁ μιάνας τὴν σάρκα αὐτοῦ
  choice: 玷污了自己肉身的人
  rationale: μιάνω译作“玷污”，保留礼仪与道德层面的张力；σάρξ译作“肉身”，避免弱化为单指身体。
- source_word: πῶς σωθῇ
  choice: 怎能得救呢
  rationale: 保留σωθῇ的救恩用语及疑问语气，不预先界定得救的机制。
theological_decisions:
- issue: 先前的无知与个人责任之间的关系
  choice: 译为“曾因无知而犯错”
  alternative: “以前一直处于无知之中”
  rationale: 原文γέγονεν ἄγνοια προτέρα表达较含混，既可指先前的无知状态，也可指无知之过；当前译法结合上下文呈现其道德后果，但不宣称无知自动免除责任。
- issue: “玷污肉身”的含义范围
  choice: 保留原有身体—道德表述
  alternative: 具体译为“犯了淫乱”或泛化为“犯罪”
  rationale: 上下文没有在本句明确限定玷污的具体类型；保留“玷污肉身”可避免加入特定罪类，也不抹去原文的身体性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。以“可是”承接上文的警告；“那么……怎能得救呢”保持询问中的关切与神学张力。
