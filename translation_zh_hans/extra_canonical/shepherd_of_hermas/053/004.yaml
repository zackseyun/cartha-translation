base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/004.yaml
  text: “As to former ignorances,” he says, “God alone is able to give healing concerning them; for all authority is his. But now guard yourself, and the Lord, the Almighty—being full of compassion—will give healing for former ignorances, if from now on you do not defile your flesh or the spirit; for both are shared and cannot be defiled apart from one another. Therefore keep both pure, and you will live to God.”
translation:
  language: zh_hans
  text: 他说：“至于从前因无知而犯的过错，唯有上帝能赐下医治，因为一切权柄都属于他。但现在你要谨守自己；主——全能者——满有怜悯，如果你从今以后不再玷污自己的肉身和灵，他就会就你从前因无知而犯的过错赐下医治。因为二者彼此相属，不能一个受玷污而另一个不受玷污。所以，你要使二者都保持洁净，就必为上帝而活。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγνοημάτων
  choice: 因无知而犯的过错
  rationale: 该词不只表示抽象的“无知”，也指因无知造成的过犯；这样译既保留无意或未蒙教导的意味，也符合现代汉语。
- source_word: ἴασιν δοῦναι
  choice: 医治
  rationale: 保留原文的治疗隐喻，而不直接改译为“赦免”，避免消解作者所用意象及其神学张力。
- source_word: ἐξουσία
  choice: 权柄
  rationale: 表示上帝施行医治的主权和能力；“权柄”比单纯的“能力”更能涵盖此词的语义范围。
- source_word: φύλασσε σεαυτόν
  choice: 谨守自己
  rationale: 兼具警醒、防护和自我约束之意，语体庄重且自然。
- source_word: σάρκα
  choice: 肉身
  rationale: 此处指人的身体性存在；译作“肉身”可与“灵”构成原文对举，又不预设肉身本身邪恶。
- source_word: κοινά ἐστι
  choice: 彼此相连
  rationale: 原词可表达共同、相属或共享；结合下文“不能彼此分开受玷污”，此译自然呈现二者不可分割的关系，同时避免过度具体化。
- source_word: ζήσῃ τῷ Θεῷ
  choice: 向上帝而活
  rationale: 较形式地保留与格结构的开放性，可涵盖“为上帝活”“在上帝面前活”或“归于上帝而活”，不武断限定一种解释。
theological_decisions:
- issue: 上帝对先前无知之过的作为
  choice: 医治
  alternative: 赦免／拯救
  rationale: 原文明确采用ἴασις（医治）而非通常表示赦免的词，因此保留医治意象，不把其救赎含义缩减为特定教义术语。
- issue: 肉身与灵的关系
  choice: 二者彼此相连，不能一个受玷污而另一个不受玷污
  alternative: 二者共有／二者共同属于上帝
  rationale: κοινά本身略有含混；上下文强调二者不可分割地受影响，正文表达这种关系，但不引入身体与灵魂的系统性二元论。
- issue: 条件句与上帝的怜悯
  choice: 只要你从今以后不再玷污……他就会医治
  alternative: 如果你不再玷污……他将医治
  rationale: 忠实保留ἐάν条件句，不把医治表述成无条件，也不额外说明悔改、功德或圣礼机制。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“肉身／灵”“玷污／洁净”“医治”等原文核心对照和意象；用破折号处理“主——全能者——满有怜悯”的插入修饰，使朗读清楚。该读者分段对应原文第3节末句至第4节；方括号内语句按所给校勘文本收入正文，但不另加缺乏版本资料支持的文本批判脚注。
