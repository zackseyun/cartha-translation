base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/002.yaml
  text: '“Listen now,” he says: “Keep this flesh of yours pure and undefiled, so that the spirit that dwells in it may bear witness to it, and your flesh may be justified. Watch lest it ever rise up in your heart that this flesh of yours is perishable, and you misuse it in some defilement. For if you defile your flesh, you will also defile the Holy Spirit; and if you defile the flesh, you will not live.”'
translation:
  language: zh_hans
  text: “现在你要听，”他说，“要保守你这肉身纯洁、毫无玷污，好让住在其中的灵为它作证，你的肉身也得以称义。你要当心，千万别让这样的念头浮上心头：你这肉身是会朽坏的，因而任意用它去做污秽的事。因为，你若玷污自己的肉身，也就玷污圣灵；你若玷污肉身[a]，就不能活。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉身”：此处希腊文本有讹误或传抄疑点；按上下文通常校读为“肉身”。
    reason: 底本以十字符号标出 τὴν σάρκα 为文本疑难；正文采用最符合上下文且为英译咨询层所采纳的读法，同时向读者公开其不确定性。
lexical_decisions:
- source_word: σάρξ
  choice: 肉身
  rationale: 既保留希腊文对有形身体的强调，也避免“肉体”在现代中文中常有的欲望或罪性联想。
- source_word: ἀμίαντος / μιασμός / μιαίνω
  choice: 毫无玷污／污秽／玷污
  rationale: 用同一词族保持原文反复出现的洁净与污染意象。
- source_word: μαρτυρέω
  choice: 为它作证
  rationale: 保留与格 αὐτῇ 所表达的有利见证之意，不把见证的具体内容擅自补明。
- source_word: δικαιόω
  choice: 得以称义
  rationale: 保留原文的司法与认可色彩，以及肉身如何“称义”的神学张力，不弱化为一般性的“得到认可”。
- source_word: παραχράομαι
  choice: 任意用……去做
  rationale: 传达因认定身体会朽坏而滥用身体的含义，中文表达自然，同时不额外限定具体罪行。
theological_decisions:
- issue: 住在肉身中的“灵”与后文“圣灵”的关系
  choice: 前者译“灵”，后者译“圣灵”
  alternative: 两处都译作“圣灵”
  rationale: 原文先用 τὸ πνεῦμα，随后才明确说 τὸ πνεῦμα τὸ ἅγιον；按原文保留这一递进，不提前消除所指上的轻微含混。
- issue: 肉身“得以称义”
  choice: 直译为“得以称义”
  alternative: 译为“得到认可”或“证明无罪”
  rationale: 原文 δικαιωθῇ 带有丰富的司法和神学意味；直译可保留其张力，避免替作者解释肉身因何、以何种意义称义。
- issue: “就不能活”的生命含义
  choice: 保留不加限定的“活”
  alternative: 译为“就不能永远活着”或“就不能向上帝活着”
  rationale: 本句仅说 οὐ ζήσῃ，未明说永生或“向上帝活”；不把后文措辞提前带入。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留直接引语中的劝诫力度，并以“千万别让这样的念头浮上心头”自然表达希腊文的警戒句式；避免古奥措辞及宗派化解释。
