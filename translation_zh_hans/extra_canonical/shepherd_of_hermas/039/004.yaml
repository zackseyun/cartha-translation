base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/004.yaml
  text: Cleanse yourself, then, from this evil sorrow, and you will live to God; and all will live to God, as many as cast off sorrow from themselves and clothe themselves with all cheerfulness.
translation:
  language: zh_hans
  text: 所以，你要洁净自己，除去这种邪恶的忧愁，就必为上帝而活；凡从自己身上抛开忧愁、披上完全的喜乐的人，也都必为上帝而活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάρισον ... σεαυτὸν ἀπὸ
  choice: 洁净自己，除去
  rationale: 保留洁净的核心意象，同时以“除去”自然表达希腊语介词结构所指的摆脱。
- source_word: λύπης τῆς πονηρᾶς
  choice: 邪恶的忧愁
  rationale: λύπη 在本段指压抑、使圣灵忧伤并妨碍祈求的消极忧愁；“忧愁”比“悲伤”更适合此处伦理语境，且 πονηρά 明确译出为“邪恶的”。
- source_word: ζήσῃ τῷ θεῷ
  choice: 必向上帝而活
  rationale: 与格 τῷ θεῷ 的关系有一定张力；采用“向上帝而活”保留方向与归属意味，不简化为普通的“活着”或解释成特定教义表达。
- source_word: ἀποβάλωσιν ἀφ᾿ ἑαυτῶν
  choice: 从自己身上抛开
  rationale: 保留脱去衣物般的动作意象，并与后文“披戴”形成鲜明对照。
- source_word: ἐνδύσωνται πᾶσαν ἱλαρότητα
  choice: 披戴完全喜乐
  rationale: ἐνδύομαι 直译为披戴，与前文“抛开”构成换衣隐喻；πᾶσαν 表示完整、充分，译为“完全”，ἱλαρότης 结合上下文译作“喜乐”。
theological_decisions:
- issue: ζῆν τῷ θεῷ 的神学含义
  choice: 向上帝而活
  alternative: 在上帝里面活着／为上帝而活
  rationale: 原文与格可涵盖关联、归属或方向；“向上帝而活”较少预先限定其为联合、献身或末世生命，保留原句张力。
- issue: 忧愁是否泛指一切悲痛
  choice: 按原文直译为“这种邪恶的忧愁”
  alternative: 使人远离上帝的忧愁
  rationale: 指示词“这种”和形容词“邪恶的”将所责备的忧愁限定为上文所描述的类型；不额外宣称一切哀恸本身都有罪。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“洁净—抛开—披戴”保留原文连续的伦理与衣着意象；两次“向上帝而活”保持原文重复及句法平行。
