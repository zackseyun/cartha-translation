revisions:
- from: 我问：“为什么忧愁之人的祈求不能升到祭坛上呢？”他说：“因为忧愁盘踞在他心里。因此，忧愁掺在祈求中，使这祈求不能纯洁地升到祭坛上。醋和酒混在一起，就不再有原来的甘美；照样，忧愁与圣灵混在一起，也就不再有原来的祈求。”
  to: 我问：“为什么忧愁之人的祈求不能升到祭坛上呢？”他说：“因为忧愁盘踞在他心里。因此，忧愁与祈求混杂，使祈求不能纯净地升到祭坛上。醋和酒混在一起，就没有同样的甘美；照样，忧愁与圣灵混在一起，也没有同样的祈求。”
  rationale: 修订仅删除原文未明说的“原来的”，恢复希腊文重复的“同样的”比较表达；同时微调“混杂”和“纯净地”，使其更贴合原文的混合物譬喻及现代汉语表达。未增添神学解释或脚注。
