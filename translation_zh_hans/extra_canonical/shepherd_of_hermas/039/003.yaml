  naturalness: 整体庄重通顺。“忧愁掺在祈求中”可改为“忧愁与祈求混杂”，更贴近μεμιγμένη的关系，也更清楚地承接下文的类比。“纯净地”在此比“纯洁地”更自然地表达未受混杂的状态。
  terminology: “祈求”“祭坛”“圣灵”“忧愁”均合适且前后一致。“盘踞”能表达ἐγκάθηται的持续停留、占据之意。
