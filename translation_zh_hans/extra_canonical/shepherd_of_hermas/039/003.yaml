base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/003.yaml
  text: “Why,” I ask, “does the prayer of the one who is sorrowing not ascend to the altar?” “Because,” he says, “sorrow has settled in his heart. Therefore sorrow, mixed with the prayer, does not allow the prayer to ascend pure to the altar. For just as vinegar and wine, mixed together, do not have the same pleasantness, so also sorrow, mixed with the Holy Spirit, does not have the same prayer.”
translation:
  language: zh_hans
  text: 我问：“为什么忧愁之人的祈求不能升到祭坛上呢？”他说：“因为忧愁盘踞在他心里。因此，忧愁与祈求混杂，使祈求不能纯净地升到祭坛上。醋和酒混在一起，就没有同样的甘美；照样，忧愁与圣灵混在一起，也没有同样的祈求。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔντευξις
  choice: 祈求
  rationale: 此词在本段指向上帝而升达祭坛的祷告或恳求；“祈求”既保留恳切代求的语义，也比笼统的“祷告”更贴近词义。
- source_word: λύπη / λυπούμενος
  choice: 忧愁／忧愁之人
  rationale: 在上下文中指一种盘踞内心、妨碍祈求的消沉忧苦；采用“忧愁”保留其道德与属灵张力，不弱化为一般的“不开心”。
- source_word: ἐγκάθηται
  choice: 盘踞
  rationale: 表达忧愁已经坐落、滞留在心中的持续状态；“盘踞”自然有力，但不额外断定其来源。
- source_word: καθαράν
  choice: 纯洁地
  rationale: 修饰祈求升达祭坛时未受忧愁混杂的状态；“纯洁地”保留祭坛语境中的洁净意涵。
- source_word: ἡδονήν
  choice: 甘美
  rationale: 此处说醋与酒混合后失去原有的悦人滋味；“甘美”在中文中兼顾味觉和愉悦感，并适合本书庄重的譬喻语体。
- source_word: τὴν αὐτὴν ἔντευξιν οὐκ ἔχει
  choice: 也就不再有原来的祈求
  rationale: 较直译地保留希腊文略显突兀的表达，并按前一句类比将“同样的”理解为混合前原有的性质，不擅自解释为祈求完全无效。
theological_decisions:
- issue: 忧愁与圣灵“混在一起”的含义
  choice: 保留“忧愁与圣灵混在一起”的原文张力
  alternative: 解释为忧愁使圣灵担忧，或解释为忧愁与圣灵所发的祷告混合
  rationale: 希腊文本明确说“忧愁与圣灵混合”，表达在神学上不寻常；译文不替作者消解这种张力，也不引入特定圣灵论解释。
- issue: 祈求不能纯洁地升到祭坛
  choice: 按祭坛意象直译
  alternative: 意译为祷告不能蒙上帝悦纳
  rationale: 原文描绘祈求上升至上帝祭坛的图像，并未直接等同于“上帝不听”；保留意象可避免过度确定其神学机制。
- issue: “不再有原来的祈求”的效力范围
  choice: 保留比较式措辞，不译成“祷告毫无效力”
  alternative: 译作祷告不蒙垂听或失去能力
  rationale: τὴν αὐτὴν…οὐκ ἔχει 强调混合后性质不再相同；上下文虽谈祈求无力上升，本句本身不宜强化为绝对无效。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。问答形式依原文呈现；“祭坛”“圣灵”等核心宗教用语保持稳定。译文保留醋与酒的类比及原文末句的神学张力，不增设解释性脚注。
