base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/001.yaml
  text: Clothe yourself, then, with cheerfulness, which always has favor with God and is acceptable to him, and delight in it. For every cheerful man does good, thinks good things, and despises sorrow.
translation:
  language: zh_hans
  text: 所以，你要披上喜乐；这喜乐常在上帝面前蒙恩，也为他所悦纳。你要以此为乐，因为每一个喜乐的人都行善、心怀善念，并且轻看忧愁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱλαρότητα / ἱλαρός
  choice: 欢欣／欢欣的人
  rationale: 这里指一种与忧愁相对、使人乐于行善的明朗心态；“欢欣”既保留积极喜乐之意，也比口语化的“开心”更符合劝诫文体。
- source_word: ἔχουσαν χάριν παρὰ τῷ θεῷ
  choice: 蒙上帝恩宠
  rationale: 保留 χάρις 的“恩宠、 favor”含义，以及 παρὰ τῷ θεῷ 所表达的在上帝面前蒙恩之意。
- source_word: εὐπρόσδεκτον οὖσαν αὐτῷ
  choice: 为他所悦纳
  rationale: 直陈这种欢欣是上帝所接纳、所喜悦的，不将其弱化为一般性的“讨他喜欢”。
- source_word: ἐντρύφα ἐν αὐτῇ
  choice: 以此为乐
  rationale: ἐντρυφάω 表示享受、以之为乐；此译法自然，并保留主动安享欢欣的劝勉。
- source_word: ἀγαθὰ ἐργάζεται
  choice: 行善
  rationale: 希腊语字面为“做美善的事”；“行善”简洁自然，且与下句的思想层面相配。
- source_word: ἀγαθὰ φρονεῖ
  choice: 思念善事
  rationale: φρονέω 涉及思想、心志和取向；“思念善事”既不局限于偶然想到好事，也避免过度解释为固定教义立场。
- source_word: καταφρονεῖ τῆς λύπης
  choice: 轻看忧愁
  rationale: καταφρονέω 有轻视、不受其支配之意；“轻看”保留原文力度，同时较“蔑视”更适合现代中文劝诫语境。
theological_decisions:
- issue: 欢欣蒙上帝恩宠并为他悦纳的关系
  choice: 按原文并列陈述“蒙上帝恩宠，也为他所悦纳”
  alternative: 解释为欢欣使人赚取上帝的恩典
  rationale: 原文描述欢欣在上帝面前所具有的恩宠与可悦纳性，并未说明它是换取恩典的功德，因此不作因果化或功德化解释。
- issue: “轻看忧愁”是否否定一切悲伤
  choice: 保留本句对 λύπη 的强烈否定措辞
  alternative: 改写为“不要沉溺于有害的忧愁”
  rationale: 后文确实称这种忧愁为邪恶，但本段当前句只说“轻看忧愁”；译文不提前加入限定，也不将其扩展成关于所有悲伤的系统性判断。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“披戴”保留穿衣隐喻；全段保持第二人称单数劝告与随后普遍原则之间的转换。无须脚注。
