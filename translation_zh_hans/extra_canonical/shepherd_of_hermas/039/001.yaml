revisions:
- from: 所以，你要披戴欢欣；欢欣常蒙上帝恩宠，也为他所悦纳。你要以此为乐，因为每一个欢欣的人都行善、思念善事，并且轻看忧愁。
  to: 所以，你要披上喜乐；这喜乐常在上帝面前蒙恩，也为他所悦纳。你要以此为乐，因为每一个喜乐的人都行善、心怀善念，并且轻看忧愁。
  rationale: 作轻微措辞调整，以消除“蒙上帝恩宠”的潜在施恩方向歧义，并改善现代汉语的自然度；未增添任何神学限定或解释。
