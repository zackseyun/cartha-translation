base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/002.yaml
  text: 'But the sorrowful man always acts wickedly: first, he acts wickedly because he grieves the Holy Spirit that was given to the human being as cheerful; second, by grieving the Holy Spirit he works lawlessness, neither praying nor confessing to the Lord. For the prayer of a sorrowful man never has power to ascend to the altar of God.'
translation:
  language: zh_hans
  text: 忧愁的人却总是作恶：第一，他作恶，是因为他使那赐给人、原是喜乐的圣灵忧伤；第二，他使圣灵忧伤，便行了不法的事，既不向主祈求，也不向主认罪。因为忧愁之人的祈求总没有力量上达神的祭坛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπηρὸς
  choice: 忧愁的人
  rationale: 与本段反复出现的 λύπη（忧愁）保持词根呼应，并自然表达受忧愁支配之人。
- source_word: πονηρεύεται
  choice: 作恶
  rationale: 此处既可指怀有恶念，也可指行恶；结合后文 ἀνομίαν ἐργάζεται，译作概括性的“作恶”，保留其道德含义。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 采用现代汉语中通行而庄重的对应词。
- source_word: ἱλαρόν
  choice: 喜乐的
  rationale: 该形容词在语法上修饰“圣灵”，直译以保留原文较不寻常的表述，不改释为圣灵使人喜乐。
- source_word: ἀνομίαν ἐργάζεται
  choice: 行了不法的事
  rationale: 保留 ἀνομία 的“违背法度、无法”语义，同时使现代读者易懂。
- source_word: ἐντυγχάνων
  choice: 祈求
  rationale: 在向主及上达祭坛的语境中指代祷告性的恳求；“祈求”也与后句名词 ἔντευξις 对应。
- source_word: ἐξομολογούμενος
  choice: 认罪
  rationale: 该词可表示承认、宣认、感谢或认罪；与“不法”及“向主”的语境相连时，“认罪”最合适，但其歧义需说明。
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 直接保留原文的礼仪意象，不将其解释性改写为神的面前。
theological_decisions:
- issue: 圣灵被描述为 ἱλαρόν 的语法与含义
  choice: 那赐给人、原是喜乐的圣灵
  alternative: 那赐给人、使人喜乐的圣灵
  rationale: 希腊文中 ἱλαρόν 与“圣灵”同为中性，最自然地修饰圣灵本身；译文保留这一神学上较为特别的说法，不静默转化为圣灵赐予喜乐。
- issue: ἐξομολογούμενος 的敬拜或认罪含义
  choice: 向主认罪
  alternative: 向主承认／颂赞／感谢
  rationale: 上下文将忧愁与行不法相连，因此“认罪”较贴切；但该动词语义宽广，故以脚注保留其他可能。
- issue: 忧愁之人的祈求不能上达祭坛
  choice: 按原文保留其绝对而劝诫性的陈述
  alternative: 弱化为祷告受到妨碍或较难蒙悦纳
  rationale: 原文 πάντοτε…οὐκ ἔχει δύναμιν 表达强烈的绝对措辞；不以系统神学推断削弱作者的修辞力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“使圣灵忧伤”“上达神的祭坛”等原文意象，并以“既不……也不……”呈现两个并列分词。本文无脚注，因此正文不设脚注标记。
