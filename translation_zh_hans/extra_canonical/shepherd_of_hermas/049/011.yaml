  source_fidelity: “让人认出是什么果子”把 ποταποί εἰσιν（“它们是怎样的／属于何种样态”）较窄地落实为果子的种类，未充分保留原文对果实性质的概括表达。另，“所有人”在汉语中容易脱离紧邻的“义人”而被理解为包括一切人；原文的 πάντες 虽可保留其未明说的范围，但应以更自然且不额外扩张的“众人”表达。
  naturalness: 整体庄重、流畅，树木与季节的比喻也表达自然。调整后避免“是什么果子”略显口语且过度限定的说法，并使末句与前面的树木意象衔接更顺。
  terminology: “义人”“世代”“显露出来”均可保留。“枝繁叶茂”虽形象，但用于方括号内有文本疑问的“最微小的”时，宜明确其与全句“众人”同受“显明／兴盛”描述，避免将其误读为另起一句。
