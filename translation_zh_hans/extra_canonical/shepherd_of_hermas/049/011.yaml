base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/011.yaml
  text: 3. “For just as in summer the fruits of each tree become visible and are recognized for what they are, so also the fruits of the righteous will be visible, and all will be known, [those who are least] being flourishing in that age.”
translation:
  language: zh_hans
  text: 3. 正如夏天每棵树的果实都会显露出来，人们也认得出它们是怎样的；照样，义人的果实也必显露出来，众人都将被认出，[即使是最微小的][a]，在那个世代也必兴盛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “即使是最微小的”所对应的希腊文短语（οἱ ἐλάχιστοι ὄντες）在抄本传统中有文本疑问，因此以方括号保留。若此短语为原文，句意可理解为：连最微小的人在那个世代也必兴盛。
    reason: 原文以方括号标示该短语，表明其原始性或文本可靠性存在疑问；脚注说明这一点，且不将该短语的具体所指作超出原文的界定。
lexical_decisions:
- source_word: θέρος
  choice: 夏天
  rationale: 保留树木比喻的季节意象，并与上文的“冬天”形成对照。
- source_word: οἱ καρποὶ φανεροῦνται
  choice: 果子都会显露出来
  rationale: 贴近原文被动表达，强调果子到时自然显明。
- source_word: ἐπιγινώσκονται ποταποί εἰσιν
  choice: 让人认出是什么果子
  rationale: 按上下文将 ποταποί 理解为果子的种类或性质，采用自然的现代汉语表达。
- source_word: γνωσθήσονται πάντες
  choice: 所有人都会被认出来
  rationale: 保留被动语态及“众人”的范围，不擅自补定由谁辨认。
- source_word: εὐθαλεῖς
  choice: 枝繁叶茂
  rationale: 该词表示茂盛、欣欣向荣；在树木比喻中译为“枝繁叶茂”既形象又自然。
- source_word: αἰών
  choice: 世代
  rationale: 在末世性的今世与来世对比中，“世代”能保留时间与秩序的双重含义。
theological_decisions:
- issue: 义人的果子在来世显明
  choice: 保留“义人的果子也必显露出来”的末世性陈述
  alternative: 解释为义人的善行将获得奖赏
  rationale: 原文只说果子显明，并未明确界定为奖赏，因此不作教义性扩展。
- issue: πάντες 的指涉
  choice: 译作“所有人都会被认出来”
  alternative: 限定为“所有义人都会被认出来”
  rationale: 语法和近邻语境可能支持“所有义人”，但原文仅明说“所有人”；译文保留其较宽的表面指涉及潜在张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。延续原文树木、季节和果子的比喻，以“枝繁叶茂”传达 εὐθαλεῖς 的形象；对有文本疑问的短语不擅自删除或融平。
