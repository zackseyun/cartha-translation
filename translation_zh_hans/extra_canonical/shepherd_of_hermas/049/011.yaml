revisions:
- from: 3. 正如到了夏天，每棵树的果子都会显露出来，让人认出是什么果子；照样，义人的果子也必显露出来，所有人都会被认出来；[那些最微小的][a]在那个世代也必枝繁叶茂。
  to: 3. 正如夏天每棵树的果实都会显露出来，人们也认得出它们是怎样的；照样，义人的果实也必显露出来，众人都将被认出，[即使是最微小的][a]，在那个世代也必兴盛。
  rationale: 修订将“认得出是什么果子”改为“认得出它们是怎样的”，以涵盖 ποταποί 的性质性表达；以“众人”取代“所有人”，避免在中文中扩大 πάντες 的指涉范围；并调整方括号短语的位置和连接方式，使其与“兴盛”的关系清楚，同时完整保留文本疑问。
  reviewer_model: gpt-5.6-terra
