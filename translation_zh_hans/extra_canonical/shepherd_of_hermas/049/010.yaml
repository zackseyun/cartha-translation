base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/010.yaml
  text: 2. “These trees that are sprouting,” he says, “are the righteous, who are about to dwell in the age to come; for the age to come is summer for the righteous, but winter for sinners. Therefore when the mercy of the Lord shines forth, then those serving God will be made manifest, and all will be made manifest.”
translation:
  language: zh_hans
  text: 2. 他说：“这些正在发芽的树，就是那些将要住在来世的义人；因为来世对义人是夏天，对罪人却是冬天。所以，当主的怜悯照耀时，服侍上帝的人就会显明出来，所有人也都会显明出来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: 正在发芽
  rationale: 保留树木萌芽、生长的具体意象，也与后文“枯干”的树形成鲜明对照。
- source_word: οἱ δίκαιοι
  choice: 义人
  rationale: 采用现代汉语宗教文献中自然且准确的对应语，表达被称为公义之人，不额外解释其称义方式。
- source_word: ὁ αἰὼν ὁ ἐρχόμενος
  choice: 来世
  rationale: 简明表达“将要来到的时代”，符合上下文与现代汉语习惯；这里指未来的世代，而非地点。
- source_word: θέρος
  choice: 夏天
  rationale: 保留与“冬天”对应的季节比喻；该词可指夏季或收割时节，此处前后以树木状态为喻，译作“夏天”最自然。
- source_word: ἐπιλάμψῃ
  choice: 照耀
  rationale: 保留光照意象及其不及物表达，不将其解释性扩展为审判或显现。
- source_word: οἱ δουλεύοντες τῷ Θεῷ
  choice: 服侍上帝的人
  rationale: 既传达 δουλεύω 所含的事奉、效力之意，又避免在现代汉语中使用可能造成误解的“作奴仆”。
- source_word: φανερωθήσονται
  choice: 显明出来
  rationale: 保留被动语态及“显露、被看见”的意义，不擅自补明使其显明的主体或具体方式。
theological_decisions:
- issue: “主的怜悯照耀”与末世显明之间的关系
  choice: 按原文保留比喻性陈述“当主的怜悯照耀时”
  alternative: 译为“当主在怜悯中显现时”或“当主施行怜悯时”
  rationale: 原文以“怜悯”为ἐπιλάμψῃ的语法主语，形成怜悯如光照耀的意象；不应把它改写成主本人的显现或一般性的施怜悯。
- issue: 末句πάντες所指范围
  choice: 译作“所有人也都会显明出来”
  alternative: 限定为“所有服侍上帝的人都会显明出来”
  rationale: πάντες在语法上可作广义“所有人”，上下文也可能指各类人的真实状况都将显露；译文保留其范围上的张力，不擅自缩窄。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体，保留树木、夏冬和光照等核心比喻。引语与节号依照本段结构呈现；“来世”用于自然表达未来的世代，同时不添加宗派性末世论说明。
