base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/007.yaml
  text: 3. “For just as in winter the trees, having cast off their leaves, are alike, and it is not apparent which are dry or which are living, so in this age neither the righteous nor the sinners are apparent, but all are alike.”
translation:
  language: zh_hans
  text: 3 正如冬天，树木的叶子都落了，看起来都一样，分辨不出哪些是枯干的，哪些是活的；照样，在这个世代，义人和罪人也都不显明出来，反倒全都一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποβεβληκότα τὰ φύλλα
  choice: 落尽叶子
  rationale: 准确表达树木已经脱落叶子的完成状态，同时保持现代汉语自然简洁。
- source_word: τὰ ξηρά
  choice: 已经枯死
  rationale: 在与“仍然活着”相对的树木意象中，“枯死”比单纯“干枯”更清楚地传达生命状态的对比。
- source_word: τὰ ζῶντα
  choice: 仍然活着
  rationale: 保留原文与枯死树木之间的直接对照。
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: 在这个世代
  rationale: 保留 αἰών 的时代性与末世论张力，不将其缩窄为“今生”或泛化为“世界”。
- source_word: οὐ φαίνονται
  choice: 看不出
  rationale: 结合上下文，表达义人和罪人在当前世代尚不能从外表辨明，而非断言他们不存在。
- source_word: ὅμοιοί εἰσιν
  choice: 看起来都一样
  rationale: 补出语境所含的外观层面，避免误解为义人与罪人在道德本质上完全相同。
theological_decisions:
- issue: 当前世代中义人与罪人的不可辨识性
  choice: “看不出谁是义人，谁是罪人”
  alternative: “义人和罪人都不显露出来”
  rationale: 采用自然汉语表达，同时保留原文所说身份在现世尚未显明的张力，不推论二者在本质或行为上毫无差别。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语；保留冬天、落叶、枯死与存活的比喻结构，并以“看起来”明确“都一样”指当前可见状态。
