base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/003.yaml
  text: 10. Blessed are those who have and understand that they are made rich by the Lord; for those who think this way will be able to do some good.
translation:
  language: zh_hans
  text: 10 拥有财富并明白自己是从主得了富足的人有福了！因为这样想的人就能行一些善事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 保留祝福宣告的语气，也符合现代中文宗教文本的庄重表达。
- source_word: οἱ ἔχοντες
  choice: 拥有财富的人
  rationale: 字面为“拥有的人”；结合上文反复谈论富人及其财富，补出“财富”可使中文意思完整而不改变所指。
- source_word: παρὰ τοῦ Κυρίου πλουτίζονται
  choice: 自己的富足来自主
  rationale: 表达财富源自主的被动含义，同时避免生硬直译为“被主使之富足”。
- source_word: ταῦτα φρονοῦντες
  choice: 存这种心的人
  rationale: φρονέω在此指持有这种认识或心态；此译自然地承接前句对财富来源的理解。
- source_word: ἀγαθόν τι ἐργάζεσθαι
  choice: 行些善事
  rationale: 保留τι所表达的不定意味，即“某种善事／一些善事”，并采用自然简洁的现代汉语。
theological_decisions:
- issue: 财富与主的关系
  choice: 将富足表述为“来自主”
  alternative: “被主使之富足”
  rationale: 希腊文使用被动式πλουτίζονται并以παρὰ τοῦ Κυρίου指出来源；译文保留财富由主而来的观念，但不进一步断定财富必然等同于属灵认可。
- issue: “有”的具体所指
  choice: 按上下文译作“拥有财富”
  alternative: 仅译作“拥有的人”
  rationale: 前文明确讨论富人以财物供应穷人，因此此处省略的宾语自然指财富；补出宾语有助于现代读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“有福了”保留箴言式宣告；全句紧扣上文财富与行善的主题，不引入额外教派性解释。
