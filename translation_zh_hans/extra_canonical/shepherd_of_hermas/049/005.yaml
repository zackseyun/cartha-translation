  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/005.yaml
  text: 1. He showed me many trees that had no leaves, but they seemed to me to be dry; for they were all alike. And he says to me, “Do you see these trees?” “I see,” I say, “sir, that they are alike and dry.” Answering, he says to me, “These trees that you see are those who dwell in this age.”
translation:
  language: zh_hans
  text: 1 他让我看见许多没有叶子的树；但在我看来，它们仿佛是枯干的，因为它们全都一样。他对我说：“你看见这些树吗？”我说：“我看见了，先生；它们全都一样，而且枯干。”他回答我说：“你所看见的这些树，就是生活在这世代的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔδειξέ μοι
  choice: 他让我看见
  rationale: 表达使役性的展示动作，较“他指给我看”更自然地引出异象内容。
- source_word: ὡσεὶ ξηρὰ
  choice: 像是枯干的
  rationale: 保留ὡσεὶ所带的表象与比拟意味，不把这些树直接断定为已经枯死。
- source_word: κύριε
  choice: 先生
  rationale: 此处是赫马对异象讲解者的尊称；译作“先生”可避免在身份未明处直接神化为“主”。
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: 住在今世
  rationale: αἰών在此指当前的时代或世界秩序；“今世”简洁保留其末世论对照意味。
theological_decisions:
- issue: 树木的枯干状态是否为确定事实
  choice: 译作“像是枯干的”
  alternative: 译作“都是枯树”
  rationale: 希腊文使用ὡσεὶ及“在我看来”，强调眼前外观；下文说明今世尚不能分辨义人与罪人，因此不应提前将这些树判定为属灵死亡。
- issue: κύριε所指人物的称谓
  choice: 先生
  alternative: 主
  rationale: 原文可作一般尊称，且本节并未明确说话者就是上帝或基督；采用中性尊称可避免加入身份判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留异象对话中现在时的鲜活感，并以“今世”承接本比喻的时代对照。
