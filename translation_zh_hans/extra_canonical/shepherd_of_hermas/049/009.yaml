  text: 1. He showed me again many trees, some sprouting and others dry, and he says to me, “Do you see these trees?” “I see,” I say, “sir, some sprouting and others dry.”
translation:
  language: zh_hans
  text: 1. 他又指给我看许多树，有的正在发芽，有的枯干。他对我说：“你看见这些树吗？”我说：“看见了，先生；有的正在发芽，有的枯干。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: 正在发芽
  rationale: 表达树木萌发、生长的动态状态，并与“枯干”形成鲜明对照。
- source_word: ξηρά
  choice: 枯干
  rationale: 保留树木干枯、没有生机的具体意象，不提前引入后文的属灵解释。
- source_word: κύριε
  choice: 先生
  rationale: 此处是赫尔马对异象中讲解者的尊称；译作“先生”既自然，也避免把称呼直接等同于对神的称谓。
theological_decisions:
- issue: 萌芽与枯干之树的象征意义
  choice: 本节只呈现异象，不在正文中补入象征解释
  alternative: 将其明译为义人与罪人
  rationale: 希腊文本到下一节才解释树木所象征的人群；本节应保留叙事推进和暂时的开放性。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言；保留原文问答结构和“有的……有的……”的平行对照。
