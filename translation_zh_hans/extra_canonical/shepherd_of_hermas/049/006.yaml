  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/006.yaml
  text: 2. “Why then, sir, are they as if dry and alike?” I say. “Because,” he says, “neither the righteous nor the sinners are visible in this age, but they are alike; for this age is winter for the righteous, and they are not visible while dwelling among sinners.”
translation:
  language: zh_hans
  text: 2. 我问：“先生[a]，那么这些树为什么好像都枯干了，而且看起来一样呢？”他说：“因为在今世，义人显不出来，罪人也显不出来；他们看起来都一样。今世对义人来说是冬天；他们住在罪人中间，也显不出来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先生”：原文也可译作“主啊”。
    reason: 希腊语κύριε既可作尊称，也可作“主”的称号；脚注保留这一真实歧义。
lexical_decisions:
- source_word: κύριε
  choice: 先生
  rationale: 这是赫尔马对异象中讲解者的尊称；在此译作“先生”既符合现代汉语对话，也避免未经上下文证明便将其明确等同于神圣称号“主”。
- source_word: ὡσεὶ ξηρά
  choice: 好像都枯干了
  rationale: 保留ὡσεὶ“好像”的比拟语气，并延续上下文树木的意象。
- source_word: φαίνονται / οὐ φαίνονται
  choice: 显不出来／看起来
  rationale: 该动词既涉及外在显现，也涉及能否被辨认；按句法分别译为“显不出来”和“看起来”，保留义人与罪人在今世尚未显明的核心意象。
- source_word: αἰὼν οὗτος
  choice: 今世
  rationale: 准确表达与将来之世相对的当前时代，并采用普通读者熟悉的简洁说法。
- source_word: χειμών
  choice: 冬天
  rationale: 直译季节隐喻，与树木枯干、义人尚未显明的上下文相连。
- source_word: μετὰ τῶν ἁμαρτωλῶν κατοικοῦντες
  choice: 住在罪人中间
  rationale: 自然表达共同居住、混处其中的含义，不额外引入道德同流的意思。
theological_decisions:
- issue: 义人与罪人在今世“看起来一样”是否表示二者本质相同
  choice: 译为“他们看起来都一样”，限定为现象层面的不可分辨
  alternative: “他们都是一样的”
  rationale: 原文以φαίνονται及树木的外观作比喻，重点是今世尚未显明，而非宣告义人与罪人在本质或道德上相同。
- issue: κύριε是否应明确译为神圣称号“主”
  choice: 正文译“先生”，脚注说明也可译“主啊”
  alternative: 直接译“主啊”
  rationale: 此处是对异象讲解者的称呼，κύριε本身兼有“主”和尊称“先生”的可能；不应在正文中无根据地消除这种身份与语用上的弹性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。保留“枯干—冬天—显不出来”的连续比喻，并用重复句式再现原文对义人与罪人的并列强调。
