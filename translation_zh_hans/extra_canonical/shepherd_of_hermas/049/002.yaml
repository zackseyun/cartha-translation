  source_fidelity: “义人之善工”中的“善”并非原文ἔργον明说；虽合上下文，却不宜在正文补入。原文τοῦ δικαίου为阳性单数，较直接是“义人／那义者的”，而非抽象的“正义”。“τὰς βίβλους τῶν ζώντων”为复数“活人的册卷”，译文宜避免将其完全固定化为单数“活人册”。
  naturalness: 原译整体庄重流畅。“双方”准确承接富人与穷人；“反要”也恰当呈现οὐκ…ἀλλά转折。修订后以“共同参与”表达κοινωνοί，可避免“义人之……的伙伴”在现代汉语中的结构生硬。
  terminology: 保留“义人”以对应ὁ δίκαιος，并不把它解释为某一特定神学身份。“活人的册卷”较“活人册”更贴近原文的复数书卷意象；不对其救恩含义作系统化解释。
