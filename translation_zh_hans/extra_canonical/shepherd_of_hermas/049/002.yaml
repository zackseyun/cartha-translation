base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/002.yaml
  text: 9. Thus both become partners in the work of the righteous one. Therefore the one who does these things will not be abandoned by God, but will be inscribed in the books of the living.
translation:
  language: zh_hans
  text: 9 这样，双方都共同参与义人的工作。因此，行这些事的人必不被上帝撇弃，反要被记在活人的册卷中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφότεροι
  choice: 双方
  rationale: 承接上文的穷人与富人，简洁表达二者共同参与。
- source_word: κοινωνοὶ
  choice: 伙伴
  rationale: 保留共同有分、共同参与的含义，现代中文也自然。
- source_word: τοῦ ἔργου τοῦ δικαίου
  choice: 义人之善工
  rationale: τοῦ δικαίου 形式上可指“义人的”，而 ἔργον 在语境中指所行的善事；译文保留其人称性，不将其直接抽象化为“正义的工作”。
- source_word: ἐγκαταλειφθήσεται
  choice: 被……撇弃
  rationale: 准确表达遭遗弃、被离弃之意，并保持庄重的经文语体。
- source_word: ἐπιγεγραμμένος
  choice: 被记在
  rationale: 表达名字被登记、载入册卷的意象。
- source_word: τὰς βίβλους τῶν ζώντων
  choice: 活人册
  rationale: 以自然凝练的中文表达“活着之人的册卷”；希腊文为复数，但汉语固定书卷意象通常用单数集合称谓。
theological_decisions:
- issue: τοῦ δικαίου 是阳性属格单数，可理解为“义人的”或较宽泛地理解为“义/正义的”
  choice: 义人之善工
  alternative: 正义的工作
  rationale: 形态首先支持“义人的”；译作“义人之善工”保留原文可能指某一义人或义者之工作的张力，同时结合施予穷人的上下文说明 ἔργον 的善行性质。
- issue: “被记在活人册上”是否暗示特定救恩机制
  choice: 按原文直译其奖赏与存留意象，不作教派性解释
  alternative: 解释为凭善行获得救恩
  rationale: 原文把行这些事、不被上帝撇弃和被登记相连，但译文不额外界定善行与救恩的系统关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“这样”承接上一段富人与穷人彼此供应的论述；“反要”清楚呈现 οὐκ…ἀλλά 的转折。未添加原文没有的解释性脚注。
