base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/001.yaml
  text: …they make their wealth complete, and in turn the rich, by supplying the poor with the things they need, make their souls complete.
translation:
  language: zh_hans
  text: ……他们使自己的财富得以充足；反过来，富人借着供给穷人所需之物，也使自己的灵魂得以充足。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληροφοροῦσι
  choice: 使……得以充足
  rationale: 同一动词先以“财富”、后以“灵魂”为宾语，译文保留重复和平行结构。该词在此有“使之充分、使之完满”的含义；“得以充足”较自然，也不把隐喻收窄为单纯增加财富或拯救灵魂。
- source_word: χορηγοῦντες
  choice: 供给
  rationale: 表达持续提供、供应之意，适合富人向穷人提供生活所需的语境。
- source_word: τοῖς πένησι
  choice: 穷人
  rationale: 采用现代通行、清楚而不带贬义的称呼。
- source_word: τὰ δέοντα
  choice: 所需的
  rationale: 指必要之物或应有的供应；译作“所需的”简洁自然，并保留内容未具体说明这一点。
- source_word: τὰς ψυχὰς αὐτῶν
  choice: 自己的灵魂
  rationale: 保留 ψυχή 的宗教与人格性含义，并清楚表明反身领属关系。
theological_decisions:
- issue: 富足者与穷人之间互惠行动的属灵意义
  choice: 保留“财富得以充足”与“灵魂得以充足”的对称说法
  alternative: 将后半句解释性地译为“使自己的灵魂得救”或“积攒属灵功德”
  rationale: 原文只以同一动词描述两方面的完满或充足，并未在本句明确界定救恩机制；因此不加入功德、称义或得救等特定教义解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句首省略号表明本读者分段承接上文；以“反过来”呈现 καὶ πάλιν 所表达的对应关系。
