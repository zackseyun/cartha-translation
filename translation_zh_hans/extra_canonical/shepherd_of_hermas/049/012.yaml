  text: 4. “But the Gentiles and the sinners—like the dry trees you saw—will be found such, dry and fruitless in that age, and as …”
translation:
  language: zh_hans
  text: 4. 至于外邦人和罪人，他们将会像你所看见的那些枯树一样，在那个世代被显明为枯干而不结果子的；并且如同……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 此处指与义人相对的一类人；译作“外族人”既保留群体含义，也避免把后期宗派化色彩过强地带入文本。
- source_word: οἱ ἁμαρτωλοί
  choice: 罪人
  rationale: 直接对应希腊语，保留其道德和神学含义。
- source_word: ξηροὶ καὶ ἄκαρποι
  choice: 枯干、不结果子
  rationale: 延续树木比喻；“不结果子”比单说“无果”更自然，也清楚表达 ἄκαρποι。
- source_word: ἐν ἐκείνῳ τῷ αἰῶνι
  choice: 在那个世代
  rationale: αἰών 在上下文中与“这个世代”及“将来的世代”对举；“世代”保留其时代性与末世张力。
- source_word: εὑρεθήσονται
  choice: 就会……显出……的样子
  rationale: 原义为“将被发现／显明为”；结合前文万物显明的语境，用“显出”较为自然，同时保留被揭示的意味。
theological_decisions:
- issue: τὰ ἔθνη 的身份范围
  choice: 外族人
  alternative: 外邦人／列国的人
  rationale: 原文可泛指诸民族或非犹太人；本段将其与罪人并列，但不宜擅自解释其最终神学范围。“外族人”较中性地保留区别。
- issue: αἰών 的末世含义
  choice: 那个世代
  alternative: 来世／那个时代
  rationale: 紧扣本比喻中“这个世代—将来的世代”的对照，不把它直接等同于某套具体的来世教义。
- issue: 残缺句的处理
  choice: 以“并且如同……”保留残缺
  alternative: 依据其他版本补全文句
  rationale: 所给希腊文本止于 καὶ ὡς ξ，来源本身残缺；不凭猜测补足，以省略号如实呈现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留树木与果子的比喻，并忠实呈现来源末尾残缺。
