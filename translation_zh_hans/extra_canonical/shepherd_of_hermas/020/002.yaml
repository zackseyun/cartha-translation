base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/002.yaml
  text: “When an old man, having already given up hope for himself because of his weakness and his poverty, expects nothing else but the last day of his life; then, all at once, an inheritance is left to him. On hearing of it he is stirred up, and, becoming overjoyed, he puts on strength; he no longer lies down, but stands; his spirit—already corrupted by his former deeds—is renewed; and he no longer sits, but takes courage. So also you, when you heard the revelation that the Lord revealed to you.
translation:
  language: zh_hans
  text: 一个上了年纪的人，因自己的软弱和贫穷，早已对自己不抱希望，除了生命的最后一天以外，什么也不盼望。后来，忽然有人留给他一份遗产；他听见这消息，就振作起来，满心欢喜，重新有了力量。他不再躺卧，反而站立；他的心灵原已因从前的行为而衰败，如今又焕然一新；他不再坐着，反而鼓起勇气。你们也是这样：当你们听见主向你们显明的启示时，……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτερός
  choice: 一个上了年纪的人
  rationale: 按语境指年老之人；用现代汉语自然表达，避免误解为教会职分“长老”。
- source_word: ἀφηλπικὼς ἑαυτόν
  choice: 早已不再抱什么希望
  rationale: 表达对自己处境已经绝望的完成状态，同时保持普通读者易懂。
- source_word: πτωχότητα
  choice: 贫穷
  rationale: 直译其经济困窘之义，与“软弱”并列。
- source_word: κληρονομία
  choice: 一份遗产
  rationale: 此处是突然留给某人的财产继承，译为“遗产”最贴合比喻。
- source_word: ἐνεδύσατο τὴν ἰσχύν
  choice: 重新有了力量
  rationale: 希腊文直意为“穿上力量”；在汉语中作自然转达，同时保留恢复力量的意象核心。
- source_word: τὸ πνεῦμα
  choice: 心灵
  rationale: 这里描述人内在生命因消息而更新；“心灵”比“灵”在现代汉语叙事中自然，也不预先限定技术性神学含义。
- source_word: ἐφθαρμένον
  choice: 衰败
  rationale: 可涵盖败坏、损耗或衰弱；结合年老者的比喻，保留其负面状态而不过度道德化。
- source_word: ἀνδρίζεται
  choice: 鼓起勇气
  rationale: 该动词意为刚强、勇敢起来；采用不带性别限定的现代汉语表达。
- source_word: ἀποκάλυψιν … ἀπεκάλυψεν
  choice: 所启示的启示
  rationale: 有意保留原文名词与同源动词的重复，虽略显重复，却忠实呈现强调。
theological_decisions:
- issue: πνεῦμα 是否译作具有明确神学指向的“灵”
  choice: 译作“心灵”
  alternative: 他的灵
  rationale: 上下文以老人内在状态的复苏作比喻，并未明确指圣灵或独立的灵体；“心灵”保留内在生命之义，避免过度神学化。
- issue: ἐφθαρμένον 是否明确译为道德性的“败坏”
  choice: 译作“衰败”
  alternative: 败坏
  rationale: 原词可指腐坏、毁损；其原因虽是“从前的行为”，但老人软弱衰老的比喻也带有耗损色彩，因此不把歧义完全收窄为道德定罪。
- issue: “主所启示的启示”是否简化
  choice: 保留同源重复
  alternative: 主向你们显明的信息
  rationale: 原文以 ἀποκάλυψιν 与 ἀπεκάλυψεν 相互呼应，保留重复可呈现其修辞强调，不另行解释启示内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。句式保留比喻由绝望、突获遗产到重新振作的推进，并以“你们也是这样”对应原文应用句。当前读者分段止于第2节末，末句在思想上承接下一段，但按所给范围完整收束。
