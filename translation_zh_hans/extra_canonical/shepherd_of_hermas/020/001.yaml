  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/001.yaml
  text: But in the second vision you saw her standing, with a countenance younger and more cheerful than before, though her flesh and her hair were older. “Listen,” she says, “to this parable also.
translation:
  language: zh_hans
  text: 但在第二个异象中，你看见她站着，容貌比先前更年轻、更和悦，身体和头发却更显年老。她说：“你也要听这个比喻。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψιν
  choice: 容貌
  rationale: 指可见的面容或外观；“容貌”自然庄重，并与后文的肉身和头发相区别。
- source_word: ἱλαρωτέραν
  choice: 更喜悦
  rationale: 表达较先前更明朗、欣悦的神情；“喜悦”保留内在欢欣显于外的意味。
- source_word: σάρκα
  choice: 肉身
  rationale: 此处指身体外在状态；采用“肉身”以贴近原词，同时不引入负面的神学含义。
- source_word: πρεσβυτέρας
  choice: 仍显得年老
  rationale: 该比较级在上下文中表示肉身和头发相对于年轻的容貌仍较老；补出“显得”使现代汉语自然，但不把年龄关系解释得过死。
- source_word: παραβολήν
  choice: 比喻
  rationale: 指借具体情形作说明的譬喻性叙述；“比喻”通俗且符合早期基督教文献语境。
theological_decisions:
- issue: 人物外貌年轻而身体与头发年老之间的张力
  choice: 保留“容貌……更年轻……肉身和头发却仍显得年老”的对照
  alternative: 将全句协调解释为她整体返老还童
  rationale: 原文明确并置 νεωτέραν 与 πρεσβυτέρας，译文不应提前消解其象征性张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。以“你”对应单数动词 εἶδες；直接引语保持简洁。未添加原文没有的身份说明或象征解释。
