revisions:
- from: 因为他怜悯你们，更新了你们的心灵；你们也除去了自己的软弱，力量临到你们，你们就在信仰上刚强起来。主看见你们刚强起来，就欢喜了。因此，他把塔的建造指示给你们；如果你们全心彼此和睦，他还会把别的事指示给你们。
  to: 因为他怜悯你们，更新了你们的心灵；你们也除去了自己的软弱，力量临到你们，你们就在信仰上刚强起来。主看见你们变得坚固，就欢喜了。因此，他向你们显明了那座塔的建造；你们若全心全意彼此和睦，他还会向你们显明别的事。
  rationale: 仅作汉语搭配与句法顺畅度的安全修订：“显明”更贴合δηλόω；“变得坚固”对应ἰσχυροποίησις而不改变其含义；“全心全意彼此和睦”清楚表达条件句中持续的群体和平。未增添塔的象征解释，也未改变“信仰”一词所保留的语义范围。
