base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/003.yaml
  text: “For he had compassion on you and renewed your spirits, and you put away your softness; strength came to you and you were strengthened in faith; and when the Lord saw your strengthening, he rejoiced. For this reason he made known to you the building of the tower, and he will make other things known, if, with a whole heart, you are at peace among yourselves.”
translation:
  language: zh_hans
  text: 因为他怜悯你们，更新了你们的心灵；你们也除去了自己的软弱，力量临到你们，你们就在信仰上刚强起来。主看见你们变得坚固，就欢喜了。因此，他向你们显明了那座塔的建造；你们若全心全意彼此和睦，他还会向你们显明别的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσπλαγχνίσθη
  choice: 怜悯
  rationale: 表达发自内心的深切慈悲，符合该动词在早期基督教希腊文中的常见含义。
- source_word: τὰ πνεύματα ὑμῶν
  choice: 你们的心灵
  rationale: 复数直译为“你们的灵”略显生硬；“心灵”在现代汉语中自然，同时保留内在生命得更新的含义。
- source_word: τὰς μαλακίας ὑμῶν
  choice: 你们自己的软弱
  rationale: μαλακία在此承接前文因绝望而衰颓、无力的状态；译作“软弱”比“柔弱”或“懈怠”更自然，也不把含义限定为道德怠惰。
- source_word: ἰσχυρότης
  choice: 力量
  rationale: 保留力量临到他们这一意象，并与下文“刚强起来”形成自然衔接。
- source_word: ἐδυναμώθητε ἐν τῇ πίστει
  choice: 你们就在信仰上刚强起来
  rationale: 体现被动语态及ἐν τῇ πίστει所限定的领域，避免笼统译为“信心增强”。
- source_word: τὴν οἰκοδομὴν τοῦ πύργου
  choice: 塔的建造
  rationale: οἰκοδομή在此指建造的过程或景象；保留这种表达，不提前解释塔的象征意义。
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  choice: 彼此和睦
  rationale: 该短语指群体内部保持和平；现代汉语以“彼此和睦”表达最为自然。
theological_decisions:
- issue: “更新你们的心灵”的施事关系
  choice: 保留“他……更新了”的直接陈述
  alternative: 译为“使你们重新振作”
  rationale: 原文明确以主的怜悯和更新为行动，不宜弱化为纯粹心理恢复。
- issue: 进一步启示的条件
  choice: 译为“如果你们全心彼此和睦”
  alternative: 译为“只要你们一心一意在自己里面保持平安”
  rationale: 保留ἐάν的条件意味及“全心”的内在投入，同时按复数群体语境理解ἐν ἑαυτοῖς为彼此之间，不将其个体内在化。
- issue: “信仰/信心”之辨
  choice: 信仰
  alternative: 信心
  rationale: πίστις在此既可指信靠状态，也可能指共同信仰；“在信仰上刚强起来”保留一定范围感，不把它完全心理化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文因果与递进结构，并通过分号和短句避免希腊文长串并列在中文中显得拖沓。
