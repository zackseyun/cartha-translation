base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/003.yaml
  text: “I want to know who the other stones are that are being carried from the dry land, lady.” She said, “Those that go into the building without being hewn—the Lord approved these, because they walked in the uprightness of the Lord and kept his commandments.”
translation:
  language: zh_hans
  text: “夫人，我想知道，从陆地运来的其余那些石头是指谁。”她说：“那些被纳入建造、却没有经过凿削的石头，主已经检验认可了，因为他们照着主的正直而行，并且遵守了他的诫命。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξηρᾶς
  choice: 旱地
  rationale: 保留与前文“深处”相对的地貌意象；此处名词化形容词意为干地、陆地，译作“旱地”贴近字面且自然。
- source_word: κυρία
  choice: 夫人
  rationale: 这是对异象中妇人的尊称；“夫人”兼具礼貌与庄重，不额外赋予神学身份。
- source_word: μὴ λατομουμένους
  choice: 未经凿削
  rationale: λατομέω涉及采石、凿石或修整石材；语境强调石头无需加工便能契合建造，因此用较宽泛的“凿削”保留石材意象。
- source_word: ἐδοκίμασεν
  choice: 认可
  rationale: 该词可指检验后认定合格或赞许；“认可”同时涵盖试验后的接纳，避免仅译成情感性的“喜悦”。
- source_word: ἐν τῇ εὐθύτητι τοῦ Κυρίου
  choice: 按着主的正直之道
  rationale: εὐθύτης表示正直、端正；补出“之道”使汉语自然，同时保留属格可能指由主所规定或彰显的正直。
- source_word: κατωρθώσαντο τὰς ἐντολὰς αὐτοῦ
  choice: 遵守了他的诫命
  rationale: κατορθόω在此表示正确实行、履行；“遵守”是现代汉语表达践行诫命的自然说法。
theological_decisions:
- issue: 主的认可与人的行为之间的关系
  choice: 依原文并列呈现“主所认可”及其理由“因为他们……行事，并且遵守了他的诫命”
  alternative: 把认可解释为得救、称义或最终审判中的宣告
  rationale: 原文只说明主认可这些人，并以其正直行事和履行诫命为由；不应引入特定救恩论框架。
- issue: “主的正直”属格关系
  choice: 译为“主的正直之道”，保留其既可指主所规定的正直道路，也可指以主为源头或标准的正直
  alternative: 明确译成“主所命定的正道”或“像主那样正直”
  rationale: 希腊文属格本身具有一定开放性，译文不宜单方面限定。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言；保留石头、旱地、凿削和建造等异象意象。以“是指谁”自然表达τίνας εἰσίν所问的象征身份，不添加原文没有的解释。
