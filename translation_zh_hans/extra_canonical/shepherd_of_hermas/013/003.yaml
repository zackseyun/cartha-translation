  naturalness: “旱地”在当代汉语中通常指干旱地区或未灌溉土地，不如“陆地”自然，也较难与前文“深处”形成清楚对照。“夫人”及整体叙事语体自然庄重。
  terminology: “凿削”“诫命”“主”均合适。“认可”可表达ἐδοκίμασεν经检验而认定合格的含义；译作“检验认可”则更完整地反映该动词。
