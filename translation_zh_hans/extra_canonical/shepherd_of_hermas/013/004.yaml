base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/004.yaml
  text: “And the ones being brought and set into the building—who are they?” “They are new in the faith and faithful. But they are being admonished by the angels to do good, because evil was found in them.”
translation:
  language: zh_hans
  text: “那些被带来并安放在这建筑中的，是谁？”“他们是初信而忠信的人。天使劝诫他们行善，因为在他们身上发现了恶。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγόμενοι καὶ τιθέμενοι
  choice: 被运来、安放
  rationale: 承接上下文石头被用于建塔的图景；两个被动分词分别译出移动与放置的动作。
- source_word: εἰς τὴν οἰκοδομήν
  choice: 在建造中
  rationale: 保留 οἰκοδομή 可指建造工程或建筑物的含义，并使中文自然。
- source_word: Νέοι ... ἐν τῇ πίστει
  choice: 信仰上的新人
  rationale: 表达他们在信仰方面是新近加入者，而非年龄年轻。
- source_word: πιστοί
  choice: 忠信的人
  rationale: πιστοί 可表示“信徒”或“忠信的”；此处与“信仰上的新人”并列，译为“忠信的人”以保留其品格意味，避免同义重复。
- source_word: νουθετοῦνται
  choice: 劝诫
  rationale: 兼具劝勉和警戒之意，比单纯“教导”更贴近该词。
- source_word: ἀγαθοποιεῖν
  choice: 行善
  rationale: 直接表达“做善事、行美善之事”的行动含义。
- source_word: πονηρία
  choice: 恶
  rationale: 保留其可涵盖邪恶、恶意或不良倾向的宽泛含义，不具体化为某一种罪。
theological_decisions:
- issue: πιστοί 的身份或品格含义
  choice: 忠信的人
  alternative: 信徒
  rationale: 希腊词本身两义皆可；与“信仰上的新人”并列时，“忠信的人”更能保留张力，也不把两项压缩为重复的身份称谓。
- issue: “在他们里面发现了恶”的人性论力度
  choice: 直译为“在他们里面发现了恶”
  alternative: 他们身上有不好的地方
  rationale: 原文明确使用 πονηρία，不宜弱化；同时不将其扩展解释为特定的原罪或某项具体罪行。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；保留问答结构和建筑比喻。
