  source_fidelity: 原文的问答结构、被动动作（被带来、被安放）、初信状态、天使的劝诫、行善及其理由均已基本表达。然“安放在建造中的石头”把 εἰς τὴν οἰκοδομήν（进入/安放在建筑〔工程或建筑物〕中）不够准确地处理为修饰“石头”的“建造中”，宜改为“安放在这建筑中”。πιστοί 在此更自然地指“信徒/忠信者”；中文可在不消除歧义的前提下译作“初信而忠信的人”。
  naturalness: “信仰上的新人”略显书面且不够凝练；“初信而忠信的人”在现代汉语中更自然，也保留原文两个并列描述。“在他们里面发现了恶”可理解，但“在他们身上发现了恶”更符合现代汉语，且不削弱 πονηρία 的力度。
  terminology: 保留“天使”“行善”“劝诫”等庄重、通行的表述。以“建筑”对应 οἰκοδομή，避免把它限定为正在进行的“建造”动作；本段上下文的塔之建筑意象仍清楚。
