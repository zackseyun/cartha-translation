base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/002.yaml
  text: “And the ones drawn up from the deep and set into the building and fitting together at their joints with the other stones already built—who are they?” “These are the ones who suffered on account of the name of the Lord.”
translation:
  language: zh_hans
  text: “那些从深处被拉上来，安放在建筑中，并且在接缝处与其他已经砌好的石头相合的石头，是谁呢？”“这些人就是那些因主的名而受苦的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυθός
  choice: 深水
  rationale: 指前文异象中石头被拉出的深处或深水；译作“深水”既保留具体意象，也避免擅自解释为深渊或阴间。
- source_word: ἑλκόμενοι
  choice: 被拉上来
  rationale: 保留被动语态和从深处向上的动作。
- source_word: οἰκοδομή
  choice: 建筑
  rationale: 本句既可指建造过程，也可指正在形成的建筑；此处石头被安放其中，译作“建筑”自然并保留意象。
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς
  choice: 接缝……相合
  rationale: 直观表达石块接口彼此吻合，并呼应上下文反复出现的砌筑意象。
- source_word: παθόντες
  choice: 受过苦
  rationale: 该词本身泛指遭受苦难，并未明确限定为殉道或死亡，因此不作强化。
- source_word: ἕνεκεν τοῦ ὀνόματος τοῦ Κυρίου
  choice: 为主的名
  rationale: 保留早期基督教文本中“名”的神学措辞，不将其释义化为单纯“因为信主”。
theological_decisions:
- issue: 受苦者是否特指殉道者
  choice: 那些为主的名受过苦的人
  alternative: 为主的名殉道的人
  rationale: 希腊文 παθόντες 只明确说“受过苦”，未明说死亡；译文保留其范围和可能的张力。
- issue: βυθός 是否解释为阴间或洗礼之水
  choice: 深水
  alternative: 深渊／阴间／洗礼之水
  rationale: 本句以建筑异象中的取石场景为直接语境，原词没有在此明确给出进一步神学解释，故不将某一解释写入正文。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。问句保留希腊文列举石头特征后再发问的结构；答句简洁明确。
