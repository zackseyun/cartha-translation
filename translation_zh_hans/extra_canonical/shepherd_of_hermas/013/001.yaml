base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/001.yaml
  text: “Listen now about the stones that go into the building. The stones, then, that are square and white and that fit together at their joints—these are the apostles and bishops and teachers and deacons, who walked in the reverent dignity of God and who oversaw and taught and served God’s elect with purity and reverence—some have fallen asleep, and some are still alive. They were always in agreement with one another, had peace among themselves, and listened to each other; for this reason their joints fit in the building of the tower.
translation:
  language: zh_hans
  text: “请听我现在论到那些进入建造的石头。那些方正、洁白、接合处相互契合的石头，就是使徒、监督、教师和执事；他们按着上帝所要求的庄重而行，纯洁而庄重地监督、教导并服侍上帝所拣选的人。他们有些已经安睡，有些仍然在世。他们始终彼此一致，彼此和平相处，也彼此听从；因此，他们的接合处在这塔的建造中相互契合。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπαγόντων εἰς τὴν οἰκοδομήν
  choice: 用于建造
  rationale: 表达石头被纳入建筑工程之意，同时避免生硬直译为“进入建造”。
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν
  choice: 接缝彼此吻合
  rationale: 保留石材拼接的具体意象；同一动词随后也用于这些领袖彼此同心，中文借重复“吻合／同心”呈现意象与所指之间的联系。
- source_word: ἐπίσκοποι
  choice: 监督
  rationale: 采用职分名称的普通词义，避免将后期教会制度中的特定称谓倒读进文本。
- source_word: κατὰ τὴν σεμνότητα τοῦ Θεοῦ
  choice: 行事与上帝的庄严相称
  rationale: σεμνότης含庄重、可敬之意；属格关系略有含混，此译法保留以上帝为准则的含义，又符合现代汉语。
- source_word: ἐπισκοπήσαντες καὶ διδάξαντες καὶ διακονήσαντες
  choice: 监督、教导并服侍
  rationale: 分别保留三个并列事奉动作，并使“监督”与前文职分名称形成词根呼应。
- source_word: κεκοιμημένοι
  choice: 已经安睡
  rationale: 保留早期基督教以睡眠婉指死亡的意象，不直接释为“去世”。
- source_word: ἀλλήλων ἤκουον
  choice: 互相听从
  rationale: 此处不只是听见，也含彼此听取、顺从或接纳之意；“听从”最能说明群体中的协调关系。
theological_decisions:
- issue: “使徒、监督、教师和执事”与石头的对应
  choice: 按原文直接列出四类职分，不作等级化说明
  alternative: 按后期宗派制度将ἐπίσκοποι译为特定头衔，并解释各职分层级
  rationale: 原文只说明这些人忠诚事奉、彼此和睦，并未界定后期教制或职分等级。
- issue: 安睡者的状态
  choice: 保留“安睡”的原始隐喻
  alternative: 明确译作“已经死亡”或加入死后状态的解释
  rationale: 原文使用κεκοιμημένοι，译文不应借解释该隐喻而引入额外的末世论判断。
translation_notes:
  register: 采用自然、庄重而清晰的现代标准汉语。保留塔楼与石头接缝的核心比喻，通过“彼此吻合—彼此同心”的措辞呈现物象与群体和睦之间的对应；职分名称尽量使用中性、可理解的表达。
