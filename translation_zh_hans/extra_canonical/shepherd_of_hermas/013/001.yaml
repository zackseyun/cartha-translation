revisions:
- from: “现在请听这些用于建造的石头有什么含义。那些方正、洁白、接缝彼此吻合的石头，就是使徒、监督、教师和执事。他们行事与上帝的庄严相称，纯洁而庄重地监督、教导并服侍上帝所拣选的人。他们有些已经安睡，有些仍然在世。他们始终彼此同心，和睦相处，也互相听从；因此，在建造塔楼时，他们的接缝彼此吻合。”
  to: “请听我现在论到那些进入建造的石头。那些方正、洁白、接合处相互契合的石头，就是使徒、监督、教师和执事；他们按着上帝所要求的庄重而行，纯洁而庄重地监督、教导并服侍上帝所拣选的人。他们有些已经安睡，有些仍然在世。他们始终彼此一致，彼此和平相处，也彼此听从；因此，他们的接合处在这塔的建造中相互契合。”
  rationale: 修订仅处理两处措辞：删除原文未明说的“有什么含义”，并将石头的“接缝”改作更自然、明确的“接合处相互契合”。保留职分名称、死亡的“安睡”隐喻，以及领袖之间一致、和平、彼此聆听与石头接合之间的文学对应。
