revisions:
- from: “那些被他们丢弃、扔到一旁的石头是谁呢？”“这些人犯了罪，却愿意悔改。因此，他们没有被远远抛到塔外，因为只要悔改，他们仍可用于建造。所以，那些将要悔改的人，若趁着塔还在建造的时候现在就悔改，必能在信仰上坚固。但建造一旦完成，他们就再也没有位置，只能被弃在外面。他们所有的，只是躺在塔旁。”
  to: “那些被他们丢弃、扔在一旁的石头是谁呢？”“这些人犯了罪，愿意悔改。因此，他们没有被远远抛到塔外，因为若悔改，他们就会对建造有用。所以，那些将要悔改的人，若趁着塔还在建造时现在就悔改，必会在信仰上坚固。但建造一旦完成，他们就再也没有位置，却要被丢在外面。不过，他们仅有这一点：躺在塔旁。”
  rationale: 修订仅调整条件句、末段的句法与语气，使其更贴近希腊文反复出现的“若悔改”结构，并更自然地表达“没有位置／被丢在外面／仅能躺在塔旁”的递进空间意象；不对其作救恩论或教会论解释。
