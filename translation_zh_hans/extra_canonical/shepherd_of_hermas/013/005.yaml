review_pass:
  verdict: revise
  source_fidelity: 译文整体准确保留了罪、悔改的意愿与实际悔改之间的条件关系，以及塔正在建造时的紧迫性。不过，“只要悔改”在汉语中较易带出充分条件的泛化语气，原文此处仍是明确的“若他们悔改”；末句“他们所有的”不够自然，也未清楚表达原文“他们仅有这一点”的限制性。
  naturalness: 整体庄重流畅。将末两句改为“却要被丢在外面。不过，他们仅有这一点：躺在塔旁”，更自然，也更贴合建筑意象。
  terminology: “悔改”“信仰上坚固”“建造”“塔旁”均恰当。“被弃在外面”可译，但“被丢在外面”与ἔκβολοι及前面的弃置动作形成较好的词汇呼应，且不额外界定其教义含义。
  issues:
