base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/005.yaml
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to repent. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
translation:
  language: zh_hans
  text: “那些被他们丢弃、扔在一旁的石头是谁呢？”“这些人犯了罪，愿意悔改。因此，他们没有被远远抛到塔外，因为若悔改，他们就会对建造有用。所以，那些将要悔改的人，若趁着塔还在建造时现在就悔改，必会在信仰上坚固。但建造一旦完成，他们就再也没有位置，却要被丢在外面。不过，他们仅有这一点：躺在塔旁。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέβαλλον καὶ ἔριττον
  choice: 丢弃、扔到一旁
  rationale: 保留两个并列动词及石头被施工者弃置的具体意象；不把两词压缩为单一的“拒绝”。
- source_word: θέλοντες μετανοῆσαι
  choice: 愿意悔改
  rationale: θέλω 表达意愿；“愿意”比“想要”更适合庄重叙事，同时不把意愿等同于已经悔改。
- source_word: εὔχρηστοι ... εἰς τὴν οἰκοδομήν
  choice: 仍可用于建造
  rationale: 保留“有用、适用”的建筑比喻，并以现代汉语自然表达。
- source_word: ἰσχυροὶ ... ἐν τῇ πίστει
  choice: 在信仰上坚固
  rationale: 直译信仰领域中的坚强稳固，也与石头和建塔的意象呼应。
- source_word: ἔκβολοι
  choice: 被弃在外面
  rationale: 表达被排除、被抛在外的状态，并与前文塔内位置形成对照。
- source_word: παρὰ τῷ πύργῳ κεῖσθαι
  choice: 躺在塔旁
  rationale: 保留石头静置在塔边的具象说法，不将其抽象解释为某种确定的教会身份。
theological_decisions:
- issue: 悔改的意愿、行动与结果之间的关系
  choice: 区分“愿意悔改”“若悔改”和“现在就悔改”
  alternative: 统称为“悔改的人”
  rationale: 原文反复使用条件句，强调仅有意愿并不等于完成悔改，必须保留这种劝诫张力。
- issue: 建塔完成后的排除状态
  choice: 译作“再也没有位置，只能被弃在外面”
  alternative: 解释为永远失去救恩
  rationale: 原文使用建筑及位置意象，没有明确界定最终救恩论含义，因此不作超出文本的教义化说明。
- issue: “躺在塔旁”的含义
  choice: 保留空间意象，不加解释
  alternative: 解释为仍与教会相邻或处于次等得救状态
  rationale: 原文含义具有张力和一定含混性，应避免导入特定宗派或解释传统。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。以“石头”补明问句的场景对象，使读者能承接上文建筑意象；其余尽量维持原文反复的条件结构与时间紧迫感。
