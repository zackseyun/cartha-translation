base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/003.yaml
  text: 'So when you recognize his works, withdraw from him and put no trust in him, because his works are wicked and harmful to God’s servants. You therefore have the activities of both angels; understand them, and trust the angel of righteousness. But withdraw from the angel of wickedness, because his teaching is wicked in every deed. For if someone is a faithful man, and the thought of this angel rises up in his heart, that man or woman must commit some sin. But if again some man or woman is very wicked, and the works of the angel of righteousness rise up in his or her heart, that person must of necessity do something good. You see then,” he says, “that it is good to follow the angel of righteousness, and to renounce the angel of wickedness. As to faith, this commandment makes it clear: that you should trust the works of the angel of righteousness, and, having done them, live to God. But believe that the works of the angel of wickedness are grievous; so by not doing them, you will live
    to God.”'
translation:
  language: zh_hans
  text: '所以，你既认清了他的作为，就要远离他，丝毫不要信从他，因为他的作为邪恶，对上帝的仆人毫无益处。这样，这两位天使的作为，你现在都有了；要明辨这些，并信赖公义的天使。至于邪恶的天使，你要远离他，因为他的教导在一切事上都是邪恶的。即使一个忠信的男人，这个天使的意念升到他心里，他，或一个女人，就必会犯某种罪。反过来，即使一个男人或女人极其邪恶，公义天使的作为升到他心里，他也必定会做某件善事。


    他说：“所以你看，跟随公义的天使、弃绝邪恶的天使，是好的。这条诫命所说明的是有关信的事：你要相信公义天使的作为，并且实行这些事，好向上帝而活。也要认定邪恶天使的作为是严酷的；所以，不实行这些事，你就会向上帝而活。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέργειαι
  choice: 作用
  rationale: 此词在本段指两个天使在人心中显出的运作及影响；“作用”自然易懂，也保留其动态含义。
- source_word: πίστευε / πιστεύσῃς
  choice: 信从／相信
  rationale: 对象为天使及其作为时，不只是认知上的相信，也含信赖与听从；按中文语境分别译作“信从”和“相信”。
- source_word: ἀσύμφορα
  choice: 毫无益处
  rationale: 准确表达“不利、无益”，避免把原文加强成必然造成直接伤害。
- source_word: ἐνθύμησις
  choice: 意念
  rationale: 指进入内心的思想或念头；“意念”符合庄重而通俗的宗教叙事语体。
- source_word: ἀποτάξασθαι
  choice: 弃绝
  rationale: 该词不只是离开，也有断绝关系、拒绝追随之意；“弃绝”简洁保留其力度。
- source_word: ζήσῃ τῷ Θεῷ
  choice: 向上帝而活
  rationale: 保留与格结构可能表达的归向、为着上帝而活的神学张力，不简化为单纯“得生命”。
- source_word: χαλεπά
  choice: 有害的
  rationale: 在此承接邪恶天使的作为对上帝仆人无益这一语境，译为“有害的”比“艰难的”更符合伦理含义，同时不额外引入刑罚观念。
theological_decisions:
- issue: 天使意念进入人心后行为的必然性
  choice: 保留“必会／必定”的强烈必然措辞
  alternative: 弱化为“可能会”或“容易会”
  rationale: 原文 δεῖ 与 ἐξ ἀνάγκης δεῖ 明确表达必要性；译文不替作者化解这与人的责任之间的张力。
- issue: “忠信的人”与犯罪的关系
  choice: 译作“即使一个人忠信……也必会犯某种罪”
  alternative: 将“忠信”解释成仅指名义上的信徒
  rationale: 原文 πιστὸς ἀνήρ 未作限定，不应在翻译中加入对其信仰真伪的判断。
- issue: 两个天使的作用
  choice: 按原文直称“公义的天使”和“邪恶的天使”
  alternative: 解释为人的善恶倾向或圣灵与魔鬼
  rationale: 原文以天使为行动主体；译文保留其古代宗教图景，不进行体系化改释。
translation_notes:
  register: 采用现代标准普通话的庄重叙述语体，句式清楚，适合普通读者。保留原文反复出现的“作为”“心里”“向上帝而活”等关键词，以显出论证脉络；性别并列处用“无论男女”及中性代词，使中文自然而不删去原文明确包含男女的范围。
