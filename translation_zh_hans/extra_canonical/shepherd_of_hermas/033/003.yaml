  rationale: 修订严格保留原文关于两位天使、内心意念及行为必然性的表述，不作教义性解释。将χαλεπά改为“严酷的”，以区别前文ἀσύμφορα的“毫无益处”；并调整ἔχεις、πίστευε及τὰ περὶ τῆς πίστεως的表达，使语义推进和现代汉语搭配更准确。
