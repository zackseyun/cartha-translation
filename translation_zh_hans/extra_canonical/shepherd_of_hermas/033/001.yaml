base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/001.yaml
  text: He says, “I commanded you in the first commandment to keep faith and fear and self-control.” “Yes, lord,” I say. “But now,” he says, “I also want to make known to you their powers, so that you may understand what power and activity each of them has. For their activities are twofold; so they are set over the righteous and the unrighteous. So you—trust the righteous, but do not trust the unrighteous; for righteousness has a straight path, but unrighteousness a crooked one. But you, walk on the straight [and level] path, and leave the crooked.
translation:
  language: zh_hans
  text: '他对我说：“我在第一条诫命中曾吩咐你，要持守信心、敬畏和节制。”


    我说：“是的，主啊。”


    他又说：“现在，我还要向你说明它们的能力，使你明白它们各自具有怎样的能力和作用。因为它们的作用是两面的：一面关乎正义，一面关乎不义。所以，你要信从正义，不可信从不义；正义有一条正直的路，不义却有一条弯曲的路。你要走正直的[a]路，离开那弯曲的路。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“正直而平坦的路”。
    reason: 希腊文本将καὶ ὁμαλῇ（“并且平坦”）置于方括号中，反映其文本传承上的不确定性。正文采用较短读法，脚注保留异文。
lexical_decisions:
- source_word: πίστιν
  choice: 信心
  rationale: 在本段与敬畏、节制并列，指应当持守的信靠；“信心”既符合早期基督教语境，也保留其作为德行的含义。
- source_word: φόβον
  choice: 敬畏
  rationale: 语境指面向上帝的宗教性畏惧，用“敬畏”比单纯的“惧怕”更准确。
- source_word: ἐγκράτειαν
  choice: 节制
  rationale: 表示自我约束、克制欲望；“节制”是自然且庄重的现代汉语表达。
- source_word: δυνάμεις / δύναμιν
  choice: 能力
  rationale: 保留δύναμις所指的力量或效能，并与后面的ἐνέργεια区分。
- source_word: ἐνέργειαν / ἐνέργειαι
  choice: 作用
  rationale: 此处指这些德行所产生或表现出的运作与效力；译为“作用”比“活动”更符合上下文。
- source_word: τῷ δικαίῳ / τῷ ἀδίκῳ
  choice: 正义／不义
  rationale: 希腊语中性形容词作名词用，较可能指“正义之事／不义之事”而非具体的义人和不义之人；采用抽象名词，避免擅自人格化。
- source_word: πίστευε
  choice: 信从
  rationale: 这里不仅是认知上的相信，也带有听从并依循的意味；“信从”能与道路意象自然衔接。
- source_word: ὀρθὴν / στρεβλήν
  choice: 正直／弯曲
  rationale: 保留原文以道路形态比喻道德方向的鲜明对照。
theological_decisions:
- issue: “信从正义，不可信从不义”的所指
  choice: 将τῷ δικαίῳ和τῷ ἀδίκῳ译作抽象的“正义”和“不义”
  alternative: 译作“义人”和“不义的人”
  rationale: 原文使用中性单数形式，并随即以“正义有一条正直的路，不义却有一条弯曲的路”加以说明，因此抽象理解更贴近语法和论证，同时不把经文限定为对两类人的信任。
- issue: κύριε的称呼层级
  choice: 译作“主啊”
  alternative: 译作“先生”或“主人”
  rationale: 赫马在异象中以敬称称呼训诲者；“主啊”保留尊敬和从属关系，但不额外指明此称呼对象就是上帝或基督。
- issue: “它们的作用有两方面，分别关乎正义和不义”
  choice: 保留两方面作用与正义、不义之间较为概括的关系
  alternative: 解释成每一种德行都能产生善恶两种结果
  rationale: 原文διπλαῖ及κεῖνται ἐπὶ δικαίῳ καὶ ἀδίκῳ表达简略，确切逻辑关系并不完全明朗；译文避免替作者消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和训诲语体。对话层次清楚，保留“正直的路／弯曲的路”的比喻；避免使用过度宗派化的术语，也不把原文中较含混的“能力”和“作用”合并解释。
