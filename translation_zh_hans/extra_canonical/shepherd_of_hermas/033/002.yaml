base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/002.yaml
  text: For the crooked path has no tracks, but pathless places and many stumbling blocks; and it is rough and thorny. Therefore it is harmful. But hear also the works of the other way. First of all, if there should come upon you a quick temper or bitterness, know that he is in you. Then come desire for many activities, and extravagance in many foods and drinks, and many drunken sprees, and various luxuries, and things that are not fitting; and desire for women, and greed, and arrogance, and boastfulness, and whatever things are akin and similar to these. Therefore, whenever these things rise up in your heart, know that the angel of wickedness is with you.
translation:
  language: zh_hans
  text: 因为弯曲的路没有路径，只有无路之地和许多绊脚石；它崎岖，又满是荆棘，所以对行在其上的人有害。不过，你也要听听邪恶天使的作为。首先，如果暴躁或苦毒临到你，要知道，他就在你里面。接着便是：贪求做许多事，奢享多样的饮食和酒宴，纵酒狂欢，沉溺于种种享乐和不合宜的事；又贪恋女人、贪得无厌、骄傲自大、狂妄夸口，以及一切与这些相近相似的事。因此，每当这些事涌上你的心头，要知道，邪恶的天使正与你同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρεβλὴ ὁδός
  choice: 弯曲的路
  rationale: 保留道路意象及其与“正直的路”的对照，不将其抽象化为一般的邪恶生活。
- source_word: ἀνοδίας
  choice: 无路可走之处
  rationale: 表达没有成形道路、难以通行之地，并与前面的“没有路径”相呼应。
- source_word: θυμός
  choice: 暴躁
  rationale: 此处与“苦毒”并列，指骤起而易爆发的怒气；“暴躁”比泛称“愤怒”更能体现这种倾向。
- source_word: πικρία
  choice: 苦毒
  rationale: 保留其内在怨愤、尖刻的伦理含义，而不只译作一般的痛苦。
- source_word: ἐπιθυμία πράξεων πολλῶν
  choice: 贪求做许多事
  rationale: 保留“欲求”与“许多事务/行动”的宽泛表达，不擅自限定为经商、营利或忙碌。
- source_word: πολυτέλεια
  choice: 奢享
  rationale: 在饮食语境中表达铺张奢侈的享用，同时保持自然简洁。
- source_word: κραιπαλῶν
  choice: 狂欢
  rationale: 该词涉及酒后放纵、宴饮无度；与“纵酒”连用可传达其放荡宴乐的意味。
- source_word: πλεονεξία
  choice: 贪得无厌
  rationale: 表现不断攫取更多的贪欲，语义比单纯“贪心”更充分。
- source_word: ὁ ἄγγελος τῆς πονηρίας
  choice: 邪恶的天使
  rationale: 直译所属结构，不将其改写为魔鬼或恶灵，以免增添原文没有明确给出的身份判断。
theological_decisions:
- issue: “他就在你里面”所指为何
  choice: 保留男性代词“他”，不在正文补明身份
  alternative: 译为“邪恶的天使就在你里面”
  rationale: 希腊文此处只用男性代词 αὐτός，身份到段末才明说；保留代词可维持原文的推进和一定程度的指涉张力。
- issue: 邪恶力量与人的内心之间的关系
  choice: 分别译作“在你里面”和“与你同在”
  alternative: 统一意译为“控制着你”或“住在你心里”
  rationale: 原文先用 ἐν σοί，后用 μετὰ σοῦ；按各自措辞翻译，避免把思想临到人等同于附身或完全控制。
translation_notes:
  register: 采用现代、庄重而通俗的叙述语体。保留“两条路”、道路险阻和内心涌念等核心意象；列举恶行时以自然中文调整节奏，但不把宽泛词语缩限为特定教派式伦理类别。
