    再者，当一个人因某件事发怒，变得极其苦毒时，忧愁又会进入这发怒之人的心里；他便因自己所做的事忧伤，并且悔改，因为他做了恶事。因此，这种忧愁似乎带来救恩，因为他做了恶事以后悔改了。


    所以，这两种情形都使圣灵忧伤：三心二意使圣灵忧伤，因为没有做成所着手的事；急怒使圣灵忧伤，因为做了恶事。因此，三心二意和急怒，二者都令圣灵忧伤。


