  yaml_path: translation/extra_canonical/shepherd_of_hermas/038/001.yaml
  text: '“Listen, then,” he says, “foolish one, how sorrow wears down the Holy Spirit and then again saves. Whenever the double‑minded person undertakes some action and fails in it because of his double‑mindedness, this sorrow enters into the person and grieves the Holy Spirit and wears it down. Then again, when quick temper clings to a person concerning some matter, and he becomes exceedingly embittered, again sorrow enters into the heart of the person who became quick‑tempered, and he is grieved over the deed that he did and repents, because he did what is evil. This sorrow, then, seems to bring salvation, because after doing what is evil he repented. Therefore both things grieve the Spirit: double‑mindedness, because it did not attain its purpose; and quick temper grieves the Spirit, because it did what is evil. Both, then, are grievous to the Holy Spirit—double‑mindedness and quick temper. Remove, therefore, sorrow from yourself, and do not afflict the Holy Spirit that dwells in you,
    lest it appeal to God and depart from you. For the Spirit of God that was given to this flesh does not endure sorrow or distress.”'
translation:
  language: zh_hans
  text: '“那么，你要听，”他说，“无知的人哪，忧愁怎样耗损圣灵，又怎样反而带来救恩。当一个三心二意的人着手做某件事，却因自己的三心二意而没有做成时，这忧愁便进入这人里面，使圣灵忧伤，并耗损圣灵。


    再者，当一个人因某件事发怒，变得极其苦毒时，忧愁又会进入这发怒之人的心里；他便因自己所做的事忧伤，并且悔改，因为他做了恶事。因此，这种忧愁似乎带来救恩，因为他做了恶事以后悔改了。


    所以，这两种情形都使圣灵忧伤：三心二意使圣灵忧伤，因为没有做成所着手的事；急怒使圣灵忧伤，因为做了恶事。因此，三心二意和急怒，二者都令圣灵忧伤。


    所以，你要除去自己的忧愁，不要使住在你里面的圣灵受苦，免得圣灵向上帝陈情，离开你。因为赐给这肉身的上帝之灵，不能忍受忧愁，也不能忍受困苦。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύπη
  choice: 忧愁
  rationale: 该词贯穿本段，既指因失败产生的消沉，也指作恶后产生的悔恨；统一译作“忧愁”，保留作者刻意呈现的双重作用。
- source_word: ἐκτρίβει
  choice: 损耗
  rationale: 原词有磨损、耗损之意；“损耗”比“赶走”更贴近本句，并与后文圣灵可能“离开”相区别。
- source_word: δίψυχος / διψυχία
  choice: 三心二意的人／三心二意
  rationale: 字面涉及“两心”或心意分裂，语境强调犹疑不定；现代汉语“三心二意”自然易懂，又保留不专一之意。
- source_word: ὀξυχολία
  choice: 暴躁
  rationale: 指容易动怒、脾气急烈的状态；“暴躁”能自然涵盖急怒及其持续影响。
- source_word: πικρανθῇ
  choice: 满怀苦毒
  rationale: 被动形式含变得苦涩、愤恨之意；此处译法表现怒气深化为内在怨苦。
- source_word: μετανοεῖ
  choice: 悔改
  rationale: 这里不仅是后悔，也包含因认识到自己行恶而转意，故采用宗教及一般语境均通行的“悔改”。
- source_word: ἐντεύξηται
  choice: 申诉
  rationale: 该词可指向上帝请求或陈情；语境带有圣灵因受苦而向上帝陈诉的意味，“申诉”保留这一力度。
- source_word: στενοχωρίαν
  choice: 压迫
  rationale: 原词可指狭迫、困窘或痛苦；与“忧愁”并列时，“压迫”较好表达受逼迫、受困的状态。
theological_decisions:
- issue: “忧愁……使人得救”的主语与对象
  choice: 译作“忧愁……反而使人得救”及“能带来救恩”
  alternative: 译作“忧愁自己得救”或直接断言“忧愁施行拯救”
  rationale: 希腊文仅说λύπη“又拯救”及“似乎有救恩”，对象略去。根据下文因悔改而得救的逻辑，补出“使人”，同时用“似乎”保留原文审慎语气。
- issue: 圣灵的代词与位格表达
  choice: 重复使用“圣灵”，不以“它”指称
  alternative: 按希腊文语法中性代词译作“它”
  rationale: 现代汉语中重复称“圣灵”更庄重清晰，也避免无意中将圣灵物化；并未借此扩展原文的位格神学。
- issue: 圣灵可能离开人的警告
  choice: 直译为“免得圣灵向上帝申诉，离开你”
  alternative: 弱化为“免得你失去圣灵的帮助”
  rationale: 原文明确表达向上帝陈情及离开的可能性，应保留其警告和神学张力，不加以体系化解释或弱化。
- issue: “赐入这肉身”的表达
  choice: 译作“上帝所赐、住在这肉身中的灵”
  alternative: 严格直译为“赐给这肉身的上帝之灵”
  rationale: 原文εἰς τὴν σάρκα ταύτην可直指“进入/给到这肉身”；结合前句“住在你里面”，采用自然汉语表达，同时保留灵与肉身的关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文中“忧愁”既有害又似乎导向救恩的张力，并通过重复关键词呈现论证结构。段落依内容分为教导与劝诫两部分；不添加原文没有的宗派性解释。
