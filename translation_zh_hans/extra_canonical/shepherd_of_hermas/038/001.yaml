revisions:
- from: '“所以你要听，”他说，“无知的人哪，忧愁怎样损耗圣灵，又怎样反而使人得救。一个三心二意的人着手做某件事，却因自己的三心二意而失败时，这忧愁便进入他里面，使圣灵忧伤，并损耗圣灵。再者，当暴躁因某件事缠住一个人，使他满怀苦毒时，忧愁又会进入这暴躁之人的心；他便为自己所做的事忧伤，并且悔改，因为他做了恶事。因此，这种忧愁似乎能带来救恩，因为那人做了恶事以后悔改了。所以，这两件事都使圣灵忧伤：三心二意使圣灵忧伤，是因为没有做成所要做的事；暴躁使圣灵忧伤，是因为做了恶事。因此，三心二意和暴躁，二者都令圣灵忧伤。


    所以，你要除去自己的忧愁，不要使住在你里面的圣灵受苦，免得圣灵向上帝申诉，离开你。因为上帝所赐、住在这肉身中的灵，不能忍受忧愁，也不能忍受压迫。”'
