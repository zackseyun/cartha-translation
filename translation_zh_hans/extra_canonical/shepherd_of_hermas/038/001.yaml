  rationale: 修订主要纠正末句对“赐给这肉身的上帝之灵”的处理，并将“压迫”改为“困苦”。同时润饰“暴躁缠住人”等不自然结构；以“急怒”较准确反映易于动怒的性情。首句及“似乎有救恩”均改用“带来救恩”，避免在原文未明言之处补足受救对象，同时不改变下文由悔改导向救恩的论证。
