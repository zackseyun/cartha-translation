revisions:
- from: 他说：“人无论做什么，只要是乐意去做，那行为对他就是一种享乐。就连暴躁的人，让自己的激情得到充分满足，也是在纵情享乐；奸淫的、醉酒的、毁谤的、说谎的、贪婪的、诈取他人财物的，以及做类似事情的人，也都让自己的病态得到充分满足。因此，他们是在自己的行为中纵情享乐。这一切享乐对上帝的仆人都有害。正因这些迷惑，那些受惩罚、遭折磨的人才会受苦。”
  to: 他说：“人所做的每一件事，只要他做时感到愉快，对他就是一种享乐。就连暴躁的人，任由自己的怒气得到满足，也是在放纵自己；犯奸淫的人、醉酒的人、毁谤人的、说谎的人、贪婪的人、侵夺他人财物的人，以及做类似事情的人，都任由自己的病态得到满足；所以，他因自己的行为而享乐。这一切享乐对上帝的仆人都有害。因此，受惩罚和折磨的人因这些迷误而受苦。”
  rationale: 修订以“做时感到愉快”准确表达ἡδέως；按暴躁者的上下文将πάθος具体译作“怒气”；改善列举中的现代汉语名词表达，并以“因自己的行为而享乐”对应ἐπὶ τῇ πράξει αὐτοῦ。末句保留ἀπάται的解释空间，译作“迷误”，不预设其具体机制或施罚者。
