base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/006.yaml
  text: He says, “Every deed is an indulgence to a person, whatever he does with pleasure. For even the hot‑tempered man, by giving his own passion its fill, indulges himself; and the adulterer and the drunkard and the slanderer and the liar and the greedy person and the defrauder and the one doing things like these gives his own disease its fill; he therefore indulges himself in his act. All these indulgences are harmful to the servants of God. Therefore, because of these deceptions, those who are punished and tormented suffer.
translation:
  language: zh_hans
  text: 他说：“人所做的每一件事，只要他做时感到愉快，对他就是一种享乐。就连暴躁的人，任由自己的怒气得到满足，也是在放纵自己；犯奸淫的人、醉酒的人、毁谤人的、说谎的人、贪婪的人、侵夺他人财物的人，以及做类似事情的人，都任由自己的病态得到满足；所以，他因自己的行为而享乐。这一切享乐对上帝的仆人都有害。因此，受惩罚和折磨的人因这些迷误而受苦。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφή / τρυφᾷ
  choice: 享乐／纵情享乐
  rationale: 该词在本段既指令人愉悦的行为，也指沉溺其中的状态；用“享乐”保留其广义，并以“纵情享乐”自然表达动词含义。
- source_word: ὀξύχολος
  choice: 暴躁的人
  rationale: 准确表达容易急怒、脾气暴烈之人，符合现代汉语。
- source_word: πάθος
  choice: 激情
  rationale: 此处指驱使暴躁者的强烈情绪或冲动；译作“激情”保留其较宽泛含义，不将其完全限定为怒气。
- source_word: νόσος
  choice: 病态
  rationale: 原文以“疾病”比喻罪恶倾向；“病态”既保留隐喻，也使汉语表达自然。
- source_word: ἀποστερητής
  choice: 诈取他人财物的
  rationale: 该词指剥夺、侵吞或欺诈取财的人；此译清楚呈现其损害他人权益的含义。
- source_word: ἀπάται
  choice: 迷惑
  rationale: 原词可指欺骗、迷误或迷惑；结合上下文，指这些有害享乐所造成的欺骗性迷误，译作“迷惑”保留一定语义张力。
- source_word: τιμωρούμενοι καὶ βασανιζόμενοι
  choice: 受惩罚、遭折磨的人
  rationale: 分别对应惩处与痛苦折磨，保留原文并列及程度差异。
theological_decisions:
- issue: 有害享乐与受苦之间的因果关系
  choice: 正因这些迷惑……才会受苦
  alternative: 这些受罚受苦的人，是为了这些欺骗而受苦
  rationale: 原文 διά表示原因；此译明确因果，却不进一步界定惩罚来自何者或以何种机制施行。
- issue: 罪恶倾向的疾病隐喻
  choice: 让自己的病态得到充分满足
  alternative: 让自己的疾病得到满足
  rationale: 保留罪恶如疾病的比喻，但不把它解释成具体医学疾病，也不加入后世教义术语。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。保留原文“享乐”一词在中性行为愉悦与有害纵欲之间的张力，并通过上下文及“纵情”显示其负面用法。
