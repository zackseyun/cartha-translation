base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/001.yaml
  text: “Since,” I say, “sir, I have not understood at all about the time of deception and indulgence and torment, make it more clear to me.”
translation:
  language: zh_hans
  text: 我说：“主啊，关于迷惑、享乐和折磨的时长，我完全不明白；请向我解释得更清楚些。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 保留对受尊敬者的直接称呼；在本书异象对话的宗教语境中，“主啊”自然庄重，但不额外判定说话对象的神性。
- source_word: τοῦ χρόνου
  choice: 时限
  rationale: 此处所问并非抽象的“时间”，而是后文所解释享乐一日与受苦一年的对应期限，因此译为“时限”更切合上下文。
- source_word: τῆς ἀπάτης
  choice: 受迷惑
  rationale: ἀπάτη可指欺骗、迷惑或迷妄；与后文ἀπατώμενος呼应，采用动态表达，保留人陷于迷惑之中的含义。
- source_word: τρυφῆς
  choice: 享乐
  rationale: 该词在后文兼指有害的纵欲和可取的行善之乐；此处用较宽泛的“享乐”，不预先限定为“放纵”。
- source_word: βασάνου
  choice: 受苦
  rationale: βασάνος在本段指惩罚性的痛苦或折磨；此处先用自然且不显过度解释的“受苦”，后文可按语境具体处理。
- source_word: τηλαυγέστερόν μοι δήλωσον
  choice: 请向我解释得更清楚些
  rationale: τηλαυγέστερον字面有“更清晰、更明亮”之意；现代汉语以“解释得更清楚些”自然传达请求进一步阐明。
theological_decisions:
- issue: κύριε所指对象及其身份
  choice: 译作“主啊”，不在正文中补明身份
  alternative: “先生”或“阁下”
  rationale: 原文仅以尊称直接呼告，当前节选不足以要求在译文中明确其神学身份；保留称谓的庄重性与指涉开放性。
- issue: ἀπάτη是主动欺骗还是被动受骗
  choice: 译作“受迷惑”
  alternative: “欺骗”或“迷妄”
  rationale: 后文分词ἀπατώμενος呈被动/中动态色彩，“受迷惑”能与之呼应，同时避免把责任完全归于外在欺骗者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体；保留原句中“我说”的插入结构，并用“关于……的时限”承接后文论述。无脚注标记。
