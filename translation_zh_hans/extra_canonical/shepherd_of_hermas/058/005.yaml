  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/005.yaml
  text: “What indulgences, sir,” I say, “are harmful?”
translation:
  language: zh_hans
  text: 我问：“主啊，哪些享乐是有害的呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 在《黑马牧人》的对话语境中，这是对启示者的尊称；译作“主啊”既保留尊敬语气，也符合早期基督教文本的庄重文体。
- source_word: τρυφαί
  choice: 享乐
  rationale: 此处承接上下文，指使人感到愉悦、得到满足的行为或放纵，不仅限于物质奢华；“享乐”比“奢侈”覆盖面更广，并为后文区分有害与有益的享乐留下空间。
- source_word: βλαβεραί
  choice: 有害的
  rationale: 直接表达其对人的属灵与道德损害，不提前加入“犯罪”等原文未明说的判断。
- source_word: φημί
  choice: 我问
  rationale: 字面为“我说”，但该句本身是疑问句，现代汉语用“我问”自然清楚，且不改变叙事内容。
theological_decisions:
- issue: κύριε所指对象的身份
  choice: 保留称呼“主啊”，不在正文中明确其身份
  alternative: 先生／大人
  rationale: 原文只给出尊称，当前节段未明说受话者身份；保留传统而庄重的称呼，同时不添加身份解释。
- issue: τρυφαί的道德性质
  choice: 译作中性的“享乐”，由“有害的”加以限定
  alternative: 放纵／罪中之乐
  rationale: 后文还提到能使人得救的τρυφαί，因此该词本身不能一概译成负面的“放纵”，以免消除原文刻意保留的张力。
translation_notes:
  register: 采用现代、自然而庄重的问答体。“我问”使叙事在汉语中顺畅；保留“主啊”的呼语形式。
