review_pass:
  verdict: revise
  source_fidelity: “顽固不改”将παράμονος（持续存在、挥之不去）较强地解释为主动的顽梗不悔；原文的责备固然严厉，但此处主语是“愚昧”本身。另，“期限届满”可译，但较易使读者联想到法律或明确设定的截止日期；ὁ χρόνος保留为较开放的“时候”更稳妥。
  naturalness: 原译整体庄重自然。将首句调整为“你的愚昧仍未离开你”，并把“既然你想知道”改为更贴近“照你所愿”的表达，可在不失现代汉语流畅度下提高贴合度。
  terminology: “洁净自己的心”“事奉上帝”“愚昧人”均适切，且保留了原文的道德—属灵语域。
  issues:
  - severity: medium
    issue: παράμονος的译法略增“顽梗不悔”的主动含义。
    rationale: “你的愚昧顽固不改”可被理解为人故意坚持不改；παράμονος直接修饰ἀφροσύνη，主要说愚昧持续不去。译为“你的愚昧仍未离开你”较能保留原文措辞及责备语气。
  - severity: low
    issue: “期限届满”对ὁ χρόνος略作限定。
    rationale: 原文仅说“时候／时间被满足”，并未说明是法律性的期限或具体何种期限；“时候到了”较自然地维持其未定指。
  - severity: low
    issue: καθὼς βούλει的语气可更直接保留。
    rationale: “既然你想知道”根据上下文补出了“知道”的对象；“照你所愿”更贴近原文，且不妨碍理解。
