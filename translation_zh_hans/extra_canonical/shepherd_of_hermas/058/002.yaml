- from: 他回答我说：“你的愚昧顽固不改，你不愿洁净自己的心，也不愿事奉上帝。你要当心，免得期限届满时，你仍被发现是个愚昧人。既然你想知道，就听着吧，好让你明白这些事。”
  to: 他回答我说：“你的愚昧仍未离开你；你不愿洁净自己的心，也不愿事奉上帝。你要当心，免得时候到了，你被发现是个愚昧人。那么，就照你所愿听着吧，好让你明白这些事。”
  rationale: 修订限于三处：以“仍未离开你”对应愚昧的持续性，避免把παράμονος过度释为顽梗；以“时候到了”保留ὁ χρόνος的开放所指；以“照你所愿”贴近καθὼς βούλει。其余译语保留原稿的准确性、现代庄重语体及术语一致性。
