base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/002.yaml
  text: He answered me and says, “Your foolishness is persistent, and you are unwilling to cleanse your heart and to serve God. Watch out lest the time be fulfilled, and you be found foolish. Listen then,” he says, “as you desire, so that you may understand these things.
translation:
  language: zh_hans
  text: 他回答我说：“你的愚昧仍未离开你；你不愿洁净自己的心，也不愿事奉上帝。你要当心，免得时候到了，你被发现是个愚昧人。那么，就照你所愿听着吧，好让你明白这些事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ ἀφροσύνη σου παράμονός ἐστι
  choice: 你的愚昧顽固不改
  rationale: ἀφροσύνη指缺乏属灵和道德判断的“愚昧”；παράμονος强调持续、顽固，译为“顽固不改”自然地保留责备力度。
- source_word: καθαρίσαι ... τὴν καρδίαν
  choice: 洁净自己的心
  rationale: 保留“心”作为意志、思想与道德内在生命中心的原文意象。
- source_word: δουλεύειν τῷ Θεῷ
  choice: 事奉上帝
  rationale: δουλεύειν本有作为仆人服事之意；“事奉”在庄重现代汉语中既自然，也保留宗教语境。
- source_word: μήποτε ὁ χρόνος πληρωθῇ
  choice: 免得期限届满时
  rationale: χρόνος可指一段既定时间，πληρωθῇ指达到终点或满期；“期限届满”保留其警告意味，而不擅自判定具体所指。
- source_word: ἄφρων εὑρεθῇς
  choice: 你仍被发现是个愚昧人
  rationale: 保留被动式“被发现”，表达届时显明为愚昧人的审判性语气；“仍”承接前句持续的愚昧。
- source_word: καθὼς βούλει
  choice: 既然你想知道
  rationale: 直译为“照你所愿”在中文中略显生硬；结合上文请求解释，译出其语用含义，同时不增加解释内容。
theological_decisions:
- issue: “期限届满”具体指悔改机会、刑罚期限还是末时
  choice: 保留为未具体说明的“期限”
  alternative: 译作“悔改的期限”或“末日来到”
  rationale: 本节自身没有明确限定ὁ χρόνος的所指，不应以某一神学解释消除原文的开放性。
- issue: 愚昧的性质
  choice: 保留“愚昧”及其道德—属灵责备色彩
  alternative: 译作“无知”或“愚蠢”
  rationale: ἀφροσύνη在这里不只是知识不足，而与不洁净内心、不事奉上帝相连；“愚昧”比“无知”准确，也比“愚蠢”更庄重。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和直接引语。“他回答我说”贴近希腊文叙事公式；避免过度古雅的“尔、汝、须知”等表达。译文范围严格对应读者片段第2段（原文编号2）。
