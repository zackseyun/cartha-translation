  to: 所以，他整整一年受折磨、受惩罚，有时会想起那享乐和迷惑，也明白自己因这些而遭受苦楚。因此，凡贪图享乐、受迷惑的人，都这样受折磨；他们虽有生命，却把自己交给了死亡。
