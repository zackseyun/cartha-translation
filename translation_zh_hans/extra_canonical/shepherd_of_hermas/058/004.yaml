base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/004.yaml
  text: “So, being tormented and punished the whole year, he remembers the indulgence and the deception, and he knows that because of them he suffers evil things. Every person who indulges himself and is deceived is tormented in this way, because, though having life, they have handed themselves over to death.”
translation:
  language: zh_hans
  text: 所以，他整整一年受折磨、受惩罚，有时会想起那享乐和迷惑，也明白自己因这些而遭受苦楚。因此，凡贪图享乐、受迷惑的人，都这样受折磨；他们虽有生命，却把自己交给了死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφή
  choice: 享乐／贪图享乐
  rationale: 此处指放纵欲望、以罪中之乐满足自己的行为；按句法分别用名词“享乐”和动词性表达“贪图享乐”，既自然又保留贬义语境。
- source_word: ἀπάτη / ἀπατώμενος
  choice: 迷惑／受迷惑
  rationale: 保留名词与被动分词的对应关系，不把其意义限定为主动欺骗别人或纯粹自我欺骗。
- source_word: βάσανος / βασανίζεται
  choice: 折磨／受折磨
  rationale: 传达持续而痛苦的惩治，与τιμωρία所表达的“惩罚”并列而不混同。
- source_word: πάσχει τὰ πονηρά
  choice: 遭受苦楚
  rationale: 希腊语直译为“遭受恶事”；在此语境中指承受痛苦后果，译为“遭受苦楚”更合现代汉语。
- source_word: εἰς θάνατον ἑαυτοὺς παραδεδώκασι
  choice: 把自己交给了死亡
  rationale: 保留“交付自己”这一强烈主动意象，以及生命与死亡之间的对照。
theological_decisions:
- issue: 拥有生命却归向死亡的张力
  choice: “他们本来拥有生命，却把自己交给了死亡”
  alternative: “他们虽活着，却使自己走向死亡”
  rationale: 采用较贴近原文的“拥有生命”和“交给死亡”，不预先断定这里的“生命”仅指肉身生命或某种特定教义意义上的生命。
- issue: 单数到复数的人称转换
  choice: 前句用“他”，总结句用“凡……的人／他们”
  alternative: 全段统一为复数
  rationale: 原文先以单数个体说明，随后在πᾶς ἄνθρωπος之后转用复数分词和代词；译文保留这一由个例转向普遍群体的变化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“整整一年”“正是因这些”凸显原文持续时间与因果关系；避免古奥措辞，也不添加原文未明确说明的教派性解释。
