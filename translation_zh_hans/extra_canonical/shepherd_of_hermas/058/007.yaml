revisions:
- from: 不过，也有使人得救的享乐：许多人行善，是因自己喜爱而乐在其中。因此，这样的享乐对上帝的仆人有益，也使这样的人得着生命；但前面所说那些有害的享乐，却给他们招来痛苦和惩罚。他们若执迷不改，不肯悔改，就是给自己招来死亡。
  to: 不过，也有使人得救的享乐；因为许多人行善，随自己的喜悦而行，并以此为乐。因此，这样的享乐对上帝的仆人有益，并使这样的人得着生命；但前面所说那些有害的享乐，却给他们带来痛苦和惩罚；他们若仍坚持不悔改，就给自己带来死亡。
  rationale: 修订仅校正分词短语的表达，并删去末句重复且稍强的解释；保留原文对“享乐”一词的正反并置，以及未加限定的“死亡”。
