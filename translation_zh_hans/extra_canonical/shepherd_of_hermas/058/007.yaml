base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/007.yaml
  text: “But there are also indulgences that save people; for many, by doing good things, indulge themselves, being carried along by their own pleasure. This indulgence, therefore, is beneficial for the servants of God, and it secures life for such a person; but the harmful indulgences previously mentioned procure torments and punishments for them; and if they persist and do not repent, they procure death for themselves.”
translation:
  language: zh_hans
  text: 不过，也有使人得救的享乐；因为许多人行善，随自己的喜悦而行，并以此为乐。因此，这样的享乐对上帝的仆人有益，并使这样的人得着生命；但前面所说那些有害的享乐，却给他们带来痛苦和惩罚；他们若仍坚持不悔改，就给自己带来死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί / τρυφή
  choice: 享乐
  rationale: 本段刻意把同一个词同时用于有害的纵欲和因行善而有的愉悦；统一译作“享乐”，保留原文的修辞张力，并由上下文区分其善恶。
- source_word: σώζουσαι
  choice: 使人得救
  rationale: 保留动词 σῴζω 的救助、拯救语义，不弱化为单纯“有益”。
- source_word: τῇ ἑαυτῶν ἡδονῇ φερόμενοι
  choice: 是因自己喜爱而乐在其中
  rationale: 自然表达被自身的喜悦或乐趣推动之意，同时避免把 φερόμενοι 过度解释成不可抗拒的驱使。
- source_word: σύμφορός
  choice: 有益
  rationale: 准确传达“有利、有益处”的意思，符合现代汉语。
- source_word: περιποιεῖται
  choice: 使……得着 / 给……招来
  rationale: 该词在本节连续支配生命、痛苦惩罚和死亡；依宾语采用自然搭配，同时保留“为自己取得、带来”的共同语义。
- source_word: ἐπιμένωσι
  choice: 执迷不改
  rationale: 结合后面的“不肯悔改”，表达持续停留在前述有害行为中的意思。
theological_decisions:
- issue: 善行之乐与“得救”的关系
  choice: 直译为“使人得救的享乐”，并保留“使……得着生命”
  alternative: 译为“有益于人的享乐”或明确说善行是得救功德
  rationale: 原文确实使用 σώζουσαι 和 ζωὴν περιποιεῖται，但没有系统说明功德、恩典或称义机制；译文既不弱化，也不额外建构教义。
- issue: 坚持有害享乐的结局
  choice: “给自己招来死亡”
  alternative: 明确解释为肉身死亡或永恒灭亡
  rationale: θάνατον 在此未限定死亡的具体层面，应保留其神学警告的开放性。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。保留原文反复使用“享乐”的悖论式表达，以“有害的享乐”和行善时“乐在其中”的语境形成区分；不添加宗派性解释。
