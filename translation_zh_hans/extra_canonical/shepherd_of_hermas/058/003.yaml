base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/003.yaml
  text: “The one who indulges himself and is deceived for a single day and does what he wants has clothed himself with much foolishness and does not perceive the deed he is doing; for on the next day he forgets what he did the day before. For indulgence and deception have no memory because of the foolishness with which he has clothed himself. But when punishment and torment cling to a person for one day, he is punished and tormented for up to a year; for punishment and torment have great memory.
translation:
  language: zh_hans
  text: “一个人若放纵享乐、受迷惑一天，任意而行，便是披上了深重的愚昧；他并不明白自己所做的事，因为到了第二天，他就忘记前一天所做的事。享乐和迷惑没有记性，因为他披上了愚昧。可是，惩罚和折磨若临到一个人身上哪怕一天，他就要受惩罚、受折磨，直到一年；因为惩罚和折磨有很强的记性。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶν / τρυφή
  choice: 放纵享乐／享乐
  rationale: 此处不是一般的快乐，而是任意满足欲望的放纵；译为“放纵享乐”可传达其伦理贬义，后文再次出现时简作“享乐”以保持行文自然。
- source_word: ἀπατώμενος / ἀπάτη
  choice: 受迷惑／迷惑
  rationale: 中间语态或被动态分词可指受欺骗、陷入迷惑；保留被动意味，不擅自指定欺骗者。
- source_word: ἐνδέδυται
  choice: 给自己披上了
  rationale: 保留希腊文“穿上、披上”的形象，并以中文反身表达其状态与责任。
- source_word: πρᾶξιν
  choice: 所做的事
  rationale: 在上下文中指具体行为，用普通现代汉语表达比“行为”更自然。
- source_word: τιμωρία
  choice: 惩罚
  rationale: 保留受惩处的司法或管教含义。
- source_word: βάσανος
  choice: 痛苦
  rationale: 该词可指折磨、苦楚；与“惩罚”并列时译作“痛苦”，既避免机械重复，也不削弱严厉程度。
- source_word: κολληθῇ
  choice: 缠住
  rationale: 原义为黏附、紧贴；“缠住”保留无法轻易摆脱的形象。
- source_word: μέχρις ἐνιαυτοῦ
  choice: 长达一年
  rationale: 表达时间延续至一年的上限或幅度，不强化为必然整整一年。
- source_word: μνήμας μεγάλας ἔχει
  choice: 有很强的记性
  rationale: 保留原文将惩罚和痛苦拟人化为“有记性”的鲜明对比。
theological_decisions:
- issue: 享乐、迷惑与惩罚之间的时间比例
  choice: 保留“一天”与“长达一年”的直接对照
  alternative: 将其解释为固定的一日抵一年惩罚原则
  rationale: 原文是智慧性、警戒性的比较，没有明确建立普遍的精确刑罚公式，因此不作教义化扩展。
- issue: ἀπατώμενος的施事者与道德责任
  choice: 译作“受迷惑”，不说明由谁迷惑
  alternative: 译作“自欺”或“被魔鬼欺骗”
  rationale: 希腊文在本句未明示施事者；译文保留这一开放性，同时上下文仍清楚呈现当事人的任意而行。
- issue: “记性”的拟人表达
  choice: 直译保留拟人化
  alternative: 解释为享乐短暂而痛苦影响长久
  rationale: 解释虽符合语境，却会抹去原文修辞；正文保留张力，让读者从对照中领会含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“披上愚昧”及“惩罚和痛苦有记性”等原文意象；句式按中文节奏适度拆分，但维持因果链和一天对一年的对照。
