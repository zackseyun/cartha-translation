revisions:
- from: “一个人若放纵享乐、受迷惑一天，任意而行，就是给自己披上了重重的愚昧；他不明白自己所做的事，因为到了第二天，他便忘了前一天做过什么。享乐和迷惑没有记性，这是由于他所披上的愚昧。可是，惩罚和痛苦一旦缠住一个人一天，他就要受罚、受苦，长达一年；因为惩罚和痛苦有很强的记性。”
  to: “一个人若放纵享乐、受迷惑一天，任意而行，便是披上了深重的愚昧；他并不明白自己所做的事，因为到了第二天，他就忘记前一天所做的事。享乐和迷惑没有记性，因为他披上了愚昧。可是，惩罚和折磨若临到一个人身上哪怕一天，他就要受惩罚、受折磨，直到一年；因为惩罚和折磨有很强的记性。”
  rationale: 修订仅调整中文搭配及两项词义精度：以“深重”自然表达愚昧之多／之重；以“折磨”对应βάσανος；以“临到……哪怕一天”清晰而自然地保留κολληθῇ的持续临身意象及“一天—一年”的夸张性对照。“直到一年”对应μέχρις ἐνιαυτοῦ，不将其解释为固定刑罚公式。
