base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/002.yaml
  text: She laughed and says to me, "Evil desire has risen up into your heart. Or does it not seem to you to be a wicked thing for a righteous man if evil desire rises into his heart? It is indeed a sin—and a great one, she says. For a righteous man plans what is righteous. Therefore, in planning what is righteous, his glory is established in the heavens, and he has the Lord readily reconciled in every matter of his. But those who plan evil in their hearts bring upon themselves death and captivity—especially those who secure this present age for themselves, who exult in their wealth, and who do not hold fast to the good things that are coming.
translation:
  language: zh_hans
  text: 她笑着对我说：“邪恶的欲望已经升到你心里。难道你不认为，对一个义人来说，邪恶的欲望升到他心里是一件恶事吗？这确实是罪，而且是大罪。”她说，“因为义人所思量的是公义的事。他这样思量公义的事，他的荣耀就在诸天之上得以坚立；在他一切的事上，主都乐意与他和好。可是，那些心里图谋恶事的人，是在给自己招来死亡和被掳；尤其是那些为自己谋取今世、以自己的财富夸耀、不持守将来要来的美善的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία τῆς πονηρίας / ἡ πονηρὰ ἐπιθυμία
  choice: 邪恶的欲望
  rationale: 保留“欲望”进入内心的道德意象，不把它缩窄为特定的性欲或已经实施的行为。
- source_word: βουλεύεται / βουλευόμενοι
  choice: 思量／图谋
  rationale: 按宾语的正面或负面语境采用自然搭配，同时保留内心筹划、盘算之意。
- source_word: κατορθοῦται
  choice: 得以坚立
  rationale: 表达荣耀在天上获得确立的结果意义，又避免过度解释其实现机制。
- source_word: εὐκατάλλακτον
  choice: 乐意向他息怒
  rationale: 该词指容易被劝解、平息或和好；此译保留主对人转为和悦的关系含义，并比生硬的“容易和解”更符合现代汉语。
- source_word: αἰχμαλωσίαν
  choice: 被掳
  rationale: 保留原文“俘虏、掳掠”的强烈意象，不泛化为普通束缚。
- source_word: τὸν αἰῶνα τοῦτον περιποιούμενοι
  choice: 只为自己经营今世
  rationale: 保留“为自己取得、保全今世”的措辞张力，不直接释义为单纯“贪爱世界”。
- source_word: τῶν ἀγαθῶν τῶν μελλόντων
  choice: 将来美福
  rationale: 兼顾“将来的美好事物／福分”之义，保持末世指向而不具体化其内容。
theological_decisions:
- issue: 内在欲望是否已构成罪
  choice: 明确译作“这确实是罪，而且是大罪”
  alternative: 将其弱化为诱惑或犯罪倾向
  rationale: 原文直接使用 ἁμαρτία，并强调 μεγάλη；应保留它对内心邪欲的严厉判断。
- issue: 主与义人的关系
  choice: 译作“主也乐意向他息怒”
  alternative: “他使主与自己和好”或“主总是喜悦他”
  rationale: εὐκατάλλακτον 描写主容易平息、愿意和悦的状态；译文不把义人的正义筹划写成机械地赚取神恩，也不抹去和好／息怒的关系张力。
- issue: 义行与天上荣耀
  choice: 保留“这样思量正义的事，他的荣耀就在诸天之上得以坚立”
  alternative: 解释为靠思想称义或积攒功德
  rationale: 原文明确连接正义的思量与天上荣耀，却未系统说明因果机制，因此不加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与劝诫语体；保留“升到心里”“诸天之上”“被掳”等原文意象。引号和分句按中文阅读习惯整理，但保留“她说”的插入语及论证推进。
