  naturalness: “他们的灵魂必将懊悔——这些人……”在现代汉语中指代衔接略显突兀，且“灵魂懊悔”不如“灵魂将要悔改”自然。改写后保留原文“他们的灵魂”这一表达，也使关系从句的所指更清晰。
  terminology: “上帝”“祷告”“圣徒”及“医治”均合适。“悔改”是 μετανοέω 在此类早期基督教训诫文本中的首选对应语；脚注说明它不必预设完整的救恩结论，也可含悔恨的意味。
