revisions:
- from: “他们的灵魂必将懊悔[a]——这些人没有盼望，反倒对自己和自己的生命都已绝望。不过，你要向上帝祷告，他就会医治[b]你的罪、你全家的罪，以及所有圣徒的罪。”
  to: “那些没有盼望、已经对自己和自己的生命绝望之人的灵魂，将要悔改[a]。但你要向上帝祷告，他就会医治[b]你的罪、你全家上下的罪，以及所有圣徒的罪。”
  rationale: 修订以“悔改”作为 μετανοήσουσιν 的首选正文译法，并在脚注中保留“懊悔”的可能色彩，避免预断其最终结局。重组首句以改善现代汉语的指代与语序；将“全家”扩展为“全家上下”以较充分表达 οἶκος 的家户范围。其余关键措辞及脚注锚点均予保留。
  reviewer_model: gpt-5.6-terra
