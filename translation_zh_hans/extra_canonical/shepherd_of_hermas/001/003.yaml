base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/003.yaml
  text: '"Their souls will repent—those who have no hope, but have despaired of themselves and of their life. But you—pray to God, and he will heal your sins, and those of your whole household, and of all the holy ones."'
translation:
  language: zh_hans
  text: “那些没有盼望、已经对自己和自己的生命绝望之人的灵魂，将要悔改[a]。但你要向上帝祷告，他就会医治[b]你的罪、你全家上下的罪，以及所有圣徒的罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悔改”也可带有“懊悔”或“悔恨”的意味；原词可涵盖心意的转变与悔恨，此处上下文并未完全消除这种张力。
    reason: 保留 μετανοήσουσιν 的语义范围，同时以正文反映其在本段中的常规用法。
  - marker: b
    text: 原文直译为“医治”，以疾病与康复的意象描述上帝对罪的处理。
    reason: 说明正文有意保留 ἰάσεται 的比喻，而未一般化为“赦免”。
lexical_decisions:
- source_word: μετανοήσουσιν
  choice: 必将懊悔
  rationale: 此处将来时表示这些无望之人的灵魂将有悔恨；译作“懊悔”保留其可能指悔悟或悔恨的语义张力，避免直接断定为得救性的“悔改”。
- source_word: αἱ ψυχαὶ αὐτῶν
  choice: 他们的灵魂
  rationale: 按原文保留“灵魂”这一表达及复数领属关系。
- source_word: ἀπηγνώκασι
  choice: 已绝望
  rationale: 该词表示失去希望、陷入绝望；与前面的“没有盼望”形成递进。
- source_word: ἰάσεται
  choice: 会医治
  rationale: 保留原文以医治比喻处理罪的说法，不改写成“赦免”，以免消除其独特意象。
- source_word: ὅλου τοῦ οἴκου σου
  choice: 你全家
  rationale: οἶκος 在此自然指整个家户；现代汉语以“全家”表达最清楚。
- source_word: πάντων τῶν ἁγίων
  choice: 所有圣徒
  rationale: 保留早期基督教语境中“圣徒”对神圣群体成员的称呼，不限定为后世受封圣者。
theological_decisions:
- issue: μετανοήσουσιν 是悔改还是懊悔
  choice: 必将懊悔
  alternative: 必将悔改
  rationale: 上下文称他们没有盼望并已绝望，语气可能是将来的悔恨，也可能含悔悟义；正文采用较不预断最终结局的“懊悔”，并以脚注保存歧义。
- issue: 上帝“医治”罪的含义
  choice: 保留“医治”
  alternative: 赦免／除去
  rationale: ἰάσεται 明确采用医治意象；不应以系统神学术语替换，从而避免把医治、赦免和除罪之间的关系提前定死。
- issue: 为全家和所有圣徒之罪祷告
  choice: 照原文保留群体范围
  alternative: 把动词仅解释为医治赫马个人的罪
  rationale: 句法将“你的罪”“你全家的罪”“所有圣徒的罪”并列作为医治所涉及的对象；译文不另行限定其代祷或救恩机制。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以破折号呈现 οἵτινες 引出的说明，以“不过，你要……”表现 ἀλλὰ σὺ 的转折和强调；保留“灵魂”“医治罪”“圣徒”等源文本关键表达。
