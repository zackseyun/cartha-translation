base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/001.yaml
  text: '"Did I speak? Did I not always regard you as a goddess? Did I not always respect you as a sister? Why do you falsely accuse me, woman, of these wicked and unclean things?"'
translation:
  language: zh_hans
  text: “我说过吗？我不是一直把你看作女神吗？不是一直把你当作姊妹般敬重吗？妇人，你为什么拿这些邪恶、污秽的事诬蔑我呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησα
  choice: 我说过吗
  rationale: 保留原文简短反问及其承接上文的语气，不擅自补出所说内容。
- source_word: ὡς θεὰν ἡγησάμην
  choice: 把你看作女神
  rationale: 直译 θεά，保留古代叙事中的强烈敬重表达，不将其神学化或弱化为一般尊称。
- source_word: ἐνετράπην ὡς ἀδελφήν
  choice: 像尊重姊妹一样尊重你
  rationale: ἐντρέπομαι 在此表示敬重、敬畏式的尊重；用自然现代汉语呈现比较结构。
- source_word: καταψεύδῃ
  choice: 诬告我
  rationale: 该词指以虚假之言指控某人；“诬告”简洁传达虚假指控的含义。
- source_word: τὰ πονηρὰ ταῦτα καὶ ἀκάθαρτα
  choice: 这些邪恶、污秽的事
  rationale: 保留两个并列形容词的道德力度，并补“的事”使汉语完整自然。
- source_word: ὦ γύναι
  choice: 妇人
  rationale: 保留直接称呼及较庄重的古典语域；避免现代口语“女人”可能带来的贬斥色彩。
theological_decisions:
- issue: “把你看作女神”的宗教含义
  choice: 按原文保留“女神”
  alternative: 译作“像女神一样敬重你”或“把你看得极其尊贵”
  rationale: 原文明确使用 θεά；此处是人物为自身态度辩解，不应通过弱化措辞预先消解其可能产生的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。连续反问保持辩解和震惊的语气；“姊妹”与早期基督教文献语域相称。
