  text: '"You will live," he says, "if you keep my commandments and walk in them; and whoever, having heard these commandments, keeps them, will live to God."'
translation:
  language: zh_hans
  text: 他回答说：“你若遵守我的诫命，行在其中，就必活着；凡听见这些诫命并遵守的人，都必向上帝活着。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζήσῃ / ζήσεται
  choice: 必得生命 / 必……活着
  rationale: 前者用自然汉语表达条件句中的“活、得生”，后者保留原文与“向上帝”相连的措辞及其末世与属灵意味。
- source_word: φυλάξῃ
  choice: 遵守
  rationale: 准确表达谨守、持守诫命并付诸实行的含义。
- source_word: πορευθῇς ἐν αὐταῖς
  choice: 按着这些诫命行
  rationale: 保留“行走”的行为隐喻，同时采用现代汉语中自然且庄重的表达。
- source_word: ζήσεται τῷ Θεῷ
  choice: 必向上帝活着
  rationale: 尽量保留希腊语与格短语的方向、关系或归属张力，不武断改释为单一的“靠上帝活着”或“在上帝面前活着”。
theological_decisions:
- issue: 遵守诫命与生命之间的关系
  choice: 保持原文条件句：“只要……就……”
  alternative: 解释为凭行为赚取永生，或弱化为仅仅证明已有生命
  rationale: 原文直接陈述条件关系，却没有在本句说明其系统神学机制，因此不加入特定宗派解释。
- issue: τῷ Θεῷ 的神学含义
  choice: 译作“向上帝活着”
  alternative: “为上帝而活”“在上帝面前活着”“靠上帝活着”
  rationale: 原文可含关系、指向或归属意味；“向上帝活着”较能保留其简练和一定的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“他说”依上下文明确为“他回答说”；用“诫命”保持早期基督教劝诫文体。未添加原文没有的解释性脚注。
