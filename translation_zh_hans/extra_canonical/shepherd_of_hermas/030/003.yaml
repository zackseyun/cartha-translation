base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/003.yaml
  text: '"For this reason then," I say, "sir, I inquire of you carefully about everything: first, because I am a sinner; then, because I do not know by doing what works I shall live, for my sins are many and manifold."'
translation:
  language: zh_hans
  text: “所以，先生，”我说，“我才向你仔细询问这一切：首先，因为我是个罪人；其次，因为我不知道要做哪些事才能得以存活，因为我的罪既多又各不相同。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξακριβάζομαι
  choice: 仔细询问
  rationale: 此词在这里表示详加查问、力求弄清，译作“仔细询问”自然且保留其认真探究的语气。
- source_word: ποῖα ἔργα ἐργαζόμενος
  choice: 要做哪些事
  rationale: 保留“做何种行为”的含义，同时避免生硬重复“做哪些工作”。
- source_word: ζήσομαι
  choice: 才能得以存活
  rationale: 保留将来时及条件意味，也不预先限定为今生存活、属灵生命或末世得生。
- source_word: πολλαί... καὶ ποικίλαι
  choice: 既多又各不相同
  rationale: 分别表达数量众多与种类繁杂，符合现代汉语表达。
theological_decisions:
- issue: “存活”（ζήσομαι）的含义
  choice: 得以存活
  alternative: 得救／得永生
  rationale: 希腊文本本身未在本句明确界定生命的层面；采用较开放的译法，保留其神学张力，并与下文“向上帝而活”留出关联空间。
- issue: “行为”（ἔργα）与生命的关系
  choice: 要做哪些事才能得以存活
  alternative: 靠什么善行才能得救
  rationale: 按原句呈现赫尔马的疑问，不加入“靠”“善行”或系统化的称义术语，以免替文本解决其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“先生”对应 κύριε 在对受尊敬者的直接称呼中较合适；保留说话者因罪多且繁杂而寻求明确指引的迫切感。
