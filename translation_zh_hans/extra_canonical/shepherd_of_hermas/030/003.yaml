source:
  text: Ἠρώτησα αὐτὸν πάλιν λέγων· Ἐπεὶ ὁ Κύριος ἄξιόν με ἡγήσατο ἵνα μετ᾽ ἐμοῦ πάντοτε κατοικῇς, ὀλίγα μου ῥήματα ἔτι ἀνασχοῦ, ἐπεὶ οὐ συνίω οὐδέν, καὶ ἡ καρδία μου πεπώρωται ἀπὸ τῶν προτέρων μου πράξεων· συνέτισόν με, ὅτι λίαν ἄφρων εἰμὶ καὶ ὅλως οὐθὲν νοῶ. 2. ἀποκριθείς μοι λέγει· Ἐγώ, φησίν, ἐπὶ τῆς μετανοίας εἰμὶ καὶ πᾶσιν τοῖς μετανοοῦσιν σύνεσιν δίδωμι. ἢ οὐ δοκεῖ σοι, φησίν, αὐτὸ τοῦτο τὸ μετανοῆσαι σύνεσιν εἶναι; τὸ μετανοῆσαι, φησί, σύνεσίς ἐστιν μεγάλη. συνίει γὰρ [ὁ ἀνὴρ] ὁ ἁμαρτήσας ὅτι πεποίηκεν τὸ πονηρὸν ἔμπροσθεν τοῦ Κυρίου, καὶ ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτοῦ ἡ πρᾶξις ἣν ἔπραξεν, καὶ μετανοεῖ καὶ οὐκέτι ἐργάζεται τὸ πονηρόν, ἀλλὰ τὸ ἀγαθὸν πολυτελῶς ἐργάζεται, καὶ ταπεινοῖ τὴν ἑαυτοῦ ψυχὴν καὶ βασανίζει, ὅτι ἥμαρτεν. βλέπεις οὖν ὅτι ἡ μετάνοια σύνεσίς ἐστιν μεγάλη. 3. Διὰ τοῦτο οὖν, φημί, κύριε, ἐξακριβάζομαι παρὰ σοῦ πάντα· πρῶτον μὲν ὅτι ἁμαρτωλός εἰμι, εἶτα ἀγνοῶ ποῖα ἔργα ἐργαζόμενος ζήσομαι, ὅτι πολλαί μου εἰσὶν αἱ ἁμαρτίαι καὶ ποικίλαι. 4. Ζήσῃ, φησίν, ἐὰν τὰς ἐντολάς
    μου φυλάξῃς καὶ πορευθῇς ἐν αὐταῖς· καὶ ὃς ἂν ἀκούσας τὰς ἐντολὰς ταύτας φυλάξῃ, ζήσεται τῷ Θεῷ.
