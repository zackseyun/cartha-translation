base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/001.yaml
  text: I asked him again, saying, "Since the Lord has counted me worthy that you should dwell with me always, bear with a few more words from me, since I understand nothing, and my heart has been hardened by my former deeds. Give me understanding, for I am very foolish and altogether perceive nothing."
translation:
  language: zh_hans
  text: 我又问他说：“既然主看我配得让你一直与我同住，就请再容忍我说几句话吧；因为我什么也不明白，而且我的心因从前所做的事已经刚硬了。求你使我明白，因为我十分愚昧，完全不能领悟。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄξιόν με ἡγήσατο
  choice: 看我配得
  rationale: 保留原文“认为／算为配得”的判断意味，同时符合现代汉语表达。
- source_word: πάντοτε κατοικῇς
  choice: 常与我同住
  rationale: κατοικέω 表示居住；译作“同住”保留持续陪伴的具体意象，πάντοτε 译为自然的“常”。
- source_word: ὀλίγα μου ῥήματα ἔτι ἀνασχοῦ
  choice: 请再容忍我说几句话吧
  rationale: ἀνέχομαι 有忍受、容让之意；此处是谦卑地请求对方耐心听他再说几句。
- source_word: οὐ συνίω οὐδέν
  choice: 我什么也不明白
  rationale: 保留双重否定所加强的全然不理解之意，以自然汉语表达。
- source_word: ἡ καρδία μου πεπώρωται
  choice: 我的心……已经刚硬了
  rationale: πωρόω 指使之麻木、顽硬；“心刚硬”既保留圣经语域，也不把含义缩减为单纯迟钝。
- source_word: ἀπὸ τῶν προτέρων μου πράξεων
  choice: 因从前所做的事
  rationale: ἀπό 在此表达成因；πράξεις 泛指行为，不预先添加“罪恶”等解释。
- source_word: συνέτισόν με
  choice: 求你使我明白
  rationale: 使役命令式意为赐予理解、教导明白；此译简洁自然。
- source_word: λίαν ἄφρων
  choice: 十分愚昧
  rationale: 保留说话者强烈的自我评价，且维持庄重语体。
- source_word: ὅλως οὐθὲν νοῶ
  choice: 完全不能领悟
  rationale: 与前句“什么也不明白”形成词汇变化，并传达 νοέω 的理解、领会之意。
theological_decisions:
- issue: 心刚硬与从前行为之间的关系
  choice: 译为“我的心因从前所做的事已经刚硬了”
  alternative: “我的心已经对我从前的行为麻木了”
  rationale: 原文 ἀπό 更自然地表示从前行为导致内心刚硬；不将其解释为对那些行为失去感觉，以免消除原文可能保留的张力。
- issue: “主看我配得”的性质
  choice: 直译为“主看我配得”
  alternative: “主施恩让我”
  rationale: 原文明说 ἄξιον ἡγήσατο，不把“配得”改写为特定恩典论解释，也不暗示此配得的根据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和引语语体；保留《牧人书》近圣经式的“主”“心刚硬”“愚昧”等表达，但避免文言化。
