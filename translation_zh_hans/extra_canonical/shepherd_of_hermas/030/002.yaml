base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/002.yaml
  text: Answering me, he says, "I," he says, "am appointed over repentance, and I give understanding to all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding? To repent," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did rises up in his heart, and he repents and no longer does evil, but does good abundantly, and he humbles his own soul and afflicts it, because he sinned. You see then that repentance is great understanding."
translation:
  language: zh_hans
  text: 他回答我说：“我负责悔改的事，并赐悟性给所有悔改的人。难道你不觉得，悔改这件事本身就是悟性吗？悔改是极大的悟性。因为犯了罪的人明白，自己在主面前做了恶事；他所做的事浮上心头，于是他悔改，不再作恶，反而大大地行善；他又使自己的灵魂谦卑，并因自己犯了罪而折磨它。由此你看，悔改是极大的悟性。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῆς μετανοίας εἰμί
  choice: 我掌管悔改
  rationale: ἐπί加属格在此表示受托负责或主管某事；译作“掌管”自然地表达角色职责，同时不额外指定任命者。
- source_word: μετάνοια / μετανοεῖ
  choice: 悔改／悔改
  rationale: 保留名词与动词的重复和论证主线，既包含认识过错，也由后文具体表现为停止作恶、转而行善。
- source_word: σύνεσις / συνίει
  choice: 悟性／明白
  rationale: σύνεσις指理解和辨识的能力；名词译为“悟性”以维持“悔改就是悟性”的格言式表达，动词按现代汉语译为“明白”。
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: 又浮上心头
  rationale: 贴近“上到他的心中”的意象，并以现代汉语自然表达往事进入意识、受到反省。
- source_word: τὸ ἀγαθὸν πολυτελῶς ἐργάζεται
  choice: 丰丰富富地行善
  rationale: πολυτελῶς通常有丰厚、慷慨、不惜代价之意；此处以“丰丰富富地”保留其强度，避免缩减为普通的“行善”。
- source_word: ταπεινοῖ τὴν ἑαυτοῦ ψυχὴν καὶ βασανίζει
  choice: 使自己的心灵谦卑下来，并……使它受苦
  rationale: 保留两个及物动作及共同宾语ψυχή，不把较强的βασανίζει淡化为单纯“难过”。
theological_decisions:
- issue: 悔改与悟性的关系
  choice: 直译为“悔改这件事本身就是悟性”“悔改是极大的悟性”
  alternative: 解释为“悔改是明智之举”
  rationale: 原文作本体式陈述，并借同词根σύνεσις／συνίει展开论证；不将其降格为实用性的评价。
- issue: “在主面前”所表达的罪责
  choice: 自己在主面前做了恶事
  alternative: 自己得罪了主
  rationale: 保留原文ἐνώπιον τοῦ Κυρίου的法庭性或临在性空间表达，不把它解释成另一种虽相关但不同的措辞。
- issue: 悔改者使心灵受苦
  choice: 保留为“使它受苦”
  alternative: 译为“因罪深感痛苦”或加入苦修含义
  rationale: 既不削弱βασανίζει的力度，也不据此导入特定的苦修、补赎或惩罚教义。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。保留原文反复强调“悔改”“悟性”的修辞，但省去多次插入的“他说”，以免中文生硬；对话身份和论证层次仍清晰。译文严格限定在用户指定的30:2。
