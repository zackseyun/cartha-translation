base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/003.yaml
  text: 5. Again we went on a little, and he shows me a great shepherd, savage in appearance, wearing a white goatskin, and he had a bag on his shoulders, and a very hard staff with knots, and a great whip. He had a very harsh look, so that I was afraid of him—such was his look.
translation:
  language: zh_hans
  text: 5. 我们又往前走了一小段，他便指给我看一个身材高大的牧人，外貌显得凶野，身披一张白山羊皮，肩上背着一个袋子，手里拿着一根极其坚硬、带有木瘤的杖和一条大鞭子。他的目光十分凶厉，以致我害怕他；他的目光就是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα μέγαν
  choice: 一个高大的牧人
  rationale: μέγαν在人物外观描写中可指身形高大；译为“高大的”比泛泛的“伟大的”更符合场景。
- source_word: ὡσεὶ ἄγριον τῇ ἰδέᾳ
  choice: 外貌仿佛野蛮凶悍
  rationale: 保留ὡσεὶ“仿佛”的近似语气；ἄγριος兼有野性、粗暴和凶猛之意，以“野蛮凶悍”传达其令人畏惧的外观。
- source_word: περικείμενον δέρμα αἴγειον λευκόν
  choice: 身披一张白山羊皮
  rationale: 按字面保留衣着材质和颜色；“身披”符合περίκειμαι表示穿戴、披挂之义。
- source_word: πήραν
  choice: 袋子
  rationale: 指旅人或牧人随身携带的袋囊；“袋子”自然易懂，不额外限定其用途。
- source_word: ῥάβδον σκληρὰν λίαν καὶ ὄζους ἔχουσαν
  choice: 一根极其坚硬、带有节疤的杖
  rationale: ῥάβδος译为“杖”；ὄζοι可指木杖上的节或瘤，以“节疤”保留粗硬不平的形象。
- source_word: μάστιγα μεγάλην
  choice: 一条长鞭
  rationale: μέγας修饰鞭子可表示尺寸大；现代汉语用“长鞭”较自然，也符合后文用于抽打的形象。
- source_word: τὸ βλέμμα εἶχε περίπικρον
  choice: 他的目光十分凶厉
  rationale: περίπικρος为强化的“严酷、苦厉”；“凶厉”自然传达其令人恐惧的眼神，而不将其解释为情绪或道德品质。
theological_decisions:
- issue: 牧人的身份与象征意义
  choice: 只按本节视觉描写译为“牧人”，不在正文中说明其象征身份
  alternative: 将其解释性地译为惩罚者、刑罚天使或苦难的象征
  rationale: 本读者段落尚未明说其身份；保持叙事张力，避免把后文解释或特定神学理解提前写入正文。
- issue: 凶厉形象是否含道德评判
  choice: 使用外貌与目光层面的描述，不称其为“邪恶”
  alternative: 译为“邪恶的牧人”或“恶魔般的牧人”
  rationale: 原文描写其ἄγριος和περίπικρος的外观与目光，并未在此断定其道德邪恶。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。保留原文重复强调目光的句式，但用分号使中文流畅；不添加原文没有的解释性称号。
