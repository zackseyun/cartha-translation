  text: And he says to me, “Do you see this shepherd?” “I do,” I say, “sir.”
translation:
  language: zh_hans
  text: 他问我：“你看见这个牧人吗？”我说：“看见了，先生。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα
  choice: 牧人
  rationale: 保留原文牧羊意象；现代汉语中自然、庄重，也与本书上下文相符。
- source_word: κύριε
  choice: 先生
  rationale: 此处是对异象中说话者的尊称，并非明确的神圣称号；译作“先生”可避免不必要地理解为“主”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事对话。将历史现在时 λέγει、φημί 统一按汉语叙事习惯译为“问”“说”；λέγει 的语用功能在此是发问，因此译作“问我”比机械译作“对我说”更自然。
