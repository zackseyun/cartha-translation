base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/002.yaml
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been corrupted from the truth; in them there is hope of repentance, by which they can live. Corruption, then, has hope of a certain renewal, but death has eternal destruction.”
translation:
  language: zh_hans
  text: “你所看见的那些羊，并不蹦跳，只在一处吃草，就是那些任凭自己沉溺于享乐和欺骗之中的人；然而，他们丝毫没有亵渎主。因此，他们已经偏离真理，败坏了；但他们仍有悔改的希望，借着悔改可以得生命。所以，败坏尚有某种更新的希望，死亡却带来永远的灭亡。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ σκιρτῶντα
  choice: 并不蹦跳
  rationale: 保留羊群动作的具体意象，并与后文只在一处吃草形成对照。
- source_word: παραδεδωκότες ἑαυτοὺς
  choice: 任凭自己沉溺于
  rationale: 表达主动把自己交付给某种生活方式的含义，同时符合现代汉语表达。
- source_word: τρυφαῖς
  choice: 享乐
  rationale: 指奢逸、纵情享受；译作“享乐”自然且不过度收窄含义。
- source_word: ἀπάταις
  choice: 欺骗
  rationale: 保留该词可指欺诈或迷惑性事物的基本语义，不擅自解释其具体所指。
- source_word: κατεφθαρμένοι ... ἀπὸ τῆς ἀληθείας
  choice: 偏离真理，败坏了
  rationale: 兼顾完成时被动所表达的败坏状态，以及ἀπό所体现的与真理分离；避免生硬的“从真理败坏”。
- source_word: μετανοίας
  choice: 悔改
  rationale: 采用早期基督教语境中通行而准确的汉语表达，兼含思想与生活方向的转变。
- source_word: ζῆσαι
  choice: 得生命
  rationale: 在救赎性语境中不仅表示继续存活，也指进入生命；“得生命”保留这种张力。
- source_word: ἀνανεώσεώς τινος
  choice: 某种更新
  rationale: 保留τινος带来的不确定或限定语气，不将更新的性质解释得过满。
- source_word: ἀπώλειαν ... αἰώνιον
  choice: 永远的灭亡
  rationale: 准确传达持续或终极性的毁灭结局，并与前面的“得生命”构成对照。
theological_decisions:
- issue: 败坏者是否仍可能悔改得生命
  choice: 明确保留“仍有悔改的希望，借着悔改可以得生命”
  alternative: 将其解释为已经获得赦免或必然得救
  rationale: 原文只陈述希望与可能性，没有断言悔改已经发生或结局已获保证。
- issue: “败坏”与“死亡”的关系
  choice: 保留二者的层级对照：败坏尚可更新，死亡则归于永远灭亡
  alternative: 把二者视为完全同义，或将“死亡”直接解释为某一特定教义术语
  rationale: 原文刻意形成καταφθορά与θάνατος的对比，应保留其神学张力而不作宗派化界定。
- issue: “没有亵渎主”的程度
  choice: 译作“丝毫没有亵渎主”
  alternative: 弱化为“没有严重亵渎主”
  rationale: οὐδέν在此具有全面否定作用，原文没有按严重程度加以限定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留牧羊意象及“败坏—更新／死亡—灭亡”的平行对照；句式适度调整，使口语引述自然，但不消解原文的末世与悔改张力。
