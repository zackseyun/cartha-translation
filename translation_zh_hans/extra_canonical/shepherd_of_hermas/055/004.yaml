base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/004.yaml
  text: 6. This shepherd, then, took over the sheep from the shepherd who was a young man—those that were living wastefully and self-indulgently, but not skipping—and he cast them into a certain steep, thorny place full of thistles, so that, because of the thorns and thistles, the sheep were unable to disentangle themselves, but [were entangled in the thorns and thistles; these, then,] being entangled, grazed among the thorns and thistles. They suffered greatly, being torn by him; he drove them here and there and gave them no rest, and those sheep were not at all steady.
translation:
  language: zh_hans
  text: 于是，这牧人从那个年轻的牧人手中接过那些挥霍享乐、却不蹦跳的羊，把它们赶到一处陡峭、满是荆棘和蒺藜的地方，以致羊无法从荆棘和蒺藜中挣脱出来，[a]它们就这样缠在荆棘和蒺藜中，在其中吃草。它们受他鞭打，极其痛苦；他把它们赶来赶去，不让它们歇息。那些羊一点也站立不稳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 底本文在此将“却缠在荆棘和蒺藜中；这些羊就这样”置于方括号内，表示这段文字的传承或原文界定存在不确定性。
    reason: 保留所给希腊底本的方括号标记，说明文本不确定性，但不作超出所给底本证据的具体抄本判断。
lexical_decisions:
- source_word: σπαταλῶντα καὶ τρυφῶντα
  choice: 挥霍享乐
  rationale: 分别传达σπαταλάω所含的奢侈挥霍、放纵生活，以及τρυφάω所含的贪图安逸享乐；中文合并成自然而有力度的短语。
- source_word: μὴ σκιρτῶντα
  choice: 却不蹦跳
  rationale: 保留牧羊图景中的具体动作，并维持本段与上文对羊群类别的对应，不把其象征意义直接解释进正文。
- source_word: τόπον κρημνώδη καὶ ἀκανθώδη καὶ τριβολώδη
  choice: 一处陡峭、长满荆棘和蒺藜的地方
  rationale: κρημνώδη指险峻陡峭；ἄκανθα与τρίβολος分别译作荆棘、蒺藜，以保留原文并列意象。
- source_word: ἐταλαιπώρουν
  choice: 受尽了苦
  rationale: 表达持续遭受困苦的状态，符合上下文中被困、被打、不得休息的连续折磨。
- source_word: δαιρόμενα ὑπ' αὐτοῦ
  choice: 被他抽打
  rationale: δαίρω在此指击打、鞭打；结合前文牧人持有大鞭，译为“抽打”自然明确。
- source_word: οὐκ εὐσταθοῦσαν
  choice: 始终站立不稳
  rationale: 保留εὐσταθέω关于站稳、安定的具象含义，也容纳其所暗示的不得安宁，而不单纯意译成“不得安生”。
theological_decisions:
- issue: 受罚羊群的道德状态
  choice: 保留“挥霍享乐、却不蹦跳”的比喻性分类
  alternative: 将其解释为“沉迷享乐但未亵渎主的人”
  rationale: 本节只延续前文的羊群描写；不把前文解释性对应直接嵌入本段，以免消除叙事与解释之间的层次。
- issue: 牧人施加痛苦的性质
  choice: 按原文直译其抽打、驱赶和不给休息
  alternative: 明确称为神的惩戒或管教
  rationale: 原文此处尚以牧羊场景叙述，没有直接说明牧人的神学身份；保留张力，避免先行作教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留羊群、荆棘、蒺藜、抽打等具体意象，不提前解释其寓意；句式适度拆分，以符合现代汉语阅读节奏。
