  source_fidelity: 草稿整体准确传达了黑、火与血、金色部分以及炼金的比喻。但“成为建造那座塔可用的材料”把χρήσιμοι（有用、合用）误译为人本身成为“材料”；原文是说他们对于建造塔有用。另，“坚持下来、经受烈火熬炼”比原文“留下来、被它烧灼／炼净”更具解释性，宜保留原文较简略的表述及代词所指的开放性。
  naturalness: 中文总体自然、庄重。将“火红如血，是表示”调整为“那如火、血红的部分，表示”可更清楚地反映颜色部分的并列。把末句改作“对建造那座塔有用”既自然又避免“材料”的误导。
  terminology: “试炼”“洁净”“渣滓”“那座塔”均恰当。保留“逃脱了这个世界”以对应ἐκφυγόντες；不把它解释为离世或特定禁欲实践。“在其中”仍须以脚注说明其希腊文先行词不明及存疑异文。
