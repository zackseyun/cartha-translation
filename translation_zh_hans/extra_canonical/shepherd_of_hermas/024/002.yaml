revisions:
- from: 她说：“你听：黑色就是你们所居住的这个世界。火红如血，是表示这个世界必经血与火而毁灭。金色的部分就是你们这些已经逃离这世界的人。金子怎样经火试炼而成为有用之物，你们也照样在这些事中受试炼[a]。所以，凡坚持下来、经受烈火熬炼的人，都必得洁净。金子怎样除去渣滓，你们也要照样除去一切忧愁和困苦，得以洁净，成为建造那座塔可用的材料。”
  to: 她说：“你听：黑色就是你们所居住的这个世界。那如火、血红的部分，表示这个世界必因血和火而毁灭。金色的部分就是你们这些已经逃脱这个世界的人。正如金子经过火的试验，便成为有用的，你们也同样在其中受试炼[a]。因此，那些留下来、受它烧炼的人必得洁净。正如金子除去自己的渣滓，你们也要除去一切忧愁和困苦，得以洁净，并且对建造那座塔有用。”
  rationale: 修订纠正了将“有用”误作“可用的材料”的词义偏移，并减少对“留下来”和“被它烧炼”的解释性扩展。颜色、血与火的末世意象、逃脱世界、试炼、洁净与建塔的关联均按原文保留；文本存疑处继续以脚注标明。
