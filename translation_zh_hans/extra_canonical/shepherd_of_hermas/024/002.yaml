base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/002.yaml
  text: 'She says, "Listen: the black is this world, in which you dwell. And the fiery and blood-red is because this world must be destroyed by blood and fire. But the golden portion is you who have escaped this world. For just as gold is tested by fire and becomes useful, so also you are being tested in them. Therefore, those who remain and are burned by it will be purified. Just as gold casts off its dross, so also you will cast off every grief and distress, and you will be purified and will be useful for the building of the tower.'
translation:
  language: zh_hans
  text: 她说：“你听：黑色就是你们所居住的这个世界。那如火、血红的部分，表示这个世界必因血和火而毁灭。金色的部分就是你们这些已经逃脱这个世界的人。正如金子经过火的试验，便成为有用的，你们也同样在其中受试炼[a]。因此，那些留下来、受它烧炼的人必得洁净。正如金子除去自己的渣滓，你们也要除去一切忧愁和困苦，得以洁净，并且对建造那座塔有用。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在其中”所指并不明确；有些抄本在这里另有“居住的人”等字样，所给底本以方括号标示，显示该处文本存疑。
    reason: ἐν αὐτοῖς的先行词含混，且οἱ κατοικοῦντες在所给底本中以方括号标示。脚注保留文本问题，不武断补足。
lexical_decisions:
- source_word: πυροειδὲς καὶ αἱματῶδες
  choice: 火红如血
  rationale: 兼顾颜色意象与自然汉语；原文分别表达“如火”和“血色”，不把它抽象化为灾难本身。
- source_word: ἀπόλλυσθαι
  choice: 毁灭
  rationale: 准确传达被毁坏、灭亡之意，并保留原文对这个世界终局的强烈表述。
- source_word: ἐκφυγόντες
  choice: 已经逃离
  rationale: 保留完成性和脱逃意味，不弱化为仅仅“远离”或“弃绝”。
- source_word: δοκιμάζεται / δοκιμάζεσθε
  choice: 试炼／受试炼
  rationale: 同一词根前后对应，既可包含检验，也符合火炼金子的语境。
- source_word: εὔχρηστον / χρήσιμοι
  choice: 成为有用之物／成为……可用的材料
  rationale: 维持两处“有用、合用”的词义呼应，并在建塔语境中采用自然表达。
- source_word: σκωρίαν
  choice: 渣滓
  rationale: 指金属冶炼中被除去的杂质，现代读者易懂且保留比喻。
- source_word: οἰκοδομὴν τοῦ πύργου
  choice: 建造那座塔
  rationale: 直接保留《牧人书》中塔的核心象征，不在正文中解释其神学所指。
theological_decisions:
- issue: “逃离这世界”的含义
  choice: 直译为“已经逃离这世界”，不解释为肉身离世、殉道或特定形式的禁欲
  alternative: 译作“脱离世俗”或“离开人世”
  rationale: 原文表述具有象征性，与金色部分及试炼相连；加入具体教义解释会缩窄其开放性。
- issue: 世界“必经血与火而毁灭”
  choice: 保留原文的必然语气和血、火意象
  alternative: 弱化为“将遭受战争和灾难”
  rationale: 原文没有明确把血与火限定为某类历史事件，故不作解释性归类。
- issue: 火炼与洁净的关系
  choice: 保留坚持、熬炼、洁净及参与建塔之间的递进
  alternative: 明确解释为得救条件或成圣阶段
  rationale: 文本呈现强烈劝勉与象征性因果，但未在本句系统界定救恩论关系，应保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。颜色用“黑色、火红如血、金色”保持视觉连贯；炼金比喻使用“试炼、熬炼、渣滓、洁净”等普通读者熟悉的词。直接引语沿用中文标点，并以“她说”承接上文。
