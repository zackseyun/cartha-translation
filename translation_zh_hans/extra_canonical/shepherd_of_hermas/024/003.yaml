base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/003.yaml
  text: '"But the white portion is the age that is coming, in which the elect of God will dwell; because those chosen by God for eternal life will be spotless and pure.'
translation:
  language: zh_hans
  text: “白色的部分则是那将要来临的世代；上帝所拣选的人要住在其中，因为蒙上帝拣选得永生的人必毫无玷污、纯洁无瑕。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ λευκὸν μέρος
  choice: 白色的部分
  rationale: 保留异象中兽头四种颜色之一的具体指称，并与上下文的颜色象征相衔接。
- source_word: ὁ αἰὼν ὁ ἐπερχόμενος
  choice: 那将要来临的世代
  rationale: αἰών在此指与现今世界相对的未来时代；译作“世代”可保留其末世性而不缩减为单纯时间长度。
- source_word: οἱ ἐκλεκτοὶ τοῦ θεοῦ
  choice: 上帝所拣选的人
  rationale: 用自然现代汉语表达“上帝的选民”，同时保留神主动拣选的含义。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 得永生
  rationale: 此处εἰς表达拣选所指向的归宿或目的；“得永生”简洁自然，且不额外规定拣选与永生之间更细的教义机制。
- source_word: ἄσπιλοι καὶ καθαροί
  choice: 毫无玷污、纯洁无瑕
  rationale: 分别传达ἄσπιλοι的无污点与καθαροί的洁净，保留两个并列形容词的强调。
theological_decisions:
- issue: “蒙拣选得永生”的语义关系
  choice: 蒙上帝拣选得永生的人
  alternative: 被上帝拣选进入永生的人
  rationale: 保留εἰς ζωὴν αἰώνιον所表示的趋向或目的，同时避免加入关于预定次序或得救机制的宗派性阐释。
- issue: 未来世代中选民的纯洁状态
  choice: 必毫无玷污、纯洁无瑕
  alternative: 是毫无玷污、纯洁的
  rationale: 希腊文使用将来时ἔσονται，与“将要来临的世代”一致，因此明确译出未来状态。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话；保留异象解释的象征性和末世张力，不增添教派术语。
