base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/005.yaml
  text: Having said these things, she went away, and I did not see to what place she went; for a noise occurred. And I turned around in fear, thinking that the beast was coming.
translation:
  language: zh_hans
  text: 她说完这些话，就离开了；我没有看见她往什么地方去了，因为响起一阵声响。我因害怕转过身来，以为那兽要来了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 离开了
  rationale: 自然表达人物离去，同时不擅自补明目的地或方式。
- source_word: ποίῳ τόπῳ ἀπῆλθεν
  choice: 她去了什么地方
  rationale: 保留原文对去处的疑问，不将其强化为神秘消失。
- source_word: ψόφος
  choice: 一阵声响
  rationale: 该词泛指响声或动静，原文未说明来源与性质，因此采用中性译法。
- source_word: ἐπεστράφην εἰς τὰ ὀπίσω
  choice: 转身往后看
  rationale: 按语境传达朝身后转去的动作；补出“看”使现代汉语自然，但不增加新的对象。
- source_word: τὸ θηρίον
  choice: 那兽
  rationale: 沿用本异象中已出现的特指动物形象；“兽”比“野兽”更简洁，也适合异象叙事。
theological_decisions: []
