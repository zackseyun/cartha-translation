  source_fidelity: 草稿整体忠实于希腊文及英文审计文本：人物离去、去向未见、声响来源不明、叙述者因惧怕转身并误以为兽将至，均得到保留。不过，“忽然”并非原文ψόφος ἐγένετο所明示；末句“那兽来了”将原文现在时ἔρχεται（正来／将来）译成既成事实，宜修正。
  naturalness: 译文通顺，叙事语体自然。将“我害怕地转身往后看”调整为“我因害怕转过身来”可更贴近原文动作，且避免把“转身”明确扩展为“看”。
  terminology: “那兽”恰当地维持本异象中已知、特指的θηρίον，简洁并符合庄重叙事语境。无需增设术语注释。
