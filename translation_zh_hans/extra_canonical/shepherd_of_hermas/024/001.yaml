base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/001.yaml
  text: I asked her about the four colors that the beast had on its head. But she answered me and says, "Again you are curious about such matters." "Yes, my Lady," I say; "make known to me what these things are."
translation:
  language: zh_hans
  text: 我问她，那兽头上的四种颜色是怎么回事。她回答我说：“你又来探究这类事情了。”我说：“是的，夫人，请告诉我这些是什么。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠρώτησα
  choice: 我问
  rationale: 直译叙事动词，符合现代汉语自然表达。
- source_word: θηρίον
  choice: 兽
  rationale: 保留异象文学中带有威胁性的动物称谓，不具体化为某种野兽。
- source_word: εἰς τὴν κεφαλήν
  choice: 头上
  rationale: 按希腊语语境表达颜色所在的位置，现代汉语简洁自然。
- source_word: περίεργος
  choice: 好奇
  rationale: 此处指对这类奥秘追问探究；“好奇”既保留轻微责备语气，也不夸大为贬义的“多管闲事”。
- source_word: κυρία
  choice: 夫人
  rationale: 保留尊称及阴性受话者身份；比“女士”更适合古代庄重语境。
- source_word: γνώρισόν μοι
  choice: 请告诉我
  rationale: 表达使对方知晓、解释给对方听的意思，避免生硬的“使我知道”。
- source_word: τί ἐστιν ταῦτα
  choice: 这些是什么意思
  rationale: 根据上下文译出四种颜色所代表的含义，而非仅作字面的“这些是什么”。
theological_decisions:
- issue: 异象中四种颜色的象征意义是否在本段提前说明
  choice: 不提前解释，仅保留赫尔马的询问
  alternative: 将后文关于世界、火与血、信徒及来世的解释并入本段
  rationale: 当前读者分段只对应24:1；应维持叙事推进，不用后文消解此刻尚存的悬念。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。对话使用自然汉语，并保留“夫人”这一恭敬称呼。原文λέγει与φημί为历史现在时；汉语不机械标示时态，而以“说”呈现现场感。
