base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/004.yaml
  text: '"You, therefore, do not cease speaking in the ears of the holy ones. You also have the pattern of the great tribulation that is coming; but if you are willing, it will be nothing. Remember the things written beforehand."'
translation:
  language: zh_hans
  text: 所以，你不要停止讲给圣徒们听。你们也有那将要来到的大患难的预表；但你们若愿意，它就算不得什么。要记住先前所写下的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλίπῃς λαλῶν εἰς τὰ ὦτα
  choice: 不要停止向……耳中讲说
  rationale: 保留原文生动的身体意象及持续讲说的语气，同时使汉语可懂。
- source_word: ἁγίων
  choice: 众圣徒
  rationale: 按早期基督教常用义，指分别为圣的信徒群体；“众”体现复数。
- source_word: τύπον
  choice: 预象
  rationale: 此处指先行显明、可供认识将来事件的象征性样式；结合异象语境，“预象”比单纯“榜样”更贴切。
- source_word: θλίψεως
  choice: 患难
  rationale: 涵盖压迫、困苦和灾难，符合末世性语境，又不把含义限缩为某一种迫害。
- source_word: οὐδὲν ἔσται
  choice: 它就算不得什么
  rationale: 保留原文强烈而简略的表达，理解为患难对愿意顺从者不能构成决定性伤害，而不擅自解释为患难不会发生。
- source_word: τὰ προγεγραμμένα
  choice: 先前所写的话
  rationale: 直译其“预先/先前写下之事”的含义，并保留究竟指此前警告还是更早书面内容的开放性。
theological_decisions:
- issue: “你们若愿意，它就什么也不是”的含义
  choice: 但你们若愿意，它就算不得什么
  alternative: 但你们若愿意，这患难就不会发生
  rationale: 原文并未明确说患难将被取消；所选译法保留其修辞张力，避免加入关于患难是否发生的确定教义判断。
- issue: τύπος与将来大患难的关系
  choice: 大患难的预象
  alternative: 大患难的榜样／模型
  rationale: 上下文中的怪兽异象预示将来的患难；“预象”既表达对应关系，也不把它解释成完全等同的预言细节。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。“向……耳中讲说”有意保留希腊文较具体的表达；单复数转换依原文保留：先对赫尔马个人说“你”，随后转向群体“你们”。
