base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/002.yaml
  text: But the Lord’s abundant compassion has had mercy on you and your household, and he will strengthen you and establish you in his glory. Only do not be slothful, but take heart and strengthen your household. For, as the blacksmith hammering his work masters the thing he intends, so also the righteous word spoken daily prevails over every wickedness. Do not, therefore, cease admonishing your children; for I know that if they repent with their whole heart, they will be written in the books of life with the holy ones.
translation:
  language: zh_hans
  text: 但主满有怜悯，已经怜悯了你和你一家；他必使你刚强，并在他的荣耀中坚立你。你只要不可懈怠，却要振作起来，使你一家刚强。因为，正如铁匠锤打自己的活计，终能完成自己所要做的事；照样，每日所说的公义之言也能胜过一切邪恶。所以，不要停止劝诫你的儿女；我知道，他们若全心悔改，就必与众圣徒一同被记在生命册上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命册”原文为复数，直译作“生命的书卷”。
    reason: 保留希腊文βίβλους的复数这一文本细节，同时避免正文出现不自然的汉语。
lexical_decisions:
- source_word: ἡ πολυσπλαγχνία τοῦ Κυρίου
  choice: 主以丰盛的怜悯
  rationale: πολυσπλαγχνία表示深厚、丰盛的慈悲怜悯；采用自然的现代汉语表达，同时保留其强调程度。
- source_word: τὸν οἶκόν σου
  choice: 你一家
  rationale: οἶκος在此指家庭成员或家属，而非房屋建筑；“你一家”比“你的家”更清楚自然。
- source_word: ἰσχυροποιήσει / ἰσχυροποίει
  choice: 使……刚强
  rationale: 保留同一希腊词在神使赫尔马刚强及赫尔马使家人刚强两处的词汇呼应。
- source_word: θεμελιώσει
  choice: 根基稳固
  rationale: 保留“奠基、建立稳固”的形象，又符合现代汉语搭配。
- source_word: εὐψύχει
  choice: 振作起来
  rationale: 表达鼓起勇气、振奋精神之意，语气直接而自然。
- source_word: ὁ χαλκεὺς
  choice: 铁匠
  rationale: χαλκεύς可泛指金属匠；上下文强调锤打，汉语“铁匠”最直观，但不把比喻重点放在具体金属上。
- source_word: περιγίνεται
  choice: 终能制成；能胜过
  rationale: 该动词在比喻两半重复，含取得优势、达到所求结果之意；根据不同宾语分别自然表达，同时保留成功克服的共同语义。
- source_word: ὁ λόγος ὁ καθημερινὸς ὁ δίκαιος
  choice: 日日所讲的正直之言
  rationale: 保留“每日”“正直/公义”和“话语”三项信息；“所讲的”结合下文持续劝诫儿女的语境。
- source_word: ἐγγραφήσονται εἰς τὰς βίβλους τῆς ζωῆς
  choice: 被记在生命册上
  rationale: βίβλοι为复数，直译是“生命的众书卷”；正文采用汉语宗教语境中自然的“生命册”，并以脚注注明复数形式。
- source_word: μετὰ τῶν ἁγίων
  choice: 与众圣徒一同
  rationale: οἱ ἅγιοι在此指属神的圣洁之民；“众圣徒”庄重简洁，不限定其具体身份。
theological_decisions:
- issue: 神的荣耀与坚立的关系
  choice: 使你在他的荣耀中根基稳固
  alternative: 在荣耀中坚立你／使你建立在他的荣耀里
  rationale: ἐν τῇ δόξῃ αὐτοῦ可修饰“坚立”，但“在他的荣耀中”的确切神学关系并未展开；译文保留介词结构，不解释为分享荣耀、进入荣耀或荣耀归神。
- issue: 每日正直之言的效力
  choice: 能胜过一切邪恶
  alternative: 必克服一切邪恶／胜过各样恶事
  rationale: 原文以锻工比喻持续劝诫的效力；译文保留其强烈陈述，却不将“话语”专门解释为圣经、福音或某种教义公式。
- issue: 悔改与生命册
  choice: 他们若全心悔改，就必……被记在生命册上
  alternative: 若全心悔改，名字就会载入生命书卷
  rationale: 忠实保留原文的条件句与将来被动语态，不另行解释记名的机制、时间或救恩次序。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留劝诫语气、铁匠锤打的比喻及关键词的重复呼应；避免过度古雅表达，也不加入特定宗派对荣耀、悔改或生命册的解释。
