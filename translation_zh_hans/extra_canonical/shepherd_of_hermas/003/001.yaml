base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/001.yaml
  text: But it is not for this that God is angry with you, but so that you may turn back your household, which has sinned against the Lord and against us, their parents. Yet, being fond of your children, you did not admonish your household, but you let it be grievously ruined; for this the Lord is angry with you. But he will heal all the past evils in your household; for because of their sins and lawless deeds you yourself were ruined by worldly affairs.
translation:
  language: zh_hans
  text: 但上帝向你发怒，并不是为这事，而是要你使你那得罪主和我们这些作他们父母的人的家人回转归正。可是，你因疼爱儿女，没有劝诫你的家人，反倒任凭他们严重败坏；因此，主向你发怒。不过，他必医治你家中先前发生的一切祸患；因为他们的罪和不法行为，你自己也被日常生活的事务拖垮了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψῃς
  choice: 使……回转
  rationale: 保留及物语态及悔改、归回的宗教含义；不擅自补明回转所归向的对象。
- source_word: οἶκόν σου
  choice: 你的家人／家中
  rationale: 此处指家庭成员这一整体，而非房屋；后文按汉语语境分别译作“家人”和“家中”。
- source_word: φιλότεκνος
  choice: 疼爱儿女
  rationale: 表达对儿女深切爱护的本义，同时保留上下文所指出的溺爱倾向，但不直接译成带有额外判断的“溺爱”。
- source_word: ἐνουθέτεις
  choice: 劝诫
  rationale: 兼顾教导、提醒和规劝之意，语体庄重而自然。
- source_word: καταφθαρῆναι δεινῶς
  choice: 严重败坏
  rationale: 保留强烈程度及道德、处境全面败坏的开放性，避免过度限定为“灭亡”。
- source_word: ἰάσεται
  choice: 医治
  rationale: 保留原文治疗隐喻，不弱化为一般性的“纠正”或“消除”。
- source_word: βιωτικῶν πράξεων
  choice: 世俗事务
  rationale: 指今世生活及谋生方面的事务；不窄化为商业活动或财产。
- source_word: κατεφθάρης
  choice: 遭受了损害
  rationale: 与前面的同根动词形成语义呼应，同时在此处保留其可能涉及生活境况受毁损的宽泛含义。
theological_decisions:
- issue: 上帝发怒的目的性表达
  choice: “不是因为这件事本身，而是要你……”
  alternative: “上帝不是为此向你发怒，而是为了让你……”
  rationale: ἵνα 引出目的；补入“本身”仅用于使汉语对比清楚，避免误读为上帝发怒的对象发生转换。
- issue: “得罪我们这些作父母的”中的说话者范围
  choice: 保留第一人称复数“我们这些作父母的”
  alternative: 改作“得罪你们这些作父母的”或“得罪他们的父母”
  rationale: 希腊文明确为 εἰς ἡμᾶς τοὺς γονεῖς αὐτῶν。虽然叙事身份带来张力，仍应保存文本所见读法，不以解释性改写消除。
- issue: 家庭罪行与赫尔马所受损害之间的因果关系
  choice: 直译为“因为他们的罪和不法行为，你自己也……遭受了损害”
  alternative: 弱化为“他们的罪使你受到牵连”
  rationale: 保留 διὰ 的明确因果陈述及原文的神学张力，不另行解释责任如何归属。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以原文第一段为翻译范围；保持责备、管教与应许医治之间的张力。未设置脚注，因此正文无脚注标记。
