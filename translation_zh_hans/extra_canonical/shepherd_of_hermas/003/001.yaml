revisions:
- from: 但上帝向你发怒，并不是因为这件事本身，而是要你使自己的家人回转；他们得罪了主，也得罪了我们这些作父母的。可是，你因疼爱儿女，没有劝诫家人，反倒任凭他们严重败坏。因此，主向你发怒。不过，他必医治你家中从前所发生的一切恶事；因为他们的罪和不法行为，你自己也在世俗事务上遭受了损害。
  to: 但上帝向你发怒，并不是为这事，而是要你使你那得罪主和我们这些作他们父母的人的家人回转归正。可是，你因疼爱儿女，没有劝诫你的家人，反倒任凭他们严重败坏；因此，主向你发怒。不过，他必医治你家中先前发生的一切祸患；因为他们的罪和不法行为，你自己也被日常生活的事务拖垮了。
  rationale: 修订维持原文的责备与医治应许，并保留“我们这些作他们父母的人”这一叙事上不寻常的第一人称复数，不作身份协调式改写。将“回转”调整为“回转归正”，以使中文表达完整，但不擅自指定为某一教派性的悔改公式；末句加强“被拖垮”以反映原文的严重性，同时保留其与日常生活事务关联的开放性。
