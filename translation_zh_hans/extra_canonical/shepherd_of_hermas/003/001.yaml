review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确传达责备、家庭成员的罪、不加劝诫、主的愤怒、医治和因果关系。但“使自己的家人回转”在汉语中未交代其宗教性的归回方向，也未充分承接“得罪主和我们这些作他们父母的人”的限定；“遭受了损害”则弱化了 κατεφθάρης 所表达的被严重毁损、拖垮之意。
  naturalness: 整体庄重自然。“医治……恶事”略显搭配生硬，改为“医治……祸患”可保留治疗隐喻而更合汉语。“任凭他们严重败坏”可改为以“家人”作宾语，避免原文单数“家户/全家”与中文复数指代之间的轻微跳跃。
  terminology: “上帝”“主”“劝诫”“罪”“不法行为”均合乎现代庄重中文及原文语域。“疼爱儿女”恰当，未把 φιλότεκνος 预先解释为“溺爱”。“日常生活的事务”比“世俗事务”更贴近 βιωτικῶν πράξεων，后者不必含贬义或专指世俗化。
  issues:
  - severity: medium
    issue: “使自己的家人回转”没有清楚表达归回的宗教向度。
    rationale: ἐπιστρέψῃς 在此为使家户回转；紧邻上下文涉及他们得罪主及父母。译为“使……回转归正”既保留原文未明说的具体处置，也避免中文“回转”无所归向的悬空感。
  - severity: medium
    issue: “遭受了损害”弱化了 κατεφθάρης。
    rationale: 该词与前文“任凭……败坏”形成呼应，表示严重受毁损或被拖垮，而非一般、轻度的损失。
  - severity: low
    issue: “医治……一切恶事”在现代汉语中搭配不够自然。
    rationale: 将 τὰ προγεγονότα πονηρά 译作“先前发生的一切祸患”，可保留原文将家庭中的恶果视为需医治之事的隐喻，同时中文通顺。
  revised_text: 但上帝向你发怒，并不是为这事，而是要你使你那得罪主和我们这些作他们父母的人的家人回转归正。可是，你因疼爱儿女，没有劝诫你的家人，反倒任凭他们严重败坏；因此，主向你发怒。不过，他必医治你家中先前发生的一切祸患；因为他们的罪和不法行为，你自己也被日常生活的事务拖垮了。
