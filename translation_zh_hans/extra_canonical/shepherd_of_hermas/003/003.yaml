  naturalness: 整体流畅、庄重，符合现代标准汉语。将“留心听吧”调整为“要作一个听者，听……”可更完整保留原文两个连续命令，同时仍自然。
  terminology: “夫人”恰当保留 κυρία 的尊称，不额外赋予其宗教身份。“上帝”与本段既有用语一致。“诸般荣耀”较能直接反映复数 τὰς δόξας，且不将其限定为“荣耀之事”。
  issues:
