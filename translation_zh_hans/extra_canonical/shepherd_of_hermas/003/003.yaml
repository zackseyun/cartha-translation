revisions:
- from: 她说完这些话后，就问我：“你愿意听我诵读吗？”我回答说：“愿意，夫人。”她对我说：“留心听吧，听听上帝的荣耀之事。”我听见了宏大而奇妙的事，却无法记住；因为那些话全都令人震撼，是人所承受不了的。因此，我只记住了末后的几句话，因为这些话对我们有益，也温和可亲：
  to: 她说完这些话后，对我说：“你愿意听我诵读吗？”我也说：“愿意，夫人。”她对我说：“要作一个听者，听上帝的诸般荣耀。”我听见了宏大而奇妙的事，却无法记住；因为那些话全都令人战栗，是人无法承受的。因此，我记住了末后的话，因为这些话对我们有益，也温和可亲：
  rationale: 修订删除原文未明示的“只”，以免加入排他限制；将“令人震撼”改为“令人战栗”，恢复 ἔκφρικτα 与“人无法承受”相连的可畏强度；并使“作一个听者，听……”更完整对应两个连续命令。其余叙事次序、尊称、开放的“荣耀”语义及现代庄重文体均予保留。
