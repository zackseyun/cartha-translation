base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/003.yaml
  text: 'After she had stopped these words, she says to me, “Do you wish to hear me reading?” And I say, “I do, Lady.” She says to me, “Become a hearer, and hear the glories of God.” I heard great and wondrous things which I was not able to remember; for all the words were terrifying—things a human being is not able to bear. So I remembered the last words, for they were beneficial and gentle for us:'
translation:
  language: zh_hans
  text: 她说完这些话后，对我说：“你愿意听我诵读吗？”我也说：“愿意，夫人。”她对我说：“要作一个听者，听上帝的诸般荣耀。”我听见了宏大而奇妙的事，却无法记住；因为那些话全都令人战栗，是人无法承受的。因此，我记住了末后的话，因为这些话对我们有益，也温和可亲：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγινωσκούσης
  choice: 诵读
  rationale: 此处指女子出声读给叙述者听；“诵读”比单纯“阅读”更准确地体现听觉场景。
- source_word: Γενοῦ ἀκροατὴς
  choice: 留心听吧
  rationale: 直译为“成为一个听者”在现代汉语中生硬；此译保留命令语气，并自然表达专心聆听。
- source_word: τὰς δόξας τοῦ Θεοῦ
  choice: 上帝的荣耀之事
  rationale: 复数 δόξας 可指彰显上帝荣耀的伟大作为或荣耀内容；加“之事”保留复数及语义开放性。
- source_word: μεγάλως καὶ θαυμαστῶς
  choice: 宏大而奇妙的事
  rationale: 希腊文在此以副词形容所听见的内容；汉语转为名词性表达更自然，同时保留其伟大、奇异的性质。
- source_word: ἔκφρικτα
  choice: 令人震撼
  rationale: 该词含可畏、使人战栗之意；“令人震撼”保留强烈感受而避免将内容单一定性为恐怖。
- source_word: σύμφορα καὶ ἥμερα
  choice: 有益，也温和可亲
  rationale: σύμφορα 指有益、有利；ἥμερα 与前文可畏难承受的话形成对比，指温和、柔和、易于承受。
theological_decisions:
- issue: “上帝的荣耀”复数形式的理解
  choice: 上帝的荣耀之事
  alternative: 上帝的诸般荣耀
  rationale: “荣耀之事”既可涵盖上帝荣耀的彰显与作为，也不把复数抽象化或过度解释。
- issue: ἔκφρικτα 的语气强度
  choice: 令人震撼
  alternative: 可怕得令人战栗
  rationale: 原词确有使人战栗的强度，但上下文重点也在超越人所能承受；采用“令人震撼”保留敬畏与强烈冲击，避免误导为纯粹邪恶或恐怖。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。对话简洁自然；“夫人”保留 κυρία 的尊称，不赋予额外宗教身份。“末后的几句话”按上下文处理 τὰ ἔσχατα ῥήματα，承接下一段所引诵读内容。
