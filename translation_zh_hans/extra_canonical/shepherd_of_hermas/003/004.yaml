  - severity: medium
    issue: “连同丰盛的荣耀和喜乐赐给他们”改变了介词短语的句法附着点
    rationale: μετὰ πολλῆς δόξης καὶ χαρᾶς 紧随 ἐπηγγείλατο，说明“他曾带着极大的荣耀和喜乐所应许的应许”，而不是说赐予时附带荣耀和喜乐。译文应保留这一修饰关系。
  - severity: low
