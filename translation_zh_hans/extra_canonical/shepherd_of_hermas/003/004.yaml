base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/004.yaml
  text: “Behold, the God of hosts, who by his invisible and mighty power and by his great understanding created the world, and by his glorious counsel adorned his creation with beauty, and by his mighty word fixed the heaven and founded the earth upon the waters, and by his own wisdom and providence created his holy church, which also he blessed—behold, he is moving the heavens and the mountains and the hills and the seas, and all things become level for his elect, in order that he may give to them the promise which he promised with much glory and joy, if they keep the statutes of God which they received with great faith.”
translation:
  language: zh_hans
  text: “看哪，万军之神以他那不可见而强大的能力，并以他浩大的明智创造了世界；他以荣耀的旨意使自己的创造披上华美，以有力的话语立定天穹，把大地奠立在众水之上；他又以自己的智慧和眷顾创造了他的圣教会，并赐福给她。看哪，他正挪移诸天、群山、冈陵和海洋，使万物在他所拣选的人面前都变为平坦，好把那他曾带着极大的荣耀和喜乐所应许的应许赐给他们——只要他们遵守上帝的律例，就是他们凭着极大信心所领受的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν δυνάμεων
  choice: 万军之神
  rationale: δυνάμεων 可指诸天军旅或大能；“万军之神”保留传统圣经回响及称号的庄严感，同时不将其缩减为抽象的“全能”。
- source_word: ἀοράτῳ δυνάμει καὶ κραταιᾷ
  choice: 看不见的大能和伟力
  rationale: 按希腊语并列结构处理 ἀοράτῳ δυνάμει 与 κραταιᾷ，既表达能力不可见，也保留“强有力”的加强语气。
- source_word: συνέσει
  choice: 智慧
  rationale: 此处指创造中的理解力、明智；现代汉语用“智慧”自然庄重，并与下文 σοφίᾳ 的语义相近而不致晦涩。
- source_word: τῇ ἐνδόξῳ βουλῇ
  choice: 荣耀的旨意
  rationale: βουλή 可指谋划、意旨；“旨意”适合神圣语境，又不加入特定教义体系。
- source_word: περιθεὶς τὴν εὐπρέπειαν τῇ κτίσει αὐτοῦ
  choice: 使自己的创造披上华美
  rationale: 保留 περιτίθημι“环绕、披戴”的形象，以自然中文表达创造受华美装饰。
- source_word: πήξας τὸν οὐρανὸν
  choice: 立定诸天
  rationale: πήγνυμι 有固定、坚立之意；中文“立定”保留宇宙被稳固建立的图景。原文 οὐρανόν 为单数集合概念，译作“诸天”符合庄严中文习惯。
- source_word: προνοίᾳ
  choice: 眷顾
  rationale: 兼顾“预见、照管、护理”的含义，避免直接采用可能带有体系神学色彩的术语“天意”或“护理”。
- source_word: μεθίστησιν
  choice: 挪移
  rationale: 该词可指移动、迁移；“挪移”保留天地山海发生位移的末世性图像，不解释为单纯除去障碍。
- source_word: ὁμαλὰ γίνεται
  choice: 成为平坦
  rationale: 忠实保留地形变平的意象，也容许其具有为选民扫清障碍的象征意味。
- source_word: τὰ νόμιμα
  choice: 律例
  rationale: 指规定、法令或条例；“律例”庄重且不把含义限定为摩西律法。
theological_decisions:
- issue: 教会的代词指称
  choice: “他的圣教会，并赐福给她”
  alternative: “他的圣教会，并赐福给它”
  rationale: 希腊语 ἐκκλησία 为阴性，关系代词 ἣν 延续人格化表达；用“她”保留教会作为人格化群体的形象，但不进一步解释为特定教会论。
- issue: 应许的赐予与条件句
  choice: 保留“只要他们遵守……”的条件结构
  alternative: 将其解释为得救功德或单纯证据
  rationale: 原文明确有 ἐάν 条件句；译文保留其劝诫张力，不判断遵守与应许之间更精细的教义关系。
- issue: “应许”的表达
  choice: “把他所应许的……赐给他们”
  alternative: 补出具体应许内容
  rationale: 原文 τὴν ἐπαγγελίαν 未说明具体内容，故保留抽象表达，不从上下文或后世教义擅自补足。
- issue: 受造界的挪移
  choice: 按字面意象译出诸天、山岭和海洋被挪移
  alternative: 意译为“除去一切困难”
  rationale: 原文具有宇宙性和末世性图景；直译可保留其真实指涉与象征指涉之间的开放性。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。句法保持原文宏大的层递结构，但以分号和破折号疏理长句，避免欧化难读。“上帝”用于后半句普通名词性提及，而开头固定称号译作“万军之神”；未添加原文没有的解释性脚注。
