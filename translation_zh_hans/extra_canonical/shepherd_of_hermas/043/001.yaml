  language: zh_hans
  text: 我说：“先生，我想知道，我必须以哪些方式服事欲望……”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 保留对尊长的直接称呼及呼格语气；在本书语境中，“主”自然且庄重。
- source_word: ποίοις τρόποις
  choice: 以哪些方式
  rationale: 贴近复数形式，保留说话者询问具体方式的含义。
- source_word: με δεῖ
  choice: 我必须
  rationale: 表达非人称结构所含的必要性。
- source_word: δουλεῦσαι
  choice: 服事
  rationale: 保留该动词“作仆役、服事”的强烈从属意味，不弱化为一般的“应对”或“处理”。
- source_word: τῇ ἐπιθυμίᾳ
  choice: 欲望
  rationale: ἐπιθυμία本身可指欲望、渴望或私欲；现存片段未提供限定词，故采用较中性的“欲望”，不提前判定其道德性质。
- source_word: Ἤθελον … γνῶναι
  choice: 我想知道
  rationale: 自然表达未完成时ἤθελον与不定式γνῶναι构成的愿望，同时保持叙事语气。
theological_decisions:
- issue: “服事欲望”是否应解释为顺从邪欲
  choice: 保留“服事欲望”这一张力明显的直译
  alternative: “对付私欲”或“控制欲望”
  rationale: 希腊文本明确使用δουλεύω（服事、作奴仆）与ἐπιθυμία（欲望）；给定片段截断，不能据后文预先改写其关系或道德评价。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。源文本在末尾截断，因此以省略号标示句意未完；不补入缺失的后文。
