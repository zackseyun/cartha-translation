base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/048/001.yaml
  text: For to this end the Master has made you rich, that you might carry out these ministries for him; it is far better to buy such fields [and estates] and houses, which you will find in your city when you arrive in it. This luxury is good and cheerful, having no grief nor fear, but having joy. So do not practice the luxury of the nations; for it is unprofitable for you, the servants of God. Rather practice your own luxury, in which you are able to rejoice. For all luxury of this kind is profitable. But the luxury of the nations is bitter and harsh. This parable, then, is set before the servants of God, for the poor and the rich.
translation:
  language: zh_hans
  text: 主人使你们富足，正是为了让你们替他完成这些服事。购买这样的田地、产业[a]和房屋，要好得多；等你进入自己的城，就会在那里找到它们。这样的奢华美好而令人欣喜，没有忧愁，也没有惧怕，反而充满喜乐。因此，不要追求列国的奢华，因为这对你们这些上帝的仆人无益。倒要追求属于你们自己的奢华，就是那能使你们喜乐的；凡这样的奢华都是有益的，列国的奢华却苦涩而严酷。所以，这个比喻是为上帝的仆人设立的，无论贫穷的还是富足的，都是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”一词见于部分文本见证，编者将其标为存疑。
    reason: 希腊文校勘文本将 καὶ κτήματα（“和产业”）置于方括号中，需向读者提示其文本不确定性。
lexical_decisions:
- source_word: δεσπότης
  choice: 主人
  rationale: 与下文“上帝的仆人”形成主仆关系，也保留该词所表达的权柄；不直接译作“主”，以免掩盖这一修辞呼应。
- source_word: διακονίας
  choice: 服事
  rationale: 指为主人履行的服务或职分；“服事”在现代中文基督教语境中清楚自然，同时没有把它缩窄为某一种制度化职务。
- source_word: πολυτέλεια
  choice: 奢华
  rationale: 原文反复使用同一个词，并刻意对照两种“奢华”。保留看似矛盾的正面用法，不擅自改释为“施舍”或“慈善”。
- source_word: τῶν ἐθνῶν
  choice: 列国的
  rationale: 保留民族—宗教层面的广义表达；相比“异教徒的”，不额外加入原词未明说的判断。
- source_word: ἐπιδημήσῃς
  choice: 进入
  rationale: 该词可指到访、抵达或旅居。结合“你自己的城”这一目的地意象，译为自然的“进入”，但不明确解释其末世含义。
- source_word: κεῖται
  choice: 设立
  rationale: 表达比喻被摆在听众面前、适用于他们的意思，中文用“为……设立”较为凝练。
theological_decisions:
- issue: “自己的城”的含义
  choice: 保留“自己的城”这一意象，不在正文中明说是天城或来世。
  alternative: 译为“天上的城”或“永恒的家乡”。
  rationale: 原文只说“你的城”，其超越性含义由语境暗示；明说会消除原有的含蓄和解释空间。
- issue: 正面的“奢华”与列国的“奢华”之间的张力
  choice: 两处均译为“奢华”，靠上下文区分其性质。
  alternative: 把正面用法释译为“慷慨施予”或“属灵享受”。
  rationale: 原文有意重复同一名词并作反常识的重新界定；统一译词更能保存其修辞和神学张力。
- issue: 财富的目的
  choice: 按原文表述为主人使人富足，是为完成服事。
  alternative: 加写为“上帝赐财富专为周济穷人”。
  rationale: 本段确实将财富导向服事，却未在此句把服事完全等同于周济；不应把后续语境提前写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文对“奢华”的反复和悖论式正面用法；句子适度拆分，以便普通读者阅读，同时维持劝诫和比喻说明的语气。
