  text: '‘How so, sir?’ I say. ‘Make it known to me.’ ‘Listen,’ he says: ‘The rich man has much money, but toward the Lord he is poor, being distracted about his wealth, and he has very little confession and intercession toward the Lord; and what he has is small and feeble, and has no power to go up above. When, therefore, the rich man goes to the needy and supplies him with what is necessary, believing that what he does for the needy he will be able to find as his reward from God—for the needy is rich in intercession [and in confession], and his intercession has great power with God—the rich man supplies the needy with everything without hesitation. And the needy, being supplied by the rich, intercedes for him, giving thanks to God on behalf of the one who gives to him. And that one is still more eager concerning the needy, so that he may be unceasing in his life; for he knows that the intercession of the needy is acceptable and rich before God. Therefore both complete the work: the needy
    performs the intercession in which he is rich, [which he received from the Lord;] this he renders to the Lord for the one who supplies him. And likewise the rich man without hesitation provides to the needy the wealth which he received from the Lord. And this is a great work and acceptable with God, because he understood concerning his wealth and worked for the needy out of the gifts of the Lord and fulfilled the Lord’s ministry rightly. Therefore, among people the elm seems not to bear fruit; and they do not know nor understand that, if there should be a drought, the elm, having water, nourishes the vine, and the vine, having unceasing water, gives double fruit, both for itself and for the elm. In the same way also the needy, interceding with the Lord on behalf of the rich...'
translation:
  language: zh_hans
  text: '我说：“先生，这是怎么回事？请给我讲明。”他说：“你听。富人虽有许多钱财，在主面前却是贫乏的，因为他一心挂虑自己的财富；他向主的认罪和祈求极少，即使有，也是微弱无力的，不能上达。因此，富人若去到穷人那里，供给他所需的，并且相信自己为穷人所做的，必能从上帝那里得着赏赐——因为穷人在祈求[a]上是富足的，他的祈求在上帝面前大有力量——富人就会毫不犹豫地把一切供给穷人。


    “穷人得了富人的供给，就为他祈求，并为那供给自己的人感谢上帝。富人则更加关心穷人，使他能不断维持生活；因为富人知道，穷人的祈求在上帝面前是蒙悦纳而且丰盛的。


    “这样，两人一同完成这工作：穷人履行自己所富有的祈求，[b]把这祈求为供给他的人献给主；富人也同样把自己从主所得的财富毫不犹豫地供给穷人。这工作在上帝面前是伟大而蒙悦纳的，因为富人明白该怎样看待自己的财富，用主所赐的恩惠帮助穷人，恰当地完成了主交托的服事。


    “所以在人看来，榆树似乎不结果子；他们却不知道，也不明白：一旦发生旱灾，榆树存有水分，便滋养葡萄树；葡萄树不断得到水分，就结出双倍的果实，既为自己，也为榆树。同样，穷人为富人向主祈求……”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在“祈求”之后还有“和认罪”。
    reason: 原文校勘文本以方括号标出καὶ τῇ ἐξομολογήσει，显示其文本归属存疑。
  - marker: b
    text: 有些抄本在这里还有“这是他从主领受的”。
    reason: 原文校勘文本以方括号标出ἣν ἔλαβεν ἀπὸ τοῦ Κυρίου，正文需标示该异文而不静默取舍。
lexical_decisions:
- source_word: κύριε
  choice: 先生
  rationale: 此处是对讲解者的尊称；译作“先生”既自然，也避免在叙事对话中与神圣称号“主”混淆。
- source_word: ἐξομολόγησιν
  choice: 认罪
  rationale: 该词可指承认、宣认或认罪；在与向主的祈求并列的语境中，“认罪”较为自然，同时不把它扩展成特定礼仪。
- source_word: ἔντευξιν / ἐντυγχάνει
  choice: 祈求 / 为……祈求
  rationale: 这里指在上帝面前为人代求；正文用普通读者易懂的“祈求”，并借介词结构显明代求对象。
- source_word: πένης
  choice: 穷人
  rationale: 与“富人”形成全文核心对照；现代汉语中简洁清楚。
- source_word: χορηγήσῃ / ἐπιχορηγεῖ
  choice: 供给
  rationale: 保留持续提供生活所需的含义，且与后文双方各自献上所得相呼应。
- source_word: διακονίαν
  choice: 服事
  rationale: 表达受主托付而履行的服务，不限定为制度化职分。
- source_word: πτελέα
  choice: 榆树
  rationale: 按通常词义翻译为榆树，保留原比喻中的树种。
- source_word: διπλοῦν τὸν καρπὸν
  choice: 双倍的果实
  rationale: 直译数量意象，使葡萄树同时为自己和榆树结果的解释得以保留。
theological_decisions:
- issue: 富人的善行与从上帝所得赏赐的关系
  choice: 译为“相信自己为穷人所做的，必能从上帝那里得着赏赐”
  alternative: 将其解释为靠施舍赚取救恩，或弱化为仅得属世回报
  rationale: 原文明确使用“赏赐”并指向上帝，却没有在此系统说明救恩机制；故保留张力，不作宗派化推论。
- issue: 穷人祈求的能力
  choice: 保留“在上帝面前大有力量”及“蒙悦纳而且丰盛”
  alternative: 解释为穷人本身具有独立属灵权能，或将其削弱为单纯心理鼓励
  rationale: 原文强调其代求在上帝面前的效力，但能力仍处于向上帝祈求的关系中。
- issue: 财富的来源与用途
  choice: 说明财富是“从主所得”，并应用于帮助穷人、完成主的服事
  alternative: 把财富本身定性为邪恶，或视为完全私人所有
  rationale: 原文把财富称作主的赐予，并以是否正确用于服事来评价富人。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。保留富人和穷人彼此供应的平行结构，以及榆树与葡萄树比喻的逻辑。末句依给定单元在原文中的截断状态以省略号收束，不擅自补入下一段内容。
