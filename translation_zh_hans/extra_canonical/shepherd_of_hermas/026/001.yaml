  - severity: medium
    issue: 末句译法不够自然
    rationale: ζήσῃ τῷ θεῷ可保留为“为上帝而活”，这在汉语中自然，且能表达对上帝而活、归属于上帝的与格关系；“向上帝而活”不合常用搭配。
  - severity: low
