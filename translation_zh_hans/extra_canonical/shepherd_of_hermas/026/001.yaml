base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/026/001.yaml
  text: First of all, believe that God is one—the one who created and ordered all things, and made all things out of nonexistence into being, and who contains all things, while he alone is uncontainable. Therefore believe him and fear him; and having feared, exercise self-control. Keep these things, and you will cast off all wickedness from yourself and put on every virtue of righteousness, and you will live to God, if you keep this command.
translation:
  language: zh_hans
  text: 首先，你要相信上帝是独一的；他创造并安排万有，使万有从无到有；他容纳万有，唯独他自己不被容纳。因此，你要信靠他，敬畏他；既敬畏他，就要自制。要谨守这些事，你就会除掉你身上一切的邪恶，穿上一切属乎公义的美德；你若谨守这条诫命，就会为上帝而活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτον πάντων
  choice: 第一，最要紧的是
  rationale: 兼顾“首先”与“在一切事之先”的强调，中文自然且庄重。
- source_word: πίστευσον ὅτι
  choice: 要相信……
  rationale: 此处引出信念内容，译作“相信”比单纯“信靠”更贴合 ὅτι 从句。
- source_word: εἷς ἐστὶν ὁ Θεός
  choice: 上帝是独一的
  rationale: 保留原文对上帝唯一性的明确宣告。
- source_word: κτίσας καὶ καταρτίσας
  choice: 创造并安排
  rationale: κτίζω 指创造；καταρτίζω 在此有整理、安排、使之完备之意，避免将两词合并。
- source_word: ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι
  choice: 从无到有
  rationale: 简洁对应“从不存在进入存在”，保留创造论表达。
- source_word: πάντα χωρῶν, μόνος δὲ ἀχώρητος ὤν
  choice: 他容纳万有，唯独他自己不被任何事物所容纳
  rationale: 保留 χωρέω／ἀχώρητος 的文字对应与神学张力，不将其解释性改写为空间、知识或能力概念。
- source_word: πίστευσον οὖν αὐτῷ
  choice: 因此，你要信靠他
  rationale: 此处 αὐτῷ 为与格，表达对上帝的信赖，故区别于前面的“相信……”。
- source_word: ἐγκράτευσαι
  choice: 节制自己
  rationale: 准确表达克制欲望、实行自制的命令语气。
- source_word: ἐνδύσῃ
  choice: 穿上
  rationale: 保留原文与“除掉”相对的衣着隐喻。
- source_word: ζήσῃ τῷ θεῷ
  choice: 向上帝而活
  rationale: 保留与格短语可能表示“为上帝／向着上帝而活”的开放性，避免径直解释成“永生”。
theological_decisions:
- issue: 上帝的独一性
  choice: 上帝是独一的
  alternative: 只有一位上帝
  rationale: 前者较直接映照 εἷς ἐστὶν ὁ Θεός，也不改变句子的述谓重心。
- issue: 无中生有的表述
  choice: 使万有从无到有
  alternative: 使一切不存在的成为存在
  rationale: “从无到有”是现代汉语清楚自然的表达，同时准确保留原文存在论对照。
- issue: 上帝容纳万有却不被容纳
  choice: 保留“容纳／不被容纳”的悖论式表达
  alternative: 上帝掌管万有，却无人能限制他
  rationale: 替代译法会把空间性或存在性的原文措辞解释成权能与限制；正文不应静默消解其神学张力。
- issue: ζῆν τῷ θεῷ 的含义
  choice: 向上帝而活
  alternative: 为上帝而活／在上帝面前存活
  rationale: 希腊语与格关系可以有多重侧重；“向上帝而活”保留方向性及归属意味，而不武断限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。命令句以“要”呈现劝诫权威；保留“穿上”“容纳”等原文意象，不加入宗派术语或额外解释。
