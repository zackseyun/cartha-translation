revisions:
- from: 第一，最要紧的是，要相信上帝是独一的；他创造并安排了万有，使万有从无到有；他容纳万有，唯独他自己不被任何事物所容纳。因此，你要信靠他，敬畏他；既敬畏他，就要节制自己。要谨守这些事，这样你就会除掉自己一切的邪恶，穿上公义的一切美德；你若谨守这条诫命，就会向上帝而活。
  to: 首先，你要相信上帝是独一的；他创造并安排万有，使万有从无到有；他容纳万有，唯独他自己不被容纳。因此，你要信靠他，敬畏他；既敬畏他，就要自制。要谨守这些事，你就会除掉你身上一切的邪恶，穿上一切属乎公义的美德；你若谨守这条诫命，就会为上帝而活。
  rationale: 修订仅调整语气与现代汉语表达，不改变原文的神学张力或语义范围。“首先”对应Πρῶτον πάντων而避免不必要的强化；“自制”简洁对应ἐγκράτευσαι；“为上帝而活”以自然汉语保留ζῇν τῷ θεῷ所表达的对上帝而活、归属于上帝的含义，未将其限定为永生或其他教义性解释。
