base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/002.yaml
  text: 'As I was saying these things within myself, I suddenly see him seated beside me and saying this: “Why are you double-minded about the commandments that I commanded you? They are good. Do not be double-minded at all, but clothe yourself with the faith of the Lord, and you will walk in them; for I will strengthen you in them.'
translation:
  language: zh_hans
  text: 我心里正这样想着，忽然看见他坐在我身旁，对我说：“对于我吩咐你的那些诫命，你为什么心怀二意？这些诫命是好的。千万不要心怀二意，倒要穿上主的信心〔a〕，这样你就能遵行这些诫命，因为我必赐你力量，使你能遵行。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχεῖς / διψυχήσῃς
  choice: 心怀二意
  rationale: 保留该词“内心分裂、摇摆疑惑”的形象与道德意味，比单纯译作“怀疑”更贴近希腊文。
- source_word: ἔνδυσαι
  choice: 穿上
  rationale: 保留原文以衣服为喻的明确意象，不将其抽象化为“怀有”。
- source_word: τὴν πίστιν τοῦ Κυρίου
  choice: 对主的信心
  rationale: 属格在语法上可有不同理解；正文采用自然且符合语境的客体属格表达，同时不引入特定宗派解释。
- source_word: ἐν αὐταῖς πορεύσῃ
  choice: 遵行这些诫命
  rationale: 希腊文直译为“行在其中”；现代汉语以“遵行”清楚表达按诫命生活的意思。
- source_word: ἐνδυναμώσω σε ἐν αὐταῖς
  choice: 赐你力量，使你能遵行
  rationale: 自然呈现说话者将加力量、使其得以按诫命而行的含义，避免生硬的“在其中使你刚强”。
theological_decisions:
- issue: “主的信心”（πίστις τοῦ Κυρίου）的属格关系
  choice: 对主的信心
  alternative: 主所赐的信心／主的信实
  rationale: 当前语境要求赫马以信心克服心怀二意，客体属格最顺畅；但希腊文自身并未把关系完全说死，因此不扩写为更具体的教义表述。
- issue: 遵行诫命与所得力量的关系
  choice: 保留“我必赐你力量”的应许
  alternative: 改写为人凭自身努力遵行
  rationale: 原文明确把能够遵行与说话者所赐的力量相连，译文不削弱这一张力，也不进一步界定其神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“心怀二意”重复对应原文同根词，以“穿上”保留鲜明隐喻；时态依原文叙事中的生动现在式译作“忽然看见”。
