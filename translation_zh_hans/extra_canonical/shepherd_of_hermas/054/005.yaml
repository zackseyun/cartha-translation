  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/005.yaml
  text: And after he had spoken these things with me, he says to me, “Let us go into the country, and I will show you the shepherds of the sheep.” “Let us go, sir,” I say. And we came to a certain plain, and he shows me a shepherd, a young man, clothed in a composite garment, saffron in color.
translation:
  language: zh_hans
  text: 他同我说完这些话以后，就对我说：“我们到田野去吧，我要让你看看羊群的牧人。”我说：“先生，我们去吧。”于是我们来到一片平原；他指给我看一个牧人，是个年轻人，身穿一件由不同部分拼接而成的衣服，呈番红花色。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγρόν
  choice: 田野
  rationale: 此处与随后出现的“平原”相配，指乡野之地；译作“田野”比笼统的“乡下”更贴近原词的空间意象。
- source_word: τοὺς ποιμένας τῶν προβάτων
  choice: 那些牧羊人
  rationale: 保留复数“牧羊人”；属格“羊的”在现代汉语中可由“牧羊人”自然表达，不必重复为“羊群的牧人”。
- source_word: κύριε
  choice: 主啊
  rationale: κύριε可作尊称“先生”或“主”；在《赫尔马牧人书》的异象叙事语境中采用“主啊”，同时不把所称对象进一步认定为神或基督。
- source_word: πεδίον
  choice: 一片平原
  rationale: 对应开阔而平坦的地点，并保留τι所表达的非特指性。
- source_word: ποιμένα νεανίσκον
  choice: 一个牧羊人，是个年轻人
  rationale: 按希腊语同位关系表达，既清楚说明身份，也保留其年轻这一特征。
- source_word: σύνθεσιν ἱματίων
  choice: 一件拼色的衣服
  rationale: 该短语较罕见，可能指由不同部分或颜色组合而成的衣服；“拼色”保留组合之意，又适合随后对颜色的描写。
- source_word: κροκώδη
  choice: 藏红花黄
  rationale: 原词指类似番红花的黄色或金黄色；用“藏红花黄”保留具体色彩来源，避免误译成现代常指橙红色的“藏红色”。
theological_decisions:
- issue: κύριε所指身份
  choice: 译作“主啊”，但不在正文中明确其为神、基督或天使
  alternative: 先生／阁下
  rationale: 原文仅使用呼格尊称，叙事本身没有在本句明确界定身份；保留庄重称谓及其可能的宗教语感，同时不替文本消除身份上的含混。
translation_notes:
  register: 采用现代、庄重而顺畅的叙事汉语；保留历史现在时的生动感较难在汉语中逐字体现，因此统一用自然的过去叙述。句式尽量贴近希腊文推进次序，并保留“牧羊人”的复数预告与随后单数人物的张力。
