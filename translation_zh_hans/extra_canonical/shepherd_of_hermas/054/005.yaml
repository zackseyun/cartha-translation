revisions:
- from: 他同我说完这些话以后，就对我说：“我们到田野去吧，我要让你看看那些牧羊人。”我说：“主啊，我们去吧。”于是我们来到一片平原，他指给我看一个牧羊人，是个年轻人，身穿一件拼色的衣服，颜色呈藏红花黄。
  to: 他同我说完这些话以后，就对我说：“我们到田野去吧，我要让你看看羊群的牧人。”我说：“先生，我们去吧。”于是我们来到一片平原；他指给我看一个牧人，是个年轻人，身穿一件由不同部分拼接而成的衣服，呈番红花色。
  rationale: 修订仅处理称谓和衣饰描述中会改变或过度限定原文的两处。“先生”不裁定κύριε所指者的身份；“由不同部分拼接而成的衣服”保留σύνθεσις的组合意而不武断为拼色；“番红花色”对应κροκώδη的颜色参照。其余叙事结构、复数预告后引出单数牧人的安排均予保留。
