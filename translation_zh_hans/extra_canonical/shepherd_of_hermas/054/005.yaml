    issue: “主啊”将κύριε作神圣称谓处理。
    rationale: κύριε可作一般尊称；本句本身未界定被称者为神或基督，且英语审校轨迹译为“sir”。“先生”更能保留原文的身份含混。
  - severity: medium
    issue: “拼色的衣服”过度限定σύνθεσιν ἱματίων。
    rationale: 该罕见短语可指由不同部分组合、拼接的衣服，并不必然指不同颜色；紧接着κροκώδη说明衣服整体呈番红花色。“拼色”会造成不必要的张力。
