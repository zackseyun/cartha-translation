base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/004.yaml
  text: “You, therefore, who are repenting, cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”
translation:
  language: zh_hans
  text: “所以，你们这些悔改的人，要脱去这世代中那些使你们困顿不堪的邪恶；又要穿上一切公义的美德，你们就能遵守这些诫命，不再给自己的罪增添什么。因此，你们若不再增添什么，就会脱离从前的罪。你们要遵行我这些诫命，就必为上帝而活。这一切话都是我对你们说的。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“都”。
    reason: 希腊文本中的πάντα（“全都／一切”）以方括号标示，表示其抄本证据存在不确定性。
lexical_decisions:
- source_word: ἀποβάλλετε
  choice: 脱去
  rationale: 本义为“丢弃、除去”；下文紧接“穿上”，故用“脱去”保留衣着隐喻和鲜明对照。
- source_word: τὰς πονηρίας τοῦ αἰῶνος τούτου
  choice: 这世代……的恶
  rationale: 保留 αἰών 的时代性含义及复数 πονηρίας 的概括性，不将其限定为某类具体恶行。
- source_word: τὰς ἐκτριβούσας ὑμᾶς
  choice: 那些使你们困顿不堪的
  rationale: ἐκτρίβω 可指磨损、耗尽或摧残；此译传达持续消磨人的力度，同时保持现代汉语自然。
- source_word: ἐνδυσάμενοι
  choice: 穿上
  rationale: 保留原文衣着隐喻，并与“脱去”对应。
- source_word: πᾶσαν ἀρετὴν δικαιοσύνης
  choice: 公义的一切美德
  rationale: 按属格结构直译，保留“美德”与“公义”的关系，不擅自解释为单一的“义行”。
- source_word: προστιθέναι ταῖς ἁμαρτίαις ὑμῶν
  choice: 增添你们的罪
  rationale: 保留“加添于罪”的累积意象；汉语中简化介词结构以求流畅。
- source_word: ἀποστήσεσθε ἀπὸ
  choice: 脱离
  rationale: 表达离开、远离之意，但不额外断定这里专指罪责获赦或行为完全止息。
- source_word: πορεύεσθε
  choice: 遵行
  rationale: 字面为“行走”；在“诫命”语境中译为“遵行”最自然，并保留生活实践的含义。
- source_word: ζήσεσθε τῷ Θεῷ
  choice: 向上帝而活
  rationale: 保留与格 τῷ Θεῷ 的简洁和一定歧义，可表示为上帝、归于上帝或在上帝面前而活，不窄化为单一解释。
theological_decisions:
- issue: 悔改、停止犯罪与脱离先前之罪的关系
  choice: 按原文保留条件式推进：“若不再增添任何罪，就会脱离从前的罪”
  alternative: 解释为“从前的罪就会得到赦免”
  rationale: ἀποστήσεσθε 表示离开或脱离，原文没有直接使用“赦免”词汇；不将其神学机制明确化。
- issue: ζήσεσθε τῷ Θεῷ 的含义
  choice: 译作“向上帝而活”
  alternative: “为上帝而活”或“在上帝面前存活”
  rationale: 与格结构可能兼有方向、关系或利益意味；采用略带经文语体的表达以保存张力。
- issue: 文本变体 πάντα
  choice: 正文译入“都”，并加脚注说明
  alternative: 省略“都”
  rationale: 底本文本以方括号标示 πάντα，说明其文本见证存在不确定性；正文采用有该词的读法，同时公开变体。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用“脱去／穿上”重现原文连续的衣着隐喻；“向上帝而活”有意保留希腊语与格短语的神学开放性。
