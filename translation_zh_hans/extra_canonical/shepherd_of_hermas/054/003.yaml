base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/003.yaml
  text: “These commandments are beneficial for those who are about to repent; for if they do not walk in them, their repentance is in vain.
translation:
  language: zh_hans
  text: 这些诫命对将要悔改的人是有益的；因为他们若不遵行这些诫命，他们的悔改就是徒然。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφοροί
  choice: 有益的
  rationale: 表达这些诫命对悔改者有帮助、有益处，贴合该词在此处的实际功用。
- source_word: τοῖς μέλλουσι μετανοεῖν
  choice: 对将要悔改的人
  rationale: 保留 μέλλουσι 的前瞻意味，不把它泛化为已经悔改的人。
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: 遵行这些诫命
  rationale: 希腊文直译为“行在其中”；中文用“遵行”自然表达按诫命生活，同时保留实践性的含义。
- source_word: εἰς μάτην
  choice: 徒然
  rationale: 简洁而庄重地表达无效、落空之意。
- source_word: μετάνοια
  choice: 悔改
  rationale: 既包含心意转变，也在上下文中指离弃恶行的实际转向；采用通行且不偏宗派的译法。
theological_decisions:
- issue: 诫命与悔改的关系
  choice: 按条件句直译为：若不遵行诫命，悔改便是徒然
  alternative: 将其解释为遵行诫命可赚取赦免或救恩
  rationale: 原文强调悔改必须在生活中落实，却没有明确建立功德或赚取救恩的体系，因此不作额外教义推演。
- issue: μέλλουσι 所指的时间或意向
  choice: 将要悔改的人
  alternative: 愿意悔改的人／已经悔改的人
  rationale: 保留希腊文的前瞻性及潜在模糊，不把它改释为主观意愿或已经完成的行动。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“遵行这些诫命”比“行在其中”更符合自然汉语，并与上下文要求以行为落实悔改相呼应。
