base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/006.yaml
  text: He was pasturing very many sheep, and the sheep were as if luxuriating and being very extravagant, and they were cheerful, skipping here and there. And the shepherd himself was very cheerful over his flock; and the very appearance of the shepherd was exceedingly cheerful, and he ran around among the sheep.
translation:
  language: zh_hans
  text: 他牧放着许许多多的羊。这些羊仿佛在尽情享乐，恣意放纵；它们兴高采烈，到处蹦跳。牧人自己也因他的羊群十分欢喜；他看上去格外喜悦，在羊群中跑来跑去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβοσκε
  choice: 牧放着
  rationale: 准确表达未完成时所呈现的持续牧养场景，同时保持自然叙事语气。
- source_word: τρυφῶντα
  choice: 尽情享乐
  rationale: 既传达奢适享受、纵情逸乐的意味，也与下文的放纵相衔接。
- source_word: σπαταλῶντα
  choice: 恣意放纵
  rationale: 该词含奢侈挥霍、纵欲生活之意；此处用较宽泛的表达保留其道德负面色彩，不把含义限缩为挥霍钱财。
- source_word: ἱλαρά / ἱλαρός
  choice: 兴高采烈／十分欢喜／格外喜悦
  rationale: 依不同主语和句法自然变换措辞，同时保留原文反复强调欢悦的修辞。
- source_word: ἰδέα
  choice: 看上去
  rationale: 此处指牧人的外貌、神态或观感；译作动态表达，比生硬的“形貌”更符合现代汉语。
- source_word: περιέτρεχε
  choice: 跑来跑去
  rationale: 传达在羊群之中四处奔跑的持续动作。
theological_decisions:
- issue: 羊群行为的道德性质
  choice: 以“尽情享乐，恣意放纵”保留负面意味
  alternative: 译作中性的“生活优裕、无忧无虑”
  rationale: τρυφάω 与 σπαταλάω 的组合明显带有奢逸放纵之意，而本异象后文亦据此作道德解释；但译文不提前加入未明说的罪名。
- issue: 牧人的欢喜是否表示认可
  choice: 仅陈述他因羊群而欢喜，不解释其神学意义
  alternative: 明译为他赞许羊群的放纵
  rationale: 原句表达牧人对羊群的喜悦，却未在本节直接说明这种喜悦的性质；应保留叙事张力，避免提前释义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留原文对“欢喜”的三重反复，但通过“兴高采烈、十分欢喜、格外喜悦”避免中文机械重复；“许许多多”对应 πολλὰ λίαν 的强烈数量感。
