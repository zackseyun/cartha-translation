base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/001.yaml
  text: 'While I was sitting in my house and glorifying the Lord for all the things I had seen, and pondering the commandments—that they are good and powerful and gladdening and glorious and able to save a person’s soul—I said within myself: “Blessed shall I be if I walk in these commandments, and whoever walks in them will be blessed.”'
translation:
  language: zh_hans
  text: 我坐在家里，因我所看见的一切而荣耀主，并思想那些诫命，想到它们是美善的、有能力的、令人喜乐的、荣耀的，并且能救人的灵魂。我心里说：“我若遵行这些诫命，就有福了；凡遵行这些诫命的，也必有福。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: 荣耀
  rationale: 保留其向主归荣耀、颂赞主的宗教含义，同时符合现代汉语基督教语域。
- source_word: συζητῶν
  choice: 思想
  rationale: 此处指在心里反复思量、权衡诫命的性质；译作“思想”自然且与下文内心独白衔接。
- source_word: καλαὶ
  choice: 美善的
  rationale: καλός兼有“好”与“美”的意味，“美善”能较完整地表达其褒义幅度。
- source_word: δυναταὶ
  choice: 有能力的
  rationale: 保留诫命具有功效或力量的表述，不将其具体解释为“可行”或“有权威”。
- source_word: ἱλαραὶ
  choice: 令人喜乐的
  rationale: 在此描述诫命带来喜乐、欢欣；用使动式汉语较自然，也避免生硬的“欢快的诫命”。
- source_word: πορευθῶ / πορευθῇ
  choice: 遵行
  rationale: 字面为“行在……中”，在诫命语境中汉语惯用“遵行”；既表达生活实践，也避免机械直译。
- source_word: ψυχὴν ἀνθρώπου
  choice: 人的灵魂
  rationale: 保留ψυχή在本句中的明确宗教与救赎语境，不弱化为笼统的“生命”。
- source_word: Μακάριος
  choice: 有福
  rationale: 采用自然、庄重且广为理解的圣经汉语表达，涵盖蒙福与可称为幸福的状态。
theological_decisions:
- issue: 诫命“能救人的灵魂”的施事关系
  choice: 并且能救人的灵魂
  alternative: 并且能使人的灵魂得救
  rationale: 按希腊文保留诫命作语法主语的强烈说法，不擅自加入神学限定，也不化解其与恩典、信心之间可能存在的张力。
- issue: πορεύομαι与诫命的关系
  choice: 遵行这些诫命
  alternative: 行在这些诫命中
  rationale: 选择现代汉语自然表达，但保留持续按诫命生活的实践含义，不把它缩减为一次性的服从。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留第一人称内省结构以及诫命“美善、有能力、令人喜乐、荣耀、能救人灵魂”的并列层次；不增添原文没有的因果或教义说明。
