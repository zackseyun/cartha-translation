base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/006.yaml
  text: And she came with six young men—whom I had seen also before—and she stood by me and listened while I was praying and confessing my sins to the Lord. And touching me she says, “Hermas, stop asking everything about your sins; ask also about righteousness, so that you may receive some share of it for your household.”
translation:
  language: zh_hans
  text: 她同我先前见过的那六个青年一起来了。她站在我身旁，听着我祷告、向主承认自己的罪。她碰了我一下，说：“赫马，不要再总是问有关你罪的事；也要问问有关义的事，好让你能为你的家从中得着一份。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκων ἕξ
  choice: 六个青年
  rationale: 直译人数与身份；“青年”自然且不额外赋予天使身份。
- source_word: ἐξομολογουμένου ... τὰς ἁμαρτίας μου
  choice: 向主承认自己的罪
  rationale: 这里指祷告中向主认罪；“承认”保留基本语义，也符合现代汉语表达。
- source_word: ἁψαμένη μου
  choice: 她摸了摸我
  rationale: 表达身体接触而不臆断具体部位；叠词形式在叙事中自然。
- source_word: πάντα ἐρωτῶν
  choice: 一味……祈求
  rationale: πάντα 在此用法略显困难，可能有“不断、完全”之意；结合后句再次出现的 ἐρώτα，译为“一味……祈求”保留持续专注于此事的含义。
- source_word: δικαιοσύνης
  choice: 义
  rationale: 采用简明、传统而仍可理解的神学用语，兼顾正直、合宜行为及与罪相对的意义。
- source_word: λάβῃς μέρος τι ἐξ αὐτῆς
  choice: 从义中得着一份
  rationale: 保留 μέρος τι 的分取意象和 ἐξ αὐτῆς 的来源关系，不将其抽象化为单纯“变得正义”。
- source_word: εἰς τὸν οἶκόν σου
  choice: 让你的家也能……
  rationale: οἶκος 可指房屋、家庭或家人；上下文更可能涉及赫马的家室，译作“家”以保留一定宽度。
theological_decisions:
- issue: “为罪祈求”与认罪、赦免之间的关系
  choice: 别再一味为你的罪祈求了
  alternative: 不要再询问所有关于你罪的事
  rationale: ἐρωτάω 可指询问或请求；本段紧接祷告认罪，且下句同样要求“为义祈求”，故请求/祈求更合语境，但不扩写成特定赦罪理论。
- issue: “义”能否被带给家庭
  choice: 好让你的家也能从义中得着一份
  alternative: 好让你为家中取得一些义
  rationale: 保留原文“得着一份”的参与性表达，不把义解释为功德转移，也不消除家庭受益的张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。保留现在时“说”所带来的叙事现场感，同时避免生硬照搬希腊语结构。人物名按常见形式译为“赫马”。
