review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了老妇人与六个青年同来、聆听赫马祷告认罪，以及她劝他转而关注“义”的基本情节。不过，ἐρωτῶν/ἐρώτα的核心是“询问、求问”，不宜在没有明示祈祷对象或祈求内容的情况下两次译成“为……祈求”。末句的主语也是赫马：他要“为/归入自己的家”从义中得一份，而非直接说“你的家得着”。
  naturalness: 原译整体流畅、庄重。将“问罪的事／问义的事”译为“总是问有关你罪的事；也要问问有关义的事”，既符合现代汉语，也保留原文的并列与语义开放性。
  terminology: “青年”“向主承认自己的罪”“义”“得着一份”均可取。“赫马”为常见且合宜的人名译法。
  issues:
  - severity: medium
    issue: 将ἐρωτῶν与ἐρώτα译作“为……祈求”
    rationale: 原文动词通常意为询问、求问；上下文虽有祷告和认罪，却没有明说此处是在祈求罪的赦免。译为“祈求”缩窄了原文的开放含义，并把“也要为义祈求”导向较强的神学解释。
  - severity: medium
    issue: 末句将“得着”的主体改为“你的家”
    rationale: λάβῃς的主语是赫马本人；εἰς τὸν οἶκόν σου说明所得与其家相关。宜保留“你能为你的家从中得着一份”的句法关系。
