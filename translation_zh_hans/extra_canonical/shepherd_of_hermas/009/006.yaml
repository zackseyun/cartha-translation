revisions:
- from: 她同我先前见过的那六个青年一起来了。她站在我身旁，听着我祷告，向主承认自己的罪。她摸了摸我，说：“赫马，别再一味为你的罪祈求了；也要为义祈求，好让你的家也能从义中得着一份。”
  to: 她同我先前见过的那六个青年一起来了。她站在我身旁，听着我祷告、向主承认自己的罪。她碰了我一下，说：“赫马，不要再总是问有关你罪的事；也要问问有关义的事，好让你能为你的家从中得着一份。”
  rationale: 修订将两处ἐρωτάω一致译为“问”，避免把原文未明说的“求赦免”或特定祈祷神学加进文本；并恢复末句中赫马作为“得着一份”的主体，同时保留“义”可为其家庭带来益处的原文张力。其余叙事信息、人物称谓及庄重现代的文体均予保留。
