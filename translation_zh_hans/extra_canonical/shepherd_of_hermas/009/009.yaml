- from: 于是，我想坐在右边，她却不许，只用手示意我坐在左边。我心里思量，又因她不许我坐在右边而难过。她对我说：“黑马，你难过吗？右边的座位是留给别人的，就是那些已经蒙上帝喜悦、又为这名受过苦的人。你要与他们同坐，还欠缺许多。不过，你既持守自己的纯朴，就要继续持守，将来也必与他们同坐；凡行他们所行、忍受他们所忍受的，也都必如此。”
