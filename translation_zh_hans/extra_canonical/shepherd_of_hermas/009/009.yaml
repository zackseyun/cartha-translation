base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/009.yaml
  text: So when I wanted to sit on the right side, she did not permit me, but motioned to me with her hand that I should sit on the left side. So as I reasoned and was grieved that she had not allowed me to sit on the right side, she says to me, “Are you grieved, Hermas? The place on the right side belongs to others—those who have already pleased God and suffered for the sake of the Name; but you lack many things to sit with them. But as you remain in your simplicity, remain, and you will sit with them, as will all who do their works and endure what they also endured.”
translation:
  language: zh_hans
  text: 于是，我正想坐在右边，她却不许我坐，只用手示意我坐在左边。我心里思量，又因她不许我坐在右边而难过。她对我说：“赫尔马斯，你难过吗？右边的位置是留给别人的，就是那些已经蒙上帝喜悦、又为这名受过苦的人。你要与他们同坐，还欠缺许多。不过，你既持守自己的纯朴，就要继续持守；你必与他们同坐，凡行他们所行、忍受他们所忍受的，也都必与他们同坐。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ δεξιὰ μέρη / τὰ ἀριστερὰ μέρη
  choice: 右边／左边
  rationale: 按空间方位直译；上下文指座位所在的一侧，不额外赋予象征意义。
- source_word: διαλογιζομένου
  choice: 心里思量
  rationale: 保留内心思索、困惑的意味，避免过度具体化为质疑或抱怨。
- source_word: τῶν ἤδη εὐαρεστηκότων τῷ θεῷ
  choice: 那些已经蒙上帝喜悦的人
  rationale: 表达其已经取悦上帝、为上帝所悦纳的意思，同时保持庄重自然。
- source_word: εἵνεκα τοῦ ὀνόματος
  choice: 为这名
  rationale: 原文只说“这名／那名”，并未明言所指；保留早期基督教语境中的凝练与含蓄。
- source_word: ἁπλότης
  choice: 纯朴
  rationale: 该词可含单纯、真诚、质朴之意；“纯朴”较能保留其正面伦理色彩而不过度解释。
- source_word: ἐμμένεις / μενόν
  choice: 持守／继续持守
  rationale: 再现原文同一词根的重复和劝勉语气；将分词与命令式的关系自然化为中文。
- source_word: ὑπενέγκωσιν
  choice: 忍受
  rationale: 准确表达承受苦难或压力并坚持下来的含义，与前文“受过苦”形成呼应。
theological_decisions:
- issue: “右边座位”的身份与资格
  choice: 不解释其具体末世地位，只译作留给已经蒙上帝喜悦并为这名受苦之人的座位
  alternative: 明确译为殉道者在天国中的尊位
  rationale: 原文虽明显赋予右边荣誉意义，却没有在本节明确界定为殉道者或某一特定末世阶层，应保留其开放性。
- issue: “这名”的所指
  choice: 保留为“这名”
  alternative: 译作“主的名”或“基督的名”
  rationale: τοῦ ὀνόματος 本身未带明确限定；不在正文中补足所指，以保存原文的敬称式含蓄。
- issue: 将来与他们同坐的条件
  choice: 保留“持守纯朴”与“行他们所行、忍受他们所忍受”两方面表述
  alternative: 归纳为凭忠信或凭功德取得座位
  rationale: 原文同时保留品格、行为与忍受苦难之间的张力，不应将其系统化为单一教义公式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体；保留原文由过去叙事转入直接引语时的鲜明现场感，但将希腊语中略显生硬的重复调整为自然中文。专名 Ἑρμᾶ 译作“黑马”，与《黑马牧人》常见中文书名相协调。
