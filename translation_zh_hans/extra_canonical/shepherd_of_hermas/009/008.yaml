base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/008.yaml
  text: And after the young men withdrew and we were alone, she says to me, “Sit here.” I say to her, “Lady, let the elders sit first.” “What I tell you,” she says, “sit.”
translation:
  language: zh_hans
  text: 年轻人离开后，只剩下我们两人，她对我说：“坐在这里。”我对她说：“夫人，请让长者先坐。”她说：“我叫你坐下，你就坐下。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκους
  choice: 年轻人
  rationale: 按通常含义译出，既与上下文中的六位年轻人相接，也不额外赋予其身份。
- source_word: Κυρία
  choice: 夫人
  rationale: 保留尊称及与阴性对象说话的语境；“夫人”较为庄重自然，又不引入宗教头衔。
- source_word: πρεσβυτέρους
  choice: 长者
  rationale: 此处泛指应受礼让的年长或尊贵者；译作“长者”可保留其与教会职分“长老”之间的潜在歧义，而不贸然限定。
- source_word: Ὅ σοι λέγω … κάθισον
  choice: 照我对你说的，坐下
  rationale: 保留原文简短而带命令意味的表达，同时使现代汉语通顺。
theological_decisions:
- issue: πρεσβυτέρους 是否指教会长老
  choice: 译作“长者”
  alternative: “长老”
  rationale: 本句是关于座次礼让，原文未明确指定教会职分；采用较宽泛的“长者”以保存语义张力，避免加入制度性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留现在时引语框架的直接感，但汉语中以自然的对话衔接呈现。无脚注标记需要加入正文。
