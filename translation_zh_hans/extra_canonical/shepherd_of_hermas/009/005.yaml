base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/005.yaml
  text: Seeing these things set there and no one in the place, I was astonished, and a tremor, as it were, seized me, and my hair stood on end; and a shudder, as it were, came upon me, since I was alone. Then, coming to myself and remembering the glory of God, and taking courage, I knelt and again confessed my sins to the Lord, as before.
translation:
  language: zh_hans
  text: '我看见这些东西放在那里，那里却一个人也没有，就惊呆了；仿佛一阵战栗抓住了我，我的头发都竖了起来；我独自一人，仿佛一阵寒颤临到我身上。


    于是我回过神来，想起上帝的荣耀，鼓起勇气，屈膝，再次像先前一样向主承认我的罪。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκθαμβος
  choice: 惊愕
  rationale: 表达突然而强烈的震惊，符合场景，又保持现代汉语的庄重感。
- source_word: ὡσεί τρόμος με ἔλαβεν
  choice: 我仿佛浑身发抖
  rationale: 保留ὡσεί“仿佛”的修辞，同时用自然汉语呈现恐惧引起的战栗。
- source_word: αἱ τρίχες μου ὀρθαί
  choice: 头发都竖了起来
  rationale: 按希腊文意象直译，在现代汉语中也清楚自然。
- source_word: ὡσεί φρίκη μοι προσῆλθεν
  choice: 一阵寒战仿佛袭上身来
  rationale: φρίκη可指因恐惧而来的寒战；“袭上身来”保留其临到、侵袭的动态。
- source_word: ἐν ἐμαυτῷ οὖν γενόμενος
  choice: 随后，我定下神来
  rationale: 这是恢复镇定、重新控制自己的惯用表达，并非空间意义上的“进入自己里面”。
- source_word: τῆς δόξης τοῦ Θεοῦ
  choice: 上帝的荣耀
  rationale: 直译核心神学用语，不增添解释。
- source_word: ἐξωμολογούμην ... τὰς ἁμαρτίας μου
  choice: 向主再次承认自己的罪
  rationale: 此处宾语明确是“我的罪”，故译为认罪；避免“赞美”或一般性的“宣认”造成歧义。
theological_decisions:
- issue: ἐξομολογέομαι在此处的含义
  choice: 承认自己的罪
  alternative: 向主忏悔自己的罪
  rationale: 原文明确以“罪”为宾语，语义是认罪；“承认”较少带入后世特定礼仪或宗派制度色彩。
- issue: 神名θεός的中文形式
  choice: 上帝
  alternative: 神
  rationale: 采用现代标准普通话中庄重且广泛可懂的译称，不扩充原文的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体；保留原文两次ὡσεί所表达的近似感，并维持从惊恐、恢复镇定到认罪的动作次序。无脚注标记。
