  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/007.yaml
  text: And she raised me by the hand and leads me to the couch, and she says to the young men, “Go and build.”
translation:
  language: zh_hans
  text: 她拉着我的手扶我起来，领我到长榻旁，又对那些青年说：“你们去建造吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήγειρέ με τῆς χειρός
  choice: 拉着我的手扶我起来
  rationale: 表达她借着拉住赫尔马的手使他起身；“扶我起来”比直译“使我起来”更符合现代汉语动作描写。
- source_word: ἄγει με
  choice: 领我
  rationale: 保留叙事现在时所带来的现场感，同时用自然汉语承接前一动作。
- source_word: συμπέλιον
  choice: 长榻
  rationale: 该词在上下文中指可供坐卧、并铺有亚麻织物的家具；译作“长榻”既具体自然，也避免将其误作床或普通座椅。
- source_word: νεανίσκοις
  choice: 那些青年
  rationale: 对应前文已经出现的六名年轻男子，因此用“那些”体现已知所指；“青年”保持庄重简洁。
- source_word: Ὑπάγετε καὶ οἰκοδομεῖτε
  choice: 你们去建造吧
  rationale: 保留两个并列命令的基本语义；“吧”使现代汉语命令自然，但不削弱其指令性质。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原文由过去时转为历史现在时（“领……说”），译文以连贯的汉语动作链呈现现场感。无须添加脚注。
