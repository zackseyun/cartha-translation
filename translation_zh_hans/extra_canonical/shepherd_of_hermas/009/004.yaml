  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/004.yaml
  text: So I went, brothers, into the field, and I counted the hours, and I came to the place where I had directed her to come; and I see an ivory couch set there, and upon the couch there lay a linen pillow, and on top a spread-out towel of fine linen.
translation:
  language: zh_hans
  text: 弟兄们，于是我到了田间，计算时辰，来到我指定她前来的地方。只见那里摆着一张象牙榻，榻上放着一个亚麻布软垫，其上展开着一块细亚麻布。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεψήφισα τὰς ὥρας
  choice: 数算着时辰
  rationale: 保留按时辰推算、等候约定时间的动作；避免具体化为原文未明说的钟点计算方式。
- source_word: συμπέλιον ἐλεφάντινον
  choice: 象牙榻
  rationale: συμπέλιον 指供人坐卧的长榻或座榻；“象牙榻”简洁地保留材质及家具性质。
- source_word: κεβριδάριον λινόῦν
  choice: 亚麻布软垫
  rationale: 罕见词 κεβριδάριον 在此语境中指放在榻上的小垫或靠枕；译作“软垫”较自然，并保留 λινόῦν 所指的亚麻材质。
- source_word: λεντίον ... λινόῦν καρπάσιον
  choice: 一块细麻布
  rationale: λεντίον 可指布巾或布单，καρπάσιον 强调精细的亚麻织物；按其铺在软垫上的场景译作“细麻布”，不武断限定为毛巾。
- source_word: βλέπω
  choice: 只见
  rationale: 原文由过去叙事突然转为历史现在时，以增强现场感；汉语用“只见”自然再现这一鲜明转折。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代汉语。“弟兄们”保留叙述者对群体的直接称呼；家具和织物名称按上下文清楚表达，同时不对罕见希腊词作超过证据的精细限定。
