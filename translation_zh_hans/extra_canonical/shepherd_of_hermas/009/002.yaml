revisions:
- from: 我多次禁食，祈求主把他曾应许要借着那位老妇人指示我的启示显明给我。就在那天夜里，那位老妇人向我显现，说：“既然你这样有所欠缺，又热切想知道一切，就到你常停留的田野去；约在第五个时辰[a]，我会向你显现，把你必须看见的指示给你。”
  to: 我多次禁食，祈求主把他曾应许要借着那位老妇人向我显明的启示显明给我。就在那天夜里，那位老妇人向我显现，说：“既然你有这样的需要，又热切想知道一切，就到你常停留的田野去；约在第五个时辰[a]，我会向你显现，向你显示你必须看见的事。”
  rationale: 修订仅处理两处：以“有这样的需要”更自然地保留ἐνδεής的开放语义；以“向你显示你必须看见的事”准确反映δείξω及其内容从句。其余译文和时辰脚注均可保留。
