review_pass:
  verdict: revise
  source_fidelity: 草稿整体准确呈现了禁食、恳求、主所应许的启示、老妇人作为媒介、田野和第五时辰等要素。惟末句把ἃ δεῖ σε ἰδεῖν（“你必须看见的事”）处理成“把你必须看见的指示给你”，句法上容易成为“给你指示”，未清楚保留“显示所必须看见之事”的宾语关系。
  naturalness: “这样有所欠缺”在现代汉语中略显生硬，且“有所欠缺”常指能力或品格上的不足，不适合此处ἐνδεής所表达的“有需要／有所求”。“有这样的需要”较自然，也不把需要的性质限定为物质或属灵层面。
  terminology: “禁食”“祈求主”“启示”“显明／显示”“显现”均适合本段异象叙事及现代庄重语体。“老妇人”可保留，避免无根据地译为教会职衔。
  issues:
  - severity: medium
    issue: 末句“把你必须看见的指示给你”未清晰表达ἃ δεῖ σε ἰδεῖν为“显示”的内容。
    rationale: 希腊文δείξω σοι ἃ δεῖ σε ἰδεῖν意为“我将向你显示你必须看见的事”。修订使“事”成为显示的宾语，保留δεῖ的必要性与ἰδεῖν的视觉意味。
  - severity: low
    issue: “既然你这样有所欠缺”不够自然，且可能误导为人格或能力缺陷。
    rationale: ἐνδεής语义可指有需要、缺乏或有所求；“你有这样的需要”自然且保持开放，不擅自界定需要的性质。
