base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/002.yaml
  text: 'After fasting many times and pleading with the Lord to make known to me the revelation he had promised to show me through that aged woman, on that very night the aged woman appeared to me and said: “Since you are so needy and so eager to know everything, come to the field where you stay, and about the fifth hour I will appear to you and show you what you must see.”'
translation:
  language: zh_hans
  text: 我多次禁食，祈求主把他曾应许要借着那位老妇人向我显明的启示显明给我。就在那天夜里，那位老妇人向我显现，说：“既然你有这样的需要，又热切想知道一切，就到你常停留的田野去；约在第五个时辰[a]，我会向你显现，向你显示你必须看见的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第五个时辰”按当时通常从日出计时，约为上午十一点；实际钟点会随季节变化。
    reason: 现代读者不易理解古代时辰制，且不能将其机械等同于固定的现代钟点。
lexical_decisions:
- source_word: νηστεύσας πολλάκις
  choice: 多次禁食
  rationale: 保留分词所表达的先行情境及 πολλάκις 的反复意味，中文简洁自然。
- source_word: δεηθείς τοῦ Κυρίου
  choice: 祈求主
  rationale: δέομαι 在此指恳切请求；“祈求”既体现祷告语境，也不过度强化情绪。
- source_word: φανερώσῃ τὴν ἀποκάλυψιν
  choice: 把……启示显明给我
  rationale: 分别体现 φανερόω“显明”和 ἀποκάλυψις“启示”，避免把二者压缩为单一的“显示”。
- source_word: διὰ τῆς πρεσβυτέρας ἐκείνης
  choice: 借着那位老妇人
  rationale: διά 加属格表示媒介；πρεσβυτέρα 在叙事中是年长女性，译作“老妇人”比教会职衔“女长老”更合语境。
- source_word: οὕτως ἐνδεὴς εἶ
  choice: 你这样有所欠缺
  rationale: ἐνδεής 可指缺乏、匮乏或有需要；保留其语义开放性，不武断解释为“贫穷”或单纯“急需”。
- source_word: σπουδαῖος εἰς τὸ γνῶναι πάντα
  choice: 热切想知道一切
  rationale: σπουδαῖος 在此强调认真、殷切；译文用现代汉语自然表达其求知的迫切。
- source_word: εἰς τὸν ἀγρὸν ὅπου χρονίζεις
  choice: 到你常停留的田野去
  rationale: χρονίζεις 表示在那里逗留或久待；“常停留”不额外断定居住或工作的性质。
- source_word: περὶ ὥραν πέμπτην
  choice: 约在第五个时辰
  rationale: 保留古代计时名称，并以脚注说明大致现代时间；περί 译作“约在”。
- source_word: ἃ δεῖ σε ἰδεῖν
  choice: 你必须看见的
  rationale: 保留 δεῖ 的必要性以及 ἰδεῖν 的视觉性，与异象叙事相符。
theological_decisions:
- issue: 启示的来源与媒介
  choice: “主……曾应许要借着那位老妇人指示我的启示”
  alternative: “老妇人曾应许代表主向我显示的启示”
  rationale: 希腊文中 ἐπηγγείλατο 的主语按近接和语流最自然地回指“主”，而 διὰ τῆς πρεσβυτέρας 表明老妇人是媒介；译文不把她写成启示的最终来源。
- issue: ἐνδεής 的含义
  choice: “有所欠缺”
  alternative: “贫乏”“有需要”“求知若渴”
  rationale: 原词含义较宽，可能指缺乏或需求；采用略带开放性的表达，以免把老妇人的评价限定为物质贫穷或单纯的求知欲。
- issue: “必须看见”的必要性
  choice: 保留“必须”
  alternative: “该看见”“将要看见”
  rationale: δεῖ 带有必要、应当之意；保留其张力，但不进一步说明这是神命定、道德义务或叙事需要。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“老妇人”保持人物称谓的一致性；“田野”“显现”“启示”等词保留早期基督教异象文本的语体。仅在古代计时处加注，正文中的脚注标记与脚注对应。
