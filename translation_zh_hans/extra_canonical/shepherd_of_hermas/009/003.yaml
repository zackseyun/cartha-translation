base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/003.yaml
  text: I asked her, saying, “Lady, to what place in the field?” “Wherever you wish,” she says. I chose a good, secluded spot. But before I spoke to her and named the place, she says to me, “I will come there where you wish.”
translation:
  language: zh_hans
  text: 我问她说：“夫人，田野里的什么地方？”她说：“随你愿意。”我选了一个不错而僻静的地方。可是，我还没有同她说话，也还没有告诉她那地方，她就对我说：“你愿意在哪里，我就到哪里去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: 夫人
  rationale: 这是赫尔马对那位年长妇人的尊称；“夫人”既保留礼敬语气，也符合现代汉语叙事。
- source_word: ἀγρός
  choice: 田野
  rationale: 在此指前文约定前往的郊野或田地；译作“田野”自然且不把范围过度限定为农场。
- source_word: τόπος καλὸς ἀνακεχωρηκότα
  choice: 一个清幽的好地方
  rationale: ἀνακεχωρηκότα 表示远离人群、僻静；“清幽”在此自然传达隐退、 secluded 的意味，同时保留 καλὸς 的正面评价。
- source_word: Ἥξω ἐκεῖ ὅπου θέλεις
  choice: 你愿意在哪里，我就到那里去
  rationale: 保留原文对地点选择的开放表达，并以自然汉语呈现 ἐκεῖ 与 ὅπου 的对应关系。
