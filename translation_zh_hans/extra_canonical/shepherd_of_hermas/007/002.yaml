revisions:
- from: 但使你得救的是：你没有离弃永活的上帝，以及你的纯朴和极大的节制。只要你持守这些，它们就已经救了你；凡这样行、以无恶和纯朴为人生道路的人，它们也都救他们。这些人胜过一切邪恶，并且常存，直到永生。
  to: 但救你的是：你没有离开永活的上帝，以及你的纯朴和极大的节制。只要你持守这些，这些已经救了你；这些也拯救所有这样行、以不怀恶意和纯朴而行的人。这些人胜过一切邪恶，并且存留到永生。
  rationale: 修改仅解决中文代词指向和自然度问题。“这些”在第二句仍综合指向未离开活着的上帝、纯朴和极大的节制；末句“这些人”则明确回指前句的实践者，反映οὗτοι的阳性复数。保留原文完成时与条件句之间未加解释的张力，也保留“拯救”与德行实践的直接措辞。
