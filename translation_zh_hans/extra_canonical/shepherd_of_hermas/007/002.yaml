base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/002.yaml
  text: But what saves you is that you did not depart from the living God, and your simplicity and great self-control. These have saved you, if you continue in them, and they save all who do such things and who walk in innocence and simplicity. These prevail over all wickedness and remain unto eternal life.
translation:
  language: zh_hans
  text: 但救你的是：你没有离开永活的上帝，以及你的纯朴和极大的节制。只要你持守这些，这些已经救了你；这些也拯救所有这样行、以不怀恶意和纯朴而行的人。这些人胜过一切邪恶，并且存留到永生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σῴζει
  choice: 使……得救／救
  rationale: 保留动词的救援、保全含义，并顺应汉语句法分别译为“使你得救”和“救他们”。
- source_word: ἁπλότης
  choice: 纯朴
  rationale: 表达单纯、诚实、不诡诈的品格，同时避免将词义收窄为“头脑简单”。
- source_word: ἐγκράτεια
  choice: 节制
  rationale: 指自我约束和克制，是现代中文宗教与伦理语境中自然且准确的对应词。
- source_word: ἀκακία
  choice: 无恶
  rationale: 较直接地保留“不怀恶意、没有邪恶”的含义，并与后文“邪恶”形成词义呼应。
- source_word: ἐμμένῃς
  choice: 持守
  rationale: 表达持续坚守、不离开这些品格与实践。
- source_word: κατισχύουσιν
  choice: 胜过
  rationale: 体现占优势、制胜的力度，主语按希腊文最近的先行词理解为“这些人”。
- source_word: παραμένουσιν εἰς ζωὴν αἰώνιον
  choice: 常存，直到永生
  rationale: 保留“持续、存留”以及趋向永生的表达，不将其解释性扩展为特定救恩次序。
theological_decisions:
- issue: “这些已经救了你”与“只要你持守”的条件关系
  choice: 保留完成时“已经救了你”和条件句“只要你持守这些”之间的张力
  alternative: 译成“只要你持守这些，它们就会救你”
  rationale: 原文 ταῦτα σέσωκέν σε 使用完成时，而 ἐὰν ἐμμένῃς 明示条件；不应为追求逻辑平顺而消除其时态与条件之间的张力。
- issue: 得救与德行实践的关系
  choice: 直译为“纯朴和节制……救了你／救他们”
  alternative: 解释为“这些证明了你的信心，因此你得救”
  rationale: 原文直接以这些品格为 σῴζει 的相关主语或因素；译文不额外加入经文未明说的系统神学解释。
- issue: “这些人”所指
  choice: 指凡这样行并以无恶和纯朴为人生道路的人
  alternative: 将主语理解为前述德行本身
  rationale: οὗτοι 是阳性复数，最自然地回指前面的 τοὺς……ἐργαζομένους καὶ πορευομένους，即这些人。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“永活的上帝”“持守”“直到永生”保留早期基督教文本的宗教语域；避免过度古雅，也不加入原文没有的宗派术语。
