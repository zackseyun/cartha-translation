base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/001.yaml
  text: But you, Hermas, no longer bear a grudge against your children, nor allow your sister to continue, so that they may be cleansed from their former sins. For they will be disciplined with righteous discipline, if you do not bear a grudge against them. Bearing a grudge produces death. But you, Hermas, have had great personal tribulations because of the transgressions of your household, because you did not care for them, but neglected them and became entangled in your wicked business dealings.
translation:
  language: zh_hans
  text: 但你，黑马，不要再对你的儿女怀恨；也不要听任你的姊妹继续下去，好使他们从先前的罪中得洁净。因为，如果你不再对他们怀恨，他们就会受到公义的管教。怀恨会导致死亡。但你，黑马，因你一家人的过犯，已经遭受了许多切身的患难；这是因为你没有关心他们，反倒疏忽了他们，又卷入你那些邪恶的营生之中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησικακήσῃς / μνησικακία
  choice: 怨恨
  rationale: 指记恨、怀怨并不肯放下；“怨恨”自然明确，也保留其强烈的道德含义。
- source_word: τὴν ἀδελφήν σου ἐάσῃς
  choice: 听任你的姊妹继续下去
  rationale: 原文省略了她继续做什么，保持这种未明说的状态，不擅自补入“犯罪”等解释。
- source_word: παιδευθήσονται ... παιδείᾳ δικαίᾳ
  choice: 受到公正的管教
  rationale: 保留 παιδεύω / παιδεία 所含的纠正、训练或惩戒意味，并以“公正”表达 δικαίᾳ。
- source_word: ἰδιωτικὰς
  choice: 切身的
  rationale: 在此修饰患难，表示与黑马本人或其私人生活密切相关；“切身的”比生硬的“私人的”更符合现代汉语。
- source_word: παρενεθυμήθης
  choice: 疏忽了
  rationale: 该词在此语境指未将家人的情况放在心上、予以忽略，与前句“不关心”形成递进。
- source_word: πραγματείαις ... πονηραῖς
  choice: 邪恶的营生
  rationale: πραγματεία 可指事务、经营或生意活动；“营生”保留一定范围，不把含义过度限定为具体商业交易。
- source_word: συνανεφύρης
  choice: 卷入
  rationale: 表达混杂、纠缠其中的意思，符合汉语习惯，并传达其被事务牵连缠住的状态。
theological_decisions:
- issue: 不再怨恨与儿女受管教、得洁净之间的关系
  choice: 按原文保留条件与目的关系，不解释其具体救赎机制
  alternative: 将其改写为父亲饶恕便直接赦免儿女的罪
  rationale: 原文说“不怨恨”是他们受到公正管教的条件，并以“好使”连接得洁净；不宜据此引入关于赦罪方式的特定教义。
- issue: “怨恨会导致死亡”的死亡性质
  choice: 直译为“死亡”，不限定为肉体或属灵死亡
  alternative: 译为“属灵的死亡”或“永远灭亡”
  rationale: 原文 θάνατον 未作限定，应保留其警告的张力与开放性。
- issue: 姊妹所继续之事
  choice: 保留宾语省略
  alternative: 补译为“继续犯罪”或“任性而行”
  rationale: 希腊文仅说不要听任她，并未明说其行为；补足会消除原文的真实含混。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。人名 Ἑρμᾶ 译作“黑马”，与早期基督教文献常见中文译名相合；句法适度汉语化，同时保留原文重复“怨恨”所形成的劝诫力度。
