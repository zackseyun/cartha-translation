base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/004.yaml
  text: 'And you shall say to Maximus: Behold, tribulation is coming, if it seems good to you to deny again. The Lord is near to those who turn to him, as it is written in Eldad and Modat, who prophesied to the people in the wilderness.'
translation:
  language: zh_hans
  text: 你要对马克西穆斯说：“看哪，患难将要来到——如果你还想再次否认的话。[a]”主亲近归向他的人，正如《伊利达和米达》[b]中所记的：他们曾在旷野向百姓说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如果你还想再次否认的话”直译为“若再次否认在你看来合适”。原文没有说明所否认的对象，且条件句带有警告意味；这里不补出“主”或“信仰”。
    reason: 保留ἐὰν σοι δοκῇ πάλιν ἀρνεῖσθαι的条件性、语气张力和ἀρνεῖσθαι宾语省略。
  - marker: b
    text: 直译为“在《伊利达和米达》中”。这通常被认为是对一部以二人为名、现已失传或身份未明的文献（或引文传统）的提及。二人也见于《民数记》11:26–29；不宜据此断定这里所引必与该段经文完全相同。
    reason: 说明ἐν τῷ Ἐλδὰδ καὶ Μωδὰτ所指文献的争议性，并避免与《民数记》传统作无根据的等同。
lexical_decisions:
- source_word: θλίψις
  choice: 患难
  rationale: 既可涵盖逼迫与困苦，也保留原词未明确限定患难性质的宽度。
- source_word: ἐάν σοι δοκῇ
  choice: 你若以为可以
  rationale: 较贴近“若你觉得合宜/若你愿意”的措辞，并保留其带有警告或反讽意味的语气。
- source_word: πάλιν ἀρνεῖσθαι
  choice: 再否认
  rationale: 保留宾语未明的状态；上下文可能指否认主或信仰，但不在正文中擅自补足。
- source_word: τοῖς ἐπιστρεφομένοις
  choice: 那些回转归向他的人
  rationale: ἐπιστρέφω兼有转回与归向之意；补出“他”使现代汉语自然，并依上下文指向主。
- source_word: Ἐλδὰδ καὶ Μωδὰτ
  choice: 伊利达和米达
  rationale: 按希腊文本音译两个人名，同时将其作为古代著作题名处理；与常见《民数记》人名译法可能不同，故加注。
theological_decisions:
- issue: “再否认”的对象
  choice: 不补出“主”或“信仰”
  alternative: 译为“再否认主”或“再次背弃信仰”
  rationale: 希腊文ἀρνεῖσθαι在此未带明示宾语；虽可能涉及逼迫下的否认信仰，仍应保存文本的省略与张力。
- issue: 主亲近谁
  choice: 译作“回转归向他的人”
  alternative: 译作“悔改的人”
  rationale: “悔改”具有合理神学含义，但原词本身更直接表达转回；正文兼顾动作意象与所归向的对象。
- issue: 《伊利达和米达》的文献身份
  choice: 按引文题名呈现，并以脚注说明
  alternative: 直接等同于《民数记》中的伊利达和米达事件
  rationale: 文本说“正如……中所记”，似指一部以二人为名、现已失传或身份不明的著作，不应无注释地与正典叙事完全等同。
translation_notes:
  register: 采用现代、庄重且便于朗读的简体中文。“看哪”保留先知式警告语气；句法略作现代化处理，但保留条件句的尖锐感、否认对象的省略，以及失传文献引语的不确定性。
