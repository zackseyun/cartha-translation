  text: Blessed are all who practice righteousness; they will never be destroyed.
translation:
  language: zh_hans
  text: 凡行公义的人都有福了；他们永远不会败亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 采用自然庄重的现代汉语表达，保留宣告蒙福状态的语气。
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: 行公义的人
  rationale: 直译其持续实行正义之意，同时避免将“公义”缩减为一般善行。
- source_word: οὐ διαφθαρήσονται
  choice: 不会败亡
  rationale: διαφθείρω可指毁坏、败坏或灭亡；“败亡”在此保留终局性毁灭的含义，又不额外断定具体方式。
- source_word: ἕως αἰῶνος
  choice: 永远
  rationale: 以现代汉语惯用表达传达无限延续的时间意义。
theological_decisions:
- issue: 行公义与最终不败亡之间的关系
  choice: 保留原文直接并列的福分宣告与应许，不补入因果限定
  alternative: 译成“因为他们行公义，所以必得救”
  rationale: 原文没有明确使用因果连词，也没有出现“得救”一词；不应替文本预先解决行为与救恩关系的神学张力。
translation_notes:
  register: 采用简洁、庄重而易懂的箴言式宣告；“凡……都……”自然体现 πάντες 的全称范围。
