base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/006.yaml
  text: 6. The stones hauled up from the deep they set, every one, into the building just as they were; for they were fitted and matched the joining with the other stones, and so were joined to one another, so that their joint was not visible. The construction of the tower appeared as if it had been built from a single stone.
translation:
  language: zh_hans
  text: 6. 那些从水底拉上来的石头，他们全都照原样砌进塔的建造中；因为这些石头已经嵌合妥当，与别的石头的接缝相合。它们就这样彼此紧密相连，以致看不出它们之间的缝隙。整座塔看上去仿佛是用一块石头建成的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ βυθοῦ
  choice: 从水底
  rationale: 在本段建塔于水上的异象语境中，βυθός指水的深处或底部；译作“水底”自然明确，又不额外赋予“无底坑”等神学含义。
- source_word: ἡρμοσμένοι
  choice: 已经凿配妥当
  rationale: 该词表示石块已被配合、嵌合妥当；“凿配”符合石工语境，也为后文接缝吻合提供自然衔接。
- source_word: συνεφώνουν τῇ ἁρμογῇ
  choice: 接缝也与别的石头吻合
  rationale: 保留原文关于各石块在拼接处彼此相合的具体意象，现代中文表达清楚。
- source_word: ἐκολλῶντο ἀλλήλοις
  choice: 彼此紧密相接
  rationale: 原词有黏合、紧密结合之意；在砌石语境中译作“紧密相接”比字面“粘住”更自然。
- source_word: ὡς ἐξ ἑνὸς λίθου
  choice: 仿佛是用一块石头
  rationale: 忠实保留比较结构，说明无缝结合所造成的视觉效果，并非断言塔实际由单块石头造成。
theological_decisions:
- issue: 从深处取出的石头是否带有特定象征身份
  choice: 正文只呈现异象中的“从水底拉上来的石头”，不在译文中解释其象征意义
  alternative: 在正文中将石头解释为殉道者、受洗者或其他特定群体
  rationale: 本句本身只描写建塔过程；象征解释应由后文或注释依据文本明确说明，不宜提前引入宗派性或推测性的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“砌进建筑里”“凿配妥当”“接缝吻合”保持建塔场景的具体性；句式略作拆分，以清楚呈现原因、结合方式及最终视觉效果。
