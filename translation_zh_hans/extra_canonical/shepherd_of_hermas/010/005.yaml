base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/005.yaml
  text: 5. The tower was being built in a square by the six young men who had come with her; and myriads of other men were bringing stones, some from the deep and others from the land, and were handing them to the six young men. They would take them and build.
translation:
  language: zh_hans
  text: 5. 这座塔正由那六个随她一同前来的青年按四方形的样式建造；另有成千上万的人搬来石头，有的从水的深处搬来，有的从陆地搬来，交给那六个青年；他们接过石头，便用来建造。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τετραγώνῳ
  choice: 呈四方形
  rationale: 表达塔的建造格局为四方形，同时避免生硬直译为“在四方形中”。
- source_word: νεανίσκων
  choice: 青年
  rationale: 指年轻男子；“青年”自然、庄重，也与异象叙事的文体相称。
- source_word: μυριάδες ἀνδρῶν
  choice: 成千上万的人
  rationale: μυριάδες可指极多、无数；此处采用现代汉语常用表达，保留人数众多之意，不强行理解为精确的一万倍数。
- source_word: ἐκ τοῦ βυθοῦ
  choice: 从深水中
  rationale: βυθός指水的深处或深渊；上下文与塔建在水上相关，译作“深水中”较具体自然，同时不增添海洋等原文没有的信息。
- source_word: ἐκ τῆς γῆς
  choice: 从地上
  rationale: 与“从深水中”形成原文的空间对照；γῆ在此可指陆地或地面，“地上”保留一定宽度。
- source_word: ᾠκοδόμουν
  choice: 用来建造
  rationale: 承接接过石头的动作，汉语补出“用来”使逻辑自然，所补意义已隐含于原文。
theological_decisions:
- issue: 六个青年与建塔行为的身份和象征意义
  choice: 仅按异象所见译为“六个青年”，不在正文中解释其象征身份
  alternative: 将其解释为天使或特定属灵群体
  rationale: 本节原文本身未明说其身份；保留叙事的渐进启示和神学张力。
- issue: “从深水中”搬出的石头所象征的对象
  choice: 不在正文中作寓意解释
  alternative: 直接译释为殉道者、受洗者或死者
  rationale: 这些象征意义需由后文解释，不能提前把某种诠释写入译文。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。句式尽量贴近希腊文的动作次序：建塔、搬石、交付、接取、建造；不加入原文未明说的象征解释。
