base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/003.yaml
  text: 3. After she had said these things, she wanted to depart; but I fell at her feet and asked her by the Lord to show me the vision that she had promised me.
translation:
  language: zh_hans
  text: 3 她说完这些话，就要离去；我便伏在她脚前，凭着主恳求她把所应许的异象指给我看。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν δὲ αὐτῆς πρὸς τοὺς πόδας
  choice: 我却俯伏在她脚前
  rationale: 直译为“落在她脚前”，此处是恳求者俯伏于对方脚前的姿态；“俯伏”自然、庄重，也保留动作的强烈程度。
- source_word: ἠρώτησα
  choice: 恳求
  rationale: 该动词可指询问或请求；后接目的从句，且有俯伏在脚前的语境，因此译为“恳求”最贴切。
- source_word: κατὰ τοῦ Κυρίου
  choice: 奉主的名
  rationale: 该短语在此表示以主为凭据而郑重请求；“奉主的名”符合现代汉语表达，同时避免扩展为原文未明说的誓言。
- source_word: ἐπιδείξῃ
  choice: 指给我看
  rationale: 保留“展示、使看见”的具体视觉含义，并与后面的“异象”自然搭配。
- source_word: ὃ ἐπηγγείλατο ὅραμα
  choice: 所应许的异象
  rationale: 希腊语关系结构修饰“异象”，意为她曾应许的那个异象；简洁重组为现代汉语定中结构。
theological_decisions:
- issue: κατὰ τοῦ Κυρίου 所表达的郑重请求方式
  choice: 奉主的名恳求她
  alternative: 指着主恳求她／凭主恳求她
  rationale: 原文措辞并不完全等同于固定的起誓公式。“奉主的名”表达诉诸主之权威的郑重性，却不武断地把它解释成正式誓言。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“她说完这些话，就要离去”保持动作顺序；分号凸显她离去与叙述者俯伏恳求之间的转折。无须脚注。
