base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/008.yaml
  text: 8. Many other stones lay around the tower, and they were not using them for the building—for some of them were scabby, others had cracks, others were mutilated, others were white and round, not fitting for the building.
translation:
  language: zh_hans
  text: 8 还有许多石头散放在塔的周围，没有被用来建造；因为其中有些长了癣斑，有些带着裂缝，有些残缺不全，还有些白而圆，不适合用于建造。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: 长了癣斑
  rationale: 该词本义为患疥癣、表面有癣状病斑；用于石头时保留原文生动而略显异常的拟人化描写。
- source_word: σχισμὰς ἔχοντες
  choice: 带着裂缝
  rationale: 直译其可见的结构缺陷，语言自然清楚。
- source_word: κεκολοβωμένοι
  choice: 残缺不全
  rationale: 词义为被削短、截去一部分或致残；此处形容石头缺损，采用不限定具体损坏方式的表达。
- source_word: λευκοὶ καὶ στρογγύλοι
  choice: 洁白圆滑
  rationale: λευκός为白，στρογγύλος为圆；“圆滑”在石材语境中自然，也说明其难以砌合，但不额外解释象征意义。
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: 不适合用来建造
  rationale: 表达这些石头在形状上不能与建筑砌合；保留原文结论而不增添原因。
theological_decisions:
- issue: 各类石头的象征意义
  choice: 仅呈现异象中的外观与是否适合建造，不在正文中解释其所指
  alternative: 把石头直接译成某类信徒或道德状态
  rationale: 本段本身尚未解释象征；提前释义会消除叙事张力，并把后文解释导入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“散放在塔的周围”对应石头环绕塔而卧放的画面；分号保留原文先陈述、后列举原因的结构。
