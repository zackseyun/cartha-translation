  text: 4. And again she took hold of my hand, raised me up, and seated me on the bench on the left; and she herself sat on the right. And, lifting up a certain bright rod, she says to me, “Do you see a great thing?” I say to her, “Lady, I see nothing.” She says to me, “[You,] look—do you not see opposite you a great tower being built upon the waters with square, shining stones?”
translation:
  language: zh_hans
  text: 4 她又拉住我的手，把我扶起来，让我坐在左边的长椅上；她自己则坐在右边。她举起一根发亮的杖，对我说：“你看见一个壮观的景象吗？”我对她说：“夫人，我什么也看不见。”她对我说：“你看！难道你没有看见，在你对面有一座大塔，正用方正、发亮的石头建造在水上吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάβετό μου τῆς χειρὸς
  choice: 拉住我的手
  rationale: 准确表达她抓住、握住叙述者之手的动作，同时符合现代汉语叙事习惯。
- source_word: συμπλέσιον
  choice: 长椅
  rationale: 此处指可供坐卧的座具；结合左右座位的语境，译为“长椅”自然清楚。
- source_word: ῥάβδον τινα λαμπράν
  choice: 一根明亮的杖
  rationale: 保留τινα的不定意味和λαμπράν的视觉特征，不擅自说明材质或用途。
- source_word: μέγα πρᾶγμα
  choice: 一件宏伟的事
  rationale: μέγα既可指“大”也可表达令人惊叹的重要景象；“宏伟”与随后出现的大塔相应。
- source_word: πύργον μέγαν
  choice: 一座大塔
  rationale: 直译核心意象，保持异象叙述的具体性。
- source_word: ἐπὶ ὑδάτων
  choice: 建造在水上
  rationale: 保留复数形式所表达的广阔水域意象；汉语中用“水上”最自然。
- source_word: λίθοις τετραγώνοις λαμπροῖς
  choice: 用方正而明亮的石头
  rationale: τετράγωνος指四方、方正；λαμπρός指明亮、光亮，按原文并列保留两项特征。
theological_decisions:
- issue: 塔建造在水上的象征意义
  choice: 仅按异象画面直译，不在正文中解释
  alternative: 把水明确解释为洗礼或生命
  rationale: 本句本身没有给出象征解释；提前释义会消除文本随后可能展开的神学张力。
- issue: 左右座位的价值含义
  choice: 保留“左边”“右边”的空间描述
  alternative: 把右边意译为尊位、左边意译为次位
  rationale: 上下文虽赋予左右位置某种荣誉差别，本句仍是具体动作描写，不应将解释并入译文。
- issue: κύρια的称呼
  choice: 夫人
  alternative: 女主人／主母
  rationale: 此处是赫马对女性异象人物的尊称；“夫人”庄重自然，又不赋予神性称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留异象画面的具体细节与问答节奏。原文中的[Σὺ,]属于文本存疑或可能多余的读法；译文以自然的“你看！”承载其强调语气，未另设脚注。
