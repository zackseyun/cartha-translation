base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/002.yaml
  text: 2. “But you are eager to sit on the right with them; yet your shortcomings are many. Still, you will be cleansed from your shortcomings, and all who are not double-minded will be cleansed from all their sins up to this day.”
translation:
  language: zh_hans
  text: 2. “你渴望和他们一同坐在右边，但你的不足还很多。不过，你将从这些不足中得洁净；凡不心怀二意的人，也都将从他们直到今日所犯的一切罪中得洁净。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到今日”按通常理解限定“罪”，即直到说话当日所犯的罪；在希腊文中，这一短语也可被理解为与“得洁净”的时间相关。
    reason: 保留介词短语εἰς ταύτην τὴν ἡμέραν可能的修饰范围歧义，而不在正文中作过强断定。
lexical_decisions:
- source_word: κατεπίθυμος
  choice: 很渴望
  rationale: 表达强烈愿望，既保留原词的强调语气，又符合现代汉语习惯。
- source_word: τὰ ὑστερήματά σου
  choice: 你的亏欠
  rationale: ὑστέρημα可指缺失、不足或缺欠；此处与后文罪形成关联，但不宜直接等同于罪，故保留较宽泛的“亏欠”。
- source_word: διψυχοῦντες
  choice: 心怀二意的人
  rationale: 直译其“两个心思、摇摆不定”的含义，并保留《牧人书》中这一重要伦理概念。
- source_word: τῶν ἁμαρτημάτων
  choice: 罪
  rationale: 在宗教伦理语境中自然准确地表达ἁμάρτημα，避免使用生硬的“罪过行为”。
- source_word: εἰς ταύτην τὴν ἡμέραν
  choice: 截至今日
  rationale: 保留时间界限的自然理解，即累积至当日的一切罪；原短语也可能与得洁净的时间相关，故在注释中说明歧义。
theological_decisions:
- issue: “亏欠”与“罪”的关系
  choice: 分别译为“亏欠”和“罪”
  alternative: 两处都译作“罪”
  rationale: 原文分别使用ὑστέρημα与ἁμάρτημα，不应在译文中抹平二者可能存在的语义差别。
- issue: 洁净陈述的语气
  choice: 译为“必得洁净”
  alternative: “将会被洁净”
  rationale: 希腊文为将来被动式，译作“必得洁净”可自然保留被动含义及肯定语气，但不额外说明施行洁净者或具体方式。
- issue: “截至今日”的修饰范围
  choice: 连接“一切罪”
  alternative: 连接“必得洁净”，译为“在今日得洁净”
  rationale: 语序最自然地支持“截至今日所犯的一切罪”，但原文介词短语存在一定附着歧义，宜以脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“心怀二意”保留早期基督教劝诫语境中的核心意象；“亏欠”与“罪”刻意区分。正文需要加入脚注标记[a]以与脚注对应。
