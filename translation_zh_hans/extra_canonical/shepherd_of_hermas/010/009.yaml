review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实呈现异象叙述：石头被抛离塔、来到路上却滚入无路之处，另有落火及近水者。未擅自加入象征解释。惟“被烧着了”在现代汉语中较易理解为“被点燃”，不够贴合石头落火后持续受焚的画面；末句“滚进水里、进入水中”重复而不自然。
  naturalness: 整体庄重流畅。“无路之地”可理解，但“无路之处”更合现代叙事语感。“被烧着了”及“滚进水里、进入水中”建议调整。
  terminology: “塔”“路”“火”“水”及“滚”均一致且准确。“无路之处”保留ἀνοδία与“路”的反差，不将其具体化为“荒野”。
