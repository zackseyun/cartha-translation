base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/009.yaml
  text: 9. And I saw other stones being thrown far from the tower and coming into the road, and not remaining in the road but rolling into the wasteland; others falling into fire and being burned; others falling near waters and not being able to roll into the water, though they wanted to roll and come into the water.
translation:
  language: zh_hans
  text: 9. 我又看见另一些石头被扔到离塔很远的地方，来到路上；它们没有留在路上，反而滚进了无路之处。另一些落入火中，正被火烧着；还有一些落在水边，虽然想滚过去，进入水中，却无法这样做。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοδίαν
  choice: 无路之地
  rationale: 该词指没有道路、难以通行之处；译作“无路之地”既保留与前文“路”的对照，也避免擅自具体化为“荒野”。
- source_word: ἐπὶ πῦρ ἐμπίπτοντας
  choice: 落入火中
  rationale: 用自然的现代汉语表达石头坠入火里的动态，不增添原文未明说的象征解释。
- source_word: καιομένους
  choice: 被烧着了
  rationale: 保留现在分词所呈现的受烧状态；不强化为“烧毁”或“焚尽”。
- source_word: ἐγγὺς ὑδάτων
  choice: 水边
  rationale: 希腊文使用复数“水域/水”，此处汉语用集合性表达“水边”最自然，并保留靠近而尚未进入水中的空间关系。
- source_word: κυλισθῆναι
  choice: 滚进
  rationale: 石头的运动方式是滚动；译文重复这一意象，以对应前文滚离道路的石头。
theological_decisions:
- issue: 石头、道路、火与水的象征意义
  choice: 仅翻译异象所见，不在正文中解释象征
  alternative: 将其直接释义为不同类别的人及其属灵结局
  rationale: 本节原文只描述异象，解释出现在后续语境；提前释义会消除叙事张力并加入原文未明说的神学判断。
- issue: θέλοντων所表达的意愿
  choice: 译为“虽然想……却……”
  alternative: 译为“试图……却……”
  rationale: 原文明确表达愿望或意愿，而不必然表示已经采取尝试；“想”较准确地保留这一差别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“路—无路之地”“水边—水中”的空间对照及反复出现的“滚”这一视觉动作，不添加象征解释。
