  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/001.yaml
  text: '1. “What,” I said, “did they endure?” She says, “Listen: scourges, imprisonments, great afflictions, crosses, wild beasts—for the sake of the Name. For this reason the right-hand parts of the sanctuary belong to them, and to whoever suffers because of the Name; but the left-hand parts belong to the rest. Yet for both, those sitting on the right and those on the left, the gifts are the same and the promises the same—only those on the right sit there and have some glory.”'
translation:
  language: zh_hans
  text: 1 我说：“他们忍受了什么？”她说：“你听：鞭打、监禁、极大的患难、十字架、野兽——这一切都是为了那名[a]。因此，圣所右边的位置属于他们，也属于所有为那名受苦的人；左边的位置则属于其余的人。不过，无论坐在右边的，还是坐在左边的，所得的恩赐相同，所蒙的应许也相同；只是那些人坐在右边，并享有某种荣耀。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那名”：原文仅作“那名”，没有明说具体名字；在早期基督教语境中，这通常是对主名的含蓄指称。
    reason: 说明语境中的通常理解，同时保留原文未明说具体名字的措辞。
lexical_decisions:
- source_word: ὑπήνεγκαν
  choice: 忍受了
  rationale: 准确表达承受并经受苦难，符合此处列举逼迫遭遇的语境。
- source_word: μάστιγας
  choice: 鞭打
  rationale: 此处指遭受鞭刑，用现代汉语“鞭打”比字面“鞭子”更自然。
- source_word: φυλακάς
  choice: 监禁
  rationale: 复数名词在此表示被囚禁的经历，而非具体监狱建筑。
- source_word: σταυρούς
  choice: 十字架
  rationale: 保留复数苦难清单中的具体意象；汉语不必显式标示复数。
- source_word: θηρία
  choice: 野兽
  rationale: 直译其在殉道与迫害语境中的具体威胁，不增补“被投入”等原文未明说的动作。
- source_word: τὸ ὄνομα
  choice: 那名
  rationale: 保留原文以定冠词指称但不明说对象的表达，使其神学指涉不被译文擅自补足。
- source_word: τὰ δεξιὰ μέρη τοῦ ἁγιάσματος
  choice: 圣所右边的位置
  rationale: “位置”自然传达 μέρη 在座次语境中的区域含义，同时保留 ἁγίασμα 的圣所意象。
- source_word: δόξαν τινά
  choice: 一份荣耀
  rationale: τινά 表示某种或一定程度的荣耀；“一份”保留其非绝对化、略有限定的语气。
theological_decisions:
- issue: “那名”的指涉
  choice: 正文保留“那名”，脚注说明在语境中指主的名
  alternative: 直接译作“主的名”或“耶稣的名”
  rationale: 原文只写 τὸ ὄνομα。保留其早期基督徒文本中庄重而含蓄的称谓方式，同时用脚注帮助现代读者理解。
- issue: 左右两边所得与荣耀的关系
  choice: 明确保留“恩赐相同、应许相同”，同时保留右边者另有“一份荣耀”
  alternative: 将荣耀解释为更高奖赏或纯粹荣誉座次
  rationale: 原文并置了相同的恩赐和应许与右边者所享有的某种荣耀，不宜消解这一张力或具体规定荣耀的性质。
- issue: 因那名受苦者的范围
  choice: 译为“所有为那名受苦的人”
  alternative: 限指殉道者
  rationale: ὃς ἐὰν πάθῃ 是开放性的单数泛指，涵盖任何因那名受苦者，原文没有限定为死亡殉道。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。保留问答节奏、苦难项目的累列，以及左右座次与同等恩赐之间的神学张力；不把“圣所”改释为特定教会制度或末世等级。
