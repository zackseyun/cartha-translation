  text: 7. But of the other stones being brought from the dry land, some they were rejecting, and some they were putting into the building; others they were cutting and throwing far from the tower.
translation:
  language: zh_hans
  text: 7 至于那些从陆地运来的石头，他们有的丢弃，有的砌进建筑里；另有一些，他们凿碎后扔到离塔很远的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῆς ξηρᾶς
  choice: 从旱地
  rationale: 直译为“从干地”，与前文“从深水中”形成明确对照；“旱地”在现代汉语中自然且保留地理意象。
- source_word: ἀπέβαλλον
  choice: 丢弃
  rationale: 表示经检视后弃置不用，符合建塔语境，也保留未说明弃置原因的开放性。
- source_word: ἐτίθουν εἰς τὴν οἰκοδομήν
  choice: 砌进建筑里
  rationale: 在石造建筑语境中，“砌进”比泛泛的“放进”更自然，同时不把“建筑”擅自等同于塔本身。
- source_word: κατέκοπτον
  choice: 砍碎
  rationale: 该动词含砍下、砍成碎块之意；结合随后远远扔掉，译作“砍碎”比“修整”更符合语势。
- source_word: μακρὰν ἀπὸ τοῦ πύργου
  choice: 离塔很远的地方
  rationale: 准确表达与塔相距甚远，采用自然现代汉语语序。
theological_decisions:
- issue: 石头被丢弃或砍碎的象征意义
  choice: 不在正文中解释其象征对象或最终命运
  alternative: 将其明确解释为被教会或救恩排除的人
  rationale: 本节只叙述异象中的动作，象征解释尚未在此给出；应保留叙事张力，避免提前引入神学结论。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留原文连续的“有的……有的……另有一些……”结构，使分类与动作层次清楚。
