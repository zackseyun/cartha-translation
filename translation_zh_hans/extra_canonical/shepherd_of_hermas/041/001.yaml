base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/001.yaml
  text: 'He says to me: “Remove from yourself every evil desire, but clothe yourself with the desire that is good and dignified; for when you are clothed with this desire, you will hate the evil desire and you will bridle it as you wish.'
translation:
  language: zh_hans
  text: 他对我说：“你要除去自己身上一切邪恶的欲望，却要穿上那良善、可敬的欲望；因为你穿上这欲望以后，就会憎恶邪恶的欲望，并会按自己的意愿驾驭它。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἆρον ἀπὸ σεαυτοῦ
  choice: 除去自己身上
  rationale: 保留“从自己那里拿走、除掉”的动作感，同时符合现代汉语表达。
- source_word: ἐπιθυμία πονηρά
  choice: 邪恶的欲望
  rationale: ἐπιθυμία 可指欲望或渴求；此处由 πονηρά 明确作负面限定，译作“邪恶的欲望”自然且准确。
- source_word: ἔνδυσαι
  choice: 穿上
  rationale: 保留原文鲜明的穿衣隐喻，并与后文“穿上这欲望”呼应。
- source_word: ἀγαθὴν καὶ σεμνήν
  choice: 良善、端正
  rationale: ἀγαθή 表示良善，σεμνή 含庄重、可敬、端正之意；“端正”在欲望这一搭配中较自然，也不将含义过度宗教化。
- source_word: χαλιναγωγήσεις
  choice: 驾驭
  rationale: 该词本义为用嚼环约束、勒住；“驾驭”既保留控制牲畜的意象，又适合现代读者。
- source_word: καθὼς βούλει
  choice: 随自己的意愿
  rationale: 直陈“照你所愿”，没有将其弱化为仅仅“必要时”或强化为绝对消灭。
theological_decisions:
- issue: 良善欲望与邪恶欲望之间的关系
  choice: 保留两者都称为“欲望”以及“穿上—憎恶—驾驭”的递进
  alternative: 将前者译为“善愿”或将后者译为“私欲”
  rationale: 原文重复使用 ἐπιθυμία，刻意形成对照；统一译作“欲望”可保留其修辞与人论张力，避免预先套入特定神学术语。
- issue: 人的意志与邪恶欲望的控制
  choice: 译作“能随自己的意愿驾驭它”
  alternative: 译作“便可完全制服它”
  rationale: 原文表达的是约束和驾驭，并未明确说将其彻底消灭；保留这种张力，不推导特定的成圣论立场。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留“穿上”与“驾驭”两个核心隐喻。按 reader_segment 仅翻译第1节，未纳入所给父级原文中的第2—3节。
