base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/003.yaml
  text: 3. “What deeds of evil desire,” I say, “hand people over to death, sir? Make them known to me, so that I may keep away from them.” “Listen,” [he says,] “by what deeds evil desire puts the servants of God to death.”
translation:
  language: zh_hans
  text: 3. 我问：“主啊，邪恶欲望会借着哪些行为把人交给死亡呢？请告诉我，好让我远离这些行为。”他说[a]：“你听着：邪恶欲望是借着哪些行为把上帝的仆人置于死地的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本省略“他说”。
    reason: 校勘文本将φησίν（“他说”）置于方括号内，表示该词的文本见证存在不确定性；正文依校勘文本保留，并以脚注说明。
lexical_decisions:
- source_word: ἐπιθυμία πονηρά
  choice: 邪恶欲望
  rationale: ἐπιθυμία在本段被人格化为一种能驱使并毁灭人的欲望；译作“邪恶欲望”既保留道德性质，也与上下文“良善的欲望”形成对应。
- source_word: παραδιδόντα ... εἰς θάνατον
  choice: 把人交给死亡
  rationale: 贴近原文“交付于死亡”的表达，保留其司法或权势性的意象，不弱化为一般的“导致死亡”。
- source_word: ἀφέξομαι ἀπ’ αὐτῶν
  choice: 远离这些行为
  rationale: 表达主动克制、避开的含义，并明确代词所指为前述行为。
- source_word: θανατοῖ
  choice: 置……于死地
  rationale: 此处为使役动词“使死亡、杀死”；采用庄重且自然的中文，同时保留邪恶欲望被人格化的力量。
- source_word: δοῦλος Θεοῦ
  choice: 上帝的仆人
  rationale: 准确呈现早期基督教语境中的身份称谓；“上帝”符合现代标准普通话。
- source_word: κύριε
  choice: 主啊
  rationale: 保留对说话者的尊称及呼格语气；上下文中的权威人物适合译作“主”。
theological_decisions:
- issue: “交给死亡”与“置于死地”的死亡性质
  choice: 保留字面的“死亡”措辞，不解释为属灵死亡、永恒死亡或肉身死亡
  alternative: 明确译作“永远灭亡”或“灵性死亡”
  rationale: 原文仅使用θάνατος与θανατόω，并未在本句界定死亡的具体性质；译文应保留这一神学张力。
- issue: 邪恶欲望的拟人化
  choice: 保留其能“交给死亡”并“置人于死地”的主动形象
  alternative: 改写为“因邪恶欲望而死亡”
  rationale: 原文以ἡ ἐπιθυμία ἡ πονηρά为主动施事者；保留拟人化有助于忠实呈现其修辞与伦理力度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“主啊”保留呼格，“你听”简洁呈现命令语气。前后分别使用“交给死亡”和“置于死地”，以反映原文παραδίδωμι εἰς θάνατον与θανατόω的词形差异。
