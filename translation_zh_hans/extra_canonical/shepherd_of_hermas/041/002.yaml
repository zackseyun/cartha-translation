base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/002.yaml
  text: '2. “For evil desire is wild and is hard to tame; for it is fearsome, and by its savagery it greatly consumes people—especially if a servant of God falls into it and is not sensible, he is grievously consumed by it. It consumes such people: those who do not have the garment of good desire, but are entangled with this age. These, therefore, it hands over to death.”'
translation:
  language: zh_hans
  text: 2. 因为邪恶的欲望是野性的，难以驯服；它是可怕的，并且因着自身的凶猛大大毁坏人。尤其是，上帝的仆人若陷入其中，又不够明辨，就会被它严重毁坏。它所毁坏的，是这样的人：他们没有穿上良善欲望的衣裳，反而与这个世代混杂。因此，它把这些人交给死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: 邪恶的欲望
  rationale: ἐπιθυμία在此被拟人化为凶猛、吞噬人的力量；“欲望”既保留其广义，也不把它局限为某一种具体情欲。
- source_word: ἀγρία / ἀγριότητι
  choice: 野蛮的／凶猛
  rationale: 前者描述难以驯服的野性，后者描述其攻击性；以相关而不机械重复的现代汉语表达同一词根。
- source_word: δαπανᾷ / δαπανᾶται
  choice: 吞噬／被吞噬
  rationale: 该动词可指耗尽、消耗；上下文将邪恶欲望拟为猛兽，“吞噬”自然保留这一意象及毁灭性的力度。
- source_word: μὴ ᾖ συνετός
  choice: 又不明智
  rationale: 保留“缺乏审慎、悟性或判断力”的宽泛含义，不具体化为单纯的警觉或聪明。
- source_word: ἔνδυμα τῆς ἐπιθυμίας τῆς ἀγαθῆς
  choice: 良善欲望这件衣裳
  rationale: 保留与上一节“披上良善的欲望”呼应的穿衣隐喻。
- source_word: ἐμπεφυρμένους τῷ αἰῶνι τούτῳ
  choice: 与今世纠缠在一起
  rationale: ἐμφύρω有混杂、卷入之意；“纠缠在一起”传达深度卷入而不额外界定其具体形式。
- source_word: παραδίδωσιν εἰς θάνατον
  choice: 交给死亡
  rationale: 保留παραδίδωμι的移交措辞和“死亡”的拟人格色彩，避免解释为某一种特定死亡。
theological_decisions:
- issue: “死亡”的性质
  choice: 直译为“死亡”
  alternative: 解释为永死、属灵死亡或肉身死亡
  rationale: 原文未明确限定死亡的性质，应保留其警告的开放性与神学张力。
- issue: 邪恶欲望的拟人化施动性
  choice: 持续以“它”为主语，写作吞噬并交人给死亡
  alternative: 改写为人因欲望而灭亡
  rationale: 原文明确把邪恶欲望塑造成主动的凶猛力量，译文不应削弱这一修辞。
- issue: “上帝的仆人”受害的条件
  choice: 保留“若陷入其中，又不明智”
  alternative: 解释为失去信仰、缺乏属灵分辨或故意犯罪
  rationale: 原文仅陈述陷入邪欲且不明智，不应加入宗派性或系统神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留邪恶欲望如野兽般难驯、凶猛、吞噬人的连贯意象，也保留“披衣”“今世”“交给死亡”等原文关键表达；不添加超出希腊文的教义性说明。
