revisions:
- from: 2. 因为邪恶的欲望是野蛮的，很难驯服；它十分可怕，凭着自身的凶猛吞噬人。尤其是，上帝的仆人若陷入其中，又不明智，就会被它严重吞噬。它所吞噬的，正是那些没有披上良善欲望这件衣裳、反倒与今世纠缠在一起的人。因此，它把这些人交给死亡。
  to: 2. 因为邪恶的欲望是野性的，难以驯服；它是可怕的，并且因着自身的凶猛大大毁坏人。尤其是，上帝的仆人若陷入其中，又不够明辨，就会被它严重毁坏。它所毁坏的，是这样的人：他们没有穿上良善欲望的衣裳，反而与这个世代混杂。因此，它把这些人交给死亡。
  rationale: 修订仅处理词义和汉语搭配：“野性的”准确反映难驯的ἀγρία；“毁坏”保留δαπανᾷ的耗损、毁灭力度而不将其过度具象化；“不够明辨”保留συνετός所含审慎和判断力；“与这个世代混杂”贴近ἐμπεφυρμένους的混杂/卷入含义。其余关键隐喻、句法推进和“死亡”的未定性质均予保留。
