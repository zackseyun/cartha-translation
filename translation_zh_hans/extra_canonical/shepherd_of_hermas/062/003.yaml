revisions:
- from: 那位伟大而荣耀的天使，就是米迦勒；他有权管理这群百姓，并引导他们。因为正是他把律法赐给他们，放在信徒心里。因此，他亲自察看那些领受了律法的人，看他们是否遵守了律法。
  to: 那位伟大而荣耀的天使，就是米迦勒；他掌管这群百姓，并治理他们。因为正是他把律法赐给他们，赐在信者心里。因此，他亲自前来查验那些他曾赐给律法的人，看他们是否遵守了律法。
  rationale: 修订仅收紧三个动词和律法进入信者内心的表达：以“掌管……治理”对应ἐξουσία与διακυβερνῶν；以“亲自前来查验”对应ἐπισκέπτεται；以“赐在信者心里”保留原文的施事关系。未对米迦勒与上文“上帝的儿子”的关系作任何调和性解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:50:42Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实，但“ἐπισκέπτεται”带有主动前来查验/巡视之意，单说“察看”略弱；且“他给了律法给他们，给信者的心”应保留原文这种略显突兀但明确的‘赐下/置入信者心中’结构。
  naturalness: 原译自然庄重。将“放在信徒心里”调整为“把这律法赐在信者心里”，更贴近原文，也保持现代汉语通顺。
  terminology: “米迦勒”“律法”均恰当。“百姓”可保留，符合λαός在本段所指受宣讲且相信的人群。“管理”和“引导”可表达ἐξουσία与διακυβερνῶν，但后者以“治理”更准确体现掌管、统辖，而非仅仅引导。
  issues:
  - severity: low
    issue: “引导他们”弱化了διακυβερνῶν的治理、统辖含义。
    rationale: διακυβερνάω本义有掌舵、治理之意；与前面的“有权柄”并列，译作“治理他们”更准确。
  - severity: low
    issue: “察看”未充分表现ἐπισκέπτεται主动临到查验的意味。
    rationale: 此处不是泛泛观看，而是对已赐律法者进行巡视、查验，以确认其是否遵守。
  - severity: low
    issue: “放在信徒心里”虽可理解，但“赐在信者心里”更贴合原文的施予与内置表达。
    rationale: 希腊文τὸν νόμον εἰς τὰς καρδίας τῶν πιστευόντων紧接“赐给他们”，宜译出律法被赐入信者内心的关系，避免口语化的“放在”。
  revised_text: 那位伟大而荣耀的天使，就是米迦勒；他掌管这群百姓，并治理他们。因为正是他把律法赐给他们，赐在信者心里。因此，他亲自前来查验那些他曾赐给律法的人，看他们是否遵守了律法。
  revised_footnotes: []
