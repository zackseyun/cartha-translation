base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/003.yaml
  text: “And the great and glorious angel is Michael, who has authority over this people and governs them. For he is the one who gives the law to them, into the hearts of those who believe; therefore he himself visits those to whom he gave it, to see whether they have kept it.
translation:
  language: zh_hans
  text: 那位伟大而荣耀的天使，就是米迦勒；他掌管这群百姓，并治理他们。因为正是他把律法赐给他们，赐在信者心里。因此，他亲自前来查验那些他曾赐给律法的人，看他们是否遵守了律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: 有权管理
  rationale: 结合后面的“引导他们”，这里所指不是抽象能力，而是对这群百姓所拥有的管辖权。
- source_word: διακυβερνῶν
  choice: 引导
  rationale: 原词含治理、掌舵之意；“引导”在现代汉语中自然庄重，同时避免与前面的权柄表达重复。
- source_word: νόμος
  choice: 律法
  rationale: 保留本段反复出现的核心宗教术语及其规范性含义。
- source_word: ἐπισκέπτεται
  choice: 察看
  rationale: 此处表示前来检视、查验，而非现代汉语通常所说的探望。
- source_word: τετηρήκασιν
  choice: 遵守
  rationale: 准确表达持续持守并实行律法的意思。
theological_decisions:
- issue: 米迦勒与上文“上帝的儿子”的关系
  choice: 按原文直接称米迦勒为掌管并引导百姓的伟大天使，不补充身份解释
  alternative: 通过释义将米迦勒与上帝的儿子认同或明确区分
  rationale: 本节原文存在神学张力，却没有在本句明说二者关系；译文不应替作者消解这种张力。
- issue: 律法进入信徒内心的施事关系
  choice: 保留“他把律法赐给他们，放在信徒心里”
  alternative: 改作“上帝借着他把律法写在信徒心里”
  rationale: 原文以米迦勒为语法主语，未明言“写”或“借着”；译文按原句关系表达，不添加神学中介说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；保留“米迦勒、律法、信徒”等传统且通行的基督教用语。
