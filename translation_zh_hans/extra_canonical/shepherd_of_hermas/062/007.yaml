  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/007.yaml
  text: “Who then, Sir,” I say, “are the ones who are crowned and go into the tower?”
translation:
  language: zh_hans
  text: “那么，先生，”我问，“那些戴着冠冕、正往塔里去的人是谁呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνες οὖν
  choice: 那么……是谁呢
  rationale: 保留οὖν承接上文、进一步追问的语气，同时采用自然的现代汉语问句结构。
- source_word: φημί
  choice: 我问
  rationale: 字面义为“我说”，但此处引出直接问句，译作“我问”更符合现代汉语叙事习惯，且不改变言语行为。
- source_word: κύριε
  choice: 先生
  rationale: 此处是赫马对异象中解释者的尊称；采用“先生”可表达敬称，并避免将其直接处理为对神的称呼“主”。
- source_word: οἱ ἐστεφανωμένοι
  choice: 那些戴着冠冕……的人
  rationale: 保留完成时被动分词所描绘的已受加冠状态；“冠冕”也契合上下文中得胜与受苦的象征意味。
- source_word: εἰς τὸν πύργον ὑπάγοντες
  choice: 正往塔里去
  rationale: 准确表达朝向塔内行进的动态；“正”体现现在分词的进行意味。
theological_decisions:
- issue: κύριε所指身份与称谓
  choice: 译为“先生”
  alternative: “主啊”或“大人”
  rationale: 原文在此可作礼貌敬称，语境中的受话者是解释异象者。译成“先生”保留尊敬而不预先赋予神性身份；“大人”在现代汉语中过于古旧。
- issue: 冠冕意象的处理
  choice: 直译为“戴着冠冕”
  alternative: 意译为“得胜的人”
  rationale: 后文才解释他们因争战得胜而受冠冕；此处应保留异象本身及叙事悬念，不提前把象征意义写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留问答叙事的口吻以及“塔”“冠冕”等异象意象，不在正文中提前解释其神学含义。
