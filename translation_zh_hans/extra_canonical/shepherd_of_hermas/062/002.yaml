base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/002.yaml
  text: “Listen,” he says. “This great tree that covers plains and mountains and the whole earth is the law of God given to the whole world. And this law is the Son of God, proclaimed to the ends of the earth; and the peoples under the shade are those who heard the proclamation and believed in him.
translation:
  language: zh_hans
  text: 他说：“你听着：这棵遮盖平原、群山和全地的大树，就是赐给全世界的上帝之律法。这律法就是上帝的儿子，已经传扬到地极；树荫下的各族人民，就是那些听见这宣讲并信了他的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄκουε
  choice: 你听着
  rationale: 保留命令语气，同时符合现代汉语叙事对话。
- source_word: τὸ δένδρον τοῦτο τὸ μέγα
  choice: 这棵……大树
  rationale: 准确呈现指示语与形容词，并采用自然汉语词序。
- source_word: τὸ σκεπάζον
  choice: 遮盖
  rationale: 既表达树冠覆盖广大地域的图景，也与后文“树荫下”形成词义呼应。
- source_word: νόμος Θεοῦ
  choice: 上帝之律法
  rationale: “律法”保留宗教伦理语境中的规范性含义；“之”使表述庄重而不古奥。
- source_word: ὁ δοθεὶς εἰς ὅλον τὸν κόσμον
  choice: 赐给全世界的
  rationale: 被动分词按汉语定语表达；“赐给”体现神为施予者的语境。
- source_word: κηρυχθεὶς
  choice: 已经传扬
  rationale: 表达公开宣告并传播的含义；完成体“已经”对应完成行动。
- source_word: εἰς τὰ πέρατα τῆς γῆς
  choice: 到地极
  rationale: 保留早期基督教文献中常见且易懂的空间表达。
- source_word: οἱ δὲ ὑπὸ τὴν σκέπην λαοὶ
  choice: 树荫下的各族人民
  rationale: σκέπη在树的意象中自然译为“树荫”；λαοί用“各族人民”体现复数群体。
- source_word: τοῦ κηρύγματος
  choice: 这宣讲
  rationale: 保留与κηρυχθεὶς的词根呼应，指公开传出的信息。
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: 信了他
  rationale: 直接保留“相信/信入他”的基督论指向，不另行解释其方式或程度。
theological_decisions:
- issue: “律法就是上帝的儿子”的同一性陈述
  choice: 按原文直译为“这律法就是上帝的儿子”
  alternative: 译为“这律法代表上帝的儿子”或“这律法出自上帝的儿子”
  rationale: 原文使用系词ἐστίν作直接断言，具有真实的神学张力；不宜以解释性译法削弱或改写。
- issue: αὐτόν所指对象
  choice: 译为阳性代词“他”，指向“上帝的儿子”
  alternative: 译为“它”，理解为“宣讲”或“律法”
  rationale: 希腊文αὐτόν为阳性单数，与υἱὸς（儿子）自然呼应；κηρύγμα为中性，不支持将代词理解为“宣讲”。
- issue: “赐给全世界”的普遍范围
  choice: 保留“全世界”
  alternative: 解释为“赐给世上所有人”
  rationale: 原文ὅλον τὸν κόσμον强调普遍范围，但未进一步界定领受方式，译文不增添解释。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语体。保留“大树—遮盖—树荫”的连续意象，以及“律法就是上帝的儿子”这一不寻常但明确的原文陈述；不添加宗派性说明。
