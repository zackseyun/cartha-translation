base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/004.yaml
  text: “You see the rods of each person; for the rods are the law. You see, then, many rods made worthless; and you will recognize all those who have not kept the law, and you will see the dwelling of each one.”
translation:
  language: zh_hans
  text: “你看见每个人的枝条；因为枝条就是律法。你看见许多枝条已经变得无用；你就会认出所有没有遵守律法的人，也会看见每个人的住处。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: 枝条
  rationale: 上下文以大树及其枝条为意象；此处所指是从树上剪下、交还受验的条枝。译作“枝条”比泛称“杖”更能维持本段意象。
- source_word: ἠχρειωμένας
  choice: 已经坏了
  rationale: 该完成时被动分词表示枝条已变得无用、败坏；“已经坏了”自然易懂，同时保留结果状态，不额外限定具体损坏方式。
- source_word: τηρήσαντας
  choice: 遵守
  rationale: τηρέω在此指持守、谨守律法；现代汉语以“遵守律法”最自然准确。
- source_word: κατοικίαν
  choice: 归宿
  rationale: 字面义为“住处、居所”，但语境指各人最终被安置之处。“归宿”能自然表达此意，又不明确添加天堂、地狱等原文未说出的分类。
theological_decisions:
- issue: 枝条与律法的象征同一
  choice: 直译为“这些枝条就是律法”
  alternative: “这些枝条代表律法”
  rationale: 原文使用系词ἐστί，直接说枝条“是”律法。保留这一象征性断言，不将其解释性弱化为仅仅“代表”。
- issue: κατοικία所指的最终处境
  choice: 译作“每个人的归宿”
  alternative: “每个人的住处”
  rationale: “归宿”符合审验后各人被分别安置的语境，同时避免擅自说明其确切末世论性质。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体；保留“枝条—律法”的象征结构及由看见到认出的推进。
