base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/010.yaml
  text: “And those who handed in green rods just as they received them are dignified and righteous and have walked with a very pure heart, and have guarded the commandments of the Lord. The rest you will learn when I examine these rods that have been planted and watered.”
translation:
  language: zh_hans
  text: 那些人交回的杖仍和他们领受时一样青翠；他们是庄重正直的人，以极其纯洁的心行事，并谨守主的诫命。至于其余的人，等我察看这些栽种并浇灌过的杖时，你就会知道了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χλωρὰς τὰς ῥάβδους
  choice: 杖仍……青翠
  rationale: χλωρός在此描述枝杖保持鲜绿、有生命力；“青翠”自然且保留比喻意象。
- source_word: σεμνοὶ
  choice: 端庄
  rationale: 表达庄重、品行可敬之意，与后面的“正直”并列而不重复。
- source_word: δίκαιοι
  choice: 正直
  rationale: 在此为对人物品格的描述；“正直”较自然，也避免无依据地限定为法庭或称义术语。
- source_word: πορευθέντες ἐν καθαρᾷ καρδίᾳ
  choice: 以……纯洁的心行事
  rationale: πορεύομαι在伦理语境中指生活、行事；不拘泥于字面的“行走”。
- source_word: πεφυλακότες
  choice: 谨守了
  rationale: 保留完成时所体现的持续遵守及其现存结果。
- source_word: κατανοήσω
  choice: 察看
  rationale: 这里指细加观察、检验杖的情形，“察看”符合上下文。
theological_decisions:
- issue: δίκαιοι是否译为带有特定教义色彩的“义人”
  choice: 正直的人
  alternative: 义人
  rationale: 本句与σεμνοὶ并列描述行为和品格；译作“正直的人”保留伦理含义，不额外导入称义体系。
- issue: τὰς ἐντολὰς Κυρίου中“主”的所指
  choice: 主的诫命
  alternative: 上帝的诫命／基督的诫命
  rationale: 原文仅作Κυρίου，保留“主”的称谓及其可能的指涉张力，不擅自明确身份。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留“杖、栽下、浇水”等贯穿本段的象征图景。以分号衔接人物身份与其行为，使中文清晰流畅。
