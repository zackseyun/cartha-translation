base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/001.yaml
  text: I say to him, “Sir, make known to me what this tree is; for I am perplexed about it, because, though so many branches have been cut off, the tree is sound, and nothing appears to have been cut away from it. About this, therefore, I am at a loss.”
translation:
  language: zh_hans
  text: 我对他说：“先生，请告诉我这棵树是什么；我对它感到困惑，因为虽然砍掉了这么多枝子，这棵树却仍然完好，看起来好像没有从树上砍去什么。因此，我对此很不明白。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: 先生
  rationale: 此处是赫尔马对异象中解释者的尊称，译作“先生”自然庄重，也避免在语境尚未明确时直接赋予神性称号。
- source_word: τὸ δένδρον τοῦτο γνώρισόν μοι τί ἐστιν
  choice: 请告诉我这棵树代表什么
  rationale: 按异象解释语境，τί ἐστιν所问并非树的物种，而是其象征意义；“代表什么”准确传达言外之意。
- source_word: ἀποροῦμαι
  choice: 感到困惑／很不明白
  rationale: 保留原文首尾重复，同时用近义表达使现代汉语行文自然。
- source_word: κλάδων κοπέντων
  choice: 枝子被砍掉
  rationale: 采用具体、直观的对应表达，并保留被动含义。
- source_word: ὑγιές
  choice: 完好
  rationale: 用于树木时表示健全、未受损；“完好”比直译“健康”更贴合上下文。
- source_word: οὐδὲν φαίνεται κεκομμένον ἀπ' αὐτοῦ
  choice: 看不出有任何东西从它上面被砍掉
  rationale: 保留原文“显得／看起来”与完成时被砍除状态之间的张力，不擅自具体化为伤痕或缺口。
theological_decisions:
- issue: Κύριε是否应译作“主”
  choice: 先生
  alternative: 主啊
  rationale: 本句称呼异象中的解释者；原词既可作尊称也可指“主”。在此不预先认定其神学身份，保留叙事层面的尊称更稳妥。
- issue: 树的象征意义是否在本节提前说明
  choice: 仅译为“代表什么”
  alternative: 直接说明为上帝的律法或上帝的儿子
  rationale: 当前读者段落只包含提问，解释出现在后文；不把后文答案提前嵌入，以保留叙事推进和文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留原文因果链条及首尾重复的困惑表达；句式略作汉语化处理，但不补入后文的象征解释。
