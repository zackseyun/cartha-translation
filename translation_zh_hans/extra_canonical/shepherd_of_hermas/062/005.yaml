base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/005.yaml
  text: I say to him, “Sir, why did he send some away into the tower, but leave others to you?”
translation:
  language: zh_hans
  text: 我问他：“主啊，他为什么打发一些人到塔里去，却把另一些人留给你呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: 此处是对异象中权威人物的尊称；译作“主啊”既保留原文称呼，也符合庄重而自然的中文表达。
- source_word: ἀπέλυσεν
  choice: 打发……去
  rationale: 表达使某些人离开并前往塔中的动作，比单纯“离开”更准确地保留使役意味。
- source_word: εἰς τὸν πύργον
  choice: 到塔里去
  rationale: 保留方向介词 εἰς 的动态意义，并与上下文中作为目的地的塔相符。
- source_word: σοὶ κατέλειψεν
  choice: 留给你
  rationale: καταλείπω 与间接受词 σοὶ 表示将另一些人留下，交由受话者处置；中文“留给你”简洁保留这一关系。
theological_decisions:
- issue: Κύριε 所指身份及称谓
  choice: 主啊
  alternative: 先生／大人
  rationale: 本句并未明确将受话者等同于上帝或基督，因此不在正文中补明身份；但“主啊”可保留原词的尊崇语气及其潜在神学张力。
- issue: “塔”的象征意义
  choice: 仅译作“塔”
  alternative: 教会之塔／救恩之塔
  rationale: 原句只说“塔”，其象征意义由更大语境提供；正文不添加解释，以免消除原文意象的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体；保持原句问答语气和“有些……另一些……”的对照结构，不增添上下文中的解释。
