base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/008.yaml
  text: “[Those who grappled with the devil and overcame him,” he says, “are crowned.] These are the ones who suffered for the law.
translation:
  language: zh_hans
  text: '[a][“那些曾与魔鬼搏斗并胜过他的人，”他说，“已经得了冠冕。”] 这些人就是为律法受过苦的人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号内的话在所据希腊文本中也以方括号标示，表示其文本归属存在疑问。
    reason: 保留底本对该分句所作的文本批判标记，避免把有疑问的文字无提示地当作确定正文。
lexical_decisions:
- source_word: συμπαλαίσαντες τῷ διαβόλῳ
  choice: 同魔鬼角力
  rationale: 保留摔跤、角力的具体争战意象，比泛化为“争战”更贴近原文。
- source_word: ἐνίκησαν αὐτόν
  choice: 胜过他
  rationale: 自然表达战胜魔鬼之意，并保留阳性单数代词的指向。
- source_word: ἐστεφανωμένοι
  choice: 戴上了冠冕
  rationale: 保留完成时被动分词所表达的已获加冠状态及奖赏意象。
- source_word: ὑπὲρ τοῦ νόμου παθόντες
  choice: 因这律法受过苦
  rationale: ὑπέρ在此表示为了或由于忠于律法而受苦；译为“因这律法”较自然，同时不额外限定为殉道。
theological_decisions:
- issue: “律法”的所指
  choice: 保留“这律法”
  alternative: 译作“上帝的律法”或“基督”
  rationale: 上文把律法与上帝的儿子紧密联系，但本句仍明确使用νόμος；直译可保留这种神学张力，不将两者直接等同改写。
- issue: 受苦的程度
  choice: 译作“受过苦”
  alternative: 译作“殉道”
  rationale: πάσχω本身只说明遭受苦难；上下文把这群人与仅受患难者区分开来，却仍未必要求将其明确译成死亡殉道。
translation_notes:
  register: 采用庄重而清楚的现代汉语。“同魔鬼角力”保留原文鲜明意象；句法略作调整，使引语在中文中自然。脚注标记置于方括号段落之前，以免与原文已有的方括号混淆。
