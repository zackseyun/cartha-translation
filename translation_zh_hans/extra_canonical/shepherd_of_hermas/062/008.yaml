  naturalness: 引语可用中文全角引号，并将插入语“他说”置于引号内，读起来更符合现代汉语引语习惯。
  terminology: “魔鬼”“律法”“冠冕”均恰当。“为律法受苦”比“因这律法受过苦”更清楚地表达ὑπὲρ τοῦ νόμου的“为了／因维护律法”而受苦，且不越译为殉道。
