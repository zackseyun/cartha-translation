revisions:
- from: “凡违犯了从他领受之律法的人，”他说，“他都把他们留在我的权下，使他们悔改；至于那些已经行事讨律法喜悦、又遵守了律法的人，他把他们留在自己的权下。”
  to: “凡违犯了从他那里领受的律法的人，”他说，“他都把他们留在我的权下，让他们悔改；至于那些已经讨律法喜悦、又遵守了律法的人，他把他们置于自己的权下。”
  rationale: 修订仅澄清希腊文的句法力度及两组“权柄”表述的差别：以“让他们悔改”保存 εἰς μετάνοιαν 的目的取向而不强化为确定使役；以“置于自己的权下”对应 ἔχει。保留“讨律法喜悦”的显著措辞，因为原文随后另用“遵守律法”，不宜将两者合并释义。
  reviewer_model: gpt-5.6-terra
