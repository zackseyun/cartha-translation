base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/006.yaml
  text: “All who transgressed the law which they received from him,” he says, “he left under my authority for repentance; but those who have already been pleasing to the law and have kept it, he has under his own authority.”
translation:
  language: zh_hans
  text: “凡违犯了从他那里领受的律法的人，”他说，“他都把他们留在我的权下，让他们悔改；至于那些已经讨律法喜悦、又遵守了律法的人，他把他们置于自己的权下。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέβησαν
  choice: 违犯了
  rationale: 准确表达越过、违反律法的含义，符合现代汉语宗教语境。
- source_word: εἰς τὴν ἐμὴν ἐξουσίαν
  choice: 留在我的权下
  rationale: 保留“权柄、管辖权”之意，并与后文“自己的权下”形成清楚对应。
- source_word: εἰς μετάνοιαν
  choice: 使他们悔改
  rationale: 表达其目的或归向，同时避免把悔改弱化为仅有心理懊悔。
- source_word: εὐηρέστησαν τῷ νόμῳ
  choice: 已经行事讨律法喜悦
  rationale: 保留原文以“律法”为间接对象的罕见表达，不擅自改释为一般性的“遵行律法”，因为后句另有“遵守了律法”。
- source_word: τετηρήκασιν αὐτόν
  choice: 遵守了律法
  rationale: 体现完成时所指的既已持守及其持续结果；汉语中明说“律法”比使用代词更清楚。
theological_decisions:
- issue: 违犯律法者被置于说话者权下的目的
  choice: 使他们悔改
  alternative: 留待悔改／给他们悔改的机会
  rationale: 原文 εἰς μετάνοιαν 可表示目的或归向；正文采用自然的目的表达，但不加入原文没有明说的“机会”。
- issue: 律法与遵守者之间的拟人化关系
  choice: 行事讨律法喜悦
  alternative: 蒙律法喜悦／满足了律法的要求
  rationale: 原文明确使用“讨……喜悦”的动词并以律法为与格对象；保留这一神学张力，不把律法直接等同于上帝，也不将其解释成某一特定教义体系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留直接引语中的转述结构及“我的权下／自己的权下”的平行关系；对原文不寻常的“讨律法喜悦”不作静默消解。
