base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/009.yaml
  text: “But the others, who themselves also handed in their rods green and having side-shoots, yet without fruit—these are those who were hard-pressed for the law, but did not suffer, nor did they deny their law.
translation:
  language: zh_hans
  text: 至于另一些人，他们交上的枝条也是青绿的，并且长有嫩枝，却没有果子；这些人曾为这律法遭受患难，却没有受苦，也没有否认他们的律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: 枝条
  rationale: 结合树木、嫩枝和果子的比喻语境，译作“枝条”比“杖”更自然，也保留其作为受检验之枝的意象。
- source_word: παραφυάδας
  choice: 嫩枝
  rationale: 指从主枝旁边长出的新枝；“嫩枝”简明自然，并与青绿、结果的意象协调。
- source_word: θλιβέντες
  choice: 遭受患难
  rationale: 表达受压迫、受困苦的含义，同时与后面的παθόντες保持措辞上的区别。
- source_word: παθόντες
  choice: 受苦
  rationale: 采用宽泛译法，不擅自限定为殉道、酷刑或其他特定苦难，以保留原文与θλιβέντες之间既相关又有差别的张力。
- source_word: τὸν νόμον αὐτῶν
  choice: 他们的律法
  rationale: 依照原文所有格直译，保留其指称和语义上的张力，不改写成“信仰”或“上帝的律法”。
theological_decisions:
- issue: “为这律法遭受患难”与“没有受苦”的表面张力
  choice: 保留两种近义受难用语的并置
  alternative: 把后者明确译成“没有殉道”或“没有遭受酷刑”
  rationale: 原文没有明确使用“殉道”一词；直接具体化会加入解释。保留张力更忠于现有希腊文本。
- issue: “他们的律法”的指称
  choice: 按原文保留“他们的律法”
  alternative: 统一改为“这律法”或“上帝的律法”
  rationale: 上下文虽指向上帝的律法，但本句使用所有格αὐτῶν；译文保留这一变化，避免抹平原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于另一些人”承接前文分类说明；分号划分枝条描写与人物解释。未添加脚注，因为本句的词义张力可由正文直接保留。
