revisions:
- from: 她却说：“这事绝不归到上帝的仆人身上。不过，关于她的念头确实曾浮上你的心头。这样的意念会使上帝的仆人陷入罪中；因为，一个极其敬虔、已经受过考验的灵，若贪求行恶，这意念就是邪恶而骇人的；何况是有节制的赫尔马斯——他远避一切邪恶的欲望，满有纯朴和极大的清白。”
  to: 她说：“这事绝不会临到上帝的仆人。不过，你心里必定曾对她起过这样的念头。这样的意念会给上帝的仆人带来罪；因为，若对一个极其可敬、已经受过考验的灵心怀恶行，这意念就是邪恶而骇人的；尤其是赫尔马斯这个有节制的人，他远避一切邪恶的欲望，满有纯朴和极大的清白。”
  rationale: 修订严格调整原文长句中条件从句的施事关系：行恶的欲求属于“意念/意图”对那位“灵”的取向。保留“灵”而不判定其必为圣灵或单纯指某位属灵之人；“尤其是”对应καὶ μάλιστα的特别强调。
