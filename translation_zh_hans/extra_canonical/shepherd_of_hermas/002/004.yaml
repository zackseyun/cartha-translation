base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/004.yaml
  text: But she said, “By no means does this matter apply to the servant of God. Yet surely a thought concerning her rose up in your heart. For such an intention brings sin upon the servants of God. For it is an evil and startling intention for a most reverent spirit, and one already proven, if it should desire an evil deed—especially Hermas, the self-controlled one, who abstains from every evil desire and is full of all simplicity and great innocence.”
translation:
  language: zh_hans
  text: 她说：“这事绝不会临到上帝的仆人。不过，你心里必定曾对她起过这样的念头。这样的意念会给上帝的仆人带来罪；因为，若对一个极其可敬、已经受过考验的灵心怀恶行，这意念就是邪恶而骇人的；尤其是赫尔马斯这个有节制的人，他远避一切邪恶的欲望，满有纯朴和极大的清白。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς ἐπὶ τὸν δοῦλον τοῦ Θεοῦ τὸ πρᾶγμα τοῦτο
  choice: 这事绝不归到上帝的仆人身上
  rationale: 保留介词短语所表达的归属或归罪含义，同时避免把语境中的判断过度具体化为“定罪”。
- source_word: βουλή
  choice: 意念
  rationale: 此处指心中形成、并可能趋向行动的念头；“意念”兼顾思想与意向，符合上下文。
- source_word: ἁμαρτίαν ἐπιφέρουσα
  choice: 使……陷入罪中
  rationale: 体现“带来、招致罪”的动态含义，不把原文直接等同于已完成的恶行。
- source_word: ἔκπληκτος
  choice: 骇人的
  rationale: 该词在此与“邪恶”并列，表示令人震惊、骇异；译为“骇人的”自然且保留强烈语气。
- source_word: πάνσεμνον πνεῦμα
  choice: 极其敬虔的灵
  rationale: πάνσεμνος含高度可敬、庄重或圣洁之意；在宗教伦理语境中，“极其敬虔”较自然，又不将其专门化为圣灵。
- source_word: δεδοκιμασμένον
  choice: 已经受过考验的
  rationale: 保留δοκιμάζω经检验而获认可的语义张力，不武断译成“蒙悦纳”。
- source_word: ἐγκρατής
  choice: 有节制的
  rationale: 准确表达自制、克制欲望的品格，并与后文远避邪欲相呼应。
- source_word: ἁπλότης
  choice: 纯朴
  rationale: 可涵盖单纯、诚实、无二心；“纯朴”与ἀκακία的“清白”形成自然区分。
- source_word: ἀκακία
  choice: 清白
  rationale: 表达无恶意、无害与无辜的品格；此处译作“清白”符合人物伦理评价。
theological_decisions:
- issue: 内心意念与罪的关系
  choice: 译作“这样的意念会使……陷入罪中”
  alternative: 译作“这样的意念对上帝的仆人就是罪”
  rationale: 原文ἁμαρτίαν ἐπιφέρουσα字面是“带来罪”，并未简单使用系词把意念定义为罪；现译保留意念趋向罪、招致罪的动态张力。
- issue: πνεῦμα所指
  choice: 使用普通名词“灵”
  alternative: 译为“圣灵”或“属灵之人”
  rationale: 原文没有限定其为神的灵，也可能指人的内在生命或属灵品格；不以神学解释替代原文的含混性。
- issue: “上帝的仆人”是否专指赫尔马斯
  choice: 保留单数泛称“上帝的仆人”
  alternative: 明确译作“你这位上帝的仆人”
  rationale: 原文使用单数定冠词，但未出现第二人称；保留其可泛指亦可影射赫尔马斯的表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留原文由一般原则转向对赫尔马斯特别强调的长句结构，以破折号增强可读性。神名译作“上帝”，人物名按常见形式译为“赫尔马斯”。
