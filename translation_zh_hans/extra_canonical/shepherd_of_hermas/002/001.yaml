base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/001.yaml
  text: After she had spoken these words, the heavens were shut, and I was wholly trembling and grieving. And I said within myself, “If this sin is charged against me, how will I be able to be saved? Or how shall I make atonement to God for my completed sins? Or with what words shall I ask the Lord, that he may be propitious to me?”
translation:
  language: zh_hans
  text: 她说完这些话，诸天就关闭了；我浑身战栗，满心忧伤。我心里说：“如果这罪记在我的账上，我怎能得救呢？我又怎能为自己已经犯下的罪[a]向上帝赎罪呢？我该用什么话祈求主，使他怜悯我呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经犯下的罪”：原文直译可作“完全的罪”或“完整的罪”，这里可能指已经实际犯成、达到完整行为的罪。
    reason: 希腊语 τῶν ἁμαρτιῶν μου τῶν τελείων 的准确语义并不完全确定，需要保留并说明其歧义。
lexical_decisions:
- source_word: ἐκλείσθησαν οἱ οὐρανοί
  choice: 诸天就关闭了
  rationale: 保留复数“诸天”和异象叙事中天界关闭的具体意象。
- source_word: ἀναγράφεται
  choice: 记在我的账上
  rationale: 该词有登记、记入记录之意；用现代汉语中的记账表达责任被归到本人名下。
- source_word: σωθῆναι
  choice: 得救
  rationale: 保留早期基督教文本中兼具审判与救恩含义的标准用语。
- source_word: ἐξιλάσομαι τὸν Θεὸν
  choice: 向上帝赎罪
  rationale: 保留原文中罪人面对上帝寻求赎解的强烈表达，不把它改写成单纯的道歉或情绪上的宽慰。
- source_word: ἱλατευθῇ μοι
  choice: 使他怜悯我
  rationale: 自然表达主对祈求者转为施恩、开恩的意思，同时避免武断规定其具体赎罪机制。
theological_decisions:
- issue: ἐξιλάσομαι 与人的赎罪行动
  choice: 向上帝赎罪
  alternative: 求上帝赦免我
  rationale: 原文直接使用带有平息、赎解意味的动词，并呈现赫尔马困惑而惧怕的自问；不宜提前用较平缓的“求赦免”消除这种神学张力。
- issue: ἱλατευθῇ 的含义
  choice: 使他怜悯我
  alternative: 使他与我和好／向我息怒
  rationale: 原文可涵盖开恩、施怜悯或息怒；正文采用较宽广自然的说法，不把歧义限定为某一种赎罪理论。
translation_notes:
  register: 采用庄重而现代的叙事语言；以“诸天”“得救”“赎罪”等词保留宗教语境，同时用“记在我的账上”“满心忧伤”增强普通读者的可理解性。
