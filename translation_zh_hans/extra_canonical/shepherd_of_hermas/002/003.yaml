base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/003.yaml
  text: And she said to me, “Why are you gloomy, Hermas—you who are patient and not given to contention, always laughing? Why are you so downcast in appearance and not cheerful?” And I said to her, “Because of a most excellent woman, who said that I sinned against her.”
translation:
  language: zh_hans
  text: 她对我说：“黑马，你为什么这样愁眉不展？你一向忍耐，不与人争辩，总是欢笑；为什么如今面容如此愁苦，不欢快呢？”我对她说：“因为一位极其善良的妇人说，我得罪了她。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνός
  choice: 愁眉不展
  rationale: 该词在此指阴郁、沉闷的神情；用现代汉语习语自然呈现外在表现，并与后文“神情忧郁”呼应。
- source_word: μακρόθυμος
  choice: 有耐心
  rationale: 保留忍耐、恒忍的核心意思；此处是在描述黑马平素的性情。
- source_word: ἀστομάχητος
  choice: 不与人争执
  rationale: 该词有不争吵、不好争竞之意；译法避免生硬的“不争斗”。
- source_word: κατηφὴς τῇ ἰδέᾳ
  choice: 神情这样忧郁
  rationale: ἰδέα在此指面貌、外观；译出可见的神情，而非抽象的内心状态。
- source_word: ἱλαρός
  choice: 喜乐
  rationale: 与愁闷相对，指欢快、开朗；“喜乐”适合庄重宗教叙事，同时仍属现代常用语。
- source_word: γυναικὸς ἀγαθωτάτης
  choice: 一位极其贤善的妇人
  rationale: 保留最高级语气；“贤善”比单纯“很好”更能表达其品格评价。
- source_word: ἥμαρτον εἰς αὐτήν
  choice: 我得罪了她
  rationale: 直译为“向她犯了罪”在汉语中生硬；此处指对她有所冒犯或亏负，“得罪了她”保留对象关系，且不预断具体罪行。
theological_decisions:
- issue: ἥμαρτον是否应明确译为宗教意义的“犯罪”
  choice: 译作“得罪了她”
  alternative: “我对她犯了罪”或“我冒犯了她”
  rationale: 希腊语确用“犯罪”动词，但介词结构指向受冒犯的对象。上下文涉及罪责，却未在本句具体界定行为；“得罪了她”既保留道德过犯意味，也不夸大或消解其严重性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留老妇人连续追问的语势，并用分号呈现对黑马平日性情与当前神态的对照。专名按《黑马牧人书》常见汉译作“黑马”。
