base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/002.yaml
  text: While I was considering these things and pondering them in my heart, I see before me a great white chair made of snowy wool. And an elderly woman came in most radiant clothing, holding a book in her hands, and sat down alone and greeted me, “Hermas, greetings.” And I, grieving and weeping, said, “Lady, greetings.”
translation:
  language: zh_hans
  text: 我正思量这些事，在心里反复斟酌时，看见面前有一张大白座椅，是用雪白的羊毛制成的。一位老妇人来了，身穿极其光彩夺目的衣裳，手里拿着一本书。她独自坐下，向我问安说：“赫尔马斯，愿你安好。”我忧伤地哭着说：“夫人，愿你安好。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλευομένου καὶ διακρίνοντος ἐν τῇ καρδίᾳ μου
  choice: 正思量这些事，在心里反复斟酌
  rationale: 两个分词共同表达内心考虑、权衡的持续过程；译文保留二重表达，同时采用自然的现代汉语。
- source_word: καθέδραν
  choice: 椅子
  rationale: 此处指可供老妇人坐下的座椅；不译作带有制度或宗教意味的“座位/宝座”，以免加入原文没有的含义。
- source_word: λευκὴν ἐξ ἐρίων χιονίνων γεγονυῖαν
  choice: 白椅子，是用雪白的羊毛制成的
  rationale: 明确保留材质ἐρίων（羊毛）和χιονίνων（如雪般洁白）的形象。
- source_word: γυνὴ πρεσβῦτις
  choice: 一位老妇人
  rationale: 直译年龄与性别信息，符合叙事语境。
- source_word: ἐν ἱματισμῷ λαμπροτάτῳ
  choice: 身穿极其光彩夺目的衣裳
  rationale: λαμπροτάτῳ为最高级，既可指明亮也可指华美；“光彩夺目”保留视觉意象而不作神学化解释。
- source_word: βιβλίον
  choice: 一本书
  rationale: 保持一般意义的书卷/书；此处未说明卷轴形制，不具体化为“书卷”。
- source_word: ἀσπάζεταί με· Ἑρμᾶ, χαῖρε
  choice: 向我问候说：“黑马，愿你安好。”
  rationale: χαῖρε是常见问候语；译作“愿你安好”比字面“欢喜吧”更符合此处言语功能。人名采用早期基督教文献中较通行的音译“黑马”。
- source_word: Κυρία
  choice: 夫人
  rationale: 表示对女性的尊称；避免译作可能带有特定宗教联想的“女主”或过于现代日常的“女士”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留异象叙事的直陈风格。时态依希腊文由内心思量转入历史现在“看见”，使异象场景具有临场感；未对老妇人的象征身份作解释或预断。
