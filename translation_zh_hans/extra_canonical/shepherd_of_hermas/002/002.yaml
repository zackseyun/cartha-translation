revisions:
- from: 我正思量这些事，在心里反复斟酌时，看见面前有一把高大的白椅子，是用雪白的羊毛制成的。随后，一位老妇人来了，身穿极其光彩夺目的衣裳，双手拿着一本书。她独自坐下，向我问候说：“黑马，愿你安好。”我忧伤哭泣着说：“夫人，愿你安好。”
  to: 我正思量这些事，在心里反复斟酌时，看见面前有一张大白座椅，是用雪白的羊毛制成的。一位老妇人来了，身穿极其光彩夺目的衣裳，手里拿着一本书。她独自坐下，向我问安说：“赫尔马斯，愿你安好。”我忧伤地哭着说：“夫人，愿你安好。”
  rationale: 将误作普通词的专名改为“赫尔马斯”，以忠实呈现原文人物称呼；同时将“高大的”改为语义更宽的“大”，并作轻微语序润色。其余意象和叙事次序均予保留。
