base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/003.yaml
  text: 3. “And those that have cracks—who are they? These are the ones who harbor things against one another in their hearts and are not at peace among themselves, but have a face of peace; yet when they depart from one another, their evils remain in their hearts. These, then, are the cracks that the stones have.
translation:
  language: zh_hans
  text: 3. “那些有裂缝的石头是谁呢？”“他们就是彼此心存敌意、彼此之间不和睦的人。他们显出和平的外表；可是彼此分开以后，他们的恶意仍留在心里。这些就是石头所有的裂缝。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς σχισμάς
  choice: 裂缝
  rationale: 延续建塔与石头的具体意象，并自然表达群体关系中的破裂。
- source_word: οἱ κατ᾿ ἀλλήλων ἐν ταῖς καρδίαις ἔχοντες
  choice: 心里彼此怀恨
  rationale: 原文省略所怀之物，表示心中存有针对彼此的负面情绪；“怀恨”在中文中简洁自然，同时保留其敌意。
- source_word: μὴ εἰρηνεύοντες ἐν ἑαυτοῖς
  choice: 彼此之间不和睦
  rationale: 此处指群体成员相互不能和平相处，而非单纯个人内心不安。
- source_word: πρόσωπον εἰρήνης ἔχοντες
  choice: 表面上一团和气
  rationale: 表达字面“有和平的面孔”所指的外在和睦姿态，与内心所存的恶形成鲜明对照。
- source_word: αἱ πονηρίαι αὐτῶν
  choice: 他们的恶念
  rationale: 复数 πονηρίαι 可指邪恶、恶意或恶事；结合“留在心里”的语境，译作“恶念”最自然，但不将其具体化为某一种罪。
theological_decisions:
- issue: 内在敌意与外在和平的对照
  choice: 译为“心里彼此怀恨”与“表面上一团和气”
  alternative: 直译为“心里有彼此相对的事”与“有和平的面孔”
  rationale: 采用自然现代汉语呈现原文的道德张力，不把表面的和平误解为真实和好。
- issue: 裂缝意象的所指
  choice: 保留“石头上的裂缝”，不解释为教会分裂或特定教义类别
  alternative: 译作“教会中的裂痕”
  rationale: 原文以建塔异象中的石头作比喻，具体的群体或神学指向不应由译文额外限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留问答结构和石头的异象意象；以“一团和气”自然传达仅有和平外表的反讽意味。
