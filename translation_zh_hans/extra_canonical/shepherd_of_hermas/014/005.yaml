base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/005.yaml
  text: 5. “And the white and round ones that do not fit into the building—who are they, Lady?” She answered me, saying, “How long will you be foolish and without understanding, asking about everything and understanding nothing? These are those who have faith, but also have the wealth of this age. When affliction comes, because of their wealth and their business dealings they deny their Lord.”
translation:
  language: zh_hans
  text: 5. “夫人，那些洁白、圆的、不能用于建造的石头，是什么人呢？”她回答我说：“你愚昧无知到几时呢？事事都问，却什么也不明白！这些人有信心，也有今世的财富。患难一来，他们就因自己的财富和经营事务，否认他们的主。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυρία
  choice: 主母
  rationale: 保留对异象中女性权威人物的尊称；比现代日常称谓“女士”更庄重，也不把她直接解释为特定身份。
- source_word: λευκοὶ καὶ στρογγύλοι
  choice: 洁白、圆滑
  rationale: 按石头的语境表达颜色与圆形表面；“圆滑”自然说明这种石头难以砌合，同时避免仅译“圆的”所带来的生硬感。
- source_word: οἰκοδομή
  choice: 建筑
  rationale: 保留上下文中实际建造与象征性群体之间的开放张力，不直接释义为“教会”。
- source_word: πίστιν
  choice: 信心
  rationale: 此处指他们所具有的信仰或信靠；“信心”符合早期基督教文本的常用庄重表达。
- source_word: πλοῦτον τοῦ αἰῶνος τούτου
  choice: 今世的财富
  rationale: 保留“这个世代/今世”与财富的末世性对照，不弱化为一般的“钱财”。
- source_word: θλῖψις
  choice: 患难
  rationale: 涵盖压力、逼迫和困苦，不把原文限定为某一种具体处境。
- source_word: πραγματείας
  choice: 生意上的事务
  rationale: 该词可指经营、商业活动或事务；结合财富语境如此翻译较自然，同时不窄化为单一职业。
- source_word: ἀπαρνοῦνται
  choice: 否认
  rationale: 保留公开否认或背弃主的强烈含义，不缓和为“疏远”。
theological_decisions:
- issue: 财富与否认主之间的关系
  choice: 译作“因自己的财富和生意上的事务，否认他们的主”
  alternative: “为了保全财富和生意而否认他们的主”
  rationale: 原文以διά说明相关原因，但未明说其主观目的；正文保留因果关系，不额外补入“为了保全”的动机。
- issue: “有信心”是否等同于得救
  choice: 直译为“虽有信心”而不作救恩状态判断
  alternative: 译作“虽已成为信徒”
  rationale: 原文刻意并置信心、财富与患难中的否认；译文保留这种神学张力，不预先判定其信心性质或最终结局。
- issue: 建筑的象征所指
  choice: 保留“建筑”
  alternative: 直接译为“教会”或“神的子民”
  rationale: 本节沿用石头与建造的异象意象；不在正文中把象征解释固定化。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“主母”体现异象叙事中的尊称；句式保留问答的责备力度。“洁白、圆滑”服务于石材意象，“建筑”则保持象征的开放性。
