base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/001.yaml
  text: “Do you want to know about those who are being cut down and thrown far from the tower? These are the sons of lawlessness; they believed in hypocrisy, and no wickedness departed from them. For this reason they have no salvation, because they are not fit for the building on account of their wicked deeds. Therefore they were cut down and thrown far away because of the anger of the Lord, because they provoked him.
translation:
  language: zh_hans
  text: “你想知道那些被凿削、从塔那里远远抛出去的人吗？这些人就是不法之子；他们虚伪地相信，一切邪恶都没有离开他们。因此，他们没有救恩，因为他们因自己的邪恶而不适于建造。正因如此，他们被凿削，又被远远抛出去，是由于主的愤怒，因为他们激怒了他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακοπτομένους / συνεκόπησαν
  choice: 被砍碎
  rationale: 保留石料遭砍凿、毁坏的异象意象；“砍碎”也体现前缀 κατά 所加强的彻底性，并与后文重复用词对应。
- source_word: μακρὰν ῥιπτομένους / πόρρω ἀπερίφησαν
  choice: 远远扔离那座塔 / 远远地抛了出去
  rationale: 准确表达与塔分离并被抛远的空间动作，同时用自然汉语避免生硬逐词对应。
- source_word: υἱοὶ τῆς ἀνομίας
  choice: 不法之子
  rationale: 保留闪语式身份表达及其郑重语域，不弱化为泛指的“恶人”。
- source_word: ἐπίστευσαν δὲ ἐν ὑποκρίσει
  choice: 他们虽信了，却是出于虚伪
  rationale: δὲ 在语境中有转折意味；“出于虚伪”保留 ἐν ὑποκρίσει 对其相信方式或状态的限定，而不擅自解释为具体类型的假信。
- source_word: πᾶσα πονηρία οὐκ ἀπέστη ἀπʼ αὐτῶν
  choice: 一切邪恶始终没有离开他们
  rationale: 保留原文拟人化的“邪恶没有离开”说法，并以“始终”自然传达其持续状态。
- source_word: οὐκ ἔχουσιν σωτηρίαν
  choice: 他们没有救恩
  rationale: 直译 σωτηρίαν，保留其救赎性及可能兼有获救、安然之意的神学张力。
- source_word: εὔχρηστοι εἰς οἰκοδομήν
  choice: 能用于建造
  rationale: 保持石头与建筑的核心比喻；“能用于”自然表达 εὔχρηστοι 的合用、可用之义。
- source_word: διὰ τὰς πονηρίας αὐτῶν
  choice: 因为他们作恶
  rationale: 用现代汉语自然表达复数 πονηρίας 所指的多般恶行；不与前句抽象的“邪恶”机械重复。
- source_word: ὀργὴν τοῦ Κυρίου
  choice: 主的愤怒
  rationale: 保留拟人化及审判语气，不淡化为“惩罚”或“震怒的后果”。
- source_word: παρώργισαν αὐτόν
  choice: 他们激怒了他
  rationale: 直接对应使役含义，并保留“主”与代词之间的指称衔接。
theological_decisions:
- issue: “他们没有救恩”是否应解释为永远不得救
  choice: 保留原文绝对措辞“没有救恩”
  alternative: 译为“目前不能得救”或“失去了永远的救恩”
  rationale: 原文未明说时间范围，也未系统界定最终结局；译文不加入暂时性或永久性的教义判断。
- issue: ἐπίστευσαν 所指信仰的真实性
  choice: 译作“他们虽信了，却是出于虚伪”
  alternative: 译作“他们假装相信”或“他们有虚假的信心”
  rationale: 原文同时肯定“相信”这一动作，又以“虚伪”限定它；保留两者之间的张力，不把它预先归类为完全没有信或某种特定教义中的信。
- issue: 主的愤怒与人的恶行之间的关系
  choice: 按原文并列保留：因主的愤怒而被抛弃，因为他们激怒了他
  alternative: 合并解释为“主因他们作恶而惩罚他们”
  rationale: 原文重复 διὰ 并明确说他们激怒主；保留因果链及神人关系语言，不将其抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“塔—石料—建造”的异象意象及“不法之子”“救恩”“主的愤怒”等神学用语；句式略作汉语化，但维持原文重复、转折和因果推进。
