revisions:
- from: “你想知道那些被砍碎、远远扔离那座塔的人吗？他们就是不法之子。他们虽信了，却是出于虚伪；一切邪恶始终没有离开他们。因此，他们没有救恩，因为他们作恶，不能用于建造。所以，他们被砍碎，远远地抛了出去；这是由于主的愤怒，因为他们激怒了他。”
  to: “你想知道那些被凿削、从塔那里远远抛出去的人吗？这些人就是不法之子；他们虚伪地相信，一切邪恶都没有离开他们。因此，他们没有救恩，因为他们因自己的邪恶而不适于建造。正因如此，他们被凿削，又被远远抛出去，是由于主的愤怒，因为他们激怒了他。”
  rationale: 修订以“凿削”替换“砍碎”，使石料加工与建造的异象意象更准确；调整抛掷短语以自然表达“从塔那里”的空间关系；删除原文未明示的“始终”；并恢复“因自己的邪恶而不适于建造”的明确因果关系。未对“救恩”的范围、虚伪之信的性质或审判的终局性作额外教义解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:27:06Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实于希腊文与英文审计文本，保留了塔、石头和建造的比喻，也准确呈现了虚伪的信与主的愤怒。不过，“被砍碎”容易使中文读者理解为石头已经碎裂；κατακόπτω / συγκόπτω 在此建筑语境更宜译为“凿削、削凿”，即为建造而加工石料却因不合用而被抛远。另“他们作恶，不能用于建造”把“因他们的诸般邪恶而不适于建造”的因果关系略作压缩，宜明确保留。
  naturalness: 原文庄重通顺，但“远远扔离那座塔的人吗”搭配略不自然，“远远地从塔旁扔出去”或“从塔那里远远抛出去”更符合现代汉语，也更清楚反映ἀπὸ τοῦ πύργου。“一切邪恶始终没有离开他们”可简化为“一切邪恶都没有离开他们”，原文并无单独的“始终”副词。
  terminology: “不法之子”“救恩”“主的愤怒”均可保留，语域和神学开放性合适。“虚伪地相信”比“虽信了，却是出于虚伪”更直接对应ἐπίστευσαν ἐν ὑποκρίσει，且不额外加强让步关系。
  issues:
  - severity: medium
    issue: “被砍碎”可能误导为石料被打成碎块。
    rationale: κατακοπτομένους与后文συνεκόπησαν在塔的石料和建造意象中，指被凿削、加工；本段随后还说这些石头因邪恶而不适于建造。译为“被凿削”更准确地保留该意象。
  - severity: low
    issue: “远远扔离那座塔”中文搭配不够自然，且“从塔”这一离开点未清楚表达。
    rationale: ἀπὸ τοῦ πύργου表示从塔处／离开塔；改为“从塔那里远远抛出去”既自然又保留空间关系。
  - severity: low
    issue: “始终”并非原文明确词项。
    rationale: οὐκ ἀπέστη为完成时，表示邪恶未曾离开他们；中文不必额外加入可能强化时间持续性的“始终”。
  - severity: low
    issue: “因为他们作恶，不能用于建造”略弱化原文的‘因他们的邪恶而不合用’。
    rationale: διὰ τὰς πονηρίας αὐτῶν直接说明其邪恶是不能用于建造的理由；应明确保留这一因果结构。
  revised_text: “你想知道那些被凿削、从塔那里远远抛出去的人吗？这些人就是不法之子；他们虚伪地相信，一切邪恶都没有离开他们。因此，他们没有救恩，因为他们因自己的邪恶而不适于建造。正因如此，他们被凿削，又被远远抛出去，是由于主的愤怒，因为他们激怒了他。”
  revised_footnotes: []
