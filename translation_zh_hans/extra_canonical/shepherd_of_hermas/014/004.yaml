base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/004.yaml
  text: 4. “And the mutilated ones—these are those who have believed and have the greater part in righteousness, but have certain parts of lawlessness. For this reason they are mutilated and not whole.
translation:
  language: zh_hans
  text: 4. 至于那些残缺的石头，就是那些已经信了、在义方面占大部分，却仍有一些不法部分的人。因此，他们是残缺的，并不完整。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεκολοβωμένοι / κολοβοί
  choice: 残缺的（石头）
  rationale: 本段延续建塔石头的比喻；该词指被截短、缺损。译为“残缺”既保留具体意象，也表达属灵上的不完整。首处补出语境中隐含的“石头”，帮助独立分段的读者理解。
- source_word: πεπιστευκότες
  choice: 已经信了
  rationale: 完成时表示信的行动已经发生，并形成当前身份；“已经信了”自然保留这一语气。
- source_word: τὸ πλεῖον μέρος ἔχοντες ἐν τῇ δικαιοσύνῃ
  choice: 在义上占了大部分
  rationale: 尽量保留原文“较大的部分”与“义”的比例性表达，不将其解释为功德、地位或某一特定教义范畴。
- source_word: τινὰ δὲ μέρη ἔχουσιν τῆς ἀνομίας
  choice: 却仍有某些部分属于不法
  rationale: 保留与“较大的部分”相对的部分—整体意象；ἀνομία译作“不法”，避免缩窄为单一类型的罪。
- source_word: οὐχ ὁλοτελεῖς
  choice: 并不完整
  rationale: 该词表示完整、完全无缺；结合石头意象译为“不完整”，与“残缺”形成自然呼应。
theological_decisions:
- issue: “义”与“不法”按部分并存的表述
  choice: 保留原文的比例性和张力，不把它改写成称义地位、道德功劳或真假信心的判定
  alternative: 解释为“他们大体行为正直，但仍犯有一些罪”
  rationale: 原文刻意以石头的完整程度描写这些信徒，并使用“部分”语言；直保留此张力较少导入后世宗派框架。
- issue: πεπιστευκότες所指之信的性质
  choice: 译作“已经信了”，不另加“真心”“仅仅自称”等限定
  alternative: 译作“已经真正相信”或“只是自称相信”
  rationale: 本句本身没有这些限定，故不应替作者判定其信心的性质。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留建塔异象中的石头隐喻及“残缺—完整”“义—不法”的平行对照；不增加原文未明说的教义解释。
