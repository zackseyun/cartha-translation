review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了“已信”“义占较大部分”“仍有不法的部分”以及“残缺而不完整”的基本对照，也适当地延续了上文石头的比喻。不过，“某些部分属于不法的人”将原文τῆς ἀνομίας（“不法的／属于不法的”）误转为“属于不法之人”，改变了所属对象。
  naturalness: “在义上占了大部分”可以理解，但“在义方面占大部分”更符合现代汉语中比例性隐喻的表达。“残缺的石头”及“并不完整”自然、庄重。
  terminology: “义”对应δικαιοσύνη，“不法”对应ἀνομία，均可保留，且避免导入特定教义解释。以“残缺”处理κεκολοβωμένοι／κολοβοί能保留石头受损的意象。
  issues:
  - severity: medium
    issue: “却仍有某些部分属于不法的人”
    rationale: 原文τινὰ δὲ μέρη ἔχουσιν τῆς ἀνομίας说他们“有一些不法的部分”，并未说这些部分“属于不法的人”。“的人”无原文依据，并使中文关系发生变化。
  revised_text: 4. 至于那些残缺的石头，就是那些已经信了、在义方面占大部分，却仍有一些不法部分的人。因此，他们是残缺的，并不完整。
