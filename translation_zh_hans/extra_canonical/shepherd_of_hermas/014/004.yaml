revisions:
- from: 4. 至于那些残缺的石头，就是那些已经信了、在义上占了大部分，却仍有某些部分属于不法的人。因此，他们是残缺的，并不完整。
  to: 4. 至于那些残缺的石头，就是那些已经信了、在义方面占大部分，却仍有一些不法部分的人。因此，他们是残缺的，并不完整。
  rationale: 修改“属于不法的人”为“不法部分”，以忠实表达“不法的部分”而不加入“人”的概念；同时微调“在义上”为“在义方面”，使“较大的部分在义中”的比例性表达在现代汉语中更清楚自然。其余措辞保留原有石头隐喻、语义张力和庄重语体。
