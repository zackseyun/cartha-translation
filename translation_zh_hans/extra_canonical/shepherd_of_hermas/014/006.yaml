base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/006.yaml
  text: 6. And I answered her, “Lady, when then will they become fit for the building?” She said, “When their wealth that ensnares them has been cut away, then they will be useful to God. For just as a round stone, unless it is cut and casts off something from itself, cannot become square, so also those who are rich in this age, unless their wealth is cut away, cannot become useful to the Lord.
translation:
  language: zh_hans
  text: 6. 我回答她说：“夫人，那么，他们什么时候才会适于建造呢？”她说：“等到那使他们沉迷的财富被削去时，他们就会为上帝所用。正如一块圆石，若不经削凿，不从自身去掉一些，就不能成为方石；同样，在这个世代富有的人，若他们的财富不被削去，也不能为主所用。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὔχρηστοι εἰς τὴν οἰκοδομήν
  choice: 成为建造工程可用的材料
  rationale: 保留石头与建造的比喻，并以现代汉语清楚表达“适合用于建造”。
- source_word: ὁ πλοῦτος ὁ ψυχαγωγῶν αὐτούς
  choice: 那迷惑他们的财富
  rationale: ψυχαγωγέω在此带有财富牵引、诱导或支配人的负面含义；“迷惑”自然且不把意义过度限定为单纯娱乐或欺骗。
- source_word: περικοπῇ
  choice: 被削去／削去
  rationale: 延续石材加工的具体意象，也表达财富必须受削减的比喻意义。
- source_word: τετράγωνος
  choice: 方石
  rationale: 语境所指不是抽象的“方形”，而是经削凿后适于砌筑的方整石料。
- source_word: τῷ Θεῷ / τῷ Κυρίῳ εὔχρηστοι
  choice: 成为上帝可用的人／成为主可用的人
  rationale: 保留原文God与Lord的称谓变化，并以“可用的人”表达对上帝有用、合用之意。
- source_word: ἐν τούτῳ τῷ αἰῶνι
  choice: 在这个世代
  rationale: 保留αἰών的时代性与早期基督教语境，不缩减为单纯的“今生”。
theological_decisions:
- issue: 财富被削去的施事者与具体方式
  choice: 采用无明确施事者的“被削去”，不说明由上帝、患难或本人舍弃来完成
  alternative: 译为“他们舍弃财富”或“上帝夺去他们的财富”
  rationale: 希腊文使用被动式而未明说施事者；保持这种开放性，避免加入原文未明确表达的神学解释。
- issue: 财富与蒙救赎或属灵资格之间的关系
  choice: 仅表达财富必须被削减后才能“成为主可用的人”
  alternative: 解释为富人必须完全放弃财产才能得救
  rationale: 本节聚焦建造比喻中的合用性，没有在此直接界定救恩条件；译文不扩大命题。
- issue: God与Lord的称谓
  choice: 分别译作“上帝”和“主”
  alternative: 统一译作“上帝”或“主”
  rationale: 原文有意或至少实际使用了不同称谓，翻译予以保留，不擅自同化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“夫人”对应κυρία，符合赫尔马斯对异象中妇人的尊称。“建造工程可用的材料”在首句补明石材语境，后文则用“可用的人”自然转回人物所代表的属灵含义。
