base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/002.yaml
  text: '2. “And the others you saw—many lying there, not going into the building—these are the scabby ones: they came to know the truth, but did not remain in it, nor did they join themselves to the saints; therefore they are useless.'
translation:
  language: zh_hans
  text: 2. “至于你看见的另外那些石头——许多躺在那里，没有被放进建筑中——这些就是患疥癣的；他们已经认识了真理，却没有持守在真理中，也没有与圣徒相连；因此，他们是无用的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: 长了疥癣的
  rationale: 该词指患有疥癣或皮肤病，且上下文以有缺陷的石头作象征；采用具体而保留意象的译法，不泛化为“有瑕疵的”。
- source_word: ἐγνωκότες τὴν ἀλήθειαν
  choice: 已经认识了真理
  rationale: 以完成意义表达他们确曾认识真理，并与随后未能持守形成张力。
- source_word: ἐπιμείναντες
  choice: 持守
  rationale: 表达继续停留、坚持于真理之中的含义，现代中文自然且适合宗教语境。
- source_word: κολλώμενοι τοῖς ἁγίοις
  choice: 与圣徒紧密相连
  rationale: 保留 κολλάω 所含的黏合、联结意象，也呼应石头进入建筑的上下文。
- source_word: ἄχρηστοί
  choice: 无用的
  rationale: 与本段建筑材料是否可用的意象一致，直接表达“不适用、派不上用场”，不额外解释为被弃绝。
theological_decisions:
- issue: “圣徒”的所指
  choice: 圣徒
  alternative: 圣洁的人／信徒群体
  rationale: 原文 τοῖς ἁγίοις 可指蒙分别为圣的群体；保留传统而宽泛的称谓，不限定为后世封圣制度中的特定人物。
- issue: 认识真理却未持守的状态
  choice: 按原文并列陈述，不补充其最终救恩结局
  alternative: 解释为已经失去救恩或从未真正相信
  rationale: 本节仅说他们因未持守并未与圣徒相连而“无用”，不应替原文解决相关神学张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留石头、疥癣、建筑及联结等连续意象；“没有被放进建筑中”按语境自然处理 μὴ ὑπάγοντας εἰς τὴν οἰκοδομήν，并避免误解为石头自行行走。
