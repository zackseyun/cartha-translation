review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了他们“认识真理”、却未继续留在真理中、也未与圣徒相连，因而“无用”的基本意思；并且没有越过本节对其救恩状态作推断。μως，“紧密相连”把 κολλώμενοι 所表达的联结加强为“紧密”，并非原文明确的程度，宜删去该额外强化。
  naturalness: 整体现代、通顺，石头与建筑的比喻也易懂。“患疥癣的”比“长了疥癣的”更合乎现代汉语的疾病表述；后文用“他们”承接这一比喻性称呼，行文更自然。
  terminology: “真理”“圣徒”“无用”均可对应原文并维持庄重、非宗派化的语域。“疥癣”保留 ἐψωριακότες 的具体皮肤病／结痂意象，不将其泛化为一般的“有瑕疵”。
  issues:
