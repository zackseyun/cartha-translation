review_pass:
  verdict: revise
  source_fidelity: 前半节忠实传达了从赫尔马自身经历学习、富有时“无用”、如今“有用且有益于生命”，以及要对上帝有用的劝勉。末句的 χρᾶσαι 形态和句法历来较难；所给希腊文本的形式更自然地读作对赫尔马的主动劝告“使用”，而非“被取用”。现译将其定为被动，虽符合英语审校轨迹，却未充分反映所给原文的表层语法，宜以脚注保留另一种理解。
  naturalness: “先从你自己身上明白这个道理”自然，但“从你自己身上明白”略显累赘；“先从你自己的经历明白”更合现代汉语。“对生命也有益处”可理解，改为“也有益于生命”更凝练。
  terminology: “无用／有用”以及“对上帝有用”恰当地保留了 ἄχρηστος／εὔχρηστος 的重复和建造语境。“上帝”用语一致。“同样的石头”比“这些石头”更准确对应 αὐτῶν。
  issues:
  - severity: medium
    issue: 末句译为“你自己也是从这些石头中被取用的”
    rationale: 所给文本的 χρᾶσαι 形式表面上是主动的“使用”，现译采用被动解释并改变了句子的施事关系。该处文本和解释均有困难，宜在正文按主动读法翻译，并以脚注说明英语审校轨迹及部分解释所采用的被动性理解。
  - severity: low
    issue: “这些石头”未体现 αὐτῶν 的“同样”
    rationale: “同样的石头”保留与前文建塔石材的对应关系，也更贴近原文。
  revised_text: 7. 先从你自己的经历明白：你富有的时候，是无用的；如今你却是有用的，也有益于生命。你们要成为对上帝有用的人；因为你自己也要使用同样的石头。
  revised_footnotes:
  - marker: a
    text: “也要使用同样的石头”：此处希腊文 χρᾶσαι 的形式和句意较难确定。按所给文本的表层语法，可理解为对赫尔马的劝告，即“使用同样的石头”；也有译法按上下文的建塔意象理解为“你自己也是由同样的石头被使用的（石头）”。
    reason: 保留困难文本的语法与解释歧义，避免将被动性解释当作无争议的原意。
  revision_rationale: 修订末句以优先反映所给希腊文本的主动形式，并用脚注透明说明与英语审校轨迹一致的另一种上下文解释。其余调整仅为现代汉语的流畅度和“同样的”的原文对应，不改变段落的建造意象或神学开放性。
