review_pass:
  verdict: revise
  source_fidelity: 前半节准确保留了原文以赫尔马自身经历作例证的劝勉，以及“无用／有用”的对照。末句的χρᾶσαι在传本中形式和句法均有困难；结合紧邻的建塔与石头意象，以及英语审校轨迹，宜表达赫尔马本人也是同一批石头中被使用的一块。草案“从这些石头中被取用”会使人误解为他从石头中被取出，未清楚传达其作为石头被采用的意思。
  naturalness: “先从你自己身上明白这个道理”自然。“对生命也有益处”可保留原文未限定的 ζωή。末句改为“也是这些石头中被使用的一块”后，中文更顺畅，并与上下文的建造比喻连贯。
  terminology: “上帝”“无用的／有用的”“生命”“石头”均符合庄重的现代普通话，并维持本段的关键词与意象。将“上帝可用的人”改作“为上帝所用的人”更自然，且不改变τῷ Θεῷ所表示的对象。
  issues:
  - severity: medium
    issue: 末句“你自己也是从这些石头中被取用的”语义不清，且易译成赫尔马从石头中被取出。
    rationale: ἐκ τῶν αὐτῶν λίθων与建塔石头的上下文相连；在困难的χρᾶσαι读法下，英语审校轨迹也将赫尔马理解为同一批石头中被使用者。中文应明确其为被采用的石头之一，同时以脚注说明该动词句法不确定。
  revised_text: 7. 先从你自己身上明白这个道理：你富有的时候，是无用的；如今却是有用的，对生命也有益处。你们要成为为上帝所用的人；因为你自己也是这些石头中被使用的一块。†
  revised_footnotes:
  - marker: †
    text: 末句的希腊文动词形式及句法在传本中较为困难。这里按本段建塔的比喻，并参照英语审校轨迹，译为赫尔马本人也是同一批石头中被采用的一块；不据此确定更具体的施事者或神学含义。
    reason: 标示χρᾶσαι及其与“从同样的石头”搭配所造成的文本和句法不确定性，避免将解释当作无争议的原文。
  revision_rationale: 修订仅处理末句的中文歧义与不自然表达，并把“上帝可用的人”调整为更合乎现代汉语的“为上帝所用的人”。脚注保留困难读法的开放性，未擅自确立动词的精确语法分析或教义解释。
