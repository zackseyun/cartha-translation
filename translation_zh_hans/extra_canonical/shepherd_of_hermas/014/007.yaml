base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/007.yaml
  text: '7. “Learn first from yourself: when you were rich, you were useless; but now you are useful and beneficial for life. Become useful to God; for you yourself also are used from the same stones.”'
translation:
  language: zh_hans
  text: 7. 先从你自己身上明白这个道理：你富有的时候，是无用的；如今却是有用的，对生命也有益处。你们要成为为上帝所用的人；因为你自己也是这些石头中被使用的一块。†
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ [δὲ] σεαυτοῦ πρῶτον γνῶθι
  choice: 先从你自己身上明白这个道理
  rationale: 保留“从你自己”这一以赫尔马自身经历为例证的表达；括号中的 δὲ 文本存疑且在此不必另行译出。
- source_word: ἄχρηστος / εὔχρηστος
  choice: 无用的／有用的（上帝可用的）
  rationale: 维持本段关于石材是否适合建造的核心词语对照；在 τῷ Θεῷ 处译成“上帝可用”，自然呈现与格所指的用途。
- source_word: ὠφέλιμος τῇ ζωῇ
  choice: 对生命也有益处
  rationale: 直译其与格关系，并保留“生命”可能兼具今生生活与属灵生命意味的张力，不限定为某一种解释。
- source_word: χρᾶσαι
  choice: 被取用
  rationale: 按上下文理解为使用、采用；使用被动式，与赫尔马作为建塔石头之一的意象相合。
- source_word: ἐκ τῶν αὐτῶν λίθων
  choice: 从这些石头中
  rationale: 保留 ἐκ 的来源或群体范围含义，指向异象中同一类石头，而不擅自补充更具体身份。
theological_decisions:
- issue: 财富与属灵用途的关系
  choice: 按原文说“富有的时候，是无用的；如今……有用”，保留对财富的尖锐评价
  alternative: 弱化为“财富曾妨碍你发挥作用”
  rationale: 上文明确以圆石必须削去一部分比喻财富被削减；此处应保留原文判断力度，不将其改写成一般性的理财劝诫。
- issue: “对生命有益”的所指
  choice: 保留“生命”而不解释为“教会”“永生”或“他人的生活”
  alternative: 译作“有益于永生”或“对教会有益”
  rationale: 原文 ζωή 未进一步限定；直译可保留其神学与语义开放性。
- issue: 末句是否指上帝使用赫尔马
  choice: 采用被动表达“你自己也是……被取用的”
  alternative: 译作主动命令“你也要使用同样的石头”
  rationale: χρᾶσαι 形式罕见且传本文句略显困难；结合前句“成为上帝可用”及建塔意象，被动或中动意义更连贯，但不额外明说施事者。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“石头”意象及“无用／有用”的反复，使本节与上文建塔语境相连；不加入原文没有的教派性解释。
