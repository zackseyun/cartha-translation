review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了好消息带来喜乐、使内在生命更新，并以“同样”保留了类比关系。但“若听到”把原文“有好消息来到”窄化为听觉事件；“什么也不再留意”弱化了προσδέχεται的“接受／接纳”意义；“去行善”则将εἰς τὸ ἀγαθόν较宽的“向着善／在善上”具体化为行为。
  naturalness: 整体流畅、庄重，符合现代标准汉语。“心灵”在此语境自然；将“消息来到”和“再接受别的事”译明后，句意更贴合原文且仍通顺。
  terminology: “好消息”恰当，不应预设为“福音”。πνεῦμα译“心灵”可避免不必要的圣灵化；前后统一为“心灵”。“这些美好的事”保留ταῦτα τὰ ἀγαθά的开放所指。
  issues:
  - severity: medium
    issue: “若听到某个好消息”
    rationale: 原文为“若有某个好消息来到一个忧愁的人”，随后才说“他所听见的消息”。译文提前并合并这两个表达，略失原文的推进。
  - severity: medium
    issue: “什么也不再留意”
    rationale: προσδέχεται主要是接受、接纳，而非单纯留意；应保留“除了所听见的消息以外，不再接受别的事”的排他意味。
  - severity: medium
    issue: “得着力量去行善”
    rationale: εἰς τὸ ἀγαθόν可指向善、为善或在善上得坚固；“去行善”虽可通，却过早限定为具体善行。
  revised_text: 因为，正如有好消息来到一个忧愁的人，他立刻忘却先前的忧愁，除了所听见的消息以外，不再接受别的事；从此，他向着善得以刚强，他的心灵也因所领受的喜乐而更新。同样，你们看见这些美好的事，心灵也得以更新。
