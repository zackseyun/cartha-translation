revisions:
- from: 因为，正如一个悲伤的人若听到某个好消息，就立刻忘了先前的忧愁，除所听见的消息以外，什么也不再留意；从此，他得着力量去行善，他的心灵也因所得的喜乐而焕然一新。同样，你们看见这些美好的事，心灵也得以更新。
  to: 因为，正如有好消息来到一个忧愁的人，他立刻忘却先前的忧愁，除了所听见的消息以外，不再接受别的事；从此，他向着善得以刚强，他的心灵也因所领受的喜乐而更新。同样，你们看见这些美好的事，心灵也得以更新。
  rationale: 修订按希腊文的次序区分“好消息来到”与“所听见的消息”，以“不再接受别的事”对应προσδέχεται，并将εἰς τὸ ἀγαθόν译为较开放的“向着善”，避免将原文未限定的善窄化为特定行为。其余核心措辞保留草稿的自然现代汉语表达。
  reviewer_model: gpt-5.6-terra
