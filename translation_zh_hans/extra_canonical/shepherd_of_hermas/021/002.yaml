base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/002.yaml
  text: For just as when some good message comes to someone who is grieving, he immediately forgets his former sorrows and welcomes nothing else except the message that he heard, and from then on he is strengthened for what is good, and his spirit is renewed because of the joy that he received, so also you have received a renewal of your spirits by seeing these good things.
translation:
  language: zh_hans
  text: 因为，正如有好消息来到一个忧愁的人，他立刻忘却先前的忧愁，除了所听见的消息以外，不再接受别的事；从此，他向着善得以刚强，他的心灵也因所领受的喜乐而更新。同样，你们看见这些美好的事，心灵也得以更新。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία ἀγαθή
  choice: 好消息
  rationale: 直译为“好的消息”，在现代汉语中以“好消息”最自然；此处不特指福音，故不译作“福音”。
- source_word: προσδέχεται
  choice: 留意
  rationale: 此处表示悲伤者听到好消息后不再接纳或关注别的事；“留意”在汉语中自然，并保留注意力完全转向消息的语意。
- source_word: ἰσχυροποιεῖται ... εἰς τὸ ἀγαθόν
  choice: 得着力量去行善
  rationale: 兼顾被动形式“得以刚强”和目的或趋向“向着善”；“行善”使现代读者易懂，但不把善限定为单一行为。
- source_word: πνεῦμα / πνευμάτων
  choice: 心灵
  rationale: 上下文指人内在的精神获得振奋与更新，并非明确指圣灵；“心灵”比“灵”更自然，也避免神学上的误解。
- source_word: ἀνανέωσιν
  choice: 更新
  rationale: 保留与前句ἀνανεοῦται的词根呼应，表达内在状态重新焕发生机。
- source_word: ταῦτα τὰ ἀγαθά
  choice: 这些美好的事
  rationale: 保留中性复数的宽泛所指，不擅自限定为“异象”“福分”或“善事”。
theological_decisions:
- issue: πνεῦμα是否应理解为圣灵
  choice: 按人的心灵理解
  alternative: 译作“灵”，可能被理解为圣灵
  rationale: 所有格“他的心灵”及复数“你们的心灵”均指各人的内在生命；上下文没有将其明确标示为神的灵。
- issue: εἰς τὸ ἀγαθόν所指为何
  choice: 译为“去行善”
  alternative: “在善事上刚强”或“向着美善得坚固”
  rationale: 希腊语保留一定宽度，既可指趋向善，也可指善行；正文采用自然表达，同时不引入特定功德论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文“好消息—喜乐—心灵更新”的因果推进，并以“同样”准确呈现οὕτως καί的类比结构。第二人称复数译为“你们”。
