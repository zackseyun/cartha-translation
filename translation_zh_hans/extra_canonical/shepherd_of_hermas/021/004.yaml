base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/004.yaml
  text: Therefore those who have repented completely will be new and firmly founded, those who have repented from their whole heart. You have the revelation complete. No longer ask anything about revelation; but if anything is needed, it will be revealed to you.
translation:
  language: zh_hans
  text: 所以，那些全心彻底悔改的人，必将全然更新，根基已经立稳。你已经完整地领受了这启示；不要再为启示求问什么。但若有什么需要，必会向你启示。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσαντες
  choice: 悔改的人
  rationale: 兼顾该词转变心意与生命归正的含义，并沿用早期基督教文本中自然、通行的表达。
- source_word: ὁλοτελῶς
  choice: 彻底
  rationale: 表达完全、没有保留之意，同时避免生硬直译。
- source_word: νέοι ἔσονται
  choice: 必将成为新人
  rationale: νέοι 在此与前文更新的意象相连；译为“成为新人”比单纯“变年轻”更能传达悔改所带来的更新。
- source_word: τεθεμελιωμένοι
  choice: 根基稳固
  rationale: 保留建筑性的“奠基”隐喻及其稳固含义，呼应前文坚固的座位。
- source_word: ἀπέχεις
  choice: 你已经领受了
  rationale: 此处有“已完全得到、具备”之意；在启示语境中译作“领受”自然庄重。
- source_word: αἰτήσεις
  choice: 求问
  rationale: 原词基本义为请求、求取；结合“有关启示”这一宾语，译作“求问”符合汉语语境，又不将其限定为祷告。
theological_decisions:
- issue: 悔改者“成为新的”是身份更新还是恢复年轻
  choice: 译作“成为新人”
  alternative: “将变得年轻”
  rationale: 上下文以老妇逐渐年轻象征群体因信徒悔改而更新；“新人”保留属灵更新的重点，但不进一步引入特定的重生教义体系。
- issue: 完整启示与随后仍可能有启示之间的张力
  choice: 保留“完整的启示”与“若有必要，必会向你启示”的并置
  alternative: 将前句解释为“这次启示已经结束”
  rationale: 希腊文本本身同时作出这两项陈述；不把“完整”窄化，以免消解原文张力。
- issue: 两个悔改分词短语的关系
  choice: 译为同一群人的递进说明：“那些彻底悔改、全心悔改的人”
  alternative: 拆成两个不同群体或译成条件句
  rationale: 后一个带冠词的短语自然地重申并界定前者，强调彻底悔改就是全心悔改。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“根基稳固”保留原文建筑隐喻；分号呈现命令与附带条件之间的逻辑关系。无脚注，因此正文不设脚注标记。
