base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/003.yaml
  text: And because you saw her sitting on a bench, the position is firm; because the bench has four feet and stands firmly. For indeed the world is held together by four elements.
translation:
  language: zh_hans
  text: 至于你看见她坐在一张长凳上，座位是稳固的；因为这长凳有四只脚，立得很稳。因为世界也是由四种元素维系的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλιον
  choice: 长凳
  rationale: 指有四只脚、可供人坐的凳子；译作“长凳”自然清楚，也与下文的四只脚相符。
- source_word: ἰσχυρὰ ἡ θέσις
  choice: 她所处的位置稳固
  rationale: 保留名词句的解释意味；θέσις在此既可指所坐之处，也含稳固处境之意，不进一步作神学化引申。
- source_word: κρατεῖται
  choice: 支撑
  rationale: 此处为被动形式，表达世界由四种元素维系、托住；“支撑”符合上下文关于凳脚稳固承托的比喻。
- source_word: στοιχεῖα
  choice: 元素
  rationale: 在古代宇宙观语境中指构成世界的四种基本元素，直译为“元素”最为准确。
theological_decisions:
- issue: 四种元素与世界稳固之间的陈述性质
  choice: 按原文直接保留古代宇宙论表述
  alternative: 改写为现代科学意义上的世界构成
  rationale: 本句是在解释异象象征，采用当时常见的四元素宇宙观；翻译不应以现代观念替换原文，也不将其扩展为教义命题。
- issue: θέσις所指的稳固性
  choice: 译为“她所处的位置稳固”
  alternative: 明确解释为“教会根基稳固”
  rationale: 本节原句没有在此直接点明“教会根基”，应保留其象征张力，避免加入解释性神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两次强调“稳固”的修辞，并以“事实上”传达καὶ γάρ的解释语气。
