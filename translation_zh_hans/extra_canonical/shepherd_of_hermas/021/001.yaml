  text: But in the third vision you saw her younger, beautiful, and cheerful, and her appearance was beautiful.
translation:
  language: zh_hans
  text: 但在第三个异象中，你看见她较年轻、美丽、欢快，她的容貌也美丽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεωτέραν
  choice: 比先前年轻
  rationale: 该词是比较级“更年轻”；结合连续异象中同一女性形象的变化，用“比先前年轻”自然保留比较含义。
- source_word: καλὴν
  choice: 容貌美丽
  rationale: 原文两次使用“美丽”，后一次又由“她的形貌”具体说明；汉语合并表达可避免生硬重复，同时保留对外貌之美的强调。
- source_word: ἱλαράν
  choice: 神情欢快
  rationale: 表示愉悦、开朗；加“神情”使其与前后的外貌描写自然衔接，而不赋予额外神学含义。
- source_word: μορφὴν
  choice: 容貌
  rationale: 此处指可见的形貌、外观；“容貌”符合所描写女性形象的语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。原文“美丽”及“她的形貌美丽”有重复强调；译文以“容貌美丽”浓缩呈现，避免现代汉语中的累赘感，同时保留三项特征：更年轻、美丽、欢快。
