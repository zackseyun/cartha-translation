base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/001.yaml
  text: After the beast had passed by me and I had gone forward about thirty feet, behold, a virgin meets me, adorned as if coming out of a bridal chamber, all in white and with white sandals, veiled up to her forehead; her covering was with a turban, and her hair was white.
translation:
  language: zh_hans
  text: 那兽从我身边过去以后，我又向前走了约三十英尺。看哪，一位童女迎面而来；她装扮得仿佛从新房出来，一身白衣，脚穿白鞋，面纱遮至额头；她的遮盖物是一条头巾，头发是白的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: 那兽
  rationale: 承接上文所见的特定猛兽；用“兽”简洁保留异象叙事的语感。
- source_word: ὡσεὶ πόδας τριάκοντα
  choice: 约三十步
  rationale: πούς既是“脚”也是古代长度单位；此处表示行进距离。译为普通读者易懂的“三十步”，同时以“约”对应ὡσεὶ，避免误作现代英尺的精确换算。
- source_word: παρθένος
  choice: 童女
  rationale: 保留未婚贞洁女子的基本含义，并采用庄重的异象文学用语。
- source_word: κεκοσμημένη
  choice: 装扮得
  rationale: 表达衣饰已经整备妥当的完成状态，不额外加入珠宝或华丽程度。
- source_word: νυμφών
  choice: 新房
  rationale: 指婚礼或新婚所用的房间；“新房”自然明白，也保留婚礼场景。
- source_word: μίτρα
  choice: 头巾
  rationale: 指缠裹或佩戴在头上的覆盖物；译作“头巾”较自然，且不把形制限定为现代意义的某一种帽饰。
theological_decisions:
- issue: 童女形象的身份
  choice: 只译作“一位童女”，不在正文中解释其象征身份
  alternative: 直接称她为教会或其他拟人化形象
  rationale: 本句只描写所见人物，身份解释应由后文或注释提供，不应在翻译中预先解决。
- issue: 白色衣着、鞋和头发的象征意义
  choice: 按原文逐项保留，不添加纯洁、年老或荣耀等解释
  alternative: 把白色明确解释为圣洁或古老
  rationale: 原文在此呈现视觉细节，却没有明说象征意义；翻译应保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留ἰδού带来的异象性和突然显现感；句式适度分号化，以清楚呈现衣着、面纱、头巾与白发等连续细节。
