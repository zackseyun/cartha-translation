  to: 那兽从我身边过去以后，我又向前走了约三十英尺。看哪，一位童女迎面而来；她装扮得仿佛从新房出来，一身白衣，脚穿白鞋，面纱遮至额头；她的遮盖物是一条头巾，头发是白的。
