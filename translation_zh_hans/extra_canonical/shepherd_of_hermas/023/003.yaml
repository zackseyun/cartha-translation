base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/003.yaml
  text: Believe in the Lord, you double-minded, because he is able to do all things and turns his anger away from you, but sends plagues upon you who are double-minded. Woe to those who have heard these words and disobeyed; it would have been better for them not to have been born.
translation:
  language: zh_hans
  text: 你们这些心怀二意的人，要信靠主，因为他凡事都能；他使自己的愤怒离开你们，又向你们这些心怀二意的人降下惩罚。那些听见这些话却不听从的人有祸了！他们倒不如没有出生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίψυχοι / διψύχοις
  choice: 心怀二意的人
  rationale: δίψυχος 字面意为“有两个心魂”，指内心摇摆、信心不专一；“心怀二意”既保留意象，也符合现代汉语表达。
- source_word: πιστεύσατε τῷ Κυρίῳ
  choice: 要信靠主
  rationale: 与格宾语在此表示对主的信赖；“信靠”比单纯“相信”更能传达倚赖与忠信的意味。
- source_word: πάντα δύναται
  choice: 他凡事都能
  rationale: 保留原文对主能力的概括性宣告，不另行限定其范围。
- source_word: ἀποστρέφει τὴν ὀργὴν αὐτοῦ ἀφ' ὑμῶν
  choice: 他可以使自己的愤怒转离你们
  rationale: 贴近“使……转离”的空间隐喻，并以“自己的”明确反身代词所指。
- source_word: ἐξαποστέλλει μάστιγας
  choice: 把灾祸降在……身上
  rationale: μάστιγες 本义为“鞭打、鞭子”，引申为惩罚性灾祸；上下文中采用“灾祸”较自然，同时保留审判含义。
- source_word: παρακούσασιν
  choice: 不听从
  rationale: 该词不仅指未听见，也指听见后拒绝遵从；上下文已明确他们“听见”，故译作“不听从”。
- source_word: αἱρετώτερον ἦν αὐτοῖς τὸ μὴ γεννηθῆναι
  choice: 他们倒不如没有出生
  rationale: 以自然庄重的汉语表达原文比较结构“未出生对他们更可取”。
theological_decisions:
- issue: ἀποστρέφει 与 ἐξαποστέλλει 的关系
  choice: 译为“他可以……也可以……”，保留同一位主既能撤去愤怒、又能降下灾祸的张力
  alternative: 按英语咨询层译为“他使愤怒转离你们，却把灾祸降下”
  rationale: 希腊文以 καὶ 并列两个直陈动词，并无明确转折词；上下文的劝诫容许将其理解为主的两种行动。加入“可以”是依照前句“凡事都能”来连接语义，同时避免把原文强行处理成逻辑矛盾。
- issue: μάστιγας 的惩戒性质
  choice: 灾祸
  alternative: 鞭打／刑罚
  rationale: 原词保留惩戒与痛苦意涵，但此处为复数且与“降下”连用，译作“灾祸”较符合汉语；不进一步断定其为末世刑罚、教会管教或具体疾病。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“心怀二意”“有祸了”“倒不如没有出生”保留早期基督教劝诫文体的力度。原始材料的编号与范围似有错置：所请求的 reader segment 3 实际对应所给希腊文中的第6句，因此仅翻译与英语 POB 对应的 πιστεύσατε 起始段。
