base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/002.yaml
  text: I knew that I would escape it, if your heart becomes pure and without blemish, and if for the remaining days of your life you serve the Lord blamelessly. Cast your cares upon the Lord, and he himself will direct them.
translation:
  language: zh_hans
  text: 我知道：如果你们的心变得纯洁无瑕，并且在你们余下的日子里无可指责地事奉主，我会逃脱那只兽。把你们的忧虑交托给主，他自己必妥善处理这些忧虑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκφυγεῖν
  choice: 逃脱
  rationale: 表达从先前所见之兽面前成功脱险，保留动作的结果意味。
- source_word: καθαρὰ καὶ ἄμωμος
  choice: 纯洁无瑕
  rationale: 分别体现内在洁净与没有污点、无可归咎的双重描述。
- source_word: δουλεύσητε
  choice: 事奉
  rationale: 此处以主为对象，表示如仆人般忠诚服事；“事奉”符合现代中文宗教语境，又不额外引入教派含义。
- source_word: ἀμέμπτως
  choice: 无可指责地
  rationale: 强调行事不留可受责难之处，不将其绝对化为抽象的“完美”。
- source_word: μερίμνας
  choice: 忧虑
  rationale: 指萦绕人心的挂虑和重担。
- source_word: κατορθώσει
  choice: 妥善处理
  rationale: 该词含使之正直、料理妥当或使之顺利之意；这里的宾语回指“忧虑”，中文以“妥善处理”自然表达，同时避免将其窄化为单纯的引导。
theological_decisions:
- issue: 脱险与听者道德更新之间的条件关系
  choice: 保留“只要……我就能……”的条件句
  alternative: 改写为听者纯洁事奉便蒙拯救
  rationale: 希腊文主句为第一人称“我逃脱”，条件却用第二人称复数“你们”；虽有张力，仍按现存文本保留，不擅自统一人称或改换得救主体。
- issue: 将忧虑交托主之后的应许
  choice: “他必亲自妥善处理”
  alternative: “他必引导你们”或“他必使一切顺利”
  rationale: 代词宾语在语法上回指“忧虑”，因此保留主亲自料理这些忧虑的意思，不扩展成对人生各方面的普遍应许。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“那只兽”承接上一段的异象对象；“余生”“卸给主”力求自然凝练。保留原文第一人称主句与第二人称复数条件句之间不寻常的人称转换。
