base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/001.yaml
  text: I say to him, "Lord, listen to a few words from me." He says, "Speak what you wish."
translation:
  language: zh_hans
  text: 我对他说：“主啊，请听我说几句话。”他说：“你想说什么，就说吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: 保留直接称呼的尊敬语气；此处可指对话中的尊长，译文不额外判定其身份。
- source_word: ἄκουσόν μου ὀλίγων ῥημάτων
  choice: 请听我说几句话
  rationale: 按现代汉语自然表达处理属格结构，保留“少量话语”的意思。
- source_word: Λέγε … ὃ βούλει
  choice: 你想说什么，就说吧
  rationale: 准确传达准许对方自由发言的命令式语气，同时符合现代汉语口吻。
theological_decisions:
- issue: Κύριε在此处的指称
  choice: 译作“主啊”而不加身份说明
  alternative: “先生”或“阁下”
  rationale: κύριε既是尊称，也可能带有更强的权威意味；保留“主”可维持原文及作品语境中的开放性，不在正文中先行消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；对话简洁，保留原文两句之间的问答节奏。
