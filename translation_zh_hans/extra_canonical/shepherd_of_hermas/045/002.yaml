base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/002.yaml
  text: '"A person," I say, "Lord, is eager to keep the commandments of God, and there is no one who does not ask from the Lord to be strengthened in his commandments and to be subject to them; but the devil is harsh and tyrannizes them."'
translation:
  language: zh_hans
  text: 我说：“主啊，人固然热切愿意遵守上帝的诫命，也没有一个人不向主祈求，好让自己在遵行他的诫命上得着力量，并顺服这些诫命；可是魔鬼凶狠，辖制着他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόθυμός
  choice: 热切愿意
  rationale: 表达主动、恳切的意愿，而不只是一般的‘愿意’。
- source_word: φυλάσσειν
  choice: 遵守
  rationale: 在诫命语境中自然表达谨守、实行之意。
- source_word: ἐνδυναμωθῇ ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: 在他的诫命上得着力量
  rationale: 保留ἐν与被动式的结构意味，同时使现代汉语自然可懂。
- source_word: ὑποταγῇ αὐταῖς
  choice: 顺服这些诫命
  rationale: 保留ὑποτάσσω所含的服从、置于其下之意，并明确复数代词的所指。
- source_word: σκληρός
  choice: 凶狠
  rationale: 此处描述魔鬼施行压迫的严酷性；‘凶狠’比单纯‘刚硬’更符合上下文。
- source_word: καταδυναστεύει
  choice: 辖制
  rationale: 体现强权压迫、专横控制的语义，也与后文关于魔鬼能否制伏上帝仆人的讨论衔接。
theological_decisions:
- issue: 人遵守诫命的意愿与从主所得能力之间的关系
  choice: 并列保留人的热切意愿、向主祈求能力及顺服诫命三方面
  alternative: 把句意解释为人只有靠神恩才可能产生遵命意愿
  rationale: 希腊文并未系统解释意愿与恩典的先后关系；译文不额外解决这一神学张力。
- issue: 魔鬼对人的权势程度
  choice: 译作‘辖制着他们’，保留说话者在本句中的强烈判断
  alternative: 弱化为‘试探他们’或‘企图辖制他们’
  rationale: καταδυναστεύει是直陈式，语气明确；后文将对此说法作限定，但本段不应预先消解其张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体；保留原文‘我说—主啊’的直接引语结构。以‘上帝’对应Θεός，以‘主’对应Κύριος。无需脚注。
