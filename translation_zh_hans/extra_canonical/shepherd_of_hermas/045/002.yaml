    issue: “在他的诫命上得着力量”搭配生硬且所指略含混。
    rationale: ἐν ταῖς ἐντολαῖς αὐτοῦ在此与“得坚固”及“顺服它们”相连，指人在遵行诫命的事上得到力量；补出“遵行”使现代汉语清楚自然，并不增加神学判断。
