base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/004.yaml
  text: '"When a man fills very many clay jars with good wine, and among those jars a few are empty, he comes to the jars and does not inspect the full ones—for he knows they are full—but he inspects the empty ones, fearing lest they have turned sour; for empty jars quickly turn sour, and the pleasure of the wine is lost.'
translation:
  language: zh_hans
  text: “一个人有许多陶罐，大多装满了好酒，只有几个是空的；他来到这些陶罐前，并不察看那些装满的，因为他知道它们是满的；他察看的却是那些空罐，恐怕它们已经发酸了。因为空罐很快就会发酸，酒的美味便失去了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεράμια
  choice: 陶罐
  rationale: 指盛酒的陶制容器；“陶罐”准确、自然，也保留古代生活背景。
- source_word: ἀπόκενα
  choice: 空的／空罐
  rationale: 与“装满的”形成比喻性对照；依上下文补出“罐”使中文清楚。
- source_word: κατανοεῖ
  choice: 察看
  rationale: 在此表示特意留意、检查某些罐子，“察看”兼顾准确和自然。
- source_word: ὤξισαν / ὀξίζουσι
  choice: 发酸
  rationale: 按酿酒语境表达变酸、酸败；保留原文同根词的呼应。
- source_word: ἡ ἡδονὴ τοῦ οἴνου
  choice: 酒的甘美
  rationale: ἡδονή直指酒给人的愉悦、佳美滋味；“甘美”比单说“味道”更能保留原文意味。
theological_decisions:
- issue: 空罐会“发酸”的比喻性表述
  choice: 按原文直译为“空罐很快就会发酸”
  alternative: 解释为“空罐中的残酒很快会酸败”
  rationale: 原文把“发酸”直接述说于空罐，虽从现实机制看可能指残留物或罐内气味，但译文不替作者补足解释，以保留比喻本身的张力。
- issue: ἡ ἡδονὴ τοῦ οἴνου的结果
  choice: 译为“酒的甘美也就毁了”
  alternative: 译为“酒的美味便消失了”
  rationale: “毁了”对应ἀπόλλυται的强烈结果，同时“甘美”保留酒所带来愉悦的含义，不将其神学化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留陶罐与酒的古代比喻意象，并用分号呈现原文在“满罐”和“空罐”之间的鲜明对照。
