revisions:
- from: 他说：“魔鬼不能辖制那些全心仰望上帝的仆人。魔鬼能与他们搏斗，却不能把他们摔倒。因此，你们若抵挡他，他就会败退，蒙羞地逃离你们。”他又说：“但那些内里空虚的人，却害怕魔鬼，以为他有能力辖制他们。”
  to: 他说：“魔鬼不能辖制那些全心仰望上帝的仆人。魔鬼能与他们搏斗，却不能把他们摔倒。因此，你们若抵挡他，他既被击败，就会蒙羞地逃离你们。”他又说：“但那些内里空虚的人，却害怕魔鬼，仿佛他有权势。”
  rationale: 修订仅删除末句对“能力”具体为“辖制他们”的解释性补足，改以“权势”对应 δύναμις 的宽泛含义；并将“败退”调整为“既被击败”，明确保留 νικηθείς 的被动完成含义。其余措辞忠实、自然，故予以保留。
