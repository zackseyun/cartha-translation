base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/003.yaml
  text: '"He is not able," he says, "to tyrannize the servants of God—those who hope in him with their whole heart. The devil can wrestle against them, but he cannot overcome them. If, therefore, you resist him, defeated he will flee from you, disgraced. But those who are empty," he says, "are afraid of the devil as though he had power.'
translation:
  language: zh_hans
  text: 他说：“魔鬼不能辖制那些全心仰望上帝的仆人。魔鬼能与他们搏斗，却不能把他们摔倒。因此，你们若抵挡他，他既被击败，就会蒙羞地逃离你们。”他又说：“但那些内里空虚的人，却害怕魔鬼，仿佛他有权势。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταδυναστεύειν
  choice: 辖制
  rationale: 指凭强力压服、支配；“辖制”既保留压迫性的权势意味，也适合本段关于魔鬼能否制伏上帝仆人的论述。
- source_word: τῶν ἐξ ὅλης καρδίας ἐλπιζόντων ἐπ' αὐτόν
  choice: 那些全心仰望上帝的
  rationale: ἐλπίζειν ἐπί 表达把盼望和信赖寄托于某位对象；“全心仰望”自然、庄重，并保留信靠意味。代词所指按最近的明确对象 τοῦ Θεοῦ 译为“上帝”，避免中文代词含混。
- source_word: ἀντιπαλαῖσαι … καταπαλαῖσαι
  choice: 与他们搏斗……把他们摔倒
  rationale: 两个动词构成摔跤意象和文字呼应：前者是交手搏斗，后者是彻底摔倒、战胜。中文以“搏斗／摔倒”保留这一具体比喻。
- source_word: ἀντισταθῆτε
  choice: 抵挡
  rationale: 准确表达站稳对抗、抗拒之意，也符合中文宗教语境而不过度解释。
- source_word: ἀπόκενοί
  choice: 内里空虚的人
  rationale: 本词意为‘空的’，并为下文未装满酒的坛子比喻铺垫；加“内里”使中文指人时自然，同时不提前把空虚具体解释为缺乏信心。
- source_word: κατῃσχυμμένος
  choice: 蒙羞地
  rationale: 保留因败北而受羞辱、抱愧的意味，并以副词形式自然修饰“逃离”。
theological_decisions:
- issue: 魔鬼对上帝仆人的能力是否被绝对否定
  choice: 限定为不能辖制‘那些全心仰望上帝的仆人’
  alternative: 笼统译作魔鬼不能辖制任何上帝的仆人
  rationale: 希腊文以定语分词明确限定这些仆人为全心仰望上帝的人；保留该限定可避免抹平文本本身的劝诫张力。
- issue: “空的”具体指缺少什么
  choice: 译为“内里空虚”，不明说是缺乏信心或圣灵
  alternative: 释义为“信心空虚”或“没有圣灵”
  rationale: 本句本身只称他们为‘空的’，下文才借酒坛说明；不加入原文未明说的教义性内容。
- issue: ὡς δύναμιν ἔχοντα 中魔鬼所具有的能力
  choice: “以为他有能力辖制他们”
  alternative: “仿佛他有能力”
  rationale: ὡς 可带主观认定或表象意味；结合前文对 καταδυναστεύειν 的否定，译出“以为”及所指的辖制能力，使中文完整而保留其认知反差。
translation_notes:
  register: 采用现代、庄重且易懂的叙述体。保留原文直接引语、摔跤意象及“空”的比喻铺垫；句式略作中文化调整，但不消除关于抵挡、失败与惧怕之间的神学张力。
