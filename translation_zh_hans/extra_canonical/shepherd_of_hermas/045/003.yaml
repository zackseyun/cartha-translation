  terminology: “上帝”“魔鬼”“仆人”“辖制”“抵挡”均合乎本段语域。“内里空虚的人”可保留，既使指人的“空”在汉语中通顺，又不越界指定其所缺为何物。末句的 δύναμιν 应译作不预设具体方式的“权势/能力”。
