base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/005.yaml
  text: '"So also the devil comes upon all the servants of God, testing them. Therefore, as many as are full in faith have strongly resisted him, and he withdraws from them, having no place where he may enter. He comes then to the empty ones; and having a place, he enters into them, and he does in them what he wishes, and they become enslaved to him."'
translation:
  language: zh_hans
  text: 同样，魔鬼也临到上帝所有的仆人，试探他们。因此，凡信心充盈的人，都坚决抵挡他；他便离开他们，因为没有可进入的地方。于是，他来到那些空虚的人那里；既有了地方，就进入他们里面，任意在他们里面行事，他们也就成了他的奴仆。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπειράζων
  choice: 试探
  rationale: 此处指魔鬼为考验并诱使人失守而加以试探；“试探”既符合早期基督教语境，也保留该词在测试与诱惑之间的张力。
- source_word: πλήρεις ... ἐν τῇ πίστει
  choice: 在信心上充满
  rationale: 尽量保留原文“充满”与前文盛满酒的陶罐之间的比喻联系，同时用“在信心上”表达其限定关系。
- source_word: ἀνθεστήκασιν ... ἰσχυρῶς
  choice: 坚决抵挡
  rationale: ἀνθίστημι表示抗拒、抵挡，ἰσχυρῶς强调强有力；“坚决抵挡”在现代汉语中自然且力度充分。
- source_word: ἀποκένους
  choice: 空虚的人
  rationale: 该词承接前文未盛满的空罐意象；“空虚的人”既保留比喻，也比单纯“空的人”更符合现代汉语。
- source_word: τόπον
  choice: 可进入的地方／可乘之处
  rationale: 首次用于魔鬼找不到进入之处，直译为“地方”；再次出现时按汉语语境译为“可乘之处”，表达其获得入口或立足点，而不将其具体化为某种教义概念。
- source_word: ὑπόδουλοι
  choice: 奴仆
  rationale: 该词表示处于奴役、完全服属的状态；译作“成了他的奴仆”保留原文强烈的支配关系。
theological_decisions:
- issue: 信心充满者抵挡魔鬼与人的能力来源
  choice: 按原文陈述他们坚决抵挡魔鬼，不补入能力来源
  alternative: 补译为“靠着上帝的力量抵挡他”
  rationale: 本句本身未明说抵挡能力的来源；虽然上下文谈到向主求能力，译文不应在本节中替原文补足神学推论。
- issue: 魔鬼“进入”人的含义
  choice: 保留“进入他们里面”的空间性比喻
  alternative: 解释为“控制他们”或“附在他们身上”
  rationale: 原文使用εἰσπορεύεται并延续器皿与入口的意象；不应将其窄化为附身或仅仅心理控制。
- issue: “空虚的人”的属灵状态
  choice: 保留比喻，不具体解释为空无信心或缺乏圣灵
  alternative: 译作“信心空虚的人”或“没有圣灵的人”
  rationale: 尽管上下文将“充满”与信心相连，原文此处仅称“空的”；保留一定含混度可避免加入原文未明说的教义限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。通过“充满—空虚—进入”的措辞保留前文陶罐比喻的连续性；句式适度拆分，以符合现代普通读者的阅读节奏。
