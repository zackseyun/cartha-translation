revisions:
- from: 那预先存在、创造了万有的圣灵，神使他住在自己所愿意的肉身里。于是，这圣灵所居住的肉身忠实地服事圣灵，行事端庄纯洁，丝毫没有玷污圣灵。因此，这肉身既有美好纯洁的品行，又与圣灵一同劳苦，凡事与圣灵同工，并且表现得刚强勇敢，神就拣选它与圣灵一同有份；因为这肉身的行为蒙[主][a]喜悦，它在地上有圣灵居住时，并未受到玷污。
  to: 那预先存在、创造了万有的圣灵，神使他住在他所愿意的肉身中。这肉身既有圣灵住在其中，就很好地服事圣灵；它行事端庄纯洁，丝毫没有玷污圣灵。因此，这肉身既行事美好纯洁，又与圣灵一同劳苦，在每一件事上与圣灵同工，行事刚强勇敢，神就拣选它作圣灵的同伴；因为这肉身的行止蒙[主][a]喜悦，它在地上有圣灵住在其中时，并未受到玷污。
  rationale: 修订仅澄清代词指向，并以“拣选它作圣灵的同伴”更完整传达“εἵλατο κοινωνόν”的选择与伙伴关系。保留“[主]”及其脚注以标示抄本差异；未消解或重构本段关于圣灵与肉身的特殊、具解释争议的表述。
