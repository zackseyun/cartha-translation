base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/003.yaml
  text: The Holy Spirit, which preexisted, which created all creation, God caused to dwell in flesh that he willed. This flesh, then, in which the Holy Spirit dwelt, served the Spirit well, walking in modesty and purity, in no way at all defiling the Spirit. Therefore, since it had conducted itself well and purely, and had toiled together with the Spirit and cooperated in every matter, conducting itself strongly and courageously, he chose it as a partner with the Holy Spirit; for the conduct of this flesh pleased [the Lord], because it was not defiled upon the earth while having the Holy Spirit.
translation:
  language: zh_hans
  text: 那预先存在、创造了万有的圣灵，神使他住在他所愿意的肉身中。这肉身既有圣灵住在其中，就很好地服事圣灵；它行事端庄纯洁，丝毫没有玷污圣灵。因此，这肉身既行事美好纯洁，又与圣灵一同劳苦，在每一件事上与圣灵同工，行事刚强勇敢，神就拣选它作圣灵的同伴；因为这肉身的行止蒙[主][a]喜悦，它在地上有圣灵住在其中时，并未受到玷污。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”一词在希腊文本中有抄本差异；有些文本不含此词。
    reason: 所据希腊文本将 τῷ Κυρίῳ 置于方括号内，表明该词的文本地位不确定。
lexical_decisions:
- source_word: τὸ πνεῦμα τὸ ἅγιον τὸ προόν
  choice: 那预先存在……的圣灵
  rationale: 保留 προόν 的时间性与本文对圣灵先存的明确陈述。
- source_word: πᾶσαν τὴν κτίσιν
  choice: 万有
  rationale: 自然表达全部受造之物，同时避免中文中“创造一切创造物”的生硬重复。
- source_word: εἰς σάρκα ἣν ἠβούλετο
  choice: 住在自己所愿意的肉身里
  rationale: 保留 σάρξ 的具体“肉身”意象，并让 ἠβούλετο 的主语仍自然指向神。
- source_word: ἐδούλευσε τῷ πνεύματι καλῶς
  choice: 忠实地服事圣灵
  rationale: καλῶς 在此不仅指方式良好，也结合上下文表达无可指责的服事；“忠实地”符合自然汉语。
- source_word: ἐν σεμνότητι καὶ ἁγνείᾳ πορευθεῖσα
  choice: 行事端庄纯洁
  rationale: πορεύομαι 在伦理语境指生活行止；σεμνότης 译作“端庄”，ἁγνεία 译作“纯洁”。
- source_word: συγκοπιάσασαν
  choice: 与圣灵一同劳苦
  rationale: 保留 σύν- 的共同参与含义及 κοπιάω 的辛劳色彩。
- source_word: κοινωνόν
  choice: 一同有份
  rationale: 保留“参与者、伙伴”的开放语义，避免“伴侣”在现代汉语中的婚恋联想。
- source_word: πορεία
  choice: 行为
  rationale: 在此指肉身在世的生活道路或行止；“行为”简洁自然，并与前文伦理表现呼应。
theological_decisions:
- issue: 圣灵与“肉身”的关系
  choice: 按原文将圣灵与肉身区分，并以“居住、服事、同工、一同有份”表达其关系
  alternative: 将“肉身”直接解释为某一特定基督论位格或一般信徒
  rationale: 本句本身保持寓言解释中的特殊表述；译文不额外引入后期教义术语，也不消解其神学张力。
- issue: “神就拣选它”中主语的补出
  choice: 补出“神”
  alternative: 保留无显式主语的“就拣选它”或译作“主就拣选它”
  rationale: 希腊语 εἵλατο 主语承接前文行动者，中文需显明主语；选“神”与本段开头 ὁ Θεός 呼应，但不将其与括号中的“主”强行等同。
- issue: μετὰ τοῦ πνεύματος τοῦ ἁγίου 的关系
  choice: 译为“与圣灵一同有份”
  alternative: “作圣灵的伙伴”或“让它与圣灵共同承受”
  rationale: 原文可理解为使肉身成为与圣灵共同参与者；译文保留参与关系，不具体规定所参与之事。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“圣灵”“肉身”“玷污”等核心宗教与伦理词汇；对希腊文中以阴性代词连续指称“肉身”的结构，中文反复使用“这肉身”或“它”，以确保所指清楚。
