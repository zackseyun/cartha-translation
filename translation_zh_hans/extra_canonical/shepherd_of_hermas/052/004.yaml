base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/004.yaml
  text: Therefore he took the Son and the glorious angels as counselors, in order that this flesh also, having served the Spirit blamelessly, might have some place of dwelling, and might not seem to have lost the reward of its service. For every flesh that is found undefiled and unstained, in which the Holy Spirit has dwelt, will receive a reward. You have the interpretation of this parable also.”
translation:
  language: zh_hans
  text: 因此，他取了他的儿子和荣耀的天使作顾问，好让这肉身也能有某个居所，不至于显得失去了服事所得的报偿；这肉身曾无可指责地服事圣灵。因为凡被发现为无瑕无疵、且有圣灵住在其中的肉身，都必得到报偿。你也有了这个比喻的解释。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμβουλον ... ἔλαβε
  choice: 请……作参谋
  rationale: 保留“选取为顾问、征询意见”的基本意象，同时使现代汉语表达自然；不将其弱化为单纯“告知”或强化为正式议会。
- source_word: ἡ σὰρξ αὕτη
  choice: 这肉身
  rationale: 直译核心术语“肉身”，维持本段肉身与圣灵之间的论述张力，不擅自解释为某一特定人物或一般“身体”。
- source_word: τόπον τινὰ κατασκηνώσεως
  choice: 一个安居之所
  rationale: 表达可供居住、栖居之处的含义；“一个”对应不定性的 τινά，不具体断定其所指。
- source_word: μισθὸν τῆς δουλείας
  choice: 服事的报偿
  rationale: μισθός 是劳动所得的酬报，δουλεία 在此指肉身对圣灵的服事；“报偿”兼顾奖赏与应得酬劳的语义。
- source_word: ἀμίαντος καὶ ἄσπιλος
  choice: 没有污秽、没有玷污
  rationale: 以两个近义短语保留原文并列强调，而不合并为单一形容词。
- source_word: τὴν ἐπίλυσιν
  choice: 解释
  rationale: 在比喻语境中指揭明其含义，现代汉语用“解释”清楚自然。
theological_decisions:
- issue: “儿子”与“肉身”的关系
  choice: 按原文分别译作“儿子”和“这肉身”，不补充二者是否同一或如何相关
  alternative: 把“这肉身”明确解释成“儿子的肉身”或另一特定对象
  rationale: 本段措辞本身保留复杂的基督论张力，译文不应以括注或代词替换预先解决。
- issue: 肉身所得的居所或报偿究竟为何
  choice: 保留为“一个安居之所”和“报偿”
  alternative: 具体化为天国、永生、复活地位或神圣身份
  rationale: 原文没有在本句中具体界定，故不导入后来的教义术语。
- issue: “都必得到报偿”的适用范围
  choice: 保留“凡……的肉身，都……”这一普遍条件句
  alternative: 将其限定为本段所说的唯一肉身
  rationale: πᾶσα σάρξ 明确采用泛指表达，应保留其表面范围，同时不扩写其神学后果。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“无可指责地服事”“被显明为”保留原文伦理与判定色彩；末句以“现在……你也明白了”自然呈现 ἔχεις 的完成性语气，并保留引语结束符。
