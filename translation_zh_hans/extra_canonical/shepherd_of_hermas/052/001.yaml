base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/001.yaml
  text: He says, “I told you just now that you are crafty and headstrong, asking for the interpretations of the parables. But since you are so persistent, I will interpret for you the parable of the field and the rest. He entrusted them to the angels to keep them; and he himself cleansed their sins, having labored much and endured many toils—for no one can dig without toil or labor.
translation:
  language: zh_hans
  text: 他对我说：“我刚才已经告诉你，你很会耍心思，又固执任性，总追问这些比喻的解释。不过，既然你这样坚持不懈，我就为你解释田地的比喻和其余的比喻。[a]他把他们交托给众天使看守；他自己则清除了他们的罪，为此付出了许多辛劳，历尽了重重艰苦——因为谁挖掘都免不了辛劳和劳苦。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处所据希腊文本有明显断裂或残缺；下句的“他”和“他们”在现存片段中没有清楚的先行对象。
    reason: 提醒读者文本传承问题，并说明为何译文保留指代含混。
lexical_decisions:
- source_word: πανοῦργος
  choice: 很会耍心思
  rationale: 该词可表示机敏、狡黠或善于设法；结合责备语境，译为带轻度贬义而不过分强化为邪恶的现代汉语。
- source_word: αὐθάδης
  choice: 固执任性
  rationale: 表达自作主张、执拗不让的性格，与后文不断追问相呼应。
- source_word: ἐπιλύσεις
  choice: 解释
  rationale: 这里指揭明比喻的含义，现代汉语用“解释”最自然清楚。
- source_word: παράμονος
  choice: 坚持不懈
  rationale: 保留其持续坚持的核心意思；在上下文中既可带责备，也暗含因坚持而得到解答。
- source_word: συντηρεῖν
  choice: 看守
  rationale: 表示保护、保存或照管；在天使受托的语境中，“看守”简洁而贴切。
- source_word: ἐκαθάρισε
  choice: 清除了
  rationale: 保留“使洁净”的意象，同时使“罪”作为宾语的中文表达自然。
- source_word: σκαφεῦσαι
  choice: 掘好土地
  rationale: 动词意为挖掘、翻土；结合田地比喻补出“土地”，避免中文悬空。
theological_decisions:
- issue: “他”“他们”的指代在现存所给希腊文本片段中不完整
  choice: 保留代词，不擅自明确为某一神圣位格或特定群体
  alternative: 按后续神学解释将“他”明确译作上帝、主或圣子，并将“他们”明确为百姓
  rationale: 原文在此处有明显断裂或缺文，强行补明会消除真实的文本不确定性并可能预断后文神学关系。
- issue: 清除罪的措辞
  choice: 直译为“清除了他们的罪”
  alternative: 神学化地译为“赎了他们的罪”或“使他们罪得赦免”
  rationale: ἐκαθάρισε 的直接意象是洁净；不额外导入特定赎罪理论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语中的责备保持鲜明，但避免把 πανοῦργος 夸大成道德上极端的“奸恶”。“辛劳／劳苦”略作重复，以保留原文对劳动艰难的强调。
