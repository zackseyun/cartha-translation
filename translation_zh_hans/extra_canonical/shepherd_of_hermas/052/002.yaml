base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/002.yaml
  text: Therefore, having cleansed the sins of the people, he showed them the paths of life, giving them the law that he received from his Father. “You see,” he says, “that he himself is Lord of the people, having received all authority from his Father. And as for the Lord’s taking his Son and the glorious angels as counselors concerning the inheritance of the servant—listen.
translation:
  language: zh_hans
  text: 3 他既洁净了百姓的罪，就把生命的道路指给他们，又把他从父亲那里领受的律法赐给他们。4 他说：“你看，他自己是百姓的主，从父亲那里领受了一切权柄。至于主就奴仆的产业[a]一事，召自己的儿子和荣耀的天使作顾问——你且听着。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆的产业”也可理解为“赐给奴仆的产业”，即奴仆将要承受的份。
    reason: 说明希腊语属格κληρονομίας τοῦ δούλου可能表达的关系，同时保留正文的歧义。
lexical_decisions:
- source_word: τὰς τρίβους τῆς ζωῆς
  choice: 生命的道路
  rationale: τρίβος本指走出来的小路，此处为比喻性复数；译作“生命的道路”自然清楚，并保留通往生命之道的意象。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 在宗教语境中以“律法”表达νόμος，比普通的“法律”更贴合所领受并赐给百姓的神圣规范。
- source_word: κύριος τοῦ λαοῦ
  choice: 百姓的主
  rationale: 直译所属关系并保留κύριος的主权含义，不擅自补明人物身份。
- source_word: ἐξουσίαν πᾶσαν
  choice: 所有权柄
  rationale: ἐξουσία表示获授的权威或支配权；“权柄”符合庄重宗教语域。
- source_word: σύμβουλον
  choice: 作顾问
  rationale: 保留原文“纳为商议者”的拟人化议事表达；汉语用“请……作顾问”较为自然。
- source_word: τοὺς ἐνδόξους ἀγγέλους
  choice: 众荣耀的天使
  rationale: 忠实表达复数与ἐνδόξους的荣耀、尊荣含义。
theological_decisions:
- issue: 第4节中“他”“主”“父”“儿子”的所指关系
  choice: 沿用原文代词与称号，不补写具体身份
  alternative: 把各处明确译成“上帝”“基督”或其他特定身份
  rationale: 上下文具有需要由后文解释的复杂所指和神学张力；明确替换会超出本句原文并预先解决其歧义。
- issue: “奴仆的产业”的属格关系
  choice: 正文保留简洁属格结构，并加脚注说明
  alternative: 直接译为“赐给奴仆的产业”或“奴仆所拥有的产业”
  rationale: κληρονομίας τοῦ δούλου可理解为奴仆所得的产业，也可泛指与奴仆有关的产业安排；正文不强行限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留原文连续的男性代词和“主—父—儿子—奴仆”称谓结构，不以解释性措辞消除神学张力。
