  to: 3 他既洁净了百姓的罪，就把生命的道路指给他们，又把他从父亲那里领受的律法赐给他们。4 他说：“你看，他自己是百姓的主，从父亲那里领受了一切权柄。至于主就奴仆的产业[a]一事，召自己的儿子和荣耀的天使作顾问——你且听着。”
