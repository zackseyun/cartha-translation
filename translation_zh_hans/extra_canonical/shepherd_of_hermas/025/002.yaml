  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/002.yaml
  text: 2. And immediately he sat beside me and says to me, “I have been sent by the most venerable angel, that I may dwell with you for the rest of the days of your life.”
translation:
  language: zh_hans
  text: 2 他随即在我身旁坐下，对我说：“那位最尊贵的天使差遣了我，要我在你余下的一生中与你同住。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: 随即
  rationale: 表达动作紧接前文发生，符合现代汉语叙事习惯。
- source_word: παρεκάθισέν μοι
  choice: 在我身旁坐下
  rationale: 保留动词所含‘坐在旁边’的空间关系，同时使中文自然。
- source_word: σεμνοτάτου
  choice: 最尊贵的
  rationale: 最高级形式表示极高的尊严与崇高地位；‘尊贵’在此庄重而易懂。
- source_word: μετὰ σοῦ οἰκήσω
  choice: 与你同住
  rationale: 直接呈现持续共同居住、陪伴的含义，不弱化为一般的‘与你同在’。
- source_word: τὰς λοιπὰς ἡμέρας τῆς ζωῆς σου
  choice: 在你余下的一生中
  rationale: 自然传达‘你生命中剩余的日子’，避免生硬直译。
theological_decisions:
- issue: ὁ σεμνότατος ἄγγελος所指身份
  choice: 那位最尊贵的天使
  alternative: 至圣的天使／最庄严的使者
  rationale: 原文仅以最高级敬称描述该天使，并未在本句明确其具体身份；译文保留这一开放性，不作教义性认定。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话。保留叙事中历史现在时λέγει的鲜活感，但按自然中文统一译作‘说’，不刻意复制希腊语时态转换。
