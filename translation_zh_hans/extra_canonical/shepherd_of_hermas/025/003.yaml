  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/003.yaml
  text: 3. I thought that he had come to test me, and I say to him, “Who then are you? For I,” I say, “know the one to whom I was entrusted.” He says to me, “Do you not recognize me?” “No,” I say. “I,” he says, “am the Shepherd to whom you were entrusted.”
translation:
  language: zh_hans
  text: 3. 我以为他来是要试探我，就问他：“那么，你是谁？我知道自己被交托给了谁。”他问我：“你认不出我吗？”我说：“认不出。”他说：“我就是你被交托给的那位牧者。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπειράζων
  choice: 试探
  rationale: 表达对方借接近而察验、考验说话者的意思；“试探”保留原词可能带有负面意味的语气，又不额外断定其动机。
- source_word: γινώσκω / ἐπιγινώσκεις
  choice: 知道 / 认出
  rationale: 前者指赫马知道自己被交托给谁，后者在当面相见的语境中指辨认出对方；用不同汉语词再现原文的语义差别。
- source_word: παρεδόθην
  choice: 被交托给
  rationale: 保留被动形式及受托照管的关系，不擅自补出交托者。
- source_word: ποιμήν
  choice: 牧者
  rationale: 既保留牧羊人的形象，也符合此处作为身份称号的用法；“牧者”比单纯“牧人”更自然地承载照管者之意。
theological_decisions:
- issue: “牧者”的身份是否应进一步解释为天使或其他特定人物
  choice: 仅译作“牧者”
  alternative: 译作“牧者天使”或指明其具体神学身份
  rationale: 本节原文只自称“牧者”；其更具体身份由上下文说明，译文不在此处提前解释。
- issue: 被交托关系中的施事者
  choice: 采用无施事者的被动表达“你被交托给”
  alternative: 补译为“上帝把你交托给”或“你被天使交托给”
  rationale: 希腊文未明说施事者，保留这一省略可避免加入原文没有明确陈述的神学判断。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事对话。保留原文历史现在时所带来的现场感，但按现代汉语习惯统一用自然的叙述形式；“那么”传达 γάρ 在追问中的承接语气。
