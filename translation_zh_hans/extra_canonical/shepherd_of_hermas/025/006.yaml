lexical_decisions:
- source_word: ἐντολάς
  choice: 诫命
  rationale: 指牧者所颁布、要求遵守的命令；“诫命”既保留其权威性，也与本书后续篇章的传统名称相符。
- source_word: παραβολάς
  choice: 比喻
  rationale: παραβολή在本书中指借形象或叙事传达教训的篇章；译作“比喻”自然、通行。
- source_word: ἔγραψα
  choice: 写了下来
  rationale: 用现代汉语自然表达已完成的书写行动，同时保留简单过去叙事的语气。
- source_word: καθὼς ἐνετείλατό μοι
  choice: 照着他吩咐我的
  rationale: 准确保留“按照”和间接宾语“我”，并以自然汉语表达其命令性质。
