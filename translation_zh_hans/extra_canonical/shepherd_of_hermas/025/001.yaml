  to: 我在屋里祷告后，坐在榻上。这时，有一个人走了进来；他容貌显得尊贵，身穿牧人的装束，身披白色兽皮，肩上背着行囊，手里拿着杖。他向我问安，我也向他回礼。
  rationale: 作两处低风险措辞修订：以“容貌显得尊贵”较中性地对应ἔνδοξος τῇ ὄψει，并以“身披白色兽皮”替换不够自然的“披着一张白色的皮子”。其余结构和信息均予保留；不添加身份或神学解释。
