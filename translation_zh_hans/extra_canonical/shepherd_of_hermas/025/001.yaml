    rationale: ἔνδοξος主要指显赫、尊贵、荣耀或出众；“威严”可含权威、令人畏惧的意味。用“容貌显得尊贵”更贴近外貌描写，且不提前强化人物身份。
  - severity: low
    issue: “披着一张白色的皮子”语体偏口语。
    rationale: δέρμα λευκόν指白色皮／兽皮制物；“身披白色兽皮”在现代庄重汉语中更自然，同时不指定动物种类。
