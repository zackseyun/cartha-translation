base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/001.yaml
  text: After I had prayed in the house and sat down on the couch, a certain man entered, glorious in appearance, in shepherd’s attire, wearing a white skin, and having a bag on his shoulders and a staff in his hand. And he greeted me, and I returned his greeting.
translation:
  language: zh_hans
  text: 我在屋里祷告后，坐在榻上。这时，有一个人走了进来；他容貌显得尊贵，身穿牧人的装束，身披白色兽皮，肩上背着行囊，手里拿着杖。他向我问安，我也向他回礼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ οἴκῳ
  choice: 在屋里
  rationale: 按字面保留地点表达；上下文未明确这是住宅还是特指某一座房屋，故不增译为“家中”。
- source_word: κλίνην
  choice: 榻
  rationale: 该词可指供人躺卧或坐下的卧榻；“榻”既符合古代场景，又比现代“沙发”准确。
- source_word: ἀνήρ τις ἔνδοξος τῇ ὄψει
  choice: 有一个人……仪表威严
  rationale: ἔνδοξος τῇ ὄψει 描写其外观令人敬畏、显得尊贵；“仪表威严”自然且不把人物身份神化。
- source_word: σχήματι ποιμενικῷ
  choice: 身穿牧人的装束
  rationale: σχῆμα 在此指外在装束或形貌；译文明确呈现牧人打扮。
- source_word: δέρμα λευκόν
  choice: 一张白色的皮子
  rationale: δέρμα 是兽皮或皮革，原文未说明动物种类；保留这种未定性，不擅自译作“羊皮”。
- source_word: πήραν
  choice: 行囊
  rationale: 指旅人或牧人携带的袋子；“行囊”比泛称“包”更符合古代语境。
- source_word: ἠσπάσατό με / ἀντησπασάμην αὐτόν
  choice: 向我问安／向他回礼
  rationale: 动词表示致意、问候及回致问候；中文用对应表达可自然呈现动作的相互性。
