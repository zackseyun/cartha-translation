  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/004.yaml
  text: 4. While he was still speaking, his appearance was changed, and I recognized him, that he was the one to whom I had been entrusted, and immediately I was confounded, and fear seized me, and I was completely crushed with grief, because I had answered him so wickedly and foolishly.
translation:
  language: zh_hans
  text: 4. 他还在说话时，他的容貌改变了；我便认出他正是我所被交托给的那一位。我顿时惊惶失措，恐惧攫住了我；我整个人都因悲伤而被击垮，因为我竟那样邪恶而愚昧地回答他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠλλοιώθη ἡ ἰδέα αὐτοῦ
  choice: 容貌忽然改变了
  rationale: ἰδέα在此指可见的外貌、形貌；用“容貌”自然清楚。被动式译为“改变了”，不臆测改变的施事者；“忽然”承接叙事场景中身份显明的突转。
- source_word: ἐπέγνων αὐτόν
  choice: 我便认出他
  rationale: ἐπιγινώσκω在此表示辨认、认出，而非抽象地认识。
- source_word: ᾧ παρεδόθην
  choice: 受命照管我的那一位
  rationale: 字面为“我被交付给的那一位”。结合本段牧者受差遣与黑马先前已被交托给他的语境，以自然汉语表达被交付监管之意，同时避免加入具体教义身份。
- source_word: συνεχύθην
  choice: 慌乱起来
  rationale: 该词可表示困惑、惊惶或羞惭造成的失措；此处紧接认出对方并随后惧怕、悲伤，译作“慌乱”保留综合情绪。
- source_word: φόβος με ἔλαβεν
  choice: 心里充满恐惧
  rationale: 希腊语字面为“恐惧抓住了我”；采用现代汉语惯用表达，保留强烈程度。
- source_word: ὅλος συνεκόπην ἀπὸ τῆς λύπης
  choice: 又因悲伤而整个人都垮了下来
  rationale: συγκόπτω的被动用法表达被击垮、压垮；“整个人都垮了下来”对应ὅλος并传达强烈的内在打击。
- source_word: πονηρῶς καὶ ἀφρόνως
  choice: 恶劣而愚昧地
  rationale: πονηρῶς带有坏、恶劣之意，ἀφρόνως指缺乏明辨、愚昧；并列保留原文的道德责备与判断责备。
theological_decisions:
- issue: “我被交付给他”的关系性质
  choice: 受命照管我的那一位
  alternative: 我被交托给的那一位
  rationale: 前文明确称其为牧者，并说作者被交给他；选择“受命照管”使普通读者易懂，却不把此人物进一步认定为某个特定教义角色。
- issue: 人物容貌改变的原因
  choice: 使用无施事者的“容貌忽然改变了”
  alternative: 他改变了容貌／他的容貌被改变了
  rationale: 原文使用被动语态，没有说明是人物主动改变，还是由神使其改变，因此不作判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留认出、慌乱、恐惧、悲伤及自责的递进层次；不增加原文未说明的人物身份或超自然机制。
