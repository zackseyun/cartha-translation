base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/007.yaml
  text: 7. If then, having heard them, you keep them and walk in them and do them with a pure heart, you will receive from the Lord what he promised you; but if, having heard, you do not repent, but still add to your sins, you will receive from the Lord the opposite things. The Shepherd, the angel of repentance, commanded me to write all these things in this way.
translation:
  language: zh_hans
  text: 7 所以，你们听见这些教导以后，若遵守它们，按着它们而行，并以纯洁的心去实行它们，就必从主那里领受他所应许给你们的一切；但你们听见以后，若不悔改，反倒继续在自己的罪上加罪，就必从主那里领受相反的事。那位牧者，就是悔改的天使，吩咐我照这样把这一切写下来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξητε
  choice: 遵守
  rationale: 既保留“守护、持守”的语义，也符合诫命语境下自然的现代汉语表达。
- source_word: ἐν αὐταῖς πορευθῆτε
  choice: 按它们行事
  rationale: 原文直译为“在它们里面行走”，是生活实践的比喻；译为“按它们行事”可自然传达其含义。
- source_word: ἐργάσησθε αὐτὰς
  choice: 将它们实行出来
  rationale: 与前面的“遵守”和“行事”形成递进，并保留实际履行这些教导的强调。
- source_word: ἐν καθαρᾷ καρδίᾳ
  choice: 以纯洁的心
  rationale: 保留早期基督教伦理语境中的“心”及其纯净、真诚含义。
- source_word: ἀπολήμψεσθε
  choice: 领受
  rationale: 比“得到”更庄重，也适合从主那里接受应许或相反后果的语境。
- source_word: τὰ ἐναντία
  choice: 相反的结果
  rationale: 原文仅说“相反的事物”，所指刻意保持概括；补出“结果”使中文通顺，但不具体规定为惩罚、灾祸或审判。
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: 悔改的天使
  rationale: 保留属格结构可能表达的职分或关联，不扩译为特定教义身份。
theological_decisions:
- issue: 应许的领受与顺服之间的关系
  choice: 保留“若……就……”的条件结构
  alternative: 弱化为一般性的劝勉或将其解释为功德换取奖赏
  rationale: 希腊文明确采用条件句；译文呈现原有伦理与应许之间的张力，不另作系统神学解释。
- issue: 不悔改者所领受的“相反之事”
  choice: 译作“相反的结果”
  alternative: 明确译为“惩罚”或“咒诅”
  rationale: 原文 τὰ ἐναντία 并未具体说明内容，应保留其概括性和严肃性。
- issue: 牧者与悔改天使的同一关系
  choice: “那位牧者，就是悔改的天使”
  alternative: 将两者译作两个不同角色
  rationale: 希腊文同位语结构表明“悔改的天使”说明“牧者”的身份。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留原文连续的条件论述及第二人称复数；避免把“行走”生硬直译，也不将“相反的事物”过度神学化。
