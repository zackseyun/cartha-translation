  to: 5. 他回答我说：“不要惶惑，却要在我将要吩咐你的诫命中刚强起来。因为我奉差遣，”他说，“是要把你先前所见的一切再指给你看，尤其是那些对你们有益的主要内容。首先，要写下我的诫命和比喻；至于其余的事，我怎样指给你看，你就怎样写。”因此，他说：“我吩咐你先写下诫命和比喻，好让你能随手阅读它们，并且能够遵守它们。”
  rationale: 修订“也就是”为“尤其是”，保留κεφάλαια对前述所见内容的强调和选择性；将“诵读”改为“阅读”；并微调“在……诫命中刚强起来”以改善现代汉语表达，同时不把ἐν的关系限定为单一解释。补出末句两个“它们”，使阅读和遵守的宾语在汉语中明确，对应原文αὐτά，且不改变意义。
