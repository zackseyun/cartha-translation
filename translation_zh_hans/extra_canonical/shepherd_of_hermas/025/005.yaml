  text: 5. But he answered me and says, “Do not be confounded, but be strengthened in my commandments, which I am about to command you. For I have been sent,” he says, “that I may show you again all the things you saw before, especially the main points that are beneficial for you. First of all, write my commandments and the parables; but the other things, as I show you, so you will write.” For this reason, he says, “I command you first to write the commandments and parables, so that you may read them readily at hand and be able to keep them.”
translation:
  language: zh_hans
  text: 5. 他回答我说：“不要惶惑，却要在我将要吩咐你的诫命中刚强起来。因为我奉差遣，”他说，“是要把你先前所见的一切再指给你看，尤其是那些对你们有益的主要内容。首先，要写下我的诫命和比喻；至于其余的事，我怎样指给你看，你就怎样写。”因此，他说：“我吩咐你先写下诫命和比喻，好让你能随手阅读它们，并且能够遵守它们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ συγχύννου
  choice: 不要慌乱
  rationale: 此处指因惧怕、忧愁而陷入惶惑失措；“不要慌乱”自然传达其语境含义，又不过度具体化为羞愧或困惑。
- source_word: ἰσχυροποιοῦ ἐν ταῖς ἐντολαῖς μου
  choice: 因我的诫命刚强起来
  rationale: 保留介词短语与“刚强”的意象；“因”允许诫命既可理解为刚强的依据，也可理解为刚强所处的领域。
- source_word: τὰ κεφάλαια
  choice: 要点
  rationale: 本义可指主要部分、纲要或重点；“要点”符合这里从先前异象中重新指出关键内容的语境。
- source_word: παραβολάς
  choice: 比喻
  rationale: 采用早期基督教文献中通行且易懂的译法，同时可涵盖本书后续具有象征和教训性质的篇章。
- source_word: ὑπὸ χεῖρα
  choice: 随手就能
  rationale: 该习语表示置于手边、便于取用；结合ἀναγινώσκῃς，译为“随手就能诵读”自然清楚。
- source_word: φυλάξαι
  choice: 遵守
  rationale: 在诫命语境中既含谨守、持守，也含付诸实行；“遵守”最符合现代汉语表达。
theological_decisions:
- issue: 诫命与刚强之间的关系
  choice: 因我的诫命刚强起来
  alternative: 在我的诫命上刚强起来／要坚守我的诫命
  rationale: 希腊语ἐν可有多种关系；正文避免把它完全化约为“坚守”，从而保留“借着、在其中刚强”的张力。
- issue: τὰ κεφάλαια与前文所见一切的关系
  choice: 也就是那些对你们有益的要点
  alternative: 尤其是那些对你们有益的要点
  rationale: αὐτὰ可作同位说明，指明重示内容的核心部分；译文用“也就是”呈现这一较直接的句法理解，同时不增添特定教义解释。
- issue: “你”与“你们”的转换
  choice: 保留单数“你”和复数“你们”
  alternative: 全篇统一为“你”或“你们”
  rationale: 原文先直接对赫马说话，随后称这些要点对群体有益；保留人称变化可显出个人受命与群体受益之间的区别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留反复出现的“他说”，以反映希腊原文的引语层次；使用“奉差遣”“诫命”“遵守”等具有经教文献色彩但仍属现代通行的词语。
