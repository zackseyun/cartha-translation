lexical_decisions:
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: 悔改的天使
  rationale: 直译属格结构，既自然，也不额外判定其含义是负责促成悔改还是管理悔改。
- source_word: μὴ φοβήθητε τὸν διάβολον
  choice: 不要怕魔鬼
  rationale: 准确传达否定命令；“魔鬼”是现代汉语中通行且庄重的对应词。
- source_word: ἀπεστάλην
  choice: 我奉差遣
  rationale: 保留被动语态及差遣者未明说这一特点，避免擅自补出主语。
- source_word: τῶν μετανοούντων ἐξ ὅλης καρδίας αὐτῶν
  choice: 那些全心悔改的你们
  rationale: 保留分词对“你们”的限定以及“从全部的心”所表达的全心投入；中文略作调序以便理解。
- source_word: ἰσχυρο-
  choice: 并坚—
  rationale: 原始材料在词中截断，只译出可确定的词干意义并用破折号标示残缺，不根据后文猜补。
theological_decisions:
- issue: 悔改天使的身份与职能
  choice: 保留“悔改的天使”这一开放性表达
  alternative: 使人悔改的天使／掌管悔改的天使
  rationale: 希腊语属格本身未明确限定关系，不应在译文中加入特定神学解释。
- issue: 差遣者的身份
  choice: 使用无主语的被动式“奉差遣”
  alternative: 上帝差遣了我
  rationale: 本段没有明说差遣者；虽可由语境推知，也不宜在正文中补足。
- issue: 引语层级中的“他说”
  choice: 保留“他说”
  alternative: 省略插入语
  rationale: 原文 φησί 明确存在，虽叙述人称略显突兀，仍应保存文本的引语结构与可能的编辑痕迹。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文突兀的“他说”及末尾词中断；本读者段落本身不完整，因此不擅自从相邻文本补齐。
