  text: Listen to me, children. I reared you in great simplicity and innocence and dignity, through the mercy of the Lord, who caused righteousness to drip upon you, so that you might be justified and …
translation:
  language: zh_hans
  text: “孩子们，听我说。我曾以极大的纯朴、清白和端庄养育你们，借着那位将义滴在你们身上的主的怜悯，使你们得以称义，并且……[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“并且”后续至下一段；此处省略号标示该续文。
    reason: 对应原文片段末尾未完成的 καὶ，并使正文锚点有明确说明。
lexical_decisions:
- source_word: τέκνα
  choice: 孩子们
  rationale: 保留亲切而带权威的称呼，符合说话者对受众的养育意象。
- source_word: ἐξέθρεψα
  choice: 养育
  rationale: 该词指抚养、培育；与“孩子们”自然衔接，也保留持续塑造之意。
- source_word: ἁπλότητι
  choice: 纯朴
  rationale: 表达单纯、真诚、不诡诈的品格，避免译成仅指认知简单的“简单”。
- source_word: ἀκακίᾳ
  choice: 清白
  rationale: 体现无恶意、无害与无邪；“清白”在现代汉语中简明庄重。
- source_word: σεμνότητι
  choice: 端庄
  rationale: 保留庄重、可敬、品行严肃的伦理含义。
- source_word: στάξαντος
  choice: 滴在
  rationale: 保留原文鲜明的“滴下、滴落”意象，不将其平化为“赐下”或“浇灌”。
- source_word: δικαιοσύνην
  choice: 义
  rationale: 保留其伦理与神学张力，不限定为单纯的“公义”或“正直行为”。
- source_word: δικαιωθῆτε
  choice: 得以称义
  rationale: 用常见且准确的神学表达呈现被动式，同时不明说施动者；“得以”传达目的从句。
theological_decisions:
- issue: διὰ τὸ ἔλεος 与养育行为的关系
  choice: “这是因主的怜悯”
  alternative: “借着主的怜悯”
  rationale: 原文介词短语可表达原因或媒介；正文采用自然的原因表达，同时不排除怜悯作为施恩途径。
- issue: δικαιωθῆτε 的含义
  choice: “得以称义”
  alternative: “成为义人”或“得以行义”
  rationale: 保留 δικαιόω 的司法—宣告性可能及其神学开放性，不将其缩减为道德改造或行为表现。
- issue: 义“滴下”的施动关系
  choice: “主……把义滴在你们身上”
  alternative: “主……使义滴在你们身上”
  rationale: 希腊分词在语法上以主为施动者；直译主动关系并保留滴落意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“义滴在你们身上”这一不寻常但重要的原文意象。因正文存在脚注，标记必须置于正文；故定稿正文应在末尾写作“并且……[a]”。
