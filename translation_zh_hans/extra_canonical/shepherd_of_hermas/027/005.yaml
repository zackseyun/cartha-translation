base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/005.yaml
  text: Therefore those who receive will render an account to God why they received and for what; for those who receive while afflicted will not be judged, but those who receive in hypocrisy will pay the penalty.
translation:
  language: zh_hans
  text: 所以，领受的人都要向上帝交账，说明他们为什么领受，以及领受是为了什么；因为那些在困苦中领受的人不会受审判，但那些虚伪地领受的人[a]必受惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚伪地领受”也可理解为“假装有需要而领受”。原文强调虚伪或伪装，却没有具体说明虚假的方式。
    reason: 说明ὑποκρίσει在施舍语境中可能指假装有需要，同时避免将原文未明说的虚伪方式定为唯一含义。
lexical_decisions:
- source_word: ἀποδώσουσιν λόγον
  choice: 要向上帝交账
  rationale: 保留向上帝说明并承担责任的审判语境，同时采用现代汉语中清楚自然的表达。
- source_word: διατί ἔλαβον καὶ εἰς τί
  choice: 为什么领受，以及领来作什么
  rationale: 分别呈现领受的缘由与用途，不把两个疑问合并。
- source_word: θλιβόμενοι
  choice: 因身处困苦
  rationale: 该分词可指受压、受苦或陷于窘迫；此处施舍语境侧重真实困乏，但不限定为单纯贫穷。
- source_word: ἐν ὑποκρίσει
  choice: 以虚假领受
  rationale: 保留“虚伪、伪装”的核心含义，并避免把原文直接限定为某一种具体骗局。
- source_word: τίσουσιν δίκην
  choice: 必受惩罚
  rationale: 准确表达偿付刑罚、遭受惩处之意，语气明确而庄重。
theological_decisions:
- issue: 领受施舍者是否一概被定罪
  choice: 区分因真实困苦而领受者与以虚假领受者
  alternative: 把所有领受者都描述为同样受审
  rationale: 原文明确说前者“不受审判”，后者“受惩罚”，责任取决于领受的实情与动机。
- issue: “不会受审判”的范围
  choice: 按本段语境保留其针对领受援助一事的宣告
  alternative: 扩展为这些人在末后审判中完全不受审判
  rationale: 上下文讨论的是接受施予是否正当，不宜据此加入更广泛的救恩论结论。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫文体。“交账”保持责任与审判意味；句式依照希腊文的因果和对比分层，适合普通读者朗读。
