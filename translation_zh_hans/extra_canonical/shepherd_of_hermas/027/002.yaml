base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/002.yaml
  text: First of all, slander no one, and do not listen with pleasure to someone who slanders; otherwise you too, the hearer, will be guilty of the slanderer’s sin if you believe the slander you hear. For by believing it, you yourself also will have something against your brother. Thus you will be guilty of the slanderer’s sin.
translation:
  language: zh_hans
  text: 首先，不要毁谤任何人，也不要喜欢听人毁谤。否则，你这听的人若信了所听见的毁谤，也要担当毁谤者的罪；因为你一旦相信，自己也会对你的弟兄心怀不满。这样，你就要担当毁谤者的罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλάλει / καταλαλοῦντος / καταλαλίᾳ
  choice: 毁谤／毁谤者／毁谤
  rationale: 该词组指在背后说人坏话、损害其名誉；“毁谤”既保留道德严重性，也能在重复中对应希腊文同一词根。
- source_word: ἡδέως ἄκουε
  choice: 喜欢听
  rationale: 直译为“愉快地听”，这里指以兴趣或享受的态度听毁谤之言；“喜欢听”自然简明。
- source_word: ἔνοχος ἔσῃ
  choice: 要担当……的罪
  rationale: ἔνοχος 表示负有罪责；此处不是说听者犯下完全相同的行为，而是说他因相信毁谤而分担其罪责。
- source_word: ἕξεις κατὰ τοῦ ἀδελφοῦ σου
  choice: 会对你的弟兄心怀不满
  rationale: 原文省略了明确宾语，字面近于“你也会有针对你弟兄的东西”。译文保留其关系性的敌对含义，同时避免武断补成某项具体指控。
theological_decisions:
- issue: 听毁谤者如何与毁谤者同负罪责
  choice: 以“若信了”明确原文所给的条件，并译作“担当毁谤者的罪”
  alternative: 仅因听见毁谤便自动与毁谤者同罪
  rationale: 原文用 ἐὰν πιστεύσῃς 清楚限定：罪责与相信所听毁谤并因此敌对弟兄有关，不应删去这一条件。
- issue: ἀδελφός 的范围
  choice: 弟兄
  alternative: 弟兄姊妹／同伴
  rationale: 保留早期基督教群体称谓及原文阳性单数，不在正文中扩展其指涉范围。
translation_notes:
  register: 采用现代、庄重且易懂的劝诫语体；保留原文对“毁谤”及“担当毁谤者的罪”的重复，以维持论证力度。该读者分段对应原文第2节，未引入上下文其他段落。
