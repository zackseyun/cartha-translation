base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/004.yaml
  text: But clothe yourself with dignity, in which there is no evil stumbling block, but all things are smooth and cheerful. Do what is good, and from your labors, which God gives you, give simply to all who are in need, not hesitating as to whom you should give or to whom you should not give. Give to all, for God wants all to be given from his own gifts.
translation:
  language: zh_hans
  text: 但你要披戴端庄；在其中没有任何邪恶的绊脚之物，一切都平顺而喜乐。要行善，并从上帝赐给你的劳作所得中，单纯地分给一切缺乏的人；不要犹疑该给谁、不该给谁。要给所有人，因为上帝愿意人从他自己的恩赐中施给所有人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδυσαι
  choice: 披戴
  rationale: 保留原文“穿上”的比喻性命令，同时符合中文宗教与伦理语境。
- source_word: σεμνότητα
  choice: 端庄
  rationale: 表达庄重、可敬、品行端正的含义，避免缩窄为单纯的严肃或谦逊。
- source_word: πρόσκομμα
  choice: 绊脚之物
  rationale: 保留导致跌倒或受阻的形象；“邪恶的”修饰该名词，未将其抽象化为某一种特定罪。
- source_word: ὁμαλὰ καὶ ἱλαρά
  choice: 平坦喜乐
  rationale: 分别保留ὁμαλά的平顺、无碍意象与ἱλαρά的欣然、愉悦色彩。
- source_word: ἐργάζου τὸ ἀγαθόν
  choice: 要行善
  rationale: 自然而直接地表达持续实践善事的命令。
- source_word: ἐκ τῶν κόπων σου
  choice: 从……劳作所得中
  rationale: κόποι可指劳苦或劳动成果；上下文谈施予，因此用“劳作所得”显明来源而不限定为工钱。
- source_word: ἁπλῶς
  choice: 单纯地
  rationale: 承接本命令核心ἁπλότης，表达坦诚、不盘算、不偏待的施予态度。
- source_word: ὑστερουμένοις
  choice: 缺乏的人
  rationale: 概括处于欠缺、需要状态者，不额外限定为贫穷阶层。
- source_word: δωρημάτων
  choice: 恩赐
  rationale: 保留所拥有之物最终来自上帝馈赠的神学意涵。
theological_decisions:
- issue: “上帝愿意所有人被给予”中πᾶσιν的范围与被动式δίδοσθαι
  choice: 上帝愿意把他自己的恩赐分给所有人
  alternative: 上帝愿意从他自己的恩赐中施给所有人
  rationale: 希腊文强调普遍施予及其来源；译文不把“所有人”限制为经鉴别后才配得者，也用“愿意”保留θέλει的意志表达。
- issue: 人的劳作与上帝赐予之间的关系
  choice: 上帝赐给你的劳作所得
  alternative: 上帝赐给你的劳苦
  rationale: 保留劳动成果被视为上帝所赐这一张力，同时不暗示人无需劳作或财富完全等同于神圣认可。
- issue: 不加分辨地施予是否取消受领者责任
  choice: 不要犹疑该给谁、不该给谁；要给所有人
  alternative: 不要判断谁配得帮助
  rationale: 忠实呈现本节对施予者的命令，不把后文关于受领者向上帝交账的说明提前加入，也不将其解释为特定救济制度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留“披戴”“绊脚之物”等原文意象。反复使用“给”，对应原文刻意重复的δίδου/δίδοσθαι，并突出慷慨施予的劝诫。
