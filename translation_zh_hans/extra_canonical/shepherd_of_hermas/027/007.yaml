base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/007.yaml
  text: So keep this commandment, as I have spoken to you, so that your repentance and that of your household may be found in simplicity, and your heart clean and unstained.
translation:
  language: zh_hans
  text: 所以，你要遵守这条诫命，正如我已对你说过的，好使你和你一家人的悔改都存着纯朴，你的心也洁净，没有玷污。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: 遵守
  rationale: 此处指持续谨守并实行诫命；现代汉语中“遵守”自然明确。
- source_word: μετάνοιά
  choice: 悔改
  rationale: 保留早期基督教语境中由心意转变而归正的含义，不弱化为一般性的“后悔”。
- source_word: ἐν ἁπλότητι
  choice: 显为纯诚
  rationale: ἁπλότης在本段兼有单纯、真诚、不怀二心之意；“纯诚”承接全段主题，并避免被误解为头脑简单。
- source_word: τοῦ οἴκου σου
  choice: 你全家
  rationale: οἶκος在此指家中共同体或家人；“全家”比直译“家宅”更符合现代汉语。
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: 清洁无玷污
  rationale: 保留两个并列形容词的递进语气及道德、礼仪性的洁净意象。
theological_decisions:
- issue: “你和你全家的悔改”与个人责任的关系
  choice: 你和你全家的悔改
  alternative: 你的悔改以及你家人的悔改
  rationale: 原文ἡ μετάνοιά σου καὶ τοῦ οἴκου σου将两者紧密并列，但未解释其机制；译文保留这种共同体表达，不补入代理悔改或各自悔改等解释。
- issue: εὑρεθῇ的表达
  choice: 显为
  alternative: 被发现是／得以处于
  rationale: “显为”保留“经查验而呈现为”的意味，同时不明确指定审察者，避免把原文的神学含蓄具体化。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“所以”承接上文；“照我对你所说的去做”将比较从句自然化，但不增添新义。原文括号中的σου虽可能属文本校补，语义上明确指“你的心”，正文自然译出，不另设脚注。
