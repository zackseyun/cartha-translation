revisions:
- from: 所以，施与的人是无罪的；因为他怎样从主领受了要完成的服事，也就怎样单纯地完成了，不分别该给谁、不该给谁。因此，这项以单纯之心完成的服事，在上帝面前得了荣耀。这样以单纯之心服事上帝的人，必得生命。
  to: 所以，施与者是无罪的；因为他从主领受了完成这服事的托付，就单纯地完成了这服事，不分辨该给谁，或不该给谁。因此，这服事既单纯地完成了，就在上帝面前成为荣耀的。这样单纯地服事上帝的人，必将活着。
  rationale: 修订消除原文没有的方式比较，明确“从主领受”所修饰的是完成服事的托付；并将末句译作“必将活着”，以保留ζήσεται的未来性及其未明定的生命范围。其余关键术语和简洁、庄重的语体均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:51:08Z'
review_pass:
  verdict: revise
  source_fidelity: 总体忠实地传达了给予者在施与事上不因受领者而负罪、所领受的服事、毫无区别地给予，以及将要活着的应许。惟“他怎样……也就怎样……”将ὡς的根据/说明性用法译成方式对应，暗示原文没有的“照所领受的方式完成”；“必得生命”则略将ζήσεται（将活着）具体化为获得生命。
  naturalness: 整体庄重通顺，但“他怎样从主领受了要完成的服事，也就怎样单纯地完成了”结构生硬且语义关系不够准确。“这项以单纯之心完成的服事，在上帝面前得了荣耀”可更自然地表述为“这服事既单纯地完成了，就在上帝面前成为荣耀的”。
  terminology: “施与者”“无罪”“服事”“上帝”均适切。“单纯地”能保留ἁπλῶς所含不偏私、不计较的语义；本节无需将διακονία制度化为正式职分。
  issues:
  - severity: medium
    issue: “他怎样……也就怎样……”误加方式对应
    rationale: ὡς γὰρ ἔλαβεν παρὰ τοῦ Κυρίου τὴν διακονίαν τελέσαι说明他从主领受了完成这服事的托付，随后说他单纯地完成；原文并未说他以领受时的同一方式完成。
  - severity: low
    issue: “必得生命”略强于“将活着”
    rationale: ζήσεται直义为“将活着”。“得生命”虽可见于英语审计文本，但在中文中更容易表示取得某种生命，宜保留原文未明说今生或永生的开放性。
  - severity: low
    issue: “得了荣耀”中文归属略含混
    rationale: ἔνδοξος意为“荣耀的、显荣的”；“得了荣耀”可被理解为领受荣耀。改为“成为荣耀的”更贴近谓语形容词。
  revised_text: 所以，施与者是无罪的；因为他从主领受了完成这服事的托付，就单纯地完成了这服事，不分辨该给谁，或不该给谁。因此，这服事既单纯地完成了，就在上帝面前成为荣耀的。这样单纯地服事上帝的人，必将活着。
  revised_footnotes: []
  revision_rationale: 修订消除原文没有的方式比较，明确“从主领受”所修饰的是完成服事的托付；并将末句译作“必将活着”，以保留ζήσεται的未来性及其未明定的生命范围。其余关键术语和简洁、庄重的语体均予保留。
