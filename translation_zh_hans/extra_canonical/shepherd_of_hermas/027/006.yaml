base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/006.yaml
  text: Therefore the one who gives is innocent; for just as he received from the Lord the ministry to carry out, he carried it out simply, making no distinction as to whom he should give or not give. Thus this ministry, having been carried out simply, became glorious before God. Therefore the one who thus ministers simply to God will live.
translation:
  language: zh_hans
  text: 所以，施与者是无罪的；因为他从主领受了完成这服事的托付，就单纯地完成了这服事，不分辨该给谁，或不该给谁。因此，这服事既单纯地完成了，就在上帝面前成为荣耀的。这样单纯地服事上帝的人，必将活着。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ διδοὺς
  choice: 施与的人
  rationale: 准确表达持续或典型的给予行为；“施与”较“捐赠”宽泛，也符合本段向缺乏者给予的语境。
- source_word: ἀθῷος
  choice: 无罪的
  rationale: 在此指给予者不因领取者是否正当而被追责；译为“无罪的”保留其责任与审判语境。
- source_word: διακονία
  choice: 服事
  rationale: 兼顾受主托付的服务行动及其宗教语境；避免仅译作制度化的“职分”。
- source_word: ἁπλῶς
  choice: 单纯地／以单纯之心
  rationale: 呼应本命令全文的ἁπλότης，既有不偏私、不盘算之意，也强调诚实纯一的态度。
- source_word: μηθὲν διακρίνων
  choice: 不分别
  rationale: 保留“不作区分、不加筛选”的核心含义，与上文不要犹疑给谁相呼应。
- source_word: ἔνδοξος παρὰ τῷ Θεῷ
  choice: 在上帝面前得了荣耀
  rationale: 保留神面前的评价及“荣耀”措辞，不弱化为单纯的“蒙悦纳”。
- source_word: ζήσεται
  choice: 必得生命
  rationale: 保留未来时及可能具有末世意味的“活／生命”，比只表示今生活着的“必存活”更自然地呈现神学张力。
theological_decisions:
- issue: 给予者“无罪”是否表示普遍性的无罪
  choice: 按上下文限定为施与行为中不因受领者的动机而负罪
  alternative: 译为“无可指责”，弱化罪责含义
  rationale: ἀθῷος与前文领取者向上帝交账相对，重点是给予者在此事上的责任；正文保留“无罪的”，但不扩展为全面无罪论。
- issue: διακονία是具体托付还是教会职分
  choice: 译作“服事”，保留两者之间的开放性
  alternative: 译作“职事”或“任务”
  rationale: 原文说明这是从主领受并完成的διακονία，但未明确指正式教会职位，不宜制度化。
- issue: ζήσεται所指的生命
  choice: 译作“必得生命”，不明确限定今生或永生
  alternative: “必存活”或“必得永生”
  rationale: 原文单用“将活着”，在早期基督教劝诫语境中可能含终末救恩意味，但没有明说“永生”，故保留张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。重复“单纯”以保留本段关键词ἁπλῶς与整条命令中ἁπλότης的连贯性；句式尽量贴近希腊文论证次序，同时避免生硬直译。
