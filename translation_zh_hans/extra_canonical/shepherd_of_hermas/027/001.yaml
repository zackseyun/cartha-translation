base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/001.yaml
  text: 'He says to me: Have simplicity, and become guileless, and you will be like the little ones who do not know the wickedness that destroys the life of human beings.'
translation:
  language: zh_hans
  text: 他对我说：“要有纯朴，并要成为纯良的人；这样，你就会像那些不认识毁坏人生命之邪恶的幼小孩子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητα
  choice: 纯朴的心
  rationale: 此处指不复杂、不怀恶意的纯一品格；加“的心”使现代汉语自然，同时与后文“毫无诡诈”相配。
- source_word: ἄκακος
  choice: 毫无诡诈的人
  rationale: 该词可指无恶、无害、天真无邪；此处与ἁπλότης并列，译为“毫无诡诈”既保留道德含义，也避免误解为缺乏判断力。
- source_word: νήπια
  choice: 婴孩
  rationale: 原词指幼小孩童或婴幼儿；“婴孩”简洁庄重，并突出尚不认识邪恶的形象。
- source_word: πονηρίαν
  choice: 邪恶
  rationale: 保留其广泛含义，可包括恶意、败坏和恶行，不将其限缩为某一种罪恶。
- source_word: ἀπολλύουσαν τὴν ζωὴν
  choice: 毁坏人生命
  rationale: ἀπόλλυμι可指毁灭、使丧失；“毁坏”保留力度，也不预先限定为肉体死亡或永恒灭亡。
theological_decisions:
- issue: “生命”所指的范围
  choice: 生命
  alternative: 灵魂／永生
  rationale: 原文仅用ζωή，没有明确限定；保留“生命”可维持其可能涵盖现世、道德及属灵生命的张力。
- issue: 像婴孩与不认识邪恶之间的关系
  choice: 按原文表述为“像婴孩一样，不认识……邪恶”
  alternative: 像无罪的婴孩一样
  rationale: 原文强调婴孩不认识毁坏生命的邪恶，并未明说婴孩无罪；不加入系统神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。保留直接引语和原句递进结构；不补入原文未明说的教义解释。
