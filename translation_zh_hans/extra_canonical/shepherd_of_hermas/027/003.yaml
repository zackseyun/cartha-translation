base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/003.yaml
  text: Slander is evil; it is an unsettled demon, never at peace, but always dwelling amid divisions. So keep away from it, and you will always have prosperity with all.
translation:
  language: zh_hans
  text: 毁谤是邪恶的，是一个躁动不安、从不安宁、总住在纷争之中的邪灵。所以你要远离它，就必常常与众人一同兴盛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλία
  choice: 毁谤
  rationale: 指在背后说人坏话、损害他人名誉；“毁谤”既准确又适合庄重的现代中文语体。
- source_word: ἀκατάστατον
  choice: 躁动不安
  rationale: 表达不稳定、不得安宁并引发扰乱的状态，与下文“从不安宁”自然衔接。
- source_word: δαιμόνιον
  choice: 邪灵
  rationale: 保留原文将毁谤人格化为属灵恶者的强烈措辞；现代中文中“邪灵”比“鬼魔”更自然，同时不削弱其超自然含义。
- source_word: ἐν διχοστασίαις
  choice: 在纷争之中
  rationale: διχοστασία指分裂、对立和争斗；“纷争”能概括其人际与群体性的破坏。
- source_word: εὐθηνίαν
  choice: 和睦安好
  rationale: 该词可指兴盛、顺遂或安适；在“与众人”这一语境中，译为“和睦安好”既保留福祉之意，也呈现关系层面的顺遂。
theological_decisions:
- issue: “毁谤是……邪灵”应按字面还是纯粹比喻处理
  choice: 保留“邪灵”的直陈，并让“它”同时承接毁谤及其人格化形象
  alternative: 译作“毁谤像一个令人不安的恶魔”或“毁谤是一种扰乱人的恶习”
  rationale: 希腊文直接使用“是”（ἐστιν）而非“像”，不宜在翻译中消解其属灵人格化张力，也不进一步界定其魔鬼论含义。
- issue: εὐθηνία是否承诺物质兴旺
  choice: 按上下文译为“与众人和睦安好”
  alternative: “与众人一同兴旺”或“凡事亨通”
  rationale: μετὰ πάντων使重点落在人际处境；这样可避免把句子收窄为物质繁荣，同时保留安适顺遂的含义。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。保留原文简短有力的劝诫节奏和“毁谤—邪灵”的人格化表达；末句兼顾εὐθηνία的福祉含义及“与众人”的关系语境。
