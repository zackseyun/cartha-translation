base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/005.yaml
  text: 'I asked her, "Why has the tower been built upon the waters, lady?" She says, "I told you before also, and you inquire diligently; therefore, by inquiring, you find the truth. Why, then, the tower has been built upon the waters—listen: because your life was saved through water and will be saved. And the tower has been founded by the word of the almighty and glorious Name, and is held fast by the unseen power of the Master."'
translation:
  language: zh_hans
  text: 我问她：“夫人，为什么这座塔建在水上？”她说：“我先前也告诉过你，你却仍仔细寻求；你这样寻求，就会找到真理。至于这座塔为什么建在水上，你要听：因为你们的生命曾借着水得救，也将借着水得救。这座塔是借着全能而荣耀之名的话语奠基的，又由主宰那看不见的能力维系。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυρία
  choice: 夫人
  rationale: 保留对女性异象人物的尊称，符合庄重而自然的现代汉语。
- source_word: ἐκζητεῖς ἐπιμελῶς
  choice: 殷勤寻求
  rationale: 兼顾ἐπιμελῶς的认真、勤勉之意与ἐκζητέω的深入寻求语气。
- source_word: διὰ ὕδατος
  choice: 借着水
  rationale: 保留διά表示媒介的含义，不在正文中额外判定具体礼仪解释。
- source_word: τῷ ῥήματι
  choice: 以……的话语
  rationale: 将ῥῆμα译为“话语”，并按与格表达奠基所凭借的根据或媒介。
- source_word: τοῦ παντοκράτορος καὶ ἐνδόξου ὀνόματος
  choice: 全能者荣耀之名
  rationale: 保留属格结构可能以“名”为核心的表达，同时使汉语通顺；不擅自把“名”具体等同于某一位格。
- source_word: δεσπότου
  choice: 主宰
  rationale: 体现该词所含的绝对权柄，比一般“主人”更适合此处神圣语境。
- source_word: κρατεῖται
  choice: 托住
  rationale: 表达塔由不可见能力支撑、维系而稳固的被动态意义。
theological_decisions:
- issue: “借着水得救”的所指
  choice: 直译为“曾借着水得救，也将借着水得救”
  alternative: 明确译作“借着洗礼得救”
  rationale: 原文仅说ὕδωρ（水），虽可能带有洗礼含义，却未在本句明说；保留文本的意象与神学张力。
- issue: 过去与未来两个得救时态
  choice: 保留“曾……也将……”
  alternative: 概括为“因水而得救”
  rationale: ἐσώθη与σωθήσεται分别为过去和未来时态，二者并置具有解释意义，不宜抹平。
- issue: “全能者荣耀之名的话语”的属格关系
  choice: 译作“全能者荣耀之名的话语”
  alternative: 译作“全能而荣耀之上帝的话语”
  rationale: 希腊文形容词在属格中直接修饰ὀνόματος（名），因此保留“名”为语法中心，避免把修饰关系悄然转移。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；保留异象对话的直接性。正文无脚注，故不设置脚注标记。
