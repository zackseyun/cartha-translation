  to: 她说：“的确有许多人会听见；听见之后，其中有些人会欢喜，有些人却会哭泣。但即使是这些人，如果他们听见并悔改，也会欢喜。因此，你要听这座塔的比喻，因为我要把一切都向你揭示。不要再为了启示的事来烦扰我；这些启示有其终结，因为它们已经完满了。可是你不会停止求启示，因为你真是不知羞耻。”
  rationale: 修订仅校正条件句中“听”的译法及“如果”的条件力度，避免把原文未明说的“顺从”强加于文本；并微调末句语体和“启示”两句的句际关系。保留“这些启示”的限定，避免将叙事中的终结语言扩大为有关启示的一般性教义主张。
