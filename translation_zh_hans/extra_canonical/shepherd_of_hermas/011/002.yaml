base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/002.yaml
  text: She said, "Many indeed will hear; and, having heard, some of them will rejoice, but some will weep. But even these, if they hear and repent, they too will rejoice. Therefore listen to the parables of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations, for these revelations have an end, for they have been completed. But you will not stop asking for revelations, for you are shameless."
translation:
  language: zh_hans
  text: 她说：“的确有许多人会听见；听见之后，其中有些人会欢喜，有些人却会哭泣。但即使是这些人，如果他们听见并悔改，也会欢喜。因此，你要听这座塔的比喻，因为我要把一切都向你揭示。不要再为了启示的事来烦扰我；这些启示有其终结，因为它们已经完满了。可是你不会停止求启示，因为你真是不知羞耻。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσονται / ἀκούσαντες / ἀκούσωσιν
  choice: 听见；听从
  rationale: 前两处表示听到信息，译作“听见”；条件句中的“听”在悔改语境下含接受、响应之意，译作“听从”，同时保留与悔改的并列关系。
- source_word: παραβολὰς
  choice: 比喻
  rationale: 此处指借塔的各项形象作解释和教导，采用现代读者熟悉的宗教及文学用语“比喻”。
- source_word: ἀποκαλύψω / ἀποκαλύψεως / ἀποκαλύψεις
  choice: 揭示／启示
  rationale: 动词按具体行动译为“揭示”，名词指所领受的启示内容，译为“启示”，使汉语自然且保持词根关联。
- source_word: κόπους πάρεχε
  choice: 烦扰我
  rationale: 字面为“给我劳苦、麻烦”，上下文是赫尔马不断追问，译作“烦扰我”准确自然。
- source_word: τέλος ἔχουσιν
  choice: 已有终点
  rationale: 保留τέλος既可指界限、结束，也可带完成指向的张力，并由下句“已经完成”进一步说明。
- source_word: ἀναιδὴς
  choice: 厚脸皮
  rationale: 词义为不知羞、执意纠缠；“厚脸皮”能自然传达老妇带责备而近乎诙谐的直言，强度适中。
theological_decisions:
- issue: “听”与悔改的关系
  choice: “只要听从并悔改”
  alternative: “只要听见并悔改”
  rationale: 希腊文重复ἀκούω，既可单指听见，也可在条件句中指留心接受。此处译为“听从”体现回应含义，但不把悔改并入“听”，仍保留二者的语法并列。
- issue: 启示“有终点／已经完成”的含义
  choice: 按叙事范围直译，不扩展为普遍性的启示终止论
  alternative: “启示已经全部终止”
  rationale: 上下文中的指示词αὗται限定为“这些启示”，首先指赫尔马在本异象中所求的揭示；不导入后世有关启示是否延续的教义立场。
translation_notes:
  register: 采用现代、庄重而可读的叙事对话体。保留原文由“许多人”到“其中有些人”的层次，以及“固然……却……”的转折结构；末句以直接、略带责备的口吻呈现人物性格。
