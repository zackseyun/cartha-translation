base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/003.yaml
  text: '"The tower that you see being built, I am the Church, the one shown to you both now and before. Whatever, therefore, you wish to ask about the tower, I will reveal to you, so that you may rejoice with the saints."'
translation:
  language: zh_hans
  text: “你所看见正在建造的那座塔，就是我——教会；我就是如今和先前向你显现的那一位。因此，关于这座塔，无论你想问什么，只管问，我会向你揭示，使你能与众圣徒一同欢喜。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πύργος
  choice: 那座塔
  rationale: 保留异象中的核心建筑意象，并用指示语对应关系从句所限定的特定塔。
- source_word: ἡ Ἐκκλησία
  choice: 教会
  rationale: 此处拟人化的说话者明确自称为教会；采用现代汉语基督教文献中通行且易懂的译法。
- source_word: ἡ ὀφθεῖσά σοι
  choice: 向你显现的那一位
  rationale: 按被动分词的显现含义翻译，并用“那一位”保持教会在异象中作为女性人物说话的拟人表达。
- source_word: ἐπερωτᾷν
  choice: 问
  rationale: 此处指进一步询问塔的意义；以自然汉语表达，不额外加入盘问或求告的意味。
- source_word: ἀποκαλύψω
  choice: 揭示
  rationale: 保留启示、揭开隐义的语义，同时与异象语境相称。
- source_word: τῶν ἁγίων
  choice: 众圣徒
  rationale: 保留早期基督教群体中对属神之人的称谓，不将其缩窄为后世正式册封的圣人。
theological_decisions:
- issue: 塔与教会的同一关系
  choice: “那座塔，就是我——教会”
  alternative: “那座塔代表我，也就是教会”
  rationale: 希腊文直接使用“我是教会”的系词结构，不明确说“代表”；译文保留异象中直接认同的力度，不把象征关系解释得过满。
- issue: “与众圣徒一同欢喜”的对象范围
  choice: 保留“众圣徒”
  alternative: “与信徒们一同欢喜”
  rationale: ἅγιοι字面为“圣者／圣徒”；保留其神学称谓及可能的群体范围，不径自等同于某一更具体的群体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。“就是我——教会”以破折号呈现希腊语中略显突出的同位与自我认同；“只管问”补足汉语祈使语感，但不改变“无论你想问什么”的开放范围。
