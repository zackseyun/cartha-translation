  source_fidelity: 译文准确对应本段希腊文：ὁ πύργος译为“那座塔”，οἰκοδομούμενον以“正在建造”表达进行状态；“我——教会”保留说话者与教会的直接认同，以及异象中塔的意象。ἡ ὀφθεῖσά σοι καὶ νῦν καὶ τὸ πρότερον准确译作“如今和先前向你显现的那一位”。末句保留了就塔提问、说话者将予以揭示，以及“与众圣徒一同欢喜”的目的关系。
  naturalness: 文字为自然、庄重的现代汉语。破折号用于呈现拟人化的“我——教会”，清楚且符合异象对话的语体。“无论你想问什么，只管问”顺畅表达希腊文开放式的关系从句与语境中的邀请；“会向你揭示”也恰合ἀποκαλύψω的启示语境。
  terminology: “教会”恰当对应Ἐκκλησία；“众圣徒”保留τῶν ἁγίων作为群体称谓，不不当地限定为后世册封意义。“揭示”准确而不过度技术化地表达ἀποκαλύψω。
