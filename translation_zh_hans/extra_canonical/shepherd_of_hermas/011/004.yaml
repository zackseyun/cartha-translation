base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/004.yaml
  text: I say to her, "Lady, since once for all you considered me worthy for everything to be revealed to me, reveal it." She says to me, "Whatever can be revealed to you will be revealed. Only let your heart be toward God, and do not be double-minded in whatever you see."
translation:
  language: zh_hans
  text: 我对她说：“夫人，既然你曾一度认为我配得领受一切的启示，就请启示吧。”她对我说：“凡是可以向你启示的，都会向你启示。只要你的心向着上帝；无论看见什么，都不要心怀二意。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: 夫人
  rationale: 保留对女性形象的尊称，符合现代汉语庄重叙事语体，也不额外赋予宗教头衔。
- source_word: ἠξίών με ἠγήσω
  choice: 你已认为我配得
  rationale: 直陈对方曾判定说话者为配得，保留ἀξιόω所含的资格与价值判断。
- source_word: τοῦ πάντα μοι ἀποκαλῦψαι
  choice: 让这一切都向我揭示
  rationale: 表达希腊文冠词不定式的内容，同时顺应后句反复出现的被动式“向你揭示”。
- source_word: Ὃ ἐὰν ἐνδέχηταί σοι ἀποκαλυφθῆναι
  choice: 凡是可以向你揭示的
  rationale: ἐνδέχηται表示可能或容许；译文保留其范围限制，不武断说明限制来自能力还是许可。
- source_word: ἡ καρδία σου πρὸς τὸν Θεὸν ἤτω
  choice: 让你的心归向上帝
  rationale: πρός表达朝向、面向；“归向”在现代汉语中自然地传达内心定向，又不把它窄化为单一情绪。
- source_word: μὴ διψυχήσῃς
  choice: 不要心怀二意
  rationale: διψυχέω字面涉及‘双心’，语义为犹疑、摇摆或信心不定；“心怀二意”保留其形象和道德—信仰张力。
- source_word: ὃ ἂν ἴδῃς
  choice: 无论看见什么
  rationale: 保留不定关系结构的开放范围，并与异象叙事中的视觉经验相呼应。
theological_decisions:
- issue: 启示范围的限制
  choice: 凡是可以向你揭示的
  alternative: 凡是准许向你揭示的／凡你所能领受的
  rationale: 原文ἐνδέχηται可指可能性或许可，并未明确限制来自上帝的许可还是领受者的能力，因此采用较中性的“可以”，保留歧义。
- issue: διψυχήσῃς所指的内在状态
  choice: 无论看见什么，都不要心怀二意
  alternative: 不要疑惑你所看见的／不要三心二意
  rationale: 原文既可能强调怀疑异象，也可能泛指内心摇摆；译文不把它限定为认知疑问，并保留“二心”的早期基督教伦理意象。
- issue: πρὸς τὸν Θεόν的方向性
  choice: 让你的心归向上帝
  alternative: 让你的心向着上帝／一心信靠上帝
  rationale: “归向”保留方向与委身意味；不用“一心信靠”，以免把原文较宽的心灵朝向解释成特定教义表述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事对话体。保留“我说／她说”的原文时态推进和“揭示”的关键词重复，使本段与前后异象解释相连。没有需要设置的正文脚注标记。
