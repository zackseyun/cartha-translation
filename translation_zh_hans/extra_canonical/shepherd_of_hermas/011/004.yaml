  naturalness: 后半段自然庄重；“只要让你的心归向上帝”略显生硬，改为“只要你的心向着上帝”更贴合现代汉语，也更直接对应πρὸς τὸν Θεόν。首句宜重组。
  terminology: “夫人”恰当地保留Κυρία的敬称而不添加宗教头衔；“上帝”“启示／揭示”及“心怀二意”均可保留。为维持本段ἀποκαλύπτω词族的重复，正文采用“启示”。
