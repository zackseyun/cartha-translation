  naturalness: 修改后的文字保持现代汉语的庄重叙事语体。“她想要走开”比“就想离去”更贴近原文欲离开的未完成动作；“在极大的荣耀中认识主”虽略具经文体色彩，仍通顺，并避免添加原文未明说的领属关系。
