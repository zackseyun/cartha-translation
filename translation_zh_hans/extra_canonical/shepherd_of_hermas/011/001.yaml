base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/001.yaml
  text: After showing me these things, she wanted to go away. I say to her, "Lady, what profit is it to me to have seen these things and not know what the matters are?" Answering me, she says, "You are a cunning man, wanting to know the things concerning the tower." "Yes, lady," I say, "so that I may report them to the brothers, and that, becoming more cheerful and hearing these things, they may know the Lord in much glory."
translation:
  language: zh_hans
  text: 她把这些事指给我看以后，想要走开。我对她说：“夫人，我看见了这些事，却不知道这些事究竟是什么意思，这对我有什么益处呢？”她回答我说：“你这人真精明，想知道关于那座塔的事。”“是的，夫人，”我说，“好让我把这些事告诉弟兄们，使他们更加喜乐[a]；他们听见这些事以后，就在极大的荣耀中认识主。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本或版本不包括“使他们更加喜乐；他们听见这些事以后”（希腊文：ἱλαρώτεροι γένωνται, καὶ ταῦτα）。
    reason: 所给希腊底本以方括号标示这段文字，表示其文本地位不确定；正文依照所给英文审校轨迹保留，同时明确提示读者。
lexical_decisions:
- source_word: Δείξασά μοι ταῦτα
  choice: 她把这些事指给我看以后
  rationale: 保留分词的先行动作及视觉启示语境，中文表达自然。
- source_word: Κυρία
  choice: 夫人
  rationale: 体现对女性形象的尊称；比“女士”更庄重，也不误作神学称号“主”。
- source_word: τί μοι ὄφελος
  choice: 这对我有什么益处呢
  rationale: 直接保留ὄφελος的利益、益处含义和反问语气。
- source_word: τί ἐστιν τὰ πράγματα
  choice: 它们究竟是什么意思
  rationale: τὰ πράγματα在此指所见诸事的实质或含义；按上下文采用自然中文，避免生硬的“这些事情是什么”。
- source_word: Πανοῦργος
  choice: 真精明
  rationale: 该词可有“机灵、狡猾”之意；此处语气带轻微揶揄但未必谴责，译作“精明”保留张力而不过度负面化。
- source_word: τὰ περὶ τὸν πύργον
  choice: 关于那座塔的事
  rationale: 准确表达περί结构，并以“那座塔”衔接已展示的异象。
- source_word: ἀναγγείλω
  choice: 告诉
  rationale: 表达向弟兄们转述、宣告所领受信息；现代中文清楚自然。
- source_word: ἀδελφοῖς
  choice: 弟兄们
  rationale: 保留早期基督徒群体的亲属称谓及原文阳性复数形式。
- source_word: ἐν πολλῇ δόξῃ
  choice: 主的大荣耀
  rationale: 以领属关系呈现较自然，同时不把短语具体解释成“在极大荣耀中认识主”或“认识大有荣耀的主”中的某一种。
theological_decisions:
- issue: ἐν πολλῇ δόξῃ与“认识主”的关系
  choice: 认识主的大荣耀
  alternative: 在极大的荣耀中认识主／认识大有荣耀的主
  rationale: 希腊语介词短语的修饰关系有一定含混；正文采用简洁自然且不引入额外教义限定的表达，并避免将“荣耀”解释为人的状态。
- issue: 方括号内文本[ἱλαρώτεροι γένωνται, καὶ ταῦτα]的文本状态
  choice: 纳入正文，译为“使他们听见以后更加喜乐”
  alternative: 省略该短语，译为“好让我把这些事告诉弟兄们，使他们听见后认识主的大荣耀”
  rationale: 所给底本以方括号标示该片语，说明其文本可靠性可能较弱；英文咨询层亦纳入。正文保留，并用脚注说明异文状态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体；保留现在时引语框架“我对她说／她回答我说”，再现原文叙事的现场感。正文须补入脚注标记；对应位置为：“好让我把这些事告诉弟兄们，使他们听见以后更加喜乐[a]，并认识主的大荣耀。”
