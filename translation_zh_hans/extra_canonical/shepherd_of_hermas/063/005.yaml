  text: 5. Then those who had the dry but not cut [rods] handed them in. And some of them handed in their rods green, but others dry and cut, as if worm-eaten. So those who had handed in green [rods] he ordered to stand apart, but those with dry—
translation:
  language: zh_hans
  text: 5. 接着，那些拿着干枯却没有被砍断的枝条的人交上了枝条。他们当中，有些人交上的枝条是青绿的，有些人的却干枯而且被砍断了，仿佛被虫蛀过。于是，牧人吩咐那些交上青绿枝条的人站到一边；至于那些交上干枯枝条的人——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存所给希腊文在此处中断，句子未完。
    reason: 来源文本止于τοὺς δὲ ξηρὰ，直译为“至于那些干枯的……”，需明确保留残句而不擅自补全。
lexical_decisions:
- source_word: ῥάβδοι
  choice: 枝条
  rationale: 上下文中这些物件被栽种、拔出，并会青绿或干枯；译作“枝条”比笼统的“杖”更符合本段意象。
- source_word: ξηράς
  choice: 干枯
  rationale: 用于植物枝条时，“干枯”自然准确，也与“青绿”形成鲜明对照。
- source_word: μὴ κεκομμένας / κεκομμένας
  choice: 没有裂开的／裂开了
  rationale: κόπτω 的完成时被动态可指被砍、被切或出现裂损；结合前文枝条受检验的状态，以“裂开”保留可见损伤之意，避免误解为已被截断成数段。
- source_word: χλωράς
  choice: 青绿的
  rationale: 表达枝条仍有生机的绿色状态，比单说“绿的”更具植物语境。
- source_word: ὡς ὑπὸ σητός
  choice: 仿佛被虫蛀过
  rationale: σητός 指蛀蚀性虫害；“仿佛”对应 ὡς，不把比拟强化为确定事实。
- source_word: χωρὶς σταθῆναι
  choice: 站到一边
  rationale: 自然传达被吩咐分开站立、另成一组的意思。
theological_decisions:
- issue: 枝条状态是否象征特定属灵类别
  choice: 只翻译叙事中的枝条状态，不在正文中解释其象征意义
  alternative: 直接释为信徒的悔改、背道或得救状况
  rationale: 本句本身尚未给出解释；保留寓意后续展开所产生的张力，避免预先导入教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“牧人”承接本作品中的人物称谓。因本读者分段从上一语境延续，首句补出“枝条”以避免汉语中宾语含混；结尾用破折号并加脚注忠实呈现来源截断。
