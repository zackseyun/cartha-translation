  naturalness: 修订后使用“砍断”清楚自然，并保留“站到一边”和残句破折号，符合现代汉语叙事语体。
  terminology: “枝条”“干枯”“青绿”“牧人”均适切。将“裂开”统一改为“砍断”，使术语准确对应原文并维持前后对照。
