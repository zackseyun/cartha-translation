  text: 2. Seeing me girded and ready to serve him, he says, “Call the men whose rods have been planted, by rank, just as each gave the rods.” And I went out to the field and called them all; and they all stood in their ranks.
translation:
  language: zh_hans
  text: 2 他见我束好腰，准备服侍他，就对我说：“召集那些栽下了自己杖的人，照各人交杖时的次序。”于是我到田野去，把众人都召来；他们都按各自的次序站好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεζωσμένον
  choice: 已经束好腰
  rationale: 保留古代为劳作或服侍而束衣整装的具体动作，也自然表达已经预备妥当的状态。
- source_word: διακονεῖν
  choice: 服侍
  rationale: 此处指为牧者提供协助或服务；“服侍”符合语境，并不额外限定为制度化职分。
- source_word: ῥάβδοι
  choice: 杖
  rationale: 延续本比喻中的具体物件，较“枝条”更贴近常见的 ῥάβδος 含义，也与被交出、栽下的叙事相符。
- source_word: κατὰ τὸ τάγμα / κατὰ τὰ τάγματα
  choice: 按照……次序／按各自的次序
  rationale: τάγμα 可表示排列、队列或组次；上下文强调依交杖顺序集合站立，译作“次序”可保留这种组织含义而不过度具体化为军队编制。
- source_word: πεδίον
  choice: 田野
  rationale: 表示开阔地或田地；结合杖被栽下的情境，“田野”自然且具象。
