review_pass:
  verdict: revise
  source_fidelity: 草稿基本准确传达了分词结构「见我束好腰、预备服侍」及随后召集、列队的动作。但「那些人的杖被栽下的人」在汉语中句法关系不清，容易被读成“杖把人栽下”，未能清楚表达「那些已栽下自己的杖的人」。
  naturalness: “已经束好腰”与“准备服侍他”自然得体；但引语中的定语链明显生硬。将其改为“召集那些栽下了自己杖的人”既清楚又保持原文的叙事意象。“按各自交杖时的次序来”可精炼为“照各人交杖时的次序”，并使后句与之呼应。
  terminology: 保留“束好腰”“服侍”“杖”“田野”。“杖”虽在此比喻的植物语境中带有张力，但与既有译语及希腊文ῥάβδοι相符；不宜擅自改作“枝条”。“次序”恰当地保留τάγμα的队列／编次含义。
  issues:
  - severity: medium
    issue: “那些人的杖被栽下的人”句法歧义且不自然。
    rationale: 原文τοὺς ἄνδρας ὧν εἰσὶν αἱ ῥάβδοι πεφυτευμέναι指“杖已被栽下、并属于他们的那些男子”。汉语应明确人是“栽下杖”的相关者，同时不添加神学或制度性解释。
