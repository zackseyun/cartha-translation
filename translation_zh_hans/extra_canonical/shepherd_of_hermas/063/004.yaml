  text: 4. First those who had the dry and cut [rods] handed them in, and they were found likewise to be dry and cut; and he ordered them to stand apart.
translation:
  language: zh_hans
  text: 4. 那些持有枯干、被截断枝条的人最先交上了枝条；这些枝条也同样是枯干、被截断的。他吩咐他们分开站着。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδοι
  choice: 枝条
  rationale: 本段所指是栽种后又拔出的木质枝条；译作“枝条”比泛称“杖”更贴合此处的种植语境。
- source_word: ξηρὰς
  choice: 枯干
  rationale: 表达植物失去生机、干枯的状态，也与后文“青绿”的枝条形成自然对照。
- source_word: κεκομμένας
  choice: 被削过
  rationale: κόπτω 的完成时被动分词表示枝条已经受到砍削或切削；“被削过”保留动作及其结果，又不擅自限定具体削法。
- source_word: ἐπέδωκαν
  choice: 交上来
  rationale: 在牧人命众人把各自枝条带来交验的场景中，表示递交，现代汉语译作“交上来”自然清楚。
- source_word: χωρὶς σταθῆναι
  choice: 另站一处
  rationale: 表示与其他人分开站立；此译简洁地传达分类隔离之意。
theological_decisions:
- issue: 枝条状态是否暗示最终定罪
  choice: 仅陈述枝条仍然枯干、被削，以及这些人被分开站立
  alternative: 译出“被弃绝”或“受审判”等解释性结论
  rationale: 本句只叙述检验结果和牧人的命令，象征意义将在上下文中展开，不应在此提前作神学判定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。补出第二句的主语“他们的枝条”，避免汉语歧义；“牧人”承接上文明确说话者。无脚注。
