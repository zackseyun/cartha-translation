translation:
  language: zh_hans
  text: 3. 他对他们说：“各人把自己的枝条拔出来，拿到我这里来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: 枝条
  rationale: 此处指先前栽种、如今要拔出的木质枝条；“枝条”比“杖”更自然地配合栽种和拔出的语境。
- source_word: ἐκτιλάτω
  choice: 拔出来
  rationale: 该动词在此表示把已栽种的枝条从地里拔出；译出结果补语，使现代汉语清楚自然。
- source_word: φερέτω πρός με
  choice: 拿到我这里来
  rationale: 保留向说话者移动的方向，也符合直接命令的口吻。
