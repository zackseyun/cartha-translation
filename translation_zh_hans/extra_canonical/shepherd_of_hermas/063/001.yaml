  naturalness: “我就站在他身旁”可用，但“我侍立在他身旁”更贴合叙事语境；将衣物表述为“束在腰间”较符合现代汉语和περιζώννυμι的动作。
  terminology: “牧人”“服侍”“洁净”“粗麻布”均恰当。ὠμόλινον词义不完全确定，宜在正文译为“未漂洗的亚麻布衣”，并以脚注说明，不应擅自定为特定款式。
