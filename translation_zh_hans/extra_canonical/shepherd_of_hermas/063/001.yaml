revisions:
- from: 过了几天，我们来到那地方。牧人坐在天使原来所在的位置，我就站在他身旁。他对我说：“束上未漂洗的麻布[a]，来服侍我。”于是，我束上一块洁净的粗麻布做成的未漂洗麻布。
  to: 过了几天，我们来到那地方。牧人坐在天使的位置上，我侍立在他身旁。他对我说：“把一件未漂洗的亚麻布衣[a]束在腰间，服侍我。”于是我把一件由洁净的粗麻布制成的未漂洗亚麻布衣束在腰间。
  rationale: 修订使两次ὠμόλινον保持同一指称，并以“束在腰间”准确、自然地表达περιζώννυμι。删去“原来所在”，使“天使的位置”保持原文未展开的含义；脚注继续保留罕见织物词的语义不确定性。
