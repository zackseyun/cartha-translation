base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/063/001.yaml
  text: And after a few days we came to the place, and the Shepherd sat down in the place of the angel, and I stood beside him. And he says to me, “Gird yourself with a raw-linen garment, and serve me.” So I girded myself with a clean raw-linen garment made from sackcloth.
translation:
  language: zh_hans
  text: 过了几天，我们来到那地方。牧人坐在天使的位置上，我侍立在他身旁。他对我说：“把一件未漂洗的亚麻布衣[a]束在腰间，服侍我。”于是我把一件由洁净的粗麻布制成的未漂洗亚麻布衣束在腰间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未漂洗的亚麻布衣”：原词罕见，可能指未经漂洗或加工的亚麻布衣物。下文说明这件衣物由洁净的粗麻布制成；其具体款式不能确定。
    reason: ὠμόλινον的精确指称有不确定性；脚注保留这种不确定性，同时说明正文译法。
lexical_decisions:
- source_word: ποιμήν
  choice: 牧人
  rationale: 保留作品中这一人物的称号，并与《牧人书》的牧羊意象一致。
- source_word: εἰς τὸν τόπον τοῦ ἀγγέλου
  choice: 在天使原来所在的位置
  rationale: 希腊语直译为“在天使的位置”；加“原来所在”仅使现代汉语关系清楚，不断定这是职分、座位或接替关系。
- source_word: ὠμόλινον
  choice: 未漂洗的麻布
  rationale: 该词罕见，指未经加工或漂洗的亚麻布一类衣物；正文保留其材质和粗朴性质，不擅自具体化为围裙或长袍。
- source_word: διακόνει μοι
  choice: 来服侍我
  rationale: 表达为他提供服事、协助之意，不引入后世教会职分含义。
- source_word: ἐκ σάκκου γεγονὸς καθαρόν
  choice: 洁净的粗麻布做成的
  rationale: σάκκος表示粗糙的麻布或袋布；καθαρόν译作“洁净的”，保留其可能兼具实际与礼仪色彩的开放性。
theological_decisions:
- issue: “天使的位置”是否表示牧人取代天使的职分
  choice: 仅表述牧人坐在天使原来所在的位置
  alternative: 译作“坐上天使的座位”或“接替天使的位置”
  rationale: 原文只陈述空间位置，没有明确说明职分接替或身份等同。
- issue: καθαρόν是否专指礼仪洁净
  choice: 译作“洁净的”
  alternative: 译作“干净的”或“圣洁的”
  rationale: “洁净”既可指实际清洁，也容纳象征或礼仪意味，避免过度解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“牧人”为人物称号；“束上”对应系束衣物的动作。正文避免把罕见衣物名称具体化为“围裙”或“腰布”，以保留原文的不确定性。
