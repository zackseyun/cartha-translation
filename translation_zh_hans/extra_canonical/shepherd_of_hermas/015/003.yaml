base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/003.yaml
  text: And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name of the Lord; then, when the purity of the truth comes to their remembrance, they repent and go back again after their evil desires.
translation:
  language: zh_hans
  text: 至于另外那些落在水边、却不能滚进水里的石头，你想知道他们是谁吗？他们就是那些听了这道、想要受洗归入主的名下的人；后来，当他们想起真理的纯洁时，就改变心意，又回头追随自己邪恶的欲望。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν λόγον
  choice: 这道
  rationale: 保留早期基督教语境中“所宣讲的信息、道”的浓缩表达，同时符合现代汉语宗教文体。
- source_word: βαπτισθῆναι εἰς τὸ ὄνομα τοῦ Κυρίου
  choice: 受洗归入主名下
  rationale: εἰς 表达进入、归属的方向；“归入主名下”比单纯“奉主的名受洗”更充分保留原文结构。
- source_word: ἡ ἁγνότης τῆς ἀληθείας
  choice: 真理的纯洁
  rationale: 直译并保留原文的抽象性；不擅自将其具体化为某套道德规条。
- source_word: πορεύονται πάλιν ὀπίσω τῶν ἐπιθυμιῶν αὐτῶν τῶν πονηρῶν
  choice: 又回头追随自己邪恶的欲望
  rationale: 兼顾 πορεύονται πάλιν 的“再次回去”和 ὀπίσω 的“跟随”意象，使汉语自然且保留动作方向。
theological_decisions:
- issue: μετανοοῦσιν 在负面语境中的含义
  choice: 改变了主意
  alternative: 悔改了
  rationale: 此处这些人并非离恶向善，而是因想起真理的纯洁而放弃受洗、重新追随恶欲，因此该词在这里是“重新考虑、改变心意”。脚注保留它通常可译作“悔改”的词义张力。
- issue: 洗礼与“主的名”的关系
  choice: 受洗归入主名下
  alternative: 奉主的名受洗
  rationale: 原文是 βαπτισθῆναι εἰς τὸ ὄνομα，重点包含归入与归属；译文不进一步界定洗礼的神学功效。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；保留石头“滚进水里”的异象画面，并用“这道”“归入主名下”等简洁表达维持早期基督教文本的语感。
