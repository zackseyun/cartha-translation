base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/004.yaml
  text: So she finished the explanation of the tower. But, becoming bold again, I questioned her further whether all these stones that were cast away and did not fit into the building of the tower—whether there is repentance for them and whether they have a place in this tower. “They have repentance,” she says, “but they cannot fit into this tower.
translation:
  language: zh_hans
  text: 这样，她就讲完了关于那座塔的解释。我又大着胆子问她：所有这些被丢弃、不能用于建造这座塔的石头，是否还有悔改的机会，是否还能在这座塔中有位置？她说：“它们还有悔改的机会，但不能用于这座塔。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέλεσεν
  choice: 讲完了
  rationale: 在解释告一段落的语境中，比直译“完成了”更符合现代汉语表达，同时保留结束之意。
- source_word: ἐξήγησιν
  choice: 解释
  rationale: 对应对塔之象征意义的阐释，不额外加入“异象”等原文未明说的内容。
- source_word: ἀναιδευσάμενος
  choice: 大着胆子
  rationale: 该词在此表示不顾拘谨、近乎冒昧地继续发问；“大着胆子”自然表达其语用力量，又不渲染为无礼。
- source_word: ἀποβεβλημένοι
  choice: 被丢弃
  rationale: 保留完成时被动态所表达的已经遭到弃置的状态。
- source_word: ἁρμόζοντες / ἁρμόσαι
  choice: 嵌入
  rationale: 延续石块与建筑的比喻，表达石块被配合、安置进结构中的意思。
- source_word: μετάνοια
  choice: 悔改的机会
  rationale: 在“是否有悔改”这一汉语表达中补出“机会”，表示仍可悔改的可能性；不把它改释为赦免或得救。
- source_word: τόπον
  choice: 一席之地
  rationale: 自然表达在塔中是否有位置，同时保持建筑意象。
theological_decisions:
- issue: μετάνοια 是指悔改行为、可能性，还是悔改后的接纳
  choice: 译作“还有悔改的机会”
  alternative: “还能悔改”或“还有悔改”
  rationale: 上下文把悔改与能否嵌入此塔区分开来，因此不把悔改本身等同于立即恢复原有位置。
- issue: “不能嵌入这座塔”是否应解释为永远被排除
  choice: 保持原文的建筑比喻，不补入时间或最终命运判断
  alternative: “永远不能进入这座塔”
  rationale: 本段只说不能配入“这座塔”，后文另谈较低的位置；加入“永远”会提前消解文本保留的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留塔与石头的连续建筑意象；问句略作汉语化整理，但不消除原文关于悔改与塔中位置之间的张力。
