revisions:
- from: 这样，她就讲完了关于那座塔的解释。我又大着胆子问她：所有这些被丢弃、不能嵌入塔身建筑的石头，是否还有悔改的机会，是否还能在这座塔里有一席之地？她说：“它们还有悔改的机会，但不能嵌入这座塔里。”
  to: 这样，她就讲完了关于那座塔的解释。我又大着胆子问她：所有这些被丢弃、不能用于建造这座塔的石头，是否还有悔改的机会，是否还能在这座塔中有位置？她说：“它们还有悔改的机会，但不能用于这座塔。”
  rationale: 修订仅消除“塔身”的无据限定，并将建筑比喻调整为现代汉语中更自然、同时更贴近ἁρμόζοντες／ἁρμόσαι的“用于建造”。保留“悔改的机会”与“在这座塔中有位置”之间的原文张力，不引入关于最终命运的解释。
