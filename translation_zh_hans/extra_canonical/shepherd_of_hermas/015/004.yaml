  terminology: “悔改”对应 μετάνοια，且没有将其混同于获准进入塔中，处理妥当。“一席之地”可表达 τόπον，但为保留建筑语境及与后句“这座塔”的对应，采用“在这座塔中有位置”更为贴近。
