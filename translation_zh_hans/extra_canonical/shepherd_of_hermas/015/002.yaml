base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/002.yaml
  text: But those that fall into the fire and are burned—these are the ones who have finally turned away from the living God, and it no longer came up into their heart to repent because of the desires of their lewdness and the evils they have done.
translation:
  language: zh_hans
  text: 至于那些落入火中被焚烧的，就是那些已经彻底背弃永活上帝的人；由于他们淫逸的欲望和所行的恶事，悔改的念头便不再涌上他们心头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τέλος ἀποστάντες
  choice: 彻底背弃
  rationale: εἰς τέλος 表示达到最终、完全的程度，ἀφίστημι 在此指离弃、背离；“彻底背弃”既保留其强烈程度，也符合现代汉语表达。
- source_word: τοῦ Θεοῦ τοῦ ζῶντος
  choice: 永生上帝
  rationale: 该短语直指“活着的上帝”；“永生上帝”是自然而庄重的汉语宗教用语，表达上帝是永活者，并非受造物或偶像。
- source_word: οὐκέτι αὐτοῖς ἀνέβη ἐπὶ τὴν καρδίαν
  choice: 悔改的念头便不再涌上他们心头
  rationale: 保留希腊语“升到心里”的意象，同时用“念头涌上心头”形成自然的现代汉语。
- source_word: μετανοῆσαι
  choice: 悔改
  rationale: 表达思想、心意与行为方向的转变，是此处标准且准确的宗教语汇。
- source_word: τὰς ἐπιθυμίας τῆς ἀσελγείας αὐτῶν
  choice: 他们放纵淫逸的欲望
  rationale: ἀσέλγεια 可指淫逸、无耻放纵；结合 ἐπιθυμίαι，译文同时呈现欲望内容及失控放纵的性质。
- source_word: τῶν πονηριῶν ὧν εἰργάσαντο
  choice: 又行了种种恶事
  rationale: πονηρίαι 为复数，可涵盖各样邪恶行为；“种种恶事”自然体现复数和道德含义。
theological_decisions:
- issue: 背弃上帝与不再悔改之间的关系
  choice: 用分号并以“由于”承接原文的因果结构
  alternative: 译成上帝不再准许或赐给他们悔改
  rationale: 原文说悔改不再进入他们心中，并以 διά 指向其淫逸欲望和恶行为原因；并未明说上帝主动撤回悔改机会，因此不作额外神学推断。
- issue: εἰς τέλος 所表达的终局性
  choice: 译作“彻底”
  alternative: 译作“直到末了”或“最终”
  rationale: 上下文重在背离达到完全程度；“彻底”保留强度，而不额外断定具体末世时间点或不可逆的永恒结局。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。句式保留原文先辨识象征、后解释属灵状态的结构；不添加原文未明说的审判机制或悔改教义。
