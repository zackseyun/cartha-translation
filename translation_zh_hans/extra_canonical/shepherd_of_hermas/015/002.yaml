revisions:
- from: 至于那些落入火中被焚烧的，就是那些彻底背弃永生上帝的人；由于他们放纵淫逸的欲望，又行了种种恶事，悔改的念头便不再涌上他们心头。
  to: 至于那些落入火中被焚烧的，就是那些已经彻底背弃永活上帝的人；由于他们淫逸的欲望和所行的恶事，悔改的念头便不再涌上他们心头。
  rationale: 修订“永生上帝”为“永活上帝”，以直接对应 ζῶντος；并删去“放纵”这一原文未明说的动作，同时保留 ἀσέλγεια 所含的淫逸、放荡意味。其余句法、因果关系及庄重而自然的语体维持不变。
