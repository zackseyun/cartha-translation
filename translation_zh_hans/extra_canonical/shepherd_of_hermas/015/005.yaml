base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/005.yaml
  text: Rather, they will fit in another place, much smaller; and this will be when they have been tormented and have completed the days of their sins. And for this reason they will be transferred, because they have shared in the word of the righteous one. And then it will happen that they are transferred from their torments, if the evil deeds they have done come up into their heart. But if they do not come up into their heart, they are not saved because of their hardness of heart.”
translation:
  language: zh_hans
  text: 他们却会被安放在另一个小得多的地方；这要等到他们受过折磨，并度满他们犯罪的日子。正因他们曾领受那义者的话，才会被迁到那里。若他们所行的恶事浮上心头，他们便会从所受的折磨中被迁出。若这些事没有浮上心头，他们就因心里刚硬而不能得救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτέρῳ δὲ τόπῳ ἁρμόσουσιν πολὺ ἐλάττονι
  choice: 他们却会被安放在另一个小得多的地方
  rationale: ἁρμόζω延续石头与建筑相配、安置的意象；中文用“安放”自然保留该比喻。“小得多”对应πολὺ ἐλάττονι。
- source_word: βασανισθῶσιν
  choice: 受过苦
  rationale: 该词可指受折磨、受痛苦或受惩治；此处不擅自规定刑罚性质，采用较宽而庄重的表达。
- source_word: ἐκπληρώσωσιν τὰς ἡμέρας τῶν ἁμαρτιῶν αὐτῶν
  choice: 满了他们犯罪的日子
  rationale: 保留原文“满了日子”的时间性意象，不将其解释为偿清罪债或服满刑期。
- source_word: μετέλαβον τοῦ ῥήματος τοῦ δικαίου
  choice: 曾领受那义者的话
  rationale: μετέλαβον含参与、分有或领受之意；“领受”在中文语境自然，也避免过度抽象。“那义者”保留τοῦ δικαίου可能指一位义者的形式。
- source_word: ἀναβῇ ἐπὶ τὴν καρδίαν
  choice: 浮上心头
  rationale: 以现代中文习语传达闪现于内心、进入意识的希腊表达，同时保留其悔悟条件的意味。
- source_word: σκληροκαρδίαν
  choice: 心里刚硬
  rationale: 准确传达“硬心”这一圣经及早期基督教传统中的道德—属灵意象。
theological_decisions:
- issue: τοῦ δικαίου所指为何
  choice: 那义者
  alternative: 正义的话／义道
  rationale: 属格形式可理解为阳性“义者”，也可能在语义上与“正义”相关；正文依语法较直接地译作“那义者”，不进一步指认其身份。
- issue: βασανισθῶσιν及βασάνων的性质
  choice: 受苦／所受的苦
  alternative: 受刑罚／折磨
  rationale: 原文明确有痛苦或折磨意味，却未在本句界定其制度、期限或末世论性质；采用不弱化痛苦但较少解释性的译法。
- issue: “被迁出”与得救的关系
  choice: 保留条件陈述，不说明迁移是否等同最终得救
  alternative: 明确译成获救或进入较低等级的救恩
  rationale: 原文先说从痛苦中迁移，继而说若不省悟便不得救；两者关系存在张力，应予保留。
- issue: 犯罪日子“满了”的含义
  choice: 直译为“满了他们犯罪的日子”
  alternative: 赎清罪债／服满刑期
  rationale: 原文没有明确提出功德补偿或法律刑期理论，故不导入特定教义框架。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留石头被安放和迁移的建筑意象，以及“浮上心头”“心里刚硬”等内在悔悟语言；避免将受苦、迁移与得救系统化为原文未明说的教义。
