  to: 他们却会被安放在另一个小得多的地方；这要等到他们受过折磨，并度满他们犯罪的日子。正因他们曾领受那义者的话，才会被迁到那里。若他们所行的恶事浮上心头，他们便会从所受的折磨中被迁出。若这些事没有浮上心头，他们就因心里刚硬而不能得救。
