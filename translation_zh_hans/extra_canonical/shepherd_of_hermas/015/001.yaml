base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/001.yaml
  text: 'As for the other stones that you saw thrown far from the tower and falling into the road and rolling from the road into the pathless places: these are those who have believed, but because of their double‑mindedness they abandon their true road. Thinking, then, that they are able to find a better road, they go astray and suffer misery as they walk in the pathless places.'
translation:
  language: zh_hans
  text: 至于你看见的另外那些石头，就是被扔到离塔很远的地方，落在路上，又从路上滚进无路之地的：他们就是那些已经信了，却因自己心怀二意而离开了他们自己真正的道路的人。他们以为能找到一条更好的路，结果反倒迷失，在无路之地行走，遭受困苦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: 三心二意
  rationale: 此词字面有“两个心思”之意，指内心摇摆、不能专一；“三心二意”是现代汉语中自然易懂的对应表达，也保留其不坚定的负面含义。
- source_word: ἀνοδία
  choice: 无路之地
  rationale: 该词指没有道路、难以通行之处；译作“无路之地”既呼应反复出现的“路”，又呈现迷失与艰难的意象。
- source_word: ταλαιπωροῦσιν
  choice: 受尽困苦
  rationale: 表达遭受苦楚、陷于悲惨处境；此译在现代汉语中庄重自然，并与在无路之地徘徊的图景相合。
- source_word: ἡ ὁδὸς ἡ ἀληθινή
  choice: 真正道路
  rationale: 保留原文“道路”的比喻及“真实、正确”的限定，不将其解释性地扩展为某一特定教义术语。
theological_decisions:
- issue: “已经信了”与后来离开道路之间的张力
  choice: 直译为“已经信了……却……离开了真正道路”
  alternative: 弱化为“曾表示相信”或“似乎相信”
  rationale: 希腊文明确使用完成时分词 πεπιστευκότες，原文同时断言其相信与其因摇摆而偏离；译文保留这一神学张力，不替作者加以消解。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言；保留“石头—塔—道路—无路之地”的连续象征图景。将较长的希腊句式适度拆分，使普通读者容易把握因果关系。
