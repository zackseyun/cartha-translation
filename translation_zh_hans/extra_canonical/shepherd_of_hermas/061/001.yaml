- from: 主的天使命人把冠冕拿来。冠冕拿来了，仿佛是用棕榈枝编成的。他给那些交上枝条的人戴上冠冕；他们的枝条长出了嫩枝，也结了一些果实。随后，他让他们进入塔中。
  to: 主的天使命人把冠冕拿来。冠冕就被拿来了，仿佛是用棕榈枝编成的。他给那些交上枝条的男子戴上冠冕；这些枝条长出了嫩枝，也结了一些果实。随后，他送他们进塔里。
  rationale: 修订仅补出原文ἄνδρας所指的“男子”，并以“送他们进塔里”更准确表达遣往塔中的动作；其余措辞保留原译对近似语气、植物意象及象征性“塔”的处理。
