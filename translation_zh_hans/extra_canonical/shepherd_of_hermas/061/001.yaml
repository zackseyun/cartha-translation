    rationale: 原文在此明确称受冠者为男性，宜在不作额外推断的前提下译出。
  - severity: low
    issue: “让他们进入塔中”对ἀπέλυσεν αὐτοὺς εἰς τὸν πύργον的遣送动作略弱。
    rationale: “送他们进塔里”既保留前往塔中的方向，也较清楚体现该动词在此的遣送、放行之意。
