base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/008/003.yaml
  text: 3. “So you will write two little booklets, and you will send one to Clement and one to Grapte. Then Clement will send it to the cities outside, for this has been entrusted to him; but Grapte will admonish the widows and the orphans. But you will read it aloud in this city with the elders who preside over the church.”
translation:
  language: zh_hans
  text: 3. “所以，你要写成两份小册子，一份送给革利免，一份送给革拉普特。革利免会把它送到外地各城，因为这事已经托付给他；革拉普特则要劝诫寡妇和孤儿。至于你，你要同那些主持教会的长老一起，在这城里宣读它。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύο βιβλαρίδια
  choice: 两份小册子
  rationale: βιβλαρίδιον是“小书卷、小册子”的指小形式；上下文要求抄成两份同一文本，译作“两份”比“两本”更清楚。
- source_word: τὰς ἔξω πόλεις
  choice: 外地各城
  rationale: 直译为“外面的城市”，指本城以外的诸城；“外地各城”符合现代汉语且不额外限定地域。
- source_word: νουθετήσει
  choice: 劝诫
  rationale: 兼顾劝导与告诫两层含义，保留牧养性的严肃语气。
- source_word: ἀναγνωσῇ
  choice: 宣读
  rationale: 在群体场合把文本读给人听，并非私人阅读；“宣读”准确体现公开朗读。
- source_word: προϊσταμένων
  choice: 主持
  rationale: 表示站在前面、领导或管理；“主持教会”自然庄重，又不强加特定教阶制度。
theological_decisions:
- issue: 长老与教会治理的关系
  choice: 那些主持教会的长老
  alternative: 教会的主管长老
  rationale: 保留分词对长老职能的描述，不将其技术化为后世某种固定教阶称号。
- issue: μετά所表达的共同参与关系
  choice: 同……长老一起
  alternative: 在……长老面前
  rationale: 希腊文μετά加属格通常表示“与……一起”；译文保留赫尔马与长老共同参与宣读这一语义，同时不进一步断定每位长老是否亲自朗读。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名按早期基督教文献中较常见的音译处理；句法保留原文三方任务分配的清晰对照。
