base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/008/001.yaml
  text: 'And it was revealed to me, brothers, while I was asleep, by a very handsome young man who said to me: “The old woman, from whom you received the little book—who do you think she is?” I said, “The Sibyl.” “You are mistaken,” he says; “she is not.” “Then who is she?” I say. “The Church,” he says. I said to him, “Why then is she old?” “Because,” he says, “she was created first of all; for this reason she is old, and for her sake the world was formed.”'
translation:
  language: zh_hans
  text: 弟兄们，我睡着时，一位容貌极其俊美的青年向我启示，说：“那位老妇人，就是你从她那里领受小书的那一位；你以为她是谁？”我说：“西比拉。”他说：“你错了；不是。”我说：“那么，她是谁？”他说：“教会。”我对他说：“那么，她为什么年老呢？”他说：“因为她在万有之先被造；因此她年老，世界也为了她而被建立。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκαλύφθη δέ μοι
  choice: 向我显现
  rationale: 此处被动表达某事借青年向叙述者揭示；结合梦中人物出现并说话的语境，译为“向我显现”自然，同时保留启示性质。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留早期基督徒群体中的直接称呼；现代中文简洁庄重。
- source_word: νεανίσκου εὐειδεστάτου
  choice: 一位容貌极其俊美的青年
  rationale: εὐειδεστάτου为最高级，突出外貌俊美；“青年”对应νεανίσκος。
- source_word: πρεσβυτέραν
  choice: 老妇人／年老
  rationale: 在人物指称中用“老妇人”，在解释年龄时用“年老”，兼顾同一希腊词的语义关联和中文自然度。
- source_word: βιβλίδιον
  choice: 小书
  rationale: 保留指小形式，不具体化为书卷或册子。
- source_word: Σίβυλλαν
  choice: 西比拉
  rationale: 按希腊罗马传统女预言者的专名音译，不泛化为“女先知”。
- source_word: Ἡ Ἐκκλησία
  choice: 教会
  rationale: ἐκκλησία在此被人格化并明确指信仰共同体，采用通行译名。
- source_word: πάντων πρώτη ἐκτίσθη
  choice: 在万有之先被造
  rationale: 保留“首先”和被造的明确陈述；“万有”可自然涵盖πάντων的宽泛范围。
- source_word: διὰ ταύτην
  choice: 为了她
  rationale: διά加宾格通常表目的或缘故；“为了她”保留教会作为世界形成之目的的强烈表述。
- source_word: ὁ κόσμος κατηρτίσθη
  choice: 世界……被塑成
  rationale: καταρτίζω可指安排、装备、构成或使完备；“被塑成”保留形成与整备的意象，而不把它等同于前句ἐκτίσθη的“被造”。
theological_decisions:
- issue: 教会“在万有之先被造”的前存表述
  choice: 直译为“她在万有之先被造”
  alternative: 解释为“教会在上帝的计划中最先被设立”
  rationale: 原文明确使用ἐκτίσθη，不宜以系统神学解释弱化其字面张力。
- issue: 世界与教会的目的关系
  choice: “世界是为了她而被塑成的”
  alternative: “世界因她而被建立”
  rationale: διὰ ταύτην可能表达“为了她”或“因她”；正文采用更符合宾格结构的目的义，同时不补入原文没有的主体或机制。
- issue: Ἐκκλησία的拟人化
  choice: 保留阴性人物指代“她”
  alternative: 改用中性的“它”
  rationale: 上下文把教会呈现为老妇人，使用“她”可维持叙事意象和语法上的人格化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留问答节奏、现在时引语框架以及教会前存论述中的神学张力，不添加解释性限定。
