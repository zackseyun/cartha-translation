  text: 2. Afterward I saw a vision in my house. The old woman came and asked me whether I had already given the book to the elders. I denied having given it. “You have done well,” she says; “for I have words to add. When, therefore, I complete all the words, through you they will be made known to all the elect.
translation:
  language: zh_hans
  text: 2 后来，我在家中看见一个异象。那位老妇人来了，问我是否已经把那本书交给众长老。我说还没有交。她说：“你做得好，因为我还有话要加上。等我把这一切话都说完，这些话就会借着你使所有蒙拣选的人都知晓。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρασιν
  choice: 异象
  rationale: 指超自然的启示性所见；“异象”既准确又符合现代宗教文本的庄重语体。
- source_word: ἡ πρεσβυτέρα
  choice: 那位老妇人
  rationale: 此处回指前文显现的年长妇人；译作“老妇人”保留人物形象，也避免与本句后面的教会职分“长老”混淆。
- source_word: τὸ βιβλίον
  choice: 那卷书
  rationale: 指前文所述的书面文本；“卷书”比普通的“书”更符合古代文献载体语境，但不强行限定其具体形制。
- source_word: τοῖς πρεσβυτέροις
  choice: 众长老
  rationale: 这里是复数，指教会中的长老；“众”自然体现复数，并与πρεσβυτέρα所指的老妇人清楚区分。
- source_word: ῥήματα
  choice: 话
  rationale: 可指言语、话语或内容；译作“话”保留其宽泛意义，不将其过度术语化。
- source_word: ἀποτελέσω
  choice: 都说完
  rationale: 在补加ῥήματα的语境中表示使这些话达到完成；自然汉语用“把……都说完”表达完成之意。
- source_word: τοῖς ἐκλεκτοῖς πᾶσιν
  choice: 所有蒙拣选的人
  rationale: 保留“被拣选者”的神学表达及全称范围，同时用现代汉语中可理解的名词短语呈现。
theological_decisions:
- issue: “蒙拣选的人”的身份与范围
  choice: 所有蒙拣选的人
  alternative: 所有选民
  rationale: 原文只称“所有被拣选者”，并未在本句界定其确切群体；采用描述性译法可保留开放性，避免“选民”可能带入的体系化教义含义。
- issue: 话语被知晓的施事关系
  choice: 就要借着你让……知道
  alternative: 这些话将由你传给……
  rationale: γνωρισθήσεται是被动形式，原文未明说最终施事者；“借着你让……知道”保留赫马作为媒介，也不擅自明确是谁使其被知晓。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留叙事中的直接引语和启示语境；通过“老妇人”与“长老”的不同措辞消除汉语中的角色混淆，同时不增添原文没有的解释。
