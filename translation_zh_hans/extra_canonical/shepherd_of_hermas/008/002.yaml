  naturalness: 整体庄重自然。将末句改为“这些话就会借着你使所有蒙拣选的人都知晓”，可更清楚地交代被传达的内容，并较自然地保留希腊文的被动表达与“借着你”的媒介关系。
  terminology: “异象”“长老”“蒙拣选的人”均可保留；“老妇人”与“长老”能有效避免汉语中将女性人物和教会长老混同。将“卷书”改为“书”避免对古代载体形制作出不必要的限定。
