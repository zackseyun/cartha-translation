  to: 2 后来，我在家中看见一个异象。那位老妇人来了，问我是否已经把那本书交给众长老。我说还没有交。她说：“你做得好，因为我还有话要加上。等我把这一切话都说完，这些话就会借着你使所有蒙拣选的人都知晓。”
