    它们既是灵和心智，就不需要声音和言语，也不需要施行[什么作为]，以取得自己愿意[成就的事]。相反，从他而出的[那些存在者]依照[父]自身存在的样式，生出他们所愿意的一切。他有子<嗣>；他们所思想、所谈论、所趋向、在其中存立，并向其歌唱颂诗以荣耀的，就是这一位。因为这就是他们生育的能力：他们与自身所源出的那些存在者相似，并与他们共同的互助相合；他们彼此帮助，正如那些非受生者所做的一样。


