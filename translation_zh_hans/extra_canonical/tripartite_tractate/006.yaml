base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/006.yaml
  text: '<...> Just as the wondrous acts of the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they belong to speech, [] both [the wondrous acts] and the qualities are seeds and thoughts of his offspring, living and eternal roots that appear as self-originating offspring. They exist as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, they do not need sound or speech, nor do they need to perform [an act] to obtain what they wish to [have done]. Instead, following the pattern of [the Father’s] own existence, [those] who originate from him beget whatever they wish. And he has child<ren>: the one of whom they think and speak, toward whom they move, in whom they subsist, and to whom they sing hymns to glorify him. For this is their power of procreation, resembling those from whom they originated and consistent with their shared assistance, since they help one another as those who are unbegotten do.


    The Father, in keeping with his exalted place above the Totalities, is unknown and ungraspable. He possesses such greatness and magnitude that, if it were revealed suddenly and immediately, it would destroy all the lofty beings among the aeons who originated from him. Therefore, he restrained his strength and his infinite resources, which constitute his [] being, [remaining] unspeakable and unnameable, exalted above every mind and all speech.


    Yet this is the one who stretched himself out, and what he stretched out formed a foundation, a place, and a dwelling for the universe. One of his names is the One by Whom, because he is the Father of All. Through his labor on behalf of the existing ones, he sowed within them the thought of searching for him. The wealth of their [. . .] is that they grasp that he exists and inquire into what was existent.'
translation:
  language: zh_hans
  text: '<……>正如诸“静默”的奇妙作为是永恒的生育和理智的子嗣，“圣言”的诸种特质也是属灵的流出。因为它们属于言说，[]所以，[奇妙作为]和这些特质都是他子嗣的种子和意念，是有生命、永恒的根；它们显现为仿佛由自身生出的子嗣，并作为心智和属灵的子嗣而存在，使父得荣耀。


    它们既是灵和心智，就不需要声音和言语，也不需要施行[什么作为]，来成就自己想要[成就的事]。相反，从他而出的[那些存在者]依照[父]自身存在的样式，生出他们所愿意的一切。他有子<嗣>；他们所思想、所谈论的，所趋向的，赖以存立的，以及向其歌唱颂诗、使其得荣耀的，正是这一位。因为这就是他们生育的能力：他们与自身所源出的那些存在者相似，也与他们彼此共有的扶助相称；他们互相帮助，正如那些非受生者一样。


    父按照自己高居于“诸总体”之上的地位，是不可知、不可领会的。他具有如此浩大的伟大和广度，以致这伟大若突然、立即显露，就会毁灭诸永世中一切从他而出的崇高存在者。因此，他收敛了自己的力量和构成他[]存在的无穷资源，[仍然]不可言说、不可命名，高于一切心智和一切言语。


    然而，正是这一位伸展开自己；他所伸展出来的，构成了宇宙的根基、所在和居所。他的一个名字是“万有藉以存在者”[a]，因为他是万有之父。他为众存在者劳作，便把寻求他的意念播种在他们里面。他们的财富在于[……]：他们领会到他存在，并探究那原先存在的是什么。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万有藉以存在者”所对应的称号，所据英语见证直译为“藉着其者”（The One by Whom）；其隐含宾语及确切范围有待科普特语复核。
    reason: 说明关系性神名在汉语中补足成分的翻译处理。
  - marker: b
    text: 本段所据抄本在多处残缺。方括号表示残缺、补入或不确定的文字；“<嗣>”保留见证对单复数不确定性的编辑标记；省略号表示缺文。末句“那原先存在的是什么”语义亦可能受缺文影响。
    reason: 向读者交代所有正文文本批判标记及末句的不确定性。
lexical_decisions:
- source_word: the silences
  choice: 诸“静默”
  rationale: 保留该宇宙论语境中可能具人格化或专名性质的复数表达；加引号以避免误读为普通的无声状态。
- source_word: the Word
  choice: “圣言”
  rationale: 译出理智—言说语境中的位格化 Logos，同时用引号提示其术语性质，不将其与后世特定教义解释直接等同。
- source_word: emanations
  choice: 流出
  rationale: 采用较中性的宇宙论术语，保留从源头发出的含义，避免用“受造”消解原文的生成张力。
- source_word: minds
  choice: 心智
  rationale: 比“思想”更适合指具有理智能力或理智性存在的复数实体。
- source_word: beget
  choice: 生出
  rationale: 保留生成和生育意象，又比一律使用“生育”更符合现代汉语句法。
- source_word: subsist
  choice: 赖以存立
  rationale: 表达存在以某一位为根据、在其内持续成立的含义，不额外规定其形上学机制。
- source_word: the Totalities
  choice: “诸总体”
  rationale: 保留复数及术语性，避免简化为普通的“万物”而抹去此文独特的宇宙论层次。
- source_word: aeons
  choice: 永世
  rationale: 采用能够兼具时代、永恒领域或属灵实体含义的传统译法，不武断判定此处仅指时间或位格。
- source_word: the One by Whom
  choice: 万有藉以存在者
  rationale: 把关系性称号译得自然，并根据紧接的“万有之父”补足隐含对象；以脚注说明原文称号本身较简略。
theological_decisions:
- issue: “静默”“圣言”“诸总体”“永世”是否应被明确解释为特定神学体系中的位格或层级
  choice: 保留术语性和可能的人格化，不在正文中进一步界定
  alternative: 直接按某一诺斯替宇宙论体系加上位格、层级或专名解释
  rationale: 现有依据为英语见证，科普特语复核尚待完成；应保存文本自身的模糊性，避免导入特定解释传统。
- issue: 子<嗣>的单复数及其后代词所指
  choice: 保留子<嗣>的编辑标记，并尽量维持后文所指的张力
  alternative: 确定译作单数“儿子”或复数“众子嗣”，并统一改写所有代词
  rationale: 见证文本用 child<ren> 明示文字或编辑上的不确定性，不能静默消除。
- issue: 父收敛力量与其不可知性的关系
  choice: 按文本陈述为主动收敛，以免崇高存在者被显露的伟大毁灭
  alternative: 解释成父本体不可显现，或将“毁灭”弱化为“使之不知所措”
  rationale: 保留原文强烈的神学张力，不以系统神学协调或削弱。
- issue: “从他而出者”的生成是否等同于创造
  choice: 使用“从他而出”“生出”“流出”等文本意象
  alternative: 统一译为“被造者”“创造”
  rationale: 原段反复采用生成和流出语言；改成创造会预先解决文本未明确解决的本体论问题。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。由于科普特语原文复核尚待完成，本稿以所给公共领域英语见证为直接起草依据，并将其视为临时的来源证据层；严格保留缺文、补字和单复数不确定标记。宇宙论术语以引号提示其专门含义，但不附加宗派性解释。
