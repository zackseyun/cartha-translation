lexical_decisions:
- source_word: Totalities / Totality
  choice: 众总有 / 总有
  rationale: 保留该文献特有的整体性、本体论术语。复数用“众总有”，单数用“总有”，避免用“万物”消解原文在单复数间的术语差异。
- source_word: baptism
  choice: 洗礼
  rationale: 采用现代汉语基督教文献中最通行、清楚的对应词。
- source_word: redemption
  choice: 救赎
  rationale: 保留原文宗教性和解救、赎回的语义，不弱化为一般性的“解脱”。
- source_word: profession of faith / professed in faith
  choice: 承认对……的信仰 / 凭信仰所承认
  rationale: 同时体现公开承认与信仰告白，避免仅译作内心相信。
- source_word: confirmation
  choice: 确证
  rationale: 表达使之坚固、得到确认的含义，同时不预设后世某一特定圣礼制度。
- source_word: bridal chamber
  choice: 新房
  rationale: “新房”在现代汉语中自然指婚礼洞房，并保留原文婚姻结合的象征；不扩展解释为特定仪式。
- source_word: deathlessness
  choice: 不死
  rationale: 直译其否定死亡的含义，并保持与“永生”的解释关系。
- source_word: knowledge
  choice: 认识
  rationale: 在涉及人与神合一的语境中，“认识”比抽象的“知识”更能保留关系性与认知性并存的含义。
theological_decisions:
- issue: 父、子、圣灵诸名与“一个名”的关系
  choice: “那些名乃是福音的一个名”
  alternative: 将其解释为一个三一公式或单一神名
  rationale: 保留原文由复数“名”转为单数“名”的张力，不以教义解释替代文本。
- issue: “父（和）神”的不稳定措辞
  choice: 保留圆括号：“父（和）神”
  alternative: 顺译为“父神”或“父，就是神”
  rationale: 见证文本本身标示了连接关系的不确定性，故不擅自确定同位或并列结构。
- issue: 人与父“合一”
  choice: 直译为“与他合一 / 与自己合一”
  alternative: 弱化为“联合”或强化为本体同一
  rationale: 保留神学张力，既不把合一降格为一般关系，也不解释为本体完全同一。
- issue: 洗礼的多重名称
  choice: 保留衣袍、确证、寂静、新房、光、永生等并列称谓
  alternative: 将它们归类为不同仪式或仅作修辞比喻
  rationale: 原文把这些名称共同用于先前所述的洗礼；译文不导入特定宗派的圣礼体系。
- issue: “那些穿上它的人，以及被它穿戴的人”
  choice: 保留主动与被动之间的反常对称
  alternative: 统一改成“被它披戴的人”
  rationale: 原文有意使用互相穿戴的表达，并随即说他们转化成光；不应以常规汉语逻辑抹平其神秘性。
- issue: Totality 的神学身份
  choice: 译作术语“总有”，不直接等同于“神”或“宇宙”
  alternative: 译作“万有”“大全”或“神性圆满”
  rationale: 上下文既有整体性又有超越性，确切所指仍具歧义，应避免预先定性。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。鉴于直接科普特语复核尚待进行，本稿以所给公共领域英文见证为起草依据，并严格保留方括号、尖括号、圆括号和省略号所传达的缺文、补字及不确定性。长句适度分节，但不消除原作反复、悖论和神秘性表达。
