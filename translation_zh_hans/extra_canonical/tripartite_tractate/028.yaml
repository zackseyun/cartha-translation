review_pass:
  verdict: revise
  source_fidelity: 在所提供的英文见证基础上，译稿大体保留了术语、反复及缺损标记；但数处把“告诉他们的事”缩窄为“所听见的事”，把 attainment 译为“实现”，并使“归回／合一”的可能语气与句法关系不够清楚。有关“新房”的译法也较口语化，未充分显出 bridal chamber 的婚姻性象征。由于未提供科普特语逐词材料，本审阅不能替代直接原文校勘。
  naturalness: 整体庄重可读，但“众总有降入其中”“不移动、不动摇”“被它穿戴的人”“这确实就是它的本相”等措辞略显生硬或引入额外色彩。可在不抹平文本陌生性的前提下调整为更自然的现代汉语。
  terminology: “洗礼”“救赎”“确证”“寂静”“永生”“不死”和“总有／众总有”的术语策略可保留。“婚房”比“新房”更准确对应 bridal chamber，且不把它解释成特定仪式。“认识”可继续对应 knowledge。
  issues:
  - severity: medium
    issue: “所听见的事”缩窄了 things told to them 的含义。
    rationale: 英文见证是“被告诉给他们的事”，未限定为听觉接受；应译为“告诉他们的事”。
  - severity: medium
    issue: “人所信之事的实现”不准确对应 attainment of that which someone has believed。
    rationale: attainment 指获得、达成所信之对象，不是该对象自身的“实现”；改为“获得人所信的”可避免改变语义。
  - severity: medium
    issue: “新房”过于日常口语，且弱化 bridal chamber 的专门婚姻空间意象。
    rationale: “婚房”在现代汉语中自然且较准确；不应借此推定某一仪式含义。
  - severity: low
    issue: “不移动”不合现代汉语惯用表达。
    rationale: 此处 unmoving 宜译为“不动”，与“不动摇”并列。
  - severity: low
    issue: “本相”在末句增添了原见证未明说的形上学语气。
    rationale: 原文仅说“This is indeed what it is”；译为“这确实就是它所是的”更贴近且保留其突兀指称。
