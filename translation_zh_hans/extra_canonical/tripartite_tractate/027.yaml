translation:
  language: zh_hans
  text: '父预先认识他，因为在一切尚未存在以先，他就住在父的意念中；父也在那里拥有那些人，正是为了他们，父才将他显明。父把缺乏安置在那仅存留于一段段短暂时期之物上，为要使他的圆满得荣耀。他之所以不为人所认识，促使他显出自己的恩慈——[使人认识他自己]。[a]


    如此，他获得了关于父的知识；这知识彰显了父的仁爱，也启示了他甘美的丰盛，这就是第二重荣耀。[b] 因此，他也这样被显明为无知的成因，尽管他生发知识；这是一种隐秘、无法把握的智慧，他把知识保存在其中，直到终局。那时，万有在寻求父神的过程中将耗尽自己；没有谁能凭自己的智慧或能力探明他。父乐意使他们认识那卓越意念的伟大恩赐，使他们不住地向他献上感谢。他本着自己坚定不移的旨意，永远向那些按他的意愿被判为配得认识父的人显明自己。父按其本性是不可认识的；他却在预知中定意，使他们能够获得知识，以及随知识而来的一切美善，同时也尝到无知及其痛苦。


    这样，他们便会尝到恶事，并能借此操练自己……一段时期，好使他们永远获得[享受美善之事]。[c] 他们任由自己暴露在外，不断遭仇敌弃绝和毁谤，却把这看作一种装饰，是崇高之事奇妙的标记。这样做，是要显明：那些不认识父之人的无知出于他们自己；与此相对，父的能力使他们有可能认识他。


    这知识恰当地称为“关于一切可能意念的知识”，也称为“宝藏”。[d] 若要使知识越发增长，它就是那些起初已蒙认识之人的启示，也是通往合一和那位先存者的道路。[e] 结果，那些在伟大中不断增长的人，正是那些依照（神的）旨意，舍弃了救恩计划中为他们指定之伟大的人，为要使终局如同起初。[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 方括号内的文字是见证文本中的补足；此处底本尚待科普特文复核。
    reason: 保留修复或补足信号，并提醒目前以英译见证为起草依据。
  - marker: b
