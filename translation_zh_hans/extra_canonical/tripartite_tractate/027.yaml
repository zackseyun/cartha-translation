    reason: 避免在中文中静默确定有歧义的代词所指。
  - marker: c
    text: 省略号和方括号表示文本有缺损或译者补足；“享受美善之事”属于补足内容。
    reason: 保存手稿损坏及重建信息。
  - marker: d
    text: “一切可能意念”也可理解为“所有可设想之事”；原表达抽象，确切范围未明。
    reason: 呈现术语的语义开放性。
  - marker: e
    text: “那位先存者”身份未明；此处不将其明确等同于父、子或其他存在。
    reason: 防止导入文本未明说的神学认定。
  - marker: f
    text: 末句在语义上颇为困难：他们“舍弃”所指定的伟大，却因此在伟大中增长。译文保留这一悖论，未擅自改为“获得”或“恢复”。
    reason: 标示可能涉及文本传递、译解或刻意悖论的困难。
lexical_decisions:
- source_word: the Fullness
  choice: 圆满
  rationale: 保留该文献带有术语性质的整体性概念，同时避免擅自用特定宗派或诺斯替体系的专名替换。
- source_word: the Totalities
  choice: 万有
  rationale: 以自然中文表达整体性的复数集合概念；上下文仍保留其近似人格化、能寻求并耗尽自己的张力。
- source_word: knowledge
  choice: 知识／认识
  rationale: 论述性或作为对象、恩赐时译“知识”；涉及认识父或某一对象的关系性表达时译“认识”，使中文通顺而不抹平概念重复。
- source_word: sweetness
  choice: 甘美
  rationale: 保留原文感官性和价值性的隐喻，不弱化为一般的“美善”。
- source_word: excellent thought
  choice: 卓越意念
  rationale: 保留抽象、近乎术语性的表达，不擅自解释为“救赎计划”或“神圣智慧”。
- source_word: union
  choice: 合一
  rationale: 保持抽象神学含义，不说明合一的对象或方式，因为见证文本本身未明说。
- source_word: the pre-existent one
  choice: 那位先存者
  rationale: 保留有定指但身份未明的称谓，不将其直接认定为某一特定人物。
- source_word: plan of salvation
  choice: 救恩计划
  rationale: 采用现代中文读者可理解的正式表达，同时不加入具体救恩论内容。
theological_decisions:
- issue: “他”与“父”的指代转换
  choice: 在容易造成中文语法误读处明确写“父”，其余保留“他”
  alternative: 把所有代词统一解释为父或被显明者
  rationale: 英文见证中的代词链存在真实歧义；中文必须有限度地明示主语才能可读，但不应全盘神学化归一。
- issue: 父被称为“无知的成因”
  choice: 直译并保留与“生发知识”的张力
  alternative: 缓和为“容许无知存在”
  rationale: 原见证明确使用因果措辞；改为许可会加入解释并削弱文本的神学张力。
- issue: 父按本性不可认识却赐下认识
  choice: 并置两项陈述，不作调和说明
  alternative: 解释为只能借启示认识父
  rationale: 虽然上下文可支持这种解释，但正文应保存悖论式表述，不额外系统化。
- issue: 无知的责任与父的安排
  choice: 同时保留父安排缺乏、作为无知成因，以及无知者应自行负责
  alternative: 选择神圣主权或受造者责任其中一面
  rationale: 文本刻意维持两者之间的张力，译文不应消解。
- issue: 舍弃指定的伟大反而在伟大中增长
  choice: 按见证文本保留悖论
  alternative: 把“舍弃”改释为“得到”或“恢复”
  rationale: 原句语义反常但并非可以无依据校正；应通过脚注提示其困难。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。因科普特语源文复核尚未完成，本稿以所给公共领域英文见证为审慎起草基础；保留方括号、省略号、代词歧义和关键神学张力。为避免中文代词链完全失去可读性，仅在必要处以“父”明确主语。
