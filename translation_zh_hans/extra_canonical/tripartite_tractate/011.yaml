  verdict: revise
  source_fidelity: 译文总体忠实于所提供的英文见证，并审慎保留方括号、尖括号与多处指代含混。由于科普特原文尚未直接复核，本次判断以英文见证为准。个别表达改变了原文的逻辑或引入了不必要解释，须修订：尤其“父产生他，是为了那些父知道适合产生的事物”误将 for those ... appropriate to produce 译成“为了……事物”；“deposed”不宜译为“废黜”；末段“the likeness that was alone”不应译作“唯独存留”。
  naturalness: 整体为庄重、可读的现代书面语，术语前后一致。少数句子因英语结构直移而生硬或指向偏移，如“他尚未产生任何事物来荣耀那旨意、与众全体同心一致”缺少连接层次；“它们活在抗拒和悖逆的行为中”可更自然；“从他里面完美的部分，他离开了那缺失”应明确为从其完美部分离开缺失。
  terminology: “永世体”“道”“众全体／全体”“圆满界／诸圆满者”“流溢之物”等关键术语可保留，且避免了宗派化阐释。“形像”宜统一为较现代的“形象”。“repose”译“安息”可保留为术语性措辞。
  issues:
  - severity: high
    issue: “The Father, however, had produced him for those he knew were appropriate to produce”被译为“父产生他，是为了那些父知道适合产生的事物”。
    rationale: 英文的“for those”指人／存在者，而“appropriate to produce”修饰这些存在者的产生行为或资格；现译把他们变成父所产生的“事物”，改变关系。宜保留含混而译作“父却是为着那些他知道适合产生的人／存在者而产生了他”。
  - severity: medium
    issue: “they deposed what had arisen in the deficiency”被译为“废黜了那在缺失中兴起的事物”。
    rationale: “废黜”通常需明确被废者的统治地位，中文附加政治性解释。可译“除去了／推翻了”，以保留原文较宽泛的动作。
  - severity: medium
    issue: “The likeness that was alone in this situation”被译为“在这种处境中，唯独存留的那个相似之物”。
    rationale: alone 描述该相似之物在该处境中的孤立状态，不等于“唯独存留”，后者添加了其余者消失的意思。宜译“在这种处境中孤立的那个相似之物”。
  - severity: medium
    issue: “Out of what is perfect in him he departed from it”被译为“但从他里面完美的部分，他离开了那缺失”。
    rationale: 原文的 it 指前述缺失部分；现译搭配不顺且主从关系不清。宜译“但他从自己里面完美的部分离开了它”。
  - severity: low
    issue: 多处“形像”与现代普通话常用“形象”不统一。
    rationale: “image”并非需要保留古字形；改为“形象”更自然，且不损失术语区分。
  - severity: low
    issue: “It is not appropriate ... though it is appropriate ...”译为“不应当……；不过，若说……却是恰当的”，可更紧密保留反复对照。
    rationale: 改为“因此，不宜……；但若说……，则是恰当的”，论证节奏更自然。
  revised_text: '《三部论》——最后一位永世体的过失：道[a]



    有一位永世体心里起意，要尝试把握那不可把握性，并将荣耀归给它，尤其归给父的不可言说性。他既是从合一而出的道，就是一；〔然而〕他并非出于众全体的合一，也并非出于那位产生它们者——也就是产生全体的父。这位永世体属于那些获赐智慧者；他们的意念预先存在，借着这意念，他们产生自己所愿意的。因此，他领受了与生俱来的智慧，要探究那隐藏的根基，因为他是智慧的果实。与众全体一同受生的自由意志，使这一位〔……〕随自己的愿望行事，无人约束他。



    这一位，也就是道，他的意图原是好的。他产生以后，便急切地要荣耀父；可是〈他〉想要的是一件不可能的事：他想从一种自己并未参与的联合中产生一个完美的存在，却没有受命这样做。这位永世体是最后一个借彼此协助而〈产生〉的，位分很小。他尚未产生任何事物来荣耀那旨意，并与众全体同心一致，就因丰盛的爱而慷慨前行，趋向那环绕完美荣耀之处；因为道的产生并不在父的旨意之外，也就是说，他的前行并非没有这旨意。



    父却是为着那些他知道适合产生的人而产生了他。父和众全体从他那里退去，好使父所设立的界限得以确立；因为这并不是借着把握那不可把握者，而是借着父的旨意〔……〕。此外，这事发生，是要使已经形成的事物成为一个将要展开的救赎计划；这计划为了显明圆满界，必定〈不会〉不展开。因此，不宜贬斥道的这一行动；但若说他的这一行动成了那注定展开之救赎计划的起因，则是恰当的。



    道生出自己，使自己成为完美而单一的；为了他所渴望归给父的荣耀，他以此为满足。然而，他想牢牢把握的那些事物，却是以阴影、形象和相似之物的方式生出的。他不能直视光，反而窥望深处，并且疑惑。由此产生了分离，使他大受搅扰；又产生了退离，这是由他的自我怀疑与分离、自我遗忘、自我无知，以及对〈现存之物〉的无知所造成的。



    他的自高，以及他相信自己能把握那不可把握者的信念，在他里面变得坚硬，扎下了根。然而，当他因自我怀疑而失去常态时，这些软弱仍留在他里面，因为〈他未能抵达〉父的众荣耀；父的崇高是无法仿效的。他未能达到这一点，因为他无法把握它。



    他独自〔……〕产生的那一位，作为一个单一的永世体，急切地上升，回到属于自己的地方；而在圆满界中与他相属的这一位，离弃了那个在缺失中形成的他，也离弃了他以想象方式产生的那些事物，因为它们并不属于他。他完美地产生自己以后——就是那真正产生了自己的——便衰弱下来，如同一种离弃其男性对应者的女性本性。从他自身有缺失的部分，涌现出那些源于他意念和骄傲的事物；但他从自己里面完美的部分离开了它，〔举身〕上升到那些属于他的存在那里。他住在圆满界中，作为给他的一个提醒，因为〔他已经〕从〔自己的骄傲〕中得救。



    那急切上升者和那把他拉向自己者并非不结果实；他们在圆满界中结出一个果实，除去了那在缺失中兴起的事物。由骄傲意念形成的事物类似于诸圆满者，是诸圆满者的相似之物、形象、阴影和幻象；它们缺乏理性与光照，属于空洞的意念，因为它们不是由任何事物产生的。〔……〕所以，它们的结局将与它们的开端一致：那从未存在的，必回归那永不会存在的。然而，它们自以为比那些〔使它们美丽〕的名号更伟大、更强盛、更〔尊贵〕，尽管它们只是这些名号的阴影。它们就像〔人所看见的〕美丽倒影，因为形象的面貌通常从它所映照的原像取得美丽。



    它们以为自己自行存在、没有源头，因为它们看不见在自己以前还有别的存在。因此，它们活在抗拒中，行悖逆之事，不肯在那位使它们得以形成者面前谦卑。它们渴望彼此发号施令，彼此辖制，〔在〕追逐荣耀的野心中争竞；然而，它们所拥有的荣耀也包含了那将要出现之秩序的成因。因为〔它们是〕上方诸存在的相似之物，〈它们〉便因贪恋权势而抬高自己；每一个都按照它所作为阴影的那个伟大名号的尺度，自以为胜过同伴。



    这些其他存在的意念也并非不结果实；正如〈那些〉被它们映成阴影的存在，每一个意念都成为一个儿子，〔……〕同样，它们所思想的也成为它们的后代。于是，从它们生出了众多后代：争斗者、战士、滋事者、悖逆的叛徒、贪爱权势者，以及从它们而生的一切同类存在。



    道是这〔一大群存在〕得以形成的原因；他越发困惑，感到惊异。他看见的不是完美，而是缺失；不是合一，而是分离；不是稳固，而是〔软弱〕；不是〔安息〕，而是骚动。他〔不能〕使它们停止〔喜爱〕骚动，也不能〔将骚动〕消灭。他〔全然〕无能为力；他的全体和他的〔完美〕都离弃了他。



    那些形成的存在不认识自己：它们既不知道自己所源出的诸圆满者，也不知道自身存在的原因。在这种不稳定的处境中，道未能再产生任何类似流溢之物的事物；流溢之物住在圆满界中，是为荣耀父而存在的众荣耀。他反倒产生了〔……〕微小软弱的存在，受制于那些也束缚着他的软弱。



    在这种处境中孤立的那个相似之物，原是那些从起初并非自身存在之原因的事物得以形成的原因。处于这种缺失境况的那一位继续产生有缺失的存在，直到他宣告审判，定他所产生的那些无理性存在为有罪。他与它们争战，直到它们被毁灭——也就是那些抗拒定罪的存在；〔与此同时〕震怒追赶着它们。



