base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/023.yaml
  text: 'The prophets, however, spoke nothing by their own will. Instead, each of them spoke about the things he saw and heard concerning the proclamation of the Savior. What he proclaimed—and the central theme of their proclamation—was what each one said about the coming of the Savior: that it would arrive. At times the prophets speak about it as though he has yet to be born, while at other times it is as though the Savior speaks through their mouths, saying that the Savior will arrive and show favor to those who did not know him. Accordingly, they did not all say everything in the same way. Rather, through the power given to each one to speak about him and about the place he saw, each thought that the Savior would be born from that place and would come from there. Accordingly, none of them knew where he would come from or who would beget him. They were worthy to speak only of this: that he would be born and would suffer. As for his pre-existence and his eternal existence as unbegotten,
    incapable of suffering <…> not from the Word, who came into being in flesh, [] it never entered their thoughts.


    And this is the message they were inspired to deliver concerning his flesh that would appear. It is said that his birth was like the birth of all of them, but that, above all else, it was from the spiritual Word, the cause of the things that have come into being. The one from whom the Savior received his flesh did indeed beget him in the form of a seed, at the revelation of the light, in agreement with the promised word of his revelation, <being> indeed the state of <a> seed of <what was>, though begotten last. However, the one whom the Father ordained to manifest salvation through him, who is the fulfillment of the promise, when he descended into life, he was given every means necessary for his descent. His Father is one, the only one who is truly a father to him: the unseen and unknowable one, ungraspable by nature, who alone is God and who, by his will and his gift, has granted that he could be seen, known, and grasped.'
translation:
  language: zh_hans
  text: '然而，众先知并不是凭自己的意愿说话；相反，他们各人所说的，都是自己就救主的宣告所看见、所听见的事。他所宣告的，也是他们宣告的中心主题，就是各人论到救主来临时所说的：这来临必会到来。有时，众先知说起这事，仿佛他尚未出生；另一些时候，却仿佛救主借着他们的口说话，说救主将要到来，并恩待那些不认识他的人。因此，他们并不是人人都用同样的方式说出一切。各人照着所得的能力，谈论他和自己所看见的地方，便认为救主会从那地方出生，也会从那里而来。因此，他们没有一人知道他会从哪里来，也不知道谁会生他。他们只配说出这一点：他将要出生，也将要受苦。至于他在出生以前就已存在，以及他作为非受生者、不受苦者而永远存在，〈……〉并非出于那成为肉身而产生的道，〔〕这些事从未进入他们的思想。[a]


    这就是他们受感动所传达的信息，论到他那将要显现的肉身。据说，他的出生与他们众人的出生相同；但最重要的是，这肉身出于属灵的道，就是一切已生成之物的成因。救主从他那里领受肉身的那一位，确实以种子的形态生了他；这发生在光显现之时，与有关他显现的应许之言相符，〈确实处于〈原有之物〉的〈一个〉种子的状态〉，虽是最后才受生。[b]然而，父所指定、要借着他彰显救恩的那一位，就是应许的成全；当他降入生命时，凡他下降所必需的一切，都赐给了他。他的父只有一位，唯有这一位真正是他的父：那看不见、不可知、本性上无法把握的一位；唯有他是上帝。他凭自己的旨意和恩赐，使自己能够被看见、被认识、被把握。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句传本有残缺；〈……〉表示缺文，〔〕表示抄本或校勘所标示的空缺。句法和“并非出于……”的确切关联不明，译文未加调和。
    reason: 保存手稿损坏和句法不确定性，避免制造确定的基督论陈述。
  - marker: b
    text: 尖括号内的词语属于校补或不确定的复原；“原有之物的一个种子的状态”在现有见证中意义晦涩。
    reason: 明示文本复原状态，并保留种子段落的真实歧义。
  - marker: c
    text: “使自己”所对应的代词，按当前句法理解为前述那位父、即上帝；源语复核仍可能影响这一判断。
    reason: 记录重要代词所指的翻译决定及其暂定性质。
lexical_decisions:
- source_word: Savior
  choice: 救主
  rationale: 采用现代汉语宗教文献中通行而庄重的对应词，并保持全文一致。
- source_word: proclamation
  choice: 宣告
  rationale: 既可指所宣讲的信息，也保留公开宣布的语气；不窄化为特定礼仪或教会术语。
- source_word: unbegotten
  choice: 非受生者
  rationale: 直译其否定性形上含义，避免译作“自有”而额外引入解释。
- source_word: impassible
  choice: 不受苦者
  rationale: 依本段与“将要受苦”的对照处理，保留神学张力，不扩展为泛指“不可改变”。
- source_word: Word
  choice: 道
  rationale: “道”是 Logos/Word 在现代中文神学文本中的常用对应；此处保留其位格或宇宙论含义的开放性。
- source_word: spiritual Word
  choice: 属灵的道
  rationale: 保留 spiritual 与 Word 的修饰关系，不擅自解释为圣灵或理性原则。
- source_word: flesh
  choice: 肉身
  rationale: 比“身体”更能保留原文在人性、显现与受苦语境中的神学意味。
- source_word: beget / begotten
  choice: 生／受生
  rationale: 按主被动分别翻译，以保留父源关系及“非受生”与“受生”的术语对照。
- source_word: grasped
  choice: 被把握
  rationale: 与“被看见、被认识”并列，兼顾认知和领会的含义，不译作纯粹物理性的“抓住”。
theological_decisions:
- issue: 先知知识的限度
  choice: 保留“只配说出”及他们不知道救主来源和生者的表述
  alternative: 改写为先知仅获准逐步启示
  rationale: 原文强调能力与认识的局限；不以渐进启示等体系化概念替代其措辞。
- issue: 救主的先存、非受生与受苦之间的张力
  choice: 照原文并列“出生以前就已存在”“非受生者”“将要受苦”与“不受苦者”
  alternative: 把不同表述调和为神性不受苦、人性受苦
  rationale: 见证文本本身留下张力且附近有残缺；译文不代替作者完成系统调和。
- issue: “成为肉身而产生的道”残句的归属
  choice: 按现有英文见证保留否定结构及残缺标记
  alternative: 重排句法，使“非受生、不受苦”明确修饰道或救主
  rationale: 底本残缺且科普特语复核尚待进行，不能据神学预设确定句法。
- issue: 救主肉身的来源与生育者
  choice: 使用“从他那里领受肉身的那一位”保持所指含混
  alternative: 明确认定为人间父亲、母亲或属灵之道
  rationale: 现有见证的代词及关系并不足以安全确定身份。
- issue: 末句上帝使自己可被认识
  choice: 将“he”理解为指向前述唯一的父／上帝，译为“使自己”
  alternative: 理解为使救主被看见、认识、把握
  rationale: 最近先行词和句法链均指那位不可见、不可知的上帝；但因源语尚未复核，脚注提示代词解释空间。
translation_notes:
  register: 采用现代、庄重而可读的简体中文，尽量维持古代论述的抽象性与重复结构。因所提供的起草依据是公共领域英文见证，科普特语原文尚待直接复核，本稿为源语复核前的出版级暂定稿；所有尖括号、方括号与省略号均按见证保留，不将残缺处静默补全。
