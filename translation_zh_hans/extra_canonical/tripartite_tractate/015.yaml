lexical_decisions:
- source_word: word
  choice: 话语
  rationale: 保留原文可能兼具言说、信息与实体化“道/话语”的语义张力，避免直接译为带有更固定神学含义的“道”。
- source_word: knowledge
  choice: 知识
  rationale: 采用直译，保留该文献中“知识”可能具有启示性和救恩性内涵的开放性。
- source_word: beings of memory
  choice: 记忆一类的存在者
  rationale: 保留类别名称“记忆”，并补出“存在者”以使现代汉语可读；不擅自确定其宇宙论身份。
- source_word: Little One
  choice: 小者
  rationale: 作为称号处理并加引号，保留单数形式及其含义的不确定性。
- source_word: Exalted One
  choice: 至高者
  rationale: 以庄重自然的称号表达其超越地位，不进一步认定具体神学身份。
- source_word: those of the likeness
  choice: 肖像一类的存在者
  rationale: “likeness”可能指相似、形像或某一宇宙论类别；选“肖像”以区别一般的“相似者”，同时用脚注提示不确定性。
- source_word: orders
  choice: 等级
  rationale: 表达有组织的存在类别或层级，不将其具体化为宗教教阶。
- source_word: repose
  choice: 安息
  rationale: 保留其超越普通休息的宗教哲学意味，同时符合庄重汉语。
- source_word: plan of salvation
  choice: 救恩计划
  rationale: 忠实表达原见证文本的救赎安排概念，不增添其机制或教派解释。
theological_decisions:
- issue: 反复出现的代词所指
  choice: 保留“他／那人／他们”的代词链，只在汉语必要处用“那人”帮助区分
  alternative: 将各代词明确替换为“圣子”、造物主或特定宇宙论群体名称
  rationale: 现有英语见证本身未充分确定所有先行词，且科普特语复核尚待进行；不应凭神学体系消除真实歧义。
- issue: “话语”的神学身份
  choice: 译作“一个话语”
  alternative: 译作“道”或认定为基督
  rationale: 上下文说其将成为知识，但没有足够依据把该词直接等同于《约翰福音》的“道”。
- issue: “配统治黑暗”的悖论性表达
  choice: 保留“被判定配统治”
  alternative: 改写为“被惩罚去统治”或“获准管理”
  rationale: 原表达把价值判断与黑暗统治并置，可能含反讽或宇宙论上的适配；译文保留这种张力。
- issue: 显现方式的差异
  choice: 保留内在、渐进的显现与外在、瞬间的显现之对照
  alternative: 解释为得救者与受审判者之间已确定的教义区分
  rationale: 文本强调不同对象所经历的启示差异，但不宜超出段落明确陈述建立系统教义。
