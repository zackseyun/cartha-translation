  terminology: 保留“话语”“知识”“至高者”“安息”“救恩计划”等审慎、非宗派化选择。“形像一类的存在者”较“肖像一类的存在者”更适合对应 likeness，并仍避免断定其具体宇宙论身份。“阶序”比“等级”更适合 orders 在此的类别／秩序含义。
