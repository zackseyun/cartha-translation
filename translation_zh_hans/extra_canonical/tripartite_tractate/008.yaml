review_pass:
  verdict: revise
  source_fidelity: 整体上忠实保留了见证的术语、反复修辞、校勘符号与未决的形上学张力；但数处关系和句法需要校正。尤其第三段把“产生万有者”所带的“初熟果子／永恒者”描述误归于“颂赞”，末段“天使……came into being”的译法也不够准确。另有少数措辞将原文的对象关系或“创造”弱化了。科普特原文尚未直接校勘，以下修订以所供英文见证为限。
  naturalness: 原稿总体庄重可读，但“显明他与自己同等”“在世上形成”“他施展权能的所在”等表达不够自然，或使指向关系变得含混。修订在不消解原文含混的范围内改善中文句法。
  terminology: 保留“万有／作为万有者”“永世”“圆满”“流溢”“生育”“掌权者”等既定术语。将“creates”明确译为“创造”，并维持“begetting／procreate”与“创造”之间的区别；“self-equality”译为“他自身的同等性”，避免中文误解为“他与自己同等”这一同义反复。
  issues:
  - severity: high
    issue: 第三段将“初熟果子和一个永恒者”归属为“这颂赞”的谓语补足。
    rationale: 英文见证的限定语紧接“the one who produced the Totalities”，较自然的处理是它描述该一位如何产生万有，或至少须保持其与“产生者”的连接；原译“这颂赞是……”改变了句法关系。
  - severity: medium
    issue: 末段“天使……在世上形成”不自然且未准确表达“came into being”。
    rationale: 此处关系代词指天使；应译为“天使……在世上产生／出现”，而非“形成”。
  - severity: medium
    issue: “他使永世成为根源、泉源和父”弱化了“he creates the aeons as…”。
    rationale: 见证在本段区分“生育／流溢”与“创造”；此处宜明确译出“创造”。
  - severity: medium
    issue: “这正是他所喜爱的，也是他施展权能的所在”将“what he exerts power over”的对象关系改为地点性表达。
    rationale: 应保留父所爱、并对其施行权能的对象关系。
  - severity: low
    issue: “显明他与自己同等”在现代汉语中不自然。
    rationale: “self-equality”应译作“他自身的同等性”，既保留抽象性，也避免不必要的同义反复。
  revised_text: '他并没有一下子向万有显明各种不同的特质，也没有向那些从他而出的显明他自身的同等性。所有从他而出的，<就是>永世的永世，[] 因为他们[是]<他>那生育本性的流溢和后裔，所以他们也凭着自己的生育本性，为父的荣耀而<生育>；父正是设立他们的本因。正如我们先前所说，他创造永世，使之成为根源、泉源和父；他们所荣耀的正是他，因为他拥有知识和智慧，也因为万有认识到，他们源于那作为万有者的知识和智慧。


    如果万有中的各位只照每个永世自身的<能力>献上荣耀，他们所产生的不过是那作为万有者之父的黯淡映像。因此，他们在荣耀之歌中，并在那使他们从中而出的合一之力中，彼此交融、调和，成为一体。他们从圆满的会众中向父献上配得的荣耀，形成一个既单一又多重的形象；因为这形象是为荣耀那独一者而产生的，也因为他们趋近那本身就是万有者的一位。


    这是[永世们]对那一位的颂赞；他把万有产生为众不朽者的初熟果子和一个永恒者。因为他们从活的永世而出，又因那完美而圆满者而成为完美、圆满，所以，那些以完美方式献上荣耀者的圆满、完美状态，因着彼此相通而保持完整；正如完美的父受荣耀时，也听见那荣耀[他的]颂赞，以显明他们也正是他所是的。


    他们所得第二重尊荣的缘由，是他们认识了那份恩赐以后，父向他们回赐之物；这恩赐使他们能够彼此结果，为父而行。结果，正如他们为了父而<在荣耀中被生出>，他们也在献上荣耀时完美地显现出来。


    他们成为第三重荣耀的父；这重荣耀与那同他们一起被生出的自由和能力相称，使他们既能一同献上荣耀，也能各自按意愿献上荣耀。他们就是第一重和第二重荣耀，因此这两重都是完美而圆满的，因为它们显明了完美而圆满的父，也显明了那些从对完美者的荣耀中产生的完美之物。然而，第三重荣耀的果实包含每个永世的意愿，也包含父的每一种特质和能力。这果实之所以完整而完美，是因为永世们愿意并能够献给父的荣耀，既出于他们的一致，也由各自献上。这正是他所爱的，也是他施展权能于其上的，因为父藉此得着荣耀。因此，他们是心思中的心思，显明为话语中的话语、长老中的长老、层级中的层级，彼此高升，互有超越。


    每个献上荣耀者都有自己的位置、尊荣、居所和安息；这些构成他所献的荣耀。所有荣耀父的都有永恒的生育；他们彼此帮助而生育，因为这些流溢无穷无尽、不可测量；对于那些从父而出的，父丝毫不因他们生出与他同等或相似者而嫉妒，因为他存在于万有之中，不断生育并显明自己。他愿意使谁成为父，就使谁成为父，而他确实是那人的父；他愿意使谁成为神，就使谁成为神，而他确实是那人的神；他使他们成为万有，<对他们而言>，他就是万有。[] 严格说来，一切伟大的名号都保留在那里；天使也分享这些名号——他们与掌权者一同在世上产生，尽管他们与永恒者毫无相似之处。[a]'
