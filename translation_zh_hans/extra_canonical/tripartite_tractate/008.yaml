  footnotes:
  - marker: a
    text: 本译文暂据所提供的公共领域英文见证拟定，科普特原文尚待直接校勘。原见证中的方括号表示残缺或编者补充，尖括号表示校订者恢复的文字；空方括号表示原稿有缺损。
    reason: 交代底本限制，并使正文中的校勘符号对普通读者可理解。
lexical_decisions:
- source_word: Totalities / Totality
  choice: 万有／作为万有者
  rationale: 保留文本中集合性的“万有”与指称父为总体者之间的张力；必要处用“作为万有者”避免误读为单纯抽象总和。
- source_word: aeons
  choice: 永世
  rationale: 采用可理解而又保留该文献宇宙论术语色彩的译法，不将其解释性改写为“灵体”或“时代”。
- source_word: Fullness
  choice: 圆满
  rationale: 保留其既可表示完满状态、又可能作为技术性领域名称的双重意味。
- source_word: emanations
  choice: 流溢
  rationale: 表达从本源而出的过程，同时避免用“创造物”抹平生出、流出与创造之间的区别。
- source_word: procreative nature / procreate
  choice: 生育本性／生育
  rationale: 维持原段反复使用的生殖隐喻及其神学张力。
- source_word: archons
  choice: 掌权者
  rationale: 以一般读者可懂的词表达统治性灵界存在，不额外导入特定宗派体系。
- source_word: words of words
  choice: 话语中的话语
  rationale: 保留原文层叠式最高级或层级表达，不武断确定其是否专指人格化的“道”。
theological_decisions:
- issue: 父与从他而出者之间的同等或相似
  choice: 直译“生出与他同等或相似者”，不加限制语
  alternative: 解释为仅在属性、形象或位格层面相似
  rationale: 原见证本身保留强烈的同等／相似表述；译文不应预先以某一教义体系化解。
- issue: “他们也正是他所是的”所表达的同一性
  choice: 保留本体性语气
  alternative: 弱化为“他们也像他一样”
  rationale: 见证明确使用“are what he is”；弱化会消除文本刻意形成的神学张力。
- issue: “使谁成为神”中的神性称谓
  choice: 译作“神”
  alternative: 译作“神明”或“具有神性者”
  rationale: 保持原文父、神与万有的平行句法，不将其多神化或属性化解释强加于文本。
- issue: 三重荣耀的关系
  choice: 保留第一、第二、第三重荣耀的区分而不补足体系说明
  alternative: 将三者解释成固定的宇宙生成阶段
  rationale: 本段信息不足以安全重构完整体系，故保存顺序和含混处。
translation_notes:
  register: 采用现代、庄重而可读的普通话。保留“永世、圆满、流溢”等关键术语及原文反复、层叠的修辞；在不消除歧义的前提下调整长句，使中文脉络清楚。删除见证中的稿页编号，但保留所有具有文本批判意义的方括号与尖括号。
