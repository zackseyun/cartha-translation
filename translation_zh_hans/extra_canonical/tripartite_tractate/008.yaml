translation:
  language: zh_hans
  text: '他并没有一下子向万有显明各种不同的特质，也没有向那些从他而出的显明他与自己同等。所有从他而出的，<就是>永世中的永世，[] 因为他们[是]<他>那生育本性的流溢和后裔，所以他们也凭自己生育的本性，为父的荣耀而<生育>；父正是那设立他们的本因。正如我们先前所说，他使永世成为根源、泉源和父，而他们所荣耀的正是他，因为他拥有知识和智慧，也因为万有认识到，他们源于那作为万有者的知识和智慧。


    如果万有中的各位只照每个永世自身的<能力>献上荣耀，他们所产生的不过是那作为万有者之父的模糊映像。因此，他们在荣耀之歌中，并在那使他们从中而出的合一之力中，彼此交融、调和，成为一体。他们从圆满的会众中向父献上配得的荣耀，形成一个既单一又多重的形象；因为这形象是为荣耀那独一者而产生的，也因为他们趋近那本身就是万有者的一位。


    这是[永世们]献给那产生万有者的颂赞；这颂赞是众不朽者的初熟果子，也是永恒的。因为他们从活的永世而出，又因那完美而圆满者成为完美而圆满，所以，那些以完美方式献上荣耀者的圆满完美状态，因着彼此相通而保持完整；就像完美的父受荣耀时，也听见那荣耀[他的]颂赞，从而显明他们也正是他所是的。


    他们所得第二重尊荣的缘由，是他们认识了那份恩赐以后，父向他们回赐之物；这恩赐使他们能彼此结果，为父献上。结果，正如他们为了父而<在荣耀中被生出>，他们也在献上荣耀时完美地显现出来。


    他们成为第三重荣耀的父；这重荣耀与那同他们一起被生出的自由和能力相称，使他们既能一同献上荣耀，也能各自按意愿献上荣耀。他们就是第一重和第二重荣耀，因此这两重都是完美而圆满的，因为它们显明了完美而圆满的父，也显明了那些从对完美者的荣耀中产生的完美之物。然而，第三重荣耀的果实包含每个永世的意愿，也包含父的每一种特质和能力。这果实之所以完整而完美，是因为永世们愿意并能够献给父的荣耀，既出于他们的一致，也由各自献上。这正是他所喜爱的，也是他施展权能的所在，因为父藉此得着荣耀。因此，他们是心思中的心思，显明为话语中的话语、长老中的长老、层级中的层级，彼此高升，互有超越。


    每个献上荣耀者都有自己的位置、尊荣、居所和安息，这一切构成他所献的荣耀。所有荣耀父的都有永恒的生育；他们彼此帮助而生育，因为这些流溢无穷无尽、不可测量；对于那些从父而出的，父丝毫不因他们生出与他同等或相似者而嫉妒，因为他存在于万有之中，不断生育并显明自己。他愿意使谁成为父，就使谁成为父，而他确实是那人的父；他愿意使谁成为神，就使谁成为神，而他确实是那人的神；他使他们成为万有，<对他们而言>，他就是万有。[] 严格说来，一切伟大的名号都保留在那里；天使也分享这些名号——他们与掌权者一同在世上形成，尽管他们与永恒者毫无相似之处。[a]'
