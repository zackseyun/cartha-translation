review_pass:
  verdict: revise
  source_fidelity: 整体上忠实保留了英文见证的术语网络、重复修辞、校勘符号和未决的宇宙论／神学张力。然数处关键关系需要收紧：首句“self-equality”不宜译成“他与自己同等”；“众不朽者的初熟果子，也是永恒的”应保留其对“那一位”的并列指称；“彼此结果”须明确“在彼此之间”；并宜使“由……并由各自”及末句天使的关系从句更清楚。科普特原文尚未直接校勘，以下仅据所供英文见证作保守修订。
  naturalness: 原译庄重且大体通顺，但“万有中的各位”“显明他与自己同等”“父正是那设立他们的本因”等表达略显生硬或可能误解。修订采用“万有中的那些者”“显明他自身的同等性”“作为设立他们的原因”等较自然的现代书面语，同时不简化原文的技术性重复。
  terminology: 保留“万有／作为万有者”“永世”“圆满”“流溢”“生育／生出”“掌权者”等既定选择。将“后裔”调整为“子嗣”以配合“emanations and offspring”，并保留“话语中的话语”等层叠措辞，不将其教义化。
  issues:
  - severity: medium
    issue: “nor did he reveal his self-equality”译为“也没有向那些从他而出的显明他与自己同等”。
    rationale: “他与自己同等”在汉语中语义失当，且遗漏“self-equality”作为其自身属性／同等性的对象。应译为“也没有向那些从他而出的显明他自身的同等性”，以保留原见证的含混与强调。
  - severity: medium
    issue: “a first-fruit of the immortals and an eternal one”译为“众不朽者的初熟果子，也是永恒的”。
    rationale: 原文的“an eternal one”可与“the one who produced”并列指称；仅译作抽象的“永恒的”削弱该指称。修订为“作为不朽者的初熟果子和一位永恒者”。
  - severity: low
    issue: “enabled them to bear fruit among each other for the Father”译为“使他们能彼此结果，为父献上”。
    rationale: “among each other”应保留为“在彼此之间”，而“for the Father”直接修饰结果的目的，不必添加“献上”这一原文未明说的宾语。
  - severity: low
    issue: 末句“those the angels share, who came into being ... together with the archons”的关系指向略不清。
    rationale: 应明确是天使与掌权者一同在世上出现，而天使分享那些名号；这不涉及对其性质的额外解释。
  revised_text: '他并没有一下子向万有显明各种不同的特质，也没有向那些从他而出的显明他自身的同等性。所有从他而出的，<就是>永世中的永世，[] 因为他们[是]<他>生育本性的流溢和子嗣，所以他们也凭着自己生育的本性，为父的荣耀而<生育>；父正是作为设立他们的原因。正如我们先前所说，他使永世成为根源、泉源和父，而他们所荣耀的正是他，因为他拥有知识和智慧，也因为万有认识到，他们源于那作为万有者的知识和智慧。


    如果万有中的那些者只照每个永世自身的<能力>献上荣耀，他们所产生的不过是那作为万有者之父的模糊映像。因此，他们在荣耀之歌中，并在那使他们从中而出的合一之力中，彼此交融、调和，成为一体。他们从圆满的会众中向父献上配得的荣耀，形成一个既单一又多重的形象；因为这形象是为荣耀那独一者而产生的，也因为他们趋近那本身就是万有者的一位。


    这是[永世们]献给那产生万有者的颂赞，作为不朽者的初熟果子和一位永恒者。因为他们从活的永世而出，并因那完美而圆满者而成为完美、圆满，所以，那些以完美方式献上荣耀者的圆满而完美的状态，因着彼此相通而得以保持完整；就像完美的父受荣耀时，也听见那荣耀[他、为要]显明他们也正是他所是的颂赞。


    他们所得第二重尊荣的缘由，是他们认识了那份恩赐以后，父向他们回赐之物；这恩赐使他们能在彼此之间为父结果。结果，正如他们为了父而<在荣耀中被生出>，他们也在献上荣耀时完美地显现出来。


    他们是第三重荣耀的父；这重荣耀与那同他们一起被生出的自由和能力相称，赋予他们一同献上荣耀、也各自按意愿献上荣耀的能力。他们就是第一重和第二重荣耀，因此这两重都是完美而圆满的，因为它们显明了完美而圆满的父，也显明了那些从对完美者的荣耀中产生的完美之物。然而，第三重荣耀的果实包含每个永世的意愿，也包含父的每一种特质和能力。这果实之所以完整而完美，是因为永世们愿意并能够献给父的荣耀，出于他们的一致，也由各自献上。这正是他所喜爱的，也是他施展权能的所在，因为父藉此得着荣耀。因此，他们是心思中的心思，被发现为话语中的话语、长老中的长老、层级中的层级，彼此高升，互有超越。


    每个献上荣耀者都有自己的位置、尊荣、居所和安息；这一切构成他所献的荣耀。所有荣耀父的都有永恒的生出；他们彼此帮助而生出，因为这些流溢无穷无尽、不可测量；对于那些从父而出的，父丝毫不因他们生出与他同等或相似者而嫉妒，因为他存在于万有之中，不断生出并显明自己。他愿意使谁成为父，就使谁成为父，而他确实是那人的父；他愿意使谁成为神，就使谁成为神，而他确实是那人的神；他使他们成为万有，<对他们而言>，他就是万有。[] 严格说来，一切伟大的名号都保留在那里；天使也分享这些名号——天使与掌权者一同在世上出现，尽管他们与永恒者毫无相似之处。[a]'
