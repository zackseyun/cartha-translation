lexical_decisions:
- source_word: Word
  choice: 圣言
  rationale: 将其作为具有位格性的神学称谓处理，同时保留“言语／理性原则”的关联；不用“话语”，以免削弱其专名性质。
- source_word: Fullness
  choice: 圆满
  rationale: 保留该文献中兼具“完全状态”与实体化领域意味的术语张力，不直接音译或套用特定宗派术语。
- source_word: Repose
  choice: 安息
  rationale: 采用庄重而通行的汉语神学词，保留其作为位格化或领域化概念的可能性。
- source_word: He Who Is
  choice: 那位存在者
  rationale: 体现称号的实体性与强调语气，不把它径直等同于某一传统神名。
- source_word: aeons
  choice: 永世
  rationale: 使用能够表达超时间实体／时代双重含义的传统汉语译法；“众永世”保留复数及其可能的位格性。
- source_word: Totalities
  choice: 万有
  rationale: 作为集合性宇宙论称谓处理，保留原文大写所暗示的术语性质。
- source_word: likeness / memory
  choice: 仿像／记忆
  rationale: 两者可能是技术性类别，但现有见证不足以确定专门含义，故采取较形式对应的译法，不作解释性改写。
- source_word: visitation
  choice: 眷顾
  rationale: 兼顾“来访”和带来恩惠的探访含义；同句的 visiting 另译作“前来”，避免汉语重复生硬。
- source_word: stature
  choice: 身量
  rationale: 保留具象尺度与崇高地位之间的歧义，不简化为单纯的“荣耀”或“能力”。
theological_decisions:
- issue: 圣言的“缺欠”及其后来达到圆满
  choice: 直译为“有缺欠的圣言”及“他的圆满便产生了”
  alternative: 将“圣言”解释成堕落的理性、造物主或其他特定诺斯替位格
  rationale: 原段自身保留了该角色的宇宙论张力；译文不以任何后起体系预先界定其身份。
- issue: “父与和谐的面容”中属格关系
  choice: 保留并列属格结构
  alternative: 解释为“父的面容，也是和谐的面容”或“父那和谐的面容”
  rationale: 现有英文见证不能排除多种句法关系，因此不静默消除歧义。
- issue: 末段代词 it 的指代
  choice: 按最近且合乎语境的“完全”处理为“那完全／与之”
  alternative: 指向父、光、应许或另一实体
  rationale: 英语见证的指代并不完全明确；正文采用最顺畅的近指理解，同时避免进一步教义化。
- issue: “众永世的决议”与“他们”的关系
  choice: 保留原句层次及代词，不明确重构群体身份
  alternative: 把“他们”明确指定为种子、记忆者或显现者
  rationale: 底本证据尚未完成科普特语复核，不宜凭推断锁定所指。
translation_notes:
  register: 采用现代、庄重而可读的简体中文，尽量让普通读者能够顺读，同时保留“圆满、安息、永世、万有、仿像、记忆”等宇宙论术语的陌生感。当前仅有公共领域英文见证可供起草，尚未完成科普特语原文复核，因此本稿属于来源受限的暂定出版草案；对残缺、补文、代词和技术类别均避免过度确定。
