base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/019.yaml
  text: 'The beings of memory who are located outside are humble, preserving the representation of the Fullness, especially because they share in the names that adorn them. Conversion results in humility toward the beings of memory, and humility toward them is also the law of judgment, which consists of condemnation and anger.


    Humility toward them is also the power that separates those who fall beneath them and sends them far away. It prevents them [] [from] spreading over the beings of memory and conversion. This power consists of fear, confusion, oblivion, bewilderment, ignorance, and the things that have come into being through imagination, as a likeness does. In addition, exalted names are bestowed on these things that were actually lowly. Knowledge <is lacking for those> who were produced from them through pride, lust for control, disobedience, and falsity.


    He bestowed a name on each <of> them, because the two orders exist in a name. Those who belong to memory and representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to the prideful thought and the likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word established each in its own order—namely, the images, the representations, and the likenesses—he kept the aeon of the images pure from all who struggle against it, because it is a place of joy. To those of memory, however, he revealed the thought that he had stripped from himself. He wished to move them into a material union and to provide them with an ordered system and a dwelling place, so that they might also produce a desire to weaken evil’s attraction for them. In this way, they could cease taking excessive delight in the glory of their surroundings and thus remaining in exile, and instead recognize the infirmity from which they suffer. [] In this way, they could produce love and an unceasing search for the one who can heal them of this weakness. To make them take on a form, he placed the word of beauty over those who belong to the likeness, and he also placed the law of judgment over them. He further placed over them the powers that the roots had produced [in] their
    lust for control. The Word was pleased with them because they are useful in the plan of salvation, so he [chose] them to be rulers over them. This was so that, with the help of the beautiful word, by the threat of the [law], or through the influence of the lust for control, the order might be protected from those who would bring it down into evil.


    The Word knows the lust for control shared by the two orders. To them and to everyone else, he kindly granted their desire, giving each one the appropriate rank of command. Thus, each would rule over a place and an activity, deferring to those of a higher order while commanding the activity of the lower places and exercising control in accordance with his mode of being. As a result, among the angels [] and archangels there are leaders and subordinates in positions of rule and submission, while their activities are diverse and of different kinds.


    Each of the archons, together with his race and privileges, enjoys what his allotted portion has entitled him to. In keeping with the manner of their appearance, each one stood at his post, entrusted with the plan of salvation. None lacks kingship over them, from the end of the heavens to the end of the [earth], throughout every region of the [earth], and among those beneath the earth. There are kings and lords, as well as those who receive commands: some oversee punishment, others oversee justice, still others grant rest and healing, others provide instruction, and others keep watch.'
translation:
  language: zh_hans
  text: '外在之处那些属于记忆的存在是卑微的；他们持守着圆满的表象，尤其因为他们共同有分于那些装饰他们的名。回转使人对属于记忆的存在怀有谦卑；而对他们怀有谦卑，也是审判的律法，也就是定罪与愤怒。


    对他们怀有谦卑，也是一种权能：它把那些落在他们之下的人分别开来，远远遣走；又阻止他们……[a][扩散]到属于记忆和回转的存在之上。这权能包括恐惧、混乱、遗忘、迷惘、无知，以及那些借想象而产生、如同相似之物产生的事物。此外，那些本来确实卑下的事物，反而被赋予崇高的名。那些由它们借着骄傲、掌权欲、悖逆和虚假而产生的，<缺少知识>。[b]


    他给它们每一个都赋予一个名，因为这两个等次都存在于一个名中。[c]属于记忆和表象的，称为“右边的”“属魂的”“火焰者”和“居中的”；属于骄傲意念和相似之物的，称为“左边的”“属物质的”“黑暗者”和“末后的”。


    圣言把各类安置在各自的等次中——就是形像、表象和相似之物——以后，就保守形像的永世，不受一切与它争斗者的玷污，因为那是喜乐之地。然而，他向属于记忆的存在显明了自己所脱去的意念，要使他们进入物质的联合，并为他们预备一个有秩序的体系和居所，使他们也能生出一种愿望，削弱邪恶对他们的诱惑。这样，他们便可不再过分以周围的荣耀为乐，因而继续流落在外，反而能认出自己所患的软弱。……[d]这样，他们就能生出爱，并不住地寻找那位能医治他们软弱的。他为使他们取得形态，就把美善之言置于属于相似之物的存在之上，也把审判的律法置于他们之上。他又把那些根源在掌权欲中所产生的权能置于他们之上。圣言喜悦他们，因为他们在救恩计划中有用，所以就[拣选]他们作这些存在的统治者。[e]这样，借着美善之言的帮助，或借着[律法]的威吓，或借着掌权欲的支配，这等次就能受到保护，免遭那些要使它堕入邪恶者的侵害。[f]


    圣言知道这两个等次共有的掌权欲。他仁慈地满足他们以及其余众者的愿望，赐给每一个适合掌权的位阶，使各自统管一个地方和一种职能：他们服从较高等次者，又指挥较低之处的职能，并按照自身的存在方式施行统治。因此，在天使……[g]和天使长中，有领袖，也有属下，分别处于统治与服从的地位；他们的职能则多种多样，各不相同。


    每一个执政者，连同他的族类和特权，都享有其所得份额赋予他的事物。各自按照自己显现的方式坚守岗位，受托参与救恩计划。从诸天的尽头到[大地]的尽头，遍及[大地]各处以及地下各处，没有一处不在他们的王权之下。[h]其中有君王，有主宰，也有领受命令的：有些监管惩罚，有些监管公正，还有些赐予安息和医治，有些负责教导，另有些负责守望。'
