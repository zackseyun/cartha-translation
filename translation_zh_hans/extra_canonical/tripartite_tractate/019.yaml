review_pass:
  verdict: revise
  source_fidelity: 整体忠实保留了英语见证的宇宙论分类、残缺标记与多处句法歧义；但首句“humble”译作“卑微”不够准确，第二段有关想象与“相似之物”的句子不自然且可能改变比较关系，而“[chose] these to be rulers over them”和末段王权范围的代词关系被过度确定，宜恢复原文的指称开放性。由于未提供科普特原文逐词材料，本次以所给英语见证为可核对的直接依据。
  naturalness: 原稿总体为庄重、可读的现代书面汉语。个别表达如“外在之处那些”“如同相似之物产生的事物”“各自按照自己显现的方式坚守岗位”略显生硬；修订后使句法更符合现代汉语，同时不消解原文晦涩处。
  terminology: 保留“记忆、圆满、回转、表象、形像、相似之物、圣言、永世、属魂的、属物质的、执政者”等术语体系。“谦卑”统一对应 humble；“卑下”保留对应 lowly，避免混淆。
  issues:
  - severity: medium
    issue: 首句将 humble 译为“卑微”。
    rationale: 本段紧接着另以“卑下”表达 lowly；“卑微”易与后者混同，也较像社会地位低下。“谦卑”更贴近见证文本并与后文重复用语一致。
  - severity: medium
    issue: “如同相似之物产生的事物”误置了比较结构，汉语不通顺。
    rationale: 英语见证说这些事物借想象而产生，方式如同 likeness 的产生；并非“相似之物”产生这些事物。应明确为“正如相似之物那样形成”。
  - severity: medium
    issue: “就[拣选]他们作这些存在的统治者”将原文两个含混代词的指称固定化。
    rationale: 见证的“these”和“them”均未明确所指。改为“就[拣选]这些作他们的统治者”，并保留脚注说明，较忠实地维持歧义。
  - severity: medium
    issue: 末段“没有一处不在他们的王权之下”把原文“none lacks kingship over them”的主语和“them”的所指改成地域统属。
    rationale: 见证文本的语法本已困难，但其明言王权而非“没有一处”。修订应保留“没有一个不拥有对他们的王权”，以脚注提示代词和范围不明。
  revised_text: '位于外面的那些属于记忆的存在是谦卑的；他们持守着圆满的表象，尤其因为他们共同有分于那些装饰他们的名。回转使人对属于记忆的存在怀有谦卑；而对他们怀有谦卑，也是审判的律法，即定罪与愤怒。



    对他们怀有谦卑，也是一种权能：它把那些落在他们之下的人分别开来，远远遣走；又阻止他们……[a][蔓延]到属于记忆和回转的存在之上。这权能包括恐惧、混乱、遗忘、迷惘、无知，以及那些借着想象而形成、正如相似之物那样形成的事物。此外，那些本来确实卑下的事物，反而被赋予崇高的名。那些由它们借着骄傲、掌权欲、悖逆和虚假而产生的存在，<缺少知识>。[b]



    他给它们每一个都赋予一个名，因为这两个等次都存在于一个名中。[c]属于记忆和表象的，称为“右边的”“属魂的”“火焰者”和“居中的”；属于骄傲意念和相似之物的，称为“左边的”“属物质的”“黑暗者”和“末后的”。



    圣言把每一类安置在各自的等次中——就是形像、表象和相似之物——以后，就保守形像的永世纯净，抵御一切与它争斗者，因为那是喜乐之地。然而，他向属于记忆的存在显明了自己所脱去的意念，要使他们进入物质的联合，并为他们预备一个有秩序的体系和居所，使他们也能生出一种愿望，削弱邪恶对他们的诱惑。这样，他们便可不再过分以周围的荣耀为乐，因而继续流落在外，反而能认出自己所患的软弱。……[d]这样，他们就能生出爱，并不住地寻找那位能医治他们这种软弱的。他为使他们取得形态，就把美善之言置于属于相似之物的存在之上，也把审判的律法置于他们之上。他又把那些根源在掌权欲中所产生的权能置于他们之上。圣言喜悦他们，因为他们在救恩计划中有用，所以就[拣选]这些作他们的统治者。[e]这样，借着美善之言的帮助，或借着[律法]的威吓，或借着掌权欲的支配，这等次就能受到保护，免遭那些要使它堕入邪恶者的侵害。[f]



    圣言知道这两个等次共有的掌权欲。他仁慈地满足他们以及其余众者的愿望，赐给每一个适合掌权的位阶，使各自统管一个地方和一种职能：他们服从较高等次者，又指挥较低之处的职能，并按照自身的存在方式施行统治。因此，在天使……[g]和天使长中，有领袖，也有属下，分别处于统治与服从的地位；他们的职能则多种多样，各不相同。



    每一个执政者，连同他的族类和特权，都享有其所得份额赋予他的事物。各自按照自己显现的方式站在自己的岗位上，受托参与救恩计划。从诸天的尽头到[大地]的尽头，遍及[大地]各处以及地底下的众者，没有一个不拥有对他们的王权。[h]其中有君王，有主宰，也有领受命令的：有些监管惩罚，有些监管公正，还有些赐予安息和医治，有些负责教导，另有些负责守望。'
