review_pass:
  verdict: revise
  source_fidelity: 译稿总体忠实于所给英语见证，并谨慎保留了残缺、补足和若干宇宙论术语的歧义。需修正两处：其一，缺损处的方括号补足在中文中被误置为“[扩散]”，而英语见证的补足对应介词“[from]”；其二，将“word of beauty”译作“美善之言”超出了见证所明示的“美丽”语义，宜改为“美丽之言”。此外，“他[拣选]他们作他们的统治者”应保留原文两个代词的指向不明，避免以“这些存在”消解歧义。
  naturalness: 整体为自然、庄重的现代书面汉语。个别长句仍保留原文的论述密度，但在这一宇宙论文本中可接受。将“形像的永世”调整为“形像的永世（永世领域）”并不必要，故维持术语简洁一致。
  terminology: “记忆”“回转”“表象”“相似之物”“属魂的”“属物质的”“执政者”等术语保持一致且未作教派化处理。“美丽之言”比“美善之言”更贴近英语见证，同时仍与专名“圣言”相区分。
  issues:
  - severity: medium
    issue: 缺损与补足的对应关系不准确
    rationale: 英语见证作“prevents them [] [from] spreading out…”。中文“又阻止他们……[扩散]到……”把“扩散”标为补足，未对应见证中方括号所示的介词性补足。改作“又阻止他们……[向]……扩散”，可保留缺损后补足的功能，而不虚称“扩散”为补足。
  - severity: medium
    issue: “word of beauty”被增译为“美善之言”
    rationale: “美善”加入了英语见证未明确表达的“良善”含义；在技术性、可能多义的语境中，应保留为“美丽之言”。
  - severity: low
    issue: '[拣选]句的代词指向被部分明确化'
    rationale: “作这些存在的统治者”把第二个“them”解释为“这些存在”。见证明确提示所指不完全清楚，正文宜保持“作他们的统治者”，并由脚注说明歧义。
  revised_text: '外在之处那些属于记忆的存在是卑微的；他们持守着圆满的表象，尤其因为他们共同有分于那些装饰他们的名。回转使人对属于记忆的存在怀有谦卑；而对他们怀有谦卑，也是审判的律法，也就是定罪与愤怒。


    对他们怀有谦卑，也是一种权能：它把那些落在他们之下的人分别开来，远远遣走；又阻止他们……[a][向]属于记忆和回转的存在扩散。这权能包括恐惧、混乱、遗忘、迷惘、无知，以及那些借想象而产生、如同相似之物产生的事物。此外，那些本来确实卑下的事物，反而被赋予崇高的名。那些由它们借着骄傲、掌权欲、悖逆和虚假而产生的，<缺少知识>。[b]


    他给它们每一个都赋予一个名，因为这两个等次都存在于一个名中。[c]属于记忆和表象的，称为“右边的”“属魂的”“火焰者”和“居中的”；属于骄傲意念和相似之物的，称为“左边的”“属物质的”“黑暗者”和“末后的”。


    圣言把各类安置在各自的等次中——就是形像、表象和相似之物——以后，就保守形像的永世，不受一切与它争斗者的玷污，因为那是喜乐之地。然而，他向属于记忆的存在显明了自己所脱去的意念，要使他们进入物质的联合，并为他们预备一个有秩序的体系和居所，使他们也能生出一种愿望，削弱邪恶对他们的诱惑。这样，他们便可不再过分以周围的荣耀为乐，因而继续流落在外，反而能认出自己所患的软弱。……[d]这样，他们就能生出爱，并不住地寻找那位能医治他们软弱的。他为使他们取得形态，就把美丽之言置于属于相似之物的存在之上，也把审判的律法置于他们之上。他又把那些根源在掌权欲中所产生的权能置于他们之上。圣言喜悦他们，因为他们在救恩计划中有用，所以就[拣选]他们作他们的统治者。[e]这样，借着美丽之言的帮助，或借着[律法]的威吓，或借着掌权欲的支配，这等次就能受到保护，免遭那些要使它堕入邪恶者的侵害。[f]


    圣言知道这两个等次共有的掌权欲。他仁慈地满足他们以及其余众者的愿望，赐给每一个适合掌权的位阶，使各自统管一个地方和一种职能：他们服从较高等次者，又指挥较低之处的职能，并按照自身的存在方式施行统治。因此，在天使……[g]和天使长中，有领袖，也有属下，分别处于统治与服从的地位；他们的职能则多种多样，各不相同。


    每一个执政者，连同他的族类和特权，都享有其所得份额赋予他的事物。各自按照自己显现的方式坚守岗位，受托参与救恩计划。从诸天的尽头到[大地]的尽头，遍及[大地]各处以及地下各处，没有一处不在他们的王权之下。[h]其中有君王，有主宰，也有领受命令的：有些监管惩罚，有些监管公正，还有些赐予安息和医治，有些负责教导，另有些负责守望。'
