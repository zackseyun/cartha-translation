  footnotes:
  - marker: a
    text: 此处抄本有缺损；方括号外的省略号表示缺失文字，后面的“[扩散]”是见证译本所保留的补足。
    reason: 保存抄本损坏信号，并说明补足范围。
  - marker: b
    text: 尖括号表示译者据残缺或不完整的句法所作的补足；本句也可能理解为：“知识不属于那些由它们……产生的存在。”
    reason: 保留见证中的修复标记及句法不确定性。
  - marker: c
    text: “存在于一个名中”原意不明，也可能涉及这两个等次凭名称获得身份或存在。
    reason: 避免将晦涩的名称本体论明确化。
  - marker: d
    text: 此处抄本有缺损。
    reason: 标示正文连续性因手稿损坏而中断。
  - marker: e
    text: “[拣选]”是对残缺文字的补足；“他们”和“这些存在”具体所指，在上下文中并不完全明确。
    reason: 保存补足标记与代词歧义。
  - marker: f
    text: “[律法]”是对残缺文字的补足。
    reason: 保存手稿修复信号。
  - marker: g
    text: “天使”之后抄本有缺损。
    reason: 标示名词并列之间存在遗失文字。
  - marker: h
    text: “[大地]”两处都是对残缺文字的补足。原句关于“王权”的归属也可能有别的句法理解。
    reason: 保存补足标记并交代代词及统属关系的不确定性。
lexical_decisions:
- source_word: memory
  choice: 记忆
  rationale: 保留本文作为宇宙论类别使用的抽象术语，不改释为“回忆者”或“纪念”。
- source_word: Fullness
  choice: 圆满
  rationale: 以“圆满”表达普累若麻式的整体圆满领域，同时避免直接音译造成阅读障碍。
- source_word: conversion
  choice: 回转
  rationale: 保留转向、归回的动态含义，不预先限定为一般伦理意义的“悔改”。
- source_word: representation
  choice: 表象
  rationale: 与“形像”和“相似之物”区分，维持原段三类术语之间的张力。
- source_word: likeness
  choice: 相似之物
  rationale: 采用名词性表达，并避免与“形像”合并。
- source_word: Word
  choice: 圣言
  rationale: 表明这是具有主体性的宇宙论称谓；用“圣言”兼顾庄重与可读性，但不额外断定其与特定教义称号完全等同。
- source_word: aeon
  choice: 永世
  rationale: 保留其既可指时代、也可指超世领域的歧义，未简化为纯时间性的“世代”。
- source_word: Soulish
  choice: 属魂的
  rationale: 保留与“属物质的”相对的技术性分类，不释作“心理的”。
- source_word: archons
  choice: 执政者
  rationale: 用早期宗教文献中可理解的统治者称谓，保留其宇宙权势含义。
- source_word: plan of salvation
  choice: 救恩计划
  rationale: 表达有秩序的救治安排，不将其细化为任何宗派性的救赎体系。
theological_decisions:
- issue: “两个等次存在于一个名中”的含义
  choice: 直译并保留“一个名”
  alternative: 解释为“各凭名称而存在”
  rationale: 原句语义晦涩，可能涉及名称与存在的本体关系；不在正文中消解这种张力。
- issue: 审判之律与谦卑的关系
  choice: 保留“对他们怀有谦卑，也是审判的律法”
  alternative: 改写为“审判之律使他们降卑”
  rationale: 英译见证本身存在施受关系上的困难，改写会擅自确定因果方向。
- issue: 圣言对掌权欲所生权能的任用
  choice: 如实保留其在救恩计划中的工具性作用
  alternative: 将这些权能直接描述为纯粹邪恶或善良
  rationale: 文本刻意维持这些权能来源可疑、却被用于秩序与救恩计划的张力。
- issue: 末段王权的主语范围
  choice: 译为各区域均在“他们”的王权之下
  alternative: 把王权归于单一最高统治者
  rationale: 见证文本的代词与句法不够明确，依就近复数对象处理，但以脚注注明可能歧义。
- issue: “word of beauty”
  choice: 美善之言
  alternative: 美丽之言
  rationale: 此处可能兼具美丽、良善和秩序塑形的含义；“美善”较能保留其价值意味而不等同于前文专名“圣言”。
translation_notes:
  register: 采用现代标准书面汉语，语气庄重但尽量让普通读者可读。因科普特原文尚待直接复核，本稿以所给公共领域英语见证为暂定依据；方括号与尖括号的信息通过正文标记及脚注保存。宇宙论技术词尽量前后一致，并刻意区分“形像”“表象”“相似之物”以及“属魂的”“属物质的”等类别。
