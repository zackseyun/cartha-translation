  source_fidelity: 需修订。草稿总体保留了英文见证中的缺文、补文与不稳定指代，但将 orders 一贯译为“序列”不符合此处可指存在群体／阵营的语境；且把“<before> they attained”误译为“<然后>才达到”，颠倒了明确的先后关系。另有若干处将见证中含混的关系过度顺译或改写。鉴于未提供科普特文本的逐词校勘，以下修订以所给英文公共领域见证为准，并保留其文本不确定性。
  naturalness: 修订后采用“群体”“权能”“存在者”等较自然而仍保留宇宙论含混的表达。长句在不增添解释的前提下适度重组，保持庄重的现代书面普通话。
  terminology: 将 orders 统一调整为“群体”，避免“序列”在现代汉语中主要表示线性排列的误导；powers 仍译“权能”，archon 译“执政者”，Totality 译“全体”，simulacrum 译“仿像”，并保留“属灵的道”“流出者”“独一者”等非宗派化术语。
  issues:
  - severity: high
    issue: “<before> they attained”被译为“<然后>才达到”。
    rationale: 英文见证明确标示“在达到……以前”；“然后”将其改为相反的时序，属于实质性意义错误。
  - severity: medium
    issue: orders 译作“序列”。
    rationale: 本段的 right/left orders 是相互行动、模仿并争斗的宇宙论群体；“序列”偏线性次序，削弱其集体性和行动主体性。
  - severity: medium
    issue: “from these through conflict and the rebellious behavior operative among them”被概括为“从这些权能而生的事物；它们是借着……”
    rationale: 原句所指仍含混，但草稿把“由这些而出者”明确化为“事物”，并将“在它们中运作的”限缩为“在权能中”，不必要地缩窄指代。
  - severity: medium
    issue: 希伯来民族相关的残缺句被过度整合为连贯的“著作，以及……所构想的一切”。
    rationale: 见证在此处句法破碎且含有省略号；译文应保留其断裂性，不能将不确定的成分确定为单一并列结构。
  - severity: low
    issue: “shared plan of salvation”译为“把……赐给他们”。
    rationale: 见证仅称居间思想“给予／使有”共同的救恩计划，并无施恩性“赐给”的明确意味；改为“使二者共有”较中性。
  revised_text: '当右边和左边这两个群体借着居于二者之间的（中介）思想彼此联合时，这思想使二者共有救恩计划；结果，双方都带着同一种激情行事：右边的模仿左边的，左边的也模仿右边的。有时，邪恶的群体因愚昧而开始作恶，<有智慧的>群体也仿效他们，以男性的形态同样作恶，仿佛它也属于邪恶的权能。有时，有智慧的群体开始行善，<愚昧的>群体也试着行善，仿效它。



    事物就是借着这些种类[]的行为被确立、产生，为使相似的与不相似的（彼此相像）。因此，那些未受教导的人不能认识存在之物的原因，于是提出了各种解释。有些人说，存在之物从天意得其存在；这些人看见受造界的运行有秩序、有模式。另一些人说，（存在出于）某种异己之物；这些人看见<差异>，也看见诸权能无法无天的邪恶。还有人说，存在之物由于命运而发生；这些人专注于这个问题。另有人说，这关乎自然；也有人说，这关乎偶然。然而，在所有认识只达到可见元素的人中，大多数人不知道这些以外的任何事。



    希腊的智者和外族人，所能认识的只到那些借着想象和空洞思想而获得存在的权能，<也包括>那些借着冲突以及在它们中运作的反叛行为而从这些权能产生的。因此，当他们谈论自己所认为的智慧时，便被一个<仿像>欺骗了。他们以为自己已经达到真理，[]其实所达到的是谬误。这谬误不只涉及次要的名称；那些权能本身也拦阻他们，使他们相信自己已经<明白>了全体。



    因此，那个群体陷入自相争斗，因为一位[比他更高的]执政者的[一个后裔]在他以前就已存在，并怀着骄傲的敌意。正因如此，众人在一切事上都意见纷纭：哲学、各种医术、修辞的门类、各种音乐和逻辑的体系，全都成了意见和理论。于是，<饶舌>占了上风，<他们>陷入混乱，因为他们无法说明那些拥有权能、并把这些理论交给他们的<存在者>。



    至于在希伯来<民族>中出现的事：属物质者所写的著作，<其>范例被希腊人仿效；以及他们为表达这些事所思想的一切；右边的权能<……>，它们启发所有人借着言语和自我表象来推理。因此，他们借着在自己里面运作的各种混合权能，开始了达到真理的旅程。



    此后，他们达到了纯一权能的群体，<在>达到那位按父的样式被设立者<以前>。他并不是因自己的本性而不可见，[]<而是因为>有一位智慧将他隐藏，为要保全那真正不可见者的形态。因此，许多天使都未能见到他的异象。我们先前提到的希伯来民族之人，就是义人和先知，并没有凭想象、借着虚幻的形像，或出于玄奥的思想来思考或说话。相反，每一个人都借着在他里面运作的权能，留心自己所看见、所听见的，准确地说话；他们彼此协调一致，就像那些在他们里面运作的权能一样，因为他们保持了自己的<合一>与彼此和谐。这尤其是因为他们赞美那位比自己更崇高、更伟大的；他存在并被设立，是因为他们需要他。



    属灵的道在他们中间产生了这一切，如同在一个需要至高者的人里面一样：照着那作为救恩种子的思想，怀着希望和热切的等候；又有一道带来光明、作为记念的言语，以及他的后裔和流出者，就是我们先前所说的义人和先知。他们保存祖先的赞美，以及祖先对那伟大之事所作的见证。这些人带着盼望和专注而产生，[]在他们里面种下了<那>祷告和寻求的种子；这颗种子也种在许多寻求得着坚固的人里面。它显明自己，感动他们爱慕至高者，并宣告这些事都属于那独一者。



    他们说话时，有某种独一的事物在他们里面运作。然而，他们的异象和言语却各不相同，因为把异象和言语传给他们的存在者各有不同。因此，那些留心他们所说之话的人并不拒绝其中任何一项，却以多种解释接受了这些经书。这样便形成了不同的群体，直到今天仍存在于犹太人中。有些人说，上帝是一位，就是在古代经书中说话的那一位。另一些人说他是多重的；还有些人说，上帝是单纯的，按本性是一个单一的心智。另有人说，他的作为与善恶的起源有关。还有人说，他亲自创造了已经产生的万有；另一些人则说，[]他借着天使创造。诸如此类观念的多样性，反映了经书形式的多样和类型的丰富；这些经书也产生了他们的律法教<师>。'
