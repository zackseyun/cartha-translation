  source_fidelity: Draft is broadly aligned with the supplied English witness, but several renderings either reverse a restoration signal (<before> rendered as <然后>), introduce unwarranted agency (“所造成的”), or blur technical and syntactic relations. The revision retains all extant lacuna/restoration markers and does not resolve disputed referents beyond the witness.
  naturalness: “序列” is unnatural for the cosmic collective/order sense throughout this passage. “秩序” is more idiomatic in this philosophical-cosmological register. Some highly fragmentary clauses remain deliberately awkward because the witness itself is syntactically unstable.
  terminology: Key terms are regularized as 秩序 (orders), 权能 (powers), 执政者 (archon), 全体 (Totality), 属灵的道 (spiritual Word), 流出者 (emanations), and 独一者 (One and Only). “上帝” is retained as the draft’s existing generic designation without doctrinal expansion.
  issues:
  - severity: high
    issue: The restoration <before> is translated as <然后>.
    rationale: This reverses the supplied witness’s temporal relationship. The Chinese must preserve the restored ‘before’ rather than replace it with ‘then.’
  - severity: medium
    issue: “orders” is consistently rendered “序列.”
    rationale: In modern Mandarin this normally denotes a sequence, not a cosmic order or collective. “秩序” better preserves the witness’s conceptual register and permits the phrase about an order fighting itself.
  - severity: medium
    issue: “the evil of the lawlessness of the powers” is rendered as evil ‘caused by’ the powers’ lawlessness.
    rationale: The witness does not explicitly state this causal relation; the revision preserves the more compressed genitival ambiguity.
  - severity: medium
    issue: The paragraph concerning Hebrew writings adds or obscures relationships in a particularly damaged sentence.
    rationale: The revision follows the witness’s appositional and fragmentary construction more closely, without identifying ‘the material ones’ or clarifying the incomplete action of the right-hand powers.
  - severity: low
    issue: Several expressions are overly colloquial or semantically narrowed, such as 激情 for ‘passion’ and 见到他 for ‘reach a vision of him.’
    rationale: “冲动” and “得见他的异象” better fit the philosophical-religious register while retaining the witness’s ambiguity.
  revised_text: '当右边和左边这两个秩序，借着居于二者之间的（中介）思想彼此联合时，这思想把他们共同的救恩计划赋予他们；结果，双方都带着同样的冲动行事：右边的模仿左边的，左边的也模仿右边的。有时，邪恶的秩序因愚昧而开始作恶，<有智慧的>秩序也仿效他们，以男性的形态同样作恶，仿佛它也属于一种邪恶的权能。有时，有智慧的秩序开始行善，<愚昧的>秩序也仿效它，试着行善。


    因此，事物借着这些种类[]的行为被确立并产生，以致相似的和不相似的（彼此相像）。那么，那些未受教导的人便不能认识存在之物的原因，于是提出各种解释。有些人说，存在之物从天意获得其存在；这些人看见受造界的运行中有秩序和模式。另一些人说，存在出于某种异己之物；这些人看见<差异>，以及权能无法无天的邪恶。还有人说，存在之物的发生是由于命运；这些人专注于这个问题。另有人说，这是自然的事；也有人说，这是偶然的事。然而，在那些认识仅达到可见元素的人当中，大多数人对这些元素以外的事一无所知。


    希腊的智者和外族人，所认识的只达到那些借着想象和空洞思想而获得存在的权能，<也包括>那些借着它们之间的冲突和在它们中间运作的反叛行为而由这些权能生出的事物。因此，当他们论及自己以为是智慧的事时，便被一个<仿像>欺骗了。他们以为自己已达到真理，[]其实达到的是谬误。这谬误不只关乎次要的名称；权能本身也拦阻了他们，使他们相信自己已经<明白>了全体。


    因此，那个秩序陷入自相争斗，因为一位在他以前就已存在、[更高的]执政者的[一个后裔]带着骄傲的敌意。正因如此，众人在一切事上都完全意见纷纭：哲学、各种医术、修辞的门类、各种音乐和逻辑的体系，全都成了意见和理论。于是，<饶舌>占了上风，<他们>陷入混乱，因为他们无法说明那些拥有权能、并把他们的理论交给他们的<存在者>。


    至于在希伯来<民族>中兴起的事物，属物质者的著作——希腊人仿效<其>范例——以及他们为要表达这些事所思考的一切，右边的权能<……>，激发他们所有人借着言语和自我表象来推理。因此，他们运用在自己里面运作的混合（多种）权能，开始了达到真理的旅程。


    此后，他们达到了未混合权能的秩序，<在>达到那位按父的样式被设立者之前。他并非因自己的本性而不可见，[]<而是因为>有一位智慧将他隐藏，为要保全那真正不可见者的形态。因此，许多天使未能得见他的异象。我们先前提到的希伯来民族之人，即义人和先知，既不凭想象，也不借虚幻的形像或玄奥的思想来思考或说话。相反，每一个人都借着在他里面运作的权能，留心自己所看见和听见的，准确地说话；他们彼此和谐、相互一致，正如那些在他们里面运作的权能一样，因为他们保持自己的<合一>和彼此的和谐。尤其是因为他们赞美那位比自己更崇高、更伟大的；他存在并被设立，是因为他们需要他。


    属灵的道在他们中间产生了这一切，如同在一个需要至高者的人里面一样；照着那作为救恩种子的思想，带着盼望和期待的等候，并有作为记忆、带来光明的言语，以及他的后裔和流出者，就是我们先前所说的义人和先知。他们保存祖先的赞美，以及他们对于那伟大之事的见证。这些人带着盼望和专注而产生，[]在他们里面种下了<那>祷告和寻求的种子；这种子也种在许多寻求得坚固的人里面。它显明自己，推动他们爱慕至高者，并宣告这些事都属于那独一者。


    他们说话时，有某种独一的事物在他们里面运作。然而，他们的异象和言语却各不相同，因为把异象和言语传给他们的存在者各不相同。因此，那些留心他们所说之话的人不拒绝其中任何一项，却以多种解释接受了这些经书。这就导致不同群体的形成；这些群体直到今日仍存在于犹太人中。有些人说，上帝是一位，就是那位在古代经书中说话的。另一些人说他是多重的；还有些人说，上帝是单纯的，按本性是一个单一的心智。另有人说，他的作为与善恶的起源有关。还有人说，他自己是已经产生之物的创造者；另一些人则说，[]他借着天使创造。诸如此类观念的多样性，反映了经书形式的多样和经书类型的丰富；这些经书产生了他们的律法教<师>。'
