translation:
  language: zh_hans
  text: '当右边和左边这两个序列，借着居于二者之间的（中介）思想彼此联合时，这思想便把二者共同的救恩计划赐给他们；结果，双方都怀着同样的激情行事：右边的模仿左边的，左边的也模仿右边的。有时，邪恶的序列因愚昧而开始作恶，<有智慧的>序列也仿效他们，以男性的形态同样作恶，仿佛它也是一股邪恶的权能。有时，有智慧的序列开始行善，<愚昧的>序列也试着效法它行善。


    事物就是借着这些种类[]的行为被确立并产生，以致相似的与不相似的彼此相像。因此，那些未受教导的人不能认识万有存在的原因，于是提出了各种解释。有些人说，万有的存在出于天意；这些人看见受造界的运行有秩序、有模式。另一些人说，存在出于某种异己之物；这些人看见了<差异>，也看见诸权能无法无天所造成的邪恶。还有人说，万有的发生是由于命运；这些人专注于这个问题。另有人说是由于自然，也有人说是由于偶然。然而，在所有认识只达到可见元素的人中，大多数人不知道这些以外的任何事。


    希腊的智者和外族人，所能认识的只到那些因想象和空洞思想而产生的权能，<也包括>从这些权能而生的事物；它们是借着冲突以及在权能中运作的反叛行为而生的。因此，当他们谈论自己所认为的智慧时，便被一个<仿像>欺骗了。他们以为自己已经达到真理，[]其实所达到的是谬误。这谬误不只涉及次要的名称；那些权能本身也拦阻他们，使他们相信自己已经<明白>了全体。


    因此，那个序列陷入了自相争斗，因为那位在他以前就已存在、地位[更高]的执政者之[一个后裔]怀着骄傲的敌意。正因如此，众人在一切事上都意见纷纭：无论哲学、各种医术、修辞的门类、各种音乐，还是逻辑的体系，全都成了意见和理论。于是，<饶舌>占了上风，<他们>陷入混乱，因为他们无法说明那些拥有权力、并把这些理论交给他们的<存在者>。


    至于在希伯来<民族>中出现的事，就是属物质者所写、<其>范例被希腊人仿效的著作，以及他们为了表达这些事所构想的一切；右边的权能<……>，启发他们所有人借着言语和自我表象来推理。因此，他们靠着在自己里面运作的各种混合权能，踏上了达到真理的旅程。


    此后，他们达到了纯一权能的序列，<然后>才达到那位按父的样式被设立者。他并不是因自己的本性而不可见，[]<而是因为>有一位智慧将他隐藏，为要保全那真正不可见者的形态。因此，许多天使都未能见到他。我们先前提到的希伯来民族之人，就是义人和先知，并没有凭想象、虚幻的形像或玄奥的思想来思考或说话。相反，每一个人都借着在他里面运作的权能，留心自己所看见、所听见的，准确地说话；他们彼此协调一致，就像那些在他们里面运作的权能一样，因为他们保持了自己的<合一>与彼此和谐。尤其因为他们赞美那位比自己更崇高、更伟大的；他之所以存在并被设立，是因为他们需要他。


    属灵的道在他们中间产生了这一切，如同在一个需要至高者的人里面一样；他们照着那作为救恩种子的思想，怀着希望，热切等候；又有一道带来光明、作为记念的言语，以及他的后裔和流出者，就是我们先前所说的义人和先知。他们保存祖先的赞美，以及祖先对那伟大之事所作的见证。这些人带着盼望和专注而产生，[]在他们里面种下了<那>祷告和寻求的种子；这颗种子也种在许多寻求得着坚固的人里面。它显明自己，感动他们爱慕至高者，并宣告这些事都属于那独一者。


    他们说话时，有某种独一的事物在他们里面运作。然而，他们的异象和言语却各不相同，因为把异象和言语传给他们的存在者各有不同。因此，那些留心他们言论的人并不拒绝其中任何一项，却以多种解释接受了这些经书。这样便形成了不同的群体，直到今天仍存在于犹太人中。有些人说，上帝是一位，就是在古代经书中说话的那一位。另一些人说他是多重的；还有些人说，上帝是单纯的，按本性是一个单一的心智。另有人说，他的作为与善恶的起源有关。还有人说，他亲自创造了已经产生的万有；另一些人则说，[]他借着天使创造。诸如此类观念的多样性，反映了经书形式的多样和类型的丰富；这些经书也产生了他们的律法教<师>。'
