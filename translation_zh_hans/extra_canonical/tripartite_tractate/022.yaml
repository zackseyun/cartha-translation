lexical_decisions:
- source_word: orders
  choice: 序列
  rationale: 在本文宇宙论语境中指彼此区分而有组织的存在群体；“序列”比“秩序”更能兼顾群体与层级含义，同时避免误读为抽象秩序。
- source_word: powers
  choice: 权能
  rationale: 保留其既可指能力、又可指人格化宇宙势力的含混性；不简化为“力量”或特定等级的“天使”。
- source_word: providence
  choice: 天意
  rationale: 采用现代汉语可理解而又庄重的哲学—宗教用语，表达宇宙受有意安排和照管的观点。
- source_word: simulacrum
  choice: 仿像
  rationale: 表达似真而非真的形像或复制品，保留其认识论上的欺骗意味。
- source_word: Totality
  choice: 全体
  rationale: 作为本文技术性宇宙论概念处理，不擅自等同于“宇宙”或某一特定神学体系中的专名。
- source_word: archon
  choice: 执政者
  rationale: 沿用早期基督教及诺斯替文献中常见的中性译法，保留统治性存在的含义。
- source_word: the spiritual Word
  choice: 属灵的道
  rationale: “道”保留 Word 可能具人格性及启示功能的张力；“属灵的”与上下文物质、混合和纯一的层次形成对照。
- source_word: emanations
  choice: 流出者
  rationale: 采用较直译的宇宙论措辞，指从某一来源发出的存在者，不以“受造物”等词预断其产生方式。
- source_word: One and Only
  choice: 独一者
  rationale: 保留指向终极单一存在者的称号性语气，同时不额外加入后期教义定义。
- source_word: teachers of the Law
  choice: 律法教师
  rationale: 自然表达教导、解释律法者；不限定为某一后来制度化职分。
theological_decisions:
- issue: 左右两个序列之间的模仿与共同救恩计划
  choice: 保留二者互相模仿、甚至智慧序列也作恶的悖论性表述
  alternative: 把智慧序列的作恶解释为外表上的或策略性的行为
  rationale: 见证文本没有化解这种张力，译文不应替作者作神学辩护。
- issue: 按父的样式被设立者为何不可见
  choice: 译为并非本性不可见，而是智慧将他隐藏
  alternative: 将“智慧”解释成抽象的神圣安排，或认定此人就是父本身
  rationale: 保留人物指代及本体论层级的含混，不把“他”与父等同。
- issue: 先知言论的一致与异象、言语的多样
  choice: 同时保留其内在合一与表达多样
  alternative: 只强调经书完全一致，或只强调彼此冲突
  rationale: 原文有意并置统一来源与多样传达者，形成后文多种解释的基础。
- issue: 上帝是一位、是多重的及借天使创造等犹太群体观点
  choice: 作为并列的历史性意见陈述，不判定其中哪一项正确
  alternative: 以正统教义框架纠正或调和这些观点
  rationale: 本段主题正是不同意见；译文须保留报告性语气。
- issue: 属灵的道及其后裔、流出者
  choice: 保留“道”与“流出者”等宇宙论语言
  alternative: 直接译成圣子、圣灵或受造天使
  rationale: 见证不足以支持这些明确身份认定，避免导入宗派性解释。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。保留原文宇宙论术语和论述中的不稳定指代，不以顺畅为由过度澄清。由于本次所给 drafting basis 明示尚未完成科普特语复核，本稿属于基于公共领域英文见证的暂定出版草案。[a]置于全文标题性起始处最合适；因提交字段不含标题，已在正文首句补入标记的需求应由排版时处理。
