    reason: 对应见证末句的空缺标记，不擅自补足可能的词语。
lexical_decisions:
- source_word: Church
  choice: 教会
  rationale: 保留该古代基督教文献的群体性术语；此处不是建筑物，而是由诸多个体组成、被描述为起初已存在的属灵共同体。
- source_word: only son
  choice: 独生子
  rationale: 采用现代中文读者熟悉且庄重的表达，同时保留“唯一之子”与教会众成员并存所形成的张力。
- source_word: unity
  choice: 一个整体
  rationale: 兼顾“一”与完整统一体的含义；避免直接译作“合一”而过度关系化，也避免仅用“一个”造成语法含混。
- source_word: unbegotten
  choice: 不是受生的
  rationale: 以较透明的措辞保留技术性本体论陈述，不将其改释为“非受造”。
- source_word: aeons
  choice: 永世
  rationale: 保留该文献中既可指时代、又可带有超宇宙实体意味的术语张力；不径自音译或系统化为特定诺斯替教阶层。
- source_word: reposes
  choice: 安息在……之上
  rationale: 保留“停驻、安息”意象及原见证的介词关系，不改释为“居住”或“依靠”。
theological_decisions:
- issue: “独生子”与从起初存在的教会之间的表面矛盾
  choice: 照原段论证保留两项陈述及其张力
  alternative: 将“独生”解释为某种具体等级或生成方式
  rationale: 现有见证没有充分展开解决方式；译文不代替作者补足一套教义体系。
- issue: 父既被称为父、又“把自己理解为子”
  choice: 直译保留自我指涉与身份张力
  alternative: 改为父思想或产生另一个子
  rationale: 原见证明确以 himself 为宾语；为避免导入后期教义框架，不擅自区分主体。
- issue: 教会及其成员在诸永世以前存在
  choice: 保留其先存陈述
  alternative: 弱化为在神的计划或意念中预先存在
  rationale: “在计划中”属于解释性补充，原见证直接论及存在。
- issue: “圣灵”是单数称号还是复数属灵存在
  choice: 译为复数性的“那些不朽圣灵”
  alternative: 译为单一的“不朽圣灵”
  rationale: 英语见证使用复数 spirits，并以 on whom 回指群体。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。因尚待科普特原文复核，本稿以所供公共领域英语见证为临时依据；正文中的方括号保留其编辑补字，脚注标记说明缺损位置。对高度技术性的宇宙论词汇采取克制译法，不将文本预先归入某一宗派体系。
