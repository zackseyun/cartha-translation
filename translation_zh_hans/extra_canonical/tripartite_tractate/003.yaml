review_pass:
  verdict: revise
  source_fidelity: 草稿总体保留了段落的论证结构、先存的教会、诸永世及复数“不朽圣灵”等关键内容。但“子也只显明为自己的弟兄”将“was ... discovered as a brother to none but himself”的被动发现及否定性限定改成了不准确的主动“显明”；“父……给……”一句也重排并改变了英语见证中方括号补字的范围与“给自己”的宾语关系。鉴于直接科普特文本尚待复核，以下修订严格以所供英语见证为准，并保留其缺损／编辑恢复信号。
  naturalness: 原译大体庄重可读，但“除了向自己以外，他未曾向任何者显明自己为父”和“只显明为自己的弟兄”不合现代汉语习惯，也弱化或改变限定关系。修订以“除他自己以外，不向任何人显明自己是父”“被发现为弟兄，除他自己以外不作任何人的弟兄”表达，既更自然也较贴近见证。
  terminology: “教会”“独生子”“永世”“不朽圣灵”均可保留。“未受生”比“不是受生的”更符合汉语神学／哲学书面语，同时不把 unbegotten 解释为“非受造”。“一体”较准确地保留 unity 的单一与整体性，未额外引入体系化解释。
  issues:
  - severity: high
    issue: “子也只显明为自己的弟兄”误译“the Son was also discovered as a brother to none but himself”。
    rationale: 英语见证使用被动式，并以“to none but himself”限定“brother”的对象；原译改成子主动向自己显明，且未保留“除自己以外不作任何人的弟兄”的否定限定。
  - severity: high
    issue: “父……把[荣耀]、尊荣和[爱]归给[自己]”未忠实呈现“he gives [himself glory] and honor and [love]”。
    rationale: 原译将“自己”移作“归给”的受事，并把方括号从“himself glory”的编辑恢复范围拆散，造成原见证的文本状态及句法关系不清。
  - severity: medium
    issue: “除了向自己以外”句式不自然，且“向任何者”生硬。
    rationale: 应改为“除他自己以外，不向任何人显明自己是父”，以保留 for none but himself 的排他限定。
  - severity: medium
    issue: “如同……意念所献的吻”将“with a good and insatiable thought”具体化为“所献”。
    rationale: 见证只将“良善而不餍足的意念”与彼此亲吻者相连，未明确说吻是被“献上”的；修订避免增添动作。
  - severity: low
    issue: “不是受生的”表达略显拗口。
    rationale: “未受生”是对 unbegotten 更简洁、自然的保守对应，不等同于“非受造”。
  revised_text: '不但子从起初就存在，教会也从起初就存在。由于这件事深奥难解，若有人认为承认子是独生子便与这一主张相矛盾，其实并非如此。正如[a]父是一体，除他自己以外，不向任何人显明自己是父；同样，子也被发现为弟兄，除他自己以外不作任何人的弟兄，因为他未受生，也没有开端。父惊叹自己[b]为父；他把[自己的荣耀]、尊荣和[爱]赐给自己。此外，他也把自己理解为子，这与无始无终的属性相称。事情由此得以确定。



    他的后裔不可胜数、没有限量，彼此不可分离。诸存在者从子和父而出，如同彼此亲吻的人以良善而永不餍足的意念所亲的吻；那拥抱虽为一，却包含许多吻。这就是说，教会由许多个体组成；他们在诸永世以前就已存在。严格说来，这称为“诸永世的诸永世”。这就是那些不朽圣灵的特性；子安息在他们之上，因为这是他的本性，正如父也安息[c]在子之上。'
  revised_footnotes:
  - marker: a
    text: 此处原稿有缺损；现存英语见证在“正如”之后以“[]”标示空缺。
    reason: 保留见证所示的手稿缺损，不擅自补入衔接语。
  - marker: b
    text: “为父”中的“为”对应英语见证方括号中的编辑恢复 [as]。
    reason: 标明该词为编辑性恢复，而非无争议的完整正文。
  - marker: c
    text: 此处“安息”与“在子之上”之间原稿有缺损。
    reason: 对应英语见证末句的“[]”，不擅自补足缺失词语。
  revision_rationale: 修订集中处理可安全判定的句法和语义偏差：恢复“子被发现为弟兄、但不作自己以外任何人的弟兄”的被动及排他关系；使父“赐给自己荣耀、尊荣和爱”的结构与见证一致；并改善若干现代汉语句式。方括号和脚注仅标示见证明确显示的缺损或编辑恢复。对于“诸永世”“不朽圣灵”“安息在……之上”等高技术性、可能具有多重含义的表达，未作教派化或体系化改释。
