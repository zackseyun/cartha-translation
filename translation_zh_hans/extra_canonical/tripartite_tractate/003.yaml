translation:
  language: zh_hans
  text: '不但子从起初就存在，教会也从起初就存在。由于这件事深奥难解，若有人认为，承认子是独生子便与此说相矛盾，其实并非如此。正如[a]父是一个整体，除了向自己以外，他未曾向任何者显明自己为父；同样，子也只显明为自己的弟兄，因为他不是受生的，也没有开端。父惊叹自己为[b]父，并把[荣耀]、尊荣和[爱]归给[自己]。此外，他也把自己理解为子，这与无始无终的属性相称。事情由此得以确定。


    他的后裔不可胜数、没有限量，彼此不可分离。诸存在者从子和父而出，如同彼此亲吻的人怀着美好而永不满足的意念所献的吻：拥抱是一个，其中却包含许多吻。这就是说，教会由许多个体组成；他们在诸永世以前就已存在，严格说来，这教会称为“诸永世的诸永世”。这就是那些不朽圣灵的特性；子安息在他们之上，因为这是他的本性，正如父也安息[c]在子之上。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处原稿有缺损；现存见证在“正如”之后标示空缺。
    reason: 保留手稿损坏信号，避免把不确定的衔接词或短语当作确定正文。
  - marker: b
    text: “为”所引出的“父”是编者据残缺文本补出的读法。
