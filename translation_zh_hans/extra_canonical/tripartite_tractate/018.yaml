translation:
  language: zh_hans
  text: '《三部论》——道的工作


    鉴于他所献的祷告，以及由此产生的回转，……[a]有些要灭亡，有些要得益处，另有一些要被分别出来，这是合宜的。他先预备了对悖逆者的惩罚，运用那位已经显现者所赐的能力；他从那位领受了统管万有的权柄，为要使自己与那位分离。他就是在下方的那一位，并且一直与至高者分隔，直到他在外部为万有预备好救恩的计划，又把指定的地方分给各个存在者。


    道装饰诸全体时，首先确立了自己，作一切受造之物的根本准则、成因和统治者；正如父是这确立的成因，并且是在他之后首先存在的。[b]道创造了那些先存者的形像，并在感恩和颂赞中使它们产生。


    随后，他装饰了一个地方，给那些由他在荣耀中产生的存在者；这地方称为“乐园”、“欢悦”、“充满滋养的喜乐”，以及“先存者的喜乐”[c]。这地方保存着住在圆满界里一切美善之物的形像。


    随后，他装饰了国度，使它如同一座充满各种美好事物的城，就是充满弟兄之爱和丰盛的慷慨，……[d]又有圣灵众和统管他们的大能者；这些都是道以能力产生并确立的。


    接下来，为装饰而设的是聚集在这地方的教会之处；它具有那住在诸永世中的教会之形态，为要荣耀父。[e]


    这些之后，他装饰了信心之处，以及由盼望而来的顺服之处。光显现时，道领受了这些。[f]


    接下来，他装饰了倾心祷告和恳求之处。随后而来的是宽恕，以及论到那位将要显现者的话。


    每一个属灵的地方，都凭一种属灵的能力而存在。它们不同于记忆中的存在者，因为它们的能力建立在一个形像之中；这形像把圆满界与道分隔开来。相比之下，那在预言未来之事时运行的能力，会引导记忆中的存在者——他们是为了先存之物而产生的。[g]这样，他们就不会同那些借着看见与他同在的常存之物而获得存在的事物混杂在一起。[h]'
