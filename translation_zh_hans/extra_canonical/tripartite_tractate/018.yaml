lexical_decisions:
- source_word: the Word
  choice: 道
  rationale: 采用现代中文中清楚而庄重的对应词，同时保留此文把该称谓人格化的用法。
- source_word: the Totalities
  choice: 诸全体
  rationale: 保留复数及该术语的宇宙论性质，不简化为普通的“万物”。
- source_word: the Fullness
  choice: 圆满界
  rationale: “圆满”体现原术语的核心含义；加“界”帮助普通读者辨明这里指一种领域或总体，而非一般性质。
- source_word: aeons
  choice: 诸永世
  rationale: 保留其复数和超世领域的意味，避免直接套入某一宗派的专门译名。
- source_word: beings of the memory
  choice: 记忆中的存在者
  rationale: 英文见证本身含义晦涩，采取较贴近形式的译法，不擅自解释“记忆”的本体论所指。
- source_word: adorned
  choice: 装饰
  rationale: 贯穿各段保持同一动词，兼具安排、构成和赋予秩序的可能含义，不在正文中单向释为“创造”。
- source_word: conversion
  choice: 回转
  rationale: 保留转向或改变的基本意义，不预先限定为后世教义化的“归信”。
- source_word: spiritual power
  choice: 属灵的能力
  rationale: 兼顾宗教语境和现代可读性，并维持“能力”在全文中的术语联系。
theological_decisions:
- issue: “在下方的那一位”、显现者及至高者之间的身份关系
  choice: 保留代词和称号，不补明身份
  alternative: 按某种宇宙论体系把各代词明确为特定神圣存在者
  rationale: 现有见证的指代含混；补明会把特定解释写入正文。
- issue: 道与父在“确立”及先后次序上的关系
  choice: 尽量保留见证中不顺畅而含混的比较和代词
  alternative: 重构句法，明确断定父或道何者先存
  rationale: 该句可能涉及文本损坏或句法歧义，不宜在科普式润色中消除其神学张力。
- issue: “教会”与“诸永世中的教会”的关系
  choice: 保留地上聚集之处具有永世中教会之形态的说法
  alternative: 解释为天上教会与地上教会的固定二分
  rationale: 原见证只陈述形态对应，未充分界定二者的本体关系。
- issue: “圣灵众”的复数形式
  choice: 译作“圣灵众”并保留复数
  alternative: 改作单数“圣灵”或解释为“圣洁的诸灵”
  rationale: 见证为复数 holy spirits；不能因常见基督教用语而静默改成单一位格，但其具体所指仍不确定。
- issue: 圆满界与道被形像分隔
  choice: 按见证直译其分隔关系
  alternative: 为维护预设的神学体系而改成“区分”或另定主语
  rationale: 原句虽晦涩，却表达真实的宇宙论张力，应予保留。
