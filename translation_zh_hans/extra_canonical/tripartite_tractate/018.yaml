  naturalness: 文体庄重且大体通顺。修订将“教会之处”“为装饰而设”等稍显生硬的搭配调整为现代汉语可读的表达，同时保留括号所显示的编辑性补足和原文残缺。
  terminology: “道”“诸全体”“圆满界”“诸永世”“圣灵众”“记忆中的存在者”等关键术语可保留。将“先存者的形像”改为“先存的形像”，以免误称这些形像是“先存者”所拥有的形像；“先存者的喜乐”则仍保留，因为该处英文见证明确作“Joy <of> the Pre-existent Ones”。
  issues:
  - severity: medium
    issue: “pre-existent images”译为“那些先存者的形像”
    rationale: 英文见证是“先存的形像”，并非“属于先存者的形像”。原译增加了“先存者”这一实体及属格关系。
  - severity: low
    issue: “outwardly”译为“在外部”
    rationale: 此处副词修饰“预备救恩的计划”，宜译为“以外在的方式”或“向外”；“在外部”容易误作空间地点。
  - severity: low
    issue: “inclination toward prayer and supplication”译为“倾心祷告和恳求”
    rationale: “倾心”描述祷告的态度或方式，未保留原文所说的“趋向／倾向于祷告和恳求”。
  - severity: low
    issue: 若干编辑性补足在正文中未以括号保留
    rationale: 英文见证在“for adornment was”“that comes”“[The Word]”“adorned the place of”等处使用括号或方括号。中文正文保留相应符号，能使读者区分残存文字与编辑补足。
