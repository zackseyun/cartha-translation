translation:
  language: zh_hans
  text: '这位就是赐给他们的那一位，使他们得满足、滋养、喜乐，并得丰盛的启明；这启明包含他与他们一同劳作、他对他们的认识，以及他与他们的交融。这位确实既被称为“子”，也确实是子，因为他就是诸全体[a]；他们知道他是谁，也知道他以衣袍覆庇他们。这位就是那被称为“子”的，是他们所理解其存在、又一直寻找的那一位。这位也作为父而存在；他们无法谈论他，也不能领会他。这是第一位产生者[b]。没有人能领会他或理解他。又有谁能走近那崇高者，走近那严格说来先已存在者呢？然而，人所想到的关于他的所有名称[]，或用来称说他的所有名称，都是为尊崇他而用，是对他的暗示，各人照着自己所能来荣耀他。


    当他伸展自己，为要生育，并为诸全体产生知识时，从他而出的那一位，他……每一个名称，毫无虚假；严格说来，他是唯一的第一位，是那出于父的人，我称他为：


    无形之形，


    无体之体，


    不可见的面容，


    不可言说的话语，


    不可领会的心智，


    从他涌流的泉源，


    被栽种者的根，


    以及一切存在者的神；


    他所启明者的光，


    他所爱者的爱，


    他以眷顾引导者的眷顾，


    他使之有智慧者的智慧，


    他使之有能力者的能力，


    他召聚归向自己者的会众，


    所寻求之事的启示，


    看见者的眼睛，


    呼吸者的气息，


    活着者的生命，


    与诸全体交融者的合一。


    这一切都存立于那独一者之中，因为他以这一切完全披戴自己，然而他从不以自己的单一名称被称呼。这样，在这独一的样式中，它们同样既是那独一者，也是诸全体。他不像身体那样可以分开，也不因所得的诸名称而被分割，仿佛他在一种样式中是一物，在[]另一种样式中又是[别的]一物。此外，他也不在……中改变，也不转变成他所构想的那些名称，仿佛现在成为这个，随后又成为那个；现在是一物，另一个时候又变成别物。相反，他始终完完全全是他自己。[他]同时且永恒地是诸全体，无一例外。他是那包含这一切的。他把父呈现给诸全体。甚至可以说，他就是诸全体，因为他就是对自身的认识，也是每一种性质和能力。[他]自己[也是]那眼睛，借此拥有知识，在自己里面彻底观看自己，并且拥有一位子和一个形态。


    因此，他的能力和性质数不胜数，前所未闻，这是由于他生育它们的方式。由他的话语所生的众者数不胜数、不可分离；他的教导和他的诸全体也是如此。他认识他们；他们就是他自己所是的，因为他们存立于那单一名称之中，也都借着这名称说话。他又使他们产生，为要让他们发现：他们按着各自的性质，以合一的样式存在。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诸全体”是本篇的技术性用语，指由那独一者而出、又在他里面合一的整体性众者；具体所指须结合全篇理解。
    reason: 说明不常见的技术术语，同时避免在正文中加入过多解释。
  - marker: b
    text: 此句也可能理解为“这是第一位产生的”或“这是首先出现的那一位”。现有底本的表达可涉及产生、出现或存在的起始；有待直接核对科普特文本。
    reason: 保留 came to be 的语态和本体论歧义，避免武断译成“受造”。
lexical_decisions:
- source_word: Totalities
  choice: 诸全体
  rationale: 保留该文献中的技术性集合概念，并用复数意味明确的“诸”避免误读为普通的“全部”。
- source_word: enlightenment
  choice: 启明
  rationale: 兼顾光照与使人获得认识的含义，也与后文“光”保持词义关联。
- source_word: mixing / mingled
  choice: 交融
  rationale: 保留相互混合、联合的意象，同时使用现代汉语中较自然且庄重的表达。
- source_word: mind
  choice: 心智
  rationale: 表达认知主体与思维能力，避免“心”过度偏向情感。
- source_word: providence
  choice: 眷顾
  rationale: 保留主动照管和引导之意，不预先套入特定宗派的天命术语。
- source_word: subsist
  choice: 存立
  rationale: 反映本体论语境中的持续存在，区别于普通的“生活”或“生存”。
- source_word: human from the Father
  choice: 出于父的人
  rationale: 直保留“人”这一令人不易的称谓，不改写为“神人”等带解释性的神学术语。
- source_word: word
  choice: 话语
  rationale: 保持普通语义与可能的技术性语义之间的张力，不直接专名化为“道”。
theological_decisions:
- issue: “子”与“父”在同一段中的身份陈述
  choice: 保留“作为父而存在”以及“被称为子、也确实是子”的并置
  alternative: 将“父”解释成他对诸全体所发挥的父性功能
  rationale: 见证文本有意形成身份与名称的张力；译文不替作者消解。
- issue: “第一位产生者”的时间或本体含义
  choice: 译作“第一位产生者”并加注说明歧义
  alternative: “最初受造者”或“首先出现者”
  rationale: 避免把原句直接纳入受造论或纯时间次序，保留 came to be 的难题。
- issue: “他就是诸全体”
  choice: 直译保留
  alternative: “他代表诸全体”或“诸全体都在他里面”
  rationale: 原文作强同一陈述，不宜弱化成代表或容纳关系。
- issue: “拥有一位子和一个形态”
  choice: 保留并列与不明确的关系
  alternative: 解释为“他作为子而有形态”
  rationale: 英语见证中的句法和所指存在张力，应待科普特语复核后再判断。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。诗性称号按原有排比逐行呈现。方括号与省略号保留抄本残缺或复原信号；尖括号中的编辑补词在中文正文中顺译，不另造抄本证据。本稿依据所供公共领域英语见证起草，尚待直接核对《拿戈玛第抄本》I,5 的科普特文本。
