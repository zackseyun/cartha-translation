review_pass:
  verdict: revise
  source_fidelity: 整体忠实保留了三类（属灵、属魂、属物质）、圣言、万有、右方／左方及文本残缺标记，也没有作宗派化调和。不过有几处译文将原见证故意保留的指代或句法含混加以确定化，尤其是属物质一类与“显现／熄灭”的关系；另有一处缺文锚点嵌入中文不自然。
  naturalness: 文体庄重、现代且大体流畅。“那向它显现的[]那一位”中的重复“那”与缺文标记位置妨碍阅读；少数长句可在不改变原文关系的条件下略作整理。
  terminology: “属灵的／属魂的／属物质的”“圣言”“万有”“右方／左方”“教会”均保持一致且适宜。“头”与“身体”没有擅作基督论解释，处理正确。
  issues:
  - severity: medium
    issue: 属魂段落的缺文锚点位置及重复指示词
    rationale: 原见证为“recognize [] the one who appeared to it”。“不肯认出那向它显现的[]那一位”既重复“那”，也把[]夹在不自然的位置。改作“不肯认出[]那向它显现的那一位”，可保留缺文而使中文句法通顺。
  - severity: medium
    issue: 属物质一类段落将“its manifestation extinguishes it”确定解释为光显现、黑暗被消灭
    rationale: 见证的代词指向和“显现／熄灭”关系并不完全明确。现译“光一显现，黑暗就被消灭”消除了原有含混，并加入“消灭”的明确施受关系。应以“因为这显现会使它熄灭”保留指代张力。
  - severity: low
    issue: “如果杀死那位……的”在引语中不够完整
    rationale: 原文是条件性被动结构；改为“若那位……被杀”更自然，也不改变施事未明的表达。
  revised_text: '人类后来按本性分成三类：属灵的、属魂的和属物质的。这与圣言的三重倾向相应；属物质的、属魂的和属灵的，都是从这些倾向产生的。这三类本性，各凭其果子被认出。然而起初它们还没有显明；直到救主来到，照耀众圣者，并显明各人属于哪一类，它们才被认出。


    属灵的一类，就像光出于光、灵出于灵。它的头一显现，它便立刻奔向与自己相应的一类；它忽然为自己的头长成了一个身体，也立刻因这启示而获得认识。


    相比之下，属魂的一类如同出于火的光。它迟疑着，不肯认出[]那向它显现的那一位；要它凭信心奔向他，就更加迟疑。可是，尽管有声音教导它，<它>也就满足了，因为它离所应许的盼望并不远；它仿佛以凭据的形式，得到了将来之事的确证。


    相比之下，属物质的一类在各方面都是异己的，因为它像黑暗，排斥照耀的光；因为这显现会使它熄灭。它既不接纳他的<来临>，便<毫无节制>，对主的启示充满恶意。


    属灵的一类将在各方面得到完全的拯救；属物质的一类将在各方面被毁灭，如同敌对者的结局。属魂的一类，无论就其产生的方式还是就其本性而言，都处于中间，因此具有双重性，与它既倾向善又倾向恶相应。为它所定的结局含混未明：<……>以及它完全逃离<善>。


    圣言照着他思想中预先存在的样式所产生的那些，当他想起那至高者并祈求拯救时，便立刻得了拯救。[由于]那带来拯救的思想，他们借着它所产生的，得到了完全的拯救。由这些依次产生的[那些]也是如此，[]无论是天使还是人。他们承认有一位比自己更崇高，也祈求并寻求他，因此他们同样将领受那些受造者所领受的拯救，因为他们出于善的倾向。他们受托服事，宣告救主将来的来临，并在他来到以后宣告他的显现。无论是天使还是人，当他委派他们承担这项服事时，他们确实得到了自身存在的本性。


    相比之下，那些出于掌权欲望的思想、因他的敌对者所击的一击而产生的，正是由那思想产生的。他们既是混合的，所得的结局也含混未明。有人抛弃了那只在某些时期和特定时段赐给他们的掌权欲望，荣耀那荣耀之主，并弃绝自己的愤怒；他们将因谦卑而得赏赐，就是永无止境的存在。


    相比之下，有些人因野心的欲望而骄傲，贪爱转瞬即逝的荣耀，又忘记权柄只是托付给他们，在某些时期和时段内使用。因此，他们不承认上帝的儿子[]是万有之主和救主，也不弃绝愤怒，不停止效法恶者；他们将同那些误入歧途、漂泊远离的人一起，因自己的无知和愚昧的激情受到报应。


    还有些人更为邪恶：他们对主做了不当的事，正如左方的权势对他所做的，甚至将他置于死地。他们心想：“若那位被宣告为万有之王的被杀，我们就会成为万有的主人。”他们为此行事——这些人和天使，不属于右方之人的善的倾向，而是出于混合。他们选择了自我荣耀，尽管那不过是转瞬即逝的荣耀和欲望；通往永恒安息的道路，却是借着谦卑（而达到）拯救，归入那些将要得救的人，就是右方的人。


    他们赞美主，思想什么能使教会喜悦，并尽其所能同她一起唱谦卑者的颂歌，做她所喜悦的事；此后，他们会分担她的苦难和忧痛，像那些顾念什么对教会有益的人一样，也会在她的盼望中有份。这适用于[]人和天使。


    属于左方阵营的人，所走的路通向灭亡；因为他们不但拒绝主，设计恶谋害他，还把仇恨、嫉妒和妒忌指向教会。这就是那些扰乱教会之人被定罪的原因；他们甚至煽动自己，为教会制造<试炼>。'
