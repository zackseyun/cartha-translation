review_pass:
  verdict: revise
  source_fidelity: 在仅能以所供英文见证为依据、尚未直接复核科普特语的前提下，译稿总体忠实保留了残缺符号、补文符号、宇宙论术语和若干有意未决的指代。不过首段关于永世彼此及与“从[他们和]子而出者”所形成之合一的关系被改写为永世“同子联合”，改变了英文见证的句法关系；此外个别比喻和括号内补文可更准确地保留。
  naturalness: 整体庄重、可读，符合现代书面普通话。将“他们彼此联合，也同……联合”调整为“他们彼此之间、以及同……之间所形成的合一”，既消除中文搭配生硬，也更贴合见证的关系结构。
  terminology: “教会”“永世”“父性的圆满”“深处”“存立”“存在者”等译语可维持；“永世”脚注适当说明其并非单纯时间单位。“精种”保留文本的生殖性隐喻，但正文中“仿佛用一句话”应明确原文的比喻结构。
  issues:
  - severity: high
    issue: 首段将“with those who have gone forth from [them and] with the Son”的关系改作“同子联合”。
    rationale: 英文见证所述是永世所构成的合一，涉及他们彼此及同“从[他们和]子而出者”的关系；草稿将“子”直接作为联合对象，且漏去“从……而出者”，属于实质性关系改变。因见证本身有补文和歧义，修订应保留方括号与句法开放性。
  - severity: medium
    issue: “As with a word he begot them”译为“他用话语生了他们”。
    rationale: 原见证含比较语气（as with），不宜无标记地改成工具手段。译作“他仿佛用一句话生了他们”可保留比喻而不额外解释。
  - severity: low
    issue: 首段“凭着教会所[具有]的性质和属性”未显出见证中“(the Church) [exists]”的存在关系。
    rationale: “所具有”可理解，却将“存在于其中”转换为占有关系。改为“凭着（教会）[存在于其中]的性质和属性”更贴近审校底本，并保留编辑补文标示。
  revised_text: "[……]教会存在于父与子所具有的性质和属性之中，正如我从开头所说的。因此，教会存立于无数永世[a]的生出之中。凭着（教会）[存在于其中]的性质和属性，这些永世也以无法计数的方式生出。这是因为，这些永世[构成]教会的合一，就是他们彼此之间、以及同[那些]从[他们和]子而出者之间所形成的合一；他们正是为子的荣耀而存在。\n\n\n      因此，心智不可能领会<他们>，因为他是那地方的完满；言语也无法描述他们，因为他们不可言说、不可命名、不可把握。只有他们能为自己命名，也只有他们能领会自己，因为他们并不扎根于这些地方。那地方的众者不可言说，在那既是[方式]又是尺度的秩序中不可计数；他们是欢欣，是那未受生、无名、不可命名、不可把握、不可见、不可思议者的喜乐。这就是父性的圆满，以致他的丰富成为一次生出。\n\n\n      [ ] [……]永世永远住在思想中，因为父对他们而言如同思想，也如同居所。他们的世代一经确立，那位完全掌管一切者就想要把握并生出[……]中所欠缺的，于是他生出了那些[在]他里面的。然而，因为他[本来就是]如此，他是一个泉源，丰沛的水从中涌流，却丝毫不使它减少。\n\n\n      当他们住在父的思想中，也就是住在隐秘的深处时，那深处认识他们，他们却不能认识自己所住的深处。他们也不可能认识自己，或认识任何别的事物。换句话说，他们与父同住，但他们的存在还不是为着自己。相反，他们仅仅像种子那样存在，因此显明他们的存在如同胎儿。他仿佛用一句话生了他们；他们以种子的形态存立，而那些他将要生出的，还没有从他那里进入实存。\n\n\n      [ ]父是首先想到他们的那一位。他撒下一个思想，如同撒下精种；这不只是要他们为他而存在，也是要他们为自己而存在，使他们在他的思想中作为有认知的实体存在，也使他们为自己而存在。为了使他们能知道那为他们而存在的是什么，他慷慨地[赐下了]最初的形态；为了使他们能知道那位为他们而存在的[父是谁]，他借着一个向他们宣告的声音，把“父”这个名赐给他们；那声音宣告：凡存在的，都是借着这个属于他们的名而存在。因为他们获得存在，是由于那住在这名中的崇高；这崇高却是他们未曾认识的。婴孩尚在母腹中时，已有自身所需的一切，却还看不见那撒种者。因此，他们唯一的任务就是寻找他：承认他的存在，不断渴望发现那存在的是什么。\n\
    \n\n      然而，完美的父是良善的；他没有向他们<封闭>自己，让他们永远只存在于他的思想中，反而也准许他们为自己而获得实存。同样，他也赐给他们礼物，使他们能认识“存在者”[b]，就是那位永远认识自己的。[ ] [……]获得形态，[得以知道]“存在者”确实存在；这就像人生在此处时进入光中，好让他们看见生他们的人。"
