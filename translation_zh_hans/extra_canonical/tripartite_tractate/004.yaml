translation:
  language: zh_hans
  text: '[……]教会存在于父与子所具有的性质和属性之中，正如我从开头所说的。因此，教会存立于无数永世[a]的生出之中。凭着教会所[具有]的性质和属性，这些永世也以无法计数的方式生出。这是因为，这些永世[构成]教会的合一；他们彼此联合，也同[那些]从[他们]而出的联合，并且同子联合——他们正是为子的荣耀而存在。


    因此，心智不可能领会<他们>，因为他是那地方的完满；言语也无法描述他们，因为他们不可言说、不可命名、不可把握。只有他们能为自己命名，也只有他们能领会自己，因为他们并不扎根于这些地方。那地方的众者不可言说，在那既是[方式]又是尺度的秩序中不可计数；他们是欢欣，是那未受生、无名、不可命名、不可把握、不可见、不可思议者的喜乐。这就是父性的圆满，以致他的丰富成为一次生出。


    [ ] [……]永世永远住在思想中，因为父对他们而言如同思想，也如同居所。他们的世代一经确立，那位完全掌管一切者就有意把握并生出[……]中所欠缺的，于是他生出了那些[在]他里面的。然而，因为他[本来就是]如此，他是一个泉源，丰沛的水从中涌流，却丝毫不使它减少。


    当他们住在父的思想中，也就是住在隐秘的深处时，那深处认识他们，他们却不能认识自己所住的深处。他们也不可能认识自己，或认识任何别的事物。换句话说，他们与父同住，但他们的存在还不是为着自己。相反，他们仅仅像种子那样存在，因此显明他们的存在如同胎儿。他用话语生了他们；他们以种子的形态存立，而那些他将要生出的，还没有从他那里进入实存。


    [ ]父是首先想到他们的那一位。他撒下一个思想，如同撒下精种；这不只是要他们为他而存在，也是要他们为自己而存在，使他们在他的思想中作为有认知的实体存在，也使他们为自己而存在。为了使他们能知道那为他们而存在的是什么，他慷慨地[赐下了]最初的形态；为了使他们能知道那位为他们而存在的[父是谁]，他借着一个向他们宣告的声音，把“父”这个名赐给他们；那声音宣告：凡存在的，都是借着这个属于他们的名而存在。因为他们获得存在，是由于那住在这名中的崇高；这崇高却是他们未曾认识的。婴孩尚在母腹中时，已有自身所需的一切，却还看不见那撒种者。因此，他们唯一的任务就是寻找他：承认他的存在，不断渴望发现那存在的是什么。


    然而，完美的父是良善的；他没有向他们<封闭>自己，让他们永远只存在于他的思想中，反而也准许他们为自己而获得实存。同样，他也赐给他们礼物，使他们能认识“存在者”[b]，就是那位永远认识自己的。[ ] [……]获得形态，[得以知道]“存在者”确实存在；这就像人生在此处时进入光中，好让他们看见生他们的人。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永世”译自通常转写为 aeon 的术语；此处为复数，可指从父而出的永恒实体或领域，不只是普通意义上的漫长时代。
    reason: 核心宇宙论术语在现代中文中容易被误读为单纯的时间单位。
  - marker: b
    text: “存在者”也可译作“那位存在的”。原句在“存在是什么”与作为称号的“存在者”之间形成有意的张力。
    reason: 保留本体论表达及可能的称号性质。
lexical_decisions:
- source_word: Church
  choice: 教会
  rationale: 保留作品中的共同体与神学术语，不将其改写为一般性的“群体”。
- source_word: aeons
  choice: 永世
  rationale: 作为本篇宇宙论中的复数实体术语；用“永世”兼顾时间性与位格化语境，并加脚注避免读者只按普通时代理解。
- source_word: fullness of paternity
  choice: 父性的圆满
  rationale: 保留抽象的父性概念及“圆满”意象，不擅自解释为具体位格集合。
- source_word: depth
  choice: 深处
  rationale: 保留空间隐喻及可能的称号用法；不直接音译或教义化处理。
- source_word: spermatic seed / spermatic form
  choice: 精种／种子的形态
  rationale: 保存生育与种子隐喻，同时采用现代中文可理解且庄重的表达。
- source_word: He Who Is
  choice: 存在者
  rationale: 保留作为称号的本体论力度，并以引号和脚注提示也可理解为“那位存在的”。
- source_word: subsists
  choice: 存立
  rationale: 区别于普通的“存在”，保留原文关于持续实存状态的哲学色彩。
theological_decisions:
- issue: “he being the perfection of that place”中代词的所指
  choice: 译作“因为他是那地方的完满”
  alternative: 译作“因为他们是那地方的完满”或将“他”指向心智
  rationale: 见证文本保留阳性单数而语义所指不明；正文不强行确定先行词，以保存歧义。
- issue: 永世与教会的关系
  choice: 译作“这些永世[构成]教会的合一”
  alternative: 解释为永世本身就是教会或教会由其联合产生
  rationale: 保留见证文本的修复标记与关系张力，不将宇宙论关系系统化。
- issue: “为他的缘故／为自己的缘故而存在”
  choice: 保留“为他而存在／为自己而存在”
  alternative: 解释为目的、利益或独立人格
  rationale: 原句可能兼具目的性与存在自主性的含义，中文保持开放。
- issue: “the one who knows himself eternally”与“what is”的关系
  choice: 译作“认识‘存在者’，就是那位永远认识自己的”
  alternative: 译作“认识存在本身，也就是永远自知者”
  rationale: 既呈现同位关系，又不完全消除“存在／存在者”之间的哲学张力。
- issue: 生出与流溢的神学图景
  choice: 保留“生出”“泉源”“不减少”等并列意象
  alternative: 统一解释为创造或发出
  rationale: 避免将文本纳入某一宗派的创造论或流溢论框架。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。方括号、空括号和省略号保留残卷缺损或编者补复信号；尖括号保留见证文本中的校补。因科普特语原文复核尚未完成，本稿严格以所给公共领域英文见证为临时依据，并在代词、句法残缺和术语处避免过度确定。
