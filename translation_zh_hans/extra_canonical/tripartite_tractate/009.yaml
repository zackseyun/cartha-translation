base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/009.yaml
  text: 'The whole system of the aeons has a love and longing to discover the Father perfectly and completely, and this is their unrestricted unity. Although the Father reveals himself eternally, he did not desire that they know him automatically. Instead, he allows himself to be grasped through searching, while reserving his unsearchable primal essence to himself. The Father gave the aeons basic desires because they form places along the path that leads to him, like a school that trains conduct. He has given them:


    faith in him and prayer to the one they do not see,

    and a strong hope in the one they do not grasp,

    and a fruitful love that looks toward what it does not see,

    and a worthy understanding of the eternal mind,

    and a blessing of wealth and freedom,

    and an understanding that longs to glorify the Father for <his> thought.


    [] By his will, the exalted Father is known through the Spirit that breathes within the Totalities. He even gives them the idea of searching for the unknown one, as when a pleasant aroma makes someone search for its source, because the Father’s aroma surpasses natural aromas. His sweetness gives the aeons indescribable pleasure and produces in them the idea of joining with him, who desires them to know him in a unified way, and of helping one another in the Spirit planted within them. Although a great weight presses down on them, they are renewed in an indescribable way. They cannot be separated from that in which they have been placed in a way they cannot grasp. They will not speak but will remain silent concerning the Father’s glory, concerning the one who can speak. Nevertheless, they will receive a form from him.


    Although speech cannot describe him, he revealed [himself.] They possess <him>, concealed within a thought. This is why the aeons remain silent about how the Father exists in his form, his essence, and his greatness, [] while the aeons are worthy to know through his Spirit that he cannot be named or comprehended. Through his spirit—the trace of seeking him—he gives them the ability to grasp him and speak about him. Each aeon is a name, <that is>, each one is a quality and power of the Father, because he exists in many names that are mixed together and are in harmony with one another. He can be spoken of because of the riches of speech. In the same way, although the Father is a single name because of his unity, he possesses countless qualities and names.'
translation:
  language: zh_hans
  text: '整个诸永世的体系都怀有爱与渴望，要完完全全地发现父；这就是他们不受拘束的合一。父虽然永远启示自己，却不愿他们自然而然地认识他；他让自己在寻求中被领会，同时把自己那不可探究的原初本质保留于自身。父把根本的渴望赐给诸永世，因为这些渴望构成通往他的道路上的各处，仿佛一所训练行为的学校。他赐给他们：


    对他的信，以及向那看不见者所作的祈祷；


    对那无法领会者坚定的盼望；


    一种富有成果的爱，仰望它所看不见的；


    对永恒心智合宜的理解；


    财富与自由的福分；


    以及一种理解，渴望因〈他的〉意念而荣耀父。[a]


    〔缺文〕[b] 崇高的父按自己的旨意，借着那在诸全体之内吹息的灵而被认识；这灵甚至把寻求那未知者的意念赐给他们。正如芬芳会使人寻找香气的源头，父的馨香也远胜这些天然的香气。他的甘美使诸永世得到无法言说的喜悦，又在他们里面生出与他交融的意念——他愿意他们以合一的方式认识他——并使他们在那栽植于他们里面的灵中彼此帮助。虽然沉重的重担压在他们身上，他们却以无法描述的方式重新得力；因为他们无法与那以不可领会的方式安置他们于其中的分离。他们不会发言，而要对父的荣耀、对那位能够发言者保持沉默；然而，他们仍要从他获得一种形态。


    言语虽然无法描述他，他却启示了〔自己〕。[c] 他们在一个意念中隐秘地拥有〈他〉。[d] 因此，诸永世对父如何以他的形态、本质和伟大而存在保持沉默。〔缺文〕[e] 然而，诸永世配借着他的灵得知：他既不可命名，也无法领会。借着他的灵——寻求他的踪迹——他赐给他们领会他、谈论他的能力。每一个永世都是一个名字，〈也就是说〉，每一个都是父的一种属性和能力；因为他存在于许多名字中，这些名字彼此交融、互相和谐。由于言语的丰富，人可以谈论他。同样，父虽因其合一而是一个名字，却拥有无数的属性和名字。'
