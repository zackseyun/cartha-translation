lexical_decisions:
- source_word: aeons
  choice: 诸永世
  rationale: 采用早期诺斯替文献中较透明的音义兼顾译法；“诸”保留复数，“永世”兼具时空与位格化层次，避免仅译作“时代”而抹去宇宙论含义。
- source_word: the Father
  choice: 父
  rationale: 保持原文核心称谓的简洁与尊严，不擅自扩展为特定教派用语。
- source_word: the Totalities
  choice: 诸全体
  rationale: 保留该术语不寻常的复数和宇宙论色彩，避免顺译成单一的“万有”而消除源文形式上的张力。
- source_word: grasped / comprehend
  choice: 领会／无法领会
  rationale: 按语境表达认识上的把握，而非物理抓取；同段适度保持词汇呼应。
- source_word: mind
  choice: 心智
  rationale: 比“思想”更适合作为抽象、可能具有本体论意味的名词，同时不额外人格化。
- source_word: mixing with him
  choice: 与他交融
  rationale: 保留结合意味，同时避免现代汉语“混合”可能产生的粗糙物质联想。
- source_word: form
  choice: 形态
  rationale: 保持本体论语境中的开放性，不径自解释为“形象”“身体”或柏拉图式“理念”。
- source_word: trace
  choice: 踪迹
  rationale: 保留原见证文本中语法和意象的暧昧性，不将其解释成固定的神学机制。
theological_decisions:
- issue: 父的自我启示与不可探究性之间的张力
  choice: 同时保留“永远启示自己”与“把不可探究的原初本质保留于自身”
  alternative: 将其调和为父只作部分启示
  rationale: 源文刻意并置启示与隐藏，不应在翻译中消解。
- issue: 诸永世是否自动认识父
  choice: 译为“不愿他们自然而然地认识他”
  alternative: 译为“不愿他们认识他”
  rationale: 括注的 automatically 限定认识的方式，而非否定父愿意被认识；后文也明说他愿他们认识他。
- issue: 诸永世与父的关系
  choice: 保留“每一个永世都是一个名字……父的一种属性和能力”
  alternative: 解释为诸永世只是父所造的独立受造物
  rationale: 原段呈现复杂的参与和表显关系，不能导入后期宗派本体论予以单向裁定。
- issue: “灵”的身份
  choice: 统一译作“灵”，不加“圣”
  alternative: 译作“圣灵”
  rationale: 源见证仅作 Spirit/spirit，且语境属于该文献自身的宇宙论；加“圣”会导入未经文本明确支持的认同。
- issue: “那位能够发言者”所指
  choice: 保留指代模糊
  alternative: 明确解释为父、子或某一永世
  rationale: 见证文本句法含混，翻译不应擅自指定其身份。
