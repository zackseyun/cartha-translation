  revised_text: '在所有执政者之上，他设立了一位不受任何人命令的执政者。他是他们众人的主，也就是“道”借着自己的意念所造出的面貌，作为“万有之父”的表象。因此，他以一切与他相似的<名号>〔b〕为妆饰，因为他具有各样特质和荣耀的属性。于是，他甚至被称为“父”、“神”、“造物主”〔a〕、“王”、“审判者”、“地方”、“居所”和“律法”。“道”用他作手，整顿下界诸事的工作；又用他作口，说出将要预言的事。他发言并加以整顿；当他看见（自己的工作）伟大、美好而奇妙，就欢喜快乐，仿佛[]那些事都是他凭自己的意念说出、做成的；他却不知道，自己里面的运行源于那灵——那灵按预定的方式推动他，使他去做自己碰巧想做的一切。


    至于那些从他而生的事物，他一说到它们，它们便产生了，成为属灵诸境的仿像；我们先前谈论形像时已经提到这些属灵诸境。他<所做的>不只是作工，因为他既被指定为自己救恩计划的父，就不仅借着自己和众种子生育，也[借着]那将[经过他]降到下界各处的蒙选之灵生育。他所做的[不只是]说出自己的属灵话语，<而是>借着那呼喊并生出超越其自身本性之事物的灵，以隐秘的方式说出来。由于按他的本性，他是神、是父，并拥有其他一切尊贵的称号，他便以为这些称号都属于自己的本性。


    他为顺从自己的人设立了安息；至于不顺从他的人，<他>也<设立了>刑罚。乐园和国度与他同住，此外还有住在那先于他而存在的永世〔a〕里的一切。它们比复制品更有价值，因为它们与那意念相关。这种关系仿佛可以比作[]影子与衣裳，因为他无法看见一切存在之物实际上如何存在。


    他设立工人和仆役，协助他将要做、将要说的事；因为无论他在哪里运作，都留下自己的面貌和美好的名号，产生并宣告他所思想的一切。他从自己的本质中，[在]自己的领域设立光的可见形像和[那些]（不可见的）属灵[境域]。这样，各处都由他装饰美化，映照那位安置它们者的形像，它们也就这样被建立起来。乐园、国度、安息、应许，以及执行他旨意的众多仆役，虽然都是掌权的主，却都被置于那位指派它们的主之下。


    在这样听了他以后，他便把那些<构成>这体系之源<的>光安置在下界诸事的秩序之上。不可见的灵就是这样推动他，使他[]倾向于借自己的仆役施行统治；他也用这仆役作自己的手、作自己的<口>，甚至作自己的面貌。他制定秩序，发出威吓，造成恐惧，好让那些出于无知而行事的人……能够守住所[分给他们看守的]地方，因为他们被辖制自己的执政者用[锁链]捆绑在各自的地方。


    物质的整个本性[分为]三类：属灵的“道”从想象和骄傲中造出[第一类]权势，按属灵的等次把它们列在首位。至于这些权势因贪恋统治而造出的那些，他把它们列在中间的等次，因为它们[由此]<成了>贪恋统治的权势，可以管辖位于它们之下的建制，并以强力发出强制性的命令。至于那些从嫉妒、妒忌以及这类倾向所生的其他一切后裔，他把它们列入奴役的等次，让它们控制最外层的边界，并命令一切存在之物和一切生育。从它们而来的是那些使人猝死的（疾病实体）；它们热衷于生育，尽管在自己起初来源、也将再次归回的地方，它们原本什么也不是。因此，他在它们之上设立掌权的权势，不停地作用于物质，使[]现存者的后裔也能同样不停地存在，因为这就是它们的荣耀。'
