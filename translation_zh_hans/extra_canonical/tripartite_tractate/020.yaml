lexical_decisions:
- source_word: archon
  choice: 执政者
  rationale: 保留诺斯替文献中兼具统治者与宇宙权势之意的技术性称谓，避免泛化为普通官员。
- source_word: Word
  choice: “道”
  rationale: 以中文宗教语境中自然且庄重的称谓表达 Logos，同时用引号提示其为位格化或技术性名称。
- source_word: Father of the Totalities
  choice: 万有之父
  rationale: “万有”自然表达 Totalities 的总体性，又不把它缩减为可见宇宙。
- source_word: Demiurge
  choice: 造物主
  rationale: 采用通行中文术语，并以脚注说明本文中的特定从属角色，避免与至高之父自动等同。
- source_word: aeon
  choice: 永世
  rationale: 兼顾时间与超越领域的含义；脚注保留其语义范围。
- source_word: repose
  choice: 安息
  rationale: 保持救赎性、终末性的宗教语感，不弱化为普通休息。
- source_word: powers
  choice: 权势
  rationale: 表达具有位格或实体色彩的宇宙力量，而非抽象能力。
- source_word: matter
  choice: 物质
  rationale: 直译其宇宙论意义，保留与属灵领域之间的张力。
theological_decisions:
- issue: 造物主与万有之父的关系
  choice: 明确译出造物主是“道”所造、作为万有之父表象且受道使用者
  alternative: 把造物主直接称作至高神或万有之父
  rationale: 原见证维持表象、代理与无知之间的张力，不应按后来的教义体系消解。
- issue: 造物主的自我认识与灵的推动
  choice: 保留他误以尊称出于自身本性、却不知道灵在其中运行的陈述
  alternative: 解释为他有意识地顺服圣灵
  rationale: 原文强调其无知与被推动，不能把这种张力改写为自觉合作。
- issue: “灵”的指涉
  choice: 统一译作“灵”，不擅自加上“圣”或判定各处必为同一位格
  alternative: 全部译作“圣灵”
  rationale: 所给见证有 Spirit、chosen Spirit、invisible Spirit 等表述，具体关系仍有歧义。
- issue: 末段疾病与生育者的语法指涉
  choice: 按见证保留为带实体性的疾病及其复数代词
  alternative: 将其解释为恶魔、病菌或人类繁殖
  rationale: 原句语法和宇宙论指涉不稳定，应避免超出证据作具体化解释。
- issue: 第五段代词指涉
  choice: 保留“他这样听了他的话以后”等含混代词
  alternative: 直接指定为造物主听从道或某一灵
  rationale: 英译见证本身未消除代词歧义，而科普特语复核尚待完成。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话；保留原见证的尖括号、方括号、圆括号和缺文符号，不自行补齐歧义。宇宙论技术词尽量稳定一致，同时避免引入特定宗派对“造物主”“灵”或“道”的预设解释。
