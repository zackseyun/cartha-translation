translation:
  language: zh_hans
  text: '形态流动不定的质料，是那借着众权能而弥漫的盲目之因。[……]在它们里面，这一切[……]，因为它们一同生出，也一同[毁灭]。置于[右边者]与左边者之间的意念，是一种[模仿]的能力。最初那些存在者所想要造出的每一个，仿佛都是随身体而行之影子的投射；这就<构成了>可见受造物的根基。


    形象、表象和相似之物的整个秩序之所以预备成形，是为了那些需要教育、教导和塑造的人；这一切如镜子一般供他们使用，使微小的能一步一步成长。正因如此，他最后才造人，先为他们预备并供应那些为他们而造的事物。


    人的受造和其他一切事物一样。属灵的道以看不见的方式推动它们，并借着造物主[a][]和他的天使仆役使它们完备；僭妄及其执政者也一同参与塑造的工作。人如同地上的影子，为要使他们仿佛是与诸圆满总体[b]隔绝的。人又是他们众者共同造出的，就是右边者和左边者所造的；各个等次都赋予[人一种形态，正如]（诸圆满总体）本身曾被（塑造）一样。


    道所造的[形态]有缺陷，仿佛患了软弱的[病症]，因为他使其陷入[遗忘]、无知、[缺乏]和其他一切软弱之中。道只赋予最初的形态，<这是他借着造物主在无知中赐给人的>，好使人认识到有某种崇高者存在，并认识到自己需要[它]。这就是先知所称的“活的灵”“崇高永世[c]的气息”和“不可见者”；这也是使起初没有生命的身体得着生命的活魂，而没有生命就是无知。


    因此，应当认为，最初之人的魂源于属灵的道，造物主却以为是自己造了它。那吹入的气息经过他，如同经过一张口。


    造物主也从自己的本质中把众魂送到下方，因为[他]也具有生育的能力，[]<他是>从父的表象产生的。左边者也造出一种属于他们自己的人，因为他们同样具有<存在>的相似形态。


    属灵的本质是统一之物，也是单一的表象；[然而]它的软弱却呈现为[多种]形态。至于属魂者[d]的本质，其状态是二重的：它有知识，也赞美崇高者，却又因僭妄的倾向而<同样>趋向邪恶。至于属质料者的本质，其样态各不相同，甚至呈现多种形态；那是一种占据优势的软弱，带有多种倾向。


    所以，最初的人是多样的塑造、多样的创造，也是左边者和右边者的储藏之所；他又是属灵的道，其所关切的分属那使他得以存在的两种本质。


    因此，经上说，有一个乐园为他栽植，使他可以吃三类树的果实；因为那是一个包含三个等次的园子，也因为它带来欢愉。他里面高贵而蒙拣选的本质，比<受造界>更崇高，这对他们<构成了>伤害。于是，他们颁下命令，警告他将有严重的危险临到，[]就是死亡。他只获准品尝并享用那些坏树；至于另一棵树，就是二重性之树，他不准[他]吃，更不用说生命树了。这样是为免他获得与他们[同等的]尊荣，也为免[他……]他们。


    人借着那称为“蛇”的邪恶权能受了迷惑；它比一切邪恶权能都更狡猾，并且按照那些属于记忆和欲望者的谋划行事。它使人违背命令，好叫他死亡。于是，人被逐离那地方，失去那里的一切欢愉。


    这就是他们用来惩罚他的驱逐：他被逐离属于相似形态者和属于表象者的欢愉。但这（其实）是天意的作为，为要使人认识到，享乐只能持续片刻，与永恒安息之地截然不同。灵早已命定这事；他预先计划，要让人经历那极大的恶，就是死亡——对诸圆满总体全然无知——也要让人尝遍由此而生的一切恶；等到经历了情欲、忧虑以及由它们产生的事之后，人便要获得那最大的[]善，就是永生——对诸圆满总体有完全的认识，并得着一切美善。


    由于最初之人的悖逆，死亡掌了权。只要它仍拥有[统治权]并占据优势，它惯常杀害每一个人；它得着这权柄如同得着国度，是因着父的旨意，并按照<先前所说的>救恩计划。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “造物主”指本文所说借天使参与塑造可见世界与人类者；文中将他与至高的“父”区分。
    reason: 防止普通读者把两个称谓无条件视为同一对象，同时不加入超出本段的教派体系。
  - marker: b
    text: “诸圆满总体”译自意为“总体、全体”的术语，在本文中可指神圣圆满领域及其整体；单数与复数的界线有时并不清楚。
    reason: 保存原见证中 Totality/Totalities 的集合性和术语歧义。
  - marker: c
    text: “永世”在这类文献中不只可指漫长时代，也可指永恒领域或其中的超世存在。
    reason: 避免把 aeons 单纯理解为时间单位。
  - marker: d
    text: “属魂者”是本文三分结构中的一类，与“属灵者”和“属质料者”相对；这里的“魂”不是泛指人的全部内在生命。
    reason: 帮助读者理解专门术语及段落结构，而不替文本作宗派化解释。
lexical_decisions:
- source_word: Demiurge
  choice: 造物主
  rationale: 采用现代中文较易理解且在相关古代文献研究中通行的称呼；以脚注说明其语境，避免直接等同于至高之父。
- source_word: Totalities / Totality
  choice: 诸圆满总体
  rationale: 兼顾复数或集合性的‘一切圆满者’与整体性概念，避免仅译作‘万有’而消解本文特有的宇宙论含义。
- source_word: aeons
  choice: 永世
  rationale: 保留其兼具永恒领域、时代及位格化存在的语义张力，并以脚注提示专门含义。
- source_word: soulish ones
  choice: 属魂者
  rationale: 与‘属灵’和‘属质料’形成文中明确的三分结构，不释义为‘天然的人’，以免引入后世教派解释。
- source_word: presumption
  choice: 僭妄
  rationale: 表达越分自高、妄自行动的负面含义，同时保留其在文中近乎人格化或权能化的可能性。
- source_word: representation
  choice: 表象
  rationale: 与‘形象’及‘相似之物/相似形态’区分，维持原段落的术语并列。
- source_word: spiritual Word
  choice: 属灵的道
  rationale: 保留‘Word/Logos’的神学术语色彩，但不擅自认定其与某一特定教义体系中的位格完全等同。
theological_decisions:
- issue: 造物主与至高之父的关系
  choice: 分别译作“造物主”与“父”
  alternative: 把二者都译作“神”或“创造主”
  rationale: 本文明确区分二者；合并称谓会消除其宇宙论张力。
- issue: 人的魂之真正来源
  choice: 保留“源于属灵的道，而造物主以为是自己造的”这一对照
  alternative: 调和为造物主受托创造灵魂
  rationale: 原文刻意呈现认知与施行之间的张力，不应代为系统化。
- issue: 逐出乐园的性质
  choice: 同时保留惩罚与天意作为的双重描述
  alternative: 只视为刑罚或只视为救赎措施
  rationale: 文本先称其为惩罚，随后又称其为天意；译文不消解这种反转。
- issue: 死亡掌权与救恩计划
  choice: 保留死亡的国度出于父旨意下救恩计划的表述
  alternative: 将死亡仅归因于人的罪或邪恶权能
  rationale: 结尾把人的悖逆、死亡掌权、父的旨意和救恩计划并置，必须保留其神学张力。
- issue: 灵、魂、质料的三分结构
  choice: 分别译作“属灵”“属魂”“属质料”
  alternative: 改写为善、中性、恶三类人
  rationale: 原文讨论的是本质及倾向，不能直接简化成固定道德分类。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。由于科普特文直接校勘尚待完成，本稿依据所给公共领域英文见证起草。方括号、方括号内省略号、空方括号、尖括号和圆括号均保留见证的残缺、补文或编者提示；为避免符号过密，仅在必要处调整中文语序，不把残缺处补成确定意思。
