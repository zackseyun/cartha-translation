  source_fidelity: 在无法直接核对科普特文的前提下，本稿总体紧随所给英文见证，并妥善保留了方括号、空方括号、尖括号与圆括号的编辑信号。仍有几处将见证的叙述性或不确定表达过度明确化：例如“经上说”将 it is said 限定为经文；“这权柄”把 death received [as a] kingdom 的“国度”改为抽象权柄；“最初那些存在者”无据加入“存在者”。另有少数指代和句法可更准确地保留原文的含混。
  naturalness: 译文整体庄重、可读，术语在段内基本一致。修订使若干长句的主从关系更清楚，并避免“人又是属灵的道”这种在中文中容易被误读为身份断言的突兀表达；同时不消除原见证本身的宇宙论张力与残缺。
  terminology: “造物主”“属灵的道”“诸圆满总体”“永世”“属魂者”“属质料者”“僭妄”等关键术语的选择可保留。建议将 paradise 译作“乐园”而不加“经上”，并将 likeness 一贯表为“相似形态/相似者”，避免与“表象”混同。脚注均有明确锚点，内容克制且不强加宗派解释。
  issues:
  - severity: medium
    issue: “经上说”
    rationale: 英文见证仅作 This is why it is said，并未指定“经上”或某一经文传统；加入“经上”会不必要地缩窄来源和话语层次。
  - severity: medium
    issue: “它得着这权柄如同得着国度”
    rationale: 见证说死亡 received [as a] kingdom，即“得着国度/王权”；译为“这权柄”改变了所受领之物，且弱化国度意象。
  - severity: low
    issue: “最初那些存在者”
    rationale: Everyone the first ones desire to make 中的 first ones 未明示为“存在者”；补入该名词会使残缺语境显得过于确定。
  - severity: low
    issue: 乐园段“他不准[他]吃”的指代
    rationale: 原见证在此的主语/宾语本已不稳定。中文宜标作“他们不准[他]吃”，与前文复数“他们颁下命令”相衔接，但仍保留方括号所示缺损。
  - severity: low
    issue: “人又是属灵的道”
    rationale: 原句为并列的复杂描述，直译会让现代中文读者误解为把“人”简单等同于“道”。改为“并且其中有属灵的道”较自然，仍保留其利益分属两种本质的说法。
  revised_text: '形态流动不定的质料，是那借着众权能而占优势的盲目之因。[……]在它们里面，这一切[……]，因为它们一同生出，也一同[毁灭]。置于[右边者]与左边者之间的意念，是一种[模仿]的能力。那些最初者想要造出的每一个，仿佛都是随身体而行之影子的投射；这就<构成了>可见受造物的根基。



    形象、表象和相似形态的整个秩序之预备，乃是为了那些需要教育、教导和如镜子所供给之塑造的人，使微小者能一步一步成长。正因如此，他最后才造人，先为他们预备并供应那些为他们而造的事物。



    人的受造和其他一切事物一样。属灵的道以看不见的方式推动它们，并借着造物主[a][]和他的天使仆役使它们完备；僭妄及其执政者也一同参与塑造的工作。人如同地上的影子，为要使他们仿佛是与诸圆满总体[b]隔绝的[那些]。人又是他们众者共同造出的，就是右边者和左边者所造的；各个等次都赋予[人一种形态，正如]（诸圆满总体）本身曾被（塑造）一样。



    道所造的[形态]有缺陷，仿佛软弱的[病症]，因为他使其陷入[遗忘]、无知、[缺乏]和其他一切软弱之中。因为道只赋予最初的形态，<这是他借着造物主在无知中赐给人的>，好使人认识到有某种崇高者存在，并认识到自己需要[它]。这就是先知所称的“活的灵”、“崇高永世[c]的气息”和“不可见者”；这也是使起初没有生命的身体得着生命的活魂，而没有生命就是无知。



    因此，应当认为，最初之人的魂源于属灵的道，造物主却以为是自己造了它。那吹入的气息经过他，如同经过一张口。



    造物主也从自己的本质中把众魂送到下方，因为[他]也具有生育的能力，[]<他是>从父的表象产生的。左边者也造出一种属于他们自己的人，因为他们同样具有<存在>的相似形态。



    属灵的本质是统一之物，也是单一的表象；[而]它的软弱却是一种[多种]形态的状态。至于属魂者[d]的本质，其状态是二重的：它有知识，也赞美崇高者，却又因僭妄的倾向而<也>趋向邪恶。至于属质料者的本质，其样态各不相同，甚至呈现多种形态；那是一种在多种倾向中占优势的软弱。



    所以，最初的人是多样的塑造、多样的创造，也是左边者和右边者的储藏之所；并且其中有属灵的道，它的所关切者分属那使它得以存在的两种本质。



    因此，说有一个乐园为他栽植，使他可以吃三类树的果实；因为那是一个包含三个等次的园子，也因为它供应欢愉。他里面高贵而蒙拣选的本质，比<受造界>更崇高，这对他们<构成了>伤害。于是，他们颁下命令，警告他将有严重的危险临到，[]就是死亡。他只获准品尝并享用那些坏树；至于另一棵树，就是二重性之树，他们不准[他]吃，更不用说生命树了。这样是为免他获得与他们[同等的]尊荣，也为免[他……]他们。



    人借着那称为“蛇”的邪恶权能受了迷惑；它甚至比一切邪恶权能都更狡猾，并且按照那些属于记忆和欲望者的谋划行事。它使人违背命令，好叫他死亡。于是，人被逐离那地方，失去那里的一切欢愉。



    这就是他们用来惩罚他的驱逐：他被逐离属于相似形态者和属于表象者的欢愉。但这（其实）是天意的作为，为要使人认识到，享乐只能持续片刻，与永恒安息之地截然不同。灵早已命定这事；他预先计划，要让人经历那极大的恶，就是死亡——对诸圆满总体全然无知——也要让人尝遍由此而生的一切恶；等到经历了情欲、忧虑以及由它们产生的事之后，人便要获得那最大的[]善，就是永生——对诸圆满总体有完全的认识，并得着一切美善。



    由于最初之人的悖逆，死亡掌了权。只要它仍拥有[统治权]并占据优势，它惯常杀害每一个人；它得着[作为一个]国度的地位，是因着父的旨意，并按照<先前所说的>救恩计划。'
  revised_footnotes:
  - marker: a
    text: “造物主”指本文所说借天使参与塑造可见世界与人类者；文中将他与至高的“父”区分。
    reason: 防止普通读者把两个称谓无条件视为同一对象，同时不加入超出本段的教派体系。
  - marker: b
    text: “诸圆满总体”译自意为“总体、全体”的术语，在本文中可指神圣圆满领域及其整体；单数与复数的界线有时并不清楚。
    reason: 保存原见证中 Totality/Totalities 的集合性和术语歧义。
  - marker: c
    text: “永世”在这类文献中不只可指漫长时代，也可指永恒领域或其中的超世存在。
    reason: 避免把 aeons 单纯理解为时间单位。
  - marker: d
    text: “属魂者”是本文三分结构中的一类，与“属灵者”和“属质料者”相对；这里的“魂”不是泛指人的全部内在生命。
    reason: 帮助读者理解专门术语及段落结构，而不替文本作宗派化解释。
  revision_rationale: 修订以所给英文见证为审校基准；直接科普特文复核仍待进行。所有见证中的缺文、补文和编辑性符号均保留。改动集中于删除无据限定、恢复“国度”意象、改善中文指代与并列句结构，并避免将原文未指定的“说”解释为“经上说”。术语体系和原稿四则脚注均予保留。
