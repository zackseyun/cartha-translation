translation:
  language: zh_hans
  text: '关于蒙拣选者，我们还可以说许多话，[]而且说这些也是合宜的；不过，我们仍须更多谈论蒙召者，就是那些被称为“右边的人”的，免得把他们忘了。我们先前已经详尽谈过他们，仿佛那已经足够。那么，为什么我们当时只谈了一部分呢？


    我曾说，凡从圣言而生的——无论是出于对恶者的审判，还是出于与恶者争战的忿怒，或是出于离开恶者的回转，也就是归向高处者；或是出于祈祷和对先存者的记念；或是出于盼望和信心，相信自己的救恩可以借着善行[赢得]——这一切都被看为配得，因为他们出于良善的倾向，而使他们产生的原因，乃是来自“那位存在者”的一个意念。


    我还曾说，在圣言甘愿以不可见的方式与他们相联以前，那位崇高者就把前面所说的意念赐给了他们，因为他们[听从]了它；[]这意念成了他们存在的原因。他们得救时并没有自高，仿佛在他们以前什么都不存在；反而承认自己的存在有一个起源，并且渴望认识那位在他们以前就已存在者。


    我还曾说，当那如闪电显现的光启示出来时，他们俯伏敬拜，并且见证说，这光是为拯救他们而显现的。


    我曾说，不但那些从圣言而生的会得到美善之物，就连他们按照良善倾向所生出的，也会因恩赐的丰盛而享受安息。甚至那些由掌权欲而生、里面有掌权欲种子的人，若与具有良善倾向的人同工，并且有意离弃对虚空而消逝之荣耀的贪恋，为要遵守荣耀之主的诫命，[]也会得到善行的赏报；他们不取短暂而微不足道的尊荣，反要承受永恒的国。


    我们有必要重述先前的论述；但现在，为了作出连贯的论证，我们必须把因、果和<证据>相互联系起来，说明右边的人，无论是纯一的还是混杂的，是否都能得到救恩与安息的恩赐。因此，我们必须按他们信仰的形态，以有说服力的论述证明这一点。


    我们若宣认那在基督里的国度，<就>消除形态、不平等和变化的一切差异。因为终局将再次归于一，正如起初原为一；在那里没有男或女，没有奴仆或自由人，没有受割礼或未受割礼，没有天使或人，基督却在万有之中为万有。那起初并不存在的，怎会被发现已经存在？那并非奴仆者的本性又是什么，既然他将与[]自由人同得一席之地？他们甚至会直接看见，不必仅凭声音所发的一句微言，就相信事情确是如此。


    这是因为，复归于从前所有的，就是归于一。即使有些人因救恩的安排而被高举，受命掌管万物存在的诸般原因，发动众多自然力量并以此为乐——无论他们是天使还是人——他们也必达到国度、坚立和救恩。


    原因如下：那些显现在肉身中的，坚定不移地相信他是那位不可知之上帝的儿子；这位上帝自古以来不可言说，也从来无人能够看见。他们弃绝了先前所敬拜的诸神，以及天上和地上的众主。在<他>尚未被接升以前，甚至仍是婴孩时，他们就见证说他已经在宣讲。当他作为[一个]死人躺在坟墓里时，天使却相信他是活着的，甚至从那位已经死去者[]领受生命。


    他们从前在异教庙宇中所行的许多礼仪和奇事，如今转为对另一位——就是基督——的敬奉。他们对基督的宣认使他们有能力作出这种转变，催促他们快快来到基督面前。他们领受先前异教的预备，只是为了后来弃绝它，转向那位在这低下之地，也就是世上，未曾<受尊崇>者。他们因弃绝异教诸神而[得着]基督，并认出他来自[崇高的]地方；他们曾与他一同从[那里]而来，那是神圣统治之地。他们从前所敬拜、照管和服事者的名号，不过是借来使用的；如今，他们把这些名号转归给那位真正与之相称者。


    然而，直到他被接升以后，他们才认出他是他们的主，在他以上再没有别的主。他们把自己的国权交给他，从自己的宝座上起来[让出座位]，又交出冠冕。不过，他向他们显现，是出于我们已经谈过的那些原因：为医治他们，使他们[转向]关于……[]同伴和天使……的良善意念，以及他们为此所行的丰盛善事。因此，他们被指派承担有益于蒙拣选者的职分，就是把他们的不义带到天上，交付永恒的审判；这审判无可否认，也绝无错误。他们继续为蒙拣选者效力，直到所有人进入尘世的生命，又离开这生命；他们的身体仍[留]在地上，服事他们一切的……，使[自己]与他们一同承受痛苦、逼迫和危险；这些临到圣徒，比临到其他人更多。


    至于那恶<者>的仆役，因为恶本当毁灭<……>，又因那超越一切世界的[共同生活]——就是他们良善的意念和弟兄情谊——而坚定不移。


    教会得蒙那一位救赎以后，就会记念他们是真实的朋友和忠信的仆人；那一位[赐给他们]赏报，这赏报包括充满新房[a]的喜乐，以及那住在她家中的[……]、住在意念中的……和所亏欠的……[]，还有与她同住的基督，以及对万有之父的期待；因为她要把天使赐给他们，引导并服事他们。


    诸永世[b]会记念服事教会的美好意念，<并>要因他们一切的思念而赐下赏报。这是从诸永世流溢出来的：正如基督[成全了他的]旨意，这旨意产生了教会崇高伟大的[事物]，并把这些赐给她；<照样>，这流溢也要成为赐给这些人的意念，为他们预备永远居住的住处。[他们]弃绝缺乏所带来的向下牵引以后，圆满[c]的能力就要凭慷慨的宏大和先存永世的甘美，把他们推向高处。


    [a] “新房”直译为举行婚礼的内室；此处保留本文带有象征意味的婚宴意象。

    [b] “永世”译自一个也可指超越世界之永恒领域或位格化属灵存在的术语；这里保留其复数形式和歧义。

    [c] “圆满”指本文所说与“缺乏”相对的完满境域或状态；不进一步用后期教义解释。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新房”直译为举行婚礼的内室；此处保留本文带有象征意味的婚宴意象。
    reason: 该意象在现代汉语中可能被误解为普通房间，需要简短说明。
  - marker: b
    text: “永世”译自一个也可指超越世界之永恒领域或位格化属灵存在的术语；这里保留其复数形式和歧义。
