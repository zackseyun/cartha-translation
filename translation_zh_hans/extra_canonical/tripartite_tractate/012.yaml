lexical_decisions:
- source_word: conversion called “repentance”
  choice: 称为“悔改”的转变
  rationale: 同时保留 conversion 的一般“转变”义和 repentance 的专门名称，避免把两者压成一个词。
- source_word: the Word
  choice: 圣言
  rationale: 作为位格化称谓处理；“圣言”自然庄重，也避免普通“话语”造成误解。
- source_word: Fullness
  choice: 圆满境界
  rationale: 表达本文宇宙论中的领域或总体性概念，并以较自然的汉语区别于普通形容词“圆满”。
- source_word: Totality
  choice: 全体
  rationale: 保留与 Fullness 的术语区别，不擅自将二者等同。
- source_word: likeness / likenesses
  choice: 肖像
  rationale: 此处似指由相似性形成或衍生的一类存在；“肖像”比“相似”更能作为复数实体称谓，同时保留语义上的不确定性。
- source_word: powers
  choice: 力量
  rationale: 保留其既可指能力、又可指具有实体性的力量之双重可能，不明确译为“权能者”。
- source_word: emanations
  choice: 流溢出来的事物
  rationale: 兼顾宇宙论术语“流溢”及其复数实体含义，避免仅译作抽象过程。
- source_word: pre-existent
  choice: 先存者
  rationale: 用名词化表达保留其作为某一先在存在者的指称，不额外认定其身份。
theological_decisions:
- issue: “悔改”由谁而来及谁经历转变
  choice: 保留“从他而来”以及圣言改变自身见解和思想的陈述
  alternative: 解释为他使别人悔改，或将圣言的改变弱化为单纯的情绪变化
  rationale: 见证文本明确把转变与圣言自身的思想变化相连；不应为系统神学上的预设消解这种张力。
- issue: 被记念与回归之间的关系
  choice: 直译为“他自己先被记念了”，使他因此想起先存者
  alternative: 明确补出是父记念他，或解释为神圣预知
  rationale: 原见证未明确记念者，保留被动式的开放性。
- issue: “前一类”与“另一类”所指群体
  choice: 保留较宽泛的“前一类存在者／另一类”
  alternative: 将其明确指定为肖像、力量、流溢物或某类灵体
  rationale: 段落中的代词链条不稳定，直接指定会过度解释。
- issue: “善意”归属
  choice: 按校补标志译为属于<那一位>，并保留尖括号
  alternative: 明确归于圣言或那些力量
  rationale: 底本见证本身有校补和句法困难，标示不确定性比静默定论更忠实。
