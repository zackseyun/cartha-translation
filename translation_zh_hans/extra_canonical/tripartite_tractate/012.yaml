translation:
  language: zh_hans
  text: '然而，他成了一个<帮助者>，把他们从自己的见解和悖逆中救赎出来，因为那称为“悔改”的转变是从他而来的。[a] 这事发生在圣言[改变]了自己的见解和思想之时。他转离邪恶，转向美善之事。转变以后，他想起了那些存在者，也想起了那为借着美善使自己转变之人所作的祷告。[b] 他先向那住在圆满境界中的一位祷告，并记念他；随后记念他的弟兄们，既逐一记念，也同时把他们全体一同记念；但在他们所有人以先，他记念父。


    [缺文] 同心合意的祷告帮助他回归<自己>，归向全体；因为使他想起那些从起初就存在者的，是他自己先被记念了。那是从远方呼唤的遥远思想，使他回转。


    他的全部祷告和记念包含若干力量；这些力量与前面所说的界限一致，因为他思想中的一切都不是不结果实的。这些力量是美善的，也比那些肖像的力量更大，因为肖像的力量也属于一种[黑暗的]本性。[c] 它们之所以成为那样，起源于一种关乎相似的幻觉和骄傲的[虚妄思想]，也起源于一种先认识它们的[思想]。前一类存在者像什么呢？它们像<遗忘>和沉睡，仿佛做噩梦的人，在梦中有<某人>追赶、搅扰他们。对他而言，另一类却像蒙光照、等候日出之物，因为它们在他里面看见的梦确实甜美。


    立刻，[缺文] 思想所流溢出来的事物<止息了>，不再有任何实质，也不再有任何尊荣，[因为]<它们>与那些先存者并不相等。即使它们高于[那些]肖像，它们之所以被抬举在肖像之上，唯一的原因也是它们出于善意而行动；因为它们并非源自在后来产生的软弱。这善意属于<那一位>：他祷告以后，把自己提升到美善那里，寻求那先存者。[d] 他在它们里面播下寻求并向那荣耀的先存者祷告的倾向，也在它们里面播下思考[它]的能力，以及这样的思想能力：在它们存在以前，已经有某种比它们更伟大的存在，尽管它们并不知道那是什么。那思想生出和谐与彼此相爱，使它们行事合一、同心，因为它们的存在本来就是从合一与同心而来的。'
