  register: 采用现代、庄重而可读的简体中文；对“圣言、圆满境界、全体、先存者、流溢”等反复概念保持术语一致。正文保留尖括号和方括号的文献标志，并用脚注解释。由于科普特语直接审校尚未完成，本稿不掩饰代词、群体指称和宇宙论术语上的不确定性。
