base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/013.yaml
  text: 'The others had a stronger lust for control because they were more honorable [] than the former ones, who had risen up against them. They refused to humble themselves, thinking that they had originated from themselves and had no beginning, and, as for giving birth, that they were the first to give birth to others. The two orders warred against each other, battling for control because of their way of being. As a result, they were flooded with powers and natures that typify mutual combat, possessing lust for control and everything else like it. From these things, empty love of glory drove them to desire control, although not one of them possessed the exalted thought or recognized it.


    The forces of this thought were prepared with the <names> of the pre-existent <ones>, whose representations they are. The order of those of this kind had harmony among themselves. They, however, battled against the order of those of the likeness, while the order of those of the likeness waged war against the likenesses and acted against them in its fury. [] From this it [took place ... their] own [against] each other, many [. . .] necessity positioned them [. . .] so they could prevail [. . .] he did not cease [. . .] and their envy and [their] fury and violence and lust and ignorance succeeded, producing diverse kinds of matter and powers of different kinds, intermixed in great numbers. Meanwhile, the Word, who caused them to be begotten, was awaiting in his mind a revelation of the [hope] that was to come to him from above.


    As the Word roused himself, he received hope and expectation for the Exalted One. As for those of the shadow, he distanced himself from them completely because they warred against him and did not humble themselves before him in the least. But he found rest in those who belonged to memory. As for those who came into being through memory, the Word produced, in an unseen manner and in agreement with their nature, the one who ascended on high, remembering the one who had been deficient, until the light shone on him from above, bestowing life, begotten by the thought of brotherly love among the pre-existent Fullnesses.'
translation:
  language: zh_hans
  text: '另一些对权势的贪欲更为强烈，因为他们比先前那些起来反抗他们的更为尊贵〔缺文〕[a]。先前那些不肯自卑，认定自己由自己而出、没有开端；至于生育，他们又认定自己最先产生了其他众者。两个等级彼此交战，因各自的存在方式而争夺权势。结果，象征相互争斗局面的种种力量和本性淹没了他们；这些力量和本性带着对权势的贪欲，以及一切与此相类的东西。由此，空洞的虚荣心驱使他们贪求权势；然而，他们中没有一个具有那崇高的思想，也没有一个认识它。


    这思想的众力量，连同先存者的〈名字〉[b]一同得了预备；他们就是那些先存者的表象。这一类所构成的等级彼此和谐。然而，他们与“相似者”的等级争战；“相似者”的等级则向那些相似形象开战，在狂怒中攻击他们。〔缺文〕由此，[事情发生了……他们]自己[彼此敌对]，许多〔缺文〕；必然把他们安置〔缺文〕，使他们能够得胜〔缺文〕；他不住地〔缺文〕。他们的嫉妒、[他们的]狂怒、暴力、贪欲和无知得了势，产生出各种物质和不同种类的力量，数量繁多，彼此混杂。与此同时，使他们得以产生的道[c]，心里正等候那将从上面临到他的[盼望]显明出来[d]。


    道振作起来时，便得着了对至高者的盼望和期待。至于那些属于阴影的，他与他们完全疏远，因为他们与他争战，丝毫不肯在他面前自卑；但他在那些属于记忆的之中得了安息。至于那些借着记忆而产生的，道照着他们的本性，以不可见的方式产生了那位升上高处者；这位记念那曾有缺欠者，直到光从上面照耀他，赐给他生命。这光是由先存的诸圆满者之间弟兄之爱的思想所生。[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “〔缺文〕”表示所据见证在此有残缺，无法确定遗漏内容。
    reason: 保存手稿残缺这一文本信号，避免把断裂处误当作连贯原文。
  - marker: b
    text: 尖括号表示“名字”是校订者补出的复原文字，并非现存文本中完整可读的词。
    reason: 保存见证中的编辑性复原标记。
  - marker: c
    text: “道”对应见证中的 the Word，通常可理解为“逻各斯”；此处不预先限定其确切位格或宇宙论身份。
    reason: 帮助普通读者理解术语，同时避免加入宗派性认定。
  - marker: d
    text: 方括号中的“盼望”是见证所标示的复原读法；本段多处残缺，句子之间的确切关系不明。
    reason: 标明词语及上下文的不确定性。
  - marker: e
    text: 末句的语法关系有歧义：“由……思想所生”也可能修饰“生命”或前述那位，而不一定修饰“光”。
    reason: 保留原见证中真实的句法和神学张力，不以中文句序静默消除歧义。
lexical_decisions:
- source_word: lust for control
  choice: 对权势的贪欲／贪求权势
  rationale: 保留“贪欲”所表达的失序欲望，并以“权势”涵盖控制、支配和统治之意；按句法变化避免中文生硬重复。
- source_word: orders
  choice: 等级
  rationale: 此处指彼此对立、具有组织和位阶性质的群体；“等级”比“秩序”更能指称这些群体，同时保留层级意味。
- source_word: the exalted thought
  choice: 那崇高的思想
  rationale: 不将其解释为智慧、意念或某一特定神格，以保留原见证中的抽象性与可能的人格化张力。
- source_word: representations / likeness / likenesses
  choice: 表象／相似者／相似形象
  rationale: 尽量维持见证中几个相关而不完全相同的表达，避免全部归并为“形象”而抹平论述层次；原科普特语复核后仍可能调整。
- source_word: the Word
  choice: 道
  rationale: 采用现代汉语宗教与哲学语境中可理解的 Logos 对应词，同时不在正文中额外限定其身份。
- source_word: memory
  choice: 记忆
  rationale: 按见证直译，保留其可能兼具领域、群体或拟人格力量的含混性。
- source_word: the Exalted One
  choice: 至高者
  rationale: 作为称号处理，不擅自认定其与其他神学称谓完全等同。
- source_word: Fullnesses
  choice: 诸圆满者
  rationale: 保留复数及实体化色彩，避免直接扩展成未经文本明说的完整宇宙论术语。
theological_decisions:
- issue: “道”与众受生者的因果关系
  choice: 译作“使他们得以产生的道”
  alternative: “生出他们的道”或“导致他们被生出的道”
  rationale: 保留道在其产生中的主动因果作用，同时避免在科普特语尚未复核时过度确定其究竟是亲自生育还是间接致成。
- issue: 末句中“所生”的主语与修饰关系
  choice: 以“这光”承接“所生”
  alternative: 让“生命”或“那位升上高处者”成为所生者
  rationale: 英语见证的分词附着关系存在歧义；正文采用较自然的就近承接，但以脚注明确其他语法可能。
- issue: “那位升上高处者”与“那曾有缺欠者”的身份关系
  choice: 维持为两个不同指称，不作同一化
  alternative: 将二者理解为同一位
  rationale: 见证分别使用“the one who ascended”和“the one who had been deficient”；不以解释性译法消除其关系上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。文本涉及诺斯替式宇宙论术语时，优先保持术语间的区别、复数性及拟人格色彩，不导入特定宗派解释。因古代语言标注为科普特语、且直接源语复核尚待完成，本稿以所供公共领域英语见证为审慎底本；所有缺文、推补和重要句法歧义均显式保留。
